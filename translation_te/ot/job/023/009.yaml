  text: שְׂמֹ֣אול בַּ/עֲשֹׂת֣/וֹ וְ/לֹא אָ֑חַז יַעְטֹ֥ף יָ֝מִ֗ין וְ/לֹ֣א אֶרְאֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/023/009.yaml
  text: On the left[a], when he is at work, I do not perceive him; he turns to the right[b], and I do not see him.
translation:
  language: te
  text: ఆయన ఎడమ వైపున పనిచేస్తున్నప్పుడు, నేను ఆయనను గ్రహించలేను; ఆయన కుడి వైపున తనను కప్పుకుంటాడు[a], నేను ఆయనను చూడలేను.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆయన కుడి వైపుకు తిరుగుతాడు.” హీబ్రూ క్రియకు “కప్పుకోవడం, చుట్టుకోవడం” అనే అర్థం ఉంది; ఇక్కడ తనను కనబడకుండా కప్పుకోవడం లేదా ఒక వైపుకు తిరగడం అనే భావం ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో “ఎడమ,” “కుడి” అనే పదాలు ఉన్నాయి. కొన్ని సందర్భాల్లో అవి వరుసగా ఉత్తరం, దక్షిణం అనే దిక్కులను కూడా సూచించవచ్చు; ఇక్కడ కవితాత్మక స్థల వ్యత్యాసం నిలుపబడింది.
    reason: cultural_note
lexical_decisions:
- source_word: שְׂמֹאול
  choice: ఎడమ వైపున
  rationale: ప్రాథమిక అర్థమైన ‘ఎడమ’ను నిలుపుతూ, יָמִין (‘కుడి’)తో ఉన్న కవితాత్మక స్థల వ్యత్యాసాన్ని సంరక్షిస్తుంది; ‘ఉత్తరం’ అని మార్చదు.
- source_word: בַּעֲשֹׂתוֹ
  choice: ఆయన ... పనిచేస్తున్నప్పుడు
  rationale: ב + עשה క్రియార్థక నామరూపం కాలసూచకంగా ‘ఆయన చేస్తున్నప్పుడు/పనిచేస్తున్నప్పుడు’ అనే భావాన్ని ఇస్తుంది.
- source_word: אָחַז
  choice: నేను ఆయనను గ్రహించలేను
  rationale: మూల క్రియకు ‘పట్టుకోవడం’ అనే స్పష్టార్థం ఉన్నా, ఇక్కడ దేవుణ్ణి అందుకోలేకపోవడం లేదా గుర్తించలేకపోవడం అనే భావం ఉంది; ‘గ్రహించలేను’ ఈ సందర్భార్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: יַעְטֹף
  choice: తనను కప్పుకుంటాడు
  rationale: עטף యొక్క సాధారణ అర్థమైన ‘కప్పుకోవడం/చుట్టుకోవడం’ను నిలుపుతుంది. ‘తిరుగుతాడు’ అనే వ్యాఖ్యానాత్మక పరిష్కారాన్ని ప్రధాన పాఠ్యంలోకి తేవకుండా క్లిష్టతను సంరక్షిస్తుంది.
- source_word: יָמִין
  choice: కుడి వైపున
  rationale: שְׂמֹאול (‘ఎడమ’)తో ఉన్న సమాంతర స్థల వ్యత్యాసాన్ని నిలుపుతుంది; సాధ్యమైన ‘దక్షిణం’ అనే దిక్సూచక భావాన్ని పాదసూచికలో తెలియజేస్తుంది.
- source_word: אֶרְאֶה
  choice: నేను ఆయనను చూడలేను
  rationale: ראה యొక్క నేర అర్థమైన ‘చూడటం’ను సహజమైన తెలుగులో నిలుపుతుంది; కర్మను సందర్భం నుండి స్పష్టంగా అందిస్తుంది.
theological_decisions:
- issue: మూడవ పురుష క్రియలు, సర్వనామ ప్రత్యయాలు ఎవరిని సూచిస్తున్నాయి?
  choice: సమీప సందర్భం ఆధారంగా దేవుణ్ణి సూచించే ‘ఆయన’
  alternative: పేరు చెప్పని ఒక పురుషుడు
  rationale: ఈ వచనంలో దేవుడు నేరుగా పేర్కొనబడకపోయినా, యోబు 23:8–10లో యోబు వెదుకుతున్నది దేవుణ్ణే. ‘ఆయన’ అని అనువదించడం సందర్భానికి నమ్మకంగా ఉంటుంది; అదనపు సిద్ధాంతాన్ని చేర్చదు.
- issue: יַעְטֹף యొక్క క్లిష్ట భావం
  choice: ఆయన కుడి వైపున తనను కప్పుకుంటాడు
  alternative: ఆయన కుడి వైపుకు తిరుగుతాడు / అక్కడ తనను దాచుకుంటాడు
  rationale: మూల క్రియలోని ‘కప్పుకోవడం’ భావాన్ని ప్రధాన పాఠ్యంలో ఉంచి, దేవుడు ఉద్దేశపూర్వకంగా దాగుతున్నాడనే భావాన్ని మరీ నిర్దిష్టంగా విధించకుండా మూలంలోని అస్పష్టతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘గ్రహించలేను’ అనేది భౌతికంగా పట్టుకోలేకపోవడం మరియు అవగాహన/గుర్తింపుకు అందకపోవడం మధ్యనున్న సందర్భార్థాన్ని వ్యక్తం చేస్తుంది. ప్రతి పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో చేర్చబడింది.
