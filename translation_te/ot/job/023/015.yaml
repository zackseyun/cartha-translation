  yaml_path: translation/ot/job/023/015.yaml
  text: Therefore I am terrified before him[a]; when I consider[b], I am afraid of him.
translation:
  language: te
  text: కాబట్టి ఆయన సన్నిధిలో నేను భయభ్రాంతుడనై ఉన్నాను[a]; నేను ఆలోచించినప్పుడు[b], ఆయనకు భయపడుతున్నాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఆయన ఎదుట” లేదా “ఆయన కారణంగా.” హెబ్రీ పదబంధం అక్షరార్థంగా “ఆయన ముఖము/సన్నిధి నుండి” అనే భావాన్ని కలిగి ఉంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా “నేను మననం చేసినప్పుడు,” “నేను ధ్యానించినప్పుడు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: కాబట్టి
  rationale: ముందున్న సందర్భం నుంచి వచ్చే నిర్ధారణను సహజమైన ఆధునిక తెలుగులో స్పష్టంగా సూచిస్తుంది.
- source_word: מִפָּנָיו
  choice: ఆయన సన్నిధిలో
  rationale: మూలంలోని ‘ఆయన ముఖము/సన్నిధి నుండి’ అనే రూపకాన్ని సాధ్యమైనంతవరకు నిలుపుతూ, దేవుని సమక్షంలో యోబు పొందిన తీవ్ర కలవరాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אֶבָּהֵל
  choice: నేను భయభ్రాంతుడనవుతున్నాను
  rationale: בהל నిఫల్ రూపంలోని తీవ్ర కలవరం, దిగ్భ్రాంతి, భయాన్ని బలహీనపరచకుండా తెలుగులో తెలియజేస్తుంది.
- source_word: אֶתְבּוֹנֵן
  choice: నేను ఆలోచించినప్పుడు
  rationale: בין యొక్క ఈ రూపం సూచించే పరిశీలనాత్మక ఆలోచనను సహజంగా తెలియజేసి, తదనంతర భయంతో ఉన్న భావసంబంధాన్ని నిలుపుతుంది.
- source_word: וְאֶפְחַד
  choice: భయపడుతున్నాను
  rationale: פחד యొక్క సూటి భయార్థాన్ని ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: מִמֶּנּוּ
  choice: ఆయనకు
  rationale: పחדతో కూడిన מן‌ను తెలుగు వాడుకలో సహజమైన ‘ఆయనకు భయపడుతున్నాను’గా అందిస్తుంది.
theological_decisions:
- issue: పుంలింగ ఏకవచన ప్రత్యయాల సూచిత వ్యక్తి
  choice: మూలంలోని సర్వనామ రూపాన్ని అనుసరించి ‘ఆయన’ అని అనువదించడం
  alternative: పాఠ్యంలో నేరుగా ‘దేవుడు’ అని చేర్చడం
  rationale: సందర్భంలో సూచిత వ్యక్తి దేవుడని స్పష్టమైనప్పటికీ, హెబ్రీ పాఠ్యంలో దైవనామం లేదా బిరుదు లేదు; ‘ఆయన’ అనడం మూల వాక్యప్రవాహాన్ని కాపాడుతుంది.
- issue: దేవుని ఎదుట యోబు అనుభవించిన భయ తీవ్రత
  choice: ‘భయభ్రాంతుడనవుతున్నాను ... భయపడుతున్నాను’ అనే బలమైన భాషను ఉంచడం
  alternative: ‘కలవరపడుతున్నాను’ లేదా ‘భక్తిభయం కలుగుతోంది’ వంటి మృదువైన పదాలు
  rationale: వాక్యం నిజమైన భయాన్నే వ్యక్తం చేస్తుంది; దాన్ని కేవలం భక్తిపూర్వక విస్మయంగా మార్చకుండా మూలంలోని ఉద్రిక్తతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘సన్నిధిలో’ మూలంలోని పָּנִים భావాన్ని నిలుపుతుంది; ‘భయభ్రాంతుడనవుతున్నాను’ మరియు ‘భయపడుతున్నాను’ మధ్య తీవ్రతా సమాంతరతను కాపాడుతూ యోబు అనుభవాన్ని మృదువుచేయదు.
