  yaml_path: translation/ot/job/023/006.yaml
  text: Would he contend with me in the greatness of his power? No[a]; surely he would pay attention to me.
translation:
  language: te
  text: తన మహా బలంతో ఆయన నాతో వాదనకు దిగుతాడా? లేదు; ఆయన తప్పకుండా నా పట్ల శ్రద్ధ చూపుతాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆయన తన మనసును నాపై నిలిపేవాడు”; లేదా బహుశా, “ఆయన నాలో బలం ఉంచేవాడు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַ/בְּ/רָב כֹּחַ
  choice: తన మహా బలంతో
  rationale: ప్రశ్నార్థక రూపంతో కూడిన בְּרָב כֹּחַ దేవుడు తన అపార శక్తిని ఆధారంగా చేసుకొని యోబుతో వాదిస్తాడా అనే భావాన్ని ఇస్తుంది. ‘తన మహా బలంతో’ అనేది రֹב/רַב లోని గొప్పతనాన్ని, כֹּחַ లోని బలాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: יָרִיב עִמָּדִי
  choice: ఆయన నాతో వాదనకు దిగుతాడా?
  rationale: ריב పదానికి ఈ సందర్భంలో న్యాయవిచారణ సంబంధమైన వాదన భావం ఉంది. ‘వాదనకు దిగు’ అనే ప్రయోగం ఆ ప్రతివాద భావాన్ని సాధారణ పాఠకులకు అర్థమయ్యేలా తెలియజేస్తుంది; అతిగా న్యాయసాంకేతిక పదజాలాన్ని నివారిస్తుంది.
- source_word: לֹא אַךְ
  choice: లేదు; ... తప్పకుండా
  rationale: לֹא ముందరి అవకాశాన్ని బలంగా నిరాకరిస్తుంది; אַךְ తరువాతి వాక్యాన్ని నొక్కి చెబుతుంది. ‘లేదు; ... తప్పకుండా’ అనే రూపం ఈ నిరాకరణ-ఉద్ఘాటన మలుపును స్పష్టంగా నిలుపుతుంది.
- source_word: יָשִׂם בִּי
  choice: నా పట్ల శ్రద్ధ చూపుతాడు
  rationale: שׂים + ב ఒకరి మీద మనసు లేదా శ్రద్ధ నిలపడం అనే భావాన్ని ఇవ్వగలదు. యోబు దేవుని ఎదుట తన వాదన వినిపించాలని కోరుతున్న న్యాయవిచారణ సందర్భంలో ‘నా పట్ల శ్రద్ధ చూపుతాడు’ సహజంగా సరిపోతుంది. అయితే ‘నాలో బలం ఉంచుతాడు’ అనే అర్థసాధ్యతను పాదసూచికలో నిలిపాం.
theological_decisions:
- issue: రెండవ పాదంలో దేవుని చర్య యొక్క భావం
  choice: దేవుడు తన బలంతో యోబును అణచివేయకుండా అతని పట్ల శ్రద్ధ చూపుతాడని యోబు నమ్మకం వ్యక్తం చేస్తున్నాడు.
  alternative: దేవుడు యోబులో బలం ఉంచుతాడు; లేదా సాధారణంగా తన మనసును యోబుపై నిలుపుతాడు.
  rationale: 'యోబు 23:3–7లోని తక్షణ సందర్భం న్యాయవిచారణకు సంబంధించినది: యోబు దేవుని ఎదుట తన వాదనను ఉంచాలని కోరుతున్నాడు. కాబట్టి దేవుడు యోబుకు శక్తినిస్తాడనే భావం కంటే అతని పట్ల శ్రద్ధ చూపి అతని వాదనను ఆలకిస్తాడనే భావం సందర్భానికి మెరుగ్గా సరిపోతుంది. అయినప్పటికీ హెబ్రీ పదబంధంలోని నిజమైన అస్పష్టతను పాదసూచికలో ఉంచాం.'
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. న్యాయవిచారణ నేపథ్యాన్ని ‘వాదనకు దిగు’ ద్వారా సూచించాం; పాతకాలపు లేదా అతిగా సాంకేతిక న్యాయపదజాలాన్ని నివారించాం.
