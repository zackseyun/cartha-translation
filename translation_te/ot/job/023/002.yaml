  text: Even today my complaint is rebellious[b][a]; my hand is heavy because of my groaning.
translation:
  language: te
  text: ఈ రోజుకూడా నా ఫిర్యాదు ధిక్కారమే[a]; నా మూలుగుపై నా చెయ్యి భారంగా ఉంది[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నా ఫిర్యాదు చేదుగానే ఉంది.” హీబ్రూ పదాన్ని సందర్భానుసారంగా కొందరు ఇలా మృదువుగా అర్థం చేసుకుంటారు; అయితే దాని మరింత ప్రత్యక్షమైన అర్థం “తిరుగుబాటు” లేదా “ధిక్కారం.”
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ అక్షరార్థంగా, “నా మూలుగుపై నా చెయ్యి భారంగా ఉంది.” కొందరు “చెయ్యి”ని అణచివేయబడిన లేదా భారమైన వ్యక్తీకరణకు రూపకంగా అర్థం చేసుకుంటారు; మరికొందరు పాఠాన్ని “ఆయన చెయ్యి” అని సవరిస్తారు.
    reason: alternative_reading
lexical_decisions:
- source_word: גַּם הַיּוֹם
  choice: ఈ రోజు కూడా
  rationale: కాలసంబంధమైన కొనసాగింపును, యోబు స్థితి ఇప్పటికీ మారలేదనే ఉద్ఘాటనను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: מְרִי
  choice: తిరుగుబాటుగానే ఉంది
  rationale: ఈ నామవాచకానికి ప్రధానంగా తిరుగుబాటు లేదా ధిక్కారం అనే బలమైన భావం ఉంది. సందర్భాన్ని బట్టి ‘చేదుగా ఉంది’ అని మృదువుగా అనువదించవచ్చు; అయితే మూలంలోని పదునైన భావాన్ని ప్రధాన పాఠంలో నిలిపాం.
- source_word: שִׂיחִי
  choice: నా ఫిర్యాదు
  rationale: ఈ పదం మాట, ధ్యానం, మనోవేదనతో కూడిన విన్నపం అనే అర్థాలు ఇవ్వగలదు. మూలుగుతో ఉన్న సమాంతరతను బట్టి ‘ఫిర్యాదు’ సందర్భానికి సరిపోతుంది.
- source_word: יָדִי
  choice: నా చెయ్యి
  rationale: మసొరా పాఠంలోని ప్రథమ పురుష ఏకవచన ప్రత్యయాన్ని నేరుగా నిలుపుతుంది. దీనిని అలంకారార్థంగా గ్రహించే లేదా ‘ఆయన చెయ్యి’గా పాఠసవరణ చేసే అభిప్రాయాలను ప్రధాన పాఠంలోకి తీసుకురాలేదు.
- source_word: כָּבְדָה
  choice: భారంగా ఉంది
  rationale: క్రియలోని బరువు లేదా భారస్థితి భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: עַל אַנְחָתִי
  choice: నా మూలుగుపై
  rationale: עַל అనే విస్తృత సంబంధార్థక విభక్తి భావాన్ని ‘పై’ అని సమీపంగా నిలిపి, అస్పష్టమైన సంబంధాన్ని అనవసరంగా కారణార్థానికి పరిమితం చేయలేదు.
theological_decisions:
- issue: యోబు మాటలు పాపపూరిత ధిక్కారంగా వినిపించకుండా ‘చేదు’ అని మృదువుపరచాలా?
  choice: ప్రధాన పాఠంలో ‘తిరుగుబాటుగానే ఉంది’ అని బలమైన భావాన్ని నిలపడం
  alternative: ‘నా ఫిర్యాదు చేదుగానే ఉంది’
  rationale: మూలపదం తిరుగుబాటు లేదా ధిక్కారాన్ని మరింత నేరుగా సూచిస్తుంది. నీతిమంతుని బాధలోనుంచి వచ్చే మాటలలో ఉన్న వేదాంతపరమైన ఉద్రిక్తతను అనువాదం ముందుగానే పరిష్కరించకూడదు.
- issue: ‘నా చెయ్యి’ అనే క్లిష్టమైన వ్యక్తీకరణను అర్థవివరణతో భర్తీ చేయాలా లేదా ‘ఆయన చెయ్యి’గా సవరించాలా?
  choice: మసొరా పాఠానుసారం ‘నా చెయ్యి’ని నిలపడం
  alternative: ‘ఆయన చెయ్యి నా మూలుగుపై భారంగా ఉంది’ లేదా నిగ్రహించబడిన/భారమైన వ్యక్తీకరణగా వివరణాత్మక అనువాదం
  rationale: మూలపాఠం మొదటి పురుషాన్ని స్పష్టంగా ఇస్తుంది; దాని క్లిష్టతను పాదసూచికలో తెలియజేయడం పాఠాన్ని ఊహాత్మకంగా సవరించడంకంటే సముచితం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. ‘తిరుగుబాటు’ అనే పదం మూలంలోని పదునును నిలుపుతుంది; రెండో అర్ధవాక్యంలోని అసాధారణ రూపకాన్ని వివరణతో సాఫీ చేయకుండా పాఠంలో ఉంచి పాదసూచికలో ప్రత్యామ్నాయాలను తెలిపాం.
