revisions:
- from: భయాలు అతన్ని నలువైపులా బెదరగొడతాయి; అతని పాదాల దగ్గరే[a] అతన్ని చెదరగొడతాయి.
  to: భయాలు అతన్ని చుట్టూ భయపెడతాయి; అతని అడుగడుగునా[a] అతన్ని చెదరగొడతాయి.
  rationale: The revision removes added emphasis, improves modern Telugu fluency, and expresses the likely contextual force of the final prepositional phrase. The footnote preserves the literal Hebrew wording and the viable alternative 'at his heels,' thereby retaining the textual ambiguity.
