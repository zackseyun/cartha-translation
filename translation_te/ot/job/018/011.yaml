  text: סָ֭בִיב בִּֽעֲתֻ֣/הוּ בַלָּה֑וֹת וֶ/הֱפִיצֻ֥/הוּ לְ/רַגְלָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/job/018/011.yaml
  text: Terrors frighten him on every side[a], and scatter him at his feet.
translation:
  language: te
  text: భయాలు అతన్ని చుట్టూ భయపెడతాయి; అతని అడుగడుగునా[a] అతన్ని చెదరగొడతాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “అతని పాదాల వద్ద/వైపు.” లేదా, “అతని మడమల వెంట.” అతడు ఎక్కడ అడుగు వేసినా భయాలు అతన్ని తరుముతున్నాయనే భావం ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: סָבִיב
  choice: నలువైపులా
  rationale: అన్ని దిక్కుల నుంచీ చుట్టుముట్టడాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: בִּעֲתֻהוּ
  choice: అతన్ని ... బెదరగొడతాయి
  rationale: בעת ధాతువులోని తీవ్రంగా భయపెట్టే లేదా హఠాత్తుగా కలవరపెట్టే భావాన్ని, కవితాత్మక సందర్భానికి సరిపోయే విధంగా వ్యక్తం చేస్తుంది.
- source_word: בַלָּהוֹת
  choice: భయాలు
  rationale: ఆకస్మిక భీతులను లేదా భయంకరమైన వాటిని సూచించే బహువచన నామవాచకానికి సూటిగా, సాధారణ పాఠకులకు అర్థమయ్యే సమానార్థకం.
- source_word: וֶהֱפִיצֻהוּ
  choice: అతన్ని చెదరగొడతాయి
  rationale: చెదరగొట్టడం లేదా చెల్లాచెదురు చేయడం అనే కారణార్థక చిత్రాన్ని నిలుపుతుంది; భయాలు అతన్ని తరిమే భావాన్ని పూర్తిగా వివరణాత్మకంగా మార్చదు.
- source_word: לְרַגְלָיו
  choice: అతని పాదాల దగ్గరే
  rationale: అక్షరార్థమైన ‘అతని పాదాల వద్ద/వైపు’ అనే చిత్రాన్ని నిలుపుతూ, తెలుగులో సహజంగా వినిపిస్తుంది. సందర్భంలో ‘అతని అడుగడుగునా’ లేదా ‘అతని మడమల వెంట’ అనే భావం ఉండవచ్చని పాదటిప్పణి తెలియజేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; జ్ఞానసాహిత్య కవిత్వానికి తగిన గంభీరతతో పాటు సాధారణ పాఠకులకు స్పష్టంగా ఉండే పదప్రయోగం. హీబ్రూ వాక్యంలోని చుట్టుముట్టే భయాలు, పాదాల దగ్గర చెదరగొట్టడం అనే చిత్రాలను నిలుపుకుంది.
