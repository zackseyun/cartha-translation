    reason: lexical_alternative
  revision_rationale: The revision removes added emphasis, improves modern Telugu fluency, and expresses the likely contextual force of the final prepositional phrase. The footnote preserves the literal Hebrew wording and the viable alternative 'at his heels,' thereby retaining the textual ambiguity.
