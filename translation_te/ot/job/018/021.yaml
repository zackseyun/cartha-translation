source:
  edition: WLC
  text: אַךְ אֵ֭לֶּה מִשְׁכְּנ֣וֹת עַוָּ֑ל וְ֝/זֶ֗ה מְק֣וֹם לֹא יָדַֽע אֵֽל־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/job/018/021.yaml
  text: Surely these are the dwellings of the unjust[b][a], and this is the place of one who does not know God.
translation:
  language: te
  text: నిశ్చయంగా, అన్యాయం చేసేవాని నివాసాలు ఇవే[a]; దేవుణ్ణి ఎరుగని వాని స్థలం ఇదే[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దుష్టుని.’
    reason: lexical_alternative
  - marker: b
    text: మూలంలో ‘వాని’ అనే పదం స్పష్టంగా లేదు; సందర్భం వల్ల అది భావంలో ఉంది.
    reason: source_clarity
lexical_decisions:
- source_word: אַךְ
  choice: నిశ్చయంగా
  rationale: బిల్దదు మాటలను ముగించే ఈ సందర్భంలో ఇది పరిమితిని సూచించే ‘మాత్రమే’ అనే భావం కాక, నొక్కిచెప్పే భావాన్ని ఇస్తుంది.
- source_word: מִשְׁכְּנוֹת
  choice: నివాసాలు
  rationale: ఈ బహువచన నామవాచకం సాధారణంగా నివసించే స్థలాలను సూచిస్తుంది; ‘గుడారాలు’ అని మరీ నిర్దిష్టం చేయకుండా మూలంలోని విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: עַוָּל
  choice: అన్యాయం చేసేవాడు
  rationale: ఈ పదం అన్యాయం లేదా దుష్కార్యం చేసే వ్యక్తిని సూచిస్తుంది. ‘అన్యాయం చేసేవాడు’ దాని నైతిక-న్యాయ భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: מְקוֹם
  choice: స్థలం
  rationale: మూలపదానికి నేరమైన అర్థం; ముందున్న ‘నివాసాలు’తో సమాంతరతను ఉంచుతూ అనవసర విస్తరణను నివారిస్తుంది.
- source_word: לֹא יָדַע אֵל
  choice: దేవుణ్ణి ఎరుగని వాడు
  rationale: మూలంలోని ‘దేవుణ్ణి ఎరుగడు’ అనే వాక్యభాగాన్ని వ్యక్తిని విశేషించే సహజ తెలుగు రూపంలో అందిస్తుంది; ‘ఎరుగుట’ కేవలం సమాచారం కలిగి ఉండటం కంటే సంబంధాత్మక భావాన్నీ మోయగలదు.
- source_word: אֵל
  choice: దేవుడు
  rationale: యోబు గ్రంథంలోని ఈ సందర్భంలో ఈ పదం నిజమైన దేవుణ్ణే సూచిస్తుంది; అదనపు బిరుదును చేర్చకుండా సాధారణ తెలుగు రూపాన్ని వాడాం.
theological_decisions:
- issue: ‘దేవుణ్ణి ఎరుగని’ అనే మాట భావం
  choice: ‘దేవుణ్ణి ఎరుగని’ అనే మూలానికి దగ్గరైన పదబంధాన్ని అలాగే ఉంచడం
  alternative: దేవుని గురించి తెలియని / దేవుణ్ణి అంగీకరించని
  rationale: ఇక్కడ ‘ఎరుగుట’ అనేది కేవలం దేవుని ఉనికి గురించి సమాచారం లేకపోవడమే కాక, ఆయనను గుర్తించి ఆయనతో సరైన సంబంధంలో ఉండడాన్నీ సూచించవచ్చు. అనువాదం ఆ భావాన్ని సిద్ధాంతపరంగా విప్పి చెప్పకుండా మూలంలోని ఉద్వేగాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గంభీరంగా ఉండే వాక్యనిర్మాణం వాడాం. ‘ఎరుగని’ కొంత సాహిత్య గౌరవాన్ని కలిగి ఉన్నప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే పదం; అంతేకాక ‘తెలియని’ కంటే సంబంధాత్మక భావాన్ని మెరుగ్గా నిలుపుతుంది.
