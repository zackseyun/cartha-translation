translation:
  language: te
  text: బోను అతని మడమను పట్టుకుంటుంది[a]; ఉచ్చు అతన్ని గట్టిగా పట్టి ఉంచుతుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “బోను అతన్ని మడమ వద్ద పట్టుకుంటుంది; పాశం అతన్ని గట్టిగా పట్టుకుంటుంది.” చివరి నామవాచకం అరుదైనది; అది ఒక ప్రత్యేకమైన ఉచ్చును లేదా పాశాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹאחֵז
  choice: పట్టుకుంటుంది
  rationale: అחז అనే క్రియకు ‘పట్టుకోవడం, స్వాధీనంలోకి తీసుకోవడం’ అనే భావం ఉంది. బోను మడమను పట్టుకునే సజీవమైన కవితాత్మక చిత్రాన్ని ఈ పదం సహజంగా నిలుపుతుంది.
- source_word: בְּעָקֵב
  choice: అతని మడమను
  rationale: עָקֵב అంటే ‘మడమ.’ తెలుగులో పట్టుబడిన శరీరభాగాన్ని కర్మగా చెప్పడం సహజం; అందువల్ల ב అనే ఉపసర్గ తెలిపే స్థానం/పట్టుబడిన భాగం భావం ‘మడమను’ అని వ్యక్తమైంది.
- source_word: פָּח
  choice: బోను
  rationale: פָּח సాధారణంగా జంతువును లేదా మనిషిని పట్టుకునే బోను/ఉచ్చును సూచిస్తుంది. తరువాతి అరుదైన పదం నుండి భేదాన్ని నిలుపుటకు ఇక్కడ ‘బోను’ ఎంచుకోబడింది.
- source_word: יַחֲזֵק
  choice: గట్టిగా బంధిస్తుంది
  rationale: ఈ సందర్భంలో חזק యొక్క హిఫిల్ రూపం గట్టి పట్టు సాధించడం లేదా విడిపోనివ్వకుండా పట్టి ఉంచడం అనే భావాన్ని ఇస్తుంది. ‘గట్టిగా బంధిస్తుంది’ ఆ బలాన్ని, మొదటి పాదంతో ఉన్న సమాంతరతను నిలుపుతుంది.
- source_word: עָלָיו
  choice: అతన్ని
  rationale: ఈ క్రియతో על + సర్వనామ ప్రత్యయం ఆ వ్యక్తిమీద జరిగే అదుపుచేసే చర్యను సూచిస్తుంది. తెలుగులో ‘అతన్ని ... బంధిస్తుంది’ సహజమైన కర్మ నిర్మాణం.
- source_word: צַמִּים
  choice: ఉచ్చు
  rationale: ఇది అరుదైన నామవాచకం; ఒక ప్రత్యేకమైన ఉచ్చు లేదా పాశాన్ని సూచిస్తుందని భావిస్తారు. అర్థాన్ని అతిగా నిర్దిష్టం చేయకుండా, פָּח‌కు భిన్నంగా ఉంచేందుకు ‘ఉచ్చు’ వాడబడింది.
