  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన కవితా సమాంతరతను నిలిపాం. బోను, ఉచ్చు అనే సాధారణ పదాలతో రెండు హెబ్రీ నామవాచకాల మధ్య భేదాన్ని చూపుతూ, అరుదైన చివరి పదంలోని అనిశ్చితిని పాదటిప్పణిలో సంరక్షించాం.
