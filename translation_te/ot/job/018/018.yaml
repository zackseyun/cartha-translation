  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కవితా శైలి. రెండు సమాంతర క్రియల బలాన్ని నిలుపుతూ, హీబ్రూ మూలంలోని నిర్దిష్టం కాని బహువచన కర్తను ‘వారు’గా అనువదించాం.
