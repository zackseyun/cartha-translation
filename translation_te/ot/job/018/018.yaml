source:
  edition: WLC
  text: יֶ֭הְדְּפֻ/הוּ מֵ/א֣וֹר אֶל חֹ֑שֶׁךְ וּֽ/מִ/תֵּבֵ֥ל יְנִדֻּֽ/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/018/018.yaml
  text: They drive him from light into darkness[b][a], and banish him from the world.
translation:
  language: te
  text: వారు అతన్ని వెలుగులోనుండి చీకటిలోకి తరిమివేస్తారు[a]; లోకంలోనుండి అతన్ని బహిష్కరిస్తారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘వారు అతన్ని వెలుగులోనుండి చీకటిలోకి తోసివేస్తారు.’
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ ‘లోకం’కు వాడిన హీబ్రూ పదం నివాసిత లోకాన్ని మరింత నిర్దిష్టంగా సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶהְדְּפֻהוּ
  choice: వారు అతన్ని … తరిమివేస్తారు
  rationale: Qal అపూర్ణ క్రియ, మూడవ పురుష బహువచనం, ఏకవచన కర్మప్రత్యయంతో ఉంది. కర్తను నిర్దిష్టం చేయకుండా ఉంచుతూ, బలవంతంగా తొలగించే భావాన్ని ‘తరిమివేస్తారు’ సహజంగా తెలియజేస్తుంది.
- source_word: מֵאוֹר
  choice: వెలుగులోనుండి
  rationale: מ వియోగాన్ని, אוֹר ‘వెలుగు’ను సూచిస్తున్నాయి. తెలుగు కవితాత్మక వాక్యంలో నిర్దిష్టతను అదనంగా చేర్చకుండా ‘వెలుగులోనుండి’ సహజంగా ఉంది.
- source_word: אֶל חֹשֶׁךְ
  choice: చీకటిలోకి
  rationale: אֶל దిశను సూచిస్తుంది; వెలుగు అనే పరిధి నుండి చీకటి అనే పరిధిలోకి కదలికను ‘చీకటిలోకి’ స్పష్టంగా నిలుపుతుంది.
- source_word: וּמִתֵּבֵל
  choice: లోకంలోనుండి
  rationale: תֵּבֵל సాధారణంగా లోకాన్ని, మరింత నిర్దిష్టంగా నివాసిత లోకాన్ని సూచించగలదు. ప్రధాన పాఠంలో సంక్షిప్తమైన, సహజమైన ‘లోకం’ ఎంచుకుని, విస్తృత భావాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: יְנִדֻּהוּ
  choice: అతన్ని బహిష్కరిస్తారు
  rationale: ఈ causative బహువచన రూపం తొలగించడం లేదా వెలివేయడం అనే భావాన్ని ఇస్తుంది. ‘బహిష్కరిస్తారు’ సామాజికంగా లోకం నుండి వెలివేయబడే బలమైన భావాన్ని నిలుపుతూ, మొదటి పాదంలోని ‘తరిమివేస్తారు’ను పునరావృతం చేయదు.
