source:
  edition: WLC
  text: עַד אָ֤נָה תְּשִׂימ֣וּ/ן קִנְצֵ֣י לְ/מִלִּ֑ין תָּ֝בִ֗ינוּ וְ/אַחַ֥ר נְדַבֵּֽר־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/018/002.yaml
  text: How long will you keep setting traps with words? Understand[b][a], and afterward we will speak.
translation:
  language: te
  text: మాటల కోసం ఉచ్చులు వేయడం మీరు ఇంకెంతకాలం కొనసాగిస్తారు?[a] గ్రహించండి; ఆ తర్వాత మేము మాట్లాడతాం.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మాటలకు ముగింపు (లేదా హద్దులు) పెట్టడం మీరు ఇంకెంతకాలం కొనసాగిస్తారు?” ఈ హీబ్రూ పదబంధం క్లిష్టమైనది; కొందరు దీన్ని మాటల కోసం ఉచ్చులు వేయడం గురించి కాకుండా, అంతం లేని మాటల గురించి చేసిన ఫిర్యాదుగా అర్థం చేసుకుంటారు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ఆ తర్వాత మనం మాట్లాడుకుందాం.” చివరి క్రియను సాధారణ భవిష్యత్తుగానే కాక, ఆహ్వానంగా కూడా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד־אָנָה
  choice: ఇంకెంతకాలం
  rationale: కాలవ్యవధిని ప్రశ్నించే ఈ హీబ్రూ నుడికారాన్ని సహజమైన ఆధునిక తెలుగులో చూపిస్తూ, బిల్దదు నిందతో అడిగిన ప్రశ్న బలాన్ని నిలుపుతుంది.
- source_word: תְּשִׂימוּן
  choice: పెట్టడం మీరు ... కొనసాగిస్తారు
  rationale: שׂים అనే క్రియకు ‘పెట్టు/నిలుపు’ అనే ప్రాథమిక భావం ఉంది. ప్రశ్నలోని కొనసాగుతున్న నిందాస్వరాన్ని తెలుగులో సహజంగా వ్యక్తం చేయడానికి ‘కొనసాగిస్తారు’ చేర్చబడింది; ఇది క్రియకు కొత్త ప్రత్యేకార్థం ఇవ్వదు.
- source_word: קִנְצֵי לְמִלִּין
  choice: మాటలతో ఉచ్చులు
  rationale: ఈ హీబ్రూ పదబంధం క్లిష్టమైనది. సందర్భంలో ప్రత్యర్థిని మాటల్లో చిక్కించడమనే భావాన్ని ఈ అనువాదం స్పష్టంగా తెలియజేస్తుంది. ‘మాటలకు అంతాలు/హద్దులు’ అనే పదశః సాధ్యతను పాదసూచికలో నిలుపుతున్నాం.
- source_word: תָּבִינוּ
  choice: గ్రహించండి
  rationale: בין ధాతువు సూచించే అవగాహన లేదా వివేచనను, బహువచన ఆజ్ఞార్థ బలంతో, సాధారణ ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: וְאַחַר
  choice: ఆ తర్వాత
  rationale: మొదట గ్రహించడం, తరువాత మాట్లాడడం అనే క్రమాన్ని సహజంగా చూపుతుంది.
- source_word: נְדַבֵּר
  choice: మేము మాట్లాడతాం
  rationale: మొదటి పురుష బహువచన అసంపూర్ణ క్రియారూపాన్ని సాధారణ భవిష్యత్తుగా అనువదిస్తుంది; సందర్భానుసారం ఆహ్వానార్థకంగా కూడా వినిపించే సాధ్యతను పాదసూచికలో ఇస్తున్నాం.
