translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. రెండవ పురుష బహువచనం మరియు మొదటి పురుష బహువచనం మూలంలోని వ్యక్తి-వచన మార్పును అలాగే నిలుపుతున్నాయి. క్లిష్టమైన קִנְצֵי לְמִלִּין పదబంధానికి సందర్భోచిత భావాన్ని ప్రధాన పాఠ్యంలో ఉంచి, మరింత పదశః ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
