  yaml_path: translation/ot/job/018/019.yaml
  text: He has neither offspring nor posterity among his people[b][a], and no survivor in the places where he sojourned.
translation:
  language: te
  text: అతనికి తన ప్రజల మధ్య సంతానమూ లేదు, వంశస్థులూ లేరు[a]; అతడు నివసించిన ప్రదేశాల్లో[b] మిగిలినవాడొక్కడూ లేడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘మనుమడు’. ‘సంతానం, వంశస్థులు’ అనే హీబ్రూ పదజంట అతని సంతతి పూర్తిగా అంతరించిపోవడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘అతని నివాసాల్లో’ లేదా ‘అతడు తాత్కాలికంగా బస చేసిన ప్రదేశాల్లో’. హీబ్రూ పదం స్థిర నివాసాన్నీ, పరదేశిగా బస చేయడాన్నీ సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִין
  choice: సంతానం
  rationale: ఈ పదం సంతతిని సూచిస్తుంది. ఆధునిక తెలుగులో ‘సంతానం’ సహజంగా ఉండి, కేవలం ‘కుమారుడు’ అనే సంకుచిత అర్థాన్ని నివారిస్తుంది.
- source_word: נֶכֶד
  choice: వంశస్థులు
  rationale: נִין‌తో జతగా ఇది తరువాతి తరాల వారిని, మొత్తం వంశపారంపర్యాన్ని సూచిస్తుంది. ‘వంశస్థులు’ సంతతి పూర్తిగా లేకపోవడమనే భావాన్ని నిలుపుతుంది; ‘మనుమడు’ కూడా సాధ్యమైన నిర్దిష్ట అర్థం.
- source_word: בְּעַמּוֹ
  choice: అతని ప్రజల మధ్య
  rationale: עַם అంటే సాధారణంగా ‘ప్రజలు’; בְּతో కలిసి అతడు చెందిన సమాజ పరిధిని సూచిస్తుంది. ‘అతని ప్రజల మధ్య’ సహజమైన తెలుగు రూపం.
- source_word: שָׂרִיד
  choice: మిగిలి ఉండేవాడు
  rationale: నాశనం తరువాత మిగిలిన లేదా బతికి ఉన్న వ్యక్తిని సూచిస్తుంది. ఈ సందర్భంలో ‘మిగిలి ఉండేవాడు’ స్పష్టంగా ఉండి, ప్రత్యేక వేదాంతార్థం కలిగిన పదాన్ని అనవసరంగా ప్రవేశపెట్టదు.
- source_word: בִּמְגוּרָיו
  choice: అతడు నివసించిన ప్రదేశాల్లో
  rationale: מָגוּר నివాసస్థలాన్నీ, తాత్కాలికంగా పరదేశిగా బస చేసిన ప్రదేశాన్నీ సూచించగలదు. ప్రధాన పాఠంలో సహజమైన విస్తృత రూపాన్ని ఉపయోగించి, ప్రత్యామ్నాయ సూక్ష్మార్థాన్ని పాదటిప్పణిలో ఉంచాం.
