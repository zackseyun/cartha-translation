translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన వాక్యనిర్మాణం వాడబడింది. హీబ్రూ సమాంతర నిర్మాణాన్ని ‘సంతానంగానీ, వంశస్థులుగానీ’ మరియు ‘ఒక్కడూ ఉండడు’ ద్వారా నిలుపుతూ, నివాసం/తాత్కాలిక బస అనే నిజమైన పదార్థ సందిగ్ధతను పాదటిప్పణిలో సంరక్షించాం.
