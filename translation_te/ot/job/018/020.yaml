- source_word: נָשַׁמּוּ
  choice: దిగ్భ్రాంతి చెందుతారు
  rationale: ఈ క్రియ ఆశ్చర్యంతో కూడిన తీవ్ర విభ్రాంతి, నిర్ఘాంతపోవడాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ఈ భావబలాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: אַחֲרֹנִים
