  text: Those who come after are appalled at his day[c][b][a], and those who went before are seized with horror.
translation:
  language: te
  text: అతని దినాన్ని చూసి తరువాతి వారు దిగ్భ్రాంతి చెందుతారు[a][b]; మునుపటి వారు భయంతో వణికిపోతారు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా ‘అతని దినం’; ఇది బహుశా అతనికి సంభవించే విపత్తు లేదా తీర్పు దినాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘తరువాతివారు … మునుపటివారు’; కొందరు ఈ జంటను భౌగోళికంగా ‘పశ్చిమ ప్రాంతవాసులు … తూర్పు ప్రాంతవాసులు’ అని అర్థం చేసుకుంటారు.
    reason: alternative_reading
  - marker: c
    text: హీబ్రూలో అక్షరార్థంగా ‘వారు వణుకును పట్టుకున్నారు’ అనే నుడికారం; అంటే వారు భయంతో వణికిపోయారు.
    reason: lexical_alternative
