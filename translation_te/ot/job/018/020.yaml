- source_word: וְקַדְמֹנִים
  choice: ముందటివారు
  rationale: אַחֲרֹנִיםకు సమాంతరంగా ‘పూర్వం ఉన్నవారు’ అనే కాలసంబంధ వ్యత్యాసాన్ని ఇస్తుంది; ‘తూర్పువారు’ అనే సాధ్యమైన భౌగోళిక అర్థాన్ని పాదటిప్పణిలో సూచిస్తుంది.
- source_word: אָחֲזוּ שָׂעַר
  choice: భయకంపం పట్టుకుంటుంది
  rationale: అక్షరార్థంగా ‘కంపాన్ని/భయకంపాన్ని పట్టుకున్నారు’; భయానక స్పందన వారిని ఆవహించిందనే హీబ్రూ నుడికారాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
