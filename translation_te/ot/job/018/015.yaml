  yaml_path: translation/ot/job/018/015.yaml
  text: In his tent dwells no longer his[b][a]; sulfur is scattered over his dwelling.
translation:
  language: te
  text: అతనిది కానిది అతని గుడారంలో నివసిస్తుంది[a]; అతని నివాసంపై గంధకం చల్లబడుతుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హెబ్రీ వాక్యనిర్మాణం క్లిష్టంగా ఉంది. మరో విధంగా, వాక్యాంతంలోని “గంధకం”ను మొదటి క్రియకు ఆలస్యంగా వచ్చిన కర్తగా కూడా తీసుకోవచ్చు: “గంధకం అతని గుడారంలో నివసిస్తుంది.” “అతనిది కానిది” అనే పదబంధం గుడారంలో పరాయి ఉనికి ఉందనే భావాన్నీ, అతడు దానిపై స్వాధీనం కోల్పోయాడనే భావాన్నీ సూచించవచ్చు.'
    reason: alternative_reading
lexical_decisions:
- source_word: תִּשְׁכּוֹן
  choice: నివసిస్తుంది
  rationale: שׁכן అంటే ‘నివసించు, స్థిరపడు.’ క్రియ స్త్రీలింగ ఏకవచనంలో ఉన్నా, దాని కర్త స్పష్టంగా చెప్పబడలేదు; అందువల్ల తెలుగు అనువాదంలో ఈ వ్యాకరణ అస్పష్టతను పూర్తిగా తొలగించకుండా ఉంచాం.
- source_word: בְּאָהֳלוֹ
  choice: అతని గుడారంలో
  rationale: אֹהֶל యొక్క ప్రత్యక్ష అర్థం ‘గుడారం.’ యోబు గ్రంథంలోని స్పష్టమైన గృహచిత్రాన్ని నిలుపుకోవడానికి ‘నివాసం’ అని సాధారణీకరించలేదు.
- source_word: מִבְּלִי לוֹ
  choice: అతనిది కానిది
  rationale: ఈ సంక్షిప్తమైన పదబంధం అతనికి చెందనిదాన్ని లేదా అతని స్వాధీనం కోల్పోవడాన్ని సూచించవచ్చు. ‘అతనిది కానిది’ అనే రూపం పరాయి ఉనికిని ఖచ్చితంగా గుర్తించకుండా మూలంలోని లోపార్థాన్ని నిలుపుతుంది.
- source_word: יְזֹרֶה
  choice: చల్లబడుతుంది
  rationale: זרה పియేల్ రూపానికి ‘చల్లు, వెదజల్లు’ అనే అర్థం. హెబ్రీలో కర్తను పేర్కొనని విధంగా వాడిన క్రియను తెలుగులో కర్మణి రూపంతో సహజంగా వ్యక్తం చేశాం.
- source_word: עַל נָוֵהוּ
  choice: అతని నివాసంపై
  rationale: נָוֶה అంటే సందర్భానుసారం నివాసం, వాసస్థలం లేదా మేతభూమి. ‘గుడారం’తో ఉన్న సమాంతరత కారణంగా ఇక్కడ ‘నివాసం’ సరిపోతుంది.
- source_word: גָפְרִית
  choice: గంధకం
  rationale: ఇది వినాశకర తీర్పుతో ముడిపడిన sulfur‌ను సూచిస్తుంది. ఆధునిక ప్రామాణిక తెలుగులో ‘గంధకం’ స్పష్టమైన, సహజమైన పదం.
theological_decisions:
- issue: క్లిష్టమైన వాక్యనిర్మాణంలో గుడారంలో నివసించేది ఏమిటనే ప్రశ్న
  choice: ‘అతనిది కానిది’ గుడారంలో నివసిస్తుందని ప్రధాన పాఠంలో ఉంచడం
  alternative: వాక్యాంతంలోని ‘గంధకం’నే ముందున్న స్త్రీలింగ క్రియకు ఆలస్యంగా వచ్చిన కర్తగా తీసుకొని, గంధకం అతని గుడారంలో నివసిస్తుందని అనువదించడం
  rationale: హెబ్రీ పాఠం కర్తను స్పష్టంగా పేర్కొనదు; מִבְּלִי לוֹ కూడా సంక్షిప్తంగా ఉంది. ప్రధాన అనువాదం పరాయి ఆక్రమణ లేదా స్వాధీననష్టం అనే భావాన్ని నిలుపుతూ, గంధకమే కర్త అని తప్పనిసరిగా నిర్ణయించదు. ప్రత్యామ్నాయాన్ని పాదసూచికలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకుడికి అర్థమయ్యే గంభీరమైన శైలి. ‘గుడారం,’ ‘నివాసం,’ ‘గంధకం’ వంటి స్పష్టమైన పదాలతో మూలంలోని తీర్పు-వినాశ చిత్రాన్ని నిలిపాం; క్లిష్టమైన హెబ్రీ వాక్యనిర్మాణాన్ని పాదసూచికలో వెల్లడించాం.
