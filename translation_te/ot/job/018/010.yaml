translation:
  language: te
  text: అతని తాడు నేలలో దాచబడి ఉంది[a]; అతని ఉచ్చు దారిమీద ఉంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతని త్రాడు నేలలో దాచబడి ఉంది; అతని పాశం దారిమీద ఉంది.”
    reason: חַבְלוֹ కు ‘త్రాడు’ మరియు מַלְכֻּדְתּוֹ కు ‘పాశం’ సాధ్యమైన సందర్భోచిత ప్రత్యామ్నాయాలు; మూలంలోని ఉచ్చు-చిత్రాన్ని అనవసరంగా ఉరితీత లేదా వలగా నిర్దిష్టం చేయవు.
lexical_decisions:
- source_word: טָמוּן
  choice: దాచబడి ఉంది
  rationale: טמן అనే మూలం నుంచి వచ్చిన నిష్క్రియ స్థితిని సూచించే రూపం; ఉచ్చుకు సంబంధించిన తాడు కంటికి కనిపించకుండా దాచివుంచబడిన స్థితిని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: בָּאָרֶץ
  choice: నేలలో
  rationale: אֶרֶץ సాధారణంగా భూమి లేదా దేశం అని అర్థమయ్యే పదమైనా, ఇక్కడ ఉచ్చు అమర్చే సందర్భంలో భౌతికమైన నేలను సూచించడం అత్యంత సహజం.
- source_word: חַבְלוֹ
  choice: అతని తాడు
  rationale: חבל అంటే తాడు లేదా పగ్గం వంటి బంధన సాధనం; ఇక్కడ ఉచ్చులో భాగమైన తాడును సూచిస్తుంది. 'తాడు' స్పష్టమైన, సాధారణ తెలుగు పదం.
- source_word: וּמַלְכֻּדְתּוֹ
  choice: అతని ఉచ్చు
  rationale: מַלְכֹּדֶת పట్టుకోవడానికి అమర్చే ఉచ్చు లేదా బోనును సూచిస్తుంది. దారి మీద రహస్యంగా అమర్చే సాధనానికి 'ఉచ్చు' సహజంగా సరిపోతుంది.
- source_word: עֲלֵי נָתִיב
  choice: దారిలో
  rationale: ఈ పదబంధం నడిచే మార్గంపై ఉచ్చు ఉన్న స్థానాన్ని సూచిస్తుంది. తెలుగులో 'దారిలో' సహజంగా ఉండి, ప్రయాణికుడు ఎదుర్కొనే ఉచ్చు అనే చిత్రాన్ని నిలుపుతుంది.
