translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన కవితా వాక్యంగా రూపొందించబడింది. హీబ్రూ వాక్యంలోని రెండు సమాంతర భాగాలు మరియు రహస్యంగా అమర్చిన ఉచ్చు చిత్రం నిలుపబడ్డాయి.
