translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైనా సులభంగా అర్థమయ్యే శైలి వాడబడింది. మొదటి భాగంలోని అవమానకరమైన పశు-పోలికను నేరుగా నిలిపి, రెండవ భాగంలోని నిజమైన పాఠ్య అనిశ్చితిని పాదసూచికలో వెల్లడించాం.
