review_pass:
  verdict: revise
  source_fidelity: The draft’s first colon broadly conveys the comparison with animals, but “ఎంచుతున్నారు” means ‘are choosing’ and does not render נֶחְשַׁבְנוּ, ‘are regarded/count­ed.’ Its main rendering of נִטְמִינוּ as ‘stupid’ departs from the most defensible reading represented in the WLC-based audit trail and reverses the draft footnote’s stated alternative. The difficult form should be rendered cautiously as ‘considered impure/unclean,’ with the uncertainty noted.
  naturalness: “మమ్మల్ని పశువుల్లా ఎందుకు ఎంచుతున్నారు?” is not idiomatic for being regarded as animals. “మమ్మల్ని పశువులుగా ఎందుకు భావిస్తున్నారు?” is natural modern standard Telugu. Repeating “ఎందుకు” in the second colon is acceptable for the Hebrew’s two rhetorical clauses and reads clearly.
  terminology: పశువులు appropriately conveys the contemptuous animal comparison without unnecessarily specifying cattle. అపవిత్రులు is the normal modern Telugu term for ‘unclean/impure’ in this context. భావిస్తున్నారు / పరిగణిస్తున్నారు accurately express evaluative reckoning.
  issues:
  - severity: high
    issue: “ఎంచుతున్నారు” mistranslates נֶחְשַׁבְנוּ.
    rationale: The Hebrew passive verb concerns being reckoned, regarded, or considered, not being selected.
  - severity: high
    issue: The main text renders the difficult נִטְמִינוּ as “మందబుద్ధులుగా కనిపిస్తున్నాం.”
    rationale: This does not follow the primary WLC-based reading reflected in the English audit trail (‘considered unclean’) and presents a disputed alternative as certain. The likely impurity/defilement sense belongs in the main text, while the difficulty is disclosed in a footnote.
  revised_text: మమ్మల్ని పశువులుగా ఎందుకు భావిస్తున్నారు? మీ దృష్టిలో మమ్మల్ని అపవిత్రులుగా ఎందుకు పరిగణిస్తున్నారు?[a]
