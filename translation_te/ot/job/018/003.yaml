  yaml_path: translation/ot/job/018/003.yaml
  text: Why are we regarded as cattle[b][a], and considered unclean in your eyes?
translation:
  language: te
  text: మమ్మల్ని పశువులుగా ఎందుకు భావిస్తున్నారు? మీ దృష్టిలో మమ్మల్ని అపవిత్రులుగా ఎందుకు పరిగణిస్తున్నారు?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “అపవిత్రులుగా పరిగణిస్తున్నారు” అని అనువదించిన హీబ్రూ పదరూపం క్లిష్టమైనది. దీనికి వేరే అర్థాలు కూడా ప్రతిపాదించబడ్డాయి; అయితే సందర్భంలో మమ్మల్ని అపవిత్రులుగా లేదా కలుషితులుగా చూస్తున్నారనే భావమే ఎక్కువ సంభావ్యంగా ఉంది.
    reason: alternative_reading
lexical_decisions:
- source_word: מַדּוּעַ
  choice: ఎందుకు
  rationale: అలంకారప్రాయమైన ప్రశ్నను ప్రారంభించే ప్రశ్నార్థక క్రియావిశేషణం; ఆధునిక తెలుగులో సహజంగా, నేరుగా ఉంటుంది.
- source_word: נֶחְשַׁבְנוּ
  choice: మమ్మల్ని ... ఎంచుతున్నారు
  rationale: חשׁב అనే క్రియ ఇక్కడ ఇతరులు ‘మనలను ఎలా లెక్కిస్తున్నారు/భావిస్తున్నారు’ అనే కర్మణి భావాన్ని ఇస్తుంది. ‘ఎంచుతున్నారు’ మూలంలోని లెక్కింపు-మూల్యాంకన భావాన్ని నిలుపుతుంది.
- source_word: כַבְּהֵמָה
  choice: పశువుల్లా
  rationale: בְּהֵמָה సాధారణంగా జంతువు లేదా మచ్చిక పశువును సూచిస్తుంది. ఈ సందర్భంలో అవమానకరమైన పోలికను ‘పశువుల్లా’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: נִטְמִינוּ
  choice: మందబుద్ధులుగా కనిపిస్తున్నాం
  rationale: ఈ అరుదైన, క్లిష్టమైన రూపానికి ‘మొద్దుబారినవారు/తెలివిలేనివారు’ అనే భావం సందర్భానికీ సమాంతర వాక్య నిర్మాణానికీ బాగా సరిపోతుంది. రూపం క్లిష్టమైనందున ‘అపవిత్రులం’ అనే ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: בְּעֵינֵיכֶם
  choice: మీ దృష్టిలో
  rationale: ఒకరి అంచనా లేదా అభిప్రాయాన్ని సూచించే హీబ్రూ నుడికారాన్ని సహజమైన తెలుగు నుడికారంతో వ్యక్తం చేస్తుంది.
