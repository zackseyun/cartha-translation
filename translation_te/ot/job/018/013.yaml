source:
  edition: WLC
  text: יֹ֭אכַל בַּדֵּ֣י עוֹר֑/וֹ יֹאכַ֥ל בַּ֝דָּ֗י/ו בְּכ֣וֹר מָֽוֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/job/018/013.yaml
  text: It devours the limbs of his skin[a]; the firstborn of death devours his limbs.
translation:
  language: te
  text: అది అతని చర్మపు అవయవాలను మింగివేస్తుంది; మృత్యువు యొక్క జ్యేష్ఠపుత్రుడు[a] అతని అవయవాలను మింగివేస్తాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘మృత్యువు యొక్క ప్రథమజాతుడు’; ఇది అత్యంత ప్రాణాంతకమైన బాధను లేదా మృత్యువు యొక్క ప్రధాన కార్యసాధకుణ్ణి కవితాత్మకంగా వ్యక్తీకరించి ఉండవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: יֹאכַל
  choice: మింగివేస్తుంది / మింగివేస్తాడు
  rationale: אכל అనే క్రియ ఇక్కడ విధ్వంసకరంగా తినివేయడాన్ని రూపకంగా సూచిస్తుంది. తెలుగు కవితా సందర్భంలో ‘మింగివేయు’ ఆ తీవ్రతను సహజంగా తెలియజేస్తుంది; మొదటి పాదంలో కర్త తెలియనందున నపుంసక ఏకవచనం, రెండవ పాదంలో ‘జ్యేష్ఠపుత్రుడు’ కర్త కావడంతో పుంలింగం వాడబడింది.
- source_word: בַּדֵּי / בַּדָּיו
  choice: అవయవాలను / అతని అవయవాలను
  rationale: ఈ పదం భాగాలు, అంగాలు, కొమ్మలు అనే అర్థాలు కలిగి ఉండగలదు. చర్మం మరియు శరీర వినాశన సందర్భంలో ‘అవయవాలు’ శరీర సభ్యాలను స్పష్టంగా సూచిస్తూ, రెండు పాదాల్లోని పునరుక్తిని నిలుపుతుంది.
- source_word: עוֹרוֹ
  choice: అతని చర్మపు
  rationale: עוֹר కు సాధారణ అర్థం చర్మం. బహువచన శరీర అవయవాలతో సహజమైన తెలుగు సంబంధాన్ని చూపేందుకు ‘అతని చర్మపు అవయవాలు’ అని అనువదించబడింది.
- source_word: בְּכוֹר מָוֶת
  choice: మృత్యువు యొక్క జ్యేష్ఠపుత్రుడు
  rationale: హీబ్రూ కవితలోని బలమైన ‘మరణపు ప్రథమజాతుడు’ అనే రూపకాన్ని వ్యాఖ్యానాత్మకంగా సరళీకరించకుండా నిలుపుతుంది. ‘జ్యేష్ఠపుత్రుడు’ సాధారణ పాఠకునికి అర్థమయ్యే గౌరవప్రదమైన పదం.
theological_decisions:
- issue: בְּכוֹר מָוֶת అనే రూపకం యొక్క అర్థం
  choice: ప్రధాన పాఠ్యంలో ‘మృత్యువు యొక్క జ్యేష్ఠపుత్రుడు’ అనే వ్యక్తీకృత కవితా రూపాన్ని నిలుపుట
  alternative: అత్యంత ఘోరమైన వ్యాధి; మృత్యువు యొక్క ప్రధాన దూత; అత్యంత భయంకరమైన మరణం
  rationale: మూల హీబ్రూ నిర్దిష్టంగా ఒక వ్యాధినో మరణ విధానాన్నో నిర్ణయించదు. అందువల్ల దాని నిజమైన అస్పష్టతను, కవితా ఉద్రిక్తతను నిలుపుతూ ప్రత్యామ్నాయ భావాన్ని పాదటిప్పణిలో సూచించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కవితా శైలిని అనుసరించాం. ‘మింగివేస్తుంది’ విధ్వంస తీవ్రతను, ‘అవయవాలు’ శరీర సందర్భాన్ని తెలియజేస్తాయి. మూలంలోని రెండు పాదాల పునరుక్తి మరియు ‘మృత్యువు యొక్క జ్యేష్ఠపుత్రుడు’ అనే ఉద్దేశపూర్వక అస్పష్ట రూపకం నిలుపబడ్డాయి.
