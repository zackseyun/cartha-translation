  yaml_path: translation/ot/job/018/005.yaml
  text: Indeed[a], the light of the wicked is put out, and the flame of his fire does not shine.
translation:
  language: te
  text: 'నిశ్చయంగా, దుష్టుల వెలుగు ఆరిపోతుంది;

    వారి అగ్నిలోని రవ్వ ప్రకాశించదు.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גַּם
  choice: నిశ్చయంగా
  rationale: ఇక్కడ ఇది కేవలం ‘కూడా’ అనే చేర్పును కాక, బిల్దదు చేస్తున్న ప్రకటనకు నొక్కి చెప్పే బలాన్ని ఇస్తుంది.
- source_word: אוֹר
  choice: వెలుగు
  rationale: ఈ పదం రూపకంగా శ్రేయస్సు లేదా జీవనస్థితిని సూచించినా, మూలంలోని వెలుగు ప్రతిమను నిలుపుతుంది.
- source_word: רְשָׁעִים
  choice: దుష్టుల
  rationale: దుష్టులనే ఒక వర్గంగా సూచించే బహువచన రూపాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: יִדְעָךְ
  choice: ఆరిపోతుంది
  rationale: వెలుగు క్రమంగా మసకబారడం లేదా పూర్తిగా ఆరిపోవడం అనే భావాన్ని, స్పష్టమైన కర్తను చేర్చకుండా సహజంగా తెలుపుతుంది.
- source_word: וְלֹא
  choice: ప్రకాశించదు
  rationale: సంయోజక అవ్యయం, నిషేధం రెండింటినీ తెలుగు కవితా సమాంతరతలో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: יִגַּהּ
  choice: ప్రకాశించదు
  rationale: వెలుగును వెదజల్లడం అనే అర్థాన్ని గౌరవప్రదమైన, సాధారణ ఆధునిక తెలుగులో ఇస్తుంది.
- source_word: שְׁבִיב
  choice: రవ్వ
  rationale: ఈ హెబ్రీ పదానికి ‘నిప్పురవ్వ’ లేదా ‘జ్వాల’ అనే భావాలు ఉండవచ్చు. అగ్నికి సంబంధించిన చిన్న వెలుగు కణం అనే ప్రత్యక్ష అర్థాన్ని ‘రవ్వ’ సహజంగా నిలుపుతుంది; ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: אִשּׁוֹ
  choice: వారి అగ్ని
  rationale: మూలంలోని ‘అగ్ని’ ప్రతిమను వ్యాఖ్యానాత్మకంగా ‘దీపం’గా మార్చకుండా నిలుపుతుంది. హెబ్రీ ఏకవచన సర్వనామాన్ని తెలుగులో లింగతటస్థ గౌరవ/సామాన్య సూచనగా ‘వారి’తో తెలిపాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కవితా శైలిని వాడాం. ‘వెలుగు—అగ్ని—ప్రకాశం’ అనే మూల ప్రతిమల సమాంతరతను నిలిపాం; రూపకాన్ని వివరణగా మార్చలేదు.
