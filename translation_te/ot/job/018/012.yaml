  source_fidelity: 'The main rendering accurately conveys the two poetic cola: his strength is depicted as hungry/famished, and calamity is poised close to him. ‘ఆకలితో అలమటిస్తుంది’ appropriately preserves the Hebrew personification and severity without unnecessarily resolving the possible nuance of אֹנוֹ as resources/wealth.'
