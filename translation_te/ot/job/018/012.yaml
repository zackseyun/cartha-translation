  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కావ్య లయను ఉంచేందుకు రెండు సమాంతర పాదాలు వాడాం. ‘శక్తి ఆకలితో అలమటిస్తుంది’ అనే వ్యక్తీకరణ మూలంలోని మానవీకరణను నిలుపుతుంది; స్పష్టత కోసం దానిని ‘క్షీణిస్తుంది’గా విప్పలేదు.
