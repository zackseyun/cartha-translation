  text: His strength is famished[a], and calamity is ready at his side.
translation:
  language: te
  text: 'అతని శక్తి ఆకలితో అలమటిస్తుంది;

    విపత్తు అతని పక్కనే[a] సిద్ధంగా ఉంది.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతని తడబడుటకు సిద్ధంగా ఉంది.” ఇక్కడి హీబ్రూ పదానికి “పక్క/ప్రక్క భాగం” అని అర్థం ఉండవచ్చు; కొందరు దాన్ని “కుంటడం/తడబడటం” అనే భావంలో అర్థం చేసుకుంటారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהִי
  choice: అలమటిస్తుంది / ఉంది
  rationale: కావ్య వర్ణనలో ఈ అసంపూర్ణ క్రియను ఆశీర్వాదార్థకంగా కాక, ప్రస్తుత స్థితిని తెలిపే సహజమైన తెలుగు రూపాల్లో అందించాం.
- source_word: רָעֵב
  choice: ఆకలితో అలమటిస్తుంది
  rationale: ఈ విశేషణం తీవ్రమైన ఆకలిని సూచిస్తుంది. ‘ఆకలిగా ఉంది’ కంటే ‘ఆకలితో అలమటిస్తుంది’ కావ్యంలోని బలమైన వ్యక్తీకరణను సహజ తెలుగులో నిలుపుతుంది.
- source_word: אֹנוֹ
  choice: అతని శక్తి
  rationale: אוֹן బలం, శక్తి, సామర్థ్యం లేదా సంపదను సూచించగలదు. ఇక్కడ విపత్తు సందర్భంలో క్షీణిస్తున్న వ్యక్తిగత శక్తి అనే భావం సందర్భోచితం.
- source_word: וְאֵיד
  choice: విపత్తు
  rationale: אֵיד నాశనకరమైన దుర్ఘటన లేదా ఆపదను సూచిస్తుంది; ‘విపత్తు’ ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కావ్య శైలిని నిలుపుతుంది.
- source_word: נָכוֹן
  choice: సిద్ధంగా ఉంది
  rationale: ఈ రూపం స్థిరంగా సిద్ధపడి ఉన్న స్థితిని సూచిస్తుంది. ‘సిద్ధంగా ఉంది’ దాడి చేయడానికి పొంచి ఉన్న విపత్తు చిత్రాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: לְצַלְעוֹ
  choice: అతని పక్కనే
  rationale: צלע యొక్క ప్రాథమిక అర్థం ‘పక్క/ప్రక్క భాగం’ లేదా ‘పక్కటెముక.’ לְ ఉపసర్గతో ఇక్కడ విపత్తు అతనికి అతి సమీపంలో సిద్ధంగా ఉందనే దృశ్యం వస్తుంది; తడబడటం అనే ప్రత్యామ్నాయ అవగాహనను పాదసూచికలో ఉంచాం.
