  terminology: ‘శక్తి,’ ‘విపత్తు,’ and ‘సిద్ధంగా ఉంది’ are suitable equivalents for the principal terms. ‘అతని పక్కనే’ is a sound primary rendering of לְצַלְעוֹ. The footnote’s alternative, however, should preserve the full construction (‘calamity is ready for his stumbling’), rather than supplying the less precise temporal phrase ‘తడబడే వేళ కోసం.’
  issues:
