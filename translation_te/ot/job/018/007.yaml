review_pass:
  verdict: revise
  source_fidelity: The draft preserves the Hebrew parallelism and correctly understands אוֹנוֹ as qualifying the man's steps with the sense of strength/vigor. The second colon rightly makes his own counsel/plan the agent that brings about his fall. However, “కుదించబడతాయి” more naturally means ‘are shortened/reduced’ in Telugu, whereas יֵצְרוּ depicts steps becoming cramped, restricted, or hemmed in.
  naturalness: “అడుగులు ఇరుకుపడతాయి” is a more idiomatic modern Telugu expression for movement becoming constrained. “కూలదోస్తుంది” is suitably vivid and literary without being archaic, and more directly conveys the force of the Hiphil verb than “పడదోస్తుంది.”
  terminology: “బలమైన అడుగులు” appropriately renders the contextual force of אוֹן. “సొంత యోచన” retains the reflexive irony of עֲצָתוֹ while allowing the word’s sense of counsel, deliberation, or plan. The footnotes retain relevant lexical alternatives without over-specifying a disputed nuance.
  issues:
  - severity: low
    issue: The phrase “అడుగులు కుదించబడతాయి” can suggest that the steps themselves are made shorter.
    rationale: The Hebrew image is primarily of strides or movement being constricted. “ఇరుకుపడతాయి” better retains that image in natural Telugu.
  - severity: low
    issue: “పడదోస్తుంది” is less idiomatic and less forceful in this poetic context.
    rationale: “కూలదోస్తుంది” naturally expresses that his own counsel brings him down, while preserving the causative force of וְתַשְׁלִיכֵהוּ.
  revised_text: 'అతని బలమైన అడుగులు ఇరుకుపడతాయి[a];

    అతని సొంత యోచనే అతనిని కూలదోస్తుంది[b].'
