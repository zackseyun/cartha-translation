  text: His vigorous steps are constrained[b][a], and his own counsel casts him down.
translation:
  language: te
  text: 'అతని బలమైన అడుగులు ఇరుకుపడతాయి[a];

    అతని సొంత యోచనే అతనిని కూలదోస్తుంది[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అతని బలమైన అడుగులు నిరోధించబడతాయి.’ אוֹן అనే పదం ‘బలం’ లేదా ‘శక్తి’ని సూచించవచ్చు; క్రియను ‘ఇరుకుపడతాయి,’ ‘నిరోధించబడతాయి,’ లేదా ‘సంకుచించబడతాయి’ అని అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘అతని సొంత ప్రణాళికే అతనిని కూలదోస్తుంది.’
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵצְרוּ
  choice: కుదించబడతాయి
  rationale: ఈ క్రియ అడుగులు ఇరుకవడం లేదా వాటి స్వేచ్ఛ నిరోధించబడడం అనే భావాన్ని ఇస్తుంది. తెలుగు కవితా సందర్భంలో ‘కుదించబడతాయి’ మూలంలోని రూపకాన్ని నిలుపుతుంది.
- source_word: צַעֲדֵי
  choice: అడుగులు
  rationale: צעד బహువచన నిర్మాణరూపానికి సహజమైన, సూటియైన తెలుగు సమానం; నడక మరియు జీవనగమనం రెండింటినీ సూచించగల కవితా చిత్రాన్ని కాపాడుతుంది.
- source_word: אוֹנוֹ
  choice: అతని బలమైన
  rationale: אוֹן ఇక్కడ ‘బలం/శక్తి’ భావంలో ‘అడుగులు’ను విశేషిస్తుంది. ‘బలమైన’ అనేది సహజమైన తెలుగులో vigorous/strong అనే భావాన్ని అందిస్తుంది; ‘సంపద’ లేదా ‘కీడు’ ఈ సందర్భంలో తక్కువ సంభావ్యమైనవి.
- source_word: וְתַשְׁלִיכֵהוּ
  choice: అతన్ని పడదోస్తుంది
  rationale: హిఫిల్ క్రియకు తరువాతి స్త్రీలింగ ఏకవచనమైన ‘ఆలోచన’ కర్త. ‘పడదోస్తుంది’ అనేది అతని పతనానికి అతని ఆలోచనే కారణమవుతుందనే విరోధాభాసాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: עֲצָתוֹ
  choice: అతని సొంత ఆలోచన
  rationale: עֵצָהకు ఆలోచన, యోచన, ప్రణాళిక, సలహా అనే పరిధి ఉంది. ‘సొంత ఆలోచన’ అతడు రూపొందించుకున్నదే అతనికి విరోధంగా మారుతుందనే భావాన్ని స్పష్టంగా, సాధారణ పాఠకునికి సహజంగా తెలియజేస్తుంది.
