translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యేలా సహజమైనప్పటికీ గంభీరమైన కవితా శైలి. మూలంలోని సమాంతర నిర్మాణం, అడుగులు కుదించబడే చిత్రం, సొంత యోచనే పతనానికి కారణమయ్యే విరోధాభాసం నిలుపబడ్డాయి.
