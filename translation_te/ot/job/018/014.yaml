  text: יִנָּתֵ֣ק מֵ֭/אָהֳל/וֹ מִבְטַח֑/וֹ וְ֝/תַצְעִדֵ֗/הוּ לְ/מֶ֣לֶךְ בַּלָּהֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/job/018/014.yaml
  text: He is torn from the security of his tent[b][a], and he is marched off to the king of terrors.
translation:
  language: te
  text: అతడు తన గుడారపు తన భద్రత నుండి పెకలించబడతాడు[a]; భయాల రాజు వద్దకు నడిపించబడతాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతడు తన గుడారం నుండి—తన భద్రత నుండి—పెకలించబడతాడు.” హీబ్రూ వాక్యం అతడు గుడారమనే సురక్షిత స్థలం నుండి తొలగించబడుతున్నాడని గానీ, ఆ గుడారమే అతని భద్రతగా ఉండిందని గానీ అర్థమివ్వవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “భయాల రాజు” ఒక కవితా వ్యక్తీకరణ; ఇది తరచుగా వ్యక్తిగా చిత్రించబడిన మరణాన్ని సూచిస్తుందని అర్థం చేసుకుంటారు.
    reason: alternative_reading
lexical_decisions:
- source_word: יִנָּתֵק
  choice: పెకలించబడతాడు
  rationale: נתק నిఫల్ రూపం బలవంతంగా విడదీయడం, లాగివేయడం, పెకలించడం అనే నిష్క్రియ భావాన్ని ఇస్తుంది. ‘పెకలించబడతాడు’ ఆ హింసాత్మక వియోగాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: מֵאָהֳלוֹ
  choice: తన గుడారపు
  rationale: אֹהֶל యొక్క ప్రత్యక్ష అర్థమైన ‘గుడారం’ను ఉంచడం ద్వారా హీబ్రూ కవితా చిత్రణ నిలుస్తుంది; సందర్భంలో అది నివాసాన్ని కూడా సూచించవచ్చు.
- source_word: מִבְטַחוֹ
  choice: భద్రత నుండి
  rationale: מִבְטָח భద్రత, నమ్మకం లేదా ఆశ్రయాన్ని సూచించగలదు. ఇక్కడ ‘గుడారపు భద్రత’ అని అనువదించడం, గుడారం సురక్షిత స్థలమనే భావాన్ని సహజంగా అందిస్తూనే హీబ్రూలోని సంబంధ అస్పష్టతను పాదసూచికలో ఉంచుతుంది.
- source_word: וְתַצְעִדֵהוּ
  choice: నడిపించబడతాడు
  rationale: צעד హిఫిల్ రూపం ‘అడుగులు వేయించడం, నడిపించడం’ అనే కారణార్థక భావం కలిగి ఉంది. హీబ్రూ క్రియ స్త్రీలింగ ఏకవచన కర్తను సూచించినా ఆ కర్త స్పష్టంగా లేదు; తెలుగులో నిష్క్రియ నిర్మాణం గమ్యానికి బలవంతంగా తీసుకెళ్లబడే భావాన్ని అతిగా నిర్వచించకుండా కాపాడుతుంది.
- source_word: לְמֶלֶךְ
  choice: రాజు దగ్గరికి
  rationale: לְ దిశను సూచిస్తుంది. ‘దగ్గరికి’ అనేది రాజు వైపు లేదా అతని సన్నిధికి తీసుకెళ్లబడటాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: בַּלָּהוֹת
  choice: భయాల
  rationale: బహువచనమైన בַּלָּהוֹת తీవ్రమైన భయాలు, భీతులు లేదా భయంకర విషయాలను సూచిస్తుంది. ‘భయాల రాజు’ మూలంలోని సంక్షిప్తమైన కవితా వ్యక్తీకరణను నిలుపుతుంది.
theological_decisions:
- issue: ‘భయాల రాజు’ ఎవరు?
  choice: ఆ కవితా బిరుదును వివరణాత్మకంగా గుర్తించకుండా యథాతథంగా ఉంచడం
  alternative: మరణాన్ని వ్యక్తీకరించిన రూపం; పాతాళం లేదా సమాధి; భయాలను పాలించే అతీంద్రియ అధిపతి
  rationale: హీబ్రూ పదబంధం దాని ఉద్దేశిత వ్యక్తిని స్పష్టంగా నిర్వచించదు. అది మరణాన్ని వ్యక్తీకరించిన రూపంగా సాధారణంగా అర్థమవగలిగినా, అనువాదంలో అలా నిర్ధారించడం మూలంలోని కవితా మరియు వేదాంత అస్పష్టతను తొలగిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గంభీరమైన కవితా స్వరాన్ని నిలుపుతూ సాధారణ పాఠకులకు అర్థమయ్యే పదాలు వాడబడ్డాయి. రెండు సమాంతర నిష్క్రియ క్రియారూపాలు బాధితుని బలవంతపు తొలగింపును స్పష్టం చేస్తాయి; హీబ్రూలో రెండవ క్రియకు ఉన్న అస్పష్ట కర్తను తెలుగులో కృత్రిమంగా నిర్ధారించలేదు.
