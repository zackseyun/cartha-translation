lexical_decisions:
- source_word: וַיַּעַן
  choice: జవాబిచ్చాడు
  rationale: ענה అనే క్రియ సంభాషణ సందర్భంలో ‘జవాబివ్వడం’ అనే అర్థాన్ని ఇస్తుంది; బిల్దదు యోబు మాటలకు ప్రతిస్పందిస్తున్న సందర్భానికి ఇది సహజంగా సరిపోతుంది.
- source_word: בִּלְדַּד
  choice: బిల్దదు
  rationale: వ్యక్తి పేరును తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: הַשֻּׁחִי
  choice: షూహీయుడైన
  rationale: ఇది బిల్దదు వంశ లేదా ప్రాంత సంబంధాన్ని సూచించే విశేషణం; తెలుగులో సహజమైన గుర్తింపుగా ‘షూహీయుడైన’ అని ఇచ్చాం.
- source_word: וַיֹּאמַר
  choice: ఇలా
  rationale: మూలంలోని ‘జవాబిచ్చి చెప్పాడు’ అనే ద్విక్రియా పరిచయ సూత్రాన్ని తెలుగులో భారంగా కాకుండా సహజంగా తెలిపేందుకు ‘ఇలా జవాబిచ్చాడు’ అని అమర్చాం; ‘ఇలా’ తరువాత వచ్చే ప్రత్యక్ష ప్రసంగాన్ని పరిచయం చేస్తుంది.
- source_word: וַ
  choice: అప్పుడు
  rationale: ప్రారంభ waw కథన క్రమాన్ని ముందుకు నడిపిస్తుంది; ఆధునిక తెలుగులో ‘అప్పుడు’ ఆ క్రమసంబంధాన్ని సహజంగా వ్యక్తం చేస్తుంది.
