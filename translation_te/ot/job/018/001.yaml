translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. హెబ్రీ ద్విక్రియా సూత్రాన్ని ప్రధాన పాఠ్యంలో తెలుగు సహజత్వం కోసం సంక్షిప్తంగా ఇచ్చి, దాని రూపాన్ని పాదసూచికలో నిలిపాం.
