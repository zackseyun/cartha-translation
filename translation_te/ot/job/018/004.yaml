  text: You who tear yourself apart in your anger—shall the earth be abandoned for your sake[a], or a rock be moved from its place?
translation:
  language: te
  text: 'కోపంలో నిన్ను నీవే చీల్చుకునేవాడా![a]

    నీ కోసం భూమి విడిచిపెట్టబడాలా?

    లేక బండ తన స్థలం నుంచి కదిలించబడాలా?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “తన కోపంలో తన ప్రాణాన్ని చీల్చుకునేవాడు.” హెబ్రీ వాక్యం మూడవ పురుష కృదంత ప్రయోగంతో మొదలై, తరువాత నేరుగా రెండవ పురుష సంబోధనకు మారుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: טֹרֵף נַפְשׁוֹ
  choice: నిన్ను నీవే చీల్చుకునేవాడా
  rationale: טרף అనే క్రియకు ‘చీల్చడం, ముక్కలు చేయడం’ అనే బలమైన భావం ఉంది; נפש ఇక్కడ ‘స్వయం/ప్రాణం’ అనే అర్థంలో ఉంది. ఈ రెండింటినీ కలిపి, కోపం వల్ల తనకే హాని చేసుకునే భావాన్ని సహజమైన తెలుగులో సజీవంగా వ్యక్తం చేసింది.
- source_word: בְּאַפּוֹ
  choice: కోపంలో
  rationale: אַף అక్షరార్థంగా ‘ముక్కు’ అయినా, ఈ సందర్భంలో సాధారణ హెబ్రీ ప్రయోగం ప్రకారం ‘కోపం’ అని అర్థం. తరువాతి రెండవ పురుష ఏకవచన సంబోధనకు అనుగుణంగా తెలుగులో ప్రత్యక్ష సంబోధనగా ఇచ్చింది.
- source_word: הֲלְמַעַנְךָ
  choice: నీ కోసం
  rationale: לְמַעַן ఇక్కడ ‘నీ నిమిత్తం/నీ కారణంగా’ అనే భావం ఇస్తుంది. ‘నీ కోసం’ సాధారణ పాఠకునికి సహజంగా ఉండి, యోబు నిమిత్తం ప్రపంచ క్రమమే మారాలా అనే వ్యంగ్య ప్రశ్న బలాన్ని నిలుపుతుంది.
- source_word: תֵּעָזַב אָרֶץ
  choice: భూమి విడిచిపెట్టబడాలా
  rationale: אָרֶץ కు ‘దేశం’ లేదా ‘భూమి’ అనే అర్థాలు ఉండవచ్చు; బండను తన స్థలం నుంచి కదిలించడమనే సమాంతర విశ్వవ్యాప్త చిత్రణలో ‘భూమి’ తగినది. עזב నిఫాల్ రూపంలోని కర్మణి భావాన్ని ‘విడిచిపెట్టబడాలా’ నిలుపుతుంది.
- source_word: וְיֶעְתַּק
  choice: కదిలించబడాలా
  rationale: עתק ఇక్కడ ఒక వస్తువును దాని స్థానం నుంచి తొలగించడం లేదా కదిలించడం సూచిస్తుంది. ముందరి కర్మణి వాక్యంతో సమాంతరత కోసం కర్మణి రూపాన్ని ఉపయోగించింది.
- source_word: צוּר
  choice: బండ
  rationale: צוּר అంటే బండ లేదా రాతికొండ. ఇక్కడ నిర్దిష్ట దైవ బిరుదు ఉద్దేశించబడలేదు; సామెతసదృశమైన సహజ వస్తువుగా ‘బండ’ సరిపోతుంది.
- source_word: מִמְּקֹמוֹ
  choice: తన స్థలం నుంచి
  rationale: ఈ పదబంధం బండకు చెందిన స్థానాన్ని సూచిస్తుంది. తెలుగులో నిర్జీవ వస్తువుకూ సహజంగా వాడగల ‘తన స్థలం నుంచి’ అనే రూపం మూలంలోని సంబంధాన్ని స్పష్టంగా ఉంచుతుంది.
theological_decisions:
- issue: వాక్యంలోని సంబోధన మరియు అలంకారిక ప్రశ్న ఉద్దేశం
  choice: బిల్దదు యోబును నేరుగా గద్దిస్తూ, అతని కోసం లోక క్రమం మారాలా అని ప్రశ్నిస్తున్నట్లుగా అనువదించడం
  alternative: మొదటి భాగాన్ని మూడవ పురుషలోనే ఉంచి, ‘తన కోపంలో తన ప్రాణాన్ని చీల్చుకునేవాడు—నీ కోసం భూమి...’ అని అనువదించడం
  rationale: హెబ్రీ మొదటి భాగం వ్యాకరణపరంగా మూడవ పురుష కృదంతం మరియు మూడవ పురుష ప్రత్యయంతో మొదలైనా, వెంటనే לְמַעַנְךָ అనే రెండవ పురుష ఏకవచన రూపానికి మారుతుంది. ప్రత్యక్ష గద్దింపు బలాన్ని సహజ తెలుగులో నిలుపుతూ, మూలంలోని పురుష మార్పును పాదసూచికలో వెల్లడించింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకునికి అర్థమయ్యేలా గంభీరమైన ప్రత్యక్ష గద్దింపు శైలిని వాడింది. మూడు పంక్తుల ప్రశ్నారూప నిర్మాణం హెబ్రీ సమాంతరతను మరియు వాక్చాతుర్య బలాన్ని స్పష్టపరుస్తుంది.
