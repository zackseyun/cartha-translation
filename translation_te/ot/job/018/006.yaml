translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ కవితాత్మక గాంభీర్యం నిలిచేలా అనువదించబడింది. రెండు పాదాల్లో ‘వెలుగు/దీపం’ మరియు ‘చీకటైపోవడం/ఆరిపోవడం’ మధ్య సమాంతరతను కాపాడాం. עָלָיו యొక్క స్థలసంబంధ భావాన్ని ప్రధాన వాక్యంలో స్పష్టంగా తెలిపినందున పాదటిప్పణి అవసరం లేదు.
