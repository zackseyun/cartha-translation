  text: The light in his tent grows dark[a], and his lamp above him is extinguished.
translation:
  language: te
  text: 'అతని గుడారంలోని వెలుగు చీకటైపోతుంది;

    అతని పైన దీపం ఆరిపోతుంది.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతనిమీద.” హెబ్రీయు పదం ‘పై/మీద’ లేదా ‘పైన’ అనే స్థలసంబంధ అర్థాన్ని ఇవ్వగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹר
  choice: వెలుగు
  rationale: సాధారణమైన స్పష్టమైన అర్థం ‘వెలుగు’; గుడారాన్ని ప్రకాశింపజేసే వెలుగు అనే కవితాత్మక చిత్రాన్ని సహజంగా నిలుపుతుంది.
- source_word: חָשַׁךְ
  choice: చీకటైపోతుంది
  rationale: ఈ క్రియ చీకటిగా మారడాన్ని సూచిస్తుంది; స్థిరస్థితికన్నా మార్పు భావాన్ని ‘చీకటైపోతుంది’ తెలియజేస్తుంది.
- source_word: בְּאָהֳלוֹ
  choice: అతని గుడారంలోని
  rationale: אָהֶל యొక్క ప్రత్యక్ష అర్థమైన ‘గుడారం’ను నిలుపుతూ, నివాసం లేదా ఇంటివారిని సూచించగల కవితాత్మక రూపకాన్ని అనవసరంగా విప్పదు.
- source_word: וְנֵרוֹ
  choice: అతని ... దీపం
  rationale: נֵר సాధారణ వెలుగుకన్నా నిర్దిష్టంగా దీపాన్ని లేదా దీపపు వెలుగును సూచిస్తుంది; మొదటి పాదంలోని వెలుగుతో ఉన్న సమాంతర చిత్రాన్ని కాపాడుతుంది.
- source_word: עָלָיו
  choice: అతని పైనున్న
  rationale: עַל ఇక్కడ ‘పైన/మీద’ అనే స్థలసంబంధ అర్థాన్ని ఇస్తుంది; దీపం అతని పైన వెలుగుతున్న దృశ్యాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: יִדְעָךְ
  choice: ఆరిపోతుంది
  rationale: దీపం లేదా అగ్ని ఆరిపోవడాన్ని సూచించే క్రియకు ఇది సహజమైన, గంభీరమైన ఆధునిక తెలుగు రూపం.
