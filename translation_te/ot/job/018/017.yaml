  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కవితాత్మక ధోరణి పాటించబడింది. ‘భూమి/దేశం’ మరియు ‘బహిరంగ స్థలం/ప్రజలు కూడే చోట’ అనే మూలపదాల భావవిస్తృతిని పాదటిప్పణిలో నిలుపుకున్నాం.
