  yaml_path: translation/ot/job/018/017.yaml
  text: His memory perishes from the earth[a], and he has no name on the face of the street.
translation:
  language: te
  text: భూమి నుండి అతని జ్ఞాపకం నశిస్తుంది[a]; బహిరంగ ప్రదేశంలో అతనికి పేరు ఉండదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దేశం నుండి అతని స్మరణ కనుమరుగవుతుంది; ప్రజలు కూడే చోట అతనికి పేరు ఉండదు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: זִכְרוֹ
  choice: అతని జ్ఞాపకం
  rationale: ఈ నామవాచకం జ్ఞాపకాన్ని లేదా స్మరణను సూచిస్తుంది. ‘అతని జ్ఞాపకం’ అనేది సహజమైన ఆధునిక తెలుగు; మనుషుల స్మృతిలో అతని గురించి మిగిలేది అంతరించిపోతుందనే భావాన్ని నిలుపుతుంది.
- source_word: אָבַד
  choice: నశిస్తుంది
  rationale: ఈ క్రియ నశించడం, అంతరించడం, కనుమరుగవడం అనే భావాలను ఇస్తుంది. ‘నశిస్తుంది’ బిల్దదు పలికిన తీర్పులోని తీవ్రతను నిలుపుతుంది.
- source_word: מִנִּי אָרֶץ
  choice: భూమిమీద నుండి
  rationale: אֶרֶץ అనే పదానికి ‘దేశం’ లేదా ‘భూమి’ అనే అర్థాలు ఉండవచ్చు. సంపూర్ణంగా చెరిపివేయబడే ఈ కవితాత్మక సందర్భంలో ‘భూమి’ విశాల భావాన్ని ఇస్తుంది; ‘మీద నుండి’ తెలుగు వాక్యనిర్మాణంలో సహజంగా ఉంది.
- source_word: וְלֹא שֵׁם לוֹ
  choice: అతనికి పేరు ఉండదు
  rationale: ఇక్కడ ‘పేరు’ గుర్తింపు, ఖ్యాతి, లేదా జ్ఞాపకంగా నిలిచే స్థానం అనే భావాన్ని కలిగి ఉంది. ఈ అనువాదం హీబ్రూ అస్తిత్వాత్మక నిర్మాణాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: עַל־פְּנֵי חוּץ
  choice: బహిరంగ స్థలంలో
  rationale: ఈ పదబంధం అక్షరార్థంగా బయట ప్రదేశపు ఉపరితలాన్ని సూచించినా, సందర్భంలో ప్రజలు కూడే వీధి లేదా బహిరంగ ప్రదేశాన్ని సూచిస్తుంది. ‘బహిరంగ స్థలంలో’ మూలంలోని విస్తృతతను కాపాడుతూ తెలుగులో సహజంగా ఉంటుంది.
