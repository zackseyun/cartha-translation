    text: లేదా, ‘దేశం నుండి అతని స్మరణ కనుమరుగవుతుంది; ప్రజలు కూడే చోట అతనికి పేరు ఉండదు.’
    reason: lexical_alternative
  revision_rationale: The revision makes the ablative expression more idiomatic and source-close, regularizes the footnote grammar, and retains the draft’s faithful rendering of remembrance, disappearance, and loss of public name.
