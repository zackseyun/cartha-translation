  text: For he is sent into a net by his own feet, and he walks onto a mesh.
translation:
  language: te
  text: 'ఎందుకంటే తన కాళ్లవల్లనే అతడు వలలోకి పంపబడతాడు;

    వలజాలిమీద అతడు నడుస్తాడు.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שֻׁלַּח
  choice: పంపబడతాడు
  rationale: పుయల్ కర్మణి రూపంలోని ‘పంపబడటం/విడిచిపెట్టబడటం’ అనే భావాన్ని నిలుపుతూ, వలలోకి నెట్టబడుతున్న చిత్రాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בְּרַגְלָיו
  choice: తన కాళ్ల చేతనే
  rationale: בְ సాధనార్థక ప్రయోగాన్ని, అలాగే అతని సొంత అడుగులే అతణ్ణి ఉచ్చులోకి తీసుకెళ్తున్నాయనే వ్యంగ్య చిత్రాన్ని కాపాడుతుంది.
- source_word: שְׂבָכָה
  choice: వల అల్లిక
  rationale: అల్లిన జాలి లేదా వలలాంటి ఉచ్చును సూచించే మూలపద చిత్రాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: יִתְהַלָּךְ
  choice: నడుస్తాడు
  rationale: హిత్పయేల్ రూపం ఇక్కడ అటూ ఇటూ నడవడం లేదా దానిమీద సాగడం అనే భావాన్ని ఇస్తుంది; సందర్భానికి సరళమైన ‘నడుస్తాడు’ సరిపోతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కవితా సమాంతరతను నిలిపాం. మొదటి పాదంలోని అసాధారణ కర్మణి నిర్మాణాన్ని సులభీకరించి కారణార్థకంగా మార్చకుండా, మూలంలోని ఉద్రిక్తతను అలాగే ఉంచాం.
