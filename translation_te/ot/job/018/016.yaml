  yaml_path: translation/ot/job/018/016.yaml
  text: His roots dry up beneath[a], and above, his branch withers.
translation:
  language: te
  text: 'కింద అతని వేర్లు ఎండిపోతాయి;

    పైన అతని కొమ్మ[a] నరికివేయబడుతుంది.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పైన అతని చిగురు వాడిపోతుంది.” హీబ్రూలోని నామవాచకం మొక్క పైభాగంలోని చిగురు లేదా కోయబడే భాగాన్ని సూచించవచ్చు; క్రియకు ‘వాడిపోవడం’ అనే అర్థమూ ఉండవచ్చు.
    reason: క్రియకు, నామవాచకానికి ఉన్న పదార్థ ప్రత్యామ్నాయాలను వేరువేరుగా స్పష్టం చేసి, వృక్ష రూపకంలోని సందిగ్ధతను నిలుపుటకు.
lexical_decisions:
- source_word: מִתַּחַת
  choice: కింద
  rationale: కింది స్థలాన్ని సూచించే పదం. తరువాతి పాదంలోని ‘పైన’ అనే పదంతో ఉన్న కవితాత్మక సమాంతరతను సహజంగా నిలుపుతుంది.
- source_word: שָׁרָשָׁיו
  choice: అతని వేర్లు
  rationale: మూలంలో బహువచనం, మూడవ పురుష ఏకవచన పుంలింగ ప్రత్యయం ఉన్నాయి; మొక్క రూపకాన్ని నేరుగా నిలుపుతుంది.
- source_word: יִבָשׁוּ
  choice: ఎండిపోతాయి
  rationale: יבשׁ ధాతువు ‘ఎండిపోవడం’ అనే భావాన్ని ఇస్తుంది; బహువచన క్రియను ‘వేర్లు’తో సరిపోల్చింది.
- source_word: וּמִמַּעַל
  choice: పైన
  rationale: మొదటి పాదంలోని ‘కింద’కు వ్యతిరేకమైన పైభాగాన్ని సూచిస్తూ కవితా సమాంతరతను కాపాడుతుంది.
- source_word: יִמַּל
  choice: నరికివేయబడుతుంది
  rationale: వృక్ష భాగం తెగిపోవడం లేదా నరికివేయబడడం అనే సాధ్యమైన భావాన్ని వ్యక్తం చేస్తుంది. ‘వాడిపోతుంది’ అనే మరో సాధ్యమైన భావాన్ని పాదసూచికలో ఉంచి మూలంలోని పదార్థ సందిగ్ధతను నిలిపాం.
- source_word: קְצִירוֹ
  choice: అతని కొమ్మ
  rationale: ఈ నామవాచకం సాధారణంగా కోత లేదా పంటను సూచించగలిగినా, ఇక్కడ ‘వేర్లు’కు సమాంతరంగా మొక్క పైభాగంలోని పెరుగుదలను సూచిస్తుంది; సాధారణ పాఠకునికి ‘కొమ్మ’ స్పష్టంగా, సహజంగా ఉంటుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన, గంభీరమైన కవితా శైలిని వాడాం. ‘కింద—పైన’ సమాంతరతను రెండు పాదాల నిర్మాణంలో స్పష్టంగా ఉంచాం.
