  text: when my steps were washed with curds[b][a], and the rock poured out for me streams of oil.
translation:
  language: te
  text: 'నా అడుగులు పెరుగుతో[a] కడుగబడినప్పుడు,

    రాతిబండ నా వద్ద[b] నూనె ప్రవాహాలను కుమ్మరించింది.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీగడతో” లేదా “వెన్నతో”; హెబ్రూ పదం చిక్కని పులిసిన పాలపదార్థం, మీగడ, లేదా వెన్నలాంటి పాలపదార్థాన్ని సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “నా కోసం”; హెబ్రూ పదబంధం అక్షరార్థంగా “నాతో” లేదా “నా పక్కన” అని ఉంటుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּרְחֹץ
  choice: కడుగబడినప్పుడు
  rationale: ב־తో కూడిన క్రియానామ రూపం గతకాల పరిస్థితిని సూచిస్తుంది; తెలుగులో ‘...బడినప్పుడు’ సహజంగా ఆ కాలసంబంధాన్ని తెలియజేస్తుంది.
- source_word: הֲלִיכַי
  choice: నా అడుగులు
  rationale: నడక లేదా జీవనగతిని సూచించగల ఈ పదానికి, సమృద్ధిని వర్ణించే స్పష్టమైన కవితా చిత్రాన్ని నిలుపుతూ ‘నా అడుగులు’ అని అనువదించాం.
- source_word: בְּחֵמָה
  choice: పెరుగుతో
  rationale: חֵמָה చిక్కని పులిసిన పాలపదార్థం, మీగడ, లేదా వెన్నలాంటి పదార్థాన్ని సూచించగలదు. ప్రాచీన పాలపదార్థపు భావాన్ని సాధారణ ఆధునిక తెలుగులో ‘పెరుగు’ సహజంగా అందిస్తుంది; ఇతర సాధ్యార్థాలు పాదసూచికలో ఉన్నాయి.
- source_word: וְצוּר
  choice: బండరాయి
  rationale: צוּר అంటే బండ లేదా రాతిబండ. నూనె ప్రవాహాలు దానినుంచి రావడం అనే ఆశ్చర్యకరమైన సమృద్ధి చిత్రాన్ని ‘బండరాయి’ స్పష్టంగా నిలుపుతుంది.
- source_word: יָצוּק
  choice: కుమ్మరించినప్పుడు
  rationale: יצק యొక్క ప్రధాన భావం పోయడం లేదా కుమ్మరించడం. ‘కుమ్మరించడం’ విస్తారంగా లభించిన అనుగ్రహం అనే కవితా చిత్రానికి తగిన బలాన్ని ఇస్తుంది.
- source_word: עִמָּדִי
  choice: నా పక్కనే
  rationale: ఈ పదబంధం అక్షరార్థంగా ‘నాతో’ లేదా ‘నా పక్కన’ అని స్థలసామీప్యాన్ని సూచిస్తుంది. మూలంలోని నిజమైన సందిగ్ధతను పరిష్కరించకుండా ప్రధాన పాఠంలో స్థలార్థాన్ని ఉంచి, ప్రయోజనార్థమైన ‘నా కోసం’ను పాదసూచికలో ఇచ్చాం.
- source_word: פַּלְגֵי
  choice: ప్రవాహాలను
  rationale: פַּלְגֵי ప్రవహించే కాలువలు లేదా నీటిపాయలను సూచిస్తుంది. నూనెతో కలిసిన కవితా రూపకంలో ‘ప్రవాహాలు’ సహజంగా, సజీవంగా ఉంటుంది.
- source_word: שָׁמֶן
  choice: నూనె
  rationale: שָׁמֶן సాధారణంగా నూనెను, సందర్భానుసారం ఒలీవ నూనెను సూచిస్తుంది. మూలంలోని సంక్షిప్తతను కాపాడేందుకు ‘నూనె’ అని ఉంచాం.
