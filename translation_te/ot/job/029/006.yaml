translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గంభీరమైన కవితా శైలిని ఉపయోగించాం. వాక్యం సందర్భంలోని జ్ఞాపకవర్ణనను అనుసరించే కాలవాచక ఉపవాక్యంగా ఉంచబడింది. రెండు పాదాల సమాంతర కవితా నిర్మాణం నిలుపబడింది.
