  text: For when an ear heard[a], it called me blessed, and when an eye saw, it testified for me.
translation:
  language: te
  text: ఎందుకంటే చెవి విన్నప్పుడు నన్ను ధన్యుడని ప్రకటించింది; కన్ను చూసినప్పుడు నాకు అనుకూలంగా సాక్ష్యమిచ్చింది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: మునుపటి వచనాల్లో యోబుకు లభించిన గౌరవానికి కారణాన్ని పరిచయం చేస్తుంది; తెలుగు వాక్యప్రవాహంలో కారణార్థం సహజంగా వ్యక్తమవుతుంది.
- source_word: אֹזֶן שָׁמְעָה
  choice: చెవి విన్నప్పుడు
  rationale: హీబ్రూలోని ఏకవచన శరీరాంగ రూపకాన్ని, ఎవరైనా విన్నారనే సామాన్యార్థంతో, సాధ్యమైనంత దగ్గరగా నిలుపుతుంది.
- source_word: וַתְּאַשְּׁרֵנִי
  choice: నన్ను ధన్యుడని కొనియాడింది
  rationale: ఎవరినైనా ధన్యుడు లేదా భాగ్యవంతుడు అని ప్రకటించే అనుకూల మూల్యాంకనాన్ని తెలియజేస్తుంది; కేవలం ‘సంతోషవంతుడు’ అనే బలహీన భావాన్ని నివారిస్తుంది.
- source_word: וְעַיִן רָאֲתָה
  choice: కన్ను చూసినప్పుడు
  rationale: ‘చెవి విన్నప్పుడు’ అనే మొదటి అర్ధపాదంతో ఉన్న సంక్షిప్త సమాంతర నిర్మాణాన్ని కాపాడుతుంది.
- source_word: וַתְּעִידֵנִי
  choice: నా పక్షంగా సాక్ష్యమిచ్చింది
  rationale: עוד/עיד ధాతువు సూచించే సాక్ష్యమివ్వడం అనే భావాన్ని, సందర్భంలోని యోబుకు అనుకూలమైన సాక్ష్యంగా స్పష్టంగా తెలియజేస్తుంది.
