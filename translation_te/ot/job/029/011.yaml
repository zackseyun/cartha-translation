  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనదిగా, గంభీరమైనదిగా ఉంచుతూ, హీబ్రూ కవిత్వంలోని ‘చెవి/కన్ను’ ఏకవచన శరీరాంగ సమాంతర రూపకాన్ని నిలుపుకున్నాం.
