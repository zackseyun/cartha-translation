translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. మొదటి పాదంలోని ఆశ్చర్యభావాన్ని ఉంచుతూ, రెండో పాదంలోని వెలుగు రూపకాన్ని పాఠకునికి అర్థమయ్యే విధంగా నిలిపింది.
