  text: I smiled at them—they did not believe it[c][b][a]; and they did not cast down the light of my face.
translation:
  language: te
  text: నేను వారివైపు చిరునవ్వు చిందించగా, వారు దానిని నమ్మలేదు[a]; నా ముఖకాంతిని వారు మసకబార్చలేదు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నేను వారివైపు నవ్వగా, వారు దానిని నమ్మలేదు.” హీబ్రూ వాక్యం యోబు చూపిన ఆదరణను చూసి వారు ఆశ్చర్యపోయారనే భావాన్ని వ్యక్తం చేయవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా, “నా ముఖపు వెలుగును వారు పడవేయలేదు.” ఇది ప్రకాశవంతమైన లేదా అనుకూలమైన ముఖభావాన్ని సూచించే రూపకం.
    reason: cultural_note
lexical_decisions:
- source_word: אֶשְׂחַק
  choice: చిరునవ్వు నవ్వితే
  rationale: שׂחק నవ్వడం లేదా చిరునవ్వు నవ్వడం అనే అర్థాలు ఇవ్వగలదు. యోబు చూపిన ఆదరణకు సంబంధించిన ఈ సందర్భంలో ఎగతాళి భావం రాకుండా ‘చిరునవ్వు నవ్వితే’ సహజంగా సరిపోతుంది.
- source_word: אֲלֵהֶם
  choice: వారిని చూసి
  rationale: אֶל దిశను లేదా వ్యక్తివైపు తిరిగిన చర్యను సూచిస్తుంది. తెలుగులో చిరునవ్వుతో కలిపి ‘వారిని చూసి’ అనడం సహజమైన వ్యక్తిసంబంధ భావాన్ని ఇస్తుంది.
- source_word: לֹא יַאֲמִינוּ
  choice: వారు నమ్మలేకపోయారు
  rationale: అక్షరార్థం ‘వారు నమ్మలేదు.’ ఇక్కడ ఒక ప్రతిపాదనను తిరస్కరించడం కంటే యోబు ఆదరణ పొందినందుకు కలిగిన ఆశ్చర్యం ప్రధానంగా కనిపిస్తుంది; ‘నమ్మలేకపోయారు’ ఆ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וְאוֹר פָּנַי
  choice: నా ముఖకాంతిని
  rationale: ‘నా ముఖపు వెలుగు’ అనే హీబ్రూ చిత్రాన్ని తెలుగులో సంక్షిప్తంగా, గౌరవప్రదంగా నిలుపుతూ ప్రకాశవంతమైన లేదా అనుకూలమైన ముఖభావాన్ని సూచిస్తుంది.
- source_word: לֹא יַפִּילוּן
  choice: మసకబారనివ్వలేదు
  rationale: హిఫిల్ రూపం అక్షరార్థంగా ‘పడవేయలేదు’ అని ఉంటుంది. ‘ముఖకాంతి’తో కలిసినప్పుడు దానిని తగ్గించడం లేదా వాడిపోయేలా చేయడం భావం; తెలుగులో ‘మసకబారనివ్వలేదు’ వెలుగు రూపకాన్ని సహజంగా కాపాడుతుంది.
