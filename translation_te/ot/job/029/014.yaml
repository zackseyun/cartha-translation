  text: I put on righteousness[a], and it clothed me[b]; my justice was like a robe and a turban.
translation:
  language: te
  text: నేను నీతిని ధరించాను[a]; అది నన్ను ధరించింది. నా న్యాయం పైవస్త్రంలా, తలపాగాలా ఉండేది[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నేను న్యాయాన్ని ధరించాను; అది నన్ను ధరించింది.’ హీబ్రూ צֶדֶק అనే పదానికి ‘నీతి’ లేదా ‘న్యాయం’ అనే అర్థాలు రావచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ ‘తలపాగా’ అంటే తలకు చుట్టుకునే వస్త్రం; ఈ వచనంలో అది గౌరవం, ప్రజా ప్రతిష్ఠలను సూచించే వస్త్రచిత్రణలో భాగం.
    reason: cultural_note
lexical_decisions:
- source_word: צֶדֶק
  choice: నీతి
  rationale: צֶדֶק నీతి లేదా న్యాయం అనే భావాలను ఇవ్వగలదు. తరువాతి పాదంలోని מִשְׁפָּטִיని ‘నా న్యాయం’గా అనువదించినందున, ఇక్కడ ‘నీతి’ అని ఉంచడం రెండు పదాల మధ్య భావభేదాన్ని నిలుపుతుంది.
- source_word: לָבַשְׁתִּי
  choice: నేను ... ధరించాను
  rationale: לבש వస్త్రాన్ని ధరించడం లేదా వేసుకోవడం అనే సాధారణ అర్థం కలిగి ఉంది. ‘ధరించాను’ వస్త్రరూపకాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: וַיִּלְבָּשֵׁנִי
  choice: అది నన్ను ధరించింది
  rationale: మూలంలో అదే לבש ధాతువు మళ్లీ వచ్చి, నీతి కర్తగా యోబును ధరిస్తున్న కవితాత్మక విపర్యయాన్ని సృష్టిస్తుంది. కొంత అసాధారణంగా వినిపించినా ‘అది నన్ను ధరించింది’ ఆ ఉద్దేశపూర్వక రూపకాన్ని కాపాడుతుంది.
- source_word: כִּמְעִיל
  choice: అంగీలా
  rationale: מְעִיל గౌరవాన్ని సూచించే పొడవైన పైవస్త్రం లేదా అంగీ. ‘అంగీ’ ఆధునిక తెలుగు పాఠకులకు స్పష్టంగా ఉండి వస్త్రరూపకానికి సరిపోతుంది.
- source_word: וְצָנִיף
  choice: తలపాగాలా
  rationale: צָנִיף తలకు చుట్టుకునే వస్త్రాన్ని సూచిస్తుంది. ‘తలపాగా’ సహజమైన తెలుగు సమానార్థకం; గౌరవం, ప్రజా ప్రతిష్ఠల దృశ్యాన్ని కూడా నిలుపుతుంది.
- source_word: מִשְׁפָּטִי
  choice: నా న్యాయం
  rationale: מִשְׁפָּט తీర్పు, న్యాయం, న్యాయపూర్వక ఆచరణ అనే భావాలను కలిగి ఉంటుంది. సందర్భంలో యోబు ప్రజాజీవితంలోని న్యాయాచరణను ‘నా న్యాయం’ సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
