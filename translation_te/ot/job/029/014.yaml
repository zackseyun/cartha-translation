  source_fidelity: 'The draft correctly preserves the reciprocal clothing metaphor: Job puts on righteousness, and righteousness in turn clothes him. It also appropriately distinguishes צֶדֶק (“నీతి”) from מִשְׁפָּטִי (“నా న్యాయం”). The final comparison, however, is more precise with a term explicitly denoting an outer garment for מְעִיל.'
