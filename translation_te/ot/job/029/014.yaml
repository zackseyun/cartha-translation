translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కవితా శైలిని ఉపయోగించాం. ‘నేను నీతిని ధరించాను; అది నన్ను ధరించింది’ అనే ఉద్దేశపూర్వక పునరుక్తి మరియు కర్త-కర్మ విపర్యయాన్ని సరళీకరించకుండా నిలిపాం. రెండు ఉపమానాలకూ ‘లా’ రూపాన్ని వాడి తెలుగు వాక్యాన్ని సహజంగా ఉంచాం.
