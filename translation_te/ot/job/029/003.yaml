translation:
  language: te
  text: 'ఆయన దీపం నా తలపై ప్రకాశించినప్పుడు,

    ఆయన వెలుగుతో నేను చీకటిలో నడిచాను.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దాని వెలుగుతో నేను చీకటిలో నడిచాను.” “ఆయన/దాని వెలుగు” అనే హీబ్రూ రూపంలోని ప్రత్యయం సందర్భానుసారంగా దేవునిని సూచించవచ్చు; లేదా దానికి వెంటనే ముందున్న దీపాన్ని సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּהִלּוֹ נֵרוֹ
  choice: ఆయన దీపం ... ప్రకాశించినప్పుడు
  rationale: בְּ + క్రియానామ రూపం ఇక్కడ కాలార్థాన్ని ఇస్తుంది. נֵר అనే స్పష్టమైన దీపపు రూపకాన్ని నిలిపి, సహజమైన తెలుగు వాక్యనిర్మాణంలో ‘ప్రకాశించినప్పుడు’ అని అనువదించాం.
- source_word: עֲלֵי רֹאשִׁי
  choice: నా తలపై
  rationale: ఇది స్థలార్థక పదబంధం. ‘నా తలపై’ ఆధునిక తెలుగులో సహజంగా ఉండి, పైనుంచి వెలిగే దీపం చిత్రాన్ని నిలుపుతుంది.
- source_word: לְאוֹרוֹ
  choice: ఆయన వెలుగుతో
  rationale: לְ ఇక్కడ సాధన లేదా ఆధార భావాన్ని సూచిస్తుంది. 3వ పురుష ఏకవచన ప్రత్యయం సందర్భంలో దేవునిని సూచించవచ్చు; అందువల్ల ప్రధాన పాఠంలో ‘ఆయన’ను ఉంచాం. సమీపంలోని ‘దీపం’ను సూచించే అవకాశాన్ని పాదసూచికలో నిలిపాం.
- source_word: אֵלֶךְ
  choice: నేను ... నడిచాను
  rationale: రూపపరంగా అసంపూర్ణ క్రియ అయినా, యోబు గతకాలపు అనుభవాన్ని జ్ఞాపకం చేసుకుంటున్న సందర్భంలో ఇది గతంలో జరిగిన లేదా అలవాటైన చర్యను తెలుపుతుంది. ‘నడిచాను’ నేరుగా, సహజంగా ఉంది.
- source_word: חֹשֶׁךְ
  choice: చీకటిలో
  rationale: హీబ్రూ పదంలో ‘గుండా’ అనే ప్రత్యేక పూర్వప్రత్యయం లేదు. కాబట్టి మూలంలోని స్థితి మరియు ఉద్దేశపూర్వక అస్పష్టతను కాపాడుతూ ‘చీకటిలో’ అని ఇచ్చాం.
theological_decisions:
- issue: 3వ పురుష ఏకవచన ప్రత్యయాల సూచ్యం—‘ఆయన దీపం’, ‘ఆయన/దాని వెలుగు’
  choice: ప్రధాన పాఠంలో ప్రత్యయాలు దేవునిని సూచిస్తున్నట్లుగా ‘ఆయన’ అని అనువదించడం
  alternative: రెండవ ప్రత్యయం సమీపంలోని దీపాన్ని సూచిస్తున్నట్లుగా ‘దాని వెలుగుతో’ అని అనువదించడం
  rationale: యోబు 29 సందర్భంలో యోబు దేవుని కాపుదల, అనుగ్రహాన్ని జ్ఞాపకం చేసుకుంటున్నాడు; అందువల్ల దేవుని సూచన ప్రధాన పఠనం. అయితే לְאוֹרוֹ లోని ప్రత్యయం వ్యాకరణపరంగా సమీపంలోని దీపాన్ని కూడా సూచించగలదు కాబట్టి ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. ‘దీపం’, ‘వెలుగు’, ‘చీకటి’ అనే మూలంలోని స్పష్టమైన కవితాత్మక రూపకాలను నిలిపాం. పాదసూచిక గుర్తు [a] ప్రధాన పాఠంలో చేర్చబడింది.
