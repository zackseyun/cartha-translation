translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. హీబ్రూ వాక్యంలో రెండవ కర్మకు క్రియ అధ్యాహారంగా ఉన్నందున తెలుగులో స్పష్టత కోసం ‘రక్షించాను’ పునరుక్తి చేయబడింది.
