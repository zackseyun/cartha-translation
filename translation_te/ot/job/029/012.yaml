  yaml_path: translation/ot/job/029/012.yaml
  text: For I delivered the poor who cried for help[a], and the fatherless who had no helper.
translation:
  language: te
  text: ఎందుకంటే, సహాయం కోసం మొరపెట్టిన పేదవాణ్ణి నేను రక్షించాను; ఆదుకునేవాడు లేని తండ్రిలేనివాణ్ణి కూడా రక్షించాను.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అనాథను.” హీబ్రూ పదం మరింత నిర్దిష్టంగా తండ్రి లేని, సామాజికంగా బలహీన స్థితిలో ఉన్న వ్యక్తిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి సందర్భంలో యోబుకు లభించిన గౌరవానికి కారణాన్ని పరిచయం చేస్తుంది.
- source_word: אֲמַלֵּט
  choice: నేను రక్షించాను
  rationale: మלט పియేల్ రూపం చురుకుగా ప్రమాదం లేదా దుస్థితి నుంచి విడిపించడాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘రక్షించాను’ సహజంగా ఉంది.
- source_word: עָנִי
  choice: పేదవాణ్ణి
  rationale: ఈ సామాజిక న్యాయ సందర్భంలో పేదరికంతో, బలహీన స్థితిలో ఉన్న వ్యక్తిని సూచించే స్పష్టమైన రూపం.
- source_word: מְשַׁוֵּעַ
  choice: సహాయం కోసం మొరపెట్టిన
  rationale: సహాయం కోరుతూ కేకవేయడం అనే కొనసాగుతున్న చర్యను సహజమైన తెలుగు విశేషణ ఉపవాక్యంగా వ్యక్తం చేస్తుంది.
- source_word: יָתוֹם
  choice: తండ్రిలేనివాణ్ణి
  rationale: హీబ్రూ పదం ప్రత్యేకంగా తండ్రిని కోల్పోయిన సామాజికంగా బలహీన వ్యక్తిని సూచిస్తుంది; ‘అనాథ’ కంటే ఈ భావాన్ని కచ్చితంగా నిలుపుతుంది.
- source_word: וְלֹא עֹזֵר לוֹ
  choice: ఆదుకునేవాడు లేని
  rationale: అతనికి తోడ్పడే వ్యక్తి ఎవరూ లేరనే భావాన్ని సంక్షిప్తంగా, సహజంగా తెలుపుతుంది.
