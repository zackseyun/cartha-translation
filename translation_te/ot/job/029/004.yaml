id: JOB.29.4
reference: Job 29:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כַּ/אֲשֶׁ֣ר הָ֭יִיתִי בִּ/ימֵ֣י חָרְפִּ֑/י בְּ/ס֥וֹד אֱ֝ל֗וֹהַּ עֲלֵ֣י אָהֳלִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/job/029/004.yaml
  text: as I was in the days of my prime[a], when God's intimate counsel was over my tent[b],
translation:
  language: te
  text: నేను నా వర్ధిల్లిన దినాల్లో ఉన్నట్లుగా[a], దేవుని అంతరంగ సలహా నా గుడారంపై ఉండినప్పుడు[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నా శరదృతువు దినాల్లో’; అంటే పూర్తి పరిపక్వత లేదా వర్ధిల్లిన కాలంలో.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘దేవుని రహస్య సలహా నా గుడారంపై ఉండినప్పుడు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: ఉన్నట్లుగా
  rationale: యోబు మునుపటి దినాలను తిరిగి కోరుకుంటున్న పోలికను సూచించే కణం; తెలుగు వాక్యంలో పోలిక భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: הָיִיתִי
  choice: నేను ... ఉన్న
  rationale: Qal perfect మొదటి పురుష ఏకవచనం; గతస్థితిని సూచిస్తుంది.
- source_word: בִּימֵי
  choice: రోజుల్లో
  rationale: కాలాన్ని సూచించే నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: חָרְפִּי
  choice: నా పరిపక్వకాలపు
  rationale: ‘శరదృతువు/కోతకాలం’ అనే మూలచిత్రం నుంచి సంపూర్ణ వికాసం లేదా పరిపక్వత దశ అనే భావం వస్తుంది; ‘యౌవనం’ అని కుదించకుండా సందర్భానుగుణ అర్థాన్ని ఇస్తుంది.
- source_word: בְּסוֹד
  choice: ఆంతరంగిక ఆలోచన
  rationale: סוֹד లోని రహస్య సలహా, సన్నిహిత సహవాసం అనే రెండు ఛాయలనూ సాధ్యమైనంతవరకు నిలుపుతుంది; కేవలం స్నేహం లేదా ప్రత్యక్ష ప్రకటనగా పరిమితం చేయదు.
- source_word: אֱלוֹהַּ
  choice: దేవుని
  rationale: సంబంధ విభక్తితో దేవునికి చెందిన ఆంతరంగిక ఆలోచనను సూచిస్తుంది.
- source_word: עֲלֵי
  choice: పై ఉన్నప్పుడు
  rationale: యోబు గుడారం మీద వ్యాపించి ఉన్న దైవసాన్నిధ్యం లేదా అనుగ్రహం అనే స్థలరూపకాన్ని నిలుపుతుంది.
- source_word: אָהֳלִי
  choice: నా గుడారం
  rationale: ఇల్లు లేదా కుటుంబం అనే విస్తృత సూచన ఉండగలిగినా, హీబ్రూ పాఠంలోని స్పష్టమైన గుడారం చిత్రాన్ని నిలుపుతుంది.
theological_decisions:
- issue: בְּסוֹד אֱלוֹהַּలో యోబుకు దేవునితో ఉన్న పూర్వ సంబంధం
  choice: దేవుని ఆంతరంగిక ఆలోచన యోబు గుడారంపై ఉండడం
  alternative: దేవుని రహస్యాలోచన నా గుడారంపై ఉండడం; దేవుని స్నేహం నా గుడారంపై ఉండడం
  rationale: హీబ్రూ పదం రహస్య సలహా, సన్నిహిత సహవాసం, అనుగ్రహపూర్వక సాన్నిధ్యం అనే భావాలను మోస్తుంది. అనువాదం దానిని కేవలం స్నేహంగా గానీ, ప్రత్యేక ప్రత్యక్ష ప్రకటనగా గానీ నిర్ధారించకుండా ఆ భావవిస్తృతిని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కవితాత్మక గౌరవభావాన్ని నిలుపుతూ సాధారణ పాఠకుడికి అర్థమయ్యే పదజాలం వాడబడింది. ఇది 29:2లో ప్రారంభమైన కోరిక/స్మరణ వాక్యానికి కొనసాగింపు కావడంతో చివర అల్పవిరామం ఉంచబడింది.
