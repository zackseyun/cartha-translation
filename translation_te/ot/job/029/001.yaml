translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని వాడాం. హీబ్రూ ప్రయోగంలోని రెండు క్రియలను తెలుగులో బలవంతంగా విడివిడిగా అనువదించకుండా, వాటి సమగ్ర భావాన్ని ‘ప్రసంగాన్ని కొనసాగిస్తూ’ అని తెలిపాం; మాషాల్ పదంలోని నిజమైన అర్థవిస్తృతిని పాదటిప్పణిలో నిలిపాం.
