  text: וַ/יֹּ֣סֶף אִ֭יּוֹב שְׂאֵ֥ת מְשָׁל֗/וֹ וַ/יֹּאמַֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/job/029/001.yaml
  text: And Job continued, taking up his discourse, and said:[a]
translation:
  language: te
  text: యోబు తన ప్రసంగాన్ని మరల చేపట్టి ఇలా అన్నాడు:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘తన సామెతను,’ ‘తన ఉపమాన వాక్యాన్ని,’ లేదా ‘తన ప్రవచనాత్మక ఉక్తిని.’ హీబ్రూ పదమైన మాషాల్‌కు విస్తృత అర్థపరిధి ఉంది; ఇక్కడ అది యోబు చెప్పే దీర్ఘమైన కవితాత్మక ప్రసంగాన్ని పరిచయం చేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּסֶף
  choice: కొనసాగిస్తూ
  rationale: יסף అనే క్రియకు ‘జోడించు’ లేదా ‘కొనసాగించు’ అనే అర్థాలు ఉన్నాయి. తరువాత వచ్చే క్రియారూపంతో కలిసి ఇక్కడ యోబు మరల తన ప్రసంగాన్ని కొనసాగించాడనే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: אִיּוֹב
  choice: యోబు
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: שְׂאֵת
  choice: ప్రసంగాన్ని కొనసాగిస్తూ
  rationale: נשׂא యొక్క మూలచిత్రం ‘ఎత్తుకొను’; נשׂא משל అనే ప్రయోగం ఒక కవితాత్మక వాక్యప్రవాహాన్ని చేపట్టి పలకడాన్ని సూచిస్తుంది. తెలుగులో ‘ప్రసంగాన్ని కొనసాగిస్తూ’ ఆ ప్రయోగార్థాన్ని సహజంగా అందిస్తుంది.
- source_word: מְשָׁלוֹ
  choice: తన ప్రసంగాన్ని
  rationale: מָשָׁל సామెత, ఉపమానకథ, సూక్తి, ప్రవచనాత్మక ఉక్తి లేదా విస్తృత కవితాత్మక ప్రసంగం అనే విస్తృత అర్థపరిధి కలిగిన పదం. ఇక్కడ దీర్ఘమైన కవితాత్మక మాటలను పరిచయం చేస్తున్నందున ‘ప్రసంగం’ సందర్భానికి తగినది; ఇతర సాధ్యార్థాలను పాదటిప్పణిలో ఉంచాం.
- source_word: וַיֹּאמַר
  choice: ఇలా అన్నాడు
  rationale: ప్రత్యక్ష ప్రసంగాన్ని పరిచయం చేసే సాధారణ కథన రూపం; ఆధునిక తెలుగులో సహజంగా ఉంటుంది.
