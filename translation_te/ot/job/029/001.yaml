    text: లేదా ‘తన సామెతను,’ ‘తన ఉపమాన వాక్యాన్ని,’ లేదా ‘తన ప్రవచనాత్మక ఉక్తిని.’ హీబ్రూ పదమైన మాషాల్‌కు విస్తృత అర్థపరిధి ఉంది; ఇక్కడ అది యోబు చెప్పే దీర్ఘమైన కవితాత్మక ప్రసంగాన్ని పరిచయం చేస్తుంది.
    reason: lexical_alternative
