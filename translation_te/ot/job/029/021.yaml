  yaml_path: translation/ot/job/029/021.yaml
  text: They listened to me and waited[b][a], and they kept silent for my counsel.
translation:
  language: te
  text: వారు నా మాట శ్రద్ధగా విని, వేచి ఉండేవారు[a]; నా సలహా కోసం మౌనంగా ఉండేవారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆశతో ఎదురుచూసేవారు.’ ఈ క్రియకు ఆశించడం లేదా ఎదురుచూడడం అనే భావం కూడా ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘నా సలహా విని మౌనంగా ఉండేవారు.’ చివరి పదబంధం యోబు సలహాకు ప్రతిస్పందనగా వారు మౌనంగా ఉన్నారని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִי שָׁמְעוּ
  choice: నా మాట శ్రద్ధగా విని
  rationale: לִיతో కూడిన שׁמע ఇక్కడ కేవలం వినబడటాన్ని కాక, యోబు మాటకు శ్రద్ధ చూపి వినడాన్ని సూచిస్తుంది. సహజమైన ఆధునిక తెలుగులో ‘నా మాట శ్రద్ధగా విని’ ఆ భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: וְיִחֵלּוּ
  choice: నిరీక్షణతో వేచియుండేవారు
  rationale: יחל అనే క్రియలో వేచియుండటం, ఆశించడం లేదా ఎదురుచూడటం అనే భావాలు కలిసివున్నాయి. ‘నిరీక్షణతో వేచియుండేవారు’ ఆ ఆశాభరిత నిరీక్షణను నిలుపుతుంది.
- source_word: וְיִדְּמוּ
  choice: మౌనంగా ఉండేవారు
  rationale: דמם ఇక్కడ నిశ్శబ్దంగా లేదా స్థిమితంగా ఉండటాన్ని సూచిస్తుంది. సందర్భంలో యోబు సలహా కోసం ఇతరులు మాటాడకుండా ఉండటమే ప్రధాన భావం.
- source_word: לְמוֹ עֲצָתִי
  choice: నా సలహా కోసం
  rationale: కావ్యాత్మక לְמוֹ, עֲצָתִיతో కలిసి వారి మౌనం యోబు సలహాకై ఉన్నదని తెలియజేస్తుంది. ‘సలహా’ ఆధునిక పాఠకులకు సహజంగా ఉండి, జ్ఞానోపదేశ సందర్భాన్ని కాపాడుతుంది.
