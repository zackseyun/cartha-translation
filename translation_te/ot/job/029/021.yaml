translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. యోబు గతంలో అలవాటుగా జరిగిన ప్రవర్తనను వివరిస్తున్నందున ‘వినేవారు/ఉండేవారు’ భావాన్ని కొనసాగించే రూపాలు ఎంచుకోబడ్డాయి. మూలంలోని నిరీక్షణ భావం మరియు చివరి పదబంధంలోని సంబంధ అస్పష్టత పాదసూచికల్లో నిలుపబడ్డాయి.
