source:
  edition: WLC
  text: כְּ֭בוֹדִ/י חָדָ֣שׁ עִמָּדִ֑/י וְ֝/קַשְׁתִּ֗/י בְּ/יָדִ֥/י תַחֲלִֽיף׃
base_translation:
  language: en
  yaml_path: translation/ot/job/029/020.yaml
  text: My glory was ever fresh with me[b][a], and my bow was renewed in my hand.
translation:
  language: te
  text: నా మహిమ నాతో ఎల్లప్పుడూ తాజాగా ఉండేది[a]; నా చేతిలో నా విల్లు పునరుద్ధరించబడేది[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నా మహిమ నాతో కొత్తగా ఉండేది.’ హీబ్రూ విశేషణానికి ‘కొత్త’ అని అర్థం; సందర్భంలో అది ఎప్పటికప్పుడు తాజాగా, వాడిపోకుండా ఉండడాన్ని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘విల్లు’ ఇక్కడ బలం లేదా శక్తికి రూపకం కావచ్చు; అయితే హీబ్రూ పాఠ్యం స్పష్టమైన విల్లు చిత్రాన్నే ఉంచుతుంది.
    reason: cultural_note
lexical_decisions:
- source_word: כְּבוֹדִי
  choice: నా మహిమ
  rationale: כָּבוֹד అనే పదం మహిమ, ఘనత, గౌరవం అనే భావాలను కలిగి ఉంది. ‘నా మహిమ’ మూలంలోని విస్తృతమైన కవితాత్మక భావాన్ని కాపాడుతుంది.
- source_word: חָדָשׁ
  choice: నిత్యం నూతనంగా
  rationale: మూలపదానికి అక్షరార్థంగా ‘కొత్తగా’ అనే భావం ఉంది; ఈ సందర్భంలో అది వాడిపోకుండా తాజాగా కొనసాగడాన్ని సూచిస్తుంది. ‘నిత్యం నూతనంగా’ ఆ కొనసాగింపు భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: עִמָּדִי
  choice: నాతో
  rationale: ఈ పూర్వప్రత్యయ రూపానికి నేరుగా ‘నాతో’ అని అర్థం; యోబు మహిమ అతనిని విడిచిపోకుండా ఉండిందనే సందర్భార్థాన్ని కూడా నిలుపుతుంది.
- source_word: קַשְׁתִּי
  choice: నా విల్లు
  rationale: కవిత్వంలో విల్లు బలానికి లేదా శౌర్యానికి రూపకం కావచ్చు; అయినా మూలంలోని స్పష్టమైన వస్తు చిత్రాన్ని ప్రధాన పాఠ్యంలో అలాగే ఉంచడం సముచితం.
- source_word: בְּיָדִי
  choice: నా చేతిలో
  rationale: మూలంలోని స్థానార్థకమైన మాటను సహజమైన తెలుగులో నేరుగా ప్రతిబింబిస్తుంది.
- source_word: תַחֲלִיף
  choice: మళ్లీ బలాన్ని పొందేది
  rationale: חלף హిఫిల్ రూపం ఇక్కడ మారిపోవడం లేదా భర్తీ కావడం కంటే పునరుద్ధరణను, కొత్త బలం పొందడాన్ని సూచిస్తుంది. తెలుగులో విల్లు స్వయంగా ‘పునరుద్ధరించబడేది’ అనడం కంటే ఈ రూపం సహజంగా ఉండి, మూలభావాన్ని తెలియజేస్తుంది.
