translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, కవితాత్మక గౌరవాన్ని నిలుపుతూ సాధారణ పాఠకులకు స్పష్టంగా ఉండే శైలి. హీబ్రూ ఏకవచనం, దిశార్థం, రాత్రి నిలిచే భావం, చివరి పదంలోని సందిగ్ధత అన్నీ సాధ్యమైనంతవరకు పరిరక్షించబడ్డాయి.
