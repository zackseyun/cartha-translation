  yaml_path: translation/ot/job/029/019.yaml
  text: My roots were spread out to the waters[a], and dew stayed overnight on my branches.
translation:
  language: te
  text: నా వేరు నీళ్లవైపు విస్తరించి ఉండేది; నా కొమ్మల మీద[a] మంచు రాత్రంతా నిలిచి ఉండేది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నా పంటకోతలో.’ ఇక్కడి హీబ్రూ పదం సాధారణంగా ‘కోత’ లేదా ‘పంటకోత’ అని అర్థమిస్తుంది; అయితే ఈ సందర్భంలో వేరు, మంచు అనే వృక్షరూపకానికి ‘కొమ్మలు’ అనే భావం మరింత సహజంగా సరిపోతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁרְשִׁי
  choice: నా వేరు
  rationale: హీబ్రూలో ఇది ఏకవచన రూపంలో ఉన్నందున తెలుగులోనూ ఏకవచనాన్ని నిలిపి, మొక్కకు సంబంధించిన రూపకాన్ని సహజంగా వ్యక్తం చేశాం.
- source_word: פָתוּחַ
  choice: విస్తరించి ఉండేది
  rationale: తెరచి లేదా చాపబడి ఉన్న స్థితిని సూచించే ఈ కృదంతాన్ని, నీటివైపు పెరిగిన వేరు చిత్రానికి సరిపోయే సహజమైన తెలుగులో అందించాం.
- source_word: אֱלֵי מָיִם
  choice: నీళ్లవైపు
  rationale: אֱלֵי లోని దిశార్థాన్ని ‘వైపు’ నిలుపుతుంది; מָיִם ను సాధారణ ఆధునిక తెలుగు వాడుకలోని ‘నీళ్లు’గా అనువదించాం.
- source_word: וְטַל
  choice: మంచు
  rationale: టַל అంటే రాత్రివేళ ఏర్పడే dew; తెలుగులో సందర్భానుసారంగా సహజమైన ‘మంచు’ను ఎంచుకున్నాం.
- source_word: יָלִין
  choice: రాత్రంతా నిలిచి ఉండేది
  rationale: לון క్రియలోని రాత్రి గడపడం లేదా రాత్రిపూట నిలిచి ఉండడం అనే కాలసూచక భావాన్ని స్పష్టంగా నిలిపాం.
- source_word: בִּקְצִירִי
  choice: నా కొమ్మల మీద
  rationale: సాధారణంగా קָצִיר అంటే ‘కోత/పంటకోత’; అయితే వేరు, మంచు అనే వృక్షరూపక సందర్భంలో కొమ్మలు లేదా పెరుగుదలను సూచించే అరుదైన భావం సహజంగా సరిపోతుంది. పాఠంలోని నిజమైన సందిగ్ధతను పాదటిప్పణిలో ఉంచాం.
