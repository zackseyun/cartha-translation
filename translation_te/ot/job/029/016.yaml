  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సహజమైన న్యాయసంబంధ పదజాలాన్ని వాడాం. ‘తండ్రి’ అనే మూలరూపకాన్ని వ్యాఖ్యానాత్మక పదంతో భర్తీ చేయకుండా నిలిపాం; వాక్యానికి కావ్యాత్మక సమతుల్యత ఉండేలా రెండు పాదాలుగా అమర్చాం.
