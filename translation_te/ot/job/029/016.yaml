  source_fidelity: 'హీబ్రూ వచనంలోని రెండు ప్రధాన వాక్యభాగాలనూ అనువాదం విశ్వసనీయంగా ప్రతిబింబిస్తుంది: אָב ను రూపకార్థాన్ని కోల్పోకుండా “తండ్రిగా,” לָאֶבְיוֹנִים ను “నిరుపేదలకు,” רִיב ను న్యాయసందర్భానికి తగిన “వ్యాజ్యం,” మరియు חקר ను “క్షుణ్ణంగా విచారించు”గా ఇచ్చింది. ‘నాకు తెలియని’ అనేది హీబ్రూలోని లֹא יָדַעְתִּיకి సాధ్యమైన ప్రధాన అన్వయం; ప్రత్యామ్నాయ వ్యక్తి-సంబంధ అన్వయాన్ని పాదటిప్పణి సముచితంగా భద్రపరుస్తుంది.'
