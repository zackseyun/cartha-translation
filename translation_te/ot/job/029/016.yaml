  text: I was a father to the poor[a], and I investigated the case of one I did not know.
translation:
  language: te
  text: 'నేను నిరుపేదలకు తండ్రిగా ఉండేవాణ్ణి;

    నాకు తెలియని వ్యాజ్యాన్ని క్షుణ్ణంగా విచారించేవాణ్ణి.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నాకు పరిచయం లేనివాని వ్యాజ్యాన్ని క్షుణ్ణంగా విచారించేవాణ్ణి.”
    reason: ‘నాకు తెలియని’ అనే మాట వ్యాజ్యాన్నే సూచించవచ్చు; లేదా యోబుకు పరిచయం లేని వ్యక్తి వ్యాజ్యాన్ని సూచించవచ్చు. హీబ్రూ వాక్యనిర్మాణం ఈ రెండు అన్వయాలకు అవకాశం ఇస్తుంది.
lexical_decisions:
- source_word: אָב
  choice: తండ్రి
  rationale: మూలంలోని ‘తండ్రి’ అనే రూపకాన్ని నిలిపి, నిరుపేదల పట్ల యోబు చూపిన సంరక్షణను, పక్షపోషణను వ్యక్తం చేస్తుంది.
- source_word: אָנֹכִי
  choice: నేను ... ఉండేవాణ్ణి
  rationale: స్వతంత్ర సర్వనామంలోని ఉద్ఘాటనను ‘నేను’ నిలుపుతుంది; అధ్యాయం వర్ణిస్తున్న గతకాల పరిస్థితికి అనుగుణంగా క్రియను గతకాల అలవాటు రూపంలో ఇచ్చాం.
- source_word: לָאֶבְיוֹנִים
  choice: నిరుపేదలకు
  rationale: אֶבְיוֹן ఆర్థికంగా లేదా సామాజికంగా సహాయం అవసరమైన పేదవారిని సూచిస్తుంది. ‘నిరుపేదలు’ ఆధునిక, గౌరవప్రదమైన తెలుగు పదం.
- source_word: וְרִיב
  choice: వ్యాజ్యాన్ని
  rationale: רִיב వివాదం, న్యాయవాదం లేదా న్యాయపరమైన కేసును సూచించగలదు. ఈ సందర్భంలోని న్యాయవిచారణ భావాన్ని ‘వ్యాజ్యం’ సంక్షిప్తంగా అందిస్తుంది.
- source_word: לֹא יָדַעְתִּי
  choice: నాకు తెలియని
  rationale: ఈ మాటను వ్యాజ్యానికి సంబంధించినదిగా సహజంగా అన్వయించాం; అయితే అది వ్యాజ్యం పెట్టిన వ్యక్తితో పరిచయం లేకపోవడాన్ని కూడా సూచించవచ్చు. ఆ ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: אֶחְקְרֵהוּ
  choice: క్షుణ్ణంగా విచారించేవాణ్ణి
  rationale: חקר లోతుగా వెదికి తెలుసుకోవడం లేదా పరిశీలించడం అనే భావాన్ని ఇస్తుంది. ‘క్షుణ్ణంగా విచారించడం’ న్యాయసందర్భానికి సరిపోతూ ఆ శ్రద్ధను తెలియజేస్తుంది.
