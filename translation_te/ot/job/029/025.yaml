translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కవితాత్మక శైలి వాడబడింది. హీబ్రూ వాక్యంలోని నాయకత్వ దృశ్యం, రాజుతో పోలిక, దుఃఖితులను ఓదార్చే పాత్రను నిలిపాం; సందిగ్ధతలను పాదటిప్పణుల్లో స్పష్టంగా పేర్కొన్నాం.
