  yaml_path: translation/ot/job/029/025.yaml
  text: I chose their way and sat as chief[a]; I dwelt like a king among the troops[c][b], like one who comforts mourners.
translation:
  language: te
  text: నేను వారి మార్గాన్ని ఎంచుకొని, నాయకుడిగా కూర్చున్నాను[a]; సైనిక దళం మధ్య రాజులా నివసించాను[b], దుఃఖించేవారిని ఓదార్చే వానిలా ఉన్నాను[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నేను వారి మార్గాన్ని నిర్ణయించి, అగ్రస్థానంలో కూర్చున్నాను.” హీబ్రూ వాక్యం యోబు ఇతరులు అనుసరించాల్సిన మార్గాన్ని ఎంచుకున్నాడని లేదా ఆమోదించాడని, ఆపై నాయకత్వ స్థానాన్ని ఆక్రమించాడని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ఒక దళంలో రాజులా.” ఇక్కడి హీబ్రూ పదం సైనిక దళం, బృందం లేదా సమూహాన్ని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: చివరి పోలిక అర్థం చేసుకోవడం కష్టం. గౌరవస్థానంలో ఉన్నప్పటికీ యోబు దుఃఖించేవారిని ఓదార్చేవాడని ఇది సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶבֲחַר דַּרְכָּם
  choice: నేను వారి మార్గాన్ని ఎంచుకొని
  rationale: בחר అనే క్రియకు ‘ఎంచుకొను’ అనే ప్రత్యక్ష భావాన్ని, דַּרְכָּם అనే పదంలోని ‘వారి మార్గం’ భావాన్ని నిలుపుతుంది. యోబు 29లోని గతకాల జ్ఞాపక సందర్భానికి అనుగుణంగా క్రియను గత చర్యగా అనువదించాం.
- source_word: וְאֵשֵׁב רֹאשׁ
  choice: నాయకుడిగా కూర్చున్నాను
  rationale: ‘తలగా కూర్చోవడం’ అనే హీబ్రూ రూపకాన్ని తెలుగులో సహజమైన నాయకత్వ భావంతో వ్యక్తం చేస్తూనే, కూర్చోవడం అనే దృశ్యాన్ని నిలిపింది.
- source_word: וְאֶשְׁכּוֹן כְּמֶלֶךְ
  choice: రాజులా నివసించాను
  rationale: שׁכן యొక్క నివసించు/ఉండు భావాన్ని, כְּ ఉపసర్గ సూచించే స్పష్టమైన పోలికను కాపాడుతుంది.
- source_word: בַּגְּדוּד
  choice: సైనిక దళం మధ్య
  rationale: גְּדוּד అనేది దళం, బృందం లేదా సైనిక సమూహాన్ని సూచించగలదు. రాజు నాయకత్వ సందర్భంలో ‘సైనిక దళం’ సహజంగా ఉన్నా, పదంలోని విస్తృతార్థాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: כַּאֲשֶׁר אֲבֵלִים יְנַחֵם
  choice: దుఃఖించేవారిని ఓదార్చే వానిలా ఉన్నాను
  rationale: ఏకవచన క్రియ יְנַחֵם సూచించే ఓదార్చే వ్యక్తిని తెలుగులో స్పష్టంచేస్తూ, అబేలీమ్ అనే బహువచనంలోని దుఃఖితుల భావాన్ని సహజంగా అందిస్తుంది. ప్రధాన క్రియను తెలుగులో పూర్తి చేయడానికి ‘ఉన్నాను’ చేర్చబడింది.
