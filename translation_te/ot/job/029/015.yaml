translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన పదజాలం వాడబడింది. మూలంలోని కళ్లూ–కాళ్లూ అనే సమాంతర కవితాత్మక రూపకాలు, అలాగే చివరి ‘నేను’లోని ఉద్ఘాటన ‘నేనే’ ద్వారా నిలిపబడ్డాయి.
