lexical_decisions:
- source_word: עֵינַיִם
  choice: కళ్లుగా
  rationale: మార్గదర్శనం, ఆచరణాత్మక సహాయం అందించడాన్ని సూచించే స్పష్టమైన కవితాత్మక రూపకాన్ని అలాగే నిలిపింది.
- source_word: הָיִיתִי
  choice: ఉన్నాను
  rationale: యోబు గతంలో నిర్వర్తించిన పాత్రను లేదా స్థితిని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: לַעִוֵּר
  choice: చూపులేనివారికి
  rationale: లబ్ధిదారుని సూచించే ל భావాన్ని ‘వారికి’ ద్వారా తెలిపి, ఏకవచన సామాన్యార్థాన్ని సహజమైన గౌరవప్రద బహువచనంతో వ్యక్తం చేసింది.
- source_word: וְרַגְלַיִם
  choice: కాళ్లుగా
  rationale: మొదటి పాదంలోని ‘కళ్లుగా’ అనే రూపకానికి సమాంతరంగా, చలనానికి తోడ్పడే భావాన్ని concrete image ద్వారా నిలిపింది.
- source_word: לַפִּסֵּחַ
  choice: కుంటివారికి
  rationale: నడకలో వైకల్యం ఉన్నవారిని సూచించే మూలపదానికి స్పష్టమైన, సాధారణ ఆధునిక తెలుగు రూపం; ל లోని ప్రయోజనార్థం ‘వారికి’ ద్వారా వ్యక్తమైంది.
- source_word: אָֽנִי
  choice: నేనే
  rationale: వాక్యాంతంలోని స్వతంత్ర సర్వనామం ఇచ్చే ఉద్ఘాటనను తెలుగులో సహజంగా నిలిపింది.
