translation:
  language: te
  text: 'దుర్మార్గుని కోరలను నేను విరగ్గొట్టాను;

    అతని పళ్ల మధ్యనుండి ఎరను విసిరివేశాను.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מְתַלְּעוֹת
  choice: కోరలు
  rationale: ఈ పదం దవడలు లేదా కోరలను సూచించగలదు. వేటాడే మృగం నోటిలోని ఎర అనే తరువాతి చిత్రంతో ‘కోరలు’ సహజంగా సరిపోతుంది.
- source_word: עַוָּל
  choice: దుర్మార్గుడు
  rationale: అన్యాయంగా, దుష్టంగా ప్రవర్తించే వ్యక్తిని సూచించే నైతిక పదం; ఆధునిక ప్రామాణిక తెలుగులో స్పష్టమైన రూపం.
- source_word: אַשְׁלִיךְ
  choice: విసిరివేశాను
  rationale: మూల క్రియ యొక్క సాధారణ అర్థం ‘విసరడం/పడవేయడం’. ‘లాక్కున్నాను’ అని ప్రత్యేకంగా మార్చకుండా మూలంలోని బలమైన చర్యను నిలుపుతుంది.
- source_word: טָרֶף
  choice: ఎర
  rationale: వేటాడి పట్టుకున్న జీవి లేదా దోపిడీ అనే భావం ఉంది. కోరలు, పళ్లు అనే రూపకానికి అనుగుణంగా ‘ఎర’ ఎంచుకోబడింది.
