  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన, ప్రత్యక్షమైన కవితా శైలి. హింసాత్మక రూపకాన్ని మృదువుపరచకుండా, మూలంలోని రెండు సమాంతర చర్యలను నిలుపుకున్నాం.
