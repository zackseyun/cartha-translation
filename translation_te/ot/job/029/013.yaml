  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: בִּרְכַּ֣ת אֹ֭בֵד עָלַ֣/י תָּבֹ֑א וְ/לֵ֖ב אַלְמָנָ֣ה אַרְנִֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/job/029/013.yaml
  text: The blessing of the perishing man came upon me[b][a], and I made the widow’s heart sing for joy.
translation:
  language: te
  text: నశించిపోతున్నవాని దీవెన నా మీదికి వచ్చింది[a]; విధవరాలి హృదయం ఆనందంతో పాడేలా చేశాను[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నాశనానికి దగ్గరగా ఉన్నవాని దీవెన నా మీదికి వచ్చింది.’ אֹבֵד అనే హీబ్రూ పదం నశించిపోతున్న, పతనమైన, లేదా మరణానికి దగ్గరగా ఉన్న వ్యక్తిని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘విధవరాలి హృదయాన్ని సంతోషింపజేశాను,’ లేదా ‘ఆనందంతో కేకలు వేయించాను.’
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּרְכַּת
  choice: దీవెన
  rationale: ఇది בְּרָכָה పదపు construct రూపం; తరువాతి participle‌తో కలసి ‘నశించిపోతున్నవాని దీవెన’ అనే సంబంధాన్ని సూచిస్తుంది.
- source_word: אֹבֵד
  choice: నశించిపోతున్నవాని
  rationale: אבד ధాతువు Qal participle; మరణం, దారిద్ర్యం లేదా సంపూర్ణ పతనం అనే ఒక్క భావానికే పరిమితం చేయకుండా, నాశనస్థితికి చేరుతున్న వ్యక్తి అనే విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: עָלַי
  choice: నా మీదికి
  rationale: చలనాన్ని సూచించే תבואతో కలిసి, దీవెన యోబు మీదికి రావడం అనే హీబ్రూ రూపకాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: תָּבֹא
  choice: వచ్చింది
  rationale: రూపపరంగా imperfect అయినా, యోబు 29లోని గతకాల స్మరణ సందర్భంలో దీనిని గతంలో జరిగినదిగా అనువదించడం సహజం.
- source_word: לֵב
  choice: హృదయం
  rationale: అంతరంగాన్ని, భావోద్వేగ కేంద్రాన్ని సూచించే సాధారణ మరియు గౌరవప్రదమైన తెలుగు సమానార్థకం.
- source_word: אַלְמָנָה
  choice: విధవరాలి
  rationale: ‘విధవరాలి హృదయం’ అనే స్వామ్య నిర్మాణం ఆధునిక తెలుగులో సహజంగా ఉంటుంది.
- source_word: אַרְנִן
  choice: ఆనందంతో పాడేలా చేశాను
  rationale: רנן యొక్క Hiphil causative భావాన్ని నిలుపుతూ, విధవరాలి హృదయం ఆనందధ్వని చేయడానికి యోబు కారణమయ్యాడనే అర్థాన్ని సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కవితా శైలిని ఉపయోగించాం. ‘నశించిపోతున్నవాని’ ద్వారా మూలంలోని participle భావాన్నీ దాని ఉద్దేశపూర్వక విస్తృతతనూ నిలిపాం; ‘ఆనందంతో పాడేలా చేశాను’ ద్వారా causative భావాన్ని స్పష్టంగా ఉంచాం.
