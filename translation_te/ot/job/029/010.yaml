  to: ప్రముఖుల స్వరం మౌనమైంది[a]; వారి నాలుక అంగిలికి అంటుకుపోయింది[b].
  rationale: మొదటి పాదంలో ఉన్న క్రియను ఆధునిక తెలుగులో దాని సందర్భార్థమైన మౌనంగా మారడం ద్వారా అనువదించాం. ఉన్నతస్థానంలోని వ్యక్తులను సూచించే హీబ్రూ పదానికి విస్తృతమైన, సహజమైన “ప్రముఖులు”ను వాడాం. రెండవ పాదంలోని అంగిలి-నాలుక రూపకాన్ని మార్పు లేకుండా నిలిపాం.
