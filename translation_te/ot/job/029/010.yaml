source:
  edition: WLC
  text: קוֹל נְגִידִ֥ים נֶחְבָּ֑אוּ וּ֝/לְשׁוֹנָ֗/ם לְ/חִכָּ֥/ם דָּבֵֽקָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/029/010.yaml
  text: The voice of nobles was hushed[b][a], and their tongue stuck to the roof of their mouth.
translation:
  language: te
  text: ప్రముఖుల స్వరం మౌనమైంది[a]; వారి నాలుక అంగిలికి అంటుకుపోయింది[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నాయకుల స్వరం మౌనమైంది.”
    reason: నְגִידִים అనే పదం నాయకులు, అధిపతులు, లేదా రాజకుమారులు వంటి ఉన్నతస్థానంలోని వ్యక్తులను సూచించవచ్చు; నֶחְבָּאוּ సందర్భంలో స్వరం వినిపించకపోవడం, అంటే మౌనమవడం అనే భావాన్ని ఇస్తుంది.
  - marker: b
    text: అక్షరార్థంగా, “వారి నాలుక వారి అంగిలికి అంటుకుంది”; ఇది మాట్లాడలేని లేదా మాట్లాడడానికి ఇష్టపడని స్థితిని సూచించే నుడికారం.
    reason: మూలంలోని శరీరాంగ రూపకాన్ని, దాని సందర్భార్థాన్ని స్పష్టం చేయడం.
lexical_decisions:
- source_word: קוֹל
  choice: స్వరం
  rationale: మానవులు మాట్లాడే సందర్భంలో ‘స్వరం’ సహజంగా ఉండి, ప్రముఖుల మాట వినిపించకుండా పోయిందనే భావాన్ని తెలియజేస్తుంది.
- source_word: נְגִידִים
  choice: ప్రభువులు
  rationale: ఈ పదం నాయకులు, అధిపతులు, రాజకుమారులు వంటి ఉన్నతస్థానంలో ఉన్నవారిని సూచించగలదు. ఇక్కడ రాజవంశాన్ని మాత్రమే సూచించకుండా సామాజిక ప్రాముఖ్యతను తెలిపేందుకు ‘ప్రభువులు’ ఎంచుకున్నాం.
- source_word: נֶחְבָּאוּ
  choice: అణగిపోయింది
  rationale: మూల క్రియకు ‘దాగిపోవడం’ అనే ప్రాథమిక అర్థం ఉంది; ‘స్వరం’తో వాడినప్పుడు అది వినిపించకుండా పోవడం, మౌనమవడం అనే కవితాత్మక భావాన్ని ఇస్తుంది. ‘అణగిపోయింది’ ఆ రూపకాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: וּלְשׁוֹנָם
  choice: వారి నాలుక
  rationale: హీబ్రూలో బహువచన సంబంధాన్ని కలిగిన ఏకవచన సమూహప్రయోగం ఉంది. తెలుగులో ‘వారి నాలుక’ దానిని సహజంగా ప్రతిబింబిస్తుంది.
- source_word: לְחִכָּם
  choice: అంగిలికి
  rationale: ఈ నామవాచకం నోటి పైభాగమైన palate‌ను సూచిస్తుంది. ఆధునిక ప్రామాణిక తెలుగులో ‘అంగిలి’ సంక్షిప్తంగా, కచ్చితంగా ఉంటుంది.
- source_word: דָּבֵקָה
  choice: అంటుకుపోయింది
  rationale: క్రియకు ‘అంటుకోవడం, హత్తుకొని ఉండడం’ అనే అర్థం ఉంది. మాట్లాడలేని లేదా మాట్లాడకుండా ఉండే స్థితిని తెలిపే మూల చిత్రాన్ని ‘అంటుకుపోయింది’ నిలుపుతుంది.
