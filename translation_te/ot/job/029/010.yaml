translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కవితా శైలిని అనుసరించాం. ‘స్వరం అణగిపోయింది’ మరియు ‘నాలుక అంగిలికి అంటుకుపోయింది’ అనే సమాంతర చిత్రాలను నిలిపి, మూలంలోని ఉద్దేశపూర్వక మౌనం లేదా మాట రాకపోవడం మధ్య ఉన్న స్వల్ప సందిగ్ధతను పరిష్కరించకుండా ఉంచాం.
