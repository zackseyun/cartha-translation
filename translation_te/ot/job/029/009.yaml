  yaml_path: translation/ot/job/029/009.yaml
  text: Princes held back their words[a], and put their hand over their mouth.
translation:
  language: te
  text: అధికారులు తమ మాటలను అదుపుచేసుకొని, తమ నోటిమీద చేయి ఉంచుకున్నారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׂרִים
  choice: అధికారులు
  rationale: ఈ పదం ఉన్నత హోదాలోని పాలకులను లేదా ప్రజాప్రముఖులను సూచిస్తుంది. యోబు 29లో ప్రజాసభ సందర్భానికి సహజంగా సరిపడే విస్తృత పదంగా ‘అధికారులు’ ఎంచుకున్నాం.
- source_word: עָצְרוּ בְמִלִּים
  choice: తమ మాటలను ఆపుకొని
  rationale: עצר ఇక్కడ మాట్లాడకుండా మాటలను నిలిపివేయడం లేదా అదుపుచేసుకోవడం అనే భావాన్ని ఇస్తుంది. ‘తమ మాటలను ఆపుకొని’ అనేది హీబ్రూ రూపకాన్ని నిలుపుతూ సహజమైన తెలుగు ప్రయోగం.
- source_word: וְכַף
  choice: చెయ్యి
  rationale: כף అక్షరార్థంగా అరచేయి లేదా చెయ్యిని సూచిస్తుంది. నోరు మూసుకొని మౌనంగా ఉండే శారీరక సంకేతంలో ‘చెయ్యి’ సహజంగా ఉంటుంది.
- source_word: יָשִׂימוּ
  choice: పెట్టుకున్నారు
  rationale: שׂים అంటే పెట్టడం, ఉంచడం. బహువచన కర్తలు తమ తమ నోటిమీద చెయ్యి ఉంచిన భావాన్ని తెలుగులో సహజంగా తెలియజేయడానికి ఆత్మార్థక రూపం వాడాం.
- source_word: לְפִיהֶם
  choice: తమ నోటి మీద
  rationale: అక్షరార్థంగా ‘వారి నోటికి/నోటిమీద.’ మౌనాన్ని సూచించే ఈ భంగిమకు ‘నోటి మీద’ సహజమైన తెలుగు సమానం; హీబ్రూలోని సమూహవాచక ఏకవచన ధోరణిని నిలిపాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన, సులభమైన శైలి. ‘చెయ్యి పెట్టుకున్నారు’ అనే సహజ ప్రయోగంతో మౌనాన్ని తెలిపే హీబ్రూ శారీరక భంగిమను నిలిపాం.
