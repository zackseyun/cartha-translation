lexical_decisions:
- source_word: בְּעוֹד
  choice: ఇంకా ... ఉన్నప్పుడు
  rationale: గతంలో కొనసాగిన, ఇప్పుడు ముగిసిపోయిన స్థితిని సూచించే కాలార్థాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: שַׁדַּי
  choice: సర్వశక్తిమంతుడు
  rationale: యోబు గ్రంథంలో దేవునికి వాడిన ఈ బిరుదును లిప్యంతరీకరించకుండా అర్థవంతంగా అనువదిస్తుంది.
- source_word: עִמָּדִי
  choice: నాకు తోడుగా
  rationale: కేవలం సమీపాన్ని కాక, యోబు జ్ఞాపకం చేసుకుంటున్న దేవుని సన్నిధి, సహవాస భావాన్ని సహజంగా తెలియజేస్తుంది; మూలంలోని 'నాతో' అనే విస్తృత భావానికి అనుగుణంగా ఉంది.
- source_word: סְבִיבוֹתַי
  choice: నా చుట్టూ
  rationale: వక్తను పరివేష్టించి ఉండడాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: נְעָרָי
  choice: నా యువకులు
  rationale: యువకులు, పరిచారకులు, సేవకులు అనే సాధ్యార్థాల్లో సేవక హోదాను అతిగా నిర్దిష్టం చేయకుండా ప్రాథమిక పదార్థాన్ని నిలుపుతుంది.
