source:
  edition: WLC
  text: וְ/יִֽחֲל֣וּ כַ/מָּטָ֣ר לִ֑/י וּ֝/פִי/הֶ֗ם פָּעֲר֥וּ לְ/מַלְקֽוֹשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/029/023.yaml
  text: They waited for me as for the rain[a], and they opened their mouths wide for the spring rain.
translation:
  language: te
  text: వర్షం కోసం ఎదురుచూసినట్లు వారు నా కోసం ఎదురుచూశారు; వసంతకాలపు వర్షం[a] కోసం తమ నోళ్లు వెడల్పుగా తెరిచారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘తరువాతి వర్షం’ లేదా ‘ఆలస్యపు వర్షం.’ మַלְקוֹשׁ అనే హీబ్రూ పదం ఋతుపరమైన వర్షకాలం చివర్లో, సాధారణంగా వసంతకాలంలో కురిసే వర్షాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִחֲלוּ
  choice: ఎదురుచూశారు
  rationale: יחל ఇక్కడ ఆశతో నిరీక్షించడాన్ని సూచిస్తుంది. వర్షం కోసం ఎదురుచూడటంతో చేసిన పోలికకు ‘ఎదురుచూశారు’ సహజంగా సరిపోతుంది; భావోద్వేగాన్ని అతిగా పెంచదు.
- source_word: כַמָּטָר
  choice: వర్షం కోసం ఎదురుచూసినట్లు
  rationale: כְּ ఉపసర్గ పోలికను తెలియజేస్తుంది. అవసరమైన వర్షం కోసం ప్రజలు నిరీక్షించే విధానాన్ని తెలుగులో స్పష్టంగా, సహజంగా వ్యక్తం చేయడానికి ఈ రూపం ఎంచుకోబడింది.
- source_word: לִי
  choice: నా కోసం
  rationale: హీబ్రూ పాఠంలో ఉన్న ప్రత్యక్ష సర్వనామాన్ని అలాగే నిలిపింది. వారు యోబు మాట లేదా సలహా కోసం నిరీక్షించారనే భావాన్ని సందర్భమే తెలియజేస్తుంది; దాన్ని పాఠ్యంలో చేర్చలేదు.
- source_word: וּפִיהֶם
  choice: తమ నోళ్లు
  rationale: ‘వారి నోళ్లు’ అనే హీబ్రూ రూపాన్ని, అదే కర్తను సూచించే సహజ తెలుగు ప్రతిబింబ సర్వనామంతో అనువదించింది.
- source_word: פָּעֲרוּ
  choice: వెడల్పుగా తెరిచారు
  rationale: פער నోరు పూర్తిగా లేదా వెడల్పుగా తెరవడాన్ని సూచిస్తుంది. వర్షాన్ని స్వీకరించాలనే సజీవ దృశ్యాన్ని ఈ అనువాదం నిలుపుతుంది.
- source_word: לְמַלְקוֹשׁ
  choice: వసంతకాలపు వర్షం
  rationale: מַלְקוֹשׁ వ్యవసాయ కాలచక్రంలో చివరగా, సాధారణంగా వసంతకాలంలో కురిసే ఋతువర్షాన్ని సూచిస్తుంది. ఆధునిక తెలుగు పాఠకులకు కాలసూచన స్పష్టంగా ఉండేలా ‘వసంతకాలపు వర్షం’ ఎంచుకోబడింది; మరింత అక్షరార్థ ప్రత్యామ్నాయాలు పాదసూచికలో ఇవ్వబడ్డాయి.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. ‘నా కోసం’ అనే మూలపాఠంలోని సంక్షిప్తతను నిలిపి, ‘నా మాట కోసం’ అని వివరణాత్మకంగా విస్తరించలేదు. వర్షం కోసం నోళ్లు తెరవడం అనే కవితాత్మక రూపకాన్ని యథాతథంగా కాపాడింది.
