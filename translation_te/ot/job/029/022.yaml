translation:
  language: te
  text: నా మాటల తర్వాత వారు మళ్లీ మాట్లాడలేదు[a]; నా పలుకు వారిమీద జాలువారింది[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారు మళ్లీ జవాబివ్వలేదు.” ఇక్కడి హీబ్రూ క్రియ, యోబు మాట్లాడిన తర్వాత వారు మళ్లీ మాట్లాడలేదని లేదా తిరిగి స్పందించలేదని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “నా పలుకు వారిమీద చుక్కచుక్కగా జారింది.” ఇది శ్రోతలపై మాట మృదువుగా దిగినట్లు చిత్రించే కవితాత్మక రూపకం.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרֵי דְבָרִי
  choice: నా మాటలు విన్న తర్వాత
  rationale: אַחֲרֵי యొక్క కాలార్థాన్ని ‘తర్వాత’గా ఉంచుతూ, తెలుగులో సహజంగా ఉండేందుకు సందర్భంలో అంతర్లీనంగా ఉన్న వినడాన్ని చేర్చింది; דְבָרִי లోని బహువచన భావాన్ని ‘నా మాటలు’గా నిలిపింది.
- source_word: לֹא יִשְׁנוּ
  choice: వారు మళ్లీ మాట్లాడలేదు
  rationale: ఈ సంభాషణ సందర్భంలో שנה క్రియకు ‘మరలా చేయడం/మళ్లీ స్పందించడం’ అనే భావం ఉంది. ‘మళ్లీ మాట్లాడలేదు’ సహజంగా ఉండి, వారు మరొకసారి జవాబివ్వలేదనే సాధ్యమైన భావాన్ని పూర్తిగా మూసివేయదు.
- source_word: וְעָלֵימוֹ
  choice: వారిమీద
  rationale: עַל + మూడవ పురుష బహువచన ప్రత్యయాన్ని నేరుగా తెలియజేస్తూ, తరువాతి చినుకు రూపకానికి సరిపోతుంది.
- source_word: תִּטֹּף
  choice: చినుకులా జారింది
  rationale: נטף యొక్క ‘చుక్కలుగా పడడం/కారడం’ అనే కవితాత్మక దృశ్యాన్ని సహజమైన తెలుగులో నిలుపుతుంది; ఇది కేవలం సాధారణంగా ‘పడింది’ అని రూపకాన్ని చెరపదు.
- source_word: מִלָּתִי
  choice: నా పలుకు
  rationale: ఏకవచన కవితా పదమైన מִלָּהను ‘నా పలుకు’గా అనువదించడం ద్వారా ముందున్న బహువచన ‘నా మాటలు’తో తేడాను నిలిపి, తెలుగులో గౌరవప్రదమైన కవితా స్వరాన్ని ఇస్తుంది.
