  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కవితాత్మక శైలి. యోబు గతకాలపు అలవాటైన పరిస్థితిని జ్ఞాపకం చేసుకుంటున్నందున ‘చూసి... తగ్గేవారు’, ‘లేచి నిలబడేవారు’ అనే రూపాలు వాడబడ్డాయి.
