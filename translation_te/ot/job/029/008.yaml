id: JOB.29.8
reference: Job 29:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: רָא֣וּ/נִי נְעָרִ֣ים וְ/נֶחְבָּ֑אוּ וִֽ֝/ישִׁישִׁים קָ֣מוּ עָמָֽדוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/029/008.yaml
  text: The young men saw me and withdrew[a], and the aged rose and stood.
translation:
  language: te
  text: యువకులు నన్ను చూసి వెనక్కి తగ్గేవారు[a]; వృద్ధులు లేచి నిలబడేవారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తమను తాము దాచుకునేవారు.” హీబ్రూ క్రియకు అక్షరార్థంగా దాక్కోవడం అనే భావం ఉండవచ్చు; ఇక్కడ అది యోబుపట్ల గౌరవంతో కనబడకుండా వెనక్కి తొలగడాన్ని సూచిస్తుండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאוּנִי
  choice: నన్ను చూసి
  rationale: ראה క్రియకు ఇక్కడ సహజమైన ప్రత్యక్షార్థం ‘చూడడం’; సందర్భం మరింత వ్యాఖ్యానాత్మకమైన పదాన్ని కోరడం లేదు.
- source_word: נְעָרִים
  choice: యువకులు
  rationale: పుంలింగ బహువచనం యువ పురుషులను సూచిస్తుంది; ఆధునిక ప్రామాణిక తెలుగులో ‘యువకులు’ సహజంగా, లింగసూచకంగా ఉంది.
- source_word: וְנֶחְבָּאוּ
  choice: వెనక్కి తగ్గేవారు
  rationale: חבא నిఫాల్ రూపానికి మౌలికంగా ‘తమను తాము దాచుకోవడం’ అనే అర్థం ఉంది. ఇక్కడ యోబు సమక్షంలో గౌరవంతో కనబడకుండా వెనక్కి తొలగడాన్ని ‘వెనక్కి తగ్గేవారు’ సహజంగా తెలియజేస్తుంది; మూలార్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: וִישִׁישִׁים
  choice: వృద్ధులు
  rationale: ఈ పదం వయసు మళ్లినవారిని, ముఖ్యంగా వృద్ధ పురుషులను సూచిస్తుంది. ‘పెద్దలు’ పదం పదవిని లేదా సామాజిక హోదాను సూచించగలదు కాబట్టి ‘వృద్ధులు’ ఎంచుకున్నాం.
- source_word: קָמוּ
  choice: లేచి
  rationale: గౌరవార్థం పైకి లేవడమనే మొదటి కదలికను తెలియజేస్తుంది; తరువాతి עמד క్రియతో కలిపి రెండు చర్యలనూ నిలిపి ఉంచుతుంది.
- source_word: עָמָדוּ
  choice: నిలబడేవారు
  rationale: వారు లేవడమే కాక నిలబడి ఉండడాన్ని తెలియజేస్తుంది. קום, עמד అనే రెండు మూలక్రియల వరుసను తెలుగులో ‘లేచి నిలబడేవారు’గా కాపాడాం.
