- from: నేను పట్టణపు ద్వారం దగ్గరికి వెళ్లినప్పుడు[a], బహిరంగ ప్రదేశంలో నా ఆసనాన్ని సిద్ధం చేసుకున్నప్పుడు[b],
  to: నేను బయటికి వెళ్లి పట్టణం దగ్గరనున్న ద్వారం వద్దకు వచ్చినప్పుడు[a], బహిరంగ ప్రదేశంలో[b] నా ఆసనాన్ని సిద్ధం చేసినప్పుడు,
  rationale: The revision restores the outward-motion sense of בְּצֵאתִי, avoids adding a reflexive sense to אָכִין, and moves footnote b to the exact term it explains. It preserves the source's somewhat idiomatic distinction between the gate and the city and does not add an explicit judicial interpretation.
