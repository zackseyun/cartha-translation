translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ప్రాచీన పట్టణ ద్వారం వద్దనున్న ప్రజా/న్యాయసభా నేపథ్యాన్ని వివరణగా ప్రధాన వాక్యంలో చేర్చకుండా, మూలంలోని స్థలపదాలనే నిలుపుకున్నాం.
