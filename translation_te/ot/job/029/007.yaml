  text: When I went out to the gate by the city[a], when I prepared my seat in the square[b],
translation:
  language: te
  text: నేను బయటికి వెళ్లి పట్టణం దగ్గరనున్న ద్వారం వద్దకు వచ్చినప్పుడు[a], బహిరంగ ప్రదేశంలో[b] నా ఆసనాన్ని సిద్ధం చేసినప్పుడు,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘పట్టణ ద్వారం వద్దకు.’ ఈబ్రూ వాక్యంలో అక్షరార్థంగా ‘ద్వారం’ అని చెప్పి, దానికి ‘పట్టణం’తో సంబంధాన్ని తెలిపే పదబంధాన్ని జతచేశారు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘విశాలమైన కూడలిలో’ లేదా ‘వీధిలో.’ ఈ పదం కేవలం ఇరుకైన దారిని కాక, విశాలమైన ప్రజా స్థలాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּצֵאתִי
  choice: నేను ... వెళ్లినప్పుడు
  rationale: בְּ + יצא క్రియాధాతురూపం, ప్రథమ పురుష ఏకవచన ప్రత్యయంతో కలిసి కాలసంబంధ ఉపవాక్యాన్ని ఏర్పరుస్తుంది. తెలుగులో ‘వెళ్లినప్పుడు’ సహజంగా ఉండి ఆ కాలసంబంధ భావాన్ని నిలుపుతుంది.
- source_word: שַׁעַר עֲלֵי קָרֶת
  choice: పట్టణపు ద్వారం దగ్గరికి
  rationale: ఈబ్రూలో ‘ద్వారం’, ‘పట్టణం’ వేర్వేరు పదాలుగా ఉన్నా, మొత్తం పదబంధం పట్టణానికి సంబంధించిన ద్వారాన్ని సూచిస్తుంది. ‘దగ్గరికి’ అనేది יצא యొక్క గమనార్థంతో సహజంగా సరిపోతూ స్థలసంబంధాన్ని తెలియజేస్తుంది; మూలంలోని కొంత అస్పష్టతను పాదసూచికలో చూపించాం.
- source_word: בָּרְחוֹב
  choice: బహిరంగ ప్రదేశంలో
  rationale: רְחוֹב ఇరుకైన వీధికంటే విశాలమైన ప్రజా స్థలాన్ని లేదా కూడలిని సూచించగలదు. ‘బహిరంగ ప్రదేశం’ సాధారణ ఆధునిక తెలుగు పాఠకులకు ఈ విస్తృత భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: אָכִין
  choice: సిద్ధం చేసుకున్నప్పుడు
  rationale: כון హిఫిల్ రూపానికి ‘సిద్ధం చేయడం’, ‘ఏర్పాటు చేయడం’, ‘స్థాపించడం’ అనే భావాలు ఉన్నాయి. ఆసనంతో కూడిన ఈ సందర్భంలో ‘సిద్ధం చేసుకున్నప్పుడు’ సహజంగా ఉండి శాశ్వత స్థాపన అనే మితిమీరిన భావాన్ని కలిగించదు.
- source_word: מוֹשָׁבִי
  choice: నా ఆసనాన్ని
  rationale: ఇక్కడ מוֹשָׁב నివాసాన్ని కాక, ప్రజా సభలో కూర్చునే స్థానం లేదా ఆసనాన్ని సూచిస్తుంది. ‘ఆసనం’ గౌరవప్రదమైన ప్రజా సందర్భానికి తగినది.
