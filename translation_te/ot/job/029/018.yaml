source:
  edition: WLC
  text: וָ֭/אֹמַר עִם קִנִּ֣/י אֶגְוָ֑ע וְ֝/כַ/ח֗וֹל אַרְבֶּ֥ה יָמִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/029/018.yaml
  text: Then I said[a], ‘I will die in my nest, and I will multiply my days like the sand.’
translation:
  language: te
  text: 'అప్పుడు నేను అన్నాను[a]: ‘నా గూటిలోనే చనిపోతాను; ఇసుక రేణువులవలె నా దినాలను పెంచుకుంటాను.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “నా గూటితో చనిపోతాను; ఫీనిక్స్ పక్షివలె నా దినాలను పెంచుకుంటాను.” ఇక్కడ ‘ఇసుక’గా అనువదించిన హీబ్రూ పదాన్ని కొందరు ఒక పక్షి పేరుగా అర్థం చేసుకుంటారు. అయితే సందర్భంలో ‘ఇసుక’ అనే అర్థమే ఎక్కువ సంభావ్యమైనది; అది అపార సంఖ్యను సూచించే సాధారణ బైబిలు రూపకానికి సరిపోతుంది.'
    reason: alternative_reading
lexical_decisions:
- source_word: וָאֹמַר
  choice: అప్పుడు నేను ఇలా అనుకున్నాను
  rationale: వావ్ రూపం యోబు గత నిరీక్షణల జ్ఞాపకాన్ని ముందుకు నడిపిస్తుంది. సందర్భంలో ఇది ఇతరులతో పలికిన మాటకన్నా అంతరంగ నిరీక్షణను సూచించవచ్చు; అందువల్ల సహజమైన తెలుగులో ‘అనుకున్నాను’ అని ఇచ్చాం.
- source_word: עִם קִנִּי
  choice: నా గూటిలోనే
  rationale: עִם సాధారణంగా ‘తో’ అయినా, ‘గూడు’తో ఇక్కడ స్థలార్థం సహజం. ‘గూడు’ అనే కవితాత్మక రూపకాన్ని నిలిపి, భద్రమైన స్వగృహ జీవితం అనే భావాన్ని కాపాడాం.
- source_word: אֶגְוָע
  choice: చనిపోతాను
  rationale: మరణించడం లేదా ప్రాణం విడవడం అనే ప్రత్యక్ష భావాన్ని సాధారణ ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: וְכַחוֹל
  choice: ఇసుక రేణువులంత విస్తారంగా
  rationale: חוֹל యొక్క సాధారణ అర్థం ‘ఇసుక’. లెక్కలేనంత విస్తారమైన సంఖ్యను సూచించే బైబిలు చిత్రాన్ని తెలుగులో స్పష్టంచేయడానికి ‘ఇసుక రేణువులంత’ అని ఇచ్చాం; పక్షి/ఫీనిక్స్ అర్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: אַרְבֶּה יָמִים
  choice: నా రోజుల్ని పెంచుకుంటాను
  rationale: హిఫీల్ క్రియలోని ‘అధికం చేయడం’ అనే క్రియాశీల భావాన్ని నిలిపాం. ‘నా రోజులు’ అంటే ఆయుష్షు; తెలుగు వాక్య నిర్మాణంలో కర్తకు సంబంధించిన భావం సహజంగా వ్యక్తమవుతుంది.
theological_decisions:
- issue: חוֹל అనే పదానికి ‘ఇసుక’ లేదా ఒక పౌరాణిక పక్షి అనే సాధ్యార్థాలు
  choice: ప్రధాన పాఠ్యంలో ‘ఇసుక రేణువులు’
  alternative: ‘ఫీనిక్స్ పక్షిలా’ లేదా దీర్ఘాయుష్షుతో అనుసంధానించిన పక్షి పేరు
  rationale: ‘ఇసుక’ అనేది హీబ్రూ పదానికి సాధారణమైన, సందర్భానికి తగిన అర్థం; అనేక దినాల భావానికి సుపరిచితమైన సంఖ్యా రూపకాన్ని ఇస్తుంది. అరుదైన పక్షి అర్థం అనిశ్చితమైనందున దాన్ని ప్రధాన పాఠ్యంలో స్థిరపరచకుండా పాదసూచికలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కవితాత్మకమైన ‘గూడు’ రూపకాన్ని నిలిపి, సాధారణ పాఠకుడికి అర్థమయ్యే సరళమైన, గౌరవప్రదమైన పదజాలం వాడాం. పాదసూచిక గుర్తు [a] ప్రధాన పాఠ్యంలో చేర్చబడింది.
