source:
  edition: WLC
  text: כִּ֤י פֹ֣עַל אָ֭דָם יְשַׁלֶּם ל֑/וֹ וּֽ/כְ/אֹ֥רַח אִ֝֗ישׁ יַמְצִאֶֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/011.yaml
  text: For he repays a man according to his deed[a], and he makes him find according to a man's way.
translation:
  language: te
  text: ఎందుకంటే ఆయన మనిషి చేసిన దానికి తగినట్లు అతనికి ప్రతిఫలం ఇస్తాడు; అతని మార్గానికి తగినది అతనికి ఎదురయ్యేలా చేస్తాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దాన్ని అతని మీదికి రప్పిస్తాడు,” లేదా “దాన్ని అతని మీదికి తెస్తాడు.” ఇవి హెబ్రీ క్రియలోని కారణార్థక భావాన్ని ప్రతిబింబిస్తాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందున్న ఎలీహు వాదనకు ఈ వాక్యం కారణాన్ని వివరిస్తోంది; అందువల్ల వివరణాత్మక భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: פֹעַל
  choice: చేసిన కార్యం
  rationale: మనిషి చేసే పనిని సూచిస్తుంది. నైతిక ప్రతిఫల సందర్భంలో ‘కార్యం’ గంభీరంగా, స్పష్టంగా ఉంటుంది.
- source_word: אָדָם
  choice: మనిషి
  rationale: ఏ మానవునికైనా వర్తించే ఏకవచన ప్రతినిధి ప్రయోగాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: יְשַׁלֶּם לוֹ
  choice: అతనికి తగిన ప్రతిఫలాన్ని ఇస్తాడు
  rationale: పియేల్ రూపంలోని తిరిగి చెల్లించడం లేదా చేసినదానికి బదులు ఇవ్వడం అనే న్యాయపరమైన భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: וּכְאֹרַח אִישׁ
  choice: ఒక మనిషి నడిచిన మార్గానికి తగినదాన్ని
  rationale: אֹרַח లోని ‘మార్గం’ రూపకాన్ని నిలుపుతూ, అది జీవన నడవడిని సూచిస్తుందని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: יַמְצִאֶנּוּ
  choice: అతడు పొందేలా చేస్తాడు
  rationale: హిఫిల్ రూపంలోని కారణార్థక భావాన్ని నిలుపుతుంది. ఆ మనిషి తన మార్గానికి సరిపడే ఫలితాన్ని అనుభవించేలా దేవుడు చేస్తాడనే భావాన్ని అనవసరంగా విస్తరించకుండా తెలియజేస్తుంది.
theological_decisions:
- issue: మనుషుల ప్రవర్తనకు అనుగుణమైన దైవిక ప్రతిఫలం
  choice: దేవుడు ప్రతి మనిషికి అతని కార్యం, జీవన మార్గం ప్రకారం ప్రతిఫలం ఇస్తాడనే సాధారణ న్యాయసూత్రంగా అనువదించబడింది.
  alternative: ప్రతి బాధా వ్యక్తిగత పాపానికి దేవుడు ఇచ్చే ఖచ్చితమైన ప్రత్యక్ష శిక్షేనని చెప్పే సార్వత్రిక వాదన.
  rationale: వచనం దైవన్యాయ సూత్రాన్ని ప్రకటిస్తుంది; అయితే యోబు గ్రంథమంతటిలో ఉన్న బాధ, నీతి సంబంధమైన ఉద్రిక్తతను ఇది పూర్తిగా పరిష్కరించినట్లు అనువాదం చెప్పకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన శైలి వాడబడింది. ‘మార్గం’ అనే హెబ్రీ రూపకం నిలుపబడింది; మొదటి పాదంలోని న్యాయపరమైన భావం కోసం ‘ప్రతిఫలం’ ఉపయోగించబడింది.
