source:
  edition: WLC
  text: בִּלְעֲדֵ֣י אֶ֭חֱזֶה אַתָּ֣ה הֹרֵ֑/נִי אִֽם עָ֥וֶל פָּ֝עַ֗לְתִּי לֹ֣א אֹסִֽיף־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/032.yaml
  text: What I do not see[a], you teach me; if I have done wrong[b], I will not do it again.
translation:
  language: te
  text: నేను చూడనిదాన్ని[a] నీవు నాకు బోధించు; నేను తప్పు చేసి ఉంటే, ఇక దాన్ని మళ్లీ చేయను.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, మరింత అక్షరార్థంగా, “నేను చూడనిదాన్ని నీవు నాకు చూపించు/బోధించు.” హీబ్రూ వాక్యభాగం సంక్షిప్తంగా ఉంది; “నేను చూసేదానికి వెలుపల ఉన్నదాన్ని నీవు నాకు బోధించు” అని కూడా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: మరింత అక్షరార్థంగా, “ఇక మరి చేయను/జతచేయను.” ఈ హీబ్రూ నుడికారం సందర్భంలో “ఇక కొనసాగించను” లేదా “మళ్లీ చేయను” అనే అర్థాన్ని ఇస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּלְעֲדֵי אֶחֱזֶה
  choice: నేను చూడనిదేదో
  rationale: హీబ్రూ వాక్యభాగం సంక్షిప్తంగా, కొంత అస్పష్టంగా ఉంది. ‘నేను చూడనిది’ అనే అనువాదం చూడటం/గ్రహించడం అనే భావచిత్రాన్ని నిలుపుతూ తెలుగులో సహజంగా ఉంటుంది; ‘నేను చూసేదానికి వెలుపల’ అనే ప్రత్యామ్నాయ భావాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: אַתָּה הֹרֵנִי
  choice: నీవు నాకు బోధించు
  rationale: ירה హిఫీల్ రూపం సాధారణంగా బోధించడం లేదా ఉపదేశించడం అనే అర్థం ఇస్తుంది. ఇక్కడ దేవుని నుంచి దిద్దుబాటు కోరే సందర్భానికి ‘బోధించు’ సహజంగా సరిపోతుంది.
- source_word: אִם
  choice: చేసి ఉంటే
  rationale: షరతును సూచించే ‘if’ భావాన్ని తెలుగులో సహజమైన షరతు నిర్మాణంతో వ్యక్తం చేస్తుంది.
- source_word: עָוֶל פָּעַלְתִּי
  choice: నేను తప్పు చేసి ఉంటే
  rationale: עָוֶל అన్యాయం, దోషం, చెడు పని వంటి విస్తృత భావాన్ని కలిగి ఉంది. ‘తప్పు’ మూలంలోని నైతిక భావాన్ని అతిగా నిర్దిష్టం చేయకుండా సాధారణ పాఠకులకు స్పష్టంగా అందిస్తుంది.
- source_word: לֹא אֹסִיף
  choice: ఇక దాన్ని మళ్లీ చేయను
  rationale: అక్షరార్థంగా ‘ఇక చేర్చను’ అయినా, ఈ ప్రయోగం కొనసాగించను లేదా పునరావృతం చేయను అనే అర్థం ఇస్తుంది. తెలుగులో భావాన్ని సహజంగా తెలియజేయడానికి అంతర్లీన కర్మను ‘దాన్ని’గా వ్యక్తం చేశాం.
theological_decisions:
- issue: దేవుని ఎదుట నేర్చుకోవడానికి సిద్ధత మరియు తప్పును విడిచిపెట్టే సంకల్పం
  choice: వక్త తనకు తెలియనిదాన్ని దేవుడు బోధించాలని కోరుతూ, తప్పు చేసి ఉంటే దాన్ని మళ్లీ చేయనని చెప్పే విధంగా అనువదించాం.
  alternative: ‘నేను చూసేదానికి వెలుపల నీవు నాకు చూపించు; నేను అన్యాయం చేసి ఉంటే ఇక చేర్చను’ అని మరింత అక్షరానుసారంగా అనువదించడం.
  rationale: మూలంలోని వినయపూర్వక బోధనాభ్యర్థనను, తప్పులో కొనసాగకూడదనే సంకల్పాన్ని నిలుపుతూ, సంపూర్ణ అపరాధ ఒప్పుకోలు లేదా ప్రత్యేకమైన పశ్చాత్తాప సిద్ధాంత పదజాలాన్ని చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన శైలిని ఉపయోగించాం. దేవునితో ప్రత్యక్ష సంభాషణకు తగిన ‘నీవు’ రూపాన్ని ఉంచాం. మూలంలోని సంక్షిప్తతను సాధ్యమైనంతగా నిలుపుతూ, అస్పష్టతను పాదటిప్పణిలో సంరక్షించాం.
