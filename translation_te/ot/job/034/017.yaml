  text: הַ/אַ֬ף שׂוֹנֵ֣א מִשְׁפָּ֣ט יַחֲב֑וֹשׁ וְ/אִם צַדִּ֖יק כַּבִּ֣יר תַּרְשִֽׁיעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/017.yaml
  text: Can one who hates justice govern? And will you condemn the righteous Mighty One?[a][b]
translation:
  language: te
  text: న్యాయాన్ని ద్వేషించే వాడు పరిపాలించగలడా?[a] నీతిమంతుడైన మహాబలవంతుణ్ణి నీవు దోషిగా తీర్చుతావా?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “పాలించగలడా?”, “అదుపు చేయగలడా?”; అక్షరార్థంగా “కట్టగలడా?” ఈ సందర్భంలో హీబ్రూ క్రియ అధికారంతో పాలించడం లేదా అదుపులో ఉంచడం అనే భావాన్ని కలిగి ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా “నీతిమంతుడైన బలవంతుణ్ణి,” “నీతిమంతుడైన గొప్పవాణ్ణి.” ఈ పదబంధం ఇక్కడ దేవుణ్ణి సూచిస్తుందని గ్రహించడం అత్యంత సహజం.
    reason: alternative_reading
lexical_decisions:
- source_word: הַאַף
  choice: పరిపాలించగలడా?
  rationale: ప్రశ్నార్థక అవ్యయంతో కూడిన אַף బలమైన అలంకారప్రశ్నను ప్రవేశపెడుతుంది. తెలుగులో ప్రశ్నారూపమే ఆ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: שׂוֹנֵא
  choice: ద్వేషించేవాడు
  rationale: కృదంతం వ్యక్తిని అతని స్థిర లక్షణం ద్వారా సూచిస్తుంది; ఈ తెలుగు రూపం సహజంగా అదే భావాన్ని నిలుపుతుంది.
- source_word: מִשְׁפָּט
  choice: న్యాయం
  rationale: ఇక్కడ ఒక ప్రత్యేక తీర్పుకంటే న్యాయబద్ధమైన పరిపాలన, నైతిక క్రమం ప్రధానంగా ఉద్దేశించబడ్డాయి.
- source_word: יַחֲבֹשׁ
  choice: పరిపాలించగలడా
  rationale: మూల అర్థం ‘కట్టు’; సందర్భంలో అదుపు చేయడం లేదా అధికారాన్ని నిర్వహించడం అనే రూపకాలంకార భావం ఉంది. ‘పరిపాలించు’ న్యాయం గురించిన సందర్భానికి సరిపోతుంది; ప్రత్యామ్నాయాలను పాదటిప్పణి తెలియజేస్తుంది.
- source_word: וְאִם
  choice: …తీర్చుతావా?
  rationale: ఇది మొదటి అలంకారప్రశ్నకు సమాంతరమైన రెండవ ప్రశ్నను కలుపుతుంది. తెలుగులో ప్రత్యేక సంధిపదం లేకుండానే సమాంతర ప్రశ్నారూపం అనుబంధాన్ని స్పష్టంగా చూపుతుంది.
- source_word: צַדִּיק
  choice: నీతిమంతుడైన
  rationale: వ్యక్తి యొక్క నైతిక న్యాయత్వాన్ని, ధార్మిక బరువును నిలుపుతుంది.
- source_word: כַּבִּיר
  choice: మహాశక్తిమంతుణ్ణి
  rationale: ఈ విశేషణం నామవాచకంగా వాడబడింది; సందర్భంలో దేవుణ్ణి సూచించే సంభావ్యత బలంగా ఉంది. తెలుగు గౌరవార్థ రూపం ఆ సూచనను సహజంగా అందించినా, పదబంధపు ప్రత్యామ్నాయ అవగాహనను పాదటిప్పణి నిలుపుతుంది.
- source_word: תַּרְשִׁיעַ
  choice: దోషిగా తీర్చుతావా
  rationale: רשע హిఫీల్ రూపం ‘దోషిగా ప్రకటించు’ అని అర్థం; న్యాయస్థాన సంబంధ భావాన్ని ఈ ప్రయోగం స్పష్టంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ‘నీతిమంతుడైన మహాశక్తిమంతుడు’ ఎవరిని సూచిస్తున్నాడు?
  choice: ప్రధాన పాఠ్యంలో దేవుణ్ణి సూచించే సంభావ్య భావంగా ‘నీతిమంతుడైన మహాశక్తిమంతుణ్ణి’
  alternative: నీతిమంతుడైన ఒక శక్తిమంతుడిని లేదా గొప్పవాణ్ణి సాధారణంగా సూచించడం
  rationale: ఎలీహు వాదనలో న్యాయవంతుడైన పరమ పాలకుణ్ణి దోషిగా తీర్చడం అసంబద్ధమనే భావమే సహజంగా సరిపోతుంది. అయినా హీబ్రూ పదబంధం స్వతంత్రంగా సాధారణ అర్థాన్నీ అనుమతిస్తుంది కాబట్టి పాదటిప్పణిలో దాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన అలంకారప్రశ్నలుగా అనువదించాం. ‘దోషిగా తీర్చు’ న్యాయస్థాన భావాన్ని నిలుపుతుంది. ప్రతి పాదటిప్పణి సూచికను ప్రధాన పాఠ్యంలో చేర్చాం.
