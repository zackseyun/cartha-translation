revisions:
- from: 'క్షణంలోనే వారు చనిపోతారు;

    అర్ధరాత్రి ఒక జనసమూహం కుదిపివేయబడి గతించిపోతుంది;

    బలవంతుడు ఏ చేతి ప్రమేయమూ లేకుండానే[a] తొలగించబడతాడు.'
  to: 'క్షణంలోనే వారు మరణిస్తారు;

    అర్ధరాత్రి ఒక ప్రజాసమూహం కుదిపివేయబడి అంతరించిపోతుంది;

    బలవంతుడు చేతివల్ల కాదు, తొలగించబడతాడు.[a]'
  rationale: 'The revision preserves the verse’s three-part poetic movement: sudden death, a people shaken and passing away, and the removal of the mighty. It removes an unnecessary expansion in the final clause and retains the source’s ambiguity about agency. The footnote gives the likely ‘human agency’ implication without making it an assertion in the translation.'
  reviewer_model: gpt-5.6-terra
