id: JOB.34.20
reference: Job 34:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: רֶ֤גַע יָמֻתוּ֮ וַ/חֲצ֪וֹת לָ֥יְלָה יְגֹעֲשׁ֣וּ עָ֣ם וְ/יַעֲבֹ֑רוּ וְ/יָסִ֥ירוּ אַ֝בִּ֗יר לֹ֣א בְ/יָֽד׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/020.yaml
  text: In a moment they die; at midnight a people are shaken[a], and they pass away; the mighty are removed, not by hand.
translation:
  language: te
  text: 'క్షణంలోనే వారు మరణిస్తారు;

    అర్ధరాత్రి ఒక ప్రజాసమూహం కుదిపివేయబడి అంతరించిపోతుంది;

    బలవంతుడు చేతివల్ల కాదు, తొలగించబడతాడు.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘చేతితో కాదు.’ ఇది మానవ కార్యసాధకత్వం లేకుండా తొలగించబడటాన్ని సూచించవచ్చు.
    reason: హీబ్రూ నుడికారపు అక్షరార్థాన్ని నిలుపుతూ, సందర్భంలో సాధ్యమైన భావాన్ని మాత్రమే సూచిస్తుంది; ప్రధాన పాఠం ఆ భావాన్ని నిర్ణయాత్మకంగా చేయదు.
lexical_decisions:
- source_word: רֶגַע
  choice: క్షణంలోనే
  rationale: అతి స్వల్ప కాలాన్ని సూచించే మూలపద భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; ఆకస్మికతను అతిగా వివరిస్తూ పోదు.
- source_word: יָמֻתוּ
  choice: వారు చనిపోతారు
  rationale: మరణించడాన్ని సూచించే సాధారణ క్రియకు నేరమైన, సులభమైన అనువాదం.
- source_word: וַחֲצוֹת לָיְלָה
  choice: అర్ధరాత్రి
  rationale: అక్షరార్థంగా ‘రాత్రి సగంలో’; తెలుగులో సహజమైన కాలసూచన ‘అర్ధరాత్రి’.
- source_word: יְגֹעֲשׁוּ
  choice: కుదిపివేయబడి
  rationale: געשׁ పదంలోని కదలిక, కంపనం, కల్లోలం అనే భావపరిధిని నిలుపుతుంది. సందర్భంలో ప్రజలు అకస్మాత్తుగా కుదిపివేయబడుతున్న భావాన్ని ఇస్తుంది.
- source_word: עָם
  choice: ఒక జనసమూహం
  rationale: ఏకవచన సమష్టివాచక భావాన్ని సహజ తెలుగులో నిలుపుతుంది; నిర్దిష్టంగా ‘ఆ ప్రజలు’ అని మూలంలో లేని నిర్దిష్టతను చేర్చదు.
- source_word: וְיַעֲבֹרוּ
  choice: గతించిపోతుంది
  rationale: עבר యొక్క ‘దాటిపోవడం/వెళ్లిపోవడం’ అనే ప్రాథమిక భావాన్ని, ఇక్కడ అంతరించిపోవడం లేదా మరణించడం అనే సందర్భార్థంతో వ్యక్తం చేస్తుంది.
- source_word: וְיָסִירוּ
  choice: తొలగించబడతాడు
  rationale: మూలంలోని బహువచన క్రియ కర్తను పేర్కొనదు. తెలుగులో కర్మణి రూపం ఆ అనిర్దిష్ట కర్తను కాపాడుతూ తరువాతి ‘చేతి ప్రమేయం లేకుండా’ అనే మాటతో సహజంగా కలుస్తుంది.
- source_word: אַבִּיר
  choice: బలవంతుడు
  rationale: బలమున్న లేదా శక్తిమంతుడైన వ్యక్తిని సూచించే ఏకవచన రూపాన్ని నిలుపుతుంది.
- source_word: לֹא בְיָד
  choice: ఏ చేతి ప్రమేయమూ లేకుండానే
  rationale: ‘చేతితో కాదు’ అనే హీబ్రూ నుడికారాన్ని తెలుగులో అర్థమయ్యేలా అందిస్తుంది; కర్త మానవుడేనని ప్రధాన పాఠంలో స్పష్టంగా చేర్చకుండా మూలంలోని సంక్షిప్తతను కాపాడుతుంది.
theological_decisions:
- issue: ‘చేతితో కాదు’ అనే మాటలో సూచితమైన కార్యసాధకత్వం
  choice: ప్రధాన పాఠంలో ‘ఏ చేతి ప్రమేయమూ లేకుండానే’ అని ఉంచి, తొలగింపును ఎవరు చేస్తారో నిర్దిష్టంగా చెప్పలేదు.
  alternative: ‘మానవ హస్తం లేకుండా’ లేదా ‘మనిషి చేతితో కాకుండా’
  rationale: ఈ మాట సాధారణ మానవ కార్యసాధకత్వానికి అతీతమైన తొలగింపును, సందర్భానుసారంగా దేవుని చర్యను, సూచించవచ్చు. అయితే మూలం ‘మానవ’ లేదా ‘దేవుడు’ అని ప్రత్యక్షంగా చెప్పనందున ఆ భావాన్ని ప్రధాన పాఠంలో నిర్ణయాత్మకంగా చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. కవితాత్మక సమాంతర నిర్మాణం కోసం మూడు పాదాలుగా అమర్చబడింది. ‘జనసమూహం’ సమష్టివాచకం కావడంతో తెలుగు వాక్యసమ్మతికి ఏకవచన క్రియలు వాడబడ్డాయి.
