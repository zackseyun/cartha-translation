source:
  edition: WLC
  text: מִֽי פָקַ֣ד עָלָ֣י/ו אָ֑רְצָ/ה וּ/מִ֥י שָׂ֝֗ם תֵּבֵ֥ל כֻּלָּֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/013.yaml
  text: Who appointed the earth over him[a], and who set the whole world in place?
translation:
  language: te
  text: భూమిని ఆయనకు ఎవరు అప్పగించారు[a]? సమస్త లోకాన్ని ఎవరు ఏర్పాటు చేశారు?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “భూమికి ఆయనను అధిపతిగా ఎవరు నియమించారు? సమస్త లోకాన్ని ఆయనపై ఎవరు ఉంచారు?” హెబ్రీ פקד క్రియకు నియమించడం, బాధ్యత అప్పగించడం, లేదా అధికారాన్ని అప్పగించడం అనే భావాలు ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: פָקַד
  choice: నియమించారు
  rationale: עַל‌తో వచ్చిన פקד ఇక్కడ ఒకరి ఆధీనంలో బాధ్యతను లేదా అధికార పరిధిని ఉంచడాన్ని సూచిస్తుంది. దేవుణ్ణి భూమిపై మరొకరు నియమించారా అనే అలంకారప్రశ్నను ‘నియమించారు’ సహజంగా తెలియజేస్తుంది; ‘బాధ్యత అప్పగించారు’ అనే భావం కూడా సాధ్యమే కాబట్టి పాదసూచికలో ఉంచబడింది.
- source_word: עָלָיו
  choice: ఆయనను … పై
  rationale: పుంలింగ ఏకవచన ప్రత్యయం సందర్భంలో దేవుణ్ణి సూచిస్తుంది. తెలుగులో సహజమైన పాలనా భావాన్ని ఇవ్వడానికి ‘భూమిపై ఆయనను’ అనే నిర్మాణం వాడబడింది.
- source_word: אָרְצָה
  choice: భూమి
  rationale: తరువాతి పాదంలోని תבלతో ఉన్న విశ్వవ్యాప్త సమాంతరత కారణంగా స్థానిక ‘దేశం’ కంటే ‘భూమి’ సరిపోతుంది.
- source_word: שָׂם
  choice: నెలకొల్పారు
  rationale: שׂים యొక్క ప్రాథమిక భావం పెట్టడం లేదా ఉంచడం. లోకాన్ని దాని స్థానంలో ఉంచడం అనే సందర్భంలో ‘నెలకొల్పారు’ తెలుగులో సహజంగా ఉంటుంది; ఇది సృష్టి విధానాన్ని మరింత నిర్దిష్టంగా చెప్పదు.
- source_word: תֵּבֵל כֻּלָּהּ
  choice: లోకమంతటినీ
  rationale: תבל వ్యవస్థితమైన లేదా నివాసయోగ్యమైన లోకాన్ని సూచిస్తుంది; כֻּלָּהּ దాని సంపూర్ణతను నొక్కిచెబుతుంది. ‘లోకమంతటినీ’ ఈ రెండింటినీ సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: עָלָיוలోని సర్వనామ ప్రత్యయం ఎవరిని సూచిస్తుంది?
  choice: అది దేవుణ్ణి సూచిస్తుందని తీసుకొని, ‘భూమిపై ఆయనను’ అని అనువదించబడింది.
  alternative: వాక్యాన్ని ‘భూమి బాధ్యతను ఆయనకు ఎవరు అప్పగించారు?’ అని కూడా అర్థం చేసుకోవచ్చు.
  rationale: యోబు 34:10–15లో దేవుణ్ణి భూమిపై నియమించిన పై అధికారి ఎవరూ లేరన్నదే ఏలీహు వాదన. అయినా פקד మరియు עַל కలయిక బాధ్యత అప్పగించడం అనే భావాన్నీ అనుమతిస్తుంది; అందుకే ఆ భావాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, దేవుని గురించి గౌరవబహువచన క్రియారూపాలతో అనువదించబడింది. రెండు అలంకారప్రశ్నల సమాంతరతను నిలిపి, మూలంలోని బాధ్యత/నియామక సంబంధమైన భావసందిగ్ధతను పాదసూచికలో భద్రపరచాం.
