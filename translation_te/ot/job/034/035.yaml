  yaml_path: translation/ot/job/034/035.yaml
  text: Job speaks without knowledge[a], and his words are without understanding.
translation:
  language: te
  text: 'యోబు జ్ఞానం లేకుండా మాట్లాడుతున్నాడు,

    అతని మాటల్లో వివేచన లేదు.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְדַעַת
  choice: జ్ఞానం లేకుండా
  rationale: בְּ + דַּעַת ఇక్కడ మాట్లాడే తీరును సూచిస్తుంది; జ్ఞానలేమిని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: יְדַבֵּר
  choice: మాట్లాడుతున్నాడు
  rationale: ఈ అసంపూర్ణ క్రియారూపం ఏలీహు యోబు మాటలను అంచనా వేస్తున్న సందర్భంలో వర్తమాన భావాన్ని ఇస్తుంది.
- source_word: דְבָרָיו
  choice: అతని మాటల్లో
  rationale: దాని ప్రాథమిక అర్థమైన ‘అతని మాటలు’ను నిలుపుతూ, తరువాతి నిరాకరణను తెలుగులో సహజంగా కలుపుతుంది.
- source_word: בְהַשְׂכֵּיל
  choice: వివేచన
  rationale: שׂכל మూలం గ్రహణశక్తి, అంతర్దృష్టి, వివేకంతో వ్యవహరించడం అనే భావాలను కలిగి ఉంది; ‘వివేచన’ మొదటి పాదంలోని ‘జ్ఞానం’తో తేడాను కూడా నిలుపుతుంది.
- source_word: לֹא
  choice: లేకుండా / లేదు
  rationale: రెండు హీబ్రూ నిరాకరణలను తెలుగు వాక్యనిర్మాణానికి తగినట్లుగా ‘లేకుండా’ మరియు ‘లేదు’ అని సహజంగా వ్యక్తపరచింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కవితా సమాంతరతను ఉపయోగించాం. హీబ్రూలోని ‘జ్ఞానం’ మరియు ‘వివేచన/అంతర్దృష్టి’ మధ్య భావవ్యత్యాసాన్ని నిలుపుతూ, కఠినమైన పదానువాదాన్ని నివారించాం.
