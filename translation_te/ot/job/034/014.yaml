  text: If he should set his heart on himself[a], and gather to himself his spirit and his breath,
translation:
  language: te
  text: ఆయన తన హృదయాన్ని తనవైపుకు మళ్లించి[a], తన ఆత్మను, తన ఊపిరిని తనవద్దకు చేర్చుకుంటే,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆయన తన హృదయాన్ని దీనిమీద ఉంచి.” “హృదయాన్ని ఉంచు” అనే హీబ్రూ ప్రయోగం తన శ్రద్ధను లేదా సంకల్పాన్ని ఒక విషయంవైపు మళ్లించడాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: -తే
  rationale: షరతును సూచించే אִםను తెలుగులో సహజమైన షరతార్థక క్రియాంతం ‘-తే’తో వ్యక్తం చేశాం.
- source_word: יָשִׂים
  choice: నిలిపి
  rationale: שׂים యొక్క ‘పెట్టు/నిలుపు’ భావాన్ని, ‘హృదయాన్ని ... మీద నిలుపు’ అనే సందర్భోచిత తెలుగు నుడికారంలో నిలిపాం.
- source_word: אֵלָיו
  choice: తనమీదే
  rationale: దేవునివైపు తిరిగిన స్వనిర్దేశక భావాన్ని వ్యక్తం చేస్తుంది; ‘-ఏ’ దృష్టి తనమీదనే నిలవడాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: לִבּוֹ
  choice: తన హృదయాన్ని
  rationale: అంతరంగ ఉద్దేశం, సంకల్పం లేదా శ్రద్ధను సూచించే హీబ్రూ మానవశాస్త్రీయ రూపకాన్ని ‘హృదయం’గా నిలిపాం.
- source_word: רוּחוֹ
  choice: తన ఆత్మను
  rationale: רוּחַకు ఇక్కడ జీవప్రదమైన ఆత్మ భావం సరిపోతుంది; తదుపరి נְשָׁמָהతో ఉన్న భేదాన్ని నిలుపుతుంది.
- source_word: וְנִשְׁמָתוֹ
  choice: తన ఊపిరిని
  rationale: נְשָׁמָה యొక్క ఊపిరి/ప్రాణవాయువు భావాన్ని సాధారణ ఆధునిక తెలుగులో అందిస్తుంది; ‘ఆత్మ’తో కలిపివేయదు.
- source_word: יֶאֱסֹף
  choice: తనవద్దకు సమకూర్చుకుంటే
  rationale: אָסַף యొక్క ‘సమకూర్చు/పోగుచేయు’ రూపకాన్ని కాపాడుతూ, తనవద్దకు తిరిగి తీసుకునే సందర్భార్థాన్ని సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: మూడవ పురుష ఏకవచన సర్వనామాల నిర్దేశ్యం
  choice: అన్నీ దేవుణ్ణే సూచించేలా ‘ఆయన/తన’ వాడటం
  alternative: మొదటి אֵלָיוను ‘దీనిమీద’ లేదా ‘దానివైపు’ అని అన్వయించడం
  rationale: ఎలీహూ వాదన సందర్భంలో కర్త దేవుడే; ఆయన ఇచ్చిన జీవాత్మను, ఊపిరిని తిరిగి సమకూర్చుకోవడం వాక్య భావం. అయితే మొదటి పదబంధంలోని భావసంభావ్యతను పాదటిప్పణిలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ఇది 15వ వచనంలో పూర్తయ్యే షరతు వాక్యపు మొదటి భాగం కాబట్టి చివర కామాను ఉంచాం.
