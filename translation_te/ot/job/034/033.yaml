source:
  edition: WLC
  text: הַֽ/מֵ/עִמְּ/ךָ֬ יְשַׁלְמֶ֨/נָּה כִּֽי מָאַ֗סְתָּ כִּי אַתָּ֣ה תִבְחַ֣ר וְ/לֹא אָ֑נִי וּֽ/מַה יָדַ֥עְתָּ דַבֵּֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/033.yaml
  text: Should he repay according to your judgment because you have rejected it? For you must choose[a], and not I[b]; so declare what you know.
translation:
  language: te
  text: ఆయన నీ నిర్ణయం ప్రకారం[a] ప్రతిఫలం ఇవ్వాలా—నీవు దాన్ని[b] తిరస్కరించావు గనుక? ఎంచుకోవలసింది నీవే, నేను కాదు; కాబట్టి నీకు తెలిసింది చెప్పు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆయన నీ ప్రకారమే ప్రతిఫలం ఇవ్వాలా?” హీబ్రూ వాక్యారంభం నుడికారపూర్వకంగా ఉండి అర్థం చేయడం కష్టం; దేవుని ప్రతిఫలం యోబు ఇష్టానుసారం నిర్ణయించబడదనే భావం సందర్భంలో కనిపిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: “దాన్ని” అనేది దేవుని తీర్పును, ఆయన పరిపాలించే విధానాన్ని, లేదా ఇక్కడ ప్రస్తావించిన ప్రతిఫలాన్ని సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: הֲמֵעִמְּךָ
  choice: నీ నిర్ణయం ప్రకారమే
  rationale: అక్షరార్థంగా ‘నీ దగ్గరనుండి/నీతోనుండి’ అనే ఈ అరుదైన ప్రయోగం సందర్భంలో యోబు అభిప్రాయం లేదా నిర్ణయమే దేవుని ప్రతిఫలాన్ని నిర్దేశించాలా అనే ప్రశ్నను సూచిస్తుంది. తెలుగు పాఠకునికి సహజంగా ఉండేలా భావాన్ని తెలిపి, ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: יְשַׁלְמֶנָּה
  choice: ప్రతిఫలం చెల్లించాలా
  rationale: Piel రూపంలోని שלם ఇక్కడ ‘తిరిగి చెల్లించు, తగిన ప్రతిఫలం ఇవ్వు’ అనే భావం కలిగి ఉంది. స్త్రీలింగ ఏకవచన ప్రత్యయానికి సూచిత విషయం స్పష్టంగా లేనందున ప్రధాన పాఠంలో ప్రత్యేక కర్మను చేర్చలేదు.
- source_word: כִּי מָאַסְתָּ
  choice: నీవు దాన్ని తిరస్కరించావు గనుక
  rationale: מאס అంటే ‘తిరస్కరించు, నిరాకరించు, అసహ్యించుకొను.’ ఇక్కడ మితమైన, సందర్భోచితమైన ‘తిరస్కరించావు’ను ఎంచుకున్నాం; సూచిత కర్మ ఏదో స్పష్టంగా నిర్ధారించకుండా ‘దాన్ని’ అని ఉంచాం.
- source_word: כִּי אַתָּה תִבְחַר וְלֹא אָנִי
  choice: ఎంచుకోవలసింది నీవే, నేను కాదు
  rationale: בחר యొక్క ప్రాథమిక భావమైన ‘ఎంచుకొను’ను నిలిపి, యోబు తన స్థానం తానే వెల్లడించాలనే అలీహూ సవాలును సహజమైన తెలుగులో వ్యక్తం చేశాం.
- source_word: וּמַה יָדַעְתָּ דַבֵּר
  choice: కాబట్టి నీకు తెలిసింది చెప్పు
  rationale: ‘నీకు తెలిసినదేమిటో మాట్లాడు’ అనే హీబ్రూ క్రమాన్ని సహజమైన ఆధునిక తెలుగులో ప్రత్యక్ష సవాలుగా అందించాం.
theological_decisions:
- issue: ‘దాన్ని’ అనే సూచిత కర్మ యొక్క గుర్తింపు
  choice: ప్రధాన పాఠంలో ‘దాన్ని’ అని అనిర్దిష్టంగా ఉంచడం
  alternative: దేవుని తీర్పు, దేవుని పరిపాలనా విధానం, లేదా ప్రతిపాదిత ప్రతిఫలం అని స్పష్టీకరించడం
  rationale: హీబ్రూ పాఠం సూచిత కర్మను ఖచ్చితంగా గుర్తించదు. దానిని ఏకార్థంగా నిర్ణయించడం వచనంలోని నిజమైన సందిగ్ధతను తొలగిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే పదజాలం. హీబ్రూ ప్రశ్నలోని కఠిన నుడికారాన్ని సహజీకరించాం, కానీ సూచిత కర్మలోని సందిగ్ధతను పాదటిప్పణితో నిలిపాం.
