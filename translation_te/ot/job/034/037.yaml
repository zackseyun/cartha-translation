    rationale: ‘చేతులు ఒకదానితో ఒకటి కొడుతున్నాడు’ can be made grammatically smoother as ‘చేతులను ఒకదానితో ఒకటి కొట్టుకుంటున్నాడు,’ without changing the lexical alternative or its interpretive caution.
