    rationale: ‘తన మాటలను పెంచుతున్నాడు’ is understandable but reads as a close lexical calque. Revising it to ‘తన మాటలను విస్తరింపజేస్తున్నాడు’ conveys multiplying/expanding speech more naturally in formal Telugu.
  - severity: low
