source:
  edition: WLC
  text: כִּ֥י יֹ֘סִ֤יף עַֽל חַטָּאת֣/וֹ פֶ֭שַׁע בֵּינֵ֣י/נוּ יִסְפּ֑וֹק וְ/יֶ֖רֶב אֲמָרָ֣י/ו לָ/אֵֽל־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/job/034/037.yaml
  text: For he adds rebellion to his sin[a]; among us he claps his hands[b], and he multiplies his words against God.
translation:
  language: te
  text: ఎందుకంటే అతడు తన పాపానికి తిరుగుబాటును తోడుచేస్తున్నాడు; మన మధ్య చేతులు చరుస్తున్నాడు[a], దేవునికి విరోధంగా[b] తన మాటలను విస్తరింపజేస్తున్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘చేతులను ఒకదానితో ఒకటి కొట్టుకుంటున్నాడు.’ ఈ సంజ్ఞ ఎగతాళి, ధిక్కారం లేదా అపహాస్యాన్ని సూచించే అవకాశం ఉంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘దేవునికి.’ హెబ్రీ ఉపసర్గను మరింత తటస్థంగా దిశను సూచించేదిగా అర్థం చేసుకోవచ్చు; అయితే సందర్భం ‘దేవునికి విరోధంగా’ అనే భావానికి అనుకూలంగా ఉంది.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి తీర్పుకు ఏలీహు చెప్పే కారణాన్ని పరిచయం చేస్తుంది.
- source_word: יֹסִיף עַל חַטָּאתוֹ
  choice: తన పాపానికి ... తోడుచేస్తున్నాడు
  rationale: ఇప్పటికే ఉన్న పాపానికి మరొక అపరాధాన్ని కలుపుతున్న భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: פֶשַׁע
  choice: తిరుగుబాటు
  rationale: సాధారణ అపరాధం కంటే ధిక్కారపూర్వకమైన అతిక్రమణ లేదా తిరుగుబాటు అనే బలమైన భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: בֵּינֵינוּ
  choice: మన మధ్య
  rationale: అక్షరార్థమైన ‘మన మధ్య’ అనే సామాజిక సందర్భాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: יִסְפּוֹק
  choice: చేతులు చరుస్తున్నాడు
  rationale: సందర్భంలో ఎగతాళి లేదా ధిక్కారాన్ని సూచించే స్పష్టమైన చేతి సంజ్ఞను అనువదిస్తుంది; దాని భావాన్ని పాదసూచికలో వివరిస్తుంది.
- source_word: וְיֶרֶב אֲמָרָיו
  choice: తన మాటలను పెంచుతున్నాడు
  rationale: మాటలను అధికం చేయడం లేదా పోగుచేయడం అనే హిఫిల్ క్రియ యొక్క చిత్రాన్ని నిలుపుతుంది.
- source_word: לָאֵל
  choice: దేవునికి విరోధంగా
  rationale: ל అనే ఉపసర్గ సాధారణంగా దిశను సూచించగలిగినా, ఈ నిందాపూర్వక సందర్భంలో మాటలు దేవునికి వ్యతిరేకంగా ఉన్నాయని భావించడం వాక్యంలోని తీవ్రతకు సరిపోతుంది.
theological_decisions:
- issue: לָאֵל ను కేవలం ‘దేవునితో/దేవునికి’ అని అనువదించాలా, లేక విరోధ భావంతో అనువదించాలా?
  choice: దేవునికి విరోధంగా
  alternative: దేవునికి
  rationale: పాపానికి తిరుగుబాటును తోడుచేయడం, ధిక్కార సూచకంగా చేతులు చరచడం, మాటలను పెంచడం అనే వరుసలో విరోధ భావం సందర్భానికి బాగా సరిపోతుంది. అయినా హెబ్రీ ఉపసర్గలోని మరింత తటస్థమైన దిశార్థాన్ని పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన శైలి. మూలంలోని అపరాధాల తీవ్రత పెరుగుతున్న క్రమాన్ని, చేతి సంజ్ఞ యొక్క స్పష్టతను, לָאֵל లోని అర్థసందిగ్ధతను నిలుపుకుంది.
