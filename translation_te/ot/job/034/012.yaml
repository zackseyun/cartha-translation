source:
  edition: WLC
  text: אַף אָמְנָ֗ם אֵ֥ל לֹֽא יַרְשִׁ֑יעַ וְ֝/שַׁדַּ֗י לֹֽא יְעַוֵּ֥ת מִשְׁפָּֽט־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/012.yaml
  text: Indeed[a], God does not act wickedly, and the Almighty does not pervert justice.
translation:
  language: te
  text: నిశ్చయంగా, దేవుడు దుష్టంగా ప్రవర్తించడు[a]; సర్వశక్తిమంతుడు న్యాయాన్ని వక్రీకరించడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దేవుడు అన్యాయంగా దోషిగా తీర్పు ఇవ్వడు,” లేదా “దేవుడు దోషిగా ప్రకటించడు.” హీబ్రూ క్రియ కొన్ని సందర్భాల్లో న్యాయపరమైన భావాన్ని కలిగి ఉంటుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: אַף אָמְנָם
  choice: నిశ్చయంగా
  rationale: ఈ పదసముచ్చయం వాక్యాన్ని బలంగా ధృవీకరిస్తుంది. ‘నిశ్చయంగా’ ఆధునిక తెలుగులో సహజంగా ఆ ఉద్ఘాటనను తెలియజేస్తుంది.
- source_word: אֵל
  choice: దేవుడు
  rationale: ఇక్కడ ఇది ఇశ్రాయేలు దేవునికి వాడిన దైవనామం/బిరుదు. సమాంతరంగా ‘సర్వశక్తిమంతుడు’ ఉన్నందున ‘దేవుడు’ సహజమైన అనువాదం.
- source_word: יַרְשִׁיעַ
  choice: దుష్టంగా ప్రవర్తించడు
  rationale: רשע హిఫీల్ రూపానికి న్యాయస్థాన సంబంధమైన ‘దోషిగా ప్రకటించు’ అనే భావం ఉండగలిగినా, ఇక్కడి సమాంతర వాక్యం మరియు దేవుని నైతిక న్యాయాన్ని గూర్చిన సందర్భం ‘దుష్టంగా ప్రవర్తించడు’ అనే విస్తృత భావానికి మద్దతిస్తాయి.
- source_word: שַׁדַּי
  choice: సర్వశక్తిమంతుడు
  rationale: యోబు గ్రంథంలో ఈ దైవబిరుదుకు తెలుగులో స్థిరమైన, అర్థవంతమైన అనువాదం ‘సర్వశక్తిమంతుడు’.
- source_word: יְעַוֵּת
  choice: వక్రీకరించడు
  rationale: ఈ క్రియ వంచడం, తారుమారు చేయడం అనే భావాన్ని ఇస్తుంది. ‘న్యాయాన్ని వక్రీకరించడు’ అనేది ఖచ్చితమైన, సహజమైన న్యాయపరమైన ప్రయోగం.
- source_word: מִשְׁפָּט
  choice: న్యాయం
  rationale: ఇక్కడ ఈ పదం తీర్పు ప్రక్రియకన్నా న్యాయమైన ప్రమాణం లేదా న్యాయాన్ని సూచిస్తుంది; అందువల్ల ‘న్యాయం’ స్పష్టంగా ఉంటుంది.
theological_decisions:
- issue: దేవుని స్వభావానికి సంబంధించి יַרְשִׁיעַ భావం
  choice: దేవుడు దుష్టంగా ప్రవర్తించడు
  alternative: దేవుడు అన్యాయంగా దోషిగా తీర్చడు; దేవుడు దోషిగా ప్రకటించడు
  rationale: ఈ వాక్యం దేవుని నైతిక మరియు న్యాయపరమైన యథార్థతను ప్రకటిస్తుంది. క్రియకు న్యాయస్థాన సంబంధమైన భావం ఉండగలదని పాదసూచికలో నిలిపి ఉంచుతూ, ప్రధాన పాఠంలో సమాంతర వాక్యానికి సరిపోయే విస్తృత భావాన్ని ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘దుష్టంగా ప్రవర్తించడు’ మూలక్రియలోని నైతిక భావాన్ని నిలుపుతుంది; సాధ్యమైన న్యాయస్థాన భావం పాదసూచికలో భద్రపరచబడింది.
