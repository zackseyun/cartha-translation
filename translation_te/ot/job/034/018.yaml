  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి వాడబడింది. పద్యం ముందున్న సందర్భంతో కలిసే సంబంధవాచక వాక్యఖండంగా నిలుస్తుంది; ప్రత్యక్ష సంబోధనల తీవ్రతను నిలుపుకుంది.
