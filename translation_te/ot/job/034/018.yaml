  edition: WLC
  text: הַ/אֲמֹ֣ר לְ/מֶ֣לֶךְ בְּלִיָּ֑עַל רָ֝שָׁ֗ע אֶל נְדִיבִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/018.yaml
  text: who says to a king[a], ‘Worthless one!’ and to nobles[b], ‘Wicked ones!’
translation:
  language: te
  text: రాజుతో, “పనికిమాలినవాడా![a]” అనీ, ప్రభువులతో, “దుష్టులారా![b]” అనీ చెప్పేవాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ఇది “విలువలేనివాడా” లేదా “నీచుడా” అనే దూషణపదం. ఇక్కడ ఇది తరువాతి కాలంలో వాడబడిన ‘బెలియాలు’ (Belial) అనే వ్యక్తినామం కాదు.
    reason: lexical_alternative
  - marker: b
    text: “దుష్టుడు” అనే హీబ్రూ పదం రూపరీత్యా ఏకవచనం; అయితే అది బహువచనంలోని “ప్రభువులు”ను ఉద్దేశించి ఉంది కాబట్టి తెలుగులో బహువచనంగా అనువదించబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַאֲמֹר
  choice: పలికేవాడు
  rationale: ఈ రూపం సందర్భంలో వ్యక్తిని సూచిస్తూ, ముందున్న వాక్యంతో సంబంధం కలిగిన ‘పలికేవాడు/అనేవాడు’ అనే భావాన్ని ఇస్తుంది. తెలుగు వాక్యప్రవాహానికి ‘పలికేవాడు’ సహజంగా సరిపోతుంది.
- source_word: לְמֶלֶךְ
  choice: రాజుతో
  rationale: לְ ఇక్కడ మాట ఎవరిని ఉద్దేశించి చెప్పబడుతుందో సూచిస్తుంది. నిర్దిష్ట ఉపపదం లేనందున ‘ఒక రాజు’ అనే సాధారణ భావం ఉంది; తెలుగులో ‘రాజుతో’ అనడం దానిని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בְּלִיָּעַל
  choice: నీచుడా
  rationale: ఇక్కడ ఇది తరువాతి కాలంలో వ్యక్తినామంగా వాడబడిన ‘బెలీయాలు’ కాదు; విలువలేమి లేదా నీచత్వాన్ని సూచించే దూషణ పదం. రాజును నేరుగా సంబోధించే ఏకవచన రూపంగా ‘నీచుడా’ ఎంచుకున్నాం.
- source_word: רָשָׁע
  choice: దుష్టులారా
  rationale: హీబ్రూలో పదం రూపరీత్యా ఏకవచనమైనా, బహువచనంలోని ‘ప్రభువులు’ను ఉద్దేశించి వాడబడింది. తెలుగులో సంబోధన స్పష్టంగా ఉండేందుకు బహువచనంగా అనువదించాం.
- source_word: אֶל
  choice: తో
  rationale: ఇక్కడ אֶל మాటను ఎవరిని ఉద్దేశించి పలుకుతున్నారో తెలియజేస్తుంది; సమాంతరమైన మొదటి భాగానికి అనుగుణంగా తెలుగులో ‘తో’ సహజం.
- source_word: נְדִיבִים
  choice: ప్రభువులు
  rationale: ఈ సందర్భంలో ఈ పదం సమాజంలో ఉన్నత స్థానంగల వారిని లేదా పాలకవర్గ ప్రముఖులను సూచిస్తుంది. ‘రాజు’కు సమాంతరంగా ‘ప్రభువులు’ గౌరవప్రదంగాను సహజంగాను ఉంది.
