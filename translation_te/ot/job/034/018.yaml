  naturalness: The relative clause is natural as a continuation from the preceding context. The revised insult is idiomatic modern standard Telugu, and the direct-address plural దుష్టులారా is clear and forceful.
  terminology: ప్రభువులు suitably represents נְדִיבִים in its social-political sense. The footnote should identify the later usage as the proper name “బెలియాలు/Belial,” rather than calling it a generic “వ్యక్తినామం” with an imprecise Telugu form.
