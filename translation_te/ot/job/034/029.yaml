source:
  edition: WLC
  text: וְ/ה֤וּא יַשְׁקִ֨ט וּ/מִ֥י יַרְשִׁ֗עַ וְ/יַסְתֵּ֣ר פָּ֭נִים וּ/מִ֣י יְשׁוּרֶ֑/נּוּ וְ/עַל גּ֖וֹי וְ/עַל אָדָ֣ם יָֽחַד׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/029.yaml
  text: If he gives quietness[a], who can condemn? If he hides his face[c][b], who can behold him? This is so for a nation and for a man alike.
translation:
  language: te
  text: 'ఆయన నెమ్మది కలిగిస్తే, ఆయనను ఎవరు దోషిగా తీర్పు తీర్చగలరు?[a]


    ఆయన తన ముఖాన్ని దాచుకుంటే, ఆయనను ఎవరు చూడగలరు?[b]


    ఒక జనానికైనా, ఒక వ్యక్తికైనా ఇదే వర్తిస్తుంది.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఎవరు ఆయనను దోషిగా ప్రకటించగలరు?’ హీబ్రూ క్రియకు న్యాయస్థాన సంబంధమైన ‘దుష్టుడని లేదా దోషి అని ప్రకటించు’ అనే అర్థం ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘ఆయనను ఎవరు చూడగలరు?’ హీబ్రూ క్రియకు ‘చూడు, దృష్టిపెట్టు’ అనే అర్థం ఉంది.
    reason: lexical_alternative
  - marker: c
    text: అక్షరార్థంగా, ‘ఒక జనము మీదనూ, ఒక మనిషి మీదనూ, కలిసి.’ అంటే ఇది జనానికీ వ్యక్తికీ సమానంగా వర్తిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַשְׁקִט
  choice: నెమ్మది కలిగిస్తే
  rationale: 'שקט హిఫీల్ రూపంలోని కారణార్థాన్ని నిలుపుతుంది: ఆయన కేవలం నిశ్చలంగా ఉండడం కాదు, నెమ్మది లేదా ప్రశాంతత కలిగించడం. ‘శాంతి’ అనేది సాధ్యమైనా, మూలపదం שלום కంటే విస్తృతమైనది.'
- source_word: יַרְשִׁעַ
  choice: దోషిగా తీర్పు తీర్చగలరు
  rationale: רשע హిఫీల్‌కు న్యాయపరంగా ‘దుష్టుడని/దోషి అని ప్రకటించు’ అనే అర్థం ఉంది. తెలుగు పాఠకుడికి ఆ న్యాయార్థం స్పష్టంగా ఉండేలా ఈ పదబంధం ఎంచుకోబడింది.
- source_word: יַסְתֵּר פָּנִים
  choice: తన ముఖాన్ని దాచుకుంటే
  rationale: ‘ముఖాన్ని దాచు’ అనే హీబ్రూ రూపకాన్ని యథాతథంగా నిలిపి, దేవుని అగోచరత లేదా ఉపసంహరణలోని భావవిస్తృతిని సంకుచితం చేయకుండా ఉంచుతుంది.
- source_word: יְשׁוּרֶנּוּ
  choice: ఆయనను ... చూడగలరు
  rationale: שור అంటే ‘చూడు, దృష్టిపెట్టు.’ కర్మప్రత్యయం ఏకవచన పుంలింగంలో ఉండి దేవునినే సూచిస్తుంది. ఆధునిక తెలుగులో ‘చూడగలరు’ సహజంగా ఉంది.
- source_word: גּוֹי
  choice: జనము
  rationale: ఇక్కడ גוי ఒక సామూహిక రాజకీయ/సామాజిక సమూహాన్ని సూచిస్తుంది; అన్యజనులు అనే మతపరమైన భేదాన్ని దిగుమతి చేయకుండా ‘జనము’ ఆ భావాన్ని ఇస్తుంది.
- source_word: אָדָם
  choice: వ్యక్తి
  rationale: సామూహికమైన జనముతో వ్యక్తిగత మానవుణ్ణి వ్యత్యాసపరుస్తుంది. ఆధునిక ప్రామాణిక తెలుగులో ‘వ్యక్తి’ ప్రతినిధి ఏకవచన భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: יָחַד
  choice: ఇద్దరి విషయంలోనూ
  rationale: ఇక్కడ יחד స్థలపరంగా ‘కలిసి’ కంటే, జనానికీ వ్యక్తికీ సమాన వర్తింపును సూచిస్తుంది.
- source_word: וְעַל גּוֹי וְעַל אָדָם יָחַד
  choice: ఒక జనమైనా, ఒక వ్యక్తైనా—ఇద్దరి విషయంలోనూ ఇదే వర్తిస్తుంది
  rationale: על యొక్క అనువర్తన/పరిధి భావాన్ని సహజ తెలుగులో స్పష్టం చేస్తుంది; ‘మీద’ లేదా ‘విరోధంగా’ అని అనువదించి శిక్షాత్మక భావాన్ని అనవసరంగా నిర్దిష్టం చేయదు.
theological_decisions:
- issue: దేవుడు తన ముఖాన్ని దాచుకోవడం
  choice: ‘తన ముఖాన్ని దాచుకుంటే’ అనే మానవరూప వర్ణనను నిలిపివేయడం
  alternative: ‘తన అనుగ్రహాన్ని ఉపసంహరించుకుంటే’ లేదా ‘వారివైపు చూడకపోతే’
  rationale: మూలంలోని దైవిక అగోచరత/ఉపసంహరణ భావాన్ని కేవలం అనుగ్రహలేమిగా పరిమితం చేయకుండా, దాని వేదాంతపరమైన ఉద్వేగాన్ని కాపాడుతుంది.
- issue: చివరి పదబంధపు పరిధి
  choice: ముందటి వాక్యాలు జనానికీ వ్యక్తికీ సమానంగా వర్తిస్తాయని తెలియజేయడం
  alternative: ‘జనానికి విరోధంగానైనా, వ్యక్తికి విరోధంగానైనా’ అని శిక్షాత్మకంగా చదవడం
  rationale: על అనే ఉపసర్గ ఇక్కడ పరిధి లేదా సంబంధాన్ని సూచించగలదు. శిక్షాత్మక భావాన్ని బలవంతంగా చేర్చకుండా మూలంలోని సాధ్యమైన విస్తృతిని ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. కవితాత్మక సమాంతర నిర్మాణం కోసం మొదటి రెండు పాదాలు ప్రశ్నారూపంలో ఉంచబడ్డాయి. ‘ముఖాన్ని దాచుకోవడం’ అనే మూల రూపకం అలాగే నిలుపబడింది; చివరి పాదం సహజ తెలుగులో పరిధి భావాన్ని వివరిస్తుంది.
