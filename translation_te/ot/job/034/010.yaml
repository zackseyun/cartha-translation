id: JOB.34.10
reference: Job 34:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: לָ/כֵ֤ן אַ֥נֲשֵׁ֥י לֵבָ֗ב שִׁמְע֫וּ לִ֥/י חָלִ֖לָ/ה לָ/אֵ֥ל מֵ/רֶ֗שַׁע וְ/שַׁדַּ֥י מֵ/עָֽוֶל׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/010.yaml
  text: 'Therefore[a], men of understanding, listen to me: far be it from God to do wickedness[b], and from the Almighty to do wrong.'
translation:
  language: te
  text: 'కాబట్టి, వివేచనగల పురుషులారా[a], నా మాట వినండి: దేవుడు దుష్టత్వం చేయడం[b], సర్వశక్తుడు అన్యాయం చేయడం—అసంభవం!'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ అక్షరార్థం ‘హృదయంగల పురుషులు.’ ఇక్కడ ‘హృదయం’ అవగాహన లేదా వివేచనకు నుడికారం.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘దుష్టత్వం దేవునికి, అన్యాయం సర్వశక్తునికి దూరం.’ దేవునికి అలాంటి చెడు సంబంధించడం ఊహించలేనిదని హీబ్రూ బలంగా నిరాకరిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: కాబట్టి
  rationale: ముందటి వాదన నుంచి వచ్చే నిర్ధారణను సూచించే సహజమైన తెలుగు అనుసంధాన పదం.
- source_word: אַנֲשֵׁי לֵבָב
  choice: వివేచనగల పురుషులారా
  rationale: అక్షరార్థంగా ‘హృదయంగల పురుషులు’; ఇక్కడ ‘హృదయం’ అవగాహన, వివేచనను సూచించే హీబ్రూ నుడికారం. పురుష బహువచన రూపాన్ని కూడా నిలిపింది.
- source_word: שִׁמְעוּ לִי
  choice: నా మాట వినండి
  rationale: వక్తకు శ్రద్ధగా చెవియొగ్గాలనే ఆజ్ఞను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: חָלִילָה
  choice: అసంభవం!
  rationale: తీవ్రమైన నిరాకరణను సూచించే హీబ్రూ నుడికారానికి బలమైన, సహజమైన తెలుగు సమానం.
- source_word: לָאֵל מֵרֶשַׁע
  choice: దేవుడు దుష్టత్వం చేయడం
  rationale: దేవునికి దుష్టత్వం పూర్తిగా దూరమనే భావంలో అంతర్లీనంగా ఉన్న క్రియాత్మక అర్థాన్ని తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: וְשַׁדַּי
  choice: సర్వశక్తుడు
  rationale: שַׁדַּי ఇక్కడ దైవిక బిరుదు; కాబట్టి పేరుగా లిప్యంతరీకరించకుండా దాని భావాన్ని అనువదించింది.
- source_word: מֵעָוֶל
  choice: అన్యాయం చేయడం
  rationale: עָוֶל లోని అన్యాయం, నీతివిరుద్ధత అనే భావాన్ని ముందటి సమాంతర వాక్యభాగానికి అనుగుణంగా అందిస్తుంది.
theological_decisions:
- issue: שַׁדַּי అనే దైవిక బిరుదు అనువాదం
  choice: సర్వశక్తుడు
  alternative: షద్దాయి
  rationale: ఇది ఇక్కడ వ్యక్తినామం కంటే దైవిక బిరుదుగా పనిచేస్తుంది; భావానువాదం సాధారణ తెలుగు పాఠకునికి అర్థాన్ని నేరుగా అందిస్తుంది.
- issue: אַנֲשֵׁי לֵבָב లోని లింగ సూచన
  choice: వివేచనగల పురుషులారా
  alternative: వివేచనగలవారలారా
  rationale: హీబ్రూ పదబంధంలోని వ్యాకరణపరమైన పురుష బహువచనాన్ని నిలుపుతూ, ‘హృదయం’ అనే నుడికారానికి ‘వివేచన’ అనే భావాన్ని ఇచ్చింది.
- issue: חָלִילָה నిర్మాణంలోని బలమైన నిరాకరణ
  choice: రెండు కార్యాలకూ చివరగా ‘అసంభవం!’
  alternative: దేవునికి దుష్టత్వం దూరమగుగాక; సర్వశక్తునికి అన్యాయం దూరమగుగాక
  rationale: హీబ్రూ వాక్యం దేవుడు అలా చేయకూడదనే కోరికకన్నా, అలాంటి చెడు ఆయన విషయంలో ఊహించలేనిదని తీవ్రంగా ప్రకటిస్తుంది. చివరి ఉద్ఘాటన రెండు సమాంతర భాగాలకూ వర్తిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన సంభోదనను నిలిపింది. ‘పురుషులారా’ మూలంలోని లింగరూపాన్ని కాపాడుతుంది; ‘అసంభవం!’ חָלִילָה యొక్క తీవ్ర నిరాకరణను సాధారణ పాఠకునికి సహజంగా అందిస్తుంది. [a], [b] సూచికలు ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
