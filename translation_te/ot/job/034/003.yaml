  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּי אֹ֭זֶן מִלִּ֣ין תִּבְחָ֑ן וְ֝/חֵ֗ךְ יִטְעַ֥ם לֶ/אֱכֹֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/003.yaml
  text: For the ear tests words[a], as the palate tastes food.
translation:
  language: te
  text: ఎందుకంటే చెవి మాటలను పరీక్షిస్తుంది; అంగిలి ఆహారాన్ని రుచి చూస్తుంది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘తినేదాన్ని రుచి చూస్తుంది.’
    reason: לֶאֱכֹל అనే రూపాన్ని ‘ఆహారం’గా లేదా మరింత అక్షరార్థంగా ‘తినేది’గా అర్థం చేసుకోవచ్చు.
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందున్న ఉపదేశానికి వివరణాత్మకమైన కారణాన్ని పరిచయం చేస్తుంది; ఆధునిక తెలుగులో సహజమైన కారణార్థక అనుసంధానం.
- source_word: אֹזֶן
  choice: చెవి
  rationale: ఏ చెవికైనా వర్తించే సామెతసదృశ ఏకవచనం; తెలుగులో నిర్దిష్ట ఉపపదం అవసరం లేదు.
- source_word: מִלִּין
  choice: మాటలను
  rationale: పలికిన పదాలు లేదా వాక్కు అనే భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: תִּבְחָן
  choice: పరీక్షిస్తుంది
  rationale: בחן ధాతువులోని పరిశీలించి విలువ నిర్ధారించే భావాన్ని నిలుపుతుంది; రుచి చూడటంతో ఉన్న ఉపమాన సమాంతరతను కూడా కాపాడుతుంది.
- source_word: חֵךְ
  choice: అంగిలి
  rationale: మొత్తం నోరు లేదా నాలుక కాకుండా రుచిని గ్రహించే palate‌ను నిర్దిష్టంగా సూచిస్తుంది.
- source_word: יִטְעַם
  choice: రుచి చూస్తుంది
  rationale: טעם యొక్క ప్రత్యక్ష క్రియార్థాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: לֶאֱכֹל
  choice: ఆహారాన్ని
  rationale: ‘తినడానికి’ అనే క్రియానామ రూపం ఇక్కడ తినే పదార్థాన్ని సూచిస్తుంది; ‘ఆహారం’ స్పష్టమైన సహజ తెలుగు రూపం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సామెతసదృశ సమాంతర నిర్మాణాన్ని నిలిపాం. ‘అంగిలి’ మూలంలోని శరీరాంగ సూచనను కచ్చితంగా ప్రతిబింబించే గౌరవప్రదమైన పదం; పాఠ్య ప్రవాహం కోసం రెండు భాగాలను అర్ధవిరామంతో కలిపాం.
