source:
  edition: WLC
  text: תַּֽחַת רְשָׁעִ֥ים סְפָקָ֗/ם בִּ/מְק֥וֹם רֹאִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/026.yaml
  text: He strikes them as wicked people in full view[a].
translation:
  language: te
  text: దుర్మార్గులుగా వారిని ఆయన అందరి కళ్లముందు కొడతాడు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారి దుర్మార్గతను బట్టి ఆయన వారిని అందరి కళ్లముందు కొడతాడు.” క్లిష్టమైన ప్రారంభ పదబంధం, వారు ఏ హోదాలో కొట్టబడుతున్నారో కాక వారి శిక్షకు కారణాన్ని సూచిస్తుండవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: תַּחַת
  choice: గా
  rationale: ఇక్కడ ఈ విభక్తి ప్రత్యయం వారిని ఏ హోదాలో కొడుతున్నాడో సూచిస్తున్నదిగా గ్రహించబడింది. కారణార్థకమైన ‘వారి దుర్మార్గతను బట్టి’ అనే భావాన్ని పాదసూచికలో ఉంచాం.
- source_word: רְשָׁעִים
  choice: దుర్మార్గులు
  rationale: బహువచన విశేషణం నామవాచకంగా వాడబడింది; తెలుగులో ‘దుర్మార్గులు’ సహజంగా, లింగపరమైన అనవసర పరిమితి లేకుండా అర్థాన్ని అందిస్తుంది.
- source_word: סְפָקָם
  choice: వారిని ఆయన కొడతాడు
  rationale: ఈ క్రియ కొట్టడాన్ని సూచిస్తుంది. మూలంలో స్పష్టంగా లేని ‘చంపివేస్తాడు’ లేదా ‘పడగొడతాడు’ వంటి ఫలితాన్ని అనువాదంలో చేర్చలేదు.
- source_word: בִּמְקוֹם רֹאִים
  choice: అందరి కళ్లముందు
  rationale: చూసేవారు ఉన్న చోటు అనే మూలభావాన్ని, శిక్ష బహిరంగంగా అమలవుతున్నదనే అర్థంతో సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: 'תַּחַת רְשָׁעִים అనే క్లిష్ట పదబంధం: హోదానా, శిక్షకు కారణమా?'
  choice: ‘దుర్మార్గులుగా’—వారు ఏ హోదాలో కొట్టబడుతున్నారో తెలిపే భావం
  alternative: ‘వారి దుర్మార్గతను బట్టి’—శిక్షకు కారణాన్ని తెలిపే భావం
  rationale: సందర్భంలో న్యాయతీర్పు సంబంధమైన హోదా ప్రధాన పాఠానికి తగినదిగా ఉంది; అయితే హీబ్రూ పదబంధం కారణార్థాన్నీ అనుమతించగలదు కాబట్టి ఆ నిజమైన సందిగ్ధతను పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన శైలి వాడబడింది. ‘అందరి కళ్లముందు’ అనే సహజ ప్రయోగం బహిరంగ దృశ్యతను తెలియజేస్తుంది; మూలంలో లేని మరణం లేదా పూర్తిగా పడగొట్టడం వంటి భావాలు చేర్చబడలేదు.
