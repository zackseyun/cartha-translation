base_translation:
  language: en
  yaml_path: translation/ot/job/034/025.yaml
  text: Therefore he recognizes their deeds; he overturns them in the night[a], and they are crushed.
translation:
  language: te
  text: కాబట్టి ఆయన వారి క్రియలను గుర్తిస్తాడు; రాత్రివేళ వారిని కూలదోస్తాడు[a], వారు నలిగిపోతారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆయన వారిని రాత్రిలోనే తలకిందులు చేస్తాడు.” హెబ్రీలో “కూలదోస్తాడు” అనే క్రియకు కర్మ స్పష్టంగా లేదు; సందర్భం తీర్పుకు గురయ్యే దుష్ట పాలకులను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: కాబట్టి
  rationale: ముందటి వాదన నుంచి వచ్చే తార్కిక పరిణామాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: יַכִּיר
  choice: గుర్తిస్తాడు
  rationale: నכר అనే ధాతువు హిఫీల్ రూపంలో ఇక్కడ వారి క్రియలను గుర్తించి, వాటిని పూర్తిగా గ్రహించే భావాన్ని ఇస్తుంది.
- source_word: מַעְבָּדֵיהֶם
  choice: వారి క్రియలను
  rationale: వారు చేసిన పనులను సూచిస్తుంది; నైతిక, న్యాయతీర్పు సందర్భానికి ‘క్రియలు’ తగిన గంభీరతను కలిగిస్తుంది.
- source_word: וְהָפַךְ
  choice: వారిని కూలదోస్తాడు
  rationale: הפך లోని తలకిందులు చేయడం లేదా పడగొట్టడం అనే బలమైన భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది. హెబ్రీలో కర్మ స్పష్టంగా లేకపోయినా, సందర్భం ప్రకారం ‘వారిని’ చేర్చబడింది.
- source_word: לַיְלָה
  choice: రాత్రివేళ
  rationale: అకస్మాత్తుగా రాత్రిలో జరిగే తీర్పును సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וְיִדַּכָּאוּ
  choice: వారు నలిగిపోతారు
  rationale: דכא ధాతువులోని నలగగొట్టబడడం అనే బలమైన నిష్క్రియ భావాన్ని తెలుగులో సహజంగా నిలుపుతుంది.
theological_decisions:
- issue: తీర్పు దృశ్యంలో అంతర్లీనంగా ఉన్న కర్త, కర్మ
  choice: అన్ని క్రియల కర్త దేవుడే; ‘కూలదోస్తాడు’ అనే క్రియకు సందర్భానుసారంగా దుష్టులైన పాలకులను సూచించే ‘వారిని’ కర్మగా చేర్చబడింది.
  alternative: హెబ్రీలో కర్మను చేర్చకుండా ‘రాత్రివేళ కూలదోస్తాడు’ అని అనువదించడం; లేదా ‘రాత్రిని తలకిందులు చేస్తాడు’ అని గ్రహించడం.
  rationale: యోబు 34:24–26 సందర్భంలో దేవుడు బలవంతులైన దుష్టులను ఎరిగి తీర్పు తీర్చడం గురించి ఉంది. ‘వారిని’ అని చేర్చడం సందర్భార్థాన్ని స్పష్టం చేస్తుంది; అయితే మూలంలోని కర్మలేమిని పాదసూచికలో తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన శైలి. ‘క్రియలు,’ ‘కూలదోస్తాడు,’ ‘నలిగిపోతారు’ అనే పదాలు న్యాయతీర్పు సందర్భంలోని బలాన్ని నిలుపుతూ సాధారణ పాఠకులకు అర్థమయ్యేలా ఉన్నాయి.
