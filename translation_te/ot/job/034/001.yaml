lexical_decisions:
- source_word: וַיַּעַן
  choice: జవాబిచ్చాడు
  rationale: ענה అనే క్రియ యొక్క ఈ కథన రూపం తరువాతి ప్రసంగాన్ని ప్రతిస్పందనగా పరిచయం చేస్తుంది. ‘జవాబిచ్చాడు’ మూలంలోని సంభాషణాత్మక భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: אֱלִיהוּא
  choice: ఎలీహూ
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగులో గుర్తించదగిన, మూల ఉచ్చారణకు సమీపమైన రూపంలో లిప్యంతరీకరించాం.
- source_word: וַיֹּאמַר
  choice: ఇలా
  rationale: హీబ్రూలోని సూత్రప్రాయమైన ‘జవాబిచ్చి చెప్పాడు’ అనే ద్విక్రియా నిర్మాణాన్ని తెలుగులో యాంత్రికంగా పునరావృతం చేయకుండా, ప్రసంగానికి సహజంగా దారితీసే ‘ఇలా జవాబిచ్చాడు’గా అందించాం. ‘ఇలా’ తరువాత వచ్చే ప్రత్యక్ష వాక్యాన్ని సూచిస్తూ אמר యొక్క వాక్యారంభ విధిని వ్యక్తపరుస్తుంది.
- source_word: וַ
  choice: అప్పుడు
  rationale: మొదటి wayyiqtol‌కు ముందున్న waw కథనాన్ని ముందుకు నడిపిస్తుంది. ‘అప్పుడు’ ఆ క్రమబద్ధ పురోగతిని సహజమైన తెలుగులో తెలియజేస్తుంది.
