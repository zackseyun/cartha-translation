source:
  edition: WLC
  text: לְ/הָבִ֣יא עָ֭לָי/ו צַֽעֲקַת דָּ֑ל וְ/צַעֲקַ֖ת עֲנִיִּ֣ים יִשְׁמָֽע־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/028.yaml
  text: so as to bring before him the cry of the poor[b][a], and he hears the cry of the afflicted.
translation:
  language: te
  text: పేదవాని[b] మొరను ఆయన సన్నిధికి చేరేలా చేశారు[a]; బాధితుల మొరను ఆయన వింటాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘అతని మీదికి’ లేదా ‘అతనికి వ్యతిరేకంగా.’ ఇక్కడి హీబ్రూ ఉపసర్గను ఒకటి కంటే ఎక్కువ విధాలుగా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘బలహీనుని ... అణచివేయబడినవారి.’ ఈ రెండు హీబ్రూ పదాల అర్థాలు ఒకదానితో ఒకటి కలుస్తాయి, కానీ అవి పూర్తిగా ఒకటే కావు.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהָבִיא
  choice: చేరేలా చేశారు
  rationale: לְ తో కూడిన హిఫీల్ క్రియారూపం ముందటి సందర్భానికి అనుసంధానమైన ఉద్దేశం లేదా ఫలితాన్ని సూచిస్తుంది. తెలుగులో ‘చేరేలా చేశారు’ కారణార్థక భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: עָלָיו
  choice: ఆయన సన్నిధికి
  rationale: בוא తో వచ్చిన עַל ఇక్కడ మొర దేవుని దృష్టికి చేరడాన్ని సూచించగలదు. న్యాయాధిపతి ఎదుట విన్నపం చేరే భావాన్ని ‘ఆయన సన్నిధికి’ సహజంగా తెలియజేస్తుంది; ఇతర వ్యాకరణ సాధ్యతలను పాదసూచికలో ఉంచాం.
- source_word: צַעֲקַת
  choice: మొరను
  rationale: צְעָקָה బాధలోనుంచి వెలువడే కేక లేదా సహాయం కోసం చేసే మొర. ఈ సందర్భంలో ‘మొర’ స్పష్టంగా, సహజంగా ఉంది; రెండు అర్ధపాదాల్లోని పునరుక్తిని నిలిపాం.
- source_word: דָּל
  choice: పేదవాని
  rationale: דָּל ఆర్థికంగా పేదవాడిని, బలహీనుడిని లేదా సామాజికంగా శక్తిలేనివాడిని సూచించగలదు. సందర్భంలో ‘పేదవాని’ ప్రధాన భావాన్ని సూటిగా అందిస్తుంది.
- source_word: עֲנִיִּים
  choice: బాధితుల
  rationale: עֲנִיִּים పేదలు, బాధితులు లేదా అణచివేయబడినవారిని సూచించగలదు. ముందున్న דָּל తో ఉన్న భావసామ్యాన్ని కాపాడుతూ, రెండింటినీ ఒకే పదంగా కలిపివేయకుండా ‘బాధితుల’ అని ఇచ్చాం.
- source_word: יִשְׁמָע
  choice: వింటాడు
  rationale: జ్ఞానసాహిత్య కవిత్వంలో అసంపూర్ణ క్రియారూపం లక్షణాత్మక వర్తమాన చర్యను సూచించగలదు. దేవుడు అలాంటి మొరను వింటాడనే భావానికి ‘వింటాడు’ సహజంగా సరిపోతుంది.
theological_decisions:
- issue: עָלָיו లోని సర్వనామానికి సూచితుడు, יִשְׁמָע క్రియకు కర్త
  choice: మొర దేవుని సన్నిధికి చేరుతుంది; బాధితుల మొరను దేవుడు వింటాడు.
  alternative: మొర దుష్టునికి వ్యతిరేకంగా తీసుకురాబడుతుంది, దేవుడు దానిని వింటాడు; లేదా మొర దుష్టుని మీదికి వస్తుంది.
  rationale: సమీప సందర్భంలో ఎలీహూ దుష్టుల అణచివేతను, దేవుని న్యాయపరమైన అవగాహనను వివరిస్తున్నాడు. చివరి క్రియకు అంతర్లీన కర్తగా దేవుడే అత్యంత సహజం. అయినా עָלָיו అనే పదబంధంలోని నిజమైన వ్యాకరణ అస్పష్టతను పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యే, గౌరవప్రదమైన శైలి వాడబడింది. దేవునిని సూచించే ‘ఆయన’ను ఉపయోగించాం. మూలంలోని కవితాత్మక సమాంతరత కోసం ‘మొర’ను రెండుసార్లు నిలిపాం.
