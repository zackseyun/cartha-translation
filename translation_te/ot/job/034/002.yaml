    issue: Footnote alternative does not correspond to the Hebrew phrase marked.
    rationale: The note offers “నా మాట ఆలకించండి” as an alternative for the second imperative, but the Hebrew has הַאֲזִינוּ לִי, literally ‘give ear to me.’ A suitable idiomatic alternative should retain the first-person object, such as “నన్ను ఆలకించండి.”
