  yaml_path: translation/ot/job/034/002.yaml
  text: Hear my words[a], you wise men, and give ear to me, you who know.
translation:
  language: te
  text: 'జ్ఞానులారా, నా మాటలు వినండి;

    తెలిసినవారలారా, నాకు చెవియొగ్గండి.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నన్ను ఆలకించండి.” హెబ్రీ క్రియ అక్షరార్థంగా చెవిని ఒగ్గడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ
  choice: వినండి
  rationale: שׁמע క్రియ యొక్క బహువచన ఆజ్ఞార్థాన్ని సహజమైన ఆధునిక తెలుగులో నేరుగా వ్యక్తపరుస్తుంది; తరువాతి సమాంతర ఆజ్ఞతో భేదాన్ని కూడా నిలుపుతుంది.
- source_word: חֲכָמִים
  choice: జ్ఞానులారా
  rationale: పుంలింగ బహువచన విశేషణం ఇక్కడ సంబోధనార్థక నామవాచకంగా ఉంది. ‘జ్ఞానులారా’ లింగాన్ని అనవసరంగా ముందుకు తేవకుండా, గౌరవప్రదంగా మరియు సహజంగా సంబోధనను అందిస్తుంది.
- source_word: מִלָּי
  choice: నా మాటలు
  rationale: యోబు గ్రంథంలో కనిపించే ‘మాట, పలుకు’ అనే అర్థంగల పదం యొక్క బహువచన రూపాన్నీ, ప్రథమ పురుష ఏకవచన స్వామ్య ప్రత్యయాన్నీ స్పష్టంగా నిలుపుతుంది.
- source_word: וְיֹדְעִים
  choice: తెలిసినవారలారా
  rationale: ‘తెలుసుకొనువారు/తెలిసినవారు’ అనే కర్తరి కృదంత భావాన్ని సంబోధన రూపంలో నిలుపుతుంది; మూలంలో లేని ‘అర్థం చేసుకునేవారు’ అనే భావాన్ని చేర్చదు.
- source_word: הַאֲזִינוּ
  choice: చెవియొగ్గండి
  rationale: אזן హిఫీల్ బహువచన ఆజ్ఞలోని చెవికి సంబంధించిన రూపకాన్ని తెలుగులో సహజమైన, గౌరవప్రదమైన నుడికారంతో వ్యక్తపరుస్తూ, మొదటి ‘వినండి’తో ఉన్న కవితా సమాంతరతను కాపాడుతుంది.
- source_word: לִי
  choice: నాకు
  rationale: ‘నాకు/నా వైపు’ అనే ప్రథమ పురుష ఏకవచన సంబంధాన్ని మూలానికి దగ్గరగా స్పష్టంగా తెలియజేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కవితా సంబోధనను ఉపయోగించాం. రెండు సమాంతర ఆజ్ఞల మధ్య ఉన్న స్వల్ప పదభేదాన్ని ‘వినండి / చెవియొగ్గండి’గా నిలిపాం; పాద విభజన హెబ్రీ కవితా సమాంతరతను స్పష్టంచేస్తుంది.
