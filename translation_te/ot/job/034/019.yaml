  text: who shows no partiality to princes and does not regard the rich above the poor, for all of them are the work of his hands.
translation:
  language: te
  text: ఆయన పాలకుల పట్ల పక్షపాతం చూపడు; ధనవంతుణ్ణి పేదవానికంటే ఎక్కువగా పరిగణించడు. ఎందుకంటే వారందరూ ఆయన చేతుల పనియే.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נָשָׂא פְּנֵי שָׂרִים
  choice: అధిపతుల పట్ల పక్షపాతం చూపడు
  rationale: ‘ముఖాన్ని ఎత్తడం’ అనే హీబ్రూ నుడికారానికి సందర్భానుగుణమైన అర్థం పక్షపాతం లేదా ప్రత్యేక అనుకూలత చూపడం.
- source_word: שׁוֹעַ
  choice: ధనవంతుణ్ణి
  rationale: ఈ సందర్భంలో సామాజికంగా సంపన్నుడైన లేదా ప్రాబల్యంగల వ్యక్తిని సూచిస్తుంది; ‘ధనవంతుడు’ సాధారణ పాఠకునికి సహజంగా ఉంటుంది.
- source_word: נִכַּר ... לִפְנֵי
  choice: '...కంటే ఎక్కువగా ఎంచడు'
  rationale: ఒకరిని మరొకరి కంటే ప్రత్యేకంగా గుర్తించి ఆదరించడమనే తులనాత్మక భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: מַעֲשֵׂה יָדָיו
  choice: ఆయన చేతుల సృష్టి
  rationale: దైవిక సృష్టికార్యాన్ని సూచించే హీబ్రూ రూపకాన్ని తెలుగులో స్పష్టంగా, గౌరవప్రదంగా నిలుపుతుంది.
theological_decisions:
- issue: ధనవంతుడు–పేదవాడు మధ్య దేవుని నిష్పక్షపాతత్వం
  choice: ధనవంతుణ్ణి పేదవానికంటే ఎక్కువగా ఎంచడు
  alternative: ధనవంతుణ్ణి పేదవానికంటే ఎక్కువగా పరిగణించడు
  rationale: మూలంలోని ‘గుర్తించడం/ప్రత్యేకంగా చూడడం’ భావాన్ని దేవుడు సామాజిక స్థితి ఆధారంగా ఒకరికి ప్రాధాన్యం ఇవ్వడని తెలియజేసేలా అనువదించాం; దీన్ని రక్షణసిద్ధాంతం లేదా ఇతర ప్రత్యేక మతపరమైన వ్యవస్థగా విస్తరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే సహజమైన, గౌరవప్రదమైన శైలి. హీబ్రూ నుడికారాన్ని పదశః కాక భావసహజంగా అందించగా, సమాంతర నిర్మాణం మరియు కారణవాక్యం నిలుపబడ్డాయి.
