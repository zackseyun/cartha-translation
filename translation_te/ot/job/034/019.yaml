  text: אֲשֶׁ֤ר לֹֽא נָשָׂ֨א פְּנֵ֥י שָׂרִ֗ים וְ/לֹ֣א נִכַּר שׁ֭וֹעַ לִ/פְנֵי דָ֑ל כִּֽי מַעֲשֵׂ֖ה יָדָ֣י/ו כֻּלָּֽ/ם־׀־־־׃
