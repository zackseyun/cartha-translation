source:
  edition: WLC
  text: כִּֽי אָ֭מַר אִיּ֣וֹב צָדַ֑קְתִּי וְ֝/אֵ֗ל הֵסִ֥יר מִשְׁפָּטִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/005.yaml
  text: For Job has said[a], ‘I am in the right, and God has taken away my justice.’
translation:
  language: te
  text: 'ఎందుకంటే యోబు ఇలా అన్నాడు: “నేను న్యాయపక్షంలో ఉన్నాను; దేవుడు నాకు దక్కవలసిన న్యాయాన్ని[a] తీసివేశాడు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నా హక్కును”; లేదా “నాకు రావలసిన న్యాయతీర్పును.”
    reason: מִשְׁפָּטִי అనే పదం న్యాయం, హక్కు, న్యాయతీర్పు అనే భావాలను సూచించగలదు.
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ఎలీహు ముందున్న వాదనకు కారణాన్ని వివరిస్తున్నందున, హీబ్రూ అనుసంధాన పదం యొక్క తార్కిక సంబంధాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אָמַר
  choice: ఇలా అన్నాడు
  rationale: పూర్తయిన క్రియను తెలుగులో సహజంగా తెలియజేస్తూ, వెంట వచ్చే ప్రత్యక్ష ఉల్లేఖనాన్ని స్పష్టంగా పరిచయం చేస్తుంది.
- source_word: אִיּוֹב
  choice: యోబు
  rationale: ఈ వ్యక్తి పేరుకు ప్రామాణిక తెలుగు రూపం.
- source_word: צָדַקְתִּי
  choice: నేను న్యాయపక్షంలో ఉన్నాను
  rationale: צדק యొక్క న్యాయస్థాన సంబంధమైన భావాన్ని నిలుపుతూ, యోబు సంపూర్ణంగా పాపరహితుడని చెప్పినట్లు విస్తరించకుండా, ఈ వివాదంలో తానే సరైన పక్షంలో ఉన్నాననే వాదనను వ్యక్తం చేస్తుంది.
- source_word: וְאֵל
  choice: దేవుడు
  rationale: אֵל ను విస్తరించిన బిరుదుగా కాక సాధారణంగా ‘దేవుడు’ అని అనువదించింది. తెలుగులో విరామచిహ్నం రెండు వాక్యభాగాల సంబంధాన్ని సహజంగా చూపుతున్నందున וְ కు విడిగా పదం జోడించలేదు.
- source_word: הֵסִיר
  choice: తీసివేశాడు
  rationale: סור యొక్క హిఫీల్ రూపానికి ఉన్న ‘తొలగించు/తీసివేయు’ అనే కారణార్థక భావాన్ని నేరుగా, సహజంగా తెలియజేస్తుంది.
- source_word: מִשְׁפָּטִי
  choice: నాకు దక్కవలసిన న్యాయాన్ని
  rationale: מִשְׁפָּטִי లోని న్యాయం, హక్కు, న్యాయతీర్పు అనే భావపరిధిని సందర్భానుకూలమైన తెలుగులో తెలియజేస్తుంది; ప్రత్యామ్నాయాలను పాదసూచికలో నిలుపుతుంది.
theological_decisions:
- issue: యోబు తన గురించి చేసిన వాదనలోని న్యాయస్థాన సంబంధమైన భావం
  choice: ‘నేను న్యాయపక్షంలో ఉన్నాను’ అని అనువదించడం
  alternative: ‘నేను నీతిమంతుణ్ణి’ లేదా ‘నేను నిర్దోషిని’
  rationale: యోబు ప్రతి విషయంలో సంపూర్ణ నీతిమంతుడని లేదా పాపరహితుడని ప్రకటించినట్లు భావాన్ని విస్తరించకుండా, దేవుని ఎదుట తన వివాదంలో తన పక్షమే న్యాయమైనదనే ఉద్రిక్తతను నిలుపుతుంది.
- issue: מִשְׁפָּטִי యొక్క న్యాయపరమైన బహుళార్థం
  choice: ప్రధాన పాఠంలో ‘నాకు దక్కవలసిన న్యాయం’ అని ఉంచడం
  alternative: ‘నా హక్కు’ లేదా ‘నాకు రావలసిన న్యాయతీర్పు’
  rationale: హీబ్రూ పదంలోని నైతిక న్యాయం, చట్టబద్ధమైన హక్కు, న్యాయతీర్పు అనే భావాలను ఒకే అర్థానికి కుదించకుండా, ప్రధాన భావాన్ని సహజంగా అందించి మిగతా అవకాశాలను పాదసూచికలో తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, అయినా గంభీరతను నిలుపుతూ అనువదించబడింది. ‘న్యాయపక్షంలో’ అనే ప్రయోగం వచనంలోని న్యాయవివాద స్వరాన్ని కాపాడుతుంది; ప్రత్యక్ష ఉల్లేఖనానికి తెలుగు విరామచిహ్నాలు వాడబడ్డాయి.
