source:
  edition: WLC
  text: עַל מִשְׁפָּטִ֥/י אֲכַזֵּ֑ב אָנ֖וּשׁ חִצִּ֣/י בְלִי פָֽשַׁע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/006.yaml
  text: Should I lie concerning my right? My wound is incurable[b][a], though there is no transgression.
translation:
  language: te
  text: నా హక్కు విషయంలో నేను అబద్ధం చెప్పాలా?[a] అతిక్రమం లేకపోయినా నా గాయం నయం కానిది.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, మొదటి భాగాన్ని ప్రశ్నగా కాక ప్రకటనగా తీసుకుంటే: ‘నా హక్కుకు విరుద్ధంగా నన్ను అబద్ధికునిగా పరిగణిస్తున్నారు.’'
    reason: alternative_reading
  - marker: b
    text: పదశః, ‘నా బాణం నయం కానిది’; ‘బాణం’ యోబును తాకిన దెబ్బను, దానివల్ల కలిగిన గాయాన్ని లేదా బాధను సూచించే రూపకం కావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל מִשְׁפָּטִי
  choice: నా హక్కు విషయంలో
  rationale: מִשְׁפָּטִי ఇక్కడ యోబు వాదనలోని న్యాయపరమైన హక్కును లేదా న్యాయమైన కేసును సూచిస్తుంది; עַל‌ను ‘విషయంలో’గా తీసుకోవడం ప్రశ్నార్థక వాక్యానికి సహజమైన భావాన్ని ఇస్తుంది.
- source_word: אֲכַזֵּב
  choice: నేను అబద్ధమాడాలా?
  rationale: పియేల్ రూపం ‘అబద్ధమాడు/అసత్యంగా ఉండు’ అనే భావాన్ని ఇస్తుంది. సందర్భంలో దీనిని అలంకారిక ప్రశ్నగా అనువదించడం, తన నిర్దోషిత్వాన్ని నిరాకరించడం అబద్ధమవుతుందని యోబు చెప్పే భావాన్ని సహజంగా వ్యక్తం చేస్తుంది; ప్రకటన వాక్యంగా తీసుకునే అవకాశాన్ని పాదసూచికలో ఉంచాం.
- source_word: אָנ֖וּשׁ
  choice: నయం కానిది
  rationale: ఈ విశేషణం తీవ్రంగా రోగగ్రస్తమైనది లేదా స్వస్థపడలేనిది అనే భావాన్ని ఇస్తుంది. గాయం అనే రూపకంతో ‘నయం కానిది’ సహజంగా సరిపోతుంది.
- source_word: חִצִּי
  choice: నా గాయం
  rationale: పదశః ‘నా బాణం.’ ఇక్కడ అది యోబును తాకిన బాణం వల్ల కలిగిన గాయం లేదా అతని తీవ్రమైన బాధకు రూపకంగా కనిపిస్తుంది. పాఠకులకు ఉద్దేశిత భావం స్పష్టంగా ఉండేందుకు ‘నా గాయం’ అని ఇచ్చి, మూల రూపకాన్ని పాదసూచికలో నిలిపాం.
- source_word: בְלִי פָשַׁע
  choice: అతిక్రమం లేకపోయినా
  rationale: בְלִי లేమిని సూచిస్తుంది; פָשַׁע నైతిక లేదా దేవునికి వ్యతిరేకమైన అతిక్రమాన్ని సూచిస్తుంది. ముందున్న బాధతో ఉన్న విరుద్ధ సంబంధాన్ని తెలుగులో ‘లేకపోయినా’ సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ఎలీహు ఉటంకిస్తున్న యోబు మాటలోని మొదటి వాక్య నిర్మాణం
  choice: ‘నా హక్కు విషయంలో నేను అబద్ధమాడాలా?’ అనే అలంకారిక ప్రశ్న
  alternative: ‘నా హక్కుకు విరుద్ధంగా నన్ను అబద్ధికునిగా ఎంచుతున్నారు’ అనే ప్రకటన
  rationale: హీబ్రూ వాక్యం సంక్షిప్తంగా ఉండి ఒకటి కంటే ఎక్కువ విధాలుగా అర్థం చేసుకోవచ్చు. ప్రధాన పాఠంలోని ప్రశ్న యోబు తన నిర్దోషిత్వ వాదనను వదలడం అబద్ధమవుతుందని చెప్పే భావాన్ని నిలుపుతుంది; ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చి సందిగ్ధతను పరిష్కరించకుండా కాపాడాం.
- issue: חִצִּי అనే బాణపు రూపకం
  choice: ప్రధాన పాఠంలో ‘నా గాయం’
  alternative: పదశః ‘నా బాణం’
  rationale: ‘బాణం’ ఇక్కడ యోబును తాకిన దెబ్బ లేదా దానివల్ల వచ్చిన గాయాన్ని సూచించే రూపకం. తెలుగులో భావం అర్థమయ్యేలా ప్రధాన పాఠంలో ‘గాయం’ అని ఇచ్చి, మూల చిత్రాన్ని పాదసూచికలో భద్రపరిచాం.
- issue: బాధకు మరియు అతిక్రమం లేకపోవడానికి మధ్య ఉన్న ఉద్రిక్తత
  choice: ‘అతిక్రమం లేకపోయినా’ అని నేరుగా నిలుపడం
  alternative: యోబు పూర్తిగా పాపరహితుడని వివరణాత్మకంగా విస్తరించడం
  rationale: పాఠం פָשַׁע లేకపోవడాన్ని మాత్రమే చెబుతుంది. దీనిని విస్తృత పాపరహితత్వ సిద్ధాంతంగా మార్చకుండా, యోబు అనుభవిస్తున్న అన్యాయ బాధ గురించిన వాక్యంలోని theological tension‌ను అలాగే నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన శైలిని ఉపయోగించాం. ‘హక్కు,’ ‘అతిక్రమం,’ ‘నయం కానిది’ అనే పదాలు వరుసగా న్యాయపరమైన భావాన్ని, నైతిక బరువును, బాధ తీవ్రతను నిలుపుతాయి. మూలంలోని సంక్షిప్తతను సాధ్యమైనంతవరకు కాపాడాం.
