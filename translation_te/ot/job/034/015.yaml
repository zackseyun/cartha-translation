  text: יִגְוַ֣ע כָּל בָּשָׂ֣ר יָ֑חַד וְ֝/אָדָ֗ם עַל עָפָ֥ר יָשֽׁוּב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/015.yaml
  text: all flesh would perish together[a], and man would return to dust.
translation:
  language: te
  text: సకల జీవులూ కలిసి నశించిపోయేవి; మానవుడు[a] ధూళికి తిరిగి చేరేవాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘మానవుడు’ అని అనువదించిన హెబ్రీయ పదం אָדָם ఏకవచనంలో ఉన్నా, ఇక్కడ సమస్త మానవాళిని సామూహికంగా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִגְוַע
  choice: ప్రాణం విడుస్తారు
  rationale: גוע మరణించడం, ప్రాణం విడవడం అనే భావాన్ని ఇస్తుంది. తెలుగు సహజ వాడుకలో ‘ప్రాణం విడుస్తారు’ మూలంలోని గంభీరతను నిలుపుతుంది; మునుపటి వచనం నుండి కొనసాగే షరతు భావం సందర్భం ద్వారా స్పష్టమవుతుంది.
- source_word: כָּל בָּשָׂר
  choice: సర్వశరీరులు
  rationale: అక్షరార్థంగా ‘సమస్త శరీరం/మాంసం’. ఇక్కడ మర్త్య ప్రాణుల సమష్టిని సూచించే హెబ్రీయ నుడికారాన్ని తెలుగు బైబిలు శైలికి సహజమైన ‘సర్వశరీరులు’తో నిలిపాం.
- source_word: יָחַד
  choice: ఒక్కసారిగా
  rationale: యָחַד సమష్టితనాన్ని లేదా ఏకకాలికతను సూచిస్తుంది. ఈ సందర్భంలో అందరూ ఒకేసారి మరణించడాన్ని ‘ఒక్కసారిగా’ సహజంగా వ్యక్తపరుస్తుంది.
- source_word: אָדָם
  choice: మానవుడు
  rationale: ఏకవచన రూపాన్ని నిలుపుతూ, ఇక్కడ సమస్త మానవాళిని ప్రతినిధిగా సూచించే సామూహిక అర్థాన్ని ‘మానవుడు’ అందిస్తుంది.
- source_word: עַל עָפָר
  choice: ధూళికి
  rationale: עַל అక్షరార్థంగా ‘మీద/పై’ అయినా, שובతో కూడిన ఈ మరణ సూత్రంలో తిరిగి చేరే గమ్యాన్ని తెలుగులో ‘ధూళికి’ అని సహజంగా చెప్పవచ్చు.
- source_word: יָשׁוּב
  choice: తిరిగి చేరుతాడు
  rationale: שוב యొక్క ప్రాథమిక భావం ‘తిరిగివెళ్లు/తిరిగిరా’. ధూళి నుండి ఉద్భవించి ధూళికే చేరే చిత్రాన్ని తెలుగులో ‘తిరిగి చేరుతాడు’ స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: אָדָם యొక్క సామూహిక మానవార్థం
  choice: మానవుడు
  alternative: మానవాళి
  rationale: హెబ్రీయ ఏకవచన రూపాన్ని ప్రధాన పాఠ్యంలో నిలుపుతూ, అది పురుషులను మాత్రమే కాక సమస్త మానవజాతిని సూచిస్తుందనే విషయాన్ని పాదటిప్పణిలో తెలిపాం.
- issue: క్రియలలో షరతు భావం
  choice: తెలుగు సాధారణ భవిష్యత్ రూపం; షరతు భావం మునుపటి వచన సందర్భం నుండి గ్రహించబడుతుంది
  alternative: ప్రాణం విడిచేవారు; తిరిగి చేరేవాడు
  rationale: హెబ్రీయ రూపాలకు ఇక్కడి షరతు బలం 14వ వచనం నుండి వస్తుంది. ఈ ఒక్క వచనంలో తెలుగు ‘అయితే’ వంటి పదాన్ని చేర్చడం మూలంలో లేని అనుసంధానాన్ని స్పష్టీకరించవచ్చు; అందువల్ల సహజ భవిష్యత్ రూపాన్ని వాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైన కవితా స్వరాన్ని నిలుపుతూ సాధారణ పాఠకునికి అర్థమయ్యే పదజాలం. ‘సర్వశరీరులు’ హెబ్రీయ నుడికారాన్ని కాపాడుతుంది; ‘మానవుడు’ ఏకవచన సామూహిక రూపాన్ని నిలుపుతుంది.
