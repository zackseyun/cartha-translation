source:
  edition: WLC
  text: כִּֽי אֶל אֵ֭ל הֶ/אָמַ֥ר נָשָׂ֗אתִי לֹ֣א אֶחְבֹּֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/031.yaml
  text: For has anyone said to God[a], ‘I have borne punishment; I will not offend again’?
translation:
  language: te
  text: ఎందుకంటే దేవునితో ఎవరైనా, “నేను భరించాను[a]; ఇక తప్పు చేయను” అని అన్నారా?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'భావాన్ని స్పష్టం చేసే అనువాదం: “నేను శిక్షను భరించాను.” హెబ్రీలో ‘భరించాను’ అనే క్రియకు కర్మ చెప్పబడలేదు; అది శిక్షను, దిద్దుబాటును లేదా అపరాధభారాన్ని సూచించవచ్చు.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి వాదనకు కారణం లేదా వివరణను కలిపే అనుసంధాన పదంగా ఉన్నందున ‘ఎందుకంటే’ సందర్భానికి సహజంగా సరిపోతుంది.
- source_word: אֶל אֵל
  choice: దేవునితో
  rationale: אֶל ఇక్కడ మాట చెప్పబడే వ్యక్తిని సూచిస్తుంది. తెలుగులో ‘దేవునితో అన్నాడు’ అనే ప్రయోగం సహజమైనది; אֵל ను ప్రత్యేక నామంగా కాక దేవునికి వాడిన సాధారణ బిరుదుగా అనువదించాం.
- source_word: הֶאָמַר
  choice: ఎవరైనా ఇలా అన్నారా?
  rationale: రూపపరంగా ఇది మూడవ పురుష ఏకవచన భూతరూపమైనా, సందర్భంలో అలంకారిక ప్రశ్నగా అనిర్దిష్ట వ్యక్తిని సూచిస్తుంది. అందుకే తెలుగులో ‘ఎవరైనా’ అని స్పష్టం చేశాం.
- source_word: נָשָׂאתִי
  choice: నేను భరించాను
  rationale: נשׂא యొక్క ప్రాథమిక అర్థం ‘మోయడం/భరించడం.’ హెబ్రీలో కర్మ చెప్పబడలేదు. శిక్ష, శిక్షణ లేదా అపరాధభారం అని భావించే అవకాశాన్ని ప్రధాన వాక్యంలో నిర్ణయించకుండా అస్పష్టతను నిలిపి, పాదటిప్పణిలో వివరించాం.
- source_word: לֹא אֶחְבֹּל
  choice: ఇక తప్పు చేయను
  rationale: חבל ఇక్కడ నైతికంగా తప్పుగా లేదా చెడుగా ప్రవర్తించడాన్ని సూచిస్తుంది. వక్త ఇక అలా చేయనని చెప్పే భావాన్ని సహజ తెలుగులో ‘ఇక తప్పు చేయను’గా ఇచ్చాం.
theological_decisions:
- issue: נָשָׂאתִי లో చెప్పని కర్మ
  choice: ప్రధాన పాఠంలో ‘నేను భరించాను’ అని కర్మను చెప్పకుండా ఉంచడం
  alternative: ‘నేను శిక్షను భరించాను’ లేదా ‘నేను అపరాధభారాన్ని మోశాను’
  rationale: మూల హెబ్రీ ఏది భరించబడిందో నిర్దిష్టంగా చెప్పదు. ఒకే వ్యాఖ్యానాన్ని ప్రధాన పాఠంలో స్థిరపరచకుండా మూలంలోని అర్థసంభావ్యతను కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనా సాధారణ పాఠకులకు సులభంగా ఉండే శైలిని వాడాం. మూలంలోని అలంకారిక ప్రశ్నను సహజ తెలుగు వాక్యక్రమంలో నిలిపాం; కర్మలేని ‘భరించాను’ కొద్దిగా అసాధారణంగా వినిపించినా, నిజమైన హెబ్రీ అస్పష్టతను పాదటిప్పణి సహాయంతో సంరక్షించాం.
