  to: ఎందుకంటే, ఒక మనిషి దేవుని ఎదుట తీర్పులో వెళ్లడానికి ఆయన అతనికి మరొక సమయాన్ని నియమించడు.[a]
  rationale: 'The revision makes two limited changes: it renders the judicial phrase as “తీర్పులో,” closer to the source’s courtroom/proceeding sense, and replaces the indirect causative construction with a direct infinitive. The supplied ‘further time’ remains in the main text, and the footnote continues to identify the Hebrew clause as compressed and textually difficult without presenting the interpretation as certain.'
