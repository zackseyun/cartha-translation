source:
  edition: WLC
  text: כִּ֤י לֹ֣א עַל אִ֭ישׁ יָשִׂ֣ים ע֑וֹד לַ/הֲלֹ֥ךְ אֶל אֵ֝֗ל בַּ/מִּשְׁפָּֽט־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/023.yaml
  text: For he does not set a time for a man to go before God in judgment[a].
translation:
  language: te
  text: ఎందుకంటే, ఒక మనిషి దేవుని ఎదుట తీర్పులో వెళ్లడానికి ఆయన అతనికి మరొక సమయాన్ని నియమించడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఎందుకంటే, ఒక మనిషి దేవుని ఎదుట తీర్పులో వెళ్లడానికి ఆయన అతనికి ఇక మరే సమయాన్నీ నియమించడు.” హెబ్రీ వాక్యం క్లిష్టంగా, సంక్షిప్తంగా ఉంది. తీర్పు ఇవ్వడానికి దేవునికి అదనపు విచారణగానీ ఆలస్యంగానీ అవసరం లేదనేది భావం కావచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి వాక్యానికి కారణాన్ని లేదా వివరణను పరిచయం చేస్తుంది; ఎలీహు వాదన ప్రవాహానికి సహజంగా సరిపోతుంది.
- source_word: עַל אִישׁ
  choice: ఒక మనిషికి
  rationale: שׂים తో עַל, ఎవరికైనా ఏదో నియమించడం లేదా వారిమీద ఉంచడం అనే భావాన్ని ఇవ్వగలదు. మూలంలోని ఏకవచన పురుషరూపాన్ని నిలుపుతూ తెలుగులో సహజంగా అనువదించబడింది.
- source_word: יָשִׂים
  choice: నియమించడు
  rationale: שׂים యొక్క ప్రాథమిక భావం ‘ఉంచు/నిలుపు’; ఈ న్యాయసంబంధ సందర్భంలో సమయాన్ని ఏర్పాటు చేయడం లేదా నియమించడం అనే అర్థం తగినది.
- source_word: עוֹד
  choice: మరొక సమయాన్ని
  rationale: పదశః ‘ఇంకా/మళ్లీ/మరింత.’ సంక్షిప్తమైన హెబ్రీ వాక్యంలో క్రియకు అవసరమైన కర్మగా ‘సమయం’ సందర్భం నుండి పూరించబడింది; ‘మరొక’ ద్వారా עוֹד భావం స్పష్టమవుతుంది.
- source_word: לַהֲלֹךְ אֶל אֵל
  choice: దేవుని ఎదుటికి వెళ్లేలా
  rationale: పదశః ‘దేవుని దగ్గరకు వెళ్లుటకు’; న్యాయస్థాన సందర్భంలో ‘దేవుని ఎదుటికి వెళ్లడం’ తెలుగులో సహజంగా కోర్టు హాజరు భావాన్ని తెలియజేస్తుంది.
- source_word: בַּמִּשְׁפָּט
  choice: తీర్పు కోసం
  rationale: מִשְׁפָּט తీర్పు, న్యాయం లేదా న్యాయవిచారణను సూచించగలదు. ఇక్కడ న్యాయసంబంధ ఉద్దేశాన్ని సంక్షిప్తంగా తెలియజేస్తుంది.
theological_decisions:
- issue: עוֹד మరియు יָשִׂים తరువాత సూచిత కర్మతో ఉన్న క్లిష్టమైన సంక్షిప్త వాక్యానికి అర్థం
  choice: ఒక మనిషి తీర్పు కోసం తన ఎదుటికి రావడానికి దేవుడు మరొక సమయాన్ని నియమించాల్సిన అవసరం లేదు.
  alternative: దేవునితో న్యాయవిచారణకు వెళ్లేలా దేవుడు మనిషికి ఏ నియమిత సమయమూ పెట్టడు; లేదా మనిషిని తీర్పులోకి తేవడానికి ముందు అతనిపై ఇక దృష్టి పెట్టడు.
  rationale: హెబ్రీ వాక్యం క్లిష్టంగా, కర్మను స్పష్టంగా చెప్పకుండా సంక్షిప్తంగా ఉంది. దేవుని సంపూర్ణ జ్ఞానం గురించిన సందర్భంలో, తీర్పు ఇవ్వడానికి ఆయనకు అదనపు విచారణ లేదా మరో గడువు అవసరం లేదనే పఠనం עוֹד, לַהֲלֹךְ, בַּמִּשְׁפָּט పదాలను సమన్వయపరుస్తుంది. ప్రత్యామ్నాయ సాధ్యతను పాదసూచికలో ఉంచి మూలంలోని అనిశ్చితిని కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన న్యాయసంబంధ శైలి వాడబడింది. మూలంలోని క్లిష్టతను ప్రధాన వాక్యంలో అతిగా విప్పకుండా, ప్రత్యామ్నాయ పఠనాన్ని పాదసూచికలో ఇచ్చాం.
