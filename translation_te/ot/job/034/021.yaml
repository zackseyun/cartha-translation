source:
  edition: WLC
  text: כִּי עֵ֭ינָי/ו עַל דַּרְכֵי אִ֑ישׁ וְֽ/כָל צְעָדָ֥י/ו יִרְאֶֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/021.yaml
  text: For his eyes are on the ways of a man[a], and he sees all his steps.
translation:
  language: te
  text: ఎందుకంటే ఆయన కళ్ళు మనిషి మార్గాలపై ఉన్నాయి[a]; ఆ మనిషి అడుగులన్నిటినీ ఆయన చూస్తాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఒక వ్యక్తి మార్గాలపై.’ హీబ్రూలో పుంలింగ ఏకవచన రూపమైన ‘మనిషి’ ఉంది; అది ఇక్కడ సాధారణంగా మానవులను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందున్న మాటకు కారణం లేదా వివరణను పరిచయం చేస్తుంది; తెలుగులో ‘ఎందుకంటే’ ఆ సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: עֵינָיו
  choice: ఆయన కళ్ళు
  rationale: బహువచన నామవాచకానికి మూడవ పురుష ఏకవచన ప్రత్యయం ఉంది. సందర్భంలో సూచించబడినవాడు దేవుడు కావడంతో గౌరవార్థకంగా ‘ఆయన’ వాడబడింది.
- source_word: עַל
  choice: పై ఉన్నాయి
  rationale: కళ్ళు ఒకరి మార్గాలపై ఉండడం అనే మూల చిత్రాన్ని నిలుపుతూ, శ్రద్ధగా గమనించడాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: דַּרְכֵי אִישׁ
  choice: మనిషి మార్గాలు
  rationale: דֶּרֶךְ ఇక్కడ జీవన నడవడి లేదా ప్రవర్తనను సూచించే రూపకం; אִישׁ పుంలింగ ఏకవచనమైనా సాధారణ మానవ ప్రతినిధిగా పనిచేస్తుంది.
- source_word: וְכָל
  choice: అన్నిటినీ
  rationale: సమస్తత్వాన్ని స్పష్టంగా తెలియజేస్తుంది; తెలుగు వాక్య నిర్మాణంలో సంధి భావం విరామచిహ్నం మరియు తదుపరి ఉపవాక్యంతో సహజంగా వ్యక్తమవుతుంది.
- source_word: צְעָדָיו
  choice: అతని అడుగులు
  rationale: మూలంలోని స్పష్టమైన ‘అడుగులు’ అనే చిత్రాన్ని నిలుపుతుంది; అది చర్యలు లేదా జీవన గమనాన్ని కూడా సూచించగలదు.
- source_word: יִרְאֶה
  choice: ఆయన చూస్తాడు
  rationale: ראה క్రియ యొక్క సాధారణ, కొనసాగుతున్న దైవిక పరిశీలన భావాన్ని తెలుగులో వర్తమాన కాలంతో సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: אִישׁ అనే సాధారణ పుంలింగ రూపం
  choice: మనిషి
  alternative: వ్యక్తి
  rationale: హీబ్రూ పదం వ్యాకరణపరంగా పుంలింగ ఏకవచనం, అయితే ఇక్కడ ప్రతినిధి భావంతో మానవులందరికీ వర్తిస్తుంది. ‘మనిషి’ మూలరూపాన్ని, దాని సాధారణ ప్రయోగాన్ని రెండింటినీ నిలుపుతుంది.
- issue: దైవ సూచనలో సర్వనామం
  choice: ఆయన
  alternative: అతడు
  rationale: మూలంలో మూడవ పురుష ఏకవచన ప్రత్యయం మాత్రమే ఉన్నప్పటికీ, పరిసర సందర్భంలో సూచన దేవునికి. ఆధునిక ప్రామాణిక తెలుగులో గౌరవార్థక ‘ఆయన’ సహజమైనది; వచనార్థాన్ని మార్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘మార్గాలు’ మరియు ‘అడుగులు’ అనే సమాంతర మూలచిత్రాలు నిలుపబడ్డాయి; దేవుని సూచించే సర్వనామాలకు తెలుగు గౌరవార్థక రూపం వాడబడింది.
