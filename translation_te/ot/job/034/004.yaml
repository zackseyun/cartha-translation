translation:
  language: te
  text: న్యాయమైనదాన్ని మన కోసం ఎంచుకుందాం[a]; మన మధ్య ఏది మంచిదో తెలుసుకుందాం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మన కోసం న్యాయాన్ని ఎంచుకుందాం; మన మధ్య ఏది మంచిదో వివేచిద్దాం.’
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁפָּט
  choice: న్యాయమైనదాన్ని
  rationale: ఈ పదానికి ‘న్యాయం’, ‘తీర్పు’, ‘న్యాయమైనది’ అనే అర్థాలు ఉండవచ్చు. נבחרה (‘ఎంచుకుందాం’)తో కలిసి ఇక్కడ న్యాయస్థాన తీర్పుకన్నా పరిశీలించి ఎంచుకోవలసిన న్యాయమైన విషయాన్నే సూచిస్తోంది.
- source_word: נִבְחֲרָה
  choice: ఎంచుకుందాం
  rationale: ఇది ప్రథమ పురుష బహువచనంలోని ప్రేరణార్థక ప్రయోగం; అందువల్ల ‘ఎంచుకుందాం’ దాని సంకల్పపూర్వక పిలుపును సహజంగా తెలియజేస్తుంది.
- source_word: לָּנוּ
  choice: మన కోసం మనమే
  rationale: לָּנוּ ప్రయోజనం లేదా సంబంధాన్ని సూచిస్తుంది. ‘మన కోసం మనమే’ అనే రూపం సమూహం స్వయంగా పరిశీలించి నిర్ణయించుకునే భావాన్ని స్పష్టం చేస్తుంది.
- source_word: נֵדְעָה
  choice: తెలుసుకుందాం
  rationale: ידע ప్రాథమికంగా ‘తెలుసుకొను’ అని అర్థం. ఇక్కడ మంచి ఏమిటో విచక్షణతో గ్రహించే ఛాయ ఉన్నప్పటికీ, ‘తెలుసుకుందాం’ మూలానికి దగ్గరగా ఉండి తెలుగులో సహజంగా ఉంది.
- source_word: בֵינֵינוּ
  choice: మన మధ్యనే
  rationale: ఈ పదబంధం సమూహంలో పరస్పర పరిశీలనను సూచిస్తుంది. ‘మన మధ్యనే’ ఆ సమిష్టి చర్చ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: מַה טּוֹב
  choice: ఏది మంచిదో
  rationale: טוֹב మంచి, మేలైనది, ప్రయోజనకరమైనది అనే విస్తృత భావాన్ని కలిగి ఉంది. ‘ఏది మంచిదో’ ఆ విస్తృతిని నిలుపుతూ מִשְׁפָּט‌తో ఉన్న సమాంతరతను కాపాడుతుంది.
