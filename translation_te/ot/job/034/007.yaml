  yaml_path: translation/ot/job/034/007.yaml
  text: What man is like Job[a], who drinks mockery like water?
translation:
  language: te
  text: ఎగతాళిని నీళ్లలా తాగే యోబులాంటి మనిషి ఎవడు[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యోబులాంటి మనిషి ఎవడు? అతడు అపహాస్యాన్ని నీళ్లలా తాగుతాడు.”
    reason: హీబ్రూ వాక్యాన్ని సంబంధార్థక నిర్మాణంగా గానీ, ప్రశ్న తరువాత స్వతంత్ర వాక్యంగా గానీ అర్థం చేసుకోవచ్చు; అలాగే לַעַג కు ‘ఎగతాళి’ లేదా ‘అపహాస్యం’ అనే సమీపార్థాలు ఉన్నాయి.
lexical_decisions:
- source_word: מִי גֶבֶר
  choice: మనిషి ఎవడు
  rationale: ఇది ఆశ్చర్యాన్ని, సాటిలేనితనాన్ని వ్యక్తం చేసే అలంకార ప్రశ్న. גֶבֶר ఇక్కడ ప్రత్యేకంగా ఒక పురుషుణ్ణి సూచిస్తున్నందున లింగార్థాన్ని నిలుపుతూ సహజమైన తెలుగు వాక్యనిర్మాణాన్ని ఎంచుకున్నాం.
- source_word: כְּאִיּוֹב
  choice: యోబులాంటి
  rationale: כְּ అనే ఉపసర్గ సూచించే పోలికను సహజమైన ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: יִשְׁתֶּה
  choice: తాగే
  rationale: అసంపూర్ణ క్రియారూపం ఇక్కడ యోబును లక్షణాత్మకంగా వర్ణిస్తోంది; తెలుగు సంబంధార్థక క్రియారూపం ఆ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: לַעַג
  choice: ఎగతాళిని
  rationale: ఈ నామవాచకం హేళన, అపహాస్యం, ఎగతాళి అనే అర్థాలను కలిగి ఉంది. మాటల ద్వారా చేసే హేళనను సాధారణ పాఠకులకు సూటిగా తెలియజేయడానికి ‘ఎగతాళి’ని ఎంచుకున్నాం.
- source_word: כַּמָּיִם
  choice: నీళ్లలా
  rationale: పోలికను సహజమైన వాడుక తెలుగులో నిలుపుతూ, దాన్ని సులభంగా లేదా విస్తారంగా తాగడమనే బలమైన రూపకాన్ని కాపాడుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గంభీరమైన కానీ సహజమైన శైలిని ఉపయోగించాం. హీబ్రూ రూపకాన్ని యథాతథంగా నిలిపాం.
