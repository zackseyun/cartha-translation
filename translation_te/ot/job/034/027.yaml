  text: because they turned aside from following him[b][a], and they did not understand any of his ways.
translation:
  language: te
  text: ఎందుకంటే వారు ఆయనను అనుసరించడం మానివేశారు[a]; ఆయన మార్గాల్లో దేనినీ వారు గ్రహించలేదు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘ఆయన వెనుకనుండి తొలగిపోయారు’; ఇది ఆయనను అనుసరించడం మానేశారని తెలిపే హీబ్రూ నుడికారం.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘ఆయన మార్గాలన్నిటినీ వారు పరిగణించలేదు.’
    reason: alternative_reading
lexical_decisions:
- source_word: אֲשֶׁר עַל כֵּן
  choice: ఎందుకంటే
  rationale: ఈ సందర్భంలో ముందుగా చెప్పిన తీర్పుకు కారణాన్ని పరిచయం చేసే హేత్వర్థక ప్రయోగం; ఆధునిక తెలుగులో ‘ఎందుకంటే’ సహజంగా ఆ సంబంధాన్ని తెలియజేస్తుంది.
- source_word: סָרוּ מֵאַחֲרָיו
  choice: ఆయనను అనుసరించడం నుండి తొలగిపోయారు
  rationale: סור అనే క్రియలోని ‘తొలగిపోవడం/మళ్లిపోవడం’ అనే భావాన్నీ, מֵאַחֲרָיו అనే ‘ఆయన వెనుకనుండి’ అన్న హీబ్రూ నుడికారంలోని అనుసరణ భావాన్నీ కలిపి తెలియజేస్తుంది.
- source_word: וְכָל דְּרָכָיו
  choice: ఆయన మార్గాల్లో దేనినీ
  rationale: హీబ్రూలో అక్షరార్థంగా ‘ఆయన మార్గాలన్నిటినీ’; నిషేధ క్రియతో కలిసి తెలుగులో ‘దేనినీ ... లేదు’ అనడం సహజం. ‘మార్గాలు’ ఇక్కడ ఆయన కార్యవిధానాలు లేదా నైతిక చిత్తాన్ని సూచించగల రూపకాన్ని నిలుపుతుంది.
- source_word: לֹא הִשְׂכִּילוּ
  choice: గ్రహించలేదు
  rationale: שׂכל హిఫిల్ రూపం గ్రహించడం, వివేచించడం, శ్రద్ధగా పరిగణించడం అనే భావాలను కలిగి ఉంది. ప్రధాన పాఠంలో ‘గ్రహించలేదు’ మూలంలోని జ్ఞాన/వివేచన భావాన్ని నేరుగా ఉంచుతుంది; ‘పరిగణించలేదు’ అనే సంకల్పపూర్వక నిర్లక్ష్య భావాన్ని పాదటిప్పణిలో నిలుపుతుంది.
theological_decisions:
- issue: ‘ఆయనను’, ‘ఆయన మార్గాలు’ అనే ఏకవచన సర్వనామాల సూచిత వ్యక్తి
  choice: సందర్భానుసారం దేవుడు సూచితుడని పాఠకుడు గ్రహించేలా, పేరును చేర్చకుండా ‘ఆయన’ అని ఉంచడం
  alternative: సమీప సందర్భంలోని భూసంబంధ పాలకుడు లేదా న్యాయాధిపతి సూచితుడు కావచ్చు
  rationale: ఎలీహూ ప్రసంగపు విస్తృత సందర్భం దేవుని దర్శనం, తీర్పు, ప్రతిఫలం గురించి మాట్లాడుతుంది. అయినప్పటికీ హీబ్రూ పాఠంలో పేరు లేదు కాబట్టి ‘దేవుడు’ అని స్పష్టంగా చేర్చి సాధ్యమైన వ్యాకరణ అస్పష్టతను తొలగించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. మూలంలోని కారణ సంబంధం, అనుసరణ రూపకం, שׂכל పదంలోని ‘గ్రహించడం/పరిగణించడం’ అనే అర్థవిస్తృతి కాపాడబడ్డాయి. దైవసూచక సర్వనామాన్ని ‘ఆయన’గా ఉంచి, మూలంలో లేని పేరును చేర్చలేదు.
