id: JOB.34.9
reference: Job 34:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּֽי אָ֭מַר לֹ֣א יִסְכָּן גָּ֑בֶר בִּ֝/רְצֹת֗/וֹ עִם אֱלֹהִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/009.yaml
  text: For he has said[a], ‘A man gains nothing by delighting himself with God.’
translation:
  language: te
  text: 'ఎందుకంటే అతడు ఇలా అన్నాడు[a]: “దేవునితో ఆనందించడం వల్ల మనిషికి ఏ లాభమూ లేదు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దేవుడు మనిషిని చూసి సంతోషించినా మనిషికి ఏ లాభమూ లేదు,” లేదా “దేవుని అనుగ్రహాన్ని కోరడం వల్ల మనిషికి ఏ లాభమూ లేదు.” హీబ్రూ పదబంధం సంక్షిప్తంగా ఉండి ఒకటి కంటే ఎక్కువ విధాలుగా అర్థం చేసుకోవడానికి వీలు కల్పిస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి సందర్భంలో ఎలీహు చేస్తున్న ఆరోపణకు కారణాన్ని పరిచయం చేస్తుంది; తెలుగులో వాదన ప్రవాహాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: אָמַר
  choice: అతడు ఇలా అన్నాడు
  rationale: యోబు చెప్పిన అభిప్రాయాన్ని ఎలీహు సంక్షిప్తంగా ఉటంకిస్తున్నాడు; సంపూర్ణ క్రియను సహజమైన తెలుగు భూతకాలంతో అందించాం.
- source_word: לֹא יִסְכָּן
  choice: ఏ లాభమూ లేదు
  rationale: יִסְכָּן అంటే ఉపయోగపడడం, ప్రయోజనం లేదా లాభం కలగడం; నిషేధంతో కలిపి ఈ తెలుగు ప్రయోగం సహజంగా ఉంది.
- source_word: גָּבֶר
  choice: మనిషికి
  rationale: పుంలింగ ఏకవచన నామవాచకం ఇక్కడ సాధారణ మానవుణ్ణి సూచిస్తుంది; ‘మనిషి’ ఆధునిక తెలుగులో సహజంగా ఆ ప్రతినిధి భావాన్ని ఇస్తుంది.
- source_word: בִּרְצֹתוֹ
  choice: ఆనందించడం వల్ల
  rationale: רצה ధాతువు ఇక్కడ సంతోషించడం లేదా ఆనందించడం అనే భావాన్ని ఇవ్వగలదు. ప్రధాన పఠనంలో మనిషినే క్రియకు కర్తగా తీసుకున్నాం; నిర్మాణంలోని ఇతర సాధ్యార్థాలను పాదసూచికలో ఉంచాం.
- source_word: עִם אֱלֹהִים
  choice: దేవునితో
  rationale: עִם యొక్క సాధారణ అర్థమైన ‘తో’ను నిలిపి, దేవునితో సంబంధంలో ఆనందించడమనే సంక్షిప్త హీబ్రూ నిర్మాణాన్ని సాధ్యమైనంత దగ్గరగా అందిస్తుంది.
theological_decisions:
- issue: בִּרְצֹתוֹ עִם אֱלֹהִים అనే పదబంధం యొక్క కర్త మరియు భావం
  choice: మనిషి దేవునితో ఆనందించడం వల్ల అతనికి లాభం లేదని ఈ వాక్యం చెబుతోంది
  alternative: దేవుడు మనిషిని చూసి సంతోషించినా అతనికి లాభం లేదు; లేదా దేవుని అనుగ్రహాన్ని కోరడం వల్ల మనిషికి లాభం లేదు
  rationale: ప్రత్యయాన్ని మనిషినే కర్తగా సూచించేదిగా చదవడం సందర్భంలో సూటిగా ఉంటుంది; ఎలీహు, దైవభక్తి వల్ల ప్రయోజనం లేదని యోబు అన్నట్లు ఆరోపిస్తున్నాడు. అయితే హీబ్రూ నిర్మాణం సంక్షిప్తంగా ఉండి ఇతర విశ్లేషణలకు వీలు కల్పిస్తుంది కాబట్టి వాటిని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని వాడాం. ప్రధాన వాక్యంలో హీబ్రూ నిర్మాణానికి దగ్గరగా ‘దేవునితో ఆనందించడం’ అని ఉంచి, నిజమైన వ్యాకరణ మరియు భావ సందిగ్ధతను పాదసూచికలో సంరక్షించాం.
