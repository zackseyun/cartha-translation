source:
  edition: WLC
  text: וְ/אָרַ֣ח לְ֭/חֶבְרָה עִם פֹּ֣עֲלֵי אָ֑וֶן וְ֝/לָ/לֶ֗כֶת עִם אַנְשֵׁי רֶֽשַׁע־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/008.yaml
  text: and keeps company with workers of wickedness[b][a], and walks with men of evil.
translation:
  language: te
  text: దుష్టకార్యాలు చేసేవారితో సహవాసం చేస్తాడు,[a] దుర్మార్గులైన మనుషులతో కలిసి నడుస్తాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దుష్టకార్యాలు చేసేవారితో కలిసి తిరుగుతాడు.’ హీబ్రూ క్రియ ఇతరులతో కలిసి ప్రయాణించడం లేదా వారితో జతకట్టడం అనే భావాన్ని కూడా ఇవ్వగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָרַח לְחֶבְרָה
  choice: సహవాసం చేస్తూ
  rationale: ఈ సందర్భంలో ארח మరియు לְחֶבְרָה కలిసి అక్షరార్థ ప్రయాణం కంటే ఇతరులతో జతకట్టడం లేదా సాంగత్యం చేయడం అనే భావాన్ని ఇస్తాయి. సహవాసం చేయడం ఆధునిక తెలుగులో సహజంగా ఉండి నైతిక అనుబంధాన్ని తెలియజేస్తుంది.
- source_word: עִם
  choice: తో / కలిసి
  rationale: రెండు భాగాల్లోనూ సహచర్యాన్ని సూచించే సహజ తెలుగు రూపాలు; రెండో భాగంలో తెలుగు ప్రవాహం కోసం ‘కలిసి’ వాడబడింది.
- source_word: פֹּעֲלֵי אָוֶן
  choice: దుష్టకార్యాలు చేసేవారు
  rationale: పదబంధంలోని ‘చేసేవారు’ అనే కార్యార్థాన్ని, אָוֶן లోని దుష్టత్వ భావాన్ని స్పష్టమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: וְלָלֶכֶת
  choice: నడుస్తున్నాడు
  rationale: הלך యొక్క నడక రూపకాన్ని నిలుపుతూ, జీవన మార్గం మరియు సహచర్యం రెండింటినీ సూచిస్తుంది. ముందున్న అసంపూర్ణ వాక్యనిర్మాణం తెలుగులో సహజంగా ఉండేందుకు సందర్భానుసారంగా ఏకవచన పురుష కర్తను క్రియలో వ్యక్తం చేసింది.
- source_word: אַנְשֵׁי רֶשַׁע
  choice: దుర్మార్గులైన మనుషులు
  rationale: אַנְשֵׁי అనే స్పష్టమైన పురుష/మనుషుల సూచనను ‘మనుషులు’తో నిలుపుతూ, רֶשַׁע యొక్క నైతిక భావాన్ని ‘దుర్మార్గులైన’గా సహజంగా అందిస్తుంది.
theological_decisions:
- issue: אַנְשֵׁי רֶשַׁע లోని లింగసూచక వ్యక్తీకరణ
  choice: దుర్మార్గులైన మనుషులు
  alternative: దుర్మార్గులు
  rationale: మూలంలోని אַנְשֵׁי (‘మనుషులు/పురుషులు’) అనే నామవాచక అంశాన్ని పూర్తిగా సాధారణీకరించకుండా నిలిపింది; అయితే తెలుగులో ‘పురుషులు’ అని చెప్పడం సందర్భం కంటే జీవశాస్త్రీయ లింగాన్ని అనవసరంగా ముందుకు తెచ్చే అవకాశం ఉన్నందున ‘మనుషులు’ ఎంచుకోబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, జ్ఞానసాహిత్యానికి తగిన గంభీరమైన కానీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. హెబ్రీ సమాంతర నిర్మాణాన్ని ‘సహవాసం చేస్తూ ... కలిసి నడుస్తున్నాడు’గా నిలిపి, మొదటి పాదంలోని భావసందిగ్ధతను పాదటిప్పణిలో భద్రపరిచింది.
