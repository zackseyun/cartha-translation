  source_fidelity: 'మూలంలోని సమాంతర సహచర్య భావాన్ని ముసాయిదా సరిగ్గా అందిస్తుంది: פֹּעֲלֵי אָוֶן ను ‘దుష్టకార్యాలు చేసేవారు,’ אַנְשֵׁי רֶשַׁע ను ‘దుర్మార్గులైన మనుషులు’గా, అలాగే నడక రూపకాన్ని నిలుపుతుంది. అయితే రెండు హీబ్రూ పాదాలు సమాంతరంగా ఉండగా, తెలుగులో మొదటి పాదాన్ని అసంపూర్ణ క్రియగా (‘చేస్తూ’) మరియు రెండవదాన్ని పరిపూర్ణ క్రియగా (‘నడుస్తున్నాడు’) చేయడం సమాంతరతను, ఈ వచనపు సాధారణ/పునరావృత్తి చర్య భావాన్ని కొంత తగ్గిస్తుంది.'
