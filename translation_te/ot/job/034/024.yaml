id: JOB.34.24
reference: Job 34:24
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: יָרֹ֣עַ כַּבִּירִ֣ים לֹא חֵ֑קֶר וַ/יַּעֲמֵ֖ד אֲחֵרִ֣ים תַּחְתָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/024.yaml
  text: He shatters the mighty without investigation[a], and sets others in their place.
translation:
  language: te
  text: ఆయన బలవంతులను విచారణ లేకుండానే[a] కూలదోసి, వారి స్థానంలో ఇతరులను నిలబెడతాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “శోధన లేకుండానే.” హీబ్రూ పదబంధం అక్షరార్థంగా “విచారణ/శోధన లేదు” అని ఉంటుంది. బలవంతులను కూలదోయడానికి ముందు ఆయనకు సుదీర్ఘ పరిశీలన అవసరం లేదనే భావాన్ని ఇది వ్యక్తం చేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָרֹעַ
  choice: చితకగొట్టి
  rationale: רעע హిఫిల్ రూపం బలంగా విరగ్గొట్టడం లేదా నాశనం చేయడం అనే భావాన్ని ఇస్తుంది. సందర్భంలో ఇది దేవుడు అధికారవంతులను నిర్ణయాత్మకంగా కూలదోయడాన్ని సూచిస్తుంది.
- source_word: כַּבִּירִים
  choice: బలవంతులను
  rationale: శక్తి, అధికారం గల వ్యక్తులను సూచిస్తుంది; వారి పదవిని అనవసరంగా నిర్దిష్టం చేయకుండా మూలంలోని సామాజిక-రాజకీయ భావాన్ని నిలుపుతుంది.
- source_word: לֹא חֵקֶר
  choice: విచారణ లేకుండానే
  rationale: అక్షరార్థంగా ‘విచారణ/శోధన లేదు.’ దేవునికి సుదీర్ఘ పరిశీలన అవసరం లేదనే సందర్భార్థాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది; సాధ్యమైన పదార్థ భేదాన్ని పాదసూచికలో ఉంచింది.
- source_word: וַיַּעֲמֵד
  choice: నిలబెడతాడు
  rationale: עמד హిఫిల్ రూపం ‘నిలబెట్టడం, స్థాపించడం’ అనే భావం ఇస్తుంది. తరువాతి ‘వారి స్థానంలో’తో కలిసి ప్రత్యామ్నాయంగా ఇతరులను నియమించే భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: אֲחֵרִים
  choice: ఇతరులను
  rationale: తొలగించబడిన బలవంతుల స్థానాన్ని పొందే అనిర్దిష్ట వ్యక్తులను సూచించే సరళమైన సమానార్థకం.
- source_word: תַּחְתָּם
  choice: వారి స్థానంలో
  rationale: అక్షరార్థం ‘వారి కింద’ అయినా, ఇక్కడ ప్రత్యామ్నాయ సందర్భంలో ‘వారి స్థానంలో’ అనే నుడికారార్థమే సమాంతర నిర్మాణానికి సరిపోతుంది.
theological_decisions:
- issue: క్రియలలో అంతర్లీనంగా ఉన్న కర్త
  choice: ‘ఆయన’ అంటే సందర్భానుసారం దేవుడు
  alternative: తక్షణ కవితా ప్రవాహాన్ని బట్టి అనిర్దిష్ట కర్తగా గ్రహించడం
  rationale: ఎలీహూ ప్రసంగంలోని పరిసర వాక్యాలు పాలకులపై దేవుని న్యాయతీర్పును వర్ణిస్తున్నాయి. అందువల్ల తెలుగులో ‘ఆయన’ను చేర్చడం సందర్భబద్ధమైనది; అదనపు సిద్ధాంత భావాన్ని దిగుమతి చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కవితా గద్యశైలి. ‘చితకగొట్టి’ మూలక్రియలోని బలమైన విధ్వంస భావాన్ని నిలుపుతుంది; ‘వారి స్థానంలో’ ప్రత్యామ్నాయ నియామకాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
