  text: Men of understanding will say to me[a], and a wise man who hears me,
translation:
  language: te
  text: వివేచనగలవారు[a] నాతో ఇలా అంటారు, నన్ను వినే జ్ఞానవంతుడు కూడా ఇలా అంటాడు,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, ‘హృదయం గల మనుషులు’; ఇక్కడ ‘హృదయం’ అవగాహనను, వివేచనను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַנְשֵׁי לֵבָב
  choice: వివేచనగలవారు
  rationale: అక్షరార్థంగా ‘హృదయంగల మనుషులు.’ హీబ్రూలో ‘హృదయం’ ఆలోచన, అవగాహన, వివేచనలకు కేంద్రాన్ని సూచిస్తుంది. ‘వివేచనగలవారు’ అనే పదబంధం ఆ నుడికార భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: יֹאמְרוּ לִי
  choice: నాతో అంటారు
  rationale: యిక్తోల్ రూపం సందర్భంలో ఎదురుచూస్తున్న లేదా సాధారణంగా జరిగే మాటను సూచించగలదు. ‘నాతో అంటారు’ సహజంగా ఉండి హీబ్రూ వాక్యానికి దగ్గరగా ఉంటుంది.
- source_word: וְגֶבֶר חָכָם
  choice: జ్ఞాని కూడా
  rationale: గֶּבֶר ఇక్కడ సమాంతర నిర్మాణంలో సాధారణంగా ‘మనిషి’ని సూచిస్తుంది; חָכָם అంటే ‘జ్ఞాని.’ తెలుగులో వ్యక్తిని సూచించే ‘జ్ఞాని’ సహజంగా ఉంది. సమన్వయ భావాన్ని, రెండవ కర్తతో పునరుక్తమయ్యే క్రియను స్పష్టం చేయడానికి ‘కూడా’ వాడబడింది.
- source_word: שֹׁמֵעַ לִי
  choice: నా మాట వినే
  rationale: వర్తమాన కృదంతం జ్ఞానిని విశేషిస్తుంది. ‘నా మాట వినే’ అనేది కేవలం శబ్దం వినడంకన్నా సందర్భానుగుణమైన శ్రద్ధగా వినడాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. తరువాతి వచనంలోని ప్రత్యక్ష వాక్యంతో భావం కొనసాగుతున్నందున చివర కామా ఉంచబడింది; హీబ్రూలో రెండవ కర్తతో క్రియ పునరుక్తం కాకపోయినా తెలుగులో స్పష్టత కోసం ‘అంటాడు’ చేర్చబడింది.
