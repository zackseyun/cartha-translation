source:
  edition: WLC
  text: אֵֽין חֹ֭שֶׁךְ וְ/אֵ֣ין צַלְמָ֑וֶת לְ/הִסָּ֥תֶר שָׁ֝֗ם פֹּ֣עֲלֵי אָֽוֶן־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/022.yaml
  text: There is no darkness[a], and no deep shadow, where workers of wickedness may hide themselves.
translation:
  language: te
  text: దుర్మార్గం చేసేవారు దాక్కోవడానికి చీకటిగానీ, గాఢాంధకారంగానీ[a] లేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘మరణ ఛాయ’; ఈ హీబ్రూ పదం కవితా సందర్భాల్లో గాఢమైన నీడను లేదా అత్యంత దట్టమైన చీకటిని కూడా సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין
  choice: లేదు
  rationale: అస్తిత్వాన్ని నిరాకరించే హీబ్రూ రూపాన్ని సహజమైన ఆధునిక తెలుగు వాక్యాంత క్రియతో వ్యక్తపరుస్తుంది.
- source_word: חֹשֶׁךְ
  choice: చీకటి
  rationale: ఇది సాధారణంగా చీకటిని సూచిస్తుంది; ఇక్కడ దాక్కోవడానికి వీలు కలిగించే అంధకారం భావంలో ఉంది.
- source_word: צַלְמָוֶת
  choice: గాఢాంధకారం
  rationale: జ్ఞానసాహిత్య కవిత్వంలో ఈ పదం తరచుగా అత్యంత దట్టమైన చీకటి లేదా గాఢమైన నీడను సూచిస్తుంది; సందర్భం మరణం గురించి కాక దైవిక పరిశీలన నుండి దాగలేకపోవడం గురించి.
- source_word: לְהִסָּתֶר
  choice: దాక్కోవడానికి
  rationale: לְ తో కూడిన నిఫ్అల్ క్రియారూపం స్వయంగా దాగడం అనే ఉద్దేశాన్ని తెలియజేస్తుంది; తెలుగులో ఈ ప్రయోజనార్థక రూపం సహజంగా ఉంటుంది.
- source_word: שָׁם
  choice: దాక్కోవడానికి ... లేదు
  rationale: హీబ్రూలోని ‘అక్కడ’ భావం తెలుగులో చీకటి లేదా గాఢాంధకారం అనే స్థలసూచక నామాలతో కూడిన ప్రయోజన నిర్మాణంలో సహజంగా అంతర్భవిస్తుంది.
- source_word: פֹּעֲלֵי אָוֶן
  choice: దుర్మార్గం చేసేవారు
  rationale: ‘అన్యాయం/దుష్టత్వం చేసేవారు’ అనే నిర్మాణాన్ని సాధారణ పాఠకులకు సహజంగా, నైతిక బలాన్ని నిలుపుతూ అందిస్తుంది.
- source_word: אָוֶן
  choice: దుర్మార్గం
  rationale: ఈ సందర్భంలో పదం కష్టం కంటే నైతిక చెడును సూచిస్తుంది; ‘దుర్మార్గం’ ఆ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: కవితా సందర్భంలో צַלְמָוֶת అర్థం
  choice: గాఢాంధకారం
  alternative: మరణ ఛాయ; గాఢమైన నీడ
  rationale: వాక్యం మరణం గురించి కాక దేవుని దృష్టి నుండి దాగడం అసాధ్యమని చెబుతోంది. అందువల్ల ప్రధాన పాఠంలో తీవ్రమైన చీకటి భావాన్ని ఉంచి, సంప్రదాయ ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలుపుతున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన శైలి. ‘చీకటిగానీ, గాఢాంధకారంగానీ లేదు’ అనే సమాంతర నిర్మాణం మూలంలోని కవితా బలాన్ని కాపాడుతుంది; ‘దాక్కోవడానికి’ స్వయంగా దాగడం అనే భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
