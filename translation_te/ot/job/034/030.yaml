  text: so that a godless man should not reign[a], nor be snares to the people.
translation:
  language: te
  text: భక్తిహీనుడు పరిపాలించకుండా[a], ప్రజలు ఉచ్చులలో చిక్కుకోకుండా.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “భక్తిహీనుడు ఏలకుండునట్లు, ప్రజలు ఉచ్చులలో చిక్కుకోకుండునట్లు.” హీబ్రూ వాక్యం చాలా సంక్షిప్తంగా ఉంది. ‘పరిపాలించడం’ మరియు ‘ఉచ్చు’ అనే పదాలతో, భక్తిహీనుడు ఏలకుండా ప్రజలు ఉచ్చులలో చిక్కుకోకుండా ఉండాలనే నివారణ భావాన్ని ఇది వ్యక్తం చేస్తుంది; సమీప సంబంధమున్న ఇతర అనువాదాలకూ అవకాశం ఉంది.
    reason: alternative_reading
lexical_decisions:
- source_word: מִמְּלֹךְ
  choice: పరిపాలించకుండా
  rationale: מִן‌తో కూడిన מלך ధాతువు ఇక్కడ ముందటి వాక్యంపై ఆధారపడిన నివారణ లేదా ఉద్దేశ భావాన్ని సూచిస్తుంది. తెలుగు సహజ వాక్యనిర్మాణంలో ‘పరిపాలించకుండా’ ఆ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: אָדָם
  choice: వ్యక్తి (తెలుగు వాక్యంలో ‘భక్తిహీనుడు’లో అంతర్భూతం)
  rationale: ఇక్కడ మానవజాతి మొత్తాన్ని కాక, పాలించే ఒక వ్యక్తిని సూచిస్తుంది. తెలుగులో ‘భక్తిహీనుడైన వ్యక్తి’ అని పునరుక్తి చేయకుండా ‘భక్తిహీనుడు’ అనడం సహజం.
- source_word: חָנֵף
  choice: భక్తిహీనుడు
  rationale: జ్ఞానసాహిత్యంలో ఈ పదం కేవలం కపటత్వాన్ని కాక దేవునిపట్ల భయభక్తులు లేని దుష్ట స్వభావాన్ని సూచిస్తుంది. ‘భక్తిహీనుడు’ దాని నైతిక-మతపరమైన బలాన్ని సహజంగా అందిస్తుంది.
- source_word: מִמֹּקְשֵׁי
  choice: ఉచ్చులు ఏర్పడకుండా
  rationale: מוֹקֵשׁ యొక్క బహువచన రూపమైన ‘ఉచ్చులు’ను నిలుపుతూ, מִן‌ను సందర్భానుసారంగా నివారణ భావంలో తీసుకున్నాం. హీబ్రూ సంక్షిప్తతను తెలుగులో అర్థవంతంగా వ్యక్తం చేయడానికి ‘ఏర్పడకుండా’ చేర్చబడింది.
- source_word: עָם
  choice: ప్రజలకు
  rationale: పాలకుని అధీనంలోని సమాజాన్ని సూచిస్తున్నందున ‘ప్రజలు’ సహజమైన ఆధునిక తెలుగు పదం; ఉచ్చుల వల్ల వారికి కలిగే ప్రమాదాన్ని ‘ప్రజలకు’ తెలియజేస్తుంది.
theological_decisions:
- issue: సంక్షిప్తమైన హీబ్రూ వాక్యనిర్మాణ భావం
  choice: దేవుని చర్య వల్ల భక్తిహీనుడు పరిపాలించకుండా, ప్రజలకు ఉచ్చులు ఏర్పడకుండా ఉంటుంది.
  alternative: ‘భక్తిహీనుడు ఏలకుండునట్లు, ప్రజలకు ఉచ్చులు ఉండకుండునట్లు’; లేదా ‘ప్రజల ఉచ్చుల కారణంగా భక్తిహీనుడు పరిపాలించకుండా.’
  rationale: ఈ పాదం ముందటి వచనంలోని దేవుని న్యాయచర్యపై ఆధారపడుతుంది. నివారణ/ఫలిత భావం సందర్భానికి సరిపోతుంది; అయితే హీబ్రూ పదబంధం ఇతర సమీప భావవ్యాఖ్యలకు కూడా వీలు కల్పిస్తున్నందున ఆ అనిశ్చితిని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన శైలి వాడబడింది. ముందటి వచనంతో ఉన్న వ్యాకరణ సంబంధాన్ని నిలుపుకోవడానికి ఇది ఉద్దేశ/నివారణ భావమున్న అసంపూర్ణ పాదంలా ఉంచబడింది.
