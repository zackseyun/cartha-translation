translation:
  language: te
  text: 'నీకు అవగాహన ఉంటే, ఇది విను;

    నా మాటల ధ్వనిని ఆలకించు.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘నా మాటల స్వరాన్ని ఆలకించు.’ హెబ్రీ పదబంధానికి అక్షరార్థం ‘నా మాటల ధ్వని/స్వరం.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: ఉంటే
  rationale: సందర్భంలో ఇది షరతుతో కూడిన విజ్ఞప్తిని పరిచయం చేస్తుంది. తెలుగులో సహజమైన వాక్యనిర్మాణం కోసం ముందున్న וְ ను విడిగా అనువదించకుండా ‘ఉంటే’లో భావాన్ని వ్యక్తం చేశాం.
- source_word: בִּינָה
  choice: అవగాహన
  rationale: ఈ పదం అర్థం చేసుకునే సామర్థ్యాన్ని, వివేచనను సూచిస్తుంది. సాధారణ ఆధునిక తెలుగులో ‘అవగాహన’ స్పష్టంగా, సహజంగా ఉంది.
- source_word: שִׁמְעָה
  choice: విను
  rationale: שׁמע క్రియ యొక్క ఏకవచన ఆజ్ఞారూపం. నేరుగా ఇచ్చిన పిలుపును ‘విను’ నిలుపుతుంది; తరువాతి శ్రద్ధగా ఆలకించమనే క్రియతోనూ భేదం ఉంటుంది.
- source_word: זֹּאת
  choice: ఇది
  rationale: ఏలీహూ ఇప్పుడు చెప్పబోయే లేదా చెబుతున్న విషయాన్ని సూచించే సర్వనామాన్ని అదనపు వివరణ లేకుండా నేరుగా అనువదించాం.
- source_word: הַאֲזִינָה
  choice: ఆలకించు
  rationale: శ్రద్ధగా చెవియొగ్గి వినడాన్ని ఈ క్రియ సూచిస్తుంది. ‘ఆలకించు’ గౌరవప్రదమైన ఆధునిక తెలుగు వాడుకలో ఉండి, ముందున్న ‘విను’కంటే ఉద్దేశపూర్వక శ్రద్ధను తెలియజేస్తుంది.
- source_word: לְקוֹל
  choice: ధ్వనిని
  rationale: קוֹל కు ‘ధ్వని’ లేదా ‘స్వరం’ అనే అర్థాలు ఉన్నాయి. ‘నా మాటల ధ్వని’ హెబ్రీలోని స్పష్టమైన నిర్మాణాన్ని నిలుపుతూ తెలుగులో అర్థమయ్యేలా ఉంది.
- source_word: מִלָּי
  choice: నా మాటలు
  rationale: మాట్లాడబడిన పలుకులను సూచించే బహువచన నామవాచకాన్ని ‘నా మాటలు’ అని నేరుగా అనువదించాం.
