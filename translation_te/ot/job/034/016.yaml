translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన, గౌరవప్రదమైన సంబోధనను వాడాం. ఒకే శ్రోతను ఉద్దేశించిన హెబ్రీ ఏకవచన ఆజ్ఞారూపాలను ‘విను’, ‘ఆలకించు’గా నిలిపాం. కవితాత్మక సమాంతరత కోసం రెండు పాదాలుగా అమర్చాం.
