source:
  edition: WLC
  text: אָבִ֗י יִבָּחֵ֣ן אִיּ֣וֹב עַד נֶ֑צַח עַל תְּ֝שֻׁבֹ֗ת בְּ/אַנְשֵׁי אָֽוֶן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/036.yaml
  text: My father[a], let Job be tested to the limit[c][b], because of his answers like wicked men.
translation:
  language: te
  text: నా తండ్రీ[a], యోబు అంతమువరకు[b] పరీక్షించబడాలి; ఎందుకంటే అతని జవాబులు దుష్టుల జవాబుల్లా ఉన్నాయి[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఓ నా తండ్రీ”; హీబ్రూలో అక్షరార్థంగా “నా తండ్రి.” ఇది బహుశా సంబోధన; అయితే కొందరు దీనిని వేరుగా అర్థం చేసుకుంటారు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “నిత్యము వరకు.” ఇక్కడ భావం చివరివరకు లేదా పూర్తిగా పరీక్షించబడటం కావచ్చు.
    reason: lexical_alternative
  - marker: c
    text: లేదా, “దుష్టులతో కలిసి” లేదా “దుష్టుల మధ్య”; హీబ్రూ ఉపసర్గ సహవాసాన్ని గానీ పోలికను గానీ సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: אָבִי
  choice: నా తండ్రీ
  rationale: రూపం అక్షరార్థంగా ‘నా తండ్రి’; ఇక్కడ సంబోధనగా గ్రహించడం సహజం. భిన్న అవగాహనకు పాదటిప్పణి ఇచ్చాం.
- source_word: יִבָּחֵן
  choice: పరీక్షించబడాలి
  rationale: בחן నిఫాల్ రూపం ‘పరీక్షించబడటం/పరిశీలించబడటం’ అని సూచిస్తుంది; సందర్భంలోని ఆకాంక్షాత్మక భావాన్ని తెలుగు విధ్యర్థక రూపం తెలియజేస్తుంది.
- source_word: עַד נֶצַח
  choice: అంతమువరకు
  rationale: అక్షరార్థంగా ‘నిత్యము వరకు’; సందర్భంలో పరీక్షను చివరివరకు లేదా సంపూర్ణంగా కొనసాగించాలనే తీవ్రతను వ్యక్తం చేయవచ్చు. మూలంలోని కాలవ్యాప్తి రూపకాన్ని ప్రధాన పాఠంలో నిలిపాం.
- source_word: עַל
  choice: ఎందుకంటే
  rationale: యోబును పరీక్షించాలనే ఆకాంక్షకు కారణాన్ని పరిచయం చేస్తుంది.
- source_word: תְּשֻׁבוֹת
  choice: జవాబులు
  rationale: వాదప్రతివాద సందర్భంలో ‘సమాధానాలు/ప్రత్యుత్తరాలు’ కంటే ‘జవాబులు’ సహజంగా, సంక్షిప్తంగా ఉంది.
- source_word: בְּאַנְשֵׁי אָוֶן
  choice: దుష్టుల జవాబుల్లా
  rationale: בְּ ఇక్కడ పోలికను లేదా సహవాసాన్ని సూచించవచ్చు. ప్రధాన పాఠంలో సహజమైన పోలికను ఎంచుకుని, సహవాస అర్థాన్ని పాదటిప్పణిలో నిలిపాం.
theological_decisions:
- issue: యోబు పరీక్షించబడాలనే ఎలీహూ ఆకాంక్ష
  choice: యోబు తన జవాబుల కారణంగా చివరివరకు పరీక్షించబడాలని కోరడం
  alternative: యోబు నిత్యంగా పరీక్షించబడాలని వాక్యం ప్రకటించడం
  rationale: יִבָּחֵן రూపాన్ని సందర్భానుసారమైన ఆకాంక్షగా అనువదించడం, నిరంతర శిక్ష లేదా నిత్య పరీక్ష అనే అధికమైన సిద్ధాంతార్థాన్ని మోపకుండా ఉంటుంది.
- issue: בְּאַנְשֵׁי אָוֶן లోని సంబంధం
  choice: యోబు జవాబులు దుష్టుల జవాబులవంటివని పోలిక
  alternative: యోబు దుష్టులతో కలిసి లేదా వారి మధ్య జవాబిచ్చాడనే సహవాస భావం
  rationale: హీబ్రూ ఉపసర్గ రెండు భావాలకు అవకాశం ఇస్తుంది; చదవడానికి సహజమైన పోలికను ప్రధాన పాఠంలో ఉంచి, నిజమైన సందిగ్ధతను పాదటిప్పణిలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన, సాధారణ పాఠకులకు స్పష్టమైన శైలి. ‘నా తండ్రీ’ సంబోధనకు సహజమైన గంభీరతను ఇస్తుంది; ‘పరీక్షించబడాలి’ ఆకాంక్షాత్మక న్యాయపరిశీలన భావాన్ని నిలుపుతుంది. మూలంలోని మూడు ముఖ్య సందిగ్ధతలను పాదటిప్పణుల్లో సంరక్షించాం.
