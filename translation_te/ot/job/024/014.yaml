source:
  edition: WLC
  text: לָ/א֡וֹר יָ֘ק֤וּם רוֹצֵ֗חַ יִֽקְטָל עָנִ֥י וְ/אֶבְי֑וֹן וּ֝/בַ/לַּ֗יְלָה יְהִ֣י כַ/גַּנָּֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/024/014.yaml
  text: At dawn the murderer rises[a]; he kills the poor and needy[b], and in the night he is like a thief.
translation:
  language: te
  text: తెల్లవారగానే హంతకుడు లేస్తాడు[a]; పేదవాణ్ణి, అవసరంలో ఉన్నవాణ్ణి చంపుతాడు[b]. రాత్రివేళ దొంగలా ఉంటాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వెలుగు రాగానే’; హీబ్రూ అక్షరార్థంగా వెలుగు రావడాన్ని సూచిస్తుంది, బహుశా తెల్లవారడాన్ని.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘పేదవాణ్ణి, అవసరంలో ఉన్నవాణ్ణి హతమారుస్తాడు’; ఇక్కడ హీబ్రూలో ‘హంతకుడు’ అనే పదానికి భిన్నమైన క్రియ వాడబడింది. అందుకే ప్రధాన పాఠంలో ఆ పదభేదాన్ని ‘చంపుతాడు’ అని నిలిపాం.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָאוֹר
  choice: తెల్లవారగానే
  rationale: అక్షరార్థంగా ‘వెలుగు వద్ద/వెలుగు వచ్చినప్పుడు’ అనే భావం; సందర్భంలో ఉదయపు వెలుగు రావడాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: יָקוּם
  choice: లేస్తాడు
  rationale: קום అనే క్రియ ఇక్కడ నిద్రనుంచి లేదా నిష్క్రియ స్థితినుంచి లేచి చర్య మొదలుపెట్టడాన్ని సూచిస్తుంది.
- source_word: רוֹצֵחַ
  choice: హంతకుడు
  rationale: కృదంతం వ్యక్తిని సూచించే నామవాచకంగా వాడబడింది; ఉద్దేశపూర్వకంగా ప్రాణం తీసే వ్యక్తి అనే భావాన్ని ‘హంతకుడు’ స్పష్టంగా ఇస్తుంది.
- source_word: יִקְטָל
  choice: చంపుతాడు
  rationale: ఇక్కడ רצח కాక సాధారణంగా ‘చంపు/వధించు’ అనే קטל క్రియ ఉంది; ‘హంతకుడు’తో ఒకే పదాన్ని పునరావృతం చేయకుండా మూలంలోని పదభేదాన్ని నిలుపుతుంది.
- source_word: עָנִי וְאֶבְיוֹן
  choice: పేదవాణ్ణి, అవసరంలో ఉన్నవాణ్ణి
  rationale: సామాజికంగా బలహీనులైన రెండు వర్గాలపై ఉన్న ద్విపద నొక్కును నిలుపుతూ, ఆధునిక పాఠకులకు సహజంగా అర్థమయ్యే పదాలు ఎంచుకున్నాం.
- source_word: וּבַלַּיְלָה
  choice: రాత్రివేళ
  rationale: ఉదయపు వెలుగుతో వ్యత్యాసంగా రెండవ కాలసూచనను సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: יְהִי
  choice: ఉంటాడు
  rationale: היה + כ నిర్మాణం ఇక్కడ స్థితి లేదా పాత్రసదృశ ప్రవర్తనను సూచిస్తుంది; ఉపమానంలోని ఉద్దేశిత అస్పష్టతను ‘ఉంటాడు’ నిలుపుతుంది.
- source_word: כַגַּנָּב
  choice: దొంగలా
  rationale: כ అనే పోలికా ఉపసర్గను సహజమైన తెలుగు ఉపమాన రూపంలో అందిస్తుంది.
