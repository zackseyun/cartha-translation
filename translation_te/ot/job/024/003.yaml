  yaml_path: translation/ot/job/024/003.yaml
  text: They drive away the orphan's donkey[b][a]; they take the widow's ox as a pledge.
translation:
  language: te
  text: వారు అనాథల గాడిదను తోలుకుపోతారు[a]; విధవరాలి ఎద్దును తాకట్టుగా తీసుకుంటారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘వారు అనాథల గాడిదలను తోలుకుపోతారు.’ హీబ్రూలో ‘అనాథలు’ బహువచనంలోనూ, ‘గాడిద’ ఏకవచనంలోనూ ఉన్నాయి; ఈ మాటను అనాథలందరిని సమష్టిగా సూచించేదిగానో, ఒక్కొక్క అనాథకు వర్తించేదిగానో అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘విధవరాలి ఎద్దును అప్పుకు హామీగా స్వాధీనం చేసుకుంటారు.’ ఈ క్రియ అప్పుకు భద్రతగా ఆస్తిని తీసుకోవడాన్ని ప్రత్యేకంగా సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲמוֹר
  choice: గాడిద
  rationale: ఇది ఇంటి పనులకు, బరువులు మోయడానికి ఉపయోగించే జంతువుకు ఆధునిక తెలుగులో సహజమైన సాధారణ పదం.
- source_word: יְתוֹמִים
  choice: అనాథల
  rationale: హీబ్రూలో ఈ పదం బహువచనంలో ఉంది. దానిని తెలుగు స్వాధీన సంబంధంతో చూపిస్తూ, అనాథలనే సామాజిక వర్గాన్ని సూచించే భావాన్ని నిలిపాం.
- source_word: יִנְהָגוּ
  choice: తోలుకుపోతారు
  rationale: נהג అనే క్రియకు జంతువును తోలడం లేదా నడిపించడం అనే అర్థం ఉంది. సందర్భంలోని అన్యాయమైన ఆస్తి అపహరణ భావాన్ని సహజంగా తెలియజేయడానికి ‘తోలుకుపోతారు’ ఎంచుకున్నాం.
- source_word: יַחְבְּלוּ
  choice: తాకట్టుగా తీసుకుంటారు
  rationale: ఈ సందర్భంలో חבל అప్పుకు భద్రతగా ఆస్తిని స్వాధీనం చేసుకోవడాన్ని సూచిస్తుంది. కేవలం ‘తీసుకుంటారు’ అనకుండా దాని న్యాయ-ఆర్థిక భావాన్ని నిలిపాం.
- source_word: שׁוֹר
  choice: ఎద్దు
  rationale: వ్యవసాయ సందర్భంలోని పనిజంతువును సూచించడానికి ‘ఎద్దు’ సహజమైన, స్పష్టమైన తెలుగు పదం.
- source_word: אַלְמָנָה
  choice: విధవరాలి
  rationale: హీబ్రూ నిర్మాణంలోని స్వాధీన సంబంధాన్ని తెలుగులో సహజంగా చూపిస్తూ, ఎద్దు విధవరాలికి చెందినదని తెలియజేస్తుంది.
