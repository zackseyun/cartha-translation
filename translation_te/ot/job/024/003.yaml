  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన శైలిని ఉపయోగించాం. పద్యంలోని రెండు సమాంతర అన్యాయ చర్యలను సంక్షిప్తంగా నిలిపి, హీబ్రూ వచనంలోని వచన-సంఖ్య అస్పష్టతను పాదటిప్పణిలో భద్రపరిచాం.
