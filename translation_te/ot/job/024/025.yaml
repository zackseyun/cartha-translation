  text: And if it is not so[a], then who can prove me a liar and make my word into nothing?
translation:
  language: te
  text: అది అలా కాకపోతే, అయితే నన్ను అబద్ధికుడని నిరూపించి నా మాటను వ్యర్థం చేయగలవారు ఎవరు?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నన్ను ఖండించి, నా మాటను శూన్యం చేయగలవారు ఎవరు?”
    reason: כזב మరియు שׂים לאל పదబంధాలకు సాధ్యమైన మరింత అక్షరానుసార ప్రత్యామ్నాయాన్ని చూపుతుంది.
lexical_decisions:
- source_word: וְאִם לֹא אֵפוֹ
  choice: అది అలా కాకపోతే
  rationale: ముందు చెప్పిన వాదనలను షరతుతో సవాలు చేసే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది. אֵפוֹ ఇచ్చే తార్కిక/ఉద్ఘాటన బలం తెలుగు వాక్య నిర్మాణంలో అంతర్లీనంగా నిలుస్తుంది.
- source_word: מִי
  choice: ఎవడు
  rationale: అలంకారప్రశ్నలోని ‘ఎవరు?’ అనే సవాలును నేరుగా నిలుపుతుంది; సందర్భంలోని ఏకవచన వ్యక్తి సూచనకు ‘ఎవడు’ సరిపోతుంది.
- source_word: יַכְזִיבֵנִי
  choice: నన్ను అబద్ధికుడని నిరూపించి
  rationale: כזב హిఫీల్ రూపంలోని ‘అబద్ధికుడని చూపు/అసత్యమని నిరూపించు’ అనే బలాన్ని కాపాడుతుంది; కేవలం ‘ఖండించు’ కంటే వ్యక్తిపై ఉన్న సవాలును స్పష్టంగా తెలుపుతుంది.
- source_word: וְיָשֵׂם לְאַל
  choice: వ్యర్థం చేసి
  rationale: అక్షరార్థంగా ‘శూన్యంగా ఉంచు/చేయు’; ఇక్కడ మాటను పనికిరానిదిగా, విలువలేనిదిగా చేయడం అనే ఫలితార్థాన్ని సహజ తెలుగులో ఇస్తుంది.
- source_word: מִלָּתִי
  choice: నా మాటను
  rationale: ఏకవచన ‘నా మాట/నా పలుకు’ అనే సంక్షిప్తతను, యోబు స్వీయ సమర్థనలోని వాక్చాతుర్య బరువును నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైన అలంకారప్రశ్న ధోరణి. మూలంలోని సంక్షిప్త సవాలును సహజంగా ఉంచుతూ, ‘నిరూపించి’ మరియు ‘వ్యర్థం చేసి’ ద్వారా న్యాయవాదసదృశ బలాన్ని నిలిపింది.
