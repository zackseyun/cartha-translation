id: JOB.24.13
reference: Job 24:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: הֵ֤מָּה הָיוּ֮ בְּֽ/מֹרְדֵ֫י א֥וֹר לֹֽא הִכִּ֥ירוּ דְרָכָ֑י/ו וְ/לֹ֥א יָ֝שְׁב֗וּ בִּ/נְתִיבֹתָֽי/ו׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/024/013.yaml
  text: These are among those who rebel against the light[a]; they do not recognize its ways[b], and they do not stay in its paths.
translation:
  language: te
  text: వీరు వెలుగుకు ఎదురుతిరిగేవారిలో ఉన్నారు[a]; దాని మార్గాలను వారు గుర్తించరు[b], దాని బాటల్లో నిలిచి ఉండరు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వీరు వెలుగుకు ఎదురుతిరిగేవారిలో ఉండేవారు.” హెబ్రీ క్రియ రూపరీత్యా భూతకాలాన్ని సూచించగలదు; అయితే ఈ కవితాత్మక సందర్భంలో అది ఒక వర్గం వారి కొనసాగుతున్న స్వభావాన్ని వర్ణిస్తుండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: హెబ్రీలో అక్షరార్థంగా “అతని మార్గాలు ... అతని బాటలు.” ఆ ప్రత్యయాలు సహజంగా “వెలుగు”ను సూచిస్తాయి; అందువల్ల తెలుగులో “దాని మార్గాలు ... దాని బాటలు” అని అనువదించాం.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵמָּה
  choice: వీరు
  rationale: స్వతంత్ర సర్వనామంలోని నొక్కిచెప్పే, సందర్భంలోని ఒక వర్గాన్ని చూపించే భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: הָיוּ
  choice: ఉన్నారు
  rationale: రూపరీత్యా భూతకాలమైనప్పటికీ, కవితాత్మక సందర్భంలో ఒక వర్గానికి చెందినవారిని కొనసాగుతున్న స్వభావవర్ణనగా సూచిస్తుంది; పాదటిప్పణిలో భూతకాల ప్రత్యామ్నాయం నిలిపాం.
- source_word: בְּמֹרְדֵי
  choice: ఎదురుతిరిగేవారిలో
  rationale: בְּ ఇక్కడ వర్గంలో భాగమై ఉండడాన్ని సూచిస్తుంది; מרד యొక్క క్రియాశీల తిరుగుబాటు భావాన్ని కాపాడుతుంది.
- source_word: אוֹר
  choice: వెలుగుకు
  rationale: పదాన్ని సూటిగా అనువదించి, దానిలోని భౌతిక మరియు నైతిక ప్రతిధ్వనులను వివరణతో పరిమితం చేయకుండా ఉంచుతుంది.
- source_word: לֹא הִכִּירוּ
  choice: గుర్తించరు
  rationale: הכיר లోని గుర్తించడం, తెలుసుకోవడం లేదా అంగీకరించడం అనే భావవిస్తృతిలో, 'మార్గాలు'తో సహజంగా సరిపడి మూలంలోని అస్పష్టతను చాలావరకు నిలుపుతుంది.
- source_word: דְרָכָיו
  choice: దాని మార్గాలను
  rationale: మూడవ పురుష ఏకవచన ప్రత్యయం సమీపంలోని పుంలింగ ఏకవచన నామవాచకమైన 'వెలుగు'ను సహజంగా సూచిస్తుంది; తెలుగులో అనవసర వ్యక్తీకరణను నివారిస్తుంది.
- source_word: וְלֹא יָשְׁבוּ
  choice: నిలిచి ఉండరు
  rationale: ישב యొక్క కూర్చోవడం, నివసించడం, నిలిచి ఉండడం అనే పరిధిలో, బాటల్లో కొనసాగకపోవడం అనే రూపకానికి ఇది సహజంగా సరిపోతుంది.
- source_word: בִּנְתִיבֹתָיו
  choice: దాని బాటల్లో
  rationale: נתיבה ను 'బాటలు'గా ఇవ్వడం వల్ల ముందున్న 'మార్గాలు'తో కవితాత్మక సమాంతరత ఉండటంతో పాటు పదభేదం కూడా నిలుస్తుంది; ప్రత్యయం వెలుగునే సూచిస్తుంది.
theological_decisions:
- issue: '''దాని మార్గాలు ... దాని బాటలు''లోని సర్వనామ ప్రత్యయాల నిర్దేశ్యం'
  choice: ప్రత్యయాలు 'వెలుగు'ను సూచిస్తున్నట్లు 'దాని' అని అనువదించడం.
  alternative: వ్యక్తిగత నిర్దేశ్యాన్ని ఊహించి 'ఆయన మార్గాలు ... ఆయన బాటలు' అని అనువదించడం.
  rationale: అత్యంత సమీప వ్యాకరణ పూర్వపదం పుంలింగ ఏకవచనమైన אוֹר ('వెలుగు'). 'దాని' అనడం వల్ల హెబ్రీ పాఠం స్పష్టంగా చేయని దైవవ్యక్తీకరణను అనువాదంలో చేర్చకుండా, నైతిక-దైవిక ప్రతిధ్వనికి అవకాశం నిలుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే కవితాత్మక వాక్యనిర్మాణం వాడబడింది. 'మార్గాలు/బాటలు' అనే సమాంతర పదజంట మూలంలోని דרך/נתיבה భేదాన్ని నిలుపుతుంది; 'వెలుగు'కు ఉన్న భౌతిక, నైతిక భావసంభావ్యతను తెరిచి ఉంచాం.
