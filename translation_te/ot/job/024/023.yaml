source:
  edition: WLC
  text: יִתֶּן ל֣/וֹ לָ֭/בֶטַח וְ/יִשָּׁעֵ֑ן וְ֝/עֵינֵ֗י/הוּ עַל דַּרְכֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/024/023.yaml
  text: He gives them security[a], and they are supported[b]; his eyes are on their ways.
translation:
  language: te
  text: ఆయన వారికి భద్రత ఇస్తాడు[a], వారు ఆసరా పొందుతారు[b]; ఆయన కళ్లు వారి మార్గాలపై ఉన్నాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీలో ‘అతనికి,’ ‘అతడు ఆసరా పొందుతాడు’ అనే ఏకవచన రూపాలు ఉన్నాయి. అయితే వాక్యం చివరలో ‘వారి మార్గాలు’ అని ఉన్నందున ప్రధాన పాఠ్యంలో వాటిని సమూహార్థంగా ‘వారికి,’ ‘వారు’ అని అనువదించాం.
    reason: alternative_reading
  - marker: b
    text: 'మరింత రూపానుసారంగా: “ఆయన అతనికి భద్రత ఇస్తాడు, అతడు ఆసరా పొందుతాడు; ఆయన కళ్లు వారి మార్గాలపై ఉన్నాయి.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתֶּן
  choice: ఇస్తాడు
  rationale: נתן క్రియ యొక్క సాధారణ అర్థమైన ‘ఇవ్వడం/అనుగ్రహించడం’ను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; కవితలోని సాధారణ వర్తమాన భావానికీ సరిపోతుంది.
- source_word: לוֹ
  choice: వారికి
  rationale: రూపరీత్యా ఇది ‘అతనికి’ అనే ఏకవచనం. అయితే వాక్యాంతంలోని דַּרְכֵיהֶם (‘వారి మార్గాలు’) బహువచనం కావడంతో, దుష్టులను ఒక వర్గంగా సూచించే సమూహార్థాన్ని ప్రధాన పాఠ్యంలో సహజంగా వ్యక్తం చేశాం; ఏకవచన రూపాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: לָבֶטַח
  choice: భద్రత
  rationale: ఇది సురక్షిత స్థితిని సూచిస్తుంది. ‘భద్రత’ అనే పదం అంతరంగిక ఆత్మవిశ్వాసం అనే భావాన్ని అనవసరంగా చేర్చకుండా మూలార్థాన్ని నిలుపుతుంది.
- source_word: וְיִשָּׁעֵן
  choice: వారు ఆసరా పొందుతారు
  rationale: שׁען నిఫల్ రూపానికి ‘ఆసరా పొందడం, మద్దతు పొందడం, ఆనుకోవడం’ అనే భావాలు ఉన్నాయి. ముందున్న ‘భద్రత ఇస్తాడు’ అనే మాటకు అనుగుణంగా ఫలిత స్థితిని సహజమైన తెలుగులో ‘ఆసరా పొందుతారు’ అని తెలిపాం.
- source_word: וְעֵינֵיהוּ
  choice: ఆయన కళ్లు
  rationale: మూలంలోని బహువచన నామవాచకం, ఏకవచన స్వామ్య ప్రత్యయాన్ని యథార్థంగా ప్రతిబింబిస్తుంది. ఈ ‘ఆయన’ సందర్భంలో అత్యంత సహజంగా దేవుణ్ణి సూచించినా, మూలపాఠ్యం ఆయనను ఇక్కడ పేరుతో పేర్కొనదు.
- source_word: עַל
  choice: పై
  rationale: శ్రద్ధగా గమనించడం అనే సందర్భార్థాన్ని ‘కళ్లు ... పై ఉన్నాయి’ అనే సహజమైన తెలుగు ప్రయోగం తెలియజేస్తుంది.
- source_word: דַּרְכֵיהֶם
  choice: వారి మార్గాలు
  rationale: דרך అనే పదంలోని మార్గం అనే రూపకాన్ని నిలుపుతూ, వారి నడవడి అనే నైతిక భావాన్ని కూడా వినిపించేలా చేస్తుంది.
theological_decisions:
- issue: వాక్యంలో ఏకవచన, బహువచన సూచనల మార్పు
  choice: మొదటి భాగాన్ని సమూహార్థంగా ‘వారికి ... వారు’ అని అనువదించి, గమనించే వ్యక్తిని ‘ఆయన’ అనే ఏకవచనంలో ఉంచడం
  alternative: రూపానుసారంగా ‘ఆయన అతనికి భద్రత ఇస్తాడు, అతడు ఆసరా పొందుతాడు; ఆయన కళ్లు వారి మార్గాలపై ఉన్నాయి’ అని అనువదించడం
  rationale: హెబ్రీ పాఠ్యంలో ‘అతనికి/అతడు’ అనే ఏకవచన రూపాల తరువాత ‘వారి మార్గాలు’ అనే బహువచనం వస్తుంది. ప్రధాన పాఠ్యం దుష్టులను ఒక వర్గంగా చూపే సమూహార్థాన్ని అందిస్తుంది; పాదటిప్పణి రూపసంబంధమైన అసమానతను భద్రపరుస్తుంది. ‘ఆయన కళ్లు’ దేవుని గమనింపును సూచించే అవకాశం బలంగా ఉన్నా, అనువాదం దానిని వివరణాత్మకంగా విస్తరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవభరితంగా రూపొందించాం. ‘భద్రత,’ ‘ఆసరా,’ ‘మార్గాలు’ సాధారణ పాఠకులకు అర్థమయ్యే పదాలు; చివరి పదం హెబ్రీ కవితాత్మక రూపకాన్ని నిలుపుతుంది. మూలంలోని సంఖ్యా మార్పును ప్రధాన పాఠ్యం మరియు పాదటిప్పణుల ద్వారా స్పష్టంగా సంరక్షించాం.
