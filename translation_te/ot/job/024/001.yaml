source:
  edition: WLC
  text: מַדּ֗וּעַ מִ֭/שַּׁדַּי לֹא נִצְפְּנ֣וּ עִתִּ֑ים ו/ידע/ו לֹא חָ֥זוּ יָמָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/024/001.yaml
  text: Why are times not kept by the Almighty[b][a], and why do those who know him not see his days?
translation:
  language: te
  text: 'సర్వశక్తిమంతునిచేత కాలాలు[a] ఎందుకు భద్రపరచబడి లేవు?


    ఆయనను తెలిసినవారు ఆయన దినాలను[b] ఎందుకు చూడరు?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నియమిత కాలాలు.” మొదటి పాదాన్ని “సర్వశక్తిమంతునిచేత నియమిత కాలాలు ఎందుకు భద్రపరచబడి లేవు?” అని కూడా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “ఆయన దినాలు” అనేది దేవుడు తీర్పు తీర్చడానికి లేదా జోక్యం చేసుకోవడానికి కార్యం చేసే దినాలను సూచిస్తుండవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: מַדּוּעַ
  choice: ఎందుకు
  rationale: యోబు ప్రశ్నలోని నేరమైన ఫిర్యాదు స్వరాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: מִשַּׁדַּי
  choice: సర్వశక్తిమంతుడు
  rationale: యోబు గ్రంథంలో שַׁדַּיకి గౌరవప్రదమైన, సాధారణ తెలుగు సమానార్థకం. నిష్క్రియ క్రియతో వచ్చిన מִן‌ను కర్త/నియంత్రణ సంబంధంగా గ్రహించి తెలుగులో సహజమైన కర్తరి నిర్మాణం వాడబడింది.
- source_word: נִצְפְּנוּ
  choice: తన దగ్గర ఉంచుకోడు
  rationale: צפןలోని ‘దాచు, నిల్వచేయు, భద్రపరచు’ భావాన్ని సందర్భానుసారంగా ‘తన దగ్గర ఉంచుకొను’ అని వ్యక్తం చేస్తుంది; ‘దాచిపెట్టు’ అని మాత్రమే చెప్పి అర్థాన్ని అనవసరంగా సంకుచితం చేయదు.
- source_word: עִתִּים
  choice: కాలాలను
  rationale: ‘కాలాలు’ అనే విస్తృత భావాన్ని ప్రధాన పాఠంలో ఉంచి, ‘నియమిత కాలాలు’ అనే సాధ్యమైన ప్రత్యేక భావాన్ని పాదటిప్పణిలో ఇస్తుంది.
- source_word: וְיֹדְעָיו
  choice: ఆయనను తెలిసినవారు
  rationale: దేవుణ్ణి తెలిసినవారిని సూచించే సంబంధాత్మక భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: חָזוּ
  choice: చూడరు
  rationale: חזהలోని ‘చూచు/దర్శించు’ భావానికి ఈ సందర్భంలో సూటిగా సరిపోతుంది.
- source_word: יָמָיו
  choice: ఆయన దినాలను
  rationale: హీబ్రూ బహువచనాన్ని, దాని కావ్యాత్మక అస్పష్టతను యథాతథంగా నిలుపుతుంది; తీర్పు లేదా జోక్యపు దినాలు అని ప్రధాన పాఠంలో స్పష్టీకరించదు.
theological_decisions:
- issue: ‘ఆయన దినాలు’ అనే పదబంధం దేవునికి సంబంధించి ఏమి సూచిస్తుంది?
  choice: ప్రధాన పాఠంలో ‘ఆయన దినాలు’ అనే అక్షరార్థ పదబంధాన్ని నిలుపడం
  alternative: ఆయన తీర్పు దినాలు; ఆయన కార్యం చేసే కాలాలు; ఆయన నియమించిన తీర్పులు
  rationale: మూలంలోని కావ్యాత్మక సంక్షిప్తత దేవుడు తీర్పు తీర్చే లేదా జోక్యం చేసుకునే సందర్భాలను సూచించవచ్చు; అయితే దానిని ఒకే నిర్దిష్ట సిద్ధాంతార్థానికి పరిమితం చేయకుండా పాఠంలోని ఉద్వేగాన్ని కాపాడాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ప్రశ్నారూపం వాడబడింది. హీబ్రూ నిష్క్రియ నిర్మాణాన్ని తెలుగులో బిగుసుకుపోయిన పదక్రమంగా కాకుండా సహజమైన కర్తరి నిర్మాణంగా మార్చినా, ‘కాలాలు,’ ‘ఆయన దినాలు’ అనే మూలంలోని కీలక అస్పష్టతలను నిలుపుకుంది.
