source:
  edition: WLC
  text: רֹעֶ֣ה עֲ֭קָרָה לֹ֣א תֵלֵ֑ד וְ֝/אַלְמָנָ֗ה לֹ֣א יְיֵטִֽיב׃
base_translation:
  language: en
  yaml_path: translation/ot/job/024/021.yaml
  text: He preys on the barren woman who does not bear[a], and he does no good to the widow.
translation:
  language: te
  text: సంతానం లేని, పిల్లలను కనని స్త్రీని అతడు పీడిస్తాడు[a]; విధవరాలికి ఏ మేలూ చేయడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సంతానం లేని స్త్రీని అతడు మేపుతాడు/పోషిస్తాడు.” హీబ్రూ క్రియకు అక్షరార్థంగా “మేపు, పోషించు” అనే భావం ఉంది; అయితే ఈ సందర్భంలో అది బలహీనురాలిని దోచుకొని పీడించే ప్రతికూల భావాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹעֶה
  choice: కబళిస్తాడు
  rationale: రעה అనే క్రియకు సాధారణంగా ‘మేపు/మేత మేయు/పోషించు’ అనే అర్థాలున్నాయి. అయితే ఇక్కడ బలహీనురాలిని దుష్టుడు దోచుకునే ప్రతికూల సందర్భంలో, ఆహారంగా చేసుకోవడం లేదా వేటాడడం అనే రూపక భావాన్ని ‘కబళిస్తాడు’ సహజంగా తెలియజేస్తుంది; మూలంలోని భక్షణ ఛాయను కూడా నిలుపుతుంది.
- source_word: עֲקָרָה
  choice: గొడ్రాలిని
  rationale: సంతానం కనలేని స్త్రీని సూచించే స్త్రీలింగ ఏకవచన పదానికి ‘గొడ్రాలు’ సూటియైన, సంక్షిప్తమైన తెలుగు సమానం. వెంట వచ్చే ‘పిల్లలు కనని’ అనే మాట మూలంలోని పునరుక్తి బలాన్ని నిలుపుతుంది.
- source_word: לֹא תֵלֵד
  choice: పిల్లలు కనని
  rationale: అక్షరార్థంగా ‘కనదు/ప్రసవించదు.’ సామర్థ్యాన్ని ప్రత్యేకంగా చేర్చకుండా, ఆధునిక తెలుగులో సహజంగా ‘పిల్లలు కనని’ అని అనువదించబడింది.
- source_word: אַלְמָנָה
  choice: విధవరాలికి
  rationale: హీబ్రూ పదం సూచించే సామాజికంగా బలహీన వర్గానికి ప్రామాణికమైన తెలుగు పదం.
- source_word: לֹא יְיֵטִיב
  choice: ఏ మేలూ చేయడు
  rationale: యיטב హిఫీల్ రూపంలోని ‘మేలు చేయు, మంచిగా చూడు, ప్రయోజనం కలిగించు’ అనే విస్తృత భావాన్ని నైతిక బలంతో, మూలానికి దగ్గరగా తెలియజేస్తుంది.
