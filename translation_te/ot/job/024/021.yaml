revisions:
- from: పిల్లలు కనని గొడ్రాలిని అతడు కబళిస్తాడు[a]; విధవరాలికి ఏ మేలూ చేయడు.
  to: సంతానం లేని, పిల్లలను కనని స్త్రీని అతడు పీడిస్తాడు[a]; విధవరాలికి ఏ మేలూ చేయడు.
  rationale: The revision uses respectful modern Telugu for the barren woman, preserves the source’s paired description, and renders the contextually hostile but lexically disputed verb as exploitation rather than certain literal consumption. The footnote retains the Hebrew lexical ambiguity.
  reviewer_model: gpt-5.6-terra
