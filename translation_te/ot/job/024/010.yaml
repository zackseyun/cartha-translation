  yaml_path: translation/ot/job/024/010.yaml
  text: They go about naked[a], without clothing; hungry, they carry sheaves.
translation:
  language: te
  text: 'వారు నగ్నంగా, బట్టలు లేకుండా తిరుగుతారు;

    ఆకలితో ధాన్యపు కట్టలను[a] మోస్తారు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఒక ధాన్యపు కట్టను.’ హెబ్రీ నామవాచకం ఏకవచనంలో ఉంది; అయితే ఇక్కడ అది సమూహార్థంలో వాడబడి ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָרוֹם
  choice: నగ్నంగా
  rationale: ఈ పదం బట్టలు లేకపోవడం లేదా తగినంత వస్త్రధారణ లేకపోవడాన్ని సూచిస్తుంది. సందర్భంలోని దారుణమైన లేమిని నేరుగా తెలియజేయడానికి ‘నగ్నంగా’ సహజమైన ఎంపిక.
- source_word: הִלְּכוּ
  choice: తిరుగుతారు
  rationale: הלך అంటే నడవడం లేదా వెళ్లడం. ఇక్కడ ఒకసారి చేసిన ప్రయాణం కంటే కొనసాగుతున్న దుస్థితిని వర్ణిస్తున్నందున ‘తిరుగుతారు’ సహజంగా సరిపోతుంది.
- source_word: בְּלִי לְבוּשׁ
  choice: బట్టలు లేకుండా
  rationale: వస్త్రాలు లేని స్థితిని స్పష్టంగా తెలియజేస్తూ, ముందున్న ‘నగ్నంగా’ అనే మాటను హెబ్రీ మూలంలాగే బలపరుస్తుంది.
- source_word: רְעֵבִים
  choice: ఆకలితోనే
  rationale: మూలపదం ‘ఆకలిగొన్నవారు’ అని అర్థం. ధాన్యాన్ని మోస్తున్నప్పటికీ వారు ఆకలితో ఉన్న వ్యత్యాసాన్ని తెలుగులో సహజంగా చూపడానికి ‘ఆకలితోనే’ వాడబడింది; ఆకలి తీవ్రతను ‘ఆకలితో అలమటిస్తూ’ అని అనవసరంగా పెంచలేదు.
- source_word: נָשְׂאוּ
  choice: మోస్తారు
  rationale: పంట కట్టను ఒక చోటు నుంచి మరొక చోటుకు తీసుకెళ్లే శారీరక శ్రమకు ‘మోస్తారు’ సరైన తెలుగు సమానం.
- source_word: עֹמֶר
  choice: ధాన్యపు పనలను
  rationale: עֹמֶר వ్యాకరణపరంగా ఏకవచనమైనా, ఇక్కడ అనేకమంది కూలీలు మోసే కోసిన ధాన్యపు కట్టలను సమూహార్థంలో సూచించవచ్చు. ‘ధాన్యపు పనలు’ వ్యవసాయ సందర్భాన్ని స్పష్టంగా, సంక్షిప్తంగా తెలియజేస్తుంది; ఏకవచన రూపాన్ని పాదసూచికలో ఉంచాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన కవితాత్మక వచనం. మూలంలోని ‘నగ్నంగా / బట్టలు లేకుండా’ అనే ఉద్దేశపూర్వక పునరుక్తిని నిలిపి, రెండో పాదంలోని ఆకలి మరియు పంట మోసే శ్రమ మధ్య వ్యత్యాసాన్ని సహజంగా వ్యక్తం చేశాం. పాదసూచిక గుర్తును దాని నిజమైన అంశమైన ‘పనలు’ వద్ద ఉంచాం.
