  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గంభీరమైన శైలి. మూలంలోని కవితాత్మక దృశ్యమైన ‘బండను కౌగిలించుకోవడం’ ఉద్దేశపూర్వకంగా నిలుపబడింది.
