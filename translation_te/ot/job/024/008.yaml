source:
  edition: WLC
  text: מִ/זֶּ֣רֶם הָרִ֣ים יִרְטָ֑בוּ וּֽ/מִ/בְּלִ֥י מַ֝חְסֶ֗ה חִבְּקוּ צֽוּר־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/024/008.yaml
  text: They are drenched by the mountain rains[a]; lacking shelter[b], they embrace the rock.
translation:
  language: te
  text: కొండల వర్షధారల వల్ల వారు తడిసిపోతారు[a]; ఆశ్రయం లేక, బండను కౌగిలించుకుంటారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘కొండల ప్రవాహం వల్ల వారు తడిసిపోతారు’; లేదా, ‘కొండల కుండపోత వర్షం వల్ల వారు తడిసిపోతారు.’
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘బండను కౌగిలించుకుంటారు’; అంటే, ఆశ్రయం కోసం దానికి హత్తుకుంటారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזֶּרֶם הָרִים
  choice: కొండల వర్షధారలకు
  rationale: זֶרֶם అనేది బలమైన వర్షధార, కుండపోత, లేదా ప్రవాహాన్ని సూచించగలదు. ఇక్కడ కొండల్లో బహిరంగంగా ఉన్న సందర్భంలో ‘కొండల వర్షధారలకు’ అనే రూపం వాతావరణ సంబంధ భావాన్ని సహజంగా తెలియజేస్తూ మూలంలోని తీవ్రతను నిలుపుతుంది.
- source_word: יִרְטָבוּ
  choice: వారు తడిసిపోతారు
  rationale: ఈ క్రియ ‘తడవడం/తడిసిపోవడం’ అని అర్థం. ‘తడిసిపోతారు’ అనేది తీవ్ర వర్షానికి రక్షణ లేక గురయ్యే స్థితిని ఆధునిక తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: וּמִבְּלִי מַחְסֶה
  choice: ఆశ్రయం లేక
  rationale: מִבְּלִי అంటే ‘లేక/కొరతవల్ల’; מַחְסֶה అంటే భౌతిక ఆశ్రయం లేదా తలదాచుకునే చోటు. సంక్షిప్తమైన ‘ఆశ్రయం లేక’ మూల భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: חִבְּקוּ
  choice: కౌగిలించుకుంటారు
  rationale: ఈ క్రియ అక్షరార్థంగా ‘కౌగిలించుకోవడం’. వర్షం నుంచి రక్షణ కోసం బండకు హత్తుకునే సజీవ చిత్రాన్ని అనువాదంలో నిలుపుతుంది.
- source_word: צוּר
  choice: బండను
  rationale: צוּר అంటే బండ, శిల, లేదా రాతికొండ. ఈ సందర్భంలో ‘బండ’ సాధారణ పాఠకులకు సహజంగా ఉండి, ఆశ్రయం కోసం దానికి దగ్గరగా ఒత్తుకునే దృశ్యాన్ని స్పష్టంగా ఇస్తుంది.
