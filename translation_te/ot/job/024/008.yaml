  rationale: The revision changes only the Telugu causal construction from “వర్షధారలకు” to the more idiomatic “వర్షధారల వల్ల,” while retaining the Hebrew image of severe mountain rain. Footnote a is conformed to the same natural construction. The literal and contextual force of the second colon is preserved.
