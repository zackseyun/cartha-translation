  terminology: ‘గర్భం,’ ‘పురుగు,’ and ‘అన్యాయం’ are appropriate. ‘అన్యాయం’ preserves the abstract form of עַוְלָה without prematurely resolving its possible concrete force. The footnote correctly identifies ‘దుష్టుడు’ as an alternative contextual construal rather than presenting it as the main-text meaning.
