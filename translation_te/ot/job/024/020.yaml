  source_fidelity: 'The draft preserves the sequence and imagery of the Hebrew: the womb forgets him, the worm’s relation to his corpse is described with the ‘sweet’ idiom, he ceases to be remembered, and עַוְלָה remains an abstract noun in the main text. The alternative concrete reading is appropriately retained in footnote b. The final verb, however, is passive in Hebrew; the Telugu intransitive ‘విరిగిపోతుంది’ can weaken that sense.'
