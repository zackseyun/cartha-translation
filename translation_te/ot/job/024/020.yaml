id: JOB.24.20
reference: Job 24:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: יִשְׁכָּ֘חֵ֤/הוּ רֶ֨חֶם מְתָ֘ק֤/וֹ רִמָּ֗ה ע֥וֹד לֹֽא יִזָּכֵ֑ר וַ/תִּשָּׁבֵ֖ר כָּ/עֵ֣ץ עַוְלָֽה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/024/020.yaml
  text: The womb forgets him[a]; the worm feeds sweetly on him. He is remembered no more[b], and injustice is broken like a tree.
translation:
  language: te
  text: గర్భం అతన్ని మరచిపోతుంది; పురుగు అతన్ని రుచిగా తింటుంది[a]. ఇక అతడు ఎవరికీ జ్ఞాపకం రాడు; అన్యాయం చెట్టులా విరగగొట్టబడుతుంది[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పురుగుకు అతడు తియ్యగా ఉంటాడు.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “దుష్టుడు చెట్టులా విరగగొట్టబడుతాడు.” హెబ్రీలో “అన్యాయం/దుష్టత్వం” అనే భావవాచక నామం ఉంది; అది అన్యాయం చేసే వ్యక్తిని సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: יִשְׁכָּחֵהוּ רֶחֶם
  choice: గర్భం అతన్ని మరచిపోతుంది
  rationale: హెబ్రీలోని ‘గర్భం’ అనే స్పష్టమైన, వ్యక్తీకరించిన చిత్రాన్ని నిలుపుతూ, అసంపూర్ణ క్రియకు సందర్భానుగుణమైన సాధారణ వర్తమాన భావాన్ని ఇచ్చింది.
- source_word: מְתָקוֹ רִמָּה
  choice: పురుగు అతన్ని రుచిగా తింటుంది
  rationale: מָתַק (‘తియ్యగా ఉండు’) అనే మూలపదం కలిగించే ‘పురుగుకు అతడు తియ్యగా/రుచిగా ఉన్నాడు’ అనే భయానక చిత్రాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; మరింత అక్షరార్థమైన ప్రత్యామ్నాయం పాదసూచికలో ఉంచబడింది.
- source_word: עוֹד לֹא יִזָּכֵר
  choice: ఇక అతడు ఎవరికీ జ్ఞాపకం రాడు
  rationale: ‘ఇకపై జ్ఞాపకం చేసుకోబడడు’ అనే నిష్క్రియ భావాన్ని సహజమైన తెలుగు నుడికారంలో వ్యక్తపరుస్తూ, జ్ఞాపకం పూర్తిగా నిలిచిపోవడాన్ని సూచిస్తుంది.
- source_word: וַתִּשָּׁבֵר כָּעֵץ
  choice: చెట్టులా విరిగిపోతుంది
  rationale: శబ్దార్థ పోలికను, నిష్క్రియ ఫలితాన్ని సంక్షిప్తంగా మరియు కవితాత్మకంగా నిలుపుతుంది.
- source_word: עַוְלָה
  choice: అన్యాయం
  rationale: హెబ్రీలో ఉన్న భావవాచక నామరూపాన్ని ప్రధాన పాఠ్యంలో నిలుపుతుంది. అది అన్యాయం చేసే వ్యక్తిని సూచించే అవకాశాన్ని పాదసూచికలో ఇస్తుంది.
theological_decisions:
- issue: עַוְלָה అనే భావవాచక నామాన్ని ‘అన్యాయం’ అని అనువదించాలా, లేక అన్యాయం చేసే వ్యక్తిని సూచించేలా ‘దుష్టుడు’ అని అనువదించాలా?
  choice: అన్యాయం చెట్టులా విరిగిపోతుంది
  alternative: దుష్టుడు చెట్టులా విరిగిపోతాడు
  rationale: మూల హెబ్రీ రూపం భావవాచక నామం కాబట్టి దానిని ప్రధాన పాఠ్యంలో అలాగే నిలిపింది. అయితే సందర్భంలో అది భావవాచకం ద్వారా వ్యక్తిని సూచించవచ్చు; ఆ నిజమైన సందిగ్ధతను పాదసూచికలో భద్రపరిచింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గంభీరంగా రూపొందించబడింది. ‘గర్భం’ మరియు ‘అన్యాయం’ అనే మూలంలోని అసాధారణ వ్యక్తీకరణలను సులభీకరించకుండా నిలిపి, సందిగ్ధ పఠనాలను పాదసూచికల్లో ఇచ్చింది.
