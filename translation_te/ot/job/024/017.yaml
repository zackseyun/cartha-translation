  yaml_path: translation/ot/job/024/017.yaml
  text: For deep darkness is morning to them all[c][b][a], for they are familiar with the terrors of deep darkness.
translation:
  language: te
  text: ఎందుకంటే వారందరికీ ఉదయం కారుచీకటే[a][b]; కారుచీకటి భయాలు వారికి సుపరిచితమే[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఉదయం వారందరికీ కారుచీకటిలా ఉంటుంది.” హెబ్రీ వాక్యక్రమం సంక్షిప్తంగా ఉండి, ఈ రెండురకాల సంబంధాన్ని అనుమతిస్తుంది.
    reason: alternative_reading
  - marker: b
    text: “కారుచీకటి” అని అనువదించిన హెబ్రీ పదాన్ని “మరణఛాయ” అని కూడా అనువదించవచ్చు. ఇక్కడ అది మరణానికంటే గాఢమైన చీకటిని లేదా అంధకారాన్ని సూచించే అవకాశం ఎక్కువ.
    reason: lexical_alternative
  - marker: c
    text: హెబ్రీలో క్రియ ఏకవచనంలో ఉంది—“అతడు ఎరుగుతాడు/గుర్తిస్తాడు.” అయితే సందర్భంలో అది దుష్టులను ఒక సమూహంగా సాధారణంగా సూచిస్తున్నట్లు కనిపిస్తుంది; అందుకే తెలుగులో బహువచనం వాడబడింది.
    reason: grammatical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి వర్ణనకు వివరణను జోడించే కారణార్థక సంబంధాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: יַחְדָּו
  choice: వారందరికీ
  rationale: మూలంలోని ‘కలిసి/అందరూ’ అనే సమష్టి భావాన్ని తెలుగు వాక్యనిర్మాణంలో సహజంగా పంపిణీ భావంతో వ్యక్తం చేస్తుంది.
- source_word: בֹּקֶר
  choice: ఉదయం
  rationale: సాధారణ అర్థాన్ని నిలుపుతూ కారుచీకటితో ఉన్న ఉద్దేశపూర్వక వ్యత్యాసాన్ని కాపాడుతుంది.
- source_word: לָמוֹ
  choice: వారికి
  rationale: మూలంలోని సంబంధార్థక సర్వనామ రూపాన్ని సహజంగా వ్యక్తం చేస్తుంది; יַחְדָּו భావంతో కలిపి ‘వారందరికీ’గా ఇచ్చాం.
- source_word: צַלְמָוֶת
  choice: కారుచీకటి
  rationale: యోబు గ్రంథంలోని సందర్భంలో ఇది మరణాన్ని నేరుగా సూచించడంకంటే గాఢమైన చీకటి, అంధకారం అనే భావాన్ని ఇస్తుంది; ‘కారుచీకటి’ సాధారణ పాఠకునికి స్పష్టంగా, కవితాత్మకంగా ఉంటుంది.
- source_word: יַכִּיר
  choice: సుపరిచితమే
  rationale: కేవలం మేధోపరంగా తెలుసుకోవడం కాక అనుభవపూర్వక పరిచయాన్ని సూచిస్తుంది. హెబ్రీ ఏకవచనాన్ని సమూహంలోని ప్రతి వ్యక్తికి వర్తించే సాధారణ భావంగా తెలుగులో వ్యక్తం చేశాం.
- source_word: בַּלְהוֹת
  choice: భయానకాలు
  rationale: భయంకరమైన లేదా హఠాత్తుగా కలవరపెట్టే విషయాలు అనే బహువచన భావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
theological_decisions:
- issue: צַלְמָוֶת పదంలో మరణ సూచన
  choice: కారుచీకటి
  alternative: మరణఛాయ
  rationale: ఈ సందర్భం రాత్రి, ఉదయం, చీకటి పట్ల దుష్టుల సంబంధాన్ని వర్ణిస్తుంది. అందువల్ల మరణం అనే భావాన్ని అనవసరంగా ముందుకు తేవకుండా గాఢాంధకార భావాన్ని ప్రధాన పాఠ్యంలో ఉంచాం; సంప్రదాయ ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- issue: יַכִּיר అనే ఏకవచన క్రియ యొక్క కర్త
  choice: వారిలో ప్రతి ఒక్కడికీ
  alternative: అతనికి
  rationale: మూలంలోని వ్యాకరణ ఏకవచనాన్ని చెరపకుండా, సందర్భంలో చెప్పబడుతున్న దుష్టుల సమూహానికి అది సాధారణంగా వర్తిస్తుందనే భావాన్ని స్పష్టపరుస్తుంది.
