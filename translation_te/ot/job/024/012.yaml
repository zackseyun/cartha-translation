source:
  edition: WLC
  text: מֵ֘/עִ֤יר מְתִ֨ים יִנְאָ֗קוּ וְ/נֶֽפֶשׁ חֲלָלִ֥ים תְּשַׁוֵּ֑עַ וֶ֝/אֱל֗וֹהַּ לֹא יָשִׂ֥ים תִּפְלָֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/024/012.yaml
  text: From the city the dying groan[a], and the soul of the slain cries out for help[b], yet God does not regard it as folly.
translation:
  language: te
  text: పట్టణం నుండి చనిపోతున్నవారు మూలుగుతున్నారు[a]; హతుల ప్రాణం సహాయం కోసం మొరపెడుతోంది. అయినా దేవుడు దాన్ని అవివేకంగా పరిగణించడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘పట్టణంలో మనుషులు మూలుగుతున్నారు.’ ఇక్కడి מְתִים అనే హీబ్రూ పదం క్లిష్టమైనది; కొందరు దాన్ని ‘చనిపోతున్నవారు’ అని కాక ‘మనుషులు’ అని అర్థం చేసుకుంటారు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘అయినా దేవుడు దాన్ని తప్పుగా పరిగణించడు,’ లేదా ‘అయినా దేవుడు దానిపై నింద మోపడు.’ చివరి హీబ్రూ ప్రయోగం క్లిష్టమైనది; ‘దాన్ని’ దేనిని సూచిస్తుందో కూడా స్పష్టంగా లేదు.
    reason: alternative_reading
lexical_decisions:
- source_word: מֵעִיר
  choice: పట్టణం నుండి
  rationale: מִן అనే ఉపసర్గతో עִיר కలిసినప్పుడు మూలుగు వినిపించే ప్రదేశాన్ని లేదా దాని ఉద్భవస్థానాన్ని సూచిస్తుంది. ‘పట్టణం నుండి’ అనే అనువాదం ఈ రెండు ఛాయలను అతిగా వివరించకుండా నిలుపుతుంది.
- source_word: מְתִים
  choice: చనిపోతున్నవారు
  rationale: ఈ రూపం క్లిష్టమైనది; ‘మనుషులు’ అనే అర్థం సాధ్యమైనప్పటికీ, తరువాతి ‘హతులు’ అనే సమాంతర పదబంధం మరణవేదనలో ఉన్నవారనే అర్థానికి బలం ఇస్తుంది.
- source_word: יִנְאָקוּ
  choice: మూలుగుతున్నారు
  rationale: ఈ క్రియ తీవ్రమైన బాధలో వెలువడే శబ్దాన్ని సూచిస్తుంది. ‘మూలుగుతున్నారు’ ఆధునిక తెలుగులో సహజంగా ఉండి మూలంలోని తీవ్రతను నిలుపుతుంది.
- source_word: וְנֶפֶשׁ
  choice: హతుల ప్రాణం
  rationale: נֶפֶשׁ అంటే ప్రాణం, జీవితం, వ్యక్తి అని అర్థాలు రావచ్చు. ఇక్కడ ఏకవచన సమష్టి ప్రయోగాన్ని నిలుపుతూ ‘ప్రాణం’ అని అనువదించబడింది.
- source_word: חֲלָלִים
  choice: హతులు
  rationale: ఈ నామవాచకం సాధారణంగా దాడిలో కొట్టివేయబడిన లేదా చంపబడినవారిని సూచిస్తుంది; సందర్భంలోని హింసాత్మక అన్యాయానికి ‘హతులు’ సరిపోతుంది.
- source_word: תְּשַׁוֵּעַ
  choice: సహాయం కోసం మొరపెడుతోంది
  rationale: పీయేల్ రూపం సహాయం కోరుతూ చేసే తీవ్రమైన మొరను తెలియజేస్తుంది. తెలుగులో అంతర్లీనమైన సహాయవిన్నపాన్ని సహజంగా వ్యక్తం చేయడానికి ఈ పదబంధం ఉపయోగించబడింది.
- source_word: וֶאֱלוֹהַּ
  choice: అయినా దేవుడు
  rationale: ఇక్కడ וְ బాధితుల మొరకు, దేవుని కనిపించని స్పందనకు మధ్య వ్యతిరేకతను సూచిస్తుంది; ‘అయినా’ ఆ ఉద్రిక్తతను స్పష్టంగా నిలుపుతుంది.
- source_word: לֹא יָשִׂים תִּפְלָה
  choice: దాన్ని అవివేకంగా పరిగణించడు
  rationale: ఈ హీబ్రూ ప్రయోగం క్లిష్టమైనది. תִּפְלָהకు అవివేకం, అసంబద్ధత, తప్పిదం వంటి అర్థాలు ఉండవచ్చు. ‘దాన్ని’ దేనిని సూచిస్తుందో మూలంలో ఉన్న అస్పష్టతను అనువాదం ఉద్దేశపూర్వకంగా నిలుపుతుంది.
theological_decisions:
- issue: అన్యాయం మధ్య దేవుని స్పందన కనిపించకపోవడం
  choice: అయినా దేవుడు దాన్ని అవివేకంగా పరిగణించడు
  alternative: అయినా దేవుడు దానిపై నింద మోపడు / అయినా దేవుడు ఆ మొరను పట్టించుకోడు
  rationale: ఈ వాక్యం దేవుని న్యాయం గురించి తుది సిద్ధాంత నిర్ణయం చెప్పకుండా, దేవుడు స్పందించనట్టుగా కనిపించడం గురించి యోబు వ్యక్తం చేసే ఉద్రిక్తమైన ఫిర్యాదును ఉంచుతుంది. అనువాదం ఆ ఉద్రిక్తతను పరిష్కరించకుండా కాపాడుతుంది.
translation_notes:
  register: సహజమైన ఆధునిక ప్రామాణిక తెలుగులో, గంభీరమైన కవితాత్మక ధోరణిని ఉంచాం. క్లిష్టమైన מְתִים పదాన్నీ, చివరి వాక్యభాగంలోని అర్థసందిగ్ధతనూ పాదసూచికల్లో స్పష్టంగా నమోదు చేశాం.
