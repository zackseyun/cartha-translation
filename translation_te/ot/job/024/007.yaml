translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గంభీరమైన కానీ సహజమైన శైలిని అనుసరించాం. హీబ్రూ వాక్యంలోని పునరుక్తి దుస్థితిని బలపరుస్తుంది కాబట్టి ‘బట్టలు లేక నగ్నంగా’ అని నిలిపాం. ప్రధాన పాఠ్యంలో ‘చలిలో’ అనే మరింత అక్షరార్థమైన రూపాన్ని ఎంచుకుని, ‘కప్పుకోవడానికి’ ద్వారా రక్షణ భావాన్ని సహజంగా వ్యక్తం చేశాం.
