  text: עָר֣וֹם יָ֭לִינוּ מִ/בְּלִ֣י לְב֑וּשׁ וְ/אֵ֥ין כְּ֝ס֗וּת בַּ/קָּרָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/024/007.yaml
  text: They spend the night naked[a], without clothing, and have no covering against the cold.
translation:
  language: te
  text: వారు బట్టలు లేక నగ్నంగా రాత్రి గడుపుతారు; చలిలో కప్పుకోవడానికి వారికి ఏదీ లేదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారు వస్త్రమేమీ లేక నగ్నంగా రాత్రి బసచేస్తారు; చలిలో వారికి కప్పుకునేదేమీ లేదు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עָרוֹם
  choice: నగ్నంగా
  rationale: ఈ విశేషణం దుస్తులు లేకపోవడాన్ని లేదా తగినంతగా కప్పుకోలేని దుస్థితిని సూచిస్తుంది. సందర్భంలోని పేదరికపు తీవ్రతను ‘నగ్నంగా’ నేరుగా వ్యక్తం చేస్తుంది.
- source_word: יָלִינוּ
  choice: రాత్రి గడుపుతారు
  rationale: לין అనే మూలపదం రాత్రి బసచేయడం లేదా రాత్రిని గడపడం అనే భావాన్ని ఇస్తుంది. ‘రాత్రి గడుపుతారు’ ఆధునిక తెలుగులో సహజంగా ఉండి కాలసూచనను నిలుపుతుంది.
- source_word: מִבְּלִי
  choice: లేక
  rationale: ఇది లేమి లేదా కొరతను తెలియజేస్తుంది. తెలుగులో ‘లేక’ సంక్షిప్తంగా, సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: לְבוּשׁ
  choice: బట్టలు
  rationale: ఈ నామవాచకం సాధారణంగా దుస్తులను లేదా వస్త్రాన్ని సూచిస్తుంది. సాధారణ పాఠకులకు ‘బట్టలు’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: כְּסוּת
  choice: కప్పుకోవడానికి ... ఏదీ
  rationale: ఈ పదం వస్త్రం సహా శరీరాన్ని కప్పి రక్షించే దేనినైనా సూచించగలదు. నిర్దిష్టంగా ‘దుప్పటి’ అని పరిమితం చేయకుండా విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: בַּקָּרָה
  choice: చలిలో
  rationale: బְּ ఉపసర్గతో కూడిన ఈ రూపానికి అక్షరార్థంగా ‘చలిలో’ అనే భావం సరిపోతుంది. కప్పుకునే వస్తువు ప్రస్తావన వల్ల చలి నుంచి రక్షణ అనే భావం సందర్భంలో సహజంగానే తెలుస్తుంది.
