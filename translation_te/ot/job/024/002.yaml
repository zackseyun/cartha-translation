translation:
  language: te
  text: వారు హద్దు గుర్తులను జరుపుతారు[a]; మందను దోచుకొని మేపుతారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘హద్దు గుర్తులను తొలగిస్తారు.’ హీబ్రూ క్రియ ఇతరుల భూమిని ఆక్రమించడానికి ఆస్తి హద్దు గుర్తులను జరపడం లేదా తొలగించడం అనే భావాన్ని ఇవ్వగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘మందను దొంగిలించి కాస్తారు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: גְּבֻלוֹת
  choice: సరిహద్దు రాళ్లు
  rationale: ఇక్కడ ఈ బహువచన నామవాచకం పొలాల హద్దులను సూచించే భౌతిక గుర్తులను సూచిస్తుంది. ఆధునిక తెలుగు పాఠకులకు ‘సరిహద్దు రాళ్లు’ ఆస్తి ఆక్రమణకు సంబంధించిన భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: יַשִּׂיגוּ
  choice: మార్చివేస్తారు
  rationale: ఆస్తి హద్దుల సందర్భంలో ఈ క్రియ సరిహద్దు గుర్తులను వాటి స్థానంనుంచి జరిపి ఇతరుల భూమిని ఆక్రమించడాన్ని సూచిస్తుంది. ఇది పూర్తిగా తొలగించడం అనే భావానికే పరిమితం కాకుండా మూలంలోని అర్థవిస్తృతిని నిలుపుతుంది.
- source_word: עֵדֶר
  choice: మందను
  rationale: ఈ ఏకవచన సమూహవాచకం సాధారణంగా గొర్రెలు లేదా మేకల మందను సూచిస్తుంది. జంతుజాతిని మూలం నిర్దిష్టం చేయనందున ‘మంద’ సహజంగా ఉండి ఆ అస్పష్టతను కాపాడుతుంది.
- source_word: גָּזְלוּ
  choice: బలవంతంగా లాక్కొని
  rationale: ఈ క్రియ దొంగతనంగా తీసుకోవడం మాత్రమే కాక బలప్రయోగంతో లేదా అన్యాయంగా స్వాధీనం చేసుకోవడాన్నీ సూచిస్తుంది. ‘బలవంతంగా లాక్కొని’ దాని హింసాత్మకమైన, అక్రమమైన స్వభావాన్ని స్పష్టం చేస్తుంది.
- source_word: וַיִּרְעוּ
  choice: మేపుతారు
  rationale: רעה అనే క్రియ మందను మేపడం లేదా కాయడం అనే అర్థం ఇస్తుంది. దోచుకున్న మందను తమదానిలా బహిరంగంగా మేపుతున్న వ్యంగ్యభావాన్ని ‘మేపుతారు’ సహజంగా అందిస్తుంది.
