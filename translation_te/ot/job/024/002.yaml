  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన శైలి వాడబడింది. హీబ్రూ వాక్యంలోని సంక్షిప్తత, సమాంతర నిర్మాణం నిలుపబడ్డాయి; మంద ఏ జంతువులదో మూలంలో నిర్దిష్టంగా లేనందున తెలుగులోనూ నిర్దిష్టం చేయలేదు.
