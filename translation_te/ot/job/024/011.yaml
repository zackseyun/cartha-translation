  register: ఆధునిక ప్రామాణిక తెలుగులో, వ్యవసాయ దోపిడీ దృశ్యాన్ని స్పష్టంగా, గంభీరంగా అందించింది. హీబ్రూలోని క్లిష్టమైన יַצְהִירוּ క్రియను సందర్భానుసారంగా ‘నూనె తీస్తారు’గా అనువదించి, שׁוּרֹתָם లోని అనిశ్చితిని పాదసూచికలో నిలిపింది.
