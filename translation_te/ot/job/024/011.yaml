  text: Between their rows they press out oil[a]; they tread winepresses[b], yet they go thirsty.
translation:
  language: te
  text: వారి వరుసల మధ్యనే వారు నూనె పిండుతారు[b]; ద్రాక్షతొట్లలో ద్రాక్షలను తొక్కుతారు, అయినా దాహంతో ఉంటారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: ‘నూనె పిండుతారు’గా అనువదించిన క్రియ అర్థం సంప్రదాయంగా క్లిష్టమైనది. అక్షరార్థంగా ఇది నూనె లేదా ప్రకాశానికి సంబంధించినది; సందర్భంలో ఒలీవ నూనెను ఉత్పత్తి చేయడాన్ని లేదా పిండడాన్ని సూచిస్తుందని భావిస్తారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּין
  choice: మధ్య
  rationale: పనివారు శ్రమించే ప్రదేశాన్ని సూచించే సహజమైన స్థానవాచక ప్రయోగం.
- source_word: שׁוּרֹתָם
  choice: వారి వరుసలు
  rationale: ఈ పదానికి ‘గోడలు’ లేదా ‘వరుసలు’ అనే అర్థాలు సాధ్యం; వ్యవసాయ సందర్భంలో ‘వరుసలు’ మూలంలోని దృశ్యాన్ని అతిగా నిర్దిష్టం చేయకుండా నిలుపుతుంది.
- source_word: יַצְהִירוּ
  choice: నూనె తీస్తారు
  rationale: కఠినమైన ఈ క్రియ సందర్భంలో ఒలీవ నూనెను ఉత్పత్తి చేయడాన్ని సూచిస్తుందని సాధారణంగా గ్రహిస్తారు; తెలుగులో సహజంగా ‘నూనె తీస్తారు’ అని అనువదించబడింది.
- source_word: יְקָבִים
  choice: ద్రాక్షతొట్లు
  rationale: ద్రాక్షను తొక్కి రసం తీసే తొట్లు లేదా గానుగలను సూచించే సందర్భోచిత పదం.
- source_word: דָּרְכוּ
  choice: ద్రాక్షలను తొక్కుతారు
  rationale: ద్రాక్షతొట్టిలో ద్రాక్షపండ్లను కాళ్లతో తొక్కే చర్యను స్పష్టంగా తెలియజేస్తుంది.
- source_word: וַיִּצְמָאוּ
  choice: అయినా దాహంతో ఉంటారు
  rationale: వారు పానీయాన్ని ఉత్పత్తి చేస్తున్నప్పటికీ తామే దాహంతో ఉండే చేదైన వ్యత్యాసాన్ని ‘అయినా’ సహజంగా వ్యక్తం చేస్తుంది.
