  source_fidelity: 'మూల హీబ్రూ పాఠంలోని మూడు ప్రధాన భాగాలు విశ్వసనీయంగా ప్రతిఫలించాయి: וּמָשַׁךְ కు “ఈడ్చుకుపోతాడు,” אַבִּירִים కు “బలవంతులను,” బְּכֹחוֹ కు “తన బలంతో.” యָקוּם యొక్క ‘లేచి నిలబడతాడు’ అనే అనువాదం మూల క్రియాచిత్రాన్ని నిలుపుతుంది. చివరి వాక్యభాగంలో ఏకవచన కర్తను ప్రధాన పాఠంలో ఉంచి, సందర్భానుసారమైన అవ్యక్త/ఫలితార్థ పఠనాన్ని పాదసూచికలో ఇవ్వడం హీబ్రూ సందిగ్ధతను తగిన విధంగా కాపాడుతుంది.'
