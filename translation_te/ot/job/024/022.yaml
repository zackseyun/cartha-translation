  yaml_path: translation/ot/job/024/022.yaml
  text: Yet he drags away the mighty by his power; he rises up[a], but he has no assurance of life.
translation:
  language: te
  text: 'అయినా అతడు తన బలంతో బలవంతులను ఈడ్చుకుపోతాడు;

    అతడు లేచి నిలబడతాడు, కానీ తాను బ్రతికి ఉంటాననే నమ్మకం అతనికి ఉండదు.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతడు లేచినప్పుడు ఎవరి ప్రాణానికీ భరోసా ఉండదు.” చివరి ఉపవాక్యంలో కర్త ఎవరో హీబ్రూ పాఠంలో సందిగ్ధంగా ఉంది. మరింత అక్షరార్థంగా, “అతడు జీవితాన్ని నమ్మడు” అని కూడా అనువదించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: וּמָשַׁךְ
  choice: ఈడ్చుకుపోతాడు
  rationale: మָשַׁךְ అనే క్రియకు ‘లాగు, ఈడ్చు’ అనే ప్రాథమిక అర్థం ఉంది. אַבִּירִים కర్మగా, ‘తన బలంతో’ అనే సాధనార్థక పదబంధంతో రావడం వల్ల బలవంతంగా తీసుకుపోవడం అనే భావం సందర్భానికి సరిపోతుంది.
- source_word: אַבִּירִים
  choice: బలవంతులను
  rationale: ఈ పదం బలమైన లేదా శక్తిమంతమైన వ్యక్తులను సూచిస్తుంది. ‘బలవంతులు’ శారీరక బలానికే పరిమితం కాకుండా వారి శక్తి, ప్రాబల్యాన్ని కూడా సహజంగా తెలియజేస్తుంది.
- source_word: בְּכֹחוֹ
  choice: తన బలంతో
  rationale: בְּ అనే ఉపసర్గ ఇక్కడ సాధనార్థకంగా ఉంది; כֹּחַ అంటే బలం లేదా శక్తి. కర్తను స్పష్టంగా అనుసరించేందుకు ‘తన బలంతో’ అని అనువదించబడింది.
- source_word: יָקוּם
  choice: లేచి నిలబడతాడు
  rationale: קוּם అనే క్రియ ‘లేచు, నిలబడు’ అనే భావాలను కలిగి ఉంది. ‘లేచి నిలబడతాడు’ మూలంలోని క్రియాచిత్రాన్ని ఉంచుతూ, తనను తాను మళ్లీ స్థాపించుకోవడం వంటి అతివ్యాఖ్యానాన్ని నివారిస్తుంది.
- source_word: וְלֹא יַאֲמִין בַּחַיִּין
  choice: కానీ తాను బ్రతికి ఉంటాననే నమ్మకం అతనికి ఉండదు
  rationale: వాక్యరూపం ప్రకారం క్రియ ఏకవచన పురుషలింగంలో ఉండి ముందున్న వ్యక్తినే కర్తగా తీసుకోవచ్చు. ‘జీవితం విషయంలో నమ్మడు’ అనే అక్షరార్థ భావాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తూ, జీవితం కొనసాగుతుందనే భరోసా లేకపోవడాన్ని తెలియజేస్తుంది.
theological_decisions:
- issue: చివరి ఉపవాక్యంలో కర్త మరియు భావం సందిగ్ధంగా ఉండటం
  choice: ముందున్న వ్యక్తినే కర్తగా తీసుకొని, అతనికి తన జీవితం కొనసాగుతుందనే నమ్మకం లేదని అనువదించబడింది.
  alternative: అతడు లేచినప్పుడు ఎవరి ప్రాణానికీ భరోసా ఉండదు.
  rationale: హీబ్రూ క్రియ ఏకవచనంలో ఉన్నందున అదే వ్యక్తిని కర్తగా కొనసాగించడం వ్యాకరణపరంగా సూటిగా ఉంటుంది. అయితే సందర్భంలో అతని వల్ల ఇతరుల ప్రాణాలకు కలిగే అభద్రత అనే ఫలితార్థ పఠనం కూడా సాధ్యమే; అందువల్ల దానిని పాదసూచికలో నిలిపి, పాఠంలోని ఉద్రిక్తతను పరిష్కరించకుండా ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గంభీరమైన శైలి ఉపయోగించబడింది. కావ్యరూప సంక్షిప్తతను నిలుపుతూ రెండు సమాంతర పాదాలుగా అమర్చాం; సందిగ్ధతను ప్రధాన పాఠంలో బలవంతంగా తొలగించకుండా పాదసూచికలో ప్రత్యామ్నాయ పఠనాలను ఇచ్చాం.
