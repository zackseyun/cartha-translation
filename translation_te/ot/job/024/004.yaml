- from: వారు నిరుపేదలను దారి నుంచి పక్కకు మళ్లిస్తారు[a]; దేశంలోని పేదలు[b] అందరూ కలిసి దాగిపోతారు[c].
  to: వారు నిరుపేదలను దారి నుంచి పక్కకు మళ్లిస్తారు[a]; కలిసి దేశంలోని పేదలు దాగి ఉంటారు[b].
  rationale: The revision removes the unwarranted ‘అందరూ’ and uses a passive/resultative Telugu expression for the Pual verb. The superseded footnote on ‘దాగిపోతారు’ is removed because the revised wording itself represents that passive/resultative sense and no longer requires a reflexive alternative note.
