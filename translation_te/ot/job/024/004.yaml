  text: יַטּ֣וּ אֶבְיוֹנִ֣ים מִ/דָּ֑רֶךְ יַ֥חַד חֻ֝בְּא֗וּ עֲנִיֵּי אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/024/004.yaml
  text: They turn the needy off the road[b][a]; together the poor of the land hide themselves.
translation:
  language: te
  text: వారు నిరుపేదలను దారి నుంచి పక్కకు మళ్లిస్తారు[a]; కలిసి దేశంలోని పేదలు దాగి ఉంటారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నిరుపేదలను మార్గం నుంచి తొలగిస్తారు.’
    reason: יַטּוּ ... מִדָּרֶךְ అనే పదబంధం భౌతికంగా దారి నుంచి పక్కకు మళ్లించడాన్నీ, విస్తృతంగా మార్గం నుంచి తొలగించడాన్నీ సూచించవచ్చు.
  - marker: b
    text: లేదా, ‘భూమిపై ఉన్న పేదలు.’
    reason: אֶרֶץ అనే పదానికి సందర్భానుసారం ‘దేశం/ప్రాంతం’ లేదా ‘భూమి’ అనే అర్థాలు రావచ్చు.
lexical_decisions:
- source_word: יַטּוּ
  choice: పక్కకు మళ్లిస్తారు
  rationale: נטה హిఫీల్ రూపంలోని ‘పక్కకు తిరిగేలా చేయడం/తొలగించడం’ అనే కారణార్థాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; సందర్భంలోని అణచివేతను అతిగా బలపరచకుండా మూలార్థానికి దగ్గరగా ఉంటుంది.
- source_word: אֶבְיוֹנִים
  choice: నిరుపేదలను
  rationale: אֶבְיוֹן ఆర్థికంగా, సామాజికంగా అవసరంలో ఉన్న బలహీనులను సూచిస్తుంది. తరువాతి עָנִיతో ఉన్న అర్థసామ్యాన్ని నిలుపుతూ స్వల్ప పదభేదాన్ని చూపుతుంది.
- source_word: מִדָּרֶךְ
  choice: దారి నుంచి
  rationale: מִן + דֶּרֶךְ యొక్క ప్రత్యక్షమైన ‘దారి/మార్గం నుంచి’ అనే భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: יַחַד
  choice: అందరూ కలిసి
  rationale: సమూహంగా ఒకే పరిస్థితికి లోనవుతున్నారనే సమష్టి భావాన్ని స్పష్టమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: חֻבְּאוּ
  choice: దాగిపోతారు
  rationale: חבא పుయల్ రూపం సూచించే దాగిన స్థితి లేదా ఒత్తిడివల్ల దాగవలసి రావడం అనే భావాన్ని సహజంగా తెలియజేస్తుంది; కర్తలు స్వచ్ఛందంగానే దాక్కున్నారని ఖచ్చితంగా నిర్ధారించదు.
- source_word: עֲנִיֵּי אָרֶץ
  choice: దేశంలోని పేదలు
  rationale: עָנִי యొక్క పేద/పీడిత భావాన్ని, אֶרֶץ యొక్క స్థానిక సామాజిక పరిధిని సహజంగా తెలియజేస్తుంది.
