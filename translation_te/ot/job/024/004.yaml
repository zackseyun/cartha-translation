translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యేలా సరళంగా, అయినా కవితాత్మక గాంభీర్యంతో రూపొందించబడింది. ‘నిరుపేదలు/పేదలు’ అనే భేదం మూలంలోని אֶבְיוֹנִים/עֲנִיֵּי పదభేదాన్ని సాధ్యమైనంతవరకు నిలుపుతుంది.
