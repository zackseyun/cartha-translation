id: JOB.24.19
reference: Job 24:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: צִיָּ֤ה גַם חֹ֗ם יִגְזְל֥וּ מֵֽימֵי שֶׁ֗לֶג שְׁא֣וֹל חָטָֽאוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/024/019.yaml
  text: Drought and heat also snatch away the waters of snow[b][a]; so Sheol takes those who have sinned.
translation:
  language: te
  text: కరవు, వేడి మంచు నుంచి వచ్చిన నీటిని లాక్కుంటాయి[a]; అలాగే షియోల్[b] పాపం చేసినవారిని లాక్కుంటుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా ‘మంచు నీళ్లు’; అంటే మంచు కరగడం వల్ల వచ్చే నీరు.
    reason: lexical_alternative
  - marker: b
    text: ‘షియోల్’ అనేది మృతుల లోకానికి వాడే హెబ్రీ పదం; ‘సమాధి’ లేదా ‘పాతాళం’ అని కూడా అనువదించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: צִיָּה
  choice: కరవు
  rationale: ఈ పదం పొడితనాన్ని లేదా వర్షాభావ పరిస్థితిని సూచిస్తుంది. వేడితో జతగా నీటిని హరించే శక్తిగా కవితాత్మకంగా వాడబడినందున ‘కరవు’ సహజమైన తెలుగు పదం.
- source_word: גַם
  choice: వేడి అనే రెండవ అంశాన్ని జతచేసే నిర్మాణం
  rationale: తెలుగులో ‘కరవు, వేడి’ అనే జంట ద్వారా హెబ్రీలోని జోడింపు సహజంగా వ్యక్తమవుతుంది; ప్రత్యేకంగా ‘కూడా’ చేరిస్తే వాక్యం కృత్రిమంగా వినిపించే అవకాశం ఉంది.
- source_word: חֹם
  choice: వేడి
  rationale: కరవుతో సమాంతరంగా ఉన్న సాధారణ నామవాచకానికి నేరమైన, సహజమైన అనువాదం.
- source_word: יִגְזְלוּ
  choice: లాక్కుంటాయి
  rationale: గזל్ ధాతువులోని బలవంతంగా తీసుకోవడం లేదా దోచుకోవడం అనే సజీవ చిత్రాన్ని, కరవు మరియు వేడి వంటి నిర్జీవ కర్తలతోనూ సహజంగా నిలుపుతుంది.
- source_word: מֵימֵי שֶׁלֶג
  choice: మంచు నుంచి వచ్చిన నీటిని
  rationale: అక్షరార్థంగా ‘మంచు నీళ్లు.’ తెలుగులో ‘మంచు నీళ్లు’ అంటే చల్లని నీరు అని అపార్థం కావచ్చు; అందువల్ల మూల చిత్రాన్ని కాపాడుతూ దాని సంబంధాన్ని స్పష్టంచేసే రూపం ఎంచుకోబడింది.
- source_word: שְׁאוֹל
  choice: షియోల్
  rationale: మృతుల లోకాన్ని సూచించే హెబ్రీ పదాన్ని లిప్యంతరీకరించడం ద్వారా దానిని కేవలం సమాధిగా లేదా తరువాతి కాలపు ‘నరకం’ భావనగా పరిమితం చేయకుండా మూలంలోని విస్తృతతను కాపాడుతుంది.
- source_word: חָטָאוּ
  choice: పాపం చేసినవారిని
  rationale: హెబ్రీలో ఇది ‘వారు పాపం చేశారు’ అనే బహువచన క్రియారూపం. రెండవ పాదంలోని సంక్షిప్త కవితా నిర్మాణంలో షియోల్ తీసుకుపోయే వారిని సూచిస్తున్నందున తెలుగులో ‘పాపం చేసినవారిని’ అని స్పష్టంగా ఇవ్వబడింది.
theological_decisions:
- issue: שְׁאוֹל అనే పదం యొక్క అర్థం
  choice: మృతుల లోకాన్ని సూచించే ‘షియోల్’ అనే హెబ్రీ పదాన్ని లిప్యంతరీకరించడం
  alternative: పాతాళం; సమాధి; మృతుల లోకం; మరణం
  rationale: ఈ కవితాత్మక పోలికలో మూలపదం అంతిమ శిక్షను ప్రత్యేకంగా పేర్కొనదు. ‘షియోల్’ అని ఉంచడం ద్వారా ‘నరకం’ వంటి మరింత నిర్దిష్టమైన తరువాతి సిద్ధాంతార్థాన్ని దిగుమతి చేయకుండా, సమాధి లేదా మృతుల లోకం మధ్య ఉన్న భావవ్యాప్తిని నిలుపుతుంది.
- issue: రెండవ పాదంలోని సంక్షిప్త క్రియా నిర్మాణం
  choice: మొదటి పాదంలోని ‘లాక్కుంటాయి’ అనే క్రియను రెండవ పాదంలో ఏకవచనంగా పునరుద్ధరించడం
  alternative: ‘షియోల్—పాపం చేసినవారు’ అనే అత్యంత అక్షరానుసారమైన, కానీ తెలుగులో అసంపూర్ణమైన నిర్మాణం
  rationale: హెబ్రీ కవిత్వం రెండవ పాదంలో క్రియను భావానుసారంగా వదిలివేస్తుంది. తెలుగులో అర్థవంతమైన వాక్యానికి దానిని ‘లాక్కుంటుంది’గా పునరుద్ధరించడం అవసరం; ‘అలాగే’ పోలికను వెల్లడిస్తుంది గాని కొత్త సిద్ధాంతార్థాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గంభీరమైన కవితా శైలి వాడబడింది. ‘మంచు నీళ్లు’ అనే పదబంధం తెలుగులో ‘చల్లని నీరు’గా అపార్థం కాకుండా ‘మంచు నుంచి వచ్చిన నీరు’ అని ఇచ్చాం. షియోల్ భావంలోని వేదాంతపరమైన విస్తృతతను నిలుపడానికి లిప్యంతరీకరణతో పాటు వివరణాత్మక పాదటిప్పణి ఇచ్చాం.
