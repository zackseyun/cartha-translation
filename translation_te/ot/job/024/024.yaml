translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదంగా మరియు సాధారణ పాఠకులకు అర్థమయ్యేలా అనువదించబడింది. హీబ్రూ వాక్యంలోని ఉన్నతి–అణచివేత వ్యతిరేకతను, అందరికీ కలిగే గతి అనే భావాన్ని, చివరి వ్యవసాయ ఉపమానాన్ని నిలుపుతూ అరుదైన క్రియల అనిశ్చితిని పాదటిప్పణుల్లో భద్రపరిచింది.
