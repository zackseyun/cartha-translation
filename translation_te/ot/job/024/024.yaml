  text: ר֤וֹמּוּ מְּעַ֨ט וְֽ/אֵינֶ֗/נּוּ וְֽ/הֻמְּכ֗וּ כַּ/כֹּ֥ל יִקָּפְצ֑וּ/ן וּ/כְ/רֹ֖אשׁ שִׁבֹּ֣לֶת יִמָּֽלוּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/024/024.yaml
  text: They are exalted a little while[a], and then they are gone; they are brought low; like all others they are gathered up[c][b], and like the head of a stalk of grain they are cut off.
translation:
  language: te
  text: వారు కొంతకాలం పైకెత్తబడతారు[a], ఆపై ఇక ఉండరు. వారు దిగజార్చబడి, అందరిలాగే తొలగించబడతారు[b]; ధాన్యపు కంకి పైభాగంలా కోయబడతారు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారు కొంతకాలం ఉన్నతస్థితిలో ఉంటారు.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “అందరిలాగే సమకూర్చబడతారు” లేదా “తీసుకుపోబడతారు.” ఇక్కడి హీబ్రూ క్రియ అరుదైనది; దాని కచ్చితమైన భావఛాయపై భిన్నాభిప్రాయాలు ఉన్నాయి.
    reason: lexical_alternative
  - marker: c
    text: అక్షరార్థంగా, “ధాన్యపు కంకి తలవలె.”
    reason: cultural_note
lexical_decisions:
- source_word: רֹמּוּ מְּעַט
  choice: కొద్దికాలం ఉన్నతస్థితిలో ఉంటారు
  rationale: רום అనే పదం ఎత్తైన లేదా ఉన్నతమైన స్థితిని సూచిస్తుంది; מעט తరువాత వచ్చే ‘ఇక ఉండరు’ అనే మాటతో కలిసి ఇక్కడ కాలపరంగా ‘కొద్దికాలం’ అనే భావాన్ని ఇస్తుంది. ఈ అనువాదం దుష్టులు కొంతకాలమే ప్రముఖ స్థితిలో ఉండడాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: וְאֵינֶנּוּ
  choice: ఆపై ఇక ఉండరు
  rationale: అక్షరార్థంగా ఏకవచన రూపం ఉన్నప్పటికీ, చుట్టూ ఉన్న బహువచన క్రియలతో ఇది ఒక్కొక్కరి విషయంలో వర్తించే విధంగా ఉంది. ‘ఇక ఉండరు’ అనే రూపం అదృశ్యం లేదా ఉనికి ముగింపును సూచించే హీబ్రూ నుడికారాన్ని నిలుపుతుంది.
- source_word: וְהֻמְּכוּ
  choice: వారు అణచివేయబడి
  rationale: ఈ నిష్క్రియ రూపం ముందున్న ఉన్నతస్థితికి వ్యతిరేకంగా దిగజార్చబడటం లేదా తక్కువ చేయబడటాన్ని సూచిస్తుంది. ‘అణచివేయబడి’ ఆ స్థితి మార్పును స్పష్టంగా చూపుతుంది.
- source_word: כַּכֹּל
  choice: అందరిలాగే
  rationale: כ మరియు כל కలయిక వారు సమస్త మానవులకు కలిగే సాధారణ గతినే పొందుతారని పోలికగా చెబుతుంది.
- source_word: יִקָּפְצוּן
  choice: తీసివేయబడతారు
  rationale: קפץ యొక్క ఈ రూపం అరుదైనది; సమకూర్చబడటం, మూయబడటం లేదా తొలగించబడటం అనే భావ ఛాయలు ప్రతిపాదించబడ్డాయి. సందర్భంలో మరణం ద్వారా తొలగింపును సహజంగా చెప్పేందుకు ‘తీసివేయబడతారు’ ఎంచుకోబడింది; అనిశ్చితిని పాదటిప్పణి తెలియజేస్తుంది.
- source_word: וּכְרֹאשׁ שִׁבֹּלֶת
  choice: ధాన్యపు కంకి తలలాగా
  rationale: שִׁבֹּלֶת ధాన్యపు కంకిని, רֹאשׁ దాని తలను లేదా పైభాగాన్ని సూచిస్తాయి. ‘ధాన్యపు కంకి తల’ కోత దృశ్యాన్ని ఆధునిక తెలుగు పాఠకునికి స్పష్టంగా ఉంచుతుంది.
- source_word: יִמָּלוּ
  choice: కోయబడతారు
  rationale: ధాన్యపు కంకి ఉపమానంలో ఈ క్రియ కోసివేయబడటాన్ని సూచిస్తుంది. మూలధాతువు, భావఛాయపై కొంత చర్చ ఉన్నందున ‘వాడిపోతారు’ అనే ప్రత్యామ్నాయం పాదటిప్పణిలో ఇవ్వబడింది.
