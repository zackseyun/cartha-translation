translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, కవితాత్మక గంభీరతను నిలుపుతూ సాధారణ పాఠకులకు అర్థమయ్యే పదజాలం వాడాం. క్లిష్టమైన హెబ్రీ వాక్యంలోని సంఖ్యాభేదం, ‘తేలిక/వేగం’ ద్వంద్వార్థం, చివరి పదబంధపు వ్యాఖ్యాన అస్పష్టతలను పాదటిప్పణుల్లో నిలిపాం.
