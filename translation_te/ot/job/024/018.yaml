  variant: modern standard Telugu
source:
  edition: WLC
  text: קַֽל ה֤וּא עַל פְּנֵי מַ֗יִם תְּקֻלַּ֣ל חֶלְקָתָ֣/ם בָּ/אָ֑רֶץ לֹֽא יִ֝פְנֶה דֶּ֣רֶךְ כְּרָמִֽים־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/024/018.yaml
  text: He is swift on the surface of the waters[a]; their portion in the land is cursed[c][b]; he does not turn toward the way of the vineyards.
translation:
  language: te
  text: అతడు జలాలపై వేగవంతుడు[a]; భూమిలో వారి వాటా శపించబడింది[b]; ద్రాక్షతోటల దారి వైపు అతడు తిరగడు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అతడు జలాల ఉపరితలంపై తేలికగా ఉన్నాడు.’ ఇక్కడి హెబ్రీ పాఠం కఠినమైనది; కొందరు ఈ మాటలను వేగానికి బదులు క్షణభంగురతను వర్ణించేవిగా భావిస్తారు.
    reason: lexical_alternative
  - marker: b
    text: హెబ్రీ పాఠం కఠినమైనది; ‘వారి వాటా’కు బదులు ‘అతని వాటా’ అని కూడా చదవవచ్చు.
    reason: textual_variant
  - marker: c
    text: లేదా, ‘అతడు ద్రాక్షతోటల రహదారి వైపు తిరగడు.’ అంటే అతడు ఇక సాగుభూమికి లేదా సౌభాగ్యవంతమైన ప్రదేశాలకు తిరిగి రాడని భావం కావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: קַל
  choice: వేగంగా సాగిపోతాడు
  rationale: మూల విశేషణానికి అక్షరార్థంగా ‘తేలికైనవాడు’ అనే భావం ఉన్నా, జలాలపై కదలిక సందర్భంలో వేగం లేదా క్షణభంగురతను సూచించవచ్చు. సహజమైన తెలుగుకోసం క్రియాత్మకంగా అనువదించి, ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: עַל־פְּנֵי מַיִם
  choice: జలాల ఉపరితలంపై
  rationale: ‘జలాల ముఖంపై’ అనే హెబ్రీయ నుడికారంలోని దృశ్యాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: תְּקֻלַּל
  choice: శపించబడింది
  rationale: פֻּעַל రూపంలోని నిష్క్రియార్థాన్ని నేరుగా తెలియజేస్తుంది; ‘తేలికగా ఎంచబడింది’ అనే మూలసంబంధమైన భావం సాధ్యమైనా, ఇక్కడ శాపార్థమే వాక్యనిర్మాణానికి సూటిగా సరిపోతుంది.
- source_word: חֶלְקָתָם
  choice: వారి భాగం
  rationale: ఇచ్చిన పాఠంలోని బహువచన ప్రత్యయాన్ని అనుసరిస్తుంది. ఏకవచన పఠనం సాధ్యమని పాదటిప్పణిలో తెలియజేశాం.
- source_word: בָּאָרֶץ
  choice: దేశంలోని
  rationale: ‘భాగం’తో కలిసి భూమిలోని వాటా లేదా స్వాస్థ్యాన్ని సూచించడానికి ‘దేశం’ సహజంగా సరిపోతుంది; ‘భూమిపై’ కూడా పదార్థపరంగా సాధ్యమే.
- source_word: לֹא יִפְנֶה
  choice: తిరగడు
  rationale: פנה అనే క్రియలోని ‘తిరుగు/వైపు మళ్ళు’ దృశ్యాన్ని నిలుపుతూ, ‘తిరిగి రాడు’ అనే మరింత వ్యాఖ్యానాత్మక భావాన్ని ప్రధాన పాఠంలో రుద్దదు.
- source_word: דֶּרֶךְ כְּרָמִים
  choice: ద్రాక్షతోటల దారి
  rationale: సమాస పదబంధాన్ని దగ్గరగా అనువదించి, అది తోటల గుండా వెళ్లే దారినా, వాటికి తీసుకెళ్లే దారినా అన్న అస్పష్టతను నిలుపుతుంది.
