translation:
  language: te
  text: వారు అనాథను రొమ్ము నుండి లాక్కుపోతారు[a]; పేదవాని నుండి తాకట్టు తీసుకుంటారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారు తల్లి రొమ్ము నుండి అనాథను దోచుకుపోతారు.” హెబ్రీ ప్రయోగం క్లిష్టంగా ఉంది; దుష్టులు పాలుతాగే అనాథ బిడ్డను కూడా బలవంతంగా తీసుకుపోతారనేది భావం.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִגְזְלוּ
  choice: లాక్కుపోతారు
  rationale: గזל క్రియ బలవంతంగా లేదా అన్యాయంగా తీసుకోవడాన్ని సూచిస్తుంది. సందర్భంలోని క్రూరత్వాన్ని ‘లాక్కుపోతారు’ సహజంగా వ్యక్తపరుస్తుంది.
- source_word: מִשֹּׁד
  choice: రొమ్ము దగ్గరనుండి
  rationale: ఈ క్లిష్టమైన హెబ్రీ రూపాన్ని సంప్రదాయంగా ‘రొమ్ము/ఒడి’ అనే భావంలో గ్రహిస్తారు. మూలంలోని సంక్షిప్తతను, అనిశ్చితిని కొంతవరకు నిలుపుతూ తెలుగులో అర్థమయ్యేలా అనువదించబడింది.
- source_word: יָתוֹם
  choice: అనాథను
  rationale: יָתוֹם సాధారణంగా తండ్రిలేని బిడ్డను లేదా అనాథను సూచిస్తుంది. ‘అనాథ’ సంక్షిప్తమైన, సహజమైన ఆధునిక తెలుగు పదం.
- source_word: וְעַל
  choice: దగ్గర
  rationale: חבל క్రియతో కలిసి עַל తాకట్టు ఎవరి నుండి తీసుకోబడుతుందో సూచిస్తుంది. తెలుగులో ‘పేదవాని దగ్గర’ సహజమైన ప్రయోగం.
- source_word: עָנִי
  choice: పేదవాని
  rationale: ఈ అప్పు-తాకట్టు సందర్భంలో עָנִי యొక్క ఆర్థిక భావమైన ‘పేదవాడు’ అత్యంత సముచితం.
- source_word: יַחְבֹּלוּ
  choice: తాకట్టు తీసుకుంటారు
  rationale: ఈ రూపంలో חבל అప్పుకు భద్రతగా తాకట్టు తీసుకోవడాన్ని సూచిస్తుంది. ‘తాకట్టు తీసుకుంటారు’ స్పష్టమైన, సాధారణ తెలుగు న్యాయ-ఆర్థిక ప్రయోగం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన శైలి. మొదటి పాదంలోని క్లిష్టమైన హెబ్రీ ప్రయోగాన్ని ప్రధాన పాఠంలో అతిగా వివరించకుండా, ప్రత్యామ్నాయాన్ని పాదటీపులో ఉంచాం.
