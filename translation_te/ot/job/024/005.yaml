language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: הֵ֤ן פְּרָאִ֨ים בַּֽ/מִּדְבָּ֗ר יָצְא֣וּ בְּ֭/פָעֳלָ/ם מְשַׁחֲרֵ֣י לַ/טָּ֑רֶף עֲרָבָ֥ה ל֥/וֹ לֶ֝֗חֶם לַ/נְּעָרִֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/024/005.yaml
  text: Look[a], like wild donkeys in the wilderness they go out to their work, seeking prey early; the desert is bread for him[b], for the children.
translation:
  language: te
  text: ఇదిగో, అడవిగాడిదల్లా వారు అరణ్యంలో తమ పనికి బయలుదేరుతారు; ఆహారం కోసం వేకువనే వెదకుతారు. ఎడారే అతనికి పిల్లల కోసం ఆహారం.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ‘అతనికి’ అని ఏకవచనం ఉంది. చివరి మాటను ‘పిల్లలు,’ ‘యువకులు,’ లేదా ‘చిన్నవారు’ అని అర్థం చేసుకోవచ్చు. ఈ పాదాన్ని ‘ఎడారి అతని పిల్లలకు ఆహారం’ లేదా ‘ఎడారి అతనికి, చిన్నవారికి ఆహారం’ అని కూడా అర్థం చేసుకోవచ్చు.
    reason: హీబ్రూలోని ఏకవచన לוֹ మరియు చివరి పదమైన נְעָרִים మధ్య సంబంధం పూర్తిగా నిర్దిష్టంగా లేకపోవడం వల్ల ఉన్న నిజమైన భావసందిగ్ధతను తెలియజేయడానికి.
lexical_decisions:
- source_word: הֵן
  choice: ఇదిగో
  rationale: దృశ్యంపై దృష్టి నిలిపే హీబ్రూ ఉద్ఘాటనను సహజమైన, గౌరవప్రదమైన తెలుగులో నిలుపుతుంది.
- source_word: פְּרָאִים
  choice: అడవిగాడిదల్లా
  rationale: అరణ్యంలో స్వేచ్ఛగా తిరిగే అడవిగాడిదలతో మనుషులను పోల్చే కవితాత్మక చిత్రాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: בַּמִּדְבָּר
  choice: అరణ్యంలో
  rationale: సాగుచేయని నిర్మానుష్య ప్రాంతమనే విస్తృత భావాన్ని ఇస్తుంది; తరువాతి עֲרָבָהతో పదభేదాన్నీ ఉంచుతుంది.
- source_word: יָצְאוּ בְּפָעֳלָם
  choice: తమ పనికి బయలుదేరుతారు
  rationale: జీవనోపాధి కోసం చేసే శ్రమను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: מְשַׁחֲרֵי לַטָּרֶף
  choice: ఆహారం కోసం వేకువనే వెదకుతారు
  rationale: שחר క్రియలోని తెల్లవారుజామున వెదకడం అనే కాలసూచనను, טֶרֶף యొక్క జీవనాధార ఆహార భావాన్ని కలిపి నిలుపుతుంది.
- source_word: עֲרָבָה
  choice: ఎడారి
  rationale: శుష్కమైన మైదానం లేదా స్టెప్పీ ప్రాంతాన్ని సాధారణ పాఠకునికి స్పష్టంగా అందిస్తుంది.
- source_word: לוֹ
  choice: అతనికి
  rationale: హీబ్రూలోని ఏకవచనాన్ని బహువచనంగా సవరించకుండా యథాతథంగా కాపాడుతుంది.
- source_word: לֶחֶם
  choice: ఆహారం
  rationale: మూలార్థం 'రొట్టె' అయినా ఇక్కడ ప్రాథమిక జీవనాధారాన్ని సూచిస్తుంది; తెలుగులో వాక్యచిత్రం సహజంగా ఉండేందుకు 'ఆహారం' ఎంచుకున్నాం.
- source_word: לַנְּעָרִים
  choice: పిల్లలకు
  rationale: ఆధారపడిన చిన్నవారిని సూచించే సందర్భార్థాన్ని లింగపరంగా అనవసరంగా పరిమితం చేయకుండా అందిస్తుంది.
theological_decisions:
- issue: అడవిగాడిదల చిత్రం మనుషులకా లేక నిజమైన జంతువులకా అనే కవితాత్మక సంబంధం
  choice: ‘అడవిగాడిదల్లా వారు’ అని ఉపమానంగా అనువదించబడింది
  alternative: ‘అడవిగాడిదలు అరణ్యంలో బయలుదేరినట్లు’ లేదా నిజమైన జంతువుల వర్ణనగా చదవడం
  rationale: అధ్యాయం పేదలు, అణగారినవారి కష్టాన్ని వర్ణిస్తున్నందున మానవ కర్తను నిలుపుతూ, ఉపమానంలోని కఠినమైన జీవన చిత్రాన్ని చెరపలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కవితాత్మక గంభీరతను ఉంచుతూ సాధారణ పాఠకునికి అర్థమయ్యే పదాలు వాడబడ్డాయి. ‘అరణ్యం’ మరియు ‘ఎడారి’ ద్వారా מִדְבָּר, עֲרָבָה మధ్యనున్న మూలపద భేదం సాధ్యమైనంతవరకు నిలుపబడింది.
