  text: חָתַ֥ר בַּ/חֹ֗שֶׁךְ בָּ֫תִּ֥ים יוֹמָ֥ם חִתְּמוּ לָ֗/מוֹ לֹא יָ֥דְעוּ אֽוֹר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/024/016.yaml
  text: In the dark they break into houses[a]; by day they shut themselves in[c][b]; they do not know the light.
translation:
  language: te
  text: చీకటిలో అతడు ఇళ్లకు కన్నం వేస్తాడు[a]; పగటివేళ వారు తమను తాము లోపలే మూసివేసుకుంటారు[b]; వెలుగు వారికి తెలియదు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘చీకటిలో అతడు ఇళ్ల గోడల్లో తవ్వి లోపలికి చొరబడతాడు.’ హీబ్రూ క్రియకు అక్షరార్థంగా తవ్వడం లేదా గోడలో దారి చేసుకోవడం అనే భావం ఉంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘పగటివేళ వారు తమను తాము మూసివేసుకుంటారు.’ హీబ్రూ పదబంధం తమను తాము మూసుకుని దాచుకోవడాన్ని, లేదా పగటివేళ కనబడకుండా ఉండడాన్ని నొక్కిచెప్పవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: ‘వెలుగు’ ప్రధానంగా పగటి వెలుగును సూచించవచ్చు; ఈ సందర్భంలో దుష్టులు బహిర్గతమయ్యేదాన్ని తప్పించుకోవడం అనే నైతిక ప్రతిధ్వని కూడా దీనిలో ఉండవచ్చు.
    reason: theological_ambiguity
lexical_decisions:
- source_word: חָתַר
  choice: కన్నం వేస్తాడు
  rationale: ఈ క్రియకు తవ్వడం, గోడను తొలిచి లోపలికి చొరబడడం అనే భావం ఉంది. దొంగతనం కోసం ఇంటి గోడను తొలిచే చర్యను ‘కన్నం వేయడం’ సహజమైన ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: בַּחֹשֶׁךְ
  choice: చీకటిలో
  rationale: చర్య జరిగే సమయాన్ని లేదా దాని రహస్య వాతావరణాన్ని నేరుగా తెలియజేస్తూ మూలంలోని చీకటి-వెలుగు వ్యత్యాసాన్ని నిలుపుతుంది.
- source_word: בָּתִּים
  choice: ఇళ్లకు
  rationale: బహువచనంలోని నివాస గృహాలను సూటిగా సూచిస్తుంది; ‘కన్నం వేయడం’తో తెలుగులో సహజంగా దత్తి విభక్తి వాడబడుతుంది.
- source_word: יוֹמָם
  choice: పగటివేళ
  rationale: రాత్రి చీకటికి విరుద్ధంగా పగటి సమయాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: חִתְּמוּ לָמוֹ
  choice: వారు తమను తాము లోపల మూసుకుంటారు
  rationale: חתם అనే ‘ముద్రవేయు, మూసివేయు’ భావాన్ని నిలుపుతూ, לָמוֹ వల్ల సందర్భంలో కనిపించే తమను తాము దాచుకొని లోపల ఉండే భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: לֹא יָדְעוּ אוֹר
  choice: వెలుగు వారికి తెలియదు
  rationale: ‘వెలుగును ఎరుగరు’ అనే మరింత కావ్యాత్మక రూపానికి బదులుగా సాధారణ పాఠకులకు అర్థమయ్యే ప్రస్తుత తెలుగు వాడుతూ, వెలుగుతో వారికి పరిచయం లేదా అనుబంధం లేదనే మూల జాతీయాన్ని అలాగే ఉంచుతుంది.
theological_decisions:
- issue: ‘వెలుగు’ అనే పదంలోని అక్షరార్థం మరియు నైతిక ప్రతీకార్థం
  choice: ప్రధాన పాఠంలో ‘వెలుగు’ అనే పదాన్నే ఉంచడం
  alternative: ‘పగటి వెలుగు’ లేదా ‘న్యాయం’ అని వ్యాఖ్యానాత్మకంగా అనువదించడం
  rationale: సందర్భంలో రాత్రివేళ నేరం చేయడం, పగటివేళ దాక్కోవడం ప్రధానంగా కనిపిస్తున్నాయి; అయినా జ్ఞానసాహిత్యంలో వెలుగుకు నైతిక ప్రతిధ్వని కూడా ఉండవచ్చు. ‘వెలుగు’ అని ఉంచడం ఈ రెండు అవకాశాల మధ్య ఉన్న ఉద్వేగాన్ని పరిష్కరించకుండా సంరక్షిస్తుంది.
- issue: మొదటి క్రియలో ఏకవచనం నుంచి తరువాతి క్రియల్లో బహువచనానికి మార్పు
  choice: ‘అతడు’ నుంచి ‘వారు’కు మారే మూల వచనభేదాన్ని నిలుపడం
  alternative: వాక్యమంతా ‘వారు’ అని ఏకరీతిగా చేయడం
  rationale: హీబ్రూ పాఠంలో חָתַר ఏకవచనంలో, חִתְּמוּ మరియు יָדְעוּ బహువచనంలో ఉన్నాయి. దీనిని సమతలపరచకుండా ఉంచడం మూలంలోని వ్యక్తి నుంచి ఆ వర్గమంతటికీ జరిగే భావమార్పును సంరక్షిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘కన్నం వేయడం’ సాధారణ పాఠకులకు తెలిసిన దొంగతన సంబంధిత నుడికారం. మూలంలోని ఏకవచనం నుంచి బహువచనానికి మార్పు ఉద్దేశపూర్వకంగా నిలుపబడింది; పాదాల మధ్య చీకటి, పగలు, వెలుగు అనే కావ్య వ్యత్యాసం కాపాడబడింది.
