source:
  edition: WLC
  text: בַּ֭/שָּׂדֶה בְּלִיל֣/וֹ יקצירו וְ/כֶ֖רֶם רָשָׁ֣ע יְלַקֵּֽשׁוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/024/006.yaml
  text: In the field they harvest fodder[c][b][a], and they glean in the vineyard of the wicked.
translation:
  language: te
  text: 'పొలంలో పశుమేతను[a] వారు కోస్తారు;

    దుష్టుని[b] ద్రాక్షతోటలో[c] పరిగె ఏరుతారు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మిశ్రమ పశుమేతను’ లేదా ‘అతని పశుమేతను.’ హీబ్రూ పదం సాధారణ మానవ ధాన్యాన్ని కాకుండా పశువుల మేతను సూచిస్తుంది; ‘అతని’ అనే స్వామ్యసూచనకు పూర్వపదం స్పష్టంగా లేదు.
    reason: lexical_alternative
  - marker: b
    text: ‘దుష్టుని’ అనేది సాధారణంగా దుష్టుడైన యజమానిని సూచించవచ్చు; లేదా, ‘ఒక దుష్టుని’ అని అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘దుష్టుని ద్రాక్షతోటను పరిగె ఏరుతారు.’ రెండో భాగంలో ‘లో’ అనే స్థలసూచక పదం హీబ్రూలో స్పష్టంగా లేదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּשָּׂדֶה
  choice: పొలంలో
  rationale: ב־ ఉపసర్గ ఇక్కడ స్థలార్థకంగా ఉంది. ఆధునిక తెలుగులో ‘పొలంలో’ సహజంగా, సంక్షిప్తంగా ఉంటుంది.
- source_word: בְּלִילוֹ
  choice: అతని పశుమేతను
  rationale: בְּלִיל అనేది సాధారణ ధాన్యాన్ని కాకుండా కలిపిన పశువుల మేతను సూచిస్తుంది. 3వ పురుష ఏకవచన స్వామ్య ప్రత్యయాన్ని ‘అతని’గా ఉంచి, మూలంలోని అస్పష్టమైన పూర్వపద సంబంధాన్ని నిలిపాం.
- source_word: יקצירו
  choice: వారు కోస్తారు
  rationale: קצר అంటే పంటను కోయడం లేదా కోత కోయడం. పశుమేత సందర్భంలో ‘కోస్తారు’ ఆధునిక తెలుగులో సహజం.
- source_word: וְכֶרֶם
  choice: ద్రాక్షతోటలో
  rationale: హీబ్రూలో రెండో భాగంలో స్థలార్థక ఉపసర్గ మళ్లీ లేదు. అయితే ‘పరిగె ఏరుతారు’ అనే తెలుగు ప్రయోగానికి స్థలాన్ని ‘లో’తో చెప్పడం సహజం; ఈ వ్యాకరణ భేదాన్ని పాదసూచికలో తెలిపాం.
- source_word: רָשָׁע
  choice: దుష్టుని
  rationale: ఏకవచన విశేషణం నామవాచకంగా వాడబడింది. ‘దుష్టుని’ అనేది ఒక నిర్దిష్ట పురుషుణ్ణి అతిగా నిర్ధారించకుండా, దుష్టుడైన యజమాని అనే సాధ్యమైన భావాన్ని నిలుపుతుంది.
- source_word: יְלַקֵּשׁוּ
  choice: పరిగె ఏరుతారు
  rationale: לקשׁ యొక్క పియేల్ రూపం కోత తర్వాత మిగిలిన పంటను లేదా ఆలస్యంగా లభించే పంటను ఏరడాన్ని సూచిస్తుంది. వ్యవసాయ సందర్భంలో ‘పరిగె ఏరుతారు’ సంక్షిప్తమైన, సాంప్రదాయబద్ధమైన తెలుగు ప్రయోగం.
