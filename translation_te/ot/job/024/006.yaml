translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కవితాత్మక సమాంతర నిర్మాణాన్ని ఉంచాం. ‘పశుమేత’ సాధారణ పాఠకులకు స్పష్టంగా ఉండగా, ‘పరిగె ఏరడం’ కోత తర్వాత మిగిలిన పంటను ఏరే వ్యవసాయ చర్యను సంక్షిప్తంగా తెలియజేస్తుంది. మూలంలోని ‘అతని’ అనే అస్పష్ట స్వామ్య సంబంధాన్ని ప్రధాన పాఠ్యంలోనే నిలిపి, ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
