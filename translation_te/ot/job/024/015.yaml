  text: וְ/עֵ֤ין נֹאֵ֨ף שָׁ֤מְרָֽה נֶ֣שֶׁף לֵ֭/אמֹר לֹא תְשׁוּרֵ֣/נִי עָ֑יִן וְ/סֵ֖תֶר פָּנִ֣ים יָשִֽׂים׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/024/015.yaml
  text: The eye of the adulterer waits for twilight[a], saying, ‘No eye will see me’[b]; and he puts a covering over his face.
translation:
  language: te
  text: వ్యభిచారి కన్ను సంధ్యవేళ కోసం కాచుకుంటుంది[a], ‘ఏ కన్నూ నన్ను చూడదు’ అని అతడు అనుకుంటాడు; అతడు తన ముఖానికి ముసుగు వేసుకుంటాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మసకవేళ కోసం.’ హీబ్రూ పదం వెలుతురు మసకబారే సంధ్యను సూచిస్తుంది; ఈ సందర్భంలో అది సాయంకాలపు సంధ్యను సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘ముఖపు మరుగును పెడతాడు.’ గుర్తుపట్టకుండా ఉండేందుకు అతడు తన ముఖాన్ని కప్పుకోవడం లేదా దాచుకోవడం అనే భావం.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵין
  choice: కన్ను
  rationale: రెండు చోట్లా ఉన్న ‘కన్ను’ అనే స్పష్టమైన దృశ్యరూపాన్ని నిలుపుతుంది; మొదటి వాక్యంలో వ్యక్తిని అతని కన్నుతో సూచించే హీబ్రూ ప్రయోగాన్ని కూడా సంరక్షిస్తుంది.
- source_word: נֹאֵף
  choice: వ్యభిచారి
  rationale: పురుష ఏకవచన కృదంతం వ్యభిచారం చేసే వ్యక్తిని సూచిస్తుంది; ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన, సహజమైన పదం.
- source_word: שָׁמְרָה
  choice: కోసం కాచుకుంటూ
  rationale: మూల క్రియలోని కాపాడటం/గమనిస్తూ ఉండటం అనే భావాన్ని, చీకటి వచ్చేదాకా ఎదురుచూసే సందర్భార్థంతో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: נֶשֶׁף
  choice: సంధ్యవేళ
  rationale: వెలుతురు మసకబారే పగలు-రాత్రి సంధిని సూచిస్తుంది; సాయంకాలపు మసకవేళ అనే సందర్భార్థాన్ని అతిగా నిర్దిష్టం చేయదు.
- source_word: לֵאמֹר
  choice: అని అంటుంది
  rationale: మాటను లేదా అంతరంగ ఆలోచనను పరిచయం చేసే మూలంలోని సౌలభ్యాన్ని నిలుపుతుంది; వ్యాకరణపరంగా ‘కన్ను’తో అనుసంధానిస్తుంది.
- source_word: תְשׁוּרֵנִי
  choice: నన్ను చూడదు
  rationale: ‘చూడటం/తేరి చూడటం’ అనే భావాన్ని సహజమైన తెలుగులో ఇస్తూ, ఎవరికీ కనిపించకూడదనే ఇతివృత్తాన్ని నిలుపుతుంది.
- source_word: וְסֵתֶר פָּנִים
  choice: తన ముఖాన్ని మరుగుపరచుకుంటాడు
  rationale: హీబ్రూలోని సంక్షిప్తమైన ‘ముఖపు మరుగు’ ప్రయోగాన్ని గుర్తుపట్టకుండా ముఖాన్ని దాచుకోవడమనే సహజ తెలుగు భావంలో అందిస్తుంది.
- source_word: יָשִׂים
  choice: మరుగుపరచుకుంటాడు
  rationale: అక్షరార్థంగా ‘పెడతాడు/ఉంచుతాడు’; ముఖానికి మరుగు ఏర్పరచుకోవడం అనే సందర్భంలో తెలుగు ప్రతికర్తృక రూపం సహజంగా ఉంటుంది.
