- from: వ్యభిచారి కన్ను సంధ్యవేళ కోసం కాచుకుంటూ[a], ‘ఏ కన్నూ నన్ను చూడదు’ అని అంటుంది; అతడు తన ముఖాన్ని మరుగుపరచుకుంటాడు[b].
  to: వ్యభిచారి కన్ను సంధ్యవేళ కోసం కాచుకుంటుంది[a], ‘ఏ కన్నూ నన్ను చూడదు’ అని అతడు అనుకుంటాడు; అతడు తన ముఖానికి ముసుగు వేసుకుంటాడు[b].
  rationale: The revision preserves the Hebrew’s ‘eye of the adulterer’ imagery and the ambiguity of twilight, while making the adulterer—not his eye—the natural Telugu subject of the quoted thought. It also renders the final compressed Hebrew expression with the idiomatic concrete image of putting on a face-covering. Footnote a has been adjusted so that its explanatory wording does not make the evening sense lexically exclusive.
