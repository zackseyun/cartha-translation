source:
  edition: WLC
  text: וְ/עַתָּ֗ה עָ֭לַ/י תִּשְׁתַּפֵּ֣ךְ נַפְשִׁ֑/י יֹ֭אחֲז֣וּ/נִי יְמֵי עֹֽנִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/030/016.yaml
  text: And now my soul is poured out within me[a]; days of affliction seize me.
translation:
  language: te
  text: ఇక ఇప్పుడు నా ప్రాణం నాలోనే ఒలికిపోతోంది[a]; బాధ దినాలు నన్ను పట్టిపీడిస్తున్నాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నా ప్రాణం నా మీద ఒలికిపోతోంది.’ హీబ్రూలో పూర్వప్రత్యయం అక్షరార్థంగా ‘నా మీద’ అని ఉంది; ఈ వ్యక్తీకరణ అంతరంగ క్షీణతను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: ఇప్పుడు
  rationale: ఇది మునుపటి స్థితికి భిన్నమైన యోబు ప్రస్తుత దుస్థితిని పరిచయం చేసే కాలసూచకం. తెలుగులో ‘ఇప్పుడు’ సహజంగా ఉండి, సందర్భంలోని వ్యత్యాసాన్ని అతిగా స్పష్టీకరించదు.
- source_word: עָלַי
  choice: నాలో
  rationale: హీబ్రూ పూర్వప్రత్యయం అక్షరార్థంగా ‘నా మీద’ అయినా, נפשי మరియు ‘కుమ్మరించబడుతోంది’ అనే రూపకంతో కలిసి ఇక్కడ అంతరంగ క్షీణతను సూచిస్తుంది. సహజమైన తెలుగులో ‘నాలో’ ఆ భావాన్ని అందిస్తుంది; అక్షరార్థ ప్రత్యామ్నాయం పాదసూచికలో నిలుపబడింది.
- source_word: תִּשְׁתַּפֵּךְ
  choice: కుమ్మరించబడుతోంది
  rationale: שפך క్రియలోని పోయడం లేదా కుమ్మరించడం అనే కవితాత్మక రూపకాన్ని నిలుపుతూ, కొనసాగుతున్న అంతరంగ నిస్సత్తువను తెలియజేస్తుంది.
- source_word: נַפְשִׁי
  choice: నా ప్రాణం
  rationale: נפש ఇక్కడ జీవం, అంతరంగ స్వరూపం రెండింటినీ సూచించగలదు. ఆధునిక తెలుగు బైబిలు కవితా సందర్భంలో ‘ప్రాణం’ సహజంగా ఉండి ఆ అర్థవిస్తృతిని కొంతవరకు నిలుపుతుంది.
- source_word: יֹאחֲזוּנִי
  choice: నన్ను పట్టుకున్నాయి
  rationale: אחז అంటే బలంగా పట్టుకోవడం లేదా స్వాధీనపరచుకోవడం. దుఃఖపు రోజులు యోబును విడువకుండా ఆవరించాయనే కవితాత్మక వ్యక్తీకరణను ఇది సహజంగా అందిస్తుంది.
- source_word: יְמֵי עֹנִי
  choice: దుఃఖపు రోజులు
  rationale: עֹנִי ఇక్కడ పేదరికానికి మాత్రమే పరిమితం కాకుండా బాధ, దైన్యం, కష్టస్థితిని సూచిస్తుంది. ‘దుఃఖపు రోజులు’ సాధారణ పాఠకులకు సహజంగా ఉండి విస్తృత వేదనను తెలియజేస్తుంది.
