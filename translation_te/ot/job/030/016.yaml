revisions:
- from: ఇప్పుడు నా ప్రాణం నాలో కుమ్మరించబడుతోంది[a]; దుఃఖపు రోజులు నన్ను పట్టుకున్నాయి.
  to: ఇక ఇప్పుడు నా ప్రాణం నాలోనే ఒలికిపోతోంది[a]; బాధ దినాలు నన్ను పట్టిపీడిస్తున్నాయి.
  rationale: The revision removes an unintended passive-agent implication, gives the second clause an ongoing present sense, and uses idiomatic modern Telugu while preserving the Hebrew metaphor and the footnoted literal alternative for עלי.
  reviewer_model: gpt-5.6-terra
