review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents the temporal marker, נפשׁ, and the image of affliction-days taking hold of Job. However, the passive wording ‘కుమ్మరించబడుతోంది’ can imply an unnamed external agent, whereas the Hebrew Hitpael presents Job’s soul/life as pouring itself out. The completed aspect in ‘పట్టుకున్నాయి’ also weakens the Hebrew imperfect’s present, ongoing force.
  naturalness: ‘నా ప్రాణం నాలో కుమ్మరించబడుతోంది’ is grammatically possible but unnatural in modern Telugu. ‘నా ప్రాణం నాలోనే ఒలికిపోతోంది’ is more idiomatic while retaining the poetic image of depletion. ‘పట్టిపీడిస్తున్నాయి’ naturally expresses the ongoing, personified grip of the days of affliction.
  terminology: ‘ప్రాణం’ suitably preserves the broad poetic sense of נפשׁ. ‘బాధ దినాలు’ conveys ימי עני without narrowing it to economic poverty or reducing it merely to emotional sadness. The footnote retains the literal spatial alternative ‘నా మీద.’
  issues:
  - severity: medium
    issue: Passive verbal form for תשתפך
    rationale: ‘కుమ్మరించబడుతోంది’ suggests that something or someone pours the soul out. The Hebrew reflexive stem more naturally depicts the soul/life itself as being emptied or pouring away.
  - severity: medium
    issue: Completed aspect in the second clause
    rationale: ‘నన్ను పట్టుకున్నాయి’ reads as a completed past action, while the Hebrew imperfect, supported by the parallel present depiction, is best rendered as an ongoing present action.
  revised_text: ఇక ఇప్పుడు నా ప్రాణం నాలోనే ఒలికిపోతోంది[a]; బాధ దినాలు నన్ను పట్టిపీడిస్తున్నాయి.
  revised_footnotes:
  - marker: a
    text: లేదా, ‘నా ప్రాణం నా మీద ఒలికిపోతోంది.’ హీబ్రూలో పూర్వప్రత్యయం అక్షరార్థంగా ‘నా మీద’ అని ఉంది; ఈ వ్యక్తీకరణ అంతరంగ క్షీణతను సూచించవచ్చు.
    reason: lexical_alternative
  revision_rationale: The revision removes an unintended passive-agent implication, gives the second clause an ongoing present sense, and uses idiomatic modern Telugu while preserving the Hebrew metaphor and the footnoted literal alternative for עלי.
