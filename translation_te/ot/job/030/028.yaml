translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన విలాప శైలి వాడబడింది. హీబ్రూ కవిత్వంలోని సజీవ వర్తమాన భావం నిలుపబడింది; ‘నల్లబడి’ అనే పదంలోని శారీరక రూపం–దుఃఖం అనే ద్వంద్వసూచన పాదటిప్పణిలో భద్రపరచబడింది.
