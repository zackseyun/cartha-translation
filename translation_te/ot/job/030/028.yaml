source:
  edition: WLC
  text: קֹדֵ֣ר הִ֭לַּכְתִּי בְּ/לֹ֣א חַמָּ֑ה קַ֖מְתִּי בַ/קָּהָ֣ל אֲשַׁוֵּֽעַ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/030/028.yaml
  text: I go about darkened[a], but not by the sun[b]; I stand up in the assembly and cry for help.
translation:
  language: te
  text: నేను నల్లబడి[a] తిరుగుతున్నాను—సూర్యునివల్ల కాదు[b]; సభలో లేచి సహాయం కోసం మొరపెడుతున్నాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘దుఃఖిస్తూ’ / ‘కారిపోయి.’ హీబ్రూ పదం దుఃఖాన్నీ, నల్లబడిన రూపాన్నీ సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘సూర్యునివల్ల కాదు.’ అతని నల్లబడిన స్థితి సూర్యరశ్మి తగలడం వల్ల కలిగింది కాదని భావం.
    reason: lexical_alternative
lexical_decisions:
- source_word: קֹדֵר
  choice: నల్లబడి
  rationale: ఈ హీబ్రూ పదం చీకటి లేదా నలుపు రంగు పట్టిన రూపాన్ని, అలాగే దుఃఖస్థితిని సూచించగలదు. ‘నల్లబడి’ శారీరక రూపం మరియు అంతర్గత వేదన రెండింటి ప్రతిధ్వనినీ పూర్తిగా ఒక దిశకు పరిమితం చేయకుండా ఉంచుతుంది.
- source_word: הִלַּכְתִּי
  choice: తిరుగుతున్నాను
  rationale: కావ్య విలాపంలో యోబు కొనసాగుతున్న స్థితిని సజీవంగా తెలపడానికి తెలుగు వర్తమాన కొనసాగింపు సహజంగా ఉంటుంది; ‘తిరుగు’ కేవలం ఒకసారి నడవడంకన్నా అతని జీవనస్థితిని సూచిస్తుంది.
- source_word: בְּלֹא חַמָּה
  choice: అది ఎండవల్ల కాదు
  rationale: חַמָּה సూర్యుణ్ణి లేదా సూర్యవేడిని సూచిస్తుంది. ఇక్కడ నల్లబడిన స్థితికి ఎండ కారణం కాదనే వ్యత్యాసాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తూ, కారణసంబంధాన్ని నిలుపుతుంది.
- source_word: קַמְתִּי
  choice: లేచి
  rationale: సమకూడిన ప్రజల మధ్య యోబు బహిరంగంగా లేచి తన మొరను వినిపించడాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: בַקָּהָל
  choice: సభలో
  rationale: קהל సమకూడిన ప్రజల సమూహాన్ని సూచిస్తుంది. ‘సభ’ ఆధునిక తెలుగులో స్పష్టంగా ఉండి, ప్రత్యేక మతసంస్థ భావాన్ని అనవసరంగా చేర్చదు.
- source_word: אֲשַׁוֵּעַ
  choice: సహాయం కోసం మొరపెడుతున్నాను
  rationale: שוע తీవ్రమైన సహాయవిన్నపాన్ని సూచిస్తుంది. ‘మొరపెట్టు’ విలాపంలోని ఆర్తిని, ‘సహాయం కోసం’ ఆ మొర ఉద్దేశాన్ని స్పష్టంగా తెలియజేస్తాయి.
