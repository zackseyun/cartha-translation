source:
  edition: WLC
  text: הָהְפַּ֥ךְ עָלַ֗/י בַּלָּ֫ה֥וֹת תִּרְדֹּ֣ף כָּ֭/רוּחַ נְדִבָתִ֑/י וּ֝/כְ/עָ֗ב עָבְרָ֥ה יְשֻׁעָתִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/job/030/015.yaml
  text: Terrors are turned upon me[a]; they pursue my nobility like the wind[b], and my salvation passes away like a cloud.
translation:
  language: te
  text: భయంకరమైనవి నా మీదికి మళ్లాయి; అవి గాలిలా నా ఘనతను[a] తరుముతున్నాయి; నా రక్షణ[b] మేఘంలా కనుమరుగైపోయింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘నా ఔన్నత్యాన్ని,’ ‘నా గౌరవాన్ని,’ లేదా ‘నా సౌభాగ్యాన్ని.’ హీబ్రూ పదం ఉన్నతమైన లేదా గౌరవనీయమైన స్థితిని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘నా విడుదల’ లేదా ‘నా క్షేమం.’ హీబ్రూ పదం రక్షణతో పాటు అపాయం నుంచి విడుదలను లేదా క్షేమాన్ని కూడా సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָהְפַּךְ
  choice: మళ్లాయి
  rationale: హోఫల్ రూపంలోని నిష్క్రియ/ఫలిత భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; తరువాతి బహువచన భావానికి అనుగుణంగా వాక్యాన్ని బహువచనంలో నిర్మించాం.
- source_word: בַּלָּהוֹת
  choice: భయంకరమైనవి
  rationale: ఆకస్మిక భయోత్పాతాలు లేదా భయంకర విషయాలు అనే భావాన్ని, అనవసరంగా నిర్దిష్టీకరించకుండా సాధారణ ఆధునిక తెలుగులో ఇస్తుంది.
- source_word: תִּרְדֹּף
  choice: అవి … తరుముతున్నాయి
  rationale: רדף యొక్క ‘వెంబడించు/తరుము’ భావాన్ని నిలుపుతుంది. హీబ్రూలో క్రియ స్త్రీలింగ ఏకవచనమైనా, ముందున్న బహువచన నామవాచకాన్ని సమష్టిగా సూచించగలదు; తెలుగులో సహజంగా బహువచనం వాడాం.
- source_word: כָּרוּחַ
  choice: గాలిలా
  rationale: వేగంగా తరిమివేయబడటం లేదా నిలకడ లేకపోవడం అనే కవితాత్మక ఉపమానాన్ని కాపాడుతుంది; తరువాతి ‘మేఘంలా’ అనే సమాంతర చిత్రంతో సరిపోతుంది.
- source_word: נְדִבָתִי
  choice: నా ఘనతను
  rationale: ఉన్నతమైన లేదా గౌరవనీయమైన స్థితిని సూచించే క్లిష్ట పదానికి ‘ఘనత’ సహజమైన, గౌరవభరితమైన సమానార్థం. ఇతర సాధ్యార్థాలను పాదటిప్పణిలో ఉంచాం.
- source_word: וּכְעָב
  choice: మేఘంలా
  rationale: עָב అనే పదంలోని ‘మేఘం’ భావాన్ని సంక్షిప్తంగా, కవితాత్మకంగా అందిస్తుంది.
- source_word: עָבְרָה
  choice: గతించిపోయింది
  rationale: ఇక్కడ సందర్భానుసారంగా ‘దాటిపోయింది/అదృశ్యమైంది’ అనే నష్టం, అంతర్ధాన భావాన్ని తెలియజేస్తుంది.
- source_word: יְשֻׁעָתִי
  choice: నా రక్షణ
  rationale: ישועה యొక్క మూల రక్షణ/విడుదల భావాన్ని నిలుపుతూ, ఈ సందర్భంలో తరువాతి సిద్ధాంతపరమైన ప్రత్యేక అర్థాన్ని బలవంతంగా మోపకుండా ఉంటుంది.
theological_decisions:
- issue: יְשֻׁעָתִי అనే పదాన్ని సిద్ధాంతపరంగా అతిగా అర్థం చేసుకునే అవకాశం
  choice: నా రక్షణ
  alternative: నా విడుదల; నా క్షేమం
  rationale: ఇక్కడ పదం వ్యక్తిగత అపాయం నుంచి రక్షణను లేదా క్షేమాన్ని సూచించవచ్చు; తరువాతి కాలపు సంపూర్ణ రక్షణ సిద్ధాంతార్థాన్ని సందర్భంపై మోపకుండా విస్తృత మూలార్థాన్ని ఉంచాం.
- issue: נְדִבָתִי యొక్క అనిశ్చిత భావపరిధి
  choice: నా ఘనతను
  alternative: నా ఔన్నత్యాన్ని; నా గౌరవాన్ని; నా సౌభాగ్యాన్ని
  rationale: యోబు కోల్పోయిన గౌరవస్థితిని ‘ఘనత’ బాగా సూచిస్తుంది; అయితే హీబ్రూ పదం ఔన్నత్యం, గౌరవం లేదా సౌభాగ్యాన్ని కూడా సూచించగలదనే సందిగ్ధతను పాదటిప్పణిలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన కవితా శైలి. హీబ్రూ వాక్యంలోని మూడు భాగాల సమాంతర నిర్మాణాన్ని అర్థసహితంగా నిలిపాం; క్లిష్ట పదాల సందిగ్ధతను ప్రధాన పాఠ్యంలో బలవంతంగా పరిష్కరించకుండా పాదటిప్పణుల్లో చూపించాం.
