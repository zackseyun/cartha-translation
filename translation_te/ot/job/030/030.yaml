translation:
  language: te
  text: నా చర్మం నల్లబడి నా మీదనుండి ఊడిపోతోంది[a]; నా ఎముకలు వేడితో మండుతున్నాయి[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నా చర్మం నా మీద నల్లబడింది.’ హీబ్రూ మాటలు చర్మం నల్లబడి ఊడిపోవడాన్ని గానీ, శరీరంపై నల్లగా వేలాడుతుండడాన్ని గానీ సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘నా ఎముకలు జ్వరంతో మండుతున్నాయి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: עוֹרִי
  choice: నా చర్మం
  rationale: עוֹר మానవ శరీర సందర్భంలో సహజంగా ‘చర్మం’ అని అర్థమవుతుంది.
- source_word: שָׁחַר
  choice: నల్లబడి
  rationale: ఈ క్రియ చర్మం నల్లగా లేదా ముదురు రంగుగా మారడాన్ని సూచిస్తుంది; ‘నల్లబడి’ ఫలితస్థితిని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: מֵעָלָי
  choice: నా మీదనుండి ఊడిపోతోంది
  rationale: అక్షరార్థం ‘నా మీదనుండి.’ వ్యాధిగ్రస్తమైన చర్మం సందర్భంలో అది శరీరం నుండి ఊడిపోవడాన్ని సూచించే అవకాశాన్ని ప్రధాన పాఠంలో సహజంగా వ్యక్తం చేశాం; మూలంలోని అనిశ్చితిని పాదటిప్పణిలో ఉంచాం.
- source_word: וְעַצְמִי
  choice: నా ఎముకలు
  rationale: ఏకవచన రూపం ఇక్కడ సమూహార్థకంగా ఉండవచ్చు; తెలుగులో ‘నా ఎముకలు’ శరీర వేదనను సహజంగా తెలియజేస్తుంది.
- source_word: חָרָה
  choice: మండుతున్నాయి
  rationale: חָרָהలోని కాలడం లేదా రగలడం అనే బలమైన దృశ్యాన్ని ‘మండుతున్నాయి’ నిలుపుతుంది.
- source_word: מִנִּי חֹרֶב
  choice: వేడితో
  rationale: חֹרֶב వేడి లేదా ఎండదనాన్ని సూచిస్తుంది; శరీర సందర్భంలో ‘వేడితో’ విస్తృతమైన, తక్కువ వ్యాఖ్యానాత్మకమైన ఎంపిక.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యేలా గంభీరమైన శైలిని వాడాం. శరీర బాధను తెలిపే మూలంలోని స్పష్టమైన దృశ్యభాషను నిలిపి, מֵעָלָי మరియు חֹרֶבలోని అర్థసంభావ్యతలను పాదటిప్పణుల్లో సంరక్షించాం.
