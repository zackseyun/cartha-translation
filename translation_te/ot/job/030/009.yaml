  text: And now I have become their song[b][a], and I am a byword to them.
translation:
  language: te
  text: ఇప్పుడు నేను వారి పాటగా మారాను[a]; వారికి నేను ఒక సామెతగా అయ్యాను[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వారి ఎగతాళి పాటగా.’ సందర్భంలో ‘వారి పాట’ అవహేళన భావాన్ని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘వారికి నానుడిగా’ లేదా ‘వారు చెప్పుకునే మాటగా.’ ఇక్కడి హీబ్రూ పదం ఒకరి గురించి చెప్పబడే మాటను సూచిస్తుంది; ఈ సందర్భంలో అది తృణీకార భావాన్ని కలిగి ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: కానీ ఇప్పుడు
  rationale: ముందటి గౌరవస్థితికి ఇప్పటి అవమానస్థితికి మధ్య ఉన్న వ్యత్యాసాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది; וְ సంధికారకంలోని సందర్భానుగుణ విరుద్ధ భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: נְגִינָתָם
  choice: వారి పాటగా
  rationale: נְגִינָה అనే పదానికి ప్రాథమికంగా ‘పాట, సంగీతరచన’ అనే అర్థం ఉంది. సందర్భంలో అది ఎగతాళి పాటను సూచించినా, ప్రధాన పాఠంలో మూలంలోని సంక్షిప్తతను నిలిపి, ఆ భావాన్ని పాదటిప్పణిలో సూచించాం.
- source_word: הָיִיתִי
  choice: మారాను
  rationale: పూర్తయిన క్రియ వల్ల ఏర్పడిన ప్రస్తుత అవమానస్థితిని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: וָאֱהִי לָהֶם לְמִלָּה
  choice: వారు చెప్పుకునే మాటగా అయ్యాను
  rationale: מִלָּה యొక్క ప్రాథమిక ‘మాట/చెప్పబడే విషయం’ భావాన్ని నిలుపుతూ, యోబు వారి అవహేళనాత్మక సంభాషణకు విషయమయ్యాడనే సందర్భార్థాన్ని సహజంగా వ్యక్తం చేస్తుంది.
