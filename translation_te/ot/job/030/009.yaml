translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన శైలి. సమాంతర వాక్య నిర్మాణాన్ని నిలిపి, మూలంలోని ‘పాట’ మరియు ‘మాట’ రూపకాలను సంరక్షించాం.
