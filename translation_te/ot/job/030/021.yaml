  edition: WLC
  text: תֵּהָפֵ֣ךְ לְ/אַכְזָ֣ר לִ֑/י בְּ/עֹ֖צֶם יָדְ/ךָ֣ תִשְׂטְמֵֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/job/030/021.yaml
  text: You have turned cruel to me[b][a]; with the might of your hand you oppose me.
translation:
  language: te
  text: నీవు నాపట్ల క్రూరంగా మారిపోయావు[a]; నీ చేతి బలంతో నన్ను విరోధిస్తున్నావు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నీవు నాపట్ల కనికరంలేనివాడివయ్యావు.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘నాపై దాడి చేస్తున్నావు’ లేదా ‘నన్ను హింసిస్తున్నావు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵּהָפֵךְ
  choice: మారిపోయావు
  rationale: నిఫల్ రూపం స్థితిలో వచ్చిన మార్పును సూచిస్తుంది. ఆధునిక తెలుగులో ‘మారిపోయావు’ సహజంగా ఉండి, యోబు అనుభవిస్తున్న మార్పును స్పష్టంగా తెలియజేస్తుంది.
- source_word: לְאַכְזָר
  choice: క్రూరంగా
  rationale: אַכְזָר క్రూరత్వం లేదా కనికరంలేని వైఖరిని సూచిస్తుంది. ‘క్రూరంగా’ మూలంలోని నేరమైన ఆరోపణను నిలుపుతుంది.
- source_word: לִי
  choice: నాపట్ల
  rationale: సంబంధాన్ని లేదా దిశను సూచించే לְ భావాన్ని ‘నాపట్ల’ సహజంగా వ్యక్తం చేస్తుంది; అవసరానికి మించి ‘నాకు విరోధంగా’ అని మొదటి పాదంలోనే బలపరచదు.
- source_word: בְּעֹצֶם
  choice: బలంతో
  rationale: עֹצֶם ఇక్కడ బలం, శక్తి లేదా తీవ్ర బలప్రయోగాన్ని సూచిస్తుంది; సాధనార్థక בְּ ను ‘తో’ ద్వారా నిలిపింది.
- source_word: יָדְךָ
  choice: నీ చేతి
  rationale: ‘చేయి’ అనే సజీవ మానవరూప చిత్రణను ‘శక్తి’గా విడమరచకుండా యథాతథంగా నిలిపింది.
- source_word: תִשְׂטְמֵנִי
  choice: నన్ను విరోధిస్తున్నావు
  rationale: שׂטם శత్రుత్వంతో ఎదిరించడం, దాడి చేయడం లేదా హింసించడం అనే భావపరిధి కలిగి ఉంది. సందర్భంలో దేవుని క్రియాశీల శత్రుత్వాన్ని తెలిపే ‘విరోధిస్తున్నావు’ మూలంలోని పరిధిని అతిగా సంకుచితం చేయకుండా సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: దేవుని చర్యకు మానవరూప వర్ణన మరియు యోబు యొక్క నేర ఆరోపణ
  choice: ‘నీవు’ అనే ప్రత్యక్ష సంబోధనను, ‘నీ చేతి’ అనే చిత్రణను, క్రూరత్వ ఆరోపణను తగ్గించకుండా నిలిపివేయడం
  alternative: ‘నీ శక్తి నాకు ప్రతికూలంగా ఉంది’ వంటి మృదువైన వివరణాత్మక అనువాదం
  rationale: యోబు విలాపం దేవునితో ఉన్న సంబంధంలోని తీవ్ర ఉద్రిక్తతను ఉద్దేశపూర్వకంగా వ్యక్తం చేస్తుంది. అనువాదం ఆ ఆరోపణను సమర్థించకుండానే, దానిని మృదూకరించకుండా అతని మాటలుగానే నిలపాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యేలా సహజమైనప్పటికీ, యోబు విలాపంలోని గంభీరతను మరియు ప్రత్యక్ష ఆరోపణను నిలిపే శైలి. రెండు హీబ్రూ పాదాల సమాంతర నిర్మాణాన్ని అర్ధవిరామంతో సంరక్షించింది.
