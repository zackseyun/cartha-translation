  text: who pluck saltwort among the bushes[b][a], and the root of broom shrubs is their food.
translation:
  language: te
  text: 'పొదల మధ్య ఉప్పునేల మొక్కను[a] తెంపుకునేవారు;

    రెతెము పొదల వేరు వారికి ఆహారం[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘మాలో’; ఈ హెబ్రీ మొక్కపేరు ఖచ్చితంగా ఏ మొక్కను సూచిస్తుందో తెలియదు. బహుశా ఉప్పునేలలో పెరిగే అడవి మొక్క కావచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా ‘వారి రొట్టె’; ఇక్కడ ‘రొట్టె’ అనే మాట ఆహారం లేదా జీవనాధారం అనే విస్తృతార్థంలో వాడబడింది. ‘రెతెము’ ఎడారి ప్రాంతంలో పెరిగే ఒక పొద రకం.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקֹּטְפִים
  choice: కోసుకునేవారు
  rationale: קטף అనే క్రియ మొక్కల భాగాలను కోయడం లేదా తెంపడం అనే స్పష్టమైన చర్యను సూచిస్తుంది. సందర్భంలోని దయనీయమైన ఆహార సేకరణను ‘కోసుకునేవారు’ సహజంగా తెలియజేస్తుంది.
- source_word: מַלּוּחַ
  choice: ఉప్పుకూర
  rationale: ఈ హెబ్రీ మొక్కపేరు నిర్ధారితంగా తెలియదు; ఉప్పునేలలో పెరిగే అడవి మొక్కను సూచించే అవకాశం ఉంది. ‘ఉప్పుకూర’ సంభావ్య భావాన్ని సంక్షిప్తంగా అందిస్తుంది; అనిశ్చితిని పాదసూచికలో నిలుపుతుంది.
- source_word: עֲלֵי שִׂיחַ
  choice: పొదల మధ్య
  rationale: ఇక్కడ על పొదలతో సంబంధమున్న ప్రదేశాన్ని సూచిస్తున్నట్లు కనిపిస్తుంది. ‘పొదల మధ్య’ అనేది ముళ్లపొదల ప్రాంతంలో ఆహారం వెదికే దృశ్యాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: וְשֹׁרֶשׁ רְתָמִים
  choice: చీపురు పొదల వేరు
  rationale: רְתָמִים ఎడారి ప్రాంతపు broom shrub మొక్కలను సూచిస్తుంది. తెలుగులో ‘చీపురు పొదలు’ ఆ మొక్క రకాన్ని సులభంగా గుర్తించదగిన విధంగా సూచిస్తుంది; ఏకవచన ‘వేరు’ హెబ్రీ నిర్మాణాన్ని నిలుపుతుంది.
- source_word: לַחְמָם
  choice: వారికి ఆహారం
  rationale: לֶחֶם ప్రాథమికంగా ‘రొట్టె’ అయినా, విస్తృతార్థంలో ఆహారం లేదా జీవనాధారాన్ని సూచిస్తుంది. ఇక్కడ మొక్కవేరు వారి భోజన పదార్థమని భావం కాబట్టి ‘ఆహారం’ సందర్భోచితం.
