- from: ఎందుకంటే, నీవు నన్ను మరణానికి చేర్చుతావని[a], ప్రాణమున్న ప్రతి ఒక్కరికీ నియమించబడిన గృహానికి[b] తీసుకువెళ్తావని నాకు తెలుసు.
  to: ఎందుకంటే, నీవు నన్ను మరణానికి, ప్రాణమున్న ప్రతి ఒక్కరికీ నియమించబడిన గృహానికి చేర్చుతావని నాకు తెలుసు.[a][b]
  rationale: A single governing verb has been used for ‘to death’ and ‘to the house appointed for every living one,’ mirroring the Hebrew syntax more closely and yielding smoother Telugu. The lexical and interpretive ambiguity is retained in the footnotes without adding a doctrinally specific meaning to the main text.
