review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys Job’s certainty, death as the destination, and the universally appointed ‘house.’ However, it introduces a second explicit verb (‘తీసుకువెళ్తావని’) where the Hebrew has one verb governing both coordinated destinations. A single Telugu verb better retains the compact poetic structure and avoids suggesting two separately expressed actions.
  naturalness: The revised sentence is more fluent and balanced in modern standard Telugu. It preserves the solemn register while avoiding the somewhat repetitive ‘చేర్చుతావని ... తీసుకువెళ్తావని’ construction.
  terminology: ‘మరణం’ appropriately renders מָוֶת without prematurely identifying it as Sheol. ‘నియమించబడిన గృహం’ preserves the house metaphor and the appointed/destined sense of מוֹעֵד. The footnote retains the possible causative-return nuance of תְּשִׁיבֵנִי and presents grave/Sheol only as a possible poetic referent.
  issues:
  - severity: low
    issue: The draft supplies two distinct future verbs for a Hebrew clause with one verb governing both destinations.
    rationale: ‘చేర్చుతావని ... తీసుకువెళ్తావని’ is understandable, but a single verb more closely reflects the Hebrew coordination and is stylistically tighter.
  revised_text: ఎందుకంటే, నీవు నన్ను మరణానికి, ప్రాణమున్న ప్రతి ఒక్కరికీ నియమించబడిన గృహానికి చేర్చుతావని నాకు తెలుసు.[a][b]
