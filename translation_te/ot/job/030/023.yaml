source:
  edition: WLC
  text: כִּֽי יָ֭דַעְתִּי מָ֣וֶת תְּשִׁיבֵ֑/נִי וּ/בֵ֖ית מוֹעֵ֣ד לְ/כָל חָֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/030/023.yaml
  text: For I know that you will bring me to death[b][a], and to the house appointed for every living one.
translation:
  language: te
  text: ఎందుకంటే, నీవు నన్ను మరణానికి, ప్రాణమున్న ప్రతి ఒక్కరికీ నియమించబడిన గృహానికి చేర్చుతావని నాకు తెలుసు.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నన్ను మరణానికి తిరిగి చేర్చుతావని.” ఈ క్రియకు ఒకరిని తిరిగి తీసుకురావడం లేదా తిరిగి చేర్చడం అనే భావం ఉంది.
    reason: lexical_alternative
  - marker: b
    text: “ప్రాణమున్న వారందరికీ నియమించబడిన గృహం” అని కూడా అనువదించవచ్చు. ఇది ప్రతి మనిషికీ సాధారణ గమ్యమైన సమాధి లేదా షెయోల్‌కు కవితాత్మక సూచన కావచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి విలాపానికి కారణాన్ని లేదా ఆధారాన్ని పరిచయం చేసే అనుసంధాన భావాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: יָדַעְתִּי
  choice: నాకు తెలుసు
  rationale: యోబుకు ఉన్న స్థిరమైన నిశ్చయాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: מָוֶת
  choice: మరణం
  rationale: మూలపదం నేరుగా మరణాన్ని సూచిస్తుంది; పాతాళం లేదా షియోల్ అనే మరింత నిర్దిష్ట భావాన్ని ప్రధాన పాఠ్యంలో చేర్చలేదు.
- source_word: תְּשִׁיבֵנִי
  choice: నన్ను ... చేర్చుతావు
  rationale: హిఫిల్ రూపంలోని ‘తిరిగి తీసుకురావడం/చేర్చడం’ భావాన్ని సందర్భానుసారంగా సహజ తెలుగులో అందిస్తుంది; ‘తిరిగి’ అనే సూక్ష్మభావాన్ని ప్రత్యామ్నాయంగా పాదసూచికలో ఉంచింది.
- source_word: וּבֵית מוֹעֵד
  choice: నియమించబడిన గృహానికి
  rationale: ‘గృహం’ అనే కవితాత్మక రూపకాన్ని, מוֹעֵד లోని నియమిత స్థలం లేదా గమ్యం అనే భావాన్ని నిలుపుతుంది.
- source_word: לְכָל חָי
  choice: ప్రాణమున్న ప్రతి ఒక్కరికీ
  rationale: ‘ప్రాణమున్న ప్రతి ఒక్కరు’ అనే ఏకవచన సమష్టి నిర్మాణాన్నీ దాని సార్వత్రిక భావాన్నీ దగ్గరగా ప్రతిబింబిస్తుంది.
theological_decisions:
- issue: మరణ చిత్రణ యొక్క అర్థం
  choice: మరణాన్ని ప్రతి మనిషికీ సాధారణ గమ్యంగా, నియమించబడిన గృహం అనే కవితాత్మక చిత్రంతో వ్యక్తపరచడం
  alternative: ‘గృహం’ అనేది మరింత నిర్దిష్టంగా సమాధి లేదా షియోల్‌ను సూచిస్తుందని అనువదించడం
  rationale: హీబ్రూ పాఠ్యం ‘మరణం’ మరియు ‘ప్రాణమున్న ప్రతి ఒక్కరికీ నియమించబడిన గృహం’ అని చెబుతుంది గానీ షియోల్‌ను పేరుపెట్టి చెప్పదు. అందువల్ల ప్రధాన పాఠ్యం రూపకాన్నీ దాని అనిశ్చితినీ నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన శైలి వాడబడింది. ‘గృహం’ అనే కవితాత్మక రూపకం నిలుపబడింది; మూలంలో లేని నిర్దిష్ట పరలోక సిద్ధాంతాన్ని ప్రధాన పాఠ్యంలో చేర్చలేదు.
