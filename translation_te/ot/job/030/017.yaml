translation:
  language: te
  text: రాత్రివేళ నా ఎముకలు నాలోనే తొలవబడుతున్నాయి[a]; నా నరాలు[b] విశ్రమించవు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నా ఎముకలు నా మీదనుండి తొలవబడుతున్నాయి.” హీబ్రూ వాక్యనిర్మాణం క్లిష్టంగా ఉంది; క్రియను “కొరుకుతున్నాయి” అని కూడా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ పదం అరుదైనది. దీనికి “స్నాయువులు,” “సిరలు” లేదా, విస్తృతార్థంలో, “నన్ను కొరుకుతున్న బాధలు” అని అర్థం కావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַיְלָה
  choice: రాత్రివేళ
  rationale: కాలాన్ని సూచించే క్రియావిశేషణ ప్రయోగం; ఆధునిక తెలుగులో సహజంగా ఉండి మూలంలోని భావాన్ని నిలుపుతుంది.
- source_word: עֲצָמַי
  choice: నా ఎముకలు
  rationale: శారీరక బాధను స్పష్టంగా చిత్రించే మూలంలోని concrete imageryని యథాతథంగా నిలుపుతుంది.
- source_word: נִקַּר
  choice: చీల్చబడుతున్నాయి
  rationale: נקר అనే క్రియలోని ‘రంధ్రం చేయు/చీల్చు’ అనే తీవ్రమైన శారీరక భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; వర్తమాన కొనసాగింపు రాత్రివేళ అనుభవించే బాధను సూచిస్తుంది.
- source_word: מֵעָלָי
  choice: నాలోనే
  rationale: అక్షరార్థంగా కఠినమైన ‘నా మీదనుండి’ అనే నిర్మాణాన్ని అంతర్గత శారీరక బాధగా సహజంగా అందిస్తుంది; మూలంలోని అస్పష్టతను పాదటిప్పణిలో తెలియజేస్తుంది.
- source_word: וְעֹרְקַי
  choice: నా నరాలు
  rationale: అరుదైన పదానికి శరీరంలోని తంతువులు లేదా ప్రవాహనాళాలు అనే concrete అర్థాన్ని ప్రధాన పాఠంలో నిలుపుతుంది; ‘బాధలు’ అనే metonymic అర్థాన్ని నేరుగా నిర్ణయించకుండా పాదటిప్పణిలో సూచిస్తుంది.
- source_word: לֹא יִשְׁכָּבוּן
  choice: విశ్రమించవు
  rationale: అక్షరార్థమైన ‘పడుకోవు’లోని విశ్రాంతి రూపకాన్ని సహజమైన తెలుగులో కాపాడుతుంది; నిరంతర బాధను సూచిస్తుంది.
