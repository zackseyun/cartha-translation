source:
  edition: WLC
  text: בְּֽנֵי נָ֭בָל גַּם בְּנֵ֣י בְלִי שֵׁ֑ם נִ֝כְּא֗וּ מִן הָ/אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/030/008.yaml
  text: Sons of fools[a], indeed sons without a name[c][b], they were scourged from the land.
translation:
  language: te
  text: నీచుల కుమారులు, అవును, పేరుప్రతిష్ఠలేనివారి కుమారులు,[a] దేశం నుండి తరిమివేయబడ్డారు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “పేరుప్రతిష్ఠలేనివారి కుమారులు” అనేది సమాజంలో స్థానం లేదా గౌరవం లేని వారిని సూచించే హీబ్రూ నుడికారం.
    reason: cultural_note
  - marker: b
    text: లేదా “దేశం నుండి కొట్టి వెళ్లగొట్టబడ్డారు.” ఇక్కడి హీబ్రూ క్రియ అరుదైనది; అది కొట్టడాన్ని లేదా బలవంతంగా వెళ్లగొట్టడాన్ని సూచించవచ్చు. సందర్భం తరిమివేయబడిన భావానికి మొగ్గుచూపుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי נָבָל
  choice: బుద్ధిహీనుల కుమారులు
  rationale: נָבָל కేవలం తెలివిలేమిని కాక నైతికంగా, సామాజికంగా నీచమైన మూర్ఖత్వాన్ని సూచిస్తుంది. ‘బుద్ధిహీనులు’ ఆధునిక తెలుగులో సహజంగా ఉండి దాని నిందార్థాన్ని నిలుపుతుంది; בְּנֵי లోని పుంలింగ రూపాన్ని ‘కుమారులు’గా కాపాడాం.
- source_word: גַּם
  choice: నిజానికి
  rationale: రెండవ సమానాధికార వర్ణనను బలపరిచే గట్టి భావాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: בְּנֵי בְלִי שֵׁם
  choice: పేరుప్రతిష్ఠలేని వారి కుమారులు
  rationale: అక్షరార్థమైన ‘పేరు లేని కుమారులు’ తెలుగులో వ్యక్తిగత పేరు లేనట్టుగా అపార్థమవుతుంది. ఇక్కడ సామాజిక గౌరవం, స్థానం లేనివారనే హీబ్రూ నుడికార భావాన్ని ‘పేరుప్రతిష్ఠలేని’ స్పష్టంగా అందిస్తుంది; ‘కుమారులు’ మూల నిర్మాణాన్ని కొంతవరకు నిలుపుతుంది.
- source_word: נִכְּאוּ
  choice: తరిమివేయబడ్డారు
  rationale: అరుదైన క్రియకు కొట్టబడడం లేదా వెళ్లగొట్టబడడం అనే భావసాధ్యత ఉంది. מן־הארץ తో కూడిన సందర్భంలో బహిష్కరణ ఫలితమే ప్రధానంగా కనిపిస్తున్నందున ‘తరిమివేయబడ్డారు’ ఎంచుకున్నాం; అనిశ్చితిని పాదసూచికలో ఉంచాం.
- source_word: מִן הָאָרֶץ
  choice: దేశం నుండి
  rationale: ఈ సామాజిక సందర్భంలో אֶרֶץ విశ్వవ్యాప్త ‘భూమి’ కంటే వారు నివసించే దేశం/ప్రాంతాన్ని సూచించే అవకాశం ఎక్కువ. ‘దేశం నుండి’ సహజమైన తెలుగు.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనా సులభంగా అర్థమయ్యే వాక్యనిర్మాణం వాడాం. హీబ్రూ సమానాధికార పునరుక్తిని నిలుపుతూ తెలుగులో అతిగా కృత్రిమంగా వినిపించకుండా తీర్చిదిద్దాం; అరుదైన క్రియలోని నిజమైన అనిశ్చితిని పాదసూచికలో సంరక్షించాం.
