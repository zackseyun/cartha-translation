- from: బుద్ధిహీనుల కుమారులు, నిజానికి పేరుప్రతిష్ఠలేని వారి కుమారులు,[a] దేశం నుండి తరిమివేయబడ్డారు.[b]
  to: నీచుల కుమారులు, అవును, పేరుప్రతిష్ఠలేనివారి కుమారులు,[a] దేశం నుండి తరిమివేయబడ్డారు.[b]
  rationale: The revision strengthens the rendering of נָבָל from mere intellectual deficiency to moral-social contempt, and adjusts the connector for a more natural representation of the Hebrew emphasis. The rendering of the rare verb remains deliberately cautious, with its alternative sense retained in the footnote.
