source:
  edition: WLC
  text: בְּ/חֶ֥סֶר וּ/בְ/כָפָ֗ן גַּ֫לְמ֥וּד הַֽ/עֹרְקִ֥ים צִיָּ֑ה אֶ֝֗מֶשׁ שׁוֹאָ֥ה וּ/מְשֹׁאָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/030/003.yaml
  text: Through want and hunger they are gaunt[b][a], gnawing the dry ground in the night of desolation and waste.
translation:
  language: te
  text: లేమి, ఆకలితో కృశించిన వారు రాత్రివేళ[b] నిర్జనమైన పాడుభూమిలో ఎండిన నేలను గీకుతున్నారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “లేమి, ఆకలితో వారు వాడిపోయారు; ఎండిన నేలవైపు పారిపోయారు.” ఈ వచనంలోని కొన్ని హీబ్రూ పదాలు అరుదైనవి, వాటి అర్థం నిర్ధారించడం కష్టం; ముఖ్యంగా “కృశించిన,” “గీకుతున్నారు” అనే పదాలకు మూలమైన పదాలు.
    reason: lexical_alternative
  - marker: b
    text: “రాత్రివేళ” అని అనువదించిన హీబ్రూ పదానికి సాధారణంగా “నిన్న” లేదా “గత రాత్రి” అని అర్థం. ఇక్కడ కావ్యసందర్భానికి తగినట్లు రాత్రికాలాన్ని సూచించేదిగా తీసుకున్నాం.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּחֶסֶר וּבְכָפָן
  choice: లేమితో, ఆకలితో
  rationale: בְּ ఉపసర్గ ఇక్కడ వారు ఉన్న దురవస్థను సూచిస్తుంది. חֶסֶר ‘లేమి’ని, כָּפָן వ్యక్తిగతమైన ‘ఆకలి’ని సూచిస్తున్నాయి.
- source_word: גַּלְמוּד
  choice: కృశించిపోయారు
  rationale: ఈ అరుదైన పదం సందర్భంలో లేమి, ఆకలి వల్ల ఎండిపోయిన లేదా చిక్కిపోయిన శారీరక స్థితిని సూచిస్తుంది. ‘కృశించిపోయారు’ ఆధునిక తెలుగులో సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: הָעֹרְקִים
  choice: గీకుతున్నారు
  rationale: ఈ సందర్భంలో పదార్థం అనిశ్చితం. తదుపరి వచనంలోని ఆహారాన్వేషణ దృశ్యానికి అనుగుణంగా, ఎండిన నేలలో ఆహారం కోసం గీకడం లేదా పెకలించడం అనే అర్థాన్ని ప్రధాన పాఠంలో తీసుకున్నాం.
- source_word: צִיָּה
  choice: ఎండిన నేల
  rationale: צִיָּה ఎండిపోయిన, నీరులేని భూమిని సూచిస్తుంది; ‘ఎండిన నేల’ దృశ్యాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: אֶמֶשׁ
  choice: రాత్రివేళ
  rationale: ఈ పదానికి సాధారణంగా ‘నిన్న’ లేదా ‘గత రాత్రి’ అనే అర్థాలున్నా, ఇక్కడ కావ్యసందర్భంలో రాత్రికాలాన్ని సూచించేదిగా తీసుకున్నాం.
- source_word: שׁוֹאָה וּמְשֹׁאָה
  choice: నిర్జనమైన పాడుభూమి
  rationale: ఈ జంట పదాలు విధ్వంసం, నిర్జనత, పాడుదనాన్ని బలపరుస్తాయి. తెలుగులో సహజమైన ఒక్క దృశ్యంగా ‘నిర్జనమైన పాడుభూమి’ అని ఇచ్చాం.
