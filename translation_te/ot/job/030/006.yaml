  text: In the gullies of the wadis they dwell[b][a], in holes of the dust and among the rocks.
translation:
  language: te
  text: వాగుల కోతల్లో వారు నివసిస్తారు[a], మట్టిలోని బొరియల్లో, బండరాళ్ల మధ్య ఉంటారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఎండిపోయిన వాగు మార్గాల లోయల్లో వారు నివసిస్తారు.” హీబ్రూ పదాలు నీటి ప్రవాహం కోసిన గోతులు, కాలానుగుణ వాగు మార్గాలు లేదా లోయలను సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “మట్టి రంధ్రాల్లో, కొండచరియల్లో ఉంటారు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּעֲרוּץ
  choice: కోతల్లో
  rationale: עָרוּץ నీటి ప్రవాహం వల్ల ఏర్పడిన కోత లేదా ఇరుకైన లోయను సూచిస్తుంది. సందర్భంలో వాగులతో కలిపి ఉన్నందున ‘వాగుల కోతలు’ సహజమైన, స్పష్టమైన భౌగోళిక చిత్రాన్ని ఇస్తుంది.
- source_word: נְחָלִים
  choice: వాగుల
  rationale: נחל సాధారణంగా కాలానుగుణంగా నీరు ప్రవహించే వాగు లేదా దాని ప్రవాహమార్గాన్ని సూచిస్తుంది. ‘వాగులు’ ఆధునిక తెలుగు పాఠకులకు సహజంగా ఉండి, ఎల్లప్పుడూ ప్రవహించే నది అనే భావాన్ని కలిగించదు.
- source_word: לִשְׁכֹּן
  choice: వారు నివసిస్తారు
  rationale: ఈ infinitive construct సందర్భంలో నివాసాన్ని తెలిపే సమాపక క్రియార్థంలో ఉంది. ‘నివసిస్తారు’ గౌరవప్రదమైన ఆధునిక తెలుగులో మూలార్థాన్ని కాపాడుతుంది.
- source_word: חֹרֵי
  choice: బొరియల్లో
  rationale: חוֹר రంధ్రం, గుహిక లేదా బొరియను సూచిస్తుంది. ఇక్కడ ‘బొరియలు’ నేలలోని అల్పమైన ఆశ్రయాలనే కఠిన చిత్రాన్ని సహజంగా అందిస్తుంది; ‘గుహలు’ అనడం వాటిని మరీ విశాలమైనవిగా భావింపజేయవచ్చు.
- source_word: עָפָר
  choice: మట్టిలోని
  rationale: עָפָר దుమ్ము లేదా వదులైన మట్టిని సూచించగలదు. ‘మట్టిలోని బొరియలు’ తెలుగులో సహజంగా ఉండి, నేలలో తవ్వబడిన లేదా ఏర్పడిన రంధ్రాల భావాన్ని తెలియజేస్తుంది.
- source_word: וְכֵפִים
  choice: బండరాళ్ల మధ్య
  rationale: כֵפִים బండలు లేదా కొండచరియలను సూచిస్తుంది. మూలంలో అంతర్నిహితమైన స్థలార్థాన్ని తెలుగులో ‘మధ్య’తో స్పష్టం చేయడం సహజం.
