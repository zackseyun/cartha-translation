revisions:
- from: వారు మధ్యనుండి తరిమివేయబడతారు[b]; దొంగను తరిమినట్లు వారి వెంట కేకలు వేస్తారు[a].
  to: వారు మధ్యలోనుండి తరిమివేయబడతారు[b]; దొంగపై కేకలు వేసినట్లుగా వారిపై కేకలు వేస్తారు[a].
  rationale: The revision removes the unsupported notion of chasing a thief, improves Telugu idiom, and retains the Hebrew’s ambiguity concerning both the identity of those who shout and the precise directional nuance of the shout. The footnote anchors remain attached to the relevant expressions.
  reviewer_model: gpt-5.6-terra
