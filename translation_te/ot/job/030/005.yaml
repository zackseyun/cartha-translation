source:
  edition: WLC
  text: מִן גֵּ֥ו יְגֹרָ֑שׁוּ יָרִ֥יעוּ עָ֝לֵ֗י/מוֹ כַּ/גַּנָּֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/030/005.yaml
  text: They are driven out from the midst[b][a]; they shout after them as after a thief.
translation:
  language: te
  text: వారు మధ్యలోనుండి తరిమివేయబడతారు[b]; దొంగపై కేకలు వేసినట్లుగా వారిపై కేకలు వేస్తారు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దొంగపై కేకలు వేసినట్లుగా వారిమీద కేకలు వేస్తారు.” హీబ్రూలో కేకలు వేసేవారు ఎవరో స్పష్టంగా చెప్పబడలేదు.
    reason: lexical_alternative
  - marker: b
    text: “మధ్య” అనే పదాన్ని “లోయ,” “కనుమ,” లేదా “లోతైన వాగు” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן־גֵּו
  choice: మధ్యనుండి
  rationale: מִן వేరుచేయబడే మూలస్థానాన్ని సూచిస్తుంది; גֵּו ఇక్కడ ‘మధ్య’ అని అర్థం కావచ్చు. సందర్భంలో ఒక సమాజం లేదా గుంపు మధ్యనుండి వెలివేయబడడాన్ని ఈ రూపం సహజంగా తెలియజేస్తుంది; భౌగోళిక అర్థం కూడా సాధ్యమేనని పాదసూచికలో ఉంచాం.
- source_word: יְגֹרָשׁוּ
  choice: తరిమివేయబడతారు
  rationale: גרש యొక్క బలవంతపు బహిష్కరణ భావాన్ని, అలాగే హీబ్రూ వాక్యంలో బాధితులపై ఉన్న దృష్టిని, కర్మణి రూపం నిలుపుతుంది.
- source_word: יָרִיעוּ
  choice: కేకలు వేస్తారు
  rationale: ఈ హిఫీల్ రూపం బిగ్గరగా లేదా హెచ్చరికగా అరవడాన్ని సూచిస్తుంది. హీబ్రూలో కేకలు వేసేవారు ఎవరో స్పష్టంగా పేర్కొనబడలేదు; అందుకే తెలుగులో కూడా కర్తను చేర్చలేదు.
- source_word: עָלֵימוֹ
  choice: వారి వెంట
  rationale: על ఇక్కడ శత్రుభావంతో వారిని లక్ష్యంగా చేసుకొని, వెంబడిస్తూ కేకలు వేయడాన్ని సూచించగలదు. దొంగతో చేసే పోలికలో ‘వారి వెంట’ సహజంగా సరిపోతుంది.
- source_word: כַּגַּנָּב
  choice: దొంగను తరిమినట్లు
  rationale: כ పోలికను సూచిస్తుంది. దొంగను చూసినప్పుడు అతని వెంట కేకలు వేస్తూ తరిమే అంతర్లీన దృశ్యాన్ని తెలుగులో సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
