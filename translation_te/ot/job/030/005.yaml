review_pass:
  verdict: revise
  source_fidelity: The passive ‘తరిమివేయబడతారు’ accurately represents יְגֹרָשׁוּ, and ‘మధ్యలోనుండి’ retains the primary sense of מִן־גֵּו (‘from among/from the midst’). The draft’s ‘దొంగను తరిమినట్లు’ adds pursuit/expulsion that is not explicitly expressed by כַּגַּנָּב. Recasting the comparison as shouting at a thief preserves the Hebrew’s concise comparison without that addition.
  naturalness: ‘మధ్యలోనుండి’ is more idiomatic than ‘మధ్యనుండి.’ The revised second clause is clear modern Telugu while leaving the shouters unexpressed, as in the Hebrew.
  terminology: ‘తరిమివేయబడతారు,’ ‘కేకలు వేస్తారు,’ and ‘దొంగ’ are accurate, suitably neutral choices. The geographical alternatives for גֵּו belong in the footnote, while ‘మధ్య’ remains the main-text rendering in this context.
  issues:
  - severity: medium
    issue: The phrase ‘దొంగను తరిమినట్లు’ adds an action of chasing a thief.
    rationale: The Hebrew says that a shout is raised toward/over them ‘as [at] a thief’; it does not state that the thief is chased. This should not be made explicit in the translation.
  - severity: low
    issue: ‘మధ్యనుండి’ is less natural than ‘మధ్యలోనుండి.’
    rationale: The latter is the ordinary modern Telugu expression for expulsion from among a group or from the midst.
  - severity: low
    issue: Footnote a’s wording is awkward and does not clearly state the alternative construction.
    rationale: It should express that the shouting may be understood as directed against them, comparable to the outcry raised at a thief, and should retain the Hebrew’s unspecified subject.
  revised_text: వారు మధ్యలోనుండి తరిమివేయబడతారు[b]; దొంగపై కేకలు వేసినట్లుగా వారిపై కేకలు వేస్తారు[a].
  revised_footnotes:
