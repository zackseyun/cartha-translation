translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనా సులభంగా అర్థమయ్యే శైలి వాడబడింది. కేకలు వేసే కర్తను చేర్చకుండా మూలంలోని అనిశ్చితి నిలుపబడింది; ‘మధ్య’ మరియు భౌగోళిక అర్థాల మధ్య ఉన్న పదార్థ అనిశ్చితిని పాదసూచికలో చూపించాం.
