- from: ఆయన నన్ను బురదలోకి విసిరివేశాడు; నేను దుమ్ము బూడిదలవలె అయ్యాను.[a]
  to: ఆయన నన్ను బురదలోకి విసిరివేశాడు; నేను ధూళి మరియు బూడిదలవలె అయ్యాను.[a]
  rationale: The revision preserves the draft’s faithful main rendering while correcting the footnote’s erroneous “chosen” language and making the dust-and-ashes pair idiomatic and explicit in Telugu. No theological interpretation beyond the immediate discourse context has been added.
