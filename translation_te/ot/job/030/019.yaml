  text: הֹרָ֥/נִי לַ/חֹ֑מֶר וָ֝/אֶתְמַשֵּׁ֗ל כֶּ/עָפָ֥ר וָ/אֵֽפֶר׃
base_translation:
  language: en
  yaml_path: translation/ot/job/030/019.yaml
  text: He has thrown me into the mire[b][a], and I have become like dust and ashes.
translation:
  language: te
  text: ఆయన నన్ను బురదలోకి విసిరివేశాడు; నేను ధూళి మరియు బూడిదలవలె అయ్యాను.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నేను ధూళి మరియు బూడిదలతో పోల్చబడ్డాను” లేదా “ధూళి మరియు బూడిదలవలె చేయబడ్డాను.”
    reason: alternative_reading
lexical_decisions:
- source_word: הֹרָנִי
  choice: ఆయన నన్ను విసిరివేశాడు
  rationale: హిఫీల్ రూపంలోని క్రియ, మొదటి పురుష ఏకవచన ప్రత్యయంతో, బలవంతంగా విసరడం అనే భావాన్ని ఇస్తుంది. సందర్భంలో అంతర్లీనమైన మూడవ పురుష ఏకవచన కర్త దేవుణ్ణి సూచిస్తున్నందున ‘ఆయన’ అని వ్యక్తం చేయబడింది.
- source_word: לַחֹמֶר
  choice: బురదలోకి
  rationale: חֹמֶר అనే పదానికి మట్టి, బురద, ఊబి వంటి అర్థాలు ఉండవచ్చు. ఈ విలాప సందర్భంలో అవమానకరంగా బురదలో పడవేయబడిన దృశ్యాన్ని ‘బురద’ సహజంగా తెలియజేస్తుంది.
- source_word: וָאֶתְמַשֵּׁל
  choice: అయ్యాను
  rationale: ఈ రూపం ‘పోల్చబడ్డాను’ లేదా ‘వలె అయ్యాను’ అనే ఫలిత స్థితిని సూచిస్తుంది. తరువాతి పోలికతో కలిపి ‘వలె అయ్యాను’ సహజమైన తెలుగు.
- source_word: כֶּעָפָר
  choice: దుమ్ము ... వలె
  rationale: עָפָר అంటే దుమ్ము; כ ఉపసర్గలోని పోలిక భావాన్ని ‘వలె’ నిలుపుతుంది.
- source_word: וָאֵפֶר
  choice: బూడిదలు
  rationale: אֵפֶר అంటే బూడిద. ‘దుమ్ము బూడిదలు’ అనే జంట మూలంలోని అవమానం, నశ్వరత చిత్రణను నిలుపుతుంది.
theological_decisions:
- issue: మూడవ పురుష ఏకవచన క్రియకు అంతర్లీన కర్త
  choice: సందర్భంలో దేవుణ్ణి సూచిస్తూ ‘ఆయన’ అని అనువదించడం
  alternative: కర్తను స్పష్టంగా చెప్పకుండా ‘బురదలోకి విసిరివేయబడి’ అని అనువదించడం
  rationale: హీబ్రూలో కర్త నామవాచకంగా లేకపోయినా క్రియ మూడవ పురుష పుంలింగ ఏకవచనంలో ఉంది; యోబు ప్రసంగ సందర్భం దానిని దేవునికి అన్వయిస్తుంది. ఇది సందర్భపరమైన నిర్ణయం మాత్రమే.
- issue: וָאֶתְמַשֵּׁל యొక్క స్వరూపం
  choice: ఫలిత స్థితిగా ‘అయ్యాను’
  alternative: ‘పోల్చబడ్డాను’ లేదా ‘చేయబడ్డాను’
  rationale: మూలరూపం ప్రతికర్మక/కర్మణి ఛాయను కలిగి ఉండవచ్చు. ప్రధాన పాఠ్యంలో సహజమైన ఫలిత భావాన్ని ఇచ్చి, ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచడం ద్వారా సందిగ్ధతను కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గంభీరంగా అనువదించబడింది. ‘బురద’ సాధారణ పాఠకులకు స్పష్టంగా ఉండి חֹמֶר లోని అవమానకరమైన మట్టి/ఊబి చిత్రాన్ని అందిస్తుంది. ప్రధాన వాక్యంలో అతిగా వివరణాత్మకమైన పదాలను నివారించాం.
