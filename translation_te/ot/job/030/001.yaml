  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/עַתָּ֤ה שָֽׂחֲק֣וּ עָלַ/י֮ צְעִירִ֥ים מִמֶּ֗/נִּי לְ/יָ֫מִ֥ים אֲשֶׁר מָאַ֥סְתִּי אֲבוֹתָ֑/ם לָ֝/שִׁ֗ית עִם כַּלְבֵ֥י צֹאנִֽ/י׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/030/001.yaml
  text: But now those younger than I laugh at me[a], whose fathers I refused to set with the dogs of my flock.
translation:
  language: te
  text: కాని ఇప్పుడు వయసులో నాకంటే చిన్నవారు నన్ను ఎగతాళి చేస్తూ నవ్వుతున్నారు; వారి తండ్రులను నా మందకు చెందిన కుక్కలతో[a] ఉంచడానికి నేను నిరాకరించాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నా గొర్రెల మందను కాచే కుక్కలతో.’ హెబ్రీలో మరింత అక్షరార్థంగా, ‘నా మందకు చెందిన కుక్కలతో’ అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: కాని ఇప్పుడు
  rationale: ముందటి అధ్యాయంలో యోబుకు లభించిన గౌరవానికి, ఇప్పటి అవమానానికి మధ్య ఉన్న స్పష్టమైన వ్యత్యాసాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: שָׂחֲקוּ עָלַי
  choice: నన్ను చూసి నవ్వుతున్నారు
  rationale: ఈ ప్రయోగం యోబును ఎగతాళి చేస్తూ నవ్వడాన్ని సూచిస్తుంది; మూలంలోని ‘నవ్వు’ అనే స్పష్టమైన చిత్రాన్ని నిలుపుతుంది.
- source_word: צְעִירִים מִמֶּנִּי לְיָמִים
  choice: వయసులో నాకంటే చిన్నవారు
  rationale: ‘దినాలలో నాకంటే చిన్నవారు’ అనే హెబ్రీ నుడికారాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తపరుస్తుంది; మూలంలో లేని ‘పురుషులు’ అనే పదాన్ని చేర్చదు.
- source_word: אֲשֶׁר מָאַסְתִּי ... לָשִׁית
  choice: ఉంచడానికి కూడా నేను నిరాకరించాను
  rationale: מָאַסְתִּי లోని తిరస్కార భావాన్ని తరువాతి క్రియార్థక రూపంతో సహజంగా కలుపుతుంది; ‘కూడా’ వారి హీనస్థితిని సందర్భానుసారంగా స్పష్టం చేస్తుంది.
- source_word: אֲבוֹתָם
  choice: వారి తండ్రులను
  rationale: యోబును ఎగతాళి చేస్తున్న చిన్నవారి తండ్రులను నేరుగా సూచిస్తుంది.
- source_word: עִם כַּלְבֵי צֹאנִי
  choice: నా మంద కుక్కలతో
  rationale: హెబ్రీలోని ‘నా మందకు చెందిన కుక్కలతో’ అనే విస్తృతమైన, స్పష్టమైన రూపాన్ని నిలుపుతుంది; అవి కాపలా కుక్కలని ప్రధాన పాఠ్యంలో తప్పనిసరిగా నిర్ణయించదు.
