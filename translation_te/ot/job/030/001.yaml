- from: కాని ఇప్పుడు వయసులో నాకంటే చిన్నవారు నన్ను చూసి నవ్వుతున్నారు; వారి తండ్రులను నా మంద కుక్కలతో[a] ఉంచడానికి కూడా నేను నిరాకరించాను.
  to: కాని ఇప్పుడు వయసులో నాకంటే చిన్నవారు నన్ను ఎగతాళి చేస్తూ నవ్వుతున్నారు; వారి తండ్రులను నా మందకు చెందిన కుక్కలతో[a] ఉంచడానికి నేను నిరాకరించాను.
