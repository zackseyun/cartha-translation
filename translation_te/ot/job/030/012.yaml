source:
  edition: WLC
  text: עַל יָמִין֮ פִּרְחַ֪ח יָ֫ק֥וּמוּ רַגְלַ֥/י שִׁלֵּ֑חוּ וַ/יָּסֹ֥לּוּ עָ֝לַ֗/י אָרְח֥וֹת אֵידָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/030/012.yaml
  text: On my right, a brood rises up[a]; they send my feet away[c][b], and they build up against me their paths of disaster.
translation:
  language: te
  text: నా కుడివైపున ఒక అల్లరిమూక లేస్తుంది[a]; వారు నా పాదాలను దూరం చేస్తారు[b], నాకు విరోధంగా తమ విపత్తు మార్గాలను ఎత్తుగా నిర్మిస్తారు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఒక నీచమైన గుంపు లేస్తుంది.’ פִּרְחַח అనే హీబ్రూ పదం అరుదైనది; అది తృణీకరించబడిన లేదా అదుపులేని గుంపును సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘వారు నా పాదాలను పంపివేస్తారు.’ వారు అతని అడుగులను దారి తప్పిస్తున్నారని లేదా అతన్ని తడబడేలా చేస్తున్నారని భావం కావచ్చు.
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘వారు నాకు విరోధంగా తమ వినాశన మార్గాలను పోసి కడతారు.’ హీబ్రూ శత్రుత్వ భావంలో దారి కట్టే రూపకాన్ని కొనసాగిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל יָמִין
  choice: నా కుడివైపున
  rationale: ఈ మాట స్థలాన్ని సూచిస్తుంది. సందర్భంలో యోబుకు కుడివైపున శత్రువులు నిలబడుతున్న దృశ్యాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: פִּרְחַח
  choice: ఒక అల్లరిమూక
  rationale: అరుదైన ఈ సమూహవాచక పదంలో తృణీకార భావం ఉంది. ‘అల్లరిమూక’ అదుపులేని, నీచంగా పరిగణించబడిన గుంపును సూచిస్తూ సమూహార్థాన్ని నిలుపుతుంది.
- source_word: יָקוּמוּ
  choice: లేస్తుంది
  rationale: קום ఇక్కడ విరోధంగా లేవడం లేదా నిలబడడం అనే భావాన్ని ఇస్తుంది; సమూహవాచకమైన ‘మూక’కు అనుగుణంగా ఏకవచన క్రియ వాడబడింది.
- source_word: רַגְלַי שִׁלֵּחוּ
  choice: వారు నా పాదాలను తొలగిపోయేలా చేస్తారు
  rationale: హీబ్రూ వాక్యభాగం క్లిష్టమైనది; అక్షరార్థంగా ‘నా పాదాలను పంపివేస్తారు/విడిచిపెడతారు.’ తెలుగు వాక్యం పాదాలను వాటి స్థానం నుంచి తొలగించే భావాన్ని ఇస్తూనే, ‘త్రిప్పివేస్తారు’ లేదా ‘పడగొడతారు’ అని ఖచ్చితంగా నిర్ణయించదు.
- source_word: וַיָּסֹלּוּ
  choice: ఎత్తుగా కడతారు
  rationale: סלל సాధారణంగా దారిని పోసి పైకి కట్టడాన్ని సూచిస్తుంది. ఈ ఎంపిక తరువాత వచ్చే మార్గరూపకాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: עָלַי
  choice: నాకు విరోధంగా
  rationale: శత్రుత్వ సందర్భంలో కేవలం ‘నాపై’ అనే స్థలార్థం కంటే విరోధ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: אָרְחוֹת אֵידָם
  choice: తమ విపత్తు మార్గాలను
  rationale: אָרְחוֹת అంటే మార్గాలు; אֵידָםలోని ప్రత్యయం ‘వారి/తమ’ అని సూచిస్తుంది. ‘విపత్తు’ నాశనం లేదా దురవస్థ భావాన్ని అనవసరంగా విశదీకరించకుండా నిలుపుతుంది.
