  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కవితా ధోరణిని పాటించాం. అరుదైన సమూహపదం, పాదాలను ‘పంపివేయడం’ అనే క్లిష్ట రూపకం, విపత్తు మార్గాలను కట్టడం అనే దృశ్యం—వీటిలోని అస్పష్టతను పాదసూచికలతో సంరక్షించాం.
