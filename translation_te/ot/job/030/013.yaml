  text: נָתְס֗וּ נְֽתִיבָ֫תִ֥/י לְ/הַוָּתִ֥/י יֹעִ֑ילוּ לֹ֖א עֹזֵ֣ר לָֽ/מוֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/030/013.yaml
  text: They tear up my path for my ruin[b][a]; they profit from it—there is no helper for them.
translation:
  language: te
  text: వారు నా దారిని ధ్వంసం చేశారు; నా వినాశనానికి తోడ్పడుతున్నారు.[a] వారికి సహాయకుడు ఎవడూ లేడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారు దానివల్ల ప్రయోజనం పొందుతున్నారు” లేదా “దానిని ముందుకు నడిపిస్తున్నారు.” హీబ్రూ క్రియ ఉపయోగపడడం లేదా దేనినైనా ముందుకు సాగేటట్లు చేయడం అనే భావాలను ఇవ్వగలదు; ఇక్కడ అది యోబు వినాశనాన్నే సూచిస్తుండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ఎవరి సహాయమూ లేకుండానే.” చివరి ఉపవాక్యం సంక్షిప్తంగా ఉంది; వారు సహాయం లేకుండా పనిచేస్తున్నారని లేదా వారికి సహాయకుడు లేడని అర్థం కావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָתְסוּ
  choice: పాడుచేస్తున్నారు
  rationale: ఈ క్రియ దేనినైనా కూలదోయడం లేదా ఛిన్నాభిన్నం చేయడం అనే భావాన్ని ఇస్తుంది. దారి చిత్రానికి తెలుగులో సహజంగా ఉండేలా ‘పాడుచేస్తున్నారు’ అని అనువదించాం.
- source_word: נְתִיבָתִי
  choice: నా దారిని
  rationale: נְתִיבָה అంటే దారి లేదా కాలిబాట. ‘నా దారి’ అనే పదబంధం నిజమైన మార్గాన్నీ జీవిత గమనమనే రూపకాన్నీ అతిగా వివరించకుండా నిలుపుతుంది.
- source_word: לְהַוָּתִי
  choice: నా నాశనాన్ని
  rationale: הַוָּה నాశనం, విపత్తు అనే భావాలను కలిగి ఉంది. సందర్భంలో యోబుకు కలిగే వినాశాన్ని సూచిస్తున్నందున ‘నా నాశనం’ ఎంచుకున్నాం.
- source_word: יֹעִילוּ
  choice: ముందుకు నెడుతున్నారు
  rationale: יעל హిఫీల్ రూపం ఉపయోగపడడం లేదా ఏదైనా ముందుకు సాగేటట్లు చేయడం అని సూచించవచ్చు. ముందు చెప్పిన యోబు నాశనమే అంతర్భావిత కర్మగా తీసుకొని, దానిని వారు మరింత జరిగేలా చేస్తున్నారనే భావాన్ని ఇచ్చాం; ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: לֹא עֹזֵר לָמוֹ
  choice: వారికి సహాయం చేసేవాడు ఎవడూ లేడు
  rationale: హీబ్రూ ఉపవాక్యం సంక్షిప్తంగా, ద్వ్యర్థకంగా ఉంది. ఈ అనువాదం దాని ప్రత్యక్ష నిర్మాణాన్ని అనుసరిస్తుంది; ‘ఎవరి సహాయమూ లేకుండానే’ అనే సాధ్యమైన అర్థాన్ని పాదసూచికలో నిలిపాం.
