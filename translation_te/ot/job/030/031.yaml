  yaml_path: translation/ot/job/030/031.yaml
  text: So my lyre has become mourning[b][a], and my pipe the sound of those who weep.
translation:
  language: te
  text: 'నా వీణ[a] విలాపంగా మారింది;

    నా ఊదువాద్యం[b] ఏడ్చేవారి ధ్వనిగా మారింది.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నా హార్పు.’ హీబ్రూ పదం כִּנּוֹר ఒక పురాతన తంతివాద్యాన్ని సూచిస్తుంది; దాని ఖచ్చితమైన రూపం తెలియదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘నా వేణువు.’ హీబ్రూ పదం עוּגָב ఒక పురాతన ఊదువాద్యాన్ని సూచిస్తుంది; దాని ఖచ్చితమైన రూపం తెలియదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: మారింది
  rationale: היה with the prefixed waw presents the resulting reversal in Job’s condition. Telugu ‘మారింది’ naturally expresses that his music has turned into lament without overexplaining the tense-aspect.
- source_word: לְאֵבֶל
  choice: విలాపంగా
  rationale: אֵבֶל denotes mourning or the expression of grief. In this poetic setting, ‘విలాపంగా’ gives a natural contrast between music and audible sorrow.
- source_word: כִּנֹּרִי
  choice: నా వీణ
  rationale: כִּנּוֹרִי means ‘my kinnor,’ an ancient stringed instrument. ‘వీణ’ is the clearest dignified Telugu equivalent for ordinary readers, while a footnote preserves uncertainty about its exact type.
- source_word: וְעֻגָבִי
  choice: నా వేణువు
  rationale: עוּגָב denotes a wind instrument whose precise form is uncertain. ‘వేణువు’ communicates the broad wind-instrument sense naturally in Telugu; the footnote notes that it may be understood more generally as a pipe.
- source_word: לְקוֹל
  choice: స్వరంగా
  rationale: קוֹל can mean sound or voice. With לְ and the preceding transformation clause, ‘స్వరంగా’ preserves both the audible quality and the poetic idea that the instrument has become the voice/sound of weeping.
- source_word: בֹּכִים
  choice: ఏడ్చేవారి
  rationale: The masculine plural participle refers to people engaged in weeping. ‘ఏడ్చేవారి’ is direct, natural Telugu and retains the personal reference.
