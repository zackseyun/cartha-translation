translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కవితా శైలి వాడబడింది. రెండవ పాదంలో హీబ్రూలో సహజంగా వదిలివేయబడిన ‘మారింది’ అనే క్రియను తెలుగులో స్పష్టత కోసం పునరుక్తి చేశాం. వాద్యాల ఖచ్చిత స్వరూపాన్ని ప్రధాన పాఠంలో అతిగా నిర్దిష్టం చేయకుండా, ప్రత్యామ్నాయాలను పాదటిప్పణుల్లో ఉంచాం.
