  text: Because he has loosened his cord and afflicted me[b][a], they have cast off restraint before me.
translation:
  language: te
  text: ఎందుకంటే ఆయన తన తాడును[a] సడలించి నన్ను బాధించాడు; వారు నా ఎదుట కళ్లెం[b] వదిలేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆయన తన విల్లునారిని సడలించి నన్ను బాధించాడు.’ హీబ్రూ పదం సాధారణ తాడుకంటే నిర్దిష్టంగా విల్లునారిని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘వారు నా ఎదుట కళ్లెాన్ని విడిచిపెట్టారు’; అంటే, నా సమక్షంలో వారు అదుపు లేకుండా ప్రవర్తించారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందున్న సందర్భంలో యోబుపై జరుగుతున్న ఎగతాళి, శత్రుత్వానికి కారణాన్ని పరిచయం చేసే కారణార్థక సంబంధాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: יִתְרוֹ
  choice: తన తాడును
  rationale: ఈ పదం సాధారణ తాడు లేదా మరింత నిర్దిష్టంగా విల్లునారి అని సూచించవచ్చు. ప్రధాన పాఠంలో రూపకాన్ని అతిగా నిర్దిష్టం చేయకుండా ‘తాడు’ అని ఉంచి, ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
- source_word: פִּתַּח
  choice: సడలించి
  rationale: తాడు అనే కర్మతో వచ్చినప్పుడు ఈ క్రియకు ‘తెరిచి’ కంటే ‘సడలించి’ లేదా ‘విప్పి’ అనే అర్థం సహజంగా సరిపోతుంది.
- source_word: וַיְעַנֵּנִי
  choice: నన్ను బాధించాడు
  rationale: ఇది ‘జవాబిచ్చు’ అనే ענה I నుండి కాక, ‘బాధించు/అణచివేయు’ అనే ענה II నుండి వచ్చిన రూపం. సందర్భంలోని బాధ, అవమానానికి ‘బాధించాడు’ సరిపోతుంది.
- source_word: וְרֶסֶן
  choice: కళ్లెం
  rationale: మూల నామవాచకం కళ్లెం లేదా పగ్గాన్ని సూచిస్తుంది. రూపక చిత్రాన్ని ప్రధాన పాఠంలో నిలిపి, దాని భావమైన అదుపును విడిచిపెట్టడాన్ని పాదటిప్పణిలో వివరించాం.
- source_word: מִפָּנַי
  choice: నా ఎదుట
  rationale: యోబు సమక్షంలో, అతని పట్ల ఏమాత్రం సంకోచం లేకుండా వారు ప్రవర్తించారనే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: שִׁלֵּחוּ
  choice: వదిలేశారు
  rationale: కళ్లెంతో కలిసి ఇది దానిని విడిచిపెట్టడం, అంటే అదుపు లేకుండా ప్రవర్తించడం అనే భావాన్ని ఇస్తుంది.
theological_decisions:
- issue: మొదటి భాగంలోని ఏకవచన కర్తను సూచించే విధానం
  choice: ‘ఆయన’ అని గౌరవ ఏకవచనంతో అనువదించడం
  alternative: ‘అతడు’
  rationale: సందర్భంలో కర్త దేవుడు అని అర్థమవుతుంది. తెలుగు గౌరవ ఏకవచనం సహజంగా ఉండి, మూలంలోని ఏకవచనాన్ని కాపాడుతుంది; అయితే మూల పాఠంలో ‘దేవుడు’ అనే నామం ప్రత్యక్షంగా లేనందున దానిని చేర్చలేదు.
translation_notes:
  register: సహజమైన, గౌరవప్రదమైన ఆధునిక ప్రామాణిక తెలుగు వాడబడింది. ‘తాడు,’ ‘కళ్లెం’ అనే మూల రూపకాలు ప్రధాన పాఠంలో నిలిపి, వాటి ప్రత్యామ్నాయ లేదా సందర్భార్థాలను పాదటిప్పణుల్లో స్పష్టం చేశాం.
