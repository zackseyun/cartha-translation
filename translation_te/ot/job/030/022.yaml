  edition: WLC
  text: תִּשָּׂאֵ֣/נִי אֶל ר֭וּחַ תַּרְכִּיבֵ֑/נִי וּ֝/תְמֹגְגֵ֗/נִי תשוה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/030/022.yaml
  text: You lift me up to the wind[a]; you make me ride on it[b], and you toss me about in the storm.
translation:
  language: te
  text: 'నీవు నన్ను గాలిలోకి ఎత్తుతావు;

    గాలిమీద నన్ను ఎక్కిస్తావు;

    కల్లోలంలో నన్ను కరిగించి వేస్తావు.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: చివరి హెబ్రీ పదం అర్థం అనిశ్చితమైనది. అది తుఫాను, ఘోషభరిత కల్లోలం, లేదా వినాశాన్ని సూచించవచ్చు. అందువల్ల చివరి పాదాన్ని ‘తుఫానులో నన్ను కరిగించి వేస్తావు’ లేదా ‘నన్ను వినాశంలో కరిగించి వేస్తావు’ అని కూడా అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: תִּשָּׂאֵנִי
  choice: నీవు నన్ను ఎత్తుతావు
  rationale: נשׂא అనే క్రియకు ‘ఎత్తు, మోయు’ అనే భావాలున్నాయి. గాలి గురించిన తదుపరి చిత్రణతో ‘ఎత్తుతావు’ సహజంగా సరిపోతూ మూలంలోని దృశ్యాన్ని నిలుపుతుంది.
- source_word: אֶל רוּחַ
  choice: గాలికి
  rationale: רוּחַకు ‘గాలి, ఊపిరి, ఆత్మ’ అనే అర్థాలుండవచ్చు. ఇక్కడ విధ్వంసక వాతావరణ చిత్రణ కారణంగా ‘గాలి’ తగినది; אֶלను ‘గాలికి’ అని దగ్గరగా అనువదించాం.
- source_word: תַּרְכִּיבֵנִי
  choice: దానిమీద నన్ను స్వారీ చేయిస్తావు
  rationale: רכב హిఫీల్ రూపం ‘స్వారీ చేయించు’ అని అర్థం. ‘దానిమీద’ అనేది ముందు చెప్పిన గాలిని సూచిస్తూ తెలుగులో అవసరమైన సహజ స్పష్టతను ఇస్తుంది.
- source_word: וּתְמֹגְגֵנִי
  choice: నన్ను కరిగించివేస్తావు
  rationale: מוגకు ‘కరుగు, కరిగించు, క్షీణింపజేయు’ అనే భావాలున్నాయి. మూలంలోని బలమైన విచ్ఛిన్నత భావాన్ని ఊహాపూర్వకంగా ‘అటూ ఇటూ విసురు’గా మార్చకుండా ‘కరిగించివేస్తావు’ నిలుపుతుంది.
- source_word: תשוה
  choice: కల్లోలంలో
  rationale: చివరి హెబ్రీ రూపం క్లిష్టమైనది; తుఫాను, ఘోషభరిత కల్లోలం లేదా వినాశం వంటి భావాలతో దీనిని అనుసంధానించారు. సందర్భంలోని గాలి చిత్రణకు సరిపడుతూ, అనిశ్చితిని అతిగా నిర్దిష్టం చేయని పదంగా ‘కల్లోలంలో’ ఎంచుకున్నాం.
theological_decisions:
- issue: యోబు దేవునికే ఈ చర్యలను ఆపాదిస్తున్న ప్రత్యక్ష సంబోధన
  choice: ‘నీవు’ అనే కర్తను ప్రతి పాదంలో స్పష్టంగా నిలిపాం
  alternative: కర్తను తెలుగులో అంతర్లీనంగా ఉంచడం
  rationale: మూలంలోని రెండవ పురుష ఏకవచన క్రియలు దేవునిపై యోబు చేస్తున్న తీవ్రమైన ఆరోపణను వ్యక్తం చేస్తాయి; ఆ ఉద్రిక్తతను తగ్గించకుండా ఉంచడం అవసరం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కవితా ధోరణి. ‘స్వారీ చేయిస్తావు’ మూలంలోని causative రూపాన్ని స్పష్టంగా నిలుపుతుంది; చివరి క్లిష్ట పదానికి ప్రధాన పాఠంలో ‘కల్లోలం’ అనే విస్తృత భావాన్ని, పాదసూచికలో ప్రత్యామ్నాయాలను ఇచ్చాం.
