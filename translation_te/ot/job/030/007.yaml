  text: בֵּין שִׂיחִ֥ים יִנְהָ֑קוּ תַּ֖חַת חָר֣וּל יְסֻפָּֽחוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/030/007.yaml
  text: Among the bushes they bray[b][a]; under the nettles they huddle together.
translation:
  language: te
  text: 'పొదల మధ్య వారు గాడిదల్లా ఓండ్ర పెడతారు;

    ముళ్లపొద[b] కింద గుమికూడి ఉంటారు.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘గుంపుగా చేర్చబడతారు’; లేదా ‘ఒదిగి గుమికూడుతారు.’ హీబ్రూ క్రియ దగ్గరగా కూడడం లేదా నొక్కుకుపోయి ఉండడం అనే భావాన్ని సూచించవచ్చు; ఈ సందర్భంలో ఖచ్చితమైన భావఛాయ అనిశ్చితం.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘దురదపొద’; లేదా ‘ముళ్లబ్రాంబుల్ పొద.’ హీబ్రూ మొక్కపేరు యొక్క ఖచ్చితమైన జాతి అనిశ్చితం.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּין שִׂיחִים
  choice: పొదల మధ్య
  rationale: בֵּין బహువచన నామవాచకంతో ‘మధ్య/నడుమ’ అనే భావాన్ని ఇస్తుంది; שִׂיחִים తక్కువ ఎత్తుగల పొదలను సూచిస్తుంది. ఆధునిక తెలుగులో ‘పొదల మధ్య’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: יִנְהָקוּ
  choice: గాడిదల్లా అరుస్తారు
  rationale: נהק సాధారణంగా గాడిద ఓండ్ర పెట్టే ధ్వనిని సూచిస్తుంది. తెలుగులో కేవలం ‘అరుస్తారు’ అంటే జంతుసదృశమైన కఠిన చిత్రణ తగ్గిపోతుంది; ‘గాడిదల్లా’ దానిని స్పష్టంగా నిలుపుతుంది.
- source_word: תַּחַת
  choice: కింద
  rationale: ఇది నేరుగా స్థలాన్ని సూచించే విభక్త్యర్థకం; ‘కింద’ ఆధునిక తెలుగులో సహజమైన సమానం.
- source_word: חָרוּל
  choice: ముళ్లపొదలు
  rationale: ఈ మొక్కకు ఖచ్చితమైన జాతి గుర్తింపు అనిశ్చితం; అది ముళ్లు లేదా హానికరమైన అడవి మొక్కను సూచిస్తుంది. ‘ముళ్లపొదలు’ సందర్భానికి సరిపోతూ అనవసరమైన వృక్షశాస్త్రీయ ఖచ్చితత్వాన్ని నివారిస్తుంది.
- source_word: יְסֻפָּחוּ
  choice: గుంపుగా చేరుతారు
  rationale: ఈ క్రియ కలిపివేయబడటం, దగ్గరగా గుమికూడటం అనే భావాన్ని కలిగి ఉంది. ‘గుంపుగా చేరుతారు’ భౌతికంగా ఒకేచోట చేరిన దృశ్యాన్ని సహజమైన తెలుగులో తెలియజేస్తూ, క్రియలోని ఖచ్చిత ఛాయపై అతిగా నిర్ణయించదు.
