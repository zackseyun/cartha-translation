translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గంభీరమైన శైలి ఉపయోగించబడింది. యోబు వర్ణనలోని కఠినమైన, జంతుసదృశ చిత్రణను నిలుపుతూ మొక్క పేరులోని అనిశ్చితిని సాధారణ పదంతో ప్రతిబింబించాం. అన్ని పాదటిప్పణి సూచికలు ప్రధాన వచనంలో చేర్చబడ్డాయి.
