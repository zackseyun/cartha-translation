source:
  edition: WLC
  text: אַ֣ךְ לֹא בְ֭/עִי יִשְׁלַח יָ֑ד אִם בְּ֝/פִיד֗/וֹ לָהֶ֥ן שֽׁוּעַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/030/024.yaml
  text: Surely one does not stretch out a hand against a ruin[a], if in his calamity there is a cry for help.
translation:
  language: te
  text: నిశ్చయంగా, శిథిలంపై ఎవరూ చెయ్యి చాచరు[a]; తన ఆపదలో సహాయం కోసం మొర ఉంటే.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నిశ్చయంగా, శిథిలాల కుప్పపై ఎవరూ చెయ్యి చాచరు; దాని విపత్తులో సహాయం కోసం మొర ఉంటే.” ఈ వచనంలోని హీబ్రూ చాలా క్లిష్టంగా ఉంది; ముఖ్యంగా “శిథిలంపై” అని అనువదించిన పదబంధం, అలాగే అనువాదంలో విడిగా వ్యక్తం చేయని לָהֶן అనే రూపం ఎలా అర్థం చేసుకోవాలో స్పష్టంగా లేదు.
    reason: alternative_reading
lexical_decisions:
- source_word: אַךְ
  choice: నిశ్చయంగా
  rationale: ఈ సందర్భంలో యోబు చెప్పే మాటను బలంగా నొక్కిచెప్పే అవ్యయంగా గ్రహించాం; ‘అయితే’ లేదా ‘కేవలం’ కంటే ‘నిశ్చయంగా’ తగినది.
- source_word: בְּעִי
  choice: శిథిలమైన దానికి విరోధంగా
  rationale: ఈ అరుదైన, అర్థం నిర్ధారించడం కష్టమైన రూపాన్ని ‘శిథిలం/శిథిలాల కుప్ప’ అనే సాధ్యమైన అర్థంలో తీసుకున్నాం. בְּ ఉపసర్గను చెయ్యి చాచడం అనే విరోధ చర్యతో కలిపి ‘విరోధంగా’ అని వ్యక్తం చేశాం.
- source_word: יִשְׁלַח יָד
  choice: చెయ్యి చాచరు
  rationale: హీబ్రూ నుడికారంలోని దృశ్యరూపాన్ని నిలిపి ఉంచుతూ, సందర్భంలో అది హాని చేయడానికి లేదా దాడి చేయడానికి చెయ్యి చాచడాన్ని సూచించేలా అనువదించాం.
- source_word: אִם
  choice: ఉంటే
  rationale: రెండవ పాదాన్ని మొదటి పాదంతో షరతుగా కలిపే పదంగా తీసుకున్నాం; క్లిష్టమైన వాక్యనిర్మాణాన్ని అతిగా పరిష్కరించకుండా ఉంచుతుంది.
- source_word: בְּפִידוֹ
  choice: తన ఆపదలో
  rationale: פיד అనే పదం విపత్తు లేదా ఆపదను సూచిస్తుంది; వ్యక్తిని సూచించే ప్రత్యయాన్ని ‘తన’ ద్వారా నిలిపాం.
- source_word: לָהֶן
  choice: ప్రత్యక్షంగా విడిగా అనువదించలేదు
  rationale: ఈ రూపానికి ఇక్కడి సందర్భంలో సంబంధం, సూచన స్పష్టంగా లేదు. ప్రధాన వాక్యంలో ఊహాత్మకమైన ‘వారినుండి’ వంటి పదాన్ని చేర్చకుండా, పాఠంలోని క్లిష్టతను పాదటిప్పణిలో తెలియజేశాం.
- source_word: שׁוּעַ
  choice: సహాయం కోసం మొర
  rationale: బాధలో సహాయం కోరుతూ చేసే మొర అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
