  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సంక్షిప్త శైలిని ఉపయోగించాం. మూలంలోని ‘చెయ్యి చాచడం’ అనే రూపకాన్ని నిలిపి, హీబ్రూ వాక్యనిర్మాణంలోని నిజమైన అనిశ్చితిని ప్రధాన పాఠంలో అతిగా పరిష్కరించకుండా పాదటిప్పణిలో సూచించాం.
