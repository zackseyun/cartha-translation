  text: I have become a brother to jackals[a], and a companion to ostriches.
translation:
  language: te
  text: 'నేను నక్కలకు సోదరుడినయ్యాను,

    ఉష్ట్రపక్షులకు తోడునయ్యాను.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “ఉష్ట్రపక్షి కుమార్తెలకు”; ఇది ఉష్ట్రపక్షులను సూచించే హీబ్రూ ప్రయోగం.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָח
  choice: సోదరుడు
  rationale: మూలంలోని ‘సోదరుడు’ అనే ప్రత్యక్ష బంధుత్వ రూపకాన్ని నిలుపుతూ, నిర్జన ప్రదేశపు జీవులతో యోబు తనకున్న సన్నిహిత సారూప్యాన్ని వ్యక్తం చేస్తుంది.
- source_word: הָיִיתִי
  choice: అయ్యాను
  rationale: హయా ధాతువు Qal perfect ప్రథమ పురుష ఏకవచనం; గతంలో సంభవించిన మార్పు వల్ల ఏర్పడిన ప్రస్తుత దుస్థితిని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: לְתַנִּים
  choice: నక్కలకు
  rationale: నిర్జనతను వర్ణించే కవితా సందర్భాల్లో תַנִּים సాధారణంగా jackals‌ను సూచిస్తుంది; ‘డ్రాగన్లు’ వంటి పాత సంప్రదాయ పదం కన్నా ‘నక్కలు’ ఆధునిక తెలుగులో స్పష్టం.
- source_word: וְרֵעַ
  choice: తోడు
  rationale: רֵעַ అనే పదంలోని సహచరుడు/తోటివాడు అనే భావాన్ని, ‘సోదరుడు’తో ఉన్న కవితా సమాంతరతకు తగిన సంక్షిప్తమైన సహజ రూపంలో అందిస్తుంది.
- source_word: לִבְנוֹת יַעֲנָה
  choice: ఉష్ణపక్షులకు
  rationale: ఈ హీబ్రూ పదబంధం అక్షరార్థంగా ‘ఉష్ణపక్షి కుమార్తెలకు’ అని ఉండి, జాతిని సమష్టిగా సూచించే ప్రయోగం; ప్రధాన పాఠ్యంలో సహజమైన బహువచన రూపం వాడబడింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గంభీరమైన కవితా సమాంతరతను పాటించాం. ‘సోదరుడు—తోడు’ అనే జంట మూలంలోని రూపక తీవ్రతను నిలుపుతుంది; పాద విభజన హీబ్రూ సమాంతర నిర్మాణాన్ని ప్రతిబింబిస్తుంది.
