  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు స్పష్టంగా ఉండేలా, అయినా యోబు కవిత్వంలోని గంభీరతను కాపాడే శైలి. సెమీకోలన్లు మూడు సమాంతర అవమానకర చర్యలను వేరు చేస్తాయి.
