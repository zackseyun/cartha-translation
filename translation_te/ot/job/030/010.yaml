  text: They abhor me; they keep far from me[a], and they do not hold back spitting before my face.
translation:
  language: te
  text: వారు నన్ను అసహ్యించుకుంటారు; నాకు దూరంగా ఉంటారు; నా ముఖం ఎదుట ఉమ్మివేయడానికి వెనుకాడరు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “నా ముఖం ఎదుట ఉమ్మిని ఆపుకోరు.” ఈ హీబ్రూ ప్రయోగం యోబును నేరుగా అవమానించే బహిరంగ చర్యను తెలియజేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּעֲבוּנִי
  choice: వారు నన్ను అసహ్యించుకుంటారు
  rationale: תעב బలమైన ఏవగింపు, అసహ్యాన్ని వ్యక్తం చేస్తుంది. ఆధునిక ప్రామాణిక తెలుగులో ‘అసహ్యించుకుంటారు’ తీవ్రతను సహజంగా నిలుపుతుంది.
- source_word: רָחֲקוּ מֶנִּי
  choice: నాకు దూరంగా ఉంటారు
  rationale: רחק భౌతికంగానూ సామాజికంగానూ దూరంగా ఉండడాన్ని సూచించగలదు; ఈ అనిశ్చిత విస్తృతిని తెలుగు పదబంధం నిలుపుతుంది.
- source_word: וּמִפָּנַי
  choice: నా ముఖం ఎదుట
  rationale: పదబంధం అక్షరార్థంగా ‘నా ముఖం/సన్నిధి నుండి’ అనే రూపంలో ఉన్నా, ఉమ్మితో కలిసి వ్యక్తిగతంగా ఎదురుగా చేసిన అవమానాన్ని సూచిస్తుంది. ‘ముఖం మీద’ అని మరీ నిర్దిష్టంగా చెప్పకుండా ‘ముఖం ఎదుట’ మూలానికి దగ్గరగా ఉంటుంది.
- source_word: לֹא חָשְׂכוּ
  choice: వెనుకాడరు
  rationale: חשׂך ఇక్కడ నిరోధించుకోవడం లేదా మానుకోవడం అనే భావం ఇస్తుంది. ఉమ్మివేయడం అనే చర్యతో ‘వెనుకాడరు’ సహజమైన తెలుగు.
- source_word: רֹק
  choice: ఉమ్మివేయడానికి
  rationale: רֹק ‘ఉమ్మి/లాలాజలం’ అనే నామవాచకం. లక్ష్యభాషలో చర్యను స్పష్టంగా, సహజంగా తెలియజేయడానికి క్రియారూపంగా అనువదించబడింది.
