  yaml_path: translation/ot/job/030/025.yaml
  text: Did I not weep for the one whose day was hard? Was not my soul grieved for the poor?[a]
translation:
  language: te
  text: కష్టదినంలో ఉన్నవాని కోసం నేను ఏడవలేదా? పేదవాని కోసం నా ప్రాణం దుఃఖించలేదా?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘కష్టకాలంలో ఉన్నవాని కోసం.’ హీబ్రూలో అక్షరార్థంగా, ‘కఠిన దినముగలవాని కోసం’ అనే ప్రయోగం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם לֹא
  choice: నేను ... లేదా?
  rationale: ఇక్కడ ఇది సాధారణ షరతును కాక, యోబు తన ప్రవర్తనను సమర్థించుకునే అలంకారిక ప్రశ్నను సూచిస్తుంది.
- source_word: בָכִיתִי
  choice: ఏడవలేదా
  rationale: క్రియలోని నిజమైన రోదనభావాన్ని సహజమైన, గంభీరమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: לִקְשֵׁה יוֹם
  choice: కష్టదినం వచ్చినవాని కోసం
  rationale: ‘కఠినమైన రోజు’ అనే హీబ్రూ చిత్రాన్ని సాధ్యమైనంతవరకు నిలుపుతూ, కష్టకాలంలో ఉన్న వ్యక్తిని సూచించే సహజ తెలుగు రూపం.
- source_word: עָגְמָה
  choice: దుఃఖించలేదా
  rationale: ఏడుపుతో సమాంతరంగా ఉన్న అంతరంగ వేదనను తెలియజేస్తుంది; ‘చేదుగా అయింది’ అని అనవసరంగా సంకుచితం చేయదు.
- source_word: נַפְשִׁי
  choice: నా ప్రాణం
  rationale: యోబు అంతరంగ స్వభావాన్ని సూచించే హీబ్రూ కవితా ప్రయోగాన్ని తెలుగులో సహజంగా నిలుపుతుంది; దీనిని సాంకేతిక ఆత్మసిద్ధాంతంగా నిర్వచించదు.
- source_word: לָאֶבְיוֹן
  choice: పేదవాని కోసం
  rationale: ఆర్థికంగా లేమిలో, అవసరంలో ఉన్న వ్యక్తిని సూచించే ప్రతినిధి ఏకవచనాన్ని సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: נַפְשִׁי యొక్క మానవశాస్త్రీయ భావం
  choice: ‘నా ప్రాణం’ అని కవితాత్మక అంతరంగ స్వీయసూచనగా అనువదించడం
  alternative: ‘నేను దుఃఖించలేదా?’ లేదా ‘నా అంతరంగం దుఃఖించలేదా?’
  rationale: మూలంలోని కవితా రూపాన్ని నిలుపుతూ, శరీరానికి వేరైన భాగం గురించిన ప్రత్యేక సిద్ధాంతాన్ని వాక్యంలోకి దిగుమతి చేయకుండా ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కవితా శైలి. రెండు అలంకారిక ప్రశ్నల సమాంతర నిర్మాణాన్ని, ‘కష్టదినం’ అనే మూలభాషా చిత్రాన్ని నిలిపింది.
