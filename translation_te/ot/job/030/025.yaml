- from: కష్టదినం వచ్చినవాని కోసం నేను ఏడవలేదా? పేదవాని కోసం నా ప్రాణం దుఃఖించలేదా?[a]
  to: కష్టదినంలో ఉన్నవాని కోసం నేను ఏడవలేదా? పేదవాని కోసం నా ప్రాణం దుఃఖించలేదా?[a]
  rationale: The revision removes the unwarranted implication that hardship newly ‘came’ upon the person, while retaining the Hebrew image of a hard day, the poetic parallelism, and the representative singular for the needy. The footnote preserves the lexical ambiguity and explains the Hebrew idiom without imposing a more specific interpretation.
