    text: లేదా, ‘కష్టకాలంలో ఉన్నవాని కోసం.’ హీబ్రూలో అక్షరార్థంగా, ‘కఠిన దినముగలవాని కోసం’ అనే ప్రయోగం ఉంది.
    reason: lexical_alternative
