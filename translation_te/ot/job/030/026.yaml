source:
  edition: WLC
  text: כִּ֤י ט֣וֹב קִ֭וִּיתִי וַ/יָּ֣בֹא רָ֑ע וַֽ/אֲיַחֲלָ֥ה לְ֝/א֗וֹר וַ/יָּ֥בֹא אֹֽפֶל׃
base_translation:
  language: en
  yaml_path: translation/ot/job/030/026.yaml
  text: For I hoped for good[a], but evil came; I waited for light, but darkness came.
translation:
  language: te
  text: 'ఎందుకంటే, నేను మేలు కోసం ఆశించాను, కానీ కీడు[a] వచ్చింది;

    వెలుగు కోసం ఎదురుచూశాను, కానీ చీకటి వచ్చింది.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “విపత్తు” లేదా “ఆపద.” ఇక్కడి హెబ్రీ పదం నైతిక కీడు కంటే ప్రతికూల పరిస్థితిని సూచించే అవకాశం ఎక్కువ.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: యోబు విలాపానికి కారణాన్ని లేదా వివరణను పరిచయం చేసే భావాన్ని సందర్భానుసారంగా నిలుపుతుంది.
- source_word: טוֹב
  choice: మేలు
  rationale: హితకరమైనది, అనుకూలమైనది అనే విస్తృత భావాన్ని సహజంగా వ్యక్తం చేస్తూ, రָעతో ఉన్న వ్యతిరేకతను నిలుపుతుంది.
- source_word: קִוִּיתִי
  choice: నేను ... ఆశించాను
  rationale: ఆశతో కూడిన నిరీక్షణను వ్యక్తం చేస్తుంది; ‘మేలు కోసం ఆశించాను’ ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: וַיָּבֹא
  choice: వచ్చింది
  rationale: రెండు పాదాల్లోనూ పునరావృతమైన హెబ్రీ క్రియను అలాగే నిలుపుతూ, అనూహ్యమైన విపర్యయాన్ని బలంగా చూపుతుంది.
- source_word: רָע
  choice: కీడు
  rationale: ‘మేలు’కు నేరమైన వ్యతిరేక పదంగా నిలుస్తుంది; ఇక్కడ నైతిక దుష్టత్వం కంటే ఆపద లేదా విపత్తు అనే సందర్భార్థం ఉండవచ్చని పాదసూచిక స్పష్టం చేస్తుంది.
- source_word: אֲיַחֲלָה
  choice: ఎదురుచూశాను
  rationale: ఆశతో వేచియుండే భావాన్ని నిలుపుతుంది; మొదటి పాదంలోని ‘ఆశించాను’తో అనవసర పదపునరుక్తిని నివారిస్తుంది.
- source_word: לְאוֹר
  choice: వెలుగు కోసం
  rationale: రూపకార్థాన్ని ముందుగానే వివరించకుండా, మూలంలోని ‘వెలుగు’ ప్రతీకను యథాతథంగా నిలుపుతుంది.
- source_word: אֹפֶל
  choice: చీకటి
  rationale: ‘వెలుగు’తో స్పష్టమైన వ్యతిరేకతను నిలుపుతూ, గాఢాంధకారం లేదా విషాదం అనే అంతర్భావాలకు కూడా చోటిస్తుంది.
