  text: Even the strength of their hands—what is it to me? Their vigor has perished[a].
translation:
  language: te
  text: వారి చేతుల బలం కూడా నాకు ఏ ప్రయోజనం ఉంది? వారి జవసత్తువ నశించిపోయింది[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారి నిండు ప్రాయం నశించిపోయింది.” అరుదైన హీబ్రూ నామవాచకాన్ని పరిపక్వ వయస్సు లేదా సంపూర్ణ బలానికి సూచనగా తీసుకుంటే ఈ అర్థం వస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: కూడా
  rationale: అదనంగా చెప్పే నొక్కింపును సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: כֹּחַ יְדֵיהֶם
  choice: వారి చేతుల బలం
  rationale: శారీరక శక్తితోపాటు పని చేయగల సామర్థ్యాన్ని సూచించే హీబ్రూ మూర్తిమంతమైన ప్రయోగాన్ని నిలుపుతుంది.
- source_word: לָמָה לִּי
  choice: నాకు ఏ ప్రయోజనం?
  rationale: పదశః రూపం కంటే సందర్భంలోని తిరస్కారభావాన్ని, ఉపయోగం లేదనే అలంకారప్రశ్నను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: עָלֵימוֹ אָבַד
  choice: వారి ... నశించిపోయింది
  rationale: עָלֵימוֹను తరువాతి అరుదైన నామవాచకంతో సంబంధింపజేసి, వారిలోని గుణం పోయిందనే వాక్యనిర్మాణాన్ని తెలుగులో స్పష్టంగా అందిస్తుంది.
- source_word: כָּלַח
  choice: జవసత్తువ
  rationale: అరుదైన పదం సూచించగల పరిపక్వ శక్తి, దేహదారుఢ్యం లేదా ఉత్సాహభరిత సామర్థ్యాన్ని సంక్షిప్తంగా తెలియజేస్తుంది; దాని అనిశ్చితిని పాదటిప్పణిలో నిలుపుతుంది.
- source_word: אָבַד
  choice: నశించిపోయింది
  rationale: కేవలం లేకపోవడం కాక పూర్తిగా పోయిన స్థితిని బలంగా వ్యక్తం చేస్తుంది.
