translation:
  language: te
  text: గొప్ప బలంతో నా వస్త్రం రూపు మారిపోతుంది[a]; నా అంగీ మెడ తెరువులా[b] అది నన్ను బిగిస్తుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నా వస్త్రం మారిపోతుంది,’ ‘నా వస్త్రం వికృతమవుతుంది’; బహుశా, ‘అతడు నా వస్త్రాన్ని పట్టుకుంటాడు’ అని కూడా అనువదించవచ్చు. ఇక్కడి హీబ్రూ క్రియ క్లిష్టమైనది. యోబు బాధ అతణ్ణి వస్త్రంలా రూపు మార్చి బిగిస్తున్నదని ఈ పాదాన్ని సాధారణంగా అర్థం చేసుకుంటారు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘నా అంగీ నోరు/తెరువులా.’
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרָב כֹּחַ
  choice: అపారమైన బలంతో
  rationale: בְּ అనే ఉపసర్గను సాధనార్థకంగా తీసుకొని, చర్య జరిగే తీవ్రమైన బలాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: יִתְחַפֵּשׂ
  choice: రూపు మారిపోతుంది
  rationale: ఈ హిత్పయేల్ క్రియ అర్థం ఇక్కడ క్లిష్టమైనది. వస్త్రం గుర్తుపట్టలేనంతగా మారడం లేదా వికృతమవడం అనే సందర్భోచిత భావాన్ని ఇది తెలుపుతుంది; అస్పష్టతను పాదసూచికలో నిలిపాం.
- source_word: לְבוּשִׁי
  choice: నా వస్త్రం
  rationale: ఏకవచనాన్ని కాపాడుతూ, సాధారణ వస్త్రాన్ని సూచించే గౌరవప్రదమైన ఆధునిక పదం.
- source_word: כְּפִי
  choice: మెడతెరువులా
  rationale: అక్షరార్థంగా ‘నోరు/తెరువు వలె’; అంగీ సందర్భంలో మెడ దగ్గరనున్న తెరువును సూచించే సహజమైన తెలుగు రూపం.
- source_word: כֻתָּנְתִּי
  choice: నా అంగీ
  rationale: כֻּתֹּנֶת సూచించే శరీరానికి దగ్గరగా ధరించే పొడవైన వస్త్రానికి ‘అంగీ’ సహజమైన, అర్థమయ్యే సమానార్థకం.
- source_word: יַאַזְרֵנִי
  choice: అది నన్ను బిగిస్తుంది
  rationale: אזר యొక్క చుట్టడం/బిగించడం అనే భావాన్ని, బాధ యోబును వస్త్రంలా బిగిస్తున్న రూపకానికి తగినట్లుగా వ్యక్తపరుస్తుంది.
