source:
  edition: WLC
  text: כְּ/פֶ֣רֶץ רָחָ֣ב יֶאֱתָ֑יוּ תַּ֥חַת שֹׁ֝אָ֗ה הִתְגַּלְגָּֽלוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/030/014.yaml
  text: Like a wide breach they come[a]; amid the crash they roll on.
translation:
  language: te
  text: విశాలమైన గండిలా వారు వస్తారు[a]; విధ్వంసం మధ్య వారు దొర్లుకుంటూ వస్తారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “విశాలమైన గండి గుండా వారు వస్తారు; విధ్వంసం కింద వారు దొర్లుకుంటూ వస్తారు.”
    reason: כְּפֶרֶץ ను ఉపమానంగా లేదా గండి గుండా రావడాన్ని సూచించే నిర్మాణంగా అర్థం చేసుకోవచ్చు. תַּחַת యొక్క అక్షరార్థమైన “కింద” భావాన్ని కూడా నిలుపుతుంది.
lexical_decisions:
- source_word: כְּ/פֶרֶץ
  choice: గండిలా
  rationale: פֶרֶץ గోడలో ఏర్పడిన గండి లేదా విరిగిన చోటును సూచిస్తుంది; כְ ఉపసర్గలోని ఉపమాన భావాన్ని ‘లా’ నిలుపుతుంది.
- source_word: רָחָב
  choice: విశాలమైన
  rationale: గండి పెద్దగా, విస్తారంగా తెరుచుకున్న దృశ్యాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: יֶאֱתָיוּ
  choice: వారు వస్తారు
  rationale: క్రియ యొక్క ప్రాథమిక ‘రావడం’ భావాన్ని కాపాడుతుంది; ‘దూసుకొస్తారు’ వంటి అదనపు వేగ భావాన్ని చేర్చదు.
- source_word: תַּחַת
  choice: మధ్య
  rationale: మూలార్థం ‘కింద’ అయినప్పటికీ, ఇక్కడ విధ్వంసకర కూలిపోవడం జరుగుతున్న పరిస్థితిలో వారి కదలికను సూచించే కావ్యప్రయోగంగా ‘మధ్య’ సహజంగా సరిపోతుంది; ప్రత్యక్ష ‘కింద’ భావాన్ని పాదటిప్పణిలో నిలిపాం.
- source_word: שֹׁאָה
  choice: కూలిపోతున్న ఘోష
  rationale: שֹׁאָה లోని ఆకస్మిక విధ్వంసం లేదా కూలిపోవడపు భావాన్ని, కేవలం దాని ఫలితమైన ‘శిథిలం’గా పరిమితం చేయకుండా సజీవంగా వ్యక్తం చేస్తుంది.
- source_word: הִתְגַּלְגָּלוּ
  choice: ముందుకు దొర్లుతారు
  rationale: גלל హిత్పయేల్ రూపంలోని దొర్లే, ఉరులుతూ సాగిపోయే చలనాన్ని తెలుగులో సహజంగా నిలుపుతుంది.
