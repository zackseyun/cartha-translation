translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కావ్యశైలిని పాటించాం. గోడలోని గండి, కూలిపోవడపు ఘోష, అదుపులేని దొర్లే కదలిక అనే మూడు దృశ్యాలను సంక్షిప్తంగా నిలిపాం.
