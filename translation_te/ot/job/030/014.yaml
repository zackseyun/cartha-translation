  to: విశాలమైన గండిలా వారు వస్తారు[a]; విధ్వంసం మధ్య వారు దొర్లుకుంటూ వస్తారు.
  rationale: The revision replaces the unsupported “sound of collapsing” with “devastation,” which reflects שֹׁאָה more directly while retaining the poem’s destructive setting. It also uses “దొర్లుకుంటూ వస్తారు” to express the dynamic/reflexive rolling sense naturally, and the footnote preserves viable more literal readings without overstating them.
