    reason: כְּפֶרֶץ ను ఉపమానంగా లేదా గండి గుండా రావడాన్ని సూచించే నిర్మాణంగా అర్థం చేసుకోవచ్చు. תַּחַת యొక్క అక్షరార్థమైన “కింద” భావాన్ని కూడా నిలుపుతుంది.
  revision_rationale: The revision replaces the unsupported “sound of collapsing” with “devastation,” which reflects שֹׁאָה more directly while retaining the poem’s destructive setting. It also uses “దొర్లుకుంటూ వస్తారు” to express the dynamic/reflexive rolling sense naturally, and the footnote preserves viable more literal readings without overstating them.
