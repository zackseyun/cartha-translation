- from: నా అంతరంగం మరుగుతోంది, అది నెమ్మదించదు[a]; బాధాకరమైన రోజులు నాకు ఎదురయ్యాయి.
  to: నా అంతర్భాగాలు మరిగిపోతున్నాయి; అవి శాంతించవు; బాధల రోజులు నన్ను ఎదుర్కొన్నాయి.
