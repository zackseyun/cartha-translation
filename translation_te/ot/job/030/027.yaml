  yaml_path: translation/ot/job/030/027.yaml
  text: My inward parts boil and do not rest[a]; days of affliction confront me.
translation:
  language: te
  text: నా అంతర్భాగాలు మరిగిపోతున్నాయి; అవి శాంతించవు; బాధల రోజులు నన్ను ఎదుర్కొన్నాయి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מֵעַי
  choice: నా అంతరంగం
  rationale: ఈ పదం అక్షరార్థంగా లోపలి అవయవాలను సూచించినా, కవిత్వంలో లోతైన అంతరానుభూతిని తెలియజేస్తుంది. ‘అంతరంగం’ ఆధునిక తెలుగులో సహజంగా ఉండి, శారీరక-భావోద్వేగ చిత్రణను కొంతవరకు నిలుపుతుంది.
- source_word: רֻתְּחוּ
  choice: మరుగుతోంది
  rationale: רתח లోని మరిగిపోవడం లేదా ఉడికిపోవడం అనే బలమైన చిత్రాన్ని ‘మరుగుతోంది’ స్పష్టంగా, సహజంగా అందిస్తుంది.
- source_word: וְלֹא דָמּוּ
  choice: అది నెమ్మదించదు
  rationale: דמם కు నిశ్చలంగా ఉండడం, మౌనంగా ఉండడం, ఆగిపోవడం అనే భావాలు ఉన్నాయి. ఇక్కడ అంతర్గత కలవరపు కొనసాగింపును ‘నెమ్మదించదు’ సహజంగా వ్యక్తం చేస్తుంది; ఇతర సాధ్యార్థాన్ని పాదసూచికలో నిలిపాం.
- source_word: קִדְּמֻנִי
  choice: నాకు ఎదురయ్యాయి
  rationale: קדם ఇక్కడ ఎదురుగా రావడం లేదా కలవడం అనే వ్యక్తీకరణను కలిగి ఉంది. ‘ఎదురయ్యాయి’ బాధాకరమైన రోజులు యోబును వచ్చి ఎదుర్కొన్నట్లున్న కవితా భావాన్ని తెలుగులో సహజంగా ఇస్తుంది.
- source_word: יְמֵי עֹנִי
  choice: బాధాకరమైన రోజులు
  rationale: עֹנִי ఇక్కడ పేదరికం మాత్రమే కాక బాధ, దుఃఖం, దురవస్థను సూచిస్తుంది. ‘బాధాకరమైన రోజులు’ సందర్భానికి సరిపోయే విస్తృత భావాన్ని అందిస్తుంది.
