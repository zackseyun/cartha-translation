translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కవితా శైలి. మూలంలోని అంతర్గత మరిగే చిత్రణను నిలిపి, అతిగా వ్యాఖ్యానించకుండా అస్పష్టతను పాదసూచికలో సంరక్షించాం.
