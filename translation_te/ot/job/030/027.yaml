review_pass:
  verdict: revise
  source_fidelity: The draft conveys the broad sense, but singular “నా అంతరంగం ... అది” does not reflect the plural visceral subject מֵעַי, and “అంతరంగం” shifts the concrete bodily image into an abstract psychological one. The revised wording retains the plural inward/visceral image and the continuing unrest.
  naturalness: “నా అంతర్భాగాలు మరిగిపోతున్నాయి; అవి శాంతించవు” is natural modern Telugu poetic diction. It is clearer and more idiomatic than treating “అంతరంగం” as a singular entity that boils and slows down.
  terminology: “అంతర్భాగాలు” preserves the inner-parts imagery without the archaic or potentially distracting force of “పేగులు.” “శాంతించవు” appropriately renders the contextual sense of not becoming still/resting. “బాధల రోజులు” conveys יְמֵי עֹנִי as days marked by affliction rather than limiting it to financial poverty.
  issues:
  - severity: medium
    issue: The translation uses singular, abstract wording for a plural, concrete bodily expression.
    rationale: מֵעַי is formally plural and literally denotes inward parts/entrails. “నా అంతరంగం ... అది” both changes the number and weakens the Hebrew’s visceral poetic imagery.
  - severity: low
    issue: “నెమ్మదించదు” is less precise for the unrest expressed by וְלֹא דָמּוּ.
    rationale: The verb concerns becoming still, silent, or ceasing. In this bodily-turmoil context, “శాంతించవు” more directly expresses the lack of relief or stillness.
  revised_text: నా అంతర్భాగాలు మరిగిపోతున్నాయి; అవి శాంతించవు; బాధల రోజులు నన్ను ఎదుర్కొన్నాయి.
  revised_footnotes:
  - marker: a
    text: లేదా, “నా లోపలి అవయవాలు మరిగిపోతున్నాయి, అవి నిశ్చలంగా ఉండవు; దుఃఖదినాలు నాపైకి వచ్చాయి.”
    reason: מֵעַי యొక్క మరింత శారీరక అర్థాన్ని, וְלֹא דָמּוּ యొక్క ‘నిశ్చలంగా ఉండవు’ అనే ప్రత్యామ్నాయాన్ని, మరియు קִדְּמֻנִי యొక్క ‘నాపైకి వచ్చాయి’ అనే భావాన్ని సూచిస్తుంది.
  revision_rationale: The revision corrects the number and restores the source’s concrete internal-organ imagery while preserving natural modern Telugu. It also renders the ongoing lack of stillness more faithfully. The footnote retains viable lexical alternatives without forcing a disputed nuance.
