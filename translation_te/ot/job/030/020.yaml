source:
  edition: WLC
  text: אֲשַׁוַּ֣ע אֵ֭לֶי/ךָ וְ/לֹ֣א תַעֲנֵ֑/נִי עָ֝מַ֗דְתִּי וַ/תִּתְבֹּ֥נֶן בִּֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/job/030/020.yaml
  text: I cry out to you[a], but you do not answer me; I stand, and you only look at me.
translation:
  language: te
  text: నేను నీకు మొరపెడుతున్నాను, కానీ నీవు నాకు జవాబివ్వడం లేదు; నేను నిలబడి ఉన్నాను, నీవు నన్ను గమనిస్తున్నావు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “నేను నిలబడ్డాను, నీవు నన్ను శ్రద్ధగా గమనించావు.” హీబ్రూలో ఈ చివరి రెండు క్రియలను గతకాల భావంతో కూడా చదవవచ్చు. “గమనించు” అనే క్రియకు శ్రద్ధగా చూడడం లేదా పరిశీలించడం అనే భావం ఉంది.'
    reason: కాలభావం మరియు క్రియార్థంలోని నిజమైన ప్రత్యామ్నాయాలను తెలియజేయడం
lexical_decisions:
- source_word: אֲשַׁוַּע
  choice: నేను మొరపెడుతున్నాను
  rationale: שׁוע క్రియ యొక్క పియేల్ రూపం సహాయం కోసం చేసే తీవ్రమైన మొరను సూచిస్తుంది. ‘మొరపెడుతున్నాను’ ఆ తీవ్రతను సహజమైన తెలుగు ప్రార్థనా భాషలో నిలుపుతుంది.
- source_word: אֵלֶיךָ
  choice: నీకు
  rationale: אֶל అనే ఉపసర్గను ద్వితీయ పురుష ఏకవచన ప్రత్యయంతో కలిపినప్పుడు ఈ సందర్భంలో సహజంగా ‘నీకు’ అని అనువదించవచ్చు.
- source_word: וְלֹא תַעֲנֵנִי
  choice: కానీ నీవు నాకు జవాబివ్వడం లేదు
  rationale: ענה క్రియకు ఇక్కడ ‘జవాబివ్వు, స్పందించు’ అనే ప్రత్యక్ష అర్థం ఉంది. ‘జవాబివ్వడం లేదు’ మూలంలోని ఫిర్యాదును అదనపు వ్యాఖ్యానం లేకుండా తెలియజేస్తుంది.
- source_word: עָמַדְתִּי
  choice: నేను నిలబడ్డాను
  rationale: ఇది రూపపరంగా సంపూర్ణ క్రియ. అందువల్ల గతకాల భావాన్ని ప్రధాన పాఠ్యంలో ఉంచడం మూలరూపానికి సమీపంగా ఉంటుంది; సందర్భానుసార వర్తమాన భావం కూడా సాధ్యమని పాదసూచిక తెలియజేస్తుంది.
- source_word: וַתִּתְבֹּנֶן בִּי
  choice: నీవు నన్ను నిశితంగా చూస్తున్నావు
  rationale: התבונן సాధారణంగా శ్రద్ధగా చూడడం, గమనించడం లేదా పరిశీలించడం అనే భావాన్ని ఇస్తుంది. ‘నిశితంగా చూస్తున్నావు’ ఆ భావవ్యాప్తిని నిలుపుతూ, మూలంలో లేని ‘కేవలం’ అనే పరిమితార్థాన్ని చేర్చదు.
theological_decisions:
- issue: దేవుడు స్పందించకపోవడాన్ని మూలం చెప్పినదానికంటే బలమైన ఆరోపణగా చూపాలా?
  choice: యోబు మొరకు జవాబు రాకపోవడం మరియు దేవుడు అతన్ని నిశితంగా చూడడం అనే ఉద్రిక్తతను అలాగే ఉంచడం
  alternative: ‘నీవు నన్ను రక్షించడం లేదు’ లేదా ‘నీవు నన్ను పట్టించుకోవడం లేదు’
  rationale: హీబ్రూ పాఠం జవాబు ఇవ్వకపోవడాన్ని చెబుతుంది గాని రక్షించకపోవడం లేదా నిర్లక్ష్యం చేయడం అని స్పష్టంగా చెప్పదు. కాబట్టి అనువాదం ఫిర్యాదు యొక్క తీవ్రతను నిలుపుతూ అదనపు ధార్మిక నిర్ధారణను చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన విలాప భాషను ఉపయోగించాం. దేవునికి సంబోధనలో ఏకవచన ‘నీవు’ను ఉంచాం. ప్రధాన పాఠ్యంలో మూలంలోని క్రియారూపాన్ని గౌరవిస్తూ ‘నిలబడ్డాను’ను ఎంచుకుని, సందర్భానుసార వర్తమాన పఠనాన్ని పాదసూచికలో ఇచ్చాం.
