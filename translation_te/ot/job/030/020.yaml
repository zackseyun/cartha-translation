  to: నేను నీకు మొరపెడుతున్నాను, కానీ నీవు నాకు జవాబివ్వడం లేదు; నేను నిలబడి ఉన్నాను, నీవు నన్ను గమనిస్తున్నావు.[a]
  rationale: ప్రధాన పాఠ్యం యోబు కొనసాగుతున్న ఫిర్యాదుకు సరిపోయే సజీవ వర్తమాన భాషను ఉంచుతుంది. పాదసూచికలో మాత్రం హీబ్రూ సంపూర్ణరూపం మరియు తరువాతి క్రియకు సాధ్యమైన గతకాల పఠనాన్ని పూర్తిగా, సరిగ్గా తెలియజేశాం. ‘గమనిస్తున్నావు’ అనేది దేవుడు కేవలం చూస్తున్నాడని లేదా నిర్లక్ష్యం చేస్తున్నాడని అదనంగా చెప్పకుండా మూలంలోని శ్రద్ధగల చూపు/పరిశీలన భావాన్ని కాపాడుతుంది.
