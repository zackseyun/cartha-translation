  terminology: “దీవించు,” “ఉన్ని,” and “వెచ్చబడుట” are suitable modern-standard Telugu renderings. “గొర్రెల ఉన్ని” accurately conveys fleece/shorn wool without prematurely choosing between the lexical alternatives.
