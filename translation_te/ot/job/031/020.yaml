translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా ఉండేలా అనువదించబడింది. అయినప్పటికీ ‘నడుము నన్ను దీవించు’ అనే గుర్తించదగిన హీబ్రూ దేహాభివ్యక్తిని పాదటిప్పణితో నిలిపి, ప్రమాణ వాక్యపు అసంపూర్ణ ఉద్వేగాన్ని చివరి దీర్ఘగీతతో కాపాడింది.
