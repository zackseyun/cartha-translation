  yaml_path: translation/ot/job/031/020.yaml
  text: if his loins have not blessed me[b][a], and if he was not warmed by the fleece of my sheep—
translation:
  language: te
  text: 'అతని నడుములు నన్ను దీవించకపోయి ఉంటే[a],

    నా గొర్రెల ఉన్నితో అతడు వెచ్చబడకపోయి ఉంటే—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా ‘అతని నడుములు.’ బట్టలు పొంది వెచ్చబడిన అవసరస్థుని శరీరాన్ని సూచించే దేహాభివ్యక్తి ఇది.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם לֹא
  choice: చేయకపోయి ఉంటే
  rationale: యోబు చేస్తున్న ప్రమాణంలోని షరతును తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; వాక్యం తరువాతి స్వశాప ప్రమాణంతో పూర్తవుతుందనే ఉద్వేగాన్ని నిలుపుతుంది.
- source_word: בֵרֲכוּנִי
  choice: నన్ను దీవించకపోయి ఉంటే
  rationale: ברך అనే క్రియ యొక్క ప్రాథమిక భావమైన ‘దీవించు’ను నిలుపుతుంది. సందర్భంలో కృతజ్ఞత వ్యక్తమవుతున్నప్పటికీ, దానిని కేవలం ‘కృతజ్ఞత చెప్పు’గా కుదించదు.
- source_word: חֲלָצָיו
  choice: అతని నడుము
  rationale: శరీరంలోని నడుము భాగాన్ని సూచించే హీబ్రూ దేహాభివ్యక్తిని నిలుపుతుంది; ఇక్కడ అది బట్టలు పొంది వెచ్చబడిన అవసరస్థుని శరీరానికి ప్రతినిధిగా ఉంది.
- source_word: וּמִגֵּז
  choice: ఉన్నితో
  rationale: גֵּז గొర్రె బొచ్చు లేదా కత్తిరించిన ఉన్నిని సూచించగలదు. వెచ్చబడటానికి సాధనాన్ని తెలిపే సందర్భంలో ‘ఉన్నితో’ సహజంగా ఉంది.
- source_word: כְּבָשַׂי
  choice: నా గొర్రెల
  rationale: ఉన్ని ఇచ్చే జంతువులను సూచించే ఈ బహువచన స్వామ్యరూపానికి ‘నా గొర్రెల’ స్పష్టమైన, సహజమైన అనువాదం.
- source_word: יִתְחַמָּם
  choice: అతడు వెచ్చబడకపోయి ఉంటే
  rationale: Hitpael రూపంలోని ‘వెచ్చబడుట’ అనే ఫలిత భావాన్ని నిలుపుతుంది. ముందున్న אִם לֹא యొక్క ప్రతికూల షరతు ఈ సమాంతర పాదానికీ వర్తిస్తుందని తెలుగులో స్పష్టంగా చూపుతుంది.
