source:
  edition: WLC
  text: אִם אֶ֭שְׂמַח כִּי רַ֣ב חֵילִ֑/י וְ/כִֽי כַ֝בִּ֗יר מָצְאָ֥ה יָדִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/031/025.yaml
  text: if I rejoiced because my wealth was abundant[a], and because my hand had gained much—
translation:
  language: te
  text: నా సంపద విస్తారంగా ఉందని, నా చెయ్యి ఎంతో సంపాదించిందని[a] నేను సంతోషించి ఉంటే—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూలభాషలో అక్షరార్థంగా, “నా చెయ్యి ఎంతో కనుగొంది.” ఇది తన సొంత శక్తితో లేదా కృషితో సంపాదించడాన్ని సూచించే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: ఉంటే
  rationale: యోబు చేస్తున్న నిర్దోషిత్వ ప్రమాణంలోని షరతును తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אֶשְׂמַח
  choice: నేను సంతోషించి ఉంటే
  rationale: సంపదను కలిగి ఉండడాన్ని కాకుండా, దాని సమృద్ధిని బట్టి సంతోషించడాన్నే నైతిక అంశంగా నిలుపుతుంది.
- source_word: כִּי רַב חֵילִי
  choice: నా సంపద విస్తారంగా ఉందని
  rationale: חֵילִי ఇక్కడ భౌతిక సంపదను, רַב దాని సమృద్ధిని సూచిస్తాయి; కారణార్థకమైన כִּי భావాన్ని ‘అని’ సహజంగా మోస్తుంది.
- source_word: וְכִי כַבִּיר מָצְאָה יָדִי
  choice: నా చెయ్యి ఎంతో సంపాదించిందని
  rationale: అక్షరార్థంలోని ‘నా చెయ్యి కనుగొంది’ అనే హీబ్రూ నుడికారాన్ని సహజమైన తెలుగులో వ్యక్తిగత కృషి లేదా సామర్థ్యంతో ఎంతో పొందిన భావంగా అందిస్తుంది; ‘నా చెయ్యి’ రూపకాన్ని నిలుపుతుంది.
theological_decisions:
- issue: ఈ వాక్యం సంపదనే తప్పుపడుతుందా, లేక సంపద సమృద్ధిని మరియు స్వశక్తితో సంపాదించాననే భావాన్ని బట్టి సంతోషించడాన్నా?
  choice: సంపద విస్తారంగా ఉండడం వల్లను, తన చెయ్యి ఎంతో సంపాదించడం వల్లను తాను సంతోషించలేదని యోబు ప్రమాణపూర్వకంగా చెబుతున్నట్లు అనువదించబడింది.
  alternative: సంపదను కలిగి ఉండడమే తప్పన్నట్లు మరింత స్వేచ్ఛగా అనువదించడం.
  rationale: హీబ్రూ పాఠం సంపద స్వాధీనంలో ఉండడంపై కాక, అది విస్తారంగా ఉన్నందుకు సంతోషించడం మరియు ‘నా చెయ్యి’ సంపాదించిందనే వ్యక్తిగత సాధనపై దృష్టి పెడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా రూపొందించబడింది. షరతు భావం చివరనున్న ‘ఉంటే’ ద్వారా రెండు కారణ భాగాలకూ వర్తిస్తుంది. అసంపూర్ణ ప్రమాణ వాక్యం కొనసాగుతుందని చూపేందుకు చివర దీర్ఘవిరామ చిహ్నం ఉంచబడింది.
