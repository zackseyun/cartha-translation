  text: אִם עָ֭לַ/י אַדְמָתִ֣/י תִזְעָ֑ק וְ֝/יַ֗חַד תְּלָמֶ֥י/הָ יִבְכָּיֽוּ/ן־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/031/038.yaml
  text: If my land cries out against me[a], and its furrows weep together,
translation:
  language: te
  text: 'నా భూమి నాకు వ్యతిరేకంగా మొరపెడితే,

    దాని చాళ్లు కలిసి రోదిస్తే[a],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ఏడిస్తే’ అని కూడా అనువదించవచ్చు; ఇక్కడి హీబ్రూ క్రియ ఏడవడం లేదా విలపించడం అనే సాధారణ పదం. చాళ్ల గురించి దీనిని కవితాత్మకంగా వాడారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: అయితే / -తే
  rationale: యోబు నిర్దోషిత్వ ప్రమాణంలోని షరతును తెలుగులో సహజమైన క్రియాంత ప్రత్యయం ‘-తే’తో వ్యక్తం చేశాం.
- source_word: עָלַי
  choice: నాకు వ్యతిరేకంగా
  rationale: זעק అనే క్రియతో కలిసినప్పుడు על ఇక్కడ భూమి యోబుకు వ్యతిరేకంగా సాక్ష్యమిస్తున్నట్లు ప్రతికూల భావాన్ని ఇస్తుంది; కేవలం స్థలార్థకమైన ‘నా మీద’ కంటే ఈ ఎంపిక సందర్భోచితం.
- source_word: אַדְמָתִי
  choice: నా భూమి
  rationale: వ్యవసాయానికి సంబంధించిన నేల/పొలభూమిని సూచిస్తుంది. ‘నా భూమి’ ఆధునిక తెలుగులో సహజంగా ఉండి స్వామ్యార్థాన్ని నిలుపుతుంది.
- source_word: תִזְעָק
  choice: మొరపెడితే
  rationale: זעק బలమైన ఆర్తనాదాన్ని లేదా న్యాయం కోరే కేకను సూచిస్తుంది. ‘మొరపెట్టు’ భూమి చేసే నైతిక ఫిర్యాదు అనే వ్యక్తీకరణను నిలుపుతుంది.
- source_word: וְיַחַד
  choice: అన్నీ కలిసి
  rationale: יחד ఉమ్మడిగా లేదా ఏకకాలంలో జరిగే చర్యను సూచిస్తుంది. బహువచనమైన చాళ్లతో ‘అన్నీ కలిసి’ సహజంగా ఆ సమష్టి భావాన్ని తెలియజేస్తుంది.
- source_word: תְּלָמֶיהָ
  choice: దాని చాళ్లు
  rationale: תלם నాగలితో దున్నినప్పుడు ఏర్పడే furrowను సూచిస్తుంది. వ్యవసాయ సందర్భంలో ‘చాళ్లు’ సంక్షిప్తమైన, ఖచ్చితమైన తెలుగు పదం.
- source_word: יִבְכָּיוּן
  choice: రోదిస్తే
  rationale: בכה యొక్క ప్రాథమిక భావం ఏడవడం. ‘రోదించు’ మొదటి పాదంలోని ‘మొరపెట్టు’తో తేడాను ఉంచుతూ చాళ్ల వ్యక్తీకరణను, కవితాత్మక తీవ్రతను కాపాడుతుంది.
