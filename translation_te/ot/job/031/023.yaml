source:
  edition: WLC
  text: כִּ֤י פַ֣חַד אֵ֭לַ/י אֵ֣יד אֵ֑ל וּ֝/מִ/שְּׂאֵת֗/וֹ לֹ֣א אוּכָֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/job/031/023.yaml
  text: For calamity from God was a terror to me[b][a], and because of his majesty I could not endure.
translation:
  language: te
  text: ఎందుకంటే, దేవుని నుండి వచ్చే విపత్తు నాకు భయాన్ని కలిగించేది[a]; ఆయన మహిమ కారణంగా నేను తట్టుకొని నిలువలేకపోయేవాడిని[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దేవుని విపత్తు నాకు భయాన్ని కలిగించేది.’ హీబ్రూ పదబంధాన్ని అక్షరార్థంగా ‘దేవుని విపత్తు’ అని అనువదించవచ్చు; భావం బహుశా దేవుని నుండి వచ్చే విపత్తు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘ఆయన ఔన్నత్యం ఎదుట నేను తట్టుకొని నిలువలేకపోయేవాడిని.’ ఇక్కడి నామవాచకం ఉన్నతి, ఔన్నత్యం లేదా మహిమను సూచించవచ్చు; క్రియకు ‘చేయగలగడం’ లేదా ‘తట్టుకొని నిలవడం’ అనే భావాలు ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి వాక్యాల్లో యోబు చెప్పిన నైతిక నిగ్రహానికి కారణాన్ని పరిచయం చేస్తుంది.
- source_word: פַחַד אֵלַי
  choice: నాకు భయంకరంగా ఉండేది
  rationale: పחד్ సూచించే తీవ్రమైన భయాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తూ, నామవాచక భావాన్ని సాధ్యమైనంతవరకు నిలుపుతుంది.
- source_word: אֵיד אֵל
  choice: దేవుని నుండి వచ్చే విపత్తు
  rationale: నిర్మాణాన్ని కేవలం ‘దేవుని విపత్తు’ అని కాక, దేవుని నుండి సంభవించే విపత్తుగా అర్థం చేసుకోవడం సందర్భానికి సహజం; మూలంలోని సంబంధపు సందిగ్ధతను పాదసూచికలో ఉంచాం.
- source_word: וּמִשְּׂאֵתוֹ
  choice: ఆయన మహిమ కారణంగా
  rationale: שְׂאֵת అనే పదంలోని ఉన్నతి, ఔన్నత్యం, మహిమ అనే భావాల్లో సందర్భోచితమైన ‘మహిమ’ను ఎంచుకున్నాం; מִן‌ను కారణార్థకంగా గ్రహించాం.
- source_word: לֹא אוּכָל
  choice: నేను నిలువలేకపోయేవాడిని
  rationale: יכל యొక్క సామర్థ్య భావాన్ని కాపాడుతూ, దేవుని మహిమ ఎదుట తట్టుకొని నిలువలేని భావాన్ని సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: אֵל పదాన్ని ఎలా అనువదించాలి
  choice: దేవుడు
  alternative: శక్తిమంతుడు; ఏల్
  rationale: ఇక్కడ ప్రత్యేక నామరూపాన్ని తప్పనిసరిగా నిలుపవలసిన సూచన లేదు; దైవిక తీర్పు, మహిమను సూచించే సందర్భంలో ‘దేవుడు’ స్పష్టమైనది.
- issue: యోబును నిగ్రహించిన ప్రేరణ
  choice: దేవుని నుండి వచ్చే విపత్తుపట్ల భయం, ఆయన మహిమ ఎదుట నిలువలేమనే గ్రహింపు—రెండింటినీ నిలుపడం
  alternative: కేవలం శిక్షాభయం; కేవలం దైవ ఔన్నత్యంపై అమూర్తమైన భక్తి
  rationale: మూలవాక్యం తీర్పుపట్ల భయాన్నీ, దేవుని ఉన్నతి లేదా మహిమ ఎదుట మానవ అశక్తతనూ కలిపి ఉంచుతుంది; వాటిలో ఏదో ఒకటిగా భావాన్ని కుదించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలిని వాడాం. ‘విపత్తు,’ ‘మహిమ,’ ‘నిలువలేకపోయేవాడిని’ అనే పదాలు కవితాత్మక గంభీరతను, మూలంలోని దైవభయాన్ని నిలుపుతాయి.
