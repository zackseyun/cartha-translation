    reason: lexical_alternative
  - marker: b
    text: 'అక్షరార్థంగా, ‘కీడు అతన్ని కనుగొన్నప్పుడు’; భావం: కీడు అతనికి సంభవించినప్పుడు లేదా అతన్ని పట్టుకున్నప్పుడు.'
