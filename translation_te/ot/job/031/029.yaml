  alternative: ‘నా శత్రువు ఆపదలో పడినప్పుడు నేను సంతోషించి, అతనికి కీడు జరిగినప్పుడు Schadenfreudeతో గర్వించాను’ అనే మరింత తీవ్రమైన భావానువాదం
  rationale: హెబ్రీ వాక్యం ఇతరుని హానిలో తప్పుగా ఆనందించడాన్ని సూచిస్తుంది; అయితే ప్రధాన పాఠంలో ‘వెక్కిరిస్తూ ఆనందించడం’ వంటి అధిక తీవ్రతను చేర్చకుండా, ఆ సాధ్యమైన ఛాయను పాదసూచికలో భద్రపరుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనా సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ‘శత్రువు’ అనే సంప్రదాయ సంక్షిప్త పదానికి బదులుగా మూలంలోని క్రియాత్మక భావాన్ని నిలుపుతూ ‘నన్ను ద్వేషించేవాడు’ అని వాడబడింది. వాక్యం తదుపరి ప్రమాణ-ఫలిత వాక్యంతో కొనసాగుతున్నందున చివర దీర్ఘవిరామ చిహ్నం ఉంచబడింది.
