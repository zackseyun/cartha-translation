  yaml_path: translation/ot/job/031/018.yaml
  text: for from my youth he raised me like a father[b][a], and from my mother’s womb I guided her.
translation:
  language: te
  text: ఎందుకంటే, నా బాల్యం నుంచే అతడు నన్ను తండ్రివలె పెంచాడు[a]; నా తల్లి గర్భం నుంచే నేను ఆమెను[b] నడిపించాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఈ పాదంలోని హెబ్రీ క్లిష్టంగా ఉంది. దీనిని “అతడు నన్ను తండ్రివలె ఎదిగేలా చేశాడు” అని, లేదా “నేను అతణ్ణి తండ్రివలె పెంచాను” అని కూడా అర్థం చేసుకుంటారు. రెండవ అవగాహనలో యోబు అనాథ పట్ల తాను చూపిన సంరక్షణ గురించి మాట్లాడుతున్నాడు.
    reason: alternative_reading
  - marker: b
    text: “ఆమెను” అనే స్త్రీలింగ సూచన బహుశా ముందటి వచనంలోని విధవరాలిని సూచిస్తుంది.
    reason: cross_reference
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: చుట్టుపక్కల సందర్భంలో యోబు తన నిరాకరణకు కారణాన్ని తెలియజేస్తున్నందున కారణార్థక అనుసంధానాన్ని నిలుపుతుంది.
- source_word: מִנְּעוּרַי
  choice: నా యౌవనం నుంచే
  rationale: מִן ఉపసర్గలోని ఆరంభకాల భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: גְּדֵלַנִי
  choice: అతడు నన్ను పెంచాడు
  rationale: మసొరెటిక్ పాఠంలోని 3వ పురుష ఏకవచన కర్తను, 1వ పురుష ఏకవచన కర్మ ప్రత్యయాన్ని నేరుగా నిలుపుతుంది; అయితే ఈ హెబ్రీ పదబంధం క్లిష్టమైనందున ప్రత్యామ్నాయ అవగాహనలను పాదసూచికలో ఇచ్చాం.
- source_word: כְאָב
  choice: తండ్రిలా
  rationale: כְ పోలికను సంక్షిప్తంగా, సహజంగా తెలుపుతుంది.
- source_word: וּמִבֶּטֶן אִמִּי
  choice: నా తల్లి గర్భం నుంచే
  rationale: జీవితంలోని అత్యంత తొలిదశను సూచించే హెబ్రీ కాలప్రయోగాన్ని నిలుపుతుంది.
- source_word: אַנְחֶנָּה
  choice: నేను ఆమెను నడిపించాను
  rationale: נחה హిఫీల్ రూపంలోని నడిపించడం లేదా మార్గం చూపడం అనే భావాన్నీ, 3వ పురుష స్త్రీలింగ ఏకవచన ప్రత్యయాన్నీ కాపాడుతుంది.
theological_decisions:
- issue: వచనంలోని పురుషలింగ సూచన నుంచి స్త్రీలింగ సూచనకు మార్పు
  choice: మొదటి భాగంలోని ‘అతడు’ను, రెండవ భాగంలోని ‘ఆమెను’ను యథాతథంగా ఉంచడం
  alternative: రెండు భాగాలనూ అనాథలు, విధవరాళ్ల పట్ల యోబు చూపిన సంరక్షణకు సాధారణీకరించి లింగభేదాన్ని తొలగించడం
  rationale: మూలపాఠంలోని వ్యాకరణ సంకేతాలు ఉద్దేశపూర్వకంగా పరిష్కరించని ఉద్రిక్తతను కలిగిస్తాయి. వాటిని సులభతరం చేయకుండా పాఠ్యంలో కనిపించేలా ఉంచాం; ‘ఆమె’ ఎవరిని సూచించవచ్చో పాదసూచిక వివరిస్తుంది.
- issue: גְּדֵלַנִי అనే క్లిష్ట రూపం యొక్క అర్థం
  choice: మసొరెటిక్ రూపాన్ని అనుసరించి ‘అతడు నన్ను పెంచాడు’
  alternative: ‘నేను అతణ్ణి తండ్రిలా పెంచాను’ లేదా ‘అతడు నాతో తండ్రి దగ్గర పెరిగినట్టుగా పెరిగాడు’
  rationale: లిఖిత రూపంలోని పురుష ఏకవచన కర్త, మొదటి పురుష కర్మను ప్రధాన పాఠ్యంలో నిలిపాం. సందర్భం వేరొక అవగాహనకు దారితీయగలదని పాదసూచికలో స్పష్టంగా తెలియజేశాం; ఏకైక వ్యాఖ్యానాన్ని సిద్ధాంతపరంగా రుద్దలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనా సాధారణ పాఠకులకు అర్థమయ్యే శైలిని వాడాం. మూలపాఠంలోని అసాధారణమైన ‘అతడు నన్ను పెంచాడు’ అనే నిర్మాణాన్ని ప్రధాన పాఠ్యంలో నిలిపి, దాని క్లిష్టతను పాదసూచికలో వివరించాం.
