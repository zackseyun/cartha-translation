source:
  edition: WLC
  text: וּ/מָ֣ה אֶֽ֭עֱשֶׂה כִּֽי יָק֣וּם אֵ֑ל וְ/כִֽי יִ֝פְקֹ֗ד מָ֣ה אֲשִׁיבֶֽ/נּוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/031/014.yaml
  text: And what would I do when God rises up? And when he calls me to account[a], what would I answer him?
translation:
  language: te
  text: దేవుడు లేచినప్పుడు మరి నేను ఏమి చేయగలను? ఆయన నన్ను విచారించినప్పుడు[a] నేను ఆయనకు ఏమి జవాబివ్వగలను?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆయన నన్ను పరిశీలించినప్పుడు,’ ‘ఆయన నా చేత లెక్క అడిగినప్పుడు.’ హీబ్రూ క్రియకు సందర్శించడం, పరిశీలించడం, లెక్క అడగడం అనే అర్థాలు ఉండవచ్చు; ఇక్కడి సందర్భం న్యాయపరమైన జవాబుదారీతనాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָה אֶעֱשֶׂה
  choice: నేను ఏమి చేయగలను?
  rationale: సంధానార్థక వావ్‌తో మొదలయ్యే ఈ అలంకారిక ప్రశ్న ముందున్న ఆలోచనను కొనసాగిస్తుంది. తెలుగు వాక్యప్రవాహంలో ప్రత్యేకంగా ‘మరి’ చేర్చకుండానే ఆ అనుసంధానం సహజంగా వ్యక్తమవుతుంది. అసంపూర్ణ క్రియ ఇక్కడ ఊహిత సందర్భంలో తన అసమర్థతను తెలిపే ‘చేయగలను’గా ఇవ్వబడింది.
- source_word: כִּי יָקוּם אֵל
  choice: దేవుడు లేచినప్పుడు
  rationale: כִּי ఇక్కడ కాలార్థకంగా ఉంది. קום అనే క్రియలోని ‘లేచుట’ రూపకాన్ని నిలిపి, దేవుడు తీర్పు తీర్చడానికి చర్యకు పూనుకునే భావాన్ని అతిగా వివరించకుండా ఉంచుతుంది.
- source_word: וְכִי יִפְקֹד
  choice: ఆయన నన్ను విచారించినప్పుడు
  rationale: פקדకు సందర్శించు, పరిశీలించు, లెక్క అడుగు వంటి విస్తృత అర్థపరిధి ఉంది. తరువాతి ‘జవాబివ్వడం’తో ఉన్న సమాంతరతలో న్యాయపరమైన పరిశీలన ప్రధానమైనందున ‘విచారించినప్పుడు’ సహజంగా సరిపోతుంది; ప్రత్యామ్నాయాలను పాదటిప్పణిలో ఉంచాం.
- source_word: מָה אֲשִׁיבֶנּוּ
  choice: నేను ఆయనకు ఏమి జవాబివ్వగలను?
  rationale: שוב హిఫిల్ రూపం ఇక్కడ ‘ప్రత్యుత్తరం ఇవ్వడం’ అనే నుడికారార్థంలో ఉంది; 3వ పురుష ఏకవచన ప్రత్యయం ‘ఆయనకు’గా వ్యక్తమైంది. ఊహిత దైవ విచారణ ఎదుట జవాబు చెప్పలేని స్థితిని ‘జవాబివ్వగలను’ తెలియజేస్తుంది.
theological_decisions:
- issue: దైవిక న్యాయవిచారణ దృశ్యం
  choice: దేవుడు లేచి యోబును విచారించే న్యాయపరమైన భావాన్ని ఉంచడం; దానిని అంతిమ తీర్పుకే పరిమితం చేయకపోవడం.
  alternative: ‘సందర్శించినప్పుడు’ లేదా ‘పరిశీలించినప్పుడు’ అని సాధారణ పర్యవేక్షణ భావంతో అనువదించడం; లేదా దీనిని ప్రత్యేకంగా అంత్యకాల తీర్పుగా నిర్వచించడం.
  rationale: ‘లేచుట,’ ‘విచారించుట,’ ‘జవాబివ్వుట’ అనే సమాంతర పదచిత్రాలు దైవిక జవాబుదారీతనాన్ని సూచిస్తాయి. అయితే మూలవాక్యం దీనిని ప్రత్యేకంగా అంతిమ తీర్పుగా నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన ప్రశ్నారూపం వాడబడింది. ‘లేచినప్పుడు’ అనే మూల రూపకం నిలుపబడింది; ‘విచారించినప్పుడు’ సాధారణ పాఠకునికి అర్థమయ్యేలా న్యాయపరమైన ఛాయను అందిస్తుంది.
