translation:
  language: te
  text: నా గుడారంలోని మనుషులు[a], ‘అతని మాంసంతో[b] తృప్తిపడనివారు ఎవరున్నారు?’ అని చెప్పకపోయి ఉంటే—
  philosophy: optimal-equivalence
  footnotes:
