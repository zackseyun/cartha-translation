id: JOB.31.9
reference: Job 31:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אִם נִפְתָּ֣ה לִ֭בִּ/י עַל אִשָּׁ֑ה וְ/עַל פֶּ֖תַח רֵעִ֣/י אָרָֽבְתִּי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/031/009.yaml
  text: If my heart has been enticed by a woman[a], and I have lain in wait at my neighbor's door[b],
translation:
  language: te
  text: ఒక స్త్రీపట్ల నా హృదయం మోహానికి లోనై ఉంటే[a], నా పొరుగువాని తలుపు దగ్గర నేను మాటువేసి ఉంటే[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఆకర్షితమై ఉంటే,’ ‘మోసపోయి ఉంటే,’ లేదా ‘ప్రలోభానికి లోనై ఉంటే.’ హెబ్రీయ క్రియకు ఈ భావాలు ఉండగలవు; ఇక్కడ లైంగిక శోధన సందర్భం ఉంది.
    reason: lexical_alternative
  - marker: b
    text: ‘నా స్నేహితుని తలుపు దగ్గర’ అని కూడా అనువదించవచ్చు. హెబ్రీయ పదానికి ‘పొరుగువాడు,’ ‘స్నేహితుడు,’ లేదా ‘సహచరుడు’ అనే అర్థాలు ఉండగలవు.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִפְתָּה
  choice: మోహానికి లోనై ఉంటే
  rationale: నిఫ్అల్ రూపం మోసపోవడం, ఆకర్షితమవడం లేదా ప్రలోభానికి లోనవడం అనే భావాలను ఇవ్వగలదు. లైంగిక శోధన సందర్భంలో ‘మోహానికి లోనై’ అంతరంగ కోరికను సహజంగా తెలియజేస్తుంది; స్త్రీనే క్రియాశీలంగా ప్రలోభపెట్టిందని అనవసరంగా సూచించదు.
- source_word: לִבִּי
  choice: నా హృదయం
  rationale: హెబ్రీయ భాషలో ‘హృదయం’ కోరిక, ఆలోచన, సంకల్పం కలిగిన అంతరంగ వ్యక్తిని సూచిస్తుంది. తెలుగు భాషలోనూ ఈ రూపకం సహజంగా అర్థమవుతుంది.
- source_word: עַל אִשָּׁה
  choice: ఒక స్త్రీపట్ల
  rationale: עַל అనే విభక్తి ఇక్కడ మోహానికి సంబంధించిన వ్యక్తిని సూచిస్తుంది. ‘స్త్రీపట్ల’ మూలంలోని సంబంధాన్ని కాపాడుతూ, స్త్రీ వల్లనే మోహం కలిగిందనే భావాన్ని బలవంతంగా చేర్చదు.
- source_word: פֶּתַח
  choice: తలుపు దగ్గర
  rationale: పదానికి తలుపు, ద్వారం, ప్రవేశస్థలం అనే అర్థాలు ఉన్నాయి. మాటువేయడం అనే క్రియతో ‘తలుపు దగ్గర’ ఆధునిక తెలుగులో సహజంగా ఉంటుంది.
- source_word: רֵעִי
  choice: నా పొరుగువాని
  rationale: רֵעַ పొరుగువాడు, స్నేహితుడు లేదా సహచరుడు అని అర్థమవుతుంది. ఈ సామాజిక-నైతిక సందర్భంలో ‘పొరుగువాడు’ విస్తృతమైన సంబంధాన్ని సరిగ్గా తెలియజేస్తుంది.
- source_word: אָרָבְתִּי
  choice: నేను మాటువేసి ఉంటే
  rationale: ఈ క్రియ రహస్యమైన లేదా దురుద్దేశపూర్వకమైన నిరీక్షణను సూచిస్తుంది. ‘మాటువేయడం’ ఉద్దేశపూర్వకంగా దాక్కొని వేచి ఉండే భావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
theological_decisions:
- issue: వ్యభిచారానికి సంబంధించిన యోబు ప్రమాణంలోని నైతిక క్రమం
  choice: మొదట అంతరంగ మోహం, తరువాత పొరుగువాని ఇంటి దగ్గర ఉద్దేశపూర్వకంగా మాటువేయడం అనే క్రమాన్ని నిలుపడం.
  alternative: దీనిని కేవలం ప్రేమాసక్తిగా మృదువుగా అనువదించడం, లేదా నేరుగా వ్యభిచార ప్రయత్నమని మరింత స్పష్టీకరించడం.
  rationale: హెబ్రీయ పాఠం అంతరంగ కోరికనూ రహస్య కార్యాచరణనూ ఉంచుతుంది; అయితే జరగబోయే కార్యాన్ని స్పష్టంగా పేరుపెట్టదు. అందువల్ల నైతిక తీవ్రతను కాపాడుతూ మూలంలో లేని వివరాలను చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైన ప్రమాణ వాక్యశైలిని నిలుపుతూ సాధారణ పాఠకులకు సహజంగా ఉండే పదాలు వాడబడ్డాయి. ఈ వాక్యం తరువాతి అపోదోసిస్‌తో కొనసాగే షరతు వాక్యం కనుక ముగింపులో కామా ఉంచబడింది.
