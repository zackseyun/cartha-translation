source:
  edition: WLC
  text: כִּ֤י אֶֽעֱר֨וֹץ הָ֘מ֤וֹן רַבָּ֗ה וּ/בוּז מִשְׁפָּח֥וֹת יְחִתֵּ֑/נִי וָ֝/אֶדֹּ֗ם לֹא אֵ֥צֵא פָֽתַח׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/031/034.yaml
  text: because I feared the great multitude[a], and the contempt of clans terrified me[b], so that I kept silent and did not go out the door—
translation:
  language: te
  text: ఎందుకంటే, నేను గొప్ప జనసమూహానికి భయపడ్డాను; వంశాల[a] ధిక్కారం నన్ను బెదరగొట్టింది; నేను మౌనంగా ఉండి గడప దాటి బయటికి వెళ్లలేదు—[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలోని పదం విస్తృత కుటుంబాలు లేదా బంధుత్వ సమూహాలను కూడా సూచించవచ్చు; అందుకే ఇక్కడ «వంశాలు» అని అనువదించబడింది.
    reason: lexical_alternative
  - marker: b
    text: ఈ వచనం యోబు తన నిర్దోషిత్వాన్ని ప్రమాణపూర్వకంగా ప్రకటిస్తున్న భాగంలో ఉంది. హీబ్రూ వాక్యనిర్మాణం సంక్షిప్తంగా ఉంది; భావం, ప్రజల అభిప్రాయానికి భయపడి అతడు మౌనంగా ఉండి ఇంట్లోనే ఉండిపోయాడనే ఊహాత్మక పరిస్థితిని సూచిస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ఇది ముందున్న ప్రమాణాత్మక-షరతు సందర్భంలో ఊహించిన కారణాన్ని పరిచయం చేస్తుంది; తెలుగు వాక్యంలో కారణ సంబంధాన్ని సహజంగా ఉంచుతుంది.
- source_word: אֶעֱרוֹץ
  choice: నేను భయపడి
  rationale: ערץ లోని తీవ్రమైన భయభావాన్ని స్పష్టంగా, సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: הָמוֹן רַבָּה
  choice: గొప్ప జనసమూహం
  rationale: హామోన్ అనే పెద్ద గుంపు భావాన్నీ, רבה సూచించే విస్తారతనూ నిలుపుతుంది.
- source_word: וּבוּז מִשְׁפָּחוֹת
  choice: వంశాల తిరస్కారం
  rationale: בוז యొక్క ధిక్కార/తృణీకార భావాన్ని ‘తిరస్కారం’ తెలియజేస్తుంది; משׁפחות ఇక్కడ కేవలం చిన్న కుటుంబాలకన్నా విస్తృతమైన బంధుత్వ సమూహాలను సూచించగలదని ‘వంశాలు’ ప్రతిబింబిస్తుంది.
- source_word: יְחִתֵּנִי
  choice: నన్ను బెదరగొట్టినందువల్ల
  rationale: హిఫిల్ రూపంలోని భయపెట్టడం, ధైర్యం చెడగొట్టడం అనే బలమైన కారణార్థాన్ని అందిస్తుంది.
- source_word: וָאֶדֹּם
  choice: మౌనంగా ఉండి
  rationale: דמם లోని మౌనంగా లేదా నిశ్చలంగా ఉండే భావాన్ని సహజంగా వ్యక్తం చేస్తుంది; సందర్భంలో ఇది భయానికి వచ్చిన ఫలితంగా నిలుస్తుంది.
- source_word: לֹא אֵצֵא פָתַח
  choice: గడప దాటి బయటికి వెళ్లలేదు
  rationale: פתח ను కేవలం తలుపు వస్తువుగా కాక, ఇంటి ప్రవేశం/గడపగా తీసుకొని, బయటకు రాక ఇంట్లోనే ఉండిపోయిన దృశ్యాన్ని తెలుగులో సహజంగా చూపుతుంది.
theological_decisions:
- issue: వాక్యం ప్రమాణంలోని షరతా, లేక నేరుగా చెప్పిన కారణమా
  choice: తెలుగు ప్రధాన వాక్యంలో కారణ నిర్మాణాన్ని ఉంచి, చివర ప్రశ్నార్థక రూపంతో నిర్దోషిత్వ ప్రమాణంలోని ఊహాత్మక భావాన్ని సూచించడం
  alternative: ‘ఒకవేళ ... అయితే’ అని స్పష్టమైన షరతుగా అనువదించడం
  rationale: హీబ్రూ כִּי కారణార్థాన్ని అనుమతిస్తుంది, అయితే విస్తృత సందర్భం ఇది యోబు చేసిన పని కాదని సూచించే ప్రమాణాత్మక ప్రశ్న. రెండింటి మధ్య ఉన్న ఉద్వేగాన్ని పూర్తిగా తొలగించకుండా ఈ రూపం నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కావ్య-న్యాయశైలి ఉంచబడింది. ‘గడప దాటి’ అనే సహజ తెలుగు ప్రయోగం మూలంలోని ప్రవేశద్వార దృశ్యాన్ని స్పష్టపరుస్తుంది; చివరి దీర్ఘరేఖ వాక్యం కొనసాగుతున్న ప్రమాణ భాగమని సూచిస్తుంది.
