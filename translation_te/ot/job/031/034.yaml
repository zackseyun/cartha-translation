    issue: The closing interrogative «వెళ్లలేదా» is unsupported by the clause as translated.
    rationale: The Hebrew has «I did not go out [the] entrance/doorway,» and the English audit likewise renders a declarative clause. The wider oath setting may imply an unspoken condition, but this should not be resolved by adding a question mark to this verse.
  - severity: low
    issue: The single end-of-verse footnote combines two distinct audit-note functions and does not anchor the lexical alternative near «వంశాలు».
    rationale: A lexical note after «వంశాల» and a contextual note after the fear/silence sequence more transparently preserve the intended anchors and explanations.
