  source_fidelity: The first verb טחן means ‘grind’ (normally grain), not ‘scatter/winnow.’ The draft’s ‘విసరాలి’ therefore mistranslates the key concrete image. ‘రుబ్బాలి’ restores it. The spatial and deliberately euphemistic wording of the second colon is retained, with its likely sexual force confined to the footnote.
  naturalness: ‘నా భార్య వేరొక పురుషుని కోసం రుబ్బాలి’ is natural, concise modern Telugu in this curse formulation. ‘ఆమె మీద మోకరించాలి’ is a natural rendering of the spatial expression while preserving the Hebrew’s stark, indirect wording.
  terminology: ‘రుబ్బాలి’ accurately conveys grinding. ‘వేరొక పురుషుడు’ and ‘ఇతర పురుషులు’ correctly make explicit the masculine personal referents supplied by context. The footnote appropriately identifies, but does not impose on the main text, the probable sexual euphemism.
