  text: then let my wife grind for another man[a], and let other men kneel over her.
translation:
  language: te
  text: అప్పుడు నా భార్య వేరొక పురుషుని కోసం రుబ్బాలి; ఇతర పురుషులు ఆమె మీద మోకరించాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఇతర పురుషులు ఆమెతో పడుకోవాలి.” ఈ సందర్భంలో “ఆమె మీద మోకరించాలి” అనేది బహుశా లైంగిక సభ్యోక్తి.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּטְחַן
  choice: విసరాలి
  rationale: טחן అనే క్రియకు ప్రాథమిక అర్థం ధాన్యాన్ని విసరడం. శాపవాక్యంలోని దాస్యసదృశ శ్రమ అనే స్పష్టమైన చిత్రాన్ని ప్రధాన పాఠంలో నిలుపుతూ, సందర్భంలోని లైంగిక అవమాన సూచనను పరోక్షంగానే ఉంచుతుంది.
- source_word: לְאַחֵר
  choice: వేరొక పురుషుని కోసం
  rationale: אַחֵר అంటే ‘వేరొకడు/మరొకడు.’ భార్యతో ఇతర పురుషుల సంబంధమే సందర్భం కాబట్టి ‘పురుషుడు’ అని స్పష్టం చేయడం సహజమైన తెలుగు.
- source_word: אִשְׁתִּי
  choice: నా భార్య
  rationale: మొదటి పురుష ఏకవచన ప్రత్యయంతో ఉన్న אִשָּׁהకు సందర్భానుగుణమైన సాధారణ అర్థం ‘నా భార్య.’
- source_word: וְעָלֶיהָ
  choice: ఆమెపై
  rationale: עַל కు ఇక్కడి స్థలార్థాన్ని సహజంగా నిలుపుతుంది; మూలంలోని శారీరక చిత్రాన్ని మృదూకరించదు.
- source_word: יִכְרְעוּן
  choice: మోకరించాలి
  rationale: כרע సాధారణంగా ‘మోకరించు, వంగు’ అని అర్థం. ఈ సందర్భంలో ఇది లైంగిక సభ్యోక్తి కావచ్చు; ప్రధాన పాఠంలో ప్రత్యక్ష చిత్రాన్ని ఉంచి, సంభావ్య భావాన్ని పాదటిప్పణిలో తెలియజేశారు.
- source_word: אֲחֵרִין
  choice: ఇతర పురుషులు
  rationale: పుంలింగ బహువచన రూపం సందర్భంలో ఇతర మగవారిని సూచిస్తుంది; ‘ఇతర పురుషులు’ ఆధునిక తెలుగులో స్పష్టంగా ఉంటుంది.
theological_decisions:
- issue: లైంగిక సభ్యోక్తిని ప్రధాన పాఠంలో స్పష్టంగా చెప్పాలా
  choice: ‘విసరాలి / ఆమెపై మోకరించాలి’ అనే మూలంలోని స్పష్ట చిత్రాలను ప్రధాన పాఠంలో నిలిపి, సంభావ్య లైంగిక భావాన్ని పాదటిప్పణిలో ఇవ్వడం.
  alternative: ‘నా భార్య వేరొక పురుషునితో పడుకోవాలి; ఇతర పురుషులు ఆమెతో సంభోగించాలి’ అని స్పష్టీకరించడం.
  rationale: హీబ్రూ పాఠం సంభోగాన్ని నేరుగా తెలిపే క్రియను వాడకుండా, సందర్భంలో సభ్యోక్తులుగా పనిచేసే concrete క్రియలను ఉపయోగిస్తుంది. అసలులోని ఉద్దేశపూర్వక పరోక్షతను, భావసందిగ్ధతను కాపాడటం సముచితం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన శాపవాక్య శైలిని వాడాం. ‘విసరాలి’ గ్రామీణ ధాన్య ప్రక్రియను సూచించే సహజ క్రియ; ‘మోకరించాలి’ మూలంలోని శరీర భంగిమను, దాని ఉద్దేశపూర్వక పరోక్షతను నిలుపుతుంది.
