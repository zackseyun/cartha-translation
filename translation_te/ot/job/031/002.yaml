source:
  edition: WLC
  text: וּ/מֶ֤ה חֵ֣לֶק אֱל֣וֹהַּ מִ/מָּ֑עַל וְֽ/נַחֲלַ֥ת שַׁ֝דַּ֗י מִ/מְּרֹמִֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/031/002.yaml
  text: And what is the portion from God above[a], and the inheritance from the Almighty from on high?
translation:
  language: te
  text: మరి, పై నుండి దేవుడు ఇచ్చే భాగమేమిటి, ఉన్నత స్థలాల నుండి సర్వశక్తిమంతుడు ఇచ్చే స్వాస్థ్యమేమిటి?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పైనున్న దేవుని భాగమేమిటి, ఉన్నత స్థలాల్లోనున్న సర్వశక్తిమంతుని స్వాస్థ్యమేమిటి?” హీబ్రూ పదబంధాలను దైవ సూచనలను విశేషించేవిగా కూడా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֶה
  choice: మరి ... ఏమిటి?
  rationale: ముందటి వాదనను కొనసాగించే וְ సంధాన భావాన్ని ‘మరి’ తెలియజేస్తుంది; מֶה అలంకారప్రశ్నను ‘ఏమిటి?’గా సహజంగా వ్యక్తం చేస్తుంది.
- source_word: חֵלֶק
  choice: భాగం
  rationale: కేటాయించబడే వాటా లేదా భాగం అనే సాధారణ అర్థాన్ని ఇస్తుంది; సమాంతరంగా వచ్చే ‘స్వాస్థ్యం’తో చక్కగా సరిపోతుంది.
- source_word: אֱלוֹהַּ
  choice: దేవుడు
  rationale: యోబు గ్రంథంలో దేవునికి వాడిన ఏకవచన కావ్యరూపానికి ఆధునిక తెలుగులో సూటిగా అర్థమయ్యే సమానార్థకం.
- source_word: מִמָּעַל
  choice: పైనున్న
  rationale: ‘పై నుండి’ అనే క్రియావిశేషణార్థం సాధ్యమైనప్పటికీ, ప్రధాన పాఠంలో దీనిని దేవునితో అనుసంధానించి ‘పైనున్న దేవుడు’ అనే సహజమైన కావ్యప్రయోగంగా ఉంచాం; ప్రత్యామ్నాయ నిర్మాణాన్ని పాదటిప్పణిలో తెలిపాం.
- source_word: וְנַחֲלַת
  choice: స్వాస్థ్యం
  rationale: నַחֲלָהలోని వారసత్వంగా లేదా కేటాయింపుగా పొందే ఆస్తి భావాన్ని ‘స్వాస్థ్యం’ కాపాడుతుంది; חֵלֶקతోని కావ్య సమాంతరతను నిలుపుతుంది.
- source_word: שַׁדַּי
  choice: సర్వశక్తిమంతుడు
  rationale: దైవ బిరుదును లిప్యంతరీకరించకుండా దాని స్థిరమైన తెలుగు అర్థంతో అనువదించాం.
- source_word: מִמְּרֹמִים
  choice: ఉన్నత స్థలాల్లోనున్న
  rationale: బహువచన ‘ఉన్నత స్థలాలు/ఎత్తులు’ అనే భావాన్ని కాపాడుతూ ప్రధాన పాఠంలో ఈ పదబంధాన్ని సర్వశక్తిమంతునితో అనుసంధానించాం; ‘ఉన్నత స్థలాల నుండి’ అనే క్రియావిశేషణ ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
theological_decisions:
- issue: హీబ్రూ కావ్యంలో దైవ నామాలు, బిరుదులు
  choice: אֱלוֹהַּను ‘దేవుడు’గా, שַׁדַּיను ‘సర్వశక్తిమంతుడు’గా అనువదించడం
  alternative: ‘దేవుడు ... షద్దయి’ అని ఒక బిరుదును లిప్యంతరీకరించడం
  rationale: ఈ రెండు దైవ సూచనలు సమాంతరంగా ఉన్నాయి. రెండింటి అర్థాన్నీ అనువదించడం ఆధునిక పాఠకులకు స్పష్టంగా ఉండి, మూలంలోని కావ్య సమాంతరతను కాపాడుతుంది.
- issue: מִמָּעַל మరియు מִמְּרֹמִים పదబంధాల అనుసంధానం
  choice: ప్రధాన పాఠంలో వాటిని దైవ సూచనలను విశేషించేలా అనువదించడం
  alternative: ‘పై నుండి ... ఉన్నత స్థలాల నుండి’ అని కేటాయించబడే భాగం, స్వాస్థ్యం వచ్చే మూలాన్ని క్రియావిశేషణ రీతిలో చూపించడం
  rationale: హీబ్రూ పదక్రమం రెండు అనుసంధానాలకూ అవకాశం ఇస్తుంది. ప్రధాన పాఠం సహజమైన తెలుగు కావ్య నిర్మాణాన్ని ఎంచుకుంటుంది; అయితే దేవుని కేటాయింపు పరలోక మూలాన్ని నొక్కిచెప్పే ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో స్పష్టంగా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కావ్య ప్రశ్నారూపం వాడబడింది. మూలంలోని రెండు సమాంతర ప్రశ్నాంశాలు, దైవ బిరుదుల భేదం, ‘భాగం/స్వాస్థ్యం’ జంట నిలుపబడ్డాయి.
