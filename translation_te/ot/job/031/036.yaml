  text: Surely I would carry it on my shoulder[a]; I would bind it on myself like a crown.
translation:
  language: te
  text: 'నిశ్చయంగా దాన్ని నా భుజం మీద మోసేవాడిని;


    కిరీటంలా[a] దాన్ని ధరించుకొనేవాడిని.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీలో ‘కిరీటాలు’ అని బహువచనం ఉంది; ఇది ఘనతను సూచించే బహువచనం కావచ్చు. అందుకే ప్రధాన పాఠంలో ‘కిరీటంలా’ అని అనువదించబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם לֹא
  choice: నిశ్చయంగా
  rationale: ఇక్కడ ఇది షరతును సూచించకుండా, ప్రమాణ సందర్భంలో బలమైన నిశ్చయాన్ని వ్యక్తం చేస్తుంది.
- source_word: עַל שִׁכְמִי
  choice: నా భుజం మీద
  rationale: హెబ్రీ ఏకవచన రూపాన్నీ, పత్రాన్ని బహిరంగంగా మోసే దృశ్యాన్నీ సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: אֶשָּׂאֶנּוּ
  choice: దాన్ని ... మోస్తాను
  rationale: נשׂא అనే క్రియకు ఇక్కడ మోయడం అనే అర్థం సరిపోతుంది; ఆరోపణ పత్రాన్ని సిగ్గులేకుండా తనపై మోస్తాననే భావాన్ని తెలియజేస్తుంది.
- source_word: אֶעֶנְדֶנּוּ
  choice: దాన్ని ధరించుకుంటాను
  rationale: ענד అనేది ఆభరణాన్ని కట్టుకోవడం లేదా ధరించడాన్ని సూచిస్తుంది. తెలుగులో ‘ధరించుకుంటాను’ సహజంగా ఉండి, కిరీటపు రూపకాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: עֲטָרוֹת
  choice: కిరీటంలా
  rationale: మూలంలో ఇది బహువచన రూపమైనప్పటికీ, అది తీవ్రతను సూచించే బహువచనం కావచ్చు లేదా కిరీటంవంటి అలంకారాన్ని సూచించవచ్చు. తెలుగు ఉపమానంలో ఏకవచనం సహజంగా ఉంటుంది; మూలంలోని బహువచనాన్ని పాదటిప్పణిలో తెలిపాం.
- source_word: לִי
  choice: ధరించుకుంటాను
  rationale: ענד తో వచ్చిన ఈ దత్తి సర్వనామం, యోబు దాన్ని తనకే ధరించుకుంటాడనే ఆత్మనిర్దేశక భావాన్ని ఇస్తుంది; తెలుగులో క్రియలోని ‘కొను’ రూపం ఆ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
