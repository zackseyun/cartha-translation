review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the emphatic oath-context force, the shoulder-bearing image, and the crown-like adornment. However, the Hebrew imperfects in this context are better represented in Telugu as a contingent/volitional statement ('would carry/wear') rather than straightforward future forms ('will carry/wear').
  naturalness: The wording is clear and suitably dignified in modern standard Telugu. Changing the verbs to 'మోసేవాడిని' and 'ధరించుకొనేవాడిని' makes the line more natural for Job's avowal and better reflects its rhetorical force.
  terminology: ‘భుజం,’ ‘మోసేవాడిని,’ and ‘ధరించుకొనేవాడిని’ are appropriate. ‘కిరీటంలా’ is an idiomatic singular rendering of the Hebrew plural עֲטָרוֹת; the footnote appropriately preserves the plural-form issue.
  issues:
  - severity: medium
    issue: The main-text verbs are translated as simple future forms.
    rationale: ‘మోస్తాను’ and ‘ధరించుకుంటాను’ can sound like direct future promises. In the Hebrew oath/avowal context, the imperfects express what Job would readily do with the accusation or document. Telugu conditional/volitional forms preserve this nuance.
  revised_text: 'నిశ్చయంగా దాన్ని నా భుజం మీద మోసేవాడిని;


    కిరీటంలా[a] దాన్ని ధరించుకొనేవాడిని.'
