translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన శైలిని వాడాం. ప్రమాణ వాక్యంలోని నిశ్చయాన్నీ, ఆరోపణ పత్రాన్ని గౌరవచిహ్నంలా మోయడం–ధరించడం అనే దృశ్యాన్నీ నిలిపాం.
