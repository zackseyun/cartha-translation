  source_fidelity: 'ప్రధాన భావం హీబ్రూ మూలానికి నమ్మకంగా ఉంది: ఇది న్యాయపరంగా విచారించదగిన దోషమని, అలా చేయడం పైనున్న దేవునికి వ్యతిరేకంగా ఉండడమని తెలియజేస్తుంది. అయితే ‘నిరాకరించినవాణ్ణి అయ్యేవాణ్ణి’ అనే క్రియారూపం అనవసరంగా పునరుక్తి చెంది తెలుగులో అసహజంగా ఉంది. ‘నిరాకరించి ఉండేవాణ్ణి’ మూలంలోని సందర్భానుసార ఊహాత్మక/వ్యతిరేక-వాస్తవ భావాన్ని మరింత స్పష్టంగా నిలుపుతుంది.'
  naturalness: ‘ఇది కూడా న్యాయవిచారణకు తగిన పాపమే’ సహజమైన, గంభీరమైన ఆధునిక ప్రామాణిక తెలుగు. రెండవ భాగంలోని క్రియను ‘నిరాకరించి ఉండేవాణ్ణి’గా సవరించడం ద్వారా వాక్యం సులభంగా, సహజంగా చదవబడుతుంది.
