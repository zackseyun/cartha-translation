  text: this too would be an iniquity for the judges[b][a], for I would have denied God above.
translation:
  language: te
  text: ఇది కూడా న్యాయవిచారణకు తగిన పాపమే[a]; ఎందుకంటే పైనున్న దేవుణ్ణి నేను నిరాకరించి ఉండేవాణ్ణి[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘న్యాయాధిపతులు శిక్షించవలసిన దోషం,’ ‘న్యాయపరమైన అపరాధం,’ లేదా ‘తీర్పుకు తగిన పాపం.’
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘ఎందుకంటే పైనున్న దేవునికి నేను నమ్మకద్రోహిగా ఉండేవాణ్ణి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם הוּא
  choice: ఇది కూడా
  rationale: మునుపటి వచనంలో పేర్కొన్న ప్రవర్తనను సూచిస్తూ, యోబు తిరస్కరిస్తున్న అపరాధాల జాబితాలో దీనినీ చేరుస్తుంది.
- source_word: עָוֺן
  choice: పాపం
  rationale: ఈ పదం పాపం, దోషం లేదా అపరాధభారం అనే అర్థాలను కలిగి ఉంది. న్యాయపరమైన సందర్భాన్ని తరువాతి పదబంధం వెల్లడిస్తున్నందున, సాధారణ పాఠకులకు స్పష్టమైన ‘పాపం’ను ప్రధాన పాఠంలో వాడాం.
- source_word: פְּלִילִי
  choice: న్యాయవిచారణకు తగిన
  rationale: ఈ పదం న్యాయతీర్పు లేదా న్యాయాధిపతులతో సంబంధమున్న అపరాధాన్ని సూచిస్తుంది. తెలుగు వాక్యంలో సహజంగా ఉండడంతో పాటు దాని న్యాయపరమైన బలాన్ని నిలుపుతుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందు చెప్పిన చర్య ఎందుకు పాపమవుతుందో తెలిపే కారణాన్ని పరిచయం చేస్తుంది.
- source_word: כִחַשְׁתִּי
  choice: నేను నిరాకరించినవాణ్ణి అయ్యేవాణ్ణి
  rationale: విగ్రహారాధన సందర్భంలో ఇది కేవలం అబద్ధం చెప్పడం కంటే దేవుణ్ణి నిరాకరించడం లేదా ఆయనపట్ల అవిశ్వాసంగా ఉండడాన్ని సూచిస్తుంది. అధ్యాయం అంతటా ఉన్న ఊహాత్మక ప్రమాణ నిర్మాణాన్ని తెలుగు షరతు భావంతో వ్యక్తం చేశాం.
- source_word: לָאֵל
  choice: దేవుణ్ణి
  rationale: హీబ్రూ ఉపసర్గ క్రియతో కలిసి ‘దేవునిపట్ల అబద్ధంగా/అవిశ్వాసంగా ఉండడం’ అనే భావాన్ని ఇస్తుంది; ‘నిరాకరించు’తో తెలుగులో కర్మరూపం సహజం.
- source_word: מִמָּעַל
  choice: పైనున్న
  rationale: ‘పైనుండి/పైన’ అనే సంక్షిప్త హీబ్రూ భావాన్ని కాపాడుతూ, ముందు వచనాల్లోని ఆకాశ జ్యోతుల ఆరాధనతో ఉన్న వ్యత్యాసాన్ని సూచిస్తుంది; ‘పరలోకంలో’ వంటి అదనపు వివరణను చేర్చదు.
theological_decisions:
- issue: מִמָּעַל‌ను ‘పైనున్న దేవుడు’గా ఇవ్వాలా, లేక ‘పరలోకంలో పైనున్న దేవుడు’గా విస్తరించాలా
  choice: పైనున్న దేవుడు
  alternative: ఉన్నత స్థలంలో ఉన్న దేవుడు; పరలోకంలో పైనున్న దేవుడు
  rationale: హీబ్రూ సంక్షిప్తతను నిలుపుతూ, సందర్భంలోని ఆకాశ సంబంధ వ్యత్యాసాన్ని కాపాడుతుంది; మూలంలో లేని ‘పరలోకం’ అనే పదాన్ని జోడించదు.
- issue: כִחַשְׁתִּי దేవుణ్ణి ‘నిరాకరించడం’నా లేక దేవునిపట్ల ‘అవిశ్వాసంగా ఉండడం’నా
  choice: నిరాకరించడం
  alternative: పైనున్న దేవునిపట్ల అవిశ్వాసంగా ఉండడం
  rationale: సూర్యచంద్రులకు భక్తి చూపడం దేవుని ఏకైక అధికారాన్ని ఆచరణలో నిరాకరించడమనే సందర్భార్థాన్ని ప్రధాన పాఠం సహజంగా తెలియజేస్తుంది; ప్రత్యామ్నాయ భావాన్ని పాదటిప్పణిలో భద్రపరచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే న్యాయపరమైన భాషను వాడాం. మూలంలోని ఊహాత్మక భావాన్ని ‘అయ్యేవాణ్ణి’తో నిలిపాం; నిజంగా జరిగిన చర్యగా అనిపించకుండా జాగ్రత్తపడ్డాం. ప్రతి పాదటిప్పణి గుర్తును సంబంధిత పదబంధం వెంట ఉంచాం.
