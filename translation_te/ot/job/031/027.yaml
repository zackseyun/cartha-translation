  text: and my heart was secretly enticed[a], and my hand kissed my mouth—
translation:
  language: te
  text: నా హృదయం రహస్యంగా ప్రలోభపరచబడి, నా చెయ్యి నా నోటిని ముద్దుపెట్టిందా—[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ఈ సందర్భంలోని భావాన్ని మరింత సహజంగా చెప్పాలంటే, “నా చెయ్యి నుండి ముద్దు పంపానా.” ఇది బహుశా ఆకాశ జ్యోతుల ఆరాధనతో ముడిపడిన గౌరవసూచక సంజ్ఞ.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְתְּ
  choice: ఆకర్షించబడి
  rationale: פתה ఇక్కడ లోలోపల ప్రలోభానికి లేదా మోహానికి లోనవడాన్ని సూచిస్తుంది. ‘ఆకర్షించబడి’ మూలంలోని అంతరంగ ఆకర్షణను నిలుపుతూ, మోసపోవడం అనే భావాన్ని అనవసరంగా నిర్దిష్టం చేయదు.
- source_word: בַּסֵּתֶר
  choice: రహస్యంగా
  rationale: סתר దాచబడిన స్థితి లేదా గోప్యతను సూచిస్తుంది; తెలుగులో క్రియావిశేషణ రూపమైన ‘రహస్యంగా’ సహజంగా ఉంది.
- source_word: לִבִּי
  choice: నా హృదయం
  rationale: లేబ్ అనే పదం అంతరంగం, సంకల్పం, భావావేశాలను సూచించగలదు; ‘హృదయం’ మూల రూపకాన్ని నిలుపుతుంది.
- source_word: וַתִּשַּׁק
  choice: ముద్దుపెట్టింది
  rationale: נשק యొక్క ప్రాథమిక అర్థం ‘ముద్దుపెట్టు.’ ఆకాశ జ్యోతులకు గౌరవసూచకంగా చేతితో ముద్దు పంపే ఆచారం సందర్భంలో సంభావ్యమైనా, ప్రధాన పాఠ్యంలో స్పష్టమైన శారీరక క్రియను నిలిపాం.
- source_word: יָדִי
  choice: నా చెయ్యి
  rationale: మూలంలోని శరీర భాగాన్ని నేరుగా, సాధారణ ఆధునిక తెలుగులో అనువదిస్తుంది.
- source_word: לְפִי
  choice: నా నోటిని
  rationale: అక్షరార్థంగా ‘నా నోటికి.’ తెలుగు వాక్య నిర్మాణంలో ‘ముద్దుపెట్టింది’తో ‘నా నోటిని’ సహజంగా ఉంటుంది; ఆచార సంబంధమైన భావాన్ని పాదటిప్పణిలో వివరించాం.
theological_decisions:
- issue: ఆకాశ జ్యోతుల ఆరాధనకు సంబంధించిన గౌరవసూచక సంజ్ఞ
  choice: ప్రధాన పాఠ్యంలో శారీరక చర్యను మాత్రమే నిలుపడం
  alternative: నా చెయ్యి నుండి ముద్దు పంపానా
  rationale: 26–28 వచనాల సందర్భం సూర్యుడు లేదా చంద్రునికి చూపిన ఆరాధనా సంజ్ఞను సూచిస్తుంది. అయితే ఈ వచనం ఆరాధన అని నేరుగా చెప్పకుండా చర్యను వర్ణిస్తుంది. అందువల్ల వ్యాఖ్యానాన్ని ప్రధాన పాఠ్యంలో చేర్చకుండా పాదటిప్పణిలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే భాషను వాడాం. చుట్టుపక్కల వచనాల్లో కొనసాగుతున్న షరతు భావానికి అనుగుణంగా తెలుగులో ప్రశ్నార్థక రూపం ‘-ఆ’ను ఉపయోగించాం; మూలంలోని అసంపూర్ణ వాక్య ప్రవాహాన్ని చివరి దీర్ఘవిరామంతో నిలిపాం.
