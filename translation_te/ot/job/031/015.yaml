source:
  edition: WLC
  text: הֲֽ֝/לֹא בַ֭/בֶּטֶן עֹשֵׂ֣/נִי עָשָׂ֑/הוּ וַ֝/יְכֻנֶ֗/נּוּ בָּ/רֶ֥חֶם אֶחָֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/031/015.yaml
  text: Did not he who made me in the womb make him[a], and form us in one womb?
translation:
  language: te
  text: గర్భంలో నన్ను చేసినవాడే అతనినీ చేయలేదా? మనిద్దరినీ గర్భంలో రూపించినవాడు ఒక్కడే కాడా?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మమ్మల్ని ఒకే గర్భంలో రూపించలేదా?” హీబ్రూ పదబంధాన్ని ఇలా కూడా అర్థం చేసుకోవచ్చు. ఇక్కడ “ఒకే గర్భం” అనేది వారిద్దరూ ఒకే తల్లికి పుట్టారని చెప్పడం కాదు; వారి ఉమ్మడి మానవ మూలాన్ని, ఒకే సృష్టికర్తను నొక్కిచెప్పే భావం.
    reason: వాక్యనిర్మాణ మరియు పదార్థ ప్రత్యామ్నాయం
lexical_decisions:
- source_word: הֲלֹא
  choice: చేయలేదా?
  rationale: ఇది అవుననే జవాబును ఆశించే అలంకారప్రశ్న. తెలుగులో ప్రతికూల ప్రశ్నారూపం దాని బలాన్ని సహజంగా నిలుపుతుంది.
- source_word: בַבֶּטֶן
  choice: గర్భంలో
  rationale: ఈ సందర్భంలో בטן సాధారణంగా ‘కడుపు’ను కాక, పుట్టకముందు రూపించబడే గర్భాన్ని సూచిస్తుంది.
- source_word: עֹשֵׂנִי
  choice: నన్ను చేసినవాడు
  rationale: కర్తరి వర్తమాన కృదంతానికి ఏకవచన ప్రథమ పురుష ప్రత్యయం జతై ‘నన్ను చేసినవాడు’ అనే వ్యక్తిగత, క్రియాత్మక భావాన్ని ఇస్తుంది.
- source_word: עָשָׂהוּ
  choice: అతనినీ చేయలేదా
  rationale: ‘అతడు’ మునుపటి సందర్భంలోని దాసుణ్ణి సూచిస్తుంది. ‘నన్ను… అతనినీ’ అనే నిర్మాణం ఇద్దరినీ చేసినవాడు ఒకడే అన్న సమాంతరతను చూపుతుంది.
- source_word: וַיְכֻנֶנּוּ
  choice: మమ్మల్ని … రూపించలేదా
  rationale: כון ఇక్కడ గర్భంలో ఆకృతి కల్పించడం, రూపించడం అనే భావాన్ని ఇస్తుంది; ప్రత్యయం సందర్భానుసారం ప్రథమ పురుష బహువచనంగా గ్రహించబడింది.
- source_word: בָּרֶחֶם
  choice: గర్భంలో
  rationale: רחם ప్రత్యేకంగా గర్భాన్ని సూచిస్తుంది.
- source_word: אֶחָד
  choice: ఒక్కడే
  rationale: 'హీబ్రూ పదక్రమంలో אֶחָדను ‘ఒక్కడు’ అనే కర్తగా గ్రహించడం సహజం: ఇద్దరినీ రూపించినవాడు ఒక్కడే. అయితే దాన్ని רחםతో కలిపి ‘ఒకే గర్భంలో’ అని గ్రహించే అవకాశం కూడా ఉంది; అది పాదసూచికలో నిలుపబడింది.'
theological_decisions:
- issue: ‘అతడు’ అనే సర్వనామం ఎవరిని సూచిస్తుంది?
  choice: మునుపటి వచనాల్లో ప్రస్తావించిన దాసుణ్ణి సూచించే ఏకవచనాన్ని నిలుపుకోవడం
  alternative: సాధారణంగా ఏ తోటి మనిషినైనా సూచించేలా విస్తరించి అనువదించడం
  rationale: యోబు 31:13–14లోని తక్షణ సందర్భం యోబు తన దాసదాసీల న్యాయవాదాన్ని ఎలా పరిగణించాడో చెబుతుంది. ఏకవచనాన్ని నిలుపుకోవడం మూలానికి నమ్మకంగా ఉండి, ఉమ్మడి సృష్టి ఆధారంగా ఉన్న విస్తృత మానవ సమానత్వాన్ని పాఠకుడు గ్రహించేందుకు వీలు ఇస్తుంది.
- issue: אֶחָד యొక్క వాక్యనిర్మాణ సంబంధం
  choice: ‘ఒక్కడే మమ్మల్ని గర్భంలో రూపించలేదా?’—ఒకే సృష్టికర్తను సూచించడం
  alternative: ‘మమ్మల్ని ఒకే గర్భంలో రూపించలేదా?’—אֶחָדను ‘గర్భం’తో కలపడం
  rationale: హీబ్రూలో ‘ఒక్కడు’ అనే పదం ‘రూపించాడు’ అనే క్రియకు కర్తగా చదవవచ్చు; ఇది ఇద్దరికీ ఒకే సృష్టికర్త ఉన్నాడనే వాదనను స్పష్టంగా ఉంచుతుంది. అయినా ‘ఒకే గర్భం’ అనే పదబంధ పఠనం సాధ్యమే కాబట్టి దానిని పాదసూచికలో ఇచ్చాం; ఏ పఠనమూ వారు ఒకే జీవతల్లికి పుట్టారని బలవంతంగా ప్రకటించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కవితాత్మక ప్రశ్నారూపం వాడబడింది. ‘చేసినవాడు’, ‘రూపించాడు’ అనే పదాలు సృష్టి మరియు గర్భస్థ నిర్మాణం మధ్యనున్న హీబ్రూ క్రియాభేదాన్ని నిలుపుతాయి.
