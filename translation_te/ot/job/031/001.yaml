  yaml_path: translation/ot/job/031/001.yaml
  text: I have made a covenant with my eyes[a]; so how could I gaze at a virgin?
translation:
  language: te
  text: '“నా కళ్లతో నేను నిబంధన చేసుకున్నాను;

    అలాంటప్పుడు కన్యవైపు నేను ఎలా తదేకంగా చూడగలను?[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అయితే నేను కన్యవైపు ఎందుకు తదేకంగా చూడాలి?”
    reason: ప్రశ్నార్థకమైన וּמָהను ‘ఎలా’ లేదా ‘ఎందుకు’ అని అర్థం చేసుకునే lexical alternativeను కాపాడటానికి.
lexical_decisions:
- source_word: בְּרִית
  choice: నిబంధన
  rationale: బంధించే గంభీరమైన ఒడంబడిక లేదా కట్టుబాటును సూచించే సాధారణ పదం; כּרתతో ఉన్న హీబ్రూ నుడికారపు బరువును నిలుపుతుంది.
- source_word: כָּרַתִּי
  choice: చేసుకున్నాను
  rationale: హీబ్రూలో అక్షరార్థంగా ‘నిబంధన కోశాను’ అనే నుడికారం ఉన్నా, ఆధునిక తెలుగులో ‘నిబంధన చేసుకున్నాను’ సహజం; ఆత్మనిబద్ధత భావాన్ని కూడా తెలియజేస్తుంది.
- source_word: לְעֵינַי
  choice: నా కళ్లతో
  rationale: לְ యొక్క సంబంధాన్ని తెలుగులో సహజంగా చూపుతూ, యోబు తన చూపును నియంత్రించుకోవడానికి చేసుకున్న కట్టుబాటును వ్యక్తపరుస్తుంది.
- source_word: וּמָה
  choice: అలాంటప్పుడు ... ఎలా
  rationale: ముందటి నిబంధన నుంచి వచ్చే నిర్ధారణాత్మక ప్రశ్నను సహజ తెలుగులో తెలియజేస్తుంది; ‘ఎందుకు’ అనే సాధ్యమైన భావాన్ని పాదటిప్పణిలో నిలిపింది.
- source_word: אֶתְבּוֹנֵן
  choice: తదేకంగా చూడగలను
  rationale: సాధారణంగా ఒకసారి చూడడం కాక, శ్రద్ధగా లేదా నిలకడగా చూడడాన్ని సూచించే క్రియారూప భావాన్ని అందిస్తుంది.
- source_word: עַל
  choice: వైపు
  rationale: చూడడాన్ని సూచించే క్రియతో సహజమైన తెలుగు సంబంధపదం.
- source_word: בְּתוּלָה
  choice: కన్య
  rationale: వివాహం కాని కన్యను సూచించే మూలపదపు సాధారణ, నిర్దిష్ట భావాన్ని సంక్షిప్తంగా కాపాడుతుంది.
theological_decisions:
- issue: రెండవ పాదంలోని ప్రశ్న యొక్క భావం
  choice: నిబంధన ఫలితంగా ‘ఎలా చూడగలను?’ అనే అసంభవత/అసంగతత భావం
  alternative: ‘అయితే నేను కన్యవైపు ఎందుకు తదేకంగా చూడాలి?’
  rationale: וּמָה సందర్భంలో ‘ఎలా?’ లేదా ‘ఎందుకు?’ అనే ప్రశ్నార్థక బలాన్ని కలిగి ఉండవచ్చు. ప్రధాన పాఠం ముందు పాదంతో తార్కిక సంబంధాన్ని సహజంగా చూపుతుంది; ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచి అస్పష్టతను కాపాడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనా సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ‘తదేకంగా చూడడం’ ఉద్దేశపూర్వకంగా, నిలకడగా చూడడాన్ని సూచిస్తుంది; మూలంలో ప్రత్యక్షంగా లేని ‘కామంతో’ వంటి వివరణను చేర్చలేదు.
