translation:
  language: te
  text: 'వెలుగు ప్రకాశించగా[a] నేను దానిని చూసినా,

    లేదా వైభవంగా సాగిపోతున్న చంద్రుణ్ణి చూసినా[b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘సూర్యుడు ప్రకాశించగా’; ‘చంద్రుడు’తో ఉన్న సమాంతరతనుబట్టి ఇక్కడ ‘వెలుగు’ సూర్యుణ్ణి సూచిస్తుండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘ప్రకాశంతో/వైభవంతో నడుస్తున్న చంద్రుణ్ణి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: చూసినా
  rationale: యోబు నిర్దోషిత్వ ప్రమాణంలోని షరతును తెలుగులో సహజంగా వ్యక్తం చేయడానికి క్రియకు ‘-ఇనా’ రూపం వాడబడింది.
- source_word: אֶרְאֶה
  choice: నేను ... చూసినా
  rationale: ప్రమాణ సందర్భంలో యోబు తాను చేయలేదని చెప్పే ఊహాత్మక గత చర్యను సూచిస్తుంది.
- source_word: אוֹר
  choice: ప్రకాశం
  rationale: హీబ్రూ పదానికి అక్షరార్థం ‘వెలుగు/ప్రకాశం.’ సమాంతరంగా చంద్రుడు ఉన్నందున ఇది సూర్యుణ్ణి సూచించే అవకాశం ఉన్నా, మూలంలోని ఉద్దేశపూర్వక పదప్రయోగాన్ని నిలిపింది.
- source_word: כִּי
  choice: వెలిగినప్పుడు
  rationale: ప్రకాశాన్ని చూడటానికి తోడైన కాలసందర్భాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: יָהֵל
  choice: వెలిగినప్పుడు
  rationale: కాంతిని ప్రసరించడం అనే భావాన్ని సరళమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: וְיָרֵחַ
  choice: లేదా ... చంద్రుణ్ణి
  rationale: షరతులోని రెండవ సమాంతర దృశ్యవస్తువును సూచించేందుకు సంధిని విభాజకార్థకంగా అనువదించింది.
- source_word: יָקָר
  choice: మహిమతో
  rationale: చంద్రుని విలువకన్నా దాని వైభవోపేతమైన ప్రకాశాన్ని సూచించే సందర్భార్థాన్ని అందిస్తుంది.
- source_word: הֹלֵךְ
  choice: సాగిపోతున్న
  rationale: ఆకాశంలో చంద్రుని నిరంతర గమనాన్ని వర్తమాన కృదంత భావంతో సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ఖగోళ ఆరాధనకు సాధ్యమైన సూచన
  choice: ప్రధాన పాఠ్యంలో ఖగోళ దృశ్యాన్ని మాత్రమే ఉంచి, ఆరాధన భావాన్ని స్పష్టంగా చేర్చలేదు.
  alternative: אוֹר ను ‘సూర్యుడు’గా అనువదించి విగ్రహారాధన వ్యతిరేక సందర్భాన్ని ముందుకు తేవడం.
  rationale: 27–28 వచనాలు ఆరాధనకు సంబంధించిన సందర్భాన్ని స్పష్టం చేస్తాయి; అయితే 26వ వచనం స్వయంగా ‘ప్రకాశం,’ ‘చంద్రుడు’ అని మాత్రమే చెబుతుంది. అందువల్ల సందర్భమే ఆ వేదాంత సూచనను వెల్లడించేలా మూలంలోని ఉద్వేగాన్ని నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనా సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘ప్రకాశం’ ద్వారా మూలంలోని అక్షరార్థాన్ని, ‘సాగిపోతున్న’ ద్వారా చంద్రుని ఆకాశగమనాన్ని నిలిపింది. వాక్యం తరువాతి వచనాల్లో పూర్తయ్యే షరతుగా ఉన్నందున ముగింపులో కామా ఉంచబడింది.
