  naturalness: The conditional, unfinished syntax and final comma appropriately reflect Job’s continuing oath. Replacing ‘ప్రకాశం వెలిగినప్పుడు’ with ‘వెలుగు ప్రకాశించగా’ produces natural modern standard Telugu. ‘వైభవంగా సాగిపోతున్న’ is more idiomatic and contextually precise than ‘మహిమతో సాగిపోతున్న.’
  terminology: ‘వెలుగు’ faithfully preserves the Hebrew ambiguity of אוֹר while allowing the contextual allusion to the sun. ‘వైభవంగా’ conveys יָקָר here as splendid brightness/majesty without importing a specifically theological sense that ‘మహిమ’ can carry in Telugu.
