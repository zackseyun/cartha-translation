source:
  edition: WLC
  text: כִּ֤י אֵ֣שׁ הִ֭יא עַד אֲבַדּ֣וֹן תֹּאכֵ֑ל וּֽ/בְ/כָל תְּב֖וּאָתִ֣/י תְשָׁרֵֽשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/031/012.yaml
  text: For it is a fire that consumes to destruction[a], and it would root out all my produce.
translation:
  language: te
  text: ఎందుకంటే అది నాశనమయ్యే వరకు దహించే అగ్ని[a]; అది నా పంట అంతటినీ వేరుతో సహా పెకలించివేసేది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అబద్దోను వరకు.’ హీబ్రూ పదం אֲבַדּוֹן ‘నాశనం’ అని, కొన్ని సందర్భాల్లో నాశనలోకం లేదా నాశనానికి వ్యక్తిరూపం అని కూడా సూచించగలదు.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి వచనాల్లోని హెచ్చరికకు కారణాన్ని తెలియజేసే వివరణాత్మక సంబంధాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אֵשׁ הִיא
  choice: అది ... అగ్ని
  rationale: హీబ్రూ విధేయ నిర్మాణంలోని సజీవ రూపకాన్ని నిలుపుతుంది; స్త్రీలింగ సర్వనామం వ్యాకరణ అన్వయం మాత్రమే కావడంతో తెలుగులో సహజమైన ‘అది’ వాడబడింది.
- source_word: עַד אֲבַדּוֹן
  choice: నాశనం వరకు
  rationale: అగ్ని కలిగించే వినాశనపు పరాకాష్ఠను వ్యక్తం చేస్తుంది; אֲבַדּוֹן కు ఉన్న ‘అబద్దోను’ అనే ప్రత్యామ్నాయ సాధ్యతను పాదసూచికలో ఉంచుతుంది.
- source_word: תֹּאכֵל
  choice: దహించివేసే
  rationale: మూల క్రియకు ‘తిను/మింగివేయు’ అనే భావం ఉన్నా, అగ్ని సందర్భంలో ‘దహించివేయు’ ఆధునిక తెలుగులో సహజంగా ఉండి సంపూర్ణ వినాశనాన్ని తెలియజేస్తుంది.
- source_word: וּבְכָל
  choice: అంతటినీ
  rationale: బెత్ ఉపసర్గను తెలుగులో యాంత్రికంగా అనువదించకుండా, వినాశనం మొత్తం దిగుబడికి విస్తరిస్తుందనే పరిధిని స్పష్టంగా తెలియజేస్తుంది.
- source_word: תְּבוּאָתִי
  choice: నా పంట
  rationale: భూమి లేదా శ్రమనుంచి లభించే దిగుబడి/ఫలసాయాన్ని సూచిస్తుంది; వ్యవసాయ రూపకంతో సహజంగా సరిపోతుంది.
- source_word: תְשָׁרֵשׁ
  choice: వేళ్లతో సహా పెకలించివేస్తుంది
  rationale: పియేల్ రూపంలోని ‘వేరుతో పెకలించు, సమూలంగా నిర్మూలించు’ అనే బలమైన వ్యవసాయ చిత్రాన్ని స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: אֲבַדּוֹן యొక్క భావం
  choice: సాధారణ నామవాచకంగా ‘నాశనం’
  alternative: ప్రత్యేక నామంగా ‘అబద్దోను’
  rationale: ఈ జ్ఞానసాహిత్య సందర్భంలో పాపం కలిగించే సంపూర్ణ వినాశనాన్ని సూచించడం ప్రధాన భావం. అయితే హీబ్రూ పదం ఇతర సందర్భాల్లో వినాశనలోకం లేదా దాని వ్యక్తీకరణను సూచించగలదు కాబట్టి ప్రత్యామ్నాయాన్ని పాదసూచికలో భద్రపరచాం.
- issue: చివరి క్రియ యొక్క కాల/విధి భావం
  choice: ‘పెకలించివేస్తుంది’
  alternative: ‘పెకలించివేసేది’ లేదా ‘పెకలించివేయగలదు’
  rationale: హీబ్రూ అసంపూర్ణ క్రియ ఇక్కడ అగ్ని యొక్క ఫలితాన్ని వర్ణిస్తుంది. ముందటి ప్రమాణ సందర్భం షరతు ఛాయను అందించినా, ఈ వాక్యంలో ప్రత్యక్ష ఫలిత వర్ణన తెలుగులో సహజంగా ఉంది; అవసరం లేని సంభావ్యతను చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘దహించివేసే అగ్ని’ మరియు ‘వేళ్లతో సహా పెకలించివేస్తుంది’ అనే పదబంధాలు మూలంలోని అగ్ని, వ్యవసాయ రూపకాలను స్పష్టంగా నిలుపుతాయి. పాదసూచిక గుర్తు [a] ప్రధాన పాఠ్యంలో చేర్చబడింది.
