  yaml_path: translation/ot/job/031/004.yaml
  text: Does he not see my ways and count all my steps?[a]
translation:
  language: te
  text: ఆయన నా మార్గాలను చూడడా? నా అడుగులన్నిటినీ లెక్కించడా?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆయన నా ప్రవర్తనను గమనించి, నా అడుగులన్నిటినీ లెక్కించడా?”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: చూడడా? ... లెక్కించడా?
  rationale: అవుననే సమాధానాన్ని ఆశించే అలంకారిక ప్రశ్నను తెలుగులో సహజమైన వ్యతిరేక ప్రశ్నారూపంతో వ్యక్తం చేస్తుంది.
- source_word: הוּא
  choice: ఆయన
  rationale: స్వతంత్ర సర్వనామంలోని స్వల్ప ఉద్ఘాటనను గౌరవప్రదమైన సాధారణ తెలుగు సర్వనామం సహజంగా అందిస్తుంది.
- source_word: יִרְאֶה
  choice: చూడడా
  rationale: ראה అనే క్రియ యొక్క ప్రాథమిక అర్థమైన ‘చూచుట’ను నిలుపుతూ, దేవుని పరిశీలన అనే భావాన్ని వ్యాఖ్యానాత్మకంగా విస్తరించదు.
- source_word: דְרָכָי
  choice: నా మార్గాలను
  rationale: హీబ్రూ బహువచనాన్ని, జీవన విధానాన్నీ నడిచే దారులనూ సూచించగల రూపకాన్ని నిలుపుతుంది.
- source_word: וְכָל
  choice: నా ... అన్నిటినీ
  rationale: וְ యొక్క అనుసంధానాన్ని రెండవ ప్రశ్నావాక్యంతో, כָל యొక్క సంపూర్ణతను ‘అన్నిటినీ’తో సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: צְעָדַי
  choice: నా అడుగులన్నిటినీ
  rationale: వ్యక్తిగత కదలికలు లేదా కార్యాలను సూచించగల ‘అడుగులు’ అనే మూల రూపకాన్ని కాపాడుతుంది.
- source_word: יִסְפּוֹר
  choice: లెక్కించడా
  rationale: ספר యొక్క ప్రత్యక్ష అర్థమైన ‘లెక్కించుట’ను సంక్షిప్తంగా, సహజంగా అందిస్తుంది.
theological_decisions:
- issue: మానవరూపక క్రియల ద్వారా వ్యక్తమయ్యే దేవుని జ్ఞానం
  choice: దేవుడు యోబు మార్గాలను చూస్తాడనీ అతని అడుగులన్నిటినీ లెక్కిస్తాడనీ సూచించే అలంకారిక ప్రశ్నగా అనువదించడం
  alternative: ఆయన నా ప్రవర్తనను గమనించి, నా కార్యాలన్నిటినీ పరిగణనలోకి తీసుకోడా?
  rationale: హీబ్రూ పాఠంలోని చూడటం, లెక్కించడం అనే స్పష్టమైన చిత్రణను నిలుపుతూ, దానిని సర్వజ్ఞత్వం గురించిన సిద్ధాంతపరమైన వ్యాఖ్యగా విస్తరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ప్రశ్నారూపం వాడబడింది. ‘మార్గాలు’, ‘అడుగులు’ అనే హీబ్రూ రూపకాలు నిలుపబడ్డాయి; పాదటిప్పణి ‘మార్గాలు’కు సందర్భానుగుణమైన ‘ప్రవర్తన’ అనే ప్రత్యామ్నాయాన్ని ఇస్తుంది.
