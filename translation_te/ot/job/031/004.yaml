  source_fidelity: హీబ్రూ הֲלֹאతో ఉన్న అవుననే సమాధానాన్ని ఆశించే అలంకారిక ప్రశ్నను ‘చూడడా? ... లెక్కించడా?’ సరియైన విధంగా వ్యక్తపరుస్తుంది. דְרָכַי (‘నా మార్గాలు’) మరియు צְעָדַי (‘నా అడుగులు’) అనే రూపకాలు నిలిచాయి; יִסְפּוֹר యొక్క ‘లెక్కించు’ అర్థమూ ఖచ్చితంగా ఉంది.
