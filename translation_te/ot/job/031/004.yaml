  terminology: ‘ఆయన,’ ‘మార్గాలు,’ ‘అడుగులు,’ ‘లెక్కించు’ పదాలు సందర్భానికి, రిజిస్టర్‌కు అనుకూలంగా ఉన్నాయి. పాదటిప్పణిలోని ‘ప్రవర్తనను గమనించి’ అనేది ‘మార్గాలు’ రూపకానికి సముచితమైన సందర్భానుగుణ ప్రత్యామ్నాయం మాత్రమే; ప్రధాన పాఠాన్ని వ్యాఖ్యానాత్మకంగా మార్చదు.
