revisions:
- from: నేను ఒక మనిషిలా[a] నా అతిక్రమాలను కప్పిపెట్టి, నా దోషాన్ని నా ఒడిలో దాచుకున్నానా—
  to: నేను మనిషిలా[a] నా అతిక్రమాలను కప్పిపెట్టి, నా దోషాన్ని నా ఒడిలో దాచుకుని ఉంటే—
  rationale: The revision restores the source’s conditional oath syntax, improves the generic Telugu comparison, and retains the lexical imagery and the disputed common-noun/proper-name ambiguity of אָדָם. The em dash remains because this verse is an incomplete oath protasis in context.
