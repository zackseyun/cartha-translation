id: JOB.31.33
reference: Job 31:33
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אִם כִּסִּ֣יתִי כְ/אָדָ֣ם פְּשָׁעָ֑/י לִ/טְמ֖וֹן בְּ/חֻבִּ֣/י עֲוֺֽנִ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/031/033.yaml
  text: if I have covered my transgressions like Adam[a], by hiding my iniquity in my bosom—
translation:
  language: te
  text: నేను మనిషిలా[a] నా అతిక్రమాలను కప్పిపెట్టి, నా దోషాన్ని నా ఒడిలో దాచుకుని ఉంటే—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆదాములా.” హీబ్రూ אָדָםను సాధారణ నామవాచకంగా “మనిషి” అనీ, వ్యక్తినామంగా “ఆదాము” అనీ చదవవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: אִם
  choice: —ఆనా
  rationale: ఇది యోబు ప్రమాణరూప వాక్యంలోని షరతును పరిచయం చేస్తుంది. తెలుగులో సహజమైన ప్రశ్నార్థక షరతు నిర్మాణంతో భావాన్ని నిలిపాం; వాక్యం తరువాతి భాగానికి కొనసాగుతుందని దీర్ఘవిరామం సూచిస్తుంది.
- source_word: כִּסִּיתִי
  choice: కప్పిపెట్టి
  rationale: כסה అనే క్రియలోని ‘కప్పడం/మరుగుచేయడం’ అనే దృశ్యరూపాన్ని నిలుపుతూ, తరువాతి ‘దాచుకున్నానా’తో సహజంగా అనుసంధానించాం.
- source_word: כְאָדָם
  choice: ఒక మనిషిలా
  rationale: אָדָם ఇక్కడ సాధారణ నామవాచకంగా ‘మనిషి’ అనీ, వ్యక్తినామంగా ‘ఆదాము’ అనీ అర్థమయ్యే అవకాశం ఉంది. ప్రధాన పాఠ్యంలో సాధారణ నామవాచక అర్థాన్ని ఉంచి, ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: פְּשָׁעָי
  choice: నా అతిక్రమాలను
  rationale: פֶּשַׁע లోని నైతిక-న్యాయపరమైన హద్దుమీరడం లేదా తిరుగుబాటు భావాన్ని ‘అతిక్రమాలు’ స్పష్టంగా నిలుపుతుంది.
- source_word: לִטְמוֹן
  choice: దాచుకున్నానా
  rationale: טמן అంటే దాచడం. సందర్భంలో ఇది ముందటి ‘కప్పిపెట్టడం’ ఎలా జరిగిందో తెలిపే క్రియగా సహజమైన తెలుగు వాక్యనిర్మాణంలో అందించబడింది.
- source_word: בְּחֻבִּי
  choice: నా ఒడిలో
  rationale: హీబ్రూ పదంలోని ఒడి/రొమ్మున దాచుకునే స్పష్టమైన దృశ్యాన్ని ‘నా ఒడిలో’ సహజంగా నిలుపుతుంది; కేవలం ‘రహస్యంగా’ అని భావాన్ని సారాంశీకరించలేదు.
- source_word: עֲוֺנִי
  choice: నా దోషాన్ని
  rationale: עָוֹן పాపదోషం, అపరాధం, దాని నేరభారం వంటి అర్థాలను కలిగి ఉంటుంది. ‘దోషం’ ఈ నైతిక భారాన్ని తెలుగులో సహజంగా తెలియజేస్తూ ‘అతిక్రమాలు’తోని పదభేదాన్ని కూడా కాపాడుతుంది.
theological_decisions:
- issue: כְאָדָם లోని אָדָם అర్థం
  choice: 'సాధారణ నామవాచకం: ‘ఒక మనిషిలా’'
  alternative: 'వ్యక్తినామం: ‘ఆదాములా’'
  rationale: హీబ్రూ రూపం రెండు పఠనాలనూ అనుమతిస్తుంది. ప్రధాన పాఠ్యంలో సాధారణ అర్థాన్ని ఎంచుకున్నప్పటికీ, ఆదామును సూచించే ప్రాచీనమైన, వ్యాఖ్యానపరంగా ముఖ్యమైన పఠనాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలిని ఉపయోగించాం. ‘కప్పిపెట్టి’, ‘ఒడిలో’ అనే పదాలతో హీబ్రూ దృశ్యరూపాన్ని నిలిపాం. ఇది పూర్తికాని ప్రమాణవాక్య భాగం కావడంతో చివర దీర్ఘవిరామాన్ని ఉంచాం.
