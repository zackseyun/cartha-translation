source:
  edition: WLC
  text: אִם הָלַ֥כְתִּי עִם שָׁ֑וְא וַ/תַּ֖חַשׁ עַל מִרְמָ֣ה רַגְלִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/031/005.yaml
  text: If I have walked with falsehood[b][a], and my foot has hastened to deceit—
translation:
  language: te
  text: నేను అసత్యంతో నడిచినట్లయితే[b], నా పాదం మోసం వైపు త్వరపడినట్లయితే[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నా పాదం మోసం మీదికి త్వరపడినట్లయితే.” హీబ్రూ విభక్తిపదం దిశను—“వైపు,” “దగ్గరకు,” లేదా “వెంట”—సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: “నడవడం” అనేది ఒకరి ప్రవర్తనను లేదా జీవన విధానాన్ని సూచించే హీబ్రూ నుడికారం.
    reason: cultural_note
lexical_decisions:
- source_word: אִם
  choice: నడిచినట్లయితే / త్వరపడినట్లయితే
  rationale: యోబు నిర్దోషిత్వ ప్రమాణంలోని షరతును తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; రెండవ సమాంతర క్రియకూ షరతు వర్తిస్తుందని స్పష్టం చేస్తుంది.
- source_word: הָלַכְתִּי
  choice: నేను ... నడిచినట్లయితే
  rationale: ‘నడుచు’ అనే మూలరూపకాన్ని నిలుపుతూ, ప్రవర్తన లేదా జీవన విధానాన్ని సూచించే హీబ్రూ నుడికారాన్ని కాపాడుతుంది.
- source_word: עִם
  choice: తో
  rationale: అసత్యంతో సహవాసం లేదా అనుబంధం అనే భావాన్ని నేరుగా అందిస్తుంది.
- source_word: שָׁוְא
  choice: అసత్యం
  rationale: ఈ పదానికి శూన్యత, వ్యర్థత, అసత్యం అనే భావపరిధి ఉన్నా, సమాంతరంగా ఉన్న ‘మోసం’ దృష్ట్యా ఇక్కడ నైతిక అసత్యం ప్రధానంగా ఉంది.
- source_word: וַתַּחַשׁ
  choice: త్వరపడినట్లయితే
  rationale: חושׁ యొక్క ‘తొందరపడు/త్వరపడు’ భావాన్ని, పాదాన్ని వ్యక్తీకరించే కవితాత్మక చిత్రంతో సహా నిలుపుతుంది.
- source_word: עַל
  choice: వైపు
  rationale: చలన క్రియతో కలిసి గమ్యదిశను సూచించే సాధ్యమైన అర్థాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది; ‘మీదికి’ అనే ప్రత్యామ్నాయ అవగాహనను పాదటిప్పణిలో ఉంచింది.
- source_word: מִרְמָה
  choice: మోసం
  rationale: మోసపూరిత ప్రవర్తనను సాధారణ ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: רַגְלִי
  choice: నా పాదం
  rationale: హీబ్రూలోని ఏకవచనాన్ని, వ్యక్తీకరణను, జీవన గమనానికి సంబంధించిన కవితాత్మక రూపకాన్ని నిలుపుతుంది.
