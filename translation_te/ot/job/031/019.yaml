review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the conditional oath structure, the two persons in need, and the poetic continuation dash. However, the second occurrence of “చూసి ఉంటే” is supplied rather than left as the Hebrew ellipsis, and “కప్పుకోవడానికి ఏమీ లేని” is broader than the specific clothing/covering sense of כְּסוּת.
  naturalness: The draft is generally clear modern Telugu. A single governing verb placed after the paired objects is more compact and poetic, while “కప్పుకొనే వస్త్రం లేని” is more idiomatic and precise than “కప్పుకోవడానికి ఏమీ లేని.”
  terminology: “నిరుపేద” appropriately renders אֶבְיוֹן. “నశించిపోతున్న” retains the participial sense of one perishing without limiting it to death. “వస్త్రం” accurately maintains the concrete garment/covering reference in the second colon.
  issues:
  - severity: low
    issue: The second clause repeats “చూసి ఉంటే.”
    rationale: The Hebrew has one verb, with the second object coordinated elliptically. Retaining one governing verb better reflects the compact parallelism without reducing Telugu clarity.
  - severity: medium
    issue: “కప్పుకోవడానికి ఏమీ లేని” is semantically too broad for כְּסוּת.
    rationale: The source refers specifically to a covering or garment. “కప్పుకొనే వస్త్రం లేని” preserves this material-clothing reference.
  revised_text: బట్టలు లేక నశించిపోతున్న ఎవరినైనా, లేదా కప్పుకొనే వస్త్రం లేని నిరుపేదను నేను చూసి ఉంటే—
  revised_footnotes: []
