  register: ఆధునిక ప్రామాణిక తెలుగు; కవితాత్మక సమాంతరతను, ప్రమాణంలోని అసంపూర్ణ షరతును సూచించే చివరి దీర్ఘవిరామాన్ని నిలిపి, సాధారణ పాఠకులకు సహజంగా ఉండే పదజాలం ఉపయోగించబడింది.
