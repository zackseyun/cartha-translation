source:
  edition: WLC
  text: אִם אֶרְאֶ֣ה א֭וֹבֵד מִ/בְּלִ֣י לְב֑וּשׁ וְ/אֵ֥ין כְּ֝ס֗וּת לָ/אֶבְיֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/031/019.yaml
  text: if I have seen anyone perishing for lack of clothing[b][a], or the needy without covering—
translation:
  language: te
  text: బట్టలు లేక నశించిపోతున్న ఎవరినైనా, లేదా కప్పుకొనే వస్త్రం లేని నిరుపేదను నేను చూసి ఉంటే—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִם
  choice: చూసి ఉంటే
  rationale: యోబు నిర్దోషిత్వ ప్రమాణంలోని షరతును సహజమైన తెలుగు వాక్యనిర్మాణంలో నిలుపుతుంది.
- source_word: אֶרְאֶה
  choice: నేను చూసి ఉంటే
  rationale: షరతుతో కూడిన అసంపూర్ణ క్రియను, గత ప్రవర్తనను వెనుదిరిగి పరిశీలించే సందర్భానికి తగిన తెలుగు రూపంలో వ్యక్తపరుస్తుంది.
- source_word: אֹבֵד
  choice: నశిస్తున్నవాణ్ణి
  rationale: అבד ధాతువు కృదంతంలోని కొనసాగుతున్న దుస్థితిని నిలుపుతుంది; ఇది కేవలం మరణాన్ని మాత్రమే సూచించకుండా పాడైపోతున్న లేదా నాశనమవుతున్న స్థితిని తెలియజేస్తుంది.
- source_word: מִבְּלִי לְבוּשׁ
  choice: బట్టలు లేక
  rationale: వస్త్రలేమిని స్పష్టంగా, సహజంగా తెలియజేస్తుంది; హీబ్రూ పదబంధంలోని deprivation భావాన్ని నిలుపుతుంది.
- source_word: וְאֵין
  choice: లేదా ... ఏమీ లేని
  rationale: రెండు సమాంతర షరతులను తెలుగులో సహజంగా అనుసంధానించేందుకు ‘లేదా’ వాడబడింది; అస్తిత్వ నిరాకరణను ‘ఏమీ లేని’గా వ్యక్తపరుస్తుంది.
- source_word: כְּסוּת
  choice: కప్పుకోవడానికి ఏమీ
  rationale: మొదటి పాదంలోని ‘బట్టలు’తో పదభేదాన్ని కొంతవరకు నిలుపుతూ, శరీరాన్ని కప్పే వస్త్రం లేదా కప్పు అనే విస్తృత భావాన్ని సహజ తెలుగులో అందిస్తుంది.
- source_word: לָאֶבְיוֹן
  choice: నిరుపేదను
  rationale: తీవ్రమైన భౌతిక అవసరంలో ఉన్న పేద వ్యక్తిని సూచించే אֶבְיוֹן భావాన్ని సంక్షిప్తంగా, గౌరవప్రదంగా అందిస్తుంది.
