  text: I have not allowed my mouth to sin by asking for his life with a curse[a].
translation:
  language: te
  text: శాపంతో అతని ప్రాణం పోవాలని కోరడం ద్వారా నా నోరు పాపం చేయనివ్వలేదు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ప్రమాణంతో.’ హీబ్రూ నామవాచకానికి ‘శాపం/శాపోక్తి’ లేదా ‘ప్రమాణం’ అనే అర్థాలు రావచ్చు; అయితే ఇక్కడ హాని కోరే సందర్భం ‘శాపం’ అనే అర్థానికి అనుకూలంగా ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָתַתִּי
  choice: నేను అనుమతించలేదు
  rationale: ‘ఇవ్వడం’ అనే మూలార్థం ఇక్కడ క్రియార్థక నామంతో కలిసి ‘చేయనివ్వడం/అనుమతించడం’ అనే భావాన్ని ఇస్తుంది. తెలుగు సహజ ప్రయోగానికి ‘అనుమతించలేదు’ సరిపోతుంది.
- source_word: לַחֲטֹא
  choice: పాపం చేయడానికి
  rationale: חטא యొక్క సాధారణ నైతిక భావమైన ‘పాపం చేయడం’ను నిలుపుతుంది; ఇది యోబు తన మాటల్లో జరగనివ్వని తప్పును సూచిస్తుంది.
- source_word: חִכִּי
  choice: నా నోరు
  rationale: పదశః ‘నా అంగిలి’; కవిత్వంలో ఇది మాటను పలికే అవయవానికి ప్రతినిధిగా వాడబడింది. ఆధునిక తెలుగులో ‘నా నోరు’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: לִשְׁאֹל
  choice: కోరడం ద్వారా
  rationale: ఈ క్రియార్థక నామం పాపకార్యపు విషయాన్ని, విధానాన్ని తెలియజేస్తుంది. ‘కోరడం ద్వారా’ దాని సాధనార్థక సంబంధాన్ని తెలుగులో స్పష్టం చేస్తుంది.
- source_word: בְּאָלָה
  choice: శాపంతో
  rationale: אָלָה అనేది ‘శాపం/శాపోక్తి’ లేదా కొన్ని సందర్భాల్లో ‘ప్రమాణం’ అని అర్థమవుతుంది. శత్రువుకు హాని కలగాలని కోరే సందర్భంలో ‘శాపంతో’ ప్రధాన భావంగా సరిపోతుంది; ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: נַפְשׁוֹ
  choice: అతని ప్రాణాన్ని
  rationale: נפשׁ ఇక్కడ ‘ప్రాణం/జీవితం’ను సూచిస్తుంది; ఆత్మ స్వరూపంపై వ్యాఖ్య కాదు. ‘అతని ప్రాణాన్ని’ మూలంలోని వ్యక్తిగత ప్రత్యయాన్ని, ప్రాణహాని భావాన్ని నిలుపుతుంది.
