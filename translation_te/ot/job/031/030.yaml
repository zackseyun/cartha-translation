translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడబడింది. ‘నా అంగిలి’ అనే పదశః రూపానికి బదులు మాటను సూచించే సహజ లక్షణార్థక ప్రయోగంగా ‘నా నోరు’ ఎంచుకున్నాం; మూలంలోని శాపం/ప్రమాణం సందిగ్ధతను పాదటిప్పణిలో నిలిపాం.
