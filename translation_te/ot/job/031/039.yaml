  text: if I have eaten its produce without payment[a], or caused its owners to lose heart—
translation:
  language: te
  text: 'దాని పంటను మూల్యం చెల్లించకుండా నేను తిని ఉంటే,

    లేదా దాని యజమానులను నిస్సత్తువకు గురిచేసి ఉంటే[a]—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “దాని యజమానుల ప్రాణం పోయేలా చేసి ఉంటే” లేదా “దాని యజమానులు ఊపిరి కోసం తల్లడిల్లేలా చేసి ఉంటే.” ఇక్కడి హీబ్రూ క్రియ అరుదైనది; ఈ మాట తీవ్రమైన అణచివేతనైనా, మరణానికి గురిచేయడాన్నైనా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּחָהּ
  choice: దాని పంటను
  rationale: כֹּחַ యొక్క ప్రాథమిక అర్థం ‘బలం, శక్తి.’ అయితే భూమిని సూచించే స్త్రీలింగ ప్రత్యయంతో ఉన్న ఈ వ్యవసాయ సందర్భంలో అది భూమి ఉత్పాదక శక్తిని, అంటే దాని పంటను లేదా దిగుబడిని సూచిస్తుంది.
- source_word: אָכַלְתִּי
  choice: నేను తిని ఉంటే
  rationale: ఈ సాధారణ క్రియకు ‘తినడం’ అనే ప్రత్యక్ష అర్థమే ఉంది. ఇక్కడ భూమి పంటను అన్యాయంగా అనుభవించడాన్ని సూచించినా, యోబు చేస్తున్న ప్రమాణంలోని אִם షరతు నిర్మాణాన్ని నిలుపుతూ ‘తిని ఉంటే’ అని అనువదించాం.
- source_word: בְלִי כָסֶף
  choice: మూల్యం చెల్లించకుండా
  rationale: כֶּסֶף అక్షరార్థంగా ‘వెండి,’ కానీ ఇక్కడ డబ్బు లేదా చెల్లింపుకు పర్యాయంగా వాడబడింది. భూమి పంటను తగిన మూల్యం ఇవ్వకుండా తీసుకోవడం అనే ఆర్థిక అన్యాయాన్ని ఈ పదబంధం సహజంగా తెలియజేస్తుంది.
- source_word: נֶפֶשׁ
  choice: ప్రాణం
  rationale: נֶפֶשׁ కు ‘ప్రాణం, జీవం, వ్యక్తి’ వంటి అర్థాలున్నాయి. అరుదైన తరువాతి క్రియతో కలిసి ఇది తీవ్రమైన అణచివేత వల్ల ప్రాణం కుంగిపోవడాన్నో, ఊపిరి విడవడాన్నో సూచించవచ్చు. ప్రధాన పాఠంలో ‘ప్రాణం’ ఉంచడం ద్వారా మూలంలోని గంభీరతను, అస్పష్టతను కాపాడాం.
- source_word: בְּעָלֶיהָ
  choice: దాని యజమానుల
  rationale: బహువచన నిర్మాణంలో ఉన్న בַּעַל, భూమిని స్వంతంగా కలిగిన లేదా దానిపై హక్కుగల వారిని సూచిస్తుంది. అందువల్ల ‘దాని యజమానులు’ సందర్భానికి స్పష్టమైన సహజ తెలుగు.
- source_word: הִפָּחְתִּי
  choice: కుంగిపోయేలా చేసి ఉంటే
  rationale: נפח ధాతువు యొక్క ఈ హిఫీల్ రూపం అరుదైనది; ‘ఊపిరి పీల్చేలా చేయడం,’ ‘ఊపిరి విడిచేలా చేయడం,’ లేదా తీవ్రమైన అణచివేతతో నిస్సత్తువకు గురిచేయడం అనే అవకాశాలున్నాయి. ప్రధాన పాఠం ఒకే తీవ్ర అర్థాన్ని ఖరారు చేయకుండా సహజంగా ఉండేందుకు ‘ప్రాణం కుంగిపోయేలా’ అని ఇచ్చి, మరింత అక్షరార్థ ప్రత్యామ్నాయాలను పాదసూచికలో ఉంచాం.
