source:
  edition: WLC
  text: אִם הֲנִיפ֣וֹתִי עַל יָת֣וֹם יָדִ֑/י כִּֽי אֶרְאֶ֥ה בַ֝/שַּׁ֗עַר עֶזְרָתִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/031/021.yaml
  text: if I have raised my hand against the fatherless because I saw that I had support in the gate—[a][b][c]
translation:
  language: te
  text: తండ్రిలేనివానిపై[a] నేను నా చేయి ఎత్తి ఉంటే—నగర ద్వారం వద్ద[b] నాకు అండ ఉందని చూసి—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అనాథపై.’ ఇక్కడి హీబ్రూ పదం ప్రత్యేకంగా తండ్రిని కోల్పోయిన, అందువల్ల సామాజికంగా రక్షణలేని వ్యక్తిని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘నగర ద్వారం’ వద్ద పెద్దలు న్యాయ విచారణలు జరిపి, ప్రజా నిర్ణయాలు చేసేవారు.
    reason: cultural_note
lexical_decisions:
- source_word: אִם
  choice: ఉంటే
  rationale: యోబు 31లోని షరతుతో కూడిన ప్రమాణ వాక్య నిర్మాణాన్ని సహజమైన తెలుగులో నిలుపుతుంది; దాని పరిణామం తరువాతి వచనంలో వస్తుంది.
- source_word: הֲנִיפוֹתִי
  choice: నేను నా చెయ్యి ఎత్తి
  rationale: נוּף హిఫిల్ రూపం ఇక్కడ బెదిరింపు లేదా హాని చేసే ఉద్దేశంతో చెయ్యి ఎత్తడాన్ని సూచిస్తుంది. చర్యను అతిగా నిర్దిష్టం చేయకుండా విరోధ భావాన్ని నిలుపుతుంది.
- source_word: עַל
  choice: విరోధంగా
  rationale: చెయ్యి ఎత్తడం అనే శత్రుత్వపూర్వక సందర్భంలో ప్రతికూల దిశను స్పష్టంగా తెలియజేస్తుంది.
- source_word: יָתוֹם
  choice: తండ్రిలేని బిడ్డకు
  rationale: యాతோம் అనే పదం ప్రత్యేకంగా తండ్రిని కోల్పోయి సామాజికంగా రక్షణలేని స్థితిలో ఉన్న బిడ్డను సూచిస్తుంది.
- source_word: יָדִי
  choice: నా చెయ్యి
  rationale: మూలంలోని శరీర భాగ పదాన్ని నిలుపుతూ, తెలుగులో అర్థమయ్యే విరోధపూర్వక నుడికారాన్ని కాపాడుతుంది.
- source_word: כִּי
  choice: అని
  rationale: అండ ఉందని గ్రహించడమే ఆ దుర్వినియోగ చర్యకు కారణమనే సంబంధాన్ని తెలుగు వాక్య నిర్మాణంలో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אֶרְאֶה
  choice: చూసి
  rationale: భౌతికంగా చూడటం మాత్రమే కాక, తనకు అండ ఉందని గ్రహించడాన్ని కూడా సందర్భానుసారంగా వ్యక్తం చేయగల సహజ రూపం.
- source_word: בַשַּׁעַר
  choice: నగర ద్వారం దగ్గర
  rationale: שער సాధారణ ద్వారం మాత్రమే కాదు, న్యాయ విచారణలు మరియు ప్రజా నిర్ణయాలు జరిగే నగర ద్వార ప్రదేశమని సందర్భం సూచిస్తుంది; ‘నగర’ అనే వివరణ భావాన్ని స్పష్టం చేస్తుంది.
- source_word: עֶזְרָתִי
  choice: నాకు అండ
  rationale: అక్షరార్థంగా ‘నా సహాయం’; ఇక్కడ న్యాయ లేదా ప్రజా వేదికలో లభించే మద్దతు, పలుకుబడి అనే భావాన్ని ‘అండ’ సహజంగా అందిస్తుంది.
