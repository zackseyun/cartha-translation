translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన, సాధారణ పాఠకులకు స్పష్టమైన శైలి. షరతుతో కూడిన ప్రమాణ వాక్యం తరువాతి వచనంలో కొనసాగుతుందని చూపడానికి చివర దీర్ఘ విరామ చిహ్నం ఉంచబడింది. అన్ని పాదటిప్పణి సూచికలు ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
