  choice: పేదవారు కోరినదాన్ని వారికి దక్కకుండా చేసి ఉంటే
  rationale: מנע యొక్క ‘అడ్డుకోవడం/దక్కనివ్వకపోవడం’ అనే భావాన్ని, חפץ యొక్క ‘కోరినది’ అనే విస్తృత అర్థాన్ని నిలుపుతుంది; సందర్భం అవసరాన్ని సూచించినా దానికే పరిమితం చేయదు.
- source_word: דַּלִּים
  choice: పేదవారు
  rationale: సామాజిక న్యాయ సందర్భంలో ‘పేదవారు’ సహజమైనది; ఈ బహువచన రూపంలోని పేద, బలహీన, అణగారిన వర్గ భావాన్ని తగినంతగా అందిస్తుంది.
- source_word: וְעֵינֵי אַלְמָנָה אֲכַלֶּה
  choice: లేదా విధవరాలి కళ్లను ఎదురుచూసి అలసిపోయేలా చేసి ఉంటే
  rationale: కళ్లను క్షీణింపజేయడం అనే హీబ్రూ నుడికారాన్ని పూర్తిగా తొలగించకుండా, దీర్ఘ నిరీక్షణతో ఆశాభంగం కలిగించడం అనే సందర్భార్థాన్ని తెలుగులో గ్రాహ్యంగా చేస్తుంది.
