  text: אִם אֶ֭מְנַע מֵ/חֵ֣פֶץ דַּלִּ֑ים וְ/עֵינֵ֖י אַלְמָנָ֣ה אֲכַלֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/031/016.yaml
  text: If I have withheld the poor from their desire[a], or caused the eyes of the widow to fail[b],
translation:
  language: te
  text: నేను పేదవారు కోరినదాన్ని వారికి ఇవ్వకుండా ఉండి ఉంటే[a], లేదా విధవరాలి కళ్లను ఎదురుచూపులతో క్షీణింపజేసి ఉంటే[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరొక అనువాదం: “పేదవారికి వారు కోరినదాన్ని ఇవ్వకుండా ఉండి ఉంటే”; సందర్భాన్ని బట్టి, “వారికి అవసరమైనదాన్ని ఇవ్వకుండా ఉండి ఉంటే” అని కూడా అర్థం కావచ్చు.'
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “విధవరాలి కళ్లను క్షీణింపజేసి ఉంటే.” ఇది సుదీర్ఘ నిరీక్షణ, ఆశాభంగం లేదా నెరవేరని ఆశను తెలిపే హీబ్రూ నుడికారం.
    reason: cultural_note
