translation:
  language: te
  text: అప్పుడు నా భుజం దాని కీలు నుండి పడిపోవుగాక[a]; నా బాహువు దాని ఎముక నుండి విరిగిపోవుగాక[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘భుజం దగ్గర నుండి.’ హీబ్రూ పదం భుజం లేదా వీపు ప్రాంతాన్ని సూచించగలదు; ఇక్కడ భుజం తన స్థానంనుండి ఊడిపోవడం భావమై ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘దాని కీలు నుండి.’ ఇక్కడి అరుదైన హీబ్రూ పదం బాహువు ఎముకను లేదా కీలు నిర్మాణాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּתֵפִי
  choice: నా భుజం
  rationale: כָּתֵף సాధారణంగా భుజాన్ని సూచిస్తుంది; తరువాత వచ్చే ‘బాహువు’తో సహజమైన శరీర భాగాల సమాంతరతను నిలుపుతుంది.
- source_word: מִשִּׁכְמָה
  choice: దాని కీలు నుండి
  rationale: שִׁכְמָה భుజం లేదా వీపు ప్రాంతాన్ని సూచించగలదు. ఈ శరీరహాని శాప సందర్భంలో భుజం అమరిన చోటు నుండి వేరవడమనే భావాన్ని ‘కీలు నుండి’ సహజంగా తెలియజేస్తుంది; పదంలోని అనిశ్చితిని పాదటిప్పణిలో ఉంచాం.
- source_word: תִפּוֹל
  choice: పడిపోవుగాక
  rationale: נפל అనే క్రియ యొక్క ప్రత్యక్ష ‘పడు’ చిత్రణను నిలుపుతూ, శాపార్థక ఆశంసను తెలుగులో ‘పడిపోవుగాక’తో వ్యక్తం చేశాం.
- source_word: וְאֶזְרֹעִי
  choice: నా బాహువు
  rationale: זְרוֹעַకు సాధారణ అర్థం ‘బాహువు/చెయ్యి.’ శరీర నిర్మాణ సందర్భంలో ‘బాహువు’ స్పష్టంగా, గౌరవప్రదంగా ఉంది.
- source_word: מִקָּנָה
  choice: దాని ఎముక దగ్గర
  rationale: קָנֶה ఇక్కడ అరుదైన శరీర నిర్మాణ పదం. సమాంతర శాపంలో బాహువు ఎముక లేదా కీలు నిర్మాణం ఉద్దేశించబడినట్లు కనిపిస్తుంది. ప్రధాన పాఠంలో ‘ఎముక దగ్గర’ను ఎంచుకుని, ‘కీలు వద్ద’ అనే సాధ్యతను పాదటిప్పణిలో ఇచ్చాం.
- source_word: תִשָּׁבֵר
  choice: విరిగిపోవుగాక
  rationale: שׁבר నిఫాల్ రూపం ‘విరిగిపోవు’ అనే నిష్క్రియ భావాన్ని ఇస్తుంది; ‘ముక్కలైపోవు’ కంటే ఇది మూలానికి దగ్గరగా ఉంది.
