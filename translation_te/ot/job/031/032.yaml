  text: The sojourner did not spend the night outside[a]; I opened my doors to the traveler.
translation:
  language: te
  text: 'పరదేశి బయట రాత్రి గడపలేదు;

    ప్రయాణికునికి నా తలుపులు తెరిచాను.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పరదేశి వీధిలో బసచేయలేదు; బాటసారికి నా తలుపు తెరిచాను.”
    reason: בַּחוּץ అనే పదానికి ‘వీధిలో,’ יָלִין అనే పదానికి ‘బసచేయడం,’ אֹרַח అనే పదానికి ‘బాటసారి’ అనే భావాలు కూడా సాధ్యమైనవి; దלתַי రూపం మూలంలో బహువచనమైనప్పటికీ తెలుగులో ఏకవచనంగా కూడా సహజంగా చెప్పవచ్చు.
lexical_decisions:
- source_word: בַּחוּץ
  choice: బయట
  rationale: ఈ పదం ఇంటి వెలుపల లేదా ఆరుబయట అనే భావాన్ని ఇస్తుంది. ఆధునిక తెలుగులో ‘బయట’ సహజంగా, మూలానికి దగ్గరగా ఉంది.
- source_word: יָלִין
  choice: రాత్రి గడపలేదు
  rationale: לין అనే క్రియ రాత్రిపూట బసచేయడాన్ని సూచిస్తుంది. ‘రాత్రి గడపలేదు’ దాని కాలసంబంధ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: גֵּר
  choice: పరదేశి
  rationale: గేర్ అనేది స్థానికుడు కాని, ఇతరుల మధ్య నివసించే సామాజికంగా బలహీనుడైన వ్యక్తిని సూచించగలదు. ‘పరదేశి’ ఈ భావాన్ని సాధారణ ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: דְּלָתַי
  choice: నా తలుపులు
  rationale: హీబ్రూ రూపం ప్రథమ పురుష ఏకవచన ప్రత్యయంతో కూడిన బహువచనం. అందువల్ల ‘నా తలుపులు’ అని అనువదించడం రూపాన్ని కాపాడుతుంది.
- source_word: לָאֹרַח
  choice: ప్రయాణికునికి
  rationale: ఈ సందర్భంలో אֹרַח దారిని కాక, బస అవసరమైన బాటసారిని లేదా ప్రయాణికుణ్ణి సూచిస్తుంది. ‘ప్రయాణికుడు’ నేటి పాఠకులకు సులభంగా అర్థమవుతుంది.
- source_word: אֶפְתָּח
  choice: తెరిచాను
  rationale: ఇక్కడ అసంపూర్ణ క్రియారూపం యోబు గతంలో అలవాటుగా చేసిన కార్యాన్ని సూచిస్తుంది. తెలుగులో సాధారణ భూతకాలం సందర్భానుసారంగా ఆ భావాన్ని సహజంగా అందిస్తుంది.
