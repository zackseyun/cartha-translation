translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కానీ సులభంగా అర్థమయ్యే శైలిని వాడాం. ప్రమాణవాక్యానికి కొనసాగింపు ఉందని సూచించేందుకు చివర దీర్ఘ విరామచిహ్నాన్ని నిలిపాం.
