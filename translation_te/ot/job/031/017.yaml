  text: if I ate my morsel by myself[a], and the fatherless did not eat from it—
translation:
  language: te
  text: 'నేను నా ఆహారపు ముద్దను ఒంటరిగా తిని ఉంటే,

    తండ్రిలేనివాడు[a] దాని నుండి తినకపోయి ఉంటే—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘అనాథ.’ హీబ్రూ పదం అక్షరార్థంగా తండ్రిలేని వ్యక్తిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֹכַל
  choice: నేను ... తిని ఉంటే
  rationale: యోబు 31లోని ప్రమాణరూప షరతుల క్రమాన్ని బట్టి సాధారణ సంధికార్థం కంటే షరతును తెలుపుతూ అనువదించాం.
- source_word: פִּתִּי
  choice: నా ఆహార ముద్దను
  rationale: ఈ పదం చిన్న ఆహార భాగాన్ని లేదా ముద్దను సూచిస్తుంది. ‘రొట్టెముక్క’ అని ఆహారాన్ని అనవసరంగా నిర్దిష్టం చేయకుండా, దాని స్పష్టమైన చిన్న-భాగ భావాన్ని నిలిపాం.
- source_word: לְבַדִּי
  choice: ఒంటరిగా
  rationale: ఇతరులతో పంచుకోకుండా తానే తినడం అనే సందర్భార్థాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; ‘నా కోసమే’ అనే అదనపు ఉద్దేశాన్ని చేర్చదు.
- source_word: וְלֹא אָכַל
  choice: తినకపోయి ఉంటే
  rationale: రెండో వాక్యభాగాన్ని కూడా అదే ప్రమాణరూప షరతులో సమన్వయించాం. ‘నేను తిననివ్వకపోతే’ అని మార్చకుండా, మూలంలోని కర్త మరియు క్రియను నిలిపాం.
- source_word: יָתוֹם
  choice: తండ్రిలేనివాడు
  rationale: హీబ్రూ పదం ప్రత్యేకంగా తండ్రిని కోల్పోయిన సామాజికంగా బలహీనుడైన వ్యక్తిని సూచిస్తుంది. సాధారణమైన ‘అనాథ’ కంటే ఈ రూపం మూలపదానికి మరింత సమీపం.
- source_word: מִמֶּנָּה
  choice: దానిలో నుంచి
  rationale: స్త్రీలింగ ఏకవచన ప్రత్యయం ముందున్న ఆహార ముద్దను సూచిస్తుంది. తెలుగులో సహజంగా వస్తువు నుంచి కొంత తినడం అనే భాగార్థాన్ని వ్యక్తం చేశాం.
