translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరత కలిగిన న్యాయపరమైన శైలి ఉపయోగించబడింది. ‘దాసుడు/దాసి’ సంప్రదాయ బైబిలు పదజాలాన్ని నిలుపుతూ, బానిసత్వ భావాన్ని పాదసూచికలో స్పష్టం చేస్తుంది. వాక్యం తదుపరి వచనంతో కొనసాగే ప్రమాణ-షరతు నిర్మాణం కావడంతో చివర కామా ఉంచబడింది.
