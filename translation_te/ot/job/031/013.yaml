source:
  edition: WLC
  text: אִם אֶמְאַ֗ס מִשְׁפַּ֣ט עַ֭בְדִּ/י וַ/אֲמָתִ֑/י בְּ֝/רִבָ֗/ם עִמָּדִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/031/013.yaml
  text: If I have rejected the case of my male servant or my female servant when they brought a complaint against me[b][a],
translation:
  language: te
  text: నా దాసుడు గాని దాసి గాని[b] నాపై ఫిర్యాదు చేసినప్పుడు, వారి వ్యాజ్యాన్ని[a] నేను తిరస్కరించి ఉంటే,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘వారి న్యాయమైన హక్కును.’ హీబ్రూ పదం న్యాయం, న్యాయమైన హక్కు లేదా న్యాయవ్యాజ్యం అనే అర్థాలను ఇవ్వగలదు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ పదాలు ‘నా బానిస, నా బానిస స్త్రీ’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: చేసి ఉంటే
  rationale: యోబు తన నిర్దోషిత్వాన్ని ప్రమాణపూర్వకంగా ప్రకటించే షరతు వాక్యాన్ని తెలుగులో సహజంగా సూచిస్తుంది.
- source_word: אֶמְאַס
  choice: నేను తిరస్కరించి ఉంటే
  rationale: న్యాయ సందర్భంలో ఒకరి వాదనను లేదా వ్యాజ్యాన్ని అంగీకరించకుండా తోసిపుచ్చడాన్ని స్పష్టంగా తెలియజేస్తుంది; కేవలం వ్యక్తిగత ద్వేషభావాన్ని సూచించదు.
- source_word: מִשְׁפַּט
  choice: వారి వ్యాజ్యాన్ని
  rationale: ఈ పదానికి న్యాయం, హక్కు, తీర్పు, న్యాయవ్యాజ్యం అనే భావాలు ఉండవచ్చు. ఇక్కడ యజమానికి వ్యతిరేకంగా దాసులు చేసిన ఫిర్యాదు సందర్భంలో ‘వ్యాజ్యం’ న్యాయపరమైన భావాన్ని సహజంగా అందిస్తుంది.
- source_word: עַבְדִּי
  choice: నా దాసుడు
  rationale: עֶבֶד సూచించే అధీన సేవకుడు లేదా బానిస స్థితిని ‘దాసుడు’ గౌరవప్రదమైన బైబిలు శైలిలో తెలియజేస్తుంది; జతగా ఉన్న స్త్రీలింగ పదంతో లింగభేదమూ స్పష్టమవుతుంది.
- source_word: וַאֲמָתִי
  choice: దాసి
  rationale: אָמָה అనే స్త్రీలింగ అధీన సేవకురాలు లేదా బానిస భావాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: בְּרִיבָם
  choice: ఫిర్యాదు చేసినప్పుడు
  rationale: רִיב లోని వివాదం, న్యాయపోరాటం లేదా ఫిర్యాదు భావాన్ని సందర్భానుసారంగా క్రియారూపంలో స్పష్టంగా అందిస్తుంది.
- source_word: עִמָּדִי
  choice: నాపై
  rationale: అక్షరార్థంగా ‘నాతో’ అయినా, వివాద సందర్భంలో యోబుకు వ్యతిరేకంగా వాదన లేదా ఫిర్యాదు చేయడాన్ని ‘నాపై’ సహజంగా వ్యక్తపరుస్తుంది.
