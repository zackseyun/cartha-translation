language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: מִ֤י יִתֶּן לִ֨/י שֹׁ֘מֵ֤עַֽ לִ֗/י הֶן תָּ֭וִ/י שַׁדַּ֣י יַעֲנֵ֑/נִי וְ/סֵ֥פֶר כָּ֝תַ֗ב אִ֣ישׁ רִיבִֽ/י־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/031/035.yaml
  text: Oh[a], that I had someone to hear me! Here is my signature; let the Almighty answer me[b], and let my accuser write out the indictment.
translation:
  language: te
  text: నా మాట వినేవాడు ఎవరైనా ఉంటే బాగుండేది! ఇదిగో నా సంతకం[a]; సర్వశక్తుడు నాకు జవాబు ఇవ్వాలి, నాపై నేరం మోపేవాడు ఒక అభియోగపత్రం రాయాలి[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నా గుర్తు” లేదా “నా ధ్రువీకరణ గుర్తు.” హీబ్రూ పదం యోబు తన ప్రకటనపై ఉంచిన ధ్రువీకరణ గుర్తును సూచించే అవకాశం ఉంది.
    reason: lexical_alternative
  - marker: b
    text: మరింత అక్షరార్థంగా, “నా వివాదపు వ్యక్తి రాసిన పత్రం.” హీబ్రూ వాక్యనిర్మాణం సంక్షిప్తంగా, కొంత సందిగ్ధంగా ఉంది; సందర్భంలో యోబు తన ప్రత్యర్థి అభియోగాన్ని లిఖితంగా సమర్పించాలని కోరుతున్నాడు.
    reason: alternative_reading
lexical_decisions:
- source_word: מִי יִתֶּן
  choice: అయ్యో, ... ఉంటే ఎంత బాగుండేది!
  rationale: ఈ హీబ్రూ ప్రయోగం అక్షరార్థ ప్రశ్న కాకుండా తీవ్రమైన కోరికను వ్యక్తం చేస్తుంది; ఆధునిక తెలుగులో సహజమైన ఆకాంక్షార్థక రూపాన్ని వాడాం.
- source_word: שֹׁמֵעַ לִי
  choice: నా మాట వినేవాడు
  rationale: యోబు వాదనను ఆలకించి విచారించే వ్యక్తిని సూచిస్తుంది; న్యాయపరమైన ‘వినడం’ భావాన్ని నిలుపుతుంది.
- source_word: הֶן תָּוִי
  choice: ఇదిగో నా సంతకం
  rationale: הֶן దృష్టిని ఆకర్షిస్తుంది; תָּוִי యోబు తన ప్రకటనను ధ్రువీకరించేందుకు పెట్టిన గుర్తును సూచిస్తుంది. సందర్భానుసారంగా ‘సంతకం’ సహజమైన న్యాయపరమైన పదం.
- source_word: שַׁדַּי
  choice: సర్వశక్తుడు
  rationale: యోబు గ్రంథంలోని దైవ బిరుదుకు తెలుగులో స్థిరమైన, గౌరవప్రదమైన సమానం.
- source_word: יַעֲנֵנִי
  choice: నాకు జవాబు ఇవ్వాలి
  rationale: న్యాయవాద సందర్భంలో తన వాదనకు దేవుడు ప్రత్యుత్తరం ఇవ్వాలని యోబు కోరుతున్న భావాన్ని తెలియజేస్తుంది.
- source_word: וְסֵפֶר כָּתַב
  choice: తన అభియోగపత్రాన్ని రాసి ఇవ్వాలి
  rationale: סֵפֶר మౌలికంగా లిఖిత పత్రం; వివాద సందర్భంలో అది లిఖిత అభియోగంగా పనిచేస్తుంది. ‘రాసి ఇవ్వాలి’ కోరిక/సవాలు భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אִישׁ רִיבִי
  choice: నాపై నేరం మోపేవాడు
  rationale: అక్షరార్థంగా ‘నా వివాదపు వ్యక్తి’; ఇక్కడ యోబుపై అభియోగం తెచ్చే ప్రత్యర్థి పాత్రను స్పష్టంగా, సాధారణ పాఠకునికి అర్థమయ్యేలా తెలుపుతుంది.
theological_decisions:
- issue: యోబు విజ్ఞప్తిలోని న్యాయస్థాన రూపకం
  choice: ‘సంతకం,’ ‘నేరం మోపేవాడు,’ ‘అభియోగపత్రం’ వంటి స్పష్టమైన న్యాయపరమైన భాష
  alternative: ‘నా గుర్తు,’ ‘నా వివాదపు వ్యక్తి,’ ‘ఒక పత్రం’ వంటి మరింత అక్షరార్థ పదాలు
  rationale: హీబ్రూ సందర్భం అధికారిక వాదన, ప్రత్యుత్తరం, లిఖిత అభియోగం అనే న్యాయస్థాన దృశ్యాన్ని నిర్మిస్తుంది. దీన్ని స్పష్టపరచడం సందర్భార్థాన్ని అందిస్తుంది; ప్రత్యేక సిద్ధాంత నిర్ణయాన్ని జోడించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ‘అయ్యో’ తీవ్రమైన ఆకాంక్షను, న్యాయపరమైన పదజాలం మూలంలోని న్యాయస్థాన దృశ్యాన్ని నిలుపుతాయి.
