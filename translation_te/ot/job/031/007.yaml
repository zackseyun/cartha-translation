source:
  edition: WLC
  text: אִ֥ם תִּטֶּ֣ה אַשֻּׁרִ/י֮ מִנִּ֪י הַ֫/דָּ֥רֶךְ וְ/אַחַ֣ר עֵ֭ינַ/י הָלַ֣ךְ לִבִּ֑/י וּ֝/בְ/כַפַּ֗/י דָּ֣בַק מֻאֽוּם׃פ
base_translation:
  language: en
  yaml_path: translation/ot/job/031/007.yaml
  text: if my step has turned aside from the way[a], and my heart has gone after my eyes, and any stain has clung to my hands[b],
translation:
  language: te
  text: 'నా అడుగు మార్గం నుండి తొలగిపోయి ఉంటే,

    నా హృదయం నా కళ్ల వెంట నడిచివుంటే[a],

    నా అరచేతులకు ఏ మచ్చయైనా అంటుకొని ఉంటే[b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నా హృదయం నా కళ్లను అనుసరించి ఉంటే.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ఏ కళంకమైనా” లేదా “ఏ లోపమైనా.” హీబ్రూ పదం మచ్చను, లోపాన్ని లేదా కళంకాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּטֶּה אַשֻּׁרִי מִנִּי הַדָּרֶךְ
  choice: నా అడుగు మార్గం నుండి తొలగిపోయి ఉంటే
  rationale: ‘అడుగు,’ ‘మార్గం’ అనే స్పష్టమైన నడక రూపకాన్ని నిలిపి, నైతికంగా దారి తప్పడాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది. אִם ప్రారంభించే ప్రమాణపూర్వక షరతుకు ‘ఉంటే’ సరిపోతుంది.
- source_word: וְאַחַר עֵינַי הָלַךְ לִבִּי
  choice: నా హృదయం నా కళ్ల వెంట నడిచివుంటే
  rationale: చూసినదాని వెంట అంతరంగ కోరిక సాగుతుందనే హీబ్రూ చిత్రణను ‘హృదయం,’ ‘కళ్లు’ అనే పదాలతో యథాతథంగా కాపాడుతుంది; ‘వెంట నడవడం’ తెలుగులోనూ అర్థమయ్యే రూపకం.
- source_word: וּבְכַפַּי דָּבַק
  choice: నా అరచేతులకు ... అంటుకొని ఉంటే
  rationale: כַּף ఇక్కడ అరచేతిని సూచిస్తుంది; דבק లోని అంటుకోవడం లేదా అతుక్కోవడం అనే స్పష్టమైన చిత్రాన్ని ‘అంటుకొని’ సహజంగా అందిస్తుంది.
- source_word: מֻאוּם
  choice: ఏ మచ్చయైనా
  rationale: ఈ పదం మచ్చ, లోపం లేదా కళంకాన్ని సూచించగలదు. చేతులకు అంటుకునే నైతిక కల్మషపు రూపకానికి ‘మచ్చ’ సహజంగా సరిపోతుంది; ‘ఏ...యైనా’ హీబ్రూ షరతులోని అనిర్దిష్ట భావాన్ని తెలియజేస్తుంది.
theological_decisions:
- issue: ‘మార్గం’ అనే నైతిక రూపకం
  choice: ‘మార్గం’ అనే concrete రూపకాన్ని నిలిపివేయడం
  alternative: ‘సత్ప్రవర్తన నుండి తొలగిపోవడం’ అని భావాన్ని విప్పి చెప్పడం
  rationale: మూలపాఠం నైతిక నడవడిని ప్రయాణ మార్గంగా చిత్రిస్తుంది. దానిని నేరుగా నైతిక నిర్వచనంగా మార్చకుండా ఉంచడం సాహిత్య, ధార్మిక ఉద్వేగాన్ని కాపాడుతుంది.
- issue: హృదయం కళ్ల వెంట వెళ్లడం
  choice: ‘హృదయం,’ ‘కళ్లు’ రెండింటినీ నిలిపి, హృదయం కళ్ల వెంట నడిచిందని అనువదించడం
  alternative: ‘నేను చూసినవాటిని ఆశించి ఉంటే’ అని అర్థాన్ని విప్పడం
  rationale: మూలంలోని శరీరాంగ రూపకాలు చూపు మరియు అంతరంగ కోరిక మధ్య సంబంధాన్ని ఉద్దేశపూర్వకంగా వ్యక్తం చేస్తాయి. వాటిని నిలిపితే భావాన్ని ఒక నిర్దిష్ట మానసిక లేదా సిద్ధాంతపరమైన వివరణకు పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ఇది తరువాతి వచనంలో పూర్తయ్యే ప్రమాణపూర్వక షరతు కాబట్టి ప్రతి పాదంలో ‘ఉంటే’ రూపాన్ని, చివరలో కామాను ఉంచాం.
