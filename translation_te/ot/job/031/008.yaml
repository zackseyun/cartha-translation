source:
  edition: WLC
  text: אֶ֭זְרְעָה וְ/אַחֵ֣ר יֹאכֵ֑ל וְֽ/צֶאֱצָאַ֥/י יְשֹׁרָֽשׁוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/031/008.yaml
  text: then let me sow and another eat[a], and let my offspring be uprooted.
translation:
  language: te
  text: అప్పుడు నేను విత్తుగాక; మరొకడు తినుగాక; నా సంతానం[a] వేళ్లతో సహా పెకలింపబడుగాక.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నా పంట వేళ్లతో సహా పెకలింపబడుగాక.” ఇక్కడి హీబ్రూ పదం సంతానాన్ని గానీ, మొలిచి వచ్చిన పంటను గానీ సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶזְרְעָה
  choice: నేను విత్తినదాన్ని
  rationale: ఇది זרע ధాతువు యొక్క Qal cohortative రూపం. శాపప్రమాణ సందర్భంలోని ఆశంసార్థక బలాన్ని తరువాతి ‘తినుగాక’తో సహజంగా వ్యక్తం చేస్తూ, తెలుగులో అవసరమైన కర్మను సందర్భానుసారంగా సూచిస్తుంది.
- source_word: וְאַחֵר
  choice: మరొకడు
  rationale: అయోబు శ్రమ ఫలాన్ని వేరొక వ్యక్తి అనుభవిస్తాడనే వ్యత్యాసాన్ని సంక్షిప్తంగా, సహజంగా నిలుపుతుంది.
- source_word: יֹאכֵל
  choice: తినుగాక
  rationale: אכל యొక్క ప్రత్యక్ష వ్యవసాయ చిత్రమైన ‘తిను’ను నిలుపుతూ, స్వీయశాపంలోని ఆశంసార్థక భావాన్ని ‘-గాక’ ద్వారా తెలియజేస్తుంది.
- source_word: וְצֶאֱצָאַי
  choice: నా సంతానం
  rationale: צֶאֱצָא అంటే బయటికి వచ్చినది అనే మూలభావంతో సంతానం లేదా పంట దిగుబడి రెండింటినీ సూచించగలదు. ప్రధాన పాఠంలో సంభావ్య మానవ/కుటుంబార్థమైన ‘సంతానం’ను ఎంచుకుని, వ్యవసాయార్థాన్ని పాదటిప్పణిలో నిలిపాం.
- source_word: יְשֹׁרָשׁוּ
  choice: వేళ్లతో సహా పెకలింపబడుగాక
  rationale: שׁרשׁ యొక్క Piel రూపం వేళ్లతో పెకలించివేయబడే బలమైన చిత్రాన్ని ఇస్తుంది. ‘పెకలింపబడుగాక’ ఆ నిష్క్రియ, శాపార్థక భావాలను రెండింటినీ నిలుపుతుంది.
theological_decisions:
- issue: צֶאֱצָאַי మానవ సంతానాన్నా, పంట దిగుబడిననా సూచిస్తుంది?
  choice: ప్రధాన పాఠంలో ‘నా సంతానం’
  alternative: ‘నా పంట’ లేదా ‘నా దిగుబడి’
  rationale: పదం రెండర్థాలకు వీలిస్తుంది. వ్యక్తిగత స్వీయశాప సందర్భంలో సంతానార్థం బలంగా ఉన్నా, ముందున్న విత్తడం-తినడం చిత్రణ వ్యవసాయార్థానికీ మద్దతిస్తుంది; కాబట్టి అస్పష్టతను పాదటిప్పణిలో స్పష్టంగా ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన ప్రమాణ-శాప శైలిని నిలుపుటకు ‘-గాక’ రూపాన్ని వాడాం. ‘వేళ్లతో సహా పెకలించు’ అనే సహజమైన వ్యవసాయ చిత్రం మూలంలోని root imageryని స్పష్టంగా అందిస్తుంది.
