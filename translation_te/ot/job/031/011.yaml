  text: For that is a disgraceful act[a], and it is an iniquity for the judges.
translation:
  language: te
  text: ఎందుకంటే అది నీచమైన కార్యం; అది న్యాయాధిపతుల విచారణకు తగిన అపరాధం.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “న్యాయాధిపతులు శిక్షించవలసిన అపరాధం.”
    reason: פְּלִילִים అనే పదబంధం న్యాయాధిపతుల ఎదుట విచారణను లేదా వారు విధించే శిక్షకు పాత్రమైన అపరాధాన్ని సూచించవచ్చు.
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి వచనంలో చేసిన ప్రమాణానికి కారణాన్ని పరిచయం చేస్తుంది.
- source_word: הוא
  choice: అది
  rationale: సందర్భంలో ప్రస్తావించిన వ్యభిచార కార్యాన్ని సూచించే సర్వనామంగా సహజంగా అనువదించబడింది.
- source_word: זִמָּה
  choice: నీచమైన కార్యం
  rationale: ఈ పదం తీవ్రమైన, ముఖ్యంగా లైంగికంగా అనైతికమైన కార్యాన్ని సూచిస్తుంది; ఈ అనువాదం దాని నైతిక తీవ్రతను ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: וְהִיא
  choice: అది
  rationale: స్త్రీలింగ నామవాచకమైన זִמָּהను తిరిగి సూచిస్తూ అదే కార్యం గురించి రెండవ నిర్ధారణను తెలియజేస్తుంది; తెలుగులో లింగభేదం చూపనవసరం లేదు.
- source_word: עָוֺן
  choice: అపరాధం
  rationale: నైతిక దోషంతోపాటు న్యాయపరమైన బాధ్యతను కూడా సూచించే సందర్భోచిత పదం.
- source_word: פְּלִילִים
  choice: న్యాయాధిపతుల విచారణకు తగిన
  rationale: ఈ బహువచన పదం న్యాయాధికారులను లేదా న్యాయనిర్ణయాన్ని సూచించగలదు. ప్రధాన పాఠం న్యాయస్థాన విచారణ భావాన్ని సహజమైన తెలుగులో ఉంచుతుంది; శిక్షార్హత అనే మరింత వ్యాఖ్యానాత్మక భావాన్ని పాదసూచికలో ఇస్తుంది.
