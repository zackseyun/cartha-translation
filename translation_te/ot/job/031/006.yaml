source:
  edition: WLC
  text: יִשְׁקְלֵ֥/נִי בְ/מֹאזְנֵי צֶ֑דֶק וְ/יֵדַ֥ע אֱ֝ל֗וֹהַּ תֻּמָּתִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/031/006.yaml
  text: Let him weigh me in righteous scales[b][a], and let God know my integrity.
translation:
  language: te
  text: దేవుడు నన్ను న్యాయమైన త్రాసుల్లో తూచుగాక[a]; ఆయన నా యథార్థతను తెలిసికొనుగాక[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూలభాషలో అక్షరార్థంగా ‘న్యాయపు త్రాసుల్లో’; ‘నిజమైన త్రాసుల్లో’ లేదా ‘న్యాయమైన తూకంలో’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘యథార్థత’కు ‘నిందారాహిత్యం’ లేదా ‘నిర్దోషిత్వం’ అనే అర్థాలు కూడా సాధ్యమే.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׁקְלֵנִי
  choice: ఆయన నన్ను ... తూచుగాక
  rationale: שקל అనే క్రియ యొక్క అసంపూర్ణ రూపం ఈ సందర్భంలో ఆకాంక్షార్థకంగా ఉంది; యోబు తనను పరీక్షించమని దేవుణ్ణి ఆహ్వానిస్తున్న భావాన్ని ఇది నిలుపుతుంది.
- source_word: בְמֹאזְנֵי צֶדֶק
  choice: న్యాయమైన త్రాసులో
  rationale: מֹאזְנַיִם తూకం వేసే త్రాసును, צֶדֶק న్యాయం లేదా సరిగా ఉండడాన్ని సూచిస్తాయి. ఈ ప్రయోగం పక్షపాతం లేని న్యాయమైన పరిశీలన అనే రూపకాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: וְיֵדַע
  choice: అప్పుడు ... తెలుసుకుంటాడు
  rationale: వావ్‌తో కూడిన అసంపూర్ణ క్రియను మొదటి వాక్యంలోని ఆకాంక్షకు అనుసరించే ఫలితంగా సహజ తెలుగులో వ్యక్తం చేశాం. ‘తెలుసుగాక’ కూడా సాధ్యమే; అయితే ఇక్కడ దేవునికి సమాచారం కొత్తగా లభిస్తుందన్న భావం కంటే పరీక్ష ద్వారా యోబు యథార్థత వెల్లడవడం ప్రధానంగా వినిపిస్తుంది.
- source_word: אֱלוֹהַּ
  choice: దేవుడు
  rationale: ఇది యోబు గ్రంథంలో సాధారణమైన ఏకవచన కవితాత్మక దైవనామం; అదనంగా ‘సర్వశక్తిమంతుడు’ అని విస్తరించడానికి ఈ వచనంలో ఆధారం లేదు.
- source_word: תֻּמָּתִי
  choice: నా యథార్థతను
  rationale: תֻּמָּה సంపూర్ణత, నిందారాహిత్యం, నైతిక సమగ్రత అనే భావాలను కలిగి ఉంది. ‘యథార్థత’ యోబు చెప్పుకునే నైతిక నిబద్ధతను తెలియజేస్తూ, సంపూర్ణ పాపరాహిత్యాన్ని అతిగా ప్రకటించదు.
theological_decisions:
- issue: యోబు తన గురించి చేస్తున్న వాదన యొక్క తీవ్రత
  choice: నా యథార్థతను
  alternative: నా నిర్దోషిత్వాన్ని / నా నిందారాహిత్యాన్ని
  rationale: యోబు న్యాయమైన దైవపరీక్షను కోరుతున్నాడు. మూలపదంలోని నైతిక సమగ్రత భావాన్ని ‘యథార్థత’ నిలుపుతుంది; అయితే అతడు సంపూర్ణంగా పాపరహితుడని అనువాదమే తేల్చివేయదు.
- issue: וְיֵדַע లోని క్రియాభావం
  choice: అప్పుడు దేవుడు ... తెలుసుకుంటాడు
  alternative: దేవుడు ... తెలుసుగాక
  rationale: హీబ్రూ అసంపూర్ణ క్రియ మొదటి ఆకాంక్షార్థక క్రియను కొనసాగించగలదు లేదా దాని ఫలితాన్ని సూచించగలదు. ప్రధాన పాఠ్యంలో సహజమైన ఫలితార్థాన్ని ఇచ్చి, ప్రత్యామ్నాయ ఆకాంక్షార్థాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన, కానీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘తూచుగాక’ ఆకాంక్షార్థాన్ని కాపాడుతుంది; ‘త్రాసు’ న్యాయపరీక్ష రూపకాన్ని స్పష్టంగా ఉంచుతుంది.
