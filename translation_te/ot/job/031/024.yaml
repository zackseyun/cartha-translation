language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אִם שַׂ֣מְתִּי זָהָ֣ב כִּסְלִ֑/י וְ֝/לַ/כֶּ֗תֶם אָמַ֥רְתִּי מִבְטַחִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/031/024.yaml
  text: If I have made gold my confidence[a], and said to fine gold[c][b], ‘You are my security,’
translation:
  language: te
  text: 'నేను బంగారాన్ని నా నమ్మకంగా పెట్టుకొని ఉంటే,

    మేలిమి బంగారానికి, ‘నీవే నా ఆధారం’ అని చెప్పి ఉంటే—'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִם
  choice: ఉంటే
  rationale: యోబు నిర్దోషిత్వ ప్రమాణంలోని షరతును తెలుగులో సహజంగా తెలిపేందుకు క్రియతో కూడిన ‘ఉంటే’ నిర్మాణం వాడబడింది.
- source_word: שַׂמְתִּי
  choice: చేసుకొని ఉంటే
  rationale: మూల క్రియకు ‘పెట్టడం/ఉంచడం’ అనే అర్థం ఉన్నా, బంగారాన్ని ఆధారమైన ధైర్యంగా పరిగణించిన ఫలితార్థాన్ని ఈ సందర్భంలో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: זָהָב
  choice: బంగారం
  rationale: సాధారణ పదార్థార్థాన్ని నేరుగా అందిస్తుంది.
- source_word: כִּסְלִי
  choice: నా ధైర్యం
  rationale: ఈ పదం ధైర్యం, నమ్మకం, నిరీక్షణ అనే భావాలను ఇవ్వగలదు. తరువాతి מִבְטַחִי పదంతో ఉన్న మూలభాషా వైవిధ్యాన్ని నిలుపుతూ, సంపదపై పెట్టుకున్న మనోధైర్యం/ఆధారాన్ని సూచిస్తుంది.
- source_word: וְלַכֶּתֶם
  choice: మేలిమి బంగారంతో
  rationale: כֶּתֶם శుద్ధి చేసిన లేదా స్వచ్ఛమైన బంగారాన్ని సూచిస్తుంది; ‘మేలిమి బంగారం’ మొదటి ‘బంగారం’ నుండి తేడాను నిలుపుతుంది. לְ ఇక్కడ ‘చెప్పడం’ క్రియకు పరోక్ష కర్మను సూచిస్తున్నందున తెలుగులో ‘తో’ సహజం.
- source_word: אָמַרְתִּי
  choice: చెప్పి ఉంటే
  rationale: మొదటి షరతుతో సమాంతరంగా ఉండే పూర్తయిన చర్యను తెలుగులో సహజమైన షరతు నిర్మాణంతో వ్యక్తం చేస్తుంది.
- source_word: מִבְטַחִי
  choice: నా భద్రత
  rationale: నమ్మి ఆధారపడే వస్తువు లేదా భద్రత అనే భావాన్ని ఇస్తుంది; כִּסְלִיతో ఒకే తెలుగు పదాన్ని పునరావృతం చేయకుండా మూలంలోని పదవైవిధ్యాన్ని కాపాడుతుంది.
theological_decisions:
- issue: సంపదపై నమ్మకం ఉంచాననే విషయాన్ని యోబు నిరాకరించడం
  choice: ‘నేను బంగారాన్ని నా ధైర్యంగా చేసుకొని ఉంటే...’ అనే షరతుతో కూడిన నిర్దోషిత్వ ప్రమాణంగా వ్యక్తీకరించడం
  alternative: ‘నేను బంగారంపై నా నిరీక్షణ పెట్టుకొని ఉంటే...’
  rationale: యోబు సంపదను అంతిమ ఆధారంగా చేసుకున్నాననే ఆరోపణను ప్రమాణరీతిలో నిరాకరిస్తున్నాడు. తరువాతి వాక్యాలతో కొనసాగే షరతు తెరవబడి ఉండేలా దీర్ఘరేఖను ఉంచి, తరువాతి సిద్ధాంత వర్గాలను ఇందులోకి దిగుమతి చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. మూలంలోని రెండు బంగారం పదాల తేడాను ‘బంగారం/మేలిమి బంగారం’గా, ఆధారాన్ని సూచించే రెండు నామవాచకాల తేడాను ‘ధైర్యం/భద్రత’గా నిలిపింది. ఇది తరువాతి వచనంలో పూర్తయ్యే షరతు కావడంతో చివర దీర్ఘరేఖ వాడబడింది.
