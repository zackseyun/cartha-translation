source:
  edition: WLC
  text: הֲ/לֹא אֵ֥יד לְ/עַוָּ֑ל וְ֝/נֵ֗כֶר לְ/פֹ֣עֲלֵי אָֽוֶן־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/031/003.yaml
  text: Is not disaster for the unrighteous[b][a], and calamity for the workers of iniquity?
translation:
  language: te
  text: అన్యాయకారునికి ఆపద[a], దుర్మార్గం చేసేవారికి విపత్తు[b] కాదా?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘వినాశం’.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘దుర్గతి’.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: కాదా?
  rationale: అవుననే సమాధానాన్ని ఆశించే అలంకార ప్రశ్నను సహజమైన ఆధునిక తెలుగు ప్రశ్నాంతంతో నిలిపింది.
- source_word: אֵיד
  choice: ఆపద
  rationale: వినాశకరమైన దుర్గతిని సూచించే ఈ పదానికి స్పష్టమైన, గంభీరమైన తెలుగు పదం; సమాంతర పదమైన ‘విపత్తు’తో స్వల్ప భేదాన్ని ఉంచుతుంది.
- source_word: לְעַוָּל
  choice: అన్యాయస్థునికి
  rationale: అన్యాయం లేదా దుర్నీతితో లక్షణీకరించబడిన వ్యక్తిని సూచించే ఏకవచన నామార్థాన్ని నిలుపుతుంది.
- source_word: וְנֵכֶר
  choice: విపత్తు
  rationale: ఈ న్యాయసంబంధ సమాంతర సందర్భంలో אֵידకు సమాంతరమైన ఘోర దురవస్థను సూచిస్తుంది; ‘పరాయితనం’ అనే సాధ్యమైన మూలార్థం ఇక్కడ తక్కువ సహజం.
- source_word: לְפֹעֲלֵי
  choice: చేసేవారికి
  rationale: క్రియాశీలమైన లేదా అలవాటైన ఆచరణను ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אָוֶן
  choice: దుష్కార్యాలు
  rationale: ‘చేసేవారు’తో కలిసి నైతికంగా దోషపూరితమైన చెడు కార్యాలను సూచిస్తూ, trouble అనే ఇతర సాధ్యార్థం కంటే సందర్భానికి సరిపోతుంది.
theological_decisions:
- issue: జ్ఞానసాహిత్యంలో నైతిక ప్రతిఫల సూత్రం
  choice: ఆపద అన్యాయస్థునికి, విపత్తు దుష్కార్యాలు చేసేవారికి చెందుతాయనే సాధారణ నైతిక క్రమాన్ని ప్రశ్నరూపంలో ఉంచడం
  alternative: ఇది దేవుని ప్రత్యక్ష శిక్ష అని లేదా కేవలం సహజ పరిణామమని స్పష్టీకరించడం
  rationale: హీబ్రూ వాక్యం దుర్గతి మరియు దుష్టుల మధ్య సంబంధాన్ని చెబుతుంది గాని, అది ప్రత్యక్ష దైవశిక్షనా లేక విస్తృత నైతిక క్రమమా అని ఈ వచనంలో నిర్దిష్టం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ జ్ఞానకావ్యానికి తగిన గంభీరతను ఉంచింది. మూలంలోని ఏకవచన ‘అన్యాయస్థుడు’ మరియు బహువచన ‘దుష్కార్యాలు చేసేవారు’ భేదం నిలుపబడింది; అలంకార ప్రశ్న కూడా యథాతథంగా ఉంది.
