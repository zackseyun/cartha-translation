translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే యోబు చేసే గంభీరమైన శాపప్రకటనకు తగిన గౌరవప్రదమైన శైలిని ఉంచాం. హీబ్రూలో ధాన్యాలు, హానికర మొక్కలు ఏకవచన సమూహార్థంలో ఉన్నందున తెలుగులో సహజమైన బహువచన రూపాలు వాడాం. అందించిన ఆంగ్ల పాఠంలో [a] గుర్తు ‘wheat’ తర్వాత ఉన్నప్పటికీ, ఆ పాదటిప్పణి విషయపరంగా בָאְשָׁה అనే అనిశ్చిత మొక్కపేరుకు సంబంధించినది; అందువల్ల మూలభాషా ఆధారంగా గుర్తును ‘దుర్వాసనగల కలుపు మొక్కలు’ తర్వాత ఉంచాం.
