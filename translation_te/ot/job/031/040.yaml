source:
  edition: WLC
  text: תַּ֤חַת חִטָּ֨ה יֵ֥צֵא ח֗וֹחַ וְ/תַֽחַת שְׂעֹרָ֥ה בָאְשָׁ֑ה תַּ֝֗מּוּ דִּבְרֵ֥י אִיּֽוֹב׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/job/031/040.yaml
  text: Instead of wheat[a], let thorns come up, and instead of barley, stinkweed. The words of Job are ended.
translation:
  language: te
  text: 'గోధుమలకు బదులుగా ముళ్లు మొలవాలి;

    యవలకు బదులుగా దుర్వాసనగల కలుపు మొక్కలు[a] మొలవాలి.


    యోబు మాటలు ముగిశాయి.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “హానికరమైన కలుపు మొక్కలు”; హీబ్రూ పదం సూచించే మొక్క ఏదో ఖచ్చితంగా తెలియదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּחַת
  choice: బదులుగా
  rationale: ఇక్కడ భౌతికంగా ‘కింద’ అనే అర్థం కాకుండా, మంచి పంట స్థానంలో హానికరమైన మొక్కలు రావాలనే ప్రత్యామ్నాయ భావం ఉంది.
- source_word: חִטָּה
  choice: గోధుమలు
  rationale: ఈ ధాన్యానికి ఆధునిక ప్రామాణిక తెలుగులో సహజమైన పేరు; హానికరమైన మొక్కలతో ఉన్న వ్యత్యాసాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: יֵצֵא
  choice: మొలవాలి
  rationale: పదశః ‘బయటికి రావాలి’ అయినప్పటికీ, మొక్కలు నేలలోనుంచి పైకి రావడాన్ని తెలుగులో సహజంగా ‘మొలవాలి’ అని చెబుతారు. హీబ్రూ క్రియారూపంలోని శాపార్థక ఆకాంక్షను కూడా ఇది నిలుపుతుంది.
- source_word: חוֹחַ
  choice: ముళ్లు
  rationale: ఖచ్చితమైన జాతిని నిర్దేశించకుండా, హానికరమైన ముళ్ల మొక్కలను సూచించే సాధారణ సమూహార్థక పదంగా తీసుకున్నాం.
- source_word: שְׂעֹרָה
  choice: యవలు
  rationale: ఈ ధాన్యానికి ప్రామాణిక తెలుగు పేరు; వచనంలోని వ్యవసాయ సందర్భానికి సరిపోతుంది.
- source_word: בָאְשָׁה
  choice: దుర్వాసనగల కలుపు మొక్కలు
  rationale: ఈ పదానికి దుర్వాసన లేదా పనికిరాని హానికరమైన మొక్క అనే భావం ఉంది; ఖచ్చితమైన వృక్షజాతి తెలియనందున నిర్దిష్ట మొక్కపేరును ఉపయోగించలేదు.
- source_word: תַּמּוּ
  choice: ముగిశాయి
  rationale: యోబు పలుకుల ముగింపును తెలిపే సంక్షిప్త ముగింపు ప్రకటనగా సహజమైన, గౌరవప్రదమైన తెలుగు రూపం.
- source_word: דִּבְרֵי אִיּוֹב
  choice: యోబు మాటలు
  rationale: హీబ్రూ నిర్మాణాన్ని స్పష్టంగా, సహజంగా ప్రతిబింబిస్తుంది; ‘ప్రసంగాలు’ అని అర్థాన్ని అనవసరంగా సంకుచితం చేయదు.
