  yaml_path: translation/ot/job/021/024.yaml
  text: His pails are full of milk[a], and the marrow of his bones is well-watered.
translation:
  language: te
  text: అతని పాలపాత్రలు పాలతో నిండివున్నాయి[a]; అతని ఎముకల మజ్జ బాగా తడిసివుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతని పొదుగులు పాలతో నిండివున్నాయి.” హీబ్రూ పదం అరుదైనది; అది పొదుగులను గానీ, పాలు ఉంచే పాత్రలను గానీ సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲטִינָיו
  choice: అతని పాలపాత్రలు
  rationale: ఈ అరుదైన పదం అర్థం వివాదాస్పదం; అది పొదుగులను గానీ, పాలు ఉంచే పాత్రలను గానీ సూచించవచ్చు. ప్రధాన పాఠంలో ‘పాలపాత్రలు’ సహజంగా ఉండి సమృద్ధి భావాన్ని తెలియజేస్తుంది; ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: מָלְאוּ
  choice: నిండివున్నాయి
  rationale: క్రియ ఇక్కడ గతంలో జరిగిన చర్యకన్నా సమృద్ధిగల స్థితిని వర్ణిస్తోంది.
- source_word: חָלָב
  choice: పాలతో
  rationale: ప్రామాణిక అర్థమైన ‘పాలు’ను నిలిపి, సమృద్ధి చిత్రాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: וּמֹחַ עַצְמוֹתָיו
  choice: అతని ఎముకల మూలుగ
  rationale: ఎముకలలోని మృదువైన సారాన్ని సూచించే శరీర సంబంధమైన హీబ్రూ చిత్రాన్ని నేరుగా నిలుపుతుంది.
- source_word: יְשֻׁקֶּה
  choice: తేమగా ఉంది
  rationale: నీరు అందించబడిన లేదా తడిగా ఉంచబడిన స్థితిని సూచించే పుఅల్ రూపాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తూ, శారీరక పుష్టి భావాన్ని నిలుపుతుంది.
