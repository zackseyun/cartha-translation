translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కవితాత్మక శైలి. అరుదైన హీబ్రూ పదంలోని నిజమైన అనిశ్చితిని పాదటిప్పణిలో నిలిపాం.
