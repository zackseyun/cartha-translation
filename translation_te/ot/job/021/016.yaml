source:
  edition: WLC
  text: הֵ֤ן לֹ֣א בְ/יָדָ֣/ם טוּבָ֑/ם עֲצַ֥ת רְ֝שָׁעִ֗ים רָ֣חֲקָה מֶֽ/נִּי׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/016.yaml
  text: Look, is not their prosperity in their own hand? The counsel of the wicked is far from me.
translation:
  language: te
  text: చూడండి, వారి శ్రేయస్సు వారి చేతిలో లేదా?[a] దుష్టుల ఆలోచన నాకు దూరంగా ఉంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “వారి శ్రేయస్సు వారి చేతిలో లేదు.”'
    reason: హీబ్రూ הֵן לֹא నిర్మాణాన్ని అలంకారిక ప్రశ్నగా లేదా బలమైన ప్రతికూల ప్రకటనగా అర్థం చేసుకోవచ్చు; ప్రధాన పాఠం ఇంగ్లీషు POBలోని ప్రశ్నార్థక పఠనాన్ని అనుసరిస్తుంది.
lexical_decisions:
- source_word: הֵן
  choice: చూడండి
  rationale: సంభాషణలో శ్రద్ధను ఆకర్షించే ఈ కణాన్ని ఆధునిక, సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: טוּבָם
  choice: వారి శ్రేయస్సు
  rationale: ఇక్కడ ‘వారి మేలు’ అనే విస్తృత అర్థం కంటే, సందర్భంలో దుష్టులు అనుభవిస్తున్న సౌభాగ్యం లేదా క్షేమాన్ని సూచిస్తుంది.
- source_word: בְיָדָם
  choice: వారి చేతిలో
  rationale: మూలంలోని ‘చేతిలో’ అనే రూపకాన్ని నిలుపుతూ, వారి అదుపులో లేదా శక్తిలో అనే భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: עֲצַת רְשָׁעִים
  choice: దుష్టుల ఆలోచన
  rationale: עֵצָה ఇక్కడ వారి సలహా, యోచన, జీవన దృక్పథం అనే భావాలను కలిగి ఉంది; ‘ఆలోచన’ సందర్భానికి సహజంగా సరిపోతుంది.
- source_word: רָחֲקָה מֶנִּי
  choice: నాకు దూరంగా ఉంది
  rationale: పూర్తయిన క్రియారూపాన్ని స్థితిని తెలిపే వాక్యంగా అనువదించి, యోబు దుష్టుల ఆలోచనను తిరస్కరిస్తున్న భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: మొదటి వాక్యం ప్రకటననా లేక ప్రశ్ననా
  choice: వారి శ్రేయస్సు వారి చేతిలో లేదు.
  alternative: వారి శ్రేయస్సు వారి చేతిలో లేదా?
  rationale: హీబ్రూ הֵן לֹא నిర్మాణాన్ని సందర్భంలో బలమైన ప్రతికూల ప్రకటనగా చదవడం సహజం; అయితే ప్రశ్నార్థక పఠనం సాధ్యమైనందున దానిని పాదటిప్పణిలో ఉంచాం.
- issue: దుష్టుల శ్రేయస్సుపై యోబు వైఖరి
  choice: శ్రేయస్సు వారి స్వీయ నియంత్రణలో లేదని చెప్పి, వారి ఆలోచనకు తాను దూరమని ప్రకటించడం
  alternative: దుష్టుల శ్రేయస్సు వారి స్వంత సాధనమేనని వ్యంగ్యంగా ప్రశ్నించడం
  rationale: మూలంలోని ప్రతికూలతను తొలగించకుండా, దేవుని పరిపాలన గురించి సందర్భంలో ఉన్న ఉద్రిక్తతను అలాగే ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవభరితమైన శైలి. ‘చూడండి’ శ్రద్ధను ఆకర్షించే హీబ్రూ కణాన్ని సులభంగా అందిస్తుంది; ‘వారి చేతిలో’ అనే మూల రూపకం ఉద్దేశపూర్వకంగా నిలుపబడింది.
