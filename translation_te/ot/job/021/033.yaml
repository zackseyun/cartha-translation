revisions:
- from: లోయలోని మట్టిపెళ్లలు అతనికి తియ్యగా ఉంటాయి[a]; మానవులందరూ అతని వెనుక సాగుతారు[b][c], అతని ముందు వెళ్లినవారికి లెక్కే లేదు.
  to: లోయలోని మట్టిపెళ్లలు అతనికి తియ్యగా ఉంటాయి[a]; మానవులందరూ అతని వెనుక సాగుతారు[b][c], అతని కంటే ముందున్నవారు లెక్కలేనంతమంది.
