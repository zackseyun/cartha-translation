  variant: modern standard Telugu
source:
  edition: WLC
  text: מָֽתְקוּ ל֗/וֹ רִגְבֵ֫י נָ֥חַל וְ֭/אַחֲרָי/ו כָּל אָדָ֣ם יִמְשׁ֑וֹךְ וּ֝/לְ/פָנָ֗י/ו אֵ֣ין מִסְפָּֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/033.yaml
  text: The clods of the valley are sweet to him[a]; all mankind follows after him[c][b], and those before him are without number.
translation:
  language: te
  text: లోయలోని మట్టిపెళ్లలు అతనికి తియ్యగా ఉంటాయి[a]; మానవులందరూ అతని వెనుక సాగుతారు[b][c], అతని కంటే ముందున్నవారు లెక్కలేనంతమంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వాగులోయలోని/వాగు పడకలోని మట్టిపెళ్లలు అతనికి ఆహ్లాదకరంగా ఉంటాయి.” హీబ్రూ נחל అనే పదం లోయను, కనుమను, వాగులోయను లేదా వాగు పడకను సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “ప్రతి మనిషి” లేదా “మనిషి అంతా”; ఇక్కడ భావం “మనుషులందరూ” లేదా “మానవజాతి అంతా.”
    reason: lexical_alternative
  - marker: c
    text: ఈ వాక్యం అంత్యక్రియల ఊరేగింపును సూచిస్తుండవచ్చు; లేదా మానవులందరూ మరణం వైపు సాగడాన్ని సూచిస్తుండవచ్చు. లెక్కలేనంతమంది అతనికంటే ముందు ఉన్నారు, మానవులందరూ అతని వెనుక సాగుతారు.
    reason: alternative_reading
lexical_decisions:
- source_word: מָתְקוּ
  choice: తియ్యగా ఉంటాయి
  rationale: ఈ క్రియ తీపిని లేదా ఆహ్లాదకరంగా ఉండడాన్ని సూచిస్తుంది. సమాధి మట్టి అతనికి ‘తియ్యగా’ ఉందనే హీబ్రూ రూపకాన్ని వ్యాఖ్యానించి తొలగించకుండా నిలుపుతుంది.
- source_word: לּוֹ
  choice: అతనికి
  rationale: సంబంధాన్ని లేదా అతని అనుభవాన్ని తెలిపే ఈ రూపానికి సహజమైన తెలుగు సమానార్థకం.
- source_word: רִגְבֵי
  choice: మట్టిపెళ్లలు
  rationale: రెగెవ్ అంటే మట్టి పెళ్ల లేదా మట్టి ముద్ద. ఇది సమాధికి సంబంధించిన స్పష్టమైన భౌతిక చిత్రాన్ని నిలుపుతుంది.
- source_word: נָחַל
  choice: లోయలోని
  rationale: ఈ పదం లోయ, కనుమ, వాగు ప్రవహించే లోయ లేదా వాగుపడగను సూచించగలదు. ప్రధాన పాఠ్యంలో ‘లోయ’ సహజంగా ఉండగా, ఇతర సాధ్యార్థాలు పాదసూచికలో ఉంచబడ్డాయి.
- source_word: וְאַחֲרָיו
  choice: అతని వెనుక
  rationale: స్థలపరంగా ‘అతని వెనుక’ అనే అర్థాన్ని నిలుపుతూ, ఊరేగింపు లేదా మరణంలో అనుసరించడం అనే రెండు భావాలకూ వీలు కల్పిస్తుంది.
- source_word: כָּל אָדָם
  choice: మానవులందరూ
  rationale: אָדָם ఇక్కడ ఒక పురుష వ్యక్తిని కాక సమష్టిగా మానవజాతిని సూచిస్తుంది.
- source_word: יִמְשׁוֹךְ
  choice: సాగుతారు
  rationale: משך ప్రాథమికంగా లాగడం అనే అర్థమున్నా, ‘అతని వెనుక’ అనే పదబంధంతో ఇక్కడ వెంట సాగడం లేదా అనుసరించడం అనే భావం వస్తుంది. ‘సాగుతారు’ ఆ కదలికను సహజంగా తెలుపుతూ దృశ్యంలోని అస్పష్టతను కాపాడుతుంది.
- source_word: וּלְפָנָיו
  choice: అతని ముందు వెళ్లినవారు
  rationale: మూలంలోని ‘అతని ముందు’ అనే స్థలకాల భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; అతనికంటే ముందుగా మరణించినవారనే సూచనను పూర్తిగా వ్యాఖ్యానించి నిర్దిష్టం చేయదు.
- source_word: אֵין מִסְפָּר
  choice: లెక్కే లేదు
  rationale: లెక్కించలేని గొప్ప సమూహాన్ని సూచించే హీబ్రూ నుడికారానికి సంక్షిప్తమైన, సహజమైన తెలుగు రూపం.
theological_decisions:
- issue: సమాధి మరియు మరణానికి సంబంధించిన దృశ్యం
  choice: దుష్టుడి సమాధిని ప్రశాంతమైనదిగా లేదా గౌరవప్రదమైనదిగా చిత్రిస్తూ, అతని ముందు వెళ్లినవారూ అతని వెనుక సాగేవారూ అసంఖ్యాకులని చెప్పే పదచిత్రాన్ని నిలుపడం.
  alternative: ఇది ప్రత్యేకంగా అంత్యక్రియల ఊరేగింపును సూచించవచ్చు; లేదా మానవులందరూ చివరకు మరణంలో అతని మార్గాన్నే అనుసరిస్తారని సాధారణంగా చెప్పవచ్చు.
  rationale: హీబ్రూ పాఠ్యం అంత్యక్రియల ఊరేగింపునకూ, అందరూ మరణం వైపు సాగడమనే విస్తృత భావానికీ అవకాశం ఇస్తుంది. ‘మట్టిపెళ్లలు,’ ‘వెనుక,’ ‘ముందు’ అనే స్పష్టమైన పదచిత్రాలను ఉంచడం ద్వారా ఈ ఉద్విగ్నమైన ద్వంద్వసూచనను పరిష్కరించకుండా కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యేలా గంభీరమైన శైలిని ఉపయోగించాం. ‘తియ్యగా’ అనే అసాధారణమైనప్పటికీ ఉద్దేశపూర్వకమైన రూపకాన్ని నిలిపి, ‘మట్టిపెళ్లలు’ ద్వారా సమాధి దృశ్యాన్ని స్పష్టంగా ఉంచాం. అంత్యక్రియల ఊరేగింపు మరియు సార్వత్రిక మరణగతి అనే రెండు సాధ్యార్థాల్లో ఏదో ఒక్కదాన్ని ప్రధాన పాఠ్యం బలవంతంగా నిర్ణయించదు.
