  text: הֶ֭/אָנֹכִי לְ/אָדָ֣ם שִׂיחִ֑/י וְ/אִם מַ֝דּ֗וּעַ לֹא תִקְצַ֥ר רוּחִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/004.yaml
  text: As for me, is my complaint against man? If not, why should my spirit not be impatient?
translation:
  language: te
  text: నా ఫిర్యాదు మనిషికా? అలా కాకపోతే, నా మనస్సు ఎందుకు సహనం కోల్పోకూడదు?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שִׂיחִי
  choice: నా ఫిర్యాదు
  rationale: ఈ సందర్భంలో Job యొక్క వాదనాత్మక మొరను సూచిస్తుంది; సాధారణ ‘మాట’ కంటే ‘ఫిర్యాదు’ సందర్భార్థాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: רוּחִי
  choice: నేను
  rationale: ‘నా ఆత్మ’ అనే హీబ్రూ వ్యక్తీకరణ ఇక్కడ మాట్లాడుతున్న వ్యక్తినే సూచిస్తుంది; సహజమైన ఆధునిక తెలుగులో వ్యక్తిగత క్రియారూపంతో భావం అందించబడింది.
- source_word: תִקְצַר
  choice: అసహనపడకూడదు
  rationale: అక్షరార్థంగా ‘కుదించబడటం’ అనే రూపకం ఇక్కడ సహనం తగ్గి అసహనం కలగడాన్ని సూచిస్తుంది.
theological_decisions:
- issue: וְאִם యొక్క సందర్భార్థం
  choice: అలా కాకపోతే
  alternative: మరి ఎందుకు
  rationale: మొదటి అలంకారిక ప్రశ్నకు ప్రతికూల సమాధానాన్ని షరతుగా తీసుకుని రెండవ ప్రశ్నను కలుపుతుంది; మూలంలోని తార్కిక ఉద్వేగాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; అలంకారిక ప్రశ్నల రూపాన్ని, Job యొక్క అసహనభరితమైన కానీ గౌరవప్రదమైన స్వరాన్ని కాపాడింది.
