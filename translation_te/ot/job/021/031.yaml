source:
  edition: WLC
  text: מִֽי יַגִּ֣יד עַל פָּנָ֣י/ו דַּרְכּ֑/וֹ וְ/הֽוּא עָ֝שָׂ֗ה מִ֣י יְשַׁלֶּם לֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/031.yaml
  text: Who declares his way to his face? And for what he has done[b][a], who repays him?
translation:
  language: te
  text: అతనికి ఎదురుగా అతని ప్రవర్తనను ఎవరు చెబుతారు?[a] అతడు చేసినదానికి[b] అతనికి ప్రతిఫలం ఎవరు చెల్లిస్తారు?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతని సమక్షంలో.” హీబ్రూలో అక్షరార్థంగా “అతని ముఖం మీద/ఎదుట”; ఇది నేరుగా ఎదుర్కొని చెప్పడాన్ని సూచించే నుడికారం.
    reason: lexical_alternative
  - marker: b
    text: 'హీబ్రూ వాక్యం సంక్షిప్తంగా ఉంది: “అతడు చేశాడు; అతనికి ఎవరు చెల్లిస్తారు?” “అతడు చేసినదానికి” అనే భావం సందర్భానుసారంగా స్పష్టం చేయబడింది.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי
  choice: ఎవడు?
  rationale: ఇది ప్రతికూల సమాధానాన్ని సూచించే అలంకారప్రశ్న అయినా, హీబ్రూ వాక్యంలోని ప్రశ్నారూపాన్ని అలాగే నిలిపింది.
- source_word: יַגִּיד
  choice: ఎత్తిచూపేవాడు
  rationale: נגד హిఫిల్ రూపం ‘తెలియజేయు, ప్రకటించు’ అని అర్థమిస్తుంది; ఈ సందర్భంలో ఒకరి ప్రవర్తనను అతని సమక్షంలో నేరుగా ప్రస్తావించి నిలదీసే భావాన్ని ‘ఎత్తిచూపు’ సహజంగా తెలియజేస్తుంది.
- source_word: עַל פָּנָיו
  choice: అతని ముఖం ఎదుటనే
  rationale: అక్షరార్థంగా ‘అతని ముఖం మీద’; వ్యక్తిని ప్రత్యక్షంగా ఎదుర్కొనే భావాన్ని నిలిపే సహజమైన తెలుగు నుడికారం.
- source_word: דַּרְכּוֹ
  choice: అతని ప్రవర్తన
  rationale: דֶּרֶךְ అక్షరార్థంగా ‘మార్గం’, రూపకంగా జీవనవిధానం లేదా ప్రవర్తన. సందర్భంలో ఆధునిక పాఠకునికి ‘ప్రవర్తన’ స్పష్టంగా ఉంటుంది.
- source_word: וְהוּא עָשָׂה
  choice: అతడు చేసినదానికి
  rationale: హీబ్రూ సంక్షిప్తంగా, అధ్యాహారంతో ఉంది. ప్రతిఫలానికి ఆధారమైన కార్యాన్ని సూచించే సంభావ్య భావాన్ని తెలుగులో స్పష్టం చేసింది; పాదసూచికలో అక్షరార్థ నిర్మాణాన్ని తెలిపింది.
- source_word: יְשַׁלֶּם לוֹ
  choice: అతనికి ప్రతిఫలం చెల్లించేవాడు
  rationale: שלם పియేల్ ఇక్కడ చేసినదానికి తగిన బదులు లేదా ప్రతిఫలం ఇవ్వడాన్ని సూచిస్తుంది. ‘ప్రతిఫలం చెల్లించు’ న్యాయపరమైన ప్రతికార భావాన్ని గౌరవప్రదమైన ఆధునిక తెలుగులో నిలుపుతుంది.
