  text: מַה שַׁדַּ֥י כִּֽי נַֽעַבְדֶ֑/נּוּ וּ/מַה נּ֝וֹעִ֗יל כִּ֣י נִפְגַּע בּֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/015.yaml
  text: What is the Almighty[a], that we should serve him? And what would we gain if we entreat him?
translation:
  language: te
  text: “మేము ఆయనను సేవించవలసినంతగా సర్వశక్తిమంతుడు ఎవరు? ఆయనను వేడుకుంటే మాకు ఏమి లాభం?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַה שַׁדַּי
  choice: సర్వశక్తిమంతుడు ఎవరు
  rationale: מַה అక్షరార్థంగా ‘ఏమి’ అయినప్పటికీ, వ్యక్తిని సూచించే దైవ బిరుదుతో తెలుగులో ‘ఎవరు’ సహజం; సందర్భంలోని తృణీకార ధోరణిని ప్రశ్నారూపం నిలుపుతుంది.
- source_word: נַעַבְדֶנּוּ
  choice: మేము ఆయనను సేవించడానికి
  rationale: עבד దేవునితో వాడినప్పుడు మతపరమైన సేవ, విధేయత రెండింటినీ సూచించగలదు; ‘సేవించు’ ఆ విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: נּוֹעִיל
  choice: మాకు ఏమి లాభం
  rationale: ఈ క్రియ ప్రయోజనం లేదా లాభం కలగడాన్ని సూచిస్తుంది; తెలుగు వాడుకలో ఈ ప్రశ్న సహజంగా ఉండి, దుష్టుల ప్రయోజనాపేక్షను స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: נִפְגַּע בּוֹ
  choice: ఆయనను వేడుకుంటే
  rationale: פגע ב ఈ సందర్భంలో ప్రార్థనగా విన్నవించడం లేదా వేడుకోవడం అనే భావం ఇస్తుంది; ‘వేడుకొను’ సాధారణ పాఠకులకు స్పష్టమైన, గౌరవప్రదమైన పదం.
theological_decisions:
- issue: שַׁדַּי అనే దైవ బిరుదు అనువాదం
  choice: సర్వశక్తిమంతుడు
  alternative: షద్దయి
  rationale: ఇది వ్యక్తినామం కంటే దైవ బిరుదుగా పనిచేస్తుంది. అర్థాన్ని పాఠకునికి నేరుగా అందించేందుకు బిరుదును అనువదించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; యోబు ఉటంకిస్తున్న దుష్టుల ధిక్కారపూరిత, ప్రయోజనాపేక్ష గల రెండు సమాంతర ప్రశ్నలను సంక్షిప్తంగా, గౌరవప్రదమైన భాషలో నిలిపాం.
