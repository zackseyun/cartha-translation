id: JOB.21.20
reference: Job 21:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: יִרְא֣וּ עינ/ו כִּיד֑/וֹ וּ/מֵ/חֲמַ֖ת שַׁדַּ֣י יִשְׁתֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/020.yaml
  text: Let his own eyes see his ruin[b][a], and let him drink from the wrath of the Almighty.
translation:
  language: te
  text: అతని సొంత కళ్లే అతని విపత్తును చూడాలి[b][a]; సర్వశక్తిమంతుని ఉగ్రతను అతడే తాగాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతని కళ్లు అతని విపత్తును చూస్తాయి; సర్వశక్తిమంతుని ఉగ్రతను అతడు తాగుతాడు.” హెబ్రీలోని అసంపూర్ణ క్రియారూపాలను ఆకాంక్షగా కాక భవిష్యదర్థంలో కూడా చదవవచ్చు.
    reason: alternative_reading
  - marker: b
    text: “విపత్తు” అనే పదాన్ని “ఆపద” లేదా “పతనం” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְאוּ
  choice: చూడాలి
  rationale: ראה క్రియ యొక్క అసంపూర్ణ రూపాన్ని సందర్భానుసారంగా ఆకాంక్షాత్మక భావంలో అనువదించాం. యోబు దుష్టుడు తన శిక్షను తానే అనుభవించాలని కోరుతున్న సందర్భానికి ఇది సరిపోతుంది.
- source_word: עֵינָיו
  choice: అతని సొంత కళ్లే
  rationale: మూలంలోని ‘అతని కళ్లు’ అనే భావాన్ని నిలిపి, పరిణామాన్ని అతడే ప్రత్యక్షంగా చూడాలనే నొక్కును ‘సొంత’ మరియు ‘ఏ’ ద్వారా సహజమైన తెలుగులో వ్యక్తం చేశాం.
- source_word: כִּידוֹ
  choice: అతని విపత్తు
  rationale: כיד అంటే విపత్తు, ఆపద, పతనం వంటి అర్థాలు రావచ్చు. ‘విపత్తు’ వినాశనం అనే అతిశయార్థాన్ని రుద్దకుండా విస్తృతమైన అపాయకర పరిణామాన్ని తెలియజేస్తుంది.
- source_word: וּמֵחֲמַת
  choice: ఉగ్రతలోనుండి
  rationale: חֵמָהకు ఉగ్రత, కోపాగ్ని, విషం వంటి అర్థాలు ఉండవచ్చు. దేవుని తీర్పును తాగడం అనే రూపకంలో ‘ఉగ్రత’ సహజంగా ఉంది; מִן‌ను ‘లోనుండి’గా నిలిపాం.
- source_word: שַׁדַּי
  choice: సర్వశక్తిమంతుడు
  rationale: యోబు గ్రంథంలో שדי అనే దైవ బిరుదుకు స్పష్టమైన, ప్రామాణిక తెలుగు సమానార్థకం.
- source_word: יִשְׁתֶּה
  choice: తాగాలి
  rationale: שתה అనే ‘తాగు’ రూపకాన్ని చదును చేసి ‘అనుభవించు’గా మార్చకుండా నిలిపాం. మొదటి క్రియకు సమాంతరంగా ఆకాంక్షాత్మక భావాన్ని ఇచ్చాం.
theological_decisions:
- issue: ఈ వచనంలోని అసంపూర్ణ క్రియారూపాల భావబలం
  choice: ‘చూడాలి ... తాగాలి’ అనే ఆకాంక్షాత్మక భావం
  alternative: ‘చూస్తాయి ... తాగుతాడు’ అనే భవిష్యద్వాణి భావం
  rationale: తండ్రి దోషఫలాన్ని పిల్లలు పొందడం కాకుండా దుష్టుడే దాన్ని పొందాలని యోబు నొక్కిచెప్పే సందర్భంలో ఆకాంక్షాత్మక పఠనం బలంగా సరిపోతుంది. అయినా హెబ్రీ అసంపూర్ణ రూపాలు భవిష్యదర్థాన్నీ అనుమతిస్తాయి కాబట్టి ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనా సాధారణ పాఠకులకు స్పష్టంగా ఉండే శైలి. ‘అతడే’ మరియు ‘కళ్లే’ దుష్టుడు వ్యక్తిగతంగా తీర్పును ఎదుర్కోవాలనే మూల నొక్కును తెలియజేస్తాయి. తాగే రూపకాన్ని యథాతథంగా నిలిపాం.
