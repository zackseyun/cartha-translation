  text: יַ֭חַד עַל עָפָ֣ר יִשְׁכָּ֑בוּ וְ֝/רִמָּ֗ה תְּכַסֶּ֥ה עֲלֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/026.yaml
  text: Together they lie down in the dust[a], and worms cover them.
translation:
  language: te
  text: వారిద్దరూ ఒకే విధంగా ధూళిలో పడుకుంటారు; పురుగులు వారిని కప్పివేస్తాయి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఈగల లార్వాలు వారిని కప్పివేస్తాయి.’ హీబ్రూ רִמָּה అనే పదం దేహం కుళ్లిపోయే సందర్భంలో పురుగులను లేదా ఈగల లార్వాలను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחַד
  choice: ఒకే విధంగా
  rationale: సందర్భంలో పరస్పర విరుద్ధ స్థితుల్లో జీవించిన ఇద్దరికీ చివరికి ఒకే గతి కలుగుతుందనే భావాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది. ‘కలిసి’ అని అనడం వారు ఒకే చోట సమాధి చేయబడతారనే అనవసర భావాన్ని కలిగించవచ్చు.
- source_word: עַל עָפָר
  choice: ధూళిలో
  rationale: עַל అక్షరార్థంగా ‘మీద’ అయినప్పటికీ, మరణం మరియు సమాధి సందర్భంలో ‘ధూళిలో’ అనేది సహజమైన తెలుగు ప్రయోగం; మూలంలోని మరణ రూపకాన్ని నిలుపుతుంది.
- source_word: יִשְׁכָּבוּ
  choice: పడుకుంటారు
  rationale: మూలంలోని ‘పడుకోవడం’ అనే స్పష్టమైన మరణ రూపకాన్ని ఉంచి, సాధారణంగా సంభవించే అంతిమ గతిని తెలుగు వర్తమాన-భవిష్యత్ రూపంలో వ్యక్తం చేస్తుంది.
- source_word: רִמָּה
  choice: పురుగులు
  rationale: కుళ్లిపోతున్న దేహానికి సంబంధించిన పురుగులు లేదా లార్వాలను సూచించే సామూహిక నామం. ‘పురుగులు’ విస్తృతంగా అర్థమయ్యే సహజ తెలుగు పదం; మరింత నిర్దిష్టమైన ‘మగ్గట్లు’ అనే ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇస్తుంది.
- source_word: תְּכַסֶּה
  choice: కప్పివేస్తాయి
  rationale: దేహాలను పురుగులు పూర్తిగా కప్పే తీవ్రమైన చిత్రాన్ని సహజ తెలుగులో నిలుపుతుంది. హీబ్రూలో సామూహిక ఏకవచనం ఉన్నా, తెలుగులో ‘పురుగులు’కు అనుగుణంగా బహువచన క్రియ వాడబడింది.
- source_word: עֲלֵיהֶם
  choice: వారిని
  rationale: తెలుగులో ‘కప్పివేస్తాయి’ అనే క్రియతో విభక్తిని సహజంగా కలిపి, ‘వారి మీద’ అనే మూల సంబంధాన్ని అర్థనష్టం లేకుండా వ్యక్తం చేస్తుంది.
