source:
  edition: WLC
  text: וְ֭/אֵיךְ תְּנַחֲמ֣וּ/נִי הָ֑בֶל וּ֝/תְשֽׁוּבֹתֵי/כֶ֗ם נִשְׁאַר מָֽעַל־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/job/021/034.yaml
  text: How then can you comfort me with emptiness[a], when your answers remain nothing but treachery?
translation:
  language: te
  text: అయితే, మీరు వ్యర్థమైన మాటలతో నన్నెలా ఓదార్చగలరు?[a] మీ జవాబుల్లో మిగిలింది నమ్మకద్రోహమే.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీరు నన్ను వ్యర్థంగా ఎలా ఓదార్చగలరు? మీ జవాబుల్లో మిగిలింది నమ్మకద్రోహమే.”
    reason: הָבֶל అనే పదాన్ని ఓదార్పు యొక్క వ్యర్థమైన విషయసారంగా గానీ, ఓదార్చే ప్రయత్నం వ్యర్థమని క్రియావిశేషణాత్మకంగా గానీ అర్థం చేసుకోవచ్చు.
lexical_decisions:
- source_word: וְאֵיךְ
  choice: అయితే, ... ఎలా
  rationale: ప్రశ్నార్థక అవ్యయంతో కూడిన వావ్ సందర్భంలోని అనుసంధానాన్ని సూచిస్తుంది; ‘అయితే’ యోబు ముగింపు సవాలును సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: תְּנַחֲמוּנִי
  choice: నన్నెలా ఓదార్చగలరు
  rationale: נחם పియేల్ రూపం ‘ఓదార్చడం/ఆదరించడం’ అని అర్థం. అలంకారిక ప్రశ్నలో సామర్థ్యాన్ని సవాలు చేసే భావాన్ని ‘గలరు’ సహజంగా తెలియజేస్తుంది.
- source_word: הָבֶל
  choice: వ్యర్థమైన మాటలతో
  rationale: הבל ఇక్కడ శూన్యత, వ్యర్థత అనే నామవాచక భావాన్ని కలిగి ఉంది. స్నేహితుల ఓదార్పులోని విషయసారమే వ్యర్థమని తెలుగులో స్పష్టంగా, సహజంగా చెప్పేందుకు ‘వ్యర్థమైన మాటలతో’ ఎంచుకున్నాం; కేవలం వారి ప్రయత్నం విఫలమైందనే భావానికి పరిమితం చేయలేదు.
- source_word: וּתְשׁוּבוֹתֵיכֶם
  choice: మీ జవాబుల్లో
  rationale: תשובה అంటే జవాబు లేదా ప్రత్యుత్తరం. ‘మీ జవాబుల్లో’ అనే రూపం తరువాతి ‘మిగిలింది’తో సహజమైన తెలుగు వాక్యాన్ని ఏర్పరుస్తుంది.
- source_word: נִשְׁאַר
  choice: మిగిలింది
  rationale: שׁאר నిఫాల్ రూపానికి ‘మిగిలి ఉండడం’ అనే అర్థం. ఏకవచన క్రియను గౌరవిస్తూ, జవాబుల మొత్తం స్వభావాన్ని సమష్టిగా సూచించేందుకు ‘మిగిలింది’ వాడాం.
- source_word: מָעַל
  choice: నమ్మకద్రోహమే
  rationale: מעל నమ్మకాన్ని ఉల్లంఘించడం, విశ్వాసఘాతుకత లేదా ద్రోహాన్ని సూచిస్తుంది. ‘నమ్మకద్రోహమే’ స్నేహితుల జవాబులపై యోబు చేస్తున్న తీవ్రమైన ఆరోపణను నిలుపుతుంది.
