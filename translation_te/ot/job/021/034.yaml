translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. యోబు తన స్నేహితులను బహువచనంగా సంబోధిస్తున్నందున ‘మీరు/మీ’ రూపాలు వాడబడ్డాయి. మూలంలోని అలంకారిక ప్రశ్న, వ్యర్థత, నమ్మకద్రోహం అనే తీవ్రతలు నిలుపబడ్డాయి.
