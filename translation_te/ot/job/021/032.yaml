    rationale: יוּבָל హోఫల్ రూపం ‘తీసుకుపోబడతాడు/మోసుకుపోబడతాడు’ అనే భావాన్ని ఇస్తుంది. ‘తీసుకుపోబడతాడు’ తెలుగు వాక్యనిర్మాణంలో సహజంగా ఉండి, అంత్యక్రియల సందర్భాన్నీ నిలుపుతుంది.
