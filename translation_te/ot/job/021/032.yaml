  source_fidelity: మొదటి అర్థభాగం మూలానికి సమీపంగానే ఉంది; అయితే ‘మోసికొనిపోబడతాడు’ కృత్రిమంగా ఉంది. לִקְבָרוֹת లోని బహువచనాన్ని ‘సమాధుల దగ్గరకు’ అనే సహజమైన రూపంలో స్పష్టంగా నిలపవచ్చు. చివరి క్రియ יִשְׁקֹד క్రియాశీల రూపం; ‘కాపలా కాయబడుతుంది’ తెలుగులో అసహజమైన కర్మణి ప్రయోగం. హీబ్రూ క్రియ పుంలింగ ఏకవచనంగా ఉన్నప్పటికీ, పేర్కొన్న నామకర్త లేకపోవడం వల్ల దాని సూచనపై అనిశ్చితి ఉంది; ప్రధాన పాఠ్యంలో నిర్దిష్ట వ్యక్తిని బలవంతం చేయని సహజ తెలుగు ప్రయోగం అవసరం.
  naturalness: ‘సమాధుల స్థలానికి’ అర్థవంతమే గాని ‘సమాధుల దగ్గరకు’ మరింత సహజం, సంక్షిప్తం. ‘సమాధి మట్టిదిబ్బపై కాపలా కాస్తారు’ అనేది సాధారణ/అనిర్దిష్ట కర్తతో కూడిన సహజ తెలుగు ప్రయోగం; అది మూలంలోని కర్త-సూచన అనిశ్చితిని ప్రధాన పాఠ్యంలో తీర్చివేయదు.
  terminology: ‘సమాధి’, ‘మట్టిదిబ్బ’, ‘కాపలా కాయడం’ ఆధునిక ప్రామాణిక తెలుగులో తగినవి. గָּדִישׁ కు ‘మట్టిదిబ్బ’ సందర్భానుకూలమైన వ్యాఖ్యానాత్మక అనువాదం; పాదసూచికలో దాని ప్రాథమిక ‘కుప్ప/రాశి’ భావాన్ని ఉంచడం సముచితం.
