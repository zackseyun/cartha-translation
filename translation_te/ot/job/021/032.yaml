  yaml_path: translation/ot/job/021/032.yaml
  text: Yet he is carried to the grave[c][b][a], and over the mound one keeps watch.
translation:
  language: te
  text: అయినా అతడు సమాధుల దగ్గరకు తీసుకుపోబడతాడు[c]; సమాధి మట్టిదిబ్బపై కాపలా కాస్తారు[b][a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, క్రియకు కర్త పాతిపెట్టబడిన వ్యక్తేనని తీసుకుంటే, ‘అతడు సమాధి మట్టిదిబ్బపై కాపలా కాస్తాడు.’ హీబ్రూ క్రియ పుంలింగ ఏకవచనంలో ఉంది, కానీ స్వతంత్రంగా కర్తను పేర్కొనలేదు.
    reason: alternative_reading
  - marker: b
    text: ‘మట్టిదిబ్బ’ అని అనువదించిన హీబ్రూ పదం కుప్పను లేదా పేర్చిన రాశిని సూచిస్తుంది; ఇక్కడ అది సమాధిపై ఎత్తుగా పోసిన మట్టిని సూచించే అవకాశం ఉంది.
    reason: cultural_note
  - marker: c
    text: హీబ్రూలో ‘సమాధులు’ అనే పదం బహువచనంలో ఉంది; అది సమాధుల ప్రదేశాన్ని సమష్టిగా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּא
  choice: అయినా అతడు
  rationale: సందర్భంలో దుష్టుని జీవితం, అతనికి లభించే గౌరవప్రదమైన అంత్యక్రియల మధ్య వ్యత్యాసం ఉంది; అందువల్ల וְ కు ఇక్కడ వ్యతిరేక భావాన్ని సహజంగా వ్యక్తం చేసే ‘అయినా’ సరిపోతుంది.
- source_word: לִקְבָרוֹת
  choice: సమాధుల స్థలానికి
  rationale: మూలంలోని నామవాచకం బహువచనంలో ఉంది. తెలుగులో అసహజత లేకుండా ఆ రూపాన్ని, సమాధుల ప్రదేశం అనే సమష్టి భావాన్ని నిలుపుతుంది.
- source_word: יוּבָל
  choice: మోసికొనిపోబడతాడు
  rationale: יבל ధాతువు హోఫల్ రూపం ‘తీసుకుపోబడటం/మోసుకుపోబడటం’ అనే భావాన్ని ఇస్తుంది; అంత్యక్రియల సందర్భంలో శవాన్ని సమాధికి మోసుకుపోవడాన్ని ఇది స్పష్టంగా తెలియజేస్తుంది.
- source_word: גָּדִישׁ
  choice: మట్టిదిబ్బ
  rationale: ఈ పదానికి కుప్ప లేదా పేర్చిన రాశి అనే ప్రాథమిక భావం ఉంది; ఇక్కడ సమాధిపై ఎత్తుగా పోసిన మట్టిని సూచించే అవకాశం ఉంది.
- source_word: יִשְׁקֹד
  choice: కాపలా కాయబడుతుంది
  rationale: క్రియకు కాపలా ఉండటం, మెలకువగా కనిపెట్టడం అనే భావం ఉంది. హీబ్రూలో కర్త స్పష్టంగా లేనందున తెలుగులో కర్మణి ప్రయోగం నిర్దిష్ట కర్తను బలవంతంగా చేర్చకుండా ఆ అనిశ్చితిని నిలుపుతుంది.
theological_decisions:
- issue: יִשְׁקֹד క్రియకు కర్త ఎవరు?
  choice: నిర్దిష్ట కర్తను పేర్కొనకుండా ‘కాపలా కాయబడుతుంది’ అని అనువదించడం
  alternative: పాతిపెట్టబడిన అతడే ‘మట్టిదిబ్బపై కాపలా కాస్తాడు’ అని అనువదించడం
  rationale: హీబ్రూ క్రియ పురుష ఏకవచనంలో ఉన్నా, ఈ సంక్షిప్త వాక్యంలో కర్త స్పష్టంగా చెప్పబడలేదు. ఒక వ్యాఖ్యానాన్ని ప్రధాన పాఠ్యంలో ఖరారు చేయకుండా ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచడం మూలంలోని సందిగ్ధతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గంభీరమైన శైలి. మూలంలోని బహువచనాన్ని ‘సమాధుల స్థలం’ ద్వారా, చివరి క్రియలోని కర్త అస్పష్టతను కర్మణి ప్రయోగం మరియు పాదసూచిక ద్వారా నిలిపాం.
