id: JOB.21.3
reference: Job 21:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: שָׂ֭אוּ/נִי וְ/אָנֹכִ֣י אֲדַבֵּ֑ר וְ/אַחַ֖ר דַּבְּרִ֣/י תַלְעִֽיג׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/003.yaml
  text: Bear with me[a], and I will speak; and after I have spoken[b], you may mock.
translation:
  language: te
  text: నన్ను సహించండి[a]; నేను మాట్లాడతాను. నేను మాట్లాడిన తర్వాత మీరు ఎగతాళి చేయవచ్చు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘నన్ను భరించండి,’ ‘నన్ను ఓర్చుకోండి.’ హీబ్రూలో అక్షరార్థంగా ‘మోయండి/భరించండి’ అనే క్రియ ఉంది; ఇక్కడ తాను మాట్లాడేంతవరకు సహించమనే భావం.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘మీరు ఎగతాళి చేస్తారు.’ హీబ్రూ రూపాన్ని సాధారణ భవిష్యత్తుగా తీసుకోవచ్చు; సందర్భాన్ని బట్టి ‘ఎగతాళి చేయవచ్చు’ అనే అనుమతి లేదా రాయితీ భావంగానూ అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: שָׂאוּ/נִי
  choice: నన్ను సహించండి
  rationale: נָשָׂא అనే క్రియకు ప్రాథమికంగా ‘ఎత్తు, మోయు, భరించు’ అనే అర్థాలున్నా, ఇక్కడ మాట్లాడేందుకు అవకాశం ఇవ్వమని శ్రోతలను కోరే సందర్భంలో ‘నన్ను సహించండి’ అనే ప్రయోగం సహజంగా, గౌరవప్రదంగా ఉంటుంది.
- source_word: וְ/אָנֹכִי אֲדַבֵּר
  choice: నేను మాట్లాడతాను
  rationale: אָנֹכִי అనే స్పష్టమైన ప్రథమ పురుష సర్వనామంలోని స్వల్ప ఉద్ఘాటనను ‘నేను’ నిలుపుతుంది; אֲדַבֵּר‌కు ‘మాట్లాడతాను’ నేరమైన, సహజమైన అనువాదం.
- source_word: וְ/אַחַר דַּבְּרִי
  choice: నేను మాట్లాడిన తర్వాత
  rationale: దీనికి అక్షరార్థంగా ‘నా మాట్లాడటం తర్వాత’ అని ఉన్నా, తెలుగులో కాలసూచక ఉపవాక్యంగా ‘నేను మాట్లాడిన తర్వాత’ అనడం సహజం; చర్యనే సూచిస్తుంది, మాటల విషయాన్ని కాదు.
- source_word: תַלְעִיג
  choice: మీరు ఎగతాళి చేయవచ్చు
  rationale: హిఫీల్ రూపం ‘ఎగతాళి చేయు, అపహసించు’ అనే భావాన్ని ఇస్తుంది. సందర్భానికి సరిపోయే అనుమతి/రాయితీ భావాన్ని ‘చేయవచ్చు’ తెలియజేస్తుంది; అయితే మూలంలోని రూపం సాధారణ భవిష్యత్తుగానూ అర్థమవవచ్చు.
theological_decisions:
- issue: תַלְעִיג యొక్క విధి/భావం
  choice: మీరు ఎగతాళి చేయవచ్చు
  alternative: మీరు ఎగతాళి చేస్తారు
  rationale: హీబ్రూ క్రియారూపం స్వతహాగా సాధారణ భవిష్యత్తును సూచించగలదు; సందర్భంలో యోబు ‘ముందు నా మాట వినండి, ఆ తర్వాత కావాలంటే ఎగతాళి చేయండి’ అనే రాయితీ భావంతో చెప్పినట్లు ప్రధాన పాఠ్యం ప్రతిబింబిస్తుంది. అస్పష్టతను పాదటిప్పణిలో నిలిపాం.
- issue: תַלְעִיג లో ఏకవచన సంబోధన
  choice: తెలుగులో గౌరవ/బహువచన రూపమైన ‘మీరు’
  alternative: నీవు
  rationale: హీబ్రూలో క్రియ వ్యాకరణపరంగా పురుష ఏకవచనంలో ఉంది; అది ఒక ప్రతినిధి ప్రత్యర్థిని ఉద్దేశించవచ్చు లేదా సమూహంలోని ప్రతి ఒక్కరికి వర్తించే ఏకవచనం కావచ్చు. సందర్భంలో యోబు స్నేహితుల సమూహాన్ని ఉద్దేశిస్తున్నందున తెలుగు ‘మీరు’ సహజంగా ఉండి, సంఖ్యను బలవంతంగా నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘సహించండి’ యోబు తన మాట పూర్తయ్యే వరకు ఓపిక పట్టమనే అంతర్వ్యక్తిగత భావాన్ని సహజంగా అందిస్తుంది. విరామచిహ్నాలతో రెండు దశల విన్నపాన్ని స్పష్టంగా చూపించాం.
