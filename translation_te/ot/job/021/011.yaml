  yaml_path: translation/ot/job/021/011.yaml
  text: They send out their little ones like a flock[c][b][a], and their children dance.
translation:
  language: te
  text: 'వారు తమ చిన్నపిల్లలను[b] ఒక మందలా[a] బయటికి పంపుతారు;

    వారి పిల్లలు నాట్యం చేస్తారు.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “గొర్రెలలా.” హీబ్రూ పదం గొర్రెలను లేదా గొర్రెలు-మేకలు వంటి చిన్న పశువులను సమూహంగా సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా “తమ పసిపిల్లలను.” హీబ్రూ పదం చాలా చిన్న వయసున్న పిల్లలను సూచిస్తుంది; అయితే అది కేవలం నవజాత శిశువులనే సూచించాల్సిన అవసరం లేదు.
    reason: lexical_alternative
  - marker: c
    text: లేదా “గంతులు వేస్తారు,” “ఎగిరి గంతులేస్తారు.” హీబ్రూ క్రియ ఉల్లాసభరితమైన, చలాకీ కదలికను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְשַׁלְּחוּ
  choice: బయటికి పంపుతారు
  rationale: שלח అనే క్రియ పియేల్ రూపంలో ‘బయటికి పంపడం’ లేదా ‘వెళ్లనివ్వడం’ అనే భావాన్ని ఇస్తుంది. ఇక్కడ సంపన్నుల పిల్లలు స్వేచ్ఛగా బయటికి వెళ్లే దృశ్యానికి ‘బయటికి పంపుతారు’ సహజంగా సరిపోతుంది.
- source_word: כַצֹּאן
  choice: ఒక మందలా
  rationale: צֹאן అనేది గొర్రెలు లేదా మేకలు వంటి చిన్న పశువులను సమూహంగా సూచిస్తుంది. כ ఉపసర్గ ఉపమానాన్ని సూచిస్తుంది; పిల్లలు సమూహంగా ఉల్లాసంగా వెళ్లే చిత్రాన్ని ‘ఒక మందలా’ సహజంగా నిలుపుతుంది.
- source_word: עֲוִילֵיהֶם
  choice: తమ చిన్నపిల్లలను
  rationale: עויל చాలా చిన్న వయసున్న పిల్లలను సూచిస్తుంది. ‘చిన్నపిల్లలు’ యౌవనత్వాన్ని స్పష్టంగా తెలియజేస్తూనే, వారిని కేవలం నవజాత శిశువులకే పరిమితం చేయదు.
- source_word: יַלְדֵיהֶם
  choice: వారి పిల్లలు
  rationale: ילד ఇక్కడ పిల్లలు లేదా సంతానం అనే విస్తృత అర్థంలో ఉంది. ముందు పాదంలోని ‘చిన్నపిల్లలు’తో సమాంతరంగా ‘పిల్లలు’ సహజంగా సరిపోతుంది.
- source_word: יְרַקֵּדוּן
  choice: నాట్యం చేస్తారు
  rationale: רקד ఉల్లాసంగా నాట్యం చేయడం, ఎగరడం లేదా గంతులు వేయడం వంటి చలాకీ కదలికను సూచిస్తుంది. సందర్భంలోని నిర్భయమైన సంతోషాన్ని ‘నాట్యం చేస్తారు’ స్పష్టంగా, సహజంగా వ్యక్తపరుస్తుంది.
