translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. హీబ్రూ కవితా సమాంతరతను రెండు పాదాలుగా నిలిపి, మొదటి పాదంలో చిన్న వయసును, రెండవ పాదంలో విస్తృతమైన ‘పిల్లలు’ అనే పదాన్ని కాపాడాం.
