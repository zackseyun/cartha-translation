  source_fidelity: 'The Telugu preserves both Hebrew cola accurately: יְשַׁלְּחוּ is represented by “బయటికి పంపుతారు,” the comparison כַצֹּאן by “ఒక మందలా,” עֲוִילֵיהֶם by “తమ చిన్నపిల్లలను,” and יַלְדֵיהֶם / יְרַקֵּדוּן by “వారి పిల్లలు నాట్యం చేస్తారు.” The distinction between younger little ones and children is retained without forcing a precise age distinction beyond the Hebrew.'
