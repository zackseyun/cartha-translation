    text: లేదా, “మీరు నాకు వ్యతిరేకంగా పన్నే పథకాలు” లేదా “నాపై మీరు పన్నే హింసాత్మక పథకాలు.” హీబ్రూ క్రియకు హింస చేయడం, అణచివేయడం, లేదా అన్యాయం చేయడం అనే అర్థాలు రావచ్చు.
