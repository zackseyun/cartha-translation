lexical_decisions:
- source_word: הֵן
  choice: ఇదిగో
  rationale: శ్రోతల దృష్టిని ఆకర్షిస్తూ మాటకు బలం చేకూర్చే హీబ్రూ అవ్యయానికి సహజమైన, గౌరవప్రదమైన తెలుగు సమానం.
- source_word: יָדַעְתִּי
  choice: నాకు తెలుసు
  rationale: ఈ సందర్భంలో పూర్తయిన క్రియ ప్రస్తుత జ్ఞానాన్ని సూచిస్తుంది; తెలుగులో ‘నాకు తెలుసు’ సహజంగా ఆ భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: מַחְשְׁבוֹתֵיכֶם
  choice: మీ ఆలోచనలు
  rationale: ఈ నామవాచకం ఆలోచనలు, యోచనలు, ఉద్దేశాలు అనే భావాలను ఇవ్వగలదు. ‘ఆలోచనలు’ మూలపద విస్తృతిని నిలుపుతుంది; శత్రుత్వ భావం తరువాతి సమాంతర పదబంధంలో స్పష్టమవుతుంది.
- source_word: וּמְזִמּוֹת
  choice: పన్నాగాలు
  rationale: సందర్భంలో ఉద్దేశపూర్వకమైన ప్రతికూల యోచన భావం ఉంది. ‘పన్నాగాలు’ అనవసరంగా ‘చెడు’ అనే విశేషణాన్ని చేర్చకుండా ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: עָלַי
  choice: నాకు
  rationale: తరువాతి חמס క్రియతో కలిపి యోబుకు వ్యతిరేకంగా జరిగే అన్యాయాన్ని సూచిస్తుంది; తెలుగులో ‘నాకు అన్యాయం చేయడానికి’ అనే నిర్మాణం ఈ సంబంధాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: תַּחְמֹסוּ
  choice: అన్యాయం చేయడానికి
  rationale: חמס మూలం హింస, అణచివేత, అన్యాయమైన హాని అనే భావాలను కలిగి ఉంటుంది. ఇక్కడ కేవలం శారీరక హింసను నిర్బంధంగా సూచించకుండా, యోబుకు హాని చేసే అన్యాయ ఉద్దేశాన్ని ‘అన్యాయం చేయడం’ స్పష్టంగా అందిస్తుంది.
