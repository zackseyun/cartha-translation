translation:
  language: te
  text: ఇదిగో, మీ ఆలోచనలు, నాకు అన్యాయం చేయడానికి మీరు పన్నే పన్నాగాలు నాకు తెలుసు.[a]
  philosophy: optimal-equivalence
  footnotes:
