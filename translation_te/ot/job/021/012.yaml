  yaml_path: translation/ot/job/021/012.yaml
  text: They sing to the tambourine and lyre, and rejoice at the sound of the flute.
translation:
  language: te
  text: వారు కంజీరా, వీణలతో స్వరమెత్తుతారు; ఊదువాద్యం[a] ధ్వనికి సంతోషిస్తారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ఊదువాద్యం: హెబ్రీ పదమైన ఉగావ్ ఏ నిర్దిష్ట వాద్యాన్ని సూచిస్తుందో ఖచ్చితంగా తెలియదు; సాధారణంగా ఒక ఊదే వాద్యంగా అర్థం చేసుకుంటారు.'
    reason: The identity of עוּגָב is uncertain; the note preserves that lexical ambiguity without imposing a specific instrument identification.
lexical_decisions:
- source_word: יִשְׂאוּ
  choice: పాటలు పాడుతారు
  rationale: మూల క్రియకు సాధారణంగా ‘ఎత్తుతారు/మోస్తారు’ అనే అర్థం ఉన్నా, వాద్యాల సందర్భంలో స్వరమెత్తడం లేదా పాడడం అనే భావం సహజం. తెలుగు పాఠకునికి సందర్భార్థాన్ని స్పష్టంగా అందించేందుకు ఈ రూపం ఎంచుకున్నాం.
- source_word: תֹף
  choice: కంజీరా
  rationale: చేతితో కొట్టే చిన్న చట్రపు తాళవాద్యాన్ని సూచించే సందర్భోచిత ఆధునిక తెలుగు పదం.
- source_word: כִּנּוֹר
  choice: వీణ
  rationale: ప్రాచీన తంతివాద్యాన్ని సూచించేందుకు తెలుగు బైబిలు వాడుకలో సుపరిచితమైన సమీప సమానార్థక పదం.
- source_word: עוּגָב
  choice: వేణువు
  rationale: ఈ ప్రాచీన వాద్యం యొక్క ఖచ్చిత స్వరూపం అనిశ్చితమైనప్పటికీ, సందర్భంలో ఊదే వాద్యాన్ని సూచించే సహజమైన తెలుగు సమానం.
- source_word: וְיִשְׂמְחוּ לְקוֹל
  choice: ధ్వనికి ఆనందిస్తారు
  rationale: శబ్దాన్ని విని లేదా దానికి అనుగుణంగా సంతోషించడాన్ని సహజంగా, మూలంలోని సంబంధాన్ని నిలుపుతూ వ్యక్తపరుస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా రూపొందించబడింది. కవితాత్మక సమాంతరతను నిలుపుతూ, మొదటి భాగంలోని సందర్భసిద్ధమైన ‘పాడుతారు’ అనే భావాన్ని స్పష్టంగా తెలిపింది.
