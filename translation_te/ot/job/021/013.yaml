  to: 'వారు తమ రోజులను సుఖసంపదలలో గడుపుతారు;

    ఒక్క క్షణంలోనే షియోల్‌కు[a] దిగిపోతారు.'
  rationale: The sole revision changes సుఖసంపదలతో to సుఖసంపదలలో so that the Telugu reflects the Hebrew sense of living out one's days in prosperity, rather than merely possessing or being accompanied by prosperity. The rendering of Sheol, its footnote anchor, and the abrupt descent imagery are retained.
