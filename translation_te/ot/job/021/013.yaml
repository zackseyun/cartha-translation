id: JOB.21.13
reference: Job 21:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: יבלו בַ/טּ֣וֹב יְמֵי/הֶ֑ם וּ֝/בְ/רֶ֗גַע שְׁא֣וֹל יֵחָֽתּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/013.yaml
  text: They spend their days in prosperity[a], and in a moment they go down to Sheol.
translation:
  language: te
  text: 'వారు తమ రోజులను సుఖసంపదలలో గడుపుతారు;

    ఒక్క క్షణంలోనే షియోల్‌కు[a] దిగిపోతారు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘సమాధి,’ ‘మృతుల లోకం,’ లేదా ‘మరణం.’ హీబ్రూ పదం షియోల్.
    reason: lexical_alternative
lexical_decisions:
- source_word: יבלו
  choice: గడుపుతారు
  rationale: పియేల్ రూపంలో ఈ క్రియ తమ రోజులను గడపడం లేదా పూర్తిచేయడం అనే భావాన్ని ఇస్తుంది. ఆధునిక తెలుగులో ‘గడుపుతారు’ సహజంగా ఉండి కాలసంబంధ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: בַטּוֹב
  choice: సుఖసంపదలతో
  rationale: טוֹב ప్రాథమికంగా ‘మంచి’ అని అర్థమైనా, ఇక్కడ దుష్టులు అనుభవిస్తున్న క్షేమం, సౌఖ్యం, సంపదతో కూడిన స్థితిని సూచిస్తుంది. ‘సుఖసంపదలతో’ ఆ సందర్భార్థాన్ని సహజంగా అందిస్తుంది.
- source_word: יְמֵיהֶם
  choice: తమ రోజులను
  rationale: హీబ్రూ కాలవ్యక్తీకరణను నేరుగా నిలుపుతూ, తెలుగు వాక్యంలో కర్తతో సహజంగా అనుసంధానించడానికి ‘తమ’ వాడబడింది.
- source_word: וּבְרֶגַע
  choice: ఒక్క క్షణంలోనే
  rationale: רֶגַע అతి స్వల్పమైన క్షణాన్ని సూచిస్తుంది. జీవితమంతా సుఖంగా గడపడానికి, మరణం అకస్మాత్తుగా సంభవించడానికి మధ్య ఉన్న వ్యత్యాసాన్ని ‘ఒక్క క్షణంలోనే’ బలంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: שְׁאוֹל
  choice: షియోల్
  rationale: ఈ హీబ్రూ పదం మృతుల లోకాన్ని లేదా మరణస్థితిని సూచించే విస్తృత భావాన్ని కలిగి ఉంది. ‘సమాధి,’ ‘మరణం,’ లేదా తరువాతి సిద్ధాంతపరమైన ‘నరకం’ అనే పదంతో దాని భావాన్ని కుదించకుండా లిప్యంతరీకరించబడింది.
- source_word: יֵחָתּוּ
  choice: దిగిపోతారు
  rationale: షియోల్‌తో ఉన్న అనుసంధానంలో ఈ క్రియ దిగిపోవడాన్ని సూచిస్తుంది. ‘దిగిపోతారు’ మూలంలోని దిశాత్మక చిత్రాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: שְׁאוֹל పదం అనువాదం
  choice: షియోల్
  alternative: సమాధి; మృతుల లోకం; మరణం
  rationale: ఈ వచనం మృతుల గమ్యాన్ని సూచిస్తున్నప్పటికీ, దానిని ‘నరకం’ వంటి తరువాతి కాలపు నిర్దిష్ట సిద్ధాంతపదంతో సమానం చేయదు. ‘షియోల్’ అనే లిప్యంతరీకరణ హీబ్రూ పదంలోని భావవిస్తృతిని, వేదాంతపరమైన తెరువును కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన శైలి వాడబడింది. రెండు పాదాల మధ్య వ్యత్యాసాన్ని నిలుపడానికి పాదవిభజన మరియు అర్ధవిరామం ఉపయోగించబడ్డాయి. మూలార్థంతో సంబంధం ఉన్నందున [a] సూచికను ‘షియోల్’ వద్ద ఉంచాం.
