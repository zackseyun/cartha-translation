    rationale: “ఉగ్రత దినానికి వారు నడిపించబడతారు” గమ్యాన్ని స్పష్టపరుస్తూ హోఫాల్ క్రియ యొక్క నడిపించబడే/తీసుకురాబడే విస్తృత భావాన్ని కాపాడుతుంది.
