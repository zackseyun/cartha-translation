  to: ఎందుకంటే విపత్తు దినం వరకు దుష్టుడు తప్పించబడతాడు[a]; ఉగ్రత దినానికి వారు నడిపించబడతారు[b].
  rationale: ప్రధాన సవరణ లְיוֹם అర్థాన్ని తెలుగులో సహజంగా వ్యక్తం చేయడానికే. “విపత్తు దినం వరకు” తక్షణ తీర్పు నుంచి తప్పించబడి భవిష్యత్తు దినంతో సంబంధం ఉన్న భావాన్ని తెలియజేస్తుంది; పాదసూచికలో ‘కొరకు నిలిపి ఉంచబడతాడు’ అనే ప్రత్యామ్నాయం ద్వారా నిఫాల్ క్రియ మరియు ఉపసర్గకు సంబంధించిన అస్పష్టతను సంరక్షించాం. హీబ్రూలోని ఏకవచన–బహువచన మార్పు, అలాగే తీర్పు సమయాన్ని నిర్దిష్టంగా నిర్వచించని భాష యథాతథంగా ఉన్నాయి.
