source:
  edition: WLC
  text: כִּ֤י לְ/י֣וֹם אֵ֭יד יֵחָ֣שֶׂךְ רָ֑ע לְ/י֖וֹם עֲבָר֣וֹת יוּבָֽלוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/030.yaml
  text: For the evil man is spared for the day of disaster[b][a]; they are led away for the day of wrath.
translation:
  language: te
  text: ఎందుకంటే విపత్తు దినం వరకు దుష్టుడు తప్పించబడతాడు[a]; ఉగ్రత దినానికి వారు నడిపించబడతారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “విపత్తు దినం కొరకు దుష్టుడు నిలిపి ఉంచబడతాడు.” హీబ్రూ క్రియకు “తప్పించబడతాడు,” “వెనక్కి ఉంచబడతాడు,” లేదా “నిలిపి ఉంచబడతాడు” అనే అర్థాలు రావచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ఉగ్రత దినానికి వారు తీసుకురాబడతారు.” చివరి హీబ్రూ క్రియను ఆ దినం వైపు నడిపించబడటం లేదా ఆ దినానికి తీసుకురాబడటం అని అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందున్న వాదనకు కారణం లేదా వివరణను పరిచయం చేస్తుంది.
- source_word: לְיוֹם אֵיד
  choice: విపత్తు దినం కోసం
  rationale: לְ ఉపసర్గ భవిష్యత్తులోని ఒక దినాన్ని సూచిస్తుంది; אֵיד విపత్తు, ఆపద లేదా వినాశాన్ని సూచిస్తుంది.
- source_word: יֵחָשֶׂךְ
  choice: తప్పించబడతాడు
  rationale: నిఫాల్ రూపానికి ‘తప్పించబడటం,’ ‘వెనక్కి ఉంచబడటం,’ లేదా ‘కాపాడి ఉంచబడటం’ అనే భావాలు సాధ్యం. ప్రధాన పాఠం తక్షణ విపత్తు నుంచి తప్పించబడే భావాన్ని సహజంగా తెలుపుతుంది; ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: רָע
  choice: దుష్టుడు
  rationale: ఏకవచన విశేషణం వ్యక్తిని సూచించే నామవాచకంగా వాడబడింది. ‘దుష్టుడు’ తెలుగు బైబిలు శైలిలోనూ ఆధునిక సాధారణ వాడుకలోనూ స్పష్టంగా ఉంటుంది.
- source_word: לְיוֹם עֲבָרוֹת
  choice: ఉగ్రత దినం కోసం
  rationale: עֲבָרוֹת కోపావేశం, ఉగ్రత లేదా పొంగిపొర్లే ఆగ్రహాన్ని సూచించే బహువచన రూపం; ఇక్కడ బహువచనం తీవ్రతను సూచించవచ్చు. ‘ఉగ్రత’ మూలపదంలోని బలాన్ని నిలుపుతుంది.
- source_word: יוּבָלוּ
  choice: వారు తీసుకుపోబడతారు
  rationale: హోఫాల్ రూపం ‘తీసుకురాబడటం/తీసుకుపోబడటం/నడిపించబడటం’ అని అర్థమవుతుంది. హీబ్రూలోని ఏకవచనం నుంచి బహువచనానికి మార్పును ‘వారు’తో అలాగే నిలిపాం.
theological_decisions:
- issue: దైవిక తీర్పుతో సంబంధించి వాక్య భావం
  choice: దుష్టుడు తక్షణ విపత్తు నుంచి తప్పించబడి, భవిష్యత్తు ఉగ్రత దినం వైపు తీసుకుపోబడతాడనే భావాన్ని ప్రధాన పాఠం సూచిస్తుంది.
  alternative: దుష్టుడు విపత్తు దినానికై ప్రత్యేకంగా నిలిపి ఉంచబడతాడు; లేదా ఉగ్రత దినానికి తీసుకురాబడతాడు.
  rationale: రెండు לְיוֹם పదబంధాలూ భవిష్యత్తు తీర్పును సూచించగలవు. అయితే క్రియల అర్థవ్యాప్తి తీర్పు నుంచి పూర్తిగా తప్పించుకోవడం, తీర్పు కోసం నిలిపి ఉంచబడడం, లేదా ఆ దినానికి తీసుకురాబడడం అనే ఉద్రిక్తతను కలిగిస్తుంది; దానిని పాదసూచికల్లో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన, సులభంగా అర్థమయ్యే శైలిని వాడాం. హీబ్రూ పాఠంలోని ‘దుష్టుడు’ అనే ఏకవచనం నుంచి ‘వారు’ అనే బహువచనానికి మార్పును సవరించకుండా నిలిపాం; క్రియల అస్పష్టతను పాదసూచికల్లో తెలిపాం.
