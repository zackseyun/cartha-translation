  text: Turn to me and be appalled[a], and put your hand over your mouth.
translation:
  language: te
  text: నా వైపు తిరిగి దిగ్భ్రాంతి చెందండి[a]; మీ నోటిమీద చేయి పెట్టుకోండి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “విస్తుపోండి.” హీబ్రూ క్రియ విస్తుపోవడం, దిగ్భ్రాంతి చెందడం, లేదా భయంతో నిశ్చేష్టులవడం అనే భావాలను వ్యక్తం చేయగలదు; ఇక్కడ యోబు పరిస్థితిని చూసి కలిగే దిగ్భ్రాంతికరమైన ప్రతిస్పందనను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּנוּ אֵלַי
  choice: నా వైపు తిరిగి
  rationale: פנה యొక్క బహువచన ఆజ్ఞారూపం, אֵלַיతో కలిసి, మాట్లాడుతున్న యోబువైపు ముఖం లేదా దృష్టి తిప్పమనే ప్రత్యక్ష పిలుపును సూచిస్తుంది. ‘నా వైపు తిరిగి’ అనేది దిశాభావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: וְהָשַׁמּוּ
  choice: విస్తుపోండి
  rationale: שׁמם హిఫీల్ ఆజ్ఞారూపం ఇక్కడ దిగ్భ్రాంతి, విస్మయం, భయమిశ్రితమైన కలవరాన్ని వ్యక్తం చేస్తుంది. ‘విస్తుపోండి’ ఈ సందర్భంలోని ఒక్కసారిగా నిశ్చేష్టులయ్యే ప్రతిస్పందనను సహజంగా తెలియజేస్తుంది; ప్రతికూల భావాన్ని మాత్రమే బలవంతంగా నిర్దేశించదు.
- source_word: וְשִׂימוּ יָד עַל־פֶּה
  choice: మీ నోటిమీద చెయ్యి పెట్టుకోండి
  rationale: ఇది మౌనం లేదా దిగ్భ్రాంతితో మాట ఆపుకోవడాన్ని సూచించే శరీరభాష. హీబ్రూలో స్వామ్యప్రత్యయాలు స్పష్టంగా లేకున్నా, బహువచన సంబోధనకు అనుగుణంగా తెలుగులో ‘మీ’ సహజంగా అవసరం. ‘చెయ్యి’ సామాన్య ఆధునిక ప్రయోగం; ‘పెట్టుకోండి’ ఆ వ్యక్తి తన నోటిమీద తన చెయ్యి ఉంచే భావాన్ని స్పష్టం చేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన బహువచన ఆజ్ఞారూపాలు వాడబడ్డాయి. వాక్యంలోని ప్రత్యక్షతను, శరీరభాషను, హీబ్రూ క్రియలోని భావపరమైన విస్తృతిని నిలుపుతూ సహజమైన తెలుగు నిర్మాణాన్ని ఎంచుకున్నాం.
