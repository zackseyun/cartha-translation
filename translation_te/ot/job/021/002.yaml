  text: Listen carefully to my words[a], and let this be your consolation.
translation:
  language: te
  text: నా మాటను శ్రద్ధగా వినండి; ఇదే మీ ఓదార్పుగా ఉండనివ్వండి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా “మీ ఓదార్పులు” అని బహువచనంలో ఉంది; “మీరు ఇచ్చే ఓదార్పు” అని కూడా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ שָׁמוֹעַ
  choice: శ్రద్ధగా వినండి
  rationale: ఒకే ధాతువుతో వచ్చిన ఆజ్ఞారూపం, క్రియానామరూపం కలిసి వినాలనే పిలుపును బలపరుస్తాయి. తెలుగులో సహజంగా ఆ బలాన్ని ‘శ్రద్ధగా’ అనే క్రియావిశేషణంతో వ్యక్తం చేశాం.
- source_word: מִלָּתִי
  choice: నా మాటను
  rationale: ఇది ఏకవచన నామవాచకానికి ప్రథమ పురుష ఏకవచన ప్రత్యయం జతైన రూపం. మూలంలోని ఏకవచనాన్ని ‘నా మాటను’ నిలుపుతుంది; సందర్భంలో ఇది యోబు చెప్పబోయే మాటల సమష్టిని సూచించగలదు.
- source_word: וּתְהִי
  choice: ఉండనివ్వండి
  rationale: היה క్రియ యొక్క సంకల్పార్థక రూపం అభ్యర్థన లేదా ఆకాంక్షను తెలియజేస్తుంది. ‘ఉండనివ్వండి’ ఆ భావాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: זֹאת
  choice: ఇదే
  rationale: ‘ఇది’ అనే సూచనను నిలుపుతూ, వినడమే ఓదార్పు కావాలనే వాక్యంలోని కేంద్రీకరణను ‘ఇదే’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: תַּנְחֻמוֹתֵיכֶם
  choice: మీ ఓదార్పుగా
  rationale: మూలపదం రూపరీత్యా బహువచనమైనప్పటికీ, తెలుగులో భావవాచకంగా ఏకవచన ‘ఓదార్పు’ సహజం. ‘మీ’ అనే స్వామ్యరూపాన్ని నిలిపి, అది వారికి కలిగే ఓదార్పా లేక వారు అందించే ఓదార్పా అనే సందర్భసిద్ధమైన ఉద్వేగాన్ని ప్రధాన పాఠంలో పూర్తిగా విప్పలేదు.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ఆజ్ఞా-అభ్యర్థనా శైలిని వాడాం. హీబ్రూ పదక్రమాన్ని యాంత్రికంగా అనుసరించకుండా దాని బలం, సంక్షిప్తత, మరియు ‘మీ ఓదార్పు’లోని భావసందిగ్ధతను సాధ్యమైనంతవరకు నిలిపాం.
