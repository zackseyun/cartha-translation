  source_fidelity: 'The draft faithfully represents the Hebrew: בָּתֵּיהֶם as “వారి ఇళ్లు,” שָׁלוֹם as a condition of well-being/security, מִפָּחַד as freedom from fear, and the deliberately broad metaphor שֵׁבֶט אֱלוֹהַּ as “దేవుని దండం.” “వారిమీద లేదు” appropriately renders the idiom “is not upon them.”'
