source:
  edition: WLC
  text: בָּתֵּי/הֶ֣ם שָׁל֣וֹם מִ/פָּ֑חַד וְ/לֹ֤א שֵׁ֖בֶט אֱל֣וֹהַּ עֲלֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/009.yaml
  text: Their houses are safe from fear[b][a], and the rod of God is not upon them.
translation:
  language: te
  text: వారి ఇళ్లు భయం లేక క్షేమంగా ఉన్నాయి[a]; దేవుని దండం వారిమీద లేదు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారి కుటుంబాలు భయం లేక క్షేమంగా ఉన్నాయి.”
    reason: lexical_alternative
  - marker: b
    text: “దేవుని దండం” అనేది దేవుడు కొట్టడం, క్రమశిక్షణ చేయడం లేదా బాధ కలిగించడం అనే భావాలకు రూపకం.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּתֵּיהֶם
  choice: వారి ఇళ్లు
  rationale: బַּיִת పదం యొక్క బహువచన రూపాన్ని స్పష్టంగా, సహజంగా అనువదిస్తూ హెబ్రీయ మూలంలోని గృహాల చిత్రాన్ని నిలుపుతుంది; సందర్భంలో ఇది కుటుంబాలను కూడా సూచించవచ్చు.
- source_word: שָׁלוֹם
  choice: క్షేమంగా
  rationale: ఇక్కడ ఈ పదం ప్రమాదం లేకుండా సురక్షితంగా, బాగున్న స్థితిని సూచిస్తుంది. ‘క్షేమంగా’ అనేది భయానికి దూరంగా ఉండటంతో సహజంగా కలుస్తుంది.
- source_word: מִפָּחַד
  choice: భయానికి దూరంగా
  rationale: מִן ఉపసర్గ భయం నుండి వేరుగా లేదా విముక్తంగా ఉన్న భావాన్ని ఇస్తుంది. ఈ రూపం మూలంలోని సంబంధాన్ని కాపాడుతుంది.
- source_word: שֵׁבֶט
  choice: దండం
  rationale: ఈ సందర్భంలో ఇది దేవుడు కొట్టడం, శిక్షించడం లేదా బాధ కలిగించడం అనే విస్తృత రూపకాన్ని సూచిస్తుంది. ‘దండం’ ఆ రూపకాన్ని నిర్దిష్టంగా కుదించకుండా నిలుపుతుంది.
- source_word: אֱלוֹהַּ
  choice: దేవుని
  rationale: అయ్యూబు గ్రంథంలో దేవునికి వాడిన ఏకవచన కవితాత్మక రూపానికి సూటియైన తెలుగు సమానం.
- source_word: עֲלֵיהֶם
  choice: వారిమీద
  rationale: దండం వారిపై ఉండటం లేదా వారిపై పడటం అనే హెబ్రీయ రూపకాన్ని సహజమైన తెలుగులో కాపాడుతుంది.
- source_word: וְלֹא
  choice: లేదు
  rationale: రెండవ వాక్యభాగంలోని నిరాకరణను ఆధునిక తెలుగులో స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది; అర్ధవిరామం రెండు సమన్విత భావాలను కలుపుతుంది.
theological_decisions:
- issue: ‘దేవుని దండం’ సూచించే దైవిక చర్య స్వభావం
  choice: ‘దేవుని దండం’ అనే రూపకాన్ని యథాతథంగా నిలుపడం
  alternative: దేవుని శిక్ష / దేవుని క్రమశిక్షణ / దేవుడు కలిగించే బాధ
  rationale: హెబ్రీయ రూపకం కొట్టడం, శిక్షించడం లేదా బాధ కలిగించడం వంటి భావాలను కలిగి ఉండవచ్చు. వాటిలో ఒక్కదానినే ఎంచుకుంటే మూలపాఠంలోని ఉద్దేశపూర్వక విస్తృతత, theological tension తగ్గిపోతాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, అయినా అయ్యూబు గ్రంథపు కవితాత్మక గాంభీర్యాన్ని నిలుపుతూ అనువదించబడింది. ‘ఇళ్లు,’ ‘క్షేమంగా,’ ‘దండం’ వంటి పదాలు మూలచిత్రాలను కాపాడుతూ సహజమైన తెలుగు వాక్యనిర్మాణంలో అమర్చబడ్డాయి.
