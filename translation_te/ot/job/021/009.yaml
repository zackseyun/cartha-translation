  terminology: “దేవుని దండం” retains the Hebrew image without reducing it to punishment, discipline, or affliction. “క్షేమంగా” is suitable for the broad well-being/security sense of שָׁלוֹם. The alternative “కుటుంబాలు” appropriately signals the contextual extension of “houses” without replacing the main-text image.
