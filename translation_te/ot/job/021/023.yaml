  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన వాక్యనిర్మాణం వాడబడింది. మూలంలోని జ్ఞానోక్తి స్వభావం, ప్రతినిధి ఏకవచనం, ప్రశాంత స్థితిని తెలిపే సమాంతర పదజంట నిలుపబడ్డాయి.
