  yaml_path: translation/ot/job/021/023.yaml
  text: One dies in the fullness of his vigor[a], wholly at ease and secure.
translation:
  language: te
  text: ఒకడు తన బలం ఏమాత్రం తగ్గని స్థితిలో, పూర్తిగా నిశ్చింతగా, కలతలేకుండా చనిపోతాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఈ వ్యక్తి నిండు బలంతో, పూర్తిగా నిశ్చింతగా, ప్రశాంతంగా చనిపోతాడు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶה
  choice: ఒకడు
  rationale: ఇక్కడ నిర్దేశక సర్వనామం యోబు పోల్చి చూపుతున్న రెండు విధాల మరణాల్లో ఒక ప్రతినిధి వ్యక్తిని పరిచయం చేస్తుంది. ఆధునిక తెలుగులో ‘ఒకడు’ ఆ సాధారణ ఏకవచన భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: יָמוּת
  choice: చనిపోతాడు
  rationale: ఈ అసంపూర్ణ క్రియారూపం ఇక్కడ భవిష్యద్వాణిగా కాక, మానవ అనుభవాన్ని సాధారణ సత్యంలా చెప్పే భావంలో ఉంది; అందువల్ల వర్తమాన సాధారణ రూపం వాడబడింది.
- source_word: בְּעֶצֶם תֻּמּוֹ
  choice: తన బలం ఏమాత్రం తగ్గని స్థితిలో
  rationale: עֶצֶם అనే పదానికి ప్రాథమికంగా ‘ఎముక’, విస్తృతంగా సారం లేదా బలం అనే భావాలున్నాయి; תֻּמּוֹ సంపూర్ణత లేదా లోపంలేని స్థితిని సూచిస్తుంది. ఈ సందర్భంలో నైతిక నిర్దోషిత్వం కంటే క్షీణించని శారీరక జీవబలమే ఉద్దేశం. తెలుగు అనువాదం ఆ సంయుక్త నుడికార భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: כֻּלּוֹ
  choice: పూర్తిగా
  rationale: తరువాతి ప్రశాంత స్థితి వర్ణనను బలపరిచే అవ్యయ భావాన్ని సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: שַׁלְאֲנַן
  choice: నిశ్చింతగా
  rationale: కలవరంలేని సౌఖ్యం, ప్రశాంత నమ్మకం అనే భావాన్ని ఇస్తుంది; సందర్భంలో ఉండవచ్చిన ఐశ్వర్య భావాన్ని అనవసరంగా అతిశయింపదు.
- source_word: וְשָׁלֵיו
  choice: కలతలేకుండా
  rationale: సమీపార్థక సమాంతర పదంగా స్థిరమైన ప్రశాంతతను, అంతరాయం లేని స్థితిని తెలియజేస్తుంది; ‘నిశ్చింతగా’ అనే మొదటి పదాన్ని సహజంగా బలపరుస్తుంది.
