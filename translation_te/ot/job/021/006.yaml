translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన వాక్య నిర్మాణం. మూలంలోని రెండు సమాంతర ప్రతిస్పందనలను అర్ధవిరామంతో అనుసంధానించాం; వ్యాఖ్యానాత్మక లేదా మతశాఖాపర పదజాలం చేర్చలేదు.
