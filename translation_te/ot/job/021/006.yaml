translation:
  language: te
  text: దాన్ని జ్ఞాపకం చేసుకున్నప్పుడు నేను దిగ్భ్రాంతి చెందుతాను; నా శరీరాన్ని వణుకు పట్టుకుంటుంది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם
  choice: చేసుకున్నప్పుడు
  rationale: ఇక్కడ אִם సాధారణ షరతుకన్నా కాలసూచక భావంలో ఉంది; యోబు ఆ విషయాన్ని జ్ఞాపకం చేసుకునే వేళ కలిగే ప్రతిస్పందనను సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: זָכַרְתִּי
  choice: జ్ఞాపకం చేసుకున్నప్పుడు
  rationale: זכר అనే క్రియలోని ‘గుర్తుచేసుకోవడం/జ్ఞాపకం చేసుకోవడం’ భావాన్ని నిలుపుతుంది. తెలుగులో కర్మ అవసరమైనందున ముందున్న విషయాన్ని సూచించే ‘దాన్ని’ చేర్చబడింది.
- source_word: וְנִבְהָלְתִּי
  choice: నేను దిగ్భ్రాంతి చెందుతాను
  rationale: בהל భయం, కలవరం, దిగ్భ్రాంతితో కుదేలవడాన్ని సూచిస్తుంది; ‘దిగ్భ్రాంతి చెందుతాను’ సందర్భానికి తగిన గంభీరమైన ఆధునిక ప్రయోగం.
- source_word: וְאָחַז
  choice: పట్టుకుంటుంది
  rationale: אחז యొక్క ‘పట్టుకోవడం/ఆవరించడం’ రూపకాన్ని తెలుగులో సహజంగా నిలుపుతుంది.
- source_word: בְשָׂרִי
  choice: నా శరీరాన్ని
  rationale: בשר ఇక్కడ వ్యక్తి యొక్క దేహాన్ని సూచిస్తుంది; ‘నా శరీరం’ ఆధునిక పాఠకులకు స్పష్టంగా ఉంటుంది.
- source_word: פַּלָּצוּת
  choice: వణుకు
  rationale: ఈ నామవాచకం తీవ్ర భయంతో కలిగే కంపనం లేదా భీతిని సూచిస్తుంది; ‘వణుకు’ శారీరక ప్రతిస్పందనను సంక్షిప్తంగా తెలియజేస్తుంది.
