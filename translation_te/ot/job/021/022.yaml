id: JOB.21.22
reference: Job 21:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: הַ/לְ/אֵ֥ל יְלַמֶּד דָּ֑עַת וְ֝/ה֗וּא רָמִ֥ים יִשְׁפּֽוֹט־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/022.yaml
  text: Can anyone teach God knowledge[a], since he judges those on high?
translation:
  language: te
  text: దేవునికి ఎవరైనా జ్ఞానం నేర్పగలరా? ఆయన ఉన్నతులను[a] తీర్పు తీర్చుతాడు కదా.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ఉన్నతులైనవారు’ అని కూడా అనువదించవచ్చు; బహుశా ‘పరలోక జీవులు.’
    reason: alternative_reading
lexical_decisions:
- source_word: הַלְאֵל
  choice: దేవునికి ఎవరైనా ... నేర్పగలరా?
  rationale: హే ప్రశ్నార్థక ఉపసర్గతో లְאֵל కలసి అలంకారిక ప్రశ్నను నిర్మిస్తుంది. తెలుగులో సహజంగా ఉండేందుకు అంతర్లీన కర్తను ‘ఎవరైనా’గా వ్యక్తం చేసి, అసాధ్యతను సూచించే ‘నేర్పగలరా?’ అని అనువదించాం.
- source_word: יְלַמֶּד
  choice: నేర్పగలరా
  rationale: למד పీయేల్ రూపానికి ‘నేర్పు/బోధించు’ అనే అర్థం. అలంకారిక ప్రశ్నలోని భావాన్ని సహజ తెలుగులో తెలియజేయడానికి సామర్థ్యార్థక రూపం వాడాం.
- source_word: דָּעַת
  choice: జ్ఞానం
  rationale: ఈ నామవాచకం జ్ఞానం లేదా అవగాహనను సూచిస్తుంది; మూలంలోని అమూర్త నామవాచకాన్ని ‘జ్ఞానం’ నేరుగా నిలుపుతుంది.
- source_word: וְהוּא
  choice: ఆయనే ... కదా
  rationale: మూలంలోని ‘మరియు ఆయన’ సందర్భంలో ప్రశ్నకు ఆధారాన్ని అందిస్తుంది. తెలుగులో ‘ఆయనే ... కదా’ అనే నిర్మాణం ఆ తార్కిక సంబంధాన్ని సహజంగా చూపుతుంది, అయితే దానిని అతిగా వివరిస్తూ నిర్ణయించదు.
- source_word: רָמִים
  choice: ఉన్నత స్థానాల్లో ఉన్నవారు
  rationale: రום మూలం నుంచి వచ్చిన ఈ బహువచన విశేషణాత్మక నామరూపం ఉన్నతులైన వ్యక్తులు లేదా జీవులను సూచించగలదు. ఈ తెలుగు పదబంధం భూలోక ఉన్నతులు, పాలకులు, లేదా పరలోక జీవులు అనే సాధ్యార్థాలను ఒకదానికే పరిమితం చేయదు.
- source_word: יִשְׁפּוֹט
  choice: తీర్పు తీర్చుతాడు
  rationale: שפט ఖల్ రూపం యొక్క సూటి అర్థం ‘తీర్పు తీర్చు/న్యాయం చేయు.’ ఇక్కడ దేవుని సర్వోన్నత న్యాయాధికారాన్ని సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: רָמִים యొక్క సూచన
  choice: ‘ఉన్నత స్థానాల్లో ఉన్నవారు’ అనే విస్తృత, ఉద్దేశపూర్వకంగా అనిర్దిష్టమైన సూచన
  alternative: ‘ఉన్నతులు,’ ‘పాలకులు,’ లేదా ‘పరలోక జీవులు’ అని నిర్దిష్టీకరించడం
  rationale: హీబ్రూ పదం భూలోకంలోని ఉన్నతులను గానీ పరలోక జీవులను గానీ సూచించగలదు. దేవుడు ఉన్నతులందరికీ మించినవాడనే సందర్భ భావాన్ని నిలుపుతూ, మూలం నిర్దేశించని ప్రత్యేక విశ్వవ్యవస్థాత్మక లేదా రాజకీయ అర్థాన్ని అనువాదంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన అలంకారిక ప్రశ్నగా రూపొందించాం. హీబ్రూ పదక్రమాన్ని యథాతథంగా అనుసరించకుండా, కారణాన్ని ముందుంచే తెలుగు నిర్మాణం వాడాం. ‘రָמִים’లోని అస్పష్టతను ప్రధాన పాఠ్యంలో నిలిపి, ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
