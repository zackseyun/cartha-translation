revisions:
- from: ఉన్నత స్థానాల్లో ఉన్నవారికి ఆయనే తీర్పు తీర్చుతాడు కదా; దేవునికి ఎవరైనా జ్ఞానం నేర్పగలరా?[a]
  to: దేవునికి ఎవరైనా జ్ఞానం నేర్పగలరా? ఆయన ఉన్నతులను[a] తీర్పు తీర్చుతాడు కదా.
  rationale: The revision restores the Hebrew sequence, places the alternative-reading marker on the word it explains, and uses “ఉన్నతులు” to retain the intentional breadth of רָמִים without specifying either earthly rulers or heavenly beings.
