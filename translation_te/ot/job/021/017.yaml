  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כַּ/מָּ֤ה נֵר רְשָׁ֘עִ֤ים יִדְעָ֗ךְ וְ/יָבֹ֣א עָלֵ֣י/מוֹ אֵידָ֑/ם חֲ֝בָלִ֗ים יְחַלֵּ֥ק בְּ/אַפּֽ/וֹ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/017.yaml
  text: How often is the lamp of the wicked put out[c][b][a], and does their disaster come upon them? Does he apportion sorrows in his anger?
translation:
  language: te
  text: 'దుష్టుల దీపం ఎన్నిసార్లు ఆరిపోతుంది?[a][b]


    వారి ఆపద వారిమీదికి ఎన్నిసార్లు వస్తుంది?


    తన కోపంలో వారికి వేదనలను పంచిపెడతాడా?[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దుష్టుల దీపం ఎన్నిసార్లు ఆర్పివేయబడుతుంది?’ ఇది దుష్టులకు ఇలాంటి తీర్పు తరచుగా జరుగుతుందనే భావాన్ని సవాలు చేసే అలంకారిక ప్రశ్న.
    reason: lexical_alternative
  - marker: b
    text: ‘దీపం’ అనేది ఒక వ్యక్తి జీవితం, క్షేమం లేదా కొనసాగుతున్న భాగ్యానికి రూపకం.
    reason: cultural_note
  - marker: c
    text: ‘వేదనలు’ అనే హీబ్రూ పదాన్ని ‘నొప్పులు’ లేదా ‘ప్రసవవేదనలు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּמָּה
  choice: ఎన్నిసార్లు
  rationale: ఇక్కడ ఇది పరిమాణాన్ని కాక సంభవించే తరచుదనాన్ని ప్రశ్నించే అలంకారిక ప్రశ్న. దుష్టులకు ఇలాంటి తీర్పు క్రమంగా జరుగుతుందనే వాదనను యోబు సవాలు చేస్తున్న భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: נֵר
  choice: దీపం
  rationale: మూలపదం అక్షరార్థంగా దీపాన్ని సూచిస్తుంది; జ్ఞానసాహిత్యంలో అది జీవితం, క్షేమం లేదా కొనసాగుతున్న భాగ్యానికి రూపకం. తెలుగు అనువాదం ఆ చిత్రాన్ని నిలుపుతుంది.
- source_word: רְשָׁעִים
  choice: దుష్టులు
  rationale: జ్ఞానసాహిత్య సందర్భంలో బహువచన నామవాచకంగా వాడిన విశేషణానికి సంక్షిప్తమైన, ప్రామాణిక తెలుగు రూపం.
- source_word: יִדְעָךְ
  choice: ఆరిపోతుంది
  rationale: דעך దీపం ఆరిపోవడాన్ని సూచిస్తుంది. కర్తను ప్రత్యేకంగా చేర్చకుండా మూలంలోని క్రియను సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: וְיָבֹא עָלֵימוֹ אֵידָם
  choice: వారి ఆపద వారిమీదికి వస్తుంది
  rationale: אֵיד అనేది ఆపద, విపత్తు లేదా నాశనాన్ని సూచిస్తుంది. 'ఆపద' ఆధునిక తెలుగులో స్పష్టంగా ఉండి, అది వారిని ముంచుకొస్తుందనే మూల భావాన్ని కాపాడుతుంది.
- source_word: חֲבָלִים
  choice: వేదనలను
  rationale: ఈ పదానికి వేదనలు, నొప్పులు, ప్రసవవేదనలు వంటి సంబంధిత అర్థాలు ఉన్నాయి. ఆపద మరియు దైవకోపం సమాంతరంగా ఉన్న ఈ సందర్భంలో 'వేదనలు' విస్తృతమైన అర్థాన్ని కాపాడుతుంది.
- source_word: יְחַלֵּק
  choice: పంచిపెడతాడు
  rationale: חלק యొక్క పియేల్ రూపం విభజించడం, పంచడం లేదా భాగంగా కేటాయించడం అని అర్థం. 'పంచిపెడతాడు' సాధారణ పాఠకులకు సహజంగా ఉండి, తీర్పుగా కేటాయించే భావాన్నీ అందిస్తుంది.
- source_word: בְּאַפּוֹ
  choice: తన కోపంలో
  rationale: אַף ఈ ప్రయోగంలో కోపాన్ని సూచిస్తుంది. ప్రత్యయం సూచించే మూడవ పురుష ఏకవచనాన్ని 'తన' ద్వారా కాపాడుతూ, దేవుని పేరును మూలం కంటే స్పష్టంగా చేర్చలేదు.
theological_decisions:
- issue: ‘తన కోపంలో పంచిపెడతాడు’ అనే క్రియకు కర్త ఎవరు?
  choice: తెలుగులో ‘ఆయన’ అని ఉంచి, సందర్భం ద్వారా దేవునిని సూచించనివ్వడం
  alternative: కర్తగా ‘దేవుడు’ అని స్పష్టంగా చేర్చడం; లేదా కర్తలేని భావంగా అనువదించడం
  rationale: హీబ్రూ క్రియలో కర్త అంతర్లీనంగా ఉన్నా ఈ ఉపవాక్యంలో దేవుని పేరు లేదు. సందర్భం దేవునిని బలంగా సూచిస్తుంది; అయినప్పటికీ మూలంలో లేని స్పష్టతను చేర్చకుండా మూడవ పురుష రూపాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. మూడు ప్రశ్నల నిర్మాణాన్ని నిలిపి, మొదటి כַּמָּה యొక్క అలంకారిక తరచుదన భావాన్ని రెండవ ప్రశ్నలోనూ తెలుగులో సహజంగా పునరావృతం చేశాం. మూలంలోని దీప రూపకాన్ని వివరణతో భర్తీ చేయకుండా అలాగే ఉంచాం.
