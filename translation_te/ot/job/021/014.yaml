  edition: WLC
  text: וַ/יֹּאמְר֣וּ לָ֭/אֵל ס֣וּר מִמֶּ֑/נּוּ וְ/דַ֥עַת דְּ֝רָכֶ֗י/ךָ לֹ֣א חָפָֽצְנוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/014.yaml
  text: Yet they say to God[a], ‘Depart from us, and we do not desire the knowledge of your ways.’
translation:
  language: te
  text: 'అయినా వారు దేవునితో ఇలా అంటారు: “మా నుండి తొలగిపో[a]; నీ మార్గాలను తెలుసుకోవాలని మేము కోరము.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మా నుండి పక్కకు మళ్లిపో” / “మా నుండి వెళ్లిపో.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: అయినా వారు ... అంటారు
  rationale: వావ్‌తో కూడిన క్రియ కథనంలో మాటను పరిచయం చేస్తుంది. యోబు వర్ణిస్తున్న దుష్టుల స్థిరమైన వైఖరిని తెలుగులో వర్తమానకాలంతో సహజంగా వ్యక్తం చేశాం; ముందున్న సందర్భానికి విరుద్ధ భావాన్ని ‘అయినా’ తెలియజేస్తుంది.
- source_word: לָאֵל
  choice: దేవునితో
  rationale: אֵל ఇక్కడ వ్యక్తినామంగా కాక దేవుణ్ణి సూచించే సాధారణ దైవపదం. మాట ఎవరిని ఉద్దేశించిందో తెలుగులో సహజంగా ‘దేవునితో’ అని ఇచ్చాం.
- source_word: סוּר מִמֶּנּוּ
  choice: మా నుండి తొలగిపో
  rationale: సוּר ఆజ్ఞారూపంలో ‘తొలగిపో, పక్కకు మళ్లిపో, వెళ్లిపో’ అనే పరిధి కలిగి ఉంది. מן ప్రత్యయంతో కలిసి దేవుడు తమ నుంచి దూరం కావాలనే కఠిన ఆజ్ఞను వ్యక్తం చేస్తుంది.
- source_word: וְדַעַת דְּרָכֶיךָ
  choice: నీ మార్గాలను తెలుసుకోవాలని
  rationale: దַּעַת ఇక్కడ దేవుని మార్గాల గురించిన జ్ఞానాన్ని సూచిస్తుంది. తెలుగులో ‘నీ మార్గాల జ్ఞానాన్ని’ కంటే క్రియారూపమైన ‘నీ మార్గాలను తెలుసుకోవాలని’ సహజంగా ఉండి మూలార్థాన్ని నిలుపుతుంది. וְ ను ప్రత్యేక కారణార్థక పదంగా విస్తరించకుండా వాక్యసంధానంగా ప్రతిబింబించాం.
- source_word: לֹא חָפָצְנוּ
  choice: మేము కోరము
  rationale: חפץ కోరిక, ఇష్టం లేదా ఆనందాన్ని సూచించగలదు. ఇక్కడ దేవుని మార్గాలను తెలుసుకోవడానికి వారు ఉద్దేశపూర్వకంగా నిరాకరించడాన్ని ‘కోరము’ స్పష్టంగా, అతిశయింపకుండా తెలియజేస్తుంది.
theological_decisions:
- issue: దుష్టులు దేవునితో పలికే మాటను ఎలా అందించాలి
  choice: ‘మా నుండి తొలగిపో’ అనే ప్రత్యక్ష ఆజ్ఞను నిలిపాం
  alternative: ‘మమ్మల్ని ఒంటరిగా వదిలేయి’ వంటి పరోక్ష లేదా వ్యవహారిక వ్యాఖ్యానం
  rationale: హీబ్రూ పాఠం దేవునికి నేరుగా పలికిన కఠిన ఆజ్ఞను ఇస్తుంది. దాన్ని మృదువుచేయకుండా ఉంచడం మానవ తిరుగుబాటులోని వేదాంతపరమైన తీవ్రతను కాపాడుతుంది.
- issue: וְ అనే సంధానానికి కారణార్థాన్ని ఇవ్వాలా
  choice: ప్రత్యేకంగా ‘ఎందుకంటే’ అని చేర్చకుండా రెండు వాక్యభాగాలను వరుసగా ఉంచాం
  alternative: ‘ఎందుకంటే నీ మార్గాల జ్ఞానాన్ని మేము కోరము’
  rationale: సందర్భంలో కారణ సంబంధం సాధ్యమైనా, మూలంలోని וְ సాధారణ సంధానమే; కారణార్థాన్ని తప్పనిసరిగా నిర్ణయించకుండా అసలు పాఠంలోని సంబంధ విస్తృతిని కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయితే దైవసంబోధనలోని గంభీరతను నిలుపుతూ అనువదించాం. ఏకవచన సంబోధన ‘నీ’ మూలంలోని రెండవ పురుష ఏకవచనాన్ని ప్రతిబింబిస్తుంది.
