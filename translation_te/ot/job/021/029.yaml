  text: Have you not asked those who travel the road[b][a], and do you not recognize their signs?
translation:
  language: te
  text: దారిన వెళ్లేవారిని[a] మీరు అడగలేదా? వారి సూచనలను[b] మీరు గుర్తించలేదా?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ప్రయాణికులను,’ ‘దారిన పోయేవారిని.’
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘వారి గుర్తులను,’ ‘వారి ఆనవాళ్లను.’ ఈ మాట ప్రయాణికుల అనుభవం ద్వారా తెలిసే ఆధారాలు లేదా సంకేతాలను సూచిస్తుండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: అడగలేదా?
  rationale: అంగీకారాన్ని ఆశించే అలంకారప్రశ్న భావాన్ని, మందలింపు స్వరాన్ని సహజమైన తెలుగు ప్రశ్నారూపంలో నిలుపుతుంది.
- source_word: שְׁאֶלְתֶּם
  choice: అడగలేదా
  rationale: ‘అడుగు/విచారించు’ అనే మూలభావానికి సాధారణ ఆధునిక తెలుగులో సహజమైన రూపం.
- source_word: עֹבְרֵי דָרֶךְ
  choice: దారిన వెళ్లేవారిని
  rationale: అక్షరార్థంగా ‘దారిలో పోయేవారు’; ప్రయాణికులను సూచించే హీబ్రూ కృదంత భావాన్ని స్పష్టంగా, సహజంగా నిలుపుతుంది.
- source_word: וְאֹתֹתָם
  choice: వారి సూచనలను
  rationale: אוֹת అనే పదానికి ‘సూచన, గుర్తు’ అనే అర్థాలు ఉన్నాయి. సందర్భంలో ప్రయాణికులకు తెలిసిన ఆధారాలు లేదా సంకేతాలు ఉద్దేశించబడి ఉండవచ్చు; ‘సూచనలు’ ఆ భావాన్ని తెలుగులో సహజంగా ఉంచుతుంది.
- source_word: לֹא תְנַכֵּרוּ
  choice: మీరు గుర్తించలేదా
  rationale: పియేల్ రూపంలోని ‘గుర్తించు/అంగీకరించు’ భావంలో అత్యంత నేరుగా సరిపోయే తెలుగు పదప్రయోగం; రెండవ అలంకారప్రశ్నను కూడా కాపాడుతుంది.
