  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే ప్రశ్నారూపం వాడబడింది. మూలంలోని రెండు అలంకారప్రశ్నలు, ‘సూచనలు/గుర్తులు’ అనే భావంలోని అనిశ్చితి నిలుపబడ్డాయి.
