translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన పశుపోషణ పదజాలం వాడబడింది. యోబు 21 సందర్భంలో దుష్టుల సమృద్ధిని వర్ణిస్తున్నందున, ఏకవచన స్వామ్యప్రత్యయాన్ని సందర్భానుగుణ సమూహార్థక ‘వారి’గా అనువదించాం. క్లిష్టమైన יַגְעִל భావాన్ని అతిగా నిర్దిష్టం చేయకుండా పాదసూచికలో ప్రత్యామ్నాయాలు ఇచ్చాం.
