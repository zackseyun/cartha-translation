language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: שׁוֹר֣/וֹ עִ֭בַּר וְ/לֹ֣א יַגְעִ֑ל תְּפַלֵּ֥ט פָּ֝רָת֗/וֹ וְ/לֹ֣א תְשַׁכֵּֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/010.yaml
  text: His bull breeds and does not fail[a]; his cow calves and does not miscarry.
translation:
  language: te
  text: వారి ఎద్దు సంభోగం ఫలిస్తుంది[a]; వారి ఆవు దూడను కంటుంది, దాన్ని కోల్పోదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘విసర్జించదు’ లేదా ‘ఫలించకుండా చేయదు.’ ఇక్కడి హీబ్రూ క్రియ అర్థం క్లిష్టమైనది. సమాంతర వాక్యాన్ని బట్టి, ఎద్దు సంభోగం ఫలించకుండా పోదనే భావాన్ని ప్రధాన పాఠంలో ఇచ్చాం.
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוֹרוֹ
  choice: వారి ఎద్దు
  rationale: పశువుల సంతానోత్పత్తి సందర్భంలో שׁוֹר మగ పశువును సూచిస్తుంది; ఆధునిక తెలుగులో ‘ఎద్దు’ సహజమైన పదం.
- source_word: עִבַּר
  choice: జతకట్టి
  rationale: ఇక్కడ עבר పశువుల సంభోగం ద్వారా గర్భధారణ కలిగించే భావంలో ఉంది. ‘జతకట్టి’ ఆ చర్యను సహజంగా తెలుపుతుంది; దాని సఫలతను తరువాతి క్రియ తెలియజేస్తుంది.
- source_word: וְלֹא יַגְעִל
  choice: విఫలం కాదు
  rationale: ఈ సందర్భంలో געל హిఫీల్ రూపం అర్థపరంగా క్లిష్టమైనది. సమాంతర వాక్య నిర్మాణం ప్రకారం సంభోగం ఫలించకుండా పోదనే భావాన్ని ‘విఫలం కాదు’ తెలియజేస్తుంది; పదానికి సాధ్యమైన ఇతర భావాలను పాదసూచికలో నిలిపాం.
- source_word: תְּפַלֵּט
  choice: దూడను కంటుంది
  rationale: פלט పియేల్ ఇక్కడ పిల్లను ప్రసవించడాన్ని సూచిస్తుంది. ఆవు సందర్భంలో ‘దూడను కంటుంది’ స్పష్టమైన, సహజమైన తెలుగు.
- source_word: פָּרָתוֹ
  choice: వారి ఆవు
  rationale: פָּרָהకు సాధారణ సమానార్థకం ‘ఆవు’; చిన్న వయసు ఆడ పశువు అనే భావం మూలంలో తప్పనిసరి కాదు.
- source_word: וְלֹא תְשַׁכֵּל
  choice: గర్భం పోగొట్టుకోదు
  rationale: שׁכל పియేల్ సంతానాన్ని కోల్పోవడం లేదా పిల్లలు లేకుండా చేయబడడం అనే భావాన్ని ఇస్తుంది. ప్రసవ సందర్భంలో ‘గర్భం పోగొట్టుకోదు’ సహజంగా గర్భస్రావం జరగదనే అర్థాన్ని వ్యక్తం చేస్తుంది.
