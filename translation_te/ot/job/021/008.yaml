  yaml_path: translation/ot/job/021/008.yaml
  text: Their offspring are established before them[a], with them, and their descendants before their eyes.
translation:
  language: te
  text: వారి సంతానం వారి ఎదుట, వారితోపాటు స్థిరంగా ఉంటుంది[a]; వారి వంశస్థులు వారి కళ్లముందు ఉంటారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారి సంతానం వారి ఎదుట, వారితోపాటు క్షేమంగా ఉంటుంది; వారి వంశస్థులు వారి కళ్లముందు ఉంటారు.”
    reason: నָכוֹן అనే పదానికి ‘స్థిరంగా’తో పాటు ‘క్షేమంగా/సురక్షితంగా’ అనే సందర్భానుకూల అర్థం కూడా సాధ్యమని తెలియజేయడానికి; עִמָּם (‘వారితోపాటు’)ను కూడా కాపాడటానికి.
lexical_decisions:
- source_word: זַרְעָם
  choice: వారి సంతానం
  rationale: זֶרַע ఇక్కడ సమష్టిగా సంతానాన్ని సూచిస్తుంది. ‘సంతానం’ ఆధునిక తెలుగులో సహజంగా ఉండి, చిన్న పిల్లలకు మాత్రమే అర్థాన్ని పరిమితం చేయదు.
- source_word: נָכוֹן
  choice: స్థిరంగా ఉంటుంది
  rationale: ఈ నిష్క్రియాత్మక స్థితివాచక రూపం స్థాపించబడి ఉండటం, నిలకడగా లేదా క్షేమంగా ఉండటం అనే భావాలను కలిగి ఉంది. ‘స్థిరంగా ఉంటుంది’ మూలంలోని స్థితి భావాన్ని కాపాడుతుంది.
- source_word: לִפְנֵיהֶם
  choice: వారి ఎదుట
  rationale: ఇది మూలంలోని ‘వారి ముందు/ఎదుట’ అనే దృశ్యరూపాన్ని నిలుపుతూ, వారు తమ సంతానం వర్ధిల్లడాన్ని ప్రత్యక్షంగా చూస్తారనే సందర్భ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: עִמָּם
  choice: వారితోపాటు
  rationale: עִם యొక్క సాధారణ అర్థం ‘తో’. ‘వారితోపాటు’ అనేది సంతానం వారి సమక్షంలోనే కాక వారితో కలిసి ఉందనే ప్రత్యేక ఉద్ఘాటనను నిలుపుతుంది.
- source_word: וְצֶאֱצָאֵיהֶם
  choice: వారి వంశస్థులు
  rationale: צֶאֱצָאִים సంతతి లేదా వంశస్థులను సూచిస్తుంది. మొదటి సమష్టి పదమైన ‘సంతానం’తో భేదాన్ని ఉంచుతూ సమాంతరతను కాపాడేందుకు ‘వంశస్థులు’ ఎంచుకోబడింది.
- source_word: לְעֵינֵיהֶם
  choice: వారి కళ్లముందు
  rationale: ఇది ప్రత్యక్షంగా చూడటాన్ని సూచించే సజీవమైన హీబ్రూ నుడికారాన్ని, అలాగే ‘వారి ఎదుట’తో ఉన్న సమాంతరతను నిలుపుతుంది.
