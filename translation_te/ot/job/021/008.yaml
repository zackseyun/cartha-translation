translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. హీబ్రూ సమాంతరతను నిలుపుతూ, తెలుగులో అసహజంగా అనిపించకుండా రెండు భాగాలుగా అర్ధవిరామంతో అమర్చబడింది. ప్రధాన పాఠంలో [a] సూచిక చేర్చబడింది.
