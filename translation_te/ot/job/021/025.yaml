translation:
  language: te
  text: మరొకడు చేదు నిండిన మనసుతో చనిపోతాడు; మేలును అతడు రుచి చూడనేలేదు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మరి ఇతడు చేదు మనసుతో చనిపోతాడు; మేలును తినలేదు.” జీవితంలోని మేలును అనుభవించడాన్ని హెబ్రీ భాష ‘తినడం’ అనే చిత్రంతో వ్యక్తపరుస్తోంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/זֶה
  choice: మరొకడు
  rationale: అక్షరార్థంగా ‘మరి ఇతడు’ అయినా, 24వ వచనంలోని వ్యక్తితో ఉన్న వ్యత్యాసాన్ని సహజమైన తెలుగులో స్పష్టంగా చూపించడానికి ‘మరొకడు’ అని అనువదించాం.
- source_word: יָמוּת
  choice: చనిపోతాడు
  rationale: ఇక్కడి అసంపూర్ణ క్రియ నిర్దిష్టమైన భవిష్యద్వాణికన్నా సాధారణంగా సంభవించే పరిస్థితిని వర్ణిస్తోంది; అందువల్ల తెలుగు సాధారణ వర్తమాన రూపం అనుకూలంగా ఉంది.
- source_word: בְּ/נֶפֶשׁ מָרָה
  choice: చేదు నిండిన మనసుతో
  rationale: נֶפֶשׁ מָרָה వ్యక్తి అంతరంగంలోని తీవ్రమైన చేదును సూచిస్తుంది. ‘చేదు నిండిన మనసుతో’ అనే రూపం ఆ చిత్రాన్ని నిలుపుతూ ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: וְ/לֹא אָכַל
  choice: రుచి చూడనేలేదు
  rationale: אָכַל అక్షరార్థంగా ‘తిన్నాడు’; ఇక్కడ మేలులో పాలుపొందడం లేదా దాన్ని అనుభవించడం అనే భావంలో ఉంది. ‘రుచి చూడనేలేదు’ వినియోగ చిత్రాన్ని కొంత నిలుపుతూ సహజమైన తెలుగులో సంపూర్ణ నిరాకరణను తెలియజేస్తుంది.
- source_word: בַּ/טּוֹבָה
  choice: మేలును
  rationale: טוֹבָה మేలు, శ్రేయస్సు, సుఖసంపద వంటి విస్తృత భావాలను కలిగి ఉంది. ‘మేలు’ ఆ ఉద్దేశపూర్వక విస్తృతిని నిలుపుతుంది; ‘సంపద’ వంటి పదం అర్థాన్ని అనవసరంగా కుదిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనా గౌరవప్రదమైన కవితాత్మక శైలి వాడబడింది. ‘చేదు’, ‘రుచి చూడడం’ అనే పరస్పర చిత్రాలు మూలంలోని అంతరంగ వేదనను, తినడం ద్వారా మేలును అనుభవించే రూపకాన్ని నిలుపుతున్నాయి.
