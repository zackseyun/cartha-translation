source:
  edition: WLC
  text: כִּ֤י מַה חֶפְצ֣/וֹ בְּ/בֵית֣/וֹ אַחֲרָ֑י/ו וּ/מִסְפַּ֖ר חֳדָשָׁ֣י/ו חֻצָּֽצוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/021.yaml
  text: For what does he care about his house after him[c][b][a], when the number of his months is cut off?
translation:
  language: te
  text: ఎందుకంటే, అతని నెలల సంఖ్య ముగిసినప్పుడు[c], తన తరువాత తన ఇంటి సంగతి అతనికి ఏమి ఆసక్తి ఉంటుంది?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తన తరువాత తన ఇంటిలో అతనికి ఏమి ఇష్టం ఉంటుంది?”
    reason: lexical_alternative
  - marker: c
    text: లేదా, “అతని నెలల సంఖ్య నిర్ణయించబడినప్పుడు/కేటాయించబడినప్పుడు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందున్న వాదనకు కారణాన్ని లేదా వివరణను పరిచయం చేస్తుంది.
- source_word: מַה
  choice: ఏమి
  rationale: ఆసక్తి లేదనే భావాన్ని అలంకారిక ప్రశ్న రూపంలో వ్యక్తం చేసే ప్రశ్నార్థక సర్వనామం.
- source_word: חֶפְצוֹ
  choice: అతనికి ఏమి ఆసక్తి ఉంటుంది
  rationale: חֵפֶץ అనే పదానికి ఇష్టం, ఆనందం, కోరిక, ఆసక్తి అనే అర్థాలు ఉన్నాయి. ఈ సందర్భంలో సహజమైన తెలుగులో అలంకారిక ప్రశ్న బలాన్ని ‘ఆసక్తి’ స్పష్టంగా అందిస్తుంది; ‘ఇష్టం/ఆనందం’ అనే మరింత శాబ్దిక ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: בְּבֵיתוֹ
  choice: తన ఇంటి గురించి
  rationale: ב అనే విభక్తి ఇక్కడ ఆసక్తి లేదా ఇష్టానికి సంబంధించిన విషయాన్ని సూచిస్తుంది. בַּיִת యొక్క ప్రాథమిక అర్థమైన ‘ఇల్లు’ను ప్రధాన పాఠంలో నిలిపి, ‘ఇంటి వారు/కుటుంబం’ అనే విస్తృత భావాన్ని పాదసూచికలో తెలిపాం.
- source_word: אַחֲרָיו
  choice: తన తరువాత ఉండే
  rationale: అక్షరార్థంగా ‘అతని తరువాత’ అని ఉండే మాటను సహజమైన తెలుగులో అందిస్తూ, అది మరణాన్నే తప్పనిసరిగా స్పష్టీకరిస్తుందనే నిర్ణయాన్ని ప్రధాన పాఠంలో చేర్చలేదు.
- source_word: וּמִסְפַּר חֳדָשָׁיו
  choice: అతని నెలల సంఖ్య
  rationale: మూలంలోని నిర్దిష్టమైన ‘నెలలు’ అనే జీవనకాల వ్యక్తీకరణను సాధారణీకరించకుండా నిలిపాం.
- source_word: חֻצָּצוּ
  choice: ముగిసిపోయినప్పుడు
  rationale: నిష్క్రియారూప క్రియ ఇక్కడ జీవితకాలం అంతానికి రావడాన్ని సూచిస్తుంది. తెలుగులో ‘నెలల సంఖ్య తెగిపోయినప్పుడు’ కంటే ‘ముగిసిపోయినప్పుడు’ సహజం; ‘నిర్ణయించబడినప్పుడు/కేటాయించబడినప్పుడు’ అనే సాధ్యమైన అర్థాన్ని పాదసూచికలో భద్రపరిచాం.
