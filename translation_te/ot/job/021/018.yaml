    text: లేదా “తుపాను దొంగిలించుకుపోయే పొట్టులా,” లేదా “తుపాను లాక్కుపోయే పొట్టులా.” హీబ్రూ క్రియకు అక్షరార్థంగా “దొంగిలించు” అనే అర్థం ఉంది; ఇక్కడ అది అకస్మాత్తుగా తీసుకుపోవడాన్ని కవితాత్మకంగా సూచిస్తుంది.
    reason: lexical_alternative
