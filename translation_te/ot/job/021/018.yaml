  text: May they be like straw before the wind[a], and like chaff that a storm carries away.
translation:
  language: te
  text: 'వారు గాలి ముందు ఎండుగడ్డిలా,

    తుపాను ఎత్తుకుపోయే పొట్టులా ఉండుగాక.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “తుపాను దొంగిలించుకుపోయే పొట్టులా,” లేదా “తుపాను లాక్కుపోయే పొట్టులా.” హీబ్రూ క్రియకు అక్షరార్థంగా “దొంగిలించు” అనే అర్థం ఉంది; ఇక్కడ అది అకస్మాత్తుగా తీసుకుపోవడాన్ని కవితాత్మకంగా సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִהְיוּ
  choice: కావాలి
  rationale: ఈ సందర్భంలో అసంపూర్ణ క్రియకు కోరికను లేదా తగిన గతి పట్ల వక్త ఆకాంక్షను సూచించే భావం ఉంది. ‘కావాలి’ దానిని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: כְּתֶבֶן
  choice: గడ్డిలా
  rationale: תבן ధాన్యం నుంచి మిగిలే ఎండిన కాండాలు లేదా గడ్డిని సూచిస్తుంది. గాలికి కొట్టుకుపోయే తేలికైన వ్యవసాయ అవశేషం అనే కవితాత్మక దృశ్యాన్ని ‘గడ్డి’ స్పష్టంగా అందిస్తుంది.
- source_word: לִפְנֵי רוּחַ
  choice: గాలి ముందు
  rationale: గాలి బలానికి ఎదురుగా ఉండి దాని చేత తరిమివేయబడే దృశ్యాన్ని హీబ్రూ పదబంధానికి దగ్గరగా నిలుపుతుంది.
- source_word: וּכְמֹץ
  choice: పొట్టులా
  rationale: מֹץ ధాన్యాన్ని వేరు చేసినప్పుడు మిగిలే తేలికైన పొట్టును సూచిస్తుంది. ‘పొట్టు’ సాధారణ తెలుగు పాఠకులకు సహజంగా అర్థమవుతుంది.
- source_word: גְּנָבַתּוּ
  choice: ఎత్తుకుపోయే
  rationale: גנב యొక్క మూలార్థం ‘దొంగిలించు’; ఇక్కడ తుపాను పొట్టును అకస్మాత్తుగా పట్టుకొని తీసుకుపోయే కవితాత్మక భావం ఉంది. ‘ఎత్తుకుపోయే’ సహజంగా ఉండి ఆ అకస్మాత్తు తొలగింపును తెలియజేస్తుంది; అక్షరార్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: סוּפָה
  choice: తుపాను
  rationale: סוּפָה బలమైన తుపాను లేదా పెనుగాలిని సూచిస్తుంది. ‘తుపాను’ నిర్దిష్టంగా సుడిగాలికే పరిమితం కాకుండా మూలపద విస్తృతిని కాపాడుతుంది.
