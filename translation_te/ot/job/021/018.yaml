translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యేలా కవితాత్మక సమాంతర నిర్మాణాన్ని నిలిపాం. ‘గాలి ముందు’ అనే మూలభాషా దృశ్యాన్ని కాపాడి, ‘ఎత్తుకుపోయే’ ద్వారా సహజమైన తెలుగు ప్రవాహాన్ని సాధించాం.
