source:
  edition: WLC
  text: מַדּ֣וּעַ רְשָׁעִ֣ים יִחְי֑וּ עָ֝תְק֗וּ גַּם גָּ֥בְרוּ חָֽיִל־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/007.yaml
  text: Why do the wicked live on[a], grow old, and even become mighty in wealth?
translation:
  language: te
  text: దుష్టులు ఎందుకు జీవిస్తూనే ఉండి, వృద్ధులై, సంపదలో కూడా బలవంతులు అవుతారు[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “శక్తిలో బలవంతులు అవుతారు.” హీబ్రూ חָיִל అనే పదం సంపద, వనరులు, బలం లేదా సైనిక శక్తిని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַדּוּעַ
  choice: ఎందుకు
  rationale: యోబు నిరసనతో అడిగే ప్రశ్నను అదనపు వివరణ లేకుండా సహజంగా, నేరుగా వ్యక్తం చేస్తుంది.
- source_word: רְשָׁעִים
  choice: దుష్టులు
  rationale: జ్ఞానసాహిత్యంలో నైతికంగా చెడ్డవారిని సూచించే ప్రామాణికమైన, సహజమైన తెలుగు పదం.
- source_word: יִחְיוּ
  choice: బ్రతుకుతూనే ఉంటారు
  rationale: శిక్షకు లోనవుతారని ఆశించే దుష్టులు ఇంకా జీవిస్తూ ఉండడంపై ఉన్న ప్రశ్నార్థక నిరసనను, అసంపూర్ణ క్రియలోని కొనసాగింపు భావాన్ని తెలియజేస్తుంది.
- source_word: עָתְקוּ
  choice: వృద్ధులై
  rationale: ఈ సందర్భంలో దీర్ఘాయుష్షుతో వయస్సు మళ్లడమే సంభావ్య భావం; తెలుగు వాక్యప్రవాహంలో సంక్షిప్తంగా, సహజంగా ఉంటుంది.
- source_word: גַּם
  choice: మరింత
  rationale: 'చివరి అంశంలో ఉన్న ఉద్ధృతిని తెలుగులో సహజంగా చూపిస్తుంది: వారు కేవలం జీవించి వృద్ధులు కావడమే కాక, అధిక బలం లేదా సంపదను పొందుతున్నారు.'
- source_word: גָּבְרוּ
  choice: బలవంతులవుతారు
  rationale: బలం, సామర్థ్యం లేదా ప్రభావంలో పెరగడాన్ని వ్యక్తం చేస్తుంది; తరువాతి חָיִל పదంతో కలిపి అభివృద్ధి భావాన్ని ఇస్తుంది.
- source_word: חָיִל
  choice: సంపదలో
  rationale: దుష్టుల క్షేమాభివృద్ధి అనే సందర్భంలో సంపద లేదా వనరులు ప్రధాన భావంగా సరిపోతాయి; బలం లేదా శక్తి అనే విస్తృత ప్రత్యామ్నాయం పాదసూచికలో నిలుపబడింది.
theological_decisions:
- issue: దుష్టుల దీర్ఘాయుష్షు మరియు అభివృద్ధి దేవుని న్యాయంతో కలిగించే ఉద్రిక్తత
  choice: ప్రశ్నను సమాధానం లేదా ధార్మిక వివరణ జోడించకుండా యోబు నిరసనగానే ఉంచడం
  alternative: వారి అభివృద్ధి తాత్కాలికమని లేదా దేవుని అనుమతివల్లనేనని వాక్యంలో స్పష్టీకరించడం
  rationale: హీబ్రూ మూలం ఆ వివరణలను ఈ వచనంలో ఇవ్వదు; జ్ఞానసాహిత్యంలో ఉద్దేశపూర్వకంగా నిలిచే ధార్మిక ఉద్రిక్తతను అనువాదం పరిష్కరించకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, యోబు ప్రశ్నలోని నిరసనాత్మక స్వరాన్ని నిలుపుతూ గౌరవప్రదమైన శైలిని ఉపయోగించాం. మూలంలోని ఒకే ప్రశ్నను తెలుగులో సహజ పఠనార్థం రెండు వాక్యభాగాలుగా మలిచాం; అర్థసంబంధం యథాతథంగా ఉంది.
