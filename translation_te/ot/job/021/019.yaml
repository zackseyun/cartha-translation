id: JOB.21.19
reference: Job 21:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אֱל֗וֹהַּ יִצְפֹּן לְ/בָנָ֥י/ו אוֹנ֑/וֹ יְשַׁלֵּ֖ם אֵלָ֣י/ו וְ/יֵדָֽע־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/019.yaml
  text: God stores up his iniquity for his sons? Let him repay it to the man himself[c][b][a], so that he may know it.
translation:
  language: te
  text: దేవుడు అతని దోషాన్ని అతని కుమారుల కోసం భద్రపరుస్తాడా?[a][b][c] ఆయన అతని దోషానికి ప్రతిఫలాన్ని అతనికే చెల్లించుగాక; అప్పుడు అతడు దానిని తెలుసుకుంటాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, మరింత అక్షరార్థంగా: “దేవుడు అతని దోషాన్ని అతని కుమారుల కోసం భద్రపరుస్తాడు; ఆయన అతనికే ప్రతిఫలం చెల్లించుగాక, అప్పుడు అతడు తెలుసుకుంటాడు.” హీబ్రూను ప్రశ్నార్థకం లేకుండా అనువదించవచ్చు; అయితే సందర్భం దీన్ని యోబు సవాలు చేస్తున్న అభిప్రాయంగా వినడానికి అనుకూలంగా ఉంది.'
    reason: alternative_reading
  - marker: b
    text: “కుమారులు” అనేది హీబ్రూ పదప్రయోగం; సందర్భంలో అది ఒక వ్యక్తి వంశస్థులను మరింత విస్తృతంగా సూచించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: “దోషం”గా అనువదించిన హీబ్రూ పదం సందర్భానుసారం “దుష్టత్వం,” “కష్టం,” లేదా దోషం వల్ల కలిగే “శిక్ష” అనే భావాలను కూడా ఇవ్వగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלוֹהַּ
  choice: దేవుడు
  rationale: యోబు గ్రంథంలో దేవుణ్ణి సూచించే సాధారణ ఏకవచన పదం; అదనపు భావాన్ని చేర్చకుండా సహజంగా అనువదిస్తుంది.
- source_word: יִצְפֹּן
  choice: దాచిపెడతాడా
  rationale: צפן అంటే దాచిపెట్టడం లేదా భవిష్యత్తుకోసం నిల్వచేయడం. ఇక్కడ తరువాతి తరానికి ఉంచే భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לְבָנָיו
  choice: అతని కుమారుల కోసం
  rationale: హీబ్రూలో స్పష్టంగా పుంలింగ బహువచనం ‘కుమారులు’ ఉంది; సందర్భంలో వంశస్థులు అనే విస్తృత భావం సాధ్యమే.
- source_word: אוֹנוֹ
  choice: అతని దోషాన్ని
  rationale: אָוֶן దోషం, దుష్టత్వం, కష్టం లేదా దాని పరిణామాన్ని సూచించగలదు. మూలంలోని ఉద్దేశపూర్వక భావవిస్తృతిని ‘దోషం’ కొంతవరకు నిలుపుతుంది; ‘శిక్ష’ అని అనువదిస్తే పరిణామ భావాన్ని ముందుగానే నిర్ణయించినట్టవుతుంది.
- source_word: יְשַׁלֵּם
  choice: తిరిగి చెల్లించాలి
  rationale: Piel రూపం ప్రతిఫలం ఇవ్వడం లేదా తిరిగి చెల్లించడం అనే భావం ఇస్తుంది. సందర్భంలో ఇది యోబు చేసే సవాలుతో కూడిన కోరికగా తీసుకోబడింది.
- source_word: אֵלָיו
  choice: అతనికే
  rationale: సర్వనామం ఆ దుష్టుణ్ణే సూచిస్తుంది; ‘కే’ అనేది కుమారులతో ఉన్న వ్యత్యాసాన్ని సంక్షిప్తంగా స్పష్టం చేస్తుంది.
- source_word: וְיֵדָע
  choice: అప్పుడు అతడు దాన్ని తెలుసుకుంటాడు
  rationale: ידע యొక్క ప్రాథమిక అర్థం ‘తెలుసుకోవడం.’ ఇక్కడ ప్రతిఫలాన్ని స్వయంగా అనుభవించి తెలుసుకునే ఫలిత భావం ఉంది.
theological_decisions:
- issue: మొదటి ఉపవాక్యం యోబు అంగీకరించే ప్రకటననా, లేక అతడు సవాలు చేసే అభిప్రాయమా?
  choice: దాన్ని అలంకారప్రశ్నగా చూపించి, తరువాతి మాటను యోబు కోరే ప్రత్యక్ష ప్రతిఫలంగా అనువదించడం.
  alternative: 'మొత్తం వాక్యాన్ని సాధారణ ప్రకటనగా అనువదించడం: ‘దేవుడు అతని దోషాన్ని అతని కుమారుల కోసం దాచిపెడతాడు; అతనికి తిరిగి చెల్లిస్తాడు, అతడు తెలుసుకుంటాడు.’'
  rationale: యోబు 21లోని వాదన ప్రకారం, దుష్టుని పిల్లలపై పరిణామాలు రావడం దుష్టునికే న్యాయం జరిగినట్టుకాదని యోబు సవాలు చేస్తున్నాడు. హీబ్రూ స్వతహాగా ప్రశ్నార్థక రూపాన్ని తప్పనిసరి చేయకపోయినా, సందర్భం ఈ పఠనానికి బలమిస్తుంది; ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు స్పష్టంగా ఉండే శైలి. ‘అతనికే’ ద్వారా కుమారులు–దుష్టుడు అనే వ్యత్యాసాన్ని సహజంగా ఉద్ఘాటించాం. మూలంలోని ప్రశ్నార్థక అనిశ్చితి మరియు אָוֶן పదంలోని భావవిస్తృతిని పాదటిప్పణుల్లో భద్రపరిచాం.
