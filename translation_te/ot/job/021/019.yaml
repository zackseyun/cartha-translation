  naturalness: “దాచిపెడతాడా?” సహజంగానే ఉంది, కానీ “భద్రపరుస్తాడా?” ఇక్కడ భవిష్యత్తు కోసం ఉంచడం అనే సందర్భార్థాన్ని మరింత స్పష్టంగా ఇస్తుంది. “ఆయన అతనికే ప్రతిఫలం చెల్లించుగాక” అనేది గంభీరమైన ఆధునిక ప్రామాణిక తెలుగులో జుస్సివ్ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
  terminology: אָוֶן‌కు “దోషం” సాధ్యమైన, ఉద్దేశపూర్వకంగా విస్తృతార్థాన్ని నిలిపే ఎంపిక. అయితే దానిని నేరుగా “చెల్లించడం” కన్నా “దోషానికి ప్రతిఫలం చెల్లించడం”గా చెప్పడం తెలుగులో అవసరమైన అర్థస్పష్టతను ఇస్తుంది; పాదటిప్పణి ఇతర సాధ్యార్థాలను తగినట్లే భద్రపరుస్తుంది.
