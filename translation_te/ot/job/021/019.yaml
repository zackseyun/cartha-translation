  rationale: హీబ్రూ వాక్యంలోని వాక్చాతుర్య ప్రశ్నను మరియు జుస్సివ్ ప్రతిపాదనను నిలిపి, తెలుగులో అసహజమైన ‘దోషాన్ని తిరిగి చెల్లించడం’ను ‘దోషానికి ప్రతిఫలాన్ని చెల్లించడం’గా సరిచేశాం. ఇది ప్రతిఫల భావాన్ని స్పష్టం చేస్తుంది, కానీ אָוֶן‌కు కేవలం ‘శిక్ష’ అనే ఒకే అర్థాన్ని ప్రధాన పాఠ్యంలో రుద్దదు. ప్రశ్నార్థక పఠనం వివాదాస్పదమైనందున ప్రత్యామ్నాయ పఠనం పాదటిప్పణిలో ఉంచబడింది.
