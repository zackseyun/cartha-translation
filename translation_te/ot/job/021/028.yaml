  text: כִּ֤י תֹֽאמְר֗וּ אַיֵּ֥ה בֵית נָדִ֑יב וְ֝/אַיֵּ֗ה אֹ֤הֶל מִשְׁכְּנ֬וֹת רְשָׁעִֽים־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/028.yaml
  text: For you say[a], ‘Where is the house of the noble man, and where is the tent[b], the dwelling place of the wicked?’
translation:
  language: te
  text: 'ఎందుకంటే మీరు ఇలా అంటారు[a]: “ఆ ఉన్నతుని ఇల్లు ఎక్కడ ఉంది? దుష్టులు నివసించే గుడారం[b] ఎక్కడ ఉంది?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ఉన్నతుడు” అనే పదాన్ని “ప్రമുഖుడు” లేదా “రాజకుమారుడు” అని కూడా అనువదించవచ్చు. హీబ్రూ పదం נָדִיב ఇక్కడ కేవలం ఉదారుణ్ణి కాక, సమాజంలో ఉన్నత స్థానం గల వ్యక్తిని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో ఈ పదబంధం సంక్షిప్తంగా, అక్షరార్థంగా “గుడారం—దుష్టుల నివాసాలు” అని ఉంది. దీనిని “దుష్టులు నివసించే గుడారం” అని లేదా గుడారాన్నే దుష్టుల నివాసంగా గుర్తించే సమానాధికార నిర్మాణంగా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి వాదనతో ఈ మాటను అనుసంధానించే వివరణాత్మక భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: תֹאמְרוּ
  choice: మీరు ఇలా అంటారు
  rationale: అసంపూర్ణ క్రియారూపాన్ని సందర్భానుసారంగా ప్రత్యర్థులు సాధారణంగా చేసే వ్యాఖ్యగా వర్తమాన కాలంలో అనువదించాం.
- source_word: אַיֵּה
  choice: ఎక్కడ ఉంది?
  rationale: హీబ్రూ ప్రశ్నార్థక భావాన్ని సహజమైన తెలుగు వాక్యనిర్మాణంలో నిలుపుతుంది.
- source_word: בֵית
  choice: ఇల్లు
  rationale: నివాసం లేదా ఆస్తి అనే విస్తృత సందర్భార్థానికి వీలుంచుతూ మూలపదపు ప్రాథమిక ప్రతిరూపాన్ని కాపాడుతుంది.
- source_word: נָדִיב
  choice: ప్రభువు
  rationale: ఇక్కడ ఉదారుడు అనే గుణార్థం కంటే ఉన్నత సామాజిక స్థానం గల ప్రముఖుడు లేదా అధిపతి అనే భావం సందర్భానికి సరిపోతుంది.
- source_word: אֹהֶל
  choice: గుడారం
  rationale: స్థిర నివాసానికి రూపకంగా వాడి ఉండవచ్చుగానీ, హీబ్రూ పదం సూచించే గుడారం చిత్రాన్ని నిలుపుతుంది.
- source_word: מִשְׁכְּנוֹת רְשָׁעִים
  choice: దుష్టులు నివసించిన
  rationale: మూలంలోని సంక్షిప్తమైన ‘దుష్టుల నివాసాలు’ అనే నిర్మాణాన్ని గుడారంతో సహజంగా అనుసంధానిస్తుంది; బహువచన రూపంలోని ఒత్తిడిని పాదసూచికలో తెలియజేశాం.
