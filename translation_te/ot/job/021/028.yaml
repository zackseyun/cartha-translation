translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలిని వాడాం. ‘ప్రభువు’ ఇక్కడ దేవుని బిరుదుగా కాక సామాజికంగా ఉన్నత స్థానం గల వ్యక్తిని సూచిస్తుంది; ఆ సంభావ్య అస్పష్టతను పాదసూచిక వివరిస్తుంది.
