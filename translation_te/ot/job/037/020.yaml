source:
  edition: WLC
  text: הַֽ/יְסֻפַּר ל֭/וֹ כִּ֣י אֲדַבֵּ֑ר אִֽם אָ֥מַר אִ֝֗ישׁ כִּ֣י יְבֻלָּֽע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/037/020.yaml
  text: Should it be told to him that I would speak? If a man speaks[c][b][a], surely he would be swallowed up.
translation:
  language: te
  text: నేను మాట్లాడతానని ఆయనకు[a] చెప్పాలా? ఒక మనిషి[b] మాట్లాడితే,[c] అతడు తప్పకుండా మింగివేయబడతాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా ‘అతనికి’; సందర్భంలో ఇది దేవుణ్ణి సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో ‘ఒక మనిషి’; ఇక్కడ సాధారణార్థంలో ‘ఎవరైనా’ లేదా ‘ఒక వ్యక్తి’ అని కూడా అర్థం కావచ్చు.
    reason: lexical_alternative
  - marker: c
    text: 'ఈ వచనంలోని హీబ్రూ వాక్యనిర్మాణం క్లిష్టమైనది. మరో సాధ్యమైన అనువాదం: ‘నేను మాట్లాడుతున్నానని ఆయనకు చెప్పాలా? లేక తాను మింగివేయబడతానని ఒక మనిషి చెప్పాలా?’'
    reason: alternative_reading
lexical_decisions:
- source_word: הֲיְסֻפַּר
  choice: చెప్పాలా
  rationale: ప్రశ్నార్థక הֲతో కూడిన ספר క్రియ యొక్క కర్మణి రూపం, ఈ విషయం ఆయనకు తెలియజేయడం తగునా అనే అలంకారప్రశ్నను వ్యక్తం చేస్తుంది. తెలుగులో సహజంగా ఉండేందుకు ‘చెప్పాలా’ అని అనువదించాం.
- source_word: לוֹ
  choice: ఆయనకు
  rationale: సందర్భంలో ఇది దేవుణ్ణి సూచిస్తుంది. హీబ్రూలో గౌరవార్థక పెద్ద అక్షరాల భేదం లేకపోయినా, ఆధునిక ప్రామాణిక తెలుగులో దేవుణ్ణి సూచించే సహజ గౌరవ ఏకవచనంగా ‘ఆయనకు’ వాడాం.
- source_word: כִּי אֲדַבֵּר
  choice: నేను మాట్లాడతానని
  rationale: כִּי ఇక్కడ చెప్పబడే విషయాన్ని పరిచయం చేస్తుంది; అసంపూర్ణ క్రియ contemplated/future speech భావాన్ని ఇస్తుంది. తెలుగు వాక్యనిర్మాణంలో ‘అని’ ఆ విషయవాక్యాన్ని సహజంగా కలుపుతుంది.
- source_word: אִם אָמַר אִישׁ
  choice: ఒక మనిషి మాట్లాడితే
  rationale: אִם యొక్క షరతు భావాన్నీ, אִישׁ యొక్క ఏకవచన పురుష రూపాన్నీ నిలిపాం. אָמַר‌కు సాధారణంగా ‘అన్నాడు’ అనే అర్థం ఉన్నా, ఇక్కడ మాట పలకడాన్ని సూచించేలా ‘మాట్లాడితే’ సహజంగా ఉంది.
- source_word: כִּי יְבֻלָּע
  choice: అతడు తప్పకుండా మింగివేయబడతాడు
  rationale: בלע కర్మణి రూపంలోని బలమైన ‘మింగివేయబడటం/నశింపజేయబడటం’ చిత్రాన్ని నిలిపాం. ఈ పఠనంలో כִּי ఇచ్చే నిశ్చయ భావాన్ని ‘తప్పకుండా’ తెలియజేస్తుంది.
theological_decisions:
- issue: לוֹ అనే సర్వనామం ఎవరిని సూచిస్తుంది
  choice: ప్రధాన పాఠంలో దేవుణ్ణి సూచించే ‘ఆయనకు’
  alternative: ‘అతనికి’
  rationale: సందర్భం దేవుణ్ణి సూచిస్తుంది; అయితే హీబ్రూ రూపంలో గౌరవసూచక భేదం లేదు. అందువల్ల మూలరూప సమాచారాన్ని పాదసూచికలో ఉంచాం.
- issue: אִישׁ యొక్క లింగం మరియు సాధారణార్థం
  choice: ‘ఒక మనిషి’
  alternative: ‘ఎవరైనా’ లేదా ‘ఒక వ్యక్తి’
  rationale: మూలంలోని ఏకవచన పురుష నామవాచక ఆకారాన్ని ప్రధాన పాఠంలో నిలిపి, అది సందర్భంలో సాధారణంగా ఎవరినైనా సూచించవచ్చని పాదసూచికలో తెలిపాం.
- issue: వాక్యంలోని క్లిష్టమైన వాక్యనిర్మాణం
  choice: రెండో భాగాన్ని షరతు మరియు ఫలితంగా అనువదించడం
  alternative: ‘నేను మాట్లాడుతున్నానని ఆయనకు చెప్పాలా? లేక తాను మింగివేయబడతానని ఒక మనిషి చెప్పాలా?’
  rationale: హీబ్రూ వాక్యం సంక్షిప్తంగా ఉండి, כִּי మరియు אִם సంబంధం అనేక విధాలుగా అర్థమవుతుంది. ప్రధాన పాఠం సాధ్యమైన సూటి పఠనాన్ని ఇస్తుంది; ప్రత్యామ్నాయ నిర్మాణాన్ని పాదసూచికలో భద్రపరుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరమైన అలంకారప్రశ్న శైలిని వాడాం. మూలంలోని ‘మింగివేయబడటం’ అనే బలమైన రూపకాన్ని అలాగే నిలిపాం; క్లిష్టమైన వాక్యనిర్మాణాన్ని అతిగా సవరించకుండా ప్రత్యామ్నాయ పఠనాన్ని పాదసూచికలో ఇచ్చాం.
