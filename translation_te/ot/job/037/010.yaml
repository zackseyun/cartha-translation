  yaml_path: translation/ot/job/037/010.yaml
  text: From the breath of God ice is given[b][a], and the broad expanse of waters is frozen solid.
translation:
  language: te
  text: దేవుని ఊపిరివల్ల మంచు ఏర్పడుతుంది[a]; జలాల విశాల ఉపరితలం గడ్డకట్టిపోతుంది[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దేవుని ఊపిరినుండి మంచు ఏర్పడుతుంది.” హీబ్రూ ఉపసర్గ మూలాన్ని (“నుండి”) లేదా సాధనాన్ని (“వల్ల”) సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “జలాల విశాల విస్తీర్ణం గట్టిపడుతుంది.” హీబ్రూ కవితాత్మక ప్రయోగం జలాల విశాల ఉపరితలం ఘనీభవించడాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנִּשְׁמַת
  choice: ఊపిరివల్ల
  rationale: נִשְׁמָה అనే పదంలోని స్పష్టమైన ‘ఊపిరి’ చిత్రాన్ని నిలుపుతూ, מִן ఇక్కడ మూలాన్ని లేదా సాధనాన్ని సూచించగలదనే సందిగ్ధతను పాదసూచికలో తెలిపాం.
- source_word: אֵל
  choice: దేవుని
  rationale: אֵל సాధారణ దైవబిరుదు; సందర్భంలో ‘సర్వశక్తిమంతుడు’ వంటి విస్తరణ అవసరం లేదు.
- source_word: יִתֶּן
  choice: ఏర్పడుతుంది
  rationale: נתן అక్షరార్థంగా ‘ఇస్తాడు/ఇవ్వబడుతుంది.’ అయితే తెలుగులో ‘మంచు ఇవ్వబడుతుంది’ అసహజంగా ఉండటంతో, దైవకార్యాన్ని సందర్భానుగుణంగా సహజంగా తెలిపే ‘ఏర్పడుతుంది’ ఎంచుకున్నాం.
- source_word: קָרַח
  choice: మంచు
  rationale: కָרַח గడ్డకట్టిన నీటిని, అంటే iceను సూచిస్తుంది; తెలుగు సాధారణ వాడుకలో ‘మంచు’ సహజమైన పదం.
- source_word: וְרֹחַב מַיִם
  choice: జలాల విశాల ఉపరితలం
  rationale: רֹחַב అంటే వెడల్పు లేదా విశాల విస్తీర్ణం. నీటితో కూడిన ఈ సందర్భంలో జలాల విస్తరించిన ఉపరితలాన్ని సూచించేలా అనువదించాం.
- source_word: בְּמוּצָק
  choice: గడ్డకట్టిపోతుంది
  rationale: מוּצָק పోతపోసి గట్టిపరచబడినది లేదా దృఢమైనది అనే భావాన్ని ఇస్తుంది; వాతావరణ సంబంధ సందర్భంలో జలాలు ఘనీభవించడాన్ని స్పష్టంగా తెలియజేస్తుంది.
