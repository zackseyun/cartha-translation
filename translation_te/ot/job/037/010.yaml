translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కవితా శైలిని అనుసరించాం. ‘ఊపిరి’ అనే స్పష్టమైన రూపకాన్ని నిలిపి, అసహజమైన అక్షరానువాదం ‘మంచు ఇవ్వబడుతుంది’కు బదులు సందర్భానుగుణమైన ‘మంచు ఏర్పడుతుంది’ వాడాం. అన్ని పాదసూచిక గుర్తులు ప్రధాన వచనంలో ఉన్నాయి.
