source:
  edition: WLC
  text: הַאֲזִ֣ינָ/ה זֹּ֣את אִיּ֑וֹב עֲ֝מֹ֗ד וְ/הִתְבּוֹנֵ֤ן נִפְלְא֬וֹת אֵֽל׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/037/014.yaml
  text: Listen to this[a], Job[c][b]; stand still and consider the wonders of God.
translation:
  language: te
  text: యోబూ, ఇది విను; నిలబడు, దేవుని అద్భుతాలను పరిశీలించు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַאֲזִינָה
  choice: ఆలకించు
  rationale: ఈ ఆజ్ఞారూపం శ్రద్ధగా చెవియొగ్గి వినడాన్ని సూచిస్తుంది. ‘ఆలకించు’ ఆధునిక గౌరవప్రదమైన తెలుగులో ఆ భావాన్ని సంక్షిప్తంగా అందిస్తుంది.
- source_word: זֹּאת
  choice: దీనిని
  rationale: స్త్రీలింగ ఏకవచన సూచన సర్వనామం సమీపంలో చెప్పిన లేదా చెప్పబోయే విషయాన్ని సూచిస్తుంది; తెలుగులో ‘దీనిని ఆలకించు’ సహజంగా ఉంది.
- source_word: אִיּוֹב
  choice: యోబూ
  rationale: ప్రత్యక్ష సంబోధన కావడంతో ప్రామాణిక తెలుగు నామరూపమైన ‘యోబు’ను సంబోధనలో ‘యోబూ’గా ఇచ్చాం.
- source_word: עֲמֹד
  choice: నిలిచి
  rationale: మూల ఆజ్ఞకు ప్రాథమిక అర్థం ‘నిలువు’. తరువాతి ఆజ్ఞతో సహజంగా అనుసంధానించేందుకు తెలుగులో ‘నిలిచి’ అని ఇచ్చాం; ‘కదలకుండా’ అనే భావాన్ని అదనంగా చేర్చలేదు.
- source_word: וְהִתְבּוֹנֵן
  choice: శ్రద్ధగా ఆలోచించు
  rationale: ఈ రూపం జాగ్రత్తగా పరిశీలించడం, మనస్సుపెట్టి తలంచడం అనే భావాన్ని కలిగిస్తుంది. ‘శ్రద్ధగా ఆలోచించు’ సాధారణ పాఠకులకు స్పష్టంగా ఉండి ఆ లోతును నిలుపుతుంది.
- source_word: נִפְלְאוֹת
  choice: అద్భుత కార్యాలను
  rationale: ఈ బహువచన నామవాచకం ఆశ్చర్యకరమైన విషయాలు లేదా కార్యాలను సూచించగలదు. సందర్భంలో దేవుడు చేసిన కార్యాల భావం బలంగా ఉన్నందున ‘అద్భుత కార్యాలు’ సహజమైన ఎంపిక; పదంలోని కార్యార్థాన్ని అతిగా నిర్దిష్టం చేయదు.
- source_word: אֵל
  choice: దేవుని
  rationale: ఇక్కడ אֵל దేవుణ్ణి సూచించే సాధారణ దైవపదం. ‘దేవుడు’ సూటిగా అర్థాన్ని అందిస్తుంది; ‘సర్వశక్తిమంతుడు’ వంటి అదనపు విశేషణాన్ని చేర్చదు.
theological_decisions:
- issue: אֵל అనే దైవపదం అనువాదం
  choice: దేవుడు
  alternative: శక్తిమంతుడైన దేవుడు
  rationale: ఈ సందర్భంలో మూలపదం దేవుని శక్తిని ప్రత్యేక విశేషణంగా విస్తరించమని తప్పనిసరి చేయదు. ‘దేవుడు’ మూలంలోని సరళ సూచనను కాపాడి, అదనపు సిద్ధాంతార్థాన్ని దిగుమతి చేయదు.
- issue: נִפְלְאוֹת ను అద్భుతాలు లేదా అద్భుత కార్యాలు అని ఇవ్వడం
  choice: అద్భుత కార్యాలు
  alternative: అద్భుతాలు
  rationale: హీబ్రూ పదం ఆశ్చర్యకరమైన దైవకార్యాలను సూచించగలదు. ఈ సందర్భంలో ‘కార్యాలు’ భావం సహజమైనప్పటికీ, దానిని నిర్దిష్ట రకమైన అద్భుత సంఘటనలకు మాత్రమే పరిమితం చేయకుండా సాధారణంగా ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, స్పష్టమైన ఆజ్ఞారూప వాక్యం. ‘ఆలకించు’ కొద్దిగా ఉన్నత శైలికి చెందినదైనా సాధారణంగా అర్థమయ్యే పదం; పద్యంలోని గంభీరతను నిలుపుతుంది. మూలంలో నిజమైన పాఠభేదం లేదా పాఠకునికి అవసరమైన గణనీయమైన అనిశ్చితి లేకపోవడంతో పాదటిప్పణులు చేర్చలేదు.
