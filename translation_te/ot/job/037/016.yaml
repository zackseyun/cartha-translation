  yaml_path: translation/ot/job/037/016.yaml
  text: Do you know about the balancing of the clouds[a], the wonders of one perfect in knowledge?
translation:
  language: te
  text: మేఘాలు సమతుల్యంగా నిలిచి ఉండే తీరు[a] గురించి—జ్ఞానంలో సంపూర్ణుడైనవాని అద్భుతాల గురించి—నీకు తెలుసా?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మేఘాలు విస్తరించే తీరు.’ ఇక్కడి హీబ్రూ పదం అరుదైనది; దాని ఖచ్చితమైన భావం అనిశ్చితం. ఇది మేఘాలు ఆకాశంలో విస్తరించడం లేదా నిలిచి ఉండడాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתֵדַע
  choice: నీకు తెలుసా?
  rationale: ప్రశ్నార్థక הֲతో కూడిన ידע క్రియ యోబును ఉద్దేశించిన అలంకారిక ప్రశ్నను ఏర్పరుస్తుంది. ‘నీకు తెలుసా?’ అనేది సూటిగా, సహజంగా ఉండి, మూలంలోని సవాలును అదనపు వ్యాఖ్యానం లేకుండా నిలుపుతుంది.
- source_word: עַל
  choice: గురించి
  rationale: ఇక్కడ עַל స్థలసంబంధాన్ని కాక, తెలుసుకోవడానికి సంబంధించిన అంశాన్ని పరిచయం చేస్తుంది. అందువల్ల ఆధునిక తెలుగులో ‘గురించి’ సహజమైన ఎంపిక.
- source_word: מִפְלְשֵׂי עָב
  choice: మేఘాలు సమతూగి నిలిచే తీరు
  rationale: అరుదైన מִפְלְשֵׂי పదం ఖచ్చితార్థం అనిశ్చితం. సందర్భంలో ఆకాశంలో మేఘాలు సమతూగి లేదా నిలిచి ఉండే అద్భుతమైన విధానాన్ని ఇది సూచించవచ్చు. ‘సమతూగి నిలిచే తీరు’ తెలుగు పాఠకునికి ఆ భావాన్ని సహజంగా తెలియజేస్తుంది; ‘విస్తరించే తీరు’ అనే సాధ్యమైన అర్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: מִפְלְאוֹת
  choice: అద్భుతాలు
  rationale: פלא నామరూపం అసాధారణమైన కార్యాలను లేదా ప్రకృతి దృశ్యాలను సూచిస్తుంది. ‘అద్భుతాలు’ సంక్షిప్తంగా, గౌరవప్రదంగా ఉంది.
- source_word: תְּמִים
  choice: సంపూర్ణుడైన
  rationale: ఈ సందర్భంలో תְּמִים నైతిక నిర్దోషిత్వం కంటే సంపూర్ణతను సూచిస్తుంది. పురుష ఏకవచన రూపమైన ‘సంపూర్ణుడైన’ మూలంలోని వ్యక్తిగత సూచనను నిలుపుతుంది.
- source_word: דֵּעִים
  choice: జ్ఞానంలో
  rationale: బహువచన రూపం జ్ఞాన సమృద్ధిని లేదా సంపూర్ణతను సూచించవచ్చు. తెలుగులో ‘జ్ఞానంలో సంపూర్ణుడు’ సహజంగా ఉండి ఆ భావాన్ని కాపాడుతుంది.
theological_decisions:
- issue: ‘జ్ఞానంలో సంపూర్ణుడైనవాడు’ ఎవరు?
  choice: పేరును చేర్చకుండా మూలంలోని పరోక్ష సూచనను నిలుపడం
  alternative: ‘జ్ఞానంలో సంపూర్ణుడైన దేవుడు’ అని స్పష్టీకరించడం
  rationale: వాతావరణం, సృష్టిపై దేవుని ఆధిపత్యాన్ని వర్ణించే సందర్భం ఈ మాట దేవునినే సూచిస్తుందని బలంగా తెలియజేస్తుంది. అయినప్పటికీ హీబ్రూ పాఠం ఇక్కడ ‘దేవుడు’ అనే నామాన్ని ప్రత్యక్షంగా చేర్చదు; కాబట్టి అనువాదం కూడా సందర్భమే సూచకుణ్ణి గుర్తించేలా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ప్రశ్నారూపం వాడబడింది. మూలంలోని ఒకే అలంకారిక ప్రశ్నను నిలుపుతూ, రెండు ‘గురించి’ పదబంధాలను దీర్ఘ విరామచిహ్నాలతో స్పష్టంగా అమర్చాం.
