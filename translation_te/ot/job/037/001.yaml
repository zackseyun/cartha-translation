    rationale: The Hebrew depicts the heart’s abrupt movement or displacement from its place; it does not specify a fall. ‘ఎగిరిపోతుంది’ avoids adding that implication.
  - severity: low
    issue: ‘దీనికి కూడా’ is less natural than a causal expression in this context.
    rationale: The preposition לְ may express the occasion or cause of the reaction. ‘దీని వలన కూడా’ communicates this naturally while retaining the connective force of אַף.
