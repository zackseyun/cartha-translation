  text: At this also my heart trembles and leaps from its place[a][b].
translation:
  language: te
  text: దీని వలన కూడా నా హృదయం వణుకుతోంది[a]; అది తన స్థానం నుండి ఎగిరిపోతుంది[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘కంపిస్తోంది’; హీబ్రూ క్రియ భయం, విస్మయం లేదా కలవరంతో వణకడాన్ని సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘తన స్థానం నుండి దూకుతోంది’; హృదయం అకస్మాత్తుగా తన చోటు నుండి కదిలినట్లు హీబ్రూ వాక్యం సజీవంగా చిత్రిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף לְזֹאת
  choice: దీనికి కూడా
  rationale: אַף యొక్క అనుసంధానార్థక బలాన్ని ‘కూడా’ నిలుపుతుంది; לְזֹאתను సందర్భంలోని ఘటనకు ప్రతిస్పందనగా ‘దీనికి’ అని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: יֶחֱרַד
  choice: వణుకుతోంది
  rationale: భయం, విస్మయం లేదా కలవరంతో కలిగే కంపనాన్ని సూచించే חרד యొక్క విశాల భావాన్ని, కారణాన్ని మరీ నిర్దిష్టం చేయకుండా నిలుపుతుంది.
- source_word: לִבִּי
  choice: నా హృదయం
  rationale: మూలంలోని శరీరాత్మకమైన, అంతరంగ సంబంధమైన రూపకాన్ని నేరుగా నిలుపుతుంది.
- source_word: וְיִתַּר
  choice: ఎగిరిపడుతోంది
  rationale: ఈ కఠినమైన క్రియ సందర్భంలో హృదయం అకస్మాత్తుగా బలంగా కదిలినట్లు చిత్రిస్తుంది; ‘ఎగిరిపడుతోంది’ ఆ సజీవ రూపకాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: מִמְּקוֹמוֹ
  choice: తన స్థానం నుండి
  rationale: ప్రత్యయం హృదయాన్నే సూచిస్తున్నదని స్పష్టం చేస్తూ, అది తన సాధారణ స్థానం నుండి కదిలినట్లున్న మూల చిత్రణను కాపాడుతుంది.
