id: JOB.37.4
reference: Job 37:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אַחֲרָ֤י/ו יִשְׁאַג ק֗וֹל יַ֭רְעֵם בְּ/ק֣וֹל גְּאוֹנ֑/וֹ וְ/לֹ֥א יְ֝עַקְּבֵ֗/ם כִּֽי יִשָּׁמַ֥ע קוֹלֽ/וֹ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/037/004.yaml
  text: After it[a], a voice roars; he thunders with his majestic voice[c][b], and he does not hold them back when his voice is heard.
translation:
  language: te
  text: దాని తరువాత[a] ఒక స్వరం గర్జిస్తుంది; ఆయన తన మహిమాన్వితమైన స్వరంతో ఉరుముతాడు. ఆయన స్వరం వినబడినప్పుడు[b], ఆయన వాటిని నిలువరించడు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఆ తరువాత ఒక స్వరం గర్జిస్తుంది.’ హెబ్రీ పదాన్ని క్రియావిశేషణంగా కూడా గ్రహించవచ్చు; అయితే సందర్భం మునుపటి వచనంలోని మెరుపును సూచించే అవకాశం ఎక్కువ.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘ఎందుకంటే ఆయన స్వరం వినబడుతుంది.’ హెబ్రీ సంధాయక పదానికి కాలార్థంతో పాటు కారణార్థం కూడా సాధ్యమే.
    reason: lexical_alternative
  - marker: c
    text: లేదా ‘ఆయన వాటిని ఆలస్యం చేయడు.’ ‘వాటిని’ అనేది ఉరుముతో విడుదలయ్యే పిడుగులను లేదా తుఫాను ప్రభావాలను సూచించే అవకాశం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרָיו
  choice: దాని తరువాత
  rationale: మునుపటి వచనంలోని మెరుపును సూచించే సంబంధాన్ని నిలుపుతుంది. హెబ్రీలో ‘ఆ తరువాత’ అనే క్రియావిశేషణ భావం కూడా సాధ్యమే; దానిని పాదటిప్పణిలో ఇచ్చాం.
- source_word: יִשְׁאַג קוֹל
  choice: ఒక స్వరం గర్జిస్తుంది
  rationale: שׁאג అనే క్రియలో సింహగర్జన వంటి బలమైన శబ్దచిత్రం ఉంది. קוֹל‌ను కర్తగా ఉంచి, తరువాత వచ్చే స్వామ్యప్రత్యయాన్ని ముందుగానే చేర్చకుండా మూలంలోని చిత్రణను నిలిపాం.
- source_word: יַרְעֵם
  choice: ఆయన ... ఉరుముతాడు
  rationale: రעם హిఫీల్ రూపం ఇక్కడ దేవుడు ఉరుమును కలిగించడాన్ని సూచిస్తుంది. ‘ఉరుముతాడు’ సహజమైన ఆధునిక తెలుగు ప్రయోగంగా దైవ కార్యసాధకత్వాన్ని నిలుపుతుంది.
- source_word: בְּקוֹל גְּאוֹנוֹ
  choice: తన మహిమాన్వితమైన స్వరంతో
  rationale: גָּאוֹן ఇక్కడ మహిమ, ఔన్నత్యం, వైభవం అనే భావాన్ని ఇస్తుంది. ‘మహిమాన్వితమైన’ అనేది గంభీరతను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וְלֹא יְעַקְּבֵם
  choice: ఆయన వాటిని నిలువరించడు
  rationale: עקב పియేల్ రూపానికి వెనక్కి పట్టడం, అడ్డుకోవడం లేదా ఆలస్యం చేయడం అనే భావాలు ఉండవచ్చు. బహువచన ప్రత్యయం దేనిని సూచిస్తుందో మూలంలో స్పష్టంగా చెప్పబడలేదు; అందుచేత ‘వాటిని’ అని అస్పష్టతను నిలిపాం.
- source_word: כִּי יִשָּׁמַע קוֹלוֹ
  choice: ఆయన స్వరం వినబడినప్పుడు
  rationale: כִּי ఇక్కడ కాలార్థకంగానో కారణార్థకంగానో అర్థమవవచ్చు. తుఫాను సంఘటనల క్రమంలో కాలార్థం సహజంగా సరిపోతుంది; కారణార్థాన్ని పాదటిప్పణిలో నిలిపాం.
theological_decisions:
- issue: గర్జించే, ఉరుమే కర్త ఎవరు?
  choice: కర్త దేవుడు; ఉరుములో ఆయన స్వరం వ్యక్తమవుతోంది.
  alternative: కర్తను వ్యక్తిరహితమైన తుఫాను లేదా శబ్దంగా గ్రహించవచ్చు.
  rationale: సమీప సందర్భంలో ఎలీహూ దేవుని తుఫాను కార్యాన్ని వర్ణిస్తున్నాడు; ‘తన మహిమాన్వితమైన స్వరం’ అనే పదబంధం వ్యక్తిగత దైవ కర్తను బలపరుస్తుంది. అయినా మూలంలో ఈ వాక్యంలో ‘దేవుడు’ అనే నామం లేకపోవడంతో అనువాదంలో దానిని అదనంగా చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గంభీరంగా ఉండే శైలిని వాడాం. ‘గర్జిస్తుంది’, ‘ఉరుముతాడు’, ‘మహిమాన్వితమైన’ అనే పదాలు కవితాత్మక బలాన్ని నిలుపుతాయి; అస్పష్టమైన బహువచన సూచనను వివరణతో భర్తీ చేయకుండా మూలంలాగే ఉంచాం.
