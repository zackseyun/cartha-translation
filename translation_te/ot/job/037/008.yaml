    rationale: אָרֶב refers to a place of lurking or concealment, not necessarily a geological cave. A broader Telugu expression better preserves the source’s range.
  - severity: low
    issue: “నివాస స్థలాల్లో” is orthographically and stylistically less smooth than “నివాసస్థలాల్లో.”
    rationale: The compound form is standard and reads more naturally in modern Telugu.
