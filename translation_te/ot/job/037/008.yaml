translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కావ్యవర్ణన. మూలంలోని ఏకవచన సామూహిక సూచనను ‘అడవి జంతువు’గా, నివాసాల బహువచనాన్ని ‘స్థలాల్లో’గా నిలిపింది.
