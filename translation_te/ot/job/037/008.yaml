  text: Then the wild animal enters its lair[a], and remains in its dens.
translation:
  language: te
  text: అప్పుడు అడవి జంతువు తన దాగుడు చోటికి చేరి, తన నివాసస్థలాల్లో ఉంటుంది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתָּבֹא
  choice: అప్పుడు ... వెళ్లి
  rationale: בוא అనే క్రియ యొక్క వయ్యిక్తోల్ రూపం కావ్యవర్ణనను ముందుకు నడిపిస్తుంది. తెలుగు వాక్యంలో ‘అప్పుడు’ క్రమాన్ని, ‘వెళ్లి’ ఆశ్రయంలోకి ప్రవేశించడాన్ని సహజంగా తెలియజేస్తాయి.
- source_word: חַיָּה
  choice: అడవి జంతువు
  rationale: חַיָּה సాధారణంగా జంతువును లేదా అడవి మృగాన్ని సూచించగలదు. ఇక్కడ నిర్దిష్ట జాతి కాకుండా వాతావరణం నుంచి ఆశ్రయం పొందే వన్యజీవి సాధారణార్థం ఉద్దేశించబడింది.
- source_word: בְמוֹ אָרֶב
  choice: తన గుహలోకి
  rationale: אָרֶב పొంచి ఉండే లేదా దాగి ఉండే స్థలాన్ని సూచిస్తుంది. సందర్భంలో జంతువు చేరే రహస్య ఆశ్రయాన్ని ‘గుహ’ సహజంగా వ్యక్తపరుస్తుంది; ‘లోకి’ ప్రవేశ భావాన్ని స్పష్టం చేస్తుంది.
- source_word: וּבִמְעוֹנֹתֶיהָ
  choice: తన నివాస స్థలాల్లో
  rationale: מְעוֹנוֹתֶיהָ బహువచనంలో ‘దాని నివాస స్థలాలు’ అని అర్థం. మూలంలోని బహువచనాన్ని నిలుపుతూ, జంతువుకు సంబంధించిన ఆశ్రయాలను విస్తృతంగా సూచించేందుకు ఈ పదబంధం ఎంచుకోబడింది.
- source_word: תִשְׁכֹּן
  choice: ఉండిపోతుంది
  rationale: שכן నివసించడం లేదా స్థిరంగా ఉండడాన్ని సూచిస్తుంది. ఆశ్రయంలోకి వెళ్లిన తరువాత అక్కడే కొనసాగి ఉండే భావాన్ని ఆధునిక తెలుగులో ‘ఉండిపోతుంది’ స్పష్టంగా అందిస్తుంది.
