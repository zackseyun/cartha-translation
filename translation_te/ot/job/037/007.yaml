source:
  edition: WLC
  text: בְּ/יַד כָּל אָדָ֥ם יַחְתּ֑וֹם לָ֝/דַ֗עַת כָּל אַנְשֵׁ֥י מַעֲשֵֽׂ/הוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/037/007.yaml
  text: He seals the hand of every man[b][a], so that all men may know his work.
translation:
  language: te
  text: మనుషులందరూ ఆయన కార్యాన్ని తెలుసుకునేలా ఆయన ప్రతి మనిషి చేతికి ముద్ర వేస్తాడు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆయన ప్రతి మనిషి చేతిని ముద్రించి మూసివేస్తాడు.’ ఈ హీబ్రూ ప్రయోగం దేవుడు మనుషుల సాధారణ పనిని నిలిపివేస్తాడని సూచిస్తుండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיַד
  choice: చేతిని
  rationale: בְּ ఉపసర్గను తెలుగులో యాంత్రికంగా ‘చేతిలో’ అని కాకుండా, חתם క్రియతో కూడిన క్లిష్టమైన ప్రయోగంలో సహజ కర్మరూపంగా ‘చేతిని’ అని ఇచ్చాం.
- source_word: כָּל אָדָם
  choice: ప్రతి మనిషి
  rationale: אָדָם ఇక్కడ ఏకవచన సామాన్యార్థక పదం; ‘ప్రతి మనిషి’ దాని వ్యక్తిగతమైనప్పటికీ సమస్త మానవాళిని సూచించే బలాన్ని నిలుపుతుంది.
- source_word: יַחְתּוֹם
  choice: ముద్రవేస్తాడు
  rationale: חתם యొక్క ప్రాథమిక రూపకార్థమైన ‘ముద్ర వేయడం’ను నిలిపి, సందర్భం సూచించే పనిని నిలిపివేయడం అనే భావాన్ని పాదసూచికలో వివరించాం.
- source_word: לָדַעַת
  choice: తెలుసుకునేలా
  rationale: ל తో కూడిన క్రియానామం ఇక్కడ ఉద్దేశం లేదా ఫలితాన్ని సూచిస్తుంది; ‘తెలుసుకునేలా’ రెండింటి మధ్యనున్న స్వల్ప అస్పష్టతను కాపాడుతుంది.
- source_word: כָּל אַנְשֵׁי
  choice: మనుషులందరూ
  rationale: ‘అందరు మనుషులు’ అనే సమష్టి భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: מַעֲשֵׂהוּ
  choice: ఆయన కార్యాన్ని
  rationale: ఏకవచన నామవాచకాన్నీ 3వ పురుష ఏకవచన ప్రత్యయాన్నీ నిలిపి, దేవుని క్రియాశీల కార్యాన్ని సూచించే గౌరవప్రదమైన పదాన్ని ఎంచుకున్నాం.
theological_decisions:
- issue: ‘ముద్రవేస్తాడు’, ‘ఆయన కార్యం’లోని మూడవ పురుష ఏకవచన సూచన
  choice: రెండూ దేవుణ్ణే సూచిస్తాయి.
  alternative: తుఫాను లేదా శీతకాలమే కార్యసాధకంగా సూచించబడవచ్చు.
  rationale: ఎలీహు ప్రసంగంలోని సమీప సందర్భం వాతావరణం, సృష్టిపై దేవుని ఆధిపత్యాన్ని వివరిస్తుంది; అందువల్ల దేవుడే అత్యంత సహజమైన పూర్వపదం.
- issue: చేతికి ముద్రవేయడం అనే రూపకం
  choice: రూపకాన్ని ప్రధాన పాఠ్యంలో నిలిపాం.
  alternative: ‘ప్రతి మనిషి పనిని ఆపుతాడు’ అని అర్థాన్ని నేరుగా విప్పి చెప్పడం.
  rationale: హీబ్రూ ప్రయోగం క్లిష్టమైనది. సందర్భానుసారం సాధారణ మానవ శ్రమను నిలిపివేయడం కావచ్చు; అయితే ప్రధాన పాఠ్యంలో ఆ వ్యాఖ్యానాన్ని ఖచ్చితార్థంగా మార్చకుండా పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. మూలంలోని ‘ముద్రవేయడం’ రూపకాన్ని కాపాడుతూ, దాని సంభావ్య సందర్భార్థాన్ని పాదసూచికలో తెలిపాం.
