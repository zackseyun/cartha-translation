revisions:
- from: ఆయన ప్రతి మనిషి చేతిని ముద్రవేస్తాడు[a]; మనుషులందరూ ఆయన కార్యాన్ని తెలుసుకునేలా అలా చేస్తాడు.
  to: మనుషులందరూ ఆయన కార్యాన్ని తెలుసుకునేలా ఆయన ప్రతి మనిషి చేతికి ముద్ర వేస్తాడు[a].
  rationale: The revision retains the Hebrew’s intentionally difficult image rather than replacing it with the interpretation “stops work.” It uses idiomatic Telugu for affixing a seal, removes the redundant phrase in the purpose clause, and keeps the interpretive possibility confined to the anchored footnote.
