    reason: lexical_alternative
  revision_rationale: The revision retains the Hebrew’s intentionally difficult image rather than replacing it with the interpretation “stops work.” It uses idiomatic Telugu for affixing a seal, removes the redundant phrase in the purpose clause, and keeps the interpretive possibility confined to the anchored footnote.
