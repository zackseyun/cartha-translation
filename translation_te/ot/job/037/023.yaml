source:
  edition: WLC
  text: שַׁדַּ֣י לֹֽא מְ֭צָאנֻ/הוּ שַׂגִּיא כֹ֑חַ וּ/מִשְׁפָּ֥ט וְ/רֹב צְ֝דָקָ֗ה לֹ֣א יְעַנֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/037/023.yaml
  text: The Almighty—we cannot find him out—great in power[c][b][a]; and justice and abundant righteousness he does not afflict.
translation:
  language: te
  text: సర్వశక్తిమంతుడు—ఆయనను మనం పూర్తిగా గ్రహించలేం[a]—శక్తిలో గొప్పవాడు; న్యాయంలోను[b] అపారమైన నీతిలోను ఆయన బాధించడు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఆయనను మనం కనుగొనలేం,’ ‘ఆయనను మనం చేరుకోలేం.’
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘తీర్పులోను.’
    reason: lexical_alternative
  - marker: c
    text: చివరి భాగంలోని నిర్మాణం కష్టమైనది. దీనిని ‘న్యాయంలోను అపారమైన నీతిలోను ఆయన బాధించడు’ లేదా ‘అణచివేయడు’ అని అర్థం చేసుకోవచ్చు. మరికొందరు ‘ఆయన జవాబివ్వడు’ అని తీసుకుంటారు; అయితే అది ఈ సందర్భానికి తక్కువగా సరిపోతుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: שַׁדַּי
  choice: సర్వశక్తిమంతుడు
  rationale: యోబు గ్రంథంలో దేవునికి వాడే ఈ బిరుదు యొక్క సాధారణ భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; కేవలం ‘షద్దాయి’ అని లిప్యంతరీకరించడం కంటే పాఠకులకు అర్థం స్పష్టంగా ఉంటుంది.
- source_word: לֹא מְצָאנֻהוּ
  choice: ఆయనను మనం పూర్తిగా గ్రహించలేం
  rationale: מצא అనే క్రియ అక్షరార్థంగా ‘కనుగొను’ అయినప్పటికీ, ఇక్కడ దేవుని అందనితనం మరియు అగ్రాహ్యత సందర్భంలో ‘పూర్తిగా గ్రహించలేం’ అనే భావం సహజంగా సరిపోతుంది. ‘ఆయనను చేరుకోలేం’ అనే భావసాధ్యతను పాదటిప్పణిలో ఉంచాం.
- source_word: שַׂגִּיא כֹחַ
  choice: ఆయన శక్తిలో గొప్పవాడు
  rationale: שַׂגִּיא యొక్క ‘గొప్ప/అధికమైన’ భావాన్నీ כֹחַ యొక్క ‘శక్తి’ భావాన్నీ హెబ్రీ నిర్మాణానికి దగ్గరగా, సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: וּמִשְׁפָּט
  choice: న్యాయాన్ని
  rationale: מִשְׁפָּט కు ‘తీర్పు’ లేదా ‘న్యాయం’ అనే అర్థాలు ఉన్నాయి. నీతితో జతగా వచ్చినందున ఇక్కడ నైతిక గుణమైన ‘న్యాయం’ ప్రధాన పాఠంలో సముచితం.
- source_word: וְרֹב צְדָקָה
  choice: అపారమైన నీతిని
  rationale: רֹב సమృద్ధి లేదా విస్తారాన్ని సూచిస్తుంది; צְדָקָה నైతిక సద్వర్తనను సూచిస్తుంది. ‘అపారమైన నీతి’ ఈ రెండింటినీ సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: לֹא יְעַנֶּה
  choice: ఆయన ఉల్లంఘించడు
  rationale: Piel రూపంలోని ענה సాధారణంగా ‘బాధించు/అణచివేయు’ అనే భావం ఇస్తుంది. ఇక్కడ ‘న్యాయం’ మరియు ‘అపారమైన నీతి’ కర్మలుగా నిలిచిన వాక్యనిర్మాణంలో వాటిని ‘బాధించడు’ అనడం తెలుగులో అసహజం; ‘ఉల్లంఘించడు’ అనేది వాటికి హాని చేయడు లేదా వాటిని చెరపడు అనే సందర్భోచిత భావాన్ని అందిస్తుంది.
theological_decisions:
- issue: לֹא יְעַנֶּה అనే చివరి పదబంధాన్ని న్యాయం, నీతితో ఎలా అనుసంధానించాలి
  choice: దేవుడు న్యాయాన్నీ అపారమైన నీతినీ ఉల్లంఘించడు.
  alternative: దేవుడు ఎవరినీ బాధించడు లేదా అణచివేయడు; మరొక వ్యుత్పత్తి ప్రకారం ‘ఆయన జవాబివ్వడు.’
  rationale: హెబ్రీ పదక్రమంలో ‘న్యాయం’ మరియు ‘అపారమైన నీతి’ క్రియకు కర్మలుగా చదవవచ్చు; అందువల్ల ప్రధాన పాఠం దేవుడు వాటిని చెరపడడని చెబుతుంది. అయితే క్రియకు ఉన్న ‘బాధించు/అణచివేయు’ భావం వేరొక వాక్యనిర్మాణాన్ని అనుమతిస్తుంది; దాన్ని పాదటిప్పణిలో నిలిపి, దేవుని అగ్రాహ్యత మరియు నైతిక న్యాయం మధ్యనున్న ఉద్వేగాన్ని అతిగా పరిష్కరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. మొదటి భాగంలోని విరామాన్ని దీర్ఘవిరామంతో నిలిపి, హెబ్రీ వాక్యంలోని మహిమాన్విత ధోరణిని కాపాడాం. చివరి భాగంలోని నిజమైన వ్యాకరణ-పదార్థ సందిగ్ధతను ప్రధాన పాఠంలో సహజంగా అనువదించి పాదటిప్పణిలో ప్రత్యామ్నాయాలతో సంరక్షించాం.
