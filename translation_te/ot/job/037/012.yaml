source:
  edition: WLC
  text: וְ/ה֤וּא מְסִבּ֨וֹת מִתְהַפֵּ֣ךְ ב/תחבולת/ו לְ/פָעֳלָ֑/ם כֹּ֖ל אֲשֶׁ֥ר יְצַוֵּ֓/ם עַל פְּנֵ֖י תֵבֵ֣ל אָֽרְצָ/ה׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/037/012.yaml
  text: It turns around and around by his guidance[c][b][a], to accomplish all that he commands them over the face of the inhabited world on the earth.
translation:
  language: te
  text: అది ఆయన నడిపింపు[b] ప్రకారం చుట్టూ తిరుగుతూ దిశ మార్చుకుంటుంది[a], భూమిమీద నివాసమున్న లోకమంతటా[c] ఆయన వాటికి ఆజ్ఞాపించినదంతా అవి చేయడానికి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘వలయాలుగా తిరుగుతుంది’ లేదా ‘అటూ ఇటూ తిరుగుతుంది’; హీబ్రూ పదబంధం పదేపదే తిరుగుతూ దిశ మారే చలనాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘ఆయన దిశానిర్దేశంతో’ లేదా ‘ఆయన నైపుణ్యమైన నియంత్రణతో’.
    reason: lexical_alternative
  - marker: c
    text: హీబ్రూలో అక్షరార్థంగా ‘నివాస ప్రపంచపు ఉపరితలమంతటా, భూమివైపు’; ఇది భూమిపై ఉన్న నివాస ప్రపంచాన్ని పొరలుగల పదబంధంతో వర్ణిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּא
  choice: అది
  rationale: పుంలింగ ఏకవచన సర్వనామమైనప్పటికీ, సందర్భంలో మేఘం లేదా తుఫాను సంబంధమైన వాతావరణ ఘటనను సూచిస్తుంది. దాని ఖచ్చితమైన స్వరూపాన్ని నిర్దేశించకుండా తెలుగులో సహజమైన నపుంసక ఏకవచనాన్ని వాడాం.
- source_word: מְסִבּוֹת מִתְהַפֵּךְ
  choice: చుట్టూ తిరుగుతూ దిశ మార్చుకుంటుంది
  rationale: మొదటి పదంలోని వలయాకార లేదా పదేపదే తిరిగే చలనాన్ని, హిత్పయేల్ క్రియలోని తన దిశను మార్చుకునే భావాన్ని కలిపి వ్యక్తపరుస్తుంది; కేవలం ఒకసారి తిరగడమనే భావానికి పరిమితం చేయదు.
- source_word: בְּתַחְבֻּלֹתוֹ
  choice: ఆయన నడిపింపు ప్రకారం
  rationale: ఈ సందర్భంలో ఈ నామవాచకం నైపుణ్యమైన దిశానిర్దేశం లేదా నియంత్రణను సూచిస్తుంది. దేవుడు వాతావరణ ఘటనలను నడిపిస్తున్న భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: לְפָעֳלָם
  choice: అవి చేయడానికి
  rationale: లక్ష్యం లేదా ఫలితాన్ని సూచించే నిర్మాణాన్ని, దానిలోని బహువచన ప్రత్యయాన్ని నిలుపుతుంది.
- source_word: כֹּל אֲשֶׁר יְצַוֵּם
  choice: ఆయన వాటికి ఆజ్ఞాపించినదంతా
  rationale: צוה క్రియలోని ఆజ్ఞాపించే భావాన్నీ, మూడవ పురుష బహువచన కర్మప్రత్యయాన్నీ స్పష్టంగా నిలుపుతుంది.
- source_word: עַל־פְּנֵי תֵבֵל אָרְצָה
  choice: భూమిమీద నివాసమున్న లోకమంతటా
  rationale: תֵבֵל లోని నివాసిత ప్రపంచ భావాన్ని, אָרְצָה లోని భూమివైపు లేదా భూమిపై అనే స్థల భావాన్ని సహజమైన తెలుగులో సమన్వయపరుస్తుంది.
theological_decisions:
- issue: ఏకవచన సర్వనామం సూచించే వాతావరణ ఘటన
  choice: ఖచ్చితంగా మేఘమో మెరుపో అని చెప్పకుండా ‘అది’ అని విస్తృతంగా ఉంచడం
  alternative: ఒక మేఘరాశి, మెరుపు, లేదా తుఫాను వ్యవస్థ అని నిర్దిష్టీకరించడం
  rationale: సమీప సందర్భం మేఘాలు, మెరుపు, తుఫాను చర్యలను ప్రస్తావిస్తుంది; అయితే ఈ వచనం సూచ్యాన్ని శాస్త్రీయంగా లేదా మరీ సంకుచితంగా గుర్తించదు.
- issue: దైవ నియంత్రణను తెలిపే בְּתַחְבֻּלֹתוֹ భావం
  choice: ‘ఆయన నడిపింపు ప్రకారం’
  alternative: ‘ఆయన యోచన ప్రకారం’ లేదా ‘ఆయన నియంత్రణచేత’
  rationale: మూలపదంలోని నైపుణ్యమైన దిశానిర్దేశ భావాన్ని నిలుపుతూ, పాఠ్యంలో లేనంతగా ముందే నిర్ణయించిన ప్రణాళిక లేదా బలవంతపు నియంత్రణ అనే భావాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని ఉపయోగించాం. మూలంలోని ఏకవచన ‘అది’ మరియు తరువాతి బహువచన ‘వాటికి/అవి’ మధ్య ఉన్న ఉద్రిక్తతను తొలగించకుండా నిలిపాం; ఇది వాతావరణ ఘటనను సమష్టిగా, దాని కార్యశక్తులను బహువచనంగా సూచించే అవకాశాన్ని తెరిచి ఉంచుతుంది.
