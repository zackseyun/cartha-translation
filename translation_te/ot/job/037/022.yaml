source:
  edition: WLC
  text: מִ֭/צָּפוֹן זָהָ֣ב יֶֽאֱתֶ֑ה עַל אֱ֝ל֗וֹהַּ נ֣וֹרָא הֽוֹד־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/037/022.yaml
  text: From the north comes golden splendor; around God is awesome majesty.
translation:
  language: te
  text: ఉత్తరం నుండి బంగారు తేజస్సు[a] వస్తుంది; దేవునిపై భయభక్తులను కలిగించే మహిమ ఉంది.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'అక్షరార్థం: “బంగారం.”'
    reason: זָהָב అనే పదానికి నేర అర్థం “బంగారం”; సందర్భంలో అది బంగారు కాంతి లేదా తేజస్సును సూచించవచ్చు.
  - marker: b
    text: 'లేదా: “దేవుని చుట్టూ భయభక్తులను కలిగించే మహిమ ఉంది.”'
    reason: עַל సాధారణంగా “పై/మీద” అని అర్థం; సందర్భాన్ని బట్టి దేవునిని ఆవరించి ఉన్న మహిమ అనే భావంతో “చుట్టూ” అని కూడా అర్థం చేసుకోవచ్చు.
lexical_decisions:
- source_word: זָהָב (zāhāb)
  choice: బంగారు తేజస్సు
  rationale: ఈ పదానికి అక్షరార్థం ‘బంగారం’. ఇక్కడ ఆకాశంలో ఉత్తరం నుండి వచ్చే ప్రకాశవంతమైన దృశ్యాన్ని సూచించే సందర్భంలో, రంగు మరియు వెలుగు రెండింటినీ సహజమైన తెలుగులో తెలియజేయడానికి ‘బంగారు తేజస్సు’ అని అనువదించాం; అక్షరార్థాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: נוֹרָא (nôrāʾ)
  choice: భయభక్తులు పుట్టించే
  rationale: ఈ పదం కేవలం భయాన్నే కాక, విస్మయం మరియు భక్తిపూర్వక భయాన్ని కలిగించే గంభీరతను సూచించగలదు. ఆధునిక తెలుగులో ఆ భావవిస్తృతిని ‘భయభక్తులు పుట్టించే’ సహజంగా అందిస్తుంది.
- source_word: הוֹד (hôd)
  choice: మహిమ
  rationale: ఘనత, వైభవం, మహోన్నత కాంతి అనే భావాలను కలిగిన ఈ పదానికి సందర్భానుకూలమైన, గౌరవప్రదమైన తెలుగు పదం ‘మహిమ’.
theological_decisions:
- issue: עַל אֱלוֹהַּ అనే పదబంధంలో עַל యొక్క సంబంధార్థం
  choice: దేవుని చుట్టూ
  alternative: దేవునిపై
  rationale: עַל సాధారణంగా ‘పై/మీద’ అని అర్థమిచ్చినా, ఇక్కడ దేవునితో అనుబంధమైన లేదా ఆయనను ఆవరించిన మహిమను సూచించవచ్చు. ‘దేవునిపై మహిమ ఉంది’ అనే తెలుగు అసహజంగా, అపార్థానికి దారితీయవచ్చు; అందువల్ల సందర్భానుసారంగా ‘దేవుని చుట్టూ’ అని ఇచ్చి, మూలంలోని ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, కవితాత్మక గంభీరతను నిలుపుతూ సాధారణ పాఠకులకు స్పష్టంగా ఉండే వాక్యనిర్మాణం ఉపయోగించాం. ‘భయభక్తులు పుట్టించే’ అనే ప్రయోగం נוֹרָא లోని భయం, విస్మయం, భక్తిగౌరవం అనే మిళిత భావాన్ని కాపాడుతుంది.
