  text: From its chamber comes the storm[b][a], and from the scattering winds comes cold.
translation:
  language: te
  text: లోపలి గది నుండి తుఫాను వస్తుంది[a]; చెదరగొట్టే గాలుల నుండి చలి వస్తుంది[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దక్షిణం నుండి తుఫాను వస్తుంది.” హీబ్రూలో అక్షరార్థంగా “లోపలి గది నుండి” అని ఉంది; ఇది దక్షిణ దిక్కును లేదా దాగిన నిలయాన్ని కవితాత్మకంగా సూచిస్తూ ఉండవచ్చు.
    reason: alternative_reading
  - marker: b
    text: లేదా, “ఉత్తరం నుండి చలి వస్తుంది,” లేక “చెదరగొట్టే గాలుల నుండి చలి వస్తుంది.” ఇక్కడి హీబ్రూ పదం అరుదైనది; దాని కచ్చితమైన అర్థం అనిశ్చితం.
    reason: alternative_reading
lexical_decisions:
- source_word: מִן הַחֶדֶר
  choice: అంతర్గది నుండి
  rationale: חֶדֶר అనే పదానికి ప్రాథమికంగా ‘గది, అంతర్గది’ అనే అర్థం ఉంది. ఇక్కడ అది తుఫాను బయలుదేరే దాగిన నిలయాన్ని లేదా దిక్కును కవితాత్మకంగా సూచించవచ్చు. మూలంలోని రూపకాన్ని నిలుపుతూ ‘అంతర్గది నుండి’ అని అనువదించాం; సందర్భానుసారమైన ‘దక్షిణం నుండి’ అనే భావాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: תָּבוֹא
  choice: వస్తుంది
  rationale: בוא సాధారణంగా ‘రావడం, చేరడం’ అని అర్థం. తుఫాను కర్తగా ఉన్న ఈ వాక్యంలో ‘వస్తుంది’ సహజంగా ఉండి హీబ్రూ కవిత్వంలోని సజీవతను నిలుపుతుంది.
- source_word: סוּפָה
  choice: తుఫాను
  rationale: סוּפָה బలమైన తుపాను, పెనుగాలి లేదా సుడిగాలిని సూచించగలదు. సందర్భం ప్రత్యేకంగా సుడిగాలినే నిర్బంధించనందున విస్తృతమైన, సహజమైన ‘తుఫాను’ ఎంచుకున్నాం.
- source_word: וּמִמְּזָרִים
  choice: చెదరగొట్టే గాలుల నుండి
  rationale: מְזָרִים అరుదైన, అర్థం వివాదాస్పదమైన పదం. దాన్ని చెదరగొట్టడం లేదా విస్తరించడం అనే భావంతో సంబంధపెట్టి ‘చెదరగొట్టే గాలులు’గా అనువదించవచ్చు. ‘ఉత్తరం నుండి’ అనేది సందర్భాధారిత ప్రత్యామ్నాయం మాత్రమే కనుక పాదటిప్పణిలో ఇచ్చాం.
- source_word: קָרָה
  choice: చలి
  rationale: קָרָה చలి, గడ్డకట్టించే వాతావరణం లేదా మంచును సూచించగలదు. మూలంలోని సంక్షిప్తతను, విస్తృత భావాన్ని నిలుపడానికి ‘చలి’ ఎంచుకున్నాం.
