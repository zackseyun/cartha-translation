translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కవితా శైలిని వాడాం. మొదటి పాదంలో మూలంలోని ‘అంతర్గది’ రూపకాన్ని అలాగే నిలిపాం. రెండో పాదంలోని అరుదైన పదం సూచించే అనిశ్చితిని ప్రధాన పాఠ్యంలో అతిగా పరిష్కరించకుండా, ‘గాలులు’ అనే సందర్భోచిత పూరకంతో పాఠకులకు అర్థమయ్యేలా చేసి ప్రత్యామ్నాయాలను పాదటిప్పణిలో ఇచ్చాం.
