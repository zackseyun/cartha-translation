  text: you whose garments are hot when the earth is still because of the south wind?[a]
translation:
  language: te
  text: 'దక్షిణం నుండి భూమి ప్రశాంతంగా ఉన్నప్పుడు,

    నీ వస్త్రాలు వేడిగా ఉంటాయి కదా?[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దక్షిణ దిక్కు కారణంగా” లేదా “దక్షిణ గాలి కారణంగా.” హీబ్రూలో అక్షరార్థంగా “దక్షిణం నుండి” అని ఉంది. ఇది దక్షిణ దిక్కును సాధారణంగా సూచించవచ్చు; వాతావరణ సందర్భంలో దక్షిణ గాలిని కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: నీ ... వేడెక్కుతాయి కదా?
  rationale: ఈ సంబంధవాచక పదం సందర్భంలో యోబును ఉద్దేశించిన ప్రశ్నలో భాగం. తెలుగులో సహజమైన ప్రత్యక్ష సంబోధనగా మలిచినా, రెండవ పురుష సూచనను నిలిపాం.
- source_word: בְּגָדֶיךָ
  choice: నీ వస్త్రాలు
  rationale: בגד అంటే వస్త్రం లేదా దుస్తులు. కవితాత్మక గౌరవశైలికి సరిపోయేలా ‘వస్త్రాలు’ ఎంచుకున్నాం.
- source_word: חַמִּים
  choice: వేడెక్కుతాయి
  rationale: ఈ విశేషణం ‘వేడిగా ఉన్నాయి’ అని నేరుగా చెప్పవచ్చు; అయితే వాతావరణ ప్రభావాన్ని సహజ తెలుగులో తెలిపేందుకు ‘వేడెక్కుతాయి’ అని ఇచ్చాం.
- source_word: בְּהַשְׁקִט
  choice: నిశ్చలంగా ఉన్నప్పుడు
  rationale: שקט అంటే ప్రశాంతంగా, కదలికలేకుండా ఉండడం. ఇక్కడ בְ కాలార్థకంగా ఉండటంతో ‘ఉన్నప్పుడు’ అని అనువదించాం.
- source_word: אֶרֶץ
  choice: భూమి
  rationale: אֶרֶץకు ‘భూమి’ లేదా ‘దేశం’ అనే అర్థాలు సాధ్యం. వాతావరణ వర్ణనలో విస్తృతార్థమైన ‘భూమి’ తగినది.
- source_word: מִדָּרוֹם
  choice: దక్షిణ గాలి వీచి
  rationale: దీనికి అక్షరార్థం ‘దక్షిణం నుండి.’ సందర్భం వేడి వాతావరణానికి కారణమైన దక్షిణ గాలిని సూచించవచ్చు; తెలుగులో వాతావరణ భావం స్పష్టంగా ఉండేందుకు ‘దక్షిణ గాలి’ అని ఇచ్చాం, అక్షరార్థాన్ని పాదసూచికలో నిలిపాం.
