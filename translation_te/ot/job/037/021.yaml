  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/עַתָּ֤ה לֹ֘א רָ֤אוּ א֗וֹר בָּהִ֣יר ה֭וּא בַּ/שְּׁחָקִ֑ים וְ/ר֥וּחַ עָ֝בְרָ֗ה וַֽ/תְּטַהֲרֵֽ/ם׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/037/021.yaml
  text: And now they do not see the light[a], bright though it is in the skies[b]; but a wind passes by and clears them.
translation:
  language: te
  text: ఇప్పుడైతే, ఆకాశాల్లో అది ప్రకాశవంతంగా ఉన్నప్పటికీ, వారు వెలుగును చూడడం లేదు[a]; గాలి వీచి వెళ్లి వాటిని నిర్మలం చేస్తుంది[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారు ఆకాశాల్లో ప్రకాశవంతంగా ఉన్న వెలుగును చూడలేదు.” హీబ్రూ వాక్యక్రమం సంక్షిప్తంగా ఉంది; దాన్ని ‘ఉన్నప్పటికీ’ అనే వ్యతిరేకార్థం లేకుండానూ అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
  - marker: b
    text: “వాటిని” అనే హీబ్రూ సర్వనామం బహువచనంలో ఉంది; అది బహుశా ఆకాశాలను లేదా మేఘాలను సూచిస్తుంది. కొందరు ఈ భావాన్ని సాధారణంగా “ఆకాశాన్ని నిర్మలం చేస్తుంది” అని అర్థం చేసుకుంటారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: ఇప్పుడైతే
  rationale: కాలసూచనతో పాటు ముందున్న మాటకు అనుసంధానాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: לֹא רָאוּ
  choice: వారు ... చూడడం లేదు
  rationale: Qal perfect మూడవ పురుష బహువచన రూపాన్ని సందర్భానుసారమైన ప్రస్తుత పరిశీలనగా వ్యక్తం చేస్తూ, మూలంలోని బహువచన కర్తను నిలుపుతుంది.
- source_word: אוֹר
  choice: వెలుగును
  rationale: మూలంలోని సాధారణ ‘వెలుగు’ అనే అర్థాన్ని నిలుపుతుంది; ‘సూర్యకాంతి’ అని మరీ నిర్దిష్టం చేయదు.
- source_word: בָּהִיר הוּא
  choice: అది ప్రకాశవంతంగా ఉన్నా
  rationale: הוּאను వెలుగుకు తిరిగి సూచించే సర్వనామంగా తీసుకొని, వెలుగు ఉన్నప్పటికీ కనిపించని భావాన్ని concessive నిర్మాణంలో వ్యక్తం చేస్తుంది.
- source_word: בַּשְּׁחָקִים
  choice: ఆకాశాల్లో
  rationale: שְׁחָקִים సూచించగల ఆకాశాలు/మేఘరాశులు అనే కవితాత్మక పరిధిని అతిగా నిర్దిష్టం చేయకుండా నిలుపుతుంది.
- source_word: וְרוּחַ עָבְרָה
  choice: కాని గాలి వీచి వెళ్లి
  rationale: רוּחַను వాతావరణ సంబంధమైన గాలిగా తీసుకుంటుంది; עבר యొక్క దాటివెళ్లే చలనాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: וַתְּטַהֲרֵם
  choice: వాటిని నిర్మలం చేస్తుంది
  rationale: טהר యొక్క శుభ్రం/తేటగా చేయడం అనే భావాన్ని వాతావరణ సందర్భానికి తగినట్లు ఇస్తూ, మూలంలోని పురుష బహువచన కర్మప్రత్యయాన్ని ‘వాటిని’గా నిలుపుతుంది.
