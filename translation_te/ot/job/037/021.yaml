  to: ఇప్పుడైతే, ఆకాశాల్లో అది ప్రకాశవంతంగా ఉన్నప్పటికీ, వారు వెలుగును చూడడం లేదు[a]; గాలి వీచి వెళ్లి వాటిని నిర్మలం చేస్తుంది[b].
