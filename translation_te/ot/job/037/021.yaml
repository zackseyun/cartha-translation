translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కవితాత్మక గద్యశైలిని వాడాం. మూలంలోని బహువచన కర్త, ‘వెలుగు’ అనే విస్తృత పదం, ఆకాశాల బహువచనం, చివరి బహువచన సర్వనామం నిలుపబడ్డాయి; వాక్య నిర్మాణంలోని నిజమైన సందిగ్ధతను పాదసూచనల్లో తెలిపాం.
