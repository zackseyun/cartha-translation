id: JOB.37.15
reference: Job 37:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: הֲ֭/תֵדַע בְּ/שׂוּם אֱל֣וֹהַּ עֲלֵי/הֶ֑ם וְ֝/הוֹפִ֗יעַ א֣וֹר עֲנָנֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/037/015.yaml
  text: Do you know how God lays these upon them[b][a], and causes the light of his cloud to shine?
translation:
  language: te
  text: దేవుడు వీటిని వాటిమీద ఎలా ఉంచుతాడో[a], తన మేఘపు వెలుగు ప్రకాశించేలా చేస్తాడో[b] నీకు తెలుసా?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దేవుడు వాటిని అమర్చినప్పుడు,” లేదా “దేవుడు వాటిని ఎలా నియమిస్తాడో.” హీబ్రూ వాక్యం సంక్షిప్తంగా ఉంది; ‘ఉంచడం’ అనే క్రియకు కర్మ ఏమిటో, ‘వాటిమీద’ దేనిని సూచిస్తుందో పరిసర సందర్భం నుంచే గ్రహించాలి.
    reason: alternative_reading
  - marker: b
    text: లేదా, “తన మేఘపు కాంతిని మెరిపించేలా చేస్తాడో.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתֵדַע
  choice: నీకు తెలుసా?
  rationale: ידע అనే క్రియ ఇక్కడ యోబును ఉద్దేశించిన అలంకార ప్రశ్నగా ఉంది. ఆధునిక తెలుగులో ‘నీకు తెలుసా?’ అనేది నేరుగా, సహజంగా ఉంటుంది.
- source_word: בְּשׂוּם
  choice: ఎలా ఉంచుతాడో
  rationale: ב తో కూడిన שום క్రియానామ రూపం సందర్భాన్ని లేదా విధానాన్ని సూచించగలదు. ప్రశ్నలో ‘ఎలా ఉంచుతాడో’ సహజంగా ఉండి, ‘ఉంచడం/నియమించడం’ అనే భావాన్ని నిలుపుతుంది.
- source_word: אֱלוֹהַּ
  choice: దేవుడు
  rationale: ఇది యోబు గ్రంథంలో సాధారణంగా కనిపించే ‘దేవుడు’ అనే ఏకవచన కావ్యరూపం; అదనపు బిరుదు చేర్చడానికి సందర్భంలో ఆధారం లేదు.
- source_word: עֲלֵיהֶם
  choice: వాటిమీద
  rationale: על కు జతైన మూడవ పురుష బహువచన ప్రత్యయం ‘వాటిమీద’ అని అర్థమిస్తుంది. అది దేనిని సూచిస్తుందో వచనంలో స్పష్టంగా చెప్పలేదు కాబట్టి అనిశ్చితిని అలాగే ఉంచాం.
- source_word: וְהוֹפִיעַ
  choice: ప్రకాశింపజేస్తాడో
  rationale: יפע యొక్క హిఫీల్ రూపం వెలుగు కనిపించేలా చేయడం లేదా ప్రకాశింపజేయడం అనే కారణార్థాన్ని ఇస్తుంది.
- source_word: אוֹר
  choice: వెలుగు
  rationale: אוֹר కు ప్రాథమిక అర్థం ‘వెలుగు/కాంతి.’ మెరుపు అని మరింత నిర్దిష్టంగా అనువదించకుండా మూలంలోని విస్తృత భావాన్ని నిలిపాం.
- source_word: עֲנָנוֹ
  choice: తన మేఘపు
  rationale: ఏకవచన నామవాచకానికి మూడవ పురుష ఏకవచన ప్రత్యయం ఉంది; అందువల్ల ‘తన మేఘపు’ అని అనువదించడం రూపానికీ భావానికీ సరిపోతుంది.
theological_decisions:
- issue: ‘ఉంచడం’ అనే క్రియకు కర్మ ఏమిటి, ‘వాటి’ సూచన ఏమిటి అనే అస్పష్టత
  choice: ‘వీటిని వాటిమీద’ అని అనువదించి, పరిసర సందర్భంపై ఆధారపడే సూచనను తెరిచి ఉంచడం
  alternative: ‘తన ఆజ్ఞను వాటిమీద ఉంచుతాడు’ లేదా ‘మేఘాలను వాటిమీద అమరుస్తాడు’
  rationale: హీబ్రూలో שום తర్వాత కర్మ ప్రత్యక్షంగా లేదు; עֲלֵיהֶם లోని బహువచన సూచన కూడా పరిసర సందర్భంపైనే ఆధారపడుతుంది. ఆజ్ఞ, మేఘాలు, మెరుపు వంటి నిర్దిష్ట వివరణను చేర్చడం మూలంలో లేని వ్యాఖ్యానాన్ని స్థిరపరుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే ప్రశ్నారూపాన్ని వాడాం. మూలంలోని కావ్యసంక్షిప్తతను పూర్తిగా విప్పకుండా, పఠనసౌలభ్యం కోసం ‘వీటిని’ అనే సూచక సర్వనామాన్ని ఉపయోగించాం; దాని అనిశ్చితిని పాదటిప్పణిలో స్పష్టం చేశాం.
