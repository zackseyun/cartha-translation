source:
  edition: WLC
  text: יַרְעֵ֤ם אֵ֣ל בְּ֭/קוֹל/וֹ נִפְלָא֑וֹת עֹשֶׂ֥ה גְ֝דֹל֗וֹת וְ/לֹ֣א נֵדָֽע׃
base_translation:
  language: en
  yaml_path: translation/ot/job/037/005.yaml
  text: God thunders wondrously with his voice[b][a]; he does great things that we do not know.
translation:
  language: te
  text: దేవుడు తన స్వరంతో అద్భుతంగా ఉరుముతాడు[a]; మనకు తెలియని గొప్ప కార్యాలు ఆయన చేస్తాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దేవుడు తన స్వరంతో అద్భుతాలను ఉరుముతాడు.” హీబ్రూ పదం రూపరీత్యా “అద్భుతాలు” అని అర్థమివ్వగలదు; అయితే ఇక్కడ అది “అద్భుతంగా” అనే క్రియావిశేషణ భావంలో వాడబడి ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “మన జ్ఞానానికి అందని గొప్ప కార్యాలు ఆయన చేస్తాడు”; లేదా, “మనం గ్రహించలేని గొప్ప కార్యాలు ఆయన చేస్తాడు.”
    reason: alternative_reading
lexical_decisions:
- source_word: יַרְעֵם
  choice: ఉరుముతాడు
  rationale: רעם యొక్క హిఫిల్ రూపం ఉరుమును పుట్టించడం లేదా ఉరుమడం అనే భావాన్ని ఇస్తుంది. దేవుని స్వరం, తుఫాను అనే సందర్భంలో ‘ఉరుముతాడు’ సహజంగా ఉండి మూలభావాన్ని నిలుపుతుంది.
- source_word: אֵל
  choice: దేవుడు
  rationale: ఇక్కడ אֵל సాధారణ దైవనామంగా దేవుణ్ణి సూచిస్తుంది; అదనపు బిరుదును చేర్చాల్సిన అవసరం లేదు.
- source_word: בְּקוֹלוֹ
  choice: తన స్వరంతో
  rationale: ב అనే విభక్తి ఇక్కడ సాధనార్థకంగా ఉంది. ‘తన స్వరంతో’ అనేది దేవుని స్వరమే ఉరుమడానికి సాధనం లేదా దానితో కూడిన వ్యక్తీకరణ అని సహజంగా తెలియజేస్తుంది.
- source_word: נִפְלָאוֹת
  choice: అద్భుతంగా
  rationale: రూపరీత్యా ఇది ‘అద్భుతాలు/ఆశ్చర్యకార్యాలు’ అనే బహువచన నామవాచకం. అయితే ఈ వాక్యంలో క్రియను విశేషించే క్రియావిశేషణ భావంలో తీసుకోవడం సహజం. రూపరీత్యా సాధ్యమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: עֹשֶׂה
  choice: చేస్తాడు
  rationale: עשה అనే విస్తృతార్థక క్రియకు ఇక్కడ ‘చేస్తాడు’ సహజమైన సమానార్థకం; తరువాతి ‘గొప్ప కార్యాలు’తో సులభంగా కలుస్తుంది.
- source_word: גְּדֹלוֹת
  choice: గొప్ప కార్యాలు
  rationale: స్త్రీలింగ బహువచన విశేషణం ఇక్కడ నామవాచకార్థంలో వాడబడింది. ‘గొప్ప కార్యాలు’ సందర్భానికి తగిన స్పష్టతను ఇస్తుంది.
- source_word: וְלֹא נֵדָע
  choice: మనకు తెలియని
  rationale: మూలంలో అక్షరార్థంగా ‘మరియు మనం ఎరుగము’ అని ఉంది. తెలుగులో దీనిని ‘గొప్ప కార్యాలు’ను విశేషించే ఉపవాక్యంగా ఇవ్వడం సహజం; ‘గ్రహించలేని’ అని బలపరచకుండా ידע యొక్క ‘తెలుసుకొను’ భావాన్ని కాపాడుతుంది.
theological_decisions:
- issue: చివరి ఉపవాక్యంలో మానవ అజ్ఞానపు పరిధి
  choice: దేవుని గొప్ప కార్యాలు మనకు తెలియనివని చెప్పడం
  alternative: దేవుడు మన జ్ఞానానికి అందని లేదా మనం గ్రహించలేని గొప్ప కార్యాలు చేస్తాడని చెప్పడం
  rationale: ידע అనే క్రియ ప్రాథమికంగా ‘తెలుసుకొను’ అని అర్థం. సందర్భం మానవ పరిమితిని సూచించినప్పటికీ, మూలపాఠం స్పష్టంగా చెప్పినదానికంటే బలమైన సంపూర్ణ అగ్రాహ్యత భావాన్ని అనువాదంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గంభీరమైన కానీ సహజమైన శైలి ఉపయోగించబడింది. ‘ఉరుముతాడు’ తుఫాను సందర్భంలోని బలాన్ని నిలుపుతుంది; ‘మనకు తెలియని’ మూలపాఠంలోని ఉద్దేశపూర్వక పరిమితిని అతిశయింపకుండా కాపాడుతుంది.
