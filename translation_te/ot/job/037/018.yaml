source:
  edition: WLC
  text: תַּרְקִ֣יעַ עִ֭מּ/וֹ לִ/שְׁחָקִ֑ים חֲ֝זָקִ֗ים כִּ/רְאִ֥י מוּצָֽק׃
base_translation:
  language: en
  yaml_path: translation/ot/job/037/018.yaml
  text: Can you[a], with him, spread out the skies[c][b], hard as a cast metal mirror?
translation:
  language: te
  text: ఆయనతో కలిసి, పోతపోసిన లోహపు అద్దంలా[c] గట్టిగా ఉన్న ఆకాశాలను[b] నీవు పరచగలవా[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఆకాశాలను కొట్టి పలుచగా చేయగలవా’ లేదా ‘సాగదీయగలవా.’ హీబ్రూ క్రియలో పరచడం అనే భావంతోపాటు లోహాన్ని కొట్టి పలుచగా చేసే భావం కూడా ఉంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘ఆకాశమండలాలను’ లేదా ‘మేఘాలను.’ שׁחקים అనే హీబ్రూ కావ్యపదం ఆకాశాలను లేదా ఆకాశమండలాలను సూచిస్తుంది; కొన్ని సందర్భాల్లో మేఘాలను కూడా సూచించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: అక్షరార్థంగా, ‘పోతపోసిన అద్దంలా.’ ప్రాచీన అద్దాలు మెరుగుపెట్టిన లోహంతో చేసేవారు; ఇక్కడ ఆకాశం గట్టిగా, మెరుస్తున్న లోహపు పనిలా చిత్రించబడింది.
    reason: cultural_note
lexical_decisions:
- source_word: תַּרְקִיעַ
  choice: పరచగలవా
  rationale: רקע అనే ధాతువు హిఫీల్ రూపంలో ఏదైనా వస్తువును పరచడం, ముఖ్యంగా లోహాన్ని కొట్టి పలుచగా చేయడం అనే భావాలను ఇస్తుంది. ప్రధాన పాఠ్యంలో సహజమైన ‘పరచు’ను వాడి, లోహపు పనికి సంబంధించిన ప్రత్యామ్నాయ భావాన్ని పాదసూచికలో ఉంచాం.
- source_word: עִמּוֹ
  choice: ఆయనతో కలిసి
  rationale: హీబ్రూ పాఠ్యంలో ‘ఆయనతో’ అనే సర్వనామ రూపమే ఉంది. సందర్భంలో అది దేవుణ్ణి సూచించినా, ప్రధాన పాఠ్యంలో పేరును చేర్చకుండా మూలంలోని సర్వనామాన్ని నిలిపాం.
- source_word: לִשְׁחָקִים
  choice: ఆకాశాలను
  rationale: שׁחקים అనేది ఆకాశాలు లేదా ఆకాశమండలాలను సూచించే కావ్యపదం; కొన్ని సందర్భాల్లో మేఘాలు అని కూడా అర్థం కావచ్చు. లోహపు అద్దంతో చేసిన పోలిక ఇక్కడ కనబడే ఆకాశ విస్తారాన్ని సూచిస్తుంది; మూలంలోని బహువచన కావ్యరూపాన్ని ‘ఆకాశాలను’ నిలుపుతుంది.
- source_word: חֲזָקִים
  choice: గట్టిగా ఉన్న
  rationale: ఈ విశేషణం పోతపోసిన లోహపు అద్దంతో పోల్చబడిన ఆకాశాల దృఢత్వాన్ని తెలియజేస్తుంది. ఈ ఉపమానంలో ‘బలమైన’ కంటే ‘గట్టిగా ఉన్న’ సహజంగా సరిపోతుంది.
- source_word: כִּרְאִי
  choice: అద్దంలా
  rationale: רְאִי అంటే అద్దం; ముందు ఉన్న כְּ పోలికను సూచిస్తుంది. అందువల్ల ‘అద్దంలా’ అని అనువదించాం.
- source_word: מוּצָק
  choice: పోతపోసిన లోహపు
  rationale: ఈ నిష్క్రియాత్మక రూపం కరిగిన పదార్థాన్ని పోసి తయారుచేసిన దానిని, ముఖ్యంగా లోహపు వస్తువును సూచిస్తుంది. హీబ్రూ ఏ ప్రత్యేక లోహాన్నీ పేర్కొననందున ‘కంచు’ వంటి నిర్దిష్ట పదాన్ని వాడలేదు.
