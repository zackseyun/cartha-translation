translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన ప్రశ్నారూపాన్ని వాడాం. ‘ఆయన’ అనే గౌరవ సర్వనామం సందర్భంలోని దేవుని సూచనకు తగినదిగా ఉండి, మూలంలోని సర్వనామాన్ని స్పష్టీకరణ లేకుండా నిలుపుతుంది. వాక్యంలో కావ్యాత్మకమైన లోహపు అద్దం చిత్రాన్ని కాపాడుతూ, అస్పష్టతలను పాదసూచికల్లో వెల్లడించాం.
