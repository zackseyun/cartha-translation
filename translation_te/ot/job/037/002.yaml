  to: ఆయన స్వరపు కంపనాన్ని జాగ్రత్తగా వినండి[a], ఆయన నోటి నుండి వెలువడే గొణుగుడును[b].
  rationale: 'The revision retains the draft''s natural Telugu rendering of the emphatic command while restoring the Hebrew syntax: one command governs both coordinated sound expressions. It replaces the overly narrow ‘గర్జన’ with ‘గొణుగుడు,’ which better represents הֶגֶה''s low, murmuring or rumbling sound. The notes preserve the lexical ambiguity of רֹגֶז and הֶגֶה without imposing an interpretive conclusion.'
