  text: Listen carefully[a] to the trembling of his voice[b], and the rumbling that comes out from his mouth.
translation:
  language: te
  text: ఆయన స్వరపు కంపనాన్ని జాగ్రత్తగా వినండి[a], ఆయన నోటి నుండి వెలువడే గొణుగుడును[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆయన స్వరంలోని కలవరాన్ని’ లేదా ‘ఉగ్రతను.’ హీబ్రూ నిర్మాణం వినమనే ఆజ్ఞను బలంగా నొక్కి చెబుతుంది; ‘కంపనం’ అనే పదానికి కలవరం లేదా ఉగ్రత అనే భావాలు కూడా ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘ధ్వనిని,’ ‘మర్మరాన్ని,’ లేదా సందర్భానుసారం ‘గంభీర మ్రోగుడును.’
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ שָׁמוֹעַ
  choice: జాగ్రత్తగా వినండి
  rationale: క్రియతో కూడిన infinitive absolute ఆజ్ఞను బలపరుస్తుంది. తెలుగులో అసహజమైన పదపునరుక్తి చేయకుండా ‘జాగ్రత్తగా వినండి’ ఆ ఉద్ఘాటనను సహజంగా తెలియజేస్తుంది.
- source_word: בְּרֹגֶז
  choice: స్వరపు కంపనాన్ని
  rationale: רֹגֶז అంటే కంపనం, కలవరం లేదా ఉగ్రత కావచ్చు. తుఫాను సందర్భంలో ‘కంపనం’ భయానకంగా ప్రకంపించే ధ్వని భావాన్ని నిలుపుతుంది; దానిని తప్పనిసరిగా కోపంగా వ్యాఖ్యానించదు.
- source_word: קֹלוֹ
  choice: ఆయన స్వరం
  rationale: קוֹל అనేది ‘స్వరం’ లేదా ‘ధ్వని’ కావచ్చు. తరువాత ‘ఆయన నోరు’ అని ఉన్నందున, ‘స్వరం’ మూలంలోని మానవరూపక కవితా చిత్రాన్ని కాపాడుతుంది.
- source_word: וְהֶגֶה
  choice: గర్జన
  rationale: הֶגֶה తక్కువ స్థాయిలో వినిపించే ధ్వని, గొణుగుడు లేదా మూలుగు అనే భావాలను ఇవ్వగలదు. తుఫాను సందర్భంలో ‘గర్జన’ ఉరుము యొక్క గంభీర ధ్వనిని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: מִפִּיו יֵצֵא
  choice: ఆయన నోటి నుండి వెలువడే
  rationale: יצא అంటే బయటికి రావడం లేదా బయలుదేరడం. ఈ రూపం మూలంలోని స్పష్టమైన మానవరూపక వ్యక్తీకరణను సహజ తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: తుఫాను చిత్రణలో దేవునికి వర్తింపజేసిన మానవరూపక భాష
  choice: మూలంలో ఉన్నట్లే ‘ఆయన స్వరం,’ ‘ఆయన నోరు’ అని నిలుపడం
  alternative: ‘దాని ధ్వని’ లేదా ‘ఉరుము’ అని వ్యక్తిత్వరహితం చేయడం
  rationale: ఈ వచనం తుఫానును దేవుని సొంత ఉచ్చారణగా కవితాత్మకంగా చిత్రిస్తుంది. మానవరూపక భాషను నిలపడం మూలపాఠంలోని సాహిత్య, దైవశాస్త్రీయ బలాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన, గంభీరమైన కవితా శైలి. మూలంలోని ఉద్ఘాటనను సహజీకరించినప్పటికీ, లెక్సికల్ సందిగ్ధతలను పాదసూచికల్లో నిలిపాం.
