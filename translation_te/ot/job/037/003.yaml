source:
  edition: WLC
  text: תַּֽחַת כָּל הַ/שָּׁמַ֥יִם יִשְׁרֵ֑/הוּ וְ֝/אוֹר֗/וֹ עַל כַּנְפ֥וֹת הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/037/003.yaml
  text: Under all the heavens he sends it out[b][a], and his lightning to the ends of the earth.
translation:
  language: te
  text: ఆకాశాలన్నిటి కింద ఆయన దానిని పంపుతాడు; తన మెరుపును[a] భూమి అంచులవరకు[b] పంపుతాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘తన వెలుగును.’ హీబ్రూ పదానికి అక్షరార్థం ‘వెలుగు’; ఈ తుఫాను సందర్భంలో అది మెరుపును సూచించే అవకాశం ఉంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘భూమి రెక్కలపై.’ ఇది భూమి సుదూర అంచులను సూచించే హీబ్రూ కవితాత్మక ప్రయోగం.
    reason: cultural_note
lexical_decisions:
- source_word: תַּחַת כָּל הַשָּׁמַיִם
  choice: ఆకాశమంతటి కింద
  rationale: ‘ఆకాశాలన్నిటి కింద’ అనే మూలంలోని స్థలసంబంధ చిత్రాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; సమస్త ఆకాశ విస్తృతిని సూచిస్తుంది.
- source_word: יִשְׁרֵהוּ
  choice: ఆయన దానిని పంపిస్తాడు
  rationale: క్రియకు జతచేయబడిన ఏకవచన కర్మప్రత్యయాన్ని ‘దానిని’ అని ఉంచి, దాని నిర్దిష్ట సూచనను మూలంలాగే సందర్భానికి వదిలింది. తుఫాను సందర్భంలో క్రియ పంపడం లేదా సాగనంపడం అనే భావాన్ని ఇస్తుంది.
- source_word: וְאוֹרוֹ
  choice: తన మెరుపును
  rationale: אוֹר సాధారణంగా ‘వెలుగు’ అయినా, ఇక్కడ తుఫాను వర్ణనలో అది మెరుపును సూచించే అవకాశం ఎక్కువ. స్పష్టమైన సహజ తెలుగు కోసం ‘మెరుపు’ వాడి, అక్షరార్థాన్ని పాదటిప్పణిలో నిలిపాం.
- source_word: עַל כַּנְפוֹת הָאָרֶץ
  choice: భూమి అంచులవరకు
  rationale: అక్షరార్థంగా ‘భూమి రెక్కలపై’ ఉన్న కవితాత్మక ప్రయోగం భూమి సుదూర అంచులను సూచిస్తుంది. గమనాన్ని, వ్యాప్తిని తెలుగులో సహజంగా తెలియజేయడానికి ‘అంచులవరకు’ అని అనువదించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ కవితాత్మక గంభీరతను నిలిపాం. మొదటి పాదంలోని ‘దానిని’ అనే సర్వనామానికి సూచ్యాన్ని స్పష్టీకరించకుండా మూలంలోని అనిశ్చితిని కాపాడాం; రెండో పాదంలో తెలుగులో అవసరమైన క్రియను పునరుక్తి చేశాం.
