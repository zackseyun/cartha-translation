  text: Teach us what we should say to him[b][a]; we cannot arrange our words because of darkness.
translation:
  language: te
  text: ఆయనకు ఏమి చెప్పాలో మాకు తెలియజేయి; చీకటి కారణంగా మా మాటలను క్రమపరచలేం.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మా మాటలను వరుసగా ఉంచలేం,” లేదా “మా వాదనను క్రమపరచలేం.” ఇక్కడ “చీకటి” మానవ అజ్ఞానాన్ని లేదా అసమర్థతను రూపకంగా సూచించవచ్చు; అక్షరార్థం కూడా సాధ్యమే.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹדִיעֵנוּ
  choice: మాకు తెలియజేయి
  rationale: ידע అనే ధాతువు హిఫిల్ ఆజ్ఞారూపంలో ‘మాకు తెలిసేలా చేయి’ అనే భావం ఇస్తుంది. ‘తెలియజేయి’ ఆ కారణార్థాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: מַה נֹּאמַר לוֹ
  choice: ఆయనతో ఏమి చెప్పాలో
  rationale: ఇది ఆజ్ఞకు ప్రత్యక్ష కర్మగా వచ్చి, ‘ఆయనతో మేము ఏమి చెప్పాలో’ అనే ఆలోచనాత్మక భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: לֹא נַעֲרֹךְ
  choice: మా మాటలను క్రమంగా అమర్చలేం
  rationale: ערך యొక్క ప్రాథమిక భావం ‘అమర్చడం, క్రమంలో పెట్టడం.’ సందర్భంలో చెప్పబోయే మాటలను లేదా వాదనను సక్రమంగా రూపొందించడాన్ని సూచించవచ్చు; ప్రధాన పాఠం మూలరూపకాన్ని నిలుపుతుంది.
- source_word: מִפְּנֵי חֹשֶׁךְ
  choice: చీకటి కారణంగా
  rationale: מִפְּנֵי ఇక్కడ ‘కారణంగా’ అనే కారణార్థాన్ని ఇస్తుంది. חֹשֶׁךְ ను ‘చీకటి’గా ఉంచడం వల్ల అక్షరార్థం, మానవ అజ్ఞానం లేదా అసమర్థత అనే రూపకార్థం రెండూ తెరిచి ఉంటాయి.
theological_decisions:
- issue: చివరి భాగంలోని ‘చీకటి’ భావం
  choice: ‘చీకటి’ అనే విస్తృత పదాన్నే నిలుపడం
  alternative: ‘అజ్ఞానం కారణంగా’ లేదా ‘చీకటిగా ఉన్నందున’
  rationale: హీబ్రూ కవిత్వం ఇది అక్షరార్థ చీకటో, మానవ అజ్ఞానమో, దేవుని ఎదుట మాటలను అమర్చలేని అసమర్థతో స్పష్టంగా నిర్ణయించదు. అనువాదం ఆ ఉద్దేశపూర్వక సంక్షిప్తతను, సందిగ్ధతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. దేవునికి సూచనగా ‘ఆయనతో’ వాడబడింది. మూలంలోని ‘అమర్చడం’ అనే రూపకాన్ని ప్రధాన పాఠంలో నిలిపి, న్యాయవాద సందర్భార్థాన్ని పాదటిప్పణిలో ఇచ్చాం.
