id: JOB.37.6
reference: Job 37:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּ֤י לַ/שֶּׁ֨לַג יֹאמַ֗ר הֱוֵ֫א אָ֥רֶץ וְ/גֶ֥שֶׁם מָטָ֑ר וְ֝/גֶ֗שֶׁם מִטְר֥וֹת עֻזּֽ/וֹ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/037/006.yaml
  text: For he says to the snow[a], ‘Fall to the earth,’ and to the rain, ‘Become a shower,’ and to the rains[b], ‘Become a downpour of his might.’
translation:
  language: te
  text: ఎందుకంటే ఆయన మంచుతో[a], “భూమిమీద పడు” అని అంటాడు; వానతో, “జల్లువానగా కురువు” అని, వానధారలతో[b], “ఆయన మహాశక్తిగల కుండపోతలుగా కురవండి” అని అంటాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “భూమిమీద ఉండు.” అంటే మంచు నేలమీద కనిపించాలనీ లేదా పరచుకొని ఉండాలనీ ఆజ్ఞాపించడం.
    reason: lexical_alternative
  - marker: b
    text: ఈ సంక్షిప్త కావ్యపదబంధాన్ని “ఆయన శక్తివంతమైన వానధారలు” లేదా “ఉద్ధృతమైన కుండపోత వానలు” అని కూడా అనువదించవచ్చు. చివరి సర్వనామాన్ని వర్షానికి అన్వయిస్తే, “దాని ఉద్ధృతితో” అనే భావం వస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి సందర్భంలో దేవుడు వాతావరణాన్ని నియంత్రిస్తున్నాడనే వివరణను కొనసాగించే కారణార్థక సంధానాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: לַשֶּׁלַג
  choice: మంచుతో
  rationale: ל + אמר నిర్మాణం పలుకబడుతున్న దానిని సూచిస్తుంది; తెలుగులో ‘మంచుతో ... అంటాడు’ అనేది వ్యక్తీకరించిన సంబోధనను సహజంగా నిలుపుతుంది.
- source_word: יֹאמַר
  choice: అంటాడు
  rationale: కావ్యవర్ణనలోని అసంపూర్ణ క్రియను సజీవ వర్తమానంగా ఇస్తుంది; ఆజ్ఞార్థం ఉద్ధరణలోని క్రియ ద్వారా వ్యక్తమవుతుంది.
- source_word: הֱוֵא אָרֶץ
  choice: భూమిపై పడు
  rationale: హయా క్రియ యొక్క అక్షరార్థం ‘ఉండు/అవు’ అయినా, మంచు భూమిమీద ప్రత్యక్షమై పరచుకోవాలనే సందర్భార్థాన్ని ‘పడు’ సహజంగా తెలియజేస్తుంది; ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: וְגֶשֶׁם מָטָר
  choice: వానతో, ‘జల్లుగా కురువు’
  rationale: సమీపార్థకమైన రెండు వర్షపదాల కావ్యపూర్ణతను పూర్తిగా తొలగించకుండా, తెలుగులో సహజమైన ఆజ్ఞారూపంగా చూపుతుంది.
- source_word: וְגֶשֶׁם מִטְרוֹת עֻזּוֹ
  choice: వానధారలతో, ‘ఆయన బలప్రభావంతో కుండపోతగా కురవండి’
  rationale: మִטְרוֹת బహువచనంలోని తీవ్రతను ‘వానధారలు/కుండపోత’ ద్వారా, עֻזּוֹ ను దేవుని బలానికి సంబంధించినదిగా ‘ఆయన బలప్రభావంతో’ ద్వారా ప్రతిబింబిస్తుంది; హీబ్రూ సంక్షిప్త కావ్యనిర్మాణాన్ని ఆజ్ఞల సమాంతరతలో అందిస్తుంది.
- source_word: עֻזּוֹ
  choice: ఆయన బలప్రభావంతో
  rationale: పుంలింగ ఏకవచన ప్రత్యయం సందర్భంలోని ఆజ్ఞాపించే దేవునిని సూచిస్తుందని ప్రధాన పాఠం స్వీకరిస్తుంది; ‘బలప్రభావం’ వర్షంలో వ్యక్తమయ్యే ఆయన శక్తిని సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: עֻזּוֹ లోని సర్వనామ ప్రత్యయం ఎవరిని సూచిస్తుంది
  choice: దేవునిని సూచించే ‘ఆయన బలప్రభావంతో’
  alternative: వర్షాన్ని సూచించే ‘దాని ఉద్ధృతితో’
  rationale: సమీప సందర్భంలో వాతావరణానికి ఆజ్ఞాపించి దాన్ని పాలిస్తున్నవాడు దేవుడే; కాబట్టి ప్రత్యయం ఆయనను సూచించడం ప్రవాహానికి బాగా సరిపోతుంది. అయినా వ్యాకరణపరమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో గుర్తించాం.
- issue: చివరి వర్షపదబంధం ఆజ్ఞగా ఉందా లేక నామపదబంధంగా ఉందా
  choice: ముందటి ఆజ్ఞను ఎలిప్సిస్ ద్వారా కొనసాగిస్తూ ‘కుండపోతగా కురవండి’
  alternative: ‘ఆయన బలమైన వానధారలు’ అనే నామపదబంధం
  rationale: హీబ్రూ పాదం సంక్షిప్తంగా ఉండి క్రియను పునరుక్తం చేయదు; కావ్య సమాంతరత ఆజ్ఞ కొనసాగింపును అనుమతిస్తుంది, కానీ నామపదబంధ పఠనమూ సాధ్యమే కనుక పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. మంచు, వాన, వానధారలను దేవుడు నేరుగా సంబోధిస్తున్న హీబ్రూ వ్యక్తీకరణను నిలిపి, పునరుక్త వర్షపదాల తీవ్రతను సహజమైన తెలుగు వాతావరణ పదజాలంతో వ్యక్తం చేసింది.
