- from: ఎందుకంటే ఆయన మంచుతో[a], “భూమిపై పడు” అని అంటాడు; వానతో, “జల్లుగా కురువు” అని, వానధారలతో[b], “ఆయన బలప్రభావంతో కుండపోతగా కురవండి” అని అంటాడు.
