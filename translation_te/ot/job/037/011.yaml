source:
  edition: WLC
  text: אַף בְּ֭/רִי יַטְרִ֣יחַ עָ֑ב יָ֝פִ֗יץ עֲנַ֣ן אוֹרֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/037/011.yaml
  text: Indeed[a], he loads the thick cloud with moisture[b]; he scatters his cloud of light.
translation:
  language: te
  text: 'నిజంగా, తేమతో[a] దట్టమైన మేఘాన్ని ఆయన భారపరుస్తాడు;

    తన వెలుగుకు చెందిన మేఘాన్ని[b] ఆయన చెదరగొడతాడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘వర్షంతో/నీటితో.’ ‘తేమ’గా అనువదించిన హీబ్రూ పదం అర్థం అనిశ్చితం; కొందరు దాన్ని ‘ప్రకాశం’తోనూ సంబంధపరుస్తారు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా ‘తన వెలుగు యొక్క మేఘం.’ తుఫాను సందర్భంలో దీన్ని ‘తన మెరుపు మేఘం’ అని కూడా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף
  choice: నిజంగా
  rationale: ఇక్కడ ఈ పదం వాతావరణంపై దేవుని అదుపును గురించి మరో అంశాన్ని నొక్కిచెప్పే అవ్యయంగా ఉంది; ‘నిజంగా’ దాని ఉద్ఘాటనను సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: בְּרִי
  choice: తేమతో
  rationale: ఈ అరుదైన పదానికి తేమ, వర్షం, నీరు, ప్రకాశం వంటి అర్థాలు ప్రతిపాదించబడ్డాయి. మేఘాన్ని భారంగా చేయడం అనే సందర్భంలో ‘తేమతో’ అనేది వాతావరణ సంబంధమైన భావానికి సరిపోతుంది; పదంలోని అనిశ్చితిని పాదసూచికలో ఉంచాం.
- source_word: יַטְרִיחַ
  choice: భారంగా చేస్తాడు
  rationale: טרח అనే ధాతువు హిఫిల్ రూపంలో భారం మోయించడాన్ని లేదా భారపరచడాన్ని సూచించగలదు. తేమతో నిండిన మేఘం చిత్రాన్ని ‘భారంగా చేస్తాడు’ నేరుగా నిలుపుతుంది.
- source_word: עָב
  choice: దట్టమైన మేఘం
  rationale: עָב సాధారణంగా మందమైన లేదా దట్టమైన మేఘాన్ని సూచిస్తుంది; అందువల్ల స్పష్టమైన వాతావరణ చిత్రాన్ని నిలిపాం.
- source_word: יָפִיץ
  choice: చెదరగొడతాడు
  rationale: פוץ ధాతువు హిఫిల్ రూపం చెదరగొట్టడం లేదా వ్యాపింపజేయడం అనే భావాన్ని ఇస్తుంది. ‘చెదరగొడతాడు’ మూలంలోని క్రియాశీల చిత్రాన్ని నిలుపుతుంది.
- source_word: עֲנַן אוֹרוֹ
  choice: తన వెలుగు మేఘం
  rationale: పదబంధం అక్షరార్థంగా ‘అతని వెలుగు యొక్క మేఘం.’ అసాధారణమైన ఈ సంబంధాన్ని ముందుగానే ‘మెరుపు మేఘం’గా నిర్ణయించకుండా, తెలుగులో సంక్షిప్త సమాస రూపంతో నిలిపి, సాధ్యమైన వివరణలను పాదసూచికలో ఇచ్చాం.
