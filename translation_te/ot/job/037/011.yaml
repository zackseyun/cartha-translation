translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, కవితాత్మకమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రద శైలిని వాడాం. మొదటి పాదంలో మేఘం తేమవల్ల భారమవుతున్న చిత్రాన్ని నిలిపాం. రెండవ పాదంలోని అసాధారణ హీబ్రూ సంబంధాన్ని అతిగా వివరణాత్మకంగా మార్చకుండా ‘తన వెలుగు మేఘం’గా ఉంచి, మెరుపు అనే సందర్భోచిత భావాన్ని పాదసూచికకు పరిమితం చేశాం.
