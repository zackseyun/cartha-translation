  text: לָ֭/כֵן יְרֵא֣וּ/הוּ אֲנָשִׁ֑ים לֹֽא יִ֝רְאֶ֗ה כָּל חַכְמֵי לֵֽב־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/job/037/024.yaml
  text: Therefore men fear him[a]; he does not regard any who are wise of heart.
translation:
  language: te
  text: కాబట్టి మనుషులు ఆయనకు భయపడతారు; హృదయంలో జ్ఞానులైన వారెవరినీ ఆయన లక్ష్యపెట్టడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “హృదయంలో జ్ఞానులైన వారందరినీ ఆయన చూడడు.” హెబ్రీ క్రియకు “చూడు” లేదా “లక్ష్యపెట్టు, పట్టించుకో” అనే అర్థాలు ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: కాబట్టి
  rationale: ముందటి వచనాల్లో దేవుని మహత్తును వర్ణించిన దాని నుంచి వచ్చే నిర్ధారణను సహజమైన తెలుగులో స్పష్టంగా సూచిస్తుంది.
- source_word: יְרֵאוּהוּ
  choice: ఆయనకు భయపడతారు
  rationale: ירא అనే క్రియలో భయం, భక్తిపూర్వక గౌరవం, విస్మయం అనే భావాలు ఉండగలవు. ‘భయపడతారు’ మూలానికి నేరుగా ఉండి, దైవ మహిమకు మానవ స్పందనలోని గంభీరతను నిలుపుతుంది.
- source_word: אֲנָשִׁים
  choice: మనుషులు
  rationale: ఇక్కడ సాధారణంగా మానవులను సూచించే బహువచనం; ఆధునిక తెలుగులో ‘మనుషులు’ సహజంగా, సమగ్రంగా ఉంది.
- source_word: לֹא יִרְאֶה
  choice: లక్ష్యపెట్టడు
  rationale: ראה అక్షరార్థంగా ‘చూడు’ అయినా, ఈ సందర్భంలో పట్టించుకోవడం లేదా అనుకూలంగా పరిగణించడం అనే భావాన్ని ఇవ్వగలదు. ‘లక్ష్యపెట్టడు’ ఆ ప్రయోగార్థాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; అక్షరార్థ ప్రత్యామ్నాయం పాదసూచికలో నిలుపబడింది.
- source_word: כָּל
  choice: వారెవరినీ
  rationale: నిషేధ వాక్యంలో כָּל యొక్క పంపిణీ భావాన్ని ‘ఎవరినీ’ సహజంగా వ్యక్తపరుస్తుంది.
- source_word: חַכְמֵי לֵב
  choice: హృదయంలో జ్ఞానులైన వారు
  rationale: ‘హృదయ జ్ఞానులు’ అనే హెబ్రీయ రూపకాన్ని అర్థమయ్యే తెలుగులో నిలుపుతుంది; మూలంలో స్పష్టంగా లేని ‘తమ దృష్టికి తాము జ్ఞానులు’ అనే భావాన్ని చేర్చదు.
theological_decisions:
- issue: హృదయంలో జ్ఞానులైనవారిని దేవుడు చూడకపోవడం/లక్ష్యపెట్టకపోవడం
  choice: వారెవరినీ ఆయన లక్ష్యపెట్టడు
  alternative: హృదయంలో జ్ఞానులైన వారందరినీ ఆయన చూడడు
  rationale: ఏకవచన క్రియకు అంతర్నిహిత కర్త సందర్భానుసారం దేవుడే. ‘చూడు’ అనే మూలార్థం ఇక్కడ ‘పట్టించుకోను/గౌరవించను’ అనే భావాన్ని ఇవ్వవచ్చు; ప్రధాన పాఠ్యంలో సహజమైన సందర్భార్థాన్ని ఇచ్చి, నిజమైన పదార్థ సందిగ్ధతను పాదసూచికలో ఉంచాం. మానవ జ్ఞానం స్వయంగా దుష్టమని వచనం చెప్పినట్లు అతిగా నిర్ధారించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘హృదయంలో జ్ఞానులు’ అనే మూల రూపకాన్ని కాపాడుతూ, అసహజమైన పదానువాదాన్ని నివారించాం.
