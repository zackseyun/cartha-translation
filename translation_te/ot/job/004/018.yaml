source:
  edition: WLC
  text: הֵ֣ן בַּ֭/עֲבָדָי/ו לֹ֣א יַאֲמִ֑ין וּ֝/בְ/מַלְאָכָ֗י/ו יָשִׂ֥ים תָּהֳלָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/004/018.yaml
  text: Look[a], he puts no trust in his servants[b], and he charges his messengers with error.
translation:
  language: te
  text: 'ఇదిగో, ఆయన తన సేవకులపై నమ్మకం ఉంచడు;

    తన దూతలకు[a] లోపాన్ని[b] ఆపాదిస్తాడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘దేవదూతలకు.’ హీబ్రూ పదం మానవ దూతలను లేదా పరలోక దూతలను సూచించగలదు; ఇక్కడ సందర్భం బహుశా పరలోక జీవులను సూచిస్తుంది.
    reason: alternative_reading
  - marker: b
    text: లేదా ‘తప్పును,’ ‘అవివేకాన్ని,’ ‘దోషాన్ని,’ లేదా ‘అపరిపూర్ణతను.’
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: ఇదిగో
  rationale: శ్రద్ధను ఆకర్షిస్తూ వాక్యాన్ని బలంగా ప్రవేశపెట్టే హీబ్రూ అవ్యయ భావాన్ని ఆధునికమైన, గౌరవప్రదమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בַּעֲבָדָיו
  choice: తన సేవకులపై
  rationale: అמן అనే క్రియతో వచ్చిన ב విశ్వాసానికి పాత్రను సూచిస్తుంది. עֲבָדִים ఇక్కడ సామాజిక బానిసత్వం కంటే దేవునికి లోబడిన సేవకుల పాత్రను సూచిస్తున్నందున ‘సేవకులు’ సహజం.
- source_word: לֹא יַאֲמִין
  choice: నమ్మకం ఉంచడు
  rationale: హిఫీల్ రూపం ఇక్కడ ఒకరిని నిజమని మేధోపరంగా నమ్మడం కంటే వారిపై విశ్వాసం లేదా భరోసా ఉంచడాన్ని సూచిస్తుంది.
- source_word: וּבְמַלְאָכָיו
  choice: తన దూతలకు
  rationale: מַלְאָך మానవ లేదా పరలోక సందేశవాహకుణ్ణి సూచించగలదు. తెలుగు ‘దూత’ కూడా ఆ విస్తృతిని సహజంగా నిలుపుతుంది; సందర్భంలో దేవదూతలు ఉద్దేశించబడి ఉండవచ్చనే విషయాన్ని పాదటిప్పణి తెలుపుతుంది.
- source_word: יָשִׂים
  choice: ఆపాదిస్తాడు
  rationale: שׂים తో ఒక నైరూప్య నామవాచకం వచ్చిన ఈ ప్రయోగం ఏదో ఒక గుణం లేదా దోషాన్ని ఒకరికి అంటగట్టడం, వారి ఖాతాలో వేయడం అనే భావాన్ని ఇస్తుంది.
- source_word: תָּהֳלָה
  choice: లోపం
  rationale: అరుదైన ఈ నామవాచకం తప్పు, అవివేకం, దోషం లేదా అపరిపూర్ణతను సూచించవచ్చు. ‘లోపం’ ఈ అర్థపరిధిని అతిగా నిర్దిష్టం చేయకుండా సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: מַלְאָכָיו ను సాధారణంగా ‘దూతలు’ అని అనువదించాలా, నిర్దిష్టంగా ‘దేవదూతలు’ అని అనువదించాలా
  choice: దూతలు
  alternative: దేవదూతలు
  rationale: మూలపదం ప్రాథమికంగా సందేశవాహకులను సూచించినా, ఈ కవితా సందర్భంలో పరలోక జీవులు ఉద్దేశించబడి ఉండే అవకాశం ఎక్కువ. ‘దూతలు’ మూలపదంలోని నిజమైన విస్తృతిని కాపాడుతుంది; ‘దేవదూతలు’ అనే సందర్భసాధ్యమైన అర్థాన్ని పాదటిప్పణిలో ఇస్తుంది.
- issue: תָּהֳלָה యొక్క అరుదైన అర్థాన్ని ఎంత నిర్దిష్టంగా వ్యక్తం చేయాలి
  choice: లోపం
  alternative: తప్పు; అవివేకం; దోషం; అపరిపూర్ణత
  rationale: ఈ అరుదైన పదం యొక్క ఖచ్చితమైన ఛాయ అనిశ్చితంగా ఉంది. ‘లోపం’ దేవునితో పోలిస్తే ఆయన దూతల్లో ఏదో కొరత లేదా దోషం ఉందనే భావాన్ని నిలుపుతూ, ఒకే వివరణను బలవంతంగా నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కవితా సమాంతరతను ఉంచాం. ‘నమ్మకం ఉంచడు’ సంబంధపరమైన విశ్వాస భావాన్ని, ‘ఆపాదిస్తాడు’ దేవుడు లోపాన్ని వారికి అంటగడుతున్న భావాన్ని సహజంగా తెలియజేస్తాయి. ప్రధాన పాఠంలోని [a], [b] గుర్తులు సంబంధిత పాదటిప్పణులతో నేరుగా సరిపోతాయి.
