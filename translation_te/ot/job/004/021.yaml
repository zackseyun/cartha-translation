source:
  edition: WLC
  text: הֲ/לֹא נִסַּ֣ע יִתְרָ֣/ם בָּ֑/ם יָ֝מ֗וּתוּ וְ/לֹ֣א בְ/חָכְמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/004/021.yaml
  text: Is not their tent-cord pulled up within them? They die[b][a], and not in wisdom.
translation:
  language: te
  text: 'వారిలోని గుడారపు తాడు పీకివేయబడుతుంది కదా?[a]

    వారు జ్ఞానం లేకుండానే చనిపోతారు.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, ‘వారి తాడు వారిలోనుండి తెంపివేయబడుతుంది’; సంప్రదాయ అనువాదం: ‘వారి గొప్పతనం వారిలోనుండి తొలగించబడుతుంది.’ ఇక్కడి హీబ్రూ పదం బహుశా గుడారపు దృశ్యాన్ని—జీవాన్ని నిలిపే తాడు లేదా గుడారపు తాడు పీకివేయబడడాన్ని—సూచిస్తుంది.'
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘జ్ఞానం లేకుండా’ లేదా ‘జ్ఞానం సంపాదించకముందే.’
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: కదా?
  rationale: సమ్మతిని ఆశించే అలంకారప్రశ్న భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: נִסַּע
  choice: పీకివేయబడుతుంది
  rationale: గుడారం కట్టును విప్పేటప్పుడు తాడు లేదా మేకు పీకివేసే దృశ్యాన్ని సూచిస్తుంది; హింసాత్మకంగా ‘చింపివేయడం’ అనే భావాన్ని అనవసరంగా బలపరచదు.
- source_word: יִתְרָם
  choice: వారి గుడారపు తాడు
  rationale: יִתְרָם అనే పదానికి ‘తాడు,’ ప్రత్యేకంగా గుడారపు తాడు అనే అర్థం సాధ్యమవుతుంది; ముందటి వచనంలోని మానవ నివాసపు నశ్వరతతో ఈ దృశ్యం సరిపోతుంది.
- source_word: בם
  choice: వారిలోని
  rationale: ‘వారిలో/వారి అంతరంలో’ అనే హీబ్రూ నిర్మాణాన్ని సంక్షిప్తంగా నిలుపుతూ, జీవాన్ని నిలిపే తాడు వారిలో ఉన్నదనే రూపకాన్ని వ్యక్తం చేస్తుంది.
- source_word: ימותו
  choice: వారు ... చనిపోతారు
  rationale: מות అనే సాధారణ ‘చనిపోవు’ క్రియను అదనపు వ్యాఖ్యానం లేకుండా నేరుగా అనువదిస్తుంది.
- source_word: ולא בחכמה
  choice: జ్ఞానం లేకుండానే
  rationale: హీబ్రూ పదబంధంలోని సంక్షిప్తతను సహజ తెలుగులో అందిస్తుంది; అది జ్ఞానం లేక చనిపోవడమా లేక జ్ఞానం పొందకముందే చనిపోవడమా అనే సాధ్యమైన భావభేదాన్ని పాదసూచికలో ఉంచుతుంది.
