translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన శైలి వాడబడింది. గుడారపు రూపకం ప్రధాన పాఠ్యంలో నిలుపబడింది; చివరి పదబంధంలోని భావసందిగ్ధతను అతిగా పరిష్కరించకుండా పాదసూచికలో ప్రత్యామ్నాయాలు ఇచ్చాం.
