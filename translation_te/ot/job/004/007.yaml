source:
  edition: WLC
  text: זְכָר נָ֗א מִ֤י ה֣וּא נָקִ֣י אָבָ֑ד וְ֝/אֵיפֹ֗ה יְשָׁרִ֥ים נִכְחָֽדוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/004/007.yaml
  text: 'Please remember: who that was innocent ever perished? Or where were the upright cut off?[a][b]'
translation:
  language: te
  text: 'ఒక్కసారి గుర్తుచేసుకో: నిర్దోషిగా[a] ఉండి నశించినవాడు ఎవడు? లేదా యథార్థవంతులు ఎక్కడ నిర్మూలమయ్యారు?[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నిర్దోషిగా’కు బదులుగా ‘దోషరహితుడిగా’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘నిర్మూలమయ్యారు’కు బదులుగా ‘తుడిచివేయబడ్డారు’ లేదా ‘నాశనమయ్యారు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: זְכָר נָא
  choice: ఒక్కసారి గుర్తుచేసుకో
  rationale: זְכָר అనే ఆజ్ఞను נָא మృదువుగా, విజ్ఞాపనాత్మకంగా చేస్తుంది. ఆధునిక తెలుగులో ‘ఒక్కసారి గుర్తుచేసుకో’ ఈ సంభాషణ ధోరణిని సహజంగా తెలియజేస్తుంది.
- source_word: מִי הוּא נָקִי אָבָד
  choice: నిర్దోషిగా ఉండి నశించినవాడు ఎవడు?
  rationale: מִי הוּא ప్రశ్నకు ఉద్ఘాటన ఇస్తుంది; נָקִי దోషరాహిత్యాన్ని, אָבָד నాశనమవడం లేదా నశించడాన్ని సూచిస్తాయి. తెలుగు వాక్యనిర్మాణంలో అలంకారప్రశ్న స్పష్టంగా ఉండేలా అనువదించబడింది.
- source_word: וְאֵיפֹה
  choice: ఎక్కడ
  rationale: సమాంతరమైన రెండో అలంకారప్రశ్నను ప్రవేశపెడుతుంది. తెలుగులో ‘ఎక్కడ’తోనే ఈ సంబంధం సహజంగా స్పష్టమవుతుంది.
- source_word: יְשָׁרִים
  choice: యథార్థవంతులు
  rationale: నైతికంగా నిటారుగా, సరిగా నడుచుకునే వ్యక్తులను సూచించే బహువచన విశేషణం నామవాచకంగా వాడబడింది. ‘యథార్థవంతులు’ గౌరవప్రదమైన ఆధునిక తెలుగు సమానార్థకం.
- source_word: נִכְחָדוּ
  choice: నిర్మూలమయ్యారు
  rationale: כחד నిఫాల్ రూపం కనుమరుగవడం, తుడిచివేయబడడం లేదా నాశనం కావడం అనే ఫలితార్థాన్ని కలిగిస్తుంది. ముందున్న ‘నశించిన’కు సమాంతరంగా ‘నిర్మూలమయ్యారు’ బలమైన భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: నిర్దోషులు, యథార్థవంతుల గతి గురించి ఎలీఫజు చేస్తున్న అలంకారప్రశ్నాత్మక వాదన
  choice: ఎలీఫజు వాదనను ఉన్నట్టుగా నేరుగా ప్రశ్నారూపంలో అందించడం
  alternative: యోబు గ్రంథంలోని తరువాతి పరిణామాల దృష్ట్యా ఈ వాదన వివాదాస్పదమని అనువాదంలోనే సూచించడం
  rationale: మూలవచనం ఎలీఫజు అభిప్రాయాన్ని బలమైన అలంకారప్రశ్నలుగా ఉంచుతుంది. అనువాదం దానిని ముందుగానే సమర్థించకూడదు, అలాగే తరువాతి కథన విమర్శను వచనంలోకి చొప్పించకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ఎలీఫజు పలికే గంభీరమైన అలంకారప్రశ్నల ధోరణిని నిలుపుతూ సాధారణ పాఠకులకు అర్థమయ్యే పదజాలం వాడబడింది. పాదాంతంలోని [a], [b] గుర్తులు సంబంధిత పదాలకు వరుసగా అనుసంధానించబడ్డాయి.
