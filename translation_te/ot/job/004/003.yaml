  text: הִ֭נֵּה יִסַּ֣רְתָּ רַבִּ֑ים וְ/יָדַ֖יִם רָפ֣וֹת תְּחַזֵּֽק׃
base_translation:
  language: en
  yaml_path: translation/ot/job/004/003.yaml
  text: Behold[a], you have instructed many, and you have strengthened weak hands.
translation:
  language: te
  text: ఇదిగో, నీవు అనేకమందికి ఉపదేశించావు[a]; బలహీనమైన చేతులను బలపరిచావు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘క్రమశిక్షణ చేశావు,’ ‘సరిదిద్దావు’; హీబ్రూ క్రియలో దిద్దుబాటు ద్వారా ఉపదేశించే భావం కూడా ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: ఇదిగో
  rationale: తరువాతి మాటపై దృష్టి నిలిపే ఉద్ఘాటన సూచకం; కవితాత్మకమైన గంభీరతను సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: יִסַּרְתָּ
  choice: ఉపదేశించావు
  rationale: יסר అనే క్రియలో దిద్దుబాటు, క్రమశిక్షణ, వాటి ద్వారా బోధించడం అనే భావాలు ఉన్నాయి. ఇక్కడ ఎలీఫజు యోబు గతంలో ఇతరులకు మార్గనిర్దేశం చేసిన విషయాన్ని ప్రశంసిస్తున్నందున ‘ఉపదేశించావు’ సందర్భానికి తగినది; ప్రత్యామ్నాయ భావాలను పాదసూచికలో ఉంచాం.
- source_word: רַבִּים
  choice: అనేకమందికి
  rationale: వ్యక్తులను సూచించే ‘అనేకులు’ అనే పరిమాణార్థాన్ని, తెలుగు వాక్యనిర్మాణానికి తగిన సంప్రదాన రూపంలో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: יָדַיִם רָפוֹת
  choice: బలహీనమైన చేతులను
  rationale: శక్తి తగ్గడం లేదా నిరుత్సాహపడడాన్ని సూచించే శరీర రూపకాన్ని వ్యాఖ్యానించకుండా యథాతథంగా నిలుపుతుంది.
- source_word: תְּחַזֵּק
  choice: బలపరిచావు
  rationale: חזק యొక్క పియేల్ రూపం ‘బలపరచడం’ అని అర్థం. ముందున్న సంపూర్ణ క్రియతో సమాంతరంగా, గతంలో జరిగిన కార్యాన్ని తెలుగులో సహజమైన భూతకాలంతో అందిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కవితాత్మక శైలి. ‘బలహీనమైన చేతులు’ అనే మూలభాషా రూపకాన్ని నిలిపి, దాని భావాన్ని పాఠ్యంలో విప్పి చెప్పలేదు.
