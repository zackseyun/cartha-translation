  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ֭/אֵלַ/י דָּבָ֣ר יְגֻנָּ֑ב וַ/תִּקַּ֥ח אָ֝זְנִ֗/י שֵׁ֣מֶץ מֶֽנְ/הֽוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/004/012.yaml
  text: A word was secretly brought to me[a], and my ear caught a whisper of it.
translation:
  language: te
  text: ఒక మాట నాకు రహస్యంగా చేరింది; నా చెవి దానినుంచి స్వల్ప ధ్వనిని[a] అందుకుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నా చెవి దానినుంచి ఒక స్వల్ప సూచనను గ్రహించింది,” లేదా “దానినుంచి ఒక క్షీణమైన శబ్దాన్ని అందుకుంది.”
    reason: שֵׁמֶץ అనే పదానికి ‘స్వల్ప భాగం,’ ‘సూచన,’ లేదా ‘క్షీణమైన శబ్దం’ అనే భావాలు ఉండవచ్చు.
lexical_decisions:
- source_word: וְאֵלַי
  choice: నా దగ్గరికి
  rationale: ‘మరియు/కాని నా వైపుకు’ అనే భావాన్ని సందర్భానికి సహజమైన గమ్యరూపంలో తెలియజేస్తుంది; మూలంలో లేని కాలసూచక పదాన్ని చేర్చలేదు.
- source_word: דָּבָר
  choice: ఒక మాట
  rationale: ప్రకటన సందర్భంలోని సంక్షిప్తమైన, నిగూఢమైన భావాన్ని నిలుపుతుంది; ‘సందేశం’ అని విస్తరించి వ్యాఖ్యానించదు.
- source_word: יְגֻנָּב
  choice: రహస్యంగా ... వచ్చింది
  rationale: ‘దొంగిలించబడింది’ అనే అక్షరార్థం ఇక్కడ తప్పుదారి పట్టించవచ్చు; నిశ్శబ్దంగా లేదా గుట్టుగా చేరినదనే రూపకాల అర్థాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וַתִּקַּח
  choice: గ్రహించింది
  rationale: ‘తీసుకుంది’ అనే మూలచిత్రాన్ని వినికిడి సందర్భానికి తగిన సహజ తెలుగు రూపంలో అందిస్తుంది.
- source_word: אָזְנִי
  choice: నా చెవి
  rationale: హీబ్రూలోని ఏకవచన శరీరావయవ చిత్రణను నిలుపుతుంది.
- source_word: שֵׁמֶץ
  choice: మెల్లని ధ్వని
  rationale: అతి స్వల్పమైన శబ్దం, గుసగుస, లేదా సూచన అనే పదార్థ పరిధిలో వినికిడి సందర్భానికి తగిన అర్థం; ‘గుసగుస’ కంటే అస్పష్టతను కొంత మెరుగుగా కాపాడుతుంది.
- source_word: מֶנְהוּ
  choice: దానిలోని
  rationale: పూర్వపదమైన ‘మాట’ను సూచిస్తూ ‘దాని నుండి/దానిలోని’ అనే సంబంధాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
