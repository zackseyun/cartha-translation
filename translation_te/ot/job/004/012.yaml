translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన శైలి. హీబ్రూ వాక్యంలోని నిగూఢతను, ఏకవచన ‘నా చెవి’ చిత్రణను నిలిపి, మూలంలో లేని ‘ఇప్పుడు’ వంటి సంభాషణ సూచికను చేర్చలేదు.
