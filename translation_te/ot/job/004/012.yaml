  revision_rationale: The revision corrects the directional/source relation expressed by מֶנְהוּ (‘from it’) and relocates the lexical footnote anchor to שֵׁמֶץ’s rendering. It otherwise preserves the draft’s faithful choice of ‘మాట,’ the stealthy and agent-unspecified arrival, and the singular ‘నా చెవి.’
