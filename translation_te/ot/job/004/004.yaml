  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన కవితా శైలిని ఉపయోగించాం. మూలంలోని శరీరాధారిత సమాంతర చిత్రణ—తడబడే వ్యక్తిని నిలబెట్టడం, కుంగే మోకాళ్లను బలపరచడం—నిలుపబడింది.
