  text: Your words have raised up the one who stumbles[b][a], and you have strengthened knees that were giving way.
translation:
  language: te
  text: నీ మాటలు తడబడుతున్నవానిని నిలబెట్టాయి[a]; కుంగిపోతున్న మోకాళ్లను[b] నీవు బలపరిచావు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘లేపాయి,’ ‘నిలబడేలా చేశాయి.’
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘వంగిపోతున్న మోకాళ్లను’; బలహీనత వల్ల మోకాళ్లు పట్టుతప్పి కూలిపోతున్న భావం.
    reason: lexical_alternative
lexical_decisions:
- source_word: כּוֹשֵׁל
  choice: తడబడుతున్నవాణ్ణి
  rationale: כשל అనే క్రియ యొక్క కృదంత రూపం తడబడుతున్న, తొట్రిల్లుతున్న, పడిపోబోతున్న వ్యక్తిని సూచిస్తుంది. వ్యక్తిని అమూర్తంగా ‘బలహీనుడు’ అని మార్చకుండా మూలంలోని చలన చిత్రణను నిలుపుతుంది.
- source_word: יְקִימוּן
  choice: నిలబెట్టాయి
  rationale: קום యొక్క హిఫీల్ రూపం ‘నిలబడేలా చేయడం, లేపడం, నిలబెట్టడం’ అనే కారణార్థాన్ని ఇస్తుంది. బలహీనమవుతున్న మోకాళ్లను బలపరచడం అనే సమాంతర చిత్రణకు ‘నిలబెట్టాయి’ సహజంగా సరిపోతుంది.
- source_word: מִלֶּיךָ
  choice: నీ మాటలు
  rationale: מִלָּה యొక్క బహువచనం మాటలు లేదా పలుకులను సూచిస్తుంది. ‘నీ మాటలు’ ప్రత్యక్షమైన, సహజమైన అనువాదం.
- source_word: בִרְכַּיִם
  choice: మోకాళ్లను
  rationale: మూలంలోని శరీర భాగాన్ని యథాతథంగా ఉంచడం వల్ల బలహీనతతో కూలిపోతున్న కవితాత్మక చిత్రం నిలుస్తుంది.
- source_word: כֹּרְעוֹת
  choice: కుంగిపోతున్న
  rationale: כרע అంటే వంగడం, మోకరించడం లేదా కిందికి కూలడం. మోకాళ్లతో కలిసినప్పుడు బలహీనత వల్ల అవి పట్టుతప్పుతున్న భావాన్ని ‘కుంగిపోతున్న’ సహజంగా తెలియజేస్తుంది; అక్షరార్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: תְּאַמֵּץ
  choice: నీవు బలపరిచావు
  rationale: אמץ యొక్క పియేల్ రూపం బలపరచడం లేదా దృఢపరచడం అని అర్థం. మొదటి అర్ధపాదంలోని ‘నిలబెట్టాయి’తో ఉన్న కవితా సమాంతరతను ఇది కాపాడుతుంది.
