  text: The lion’s roar[a], and the voice of the fierce lion, and the teeth of the young lions are broken.
translation:
  language: te
  text: సింహపు గర్జన, భీకర సింహపు స్వరమూ, యువ సింహాల పళ్లూ విరగగొట్టబడ్డాయి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పీకివేయబడ్డాయి’ లేదా ‘పెకలించబడ్డాయి.’ హీబ్రూ క్రియ బలవంతంగా తొలగించడం లేదా విరగగొట్టడం అనే భావాన్ని తెలియజేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁאֲגַת
  choice: గర్జన
  rationale: సింహం చేసే బలమైన అరుపును సూచించే సహజమైన, కవితాత్మక తెలుగు పదం.
- source_word: אַרְיֵה
  choice: సింహం
  rationale: సాధారణ హీబ్రూ పదానికి నేరమైన ఆధునిక తెలుగు సమానార్థకం.
- source_word: קוֹל
  choice: స్వరం
  rationale: ‘శబ్దం’ అనే అర్థం సాధ్యమైనా, ‘గర్జన’తో ఉన్న కవితాత్మక సమాంతరతను ‘స్వరం’ మెరుగ్గా నిలుపుతుంది.
- source_word: שָׁחַל
  choice: భీకర సింహం
  rationale: ఇది సింహానికి వాడే కవితాత్మక పదం; దాని బలాన్నీ భయంకర స్వభావాన్నీ సూచిస్తూ, ముందున్న సాధారణ ‘సింహం’ అనే పదం నుండి భేదాన్ని నిలుపుతుంది.
- source_word: שִׁנֵּי
  choice: పళ్లు
  rationale: తరువాతి నామవాచకంతో నిర్మాణ సంబంధంలో ఉన్న ‘పళ్లు’ అనే బహువచన రూపాన్ని సహజంగా అనువదిస్తుంది.
- source_word: כְפִירִים
  choice: యువ సింహాలు
  rationale: నిస్సహాయమైన పిల్లలను కాకుండా బలంగా ఎదుగుతున్న చిన్నవయసు సింహాలను సూచిస్తుంది.
- source_word: נִתָּעוּ
  choice: విరిగిపోయాయి
  rationale: ఈ క్రియ బలవంతంగా పెకలించడం, పీకివేయడం లేదా విరగగొట్టడం అనే భావాన్ని కలిగిస్తుంది. పళ్ల చిత్రానికి ‘విరిగిపోయాయి’ సహజంగా సరిపోతుంది; హీబ్రూ వాక్యంలోని సమన్విత కవితాత్మక నిర్మాణాన్ని కూడా నిలుపుతుంది.
theological_decisions:
- issue: ఒకే క్రియ గర్జన, స్వరం, పళ్లు అనే సమన్విత అంశాలన్నిటికీ వర్తించడం
  choice: హీబ్రూలోని కవితాత్మక అతిశయోక్తిని నిలుపుతూ ‘విరిగిపోయాయి’ అనే ఒకే క్రియను మూడు అంశాలకూ వర్తింపజేయడం
  alternative: గర్జన, స్వరం ‘అణగిపోయాయి’ అని, పళ్లు ‘విరిగిపోయాయి’ అని వేర్వేరు క్రియలతో అనువదించడం
  rationale: వేర్వేరు క్రియలు తెలుగులో సులభంగా ఉన్నా, అవి మూలంలో లేని వివరణను చేర్చి కవితాత్మక ఉద్వేగాన్నీ ఉద్దేశపూర్వక అసాధారణతనూ తగ్గిస్తాయి. ఇక్కడ ఏ ప్రత్యేక సిద్ధాంతార్థాన్నీ చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా కవితాత్మక గాంభీర్యాన్ని నిలిపాం. ‘గర్జనా… స్వరమూ… పళ్లూ’ అనే సమన్విత నిర్మాణం హీబ్రూ పద్యంలోని ఉద్ధృత లయను ప్రతిబింబిస్తుంది.
