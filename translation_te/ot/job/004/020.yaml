source:
  edition: WLC
  text: מִ/בֹּ֣קֶר לָ/עֶ֣רֶב יֻכַּ֑תּוּ מִ/בְּלִ֥י מֵ֝שִׂ֗ים לָ/נֶ֥צַח יֹאבֵֽדוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/004/020.yaml
  text: From morning to evening they are crushed; without anyone taking notice[a], they perish forever.
translation:
  language: te
  text: ఉదయం నుండి సాయంత్రం వరకు వారు చితకొట్టబడతారు; ఎవరూ పట్టించుకోకుండానే[a] వారు శాశ్వతంగా నశించిపోతారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, ‘ఎవరూ శ్రద్ధ చూపకుండానే’; అక్షరార్థ భావం: ‘ఎవరూ దానిని హృదయానికి తీసుకోకుండానే.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבֹּקֶר לָעֶרֶב
  choice: ఉదయం నుండి సాయంత్రం లోపలే
  rationale: ఈ జత కాలవ్యక్తీకరణలు ఒకే రోజు వ్యవధిని సూచించి, మానవ జీవితపు క్షణభంగురతను నొక్కిచెబుతాయి. ‘లోపలే’ అనే పదం ఆ స్వల్ప వ్యవధిలోనే ఇది జరుగుతుందనే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: יֻכַּתּוּ
  choice: వారు నలుగగొట్టబడతారు
  rationale: హొఫల్ రూపంలోని కర్మణి భావాన్ని నిలుపుతూ, కొట్టి నలిపివేయబడడం లేదా ఛిన్నాభిన్నం చేయబడడం అనే బలమైన చిత్రాన్ని ఈ పదబంధం అందిస్తుంది.
- source_word: מִבְּלִי מֵשִׂים
  choice: ఎవరూ పట్టించుకోకుండానే
  rationale: ‘ఉంచడం/పెట్టడం లేకుండా’ అనే సంక్షిప్త హీబ్రూ నుడికారానికి, హృదయంలో ఉంచకపోవడం లేదా శ్రద్ధ చూపకపోవడం అనే భావం ఉంది. ఈ అనువాదం ఆ భావాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: לָנֶצַח
  choice: శాశ్వతంగా
  rationale: ఇక్కడ ఈ పదం నాశనం తిరుగులేనిదనే అంతిమత్వాన్ని బలపరుస్తుంది. మూలంలోని కాలవ్యాప్తిని విస్తరించి వివరించకుండా ‘శాశ్వతంగా’ నిలుపుతుంది.
- source_word: יֹאבֵדוּ
  choice: వారు నశించిపోతారు
  rationale: అבד క్రియలోని నశించడం, అంతరించిపోవడం అనే విస్తృత భావాన్ని నిలుపుతుంది. ‘పోతారు’ కలయిక తెలుగులో అంతిమత్వాన్ని సహజంగా వ్యక్తం చేస్తుంది; ప్రత్యేకమైన పరలోక తీర్పు భావాన్ని చేర్చదు.
theological_decisions:
- issue: ఎలీఫజు మాటల్లో మానవ మరణపు అంతిమత్వం
  choice: ఈ వాక్యాన్ని మానవుల క్షణభంగురతను, ఎవరూ పట్టించుకోని వారి తిరుగులేని నాశనాన్ని తెలిపే ప్రకటనగా అనువదించాం.
  alternative: ‘శాశ్వతంగా’ అనే మాటను అంతిమ పరలోక శిక్షకు సంబంధించిన సిద్ధాంత ప్రకటనగా చదవడం.
  rationale: సందర్భంలో ఎలీఫజు దేవుని ఎదుట మర్త్యుల బలహీనతను వర్ణిస్తున్నాడు. అందువల్ల మూలంలోని ‘శాశ్వతంగా’ అనే బలమైన పదాన్ని అలాగే నిలిపి, దాని పరిధిని వివరణాత్మకంగా పరలోక ఖండనకు విస్తరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనా గంభీరమైన శైలి. సమాంతర కవితా నిర్మాణం, కర్మణి రూపం, మరణపు అంతిమత్వాన్ని తెలిపే తీవ్రత నిలుపబడ్డాయి.
