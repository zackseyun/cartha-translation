reference: Job 4:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: הֲ/נִסָּ֬ה דָבָ֣ר אֵלֶ֣י/ךָ תִּלְאֶ֑ה וַ/עְצֹ֥ר בְּ֝/מִלִּ֗ין מִ֣י יוּכָֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/job/004/002.yaml
  text: If one tries a word with you[a], will you be weary? But who can hold back words?
translation:
  language: te
  text: నీతో ఒక మాట చెప్పడానికి ప్రయత్నిస్తే[a], నీకు విసుగు కలుగుతుందా? కాని మాటలను ఆపుకోకుండా ఉండగలవాడు ఎవరు?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీతో ఒక విషయం మాట్లాడడానికి సాహసిస్తే, నీకు విసుగు కలుగుతుందా?”
    reason: דָבָר అనే పదానికి ‘మాట’తో పాటు ‘విషయం’ అనే అర్థం కూడా ఉంది; נסה ఇక్కడ ‘ప్రయత్నించడం’ లేదా ‘సాహసించడం’ అని అనువదించవచ్చు.
lexical_decisions:
- source_word: הֲנִסָּה
  choice: ప్రయత్నిస్తే
  rationale: נסה అనే క్రియ ఇక్కడ పరీక్షించడం కంటే, యోబుతో మాట్లాడటానికి ప్రయత్నించడం లేదా సాహసించడం అనే భావాన్ని ఇస్తుంది. ప్రశ్నార్థక הֲ భావాన్ని వాక్య నిర్మాణంలో నిలిపాం.
- source_word: דָבָר
  choice: ఒక మాట
  rationale: דברకు ‘మాట,’ ‘విషయం’ అనే రెండు అర్థాలు సాధ్యమైనా, తరువాత వచ్చే ‘మాటలు’తో ఉన్న అనుసంధానం వల్ల ఇక్కడ పలికే మాట అనే భావానికి ప్రాధాన్యం ఇచ్చాం.
- source_word: אֵלֶיךָ
  choice: నీతో
  rationale: అక్షరార్థంగా ‘నీకు/నీ వైపుకు.’ ఆధునిక తెలుగులో ఒకరిని ఉద్దేశించి మాట్లాడే భావాన్ని సహజంగా తెలియజేయడానికి ‘నీతో’ అని అనువదించాం.
- source_word: תִּלְאֶה
  choice: నీకు విసుగు కలుగుతుందా
  rationale: לאה యొక్క మూలభావం అలసిపోవడం లేదా శక్తి తగ్గడం. మాట వినే సందర్భంలో శారీరక అలసటకన్నా వినడానికి విసుగుచెందే భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తూనే, మూలంలోని ‘weary’ భావాన్ని నిలిపాం.
- source_word: וַעְצֹר
  choice: ఆపుకోగలవాడు
  rationale: עצר అంటే అడ్డుకోవడం, నిగ్రహించుకోవడం లేదా వెనక్కి ఆపుకోవడం. ఇక్కడ మాటలు పలకకుండా తనను తాను నిలువరించుకోవడం అనే భావం ఉంది.
- source_word: בְּמִלִּין
  choice: మాటలను
  rationale: అరామీయ ప్రభావమున్న ఈ బహువచన రూపాన్ని తెలుగులో కూడా బహువచనంగానే ఉంచాం; ఇది ముందున్న דברతో ఉద్దేశపూర్వక పదసంబంధాన్ని నిలుపుతుంది.
- source_word: מִי יוּכָל
  choice: ఎవరు ... గలవాడు
  rationale: సామర్థ్యాన్ని సూచించే అలంకారిక ప్రశ్నను తెలుగులో సహజమైన ‘ఎవరు ... గలవాడు?’ నిర్మాణంతో వ్యక్తం చేశాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలిని ఉపయోగించాం. ‘ఒక మాట/మాటలు’ అనే పదప్రతిధ్వనిని నిలిపి, ఎలీఫజు జాగ్రత్తగా మాట మొదలుపెట్టే ధోరణిని సహజంగా వ్యక్తం చేశాం.
