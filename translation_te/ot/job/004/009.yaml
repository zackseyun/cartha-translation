  yaml_path: translation/ot/job/004/009.yaml
  text: By the breath of God they perish[c][b][a], and by the blast of his anger they come to an end.
translation:
  language: te
  text: 'దేవుని శ్వాసవల్ల వారు నశిస్తారు[a];

    ఆయన కోపపు శ్వాసవల్ల వారు అంతమైపోతారు[b][c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దేవుని శ్వాసనుండి వారు నశిస్తారు.’ హీబ్రూ విభక్తి మూలాన్ని లేదా సాధనాన్ని సూచించగలదు; ప్రధాన పాఠంలో కారణం/సాధనం అనే భావంతో అనువదించబడింది.
    reason: lexical_alternative
  - marker: b
    text: ‘శ్వాస’గా అనువదించిన హీబ్రూ పదానికి ‘గాలి,’ ‘ఊపిరి,’ లేదా ‘ఆత్మ’ అనే అర్థాలు కూడా ఉండవచ్చు. ఇక్కడ అది ఆయన కోపంతో ముడిపడిన బలమైన శ్వాస లేదా గాలి అనే కవితాత్మక భావాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘వారు క్షీణించిపోతారు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנִּשְׁמַת
  choice: ఊపిరివల్ల
  rationale: נשמה అంటే ఊపిరి లేదా శ్వాస. ముందున్న מִן ఇక్కడ సాధనం లేదా కారణాన్ని సూచించగలదు; ‘వల్ల’ ఆ భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אֱלוֹהַ
  choice: దేవుని
  rationale: אֱלוֹהַ యోబులో తరచుగా కనిపించే ఏకవచన కవితాత్మక రూపం; అదనపు బిరుదులు చేర్చకుండా ‘దేవుడు’ అనే సాధారణ సమానార్థకాన్ని వాడాం.
- source_word: יֹאבֵדוּ
  choice: వారు నశిస్తారు
  rationale: אבד యొక్క ప్రాథమిక భావం నశించడం లేదా లేకుండాపోవడం. అకర్మక క్రియాభావాన్ని, కవితా సమాంతరతను ఇది నిలుపుతుంది.
- source_word: וּמֵרוּחַ
  choice: ఉచ్ఛ్వాసంవల్ల
  rationale: רוּחַ కు గాలి, ఊపిరి, ఆత్మ వంటి అర్థాలు ఉన్నాయి. ‘ఆయన కోపం’తో కలిసి, మొదటి పాదంలోని ఊపిరి చిత్రాన్ని తీవ్రతరం చేసే బలమైన శ్వాస లేదా విసురు ఇక్కడ ఉద్దేశం; ‘ఉచ్ఛ్వాసం’ ఆ దృశ్యాన్ని తెలుగులో నిలుపుతుంది.
- source_word: אַפּוֹ
  choice: ఆయన కోపపు
  rationale: אַף అక్షరార్థంగా ముక్కు లేదా నాసిక; విస్తృత ప్రయోగంలో కోపం. ఇక్కడ సహజమైన భావం ‘ఆయన కోపం’; శ్వాసకు సంబంధించిన శరీరాత్మక చిత్రం ‘ఉచ్ఛ్వాసం’లో కొంత నిలుస్తుంది.
- source_word: יִכְלוּ
  choice: వారు అంతమైపోతారు
  rationale: כלה యొక్క Qal రూపం ముగిసిపోవడం, అంతమవడం లేదా క్షీణించిపోవడం అని అర్థమివ్వగలదు. ‘అంతమైపోతారు’ ఫలిత భావాన్ని స్పష్టంగా ఉంచి, ‘నశిస్తారు’తో సమాంతరంగా ఉంటుంది.
theological_decisions:
- issue: దేవుని కోపాన్ని సూచించే మానవరూప భాష
  choice: אַפּוֹ ను ‘ఆయన కోపం’గా భావానుసారంగా అనువదించి, ఊపిరి/ఉచ్ఛ్వాస దృశ్యాన్ని నిలుపడం
  alternative: ‘ఆయన నాసికల ఉచ్ఛ్వాసం’ లేదా ‘ఆయన ఉగ్రత’
  rationale: హీబ్రూ పదానికి ‘ముక్కు/నాసిక’ అనే అక్షరార్థమున్నా, ఈ ప్రయోగంలో దాని భావం కోపం. అక్షరార్థ అనువాదం సాధారణ పాఠకునికి భావాన్ని మరుగుపరచవచ్చు; ‘ఉగ్రత’ సాధ్యమైనా మూలంలోని సాధారణ భావం కంటే బలంగా ఉంటుంది. ఎంపిక చేసిన రూపం అర్థస్పష్టతతో పాటు కవితా చిత్రాన్ని కూడా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన కవితా శైలి. రెండు సమాంతర పాదాల నిర్మాణం నిలుపబడింది; ‘ఊపిరి/ఉచ్ఛ్వాసం’ ద్వారా మూలంలోని శ్వాసచిత్రం, ‘నశిస్తారు/అంతమైపోతారు’ ద్వారా ఫలిత సమాంతరత కాపాడబడ్డాయి.
