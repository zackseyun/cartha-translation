id: JOB.4.17
reference: Job 4:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: הַֽ֭/אֱנוֹשׁ מֵ/אֱל֣וֹהַ יִצְדָּ֑ק אִ֥ם מֵ֝/עֹשֵׂ֗/הוּ יִטְהַר גָּֽבֶר־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/004/017.yaml
  text: Can mortal man be in the right before God? Can a man be pure before his Maker?[a]
translation:
  language: te
  text: మర్త్యుడు దేవుని ఎదుట నీతిమంతుడిగా నిలవగలడా? మనిషి తన సృష్టికర్త ఎదుట నిర్మలుడిగా ఉండగలడా?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, మరింత అక్షరానుసారంగా: “దేవునికంటే మర్త్యుడు నీతిమంతుడు కాగలడా? తన సృష్టికర్తకంటే మనిషి నిర్మలుడు కాగలడా?”'
    reason: מן అనే విభక్తి సూచకానికి ఇక్కడ సంబంధార్థంతో పాటు తులనార్థం కూడా సాధ్యమైనందున ప్రత్యామ్నాయ పఠనాన్ని నిలుపుతుంది.
lexical_decisions:
- source_word: הַאֱנוֹשׁ
  choice: మర్త్యుడు
  rationale: אֱנוֹשׁ ఇక్కడ మానవుని నశ్వరతను, బలహీనతను సూచిస్తుంది. ‘మర్త్యుడు’ దేవునితో ఉన్న వ్యత్యాసాన్ని సంక్షిప్తంగా, సహజంగా నిలుపుతుంది.
- source_word: מֵאֱלוֹהַ
  choice: దేవుని ఎదుట
  rationale: צדקతో కూడిన מן‌ను సందర్భానుసారంగా దేవుని సన్నిధిలో లేదా ఆయనతో సంబంధంలో న్యాయస్థితిని సూచించేలా అనువదించాం. నేరుగా కనిపించే తులనార్థాన్ని పాదటిప్పణిలో నిలిపాం.
- source_word: יִצְדָּק
  choice: నీతిమంతుడిగా నిలవగలడా
  rationale: צדקలోని న్యాయపరమైన, సంబంధపరమైన భావాన్ని ‘నీతిమంతుడిగా నిలవడం’ సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: אִם
  choice: మనిషి ... ఉండగలడా?
  rationale: కావ్య సమాంతర నిర్మాణంలో אִם రెండవ ప్రశ్నను ప్రవేశపెడుతుంది. తెలుగులో ప్రశ్నను పునరావృతం చేయడం దాని అలంకారిక బలాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: מֵעֹשֵׂהוּ
  choice: తన సృష్టికర్త ఎదుట
  rationale: עֹשֵׂהוּ అంటే ‘అతనిని చేసినవాడు/అతని సృష్టికర్త’. ‘తన సృష్టికర్త’ సృష్టికర్త–సృష్టి వ్యత్యాసాన్ని గౌరవప్రదంగా తెలియజేస్తుంది; מן‌కు ఇచ్చిన సంబంధార్థం మొదటి పాదంతో సమాంతరంగా ఉంది.
- source_word: יִטְהַר
  choice: నిర్మలుడిగా ఉండగలడా
  rationale: טהר శుద్ధత లేదా మలినరాహిత్యాన్ని సూచిస్తుంది. ‘నిర్మలుడు’ నైతిక-ఆధ్యాత్మిక భావాన్ని తెలిపినా, ‘పరిశుద్ధుడు’ అనే మరింత ప్రత్యేక పదార్థాన్ని అనవసరంగా రుద్దదు.
- source_word: גָּבֶר
  choice: మనిషి
  rationale: గָּבֶר పురుష ఏకవచన పదమైనా, ఇక్కడ אֱנוֹשׁకు కావ్య సమాంతరంగా మానవుణ్ణి సూచిస్తుంది. ‘మనిషి’ సాధారణ ఆధునిక తెలుగులో సహజంగా ఉంటుంది; ‘బలవంతుడు’ అని అనువదించడం సందర్భానికి మించిన భావాన్ని తెస్తుంది.
theological_decisions:
- issue: దేవునితో పోల్చినప్పుడు లేదా దేవుని ఎదుట మానవుని న్యాయస్థితి
  choice: మర్త్యుడు దేవుని ఎదుట నీతిమంతుడిగా నిలవగలడా అనే సంబంధపరమైన అలంకారిక ప్రశ్న
  alternative: మర్త్యుడు దేవునికంటే ఎక్కువ నీతిమంతుడు కాగలడా అనే నేర తులన
  rationale: מן నిర్మాణం తులనార్థకంగానూ, సందర్భానుసార సంబంధార్థకంగానూ గ్రహించవచ్చు. ప్రధాన పాఠం మానవుడు దేవుని ఎదుట నీతిమంతుడిగా లేదా నిర్మలుడిగా నిలవగలడా అనే భావాన్ని సహజంగా వ్యక్తం చేస్తుంది. అయితే హెబ్రీలోని నిజమైన తులనాత్మక అవకాశాన్ని పాదటిప్పణిలో భద్రపరిచాం; తరువాతి సిద్ధాంత సూత్రీకరణను పాఠ్యంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కావ్య ప్రశ్నలుగా రూపొందించాం. ‘మర్త్యుడు’ మానవ బలహీనతను నిలుపుతుంది; ‘నీతిమంతుడిగా నిలవడం’ న్యాయపరమైన ఛాయను, ‘నిర్మలుడు’ శుద్ధత భావాన్ని స్పష్టంగా వ్యక్తం చేస్తాయి.
