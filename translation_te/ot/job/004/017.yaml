  source_fidelity: హెబ్రీ కవితా ప్రశ్నల సమాంతర నిర్మాణాన్ని అనువాదం సరిగ్గా నిలుపుతుంది. אֱנוֹשׁ యొక్క మర్త్యతా ఛాయను ‘మర్త్యుడు’ ద్వారా, צדק యొక్క దేవునితో సంబంధమైన న్యాయస్థితిని ‘దేవుని ఎదుట నీతిమంతుడిగా నిలవడం’ ద్వారా, טהר యొక్క శుద్ధతను ‘నిర్మలుడు’ ద్వారా తగిన విధంగా వ్యక్తం చేసింది. מן యొక్క తులనాత్మక అవకాశాన్ని పాదటిప్పణి సంరక్షిస్తుంది.
