source:
  edition: WLC
  text: יַעֲמֹ֤ד וְֽ/לֹא אַכִּ֬יר מַרְאֵ֗/הוּ תְּ֭מוּנָה לְ/נֶ֣גֶד עֵינָ֑/י דְּמָמָ֖ה וָ/ק֣וֹל אֶשְׁמָֽע׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/004/016.yaml
  text: 'It stood still[a], but I could not recognize its appearance; a form was before my eyes; there was silence[b], and I heard a voice:'
translation:
  language: te
  text: 'అది నిశ్చలంగా నిలిచింది; కానీ దాని రూపాన్ని[a] నేను గుర్తించలేకపోయాను. నా కళ్లముందు ఒక ఆకారం ఉంది; నిశ్శబ్దం నెలకొంది,[b] ఒక స్వరం నాకు వినిపించింది:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘అతని రూపాన్ని.’ హెబ్రీ ప్రత్యయం పుంలింగ ఏకవచనంలో ఉంది; అయితే అది సూచించే దర్శన ఆకారం ఏమిటో తెలియదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘నిశ్చలత.’ హెబ్రీ పదం నిశ్శబ్దాన్ని లేదా అణగిన ప్రశాంత నిశ్చలతను సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעֲמֹד
  choice: నిశ్చలంగా నిలిచింది
  rationale: עמד అంటే ‘నిలుచుట’ లేదా ‘నిలిచి ఉండుట.’ దర్శన సందర్భంలో ఆ ఆకారం కదలకుండా ఎదుట నిలిచిందనే భావాన్ని ఈ ప్రయోగం సహజంగా తెలియజేస్తుంది.
- source_word: וְלֹא אַכִּיר
  choice: కానీ ... నేను గుర్తించలేకపోయాను
  rationale: Hiphil రూపంలోని נכר ఇక్కడ ‘గుర్తించుట/ఎవరో నిర్ధారించుట’ అనే అర్థం ఇస్తుంది. ఎదుట ఆకారం ఉన్నప్పటికీ దానిని గుర్తించలేకపోవడాన్ని ‘కానీ’ స్పష్టం చేస్తుంది.
- source_word: מַרְאֵהוּ
  choice: దాని రూపాన్ని
  rationale: מַרְאֶה కనిపించే రూపం లేదా రూపురేఖలను సూచిస్తుంది. హెబ్రీలో ప్రత్యయం పుంలింగ ఏకవచనమైనా, దర్శనంలోని ఆకారం ఎవరో తెలియదు; అందువల్ల ‘దాని’ ఆ అనిశ్చితిని కాపాడుతుంది.
- source_word: תְּמוּנָה
  choice: ఒక ఆకారం
  rationale: תמונה అంటే రూపం, పోలిక లేదా ఆకారం. స్పష్టంగా గుర్తించలేని దృశ్యరూపానికి ‘ఆకారం’ సహజమైన ఆధునిక తెలుగు పదం.
- source_word: לְנֶגֶד עֵינָי
  choice: నా కళ్లముందు ... ఉంది
  rationale: మూలంలోని ‘నా కళ్ల ఎదుట’ అనే సజీవ భావాన్ని సహజమైన తెలుగు వాక్యనిర్మాణంలో నిలుపుతుంది.
- source_word: דְּמָמָה
  choice: నిశ్శబ్దం అలుముకుంది
  rationale: דממה నిశ్శబ్దం, నిశ్చలత లేదా అణగిన ప్రశాంతతను సూచించగలదు. స్వరం వినిపించడానికి ముందు ఏర్పడిన మౌన విరామాన్ని ఈ ప్రయోగం సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וָקוֹל אֶשְׁמָע
  choice: అప్పుడు నాకు ఒక స్వరం వినిపించింది
  rationale: קוֹל ‘స్వరం’ లేదా ‘శబ్దం’ కావచ్చు. తరువాత పలికే మాటలు ఉన్నందున ‘స్వరం’ సందర్భోచితం; ‘అప్పుడు’ సంఘటనల క్రమాన్ని సహజంగా తెలుపుతుంది.
theological_decisions:
- issue: దర్శన ఆకారాన్ని వ్యక్తిగా నిర్ధారించాలా?
  choice: ‘దాని’ అని అనిశ్చితంగా ఉంచడం
  alternative: ‘అతని’ అని వ్యక్తిగత పుంలింగంగా అనువదించడం
  rationale: హెబ్రీ ప్రత్యయం పుంలింగ ఏకవచనమైనా దాని పూర్వపదార్థం గుర్తించబడని దర్శన ఆకారం. దానిని నిర్దిష్ట వ్యక్తిగా లేదా దైవిక సత్తగా నిర్ణయించకుండా మూలంలోని ఉద్విగ్న అనిశ్చితిని కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనా సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. దర్శనంలోని అస్పష్టతను ‘అది/దాని/ఆకారం’తో నిలిపి, స్వరం వినిపించే ముందు మౌన వాతావరణాన్ని సహజంగా వ్యక్తం చేశాం.
