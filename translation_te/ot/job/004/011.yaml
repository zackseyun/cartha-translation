translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామెతాత్మక కవితా సంక్షిప్తతను కాపాడుతూ అనువదించబడింది. ‘వేట దొరకక’ సాధారణ పాఠకునికి సహజంగా ఉండి, prey లేకపోవడం వల్ల నశించడం అనే కారణ సంబంధాన్ని స్పష్టం చేస్తుంది. לָבִיא యొక్క లింగ అనిశ్చితిని ప్రధాన పాఠంలో తటస్థంగా ఉంచి పాదటిప్పణిలో తెలిపాం.
