  text: The lion perishes for lack of prey[a], and the cubs of the lion are scattered.
translation:
  language: te
  text: వేట దొరకక సింహం నశించిపోతుంది; సింహపు పిల్లలు[a] చెదరిపోతాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘సింహి పిల్లలు’; לָבִיא అనే హీబ్రూ పదం ‘సింహం’ లేదా ‘సింహి’ అని అర్థం కావచ్చు. ఈ వాక్యంలో సింహానికి వాడిన హీబ్రూ పదాలు వేర్వేరు భావఛాయలు కలిగినవి.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַיִשׁ
  choice: సింహం
  rationale: ఈ పదం బలమైన లేదా పరిపక్వమైన సింహాన్ని సూచించవచ్చు; సందర్భం స్పష్టంగా చెప్పని వయస్సు లేదా బలం వంటి భావాలను అదనంగా చేర్చకుండా సాధారణమైన ‘సింహం’ అని అనువదించాం.
- source_word: אֹבֵד
  choice: నశించిపోతుంది
  rationale: אבד ఇక్కడ నాశనమవడం లేదా అంతమవడం అనే సామెతాత్మక, కవితాత్మక భావాన్ని ఇస్తుంది; ‘చనిపోతుంది’ కంటే ‘నశించిపోతుంది’ ఆ తీవ్రతను కాపాడుతుంది.
- source_word: מִבְּלִי
  choice: దొరకక
  rationale: లేమి వల్ల కలిగే ఫలితాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; మూలంలోని ‘లేకపోవడం వల్ల’ అనే సంబంధాన్ని నిలుపుతుంది.
- source_word: טָרֶף
  choice: వేట
  rationale: ఇది సాధారణ ఆహారం కాకుండా మృగం పట్టుకొని తినే preyని సూచిస్తుంది; సింహపు రూపకానికి తెలుగులో ‘వేట’ సహజంగా సరిపోతుంది.
- source_word: בְנֵי
  choice: పిల్లలు
  rationale: అక్షరార్థంగా ‘కుమారులు’ అయినా, జంతువుల సంతానాన్ని తెలుగులో సహజంగా ‘పిల్లలు’ అంటారు.
- source_word: לָבִיא
  choice: సింహపు
  rationale: לָבִיא సింహాన్ని లేదా సింహిని సూచించగలదు. ప్రధాన పాఠంలో లింగాన్ని నిర్దిష్టం చేయకుండా ‘సింహపు’ అని ఉంచి మూలంలోని అనిశ్చితిని కాపాడాం.
- source_word: יִתְפָּרָדוּ
  choice: చెదరిపోతాయి
  rationale: ఈ క్రియ విడిపోవడం లేదా చెల్లాచెదరవడం సూచిస్తుంది; కుటుంబ/గుంపు ఐక్యత భంగమయ్యే ఫలితాన్ని ‘చెదరిపోతాయి’ సహజంగా వ్యక్తం చేస్తుంది.
