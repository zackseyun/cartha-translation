  yaml_path: translation/ot/job/004/013.yaml
  text: Amid disquieting thoughts from visions of the night[a], when deep sleep falls on men[b],
translation:
  language: te
  text: రాత్రి దర్శనాల నుంచి వచ్చిన కలవరపరిచే ఆలోచనల మధ్య[a], మనుషులపై గాఢనిద్ర పడే వేళ[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “రాత్రి దర్శనాల వల్ల కలిగిన ఆందోళనకరమైన ఆలోచనల మధ్య.”
    reason: lexical_alternative
  - marker: b
    text: హెబ్రీలో ఇక్కడ ఉన్న పదం వ్యాకరణపరంగా పుంలింగ బహువచనం; ఈ సందర్భంలో అది సాధారణంగా మానవులను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשְׂעִפִּים
  choice: కలవరపరిచే ఆలోచనల మధ్య
  rationale: שְׂעִפִּים అనే పదం చీలికగల, అశాంతికరమైన లేదా కలవరపరిచే తలపులను సూచిస్తుంది. సందర్భంలోని రాత్రివేళ భయాందోళనను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: מֵחֶזְיֹנוֹת לָיְלָה
  choice: రాత్రి దర్శనాల నుంచి వచ్చిన
  rationale: חֶזְיֹנוֹת అంటే ‘దర్శనాలు’; לָיְלָהతో కలిసి ‘రాత్రి దర్శనాలు’ అని అర్థం. מִן వాటి నుంచి ఆ ఆలోచనలు పుట్టిన మూలాన్ని లేదా సందర్భాన్ని సూచిస్తుంది.
- source_word: בִּנְפֹל
  choice: పడే వేళ
  rationale: בְּతో కూడిన క్రియానామ రూపం కాలాన్ని సూచిస్తుంది. ‘పడే వేళ’ అనే ప్రయోగం ఆ కాలసంబంధాన్ని స్పష్టంగా, సహజంగా నిలుపుతుంది.
- source_word: תַּרְדֵּמָה
  choice: గాఢనిద్ర
  rationale: ఇది సాధారణ నిద్రకంటే భారమైన లేదా లోతైన నిద్రను సూచిస్తుంది; ‘గాఢనిద్ర’ ఖచ్చితమైన, సులభమైన తెలుగు పదం.
- source_word: עַל אֲנָשִׁים
  choice: మనుషుల మీద
  rationale: אֲנָשִׁים రూపపరంగా పుంలింగ బహువచనమైనా ఇక్కడ సాధారణంగా మానవులను సూచిస్తుంది. ‘మనుషులు’ తెలుగులో సహజంగా ఆ సాధారణ భావాన్ని తెలియజేస్తుంది; ‘మీద’ עַל యొక్క రూపకాన్ని నిలుపుతుంది.
theological_decisions:
- issue: אֲנָשִׁים యొక్క లింగసూచన మరియు సాధారణ మానవార్థం
  choice: మనుషులు
  alternative: పురుషులు
  rationale: హెబ్రీ రూపం వ్యాకరణపరంగా పుంలింగమైనా సందర్భంలో మానవులందరినీ సాధారణంగా సూచిస్తుంది. ప్రధాన పాఠంలో సహజమైన సాధారణార్థాన్ని ఉంచి, రూపపరమైన ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరతను నిలుపుతూ సాధారణ పాఠకులకు సులభంగా ఉండే పదాలను ఎంచుకున్నాం. ఇది తరువాతి వాక్యంతో కొనసాగే కవితా భాగం కావడంతో చివర కామాను ఉంచాం.
