source:
  edition: WLC
  text: הֲ/לֹ֣א יִ֭רְאָתְ/ךָ כִּסְלָתֶ֑/ךָ תִּ֝קְוָתְ/ךָ֗ וְ/תֹ֣ם דְּרָכֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/004/006.yaml
  text: Is not your fear of God your confidence[c][b][a], and the integrity of your ways your hope?
translation:
  language: te
  text: 'దేవునిపట్ల నీ భయభక్తి నీ భరోసా కాదా?[a][b]

    నీ మార్గాల యథార్థతే నీ నిరీక్షణ కాదా?[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీ భయభక్తి”; హీబ్రూలో భయానికి సంబంధించిన కర్మ స్పష్టంగా చెప్పబడలేదు, అయితే జ్ఞానసాహిత్యంలో ఇది సాధారణంగా దేవునిపట్ల భయాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: “నీ భరోసా”కు బదులుగా “నీ నమ్మకం” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: “నీ మార్గాల యథార్థత”కు బదులుగా “నీ మార్గాల నిందారహితత్వం” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: కాదా?
  rationale: అంగీకారాన్ని ఆశించే హీబ్రూ అలంకారప్రశ్నను తెలుగులో సహజంగా, గంభీరంగా వ్యక్తం చేస్తుంది.
- source_word: יִרְאָתְךָ
  choice: దేవునిపట్ల నీకున్న భయభక్తి
  rationale: మూలంలో భయానికి సంబంధించిన కర్మ స్పష్టంగా లేకపోయినా, జ్ఞానసాహిత్య సందర్భంలో అది సాధారణంగా దేవునిపట్ల భయాన్ని సూచిస్తుంది. ‘భయభక్తి’ భయంతో కూడిన గౌరవాన్ని సహజ తెలుగులో తెలియజేస్తుంది; చేర్చిన ‘దేవునిపట్ల’ భావాన్ని పాదసూచికలో స్పష్టం చేశాం.
- source_word: כִּסְלָתֶךָ
  choice: నీ ధైర్యం
  rationale: ఈ సందర్భంలో పదం మూర్ఖత్వాన్ని కాక నమ్మకం లేదా ఆత్మవిశ్వాసాన్ని సూచిస్తుంది. ‘ధైర్యం’ తెలుగులో సందర్భానుకూలంగా ఆధారభావంతో కూడిన నిబ్బరాన్ని తెలియజేస్తుంది; ‘నీ నమ్మకం’ ప్రత్యామ్నాయంగా పాదసూచికలో ఉంది.
- source_word: תִּקְוָתְךָ
  choice: నీ నిరీక్షణ
  rationale: תקוה యొక్క ఆశతో ఎదురుచూసే భావాన్ని గంభీరమైన, సాధారణ బైబిలు తెలుగులో కాపాడుతుంది.
- source_word: וְתֹם
  choice: యథార్థతే
  rationale: תם ఇక్కడ సంపూర్ణత, నిందారహితత్వం లేదా నైతిక సమగ్రతను సూచిస్తుంది. ‘యథార్థత’ అతిశయమైన పాపరాహిత్యాన్ని నిర్బంధించకుండా నైతిక నిష్కపటతను తెలుపుతుంది.
- source_word: דְּרָכֶיךָ
  choice: నీ మార్గాల
  rationale: జ్ఞానసాహిత్యంలో ప్రవర్తనకు వాడే ‘మార్గాలు’ అనే హీబ్రూ రూపకాన్ని నిలుపుతుంది.
theological_decisions:
- issue: ‘భయం’ యొక్క అవ్యక్త కర్మ
  choice: ప్రధాన పాఠ్యంలో ‘దేవునిపట్ల ... భయభక్తి’
  alternative: ‘నీ భయం’ లేదా ‘నీ భయభక్తి’
  rationale: హీబ్రూ మూలం కర్మను నేరుగా పేర్కొనదు; అయితే జ్ఞానసాహిత్య సందర్భం దేవునిపట్ల భయాన్ని బలంగా సూచిస్తుంది. స్పష్టీకరణను ప్రధాన పాఠ్యంలో ఉంచి, మూలంలోని సంక్షిప్తతను పాదసూచికలో కాపాడాం.
- issue: నాలుగు నామపదబంధాల వాక్యనిర్మాణ సంబంధం
  choice: రెండు సమాంతర నామవాక్యాలుగా అనువదించడం
  alternative: ‘నీ భయభక్తి నీ ధైర్యం, నీ నిరీక్షణ, నీ మార్గాల యథార్థత కాదా?’ అన్న ఒకే జాబితాగా చదవడం
  rationale: హీబ్రూ కవితా సమతుల్యత ‘నీ భయం—నీ ధైర్యం’ మరియు ‘నీ మార్గాల యథార్థత—నీ నిరీక్షణ’ అనే రెండు జతలను సహజంగా సూచిస్తుంది.
- issue: תם యొక్క నైతిక విస్తృతి
  choice: యథార్థత
  alternative: నిందారహితత్వం
  rationale: ‘యథార్థత’ నైతిక సమగ్రతను తెలియజేస్తూ, సందర్భం తప్పనిసరిగా కోరని సంపూర్ణ పాపరాహిత్య భావాన్ని రుద్దదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరమైన కవితా శైలిని ఉపయోగించాం. రెండు సమాంతర ప్రశ్నలుగా పాద విభజన చేసి హీబ్రూ జ్ఞానకవిత్వ నిర్మాణాన్ని స్పష్టం చేశాం. ‘భయభక్తి’, ‘నిరీక్షణ’, ‘మార్గాలు’ వంటి పదాలు సాధారణ పాఠకునికి అర్థమయ్యే బైబిలు రిజిస్టర్‌ను నిలుపుతాయి.
