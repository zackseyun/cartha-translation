translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరతను నిలిపే శైలి ఉపయోగించబడింది. ‘నా ముఖం ఎదుటగా’ మూలంలోని స్పష్టమైన దృశ్యాన్ని కాపాడుతుంది; ‘నిక్కబొడుచుకున్నాయి’ భయ స్పందనను సాధారణ పాఠకునికి వెంటనే అర్థమయ్యేలా వ్యక్తం చేస్తుంది.
