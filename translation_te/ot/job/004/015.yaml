  yaml_path: translation/ot/job/004/015.yaml
  text: Then a spirit passed before my face[a]; the hair of my flesh bristled.
translation:
  language: te
  text: అప్పుడు ఒక ఆత్మ నా ముఖం ఎదుటగా దాటిపోయింది[a]; నా శరీరంలోని వెంట్రుకలు నిక్కబొడుచుకున్నాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఒక గాలి’ లేదా ‘ఒక శ్వాస’ నా ముఖం ఎదుటగా దాటిపోయింది. రוּחַ అనే హీబ్రూ పదానికి ‘ఆత్మ,’ ‘గాలి,’ లేదా ‘శ్వాస’ అనే అర్థాలు ఉండవచ్చు; ఇక్కడి సందర్భం ‘ఆత్మ’ అనే అర్థానికే ఎక్కువగా అనుకూలిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרוּחַ
  choice: ఒక ఆత్మ
  rationale: רוּחַ అనే పదానికి ‘ఆత్మ,’ ‘గాలి,’ ‘శ్వాస’ అనే అర్థాలు ఉండవచ్చు. భయాన్ని కలిగించే రహస్యమైన ప్రత్యక్షతను వర్ణిస్తున్న ఈ సందర్భంలో ‘ఆత్మ’ ప్రధాన భావానికి బాగా సరిపోతుంది. హీబ్రూలో నిర్దిష్టత లేకపోవడాన్ని ‘ఒక’ తెలియజేస్తుంది.
- source_word: עַל פָּנַי
  choice: నా ముఖం ఎదుటగా
  rationale: అక్షరార్థంగా ‘నా ముఖం మీద/పై’ అయినా, יחלף అనే చలన క్రియతో కలిసి ఇది వక్త ముఖం ముందుగా దాటిపోవడాన్ని సూచిస్తుంది. ‘ఎదుటగా’ దృశ్యాన్ని నిలుపుతూ తెలుగులో సహజంగా ఉంటుంది.
- source_word: יַחֲלֹף
  choice: దాటిపోయింది
  rationale: חלף అంటే దాటిపోవడం లేదా పక్కగా వెళ్లిపోవడం. ‘నా ముఖం ఎదుటగా’ అనే పదబంధంతో ‘దాటిపోయింది’ చలనాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: תְּסַמֵּר
  choice: నిక్కబొడుచుకున్నాయి
  rationale: ఈ క్రియ గట్టిపడేలా లేదా నిలువుగా అయ్యేలా చేయడాన్ని సూచిస్తుంది. వెంట్రుకల సందర్భంలో ‘నిక్కబొడుచుకున్నాయి’ భయంతో అవి నిలువబడిన దృశ్యాన్ని ఆధునిక తెలుగులో స్పష్టంగా, సజీవంగా వ్యక్తం చేస్తుంది.
- source_word: שַׂעֲרַת בְּשָׂרִי
  choice: నా శరీరంలోని వెంట్రుకలు
  rationale: అక్షరార్థం ‘నా మాంసపు వెంట్రుక.’ తెలుగులో ‘నా శరీరంలోని వెంట్రుకలు’ సమూహార్థాన్ని సహజంగా తెలియజేస్తూ, శరీరంపై వెంట్రుకలు నిక్కబొడుచుకున్న దృశ్యాన్ని కాపాడుతుంది.
