  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. హీబ్రూ సంభాషణ సూత్రంలోని భావాన్ని నిలుపుతూ, ‘జవాబిచ్చి చెప్పాడు’ వంటి అసహజ పునరుక్తిని నివారించాం.
