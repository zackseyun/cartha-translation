  yaml_path: translation/ot/job/004/014.yaml
  text: Fear came upon me[a], and trembling, and it made all my bones shake.
translation:
  language: te
  text: 'భయం నన్ను ఆవరించింది, వణుకు పుట్టింది;

    అది నా ఎముకలన్నిటినీ గడగడలాడించింది.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “నా ఎముకల సమూహాన్ని భయపెట్టింది” అని ఉంది. “ఎముకల సమూహం” అనేది శరీరమంతటా కలిగిన తీవ్రమైన ప్రతిస్పందనను తెలిపే సజీవమైన కవితా ప్రయోగం. సందర్భానుసారం, “నా ఎముకలను వణికించింది” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּחַד
  choice: భయం
  rationale: ఈ నామవాచకం భయం లేదా భీతిని సూచిస్తుంది. సందర్భాన్ని అతిశయింపకుండా అనుభవంలోని తీవ్రతను సహజంగా తెలియజేయడానికి ‘భయం’ ఎంచుకోబడింది.
- source_word: קְרָאַנִי
  choice: నన్ను ఆవరించింది
  rationale: ఇక్కడ קרא అనే క్రియకు ‘ఎదురవడం, సంభవించడం, మీదికి రావడం’ అనే భావం ఉంది. అకస్మాత్తుగా కలిగిన అనుభవాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేయడానికి ‘నన్ను ఆవరించింది’ వాడబడింది; ‘నన్ను పిలిచింది’ ఈ సందర్భంలోని సమాంతర భావానికి సరిపోదు.
- source_word: וּרְעָדָה
  choice: వణుకు పుట్టింది
  rationale: ఈ పదం భయంతో కలిగే శారీరక కంపనాన్ని సూచిస్తుంది. నామవాచక రూపాన్ని యాంత్రికంగా ఉంచకుండా, తెలుగులో సహజమైన కవితాత్మక వాక్యంగా ‘వణుకు పుట్టింది’ అని అనువదించబడింది.
- source_word: וְרֹב עַצְמוֹתַי
  choice: నా ఎముకలన్నిటినీ
  rationale: రֹב అనే పదానికి అక్షరార్థంగా ‘సమృద్ధి, సమూహం, అధిక సంఖ్య’ అనే భావం ఉంది. ఎముకలతో కలిసినప్పుడు శరీరమంతటా కలిగిన తీవ్రమైన ప్రతిస్పందనను సూచిస్తుంది. ప్రధాన పాఠ్యంలో సహజమైన ‘నా ఎముకలన్నిటినీ’ వాడి, మూలంలోని అసాధారణ చిత్రాన్ని పాదసూచికలో తెలియజేశాం.
- source_word: הִפְחִיד
  choice: గడగడలాడించింది
  rationale: פחד యొక్క హిఫీల్ రూపం భయాన్ని కలిగించే కారణార్థక భావాన్ని ఇస్తుంది. దాని కర్మ ‘నా ఎముకలు’ కావడంతో, శారీరక ఫలితాన్ని తెలుగులో స్పష్టంగా, సజీవంగా తెలిపేందుకు ‘గడగడలాడించింది’ ఎంచుకోబడింది.
