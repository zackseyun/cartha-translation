translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కవితా శైలి పాటించబడింది. మూలంలోని శారీరక చిత్రమైన ‘ఎముకలు’ నిలుపబడింది; రֹב עַצְמוֹתַי లోని అసాధారణ హీబ్రూ నిర్మాణం ప్రధాన పాఠ్యంలో సులభతరం చేసి పాదసూచికలో వివరించబడింది.
