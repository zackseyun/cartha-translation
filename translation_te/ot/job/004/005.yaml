  text: But now it comes to you[a], and you are weary; it touches you[b], and you are dismayed.
translation:
  language: te
  text: కాని ఇప్పుడు అది నీ దగ్గరికి వస్తే[a] నీవు అలసిపోతావు; అది నిన్ను తాకితే[b] నీవు కలవరపడతావు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఎందుకంటే ఇప్పుడు అది నీ దగ్గరికి వస్తుంది.” ఇక్కడి హీబ్రూ సంధిపదం כִּי కి అనేక అర్థాలు సాధ్యం; సందర్భంలోని వ్యత్యాసాన్ని చూపడానికి ప్రధాన పాఠంలో “కాని” అని అనువదించాం.
    reason: lexical_alternative
  - marker: b
    text: “వస్తుంది,” “తాకుతుంది” అనే హీబ్రూ క్రియలు స్త్రీలింగ ఏకవచనంలో ఉన్నాయి. స్పష్టంగా పేర్కొనని ఆపద లేదా కష్టం వాటి కర్తగా ఉద్దేశించబడి ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: కాని
  rationale: మునుపు యోబు ఇతరులను బలపరిచిన తీరుకూ, ఇప్పుడు కష్టం తనకు వచ్చినప్పుడు అతని ప్రతిస్పందనకూ మధ్య ఉన్న వ్యత్యాసాన్ని సందర్భానుసారంగా తెలియజేస్తుంది. ‘ఎందుకంటే’ అనే అర్థం కూడా సాధ్యమే కాబట్టి దాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: עַתָּה
  choice: ఇప్పుడు
  rationale: యోబు గత ప్రవర్తనతో అతని ప్రస్తుత పరిస్థితిని పోల్చే కాలసూచక క్రియావిశేషణం.
- source_word: תָּבוֹא אֵלֶיךָ
  choice: అది నీ దగ్గరికి రాగానే
  rationale: మూలంలోని స్త్రీలింగ ఏకవచన క్రియకు స్పష్టంగా చెప్పని కష్టం లేదా ఆపద కర్తగా ఉండవచ్చు. తెలుగులో సహజంగా ‘అది’ అని ఉంచి, ఆ అంతర్భావాన్ని పాదటిప్పణిలో వివరించాం.
- source_word: וַתֵּלֶא
  choice: నీవు అలసిపోతున్నావు
  rationale: לאה అనే క్రియ అలసిపోవడం లేదా ఓపిక సన్నగిల్లడాన్ని సూచిస్తుంది. నైతిక తప్పును అతిగా ఆరోపించకుండా మూలార్థాన్ని నిలుపుతుంది.
- source_word: תִּגַּע עָדֶיךָ
  choice: అది నిన్ను తాకగానే
  rationale: נגע యొక్క ‘తాకు, చేరుకొను’ అనే రూపకబలాన్ని నిలుపుతూ, కష్టం యోబును వ్యక్తిగతంగా చేరిన భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וַתִּבָּהֵל
  choice: నీవు కలవరపడుతున్నావు
  rationale: בהל సూచించే దిగులు, ఆందోళన, హఠాత్తుగా చలించిపోవడం అనే భావాన్ని ‘భయభ్రాంతుడవుతున్నావు’ అని అతిశయింపకుండా తెలియజేస్తుంది.
