review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the adversative contextual force of כִּי, the implicit feminine-singular subject, and the twofold movement of trouble reaching and affecting Job. However, «రాగానే/తాకగానే» adds an immediate-temporal sense (“as soon as”) not expressed by the Hebrew. The Hebrew coordinates the clauses rather than specifying instantaneous succession.
  naturalness: The wording is generally clear and modern, but finite verbs («వస్తుంది… అలసిపోతావు… తాకుతుంది… కలవరపడతావు») more naturally and closely reproduce the Hebrew parallelism than the progressive forms combined with «-గానే».
  terminology: «కాని», «అలసిపోవు», and «కలవరపడు» are appropriate, non-interpretive choices. «ఆపద లేదా కష్టం» in the note appropriately presents the implicit subject as likely rather than certain.
  issues:
  - severity: medium
    issue: The adverbial forms «రాగానే» and «తాకగానే» introduce “as soon as/when immediately.”
    rationale: 'Neither תָּבוֹא nor תִּגַּע contains a temporal particle requiring immediate succession. The source has parallel verbal clauses: trouble comes to Job and he becomes weary; it touches him and he is dismayed.'
  - severity: low
    issue: The progressive forms «అలసిపోతున్నావు» and «కలవరపడుతున్నావు» are less direct than the source’s parallel verbal presentation.
    rationale: They are not wrong, but simple finite forms better preserve the concise proverbial/accusatory force of Eliphaz’s statement.
