  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כַּ/אֲשֶׁ֣ר רָ֭אִיתִי חֹ֣רְשֵׁי אָ֑וֶן וְ/זֹרְעֵ֖י עָמָ֣ל יִקְצְרֻֽ/הוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/004/008.yaml
  text: As I have seen[b][a], those who plow iniquity and sow trouble reap it.
translation:
  language: te
  text: నేను చూసిన ప్రకారం, దుర్మార్గాన్ని[a] దున్ని, బాధను[b] విత్తేవారు దానినే కోస్తారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘దుర్మార్గం’కు బదులుగా ‘కీడు’ అని కూడా అనువదించవచ్చు; హీబ్రూ పదం నైతిక చెడును, కొన్నిసార్లు దాని వల్ల కలిగే బాధను కూడా సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: ‘బాధ’కు బదులుగా ‘కష్టం’ లేదా ‘హాని’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר רָאִיתִי
  choice: నేను గమనించినంతవరకు
  rationale: ఎలీఫజు తన అనుభవపూర్వక పరిశీలనను ఆధారంగా చేసుకొని మాట్లాడుతున్న భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: חֹרְשֵׁי
  choice: దున్ని
  rationale: వ్యవసాయ రూపకాన్ని నిలుపుతూ, తరువాతి ‘విత్తేవారు’తో సహజంగా అనుసంధానిస్తుంది.
- source_word: אָוֶן
  choice: దుష్టత్వం
  rationale: ఇక్కడ నైతిక చెడును ప్రధానంగా సూచిస్తుంది; అయితే ఈ హీబ్రూ పదానికి కీడు లేదా దాని వల్ల కలిగే బాధ అనే భావం కూడా ఉండవచ్చు.
- source_word: וְזֹרְעֵי
  choice: విత్తేవారు
  rationale: సమాంతర కృదంత నిర్మాణాన్ని సహజ తెలుగులో కొనసాగిస్తూ విత్తడం–కోయడం రూపకాన్ని కాపాడుతుంది.
- source_word: עָמָל
  choice: కష్టం
  rationale: బాధ, హాని, దుఃఖం కలిగించే కష్టం అనే విస్తృత భావాన్ని అందిస్తుంది; సందర్భంలోని నైతిక పరిణామ భావాన్నీ నిలుపుతుంది.
- source_word: יִקְצְרֻהוּ
  choice: దానినే కోస్తారు
  rationale: పురుష ఏకవచన ప్రత్యయాన్ని ముందున్న చెడు/కష్టం మొత్తాన్ని సూచించే సమాహార పదంగా తీసుకొని, తాము విత్తినదానికి తగిన ఫలమే పొందుతారనే రూపకాన్ని స్పష్టం చేస్తుంది.
theological_decisions:
- issue: ఎలీఫజు మాటల్లోని నైతిక కారణ–ఫల సంబంధం
  choice: ఎలీఫజు తాను గమనించిన సూత్రంగా దీనిని నేరుగా వ్యక్తం చేస్తున్నట్లు అనువదించడం
  alternative: దీనిని మినహాయింపులేని పరమ సిద్ధాంతంగా బలపరచడం లేదా కేవలం సాధారణ సంభావ్యతగా బలహీనపరచడం
  rationale: ఇది యోబుతో ఎలీఫజు చేస్తున్న వాదనలో భాగం. హీబ్రూ వాక్యంలోని బలాన్ని నిలుపుతూ, గ్రంథం యొక్క తుది ధార్మిక తీర్పుగా అనువాదం స్వయంగా ముద్ర వేయకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. మూలంలోని వ్యవసాయ రూపకం, అనుభవపూర్వక వాదన, నైతిక ఉద్వేగం నిలుపబడ్డాయి.
