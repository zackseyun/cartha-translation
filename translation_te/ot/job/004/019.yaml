  text: how much more those who dwell in houses of clay[a], whose foundation is in the dust[b], who are crushed before the moth!
translation:
  language: te
  text: 'మట్టి ఇళ్లలో నివసించేవారు ఇంకెంతగా!


    వారి పునాది ధూళిలో ఉంది;


    వారు చిమ్మటకంటే ముందే నలిగిపోతారు!'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַף
  choice: ఇంకెంత
  rationale: మునుపటి వచనంలోని వాదనను బలహీనులైన మానవులకు విస్తరించే అధికతార్థాన్ని తెలియజేస్తుంది. అదే సమయంలో ‘అంతేకాదు/నిజానికి’ అనే సాధ్యమైన అర్థాన్ని పాదసూచికలో ఉంచింది.
- source_word: שֹׁכְנֵי בָתֵּי חֹמֶר
  choice: మట్టి ఇళ్లలో నివసించేవారు
  rationale: నిరంతర నివాసాన్ని సూచించే కృదంత భావాన్ని, అలాగే మానవ దేహం లేదా భూసంబంధమైన ఉనికి యొక్క దుర్బలతను సూచించే మట్టి-ఇంటి రూపకాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: בֶּעָפָר יְסוֹדָם
  choice: వారి పునాది ధూళిలో ఉంది
  rationale: ‘పునాది’ అనే ఏకవచన సమష్టి భావాన్ని, ‘ధూళి’లోని మరణశీలత ప్రతిధ్వనిని యథాతథంగా కాపాడుతుంది.
- source_word: יְדַכְּאוּם
  choice: వారు ... నలిగిపోతారు
  rationale: హీబ్రూలో కర్త స్పష్టంగా చెప్పబడలేదు. అందువల్ల అనవసరంగా కర్తను చేర్చకుండా, నలిపివేయబడే భావాన్ని సహజమైన తెలుగు అకర్మక రూపంలో వ్యక్తం చేసింది.
- source_word: לִפְנֵי עָשׁ
  choice: చిమ్మట ఎదుటే
  rationale: ‘ఎదుట/ముందు’ అనే మూల చిత్రాన్ని నిలిపి, చిమ్మటకంటే త్వరగా లేదా సులభంగా నాశనమవడం అనే సాధ్యమైన సామెతార్థాన్ని పాదసూచికలో వివరిస్తుంది.
theological_decisions:
- issue: ‘మట్టి ఇళ్లు’ అనే రూపకం దేనిని సూచిస్తుంది?
  choice: మరణశీల మానవుల దుర్బలమైన దేహం లేదా భూసంబంధమైన ఉనికిని సూచించే రూపకంగా ప్రధాన పాఠంలో అలాగే ఉంచడం
  alternative: మనుషుల బలహీనతను చూపే నిజమైన మట్టి ఇటుకల ఇళ్లుగా మాత్రమే అర్థం చేసుకోవడం
  rationale: సందర్భం పరలోక సేవకులతో మానవులను పోల్చి వారి మరణశీలతను నొక్కిచెబుతుంది. అయితే అనువాదం రూపకాన్ని విప్పి చెప్పకుండా దాని కవితాత్మక ఉద్వేగాన్ని నిలుపుతుంది.
- issue: ‘చిమ్మట ఎదుట’ అనే పదబంధం
  choice: మూలంలోని దృశ్యాత్మక, అస్పష్ట రూపాన్ని ప్రధాన పాఠంలో నిలుపడం
  alternative: ‘చిమ్మటకంటే త్వరగా’ లేదా ‘చిమ్మటకంటే సులభంగా’ అని తులనాత్మక భావాన్ని ప్రధాన పాఠంలో స్పష్టీకరించడం
  rationale: ఈ పదబంధం స్థానార్థంతో పాటు వేగం లేదా సులభతను సూచించే తులనాత్మక సామెతార్థాన్ని కలిగి ఉండవచ్చు; ఒక అర్థాన్ని మాత్రమే ఖరారు చేయకుండా ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గంభీరమైన కవితా శైలిని ఉపయోగించింది. ‘పునాది,’ ‘ధూళి,’ ‘చిమ్మట’ వంటి స్పష్టమైన చిత్రపదాలను నిలిపి, మూలంలోని సంక్షిప్తతను మరియు అస్పష్టతను కాపాడింది.
