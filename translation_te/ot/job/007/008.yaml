source:
  edition: WLC
  text: לֹֽא תְ֭שׁוּרֵ/נִי עֵ֣ין רֹ֑אִי עֵינֶ֖י/ךָ בִּ֣/י וְ/אֵינֶֽ/נִּי־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/007/008.yaml
  text: The eye of the one who sees me will no longer behold me[a]; your eyes will be on me[b], but I will be gone.
translation:
  language: te
  text: నన్ను చూసేవాని కన్ను ఇక నన్ను చూడదు[a]; నీ కళ్లు నాపై ఉంటాయి[b], నేను కనిపించను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నన్ను చూస్తున్న కన్ను నన్ను చూడదు.”
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “నీ కళ్లు నాపై ఉన్నాయి, నేను లేను.” అంటే, వెదికినా అతడు కనిపించడనే భావం.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְשׁוּרֵנִי
  choice: నన్ను చూడదు
  rationale: שׁוּר అనే క్రియకు ‘చూడు, తేరి చూడు, దృష్టి నిలుపు’ అనే భావం ఉంది. ఆధునిక తెలుగులో సహజంగా ఉండేందుకు ‘చూడదు’ అని అనువదించాం; సందర్భంలోని అసంపూర్ణ క్రియను భవిష్యత్ భావంతో గ్రహించాం.
- source_word: עֵין רֹאִי
  choice: నన్ను చూసేవాని కన్ను
  rationale: ‘నన్ను చూసేవాని కన్ను’ అనే నిర్మాణం హీబ్రూ పదచిత్రాన్ని, ఏకవచన రూపాన్ని నిలుపుతూ తెలుగులో స్పష్టంగా ఉంది.
- source_word: לֹא
  choice: ఇక ... చూడదు
  rationale: మూలంలో సాధారణ నిషేధమే ఉన్నా, యోబు త్వరలో కనబడకుండా పోతాడనే సందర్భానుసారంగా కాలసూచక భావాన్ని ‘ఇక’ తెలియజేస్తుంది.
- source_word: עֵינֶיךָ
  choice: నీ కళ్లు
  rationale: హీబ్రూలోని బహువచనాన్ని, దేవునికి ఉద్దేశించిన మానవరూప వర్ణనను యథాతథంగా నిలిపాం.
- source_word: בִּי
  choice: నాపై
  rationale: ‘కళ్లు నాపై ఉండటం’ అనే దిశాత్మక దృష్టి భావాన్ని దగ్గరగా ప్రతిబింబిస్తుంది.
- source_word: וְאֵינֶנִּי
  choice: కానీ నేను ఉండను
  rationale: అక్షరార్థంగా ‘మరి నేను లేను/ఉండను.’ సందర్భంలోని అదృశ్యం లేదా మరణ భావాన్ని అతిగా నిర్ధారించకుండా, మూలంలోని సంక్షిప్తతను నిలిపాం.
theological_decisions:
- issue: ‘నీ కళ్లు’ అని ఎవరిని ఉద్దేశించాడు?
  choice: దేవునికి ప్రత్యక్ష సంబోధన
  alternative: సాధారణంగా చూసే ఏ వ్యక్తికైనా సంబోధన
  rationale: సమీప సందర్భంలో యోబు దేవునితో నేరుగా మాట్లాడుతున్నాడు. అయినా మూలంలో ఇక్కడ ‘దేవా’ అని లేకపోవడంతో అనువాదంలో ఆ పేరును చేర్చలేదు.
- issue: ‘నేను ఉండను’ అనే మాట మరణాన్నే ఖచ్చితంగా సూచిస్తుందా?
  choice: అదృశ్యం లేదా ఉనికి లేకపోవడం అనే మూలంలోని విస్తృత భావాన్ని నిలిపివేయడం
  alternative: ‘నేను చనిపోయి ఉంటాను’ అని స్పష్టీకరించడం
  rationale: וְאֵינֶנִּי మరణాన్ని సూచించగలిగినా, అక్షరార్థంలో ‘నేను లేను’ అనే భావమే ఉంది. అందువల్ల మరణాన్ని వ్యాఖ్యానంగా ప్రధాన వాక్యంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, కవితాత్మక గంభీరతను నిలుపుతూ సాధారణ పాఠకులకు అర్థమయ్యే పదాలను వాడాం. హీబ్రూ వాక్యంలోని ‘కన్ను/కళ్లు’ దృశ్యరూపకాన్ని ఉంచాం; చివరి మాటలోని మరణం–అదృశ్యం మధ్య ఉన్న భావ విస్తృతిని సంకుచితం చేయలేదు.
