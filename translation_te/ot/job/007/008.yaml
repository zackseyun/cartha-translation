- from: నన్ను చూసేవాని కన్ను ఇక నన్ను చూడదు[a]; నీ కళ్లు నాపై ఉంటాయి[b], కానీ నేను ఉండను.
  to: నన్ను చూసేవాని కన్ను ఇక నన్ను చూడదు[a]; నీ కళ్లు నాపై ఉంటాయి[b], నేను కనిపించను.
  rationale: The revision removes the unwarranted adversative ‘కానీ,’ renders the final Hebrew idiom in natural Telugu as absence from view, and revises the footnote so that it explains rather than identifies the addressee. The verse’s concise poetic imagery and its ambiguity concerning death versus disappearance are preserved.
