review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the first colon and preserves the plural ‘your eyes.’ In the final colon, however, ‘కానీ’ adds an adversative contrast not explicit in the Hebrew waw, and ‘ఉండను’ can sound like a simple future refusal/existence statement rather than the idiomatic ‘I am gone/not to be found.’
  naturalness: ‘నన్ను చూసేవాని కన్ను ఇక నన్ను చూడదు’ is clear and natural. ‘నీ కళ్లు నాపై ఉంటాయి’ is intelligible but slightly static; retaining it is acceptable. ‘నేను ఉండను’ is understandable but less idiomatic for the intended disappearance sense.
  terminology: The visual imagery ‘కన్ను/కళ్లు’ is retained well. The footnote’s explicit identification of God exceeds the wording of the Hebrew and unnecessarily resolves the addressee within the note; it should state the idiom without that expansion.
  issues:
  - severity: medium
    issue: The main text renders וְאֵינֶנִּי with ‘కానీ నేను ఉండను.’
    rationale: The conjunction is simply waw (‘and’), not necessarily adversative. More importantly, ‘ఉండను’ may be heard as ‘I will not remain/be’ without naturally evoking the idiom of being absent when sought. ‘నేను కనిపించను’ communicates the contextual sense while not specifying death.
  - severity: low
    issue: Footnote b says ‘దేవుడు అతనివైపు చూసేసరికి…’.
    rationale: Although the immediate discourse supports God as addressee, the Hebrew verse itself does not name God. The note should explain the idiom, not add an explicit referent.
  revised_text: నన్ను చూసేవాని కన్ను ఇక నన్ను చూడదు[a]; నీ కళ్లు నాపై ఉంటాయి[b], నేను కనిపించను.
  revised_footnotes:
