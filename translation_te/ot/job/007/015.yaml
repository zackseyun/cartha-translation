  yaml_path: translation/ot/job/007/015.yaml
  text: so that my soul chooses strangling[b][a], death rather than my bones.
translation:
  language: te
  text: 'కాబట్టి నా ప్రాణం గొంతు నులిమివేతను[a],

    నా ఎముకలకంటే మరణాన్నే ఎంచుకుంటుంది[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఊపిరాడకపోవడాన్ని’ లేదా ‘ఉక్కిరిబిక్కిరి కావడాన్ని.’ సందర్భాన్ని బట్టి, ‘నా ప్రాణం ... ఎంచుకునేది’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘నా ఎముకలకంటే/నుండి మరణం.’ ఈ చివరి పదబంధం కవితాత్మకంగా క్లిష్టంగా ఉంది; సాధారణంగా, తన బాధిత శారీరక ఉనికిని కొనసాగించడంకంటే యోబు మరణాన్నే కోరుతున్నాడని అర్థం చేసుకుంటారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּבְחַר
  choice: ఎంచుకుంటుంది
  rationale: בחר అనే క్రియ యొక్క సాధారణ అర్థం ‘ఎంచుకొను.’ కవితా ప్రవాహంలో దీనిని వర్తమాన భావంతో చెప్పడం హెబ్రీ రూపంలోని నేరుతనాన్ని నిలుపుతుంది; సందర్భానుసారంగా ‘ఎంచుకుంటుంది’ బదులు ‘ఎంచుకునేది’ అని కూడా అర్థం చేసుకోవచ్చు.
- source_word: מַחֲנָק
  choice: గొంతు నులిమివేయబడటం
  rationale: ఈ నామవాచకం గొంతు నులిమివేయడం, ఊపిరాడకుండా చేయడం అనే తీవ్రమైన, స్పష్టమైన చిత్రాన్ని ఇస్తుంది. సాధారణమైన ‘ఊపిరాడకపోవడం’ కంటే ఈ ఎంపిక మూలంలోని కఠినతను కాపాడుతుంది.
- source_word: נַפְשִׁי
  choice: నా ప్రాణం
  rationale: נֶפֶשׁ ఇక్కడ వ్యక్తి ప్రాణాన్ని లేదా స్వయాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘నా ప్రాణం’ అనేది మరణ సందర్భానికి సహజంగా సరిపోతూ హెబ్రీ వ్యక్తీకరణను కూడా నిలుపుతుంది; ‘నా ఆత్మ’ అనడం అవసరంలేని శరీర–ఆత్మ విభజన భావాన్ని కలిగించవచ్చు.
- source_word: מָוֶת
  choice: మరణం
  rationale: מָוֶתకు నేరమైన, సాధారణ తెలుగు సమానం.
- source_word: מֵעַצְמוֹתָי
  choice: నా ఎముకలకంటే
  rationale: 'అక్షరార్థంగా ‘నా ఎముకల నుండి.’ ఇక్కడ מִן తులనార్థకంగా గ్రహించబడింది: యోబు తన బాధిత శారీరక ఉనికికంటే మరణాన్ని ఎంచుకుంటున్నాడు. మూలంలోని ‘ఎముకలు’ అనే బలమైన కవితా చిత్రాన్ని ‘శరీరం’గా చదును చేయకుండా నిలిపాం.'
