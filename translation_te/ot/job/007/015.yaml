  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరమైన కవితా ధోరణి పాటించబడింది. ‘ప్రాణం,’ ‘ఎముకలు’ అనే మూల చిత్రాలు నిలుపబడ్డాయి; వాక్యంలోని తీవ్రతను మృదువుచేయలేదు.
