base_translation:
  language: en
  yaml_path: translation/ot/job/007/019.yaml
  text: How long will you not look away from me[a], nor leave me alone until I swallow my spit?
translation:
  language: te
  text: ఎంతకాలం నన్ను చూడటం మానవు? నా ఉమ్మిని మింగేంతసేపైనా నన్ను వదిలిపెట్టవా?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “నా ఉమ్మిని మింగేంతసేపు” అనేది అతి కొద్ది క్షణాన్ని సూచించే నుడికారం.
    reason: idiom_explanation
lexical_decisions:
- source_word: כַּמָּה
  choice: ఎంతకాలం
  rationale: విలాప సందర్భంలో ఇది కాలవ్యవధిని ప్రశ్నిస్తూ ‘ఎంతకాలం’ అనే భావాన్ని ఇస్తుంది.
- source_word: תִשְׁעֶה מִמֶּנִּי
  choice: నా మీదినుంచి నీ చూపు తిప్పుకోవు
  rationale: శׁעה అనే క్రియ ఇక్కడ చూపును మరల్చడాన్ని సూచిస్తుంది; దేవుని నిరంతర పరిశీలన నుంచి క్షణిక ఉపశమనాన్ని యోబు కోరుతున్న సందర్భానికి ఈ రూపం సరిపోతుంది.
- source_word: תַרְפֵּנִי
  choice: నన్ను విడిచిపెట్టవా
  rationale: רפה హిఫీల్ రూపం పట్టును సడలించడం, వదలడం లేదా ఇక బాధించకుండా ఉండడం అనే భావాన్ని ఇస్తుంది; తెలుగులో ‘విడిచిపెట్టు’ సహజంగా ఉండి సమాంతర భావాన్ని నిలుపుతుంది.
- source_word: עַד
  choice: వరకైనా
  rationale: కోరుతున్న విరామానికి పరిమితిని సూచిస్తుంది; ‘అయినా’ చేర్పు అతి స్వల్ప సమయమైనా ఇవ్వమనే విజ్ఞప్తిని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בִּלְעִי רֻקִּי
  choice: నా ఉమ్మిని నేను మింగేంత
  rationale: హీబ్రూ చిత్రాత్మకతను నేరుగా నిలుపుతూ, అతి కొద్ది క్షణాన్ని సూచించే నుడికారాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన విలాప ధోరణి. దేవునితో ఏకవచన ప్రత్యక్ష సంభాషణను నిలిపి, మూలంలోని శరీర సంబంధమైన స్పష్ట చిత్రాన్ని మృదువుచేయకుండా ఉంచాం.
