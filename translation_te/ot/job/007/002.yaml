  text: Like a servant who longs for shade[a], and like a hired worker who waits for his wages[c][b],
translation:
  language: te
  text: నీడ కోసం ఆరాటపడే దాసునిలా[a], తన కూలి కోసం ఎదురుచూసే కూలివాడిలా[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘సేవకునిలా.’ హీబ్రూ పదం దాసుణ్ణి లేదా సేవకుణ్ణి సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘తన వేతనం కోసం,’ ‘తన ప్రతిఫలం కోసం.’
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּ/עֶבֶד
  choice: దాసునిలా
  rationale: עֶבֶד అనే పదం సేవకుడు లేదా దాసుడు అనే అర్థాలను ఇవ్వగలదు. కఠిన శ్రమలో ఉన్న వ్యక్తి యొక్క అధీన స్థితి ఇక్కడ ప్రధానంగా కనిపిస్తున్నందున ‘దాసుడు’ మూలంలోని బలాన్ని నిలుపుతుంది.
- source_word: יִשְׁאַף
  choice: ఆరాటపడే
  rationale: שׁאף తీవ్రమైన కోరికను, కొన్నిసార్లు ఆయాసంతో గాలి పీల్చడాన్ని సూచిస్తుంది. ‘ఆరాటపడే’ సహజమైన ఆధునిక తెలుగులో ఆ తీవ్ర ఆకాంక్షను తెలియజేస్తుంది.
- source_word: צֵל
  choice: నీడ
  rationale: צֵל అక్షరార్థంగా నీడను సూచిస్తుంది; ఈ శ్రమ సందర్భంలో అది ఎండ నుండి ఉపశమనాన్నిచ్చే నీడ. తెలుగు వాడుకలో ‘నీడ’ ఈ రెండింటినీ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וּכְ/שָׂכִיר
  choice: కూలివానిలా
  rationale: שָׂכִיר వేతనానికి పని చేసే వ్యక్తిని సూచిస్తుంది. ‘కూలివాడు’ అతని శ్రమనూ, కూలిపై ఆధారపడే ఆర్థిక స్థితినీ స్పష్టంగా తెలియజేస్తుంది.
- source_word: יְקַוֶּה
  choice: ఎదురుచూసే
  rationale: קוה ఎదురుచూడడం, ఆశించడం అనే భావాలను కలిగి ఉంది. పని ముగిసిన తర్వాత రావలసిన కూలి సందర్భంలో ‘ఎదురుచూసే’ నిరీక్షణ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: פָעֳלוֹ
  choice: తన కూలి
  rationale: פעל పని లేదా దాని ఫలితాన్ని సూచించగలదు; שָׂכִירతో ఉన్న ఈ నిర్మాణంలో అది చేసిన పనికి లభించే ప్రతిఫలాన్ని సూచిస్తుంది. అందువల్ల ‘తన కూలి’ సందర్భానుకూలంగా ఉంది.
