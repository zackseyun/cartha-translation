id: JOB.7.12
reference: Job 7:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: הֲֽ/יָם אָ֭נִי אִם תַּנִּ֑ין כִּֽי תָשִׂ֖ים עָלַ֣/י מִשְׁמָֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/007/012.yaml
  text: Am I the sea[a], or a sea monster[b], that you set a guard over me?
translation:
  language: te
  text: నాపై కావలి పెట్టేంతటి నేను సముద్రమా, లేక సముద్ర భీకరజీవినా[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘సముద్ర మహాసర్పం,’ ‘డ్రాగన్.’ హీబ్రూ పదం తన్నీన్ గొప్ప భయంకర జీవిని సూచిస్తుంది; ఇది తరచుగా సముద్రం లేదా అల్లకల్లోలానికి సంబంధించిన కావ్యచిత్రాల్లో వస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיָם
  choice: నేను సముద్రమా
  rationale: ప్రశ్నార్థక הֲతో కూడిన יָם అలంకారిక ప్రశ్నను ప్రారంభిస్తుంది. ‘సముద్రం’ మూలంలోని ప్రాచీన అల్లకల్లోల భయచిత్రాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: אִם
  choice: లేక
  rationale: ఇక్కడ אִם రెండు ప్రత్యామ్నాయాలను కలిపే విభాజకంగా పనిచేస్తుంది; అందువల్ల ‘లేక’ సహజమైన ఎంపిక.
- source_word: תַּנִּין
  choice: సముద్ర భీకరజీవి
  rationale: תַּנִּין గొప్ప సముద్రజీవి, మహాసర్పం లేదా డ్రాగన్‌ను సూచించగలదు. ‘సముద్ర భీకరజీవి’ సందర్భంలోని భయంకరమైన సముద్ర-అల్లకల్లోల చిత్రాన్ని నిలుపుతూ, నిర్దిష్ట పురాణార్థాన్ని బలవంతంగా చేర్చదు.
- source_word: תָשִׂים
  choice: పెట్టడానికి
  rationale: שׂים యొక్క భావం ‘పెట్టు/నియమించు.’ తెలుగులో ‘కావలి పెట్టు’ సహజమైన పదబంధం; ప్రశ్నార్థక నిర్మాణంలో ‘పెట్టడానికి?’ మూలంలోని ఉద్దేశ్య/ఫలిత సంబంధాన్ని సూటిగా తెలియజేస్తుంది.
- source_word: עָלַי
  choice: నాపై
  rationale: עַל ఇక్కడ యోబుపై అమలుచేసే పర్యవేక్షణ లేదా నిర్బంధాన్ని సూచిస్తుంది; ‘నాపై’ దానిని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: מִשְׁמָר
  choice: కావలి
  rationale: מִשְׁמָר అంటే కావలి, నిఘా లేదా అదుపులో ఉంచడం. ‘కావలి’ సాధారణ పాఠకులకు సహజంగా ఉండి, పర్యవేక్షణ మరియు నిర్బంధం రెండింటి సూచనను కలిగి ఉంటుంది.
theological_decisions:
- issue: תַּנִּין అనే పదంలోని సముద్ర-అల్లకల్లోల కావ్యచిత్రం
  choice: నిర్దిష్ట పురాణజీవిగా నిర్ణయించకుండా ‘సముద్ర భీకరజీవి’ అని అనువదించడం
  alternative: సముద్ర మహాసర్పం; డ్రాగన్; రాక్షసజీవి
  rationale: యోబు తనను అదుపులో ఉంచవలసిన విశ్వవ్యాప్త ముప్పులా దేవుడు చూస్తున్నాడా అని ప్రశ్నిస్తున్నాడు. అనువాదం ఆ ఉద్రిక్తతను, కావ్యచిత్రాన్ని నిలుపుతుంది; అయితే వాక్యంలో స్పష్టంగా లేని పురాణవ్యవస్థను చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కావ్యప్రశ్నగా రూపొందించబడింది. ‘సముద్ర భీకరజీవి’ సాధారణ పాఠకునికి అర్థమయ్యేలా ఉండి, మూలపదంలోని ఉద్దేశపూర్వక విస్తృతార్థాన్ని కాపాడుతుంది. రెండు పాదాలను ఒకే అలంకారిక ప్రశ్నగా ఉంచి యోబు ఫిర్యాదులోని తీవ్రతను నిలిపింది.
