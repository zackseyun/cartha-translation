  text: What is man[a], that you make so much of him[b], and that you set your heart on him?
translation:
  language: te
  text: 'మానవుడు[a] ఎంతటివాడు—

    నీవు అతణ్ణి అంతగా గొప్పవానిగా చేస్తావు[b],

    అతనిపై నీ హృదయాన్ని ఉంచుతావు?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘మానవుడు’ అని అనువదించిన హెబ్రీ పదం אֱנוֹשׁ; ఇది నశ్వరమైన మానవత్వాన్ని సూచించే ఏకవచన పదం. కీర్తన 8:4తో పోల్చండి.
    reason: lexical_alternative_and_cross_reference
