review_pass:
  verdict: revise
  source_fidelity: 'The draft correctly renders the principal sense of the verse: Job asks God to remember the fleeting character of his life, and he says that his eye will not again see good. However, “మాత్రమే” (‘only’) adds a restrictive element not expressed in the Hebrew, and “ఇక” conveys finality but does not retain the explicit return/again imagery of לֹא תָשׁוּב as closely as “మళ్లీ.”'
  naturalness: The wording is generally clear and idiomatic modern Telugu. “జ్ఞాపకం ఉంచుకో” is a natural direct imperative and retains the unembellished address found in the Hebrew. “నా కన్ను మళ్లీ మేలును చూడదు” is concise, poetic, and natural.
  terminology: “ఊపిరి” appropriately conveys רוּחַ in this lament context, while the footnote responsibly preserves ‘గాలి’ and ‘ఆత్మ’ as lexical possibilities. “మేలు” preserves the broad scope of טוֹב without prematurely narrowing it to prosperity or happiness. The singular “నా కన్ను” correctly reflects the Hebrew poetic singular.
  issues:
  - severity: low
    issue: “మాత్రమే” adds emphasis not explicit in the source.
    rationale: רוּחַ predicates that Job’s life is ‘a breath/wind’; it does not contain a word corresponding to ‘only.’ Removing it better preserves the compact Hebrew metaphor.
  - severity: low
    issue: The main text obscures the return/again component of לֹא תָשׁוּב.
    rationale: “ఇక ... చూడదు” gives an acceptable contextual sense, but “మళ్లీ ... చూడదు” more directly represents that his eye will not return to see good, while remaining natural Telugu.
  revised_text: నా జీవితం ఒక ఊపిరి అని జ్ఞాపకం ఉంచుకో[a]; నా కన్ను మళ్లీ మేలును చూడదు[b].
