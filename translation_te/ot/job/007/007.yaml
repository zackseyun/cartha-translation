translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలిని వాడాం. హీబ్రూ కావ్యంలోని ఏకవచన ‘నా కన్ను’ను నిలిపి, ‘רוּחַ’ మరియు ‘שׁוב’ పదాల్లోని ప్రత్యామ్నాయ భావాలను పాదటిప్పణుల్లో ఇచ్చాం.
