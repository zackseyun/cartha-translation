source:
  edition: WLC
  text: זְ֭כֹר כִּי ר֣וּחַ חַיָּ֑/י לֹא תָשׁ֥וּב עֵ֝ינִ֗/י לִ/רְא֥וֹת טֽוֹב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/007/007.yaml
  text: Remember that my life is a breath[b][a]; my eye will not return to see good.
translation:
  language: te
  text: నా జీవితం ఒక ఊపిరి అని జ్ఞాపకం ఉంచుకో[a]; నా కన్ను మళ్లీ మేలును చూడదు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నా జీవితం గాలి.” హీబ్రూ పదానికి “ఊపిరి,” “గాలి,” లేదా “ఆత్మ” అనే అర్థాలు రావచ్చు; ఇక్కడ అది జీవితం క్షణభంగురమని తెలియజేస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “నా కన్ను మేలును చూడడానికి తిరిగి రాదు”; భావం, నేను మళ్లీ మేలును—అంటే సుఖాన్ని లేదా శ్రేయస్సును—అనుభవించను.
    reason: lexical_alternative
lexical_decisions:
- source_word: זְכֹר
  choice: జ్ఞాపకం చేసుకో
  rationale: దేవుని ఉద్దేశించి వాడిన ద్వితీయ పురుష ఏకవచన ఆజ్ఞార్థక రూపం. విన్నప స్వరాన్ని అదనపు పదాలు చేర్చకుండా సహజంగా నిలుపుతుంది.
- source_word: כִּי
  choice: అని
  rationale: జ్ఞాపకం చేసుకోవలసిన విషయాన్ని పరిచయం చేస్తుంది; తెలుగులో పరోక్ష వాక్య నిర్మాణానికి ‘అని’ సహజం.
- source_word: רוּחַ
  choice: ఊపిరి
  rationale: ఈ విలాప సందర్భంలో జీవితం క్షణభంగురమని సూచిస్తుంది. ‘గాలి’ కూడా సాధ్యమే గాని, ‘ఊపిరి’ తాత్కాలికతను సహజంగా వ్యక్తం చేస్తుంది; ‘ఆత్మ’ ఇక్కడ ప్రధాన భావం కాదు.
- source_word: חַיָּי
  choice: నా జీవితం
  rationale: మొదటి పురుష ఏకవచన ప్రత్యయంతో ఉన్న రూపానికి స్పష్టమైన, సహజమైన తెలుగు సమానం.
- source_word: לֹא תָשׁוּב
  choice: ఇక ... చూడదు
  rationale: అక్షరార్థంగా ‘తిరిగి ... చూడదు.’ తెలుగులో ‘ఇక చూడదు’ మళ్లీ సంభవించదనే భావాన్ని సహజంగా తెలియజేస్తుంది; ప్రత్యామ్నాయం పాదటిప్పణిలో నిలుపబడింది.
- source_word: עֵינִי
  choice: నా కన్ను
  rationale: హీబ్రూలోని ఏకవచనాన్ని, దాని కావ్యప్రయోగాన్ని నిలుపుతుంది.
- source_word: לִרְאוֹת
  choice: చూడదు
  rationale: ראה అనే క్రియ యొక్క ప్రాథమిక భావమైన ‘చూడడం’ను నిలుపుతూ, తెలుగులో ప్రధాన క్రియతో సహజంగా కలిపింది.
- source_word: טוֹב
  choice: మేలు
  rationale: సుఖం, క్షేమం, శ్రేయస్సు వంటి విస్తృత భావాలను మితిమీరకుండా కలిగిన తెలుగు పదం.
