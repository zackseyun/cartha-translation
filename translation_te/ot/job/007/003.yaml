source:
  edition: WLC
  text: כֵּ֤ן הָנְחַ֣לְתִּי לִ֭/י יַרְחֵי שָׁ֑וְא וְ/לֵיל֥וֹת עָ֝מָ֗ל מִנּוּ לִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/007/003.yaml
  text: So I have been allotted months of emptiness[b][a], and nights of misery have been assigned to me.
translation:
  language: te
  text: అలాగే, వ్యర్థమైన నెలలు[a] నాకు వంతుగా దక్కాయి; బాధల రాత్రులు[b] నాకు కేటాయించబడ్డాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “శూన్యమైన నెలలు,” “నిష్ఫలమైన నెలలు.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “శ్రమతో కూడిన రాత్రులు,” “కష్టాల రాత్రులు,” “వేదనల రాత్రులు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כֵּן
  choice: అలాగే
  rationale: మునుపటి వచనంలోని పోలికను యోబు తన అనుభవానికి అన్వయిస్తున్న భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: הָנְחַלְתִּי לִי
  choice: నాకు వంతుగా దక్కాయి
  rationale: హోఫాల్ రూపంలోని స్వీకర్త భావాన్ని నిలుపుతూ, యోబుకు ఇష్టానికి విరుద్ధంగా ఒక భాగం కేటాయించబడినట్లు సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: יַרְחֵי שָׁוְא
  choice: వ్యర్థమైన నెలలు
  rationale: שָׁוְא లోని శూన్యత, నిష్ఫలత, వ్యర్థత అనే భావపరిధిలో సందర్భానికి తగిన నిష్ఫలమైన కాలం అనే భావాన్ని అందిస్తుంది.
- source_word: וְלֵילוֹת עָמָל
  choice: వేదనతో నిండిన రాత్రులు
  rationale: עָמָל కు శ్రమ, కష్టం, బాధ అనే అర్థాలున్నాయి; యోబు రాత్రివేళ అనుభవిస్తున్న బాధను ఇక్కడ స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: מִנּוּ לִי
  choice: నాకు కేటాయించబడ్డాయి
  rationale: బహువచన కర్మణి రూపాన్ని నిలుపుతూ, ఆ రాత్రులు యోబు వాటాగా నియమించబడిన భావాన్ని తెలియజేస్తుంది.
theological_decisions:
- issue: యోబు బాధను కేటాయించిన కర్త ఎవరు?
  choice: కర్తను పేర్కొనకుండా కర్మణి నిర్మాణాన్ని నిలిపాం.
  alternative: దేవుడు నాకు కేటాయించాడు.
  rationale: హీబ్రూ వాక్యంలో కర్త స్పష్టంగా చెప్పబడలేదు; దేవుడే కర్త అని అనువాదంలో చేర్చడం మూలపాఠంలోని ఉద్దేశపూర్వక అస్పష్టతను తొలగిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన విలాప ధోరణిని ఉంచాం. “వంతుగా దక్కాయి” మరియు “కేటాయించబడ్డాయి” అనే సమాంతర పదబంధాలు మూలంలోని రెండు కర్మణి క్రియల భావాన్ని సహజంగా ప్రతిబింబిస్తాయి.
