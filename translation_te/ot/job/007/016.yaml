source:
  edition: WLC
  text: מָ֭אַסְתִּי לֹא לְ/עֹלָ֣ם אֶֽחְיֶ֑ה חֲדַ֥ל מִ֝מֶּ֗/נִּי כִּי הֶ֥בֶל יָמָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/007/016.yaml
  text: I despise my life[a]; I will not live forever. Leave me alone[b], for my days are a breath.
translation:
  language: te
  text: నా జీవితాన్ని నేను అసహ్యించుకుంటున్నాను[a]; నేను ఎల్లకాలం జీవించను. నన్ను ఒంటరిగా విడిచిపెట్టు, ఎందుకంటే నా రోజులు ఊపిరివంటివి[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నేను దానిని అసహ్యించుకుంటున్నాను,” “నేను దానిని తిరస్కరిస్తున్నాను.” హీబ్రూ వాక్యంలో అసహ్యించబడినది లేదా తిరస్కరించబడినది ఏమిటో స్పష్టంగా చెప్పలేదు.
    reason: lexical_alternative
  - marker: b
    text: “ఊపిరి” అని అనువదించిన హీబ్రూ పదానికి “ఆవిరి” అనే భావం కూడా ఉంది; జీవితం ఎంత స్వల్పమైనదో, నిలకడలేనిదో ఇది నొక్కిచెబుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָאַסְתִּי
  choice: నాకు జీవితం అసహ్యమైంది
  rationale: మָאַסְתִּי అంటే ‘తిరస్కరించు, అసహ్యించుకో’ అనే బలమైన విముఖత. హీబ్రూలో కర్మ చెప్పబడలేదు; సందర్భం ప్రకారం తెలుగులో సహజంగా ఉండేందుకు ‘జీవితం’ చేర్చబడింది, ఆ విషయం పాదసూచికలో స్పష్టం చేయబడింది.
- source_word: לֹא לְעֹלָם אֶחְיֶה
  choice: నేను ఎల్లకాలం జీవించను
  rationale: నిరాకరణ, ‘ఎల్లకాలం,’ ‘నేను జీవిస్తాను’ అనే అంశాలను సహజమైన తెలుగులో నేరుగా వ్యక్తం చేస్తుంది; దీనిని కోరికగా మార్చకుండా యోబు తన మరణశీలతను చెప్పే మాటగా ఉంచుతుంది.
- source_word: חֲדַל מִמֶּנִּי
  choice: నన్ను ఒంటరిగా విడిచిపెట్టు
  rationale: חֲדַל అంటే ‘మాను, ఆపు’; מִמֶּנִּיతో కలిసి ‘నా విషయంలో మానుకో’ అనే భావం వస్తుంది. ఆధునిక తెలుగులో ‘నన్ను ఒంటరిగా విడిచిపెట్టు’ ఆ వేడుకోలును సహజంగా తెలియజేస్తుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: యోబు చేసిన వేడుకోలుకు కారణాన్ని పరిచయం చేసే కారణార్థక సంధానపదం.
- source_word: הֶבֶל
  choice: కేవలం ఊపిరి వంటివి
  rationale: הֶבֶלకు ఊపిరి, ఆవిరి, క్షణభంగురత అనే భావవ్యాప్తి ఉంది. ‘ఊపిరి వంటివి’ జీవితం ఎంత స్వల్పమైనదో, నిలకడలేనిదో స్పష్టమైన దృశ్యంతో తెలియజేస్తుంది; ‘కేవలం’ దాని అల్పకాలికతను బలపరుస్తుంది.
- source_word: יָמָי
  choice: నా రోజులు
  rationale: యోబు తన జీవితకాలాన్ని ‘నా రోజులు’ అని సూచిస్తున్న మూలంలోని స్వామ్య బహువచనాన్ని నేరుగా నిలుపుతుంది.
