translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన విలాప స్వరం ఉంచబడింది. మొదటి వాక్యంలో సహజత్వం కోసం సందర్భానుసారంగా ‘జీవితం’ చేర్చినా, మూలంలో కర్మ అనిర్దిష్టంగా ఉన్న విషయాన్ని పాదసూచిక కాపాడుతుంది. ‘ఊపిరి’ రూపకం మూలంలోని సంక్షిప్తత మరియు క్షణభంగురతను నిలుపుతుంది.
