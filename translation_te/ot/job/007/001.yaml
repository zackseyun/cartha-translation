id: JOB.7.1
reference: Job 7:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: הֲ/לֹא צָבָ֣א לֶ/אֱנ֣וֹשׁ על אָ֑רֶץ וְ/כִ/ימֵ֖י שָׂכִ֣יר יָמָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/007/001.yaml
  text: Is not man consigned to hard service on earth[a], and are not his days like those of a hired worker?
translation:
  language: te
  text: భూమిమీద మనిషికి కఠినమైన సేవాకాలం ఉండదా?[a] అతని రోజులు కూలివాని రోజులవంటివి కావా?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “భూమిమీద మనిషికి యుద్ధసేవ ఉండదా?” హీబ్రూ పదం צָבָא యుద్ధాన్ని లేదా సైనిక సేవను సూచించగలదు. అయితే ఇక్కడ “కూలివాని రోజులు” అనే సమాంతర భావాన్ని బట్టి, భారమైన సేవాకాలం అనే విస్తృత అర్థమే ఎక్కువగా సరిపోతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: ఉండదా? / కావా?
  rationale: ఇది అవుననే సమాధానాన్ని ఆశించే అలంకారిక ప్రశ్న. తెలుగులో ప్రతికూల ప్రశ్నారూపం దాని బలాన్ని సహజంగా నిలుపుతుంది.
- source_word: צָבָא
  choice: కఠినమైన సేవాకాలం
  rationale: ఈ పదం యుద్ధసేవను లేదా నిర్బంధితమైన భారమైన సేవాకాలాన్ని సూచించగలదు. తరువాతి ‘కూలివాని రోజులు’ అనే సమాంతర భావం వల్ల ఇక్కడ భారమైన సేవాకాలం ప్రధానంగా ఉద్దేశించబడింది; అయినా ప్రత్యామ్నాయ అర్థాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: אֱנוֹשׁ
  choice: మనిషి
  rationale: ఈ పదం బలహీనతకు, మరణశీలతకు లోబడిన మానవుణ్ణి సూచిస్తుంది. ‘మనిషి’ సాధారణ మానవజాతిని సూచించే సహజమైన ఆధునిక తెలుగు పదం.
- source_word: עַל־אָרֶץ
  choice: భూమిమీద
  rationale: ఒక నిర్దిష్ట భూభాగాన్ని కాక, భూమిపై మానవ జీవితం అనే విస్తృత సందర్భాన్ని తెలియజేస్తుంది.
- source_word: וְכִימֵי
  choice: రోజులు ... రోజులవంటివి
  rationale: మూలంలోని ‘రోజులవలె’ అనే పోలికను తెలుగు వాక్యనిర్మాణానికి సహజంగా, రెండవ అలంకారిక ప్రశ్నగా వ్యక్తం చేస్తుంది.
- source_word: שָׂכִיר
  choice: కూలివాడు
  rationale: వేతనం కోసం నియమించబడిన పనివాణ్ణి సూచిస్తుంది. ‘కూలివాడు’ స్పష్టమైన, సాధారణ ఆధునిక తెలుగు ప్రయోగం.
- source_word: יָמָיו
  choice: అతని రోజులు
  rationale: జీవితకాలాన్ని ‘రోజులు’గా చెప్పే మూలంలోని కాలరూపకాన్ని నేరుగా నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యేలా గంభీరమైన ప్రశ్నారూపాన్ని ఉపయోగించాం. మూలంలోని రెండు సమాంతర అలంకారిక ప్రశ్నలను నిలిపి, צָבָא పదంలోని యుద్ధసేవ/భారమైన సేవ అనే అర్థసంభావ్యతను పాదటిప్పణిలో సంరక్షించాం.
