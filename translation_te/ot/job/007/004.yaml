id: JOB.7.4
reference: Job 7:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אִם שָׁכַ֗בְתִּי וְ/אָמַ֗רְתִּי מָתַ֣י אָ֭קוּם וּ/מִדַּד עָ֑רֶב וְ/שָׂבַ֖עְתִּי נְדֻדִ֣ים עֲדֵי נָֽשֶׁף־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/007/004.yaml
  text: When I lie down[a], I say, ‘When will I arise?’ But the evening drags on[c][b], and I am full of tossing until dawn.
translation:
  language: te
  text: నేను పడుకున్నప్పుడు[a], “ఎప్పుడు లేస్తాను?” అని అనుకుంటాను. కాని సాయంకాలం సాగుతూనే ఉంటుంది[b]; తెల్లవారుజాము[c] వరకు అటూ ఇటూ దొర్లి దొర్లి విసిగిపోతాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నేను పడుకుంటే.’ హీబ్రూ పదం షరతును సూచించగలదు; అయితే ఇక్కడ అది పదేపదే జరిగే పరిస్థితిని సూచిస్తున్నట్లు ఉంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘సాయంకాలం కొలవబడుతుంది.’ సాయంకాలం చాలా నెమ్మదిగా పొడిగిపోతున్నట్లు అనిపించడమే భావం.
    reason: lexical_alternative
  - marker: c
    text: హీబ్రూ పదం ‘సంధ్య’ అని అర్థమివ్వగలదు; అది సాయంకాలపు లేదా ఉదయపు సంధ్యను సూచించవచ్చు. ఇక్కడ బహుశా ఉదయ సంధ్య, అంటే తెల్లవారుజాము, ఉద్దేశించబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: పడుకున్నప్పుడు
  rationale: אִם సాధారణంగా షరతును సూచించినా, ఇక్కడ యోబు పదేపదే అనుభవించే పరిస్థితిని పరిచయం చేస్తోంది. అందువల్ల ఊహాత్మకమైన ‘పడుకుంటే’ కంటే కాలార్థకమైన ‘పడుకున్నప్పుడు’ సందర్భానికి సహజంగా సరిపోతుంది.
- source_word: שָׁכַבְתִּי וְאָמַרְתִּי
  choice: నేను పడుకున్నప్పుడు … అని అనుకుంటాను
  rationale: హీబ్రూ సంపూర్ణ క్రియారూపాలు ఇక్కడ ఒకసారి జరిగిన గత సంఘటనను కాక, ప్రతి రాత్రీ పునరావృతమయ్యే అనుభవాన్ని తెలుపుతున్నాయి. అంతరంగంగా తనలో తాను చెప్పుకోవడాన్ని సహజ తెలుగు కోసం ‘అనుకుంటాను’గా ఇచ్చాం.
- source_word: מָתַי אָקוּם
  choice: ఎప్పుడు లేస్తానో?
  rationale: קום ఇక్కడ పడకనుండి లేవడాన్ని, రాత్రి ముగియాలని ఎదురుచూడడాన్ని సూచిస్తుంది. ‘ఎప్పుడు లేస్తాను?’ కంటే స్వగతంలో సహజంగా వినిపించే ‘ఎప్పుడు లేస్తానో?’ను ఎంచుకున్నాం.
- source_word: וּמִדַּד עָרֶב
  choice: కాని సాయంకాలం సాగుతూనే ఉంటుంది
  rationale: מדד యొక్క ప్రాథమిక భావం ‘కొలుచుట’; ఈ సందర్భంలో కాలం నెమ్మదిగా పొడిగించబడుతున్న అనుభూతిని సూచిస్తుంది. עָרֶבను సాధారణీకరించి ‘రాత్రి’ అని మార్చకుండా ‘సాయంకాలం’గానే నిలిపాం.
- source_word: וְשָׂבַעְתִּי נְדֻדִים
  choice: అటూ ఇటూ దొర్లి దొర్లి విసిగిపోతాను
  rationale: שׂבע అంటే ‘నిండిపోవడం, తనివితీరడం’; ప్రతికూల సందర్భంలో అది మోతాదుకు మించి అనుభవించి విసిగిపోవడాన్ని సూచిస్తుంది. נְדֻדִים నిద్రలేక పడకపై అటూ ఇటూ కదలడాన్ని సూచిస్తుంది. తెలుగు సహజత్వం కోసం రెండింటి కలిపిన భావాన్ని ఈ విధంగా వ్యక్తం చేశాం.
- source_word: עֲדֵי נָשֶׁף
  choice: తెల్లవారుజాము వరకు
  rationale: נָשֶׁף సాయంకాలపు లేదా ఉదయపు సంధ్యను సూచించగలదు. ఇక్కడ రాత్రంతా నిద్రలేని బాధకు ముగింపు కావడంతో ఉదయ సంధ్య, అంటే తెల్లవారుజాము, సందర్భానికి బాగా సరిపోతుంది.
