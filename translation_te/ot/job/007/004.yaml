  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా, విలాపానికి తగిన గంభీరతతో అనువదించాం. ‘దొర్లి దొర్లి’ అనే పునరుక్తి నిద్రలేని రాత్రిలో పునరావృతమయ్యే శారీరక అశాంతిని సహజంగా తెలియజేస్తుంది; మూలంలోని కాలసంబంధ, పదార్థసంబంధ సందిగ్ధతలను పాదసూచికల్లో నిలిపాం.
