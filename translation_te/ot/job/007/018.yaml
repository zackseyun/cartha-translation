  to: 'ప్రతి ఉదయం అతన్ని గమనిస్తావు,[a]

    ప్రతి క్షణం అతన్ని పరీక్షిస్తావు?[b]'
  rationale: ‘గమనిస్తావు’ దేవుని నిరంతర, భారంగా అనిపించే శ్రద్ధను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; అది కేవలం దయాపూర్వక సంరక్షణగా భావాన్ని మార్చదు. రెండు సమాంతర క్రియలను స్పష్టమైన భవిష్యత్/ప్రశ్నారూపంలో ఉంచడం మూలంలోని నిర్మాణాన్నీ, 17వ వచనం నుంచి కొనసాగుతున్న ప్రశ్నను కూడా స్పష్టపరుస్తుంది.
