  text: that you attend to him every morning[b][a], and test him every moment?
translation:
  language: te
  text: 'ప్రతి ఉదయం అతన్ని గమనిస్తావు,[a]

    ప్రతి క్షణం అతన్ని పరీక్షిస్తావు?[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ప్రతి ఉదయం అతన్ని సందర్శిస్తావు.’ హీబ్రూ క్రియకు ‘సందర్శించు,’ ‘శ్రద్ధ చూపు,’ లేదా ‘గమనించు’ అనే అర్థాలు రావచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘ప్రతి క్షణం అతన్ని పరిశీలిస్తావు?’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּפְקְדֶנּוּ
  choice: అతన్ని పట్టించుకొని
  rationale: פקד అనే క్రియకు ‘సందర్శించు,’ ‘పట్టించుకో/గమనించు,’ ‘శ్రద్ధ చూపు’ వంటి విస్తృత అర్థాలు ఉన్నాయి. యోబు ఫిర్యాదు సందర్భంలో ఇది ఆదరణకరమైన పరామర్శకన్నా దేవుని నిరంతర గమనింపును సూచిస్తుంది. ‘పట్టించుకొని’ ఆ క్రియాశీల శ్రద్ధను సహజమైన తెలుగులో తెలియజేస్తూ, దాని స్వరాన్ని పూర్తిగా అనుకూలంగా మార్చదు.
- source_word: לִבְקָרִים
  choice: ప్రతి ఉదయం
  rationale: బహువచన కాలపదం పునరావృతిని సూచిస్తుంది; ‘ప్రతి ఉదయం’ ఆధునిక తెలుగులో సహజంగా ఉండి ఆ పునరావృత భావాన్ని నిలుపుతుంది.
- source_word: לִרְגָעִים
  choice: ప్రతి క్షణం
  rationale: רגעים అతి స్వల్ప కాలాలను సూచిస్తుంది. ‘ప్రతి క్షణం’ నిరంతర పునరావృతిని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: תִּבְחָנֶנּוּ
  choice: అతన్ని పరీక్షిస్తావు
  rationale: בחן పరిశీలించి పరీక్షించడం లేదా నిజస్వరూపాన్ని నిర్ధారించడం అనే భావాన్ని ఇస్తుంది. ‘పరీక్షిస్తావు’ యోబు అనుభవిస్తున్న భారమైన దైవిక పరిశీలన స్వరాన్ని నిలుపుతుంది.
- source_word: ־נּוּ
  choice: అతన్ని
  rationale: పుంలింగ ఏకవచన ప్రత్యయం ముందటి వచనంలోని మానవునిని సూచిస్తుంది. ‘అతన్ని’ మూలంలోని ఏకవచన సూచనను కాపాడుతుంది.
theological_decisions:
- issue: దేవుని పర్యవేక్షణ స్వరం
  choice: దేవుని చర్యను సన్నిహితమైన, నిరంతర పరిశీలనగా—యోబుకు భారంగా అనిపించే స్వరంతో—అనువదించడం.
  alternative: దానిని కేవలం దయాపూర్వక పరామర్శ లేదా సంరక్షణగా అనువదించడం.
  rationale: యోబు ఫిర్యాదులో ఈ ప్రశ్న ఆదరణను వ్యక్తం చేయదు; తప్పించుకోలేని దైవిక శ్రద్ధను ప్రశ్నిస్తుంది. అందువల్ల సందర్భంలోని ప్రతికూల లేదా భారమైన ఉద్రిక్తతను మృదువుచేయకుండా ఉంచాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ప్రశ్నారూపం వాడబడింది. ఇది 17వ వచనం నుంచి కొనసాగుతున్న వాక్యభాగం కావడంతో మొదటి పాదం ‘పట్టించుకొని’ అని రెండవ పాదంలోని ప్రధాన ప్రశ్నాక్రియతో అనుసంధానించబడింది. మూలంలోని సమాంతర నిర్మాణం ‘ప్రతి ఉదయం / ప్రతి క్షణం’ ద్వారా నిలుపబడింది.
