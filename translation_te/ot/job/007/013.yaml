translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనా గౌరవప్రదమైన కవితాత్మక శైలి వాడబడింది. ‘మంచం/పరుపు’ అనే సమానార్థక జంట మూలంలోని సమాంతరతను నిలుపుతుంది. వాక్యం తరువాతి వచనంలో కొనసాగుతుందని సూచించేందుకు చివర విరామచిహ్నం ఉంచబడింది.
