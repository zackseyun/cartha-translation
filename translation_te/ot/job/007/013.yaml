translation:
  language: te
  text: '“నా మంచం నన్ను ఓదార్చుతుంది;

    నా పరుపు నా మొరను[b] భరిస్తుంది”

    అని నేను అనుకున్నప్పుడు[a],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ఎందుకంటే నేను అనుకున్నాను’ లేదా ‘నేను అనుకుంటే’ అని కూడా అనువదించవచ్చు. ఇక్కడి హీబ్రూ పదం כִּיకి ఒకటి కంటే ఎక్కువ భావాలు సాధ్యమే; తరువాతి వచనానికి దారితీసే సందర్భంలో ‘అనుకున్నప్పుడు’ బాగా సరిపోతుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘నా మొర’కు బదులుగా ‘నా మననం’ లేదా ‘నా ఆలోచన’ అని కూడా అనువదించవచ్చు. హీబ్రూ שִׂיחַ మననం లేదా విలాపభరితమైన మాటలను సూచించగలదు; యోబు బాధ సందర్భంలో ‘మొర’ అనేది సంభావ్యమైన భావం.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: అనుకున్నప్పుడు
  rationale: ఇక్కడ כִּי కారణాన్ని తప్పనిసరిగా సూచించకుండా, యోబు ఆశతో అనుకునే సందర్భాన్ని పరిచయం చేస్తుంది. తరువాతి వచనంలో ఆ ఆశ భగ్నమవుతున్న ప్రవాహానికి ‘అనుకున్నప్పుడు’ సహజంగా సరిపోతుంది.
- source_word: אָמַרְתִּי
  choice: అని నేను అనుకున్నప్పుడు
  rationale: రూపరీత్యా ఇది సంపూర్ణ క్రియ (‘నేను అన్నాను’); అయితే సందర్భంలో అంతరంగంగా తలచుకోవడం లేదా మళ్లీ మళ్లీ అనుకోవడం భావం ఉంది. తెలుగులో ‘అనుకున్నప్పుడు’ ఆ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: תְּנַחֲמֵנִי
  choice: నాకు ఓదార్పునిస్తుంది
  rationale: נחם పియేల్ రూపానికి ఓదార్చడం లేదా ఆదరించడం అనే భావం ఉంది. బాధలో విశ్రాంతి దొరుకుతుందనే ఆశను ‘ఓదార్పునిస్తుంది’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: עַרְשִׂי
  choice: నా మంచం
  rationale: עֶרֶשׂ మంచం లేదా శయ్యను సూచిస్తుంది. తరువాతి సమానార్థక పదంతో స్వల్ప వైవిధ్యాన్ని నిలుపుతూ సాధారణ ఆధునిక తెలుగు పదం ‘మంచం’ ఎంచుకోబడింది.
- source_word: יִשָּׂא
  choice: భరిస్తుంది
  rationale: נשא యొక్క ప్రాథమిక భావం ఎత్తడం, మోయడం, భరించడం. యోబు మొర అనే భారాన్ని పరుపు భరిస్తుందన్న కవితాత్మక రూపకాన్ని ఈ పదం నిలుపుతుంది.
- source_word: בְשִׂיחִי
  choice: నా మొరను
  rationale: שִׂיחַ ధ్యానపూర్వక ఆలోచనను, మనోభావ వ్యక్తీకరణను, లేదా విలాపభరిత ఫిర్యాదును సూచించవచ్చు. యోబు బాధ సందర్భంలో ‘మొర’ విలాప స్వరాన్ని సహజంగా తెలియజేస్తూ, కేవలం అధికారిక ‘ఫిర్యాదు’ అనే భావాన్ని నివారిస్తుంది.
- source_word: מִשְׁכָּבִי
  choice: నా పరుపు
  rationale: מִשְׁכָּב పడుకునే స్థలం, మంచం లేదా పరుపును సూచిస్తుంది. עַרְשִׂיతో ఉన్న కవితాత్మక సమాంతరతను, అలాగే స్వల్ప పదవైవిధ్యాన్ని నిలుపడానికి ‘పరుపు’ వాడబడింది.
