id: JOB.7.20
reference: Job 7:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: חָטָ֡אתִי מָ֤ה אֶפְעַ֨ל לָ/ךְ֮ נֹצֵ֪ר הָ/אָ֫דָ֥ם לָ֤/מָה שַׂמְתַּ֣/נִי לְ/מִפְגָּ֣ע לָ֑/ךְ וָ/אֶהְיֶ֖ה עָלַ֣/י לְ/מַשָּֽׂא׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/007/020.yaml
  text: If I have sinned[a], what can I do to you, watcher of mankind? Why have you made me your target[c][b], so that I have become a burden to myself?
translation:
  language: te
  text: నేను పాపం చేసి ఉంటే[a], మానవజాతిని గమనించేవాడా, నీకు నేనేమి చేయగలను? నన్ను నీ లక్ష్యంగా ఎందుకు చేసుకున్నావు[b], దాంతో నాకు నేనే భారమయ్యాను[c]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నేను పాపం చేశాను.”
    reason: హీబ్రూ క్రియ రూపపరంగా ప్రథమ పురుష ఏకవచన సంపూర్ణ క్రియ. సందర్భంలో దీనిని షరతుతో కూడిన, వాదనాత్మక ప్రశ్నగా కూడా అర్థం చేసుకోవచ్చు.
  - marker: b
    text: అక్షరార్థంగా, “నన్ను నీ కోసం ఒక లక్ష్యంగా ఎందుకు ఉంచావు?”
    reason: హీబ్రూ దత్తివిభక్తి భావాన్ని ప్రధాన వచనంలోని “నీ లక్ష్యంగా” అనే సహజ తెలుగు ప్రయోగంలో ఇమిడ్చాం.
  - marker: c
    text: హీబ్రూ పాఠం, “నాకు నేనే భారమయ్యాను.” కొన్ని ప్రాచీన అనువాదాలు, “నీకు భారమయ్యాను” అనే పాఠాన్ని ప్రతిబింబిస్తాయి.
    reason: మసొరా పాఠంలోని עָלַי (‘నాకు/నా మీద’)ను ప్రధాన వచనంలో నిలుపుతూ, ప్రాచీన పాఠాంతరాన్ని పాదటిప్పణిలో నమోదు చేశాం.
lexical_decisions:
- source_word: חָטָאתִי
  choice: నేను పాపం చేసి ఉంటే
  rationale: రూపపరంగా ఇది ప్రథమ పురుష ఏకవచన సంపూర్ణ క్రియ, ‘నేను పాపం చేశాను.’ అయితే సందర్భంలోని వాదనాత్మక, ఒప్పుకోలు-ఆధారిత ప్రశ్న భావాన్ని తెలుగులో సహజంగా నిలుపుటకు ‘చేసి ఉంటే’ అని అనువదించాం; ఇది నేరుగా పాపస్వీకారం చేసినట్లు అతిశయింపదు.
- source_word: מָה אֶפְעַל לָךְ
  choice: నీకు నేను ఏమి చేయగలను?
  rationale: ఇక్కడి అసంపూర్ణ క్రియ దేవునిపై యోబు ఏ ప్రభావం చూపగలడనే అలంకారిక ప్రశ్నను సూచిస్తుంది. ‘ఏమి చేయగలను?’ అనేది అతని అశక్తతను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: נֹצֵר הָאָדָם
  choice: మానవజాతిని కనిపెట్టుకొని ఉండేవాడా
  rationale: נֹצֵר అనే పదంలో కాపాడటం, గమనించడం, నిశితంగా పరిశీలించడం అనే భావాలు కలవు. ఫిర్యాదు సందర్భంలో ఈ ద్వంద్వార్థాన్ని కొంతవరకు నిలుపుతూ ‘కనిపెట్టుకొని ఉండేవాడు’ అని ఇచ్చాం. הָאָדָם ఇక్కడ సమష్టిగా మానవజాతిని సూచిస్తుంది.
- source_word: לָמָה שַׂמְתַּנִי לְמִפְגָּע לָךְ
  choice: నన్ను నీ లక్ష్యంగా ఎందుకు చేసుకున్నావు?
  rationale: מִפְגָּע దెబ్బ తగిలే వస్తువు లేదా దాడికి గురిచేసే లక్ష్యాన్ని సూచించగలదు. ‘నీ లక్ష్యం’ సంక్షిప్తంగా, సహజంగా ఉండి యోబు ఫిర్యాదును స్పష్టంగా తెలియజేస్తుంది.
- source_word: וָאֶהְיֶה עָלַי לְמַשָּׂא
  choice: దాంతో నాకు నేనే భారమయ్యాను
  rationale: మసొరా పాఠంలోని עָלַי సహజంగా ‘నాకు/నా మీద’ అనే అర్థాన్నిస్తుంది. అందువల్ల కఠినమైనప్పటికీ బలంగా ధృవీకృతమైన ‘నాకు నేనే భారం’ అనే పాఠాన్ని ప్రధాన వచనంలో నిలిపాం.
theological_decisions:
- issue: הָאָדָם అనే ఏకవచన సామాన్య పదం
  choice: మానవజాతి
  alternative: మనిషి
  rationale: హీబ్రూలో వ్యాకరణపరంగా ఏకవచనమైనా ఇక్కడ అది సమస్త మానవాళిని ప్రతినిధిగా సూచిస్తుంది. ఆధునిక తెలుగులో ‘మానవజాతి’ సమష్టి భావాన్ని స్పష్టంగా, లింగపరమైన అపార్థం లేకుండా అందిస్తుంది.
- issue: עָלַי మరియు కొన్ని ప్రాచీన అనువాదాలలో కనిపించే ప్రత్యామ్నాయ పాఠం
  choice: నాకు నేనే భారమయ్యాను
  alternative: నీకు భారమయ్యాను
  rationale: WLC మసొరా పాఠం עָלַי (‘నాకు/నా మీద’)ను కలిగి ఉంది. కొన్ని ప్రాచీన సాక్ష్యాలు ‘నీకు’ అనే పాఠాన్ని ప్రతిబింబించినా, దానిని ప్రధాన పాఠంలోకి తేవకుండా పాదటిప్పణిలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన ప్రార్థనా-ఫిర్యాదు శైలిని పాటించాం. ‘కనిపెట్టుకొని ఉండేవాడా’ అనే సంబోధన కాపలా/పరిశీలన అనే మూలపద ద్వంద్వార్థాన్ని సాధ్యమైనంతవరకు నిలుపుతుంది; ‘లక్ష్యం,’ ‘భారం’ సాధారణ పాఠకులకు స్పష్టమైన పదాలు.
