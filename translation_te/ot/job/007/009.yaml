source:
  edition: WLC
  text: כָּלָ֣ה עָ֭נָן וַ/יֵּלַ֑ךְ כֵּ֥ן יוֹרֵ֥ד שְׁ֝א֗וֹל לֹ֣א יַעֲלֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/007/009.yaml
  text: As a cloud fades away and vanishes[a], so the one who goes down to Sheol does not come up.
translation:
  language: te
  text: మేఘం మాయమై వెళ్లిపోయినట్లే, షెయోల్‌లోకి దిగిపోయేవాడు పైకి రాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘షెయోల్’కు ‘సమాధి’ లేదా ‘మృతుల లోకం’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּלָה
  choice: కరిగిపోయి
  rationale: ఈ క్రియ ముగిసిపోవడం లేదా పూర్తిగా తరిగిపోవడం అనే భావాన్ని ఇస్తుంది. మేఘం సందర్భంలో ‘కరిగిపోవడం’ దాని చెదిరిపోయే దృశ్యాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: עָנָן
  choice: మేఘం
  rationale: సాధారణ నామార్థం; మేఘం చెదిరిపోయే దృశ్యమే ఈ ఉపమానానికి ఆధారం.
- source_word: וַיֵּלַךְ
  choice: కనుమరుగైనట్లే
  rationale: అక్షరార్థంగా ‘వెళ్లిపోయింది’; అయితే כָּלָהతో కలసి మేఘం ఇక కనిపించకుండా పోవడాన్ని సూచిస్తుంది. ‘కనుమరుగవడం’ ఆ ఫలితాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: כֵּן
  choice: అట్లే
  rationale: మేఘపు దృశ్యాన్ని షియోలులోకి దిగేవాని స్థితితో పోల్చే సంక్షిప్తమైన, సహజమైన అనుసంధానం.
- source_word: יוֹרֵד
  choice: దిగిపోయేవాడు
  rationale: ఈ కృదంతం సాధారణంగా అలాంటి వ్యక్తిని సూచిస్తుంది. తెలుగు రూపం ఆ సాధారణ వర్తమాన స్వభావాన్ని నిలుపుతుంది.
- source_word: שְׁאוֹל
  choice: షియోలు
  rationale: ‘సమాధి’ లేదా ‘మృతుల లోకం’ అని భావాన్ని సంకుచితం చేయకుండా, హీబ్రూ భావప్రపంచంలోని అస్పష్టతను నిలుపుటకు పదాన్ని లిప్యంతరీకరించాం.
- source_word: לֹא יַעֲלֶה
  choice: తిరిగి పైకి రాడు
  rationale: ‘దిగిపోవడం’కు ప్రతిగా ఉన్న నిలువు దిశా దృశ్యాన్ని ‘పైకి రావడం’ నిలుపుతుంది. ‘తిరిగి’ సందర్భంలోని తిరిగిరాని భావాన్ని సహజ తెలుగులో స్పష్టం చేస్తుంది.
theological_decisions:
- issue: שְׁאוֹל పదానువాదం
  choice: షియోలు
  alternative: సమాధి; మృతుల లోకం
  rationale: ఈ హీబ్రూ పదం సమాధిని, పాతాళాన్ని లేదా మృతుల స్థితి/లోకాన్ని సూచించగలదు. లిప్యంతరీకరణ ఈ భావపరిధిని తెరిచి ఉంచి, పునరుత్థానం గురించి ఈ ఒక్క వాక్యం చెప్పేదానికంటే విస్తృతమైన సిద్ధాంత నిర్ణయాన్ని దానిపై రుద్దకుండా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కవితాత్మక వాక్యనిర్మాణం వాడబడింది. ‘కరిగిపోయి కనుమరుగైనట్లే’ అనే జత హీబ్రూలోని రెండు క్రియలను ప్రతిబింబిస్తుంది; ‘షియోలు’ మూలపదంలోని భావపరమైన విస్తృతిని నిలుపుతుంది.
