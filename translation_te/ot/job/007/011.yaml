  text: גַּם אֲנִי֮ לֹ֤א אֶחֱשָׂ֫ךְ פִּ֥/י אֲֽ֭דַבְּרָה בְּ/צַ֣ר רוּחִ֑/י אָ֝שִׂ֗יחָה בְּ/מַ֣ר נַפְשִֽׁ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/007/011.yaml
  text: I also will not restrain my mouth[a]; I will speak in the distress of my spirit[c][b]; I will complain in the bitterness of my soul.
translation:
  language: te
  text: నేను కూడా నా నోటిని అదుపు చేసుకోను[a]; నా ఆత్మ వేదనలో[b] మాట్లాడతాను; నా ప్రాణపు చేదులో నా గోడు వెళ్లబోసుకుంటాను[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నా నోటిని నిరోధించను.’ హీబ్రూ నుడికారం నోటిని వెనక్కి పట్టుకోవడం లేదా అదుపుచేయడం గురించి అక్షరార్థంగా చెబుతుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘నా ఆత్మ యాతనలో’ లేదా ‘నా ఆత్మ వేదననుండి.’ ఇక్కడి హీబ్రూ పదబంధం అంతరంగపు ఇరుకు, బాధ లేదా యాతనను సూచించగలదు.
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘విలపిస్తాను’ లేదా ‘మాట్లాడతాను.’ హీబ్రూ క్రియ సందర్భాన్ని బట్టి ధ్యానించడం, పలకడం, గోడు చెప్పడం లేదా విలపించడం అనే భావాలను కలిగి ఉండగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: కూడా
  rationale: ఈ పదానికి ఉన్న ప్రధానమైన సంకలన భావాన్ని నిలుపుతుంది; మూలంలో స్పష్టంగా లేని కారణార్థక ‘కాబట్టి’ని చేర్చదు.
- source_word: לֹא אֶחֱשָׂךְ פִּי
  choice: నా నోటిని అదుపు చేసుకోను
  rationale: ‘నోటిని నిరోధించను’ అనే హీబ్రూ రూపకాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతూ, యోబు ఇక తన మాటలను ఆపుకోననే భావాన్ని తెలియజేస్తుంది.
- source_word: אֲדַבְּרָה
  choice: మాట్లాడతాను
  rationale: మొదటి పురుష ఏకవచన సంకల్పాన్ని సూటిగా వ్యక్తం చేస్తుంది.
- source_word: בְּצַר רוּחִי
  choice: నా ఆత్మ వేదనలో
  rationale: צַר లోని ఇరుకు, బాధ, వేదన భావాలలో సందర్భానికి తగిన ‘వేదన’ను ఎంచుకుంది; רוּחַను నֶפֶשׁతో కలపకుండా ‘ఆత్మ’గా ఉంచింది.
- source_word: אָשִׂיחָה
  choice: నా గోడు వెళ్లబోసుకుంటాను
  rationale: ఈ సందర్భంలో ధ్యానించడం, మాట్లాడడం అనే సాధ్యార్థాలకన్నా విలాపపూర్వకంగా తన బాధను పలకడం ప్రధానంగా ఉంది; తెలుగు వాడుకలో ‘గోడు వెళ్లబోసుకోవడం’ ఆ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: בְּמַר נַפְשִׁי
  choice: నా ప్రాణంలోని చేదుతో
  rationale: מַר లోని ‘చేదు’ రూపకాన్ని నిలుపుతూ, נֶפֶשׁను ‘ప్రాణం’గా అనువదించడం ద్వారా ముందున్న רוּחַ (‘ఆత్మ’)తో ఉన్న పదభేదాన్ని కాపాడుతుంది.
theological_decisions:
- issue: హీబ్రూ కవిత్వంలో רוּחַ మరియు נֶפֶשׁ అనే మానవ అంతరంగ పదాలు
  choice: వాటిని వరుసగా ‘ఆత్మ’, ‘ప్రాణం’ అని భిన్నంగా అనువదించడం
  alternative: రెండింటినీ ‘మనసు’ లేదా ‘అంతరంగం’ అని ఒకే పదంలో కలపడం
  rationale: ఈ సమాంతర పాదాలలో రెండు వేర్వేరు హీబ్రూ పదాలు ఉన్నాయి. వాటి భేదాన్ని నిలుపడం కవితా నిర్మాణాన్ని కాపాడుతుంది; అయితే మానవ స్వభావ నిర్మాణంపై ఏదైనా సాంకేతిక సిద్ధాంతాన్ని ఈ వచనంపై రుద్దదు.
- issue: אָשִׂיחָה యొక్క సందర్భార్థం
  choice: విలాపభరితమైన మాటగా ‘నా గోడు వెళ్లబోసుకుంటాను’
  alternative: ‘ధ్యానిస్తాను’ లేదా కేవలం ‘మాట్లాడతాను’
  rationale: ‘నా ప్రాణంలోని చేదుతో’ అనే సమాంతర పదబంధం ఫిర్యాదు లేదా విలాప భావాన్ని బలపరుస్తుంది; ఇతర సాధ్యార్థాలను పాదటిప్పణిలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా రూపొందించబడింది. ‘నోటిని అదుపు చేసుకోవడం’, ‘గోడు వెళ్లబోసుకోవడం’ సాధారణ పాఠకులకు స్పష్టమైన నుడికారాలు. ‘ఆత్మ’ మరియు ‘ప్రాణం’ పదాలను వేర్వేరుగా ఉంచి హీబ్రూ కవిత్వంలోని సమాంతరతను, పదభేదాన్ని కాపాడాం.
