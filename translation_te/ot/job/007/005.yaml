  variant: modern standard Telugu
source:
  edition: WLC
  text: לָ֘בַ֤שׁ בְּשָׂרִ֣/י רִ֭מָּה ו/גיש עָפָ֑ר עוֹרִ֥/י רָ֝גַ֗ע וַ/יִּמָּאֵֽס׃
base_translation:
  language: en
  yaml_path: translation/ot/job/007/005.yaml
  text: My flesh is clothed with worms and clods of dust; my skin hardens[a], then breaks out again.
translation:
  language: te
  text: నా మాంసం పురుగులతోను ధూళి గడ్డలతోను కప్పబడి ఉంది; నా చర్మం గట్టిపడి[a], మళ్లీ పగిలిపోతుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నా చర్మం మూసుకుపోయి, మళ్లీ పుండుగా మారుతుంది.” చివరి రెండు హీబ్రూ క్రియల అర్థం క్లిష్టంగా ఉంది. చర్మం కొద్దిసేపు మానినట్లు మూసుకుపోయి, ఆ తర్వాత మళ్లీ పగిలిపోవడాన్ని ఈ పాదం వర్ణిస్తుండవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: לָבַשׁ
  choice: వస్త్రంలా ధరించింది
  rationale: ‘ధరించు’ అనే మూలరూపకాన్ని నిలుపుతూ, మాంసాన్ని పురుగులు మరియు మట్టి గడ్డలు కప్పివేశాయనే భయానక చిత్రాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בְּשָׂרִי
  choice: నా మాంసం
  rationale: శారీరక బాధను నేరుగా చూపించే ‘మాంసం’ అనే ప్రాథమిక అర్థాన్ని నిలుపుతుంది; ‘శరీరం’ కంటే మూలానికి దగ్గరగా ఉంటుంది.
- source_word: רִמָּה
  choice: పురుగులు
  rationale: క్షయంతో సంబంధమున్న పురుగులు లేదా లార్వాలను సూచించే విస్తృత పదం; ‘మగ్గట్లు’ వంటి మరింత నిర్దిష్టమైన భావాన్ని అనవసరంగా విధించదు.
- source_word: גיש עפר
  choice: మట్టి గడ్డలు
  rationale: అరుదైన మొదటి పదం గడ్డ, ముద్ద లేదా పొర అనే భావాన్ని ఇవ్వవచ్చు; ‘మట్టి గడ్డలు’ మూలంలోని ధూళి/మట్టి చిత్రాన్ని స్పష్టంగా, సహజంగా అందిస్తుంది.
- source_word: עוֹרִי
  choice: నా చర్మం
  rationale: ఇది సాధారణమైన, నేరమైన సమానార్థకం; ఆధునిక ప్రామాణిక తెలుగులో సహజంగా ఉంటుంది.
- source_word: רָגַע
  choice: గట్టిపడి
  rationale: ఈ కఠినమైన క్రియను రోగగ్రస్త చర్మం కొంతసేపు గట్టిపడటం లేదా మూసుకుపోవడం అనే సందర్భార్థంతో అనువదించింది; అనిశ్చితిని పాదసూచికలో తెలియజేస్తుంది.
- source_word: וַיִּמָּאֵס
  choice: మళ్లీ పగిలిపోతుంది
  rationale: చర్మం తిరిగి తెరుచుకోవడం లేదా పుండుగా మారడం అనే సందర్భోచిత భావాన్ని ఇస్తుంది. మూలక్రియ అర్థం క్లిష్టమైనందున ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యేలా గంభీరమైన శైలిని వాడింది. మొదటి భాగంలోని వస్త్రధారణ రూపకాన్ని నిలిపి, చివరి రెండు క్లిష్టమైన క్రియల సందర్భార్థాన్ని ప్రధాన పాఠ్యంలో సహజంగా ఇచ్చి, నిజమైన పాఠ్య అనిశ్చితిని పాదసూచికలో స్పష్టంగా సంరక్షించింది.
