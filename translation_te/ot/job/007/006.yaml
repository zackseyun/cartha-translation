  text: My days are swifter than a weaver’s shuttle[b][a]; they come to an end without hope.
translation:
  language: te
  text: నా రోజులు నేత కండె కంటే వేగంగా గడిచిపోతున్నాయి[a]; అవి ఆశ లేకుండా ముగిసిపోతున్నాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నేత కండె’కు మూలంలోని పదం మరింత సాధారణంగా ‘నేత సాధనం’ లేదా ‘మగ్గం’ అని కూడా అర్థం కావచ్చు; అయితే వేగంగా కదిలే దృశ్యానికి ‘నేత కండె’ బాగా సరిపోతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָמַי
  choice: నా రోజులు
  rationale: మూలంలోని బహువచన రూపాన్ని నేరుగా నిలుపుతూ, యోబు అనుభవిస్తున్న జీవితకాలపు క్షణభంగురతను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: קַלּוּ
  choice: వేగంగా గడిచిపోతున్నాయి
  rationale: קלל ఇక్కడ ‘వేగంగా ఉండడం/కదలడం’ అనే భావంలో ఉంది. రోజుల విషయంగా తెలుగులో ‘వేగంగా గడిచిపోతున్నాయి’ సహజంగా ఉండి, పోలికలోని వేగాన్ని నిలుపుతుంది.
- source_word: מִנִּי אָרֶג
  choice: నేతగాని పడుగు కంటే
  rationale: אֹרֶג నేయడానికి ఉపయోగించే సాధనాన్ని సూచించగలదు; వేగంగా అటూ ఇటూ కదిలే shuttle అనే చిత్రానికి తెలుగులో ‘నేతగాని పడుగు’ సరిపోతుంది. పదంలోని సాధారణ ‘నేత సాధనం/మగ్గం’ భావసాధ్యతను పాదటిప్పణిలో ఉంచాం.
- source_word: וַיִּכְלוּ
  choice: ముగిసిపోతున్నాయి
  rationale: כלה యొక్క ‘ముగియడం, అంతానికి చేరడం’ అనే అర్థాన్ని రోజుల సందర్భంలో స్పష్టంగా, సహజంగా అందిస్తుంది.
- source_word: בְּאֶפֶס תִּקְוָה
  choice: నిరీక్షణ లేకుండానే
  rationale: אפס లోని లేమి భావాన్నీ תקוה లోని ఆశ/నిరీక్షణ భావాన్నీ సంక్షిప్తంగా నిలుపుతుంది; ‘-నే’ ఆ ముగింపులో నిరీక్షణ పూర్తిగా లేకపోవడాన్ని సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: תִּקְוָה యొక్క భావం
  choice: నిరీక్షణ
  alternative: ఆశ
  rationale: ఈ విలాప సందర్భంలో భవిష్యత్తుపై ఎదురుచూపు, ఆశ రెండూ సాధ్యమే. ‘నిరీక్షణ’ మూలపదంలోని ఎదురుచూపు భావాన్ని నిలుపుతూ, వాక్యంలోని నిరాశను ఏ ప్రత్యేక సిద్ధాంతార్థానికీ పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యేలా గంభీరమైన కవితాత్మక శైలిని పాటించాం. ‘పడుగు’ నేయు shuttle‌కు వాడుకలో ఉన్న సంక్షిప్త పదం; సంభావ్య విస్తృత అర్థాన్ని పాదటిప్పణి కాపాడుతుంది.
