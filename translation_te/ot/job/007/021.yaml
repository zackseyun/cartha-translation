id: JOB.7.21
reference: Job 7:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/מֶ֤ה לֹא תִשָּׂ֣א פִשְׁעִ/י֮ וְ/תַעֲבִ֪יר אֶת עֲוֺ֫נִ֥/י כִּֽי עַ֭תָּה לֶ/עָפָ֣ר אֶשְׁכָּ֑ב וְ/שִׁ֖חֲרְתַּ֣/נִי וְ/אֵינֶֽ/נִּי׀־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/job/007/021.yaml
  text: Why do you not pardon my transgression and take away my iniquity? For now I will lie down in the dust[a]; you will seek me diligently[b], but I will be gone.
translation:
  language: te
  text: నా అతిక్రమాన్ని నీవెందుకు క్షమించవు? నా దోషాన్ని ఎందుకు తొలగించవు? ఎందుకంటే, ఇక నేను ధూళిలో పడుకుంటాను; నీవు నన్ను శ్రద్ధగా వెదకుతావు[a], కాని నేను ఉండను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నీవు వేకువనే నన్ను వెదకుతావు.’ హీబ్రూ క్రియలో వేకువనే వెదకడం అనే భావం ఉండవచ్చు; ఇక్కడ అది శ్రద్ధగా లేదా పట్టుదలగా వెదకడాన్ని సూచించే అవకాశం ఎక్కువ.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִשָּׂא
  choice: క్షమించవు
  rationale: נשׂא అనే క్రియకు ప్రాథమికంగా ‘ఎత్తు/మోయు’ అనే అర్థం ఉన్నా, అతిక్రమాన్ని కర్మగా తీసుకున్నప్పుడు దాన్ని మోసివేయడం, క్షమించడం అనే నుడికారార్థం వస్తుంది.
- source_word: פִשְׁעִי
  choice: నా అతిక్రమాన్ని
  rationale: פשע ఉద్దేశపూర్వక హద్దుమీర్పు లేదా తిరుగుబాటు భావాన్ని కలిగి ఉంటుంది; ‘అతిక్రమం’ దాని నైతిక బరువును నిలుపుతుంది.
- source_word: וְתַעֲבִיר
  choice: తొలగించవు
  rationale: עבר హిఫీల్ రూపం ‘దాటించు/పోయేలా చేయు’ నుండి ‘తొలగించు’ అనే భావాన్ని ఇస్తుంది; దోషం విషయంలో ఇది సహజమైన తెలుగు ప్రయోగం.
- source_word: עֲוֺנִי
  choice: నా దోషాన్ని
  rationale: עון అపరాధం, దోషం, దాని బాధ్యత లేదా పరిణామం అనే పరిధిని కలిగి ఉంటుంది. ఇక్కడ פשעతో సమాంతరంగా ఉన్నప్పటికీ భిన్న పదంగా ‘దోషం’ అనడం ఆ వ్యత్యాసాన్ని కాపాడుతుంది.
- source_word: כִּי עַתָּה
  choice: ఇప్పుడు
  rationale: ఈ పదబంధం యోబు సమీపిస్తున్న మరణాన్ని ఆధారంగా చూపుతుంది; తెలుగులో ‘ఇప్పుడు’ సందర్భానుసారంగా కారణాత్మక-కాలార్థాన్ని సహజంగా అందిస్తుంది.
- source_word: לֶעָפָר אֶשְׁכָּב
  choice: నేను ధూళిలో పడుకుంటాను
  rationale: మరణం, సమాధి భావాలను వ్యాఖ్యానించి ‘చనిపోతాను’ అనకుండా, మూలంలోని స్పష్టమైన కావ్యచిత్రాన్ని నిలుపుతుంది.
- source_word: וְשִׁחֲרְתַּנִי
  choice: నీవు నన్ను ఆతురంగా వెదకుతావు
  rationale: שׁחר పియేల్ రూపంలో వేకువనే వెదకడం నుండి ఉద్భవించిన శ్రద్ధగల లేదా ఆత్రుతతో కూడిన అన్వేషణ భావం ఉంది; ‘ఆతురంగా’ ఆ నుడికారబలాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וְאֵינֶנִּי
  choice: కాని నేను ఉండను
  rationale: అక్షరార్థంగా ‘నేను లేను’; ముందున్న భవిష్యత్ క్రియల సందర్భంలో అంతర్ధానం లేదా మరణాన్ని సూచించే ఈ సంక్షిప్తతను తెలుగు భవిష్యత్ రూపంలో నిలిపింది.
theological_decisions:
- issue: రెండు పాపపదాల భేదం
  choice: פשעకు ‘అతిక్రమం’, עוןకు ‘దోషం’
  alternative: రెండింటికీ ‘పాపం’ అనడం
  rationale: మూలంలోని సంబంధితమైనా భిన్నమైన పదాలను వేరు చేసి అనువదించడం కావ్య సమాంతరతను, నైతిక పదసంపదను సమతలీకరించకుండా కాపాడుతుంది.
- issue: לֶעָפָר אֶשְׁכָּבలోని మరణచిత్రం
  choice: ‘ధూళిలో పడుకుంటాను’ అనే concrete చిత్రాన్ని నిలుపడం
  alternative: ‘చనిపోతాను’ అని వ్యాఖ్యానించడం
  rationale: మూలం మరణాన్ని నేరుగా చెప్పకుండా ధూళి, పడుకోవడం అనే కావ్యచిత్రంతో వ్యక్తం చేస్తుంది; అదే చిత్రాన్ని నిలుపడం వ్యాఖ్యానాత్మక పరిష్కారాన్ని నివారిస్తుంది.
- issue: וְאֵינֶנִּי యొక్క కాలం మరియు భావం
  choice: ‘కాని నేను ఉండను’
  alternative: ‘నేను వెళ్లిపోయి ఉంటాను’ లేదా ‘నేను చనిపోయి ఉంటాను’
  rationale: హీబ్రూ వాక్యంలోని సంక్షిప్తమైన ‘నేను లేను’ అనే మరణ/అంతర్ధాన నుడికారాన్ని స్పష్టీకరించి అతిగా వ్యాఖ్యానించకుండా భవిష్యత్ సందర్భానికి అనుగుణంగా అందిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన, సులభగ్రాహ్యమైన శైలి. దేవునితో ఏకవచన సంభాషణకు ‘నీవు’ వాడబడింది. మూలంలోని రెండు ప్రశ్నలు తెలుగులో స్పష్టతకోసం విడిగా ఉంచబడ్డాయి; మరణాన్ని సూచించే ధూళి చిత్రం అలాగే నిలుపబడింది.
