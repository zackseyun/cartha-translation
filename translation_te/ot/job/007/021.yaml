revisions:
- from: నా అతిక్రమాన్ని నీవు ఎందుకు క్షమించవు? నా దోషాన్ని ఎందుకు తొలగించవు? ఇప్పుడు నేను ధూళిలో పడుకుంటాను; నీవు నన్ను ఆతురంగా వెదకుతావు[a], కాని నేను ఉండను.
  to: నా అతిక్రమాన్ని నీవెందుకు క్షమించవు? నా దోషాన్ని ఎందుకు తొలగించవు? ఎందుకంటే, ఇక నేను ధూళిలో పడుకుంటాను; నీవు నన్ను శ్రద్ధగా వెదకుతావు[a], కాని నేను ఉండను.
