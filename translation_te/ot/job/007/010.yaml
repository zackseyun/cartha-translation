  text: He does not return again to his house[a], and his place does not know him anymore.
translation:
  language: te
  text: 'అతడు ఇక తన ఇంటికి తిరిగి రాడు;

    అతని స్థలం ఇక అతణ్ణి గుర్తించదు.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతని స్థలం ఇక అతణ్ణి ఎరుగదు.” హీబ్రూ క్రియకు గుర్తించడం, గుర్తుపట్టడం లేదా ఎరుగడం అనే భావాలు రావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשׁוּב
  choice: తిరిగి రాడు
  rationale: שׁוב అంటే ‘తిరిగి రావడం/వెళ్లడం.’ ఇంటికి చేరడాన్ని సూచించే సందర్భంలో ‘తిరిగి రాడు’ సహజంగా ఉండి, మరణించినవాడు సాధారణ జీవితానికి మళ్లీ రాడనే భావాన్ని తెలియజేస్తుంది.
- source_word: עוֹד (మొదటి ప్రయోగం)
  choice: ఇక
  rationale: నిషేధంతో కలిసిన עוֹד కాలపరంగా ‘ఇకపై కాదు’ అనే భావాన్ని ఇస్తుంది. తెలుగులో ‘ఇక ... రాడు’ శాశ్వత గైర్హాజరును సహజంగా వ్యక్తపరుస్తుంది.
- source_word: לְבֵיתוֹ
  choice: తన ఇంటికి
  rationale: בַּיִת యొక్క ప్రత్యక్ష అర్థం ‘ఇల్లు.’ కర్తతో సంబంధాన్ని సహజ తెలుగులో చూపడానికి ‘తన ఇంటికి’ అని అనువదించబడింది.
- source_word: יַכִּירֶנּוּ
  choice: అతణ్ణి గుర్తించదు
  rationale: נכר యొక్క హిఫిల్ రూపం ‘గుర్తించడం,’ ‘గుర్తుపట్టడం,’ లేదా ‘పరిగణించడం’ అనే భావాలను కలిగి ఉండవచ్చు. స్థలాన్ని వ్యక్తిలా చిత్రించే హీబ్రూ కవితా రూపకాన్ని ‘గుర్తించదు’ నిలుపుతుంది.
- source_word: עוֹד (రెండవ ప్రయోగం)
  choice: ఇక
  rationale: రెండవ పాదంలోనూ నిషేధంతో కలిసి ‘ఇకపై ఎన్నడూ కాదు’ అనే భావాన్ని ఇస్తుంది; పాదాల సమాంతరత కోసం ‘ఇక’ నిలుపబడింది.
- source_word: מְקֹמוֹ
  choice: అతని స్థలం
  rationale: מָקוֹם అంటే ‘స్థలం.’ ఇది అతనితో ముడిపడిన నివాసం లేదా జీవితంలోని పరిచిత స్థలాన్ని సూచించవచ్చు. ‘అతని స్థలం’ మూలంలోని సంక్షిప్తతను, వ్యక్తీకరణను కాపాడుతుంది.
