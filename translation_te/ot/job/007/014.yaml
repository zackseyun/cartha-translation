  register: ఆధునిక ప్రామాణిక తెలుగు; యోబు దేవుణ్ణి ఏకవచనంలో నేరుగా సంబోధిస్తున్న తీరును, కవితాత్మక సమాంతరతను, రెండు హీబ్రూ ఉపసర్గల మధ్యనున్న స్వల్ప భేదాన్ని పాదటిప్పణితో సంరక్షించింది.
