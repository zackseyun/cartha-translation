translation:
  language: te
  text: అప్పుడు నీవు కలలతో నన్ను భయపెడతావు; దర్శనాలతో నన్ను వణికిస్తావు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీవు కలలలో లేదా కలల ద్వారా నన్ను భయపెడతావు; దర్శనాలనుండి నన్ను వణికిస్తావు.” హీబ్రూ ఉపసర్గలను మరింత రూపపరంగా “లో/ద్వారా” మరియు “నుండి” అని అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ
  choice: అప్పుడు
  rationale: ముందటి వచనంలోని ఫిర్యాదుకు ఇది కొనసాగింపుగా ఉండి, కేవలం కూడికకన్నా సందర్భానుసారమైన ఫలితాన్ని లేదా క్రమాన్ని సూచిస్తుంది.
- source_word: חִתַּתַּנִי
  choice: నన్ను భయభ్రాంతుణ్ణి చేస్తావు
  rationale: పియేల్ రూపంలోని తీవ్రమైన భయపెట్టే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; భౌతికంగా ‘చితగ్గొట్టడం’ అనే అర్థాన్ని అనవసరంగా రుద్దదు.
- source_word: בַחֲלֹמוֹת
  choice: కలలతో
  rationale: ב ఉపసర్గ ఇక్కడ సాధనార్థకంగా గ్రహించవచ్చు; యోబును భయపెట్టే సాధనాన్ని ‘తో’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וּמֵחֶזְיֹנוֹת
  choice: దర్శనాలతో
  rationale: מן మూలం లేదా సాధనాన్ని సూచించగలదు. సమాంతర కవితా నిర్మాణంలో ‘కలలతో’కు అనుగుణంగా ‘దర్శనాలతో’ సహజంగా ఉంటుంది; మరింత రూపపరమైన ప్రత్యామ్నాయం పాదటిప్పణిలో నిలుపబడింది.
- source_word: תְּבַעֲתַנִּי
  choice: నన్ను బెదరగొడతావు
  rationale: ఆకస్మిక భయం లేదా తీవ్ర దిగులును కలిగించే భావాన్ని అందిస్తూ, మొదటి పాదంలోని క్రియను యథాతథంగా పునరావృతం చేయకుండా తెలుగు కవితా సమాంతరతను కాపాడుతుంది.
theological_decisions: []
