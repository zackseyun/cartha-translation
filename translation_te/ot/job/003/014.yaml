  text: עִם מְ֭לָכִים וְ/יֹ֣עֲצֵי אָ֑רֶץ הַ/בֹּנִ֖ים חֳרָב֣וֹת לָֽ/מוֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/003/014.yaml
  text: with kings and counselors of the earth, who built ruins for themselves,
translation:
  language: te
  text: తమ కోసం శిథిలాలను[a] కట్టిన భూలోకపు రాజులతోను సలహాదారులతోను—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పాడుబడిన ప్రదేశాలను.”
    reason: חֳרָבוֹת అనే పదం ‘శిథిలాలు’ లేదా ‘పాడుబడిన/నిర్జన ప్రదేశాలు’ అని అర్థమివ్వగలదు; సందర్భంలోని అసాధారణ పదబంధం వల్ల ప్రత్యామ్నాయాన్ని సూచించడం ఉపయోగకరం.
lexical_decisions:
- source_word: עִם מְלָכִים וְיֹעֲצֵי אָרֶץ
  choice: భూలోకపు రాజులతోను సలహాదారులతోను
  rationale: עִם యొక్క సహవాస భావాన్ని ‘తోను’తో, אָרֶץ యొక్క విస్తృత భూలోక భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలిపింది.
- source_word: הַבֹּנִים
  choice: కట్టుకున్నవారితోను
  rationale: నిర్మించే/కట్టే అనే క్రియార్థాన్ని నిలుపుతూ, לָמוֹ సూచించే స్వప్రయోజన భావాన్ని తెలుగులో సహజంగా కలిపింది.
- source_word: חֳרָבוֹת
  choice: శిథిలాలను
  rationale: పదానికి ప్రధానంగా ఉన్న ‘శిథిలాలు/పాడుబడిన ప్రదేశాలు’ అనే భావాన్ని తీసుకొని, ‘శిథిలాలను కట్టుకోవడం’ అనే మూలంలోని ఉద్దేశపూర్వక విరోధాభాసాన్ని పరిష్కరించకుండా నిలిపింది.
- source_word: לָמוֹ
  choice: తమ కోసం
  rationale: బహువచన స్వప్రయోజన లేదా సంబంధ భావాన్ని స్పష్టమైన, సహజమైన తెలుగులో వ్యక్తం చేసింది.
theological_decisions:
- issue: ‘శిథిలాలను కట్టుకోవడం’ అనే అసాధారణ పదబంధం
  choice: అసాధారణతను యథాతథంగా నిలిపి ‘తమ కోసం శిథిలాలను కట్టుకున్నవారు’ అని అనువదించడం
  alternative: ‘తమ కోసం సమాధులను/నిర్జన ప్రాసాదాలను కట్టుకున్నవారు’ అని భావాన్ని నిర్దిష్టం చేయడం
  rationale: మూలపాఠం సమాధులు, స్మారకాలు లేదా పాడైన రాజభవనాలు అని స్పష్టంగా చెప్పదు. ఏదో ఒక వ్యాఖ్యానాన్ని పాఠ్యంలో ప్రవేశపెట్టకుండా కావ్యాత్మక ఉద్వేగాన్ని కాపాడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కావ్యోచిత గౌరవభావం కోసం ‘భూలోకపు’ వాడబడింది. వాక్యం పరిసర వచనంతో కలిసే భాగవాక్యంగా ఉండటంతో చివర డాష్ ఉంచబడింది; మూలంలోని కవితాత్మక అస్పష్టతను నిలిపింది.
