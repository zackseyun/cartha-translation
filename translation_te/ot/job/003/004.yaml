theological_decisions:
- issue: శాపోక్తి వంటి కోరికలో దేవుని ప్రత్యక్ష ప్రస్తావన
  choice: ‘పైనుండి దేవుడు’ అనే ప్రత్యక్ష ప్రస్తావనను నిలుపడం
  alternative: ‘పైలోకం’ లేదా ‘పరలోకం’ వంటి పరోక్ష పదప్రయోగం
  rationale: హీబ్రూ మూలం దేవుణ్ణి స్పష్టంగా పేర్కొంటుంది. యోబు విలాపంలోని ధైర్యమైన, ఉద్రిక్తమైన భాషను మృదుపరచకుండా అనువాదం నిలుపాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన కవితా శైలిని వాడాం. వరుసగా వచ్చే ‘ఉండుగాక/కుండుగాక’ రూపాలు హీబ్రూ కోరికాత్మక శాపోక్తి లయను నిలుపుతాయి. మూలంలోని అర్థసందిగ్ధతలను పాదసూచికల్లో ఉంచాం.
