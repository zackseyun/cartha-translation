    text: లేదా ‘దాని సంగతి విచారించకుండుగాక’ లేదా ‘దానిని పట్టించుకోకుండుగాక.’ హీబ్రూ క్రియకు వెదకడం, విచారించడం, శ్రద్ధ చూపడం అనే భావాలు ఉండవచ్చు.
