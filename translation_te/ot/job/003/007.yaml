  yaml_path: translation/ot/job/003/007.yaml
  text: Look, may that night be barren; let no joyful cry enter it.
translation:
  language: te
  text: 'ఇదిగో, ఆ రాత్రి ఫలహీనమై ఉండుగాక;

    దానిలో ఆనందధ్వని ఏదీ రాకుండుగాక.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: ఇదిగో
  rationale: శ్రద్ధను ఆకర్షించే హీబ్రూ ఉద్ఘాటనను సహజమైన, గంభీరమైన తెలుగులో నిలుపుతుంది.
- source_word: גַלְמוּד
  choice: గొడ్రాలిగా
  rationale: సంతానం లేదా ఫలితం లేని స్థితిని సూచించే పదాన్ని, ఈ రాత్రి జననానందానికి దూరంగా ఉండాలనే సందర్భానికి అనుగుణంగా వ్యక్తపరుస్తుంది.
- source_word: רְנָנָה
  choice: ఆనందకేక
  rationale: సాధారణ సంతోషం కంటే గట్టిగా వినిపించే ఉల్లాసధ్వని లేదా జయధ్వని భావాన్ని తెలియజేస్తుంది.
- source_word: תָּבוֹא ... בּוֹ
  choice: దానిలో ... ప్రవేశించకూడదు
  rationale: ‘దానిలోనికి రాకూడదు’ అనే మూలంలోని స్థలరూపకాన్ని సహజమైన తెలుగులో కాపాడుతుంది.
theological_decisions:
- issue: శాపవాక్యంలోని కోరిక/ఆజ్ఞ స్వరూపం
  choice: ఉండుగాక; ... ప్రవేశించకూడదు
  alternative: ఉండాలి; ... రాకూడదు
  rationale: హీబ్రూ జుస్సివ్ మరియు אַל + అసంపూర్ణ క్రియల శాపసదృశ ఆకాంక్షను నిలుపుతూ, దానిని వాస్తవ ప్రకటనగా మార్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో కవితాత్మకమైన, గంభీరమైన శైలి. మూలంలోని రెండు సమాంతర ఆకాంక్షలను అర్ధవిరామంతో నిలిపాం.
