source:
  edition: WLC
  text: לְ֭/גֶבֶר אֲשֶׁר דַּרְכּ֣/וֹ נִסְתָּ֑רָה וַ/יָּ֖סֶךְ אֱל֣וֹהַּ בַּעֲדֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/003/023.yaml
  text: to a man whose way is hidden[b][a], and whom God has hedged in?
translation:
  language: te
  text: తన మార్గం మరుగై ఉన్న[a], దేవుడు అతని చుట్టూ కంచె వేసిన[b] మనిషికి?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘తన దారి దాచబడిన.’
    reason: ‘మార్గం’ అనే రూపకానికి ‘దారి’ ప్రత్యామ్నాయం; నిఫ్అల్ క్రియ దాచబడిన స్థితిని కూడా సూచించగలదు.
  - marker: b
    text: లేదా ‘దేవుడు అతన్ని కంచెతో చుట్టి నిర్బంధించిన’ లేదా ‘మూసివేసిన.’
    reason: క్రియ చుట్టూ కంచె వేయడం, లోపల బంధించడం, లేదా దారిని మూసివేయడం అనే సన్నిహిత చిత్రార్థాలను కలిగి ఉంది.
lexical_decisions:
- source_word: לְגֶבֶר
  choice: మనిషికి
  rationale: לְ అనే విభక్తి ముందటి వచనంలోని ‘ఎందుకు ఇవ్వబడుతుంది?’ అనే ప్రశ్నకు పరోక్ష కర్మను సూచిస్తుంది. גֶּבֶר ఏకవచన పురుషుణ్ని సూచించినా, ఇక్కడ సాధారణంగా ఒక మనిషి గురించిన మాటగా సహజమైన తెలుగు రూపం ‘మనిషికి’ ఎంచుకోబడింది.
- source_word: דַּרְכּוֹ
  choice: తన మార్గం
  rationale: דֶּרֶךְ అక్షరార్థంగా దారి, రూపకాలంకారంగా జీవనగతి లేదా ముందున్న మార్గం కావచ్చు. ‘మార్గం’ ఆ రూపకాన్ని, దాని సందిగ్ధతను నిలుపుతుంది.
- source_word: נִסְתָּרָה
  choice: మరుగైపోయిన
  rationale: నిఫ్అల్ రూపం దాగిన లేదా కనబడకుండా ఉన్న స్థితిని సూచిస్తుంది. ఆ మార్గం అతనికే కనబడటం లేదో, సాధారణంగా మరుగుచేయబడిందో స్పష్టంగా తేల్చకుండా ‘మరుగైపోయిన’ ఉంచుతుంది.
- source_word: וַיָּסֶךְ
  choice: చుట్టూ అడ్డుకట్ట వేసిన
  rationale: ఈ క్రియ చుట్టుముట్టి దారిని మూయడం లేదా లోపల నిర్బంధించడం అనే భావాన్ని ఇస్తుంది. ‘అడ్డుకట్ట వేసిన’ సందర్భంలోని నిరోధ భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אֱלוֹהַּ
  choice: దేవుడు
  rationale: ఇది యోబు గ్రంథంలో దేవునికి వాడే ఏకవచన కావ్యపదం. మూలంలో లేని అదనపు బిరుదును చేర్చకుండా ‘దేవుడు’గా అనువదించబడింది.
- source_word: בַּעֲדוֹ
  choice: చుట్టూ
  rationale: ఈ క్రియతో కలిసినప్పుడు בַּעֲדוֹ ఆ మనిషి చుట్టూ మూసివేయడం లేదా అడ్డుపెట్టడం అనే భావాన్ని ఇస్తుంది.
theological_decisions:
- issue: నిర్బంధానికి కర్త ఎవరు?
  choice: ఆ మనిషి చుట్టూ అడ్డుకట్ట వేసినవాడు దేవుడేనని స్పష్టంగా ఉంచడం
  alternative: దేవుని కర్తృత్వం కనబడకుండా కర్మణి ప్రయోగంలో చెప్పడం
  rationale: మూలపాఠంలో אֱלוֹהַּ స్పష్టమైన కర్త. కాబట్టి యోబు ఫిర్యాదులోని ఉద్రిక్తతను తగ్గించకుండా దేవుని కర్తృత్వాన్ని నిలుపాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, యోబు విలాపానికి తగిన గంభీరమైన కానీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ఈ వచనం 20వ వచనంలో మొదలైన ప్రశ్నకు కొనసాగింపు కాబట్టి, మూలంలోని ప్రశ్నార్థక ఖండరూపాన్ని అలాగే ఉంచింది.
