  yaml_path: translation/ot/job/003/009.yaml
  text: May the stars of its twilight be dark[a]; may it wait for light, but there be none[b], and may it not see the eyelids of dawn.
translation:
  language: te
  text: దాని సంధ్యా నక్షత్రాలు చీకటిగా ఉండాలి[a]; అది వెలుగు కోసం ఎదురుచూడాలి, కాని వెలుగు ఉండకూడదు; అది ఉదయపు కనురెప్పలను చూడకూడదు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దాని సాయంసంధ్యా నక్షత్రాలు.’ హీబ్రూ పదం సంధ్యను, ముఖ్యంగా సాయంసంధ్యను సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘ఉదయపు కనురెప్పలు.’ ఇది తెల్లవారుజామున వెలుగు మొదట కనిపించడాన్ని వర్ణించే హీబ్రూ కవితా రూపకం.
    reason: cultural_note
lexical_decisions:
- source_word: יֶחְשְׁכוּ
  choice: చీకటిమయం కావాలి
  rationale: శాపరూప సందర్భంలోని కోరికను తెలుగులో సహజంగా వ్యక్తపరుస్తూ, Qal క్రియలోని ‘చీకటిగా ఉండాలి/కావాలి’ అనే భావాన్ని నిలుపుతుంది.
- source_word: כּוֹכְבֵי נִשְׁפּוֹ
  choice: దాని సంధ్యా నక్షత్రాలు
  rationale: Construct సంబంధాన్నీ, మూడవ పురుష ఏకవచన ప్రత్యయాన్నీ నిలుపుతుంది. נֶשֶׁף ఇక్కడ సంధ్యను, ముఖ్యంగా సాయంసంధ్యను సూచించగలదు.
- source_word: יְקַו לְאוֹר
  choice: అది వెలుగు కోసం ఎదురుచూసినా
  rationale: קוה లోని ఆశతో వేచియుండే భావాన్ని ‘ఎదురుచూడు’ సహజంగా అందిస్తుంది; తరువాతి నిరాశను చూపడానికి concessive రూపం తెలుగు వాక్యప్రవాహానికి అనుకూలం.
- source_word: וָאַיִן
  choice: వెలుగు లేకపోవాలి
  rationale: శాపంలోని ఆకాంక్షను కొనసాగిస్తూ, ఎదురుచూసిన వెలుగు లభించకూడదనే భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: וְאַל יִרְאֶה
  choice: అది ... చూడకూడదు
  rationale: אַל + imperfect లోని నిషేధాత్మక కోరికను ఆధునిక తెలుగులో సహజమైన ‘చూడకూడదు’తో వ్యక్తపరుస్తుంది.
- source_word: בְּעַפְעַפֵּי שָׁחַר
  choice: ఉదయపు కనురెప్పలను
  rationale: ‘ఉదయపు కనురెప్పలు’ అనే హీబ్రూ కవితా రూపకాన్ని సమతలపరచకుండా యథాశక్తి నిలుపుతుంది.
