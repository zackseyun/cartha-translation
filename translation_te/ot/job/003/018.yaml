  yaml_path: translation/ot/job/003/018.yaml
  text: There the prisoners are at ease together[a]; they do not hear the voice of the taskmaster.
translation:
  language: te
  text: అక్కడ బందీలందరూ కలిసి నిశ్చింతగా ఉంటారు; వారిని పని చేయమని అదిలించేవాని స్వరం వారికి వినిపించదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పీడించేవాని” లేదా “బకాయి వసూలు చేసేవాని.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחַד
  choice: అందరూ కలిసి
  rationale: బందీలందరూ ఒకే ప్రశాంత స్థితిని పంచుకుంటున్నారనే సమష్టి భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: אֲסִירִים
  choice: బందీలు
  rationale: నిర్బంధంలో ఉన్నవారిని సూచించే స్పష్టమైన, సాధారణ తెలుగు పదం; ‘ఖైదీలు’ కంటే ప్రాచీన బలవంతపు నిర్బంధ సందర్భానికీ విస్తృతంగా సరిపోతుంది.
- source_word: שַׁאֲנָנוּ
  choice: ప్రశాంతంగా ఉంటారు
  rationale: అంతరాయం, ఒత్తిడి లేకుండా నెమ్మదిగా ఉండే స్థితిని వ్యక్తం చేస్తుంది; సంపూర్ణ విశ్రాంతి అనే భావాన్ని అతిగా నిర్దిష్టం చేయదు.
- source_word: לֹא שָׁמְעוּ
  choice: వారికి వినిపించదు
  rationale: కావ్య సందర్భంలోని కొనసాగుతున్న స్థితిని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; మరణించినవారి ప్రస్తుత పరిస్థితిని సూచించే సందర్భార్థాన్ని కాపాడుతుంది.
- source_word: קוֹל
  choice: గొంతు
  rationale: ఆజ్ఞాపించే లేదా ఒత్తిడి చేసే వ్యక్తి పలుకును సూచించడానికి సహజమైన తెలుగు సమానార్థకం.
- source_word: נֹגֵשׂ
  choice: పనికి పురికొల్పేవాడు
  rationale: ఈ పదంలోని పని చేయమని ఒత్తిడి చేసే, శ్రమను రాబట్టే భావాన్ని కాపాడుతుంది; ‘బానిసలను అదిలించేవాడు’ అని పరిధిని అనవసరంగా కుదించదు.
