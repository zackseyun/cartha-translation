translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కావ్య గద్యం. ‘అక్కడ’ను సందర్భసంబంధ స్థల సూచనగా ఉంచి, హీబ్రూ పదక్రమంలోని సమష్టి భావాన్ని ‘అందరూ కలిసి’ ద్వారా స్పష్టం చేశాం. పాదటిప్పణి గుర్తు ప్రధాన పాఠ్యంలో సంబంధిత పదబంధం అనంతరం ఉంచబడింది.
