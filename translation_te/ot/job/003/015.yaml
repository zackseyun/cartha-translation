    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా ‘తమ ఇళ్లు.’ సందర్భానుసారంగా ‘తమ రాజభవనాలు’ అని భావించవచ్చు, కానీ అది మూలపాఠం కంటే మరింత నిర్దిష్టమైన వ్యాఖ్యానం.
