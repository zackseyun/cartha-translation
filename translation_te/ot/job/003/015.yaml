lexical_decisions:
- source_word: א֣וֹ
  choice: లేదా
  rationale: యోబు తాను పొందలేకపోయిన విశ్రాంతి గురించి వరుసగా ఊహిస్తున్న ప్రత్యామ్నాయాలను కలుపుతుంది; సరళమైన ‘లేదా’ కవితా క్రమాన్ని నిలుపుతుంది.
- source_word: עִם
  choice: తో
  rationale: మరణించిన ఉన్నతాధికారులతో కలిసి ఉండడాన్ని సూచించే సహవాసార్థక విభక్తిగా సహజంగా అనువదించబడింది.
- source_word: שָׂרִים
  choice: అధిపతులు
  rationale: ఈ పదం ఉన్నత స్థాయి నాయకులు, పాలకులు లేదా ప్రభువులను సూచిస్తుంది. ‘అధిపతులు’ వంశపారంపర్య రాజకుమారులనే పరిమితార్థం కలిగించకుండా, గంభీరమైన కవితా శైలిని నిలుపుతుంది.
- source_word: זָהָב לָהֶם
  choice: బంగారం కలిగి
  rationale: హీబ్రూ స్వామ్యాన్ని తెలిపే ప్రయోగాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: הַמְמַלְאִים
  choice: నింపుకున్న
  rationale: కర్తలు తమ సంపదతో తమ ఇళ్లను నింపిన భావాన్ని తెలుగులో సహజమైన సంబంధార్థక నిర్మాణంలో తెలియజేస్తుంది.
- source_word: בָּתֵּיהֶם
  choice: తమ ఇళ్లను
  rationale: మూలపదం సాధారణంగా ‘ఇళ్లు’ అని అర్థం; సందర్భాన్ని బట్టి ‘రాజభవనాలు’ అనవచ్చుగాని, అది మూలం కంటే నిర్దిష్టమైన అర్థం.
- source_word: כָּסֶף
  choice: వెండి
  rationale: సంపదను చిత్రించే ఈ కవితా సందర్భంలో నాణేలు లేదా డబ్బు అనే విస్తృతార్థం కంటే విలువైన లోహమైన వెండినే సూచించడం సముచితం.
