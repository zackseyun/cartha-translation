  text: because it did not shut the doors of my womb[b][a], nor hide trouble from my eyes.
translation:
  language: te
  text: ఎందుకంటే, అది నా తల్లి గర్భ ద్వారాలను[a] మూయలేదు; నా కళ్లకు కనిపించకుండా బాధను[b] దాచలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూలభాషలో ‘నా కడుపు’ లేదా ‘నా గర్భం.’ ఇక్కడ యోబు తన పుట్టుక గురించి మాట్లాడుతున్నందున, భావం ‘నా తల్లి గర్భం.’
    reason: lexical_alternative
  - marker: b
    text: ‘బాధ’ అనే పదాన్ని ‘శ్రమ,’ ‘దుఃఖం,’ లేదా ‘కష్టం’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి శాపానికి కారణాన్ని పరిచయం చేసే హేత్వర్థాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: סָגַר
  choice: మూయలేదు
  rationale: ‘తలుపులు/ద్వారాలు’ అనే స్పష్టమైన రూపకంతో సహజంగా కలిసే ‘మూయు’ అనే అర్థాన్ని నిలుపుతుంది.
- source_word: דַּלְתֵי
  choice: ద్వారాలను
  rationale: జననాన్ని అడ్డుకునే గర్భద్వారాల రూపకాన్ని గౌరవప్రదంగా, స్పష్టంగా నిలుపుతుంది.
- source_word: בִטְנִי
  choice: నా తల్లి గర్భ
  rationale: పదశః ‘నా కడుపు/గర్భం’ అయినప్పటికీ, యోబు పుట్టుక సందర్భంలో భావం అతన్ని మోసిన తల్లి గర్భం; తెలుగులో అపార్థం రాకుండా ‘నా తల్లి గర్భం’ అని వ్యక్తీకరించబడింది.
- source_word: וַיַּסְתֵּר
  choice: కనబడకుండా చేయలేదు
  rationale: ముందున్న నిషేధం రెండో క్రియకూ వర్తిస్తుందని చూపుతూ, దాచడం అనే భావాన్ని కళ్లతో సంబంధం కలిగిన సహజ తెలుగు రూపంలో అందిస్తుంది.
- source_word: עָמָל
  choice: శ్రమను
  rationale: ఈ పదంలోని కష్టం, బాధ, దుఃఖం అనే విస్తృత భావపరిధిని పూర్తిగా ఒకే పదం పట్టదు; ‘శ్రమ’ మూలపదానికి దగ్గరగా ఉండి సందర్భంలోని బాధను సూచిస్తుంది.
- source_word: מֵעֵינָי
  choice: నా కళ్లకు
  rationale: హీబ్రూ ‘నా కళ్ల నుండి’ అనే దృశ్యరూపాన్ని తెలుగులో సహజంగా వ్యక్తం చేసి, చూడటం మరియు అనుభవించడం రెండింటినీ సూచిస్తుంది.
