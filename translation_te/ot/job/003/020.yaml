  to: 'బాధలో ఉన్నవారికి వెలుగు[b] ఎందుకు ఇవ్వబడుతుంది?

    మనసులో చేదుతో ఉన్నవారికి జీవితం ఎందుకు ఇవ్వబడుతుంది?[a]'
