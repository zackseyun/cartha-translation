  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: לָ֤/מָּה יִתֵּ֣ן לְ/עָמֵ֣ל א֑וֹר וְ֝/חַיִּ֗ים לְ/מָ֣רֵי נָֽפֶשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/003/020.yaml
  text: Why is light given to the troubled[b][a], and life to the bitter in soul?
translation:
  language: te
  text: 'బాధలో ఉన్నవారికి వెలుగు[b] ఎందుకు ఇవ్వబడుతుంది?

    మనసులో చేదుతో ఉన్నవారికి జీవితం ఎందుకు ఇవ్వబడుతుంది?[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “బాధలో ఉన్నవారికి ఆయన వెలుగు ఎందుకు ఇస్తాడు? మనసులో చేదుతో ఉన్నవారికి జీవితం ఎందుకు ఇస్తాడు?” హీబ్రూలో దాత స్పష్టంగా పేర్కొనబడలేదు; సందర్భంలో దేవుడు సూచితుడై ఉండవచ్చు.
    reason: alternative_reading
  - marker: b
    text: “వెలుగు” అనేది జీవించడం కొనసాగడాన్ని సూచించే కవితాత్మక రూపకం; మొదటి పాదంలో హీబ్రూ ఈ రూపకాన్నే ఉంచుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָּה
  choice: ఎందుకు
  rationale: యోబు విలాపంలోని సూటైన ప్రశ్నార్థక బలాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: יִתֵּן
  choice: ఇవ్వబడుతుంది
  rationale: హీబ్రూలో క్రియకు స్పష్టంగా పేర్కొన్న కర్త లేడు. కర్మణి ప్రయోగం దాతను పేరుపెట్టకుండా మూలంలోని అంతర్లీనతను కాపాడుతుంది.
- source_word: לְעָמֵל
  choice: బాధలో ఉన్నవారికి
  rationale: ఈ సందర్భంలో עָמֵל సాధారణ శ్రమకన్నా దుఃఖం, కష్టం, దురవస్థలో ఉన్న వ్యక్తిని సూచిస్తుంది; ఈ పదబంధం ఆ విస్తృత భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: אוֹר
  choice: వెలుగు
  rationale: ఇక్కడ వెలుగు కొనసాగుతున్న ఉనికికి లేదా జీవనానికి కవితాత్మక ప్రతిరూపమైనా, హీబ్రూ రూపకాన్ని యథాతథంగా నిలుపుతుంది.
- source_word: וְחַיִּים
  choice: జీవం
  rationale: హీబ్రూలో రూపపరంగా బహువచనమైనా, ఇది సాధారణంగా జీవితం లేదా జీవాన్ని సూచిస్తుంది; తెలుగులో ‘జీవం’ ఈ సందర్భంలో సహజంగా సరిపోతుంది.
- source_word: לְמָרֵי נָפֶשׁ
  choice: మనసులో చేదు నిండినవారికి
  rationale: ‘ప్రాణంలో చేదైనవారు’ అనే హీబ్రూ నుడికారంలోని తీవ్రమైన అంతరంగ వేదనను, పదశః కఠినత లేకుండా ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: יִתֵּן క్రియలో అంతర్లీనంగా ఉన్న కర్త
  choice: ‘ఇవ్వబడుతుంది’ అనే కర్మణి రూపంతో దాతను పేర్కొనకుండా ఉంచడం.
  alternative: ‘ఆయన ఎందుకు ఇస్తాడు?’ అని అంతర్లీన దైవిక కర్తను క్రియాశీల రూపంలో చూపడం; లేదా ‘దేవుడు ఎందుకు ఇస్తాడు?’ అని స్పష్టంగా చేర్చడం.
  rationale: సందర్భంలో దేవుడు దాతగా సూచితుడై ఉండవచ్చు; అయితే ఈ వాక్యంలో హీబ్రూ ఆయనను పేరుపెట్టదు. కర్తను అంతర్లీనంగానే ఉంచడం యోబు ప్రశ్నలోని భావజాల, దైవశాస్త్ర ఉద్విగ్నతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన కవితాత్మక విలాప స్వరం. హీబ్రూ సమాంతర నిర్మాణం తెలుగులో స్పష్టంగా వినిపించేందుకు ప్రశ్నను రెండు పాదాలుగా అమర్చాం. ‘వెలుగు’ రూపకాన్ని నిలిపి, పేర్కొనని దాతను కర్మణి రూపం ద్వారా అంతర్లీనంగా ఉంచాం.
