  terminology: No doctrinal expansion is introduced. ‘పడుకొని,’ ‘నిద్రపోయేవాణ్ణి,’ and ‘విశ్రాంతి’ retain the source’s ordinary sleep-and-rest language. The footnotes give genuine lexical alternatives without resolving the death imagery into a doctrinal statement.
