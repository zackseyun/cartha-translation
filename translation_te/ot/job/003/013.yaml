  text: For now I would have lain down and been quiet[b][a]; I would have slept—then I would have been at rest.
translation:
  language: te
  text: ఎందుకంటే, ఇప్పటికి నేను పడుకొని నిశ్చలంగా ఉండేవాణ్ణి[a]; నేను నిద్రపోయేవాణ్ణి—అప్పుడు నాకు విశ్రాంతి కలిగేది[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేక ‘ప్రశాంతంగా ఉండేవాణ్ణి’ లేదా ‘కలతలేకుండా ఉండేవాణ్ణి.’
    reason: lexical_alternative
  - marker: b
    text: లేక ‘అప్పుడు నేను విశ్రాంతిగా ఉండేవాణ్ణి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి వచనాల్లో యోబు వ్యక్తం చేసిన కోరికకు కారణాన్ని లేదా వివరణను పరిచయం చేస్తుంది.
- source_word: עַתָּה
  choice: ఇప్పటికి
  rationale: జన్మించగానే చనిపోయి ఉంటే ప్రస్తుతానికి తన పరిస్థితి ఎలా ఉండేదో తెలిపే ప్రతికల్పన సందర్భంలో, ‘ఇప్పటికి’ సహజమైన తెలుగు రూపం.
- source_word: שָׁכַבְתִּי
  choice: నేను పడుకొని ... ఉండేవాణ్ణి
  rationale: శరీరం పడుకోవడం అనే మూల చిత్రాన్ని నిలుపుతూ, సందర్భంలోని గత ప్రతికల్పన భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וְאֶשְׁקֹט
  choice: ప్రశాంతంగా ఉండేవాణ్ణి
  rationale: שׁקט సూచించే కలతలేని నెమ్మదిని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; ‘నిశ్చలంగా’ అనే సమీప ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచింది.
- source_word: יָשַׁנְתִּי
  choice: నేను నిద్రపోయేవాణ్ణి
  rationale: మరణానికి రూపకంగా వినిపించినా, మూలంలోని సాధారణ ‘నిద్రించు’ క్రియనే ఉంచి రూపకాన్ని వివరణతో కుదించలేదు.
- source_word: אָז
  choice: అప్పుడు
  rationale: పడుకోవడం, నిద్రపోవడం, విశ్రాంతి పొందడం అనే కవితాత్మక క్రమంలోని తదుపరి ఫలితాన్ని సూచిస్తుంది.
- source_word: יָנוּחַ לִי
  choice: విశ్రాంతిగా ఉండేవాణ్ణి
  rationale: ‘నాకు విశ్రాంతి ఉండేది’ అనే హెబ్రీ నిర్మాణ భావాన్ని సహజమైన తెలుగులో స్థితిగా వ్యక్తం చేస్తుంది; మరింత అక్షరార్థ రూపాన్ని పాదసూచికలో తెలిపింది.
theological_decisions:
- issue: మరణాన్ని పడుకోవడం, నిద్రపోవడం, విశ్రాంతిగా ఉండడం అనే చిత్రాలతో చెప్పడం
  choice: పడుకోవడం, నిద్రపోవడం, విశ్రాంతిగా ఉండడం అనే మూలభాష చిత్రాలను యథాతథంగా నిలుపడం
  alternative: ‘చనిపోయి విశ్రాంతి పొందేవాణ్ణి’ అని రూపకాన్ని ప్రత్యక్షంగా వివరించడం
  rationale: ఈ వచనం మరణంలో కోరుకున్న నెమ్మదిని కవితాత్మక సాధారణ క్రియలతో వ్యక్తం చేస్తుంది. వాటిని అలాగే ఉంచడం వల్ల మృతుల స్థితి గురించి పాఠ్యంలో లేని నిర్దిష్ట సిద్ధాంతాన్ని చేర్చకుండా దాని కవితాత్మక, వేదాంతపరమైన ఉద్వేగం నిలుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కవితాత్మక శైలి. ‘ఇప్పటికి ... ఉండేవాణ్ణి’ రూపం సందర్భంలోని ప్రతికల్పన భావాన్ని సహజంగా తెలియజేస్తుంది; పునరుక్తి మూలంలోని సమాంతర నిర్మాణాన్ని నిలుపుతుంది.
