  variant: modern standard Telugu
source:
  edition: WLC
  text: יִגְאָלֻ֡/הוּ חֹ֣שֶׁךְ וְ֭/צַלְמָוֶת תִּשְׁכָּן עָלָ֣י/ו עֲנָנָ֑ה יְ֝בַעֲתֻ֗/הוּ כִּֽמְרִ֥ירֵי יֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/003/005.yaml
  text: May darkness and deep shadow reclaim it[a]; may a cloud dwell over it[b]; may the blacknesses of the day terrify it.
translation:
  language: te
  text: 'చీకటీ, గాఢాంధకారమూ[a] దాన్ని మళ్లీ స్వాధీనం చేసుకోవాలి;

    మేఘం దానిమీద స్థిరపడాలి;

    పగటి అంధకారాలు[b] దాన్ని భీతిగొల్పాలి.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “మృత్యుచ్ఛాయ,” లేదా “గాఢమైన చీకటి.”
    reason: lexical_alternative
  - marker: b
    text: “పగటి అంధకారాలు” అనే హెబ్రీ పదబంధం అర్థం క్లిష్టమైనది. దీనిని “పగటి నల్లదనం,” “పగటి గ్రహణాలు,” లేదా—అంతగా సంభావ్యం కాని అర్థంలో—“పగటి చేదులు” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִגְאָלֻהוּ
  choice: దాన్ని తిరిగి తమదిగా చేసుకోవాలి
  rationale: גאל అనే క్రియలో తిరిగి హక్కుగా పొందడం లేదా స్వాధీనం చేసుకోవడం అనే భావం ఉంది. ఈ శాపసందర్భంలో సానుకూల విమోచనార్థం కలగకుండా, చీకటి ఆ రోజును తిరిగి తన అధీనంలోకి తీసుకోవాలనే చిత్రాన్ని ఈ పదబంధం సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: חֹשֶׁךְ
  choice: చీకటి
  rationale: ఇక్కడ యోబు తన జన్మదినం వెలుగును కోల్పోవాలని కోరుతున్న సందర్భానికి సరిపోయే సాధారణ, స్పష్టమైన పదం.
- source_word: צַלְמָוֶת
  choice: గాఢాంధకారం
  rationale: ఈ పదాన్ని సంప్రదాయంగా ‘మృత్యుచ్ఛాయ’ అని, విస్తృతంగా ‘గాఢమైన చీకటి’ అని అర్థం చేసుకోవచ్చు. ప్రధాన పాఠంలో మరణభావాన్ని తప్పనిసరిగా చేర్చకుండా తీవ్రమైన చీకటి చిత్రాన్ని నిలుపుతుంది; ప్రత్యామ్నాయం పాదసూచికలో ఉంది.
- source_word: תִּשְׁכָּן עָלָיו
  choice: దానిమీద నివసించాలి
  rationale: שׁכן యొక్క ‘నివసించు, స్థిరపడు’ అనే మౌలిక భావాన్ని నిలుపుతూ, మేఘం ఆ రోజుమీద ఉండిపోయే కవితాత్మక చిత్రాన్ని ప్రతిబింబిస్తుంది.
- source_word: עֲנָנָה
  choice: మేఘం
  rationale: ఏకవచనంలోని స్పష్టమైన వాతావరణ చిత్రాన్ని నేరుగా తెలుగులో అందిస్తుంది.
- source_word: יְבַעֲתֻהוּ
  choice: దాన్ని భయభ్రాంతికి గురిచేయాలి
  rationale: בעת పియేల్ రూపంలోని తీవ్రమైన భయాన్ని కలిగించడం అనే భావాన్ని ‘భయభ్రాంతికి గురిచేయాలి’ బలంగా వ్యక్తం చేస్తుంది.
- source_word: כִּמְרִירֵי יוֹם
  choice: పగటి అంధకారాలు
  rationale: అర్థం క్లిష్టమైన ఈ పదబంధంలో సందర్భానుసారంగా చీకటి లేదా నల్లబడటాల భావాన్ని ఎంచుకుని, హెబ్రీ బహువచనాన్నీ కవితాత్మక అసాధారణతనూ నిలిపింది. ఇతర సాధ్యార్థాలు పాదసూచికలో ఇవ్వబడ్డాయి.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కవితా శైలిని ఉపయోగించాం. వరుసగా వచ్చే ఆకాంక్షాత్మక శాపవాక్యాలకు ‘చేసుకోవాలి/నివసించాలి/గురిచేయాలి’ రూపాలను ఎంచుకున్నాం. మూలంలోని క్లిష్టమైన చివరి పదబంధాన్ని సరళీకరించకుండా, పాదసూచికలో దాని అనిశ్చితిని భద్రపరిచాం.
