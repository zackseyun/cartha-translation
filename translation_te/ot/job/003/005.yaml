  rationale: 'The revision makes two limited idiomatic improvements: a cloud ‘settles’ rather than ‘resides,’ and the final jussive uses a concise Telugu verb for terror. It otherwise preserves the draft’s source-sensitive lexical choices, poetic structure, ambiguity, and both footnote anchors.'
