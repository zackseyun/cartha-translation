  text: לֹ֤א שָׁלַ֨וְתִּי וְ/לֹ֖א שָׁקַ֥טְתִּי וְֽ/לֹא נָ֗חְתִּי וַ/יָּ֥בֹא רֹֽגֶז׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/job/003/026.yaml
  text: I was not at ease[a], and I was not quiet; I was not at rest[b], and turmoil came.
translation:
  language: te
  text: నేను నిశ్చింతగా ఉండలేదు[a], ప్రశాంతంగా ఉండలేదు; విశ్రాంతి పొందలేదు; కలత వచ్చింది.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నేను ప్రశాంతంగా ఉండలేదు, నిశ్శబ్దంగా ఉండలేదు, విశ్రమించలేదు.” యోబుకు ఏమాత్రం ఉపశమనం లేదనే భావాన్ని బలపరచడానికి హీబ్రూలో దగ్గరి అర్థాలున్న మూడు క్రియలు వరుసగా వాడబడ్డాయి.
    reason: lexical_alternative
  - marker: b
    text: “కలత” అనే పదానికి అశాంతి, ఆందోళన లేదా కష్టం అనే అర్థాలు కూడా ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלַוְתִּי
  choice: నేను నెమ్మదిగా లేను
  rationale: శాంతి, నిశ్చింత, కలతలేని స్థితి అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; బాహ్య భద్రత అనే అర్థానికి అతిగా పరిమితం చేయదు.
- source_word: שָׁקַטְתִּי
  choice: ప్రశాంతంగా లేను
  rationale: అంతరాయం లేదా కలత లేని నిశ్చల స్థితిని సూచిస్తుంది; చుట్టుపక్కల సమాంతర పదాలనుంచి కొంత భేదాన్ని నిలుపుతుంది.
- source_word: נָחְתִּי
  choice: విశ్రాంతిగా లేను
  rationale: విశ్రమించడం లేదా స్థిరపడడం అనే అర్థాన్ని అందిస్తూ మూడు వరుస స్థితివాచక క్రియల ఉద్ధృతిని నిలుపుతుంది.
- source_word: רֹגֶז
  choice: కలత
  rationale: అశాంతి, ఆందోళన, కుదుపు అనే విస్తృత భావాలను కలిగి ఉంది; దీనిని కేవలం కోపంగా లేదా సాధారణ కష్టంగా సంకుచితం చేయదు.
- source_word: וַיָּבֹא
  choice: వచ్చింది
  rationale: కలత రాకను సూటిగా తెలియజేస్తుంది; మూలంలో స్పష్టంగా లేని ‘నామీదికి’ వంటి పదాన్ని జోడించదు.
- source_word: לֹא ... וְלֹא ... וְלֹא
  choice: లేను ... లేను; ... లేను
  rationale: మూడుసార్లు వచ్చే నిరాకరణను పునరావృతం చేసి హీబ్రూ లయనూ యోబు విలాపంలోని ఉద్ధృతినీ నిలుపుతుంది.
