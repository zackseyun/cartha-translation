translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గంభీరమైన విలాప శైలి. మూడు సమాంతర నిరాకరణలను విడివిడిగా ఉంచి మూలంలోని లయను కాపాడాం. ప్రతి పాదంలో ‘నేను’ పునరావృతం చేయకుండా, తెలుగులో సహజంగా వినిపించేలా క్రియారూపాల ద్వారా కర్తను కొనసాగించాం.
