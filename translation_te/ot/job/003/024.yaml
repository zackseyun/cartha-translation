translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సహజంగా అర్థమయ్యేలా గౌరవప్రదమైన కవితాత్మక శైలి వాడబడింది. ‘భోజనం చేయకముందే’ అనే సహజీకరణకు మూలంలోని ‘రొట్టె’ రూపం పాదసూచికలో నిలుపబడింది; ‘మూలుగులు’ అనే ప్రధాన పాఠంతో పాటు שׁאג లోని గర్జనాత్మక తీవ్రతను పాదసూచిక వివరిస్తుంది.
