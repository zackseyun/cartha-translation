source:
  edition: WLC
  text: כִּֽי לִ/פְנֵ֣י לַ֭חְמִ/י אַנְחָתִ֣/י תָבֹ֑א וַֽ/יִּתְּכ֥וּ כַ֝/מַּ֗יִם שַׁאֲגֹתָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/003/024.yaml
  text: For my sighing comes before my bread[b][a], and my groanings pour out like water.
translation:
  language: te
  text: ఎందుకంటే, నేను భోజనం చేయకముందే[a] నా నిట్టూర్పు వస్తోంది; నా మూలుగులు[b] నీళ్లలా పారుతున్నాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా ‘నా రొట్టెకు ముందు’; ఇక్కడ ‘రొట్టె’ అనేది విస్తృతంగా ఆహారం లేదా భోజనాన్ని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘నా గర్జనలు’; హీబ్రూ పదం జంతువు గర్జించినట్లుండే బిగ్గరమైన అరుపును కూడా సూచించి, యోబు వేదన తీవ్రతను తెలియజేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ఈ పదం ముందున్న విలాపానికి యోబు ప్రస్తుత స్థితిని కారణంగా లేదా వివరణగా జతచేస్తోంది; ఆధునిక తెలుగులో ‘ఎందుకంటే’ ఆ సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: לִפְנֵי לַחְמִי
  choice: నేను భోజనం చేయకముందే
  rationale: అక్షరార్థంగా ‘నా రొట్టెకు ముందు.’ సందర్భంలో לֶחֶם సాధారణంగా ఆహారాన్ని లేదా భోజనాన్ని సూచించగలదు. తెలుగులో సహజమైన కాలసంబంధ భావాన్ని ఇవ్వడానికి ‘భోజనం చేయకముందే’ అని అనువదించబడింది; అక్షరార్థ రూపం పాదసూచికలో ఉంచబడింది.
- source_word: אַנְחָתִי
  choice: నా నిట్టూర్పు
  rationale: వేదనవల్ల కలిగే నిట్టూర్పు లేదా మూలుగును సూచిస్తుంది. తరువాతి బలమైన బహువచన పదంతో తేడాను నిలుపుతూ ‘నిట్టూర్పు’ ఎంచుకోబడింది.
- source_word: תָבֹא
  choice: వస్తోంది
  rationale: בוא యొక్క సాధారణ అర్థం ‘రావడం.’ యోబు అనుభవిస్తున్న కొనసాగుతున్న స్థితిని ఆధునిక తెలుగు వర్తమాన రూపం సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וַיִּתְּכוּ
  choice: పారుతున్నాయి
  rationale: ఈ క్రియ పోయబడటం, ధారగా ప్రవహించడం అనే చిత్రాన్ని ఇస్తుంది. ‘నీళ్లలా’ అనే ఉపమానంతో ‘పారుతున్నాయి’ సహజంగా, స్పష్టంగా సరిపోతుంది.
- source_word: כַמַּיִם
  choice: నీళ్లలా
  rationale: మూలంలోని ప్రత్యక్ష ఉపమానాన్ని సాధారణ ఆధునిక తెలుగు రూపంలో నిలుపుతుంది.
- source_word: שַׁאֲגֹתָי
  choice: నా మూలుగులు
  rationale: ఈ పదం గర్జనలను లేదా బిగ్గరగా వెలువడే వేదనారావాలను సూచించగలదు. మానవ వేదన సందర్భంలో ‘మూలుగులు’ సహజంగా ఉంటుంది; గర్జన వంటి తీవ్రతను పాదసూచిక కాపాడుతుంది.
