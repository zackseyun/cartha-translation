  terminology: ‘నిట్టూర్పు’ אַנְחָתִיకి, ‘మూలుగులు’ שַׁאֲגֹתָיకి సందర్భానుకూలమైన ఎంపికలు. రెండవ పదంలోని మరింత బిగ్గర/గర్జనాత్మక భావాన్ని పాదసూచిక సరియైన రీతిలో కాపాడుతోంది. ‘రొట్టె’కు విస్తృత ‘ఆహారం లేదా భోజనం’ అర్థాన్ని తెలిపే పాదసూచిక కూడా తగినది.
