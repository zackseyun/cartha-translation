translation:
  language: te
  text: 'మరణం కోసం ఎదురుచూసేవారు, కానీ అది రాదు;

    దాచిన నిధుల కోసం తవ్వినదానికంటే ఎక్కువగా దానికోసం తవ్వేవారు,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַמְחַכִּים
  choice: ఎదురుచూసినా
  rationale: חכה అనే క్రియాపదం నిరీక్షణతో ఎదురుచూడడాన్ని సూచిస్తుంది. సందర్భంలోని తీవ్ర కోరికను అతిశయింపకుండా, మూల అర్థాన్ని సహజమైన ఆధునిక తెలుగులో ఇస్తుంది.
- source_word: לַמָּוֶת
  choice: మరణం కోసం
  rationale: לְ ఉపసర్గతో కూడిన מָוֶת, ఎదురుచూడటానికి లక్ష్యంగా ‘మరణం’ను నేరుగా సూచిస్తుంది.
- source_word: וְאֵינֶנּוּ
  choice: అది రాకపోయేవారు
  rationale: అక్షరార్థం ‘అది లేదు’; పుంలింగ ఏకవచన ప్రత్యయం మరణాన్ని సూచిస్తుంది. ఈ సందర్భంలో మరణం వారికి సంభవించకపోవడం లేదా చేరకపోవడం భావం కావడంతో సహజ తెలుగులో ‘అది రాకపోయేవారు’ అని ఇచ్చాం; అక్షరార్థ ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: וַיַּחְפְּרֻהוּ
  choice: దానికోసం తవ్వేవారు
  rationale: חפר యొక్క స్పష్టమైన ‘తవ్వు’ రూపకాన్ని నిలిపి, దాచిన నిధిని వెదకడానికి తవ్వినట్లు మరణాన్ని వెదకడమనే బలమైన చిత్రణను కాపాడుతుంది.
- source_word: מִמַּטְמוֹנִים
  choice: దాచిన నిధుల కోసం తవ్వేవారికంటే ఎక్కువగా
  rationale: מַטְמוֹן దాచిన లేదా నిల్వచేసిన నిధిని సూచిస్తుంది; מן ఇక్కడ పోలికను తెలియజేస్తుంది. తెలుగులో పోలిక స్పష్టంగా ఉండేందుకు తవ్వే క్రియను అనుబంధంగా పునరుక్తి చేశాం.
