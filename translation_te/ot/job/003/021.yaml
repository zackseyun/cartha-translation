translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కవితా ధోరణిని ఉంచాం. హీబ్రూ వాక్యంలోని సంబంధార్థక కొనసాగింపును తెలుగులో ‘వారు’ రూపంతో సహజంగా వ్యక్తం చేశాం; ‘తవ్వు’ అనే మూల రూపకాన్ని అలాగే నిలిపాం.
