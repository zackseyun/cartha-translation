translation:
  language: te
  text: దినాలను శపించేవారు దాన్ని శపించుగాక, లివ్యాతానును రేపడానికి సిద్ధంగా ఉన్నవారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֹרְרֵי יוֹם
  choice: దినాలను శపించేవారు
  rationale: יוֹם రూపం ఏకవచనమైనా, ‘దినాలను శపించేవారు’ అనే వృత్తి/వర్గ సూచనగా గ్రహించడం సందర్భానుకూలం; లక్ష్యమైన ప్రత్యేక దినాన్ని సూచించే ‘దాన్ని’తో భేదాన్ని నిలుపుతుంది.
- source_word: הָעֲתִידִים
  choice: గలవారు
  rationale: ఇక్కడ ‘సిద్ధంగా ఉన్నవారు’ లేదా ‘సామర్థ్యమున్నవారు’ అనే భావం సాధ్యం. లివ్యాతానును లేపగల మంత్రగాళ్లను సూచించే సందర్భంలో సామర్థ్య భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: עֹרֵר
  choice: లేప
  rationale: Polel infinitive భావాన్ని ‘మేల్కొలుపు/రేపు’ అనే అర్థంలో సంక్షిప్తంగా అందిస్తుంది.
- source_word: לִוְיָתָן
  choice: లివ్యాతాను
  rationale: నిర్దిష్ట పౌరాణిక సముద్ర జీవి పేరును సాధారణ ‘మొసలి’ వంటి వివరణాత్మక పదంతో భర్తీ చేయకుండా లిప్యంతరీకరించింది.
theological_decisions:
- issue: లివ్యాతాను యొక్క స్వరూపం
  choice: పేరును ‘లివ్యాతాను’గా యథాతథంగా ఉంచడం
  alternative: మొసలి లేదా సముద్ర రాక్షసుడు అని అనువదించడం
  rationale: వచనం ఆ జీవి స్వరూపాన్ని పూర్తిగా నిర్వచించదు; పేరును నిలుపడం మూలంలోని కవితాత్మక, పౌరాణిక అస్పష్టతను కాపాడుతుంది.
- issue: הָעֲתִידִים యొక్క భావం
  choice: ‘లేపగలవారు’
  alternative: ‘లేపడానికి సిద్ధంగా ఉన్నవారు’
  rationale: రెండు భావాలూ సాధ్యమే; దినాలను శపించే నిపుణుల సామర్థ్యాన్ని సూచించే పఠనం ఇక్కడ సహజంగా సరిపోతుంది, అయితే సిద్ధత భావాన్ని పూర్తిగా నిరాకరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన శాపకావ్య స్వరం నిలుపబడింది. సమాంతర నిర్మాణాన్ని స్పష్టంచేయడానికి రెండో భాగంలో ‘దాన్ని శపించుగాక’ను పునరుక్తి చేశాం; ఇది హీబ్రూ కవితా భావంలో అంతర్భూతమైన క్రియను తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
