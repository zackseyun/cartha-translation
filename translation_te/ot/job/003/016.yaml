translation:
  language: te
  text: లేదా, మరుగున దాచబడిన గర్భస్రావమైన శిశువులా[a], వెలుగు చూడని[b] పసిబిడ్డల్లా, నేను ఉండకపోయేవాణ్ణి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మృతజన్మ పొందిన శిశువులా.’ హీబ్రూ పదం గర్భస్రావమైన శిశువును గానీ, మృతజన్మ పొందిన శిశువును గానీ సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘వెలుగు చూడడం’ అనేది భూలోక జీవితంలోకి రావడం లేదా దానిని అనుభవించడం అనే హీబ్రూ భావవ్యక్తీకరణ.
    reason: cultural_note
lexical_decisions:
- source_word: א֤וֹ
  choice: లేదా
  rationale: యోబు కోరుకున్న మరొక ప్రత్యామ్నాయ పరిస్థితిని పరిచయం చేస్తుంది; ఆధునిక తెలుగులో సహజమైన సమానార్థకం.
- source_word: כְ/נֵ֣פֶל
  choice: గర్భస్రావ శిశువులా
  rationale: נֵפֶל గర్భస్రావంలో పోయిన లేదా మృతజన్మ పొందిన శిశువును సూచించగలదు. ప్రధాన పాఠ్యంలో సహజమైన ఒక అర్థాన్ని ఇచ్చి, మరొకదాన్ని పాదటిప్పణిలో నిలిపాం.
- source_word: טָ֭מוּן
  choice: మరుగున పడిన
  rationale: ‘దాచబడిన, కనబడకుండా ఉన్న’ అనే భావాన్ని నిలుపుతుంది; దానిని ప్రత్యేకంగా సమాధి చేయబడినదిగా నిర్ణయించదు.
- source_word: לֹ֣א אֶהְיֶ֑ה
  choice: నేను ఉండేవాణ్ణి కాను
  rationale: హీబ్రూ వాక్యంలోని ‘నేను ఉండను/ఉండేవాణ్ణి కాను’ అనే అస్తిత్వార్థాన్ని సూటిగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: כְ֝/עֹלְלִ֗ים
  choice: పసిబిడ్డల్లా
  rationale: עֹלְלִים చాలా చిన్న పిల్లలను లేదా శిశువులను సూచిస్తుంది; సందర్భానికి ‘పసిబిడ్డలు’ సహజంగా సరిపోతుంది.
- source_word: לֹא רָ֥אוּ אֽוֹר
  choice: వెలుగు చూడని
  rationale: భూలోక జీవితంలో ప్రవేశించకపోవడం లేదా దానిని అనుభవించకపోవడం అనే హీబ్రూ రూపకాన్ని యథాతథంగా, తెలుగులో అర్థమయ్యే విధంగా నిలుపుతుంది.
