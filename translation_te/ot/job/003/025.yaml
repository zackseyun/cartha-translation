translation:
  language: te
  text: ఎందుకంటే, నేను భయపడిన భయమే నా మీదికి వచ్చింది[a]; నేను భయపడినదే నాకు సంభవించింది[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నేను భయపడినదే నా మీదికి వచ్చింది.” హెబ్రీయులో “భయం” అనే నామవాచకంతో దానికి సజాతియైన “భయపడ్డాను” అనే క్రియను కలిపి ఉద్ఘాటించారు.
    reason: lexical_alternative
  - marker: b
    text: మొదటి పాదంలోని క్రియకు “నా మీదికి వచ్చింది” లేదా “నన్ను చేరింది” అనే భావం ఉండవచ్చు; రెండో పాదం మరింత పదశః “నాకు వచ్చింది” అంటుంది. ఇలా హెబ్రీ సమాంతర వాక్యాల్లోని స్వల్ప వైవిధ్యం నిలుస్తుంది.
    reason: lexical_alternative
