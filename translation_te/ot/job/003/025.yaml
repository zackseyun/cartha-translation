- source_word: יָגֹרְתִּי
  choice: నేను జంకినదే
  rationale: భయపడటం లేదా దడపడటం అనే భావాన్ని ఇస్తూ, మొదటి పాదంలోని సజాతి పదప్రయోగాన్ని యథాతథంగా పునరావృతం చేయకుండా సమాంతరతను నిలుపుతుంది.
- source_word: יָבֹא לִי
  choice: నాకు సంభవించింది
  rationale: పదశః ‘నాకు వచ్చింది’ అనే భావాన్ని సందర్భానుకూల సహజ తెలుగులో తెలియజేస్తుంది; మొదటి పాదంలోని బలమైన ‘నా మీదికి వచ్చింది’తో స్వల్ప వైవిధ్యాన్ని ఉంచుతుంది.
