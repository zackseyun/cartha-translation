translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన, గంభీరమైన కవితా వాక్యంగా అనువదించబడింది. ‘అల్పుడు—గొప్పవాడు’, ‘దాసుడు—స్వతంత్రుడు’ అనే సమాంతర వ్యత్యాసాలు నిలుపబడ్డాయి; మూలంలో ప్రత్యక్షంగా లేని ‘సమానంగా’ చేర్చబడలేదు.
