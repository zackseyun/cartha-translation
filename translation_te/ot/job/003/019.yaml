  text: קָטֹ֣ן וְ֭/גָדוֹל שָׁ֣ם ה֑וּא וְ֝/עֶ֗בֶד חָפְשִׁ֥י מֵ/אֲדֹנָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/job/003/019.yaml
  text: The small and the great are there[a], and the servant is free from his master.
translation:
  language: te
  text: చిన్నవారూ గొప్పవారూ అక్కడ ఉన్నారు; బానిస తన యజమాని నుండి స్వేచ్ఛగా ఉన్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קָטֹן
  choice: అల్పుడు
  rationale: గָדוֹלతో వ్యతిరేక జంటగా ఇది శరీర పరిమాణం లేదా వయస్సుకన్నా తక్కువ సామాజిక స్థానం లేదా ప్రాముఖ్యత గల వ్యక్తిని సూచిస్తుంది.
- source_word: גָדוֹל
  choice: గొప్పవాడు
  rationale: קָטֹןకు వ్యతిరేకంగా ఉన్నత స్థానం లేదా ప్రాముఖ్యత గల వ్యక్తిని సూచిస్తుంది; ఈ సంక్షిప్త వ్యత్యాసాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: שָׁם
  choice: అక్కడ
  rationale: ముందరి సందర్భంలోని మరణస్థలాన్ని సూచించే స్థానవాచక భావాన్ని నేరుగా నిలుపుతుంది.
- source_word: הוּא
  choice: ఉన్నారు
  rationale: హీబ్రూలో రూపరీత్యా ఏకవచనమైనా, ముందున్న ఇద్దరు వర్గాల సమిష్టి ఉనికిని తెలియజేస్తుంది; తెలుగులో బహువచన క్రియ సహజం. మూలంలో స్పష్టంగా లేని ‘సమానంగా’ అనే భావాన్ని చేర్చలేదు.
- source_word: עֶבֶד
  choice: దాసుడు
  rationale: యజమాని ఆధీనంలోని బంధిత సేవకుణ్ణి సూచిస్తుంది. ‘యజమాని నుండి స్వతంత్రుడు’ అనే వ్యత్యాసం బంధిత స్థితిని స్పష్టం చేస్తుంది; ‘దాసుడు’ ఆధునిక గౌరవప్రద బైబిలు తెలుగులో ఆ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: חָפְשִׁי
  choice: స్వతంత్రుడు
  rationale: దాస్యానికి వ్యతిరేకమైన స్వేచ్ఛా స్థితిని తెలిపే విశేషణ భావాన్ని తెలుగులో నేరుగా వ్యక్తం చేస్తుంది.
- source_word: מֵאֲדֹנָיו
  choice: తన యజమాని నుండి
  rationale: מִן విభక్తి వేరుపడటాన్ని సూచిస్తుంది; אֲדֹנָיו ఇక్కడ మానవ యజమానిని, మూడవ పురుష ఏకవచన సంబంధాన్ని సూచిస్తుంది. తెలుగు ప్రతిబింబక ‘తన’ సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
