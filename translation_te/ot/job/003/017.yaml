  yaml_path: translation/ot/job/003/017.yaml
  text: There the wicked cease from turmoil[b][a], and there those weary in strength find rest.
translation:
  language: te
  text: అక్కడ దుష్టులు కల్లోలంలో ఉండడం మానుకుంటారు[a]; అక్కడ బలంతో అలసిపోయినవారు విశ్రాంతి పొందుతారు[b].
  philosophy: optimal-equivalence
  footnotes:
