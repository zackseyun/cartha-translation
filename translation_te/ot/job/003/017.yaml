    text: అక్షరార్థంగా, ‘బలంలో అలసినవారు’; అంటే బలం క్షీణించి అలసిపోయినవారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁם
  choice: అక్కడ
  rationale: చర్చలో ఉన్న మృతుల లోకాన్ని సూచించే స్థానవాచక క్రియావిశేషణం; కవితా సమాంతరతలో సహజంగా సరిపోతుంది.
- source_word: רְשָׁעִים
  choice: దుష్టులు
  rationale: నైతికంగా చెడ్డవారిని సూచించే విశేషణనామం; సంక్షిప్తమైన, సాధారణ తెలుగు పదం.
- source_word: חָדְלוּ
  choice: మానుకుంటారు
  rationale: חדל అనే క్రియకు ‘ఆపడం, మానడం’ అనే భావం ఉంది; సందర్భంలోని సాధారణ వర్ణనకు తెలుగు వర్తమాన రూపం అనుకూలం.
- source_word: רֹגֶז
  choice: కల్లోలం రేపడం
  rationale: ఈ నామవాచకం కలత, అశాంతి, ఉగ్ర కదలిక లేదా రగులుదలను సూచించగలదు. దుష్టులు ఇతరులను బాధించే క్రియాత్మక భావాన్ని తెలుగులో సహజంగా తెలిపేందుకు ఈ రూపం ఎంచబడింది; ఇతర సాధ్యార్థాలు పాదటిప్పణిలో నిలుపబడ్డాయి.
- source_word: וְשָׁם
  choice: అక్కడ
  rationale: రెండవ కవితా పాదంలోని పునరుక్త స్థాన సూచనను నిలుపుతుంది; తెలుగులో సంధానార్థం విరామచిహ్నం ద్వారా సహజంగా వ్యక్తమవుతుంది.
- source_word: יָנוּחוּ
  choice: విశ్రాంతి పొందుతారు
  rationale: נוח అంటే విశ్రమించడం లేదా స్థిమితపడడం; ‘విశ్రాంతి పొందుతారు’ సహజమైన తెలుగు ప్రయోగం.
- source_word: יְגִיעֵי כֹחַ
  choice: బలం ఉడిగినవారు
  rationale: అక్షరార్థంగా ‘బలంలో అలసినవారు’; పూర్తిగా శక్తి క్షీణించిన స్థితిని సహజంగా తెలియజేస్తూ כֹחַ అనే ‘బలం’ భావాన్ని నిలుపుతుంది.
