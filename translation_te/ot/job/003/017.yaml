review_pass:
  verdict: revise
  source_fidelity: The first colon’s Hebrew has the wicked as the subject of ‘cease’ and רֹגֶז as the unrest/turmoil from which they cease. The draft’s ‘కల్లోలం రేపడం’ means ‘causing turmoil,’ adding a causative sense and potentially an object/people affected that the Hebrew does not state. The second colon is substantially faithful, but ‘బలం ఉడిగినవారు’ is less precise than the idiom ‘those weary/exhausted in strength.’
  naturalness: ‘కల్లోలంలో ఉండడం మానుకుంటారు’ is natural modern Telugu and avoids making the wicked the active instigators of turmoil. ‘బలంతో అలసిపోయినవారు’ is clear, idiomatic, and preserves the image of exhausted strength. The repeated ‘అక్కడ’ retains the Hebrew poetic parallelism.
  terminology: ‘దుష్టులు,’ ‘కల్లోలం,’ and ‘విశ్రాంతి పొందుతారు’ are appropriate in register and meaning. The revised wording preserves the semantic breadth of רֹגֶז and the כוח (‘strength’) element in יְגִיעֵי כֹחַ.
  issues:
  - severity: medium
    issue: ‘కల్లోలం రేపడం’ adds a causative meaning.
    rationale: רֹגֶז denotes turmoil, agitation, rage, or unrest; the Hebrew says that the wicked cease from it, not specifically that they cease causing it.
  - severity: low
    issue: ‘బలం ఉడిగినవారు’ is a somewhat less direct rendering of ‘the weary of strength.’
    rationale: It can communicate depleted strength, but ‘బలంతో అలసిపోయినవారు’ more transparently retains both weariness and strength.
  revised_text: అక్కడ దుష్టులు కల్లోలంలో ఉండడం మానుకుంటారు[a]; అక్కడ బలంతో అలసిపోయినవారు విశ్రాంతి పొందుతారు[b].
  revised_footnotes:
