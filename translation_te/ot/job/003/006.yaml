translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కవితా శైలిని ఉపయోగించాం. శాపవాక్యాల ఆకృతిని ‘కుండుగాక’తో నిలిపి, అరుదైన హీబ్రూ క్రియలోని నిజమైన సందిగ్ధతను పాదసూచికలో భద్రపరిచాం.
