source:
  edition: WLC
  text: הַ/לַּ֥יְלָה הַ/הוּא֮ יִקָּחֵ֪/ה֫וּ אֹ֥פֶל אַל יִ֭חַדְּ בִּ/ימֵ֣י שָׁנָ֑ה בְּ/מִסְפַּ֥ר יְ֝רָחִ֗ים אַל יָבֹֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/003/006.yaml
  text: As for that night[a], let darkness seize it; let it not rejoice among the days of the year; let it not enter into the number of the months.
translation:
  language: te
  text: ఆ రాత్రినైతే[a] గాఢాంధకారం దానిని కబళించుగాక; సంవత్సరపు రోజులలో అది సంతోషించకుండుగాక; నెలల లెక్కలో అది చేరకుండుగాక.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆ రాత్రి సంవత్సరపు రోజులలో కలిసిపోకుండుగాక.” ఇక్కడి హీబ్రూ క్రియ అరుదైనది; కొందరు దీనిని సంతోషించడం అని, మరికొందరు కాలగణనలో చేర్చబడకపోవడం అని అర్థం చేసుకుంటారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַלַּיְלָה הַהוּא
  choice: ఆ రాత్రినైతే
  rationale: ముందుకు తెచ్చిన పదబంధంలోని అంశప్రాధాన్యాన్ని సహజమైన తెలుగులో ‘నైతే’ నిలుపుతుంది.
- source_word: יִקָּחֵהוּ
  choice: పట్టుకోనివ్వు
  rationale: לקח యొక్క ‘తీసుకొను/పట్టుకొను’ భావాన్ని, చీకటి రాత్రిని తన అధీనంలోకి తీసుకునే సజీవ చిత్రంతో వ్యక్తం చేస్తుంది.
- source_word: אֹפֶל
  choice: గాఢాంధకారం
  rationale: אֹפֶל సాధారణ చీకటికన్నా దట్టమైన చీకటి లేదా అంధకారాన్ని సూచిస్తుంది; ఈ ఎంపిక కవితాత్మక తీవ్రతను నిలుపుతుంది.
- source_word: אַל יִחַדְּ
  choice: అది సంతోషించకుండుగాక
  rationale: అరుదైన יחד రూపాన్ని ఇక్కడ ఆనందంగా పాలుపంచుకోవడం అనే భావంలో గ్రహించాం. ‘కలపబడకుండుగాక’ అనే కాలపట్టికనుంచి మినహాయింపు భావం కూడా సాధ్యమైనందున పాదసూచికలో ఉంచాం.
- source_word: בִּימֵי שָׁנָה
  choice: సంవత్సరపు రోజుల మధ్య
  rationale: సంవత్సరంలోని రోజుల సమూహంలో భాగమై ఉండే భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: בְּמִסְפַּר יְרָחִים
  choice: నెలల లెక్కలో
  rationale: నెలల గణనలో చేర్చబడటమనే మూలపాఠంలోని లెక్కింపు చిత్రాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: אַל יָבֹא
  choice: అది చేరకుండుగాక
  rationale: בוא యొక్క ‘రావడం/ప్రవేశించడం’ భావాన్ని ‘లెక్కలో’ అనే సందర్భంలో సహజంగా ‘చేరడం’గా అందిస్తుంది.
