  text: Why did I not die from the womb[b][a], and come out from the belly and expire?
translation:
  language: te
  text: నేను గర్భంలోనే ఎందుకు చనిపోలేదు? తల్లి కడుపులోనుంచి[a] బయటికి వచ్చి ప్రాణం విడవలేదు ఎందుకు?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ మూలంలో ఇక్కడ ‘గర్భం’ మరియు ‘కడుపు’ అనే పరస్పర సంబంధమున్నా వేర్వేరు రెండు మాతృదేహ పదాలు సమాంతరంగా వాడబడ్డాయి.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘చనిపోలేదు.’ ఇక్కడి హీబ్రూ క్రియ ముందున్న ‘చనిపోవడం’ అనే క్రియకు భిన్నమైనది; అది ‘ప్రాణం విడవడం’ అనే భావాన్ని నొక్కి చెప్పవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָּה
  choice: ఎందుకు
  rationale: కారణాన్ని ప్రశ్నించే సాధారణ పదం; యోబు విలాపంలోని ప్రశ్నార్థక భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: מֵרֶחֶם
  choice: గర్భం నుంచే
  rationale: רֶחֶם అనే పదంలోని గర్భసంబంధమైన స్పష్టమైన దృశ్యాన్ని నిలుపుతుంది; సందర్భానుసారంగా ‘నుంచే’ జనన సమయంలోనే అనే భావాన్ని అందిస్తుంది.
- source_word: אָמוּת
  choice: చనిపోలేదు
  rationale: ఈ విలాపంలో మొదటి పురుష ఏకవచన క్రియను గతంలో జరగని దానిపై విచారించే సహజ తెలుగు ప్రశ్నగా వ్యక్తం చేస్తుంది.
- source_word: מִבֶּטֶן
  choice: తల్లి కడుపులోనుంచి
  rationale: בֶּטֶן అనే పదానికి ‘కడుపు/గర్భం’ అనే అర్థాలు ఉన్నాయి. ముందున్న רֶחֶםతో పదభేదాన్ని నిలుపుతూ, జనన సందర్భాన్ని స్పష్టం చేయడానికి ‘తల్లి కడుపు’ ఎంచుకున్నాం.
- source_word: יָצָאתִי
  choice: బయటికి వచ్చి
  rationale: మూలంలోని ‘బయటికి రావడం’ అనే స్పష్టమైన దృశ్యాన్ని ‘పుట్టడం’ అని సంక్షిప్తీకరించకుండా నిలుపుతుంది.
- source_word: וְאֶגְוָע
  choice: ప్రాణం విడువలేదు
  rationale: גוע సాధారణంగా మరణించడం, ప్రాణం విడవడం అనే భావాన్ని ఇస్తుంది. ముందున్న מות (‘చనిపోవడం’)తో ఉన్న స్వల్ప పదభేదాన్ని తెలుగులో నిలుపుతుంది.
