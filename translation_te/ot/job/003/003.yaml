  to: 'నేను పుట్టిన రోజు నశించిపోవాలి;

    ‘ఒక మగశిశువు[a] గర్భంలో కలిగాడు’ అని చెప్పిన రాత్రి కూడా నశించిపోవాలి.'
  rationale: Conception is rendered as ‘గర్భంలో కలిగాడు,’ avoiding the developmental nuance of ‘ఏర్పడ్డాడు’ while preserving the Hebrew’s male reference, personification, and imprecatory parallelism.
