  yaml_path: translation/ot/job/003/003.yaml
  text: May the day perish on which I was born[a], and the night that said, ‘A man is conceived.’
translation:
  language: te
  text: 'నేను పుట్టిన రోజు నశించిపోవాలి;

    ‘ఒక మగశిశువు[a] గర్భంలో కలిగాడు’ అని చెప్పిన రాత్రి కూడా నశించిపోవాలి.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఒక పురుషుడు గర్భంలో కలిగాడు.”
    reason: גָבֶר అనే పదానికి ‘పురుషుడు’ అనే ప్రత్యక్ష అర్థం ఉంది; అయితే గర్భధారణ సందర్భంలో అది మగశిశువును సూచించవచ్చు.
lexical_decisions:
- source_word: יֹאבַד
  choice: నశించిపోవాలి
  rationale: హీబ్రూ క్రియలోని శాపరూప కోరికను సాధారణ భవిష్యత్తుగా కాకుండా, ‘నశించిపోవాలి’ అనే ఆకాంక్షాత్మక రూపంతో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: יוֹם
  choice: రోజు
  rationale: సందర్భంలో యోబు పుట్టిన నిర్దిష్ట రోజును సూచిస్తుంది; తెలుగు సంబంధవాక్యంలో అదనపు నిర్దేశక పదం అవసరం లేదు.
- source_word: אִוָּלֶד בּוֹ
  choice: నేను పుట్టిన
  rationale: నిఫాల్ రూపంలోని ‘నేను పుట్టాను’ అనే భావాన్ని, ‘రోజు’తో సహజంగా కలిసే తెలుగు సంబంధవాక్యంగా అందిస్తుంది.
- source_word: וְהַלַּיְלָה
  choice: రాత్రి కూడా
  rationale: ‘రోజు’తో సమాంతరంగా శపించబడుతున్న రెండవ కాలాన్ని సూచిస్తుంది; ‘కూడా’ ఆ సమన్వయాన్ని తెలుగులో స్పష్టం చేస్తుంది.
- source_word: אָמַר
  choice: అని చెప్పిన
  rationale: రాత్రిని మాట్లాడే వ్యక్తిగా చిత్రించే మూలంలోని వ్యక్తీకరణను నిలుపుతుంది.
- source_word: הֹרָה
  choice: గర్భంలో ఏర్పడ్డాడు
  rationale: గర్భధారణ సంభవించిందనే భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తూ, రాత్రినే గర్భం ధరించిన కర్తగా అపార్థం చేసుకోకుండా చేస్తుంది.
- source_word: גָבֶר
  choice: మగశిశువు
  rationale: ఈ గర్భధారణ సందర్భంలో పురుషలింగ వ్యక్తిని సూచించే పదాన్ని సహజమైన తెలుగులో అందిస్తుంది; మరింత పదక్షరార్థమైన ‘పురుషుడు’ అనే అవకాశాన్ని పాదటిప్పణిలో నిలుపుతుంది.
