translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; యోబు కవిత్వంలోని సమాంతర ఆనంద క్రియలను ‘సంతోషిస్తూ, ఉల్లసించేవారు’గా నిలిపి, సహజతతో పాటు గంభీరతను కాపాడాం. వాక్యం తదుపరి/మునుపటి సందర్భంతో కలిసే ఖండవాక్యమని సూచించేందుకు చివర దీర్ఘ విరామచిహ్నం ఉంచాం.
