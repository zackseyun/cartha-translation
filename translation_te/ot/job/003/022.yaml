translation:
  language: te
  text: అత్యంతంగా సంతోషించేవారు, సమాధిని కనుగొన్నప్పుడు[a] ఉల్లసించేవారు—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సమాధిని కనుగొంటారు కాబట్టి.” ఇక్కడి హీబ్రూ సంధిపదానికి కాలార్థంతోపాటు కారణార్థం కూడా ఉండవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: הַשְּׂמֵחִים
  choice: సంతోషిస్తూ
  rationale: నిర్దిష్ట ఉపపదంతో ఉన్న కృదంతం మునుపటి వచనంలోని వ్యక్తుల వర్ణనను కొనసాగిస్తుంది. తెలుగులో క్రియావిశేషణాత్మక కృదంత రూపం కవితా ప్రవాహాన్ని సహజంగా నిలుపుతుంది.
- source_word: אֱלֵי גִיל
  choice: అత్యంతంగా
  rationale: అక్షరార్థంగా ‘ఉల్లాసం వరకు/వైపు’ అనే ఈ నుడికారం సంతోష తీవ్రతను పెంచుతుంది; ‘అత్యంతంగా’ ఆ భావాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: יָשִׂישׂוּ
  choice: ఉల్లసించేవారు
  rationale: మొదటి ఆనంద క్రియతో ఉన్న భావ పునరుక్తిని నిలుపుతూ, మరింత ఉద్ధృతమైన ఆనందాన్ని ‘ఉల్లసించు’ వ్యక్తం చేస్తుంది.
- source_word: כִּי
  choice: కనుగొన్నప్పుడు
  rationale: כִּי ఇక్కడ సమాధి దొరకడం వారి ఉల్లాసానికి సందర్భమని సూచించవచ్చు. కాలార్థక పఠనాన్ని ప్రధాన పాఠ్యంలో ఉంచి, కారణార్థక అవకాశాన్ని పాదసూచికలో నిలిపాం.
- source_word: יִמְצְאוּ
  choice: కనుగొన్న
  rationale: מצא యొక్క సరళమైన అర్థాన్ని, మరణాన్ని వెదికి చివరకు పొందడమనే సందర్భాన్ని కాపాడుతుంది.
- source_word: קָבֶר
  choice: సమాధిని
  rationale: קָבֶר ఏకవచన నామవాచకం; ఇక్కడ మరణానంతర గమ్యాన్ని సూచిస్తుంది. తెలుగులో ‘సమాధి’ సహజంగా ఉండి, నిర్దిష్టతను బలవంతంగా చేర్చదు.
