translation:
  language: te
  text: 'మోకాళ్లు నన్నెందుకు స్వీకరించాయి?[a]


    మరి నేను పాలు పీల్చడానికి స్తనాలు ఎందుకు ఉన్నాయి?[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “మోకాళ్లు” అనేది పుట్టిన శిశువును మోకాళ్లపై లేదా ఒడిలోకి స్వీకరించడాన్ని సూచించే అవకాశం ఉంది.
    reason: cultural_note
  - marker: b
    text: లేదా “నేను పాలు తాగడానికి.” హీబ్రూ క్రియ పసిబిడ్డ పాలు పీల్చడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַדּוּעַ
  choice: ఎందుకు
  rationale: యోబు విలాపంలోని సూటి ప్రశ్నను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: קִדְּמוּנִי
  choice: నన్ను స్వీకరించాయి
  rationale: קדם ఇక్కడ ఎదుర్కోవడం లేదా స్వీకరించడం అనే భావంలో ఉంది; మోకాళ్లతో కలిసినప్పుడు పుట్టిన శిశువును ఒడిలోకి స్వీకరించే దృశ్యాన్ని సూచిస్తుంది.
- source_word: בִרְכָּיִם
  choice: మోకాళ్లు
  rationale: మూలంలోని స్పష్టమైన బహువచన శరీరావయవ పదాన్ని నిలుపుతుంది; దాని సాంస్కృతిక భావాన్ని పాదసూచిక వివరిస్తుంది.
- source_word: וּמַה
  choice: ఎందుకున్నాయి
  rationale: అక్షరార్థంగా ‘మరి ఏమి’ అయినప్పటికీ, ముందరి ప్రశ్నకు సమాంతరంగా ఇక్కడ కారణాన్ని ప్రశ్నిస్తుంది; తెలుగులో ‘ఎందుకున్నాయి?’ సహజంగా ఉంటుంది.
- source_word: שָׁדַיִם
  choice: స్తనాలు
  rationale: మూలంలోని శరీరావయవ పదానికి నేరమైన, గౌరవప్రదమైన తెలుగు సమానం; ‘తల్లి’ అని చేర్చకుండా మూలపాఠ పరిమితిని కాపాడుతుంది.
- source_word: כִּי
  choice: నేను ... తాగడానికి
  rationale: రెండవ ప్రశ్నతో అనుసంధానమైన ఉద్దేశం లేదా ఫలితాన్ని తెలుగులో సహజమైన ప్రయోజనార్థక నిర్మాణంతో తెలియజేస్తుంది.
- source_word: אִינָק
  choice: పాలు తాగడానికి
  rationale: ఈ క్రియ పసిబిడ్డ పాలు పీల్చడాన్ని సూచిస్తుంది. ‘పాలు తాగడం’ సాధారణ ఆధునిక తెలుగులో స్పష్టంగా, సహజంగా ఉంటుంది; మరింత అక్షరార్థ రూపం పాదసూచికలో ఇవ్వబడింది.
