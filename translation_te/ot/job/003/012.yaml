  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన విలాపశైలిని ఉపయోగించాం. మూలంలోని ‘మోకాళ్లు’ అనే స్పష్టమైన రూపకాన్ని నిలిపి, సాంస్కృతిక వివరణను పాదసూచికలో ఇచ్చాం. రెండు పాదాల ప్రశ్నాత్మక సమాంతరతను కాపాడాం.
