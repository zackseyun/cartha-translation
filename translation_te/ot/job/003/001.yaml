  text: After this[a], Job opened his mouth and cursed his day.
translation:
  language: te
  text: ఆ తర్వాత యోబు నోరు తెరిచి తన దినాన్ని[a] శపించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తాను పుట్టిన దినాన్ని.” హీబ్రూలో పదశః, “తన దినం.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרֵי כֵן
  choice: ఆ తర్వాత
  rationale: ఇది కథన క్రమాన్ని సూచించే సాధారణ కాలసంబంధ పదబంధం; ఆధునిక ప్రామాణిక తెలుగులో సహజంగా ఉంది.
- source_word: פָּתַח ... אֶת פִּיהוּ
  choice: నోరు తెరిచి
  rationale: మాట ప్రారంభించడాన్ని సూచించే హీబ్రూ నుడికారాన్ని యథాతథంగా నిలుపుతూ, దాని గంభీరమైన వాక్చాతుర్య బలాన్ని కాపాడుతుంది.
- source_word: אִיּוֹב
  choice: యోబు
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: וַיְקַלֵּל
  choice: శపించాడు
  rationale: పియేల్ రూపంలోని קלל ఇక్కడ ‘శపించు’ అనే బలమైన అర్థాన్నే ఇస్తుంది; దానిని మృదువుగా మార్చలేదు.
- source_word: אֶת יוֹמוֹ
  choice: తన దినాన్ని
  rationale: హీబ్రూ వాచ్యార్థం ‘అతని/తన దినం.’ సందర్భంలో అది అతడు పుట్టిన దినాన్ని సూచించినా, మూలపాఠంలోని సంక్షిప్తతను ప్రధాన వాక్యంలో నిలిపింది.
theological_decisions:
- issue: ‘తన దినం’ అంటే యోబు పుట్టిన దినమని ప్రధాన వాక్యంలో స్పష్టం చేయాలా
  choice: ప్రధాన వాక్యంలో ‘తన దినాన్ని’ అనే సంక్షిప్త వ్యక్తీకరణను ఉంచడం
  alternative: ‘తాను పుట్టిన దినాన్ని’ లేదా ‘తన పుట్టినరోజును’
  rationale: ఈ వచనంలోని హీబ్రూ పాఠం ‘పుట్టిన’ అని స్పష్టంగా చెప్పదు; తరువాతి సందర్భం ఆ భావాన్ని వెల్లడిస్తుంది. అందువల్ల పాఠ్య ప్రగతిని, దానిలోని నిజమైన సంక్షిప్తతను కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సరళమైనప్పటికీ గంభీరమైన కథన శైలి. హీబ్రూ నుడికారం ‘నోరు తెరిచి’ నిలుపబడింది.
