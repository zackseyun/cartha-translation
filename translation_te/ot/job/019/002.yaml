review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the temporal lament (“How long”), the plural addressees, the personal object of נַפְשִׁי (“me”), and the forceful metaphor of דכא (“crush”). The proposed wording retains the instrumental sense of בְּמִלִּים, “with words.”
  naturalness: ‘వేదనపెట్టి’ is understandable but is less idiomatic and less direct than ‘వేధిస్తూ’ in this sustained complaint. The revised sentence is smooth modern standard Telugu and preserves the ongoing rhetorical force.
  terminology: ‘వేధిస్తూ’ appropriately expresses the inward torment/affliction of תּוֹגְיוּן without imposing a theological sense. ‘నలిపివేస్తారు’ preserves the crushing metaphor of תְּדַכְּאוּנַנִי. The footnote preserves the lexical alternative involving ‘my soul/inner self.’
  issues:
  - severity: low
    issue: The expression ‘వేదనపెట్టి’ is somewhat less natural in this context.
    rationale: It can be understood as “causing pain,” but ‘వేధిస్తూ’ is more idiomatic for sustained personal torment and better suits Job’s rhetorical “How long?” complaint.
