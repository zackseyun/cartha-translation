source:
  edition: WLC
  text: עַד אָ֭נָה תּוֹגְי֣וּ/ן נַפְשִׁ֑/י וּֽ/תְדַכְּאוּ/נַ֥נִי בְ/מִלִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/019/002.yaml
  text: How long will you torment me and crush me with words?[a]
translation:
  language: te
  text: ఎంతకాలం మీరు నన్ను వేధిస్తూ, మాటలతో నన్ను నలిపివేస్తారు?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఎంతకాలం మీరు నా అంతరంగాన్ని దుఃఖపరుస్తూ, మాటలతో నన్ను నలిపివేస్తారు?’
    reason: יגה మరియు נֶפֶשׁ పదాలకు సాధ్యమైన మరింత పదశః ప్రత్యామ్నాయాన్ని, హీబ్రూలోని అంతరంగ బాధ నుడికారాన్ని సూచించడానికి.
lexical_decisions:
- source_word: עַד אָנָה
  choice: ఎంతకాలం
  rationale: హీబ్రూ కాలసంబంధ విలాప ప్రశ్నకు సహజమైన తెలుగు రూపం; ప్రశ్నలోని వేదననూ కొనసాగుతున్న పరిస్థితినీ నిలుపుతుంది.
- source_word: תּוֹגְיוּן
  choice: మీరు నన్ను వేదనపెట్టి
  rationale: హిఫీల్ రూపం యోబు అంతరంగానికి కలిగిస్తున్న బాధను సూచిస్తుంది. ‘వేదనపెట్టు’ శారీరక బాధకే పరిమితం కాకుండా మానసిక, అంతరంగిక బాధను కూడా సహజంగా వ్యక్తం చేస్తుంది.
- source_word: נַפְשִׁי
  choice: నన్ను
  rationale: ఇక్కడ נֶפֶשׁ యోబు వ్యక్తినీ అతని అంతరంగ స్వరూపాన్నీ సూచిస్తుంది. ‘నా ప్రాణాన్ని’ అని పదశః అనువదిస్తే తెలుగులో ప్రాణహాని అనే భావం కలగవచ్చు; ‘నన్ను’ సందర్భార్థాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: וּתְדַכְּאוּנַנִי
  choice: నన్ను నలిపివేస్తారు
  rationale: דכא లోని నలిపివేయడం లేదా కృంగదీయడం అనే బలమైన రూపకాన్ని నిలుపుతుంది; స్నేహితుల మాటలు యోబును పూర్తిగా కుంగదీస్తున్న భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: בְמִלִּים
  choice: మాటలతో
  rationale: ఉపకరణార్థక בְ ను సహజమైన తెలుగు ‘తో’ ద్వారా అందిస్తూ, నలిపివేయడానికి వారి మాటలే సాధనమని చూపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన విలాప స్వరం. బహువచన ‘మీరు’ యోబు తన స్నేహితులను ఉద్దేశిస్తున్న హీబ్రూ క్రియారూపాలను ప్రతిబింబిస్తుంది; ‘నలిపివేస్తారు’ మూలంలోని బలమైన రూపకాన్ని నిలుపుతుంది.
