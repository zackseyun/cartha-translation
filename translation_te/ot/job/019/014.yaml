  yaml_path: translation/ot/job/019/014.yaml
  text: My relatives have failed me[a], and my acquaintances have forgotten me.
translation:
  language: te
  text: నా బంధువులు నన్ను విడిచిపెట్టారు[a]; నాకు పరిచయమైనవారు నన్ను మరచిపోయారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నా బంధువులు ఇక లేరు.”
    reason: חָדְלוּ అనే క్రియకు ‘నిలిచిపోవడం/ఇక లేకపోవడం’ అనే మరింత ప్రత్యక్షమైన భావం ఉంది. ఈ ప్రత్యామ్నాయం మూలంలోని సంక్షిప్తతను, అస్పష్టతను కాపాడుతుంది; ‘రావడం’ వంటి మూలంలో లేని చర్యను జోడించదు.
lexical_decisions:
- source_word: חָדְלוּ
  choice: దూరమయ్యారు
  rationale: ఈ క్రియకు ప్రాథమికంగా ‘మానిపోవడం, నిలిచిపోవడం’ అనే అర్థం ఉంది. బంధువులు కర్తలుగా ఉన్న ఈ సందర్భంలో, వారి సంబంధం లేదా సహవాసం నిలిచిపోయిందనే భావాన్ని సహజమైన తెలుగులో ‘నాకు దూరమయ్యారు’ తెలియజేస్తుంది; ‘నన్ను ఆదుకోవడం మానేశారు’ అని అనువదిస్తే మూలంలో స్పష్టంగా లేని సహాయం అనే భావం చేరుతుంది.
- source_word: קְרוֹבָי
  choice: నా బంధువులు
  rationale: ‘నా సమీపస్థులు’ అనే మూలభావం సందర్భంలో రక్తసంబంధులు లేదా దగ్గరి బంధువులను సూచించగలదు. ఆధునిక తెలుగులో ‘నా బంధువులు’ స్పష్టంగా, సహజంగా ఉంది.
- source_word: וּמְיֻדָּעַי
  choice: నాకు పరిచయమైనవారు
  rationale: ידע మూలం నుంచి వచ్చిన ఈ రూపం ‘నాకు తెలిసినవారు’ లేదా ‘పరిచయస్థులు’ అనే భావాన్ని ఇస్తుంది. ‘స్నేహితులు’ అనడం మూలం సూచించే దానికంటే ఎక్కువ సాన్నిహిత్యాన్ని చేర్చవచ్చు; అందువల్ల ‘నాకు పరిచయమైనవారు’ ఎంచుకున్నాం.
- source_word: שְׁכֵחוּנִי
  choice: నన్ను మరచిపోయారు
  rationale: שׁכח క్రియ యొక్క ప్రత్యక్ష అర్థం ‘మరచిపోవడం.’ యోబు విలాపంలోని తీవ్రతను, అతడు అనుభవిస్తున్న నిర్లక్ష్యాన్ని వ్యాఖ్యానించి మార్చకుండా ఈ నేర అనువాదం నిలుపుతుంది.
