translation:
  language: te
  text: నా ఆంతరంగికులందరూ నన్ను అసహ్యించుకుంటున్నారు[a]; నేను ప్రేమించినవారు నాకు విరోధులయ్యారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో పదశః, ‘నా రహస్య సలహా వర్గపు మనుషులు’; అంటే యోబు నమ్మకంగా తన అంతరంగ విషయాలు పంచుకున్న సన్నిహితులు.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּעֲבוּנִי
  choice: నన్ను అసహ్యించుకుంటున్నారు
  rationale: תעב తీవ్రమైన ఏవగింపు, అసహ్యాన్ని సూచిస్తుంది. సాధారణ ‘ఇష్టపడకపోవడం’ కంటే బలమైన భావాన్ని ఈ ప్రయోగం సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: כָּל
  choice: అందరూ
  rationale: ఈ సమూహంలోని వారందరినీ సమగ్రంగా సూచించే పరిమాణార్థాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: מְתֵי סוֹדִי
  choice: నా ఆంతరంగికులు
  rationale: పదశః ‘నా రహస్య/సన్నిహిత సలహా వర్గపు మనుషులు’; ఇది యోబు నమ్మకంగా తన అంతరంగ విషయాలు పంచుకున్న సన్నిహిత వర్గాన్ని సూచిస్తుంది.
- source_word: וְזֶה אָהַבְתִּי
  choice: నేను ప్రేమించినవారు
  rationale: זֶה రూపంలో ఏకవచనమైనా, తరువాతి బహువచన క్రియతోను ముందరి సమూహానికి సమాంతరంగాను సామూహిక అర్థంలో ఉంది. తెలుగులో బహువచనం సహజం.
- source_word: נֶהְפְּכוּ בִי
  choice: నాకు విరోధులయ్యారు
  rationale: Niphal రూపం సంబంధం లేదా వైఖరిలో జరిగిన తిరుగుదలను తెలియజేస్తుంది; בִי సందర్భానుసారంగా ‘నాకు విరోధంగా’ అనే భావం ఇస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన విలాప శైలి. ‘ఆంతరంగికులు’ రహస్య సలహా వర్గం మరియు సన్నిహిత సంబంధం అనే రెండు భావాలనూ సంక్షిప్తంగా అందిస్తుంది; పాదసూచిక మూలపదబంధాన్ని స్పష్టం చేస్తుంది.
