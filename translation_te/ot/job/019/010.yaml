  yaml_path: translation/ot/job/019/010.yaml
  text: He tears me down on every side[a], and I am gone; he has uprooted my hope like a tree.
translation:
  language: te
  text: 'ఆయన నన్ను అన్నివైపులా కూలదోశాడు; నేను నశించిపోయాను.[a]


    చెట్టును పెకలించినట్లు నా ఆశను పెకలించాడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నేను వెళ్తాను / నేను అంతరించిపోతాను.” హీబ్రూ వాక్యంలో అక్షరార్థంగా “నేను వెళ్తాను” అని ఉంది; కూలదోయబడిన ఫలితంగా యోబు నశించిపోయాడనే భావాన్ని ఇది సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתְּצֵנִי
  choice: నన్ను ... కూలదోశాడు
  rationale: נתץ అనే క్రియ కూలదోయడం లేదా ధ్వంసం చేయడం అనే బలమైన భావాన్ని ఇస్తుంది; కర్మప్రత్యయం ‘నన్ను’ అని స్పష్టంగా ఉంది.
- source_word: סָבִיב
  choice: అన్నివైపులా
  rationale: చుట్టూ, అన్ని వైపుల నుంచి అనే సమగ్ర విధ్వంస భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: וָאֵלַךְ
  choice: నేను నశించిపోతున్నాను
  rationale: అక్షరార్థంగా ‘నేను వెళ్లిపోతాను/వెళ్తాను’; ఇక్కడ కూలదోయబడిన ఫలితంగా అంతరించిపోవడం లేదా పూర్తిగా పాడైపోవడం అనే సందర్భోచిత భావం ఉంది. మూలంలోని అస్పష్టతను పాదసూచికలో నిలిపాం.
- source_word: וַיַּסַּע
  choice: పెకలించాడు
  rationale: נסע ఇక్కడ స్థిరంగా ఉన్నదాన్ని పైకి లాగి తొలగించడం అనే భావంలో ఉంది. చెట్టు ఉపమానంతో కలిసి ‘పెకలించాడు’ వేరుతో సహా తొలగించే చిత్రాన్ని సహజంగా అందిస్తుంది.
- source_word: כָּעֵץ
  choice: చెట్టును ...ట్లు
  rationale: చెట్టుతో చేసే పోలికను తెలుగులో సహజమైన ఉపమాన నిర్మాణంతో నిలిపింది.
- source_word: תִּקְוָתִי
  choice: నా ఆశను
  rationale: תקוה సాధారణంగా ఆశ లేదా నిరీక్షణను సూచిస్తుంది; యోబు విలాప సందర్భంలో ‘ఆశ’ సరళమైన, సహజమైన ఎంపిక.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, విలాపానికి తగిన గంభీరతతో అనువదించబడింది. హీబ్రూ క్రియల విధ్వంస బలం, చెట్టు పెకలింపు దృశ్యం నిలుపబడ్డాయి; וָאֵלַךְ లోని నిజమైన అర్థసందిగ్ధత పాదసూచికలో ఇవ్వబడింది.
