  - severity: medium
    issue: Existential משפט rendered as an event
    rationale: “న్యాయం జరగడం లేదు” can suggest that justice has not yet occurred, whereas the Hebrew says more starkly that no justice/judgment is present. “న్యాయం లేదు” retains the force and ambiguity.
