  source_fidelity: The draft accurately conveys the two urgent cries, the lack of an answer, and the legal-moral force of מִשְׁפָּט. However, “న్యాయం జరగడం లేదు” shifts the Hebrew existential assertion (“there is no justice/judgment”) toward an ongoing-event formulation. “న్యాయం లేదు” more directly preserves the source’s terse, unresolved lament.
