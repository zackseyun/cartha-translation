  text: הֵ֤ן אֶצְעַ֣ק חָ֭מָס וְ/לֹ֣א אֵעָנֶ֑ה אֲ֝שַׁוַּ֗ע וְ/אֵ֣ין מִשְׁפָּֽט׃
base_translation:
  language: en
  yaml_path: translation/ot/job/019/007.yaml
  text: Look[a], I cry out, “Violence!” but I am not answered; I cry for help[c][b], but there is no justice.
translation:
  language: te
  text: ఇదిగో[a], “హింస!” అని నేను కేక వేస్తున్నాను, కానీ నాకు జవాబు లేదు; సహాయం కోసం మొరపెడుతున్నాను[b], కానీ న్యాయం లేదు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నిజంగా” లేదా “చూడండి.” హీబ్రూ పదం బలంగా దృష్టిని ఆకర్షిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా “సహాయం కోసం కేక వేస్తున్నాను.” ఈ క్రియ అత్యవసర సహాయం కోసం చేసే మొరను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: లేదా “తీర్పు లేదు” లేదా “న్యాయపరమైన పరిహారం లేదు.” హీబ్రూ పదానికి న్యాయం, సరైన తీర్పు అనే న్యాయపరమైన భావం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: ఇదిగో
  rationale: బలంగా దృష్టిని ఆకర్షించే ఉపోద్ఘాత పదం. ఆధునిక తెలుగులో సహజంగా ఉండి మూలంలోని ఉద్ఘాటనను నిలుపుతుంది.
- source_word: אֶצְעַק
  choice: నేను కేక వేస్తున్నా
  rationale: צעק ఆపదలో బిగ్గరగా చేసే కేకను సూచిస్తుంది; ఈ ఎంపిక శబ్ద తీవ్రతను, ఆవేదనను తెలియజేస్తుంది.
- source_word: חָמָס
  choice: హింస
  rationale: ఈ నామవాచకం హింస, అన్యాయం, దౌర్జన్యం అనే భావాలను కలిగి ఉంటుంది. ఇక్కడ యోబు తనకు జరిగిన దౌర్జన్యాన్ని ఫిర్యాదుగా ప్రకటిస్తున్నందున ‘హింస’ ప్రత్యక్షమైన ప్రధాన సమానార్థకం.
- source_word: אֵעָנֶה
  choice: నాకు జవాబు దొరకడం లేదు
  rationale: ענה నిఫాల్ రూపం ఇక్కడ ‘జవాబు పొందడం’ అనే నిష్క్రియ భావాన్ని ఇస్తుంది. తెలుగులో సహజంగా ఉంటూనే జవాబు రాకపోవడాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: אֲשַׁוַּע
  choice: సహాయం కోసం మొరపెడుతున్నా
  rationale: ఈ క్రియ అత్యవసర సహాయం కోసం చేసే మొరను సూచిస్తుంది. ‘మొరపెట్టు’ మొదటి పాదంలోని ‘కేక వేయు’తో స్వల్ప భేదాన్ని ఉంచి సహాయార్థక భావాన్ని స్పష్టం చేస్తుంది.
- source_word: מִשְׁפָּט
  choice: న్యాయం
  rationale: ఈ సందర్భంలో న్యాయమైన విచారణ, తీర్పు లేదా పరిహారం అనే న్యాయపరమైన భావం ఉంది. ‘న్యాయం’ దాని నైతిక, న్యాయపరమైన విస్తృతిని సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: దేవుని ఎదుట యోబు చేస్తున్న ఫిర్యాదు స్వభావం
  choice: జవాబు లేని మొరగా, న్యాయం జరగని పరిస్థితిగా యోబు ఆరోపణను బలహీనపరచకుండా అనువదించడం
  alternative: దేవుడు న్యాయాన్ని నిరాకరిస్తున్నాడనే భావం రాకుండా పరోక్షంగా లేదా మృదువుగా అనువదించడం
  rationale: హీబ్రూ పాఠం హింస గురించి యోబు కేక వేసినా జవాబు రాకపోవడం, సహాయం కోసం మొరపెట్టినా న్యాయం జరగకపోవడం అని స్పష్టంగా చెబుతుంది. ఈ వేదాంతపరమైన ఉద్రిక్తతను పరిష్కరించకుండా నిలుపాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన, గౌరవప్రదమైన భాష. యోబు మొరలోని కవితాత్మక సమాంతరతను, న్యాయస్థాన సంబంధిత అంతర్భావాన్ని కాపాడింది.
