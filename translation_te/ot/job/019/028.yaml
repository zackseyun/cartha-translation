  text: If you say[a], ‘How shall we pursue him, since the root of the matter is found in me?’
translation:
  language: te
  text: మీరు, “అతణ్ణి ఎలా వెంటాడుదాం? ఈ విషయపు మూలం నాలో కనిపించింది కదా!” అని అంటే[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ వాక్యం కఠినంగా ఉంది. వ్యంజన పాఠాన్ని, ప్రాచీన అనువాదాల సాక్ష్యాన్ని ఎలా తూకం వేస్తామనే దానిపై చివరి భాగాన్ని “ఈ విషయపు మూలం అతనిలో కనిపించింది” అనే భావంలో కూడా అర్థం చేసుకోవచ్చు. “వెంటాడు” అనే క్రియకు ఇక్కడ “హింసించు” అనే బలమైన అర్థం కూడా ఉండవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: అని అనుకుంటే
  rationale: ఇక్కడ ప్రత్యర్థులు చెప్పే ఊహాత్మక మాటను పరిచయం చేస్తుంది; తెలుగులో షరతును సహజంగా తెలియజేయడానికి వాక్యాంతంలో ‘అని అనుకుంటే’ వాడాం.
- source_word: תֹאמְרוּ
  choice: మీరు … అనుకుంటే
  rationale: Qal imperfect 2mp రూపంలోని ‘మీరు అంటారు’ అనే భావాన్ని ఈ షరతు సందర్భంలో సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: מַה נִּרְדָּף
  choice: ఎలా వెంటాడుదాం?
  rationale: מַה ఇక్కడ ‘ఎలా?’ అనే క్రియావిశేషణ ప్రశ్న; רדף యొక్క వెంబడించడం/హింసించడం అనే బలాన్ని ‘వెంటాడుదాం’ కొంతవరకు నిలుపుతుంది.
- source_word: לוֹ
  choice: అతణ్ణి
  rationale: רדף తో ל వెంబడింపబడే వ్యక్తిని సూచిస్తుంది; తెలుగులో ప్రత్యక్ష కర్మ సహజం.
- source_word: וְשֹׁרֶשׁ דָּבָר
  choice: విషయపు మూలం … కాబట్టి
  rationale: ‘విషయానికి ఆధారం లేదా అసలు కారణం’ అనే రూపకాన్ని ‘విషయపు మూలం’గా నిలిపి, וְ యొక్క వివరణాత్మక/కారణ సంబంధాన్ని ‘కాబట్టి’తో వ్యక్తం చేశాం.
- source_word: נִמְצָא בִי
  choice: నాలోనే కనిపించింది
  rationale: నిఫాల్ యొక్క దొరకడం/కనిపించడం అనే ఫలిత భావాన్ని, MTలోని בִי ‘నాలో’ అనే పఠనాన్ని నిలుపుతుంది; ‘నే’ వాక్యంలోని ఆరోపణాత్మక కేంద్రీకరణను సహజంగా చూపుతుంది.
theological_decisions:
- issue: 'చివరి పదంలోని వ్యక్తి: בִי (‘నాలో’) లేదా ప్రత్యామ్నాయంగా ‘అతనిలో’'
  choice: నాలోనే
  alternative: అతనిలోనే
  rationale: WLC మసొరేటిక్ వ్యంజన-స్వర పాఠం בִי, ‘నాలో,’ అని స్పష్టంగా ఇస్తుంది. అయినా వాక్యం కఠినమైనది; ప్రాచీన అనువాదాల తూకం ఆధారంగా ‘అతనిలో’ అనే అవగాహనను పాదటిప్పణిలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనా సామాన్య పాఠకులకు అర్థమయ్యే శైలి. మూలంలోని ‘మూలం’ రూపకాన్ని, వాక్యంలోని నిజమైన పాఠ్య/అర్థ సందిగ్ధతను నిలిపాం. ఈ వచనం తదుపరి వచనంతో కొనసాగుతుందని చూపేందుకు దీర్ఘ విరామచిహ్నం వాడాం.
