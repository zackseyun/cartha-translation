  edition: WLC
  text: יַ֤חַד יָ֘בֹ֤אוּ גְדוּדָ֗י/ו וַ/יָּסֹ֣לּוּ עָלַ֣/י דַּרְכָּ֑/ם וַ/יַּחֲנ֖וּ סָבִ֣יב לְ/אָהֳלִֽ/י׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/019/012.yaml
  text: Together his troops come; they build up their road against me[a], and they camp all around my tent.
translation:
  language: te
  text: 'అతని దండులు ఒక్కటిగా వస్తాయి;

    నాకు వ్యతిరేకంగా తమ దారిని ఎత్తుగా నిర్మిస్తాయి[a],

    నా గుడారం చుట్టూ అన్ని వైపులా మకాం వేస్తాయి.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నాపైకి తమ దారిని ఎత్తిపోస్తాయి.” హీబ్రూ క్రియ ఎత్తుగా దారి నిర్మించడాన్ని గానీ, ముట్టడి దిబ్బను ఎత్తివేయడాన్ని గానీ సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחַד
  choice: ఒక్కటిగా
  rationale: సమిష్టిగా, సమన్వయంతో జరిగే దాడిని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: יָבֹאוּ
  choice: వస్తాయి
  rationale: בוא అనే క్రియ యొక్క మౌలిక అర్థమైన ‘రావడం’ను, కవితాత్మక వర్తమాన వర్ణనను నిలుపుతుంది.
- source_word: גְדוּדָיו
  choice: ఆయన దండులు
  rationale: గెదూద్ సైనిక దండు లేదా దాడిచేసే బృందాన్ని సూచిస్తుంది. బహువచనాన్ని, 3వ పురుష ఏకవచన స్వామ్యసూచకాన్ని నిలుపుతూ దండు పరిమాణాన్ని అనవసరంగా నిర్దేశించదు.
- source_word: וַיָּסֹלּוּ
  choice: ఎత్తుగా కడతాయి
  rationale: סלל దారిని పైకి కట్టడం లేదా ముట్టడి దిబ్బను వేయడం అనే చిత్రాన్ని కలిగిస్తుంది; ఈ ఎంపిక నిర్మాణం మరియు ఎత్తివేయడం అనే రెండు భావాలను అందిస్తుంది.
- source_word: עָלַי
  choice: నాకు ఎదురుగా
  rationale: అక్షరార్థంగా ‘నాపై’ అయినప్పటికీ, ఈ సైనిక సందర్భంలోని ప్రతికూల దిశను సహజంగా తెలియజేస్తుంది.
- source_word: דַּרְכָּם
  choice: తమ దారిని
  rationale: דרך యొక్క స్పష్టమైన మార్గం/దారి భావాన్ని నిలుపుతుంది; ‘తమ’ కర్తతో స్వామ్యసంబంధాన్ని సహజంగా చూపుతుంది.
- source_word: וַיַּחֲנוּ
  choice: మకాం వేస్తాయి
  rationale: חנה యొక్క సైనికంగా శిబిరం వేయడం అనే అర్థాన్ని ఆధునిక, సులభమైన తెలుగులో అందిస్తుంది.
- source_word: סָבִיב
  choice: చుట్టూ
  rationale: అన్ని వైపులా చుట్టుముట్టే భావాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לְאָהֳלִי
  choice: నా గుడారం
  rationale: אֹהֶל యొక్క స్పష్టమైన ‘గుడారం’ చిత్రాన్ని రూపకాలంకారంగా మార్చకుండా నిలుపుతుంది.
theological_decisions:
- issue: ‘ఆయన దండులు’లోని 3వ పురుష ఏకవచన స్వామ్యసూచకం ఎవరిని సూచిస్తుంది?
  choice: సందర్భంలో యోబు తనపై దాడిచేసేవానిగా చిత్రించే దేవుణ్ణి సూచిస్తుంది; అయితే వచనంలో ‘ఆయన’ అనే సర్వనామమే ఉంచబడింది.
  alternative: రూపకంలోని పేరులేని శత్రు సేనాధిపతి.
  rationale: సమీప సందర్భం దేవుని చర్యలను ముట్టడి చిత్రంతో వర్ణిస్తుంది. అయినా హీబ్రూ పాఠం పేరును స్పష్టంగా చెప్పనందున అనువాదం కూడా సూచనలోని స్వల్ప పరోక్షతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కవితాత్మక ధోరణి. సైనిక ముట్టడి చిత్రాన్ని స్పష్టంగా ఉంచుతూ, ‘ఆయన’ అనే సూచనను సందర్భమే నిర్ణయించేలా మూలంలోని అస్పష్టతను నిలుపుకుంది.
