  text: Have pity on me[a], have pity on me, you my friends[b], for the hand of God has struck me.
translation:
  language: te
  text: నా మీద జాలి చూపండి[a], నా మీద జాలి చూపండి, నా స్నేహితులారా! ఎందుకంటే దేవుని చెయ్యి నన్ను తాకింది[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘నా మీద దయ చూపండి’ లేదా ‘నన్ను కరుణించండి.’
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా ‘దేవుని చెయ్యి నన్ను తాకింది.’ ఈ సందర్భంలో అది హాని కలిగించే దెబ్బను లేదా బాధను సూచించవచ్చు; అందువల్ల ‘నన్ను కొట్టింది’ లేదా ‘నన్ను బాధించింది’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָנֻּנִי
  choice: నా మీద జాలి చూపండి
  rationale: חנן యొక్క బహువచన ఆజ్ఞారూపం యోబు తన స్నేహితులను కరుణతో వ్యవహరించమని వేడుకోవడాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘జాలి చూపండి’ ఈ సందర్భంలోని హృదయపూర్వక విజ్ఞప్తిని సహజంగా తెలియజేస్తుంది.
- source_word: חָנֻּנִי (repeated)
  choice: నా మీద జాలి చూపండి
  rationale: యోబు విజ్ఞప్తిలోని తీవ్రతను, కవితాత్మక బలాన్ని నిలుపడానికి పునరుక్తిని యథాతథంగా ఉంచాం.
- source_word: רֵעָי
  choice: నా స్నేహితులారా
  rationale: רֵעַ అంటే స్నేహితుడు లేదా సహచరుడు. సంబోధనను స్పష్టంగా, సహజంగా తెలియజేయడానికి ‘నా స్నేహితులారా’ అని అనువదించాం.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందున్న విజ్ఞప్తికి కారణాన్ని పరిచయం చేస్తుంది; ఆధునిక తెలుగులో ‘ఎందుకంటే’ సంబంధాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: יַד אֱלוֹהַּ
  choice: దేవుని చెయ్యి
  rationale: దైవిక కార్యాన్ని లేదా శక్తిని సూచించే హీబ్రూ రూపకాన్ని చదును చేయకుండా నిలిపాం.
- source_word: אֱלוֹהַּ
  choice: దేవుడు
  rationale: యోబు గ్రంథంలో దేవునికి వాడిన ఏకవచన కవితాత్మక రూపం. సందర్భం అదనపు బిరుదును కోరదు.
- source_word: נָגְעָה בִּי
  choice: నన్ను తాకింది
  rationale: נגע ב యొక్క ప్రాథమిక, రూపకానికి దగ్గరైన అర్థం ‘తాకింది.’ యోబు బాధల సందర్భంలో ఇది హానికరమైన దైవిక ప్రభావాన్ని సూచించినా, ‘తాకింది’ అనే అనువాదం మూలంలోని ఉద్దేశపూర్వక రూపకాన్నీ దాని తీవ్రతపై ఉన్న స్వల్ప అనిశ్చితినీ నిలుపుతుంది; భావాన్ని పాదసూచిక వివరిస్తుంది.
theological_decisions:
- issue: యోబు బాధకు దేవుని కార్యసాధకత్వం
  choice: దేవుని చెయ్యి నన్ను తాకింది
  alternative: దేవుని చెయ్యి నన్ను కొట్టింది / దేవుడు నన్ను బాధించాడు
  rationale: మూలపాఠం యోబు బాధను దేవుని ‘చెయ్యి’తో నేరుగా అనుసంధానిస్తుంది. దైవిక కార్యసాధకత్వాన్ని మృదువుచేయకుండా, అదే సమయంలో נגע అనే క్రియను అవసరానికి మించి తీవ్రపరచకుండా, మూలంలోని రూపకాన్నీ theological tension‌నూ నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కవితాత్మక వాక్యనిర్మాణం వాడాం. పునరుక్తిని నిలిపి యోబు వేడుకోలులోని ఆవేదనను వ్యక్తం చేశాం. ‘చెయ్యి’ అనే సాధారణ రూపం ప్రజలకు సులభంగా అర్థమవుతూనే హీబ్రూ రూపకాన్ని నిలుపుతుంది.
