  yaml_path: translation/ot/job/019/018.yaml
  text: Even little children despise me; when I rise[a], they speak against me.
translation:
  language: te
  text: 'చిన్నపిల్లలు[a] సైతం నన్ను తృణీకరిస్తారు;

    నేను లేచినప్పుడు, వారు నాకు వ్యతిరేకంగా మాట్లాడతారు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘మూర్ఖులు,’ ‘దురుసువారు,’ లేక ‘పిన్నవయస్కులు.’ హీబ్రూ పదం עֲוִילִים సాధారణంగా బుద్ధి లేదా నైతిక వివేకం లేనివారిని సూచిస్తుంది; అయితే ఈ సందర్భంలో చాలామంది దీన్ని యోబును హేళన చేసే అపరిపక్వులైన లేదా సమాజంలో అల్పస్థాయిలో ఉన్న యువకులుగా అర్థం చేసుకుంటారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: సైతం
  rationale: మునుపటి విలాపానికి కొనసాగింపునిస్తూ, యోబును చిన్నపిల్లలు కూడా తృణీకరిస్తున్నారనే అవమాన తీవ్రతను సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: עֲוִילִים
  choice: చిన్నపిల్లలు
  rationale: ఈ అరుదైన పదం సాధారణంగా బుద్ధిహీనులు లేదా నైతిక వివేకం లేనివారిని సూచించగలదు; అయితే ఇక్కడ యోబును హేళన చేసే పిన్నవయస్కులు లేదా అల్పస్థాయి యువకులు అనే సందర్భార్థం సరిపోతుంది. పదంలోని అనిశ్చితిని పాదసూచికలో నిలిపాం.
- source_word: מָאֲסוּ בִי
  choice: నన్ను తృణీకరిస్తున్నారు
  rationale: מאס లోని తిరస్కారం, చులకన భావం రెండింటినీ ‘తృణీకరించు’ గౌరవప్రదమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; విలాపంలోని ప్రస్తుత స్థితిని తెలుగులో సహజంగా తెలియజేయడానికి వర్తమాన రూపం వాడాం.
- source_word: אָקוּמָה
  choice: నేను లేచి నిలబడితే
  rationale: ఈ రూపం సందర్భంలో కాలసంబంధ లేదా పునరావృత షరతు భావాన్ని ఇస్తుంది. ‘లేచి నిలబడితే’ అనేది కేవలం మేల్కొనడం కాక, పైకి లేచి నిలబడడమనే శారీరక చర్యను స్పష్టం చేస్తుంది.
- source_word: וַיְדַבְּרוּ בִי
  choice: వారు నాకు వ్యతిరేకంగా మాట్లాడుతున్నారు
  rationale: דבר עם ב ఇక్కడ సందర్భానుసారం శత్రుభావంతో మాట్లాడటాన్ని సూచిస్తుంది. ‘హేళన చేస్తున్నారు’ అని మరీ స్పష్టీకరించకుండా మూలంలోని సాధారణ ‘మాట్లాడు’ క్రియను, దాని ప్రతికూల దిశను నిలుపుతుంది.
