translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన విలాప శైలిని పాటించాం. మూలంలోని రెండు పాదాల నిర్మాణాన్ని నిలిపి, అరుదైన עֲוִילִים పదంలోని నిజమైన అనిశ్చితిని పాదసూచికలో భద్రపరిచాం.
