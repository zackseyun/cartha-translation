- source_word: וְעֵינַי רָאוּ
  choice: నా కళ్లే ఆయనను చూస్తాయి
  rationale: మొదటి పాదంలోని వ్యక్తిగత దర్శనాన్ని సమాంతరంగా బలపరుస్తుంది; కర్త యొక్క స్వంత కళ్లనే నొక్కి చెబుతుంది.
- source_word: וְלֹא זָר
  choice: పరాయి వ్యక్తి కాదు
  rationale: זָר లోని ‘పరాయి వ్యక్తి/అపరిచితుడు’ అనే మూల భావాన్ని నిలుపుతూ, యోబే చూస్తాడు అనే వ్యత్యాసాన్ని సందర్భంలో స్పష్టంగా ఉంచుతుంది.
- source_word: כָּלוּ
  choice: క్షీణించిపోతున్నాయి
  rationale: అయిపోవడం, కరిగిపోవడం, నీరసించడం అనే కవితాత్మక భావాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: כִלְיֹתַי
  choice: నా మూత్రపిండాలు
  rationale: హీబ్రూ శరీరరూపకాన్ని ప్రధాన పాఠ్యంలో కాపాడుతుంది; అంతరంగం లేదా గాఢ భావోద్వేగాల సూచనను పాదటిప్పణి వివరిస్తుంది.
- source_word: בְּחֵקִי
  choice: నా రొమ్ములో
  rationale: חֵיק యొక్క ‘రొమ్ము/ఒడి’ అనే దృశ్యరూపాన్ని నిలుపుతుంది; ఇక్కడ శరీరం లోపలి భాగాన్ని సూచిస్తుంది.
theological_decisions:
- issue: యోబు ఆశిస్తున్న దర్శనం యొక్క స్వభావం
  choice: ముందటి వచనంలో ప్రస్తావించిన వ్యక్తిని యోబు తానే వ్యక్తిగతంగా చూస్తాడనే భవిష్యత్ నిరీక్షణగా అనువదించడం
  alternative: ఇది శరీర పునరుత్థాన దర్శనం, మరణానికి ముందు న్యాయస్థాపన, లేదా మరణానంతర ఆత్మీయ దర్శనం అని స్పష్టంగా నిర్ణయించడం
  rationale: హీబ్రూ పాఠ్యం యోబు స్వయంగా చూస్తాడనే అంశాన్ని బలంగా నొక్కి చెబుతుంది; అయితే ఈ ఒక్క వచనం ఆ దర్శనం ఎప్పుడు, ఏ విధంగా జరుగుతుందో తేల్చదు. అందువల్ల సిద్ధాంతపరమైన ఉద్రిక్తతను అలాగే ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కవితా శైలిని అనుసరించాం. ‘నేనే,’ ‘నా కళ్లే’ అనే రూపాలు మూలంలోని వ్యక్తిగత నొక్కిచెప్పడాన్ని కాపాడుతాయి. అసాధారణమైన ‘మూత్రపిండాలు’ మరియు ‘రొమ్ము’ రూపకాలను సరళీకరించకుండా ఉంచి పాదటిప్పణితో వివరించాం.
