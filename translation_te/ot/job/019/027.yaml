  text: whom I myself will see for myself[a], and my eyes will see, and not another[b]. My kidneys fail within my bosom.
translation:
  language: te
  text: 'ఆయనను నేనే నా కోసం[a] చూస్తాను;

    నా కళ్లే ఆయనను చూస్తాయి—వేరొకరు కాదు[b].

    నా వక్షంలో నా మూత్రపిండాలు[c] క్షీణించిపోతున్నాయి.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నా పక్షాన.” ఈ హీబ్రూ దత్తి ప్రయోగం కఠినమైనది; అది వ్యక్తిగత అనుభవం లేదా తనకు అనుకూలమైన సంబంధాన్ని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “పరాయి వ్యక్తి కాదు” లేదా “అపరిచితుడు కాదు.” సందర్భంలో యోబు తానే చూస్తాడు, వేరొకరు కాదు అనే భావం ఉండవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: హీబ్రూలో అక్షరార్థంగా “నా మూత్రపిండాలు.” ప్రాచీన హీబ్రూ వాడుకలో ఇవి అంతరంగ స్వభావానికి లేదా అత్యంత గాఢమైన భావోద్వేగాలకు రూపకం.
    reason: cultural_note
lexical_decisions:
- source_word: אֲשֶׁר
  choice: ఆయనను
  rationale: ముందటి వచనంలో ప్రస్తావించిన విమోచకునికి సంబంధించిన కర్మార్థక సంబంధసర్వనామ భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אֲנִי
  choice: నేనే
  rationale: క్రియలోనే ఉన్న ప్రథమ పురుష భావానికి తోడుగా వచ్చిన స్వతంత్ర సర్వనామం ఇచ్చే నొక్కిచెప్పడాన్ని కాపాడుతుంది.
- source_word: אֶחֱזֶה
  choice: చూస్తాను
