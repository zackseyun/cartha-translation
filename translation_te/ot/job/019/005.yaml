    text: లేదా, “నాపై మిమ్మల్ని మీరు హెచ్చించుకొని.” హీబ్రూ క్రియ, మరొకరిని తక్కువ చేస్తూ తనను తాను గొప్ప చేసుకోవడం అనే భావాన్ని వ్యక్తం చేయగలదు.
