  text: If indeed you magnify yourselves against me and prove my disgrace against me[b][a],
translation:
  language: te
  text: మీరు నిజంగా నాపై మిమ్మల్ని మీరు గొప్ప చేసుకొని[a], నా అవమానాన్ని నాకు వ్యతిరేకంగా రుజువు చేస్తే[b],
  philosophy: optimal-equivalence
  footnotes:
