  - marker: b
    text: లేదా, “నా అవమానాన్ని నాకు వ్యతిరేకంగా వాదనగా వాడితే,” లేదా “నా అవమానాన్నే నాకు వ్యతిరేకంగా సాక్ష్యంగా చూపితే.” హీబ్రూ క్రియకు ఒక విషయాన్ని వాదించి నిరూపించడం లేదా కేసును స్థాపించడం అనే న్యాయపరమైన భావం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם אָמְנָם
  choice: నిజంగా ... చేస్తే
  rationale: אִם షరతును సూచిస్తుండగా, אָמְנָם దానికి నొక్కిచెప్పే భావాన్ని జోడిస్తుంది. తెలుగు షరతు క్రియారూపంతో పాటు ‘నిజంగా’ వాడటం ఈ రెండు అంశాలను సహజంగా తెలియజేస్తుంది.
- source_word: עָלַי
  choice: నాపై / నాకు వ్యతిరేకంగా
  rationale: రెండు చోట్లా ఈ ఉపసర్గ విరోధభావాన్ని సూచిస్తుంది. మొదటి క్రియతో ‘నాపై’, రెండవ క్రియతో మరింత స్పష్టంగా ‘నాకు వ్యతిరేకంగా’ అని అనువదించడం తెలుగులో సహజం.
- source_word: תַּגְדִּילוּ
  choice: మిమ్మల్ని మీరు గొప్ప చేసుకొని
  rationale: גדל హిఫీల్ రూపం ఇక్కడ యోబును తగ్గిస్తూ తమను తాము గొప్ప చేసుకోవడాన్ని సూచిస్తుంది. మూలంలోని ‘గొప్ప చేయడం’ అనే రూపకాన్ని అనువాదం నిలుపుతుంది.
- source_word: וְתוֹכִיחוּ
  choice: రుజువు చేస్తే
  rationale: יכח హిఫీల్‌కు వాదించడం, నిరూపించడం, ఒక కేసును స్థాపించడం వంటి న్యాయపరమైన భావాలు ఉన్నాయి. ‘రుజువు చేస్తే’ ఆ భావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: חֶרְפָּתִי
  choice: నా అవమానాన్ని
  rationale: חֶרְפָּה సామాజిక నింద, అవమానం, అపకీర్తి అనే భావాలను కలిగి ఉంటుంది. ఆధునిక తెలుగులో ‘అవమానం’ సహజంగా, విస్తృతంగా అర్థమవుతుంది.
