  yaml_path: translation/ot/job/019/003.yaml
  text: These ten times you have humiliated me[a]; you are not ashamed to wrong me.
translation:
  language: te
  text: ఇదిగో, పదిసార్లు మీరు నన్ను అవమానించారు; నాతో కఠినంగా ప్రవర్తించడానికి[a] మీరు సిగ్గుపడడం లేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నాకు అన్యాయం చేయడానికి,” “నన్ను పరాయివానిగా చూడడానికి.” ఇక్కడి హీబ్రూ క్రియ అర్థం నిర్ధారించడం కష్టం; యోబుతో అతడు పరాయివాడో లేదా గుర్తింపులేనివాడో అన్నట్లుగా ప్రవర్తించే భావం దీనిలో ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶה עֶשֶׂר פְּעָמִים
  choice: ఇలా పదిసార్లు
  rationale: సంఖ్యను యథాతథంగా ఉంచి, పదేపదే జరిగిన చర్యను లెక్కపెట్టి ఎత్తిచూపే యోబు ఫిర్యాదు బలాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: תַּכְלִימוּנִי
  choice: మీరు నన్ను అవమానించారు
  rationale: כלם హిఫీల్ రూపంలోని సిగ్గుపాలు చేయడం, అవమానించడం అనే కారక భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: לֹא תֵבֹשׁוּ
  choice: మీరు సిగ్గుపడడం లేదు
  rationale: בוש సూచించే సిగ్గు అనుభూతిని, వారిపై ఉన్న నైతిక నిందను సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: תַּהְכְּרוּ לִי
  choice: నాతో కఠినంగా ప్రవర్తించడానికి
  rationale: ఈ క్లిష్టమైన క్రియ సందర్భంలో పరాయివానితోనో గుర్తులేనివానితోనో వ్యవహరించినట్లు యోబుతో నిర్దయగా, దూరంగా వ్యవహరించే భావాన్ని కలిగి ఉండవచ్చు. ప్రధాన పాఠంలో అతిగా నిర్దిష్టం చేయకుండా సందర్భోచితమైన విస్తృత భావాన్ని ఇస్తుంది.
