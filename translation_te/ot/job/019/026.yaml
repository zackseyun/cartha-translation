  text: And after my skin has been destroyed[b][a], yet from my flesh I will see God.
translation:
  language: te
  text: నా చర్మం ఇలా నాశనమైన తరువాత కూడా,[b] నా శరీరం నుండి నేను దేవుణ్ణి చూస్తాను.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నా శరీరంలో నేను దేవుణ్ణి చూస్తాను’; మరో సాధ్యమైన అనువాదం, ‘నా శరీరం లేకుండా నేను దేవుణ్ణి చూస్తాను.’ హీబ్రూ పదబంధం క్లిష్టమైనది; దాన్ని ఒకటి కంటే ఎక్కువ విధాలుగా అర్థం చేసుకున్నారు.
    reason: alternative_reading
  - marker: b
    text: '‘నా చర్మం ఇలా నాశనమైన తరువాత’ అనే భాగం పాఠ్యపరంగానూ పదార్థపరంగానూ క్లిష్టమైనది. మరింత అక్షరార్థ అనువాదాలు: ‘వారు నా చర్మాన్ని కొట్టివేసిన తరువాత—ఇది.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַחַר
  choice: తరువాత కూడా
  rationale: కాలక్రమాన్ని తెలిపే ‘తరువాత’తో పాటు సందర్భంలోని ప్రతికూల పరిస్థితిని అధిగమించే భావాన్ని ‘కూడా’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: עוֹרִי
  choice: నా చర్మం
  rationale: עוֹר సాధారణంగా ‘చర్మం’ లేదా ‘తోలు’ అని అర్థం; మానవ శరీర సందర్భంలో ‘నా చర్మం’ సహజమైన, ప్రత్యక్షమైన అనువాదం.
- source_word: נִקְּפוּ זֹאת
  choice: ఇలా నాశనమైన
  rationale: ఈ పదబంధం పాఠ్యపరంగానూ పదార్థపరంగానూ క్లిష్టమైనది. సందర్భంలో యోబు చర్మం పాడైపోవడాన్ని సూచించేలా ‘ఇలా నాశనమైన’ అని అనువదించడం స్పష్టతనిస్తుంది; ‘ఇలా’ זֹאתను పూర్తిగా విడిచిపెట్టకుండా దాని సూచనాత్మక బలాన్ని నిలుపుతుంది.
- source_word: וּמִבְּשָׂרִי
  choice: నా శరీరం నుండి
  rationale: מִן యొక్క ప్రాథమిక భావమైన ‘నుండి’ని నిలుపుతూ, בָּשָׂרను ఈ సందర్భంలో సహజమైన తెలుగు పదమైన ‘శరీరం’గా ఇచ్చాం. ‘శరీరంలో’ లేదా ‘శరీరం లేకుండా’ అని నిర్ణయాత్మకంగా మార్చకుండా మూలంలోని సందిగ్ధతను కాపాడుతుంది.
- source_word: אֶחֱזֶה
  choice: నేను ... చూస్తాను
  rationale: חזה అంటే చూడడం లేదా దర్శించడం. ఆధునిక సాధారణ తెలుగులో ‘చూస్తాను’ స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: אֱלוֹהַּ
  choice: దేవుణ్ణి
  rationale: אֱלוֹהַּ యోబు గ్రంథంలో దేవునికి వాడిన ఏకవచన నామం/బిరుదు; ‘దేవుడు’ దానికి ప్రత్యక్షమైన సముచిత అనువాదం.
theological_decisions:
- issue: וּמִבְּשָׂרִי అనే పదబంధం శరీర పునరుత్థానాన్ని స్పష్టంగా బోధిస్తుందా?
  choice: ‘నా శరీరం నుండి’ అని అనువదించి వాక్యంలోని ఉద్రిక్తతను, సందిగ్ధతను నిలుపడం.
  alternative: ‘నా శరీరంలో’ లేదా ‘నా శరీరం లేకుండా’
  rationale: హీబ్రూ విభక్తి ప్రయోగం, వాక్యనిర్మాణం వివాదాస్పదమైనవి. ‘నా శరీరంలో’ అనేది శరీర పునరుత్థాన భావాన్ని మరింత స్పష్టంగా చేస్తుంది; ‘నా శరీరం లేకుండా’ అనేది శరీరరహిత దర్శనాన్ని సూచిస్తుంది. మూలపాఠం నిర్బంధించని సిద్ధాంత నిర్ణయాన్ని అనువాదంలో చేర్చకుండా ‘నుండి’ అనే మౌలిక భావాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘మాంసం’ కంటే మానవ దేహాన్ని సహజంగా సూచించే ‘శరీరం’ను ఎంచుకున్నాం; అయితే మూలంలోని శారీరక చిత్రణను, వ్యాఖ్యాన సందిగ్ధతను పాదసూచనలో నిలిపాం.
