source:
  edition: WLC
  text: מִֽי יִתֵּ֣ן אֵ֭פוֹ וְ/יִכָּתְב֣וּ/ן מִלָּ֑/י מִֽי יִתֵּ֖ן בַּ/סֵּ֣פֶר וְ/יֻחָֽקוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/019/023.yaml
  text: Oh[a], that now my words were written down! Oh[b], that they were inscribed in a book!
translation:
  language: te
  text: ఓ, నా మాటలు ఇప్పుడు వ్రాయబడితే ఎంత బాగుండును! ఓ, అవి ఒక గ్రంథంలో[a] శాశ్వతంగా లిఖించబడితే[b] ఎంత బాగుండును!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఒక చుట్టలో” లేదా “ఒక లిఖిత పత్రంలో”; హీబ్రూ పదం గ్రంథం, చుట్ట, లేదా లిఖిత పత్రాన్ని సూచించగలదు.
    reason: cultural_note
  - marker: b
    text: లేదా, “చెక్కబడితే”; ఈ క్రియ సాధారణంగా రాయడమే కాక, మన్నికగా చెక్కడం లేదా లిఖించడం అనే భావాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי יִתֵּן
  choice: ఎంత బాగుండును!
  rationale: ఈ హీబ్రూ ప్రయోగం అక్షరార్థ ప్రశ్న కాకుండా బలమైన కోరికను వ్యక్తం చేస్తుంది; తెలుగు ఆశార్థక ప్రయోగం దాని భావాన్ని సహజంగా అందిస్తుంది.
- source_word: אֵפוֹ
  choice: ఇప్పుడే
  rationale: ఈ కణం కోరికలోని తక్షణతను, భావోద్వేగ తీవ్రతను సూచిస్తుంది.
- source_word: וְיִכָּתְבוּן
  choice: రాయబడితే
  rationale: మూలంలోని కర్మణి భావాన్ని, కోరికను వ్యక్తం చేసే నిర్మాణాన్ని రెండింటినీ నిలుపుతుంది.
- source_word: מִלָּי
  choice: నా మాటలు
  rationale: బహువచన రూపానికి ప్రత్యక్షమైన, సహజమైన తెలుగు సమానం.
- source_word: בַּסֵּפֶר
  choice: ఒక గ్రంథంలో
  rationale: סֵפֶר గ్రంథం, చుట్ట, లేదా లిఖిత పత్రాన్ని సూచించగలదు; గంభీరమైన ఆధునిక తెలుగులో ‘గ్రంథం’ సందర్భానికి సరిపోతుంది.
- source_word: וְיֻחָקוּ
  choice: చెక్కబడితే
  rationale: חקק సాధారణంగా చెక్కడం లేదా శాశ్వతంగా లిఖించడం అనే భావాన్ని ఇస్తుంది; కేవలం నమోదు చేయడంకంటే మన్నికైన శాసన భావాన్ని నిలుపుతుంది.
