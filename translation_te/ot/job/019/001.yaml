- source_word: וַ
  choice: అప్పుడు
  rationale: మొదటి క్రియకు ముందున్న వావ్ కథన క్రమాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘అప్పుడు’ ఆ పురోగతిని సహజంగా వ్యక్తం చేస్తుంది.
