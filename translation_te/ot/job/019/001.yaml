  rationale: ענה అనే క్రియ ఈ సంభాషణాత్మక కథన సూత్రంలో ‘జవాబిచ్చాడు/ప్రతిస్పందించాడు’ అనే అర్థం ఇస్తుంది. ‘జవాబిచ్చాడు’ సహజమైన ఆధునిక తెలుగు ప్రయోగం.
