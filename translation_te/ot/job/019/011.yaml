    text: 'మరొక అనువాదం: “ఆయన కోపం నా మీద మండింది; ఆయన నన్ను తన విరోధులలో ఒకనిగా లెక్కించాడు.”'
    reason: חרה + אף నుడికారానికి ‘మండింది,’ మరియు חשבకు ‘లెక్కించాడు’ అనే సమీప ప్రత్యామ్నాయాలను సూచిస్తుంది.
lexical_decisions:
- source_word: וַיַּחַר עָלַי אַפּוֹ
  choice: ఆయన కోపం నా మీద రగులుకుంది
  rationale: חרה + אף అనే హీబ్రూ నుడికారం కోపం రగులుకోవడాన్ని సూచిస్తుంది. ‘రగులుకుంది’ మూలంలోని అగ్ని రూపకాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది; wayyiqtol రూపానికి అనుగుణంగా భూతకాలాన్ని వాడాం.
- source_word: וַיַּחְשְׁבֵנִי
  choice: ఆయన నన్ను … ఎంచాడు
  rationale: חשב ఇక్కడ ఒకరిని ఒక నిర్దిష్ట స్థితిలో ఉన్నవానిగా పరిగణించడం లేదా లెక్కించడం అనే భావం ఇస్తుంది. ‘ఎంచాడు’ అనే రూపం ఈ సందర్భంలో సహజంగా ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: לוֹ כְצָרָיו
  choice: తన శత్రువుల్లో ఒకడిగా
  rationale: అక్షరార్థంగా ‘తన శత్రువులవలె/తన శత్రువులలోనివానిగా’ అనే బహువచన భావం ఉంది. తెలుగులో ‘తన శత్రువుల్లో ఒకడిగా’ అనడం ఆ బహువచనాన్ని నిలుపుతూ, యోబును ఆ సమూహంలో ఒకడిగా పరిగణించిన భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: మూడవ పురుష కర్త మరియు ప్రత్యయాల నిర్దేశ్యం
  choice: కర్త దేవుడే; యోబు తనపై దేవుడు విరోధిగా వ్యవహరిస్తున్నాడని చెప్పే సందర్భాన్ని కొనసాగించాం.
  alternative: పేరు చెప్పని ఏదో విరోధి కర్తగా ఉండవచ్చు.
  rationale: యోబు 19:6-12 సందర్భంలో ఈ చర్యలను యోబు దేవునికే ఆపాదిస్తున్నాడు. అందువల్ల ఆ తీవ్రమైన వేదాంతపరమైన ఉద్రిక్తతను మృదువుచేయకుండా ‘ఆయన’ అని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యేలా గంభీరమైన కవితాత్మక శైలిని పాటించాం. ‘రగులుకుంది’ ద్వారా హీబ్రూ రూపకాన్ని, ‘శత్రువుల్లో ఒకడిగా’ ద్వారా మూలంలోని బహువచనాన్ని నిలిపాం.
