translation:
  language: te
  text: అయితే, దేవుడు నాకు అన్యాయం చేశాడని[a], తన వలతో[b] నన్ను చుట్టుముట్టాడని తెలుసుకోండి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నాతో అన్యాయంగా ప్రవర్తించాడు,’ లేదా ‘నాపట్ల న్యాయాన్ని వక్రీకరించాడు.’ హీబ్రూ క్రియ సరైనదాన్ని వంచడం లేదా వక్రీకరించడం అనే భావాన్ని కలిగి ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘తన ఉచ్చుతో,’ లేదా ‘తన వేటవలతో.’
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּעוּ
  choice: తెలుసుకోండి
  rationale: ידע క్రియ యొక్క బహువచన ఆజ్ఞారూపం; యోబు తన మాట వినేవారు ఒక విషయాన్ని గుర్తించాలని నేరుగా కోరుతున్నాడు.
- source_word: אֵפוֹ
  choice: కాబట్టి
  rationale: వాదనలో నిర్ధారణను, నొక్కిచెప్పడాన్ని సూచించే సంభాషణ అవ్యయం; ఈ సందర్భంలో ‘కాబట్టి’ సహజంగా ప్రవాహాన్ని తెలియజేస్తుంది.
- source_word: אֱלוֹהַּ
  choice: దేవుడు
  rationale: ఇది దేవునికి వాడిన ఏకవచన బిరుదు; ‘సర్వశక్తిమంతుడు’ వంటి మరింత నిర్దిష్టమైన బిరుదు ఇక్కడ లేదు.
- source_word: עִוְּתַנִי
  choice: నాకు అన్యాయం చేశాడు
  rationale: עות అనే క్రియ వంచడం, సరైనదాన్ని వక్రీకరించడం, అన్యాయం చేయడం అనే భావాలను మోస్తుంది. యోబు చేస్తున్న బలమైన నైతిక-న్యాయ ఆరోపణను సహజమైన తెలుగులో ఇది నిలుపుతుంది.
- source_word: מְצוּדוֹ
  choice: తన వలతో
  rationale: ఈ నామవాచకం వేటలో ఉపయోగించే వల లేదా ఉచ్చును సూచిస్తుంది. ‘వల’ రూపకాన్ని స్పష్టంగా, సంక్షిప్తంగా నిలుపుతుంది.
- source_word: הִקִּיף עָלַי
  choice: నన్ను చుట్టుముట్టాడు
  rationale: ఈ పదబంధం చుట్టూ ఆవరించడం లేదా దిగ్బంధించడం అనే భావాన్ని ఇస్తుంది; సాధనార్థకమైన ‘వలతో’ కలిపి తెలుగులో సహజంగా ఉంటుంది.
theological_decisions:
- issue: దేవునిపై యోబు చేసిన ఆరోపణ
  choice: ‘దేవుడు నాకు అన్యాయం చేశాడు’ అనే ప్రత్యక్ష ఆరోపణను యథాతథంగా నిలుపడం
  alternative: ‘దేవుడు నన్ను బాధించాడు’ లేదా ‘దేవుడు నాకు విరోధిగా మారాడు’
  rationale: హీబ్రూ క్రియలో వక్రీకరణ లేదా అన్యాయం అనే బలమైన భావం ఉంది. యోబు విలాపంలోని వేదాంతపరమైన ఉద్రిక్తతను తగ్గించకుండా అనువాదం నిలుపుతుంది; ఇది యోబు మాటను ప్రతిబింబిస్తుంది గాని అతని అంచనాను సిద్ధాంతపరంగా సమర్థించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘అన్యాయం చేశాడు’ ద్వారా మూలంలోని బలమైన ఆరోపణను మెత్తబరచకుండా నిలిపి, పాదటిప్పణుల్లో పదార్థ ప్రత్యామ్నాయాలను ఇచ్చాం. ప్రధాన వాక్యంలో ప్రతి పాదటిప్పణి గుర్తు చేర్చబడింది.
