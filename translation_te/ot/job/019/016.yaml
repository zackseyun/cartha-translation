  text: I call to my servant[a], but he does not answer[b]; I plead with him with my own mouth.
translation:
  language: te
  text: నేను నా సేవకుణ్ణి[a] పిలుస్తాను, కానీ అతడు జవాబివ్వడు[b]; నా సొంత నోటితోనే అతన్ని వేడుకుంటాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నా బానిసను.’ హీబ్రూ పదం עֶבֶד సందర్భానుసారం సేవకుణ్ణి లేదా బానిసను సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘నేను నా సేవకుణ్ణి పిలిచాను, కానీ అతడు జవాబివ్వలేదు; నా సొంత నోటితోనే అతన్ని వేడుకున్నాను.’ హీబ్రూ క్రియారూపాలను మరింత నికరంగా భూతకాలంలో కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְעַבְדִּי
  choice: నా సేవకుణ్ణి
  rationale: עֶבֶד అనే పదం సందర్భానుసారం సేవకుడు లేదా బానిసను సూచించవచ్చు. ఇక్కడ ఇంటి అధీన సేవకుడనే భావానికి సహజమైన ప్రధాన పాఠంగా ‘సేవకుడు’ను ఎంచుకుని, ‘బానిస’ను పాదటిప్పణిలో ఉంచాం.
- source_word: קָרָאתִי
  choice: పిలిచినా
  rationale: క్రియ సంపూర్ణ రూపంలో ఉన్నప్పటికీ, యోబు కొనసాగుతున్న దుస్థితిని సజీవంగా వర్ణించే కవితా సందర్భంలో వర్తమాన భావం సహజం. ‘పిలిచినా’ తరువాతి ప్రతిస్పందనలేమితో ఉన్న విరుద్ధతను తెలుగులో స్పష్టంగా చూపుతుంది.
- source_word: וְלֹא יַעֲנֶה
  choice: అతడు జవాబివ్వడు
  rationale: ענה అంటే జవాబివ్వడం లేదా స్పందించడం. అసంపూర్ణ క్రియారూపం ఇక్కడ ప్రస్తుత పరిస్థితిలో స్పందించకపోవడాన్ని తెలియజేస్తుంది; తప్పనిసరిగా భవిష్యత్తు నిరాకరణను కాదు.
- source_word: בְּמוֹ פִי
  choice: నా సొంత నోటితోనే
  rationale: ఈ పదబంధం యోబు స్వయంగా నేరుగా వేడుకోవలసి వచ్చిన అవమానాన్ని నొక్కిచెబుతుంది. ‘సొంత’ మరియు ‘నే’ ఆ ఉద్ఘాటనను సహజమైన తెలుగులో నిలుపుతాయి.
- source_word: אֶתְחַנֶּן לוֹ
  choice: అతణ్ణి వేడుకుంటాను
  rationale: חנן హిత్పయేల్ రూపం అనుగ్రహం కోరడం, వేడుకోవడం అనే భావాన్ని ఇస్తుంది. ‘వేడుకుంటాను’ మూలంలోని విన్నపాన్ని నిలుపుతూ, లేని ‘తప్పక/వలసి’ అనే విధ్యర్థాన్ని జోడించదు.
