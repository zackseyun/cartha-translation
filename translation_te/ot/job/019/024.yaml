translation:
  language: te
  text: ఇనుప చెక్కే కలంతోను సీసంతోను[a], అవి శాశ్వతంగా శిలలో చెక్కబడుగాక![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: సీసం ఇనుప పరికరంతోపాటు ఉపయోగించిన లోహాన్ని సూచించవచ్చు; చెక్కిన అక్షరాలు స్పష్టంగా కనిపించేందుకు వాటిలో సీసం నింపి ఉండవచ్చు. అయితే మూలపాఠం దీనిని స్పష్టంగా చెప్పదు.
    reason: cultural_note
  - marker: b
    text: లేదా, ‘అవి శాశ్వతంగా శిలలో తొలచబడుగాక!’ హీబ్రూ క్రియకు సాధారణంగా ‘తొలచు’ లేదా ‘కోసి తీయు’ అని అర్థం; ఇక్కడ మాటలను శాశ్వతంగా శిలలో లిఖించడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעֵט
  choice: చెక్కడపు కలంతో
  rationale: עֵט అనేది రాయడానికి లేదా చెక్కడానికి ఉపయోగించే పరికరం. ఇనుము, బండ అనే సందర్భం వల్ల సిరాతో రాసే కలం కాకుండా చెక్కే పరికరమే ఉద్దేశం; సాధారణ పాఠకునికి స్పష్టంగా ఉండేందుకు ‘చెక్కడపు కలం’ అని అనువదించాం.
- source_word: בַּרְזֶל
  choice: ఇనుప
  rationale: పరికరం తయారైన పదార్థాన్ని సూచించే సూటి అనువాదం.
- source_word: וְעֹפָרֶת
  choice: సీసంతో
  rationale: עֹפָרֶת అంటే సీసం అనే లోహం. అది ఎలా ఉపయోగించబడిందో మూలపాఠం స్పష్టంగా చెప్పనందున వివరణను పాఠ్యంలో చేర్చలేదు.
- source_word: לָעַד
  choice: శాశ్వతంగా
  rationale: దీర్ఘకాలికమైన, చెరిగిపోని స్థిరత్వాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בַּצּוּר
  choice: బండలో
  rationale: צוּר అంటే బండ లేదా శిల. అక్షరాలు ఉపరితలంలోకి కోయబడతాయి కాబట్టి בְ ఉపసర్గను ‘బండలో’ అని ప్రతిబింబించాం.
- source_word: יֵחָצְבוּן
  choice: చెక్కబడితే ఎంత బాగుంటుంది
  rationale: חצב సాధారణంగా ‘తొలచు/చెక్కు’ అని అర్థం. ఇక్కడ ముందరి వచనంలోని కోరిక కొనసాగుతోంది; అందువల్ల తెలుగు సహజ కోరిక నిర్మాణంతో భావాన్ని నిలిపాం.
