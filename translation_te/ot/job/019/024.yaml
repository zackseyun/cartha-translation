translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సామాన్య పాఠకునికి అర్థమయ్యే శైలిని ఉపయోగించాం. ‘స్టైలస్’ వంటి అరువు సాంకేతిక పదానికి బదులు ‘చెక్కడపు కలం’ ఎంచుకున్నాం. మూలంలోని పరికరం–సీసం సంబంధాన్ని స్పష్టీకరించకుండా ఉంచి, సాధ్యమైన సాంస్కృతిక వివరణను పాదటిప్పణిలో ఇచ్చాం.
