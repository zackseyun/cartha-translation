source:
  edition: WLC
  text: וְ/אַף אָמְנָ֥ם שָׁגִ֑יתִי אִ֝תִּ֗/י תָּלִ֥ין מְשׁוּגָתִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/019/004.yaml
  text: And even if I truly have gone astray[a], my error remains with me.
translation:
  language: te
  text: నేను నిజంగానే దారితప్పి ఉంటే కూడా[a], నా తప్పు నాతోనే ఉంటుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, మరింత అక్షరార్థంగా: “నా తప్పు నాతోనే బస చేస్తుంది.”'
    reason: לין అనే క్రియలోని ‘రాత్రి బసచేయు’ రూపకాన్ని చూపించే పదార్థ ప్రత్యామ్నాయం.
lexical_decisions:
- source_word: וְאַף אָמְנָם
  choice: నిజంగానే ... ఉంటే
  rationale: וְאַף యొక్క సందర్భానుసారమైన concessive భావాన్ని షరతురూపంలో, אָמְנָם యొక్క నొక్కిచెప్పే భావాన్ని ‘నిజంగానే’తో సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: שָׁגִיתִי
  choice: దారితప్పి
  rationale: שגה లోని తప్పుదారి పట్టడం లేదా పొరబడడం అనే రూపకార్థాన్ని నిలుపుతుంది; ‘పాపం చేసి’ అని అనువదిస్తే నైతిక అపరాధాన్ని మూలపాఠం కంటే ఎక్కువగా నిర్దిష్టం చేసినట్లవుతుంది.
- source_word: אִתִּי
  choice: నాతోనే
  rationale: ‘నాతో’ అనే సహజ అర్థాన్ని నిలుపుతూ, సందర్భంలోని ‘అది నా విషయమే’ అనే నొక్కును ‘నే’ ద్వారా తెలియజేస్తుంది.
- source_word: תָּלִין
  choice: ఉంటుంది
  rationale: లין అక్షరార్థంగా ‘రాత్రి బసచేయడం’; ఇక్కడ అది కొనసాగి ఉండడాన్ని సూచిస్తుంది. ‘ఉంటుంది’ సాధారణ పాఠకునికి సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: מְשׁוּגָתִי
  choice: నా తప్పు
  rationale: ఈ నామవాచకంలోని పొరపాటు/దారితప్పడం అనే అర్థాన్ని సంక్షిప్తంగా ఇస్తుంది; ‘నా పాపం’ అనడం భావాన్ని అతిగా నిర్దిష్టం చేస్తుంది.
theological_decisions:
- issue: యోబు తన తప్పును నిజంగా ఒప్పుకుంటున్నాడా, లేక ఊహాత్మకంగా అంగీకరిస్తున్నాడా?
  choice: ‘ఉంటే’ అనే concessive షరతురూపాన్ని నిలుపడం
  alternative: ‘నేను నిజంగా దారితప్పాను’ అనే నిశ్చయ వాక్యం
  rationale: וְאַף אָמְנָם సందర్భంలో ‘ఒకవేళ నిజంగా’ అనే concessive భావాన్ని అనుమతిస్తుంది. యోబు తన దోషాన్ని నిస్సందేహంగా ఒప్పుకున్నాడని నిర్ణయించకుండా మూలంలోని ఉద్రిక్తతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయినా యోబు వాదనకు తగిన గంభీరతతో రూపొందించబడింది. ప్రధాన వాక్యంలో సహజమైన ‘ఉంటుంది’ వాడి, మూలంలోని బసచేయడం అనే రూపకాన్ని పాదటిప్పణిలో నిలిపాం.
