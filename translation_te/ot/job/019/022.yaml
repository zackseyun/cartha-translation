  source_fidelity: 'మొదటి ప్రశ్న హీబ్రూ לָמָּה תִּרְדְּפֻנִי כְמוֹ אֵל ను విశ్వసనీయంగా ప్రతిబింబిస్తుంది: ‘వెంటాడుతున్నారు’ రదఫ్‌లోని శత్రుత్వపూర్వక తరుముడు రూపకాన్ని నిలుపుతుంది; ‘దేవునిలా’ సందర్భానుకూలమైన ప్రధాన పఠనం. రెండవ ప్రశ్నలో ‘నా మాంసంతో’ హీబ్రూ וּמִבְּשָׂרִי యొక్క తీవ్రమైన, రూపకాత్మక శరీర-చిత్రాన్ని కాపాడుతుంది. అయితే ‘ఇంకా’ అనే పదం మూలంలో స్పష్టంగా లేని కాలవ్యాప్తి/‘not yet’ భావాన్ని జతచేస్తుంది; దానిని తొలగించడం మరింత ఖచ్చితమైనది.'
