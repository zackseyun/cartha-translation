  text: לָ֭/מָּה תִּרְדְּפֻ֣/נִי כְמוֹ אֵ֑ל וּ֝/מִ/בְּשָׂרִ֗/י לֹ֣א תִשְׂבָּֽעוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/019/022.yaml
  text: Why do you pursue me like God[b][a], and are not satisfied with my flesh?
translation:
  language: te
  text: దేవునిలా[a] మీరెందుకు నన్ను వెంటాడుతున్నారు? నా మాంసంతో[b] మీకు తృప్తి కలగలేదా?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఒక దేవునిలా.” హీబ్రూ אֵל అనే పదానికి “దేవుడు,” “ఒక దేవుడు,” లేదా—ఇక్కడ తక్కువ సాధ్యతతో—“బలవంతుడు” అనే అర్థాలు రావచ్చు.
    reason: alternative_reading
  - marker: b
    text: అక్షరార్థంగా, “నా మాంసం నుండి.” యోబు మాంసాన్నే భక్షించినట్లు లేదా దోచుకున్నట్లు, అతని మీద ఎడతెగని శత్రుత్వాన్ని ఈ మాట బలమైన రూపకంగా చిత్రిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָּה
  choice: ఎందుకు
  rationale: యోబు నిరసనతో అడిగే కారణార్థక ప్రశ్నను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: תִּרְדְּפֻנִי
  choice: నన్ను వెంటాడుతున్నారు
  rationale: רדף అనే క్రియలోని వెంబడించడం, శత్రుత్వంతో తరుమడం అనే రూపక బలాన్ని నిలుపుతుంది; ‘హింసిస్తున్నారు’ కంటే మూలంలోని చిత్రాన్ని స్పష్టంగా కాపాడుతుంది.
- source_word: כְמוֹ
  choice: లా
  rationale: సరళమైన పోలికను తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: אֵל
  choice: దేవుడు
  rationale: సందర్భంలో యోబు తన స్నేహితుల నిర్దయను దేవుని వెంబడింపుతో పోలుస్తున్నాడనే సాధ్యమైన ప్రధాన అర్థాన్ని ప్రతిబింబిస్తుంది; పదంలోని ప్రత్యామ్నాయ అర్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: וּמִבְּשָׂרִי
  choice: నా మాంసంతో
  rationale: מן అనే విభక్తిని שבעతో కలిపి తృప్తి పొందే దానిని సూచించేలా గ్రహించి, యోబు మాంసాన్నే భక్ష్యంలా భావించే తీవ్ర రూపకాన్ని నిలుపుతుంది.
- source_word: לֹא תִשְׂבָּעוּ
  choice: మీకు ఇంకా తృప్తి కలగలేదా
  rationale: ‘తృప్తి చెందడం’ అనే שבע యొక్క అర్థాన్ని నిలుపుతూ, నిరంతర శత్రుత్వాన్ని ప్రశ్నించే తెలుగు అలంకారిక ప్రశ్నగా సహజంగా వ్యక్తం చేస్తుంది. ‘ఇంకా’ మూలంలోని అసంతృప్తి భావాన్ని తెలుగులో స్పష్టం చేస్తుంది.
theological_decisions:
- issue: כְמוֹ אֵל లో אֵל పదానికి సూచిత వ్యక్తి
  choice: దేవుడు
  alternative: ఒక దేవుడు; బలవంతుడు
  rationale: యోబు తన స్నేహితుల ప్రవర్తనను దైవిక దాడి లేదా తీర్పు తీవ్రతతో పోల్చుతున్న సందర్భంలో ‘దేవుడు’ అత్యంత సాధ్యమైన సూచన. అయినా אֵל పదానికి సాధారణంగా ‘ఒక దేవుడు,’ అరుదుగా ‘బలవంతుడు’ అనే అర్థాలు ఉండగలవు కాబట్టి అస్పష్టతను పాదసూచికలో నమోదు చేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన బహువచన సంబోధన వాడబడింది. ‘వెంటాడుతున్నారు’ మూలంలోని వేట/తరుముడు రూపకాన్ని, ‘మాంసం’ దాని శారీరక తీవ్రతను నిలుపుతున్నాయి. వాక్యాన్ని రెండు అనుసంధానిత ప్రశ్నలుగా ఇచ్చి తెలుగు పఠనసౌలభ్యాన్ని పెంచినా, హీబ్రూ వాక్యంలోని ఆరోపణాత్మక ఉద్వేగాన్ని కాపాడాం.
