source:
  edition: WLC
  text: אַ֭חַ/י מֵ/עָלַ֣/י הִרְחִ֑יק וְ֝/יֹדְעַ֗/י אַךְ זָ֥רוּ מִמֶּֽ/נִּי־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/019/013.yaml
  text: He has driven my brothers far from me[b][a], and those who know me are wholly estranged from me.
translation:
  language: te
  text: ఆయన నా సోదరులను నా నుండి దూరం చేశాడు[a]; నన్ను తెలిసినవారు నాకు పూర్తిగా పరాయివారయ్యారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆయన నా సోదరులను నా నుండి తొలగించాడు.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘నన్ను తెలిసినవారు నాకు అపరిచితులయ్యారు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחַי
  choice: నా సోదరులను
  rationale: ఇది ‘నా సహోదరులు’ అనే అక్షరార్థమున్న పుంలింగ బహువచన రూపం. బంధువులను విస్తృతంగా సూచించే అవకాశం ఉన్నప్పటికీ, మూలపదపు ప్రత్యక్షతను కాపాడేందుకు ‘నా సోదరులను’ ఎంచుకున్నాం.
- source_word: מֵעָלַי
  choice: నాకు దూరం
  rationale: הִרְחִיקతో కలిసి ఇది యోబు సమీపం లేదా సంబంధ పరిధి నుండి దూరం చేయడాన్ని సూచిస్తుంది.
- source_word: הִרְחִיק
  choice: దూరం చేశాడు
  rationale: ఈ హిఫీల్ క్రియ ‘దూరంగా ఉండేలా చేయు, తొలగించు’ అనే కారణార్థాన్ని ఇస్తుంది. ‘దూరం చేశాడు’ ఆ కారణార్థాన్నీ సంబంధ విరామాన్నీ సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: וְיֹדְעַי
  choice: నన్ను ఎరిగినవారు
  rationale: అక్షరార్థంగా ‘నన్ను తెలిసినవారు’ అని ఉన్న ఈ రూపం యోబుతో పరిచయం, అనుబంధం ఉన్నవారిని సూచిస్తుంది. ‘ఎరిగినవారు’ ప్రస్తుత ప్రామాణిక తెలుగులో గంభీరంగానూ స్పష్టంగానూ ఉంది.
- source_word: אַךְ
  choice: పూర్తిగా
  rationale: ఇక్కడ אַךְ తరువాతి స్థితి తీవ్రతను బలపరుస్తుంది; ‘పూర్తిగా’ వారి పరాయీకరణ సంపూర్ణతను వ్యక్తం చేస్తుంది.
- source_word: זָרוּ
  choice: పరాయివారయ్యారు
  rationale: ఈ క్రియ ‘పరాయివారిగా మారడం, దూరపడడం’ అనే ఫలిత స్థితిని సూచిస్తుంది. ‘పరాయివారయ్యారు’ దాని రూపకాన్నీ సంబంధ విరామాన్నీ నిలుపుతుంది.
- source_word: מִמֶּנִּי
  choice: నాకు
  rationale: మూలంలోని מן వియోగాన్ని సూచిస్తుంది. తెలుగులో ‘నాకు పరాయివారయ్యారు’ అనే సహజ నిర్మాణం ‘నా విషయంలో/నా నుండి వేరై పరాయివారయ్యారు’ అనే సంబంధ వియోగాన్ని తెలియజేస్తుంది.
theological_decisions:
- issue: הִרְחִיק క్రియలో అంతర్లీనంగా ఉన్న కర్త
  choice: ‘ఆయన’ అని సర్వనామంతోనే ఉంచడం
  alternative: ‘దేవుడు’ అని కర్తను స్పష్టంగా పేర్కొనడం
  rationale: హీబ్రూలో కర్త పేరు చెప్పకుండా మూడవ పురుష ఏకవచన క్రియ ఉంది. సమీప సందర్భం దేవుణ్ణి సూచించినా, వచనంలోని సంక్షిప్తతను మరియు యోబు ఆరోపణలోని ఉద్రిక్తతను నిలుపేందుకు ‘ఆయన’ అని మాత్రమే అనువదించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘ఎరిగినవారు’ సాధారణ ‘తెలిసినవారు’ కంటే కొద్దిగా గంభీరమైనదైనా సులభంగా అర్థమవుతుంది. హీబ్రూ సమాంతర నిర్మాణం, సంబంధ వియోగం, అంతర్లీన కర్త అన్నీ నిలుపబడ్డాయి.
