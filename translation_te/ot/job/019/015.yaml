  text: The guests in my house and my female servants count me as a stranger; I have become a foreigner in their eyes.
translation:
  language: te
  text: నా ఇంట్లో ఉండే అతిథులూ, నా దాసీలూ నన్ను పరాయివాడిగా పరిగణిస్తున్నారు; వారి దృష్టిలో నేను విదేశీయుడినయ్యాను.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גָּרֵי בֵיתִי
  choice: నా ఇంటి అతిథులు
  rationale: גֵּר సాధారణంగా పరదేశ నివాసి లేదా తాత్కాలికంగా నివసించేవాడిని సూచించవచ్చు. సందర్భంలో ఇంటిలో ఉన్న ఆధారితులు లేదా అతిథులు యోబును పరాయివాడిగా చూడటంలోని వ్యంగ్యాన్ని సహజమైన ఆధునిక తెలుగులో తెలిపేందుకు ‘అతిథులు’ ఎంచుకున్నాం.
- source_word: אַמְהֹתַי
  choice: నా దాసీలు
  rationale: אָמָה స్త్రీ సేవకురాలు లేదా దాసిని సూచిస్తుంది; సామాజిక సంబంధాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: לְזָר תַּחְשְׁבֻנִי
  choice: నన్ను పరాయివాడిగా ఎంచుతున్నారు
  rationale: זָר యొక్క ‘అపరిచితుడు/పరాయివాడు’ భావాన్ని, חשׁב యొక్క ‘గా పరిగణించు’ అర్థాన్ని నేరుగా ప్రతిబింబిస్తుంది.
- source_word: נָכְרִי הָיִיתִי בְעֵינֵיהֶם
  choice: వారి దృష్టిలో నేను విదేశీయుడినయ్యాను
  rationale: נָכְרִי అన్యదేశస్థుడు లేదా విదేశీయుడు అనే బలమైన దూరీకరణను సూచిస్తుంది; ‘వారి దృష్టిలో’ అనే హీబ్రూ ప్రయోగాన్ని సహజంగా నిలిపాం.
theological_decisions: []
