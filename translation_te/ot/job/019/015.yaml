  register: ఆధునిక ప్రామాణిక తెలుగు; యోబు అనుభవిస్తున్న సామాజిక పరాయీకరణను గంభీరంగా, స్పష్టంగా వ్యక్తం చేసే శైలి. మూలంలోని ‘పరాయివాడు’ మరియు ‘విదేశీయుడు’ అనే సమాంతర పదభేదం నిలుపబడింది.
