id: JOB.19.8
reference: Job 19:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אָרְחִ֣/י גָ֭דַר וְ/לֹ֣א אֶעֱב֑וֹר וְ/עַ֥ל נְ֝תִיבוֹתַ֗/י חֹ֣שֶׁךְ יָשִֽׂים׃
base_translation:
  language: en
  yaml_path: translation/ot/job/019/008.yaml
  text: He has walled up my way so that I cannot pass[a], and he has set darkness upon my paths.
translation:
  language: te
  text: నేను దాటిపోలేనట్లు నా దారికి అడ్డుగోడ కట్టాడు[a]; నా బాటలపై చీకటిని ఉంచుతాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రూలో కర్త పేరు స్పష్టంగా లేదు; క్రియారూపం ‘అతడు’ అని మాత్రమే సూచిస్తుంది. సందర్భంలో యోబు దేవుని గురించి మాట్లాడుతున్నాడు.
    reason: alternative_reading
lexical_decisions:
- source_word: אָרְחִי
  choice: నా దారి
  rationale: ఈ నామవాచకం దారి, మార్గం లేదా జీవనగమనాన్ని సూచించగలదు. ‘నా దారి’ తెలుగు పాఠకులకు సహజంగా ఉండి, ఇక్కడి ప్రత్యక్ష మరియు రూపకాలంకార భావాలు రెండింటినీ నిలుపుతుంది.
- source_word: גָדַר
  choice: అడ్డుగోడ కట్టాడు
  rationale: మూలక్రియ గోడ కట్టడం, కంచె వేయడం లేదా అడ్డగించడం అనే భావాన్ని ఇస్తుంది. ‘అడ్డుగోడ కట్టాడు’ కేవలం ‘అడ్డుకున్నాడు’ అనడం కంటే మూలంలోని స్పష్టమైన దృశ్యరూపాన్ని నిలుపుతుంది.
- source_word: וְלֹא אֶעֱבוֹר
  choice: నేను దాటిపోలేనట్లు
  rationale: అడ్డుగోడ వల్ల కలిగిన ఫలితాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; עבר అనే క్రియలోని ‘దాటిపోవడం’ భావాన్ని నేరుగా నిలుపుతుంది.
- source_word: נְתִיבוֹתַי
  choice: నా బాటలు
  rationale: మూలంలోని బహువచనాన్ని నిలుపుతూ, ప్రయాణ మార్గాలు లేదా జీవనగమనాలు అనే కవితాత్మక భావానికి సరిపోతుంది.
- source_word: חֹשֶׁךְ
  choice: చీకటి
  rationale: మూలపదానికి నేరమైన సమానార్థకం; యోబు కవిత్వంలో ప్రత్యక్ష చీకటి మరియు రూపకాలంకారమైన నిరాశ రెండింటినీ వ్యక్తం చేయగలదు.
- source_word: יָשִׂים
  choice: పరచాడు
  rationale: మూలక్రియ ‘పెట్టడం/ఉంచడం’ అని అర్థమిచ్చినా, బాటలపై చీకటిని ఉంచడం అనే చిత్రాన్ని సహజమైన కవితాత్మక తెలుగులో ‘పరచాడు’ స్పష్టంగా అందిస్తుంది.
theological_decisions:
- issue: మూడవ పురుష ఏకవచన కర్త ఎవరనేది
  choice: దేవుని పేరు చేర్చకుండా, ‘కట్టాడు/పరచాడు’ అనే పురుష ఏకవచన క్రియారూపాల ద్వారా అంతర్నిహితమైన ‘అతడు’ను నిలుపడం
  alternative: ‘దేవుడు’ లేదా ‘యెహోవా’ అని కర్తను స్పష్టంగా పేర్కొనడం
  rationale: హెబ్రూ వాక్యంలో కర్త పేరు ప్రత్యక్షంగా లేదు; క్రియారూపమే పురుష ఏకవచన కర్తను సూచిస్తుంది. సందర్భంలో యోబు దేవుని గురించి మాట్లాడుతున్నప్పటికీ, ఈ వచనంలో లేని దైవనామాన్ని చేర్చకుండా సాహిత్య ప్రవాహం మరియు మూలంలోని పరోక్షతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే యోబు కవిత్వానికి తగిన గంభీరతతో అనువదించబడింది. ‘అడ్డుగోడ’ మరియు ‘చీకటిని పరచాడు’ అనే పదబంధాలు మూలంలోని కవితాత్మక దృశ్యాలను సహజంగా నిలుపుతాయి.
