revisions:
- from: నేను దాటిపోలేనట్లు నా దారికి అడ్డుగోడ కట్టాడు[a]; నా బాటలపై చీకటిని పరచాడు.
  to: నేను దాటిపోలేనట్లు నా దారికి అడ్డుగోడ కట్టాడు[a]; నా బాటలపై చీకటిని ఉంచుతాడు.
  rationale: Only the rendering of יָשִׂים has been adjusted. The revision preserves the Hebrew's ‘set/place darkness’ image and its imperfect form, while retaining the draft's natural Telugu wording, poetic register, and the source text's implicit subject.
