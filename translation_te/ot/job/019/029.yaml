id: JOB.19.29
reference: Job 19:29
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: גּ֤וּרוּ לָ/כֶ֨ם מִ/פְּנֵי חֶ֗רֶב כִּֽי חֵ֭מָה עֲוֺנ֣וֹת חָ֑רֶב לְמַ֖עַן תֵּדְע֣וּ/ן ש/דין׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/job/019/029.yaml
  text: Be afraid of the sword yourselves[a], for wrath brings the punishments of the sword, so that you may know that there is judgment.
translation:
  language: te
  text: మీరే ఖడ్గానికి భయపడండి[a]; ఎందుకంటే ఉగ్రకోపం ఖడ్గపు శిక్షలను తెస్తుంది, మీరు తీర్పు ఉందని తెలుసుకొనేలా.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సర్వశక్తుడు ఉన్నాడని.” చివరి హీబ్రూ పదబంధం క్లిష్టమైనది; దానిని “తీర్పులు ఉన్నాయని” లేదా “న్యాయాధిపతి ఉన్నాడని” అని కూడా అర్థం చేసుకున్నారు.
    reason: alternative_reading
lexical_decisions:
- source_word: גּוּרוּ לָכֶם
  choice: మీరే ... భయపడండి
  rationale: బహువచన ఆజ్ఞలోని హెచ్చరిక బలాన్ని, לָכֶם ఇచ్చే ఉద్ఘాటనను సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: מִפְּנֵי חֶרֶב
  choice: ఖడ్గానికి
  rationale: ఖడ్గం కారణంగా కలగవలసిన భయాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది; ‘ఖడ్గం ఎదుట’ అనే మరింత అక్షరార్థ రూపం ఇక్కడ అసహజంగా ఉంటుంది.
- source_word: חֵמָה
  choice: ఉగ్రకోపం
  rationale: మండే కోపం లేదా ఆగ్రహం అనే భావాన్ని స్పష్టంగా ఉంచుతుంది; సందర్భంలోని న్యాయతీర్పు స్వరాన్ని కూడా నిలుపుతుంది.
- source_word: עֲוֺנוֹת חָרֶב
  choice: ఖడ్గం విధించే శిక్షలు
  rationale: עֲוֺנוֹת సాధారణంగా ‘దోషాలు/అక్రమాలు’ అని అర్థమయ్యే అవకాశం ఉన్నా, ఇక్కడ ఖడ్గంతో ముడిపడిన దోషఫలాలు లేదా శిక్షలు అనే సందర్భోచిత భావాన్ని ఇస్తుంది. ‘విధించే’ అనే పదం సంక్షిప్త హీబ్రూ సంబంధాన్ని తెలుగులో అర్థవంతం చేస్తుంది.
- source_word: לְמַעַן תֵּדְעוּן
  choice: అప్పుడు ... మీరు తెలుసుకుంటారు
  rationale: లక్ష్యం లేదా ఫలితాన్ని సూచించే భావాన్ని సహజ తెలుగులో అందిస్తుంది; హీబ్రూ ఉద్దేశార్థాన్ని కఠినంగా కాకుండా స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: שדין
  choice: తీర్పు ఉందని
  rationale: కష్టమైన అంతిమ రూపానికి సందర్భంలో న్యాయతీర్పు అనే భావం బాగా సరిపోతుంది; అయితే ఇతర ప్రాచీన/పండిత అవగాహనలను పాదసూచికలో నిలుపుతుంది.
theological_decisions:
- issue: కష్టమైన చివరి పదబంధం שדין యొక్క అర్థం
  choice: తీర్పు ఉందని
  alternative: ‘సర్వశక్తుడు ఉన్నాడని,’ ‘తీర్పులు ఉన్నాయని,’ లేదా ‘న్యాయాధిపతి ఉన్నాడని’
  rationale: హీబ్రూ రూపం పాఠపరంగాను పదార్థపరంగాను క్లిష్టమైనది. యోబు తన స్నేహితులు ప్రతిఫల న్యాయానికి లోబడతారని హెచ్చరించే సందర్భంలో ‘తీర్పు’ ప్రధాన పాఠానికి సరిపోతుంది; అయినా వేదాంతపరంగా ప్రాముఖ్యమైన ప్రత్యామ్నాయాలను మౌనంగా తొలగించకుండా పాదసూచికలో భద్రపరుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన హెచ్చరిక స్వరం. ‘ఖడ్గం’ బైబిలు సందర్భానికి తగిన గౌరవప్రదమైన పదం; వాక్య నిర్మాణం సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా విభజించబడింది.
