id: JOB.19.25
reference: Job 19:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/אֲנִ֣י יָ֭דַעְתִּי גֹּ֣אֲלִ/י חָ֑י וְ֝/אַחֲר֗וֹן עַל עָפָ֥ר יָקֽוּם־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/019/025.yaml
  text: But as for me[a], I know that my Redeemer lives[c][b], and afterward he will rise over the dust.
translation:
  language: te
  text: అయితే నా విషయానికొస్తే, నా విమోచకుడు[a] జీవించి ఉన్నాడని నాకు తెలుసు; చివరికి ఆయన ధూళిపై[c] నిలబడతాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నా పక్షాన న్యాయం జరిగేలా చేసేవాడు.’ హీబ్రూ גֹּאֵל అనే పదం బంధువు కోసం విమోచన కలిగించే, అతని పక్షాన నిలిచే లేదా అతనికి న్యాయం జరిగేలా చేసే వ్యక్తిని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘చివరివాడిగా ఆయన ధూళిపై నిలబడతాడు.’ ఈ క్లిష్టమైన హీబ్రూ వాక్యభాగాన్ని ‘చివరికి ఆయన భూమిపై నిలబడతాడు’ అని కూడా అర్థం చేసుకున్నారు.
    reason: alternative_reading
  - marker: c
    text: ‘ధూళి’ మరణశీలతను, సమాధిని లేదా భూమిని మనసుకు తెచ్చవచ్చు; హీబ్రూలో అక్షరార్థం ‘ధూళి.’
    reason: cultural_note
lexical_decisions:
- source_word: וַאֲנִי
  choice: అయితే నా విషయానికొస్తే
  rationale: స్వతంత్ర సర్వనామం సందర్భంలో నొక్కిచెప్పే, వ్యతిరేక భావాన్ని కలిగిస్తుంది; ఈ తెలుగు ప్రయోగం యోబు వ్యక్తిగత నిశ్చయాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: יָדַעְתִּי
  choice: నాకు తెలుసు
  rationale: పూర్తయిన క్రియారూపం ఇక్కడ వర్తమాన ప్రాముఖ్యతగల స్థిర నిశ్చయాన్ని సూచిస్తుంది.
- source_word: גֹּאֲלִי
  choice: నా విమోచకుడు
  rationale: గోయేలు కుటుంబ సభ్యుని విడిపించే, రక్షించే లేదా అతని పక్షాన న్యాయం జరిగేలా చేసే వ్యక్తి కావచ్చు. ‘విమోచకుడు’ పదం ఈ విస్తృత భావపరిధినీ సంప్రదాయపరమైన బరువునీ నిలుపుతుంది.
- source_word: חָי
  choice: సజీవుడు
  rationale: హీబ్రూ విధేయ విశేషణాన్ని తెలుగులో సహజమైన నామవాచక విధేయంగా అందించి, ఆయన జీవించి ఉన్నాడనే కొనసాగుతున్న వాస్తవాన్ని తెలియజేస్తుంది.
- source_word: וְאַחֲרוֹן
  choice: ఆ తరువాత
  rationale: ఈ రూపాన్ని క్రియావిశేషణంగానూ, ‘చివరివాడు’ అనే నామవాచక భావంగానూ అర్థం చేసుకోవచ్చు. ‘ఆ తరువాత’ ప్రధాన పాఠ్యంలో అవసరానికి మించిన అంత్యకాల నిర్దిష్టతను మోపదు.
- source_word: עַל עָפָר
  choice: ధూళిపై
  rationale: עָפָר ను ‘ధూళి’గా అక్షరార్థంలో ఉంచి, అది భూమినో సమాధినో మరణశీలతనో సూచిస్తుందా అనే ప్రశ్నను తెరిచి ఉంచుతుంది; עַל యొక్క స్థలసంబంధ భావాన్ని ‘పై’ సహజంగా తెలియజేస్తుంది.
- source_word: יָקוּם
  choice: లేచి నిలబడతాడు
  rationale: קום లోని ‘లేచుట/నిలబడుట’ భావపరిధిని తెలుగు సంయుక్త ప్రయోగం సహజంగా నిలుపుతూ, దానిని న్యాయస్థాన దృశ్యంగా గానీ పునరుత్థానంగా గానీ మాత్రమే నిర్ధారించదు.
theological_decisions:
- issue: యోబు చెప్పిన גֹּאֵל యొక్క గుర్తింపు, పాత్ర
  choice: ఎవరిని సూచిస్తున్నాడో నిర్దిష్టంగా చెప్పకుండా ‘నా విమోచకుడు’ అని విస్తృతంగా అనువదించడం
  alternative: నా పక్షాన న్యాయం జరిగేలా చేసేవాడు; నా బంధు-విమోచకుడు
  rationale: హీబ్రూ పాఠ్యం ఈ వ్యక్తి దేవుడేనా, పరలోక సాక్షినా, మెస్సీయగా అర్థం చేసుకున్న విమోచకుడా అని స్పష్టంగా నిర్ధారించదు. అందువల్ల అనువాదం వేదాంతపరమైన ప్రతిధ్వనిని నిలిపి, ఆ ఉద్రిక్తతను పరిష్కరించకుండా ఉంచుతుంది.
- issue: וְאַחֲרוֹן ... יָקוּם యొక్క అంత్యకాల భావం
  choice: ‘ఆ తరువాత ఆయన ధూళిపై లేచి నిలబడతాడు’
  alternative: ‘చివరికి ఆయన భూమిపై నిలబడతాడు’; ‘చివరివాడిగా ఆయన ధూళిపై నిలబడతాడు’
  rationale: ఈ వాక్యభాగపు వాక్యనిర్మాణం, వేదాంతార్థం వివాదాస్పదం. ప్రధాన పాఠ్యం స్పష్టమైన పునరుత్థాన సూత్రాన్ని దిగుమతి చేయకుండా ఉండగా, ప్రధాన ప్రత్యామ్నాయాలను పాదసూచనలో ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనా సాధారణ పాఠకులకు సులభంగా ఉండే శైలి. ‘విమోచకుడు’ సంప్రదాయ ప్రతిధ్వనిని నిలుపుతుంది; పాదసూచనలు పదార్థ, వాక్యనిర్మాణ అనిశ్చితులను స్పష్టంగా భద్రపరుస్తాయి.
