revisions:
- from: అయితే నా విషయానికొస్తే, నా విమోచకుడు[a] సజీవుడని నాకు తెలుసు; ఆ తరువాత ఆయన ధూళిపై[c] లేచి నిలబడతాడు[b].
  to: అయితే నా విషయానికొస్తే, నా విమోచకుడు[a] జీవించి ఉన్నాడని నాకు తెలుసు; చివరికి ఆయన ధూళిపై[c] నిలబడతాడు[b].
  rationale: 'The revision follows the Hebrew more closely at the two disputed points while preserving their ambiguity: וְאַחֲרוֹן is rendered ‘చివరికి,’ with the substantival alternative in the note, and יָקוּם is rendered with one Telugu verb rather than an expanded double action. It neither identifies the Redeemer nor turns the verse into an explicit doctrinal statement about resurrection. Footnote anchors remain attached to the relevant terms and clause.'
