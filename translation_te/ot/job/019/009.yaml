  yaml_path: translation/ot/job/019/009.yaml
  text: He has stripped my honor from me and removed the crown from my head[a].
translation:
  language: te
  text: నామీదనున్న నా గౌరవాన్ని ఆయన ఒలిచివేశాడు; నా తలపైని కిరీటాన్ని తొలగించాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నా గౌరవం’కు బదులు ‘నా మహిమ’ లేదా ‘నా ఘనత’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּבוֹדִי
  choice: నా గౌరవాన్ని
  rationale: כָּבוֹד అనే పదం గౌరవం, మహిమ, ఘనత లేదా సామాజిక స్థాయిని సూచించగలదు. యోబు అవమానాన్ని వర్ణిస్తున్న ఈ సందర్భంలో ‘గౌరవం’ సహజంగా ఉండి, అతడు కోల్పోయిన ప్రతిష్ఠను స్పష్టంగా తెలియజేస్తుంది.
- source_word: מֵעָלַי
  choice: నా మీదనుండి
  rationale: అక్షరార్థంగా ‘నా మీదనుండి’ అనే భావం. ఒలిచివేయడం అనే వస్త్రరూపకంతో ఇది సహజంగా కలిసివచ్చి, మూలపాఠంలోని దృశ్యాన్ని నిలుపుతుంది.
- source_word: הִפְשִׁיט
  choice: ఒలిచివేశాడు
  rationale: ఈ క్రియ వస్త్రాన్ని లేదా కప్పి ఉన్నదాన్ని ఒలిచివేయడాన్ని సూచిస్తుంది. గౌరవాన్ని వస్త్రంలా తీసివేసిన సజీవ రూపకాన్ని ‘ఒలిచివేశాడు’ నిలుపుతుంది.
- source_word: וַיָּסַר
  choice: తొలగించాడు
  rationale: హిఫీల్ రూపంలో ‘తీసివేయడం, తొలగించడం’ అనే అర్థం. మొదటి పాదంలోని బలవంతపు తొలగింపు భావానికి సమాంతరంగా ఉంటుంది.
- source_word: עֲטֶרֶת
  choice: కిరీటాన్ని
  rationale: ఈ నామవాచకం గౌరవం లేదా హోదాకు చిహ్నమైన కిరీటాన్ని లేదా పుష్పమాలను సూచించగలదు. ఇక్కడ ‘కిరీటం’ రూపకాన్ని స్పష్టంగా, సహజంగా అందిస్తుంది.
- source_word: רֹאשִׁי
  choice: నా తలపైని
  rationale: మూలంలో ‘నా తల’ అని ఉన్నప్పటికీ, తెలుగులో కిరీటాన్ని తొలగించే దృశ్యాన్ని సహజంగా వ్యక్తం చేయడానికి ‘నా తలపైని’ అని అనువదించబడింది.
theological_decisions:
- issue: పేరు చెప్పని కర్త ఎవరు?
  choice: ‘ఆయన’ అనే సర్వనామాన్ని ఉంచి, సందర్భానుసారం దేవుణ్ణి సూచించనివ్వడం.
  alternative: ‘దేవుడు’ అని నేరుగా పేర్కొనడం; లేదా ఒక నిర్దిష్టం కాని విరోధి/పరిస్థితిగా గ్రహించడం.
  rationale: సమీప సందర్భంలో యోబు తనకు జరిగిన దానిని దేవునికే ఆపాదిస్తున్నాడు. అయినా హీబ్రూ పాఠం ఇక్కడ దేవుని పేరును నేరుగా చెప్పకుండా పురుష ఏకవచన కర్తను మాత్రమే వాడుతుంది. అందువల్ల ‘ఆయన’ అని ఉంచడం మూలంలోని సంక్షిప్తతను, theological tensionను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనా సామాన్య పాఠకులకు అర్థమయ్యే శైలి. ‘ఒలిచివేశాడు’ అనే పదం మూలంలోని వస్త్రరూపకాన్ని నిలుపుతుంది; ‘నా తలపైని కిరీటం’ సహజ తెలుగు పదక్రమాన్ని అనుసరిస్తుంది.
