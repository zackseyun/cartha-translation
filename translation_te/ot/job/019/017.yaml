  text: My breath is repulsive to my wife[b][a], and I am loathsome to the sons of my own body.
translation:
  language: te
  text: నా భార్యకు నా ఊపిరి అసహ్యంగా ఉంది; నా శరీరసంబంధులైన కుమారులకు[b] నేను అసహ్యుడిని.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'క్లిష్టమైన హీబ్రూ పదబంధానికి మరో అర్థం: “నా వేడుకోలు నా శరీరసంబంధులైన కుమారులకే” లేదా “కనికరం చూపమని నా శరీరసంబంధులైన కుమారులను వేడుకుంటున్నాను.”'
    reason: alternative_reading
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా, “నా ఉదరపు కుమారులు.” ఈ నుడికారం యోబు సొంత పిల్లలను లేదా, మరింత సాధారణంగా, అతని దగ్గరి రక్తసంబంధులను సూచించవచ్చు.
    reason: cultural_note
lexical_decisions:
- source_word: רוּחִי
  choice: నా ఊపిరి
  rationale: רוּחַ అనే పదానికి ‘గాలి,’ ‘ఆత్మ,’ ‘ఊపిరి’ అనే అర్థాలు ఉండగలవు. భార్యకు కలిగిన శారీరక విరక్తిని తెలిపే ఈ సందర్భంలో ‘ఊపిరి’ అత్యంత సహజమైన అర్థం.
- source_word: זָרָה
  choice: అసహ్యంగా ఉంది
  rationale: ఈ రూపం ప్రాథమికంగా పరాయి లేదా విచిత్రమైనదిగా ఉండడాన్ని సూచించినా, ఇక్కడ సంబంధంలో కలిగిన విరక్తిని తెలియజేస్తుంది. అందువల్ల ఆధునిక తెలుగులో ‘అసహ్యంగా ఉంది’ సందర్భార్థాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: לְאִשְׁתִּי
  choice: నా భార్యకు
  rationale: לְ ఉపసర్గ ప్రభావిత వ్యక్తిని సూచిస్తుంది; తెలుగు వాక్యనిర్మాణంలో ‘నా భార్యకు’ సహజంగా ఉంటుంది.
- source_word: וְחַנֹּתִי
  choice: నేను అసహ్యంగా ఉన్నాను
  rationale: ఈ క్లిష్టమైన రూపాన్ని కనికరం కోసం వేడుకోవడంగా కూడా అర్థం చేసుకోవచ్చు. అయితే మొదటి పాదంతో ఉన్న సమాంతరతను బట్టి సామాజిక విరక్తిని తెలిపే ‘నేను అసహ్యంగా ఉన్నాను’ అనే భావాన్ని ప్రధాన పాఠ్యంలో ఉంచి, ప్రత్యామ్నాయ అర్థాన్ని పాదసూచికలో కాపాడాం.
- source_word: לִבְנֵי בִטְנִי
  choice: నా కడుపు కుమారులకు
  rationale: ఇది అక్షరార్థంగా ‘నా కడుపు కుమారులు’ అనే శారీరక బంధుత్వ నుడికారం. మూలంలోని రూపకాన్ని నిలిపి, అది సొంత పిల్లలనో దగ్గరి రక్తసంబంధులనో సూచించవచ్చని పాదసూచికలో వివరించాం.
theological_decisions:
- issue: וְחַנֹּתִי అనే క్లిష్ట రూపం
  choice: మొదటి పాదానికి సమాంతరంగా యోబు ఇతరులకు అసహ్యంగా ఉన్నాడనే అర్థం
  alternative: ‘నా వేడుకోలు నా కడుపు కుమారులవైపు ఉంది’ లేదా ‘నా కడుపు కుమారులను కనికరం కోసం వేడుకుంటున్నాను’
  rationale: హీబ్రూ రూపం అనిశ్చితమైనది. సందర్భంలోని విరక్తి భావం ప్రధాన ఎంపికకు మద్దతిచ్చినా, వేడుకోలు అనే వ్యుత్పత్తిసాధ్యమైన అర్థాన్ని తొలగించకుండా పాదసూచికలో ఇచ్చాం.
- issue: ‘నా కడుపు కుమారులు’ ఎవరిని సూచిస్తారు?
  choice: మూలంలోని బంధుత్వ నుడికారాన్ని ప్రధాన పాఠ్యంలో నిలిపివేయడం
  alternative: ‘నా సొంత పిల్లలు’ లేదా ‘నా దగ్గరి రక్తసంబంధులు’ అని స్పష్టీకరించడం
  rationale: యోబు కథా సందర్భం వల్ల ఖచ్చితమైన సూచితులు ఎవరో నిర్ణయించడం కష్టం. అందువల్ల వ్యాఖ్యానపరంగా ఒకే గుర్తింపును బలవంతంగా విధించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన శైలిని వాడాం. ‘నా కడుపు కుమారులు’ సాధారణ తెలుగులో కొంత అసాధారణంగా వినిపించినా, మూలంలోని శారీరక బంధుత్వ చిత్రాన్ని మరియు దాని నిజమైన అనిశ్చితిని నిలిపేందుకు ఉద్దేశపూర్వకంగా ఉంచాం.
