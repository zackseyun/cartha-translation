source:
  edition: WLC
  text: וַ/יְהִ֣י הַ/יּ֔וֹם וַ/יָּבֹ֨אוּ֙ בְּנֵ֣י הָ/אֱלֹהִ֔ים לְ/הִתְיַצֵּ֖ב עַל יְהוָ֑ה וַ/יָּב֥וֹא גַֽם הַ/שָּׂטָ֖ן בְּ/תוֹכָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/001/006.yaml
  text: There was a day when the sons of God came to present themselves before Yahweh[b][a], and the Adversary also came among them.
translation:
  language: te
  text: ఒక రోజు, దేవుని కుమారులు[a] యహ్వే ఎదుట హాజరుకావడానికి వచ్చారు; విరోధి[b] కూడా వారి మధ్యకు వచ్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “దేవుని కుమారులు” అనే పదబంధం దివ్యసభలోని పరలోక జీవులను సూచించవచ్చు.
    reason: cultural_note
  - marker: b
    text: సంప్రదాయంగా, “సాతాను.” హీబ్రూలో “విరోధి” అనే పదానికి నిర్దిష్ట ఉపపదం ఉంది; కాబట్టి ఇక్కడ అది వ్యక్తినామంగా కాక బిరుదుగా లేదా పాత్రపేరుగా పనిచేస్తుండవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי הַיּוֹם
  choice: ఒక రోజు
  rationale: ఈ హీబ్రూ కథన సూత్రం కొత్త దృశ్యాన్ని పరిచయం చేస్తుంది. ‘ఒక రోజు’ ఆధునిక తెలుగులో సహజంగా ఉండి, మూలంలోని కాలసూచనను అనవసరమైన వివరణ లేకుండా అందిస్తుంది.
- source_word: בְּנֵי הָאֱלֹהִים
  choice: దేవుని కుమారులు
  rationale: హీబ్రూ పదబంధాన్ని సన్నిహితంగా నిలుపుతూ, వీరు పరలోక జీవులా లేదా దివ్యసభ సభ్యులా అనే భావవ్యాఖ్యానాన్ని ప్రధాన పాఠ్యంలో ఖరారు చేయదు.
- source_word: לְהִתְיַצֵּב עַל יְהוָה
  choice: యెహోవా ఎదుట హాజరయ్యేందుకు
  rationale: ఉన్నతాధికారి సమక్షంలో వచ్చి నిలబడడం లేదా తనను తాను సమర్పించుకోవడం అనే సందర్భార్థాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని సాధారణ తెలుగు బైబిలు పాఠకులకు పరిచితమైన లిప్యంతరీకరణలో వ్యక్తిగత నామంగా నిలుపుతుంది.
- source_word: הַשָּׂטָן
  choice: విరోధి
  rationale: హీబ్రూలో నిర్దిష్ట ఉపపదంతో ఉన్న ఈ పదం ఇక్కడ వ్యక్తినామం కంటే పాత్రను లేదా బిరుదును సూచించవచ్చు. ‘విరోధి’ దాని మౌలిక భావాన్ని కాపాడుతుంది.
- source_word: בְּתוֹכָם
  choice: వారితోపాటు
  rationale: ఆ సమూహంలో అతడూ ఉన్నాడనే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: הַשָּׂטָן అనే పదాన్ని వ్యక్తినామంగా అనువదించాలా, పాత్రబిరుదుగా అనువదించాలా
  choice: విరోధి
  alternative: సాతాను; నిందారోపకుడు
  rationale: నిర్దిష్ట ఉపపదం కారణంగా ఇది ఇక్కడ స్థిరమైన వ్యక్తినామం కాక పాత్రబిరుదుగా పనిచేసే అవకాశం ఉంది. అందువల్ల ప్రధాన పాఠ్యం ‘విరోధి’ అని ఉంచి, సంప్రదాయ రూపాన్ని పాదసూచికలో ఇస్తుంది.
- issue: בְּנֵי הָאֱלֹהִים అనే పదబంధాన్ని వ్యాఖ్యానించి అనువదించాలా
  choice: దేవుని కుమారులు
  alternative: పరలోక జీవులు; దివ్య జీవులు
  rationale: ఈ పదబంధం దివ్యసభలోని పరలోక జీవులను సూచించే అవకాశం ఉన్నప్పటికీ, మూలంలోని రూపకాన్నీ భావసందిగ్ధతనూ ప్రధాన పాఠ్యంలో నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘దేవుని కుమారులు’ మరియు ‘విరోధి’ అనే రూపాలు మూలంలోని దైవశాస్త్ర సంబంధిత ఉద్రిక్తతను వ్యాఖ్యానంతో తొలగించకుండా నిలుపుతాయి.
