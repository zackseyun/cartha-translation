source:
  edition: WLC
  text: וַ/יָּ֤קָם אִיּוֹב֙ וַ/יִּקְרַ֣ע אֶת מְעִל֔/וֹ וַ/יָּ֖גָז אֶת רֹאשׁ֑/וֹ וַ/יִּפֹּ֥ל אַ֖רְצָ/ה וַ/יִּשְׁתָּֽחוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/001/020.yaml
  text: Then Job rose[a], tore his robe, shaved his head, fell to the ground, and bowed down.
translation:
  language: te
  text: అప్పుడు యోబు లేచి, తన పైవస్త్రాన్ని చింపుకొని, తల వెంట్రుకలు కత్తిరించుకొని, నేలపై పడి, సాష్టాంగ నమస్కారం చేశాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వంగి నమస్కరించాడు.’ ఈ హీబ్రూ క్రియ శరీరాన్ని నేలవైపు వంచడాన్ని సూచిస్తుంది; అది తరచుగా భక్తి లేదా ఆరాధన చర్యగా ఉంటుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: లేచి
  rationale: קום అనే క్రియ యొక్క కథన క్రమరూపం తదుపరి చర్యను సూచిస్తుంది; ‘లేచి’ సహజమైన, సంక్షిప్తమైన తెలుగు ప్రయోగం.
- source_word: וַיִּקְרַע אֶת מְעִילוֹ
  choice: తన పైవస్త్రాన్ని చింపుకొని
  rationale: מְעִיל ముఖ్యమైన బయటి వస్త్రాన్ని సూచిస్తుంది; קרע దుఃఖసందర్భంలో వస్త్రాన్ని చింపడాన్ని తెలియజేస్తుంది.
- source_word: וַיָּגָז אֶת רֹאשׁוֹ
  choice: తల వెంట్రుకలు కత్తిరించుకొని
  rationale: גזז అంటే కత్తిరించడం లేదా గొరగడం. మూలంలో పూర్తిగా గుండు చేసుకున్నాడని తప్పనిసరిగా లేదు కాబట్టి, ‘వెంట్రుకలు కత్తిరించుకొని’ అనే రూపం ఆ విస్తృతిని కాపాడుతుంది.
- source_word: וַיִּפֹּל אַרְצָה
  choice: నేలపై పడి
  rationale: దిశార్థకమైన אַרְצָה నేలవైపు పడడాన్ని సూచిస్తుంది; ‘నేలపై పడి’ సహజమైన తెలుగు కథన ప్రయోగం.
- source_word: וַיִּשְׁתָּחוּ
  choice: సాష్టాంగపడ్డాడు
  rationale: ఈ క్రియ శరీరాన్ని నేలవైపు వంచి ప్రణమిల్లడాన్ని, తరచుగా భక్తి లేదా ఆరాధన భావంతో చేయడాన్ని సూచిస్తుంది. ‘సాష్టాంగపడ్డాడు’ శారీరక చర్యను స్పష్టంగా ఉంచి, ‘ఆరాధించాడు’ అని మాత్రమే అనువదించడం వల్ల చర్య కనుమరుగవకుండా చేస్తుంది.
theological_decisions:
- issue: యోబు చివరి చర్యను కేవలం శారీరకంగా వంగడంగా అనువదించాలా, లేక ఆరాధనగా స్పష్టం చేయాలా
  choice: సాష్టాంగపడ్డాడు
  alternative: ఆరాధించాడు; సాష్టాంగపడి ఆరాధించాడు
  rationale: שׁחה శారీరకంగా ప్రణమిల్లడాన్ని సూచిస్తూ సందర్భానుసారం భక్తి లేదా ఆరాధన భావాన్ని కలిగి ఉండవచ్చు. ఈ వచనం ఉద్దేశాన్ని ప్రత్యేక పదంతో నిర్ధారించనందున, శారీరక చర్యను ప్రధాన పాఠ్యంలో ఉంచి దాని ఆరాధనా సాధ్యతను పాదటిప్పణిలో తెలపడం మూలంలోని భావవిస్తృతిని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన కథనశైలిని వాడాం. దుఃఖాచారాలకు సంబంధించిన స్పష్టమైన శారీరక చర్యలను నిలిపి, చివరి క్రియలోని శారీరక ప్రణామం–ఆరాధన భావాల మధ్య ఉన్న నిజమైన అర్థవిస్తృతిని పాదటిప్పణితో కాపాడాం.
