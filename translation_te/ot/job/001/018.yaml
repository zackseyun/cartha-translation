- from: 'ఇతడు ఇంకా మాట్లాడుతుండగానే, మరొకడు వచ్చి ఇలా అన్నాడు: “నీ కుమారులూ కుమార్తెలూ తమ జ్యేష్ఠ సహోదరుని ఇంట్లో భోజనం చేస్తూ ద్రాక్షారసం తాగుతున్నారు[a].”'
  to: 'ఇతడు ఇంకా మాట్లాడుతుండగానే, మరొకడు వచ్చి ఇలా అన్నాడు: “నీ కుమారులూ కుమార్తెలూ తమ జ్యేష్ఠ సహోదరుని ఇంట్లో తింటూ ద్రాక్షామద్యం తాగుతూ ఉన్నారు[a].”'
