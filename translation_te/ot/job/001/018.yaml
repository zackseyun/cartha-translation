  text: עַ֚ד זֶ֣ה מְדַבֵּ֔ר וְ/זֶ֖ה בָּ֣א וַ/יֹּאמַ֑ר בָּנֶ֨י/ךָ וּ/בְנוֹתֶ֤י/ךָ אֹֽכְלִים֙ וְ/שֹׁתִ֣ים יַ֔יִן בְּ/בֵ֖ית אֲחִי/הֶ֥ם הַ/בְּכֽוֹר׃
base_translation:
  language: en
  yaml_path: translation/ot/job/001/018.yaml
  text: While this one was still speaking[a], another came and said, “Your sons and your daughters were eating and drinking wine in the house of their firstborn brother.”
translation:
  language: te
  text: 'ఇతడు ఇంకా మాట్లాడుతుండగానే, మరొకడు వచ్చి ఇలా అన్నాడు: “నీ కుమారులూ కుమార్తెలూ తమ జ్యేష్ఠ సహోదరుని ఇంట్లో తింటూ ద్రాక్షామద్యం తాగుతూ ఉన్నారు[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “విందు చేసుకుంటూ ద్రాక్షామద్యం తాగుతూ ఉన్నారు.” హీబ్రూ మూలంలో అక్షరార్థంగా “తింటూ ద్రాక్షామద్యం తాగుతూ ఉన్నారు” అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד זֶה מְדַבֵּר
  choice: ఇతడు ఇంకా మాట్లాడుతుండగానే
  rationale: మునుపటి దూత మాట ముగియకముందే తదుపరి దూత రావడాన్ని సూచించే హీబ్రూ ప్రయోగాన్ని, వర్తమాన కృదంతంలోని కొనసాగుతున్న చర్యను కాపాడుతూ సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וְזֶה בָּא
  choice: మరొకడు వచ్చి
  rationale: అక్షరార్థంగా ‘ఇతడు వచ్చాడు’ అయినా, కథనంలో వరుసగా వచ్చే దూతలలో ఇంకొకరిని సూచిస్తుంది; ‘మరొకడు’ ఆ కార్యాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וַיֹּאמַר
  choice: ఇలా అన్నాడు
  rationale: ప్రత్యక్ష వాక్యాన్ని పరిచయం చేసే సాధారణ హీబ్రూ కథన రూపానికి సహజమైన తెలుగు సమానం.
- source_word: בָּנֶיךָ וּבְנוֹתֶיךָ
  choice: నీ కుమారులూ కుమార్తెలూ
  rationale: మూలంలో కుమారులు, కుమార్తెలు విడిగా పేర్కొనబడినందున సాధారణీకరించకుండా రెండింటినీ నిలుపుతుంది.
- source_word: אֹכְלִים וְשֹׁתִים יַיִן
  choice: భోజనం చేస్తూ ద్రాక్షారసం తాగుతున్నారు
  rationale: జరుగుతున్న రెండు చర్యలను కాపాడుతుంది. יַיִן‌ను సాధారణ పానీయం అనే అస్పష్ట పదంతో కాక, ద్రాక్షతో చేసిన మద్యపానీయాన్ని సూచించే ‘ద్రాక్షారసం’గా అనువదించింది; ‘విందు చేసుకుంటూ’ అనే వ్యాఖ్యాత్మక విస్తరణను ప్రధాన పాఠ్యంలో నివారించింది.
- source_word: בְּבֵית אֲחִיהֶם הַבְּכוֹר
  choice: తమ జ్యేష్ఠ సహోదరుని ఇంట్లో
  rationale: הַבְּכוֹר సూచించే జననక్రమాన్ని ‘జ్యేష్ఠ’ స్పష్టంగా నిలుపుతుంది; ‘తమ’ అనే ప్రతిఫలక సర్వనామం కుమారులు, కుమార్తెలతో సంబంధాన్ని సహజంగా తెలుపుతుంది.
