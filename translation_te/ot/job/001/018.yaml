translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథనశైలి వాడబడింది. ‘జ్యేష్ఠ సహోదరుడు’ కొంత అధికారికమైనదైనా הַבְּכוֹר అనే జననక్రమ పదాన్ని కచ్చితంగా నిలుపుతుంది. పాదసూచి సూచికను సంబంధిత వాక్యభాగం వెంట ఉంచాం.
