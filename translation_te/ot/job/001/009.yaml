source:
  edition: WLC
  text: וַ/יַּ֧עַן הַ/שָּׂטָ֛ן אֶת יְהוָ֖ה וַ/יֹּאמַ֑ר הַֽ/חִנָּ֔ם יָרֵ֥א אִיּ֖וֹב אֱלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/001/009.yaml
  text: Then the Accuser answered Yahweh and said[b][a], “Does Job fear God for nothing?"
translation:
  language: te
  text: 'అప్పుడు అభియోగి[a] యాహ్వేకు జవాబిచ్చి ఇలా అన్నాడు: “యోబు ఊరికే[b] దేవునికి భయపడుతున్నాడా?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ‘ఆ సాతాను’ లేదా ‘ఆ విరోధి’ అని కూడా అనువదించవచ్చు. ఇక్కడ ఈ పదానికి నిర్దిష్ట ఉపపదం ఉంది; అది వ్యక్తినామం కంటే ఒక పాత్ర లేదా హోదాగా పనిచేస్తోంది.
    reason: alternative_reading
  - marker: b
    text: ‘ఏ కారణమూ లేకుండా’ లేదా ‘ఏ ప్రయోజనమూ లేకుండా’ అని కూడా అనువదించవచ్చు. యోబు దేవభయం ఎలాంటి ప్రతిఫలాపేక్ష లేనిదా అని ఈ మాట ప్రశ్నిస్తోంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן
  choice: జవాబిచ్చి
  rationale: ענה అనే క్రియ ఈ సంభాషణ సందర్భంలో ‘జవాబివ్వడం’ అనే సాధారణ అర్థాన్ని ఇస్తుంది; తరువాతి וַיֹּאמַרతో కలిపి సహజమైన తెలుగు కథన క్రమాన్ని నిలుపుతుంది.
- source_word: הַשָּׂטָן
  choice: అభియోగి
  rationale: మూలంలో నిర్దిష్ట ఉపపదం ఉండడం వల్ల ఇది వ్యక్తినామం కంటే పాత్రను లేదా హోదాను సూచిస్తుంది. న్యాయసభను పోలిన ఈ సందర్భంలో ‘అభియోగి’ ఆరోపించే పాత్రను స్పష్టంగా తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో నేరుగా లిప్యంతరీకరించింది.
- source_word: וַיֹּאמַר
  choice: ఇలా అన్నాడు
  rationale: ప్రత్యక్ష వాక్యాన్ని పరిచయం చేసే సాధారణ హీబ్రూ కథన సూత్రానికి సహజమైన తెలుగు సమానం.
- source_word: הֲחִנָּם
  choice: ఊరికే
  rationale: ప్రతిఫలం లేకుండానా, ప్రయోజనం లేకుండానా, లేదా కారణం లేకుండానా అనే సందర్భోచిత భావవిస్తారాన్ని ‘ఊరికే’ సహజంగా నిలుపుతుంది.
- source_word: יָרֵא
  choice: భయపడుతున్నాడా
  rationale: దేవునిపట్ల భక్తిపూర్వక భయాన్ని సూచించే ירא యొక్క ప్రధాన పదబలాన్ని ‘భయపడు’ నిలుపుతుంది; ‘భక్తి చూపు’ వంటి వివరణాత్మక పదంతో దాన్ని మృదువుగా చేయలేదు.
- source_word: אֱלֹהִים
  choice: దేవునికి
  rationale: ఇక్కడ ఈ పదం నిజమైన దేవుణ్ణి సూచిస్తుంది; ‘దేవుడు’ దానికి నేరమైన తెలుగు సమానం.
theological_decisions:
- issue: నిర్దిష్ట ఉపపదంతో ఉన్న הַשָּׂטָן అనువాదం
  choice: అభియోగి
  alternative: సాతాను; విరోధి
  rationale: ఇక్కడి రూపం వ్యక్తినామాన్ని తప్పనిసరిగా సూచించకుండా ఒక పాత్ర లేదా హోదాను సూచిస్తుంది. ‘అభియోగి’ అని అనువదించడం తరువాతి సంప్రదాయ గుర్తింపును ముందుగానే వచనంలోకి చేర్చకుండా, న్యాయసభను పోలిన దృశ్యంలోని పాత్రను నిలుపుతుంది.
- issue: יְהוָה దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలవచనం దైవనామాన్నే ఉపయోగిస్తుంది. ‘యాహ్వే’ దానిని బిరుదుతో మార్చకుండా వ్యక్తిగత నామంగా నిలుపుతుంది.
- issue: యోబు దేవభయానికి కారణాన్ని ప్రశ్నించే הֲחִנָּם
  choice: ఊరికే
  alternative: ఏ కారణమూ లేకుండా; ఏ ప్రయోజనమూ లేకుండా
  rationale: ప్రశ్న యోబు భక్తి నిస్వార్థమైనదా, ప్రయోజనంతో కూడినదా అనే ఉద్రిక్తతను కలిగిస్తుంది. ‘ఊరికే’ ఈ రెండు భావసాధ్యతలను పూర్తిగా ఒకే అర్థానికి పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. ‘జవాబిచ్చి ఇలా అన్నాడు’ అనే నిర్మాణం హీబ్రూలోని రెండు వరుస వాక్కు క్రియలను అనవసర పునరుక్తి లేకుండా నిలుపుతుంది. ‘అభియోగి’ అనే పదం పాత్రాధారిత భావాన్ని కాపాడుతుంది; ‘ఊరికే’ సాధారణ పాఠకుడికి సులభంగా అర్థమవుతూ మూలంలోని ఉద్దేశపూర్వక భావసందిగ్ధతను నిలుపుతుంది.
