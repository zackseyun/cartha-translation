source:
  edition: WLC
  text: אִ֛ישׁ הָיָ֥ה בְ/אֶֽרֶץ ע֖וּץ אִיּ֣וֹב שְׁמ֑/וֹ וְ/הָיָ֣ה הָ/אִ֣ישׁ הַ/ה֗וּא תָּ֧ם וְ/יָשָׁ֛ר וִ/ירֵ֥א אֱלֹהִ֖ים וְ/סָ֥ר מֵ/רָֽע־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/001/001.yaml
  text: There was a man in the land of Uz whose name was Job[a], and that man was blameless and upright, fearing God and turning away from evil.
translation:
  language: te
  text: ఊజు దేశంలో యోబు అనే ఒక మనిషి ఉండేవాడు. ఆ మనిషి నిందారహితుడు, నిజాయితీపరుడు; అతడు దేవునికి భయపడి, చెడుకు దూరంగా ఉండేవాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “చెడును విడిచిపెట్టేవాడు.” హీబ్రూ క్రియ చెడు నుండి తొలగడం, దాన్ని విడిచిపెట్టడం లేదా నివారించడం అనే భావాలను ఇవ్వగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ הָיָה
  choice: ఒక మనిషి ఉండేవాడు
  rationale: కథనాన్ని పరిచయం చేసే హీబ్రూ అస్తిత్వ వాక్య నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగు కథనశైలిలో తెలియజేస్తుంది; పురుష వ్యక్తిని కూడా స్పష్టంగా సూచిస్తుంది.
- source_word: בְאֶרֶץ עוּץ
  choice: ఊజు దేశంలో
  rationale: אֶרֶץ యొక్క భౌగోళిక భావాన్ని ‘దేశం’ సహజంగా అందిస్తుంది; עוּץ స్థలనామాన్ని ‘ఊజు’గా లిప్యంతరీకరించాం.
- source_word: אִיּוֹב שְׁמוֹ
  choice: యోబు అనే
  rationale: పేరు తెలియజేసే హీబ్రూ ఉపవాక్యానికి సహజమైన తెలుగు రూపం; אִיּוֹבను సంప్రదాయ తెలుగు రూపమైన ‘యోబు’గా ఇచ్చాం.
- source_word: וְהָיָה הָאִישׁ הַהוּא
  choice: ఆ మనిషి
  rationale: ముందు పరిచయమైన వ్యక్తిని తిరిగి ప్రస్తావించే הַהוּא యొక్క సూచనార్థాన్ని ‘ఆ’ నిలుపుతుంది.
- source_word: תָּם
  choice: నిందారహితుడు
  rationale: ఇక్కడ పదం సంపూర్ణ పాపరాహిత్యాన్ని తప్పనిసరిగా సూచించకుండా, నైతిక సమగ్రతను మరియు తప్పుపట్టలేని నడవడిని ప్రశంసిస్తుంది.
- source_word: יָשָׁר
  choice: యథార్థవంతుడు
  rationale: నైతికంగా సూటిగా, నిజాయితీగా ఉండే వ్యక్తి అనే భావాన్ని ఆధునిక గౌరవప్రదమైన తెలుగులో తెలియజేస్తుంది.
- source_word: וִירֵא אֱלֹהִים
  choice: దేవునికి భయపడి
  rationale: భీతికన్నా భక్తిపూర్వక గౌరవాన్ని సూచించే స్థిరమైన బైబిలు ప్రయోగం; సందర్భం ప్రకారం אֱלֹהִיםను ఏకవచన ‘దేవుడు’గా అనువదించాం.
- source_word: וְסָר מֵרָע
  choice: చెడుకు దూరంగా ఉండేవాడు
  rationale: చెడు నుండి తొలగడం, దాన్ని నివారించడం అనే క్రియాత్మక భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; ప్రత్యామ్నాయ సూక్ష్మార్థాన్ని పాదసూచికలో ఉంచాం.
theological_decisions:
- issue: యోబు నైతిక వర్ణన యొక్క భావం
  choice: యోబు నైతిక సమగ్రత కలిగిన, తప్పుపట్టలేని వ్యక్తిగా వర్ణించబడ్డాడు.
  alternative: యోబు సంపూర్ణంగా పాపరహితుడు లేదా నిరపేక్షార్థంలో పరిపూర్ణుడు.
  rationale: תָּם మరియు יָשָׁר జ్ఞానసాహిత్య సందర్భంలో బలమైన నైతిక ప్రశంసను ఇస్తాయి గాని సంపూర్ణ పాపరాహిత్యాన్ని తప్పనిసరిగా ప్రకటించవు.
- issue: אֱלֹהִים యొక్క సూచిత వ్యక్తి
  choice: దేవుడు
  alternative: దేవుళ్లు
  rationale: పదం రూపరీత్యా బహువచనమైనా, ‘దేవునికి భయపడడం’ అనే ప్రయోగం మరియు కథన సందర్భం ఏకవచన దేవుణ్ణే సూచిస్తాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథనశైలిని వాడాం. ‘నిందారహితుడు’ అనే పదం బలమైన నైతిక ప్రశంసను నిలుపుతూ సంపూర్ణ పాపరాహిత్యాన్ని అదనంగా చేర్చదు.
