source:
  edition: WLC
  text: הֲ/לֹֽא את שַׂ֣כְתָּ בַעֲד֧/וֹ וּ/בְעַד בֵּית֛/וֹ וּ/בְעַ֥ד כָּל אֲשֶׁר ל֖/וֹ מִ/סָּבִ֑יב מַעֲשֵׂ֤ה יָדָי/ו֙ בֵּרַ֔כְתָּ וּ/מִקְנֵ֖/הוּ פָּרַ֥ץ בָּ/אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/001/010.yaml
  text: Have you not put a hedge around him and around his house and around all that he has[a], on every side? You have blessed the work of his hands[b], and his livestock has spread throughout the land.
translation:
  language: te
  text: నీవు అతని చుట్టూ, అతని ఇంటి చుట్టూ, అతనికి ఉన్న సమస్తం చుట్టూ అన్ని వైపులా కంచె వేసి ఉంచలేదా?[a] అతని చేతుల పనిని నీవు ఆశీర్వదించావు; అతని పశుసంపద దేశమంతటా విస్తరించింది[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతణ్ణి, అతని ఇంటిని, అతనికి ఉన్న సమస్తాన్ని చుట్టుముట్టి కాపాడలేదా?” హీబ్రూలో రక్షణ కలిగించే ఆవరణ అనే స్పష్టమైన రూపకం ఉంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “అతని పశుసంపద దేశంలో విపరీతంగా పెరిగింది.” హీబ్రూ క్రియ అక్షరార్థంగా హద్దులు ఛేదిస్తూ బయటికి విస్తరించడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׂכְתָּ
  choice: కంచె వేయలేదా
  rationale: హీబ్రూ క్రియలోని చుట్టూ ఆవరణ ఏర్పరచి కాపాడే సజీవ రూపకాన్ని నిలుపుతుంది; కేవలం ‘కాపాడావు’ అని అమూర్తంగా చేయదు.
- source_word: בַעֲדוֹ / וּבְעַד בֵּיתוֹ / וּבְעַד כָּל אֲשֶׁר לוֹ ... מִסָּבִיב
  choice: అతని చుట్టూ, అతని ఇంటి చుట్టూ, అతనికి ఉన్న సమస్తం చుట్టూ అన్ని వైపులా
  rationale: మూలంలోని మూడుసార్ల పునరుక్తిని, సంపూర్ణంగా చుట్టుముట్టిన రక్షణ భావాన్ని కాపాడుతుంది.
- source_word: מַעֲשֵׂה יָדָיו
  choice: అతని చేతుల పని
  rationale: వ్యక్తి శ్రమను, ఉత్పాదక కార్యాన్ని సూచించే హీబ్రూ నుడికారాన్ని తెలుగులో సహజంగా నిలుపుతుంది.
- source_word: בֵּרַכְתָּ
  choice: ఆశీర్వదించావు
  rationale: సంపదకు కారణం దేవుని ఆశీర్వాదమనే వచనంలోని ధార్మిక ప్రకటనను ‘వృద్ధి కలిగించావు’గా కుదించకుండా నిలుపుతుంది.
- source_word: מִקְנֵהוּ
  choice: అతని పశుసంపద
  rationale: సాధారణ ఆస్తులకన్నా మందలు, పెంపుడు జంతువులను సూచించే పదానికి విస్తృతమైన సహజ తెలుగు సమానం.
- source_word: פָּרַץ בָּאָרֶץ
  choice: దేశమంతటా విస్తరించింది
  rationale: פָּרַץ లోని హద్దులు దాటి విస్తరించే సజీవ భావాన్ని, בָּאָרֶץ తో కూడిన భూవ్యాప్తిని సహజ తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: הֲלֹא
  choice: వేయలేదా?
  rationale: ఆరోపణ ఛాయగల అలంకారప్రశ్న స్వరాన్ని యథాతథంగా ఉంచుతుంది.
theological_decisions:
- issue: ఆశీర్వాద భాషను భౌతిక సఫలతగా మాత్రమే మార్చాలా
  choice: అతని చేతుల పనిని నీవు ఆశీర్వదించావు
  alternative: అతని చేతుల పనికి నీవు వృద్ధి కలిగించావు
  rationale: మూలం నేరుగా దేవుని ఆశీర్వాదాన్ని పేర్కొంటుంది; దాని ఫలితాన్ని మాత్రమే అనువదించడం ధార్మిక భావాన్ని సన్నగిల్లిస్తుంది.
- issue: రక్షణకు సంబంధించిన కంచె రూపకాన్ని నిలపాలా
  choice: చుట్టూ ... కంచె వేయలేదా
  alternative: అతణ్ణి ... కాపాడలేదా
  rationale: మూలంలోని చుట్టుముట్టిన రక్షణ అనే స్పష్టమైన రూపకాన్ని నిలుపుతూ, దాని భావాన్ని ముందుగానే అమూర్తంగా పరిష్కరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘కంచె’ రూపకం, ‘చేతుల పని’ నుడికారం, ‘ఆశీర్వదించావు’ అనే ధార్మిక పదం నిలుపబడ్డాయి; పునరుక్తి మూలంలోని ఆరోపణాత్మక బలాన్ని కాపాడేందుకు ఉద్దేశపూర్వకంగా ఉంచబడింది.
