source:
  edition: WLC
  text: וַ/יְהִ֣י מִ֠קְנֵ/הוּ שִֽׁבְעַ֨ת אַלְפֵי צֹ֜אן וּ/שְׁלֹ֧שֶׁת אַלְפֵ֣י גְמַלִּ֗ים וַ/חֲמֵ֨שׁ מֵא֤וֹת צֶֽמֶד בָּקָר֙ וַ/חֲמֵ֣שׁ מֵא֣וֹת אֲתוֹנ֔וֹת וַ/עֲבֻדָּ֖ה רַבָּ֣ה מְאֹ֑ד וַ/יְהִי֙ הָ/אִ֣ישׁ הַ/ה֔וּא גָּד֖וֹל מִ/כָּל בְּנֵי קֶֽדֶם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/001/003.yaml
  text: His livestock were seven thousand sheep[a], three thousand camels, five hundred yoke of oxen, five hundred female donkeys, and a very large household; and that man was greater than all the sons of the east.
translation:
  language: te
  text: అతనికి ఏడువేల గొర్రెలు[a], మూడువేల ఒంటెలు, ఐదువందల జతల ఎద్దులు, ఐదువందల ఆడ గాడిదలు, ఎంతో పెద్ద సేవక పరివారం[b] ఉండేవి. ఆ మనిషి తూర్పు ప్రాంత ప్రజలందరిలోకెల్లా గొప్పవాడు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పదం గొర్రెలు, మేకలు కలిసిన చిన్న పశువుల మందను కూడా సూచించవచ్చు.
    reason: lexical_ambiguity
  - marker: b
    text: లేదా, “ఎంతో విస్తారమైన సేవా వ్యవస్థ.”
    reason: lexical_alternative
  - marker: c
    text: అక్షరార్థంగా, “తూర్పు కుమారులందరికంటే గొప్పవాడు”; అంటే తూర్పు ప్రాంత ప్రజలందరికంటే గొప్పవాడు.
    reason: idiom_clarification
lexical_decisions:
- source_word: מִקְנֵהוּ
  choice: అతనికి ... ఉండేవి
  rationale: ఈ సందర్భంలో ఈ పదం పశుసంపదను సూచిస్తుంది. అయితే తెలుగులో జాబితాను నేరుగా ‘అతనికి ... ఉండేవి’ అని చెప్పడం సహజంగా ఉంటుంది.
- source_word: צֹאן
  choice: గొర్రెలు
  rationale: ఈ పదం గొర్రెలు, మేకలు కలిసిన చిన్న పశువుల మందను సూచించగలదు; ప్రధాన పాఠంలో సహజమైన ‘గొర్రెలు’ను ఉంచి, విస్తృత అర్థాన్ని పాదటీకలో తెలిపాం.
- source_word: צֶמֶד בָּקָר
  choice: జతల ఎద్దులు
  rationale: צֶמֶד అనేది కాడికి జతగా కట్టే రెండు పశువులను సూచిస్తుంది. ‘జతల ఎద్దులు’ సంఖ్యను, వ్యవసాయ పనికి ఉపయోగించే జంట భావాన్ని రెండింటినీ నిలుపుతుంది.
- source_word: אֲתוֹנוֹת
  choice: ఆడ గాడిదలు
  rationale: హీబ్రూ రూపం ఆడ జంతువులను స్పష్టంగా సూచిస్తుంది.
- source_word: עֲבֻדָּה רַבָּה מְאֹד
  choice: ఎంతో పెద్ద సేవక పరివారం
  rationale: ఇక్కడ పదబంధం విస్తారమైన సేవను లేదా ఆ సేవను నిర్వహించే సేవక వ్యవస్థను సూచిస్తుంది. ‘సేవక పరివారం’ ఆ గృహ-ఆస్తి వ్యవస్థలోని మానవ వనరులను సహజ తెలుగులో వ్యక్తం చేస్తుంది; ప్రత్యామ్నాయాన్ని పాదటీకలో ఉంచాం.
- source_word: גָּדוֹל מִכָּל
  choice: అందరిలోకెల్లా గొప్పవాడు
  rationale: ఈ తులనాత్మక నిర్మాణం ఇతరులందరినీ మించిన సంపద, హోదా లేదా ప్రాముఖ్యతను సూచిస్తుంది. ‘గొప్పవాడు’ ఆ పరిధిని అనవసరంగా ఒక్క అంశానికి పరిమితం చేయదు.
- source_word: בְּנֵי קֶדֶם
  choice: తూర్పు ప్రాంత ప్రజలు
  rationale: ఇది తూర్పున నివసించే ప్రజలను సూచించే హీబ్రూ నుడికారం. ఆధునిక తెలుగులో సహజమైన అర్థాన్ని ప్రధాన పాఠంలో ఇచ్చి, అక్షరార్థ రూపాన్ని పాదటీకలో తెలిపాం.
theological_decisions:
- issue: בְּנֵי קֶדֶם అనే నుడికారంలోని లింగరూపం మరియు సమూహార్థం
  choice: తూర్పు ప్రాంత ప్రజలు
  alternative: తూర్పు కుమారులు
  rationale: ‘కుమారులు’ అనేది హీబ్రూ రూపానికి అక్షరానువాదమైనా, ఇక్కడ భావం ఒక ప్రాంతానికి చెందిన ప్రజల సమూహం. ప్రధాన పాఠంలో సహజమైన సమూహార్థాన్ని ఉంచి, మూలరూపాన్ని పాదటీకలో కాపాడటం అపార్థాన్ని నివారిస్తుంది.
- issue: גָּדוֹל అనే పదంలోని ప్రాముఖ్యత/సంపద భావం
  choice: గొప్పవాడు
  alternative: అత్యంత ధనవంతుడు
  rationale: సందర్భం అతని సంపదను ప్రధానంగా చూపించినా, హీబ్రూ పదం ప్రాముఖ్యత లేదా హోదాను కూడా కలిగి ఉండవచ్చు. అందువల్ల దానిని కేవలం ధనానికి పరిమితం చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా ఉండే వాక్యనిర్మాణం వాడాం. పశువుల జాబితాలో సంఖ్యలు స్పష్టంగా ఉంచాం. ‘గొప్పవాడు’ అనే పదంతో సంపద, హోదా, ప్రాముఖ్యతల మధ్య ఉన్న మూలభాషా విస్తృతిని నిలిపాం.
