translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, కథనానికి తగిన గంభీరతతో అనువదించాం. హీబ్రూలో ‘షెబా’ ఏకవచన రూపంలో క్రియలతో రావడం వల్ల ప్రధాన పాఠంలో అదే వ్యాకరణ రూపాన్ని నిలిపి, జనసమూహ భావాన్ని పాదసూచికలో చూపించాం. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠంలో ఉన్నాయి.
