base_translation:
  language: en
  yaml_path: translation/ot/job/001/015.yaml
  text: And Sheba fell upon them and took them[a], and they struck down the young men with the edge of the sword[c][b]; and I alone have escaped to tell you.
translation:
  language: te
  text: షెబా దాడి చేసి వాటిని పట్టుకుపోయింది[a]; వారు యువకులను కత్తి ధారతో హతమార్చారు[c][b]. నీకు ఈ సంగతి చెప్పడానికి నేను ఒక్కడినే తప్పించుకున్నాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “షెబీయులు వారిమీద దాడిచేసి వాటిని పట్టుకుపోయారు.” హీబ్రూ పాఠంలో “షెబా” అనే పేరు ఉంది; ఇక్కడ అది బహుశా షెబా ప్రాంతానికి చెందిన దోపిడీదారులను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా, “కత్తి నోటితో”; ఇది కత్తి ధారతో హతమార్చడాన్ని సూచించే నుడికారం.
    reason: lexical_alternative
  - marker: c
    text: “యువకులు” అనేవారు పశువులను చూసుకుంటున్న యోబు సేవకులను సూచించే అవకాశం ఉంది.
    reason: cultural_note
lexical_decisions:
- source_word: וַתִּפֹּל
  choice: దండెత్తి వచ్చి
  rationale: నפל ఇక్కడ శత్రుత్వంతో అకస్మాత్తుగా దాడిచేయడాన్ని సూచిస్తుంది; తెలుగులో ‘దండెత్తి వచ్చి’ దాడి భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: שְׁבָא
  choice: షెబా
  rationale: హీబ్రూ పాఠంలో ఉన్న స్థలనామం/జననామాన్ని యథాతథంగా లిప్యంతరీకరించాం; సందర్భంలో షెబాకు చెందిన దోపిడీదారుల సమూహాన్ని సూచిస్తుంది.
- source_word: וַתִּקָּחֵם
  choice: వాటిని పట్టుకుపోయింది
  rationale: సర్వనామం మునుపటి వచనంలోని ఎద్దులు, గాడిదలను సూచిస్తుంది. దాడి సందర్భంలో ‘పట్టుకుపోయింది’ తీసుకొని వెళ్లిన భావాన్ని స్పష్టం చేస్తుంది.
- source_word: הַנְּעָרִים
  choice: యువకులను
  rationale: נערים అనే పదానికి యువకులు, సేవకులు లేదా పరిచారకులు అనే భావాలు ఉండవచ్చు. మూలంలోని ప్రాథమిక పదార్థాన్ని నిలుపుతూ సందర్భ వివరణను పాదసూచికలో ఇచ్చాం.
- source_word: הִכּוּ לְפִי חָרֶב
  choice: కత్తివాత హతమార్చింది
  rationale: అక్షరార్థంగా ‘కత్తి నోటితో’ అనే హీబ్రూ నుడికారం కత్తి ధారచేత చంపడాన్ని సూచిస్తుంది. ‘కత్తివాత హతమార్చింది’ ఆధునిక తెలుగులో సహజంగా, గంభీరంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: וָאִמָּלְטָה
  choice: తప్పించుకున్నాను
  rationale: מלט ప్రమాదం నుంచి తప్పించుకొని బతికి బయటపడటాన్ని సూచిస్తుంది; దూత ప్రస్తుత నివేదికలో తెలుగు భూతకాల రూపం సహజంగా ఉంటుంది.
- source_word: רַק אֲנִי לְבַדִּי
  choice: నేను ఒక్కడినే
  rationale: రెండు హీబ్రూ పదబంధాలు కలిపి వ్యక్తి ఒక్కడే మిగిలాడనే బలమైన ప్రత్యేకతను తెలియజేస్తాయి.
- source_word: לְהַגִּיד לָךְ
  choice: నీకు ఈ సంగతి చెప్పడానికి
  rationale: నגד ఇక్కడ జరిగినదాన్ని నివేదించడం. ‘ఈ సంగతి’ తెలుగులో అవసరమైన సహజ కర్మను అందిస్తూనే కొత్త సమాచారాన్ని చేర్చదు.
