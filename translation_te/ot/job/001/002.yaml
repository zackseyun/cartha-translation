translation:
  language: te
  text: అతనికి ఏడుగురు కుమారులు, ముగ్గురు కుమార్తెలు పుట్టారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּוָּלְדוּ
  choice: పుట్టారు
  rationale: ילד ధాతువు నిఫ్అల్ రూపం జన్మించడాన్ని సూచిస్తుంది. తెలుగులో ‘పుట్టారు’ సహజమైన క్రియ; ‘అతనికి’తో కలిపి మూలంలోని కర్మణి/ఫలిత భావాన్ని సహజంగా అందిస్తుంది.
- source_word: לוֹ
  choice: అతనికి
  rationale: లְ ఉపసర్గతో కూడిన సర్వనామం ఇక్కడ సంతాన సంబంధాన్ని సూచిస్తుంది. ‘అతనికి ... పుట్టారు’ అనేది ఆధునిక తెలుగులో సహజమైన జనన ప్రయోగం.
- source_word: שִׁבְעָה בָנִים
  choice: ఏడుగురు కుమారులు
  rationale: మూలంలో పురుష సంతానం స్పష్టంగా ఉంది. వ్యక్తులను లెక్కించే తెలుగు రూపం ‘ఏడుగురు’ను వాడటం సహజం, ఖచ్చితం.
- source_word: וְשָׁלֹשׁ בָּנוֹת
  choice: ముగ్గురు కుమార్తెలు
  rationale: సంయోజకాన్ని తెలుగులో విరామచిహ్నంతో సహజంగా వ్యక్తం చేసి, మూలంలోని స్త్రీ సంతాన సూచనను ‘కుమార్తెలు’గా నిలిపాం. వ్యక్తులకు తగిన ‘ముగ్గురు’ వాడబడింది.
theological_decisions: []
translation_notes:
  register: సాధారణ ఆధునిక ప్రామాణిక తెలుగు; సంక్షిప్తమైన, గౌరవప్రదమైన కథన శైలి. తెలుగు వాక్యప్రవాహం కోసం రెండు సమన్విత నామపదబంధాల మధ్య ‘మరియు’కు బదులుగా కామా వాడబడింది.
