revisions:
- from: 'అతడు ఇలా అన్నాడు: “నేను నా తల్లి గర్భం నుండి దిగంబరిగా వచ్చాను; దిగంబరిగానే అక్కడికి తిరిగి వెళ్తాను.[a] యాహ్వే ఇచ్చాడు, యాహ్వే తీసుకున్నాడు. యాహ్వే నామం స్తుతించబడుగాక!”[b]'
  to: 'అతడు ఇలా అన్నాడు: “నేను నా తల్లి గర్భం నుండి నగ్నంగా వచ్చాను; నగ్నంగానే అక్కడికి తిరిగి వెళ్తాను.[a] యాహ్వే ఇచ్చాడు, యాహ్వే తీసుకున్నాడు. యాహ్వే నామం ఆశీర్వదించబడుగాక![b]”'
  rationale: The revision directly renders the repeated עָרֹם as ‘నగ్నంగా,’ retains the deliberately unspecified destination expressed by שָׁמָה, and restores ‘ఆశీర్వదించబడుగాక’ for מְבֹרָךְ. The footnote notes the contextual association with praise without displacing the source’s lexical meaning.
