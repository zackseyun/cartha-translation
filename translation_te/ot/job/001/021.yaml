language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ עָרֹ֨ם יצתי מִ/בֶּ֣טֶן אִמִּ֗/י וְ/עָרֹם֙ אָשׁ֣וּב שָׁ֔מָ/ה יְהוָ֣ה נָתַ֔ן וַ/יהוָ֖ה לָקָ֑ח יְהִ֛י שֵׁ֥ם יְהוָ֖ה מְבֹרָֽךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/001/021.yaml
  text: And he said[a], “Naked I came out from my mother’s womb, and naked I will return there. Yahweh gave, and Yahweh has taken away[b]. May the name of Yahweh be blessed.”
translation:
  language: te
  text: 'అతడు ఇలా అన్నాడు: “నేను నా తల్లి గర్భం నుండి నగ్నంగా వచ్చాను; నగ్నంగానే అక్కడికి తిరిగి వెళ్తాను.[a] యాహ్వే ఇచ్చాడు, యాహ్వే తీసుకున్నాడు. యాహ్వే నామం ఆశీర్వదించబడుగాక![b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా “అక్కడికి” అని ఉంది; గమ్యం స్పష్టంగా చెప్పబడలేదు. ఇది తల్లి గర్భాన్ని అలంకారికంగా, భూమి లేదా సమాధిని, లేక ఏమీ లేని స్థితిని సూచించవచ్చు.
    reason: alternative_reading
  - marker: b
    text: హీబ్రూలో “ఆశీర్వదించబడుగాక” అని ఉంది; దైవనామం సందర్భంలో దీనికి “స్తుతించబడుగాక” అనే భావార్థం కూడా ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָרֹם
  choice: దిగంబరిగా
  rationale: పుట్టుకలో వస్త్రాలు లేకపోవడాన్నీ, మరణంలో ఏమీ వెంట తీసుకుపోని స్థితినీ ఒకే పదంతో సూచిస్తుంది; మూలంలోని పునరుక్తిని నిలుపుతుంది.
- source_word: יצתי
  choice: వచ్చాను
  rationale: יצא అనే క్రియ ఇక్కడ గర్భం నుండి బయటకు రావడం, అంటే పుట్టడం, అనే భావంలో ఉంది; తెలుగులో సహజంగా ఉండే సంక్షిప్త రూపం.
- source_word: מִבֶּטֶן אִמִּי
  choice: నా తల్లి గర్భం నుండి
  rationale: మూలంలోని శరీరసంబంధమైన స్పష్ట చిత్రణను నేరుగా నిలుపుతుంది.
- source_word: וְעָרֹם אָשׁוּב שָׁמָה
  choice: దిగంబరిగానే అక్కడికి తిరిగి వెళ్తాను
  rationale: శָׁמָה అనే ‘అక్కడికి’ పదాన్ని తొలగించకుండా, అది ఏ స్థలాన్ని సూచిస్తుందో నిర్దిష్టం చేయని హీబ్రూ అస్పష్టతను కాపాడుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా ఆధునిక తెలుగు లిప్యంతరీకరణగా ఇస్తుంది.
- source_word: נָתַן
  choice: ఇచ్చాడు
  rationale: పూర్తయిన చర్యను తెలిపే హీబ్రూ రూపానికి సహజమైన తెలుగు భూతకాల రూపం.
- source_word: לָקָח
  choice: తీసుకున్నాడు
  rationale: హీబ్రూ క్రియకు నేరమైన అర్థం ‘తీసుకున్నాడు’; ‘తీసివేశాడు’ వంటి అధిక వివరణను జోడించకుండా నష్ట సందర్భంలో సహజంగా ఉంది.
- source_word: יְהִי
  choice: స్తుతించబడుగాక
  rationale: క్రియ యొక్క కోరిక లేదా ఆశీర్వచన భావాన్ని తెలుగు విధ్యర్థక రూపం వ్యక్తం చేస్తుంది.
- source_word: שֵׁם יְהוָה
  choice: యాహ్వే నామం
  rationale: హీబ్రూ సంబంధ నిర్మాణాన్ని గౌరవిస్తూ తెలుగులో గంభీరంగా, సహజంగా ఉంది.
- source_word: מְבֹרָךְ
  choice: స్తుతించబడుగాక
  rationale: దైవనామాన్ని ‘ఆశీర్వదించడం’ అనే పదబంధం సాధారణ పాఠకునికి అపార్థం కలిగించవచ్చు; ఇక్కడ దేవుని నామాన్ని కొనియాడే భావాన్ని సహజంగా తెలియజేస్తుంది, కాగా పాదటిప్పణి మూలంలోని అక్షరార్థాన్ని నమోదు చేస్తుంది.
theological_decisions:
- issue: దైవనామం יהוה అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు
  rationale: పాఠ్యంలో వ్యక్తిగత దైవనామమే ఉంది; దాన్ని బిరుదుతో భర్తీ చేయకుండా లిప్యంతరీకరించడం మూలానికి దగ్గరగా ఉంటుంది.
- issue: שָׁמָה (‘అక్కడికి’) సూచించే గమ్యం
  choice: ‘అక్కడికి’ అని ఉంచి గమ్యాన్ని నిర్దిష్టం చేయకపోవడం
  alternative: భూమికి / సమాధికి / తల్లి గర్భానికి తిరిగి వెళ్తాను
  rationale: హీబ్రూ గమ్యాన్ని స్పష్టంగా పేర్కొనదు. గర్భం, భూమి లేదా సమాధి, లేక ఏమీ లేని స్థితి వంటి భావసూచనల్లో ఒకదాన్ని అనువాదంలో ఖరారు చేయకుండా అస్పష్టతను నిలుపుతుంది.
- issue: מְבֹרָךְ యొక్క ఆరాధనా భావం
  choice: స్తుతించబడుగాక
  alternative: ఆశీర్వదించబడుగాక
  rationale: అక్షరార్థం ‘ఆశీర్వదించబడినది’ అయినా, దేవుని నామానికి వర్తించినప్పుడు తెలుగు పాఠకునికి ఉద్దేశిత భావం సహజంగా చేరేందుకు ‘స్తుతించబడుగాక’ ఎంచబడింది; అక్షరార్థాన్ని పాదటిప్పణిలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కవితాత్మక వాక్య నిర్మాణం వాడబడింది. ‘దిగంబరిగా’ అనే పదం ‘నగ్నంగా’ కంటే ఈ శోకోక్తిలో మర్యాదతో, సహజంగా వినిపిస్తూ మూలంలోని עָרֹם పునరుక్తిని నిలుపుతుంది. అన్ని పాదటిప్పణి సూచికలు సంబంధిత వాక్యభాగాల వెంట ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
