id: JOB.1.12
reference: Job 1:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל הַ/שָּׂטָ֗ן הִנֵּ֤ה כָל אֲשֶׁר ל/וֹ֙ בְּ/יָדֶ֔/ךָ רַ֣ק אֵלָ֔י/ו אַל תִּשְׁלַ֖ח יָדֶ֑/ךָ וַ/יֵּצֵא֙ הַ/שָּׂטָ֔ן מֵ/עִ֖ם פְּנֵ֥י יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/001/012.yaml
  text: And Yahweh said to the Accuser[a], “Look, all that he has is in your hand; only against him do not stretch out your hand.” Then the Accuser went out from the presence of Yahweh.
translation:
  language: te
  text: 'యహ్వే నిందారోపకునితో[a] ఇలా అన్నాడు: “చూడు, అతనికి ఉన్నదంతా నీ చేతిలో ఉంది. కానీ అతనిమీద మాత్రం నీ చెయ్యి చాపవద్దు.” అప్పుడు నిందారోపకుడు యహ్వే సన్నిధి నుండి వెళ్లిపోయాడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఆ సాతాను,” లేదా “ఆ విరోధి.” హీబ్రూలో ఈ పదానికి నిర్దిష్ట ఉపపదం ఉంది; అందువల్ల ఇది వ్యక్తినామం కంటే ఒక బిరుదు లేదా పాత్రను సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవ నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగులో సహజమైన లిప్యంతరీకరణగా ఇచ్చాం.
- source_word: הַשָּׂטָן
  choice: నిందారోపకుడు
  rationale: హీబ్రూలో నిర్దిష్ట ఉపపదం ఉండటంతో ఇది ఇక్కడ వ్యక్తినామం కంటే పాత్ర లేదా బిరుదుగా పనిచేస్తుంది; పరలోక న్యాయసభ సందర్భంలోని ఆరోపణ భావాన్ని ఈ పదం తెలియజేస్తుంది.
- source_word: הִנֵּה
  choice: చూడు
  rationale: దృష్టిని బలంగా ఆకర్షించే సంభాషణ సూచకాన్ని సహజమైన ఆధునిక తెలుగులో నిలిపాం.
- source_word: כָל אֲשֶׁר לוֹ
  choice: అతనికి ఉన్నదంతా
  rationale: యోబుకు చెందిన సమస్త ఆస్తిపై ఉన్న సంపూర్ణ పరిధిని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: בְּיָדֶךָ
  choice: నీ చేతిలో ఉంది
  rationale: అధికారం లేదా నియంత్రణను సూచించే హీబ్రూ ‘చెయ్యి’ రూపకాన్ని నిలిపి, తరువాతి వాక్యభాగంలోని అదే రూపకంతో పదబంధ సంబంధాన్ని కాపాడాం.
- source_word: רַק
  choice: అయితే
  rationale: ఇచ్చిన అధికారంపై విధించిన ఏకైక పరిమితిని తెలుగులో స్పష్టంగా సూచిస్తుంది.
- source_word: אֵלָיו
  choice: అతనికి విరోధంగా
  rationale: చెయ్యి చాపడం అనే సందర్భంలో యోబుపై శత్రుత్వ చర్య చేయడాన్ని సూచించే దిశార్థాన్ని స్పష్టం చేస్తుంది.
- source_word: אַל תִּשְׁלַח יָדֶךָ
  choice: నీ చెయ్యి చాపవద్దు
  rationale: మూలంలోని నిషేధాన్ని, అలాగే ముందు వచ్చిన ‘చేతిలో’ అనే రూపక పునరుక్తిని నిలుపుతుంది.
- source_word: וַיֵּצֵא
  choice: వెళ్లిపోయాడు
  rationale: కథన క్రమంలోని నిష్క్రమణను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: מֵעִם פְּנֵי יְהוָה
  choice: యహ్వే సన్నిధి నుండి
  rationale: ‘యహ్వే ముఖము ఎదుటి నుండి’ అనే హీబ్రూ నుడికారాన్ని, పరలోక సభ దృశ్యాన్ని నిలిపే సహజ తెలుగు రూపంలో ఇచ్చాం.
theological_decisions:
- issue: యోబు గ్రంథపు ప్రస్తావనలో הַשָּׂטָן అనువాదం
  choice: నిందారోపకుడు
  alternative: ‘ఆ విరోధి,’ ‘సాతాను’
  rationale: హీబ్రూ పదానికి నిర్దిష్ట ఉపపదం ఉండటం వల్ల ఇది పాత్ర లేదా బిరుదును సూచించే అవకాశాన్ని నిలుపుతుంది. ‘సాతాను’ అనే స్థిర వ్యక్తినామం ద్వారా తరువాతి దైవశాస్త్ర భావనలను ఈ వచనంలోకి ముందుగానే దిగుమతి చేయకుండా, ఆరోపకుని కార్యభావాన్ని వ్యక్తం చేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలిని ఉపయోగించాం. ‘చేతిలో/చెయ్యి చాపవద్దు’ అనే మూలభాషా రూపక పునరుక్తిని ఉద్దేశపూర్వకంగా నిలిపాం; [a] సూచిక ప్రధాన పాఠ్యంలో ఉంచబడింది.
