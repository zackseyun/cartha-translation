    text: 'హీబ్రూలో: “హ-సాతాను” (“విరోధి”). ఈ పదానికి నిర్దిష్ట ఉపపదం ఉంది; ఈ సందర్భంలో అది వ్యక్తినామంకన్నా బిరుదుగా పనిచేస్తుంది.'
    reason: lexical_alternative
