source:
  edition: WLC
  text: וַ/יֹּ֧אמֶר יְהוָ֛ה אֶל הַ/שָּׂטָ֖ן מֵ/אַ֣יִן תָּבֹ֑א וַ/יַּ֨עַן הַ/שָּׂטָ֤ן אֶת יְהוָה֙ וַ/יֹּאמַ֔ר מִ/שּׁ֣וּט בָּ/אָ֔רֶץ וּ/מֵֽ/הִתְהַלֵּ֖ךְ בָּֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/001/007.yaml
  text: Then Yahweh said to the Adversary[a], “Where have you come from?” And the Adversary answered Yahweh and said, “From roaming on the earth and from walking about on it.”
translation:
  language: te
  text: 'అప్పుడు యహ్వే విరోధిని, “నీవు ఎక్కడి నుంచి వచ్చావు?” అని అడిగాడు. విరోధి యహ్వేకు జవాబిచ్చి ఇలా అన్నాడు: “భూమిమీద అటూ ఇటూ తిరిగి, దానిమీద సంచరించి వచ్చాను.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగులో సహజమైన లిప్యంతరీకరణగా ఉంచింది.
- source_word: הַשָּׂטָן
  choice: విరోధి
  rationale: హీబ్రూలో నిర్దిష్ట ఉపపదంతో ఉన్న ఈ పదం ఇక్కడ వ్యక్తినామం కంటే పాత్రను లేదా బిరుదును సూచిస్తుంది; ‘విరోధి’ ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: מֵאַיִן תָּבֹא
  choice: నీవు ఎక్కడి నుంచి వచ్చావు?
  rationale: రాకకు మూలస్థానం ఏమిటని అడిగే హీబ్రూ ప్రశ్నను సహజమైన తెలుగు సంభాషణగా అందిస్తుంది.
- source_word: וַיַּעַן
  choice: జవాబిస్తూ
  rationale: తదుపరి וַיֹּאמַר తో కలిసిన హీబ్రూ సంభాషణ సూత్రాన్ని తెలుగులో అనవసర పునరుక్తి లేకుండా ‘జవాబిస్తూ ... అన్నాడు’గా తెలిపింది.
- source_word: מִשּׁוּט בָּאָרֶץ
  choice: భూమిమీద అటూ ఇటూ తిరిగి
  rationale: שׁוט లోని ఇటూ అటూ సంచరించే భావాన్ని, בְּ యొక్క స్థలార్థాన్ని స్పష్టమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: וּמֵהִתְהַלֵּךְ בָּהּ
  choice: దానిమీద సంచరించి
  rationale: హిత్పయేల్ రూపంలోని పదేపదే లేదా చుట్టూ నడిచే భావాన్ని ‘సంచరించి’ తెలియజేస్తుంది; భూమిని సూచించే స్త్రీలింగ ప్రత్యయాన్ని ‘దానిమీద’గా పునరుద్ధరించింది.
theological_decisions:
- issue: הַשָּׂטָן ను వ్యక్తినామంగా తీసుకోవాలా, బిరుదు/పాత్రగా తీసుకోవాలా
  choice: 'బిరుదు/పాత్ర: ‘విరోధి’'
  alternative: 'వ్యక్తినామం: ‘సాతాను’; మరింత రూపసామ్యమైనది: ‘ఆ సాతాను’'
  rationale: హీబ్రూలో నిర్దిష్ట ఉపపదం ఉండటం వల్ల ఈ సందర్భంలో పాత్రసూచక బిరుదు అనే పఠనం బలంగా ఉంది. ‘విరోధి’ అని అనువదించడం తరువాతి కాలపు వ్యక్తినామ వినియోగాన్ని ఈ వచనంలోకి దిగుమతి చేయకుండా మూలంలోని భావాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా ఉండే కథనశైలి. హీబ్రూ ‘జవాబిచ్చి చెప్పాడు’ అనే ద్వంద్వ సూత్రాన్ని తెలుగులో సహజమైన ‘జవాబిస్తూ ... అన్నాడు’గా మార్చింది; రెండు సంచార క్రియల మధ్య ఉన్న స్వల్ప భావభేదాన్ని నిలిపింది.
