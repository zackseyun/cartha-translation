id: JOB.1.11
reference: Job 1:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אוּלָם֙ שְֽׁלַֽח נָ֣א יָֽדְ/ךָ֔ וְ/גַ֖ע בְּ/כָל אֲשֶׁר ל֑/וֹ אִם לֹ֥א עַל פָּנֶ֖י/ךָ יְבָרֲכֶֽ/ךָּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/001/011.yaml
  text: But stretch out your hand[a], please, and touch all that he has, and he will surely curse you to your face.
translation:
  language: te
  text: కానీ దయచేసి నీ చెయ్యి చాపి, అతనికి ఉన్నదంతటినీ ముట్టుకో; అతడు నీ ముఖం ఎదుటనే నిన్ను తప్పక శపిస్తాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “నిన్ను దీవిస్తాడు.” యోబు గ్రంథపు ప్రారంభ కథనంలో ఇది సాధారణంగా “నిన్ను శపిస్తాడు” అనే భావాన్ని తెలిపే సౌమ్యోక్తిగా అర్థం చేసుకోబడుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאוּלָם
  choice: అయితే
  rationale: ముందటి మాటకు బలమైన వ్యతిరేక మలుపును సహజమైన ఆధునిక తెలుగులో సూచిస్తుంది.
- source_word: שְׁלַח נָא יָדְךָ
  choice: దయచేసి నీ చెయ్యి చాపి
  rationale: దేవుడు తన శక్తిని కార్యరూపంలో ప్రయోగించడాన్ని సూచించే హీబ్రూ రూపకాన్ని నిలుపుతూ, נָא లోని అభ్యర్థనా భావాన్ని ‘దయచేసి’ తెలియజేస్తుంది.
- source_word: וְגַע
  choice: ముట్టుకో
  rationale: נגע అనే క్రియ యొక్క ప్రాథమిక అర్థమైన ‘తాకడం/ముట్టుకోవడం’ను నిలుపుతుంది; సందర్భంలో హాని కలిగించే చర్య అనే భావం స్పష్టంగానే ఉంటుంది.
- source_word: בְּכָל אֲשֶׁר לוֹ
  choice: అతనికి ఉన్నదంతా
  rationale: యోబు ఆస్తులు, స్వాధీనాలు అన్నిటినీ సూచించే సహజమైన, సంక్షిప్త తెలుగు వ్యక్తీకరణ.
- source_word: אִם לֹא
  choice: అప్పుడు ... ఖాయం
  rationale: ఇక్కడ ఇది సాధారణ షరతు కాక, ప్రమాణసదృశమైన దృఢ నిశ్చయాన్ని వ్యక్తం చేస్తుంది.
- source_word: עַל פָּנֶיךָ
  choice: నీ ముఖం ముందే
  rationale: దేవుని ఎదుటే బహిరంగంగా, నేరుగా చేయడమనే హీబ్రూ నుడికార భావాన్ని కాపాడుతుంది.
- source_word: יְבָרֲכֶךָּ
  choice: నిన్ను శపించడం
  rationale: ברך సాధారణంగా ‘దీవించు’ అని అర్థమైనా, యోబు గ్రంథపు ప్రస్తావనలో ఇది భక్తిపూర్వక సభ్యోక్తిగా ‘శపించు’ అనే భావంలో వాడబడింది; సందర్భార్థాన్ని ప్రధాన పాఠ్యంలో ఇస్తూ అక్షరార్థాన్ని పాదటిప్పణిలో నమోదు చేశాం.
theological_decisions:
- issue: యోబు గ్రంథపు ప్రస్తావనలో ברך అనే పదం సభ్యోక్తిగా వాడబడటం
  choice: ప్రధాన పాఠ్యంలో ‘నిన్ను శపించడం’
  alternative: ‘నిన్ను దీవించడం’
  rationale: విరోధాత్మక సందర్భంలో, హాని కలిగితే యోబు దేవుణ్ణి తిరస్కరిస్తాడనేదే సాతాను ఆరోపణ. కాబట్టి ‘శపించు’ ఉద్దేశిత భావాన్ని స్పష్టంగా తెలియజేస్తుంది; అయితే మూలంలోని అసాధారణ అక్షరార్థాన్ని పాదటిప్పణి కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యేలా సహజంగా, అయితే గంభీరతను నిలుపుతూ అనువదించబడింది. హీబ్రూ చేతి రూపకం, ముఖాముఖి నుడికారం నిలుపబడ్డాయి.
