  to: కానీ దయచేసి నీ చెయ్యి చాపి, అతనికి ఉన్నదంతటినీ ముట్టుకో; అతడు నీ ముఖం ఎదుటనే నిన్ను తప్పక శపిస్తాడు.[a]
