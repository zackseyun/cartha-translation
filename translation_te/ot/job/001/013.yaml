  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే గౌరవప్రదమైన కథనశైలి వాడబడింది. హీబ్రూ వాక్యంలోని కొనసాగుతున్న చర్యను, కుమారులు–కుమార్తెలు అనే స్పష్టమైన జతను నిలిపాము.
