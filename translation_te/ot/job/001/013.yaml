  text: וַ/יְהִ֖י הַ/יּ֑וֹם וּ/בָנָ֨י/ו וּ/בְנֹתָ֤י/ו אֹֽכְלִים֙ וְ/שֹׁתִ֣ים יַ֔יִן בְּ/בֵ֖ית אֲחִי/הֶ֥ם הַ/בְּכֽוֹר׃
base_translation:
  language: en
  yaml_path: translation/ot/job/001/013.yaml
  text: There was a day when his sons and his daughters were eating and drinking wine in the house of their oldest brother[a].
translation:
  language: te
  text: ఒక రోజు, అతని కుమారులూ కుమార్తెలూ తమ పెద్ద అన్న ఇంట్లో భోజనం చేస్తూ ద్రాక్షామద్యం తాగుతున్నారు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మొదట పుట్టిన సోదరుని ఇంట్లో.”
    reason: הַבְּכוֹר అనే పదానికి ‘పెద్దవాడు’ లేదా మరింత పదశః ‘మొదట పుట్టినవాడు’ అనే వ్యక్తీకరణలు సాధ్యమైనందున ఈ ప్రత్యామ్నాయం ఇవ్వబడింది.
lexical_decisions:
- source_word: וַיְהִי הַיּוֹם
  choice: ఒక రోజు
  rationale: ఈ హీబ్రూ ప్రయోగం కథనంలో కొత్త సంఘటనను పరిచయం చేస్తుంది. పదశః ‘ఆ రోజు సంభవించింది’ అని కాకుండా, దాని సహజమైన అనిశ్చిత కాలార్థాన్ని ఆధునిక తెలుగులో ‘ఒక రోజు’ స్పష్టంగా అందిస్తుంది.
- source_word: וּבָנָיו וּבְנֹתָיו
  choice: అతని కుమారులూ కుమార్తెలూ
  rationale: మూలంలో కుమారులు, కుమార్తెలు అని రెండు వర్గాలనూ స్పష్టంగా పేర్కొన్నందున ‘పిల్లలు’ అని సాధారణీకరించకుండా వాటిని నిలిపాము.
- source_word: אֹכְלִים וְשֹׁתִים
  choice: భోజనం చేస్తూ … తాగుతున్నారు
  rationale: హీబ్రూ కృదంతాలు కొనసాగుతున్న చర్యను చిత్రిస్తాయి. ఈ తెలుగు నిర్మాణం ఆ దృశ్యాత్మక, కొనసాగుతున్న భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: יַיִן
  choice: ద్రాక్షామద్యం
  rationale: יַיִן అంటే సందర్భంలో wine. ‘ద్రాక్షారసం’ అనే పదానికి మద్యరహిత రసం అనే అర్థమూ రావచ్చు కాబట్టి, మూలార్థాన్ని స్పష్టంగా తెలియజేయడానికి ‘ద్రాక్షామద్యం’ ఎంచుకున్నాము.
- source_word: בְּבֵית אֲחִיהֶם
  choice: తమ … అన్న ఇంట్లో
  rationale: స్థలాన్ని సూచించే בְּను ‘ఇంట్లో’గా, పరావర్తన సంబంధాన్ని తెలుగులో సహజంగా ‘తమ’తో వ్యక్తం చేశాము. సందర్భంలో అతడు వారి సోదరుడు కావడంతో ‘అన్న’ సహజంగా సరిపోతుంది.
- source_word: הַבְּכוֹר
  choice: పెద్ద అన్న
  rationale: ఈ సందర్భంలో కుటుంబంలోని జననక్రమాన్ని సూచించే సహజమైన ఆధునిక తెలుగు ప్రయోగం. ‘మొదట పుట్టిన’ అనే మరింత రూపపరమైన అర్థాన్ని పాదసూచికలో నిలిపాము.
