source:
  edition: WLC
  text: וּ/מַלְאָ֛ךְ בָּ֥א אֶל אִיּ֖וֹב וַ/יֹּאמַ֑ר הַ/בָּקָר֙ הָי֣וּ חֹֽרְשׁ֔וֹת וְ/הָ/אֲתֹנ֖וֹת רֹע֥וֹת עַל יְדֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/001/014.yaml
  text: And a messenger came to Job and said[a], “The oxen were plowing, and the donkeys were grazing beside them,”
translation:
  language: te
  text: 'ఒక దూత యోబు వద్దకు వచ్చి ఇలా చెప్పాడు: “ఎద్దులు దున్నుతున్నాయి, ఆడ గాడిదలు వాటి పక్కనే మేస్తున్నాయి;'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמַלְאָךְ
  choice: ఒక దూత
  rationale: מַלְאָךְ అనే పదం సందర్భానుసారం మానవ సందేశవాహకుడిని లేదా దేవదూతను సూచించవచ్చు. ఇక్కడ విపత్తు వార్తను తీసుకొచ్చిన మనిషిని సూచిస్తున్నందున ‘దూత’ సహజంగా సరిపోతుంది; వాక్యారంభంలోని וּ తెలుగులో ప్రత్యేకంగా ‘మరియు’ అని పలకకుండానే కథన కొనసాగింపులో వ్యక్తమవుతుంది.
- source_word: בָּא אֶל אִיּוֹב
  choice: యోబు దగ్గరకు వచ్చి
  rationale: בוא మరియు אֶל కలయిక యోబు వైపు వచ్చాడనే భావాన్ని ఇస్తుంది. ‘దగ్గరకు వచ్చి’ ఆధునిక తెలుగులో సహజమైన ప్రయోగం.
- source_word: וַיֹּאמַר
  choice: ఇలా చెప్పాడు
  rationale: కథనాన్ని ముందుకు నడిపే క్రియ. ప్రత్యక్ష వాక్యం వెంట వస్తున్నందున ‘ఇలా చెప్పాడు’ సహజంగా ఉంటుంది.
- source_word: הַבָּקָר
  choice: ఎద్దులు
  rationale: בָּקָר సాధారణంగా పశువులను సూచించగలిగినా, దున్నుతున్న సందర్భంలో పనికి ఉపయోగించే ఎద్దులు అనే అర్థం స్పష్టంగా సరిపోతుంది.
- source_word: הָיוּ חֹרְשׁוֹת
  choice: దున్నుతున్నాయి
  rationale: ఈ నిర్మాణం గత కథనంలోని కొనసాగుతున్న చర్యను తెలుపుతుంది. తెలుగులో ప్రత్యక్ష నివేదికలో ‘దున్నుతున్నాయి’ సహజంగా ఆ కొనసాగింపు భావాన్ని అందిస్తుంది.
- source_word: וְהָאֲתֹנוֹת
  choice: ఆడ గాడిదలు
  rationale: אֲתֹנוֹת ప్రత్యేకంగా ఆడ గాడిదలను సూచిస్తుంది. తెలుగులో ఈ లింగవివరాన్ని సహజంగానే ప్రధాన పాఠ్యంలో నిలుపుకోవచ్చు.
- source_word: רֹעֹות
  choice: మేస్తున్నాయి
  rationale: רעה ఇక్కడ పశువులు గడ్డి మేయడాన్ని సూచిస్తుంది; ‘మేస్తున్నాయి’ సాధారణ ఆధునిక తెలుగు పదం.
- source_word: עַל יְדֵיהֶם
  choice: వాటి పక్కనే
  rationale: పదశః ‘వాటి చేతుల వద్ద’ అనే ఈ హీబ్రూ నుడికారం స్థలసామీప్యాన్ని సూచిస్తుంది. ‘వాటి పక్కనే’ దృశ్యాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
