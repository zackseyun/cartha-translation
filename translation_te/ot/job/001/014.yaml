translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. హీబ్రూ మూలంలోని ‘ఆడ గాడిదలు’ అనే నిర్దిష్టతను ప్రధాన పాఠ్యంలోనే నిలిపాం. వచనం ముందరి వాక్యానికి కొనసాగింపుగా ఉన్నప్పటికీ, స్వతంత్ర తెలుగు వాక్యంగా సహజంగా ఉండేందుకు ప్రారంభ וּ ను విడిగా ‘మరియు’ అని అనువదించలేదు.
