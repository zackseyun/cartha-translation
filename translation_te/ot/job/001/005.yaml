  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְהִ֡י כִּ֣י הִקִּיפֽוּ֩ יְמֵ֨י הַ/מִּשְׁתֶּ֜ה וַ/יִּשְׁלַ֧ח אִיּ֣וֹב וַֽ/יְקַדְּשֵׁ֗/ם וְ/הִשְׁכִּ֣ים בַּ/בֹּקֶר֮ וְ/הֶעֱלָ֣ה עֹלוֹת֮ מִסְפַּ֣ר כֻּלָּ/ם֒ כִּ֚י אָמַ֣ר אִיּ֔וֹב אוּלַי֙ חָטְא֣וּ בָנַ֔/י וּ/בֵרֲכ֥וּ אֱלֹהִ֖ים בִּ/לְבָבָ֑/ם כָּ֛כָה יַעֲשֶׂ֥ה אִיּ֖וֹב כָּל הַ/יָּמִֽים־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/job/001/005.yaml
  text: And when the days of the feasting had run their course, Job would send and consecrate them, and he would rise early in the morning and offer burnt offerings according to the number of them all. For Job said, “Perhaps my sons have sinned and cursed God in their hearts.” Thus Job would do all the time.
translation:
  language: te
  text: విందు దినాలు తమ క్రమాన్ని పూర్తిచేసినప్పుడు, యోబు తన కుమారులను పిలిపించి వారిని పవిత్రపరిచేవాడు. అతడు ఉదయాన్నే లేచి, వారందరి సంఖ్య చొప్పున దహనబలులు అర్పించేవాడు. ఎందుకంటే యోబు, “బహుశా నా కుమారులు పాపం చేసి, తమ హృదయాల్లో దేవుణ్ణి శపించి ఉంటారేమో” అని అనుకునేవాడు. యోబు ఎల్లప్పుడూ ఇలా చేసేవాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִקִּיפוּ יְמֵי הַמִּשְׁתֶּה
  choice: విందు రోజులు పూర్తయ్యాక
  rationale: విందు దినాల చక్రం ముగియడం అనే సందర్భార్థాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: וַיְקַדְּשֵׁם
  choice: వారిని పవిత్రపరిచేవాడు
  rationale: ఆచారపరంగా శుద్ధి చేసి దేవునికి సిద్ధపరచడం అనే మూల క్రియ భావాన్ని విస్తరించి చెప్పకుండా నిలుపుతుంది.
- source_word: עֹלוֹת
  choice: దహనబలులు
  rationale: పూర్తిగా దహనం చేసే బలులను సూచించే స్థిరమైన బైబిలు పదప్రయోగం.
- source_word: מִסְפַּר כֻּלָּם
  choice: వారందరి సంఖ్య చొప్పున
  rationale: ప్రతి బిడ్డకూ ఒక బలి అన్న సూచనను మూలంలోని సంక్షిప్తతతోనే కాపాడుతుంది.
- source_word: וּבֵרֲכוּ אֱלֹהִים
  choice: దేవుణ్ణి దూషించి ఉంటారేమో
  rationale: అక్షరార్థంగా ‘దేవుణ్ణి ఆశీర్వదించారు’ అయినా, ఈ సందర్భంలో ఇది గౌరవార్థ వ్యతిరేకోక్తిగా ‘శపించడం/దూషించడం’ను సూచిస్తుంది; తెలుగులో ‘దూషించడం’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: כָּל הַיָּמִים
  choice: ఎల్లప్పుడూ
  rationale: యోబు అలవాటుగా నిరంతరం ఇలా చేసేవాడనే భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: బలి అర్పణ ద్వారా పిల్లల పాపం స్వయంచాలకంగా పరిహరించబడిందా?
  choice: వచనం యోబు జాగ్రత్తతో చేసిన ఆచరణను మాత్రమే వివరిస్తున్నట్లుగా అనువదించబడింది.
  alternative: బలులు వారి పాపాలను తప్పక తొలగించాయని వివరణాత్మకంగా చేర్చడం.
  rationale: మూలపాఠం యోబు ఉద్దేశం, అలవాటును చెబుతుంది గాని బలుల ఫలితంపై సిద్ధాంతపరమైన నిర్ధారణ చేయదు.
- issue: בֵרֲכוּ అనే గౌరవార్థ వ్యతిరేకోక్తి
  choice: దేవుణ్ణి దూషించి ఉంటారేమో
  alternative: దేవుణ్ణి శపించి ఉంటారేమో / దేవుణ్ణి ఆశీర్వదించి ఉంటారేమో
  rationale: సందర్భంలో ప్రతికూల భావం స్పష్టం. ‘ఆశీర్వదించడం’ అక్షరానువాదం తెలుగులో తప్పుదారి పట్టిస్తుంది; ‘దూషించడం’ హృదయంలో జరిగిన అవమానకర వైఖరిని సహజంగా వ్యక్తం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన శైలి. హీబ్రూ కథనంలోని పునరావృత/అలవాటు భావాన్ని ‘చేసేవాడు’ రూపాలతో నిలిపాం.
