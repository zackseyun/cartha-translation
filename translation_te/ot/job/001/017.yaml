  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సులభంగా అర్థమయ్యే కథన శైలి. దూతల వరుసలోని అత్యవసరతను ‘ఇంకా మాట్లాడుతూ ఉండగానే’ మరియు ‘విరుచుకుపడి’ వంటి సహజ ప్రయోగాలతో నిలిపాం. మూలంలోని సందిగ్ధ పదార్థాలను ప్రధాన పాఠంలో అతిగా పరిష్కరించకుండా పాదసూచికల్లో ప్రత్యామ్నాయాలను ఇచ్చాం.
