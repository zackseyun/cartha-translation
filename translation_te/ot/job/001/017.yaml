  text: ע֣וֹד זֶ֣ה מְדַבֵּ֗ר וְ/זֶה֮ בָּ֣א וַ/יֹּאמַר֒ כַּשְׂדִּ֞ים שָׂ֣מוּ שְׁלֹשָׁ֣ה רָאשִׁ֗ים וַֽ/יִּפְשְׁט֤וּ עַל הַ/גְּמַלִּים֙ וַ/יִּקָּח֔וּ/ם וְ/אֶת הַ/נְּעָרִ֖ים הִכּ֣וּ לְ/פִי חָ֑רֶב וָ/אִמָּ֨לְטָ֧/ה רַק אֲנִ֛י לְ/בַדִּ֖/י לְ/הַגִּ֥יד לָֽ/ךְ׀׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/001/017.yaml
  text: While this one was still speaking[a], another came and said, “The Chaldeans formed three raiding parties, swept down on the camels and took them, and they struck down the young men with the edge of the sword[c][b]. And I alone have escaped to tell you.”
translation:
  language: te
  text: 'అతడు ఇంకా మాట్లాడుతూ ఉండగానే, మరొకడు వచ్చి ఇలా అన్నాడు: “కల్దీయులు మూడు దాడి బృందాలుగా ఏర్పడి[a] ఒంటెల మీదికి విరుచుకుపడి వాటిని పట్టుకుపోయారు. యువకులను[c] కత్తి ధారతో హతమార్చారు[b]. నీకు ఈ సంగతి చెప్పడానికి నేనొక్కడినే తప్పించుకున్నాను.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “మూడు విభాగాలుగా చేసుకొని,” లేదా “మూడు బృందాలుగా మోహరించి”; అక్షరార్థంగా, “మూడు తలలను పెట్టారు.”
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ నుడికారం అక్షరార్థంగా, “కత్తి నోటి/అంచు చేత కొట్టారు”; అంటే కత్తులతో చంపారు.
    reason: lexical_alternative
  - marker: c
    text: ఈ సందర్భంలో “యువకులు” అనే మాట ఇంటి పరిచారకులను లేదా సేవకులను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ע֣וֹד זֶ֣ה מְדַבֵּר
  choice: అతడు ఇంకా మాట్లాడుతూ ఉండగానే
  rationale: עוֹדతో కూడిన participle కొనసాగుతున్న క్రియను సూచిస్తుంది; దూతల వరుసలో זֶהను సహజమైన తెలుగు సర్వనామంతో తెలిపి, కాలసమాంతరతను ‘ఉండగానే’ ద్వారా వ్యక్తం చేశాం.
- source_word: וְזֶה בָּא וַיֹּאמַר
  choice: మరొకడు వచ్చి ఇలా అన్నాడు
  rationale: ఇక్కడ రెండవ זֶה తదుపరి దూతను సూచిస్తుంది; తెలుగులో ‘మరొకడు’ కథన ప్రవాహానికి సహజం.
- source_word: כַּשְׂדִּים
  choice: కల్దీయులు
  rationale: దాడి చేసిన జాతి సమూహాన్ని సూచించే ethnonymకు ప్రామాణిక తెలుగు రూపం.
- source_word: שָׂמוּ שְׁלֹשָׁה רָאשִׁים
  choice: మూడు దాడి బృందాలుగా ఏర్పడి
  rationale: అక్షరార్థం ‘మూడు తలలను పెట్టారు’; ఈ సైనిక సందర్భంలో మూడు విభాగాలు లేదా బృందాలుగా మోహరించడాన్ని సూచిస్తుంది. ‘దాడి బృందాలు’ సందర్భార్థాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: וַיִּפְשְׁטוּ עַל
  choice: మీదికి విరుచుకుపడి
  rationale: పఠాత్తుగా దాడి చేయడం లేదా దోపిడీ దాడిగా మీదపడడం అనే చలనాత్మక భావాన్ని సహజ తెలుగులో నిలుపుతుంది.
- source_word: וַיִּקָּחוּם
  choice: వాటిని పట్టుకుపోయారు
  rationale: ప్రత్యయం ఒంటెలను సూచిస్తుంది; దాడి సందర్భంలో לקח స్వాధీనం చేసుకొని తీసుకుపోవడాన్ని సూచిస్తుంది.
- source_word: הַנְּעָרִים
  choice: యువకులను
  rationale: נְעָרִים యొక్క ప్రాథమిక భావాన్ని నిలిపాం; ఈ సందర్భంలో సేవకులు లేదా పరిచారకులు కావచ్చనే భావాన్ని పాదసూచికలో ఉంచాం.
- source_word: הִכּוּ לְפִי חָרֶב
  choice: కత్తివాతకు హతమార్చారు
  rationale: ‘కత్తి నోటి/అంచు చేత కొట్టారు’ అనే హీబ్రూ నుడికారానికి మరణార్థం ఉంది. ‘కత్తివాతకు’ నుడికారపు చిత్రాన్ని తెలుగు రీతిలో కొంత నిలుపుతూ, ‘హతమార్చారు’ ఫలితాన్ని స్పష్టం చేస్తుంది.
- source_word: וָאִמָּלְטָה רַק אֲנִי לְבַדִּי
  choice: నేనొక్కడినే తప్పించుకున్నాను
  rationale: רַק ... לְבַדִּיలోని ఏకైక జీవించి తప్పించుకున్న వ్యక్తిపై ఉన్న ఉద్ఘాటనను సంక్షిప్తమైన సహజ తెలుగులో నిలుపుతుంది.
- source_word: לְהַגִּיד לָךְ
  choice: నీకు ఈ సంగతి చెప్పడానికి
  rationale: దూత అత్యవసరంగా వార్త తెలియజేయడానికి తప్పించుకున్నాడనే కథన సూత్రాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
