source:
  edition: WLC
  text: ע֣וֹד זֶ֣ה מְדַבֵּ֗ר וְ/זֶה֮ בָּ֣א וַ/יֹּאמַר֒ אֵ֣שׁ אֱלֹהִ֗ים נָֽפְלָה֙ מִן הַ/שָּׁמַ֔יִם וַ/תִּבְעַ֥ר בַּ/צֹּ֛אן וּ/בַ/נְּעָרִ֖ים וַ/תֹּאכְלֵ֑/ם וָ/אִמָּ֨לְטָ֧/ה רַק אֲנִ֛י לְ/בַדִּ֖/י לְ/הַגִּ֥יד לָֽ/ךְ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/001/016.yaml
  text: While this one was still speaking, another came and said, “Fire of God fell from heaven and burned among the sheep and the young men and consumed them, and I alone have escaped to tell you.”
translation:
  language: te
  text: అతడు ఇంకా మాట్లాడుతుండగానే మరొకడు వచ్చి, “దేవుని అగ్ని ఆకాశం నుండి పడి, గొర్రెల మధ్యా యువకుల మధ్యా మండుతూ, వాటినీ వారినీ దహించివేసింది. నీకు తెలియజేయడానికి నేను ఒక్కడినే తప్పించుకున్నాను” అన్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵשׁ אֱלֹהִים
  choice: దేవుని అగ్ని
  rationale: హీబ్రూ పదబంధాన్ని నేరుగా నిలుపుతుంది; ఇది దేవుడు పంపిన అగ్ని, అసాధారణమైన అగ్ని, లేదా పిడుగు వంటి భావాలను సూచించవచ్చు కాబట్టి అస్పష్టతను పరిష్కరించకుండా ఉంచాం.
- source_word: בַצֹּאן וּבַנְּעָרִים
  choice: గొర్రెల మధ్యా పనివారి మధ్యా
  rationale: ב־ ఉపసర్గానికి ‘మధ్య’ అనే స్థానార్థాన్ని నిలిపాం. ఈ సందర్భంలో נְעָרִים యోబు సేవలో ఉన్న యువ పనివారిని సూచిస్తుంది; సహజమైన తెలుగుకోసం ‘పనివారు’ ఎంచుకున్నాం.
- source_word: וַתֹּאכְלֵם
  choice: వారిని దహించివేసింది
  rationale: అగ్ని ‘తినివేసింది’ అనే హీబ్రూ రూపకానికి తెలుగులో సహజమైన అగ్ని-సంబంధ క్రియను వాడి, సంపూర్ణ వినాశ భావాన్ని నిలిపాం.
- source_word: וָאִמָּלְטָה רַק אֲנִי לְבַדִּי
  choice: నేను ఒక్కడినే తప్పించుకున్నాను
  rationale: రַק మరియు לְבַדִּי కలిగించే బలమైన ఏకైక-ప్రాణరక్షణ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ‘దేవుని అగ్ని’ అనే పదబంధం యొక్క కారణార్థం
  choice: దేవుని అగ్ని
  alternative: దేవుడు పంపిన అగ్ని / పిడుగు
  rationale: మూలపాఠం అగ్ని స్వభావాన్ని లేదా దేవుని ప్రత్యక్ష కారణత్వాన్ని స్పష్టంగా నిర్ధారించదు. అనువాదంలో ఆ వేదాంతపరమైన ఉద్రిక్తతను పరిష్కరించలేదు.
- issue: נְעָרִים యొక్క సందర్భార్థం
  choice: పనివారు
  alternative: యువకులు
  rationale: యోబు 1లో మందలను చూసుకునే సేవకుల సందర్భం ‘పనివారు’ అనే అర్థాన్ని బలపరుస్తుంది; అయితే పదానికి ‘యువకులు’ అనే మూలార్థం కూడా ఉంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కథనానికి తగిన గంభీరతతో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే వాక్యనిర్మాణం. ఒకే అగ్ని గొర్రెలనూ పనివారినీ దహించినందున ఏకవచన ‘వారిని’ రెండింటినీ సమష్టిగా సూచిస్తుంది.
