  text: וְ/הָלְכ֤וּ בָנָי/ו֙ וְ/עָשׂ֣וּ מִשְׁתֶּ֔ה בֵּ֖ית אִ֣ישׁ יוֹמ֑/וֹ וְ/שָׁלְח֗וּ וְ/קָרְאוּ֙ לִ/שְׁלֹ֣שֶׁת אחיתי/הם לֶ/אֱכֹ֥ל וְ/לִ/שְׁתּ֖וֹת עִמָּ/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/job/001/004.yaml
  text: His sons would go and hold a feast[a], each in his own house on his day, and they would send and invite their three sisters to eat and drink with them.
translation:
  language: te
  text: అతని కుమారులు తమ తమ రోజున, ఒక్కొక్కరు తమ తమ ఇంట్లోకి వెళ్లి విందు చేసేవారు.[a] వారు తమ ముగ్గురు అక్కచెల్లెళ్లను తమతో కలిసి తిని తాగడానికి కబురు పంపి పిలిచేవారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, బహుశా “తమ తమ పుట్టినరోజున.” హీబ్రూ పాఠంలో అక్షరార్థంగా “తన రోజున” అని ఉంది. ఇది ప్రతి కుమారునికి నిర్ణయించబడిన వంతు రోజును గానీ, అతని పుట్టినరోజును గానీ సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָלְכוּ
  choice: చేసేవారు / పిలిచేవారు
  rationale: సందర్భంలో ఇది గతంలో పదేపదే జరిగే ఆచారాన్ని సూచిస్తుంది; అందువల్ల తెలుగులో అలవాటును తెలిపే ‘-ేవారు’ రూపం వాడబడింది. ‘వెళ్లేవారు’ అని విడిగా అనువదించడం సహజ తెలుగులో అవసరం లేకుండా భావాన్ని భారంగా చేస్తుంది.
- source_word: בָנָיו
  choice: అతని కుమారులు
  rationale: హీబ్రూ పదం పురుష బహువచనం; తరువాత కుమార్తెలు విడిగా ప్రస్తావించబడటంతో ‘పిల్లలు’ అనే సాధారణ పదం కాకుండా ‘కుమారులు’ సరైనది.
- source_word: וְעָשׂוּ מִשְׁתֶּה
  choice: విందు చేసేవారు
  rationale: ‘విందు ఏర్పాటు చేయడం/జరుపుకోవడం’ అనే హీబ్రూ నుడికారాన్ని సాధారణ ఆధునిక తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: בֵּית אִישׁ
  choice: ఒక్కొక్కరు … తమ ఇంట్లో
  rationale: ప్రతి కుమారుడు తన ఇంట్లో వంతులవారీగా విందు చేసేవాడనే పంపిణీ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: יוֹמוֹ
  choice: తమ తమ రోజున
  rationale: మూలంలో అక్షరార్థంగా ‘అతని రోజు’ ఉంది. అది నిర్ణయించబడిన వంతు రోజునో పుట్టినరోజునో కావచ్చు; ప్రధాన పాఠం ఆ అస్పష్టతను నిలుపుతుంది.
- source_word: וְשָׁלְחוּ וְקָרְאוּ
  choice: కబురు పంపి పిలిచేవారు
  rationale: సందేశం పంపడం, ఆహ్వానించడం అనే రెండు క్రియల భావాన్నీ సహజమైన తెలుగు ప్రయోగంలో నిలుపుతుంది.
- source_word: לִשְׁלֹשֶׁת אֲחִיתֵיהֶם
  choice: తమ ముగ్గురు అక్కచెల్లెళ్లను
  rationale: తెలుగులో ‘సోదరీమణులు’ కంటే ‘అక్కచెల్లెళ్లు’ సాధారణ పాఠకులకు సహజంగా ఉంటుంది; ముగ్గురు స్త్రీ సహోదరులనే ఖచ్చితంగా సూచిస్తుంది.
- source_word: לֶאֱכֹל וְלִשְׁתּוֹת
  choice: తిని తాగడానికి
  rationale: విందులో పాలుపంచుకోవడాన్ని తెలిపే రెండు క్రియలను సరళంగా, నేరుగా అనువదిస్తుంది.
- source_word: עִמָּהֶם
  choice: తమతో కలిసి
  rationale: సోదరులతో కలిసి విందులో పాలుపంచుకోవడం అనే సహభాగిత భావాన్ని స్పష్టంగా వ్యక్తపరుస్తుంది.
