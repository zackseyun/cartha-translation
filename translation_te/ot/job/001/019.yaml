translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘ఇదిగో’ మూలంలోని సజీవ సూచనను నిలుపుతుంది; ఇల్లు కూలిందనే కర్తను తెలుగులో స్పష్టత కోసం పునరుక్తి చేసింది.
