id: JOB.1.19
reference: Job 1:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הִנֵּה֩ ר֨וּחַ גְּדוֹלָ֜ה בָּ֣אָה מֵ/עֵ֣בֶר הַ/מִּדְבָּ֗ר וַ/יִּגַּע֙ בְּ/אַרְבַּע֙ פִּנּ֣וֹת הַ/בַּ֔יִת וַ/יִּפֹּ֥ל עַל הַ/נְּעָרִ֖ים וַ/יָּמ֑וּתוּ וָ/אִמָּ֨לְטָ֧/ה רַק אֲנִ֛י לְ/בַדִּ֖/י לְ/הַגִּ֥יד לָֽ/ךְ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/001/019.yaml
  text: And behold[a], a great wind came from across the wilderness and struck the four corners of the house, and it fell on the young men, and they died[b]; and I alone have escaped to tell you.
translation:
  language: te
  text: ఇదిగో, అరణ్యానికి అవతలి వైపు నుంచి ఒక పెనుగాలి[a] వచ్చి ఇంటి నాలుగు మూలలను కొట్టింది. అప్పుడు ఆ ఇల్లు యువకుల[b] మీద కూలిపోవడంతో వారు చనిపోయారు. నీకు చెప్పడానికి నేను ఒక్కడినే తప్పించుకున్నాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘బలమైన గాలి,’ లేదా ‘భీకరమైన తుఫానుగాలి.’
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ పదానికి ‘యువకులు,’ ‘యువజనులు,’ లేదా కొన్ని సందర్భాల్లో ‘సేవకులు’ అని అర్థం కావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: వార్తలోని ఆకస్మికతను, దృశ్య సజీవతను తెలిపే హీబ్రూ సూచనార్థక ప్రయోగాన్ని గౌరవప్రదమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: רוּחַ גְּדוֹלָה
  choice: ఒక పెనుగాలి
  rationale: ఈ సందర్భంలో רוּחַ అంటే ఆత్మ లేదా ఊపిరి కాదు, గాలి. విపత్తు కలిగించే గొప్ప బలమైన గాలిని ‘పెనుగాలి’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בָּאָה מֵעֵבֶר הַמִּדְבָּר
  choice: అరణ్యానికి అవతలి వైపు నుంచి ... వచ్చి
  rationale: מֵעֵבֶר లోని ‘అవతలి వైపు నుండి’ అనే దిశార్థాన్ని భౌగోళిక వివరాలు అదనంగా చేర్చకుండా నిలుపుతుంది.
- source_word: וַיִּגַּע בְּאַרְבַּע פִּנּוֹת הַבַּיִת
  choice: ఇంటి నాలుగు మూలలను కొట్టింది
  rationale: נגע అనే క్రియకు తాకడం, చేరడం, కొట్టడం అనే అర్థాలు ఉండవచ్చు; తరువాత ఇల్లు కూలిపోవడం వల్ల ఇక్కడ బలమైన ఢీకొనడాన్ని ‘కొట్టింది’ సహజంగా తెలియజేస్తుంది.
- source_word: וַיִּפֹּל עַל הַנְּעָרִים
  choice: ఆ ఇల్లు యువకుల మీద కూలిపోవడంతో
  rationale: ఏకవచన క్రియకు ముందున్న ‘ఇల్లు’ కర్తగా ఉంది; తెలుగులో సందిగ్ధత లేకుండా దానిని మళ్లీ స్పష్టంగా పేర్కొంది. ‘యువకులు’ హీబ్రూ పుంలింగ బహువచనాన్ని, దాని వయోసూచనను నిలుపుతుంది.
- source_word: וַיָּמֻתוּ
  choice: వారు చనిపోయారు
  rationale: కారణార్థక భావాన్ని అదనంగా చేర్చకుండా హీబ్రూ క్రియను నేరుగా అనువదిస్తుంది.
- source_word: וָאִמָּלְטָה רַק אֲנִי לְבַדִּי
  choice: నేను ఒక్కడినే తప్పించుకున్నాను
  rationale: רַק మరియు לְבַדִּי కలిగించే బలమైన ఏకైకత్వాన్ని తెలుగులో అనవసర పునరుక్తి లేకుండా తెలియజేస్తుంది.
- source_word: לְהַגִּיד לָךְ
  choice: నీకు చెప్పడానికి
  rationale: ఈ అధ్యాయంలోని దూత వార్త చెప్పే సూత్రానికి సరిపోయే సరళమైన, సహజమైన అనువాదం.
