id: JOB.1.8
reference: Job 1:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל הַ/שָּׂטָ֔ן הֲ/שַׂ֥מְתָּ לִבְּ/ךָ֖ עַל עַבְדִּ֣/י אִיּ֑וֹב כִּ֣י אֵ֤ין כָּמֹ֨/הוּ֙ בָּ/אָ֔רֶץ אִ֣ישׁ תָּ֧ם וְ/יָשָׁ֛ר יְרֵ֥א אֱלֹהִ֖ים וְ/סָ֥ר מֵ/רָֽע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/001/008.yaml
  text: 'And Yahweh said to the Accuser[a], “Have you set your heart on my servant Job? For there is none like him on the earth: a blameless and upright man[b], one who fears God and turns away from evil.”'
translation:
  language: te
  text: 'యహ్వే నిందారోపకునితో[a] ఇలా అన్నాడు: “నా సేవకుడైన యోబు విషయంలో నీ మనసు పెట్టావా?[b] ఎందుకంటే భూమిమీద అతనిలాంటి వాడు మరొకడు లేడు—అతడు నిష్కళంకుడైన, యథార్థవంతుడైన మనిషి; దేవునికి భయపడి, చెడును విడిచిపెట్టేవాడు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీలో ‘నిందారోపకుడు’ అనే పదానికి నిర్దిష్ట ఉపపదం ఉంది; ఇక్కడ అది వ్యక్తినామం కంటే ఒక బిరుదు లేదా పాత్రను సూచిస్తున్నట్లు కనిపిస్తుంది. సంప్రదాయంగా ‘సాతాను’ అని అనువదిస్తారు.
    reason: alternative_reading
  - marker: b
    text: అక్షరార్థంగా, ‘నా సేవకుడైన యోబు మీద నీ హృదయాన్ని ఉంచావా?’ అంటే, ‘అతని మీద ఉద్దేశపూర్వకంగా దృష్టి పెట్టావా?’
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో వ్యక్తిగత నామంగా ఉంచాం.
- source_word: הַשָּׂטָן
  choice: నిందారోపకుడు
  rationale: నిర్దిష్ట ఉపపదంతో ఉన్న హెబ్రీ పదం ఇక్కడ వ్యక్తినామం కంటే పాత్ర లేదా బిరుదును సూచిస్తుంది. పరలోక న్యాయసభ సందర్భంలోని ఆరోపణ చేసే పాత్రను ‘నిందారోపకుడు’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: הֲשַׂמְתָּ לִבְּךָ עַל
  choice: మీద నీ మనసు నిలిపావా?
  rationale: ‘నీ హృదయాన్ని ఉంచావా?’ అనే మూలభాషా రూపకాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతూ, ఉద్దేశపూర్వకంగా దృష్టి పెట్టడం అనే భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: עַבְדִּי
  choice: నా సేవకుడైన
  rationale: ఈ సందర్భంలో దేవునికి చెందినవాడై ఆయనను సేవించే యోబు స్థితినే సూచిస్తుంది; సామాజిక బానిసత్వాన్ని కాదు.
- source_word: כִּי אֵין כָּמֹהוּ בָּאָרֶץ
  choice: భూమి మీద అతనిలాంటి వాడు మరొకడు లేడు
  rationale: యోబు స్వభావానికి సాటిలేదనే విశ్వవ్యాప్త భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: אִישׁ
  choice: మనిషి
  rationale: యోబును ఒక వ్యక్తిగా సూచిస్తూ, తెలుగులో సహజంగా వినిపించే పదాన్ని ఎంచుకున్నాం.
- source_word: תָּם
  choice: నిందలేని
  rationale: పాపరహిత పరిపూర్ణతను కాక, నీతి సమగ్రతను సూచిస్తుంది.
- source_word: יָשָׁר
  choice: యథార్థమైన
  rationale: నైతిక నిటారుతనం, సత్యనిష్ఠ అనే భావాలను సహజమైన తెలుగులో అందిస్తుంది.
- source_word: יְרֵא אֱלֹהִים
  choice: దేవునికి భయపడి
  rationale: భక్తిపూర్వక భయం, గౌరవం అనే బైబిలీయ భావభారాన్ని తగ్గించకుండా ఉంచుతుంది.
- source_word: וְסָר מֵרָע
  choice: చెడుకు దూరంగా ఉంటాడు
  rationale: చెడును అలవాటుగా విడిచిపెట్టి, దానికి దూరంగా ఉండే నిరంతర స్వభావాన్ని స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: הַשָּׂטָן అనే పదాన్ని వ్యక్తినామంగా అనువదించాలా, పాత్ర లేదా బిరుదుగా అనువదించాలా
  choice: నిందారోపకుడు
  alternative: సాతాను; విరోధి
  rationale: హెబ్రీలోని నిర్దిష్ట ఉపపదం ఈ సందర్భంలో వ్యక్తినామం కంటే పాత్రను బలంగా సూచిస్తుంది. అందువల్ల తరువాతి కాలపు వ్యక్తినామ వినియోగాన్ని ముందుగానే పాఠ్యంలోకి తేవకుండా పాత్రార్థాన్ని నిలిపాం.
- issue: תָּם సంపూర్ణ పాపరాహిత్యాన్ని సూచిస్తుందా
  choice: నిందలేని—నైతిక సమగ్రత అనే అర్థంలో
  alternative: పరిపూర్ణమైన
  rationale: జ్ఞానసాహిత్య సందర్భం మరియు ‘యథార్థమైన’ అనే జతపదం సంపూర్ణ పాపరాహిత్యం కంటే సద్గుణ సమగ్రతను సూచిస్తాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే శైలిని ఉపయోగించాం. హెబ్రీ రూపకాన్ని సహజీకరించి నిలిపాం; ‘నిందలేని’ అనే పదం సంపూర్ణ పాపరాహిత్యంగా అపార్థం కాకుండా నిర్ణయాల్లో స్పష్టం చేశాం.
