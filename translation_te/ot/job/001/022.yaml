  yaml_path: translation/ot/job/001/022.yaml
  text: In all this[a], Job did not sin, nor did he charge God with wrongdoing.
translation:
  language: te
  text: ఇవన్నిటిలో యోబు పాపం చేయలేదు; దేవునికి ఏ తప్పునూ ఆపాదించలేదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దేవునికి మూర్ఖత్వాన్ని ఆపాదించలేదు”; లేదా, “దేవునిలో అనుచితమైనది ఉందని చెప్పలేదు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּכָל זֹאת
  choice: ఇదంతా జరిగినా
  rationale: ముందు వివరించిన విపత్తులన్నిటినీ సమగ్రంగా సూచిస్తుంది. సందర్భంలో ప్రతికూల పరిస్థితుల మధ్య కూడా యోబు స్పందన మారలేదనే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: לֹא חָטָא
  choice: పాపం చేయలేదు
  rationale: חטא అనే సాధారణ ధార్మిక-నైతిక క్రియ యొక్క నేరుగా ఉన్న అర్థాన్ని బలహీనపరచకుండా నిలుపుతుంది.
- source_word: אִיּוֹב
  choice: యోబు
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: וְלֹא נָתַן
  choice: ఆపాదించలేదు
  rationale: נתן అక్షరార్థంగా ‘ఇవ్వడం’ అయినా, תִּפְלָה మరియు לֵאלֹהִיםతో కలిసి ఇక్కడ ‘దేవునికి ఏదో తప్పును అంటగట్టడం/ఆపాదించడం’ అనే ప్రయోగార్థాన్ని ఇస్తుంది.
- source_word: תִּפְלָה
  choice: ఏ తప్పునూ
  rationale: ఈ అరుదైన పదం మూర్ఖత్వం, అనుచితత్వం లేదా నిందార్హమైన తప్పు అనే అర్థపరిధిని కలిగి ఉంది. ‘తప్పు’ ఆధునిక తెలుగులో దేవునిపై నైతిక నింద మోపలేదనే సందర్భార్థాన్ని స్పష్టంగా ఇస్తుంది; ప్రత్యామ్నాయాలను పాదసూచికలో ఉంచాం.
- source_word: לֵאלֹהִים
  choice: దేవునికి
  rationale: ל ఉపసర్గను ఆపాదనకు పరోక్ష కర్మగా సహజంగా తెలుగులో ‘దేవునికి’ అని చూపుతుంది.
theological_decisions:
- issue: תִּפְלָהను దేవునికి సంబంధించి ఎలా అనువదించాలి
  choice: దేవునికి ఏ తప్పునూ ఆపాదించలేదు
  alternative: దేవునికి మూర్ఖత్వాన్ని ఆపాదించలేదు; దేవునిలో అనుచితమైనది ఉందని చెప్పలేదు
  rationale: యోబు తన విపత్తుల కారణంగా దేవునిపై నింద మోపలేదనే ప్రధాన భావాన్ని ఇది స్పష్టంగా నిలుపుతుంది. అదే సమయంలో మూలపదంలోని ‘మూర్ఖత్వం/అనుచితత్వం’ అనే సాధ్యమైన అర్థాలను పాదసూచికలో భద్రపరుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన వాక్య నిర్మాణం. ‘ఆపాదించలేదు’ అనే పదం మూలంలోని ఆరోపణ/అంటగట్టడం భావాన్ని కచ్చితంగా ఇస్తుంది. పాదసూచిక సూచిక [a] ప్రధాన పాఠ్యంలో ఉంచబడింది.
