source:
  edition: WLC
  text: עֹֽשֶׂה עָ֭שׁ כְּסִ֥יל וְ/כִימָ֗ה וְ/חַדְרֵ֥י תֵמָֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/009.yaml
  text: who made the Bear[a], Orion, and the Pleiades[c][b], and the chambers of the south.
translation:
  language: te
  text: సప్తర్షి మండలాన్ని[b], ఓరియన్‌ను, ప్లియడీస్ నక్షత్రగుచ్ఛాన్ని, దక్షిణ దిక్కులోని గదులను[c] సృష్టించినవాడు ఆయనే.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘సృష్టించేవాడు ఆయనే’ అని కూడా అనువదించవచ్చు. హీబ్రూ కర్తృవాచక రూపం కొనసాగుతున్న కార్యాన్ని గానీ, పూర్తయిన కార్యాన్ని గానీ సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో ఇది ఒక నక్షత్రరాశి పేరు. దీనిని సాధారణంగా సప్తర్షి మండలం లేదా మహా భల్లూక నక్షత్రరాశిగా గుర్తిస్తారు; పాత అనువాదాల్లో కొన్నిసార్లు ‘ఆర్క్టూరస్’ అని ఉంది.
    reason: alternative_reading
  - marker: c
    text: ‘దక్షిణ దిక్కులోని గదులు’ అనేది దక్షిణాకాశంలోని దాగివున్న ప్రాంతాలను లేదా నక్షత్రరాశులను సూచించే కవితాత్మక వర్ణన కావచ్చు.
    reason: cultural_note
lexical_decisions:
- source_word: עֹשֶׂה
  choice: సృష్టించినవాడు
  rationale: ఇది עשה అనే క్రియ యొక్క ఖాల్ కర్తృవాచక రూపం. ముందటి వచనంలో మొదలైన దేవుని వర్ణనను కొనసాగిస్తూ, నక్షత్ర సముదాయాలను ఉనికిలోకి తెచ్చినవాడిగా ఆయనను సూచిస్తుంది. సందర్భంలో పూర్తయిన సృష్టికార్యాన్ని సహజంగా వ్యక్తపరచడానికి ఈ రూపాన్ని ఎంచుకున్నాం; కొనసాగుతున్న చర్య భావం కూడా వ్యాకరణపరంగా సాధ్యమేనని పాదసూచికలో ఉంచాం.
- source_word: עָשׁ
  choice: సప్తర్షి మండలం
  rationale: ఇది ఒక నక్షత్రరాశి పేరు; సాధారణంగా మహా భల్లూకం (Great Bear/Ursa Major)తో గుర్తించబడుతుంది. ఆధునిక తెలుగు పాఠకులకు సుపరిచితమైన ‘సప్తర్షి మండలం’ అనే పేరును వాడాం; గుర్తింపు విషయంలో ఉన్న స్వల్ప అనిశ్చితిని పాదసూచికలో తెలిపాం.
- source_word: כְּסִיל
  choice: ఓరియన్
  rationale: ఖగోళ సందర్భాల్లో ఈ పదం సాధారణంగా ఓరియన్ నక్షత్రరాశిని సూచిస్తుంది. భారతీయ నక్షత్రపేర్లతో కచ్చితంగా సమానీకరించడం వల్ల కలిగే గందరగోళాన్ని నివారించడానికి అంతర్జాతీయంగా ప్రాచుర్యంలో ఉన్న పేరును తెలుగు లిపిలో ఇచ్చాం.
- source_word: כִימָה
  choice: ప్లియడీస్ నక్షత్రగుచ్ఛం
  rationale: ఈ పదాన్ని సంప్రదాయంగా ప్లియడీస్ నక్షత్రగుచ్ఛంతో గుర్తిస్తారు. ఇది ఒక్క నక్షత్రం కాదని స్పష్టమయ్యేలా ‘నక్షత్రగుచ్ఛం’ అని చేర్చాం.
- source_word: חַדְרֵי תֵמָן
  choice: దక్షిణ దిక్కులోని గదులు
  rationale: అక్షరార్థంగా ‘దక్షిణపు గదులు/అంతర్గదులు.’ నక్షత్రరాశుల సందర్భంలో ఇది దక్షిణాకాశంలోని కనబడని ప్రాంతాలను కవితాత్మకంగా సూచించే అవకాశం ఉంది. రూపకాన్ని కాపాడుతూ అతిగా వ్యాఖ్యానించకుండా ‘గదులు’ అని అనువదించాం; תֵמָןను స్థలనామంగా కాక దిశను సూచించే ‘దక్షిణం’గా తీసుకున్నాం.
