translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన కవితా శైలిని అనుసరించాం. అంతర్జాతీయ ఖగోళ పేర్లను తెలుగు లిపిలో ఇచ్చి, బాగా స్థిరపడిన చోట ‘సప్తర్షి మండలం’ అనే సుపరిచిత తెలుగు పేరును వాడాం. మూలంలోని ‘గదులు’ అనే కవితాత్మక రూపకాన్ని అలాగే నిలిపాం.
