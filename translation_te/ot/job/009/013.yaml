source:
  edition: WLC
  text: אֱ֭לוֹהַּ לֹא יָשִׁ֣יב אַפּ֑/וֹ תחת/ו שָׁ֝חֲח֗וּ עֹ֣זְרֵי רָֽהַב־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/013.yaml
  text: God does not turn back his anger; beneath him the helpers of Rahab crouch.
translation:
  language: te
  text: 'దేవుడు తన కోపాన్ని వెనక్కి తీసుకోడు;

    రాహాబు సహాయకులు[a] ఆయన కింద వంగిపోతారు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “రాహాబు” ఇక్కడ దేవునికి ఎదిరించే ఆదిమ కల్లోల శక్తికి కవితాత్మక పేరు కావచ్చు; దాని “సహాయకులు” ఆ శక్తితో కూడినవారు. కొన్ని సందర్భాల్లో రాహాబు ఈజిప్టుకు ప్రతీకగా కూడా వాడబడుతుంది.
    reason: హీబ్రూ רָהַב యొక్క సూచన ఈ వచనంలో పూర్తిగా నిర్దిష్టం కాదు. లిప్యంతరీకరణ మూలంలోని అస్పష్టతను నిలుపుతుంది; పాదసూచిక ప్రధాన సాధ్యతలను సూచిస్తుంది.
lexical_decisions:
- source_word: אֱלוֹהַּ
  choice: దేవుడు
  rationale: ఏకవచన దైవనామానికి సహజమైన, గౌరవప్రదమైన ఆధునిక తెలుగు రూపం.
- source_word: לֹא יָשִׁיב אַפּוֹ
  choice: తన కోపాన్ని వెనక్కి తిప్పడు
  rationale: ‘కోపాన్ని మరలించడు/ఉపసంహరించడు’ అనే హీబ్రూ భావాన్ని రూపక స్వరూపంతోనే ఉంచుతుంది.
- source_word: תַּחְתָּיו
  choice: ఆయన కింద
  rationale: స్థానార్థకమైన ‘అతని కింద’ అనే మూలపాఠ భావాన్ని దేవునికి తగిన గౌరవ ఏకవచనంతో వ్యక్తపరుస్తుంది.
- source_word: שָׁחֲחוּ
  choice: అణగి వంగుతారు
  rationale: కేవలం నమస్కరించడం కంటే ఓడిపోయి కుంగిపోవడం/కిందికి వంగడం అనే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; హీబ్రూ సంపూర్ణ క్రియకు సందర్భానుగుణంగా సాధారణ వర్తమాన రూపం వాడబడింది.
- source_word: עֹזְרֵי רָהַב
  choice: రాహాబుకు సహాయం చేసేవారు
  rationale: సమాసంలోని ‘రాహాబు సహాయకులు’ అనే సంబంధాన్ని స్పష్టంగా ఉంచి, రాహాబు గుర్తింపును ప్రధాన పాఠంలో నిర్ణయించకుండా లిప్యంతరీకరించింది.
theological_decisions:
- issue: רָהַב (రాహాబు) యొక్క గుర్తింపు
  choice: పేరును ‘రాహాబు’గా లిప్యంతరీకరించి వివరణను పాదసూచికలో ఇవ్వడం
  alternative: ‘అహంకారం’, ‘సముద్ర రాక్షసి’, లేదా ‘ఈజిప్టు’ అని నేరుగా అనువదించడం
  rationale: ఈ సందర్భంలో అది ఆదిమ కల్లోల శక్తిని సూచించే కవితాత్మక పేరు కావచ్చు; ఇతర గ్రంథస్థలాల్లో ఈజిప్టుకు ప్రతీకగా కూడా వస్తుంది. ఒకే అర్థాన్ని ప్రధాన పాఠంలో ఖరారు చేయడం మూలంలోని నిజమైన అస్పష్టతను తొలగిస్తుంది.
- issue: దేవుని కోపం ‘వెనక్కి తిప్పకపోవడం’
  choice: వాక్యంలోని నిర్బంధ ప్రకటనను యథాతథంగా ఉంచడం
  alternative: దేవుడు ఎప్పటికీ కోపాన్ని తగ్గించడు అని సిద్ధాంతాత్మకంగా విస్తరించడం
  rationale: ఇది యోబు ప్రసంగంలోని సందర్భబద్ధమైన వాక్యం; మూలపాఠం చెప్పనిదాన్ని చేర్చకుండా దాని ఉద్వేగాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కవితాత్మక గంభీరతను నిలుపుతూ సాధారణ పాఠకుడికి అర్థమయ్యే పదజాలం వాడబడింది. ‘ఆయన’ దేవునికి గౌరవ సూచకంగా ఉంది. పాదసూచిక గుర్తు ప్రధాన పాఠంలో చేర్చబడింది.
