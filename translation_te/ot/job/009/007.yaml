translation:
  language: te
  text: సూర్యునితో[a], ‘ఉదయించవద్దు’ అని[b] చెప్పేవాడు నక్షత్రాలను మూసివేస్తాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడి హెబ్రీ పదం חֶרֶס కవితాత్మక ప్రయోగంలో బహుశా ‘సూర్యుడు’ అని అర్థం; ఇతర సందర్భాల్లో అది మట్టిని లేదా మట్టిపాత్రను సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, మరింత అక్షరార్థంగా, “మరియు అది ఉదయించదు”; హెబ్రీ వాక్యం సూర్యునికి ఇచ్చిన ఆజ్ఞనుగానీ, దేవుని మాట ఫలితాన్నిగానీ సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֹמֵר
  choice: చెప్పేవాడు
  rationale: ఈ కృదంతం ముందు వచనంలోని దేవుని వర్ణనను కొనసాగిస్తూ, ‘చెప్పేవాడు’ అనే సంబంధార్థక భావాన్ని ఇస్తుంది.
- source_word: לַחֶרֶס
  choice: సూర్యునితో
  rationale: ‘ఉదయించు,’ ‘నక్షత్రాలు’ అనే సందర్భంలో חֶרֶס కవితాత్మకంగా సూర్యుణ్ణి సూచిస్తుంది; ‘మట్టి’ అనే సాధారణ అర్థం ఇక్కడ సరిపోదు.
- source_word: וְלֹא יִזְרָח
  choice: ‘ఉదయించవద్దు’
  rationale: సూర్యునితో పలికిన ఆజ్ఞగా తీసుకోవడం కవితాత్మక వ్యక్తీకరణను సహజంగా నిలుపుతుంది; దేవుని మాట ఫలితంగా ‘అది ఉదయించదు’ అనే అర్థం కూడా సాధ్యమే కాబట్టి పాదసూచికలో ఉంచబడింది.
- source_word: וּבְעַד
  choice: మూసివేస్తాడు అనే ప్రయోగంలో అంతర్భూతం
  rationale: חתםతో కలిసి ఈ ఉపసర్గ నక్షత్రాలు కనిపించకుండా వాటిమీద మూతవేసే భావాన్ని ఇస్తుంది; తెలుగులో దాన్ని విడిగా అనువదిస్తే అసహజంగా ఉంటుంది.
- source_word: כּוֹכָבִים
  choice: నక్షత్రాలను
  rationale: ఇది ‘నక్షత్రాలు’ అనే సాధారణ బహువచన నామవాచకం; వాక్యంలో కర్మగా సహజ తెలుగు రూపం వాడబడింది.
- source_word: יַחְתֹּם
  choice: మూసివేస్తాడు
  rationale: మూలపదానికి ‘ముద్రవేయు’ అనే ప్రాథమిక భావం ఉంది; ఇక్కడ నక్షత్రాలు కనిపించకుండా మూసివేయడమనే రూపకాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: וְלֹא יִזְרָח యొక్క వాక్య సంబంధం
  choice: 'సూర్యునికి ఇచ్చిన ఆజ్ఞగా: ‘ఉదయించవద్దు’'
  alternative: 'దేవుని మాట ఫలితంగా: ‘అది ఉదయించదు’'
  rationale: రెండు అర్థాలూ హెబ్రీలో సాధ్యమే. ప్రధాన పాఠం సజీవమైన ఆజ్ఞార్థ భావాన్ని అనుసరిస్తూ, ప్రత్యామ్నాయాన్ని పాదసూచికలో కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కవితాత్మక శైలి. ‘ముద్రవేస్తాడు’ కంటే సందర్భార్థాన్ని స్పష్టంగా తెలిపే ‘మూసివేస్తాడు’ ఎంచుకోబడింది. ప్రతి పాదసూచిక గుర్తు సంబంధిత పదబంధం వెంట ప్రధాన పాఠంలో ఉంచబడింది.
