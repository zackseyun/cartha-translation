source:
  edition: WLC
  text: אִם הִתְרָחַ֥צְתִּי במו שָׁ֑לֶג וַ֝/הֲזִכּ֗וֹתִי בְּ/בֹ֣ר כַּפָּֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/030.yaml
  text: If I washed myself with snow and cleansed my hands with lye,[a]
translation:
  language: te
  text: 'నేను మంచుతో కడుక్కొని,

    క్షారంతో[a] నా చేతులను శుభ్రం చేసుకున్నా,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సబ్బుతో”; హీబ్రూ పదం మరింత ఖచ్చితంగా క్షారం వంటి శుభ్రపరిచే పదార్థాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: చేసుకున్నా
  rationale: ఇక్కడ אִם ఊహాత్మక షరతును ప్రవేశపెడుతుంది. తరువాతి వచనంతో కలిసి తెలుగులో సహజంగా వినిపించేందుకు ‘చేసుకున్నా’ అనే షరతార్థక రూపం వాడబడింది.
- source_word: הִתְרָחַצְתִּי
  choice: నేను ... కడుక్కొని
  rationale: רחץ యొక్క హిత్పయేల్ రూపంలోని ఆత్మార్థక భావాన్ని ‘కడుక్కొని’ సహజంగా తెలియజేస్తుంది.
- source_word: במו שָׁלֶג
  choice: మంచుతో
  rationale: హీబ్రూ పదబంధం మంచును శుద్ధి సాధనంగా సూచిస్తుంది; పాఠ్యంలో లేని ‘మంచునీరు’ అనే వివరణను చేర్చకుండా ‘మంచుతో’ అని అనువదించబడింది.
- source_word: וַהֲזִכּוֹתִי
  choice: శుభ్రం చేసుకున్నా
  rationale: זכה యొక్క హిఫీల్ రూపం ‘శుభ్రం చేయడం/పరిశుద్ధం చేయడం’ అనే భావాన్ని ఇస్తుంది. సమాంతరతను, ఆత్మార్థక ప్రయోగాన్ని తెలుగులో సహజంగా నిలుపుతుంది.
- source_word: בְּבֹר
  choice: క్షారంతో
  rationale: בֹּר ఆధునిక సబ్బు కంటే ప్రాచీన కాలపు క్షార శుభ్రకారక పదార్థాన్ని సూచిస్తుంది. ‘క్షారం’ ఖచ్చితమైనదీ, తెలుగులో అర్థమయ్యేదీ.
- source_word: כַּפָּי
  choice: నా చేతులను
  rationale: అక్షరార్థంగా ‘నా అరచేతులు’; కడుక్కోవడం అనే సందర్భంలో తెలుగు సహజ ప్రయోగం ‘నా చేతులు’.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన శైలి. వాక్యం 31వ వచనంలో పూర్తయ్యే ఊహాత్మక షరతు కాబట్టి చివర కామా ఉంచబడింది; మంచు ‘నీరు’ అని స్పష్టీకరించకుండా మూలంలోని రూపాన్ని నిలిపాం.
