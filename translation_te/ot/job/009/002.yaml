  text: אָ֭מְנָם יָדַ֣עְתִּי כִי כֵ֑ן וּ/מַה יִּצְדַּ֖ק אֱנ֣וֹשׁ עִם אֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/002.yaml
  text: Truly[a], I know that it is so[b]; but how can a man be righteous before God?
translation:
  language: te
  text: నిజంగా, అది అలాగే ఉందని నాకు తెలుసు; అయితే మానవుడు[b] దేవుని ఎదుట నీతిమంతుడిగా[a] ఎలా ఉండగలడు?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దేవుని ఎదుట నీతిమంతుడిగా తీర్పు పొందగలడు.”
    reason: lexical_alternative
  - marker: b
    text: “మానవుడు” అని అనువదించిన హీబ్రూ పదం బలహీనమైన, మరణశీల మానవుణ్ణి సూచించే ప్రతినిధి ఏకవచనం; “మర్త్యుడు” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָמְנָם
  choice: నిజంగా
  rationale: యోబు ముందుగా చెప్పబడిన విషయాన్ని బలంగా అంగీకరిస్తున్న భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: יָדַעְתִּי
  choice: నాకు తెలుసు
  rationale: హీబ్రూ సంపూర్ణ క్రియ ఇక్కడ స్థిరమైన అవగాహనను సూచిస్తుంది; తెలుగు వర్తమాన ప్రయోగం ఆ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: כִי כֵן
  choice: అది అలాగే ఉందని
  rationale: ముందు చెప్పబడినది నిజమేనని ధృవీకరించే సూచనాత్మక భావాన్ని నిలుపుతుంది.
- source_word: וּמַה
  choice: అయితే … ఎలా
  rationale: సాధారణ అనుసంధానం కంటే, అంగీకారం నుంచి ప్రశ్నకు తిరిగే వాదనాత్మక వ్యత్యాసాన్ని వ్యక్తం చేస్తుంది.
- source_word: יִצְדַּק
  choice: నీతిమంతుడిగా … ఉండగలడు
  rationale: צדק క్రియలోని ‘నీతిమంతుడిగా/సరైనవాడిగా ఉండడం’ అనే ప్రాథమిక భావాన్ని నిలుపుతూ, న్యాయస్థాన సంబంధిత సాధ్యమైన ఛాయను పాదటిప్పణిలో ఇస్తుంది.
- source_word: אֱנוֹשׁ
  choice: మానవుడు
  rationale: బలహీనమైన, మరణశీల మానవాళిని సూచించే ప్రతినిధి ఏకవచనాన్ని లింగపరంగా విస్తృతమైన సహజ తెలుగు పదంతో అందిస్తుంది.
- source_word: עִם אֵל
  choice: దేవుని ఎదుట
  rationale: అక్షరార్థంగా ‘దేవునితో’ అయినా, ఇక్కడ దేవునితో సంబంధంలో లేదా ఆయన సమక్షంలో న్యాయంగా నిలిచే భావాన్ని సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: దేవునితో సంబంధంలో మానవుని నీతి—న్యాయస్థాన సంబంధిత ఛాయ
  choice: దేవుని ఎదుట నీతిమంతుడిగా ఎలా ఉండగలడు?
  alternative: దేవునితో నీతిమంతుడని ఎలా నిర్ధారించబడగలడు?
  rationale: హీబ్రూ క్రియ న్యాయస్థాన సంబంధిత భావాన్ని అనుమతించినా, తరువాతి కాలపు నిర్దిష్ట సిద్ధాంతపరమైన వివరణను ఈ వాక్యంలోకి చేర్చదు. ప్రధాన పాఠం మానవుడు దేవునితో సంబంధంలో నీతిమంతుడిగా ఉండగలడా అనే ఉద్వేగాన్ని అలాగే ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనదైనా సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్యనిర్మాణం. హీబ్రూలోని అంగీకారం నుంచి ప్రశ్నకు వచ్చే మలుపును అర్ధవిరామం మరియు ‘అయితే’ ద్వారా స్పష్టంగా ఉంచింది.
