  edition: WLC
  text: הַ/מַּעְתִּ֣יק הָ֭רִים וְ/לֹ֣א יָדָ֑עוּ אֲשֶׁ֖ר הֲפָכָ֣/ם בְּ/אַפּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/005.yaml
  text: He removes mountains[a], and they do not know it[c][b], when he overturns them in his anger.
translation:
  language: te
  text: 'ఆయన పర్వతాలను వాటి స్థలాలనుండి తొలగిస్తాడు[a];

    ఆయన తన కోపంలో వాటిని తలకిందులు చేసినప్పుడు,

    వాటికి అది తెలియదు[b][c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆయన పర్వతాలను కదిలిస్తాడు.’ హీబ్రూ క్రియ ఒకదాన్ని దాని స్థానం నుండి కదిలించడాన్ని సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ దేవుడు వాటిని తలకిందులు చేయడాన్ని పర్వతాలు గ్రహించలేనట్లుగా కవితాత్మకంగా వ్యక్తీకరించారు.
    reason: cultural_note
  - marker: c
    text: లేదా, ‘తన ఉగ్రకోపంలో.’
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּעְתִּיק
  choice: వాటి స్థలాలనుండి తొలగిస్తాడు
  rationale: עתק హిఫీల్ రూపం ఒకదాన్ని దాని స్థానం నుండి కదిలించడాన్ని సూచిస్తుంది. ‘తొలగిస్తాడు’ దేవుని మహాశక్తిని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; మూలంలో అంతర్లీనంగా ఉన్న ‘స్థానం నుండి’ అనే భావాన్ని స్పష్టంచేయడానికి ‘వాటి స్థలాలనుండి’ చేర్చబడింది.
- source_word: הָרִים
  choice: పర్వతాలను
  rationale: హీబ్రూ బహువచనానికి నేరమైన, సాధారణ తెలుగు సమానం.
- source_word: וְלֹא יָדָעוּ
  choice: అది వాటికే తెలియదు
  rationale: బహువచన క్రియకు పర్వతాలే కర్తలు. పర్వతాలకు అవగాహన ఉన్నట్లుగా చెప్పే మూలంలోని కవితాత్మక వ్యక్తీకరణను నిలుపుతూ, తెలుగులో సహజంగా ఉండేలా ‘అది’ అనే సూచనను ఉపయోగించాం.
- source_word: אֲשֶׁר
  choice: చేసినప్పుడు
  rationale: ఇక్కడ אֲשֶׁר పర్వతాలకు తెలియకుండా జరిగే పరిస్థితిని లేదా సమయాన్ని పరిచయం చేస్తుంది. తెలుగు వాక్యంలో ‘చేసినప్పుడు’ ఆ సంబంధాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: הֲפָכָם
  choice: వాటిని తలకిందులు చేసినప్పుడు
  rationale: הפך అంటే తిప్పడం లేదా తలకిందులు చేయడం. ‘వాటిని’ హీబ్రూ పదంలోని బహువచన కర్మ ప్రత్యయాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: בְּאַפּוֹ
  choice: తన కోపంలో
  rationale: אַף మూలార్థంగా ‘ముక్కు’ అయినా, ఈ ప్రయోగంలో కోపాన్ని సూచిస్తుంది. ‘తన కోపంలో’ ఆధునిక తెలుగులో స్పష్టంగా ఉండి, చర్య జరిగిన భావస్థితిని నిలుపుతుంది.
theological_decisions:
- issue: పర్వతాలకు జ్ఞానం ఉన్నట్లుగా చెప్పే కవితాత్మక వ్యక్తీకరణ
  choice: ‘అది వాటికే తెలియదు’ అని వ్యక్తీకరణను యథాతథంగా నిలుపడం
  alternative: ‘ఎవరికీ తెలియకుండా’ అని సాధారణీకరించడం
  rationale: హీబ్రూ బహువచన క్రియ పర్వతాలనే కర్తలుగా సూచిస్తుంది. దాన్ని సాధారణీకరిస్తే మూలంలోని కవితాత్మక ఉద్వేగం, దేవుని చర్య యొక్క ఆకస్మికత తగ్గిపోతాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కవితాత్మక ధోరణి ఉంచబడింది. సాధారణ పాఠకులకు అర్థమయ్యే పదాలను ఎంచుకుంటూనే, హీబ్రూ వాక్యంలోని పర్వతాల వ్యక్తీకరణను మరియు కోపం యొక్క తీవ్రతలో ఉన్న భావవ్యాప్తిని నిలుపుకున్నాం.
