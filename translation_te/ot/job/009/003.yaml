source:
  edition: WLC
  text: אִם יַ֭חְפֹּץ לָ/רִ֣יב עִמּ֑/וֹ לֹֽא יַ֝עֲנֶ֗/נּוּ אַחַ֥ת מִנִּי אָֽלֶף־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/003.yaml
  text: If one wished to contend with him[b][a], he could not answer him one time out of a thousand.
translation:
  language: te
  text: ఒకవేళ ఎవరైనా ఆయనతో వాదించాలనుకుంటే[a], వెయ్యింటిలో ఒక్కదానికి కూడా ఆయనకు జవాబు చెప్పలేరు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ఆయనతో న్యాయవివాదానికి దిగాలనుకుంటే’ లేదా ‘ఆయనతో వ్యాజ్యమాడాలనుకుంటే’ అని కూడా అనువదించవచ్చు. ఇక్కడి హీబ్రూ క్రియకు న్యాయపరమైన వివాద ఛాయ ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: 'అక్షరార్థంగా, ‘వెయ్యింటిలో ఒక్కదానికి ఆయనకు జవాబు చెప్పలేడు.’ భావం: వెయ్యి వాదనాంశాల్లో ఒక్కదానికైనా జవాబు చెప్పలేడు.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם יַחְפֹּץ
  choice: ఒకవేళ ... అనుకుంటే
  rationale: షరతుతో కూడిన ఊహాత్మక భావాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; חפץ లోని కోరిక లేదా సంకల్ప భావాన్ని అతిశయింపజేయదు.
- source_word: לָרִיב עִמּוֹ
  choice: ఆయనతో వాదించాలనుకుంటే
  rationale: ריב పదంలోని వివాదార్థాన్ని స్పష్టంగా ఉంచుతుంది; సందర్భంలో ఉన్న న్యాయవివాద ఛాయను పాదసూచికలో తెలియజేస్తుంది. עִמּוֹ ను యథార్థంగా ‘ఆయనతో’ అని ఉంచింది.
- source_word: לֹא יַעֲנֶנּוּ
  choice: ఆయనకు జవాబు చెప్పలేరు
  rationale: ענה ఇక్కడ జవాబు ఇవ్వడం లేదా ప్రతివాదం చేయడం అనే భావంలో ఉంది. సందర్భం కేవలం నిరాకరణకన్నా అసమర్థతను సూచిస్తున్నందున ‘చెప్పలేరు’ సరిపోతుంది.
- source_word: אַחַת מִנִּי אָלֶף
  choice: వెయ్యింటిలో ఒక్కదానికి కూడా
  rationale: ‘వెయ్యిలో ఒకటి’ అనే తీవ్రమైన అసమానతను నిలుపుతూ, ప్రశ్నలు లేదా వాదనాంశాల్లో ఒక్కదానికీ జవాబు చెప్పలేడనే సందర్భార్థాన్ని సహజ తెలుగులో అందిస్తుంది; ‘కూడా’ హీబ్రూ వాక్యంలోని బలాన్ని వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: వాక్యంలోని సర్వనామాల నిర్దేశ్యం
  choice: వాదించదలచిన వ్యక్తి దేవునికి జవాబు చెప్పలేని స్థితిని వాక్యం సూచిస్తుంది; అయినా ప్రధాన పాఠ్యంలో ‘దేవుడు’ అని చేర్చకుండా ‘ఆయన’ అని ఉంచబడింది.
  alternative: ఇది ఇద్దరు సాధారణ మానవ ప్రత్యర్థుల మధ్య వివాదాన్ని సూచిస్తుందని చదవడం.
  rationale: యోబు 9:2-4 సందర్భం దేవుని జ్ఞానం, శక్తి గురించి మాట్లాడుతుంది. అయితే హీబ్రూ పాఠ్యంలో దేవుని పేరు ఈ వచనంలో ప్రత్యక్షంగా లేకపోవడంతో అనువాదం సర్వనామాన్ని నిలుపుతుంది.
- issue: לֹא יַעֲנֶנּוּ లో సామర్థ్యమా లేక సంకల్పమా
  choice: ‘జవాబు చెప్పలేరు’—మానవుని అసమర్థత.
  alternative: ‘జవాబు చెప్పరు’—జవాబు ఇవ్వడానికి నిరాకరణ.
  rationale: దేవునితో వాదించే సందర్భంలో, తదుపరి ‘వెయ్యింటిలో ఒక్కదానికి కూడా’ అనే మాట సామర్థ్యలేమిని ప్రధానంగా సూచిస్తుంది; అయినా హీబ్రూ రూపం స్వతహాగా మోడల్ క్రియను స్పష్టంగా పేర్కొనదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన ‘ఆయన’ రూపాన్ని ఉపయోగించాం. ఏకవచన సాధారణ వ్యక్తిని లింగనిరపేక్షంగా సూచించేందుకు ‘ఎవరైనా’తో పాటు తెలుగులో సహజమైన గౌరవ/సామాన్య బహువచన క్రియారూపం ‘చెప్పలేరు’ వాడాం. న్యాయపరమైన ఛాయను ప్రధాన పాఠ్యంలో భారంగా చేయకుండా పాదసూచికలో నిలిపాం.
