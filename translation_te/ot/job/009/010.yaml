  rationale: సవరణ חֵקֶר లోని పరిశోధనాతీతతను “పరిశోధించి గ్రహించలేని” ద్వారా స్పష్టపరుస్తుంది; מִסְפָּר లేని భావాన్ని “లెక్కించలేని”గా నిలుపుతుంది. రెండు పాదాల కవితా సమాంతరతను ఉంచి, దేవుణ్ణి సూచించే ముందటి సందర్భానికి అనుసంధానమైన ఒకే వర్ణనాత్మక క్రియను చివర ఉంచుతుంది. ఈ వచనానికి పాఠభేదం లేదా అవసరమైన అనువాద-అస్పష్టత లేదు కాబట్టి అడుగుటిప్పణులు అవసరం లేదు.
