translation:
  language: te
  text: 'పరిశోధించి గ్రహించలేని గొప్ప కార్యాలను,

    లెక్కించలేని అద్భుతాలను చేసేవాడు.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֹשֶׂה
  choice: చేసేవాడు
  rationale: ఈ కర్తరి వర్తమాన క్రియారూపం ముందటి సందర్భంలోని దేవుణ్ణి వర్ణిస్తుంది. తెలుగు పద్యప్రవాహంలో ‘చేసేవాడు’ ఆ నిరంతర వర్ణనను సహజంగా తెలియజేస్తుంది.
- source_word: גְדֹלוֹת
  choice: గొప్ప కార్యాలు
  rationale: స్త్రీలింగ బహువచన విశేషణం నామవాచకంగా వాడబడింది. ‘గొప్ప కార్యాలు’ దేవుని మహత్కార్యాలను సూచిస్తూ తెలుగులో సహజంగా ఉంటుంది; వాటి స్వభావాన్ని మరీ సంకుచితం చేయదు.
- source_word: עַד אֵין חֵקֶר
  choice: శోధించి తెలుసుకోలేనన్ని
  rationale: ఈ హీబ్రూ నుడికారం ఆ కార్యాలను పూర్తిగా పరిశోధించి గ్రహించడం సాధ్యం కాదని తెలుపుతుంది. ‘శోధించి తెలుసుకోలేనన్ని’ పరిశోధన, అవగాహన అనే రెండు భావాలనూ సహజ తెలుగులో అందిస్తుంది.
- source_word: וְנִפְלָאוֹת
  choice: అద్భుతాలు
  rationale: ఈ పదం ఆశ్చర్యం, విస్మయం కలిగించే అసాధారణ కార్యాలను సూచిస్తుంది. ‘అద్భుతాలు’ సంక్షిప్తమైన, సాధారణ ఆధునిక తెలుగు సమానార్థకం.
- source_word: עַד אֵין מִסְפָּר
  choice: లెక్కించలేనన్ని
  rationale: ఈ పదబంధం సంఖ్యకు అందనంత విస్తారాన్ని, అంటే అసంఖ్యాకతను సూచిస్తుంది. ‘లెక్కించలేనన్ని’ తెలుగు సమాంతర నిర్మాణంలో స్పష్టంగా, సహజంగా ఉంటుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే పదప్రయోగం. హీబ్రూ సమాంతర కవితా నిర్మాణాన్ని రెండు పాదాలతో నిలిపి, ‘శోధించి తెలుసుకోలేనన్ని / లెక్కించలేనన్ని’ అనే సమాంతరతను కాపాడింది.
