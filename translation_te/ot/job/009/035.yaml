  yaml_path: translation/ot/job/009/035.yaml
  text: Then I would speak and not fear him[a], for I am not so in myself.
translation:
  language: te
  text: అప్పుడు నేను మాట్లాడతాను, ఆయనకు భయపడను; ఎందుకంటే నా విషయంలో అలా లేదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ చివరి వాక్యభాగం సంక్షిప్తంగా, కొంత అస్పష్టంగా ఉంది. దీనిని ‘ఎందుకంటే నా సంగతి అలా లేదు’ అని కూడా అనువదించవచ్చు; మరింత అక్షరార్థంగా, ‘ఎందుకంటే నేను నాతో అలా లేను’ అని ఉంటుంది.
    reason: మూలంలోని భావాధ్యాహారాన్ని మరియు עִמָּדִי (‘నాతో/నా విషయంలో’) అనే పదంలోని స్వీయ-సంబంధ భావాన్ని సంరక్షించడానికి.
lexical_decisions:
- source_word: אַדַבְּרָה
  choice: అప్పుడు నేను మాట్లాడతాను
  rationale: మొదటి పురుష ఏకవచన రూపం సందర్భంలో యోబు కోరుకున్న పరిస్థితి నెరవేరితే తాను మాట్లాడగలననే ఉద్దేశాన్ని సూచిస్తుంది. ముందటి వచనాలతో ఉన్న సంబంధాన్ని ‘అప్పుడు’ సహజంగా తెలియజేస్తుంది.
- source_word: וְלֹא אִירָאֶנּוּ
  choice: ఆయనకు భయపడను
  rationale: ירא క్రియకు జతైన మూడవ పురుష పుంలింగ ఏకవచన ప్రత్యయం ‘ఆయనకు భయపడను’ అని నేరుగా సూచిస్తుంది.
- source_word: כִּי לֹא כֵן אָנֹכִי עִמָּדִי
  choice: కానీ నా సంగతి అలా లేదు
  rationale: చివరి హీబ్రూ వాక్యభాగం సంక్షిప్తమైనది, భావాధ్యాహారంతో కూడినది. ‘నా సంగతి అలా లేదు’ అనేది עִמָּדִי లోని ‘నాతో/నా విషయంలో’ భావాన్ని సహజమైన ఆధునిక తెలుగులో ఉంచుతుంది; ‘కానీ’ సందర్భంలోని వ్యత్యాసాన్ని తెలియజేస్తుంది, అయితే ఇతర సాధ్యమైన సంబంధాన్ని పాదటిప్పణి సంరక్షిస్తుంది.
theological_decisions:
- issue: చివరి సంక్షిప్త వాక్యభాగం యొక్క అర్థం
  choice: యోబు భయంలేకుండా మాట్లాడాలని కోరుతున్న పరిస్థితికి విరుద్ధంగా, తన ప్రస్తుత సంగతి అలా లేదని చెబుతున్నట్లుగా అనువదించబడింది.
  alternative: ‘ఎందుకంటే నా విషయంలో అలా లేదు’ లేదా మరింత అక్షరార్థంగా ‘ఎందుకంటే నేను నాతో అలా లేను.’
  rationale: హీబ్రూ మాటలు ఏది ‘అలా లేదు’ అని పూర్తిగా వివరించవు. అందువల్ల యోబు అంతరంగ స్థితి, నిర్దోషిత్వం, లేదా దేవుని ఎదుట అతని స్థానం గురించి పాఠ్యంలో స్పష్టంగా లేని సిద్ధాంతార్థాన్ని అనువాదం చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, అయినా గంభీరతను నిలుపుతూ అనువదించబడింది. ‘నా సంగతి అలా లేదు’ సహజమైన తెలుగు ప్రయోగం; మూలంలోని అస్పష్టతను పూర్తిగా పరిష్కరించకుండా ఉంచుతుంది.
