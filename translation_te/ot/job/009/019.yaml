id: JOB.9.19
reference: Job 9:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אִם לְ/כֹ֣חַ אַמִּ֣יץ הִנֵּ֑ה וְ/אִם לְ֝/מִשְׁפָּ֗ט מִ֣י יוֹעִידֵֽ/נִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/019.yaml
  text: If it is a matter of strength[a], behold, he is mighty; and if of justice[b], who can summon him?
translation:
  language: te
  text: బలం విషయమైతే—ఇదిగో, ఆయన బలవంతుడు; న్యాయవిచారణ[b] విషయమైతే, నన్ను ఎవరు న్యాయవిచారణకు పిలవగలరు?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ వాక్యం క్లిష్టంగా ఉంది. హీబ్రూ రూపంలో కర్మ “నన్ను” అని ఉంది. అయితే సందర్భాన్ని బట్టి కొందరు దీనిని, “ఆయనను న్యాయస్థానానికి ఎవరు పిలవగలరు?” అని అర్థం చేసుకుంటారు.
    reason: alternative_reading
  - marker: b
    text: “న్యాయవిచారణ” అనే మాటను “న్యాయం,” “తీర్పు,” లేదా “న్యాయవ్యవహారం” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם לְכֹחַ
  choice: బలం విషయమైతే
  rationale: לְ ఉపసర్గ ఇక్కడ చర్చలోని అంశాన్ని సూచిస్తుంది. అందువల్ల ‘బలం విషయమైతే’ అనేది షరతుతో కూడిన తులనాత్మక నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: אַמִּיץ
  choice: బలశాలి
  rationale: అపారమైన శక్తిని తెలిపే విశేషణం. ముందే వచ్చిన ‘బలం’తో భావసంబంధాన్ని ఉంచుతూ, దేవుని మించిన శక్తి లేదనే వాక్యపు తీవ్రతను వ్యక్తం చేస్తుంది.
- source_word: הִנֵּה
  choice: ఇదిగో
  rationale: శ్రద్ధను ఆకర్షించే హీబ్రూ అవ్యయానికి గంభీరమైన, సహజమైన తెలుగు సమానం; యోబు మాటలోని వాక్చాతుర్యపు బలాన్ని కాపాడుతుంది.
- source_word: וְאִם לְמִשְׁפָּט
  choice: న్యాయవిచారణ విషయమైతే
  rationale: מִשְׁפָּט న్యాయం, తీర్పు, న్యాయవ్యవహారం అనే అర్థాలను కలిగి ఉంది. సందర్భంలోని న్యాయస్థాన రూపకాన్ని స్పష్టంగా ఉంచేందుకు ‘న్యాయవిచారణ’ ఎంచుకున్నాం.
- source_word: מִי יוֹעִידֵנִי
  choice: ఆయనను ఎవరు న్యాయస్థానానికి పిలవగలరు?
  rationale: יעד యొక్క హిఫీల్ రూపం న్యాయసందర్భంలో హాజరుకావడానికి నియమించడం లేదా పిలిపించడం అనే భావాన్ని ఇస్తుంది. హీబ్రూ రూపంలో మొదటి పురుష ఏకవచన కర్మప్రత్యయం కనిపించినప్పటికీ, సందర్భం దేవుణ్ణి న్యాయస్థానానికి పిలవడం అసాధ్యమనే భావానికి అనుకూలంగా ఉంది; పాఠ్య క్లిష్టతను పాదసూచికలో ఉంచాం.
theological_decisions:
- issue: దేవునితో యోబు న్యాయవాదం చేయాలనే సందర్భంలోని న్యాయస్థాన రూపకం
  choice: ‘న్యాయవిచారణ’, ‘న్యాయస్థానానికి పిలవగలరు’ అనే స్పష్టమైన న్యాయపరమైన భాషను ఉపయోగించడం
  alternative: ‘తీర్పు విషయమైతే, నాకు విచారణ సమయాన్ని ఎవరు నిర్ణయిస్తారు?’
  rationale: యోబు 9లో దేవుణ్ణి న్యాయవిచారణకు తీసుకురావడం అసాధ్యమనే ఉద్రిక్తత ప్రధానంగా ఉంది. దానిని సాధారణ తీర్పు భావంగా మృదువుచేయకుండా నిలుపుతూ, హీబ్రూ రూపంలోని ప్రత్యామ్నాయ అవగాహనను పాదసూచికలో తెలియజేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరత కలిగిన శైలి. దీర్ఘమైన వివరణను ప్రధాన వాక్యంలో చేర్చకుండా, న్యాయస్థాన రూపకాన్ని సాధారణ పాఠకుడికి స్పష్టంగా చేశాం. రెండు పాదసూచిక సూచికలూ ప్రధాన పాఠ్యంలో ఉంచబడ్డాయి.
