source:
  edition: WLC
  text: יָסֵ֣ר מֵ/עָלַ֣/י שִׁבְט֑/וֹ וְ֝/אֵמָת֗/וֹ אַֽל תְּבַעֲתַֽ/נִּי־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/034.yaml
  text: Let him remove his rod from upon me[a], and let not his terror frighten me.
translation:
  language: te
  text: 'ఆయన తన దండాన్ని నా మీద నుండి తొలగించుగాక[a];

    ఆయన భీతి నన్ను భయపెట్టకుండుగాక.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “ఆయన తన దండాన్ని నా నుండి మళ్లించుగాక; ఆయన భయం నన్ను భయభ్రాంతికి గురిచేయకుండుగాక.”'
    reason: ‘తొలగించు/మళ్లించు,’ ‘భీతి/భయం,’ ‘భయపెట్టు/భయభ్రాంతికి గురిచేయు’ అనే సముచితమైన పదార్థ ప్రత్యామ్నాయాలను తెలియజేయడానికి.
lexical_decisions:
- source_word: יָסֵר
  choice: తొలగించుగాక
  rationale: సూర్ అనే ధాతువు హిఫీల్ రూపంలో ఇక్కడ ఆకాంక్షార్థక బలాన్ని కలిగి ఉంది. ‘తొలగించుగాక’ యోబు కోరికను, కవితాత్మక గౌరవభాషను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: מֵעָלַי
  choice: నా మీద నుండి
  rationale: అక్షరార్థంగా ‘నా మీద నుండి.’ దండం యోబు మీద భారంగా లేదా దెబ్బకొట్టేలా ఉన్న చిత్రాన్ని ఇది నిలుపుతుంది.
- source_word: שִׁבְטוֹ
  choice: తన దండాన్ని
  rationale: שֵׁבֶט అంటే దండం, కర్ర, లేదా రాజదండం కావచ్చు. బాధను తెలిపే ఈ సందర్భంలో కొట్టే లేదా శిక్షించే సాధనాన్ని సూచించే ‘దండం’ సముచితం.
- source_word: וְאֵמָתוֹ
  choice: ఆయన భీతి
  rationale: אֵימָה తీవ్రమైన భయం లేదా భీతిని సూచిస్తుంది. దేవునివల్ల కలిగే అదిమివేసే భయాన్ని ‘ఆయన భీతి’ సంక్షిప్తంగా, గంభీరంగా తెలియజేస్తుంది.
- source_word: אַל
  choice: భయపెట్టకుండుగాక
  rationale: తదుపరి క్రియతో కలిసి ఇది ప్రతికూల ఆకాంక్షను తెలియజేస్తుంది. తెలుగులో ‘-కుండుగాక’ ఆ భావాన్ని కవితాత్మకంగా నిలుపుతుంది.
- source_word: תְּבַעֲתַנִּי
  choice: నన్ను భయపెట్టకుండుగాక
  rationale: בעת ధాతువు భయపెట్టడం, బెదరగొట్టడం, దిగ్భ్రాంతికి గురిచేయడం అనే భావాలను కలిగి ఉంది. ‘భయపెట్టడం’ ఆధునిక పాఠకులకు స్పష్టంగా ఉంటుంది; ముందున్న ‘భీతి’తో అనవసర పదపునరుక్తిని తగ్గిస్తుంది.
theological_decisions:
- issue: మూడవ పురుష ఏకవచన సర్వనామాల నిర్దేశ్యం
  choice: దేవుని గురించి ‘ఆయన/తన’ అని పరోక్షంగా చెప్పడం
  alternative: ‘నీ దండాన్ని నా మీద నుండి తొలగించు; నీ భీతి నన్ను భయపెట్టనివ్వకు’ అని దేవునితో ప్రత్యక్ష సంభాషణగా అనువదించడం
  rationale: హీబ్రూ క్రియారూపం, ప్రత్యయాలు మూడవ పురుష ఏకవచనంలో ఉన్నాయి. కాబట్టి దేవునితో ప్రత్యక్ష సంభాషణగా మార్చకుండా మూలంలోని పరోక్ష ప్రస్తావనను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కవితాత్మక శైలి. మూడవ పురుష రూపాలను, రెండు పాదాల సమాంతర నిర్మాణాన్ని, ఆకాంక్షార్థక ‘-గాక’ రూపాన్ని నిలిపాం.
