id: JOB.9.23
reference: Job 9:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אִם שׁ֭וֹט יָמִ֣ית פִּתְאֹ֑ם לְ/מַסַּ֖ת נְקִיִּ֣ם יִלְעָֽג־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/023.yaml
  text: If a scourge kills suddenly[a], he mocks the calamity of the innocent.
translation:
  language: te
  text: 'కొరడా అకస్మాత్తుగా చంపివేస్తే,

    నిర్దోషుల దుస్థితిని అతడు అపహాస్యం చేస్తాడు.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నిర్దోషుల పరీక్షను అతడు ఎగతాళి చేస్తాడు”; లేదా, “నిర్దోషులు క్షీణించి కూలిపోవడాన్ని అతడు అపహాస్యం చేస్తాడు.” ఇక్కడి హెబ్రీ నామవాచకం పరీక్షను, కరిగిపోవడాన్ని లేదా కూలిపోవడాన్ని సూచించవచ్చు.
    reason: לְמַסַּת అనే అరుదైన పదానికి పరీక్ష, కరిగిపోవడం/క్షీణించడం, కూలిపోవడం అనే భిన్న అర్థసాధ్యతలు ఉన్నాయి.
lexical_decisions:
- source_word: אִם
  choice: చేస్తే
  rationale: హెబ్రీ షరతార్థక ప్రయోగాన్ని ‘చేస్తే’ సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది; ‘చేసినప్పుడు’ అని కాలార్థాన్ని ఖచ్చితంగా నిర్ధారించదు.
- source_word: שׁוֹט
  choice: కొరడా
  rationale: మూలపదంలోని కొరడా అనే సాక్షాత్తు చిత్రాన్ని నిలుపుతూ, సందర్భంలో వినాశకరమైన దెబ్బ లేదా విపత్తును సూచించే రూపకార్థానికీ చోటిస్తుంది.
- source_word: יָמִית
  choice: చంపివేస్తే
  rationale: מות హిఫీల్ రూపంలోని ‘చనిపోయేలా చేయు/చంపు’ అనే కారణార్థాన్ని స్పష్టంగా తెలుపుతుంది.
- source_word: פִּתְאֹם
  choice: అకస్మాత్తుగా
  rationale: చర్య ఊహించని విధంగా ఒక్కసారిగా సంభవించడాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לְמַסַּת
  choice: కలిగే విపత్తును
  rationale: సందర్భంలో నిర్దోషులపై వచ్చే దురవస్థను పాఠ్యంలో చదవదగిన రీతిలో తెలుపుతుంది; పరీక్ష, కరిగిపోవడం లేదా కూలిపోవడం అనే మూలపద సాధ్యతలను పాదసూచికలో నిలుపుతుంది.
- source_word: נְקִיִּם
  choice: నిర్దోషులకు
  rationale: అపరాధం లేనివారిని సూచించే సందర్భార్థాన్ని స్పష్టమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: יִלְעָג
  choice: అతడు అపహాస్యం చేస్తాడు
  rationale: క్రియలోని ఎగతాళి లేదా పరిహాసం అనే తీవ్ర భావాన్ని నిలుపుతుంది; కర్తను ‘దేవుడు’ అని పాఠ్యంలో అదనంగా చేర్చకుండా ఏకవచన సర్వనామంతో మూలంలోని సూచిత కర్తను ఉంచుతుంది.
theological_decisions:
- issue: ‘అతడు అపహాస్యం చేస్తాడు’ అనే క్రియకు కర్త
  choice: సందర్భంలో దేవుణ్ణి సూచించగల ‘అతడు’ అనే సూచిత కర్తను ఉంచడం
  alternative: కొరడానే వ్యక్తీకరించి అపహాస్యం చేస్తుందని తీసుకోవడం; లేదా నిర్దిష్టం కాని కర్తగా భావించడం
  rationale: యోబు 9 అధ్యాయ ప్రవాహంలో యోబు దేవుని లోకపాలన గురించి తీవ్రంగా మాట్లాడుతున్నాడు. అయినా హెబ్రీ పాఠ్యం ఇక్కడ ‘దేవుడు’ అనే నామాన్ని ప్రత్యక్షంగా చేర్చదు. కాబట్టి ‘అతడు’ మూలంలోని వ్యాకరణ రూపాన్నీ దైవశాస్త్రీయ ఉద్రిక్తతనూ నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, కానీ యోబు ఆరోపణలోని గంభీరతను నిలిపే కావ్యాత్మక గద్యశైలి. ‘కొరడా’ అనే మూలచిత్రాన్ని ఉంచి, అస్పష్టమైన పదార్థాన్ని పాదసూచిక ద్వారా వెల్లడించాం.
