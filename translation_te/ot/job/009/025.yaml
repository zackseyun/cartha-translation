  text: My days are swifter than a runner[a]; they flee away; they do not see good.
translation:
  language: te
  text: నా రోజులు పరుగెత్తేవాడి కంటే వేగంగా సాగిపోతున్నాయి; అవి పారిపోతున్నాయి; మేలును[a] చూడలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సౌభాగ్యం” లేదా “క్షేమం.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יָמַי
  choice: నా రోజులు
  rationale: יוֹם యొక్క ప్రథమ పురుష స్వామ్య బహువచనాన్ని సహజమైన తెలుగు నుడికారంతో వ్యక్తపరుస్తూ, జీవితకాలంలోని రోజులు అనే భావాన్ని నిలుపుతుంది.
- source_word: קַלוּ
  choice: వేగంగా సాగిపోతున్నాయి
  rationale: קלל ఇక్కడ తేలికగా లేదా త్వరగా ఉండడం అనే భావంలో ఉంది. పరుగెత్తేవాడితో పోలిక ఉన్నందున వేగాన్ని తెలుపుతూ, రోజులు త్వరగా గడిచిపోతున్న భావాన్ని సహజంగా అందిస్తుంది.
- source_word: מִנִּי רָץ
  choice: పరుగెత్తేవాడికంటే
  rationale: מִן పోలికను సూచిస్తుంది; רָץ అనే ఏకవచన కర్తృవాచక రూపాన్ని నిర్దిష్టమైన దూతగా పరిమితం చేయకుండా ‘పరుగెత్తేవాడు’ అని అనువదించాం.
- source_word: בָּרְחוּ
  choice: అవి పారిపోతున్నాయి
  rationale: మూలంలోని పారిపోవడం లేదా తప్పించుకుపోవడం అనే సజీవ చిత్రాన్ని, ‘నా రోజులు’ అనే బహువచన కర్తతో నిలుపుతుంది.
- source_word: לֹא רָאוּ
  choice: చూడవు
  rationale: రోజులను వ్యక్తులుగా చిత్రించే హీబ్రూ రూపకాన్ని అలాగే ఉంచి, అవి మేలును అనుభవించకుండానే గడిచిపోతున్నాయని సంక్షిప్తంగా వ్యక్తపరుస్తుంది.
- source_word: טוֹבָה
  choice: మేలు
  rationale: ఈ పదం సాధారణమైన మంచితో పాటు సౌభాగ్యం లేదా క్షేమాన్ని కూడా సూచించగలదు. ‘మేలు’ దాని విస్తృత అర్థాన్ని అనవసరంగా పరిమితం చేయదు.
