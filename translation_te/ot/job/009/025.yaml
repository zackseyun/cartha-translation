translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన శైలి వాడబడింది. మూలంలోని రోజులు పరుగెత్తడం, పారిపోవడం, మేలును చూడకపోవడం అనే వ్యక్తీకరణాత్మక చిత్రాలు నిలుపబడ్డాయి. హీబ్రూలో స్పష్టమైన ‘ఇప్పుడు’ అనే కాలసూచక పదం లేనందున దానిని చేర్చలేదు.
