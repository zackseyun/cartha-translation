lexical_decisions:
- source_word: יִתְּנֵנִי
  choice: నన్ను … నివ్వడు
  rationale: נתן అనే క్రియకు సాధారణంగా ‘ఇవ్వడం’ అని అర్థం. అయితే తరువాత వచ్చే క్రియారూపంతో కలిసి ఇక్కడ ‘అనుమతించడం/చేయనివ్వడం’ అనే భావాన్ని ఇస్తుంది.
- source_word: הָשֵׁב רוּחִי
  choice: ఊపిరి పీల్చుకోవడం
  rationale: שוב యొక్క హిఫీల్ క్రియారూపం ‘తిరిగి తీసుకురావడం/పునరుద్ధరించడం’ అని, רוּחַ ‘ఊపిరి/ప్రాణం/ఆత్మ’ అని అర్థమివ్వగలవు. ఎడతెగని బాధను తెలిపే సందర్భంలో, కాసేపైనా ఊపిరి పీల్చుకునే వీలు లేకపోవడమే సహజ భావం.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి వాక్యానికి కారణాన్ని పరిచయం చేసే సంబంధాన్ని స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: יַשְׂבִּיעַנִי
  choice: నన్ను … నింపుతాడు
  rationale: שבע యొక్క హిఫీల్ రూపం ‘తృప్తిపరచడం/నిండేలా చేయడం’ అనే భావాన్ని కలిగిస్తుంది. ప్రతికూల సందర్భంలో ‘నింపుతాడు’ బలవంతంగా పూర్తిగా ఆవరించబడిన భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: מַמְּרֹרִים
  choice: చేదుతో
  rationale: బహువచన రూపం ‘చేదు విషయాలు’ లేదా ‘చేదు అనుభవాలు’ అని సూచించగలదు. ‘చేదుతో’ అనేది మూలంలోని రూపకాన్ని సహజ తెలుగులో ఉంచుతూ, బాధల సమష్టి భావాన్ని కాపాడుతుంది.
