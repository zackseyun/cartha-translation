source:
  edition: WLC
  text: כִּי לֹא אִ֣ישׁ כָּמֹ֣/נִי אֶֽעֱנֶ֑/נּוּ נָב֥וֹא יַ֝חְדָּ֗ו בַּ/מִּשְׁפָּֽט־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/032.yaml
  text: For he is not a man like me[a], that I should answer him, that we should come together in court.
translation:
  language: te
  text: నేను ఆయనకు జవాబివ్వగలిగేలా, మేమిద్దరం కలిసి న్యాయవిచారణకు రాగలిగేలా ఆయన నాలాంటి మనిషి కాదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నేను ఆయనకు జవాబివ్వగలిగేలా, మేమిద్దరం కలిసి తీర్పు కోసం రాగలిగేలా.”
    reason: హెబ్రీ క్రియారూపాలను సంభావ్య భావంతో అర్థం చేసుకోవచ్చు; בַּמִּשְׁפָּטను “తీర్పు కోసం” అని మరింత పదానుసారంగా కూడా అనువదించవచ్చు.
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి ఫిర్యాదుకు యోబు ఇస్తున్న కారణాన్ని పరిచయం చేస్తుంది.
- source_word: לֹא אִישׁ כָּמֹנִי
  choice: ఆయన నాలాంటి మనిషి కాదు
  rationale: దేవుడు తనతో సమాన స్థాయిలో వాదించగల మానవ పక్షం కాదనే వ్యక్తిగత పోలికను సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: אֶעֱנֶנּוּ
  choice: నేను ఆయనకు జవాబివ్వడానికి
  rationale: ענה అనే క్రియలోని జవాబు చెప్పడం అనే అర్థాన్ని, సందర్భంలోని న్యాయపరమైన ప్రతివాద భావంతో కలిపి నిలుపుతుంది.
- source_word: נָבוֹא יַחְדָּו
  choice: మేమిద్దరం కలిసి ... రావడానికి
  rationale: ప్రథమ పురుష బహువచనంలో యోబు, దేవుడు ఇద్దరూ చేర్చబడ్డారని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: בַּמִּשְׁפָּט
  choice: న్యాయవిచారణకు
  rationale: מִשְׁפָּט లోని తీర్పు లేదా న్యాయవ్యవహార భావాన్ని ఈ న్యాయస్థాన సందర్భంలో సంక్షిప్తంగా అందిస్తుంది.
theological_decisions:
- issue: యోబు, దేవుని మధ్య న్యాయపరమైన రూపకం
  choice: దేవుడు యోబుతో సమానమైన మానవ పక్షం కానందున ఇద్దరూ కలిసి న్యాయవిచారణకు రావడం సాధ్యం కాదనే భావాన్ని నిలుపడం
  alternative: మరింత అమూర్తంగా ‘తీర్పు కోసం కలిసి రావడం’ అని అనువదించడం
  rationale: వాక్యం దేవుని స్వభావంపై అదనపు సిద్ధాంతాన్ని నిర్మించకుండా, దేవునితో సమాన పక్షంగా వ్యాజ్యమాడలేనన్న యోబు మాటను మాత్రమే తెలియజేస్తుంది.
- issue: אִישׁ లోని లింగసూచక పదప్రయోగం
  choice: మనిషి
  alternative: పురుషుడు
  rationale: ఇక్కడ ప్రధాన వ్యత్యాసం దేవుడు మరియు మానవుడి మధ్య ఉంది; ఆధునిక తెలుగులో ‘మనిషి’ ఆ భావాన్ని సహజంగా తెలియజేస్తూ మూలంలోని ఏకవచన వ్యక్తి సూచనను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘ఆయన’ అనే గౌరవ ఏకవచనం వాడబడింది; న్యాయపరమైన రూపకం స్పష్టంగా ఉంచబడింది.
