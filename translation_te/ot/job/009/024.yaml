source:
  edition: WLC
  text: אֶ֤רֶץ נִתְּנָ֬ה בְֽ/יַד רָשָׁ֗ע פְּנֵֽי שֹׁפְטֶ֥י/הָ יְכַסֶּ֑ה אִם לֹ֖א אֵפ֣וֹא מִי הֽוּא׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/024.yaml
  text: The earth is given into the hand of the wicked[a]; he covers the faces of its judges. If not[b], then who is it?
translation:
  language: te
  text: భూమి దుష్టుని చేతికి అప్పగించబడింది[a]; దాని న్యాయాధిపతుల ముఖాలను అతడు కప్పివేస్తాడు[b]. అలా కాకపోతే, మరి అతడు ఎవరు?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దేశం ఒక దుష్టుని చేతికి అప్పగించబడింది.’ హీబ్రూ אֶרֶץ అనే పదానికి ‘భూమి’ లేదా ‘దేశం’ అనే అర్థాలు ఉండవచ్చు; רָשָׁע ఒక దుష్ట వ్యక్తిని లేదా సాధారణార్థంలో దుష్టుణ్ణి సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘అతడు’ ఎవరో హీబ్రూ స్పష్టంగా చెప్పదు. అది దేవుణ్ణి, దుష్ట పాలకుణ్ణి సూచించవచ్చు; లేదా కర్తను నిర్దిష్టంగా పేర్కొనని ప్రయోగం కావచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: אֶרֶץ
  choice: భూమి
  rationale: ఈ పదానికి ‘భూమి’ లేదా ‘దేశం’ అనే అర్థాలు ఉండవచ్చు. యోబు ఇక్కడ లోకంలోని అన్యాయ వ్యవస్థ గురించి విస్తృతంగా మాట్లాడుతున్న సందర్భానికి ‘భూమి’ సరిపోతుంది; ‘దేశం’ సాధ్యమైన ప్రత్యామ్నాయంగా పాదటిప్పణిలో ఉంచబడింది.
- source_word: נִתְּנָה
  choice: అప్పగించబడింది
  rationale: నిఫాల్ పర్ఫెక్ట్ యొక్క కర్మణి భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తూ, అప్పగింపు వల్ల ఏర్పడిన ప్రస్తుత స్థితినీ సూచిస్తుంది.
- source_word: בְיַד
  choice: చేతికి
  rationale: ఎవరి అధికారానికైనా అప్పగించడాన్ని సూచించే హీబ్రూ రూపకాన్ని తెలుగులో సహజంగా నిలుపుతుంది.
- source_word: רָשָׁע
  choice: దుష్టుని
  rationale: హీబ్రూలోని ఏకవచన రూపాన్ని నిలుపుతూ, అది ఒక దుష్ట వ్యక్తిని లేదా సాధారణ ప్రతినిధిగా దుష్టుణ్ణి సూచించే అవకాశాన్ని తెరిచి ఉంచుతుంది.
- source_word: פְּנֵי שֹׁפְטֶיהָ
  choice: దాని న్యాయాధిపతుల ముఖాలను
  rationale: ‘ముఖాలు’ అనే స్పష్టమైన హీబ్రూ చిత్రణను, అలాగే భూమిని తిరిగి సూచించే స్త్రీలింగ ప్రత్యయాన్ని తెలుగులో సహజమైన ‘దాని’తో నిలుపుతుంది.
- source_word: יְכַסֶּה
  choice: అతడు కప్పివేస్తాడు
  rationale: పీయేల్ ఇంపర్ఫెక్ట్ 3 పురుష ఏకవచన క్రియను క్రియాశీల రూపంలో అనువదించింది. కర్త ఎవరో హీబ్రూ స్పష్టంగా చెప్పనందున ‘అతడు’ ఎవరిని సూచిస్తుందో నిర్ణయించకుండా ఉంచబడింది.
- source_word: אִם לֹא אֵפוֹא מִי הוּא
  choice: అలా కాకపోతే, మరి అది ఎవరు?
  rationale: ర rhetorical సవాలు యొక్క బలాన్ని నిలుపుతూ, హీబ్రూలో లేని నిర్దిష్ట పూర్వపదాన్ని చేర్చకుండా אֵפוֹא యొక్క ‘మరి/అయితే’ భావాన్ని తెలియజేస్తుంది.
theological_decisions:
- issue: ‘కప్పివేస్తాడు’ అనే క్రియకు అంతర్లీనంగా ఉన్న కర్త, అలాగే ‘అది ఎవరు?’ అనే ప్రశ్నలో సూచిత వ్యక్తి ఎవరు?
  choice: కర్తను దేవుడు, దుష్ట పాలకుడు లేదా మరెవరని స్పష్టంగా గుర్తించకుండా హీబ్రూ అస్పష్టతను ప్రధాన పాఠ్యంలోను పాదటిప్పణిలోను నిలుపడం.
  alternative: దేవుడే న్యాయాధిపతుల ముఖాలను కప్పుతాడు; లేదా దుష్టుడే వాటిని కప్పుతాడు; లేదా కర్తను పేర్కొనకుండా కర్మణి రూపంలో చెప్పడం.
  rationale: సందర్భంలోని యోబు వాదన దేవుణ్ణి అంతిమ కర్తగా సూచించవచ్చు; అయినా יְכַסֶּה క్రియకు కర్తను ఈ వాక్యం ప్రత్యక్షంగా పేర్కొనదు. అందువల్ల వేదాంతపరమైన ఉద్రిక్తతను అనువాదంలో పరిష్కరించకుండా నిలుపబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కవితాత్మక ధోరణి. ‘చేతికి అప్పగించబడింది,’ ‘ముఖాలను కప్పివేస్తాడు’ అనే రూపకాలను మూలానికి దగ్గరగా ఉంచి, సాధారణ పాఠకుడికి అర్థమయ్యే వాక్యనిర్మాణం వాడబడింది.
