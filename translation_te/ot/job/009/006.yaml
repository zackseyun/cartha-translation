translation:
  language: te
  text: 'భూమిని దాని స్థానం నుండి కదిలించేవాడు ఆయన;

    దాని స్తంభాలు వణుకుతాయి.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘కంపిస్తాయి,’ ‘వణికిపోతాయి.’
    reason: יִתְפַלָּצוּן అనే క్రియ తీవ్రమైన కంపనం లేదా వణుకును సూచిస్తుంది; ఇవి సాధ్యమైన తెలుగు ప్రత్యామ్నాయాలు.
lexical_decisions:
- source_word: הַמַּרְגִּיז
  choice: కదిలించేవాడు
  rationale: רגז హిఫీల్ కృదంత రూపంలోని కారణార్థాన్ని నిలుపుతూ, భూమిని దాని స్థానం నుంచి కదిలించే కార్యాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אֶרֶץ
  choice: భూమిని
  rationale: భూమి తన స్థానం నుంచి కదలడం, దాని స్తంభాలు వణకడం అనే విశ్వవ్యాప్త కావ్య సందర్భంలో స్థానికమైన ‘దేశం’ కంటే ‘భూమి’ తగినది.
- source_word: מִמְּקוֹמָהּ
  choice: దాని స్థానం నుంచి
  rationale: מִן పూర్వప్రత్యయం, ‘స్థానం’ అనే నామవాచకం, స్త్రీలింగ ఏకవచన ప్రత్యయం—ఈ మూడింటినీ నేరుగా, సహజంగా ప్రతిబింబిస్తుంది.
- source_word: וְעַמּוּדֶיהָ
  choice: దాని స్తంభాలు
  rationale: עמוד అనే పదానికి సాధారణ అర్థమైన ‘స్తంభం’ను నిలుపుతుంది; ‘పునాదులు’ అని వ్యాఖ్యానాత్మకంగా మార్చకుండా మూలంలోని ప్రాచీన కావ్య విశ్వచిత్రాన్ని కాపాడుతుంది.
- source_word: יִתְפַלָּצוּן
  choice: వణికిపోతాయి
  rationale: తీవ్రమైన కంపనాన్ని సూచించే క్రియాభావాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది. ‘భయపడతాయి’ అని మానసిక భావాన్ని మాత్రమే ముందుకు తేవకుండా భౌతిక కంపన చిత్రాన్ని నిలుపుతుంది.
theological_decisions:
- issue: భూమి స్తంభాలనే విశ్వచిత్రం
  choice: ‘దాని స్తంభాలు’ అనే కావ్యచిత్రాన్ని యథాతథంగా నిలుపడం
  alternative: ఆధునిక విశ్వదృక్పథానికి అనుగుణంగా ‘దాని పునాదులు’ అని వ్యాఖ్యానించడం
  rationale: హీబ్రూ వచనం ప్రాచీన కావ్య విశ్వచిత్రాన్ని ఉపయోగిస్తుంది. దాన్ని ఆధునికీకరించడం లేదా సిద్ధాంతపరంగా సమన్వయపరచడం కాకుండా మూలంలోని సాహిత్య చిత్రాన్నే అనువాదం కాపాడాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన కావ్యశైలి. హీబ్రూ కృదంతపు సంబంధార్థాన్ని స్పష్టంచేయడానికి ‘ఆయనే’ చేర్చబడింది; పాదాల సమాంతరత మరియు విశ్వచిత్రం నిలుపబడ్డాయి.
