  text: תָּֽם אָ֭נִי לֹֽא אֵדַ֥ע נַפְשִׁ֗/י אֶמְאַ֥ס חַיָּֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/021.yaml
  text: I am blameless[a]; I do not know myself; I despise my life.
translation:
  language: te
  text: నేను నిర్దోషిని; నన్ను నేనే ఎరుగను[a]; నా జీవితాన్ని అసహ్యించుకుంటాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నా ప్రాణాన్ని ఎరుగను.” హీబ్రూ పదానికి “ప్రాణం,” “జీవం,” “స్వయం” అనే విస్తృత అర్థాలు ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּם
  choice: నిర్దోషిని
  rationale: ఈ పదం సంపూర్ణత లేదా యథార్థతను సూచిస్తూ, యోబు సందర్భంలో పాపరహిత పరిపూర్ణతకన్నా నిందకు తావులేని స్థితిని వ్యక్తం చేస్తుంది.
- source_word: אָ֭נִי
  choice: నేను
  rationale: హీబ్రూలోని స్పష్టమైన ప్రథమ పురుష ఏకవచన సర్వనామాన్ని, దాని ఉద్ఘాటనతో సహా నిలిపింది.
- source_word: לֹא אֵדַע
  choice: ఎరుగను
  rationale: మూలంలోని ‘తెలుసుకొను/ఎరుగు’ అనే ప్రాథమిక అర్థాన్ని నిలిపి, తనపట్ల పరాయితనం లేదా పట్టింపులేమి అనే సందర్భార్థాన్ని నిర్దిష్టంగా తేల్చకుండా ఉంచుతుంది.
- source_word: נַפְשִׁי
  choice: నా ప్రాణాన్ని నేనే
  rationale: נֶפֶשׁ అనే పదానికి ప్రాణం, జీవం, స్వయం అనే విస్తృత అర్థాలు ఉన్నాయి. ‘నేనే’ అనే ప్రతిఫల సూచనతో తెలుగు వాక్యం సహజంగా ఉండగా, ‘ప్రాణం’ మూలపదపు విస్తృత భావాన్ని కొంత నిలుపుతుంది.
- source_word: אֶמְאַס
  choice: అసహ్యించుకుంటున్నాను
  rationale: מָאַס లోని తిరస్కరించడం లేదా అసహ్యించుకోవడం అనే బలమైన భావాన్ని, జీవితంపై యోబు వైఖరికి సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: חַיָּי
  choice: నా జీవితాన్ని
  rationale: బహువచన రూపంలోని జీవితం/జీవించడం అనే భావాన్ని ఈ సందర్భంలో సహజంగా అందిస్తుంది.
theological_decisions:
- issue: ‘నేను నిర్దోషిని’ అనే యోబు ప్రకటన యొక్క పరిధి
  choice: నిర్దోషిని
  alternative: యథార్థవంతుణ్ణి
  rationale: యోబు తనను సంపూర్ణంగా పాపరహితుడని ప్రకటిస్తున్నాడని నిర్ణయించకుండా, תָּם పదంలోని నిందారహితత్వం/యథార్థత భావాన్ని సందర్భానుగుణంగా నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన, సంక్షిప్త శైలిని అనుసరించింది. ‘ఎరుగను’ కొద్దిగా సాహిత్య గంభీరత కలిగినా సాధారణ పాఠకులకు అర్థమయ్యే పదం; ఇది మూలంలోని కఠినమైన, సందిగ్ధమైన వాక్యరూపాన్ని నిలుపుతుంది.
