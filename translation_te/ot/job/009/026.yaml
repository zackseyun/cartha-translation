translation:
  language: te
  text: 'అవి రెల్లుతో చేసిన పడవల్లా దాటిపోతాయి,

    ఎరపైకి దూకే గద్దలా పోతాయి.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֳנִיּוֹת אֵבֶה
  choice: రెల్లుతో చేసిన పడవలు
  rationale: אֵבֶה అరుదైన పదం; సందర్భంలో తేలికగా, వేగంగా సాగే రెల్లు లేదా పాపిరస్‌తో చేసిన పడవలను సూచిస్తుందని సాధారణంగా అర్థం చేసుకుంటారు. ఆధునిక తెలుగు పాఠకునికి స్పష్టంగా ఉండేందుకు ‘రెల్లుతో చేసిన’ అని విపులీకరించబడింది.
- source_word: יָטוּשׂ
  choice: దూసుకుపోయే
  rationale: ఎరను పట్టుకోవడానికి పక్షి వేగంగా దూసుకురావడం లేదా ఎగిరిపోవడం అనే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: נֶשֶׁר
  choice: గద్ద
  rationale: ఈ హెబ్రీ పదం పెద్ద వేటపక్షిని సూచిస్తుంది; తెలుగు బైబిలు శైలిలో సహజంగా, విస్తృతంగా అర్థమయ్యే ‘గద్ద’ను ఎంచుకున్నాం.
- source_word: עֲלֵי אֹכֶל
  choice: ఎరపైకి
  rationale: అక్షరార్థంగా ‘ఆహారం మీదికి’; వేటపక్షి దృశ్యంలో ‘ఎరపైకి’ సంక్షిప్తంగా, సహజంగా ఉంటుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; యోబు జీవితదినాల వేగాన్ని తెలిపే రెండు సమాంతర ఉపమానాలను సంక్షిప్తంగా, కవితాత్మకంగా నిలిపింది. ‘అవి’ అనేది ముందటి వచనంలోని ‘నా రోజులు’ను సూచిస్తుంది.
