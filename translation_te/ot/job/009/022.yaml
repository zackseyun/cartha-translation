source:
  edition: WLC
  text: אַחַ֗ת הִ֥יא עַל כֵּ֥ן אָמַ֑רְתִּי תָּ֥ם וְ֝/רָשָׁ֗ע ה֣וּא מְכַלֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/022.yaml
  text: It is all one[a]; therefore I say[b], ‘He destroys both the blameless and the wicked.’
translation:
  language: te
  text: 'అంతా ఒకటే. అందుచేత నేను ఇలా అంటున్నాను[a]: “నిందలేనివాణ్ణీ దుష్టుణ్ణీ ఆయనే నాశనం చేస్తాడు[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నేను ఇలా చెప్పాను,” లేదా “నేను ఇలా చెప్పి ఉన్నాను.” సందర్భానుసారం హీబ్రూ సంపూర్ణ క్రియారూపాన్ని వర్తమాన ప్రకటనగా గానీ, గతకాల/సంపూర్ణ ప్రకటనగా గానీ అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, కర్తను నిరపేక్షంగా తీసుకొని, “అది నిందలేనివాణ్ణీ దుష్టుణ్ణీ నాశనం చేస్తుంది.”
    reason: alternative_reading
lexical_decisions:
- source_word: אַחַת הִיא
  choice: అంతా ఒకటే
  rationale: ఇది అక్షరార్థంగా సంఖ్యను సూచించడం కంటే, ఫలితంలో తేడా లేదనే యోబు నిరాశాపూరిత వాదాన్ని తెలిపే నానుడి. ఆధునిక తెలుగులో ‘అంతా ఒకటే’ ఆ భావాన్ని సహజంగా, సంక్షిప్తంగా అందిస్తుంది.
- source_word: עַל כֵּן
  choice: అందుచేత
  rationale: ముందటి వాక్యం నుంచి యోబు తీసుకుంటున్న నిర్ధారణను స్పష్టంగా సూచిస్తుంది.
- source_word: אָמַרְתִּי
  choice: నేను ఇలా అంటున్నాను
  rationale: హీబ్రూలో ఇది సంపూర్ణ క్రియారూపమైనప్పటికీ, సందర్భంలో యోబు ఇప్పుడు ప్రకటిస్తున్న నిర్ధారణగా అర్థం చేసుకోవచ్చు. గతకాల లేదా సంపూర్ణ భావం కూడా సాధ్యమే కాబట్టి దాన్ని పాదసూచికలో ఉంచాం.
- source_word: תָּם
  choice: నిందలేనివాడు
  rationale: ఇక్కడ పాపరహిత పరిపూర్ణత కంటే యథార్థత, సమగ్ర నడవడి అనే భావం ఉంది. ‘నిందలేనివాడు’ ఆ భావాన్ని మతశాఖాపరమైన అదనపు అర్థం లేకుండా అందిస్తుంది.
- source_word: רָשָׁע
  choice: దుష్టుడు
  rationale: నైతికంగా దోషియైన వ్యక్తిని సూచించే సాధారణ తెలుగు పదం; ‘నిందలేనివాడు’తో ఉన్న వ్యత్యాసాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: הוּא מְכַלֶּה
  choice: ఆయనే నాశనం చేస్తాడు
  rationale: పుంలింగ ఏకవచన సర్వనామం, కృదంతం కలిసిన ఈ పదబంధానికి సందర్భంలో దేవుడే అంతర్లీన కర్తగా ఉండటం సహజం. ‘నాశనం చేస్తాడు’ כלה యొక్క బలమైన భావాన్ని నిలుపుతుంది; నిరపేక్ష కర్తతో చదివే అవకాశాన్ని పాదసూచికలో తెలిపాం.
theological_decisions:
- issue: ‘నాశనం చేస్తాడు’ అనే క్రియకు అంతర్లీన కర్త
  choice: యోబు మాటల్లో దేవుణ్ణి సూచిస్తూ ‘ఆయనే’ అని వ్యక్తిగత కర్తగా అనువదించాం.
  alternative: ‘అది నిందలేనివాణ్ణీ దుష్టుణ్ణీ నాశనం చేస్తుంది’ అని నిరపేక్షంగా కూడా అర్థం చేసుకోవచ్చు.
  rationale: యోబు 9వ అధ్యాయంలో దేవుని పరిపాలన, అణచలేని శక్తి గురించి యోబు మాట్లాడుతున్నందున దేవుడే కర్తగా ఉండటం సందర్భానికి బాగా సరిపోతుంది. అయితే యోబు చేస్తున్న తీవ్రమైన ఆరోపణను మృదువుచేయకుండా అలాగే ఉంచుతూ, హీబ్రూ వాక్యంలోని కొంత కర్త-అస్పష్టతను పాదసూచికలో సంరక్షించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలిని ఉపయోగించాం. ‘ఆయనే’ అనే ఉద్ఘాటన హీబ్రూ הוּאను ప్రతిబింబిస్తుంది. యోబు పలికే కఠినమైన దైవశాస్త్ర ఉద్రిక్తతను వివరణతో తగ్గించకుండా మూలవాక్య బలంతోనే నిలిపాం.
