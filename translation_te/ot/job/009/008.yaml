translation:
  language: te
  text: 'ఆయన ఒక్కడే ఆకాశాలను విస్తరించేవాడు,

    సముద్రపు ఎత్తుల మీద నడిచేవాడు[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘సముద్రపు అలల మీద నడిచేవాడు.’
    reason: בָּמֳתֵי יָם అనే పదబంధాన్ని సముద్రపు పైకి లేచే అలలను సూచించే విధంగా అర్థం చేసుకోవచ్చు.
lexical_decisions:
- source_word: נֹטֶה
  choice: పరచి
  rationale: נטה అనే క్రియ ఆకాశాలను చాపడం లేదా విస్తరించడం అనే భావాన్ని ఇస్తుంది. ‘పరచి’ అనేది తెలుగు కవితాత్మక సందర్భంలో సహజంగా ఉండి, మూలంలోని సృష్టి చిత్రణను నిలుపుతుంది.
- source_word: שָׁמַיִם
  choice: ఆకాశాలను
  rationale: కవితాత్మక విశ్వసృష్టి సందర్భంలో ఈ బహువచన రూపం విస్తారమైన ఆకాశమండలాన్ని సూచిస్తుంది; ‘ఆకాశాలను’ మూలంలోని రూపాన్నీ భావాన్నీ సమీపంగా ప్రతిబింబిస్తుంది.
- source_word: לְבַדּוֹ
  choice: ఆయన ఒక్కడే
  rationale: దేవుడు ఎవరి సహాయం లేకుండా తానే ఈ కార్యం చేస్తాడనే ప్రత్యేకతను స్పష్టంగా, సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: וְדוֹרֵךְ
  choice: నడుస్తాడు
  rationale: דרך అంటే తొక్కడం లేదా నడవడం. ఇక్కడ విధ్వంస భావాన్ని అనవసరంగా చేర్చకుండా, సముద్రంపై దేవుని ఆధిపత్యాన్ని తెలిపే సజీవ చిత్రాన్ని ‘నడుస్తాడు’ నిలుపుతుంది.
- source_word: עַל
  choice: మీద
  rationale: హీబ్రూ ఉపసర్గకు సందర్భానుగుణమైన సాధారణ తెలుగు సమానార్థకం.
- source_word: בָּמֳתֵי
  choice: ఎత్తుల
  rationale: במה యొక్క ప్రాథమిక భావం ‘ఎత్తు’ లేదా ‘ఎత్తైన స్థలం.’ ప్రధాన పాఠంలో ‘ఎత్తుల’ అని ఉంచడం ద్వారా మూలంలోని అసాధారణ కవితాత్మక రూపకాన్ని వ్యాఖ్యానంతో కలిపివేయకుండా కాపాడుతుంది.
- source_word: יָם
  choice: సముద్రపు
  rationale: హీబ్రూలోని ఏకవచన ‘సముద్రం’ను, దాని విభక్తి సంబంధాన్ని తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: సృష్టిపై దేవుని ఏకైక సార్వభౌమత్వాన్ని తెలిపే విశ్వసంబంధ కవితా చిత్రం
  choice: దేవుడు ఒక్కడే ఆకాశాలను పరచి సముద్రపు ఎత్తుల మీద నడుస్తాడనే కవితాత్మక చిత్రణను యథాతథంగా నిలుపడం
  alternative: ‘సముద్రపు అలల మీద నడుస్తాడు’ అని భావానువాదం చేయడం
  rationale: ఈ వచనం దేవుని ప్రత్యేక అధికారాన్ని ఉన్నతమైన కవితా భాషలో చూపుతుంది. ప్రధాన పాఠం ‘ఎత్తులు’ అనే మూల రూపకాన్ని నిలుపుతుంది; ‘అలలు’ అనే సంభావ్య భావాన్ని పాదసూచికలో ఇస్తుంది. తద్వారా తరువాతి సిద్ధాంతపరమైన భావాలను పాఠ్యంలోకి దిగుమతి చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గంభీరమైన కవితా శైలి వాడబడింది. ‘ఆయన ఒక్కడే’ దేవుని సహాయరహిత ఏకైక కార్యాన్ని నొక్కిచెబుతుంది; ‘సముద్రపు ఎత్తులు’ మూలంలోని ఉద్దేశపూర్వకమైన కవితాత్మక అస్పష్టతను నిలుపుతుంది.
