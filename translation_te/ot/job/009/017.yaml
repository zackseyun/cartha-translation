  text: who crushes me in a storm and multiplies my wounds without cause[a][b][c].
translation:
  language: te
  text: తుఫానులో నన్ను నలిపివేసి, కారణం లేకుండానే నా గాయాలను పెంచేవాడు[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘తుఫానుతో’ లేదా ‘సుడిగాలిలో.’ హీబ్రూ ఉపసర్గ విధానాన్ని లేదా సాధనాన్ని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ఈ క్రియను ‘నన్ను గాయపరచి’ అని కూడా అనువదించవచ్చు; ఇక్కడ అంతగా సంభవించని మరో అర్థం ‘నాపై విరుచుకుపడి.’
    reason: lexical_alternative
  - marker: c
    text: లేదా ‘ఏ కారణమూ లేకుండా’ లేదా ‘నిర్హేతుకంగా.’
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: వాడు
  rationale: మునుపటి సందర్భంలోని దేవుని గురించి కొనసాగించే సంబంధార్థక ప్రయోగం; తెలుగులో క్రియాంతంలోని ‘వాడు’ సహజంగా ఆ సంబంధాన్ని తెలియజేస్తుంది.
- source_word: בִּשְׂעָרָה
  choice: తుఫానులో
  rationale: שְׂעָרָה అంటే తుఫాను లేదా సుడిగాలి. ב ఉపసర్గ స్థితి/విధానాన్ని గానీ సాధనాన్ని గానీ సూచించగలదు; ‘తుఫానులో’ చిత్రాత్మకతను నిలుపుతూ సాధనార్థాన్ని అతిగా నిర్ణయించదు.
- source_word: יְשׁוּפֵנִי
  choice: నన్ను నలిపివేసి
  rationale: అరుదైన שׁוף ధాతువు ఇక్కడ తీవ్రమైన హానిని సూచిస్తుంది; తరువాతి ‘గాయాలు’తో సమాంతరంగా ‘నలిపివేయు’ బలమైన భావాన్ని సహజంగా అందిస్తుంది.
- source_word: וְהִרְבָּה
  choice: విస్తరింపజేసి
  rationale: רבה హిఫీల్ రూపం ‘ఎక్కువ చేయు, పెంచు’ అనే అర్థం ఇస్తుంది. గాయాల సంఖ్య లేదా తీవ్రత పెరగడాన్ని ‘విస్తరింపజేయు’ కవితాత్మకంగా తెలియజేస్తుంది.
- source_word: פְצָעַי
  choice: నా గాయాలను
  rationale: פצע కు నేరమైన, సందర్భోచితమైన తెలుగు సమానం ‘గాయం’.
- source_word: חִנָּם
  choice: కారణం లేకుండానే
  rationale: חִנָּם లోని ‘నిర్హేతుకంగా, ఏ కారణమూ లేకుండా’ అనే నైతిక-న్యాయపరమైన బలాన్ని నిలుపుతుంది; ‘నేను అర్హుడిని కాను’ అనే వివరణను అదనంగా చేర్చదు.
theological_decisions:
- issue: חִנָּם యోబు సంపూర్ణ నిర్దోషిత్వాన్ని ప్రకటిస్తుందా, లేక తన బాధ అనర్హమైనదనే అతని ఫిర్యాదును వ్యక్తం చేస్తుందా
  choice: ‘కారణం లేకుండానే’ అని నేరుగా అనువదించి ఫిర్యాదు బలాన్ని, వేదాంతపరమైన ఉద్రిక్తతను నిలుపడం
  alternative: ‘నేను దానికి అర్హుడిని కాకపోయినా’ లేదా ‘ఏ కారణమూ లేకుండా’
  rationale: వాక్యం యోబు ఫిర్యాదును వినిపిస్తుంది; దేవుని న్యాయం గురించిన తుది నిర్ణయాన్ని ఇందులోకి చొప్పించకూడదు, అలాగే యోబు మాటల తీవ్రతను తగ్గించకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కవితాత్మక గంభీరతతో పాటు సాధారణ పాఠకులకు అర్థమయ్యే పదజాలం. మూలంలోని సంబంధ వాక్య నిర్మాణాన్ని నిలిపి, హీబ్రూ ఉపసర్గ మరియు అరుదైన క్రియలోని అస్పష్టతలను పాదటిప్పణుల్లో సంరక్షించాం.
