translation:
  language: te
  text: నేను నిర్దోషినైనా, జవాబు చెప్పను; నా న్యాయాధిపతి వద్ద కనికరం కోసం వేడుకుంటాను.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: צָדַקְתִּי
  choice: నేను నిర్దోషినైనా
  rationale: ఇక్కడ צדק న్యాయవిచారణ సందర్భంలో ‘న్యాయపక్షంలో ఉండడం/నిర్దోషిగా ఉండడం’ అనే భావాన్ని ఇస్తుంది; సహజమైన ఆధునిక తెలుగులో ‘నిర్దోషినైనా’ అని వ్యక్తీకరించాం.
- source_word: לֹא אֶעֱנֶה
  choice: జవాబు చెప్పను
  rationale: ענה అనే క్రియను న్యాయస్థాన సందర్భానికి సరిపోయే సాధారణ అర్థమైన ‘జవాబు చెప్పడం’గా అనువదించాం; ఇది యోబు తన నిర్దోషిత్వాన్ని వాదించబోడనే భావాన్ని ఉద్దేశపూర్వకంగా అతిగా వివరించదు.
- source_word: לִמְשֹׁפְטִי
  choice: నా న్యాయాధిపతిని
  rationale: שפט అనే మూలం ఇక్కడ యోబుకు తీర్పు తీర్చేవానిని సూచిస్తుంది. హీబ్రూ రూపంలోని మొదటి పురుష సంబంధాన్ని ‘నా’తో నిలిపాం.
- source_word: אֶתְחַנָּן
  choice: కనికరం కోసం వేడుకుంటాను
  rationale: חנן మూలానికి సంబంధించిన ఈ హిత్పయేల్ రూపం కృప లేదా కనికరం కోరుతూ వేడుకోవడాన్ని సూచిస్తుంది; లక్ష్యభాషలో భావం స్పష్టంగా ఉండేందుకు ‘కనికరం కోసం’ చేర్చాం.
theological_decisions:
- issue: యోబు నిర్దోషిత్వం మరియు న్యాయాధిపతి ఎదుట అతని వైఖరి
  choice: ‘నేను నిర్దోషినైనా’ అని షరతును నిలిపి, అయినప్పటికీ జవాబు చెప్పకుండా కనికరం కోసం వేడుకుంటాననే ఉద్రిక్తతను అలాగే ఉంచాం.
  alternative: ‘నేను నీతిమంతుడినని తెలిసినా’ లేదా ‘నేను నిర్దోషినని నిరూపించుకున్నా’ అని మరింత నిర్దిష్టంగా వ్యాఖ్యానించడం.
  rationale: మూలవాక్యం యోబు వాస్తవంగా నిర్దోషి అని ఇక్కడ తేల్చదు; ఊహాత్మక షరతుతో న్యాయవాదం మరియు కనికర విజ్ఞప్తి మధ్య ఉన్న వేదాంతపరమైన ఉద్రిక్తతను నిలుపుతుంది.
- issue: ‘నా న్యాయాధిపతి’ ఎవరో స్పష్టీకరించడం
  choice: మూలంలోని సాధారణ న్యాయపదాన్ని ‘నా న్యాయాధిపతి’గానే ఉంచాం.
  alternative: ‘దేవుడైన నా న్యాయాధిపతి’ అని స్పష్టీకరించడం.
  rationale: సందర్భం దేవునివైపు చూపినా, ఈ వాక్యంలో దైవనామం ప్రత్యక్షంగా లేదు; అనువాదంలో దానిని చేర్చి మూలంలోని సూచనాత్మకతను తొలగించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన వాక్యనిర్మాణం. ‘నిర్దోషి’, ‘న్యాయాధిపతి’, ‘కనికరం’ వంటి పదాలు న్యాయస్థాన నేపథ్యాన్ని మరియు ప్రార్థనాత్మక స్వరాన్ని సాధారణ పాఠకునికి స్పష్టంగా అందిస్తాయి.
