  rationale: ענה అనే క్రియ ఈ సంభాషణ సందర్భంలో ముందటి మాటకు ప్రతిస్పందనను పరిచయం చేస్తుంది; ‘జవాబిచ్చాడు’ ఆధునిక తెలుగులో సహజంగా ఉండి ఆ సంభాషణాత్మక భావాన్ని నిలుపుతుంది.
