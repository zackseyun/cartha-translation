source:
  edition: WLC
  text: הֵ֤ן יַעֲבֹ֣ר עָ֭לַ/י וְ/לֹ֣א אֶרְאֶ֑ה וְ֝/יַחֲלֹ֗ף וְֽ/לֹא אָבִ֥ין לֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/011.yaml
  text: Look[a], he passes by me, and I do not see him; he moves on[c][b], and I do not perceive him.
translation:
  language: te
  text: ఇదిగో[a], ఆయన నా పక్కగా వెళ్తాడు, నేను ఆయనను చూడను; ఆయన దాటిపోతాడు[b], నేను ఆయనను గ్రహించను[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నిశ్చయంగా.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘వెళ్లిపోతాడు.’
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘ఆయనను అర్థం చేసుకోను’; హీబ్రూ పదం గ్రహించడం, వివేచించడం లేదా అర్థం చేసుకోవడం అనే భావాలను ఇవ్వగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: ఇదిగో
  rationale: బలమైన దృష్టి-ఆహ్వానాన్ని సహజమైన, గౌరవప్రదమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది; ‘నిశ్చయంగా’ కంటే మూలంలోని సజీవ సూచనాత్మక భావాన్ని బాగా నిలుపుతుంది.
- source_word: יַעֲבֹר עָלַי
  choice: నా పక్కగా వెళ్లినా
  rationale: עבר తో వచ్చిన עלי ఇక్కడ యోబుకు సమీపంగా దాటివెళ్లడాన్ని సూచిస్తుంది. ‘నా మీదుగా’ అనేది తొక్కడం లేదా పైభాగంలో కదలడం అనే అనవసరమైన భావాన్ని కలిగించవచ్చు; ‘నా పక్కగా’ సందర్భానుకూలంగా సహజంగా ఉంది.
- source_word: וְלֹא אֶרְאֶה
  choice: నేను ఆయనను చూడను
  rationale: నిరాకరణతో కూడిన ראה క్రియను నేరుగా అనువదిస్తుంది. ‘చూడలేను’ అని ఇస్తే మూలంలో స్పష్టంగా లేని అసమర్థత భావం చేరుతుంది.
- source_word: יַחֲלֹף
  choice: దాటిపోయినా
  rationale: חלף లోని దాటిపోవడం లేదా ముందుకు వెళ్లిపోవడం అనే చలన భావాన్ని తెలుగులో సహజంగా అందిస్తుంది; మొదటి క్రియతో ఉన్న కవితాత్మక సమాంతరతను కూడా నిలుపుతుంది.
- source_word: אָבִין לוֹ
  choice: ఆయనను గ్రహించను
  rationale: בין వివేచించడం, గుర్తెరగడం, అర్థం చేసుకోవడం అనే భావపరిధిని కలిగి ఉంది. కనిపించకుండా దాటిపోయే సందర్భంలో ‘గ్రహించను’ ఇంద్రియాతీత అవగాహనతో పాటు అర్థగ్రహణంలోని అస్పష్టతను కూడా నిలుపుతుంది.
theological_decisions:
- issue: మూడవ పురుష ఏకవచన కర్త మరియు సర్వనామ సూచన
  choice: ‘ఆయన’ దేవుణ్ణి సూచిస్తుంది
  alternative: ఎవరో ఒకరు అనే అనిర్దిష్ట కర్త
  rationale: యోబు 9:10–12 సమీప సందర్భం దేవుని అగోచరమైన, పరిశోధించలేని కార్యాలను వర్ణిస్తుంది. అయినా ఈ వచనంలో లేని ‘దేవుడు’ అనే నామాన్ని చేర్చకుండా, గౌరవార్థక ‘ఆయన’తో వ్యక్తిగత సూచనను నిలిపాం.
- issue: אָבִין לוֹ లో అవగాహనా లేక ప్రత్యక్షగ్రహణమా
  choice: ‘ఆయనను గ్రహించను’
  alternative: ‘ఆయనను అర్థం చేసుకోను’
  rationale: సందర్భం దేవుడు కనిపించకుండా దాటిపోవడాన్ని చెబుతున్నందున ప్రత్యక్షగ్రహణ భావం ప్రధానంగా ఉంది; అయితే בין యొక్క ‘అర్థం చేసుకోవడం’ అనే భావసాధ్యతను పాదటిప్పణిలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కవితా వాక్యనిర్మాణం వాడబడింది. దేవునికి గౌరవార్థక ఏకవచనమైన ‘ఆయన’ ఉపయోగించబడింది. రెండు సమాంతర క్రియల మధ్య స్వల్ప భేదాన్ని ఉంచుతూ మూలంలోని కవితాత్మక చలనాన్ని నిలిపాం.
