  text: לֹ֣א יֵשׁ בֵּינֵ֣י/נוּ מוֹכִ֑יחַ יָשֵׁ֖ת יָד֣/וֹ עַל שְׁנֵֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/033.yaml
  text: There is no arbiter between us[a], who might lay his hand on us both.
translation:
  language: te
  text: మన ఇద్దరి మధ్య తీర్పు చెప్పి, మన ఇద్దరిపైనా తన చెయ్యి ఉంచగలవాడు ఎవరూ లేడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֹא יֵשׁ
  choice: ఎవరూ లేడు
  rationale: హీబ్రూ అస్తిత్వనిషేధాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: בֵּינֵינוּ
  choice: మన ఇద్దరి మధ్య
  rationale: వివాదంలోని రెండు పక్షాలైన దేవుడు, యోబు మధ్య సంబంధాన్ని ‘ఇద్దరి’ అనే పదంతో స్పష్టం చేస్తుంది.
- source_word: מוֹכִיחַ
  choice: తీర్పు చెప్పేవాడు
  rationale: ఈ సందర్భంలో యכח ధాతురూపం గద్దించేవాడికన్నా వివాదంలోని రెండు పక్షాల విషయాన్ని నిర్ణయించే న్యాయపాత్రను సూచిస్తుంది; సాధారణ పాఠకులకు ఈ పదబంధం సహజంగా అర్థమవుతుంది.
- source_word: יָשֵׁת
  choice: ఉంచగలవాడు
  rationale: లేని మధ్యవర్తి చేయగల సంభావ్య కార్యాన్ని తెలుగులో తెలియజేస్తుంది; హీబ్రూ అసంపూర్ణ క్రియలోని సాధ్యతా భావాన్ని నిలుపుతుంది.
- source_word: יָדוֹ
  choice: తన చెయ్యి
  rationale: అధికారం లేదా నియంత్రణను సూచించగల హీబ్రూ దృశ్యరూపాన్ని వ్యాఖ్యానించి తొలగించకుండా యథాతథంగా నిలుపుతుంది.
- source_word: עַל שְׁנֵינוּ
  choice: మన ఇద్దరిమీద
  rationale: తీర్పు చెప్పేవాడు రెండు పక్షాలపైనా సమానంగా చెయ్యి ఉంచే చిత్రాన్ని సంక్షిప్తంగా కాపాడుతుంది.
theological_decisions:
- issue: מוֹכִיחַ పదాన్ని తరువాతి క్రైస్తవ మధ్యవర్తిత్వ భావాన్ని సూచించేలా అనువదించాలా
  choice: తీర్పు చెప్పేవాడు
  alternative: మధ్యవర్తి
  rationale: యోబు, దేవుని మధ్య న్యాయవివాదాన్ని నిర్ణయించే మూడవ వ్యక్తి అనే తక్షణ సందర్భాన్ని ప్రధాన పాఠం కాపాడుతుంది. ‘మధ్యవర్తి’ సాధ్యమైన అర్థమే అయినా, వచనం స్పష్టంగా చెప్పనంత విస్తృతమైన theological భావాన్ని ప్రధాన పాఠంలోకి తీసుకురాకుండా దానిని పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనదిగానూ సాధారణ పాఠకులకు సులభంగానూ ఉంది. హీబ్రూ సమాంతర నిర్మాణాన్ని సహజమైన రెండు పాదాలుగా అందించి, ‘చెయ్యి ఉంచడం’ అనే సజీవ దృశ్యాన్ని నిలిపింది.
