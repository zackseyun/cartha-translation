    text: లేదా, ‘మధ్యవర్తి.’ హీబ్రూ పదం వివాదంలో ఉన్న రెండు పక్షాల మధ్య తీర్పు చెప్పే లేదా జోక్యం చేసుకునే వ్యక్తిని సూచించగలదు.
    reason: lexical_alternative
  revision_rationale: The revision preserves the single Hebrew existential negation and makes ‘lay his hand on us both’ the potential action of the absent adjudicating third party. It retains the judicial sense in the main text, the literal hand image, and the lexical alternative in the footnote.
