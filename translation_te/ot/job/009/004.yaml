source:
  edition: WLC
  text: חֲכַ֣ם לֵ֭בָב וְ/אַמִּ֣יץ כֹּ֑חַ מִֽי הִקְשָׁ֥ה אֵ֝לָ֗י/ו וַ/יִּשְׁלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/004.yaml
  text: He is wise in heart and mighty in strength[a]; who has hardened himself against him and prospered?
translation:
  language: te
  text: 'ఆయన హృదయంలో జ్ఞానవంతుడు, బలంలో శక్తిమంతుడు;

    ఆయనకు ఎదిరించి మొండిగా ప్రవర్తించి క్షేమంగా బయటపడినవాడెవడు?[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘సఫలుడయ్యాడు,’ ‘హాని లేకుండా నిలిచాడు.’ హీబ్రూ క్రియ క్షేమంగా, హాని లేకుండా బయటపడడం లేదా సంపూర్ణంగా ఉండడం అనే భావాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲכַם לֵבָב
  choice: హృదయంలో జ్ఞాని
  rationale: లֵבָב బుద్ధి, సంకల్పాలకు కేంద్రంగా ఉన్న ‘హృదయం’ అనే హీబ్రూ రూపకాన్ని నిలుపుతూ, కేవలం ‘జ్ఞాని’ అని సరళీకరించకుండా అనువదించబడింది.
- source_word: וְאַמִּיץ כֹּחַ
  choice: బలంలో మహాశక్తిమంతుడు
  rationale: אַמִּיץ మరియు כֹּחַ కలిపి వ్యక్తం చేసే ప్రబలమైన శక్తిని తెలుగు కవితా శైలిలో సహజంగా, గంభీరంగా తెలియజేస్తుంది.
- source_word: מִי
  choice: ఎవడు?
  rationale: ఇది జవాబు ఆశించని అలంకారిక ప్రశ్న. ‘ఎవడు?’ దాని సంక్షిప్తతను, బలాన్ని నిలుపుతుంది.
- source_word: הִקְשָׁה אֵלָיו
  choice: ఆయనకు ఎదురు మొండిగా నిలిచి
  rationale: హిఫీల్ రూపంలోని తనను తాను కఠినపరచుకునే లేదా మొండిగా ప్రతిఘటించే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; אֵלָיו ఇక్కడ వ్యతిరేక దిశను సూచిస్తుంది.
- source_word: וַיִּשְׁלָם
  choice: క్షేమంగా బయటపడిన
  rationale: שלם మూలం ఇక్కడ సంపూర్ణంగా, హాని లేకుండా, క్షేమంగా గట్టెక్కే ఫలితాన్ని సూచిస్తుంది. ‘క్షేమంగా బయటపడిన’ సందర్భానికి సహజంగా ఉండి ఆ భావవిస్తృతిని కాపాడుతుంది.
theological_decisions:
- issue: వాక్యారంభంలోని అవ్యక్త కర్త
  choice: ‘ఆయన’ అని పూరించబడింది; సందర్భానుసారం ఇది దేవుణ్ణి సూచిస్తుంది.
  alternative: కర్తను పేర్కొనకుండా నామవాచక వాక్యంగా ఉంచడం.
  rationale: హీబ్రూలో కర్త ప్రత్యక్షంగా లేకపోయినా, యోబు ప్రసంగపు పరిసర సందర్భం దేవుణ్ణే సూచిస్తుంది. తెలుగులో స్పష్టత, సహజత్వం కోసం ‘ఆయన’ను పూరించడం కొత్త సిద్ధాంతార్థాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, యోబు కవిత్వానికి తగిన గంభీరతతో అనువదించబడింది. హీబ్రూ హృదయ-రూపకం నిలుపబడింది; ప్రతిఘటనను సూచించే పదబంధం అక్షరానువాదపు అసహజత లేకుండా సహజంగా ఇవ్వబడింది. పాద విభజన అలంకారిక ప్రశ్న యొక్క బలాన్ని స్పష్టం చేస్తుంది.
