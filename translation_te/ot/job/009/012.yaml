  yaml_path: translation/ot/job/009/012.yaml
  text: Look[a], if he snatches away, who can turn him back? Who can say to him[b], ‘What are you doing?’
translation:
  language: te
  text: ఇదిగో, ఆయన అకస్మాత్తుగా లాక్కుపోతే[a], ఆయనను వెనక్కి మరల్చగలరు ఎవరు[b]? “మీరు ఏమి చేస్తున్నారు?” అని ఆయనతో చెప్పగలరు ఎవరు?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పట్టుకుపోతే,” “బలవంతంగా తీసుకుపోతే.” హీబ్రూ క్రియ ఆకస్మికంగా, బలంగా తీసుకుపోవడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ఆయనను తిరిగి రప్పించగలరు ఎవరు?” హీబ్రూ క్రియకు అక్షరార్థం, “ఆయనను తిరిగి వచ్చేలా చేయడం.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: ఇదిగో
  rationale: దృష్టిని ఆకర్షిస్తూ వాక్యానికి నొక్కి చెప్పే బలాన్ని ఇచ్చే హీబ్రూ అవ్యయాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: יַחְתֹּף
  choice: అకస్మాత్తుగా లాక్కుపోతే
  rationale: חטף అనే క్రియలో ఆకస్మికంగా, బలవంతంగా పట్టుకొని తీసుకుపోయే భావం ఉంది; ‘అకస్మాత్తుగా’ ఆ తీవ్రతను స్పష్టం చేస్తుంది.
- source_word: יְשִׁיבֶנּוּ
  choice: ఆయనను వెనక్కి తిప్పగలవారు
  rationale: שוב హిఫీల్ రూపం ‘తిరిగి వచ్చేలా చేయడం’ లేదా ‘వెనక్కి తిప్పడం’ అనే భావాన్ని ఇస్తుంది. సందర్భంలో ప్రత్యయం దేవుణ్ణి సూచిస్తుందని తీసుకొని వ్యక్తిగత సర్వనామంతో అనువదించబడింది.
- source_word: מִי
  choice: ఎవరు ... గలవారు?
  rationale: ఇవి కేవలం వ్యక్తిని గుర్తించే ప్రశ్నలు కాక, ఎవరికీ సాధ్యం కాదనే భావాన్ని తెలిపే అలంకారిక ప్రశ్నలు; ‘గలవారు’ ఆ అసాధ్యతను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: יֹאמַר אֵלָיו
  choice: ఆయనతో అనగలవారు
  rationale: మూలంలోని ‘ఆయనతో చెప్పు’ అనే సరళమైన భావాన్ని అదనపు నిరసనార్థం చేర్చకుండా నిలుపుతుంది.
- source_word: מַה תַּעֲשֶׂה
  choice: నీవు ఏమి చేస్తున్నావు?
  rationale: ఈ సందర్భంలో అసంపూర్ణ క్రియారూపం జరుగుతున్న చర్యను ప్రశ్నించే సవాలుగా సహజంగా వినిపిస్తుంది.
theological_decisions:
- issue: మూడవ పురుష ఏకవచన ప్రత్యయాల సూచిత వ్యక్తి
  choice: ‘ఆయన ... ఆయనను’ అని దేవుణ్ణి సూచించే వ్యక్తిగత సర్వనామాలతో అనువదించడం
  alternative: దేవుడు లాక్కుపోయిన దానిని సూచిస్తూ ‘దానిని తిరిగి తెచ్చేవారు ఎవరు?’ అని అనువదించడం
  rationale: తక్షణ సందర్భం దేవుని అడ్డుకోలేని కార్యాన్ని వివరిస్తుంది; తరువాతి పాదం కూడా నేరుగా ఆయనతో మాట్లాడగలవారు ఎవరని అడుగుతుంది. అయినా హీబ్రూ ప్రత్యయరూపం ఒక్కటే చూసినప్పుడు సూచితార్థంలో కొంత సందిగ్ధత ఉండవచ్చు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయితే యోబు వాక్యంలోని గంభీరమైన అలంకారిక ప్రశ్నల బలాన్ని కాపాడేలా రూపొందించబడింది. దేవుణ్ణి సూచించేందుకు గౌరవార్థక ‘ఆయన’ మరియు బహువచన క్రియారూపాలు వాడబడ్డాయి.
