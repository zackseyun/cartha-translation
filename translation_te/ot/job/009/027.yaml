  yaml_path: translation/ot/job/009/027.yaml
  text: If I say[a], ‘I will forget my complaint[b]; I will put aside my sad face and be cheerful,’
translation:
  language: te
  text: “నా గోడును మరచిపోతాను; నా ముఖంలోని దిగులును విడిచి ఉల్లాసంగా ఉంటాను” అని నేను చెప్పుకుంటే,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మూలభాషలో ఇది షరతుతో కూడిన స్వీయసంకల్పం: ‘నేను ఇలా చెప్పుకుంటే.’ తరువాతి వచనం ఈ ప్రయత్నం చేసినప్పటికీ యోబుకు కలిగే భయాన్ని తెలియజేస్తుంది.'
    reason: discourse_clarification
lexical_decisions:
- source_word: אִם אָמְרִי
  choice: అని నేను అనుకుంటే
  rationale: אִם షరతును సూచిస్తుంది; אָמְרִי ఇక్కడ తనలో తాను చెప్పుకోవడం లేదా సంకల్పించుకోవడం అనే భావంలో ఉంది. సహజమైన తెలుగులో ‘అని నేను అనుకుంటే’ ఊహాత్మక భావాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: אֶשְׁכְּחָה
  choice: మరచిపోతాను
  rationale: మొదటి పురుషుని సంకల్పాన్ని నేరుగా నిలుపుతుంది.
- source_word: שִׂיחִי
  choice: నా గోడును
  rationale: ఈ విలాప సందర్భంలో ఈ పదం తటస్థ ధ్యానం కంటే బాధతో కూడిన అంతరంగపు మాట లేదా ఫిర్యాదును సూచిస్తుంది; ‘గోడు’ ఆ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: אֶעֶזְבָה פָנַי
  choice: నా దిగులైన ముఖాన్ని విడిచి
  rationale: అక్షరార్థంగా ‘నా ముఖాన్ని విడిచిపెడతాను.’ ముఖంలోని దిగులైన భావాన్ని తొలగించుకోవడం అనే నుడికార భావాన్ని, మూలంలోని ‘ముఖం’ రూపకాన్ని నిలుపుతూ తెలుగులో తెలియజేస్తుంది.
- source_word: וְאַבְלִיגָה
  choice: ఉల్లాసంగా ఉంటాను
  rationale: בלג ఇక్కడ దుఃఖాన్ని తగ్గించుకొని ముఖకవళికలో లేదా మనోభావంలో తేలికపడడాన్ని సూచిస్తుంది. ‘ఉల్లాసంగా ఉంటాను’ సందర్భానికి సహజంగా సరిపోతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, విలాపానికి తగిన గంభీరతతో అనువదించబడింది. ‘గోడు’ సాధారణ పాఠకులకు అర్థమయ్యేలా ఉండి, బాధతో కూడిన అంతరంగపు ఫిర్యాదు భావాన్ని నిలుపుతుంది. మూలంలోని ‘ముఖాన్ని విడిచిపెట్టడం’ అనే నుడికారాన్ని ‘దిగులైన ముఖాన్ని విడిచి’ అని స్వల్పంగా స్పష్టం చేశాం.
