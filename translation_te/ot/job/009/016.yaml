  text: If I called and he answered me[a], I would not believe that he was listening to my voice.
translation:
  language: te
  text: నేను పిలిచి ఆయన నాకు జవాబు ఇచ్చినా[a], ఆయన నా స్వరాన్ని ఆలకిస్తున్నాడని నేను నమ్మను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “నేను మొరపెట్టి ఆయన నాకు జవాబు ఇచ్చినా, ఆయన నా స్వరానికి చెవియొగ్గుతున్నాడని నేను నమ్మను.”'
    reason: קראకు ‘మొరపెట్టు,’ אזןకు ‘చెవియొగ్గు’ అనే సాధ్యమైన మరింత సాక్షాత్కార ప్రత్యామ్నాయాలను చూపించడానికి.
lexical_decisions:
- source_word: אִם
  choice: పిలిచినా
  rationale: ఇక్కడ אִם ఊహాత్మక షరతును సూచిస్తుంది. తెలుగు సహజ వాక్యనిర్మాణంలో ‘నేను పిలిచినా’ అనే concessive-conditional రూపం సందర్భంలోని భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: קָרָאתִי
  choice: నేను పిలిచినా
  rationale: קרא సాధారణంగా ‘పిలుచు’ లేదా ‘మొరపెట్టు’ అని అర్థం. మూలంలో అవసరానికి మించిన భావోద్వేగ తీవ్రతను చేర్చకుండా ‘పిలిచినా’ అని అనువదించబడింది.
- source_word: וַיַּעֲנֵנִי
  choice: ఆయన నాకు జవాబిచ్చినా
  rationale: ענה యొక్క సాధారణ అర్థం ‘జవాబివ్వడం’; ఈ రూపం తెలుగు పాఠకులకు సహజంగా, నేరుగా ఉంటుంది.
- source_word: לֹא אַאֲמִין
  choice: నేను నమ్మను
  rationale: ఊహాత్మక సందర్భంలో తెలుగులో ‘నమ్మను’ సహజంగా ‘నమ్మలేను/నమ్మకపోవచ్చు’ అనే భావబలాన్ని ఇస్తుంది; మూలంలోని వ్యక్తిగత అవిశ్వాసాన్ని అతిశయింపకుండా ఉంచుతుంది.
- source_word: כִּי
  choice: అని
  rationale: כִּי ఇక్కడ కారణాన్ని కాక, యోబు నమ్మని విషయవిషయక ఉపవాక్యాన్ని పరిచయం చేస్తుంది; అందువల్ల ‘అని’ సరైన తెలుగు అనుసంధానం.
- source_word: יַאֲזִין
  choice: ఆలకించాడని
  rationale: אזן కేవలం వినడమే కాక శ్రద్ధగా చెవియొగ్గి వినడాన్ని సూచిస్తుంది. ‘ఆలకించు’ ఈ సూక్ష్మార్థాన్ని గౌరవప్రదమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: קוֹלִי
  choice: నా స్వరాన్ని
  rationale: קוֹלִי యొక్క ప్రత్యక్ష అర్థం ‘నా స్వరం’. ‘నా మొర’ అని భావానువాదం చేయకుండా మూలంలోని రూపాన్ని కాపాడుతుంది.
theological_decisions:
- issue: దేవుని జవాబు మరియు ఆలకింపు గురించి యోబు మాట
  choice: దేవుడు జవాబిచ్చినా ఆయన నిజంగా తన స్వరాన్ని ఆలకించాడని యోబు నమ్మలేని ఊహాత్మక, వ్యక్తిగత స్థితిగా అనువదించడం.
  alternative: దేవుడు ప్రార్థనను అసలు వినడనే సిద్ధాంతపరమైన నిరాకరణగా, లేదా కేవలం ఆశ్చర్యవ్యక్తీకరణగా అనువదించడం.
  rationale: హీబ్రూ పాఠం యోబు యొక్క అంతర్గత అపనమ్మకాన్ని వ్యక్తం చేస్తుంది; దేవుడు ఎన్నడూ ప్రార్థన వినడనే విశ్వవ్యాప్త సిద్ధాంతాన్ని ప్రకటించదు. ఈ అనువాదం ఆ అస్తిత్వాత్మక, theological tension‌ను పరిష్కరించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన వాక్యనిర్మాణం, అయితే ‘ఆలకించు’ ద్వారా మూలంలోని శ్రద్ధగా వినే భావం మరియు గౌరవప్రదమైన కవితాత్మక శైలి నిలుపబడింది. ప్రధాన పాఠంలోని [a] సూచిక సంబంధిత పాదం వెంట ఉంచబడింది.
