translation:
  language: te
  text: అప్పుడు నీవు నన్ను గోతిలోకి ముంచివేస్తావు[a]; నా బట్టలే నన్ను ఏవగించుకుంటాయి[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘గొయ్యిలోకి.’ హీబ్రూ పదానికి ‘గోతి,’ ‘గొయ్యి,’ లేదా కొన్ని సందర్భాల్లో ‘నాశనం’ అనే అర్థాలు రావచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘నా వస్త్రాలే నన్ను అసహ్యించుకుంటాయి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: అప్పుడు
  rationale: మునుపటి వచనంలోని ఊహాత్మక శుద్ధీకరణకు తరువాత జరిగే పరిణామాన్ని సూచించే కాలక్రమ అవ్యయం.
- source_word: בַּשַּׁחַת
  choice: గోతిలోకి
  rationale: שַׁחַת అనే పదానికి గొయ్యి, గోతి, నాశనం అనే అర్థాలు ఉండవచ్చు. కడుక్కోవడం, ముంచడం అనే సందర్భ చిత్రణలో ‘గోతిలోకి’ సహజంగా ఉండి రూపకాన్ని అతిగా నిర్దిష్టం చేయదు.
- source_word: תִּטְבְּלֵנִי
  choice: నన్ను ముంచివేస్తావు
  rationale: טבל అంటే ముంచడం లేదా మునిగేలా చేయడం. సందర్భంలోని బలమైన క్రియను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וְתִעֲבוּנִי
  choice: నన్ను అసహ్యించుకుంటాయి
  rationale: תעב తీవ్రమైన ఏవగింపు లేదా అసహ్యాన్ని తెలియజేస్తుంది. బహువచన క్రియ తరువాతి ‘నా బట్టలు’ అనే బహువచన కర్తతో అన్వయిస్తుంది.
- source_word: שַׂלְמוֹתָי
  choice: నా సొంత బట్టలే
  rationale: బాహ్య వస్త్రాలను సూచిస్తుంది. ‘సొంత’ మరియు ‘లే’ అనే ప్రయోగాలు యోబుకు అత్యంత సమీపమైన అతని బట్టలు కూడా అతన్ని అసహ్యించుకునే వ్యంగ్య తీవ్రతను సహజంగా వెలిబుచ్చుతాయి.
theological_decisions:
- issue: ద్వితీయ పురుష ఏకవచన క్రియ సూచించే కర్తృత్వం
  choice: యోబు దేవుణ్ణి నేరుగా ఉద్దేశిస్తూ, ‘నీవు నన్ను ... ముంచివేస్తావు’ అని చెబుతున్నట్లు అనువదించబడింది.
  alternative: యోబు కేవలం పరిస్థితులవల్ల గోతిలో పడతాడనే కర్తృత్వరహిత భావం.
  rationale: హీబ్రూ క్రియ ద్వితీయ పురుష ఏకవచనంలో ఉండి, పరిసర సందర్భంలో దేవునికి చేస్తున్న ప్రత్యక్ష సంబోధనను కొనసాగిస్తుంది. యోబు ఫిర్యాదులోని దైవిక కర్తృత్వపు ఉద్రిక్తతను మృదువుచేయకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘ముంచివేస్తావు’ మూలంలోని బలాన్ని, ‘నా సొంత బట్టలే’ వాక్యంలోని వ్యక్తీకరణ మరియు వ్యంగ్యాన్ని నిలుపుతాయి. అన్ని పాదటిప్పణి గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
