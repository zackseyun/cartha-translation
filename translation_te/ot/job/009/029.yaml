  text: אָנֹכִ֥י אֶרְשָׁ֑ע לָ/מָּה זֶּ֝֗ה הֶ֣בֶל אִיגָֽע־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/029.yaml
  text: I will be condemned[a]; why then should I labor in vain?
translation:
  language: te
  text: నేను దోషిగా తీర్పు పొందుతాను[a]; అలాంటప్పుడు నేను వ్యర్థంగా ఎందుకు శ్రమపడాలి?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నేను దుష్టుడిగా ఉంటాను.” హీబ్రూ క్రియకు నైతికంగా ‘దుష్టుడిగా ఉండడం’ అనే అర్థమూ, న్యాయసంబంధంగా ‘దోషిగా తీర్పు పొందడం’ అనే అర్థమూ ఉండవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: אָנֹכִי
  choice: నేను
  rationale: స్వతంత్ర ప్రథమ పురుష సర్వనామం వక్తను నొక్కిచెబుతుంది; తెలుగులో స్పష్టమైన కర్తగా ‘నేను’ ఉంచబడింది.
- source_word: אֶרְשָׁע
  choice: దోషిగా తీర్పు పొందుతాను
  rationale: רשע అనే క్రియకు నైతికంగా ‘దుష్టుడిగా ఉండడం’ అనే అర్థమూ, న్యాయసంబంధ సందర్భంలో ‘దోషిగా తీర్పు పొందడం’ అనే అర్థమూ ఉండవచ్చు. యోబు దేవుని ఎదుట తన నిర్దోషిత్వాన్ని స్థాపించలేననే సందర్భంలో న్యాయసంబంధ అర్థం ప్రధాన పాఠ్యంలో సహజంగా సరిపోతుంది; భవిష్యత్ భావం కూడా నిలుపబడింది.
- source_word: לָמָה זֶּה
  choice: అలాంటప్పుడు … ఎందుకు
  rationale: ఈ హీబ్రూ ప్రయోగం సందర్భం నుంచి వచ్చే నిర్ధారణతో కూడిన ‘అయితే ఎందుకు?’ అనే ప్రశ్నను వ్యక్తం చేస్తుంది. ఆధునిక తెలుగులో ‘అలాంటప్పుడు … ఎందుకు’ ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: הֶבֶל
  choice: వ్యర్థంగా
  rationale: ఈ పదం శూన్యత, నిష్ఫలత, వ్యర్థతను సూచిస్తుంది. ఇక్కడ యోబు చేసే శ్రమ ఫలించదనే భావాన్ని ‘వ్యర్థంగా’ స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: אִיגָע
  choice: శ్రమపడాలి
  rationale: יגע అంటే శ్రమించడం, ప్రయాసపడడం లేదా అలసిపోవడం. అలంకారప్రశ్నలో ‘ఎందుకు శ్రమపడాలి?’ అనేది ప్రయత్నాన్నీ దాని నిష్ఫలతనూ సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: רשע పదంలోని న్యాయసంబంధ భావం లేదా నైతిక భావం
  choice: దోషిగా తీర్పు పొందుతాను
  alternative: నేను దుష్టుడనవుతాను
  rationale: 9:28–31లో యోబు తన నిర్దోషిత్వాన్ని నిరూపించుకోలేననే న్యాయసంబంధ వాదన కొనసాగుతోంది. అందువల్ల ప్రధాన పాఠ్యంలో న్యాయసంబంధ భావం ఎంచుకోబడింది; అయితే హీబ్రూలోని నిజమైన నైతిక ప్రత్యామ్నాయ అర్థాన్ని పాదటిప్పణిలో ఉంచి భావసందిగ్ధతను కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి ఉపయోగించబడింది. ‘దోషిగా తీర్పు పొందుతాను’ న్యాయసంబంధ భావాన్ని సాధారణ పాఠకునికి స్పష్టంగా అందిస్తుంది; ‘అలాంటప్పుడు’ సందర్భంలోని నిర్ధారణాత్మక సంబంధాన్ని సహజంగా చూపిస్తుంది.
