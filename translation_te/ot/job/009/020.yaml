review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the conditional force of אִם, the forensic sense of יַרְשִׁיעֵנִי, the integrity sense of תָּם, and the likely continued subject, ‘my mouth,’ for the final verb. ‘న్యాయవంతుడు’ can, however, suggest generalized moral righteousness rather than the contextual forensic sense ‘in the right.’
  naturalness: ‘దోషిగా తీర్పుతీరుస్తుంది’ is not natural modern Telugu collocation. ‘దోషిగా తీర్పు ఇస్తుంది’ is idiomatic. ‘వక్రమైనవాడిగా నిరూపిస్తుంది’ more naturally conveys the forensic/resultative sense than ‘వక్రుడిగా చూపుతుంది.’
  terminology: Use ‘న్యాయంగా సరైనవాడు’ for the disputed/forensic claim without implying sinless moral righteousness. Retain ‘నిందారహితుడు’ for תָּם and retain the crooked/perverse metaphor in ‘వక్రమైనవాడు.’
  issues:
  - severity: medium
    issue: ‘న్యాయవంతుడినైతే’ is semantically broader than the forensic claim in אֶצְדָּק.
    rationale: It may be read as ‘if I am righteous’ in a general moral sense. The immediate judicial context favors ‘if I am in the right.’
  - severity: low
    issue: ‘దోషిగా తీర్పుతీరుస్తుంది’ is unidiomatic.
    rationale: Modern Telugu normally says ‘దోషిగా తీర్పు ఇస్తుంది’ or ‘దోషిగా ప్రకటిస్తుంది.’
  - severity: low
    issue: ‘వక్రుడిగా చూపుతుంది’ somewhat weakens the resultative/forensic force of וַיַּעְקְשֵׁנִי.
    rationale: ‘నిరూపిస్తుంది’ better expresses that Job’s own words would establish him as crooked/perverse in the argument.
  revised_text: 'నేను న్యాయంగా సరైనవాడినైతే, నా నోరే నన్ను దోషిగా తీర్పు ఇస్తుంది;

