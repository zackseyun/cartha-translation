source:
  edition: WLC
  text: אִם אֶ֭צְדָּק פִּ֣/י יַרְשִׁיעֵ֑/נִי תָּֽם אָ֝֗נִי וַֽ/יַּעְקְשֵֽׁ/נִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/020.yaml
  text: If I am in the right[a], my own mouth would condemn me; though I am blameless, it would prove me crooked.
translation:
  language: te
  text: 'నేను న్యాయంగా సరైనవాడినైతే, నా నోరే నన్ను దోషిగా తీర్పు ఇస్తుంది;

    నేను నిందారహితుడినైనా, అదే నన్ను వక్రమైనవాడిగా నిరూపిస్తుంది.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, రెండో వాక్యభాగంలో దేవుడే సూచిత కర్తగా ఉన్నాడని తీసుకుంటే, “నేను నిందారహితుడినైనా, ఆయనే నన్ను వక్రమైనవాడిగా నిరూపిస్తాడు.”
    reason: రెండో క్రియకు కర్త హీబ్రూలో స్పష్టంగా లేదు. ‘నా నోరు’ అనే కర్త కొనసాగవచ్చు; లేదా దేవుడు సూచిత కర్తగా ఉండవచ్చు.
lexical_decisions:
- source_word: אִם
  choice: న్యాయవంతుడినైతే
  rationale: אִם ఇక్కడ షరతును సూచిస్తుంది. మొత్తం వాక్యంలో రాయితీ భావం ఉన్నప్పటికీ, మొదటి భాగాన్ని సహజమైన షరతుగా అనువదించడం హీబ్రూ నిర్మాణానికి సరిపోతుంది.
- source_word: אֶצְדָּק
  choice: నేను న్యాయవంతుడినైతే
  rationale: צדק యొక్క ఖల్ రూపం ఇక్కడ కారణార్థకమైన ‘నన్ను నేను సమర్థించుకుంటే’ అని కాక, న్యాయవిచారణ సందర్భంలో ‘న్యాయస్థితిలో ఉండడం’ అనే స్థిత్యర్థాన్ని ఇస్తుంది.
- source_word: פִּי
  choice: నా నోరే
  rationale: అక్షరార్థం ‘నా నోరు.’ ‘ఏ’ అనే ఉద్ఘాటన యోబు పలికే మాటలే అతనికి విరుద్ధంగా మారే వ్యంగ్యాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: יַרְשִׁיעֵנִי
  choice: నన్ను దోషిగా తీర్పుతీరుస్తుంది
  rationale: רשע యొక్క హిఫీల్ రూపం న్యాయవిచారణ సందర్భంలో ‘దోషిగా ప్రకటించడం/ఖండించడం’ అని అర్థం. ఈ ఎంపిక కేవలం నైతికంగా చెడ్డవాడిని చేయడం అనే భావాన్ని నివారిస్తుంది.
- source_word: תָּם
  choice: నిందారహితుడు
  rationale: యోబు గ్రంథంలో תם సాధారణంగా పాపరహిత పరిపూర్ణతకన్నా యథార్థత, నిందారాహిత్యాన్ని సూచిస్తుంది.
- source_word: וַיַּעְקְשֵׁנִי
  choice: అదే నన్ను వక్రుడిగా చూపుతుంది
  rationale: עקשׁ లోని ‘వక్రం/విపరీతం’ అనే రూపకాన్ని నిలిపి, ముందున్న ‘నా నోరు’నే కొనసాగుతున్న కర్తగా తీసుకున్నాం. ‘చూపుతుంది’ అనేది సందర్భంలోని న్యాయవిచారణాత్మక ఫలితాన్ని సహజంగా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: וַיַּעְקְשֵׁנִי అనే క్రియకు కర్త ఎవరు?
  choice: ముందటి భాగంలోని ‘నా నోరు’నే కొనసాగుతున్న కర్తగా తీసుకొని, ‘అదే నన్ను వక్రుడిగా చూపుతుంది’ అని అనువదించాం.
  alternative: దేవుడు సూచిత కర్తగా ఉండి, ‘ఆయనే నన్ను వక్రుడిగా చూపుతాడు’ అని చదవవచ్చు.
  rationale: రెండు వాక్యభాగాల సమాంతర నిర్మాణం ఒకే కర్త కొనసాగడాన్ని బలపరుస్తుంది. అయినప్పటికీ హీబ్రూలో రెండో క్రియకు కర్త స్పష్టంగా చెప్పబడలేదు; కాబట్టి దేవుడు సూచిత కర్త అనే పఠనాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన న్యాయవిచారణ శైలిని ఉపయోగించాం. ‘న్యాయవంతుడు,’ ‘దోషిగా తీర్పుతీర్చడం,’ ‘నిందారహితుడు’ అనే పదాలు వచనంలోని న్యాయస్థాన నేపథ్యాన్ని నిలుపుతాయి; ‘వక్రుడు’ మూలంలోని రూపకాన్ని కాపాడుతుంది.
