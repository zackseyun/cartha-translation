  to: 'నేను న్యాయంగా సరైనవాడినైతే, నా నోరే నన్ను దోషిగా తీర్పు ఇస్తుంది;

    నేను నిందారహితుడినైనా, అదే నన్ను వక్రమైనవాడిగా నిరూపిస్తుంది.[a]'
  rationale: The revision sharpens the judicial sense of Job’s assertion, corrects an unnatural Telugu judicial expression, and better conveys the final verb’s forensic/resultative force. The footnote retains the genuinely possible alternative implied subject without resolving the ambiguity doctrinally.
