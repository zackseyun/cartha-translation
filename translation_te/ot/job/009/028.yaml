  yaml_path: translation/ot/job/009/028.yaml
  text: I am afraid of all my pains[b][a]; I know that you will not acquit me.
translation:
  language: te
  text: నా బాధలన్నిటికీ నేను భయపడుతున్నాను[a]; నీవు నన్ను నిర్దోషిగా ప్రకటించవని నాకు తెలుసు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నా వేదనలన్నిటికీ నేను జంకుతున్నాను’ లేదా ‘నా కష్టాలన్నిటినీ చూసి నేను భయపడుతున్నాను.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘నీవు నన్ను నిర్దోషినని పరిగణించవు’ లేదా ‘నీవు నన్ను శిక్షించకుండా విడిచిపెట్టవు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: יָגֹרְתִּי
  choice: నేను భయపడుతున్నాను
  rationale: גור అనే క్రియ ఇక్కడ భయం లేదా జంకును వ్యక్తం చేస్తుంది. హీబ్రూ సంపూర్ణ రూపానికి సందర్భానుసారమైన స్థితి భావాన్ని సహజమైన వర్తమాన కాలంతో తెలిపాం.
- source_word: כָל
  choice: అన్నిటికీ
  rationale: సమగ్రతను సూచించే సాధారణ పరిమాణపదం; עַצְּבֹתָיతో కలిపి సహజమైన తెలుగు రూపంలో ఇచ్చాం.
- source_word: עַצְּבֹתָי
  choice: నా బాధలు
  rationale: ఈ పదం బాధలు, వేదనలు, దుఃఖాలు లేదా కష్టాలను సూచించగలదు. యోబు అనుభవిస్తున్న శారీరక-మానసిక వేదనను అతిగా పరిమితం చేయకుండా ‘బాధలు’ అని అనువదించాం.
- source_word: יָדַעְתִּי
  choice: నాకు తెలుసు
  rationale: ידע యొక్క సంపూర్ణ రూపం ఇక్కడ కొనసాగుతున్న జ్ఞానం లేదా నిశ్చయాన్ని సూచిస్తుంది; తెలుగులో సహజమైన స్థితి వాక్యంగా ఇచ్చాం.
- source_word: כִּי
  choice: అని
  rationale: యోబుకు తెలిసిన విషయాన్ని పరిచయం చేసే పూరక సంధిగా అనువదించాం.
- source_word: לֹא
  choice: -వని
  rationale: తెలుగు పరోక్ష వాక్య నిర్మాణంలో నిరాకరణను క్రియతో కలిపి తెలిపాం.
- source_word: תְנַקֵּנִי
  choice: నీవు నన్ను నిర్దోషిగా ప్రకటించవు
  rationale: נקה యొక్క పియేల్ రూపానికి తీర్పు సందర్భంలో ‘నిర్దోషిగా ప్రకటించడం’ అనే న్యాయపరమైన భావం ఉంది. దేవునితో యోబు చేస్తున్న న్యాయవాదనలోని ఉద్రిక్తతను ఇది నిలుపుతుంది.
theological_decisions:
- issue: దేవుడు యోబును నిర్దోషిగా ప్రకటించడనే న్యాయపరమైన భావం
  choice: నీవు నన్ను నిర్దోషిగా ప్రకటించవు
  alternative: నీవు నన్ను శిక్షించకుండా విడిచిపెట్టవు
  rationale: ప్రధాన అనువాదం న్యాయస్థాన సంబంధమైన భావాన్ని స్పష్టంగా నిలుపుతుంది; ప్రత్యామ్నాయం శిక్ష నుంచి విడుదల చేయడమనే సాధ్యమైన భావాన్ని చూపుతుంది. యోబు మాటను తరువాతి సిద్ధాంత వర్గాలతో పరిష్కరించకుండా దాని ఉద్రిక్తతను అలాగే ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే యోబు న్యాయవాదనకు తగిన గంభీరతతో రూపొందించాం. ‘నిర్దోషిగా ప్రకటించు’ అనే పదబంధం మూలంలోని న్యాయపరమైన భావాన్ని స్పష్టంగా ఉంచుతుంది.
