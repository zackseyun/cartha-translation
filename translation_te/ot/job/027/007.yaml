review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the jussive wish in יְהִי, the two comparisons marked by כְ, the first-person suffixes in “my enemy” and “against me,” and the moral distinction between רָשָׁע and עַוָּל. Repeating “ఉండుగాక” is a legitimate Telugu way to make the parallel clauses explicit.
  naturalness: “నాకు ఎదిరి నిలిచేవాడు” is understandable, but “నాకు వ్యతిరేకంగా లేచేవాడు” is more idiomatic modern standard Telugu and more closely reflects the hostile rising-up imagery of מִתְקוֹמְמִי.
  terminology: “దుష్టుడు” and “అన్యాయస్థుడు” suitably retain the distinct moral terms without importing a doctrinal interpretation. The elevated jussive “ఉండుగాక” fits Job’s poetic register.
  issues:
  - severity: low
    issue: The rendering of מִתְקוֹמְמִי is slightly less idiomatic and less image-specific.
    rationale: “ఎదిరి నిలిచేవాడు” can mean one who stands in opposition, but the Hebrew participle from קום evokes one who rises up against the speaker. “నాకు వ్యతిరేకంగా లేచేవాడు” expresses this naturally and directly.
  revised_text: నా శత్రువు దుష్టునిలా ఉండుగాక; నాకు వ్యతిరేకంగా లేచేవాడు అన్యాయస్థునిలా ఉండుగాక.
