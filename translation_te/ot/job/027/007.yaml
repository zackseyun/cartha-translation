source:
  edition: WLC
  text: יְהִ֣י כְ֭/רָשָׁע אֹ֣יְבִ֑/י וּ/מִתְקוֹמְמִ֥/י כְ/עַוָּֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/job/027/007.yaml
  text: May my enemy be like the wicked[a], and the one who rises against me like the unrighteous.
translation:
  language: te
  text: నా శత్రువు దుష్టునిలా ఉండుగాక; నాకు వ్యతిరేకంగా లేచేవాడు అన్యాయస్థునిలా ఉండుగాక.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהִי
  choice: ఉండుగాక
  rationale: היה ధాతువు యొక్క జస్సివ్ రూపం కోరికను లేదా శాపార్థక ఆకాంక్షను వ్యక్తం చేస్తుంది. ‘ఉండుగాక’ ఆ భావాన్ని గంభీరమైన, సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: כְרָשָׁע
  choice: దుష్టునిలా
  rationale: כְ పోలికను సూచిస్తుంది; רָשָׁע దుష్టుడైన వ్యక్తిని సూచిస్తుంది. ఏకవచన హీబ్రూ రూపాన్ని, నైతిక వర్గాన్ని రెండింటినీ ఈ పదబంధం స్పష్టంగా ఉంచుతుంది.
- source_word: אֹיְבִי
  choice: నా శత్రువు
  rationale: 1వ పురుష ఏకవచన ప్రత్యయంతో ఉన్న אויב పదానికి ఇది నేరమైన, సహజమైన తెలుగు అనువాదం.
- source_word: וּמִתְקוֹמְמִי
  choice: నాకు ఎదిరి నిలిచేవాడు
  rationale: קום నుండి వచ్చిన ఈ కృదంత రూపం వక్తకు వ్యతిరేకంగా తనను తాను నిలబెట్టుకునే వ్యక్తిని సూచిస్తుంది. కేవలం ‘విరోధి’ అని కుదించకుండా మూలంలోని క్రియాత్మక దృశ్యాన్ని నిలుపుతుంది.
- source_word: כְעַוָּל
  choice: అన్యాయస్థునిలా
  rationale: עַוָּל అన్యాయం లేదా దుర్నీతితో లక్షణీకరించబడిన వ్యక్తిని సూచిస్తుంది. ‘అన్యాయస్థుడు’ నైతిక భావాన్ని కాపాడుతూ ‘దుష్టుడు’తో సమాంతరంగా నిలుస్తుంది.
theological_decisions:
- issue: వాక్యం కోరికా, శాపార్థక ఆకాంక్షా అనే భావఛాయ
  choice: ‘ఉండుగాక’ ద్వారా రెండింటికీ వీలున్న జస్సివ్ భావాన్ని నిలుపడం
  alternative: దీనిని ఖచ్చితమైన శాపంగా లేదా భవిష్యద్వాణిగా అనువదించడం
  rationale: మూలంలోని יְהִי ఆకాంక్షాత్మక బలాన్ని కలిగి ఉన్నా, దాని వాక్చాతుర్యాన్ని మరీ సంకుచితం చేయకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయినా కవితాత్మక గాంభీర్యాన్ని కాపాడే శైలి. సమాంతర హీబ్రూ నిర్మాణం రెండు ‘ఉండుగాక’ రూపాలతో స్పష్టంగా ప్రతిఫలించింది.
