  yaml_path: translation/ot/job/027/018.yaml
  text: He builds his house like a moth[a], like a shelter that a watchman makes.
translation:
  language: te
  text: అతడు తన ఇంటిని చిమ్మటలా కడతాడు, కాపలాదారు చేసే పాకలా[a] కడతాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘కాపలాదారు చేసే గుడిసెలా.’ హెబ్రీ పదాలు పొలంలో తాత్కాలికంగా వేసే ఆశ్రయాన్ని, దానిని కాచే వ్యక్తిని మరింత ప్రత్యేకంగా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּנָה
  choice: కట్టుకుంటాడు
  rationale: ఇది Qal perfect రూపమైనా, కవితా సందర్భంలో దుష్టుని సాధారణ చర్యను వర్ణిస్తోంది; అందువల్ల తెలుగులో వర్తమాన సాధారణార్థం సహజంగా ఉంటుంది.
- source_word: כָעָשׁ
  choice: చిమ్మట గూడులా
  rationale: עָשׁ సాధారణంగా ‘చిమ్మట’ను సూచిస్తుంది. పోలికలో ఉద్దేశించిన బలహీనమైన, సులభంగా నశించే నివాస భావం తెలుగులో స్పష్టమయ్యేందుకు ‘గూడు’ను సందర్భానుసారంగా చేర్చాం; ప్రత్యామ్నాయ అర్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: בֵּיתוֹ
  choice: తన ఇంటిని
  rationale: తాత్కాలిక పాకతో ఉన్న సమాంతర నిర్మాణం కారణంగా בַּיִת ఇక్కడ కుటుంబం కంటే భౌతికమైన ‘ఇల్లు’ను సూచిస్తుంది.
- source_word: וּכְסֻכָּה
  choice: పాకలా
  rationale: סֻכָּה అనేది పొలంలో లేదా ద్రాక్షతోటలో వేసుకునే తాత్కాలిక ఆశ్రయం. ఆధునిక తెలుగులో ‘పాక’ ఆ తాత్కాలిక, బలహీన నిర్మాణ భావాన్ని సంక్షిప్తంగా అందిస్తుంది.
- source_word: עָשָׂה
  choice: కట్టుకునే
  rationale: కాపలాదారు తన ఉపయోగం కోసం తాత్కాలిక ఆశ్రయాన్ని తయారుచేసే భావాన్ని సహజమైన తెలుగు సంబంధక్రియతో వ్యక్తం చేశాం.
- source_word: נֹצֵר
  choice: కాపలాదారు
  rationale: נצר ధాతువు నుంచి వచ్చిన ఈ కర్తృవాచక రూపం కాపాడే లేదా కనిపెట్టే వ్యక్తిని సూచిస్తుంది; వ్యవసాయ నేపథ్యానికి ‘కాపలాదారు’ సరిపోతుంది.
