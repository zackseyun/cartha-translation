translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, కవితాత్మక పోలికను నిలుపుతూ సాధారణ పాఠకుడికి వెంటనే అర్థమయ్యే పదాలను వాడాం. ‘పాక’ గ్రామీణ కాపలా సందర్భంలోని తాత్కాలిక ఆశ్రయాన్ని సహజంగా తెలియజేస్తుంది.
