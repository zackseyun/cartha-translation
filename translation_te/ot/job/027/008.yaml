source:
  edition: WLC
  text: כִּ֤י מַה תִּקְוַ֣ת חָ֭נֵף כִּ֣י יִבְצָ֑ע כִּ֤י יֵ֖שֶׁל אֱל֣וֹהַּ נַפְשֽׁ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/027/008.yaml
  text: For what is the hope of the godless when God cuts him off[c][b][a], when God takes away his life?
translation:
  language: te
  text: భక్తిహీనునికి[a] ఏమి ఆశ ఉంటుంది, అతడు లాభం పొందినప్పటికీ[b], దేవుడు అతని ప్రాణాన్ని తీసివేసినప్పుడు[c]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘కపటికి.’ హీబ్రూ పదం దైవభక్తిలేనివాడు, దుర్మార్గుడు, లేదా కపటి అనే భావాలను సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: ఈ ఉపవాక్యం క్లిష్టమైనది. లేదా, ‘అతడు లాభం పొందినప్పుడు’ అని; కొందరు ‘అతడు తెగగొట్టబడినప్పుడు’ అని కూడా అర్థం చేసుకుంటారు.
    reason: alternative_reading
  - marker: c
    text: అక్షరార్థంగా, ‘దేవుడు అతని ప్రాణాన్ని బయటకు లాగినప్పుడు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּקְוַת
  choice: ఆశ
  rationale: ఆశించేది లేదా ఎదురుచూసేది అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: חָנֵף
  choice: భక్తిహీనుడు
  rationale: యోబు గ్రంథంలో ఈ పదం కేవలం కపటత్వాన్ని కాక దేవునిపట్ల భయభక్తులు లేని వ్యక్తిని విస్తృతంగా సూచించగలదు.
- source_word: יִבְצָע
  choice: అతడు సంపాదించుకున్నా
  rationale: בצע ధాతువు సాధారణంగా లాభం పొందడం లేదా సంపాదించడం అనే భావం ఇస్తుంది. ఈ క్లిష్టమైన సంక్షిప్త వాక్యంలో concessive భావం సందర్భానికి సరిపోతుంది; అనిశ్చితిని పాదసూచికలో నిలిపాము.
- source_word: יֵשֶׁל
  choice: తీసివేసినప్పుడు
  rationale: ప్రాణాన్ని బయటకు లాగడం లేదా తొలగించడం అనే హీబ్రూ రూపకాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: אֱלוֹהַּ
  choice: దేవుడు
  rationale: యోబులో దేవునికి వాడిన ఏకవచన కావ్యపదానికి నేరమైన తెలుగు సమానార్థకం.
- source_word: נַפְשׁוֹ
  choice: అతని ప్రాణాన్ని
  rationale: ఇక్కడ נֶפֶשׁ వ్యక్తి జీవాన్ని సూచిస్తుంది; సాంకేతిక ఆత్మతత్వ భావాన్ని అనవసరంగా దిగుమతి చేయకుండా 'ప్రాణం' సందర్భానికి సరిపోతుంది.
theological_decisions:
- issue: נֶפֶשׁ యొక్క మానవశాస్త్రీయ భావం
  choice: '''అతని ప్రాణాన్ని'' అని అనువదించడం'
  alternative: '''అతని ఆత్మను'''
  rationale: వాక్యం మరణ సమయంలో దేవుడు వ్యక్తి జీవాన్ని తీసివేయడం గురించి చెబుతోంది; ఆత్మ యొక్క తాత్త్విక స్వరూపంపై ప్రత్యేక సిద్ధాంత ప్రకటన చేయడం లేదు.
- issue: יִבְצָע అనే క్లిష్ట క్రియ యొక్క భావం
  choice: '''అతడు సంపాదించుకున్నా'' అనే concessive పఠనం'
  alternative: '''అతడు తెగగొట్టబడినప్పుడు'' లేదా ''అతని లాభం అంతమైనప్పుడు'''
  rationale: మసొరా పాఠంలోని క్రియ సాధారణంగా లాభం/సంపాదనతో సంబంధించింది; అయితే వాక్యనిర్మాణం క్లిష్టమైనందున ప్రత్యామ్నాయాన్ని పాదసూచికలో స్పష్టంగా ఉంచాము.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన ప్రశ్నారూపాన్ని వాడాము. మూలంలోని రెండు כִּי ఉపవాక్యాల వాక్చాతుర్యాన్ని తెలుగులో పునరుక్త ప్రశ్న ద్వారా స్పష్టంచేశాము. క్లిష్టమైన יִבְצָע పాఠాన్ని ప్రధాన వాక్యంలో ఒక సాధ్యమైన భావంతో ఇచ్చి, అసలైన అనిశ్చితిని పాదసూచికలో భద్రపరిచాము.
