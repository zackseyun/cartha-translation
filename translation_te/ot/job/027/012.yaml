translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని ఉపయోగించాం. హెబ్రీలో లేని కర్మను ‘చూశారు’ తరువాత చేర్చలేదు; మూలంలోని పదప్రయోగం మరియు క్రియకు ఉన్న భావసందిగ్ధతను పాదసూచికలో వివరించాం.
