  yaml_path: translation/ot/job/027/012.yaml
  text: Look[a], all of you have seen it; why then do you become vain?
translation:
  language: te
  text: ఇదిగో, మీరందరూ చూశారు; మరి ఎందుకు ఇలా వ్యర్థంగా ప్రవర్తిస్తున్నారు?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఎందుకు ఇలా వ్యర్థులుగా మారుతున్నారు?’ హెబ్రీలో ‘వ్యర్థత, శూన్యత, నిష్ఫలత’ అనే అర్థాలుగల הבל మూలం నుండి వచ్చిన నామవాచకమూ క్రియయూ పక్కపక్కనే ఉండి బలమైన పదప్రయోగాన్ని ఏర్పరుస్తాయి. దానిని తెలుగులో పూర్తిగా పునరుత్పత్తి చేయడం కష్టం.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: ఇదిగో
  rationale: శ్రద్ధను ఆకర్షిస్తూ, తరువాతి మాటను నొక్కిచెప్పే అవ్యయం. ఆధునిక గౌరవప్రదమైన తెలుగులో ‘ఇదిగో’ దాని బలాన్ని సహజంగా అందిస్తుంది.
- source_word: אַתֶּם כֻּלְּכֶם
  choice: మీరందరూ
  rationale: స్పష్టమైన బహువచన సర్వనామంతో పాటు ‘అందరూ’ అనే సమగ్ర భావాన్ని సంక్షిప్తంగా, సహజంగా నిలుపుతుంది.
- source_word: חֲזִיתֶם
  choice: చూశారు
  rationale: חזה ఇక్కడ ప్రత్యక్షంగా చూడడం లేదా గ్రహించడం అనే భావాన్ని ఇస్తుంది. హెబ్రీలో కర్మ స్పష్టంగా లేకపోవడంతో తెలుగులోనూ దానిని చేర్చలేదు.
- source_word: וְלָמָּה זֶּה
  choice: మరి ఎందుకు ఇలా
  rationale: וְ వాదనలో తదుపరి ప్రశ్నకు దారితీస్తుంది; זֶּה ఇక్కడ ‘ఇలా’ అనే తీవ్రత/రీతి భావాన్ని సహజంగా సూచిస్తుంది. ‘మరి ఎందుకు ఇలా’ ముందున్న పరిశీలన ఆధారంగా వచ్చే మందలింపును వ్యక్తం చేస్తుంది.
- source_word: הֶבֶל תֶּהְבָּלוּ
  choice: వ్యర్థంగా ప్రవర్తిస్తున్నారు
  rationale: నామవాచకం הֶבֶל మరియు దానితో ఒకే మూలం గల క్రియ תֶּהְבָּלוּ వ్యర్థత, శూన్యత, నిష్ఫలత అనే భావాలతో పదప్రయోగాన్ని ఏర్పరుస్తాయి. ‘ప్రవర్తిస్తున్నారు’ సందర్భోచితమైన తెలుగును ఇస్తుంది; అయితే హెబ్రీలో ప్రవర్తించడం లేదా వ్యర్థులుగా మారడం అనే భావసందిగ్ధత ఉన్నందున దానిని పాదసూచికలో నిలిపాం.
