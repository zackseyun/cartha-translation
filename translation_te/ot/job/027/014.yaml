revisions:
- from: అతని కుమారులు ఎక్కువమంది అయితే[a], వారు ఖడ్గం పాలవుతారు; అతని సంతతివారు రొట్టెతో తృప్తి చెందరు[b].
  to: అతని కుమారులు సంఖ్యలో పెరిగితే[a], వారు ఖడ్గానికి గురవుతారు; అతని సంతానం రొట్టెతో తృప్తి చెందదు[b].
  rationale: The revision restores the increase/multiplication sense of the Hebrew verb while retaining the conditional ambiguity in footnote a. It also uses natural contemporary Telugu for death by the sword and for the broader collective sense of ‘descendants.’ No doctrinal or causal agency has been added.
  reviewer_model: gpt-5.6-terra
