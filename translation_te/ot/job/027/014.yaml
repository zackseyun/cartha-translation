review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the conditional force of אִם, the masculine ‘sons,’ the broader sense of צֶאֱצָאָיו, and the idiom ‘not be satisfied with bread.’ However, ‘ఎక్కువమంది అయితే’ describes a static condition (‘if they are many’) rather than the verbal sense of יִרְבּוּ, ‘if they multiply/increase.’
  naturalness: ‘ఖడ్గం పాలవుతారు’ is understandable, but ‘ఖడ్గానికి గురవుతారు’ is more direct modern standard Telugu in this judgment context. ‘సంతతివారు’ is intelligible but somewhat less natural than the collective ‘సంతానం.’
  terminology: ‘కుమారులు,’ ‘ఖడ్గం,’ and ‘రొట్టె’ are suitable. The collective noun ‘సంతానం’ naturally conveys the broader progeny/descendants sense without implying only the immediate sons.
  issues:
  - severity: medium
    issue: יִרְבּוּ is rendered as a static state.
    rationale: ‘అతని కుమారులు ఎక్కువమంది అయితే’ means ‘if his sons are numerous.’ The Hebrew verb רבה denotes becoming numerous/increasing. ‘సంఖ్యలో పెరిగితే’ retains that verbal aspect.
  - severity: low
    issue: The rendering of the sword clause can be more idiomatic in modern standard Telugu.
    rationale: ‘ఖడ్గానికి గురవుతారు’ clearly communicates the source sense that the sons are destined for or fall victim to the sword, without adding a specific agent or theological interpretation.
  revised_text: అతని కుమారులు సంఖ్యలో పెరిగితే[a], వారు ఖడ్గానికి గురవుతారు; అతని సంతానం రొట్టెతో తృప్తి చెందదు[b].
  revised_footnotes:
