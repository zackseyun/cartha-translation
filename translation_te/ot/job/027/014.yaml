id: JOB.27.14
reference: Job 27:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אִם יִרְבּ֣וּ בָנָ֣י/ו לְמוֹ חָ֑רֶב וְ֝/צֶאֱצָאָ֗י/ו לֹ֣א יִשְׂבְּעוּ לָֽחֶם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/027/014.yaml
  text: If his sons multiply[a], it is for the sword, and his descendants will not be satisfied with bread.
translation:
  language: te
  text: అతని కుమారులు సంఖ్యలో పెరిగితే[a], వారు ఖడ్గానికి గురవుతారు; అతని సంతానం రొట్టెతో తృప్తి చెందదు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “అతని కుమారులు సంఖ్యలో పెరిగినా.” ఇక్కడి హీబ్రూ పదం షరతును (“అయితే”) లేదా concessive భావాన్ని (“అయినా”) సూచించగలదు.'
    reason: source_ambiguity
  - marker: b
    text: 'అక్షరార్థంగా: “రొట్టెతో నిండరు/తృప్తి చెందరు”; అంటే వారికి తినడానికి సరిపడా ఆహారం ఉండదు.'
    reason: idiom_clarification
lexical_decisions:
- source_word: אִם
  choice: అయితే
  rationale: షరతును సూచించే హీబ్రూ అవ్యయానికి సహజమైన తెలుగు రూపం; వాక్యంలోని షరతు–ఫలితం నిర్మాణాన్ని నిలుపుతుంది.
- source_word: יִרְבּוּ בָנָיו
  choice: అతని కుమారులు ఎక్కువమంది అయితే
  rationale: רבה సంఖ్య పెరగడాన్ని సూచిస్తుంది; בָנָיו స్పష్టంగా ‘అతని కుమారులు’ అని ఉంది. తెలుగు వాడుకలో సహజంగా ఉండేలా ‘ఎక్కువమంది’ అని అనువదించాం.
- source_word: לְמוֹ חָרֶב
  choice: వారు ఖడ్గం పాలవుతారు
  rationale: అక్షరార్థంగా ‘వారికి ఖడ్గం’ అనే సంక్షిప్త హీబ్రూ ప్రయోగం వారి గమ్యం ఖడ్గమని సూచిస్తుంది. ‘ఖడ్గం పాలవుతారు’ అనే తెలుగు నుడికారం హింసాత్మక మరణ భావాన్ని వివరణాత్మకంగా విస్తరించకుండా తెలియజేస్తుంది.
- source_word: וְצֶאֱצָאָיו
  choice: అతని సంతతివారు
  rationale: ఈ పదం తక్షణ కుమారులను మించి విస్తృతమైన సంతానాన్ని సూచిస్తుంది; ‘సంతతివారు’ ఆ పరిధిని నిలుపుతుంది.
- source_word: לֹא יִשְׂבְּעוּ לָחֶם
  choice: రొట్టెతో తృప్తి చెందరు
  rationale: שׂבע అంటే నిండుట లేదా తృప్తి చెందుట; לֶחֶם అక్షరార్థంగా రొట్టె. మూలంలోని స్పష్టమైన రూపకాన్ని నిలుపుతూ ఆహారం చాలకపోవడమనే భావాన్ని పాదసూచికలో వివరించాం.
theological_decisions:
- issue: కుమారులు ఖడ్గానికి సంబంధించినవారనే సంక్షిప్త తీర్పు భాష
  choice: వారు ఖడ్గం పాలవుతారు
  alternative: వారు ఖడ్గానికే నియమించబడ్డారు
  rationale: ‘నియమించబడ్డారు’ అనడం దైవ నిర్ణయం లేదా ముందస్తు నియామకం అనే భావాన్ని మూలం కంటే స్పష్టంగా చేర్చవచ్చు. ఎవరిని కార్యనిర్వాహకుడిగా పేర్కొనకుండా మూలంలోని దుర్గతిని మాత్రమే తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన శైలిని ఉపయోగించాం. ‘ఖడ్గం పాలవుతారు’ సహజమైన తెలుగు నుడికారం; ‘రొట్టెతో తృప్తి చెందరు’ మూలంలోని దృశ్యరూపాన్ని నిలుపుతుంది.
