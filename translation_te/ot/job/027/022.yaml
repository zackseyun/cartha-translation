source:
  edition: WLC
  text: וְ/יַשְׁלֵ֣ךְ עָ֭לָי/ו וְ/לֹ֣א יַחְמֹ֑ל מִ֝/יָּד֗/וֹ בָּר֥וֹחַ יִבְרָֽח׃
base_translation:
  language: en
  yaml_path: translation/ot/job/027/022.yaml
  text: He hurls at him and does not spare[b][a]; he surely flees from his hand.
translation:
  language: te
  text: అతనిమీదికి విసురుతాడు[a], ఏమాత్రం కనికరించడు; అతడు అతని చేతిలోనుండి తప్పక పారిపోతాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో కర్త స్పష్టంగా చెప్పబడలేదు. సందర్భాన్ని బట్టి అది దేవుణ్ణి సూచించవచ్చు; లేదా ముందరి వచనంలోని తూర్పుగాలి/తుపాను చిత్రణను కొనసాగించవచ్చు. ‘విసురుతాడు’ అనే క్రియకు ‘త్రోయడం, పడవేయడం’ అనే అర్థం ఉంది; ఇక్కడ దాడి స్వరాన్ని కలిగిస్తుంది.
    reason: subject_and_lexical_ambiguity
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా ‘పారిపోతూ పారిపోతాడు’; infinitive absoluteతో కూడిన క్రియారూపం పారిపోవడాన్ని బలంగా నొక్కిచెబుతుంది.
    reason: grammatical_emphasis
lexical_decisions:
- source_word: וְיַשְׁלֵךְ עָלָיו
  choice: ఆయన అతని మీదికి విసిరివేస్తాడు
  rationale: שׁלךְ అనే క్రియకు ‘విసురు/పడవేయు’ అనే అర్థం ఉంది; עָלָיו దాడి దిశను ‘అతని మీదికి’ అని తెలియజేస్తుంది. హీబ్రూలో లేని ఆత్మార్థక ‘తనను తాను’ అనే భావాన్ని ప్రధాన పాఠ్యంలో చేర్చలేదు.
- source_word: וְלֹא יַחְמֹל
  choice: ఏమాత్రం కనికరించడు
  rationale: חמלలో ‘కనికరించు’ మరియు ‘విడిచిపెట్టు’ అనే భావాలు ఉన్నాయి. తీర్పు సందర్భంలో ‘ఏమాత్రం కనికరించడు’ కరుణలేమిని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: מִיָדוֹ
  choice: ఆయన చేతిలోనుంచి
  rationale: יָד యొక్క ప్రత్యక్ష రూపకం ‘చెయ్యి’; అది అధికారం లేదా పట్టును కూడా సూచించగలదు. తెలుగు పాఠ్యంలో చేతి రూపకాన్ని నిలిపి ఉంచాం.
- source_word: בָּרוֹחַ יִבְרָח
  choice: తప్పక పారిపోతాడు
  rationale: అదే ధాతువుతో వచ్చిన infinitive absolute మరియు finite verb క్రియను బలపరుస్తాయి. తెలుగులో సహజంగా ఆ బలాన్ని ‘తప్పక’ ద్వారా వ్యక్తం చేశాం; వేగం లేదా దిశను అదనంగా చేర్చలేదు.
theological_decisions:
- issue: దాడిచేసే కర్త ఎవరు?
  choice: ‘ఆయన’—దేవుణ్ణి సూచించే సాధ్యమైన పఠనం
  alternative: మునుపటి వచనంలోని తూర్పుగాలి లేదా తుపాను కర్త కావచ్చు
  rationale: హీబ్రూ క్రియలో కర్త కేవలం మూడవ పురుష ఏకవచనంగా అంతర్లీనంగా ఉంది. సమీప సందర్భం దేవుని తీర్పును ప్రకృతి శక్తుల ద్వారా చిత్రించగలదు; అందువల్ల ప్రధాన పాఠ్యం ‘ఆయన’ను వాడినా, ప్రత్యామ్నాయ సందర్భపఠనాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సులభంగా అర్థమయ్యే శైలిని ఉపయోగించాం. మూలంలోని ‘చెయ్యి’ రూపకాన్ని నిలిపాం; హీబ్రూలో లేని ‘తనను తాను’ అనే ఆత్మార్థక భావాన్ని చేర్చలేదు. ప్రధాన పాఠ్యంలోని ప్రతి పాదసూచిక గుర్తు సంబంధిత పదబంధం వెంట ఉంచబడింది.
