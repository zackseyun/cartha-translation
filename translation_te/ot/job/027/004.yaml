translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కవితా శైలిని ఉపయోగించాం. ‘నా పెదవులు—నా నాలుక’ అనే హీబ్రూ సమాంతరతను నిలిపి, ప్రమాణసదృశ వాక్యనిర్మాణంలోని బలమైన నిరాకరణను ప్రధాన పాఠ్యంలో సహజ తెలుగు నిరాకరణగా వ్యక్తం చేశాం.
