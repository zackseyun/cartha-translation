translation:
  language: te
  text: నా పెదవులు అన్యాయం పలకవు[a]; నా నాలుక మోసాన్ని పలకదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో బలమైన నిరాకరణను తెలిపే ప్రమాణసదృశమైన ‘ఒకవేళ’ (אִם) నిర్మాణం ఉంది. అక్షరార్థంగా, ‘నా పెదవులు అన్యాయం పలికితే…’; భావం, ‘నా పెదవులు ఎంతమాత్రమూ అన్యాయం పలకవు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: పలకవు / ఉచ్చరించదు
  rationale: ఈ ప్రమాణసదృశ నిర్మాణంలో אִם సాధారణ షరతును కాక బలమైన నిరాకరణను వ్యక్తం చేస్తుంది. అందువల్ల తెలుగులో సహజమైన స్పష్ట నిరాకరణగా అనువదించాం.
- source_word: תְּדַבֵּרְנָה
  choice: పలకవు
  rationale: דבר పియేల్ రూపం ‘మాట్లాడు/పలుకు’ అనే అర్థం ఇస్తుంది; సందర్భంలోని దృఢసంకల్ప భావాన్ని భవిష్యత్ నిరాకరణగా చూపించాం.
- source_word: שְׂפָתַי
  choice: నా పెదవులు
  rationale: మాటను సూచించే శరీరాంగ రూపకాన్ని, రెండవ భాగంలోని ‘నా నాలుక’తో ఉన్న సమాంతరతను నిలిపాం.
- source_word: עַוְלָה
  choice: అన్యాయం
  rationale: ఈ పదంలోని నైతిక తప్పు, అధర్మం అనే బలాన్ని ‘అన్యాయం’ స్పష్టంగా అందిస్తుంది; తరువాతి ‘మోసం’తో అర్థపునరుక్తిని నివారిస్తుంది.
- source_word: וּלְשׁוֹנִי
  choice: నా నాలుక
  rationale: మొదటి భాగపు నిరాకరణ రెండవ భాగానికీ వర్తిస్తుంది. ‘నాలుక’ను యథాతథంగా ఉంచి కవితా సమాంతరతను కాపాడాం.
- source_word: יֶהְגֶּה
  choice: ఉచ్చరించదు
  rationale: నాలుక కర్తగా, మోసం కర్మగా ఉన్నందున הגה ఇక్కడ పలకడం లేదా ఉచ్చరించడం అనే భావంలో ఉంది.
- source_word: רְמִיָּה
  choice: మోసం
  rationale: רְמִיָּה లోని వంచన, కపట భావాన్ని ఆధునిక సాధారణ తెలుగులో ‘మోసం’ సహజంగా వ్యక్తం చేస్తుంది.
