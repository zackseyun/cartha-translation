  text: The east wind carries him away[a], and he is gone; it sweeps him away from his place.
translation:
  language: te
  text: తూర్పుగాలి అతన్ని ఎత్తుకుపోతుంది, అతడు వెళ్లిపోతాడు; అది అతన్ని అతని స్థలం నుండి తుఫానులా ఊడ్చివేస్తుంది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִשָּׂאֵהוּ
  choice: అతన్ని ఎత్తుకుపోతుంది
  rationale: נשׂא అనే క్రియకు ‘ఎత్తు, మోసుకుపో’ అనే భావాలున్నాయి. గాలి సందర్భంలో ‘ఎత్తుకుపోతుంది’ బలవంతంగా తొలగించబడే దృశ్యాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: קָדִים
  choice: తూర్పుగాలి
  rationale: קָדִים సాధారణంగా తూర్పు నుండి వీచే, తరచుగా వినాశకరమైన గాలిని సూచిస్తుంది; ‘తూర్పుగాలి’ ఆ వాతావరణ సంబంధమైన కర్తను స్పష్టంగా తెలుపుతుంది.
- source_word: וְיֵלַךְ
  choice: అతడు వెళ్లిపోతాడు
  rationale: הלך యొక్క ప్రాథమిక అర్థం ‘వెళ్లు.’ ముందున్న గాలి ఎత్తుకుపోవడాన్ని అనుసరించే ఫలితాన్ని తెలుపుతూ, హీబ్రూ క్రియారూపానికి దగ్గరగా ఉంటుంది.
- source_word: וִישָׂעֲרֵהוּ
  choice: అది అతన్ని తుఫానులా ఊడ్చివేస్తుంది
  rationale: סער తుఫాను, ఉద్ధృతంగా చెలరేగడం లేదా సుడిగాలిలా తీసుకుపోవడం అనే భావాన్ని కలిగిస్తుంది. ‘తుఫానులా ఊడ్చివేస్తుంది’ హింసాత్మక తొలగింపును సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: מִמְּקֹמוֹ
  choice: తన స్థలం నుండి
  rationale: מקום అంటే ‘స్థలం.’ సందర్భంలో సర్వనామం అదే వ్యక్తిని సూచిస్తున్నందున ‘తన స్థలం నుండి’ సహజంగాను సంక్షిప్తంగాను ఉంది.
theological_decisions: []
