review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the Hebrew concessive reading of אִם, the accumulation verb יִצְבֹּר, and the parallel images of silver like dust and clothing like clay. However, the Telugu wording places the comparison after the object and uses ‘సిద్ధం చేయు’ with ‘బట్టలు,’ which can sound as though the clothes are being prepared out of clay rather than amassed in clay-like abundance.
  naturalness: ‘బట్టలను మట్టిలా సిద్ధం చేసినా’ is grammatically possible but stylistically awkward in modern Telugu. Moving ‘మట్టిలా’ before the object and using ‘సమకూర్చినా’ gives a natural, poetic parallel without adding interpretation.
  terminology: ‘వెండి,’ ‘దుమ్ము,’ ‘మట్టి,’ and ‘వస్త్రాలు’ are appropriate modern-standard Telugu choices. ‘వస్త్రాలు’ is slightly more fitting than colloquial ‘బట్టలు’ in Job’s elevated poetic register while remaining clear.
  issues:
  - severity: low
    issue: Awkward word order and collocation in the second poetic line
    rationale: In ‘బట్టలను మట్టిలా సిద్ధం చేసినా,’ ‘మట్టిలా’ may be momentarily read as describing the material or manner of preparing the clothes. ‘మట్టిలా వస్త్రాలను సమకూర్చినా’ clearly preserves the intended comparison of abundance and is more idiomatic.
  revised_text: అతడు వెండిని దుమ్ములా పోగుచేసినా, మట్టిలా వస్త్రాలను సమకూర్చినా,[a][b]
