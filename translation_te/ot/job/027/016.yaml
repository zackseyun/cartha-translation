  text: אִם יִצְבֹּ֣ר כֶּ/עָפָ֣ר כָּ֑סֶף וְ֝/כַ/חֹ֗מֶר יָכִ֥ין מַלְבּֽוּשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/027/016.yaml
  text: Though he heaps up silver like dust and prepares clothing like clay[b][a],
translation:
  language: te
  text: అతడు వెండిని దుమ్ములా పోగుచేసినా, మట్టిలా వస్త్రాలను సమకూర్చినా,[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతడు వెండిని దుమ్ములా పోగుచేసి, మట్టిలా వస్త్రాలను సమకూర్చితే.” హెబ్రీలోని אִם అనే పదానికి “చేస్తే” అనే షరతార్థక భావమూ, “చేసినా” అనే అనుమతార్థక భావమూ ఉండవచ్చు; చుట్టుపక్కల వాదప్రవాహానికి అనుమతార్థక భావం బాగా సరిపోతుంది.
    reason: alternative_reading
  - marker: b
    text: “వస్త్రాలను” అనే మాటకు “బట్టలను” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: చేసినా
  rationale: ఇక్కడ אִם ను సాధారణ షరతుగా కాక, తరువాతి వచనంలోని వ్యతిరేక ఫలితానికి దారితీసే అనుమతార్థక భావంగా తీసుకున్నాం. తెలుగులో క్రియకు జోడించిన ‘-ఇనా’ ఆ ‘అయినప్పటికీ’ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: יִצְבֹּר
  choice: పోగుచేసినా
  rationale: צבר అంటే కూడబెట్టడం లేదా కుప్పగా పోగుచేయడం. ‘పోగుచేయు’ అనే పదం దుమ్ము ఉపమానంలోని కుప్పచేసే దృశ్యాన్ని నిలుపుతుంది.
- source_word: כֶּעָפָר
  choice: దుమ్ములా
  rationale: כ ఉపమానాన్ని సూచిస్తుంది; עָפָר కు ‘దుమ్ము’ సహజమైన అర్థం. ఇది అపారమైన పరిమాణాన్ని సూచించే కవితాత్మక అతిశయోక్తిని కాపాడుతుంది.
- source_word: כָּסֶף
  choice: వెండిని
  rationale: כֶּסֶף ధనాన్ని కూడా సూచించగలిగినా, మూలంలోని స్పష్టమైన లోహచిత్రాన్నీ కవితా సమాంతరతనూ నిలుపుటకు ‘వెండి’ ఎంచుకున్నాం.
- source_word: וְכַחֹמֶר
  choice: మట్టిలా
  rationale: חֹמֶר ఇక్కడ మట్టి లేదా బంకమట్టిని సూచిస్తుంది. విస్తారంగా, సామాన్యంగా దొరికేదనే ఉపమాన భావాన్ని ఆధునిక తెలుగులో ‘మట్టిలా’ సహజంగా అందిస్తుంది.
- source_word: יָכִין
  choice: సిద్ధం చేసినా
  rationale: כון హిఫీల్ రూపం ఇక్కడ సిద్ధపరచడం లేదా సమకూర్చడం అనే భావం ఇస్తుంది. ‘సిద్ధం చేయు’ మూలార్థానికి దగ్గరగా ఉండి వస్త్రాల సందర్భంలో అర్థవంతంగా ఉంది.
- source_word: מַלְבּוּשׁ
  choice: బట్టలను
  rationale: מַלְבּוּשׁ దుస్తులు లేదా వస్త్రాలను సూచిస్తుంది. ‘బట్టలు’ ఆధునిక సాధారణ తెలుగులో స్పష్టమైనది; బహువచనం సందర్భంలోని విస్తారమైన సేకరణ భావానికి సరిపోతుంది.
theological_decisions:
- issue: אִם యొక్క షరతార్థక లేదా అనుమతార్థక భావం
  choice: 'అనుమతార్థకం: ‘చేసినా’'
  alternative: 'షరతార్థకం: ‘చేస్తే’'
  rationale: తరువాతి వచనంలో ఇతరులు వాటిని ధరించడం, నిర్దోషి వెండిని పంచుకోవడం చెప్పబడటం వల్ల, దుష్టుడు ఎంత కూడబెట్టినా అది అతనికి నిలవదనే అనుమతార్థక ప్రవాహం బాగా సరిపోతుంది. అయినా హెబ్రీ పదంలోని నిజమైన ద్వంద్వసాధ్యతను పాదటిప్పణిలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సహజంగా అర్థమయ్యే గంభీర కవితా శైలి వాడబడింది. ‘దుమ్ములా… మట్టిలా’ అనే సమాంతర ఉపమానాలను నిలిపాం; אִם లోని సందిగ్ధతను ప్రధాన పాఠంలో అనుమతార్థకంగా చూపి, షరతార్థక పఠనాన్ని పాదటిప్పణిలో భద్రపరిచాం.
