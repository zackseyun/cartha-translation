  to: 'దేవుని వద్ద[a] దుష్టునికి కలిగే భాగం ఇదే; సర్వశక్తిమంతుని నుండి క్రూరులు[b] పొందుతారు[c] వారసత్వం ఇదే:'
  rationale: The revision retains the Hebrew parallelism and the English audit trail's lexical alternatives while improving modern Telugu idiom. It does not resolve the debated idiomatic nuance of עִם אֵל in the main text; instead, it preserves that ambiguity with ‘దేవుని వద్ద’ and records the ‘from God’ sense in the footnote. The verb note continues to distinguish the literal Hebrew ‘take’ from the contextually natural Telugu ‘receive.’
