source:
  edition: WLC
  text: זֶ֤ה חֵֽלֶק אָדָ֖ם רָשָׁ֥ע עִם אֵ֑ל וְֽ/נַחֲלַ֥ת עָ֝רִיצִ֗ים מִ/שַּׁדַּ֥י יִקָּֽחוּ׀־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/027/013.yaml
  text: 'This is the portion of a wicked man with God[c][b][a], and the inheritance that the ruthless receive from the Almighty:'
translation:
  language: te
  text: 'దేవుని వద్ద[a] దుష్టునికి కలిగే భాగం ఇదే; సర్వశక్తిమంతుని నుండి క్రూరులు[b] పొందుతారు[c] వారసత్వం ఇదే:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “దేవుని వద్ద” అనే మాటను, దుష్టునికి దేవుడు కేటాయించే భాగం అనే అర్థంలో “దేవుని నుండి” అని కూడా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “క్రూరులు”కు బదులుగా “హింసాత్మకులు” లేదా “అణచివేసేవారు” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: హీబ్రూ క్రియకు అక్షరార్థం “తీసుకుంటారు”; ఇక్కడ భాగం లేదా వారసత్వం కేటాయింపుగా అందే సందర్భంలో “పొందుతారు” అని అనువదించబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶה
  choice: ఇదే
  rationale: ముందుకు చెప్పబోయే ఫలితాన్ని సూచించే నిర్దేశక పదం; తెలుగులో సహజమైన వాక్యనిర్మాణం కోసం చివర ఉంచబడింది.
- source_word: חֵלֶק
  choice: దక్కే భాగం
  rationale: ఒకరికి కేటాయించబడిన వాటా లేదా గతి అనే భావాన్ని ఇస్తుంది; తరువాతి ‘వారసత్వం’తో ఉన్న పదభేదాన్ని నిలుపుతుంది.
- source_word: אָדָם רָשָׁע
  choice: దుష్టునికి
  rationale: ఏకవచనంలో ఉన్న దుష్ట వ్యక్తిని సూచిస్తుంది; ఆధునిక తెలుగులో సహజంగా, సంక్షిప్తంగా ఉంది.
- source_word: עִם אֵל
  choice: దేవుని దగ్గర
  rationale: עִם యొక్క ప్రాథమిక ‘తో/వద్ద’ సంబంధాన్ని నిలుపుతూ, దేవుని యొద్ద కేటాయింపుగా ఉన్న భావాన్ని తెలుగులో అర్థమయ్యేలా వ్యక్తం చేస్తుంది; ‘దేవుని నుండి’ అనే సందర్భార్థాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: נַחֲלַת
  choice: వారసత్వం
  rationale: కేటాయింపుగా అందే స్వాస్థ్యాన్ని సూచించే సాధారణ పదం; ‘భాగం’తో సమాంతరతను నిలుపుతుంది.
- source_word: עָרִיצִים
  choice: క్రూరులు
  rationale: అణచివేసే, నిర్దయగల లేదా హింసాత్మక వ్యక్తులను సూచించే పదానికి స్పష్టమైన ఆధునిక తెలుగు సమానార్థకం.
- source_word: מִשַּׁדַּי
  choice: సర్వశక్తిమంతుని నుండి
  rationale: שדי అనే దైవ బిరుదును అర్థానుసారంగా అనువదించి, מן యొక్క మూలార్థమైన ‘నుండి’ని స్పష్టంగా నిలుపుతుంది.
- source_word: יִקָּחוּ
  choice: పొందే
  rationale: మూల క్రియ అక్షరార్థంగా ‘తీసుకుంటారు’; అయితే భాగం/వారసత్వం కేటాయింపుగా అందే ఈ సందర్భంలో ‘పొందే’ సహజంగా సరిపోతుంది.
theological_decisions:
- issue: దైవ బిరుదు שדי
  choice: సర్వశక్తిమంతుడు
  alternative: షద్దయి
  rationale: ఇది వ్యక్తినామం కంటే దైవ బిరుదుగా పనిచేస్తుంది; అందువల్ల దాని భావాన్ని తెలుగులో అనువదించడం సాధారణ పాఠకునికి స్పష్టంగా ఉంటుంది.
- issue: עִם אֵל లో దేవునితో సంబంధం
  choice: దేవుని దగ్గర
  alternative: దేవుని నుండి
  rationale: మూలంలోని ‘తో/వద్ద’ అనే నిర్మాణాన్ని ప్రధాన పాఠ్యంలో సంరక్షిస్తూ, ఇది దేవుడు కేటాయించే భాగాన్ని సూచించవచ్చనే సందర్భార్థాన్ని పాదటిప్పణిలో తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, జ్ఞానసాహిత్యానికి తగిన గంభీరతతో రూపొందించబడింది. ‘భాగం—వారసత్వం’ అనే సమాంతర నిర్మాణం, ‘దేవుడు—సర్వశక్తిమంతుడు’ అనే దైవసూచనల జత, వాక్యాంతంలోని ద్విబిందువు అన్నీ తరువాతి వచనాలకు పరిచయంగా నిలుపబడ్డాయి.
