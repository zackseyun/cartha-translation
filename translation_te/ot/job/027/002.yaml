review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents the divine titles, the direct force of Job’s complaint, and the lexical range of מִשְׁפָּטִי and נַפְשִׁי. However, חַי (‘lives’) occurs once and governs the coordinated titles אֵל and שַׁדַּי; repeating the Telugu oath formula makes it appear twice in the source.
  naturalness: The repeated phrase ‘సజీవుడై ఉన్నంత నిశ్చయంగా’ is unnecessarily heavy in Telugu. A single final oath expression is both natural and accurately reflects the Hebrew syntax. ‘నా హక్కు’ is clearer in modern Telugu than ‘నా న్యాయం’ while retaining the legal/rightful-claim sense.
  terminology: ‘దేవుడు’ and ‘సర్వశక్తిమంతుడు’ appropriately render אֵל and שַׁדַּי. ‘నా ప్రాణాన్ని చేదుగా చేసిన’ retains the poetic and deliberately broad sense of נַפְשִׁי without imposing a technical meaning of ‘soul.’
  issues:
  - severity: medium
    issue: The oath formula is translated twice.
    rationale: 'The Hebrew has a single חַי at the beginning: ‘As God lives ... and the Almighty ...’. The second Telugu oath formula is an unsupported expansion, despite the two divine titles being coordinated.'
  - severity: low
    issue: ‘నా న్యాయాన్ని’ is potentially ambiguous in contemporary Telugu.
    rationale: It can be heard as Job’s own justice or moral uprightness. ‘నా హక్కును’ more naturally conveys the contextual sense of his right/rightful claim, while the footnote can preserve ‘justice’ and other alternatives.
  revised_text: నా హక్కును[a] తీసివేసిన దేవుడు, నా ప్రాణాన్ని[b] చేదుగా చేసిన సర్వశక్తిమంతుడు జీవించి ఉన్నంత నిశ్చయంగా,
