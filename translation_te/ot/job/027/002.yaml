  yaml_path: translation/ot/job/027/002.yaml
  text: As God lives[a], who has taken away my justice, and the Almighty, who has made my soul bitter[b],
translation:
  language: te
  text: నా హక్కును[a] తీసివేసిన దేవుడు, నా ప్రాణాన్ని[b] చేదుగా చేసిన సర్వశక్తిమంతుడు జీవించి ఉన్నంత నిశ్చయంగా,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నా న్యాయాన్ని,’ ‘నా న్యాయమైన వాదాన్ని.’ హీబ్రూ מִשְׁפָּט న్యాయం, తీర్పు, లేదా న్యాయంగా దక్కవలసిన హక్కును సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘నా జీవితాన్ని చేదుగా చేసిన,’ లేదా ‘నన్ను చేదెక్కించిన.’ హీబ్రూ נֶפֶשׁ సందర్భాన్ని బట్టి ‘ప్రాణం,’ ‘జీవితం,’ లేదా ‘వ్యక్తి’ అని అర్థమవుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַי אֵל
  choice: దేవుడు సజీవుడై ఉన్నంత నిశ్చయంగా
  rationale: חַי + దైవ బిరుదు ఇక్కడ ప్రమాణ సూత్రం. తెలుగులో దాని ప్రమాణ బలాన్ని సహజంగా నిలుపుతూ ‘సజీవుడై ఉన్నంత నిశ్చయంగా’ అని అనువదించబడింది; కేవలం ‘సజీవుడైన దేవుడు’ అని అంటే ప్రమాణ భావం వర్ణనగా మారిపోతుంది.
- source_word: הֵסִיר
  choice: తీసివేసిన
  rationale: סור యొక్క హిఫీల్ రూపానికి ‘తొలగించు/తీసివేయు’ అనే భావం ఉంది. యోబుకు దక్కవలసిన న్యాయం ఉపసంహరించబడిందనే ఫిర్యాదును ‘తీసివేసిన’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: מִשְׁפָּטִי
  choice: నా న్యాయాన్ని
  rationale: מִשְׁפָּטִי న్యాయం, న్యాయమైన హక్కు, న్యాయవాదం అనే విస్తృతార్థాలను కలిగి ఉంది. ‘నా న్యాయం’ మూలంలోని విస్తృతిని, యోబు ఆరోపణలోని తీవ్రతను నిలుపుతుంది.
- source_word: וְשַׁדַּי
  choice: సర్వశక్తిమంతుడు
  rationale: שַׁדַּיని పేరుగా లిప్యంతరీకరించకుండా దైవ బిరుదుగా అనువదించడం ద్వారా భావం స్పష్టమవుతుంది; యోబు గ్రంథపు గంభీర శైలికీ ఇది సరిపోతుంది.
- source_word: הֵמַר
  choice: చేదుగా చేసిన
  rationale: מרר హిఫీల్ రూపం ‘చేదుగా చేయు/చేదెక్కించు’ అని అర్థం. ‘చేదుగా చేసిన’ మూలంలోని సజీవ రూపకాన్ని నిలుపుతుంది.
- source_word: נַפְשִׁי
  choice: నా ప్రాణాన్ని
  rationale: נֶפֶשׁ సందర్భానుసారం ప్రాణం, జీవితం, వ్యక్తి లేదా అంతరంగం అని సూచించగలదు. ఇక్కడ ‘నా ప్రాణం’ కవితాత్మక భావోద్వేగాన్ని నిలుపుతూ తెలుగులో సహజంగా ఉంటుంది.
theological_decisions:
- issue: אֵל మరియు שַׁדַּי అనే దైవ బిరుదుల అనువాదం
  choice: దేవుడు ... సర్వశక్తిమంతుడు
  alternative: దేవుడు ... షద్దయి
  rationale: אֵל సాధారణంగా ‘దేవుడు’ అనే బిరుదు; שַׁדַּי కూడా ఇక్కడ దైవ బిరుదే. భావాన్ని అందించేందుకు రెండవదాన్ని ‘సర్వశక్తిమంతుడు’గా అనువదించడం జరిగింది; ఇది ప్రమాణంలోని గంభీర సమాంతరతను నిలుపుతుంది.
- issue: యోబు దేవునిపై చేస్తున్న ఆరోపణలోని ఉద్రిక్తత
  choice: ‘నా న్యాయాన్ని తీసివేసిన’ అనే ప్రత్యక్ష వాక్యాన్ని నిలుపుట
  alternative: ‘నాకు న్యాయం జరగనివ్వని’ వంటి మృదువైన వివరణ
  rationale: హీబ్రూ వాక్యం దేవుడు తన న్యాయాన్ని తొలగించాడని యోబు నేరుగా పలికే ధైర్యమైన ఫిర్యాదు. దానిని సిద్ధాంతపరంగా మృదువుచేయకుండా అసలు ఉద్రిక్తతను నిలుపబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కవితాత్మక ప్రమాణ శైలి ఉపయోగించబడింది. హీబ్రూలో חַי ఒక్కసారి వచ్చినప్పటికీ అది సమాంతరంగా ఉన్న రెండు దైవ బిరుదులకూ వర్తిస్తుంది; తెలుగులో ప్రమాణ నిర్మాణం స్పష్టంగా, సహజంగా ఉండేందుకు ‘సజీవుడై ఉన్నంత నిశ్చయంగా’ రెండుసార్లు వ్యక్తీకరించబడింది. వాక్యం తరువాతి వచనాల్లో కొనసాగే ప్రమాణానికి ఆరంభం కావడంతో చివర కామా ఉంచబడింది.
