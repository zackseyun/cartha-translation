base_translation:
  language: en
  yaml_path: translation/ot/job/027/009.yaml
  text: Will God hear his cry when distress comes upon him?[a][b][c]
translation:
  language: te
  text: అతని మీద ఆపద వచ్చినప్పుడు దేవుడు అతని మొర వింటాడా?[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘మొర’కు బదులుగా ‘కేక’ లేదా ‘విన్నపం’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘ఆపద వచ్చినప్పుడు’కు బదులుగా ‘ఆపద వస్తే’ అని కూడా అనువదించవచ్చు; హెబ్రీ సంధిపదం కాలార్థాన్నీ షరతు భావాన్నీ ఇవ్వగలదు.
    reason: alternative_reading
  - marker: c
    text: ‘ఆపద’కు బదులుగా ‘కష్టం,’ ‘విపత్తు,’ లేదా ‘బాధ’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצַּעֲקָתוֹ
  choice: అతని మొర
  rationale: צְעָקָה అనేది కష్టంలో సహాయం కోసం చేసే మొరను లేదా కేకను సూచిస్తుంది. ‘మొర’ అత్యవసర విన్నప భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: יִשְׁמַע
  choice: వింటాడా
  rationale: ఇక్కడ yiqtol రూపం అలంకారప్రాయ ప్రశ్నలో భవిష్యదర్థాన్ని ఇస్తుంది; తెలుగు ప్రశ్నారూపమైన ‘వింటాడా’ దానిని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אֵל
  choice: దేవుడు
  rationale: אֵל కు ఈ సందర్భంలో సహజమైన, స్పష్టమైన తెలుగు సమానార్థకం ‘దేవుడు’.
- source_word: כִּי
  choice: వచ్చినప్పుడు
  rationale: ఈ సందర్భంలో כִּי కాలార్థకంగా గ్రహించడం సహజం. అయితే షరతు భావమైన ‘వస్తే’ కూడా సాధ్యమే; దాన్ని పాదటిప్పణిలో నిలిపాం.
- source_word: תָבוֹא
  choice: వచ్చినప్పుడు
  rationale: בוא యొక్క ప్రాథమిక భావమైన ‘రావడం’ను నిలిపి, కాలవాచక ఉపవాక్యానికి తగిన తెలుగు రూపం వాడాం.
- source_word: עָלָיו
  choice: అతని మీద
  rationale: בוא + על నిర్మాణం ఒక పరిస్థితి వ్యక్తి మీదికి రావడాన్ని సూచిస్తుంది; ‘అతని మీద’ మూల రూపకాన్ని నిలుపుతుంది.
- source_word: צָרָה
  choice: ఆపద
  rationale: צָרָה కష్టం, ఇబ్బంది, విపత్తు వంటి సంకటస్థితిని సూచిస్తుంది. ‘ఆపద’ బాహ్య కష్టాన్ని, దాని వల్ల కలిగే సంకటాన్ని సంక్షిప్తంగా తెలియజేస్తుంది.
