translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ప్రశ్నారూపం వాడబడింది. మూలంలోని సంక్షిప్తతను, అలంకారప్రాయ ప్రశ్నను, అలాగే כִּי లోని కాలార్థం–షరతు భావం మధ్య ఉన్న నిజమైన సందిగ్ధతను నిలిపాం.
