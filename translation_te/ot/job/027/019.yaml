source:
  edition: WLC
  text: עָשִׁ֣יר יִ֭שְׁכַּב וְ/לֹ֣א יֵאָסֵ֑ף עֵינָ֖י/ו פָּקַ֣ח וְ/אֵינֶֽ/נּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/027/019.yaml
  text: He lies down rich[a], but he will not be gathered; he opens his eyes[b], and he is gone.
translation:
  language: te
  text: ధనవంతుడు పడుకుంటాడు, కానీ కూడదీయబడడు[a]; కళ్లు తెరుస్తాడు—అతడు లేడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తన పూర్వీకుల దగ్గరకు చేర్చబడడు”; మరింత సాధారణంగా, “కూడదీయబడడు.” హెబ్రీ వాక్యం సంక్షిప్తంగా ఉంది; మరణం, సమాధి లేదా పూర్వీకులతో చేరడాన్ని సూచించవచ్చు, కానీ వాటిని స్పష్టంగా చెప్పదు.
    reason: alternative_reading
  - marker: b
    text: అక్షరార్థంగా, “అతడు లేడు”; ఇది అతడు వెళ్లిపోయాడని లేదా ఇక లేడని తెలిపే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָשִׁיר
  choice: ధనవంతుడిగా
  rationale: విశేషణాన్ని నామవాచకంగా విస్తరించకుండా, హెబ్రీ వాక్యంలోని సంక్షిప్తతను మరియు అతడు సంపన్న స్థితిలో పడుకోవడం అనే భావాన్ని నిలుపుతుంది.
- source_word: יִשְׁכַּב
  choice: పడుకుంటాడు
  rationale: שׁכב యొక్క ప్రాథమిక అర్థమైన ‘పడుకోవడం’ను సహజమైన తెలుగు కావ్య వర్తమానంలో వ్యక్తం చేస్తుంది; సందర్భంలోని భవిష్యత్/ఫలిత భావం కూడా నిలుస్తుంది.
- source_word: וְלֹא יֵאָסֵף
  choice: కానీ సమకూర్చబడడు
  rationale: నిఫాల్ రూపంలోని ‘సమకూర్చబడటం’ అనే సంక్షిప్త, పరోక్ష వ్యక్తీకరణను విప్పి చెప్పకుండా ఉంచుతుంది. ఇది మరణం, సమాధి, లేదా తన పూర్వీకుల దగ్గరకు చేర్చబడటం వైపు సూచించవచ్చు.
- source_word: עֵינָיו פָּקַח
  choice: కళ్లు తెరుస్తాడు
  rationale: హెబ్రీలోని అకస్మాత్తు మార్పును సహజమైన ఆధునిక తెలుగులో సజీవంగా వ్యక్తం చేస్తుంది.
- source_word: וְאֵינֶנּוּ
  choice: అతడు లేడు
  rationale: ‘అతడు లేడు’ అనే మూలభాషకు దగ్గరైన రూపం, అదృశ్యం లేదా మరణాన్ని సూచించే నుడికారంలోని ఉద్దేశపూర్వక సంక్షిప్తతను కాపాడుతుంది.
theological_decisions:
- issue: וְלֹא יֵאָסֵף అనే మాట మరణం/సమాధిని ఎంత స్పష్టంగా సూచిస్తుంది
  choice: ప్రధాన పాఠ్యంలో ‘సమకూర్చబడడు’ అని సంక్షిప్తంగానే ఉంచడం
  alternative: ‘తన పూర్వీకుల దగ్గరకు చేర్చబడడు’ లేదా ‘సమాధి చేయబడడు’
  rationale: మూల హెబ్రీలో గమ్యం చెప్పబడలేదు. దానిని స్పష్టంగా చేర్చితే పాఠ్యంలో ఉన్న నిజమైన అస్పష్టత తొలగిపోతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరమైన కావ్య శైలి. మూలంలోని సంక్షిప్తత, ఆకస్మిక ముగింపు, మరణం/సమాధికి సంబంధించిన అస్పష్టతను నిలుపుకున్నాం.
