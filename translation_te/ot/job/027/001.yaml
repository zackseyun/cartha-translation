source:
  edition: WLC
  text: וַ/יֹּ֣סֶף אִ֭יּוֹב שְׂאֵ֥ת מְשָׁל֗/וֹ וַ/יֹּאמַֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/job/027/001.yaml
  text: And Job again took up his discourse and said:[a]
translation:
  language: te
  text: యోబు మళ్లీ తన ప్రసంగాన్ని చేపట్టి ఇలా అన్నాడు:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘తన సామెతను,’ ‘తన ఉపమానాన్ని,’ లేదా ‘తన దృష్టాంతాన్ని’; హీబ్రూ పదం గంభీరమైన లేదా అలంకారికమైన అనేక రకాల మాటలను సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּסֶף
  choice: మళ్లీ
  rationale: יסף అనే క్రియకు ప్రాథమికంగా ‘జోడించు/కొనసాగించు’ అనే అర్థాలున్నాయి. שׂאת משלו అనే క్రియాబంధంతో కలిసి ఇక్కడ యోబు మరల ప్రసంగించడం ప్రారంభించాడనే భావాన్ని ‘మళ్లీ’ సహజంగా తెలియజేస్తుంది.
- source_word: שְׂאֵת
  choice: ఎత్తుకొని
  rationale: נשׂא అంటే అక్షరార్థంగా ‘ఎత్తు/మోయు.’ שׂאת משל అనే ప్రయోగంలో ఇది ఒక లాంఛనప్రాయమైన వాక్యాన్ని లేదా ప్రసంగాన్ని పలకడం అనే నుడికారార్థం ఇస్తుంది. ‘ఎత్తుకొని’ మూలంలోని రూపకాన్ని నిలుపుతుంది.
- source_word: מְשָׁלוֹ
  choice: తన గంభీర వాక్యాన్ని
  rationale: מָשָׁל అనే పదం సామెత, ఉపమానం, ఎత్తిపొడుపు మాట, గంభీరమైన కవితాత్మక వాక్యం లేదా ప్రసంగం వంటి విస్తృత అర్థాలను కలిగి ఉంది. ఇక్కడ సుదీర్ఘ కవితాత్మక ప్రసంగానికి పరిచయం కావడంతో ‘గంభీర వాక్యం’ సందర్భానికి సరిపోతూ పదంలోని బరువును తెలియజేస్తుంది.
- source_word: וַיֹּאמַר
  choice: ఇలా అన్నాడు
  rationale: אמר క్రియ యొక్క సాధారణ కథన రూపం. తెలుగులో తరువాత వచ్చే ప్రత్యక్ష ప్రసంగాన్ని సహజంగా పరిచయం చేయడానికి ‘ఇలా అన్నాడు’ అనుకూలం.
- source_word: אִיּוֹב
  choice: యోబు
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
