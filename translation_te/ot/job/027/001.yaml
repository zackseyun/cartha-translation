translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని ఉపయోగించాం. ‘గంభీర వాక్యం’ కవితాత్మక ప్రసంగ స్వభావాన్ని తెలియజేస్తుంది; ‘ఎత్తుకొని’ హీబ్రూ నుడికారంలోని రూపకాన్ని నిలుపుతుంది.
