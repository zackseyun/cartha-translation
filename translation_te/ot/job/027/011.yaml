source:
  edition: WLC
  text: אוֹרֶ֣ה אֶתְ/כֶ֣ם בְּ/יַד אֵ֑ל אֲשֶׁ֥ר עִם שַׁ֝דַּ֗י לֹ֣א אֲכַחֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/027/011.yaml
  text: I will teach you concerning the hand of God[b][a]; what is with the Almighty I will not hide.
translation:
  language: te
  text: దేవుని హస్తం గురించి మీకు బోధిస్తాను[a]; సర్వశక్తిమంతుని వద్ద ఉన్నదాన్ని నేను దాచను[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘దేవుని హస్తం విషయమై.’ ఈ పదబంధం దేవుని శక్తిని, కార్యాన్ని లేదా ఆయన వ్యవహరించే విధానాన్ని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘సర్వశక్తిమంతునికి చెందినదాన్ని,’ ‘సర్వశక్తిమంతుని ఆలోచనను,’ లేదా ‘సర్వశక్తిమంతుని నుండి వచ్చినదాన్ని.’ హీబ్రూ ప్రయోగం సంక్షిప్తంగా, కొంత అధ్యాహారంగా ఉంది.
    reason: alternative_reading
lexical_decisions:
- source_word: אוֹרֶה
  choice: బోధిస్తాను
  rationale: ירה అనే ధాతువు హిఫిల్ అసంపూర్ణ రూపంలో ఇక్కడ ఉపదేశించడం లేదా బోధించడం అనే అర్థాన్ని ఇస్తుంది. యోబు తన శ్రోతలకు చేయబోయే ప్రకటనగా ఈ రూపం సహజంగా ఉంది.
- source_word: אֶתְכֶם
  choice: మీకు
  rationale: రెండవ పురుష బహువచన సర్వనామాన్ని తెలుగులో బోధనకు సహజమైన పరోక్ష కర్మరూపంగా ఇచ్చాం.
- source_word: בְּיַד אֵל
  choice: దేవుని హస్తాన్ని గురించి
  rationale: ב అనే విభక్తిని ఇక్కడ సాధనార్థకంగా కాక, బోధనకు సంబంధించిన విషయాన్ని సూచించేదిగా గ్రహించాం. దేవుని శక్తి, కార్యం, వ్యవహారాలను సూచించగల ‘హస్తం’ అనే మూలభాషా రూపకాన్ని నిలిపాం.
- source_word: אֵל
  choice: దేవుడు
  rationale: אֵל ఇక్కడ దైవనామం లేదా బిరుదుగా వాడబడింది; ఆధునిక ప్రామాణిక తెలుగులో ‘దేవుడు’ స్పష్టమైన, సహజమైన రూపం.
- source_word: אֲשֶׁר עִם שַׁדַּי
  choice: సర్వశక్తిమంతుని వద్ద ఉన్నది
  rationale: హీబ్రూ పదబంధం సంక్షిప్తంగా, కొంత అధ్యాహారంగా ఉంది. ‘వద్ద ఉన్నది’ దాని విస్తృతిని కాపాడుతూ, అది సలహా, ఉద్దేశం, కార్యం లేదా ఆయనకు సంబంధించిన విషయం అని ఏకపక్షంగా నిర్ణయించదు.
- source_word: שַׁדַּי
  choice: సర్వశక్తిమంతుడు
  rationale: యోబు గ్రంథంలో שַׁדַּי అనే దైవబిరుదుకు సుపరిచితమైన, గౌరవప్రదమైన తెలుగు అనువాదం.
- source_word: לֹא אֲכַחֵד
  choice: నేను దాచను
  rationale: כחד పియేల్ రూపానికి ఇక్కడ ‘దాచడం’ లేదా ‘మరుగుపరచడం’ ప్రధానార్థం. ‘దాచను’ సంక్షిప్తంగా, సహజంగా ఉంది.
theological_decisions:
- issue: ‘దేవుని హస్తం’లో వ్యక్తమయ్యే దైవ కార్యశక్తి
  choice: ‘దేవుని హస్తం’ అనే రూపకాన్ని నిలిపాం.
  alternative: ‘దేవుని శక్తి’ లేదా ‘దేవుడు చేసే కార్యాలు’ అని భావానువాదం చేయడం.
  rationale: మూలంలోని రూపకం దేవుని శక్తి, క్రియ, వ్యవహారం వంటి అనేక భావాలను మోయగలదు. వాటిలో ఒక్కదానికే దాన్ని పరిమితం చేయకుండా రూపకాన్నే కాపాడాం.
- issue: రెండవ అర్ధవాక్యంలో సర్వశక్తిమంతునితో ఉన్నదాని స్వరూపం
  choice: ‘సర్వశక్తిమంతుని వద్ద ఉన్నది’ అని విస్తృతమైన, అధ్యాహార భావాన్ని నిలిపాం.
  alternative: ‘సర్వశక్తిమంతుని ఆలోచన,’ ‘సంకల్పం,’ లేదా ‘తీర్పు’ అని నిర్దిష్టీకరించడం.
  rationale: హీబ్రూ ఏ ప్రత్యేక నామవాచకాన్నీ పేర్కొనదు. అందువల్ల వేదాంతపరంగా భావాన్ని సంకుచితం చేయకుండా అసలు వాక్యంలోని అనిశ్చితిని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సామాన్య పాఠకులకు అర్థమయ్యేలా, అయితే యోబు పలుకుకు తగిన గంభీరతతో అనువదించాం. ‘హస్తం’ అనే గ్రంథోచిత రూపకాన్ని నిలిపి, క్లిష్టమైన రెండవ పదబంధాన్ని పాదటిప్పణితో వివరించాం.
