  text: He claps his hands at him and hisses at him from his place[a][b].
translation:
  language: te
  text: అతనిపై చేతులు చరుస్తాడు; తానున్న చోటు నుండి అతనిపై బుస కొడతాడు.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అతనిపై ఈల వేస్తాడు.’ హీబ్రూ క్రియ ఈల వేయడాన్నిగానీ, బుస కొట్టడాన్నిగానీ సూచించగలదు; ఇక్కడి శత్రుత్వ స్వరాన్ని ప్రతిబింబించడానికి ‘బుస కొడతాడు’ అని అనువదించాం.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ పాఠం కర్తను స్పష్టంగా చెప్పకుండా ‘చేతులు చరుస్తాడు … బుస కొడతాడు’ అని మాత్రమే అంటుంది. దీనిని దేవుడు, ఇతర ప్రజలు లేదా ఒక అవ్యక్త శక్తి చేసే చర్యగా వేర్వేరుగా అర్థం చేసుకున్నారు.
    reason: alternative_reading
lexical_decisions:
- source_word: יִשְׂפֹּק
  choice: చేతులు చరుస్తాడు
  rationale: שׂפק అనే క్రియ כפים (‘చేతులు/అరచేతులు’)తో కలిసి చేతులు కొట్టే లేదా చరచే స్పష్టమైన సంజ్ఞను సూచిస్తుంది. ‘చేతులు చరుస్తాడు’ అనేది అపహాస్యమా, విజయోత్సాహమా, ఆశ్చర్యమా అని అదనంగా నిర్ణయించకుండా ఆ సంజ్ఞను సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: עָלֵימוֹ
  choice: అతనిపై
  rationale: על + ఏకవచన ప్రత్యయం ఇక్కడ చర్య ఎవరిని లక్ష్యంగా చేసిందో తెలియజేస్తుంది. ‘అతనిపై’ అనేది ‘వ్యతిరేకంగా/మీద’ అనే భావవిస్తృతిని ఎక్కువగా సంకుచితం చేయదు.
- source_word: כַּפֵּימוֹ
  choice: చేతులు
  rationale: כף పదానికి ‘అరచేయి’ లేదా ‘చేయి’ అనే అర్థాలు ఉన్నాయి; ఈ సందర్భంలో తెలుగు వాడుకలో ‘చేతులు చరుస్తాడు’ సహజంగా ఉంటుంది. కర్తతో సంబంధం క్రియారూపం ద్వారా స్పష్టమవుతున్నందున ప్రత్యేకంగా ‘తన’ అని చేర్చలేదు.
- source_word: וְיִשְׁרֹק
  choice: బుసకొడతాడు
  rationale: שרק ఈల వేయడాన్నిగానీ బుసకొట్టడాన్నిగానీ సూచించగలదు. తీర్పు, శత్రుత్వ సందర్భానికి ‘బుసకొడతాడు’ సరిపోతుంది; ‘ఈల వేస్తాడు’ అనే సాధ్యమైన అర్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: עָלָיו
  choice: అతనిపై
  rationale: మొదటి על + ప్రత్యయంలాగే ఇది కూడా శబ్దసంజ్ఞ లక్ష్యాన్ని సూచిస్తుంది. సమాంతర నిర్మాణాన్ని నిలుపడానికి అదే పదబంధాన్ని వాడాం.
- source_word: מִמְּקֹמוֹ
  choice: తానున్న చోటు నుంచే
  rationale: מקום సాధారణంగా ‘స్థలం/చోటు’. ‘తానున్న చోటు నుంచి’ అనేది ఆ స్థలం నివాసమా మరేదైనా నిర్దిష్ట ప్రదేశమా అని తేల్చదు; ‘నుంచే’ మూలంలోని స్థానబిందువును సహజమైన తెలుగులో బలంగా తెలియజేస్తుంది.
theological_decisions:
- issue: వచనంలోని కర్త ఎవరు?
  choice: తెలుగులో కర్తను పేరుపెట్టి చెప్పకుండా, ఏకవచన క్రియారూపాన్ని మాత్రమే ఉంచడం
  alternative: కర్త దేవుడు, ఇతర ప్రజలు, తూర్పుగాలి లేదా వ్యక్తీకరించబడిన మరేదైనా శక్తి అని స్పష్టంగా పేర్కొనడం
  rationale: హీబ్రూ పాఠంలో మూడవ పురుష ఏకవచన క్రియలు ఉన్నా కర్త ప్రత్యక్షంగా లేదు. సందర్భం పలు వ్యాఖ్యానాలకు అవకాశం ఇస్తుంది. తెలుగు సహజంగానే సర్వనామాన్ని విడిచిపెట్టగలదు కాబట్టి, మూలంలోని అస్పష్టతను ‘అతడు’ అని కూడా అనవసరంగా ముందుకు తేవకుండా నిలుపవచ్చు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గంభీరంగా ఉండే సంక్షిప్త వాక్యనిర్మాణం వాడబడింది. కర్తను వచనంలో చేర్చకుండా తెలుగు క్రియారూపాలతో వ్యక్తపరచడం ద్వారా మూలంలోని నిజమైన అస్పష్టత నిలుపబడింది. ‘చేతులు చరుస్తాడు’ సాహిత్య గౌరవాన్ని కాపాడుతూ సాధారణ పాఠకులకు అర్థమయ్యే ప్రయోగం.
