  text: תַּשִּׂיגֵ֣/הוּ כַ֭/מַּיִם בַּלָּה֑וֹת לַ֝֗יְלָה גְּנָבַ֥תּ/וּ סוּפָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/027/020.yaml
  text: Terrors overtake him like waters[b][a]; in the night a storm steals him away.
translation:
  language: te
  text: భయాలు జలాలవలె అతన్ని పట్టుకుంటాయి[a]; రాత్రివేళ తుఫాను దొంగవలె అతన్ని ఎత్తుకుపోతుంది[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘భయాలు వరదలవలె అతన్ని పట్టుకుంటాయి.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘పెనుతుఫాను’ లేదా ‘సుడిగాలి’ రాత్రివేళ అతన్ని ఎత్తుకుపోతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּשִּׂיגֵהוּ
  choice: అతన్ని పట్టుకుంటాయి
  rationale: హిఫిల్ రూపంలోని נשׂג ఇక్కడ వెంబడించి చేరుకోవడం లేదా పట్టుకోవడం అనే భావాన్ని ఇస్తుంది. విపత్తులు అతన్ని తప్పించుకోనివ్వకుండా పట్టుకుంటాయనే చిత్రాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: כַמַּיִם
  choice: జలాలవలె
  rationale: హీబ్రూలోని బహువచన రూపాన్ని నిలుపుతూ, ముంచెత్తే జలాల ఉపమానాన్ని గంభీరమైన సహజ తెలుగులో అందిస్తుంది.
- source_word: בַּלָּהוֹת
  choice: భయానకాలు
  rationale: ఈ పదం ఆకస్మిక భయాలను లేదా భయంకరమైన విపత్తులను సూచిస్తుంది. ‘భయానకాలు’ కవితాత్మక బహువచనాన్ని, విపత్తులు కర్తగా ఉన్న వాక్యనిర్మాణాన్ని నిలుపుతుంది.
- source_word: לַיְלָה
  choice: రాత్రివేళ
  rationale: నామవాచకం ఇక్కడ క్రియావిశేషణార్థంలో ఉంది. ‘రాత్రివేళ’ ఆధునిక తెలుగులో సహజంగా ఉండి రాత్రి సంభవించే ఆకస్మికతను నిలుపుతుంది.
- source_word: גְּנָבַתּוּ
  choice: అతన్ని దొంగిలించి తీసుకుపోతుంది
  rationale: גנב యొక్క ప్రాథమిక ‘దొంగిలించు’ భావాన్ని కాపాడుతూ, తుఫాను అతన్ని అకస్మాత్తుగా తీసుకుపోతుందనే కవితా చిత్రాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: סוּפָה
  choice: తుఫాను
  rationale: సופה బలమైన తుఫాను లేదా పెనుగాలిని సూచిస్తుంది. ‘తుఫాను’ సాధారణ ఆధునిక తెలుగులో స్పష్టంగా ఉండి, మరీ నిర్దిష్టమైన సుడిగాలి భావాన్ని అనవసరంగా చేర్చదు.
