- from: భయానకాలు జలాలవలె అతన్ని పట్టుకుంటాయి[a]; రాత్రివేళ తుఫాను అతన్ని దొంగిలించి తీసుకుపోతుంది[b].
  to: భయాలు జలాలవలె అతన్ని పట్టుకుంటాయి[a]; రాత్రివేళ తుఫాను దొంగవలె అతన్ని ఎత్తుకుపోతుంది[b].
  rationale: The revision more directly renders בלהות as “భయాలు” and preserves the figurative force of גנב without implying a literal act of theft. It retains the Hebrew plural image of waters, the nighttime setting, and the unspecified violent storm. Footnote anchors and alternatives remain correctly aligned with their respective phrases.
