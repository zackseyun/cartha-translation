source:
  edition: WLC
  text: יָ֭כִין וְ/צַדִּ֣יק יִלְבָּ֑שׁ וְ֝/כֶ֗סֶף נָקִ֥י יַחֲלֹֽק׃
base_translation:
  language: en
  yaml_path: translation/ot/job/027/017.yaml
  text: He may prepare it[a], but the righteous will wear it[b], and the innocent will divide the silver.
translation:
  language: te
  text: అతడు దాన్ని సిద్ధం చేసినా[a], నీతిమంతుడు దాన్ని ధరిస్తాడు[b]; నిర్దోషి ఆ వెండిని పంచుకుంటాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతడు దాన్ని సిద్ధం చేస్తాడు; అయితే నీతిమంతుడు దాన్ని ధరిస్తాడు.” హీబ్రూ అసంపూర్ణ క్రియారూపాన్ని రాయితీ భావం లేకుండా కూడా అనువదించవచ్చు; ముందటి వచన సందర్భం “సిద్ధం చేసినా” అనే భావానికి మద్దతిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: మూలపాఠంలో “దాన్ని” అని లేదు. “ధరిస్తాడు” అనే క్రియకు కర్మగా ముందటి వచనంలోని వస్త్రసంపద భావించబడింది; “ఆ వెండి” కూడా అక్కడ కూడబెట్టిన సంపదనే సూచిస్తుంది.
    reason: cross_reference
lexical_decisions:
- source_word: יָכִין
  choice: అతడు దాన్ని సిద్ధం చేసినా
  rationale: כון హిఫీల్ రూపానికి ‘సిద్ధం చేయు’ అనే అర్థం సహజం. క్రియకు కర్మ మూలపాఠంలో వ్యక్తంగా లేకపోయినా, ముందటి వచనంలో కూడబెట్టిన వస్త్రసంపద సందర్భం దాన్ని సూచిస్తుంది. సందర్భంలోని వ్యతిరేక ఫలితాన్ని తెలపడానికి concessive భావంతో ‘చేసినా’ వాడబడింది.
- source_word: צַדִּיק
  choice: నీతిమంతుడు
  rationale: నామవాచకంగా వాడిన ఏకవచన విశేషణం. ఆధునిక తెలుగు జ్ఞానసాహిత్య శైలిలో ‘నీతిమంతుడు’ సహజంగా, గౌరవప్రదంగా ఉంటుంది.
- source_word: יִלְבָּשׁ
  choice: దాన్ని ధరిస్తాడు
  rationale: לבש యొక్క సరళ అర్థం ‘ధరించు’. కర్మ ముందటి వచనంలోని వస్త్రం/వస్త్రసంపద నుండి గ్రహించబడుతుంది; తెలుగులో స్పష్టత కోసం ‘దాన్ని’ చేర్చబడింది.
- source_word: כֶסֶף
  choice: ఆ వెండిని
  rationale: כֶסֶף కు ‘వెండి’ లేదా ‘ధనం’ అనే అర్థాలు ఉండవచ్చు. ముందటి వచనంలో కూడబెట్టిన వెండి సందర్భాన్ని నిలుపుతూ నిర్దిష్టత కోసం ‘ఆ వెండిని’ ఎంచుకోబడింది.
- source_word: נָקִי
  choice: నిర్దోషి
  rationale: నామవాచకంగా వాడిన ఈ విశేషణం అపరాధం లేదా దోషం లేనివానిని సూచిస్తుంది. ‘నిర్దోషి’ నీతిమంతునికి సమాంతరంగా సహజంగా ఉంటుంది.
- source_word: יַחֲלֹק
  choice: పంచుకుంటాడు
  rationale: חלק అంటే ‘విభజించు, వాటా పంచు’. ఇక్కడ వెండిని తన వాటాగా పొందడం లేదా విభజించుకోవడం రెండింటినీ అనుమతించే సహజ తెలుగు రూపం ‘పంచుకుంటాడు’; అది పంపిణీ చేసే అర్థానికే పరిమితం కాదు.
