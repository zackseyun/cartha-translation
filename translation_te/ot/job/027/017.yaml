translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే జ్ఞానసాహిత్యానికి తగిన గంభీరతతో రూపొందించబడింది. హీబ్రూ వాక్యంలోని ఏకవచన ప్రతినిధి రూపాలు నిలుపబడ్డాయి. మొదటి క్రియలోని కాల/విధి అనిశ్చితిని ప్రధాన పాఠం మరియు పాదటిప్పణి ద్వారా సంరక్షించాం.
