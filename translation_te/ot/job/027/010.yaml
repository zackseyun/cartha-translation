  text: אִם עַל שַׁדַּ֥י יִתְעַנָּ֑ג יִקְרָ֖א אֱל֣וֹהַּ בְּ/כָל עֵֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/027/010.yaml
  text: Will he delight himself in the Almighty? Will he call on God at all times?[a][b]
translation:
  language: te
  text: అతడు సర్వశక్తిమంతునిలో ఆనందిస్తాడా?[a] అన్ని వేళలా దేవునికి మొరపెడతాడా?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, మరింత అక్షరార్థంగా, “ఒకవేళ అతడు సర్వశక్తిమంతునిలో ఆనందిస్తే”; ఇక్కడ హీబ్రూ అవ్యయం అలంకారిక ప్రశ్నను ప్రవేశపెడుతోంది.
    reason: lexical_alternative
  - marker: b
    text: “మొరపెట్టు” అనే మాటను “వేడుకో” లేదా “ప్రార్థించు” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: '... ఆనందిస్తాడా?'
  rationale: ఈ సందర్భంలో אִם షరతును సూచించకుండా అలంకారిక ప్రశ్నను ప్రవేశపెడుతోంది. అందువల్ల తెలుగులో ప్రశ్నార్థక నిర్మాణంతో దాని వాక్యప్రవాహ భావాన్ని వ్యక్తం చేశాం.
- source_word: עַל
  choice: లో
  rationale: התענג అనే క్రియతో వ్యక్తిని సూచించే కర్మ వచ్చినప్పుడు, దేనిలో ఆనందం పొందుతాడో עַל తెలియజేస్తుంది. తెలుగులో ‘సర్వశక్తిమంతునిలో ఆనందించడం’ ఆ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: שַׁדַּי
  choice: సర్వశక్తిమంతుడు
  rationale: ఇది దేవుని బిరుదు. పేరుగా లిప్యంతరీకరించకుండా, అర్థం స్పష్టంగా ఉండే ప్రామాణిక తెలుగు బిరుదుగా అనువదించాం.
- source_word: יִתְעַנָּג
  choice: ఆనందిస్తాడు
  rationale: హిత్పయేల్ రూపం ఒకరిలో ఆనందం పొందడం లేదా సంతోషించడం అనే భావాన్ని ఇస్తుంది. తెలుగు క్రియ సహజంగా ఉండేందుకు ‘ఆనందిస్తాడు’ అని ఇచ్చాం.
- source_word: יִקְרָא
  choice: మొరపెడతాడు
  rationale: దేవుడు కర్మగా ఉన్నప్పుడు קרא ఆయనను సహాయం లేదా ప్రార్థన కోసం పిలవడాన్ని సూచిస్తుంది. ‘మొరపెట్టు’ ఈ మతపరమైన భావాన్ని సహజ తెలుగులో తెలియజేస్తూ, కేవలం పేరుపెట్టి పిలవడం అనే అపార్థాన్ని నివారిస్తుంది.
- source_word: אֱלוֹהַּ
  choice: దేవుడు
  rationale: ఈ ఏకవచన దైవవాచక పదాన్ని అదనపు విశేషణాలు చేర్చకుండా సాధారణంగా ‘దేవుడు’ అని అనువదించాం.
- source_word: בְּכָל עֵת
  choice: అన్ని వేళలా
  rationale: ఈ పదబంధం ప్రతి సందర్భంలోనూ లేదా నిరంతరంగా చేసే పనిని సూచిస్తుంది. ‘అన్ని వేళలా’ మూలంలోని విస్తృత భావాన్ని స్పష్టంగా కాపాడుతుంది.
theological_decisions:
- issue: שַׁדַּי అనే దైవ బిరుదు అనువాదం
  choice: సర్వశక్తిమంతుడు
  alternative: షద్దయి
  rationale: ఇది దేవుని పేరు కంటే బిరుదుగా పనిచేస్తున్నందున లిప్యంతరీకరణకు బదులు అర్థాన్ని అనువదించడం పాఠకులకు స్పష్టతనిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, కవితాత్మక గౌరవాన్ని నిలుపుకుంటూనే సాధారణ పాఠకులకు అర్థమయ్యే ప్రశ్నార్థక నిర్మాణం వాడబడింది. ‘దేవునికి మొరపెట్టు’ ప్రార్థనార్థక పిలుపును సహజంగా వ్యక్తం చేస్తుంది.
