source:
  edition: WLC
  text: כִּֽי כָל ע֣וֹד נִשְׁמָתִ֣/י בִ֑/י וְ/ר֖וּחַ אֱל֣וֹהַּ בְּ/אַפִּֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/027/003.yaml
  text: For as long as my breath is still in me[a], and the spirit of God is in my nostrils,
translation:
  language: te
  text: నా శ్వాస నాలోను, దేవుని ఊపిరి[a] నా ముక్కుపుటాల్లోను ఉన్నంతకాలం,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దేవుని ఆత్మ.’ హీబ్రూ רוּחַ పదానికి ‘ఊపిరి,’ ‘గాలి,’ లేదా ‘ఆత్మ’ అనే అర్థాలు ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: వాక్య నిర్మాణంలో ప్రత్యేక పదంగా అనువదించకుండా కాలవాచక ఉపవాక్యంతో సహజంగా వ్యక్తీకరించబడింది
  rationale: ఇక్కడ כִּי తరువాత వచ్చే ప్రమాణసదృశ ప్రకటనకు ఆధారాన్ని పరిచయం చేస్తుంది. ఈ ఒక్క వచనంలో ‘ఎందుకంటే’ అని పెట్టడం తెలుగులో అసంపూర్ణంగా, కృత్రిమంగా వినిపిస్తుంది; తరువాతి వచనంతో కలిసినప్పుడు ‘ఉన్నంతకాలం’ నిర్మాణమే సంబంధాన్ని సహజంగా మోస్తుంది.
- source_word: כָל עוֹד
  choice: ఉన్నంతకాలం
  rationale: కొనసాగుతున్న కాలవ్యాప్తిని తెలిపే ఈ పదబంధాన్ని ఆధునిక తెలుగులో సహజమైన ‘ఉన్నంతకాలం’తో అందించింది.
- source_word: נִשְׁמָתִי
  choice: నా శ్వాస
  rationale: נשמה ఇక్కడ జీవాన్ని నిలిపే శ్వాసను సూచిస్తుంది. ‘శ్వాస’ సహజమైనది; ‘ఆత్మ’ అని అనువదిస్తే సందర్భం కోరని భావాన్ని చేర్చినట్లవుతుంది.
- source_word: בִי
  choice: నాలో
  rationale: అంతర్గత ఉనికిని సూచించే בִי యొక్క సూటి, సహజమైన అనువాదం.
- source_word: וְרוּחַ
  choice: దేవుని ఊపిరి
  rationale: נִשְׁמָתִיతో ఉన్న కవితా సమాంతరత మరియు ‘ముక్కుపుటాల్లో’ అనే శరీరచిత్రం దృష్ట్యా רוּחַకు ఇక్కడ ‘ఊపిరి’ సరిపోతుంది. ‘ఆత్మ’ అనే సాధ్యార్థాన్ని పాదసూచికలో నిలిపింది.
- source_word: אֱלוֹהַּ
  choice: దేవుని
  rationale: యోబు గ్రంథంలో తరచుగా కనిపించే ఏకవచన దైవసంబోధనను సరళంగా ‘దేవుడు’ అనే అర్థంతో అందించింది.
- source_word: בְּאַפִּי
  choice: నా ముక్కుపుటాల్లో
  rationale: ఇక్కడ אַףకు కోపం అనే రూపకాలంకార అర్థం కాకుండా శ్వాసకు సంబంధించిన భౌతిక అర్థమే అవసరం. ‘ముక్కుపుటాల్లో’ స్పష్టంగా, సహజంగా ఆ చిత్రాన్ని నిలుపుతుంది.
theological_decisions:
- issue: נִשְׁמָתִיతో సమాంతరంగా ఉన్న רוּחַ אֱלוֹהַּ అర్థం
  choice: దేవుని ఊపిరి
  alternative: దేవుని ఆత్మ
  rationale: ఈ వచనంలోని శ్వాస, జీవం, ముక్కుపుటాలు అనే తక్షణ సందర్భం ‘దేవుని ఊపిరి’ అనే అర్థానికి బలం ఇస్తుంది. అయితే רוּחַకు ‘ఆత్మ’ అనే నిజమైన అర్థం కూడా ఉన్నందున ఆ వేదాంతపరమైన అనిశ్చితిని పాదసూచికలో భద్రపరిచింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనా సాధారణ పాఠకులకు స్పష్టంగా ఉండే శైలి. ‘శ్వాస’ మరియు ‘ఊపిరి’ ద్వారా రెండు హీబ్రూ పదాల మధ్య స్వల్ప పదభేదాన్ని నిలిపి, కవితా సమాంతరతను కూడా కాపాడింది. వచనం తరువాతి ప్రమాణవాక్యంతో కొనసాగుతున్నందున చివర కామా ఉంచబడింది.
