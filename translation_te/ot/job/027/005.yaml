  text: חָלִ֣ילָ/ה לִּ/י֮ אִם אַצְדִּ֪יק אֶ֫תְ/כֶ֥ם עַד אֶגְוָ֑ע לֹא אָסִ֖יר תֻּמָּתִ֣/י מִמֶּֽ/נִּי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/027/005.yaml
  text: Far be it from me to declare you right[a]; until I die[b], I will not remove my integrity from myself.
translation:
  language: te
  text: మిమ్మల్ని సరైనవారిగా ప్రకటించడం[a] నాకు ఎంతమాత్రమూ తగదు! నేను చనిపోయేంతవరకు నా యథార్థతను[b] నా నుంచి తొలగించను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, ‘మిమ్మల్ని నిర్దోషులుగా తీర్పు చెప్పడం’ లేదా ‘మీరు న్యాయమైనవారని ప్రకటించడం.’ హీబ్రూ క్రియకు న్యాయనిర్ణయ సంబంధమైన భావం ఉంది: ఎవరైనా న్యాయపక్షంలో ఉన్నారని ప్రకటించడం.'
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘నా నిష్కళంకతను’ లేదా ‘నా నిర్దోషిత్వాన్ని.’ ఇక్కడి హీబ్రూ పదం యోబు తనను తాను సమర్థించుకునే సందర్భంలో నైతిక యథార్థతను లేదా నిందారహిత స్థితిని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָלִילָה לִּי
  choice: నాకు ఎంతమాత్రమూ తగదు
  rationale: ఇది ఏదో చర్యను తీవ్రంగా తిరస్కరించే హీబ్రూ నుడికారం. తెలుగులో సహజంగా, గంభీరంగా ఆ తిరస్కార బలాన్ని తెలియజేస్తుంది; కేవలం అసమర్థతను సూచించదు.
- source_word: אִם אַצְדִּיק אֶתְכֶם
  choice: మిమ్మల్ని న్యాయపక్షంలో ఉన్నవారిగా ప్రకటించడం
  rationale: צדק క్రియ యొక్క హిఫీల్ రూపం ఇక్కడ న్యాయనిర్ణయ సంబంధమైన అర్థంలో, ఎదుటివారు సరైన పక్షంలో ఉన్నారని ప్రకటించడాన్ని సూచిస్తుంది. ‘నీతిమంతులుగా చేయడం’ అనే అపార్థాన్ని ఇది నివారిస్తుంది.
- source_word: עַד אֶגְוָע
  choice: నేను చనిపోయేంతవరకు
  rationale: גוע అంటే చనిపోవడం లేదా ప్రాణం విడవడం. ఎంపిక చేసిన రూపం ఆధునిక తెలుగులో స్పష్టంగా, సహజంగా ఉంది.
- source_word: לֹא אָסִיר
  choice: తొలగించను
  rationale: סור హిఫీల్ రూపంలోని ‘తొలగించు/పక్కకు తీసివేయు’ అనే స్పష్టమైన రూపకాన్ని సాధ్యమైనంతవరకు నిలుపుతుంది.
- source_word: תֻּמָּתִי
  choice: నా యథార్థతను
  rationale: యోబు తనపై వచ్చిన ఆరోపణల మధ్య నిలబెట్టుకుంటున్న నైతిక సమగ్రత, నిష్కపటత్వం అనే భావాన్ని తెలియజేస్తుంది; సంపూర్ణ పాపరాహిత్యాన్ని అనవసరంగా సూచించదు.
- source_word: מִמֶּנִּי
  choice: నా నుంచి
  rationale: హీబ్రూలో స్పష్టంగా ఉన్న మొదటి పురుష విభక్తి సంబంధాన్ని నిలుపుతూ, యథార్థతను తన నుంచి తొలగించననే ఉద్ఘాటనను తెలియజేస్తుంది.
theological_decisions:
- issue: యోబు తన నైతిక స్థితి గురించి చేస్తున్న వాదన స్వభావం
  choice: תֻּמָּתִי అనే పదాన్ని ‘నా యథార్థత’గా అనువదించడం
  alternative: నా నిర్దోషిత్వం; నా నిష్కళంకత
  rationale: యోబు తన స్నేహితుల ఆరోపణను అంగీకరించకుండా తన నైతిక సమగ్రతను నిలబెట్టుకుంటున్నాడు. ‘యథార్థత’ ఈ ఉద్రిక్తతను కాపాడుతుంది; అతడు సంపూర్ణంగా పాపరహితుడని వాక్యం చెబుతున్నట్లు అతిశయింపదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే గంభీర శైలి. మొదటి వాక్యంలో హీబ్రూ న్యాయస్థాన భావాన్ని, రెండవ వాక్యంలో ‘తొలగించు’ అనే రూపకాన్ని నిలిపి, అసహజమైన పదానువాదాన్ని పరిమితం చేశాం.
