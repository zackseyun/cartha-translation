  - severity: low
    issue: The main-text phrase ‘న్యాయపక్షంలో ఉన్నవారిగా’ is more technical and less natural than necessary.
    rationale: ‘సరైనవారిగా ప్రకటించడం’ communicates the Hebrew forensic verdict naturally in modern Telugu; the footnote preserves the more explicit legal explanation and alternatives.
