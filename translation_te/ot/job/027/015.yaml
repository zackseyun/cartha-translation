- from: అతనికి మిగిలినవారు మరణం చేత పాతిపెట్టబడతారు[a]; అతని విధవరాళ్లు ఏడవరు.
  to: అతని తర్వాత మిగిలినవారు మరణం చేత పాతిపెట్టబడతారు[a]; అతని విధవలు ఏడవరు.
  rationale: The revision clarifies that the survivors are those remaining after him, rather than persons remaining to him, and uses the standard modern plural ‘విధవలు.’ The primary translation and footnote continue to preserve the Hebrew ambiguity of בַּמָּוֶת.
  reviewer_model: gpt-5.6-terra
