  yaml_path: translation/ot/job/027/015.yaml
  text: Those who survive him will be buried by death[a], and his widows will not weep.
translation:
  language: te
  text: అతని తర్వాత మిగిలినవారు మరణం చేత పాతిపెట్టబడతారు[a]; అతని విధవలు ఏడవరు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మరణంలో పాతిపెట్టబడతారు.’ హీబ్రూ పదబంధం సంక్షిప్తంగా ఉంది; అది మరణమే వారి పాతిపెట్టబడటానికి సాధనం లేదా గతి అన్న భావాన్నిగానీ, మరణం నడుమ వారు పాతిపెట్టబడతారన్న భావాన్నిగానీ వ్యక్తం చేయవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרִידוֹ
  choice: అతనికి మిగిలినవారు
  rationale: ఈ పదం మిగిలి ఉన్నవారిని లేదా ప్రాణాలతో తప్పించుకున్నవారిని సూచిస్తుంది. రూపం ఏకవచనమైనా, దాని వెంట ఉన్న క్రియ బహువచనంలో ఉన్నందున ఇక్కడ సమూహార్థక బహువచనంగా అనువదించబడింది.
- source_word: בַּמָּוֶת
  choice: మరణం చేత
  rationale: ב ఉపసర్గ ఇక్కడ పరిస్థితిని గానీ, సాధనాన్ని లేదా కారణాన్ని పోలిన భావాన్ని గానీ సూచించవచ్చు. ‘మరణం చేత’ అనే మాట హీబ్రూ వాక్యంలోని సంక్షిప్తమైన, ఘాటైన భావాన్ని నిలుపుతుంది.
- source_word: יִקָּבֵרוּ
  choice: పాతిపెట్టబడతారు
  rationale: קבר అనే క్రియ యొక్క నిఫాల్ రూపం ‘పాతిపెట్టబడటం’ అనే కర్మణి భావాన్ని ఇస్తుంది; ఆధునిక తెలుగులో ఇదే సహజమైన సమానార్థకం.
- source_word: וְאַלְמְנֹתָיו
  choice: అతని విధవరాళ్లు
  rationale: אַלְמָנָה అంటే ‘విధవరాలు.’ బహువచన ప్రత్యయంతో ఉన్న ఈ రూపాన్ని నేరుగా, సహజంగా అనువదించాం.
- source_word: לֹא תִבְכֶּינָה
  choice: ఏడవరు
  rationale: בכה యొక్క ప్రాథమిక అర్థం ‘ఏడవడం.’ ‘దుఃఖించరు’ అనే విస్తృత భావం కంటే ‘ఏడవరు’ మూలపదానికి మరింత దగ్గరగా ఉంటుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గంభీరమైన శైలి వాడబడింది. మూలంలోని ‘మరణం చేత పాతిపెట్టబడతారు’ అనే అసాధారణమైన కానీ ఉద్దేశపూర్వకంగా ఘాటైన రూపకాన్ని సవరించి మృదువుచేయకుండా నిలిపి, ప్రత్యామ్నాయ భావాన్ని పాదటిప్పణిలో ఇచ్చాం.
