  text: בְּ/צִדְקָתִ֣/י הֶ֭חֱזַקְתִּי וְ/לֹ֣א אַרְפֶּ֑/הָ לֹֽא יֶחֱרַ֥ף לְ֝בָבִ֗/י מִ/יָּמָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/027/006.yaml
  text: I hold fast to my righteousness and will not let it go[b][a]; my heart does not reproach me for any of my days.
translation:
  language: te
  text: నేను నా నీతిని గట్టిగా పట్టుకున్నాను; దాన్ని విడిచిపెట్టను.[a] నా జీవితకాలమంతా నా హృదయం నన్ను నిందించదు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నా యథార్థతను.’ హెబ్రీ పదానికి సాధారణంగా ‘నీతి’ అని అర్థం; అయితే యోబు గ్రంథంలో అది వ్యక్తిగత యథార్థత భావంతో కలిసివచ్చే అవకాశం ఉంది.
    reason: lexical_alternative
  - marker: b
    text: ‘నిందించదు’ అని అనువదించిన హెబ్రీ క్రియకు ‘దూషించదు’ లేదా ‘ఎగతాళి చేయదు’ అని కూడా అర్థం కావచ్చు. ఇక్కడ ఈ మాట అంతరంగ స్వనిందను సూచిస్తుంది. చివరి పదబంధాన్ని ‘నా దినములన్నిటిలో’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּצִדְקָתִי
  choice: నా నీతిని
  rationale: צִדְקָה ప్రధానంగా ‘నీతి/న్యాయబద్ధత’ను సూచిస్తుంది. యోబు సందర్భంలో ‘యథార్థత’ అనే భావం కలిసివచ్చినా, ‘నీతి’ అనే పదం మూలంలోని నైతిక-న్యాయపరమైన బలాన్ని కాపాడుతుంది.
- source_word: הֶחֱזַקְתִּי
  choice: గట్టిగా పట్టుకున్నాను
  rationale: חזק హిఫీల్ రూపం ఇక్కడ దృఢంగా పట్టుకోవడం అనే భావాన్ని ఇస్తుంది. హెబ్రీ పరిపూర్ణ క్రియారూపాన్ని నిలుపుతూ, కొనసాగుతున్న దృఢనిశ్చయాన్ని సందర్భం తెలియజేస్తుంది.
- source_word: וְלֹא אַרְפֶּהָ
  choice: దాన్ని విడిచిపెట్టను
  rationale: רפה హిఫీల్ రూపానికి వదలడం, పట్టు సడలించడం అనే అర్థాలున్నాయి. స్త్రీలింగ ప్రత్యయం ముందున్న ‘నా నీతి’ని సూచిస్తుంది; తెలుగులో ‘దాన్ని’ దానిని స్పష్టంగా చూపిస్తుంది.
- source_word: לֹא יֶחֱרַף לְבָבִי
  choice: నా హృదయం నన్ను నిందించదు
  rationale: חרףకు నిందించడం, దూషించడం, ఎగతాళి చేయడం అనే భావాలున్నాయి. ‘నా హృదయం’ అనే కర్తను అలాగే ఉంచి, అంతరంగ స్వనింద భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; ‘మనస్సాక్షి’ అని అనువదించడం మూలానికి మించిన వ్యాఖ్యానం అవుతుంది.
- source_word: מִיָּמָי
  choice: నా రోజులలో ఏ ఒక్కదాని విషయమై కూడా
  rationale: מן + ימים అనే నిర్మాణం నిరాకరణతో కలిసి జీవితంలోని ఏ రోజునూ మినహాయించని విస్తృతిని సూచిస్తుంది. ఈ రూపం ‘నా రోజులన్నిటిలో’ అనే ప్రత్యామ్నాయ భావాన్ని బలవంతంగా తేల్చకుండా, ప్రతి రోజుకు సంబంధించిన నిరాకరణను తెలుగులో స్పష్టం చేస్తుంది.
theological_decisions:
- issue: צִדְקָהను బలమైన నైతిక భావంతో ‘నీతి’గా అనువదించాలా, లేక సందర్భానుసారంగా ‘యథార్థత’గా అనువదించాలా?
  choice: నీతి
  alternative: యథార్థత
  rationale: హెబ్రీ నామవాచకపు సాధారణ నైతిక-న్యాయపరమైన అర్థాన్ని ‘నీతి’ మెరుగ్గా నిలుపుతుంది. యోబు తన నిర్దోషిత్వాన్ని వాదిస్తున్న సందర్భంలో ‘యథార్థత’ సాధ్యమైన భావమే అయినా, అది అతని ప్రకటనను కేవలం వ్యక్తిగత నిజాయితీకి పరిమితం చేసే ప్రమాదం ఉంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన శైలిని ఉపయోగించాం. ‘హృదయం’ అనే హెబ్రీ రూపకాన్ని నిలిపి, దాన్ని వ్యాఖ్యానాత్మకంగా ‘మనస్సాక్షి’గా మార్చలేదు. మొదటి పాదంలోని పట్టుకోవడం–విడిచిపెట్టకపోవడం అనే రూపక సంబంధాన్ని కూడా కాపాడాం.
