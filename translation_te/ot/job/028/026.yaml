id: JOB.28.26
reference: Job 28:26
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: בַּ/עֲשֹׂת֣/וֹ לַ/מָּטָ֣ר חֹ֑ק וְ֝/דֶ֗רֶךְ לַ/חֲזִ֥יז קֹלֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/job/028/026.yaml
  text: when he made a decree for the rain[a], and a path for the thunderbolt of the storms,
translation:
  language: te
  text: 'వర్షానికి ఒక నియమాన్ని,

    ఉరుముల మెరుపుకు ఒక మార్గాన్ని[a]

    ఆయన ఏర్పరచినప్పుడు,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఉరుముల పిడుగుకు ఒక మార్గాన్ని.”
    reason: חֲזִיז may denote either a lightning flash or a thunderbolt; קֹלוֹת literally means sounds or voices and, in this weather setting, refers to thunder.
lexical_decisions:
- source_word: בַּעֲשׂוֹתוֹ
  choice: ఆయన ఏర్పరచినప్పుడు
  rationale: בְּ with the infinitive construct and suffix has temporal force. The Telugu finite temporal form is natural and preserves “when he made/established.”
- source_word: לַמָּטָר
  choice: వర్షానికి
  rationale: מָטָר denotes rain. The dative construction naturally expresses that the regulation is appointed for rain.
- source_word: חֹק
  choice: ఒక నియమాన్ని
  rationale: חֹק is something prescribed or fixed. “నియమం” conveys an established ordering without narrowing the image exclusively to either a legal decree or a physical boundary.
- source_word: וְדֶרֶךְ
  choice: ఒక మార్గాన్ని
  rationale: דֶּרֶךְ means way or path; “మార్గం” preserves the poetic picture of an appointed course.
- source_word: לַחֲזִיז
  choice: మెరుపుకు
  rationale: חֲזִיז denotes a lightning flash or thunderbolt. “మెరుపు” keeps the meteorological image while avoiding an unnecessary choice between lightning and a striking thunderbolt.
- source_word: קֹלוֹת
  choice: ఉరుముల
  rationale: Though literally “sounds/voices,” קוֹלוֹת in this weather context naturally refers to peals of thunder. “ఉరుముల” preserves the plural and the compact Hebrew construction.
theological_decisions:
- issue: Cosmic order as established by God
  choice: The verse depicts God as establishing a rule for rain and a path for the thunder-associated lightning.
  alternative: Expand the wording to state God's providential control over all natural forces.
  rationale: The translation preserves the verse’s portrayal of divine ordering without importing systematic theological claims beyond the Hebrew.
translation_notes:
  register: Modern standard Telugu with dignified poetic lineation. “నియమం” is broadly understandable and retains the sense of an appointed cosmic order. The compact phrase “ఉరుముల మెరుపు” intentionally preserves the source text’s compressed and somewhat ambiguous poetic relationship between lightning and thunder.
