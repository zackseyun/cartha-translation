  source_fidelity: 'The Telugu accurately reflects the temporal Hebrew construction בַּעֲשׂוֹתוֹ (''when he made/established''), followed by the two coordinated objects: a fixed prescription for rain and a path for the lightning/thunder phenomenon. ''నియమం'' suitably conveys חֹק as an appointed rule, and ''ఉరుముల మెరుపు'' retains the compact, poetic relationship expressed by חֲזִיז קֹלוֹת without over-resolving it.'
