  text: וְֽ֭/הַ/חָכְמָה מֵ/אַ֣יִן תִּמָּצֵ֑א וְ/אֵ֥י זֶ֝ה מְק֣וֹם בִּינָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/028/012.yaml
  text: But where can wisdom be found[a], and where is the place of understanding?
translation:
  language: te
  text: అయితే జ్ఞానం ఎక్కడి నుండి దొరుకుతుంది[a]? వివేకం ఉండే స్థలం ఎక్కడ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “జ్ఞానం ఎక్కడి నుండి దొరుకుతుంది?”
    reason: మూలంలోని מֵאַיִן జ్ఞానం లభించే స్థలంతో పాటు దాని మూలాన్ని కూడా ప్రశ్నిస్తుందని తెలియజేయడానికి.
lexical_decisions:
- source_word: וְהַחָכְמָה
  choice: అయితే జ్ఞానం
  rationale: ముందటి గనుల వర్ణన నుండి జ్ఞానాన్ని గురించిన ప్రధాన ప్రశ్నకు వచ్చే భావమలుపును וְ సూచిస్తోంది. అందువల్ల సహజమైన ఆధునిక తెలుగులో ‘అయితే’ అని అనువదించాం; הַחָכְמָהను భావవాచక నామంగా ‘జ్ఞానం’ అని ఇచ్చాం.
- source_word: מֵאַיִן
  choice: ఎక్కడి నుండి
  rationale: ఈ పదం కేవలం స్థలాన్ని మాత్రమే కాక మూలాన్ని కూడా అడిగే ‘ఎక్కడి నుండి?’ అనే భావాన్ని స్పష్టంగా కలిగి ఉంది; ఆ మూలభావాన్ని ప్రధాన పాఠ్యంలో నిలిపాం.
- source_word: תִּמָּצֵא
  choice: దొరుకుతుంది
  rationale: מצא నిఫాల్ అసంపూర్ణ రూపం ‘కనబడుట/దొరుకుట’ అనే అర్థం ఇస్తుంది. ప్రశ్నార్థక సందర్భంలో తెలుగు వర్తమాన-సామర్థ్య భావంతో ‘దొరుకుతుంది?’ సహజంగా ఉంది.
- source_word: וְאֵי זֶה מְקוֹם
  choice: ఉండే స్థలం ఎక్కడ
  rationale: אֵי זֶה מְקוֹם అనే హెబ్రీ ప్రయోగాన్ని పదశః ‘ఈ స్థలం ఎక్కడ’ అని కాక, తెలుగులో సహజమైన ప్రశ్నారూపంగా ఇచ్చాం. సమాంతర పాదాల అనుసంధానం తెలుగులో విరామచిహ్నం ద్వారా స్పష్టమవుతున్నందున וְను ప్రత్యేకంగా ‘మరియు’ అని పెట్టలేదు.
- source_word: בִּינָה
  choice: వివేకం
  rationale: בִּינָה అంటే గ్రహింపు, విచక్షణ, వివేకం. חָכְמָהకు భిన్నమైనప్పటికీ దానితో సమాంతరంగా నిలిచే జ్ఞానసాహిత్య పదంగా ‘వివేకం’ సరిపోతుంది.
