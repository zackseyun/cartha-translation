  text: Abaddon and Death say[a], ‘With our ears we have heard a report of it.’
translation:
  language: te
  text: 'అబద్దోను మరియు మరణం ఇలా అంటాయి[a]: “దాని గురించిన వార్తను మా చెవులతో విన్నాము.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా “నాశనం మరియు మరణం ఇలా అన్నాయి: ‘దాని గురించిన వదంతిని మేము విన్నాము.’”'
    reason: אֲבַדּוֹןను ‘అబద్దోను’ అనే పేరుగా లేదా ‘నాశనం’ అనే భావార్థంతో అనువదించవచ్చు. אָמְרוּను గతకాలంగా కూడా ఇవ్వవచ్చు; שִׁמְעָהּకు ‘వార్త,’ ‘వినికిడి,’ లేదా ‘వదంతి’ అనే అర్థాలు ఉండవచ్చు.
lexical_decisions:
- source_word: אֲבַדּוֹן
  choice: అబద్దోను
  rationale: ‘నాశనం’ అనే భావార్థానికి బదులు హెబ్రీ పదాన్ని పేరుగా లిప్యంతరీకరించడం ద్వారా, మరణంతో పాటు మాట్లాడే శక్తి లేదా లోకంగా చేసిన కవితాత్మక వ్యక్తీకరణను నిలుపుతుంది.
- source_word: וָמָוֶת
  choice: మరణం
  rationale: అబద్దోనుతో కలిసి మాట్లాడుతున్నదిగా వ్యక్తీకరించబడింది; తెలుగు వాక్య నిర్మాణంలో సంధిని విరామచిహ్నంతో సహజంగా వ్యక్తపరిచాం.
- source_word: אָמְרוּ
  choice: ఇలా అంటాయి
  rationale: రూపపరంగా సంపూర్ణ క్రియ అయినా, కవిత్వ సందర్భంలోని సజీవమైన లేదా సాధారణ వర్తమాన భావాన్ని తెలుగు వర్తమాన కాలంతో అందిస్తుంది. రెండు నపుంసక ఏకవచన నామాలను కలిపి చెప్పినందున బహువచన క్రియ వాడబడింది.
- source_word: בְּאָזְנֵינוּ
  choice: మా చెవులతో
  rationale: నేరుగా వినడాన్ని సూచించే హెబ్రీ నుడికారాన్ని సహజమైన తెలుగులో సాధ్యమైనంత దగ్గరగా నిలుపుతుంది.
- source_word: שָׁמַעְנוּ
  choice: మేము ... విన్నది
  rationale: వారు స్వయంగా చూసి లేదా కలిగి తెలుసుకోకుండా, వినికిడి ద్వారా మాత్రమే తెలుసుకున్నారనే భావాన్ని సహజ తెలుగు వాక్య నిర్మాణంలో తెలియజేస్తుంది.
- source_word: שִׁמְעָהּ
  choice: దాని గురించి ... వదంతి
  rationale: ఈ నామవాచకానికి ‘వార్త, వినికిడి, వదంతి’ అనే అర్థపరిధి ఉంది. ఇక్కడ జ్ఞానం గురించి పరోక్షంగా విన్న విషయాన్ని ‘వదంతి’ స్పష్టంగా తెలియజేస్తుంది; స్త్రీలింగ ప్రత్యయం సందర్భంలోని జ్ఞానాన్ని సూచిస్తుంది.
theological_decisions:
- issue: అబద్దోను, మరణం వ్యక్తులుగా మాట్లాడడం
  choice: రెండింటినీ కవితాత్మకంగా మాట్లాడే శక్తులు లేదా లోకాలుగా వ్యక్తీకరించడం
  alternative: ‘నాశనం మరియు మరణం’ అని భావవాచక నామాలుగా అనువదించడం
  rationale: మూలపాఠం వాటిని మాట్లాడేవిగా, చెవులతో వినేవిగా చిత్రిస్తుంది. పేరును లిప్యంతరీకరించడం ఈ వ్యక్తీకరణను నిలుపుతుంది; అయితే వాటి స్వరూపం గురించి పాఠం చెప్పేదానికంటే ఎక్కువగా నిర్ధారించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కవితాత్మక గౌరవాన్ని కాపాడుతూ సాధారణ పాఠకులకు అర్థమయ్యే పదజాలం. ‘అబద్దోను’ లిప్యంతరీకరణకు వివరణాత్మక ప్రత్యామ్నాయం పాదసూచికలో ఇవ్వబడింది.
