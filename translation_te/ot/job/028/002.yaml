translation:
  language: te
  text: 'ఇనుము మట్టిలోనుండి తీయబడుతుంది;

    రాతిలోనుండి రాగి[a] కరిగించబడుతుంది.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కంచు.” హీబ్రూ పదం రాగిని లేదా కంచును సూచించవచ్చు. ఇక్కడ గనుల తవ్వకం, ఖనిజం గల రాతినుండి లోహాన్ని వెలికితీయడం ప్రస్తావించబడుతున్నందున “రాగి”కి ప్రాధాన్యం ఇవ్వబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּרְזֶל
  choice: ఇనుము
  rationale: బైబిలు హీబ్రూలో ఈ నామవాచకానికి సాధారణ అర్థం ఇనుము.
- source_word: מֵעָפָר
  choice: మట్టిలోనుండి
  rationale: עָפָר అంటే దుమ్ము, వదులైన మట్టి లేదా నేల. ఖనిజాన్ని నేలనుండి తీయడమనే సందర్భంలో సహజమైన ఆధునిక తెలుగు కోసం ‘మట్టి’ ఎంచుకోబడింది; ఇది హీబ్రూ భౌతిక చిత్రాన్ని నిలుపుతుంది.
- source_word: יֻקָּח
  choice: తీయబడుతుంది
  rationale: לקח ధాతువు యొక్క కర్మణి రూపానికి అక్షరార్థంగా ‘తీసుకోబడుతుంది.’ గనితవ్వకాన్ని అతిగా వ్యాఖ్యానించకుండా సందర్భానుకూలంగా ‘తీయబడుతుంది’ అని అనువదించబడింది.
- source_word: וְאֶבֶן
  choice: రాతిలోనుండి
  rationale: אֶבֶן అంటే రాయి. రెండవ పాదంలో ఖనిజం గల రాతినుండి లోహం పొందబడుతుందనే సంబంధాన్ని తెలుగులో స్పష్టంగా, సహజంగా చూపేందుకు ‘రాతిలోనుండి’ వాడబడింది.
- source_word: יָצוּק
  choice: కరిగించి తీయబడుతుంది
  rationale: יצק అంటే పోయడం, అచ్చుపోయడం లేదా సందర్భానుసారం కరిగించి లోహాన్ని వెలికితీయడం. గనులు, ఖనిజ శిల సందర్భంలో లోహాన్ని ధాతువునుండి కరిగించి తీయడమే ఉద్దేశం.
- source_word: נְחוּשָׁה
  choice: రాగి
  rationale: ఈ పదం రాగి లేదా కంచును సూచించగలదు. రాతి ధాతువునుండి లోహాన్ని పొందే సందర్భం కావడంతో మిశ్రలోహమైన కంచుకన్నా ‘రాగి’ సముచితం; ప్రత్యామ్నాయం పాదటిప్పణిలో నిలుపబడింది.
