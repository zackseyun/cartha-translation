  text: קֵ֤ץ שָׂ֤ם לַ/חֹ֗שֶׁךְ וּֽ/לְ/כָל תַּ֭כְלִית ה֣וּא חוֹקֵ֑ר אֶ֖בֶן אֹ֣פֶל וְ/צַלְמָֽוֶת׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/028/003.yaml
  text: He sets an end to darkness[a], and he searches out every limit, the stones of gloom and deep darkness.
translation:
  language: te
  text: అతడు చీకటికి అంతం పెడతాడు; ప్రతి హద్దువరకు కటిక చీకటి మరియు గాఢాంధకారపు రాయిని అన్వేషిస్తాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, మరింత సంప్రదాయబద్ధంగా: “కటిక చీకటి మరియు మరణఛాయ యొక్క రాయి.”'
    reason: צַלְמָוֶתకు సంప్రదాయమైన ‘మరణఛాయ’ అర్థాన్ని, అలాగే אֶבֶן అనే ఏకవచన ‘రాయి’ని చూపించే ప్రత్యామ్నాయ పఠనం.
lexical_decisions:
- source_word: קֵץ שָׂם לַחֹשֶׁךְ
  choice: చీకటికి అంతం పెడతాడు
  rationale: קֵץ ‘అంతం/హద్దు’ అనే అర్థాన్నిస్తుంది; שָׂם తో కలిసి చీకటికి ఒక అంతం నిర్ణయించడాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: וּלְכָל תַּכְלִית הוּא חוֹקֵר
  choice: ప్రతి అంచునూ శోధించి
  rationale: תַּכְלִית ఇక్కడ నైతిక ‘పరిపూర్ణత’ కాకుండా చివరి అంచు లేదా సుదూర హద్దును సూచిస్తుంది; חקר క్షుణ్ణంగా వెదకడం లేదా అన్వేషించడం. గనికారుడు ఏ అంచునూ వదలకుండా వెదికే భావాన్ని ఈ రూపం సహజంగా అందిస్తుంది.
- source_word: אֶבֶן
  choice: రాళ్లను
  rationale: ఏకవచన రూపం సందర్భంలో సమష్టివాచకంగా ఉండవచ్చు. గనుల సందర్భంలో తెలుగు బహువచనం సహజంగా ఉండి భూగర్భ రాళ్లను సూచిస్తుంది.
- source_word: אֹפֶל
  choice: కటిక చీకటి
  rationale: אֹפֶל దట్టమైన, మసకతో కూడిన చీకటిని సూచిస్తుంది. ముందున్న חֹשֶׁךְ నుండి కొంత భేదాన్ని నిలుపుతూ తీవ్రతను తెలియజేస్తుంది.
- source_word: וְצַלְמָוֶת
  choice: గాఢాంధకారం
  rationale: యోబులో ఈ పదం తరచుగా అత్యంత దట్టమైన చీకటిని సూచిస్తుంది. భూగర్భ గని సందర్భానికి ‘గాఢాంధకారం’ సరిపోతుంది; సంప్రదాయ ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
theological_decisions:
- issue: צַלְמָוֶת పదం యొక్క అర్థం
  choice: గాఢాంధకారం
  alternative: మరణఛాయ
  rationale: ఈ గనుల సందర్భం భూగర్భంలోని దట్టమైన చీకటిని ముందుకు తెస్తుంది; అయినా పదానికి ఉన్న సంప్రదాయ ‘మరణఛాయ’ అర్థాన్ని తొలగించకుండా పాదసూచికలో భద్రపరచాం.
- issue: אֶבֶן אֹפֶל וְצַלְמָוֶת నిర్మాణం
  choice: కటిక చీకటి మరియు గాఢాంధకారం కమ్మిన రాళ్లు
  alternative: కటిక చీకటి మరియు మరణఛాయ యొక్క రాయి
  rationale: హీబ్రూ నిర్మాణం సంక్షిప్తంగా, కొంత అస్పష్టంగా ఉంది. ప్రధాన పాఠం గనుల సందర్భానుసారంగా రాళ్లను చీకటి కమ్మినవిగా సహజ తెలుగులో చూపుతుంది; మరింత పదశః సంప్రదాయ పఠనాన్ని పాదసూచిక నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టమైనదిగా, అయితే కావ్యాత్మక గాంభీర్యాన్ని నిలుపుతూ రూపొందించబడింది. ప్రధాన వాక్యంలో వరుస క్రియలను సహజంగా అనుసంధానించేందుకు ‘శోధించి ... కనుగొంటాడు’ వాడబడింది.
