translation:
  language: te
  text: 'దాని రాళ్లు నీలమణి[a] లభించే చోటులు;

    దానిలో బంగారు ధూళి ఉంది.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘లాపిస్ లాజులీ’; ఈ హీబ్రూ పదం ప్రాచీన కాలంలో ఖచ్చితంగా ఏ రత్నాన్ని సూచించిందో తెలియదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְקוֹם
  choice: దొరికే చోటు
  rationale: ఈ గనుల తవ్వకం సందర్భంలో מְקוֹם అనేది ‘స్థలం’ అనే స్పష్టమైన భావాన్ని ఇస్తుంది. ‘దొరికే చోటు’ అనే ప్రయోగం రాళ్లలో ఆ రత్నం లభిస్తుందనే కవితాత్మక భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: סַפִּיר
  choice: నీలమణి
  rationale: సాంప్రదాయకంగా ‘నీలమణి’ అని అనువదిస్తారు. అయితే ప్రాచీన కాలంలో ఈ పదం సూచించిన ఖనిజం లాపిస్ లాజులీ అయి ఉండవచ్చు కాబట్టి అనిశ్చితిని పాదసూచికలో ఉంచాం.
- source_word: אֲבָנֶיהָ
  choice: దాని రాళ్లు
  rationale: స్త్రీలింగ ఏకవచన ప్రత్యయం ముందు ప్రస్తావించిన భూమిని సూచిస్తుంది. ఆధునిక తెలుగులో భూమిని ఇక్కడ వ్యక్తీకరించకుండా ‘దాని’ అనడం సహజం; אֲבָנִים యొక్క సాధారణ అర్థమైన ‘రాళ్లు’ను నిలిపాం.
- source_word: וְעַפְרֹת
  choice: బంగారు ధూళి
  rationale: עפרות అనేది ధూళి లేదా వదులైన మట్టిని సూచించే బహువచన రూపం. గనుల సందర్భంలో ‘బంగారు ధూళి’ మూలంలోని సూక్ష్మ కణాల చిత్రణను సంక్షిప్తంగా నిలుపుతుంది; ‘ఖనిజం’ వంటి వివరణాత్మక పదాన్ని చేర్చలేదు.
- source_word: זָהָב
  choice: బంగారు
  rationale: విలువైన లోహమైన బంగారాన్ని సూచించే ప్రామాణిక తెలుగు పదం; ‘ధూళి’తో సహజంగా కలవడానికి విశేషణ రూపం వాడాం.
- source_word: לוֹ
  choice: దానిలో ... ఉంది
  rationale: అక్షరార్థంగా ‘దానికి’ అనే స్వామ్య/సంబంధ నిర్మాణం. ఈ సందర్భంలో ఆ భూమిలో బంగారు ధూళి ఉందనే భావాన్ని సహజ తెలుగులో ‘దానిలో ... ఉంది’ అని వ్యక్తం చేశాం.
