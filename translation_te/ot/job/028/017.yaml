  text: Gold and glass cannot equal it[b][a], nor can its exchange be an article of fine gold.
translation:
  language: te
  text: 'బంగారమూ గాజూ[a] దానికి సాటిరావు;

    మేలిమి బంగారు వస్తువును[b] దానికి మార్పిడిగా ఇవ్వలేరు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘స్ఫటికం.’ హీబ్రూ పదం పారదర్శకమైన విలాస పదార్థాన్ని సూచించవచ్చు; ఇక్కడ ‘గాజు’ అనే అర్థానికే ప్రాధాన్యం ఇవ్వబడింది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘మేలిమి బంగారు పాత్రను.’ హీబ్రూ పదం ప్రత్యేకంగా పాత్రను కూడా సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַרְכֶנָּה
  choice: దానికి సాటిరావు
  rationale: ערך ఇక్కడ పోల్చడం లేదా సమాన విలువగా ఎంచడం అనే భావాన్ని ఇస్తుంది. స్త్రీలింగ ఏకవచన ప్రత్యయం సందర్భంలోని జ్ఞానాన్ని సూచిస్తుంది; తెలుగులో సహజంగా ‘దానికి’ అని అనువదించబడింది.
- source_word: זָהָב
  choice: బంగారం
  rationale: ఈ విలువైన లోహానికి సాధారణమైన, స్పష్టమైన తెలుగు పదం.
- source_word: זְכוֹכִית
  choice: గాజు
  rationale: ప్రాచీన కాలంలో విలాసవంతమైన పారదర్శక పదార్థాన్ని సూచించే ఈ పదానికి ‘గాజు’ అత్యంత సంభావ్యమైన అర్థం; ‘స్ఫటికం’ ప్రత్యామ్నాయంగా పాదసూచికలో ఉంచబడింది.
- source_word: תְמוּרָתָהּ
  choice: దానికి బదులు
  rationale: תמורה లోని మార్పిడి లేదా ప్రతిగా ఇచ్చే వస్తువు అనే వాణిజ్య రూపకాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: כְּלִי פָז
  choice: మేలిమి బంగారు వస్తువు
  rationale: כְּלִי అనేది పాత్ర, పనిముట్టు లేదా వస్తువు వంటి విస్తృత అర్థం గల పదం; సందర్భంలో ‘వస్తువు’ ఆ విస్తృతిని కాపాడుతుంది. פָז శుద్ధి చేసిన మేలిమి బంగారాన్ని సూచిస్తుంది.
