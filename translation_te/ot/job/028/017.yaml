translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన జ్ఞానసాహిత్య శైలిని అనుసరించాం. మొదటి పాదంలోని పోలికను, రెండవ పాదంలోని మార్పిడి రూపకాన్ని విడివిడిగా నిలిపి, జ్ఞానం యొక్క అసమాన విలువను అతిశయ వివరణ లేకుండా వ్యక్తం చేశాం.
