  text: Fine gold cannot be given in exchange for it[c][b][a], nor can silver be weighed as its price.
translation:
  language: te
  text: మేలిమి బంగారాన్ని దానికి బదులుగా ఇవ్వలేరు; వెండిని దాని ధరగా తూచి ఇవ్వలేరు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అంటే, దాని ధర చెల్లించడానికి వెండిని తూచి ఇవ్వడం సాధ్యం కాదు; చుట్టుపక్కల వచనాల సందర్భంలో ‘దాని’ అనేది జ్ఞానాన్ని సూచిస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: יֻתַּן
  choice: ఇవ్వలేరు
  rationale: నిషేధంతో కూడిన ఈ నిష్క్రియారూపం, జ్ఞానానికి మారుగా బంగారాన్ని చెల్లించడం అసాధ్యమని సూచిస్తుంది.
- source_word: סְגוֹר
  choice: మేలిమి బంగారం
  rationale: ఈ కవితాత్మక విలువ పోలికలో సాధారణ బంగారం కాకుండా శుద్ధిచేసిన, ఉత్తమమైన బంగారాన్ని సూచిస్తుంది.
- source_word: תַּחְתֶּיהָ
  choice: దానికి బదులుగా
  rationale: ఇక్కడ స్థలార్థం కాదు; ముందటి సందర్భంలోని జ్ఞానానికి ప్రత్యామ్నాయంగా లేదా మారుగా అనే అర్థం.
- source_word: יִשָּׁקֵל
  choice: తూచి ఇవ్వలేరు
  rationale: వెండిని నాణేలుగా కాక బరువుతో చెల్లించే ప్రాచీన ఆచారాన్ని స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: כֶּסֶף
  choice: వెండి
  rationale: సందర్భంలో ధనంగా ఉపయోగించినప్పటికీ, మూలంలోని స్పష్టమైన లోహ చిత్రణను నిలుపుతుంది.
- source_word: מְחִירָהּ
  choice: దాని ధరగా
  rationale: జ్ఞానానికి కొనుగోలు విలువ నిర్ణయించలేమనే వాణిజ్య రూపకాన్ని సంక్షిప్తంగా తెలియజేస్తుంది.
