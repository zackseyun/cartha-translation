translation:
  language: te
  text: 'అది ప్రతి జీవి కళ్లకు మరుగై ఉంది;

    ఆకాశంలోని పక్షులకు కూడా అది దాగి ఉంది.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנֶעֶלְמָה
  choice: అది … మరుగై ఉంది
  rationale: עלם ధాతువు నిఫల్ రూపంలోని నిష్క్రియాత్మక/ఫలిత స్థితిని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది. సందర్భంలో స్త్రీలింగ కర్త అయిన జ్ఞానాన్ని ‘అది’ సూచిస్తుంది.
- source_word: מֵעֵינֵי
  choice: కళ్లకు
  rationale: హీబ్రూ ‘కళ్ల నుండి’ అనే రూపకాన్ని తెలుగులో అర్థవంతంగా ‘కళ్లకు మరుగై’ అనే సహజ ప్రయోగంతో నిలుపుతుంది.
- source_word: כָל חָי
  choice: సజీవులందరి
  rationale: ‘బతికియున్న ప్రతి దాని/ప్రాణి’ అనే విశాలమైన భావాన్నీ, כָל యొక్క సమగ్ర పరిధినీ సంక్షిప్తంగా తెలియజేస్తుంది; దీన్ని కేవలం మనుషులకు పరిమితం చేయదు.
- source_word: וּמֵעוֹף הַשָּׁמַיִם
  choice: ఆకాశమందలి పక్షులకు కూడా
  rationale: עוֹףను సందర్భానుసారంగా ‘పక్షులు’గా అనువదించి, הַשָּׁמַיִםను గౌరవప్రదమైన కవితా శైలిలో ‘ఆకాశమందలి’గా ఇచ్చాం. וּ సంధి సమాంతర భావాన్ని తెలుగులో ‘కూడా’తో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: נִסְתָּרָה
  choice: దాగి ఉంది
  rationale: סתר నిఫల్ రూపంలోని దాగియున్న స్థితిని తెలియజేస్తూ, మొదటి పాదంలోని ‘మరుగై ఉంది’తో అర్థసమాంతరతను నిలుపుతుంది; అనవసర పదపునరుక్తిని నివారిస్తుంది.
theological_decisions:
- issue: స్త్రీలింగ క్రియారూపాలకు సూచిత కర్త
  choice: సందర్భంలోని ‘జ్ఞానం’ను సూచించే ‘అది’ను వాడటం
  alternative: కర్తను మళ్లీ ‘జ్ఞానం’ అని స్పష్టంగా పేర్కొనటం
  rationale: హీబ్రూలో కర్త ముందరి వచనం నుండి కొనసాగుతుంది. ‘అది’ అనేది ఆ అనుసంధానాన్ని కాపాడుతుంది; మూలంలో లేని పునరుక్తి లేదా అదనపు వ్యాఖ్యానాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, యోబు కవిత్వానికి తగిన గౌరవప్రదమైన సరళ శైలి వాడబడింది. రెండు పాదాల భావసమాంతరతను ‘మరుగై ఉంది / దాగి ఉంది’తో నిలిపాం.
