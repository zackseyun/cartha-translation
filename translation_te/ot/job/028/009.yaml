  text: בַּֽ֭/חַלָּמִישׁ שָׁלַ֣ח יָד֑/וֹ הָפַ֖ךְ מִ/שֹּׁ֣רֶשׁ הָרִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/job/028/009.yaml
  text: He puts his hand to the flint[b][a]; he overturns mountains from their roots.
translation:
  language: te
  text: అతడు చెకుముకి రాతిపై చేయి వేస్తాడు[a]; పర్వతాలను వాటి మూలాలనుండి తలకిందులు చేస్తాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “చెకుముకి రాతికి చేయి వేస్తాడు,” “చెకుముకి రాతిలోకి చేయి వేస్తాడు,” లేదా “కఠిన రాతిపై.” హీబ్రూ మాట గనిపనిలో కఠిన రాతిపై లేదా రాతిలో చేయి వేసి పనిచేయడాన్ని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “పర్వతాల మూలం నుండి.” హీబ్రూలో “మూలం” ఏకవచనంలో ఉన్నా, పర్వతాలతో సంబంధంలో అది సమష్టి భావాన్ని కలిగి ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחַלָּמִישׁ
  choice: చెకుముకి రాతిపై
  rationale: חַלָּמִישׁ కఠినమైన రాతిని లేదా చెకుముకి రాతిని సూచిస్తుంది. ב ఉపసర్గ ఇక్కడ గనిపనిలో ఆ రాతిపై చేయి పెట్టి పనిచేయడాన్ని తెలియజేస్తుంది; మూలంలోని భావసంభావ్యతను పాదటిప్పణిలో ఉంచాం.
- source_word: שָׁלַח יָדוֹ
  choice: చేయి వేస్తాడు
  rationale: ఈ నుడికారం ఏదో ఒక పనికి చేయి పెట్టడం లేదా దానిపై చేయి చాపి పనిచేయడం అనే క్రియాశీల భావాన్ని ఇస్తుంది. ఆధునిక తెలుగులో ‘చేయి వేస్తాడు’ సహజంగా, సంక్షిప్తంగా ఉంది.
- source_word: הָפַךְ
  choice: పెకలిస్తాడు
  rationale: הפך తిప్పివేయడం, కూలదోయడం, తలకిందులు చేయడం వంటి భావాలు కలిగి ఉంది. పర్వతాలను మూలాలనుండి కదిలించే గనిపని సందర్భంలో ‘పెకలిస్తాడు’ ఆ తీవ్రమైన విఘటనను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: מִשֹּׁרֶשׁ
  choice: వాటి మూలాలనుండి
  rationale: హీబ్రూలో ‘మూలం’ ఏకవచనంలో ఉన్నా, ‘పర్వతాలు’తో కలసి సమష్టి భావంలో ఉంది. తెలుగులో ‘వాటి మూలాలనుండి’ సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: הָרִים
  choice: పర్వతాలను
  rationale: הָרִים కు నేరమైన, సందర్భోచితమైన తెలుగు సమానం ‘పర్వతాలు’; కర్మవిభక్తితో ‘పర్వతాలను’ వాడాం.
