  register: ఆధునిక ప్రామాణిక తెలుగులో, కవితాత్మక గంభీరతను నిలుపుతూ సాధారణ పాఠకులకు అర్థమయ్యే పదజాలం వాడాం. గనిపని దృశ్యాన్ని స్పష్టంగా ఉంచి, హీబ్రూ ఉపసర్గలోని భావసంభావ్యతను పాదటిప్పణిలో సంరక్షించాం.
