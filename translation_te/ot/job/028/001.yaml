base_translation:
  language: en
  yaml_path: translation/ot/job/028/001.yaml
  text: Surely there is a mine for silver[b][a], and a place where they refine gold.
translation:
  language: te
  text: నిశ్చయంగా వెండికి ఒక గని ఉంది[a]; బంగారాన్ని శుద్ధిచేసే స్థలమూ ఉంది[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వెండికి ఒక మూలస్థానం ఉంది.” ఇక్కడి హీబ్రూ పదం మూలం లేదా ఉద్భవస్థలాన్ని సూచించగలదు; తవ్వకాల సందర్భం వల్ల ప్రధాన పాఠంలో “గని” అని అనువదించబడింది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “బంగారాన్ని కరిగించే స్థలం.” హీబ్రూ క్రియ విలువైన లోహాన్ని కరిగించడం లేదా శుద్ధిచేయడాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: నిశ్చయార్థాన్ని వాక్య నిర్మాణంలో అంతర్లీనంగా వ్యక్తపరచడం
  rationale: ఇక్కడ כִּי కారణార్థకమైన ‘ఎందుకంటే’ కంటే కవితాత్మక ప్రకటనను బలపరుస్తుంది. తెలుగులో ‘నిశ్చయంగా’ అని విడిగా చేర్చడం కృత్రిమంగా అనిపించవచ్చు; దృఢమైన ప్రకటన ద్వారా ఆ బలం నిలుస్తుంది.
- source_word: יֵשׁ
  choice: ఉంది
  rationale: అస్తిత్వాన్ని తెలిపే సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: לַכֶּסֶף מוֹצָא
  choice: వెండికి ఒక గని
  rationale: מוֹצָא మూలం లేదా ఉద్భవస్థలాన్ని సూచిస్తుంది; యోబు 28లోని తవ్వకాల సందర్భంలో ‘గని’ స్పష్టమైన సమానార్థకం. అయితే పదం స్వతహాగా సాంకేతిక గనిపదం కానందున ప్రత్యామ్నాయం పాదసూచికలో ఉంచబడింది.
- source_word: וּמָקוֹם לַזָּהָב
  choice: బంగారాన్ని ... స్థలం కూడా
  rationale: מָקוֹם యొక్క సాధారణ అర్థమైన ‘స్థలం’ను నిలుపుతూ, తెలుగు వాక్యప్రవాహానికి అనుగుణంగా బంగారాన్ని క్రియతో అనుసంధానించాం.
- source_word: יָזֹקּוּ
  choice: శుద్ధిచేసే
  rationale: Qal 3 పురుష బహువచన రూపంలోని అనిర్దిష్ట మానవ కర్తను తెలుగులో సహజమైన సంబంధార్థక క్రియారూపంతో వ్యక్తపరచాం. లోహాన్ని కరిగించి శుద్ధి చేయడం లేదా శుద్ధీకరించడం అనే భావవ్యాప్తిని ఇది అందుబాటులో ఉంచుతుంది.
