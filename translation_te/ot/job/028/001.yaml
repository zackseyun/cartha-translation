translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గంభీరమైన కవితాత్మక ప్రకటన. ‘వెండి’, ‘బంగారం’, ‘గని’, ‘శుద్ధిచేయు’ వంటి సాధారణంగా అర్థమయ్యే పదాలు వాడబడ్డాయి. ప్రతి పాదసూచిక సూచిక ప్రధాన పాఠంలో పొందుపరచబడింది.
