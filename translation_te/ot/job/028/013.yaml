  text: Man does not know its worth[b][a], and it is not found in the land of the living.
translation:
  language: te
  text: మర్త్యుడు దాని విలువను[a] ఎరుగడు[b]; సజీవుల దేశంలో అది దొరకదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘దాని మదింపును,’ ‘దాని ధరను.’ హీబ్రూ పదం మదింపు లేదా విలువను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘మర్త్యుడు’ అని అనువదించిన హీబ్రూ పదం ఏకవచనంలో ఉండి, నశ్వరులైన మానవులను ప్రతినిధిగా సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱנוֹשׁ
  choice: మర్త్యుడు
  rationale: ఈ ఏకవచన పదం మానవుణ్ణి అతని నశ్వరతతో సూచిస్తూ ప్రతినిధిగా వాడబడింది. ‘మర్త్యుడు’ ఆ భావాన్ని, ఏకవచన రూపాన్ని నిలుపుతుంది.
- source_word: יָדַע
  choice: ఎరుగడు
  rationale: ఇక్కడ qatal రూపం సందర్భంలో సాధారణ సత్యాన్ని తెలుపుతుంది. ‘ఎరుగడు’ అసమర్థత అనే అదనపు భావాన్ని చేర్చకుండా సహజమైన వర్తమానార్థాన్ని ఇస్తుంది.
- source_word: עֶרְכָּהּ
  choice: దాని విలువను
  rationale: ערך మూలం నుంచి వచ్చిన ఈ నామవాచకం మదింపు, విలువ లేదా ధరను సూచించగలదు. ‘విలువ’ వాణిజ్య భావానికే పరిమితం కాకుండా విస్తృతమైన అర్థాన్ని నిలుపుతుంది.
- source_word: תִּמָּצֵא
  choice: అది దొరకదు
  rationale: నిఫ్అల్ రూపంలోని నిషేధాన్ని సహజ తెలుగు నిష్క్రియార్థంలో వ్యక్తం చేస్తుంది; ‘దొరకడం అసాధ్యం’ అనే స్పష్టంగా లేని సామర్థ్య భావాన్ని చేర్చదు.
- source_word: בְּאֶרֶץ הַחַיִּים
  choice: సజీవుల దేశంలో
  rationale: ఇది భూమిమీద జీవించేవారి లోకాన్ని సూచించే హీబ్రూ కావ్యప్రయోగం. ‘సజీవుల దేశం’ ఆ రూపకాన్ని, కవితా గాంభీర్యాన్ని నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ యోబు గ్రంథపు కవితా గాంభీర్యాన్ని నిలిపే శైలి. ‘ఎరుగడు’ మరియు ‘సజీవుల దేశం’ స్వల్ప కావ్యరంగును ఇస్తాయి; వాక్యం సాధారణ పాఠకునికి స్పష్టంగానే ఉంటుంది.
