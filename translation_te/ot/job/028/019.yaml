translation:
  language: te
  text: కూషు దేశపు పుష్యరాగం కూడా దానికి సాటిరాదు[a]; స్వచ్ఛమైన బంగారంతో దానికి వెల కట్టలేరు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘కూషు దేశపు క్రైసోలైట్’ లేదా ‘కూషు దేశపు పెరిడాట్’; פִּטְדָה సూచించే రత్నం ఏదో ఖచ్చితంగా తెలియదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַרְכֶנָּה
  choice: దానికి సాటిరాదు
  rationale: ערך ఇక్కడ విలువ లేదా స్థాయిలో సరిపోలడాన్ని సూచిస్తుంది. సందర్భంలోని జ్ఞానాన్ని సూచించే స్త్రీలింగ ఏకవచన ప్రత్యయాన్ని తెలుగులో ‘దానికి’ అని సహజంగా వ్యక్తం చేశాం.
- source_word: פִּטְדַת כּוּשׁ
  choice: కూషు దేశపు పుష్యరాగం
  rationale: פִּטְדָה ఒక విలువైన రాయిని సూచించినా, అది ఏ ఖనిజమో ఖచ్చితంగా తెలియదు. సంప్రదాయబద్ధంగా గుర్తించదగిన ‘పుష్యరాగం’ను ప్రధాన పాఠంలో ఉంచి, ఇతర సాధ్య గుర్తింపులను పాదటిప్పణిలో ఇచ్చాం. כּוּשׁ అనే స్థలనామాన్ని ‘కూషు’గా లిప్యంతరీకరించాం.
- source_word: בְּכֶתֶם טָהוֹר
  choice: స్వచ్ఛమైన బంగారంతో
  rationale: כֶּתֶם శ్రేష్ఠమైన లేదా శుద్ధి చేసిన బంగారాన్ని, טָהוֹר స్వచ్ఛతను సూచిస్తాయి. בְּ ను విలువ అంచనా వేసే ప్రమాణం లేదా సాధనంగా గ్రహించి ‘బంగారంతో’ అని అనువదించాం.
- source_word: תְסֻלֶּה
  choice: దాని విలువను అంచనా వేయలేరు
  rationale: ఈ సందర్భంలో క్రియ కేవలం భౌతికంగా తూచడంకన్నా ధర లేదా విలువ నిర్ణయించడాన్ని సూచిస్తుంది. జ్ఞానానికి వెల కట్టలేమనే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కవితా వాక్య నిర్మాణాన్ని వాడాం. రెండు అర్ధపాదాల సమాంతరతను నిలుపుతూ, రత్నపు ఖచ్చిత గుర్తింపులోని అనిశ్చితిని పాదటిప్పణిలో భద్రపరిచాం.
