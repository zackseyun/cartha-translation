source:
  edition: WLC
  text: לֹֽא תְ֭סֻלֶּה בְּ/כֶ֣תֶם אוֹפִ֑יר בְּ/שֹׁ֖הַם יָקָ֣ר וְ/סַפִּֽיר־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/028/016.yaml
  text: It cannot be valued with the gold of Ophir[b][a], with precious onyx or sapphire.
translation:
  language: te
  text: ఓఫీరు మేలిమి బంగారంతోనూ, విలువైన ఓనిక్సుతో[a] నీలమణితోనూ[b] దానిని వెలకట్టలేరు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘వైడూర్యం’; ఈ హీబ్రూ రత్నపదం ఏ ఖనిజాన్ని సూచిస్తుందో ఖచ్చితంగా తెలియదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘లాజవర్దం’; ఆధునిక ఖనిజ వర్గీకరణకు బదులు ప్రాచీన వర్గీకరణను పరిగణిస్తే ఈ అర్థం ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְסֻלֶּה
  choice: వెలకట్టలేరు
  rationale: ఈ సందర్భంలో పూయల్ రూపం వస్తువుల విలువను అంచనా వేయడం లేదా వాటితో సమానంగా ధర నిర్ణయించడం అనే భావాన్ని ఇస్తుంది. ‘వెలకట్టలేరు’ ఆధునిక తెలుగులో సహజంగా ఉండి ఆర్థిక, తులనాత్మక బలాన్ని నిలుపుతుంది.
- source_word: בְּכֶתֶם אוֹפִיר
  choice: ఓఫీరు మేలిమి బంగారంతో
  rationale: כֶּתֶם శుద్ధమైన లేదా మేలిమి బంగారాన్ని సూచిస్తుంది; אוֹפִיר దాని ప్రసిద్ధ మూలప్రాంతాన్ని సూచిస్తుంది. సాధన లేదా విలువ ప్రమాణాన్ని తెలిపే בְּను తెలుగులో ‘తో’గా సహజంగా వ్యక్తం చేశాం.
- source_word: שֹׁהַם
  choice: గోమేధికం
  rationale: హీబ్రూ రత్నపదం యొక్క ఖచ్చితమైన ఖనిజ గుర్తింపు అనిశ్చితం. సంప్రదాయంగా విస్తృతంగా వాడే ‘గోమేధికం’ను ప్రధాన పాఠ్యంలో ఉంచి ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: יָקָר
  choice: విలువైన
  rationale: ఈ విశేషణం שֹׁהַםను విశేషించి దాని అధిక విలువను తెలియజేస్తుంది. ‘విలువైన’ సాధారణ పాఠకులకు స్పష్టంగా, రత్నాల సందర్భంలో సహజంగా ఉంది.
- source_word: סַפִּיר
  choice: నీలమణి
  rationale: సంప్రదాయ అనువాదమైన ‘నీలమణి’ని ప్రధాన పాఠ్యంలో ఉంచాం. ప్రాచీన ఖనిజ వర్గీకరణ ప్రకారం ఇది లాజవర్దాన్ని సూచించి ఉండవచ్చనే అవకాశాన్ని పాదసూచికలో నిలిపాం.
