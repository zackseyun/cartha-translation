translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, కవితాత్మక గౌరవాన్ని కాపాడుతూ సాధారణ పాఠకులకు అర్థమయ్యే పదజాలం వాడబడింది. ‘తోగానీ … తో గానీ’ నిర్మాణం విలువైన పదార్థాల వరుసను సహజంగా కలుపుతుంది; మూలంలోని రత్నాల గుర్తింపుకు సంబంధించిన అనిశ్చితి పాదసూచికల్లో నిలుపబడింది.
