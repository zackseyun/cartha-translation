source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר לָֽ/אָדָ֗ם הֵ֤ן יִרְאַ֣ת אֲ֭דֹנָ/י הִ֣יא חָכְמָ֑ה וְ/ס֖וּר מֵ/רָ֣ע בִּינָֽה׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/job/028/028.yaml
  text: And he said to man[a], ‘Behold, the fear of the Lord—that is wisdom, and to turn away from evil is understanding.’
translation:
  language: te
  text: 'ఆయన మనిషితో[a] ఇలా అన్నాడు: “ఇదిగో, ప్రభువుకు భయపడటమే జ్ఞానం; చెడు నుండి తొలగిపోవడమే వివేకం.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మానవజాతితో.” హీబ్రూ పదం ఏకవచనంలో “మనిషి” అని ఉన్నప్పటికీ, ఇక్కడ అది సమస్త మానవాళిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: ఆయన ... ఇలా అన్నాడు
  rationale: కథన సంబంధాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతూ, పలికిన ప్రకటనను పరిచయం చేస్తుంది.
- source_word: לָאָדָם
  choice: మనిషితో
  rationale: ఆదామ్ ఇక్కడ ఒక నిర్దిష్ట పురుషుణ్ణి కాక, మానవజాతికి ప్రాతినిధ్యం వహించే ఏకవచన పదం. మూలరూపాన్ని ప్రధాన పాఠ్యంలో ఉంచి, సమగ్రార్థాన్ని పాదటిప్పణిలో తెలిపాం.
- source_word: הֵן
  choice: ఇదిగో
  rationale: శ్రద్ధను ఆకర్షించే హీబ్రూ ఉద్ఘాటనను, జ్ఞానోక్తికి తగిన గంభీరతతో నిలుపుతుంది.
- source_word: יִרְאַת אֲדֹנָי
  choice: ప్రభువుపట్ల భయభక్తులు
  rationale: יִרְאָה లోని భయం, విస్మయం, భక్తిపూర్వక గౌరవం అనే భావపరిధిని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; కేవలం ‘భక్తి’గా మృదూకరించదు.
- source_word: אֲדֹנָי
  choice: ప్రభువు
  rationale: మూలంలోని దైవ బిరుదుకు ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన రూపం.
- source_word: הִיא
  choice: కలిగి ఉండడమే
  rationale: ‘అదే జ్ఞానం’ అనే గుర్తింపు/సమీకరణ బలాన్ని తెలుగు ‘-డమే’ నిర్మాణంతో స్పష్టంగా నిలుపుతుంది.
- source_word: חָכְמָה
  choice: జ్ఞానం
  rationale: జ్ఞానసాహిత్యంలో ఈ పదానికి స్థిరమైన, సహజమైన తెలుగు సమానం.
- source_word: וְסוּר
  choice: విడిచిపెట్టడమే
  rationale: చెడు నుండి ఉద్దేశపూర్వకంగా తొలగిపోవడం, దానిని త్యజించడం అనే నైతిక చర్యను సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: מֵרָע
  choice: చెడును
  rationale: సందర్భంలో రָע నైతిక చెడును సూచిస్తుంది; విపత్తు లేదా హాని అనే అర్థాన్ని ఇక్కడ తీసుకోలేదు.
- source_word: בִּינָה
  choice: వివేకం
  rationale: జ్ఞానం పక్కన భేదగ్రహణం, నైతిక అవగాహన అనే భావాన్ని సహజంగా అందిస్తుంది.
theological_decisions:
- issue: సామాన్యార్థక אָדָם అనువాదం
  choice: మనిషి
  alternative: మానవజాతి
  rationale: హీబ్రూలో పదం వ్యాకరణపరంగా ఏకవచనమైనప్పటికీ ఇక్కడ సమస్త మానవాళికి ప్రాతినిధ్యం వహిస్తుంది. మూలంలోని ఏకవచన రూపాన్ని పాఠ్యంలో నిలిపి, విస్తృత సూచనను పాదటిప్పణిలో స్పష్టం చేశాం.
- issue: יִרְאַת אֲדֹנָי యొక్క భావపరిధి
  choice: ప్రభువుపట్ల భయభక్తులు
  alternative: ప్రభువుకు భయపడడం
  rationale: మూలపదంలోని నిజమైన భయాంశాన్ని తొలగించకుండా, అది భక్తిపూర్వక గౌరవం మరియు విస్మయంతో కూడినదని తెలుగులో తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; జ్ఞానసాహిత్యానికి తగిన గంభీరతను ఉంచుతూ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్యనిర్మాణం. సమాంతర నిర్మాణాన్ని రెండు చోట్ల ‘-డమే’ ద్వారా నిలిపాం.
