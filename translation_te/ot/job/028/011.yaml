  text: מִ֭/בְּכִי נְהָר֣וֹת חִבֵּ֑שׁ וְ֝/תַעֲלֻמָ֗הּ יֹ֣צִא אֽוֹר׃פ
base_translation:
  language: en
  yaml_path: translation/ot/job/028/011.yaml
  text: He dams up the sources of the rivers[a], and brings what is hidden out to the light.
translation:
  language: te
  text: 'అతడు నదుల ఊటలను[a] కట్టడి చేస్తాడు;

    దాగి ఉన్నదాన్ని వెలుగులోకి తెస్తాడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నదుల నుంచి ఊరే నీటిని”; ఇక్కడి హీబ్రూ పదం అరుదైనది. అది ‘ఏడుపు’ లేదా చుక్కలుగా కారే నీరు అనే భావాన్ని కూడా ధ్వనింపజేయవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבְּכִי
  choice: ఊటలను
  rationale: ఈ అరుదైన పదం అక్షరార్థంగా ‘ఏడుపు’ లేదా చుక్కలుగా కారడాన్ని సూచించవచ్చు. అయితే గనుల తవ్వకంలో నీటిని అదుపు చేసే సందర్భంలో, నదులకు నీరు వెలువడే లేదా ఊరే చోట్లను సూచించే ‘ఊటలు’ సహజమైన భావాన్ని ఇస్తుంది; పదంలోని అనిశ్చితిని పాదసూచికలో నిలిపాం.
- source_word: נְהָרוֹת
  choice: నదుల
  rationale: బహువచన రూపానికి సాధారణ అర్థం ‘నదులు’; భూగర్భ జలప్రవాహాల సందర్భానికీ ఇది సరిపోతుంది.
- source_word: חִבֵּשׁ
  choice: కట్టడి చేస్తాడు
  rationale: మూల క్రియకు కట్టడం, నిరోధించడం అనే భావాలున్నాయి. నీటి ప్రవాహాన్ని ఆపే సందర్భంలో ‘కట్టడి చేస్తాడు’ మూల రూపకాన్ని, కార్యఫలితాన్ని రెండింటినీ సహజంగా తెలియజేస్తుంది.
- source_word: תַּעֲלֻמָהּ
  choice: దాగి ఉన్నదాన్ని
  rationale: ఈ పదం దాచబడిన దానిని సూచిస్తుంది. దాన్ని ప్రత్యేకంగా ఖనిజం లేదా నిధి అని పరిమితం చేయకుండా, మూలంలోని విస్తృత భావాన్ని నిలిపింది.
- source_word: יֹצִא
  choice: తెస్తాడు
  rationale: హిఫీల్ రూపం ‘బయటికి వచ్చేలా చేయడం’ అనే కారణార్థాన్ని ఇస్తుంది; ‘వెలుగులోకి తెస్తాడు’ తెలుగులో సహజంగా, ఖచ్చితంగా ఉంది.
- source_word: אוֹר
  choice: వెలుగులోకి
  rationale: దాగి ఉండటానికి వ్యతిరేకంగా బయటపడటాన్ని తెలిపే ‘వెలుగులోకి తేవడం’ అనే సహజ తెలుగు ప్రయోగాన్ని వాడాం.
