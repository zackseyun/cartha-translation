  yaml_path: translation/ot/job/028/010.yaml
  text: He cuts channels through the rocks[b][a], and his eye sees every precious thing.
translation:
  language: te
  text: అతడు బండల్లో కాలువలను త్రవ్వుతాడు[a]; అతని కన్ను విలువైన ప్రతి దానిని చూస్తుంది[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘నీటిప్రవాహాలు’ లేదా ‘వాగులు’; ఇక్కడ గనుల సందర్భంలో బండల్లో త్రవ్విన కాలువలు లేదా మార్గాలు ఉద్దేశింపబడి ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘అమూల్యమైన ప్రతి దానిని’ లేదా ‘విలువైన ఖనిజాన్ని’.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּצּוּרוֹת
  choice: బండల్లో
  rationale: צוּר కఠినమైన బండను లేదా శిలను సూచిస్తుంది. ב ఉపసర్గను ఇక్కడ స్థలార్థకంగా తీసుకోవడం సహజం; గనుల సందర్భంలో బండల మధ్య లేదా లోపల పని చేయడాన్ని ఇది తెలియజేస్తుంది.
- source_word: יְאֹרִים
  choice: కాలువలను
  rationale: יְאֹר నీటిప్రవాహం, కాలువ లేదా వాగును సూచించగలదు. గనుల దృశ్యంలో బండల్లో చీల్చి చేసిన మార్గాలు లేదా నీటి కాలువలు ఉద్దేశింపబడవచ్చు; ‘కాలువలు’ మూలపదపు నీటిమార్గ భావాన్ని కాపాడుతుంది.
- source_word: בִּקֵּעַ
  choice: చీల్చుతాడు
  rationale: בקע అంటే చీల్చడం, పగులగొట్టడం లేదా తెరవడం. ‘చీల్చుతాడు’ కఠినమైన బండను తెరిచి మార్గం చేయడంలోని బలాన్ని నిలుపుతుంది.
- source_word: יְקָר
  choice: అమూల్యమైన దానిని
  rationale: יְקָר విలువైనది లేదా అమూల్యమైనది అనే విస్తృత భావం కలిగి ఉంది. మూలంలో ఖనిజం లేదా రత్నం అని స్పష్టంగా పరిమితం చేయనందున సాధారణ పదబంధాన్ని ఉంచాం.
- source_word: רָאֲתָה עֵינוֹ
  choice: అతని కన్ను ... చూస్తుంది
  rationale: హీబ్రూలో అక్షరార్థంగా ‘అతని కన్ను చూసింది’ అని ఉంది. కవితలో సాగుతున్న సాధారణ వర్ణనకు తెలుగు వర్తమాన కాలం సహజంగా ఉండగా, ‘అతని కన్ను’ అనే సజీవ చిత్రణను నిలిపాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కవితా వాక్యంగా రూపొందించాం. ‘కాలువలు’ అనే మూలపదపు సంభావ్య నీటిమార్గ భావాన్ని ప్రధాన పాఠంలో ఉంచి, గనిమార్గం అనే సందర్భార్థాన్ని పాదటిప్పణిలో తెలిపాం. అన్ని పాదటిప్పణి గుర్తులు ప్రధాన పాఠంలో ఉన్నాయి.
