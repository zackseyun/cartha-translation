  text: פָּ֤רַץ נַ֨חַל מֵֽ/עִם גָּ֗ר הַֽ/נִּשְׁכָּחִ֥ים מִנִּי רָ֑גֶל דַּ֖לּוּ מֵ/אֱנ֣וֹשׁ נָֽעוּ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/028/004.yaml
  text: He breaks open a shaft away from where people dwell[a]; forgotten by the foot, they hang far from men[c][b], they sway.
translation:
  language: te
  text: 'జనావాసానికి దూరంగా అతడు గని బిలాన్ని తవ్వి తెరుస్తాడు[a];


    పాదసంచారానికి మరుగునపడి[b],


    మనుషులకు దూరంగా వారు వేలాడుతూ[c] ఊగుతారు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నివసించేవానికి దూరంగా అతడు ఒక ప్రవాహమార్గాన్ని/వాగుబాటను చీల్చి తెరుస్తాడు.” ఇక్కడి נַחַל, גָּר పదాల వల్ల హీబ్రూ వాక్యం క్లిష్టంగా ఉంది. ఈ అధ్యాయంలోని గనుల సందర్భాన్ని బట్టి చాలామంది נַחַל‌ను గని బిలం లేదా సొరంగంగా అర్థం చేసుకుంటారు.
    reason: alternative_reading
  - marker: b
    text: అక్షరార్థంగా, “పాదం నుండి” లేదా “పాదం చేత మరచిపోయినవారు.” పైభాగంలో నడిచేవారి దృష్టికి లేదా చేరువకు అందని చోటును, లేదా అక్కడి పనివారిని ఇది సూచిస్తున్నట్లు కనిపిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: లేదా, “వారు దిగవేయబడతారు,” లేదా “వ్రేలాడుతారు.” ఈ హీబ్రూ క్రియ తాళ్లతో గనిలోకి దిగవేయబడిన లేదా వేలాడుతున్న పనివారిని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּרַץ
  choice: తవ్వి తెరుస్తాడు
  rationale: ఈ క్రియకు ‘బద్దలుకొట్టి తెరవడం, చొచ్చుకొని పోవడం’ అనే భావం ఉంది. గనుల సందర్భంలో భూమిని తవ్వి మార్గం తెరవడాన్ని సహజమైన తెలుగులో ఇది తెలియజేస్తుంది.
- source_word: נַחַל
  choice: గని బిలం
  rationale: సాధారణంగా ఈ పదం ‘వాగు, లోయ, ప్రవాహమార్గం’ అని అర్థమవుతుంది; అయితే యోబు 28లోని గనుల సందర్భంలో తవ్విన గని మార్గం లేదా బిలం అనే భావం సాధ్యమైనది. మూలంలోని క్లిష్టతను పాదసూచికలో నిలిపాం.
- source_word: מֵעִם גָּר
  choice: జనావాసానికి దూరంగా
  rationale: מֵעִם వేరుపడిన దూరాన్ని సూచిస్తుంది; גָּר నివసించేవాడు లేదా పరదేశిగా నివసించేవాడు అనే భావం ఇవ్వగలదు. మొత్తం పదబంధాన్ని సహజంగా స్థలసూచక భావంతో అనువదించాం.
- source_word: הַנִּשְׁכָּחִים מִנִּי רָגֶל
  choice: నడిచే పాదానికి మరచిపోయినవారై
  rationale: ‘పాదం నుండి/చేత మరచిపోయినవారు’ అనే మూలంలోని సంక్షిప్తమైన, అసాధారణ రూపకాన్ని సాధ్యమైనంత దగ్గరగా నిలిపి, సాధారణ పాదసంచారానికి అందని స్థితిని సూచిస్తుంది.
- source_word: דַּלּוּ
  choice: వేలాడుతూ
  rationale: ఈ రూపం దిగవేయబడడం, వ్రేలాడడం లేదా వేలాడడం అనే భావాలను ఇవ్వగలదు. గనిలో తాళ్లపై ఉన్న పనివారి దృశ్యానికి ‘వేలాడుతూ’ సరిపోతుంది; ఇతర సాధ్యతలను పాదసూచికలో ఇచ్చాం.
- source_word: מֵאֱנוֹשׁ
  choice: మనుషులకు దూరంగా
  rationale: אֱנוֹשׁ మర్త్య మానవుణ్ణి లేదా మానవజాతిని సూచిస్తుంది. ఇక్కడ గని పనివారు మానవ సమాజం నుండి దూరంగా ఉన్నారని సహజంగా తెలియజేస్తుంది.
- source_word: נָעוּ
  choice: ఊగుతారు
  rationale: ఈ క్రియ కదలడం, అటూ ఇటూ ఊగడం, తూలడం అనే భావం ఇస్తుంది. వేలాడుతున్న గని పనివారి చిత్రంలో ‘ఊగుతారు’ స్పష్టంగా, సజీవంగా ఉంటుంది.
