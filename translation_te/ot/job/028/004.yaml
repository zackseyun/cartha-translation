translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గంభీరమైనప్పటికీ సాధారణ పాఠకునికి అర్థమయ్యే శైలిని వాడాం. మూలంలోని ఏకవచన క్రియ నుండి బహువచన గని పనివారి వర్ణనకు వచ్చే మార్పును అలాగే ఉంచాం. క్లిష్టమైన గనుల రూపకానికి స్పష్టతనిచ్చినా, నిశ్చయంగా తేల్చలేని పదార్థాలను పాదసూచికల్లో భద్రపరిచాం.
