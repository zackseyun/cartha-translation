translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కవితాత్మక శైలి. హీబ్రూ సమాంతర నిర్మాణాన్ని నిలుపుతూ, సాధారణ పాఠకుడికి సులభంగా అర్థమయ్యే పదాలను ఎంచుకున్నాం.
