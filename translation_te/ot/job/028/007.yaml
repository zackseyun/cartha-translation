  text: נָ֭תִיב לֹֽא יְדָ֣ע/וֹ עָ֑יִט וְ/לֹ֥א שְׁ֝זָפַ֗תּ/וּ עֵ֣ין אַיָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/028/007.yaml
  text: A path no bird of prey knows[a], and the eye of the falcon has not seen it.
translation:
  language: te
  text: ఏ వేటపక్షికీ ఆ దారి తెలియదు; గద్ద కన్ను కూడా దాన్ని చూడలేదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పదం ఒక వేటపక్షిని సూచిస్తుంది; దాని ఖచ్చితమైన జాతి అనిశ్చితం. దీనిని ‘డేగ’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָתִיב
  choice: దారి
  rationale: ఈ పదం బాట లేదా మార్గాన్ని సూచిస్తుంది. భూమి లోపల దాగి ఉన్న మార్గం అనే కవితాత్మక సందర్భంలో ‘దారి’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: לֹא יְדָעוֹ
  choice: ఏ వేటపక్షికీ ఆ దారి తెలియదు
  rationale: ידע క్రియతో ఉన్న తృతీయ పురుష ఏకవచన ప్రత్యయం ‘దాన్ని తెలుసుకోలేదు’ అనే భావాన్ని ఇస్తుంది. తెలుగులో ‘ఏ...కీ ... తెలియదు’ అనే నిర్మాణం ప్రతికూల సార్వత్రిక భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: עָיִט
  choice: వేటపక్షి
  rationale: ఇది ఒక నిర్దిష్ట జాతిని కాకుండా మాంసాహార వేటపక్షిని సాధారణంగా సూచిస్తుంది; అందువల్ల ‘వేటపక్షి’ మూలంలోని సాధారణ భావాన్ని కాపాడుతుంది.
- source_word: וְלֹא שְׁזָפַתּוּ
  choice: కూడా దాన్ని చూడలేదు
  rationale: שׁזף ఇక్కడ చూడడం లేదా కంటపడడం అనే భావాన్ని ఇస్తుంది. ‘చూడలేదు’ ఆధునిక తెలుగులో స్పష్టంగా ఉండి, ముందరి ‘తెలియదు’తో ఉన్న సమాంతరతను నిలుపుతుంది.
- source_word: עֵין
  choice: కన్ను
  rationale: మూలంలోని ‘కన్ను’ అనే ప్రత్యక్ష కవితాత్మక రూపకాన్ని అలాగే నిలుపుతుంది.
- source_word: אַיָּה
  choice: గద్ద
  rationale: ఈ హీబ్రూ పదం ఒక వేటపక్షిని సూచిస్తుంది; ఖచ్చితమైన జాతి అనిశ్చితం. ‘గద్ద’ సాధారణ తెలుగు పాఠకుడికి సుపరిచితమైన వేటపక్షి పదం; జాతి అనిశ్చితిని పాదసూచికలో తెలియజేస్తాం.
