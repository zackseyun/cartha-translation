id: JOB.28.23
reference: Job 28:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אֱ֭לֹהִים הֵבִ֣ין דַּרְכָּ֑/הּ וְ֝/ה֗וּא יָדַ֥ע אֶת מְקוֹמָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/028/023.yaml
  text: God understands its way[a], and he knows its place.
translation:
  language: te
  text: దేవుడు దాని మార్గాన్ని గ్రహిస్తాడు[a]; ఆయనకు దాని స్థలం తెలుసు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘దాని మార్గం … దాని స్థలం’ అని అనువదించిన చోట హీబ్రూలో స్త్రీలింగ రూపాలు ఉన్నాయి; అవి ‘జ్ఞానం’ను సూచిస్తున్నాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהִים
  choice: దేవుడు
  rationale: రూపంలో బహువచనమైనప్పటికీ, ఇక్కడ ఏకవచన క్రియలతో ఉన్నందున ఏకైక దేవుణ్ణి సూచిస్తుంది.
- source_word: הֵבִין
  choice: గ్రహిస్తాడు
  rationale: בין హిఫీల్ రూపం అర్థం చేసుకోవడం లేదా వివేచించడం అనే భావాన్ని ఇస్తుంది. ఈ కావ్యంలోని నిత్యసత్యానికి తెలుగు వర్తమాన కాలం సహజంగా సరిపోతుంది.
- source_word: דַּרְכָּהּ
  choice: దాని మార్గాన్ని
  rationale: స్త్రీలింగ ప్రత్యయం సందర్భంలోని ‘జ్ఞానం’ను సూచిస్తుంది. తెలుగులో ‘జ్ఞానం’ నపుంసకలింగ నామం కావడంతో ‘దాని’ సహజం; ‘మార్గం’ అనే రూపకం అలాగే నిలిచింది.
- source_word: וְהוּא
  choice: ఆయనకు
  rationale: స్వతంత్ర సర్వనామం దేవునిపై దృష్టిని ఉంచుతుంది. తెలుగులో రెండవ వాక్యభాగంలో ‘ఆయనకు తెలుసు’ అని చెప్పడం సహజంగా ఆ దృష్టిని నిలుపుతుంది.
- source_word: יָדַע
  choice: తెలుసు
  rationale: ఈ క్రియ జ్ఞానాన్ని సూచిస్తుంది. దేవుని శాశ్వత జ్ఞానాన్ని తెలిపే సాధారణ సత్యంగా తెలుగులో ‘తెలుసు’ సహజం.
- source_word: אֶת מְקוֹמָהּ
  choice: దాని స్థలం
  rationale: מקום అంటే స్థలం లేదా ఉనికి గల చోటు. ప్రత్యయం సందర్భంలోని జ్ఞానాన్ని సూచిస్తున్నందున ‘దాని స్థలం’ సంక్షిప్తంగా, మూలానికి దగ్గరగా ఉంటుంది.
theological_decisions:
- issue: ‘దాని మార్గం’, ‘దాని స్థలం’లోని ప్రత్యయాలు ఎవరిని సూచిస్తున్నాయి?
  choice: అవి సందర్భంలో వ్యక్తీకరించబడిన జ్ఞానాన్ని సూచిస్తాయి; తెలుగులో ‘జ్ఞానం’కు సహజమైన నపుంసకలింగ సర్వనామం వాడబడింది.
  alternative: ‘ఆమె మార్గం ... ఆమె స్థలం’ అని స్త్రీలింగ సర్వనామాలతో అనువదించడం.
  rationale: హీబ్రూలో חָכְמָה (‘జ్ఞానం’) వ్యాకరణపరంగా స్త్రీలింగం; ఈ అధ్యాయంలో అది వ్యక్తీకరించబడింది. అయితే తెలుగులో ‘జ్ఞానం’ను ‘ఆమె’ అని పిలవడం మూలంలోని వ్యాకరణ లింగాన్ని మించి వ్యక్తిత్వ భావాన్ని బలపరచవచ్చు. అందువల్ల ప్రధాన పాఠంలో సహజమైన ‘దాని’ని ఉంచి, మూలంలోని స్త్రీలింగ రూపాన్ని పాదసూచికలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కావ్యశైలిని అనుసరించాం. ‘గ్రహిస్తాడు’ మరియు ‘తెలుసు’ అనే సమాంతర పదాలు మూలంలోని అవగాహన–జ్ఞానం భేదాన్ని నిలుపుతాయి.
