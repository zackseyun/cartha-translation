  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּי ה֭וּא לִ/קְצוֹת הָ/אָ֣רֶץ יַבִּ֑יט תַּ֖חַת כָּל הַ/שָּׁמַ֣יִם יִרְאֶֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/028/024.yaml
  text: For he looks to the ends of the earth[b][a]; he sees under all the heavens.
translation:
  language: te
  text: ఎందుకంటే ఆయన భూమి కొనల వరకు చూస్తాడు; ఆకాశాలన్నిటి కింద ఆయన చూస్తాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందరి వాక్యంలో దేవుని జ్ఞానం గురించి చెప్పినదానికి కారణాన్ని పరిచయం చేస్తుంది.
- source_word: הוּא
  choice: ఆయన
  rationale: సందర్భంలో ఈ సర్వనామం దేవుణ్ణి సూచిస్తుంది; గౌరవప్రదమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: לִקְצוֹת הָאָרֶץ
  choice: భూమి అంచుల వరకు
  rationale: భూమి యొక్క అత్యంత దూరమైన హద్దులను సూచించే మూలభాషా చిత్రాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: יַבִּיט
  choice: చూస్తాడు
  rationale: హిఫీల్ రూపంలోని దృష్టిని మళ్లించి చూడడం అనే భావాన్ని సందర్భానికి తగిన సరళమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: תַּחַת כָּל הַשָּׁמַיִם
  choice: ఆకాశాలన్నిటి కింద ఉన్నదంతా
  rationale: תַּחַת యొక్క స్థలార్థాన్నీ, שָׁמַיִם యొక్క బహువచన రూపాన్నీ కాపాడుతూ, క్రియకు సహజమైన తెలుగు కర్మను అందిస్తుంది.
- source_word: יִרְאֶה
  choice: ఆయన చూస్తాడు
  rationale: ראה యొక్క సాధారణ అర్థమైన ‘చూడు’ను నిలుపుతూ మొదటి పాదంతో సమాంతరతను కాపాడుతుంది.
theological_decisions:
- issue: הוּא అనే సర్వనామం ఎవరిని సూచిస్తుంది
  choice: దేవుణ్ణి సూచించే ‘ఆయన’
  alternative: సందర్భ నిర్దేశం లేని ‘అతడు’
  rationale: యోబు 28 తక్షణ సందర్భంలో జ్ఞానపు స్థానం తెలిసి సృష్టి అంతటినీ పరిశీలించేవాడు దేవుడే; ఇది సిద్ధాంతపరమైన చేర్పు కాక సందర్భం ద్వారా స్పష్టమైన గుర్తింపు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయినా కవితాత్మక సమాంతరత మరియు గౌరవప్రదమైన ధోరణి నిలుపబడ్డాయి. మూలంలోని ‘ఆకాశాలు’ బహువచనం అలాగే ఉంచబడింది.
