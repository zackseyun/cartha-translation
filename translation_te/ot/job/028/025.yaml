translation:
  language: te
  text: ఆయన గాలికి బరువు నిర్ణయించినప్పుడు[a], జలాలను కొలమానంతో కొలిచాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, ‘గాలికి బరువును ఇవ్వడానికి’ లేదా ‘గాలికి బరువును నిర్ణయించడానికి’ అని అనువదించవచ్చు. సందర్భంలో ఈ క్రియానామం కాలార్థాన్ని సూచిస్తున్నందున ప్రధాన పాఠంలో ‘నిర్ణయించినప్పుడు’ అని ఇచ్చాం.
    reason: lexical_alternative
  - marker: b
    text: ‘కొలమానంతో’ అనేది ‘కొలత ప్రకారం’ లేదా ‘నిర్ణీత పరిమాణంతో’ అని కూడా అర్థమవుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַעֲשׂוֹת
  choice: నిర్ణయించినప్పుడు
  rationale: ల ఉపసర్గతో ఉన్న క్రియానామం ముందున్న సందర్భంలో దేవుని సృష్టి-క్రమపరచే కార్యానికి కాలార్థాన్ని ఇస్తుంది. తెలుగులో ‘నిర్ణయించినప్పుడు’ సహజంగా ఉండి, బరువును నిర్దేశించే భావాన్ని తెలియజేస్తుంది.
- source_word: לָרוּחַ
  choice: గాలికి
  rationale: רוּחַ అనే పదానికి ఆత్మ, ఊపిరి అనే అర్థాలు కూడా ఉన్నా, ఇక్కడ జలాలతో ఉన్న సమాంతరత వల్ల ప్రకృతి సంబంధమైన ‘గాలి’ అర్థమే సందర్భోచితం.
- source_word: מִשְׁקָל
  choice: బరువును
  rationale: ఈ నామవాచకం బరువు లేదా తూకాన్ని సూచిస్తుంది. గాలికీ దేవుడు తగిన బరువును నిర్ణయించాడనే కొలతబద్ధమైన సృష్టి క్రమాన్ని ఇది నిలుపుతుంది.
- source_word: וּמַיִם
  choice: జలాలను
  rationale: మూలంలోని బహువచన రూపాన్ని, కవితాత్మక సమాంతరతను ‘జలాలు’ నిలుపుతుంది.
- source_word: תִּכֵּן
  choice: కొలిచాడు
  rationale: ఈ క్రియ ఖచ్చితంగా కొలవడం, తూచడం లేదా పరిమాణాన్ని నిర్ణయించడం అనే భావాన్ని కలిగిస్తుంది; ‘కొలిచాడు’ సమాంతర పాదంలోని బరువు చిత్రణతో సరిపోతుంది.
- source_word: בְּמִדָּה
  choice: కొలతతో
  rationale: ב ఉపసర్గతో కూడిన מִדָּה కొలమానం లేదా నిర్ణీత పరిమాణాన్ని సూచిస్తుంది. ‘కొలతతో’ మూలంలోని సాధనార్థాన్ని సంక్షిప్తంగా నిలుపుతుంది.
theological_decisions:
- issue: ముందటి వచనం నుంచి కర్త కొనసాగడం
  choice: అంతర్లీన కర్త దేవుడు అని భావించి ‘ఆయన’ అని వ్యక్తీకరించడం
  alternative: కర్తను పేర్కొనకుండా క్రియానామ నిర్మాణాన్ని మరింత యథాతథంగా ఉంచడం
  rationale: సందర్భంలో దేవుని కార్యమే కొనసాగుతోంది. తెలుగు వాక్య స్పష్టత కోసం ‘ఆయన’ను చేర్చడం సందర్భసిద్ధమైన కర్తను వ్యక్తం చేస్తుంది; కొత్త theological వాదనను జోడించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కవితాత్మక శైలి. ‘జలాలు’ మూలంలోని బహువచనాన్ని, జ్ఞానసాహిత్యపు ఉన్నత ధోరణిని నిలుపుతుంది; ‘కొలతతో కొలిచాడు’ అనే ఉద్దేశపూర్వక పదపునరుక్తి హీబ్రూ కొలత చిత్రణను ప్రతిబింబిస్తుంది.
