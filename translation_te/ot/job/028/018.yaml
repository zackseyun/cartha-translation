  yaml_path: translation/ot/job/028/018.yaml
  text: Coral and crystal are not worth mentioning, and the price of wisdom is above pearls.
translation:
  language: te
  text: 'పగడమూ స్ఫటికమూ ప్రస్తావించదగినవి కావు;

    జ్ఞానం ధర ముత్యాలకంటే ఎక్కువ.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רָאמוֹת
  choice: పగడం
  rationale: ఈ అరుదైన బహువచన నామానికి సందర్భానుకూలంగా ‘పగడాలు/పగడం’ అనే అర్థం సాధారణంగా స్వీకరించబడుతుంది; జ్ఞానంతో పోల్చబడే విలువైన వస్తువుల వరుసకు ఇది సరిపోతుంది.
- source_word: גָבִישׁ
  choice: స్ఫటికం
  rationale: ఈ అరుదైన పదం మంచు లేదా స్ఫటిక పదార్థాన్ని సూచించవచ్చు; విలువైన వస్తువుల సందర్భంలో ‘స్ఫటికం’ సహజమైన ఎంపిక.
- source_word: לֹא יִזָּכֵר
  choice: ప్రస్తావించదగినవి కావు
  rationale: అక్షరార్థంగా ‘జ్ఞాపకం చేయబడవు/ప్రస్తావించబడవు’; జ్ఞానంతో పోలిస్తే అవి లెక్కలోకే రావని భావాన్ని తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: מֶשֶׁךְ חָכְמָה
  choice: జ్ఞానం విలువ
  rationale: מֶשֶׁךְ అరుదైన పదం; ఇక్కడ జ్ఞానాన్ని సంపాదించడానికి చెల్లించాల్సిన ధర లేదా దాని విలువను సూచిస్తుంది. సందర్భంలో సహజత కోసం ‘విలువ’ ఎంచుకోబడింది.
- source_word: פְּנִינִים
  choice: ముత్యాలు
  rationale: ఈ పదానికి పగడాలు, ముత్యాలు లేదా ఇతర అమూల్య రత్నాలు అనే భిన్న వ్యాఖ్యానాలు ఉన్నాయి; ఆధునిక పాఠకులకు సుపరిచితమైన సాంప్రదాయ సమానార్థకంగా ‘ముత్యాలు’ నిలుపబడింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన, గంభీరమైన కవితా వాక్య నిర్మాణం వాడబడింది. మొదటి పాదంలో ఏకవచన సమూహార్థక నామాలు సహజ తెలుగు ప్రయోగంగా ఉంచబడ్డాయి; రెండో పాదం మూలంలోని విలువ-పోలికను నేరుగా నిలుపుతుంది.
