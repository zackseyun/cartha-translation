  text: Then he saw it and declared it; he established it[a], and also searched it out.
translation:
  language: te
  text: అప్పుడు ఆయన దానిని చూశాడు, దానిని ప్రకటించాడు[a]; దానిని స్థిరపరచాడు, దానిని కూడా పరిశోధించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘దానిని లెక్కించి,’ ‘దానిని వివరించి,’ లేదా ‘దానిని నిర్దేశించి.’ హీబ్రూ క్రియకు లెక్కించడం లేదా ప్రకటించడం అనే భావాలు ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: అప్పుడు
  rationale: కావ్య వర్ణనలోని క్రమాన్ని సహజంగా సూచించే కాలవాచక క్రియావిశేషణం.
- source_word: רָאָהּ
  choice: దానిని చూశాడు
  rationale: ראה అనే స్పష్టమైన క్రియను నిలుపుతూ, స్త్రీలింగ ప్రత్యయం ముందున్న జ్ఞానాన్ని సూచిస్తున్నదని తెలుపుతుంది.
- source_word: וַיְסַפְּרָהּ
  choice: దానిని ప్రకటించాడు
  rationale: ספר అనే క్రియకు లెక్కించడం, వివరించడం, ప్రకటించడం అనే అర్థాలు ఉన్నాయి; ఇక్కడ సందర్భానికి ‘ప్రకటించాడు’ సహజంగా సరిపోతుంది, కాగా ప్రత్యామ్నాయ అర్థాలను పాదటిప్పణి నిలుపుతుంది.
- source_word: הֱכִינָהּ
  choice: దానిని స్థిరపరచి
  rationale: כון హిఫీల్ రూపంలోని స్థాపించడం, స్థిరపరచడం అనే భావాన్ని తెలియజేస్తుంది; తెలుగు వాక్యప్రవాహం కోసం అసమాపక క్రియారూపం వాడబడింది.
- source_word: וְגַם
  choice: కూడా
  rationale: క్రియల క్రమంలో చివరి అంశాన్ని చేర్చే సంచయార్థక బలాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: חֲקָרָהּ
  choice: దానిని పరిశోధించాడు
  rationale: חקר లోని లోతుగా శోధించడం, పరీక్షించడం అనే భావాన్ని గౌరవప్రదమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: స్త్రీలింగ ప్రత్యయాల సూచితం
  choice: అన్ని స్త్రీలింగ ప్రత్యయాలు సమీప సందర్భంలోని ‘జ్ఞానం’ను సూచిస్తాయని తీసుకొని ‘దానిని’ అని అనువదించడం.
  alternative: ఆ ప్రత్యయాలు జ్ఞానం యొక్క కొలతను లేదా దాని క్రమబద్ధీకరణను మరింత అమూర్తంగా సూచిస్తాయని తీసుకోవచ్చు.
  rationale: ముందటి సందర్భం జ్ఞానాన్నే దేవుడు చూడడం, ప్రకటించడం, స్థిరపరచడం, పరిశోధించడం అనే క్రియలకు కర్మగా ఉంచుతుంది. ‘దానిని’ అనే రూపం అనవసరమైన వ్యక్తీకరణను చేర్చకుండా మూలంలోని సూచనను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కావ్య గాంభీర్యాన్ని నిలుపుతూ సాధారణ పాఠకులకు అర్థమయ్యే పదజాలం. ప్రతి క్రియకు ఒకే కర్మను పునరుక్తి చేయడం ద్వారా హీబ్రూ స్త్రీలింగ ప్రత్యయాల క్రమం స్పష్టంగా నిలుపబడింది.
