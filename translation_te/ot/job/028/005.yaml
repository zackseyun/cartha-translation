source:
  edition: WLC
  text: אֶ֗רֶץ מִמֶּ֥/נָּה יֵֽצֵא לָ֑חֶם וְ֝/תַחְתֶּ֗י/הָ נֶהְפַּ֥ךְ כְּמוֹ אֵֽשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/028/005.yaml
  text: As for the earth[a], from it bread comes out, but underneath it is turned up as by fire.
translation:
  language: te
  text: భూమి నుండి రొట్టె వస్తుంది, కానీ దాని కింద భాగం అగ్నిలా తారుమారవుతుంది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దాని కింద భాగం అగ్నిచేత తారుమారు చేయబడినట్టు ఉంటుంది.” హీబ్రూలోని పోలికను “అగ్నిలా” అని గానీ, “అగ్నిచేత జరిగినట్టు” అని గానీ అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶרֶץ
  choice: భూమి
  rationale: ఉపరితలంలో ఆహారం పండడానికీ, భూమి అడుగున గనులు తవ్వడానికీ మధ్య ఉన్న వ్యత్యాసాన్ని సూచించేందుకు నిర్దిష్ట దేశం అనే అర్థం గల ‘నేల/దేశం’ కంటే విస్తృతమైన ‘భూమి’ సరిపోతుంది.
- source_word: מִמֶּנָּה
  choice: దానిలోనుంచి
  rationale: స్త్రీలింగ ఏకవచన ప్రత్యయం ‘భూమి’ని తిరిగి సూచిస్తుంది; తెలుగులో జడవస్తువుకు సహజమైన సర్వనామ రూపాన్ని వాడాం.
- source_word: יֵצֵא
  choice: పుడుతుంది
  rationale: మూల క్రియకు ‘బయటికి వస్తుంది’ అనే ప్రత్యక్ష అర్థం ఉన్నా, భూమి నుంచి ఆహారం లభించే వ్యవసాయ చిత్రణలో ‘పుడుతుంది’ సహజంగా ఉండి ఆ భావాన్ని నిలుపుతుంది.
- source_word: לָחֶם
  choice: ఆహారం
  rationale: לֶחֶם అక్షరార్థంగా ‘రొట్టె’ అయినప్పటికీ, ఇక్కడ భూమి నుంచి నేరుగా రొట్టె బయటకు రావడం కాదు; జీవనోపాధికి కావలసిన పంట/ఆహారం పుడుతుందనే విస్తృత సాధారణ ప్రయోగం. అందువల్ల ఆధునిక తెలుగులో ‘ఆహారం’ సందర్భార్థాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: וְתַחְתֶּיהָ
  choice: కానీ దాని అడుగుభాగం
  rationale: వావ్‌ను ఉపరితలపు ఫలప్రదతకూ భూగర్భపు కలవరపాటుకూ మధ్య సందర్భసిద్ధమైన వ్యతిరేకతగా ‘కానీ’ అని అనువదించాం; ‘అడుగుభాగం’ భూమి కింద ఉన్న ప్రాంతాన్ని సహజంగా సూచిస్తుంది.
- source_word: נֶהְפַּךְ
  choice: తలకిందులు చేయబడుతుంది
  rationale: హఫక్ నిఫాల్ రూపం తిరగబడడం లేదా తారుమారు చేయబడడాన్ని సూచిస్తుంది. గనుల తవ్వకం వల్ల భూగర్భం కలవరపరచబడే దృశ్యాన్ని ఈ కర్మణి రూపం నిలుపుతుంది.
- source_word: כְּמוֹ אֵשׁ
  choice: అగ్నిచేత అన్నట్టు
  rationale: హీబ్రూ పోలిక అగ్నివలె కనిపించడాన్నీ, అగ్నిచేత జరిగినట్టుగా మార్పు చెందడాన్నీ సూచించగలదు. ప్రధాన పాఠం రెండవ సాధ్యతను సహజ తెలుగులో ఇస్తూ, ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలిని వాడాం. ఉపరితలపు ఆహారోత్పత్తికీ భూగర్భ తవ్వకాలకూ మధ్య వ్యత్యాసాన్ని స్పష్టంగా ఉంచాం; כְּמוֹ אֵשׁ లోని నిజమైన ద్వంద్వార్థాన్ని పాదసూచికలో కాపాడాం.
