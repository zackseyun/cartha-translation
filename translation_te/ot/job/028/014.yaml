  text: The deep says[a], ‘It is not in me,’ and the sea says, ‘It is not with me.’
translation:
  language: te
  text: 'అగాధం, “అది[a] నాలో లేదు” అంటుంది;

    సముద్రం, “అది నా దగ్గర లేదు” అంటుంది.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ అక్షరార్థం: “ఆమె నాలో లేదు.” ఇక్కడ స్త్రీలింగ సర్వనామం చుట్టుపక్కల సందర్భంలో స్త్రీరూపంలో వ్యక్తీకరించబడిన జ్ఞానాన్ని సూచిస్తుంది.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּהוֹם
  choice: అగాధం
  rationale: ఈ పదం మహా జలగర్భాన్ని లేదా లోతైన జలరాశిని సూచిస్తుంది. ‘అగాధం’ సంక్షిప్తంగా ఉండి, ‘సముద్రం’తో ఉన్న కవితాత్మక సమాంతరతను కాపాడుతుంది.
- source_word: אָמַר
  choice: అంటుంది
  rationale: హీబ్రూలో రూపం సంపూర్ణ క్రియారూపమైనప్పటికీ, ఇక్కడ కవిత్వంలోని సజీవ వ్యక్తీకరణను వర్తమాన కాలపు ‘అంటుంది’ సహజంగా తెలియజేస్తుంది.
- source_word: לֹא בִי הִיא
  choice: అది నాలో లేదు
  rationale: స్త్రీలింగ సర్వనామం సందర్భంలోని ‘జ్ఞానం’ను సూచిస్తుంది. ఆధునిక తెలుగులో భావవాచకమైన జ్ఞానాన్ని ‘అది’తో సూచించడం సహజం; ‘నాలో’ అనే పదం בִי యొక్క ప్రత్యక్ష భావాన్ని నిలుపుతుంది.
- source_word: יָם
  choice: సముద్రం
  rationale: יָםకు సాధారణ అర్థం ‘సముద్రం.’ ఇది హీబ్రూ జలచిత్రణను, అగాధంతో ఉన్న సమాంతరతను కాపాడుతుంది.
- source_word: אֵין עִמָּדִי
  choice: అది నా దగ్గర లేదు
  rationale: ఈ పదబంధం ఒకరి సమీపంలో లేదా అధీనంలో లేకపోవడాన్ని సూచిస్తుంది. ‘నా దగ్గర లేదు’ ఆధునిక తెలుగులో సహజంగా ఉండి, మూలంలోని వ్యక్తీకరించిన మాటతీరును నిలుపుతుంది.
theological_decisions:
- issue: జ్ఞానాన్ని సూచించే స్త్రీలింగ సర్వనామం
  choice: ప్రధాన పాఠ్యంలో ‘అది’ అని అనువదించి, హీబ్రూ స్త్రీలింగాన్ని పాదటిప్పణిలో తెలియజేయడం
  alternative: ‘ఆమె’ అని నేరుగా అనువదించడం
  rationale: హీబ్రూలోని הִיא స్త్రీలింగ రూపం జ్ఞానాన్ని వ్యక్తీకరిస్తుంది; అయితే ఆధునిక తెలుగులో ‘జ్ఞానం’ను ‘ఆమె’ అనడం అసహజంగా, వ్యక్తీకరణను అవసరానికి మించి బలపరచవచ్చు. పాదటిప్పణి మూలంలోని రూపాన్ని పారదర్శకంగా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కవితాత్మక శైలి. రెండు పాదాల సమాంతర నిర్మాణం, అగాధం మరియు సముద్రానికి ఇచ్చిన వ్యక్తీకరణ నిలుపబడ్డాయి.
