translation:
  language: te
  text: గర్విష్ఠమైన మృగాలు ఆ దారిలో అడుగుపెట్టలేదు[a]; సింహం దానిమీదుగా వెళ్లలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘గర్వపు కుమారులు.’ ఈ మాట గర్వంగా సంచరించే అడవి మృగాలను, ముఖ్యంగా క్రూరమృగాలను సూచిస్తున్నట్లు ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִדְרִיכֻהוּ
  choice: ఆ దారిలో అడుగుపెట్టలేదు
  rationale: דרך అనే ధాతువు హిఫీల్ రూపంలో ఉన్నప్పటికీ, ఇక్కడ సందర్భానుసారంగా ఒక దారిని తొక్కడం లేదా దానిలో సంచరించడం అనే భావం. తెలుగులో ‘ఆ దారిలో అడుగుపెట్టలేదు’ సహజంగా ఉండి, దాగియున్న మార్గాన్ని ఏ మృగమూ చేరలేదనే భావాన్ని తెలియజేస్తుంది.
- source_word: בְנֵי שָׁחַץ
  choice: గర్విష్ఠులైన మృగాలు
  rationale: అక్షరార్థంగా ‘గర్వపు కుమారులు.’ సమాంతర పాదంలోని ‘సింహం’ను బట్టి ఇది గర్వంగా, బలంగా సంచరించే అడవి మృగాలను, ముఖ్యంగా క్రూరమృగాలను సూచించే కవితాత్మక నుడికారంగా గ్రహించబడింది.
- source_word: עָדָה עָלָיו
  choice: దానిమీదుగా వెళ్లలేదు
  rationale: על తో కూడిన עדה ఇక్కడ దానిపైగా లేదా దానిని దాటి సంచరించడాన్ని సూచిస్తుంది. ‘దానిమీదుగా వెళ్లలేదు’ సమాంతరతను కాపాడే సహజ తెలుగు ప్రయోగం.
- source_word: שָׁחַל
  choice: సింహం
  rationale: ఇది బలం లేదా క్రూరత్వాన్ని సూచించగల కవితాత్మక సింహపదం. అదనపు విశేషణం చేర్చకుండా ‘సింహం’ అని అనువదించడం స్పష్టంగా, మూలానికి సమీపంగా ఉంటుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కవితా వాక్యనిర్మాణం వాడబడింది. ‘ఆ దారి’ అని స్పష్టం చేయడం ద్వారా పూర్వ వచనంలోని దాగియున్న మార్గంతో అనుసంధానం నిలిపి ఉంచబడింది; మూలంలోని రూపకానికి సంబంధించిన అక్షరార్థం పాదటీపులో భద్రపరచబడింది.
