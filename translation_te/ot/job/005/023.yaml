  yaml_path: translation/ot/job/005/023.yaml
  text: For you will have a covenant with the stones of the field[c][b][a], and the wild animals of the field will be at peace with you.
translation:
  language: te
  text: ఎందుకంటే పొలంలోని రాళ్లతో నీకు ఒడంబడిక ఉంటుంది[a]; పొలంలోని అడవి జంతువులు[b] నీతో శాంతిగా ఉంటాయి[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పొలపు రాళ్లతో.’ ఈ మాట పొలంలో వ్యవసాయానికి అడ్డుగా ఉండే రాళ్లను సూచించవచ్చు; అయితే మూలంలోని చిత్రాన్ని ప్రధాన పాఠ్యంలో యథాతథంగా ఉంచాం.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘పొలంలోని జంతువులు’ లేదా ‘పొలంలోని మృగాలు.’
    reason: lexical_alternative
  - marker: c
    text: అక్షరార్థంగా, ‘నీతో శాంతి చేసుకున్నాయి’ లేదా ‘నీతో శాంతిగా ఉన్నాయి.’ హీబ్రూ పదప్రయోగం నీకు, అడవి జంతువులకు మధ్య శాంతియుత సంబంధాన్ని తెలియజేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి హామీకి కారణం లేదా వివరణను పరిచయం చేసే అనుసంధానంగా తీసుకొని, తెలుగు వాక్యప్రవాహంలో సహజంగా ఉండే ‘ఎందుకంటే’ అని అనువదించాం.
- source_word: עִם אַבְנֵי הַשָּׂדֶה
  choice: పొలంలోని రాళ్లతో
  rationale: עִם యొక్క సహవాస సంబంధాన్ని ‘తో’తో చూపిస్తూ, వ్యవసాయానికి అడ్డంకులై ఉండగల రాళ్లనే సూచించవచ్చనే భావాన్ని వివరించకుండా, హీబ్రూ కవితాత్మక చిత్రాన్ని స్పష్టంగా నిలిపాం.
- source_word: בְרִיתֶךָ
  choice: నీకు ఒప్పందం ఉంటుంది
  rationale: హీబ్రూలో ఈ ఉపవాక్యంలో క్రియ స్పష్టంగా లేదు. తెలుగు సహజత్వం కోసం ‘ఉంటుంది’ చేర్చి, בְּרִית యొక్క సంబంధార్థాన్ని ‘ఒప్పందం’గా ఉంచాం.
- source_word: וְחַיַּת הַשָּׂדֶה
  choice: పొలంలోని అడవి జంతువులు
  rationale: ఈ పదబంధంలో חַיָּה సాధారణంగా అడవి జంతువులను సూచిస్తుంది; ఆధునిక పాఠకులకు స్పష్టంగా ఉండే పదప్రయోగాన్ని ఎంచుకున్నాం.
- source_word: הָשְׁלְמָה לָךְ
  choice: నీతో శాంతిగా ఉంటాయి
  rationale: שׁלם హిఫీల్ రూపం శాంతి చేయడం లేదా శాంతియుత సంబంధంలో ఉండడం అనే భావాన్ని ఇస్తుంది. సందర్భంలోని భవిష్యత్ హామీకి సరిపోయేలా, సహజ తెలుగులో ఫలితస్థితిని వ్యక్తం చేశాం.
