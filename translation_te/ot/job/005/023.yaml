  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన, గంభీరమైన కవితాత్మక శైలి. హీబ్రూలోని ఒప్పందం–శాంతి సమాంతర చిత్రణను నిలిపాం.
