- from: అయితే నేనైతే దేవుణ్ణి ఆశ్రయిస్తాను; దేవుని ఎదుట నా విన్నపాన్ని ఉంచుతాను.
  to: అయితే నేనైతే దేవుణ్ణి ఆశ్రయిస్తాను; దేవుని సమక్షంలో నా విషయాన్ని ఉంచుతాను.
