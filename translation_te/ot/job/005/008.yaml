  yaml_path: translation/ot/job/005/008.yaml
  text: But as for me[a], I would seek God, and to God I would present my case.
translation:
  language: te
  text: అయితే నేనైతే దేవుణ్ణి ఆశ్రయిస్తాను; దేవుని సమక్షంలో నా విషయాన్ని ఉంచుతాను.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אוּלָם אֲנִי
  choice: అయితే నేనైతే
  rationale: אוּלָם లోని వ్యతిరేక మలుపును, ప్రత్యేకంగా వచ్చిన אֲנִי లోని ఉద్ఘాటనను సహజమైన ఆధునిక తెలుగులో కలిపి వ్యక్తం చేస్తుంది.
- source_word: אֶדְרֹשׁ
  choice: ఆశ్రయిస్తాను
  rationale: ఈ సందర్భంలో דרשׁ కేవలం వెదకడం కాక, సహాయం కోసం దేవునివైపు తిరిగి ఆయనను వేడుకోవడాన్ని సూచిస్తుంది. ‘ఆశ్రయిస్తాను’ ఆ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: אֵל / אֱלֹהִים
  choice: దేవుడు
  rationale: రెండు దైవనామాలు సమాంతర కవితా పాదాల్లో ఒకే దైవాన్ని సూచిస్తున్నాయి; కృత్రిమమైన భేదాన్ని ప్రవేశపెట్టకుండా రెండింటినీ ‘దేవుడు’గా అనువదించాం.
- source_word: אָשִׂים דִּבְרָתִי
  choice: నా విన్నపాన్ని ఉంచుతాను
  rationale: שׂים యొక్క ‘ఉంచు’ భావాన్ని నిలుపుతూ, דִּבְרָתִי ఇక్కడ దేవుని ఎదుట సమర్పించే విషయం లేదా వాదన అనే విస్తృత భావాన్ని కలిగి ఉంది. సందర్భంలో ‘విన్నపం’ సహజమైనదే గాని ‘ఫిర్యాదు’ అనే భావాన్ని బలవంతంగా చేర్చదు.
theological_decisions:
- issue: אֵל మరియు אֱלֹהִים అనే దైవసంబోధనల సమాంతర వినియోగం
  choice: రెండింటినీ ‘దేవుడు’గా అనువదించడం
  alternative: మొదటిదాన్ని ‘శక్తిమంతుడైన దేవుడు’గా, రెండవదాన్ని ‘దేవుడు’గా వేరు చేయడం
  rationale: హీబ్రూ వాక్యం ఇక్కడ ఇద్దరు వేర్వేరు దైవసూచకులను చూపడం లేదు; ఒకే దేవునిని సమాంతర పదాలతో సూచిస్తోంది. అందువల్ల లేనిది అయిన సిద్ధాంతపరమైన భేదాన్ని సృష్టించకుండా ఒకే విధంగా అనువదించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనదిగా, సాధారణ పాఠకులకు స్పష్టంగా ఉంచబడింది. ‘నేనైతే’ ద్వారా వక్త ఉద్ఘాటన, ‘ఎదుట’ ద్వారా దేవునికి విషయం సమర్పించే దిశ స్పష్టమవుతాయి.
