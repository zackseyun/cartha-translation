source:
  edition: WLC
  text: יוֹמָ֥ם יְפַגְּשׁוּ חֹ֑שֶׁךְ וְ֝/כַ/לַּ֗יְלָה יְֽמַשְׁשׁ֥וּ בַֽ/צָּהֳרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/005/014.yaml
  text: By day they meet darkness[a], and at noon they grope as in the night.
translation:
  language: te
  text: 'పగటివేళ వారు చీకటిని ఎదుర్కొంటారు;

    మధ్యాహ్న సమయంలో రాత్రిలో ఉన్నట్టుగా[a] తడుముకుంటారు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “రాత్రివలె,” లేదా “రాత్రివేళలాగా.” హీబ్రూ భాషలో “రాత్రి” అనే పదానికి ఉపమానార్థక ఉపసర్గ ఉంది; అందువల్ల వారు మధ్యాహ్న సమయంలోనూ రాత్రివేళలో ఉన్నట్టుగా తడుముకుంటున్నారని భావం.
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹמָם
  choice: పగటివేళ
  rationale: కాలవాచక క్రియావిశేషణ భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తూ, తరువాతి ‘రాత్రి’తో ఉన్న వ్యత్యాసాన్ని నిలుపుతుంది.
- source_word: יְפַגְּשׁוּ
  choice: వారు ఎదుర్కొంటారు
  rationale: פגשׁ యొక్క ‘కలుసుకోవడం/ఎదురుపడడం’ భావాన్ని ఇక్కడ చీకటితో అనుసంధానించి సహజంగా తెలియజేస్తుంది.
- source_word: חֹשֶׁךְ
  choice: చీకటిని
  rationale: పదంలోని ప్రత్యక్ష, రూపకాలంకార సంబంధమైన రెండు సాధ్య భావాలనూ అతిగా వ్యాఖ్యానించకుండా నిలుపుతుంది.
- source_word: וְכַלַּיְלָה
  choice: రాత్రిలో ఉన్నట్టుగా
  rationale: 'כ ఉపసర్గ సూచించే ఉపమానాన్ని స్పష్టంగా, సహజంగా తెలుపుతుంది: మధ్యాహ్నమైనా రాత్రిలో ఉన్నట్లుగా తడుముకోవడం.'
- source_word: יְמַשְׁשׁוּ
  choice: తడుముకుంటారు
  rationale: చీకటిలో దారి తెలియక చేతులతో వెదుక్కుంటూ కదిలే משׁשׁ భావానికి సహజమైన తెలుగు సమానార్థకం.
- source_word: בַצָּהֳרָיִם
  choice: మధ్యాహ్న సమయంలో
  rationale: ప్రకాశం అత్యధికంగా ఉండే మధ్యాహ్నాన్ని నిర్దిష్టంగా సూచించి, చీకటి/రాత్రి చిత్రణతో ఉన్న తీవ్రమైన వ్యత్యాసాన్ని కాపాడుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యేలా గంభీరమైన కవితాత్మక శైలిని ఉపయోగించాం. పగలు–చీకటి, మధ్యాహ్నం–రాత్రి అనే సమాంతర వ్యత్యాసాన్ని నిలిపి ఉంచాం; [a] సూచిక ప్రధాన పాఠ్యంలో చేర్చబడింది.
