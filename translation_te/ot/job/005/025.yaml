    text: లేదా ‘నీ విత్తనం’; హీబ్రూ זַרְעֶךָ సంతతిని సూచించే సమూహార్థక పదం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדַעְתָּ
  choice: నీవు తెలుసుకుంటావు
  rationale: సంయోజక అవ్యయంతో వచ్చిన Qal perfect 2ms ఈ కవితా సందర్భంలో భవిష్యత్ ఫలితాన్ని లేదా నిశ్చయాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ఈ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: כִּי
  choice: అని / అని...అని
  rationale: ఇక్కడ కారణాన్ని కాకుండా తెలుసుకునే విషయాన్ని పరిచయం చేస్తుంది. తెలుగులో రెండు సమాంతర అంశాలను ‘అని’ రూపాలతో కలపడం సహజం.
- source_word: רַב
  choice: విస్తారంగా ఉంటుంది
  rationale: ఏకవచన సమూహార్థకమైన זַרְעֶךָ యొక్క అధిక సంఖ్యను సూచిస్తుంది. ‘విస్తారంగా’ అనేది సమృద్ధి, సంఖ్యాబాహుళ్యం రెండింటినీ గౌరవప్రదమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: זַרְעֶךָ
  choice: నీ సంతానం
  rationale: זֶרַע అక్షరార్థంగా ‘విత్తనం’ అయినా, ఇక్కడ సంతతి లేదా progeny అనే కుటుంబార్థంలో ఉంది. ‘సంతానం’ స్పష్టంగా, సహజంగా ఉంటుంది; సమూహార్థాన్ని కూడా నిలుపుతుంది.
- source_word: וְצֶאֱצָאֶיךָ
  choice: నీ వంశస్థులు
  rationale: ఒకరి నుండి వచ్చిన వారిని, తరువాతి తరాలను సూచిస్తుంది. మొదటి సమాంతర పదమైన ‘సంతానం’తో తేడాను ఉంచుతూ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: כְּעֵשֶׂב
  choice: గడ్డిలా
  rationale: విస్తారంగా పెరిగే భూమ్యావరణాన్ని పోలికగా చూపుతుంది. ‘గడ్డిలా’ సంక్షిప్తంగా, చిత్రాత్మకంగా, సహజంగా ఉంటుంది.
- source_word: הָאָרֶץ
  choice: భూమి మీద
  rationale: אֶרֶץ ఇక్కడ విస్తృతమైన భూమిని సూచించవచ్చు. తెలుగులో ‘భూమి మీద గడ్డి’ అనే రూపం పోలికను సహజంగా వ్యక్తం చేస్తుంది; ‘దేశం/నేల’ అనే సాధ్యార్థాన్ని పాదసూచికలో ఉంచాం.
