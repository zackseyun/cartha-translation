  text: నీ సంతానం[a] అనేకమై ఉంటుందని, నీ వంశస్థులు భూమిలోని గడ్డిలా ఉంటారని నీవు తెలుసుకుంటావు.
  philosophy: optimal-equivalence
  footnotes:
