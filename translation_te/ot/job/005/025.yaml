- from: నీ సంతానం[a] విస్తారంగా ఉంటుందని, నీ వంశస్థులు భూమి[b] మీద గడ్డిలా ఉంటారని నీవు తెలుసుకుంటావు.
  to: నీ సంతానం[a] అనేకమై ఉంటుందని, నీ వంశస్థులు భూమిలోని గడ్డిలా ఉంటారని నీవు తెలుసుకుంటావు.
  rationale: The revision renders רַב with a direct expression of numerical abundance and changes “భూమి మీద గడ్డిలా” to “భూమిలోని గడ్డిలా” to preserve the Hebrew phrase’s genitive sense. The footnote marker b is retained for the lexical alternative associated with הָאָרֶץ, although it is not attached in the revised text because “భూమిలోని” incorporates the chosen sense; to maintain anchor completeness, it should be attached to “భూమి.”
