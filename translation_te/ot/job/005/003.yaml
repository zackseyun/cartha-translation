source:
  edition: WLC
  text: אֲֽנִי רָ֭אִיתִי אֱוִ֣יל מַשְׁרִ֑ישׁ וָ/אֶקּ֖וֹב נָוֵ֣/הוּ פִתְאֹֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/005/003.yaml
  text: I have seen a fool taking root[a], and suddenly I cursed his dwelling.
translation:
  language: te
  text: నేను ఒక మూర్ఖుడు వేర్లు పాతుకుంటూ ఉండడం చూశాను; అకస్మాత్తుగా అతని నివాసాన్ని శపించాను.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతని నివాసం శాపగ్రస్తమని ప్రకటించాను,” లేక “అతని నివాసం నాశనానికి గురికానుందని ప్రకటించాను.” హెబ్రీ క్రియను ప్రత్యక్షంగా శపించడం అనే అర్థంలోనూ, తీర్పును గమనించి ప్రకటించడం అనే అర్థంలోనూ గ్రహించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: אֲנִי רָאִיתִי
  choice: నేను చూశాను
  rationale: మొదటి పురుష సర్వనామంలోని ఉద్ఘాటనను నిలిపి, సంపూర్ణ క్రియను ఎలీఫజు ప్రత్యక్ష అనుభవ నివేదికగా సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אֱוִיל
  choice: మూర్ఖుడు
  rationale: జ్ఞానసాహిత్యంలో ఇది కేవలం తక్కువ తెలివిని కాక, నైతిక-జ్ఞాన సంబంధిత మూర్ఖత్వాన్ని సూచించే స్థిరమైన పదం.
- source_word: מַשְׁרִישׁ
  choice: వేరుపాతడం
  rationale: హిఫిల్ కృదంతంలోని వేర్లు పాతుకొని స్థిరపడుతున్న రూపకాన్ని నిలుపుతుంది; కేవలం ‘అభివృద్ధి చెందడం’ అని వివరణాత్మకంగా మార్చదు.
- source_word: וָאֶקּוֹב
  choice: శపించాను
  rationale: נקב క్రియకు ఇక్కడ అత్యంత ప్రత్యక్షమైన ‘శపించు’ అనే భావాన్ని నిలుపుతుంది; తీర్పును గుర్తించడం లేదా ప్రకటించడం అనే సాధ్యమైన మృదువైన పఠనాలు పాదసూచికలో ఇవ్వబడ్డాయి.
- source_word: נָוֵהוּ
  choice: అతని నివాసాన్ని
  rationale: నివాసస్థలం లేదా ఆవాసం అనే విస్తృత భావాన్ని సహజంగా అందిస్తుంది; ఇల్లు అని అతిగా నిర్దిష్టం చేయదు.
- source_word: פִתְאֹם
  choice: వెంటనే
  rationale: ఆకస్మికతను, హెబ్రీ వాక్యంలోని హఠాత్తు మలుపును తెలుగులో సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: וָאֶקּוֹבలో వక్త చర్య యొక్క భావం
  choice: మూర్ఖుడు స్థిరపడుతున్నట్లు చూసిన తరువాత ఎలీఫజు అతని నివాసాన్ని తానే శపించినట్లు అనువదించబడింది.
  alternative: అతని నివాసం శాపగ్రస్తమని ప్రకటించాడు; లేదా అది నాశనానికి నిర్ణయించబడిందని గుర్తించాడు.
  rationale: క్రియ యొక్క ప్రత్యక్ష పదార్థం ‘శపించాను’ అనే పఠనానికే ప్రాధాన్యం ఇస్తుంది. అయితే ఇది మాంత్రిక ప్రభావాన్ని సూచించాల్సిన అవసరం లేదు; జ్ఞానకావ్య సందర్భంలో వక్త పలికిన తీర్పు కావచ్చు. ఇతర సాధ్యమైన భావాలను పాదసూచిక సంరక్షిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, జ్ఞానసాహిత్యానికి తగిన గంభీరతతో అనువదించబడింది. ‘వేరుపాతడం’ మూలంలోని సజీవ రూపకాన్ని నిలుపుతుంది; ‘నివాసం’ పదం అర్థాన్ని అతిగా పరిమితం చేయదు.
