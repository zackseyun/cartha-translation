translation:
  language: te
  text: ఇదిగో, మేము దీన్ని క్షుణ్ణంగా పరిశీలించాము; ఇది అలాగే ఉంది. దీన్ని విను; నీవు స్వయంగా తెలుసుకో.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חָקַרְנוּהָ
  choice: మేము దీనిని పరిశోధించాము
  rationale: חקר అనే ధాతువులోని జాగ్రత్తగా వెదికి పరిశీలించడం అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: כֶּן הִיא
  choice: ఇది నిజమే
  rationale: ముందు చెప్పిన విషయాన్ని పరిశోధనతో నిర్ధారించినదిగా చూపే హీబ్రూ వాక్యభావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: שְׁמָעֶנָּה
  choice: దీనిని విను
  rationale: స్త్రీలింగ ఏకవచన ప్రత్యయం ముందున్న విషయాన్నే సూచిస్తుంది; తెలుగులో స్పష్టత కోసం ‘దీనిని’ అని ఇచ్చాం.
- source_word: דַע לָךְ
  choice: నీవే స్వయంగా తెలుసుకో
  rationale: לָךְ లోని వ్యక్తిగత అన్వయ భావాన్ని ‘స్వయంగా’ ద్వారా, וְאַתָּה లోని ‘నీవు’ అనే ఉద్ఘాటనను ‘నీవే’ ద్వారా వ్యక్తం చేస్తుంది.
theological_decisions: []
