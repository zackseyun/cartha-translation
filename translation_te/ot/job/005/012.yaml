  text: He frustrates the schemes of the crafty, so that their hands accomplish no success.
translation:
  language: te
  text: 'ఆయన జిత్తులమారుల పన్నాగాలను భగ్నం చేస్తాడు;

    వారి చేతులు ఏ విజయాన్నీ సాధించలేవు.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מֵפֵר
  choice: భగ్నం చేస్తాడు
  rationale: హిఫీల్ రూపంలోని ‘విఫలం చేయడం, చెదరగొట్టడం’ అనే కార్యార్థాన్ని సహజమైన, గంభీరమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: מַחְשְׁבוֹת
  choice: పన్నాగాలను
  rationale: సందర్భంలో עֲרוּמִים తో కలిసి సాధారణ ‘ఆలోచనలు’ కంటే కుటిలంగా రచించిన యోచనలను సూచిస్తుంది.
- source_word: עֲרוּמִים
  choice: జిత్తులమారుల
  rationale: ఇక్కడ పదం సానుకూల వివేకాన్ని కాక కపటమైన చాతుర్యాన్ని సూచిస్తుంది; ‘జిత్తులమారులు’ ఆధునిక పాఠకులకు సహజంగా అర్థమవుతుంది.
- source_word: יְדֵיהֶם
  choice: వారి చేతులు
  rationale: మూలంలోని శరీరావయవ రూపకాన్ని నిలుపుతూ, వారు చేసే కార్యాలను సూచిస్తుంది.
- source_word: תּוּשִׁיָּה
  choice: విజయాన్ని
  rationale: ఈ సందర్భంలో ఆచరణలో ఫలించే సామర్థ్యం లేదా సఫలతను సూచిస్తుంది; వాక్యంలోని పన్నాగాల విఫలతతో సహజంగా అనుసంధానమవుతుంది.
theological_decisions:
- issue: కర్తను సూచించే సర్వనామం
  choice: ఆయన
  alternative: అతడు
  rationale: ముందటి సందర్భంలో దేవుడే కర్త; గౌరవార్థక ‘ఆయన’ ఆధునిక తెలుగు బైబిలు శైలికి తగినది, అదనపు సిద్ధాంతార్థాన్ని చేర్చదు.
- issue: תּוּשִׁיָּה యొక్క విస్తృత అర్థపరిధి
  choice: విజయం
  alternative: సమర్థమైన కార్యం / స్థిరమైన ఫలితం
  rationale: పదానికి ‘సమర్థత, సఫలత, సారవంతమైన జ్ఞానం’ వంటి అర్థఛాయలు ఉన్నప్పటికీ, ఈ క్రియాత్మక సందర్భంలో ‘విజయం’ ఉద్దేశించిన ఫలితాన్ని స్పష్టంగా తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కవితాత్మక వాక్యనిర్మాణం. హెబ్రీ మూలంలోని సమాంతర నిర్మాణాన్ని రెండు పాదాలుగా నిలిపి, అవసరం లేని వివరణను చేర్చలేదు.
