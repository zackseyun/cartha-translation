    text: “సర్వశక్తిమంతుడు”కు హీబ్రూ పదం “షద్దయి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: ఇదిగో
  rationale: ప్రాముఖ్యమైన జ్ఞానవాక్యంపై దృష్టి నిలిపే హీబ్రూ ఉద్ఘాటనను సహజమైన, గంభీరమైన తెలుగులో నిలుపుతుంది.
- source_word: אַשְׁרֵי
  choice: ధన్యుడు
  rationale: కేవలం భావోద్వేగపరమైన సంతోషం కాక, కోరదగిన ధన్యస్థితిని సూచించే జ్ఞానసాహిత్య ధన్యతా సూత్రాన్ని వ్యక్తం చేస్తుంది.
- source_word: אֱנוֹשׁ
  choice: మనిషి
  rationale: మరణశీల మానవుణ్ణి సూచించే సాధారణ ఏకవచనాన్ని తెలుగు సామెతసదృశ శైలిలో సహజంగా అందిస్తుంది.
- source_word: יוֹכִחֶנּוּ
  choice: దేవుడు గద్దించే
  rationale: יכח హిఫీల్ రూపంలోని మందలించి సరిదిద్దే భావాన్ని నిలుపుతుంది; కేవలం శిక్షించే అర్థానికి పరిమితం చేయదు.
- source_word: אֱלוֹהַּ
  choice: దేవుడు
  rationale: యోబు గ్రంథంలో ఈ దైవపదానికి సహజమైన ప్రామాణిక తెలుగు సమానార్థకం.
- source_word: מוּסַר
  choice: శిక్షణ
  rationale: దిద్దుబాటు మరియు బోధన రెండూ కలిగిన రూపకల్పనాత్మక నియమశిక్షణ భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: שַׁדַּי
  choice: సర్వశక్తిమంతుడు
  rationale: షద్దయి అనే దైవబిరుదుకు సంప్రదాయబద్ధమైన, అర్థవంతమైన తెలుగు అనువాదం.
- source_word: אַל תִּמְאָס
  choice: తృణీకరించకు
  rationale: చులకనగా భావించి తిరస్కరించకూడదనే బలమైన నిషేధార్థాన్ని గంభీరమైన ఆధునిక తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: దేవుని గద్దింపు మరియు ధన్యత మధ్య సంబంధం
  choice: దేవుడు గద్దించే మనిషి ధన్యుడు
  alternative: దేవుడు సరిదిద్దే వ్యక్తి సంతోషవంతుడు
  rationale: బాధాకరమైన దైవదిద్దుబాటును ధన్యతగా చెప్పే వచనంలోని ఉద్వేగాన్ని నిలుపుతూ, దానిని కేవలం శిక్షగా గానీ కేవలం భావోద్వేగ సంతోషంగా గానీ మార్చదు.
- issue: מוּסַר యొక్క పరిధి
  choice: శిక్షణ
  alternative: దండన / ఉపదేశం / దిద్దుబాటు
  rationale: ఈ పదంలోని బోధనాత్మక మరియు దిద్దుబాటు అంశాలను కలిపి ఉంచుతుంది; అవసరానికి మించిన శిక్షాత్మక భావాన్ని దిగుమతి చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; జ్ఞానసాహిత్యానికి తగిన గంభీరతతో పాటు సాధారణ పాఠకులకు అర్థమయ్యే పదజాలం. హీబ్రూ వాక్యంలోని ప్రత్యక్ష ఉద్ఘాటన, ధన్యతా రూపం, మరియు దైవదిద్దుబాటు యొక్క సానుకూలమైనప్పటికీ ఉద్విగ్నమైన భావం నిలుపబడ్డాయి.
