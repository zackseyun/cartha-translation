  yaml_path: translation/ot/job/005/017.yaml
  text: Behold[a], blessed is the man whom God reproves[e][d][c][b]; therefore do not despise the discipline of the Almighty.
translation:
  language: te
  text: ఇదిగో, దేవుడు గద్దించే మనిషి ధన్యుడు[a]; కాబట్టి సర్వశక్తిమంతుని[c] శిక్షణను[b] తృణీకరించకు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ధన్యుడు” అనే హీబ్రూ ధన్యతా ప్రయోగాన్ని “సంతోషవంతుడు” లేదా “భాగ్యవంతుడు” అని కూడా అనువదించవచ్చు; ఇది కోరదగిన ధన్యస్థితిని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
