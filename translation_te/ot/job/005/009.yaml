    reason: lexical_alternative
lexical_decisions:
- source_word: עֹשֶׂה
  choice: చేసేవాడు ఆయనే
  rationale: ఈ ఖాల్ కృదంతం సందర్భంలో దేవుణ్ణి వర్ణిస్తోంది. తెలుగులో ‘చేసేవాడు ఆయనే’ అనే రూపం కృదంత భావాన్ని సహజంగా నిలుపుతూ, ముందున్న సందర్భంతో అనుసంధానిస్తుంది.
- source_word: גְדֹלוֹת
  choice: గొప్ప కార్యాలు
  rationale: నామవాచకంగా వాడిన బహువచన విశేషణానికి ‘గొప్ప కార్యాలు’ సహజమైన, గౌరవప్రదమైన తెలుగు; ‘గొప్ప సంగతులు’ కంటే క్రియాత్మక భావాన్ని స్పష్టంగా తెలుపుతుంది.
- source_word: וְאֵין חֵקֶר
  choice: శోధించి తెలుసుకోలేనంత
  rationale: అక్షరార్థంగా ‘శోధన లేదు’ అనే హీబ్రూ నిర్మాణం, పూర్తిగా పరిశోధించి గ్రహించలేమనే భావాన్ని ఇస్తుంది. ఈ ఎంపిక ఆధునిక తెలుగులో సహజంగా ఉండి మూలంలోని అగ్రాహ్యతను నిలుపుతుంది.
- source_word: נִפְלָאוֹת
  choice: అద్భుతాలు
  rationale: అసాధారణమైన, ఆశ్చర్యకరమైన కార్యాలను సూచించే ఈ పదానికి ‘అద్భుతాలు’ సంక్షిప్తమైన, సహజమైన సమానార్థకం.
- source_word: עַד אֵין מִסְפָּר
  choice: లెక్కకు అందనన్ని
  rationale: ఈ హీబ్రూ నుడికారం అసంఖ్యాకతను వ్యక్తం చేస్తుంది. ‘లెక్కకు అందనన్ని’ కవితాత్మక సమాంతరతను, సహజమైన తెలుగు ప్రవాహాన్ని కాపాడుతుంది.
