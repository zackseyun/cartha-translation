  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన శైలిని ఉపయోగించాం. ‘నలిపివేయబడతారు’ మూలంలోని బలమైన కర్మణి భావాన్ని నిలుపుతుంది; న్యాయపరమైన సందర్భాన్ని పాదసూచిక వివరిస్తుంది.
