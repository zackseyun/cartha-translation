  edition: WLC
  text: יִרְחֲק֣וּ בָנָ֣י/ו מִ/יֶּ֑שַׁע וְ/יִֽדַּכְּא֥וּ בַ֝/שַּׁ֗עַר וְ/אֵ֣ין מַצִּֽיל׃
base_translation:
  language: en
  yaml_path: translation/ot/job/005/004.yaml
  text: His children are far from safety[a], and they are crushed in the gate[b], with no one to rescue them.
translation:
  language: te
  text: అతని పిల్లలు రక్షణకు దూరంగా ఉంటారు[a]; పట్టణ ద్వారం దగ్గర[b] వారు నలిపివేయబడతారు; వారిని కాపాడేవారు ఎవరూ ఉండరు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘రక్షణ’ అనే పదాన్ని ‘విడుదల’ లేదా ‘క్షేమం’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘పట్టణ ద్వారం’ ప్రాచీన కాలంలో న్యాయవిచారణలు జరిగే, బహిరంగ నిర్ణయాలు తీసుకునే సాధారణ స్థలం.
    reason: cultural_note
lexical_decisions:
- source_word: יִרְחֲקוּ
  choice: దూరంగా ఉంటారు
  rationale: רחק అనే క్రియ దూరంగా ఉండడాన్ని సూచిస్తుంది. ఇక్కడ పిల్లలకు రక్షణ అందుబాటులో లేని స్థితిని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בָנָיו
  choice: అతని పిల్లలు
  rationale: בנים అనేది సందర్భానుసారం ‘కుమారులు’ లేదా విస్తృతంగా ‘పిల్లలు’ అని అర్థమవుతుంది. ఇక్కడ సంతానం సాధారణంగా ఉద్దేశించబడినందున ‘పిల్లలు’ అనేది సహజంగా, సమగ్రంగా ఉంది.
- source_word: מִיֶּשַׁע
  choice: రక్షణకు
  rationale: יֶשַׁע రక్షణ, విడుదల లేదా క్షేమాన్ని సూచించగలదు. ఈ సందర్భంలో ఆపదనుంచి తప్పించబడటమనే భావం ప్రధానంగా ఉండి, చివరి వాక్యభాగంలోని కాపాడేవాడితోనూ అనుసంధానమవుతుంది.
- source_word: וְיִדַּכְּאוּ
  choice: వారు నలిపివేయబడతారు
  rationale: דכא నలిపివేయడం లేదా పూర్తిగా అణచివేయడం అనే బలమైన భావాన్ని ఇస్తుంది. కర్మణి భావాన్ని, వాక్యంలోని తీవ్రతను ఈ అనువాదం నిలుపుతుంది.
- source_word: בַשַּׁעַר
  choice: పట్టణ ద్వారం దగ్గర
  rationale: שַׁעַר అక్షరార్థంగా ద్వారం; ప్రాచీన పట్టణాల్లో అది న్యాయవిచారణ, బహిరంగ నిర్ణయాల స్థలం. తెలుగులో స్థలసూచనకు ‘దగ్గర’ సహజంగా ఉండగా, సాంస్కృతిక భావం పాదసూచికలో వివరించబడింది.
- source_word: וְאֵין מַצִּיל
  choice: వారిని కాపాడేవాడు ఎవడూ ఉండడు
  rationale: אין తో వచ్చిన מציל ‘కాపాడేవాడు ఎవరూ లేరు’ అనే అస్తిత్వ నిరాకరణను తెలుపుతుంది. ‘వారిని’ అనే కర్మను తెలుగులో స్పష్టంగా చేర్చడం సహజ వాక్యనిర్మాణానికి తోడ్పడుతుంది.
