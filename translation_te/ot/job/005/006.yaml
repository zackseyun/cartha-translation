  yaml_path: translation/ot/job/005/006.yaml
  text: For trouble does not come from the dust[a], nor does toil sprout from the ground.
translation:
  language: te
  text: ఎందుకంటే, కష్టం ధూళిలోనుండి పుట్టదు[a]; ప్రయాస నేలనుండి మొలవదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “అధర్మం ధూళిలోనుండి పుట్టదు; దుఃఖం నేలనుండి మొలవదు.” ఈ రెండు హీబ్రూ పదాలు నైతిక చెడును లేదా ఆపదవల్ల కలిగే బాధను కూడా సూచించగలవు.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి మాటకు కారణం లేదా వివరణను జోడించే వాదనాత్మక సంబంధాన్ని సహజమైన తెలుగులో చూపుతుంది.
- source_word: יֵצֵא
  choice: పుట్టదు
  rationale: మూలం నుండి బయటకు రావడం లేదా ఉద్భవించడం అనే భావాన్ని, ధూళి–నేల వ్యవసాయ చిత్రణకు సరిపోయే సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: מֵעָפָר
  choice: ధూళిలోనుండి
  rationale: עָפָר యొక్క సాధారణ అర్థమైన ‘ధూళి’ని నిలుపుతూ, ఉద్భవించే మూలాన్ని సూచిస్తుంది.
- source_word: אָוֶן
  choice: కష్టం
  rationale: ఇక్కడ ఈ పదం నైతిక దోషానికి మాత్రమే పరిమితం కాకుండా బాధ, ఆపద, కీడు వంటి విస్తృత భావాన్ని కలిగి ఉంది; עָמָלతో సమాంతరంగా ‘కష్టం’ సహజంగా సరిపోతుంది.
- source_word: וּמֵאֲדָמָה
  choice: నేలనుండి
  rationale: אֲדָמָה సాగుకు సంబంధించిన నేల లేదా మట్టిని సూచిస్తుంది; మొలకెత్తే చిత్రణకు ‘నేల’ స్పష్టంగా సరిపోతుంది.
- source_word: יִצְמַח
  choice: మొలవదు
  rationale: మొక్కలు నేలలోనుండి మొలకెత్తే క్రియను నేరుగా నిలుపుతూ కవితాత్మక వ్యవసాయ రూపకాన్ని సంరక్షిస్తుంది.
- source_word: עָמָל
  choice: ప్రయాస
  rationale: శ్రమ, భారమైన కష్టం, దానితో కూడిన బాధ అనే అర్థపరిధిని కలిగి ఉండి אָוֶןతో కవితాత్మక సమాంతరాన్ని నిలుపుతుంది.
theological_decisions:
- issue: אָוֶן మరియు עָמָל పదాల భావబలం
  choice: మనుష్య కష్టం, ప్రయాసలు ధూళి లేదా నేల నుండి వాటంతట అవే ఉద్భవించవని చెప్పే వ్యవసాయ రూపకం
  alternative: ఈ పదజంటను ‘అధర్మం’ మరియు ‘దుఃఖం’గా తీసుకుని ప్రధానంగా నైతిక చెడును సూచించేదిగా అర్థం చేసుకోవడం
  rationale: సందర్భం బాధ మరియు శ్రమ గురించి ఎలీఫజు చేస్తున్న వ్యాఖ్యానం. ‘కష్టం’, ‘ప్రయాస’ అనే పదాలు నైతిక లేదా విపత్తు సంబంధిత ప్రత్యామ్నాయ భావాలను పూర్తిగా తొలగించకుండా, బాధకు గల కారణం గురించి వచనం చెప్పేదానికంటే బలమైన సిద్ధాంతాన్ని చేర్చకుండా ఉంటాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన కవితా శైలి. ‘పుట్టదు / మొలవదు’ అనే సమాంతర నిర్మాణం మూలంలోని ఉద్భవం–వ్యవసాయ చిత్రణను నిలుపుతుంది.
