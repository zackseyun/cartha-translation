translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గంభీరమైన కవితా లయతో అనువదించబడింది. చివరి పాదంలోని పాఠభేద క్లిష్టతను ప్రధాన పాఠంలో తీర్చివేయకుండా పాదసూచికలో భద్రపరచాం.
