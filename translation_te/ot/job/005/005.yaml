language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אֲשֶׁ֤ר קְצִיר֨/וֹ רָ֘עֵ֤ב יֹאכֵ֗ל וְ/אֶֽל מִ/צִּנִּ֥ים יִקָּחֵ֑/הוּ וְ/שָׁאַ֖ף צַמִּ֣ים חֵילָֽ/ם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/005/005.yaml
  text: The hungry eat his harvest[a], and take it even from among the thorns, and the thirsty pant after their wealth.
translation:
  language: te
  text: 'ఆకలిగొన్నవారు అతని పంటను తింటారు;

    ముళ్ల మధ్యనుండి కూడా దాన్ని తీసుకుపోతారు;

    దప్పిగొన్నవారు వారి సంపద కోసం ఆత్రంగా ఎగబడతారు.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఒక ఉచ్చు వారి సంపదను మింగివేస్తుంది.” చివరి పాదంలోని హీబ్రూ పాఠం క్లిష్టమైనది. ప్రధాన పాఠం ‘ఆకలిగొన్నవారు’కు సమాంతరంగా ‘దప్పిగొన్నవారు’ అని గ్రహించే సాధారణ పఠనాన్ని అనుసరిస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: קְצִירוֹ
  choice: అతని పంట
  rationale: קָצִיר కోయబడిన పంటను లేదా పంట కోతను సూచిస్తుంది; సందర్భంలో తినదగిన దిగుబడి భావాన్ని సహజంగా తెలియజేస్తూ ఏకవచన స్వామ్య ప్రత్యయాన్ని నిలుపుతుంది.
- source_word: רָעֵב
  choice: ఆకలిగొన్నవారు
  rationale: విశేషణం నామవాచకార్థంలో వాడబడింది. తెలుగు సాధారణ వర్గార్థానికి బహువచన రూపం సహజంగా ఉండి, ఆకలితో ఉన్నవారిని సూచిస్తుంది.
- source_word: וְאֶל מִצִּנִּים יִקָּחֵהוּ
  choice: ముళ్ల మధ్యనుండి కూడా దాన్ని తీసుకుపోతారు
  rationale: క్లిష్టమైన ఉపసర్గ నిర్మాణాన్ని అతిగా నిర్ధారించకుండా, ముళ్లున్న చోట నుండైనా పంటను చేజిక్కించుకునే సజీవ చిత్రాన్ని నిలుపుతుంది.
- source_word: צִנִּים
  choice: ముళ్లు
  rationale: వ్యవసాయ సందర్భంలో సాధారణ పదార్థమైన ‘ముళ్లు’ అత్యంత సూటిగా సరిపోతుంది; ‘కొంకులు’ వంటి ఇతర అర్థాలను ప్రధాన పాఠంలో ప్రవేశపెట్టలేదు.
- source_word: וְשָׁאַף
  choice: ఆత్రంగా ఎగబడతారు
  rationale: שָׁאַף లోని ఊపిరి పీల్చుకుంటూ ఆశపడటం లేదా అత్యాశతో దూకడం అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; ‘మింగివేయు’ అనే ప్రత్యామ్నాయ భావాన్ని నిర్బంధంగా ఎంచుకోదు.
- source_word: צַמִּים
  choice: దప్పిగొన్నవారు
  rationale: వ్యంజన పాఠాన్ని ‘దప్పిగొన్నవారు’గా గ్రహించడం ముందున్న ‘ఆకలిగొన్నవారు’తో సమాంతరతను కాపాడుతుంది. ‘ఉచ్చు/వల’కు సంబంధించిన ప్రత్యామ్నాయ పఠనం పాదసూచికలో ఉంచబడింది.
- source_word: חֵילָם
  choice: వారి సంపద
  rationale: חַיִל జ్ఞానసాహిత్యంలో ఆస్తి, వనరులు, సంపద అనే అర్థం ఇవ్వగలదు; బహువచన స్వామ్య ప్రత్యయాన్ని ‘వారి’గా నిలుపుతుంది.
