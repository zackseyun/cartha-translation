source:
  edition: WLC
  text: קְֽרָא נָ֭א הֲ/יֵ֣שׁ עוֹנֶ֑/ךָּ וְ/אֶל מִ֖י מִ/קְּדֹשִׁ֣ים תִּפְנֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/005/001.yaml
  text: Call now—is there anyone who will answer you? And to which of the holy ones will you turn?[a]
translation:
  language: te
  text: ఇప్పుడు పిలువు—నీకు జవాబిచ్చేవాడు ఎవరైనా ఉన్నాడా? పరిశుద్ధులలో ఎవరివైపు నీవు తిరుగుతావు?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “పరిశుద్ధ జీవులలో.” ఇక్కడి హీబ్రూ పదం బహుశా పరలోక జీవులను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: קְרָא נָא
  choice: ఇప్పుడు పిలువు
  rationale: קְרָא అనేది ఆజ్ఞార్థకం; נָא ఇక్కడ మర్యాదపూర్వకమైన ‘దయచేసి’ కంటే సవాలు, తక్షణతను సూచించే ‘ఇప్పుడు’గా సహజంగా వినిపిస్తుంది.
- source_word: הֲיֵשׁ עוֹנֶךָ
  choice: నీకు జవాబిచ్చేవాడు ఎవరైనా ఉన్నాడా?
  rationale: ప్రశ్నార్థక అస్తిత్వ నిర్మాణాన్ని సహజమైన తెలుగులో అలంకారప్రశ్నగా ఉంచి, ענה యొక్క ‘జవాబివ్వు’ అర్థాన్ని నిలిపింది.
- source_word: וְאֶל מִי מִקְּדֹשִׁים
  choice: పరిశుద్ధులలో ఎవరివైపు
  rationale: מן ఇక్కడ సమూహంలో ఎంపికను సూచిస్తుంది. קְדֹשִׁים ను అర్థాన్ని ముందుగానే ‘దూతలు’గా పరిమితం చేయకుండా ‘పరిశుద్ధులు’గా ఉంచి, సందర్భసూచనను పాదటిప్పణిలో ఇచ్చింది.
- source_word: תִּפְנֶה
  choice: నీవు తిరుగుతావు
  rationale: פנה లోని ‘వైపు తిరుగు’ రూపకాన్ని నిలిపి, సహాయం లేదా వినతి కోసం ఆశ్రయించడమనే సందర్భార్థాన్ని బలవంతంగా ప్రధాన పాఠ్యంలో చేర్చలేదు.
theological_decisions:
- issue: מִקְּדֹשִׁים అనే పదం సూచించే వారి గుర్తింపు
  choice: ప్రధాన పాఠ్యంలో ‘పరిశుద్ధులు’ అని విస్తృతంగా ఉంచడం
  alternative: ‘పరిశుద్ధ దూతలు’ లేదా ‘పరిశుద్ధ జీవులు’ అని స్పష్టీకరించడం
  rationale: యోబు సందర్భం పరలోక జీవులను సూచించే అవకాశాన్ని బలపరుస్తుంది; అయినా మూలపదం స్వయంగా ‘దూతలు’ అని చెప్పదు. అందువల్ల అసలు పదంలోని కొంత అస్పష్టతను ప్రధాన పాఠ్యంలో నిలిపి, సాధ్యమైన సూచనను పాదటిప్పణిలో తెలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ఎలీఫజు పలికే సవాలుతో కూడిన అలంకారప్రశ్న ధోరణిని నిలిపాం. ‘ఎవరివైపు తిరుగుతావు’ అనే రూపం మూలంలోని దిశాత్మక రూపకాన్ని సహజంగా కాపాడుతుంది.
