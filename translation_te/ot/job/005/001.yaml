  source_fidelity: కְרָא־נָא యొక్క సవాలుతో కూడిన ఆజ్ఞను “ఇప్పుడు పిలువు” సరిగ్గా ఇస్తుంది. הֲיֵשׁ עוֹנֶךָ లోని అలంకారప్రశ్నను “నీకు జవాబిచ్చేవాడు ఎవరైనా ఉన్నాడా?” సహజంగా, అర్థవిశ్వసనీయంగా ప్రతిబింబిస్తుంది. וְאֶל־מִי מִקְּדֹשִׁים תִּפְנֶה లోని ‘పరిశుద్ధులలో ఎవరి వైపు ... తిరుగుతావు’ అనే సమూహం-నుండి-ఎంపిక భావం మరియు దిశాత్మక రూపకం రెండూ నిలిచాయి.
  naturalness: పాఠ్యం ఆధునిక ప్రామాణిక తెలుగులో సహజంగా ఉంది. డ్యాష్ తరువాతి ప్రశ్నలు ఎలీఫజు సవాలు/వ్యంగ్య స్వరాన్ని సముచితంగా తెలియజేస్తాయి. “జవాబిచ్చేవాడు” మరియు “ఎవరివైపు నీవు తిరుగుతావు” రెండూ స్పష్టమైన, వాడుకలోనున్న రూపాలు.
  terminology: מִקְּדֹשִׁים ను “పరిశుద్ధులు”గా ఉంచడం మూలంలోని విస్తృతతను కాపాడుతుంది; దానిని ప్రధాన పాఠ్యంలో ‘దూతలు’గా నిర్దిష్టపరచలేదు. పాదటిప్పణి పరలోక జీవుల సంభావ్య సూచనను మాత్రమే తెలియజేస్తుంది; అందువల్ల ప్రత్యేక మతవ్యాఖ్యను రుద్దదు.
