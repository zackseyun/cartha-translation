  text: In famine he will redeem you from death[b][a], and in war from the power of the sword.
translation:
  language: te
  text: కరవులో ఆయన నిన్ను మరణం నుండి విమోచిస్తాడు[a]; యుద్ధంలో ఖడ్గపు బారి నుండి[b] నిన్ను కాపాడుతాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘విడిపిస్తాడు,’ ‘రక్షిస్తాడు.’ హెబ్రీ క్రియకు బంధం లేదా ప్రమాదం నుండి విడుదల చేయడం అనే భావం ఉంది.
    reason: lexical_alternative
  - marker: b
    text: హెబ్రీలో అక్షరార్థంగా, ‘ఖడ్గం చేతుల నుండి’; ఇది ఖడ్గం యొక్క శక్తి లేదా పట్టు నుండి అనే భావాన్ని ఇస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרָעָב
  choice: కరవులో
  rationale: רָעָב ఇక్కడ వ్యక్తిగత ఆకలి కంటే విపత్తుగా వచ్చే కరవును సూచిస్తుంది; בְ పరిస్థితిని తెలియజేస్తుంది.
- source_word: פָּדְךָ
  choice: ఆయన నిన్ను విమోచిస్తాడు
  rationale: פדה విడుదల చేయడం, విడిపించడం, రక్షించడం అనే బలమైన భావాన్ని కలిగి ఉంది; ‘విమోచిస్తాడు’ ఆ పదభారాన్ని నిలుపుతుంది.
- source_word: מִמָּוֶת
  choice: మరణం నుండి
  rationale: מִן వేరుచేయడం లేదా తప్పించడం సూచిస్తుంది; מָוֶת అనే నామవాచకాన్ని ‘మరణం’గానే ఉంచడం మూలానికి సమీపం.
- source_word: וּבְמִלְחָמָה
  choice: యుద్ధంలో
  rationale: מִלְחָמָה యుద్ధం లేదా పోరాటాన్ని సూచిస్తుంది; సమాంతర నిర్మాణంలో ‘యుద్ధంలో’ సహజంగా ఉంటుంది.
- source_word: מִידֵי
  choice: చేతుల నుండి
  rationale: మూలంలోని బహువచన ‘చేతులు’ అనే రూపకాన్ని నిలుపుతూ, దాని శక్తి లేదా పట్టునుండి రక్షణ అనే భావాన్ని పాదసూచికలో వివరిస్తుంది.
- source_word: חָרֶב
  choice: ఖడ్గం
  rationale: חָרֶבకు నేరమైన అర్థం ఖడ్గం; ఇక్కడ అది యుద్ధహింసకు ప్రతీకగా కూడా పనిచేస్తుంది.
theological_decisions:
- issue: జ్ఞానసాహిత్య సందర్భంలో פדה అనువాదం
  choice: విమోచిస్తాడు
  alternative: విడిపిస్తాడు / రక్షిస్తాడు
  rationale: ఈ సందర్భం భౌతిక ఆపదనుండి దేవుని రక్షణను సూచిస్తుంది. ‘విమోచిస్తాడు’ హెబ్రీ క్రియలోని విడుదల భావాన్ని కాపాడుతుంది, అయితే తరువాతి సిద్ధాంతార్థాన్ని వచనంలోకి బలవంతంగా చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన, సులభంగా అర్థమయ్యే శైలి. రెండవ పాదంలో హెబ్రీలో క్రియ లుప్తమైనప్పటికీ తెలుగు సహజత్వం కోసం ‘నిన్ను కాపాడుతాడు’ అని పూరించబడింది; ‘ఖడ్గం చేతులు’ అనే మూల రూపకం పాఠ్యంలో నిలుపబడి పాదసూచికలో వివరించబడింది.
