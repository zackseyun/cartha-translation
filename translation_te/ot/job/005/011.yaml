  text: to set the lowly on high[b][a], and those who mourn are lifted up to salvation.
translation:
  language: te
  text: 'అణగారినవారిని ఉన్నత స్థానంలో నిలబెట్టేందుకు,

    దుఃఖించేవారు[a] రక్షణకు[b] ఎత్తబడతారు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘చీకటిపట్టినవారు,’ ‘శోకించేవారు’; హీబ్రూ పదం చీకటి దృశ్యం ద్వారా దుఃఖాన్ని సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘విడిపింపుకు,’ ‘సురక్షిత స్థితికి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: לָשׂוּם
  choice: నిలబెట్టేందుకు
  rationale: שׂוּם అనే క్రియ యొక్క infinitive construct రూపం; ముందు సందర్భంలోని దేవుని కార్యానికి ఉద్దేశం లేదా ఫలితాన్ని సూచిస్తుంది. ‘నిలబెట్టేందుకు’ అనే రూపం ఆ సంబంధాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: שְׁפָלִים
  choice: అణగారినవారిని
  rationale: ఈ పదం సామాజికంగా లేదా పరిస్థితులవల్ల దిగువ స్థితిలో ఉన్నవారిని సూచించగలదు. ‘అణగారినవారు’ అనేది దానిని కేవలం నైతిక వినయంగా పరిమితం చేయదు.
- source_word: לְמָרוֹם
  choice: ఉన్నత స్థానంలో
  rationale: מָרוֹם యొక్క ఎత్తు లేదా ఉన్నత స్థానం అనే దృశ్యరూపాన్ని, שְׁפָלִיםతో ఉన్న వ్యతిరేక సమాంతరతను ఇది స్పష్టంగా నిలుపుతుంది.
- source_word: וְקֹדְרִים
  choice: దుఃఖించేవారు
  rationale: קדר పదం చీకటిపట్టడం, మ్లానంగా ఉండడం, దుఃఖించడం అనే భావాలను కలిగిస్తుంది. సందర్భంలో ‘దుఃఖించేవారు’ సహజంగా ఉండగా, అంతర్లీన చీకటి దృశ్యాన్ని పాదసూచికలో భద్రపరచాం.
- source_word: שָׂגְבוּ
  choice: ఎత్తబడతారు
  rationale: ఈ క్రియ ఉన్నతంగా లేదా అందనంత సురక్షితంగా కావడాన్ని సూచిస్తుంది. ‘ఎత్తబడతారు’ మొదటి పాదంలోని ఉన్నత స్థాన దృశ్యంతో సమాంతరతను నిలుపుతూ ఫలితభావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: יֶשַׁע
  choice: రక్షణకు
  rationale: יֶשַׁעకు రక్షణ, విడిపింపు, సురక్షిత స్థితి అనే విస్తృత అర్థపరిధి ఉంది. ‘రక్షణ’ ఆ విస్తృతిని నిలుపుతుంది; ఇక్కడ అది కష్టస్థితి నుంచి విడిపింపును కూడా సూచించగలదు.
theological_decisions:
- issue: జ్ఞానసాహిత్య సందర్భంలో יֶשַׁע అనువాదం
  choice: రక్షణ
  alternative: విడిపింపు; సురక్షిత స్థితి
  rationale: ‘రక్షణ’ మూలపదపు విస్తృత అర్థాన్ని, దాని ధార్మిక ప్రతిధ్వనిని నిలుపుతుంది; అయితే తరువాతి కాలపు ప్రత్యేక సిద్ధాంతార్థాన్ని ఈ వాక్యంలోకి బలవంతంగా చేర్చదు. సందర్భంలో ప్రత్యక్షమైన కష్టాల నుంచి విడిపింపు అనే భావం కూడా సాధ్యమే.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కవితాత్మక సమాంతరతను నిలుపుతూ సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన పదజాలం వాడబడింది. మొదటి క్రియను ఉద్దేశార్థక రూపంలో ఉంచి, ముందరి వచనంతో ఉన్న వ్యాకరణ సంబంధాన్ని కాపాడాం.
