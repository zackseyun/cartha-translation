  to: 'నీవు నిండు పరిపక్వతతో[a] సమాధికి చేరుకుంటావు,

    ధాన్యపు కుప్పను దాని తగిన సమయంలో సేకరించినట్లుగా.[b]'
  rationale: The revision keeps the debated sense of כֶּלַח broad in the main text, retains the grave and proper-time motifs, and revises the agricultural line so that it intelligibly represents the Hebrew image of grain gathered when ready. The footnote wording is corrected and its anchor remains on the simile.
