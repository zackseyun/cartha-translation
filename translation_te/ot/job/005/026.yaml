translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కవితా శైలిని పాటించాం. మూలంలోని వ్యవసాయ ఉపమానాన్ని ముందుకు ఉంచి, అరుదైన כֶּלַח పదంలోని వయస్సు/బలపరిపక్వత సందిగ్ధతను ప్రధాన పాఠం మరియు పాదటిప్పణిలో కాపాడాం.
