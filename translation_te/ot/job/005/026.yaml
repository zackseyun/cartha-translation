  text: תָּב֣וֹא בְ/כֶ֣לַח אֱלֵי קָ֑בֶר כַּ/עֲל֖וֹת גָּדִ֣ישׁ בְּ/עִתּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/005/026.yaml
  text: You will come to the grave in full vigor[b][a], like a sheaf gathered up in its season.
translation:
  language: te
  text: 'నీవు నిండు పరిపక్వతతో[a] సమాధికి చేరుకుంటావు,

    ధాన్యపు కుప్పను దాని తగిన సమయంలో సేకరించినట్లుగా.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పండిన ముసలివయస్సులో.’ כֶּלַח అనే హీబ్రూ పదం అరుదైనది; అది పరిపక్వ వయస్సును గానీ నిండు బలాన్ని గానీ సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: 'హీబ్రూ పదచిత్రాన్ని ‘ధాన్యపు కుప్పను దాని తగిన సమయంలో పైకి తీసుకువచ్చినట్లుగా’ అని కూడా అనువదించవచ్చు. భావం: సిద్ధమైన ధాన్యాన్ని సరైన సమయంలో సేకరించడం.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּבוֹא
  choice: చేరుకుంటావు
  rationale: בוא అనే క్రియకు ఇక్కడ భవిష్యత్ భావం ఉంది. సమాధిని గమ్యంగా చూపే సందర్భంలో ‘చేరుకుంటావు’ సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: בְכֶלַח
  choice: నిండు పరిపక్వతతో
  rationale: כֶּלַח అరుదైన, అర్థనిర్ణయం కష్టమైన పదం. అది పండిన వయస్సును లేదా నిండు బలపరిపక్వతను సూచించవచ్చు. ‘నిండు పరిపక్వతతో’ అనే అనువాదం కేవలం ముసలితనానికే పరిమితం కాకుండా పదంలోని విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: אֱלֵי קָבֶר
  choice: సమాధికి
  rationale: కָבֶר సాధారణంగా మృతదేహాన్ని పాతిపెట్టే సమాధిని సూచిస్తుంది; אֱלֵי దిశను తెలియజేస్తుంది.
- source_word: כַּעֲלוֹת
  choice: చేర్చినట్లుగా
  rationale: עלה యొక్క రూపం అక్షరార్థంగా పైకి తేవడం అనే భావమున్నా, వ్యవసాయ ఉపమానంలో కోసిన ధాన్యాన్ని సేకరించి కుప్పగా చేర్చడాన్ని సూచించవచ్చు. తెలుగు వాక్యంలో ఆ భావాన్ని సహజంగా వ్యక్తం చేయడానికి ‘చేర్చినట్లుగా’ వాడబడింది.
- source_word: גָּדִישׁ
  choice: పంటకుప్ప
  rationale: גָּדִישׁ కోసిన ధాన్యపు కుప్ప లేదా పేర్చిన పంటను సూచిస్తుంది. ‘పంటకుప్ప’ మూలంలోని వ్యవసాయ దృశ్యాన్ని ‘పన’ లేదా ‘కట్ట’ కంటే కచ్చితంగా నిలుపుతుంది.
- source_word: בְּעִתּוֹ
  choice: దాని కాలంలో
  rationale: ఈ పదబంధం తగిన లేదా నిర్ణీత సమయాన్ని సూచిస్తుంది. ‘దాని కాలంలో’ వ్యవసాయ సందర్భాన్నీ, సరైన సమయంలో జరిగే కార్యమనే భావాన్నీ కాపాడుతుంది.
