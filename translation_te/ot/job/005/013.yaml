source:
  edition: WLC
  text: לֹכֵ֣ד חֲכָמִ֣ים בְּ/עָרְמָ֑/ם וַ/עֲצַ֖ת נִפְתָּלִ֣ים נִמְהָֽרָה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/005/013.yaml
  text: He catches the wise in their craftiness[c][b][a], and the counsel of the twisted is hurried along.
translation:
  language: te
  text: ఆయన జ్ఞానులను వారి కుతంత్రంలో పట్టుకుంటాడు[a]; వక్రుల[b] యోచన త్వరపరచబడుతుంది[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “వారి చాకచక్యంవల్ల” లేదా “వారి కపటంలో.” హీబ్రూ పదం కొన్ని సందర్భాల్లో వివేకాన్ని సూచించగలదు; ఇక్కడ మాత్రం ప్రతికూల భావంలో వాడబడింది.
    reason: lexical_alternative
  - marker: b
    text: లేదా “కుటిలుల” లేదా “మోసపూరితుల.” మూలపదంలో మెలితిరిగిన లేదా వంకరైన స్వభావ చిత్రం ఉంది.
    reason: lexical_alternative
  - marker: c
    text: లేదా “హడావిడిగా ముందుకు నెట్టబడుతుంది” లేదా “త్వరగా కొట్టుకుపోతుంది.” వారి యోచన త్వరపరచబడుతుందనే భావం ఉంది; సందర్భంలో అది భంగానికి దారితీస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹכֵד
  choice: పట్టుకుంటాడు
  rationale: לכד అనే క్రియలో చిక్కించుకొని పట్టుకోవడం అనే చిత్రం ఉంది. సందర్భం దేవుని కార్యాలను వివరిస్తున్నందున తెలుగులో అవసరమైన కర్తగా ‘ఆయన’ను ఉంచి, వర్తమాన క్రియారూపాన్ని వాడాం.
- source_word: חֲכָמִים
  choice: జ్ఞానులను
  rationale: విశేషణం నామవాచకంగా వాడబడింది. జ్ఞానులుగా పేరుపొందినవారే పట్టుబడతారనే వ్యంగ్య భావాన్ని ఈ రూపం నిలుపుతుంది.
- source_word: בְּעָרְמָם
  choice: వారి కుతంత్రంలోనే
  rationale: עָרְמָה కొన్ని సందర్భాల్లో వివేకం లేదా చాకచక్యాన్ని సూచించగలిగినా, ఇక్కడ సమాంతర వాక్యభాగం దానికి ప్రతికూల నైతిక భావం ఇస్తుంది. ‘లోనే’ వారు పన్నినదే వారికి ఉచ్చుగా మారుతుందనే చిత్రాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וַעֲצַת
  choice: ఆలోచన
  rationale: עֵצָהకు సలహా, ఆలోచన, పథకం అనే భావాలు ఉన్నాయి. ఇక్కడ వక్రులు తలపెట్టిన యోచనను సూచించేందుకు సాధారణ పాఠకులకు సహజమైన ‘ఆలోచన’ను ఎంచుకున్నాం.
- source_word: נִפְתָּלִים
  choice: వక్రుల
  rationale: פתל మూలంలోని మెలితిరిగిన లేదా వంకరైన స్వభావ చిత్రాన్ని ‘వక్రులు’ సంక్షిప్తంగా నిలుపుతుంది; ఇది ఇక్కడ నైతిక వక్రతను సూచిస్తుంది.
- source_word: נִמְהָרָה
  choice: హడావిడిగా సాగిపోతుంది
  rationale: מהר మూలం త్వరపడడం లేదా తొందరపరచబడడం అనే భావాన్ని ఇస్తుంది. తెలుగు సహజత్వం కోసం ‘హడావిడిగా సాగిపోతుంది’ అని ఇచ్చాం; ఇది ఆ ఆలోచన తొందరపాటుతో ముందుకు పోవడాన్ని తెలియజేస్తుంది, అయితే దాని అపజయాన్ని వచనంలో నేరుగా చేర్చదు.
theological_decisions:
- issue: కృదంతానికి అంతర్లీనంగా ఉన్న కర్త
  choice: సందర్భానుసారం దేవునిని సూచించే ‘ఆయన’ను స్పష్టంగా ఉంచడం
  alternative: ‘పట్టుకునేవాడు’ వంటి అనిర్దిష్ట కర్తతో అనువదించడం
  rationale: హీబ్రూ వాక్యంలో కర్త ప్రత్యక్షంగా లేకపోయినా, యోబు 5:9-16లో దేవుని కార్యాలే కొనసాగుతున్నాయి. తెలుగు వాక్య నిర్మాణంలో కర్తను స్పష్టపరచడం సహజం; ఇది సందర్భంలో ఉన్నదానికంటే కొత్త సిద్ధాంతాన్ని చేర్చదు.
- issue: עָרְמָה మరియు נִפְתָּלִים యొక్క నైతిక స్వభావం
  choice: ప్రతికూల భావంతో ‘కుతంత్రం,’ ‘వక్రులు’ అని అనువదించడం
  alternative: తటస్థంగా ‘చాకచక్యం,’ ‘సంక్లిష్టులు’ అని అనువదించడం
  rationale: దేవుడు వారి యోచనలను భంగపరుస్తున్న సమాంతర సందర్భం ఈ పదాలకు తటస్థ తెలివికన్నా ప్రతికూల నైతిక భావం ఉందని సూచిస్తుంది.
- issue: నִמְהָרָה ఫలితాన్ని ఎంతవరకు స్పష్టీకరించాలి
  choice: హడావిడిగా సాగిపోవడాన్ని మాత్రమే ప్రధాన పాఠ్యంలో తెలపడం
  alternative: ‘త్వరగా విఫలమవుతుంది’ లేదా ‘తలకిందులవుతుంది’ అని ఫలితాన్ని స్పష్టంగా చేర్చడం
  rationale: సందర్భం ఆ యోచనల భంగాన్ని సూచించినా, ఈ క్రియ స్వయంగా ప్రధానంగా తొందర లేదా త్వరపరచబడటాన్ని వ్యక్తం చేస్తుంది. అందువల్ల అపజయ భావాన్ని ప్రధాన పాఠ్యంలో అదనంగా చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గంభీరమైన కానీ సహజమైన శైలిని వాడాం. ‘కుతంత్రం,’ ‘వక్రులు’ మూలంలోని నైతిక మరియు రూపకాల బలాన్ని నిలుపుతాయి. రెండవ భాగంలో హీబ్రూ క్రియలోని తొందర భావాన్ని ఉంచి, సందర్భం సూచించే విఫలతను ప్రధాన పాఠ్యంలో అతిగా వివరించలేదు.
