  edition: WLC
  text: לְ/שֹׁ֣ד וּ/לְ/כָפָ֣ן תִּשְׂחָ֑ק וּֽ/מֵ/חַיַּ֥ת הָ֝/אָ֗רֶץ אַל תִּירָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/005/022.yaml
  text: At destruction and famine you will laugh[a], and you will not fear the beasts of the earth.
translation:
  language: te
  text: నాశనాన్ని, కరవును చూసి నీవు నవ్వుతావు; భూమిలోని అడవి జంతువులకు నీవు భయపడవు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “భూమిలోని అడవి జంతువులకు భయపడకు.” హెబ్రీ రూపాన్ని నిషేధాజ్ఞగా కూడా చదవవచ్చు; అయితే ఇక్కడ అది భద్రతను తెలిపే హామీగా ఉండే అవకాశం ఎక్కువ.
    reason: alternative_reading
lexical_decisions:
- source_word: שֹׁד
  choice: నాశనం
  rationale: ఈ పదం హింసాత్మక విధ్వంసం లేదా వినాశాన్ని సూచిస్తుంది. కరవుతో జతగా విపత్తును సూచించడానికి ‘నాశనం’ సహజంగా, సంక్షిప్తంగా ఉంది.
- source_word: כָּפָן
  choice: కరవు
  rationale: ఈ నామవాచకం తీవ్రమైన ఆహార కొరతను సూచిస్తుంది. విపత్తుల సమాంతర నిర్మాణంలో ఆధునిక తెలుగులో ‘కరవు’ సరైన పదం.
- source_word: תִּשְׂחָק
  choice: నీవు నవ్వుతావు
  rationale: שׂחק నవ్వడాన్ని సూచిస్తుంది; సందర్భంలో నిర్భయత లేదా తృణీకరణ ఛాయ ఉండవచ్చు. ‘నవ్వుతావు’ మూలంలోని సజీవ రూపకాన్ని అదనపు వ్యాఖ్యానం లేకుండా నిలుపుతుంది.
- source_word: מֵחַיַּת הָאָרֶץ
  choice: భూమిమీద తిరిగే అడవి జంతువులకు
  rationale: חַיָּה ఇక్కడ సాధారణంగా అడవి జంతువులను సూచిస్తుంది. ‘తిరిగే’ అనేది తెలుగులో సంబంధాన్ని సహజంగా వ్యక్తం చేస్తుంది; జంతువులు భూమికి చెందినవనే మూల భావాన్ని నిలుపుతుంది.
- source_word: אַל תִּירָא
  choice: నీవు భయపడవు
  rationale: אַל + అసంపూర్ణ క్రియ సాధారణంగా నిషేధాన్ని తెలుపగలిగినా, ఇక్కడ వరుసగా చెప్పబడుతున్న రక్షణ వాగ్దానాల సందర్భంలో ఇది భద్రతను హామీగా తెలియజేసే భావానికి అనుకూలంగా ఉంది.
theological_decisions:
- issue: אַל תִּירָא యొక్క భావబలం
  choice: వాగ్దానపూర్వక హామీ—‘నీవు భయపడవు’
  alternative: ఆజ్ఞాత్మక నిషేధం—‘భయపడకు’
  rationale: ఈ వాక్యం ఎలీఫజు చెప్పే రక్షణలు, ఆశీర్వాదాల వరుసలో ఉంది. ముందున్న ‘నీవు నవ్వుతావు’ అనే క్రియతో సమాంతరంగా హామీ భావం సందర్భానికి బాగా సరిపోతుంది. అయితే హెబ్రీ రూపంలోని నిజమైన ఆజ్ఞార్థక సాధ్యతను పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కావ్యశైలిని ఉపయోగించాం. ‘చూసి’ అనేది నాశనం, కరవు ఎదురైనా వాటిని చూసి నిర్భయంగా నవ్వడం అనే హెబ్రీ సంబంధాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది. పాదసూచిక గుర్తును సందిగ్ధత ఉన్న భయపడే ఉపవాక్యానికే జతచేశాం.
