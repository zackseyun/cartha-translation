source:
  edition: WLC
  text: וַ/יֹּ֣שַׁע מֵ֭/חֶרֶב מִ/פִּי/הֶ֑ם וּ/מִ/יַּ֖ד חָזָ֣ק אֶבְיֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/job/005/015.yaml
  text: But he saves the needy from the sword of their mouth[a], and from the hand of the strong.
translation:
  language: te
  text: కానీ ఆయన పేదవానిని వారి నోటి ఖడ్గం నుండి[a], బలవంతుని చేతి నుండి రక్షిస్తాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆయన పేదవానిని ఖడ్గం నుండి, వారి నోటి నుండి, బలవంతుని చేతి నుండి విడిపించాడు.” హీబ్రూ వాక్యనిర్మాణం సంక్షిప్తంగా ఉంది; కొందరు “వారి నోటి నుండి” అనే మాటలను “వారి నోటి ఖడ్గం”లో భాగంగా కాకుండా విడిగా తీసుకుంటారు.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּשַׁע
  choice: రక్షిస్తాడు
  rationale: ישׁע ధాతువు రక్షించడం లేదా విడిపించడం అనే భావాన్ని ఇస్తుంది. సందర్భంలో దేవుడే సూచిత కర్త; ఎలీఫజు చెప్పే సాధారణ సత్యానికి తెలుగు వర్తమాన కాలం సహజంగా సరిపోతుంది.
- source_word: מֵחֶרֶב
  choice: ఖడ్గం నుండి
  rationale: חֶרֶב అనే సాధారణ నామవాచకానికి ‘ఖడ్గం’ సరైన, గౌరవప్రదమైన తెలుగు పదం; מִן ఉపసర్గ విడిపింపబడే ప్రమాదాన్ని సూచిస్తుంది.
- source_word: מִפִּיהֶם
  choice: వారి నోటి
  rationale: అక్షరార్థంగా ‘వారి నోటి నుండి.’ ముందున్న ‘ఖడ్గం’తో కలిపి, హానికరమైన మాటలను ఖడ్గంగా చిత్రించే ‘వారి నోటి ఖడ్గం’ అనే ప్రధాన పఠనాన్ని నిలుపుతుంది. హెబ్రీలోని ఏకవచన ‘నోరు’ను అలాగే ఉంచింది.
- source_word: וּמִיַּד
  choice: చేతి నుండి
  rationale: יָד అక్షరార్థంగా ‘చేయి,’ విస్తృతంగా అధికారం లేదా పట్టును కూడా సూచిస్తుంది. ఖడ్గం అనే స్పష్టమైన చిత్రంతో జతగా ఉన్నందున రూపకాన్ని నిలుపుతుంది.
- source_word: חָזָק
  choice: బలవంతుని
  rationale: విశేషణం నామవాచకంగా వాడబడి బలమైన లేదా శక్తిగల వ్యక్తిని సూచిస్తుంది. ఏకవచన రూపాన్ని తెలుగు అనువాదం నిలుపుతుంది.
- source_word: אֶבְיוֹן
  choice: పేదవాణ్ణి
  rationale: אֶבְיוֹן ఆర్థికంగా, సామాజికంగా లేమిలో ఉన్న వ్యక్తిని సూచిస్తుంది. ‘పేదవాడు’ ఆధునిక సాధారణ తెలుగులో సహజంగా ఉండి మూలంలోని ఏకవచనాన్ని నిలుపుతుంది.
theological_decisions:
- issue: ‘వారి నోటి ఖడ్గం’ అనే రూపక భావం
  choice: నాశనకరమైన మాటలను ఖడ్గంగా చూపే రూపకాన్ని యథాతథంగా నిలుపడం
  alternative: ‘ఖడ్గం నుండి, వారి నోటి నుండి’ అని రెండు వేరు ప్రమాదాలుగా చదవడం
  rationale: హెబ్రీ పదక్రమం సంక్షిప్తంగా ఉండి రెండు విశ్లేషణలకు అవకాశం ఇస్తుంది. ప్రధాన పాఠంలో సజీవమైన ఖడ్గం–నోరు రూపకాన్ని నిలిపి, ప్రత్యామ్నాయ నిర్మాణాన్ని పాదసూచికలో ఇచ్చాం; తద్వారా అసలు సందిగ్ధతను సిద్ధాంతపరంగా పరిష్కరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కవితా శైలి. ‘ఖడ్గం,’ ‘చేయి’ అనే స్పష్టమైన మూల రూపకాలను నిలిపి, అతిగా వివరణాత్మకమైన పదప్రయోగాన్ని నివారించాం.
