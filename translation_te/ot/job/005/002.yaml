  text: For vexation kills the fool[a], and jealousy puts the simple to death.
translation:
  language: te
  text: 'ఎందుకంటే, ఉక్రోషం మూర్ఖుణ్ణి చంపుతుంది;

    అసూయ[a] సులభంగా నమ్మేవాణ్ణి మరణింపజేస్తుంది.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఈర్ష్య.’ హెబ్రీ పదం ఈ రెండు భావాలనూ సూచించగలదు; ఇక్కడ అది మనిషిని నాశనం చేసే భావావేశాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందరి వాక్యానికి వివరణగా ఎలీఫజు చెప్పే కారణాత్మక నానుడిని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: לֶאֱוִיל
  choice: మూర్ఖుణ్ణి
  rationale: אֱוִיל కేవలం తెలివి తక్కువవాడిని కాక, నైతికంగా మరియు ఆచరణలో అవివేకంగా నడిచే వ్యక్తిని సూచిస్తుంది; ‘మూర్ఖుడు’ జ్ఞానసాహిత్య సందర్భానికి సరిపోతుంది.
- source_word: יַהֲרָג
  choice: చంపుతుంది
  rationale: ఇక్కడ Qal imperfect జ్ఞానసాహిత్యంలోని సాధారణ సత్యాన్ని వ్యక్తం చేస్తుంది; ‘చంపుతుంది’ మూలంలోని ప్రాణాంతక బలాన్ని నేరుగా నిలుపుతుంది.
- source_word: כָּעַשׂ
  choice: ఉక్రోషం
  rationale: ఈ పదం కోపం, చికాకు, మనోవ్యథ లేదా కసితో కూడిన అంతర్గత కలతను సూచించగలదు. సమాంతరంగా ఉన్న קִנְאָהతో కలిసి ఇక్కడ వినాశకరమైన ఆవేశాన్ని సూచిస్తున్నందున ‘ఉక్రోషం’ సరైన విస్తృతిని ఇస్తుంది.
- source_word: וּפֹתֶה
  choice: అమాయకుణ్ణి
  rationale: פֹּתֶה జ్ఞానసాహిత్యంలో అనుభవం లేని, సులభంగా ప్రభావితమయ్యే వ్యక్తిని సూచిస్తుంది. ‘అమాయకుడు’ మేధో వైకల్యాన్ని సూచించకుండా ఆ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: תָּמִית
  choice: మరణింపజేస్తుంది
  rationale: מות యొక్క Hiphil రూపంలోని కారణార్థాన్ని నిలుపుతూ, మొదటి పాదంలోని ‘చంపుతుంది’తో ఉన్న హెబ్రీ సమాంతరతలో స్వల్ప పదభేదాన్ని కూడా కాపాడుతుంది.
- source_word: קִנְאָה
  choice: అసూయ
  rationale: వినాశకరమైన భావావేశాన్ని సూచించే ఈ సందర్భంలో ‘అసూయ’ సహజంగా సరిపోతుంది; అయితే హెబ్రీ పదానికి ‘ఈర్ష్య’ అనే భావం కూడా సాధ్యమే.
