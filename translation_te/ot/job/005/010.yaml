id: JOB.5.10
reference: Job 5:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: הַ/נֹּתֵ֣ן מָ֭טָר עַל פְּנֵי אָ֑רֶץ וְ/שֹׁ֥לֵֽחַ מַ֝יִם עַל פְּנֵ֥י חוּצֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/005/010.yaml
  text: who gives rain on the face of the earth and sends water on the face of the fields[b][a],
translation:
  language: te
  text: 'భూమి ఉపరితలంపై వర్షాన్ని కురిపించేవాడు,

    విశాల బహిరంగ ప్రదేశాలపై నీటిని పంపేవాడు.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దేశపు ఉపరితలంపై’ లేదా ‘నేలపై.’ హెబ్రీ אָרֶץ సందర్భాన్ని బట్టి ‘భూమి,’ ‘దేశం,’ లేదా ‘నేల’ అని అర్థమవుతుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘వీధులపై,’ ‘పొలాలపై,’ లేదా ‘పల్లెప్రాంతంపై.’ హెబ్రీ חוּצוֹת బహిరంగ ప్రదేశాలు, వీధులు, లేదా విస్తారమైన బయటి ప్రాంతాలను సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנֹּתֵן
  choice: కురిపించేవాడు
  rationale: ఆర్టికల్‌తో ఉన్న ఖల్ కృదంతం దేవుణ్ణి వర్ణించే నామార్థక రూపం. వర్షంతో సహజంగా వాడే ‘కురిపించు’ తెలుగులో భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: מָטָר
  choice: వర్షం
  rationale: వర్షపాతం సూచించే సాధారణ హెబ్రీ పదానికి సహజమైన ఆధునిక తెలుగు సమానం.
- source_word: עַל־פְּנֵי אָרֶץ
  choice: భూమి ఉపరితలంపై
  rationale: ‘భూమి/దేశం ముఖంపై’ అనే హెబ్రీ రూపకాన్ని తెలుగులో సహజంగా ‘ఉపరితలంపై’ అని వ్యక్తం చేస్తూ విస్తృత భౌమార్థాన్ని నిలుపుతుంది.
- source_word: וְשֹׁלֵחַ
  choice: పంపేవాడు
  rationale: మొదటి కృదంతానికి సమాంతరమైన ఖల్ కృదంతం; ‘పంపేవాడు’ ఆ సమాంతర వాక్య నిర్మాణాన్ని నిలుపుతుంది.
- source_word: מַיִם
  choice: నీరు
  rationale: హెబ్రీలో రూపపరంగా బహువచనమైనప్పటికీ, ఇక్కడ తెలుగు ద్రవ్యనామమైన ‘నీరు’ సహజంగా ఉంటుంది.
- source_word: עַל־פְּנֵי חוּצוֹת
  choice: విశాల బహిరంగ ప్రదేశాలపై
  rationale: חוּצוֹת వీధులు, బయట ప్రదేశాలు, విస్తారమైన బహిరంగ ప్రాంతాలు అనే అర్థాలు ఇవ్వగలదు. వర్షం–నీటి ప్రకృతి సందర్భంలో నిర్దిష్టంగా ‘పొలాలు’ అని పరిమితం చేయకుండా బహిరంగ విస్తీర్ణాల భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: אָרֶץ పదం యొక్క పరిధి
  choice: భూమి
  alternative: దేశం / నేల
  rationale: సందర్భం దేవుని వర్షప్రదానాన్ని విస్తృతంగా వర్ణిస్తుంది; అయినా పదానికి ‘దేశం/నేల’ అనే అర్థం కూడా ఉండగలదని పాదసూచికలో ఉంచాం.
- issue: חוּצוֹת యొక్క స్థలార్థం
  choice: విశాల బహిరంగ ప్రదేశాలు
  alternative: వీధులు / పొలాలు / పల్లెప్రాంతం
  rationale: మూలపదంలోని నిజమైన అర్థవిస్తృతిని ఒకే నిర్దిష్ట భూభాగానికి కుదించకుండా, ఈ ప్రకృతి సందర్భానికి సరిపోయే విస్తృత అర్థాన్ని ఎంచుకున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనా సాధారణ పాఠకులకు అర్థమయ్యే శైలి. రెండు హెబ్రీ కృదంతాల సమాంతరతను ‘కురిపించేవాడు / పంపేవాడు’తో నిలిపాం; ‘ముఖం’ అనే యథాతథ రూపకం తెలుగులో అసహజంగా ఉండడంతో ‘ఉపరితలం’ వాడాం.
