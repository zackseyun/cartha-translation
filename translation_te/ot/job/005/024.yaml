source:
  edition: WLC
  text: וְֽ֭/יָדַעְתָּ כִּי שָׁל֣וֹם אָהֳלֶ֑/ךָ וּֽ/פָקַדְתָּ֥ נָ֝וְ/ךָ וְ/לֹ֣א תֶחֱטָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/005/024.yaml
  text: You will know that your tent is at peace[a], and when you inspect your dwelling, you will not miss anything.
translation:
  language: te
  text: నీ గుడారం క్షేమంగా ఉందని నీవు తెలుసుకుంటావు; నీ నివాసాన్ని పరిశీలించినప్పుడు, ఏదీ లోటుగా ఉండదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీవు పాపం చేయవు.” హీబ్రూ క్రియకు “పాపం చేయు” అనే అర్థం ఉండవచ్చు; అయితే ఈ సందర్భంలో అది “తప్పిపోవు” లేదా “లోటుగా ఉండు” అనే భావాన్ని సూచించే అవకాశం ఎక్కువ.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדַעְתָּ
  choice: నీవు తెలుసుకుంటావు
  rationale: సంయోజక అవ్యయంతో వచ్చిన ఖాల్ పరిపూర్ణ క్రియ ఈ వాగ్దాన సందర్భంలో భవిష్యత్ భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: כִּי
  choice: అని
  rationale: ఇది కారణాన్ని కాక, తెలుసుకునే విషయాన్ని పరిచయం చేస్తోంది.
- source_word: שָׁלוֹם
  choice: క్షేమంగా
  rationale: ఇక్కడ ఈ పదం గుడారం లేదా ఇంటివారి శాంతి, భద్రత, సమగ్ర క్షేమాన్ని సూచిస్తుంది; తెలుగు వాడుకలో ‘క్షేమంగా’ ఈ విస్తృత భావాన్ని సహజంగా అందిస్తుంది.
- source_word: אָהֳלֶךָ
  choice: నీ గుడారం
  rationale: ప్రాచీన దృశ్యాన్ని నిలుపుతూ హీబ్రూ పదానికి నేరమైన అర్థాన్ని కాపాడుతుంది.
- source_word: וּפָקַדְתָּ
  choice: పరిశీలించినప్పుడు
  rationale: פקד పదానికి సందర్శించడం, శ్రద్ధ చూపడం, లెక్క చూడడం, పరిశీలించడం వంటి అర్థాలున్నాయి. తరువాతి వాక్యభాగంతో కలిపి చూస్తే, తన నివాసంలో అన్నీ సరిగా ఉన్నాయో చూడడం అనే భావం సరిపోతుంది.
- source_word: נָוְךָ
  choice: నీ నివాసాన్ని
  rationale: נוה నివాసం, వాసస్థలం లేదా మేతభూమిని సూచించగలదు; ‘గుడారం’తో సమాంతరంగా ఇక్కడ ‘నివాసం’ తగినది.
- source_word: וְלֹא תֶחֱטָא
  choice: ఏదీ లోటుగా ఉండదు
  rationale: חטא సాధారణంగా ‘పాపం చేయు’ అని అర్థమైనా, ‘తప్పిపోవు/లక్ష్యాన్ని తప్పు’ అనే భావమూ ఉంది. నివాసాన్ని పరిశీలించే సందర్భంలో ఏదీ తప్పిపోలేదని లేదా లోటుగా లేదని చెప్పే భావం సహజంగా సరిపోతుంది; ప్రత్యామ్నాయ నైతిక అర్థాన్ని పాదటిప్పణిలో నిలిపాం.
theological_decisions:
- issue: וְלֹא תֶחֱטָא యొక్క సందర్భోచిత అర్థం
  choice: 'నైతికేతర భావం: ‘ఏదీ లోటుగా ఉండదు’'
  alternative: ‘నీవు పాపం చేయవు’
  rationale: ఈ వచనం గృహం యొక్క క్షేమం, సంపూర్ణత గురించి మాట్లాడుతోంది. ‘నీ నివాసాన్ని పరిశీలించినప్పుడు’ అనే మాట తరువాత ఏదీ లోటుగా ఉండదనే భావం సందర్భానికి చక్కగా సరిపోతుంది. అయితే హీబ్రూ క్రియకు సాధారణంగా ఉన్న నైతిక అర్థం నిజమైన ప్రత్యామ్నాయం కాబట్టి దాన్ని పాదటిప్పణిలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘గుడారం’ ద్వారా మూలంలోని ప్రాచీన చిత్రణను నిలిపి, ‘క్షేమంగా’ ద్వారా שָׁלוֹם పదంలోని శాంతి, భద్రత, సమగ్రత భావాలను సంక్షిప్తంగా అందించాం.
