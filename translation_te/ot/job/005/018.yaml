  text: כִּ֤י ה֣וּא יַכְאִ֣יב וְ/יֶחְבָּ֑שׁ יִ֝מְחַ֗ץ ו/יד/ו תִּרְפֶּֽינָה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/005/018.yaml
  text: For he causes pain[a], but he binds up; he shatters, but his hands heal.
translation:
  language: te
  text: ఎందుకంటే ఆయనే బాధ కలిగిస్తాడు, కానీ కట్టు కడతాడు; ఆయన నలగగొడతాడు, కానీ ఆయన చేతులు స్వస్థపరుస్తాయి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూలో అక్షరార్థంగా “ఆయన చెయ్యి స్వస్థపరుస్తాయి” అని ఉంది: “చెయ్యి” ఏకవచనం, కానీ “స్వస్థపరుస్తాయి” అనే క్రియ బహువచనం. అందువల్ల “ఆయన చెయ్యి స్వస్థపరుస్తుంది” అని కూడా అనువదించవచ్చు.'
    reason: హీబ్రూ ఏకవచన నామవాచకం మరియు బహువచన క్రియ మధ్య ఉన్న వ్యాకరణ అసమతౌల్యాన్ని, అలాగే సాధ్యమైన ప్రత్యామ్నాయ అనువాదాన్ని నమోదు చేయడానికి.
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి మాటకు వివరణ లేదా కారణాన్ని పరిచయం చేసే అనుసంధాన భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: הוּא
  choice: ఆయనే
  rationale: స్వతంత్ర సర్వనామంలోని ఉద్ఘాటనను తెలుగులో ‘ఆయనే’ సహజంగా నిలుపుతుంది.
- source_word: יַכְאִיב
  choice: బాధ కలిగించేది
  rationale: హిఫీల్ రూపంలోని ‘నొప్పి లేదా బాధ కలిగించు’ అనే ప్రత్యక్ష కారక భావాన్ని నిలుపుతుంది; ‘గాయపరచు’ వంటి మరింత నిర్దిష్టమైన చిత్రాన్ని అనవసరంగా చేర్చదు.
- source_word: וְיֶחְבָּשׁ
  choice: ఆయనే కట్టు కడతాడు
  rationale: గాయానికి కట్టు కట్టి చికిత్స చేయడాన్ని సూచించే חבש భావాన్ని సాధారణ ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది; కవితా విరుద్ధత తెలుగులో వాక్య నిర్మాణం ద్వారా స్పష్టమవుతుంది.
- source_word: יִמְחַץ
  choice: ఆయన చితకగొడతాడు
  rationale: מחץ లోని బలంగా నలగగొట్టే లేదా దెబ్బతీసే తీవ్రతను నిలుపుతూ, తరువాతి స్వస్థపరిచే చిత్రంతో సరిపోతుంది.
- source_word: וְיָדוֹ
  choice: అయితే ఆయన చెయ్యి
  rationale: మసొరెటిక్ వ్యంజన పాఠంలోని ఏకవచన నామవాచకం ‘ఆయన చెయ్యి’ని ప్రధాన పాఠంలో యథాతథంగా నిలుపుతుంది; తరువాతి క్రియ బహువచన రూపంలో ఉండే వ్యాకరణ అసమతౌల్యాన్ని పాదటిప్పణిలో తెలియజేస్తుంది.
- source_word: תִּרְפֶּינָה
  choice: స్వస్థపరుస్తుంది
  rationale: רפא యొక్క ‘స్వస్థపరచు’ భావాన్ని స్పష్టంగా ఇస్తుంది. తెలుగు ప్రధాన వాక్యంలో ఏకవచన ‘చెయ్యి’కి అనుగుణంగా క్రియను ఏకవచనంగా ఇచ్చి, హీబ్రూ బహువచన క్రియను పాదటిప్పణిలో నమోదు చేసింది.
theological_decisions:
- issue: బాధకూ స్వస్థతకూ దేవుడే ప్రత్యక్ష కర్తగా ఉండటం
  choice: బాధ కలిగించడం, చితకగొట్టడం, కట్టు కట్టడం, స్వస్థపరచడం అన్నిటికీ దేవుడినే కర్తగా ఉంచడం
  alternative: మొదటి భాగాన్ని ‘బాధను అనుమతిస్తాడు’ అని మృదువుగా చెప్పడం
  rationale: హీబ్రూ వచనం బాధకూ పునరుద్ధరణకూ దేవుడినే నేరుగా కర్తగా పేర్కొంటుంది. ఆ వేదాంతపరమైన ఉద్వేగాన్ని తగ్గించకుండా అనువాదం నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ‘కట్టు కడతాడు’ వైద్యచిత్రాన్ని సహజంగా ఉంచుతుంది; ‘చితకగొడతాడు’ కవితా తీవ్రతను నిలుపుతుంది. పాదటిప్పణి సూచిక [a] ప్రధాన పాఠంలో ఉంది.
