  yaml_path: translation/ot/job/005/007.yaml
  text: For man is born for trouble[a], and the sons of flame fly upward.
translation:
  language: te
  text: 'ఎందుకంటే మనిషి కష్టానికే పుడతాడు;

    అగ్నిపుత్రులు[a] పైకి ఎగురుతారు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నిప్పురవ్వలు పైకి ఎగురుతాయి.” హెబ్రీలో అక్షరార్థంగా “అగ్నిపుత్రులు” అని ఉంది; దీనిని “రెషెఫ్ పుత్రులు” అని కూడా అర్థం చేసుకునే అవకాశం ఉంది. ఈ నుడికారాన్ని సాధారణంగా నిప్పురవ్వలకు సూచనగా గ్రహిస్తారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి వాక్యానికి ఎలీఫజు ఇస్తున్న వివరణను సూచిస్తుంది; సందర్భంలో కారణార్థక అనుసంధానం సహజంగా ఉంటుంది.
- source_word: אָדָם
  choice: మనిషి
  rationale: ఏ మానవునికైనా వర్తించే ఏకవచన సామాన్య నామంగా, సామెతసదృశమైన రూపాన్ని నిలుపుతుంది.
- source_word: לְעָמָל
  choice: కష్టానికే
  rationale: עָמָל శ్రమ, బాధ, దురవస్థ అనే విస్తృత భావాలను కలిగి ఉంది. ఇక్కడ ‘కష్టం’ మానవ జీవితంలోని శ్రమనూ బాధనూ అతిగా నిర్దిష్టీకరించకుండా వ్యక్తం చేస్తుంది; ‘కే’ జననం–కష్టం మధ్య ఉన్న బలమైన సంబంధాన్ని తెలుగులో సహజంగా చూపుతుంది.
- source_word: יוּלָּד
  choice: పుడతాడు
  rationale: సర్వకాలిక మానవ అనుభవాన్ని తెలిపే జ్ఞానోక్తిలో హెబ్రీ నిష్క్రియ రూపాన్ని తెలుగులో సహజమైన సాధారణ వర్తమాన క్రియగా అందిస్తుంది.
- source_word: וּבְנֵי רֶשֶׁף
  choice: అగ్నిపుత్రులు
  rationale: అక్షరార్థమైన ‘అగ్ని/రెషెఫ్ కుమారులు’ అనే కావ్యచిత్రాన్ని సంక్షిప్త సమాసంతో నిలుపుతుంది. ఇది సాధారణంగా నిప్పురవ్వలకు సూచనగా అర్థం చేసుకున్నా, మూలంలోని నిజమైన అస్పష్టతను ప్రధాన పాఠ్యంలో తొలగించదు.
- source_word: יַגְבִּיהוּ עוּף
  choice: పైకి ఎగురుతారు
  rationale: ‘ఎత్తుగా చేయడం/ఎగరడం’ అనే రెండు అంశాల సమ్మిళిత భావాన్ని సహజమైన తెలుగు క్రియాబంధంతో వ్యక్తం చేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన జ్ఞానోక్తి శైలి ఉపయోగించబడింది. మూలంలోని సమాంతర నిర్మాణం, కావ్యచిత్రం, ‘అగ్నిపుత్రులు’ అనే వివాదాస్పద నుడికారం నిలుపబడ్డాయి; పాఠకునికి సాధారణ అర్థం పాదటిప్పణిలో ఇవ్వబడింది.
