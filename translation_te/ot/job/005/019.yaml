source:
  edition: WLC
  text: בְּ/שֵׁ֣שׁ צָ֭רוֹת יַצִּילֶ֑/ךָּ וּ/בְ/שֶׁ֓בַע לֹא יִגַּ֖ע בְּ/ךָ֣ רָֽע׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/005/019.yaml
  text: In six troubles he will deliver you[a]; even in seven[b], no evil will touch you.
translation:
  language: te
  text: ఆరు కష్టాల్లో ఆయన నిన్ను విడిపిస్తాడు[a]; ఏడింటిలోనూ ఏ హానీ నిన్ను తాకదు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ఆరు... ఏడు’ అనేది హీబ్రూ కవిత్వంలోని సంఖ్యాత్మక ప్రయోగం. ఇది తప్పనిసరిగా సరిగ్గా ఏడు కష్టాల పరిమితిని కాక, మళ్లీ మళ్లీ లేదా సంపూర్ణంగా కలిగే విమోచనను సూచిస్తుంది.
    reason: cultural_note
  - marker: b
    text: లేదా ‘ఏ కీడూ నిన్ను తాకదు’; ‘ఏ ఆపదా నిన్ను చేరదు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּ/שֵׁשׁ
  choice: ఆరు కష్టాల్లో
  rationale: בְּ ఉపసర్గను సంఖ్యతో కలిపి సందర్భాన్ని సూచించే ‘లో’గా సహజంగా అనువదించాం; సంఖ్యాత్మక కవితా రూపాన్ని నిలిపాం.
- source_word: צָרוֹת
  choice: కష్టాలు
  rationale: ఈ పదం ఇబ్బందులు, ఆపదలు, బాధాకర పరిస్థితులు అనే విస్తృత భావాన్ని ఇస్తుంది; ‘కష్టాలు’ ఆధునిక తెలుగులో సహజంగా ఉండి భావాన్ని అనవసరంగా పరిమితం చేయదు.
- source_word: יַצִּילֶךָּ
  choice: ఆయన నిన్ను విడిపిస్తాడు
  rationale: నצל హిఫీల్ రూపం ‘విడిపించు, రక్షించు’ అని అర్థం. ‘విడిపిస్తాడు’ ప్రమాదం లేదా కష్టం నుండి బయటపడే భావాన్ని స్పష్టంగా ఇస్తుంది; హీబ్రూలోని పరోక్ష పురుష ఏకవచన కర్తను ‘ఆయన’గా ఉంచాం.
- source_word: וּ/בְ/שֶׁבַע
  choice: ఏడు కష్టాలు వచ్చినా
  rationale: ‘ఆరు... ఏడు’ అనే ఆరోహణాత్మక సంఖ్యా సమాంతరత్వాన్ని నిలుపుతూ, ఏడవ కష్ట పరిస్థితిలోనూ అనే పరాకాష్ఠ భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: לֹא יִגַּע
  choice: తాకదు
  rationale: נגע యొక్క ప్రాథమిక ‘తాకు/చేరు’ భావాన్ని నిలుపుతుంది; హాని వ్యక్తిని ప్రభావితం చేయదనే కవితా రూపకాన్ని కాపాడుతుంది.
- source_word: בְּךָ
  choice: నిన్ను
  rationale: נגעతో వచ్చిన בְּ ప్రభావిత వ్యక్తిని సూచిస్తుంది; తెలుగులో ‘నిన్ను తాకదు’ సహజ నిర్మాణం.
- source_word: רָע
  choice: హాని
  rationale: ఈ సందర్భంలో רָע నైతిక దుష్టత్వం కంటే హానికరమైన ఆపద లేదా కీడును సూచిస్తుంది. ‘హాని’ ఆ సందర్భార్థాన్ని స్పష్టంగా ఇస్తుంది; ప్రత్యామ్నాయ విస్తృతార్థాలను పాదసూచికలో ఉంచాం.
theological_decisions:
- issue: ‘విడిపిస్తాడు’ అనే క్రియలో అంతర్లీనంగా ఉన్న కర్త ఎవరనే విషయం
  choice: ‘ఆయన’ అనే సర్వనామాన్ని ఉపయోగించడం
  alternative: ‘దేవుడు నిన్ను విడిపిస్తాడు’ అని స్పష్టీకరించడం
  rationale: సందర్భంలో దేవుడే కర్త అని స్పష్టమైనా, ఈ వచనంలోని హీబ్రూ పాఠంలో దైవనామం ప్రత్యక్షంగా లేదు. అందువల్ల ‘ఆయన’ మూలపాఠ రూపాన్ని కాపాడి, లేని నామాన్ని చేర్చకుండా ఉంటుంది.
- issue: ‘ఆరు... ఏడు’ సంఖ్యా సూత్రం యొక్క భావం
  choice: సంఖ్యలను ప్రధాన పాఠంలో నిలిపి, ఆరోహణాత్మక సంపూర్ణతను సహజ వాక్య నిర్మాణంతో సూచించడం
  alternative: ఖచ్చితంగా ఆరు లేదా ఏడు కష్టాల సంఖ్యగా అర్థం చేసుకోవడం; లేదా ‘ఎన్ని కష్టాలైనా’ అని పూర్తిగా వివరణాత్మకంగా మార్చడం
  rationale: హీబ్రూ జ్ఞానకావ్యంలో ఈ సంఖ్యా సమాంతరత్వం పునరావృతమైన లేదా సమగ్ర విమోచనను సూచిస్తుంది. సంఖ్యలను తొలగించకుండా ఉంచడం కవితా రూపాన్ని, దాని భావ ఉద్రిక్తతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కవితా శైలిని వాడాం. ‘ఆయన’ ద్వారా సందర్భంలోని దైవ సూచనను నిలిపినా, మూలంలో లేని ‘దేవుడు’ అనే నామాన్ని చేర్చలేదు. ‘ఆరు... ఏడు’ నిర్మాణాన్ని ప్రధాన పాఠంలో కాపాడి, దాని సాంస్కృతిక-కవితా భావాన్ని పాదసూచికలో వివరించాం.
