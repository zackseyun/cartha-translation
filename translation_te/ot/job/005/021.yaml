translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. హెబ్రీ మూలంలోని ‘నాలుక కొరడా’ రూపకాన్ని సమతలీకరించకుండా నిలిపి, భవిష్యదాశ్వాస స్వరాన్ని కాపాడింది.
