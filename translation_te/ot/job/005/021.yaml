translation:
  language: te
  text: నాలుక అనే కొరడా దెబ్బ నుండి నీవు దాచబడతావు[a]; నాశనం వచ్చినప్పుడు నీవు భయపడవు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “నాలుక అనే కొరడా దెబ్బ.” ఇది దూషణాత్మకమైన లేదా అపవాదపూరితమైన మాటలకు రూపకం.
    reason: lexical_alternative
  - marker: b
    text: “నాశనం” అనే పదాన్ని “విధ్వంసం” లేదా “వినాశం” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשׁוֹט לָשׁוֹן
  choice: నాలుక కొరడా దెబ్బ నుండి
  rationale: శׁוֹט అనే పదానికి కొరడా అనే అక్షరార్థం ఉంది; לָשׁוֹןతో కలిసి ఇది దూషణాత్మకమైన లేదా అపవాదుతో కూడిన మాటల దాడిని సూచించే సజీవ రూపకంగా నిలుస్తుంది. తెలుగులో ‘నాలుక కొరడా దెబ్బ’ ఆ రూపకాన్ని సహజంగా నిలుపుతుంది.
- source_word: תֵּחָבֵא
  choice: నీవు దాచబడతావు
  rationale: חבא ధాతువు నిఫాల్ రూపం దాచబడడం లేదా కనబడకుండా ఉంచబడడం అనే భావాన్ని ఇస్తుంది. కర్తరి భావాన్ని జోడించకుండా మూలంలోని కర్మణి రూపాన్ని నిలిపింది.
- source_word: וְלֹא תִירָא
  choice: నీవు భయపడవు
  rationale: నిషేధార్థక అసంపూర్ణ క్రియారూపంలోని భవిష్యదాశ్వాసాన్ని నేరుగా వ్యక్తం చేస్తుంది; ‘భయపడనక్కరలేదు’ కంటే మూలానికి దగ్గరగా ఉంటుంది.
- source_word: מִשֹּׁד
  choice: నాశనం
  rationale: שֹׁד హింసాత్మక నాశనం, విధ్వంసం లేదా వినాశాన్ని సూచిస్తుంది. ‘నాశనం’ ఆధునిక తెలుగులో స్పష్టంగా ఉండి పదం యొక్క విస్తృత భావాన్ని కాపాడుతుంది.
- source_word: כִּי יָבֹוא
  choice: వచ్చినప్పుడు
  rationale: ఇక్కడ כִּי కాలార్థకంగా గ్రహించడం సందర్భానికి సరిపోతుంది; నాశనం వచ్చే సమయంలోనూ భయపడకపోవడాన్ని సూచిస్తుంది.
