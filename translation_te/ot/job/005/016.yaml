  text: So there is hope for the poor[a], and injustice shuts its mouth.
translation:
  language: te
  text: కాబట్టి దీనులకు ఆశ ఉంటుంది; అన్యాయం తన నోరు మూసుకుంటుంది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దుష్కార్యం తన నోరు మూసుకుంటుంది”; మరింత అక్షరార్థంగా, “దాని నోరు మూసుకుంది.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּהִי
  choice: కలుగుతుంది
  rationale: ఈ వయ్యిక్తోల్ రూపం ముందటి వర్ణన ఫలితాన్ని పరిచయం చేస్తుంది. తెలుగు వర్తమాన రూపం ఇక్కడి సామెతసదృశమైన, ఫలితార్థక భావాన్ని సహజంగా తెలియజేస్తుంది; ‘కాబట్టి’ ముందటి సందర్భంతో అనుసంధానాన్ని చూపుతుంది.
- source_word: לַדַּל
  choice: దీనులకు
  rationale: דַּל పేదరికంతోపాటు బలహీనతను, సామాజిక నిస్సహాయతను కూడా సూచించగలదు. ‘దీనులు’ ఈ విస్తృత భావాన్ని గౌరవప్రదంగా, సంక్షిప్తంగా అందిస్తుంది.
- source_word: תִּקְוָה
  choice: నిరీక్షణ
  rationale: ఈ నామవాచకం ఆశ లేదా ఎదురుచూపును సూచిస్తుంది. ఇక్కడ అన్యాయం నిశ్శబ్దమవడంతో ఏర్పడే సానుకూల భవిష్యత్ భావానికి ‘నిరీక్షణ’ తగినది.
- source_word: וְעֹלָתָה
  choice: అన్యాయం
  rationale: עַוְלָה అన్యాయాన్ని లేదా దుష్కార్యాన్ని సూచిస్తుంది. దీనుల నిరీక్షణకు విరుద్ధంగా సామాజిక దౌర్జన్యం ఓడిపోవడాన్ని ‘అన్యాయం’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: קָפְצָה פִּיהָ
  choice: తన నోరు మూసుకుంటుంది
  rationale: అక్షరార్థంగా ‘దాని నోరు మూసుకుంది.’ అన్యాయాన్ని వ్యక్తీకరిస్తూ అది ఇక మాట్లాడలేని స్థితిని చూపే హీబ్రూ దృశ్యరూపాన్ని ఈ అనువాదం నిలుపుతుంది.
