- from: కాబట్టి దీనులకు నిరీక్షణ కలుగుతుంది; అన్యాయం తన నోరు మూసుకుంటుంది.[a]
  to: కాబట్టి దీనులకు ఆశ ఉంటుంది; అన్యాయం తన నోరు మూసుకుంటుంది.[a]
  rationale: The revision changes only ‘నిరీక్షణ కలుగుతుంది’ to the more idiomatic modern Telugu ‘ఆశ ఉంటుంది.’ It preserves the discourse connection, the broad vulnerable sense of דַּל, the social/moral force of ‘అన్యాయం,’ and the vivid personified image of its mouth being shut. The footnote remains anchored to the final clause and preserves both the lexical alternative and the more literal perfect-form wording.
