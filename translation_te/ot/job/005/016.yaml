review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately conveys the Hebrew result/contrast: hope belongs to the socially vulnerable, while injustice is silenced. The present-tense rendering is acceptable for the verse’s generalizing force. The image of injustice closing its own mouth is retained.'
  naturalness: ‘నిరీక్షణ కలుగుతుంది’ is intelligible but sounds more formal and less idiomatic here than ‘ఆశ ఉంటుంది.’ The latter is natural modern standard Telugu and directly conveys תִּקְוָה. ‘దీనులకు’ suitably retains the broad sense of the poor/weak/socially powerless.
  terminology: ‘అన్యాయం’ is a strong contextual equivalent for עַוְלָה. ‘తన నోరు మూసుకుంటుంది’ appropriately preserves the Hebrew personification. The alternative ‘దుష్కార్యం’ is possible, though ‘తప్పు పని’ would be less fitting because the Hebrew is an abstract moral-social evil; retaining the supplied alternative is acceptable.
  issues:
  - severity: low
    issue: Less idiomatic wording for hope
    rationale: ‘నిరీక్షణ కలుగుతుంది’ is formal and can suggest expectation or waiting. In this antithetical assurance, ‘ఆశ ఉంటుంది’ is clearer and more natural while preserving the Hebrew noun’s sense.
  revised_text: కాబట్టి దీనులకు ఆశ ఉంటుంది; అన్యాయం తన నోరు మూసుకుంటుంది.[a]
