    text: అక్షరాలా, “తన అంగిలిలోనే.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחְמֹל עָלֶיהָ
  choice: దాన్ని వదులుకోవడానికి ఇష్టపడడు
  rationale: חמל సాధారణంగా ‘కనికరించు/విడిచిపెట్టు’ అనే భావాలను ఇస్తుంది. ఇక్కడ మునుపటి వచనంలోని తీపిగా ఆస్వాదించే దుష్టత్వాన్ని వదులుకోకుండా ఉంచుకోవడమే సందర్భార్థం; అందువల్ల ఈ సహజమైన తెలుగు రూపం ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: וְלֹא יַעַזְבֶנָּה
  choice: దాన్ని విడిచిపెట్టడు
  rationale: עזב అంటే విడిచిపెట్టు, వదిలివేయు. మూలంలోని పునరుక్తి బలాన్ని నిలుపుతూ సరళంగా అనువదించబడింది.
- source_word: וְיִמְנָעֶנָּה
  choice: దాన్ని దాచిపెడతాడు
  rationale: מנע కు నిలిపివేయు, వెనక్కి ఉంచు, అట్టిపెట్టు అనే పరిధి ఉంది. నోటిలో మింగకుండా ఉంచుకునే ఈ రూపకంలో ‘దాచిపెడతాడు’ సహజంగా ఉండి, విలువైనదిగా అట్టిపెట్టుకునే భావాన్నీ అందిస్తుంది.
- source_word: בְּתוֹךְ חִכּוֹ
  choice: తన అంగిలిలోనే
  rationale: חך అనేది నోటి పైభాగమైన అంగిలిని సూచిస్తుంది. ‘నోటిలో’ అని సాధారణీకరించకుండా మూలంలోని నిర్దిష్ట శరీరాంగ చిత్రణను తెలుగులో సహజంగా నిలిపింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; జ్ఞానసాహిత్య కవిత్వానికి తగిన గంభీరతతో, మూలంలోని మూడు దశల పట్టుదల—వదులుకోవడానికి ఇష్టపడకపోవడం, విడిచిపెట్టకపోవడం, అంగిలిలో అట్టిపెట్టుకోవడం—నిలుపబడింది.
