translation:
  language: te
  text: అతడు దాన్ని వదులుకోవడానికి ఇష్టపడడు; దాన్ని విడిచిపెట్టడు; తన నోటిలోనే[a] దాన్ని ఉంచుకుంటాడు.
  philosophy: optimal-equivalence
  footnotes:
