  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: הֲ/זֹ֣את יָ֭דַעְתָּ מִנִּי עַ֑ד מִנִּ֤י שִׂ֖ים אָדָ֣ם עֲלֵי אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/020/004.yaml
  text: Have you known this from of old[a], since man was placed on the earth?
translation:
  language: te
  text: భూమిమీద మానవుడు[a] ఉంచబడినప్పటి నుండి, ఇది నీకు పూర్వకాలం నుంచే తెలుసు కదా?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “మానవజాతి.”
    reason: אָדָם ఇక్కడ ఏకవచన రూపంలో ఉన్నప్పటికీ మానవాళిని సమష్టిగా సూచించవచ్చు.
lexical_decisions:
- source_word: הֲזֹאת
  choice: ఇది ... కదా?
  rationale: సూచనార్థక పదాన్ని ‘ఇది’గా ఉంచి, הֲ ప్రశ్నార్థక రూపంలోని అలంకారిక ప్రశ్న భావాన్ని సహజమైన తెలుగు ‘కదా?’తో వ్యక్తం చేసింది.
- source_word: יָדַעְתָּ
  choice: నీకు ... తెలుసు
  rationale: దీర్ఘకాలంగా కొనసాగుతున్న జ్ఞానాన్ని సూచించే సందర్భంలో తెలుగు వర్తమాన స్థితిరూపం సహజంగా ఉంటుంది; రెండవ పురుష ఏకవచనాన్ని ‘నీకు’ నిలుపుతుంది.
- source_word: מִנִּי עַד
  choice: పూర్వకాలం నుంచే
  rationale: సుదూర గతకాలాన్ని సూచించే హీబ్రూ కాలవాచక నుడికారాన్ని సాధారణ పాఠకులకు స్పష్టమైన, గంభీరమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: מִנִּי שִׂים
  choice: ఉంచబడినప్పటి నుంచే
  rationale: ‘ఉంచడం మొదలైన కాలం నుంచి’ అనే కాలారంభ భావాన్ని తెలుగు వాక్యనిర్మాణంలో సహజంగా, కర్మణి రూపంతో నిలుపుతుంది.
- source_word: שִׂים
  choice: ఉంచబడిన
  rationale: భూమిమీద మనిషిని ఉంచడం అనే స్థానార్థక భావాన్ని ‘ఉంచు’ నేరుగా తెలియజేస్తుంది; ‘స్థాపించు’ వంటి అధిక వ్యాఖ్యానభారం జోడించదు.
- source_word: אָדָם
  choice: మానవుడు
  rationale: హీబ్రూలోని ఏకవచన, జాతివాచక రూపాన్ని తెలుగులో ఏకవచన ప్రతినిధి పదంతో నిలుపుతుంది. సమష్టి భావమైన ‘మానవజాతి’ని పాదటిప్పణిలో ఇచ్చింది.
- source_word: עֲלֵי אָרֶץ
  choice: భూమిమీద
  rationale: స్థానార్థాన్ని సంక్షిప్తంగా, సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: אָדָם అనే పదం జాతివాచక ఏకవచనంగా వాడబడటం
  choice: మానవుడు
  alternative: మానవజాతి
  rationale: మూలంలోని ఏకవచన ప్రతినిధి రూపాన్ని ప్రధాన పాఠ్యంలో నిలుపుతూ, అది ఒక్క పురుషునికే పరిమితం అన్న అపార్థం రాకుండా సమష్టి ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో సూచించింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గంభీరమైన శైలి. మూలంలోని ఒకే అలంకారిక ప్రశ్నను దీర్ఘ విరామచిహ్నంతో అనుసంధానించి, రెండు కాలవాచక భాగాల సంబంధాన్ని నిలిపింది.
