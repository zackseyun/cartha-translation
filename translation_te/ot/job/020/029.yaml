source:
  edition: WLC
  text: זֶ֤ה חֵֽלֶק אָדָ֣ם רָ֭שָׁע מֵ/אֱלֹהִ֑ים וְ/נַחֲלַ֖ת אִמְר֣/וֹ מֵ/אֵֽל׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/job/020/029.yaml
  text: This is the portion of a wicked man from God[a], the inheritance appointed for him from the Mighty One.
translation:
  language: te
  text: దుష్టుడైన మనిషికి దేవుని నుండి కలిగే భాగమూ, బలవంతుడైన దేవుని నుండి అతనికి నిర్ణయించబడిన వారసత్వమూ ఇదే.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దేవుని నుండి అతని ఉక్తి యొక్క వారసత్వం.” హీబ్రూ పదాన్ని మరింత అక్షరార్థంగా “అతని మాట/ఉక్తి” అని చదవవచ్చు; ఇక్కడ అది దేవుడు అతనికోసం పలికినది లేదా నిర్ణయించినదాన్ని సూచించే అవకాశం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶה
  choice: ఇదే
  rationale: జోఫరు ముగింపు సారాంశాన్ని సూచించే నిర్దేశక సర్వనామం; తెలుగులో ‘ఇదే’ సహజంగా, బలంగా ఉంటుంది.
- source_word: חֵלֶק
  choice: భాగం
  rationale: కేటాయించబడిన వాటా లేదా ఫలితాన్ని సూచిస్తుంది; తీర్పు సందర్భంలో ‘భాగం’ స్పష్టంగా ఉండి కావ్య సమాంతరతను నిలుపుతుంది.
- source_word: אָדָם רָשָׁע
  choice: దుష్టుడైన మనిషి
  rationale: హీబ్రూలో పుంలింగ ఏకవచనంలో ఉన్న సాధారణ ప్రతినిధి ప్రయోగాన్ని నిలుపుతుంది.
- source_word: מֵאֱלֹהִים
  choice: దేవుని నుండి
  rationale: దుష్టునికి దక్కే తీర్పుకు ఏకైక దేవుడే మూలమని సందర్భం స్పష్టం చేస్తుంది.
- source_word: וְנַחֲלַת
  choice: వారసత్వం
  rationale: ‘భాగం’తో సమాంతరంగా కేటాయించబడిన స్వాస్థ్యాన్ని సూచించే మూలరూపాన్ని నిలుపుతుంది.
- source_word: אִמְרוֹ
  choice: అతనికి నిర్ణయించబడిన
  rationale: అక్షరార్థంగా ‘అతని మాట/ఉక్తి’ అయినా, సందర్భంలో దేవుడు పలికి నిర్ణయించిన కేటాయింపును సూచించే అవకాశముంది; అస్పష్టతను పాదటిప్పణిలో ఉంచాం.
- source_word: מֵאֵל
  choice: సర్వశక్తుని నుండి
  rationale: אֵל అనే దైవ బిరుదులోని శక్తి భావాన్ని తెలిపి, אֱלֹהִיםతో ఉన్న కవితాత్మక పదవైవిధ్యాన్ని కాపాడుతుంది.
theological_decisions:
- issue: אָדָם అనే సాధారణ ఏకవచన ప్రయోగం
  choice: దుష్టుడైన మనిషి
  alternative: దుష్ట వ్యక్తి
  rationale: మూలంలోని పుంలింగ ఏకవచన రూపాన్ని, దాని ప్రతినిధి భావాన్ని నిలుపుతుంది.
- issue: אִמְרוֹ యొక్క అర్థం
  choice: అతనికి నిర్ణయించబడిన
  alternative: అతని మాట / అతని ఉక్తి
  rationale: దుష్టునికి దేవుని నుండి కేటాయించబడిన ఫలితమే సందర్భంలోని భావం. అయితే మూలపదం ‘మాట/ఉక్తి’ అని మరింత అక్షరార్థంగా కూడా అర్థమవుతుంది కాబట్టి ఆ ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో భద్రపరిచాం.
- issue: אֵל దైవ బిరుదు
  choice: సర్వశక్తుడు
  alternative: దేవుడు
  rationale: రెండు పాదాల్లోని దైవనామ వైవిధ్యాన్ని చెరపకుండా బిరుదులోని బలశక్తి భావాన్ని తెలుగులో వ్యక్తం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన జ్ఞానసాహిత్య శైలి. మూలంలోని రెండు సమాంతర పాదాలు, ‘భాగం/వారసత్వం’ అనే న్యాయతీర్పు-కేటాయింపు భావం, దైవబిరుదుల వైవిధ్యం నిలుపబడ్డాయి.
