- from: దుష్టుడైన మనిషికి దేవుని నుండి కలిగే భాగం ఇదే; సర్వశక్తుని నుండి అతనికి నిర్ణయించబడిన వారసత్వం ఇదే.[a]
  to: దుష్టుడైన మనిషికి దేవుని నుండి కలిగే భాగమూ, బలవంతుడైన దేవుని నుండి అతనికి నిర్ణయించబడిన వారసత్వమూ ఇదే.[a]
  rationale: The revision corrects the over-specific rendering of אֵל, restores the source’s single-predicate parallel structure, and clarifies the footnote while retaining the significant ambiguity of אִמְרוֹ. No doctrinal interpretation beyond the contextual judicial-allotment sense has been imposed.
