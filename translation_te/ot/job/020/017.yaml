translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కావ్య వాక్యంగా రూపొందించాం. మూలంలోని కాలువలు–నదులు–వాగులు అనే సమృద్ధిని బలపరిచే పదసంచయాన్ని తొలగించకుండా నిలిపాం.
