  yaml_path: translation/ot/job/020/017.yaml
  text: He will not look upon streams[a], rivers flowing with honey and curds.
translation:
  language: te
  text: అతడు తేనె, పెరుగు ప్రవహించే ప్రవాహాలను[a], నదులను, వాగులను చూడడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతడు తేనె, పెరుగు గల జలమార్గాలను, నదులను, వాడీలను చూడడు.” హీబ్రూలో వరుసగా వచ్చిన మూడు జలపదాల మధ్య ఖచ్చితమైన భేదం కవితాత్మక సందర్భంలో పూర్తిగా నిర్ధారించలేము.
    reason: פּלגּות, נהרי, נחלי పదాలకు సాధ్యమైన ప్రత్యామ్నాయ అర్థాలను మరియు వాటి కవితాత్మక సమాంతరతను సూచిస్తుంది.
lexical_decisions:
- source_word: אַל יֵרֶא
  choice: చూడడు
  rationale: కావ్య సందర్భంలో אַל తో కూడిన అసంపూర్ణ క్రియ నిషేధాత్మక భవిష్యదర్థాన్ని ఇస్తుంది. ఇది ఆ దుష్టుడు సమృద్ధిని అనుభవించడని తెలిపే సహజమైన తెలుగు రూపం.
- source_word: בִפְלַגּוֹת
  choice: కాలువలను
  rationale: פּלגּות నీరు ప్రవహించే కాలువలు లేదా ప్రవాహ మార్గాలను సూచిస్తుంది. ראה క్రియతో ఉన్న ב ఉపసర్గను తెలుగులో ప్రత్యక్ష కర్మగా సహజంగా వ్యక్తపరిచాం.
- source_word: נַהֲרֵי
  choice: నదులను
  rationale: נהר పదం యొక్క బహువచన నిర్మాణరూపం ‘నదులు.’ మూలంలోని సమృద్ధి చిత్రణలో వరుసగా వచ్చే జలపదాలను నిలిపేందుకు దీనిని ప్రత్యేకంగా అనువదించాం.
- source_word: נַחֲלֵי
  choice: వాగులను
  rationale: נחל వాగు, వరదవాగు, లేదా వాడీని సూచించగలదు. సందర్భంలోని ప్రవహించే సమృద్ధి చిత్రానికి ‘వాగులు’ సాధారణ ఆధునిక తెలుగులో స్పష్టంగా సరిపోతుంది.
- source_word: דְּבַשׁ
  choice: తేనె
  rationale: దీనికి సాధారణమైన, సందర్భోచితమైన తెలుగు సమానం ‘తేనె.’
- source_word: וְחֶמְאָה
  choice: పెరుగు
  rationale: חמאה చిక్కని పాలపదార్థం, పెరుగు, మీగడ లేదా వెన్నను సూచించగలదు. ప్రాచీన పశుపోషక సందర్భంలో ఆధునికంగా తయారుచేసిన వెన్న అనే భావాన్ని రానీయకుండా ‘పెరుగు’ను ఎంచుకున్నాం.
