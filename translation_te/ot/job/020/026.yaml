  text: כָּל חֹשֶׁךְ֮ טָמ֪וּן לִ/צְפּ֫וּנָ֥י/ו תְּ֭אָכְלֵ/הוּ אֵ֣שׁ לֹֽא נֻפָּ֑ח יֵ֖רַע שָׂרִ֣יד בְּ/אָהֳלֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/020/026.yaml
  text: All darkness is hidden up for his treasures[a]; a fire not blown will consume him[c][b]; it will feed on what remains in his tent.
translation:
  language: te
  text: చీకటంతా అతని దాచిన సంపదల కోసం నిల్వచేయబడింది[a]; ఊదబడని అగ్ని అతన్ని దహించివేస్తుంది[b]; అతని గుడారంలో మిగిలిన దానికి అది హాని కలిగిస్తుంది[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘చీకటంతా అతని కోసం నిల్వచేయబడింది.’ ‘అతని దాచినవి/సంపదలు’ అనే భావమున్న హీబ్రూ పదబంధం క్లిష్టమైనది; అది అతని కోసం దాచిపెట్టబడిన విపత్తునైనా, అతని నిల్వల్లో దాచిన వాటినైనా సూచించవచ్చు.
    reason: alternative_reading
  - marker: b
    text: ‘ఊదబడని అగ్ని’ అంటే మనుషులు ఊది రాజేయని లేదా గాలి కొట్టి మండించని అగ్ని కావచ్చు; ఇది దైవికంగా పంపబడిన లేదా ఆర్పలేని అగ్నిని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘అది అతని గుడారంలో బతికినవానికి హాని చేస్తుంది’; లేదా, ‘అది అతని గుడారంలోని శేషానికి హాని కలిగిస్తుంది.’
    reason: alternative_reading
lexical_decisions:
- source_word: כָּל חֹשֶׁךְ
  choice: చీకటంతా
  rationale: ‘అంతా’ అనే పరిమాణార్థాన్ని, తీర్పు/విపత్తును సూచించే ‘చీకటి’ రూపకాన్ని సహజమైన తెలుగు సమాసంలో నిలుపుతుంది.
- source_word: טָמוּן לִצְפּוּנָיו
  choice: అతని దాచిన సంపదల కోసం నిల్వచేయబడింది
  rationale: טמן యొక్క దాచడం/నిల్వ ఉంచడం భావాన్నీ, కష్టమైన לִצְפּוּנָיו పదబంధంలోని దాచిన వస్తువులు లేదా సంపదలు అనే సాధ్యమైన అర్థాన్నీ ప్రతిబింబిస్తుంది; ప్రత్యామ్నాయ నిర్మాణాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: תְּאָכְלֵהוּ אֵשׁ
  choice: అగ్ని అతన్ని దహించివేస్తుంది
  rationale: అగ్ని కర్తగా ఉన్నప్పుడు ‘తినివేయు’ అనే హీబ్రూ రూపకానికి సహజమైన, బలమైన తెలుగు సమానార్థకం.
- source_word: לֹא נֻפָּח
  choice: ఊదబడని
  rationale: మనుషులు ఊది రాజేయని లేదా గాలి కొట్టి మండించని అగ్ని అనే మూలచిత్రాన్ని సంక్షిప్తంగా కాపాడుతుంది.
- source_word: יֵרַע שָׂרִיד
  choice: మిగిలినదాన్ని అది మింగివేస్తుంది
  rationale: יֵרַע సాధారణంగా హాని చేయడాన్ని సూచించినా, అగ్ని సందర్భంలో విధ్వంసక చర్యను ‘మింగివేస్తుంది’ సహజంగా వ్యక్తం చేస్తుంది. שָׂרִיד లోని ‘మిగిలినది/బతికినవాడు’ అనే సందిగ్ధతను పాదటిప్పణిలో సూచించాం.
- source_word: בְּאָהֳלוֹ
  choice: అతని గుడారంలో
  rationale: ‘గుడారం’ అనే స్పష్టమైన కవితాత్మక చిత్రాన్ని నిలుపుతుంది; అది నివాసాన్ని లేదా ఇంటివారిని కూడా సూచించవచ్చు.
theological_decisions:
- issue: ఊదబడని అగ్ని ఎవరి చేత పంపబడిందనే సూచన
  choice: ప్రధాన పాఠ్యంలో కేవలం ‘ఊదబడని అగ్ని’ అని ఉంచడం
  alternative: దేవుడు పంపిన అగ్ని
  rationale: మూలపాఠ్యం అగ్ని మనుషుల చేత రాజేయబడలేదనే చిత్రాన్ని ఇస్తుంది గాని, కర్తను నేరుగా పేర్కొనదు; అందువల్ల దైవిక తీర్పు అనే సాధ్యమైన సూచనను స్పష్టమైన వాక్యంగా మార్చలేదు.
- issue: שָׂרִיד వ్యక్తిని సూచిస్తుందా లేక మిగిలిన వస్తువులను సూచిస్తుందా
  choice: మిగిలినదాన్ని
  alternative: బతికినవాణ్ణి / శేషాన్ని
  rationale: గుడారం సందర్భంలో వ్యక్తులు, ఇంటివారు లేదా ఆస్తిలో మిగిలింది అన్న అవకాశాలు ఉన్నాయి. ప్రధాన పాఠ్యంలో అతిగా నిర్దిష్టం కాకుండా ఉంచి, ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కవితాత్మక శైలిని అనుసరించాం. ‘చీకటి,’ ‘అగ్ని,’ ‘గుడారం’ అనే మూల చిత్రాలను నిలిపి, క్లిష్టమైన హీబ్రూ నిర్మాణాల వద్ద సహజత్వం కోసం పరిమితంగా భావానువాదం చేసి, నిజమైన సందిగ్ధతలను పాదటిప్పణుల్లో భద్రపరిచాం.
