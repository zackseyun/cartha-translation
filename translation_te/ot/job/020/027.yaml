  yaml_path: translation/ot/job/020/027.yaml
  text: The heavens will reveal his iniquity[b][a], and the earth will rise up against him.
translation:
  language: te
  text: ఆకాశాలు అతని దోషాన్ని[a] బయలుపరుస్తాయి; భూమి[b] అతనికి వ్యతిరేకంగా లేస్తుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘అతని అపరాధభారాన్ని’; హీబ్రూ పదం నైతిక తప్పునుగానీ, దానివల్ల కలిగే అపరాధభారాన్నిగానీ సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘నేల’; అయితే ఈ కవితాత్మక సందర్భంలో ‘ఆకాశాలు’ అనే సమాంతర పదానికి ‘భూమి’ మరింత చక్కగా సరిపోతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְגַלּוּ
  choice: బయలుపరుస్తాయి
  rationale: గלה పియేల్ రూపం ఇక్కడ దాచినదాన్ని వెల్లడించడం, బహిర్గతం చేయడం అనే భావాన్నిస్తుంది. ‘బయలుపరుస్తాయి’ సహజమైన ఆధునిక తెలుగులో న్యాయతీర్పు సందర్భంలోని బహిర్గతాన్ని నిలుపుతుంది.
- source_word: שָׁמַיִם
  choice: ఆకాశాలు
  rationale: హీబ్రూలో ఇది బహువచన రూపంలో ఉన్నప్పటికీ సమష్టి భావంతో వాడబడుతుంది. ‘ఆకాశాలు’ మూలరూపాన్నీ, కవితాత్మకంగా వ్యక్తీకరించిన విశ్వసాక్ష్యాన్నీ నిలుపుతుంది.
- source_word: עֲוֺנוֹ
  choice: అతని దోషాన్ని
  rationale: עָוֹן అనేది పాపకార్యం లేదా దానివల్ల కలిగే అపరాధభారం అనే రెండు భావాలను సూచించగలదు. ‘దోషం’ తెలుగులో ఈ రెండింటికీ కొంత విస్తృతి ఇస్తుంది; అసలు పదంలోని సందిగ్ధతను పాదసూచిక స్పష్టం చేస్తుంది.
- source_word: וְאֶרֶץ
  choice: భూమి
  rationale: אֶרֶץకు ‘భూమి’ లేదా ‘దేశం/నేల’ అనే అర్థాలు ఉండవచ్చు. ఆకాశాలతో ఉన్న సమాంతర నిర్మాణం వల్ల ఇక్కడ ‘భూమి’ అనేది అనుకూలమైన అర్థం.
- source_word: מִתְקוֹמָמָה
  choice: లేస్తుంది
  rationale: קום నుండి వచ్చిన ఈ రూపం ఎదిరించడానికి లేచే భావాన్ని కలిగిస్తుంది. ‘లేస్తుంది’ భూమి వ్యక్తీకరణను సజీవంగా ఉంచుతుంది; విరోధ భావం తరువాతి పదబంధంలో వ్యక్తమవుతుంది.
- source_word: לוֹ
  choice: అతనికి విరోధంగా
  rationale: לְ సాధారణంగా ‘అతనికి’ అని ఉన్నా, ఎదిరించి లేవడం అనే క్రియతో కలిసినప్పుడు ప్రతికూల లేదా విరోధ సంబంధాన్ని సూచిస్తుంది. ‘అతనికి విరోధంగా’ ఆ సందర్భార్థాన్ని స్పష్టంగా అందిస్తుంది.
