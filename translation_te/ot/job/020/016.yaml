  rationale: ఒక విషసర్పాన్ని సూచించే ఈ పదానికి ఆధునిక తెలుగులో సహజమైన సమానార్థకంగా ‘కట్లపాము’ను ఎంచుకున్నాం; ఖచ్చితమైన జీవజాతిని హీబ్రూ నిర్బంధించదు.
