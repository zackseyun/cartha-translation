translation:
  language: te
  text: అతన్ని చూసిన కన్ను ఇక అతన్ని చూడదు[a]; అతని స్థలం కూడా ఇక అతన్ని చూడదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అతన్ని తేరి చూసిన కన్ను మళ్లీ అలా చూడదు.’ హీబ్రూలో ‘కన్ను’ ఏకవచనంలో కవితాత్మకంగా వాడబడింది; రెండో పాదంలో ‘అతని స్థలం’ చూడగలదన్నట్లుగా వ్యక్తీకరించబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַיִן
  choice: కన్ను
  rationale: మూలంలోని ఏకవచన కవితాత్మక రూపాన్ని నిలుపుతుంది; ‘ఎవరూ’ అని భావాన్ని విప్పి చెప్పకుండా దృశ్యభాషను కాపాడుతుంది.
- source_word: שְׁזָפַתּוּ
  choice: అతన్ని చూసిన
  rationale: ఈ క్రియకు ‘చూచు/తేరి చూచు’ అనే భావం ఉంది. సందర్భంలోని సమాంతరతకు సహజమైన ఆధునిక తెలుగు ‘చూసిన’ సరిపోతుంది.
- source_word: וְלֹא תוֹסִיף
  choice: ఇక ... చూడదు
  rationale: యసఫ్ క్రియతో కూడిన నిరాకరణ ఇక్కడ మళ్లీ జరగకపోవడాన్ని సూచిస్తుంది; ముందటి క్రియాభావాన్ని తెలుగులో సహజంగా పునరుద్ధరించాం.
- source_word: וְלֹא עוֹד
  choice: కూడా ఇక
  rationale: ‘ఇకపై కాదు/మరెన్నడూ కాదు’ అనే నిలిచిపోవడాన్ని తెలియజేస్తూ, రెండో పాదంలోని సమాంతర బలాన్ని నిలుపుతుంది.
- source_word: תְּשׁוּרֶנּוּ
  choice: అతన్ని చూడదు
  rationale: శూర్ అంటే ‘చూచు, తిలకించు’. సాధారణ పాఠకులకు సహజంగా ఉండేందుకు ‘చూడదు’ ఎంచుకుని, దర్శనానికి సంబంధించిన పాదాల సమాంతరతను కాపాడాం.
- source_word: מְקוֹמוֹ
  choice: అతని స్థలం
  rationale: మూలంలోని అక్షరార్థాన్ని, ఆ స్థలానికి కన్ను ఉన్నట్లుగా చెప్పే కవితాత్మక వ్యక్తీకరణను నిలుపుతుంది.
