  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కవితా శైలి. ఏకవచన ‘కన్ను’ను, ‘స్థలం’ వ్యక్తీకరణను మృదువుగా మార్చకుండా మూలరూపంలో నిలిపాం.
