- from: ఎందుకంటే అతడు పేదలను అణగదొక్కి విడిచిపెట్టాడు; ఒక ఇంటిని బలవంతంగా లాక్కున్నాడు, కానీ దాన్ని కట్టడు.[a]
  to: ఎందుకంటే అతడు పేదలను అణగదొక్కి విడిచిపెట్టాడు; ఒక ఇంటిని బలవంతంగా లాక్కున్నాడు, దాన్ని కట్టడు.
