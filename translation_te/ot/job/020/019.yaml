  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּֽי רִ֭צַּץ עָזַ֣ב דַּלִּ֑ים בַּ֥יִת גָּ֝זַ֗ל וְ/לֹ֣א יִבֶנֵֽ/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/020/019.yaml
  text: For he has crushed and abandoned the poor[a]; he has seized a house and will not rebuild it.
translation:
  language: te
  text: ఎందుకంటే అతడు పేదలను అణగదొక్కి విడిచిపెట్టాడు; ఒక ఇంటిని బలవంతంగా లాక్కున్నాడు, దాన్ని కట్టడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి సందర్భంలో చెప్పిన తీర్పుకు కారణాన్ని పరిచయం చేసే హేత్వర్థక సంధిగా అనువదించబడింది.
- source_word: רִצַּץ
  choice: అణగదొక్కి
  rationale: ‘నలగగొట్టు/చితగ్గొట్టు’ అనే బలమైన మూలచిత్రాన్ని, పేదలపై జరిగిన హింసాత్మక పీడనను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: עָזַב
  choice: విడిచిపెట్టాడు
  rationale: బాధ్యతారహితంగా వదిలేయడం అనే భావాన్ని సరళంగా, నిందార్థాన్ని కోల్పోకుండా వ్యక్తం చేస్తుంది.
- source_word: דַּלִּים
  choice: పేదలను
  rationale: ఆర్థికంగా పేదలు, సామాజికంగా బలహీనులు అనే భావపరిధిలో ఇక్కడ అత్యంత సహజమైన ఎంపిక.
- source_word: בַּיִת
  choice: ఒక ఇంటిని
  rationale: గזל అనే బలవంతపు స్వాధీనపరచుకోవడానికీ, తరువాతి בנה ‘కట్టు’ క్రియకీ సరిపోయే భౌతిక ఇల్లు/ఆస్తి భావాన్ని ఉంచుతుంది.
- source_word: גָּזַל
  choice: బలవంతంగా లాక్కున్నాడు
  rationale: ఈ క్రియలోని దోపిడీ, బలవంతపు స్వాధీనత రెండింటినీ ‘దొంగిలించాడు’ కంటే స్పష్టంగా తెలియజేస్తుంది.
- source_word: וְלֹא יִבֶנֵהוּ
  choice: కానీ దాన్ని కట్టడు
  rationale: ప్రత్యయాన్ని ‘ఇంటి’కే అన్వయిస్తూ, בנה అనే ‘కట్టు/నిర్మించు’ చిత్రాన్ని నిలుపుతుంది; అసంపూర్ణ క్రియారూపానికి సాధ్యమైన భవిష్యత్ భావాన్ని ప్రధాన పాఠ్యంలో ఉంచింది.
theological_decisions:
- issue: וְלֹא יִבֶנֵהוּ యొక్క కాలార్థం మరియు వాక్యసంబంధం
  choice: కానీ దాన్ని కట్టడు
  alternative: తాను కట్టని ఇంటిని బలవంతంగా లాక్కున్నాడు
  rationale: హీబ్రూ అసంపూర్ణ క్రియారూపం భవిష్యత్ ఫలితాన్ని సూచించవచ్చు; అయితే దాన్ని గతకాల సంబంధవాక్యంగా గ్రహించడం కూడా వ్యాకరణపరంగా సాధ్యం. ఏ పఠనాన్నీ సిద్ధాంతపరంగా బలవంతంగా నిర్ణయించకుండా ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు స్పష్టంగా ఉండే శైలి. ‘అణగదొక్కి’ సామాజిక పీడనతో పాటు మూలంలోని నలిపివేత చిత్రాన్ని నిలుపుతుంది; ‘బలవంతంగా లాక్కున్నాడు’ గזל యొక్క బలప్రయోగ దోపిడీ భావాన్ని సహజంగా తెలియజేస్తుంది.
