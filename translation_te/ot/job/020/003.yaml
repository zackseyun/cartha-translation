  yaml_path: translation/ot/job/020/003.yaml
  text: I hear a rebuke that shames me[b][a], and the spirit of my understanding answers me.
translation:
  language: te
  text: 'నన్ను అవమానపరిచే గద్దింపును నేను వింటున్నాను;

    నా అవగాహననుండి వెలువడే ఆత్మ నాకు జవాబు ఇస్తోంది.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నా అవగాహన నుండి వచ్చిన ఆత్మ నాకు జవాబు ఇస్తోంది”; హీబ్రూ పదబంధం అతని జవాబు అతని అవగాహనలోనుంచి వస్తోందని నొక్కిచెప్పవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “నన్ను జవాబివ్వమని ప్రేరేపిస్తోంది”; తన అంతరంగ ఆత్మ అతనిని జవాబిచ్చేలా పురికొల్పుతుందనే భావం ఈ క్రియకు ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: מוּסַר
  choice: గద్దింపు
  rationale: ఈ సందర్భంలో ఇది క్రమశిక్షణ లేదా సాధారణ బోధకన్నా, జోఫరును అవమానపరిచినట్లు అతడు భావించిన మాటల గద్దింపును సూచిస్తుంది.
- source_word: כְּלִמָּתִי
  choice: నన్ను అవమానపరిచే
  rationale: మొదటి పురుష ప్రత్యయంతో ఉన్న ‘అవమానం/అపకీర్తి’ భావాన్ని సహజమైన తెలుగు సంబంధ వాక్యంగా వ్యక్తపరుస్తుంది.
- source_word: אֶשְׁמָע
  choice: నేను వింటున్నాను
  rationale: సందర్భంలో ప్రస్తుతం తనకు వినిపిస్తున్న గద్దింపుకు జోఫరు స్పందిస్తున్న భావాన్ని తెలియజేస్తుంది.
- source_word: רוּחַ
  choice: ఆత్మ
  rationale: ఇక్కడ పదం గాలి లేదా ఊపిరిని కాక, అంతరంగంలో స్పందన కలిగించే ప్రేరక స్వభావాన్ని సూచిస్తుంది; మూలభాషలోని రూపకాన్ని అలాగే నిలుపుతుంది.
- source_word: מִבִּינָתִי
  choice: నా అవగాహన నుండి పుట్టే
  rationale: מִן సూచించగల మూలం లేదా ఉద్భవ భావాన్ని తెలుగులో సహజంగా చూపిస్తూ, ఆ స్పందన అతని అవగాహనలోనుంచి వస్తోందనే భావాన్ని నిలుపుతుంది.
- source_word: יַעֲנֵנִי
  choice: నాకు జవాబిస్తోంది
  rationale: ענה క్రియకు సాధారణమైన ‘జవాబివ్వడం’ అర్థాన్ని, మొదటి పురుష కర్మ ప్రత్యయాన్ని నేరుగా ప్రతిబింబిస్తుంది; ‘నన్ను జవాబివ్వమని ప్రేరేపిస్తోంది’ అనే సాధ్యమైన భావం పాదసూచికలో ఇవ్వబడింది.
