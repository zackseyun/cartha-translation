translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలిని వాడాం. మూలంలోని ‘ఆత్మ’ రూపకాన్ని నిలిపి, מִן యొక్క మూలార్థాన్ని ప్రధాన పాఠ్యంలో స్పష్టంగా చూపించాం; יַעֲנֵנִי లోని ప్రత్యామ్నాయ ప్రేరణార్థాన్ని పాదసూచికలో సంరక్షించాం.
