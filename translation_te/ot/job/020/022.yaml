- from: అతని సమృద్ధి నిండినప్పుడు[a], అతనికి ఇరుకు కలుగుతుంది; దుఃఖంలో ఉన్న ప్రతి ఒక్కరి చెయ్యి[b] అతని మీదికి వస్తుంది.
  to: అతని సమృద్ధి పరిపూర్ణమైనప్పుడు[a], అతడు ఇక్కట్టులో పడతాడు; బాధలో ఉన్నవారి ప్రతి చెయ్యి[b] అతనిమీదికి వస్తుంది.
  rationale: 'The revision improves Telugu idiom while maintaining the Hebrew sequence and imagery: fullness of prosperity, sudden constriction, and every hostile hand coming upon him. It retains ‘చెయ్యి’ rather than replacing it with an interpretive abstraction such as power or force, and the notes preserve viable lexical alternatives for the two disputed expressions.'
