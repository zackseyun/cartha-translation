  text: בִּ/מְלֹ֣אות שִׂ֭פְק/וֹ יֵ֣צֶר ל֑/וֹ כָּל יַ֖ד עָמֵ֣ל תְּבוֹאֶֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/020/022.yaml
  text: In the fullness of his abundance[a], distress will come upon him[b]; every hand of the miserable will come against him.
translation:
  language: te
  text: అతని సమృద్ధి పరిపూర్ణమైనప్పుడు[a], అతడు ఇక్కట్టులో పడతాడు; బాధలో ఉన్నవారి ప్రతి చెయ్యి[b] అతనిమీదికి వస్తుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతని చాలుదల నిండినప్పుడు.” ఇక్కడి హీబ్రూ పదం చాలుదల, పుష్కలత లేదా సమృద్ధి అనే భావాలను ఇవ్వగలదు.
    reason: lexical_alternative
  - marker: b
    text: “బాధలో ఉన్నవారి ప్రతి చెయ్యి” అనే మాటను “కష్టపడేవారి ప్రతి చెయ్యి” లేదా “దురవస్థలో ఉన్నవారి ప్రతి చెయ్యి” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּמְלֹאות
  choice: నిండినప్పుడు
  rationale: 'ב־తో కూడిన מלא రూపం కాలసూచక భావాన్ని ఇస్తుంది: ‘నిండినప్పుడు’ అని అనువదించడం సమృద్ధి పరాకాష్ఠకు చేరిన వేళనే కష్టం వస్తుందనే హీబ్రూ భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.'
- source_word: שִׂפְקוֹ
  choice: అతని సమృద్ధి
  rationale: ספק నుండి వచ్చిన ఈ నామవాచకం చాలుదల, సమృద్ధి లేదా పుష్కలతను సూచించగలదు. సందర్భంలో దుష్టుని సంపదాభివృద్ధిని సూచిస్తున్నందున ‘సమృద్ధి’ సహజంగా సరిపోతుంది; ‘చాలుదల’ అనే ప్రత్యామ్నాయ భావాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: יֵצֶר לוֹ
  choice: అతనికి ఇరుకు కలుగుతుంది
  rationale: ఈ సంక్షిప్త హీబ్రూ ప్రయోగంలో సంకుచిత స్థితి లేదా బాధ కలగడం అనే భావం ఉంది. ‘ఇరుకు కలుగుతుంది’ మూలంలోని సంకుచితత రూపకాన్ని నిలుపుతూ తెలుగులో అర్థవంతంగా ఉంటుంది.
- source_word: כָּל יַד
  choice: ప్రతి ఒక్కరి చెయ్యి
  rationale: כָּל కు పంపిణీ భావంగా ‘ప్రతి’ని, יַד కు దాని స్పష్టమైన రూపకాన్ని కాపాడుతూ ‘చెయ్యి’ని ఎంచుకున్నాం. తెలుగులో వ్యక్తిని స్పష్టం చేయడానికి ‘ఒక్కరి’ చేర్చబడింది.
- source_word: עָמֵל
  choice: దుఃఖంలో ఉన్న
  rationale: עמל శ్రమ, కష్టం, దుఃఖం లేదా దురవస్థను సూచించగలదు. ఇక్కడ దుష్టునికి విరోధంగా వచ్చే వ్యక్తుల దురవస్థను సూచించేలా ‘దుఃఖంలో ఉన్న’ అని ఇచ్చాం; ఇతర సాధ్యమైన భావాలను పాదటిప్పణిలో తెలిపాం.
- source_word: תְּבוֹאֶנּוּ
  choice: అతని మీదికి వస్తుంది
  rationale: בוא క్రియ ప్రత్యయంతో ‘అతని వద్దకు/మీదికి వస్తుంది’ అనే భావం ఇస్తుంది. సందర్భంలోని ప్రతికూలతను అతిగా విపులీకరించకుండా ‘అతని మీదికి వస్తుంది’ అని అనువదించాం.
