translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గంభీరమైన శైలిని వాడాం. హీబ్రూలోని ‘నిండుట,’ ‘ఇరుకు,’ ‘చెయ్యి’ రూపకాలను సాధ్యమైనంత వరకు నిలిపాం. ‘చెయ్యి’ సాధారణ ఆధునిక రూపం; వాక్యంలోని ప్రతికూల సందర్భమే దాని విరోధక పాత్రను తెలియజేస్తుంది.
