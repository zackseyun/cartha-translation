  edition: WLC
  text: מֵשִׁ֣יב יָ֭גָע וְ/לֹ֣א יִבְלָ֑ע כְּ/חֵ֥יל תְּ֝מוּרָת֗/וֹ וְ/לֹ֣א יַעֲלֹֽס׃
base_translation:
  language: en
  yaml_path: translation/ot/job/020/018.yaml
  text: He gives back what he labored for and does not swallow it down; according to the wealth of his exchange[a], he does not rejoice.
translation:
  language: te
  text: తాను కష్టపడి సంపాదించినదాన్ని అతడు తిరిగి ఇస్తాడు; దాన్ని మింగివేయడు. తన మార్పిడి ద్వారా పొందిన సంపదను బట్టి[a] అతడు ఉల్లసించడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘తాను శ్రమించినదాన్ని తిరిగి ఇస్తాడు, దాన్ని అనుభవించడు; మార్పిడి ద్వారా పొందిన సంపద విషయమై అతడు ఉల్లసించడు.’ రెండో పాదంలోని హీబ్రూ వాక్యనిర్మాణం సంక్షిప్తంగా, క్లిష్టంగా ఉంది; అందువల్ల దగ్గరి భావాలున్న అనేక అనువాదాలు సాధ్యమే.
    reason: alternative_reading
lexical_decisions:
- source_word: מֵשִׁיב
  choice: తిరిగి ఇచ్చేస్తాడు
  rationale: שוב హిఫీల్ రూపం ‘తిరిగి వెళ్లేలా చేయడం’ అనే భావాన్ని ఇస్తుంది. దుష్టుడు సంపాదించినదాన్ని వదులుకోవాల్సి రావడాన్ని సహజమైన ఆధునిక తెలుగులో ఈ పదబంధం తెలియజేస్తుంది.
- source_word: יָגָע
  choice: తాను కష్టపడి సంపాదించినదాన్ని
  rationale: ఈ పదం శ్రమను లేదా శ్రమవల్ల లభించినదాన్ని సూచించగలదు. מֵשִׁיבకు కర్మగా ఉన్నందున, ఇక్కడ శ్రమ ఫలితమైన సంపాదన భావాన్ని స్పష్టంగా వ్యక్తం చేశాం.
- source_word: וְלֹא יִבְלָע
  choice: దాన్ని మింగివేయడు
  rationale: בלע యొక్క ‘మింగడం’ అనే సజీవ రూపకాన్ని నిలిపి ఉంచాం. ‘దాన్ని’ అనేది ముందు పేర్కొన్న సంపాదనను సూచిస్తూ సందర్భం నుంచి పూరించబడింది.
- source_word: כְּחֵיל
  choice: సంపదనుబట్టి
  rationale: חֵיל ఇక్కడ సైనిక బలం కంటే సంపద లేదా ఆస్తిని సూచిస్తుంది. כְּ ఉపసర్గలోని పోలిక/అనుపాత భావాన్ని ‘నుబట్టి’ తెలియజేస్తుంది; అయినా నిర్మాణం క్లిష్టమైనందున పాదటిప్పణిలో ప్రత్యామ్నాయం ఇచ్చాం.
- source_word: תְּמוּרָתוֹ
  choice: తన లావాదేవీల వల్ల వచ్చిన
  rationale: תְּמוּרָה మార్పిడి, ప్రతిఫలం, లేదా మార్పిడి ద్వారా పొందినదాన్ని సూచిస్తుంది. ఈ సందర్భంలో ఆర్థిక సంపాదన భావాన్ని సహజ తెలుగులో తెలియజేయడానికి ‘లావాదేవీల వల్ల వచ్చిన’ అని అనువదించాం.
- source_word: וְלֹא יַעֲלֹס
  choice: అతడు సంతోషించడు
  rationale: עלס ఉల్లసించడం లేదా ఆనందించడం అనే భావం కలిగిన పదం. సాధారణ ఆధునిక పాఠకులకు స్పష్టంగా ఉండే ‘సంతోషించడు’ను ఎంచుకున్నాం.
