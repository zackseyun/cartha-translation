translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా అనువదించాం. ‘మింగివేయడు’ అనే మూలంలోని బలమైన రూపకాన్ని నిలిపి ఉంచి, రెండో పాదంలోని నిజమైన భాషాపరమైన అస్పష్టతను [a] పాదటిప్పణిలో వెల్లడించాం.
