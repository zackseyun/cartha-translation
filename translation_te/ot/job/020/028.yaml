  yaml_path: translation/ot/job/020/028.yaml
  text: The produce of his house will be carried away[b][a], flowing away in the day of his anger.
translation:
  language: te
  text: అతని ఇంటి దిగుబడి తొలగిపోతుంది[a]; అతని కోపదినంలో[b] అది ప్రవహించి పోతుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దేశబహిష్కరణకు వెళ్లిపోతుంది’ లేదా ‘వెళ్లిపోతుంది’; ఈ క్రియ వెళ్లిపోవడాన్ని లేదా తొలగించబడడాన్ని సూచించగలదు. ఇక్కడ అది దుష్టుని ఇంటి దిగుబడిని గూర్చి చెప్పబడింది.
    reason: lexical_alternative
  - marker: b
    text: ‘అతని’ అనేది బహుశా దేవుణ్ణి సూచిస్తుంది; అయితే హీబ్రూ పాఠ్యం ఆ సూచనను ప్రత్యక్షంగా చెప్పదు.
    reason: alternative_reading
lexical_decisions:
- source_word: יִגֶל
  choice: తరలిపోతుంది
  rationale: గלה అనే క్రియ ఇక్కడ ఇంటి సంపద వెళ్లిపోవడం లేదా తొలగించబడడం అనే భావాన్ని ఇస్తుంది. కర్తను స్పష్టంగా చేర్చకుండా, తొలగిపోవడమనే ఫలితాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: יְבוּל בֵּיתוֹ
  choice: అతని ఇంటి సంపద
  rationale: יְבוּל ప్రాథమికంగా దిగుబడి లేదా వృద్ధిని సూచిస్తుంది; ‘ఇంటి దిగుబడి’ తెలుగులో అసహజంగా ఉండగలదు. సందర్భంలో ఇంటికి చెందిన సంపాదన, ఆస్తి అనే విస్తృత భావాన్ని ‘ఇంటి సంపద’ సహజంగా తెలియజేస్తుంది.
- source_word: נִגָּרוֹת
  choice: ప్రవాహంలా కొట్టుకుపోతుంది
  rationale: נגר రూపం పోయబడడం లేదా ప్రవహించి వెళ్లిపోవడం అనే చిత్రాన్ని ఇస్తుంది. సంపద నాశనకరంగా వెళ్లిపోతున్న దృశ్యాన్ని తెలుగులో స్పష్టంగా ఉంచేందుకు ఈ రూపం ఎంచుకోబడింది.
- source_word: בְּיוֹם אַפּוֹ
  choice: అతని కోపదినాన
  rationale: హీబ్రూ కాలసూచక నుడికారాన్ని గంభీరమైన, సంక్షిప్త తెలుగు రూపంలో నిలుపుతుంది; సర్వనామం ఎవరిని సూచిస్తుందో ప్రధాన పాఠ్యంలో స్పష్టీకరించదు.
theological_decisions:
- issue: ‘అతని కోపం’లోని సర్వనామ సూచన
  choice: ప్రధాన పాఠ్యంలో ‘అతని కోపదినాన’ అని మాత్రమే ఉంచడం
  alternative: ‘దేవుని కోపదినాన’ అని స్పష్టంగా అనువదించడం
  rationale: సందర్భం దేవుని తీర్పును బలంగా సూచించినా, హీబ్రూ వాక్యం దేవుని పేరును ఇక్కడ ప్రత్యక్షంగా చెప్పదు. అందువల్ల అసలు పాఠ్యంలోని సంక్షిప్తతను, స్వల్ప అస్పష్టతను నిలిపి, సంభావ్య సూచనను పాదటిప్పణిలో వివరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కవితా ధోరణి వాడబడింది. ‘దిగుబడి’ అనే అక్షరార్థ రూపం ఇంటితో కలిపినప్పుడు అసహజంగా ఉండటం వల్ల సందర్భానుగుణంగా ‘సంపద’ ఎంచుకోబడింది. రెండు హీబ్రూ భాగాల సమాంతరత్వాన్ని అర్థవిరామంతో నిలిపి, ప్రవహించి నశించే చిత్రాన్ని రెండో భాగంలో కాపాడాం.
