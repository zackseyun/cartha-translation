  text: His bones are full of his youthful vigor[a], but it will lie down with him in the dust.
translation:
  language: te
  text: అతని ఎముకలు అతని యౌవన బలంతో నిండి ఉన్నాయి[a]; అయితే అది అతనితోపాటు ధూళిలో పడుకుంటుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతని ఎముకలు అతని యౌవనంతో నిండి ఉన్నాయి.” హెబ్రీ పదం యౌవనాన్నే లేదా యౌవనంతో ముడిపడిన బలాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַצְמוֹתָיו
  choice: అతని ఎముకలు
  rationale: עֶצֶם అనే నామవాచకానికి సాధారణ అర్థం ‘ఎముక’; బహువచన రూపాన్ని అలాగే ఉంచడం హెబ్రీలోని స్పష్టమైన దృశ్యాన్ని కాపాడుతుంది.
- source_word: מָלְאוּ
  choice: నిండివున్నాయి
  rationale: מלא యొక్క Qal perfect 3cp రూపం. తెలుగు కవితాత్మక వర్ణనలో అతనిలో ఇంకా ఉన్న యౌవనబలాన్ని సూచించేందుకు ‘నిండివున్నాయి’ సహజంగా ఉంది; రూపం సంపూర్ణ స్థితినీ వ్యక్తం చేయగలదు.
- source_word: עֲלוּמָיו
  choice: యౌవన బలం
  rationale: עֲלוּמִים యౌవనాన్నీ, దానితో ముడిపడిన శక్తినీ సూచించగలదు. సందర్భంలో ఎముకలను నింపిన ప్రాణబలం ప్రధానంగా ఉన్నందున ‘యౌవన బలం’ ఎంచుకున్నాం; ‘అతని యౌవనం’ అనే ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: וְעִמּוֹ
  choice: అతనితోపాటు
  rationale: עִם + 3ms ప్రత్యయం ‘అతనితో’ అని అర్థం. మరణంలో కూడా వెంట ఉండడాన్ని ‘తోపాటు’ సహజంగా తెలియజేస్తుంది.
- source_word: עַל־עָפָר
  choice: ధూళిలో
  rationale: עַל అక్షరార్థంగా ‘మీద’ అయినా, మరణం మరియు సమాధి చిత్రణలో తెలుగు భాషలో ‘ధూళిలో’ సహజంగా ఉండి మూలంలోని ధూళి రూపకాన్ని నిలుపుతుంది.
- source_word: תִּשְׁכָּב
  choice: పడుకుంటుంది
  rationale: שׁכב Qal imperfect 3fs. సూచిత ఏకవచన విషయాన్ని తెలుగులో ‘అది’తో వ్యక్తపరిచి, మరణాన్ని కవితాత్మకంగా ‘పడుకోవడం’గా చూపే మూల చిత్రాన్ని నిలిపాం.
theological_decisions:
- issue: ధూళిలో అతనితో పడుకునేది ఏమిటనే సూచిత కర్త
  choice: ‘అది’ అని ఉంచి, సమీపంలోని ‘యౌవన బలం’తో అనుసంధానించాం
  alternative: ‘యౌవనం’ లేదా ‘యౌవన బలం’ను రెండో పాదంలో మళ్లీ స్పష్టంగా పేర్కొనడం
  rationale: హెబ్రీలో రెండో పాదంలోని స్త్రీలింగ ఏకవచన క్రియకు కర్త ప్రత్యక్షంగా లేదు. దానిని అతని యౌవనం/యౌవనబలంగా గ్రహించడం సహజమైనా, మూలంలోని కవితాత్మక సూచనను పూర్తిగా స్పష్టీకరించకుండా ‘అది’ అని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కవితాత్మక శైలి. ‘ఎముకలు,’ ‘ధూళి,’ ‘పడుకుంటుంది’ అనే concrete imageryను నిలిపి, మూలంలోని మరణ-సమాధి రూపకాన్ని సహజంగా అందించాం.
