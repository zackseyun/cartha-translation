  text: For he knew no quiet in his belly[a]; with his desirable things he will not escape.
translation:
  language: te
  text: 'ఎందుకంటే తన కడుపులో అతడికి నెమ్మది తెలియలేదు;

    అతడు కోరుకున్న వాటి ద్వారా తప్పించుకోలేడు.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తన కడుపులో అతడికి సౌఖ్యం తెలియలేదు; తాను ముచ్చటపడిన వాటి ద్వారా తనను తాను రక్షించుకోలేడు.”
    reason: శָׁלֵוకు ‘సౌఖ్యం’ అనే సమీపార్థం సాధ్యం. అలాగే בַּחֲמוּדוֹను సాధనార్థకంగా తీసుకుని, యְמַלֵּטను ‘తన్నుతాను రక్షించుకొను’ అనే భావంలో అర్థం చేసుకోవచ్చు.
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందున్న తీర్పుకు కారణాన్ని లేదా వివరణను పరిచయం చేస్తుంది; తెలుగు వాక్యప్రవాహంలో ‘ఎందుకంటే’ స్పష్టంగా, సహజంగా ఉంది.
- source_word: לֹא יָדַע
  choice: ఎరుగలేదు
  rationale: నిరాకరణతో ఉన్న Qal perfect 3ms, దుష్టుని స్థిరమైన అనుభవరాహిత్యాన్ని తెలుపుతుంది. ‘ఎరుగలేదు’ కవితాత్మక గౌరవాన్ని నిలుపుతూ ఆధునిక పాఠకులకు అర్థమయ్యే రూపం.
- source_word: שָׁלֵו
  choice: నెమ్మది
  rationale: ఈ పదం ప్రశాంతత, సౌఖ్యం, తృప్తి అనే భావపరిధిని కలిగి ఉంది. ‘నెమ్మది’ అంతరంగ విశ్రాంతిని సూచిస్తూ, ‘తృప్తి’ అనే మరింత వ్యాఖ్యానాత్మక అర్థానికి పరిమితం చేయదు.
- source_word: בְּבִטְנוֹ
  choice: తన కడుపులో
  rationale: בטן అక్షరార్థంగా కడుపు లేదా అంతర్భాగాలను సూచిస్తుంది. సందర్భంలో అత్యాశ, ఆకలి అనే శారీరక చిత్రణ ఉన్నందున దాన్ని సాధారణీకరించి ‘తనలో’ అని చేయకుండా ‘కడుపులో’గా ఉంచాం.
- source_word: בַּחֲמוּדוֹ
  choice: తాను కోరుకున్న వాటితో
  rationale: חמד మూలం కోరదగినది, ప్రియమైనది, విలువైనది అనే భావాలను ఇస్తుంది. ב ఉపసర్గను సాధనార్థకంగా తీసుకుంటే ‘కోరుకున్న వాటితో’ అవుతుంది; ఇది సంపదలకే అర్థాన్ని పరిమితం చేయకుండా మూలంలోని విస్తృతిని కాపాడుతుంది.
- source_word: לֹא יְמַלֵּט
  choice: తప్పించుకోలేడు
  rationale: מלט యొక్క Piel రూపం తప్పించుకోవడం లేదా రక్షించడం అనే అర్థాలను కలిగి ఉంటుంది. ప్రధాన పాఠంలో అతడు కోరుకున్న వాటి ద్వారా తీర్పు నుంచి తప్పించుకోలేడనే పఠనాన్ని సహజమైన తెలుగులో ఇచ్చాం; ప్రత్యామ్నాయ సకర్మక పఠనాన్ని పాదసూచికలో ఉంచాం.
theological_decisions:
- issue: దుష్టుడు తన కోరికవస్తువుల ద్వారా తప్పించుకుంటాడా, లేక వాటిలో దేనినైనా కాపాడుకుంటాడా అనే వాక్యనిర్మాణ సందిగ్ధత
  choice: తాను కోరుకున్న వాటితో అతడు తప్పించుకోలేడు
  alternative: తాను ముచ్చటపడిన దేనినీ కాపాడుకోలేడు
  rationale: בַּחֲמוּדוֹలోని ב సాధనార్థకంగా ఉండవచ్చు; יְמַלֵּטను అకర్మక/ఆత్మార్థకంగా ‘తప్పించుకోలేడు’ అని గ్రహించవచ్చు. అయితే מלט Pielకు ‘కాపాడు’ అనే సకర్మక అర్థం కూడా సాధ్యమే. తీర్పు నుంచి సంపద రక్షించలేదనే భావాన్ని ప్రధాన పాఠంలో ఉంచి, సంపాదించినదేదీ నిలుపుకోలేడనే పఠనాన్ని పాదసూచికలో సంరక్షించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, కవితాత్మకమైనప్పటికీ సాధారణ పాఠకులకు స్పష్టంగా ఉండే శైలి. ‘కడుపు’ అనే స్పష్టమైన శారీరక చిత్రాన్ని నిలిపి, ‘నెమ్మది ఎరుగలేదు’ ద్వారా గౌరవప్రదమైన జ్ఞానసాహిత్య ధోరణిని కాపాడాం.
