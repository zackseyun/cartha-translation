  text: He pulls it out[a], and it comes from his body; a flashing point comes from his gall; terrors come upon him.
translation:
  language: te
  text: అతడు దాన్ని బయటికి లాగుతాడు[a]; అది అతని శరీరంలోనుంచి బయటికి వస్తుంది. మెరుస్తున్న మొన అతని పిత్తం నుంచీ వస్తుంది; భీకర భయాలు అతనిపైకి వస్తాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మెరుస్తున్న కత్తి అతని పిత్తం నుంచీ బయటికి వస్తుంది.” హీబ్రూలో ‘లాగుతాడు’ అనే క్రియకు కర్మ చెప్పబడలేదు; సందర్భంలో అది శరీరంలో దిగిన ఆయుధమని అర్థమవుతుంది. ‘మెరుస్తున్న మొన’ అనే మాటను మెరుస్తున్న కత్తి లేదా ఆయుధపు బ్లేడుగా కూడా అర్థం చేసుకోవచ్చు.
    reason: lexical_and_syntactic_ambiguity
lexical_decisions:
- source_word: שָׁלַף
  choice: అతడు దాన్ని బయటికి లాగుతాడు
  rationale: ఈ క్రియకు ఆయుధాన్ని ఒరనుంచి తీయడం లేదా దేన్నైనా బయటికి లాగడం అనే అర్థం ఉంది. సందర్భంలో శరీరంలో దిగిన ఆయుధం సూచిత కర్మగా ఉన్నందున స్పష్టత కోసం ‘దాన్ని’ చేర్చబడింది.
- source_word: וַיֵּצֵא
  choice: అది ... బయటికి వస్తుంది
  rationale: మూలంలోని ‘బయటికి వెళ్లడం/రావడం’ అనే భావాన్ని, ముందున్న లాగడం అనే క్రియతో సహజంగా అనుసంధానిస్తుంది.
- source_word: מִגֵּוָה
  choice: అతని శరీరంలోనుంచి
  rationale: గేవా శరీరం లేదా మొండెాన్ని సూచించవచ్చు. ఖచ్చితమైన శరీరభాగాన్ని అనవసరంగా నిర్ణయించకుండా ‘శరీరం’ సాధారణమైన, స్పష్టమైన ఎంపిక.
- source_word: וּבָרָק
  choice: మెరుస్తున్న మొన
  rationale: బారాక్ ప్రాథమికంగా మెరుపు లేదా మెరుపు కాంతిని సూచిస్తుంది; ఇక్కడ ఆయుధ సందర్భంలో మెరుస్తున్న ఆయుధపు మొనను రూపకాలంకారంగా సూచించే అవకాశం ఉంది.
- source_word: מִמְּרֹרָתוֹ
  choice: అతని పిత్తాశయంలోనుంచి
  rationale: ఈ పదం పిత్తం, పిత్తాశయం లేదా రూపకంగా చేదును సూచించగలదు. ఇక్కడ శరీర గాయం చిత్రణ ఉన్నందున శరీరావయవ భావం అనుకూలం; ఆధునిక తెలుగులో ‘పిత్తాశయం’ స్పష్టంగా ఉంటుంది.
- source_word: יַהֲלֹךְ עָלָיו
  choice: అతని మీదికి వస్తాయి
  rationale: הלך + על ఇక్కడ ఏదో ఒకరిని ఆవరించడం లేదా వారి మీదికి రావడం అనే భావాన్ని ఇస్తుంది.
- source_word: אֵמִים
  choice: భయాలు
  rationale: బహువచనంలోని భయంకర అనుభవాల తీవ్రతను నిలుపుతుంది; సాధారణ ఆధునిక తెలుగులో సహజంగా ఉంది.
