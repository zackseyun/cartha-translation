revisions:
- from: అతడు దాన్ని బయటికి లాగుతాడు[a]; అది అతని శరీరంలోనుంచి బయటికి వస్తుంది. మెరుస్తున్న మొన అతని పిత్తాశయంలోనుంచి వస్తుంది; భయాలు అతని మీదికి వస్తాయి.
