translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరమైన శైలిని ఉపయోగించాం. శరీర గాయం గురించిన మూలంలోని తీవ్ర దృశ్యాన్ని నిలిపాం; ఆయుధపు మెరుపును ‘మెరుస్తున్న మొన’గా చెప్పి, ప్రత్యామ్నాయ పఠనాన్ని పాదసూచికలో ఉంచాం.
