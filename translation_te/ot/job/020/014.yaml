  yaml_path: translation/ot/job/020/014.yaml
  text: his food in his belly is turned[a]; it is the venom of cobras within him.
translation:
  language: te
  text: అతని కడుపులో అతని ఆహారం మారిపోతుంది[a]; అది అతని లోపల నాగుపాముల విషంగా మారుతుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతని అంతర్భాగాల్లో అతని రొట్టె మారిపోతుంది; అది అతనిలో విషసర్పాల పిత్తరసం.”
    reason: ‘రొట్టె/ఆహారం,’ ‘అంతర్భాగాలు/కడుపు,’ ‘పిత్తరసం/విషం’ అనే హీబ్రూ పదాల మరింత అక్షరార్థ ప్రత్యామ్నాయాలను సూచిస్తుంది; పాము జాతి నిర్దిష్టతను తెరిచి ఉంచుతుంది.
lexical_decisions:
- source_word: לַחְמוֹ
  choice: అతని ఆహారం
  rationale: לֶחֶם అక్షరార్థంగా ‘రొట్టె’ అయినా, ఇక్కడ తిన్నదాన్ని సాధారణంగా సూచిస్తుంది; ఆధునిక తెలుగులో ‘ఆహారం’ సందర్భార్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: בְּמֵעָיו
  choice: అతని కడుపులో
  rationale: ఈ పదం అంతర్గత అవయవాలు లేదా పేగులను సూచిస్తుంది; జీర్ణక్రియకు సంబంధించిన ఈ చిత్రణలో ‘కడుపులో’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: נֶהְפָּךְ
  choice: మారిపోతుంది
  rationale: నిఫాల్ రూపం లోపల ఒక స్థితి మరొక స్థితిగా మారడాన్ని తెలియజేస్తుంది; ‘మారిపోతుంది’ ఆ పరివర్తనను సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: מְרוֹרַת
  choice: విషం
  rationale: ఈ పదానికి ‘చేదు’ లేదా ‘పైత్యరసం’ అనే ప్రాథమిక భావం ఉన్నప్పటికీ, విషసర్పాలతో కూడిన ఈ ప్రయోగంలో ప్రాణాంతక విషాన్ని సూచిస్తుంది.
- source_word: פְּתָנִים
  choice: నాగుపాములు
  rationale: పదం ఒక విషసర్ప జాతిని సూచిస్తుంది; సాంప్రదాయ ‘ఆస్పు’ కంటే ‘నాగుపాములు’ ఆధునిక తెలుగు పాఠకులకు స్పష్టంగా ఉండి సర్పచిత్రణను కాపాడుతుంది.
- source_word: בְּקִרְבּוֹ
  choice: అతని అంతరంగంలో
  rationale: అతని లోపల ఉన్నదనే భావాన్ని ఈ పదబంధం ఇస్తుంది; ‘అంతరంగంలో’ శరీరంలోని లోపలి భాగమనే చిత్రణను గౌరవప్రదమైన తెలుగులో నిలుపుతుంది.
