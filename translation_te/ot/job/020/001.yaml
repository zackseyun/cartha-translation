- from: అప్పుడు నయమాతీయుడైన జోఫరు జవాబిస్తూ ఇలా అన్నాడు:[a]
  to: అప్పుడు నయమాతీయుడైన జోఫరు జవాబిచ్చి ఇలా అన్నాడు:[a]
  rationale: Finite “జవాబిచ్చి” restores the source’s conventional two-verb dialogue formula more faithfully than the durative “జవాబిస్తూ.” The footnote is corrected so that its alternative and explanation agree, while preserving the optional rendering of the opening waw.
