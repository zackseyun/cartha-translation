  text: Then Zophar the Naamathite answered and said:[a]
translation:
  language: te
  text: అప్పుడు నయమాతీయుడైన జోఫరు జవాబిచ్చి ఇలా అన్నాడు:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నయమాతీయుడైన జోఫరు జవాబిచ్చి ఇలా అన్నాడు.”
    reason: ప్రారంభంలోని וַను సందర్భానుసారంగా ‘అప్పుడు’ అని అనువదించవచ్చు; దానిని ప్రత్యేకంగా అనువదించకపోయినా మూలంలోని సంభాషణా సూత్రం తెలుగులో నిలుస్తుంది.
lexical_decisions:
- source_word: וַיַּעַן
  choice: జవాబిస్తూ
  rationale: ענה అనే క్రియ ఈ సంభాషణా సూత్రంలో ‘జవాబిచ్చు’ అనే అర్థాన్ని ఇస్తుంది. వెంట వచ్చే ‘అన్నాడు’తో సహజమైన ఆధునిక తెలుగు వాక్యంగా ఉండేందుకు ‘జవాబిస్తూ’ అని అనువదించాం.
- source_word: צֹפַר
  choice: జోఫరు
  rationale: వ్యక్తి పేరును తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: הַנַּעֲמָתִי
  choice: నయమాతీయుడైన
  rationale: ఈ సజాతీయ నామవిశేషణం జోఫరును నయమా అనే ప్రాంతం లేదా వంశంతో అనుసంధానిస్తుంది; తెలుగులో వ్యక్తిని విశేషించే సహజ రూపాన్ని వాడాం.
- source_word: וַיֹּאמַר
  choice: ఇలా అన్నాడు
  rationale: אמר యొక్క సాధారణ అర్థం ‘అను’. తరువాత ప్రసంగం వస్తుందని సహజంగా సూచించేందుకు ‘ఇలా’ చేర్చాం; ‘అన్నాడు’ మూలంలోని వాక్కు క్రియను నిలుపుతుంది.
- source_word: וַ
  choice: అప్పుడు
  rationale: ప్రారంభంలోని వావ్ కథనాన్ని ముందుకు నడిపి, గత ప్రసంగానికి ప్రతిస్పందనను సూచిస్తుంది. ఆధునిక తెలుగులో ‘అప్పుడు’ ఆ క్రమార్థాన్ని సహజంగా తెలియజేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన కథన శైలిని వాడాం. హెబ్రీ మూలంలోని ‘జవాబిచ్చి అన్నాడు’ అనే ద్వంద్వ సూత్రాన్ని తెలుగులో సహజంగా వినిపించే ‘జవాబిస్తూ ఇలా అన్నాడు’గా అందించాం.
