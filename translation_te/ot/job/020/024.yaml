translation:
  language: te
  text: 'అతడు ఇనుప ఆయుధం నుండి పారిపోతాడు;

    కంచు విల్లు అతని దేహాన్ని చీల్చుకుంటూ దూసుకుపోతుంది.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “కంచు విల్లు అతని గుండా పోతుంది.” ఇక్కడ విల్లు నుండి విడిచిన బాణం అతని దేహాన్ని చీల్చుకుంటూ పోతుందనే భావం సూచితమవుతోంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִבְרַח
  choice: పారిపోతాడు
  rationale: ברח అనే క్రియ పారిపోవడం లేదా తప్పించుకోవడం అనే అర్థం ఇస్తుంది. ఈ కవితాత్మక తీర్పు సందర్భంలో అసంపూర్ణ క్రియారూపాన్ని భవిష్యదర్థంలో సహజంగా అనువదించాం.
- source_word: מִנֵּשֶׁק בַּרְזֶל
  choice: ఇనుప ఆయుధం నుండి
  rationale: נשק అనేది విస్తృతంగా ఆయుధాన్ని లేదా ఆయుధసామగ్రిని సూచించగలదు; ఇక్కడ בַּרְזֶלతో కలిసి ఏకవచనంలో ‘ఇనుప ఆయుధం’ అనడం సందర్భానికి తగినది.
- source_word: תַּחְלְפֵהוּ
  choice: అతని దేహాన్ని చీల్చుకుంటూ దూసుకుపోతుంది
  rationale: חלף యొక్క ప్రాథమిక భావం ‘దాటి పోవడం/గుండా పోవడం.’ విల్లు కర్తగా ఉన్న ఈ యుద్ధచిత్రంలో, దాని నుండి విడిచిన బాణం అతని దేహాన్ని చీల్చుకుంటూ పోతుందనే సూచిత భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: קֶשֶׁת
  choice: విల్లు
  rationale: ఈ ఆయుధపదానికి సాధారణమైన, స్పష్టమైన తెలుగు సమానార్థకం.
- source_word: נְחוּשָׁה
  choice: కంచు
  rationale: నְחוּשָׁה బైబిలు వాడుకలో రాగి లేదా రాగి మిశ్రలోహాన్ని సూచిస్తుంది; ఆయుధ సందర్భంలో ‘కంచు’ సహజమైన తెలుగు పదం.
