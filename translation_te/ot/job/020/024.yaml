translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, కవితాత్మకమైనప్పటికీ సామాన్య పాఠకులకు స్పష్టంగా ఉండే గంభీర శైలి. మూలంలోని రెండు సమాంతర ఆయుధ చిత్రాలను నిలుపుతూ, రెండవ పాదంలోని సూచిత బాణాన్ని ప్రధాన వచనంలో ప్రత్యేక నామవాచకంగా చేర్చకుండా విల్లునే వ్యాకరణ కర్తగా ఉంచాం.
