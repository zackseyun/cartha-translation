  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: חַ֣יִל בָּ֭לַע וַ/יְקִאֶ֑/נּוּ מִ֝/בִּטְנ֗/וֹ יוֹרִשֶׁ֥/נּוּ אֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/job/020/015.yaml
  text: He swallowed wealth[a], but he will vomit it up[b]; God will drive it out of his belly.
translation:
  language: te
  text: అతడు సంపదను[a] మింగాడు, కానీ దానిని కక్కివేస్తాడు; దేవుడు అతని కడుపులోనుండి దానిని బయటికి తోలివేస్తాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ధనసంపత్తిని’ (חַיִל).
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ వాక్యం అక్షరార్థంగా ‘అతని కడుపులోనుండి’ అని చెబుతుంది; మింగిన సంపదను బలవంతంగా బయటికి వెళ్లగొట్టే రూపకాన్ని ఇది నిలుపుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַיִל
  choice: సంపద
  rationale: జ్ఞానసాహిత్య సందర్భంలో ఈ పదం బలం లేదా సైన్యం కంటే భౌతిక ధనసంపత్తిని సూచిస్తుంది; అక్రమంగా సంపాదించిన లాభాన్ని ఈ సందర్భంలో సహజంగా తెలియజేస్తుంది.
- source_word: בָּלַע
  choice: మింగాడు
  rationale: మింగడం అనే స్పష్టమైన దేహసంబంధ రూపకాన్ని నిలుపుతుంది; తరువాత వచ్చే ‘కక్కివేస్తాడు’ అనే క్రియతో చిత్రణ సమగ్రంగా ఉంటుంది.
- source_word: וַיְקִאֶנּוּ
  choice: కానీ దానిని కక్కివేస్తాడు
  rationale: క్రియకు ‘వాంతి చేయడం/కక్కివేయడం’ అనే అర్థం ఉంది. అతడు మింగినదాన్ని నిలుపుకోలేడనే తిరుగుదలను ‘కానీ’ సహజంగా వ్యక్తం చేస్తుంది; భవిష్యదర్థం సందర్భంలోని తీర్పు ప్రకటనకు సరిపోతుంది.
- source_word: מִבִּטְנוֹ
  choice: అతని కడుపులోనుండి
  rationale: మింగిన సంపద కడుపులో ఉన్నట్లు చూపే సజీవ దేహసంబంధ రూపకాన్ని నేరుగా నిలుపుతుంది.
- source_word: יוֹרִשֶׁנּוּ
  choice: దానిని బయటికి తోలివేస్తాడు
  rationale: హిఫిల్ రూపంలోని కారణార్థక బలాన్ని, సంపదను అతనిలోనుండి బలవంతంగా వెళ్లగొట్టడాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: אֵל
  choice: దేవుడు
  rationale: ఇక్కడ తీర్పును అమలు చేసే కర్త దేవుడేనని హీబ్రూ స్పష్టంగా పేర్కొంటుంది; సాధారణ ఆధునిక తెలుగు సమానార్థకం ‘దేవుడు’.
theological_decisions:
- issue: దుష్టుని సంపద బయటికి వెళ్లగొట్టబడటంలో తీర్పు కార్యసాధకుడు
  choice: సంపదను అతని కడుపులోనుండి బయటికి తోలివేసేది దేవుడే అని స్పష్టంగా అనువదించడం
  alternative: దానిని కేవలం సహజ పర్యవసానంగా లేదా అస్పష్టమైన విధి చర్యగా చూపించడం
  rationale: హీబ్రూలో אֵל అనేది יוֹרִשֶׁנּוּ క్రియకు స్పష్టమైన కర్త. అందువల్ల దైవిక కార్యసాధకత్వాన్ని మృదువుపరచకుండా నిలుపాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయినా కవితాత్మకమైన దేహసంబంధ రూపకాన్ని మరియు దేవుని ప్రత్యక్ష కార్యసాధకత్వాన్ని నిలిపిన గంభీర శైలి.
