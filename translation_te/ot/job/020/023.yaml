source:
  edition: WLC
  text: יְהִ֤י לְ/מַלֵּ֬א בִטְנ֗/וֹ יְֽשַׁלַּח בּ֭/וֹ חֲר֣וֹן אַפּ֑/וֹ וְ/יַמְטֵ֥ר עָ֝לֵ֗י/מוֹ בִּ/לְחוּמֽ/וֹ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/020/023.yaml
  text: When he is about to fill his belly[a], he will send against him the burning of his anger and rain it upon him as his food.
translation:
  language: te
  text: అతడు తన కడుపు నింపుకోబోతున్నప్పుడు, దేవుడు తన కోపాగ్నిని అతనిమీదికి పంపుతాడు; అతడు తింటుండగానే దేవుడు దానిని అతనిమీద వర్షింపజేస్తాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దానిని అతని ఆహారంగా అతనిమీద వర్షింపజేస్తాడు.” చివరి హీబ్రూ పదబంధం దుర్బోధమైనది; అది తీర్పు అతడు తింటున్న సమయంలో పడుతుందని గానీ, వర్షంలా కురిసే ఆ తీర్పే అతని ఆహారమవుతుందని గానీ సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהִי לְמַלֵּא בִטְנוֹ
  choice: అతడు తన కడుపు నింపుకోబోతున్నప్పుడు
  rationale: יְהִי తో కూడిన לְמַלֵּא నిర్మాణాన్ని సందర్భానుసారమైన కాలవాచక భావంగా తీసుకున్నాం. ‘కడుపు నింపుకోవడం’ అనే స్పష్టమైన భోజన దృశ్యాన్ని నిలిపాం.
- source_word: יְשַׁלַּח בּוֹ
  choice: దేవుడు ... అతని మీదికి పంపుతాడు
  rationale: క్రియకు వ్యాకరణపరంగా పురుష ఏకవచన కర్త ఉన్నా, ఈ వాక్యంలో పేరు ప్రత్యక్షంగా లేదు. సమీప సందర్భంలోని దైవిక తీర్పును బట్టి సహజమైన తెలుగుకోసం ‘దేవుడు’ అని స్పష్టం చేశాం; בּוֹ లోని విరోధ దిశను ‘అతని మీదికి’గా తెలిపాం.
- source_word: חֲרוֹן אַפּוֹ
  choice: తన కోపాగ్నిని
  rationale: ఈ నిర్మాణంలోని మండే కోపం/కోపపు వేడి అనే రూపకాన్ని సంక్షిప్తంగా, సహజంగా ‘కోపాగ్ని’తో నిలిపాం.
- source_word: וְיַמְטֵר עָלֵימוֹ
  choice: దానిని అతని మీద వర్షింపజేస్తాడు
  rationale: హిఫీల్ క్రియలోని ‘వర్షింపజేయడం’ అనే తీర్పు-వర్ష రూపకాన్ని నిలిపాం. కవితాత్మక עָלֵימוֹ ఇక్కడ సందర్భానుసారంగా ఏకవచన దుష్టుణ్ణే సూచిస్తుంది.
- source_word: בִּלְחוּמוֹ
  choice: అతడు తింటుండగా
  rationale: కష్టమైన ఈ పదబంధాన్ని ఆహారం/భోజనంతో సంబంధమున్న కాలవాచక భావంగా ప్రధాన పాఠ్యంలో ఇచ్చాం. ‘అతని ఆహారంగా’ అనే మరింత ప్రత్యక్ష ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలిపాం.
theological_decisions:
- issue: తీర్పు క్రియలలో అంతర్లీన కర్త
  choice: సందర్భాన్ని బట్టి కర్తను ‘దేవుడు’ అని స్పష్టం చేయడం
  alternative: కర్తను చెప్పకుండా ‘పంపబడుతుంది/వర్షింపబడుతుంది’ అని కర్మణి రూపంలో అనువదించడం
  rationale: యోబు 20లోని సమీప సందర్భం దైవిక ప్రతిఫలాన్ని వర్ణిస్తుంది; ‘తన కోపం’ కూడా దేవుణ్ణే అత్యంత సహజంగా సూచిస్తుంది. ఇది కొత్త సిద్ధాంతాన్ని చేర్చడం కాదు, తెలుగులో అస్పష్టతను తగ్గించే సందర్భోచిత స్పష్టీకరణ.
- issue: בִּלְחוּמוֹ యొక్క భావం
  choice: తీర్పు అతడు తింటున్న సమయంలో పడుతుందని ప్రధాన పాఠ్యంలో చూపడం
  alternative: తీర్పునే ‘అతని ఆహారంగా’ వర్షింపజేస్తాడని అనువదించడం
  rationale: హీబ్రూ పదబంధం దుర్బోధమైనది; ఆహారంతో సంబంధం స్పష్టమైనా వ్యాకరణ సంబంధం వివాదాస్పదం. అందువల్ల ఒక పఠనాన్ని ప్రధాన పాఠ్యంలో ఉంచి నిజమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో సంరక్షించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనా సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘కోపాగ్ని’, ‘వర్షింపజేస్తాడు’ పదాలు మూలంలోని వేడి మరియు వర్ష రూపకాలను నిలుపుతాయి. పాదసూచిక సూచిక [a] ప్రధాన పాఠ్యంలో ఉంచబడింది.
