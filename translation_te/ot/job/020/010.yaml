source:
  edition: WLC
  text: בָּ֭נָי/ו יְרַצּ֣וּ דַלִּ֑ים וְ֝/יָדָ֗י/ו תָּשֵׁ֥בְנָה אוֹנֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/020/010.yaml
  text: His sons will seek the favor of the poor[b][a], and his own hands will give back his wealth.
translation:
  language: te
  text: అతని కుమారులు పేదల అనుగ్రహం కోరుతారు[a]; అతని చేతులు అతని సంపదను తిరిగి ఇస్తాయి[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పేదలను ప్రసన్నం చేసుకుంటారు’ లేదా ‘పేదలను శాంతింపజేస్తారు.’ హీబ్రూ క్రియ అనుగ్రహం కోరడం లేదా అన్యాయం జరిగినవారిని ప్రసన్నం చేసుకోవడం అనే భావాలను ఇవ్వగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘అతని ఆస్తిని’ లేదా ‘అతని బలాన్ని.’ హీబ్రూ నామవాచకం సంపద, ఆస్తి లేదా బలాన్ని సూచించగలదు; ఇక్కడి సందర్భానికి ‘సంపద’ బాగా సరిపోతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּנָיו
  choice: అతని కుమారులు
  rationale: ఈ పదం వ్యాకరణపరంగా పుంలింగ బహువచనంలో ఉండి, మూడవ పురుష ఏకవచన సంబంధప్రత్యయాన్ని కలిగి ఉంది. కాబట్టి ‘అతని పిల్లలు’ కంటే ‘అతని కుమారులు’ మూలానికి మరింత సమీపంగా ఉంది.
- source_word: יְרַצּוּ
  choice: ప్రసన్నం చేసుకోవడానికి ప్రయత్నిస్తారు
  rationale: רצה ధాతువు పియేల్ రూపంలో ఇక్కడ అంగీకారం లేదా అనుగ్రహం పొందేందుకు ప్రయత్నించడం, దెబ్బతిన్నవారిని శాంతింపజేయడం అనే భావాన్ని ఇవ్వగలదు. తెలుగు వాక్యంలో ఈ రెండు భావాలకు చోటు ఉండే సహజమైన ప్రయోగాన్ని ఎంచుకున్నాం.
- source_word: דַלִּים
  choice: పేదలను
  rationale: דלים అనే పదం ఆర్థికంగా పేదవారిని లేదా సామాజికంగా బలహీనులైనవారిని సూచించగలదు. సందర్భంలో ‘పేదలు’ సూటిగా, సహజంగా సరిపోతుంది.
- source_word: יָדָיו
  choice: అతని చేతులే
  rationale: మూలంలోని బహువచన ‘అతని చేతులు’ అనే రూపక చిత్రాన్ని నిలిపి ఉంచాం. ‘-ఏ’ వాడకం తిరిగి చెల్లించేది అతని స్వంత చేతులేననే భావాన్ని సహజమైన తెలుగులో స్పష్టం చేస్తుంది.
- source_word: תָּשֵׁבְנָה
  choice: తిరిగి ఇచ్చేస్తాయి
  rationale: שוב ధాతువు హిఫీల్ రూపం ‘తిరిగి వచ్చేలా చేయడం’, అందువల్ల ‘తిరిగి ఇవ్వడం’ లేదా ‘పునరుద్ధరించడం’ అనే అర్థం ఇస్తుంది. ఆస్తి తిరిగి చెల్లించే సందర్భంలో ఈ ఎంపిక సహజంగా ఉంది.
- source_word: אוֹנוֹ
  choice: అతని సంపదను
  rationale: אוֹן అనే పదం సంపద, ఆస్తి, వనరులు లేదా బలం అనే భావాలను ఇవ్వగలదు. పేదలకు పరిహారం చెల్లించే ఈ సందర్భంలో ‘సంపద’ ప్రధాన భావంగా సరిపోతుంది; ఇతర సాధ్యార్థాలను పాదసూచికలో ఉంచాం.
