  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన శైలిని ఉపయోగించాం. మూలంలోని ‘చేతులు’ అనే వ్యక్తీకరణను నిలిపి ఉంచి, క్రియ మరియు నామవాచకంలోని నిజమైన అర్థసందిగ్ధతలను పాదసూచికల్లో భద్రపరిచాం.
