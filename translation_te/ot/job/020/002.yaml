translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, కవితాత్మక గంభీరతను నిలుపుకుంటూనే సాధారణ పాఠకులకు సహజంగా అర్థమయ్యే నిర్మాణం వాడబడింది. మూలంలోని కారణార్థక నుడికారాన్ని ప్రధాన పాఠ్యంలో స్పష్టంగా ఇచ్చి, దాని నిజమైన వ్యాకరణ-అర్థ సందిగ్ధతను పాదసూచికలో భద్రపరిచాం.
