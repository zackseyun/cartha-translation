source:
  edition: WLC
  text: לָ֭/כֵן שְׂעִפַּ֣/י יְשִׁיב֑וּ/נִי וּ֝/בַ/עֲב֗וּר ח֣וּשִׁ/י בִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/job/020/002.yaml
  text: Therefore my thoughts answer me[b][a], because of my inward agitation.
translation:
  language: te
  text: అందుచేత నా ఆలోచనలు నన్ను జవాబు చెప్పమని పురికొల్పుతున్నాయి[a], నాలోని ఆతురత కారణంగా[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘నా ఆలోచనలు నాకు జవాబిస్తున్నాయి,’ లేదా ‘నా కలవరపరిచే ఆలోచనలు నన్ను జవాబు చెప్పమంటున్నాయి.’ హీబ్రూ నుడికారం సంక్షిప్తంగా ఉంది; ఆలోచనలు అతనిలోనే జవాబిస్తున్నాయని గానీ, అతన్ని జవాబు చెప్పడానికి పురికొల్పుతున్నాయని గానీ అర్థం కావచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘నాలోని తొందర కారణంగా.’ హీబ్రూ పదానికి ‘తొందర’ అనే అర్థం ఉండవచ్చు; ఈ సందర్భంలో అది అంతర్గత కలవరం లేదా ఉద్వేగభరితమైన తక్షణ స్పందనను సూచించే అవకాశం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: అందుచేత
  rationale: ముందటి మాటలకు ప్రతిస్పందనగా వచ్చే పర్యవసానాన్ని లేదా తార్కిక సంబంధాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: שְׂעִפַּי
  choice: నా ఆలోచనలు
  rationale: ఈ పదం కలతపెట్టే లేదా చీలికగల ఆలోచనలను సూచించగలిగినా, మూలంలోని సంక్షిప్తతను కాపాడేందుకు ప్రధాన పాఠ్యంలో తటస్థమైన ‘ఆలోచనలు’ అని ఉంచి, అంతర్గత కలవర భావాన్ని రెండో పాదంలో వ్యక్తం చేశాం.
- source_word: יְשִׁיבוּנִי
  choice: నన్ను జవాబివ్వమని పురికొల్పుతున్నాయి
  rationale: హిఫీల్ రూపంలోని కారణార్థాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది. ఆలోచనలు అతనికి జవాబిస్తున్నాయా, లేక అతన్ని జవాబివ్వడానికి ప్రేరేపిస్తున్నాయా అనే హీబ్రూ నుడికారంలోని సందిగ్ధతను పాదసూచికలో నిలిపాం.
- source_word: וּבַעֲבוּר
  choice: వల్లనే
  rationale: కారణాన్ని తెలిపే ఈ పదబంధాన్ని తెలుగులో సహజంగా చూపుతుంది; ‘నే’ అంతర్గత ఆతురతే ప్రత్యుత్తరానికి కారణమని నొక్కి చెబుతుంది.
- source_word: חוּשִׁי
  choice: ఆతురత
  rationale: ఈ పదానికి ‘తొందర’ అనే భావం ఉండగలిగినా, సందర్భంలో లోపల రేగే కలవరం, తక్షణమే స్పందించాలనే ఉద్వేగం రెండింటినీ ‘ఆతురత’ సహజంగా అందిస్తుంది.
- source_word: בִי
  choice: నాలో రేగుతున్న
  rationale: ఆ ప్రేరణ వక్త అంతరంగంలో ఉందని తెలుపుతూ, తెలుగులో జీవంతంగా మరియు సహజంగా వినిపించేలా వ్యక్తం చేస్తుంది.
