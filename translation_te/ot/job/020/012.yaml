source:
  edition: WLC
  text: אִם תַּמְתִּ֣יק בְּ/פִ֣י/ו רָעָ֑ה יַ֝כְחִידֶ֗/נָּה תַּ֣חַת לְשׁוֹנֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/020/012.yaml
  text: Though evil is sweet in his mouth[a], he hides it under his tongue,
translation:
  language: te
  text: చెడు అతని నోటికి తియ్యగా ఉన్నా[a], దాన్ని తన నాలుక కింద దాచిపెడతాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “చెడు అతని నోటికి తియ్యగా ఉంటే.” హీబ్రూ అవ్యయాన్ని షరతార్థకంగా (‘ఒకవేళ/ఉంటే’) లేదా అనుమతార్థకంగా (‘ఉన్నా’) అర్థం చేసుకోవచ్చు; సందర్భం రెండవ అర్థానికి మొగ్గుచూపుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: ఉన్నా
  rationale: ఈ సందర్భంలో אִם సాధారణ షరతుకన్నా వ్యతిరేకార్థక అనుమతిని—‘అయినా/ఉన్నా’—తెలుపుతుంది. అయితే ‘ఒకవేళ’ అనే షరతార్థం కూడా సాధ్యమే కాబట్టి పాదటిప్పణిలో ఉంచబడింది.
- source_word: תַּמְתִּיק
  choice: తియ్యగా ఉన్నా
  rationale: מתק హిఫీల్ రూపం అక్షరార్థంగా ‘తియ్యగా చేయు’ అని రావచ్చు; ఇక్కడ רָעָה కర్తగా ఉండడంతో ‘తియ్యగా ఉండు’ అనే స్థిత్యర్థం సహజంగా సరిపోతుంది.
- source_word: בְּפִיו
  choice: అతని నోటికి
  rationale: פֶּה అనే స్పష్టమైన ‘నోరు’ రూపకాన్ని, తరువాత వచ్చే ‘నాలుక కింద’ అనే సమాంతర చిత్రంతో కలిపి నిలుపుతుంది. తెలుగులో రుచిని తెలిపేందుకు ‘నోటికి తియ్యగా’ సహజమైన ప్రయోగం.
- source_word: רָעָה
  choice: చెడు
  rationale: ఇక్కడ నైతిక దుష్టత్వాన్ని సూచించే విస్తృతమైన పదం. ఆధునిక సాధారణ తెలుగులో ‘చెడు’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: יַכְחִידֶנָּה
  choice: దాన్ని ... దాచిపెడతాడు
  rationale: כחד హిఫీల్ రూపం దాచడం లేదా మరుగుపరచడం అనే భావాన్ని ఇస్తుంది; స్త్రీలింగ ప్రత్యయం ముందున్న רָעָהను సూచిస్తుంది. ‘దాచిపెడతాడు’ ఉద్దేశపూర్వకంగా నిల్వచేసే చిత్రాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: תַּחַת
  choice: కింద
  rationale: నోరు–నాలుక రూపకంలోని స్థానార్థాన్ని నేరుగా నిలుపుతుంది.
- source_word: לְשׁוֹנוֹ
  choice: తన నాలుక
  rationale: మూలంలోని సజీవమైన శరీర రూపకాన్ని కాపాడుతుంది; తెలుగు వాక్యకర్తకే చెందినదని స్పష్టం చేయడానికి ‘తన’ సహజమైన ఎంపిక.
