  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన శైలి. ‘నోటికి తియ్యగా’ మరియు ‘నాలుక కింద’ ద్వారా మూలంలోని రుచి–దాచిపెట్టడం రూపకం నిలుపబడింది.
