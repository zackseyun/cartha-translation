source:
  edition: WLC
  text: כִּ֤י רִנְנַ֣ת רְ֭שָׁעִים מִ/קָּר֑וֹב וְ/שִׂמְחַ֖ת חָנֵ֣ף עֲדֵי רָֽגַע־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/020/005.yaml
  text: For the rejoicing of the wicked is brief[a], and the joy of the godless lasts only a moment.
translation:
  language: te
  text: 'ఎందుకంటే దుష్టుల ఉల్లాసం స్వల్పకాలమే ఉంటుంది;

    భక్తిహీనుని సంతోషం క్షణమాత్రమే నిలుస్తుంది.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “భక్తిహీనుడు” అనే హీబ్రూ పదాన్ని “కపటుడు” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందున్న మాటకు కారణం లేదా వివరణను పరిచయం చేసే హీబ్రూ సంధానపద భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: רִנְנַת
  choice: విజయోత్సాహం
  rationale: ఆనందంతో చేసే కేక లేదా ఉల్లాస వ్యక్తీకరణను సూచిస్తుంది; తెలుగు కవితాత్మక సమాంతరంలో కేవలం అంతరంగ ఆనందం కంటే వ్యక్తమయ్యే ఉత్సాహాన్ని నిలుపుతుంది.
- source_word: רְשָׁעִים
  choice: దుష్టుల
  rationale: నైతికంగా దోషులైనవారిని సూచించే జ్ఞానసాహిత్యంలోని సాధారణ పదానికి స్పష్టమైన ఆధునిక తెలుగు సమానం.
- source_word: מִקָּרוֹב
  choice: కొద్దికాలమే ఉంటుంది
  rationale: ఇక్కడ స్థలపరమైన ‘దగ్గర’ కంటే కాలపరమైన స్వల్పతను సూచించే సందర్భోచిత భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: וְשִׂמְחַת
  choice: సంతోషం
  rationale: మొదటి పాదంలోని ఉల్లాసానికి సమాంతరంగా ఉన్న ఆనందాన్ని సహజంగా తెలుపుతుంది.
- source_word: חָנֵף
  choice: భక్తిహీనుని
  rationale: యోబు గ్రంథంలో ఈ పదం కేవలం వేషధారణ చేసే వ్యక్తిని కాక, దేవునిపట్ల భక్తిలేని లేదా అపవిత్రమైన వ్యక్తిని విస్తృతంగా సూచించగలదు.
- source_word: עֲדֵי רָגַע
  choice: క్షణకాలమే ఉంటుంది
  rationale: ఒక అత్యల్ప కాలపరిమితి వరకు మాత్రమే కొనసాగుతుందనే భావాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: חָנֵף అనే పదం యొక్క నైతిక-మతపరమైన విస్తృతి
  choice: భక్తిహీనుడు
  alternative: కపటుడు
  rationale: ‘కపటుడు’ అనడం బాహ్య వేషధారణ అనే భావానికే పరిమితం కావచ్చు. ఇక్కడ רְשָׁעִים తో ఉన్న సమాంతరత, యోబు గ్రంథంలోని వాడుక కలిసి దేవునిపట్ల భక్తిలేని వ్యక్తి అనే విస్తృత భావానికి మద్దతిస్తాయి; ప్రత్యామ్నాయ భావాన్ని పాదటిప్పణిలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, జ్ఞానసాహిత్యానికి తగిన గంభీరమైన కానీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. రెండు పాదాల కవితాత్మక సమాంతరతను నిలుపుతూ, హీబ్రూలో సూచితమైన క్రియను తెలుగులో సహజత కోసం రెండుసార్లు వ్యక్తం చేశాం.
