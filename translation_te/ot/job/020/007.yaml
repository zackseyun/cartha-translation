translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కవితా శైలిని అనుసరించాం. మూలంలోని కఠినమైన అవమానకర చిత్రాన్ని మృదువుచేయకుండా ‘పెంట’తో నిలిపి, మరింత వైద్యపరమైన లేదా వివరణాత్మక ప్రత్యామ్నాయాలను పాదటిప్పణిలో ఇచ్చాం.
