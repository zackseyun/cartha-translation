base_translation:
  language: en
  yaml_path: translation/ot/job/020/007.yaml
  text: Like his own dung[a], he will perish forever; those who saw him will say, ‘Where is he?’
translation:
  language: te
  text: 'తన మలంలా[a] అతడు శాశ్వతంగా నశించిపోతాడు;

    అతన్ని చూసినవారు, “అతడు ఎక్కడ ఉన్నాడు?” అని అంటారు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తన పెంటలా.” హీబ్రూ మూలం ఉద్దేశపూర్వకంగా అవమానకరమైన చిత్రాన్ని ఉపయోగిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּגֶלֲלוֹ
  choice: అతని సొంత పెంటలా
  rationale: గֶּלֶל అనే నామవాచకం పేడ, మలం లేదా విసర్జిత మలినాన్ని సూచిస్తుంది. ఈ వాక్యంలోని ఉద్దేశపూర్వక అవమానకరమైన పోలికను సహజమైన ఆధునిక తెలుగులో నిలుపుతూ ‘పెంట’ అని అనువదించాం; ప్రత్యయం వ్యక్తిగత స్వామ్యాన్ని సూచిస్తున్నందున ‘అతని సొంత’ అని ఇచ్చాం.
- source_word: לָנֶצַח
  choice: శాశ్వతంగా
  rationale: నֶצַח ఇక్కడ అంతం లేని, నిలిచిపోయే కాలవ్యాప్తిని సూచిస్తుంది. తీర్పు సందర్భంలోని సంపూర్ణమైన, తిరిగిరాని అదృశ్యాన్ని ‘శాశ్వతంగా’ సహజంగా వ్యక్తపరుస్తుంది.
- source_word: יֹאבֵד
  choice: నశించిపోతాడు
  rationale: אבד నశించడం లేదా అంతరించిపోవడం అనే బలమైన భావాన్ని ఇస్తుంది. ‘నశించిపోతాడు’ కవితాత్మక తీర్పు తీవ్రతను నిలుపుతుంది; కేవలం ‘కనుమరుగవుతాడు’ కంటే మూలక్రియ బలాన్ని మెరుగ్గా చూపిస్తుంది.
- source_word: רֹאָיו
  choice: అతన్ని చూసినవారు
  rationale: ప్రత్యయంతో ఉన్న కృదంత రూపం అక్షరార్థంగా ‘అతన్ని చూసేవారు/చూసినవారు.’ అతని పతనానికి ముందు అతన్ని ఎరిగినవారిని సూచించేలా తెలుగులో ‘అతన్ని చూసినవారు’ సహజంగా ఉంది.
- source_word: יֹאמְרוּ
  choice: అని అంటారు
  rationale: אמר యొక్క సాధారణ అర్థం ‘అను/చెప్పు.’ తరువాత ప్రశ్న వచ్చినా క్రియను ‘అడుగుతారు’గా మార్చకుండా మూలంలోని ‘అంటారు’ను నిలిపాం.
- source_word: אַיּוֹ
  choice: అతడు ఎక్కడ?
  rationale: ఇది స్థానాన్ని ప్రశ్నించే పదానికి మూడవ పురుష ఏకవచన ప్రత్యయం కలిసిన రూపం. ‘ఇప్పుడు’ లేదా ‘ఎక్కడికి వెళ్లాడు’ వంటి అదనపు వ్యాఖ్యానం లేకుండా నేరుగా అనువదించాం.
