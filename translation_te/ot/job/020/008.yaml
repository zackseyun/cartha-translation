  yaml_path: translation/ot/job/020/008.yaml
  text: Like a dream he flies away and is not found[b][a]; he is driven away like a vision of the night.
translation:
  language: te
  text: కలలా అతడు ఎగిరిపోతాడు, కనబడడు[a]; రాత్రి దర్శనంలా[b] అతడు తరిమివేయబడతాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారు అతణ్ణి కనుగొనరు.” హీబ్రూలో నిర్దిష్ట కర్తను పేర్కొనని బహువచన క్రియకు ‘అతణ్ణి’ అనే కర్మ ప్రత్యయం జతచేయబడింది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “రాత్రివేళ కలిగే దర్శనంలా.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּחֲלוֹם
  choice: కలలా
  rationale: כְּ ఉపసర్గ సూచించే ఉపమానాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది; חֲלוֹם అంటే ‘కల’.
- source_word: יָעוּף
  choice: ఎగిరిపోతాడు
  rationale: עוּף అనే క్రియ యొక్క ‘ఎగురు’ అనే సజీవ చిత్రాన్ని నిలుపుతూ, అతని వేగమైన అదృశ్యాన్ని వ్యక్తం చేస్తుంది.
- source_word: וְלֹא יִמְצָאֻהוּ
  choice: ఇక కనిపించడు
  rationale: హీబ్రూలో నిర్దిష్ట కర్త లేని బహువచన క్రియతో ‘వారు అతణ్ణి కనుగొనరు’ అని ఉన్న భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; కర్త అనిశ్చితిని పాదటిప్పణిలో చూపించాం.
- source_word: וְיֻדַּד
  choice: అతడు తరిమివేయబడతాడు
  rationale: హోఫాల్ రూపంలోని ఇతరుల చేత దూరంగా నెట్టివేయబడే లేదా తరిమివేయబడే భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: כְּחֶזְיוֹן לָיְלָה
  choice: రాత్రి దర్శనంలా
  rationale: ‘రాత్రి’ మరియు ‘దర్శనం’ మధ్యనున్న హీబ్రూ సంబంధాన్ని సంక్షిప్తమైన, కవితాత్మక తెలుగులో నిలుపుతుంది.
