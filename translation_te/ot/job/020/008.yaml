translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ కవితాత్మక గంభీరతను నిలిపాం. ‘ఎగిరిపోతాడు’ అనే స్పష్టమైన రూపకాన్ని సాదాసీదాగా ‘మాయమవుతాడు’ అని మార్చలేదు; నిర్దిష్టం కాని బహువచన కర్తను ప్రధాన వాక్యంలో సహజమైన అకర్మక రూపంతో, పాదటిప్పణిలో అక్షరార్థ ప్రత్యామ్నాయంతో చూపించాం.
