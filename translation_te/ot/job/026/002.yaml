  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కవితా శైలి. ‘బాహువు’ అనే మూల రూపకాన్ని నిలిపి, వ్యంగ్యాన్ని ఆశ్చర్యార్థక వాక్యాల ద్వారా వ్యక్తం చేశాం.
