  text: How you have helped the powerless! How you have saved the arm without strength![a]
translation:
  language: te
  text: శక్తిలేనివానికి నీవెంత సహాయం చేశావు! బలంలేని బాహువును నీవెంత రక్షించావు![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, మరింత అక్షరార్థంగా: “శక్తిలేనివానికి నీవు ఏమి సహాయం చేశావు? బలంలేని బాహువును నీవు ఏమి రక్షించావు?” హెబ్రీ వాక్యం తీవ్రమైన వ్యంగ్యంతో ఉంది.'
    reason: מֶה అనే పదాన్ని ప్రశ్నార్థకంగా ‘ఏమి’ అనీ, ఆశ్చర్యార్థకంగా ‘ఎంత’ అనీ అర్థం చేసుకోవచ్చు; ప్రధాన పాఠం వ్యంగ్య ఆశ్చర్యార్థక ప్రయోగాన్ని అనుసరిస్తుంది.
lexical_decisions:
- source_word: מֶה
  choice: ఎంత
  rationale: ఇక్కడ מֶה సాధారణ ప్రశ్నార్థకమైన ‘ఏమి’ కంటే వ్యంగ్యంతో కూడిన ఆశ్చర్యార్థక ప్రయోగం. తెలుగులో ‘ఎంత’ ఆ వ్యంగ్య ప్రశంసను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: עָזַרְתָּ
  choice: నీవు సహాయం చేశావు
  rationale: עזר యొక్క ‘సహాయం చేయు’ అనే ప్రాథమిక అర్థాన్ని, బిల్దదును నేరుగా సంబోధించే రూపాన్ని నిలుపుతుంది.
- source_word: לְלֹא כֹחַ
  choice: శక్తిలేనివాడికి
  rationale: అక్షరార్థంగా ‘శక్తి లేనివానికి’ అనే ఏకవచన భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: הוֹשַׁעְתָּ
  choice: నీవు రక్షించావు
  rationale: ישע ధాతువులోని రక్షించు/విడిపించు భావాన్ని నిలుపుతూ మొదటి పాదంతో సమాంతరతను కాపాడుతుంది.
- source_word: זְרוֹעַ
  choice: బాహువును
  rationale: హెబ్రీ కవిత్వంలో శక్తికి రూపకమైన ‘బాహువు’ అనే చిత్రాన్ని ‘శక్తి’గా విప్పకుండా యథాతథంగా నిలుపుతుంది.
- source_word: לֹא עֹז
  choice: బలంలేని
  rationale: עֹז లోని బలం/పరాక్రమం భావాన్ని సంక్షిప్తంగా తెలియజేసి, ముందటి ‘శక్తిలేని’ పదబంధంతో కవితా సమాంతరతను నిలుపుతుంది.
