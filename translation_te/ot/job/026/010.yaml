translation:
  language: te
  text: ఆయన జలాల ఉపరితలంపై ఒక వృత్తాన్ని గీశాడు[a], వెలుగుకూ చీకటికీ మధ్యనున్న హద్దు వరకు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆయన జలాల ఉపరితలంపై ఒక హద్దును నిర్ణయించాడు—వెలుగుకూ చీకటికీ మధ్యనున్న అంచు వరకు.”
    reason: חֹק חָג అనే పదబంధం వృత్తాన్ని గీయడం అనే దృశ్యంతో పాటు స్థిరమైన హద్దును ఏర్పరచడం అనే భావాన్నీ అనుమతిస్తుంది.
lexical_decisions:
- source_word: חֹק חָג
  choice: ఒక వృత్తాన్ని గీశాడు
  rationale: חָג వృత్తాకార రేఖను గీయడం లేదా పరిధిని గుర్తించడం అనే భావాన్ని ఇస్తుంది; חֹק స్థిరమైన హద్దు అనే భావాన్ని బలపరుస్తుంది. సహజమైన తెలుగులో దృశ్యరూపాన్ని నిలుపుటకు ఈ సంయుక్త అనువాదం ఎంచుకోబడింది.
- source_word: עַל פְּנֵי מָיִם
  choice: జలాల ఉపరితలంపై
  rationale: פְּנֵי యొక్క అక్షరార్థమైన ‘ముఖం’ ఇక్కడ ఉపరితలాన్ని సూచిస్తుంది; ‘జలాల ఉపరితలంపై’ ఆధునిక తెలుగులో సహజంగా ఉండి స్థలసంబంధ దృశ్యాన్ని కాపాడుతుంది.
- source_word: עַד תַּכְלִית
  choice: సరిహద్దు వరకు
  rationale: עַד విస్తృతి యొక్క చివరను, תַּכְלִית అంతిమ హద్దును సూచిస్తాయి. ‘సరిహద్దు వరకు’ మూలంలోని గమ్యహద్దు భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: אוֹר עִם חֹשֶׁךְ
  choice: వెలుగు చీకట్లు కలిసే
  rationale: అక్షరార్థంగా ‘చీకటితో వెలుగు’; עִם తెలిపే సహస్థితి లేదా కలయిక భావాన్ని కవితాత్మకంగా, సహజంగా నిలుపుతూ వాటి సంగమ హద్దును సూచిస్తుంది.
