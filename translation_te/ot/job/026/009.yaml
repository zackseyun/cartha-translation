  language: te
  text: ఆయన తన సింహాసనపు ముఖాన్ని కప్పి[a][b], దానిమీద తన మేఘాన్ని పరుస్తాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తన సింహాసనపు ముఖాన్ని పట్టుకుంటూ.” హీబ్రూ క్రియకు మరింత అక్షరార్థంగా “పట్టుకొను” లేదా “గట్టిగా పట్టుకొను” అని అర్థం రావచ్చు; ఇక్కడ మేఘంతో కప్పి మరుగుచేయడం అనే భావం ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “తన సింహాసనపు ముఖం”; అంటే దాని కనిపించే ఉపరితలం లేదా ముందుభాగం.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְאַחֵז
  choice: కప్పి
  rationale: ఈ క్రియకు ప్రాథమికంగా ‘పట్టుకొను, గట్టిగా పట్టుకొను’ అనే అర్థాలున్నా, తరువాత వచ్చే ‘దానిమీద తన మేఘాన్ని పరుస్తాడు’ అనే సమాంతర చిత్రణలో సింహాసనాన్ని మరుగుచేయడం భావం సహజంగా సరిపోతుంది. మరింత అక్షరార్థమైన ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: פְּנֵי
  choice: ముఖాన్ని
  rationale: హీబ్రూ పదంలోని స్పష్టమైన ‘ముఖం’ రూపకాన్ని నిలుపుతుంది; ఇక్కడ అది కనిపించే ఉపరితలం లేదా ముందుభాగాన్ని సూచించవచ్చు.
- source_word: כִסֵּה
  choice: తన సింహాసన
  rationale: మసొరేటిక్ స్వరచిహ్నాలతో ఉన్న రూపం ‘సింహాసనం’ అని సూచిస్తుంది. వాక్యంలోని అంతర్లీన కర్త దేవుడు; తరువాతి ‘తన మేఘం’ అనే సర్వనామ సంబంధం వల్ల సింహాసనం కూడా ఆయనదేనని తెలుగులో స్పష్టం చేయడం సహజం.
- source_word: פַּרְשֵׁז
  choice: పరుస్తాడు
  rationale: క్రియలోని విస్తరించి పరచడం అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: עָלָיו
  choice: దానిమీద
  rationale: పుంలింగ ఏకవచన ప్రత్యయం సమీపంలోని ‘సింహాసనం’ వైపు తిరిగి సూచిస్తుంది; తెలుగులో ‘దానిమీద’ ఈ సంబంధాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: עֲנָנוֹ
  choice: తన మేఘాన్ని
  rationale: ఏకవచన నామవాచకంతో కూడిన మూడవ పురుష ఏకవచన ప్రత్యయాన్ని నేరుగా ప్రతిబింబిస్తుంది.
theological_decisions:
- issue: అంతర్లీన కర్త, సింహాసనం మరియు మేఘానికి సంబంధించిన స్వామ్య సూచన
  choice: దేవుడు తన సొంత సింహాసనాన్ని తన మేఘంతో మరుగుచేస్తున్నాడనే పఠనం
  alternative: ‘సింహాసనం’ అని మాత్రమే అనువదించి, దాని స్వామ్యాన్ని తెలుగులో స్పష్టంగా చెప్పకుండా ఉంచడం
  rationale: సందర్భం దేవుని విశ్వాధికార కార్యాలను వర్ణిస్తుంది; ‘తన మేఘం’ అనే స్పష్టమైన స్వామ్య ప్రత్యయం, అంతర్లీన దైవిక కర్తతో కలిసి, ‘తన సింహాసనం’ అనే సహజ తెలుగు అనువాదానికి మద్దతిస్తుంది. ఇది అదనపు సిద్ధాంతాన్ని చేర్చకుండా కవితా సందర్భాన్ని స్పష్టం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన కవితా శైలిని అనుసరించాం. ‘సింహాసన ముఖం’ అనే కొంత అసాధారణమైన రూపకాన్ని మూలంలోని దృశ్యబలాన్ని కాపాడేందుకు ఉంచి, దాని భావాన్ని పాదటిప్పణిలో వివరించాం.
