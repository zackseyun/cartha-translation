  edition: WLC
  text: אֶת מִ֭י הִגַּ֣דְתָּ מִלִּ֑ין וְ/נִשְׁמַת מִ֝י יָצְאָ֥ה מִמֶּֽ/ךָּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/026/004.yaml
  text: To whom have you declared words[a], and whose breath has come out from you?
translation:
  language: te
  text: 'నీవు ఎవరికి మాటలు తెలియజేశావు?

    నీ నుండి వెలువడిన ఊపిరి[a] ఎవరిది?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నీ నుండి వెలువడిన ఆత్మ ఎవరిది?’ హెబ్రీ పదానికి ‘ఊపిరి’ అని, కొన్ని సందర్భాల్లో ‘ఆత్మ’ అని అర్థం రావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶת מִי
  choice: ఎవరికి
  rationale: ఇక్కడ ప్రశ్నార్థక పదబంధం మాటలు ఎవరికి తెలియజేయబడ్డాయో అడుగుతోంది. తెలుగులో ‘ఎవరికి’ సహజంగా ఉండి ప్రశ్నలోని వ్యంగ్య ధ్వనిని నిలుపుతుంది.
- source_word: הִגַּדְתָּ
  choice: తెలియజేశావు
  rationale: נגד ధాతువు హిఫీల్ రూపానికి ‘తెలియజేయు, ప్రకటించు’ అనే భావం ఉంది. ‘తెలియజేశావు’ ఆధునిక తెలుగులో సహజంగా ఉండి మూలంలోని వెల్లడించే భావాన్ని కాపాడుతుంది.
- source_word: מִלִּין
  choice: మాటలు
  rationale: యోబు గ్రంథంలో కనిపించే ఈ అరామీయ ప్రభావిత బహువచనం పలికిన మాటలను సూచిస్తుంది. ‘మాటలు’ ప్రత్యక్షమైన, సాధారణ తెలుగు సమానార్థకం.
- source_word: נִשְׁמַת
  choice: ఊపిరి
  rationale: ఈ నామవాచకం ‘ఊపిరి/ప్రాణవాయువు’ అని, కొన్ని సందర్భాల్లో ‘ఆత్మ’ అని కూడా అర్థమిస్తుంది. ‘నీ నుండి వెలువడిన’ అనే క్రియతో ‘ఊపిరి’ మూలంలోని స్పష్టమైన కవితాత్మక చిత్రాన్ని నిలుపుతుంది; ప్రత్యామ్నాయ భావాన్ని పాదటిప్పణిలో ఇచ్చాం.
- source_word: מִי
  choice: ఎవరిది
  rationale: נשמתతో ఉన్న ఈ ప్రశ్నార్థకం స్వామ్యార్థకంగా ఉంది. తెలుగులో ‘ఎవరిది’ ఆ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: יָצְאָה מִמֶּךָּ
  choice: నీ నుండి వెలువడిన
  rationale: יצא యొక్క ప్రాథమిక భావం ‘బయటికి వెళ్లు/వెలువడు.’ ‘వెలువడిన’ ఊపిరి లేదా ప్రేరణ ఒకరి నుండి రావడమనే కవితాత్మక రూపకాన్ని సంక్షిప్తంగా కాపాడుతుంది.
theological_decisions:
- issue: נשמה అనే పదంలోని ‘ఊపిరి/ఆత్మ’ సందిగ్ధత
  choice: ప్రధాన పాఠంలో ‘ఊపిరి’
  alternative: ‘ఆత్మ’
  rationale: సందర్భంలోని ‘నీ నుండి వెలువడిన’ అనే భౌతిక చిత్రానికి ‘ఊపిరి’ బాగా సరిపోతుంది. అయినా ‘ఆత్మ’ అనే విస్తృత భావం సాధ్యమే కాబట్టి దాన్ని పాదటిప్పణిలో ఉంచి మూలంలోని సందిగ్ధతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ కవితాత్మక గౌరవాన్ని నిలిపే సంక్షిప్త ప్రశ్నలుగా అనువదించాం. రెండో పాదంలో ‘ఎవరిది?’ని చివర ఉంచడం ద్వారా మూలంలోని ప్రశ్నాత్మక, వ్యంగ్య బలాన్ని తెలుగు వాక్యనిర్మాణంలో సహజంగా వ్యక్తం చేశాం.
