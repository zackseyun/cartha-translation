  source_fidelity: 'The Telugu accurately represents the two Hebrew rhetorical questions: אֶת־מִי as ‘ఎవరికి,’ הִגַּדְתָּ מִלִּין as ‘మాటలు తెలియజేశావు,’ and וְנִשְׁמַת מִי יָצְאָה מִמֶּךָּ as ‘నీ నుండి వెలువడిన ఊపిరి ఎవరిది?’ The possessive force of מִי and the concrete ‘came forth from you’ imagery are retained.'
