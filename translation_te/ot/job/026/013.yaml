  yaml_path: translation/ot/job/026/013.yaml
  text: By his breath the heavens are made fair[c][b][a]; his hand pierced the fleeing serpent.
translation:
  language: te
  text: 'ఆయన ఊపిరితో[a] ఆకాశాలు సుందరమయ్యాయి;

    ఆయన చేయి పారిపోతున్న సర్పాన్ని[c] పొడిచింది[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఆయన ఆత్మతో,’ లేదా ‘ఆయన గాలితో.’ హెబ్రీ పదానికి ఊపిరి, గాలి, లేదా ఆత్మ అనే అర్థాలు రావచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘ఆయన చేయి పారిపోతున్న సర్పాన్ని రూపొందించింది.’ ఈ క్రియను భిన్నంగా అర్థం చేసుకోవచ్చు; అయితే ఈ పంక్తిలోని పోరాట చిత్రానికి ‘పొడిచింది’ బాగా సరిపోతుంది.
    reason: alternative_reading
  - marker: c
    text: ‘పారిపోతున్న సర్పం’ విశ్వంలోని అస్తవ్యస్త శక్తులను సూచించే సర్పాన్ని తలపించవచ్చు; యెషయా 27:1 చూడండి.
    reason: cross_reference
lexical_decisions:
- source_word: בְּרוּחוֹ
  choice: ఆయన ఊపిరిచేత
  rationale: רוּחַ అనే పదానికి ‘ఊపిరి,’ ‘గాలి,’ లేదా ‘ఆత్మ’ అనే అర్థాలు ఉండవచ్చు. ఈ కవితాత్మక సృష్టి సందర్భంలో ‘ఊపిరి’ సజీవమైన చిత్రాన్ని నిలుపుతుంది; בְּ సాధనార్థకంగా ‘చేత/ద్వారా’ అని సూచిస్తుంది.
- source_word: שָׁמַיִם
  choice: ఆకాశాలు
  rationale: కవితాత్మక, విశ్వసంబంధ సందర్భంలో హెబ్రీ బహువచన రూపాన్ని సహజమైన తెలుగు బహువచనంతో నిలిపింది.
- source_word: שִׁפְרָה
  choice: శోభిల్లాయి
  rationale: שׁפר అందం, ప్రకాశం, వైభవం అనే భావాలను సూచిస్తుంది. దేవుని చర్యవల్ల ఆకాశాలు సుందరంగా, తేజోవంతంగా కనిపించాయనే ఫలితభావాన్ని ‘శోభిల్లాయి’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: חֹלֲלָה
  choice: పొడిచింది
  rationale: ఈ కవితాత్మక క్రియకు ‘పొడిచింది’ లేదా ‘రూపొందించింది’ వంటి భిన్న విశ్లేషణలు ఉన్నాయి. ‘చెయ్యి’ కర్తగా, ‘పారిపోతున్న సర్పం’ కర్మగా ఉన్నందున పోరాట చిత్రానికి ‘పొడిచింది’ బాగా సరిపోతుంది; ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచింది.
- source_word: יָדוֹ
  choice: ఆయన చెయ్యి
  rationale: మూలంలోని స్పష్టమైన శరీరచిత్రాన్ని నిలిపింది; కవితలో ఇది దేవుని కార్యశక్తిని కూడా సూచిస్తుంది.
- source_word: נָחָשׁ בָּרִיחַ
  choice: పారిపోతున్న సర్పం
  rationale: בָּרִיחַ అనే విశేషణానికి ‘పారిపోతున్న,’ ‘వంకరగా సాగుతున్న,’ లేదా ‘వేగంగా కదిలే’ వంటి భావాలు సాధ్యమైనా, సమాంతర విశ్వపోరాట చిత్రంలో ‘పారిపోతున్న’ అనేది సమర్థించదగిన పఠనం. సర్పాన్ని మరొక నిర్దిష్ట వ్యక్తితో సమానీకరించకుండా మూలచిత్రాన్ని నిలిపింది.
theological_decisions:
- issue: רוּחַను ప్రత్యేక త్రిత్వ వ్యక్తిని స్పష్టంగా సూచించే ‘ఆత్మ’గా అనువదించాలా?
  choice: ప్రధాన పాఠ్యంలో ‘ఊపిరి’
  alternative: ‘ఆత్మ’ లేదా ‘గాలి’
  rationale: హెబ్రీ పదమే ఇక్కడ వ్యక్తిగత ‘ఆత్మ’ అనే అర్థాన్ని తప్పనిసరి చేయదు. ‘ఊపిరి’ దేవుని సృజనాత్మక శక్తికి సంబంధించిన కవితాత్మక చిత్రాన్ని నిలుపుతూ, సాధ్యమైన ఇతర అర్థాలను పాదటిప్పణిలో సంరక్షిస్తుంది.
- issue: נָחָשׁ בָּרִיחַను ప్రధాన పాఠ్యంలో సాతాను లేదా లివ్యాతానుగా స్పష్టంగా గుర్తించాలా?
  choice: ‘పారిపోతున్న సర్పం’ అనే మూలచిత్రాన్ని నిలిపింది
  alternative: లివ్యాతాను, విశ్వ అస్తవ్యస్తతకు ప్రతీకైన సర్పం, లేదా సాతాను
  rationale: ఈ వచనం విశ్వపోరాటాన్ని తలపించే కవితాత్మక చిత్రాన్ని ఇస్తుంది గాని, సర్పాన్ని సాతానుగా లేదా లివ్యాతానుగా నేరుగా గుర్తించదు. అందువల్ల ప్రధాన పాఠ్యం మూలం చెప్పినదానికంటే ఎక్కువగా నిర్ధారించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన కవితాత్మక శైలి వాడబడింది. ‘శోభిల్లాయి,’ ‘సర్పం’ వంటి పదాలు యోబు గ్రంథపు ఉన్నత కవితా స్వరాన్ని నిలుపుతాయి; అస్పష్టతలు ప్రధాన పాఠ్యంలో బలవంతంగా పరిష్కరించకుండా పాదటిప్పణుల్లో చూపబడ్డాయి.
