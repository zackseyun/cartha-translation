translation:
  language: te
  text: 'ఆయన ఉత్తర దిక్కును[a] శూన్యంపై[b] చాపుతాడు;

    భూమిని ఏదీ లేనిదానిపై వేలాడదీస్తాడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఉత్తర ఆకాశాన్ని.’ హీబ్రూ పాఠంలో కేవలం ‘ఉత్తరం’ అని ఉంది; ఈ కవితాత్మక సందర్భంలో అది ఉత్తర ఆకాశాన్ని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘నిరాకారమైన వెలితిపై.’ హీబ్రూ పదం శూన్యతను, పాడుతనాన్ని లేదా నిరాకారమైన వెలితిని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹטֶה
  choice: విస్తరింపజేస్తాడు
  rationale: נטה అనే క్రియకు ‘చాపు, విస్తరించు’ అనే భావం ఉంది. ఇక్కడ సృష్టి సంబంధమైన కవితాత్మక చిత్రణను సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: צָפוֹן
  choice: ఉత్తర దిక్కును
  rationale: హీబ్రూ పదానికి సాధారణ అర్థం ‘ఉత్తరం/ఉత్తర దిక్కు.’ సందర్భంలో ఇది ఉత్తర ఆకాశాన్ని సూచించవచ్చు; అయినా మూలంలోని సంక్షిప్తతను ప్రధాన పాఠంలో నిలిపాం.
- source_word: תֹּהוּ
  choice: శూన్యంపై
  rationale: תֹּהוּ శూన్యత, నిరాకారమైన వెలితి, పాడుతనం వంటి భావాలను సూచించగలదు. ‘శూన్యం’ సంక్షిప్తంగా ఉండి, కవితాత్మక అస్పష్టతను కాపాడుతుంది.
- source_word: תֹּלֶה
  choice: వేలాడదీస్తాడు
  rationale: תלה యొక్క ప్రత్యక్ష భావం ‘వేలాడదీయడం.’ ఇది పద్యంలోని దృశ్యరూపాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: אֶרֶץ
  choice: భూమిని
  rationale: ఈ విశ్వసంబంధ సందర్భంలో אֶרֶץ ఒక నిర్దిష్ట దేశాన్ని కాక భూమిని సూచిస్తుంది.
- source_word: בְּלִי מָה
  choice: ఏ ఆధారమూ లేకుండా
  rationale: అక్షరార్థంగా ‘ఏదీ లేకుండా/ఏమీ కానిదానిపై’ అనే భావం. తెలుగులో ‘ఏ ఆధారమూ లేకుండా’ వేలాడదీయడం అనే క్రియతో సహజంగా కలుస్తుంది; కింద ఎలాంటి ఆధారమూ లేదనే చిత్రణను తెలియజేస్తుంది.
- source_word: עַל
  choice: పై / లేకుండా
  rationale: మొదటి సందర్భంలో స్థలసంబంధ భావాన్ని ‘పై’గా నేరుగా ఇచ్చాం. రెండవ עַל־בְּלִי־מָה అనే సమగ్ర పదబంధాన్ని తెలుగులో సహజంగా ‘ఏ ఆధారమూ లేకుండా’ అని అందించాం.
theological_decisions:
- issue: విశ్వ నిర్మాణానికి సంబంధించిన కవితాత్మక చిత్రణ
  choice: దేవుడు సృష్టిపై కలిగిన అధికారాన్ని తెలిపే కవితాత్మక చిత్రణగా మూలపాఠాన్ని యథాతథంగా నిలపడం
  alternative: దీనిని ఆధునిక శాస్త్రీయ ప్రకటనగా వివరించడం లేదా ‘ఉత్తరం’లో తప్పనిసరిగా పురాణ సంబంధ సూచన ఉందని విస్తరించడం
  rationale: ఇది జ్ఞానసాహిత్యంలోని కవితాత్మక వాక్యం. అనువాదం దాని విశ్వసంబంధ చిత్రణను నిలపాలి గాని ఆధునిక శాస్త్రీయ భావనలను గానీ నిర్బంధిత పురాణ వ్యాఖ్యానాన్ని గానీ చేర్చకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కవితాత్మక శైలిని ఉపయోగించాం. ‘ఉత్తర దిక్కు,’ ‘శూన్యం’ మూలంలోని సంక్షిప్తతను, అర్థ విస్తృతిని నిలుపుతాయి. రెండు పాదాల సమాంతర నిర్మాణం పఠన సౌలభ్యం కోసం కాపాడబడింది.
