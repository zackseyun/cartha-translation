    reason: lexical_alternative
lexical_decisions:
- source_word: עָרוֹם
  choice: దిగంబరంగా ఉంది
  rationale: ‘నగ్నంగా, బట్టబయలుగా’ అనే విశేషణార్థాన్ని, షియోల్‌ను సజీవ చిత్రంగా చూపే హెబ్రీ కవిత్వాన్ని నిలుపుతూ సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: שְׁאוֹל
  choice: షియోల్
  rationale: ‘సమాధి’ లేదా ‘మృతుల లోకం’ అని అర్థపరిధిని కుదించకుండా, జ్ఞానసాహిత్యంలో ఈ హెబ్రీ పదానికి ఉన్న ప్రత్యేక భావప్రపంచాన్ని నిలుపుతుంది.
- source_word: נֶגְדּוֹ
  choice: ఆయన ఎదుట
  rationale: ‘అతని ఎదుట/సన్నిధిలో’ అనే మూలార్థాన్ని నేరుగా అందిస్తుంది; సందర్భంలో ‘ఆయన’ దేవుణ్ణి సూచిస్తుంది.
- source_word: אֵין
  choice: లేదు
  rationale: తదుపరి నామవాచకంతో కలిపి ‘ఏ కప్పూ లేదు’ అనడం తెలుగులో సహజంగా ఉండి, హెబ్రీ అస్తిత్వనిరాకరణ నిర్మాణాన్ని కాపాడుతుంది.
- source_word: כְּסוּת
  choice: కప్పు
  rationale: ‘కప్పేది, ఆచ్ఛాదనం’ అనే అర్థాన్ని సంక్షిప్తంగా ఇస్తూ, మొదటి పాదంలోని దిగంబరత్వ చిత్రానికి సమాంతరతను నిలుపుతుంది.
- source_word: אֲבַדּוֹן
  choice: అబద్దోను
  rationale: ‘నాశనం’ అనే భావార్థం సాధ్యమైనా, షియోల్‌కు సమాంతరంగా స్థలనామంలా వినిపించే కవితాత్మక ప్రయోగాన్ని, ఇతర వచనాలతో సంబంధాన్ని నిలుపడానికి లిప్యంతరీకరించబడింది.
theological_decisions:
- issue: נֶגְדּוֹ లోని తృతీయ పురుష ఏకవచన ప్రత్యయం ఎవరిని సూచిస్తుంది?
  choice: ‘ఆయన ఎదుట’—సందర్భానుసారం దేవుణ్ణి సూచిస్తుంది.
  alternative: తక్షణ సంభాషణలో పేర్కొనని మరొక పరిశీలకుడు.
  rationale: ఈ సందర్భంలో యోబు మరుగైన లోకాలపై దేవుని జ్ఞానాన్నీ అధికారాన్నీ వర్ణిస్తున్నాడు. ‘ఆయన ఎదుట’ అని మాత్రమే ఉంచడం ద్వారా హెబ్రీ రూపాన్ని అనుసరిస్తూ, దేవుడు అనే సందర్భార్థాన్ని వివరణగా పాఠ్యంలో చేర్చకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కవితాత్మక శైలి. ‘షియోల్,’ ‘అబద్దోను’ అనే మూలభాషా పదాలను ఉంచి, పాదాల మధ్య నగ్నత్వం–కప్పు అనే రూపక సమాంతరతను కాపాడాం. అన్ని పాదసూచికలు ప్రధాన పాఠ్యంలో ఉన్నాయి.
