translation:
  language: te
  text: జ్ఞానం లేనివానికి నీవెంతగా సలహా ఇచ్చావు, సద్వివేకాన్ని ఎంత విస్తారంగా తెలియజేశావు!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַה
  choice: ఎంతగా
  rationale: ఇక్కడ ప్రశ్నార్థక భావం కంటే వ్యంగ్యంతో కూడిన ఆశ్చర్యార్థక ప్రయోగం ప్రధానంగా ఉంది. అందువల్ల ‘ఎంతగా’ అనేది సందర్భంలోని యోబు వ్యంగ్యాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: יָּעַצְתָּ
  choice: సలహా ఇచ్చావు
  rationale: יעץ అనే క్రియకు నేరమైన, ఆధునిక తెలుగులో సహజమైన సమానార్థకం.
- source_word: לְלֹא חָכְמָה
  choice: జ్ఞానం లేనివానికి
  rationale: లక్ష్యవ్యక్తిని సూచించే לְతో పాటు ‘జ్ఞానం లేని’ అనే భావాన్ని తెలుగులో స్పష్టంగా, అతిగా నిర్దిష్టం చేయకుండా వ్యక్తం చేస్తుంది.
- source_word: חָכְמָה
  choice: జ్ఞానం
  rationale: జ్ఞానసాహిత్యంలో ఈ పదానికి స్థిరమైన, విస్తృతంగా అర్థమయ్యే తెలుగు పదం.
- source_word: וְתוּשִׁיָּה
  choice: సద్వివేకం
  rationale: תושיה సూచించే దృఢమైన, ప్రయోజనకరమైన జ్ఞానం లేదా సరైన నిర్ణయశక్తిని సంక్షిప్తంగా వ్యక్తం చేస్తుంది; కేవలం ‘విజయం’ అని పరిమితం చేయదు.
- source_word: לָרֹב
  choice: ఎంత విస్తారంగా
  rationale: తెలియజేసిన పరిమాణం లేదా విస్తృతిని సూచిస్తూ, వాక్యంలోని వ్యంగ్యాత్మక అతిశయాన్ని సహజంగా నిలుపుతుంది.
- source_word: הוֹדָעְתָּ
  choice: తెలియజేశావు
  rationale: ידע హిఫీల్ రూపంలోని ‘తెలియజేయు’ అనే కారణార్థక భావాన్ని నేరుగా వ్యక్తం చేస్తుంది.
