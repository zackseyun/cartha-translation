  yaml_path: translation/ot/job/026/005.yaml
  text: The departed spirits tremble beneath the waters[a], and those who dwell in them.
translation:
  language: te
  text: మృతులు జలాల కింద వణుకుతారు[a]; వాటిలో నివసించేవారూ వణుకుతారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మృతుల ఛాయలు జలాల కింద గిలగిలలాడుతారు.’ హీబ్రూ רְפָאִים అనే పదానికి ‘మృతులు’ లేదా ‘మృతుల ఛాయలు’ అనే అర్థాలు ఉండవచ్చు; יְחוֹלָלוּ అనే క్రియను ‘గిలగిలలాడుతారు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרְפָאִים
  choice: మృతుల ఆత్మలు
  rationale: ఇక్కడ ఈ పదం ప్రాచీన రెఫాయీయుల జాతిని కాకుండా, పాతాళంలోని మృతులను సూచిస్తుంది. ‘మృతుల ఆత్మలు’ అనే ప్రయోగం దాని కవితాత్మకమైన పాతాళ భావాన్ని ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: יְחוֹלָלוּ
  choice: వణుకుతాయి
  rationale: חול ధాతువు వణకడం, గిలగిలలాడడం లేదా ప్రసవవేదన పడడం వంటి భావాలను ఇవ్వగలదు. దేవుని ఎదుట అధోలోకమూ భయకంపితమవుతుందనే సందర్భంలో ‘వణుకుతాయి’ సహజంగా సరిపోతుంది; ‘గిలగిలలాడుతాయి’ కూడా సాధ్యమే.
- source_word: מִתַּחַת מַיִם
  choice: జలాల కింద
  rationale: హీబ్రూ పదబంధంలోని స్థానార్థాన్ని, కవితాత్మక జలచిత్రాన్ని ఇది సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: וְשֹׁכְנֵיהֶם
  choice: వాటిలో నివసించేవారు కూడా
  rationale: బహువచన ప్రత్యయం ముందున్న ‘జలాలు’ను సూచిస్తుందని గ్రహించి అనువదించాం. హీబ్రూలో రెండవ భాగంలో క్రియ విడిచిపెట్టబడినందున, తెలుగులో భావస్పష్టత కోసం ‘వణుకుతారు’ను పునరుక్తం చేశాం.
theological_decisions:
- issue: רְפָאִים అనే పదం ఎవరిని సూచిస్తుంది?
  choice: పాతాళంలోని మృతుల ఆత్మలు
  alternative: ప్రాచీన రెఫాయీయులు అనే ప్రజాజాతి
  rationale: యోబు 26లో దేవుని అధికారం విశ్వం మీదా అధోలోకం మీదా ఉందని కవితాత్మకంగా వర్ణిస్తున్నారు. అందువల్ల ఇక్కడ ఈ పదానికి మృతులు అనే కవితాత్మక అర్థమే సందర్భోచితం; ఇది సిద్ధాంతపరమైన విశదీకరణ కాదు, పదసందర్భ నిర్ణయం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన కవితా శైలిని ఉపయోగించాం. ‘నీళ్లు’ కంటే ‘జలాలు’ మూలంలోని విశ్వవ్యాప్త కవితాత్మక దృశ్యానికి తగినది. హీబ్రూ సమాంతర నిర్మాణాన్ని నిలుపుతూ, తెలుగులో అస్పష్టత రాకుండా రెండవ భాగంలో క్రియను పునరుక్తం చేశాం.
