id: JOB.26.12
reference: Job 26:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: בְּ֭/כֹח/וֹ רָגַ֣ע הַ/יָּ֑ם ו/ב/תובנת/ו מָ֣חַץ רָֽהַב׃
base_translation:
  language: en
  yaml_path: translation/ot/job/026/012.yaml
  text: By his power he stilled the sea[a], and by his understanding he shattered Rahab.
translation:
  language: te
  text: తన శక్తితో ఆయన సముద్రాన్ని అణచివేశాడు; తన వివేకంతో రాహాబును[a] నలిపివేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘రాహాబు’ అనేది దేవునికి ఎదురు నిలిచే అస్తవ్యస్త శక్తికి లేదా సముద్ర భీకర జీవికి వాడిన కవితాత్మక పేరు; దీనిని భావానువాదంగా ‘సముద్ర భీకర జీవి’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּכֹחוֹ
  choice: తన శక్తితో
  rationale: בְּ ఉపసర్గ ఇక్కడ సాధనార్థకంగా ఉంది; כֹּחַ దేవుని విశ్వవ్యాప్త సామర్థ్యాన్ని సూచిస్తున్నందున ‘శక్తి’ సహజమైన ఎంపిక.
- source_word: רָגַע
  choice: అణచివేశాడు
  rationale: సముద్రాన్ని శాంతింపజేయడం, అదుపులోకి తేవడం అనే భావాన్ని ‘అణచివేశాడు’ సహజంగా వ్యక్తం చేస్తుంది; ఇది కవితాత్మకంగా సముద్రం అనే అస్తవ్యస్త శక్తిని లోబరచే భావాన్ని కూడా నిలుపుతుంది.
- source_word: הַיָּם
  choice: సముద్రాన్ని
  rationale: יָם యొక్క సాధారణ అర్థాన్ని నిలుపుతూ, యోబు కవిత్వంలోని అస్తవ్యస్త శక్తికి సంబంధించిన ప్రతిధ్వనిని అతిగా వ్యాఖ్యానించకుండా ఉంచుతుంది.
- source_word: וּבִתְבוּנָתוֹ
  choice: తన వివేకంతో
  rationale: תְּבוּנָה అవగాహన, అంతర్దృష్టి, వివేచన అనే భావాలను కలిగి ఉంది; ‘వివేకం’ యోబు గ్రంథంలోని జ్ఞాన నేపథ్యానికి తగిన సహజ తెలుగు పదం.
- source_word: מָחַץ
  choice: చిత్తుచేశాడు
  rationale: ఈ క్రియ బలంగా నలగగొట్టడం లేదా పూర్తిగా ఓడించడం అనే భావాన్ని ఇస్తుంది; ‘చిత్తుచేశాడు’ నిర్ణాయక పరాజయాన్ని కవితాత్మకంగా వ్యక్తం చేస్తుంది.
- source_word: רָהַב
  choice: రాహాబు
  rationale: ఇక్కడ ఇది యెరికోకు చెందిన స్త్రీ పేరు కాదు; అస్తవ్యస్తతను సూచించే కవితాత్మక ప్రత్యర్థి పేరు. పేరును లిప్యంతరీకరించి, దాని భావాన్ని పాదటిప్పణిలో వివరించడం మూలంలోని చిత్రణను కాపాడుతుంది.
theological_decisions:
- issue: רָהַב ను పేరుగా ఉంచాలా, సాధారణ భావంగా అనువదించాలా
  choice: అస్తవ్యస్త శక్తి లేదా సముద్ర భీకర జీవిని సూచించే ‘రాహాబు’ అనే పేరుగా ఉంచడం
  alternative: ‘సముద్ర భీకర జీవి’ లేదా ‘గర్వం’ అని భావానువాదం చేయడం
  rationale: యోబు గ్రంథంలోని కవితాత్మక, విశ్వసంబంధ సందర్భంలో ఇది దేవుడు జయించిన అస్తవ్యస్త ప్రత్యర్థిని సూచిస్తుంది. పేరును ఉంచడం మూలంలోని కవితాత్మక ఉద్రిక్తతను కాపాడుతుంది; పాదటిప్పణి పాఠకునికి అర్థాన్ని తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కవితాత్మక శైలి. సమాంతర వాక్య నిర్మాణాన్ని నిలుపుతూ, సాంకేతిక లేదా మతశాఖాపరమైన పదజాలాన్ని నివారించాం.
