source:
  edition: WLC
  text: עַמּוּדֵ֣י שָׁמַ֣יִם יְרוֹפָ֑פוּ וְ֝/יִתְמְה֗וּ מִ/גַּעֲרָתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/026/011.yaml
  text: The pillars of heaven tremble and are astonished at his rebuke[a][b][c].
translation:
  language: te
  text: ఆకాశ స్తంభాలు వణుకుతాయి[a]; ఆయన గద్దింపుకు[b] విస్తుపోతాయి[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘కంపిస్తాయి.’
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా ‘ఆయన గద్దింపు నుండి’; భావం ‘ఆయన గద్దింపు వల్ల’ అని కూడా కావచ్చు.
    reason: lexical_alternative
  - marker: c
    text: లేదా ‘నివ్వెరపోతాయి’ / ‘దిగ్భ్రాంతి చెందుతాయి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמּוּדֵי שָׁמַיִם
  choice: ఆకాశ స్తంభాలు
  rationale: నిర్మాణ సమాసంలోని ‘స్తంభాలు’ అనే మూల చిత్రాన్ని నిలుపుతూ, שָׁמַיִםను ఈ కవితా సందర్భంలో సహజమైన ఏకవచన భావంతో ‘ఆకాశం’గా అనువదించాం. ఈ విశ్వచిత్రణను పర్వతాలు లేదా పునాదులు అని వివరణాత్మకంగా మార్చలేదు.
- source_word: יְרוֹפָפוּ
  choice: వణుకుతాయి
  rationale: רפף సూచించే కంపించడం లేదా కదలడం అనే భావాన్ని ‘వణుకుతాయి’ స్పష్టంగా, కవితాత్మకంగా అందిస్తుంది; ‘కదులుతాయి’ కూడా సాధ్యమే కాని తక్కువ తీవ్రత కలిగినది.
- source_word: וְיִתְמְהוּ
  choice: విస్తుపోతాయి
  rationale: תמהּలోని దిగ్భ్రాంతి, ఆశ్చర్య భావాలను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది. ‘నివ్వెరపోతాయి’ మరింత వాడుక భాషకు దగ్గరగా ఉండగా, ‘భయభ్రాంతులవుతాయి’ భయాన్ని అధికంగా నిర్దేశిస్తుంది.
- source_word: מִגַּעֲרָתוֹ
  choice: ఆయన గద్దింపుకు
  rationale: מִן ఇక్కడ మూలం లేదా కారణాన్ని సూచించగలదు. తెలుగులో ‘గద్దింపుకు’ అనేది ఆ గద్దింపు వలన లేదా దానికి ప్రతిస్పందనగా అనే భావాన్ని సహజంగా అందిస్తుంది; అక్షరార్థమైన ‘గద్దింపు నుండి’ ఈ సందర్భంలో అసహజంగా ఉంటుంది.
theological_decisions:
- issue: ‘ఆకాశ స్తంభాలు’ అనే విశ్వచిత్రణ
  choice: కవితాత్మక విశ్వచిత్రాన్ని యథాతథంగా నిలుపడం
  alternative: దీనిని పర్వతాలు లేదా ఆకాశపు పునాదులు అని వ్యాఖ్యానించి అనువదించడం
  rationale: హీబ్రూ పద్యం ఇచ్చిన ప్రాచీన విశ్వచిత్రాన్ని ఆధునికీకరించకుండా, అలాగే తప్పనిసరిగా అక్షరార్థ నిర్మాణంగా నిర్ధారించకుండా అనువాదంలో నిలుపాలి.
- issue: గద్దింపుతో సంబంధాన్ని సూచించే מִן
  choice: ‘ఆయన గద్దింపుకు’ అని ప్రతిస్పందన/కారణ భావాన్ని తెరిచి ఉంచడం
  alternative: ‘ఆయన గద్దింపు వల్ల’ అని కారణార్థాన్ని మాత్రమే స్పష్టీకరించడం
  rationale: మూలంలోని ఉపసర్గ మూలం లేదా కారణం రెండింటినీ సూచించగలదు. ప్రధాన పాఠం సహజంగా ఉండాలి; పాదసూచిక ఆ వ్యాప్తిని తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కవితా శైలిని ఉపయోగించాం. ‘ఆకాశ స్తంభాలు’ అనే మూల రూపకాన్ని నిలిపి, క్రియలను తెలుగులో వ్యాకరణబద్ధంగా నపుంసక బహువచన రూపంలో ఇచ్చాం.
