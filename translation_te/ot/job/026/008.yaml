  text: צֹרֵֽר מַ֥יִם בְּ/עָבָ֑י/ו וְ/לֹא נִבְקַ֖ע עָנָ֣ן תַּחְתָּֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/026/008.yaml
  text: He binds up the waters in his clouds[b][a], yet the cloud is not split open under them.
translation:
  language: te
  text: ఆయన తన దట్టమైన మేఘాల్లో నీళ్లను కట్టి ఉంచుతాడు; అయినా వాటి కింద మేఘం చీలిపోదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘వాటి కింద మేఘం చీలిపోదు.’ హీబ్రూలో ‘వాటి’ అనే బహువచన ప్రత్యయం దేనిని సూచిస్తుందో పూర్తిగా స్పష్టం కాదు; అది నీళ్లను లేదా మేఘరాశులను సూచించవచ్చు.
    reason: ambiguity
lexical_decisions:
- source_word: צֹרֵר
  choice: కట్టి ఉంచుతాడు
  rationale: צרר అనే క్రియలో కట్టడం, చుట్టడం, నిర్బంధించి ఉంచడం అనే భావాలున్నాయి. ‘కట్టి ఉంచుతాడు’ నీళ్లు మేఘాల్లో అదుపులో ఉన్నాయనే కవితాత్మక చిత్రాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: מַיִם
  choice: నీళ్లను
  rationale: హీబ్రూలో ఇది బహువచన రూపమైనా, ఆధునిక తెలుగులో ‘నీళ్లు’ సహజమైన బహువచనార్థక రూపం; విశ్వసృష్టికి సంబంధించిన కవితాత్మక దృశ్యాన్నీ నిలుపుతుంది.
- source_word: בְּעָבָיו
  choice: తన దట్టమైన మేఘాల్లో
  rationale: עָב సాధారణంగా మేఘాన్ని, ప్రత్యేకంగా దట్టమైన మేఘరాశిని సూచించగలదు. ‘దట్టమైన మేఘాలు’ మూలపదంలోని సాంద్రత భావాన్ని సహజంగా తెలియజేస్తుంది; 3వ పురుష ఏకవచన స్వామ్య ప్రత్యయం ‘తన’గా నిలుపబడింది.
- source_word: וְלֹא
  choice: అయినా ... పోదు
  rationale: మేఘాల్లో నీళ్లు కట్టి ఉంచబడినా మేఘం చీలకపోవడంలోని వ్యతిరేక భావాన్ని ‘అయినా’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: נִבְקַע
  choice: చీలిపోదు
  rationale: בקע నిఫాల్ రూపం ‘చీలబడడం/పగిలి తెరుచుకోవడం’ అనే నిష్క్రియ భావాన్ని ఇస్తుంది. తెలుగులో ‘చీలిపోదు’ ఆ దృశ్యాన్ని సంక్షిప్తంగా, సహజంగా నిలుపుతుంది.
- source_word: עָנָן
  choice: మేఘం
  rationale: మూలంలోని ఏకవచనాన్ని నిలుపుతూ ‘మేఘం’ అని అనువదించాం. ముందు ఉన్న మేఘాల సమూహాన్ని ఇది కవితాత్మకంగా సామూహిక ఏకవచనంగా సూచించవచ్చు.
- source_word: תַּחְתָּם
  choice: వాటి బరువుకు
  rationale: అక్షరార్థంగా ‘వాటి కింద’ అని ఉన్నప్పటికీ, తెలుగులో మేఘం నీళ్ల కింద చీలడం అసహజంగా వినిపిస్తుంది. సందర్భంలో నీళ్ల ఒత్తిడి లేదా బరువు భావం ఉద్దేశించబడినందున ‘వాటి బరువుకు’ దృశ్య సంబంధాన్ని సహజంగా తెలుపుతుంది; అక్షరార్థ ప్రత్యామ్నాయం పాదసూచికలో ఇవ్వబడింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కవితా శైలి ఉపయోగించబడింది. ‘నీళ్లు’, ‘కట్టి ఉంచుతాడు’, ‘చీలిపోదు’ వంటి సాధారణ పదాలతో మూలంలోని విశ్వసృష్టి దృశ్యం నిలుపబడింది. మూలంలోని תַּחְתָּם సూచించే సంబంధం అస్పష్టంగా ఉన్నందున ప్రధాన పాఠంలో సందర్భోచిత భావం, పాదసూచికలో అక్షరార్థం మరియు సూచ్యార్థ అస్పష్టత ఇవ్వబడ్డాయి.
