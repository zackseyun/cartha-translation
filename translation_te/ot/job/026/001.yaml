lexical_decisions:
- source_word: וַיַּעַן
  choice: జవాబిచ్చాడు
  rationale: ענה అనే క్రియ సంభాషణలో ముందటి మాటకు ప్రతిస్పందనను పరిచయం చేస్తుంది; ‘జవాబిచ్చాడు’ ఆధునిక తెలుగులో సహజంగా ఆ సంబంధాన్ని నిలుపుతుంది.
- source_word: אִיּוֹב
  choice: యోబు
  rationale: ఈ వ్యక్తి పేరుకు తెలుగులో స్థిరపడిన ప్రామాణిక రూపం ‘యోబు’.
- source_word: וַיֹּאמַר
  choice: ఇలా
  rationale: ‘జవాబిచ్చి చెప్పాడు’ అని రెండు క్రియలను యథారూపంగా ఉంచడం తెలుగులో భారంగా ఉంటుంది. ప్రత్యక్ష ప్రసంగాన్ని పరిచయం చేసే ‘ఇలా’ ద్వారా אמר యొక్క వాక్యారంభ విధి సహజంగా వ్యక్తమవుతుంది.
- source_word: וַ
  choice: అప్పుడు
  rationale: ఆరంభంలోని వావ్-క్రమానుసంధానం ముందటి ప్రసంగం తరువాత జరిగే ప్రతిస్పందనను సూచిస్తుంది; ‘అప్పుడు’ ఆ క్రమాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
