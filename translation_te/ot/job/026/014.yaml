  variant: modern standard Telugu
source:
  edition: WLC
  text: הֶן אֵ֤לֶּה קְצ֬וֹת דרכ/ו וּ/מַה שֵּׁ֣מֶץ דָּ֭בָר נִשְׁמַע בּ֑/וֹ וְ/רַ֥עַם גבורת/ו מִ֣י יִתְבּוֹנָֽן־׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/job/026/014.yaml
  text: Look[a], these are the fringes of his ways[b], and what a mere whisper we hear of him! But the thunder of his power—who can understand it?
translation:
  language: te
  text: ఇదిగో[a], ఇవి ఆయన మార్గాల అంచులు మాత్రమే; ఆయన గురించి మనకు వినిపించేది ఎంత స్వల్పమైన గుసగుస మాత్రమే![b] అయితే ఆయన శక్తి ఉరుమును ఎవరు గ్రహించగలరు?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘చూడండి.’ ఈ పదం తరువాత చెప్పబోయే విషయంపై బలంగా దృష్టి నిలిపిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ పదబంధాన్ని ‘ఒక విషయం గురించిన ఎంతటి స్వల్ప సూచన మాత్రమే మనకు వినిపిస్తుంది!’ అని కూడా అనువదించవచ్చు. అది మనకు వినిపించేది ఎంత తక్కువో నొక్కిచెప్పి, తరువాతి ‘ఉరుము’తో వ్యత్యాసాన్ని కలిగిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶן
  choice: ఇదిగో
  rationale: దృష్టిని బలంగా ఆకర్షించే హీబ్రూ నిపాతానికి ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన సమానం.
- source_word: קְצוֹת
  choice: అంచులు
  rationale: దేవుని కార్యరీతులలో మనకు కనిపించేవి బయటి చివరలు మాత్రమే అనే భావాన్ని స్పష్టంగా తెలియజేస్తుంది; ‘చివరలు’ కంటే ‘అంచులు’ ఈ రూపకానికి సహజం.
- source_word: דרכיו
  choice: ఆయన మార్గాలు
  rationale: దేవుడు వ్యవహరించే లేదా కార్యం చేసే విధానాలను సూచించే మూలభాష రూపకాన్ని వ్యాఖ్యానించి కుదించకుండా నిలుపుతుంది.
- source_word: שֵׁמֶץ דָּבָר
  choice: మెల్లని గుసగుస మాత్రమే
  rationale: అరుదైన పదబంధంలోని అత్యల్ప పరిమాణం మరియు అతి స్వల్పంగా వినిపించే ధ్వని—ఈ రెండు ఛాయలను అందించి, తరువాతి ‘ఉరుము’తో ఉన్న కావ్యాత్మక వ్యత్యాసాన్ని నిలుపుతుంది.
- source_word: נִשְׁמַע בּוֹ
  choice: ఆయన గురించి మనకు వినిపించేది
  rationale: మానవులకు దేవుని గురించి తెలిసేది అతి కొద్దే అనే సందర్భార్థాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; ‘ఆయన నుండి’ అని అనవసరంగా ప్రత్యక్ష ప్రకటన భావాన్ని చేర్చదు.
- source_word: רַעַם גבורתו
  choice: ఆయన శక్తి ఉరుము
  rationale: ‘గుసగుస’కు ఎదురుగా ఉన్న శ్రవణ రూపకాన్ని యథాతథంగా నిలుపుతూ దేవుని అపార బలాన్ని తెలియజేస్తుంది.
- source_word: יִתְבּוֹנָן
  choice: గ్రహించగలరు
  rationale: శ్రద్ధగా అవగాహన చేసుకోవడం లేదా లోతుగా అర్థం చేసుకోవడం అనే క్రియాభావానికి సహజమైన తెలుగు సమానం.
theological_decisions:
- issue: దేవుని మార్గాల గురించి మానవ జ్ఞానపు పరిమితి
  choice: ఈ సందర్భంలో మానవులకు అవగతమయ్యేది దేవుని మార్గాల బయటి అంచులు, ఆయన శక్తికి సంబంధించిన అతి స్వల్ప సూచన మాత్రమే అని అనువదించబడింది.
  alternative: ఈ మాటలను సృష్టిలో కనిపించే దేవుని కార్యాలకు మాత్రమే పరిమితం చేసి చదవవచ్చు.
  rationale: సమీప సందర్భం దేవుని విశ్వసంబంధ కార్యాలను వర్ణించినా, పద్యం వాటిని ఆధారంగా చేసుకొని మానవ అవగాహన పరిమితిని కవితాత్మకంగా తెలియజేస్తుంది. అనువాదం దీనిని దేవుని సమస్త సత్త్వంపై విస్తృత తాత్త్విక ప్రకటనగా మార్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ కవితాత్మక గాంభీర్యాన్ని నిలిపే శైలి. ‘అంచులు—గుసగుస—ఉరుము’ అనే రూపక క్రమాన్ని కాపాడి, సాధారణ పాఠకులకు అర్థమయ్యే పదజాలాన్ని ఉపయోగించాం.
