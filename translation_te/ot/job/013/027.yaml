  to: 'నీవు నా కాళ్లను బిగించే బంధనంలో పెడతావు;

    నా దారులన్నిటినీ గమనిస్తావు;

    నా అరికాళ్లపై గీత గీస్తావు.[a]'
  rationale: The revision clarifies the foot-restraint image of בַּסַּד in contemporary Telugu, while retaining the concrete restraint implied by ‘stocks.’ It also changes the final colon to the more direct ‘on my soles,’ corresponding to עַל, and moves the legitimate ‘around/boundary’ interpretation to a compact lexical footnote.
