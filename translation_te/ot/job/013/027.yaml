source:
  edition: WLC
  text: וְ/תָ֘שֵׂ֤ם בַּ/סַּ֨ד רַגְלַ֗/י וְ/תִשְׁמ֥וֹר כָּל אָרְחוֹתָ֑/י עַל שָׁרְשֵׁ֥י רַ֝גְלַ֗/י תִּתְחַקֶּֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/013/027.yaml
  text: You put my feet in the stocks[a], and you watch all my paths; you mark out the soles of my feet.
translation:
  language: te
  text: 'నీవు నా కాళ్లను బిగించే బంధనంలో పెడతావు;

    నా దారులన్నిటినీ గమనిస్తావు;

    నా అరికాళ్లపై గీత గీస్తావు.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నా అరికాళ్ల చుట్టూ హద్దు గీస్తావు” లేదా “నా అరికాళ్లపై గుర్తు చెక్కుతావు.” హీబ్రూ క్రియ గుర్తించడం, చెక్కడం, లేదా హద్దు గీయడం అనే భావాలను ఇవ్వగలదు.
    reason: The final Hebrew expression is lexically and imagistically difficult. This note preserves viable alternatives without making one disputed interpretation primary.
lexical_decisions:
- source_word: בַּסַּד
  choice: బొండలో
  rationale: సַד కాళ్లను కదలకుండా బంధించే నిరోధక సాధనాన్ని సూచిస్తుంది. ‘బొండ’ బంధన దృశ్యాన్ని సంక్షిప్తంగా, స్పష్టంగా నిలుపుతుంది.
- source_word: וְתָשֵׂם
  choice: ఉంచుతావు
  rationale: שׂים యొక్క సాధారణ భావం ‘పెట్టు/ఉంచు’; కాళ్లను బంధన సాధనంలో ఉంచడాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: וְתִשְׁמוֹר
  choice: గమనిస్తావు
  rationale: שׁמר ఇక్కడ కాపాడటం కంటే యోబు కదలికలన్నిటినీ నిశితంగా పర్యవేక్షించడాన్ని సూచిస్తుంది.
- source_word: כָּל אָרְחוֹתָי
  choice: నా దారులన్నిటినీ
  rationale: אֹרַח యొక్క స్పష్టమైన దారి రూపకాన్ని నిలుపుతూ, జీవన నడవడిక అనే విస్తృత భావానికీ అవకాశం ఇస్తుంది.
- source_word: עַל שָׁרְשֵׁי רַגְלַי
  choice: నా అరికాళ్ల చుట్టూ
  rationale: ‘నా పాదాల వేర్లు’ అనే అక్షరార్థం తెలుగులో అస్పష్టంగా ఉంటుంది; ఈ సందర్భంలో పదబంధం పాదాల దిగువ భాగాలను సూచిస్తుందని గ్రహించి ‘అరికాళ్లు’ అని అనువదించబడింది. עַל యొక్క స్థలసంబంధ భావాన్ని తదుపరి క్రియతో కలిపి ‘చుట్టూ’గా వ్యక్తం చేసింది.
- source_word: תִּתְחַקֶּה
  choice: గీత గీస్తావు
  rationale: חקה యొక్క హిత్పయేల్ రూపం చెక్కడం, గుర్తించడం లేదా హద్దు గీయడం అనే భావాలను కలిగి ఉంది. ‘గీత గీస్తావు’ నిర్బంధం కోసం పాదాల చుట్టూ హద్దు గుర్తించే దృశ్యాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
