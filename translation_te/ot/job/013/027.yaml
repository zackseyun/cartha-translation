translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన, ప్రత్యక్ష సంబోధనను వాడింది. మూడు సమాంతర పాదాలు హీబ్రూ వాక్యంలోని ఆరోపణాత్మక లయను నిలుపుతాయి. దేవుని సంబోధనలో ఆధునికంగా సహజమైన ‘నీవు’ రూపం ఉపయోగించబడింది.
