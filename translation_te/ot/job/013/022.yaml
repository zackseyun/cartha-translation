translation:
  language: te
  text: అప్పుడు నీవు పిలువు[a], నేను జవాబు ఇస్తాను; లేదా నన్ను మాట్లాడనివ్వు, నీవు నాకు జవాబు ఇవ్వు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, మరింత రూపానుసారంగా: “పిలువు, నేను జవాబు ఇస్తాను; లేదా నేను మాట్లాడుతాను, నాకు జవాబు ఇవ్వు.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּקְרָא
  choice: అప్పుడు నీవు పిలువు
  rationale: קרא అనే క్రియ యొక్క ఆజ్ఞార్థక రూపం. ముందున్న సంధిని సందర్భంలోని రెండు ప్రత్యామ్నాయాల క్రమాన్ని సహజంగా చూపేందుకు ‘అప్పుడు’గా అనువదించాం; ‘పిలువు’ అనే మరింత రూపానుసార పఠనం కూడా సాధ్యమే.
- source_word: וְאָנֹכִי אֶעֱנֶה
  choice: నేను జవాబిస్తాను
  rationale: స్వతంత్ర సర్వనామమైన אָנֹכִי కర్తను నొక్కి చెబుతుంది; తెలుగులో స్పష్టమైన ‘నేను’ ద్వారా ఆ ఉద్ఘాటన నిలుస్తుంది. ענה ఇక్కడ ‘జవాబివ్వు’ అనే అర్థంలో ఉంది.
- source_word: אוֹ
  choice: లేదా
  rationale: మాట్లాడటం—జవాబివ్వటం అనే రెండవ ప్రత్యామ్నాయ ఏర్పాటును పరిచయం చేసే విభాజక అవ్యయం.
- source_word: אֲדַבֵּר
  choice: నన్ను మాట్లాడనివ్వు
  rationale: దీని రూపం ప్రథమ పురుష అసంపూర్ణ క్రియ అయినా, తరువాతి ఆజ్ఞార్థక అభ్యర్థనతో కూడిన ప్రత్యామ్నాయ ప్రతిపాదనలో అనుమతి కోరే భావం సహజంగా ఉంది. అందువల్ల ‘నేను మాట్లాడుతాను’ అనే రూపానుసార ప్రత్యామ్నాయాన్ని బలవంతంగా ఎంచుకోలేదు.
- source_word: וַהֲשִׁיבֵנִי
  choice: నీవు నాకు జవాబివ్వు
  rationale: שוב హిఫిల్ ఆజ్ఞార్థక రూపానికి ప్రథమ పురుష ఏకవచన కర్మప్రత్యయం జతైంది; ఈ నిర్మాణంలో భావం ‘నాకు జవాబివ్వు’. స్పష్టత కోసం కర్త ‘నీవు’ను వ్యక్తం చేశాం.
