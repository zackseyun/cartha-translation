translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన న్యాయవాద సంభాషణ ధోరణి ఉంచబడింది. దేవునితో ఏకవచన ప్రత్యక్ష సంబోధనను చూపేందుకు ‘నీవు’ వాడబడింది; మూలంలోని రెండు పరస్పర ప్రత్యామ్నాయాలు మరియు వాటి ఉద్వేగం నిలుపబడ్డాయి.
