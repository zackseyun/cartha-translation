base_translation:
  language: en
  yaml_path: translation/ot/job/013/024.yaml
  text: Why do you hide your face and count me as your enemy?[a]
translation:
  language: te
  text: నీవెందుకు నీ ముఖాన్ని దాచుకొని, నన్ను నీ శత్రువుగా పరిగణిస్తున్నావు?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నన్ను నీకు శత్రువుగా పరిగణిస్తున్నావు?’
    reason: לָךְ అనే పదానికి అక్షరానుసారంగా ‘నీకు’ అనే సంబంధార్థక అనువాదాన్ని చూపడం.
lexical_decisions:
- source_word: לָמָה
  choice: ఎందుకు
  rationale: కారణాన్ని ప్రశ్నించే ప్రత్యక్ష ప్రశ్నార్థకం; ఆధునిక తెలుగులో సహజమైన సమానార్థకం.
- source_word: פָנֶיךָ
  choice: నీ ముఖాన్ని
  rationale: మూలంలోని స్పష్టమైన ‘ముఖం’ అనే రూపకాన్ని నిలుపుతుంది; సందర్భంలో అది సన్నిధి లేదా అనుగ్రహాన్ని కూడా సూచించవచ్చు.
- source_word: תַסְתִּיר
  choice: దాచుకొని
  rationale: סתר హిఫీల్ రూపం ‘దాచు/మరుగుపరచు’ అని అర్థం. ‘ముఖాన్ని దాచుకొను’ అనే బైబిలీయ సంబంధాత్మక రూపకాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וְתַחְשְׁבֵנִי
  choice: నన్ను … పరిగణిస్తున్నావు
  rationale: חשב ఇక్కడ ‘భావించు, లెక్కించు, పరిగణించు’ అనే అర్థంలో ఉంది. ‘పరిగణించు’ తెలుగులో సహజంగా ఉండి, తరువాతి విధేయపూరక నిర్మాణాన్ని కాపాడుతుంది.
- source_word: לְאוֹיֵב
  choice: శత్రువుగా
  rationale: לְ ఇక్కడ విధేయపూరకాన్ని సూచిస్తుంది; తెలుగులో ‘శత్రువుగా’ దానికి సరైన రూపం.
- source_word: לָךְ
  choice: నీ
  rationale: అక్షరార్థంగా ‘నీకు’ అయినా, ఈ నిర్మాణంలో సంబంధాన్ని తెలుగులో సహజంగా ‘నీ శత్రువు’ అని వ్యక్తం చేయవచ్చు; అక్షరానుసార ప్రత్యామ్నాయం పాదసూచికలో ఇవ్వబడింది.
theological_decisions:
- issue: దేవుడు ‘ముఖాన్ని దాచుకోవడం’ అనే మానవరూప వర్ణన
  choice: ‘నీ ముఖాన్ని దాచుకొని’ అనే స్పష్టమైన రూపకాన్ని ప్రధాన పాఠ్యంలో నిలుపడం
  alternative: ‘నీ సన్నిధిని ఉపసంహరించుకొని’ లేదా ‘నా నుండి తొలగిపోయి’
  rationale: హీబ్రూ పాఠ్యం దేవుని ముఖం అనే సాక్షాత్ రూపకాన్ని వాడుతుంది. దాన్ని నిలుపడం వల్ల దేవుని సన్నిధి లేదా అనుగ్రహం గురించిన కవితాత్మక, ధార్మిక ఉద్వేగం అతివ్యాఖ్యానం లేకుండా కాపాడబడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; యోబు దేవునితో నేరుగా మాట్లాడే గంభీరమైన, బాధతో కూడిన ప్రశ్నారూప ధోరణి నిలుపబడింది. మూలంలోని రెండు క్రియలను ఒకే ‘ఎందుకు’ ప్రశ్న కింద సహజంగా అనుసంధానించాం.
