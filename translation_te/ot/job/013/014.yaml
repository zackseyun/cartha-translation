  yaml_path: translation/ot/job/013/014.yaml
  text: Why should I take my flesh in my teeth and put my life in my hand?[a][b]
translation:
  language: te
  text: నేను నా మాంసాన్ని నా పళ్లలో ఎందుకు తీసుకోవాలి? నా ప్రాణాన్ని నా అరచేతిలో ఎందుకు పెట్టుకోవాలి?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నేను నా మాంసాన్ని నా పళ్లతో ఎందుకు తీసుకోవాలి?” ఈ హీబ్రూ నుడికారం అర్థం చేసుకోవడం కష్టం; ఇది తనను తాను తీవ్రమైన ప్రమాదానికి గురిచేసుకోవడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “నా ఆత్మను.” హీబ్రూ נֶפֶשׁ (నెఫెష్) అనే పదానికి “ప్రాణం,” “ఆత్మ,” లేదా “స్వయం” అనే అర్థాలు ఉండవచ్చు; ఇక్కడ తన ప్రాణాన్ని ప్రమాదంలో పెట్టడం అనే భావానికి “ప్రాణం” బాగా సరిపోతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל מָה
  choice: ఎందుకు … చేయాలి?
  rationale: ఇక్కడ ఈ పదబంధం ఉద్దేశం లేదా కారణాన్ని ప్రశ్నించే అలంకారిక ప్రశ్నను ప్రవేశపెడుతుంది; ఆధునిక తెలుగులో ‘ఎందుకు … చేయాలి?’ సహజంగా ఆ బలాన్ని నిలుపుతుంది.
- source_word: אֶשָּׂא
  choice: మోసుకోవాలి
  rationale: נשא అంటే ఎత్తడం, మోయడం, తీసుకోవడం. ‘మాంసాన్ని పళ్లలో’ అనే సజీవమైన రూపకంతో ‘మోసుకోవాలి’ బాగా సరిపోతుంది.
- source_word: בְשָׂרִי
  choice: నా మాంసాన్ని
  rationale: בשר యొక్క స్పష్టమైన శారీరక చిత్రాన్ని ‘శరీరం’ అని సవరించకుండా ‘మాంసం’గా నిలుపుతుంది.
- source_word: בְשִׁנָּי
  choice: నా పళ్లలో
  rationale: ב ఉపసర్గను ‘లో’గా అనువదించడం మూలంలోని కఠినమైన, వివాదాస్పదమైన నుడికార చిత్రాన్ని యథాతథంగా నిలుపుతుంది.
- source_word: וְנַפְשִׁי
  choice: నా ప్రాణాన్ని
  rationale: נפשకు ప్రాణం, జీవితం, ఆత్మ, స్వయం అనే అర్థాలు ఉండవచ్చు. ప్రమాదానికి గురిచేసే సందర్భంలో ‘ప్రాణం’ సహజంగా సరిపోతూ మూలపదపు భావవ్యాప్తిని కొంతవరకు నిలుపుతుంది.
- source_word: אָשִׂים
  choice: పెట్టుకోవాలి
  rationale: שׂים యొక్క సాధారణ అర్థం పెట్టడం లేదా ఉంచడం; ఇక్కడ తెలుగు నుడికారానికి ‘పెట్టుకోవాలి’ సహజం.
- source_word: בְכַפִּי
  choice: నా అరచేతిలో
  rationale: כף ప్రత్యేకంగా అరచేతిని సూచించగలదు. ‘అరచేతిలో’ మూలంలోని స్పష్టమైన శారీరక చిత్రాన్ని కాపాడుతుంది; తెలుగులో ప్రాణాన్ని అరచేతిలో పెట్టుకోవడం అనేది ప్రమాదాన్ని స్వీకరించే అర్థాన్ని కూడా సహజంగా తెలియజేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు స్పష్టంగా ఉండే శైలి. మూలంలోని రెండు సమాంతర చిత్రాలను నిలుపుతూ, మొదటి కఠినమైన హీబ్రూ నుడికారాన్ని పాదటిప్పణిలో వివరించాం.
