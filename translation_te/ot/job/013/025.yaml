source:
  edition: WLC
  text: הֶ/עָלֶ֣ה נִדָּ֣ף תַּעֲר֑וֹץ וְ/אֶת קַ֖שׁ יָבֵ֣שׁ תִּרְדֹּֽף־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/013/025.yaml
  text: Will you terrify a windblown leaf[b][a], and pursue dry chaff?
translation:
  language: te
  text: 'గాలికి ఎగిరిపోతున్న ఆకును నీవు భయపెడతావా?[a]

    ఎండిన గడ్డి కాడలను వెంటాడతావా?[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘భయపెడతావా?’ అనే పదాన్ని ‘భీతికి గురిచేస్తావా?’ అని కూడా అనువదించవచ్చు; సందర్భాన్ని బట్టి కఠినంగా వేధించడం అనే ఛాయ కూడా ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘ఎండిన గడ్డి కాడలు’ అనే పదబంధాన్ని ‘ఎండుగడ్డి’ లేదా ‘గడ్డి కాడలు’ అని కూడా అనువదించవచ్చు. హీబ్రూ పదం బలహీనమైన, పొడిబారిన మొక్కల అవశేషాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶעָלֶה
  choice: ఆకును
  rationale: עלה ఇక్కడ ఏకవచనంలో ‘ఆకు’ అనే స్పష్టమైన బలహీనతా చిత్రాన్ని ఇస్తుంది.
- source_word: נִדָּף
  choice: గాలికి కొట్టుకుపోయే
  rationale: נדף గాలిచేత తరిమివేయబడే లేదా అటూ ఇటూ కొట్టుకుపోయే భావాన్ని సూచిస్తుంది; ఈ రూపం ఆకులోని నిస్సహాయతను సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: תַּעֲרוֹץ
  choice: భయపెడతావా
  rationale: ערץ భయం లేదా భీతిని కలిగించడాన్ని సూచిస్తుంది. సందర్భంలోని తీవ్రతను ఉంచుతూ సామాన్య ఆధునిక తెలుగులో సహజంగా ఉండే పదాన్ని ఎంచుకున్నాం.
- source_word: וְאֶת
  choice: రెండవ ప్రశ్నగా వ్యక్తీకరణ
  rationale: וְ రెండవ సమాంతర చిత్రాన్ని కలుపుతుంది; את ప్రత్యక్ష కర్మ సూచికకు తెలుగులో ప్రత్యేక పదం అవసరం లేదు. తెలుగు కవితా సహజత్వం కోసం ‘మరి’ వంటి అదనపు పదం లేకుండా సమాంతర ప్రశ్నగా ఇచ్చాం.
- source_word: קַשׁ
  choice: గడ్డి
  rationale: קשׁ ఎండిన గడ్డి, గడ్డి కాడలు, లేదా పొట్టు వంటి పొడి మొక్కల వ్యర్థాన్ని సూచించగలదు. విస్తృత తెలుగు పాఠకులకు సహజమైన ‘గడ్డి’ని ప్రధాన పాఠంలో ఉంచి ప్రత్యామ్నాయాలను పాదసూచికలో తెలిపాం.
- source_word: יָבֵשׁ
  choice: ఎండిన
  rationale: יבש పొడిబారిన స్థితిని నేరుగా తెలియజేస్తూ ఆ వస్తువు బలహీనతను మరింత స్పష్టం చేస్తుంది.
- source_word: תִּרְדֹּף
  choice: వెంటాడతావా
  rationale: רדף వెంబడించడం లేదా తరుమడం అనే భావం కలిగి ఉంది; ‘వెంటాడడం’ ఇక్కడి వ్యంగ్యభరిత ప్రశ్నకు సహజంగా సరిపోతుంది.
