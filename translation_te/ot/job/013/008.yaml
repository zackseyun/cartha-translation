  yaml_path: translation/ot/job/013/008.yaml
  text: Will you show partiality for him? Will you contend for God?[a][b]
translation:
  language: te
  text: మీరు ఆయన పట్ల పక్షపాతం చూపుతారా?[a] దేవుని పక్షంగా వాదిస్తారా?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘ఆయన ముఖాన్ని ఎత్తుతారా?’—ఇది పక్షపాతం లేదా మొగ్గు చూపడాన్ని సూచించే హీబ్రూ నుడికారం.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘దేవుని తరఫున వాదిస్తారా?’
    reason: alternative_reading
lexical_decisions:
- source_word: הֲפָנָיו תִּשָּׂאוּן
  choice: మీరు ఆయన పట్ల పక్షపాతం చూపుతారా?
  rationale: ‘ముఖాన్ని ఎత్తడం’ అనే హీబ్రూ నుడికారానికి న్యాయవివాద సందర్భంలో పక్షపాతం లేదా మొగ్గు చూపడం అనే అర్థం ఉంది. ఆధునిక తెలుగులో నుడికారార్థాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אִם
  choice: ప్రత్యేక ప్రశ్నగా వ్యక్తీకరణ
  rationale: ఇక్కడ אִם సమాంతరంగా ఉన్న రెండో అలంకారిక ప్రశ్నను ప్రవేశపెడుతుంది. తెలుగులో ‘లేక’ అని తప్పనిసరిగా చేర్చకుండా, ప్రత్యేక ప్రశ్నగా ఇవ్వడం సహజంగా ఉంది.
- source_word: לָאֵל
  choice: దేవుని పక్షంగా
  rationale: ל ఉపసర్గ ఇక్కడ ఎవరి తరఫున లేదా ప్రయోజనం కోసం అనే భావాన్ని సూచిస్తుంది. ‘దేవుని పక్షంగా’ అనేది వాదనాత్మక సందర్భాన్ని స్పష్టంగా, సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: תְּרִיבוּן
  choice: వాదిస్తారా
  rationale: ריב ధాతువు వివాదం లేదా న్యాయవాదన భావాన్ని కలిగి ఉంది. ‘వాదిస్తారా’ సాధారణ ఆధునిక తెలుగులో ఆ విస్తృత భావాన్ని నిలుపుతుంది; ‘వకాల్తా పుచ్చుకుంటారా’ వంటి పదాలు న్యాయస్థాన ప్రక్రియను అతిగా నిర్దిష్టం చేస్తాయి.
theological_decisions:
- issue: యోబు స్నేహితులు దేవునికి అనుకూలంగా పక్షపాతంతో వాదిస్తున్నారని నిందిస్తున్నాడా?
  choice: రెండు అలంకారిక ప్రశ్నలుగా—ఆయన పట్ల పక్షపాతం చూపడం, దేవుని పక్షంగా వాదించడం—అనువదించబడింది.
  alternative: మొదటి భాగాన్ని అక్షరార్థంగా ‘ఆయన ముఖాన్ని ఎత్తుతారా?’ అని, రెండో భాగాన్ని ‘దేవుని తరఫున వాదిస్తారా?’ అని ఇవ్వవచ్చు.
  rationale: హీబ్రూ నుడికారం మరియు సమీప సందర్భం ప్రకారం యోబు తన స్నేహితుల పక్షపాతపూరిత సమర్థనను ప్రశ్నిస్తున్నాడు. అయినా రెండో భాగంలోని న్యాయవాదన పరిధిని అతిగా కుదించకుండా ‘వాదిస్తారా’ అని ఉంచబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ప్రశ్నారూపం వాడబడింది. ‘పక్షపాతం’ న్యాయసంబంధ నుడికారాన్ని స్పష్టంగా తెలియజేస్తుంది; ‘వాదిస్తారా’ మూలంలోని వివాదాత్మక/న్యాయపరమైన విస్తృతిని నిలుపుతుంది.
