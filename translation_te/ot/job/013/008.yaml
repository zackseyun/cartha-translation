  source_fidelity: హీబ్రూ నుడికారం הֲפָנָיו תִּשָּׂאוּן ను ‘ఆయన పట్ల పక్షపాతం చూపుతారా?’ అని అర్థానువాదం చేయడం సందర్భానుకూలంగా, నమ్మకంగా ఉంది. לָאֵל תְּרִיבוּן లోని దేవుని తరఫున/ప్రయోజనం కోసం వివాదించడం అనే భావాన్ని ‘దేవుని పక్షంగా వాదిస్తారా?’ సరిగ్గా అందిస్తుంది. రెండు ప్రశ్నల అలంకారిక సమాంతరత కూడా నిలిచింది.
