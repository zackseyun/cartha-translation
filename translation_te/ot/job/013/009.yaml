source:
  edition: WLC
  text: הֲ֭/טוֹב כִּֽי יַחְקֹ֣ר אֶתְ/כֶ֑ם אִם כְּ/הָתֵ֥ל בֶּ֝/אֱנ֗וֹשׁ תְּהָתֵ֥לּוּ בֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/013/009.yaml
  text: Will it be good when he examines you? Or will you mock him as one mocks a man?[a][b]
translation:
  language: te
  text: ఆయన మిమ్మల్ని పరిశీలించినప్పుడు మీకు మేలు జరుగుతుందా? లేక ఒక మనిషిని ఎగతాళి చేసినట్లు ఆయనను ఎగతాళి చేస్తారా?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆయనను మోసగిస్తారా?’ లేదా ‘ఆయనతో ఆటలాడతారా?’ హీబ్రూ క్రియకు ఎగతాళి చేయడం, మోసగించడం, ఒకరితో ఆటలాడడం అనే భావాలు రావచ్చు.
    reason: lexical_alternative
  - marker: b
    text: 'హీబ్రూ: ‘ఒక మనిషి’; ఇక్కడ దేవునికి భిన్నమైన సాధారణ మానవుడు అనే భావం ఉంది.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲטוֹב
  choice: మీకు మేలు జరుగుతుందా?
  rationale: ప్రశ్నార్థక הֲ తో కూడిన טוֹב ఇక్కడ దేవుని పరిశీలన ఫలితం వారికి అనుకూలంగా ఉంటుందా అని ప్రశ్నించే అలంకారప్రశ్న. సహజమైన ఆధునిక తెలుగులో ముందున్న పరిణామాన్ని సూచించేందుకు ఈ రూపం ఎంచుకోబడింది.
- source_word: כִּי
  choice: పరిశీలించినప్పుడు
  rationale: ఇక్కడ כִּי దేవుడు వారిని పరిశీలించే సందర్భాన్ని సూచిస్తుంది; అందువల్ల కాలార్థకమైన ‘అప్పుడు’ భావాన్ని నిలిపింది.
- source_word: יַחְקֹר
  choice: పరిశీలించినప్పుడు
  rationale: חקר లోతుగా వెదకడం, పరీక్షించడం, దర్యాప్తు చేయడం అనే భావాలను కలిగి ఉంది. ‘పరిశీలించడం’ దేవుని క్షుణ్ణమైన తనిఖీ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: אֶתְכֶם
  choice: మిమ్మల్ని
  rationale: రెండవ పురుష బహువచన కర్మరూపాన్ని తెలుగులో స్పష్టంగా బహువచనంగా అనువదించింది.
- source_word: אִם
  choice: లేక
  rationale: సమాంతరమైన రెండవ అలంకారప్రశ్నను ప్రత్యామ్నాయంగా ప్రవేశపెడుతున్నందున తెలుగులో ‘లేక’ సహజంగా ఉంది.
- source_word: כְּהָתֵל בֶּאֱנוֹשׁ
  choice: ఒక మనిషిని ఎగతాళి చేసినట్లు
  rationale: התל అనే క్రియలో ఎగతాళి చేయడం, మోసగించడం, ఆటపట్టించడం అనే భావాలు ఉన్నాయి. ఈ హెచ్చరిక సందర్భంలో ‘ఎగతాళి చేయడం’ దాని ధిక్కారపూరిత బలాన్ని నిలుపుతుంది; אֱנוֹשׁ దేవునికి భిన్నమైన బలహీన మానవుణ్ణి సూచిస్తుంది.
- source_word: תְּהָתֵלּוּ בוֹ
  choice: ఆయనను ఎగతాళి చేస్తారా?
  rationale: మూలంలోని అదే התל క్రియ పునరావృతిని తెలుగులోనూ నిలిపింది. సందర్భం ప్రకారం ‘ఆయన’ దేవుణ్ణి సూచిస్తుంది.
theological_decisions:
- issue: ఏకవచన తృతీయ పురుష సర్వనామాల నిర్దేశ్యం
  choice: ‘ఆయన’ దేవుణ్ణి సూచిస్తుంది.
  alternative: పరిశీలించే నిర్దిష్టంగా చెప్పని న్యాయాధికారి
  rationale: యోబు 13:7–11 సందర్భంలో యోబు దేవుని పక్షాన పక్షపాతంతో మాట్లాడుతున్నవారిని హెచ్చరిస్తున్నాడు. కాబట్టి ఈ సర్వనామాలు దేవుణ్ణి సూచిస్తున్నాయని గ్రహించడం సందర్భానుగుణం; అయితే మూలంలో ‘దేవుడు’ అనే నామం ఈ వాక్యంలో ప్రత్యక్షంగా లేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవసూచక ఏకవచనమైన ‘ఆయన’ను దేవునికి వాడాం. అలంకారప్రశ్నల కఠినమైన హెచ్చరిక స్వరాన్ని, అలాగే మూలంలోని ‘ఎగతాళి’ క్రియ పునరావృతిని నిలిపాం.
