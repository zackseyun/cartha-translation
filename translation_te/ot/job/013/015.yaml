id: JOB.13.15
reference: Job 13:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: הֵ֣ן יִ֭קְטְלֵ/נִי לא אֲיַחֵ֑ל אַךְ דְּ֝רָכַ֗/י אֶל פָּנָ֥י/ו אוֹכִֽיחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/013/015.yaml
  text: Though he slay me[a], I will not hope; yet I will argue my ways before him.
translation:
  language: te
  text: ఆయన నన్ను చంపినా[a], నేను ఆశ పెట్టుకోను; అయినా నా మార్గాల విషయమై ఆయన ఎదుట వాదిస్తాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'సాంప్రదాయ అనువాదం: “ఆయన నన్ను చంపినా, ఆయనలోనే ఆశ ఉంచుతాను.” ఇది హీబ్రూ పాఠంలోని ఒక ప్రత్యామ్నాయ పఠనాన్ని ప్రతిబింబిస్తుంది.'
    reason: alternative_reading
lexical_decisions:
- source_word: הֵן
  choice: చంపినా
  rationale: ఈ సందర్భంలో הֵן తరువాతి వాక్యానికి concessive భావాన్ని ఇస్తుంది; తెలుగులో క్రియకు జోడించిన ‘-ఇనా’ సహజంగా ‘చంపినప్పటికీ’ అనే భావాన్ని తెలియజేస్తుంది.
- source_word: יִקְטְלֵנִי
  choice: ఆయన నన్ను చంపినా
  rationale: קטל అంటే ‘చంపడం’. యోబు మాటల గంభీరతను నిలుపుతూ ఆధునిక తెలుగులో సహజమైన రూపాన్ని ఎంచుకున్నాం.
- source_word: לֹא אֲיַחֵל
  choice: నేను ఆశ పెట్టుకోను
  rationale: లిఖిత హీబ్రూ పాఠంలో לֹא (‘కాదు/లేదు’) ఉంది. יחל ‘ఆశించు’ లేదా ‘వేచియుండు’ అనే భావాలు కలిగి ఉంది; ఇక్కడ ‘ఆశ పెట్టుకోను’ ప్రతికూల భావాన్ని స్పష్టంగా, సహజంగా అందిస్తుంది.
- source_word: אַךְ
  choice: అయినా
  rationale: మరణం సంభవించినా తన వాదనను వినిపించాలనే యోబు సంకల్పానికి మధ్య ఉన్న వ్యతిరేక మలుపును సూచిస్తుంది.
- source_word: דְּרָכַי
  choice: నా మార్గాల విషయమై
  rationale: ‘నా మార్గాలు’ అనే హీబ్రూ రూపకాన్ని నిలుపుతూ, అవి తన ప్రవర్తన లేదా జీవన విధానాన్ని సూచించవచ్చనే విస్తృతిని కాపాడుతుంది.
- source_word: אֶל־פָּנָיו
  choice: ఆయన ఎదుట
  rationale: అక్షరార్థంగా ‘ఆయన ముఖం ఎదుట’; దేవుని సన్నిధిలో నేరుగా తన వాదనను ఉంచడాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אוֹכִיחַ
  choice: వాదిస్తాను
  rationale: ఈ న్యాయవాద సందర్భంలో יכח హిఫీల్ రూపం తన పక్షాన్ని వినిపించడం లేదా తన వాదనను సమర్పించడం అనే భావాన్ని కలిగి ఉంది.
theological_decisions:
- issue: ‘ఆయన నన్ను చంపినా ఆయనలోనే ఆశ ఉంచుతాను’ అనే సాంప్రదాయ పఠనాన్ని అనుసరించాలా, లేక ప్రతికూలతగల మసొరెటిక్ వ్యంజన పాఠాన్ని అనుసరించాలా?
  choice: ముఖ్య పాఠంలో לֹא (‘కాదు’) ప్రకారం ‘నేను ఆశ పెట్టుకోను’ అని అనువదించడం.
  alternative: ‘ఆయన నన్ను చంపినా, ఆయనలోనే ఆశ ఉంచుతాను.’
  rationale: ఇచ్చిన హీబ్రూ పాఠం לוֹ (‘ఆయనలో/ఆయనకు’) కాకుండా לֹא (‘కాదు’) అని చదువుతుంది. మూలభాషా పాఠానికి ప్రాధాన్యమిస్తూ ప్రధాన పాఠంలో ప్రతికూల పఠనాన్ని ఉంచి, ప్రాచీనమైన మరియు వ్యాఖ్యానపరంగా ప్రాముఖ్యమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. ‘మార్గాలు’ అనే మూల రూపకం మరియు వాక్యంలోని న్యాయవాద ధోరణి నిలుపబడ్డాయి.
