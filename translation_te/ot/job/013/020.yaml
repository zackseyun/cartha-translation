source:
  edition: WLC
  text: אַךְ שְׁ֭תַּיִם אַל תַּ֣עַשׂ עִמָּדִ֑/י אָ֥ז מִ֝/פָּנֶ֗י/ךָ לֹ֣א אֶסָּתֵֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/013/020.yaml
  text: 'Only do not do two things to me[a]; then I will not hide myself from your face:'
translation:
  language: te
  text: కేవలం ఈ రెండు విషయాలు నాపై చేయవద్దు; అప్పుడు నీ ఎదుట నుండి నేను దాక్కోను.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీ సన్నిధి నుండి నేను దాక్కోను.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: అయితే ... మాత్రం
  rationale: ఇక్కడ ఈ పదం యోబు విన్నపానికి పరిమితిని సూచిస్తోంది; ఆధునిక తెలుగులో ‘అయితే ... మాత్రం’ ఆ నియంత్రక భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: שְׁתַּיִם
  choice: ఈ రెండు
  rationale: హీబ్రూలో నామవాచకం లేకుండా ‘రెండు’ మాత్రమే ఉంది. తరువాతి వచనాల్లో వివరించబోయే రెండు చర్యలను సూచిస్తున్నందున తెలుగులో ‘ఈ రెండు’ సహజంగా ఉంది.
- source_word: אַל תַּעַשׂ עִמָּדִי
  choice: నాకు చేయకు
  rationale: עשה עם అనే నిర్మాణం ఇక్కడ దేవుడు యోబుపట్ల చేయవద్దని అడుగుతున్న రెండు చర్యలను సూచిస్తుంది. ‘నాకు చేయకు’ సంక్షిప్తంగా, సహజంగా ఉంది.
- source_word: אָז
  choice: అప్పుడు
  rationale: అభ్యర్థన నెరవేరితే కలిగే ఫలితాన్ని సూచించే షరతు-ఫలిత సంబంధాన్ని తెలియజేస్తుంది.
- source_word: מִפָּנֶיךָ
  choice: నీ ముఖం ఎదుటనుండి
  rationale: మూలంలోని ‘ముఖం’ అనే సజీవ రూపకాన్ని నిలుపుతూ, దేవుని సన్నిధి అనే భావాన్నీ తెలుగులో అర్థమయ్యేలా వ్యక్తం చేస్తుంది.
- source_word: לֹא אֶסָּתֵר
  choice: నేను దాక్కోను
  rationale: 'סתר నిఫాల్ రూపాన్ని సందర్భానుసారంగా ఆత్మార్థకంగా తీసుకున్నాం: ఆ రెండు చర్యలు నిలిపివేస్తే యోబు దేవుని ఎదుటనుండి వెనుకంజ వేసి దాక్కోనని చెబుతున్నాడు.'
theological_decisions:
- issue: ‘ముఖం’ లేదా ‘సన్నిధి’ అనే అనువాదం
  choice: ప్రధాన పాఠ్యంలో ‘నీ ముఖం ఎదుటనుండి’
  alternative: ‘నీ సన్నిధి నుండి’
  rationale: హీబ్రూ రూపకాన్ని ప్రధాన పాఠ్యంలో నిలిపి, దాని సాధారణ సన్నిధి భావాన్ని పాదటిప్పణిలో ఇచ్చాం; ఏ ప్రత్యేక సిద్ధాంతార్థాన్నీ చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘నీ ముఖం’ అనే మూలభాషా దృశ్యరూపం నిలుపబడింది; ‘ఈ రెండు’ తరువాతి వచనాల్లో వివరించబడే అంశాలను సూచిస్తుంది.
