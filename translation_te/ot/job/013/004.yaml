  yaml_path: translation/ot/job/013/004.yaml
  text: But you are plasterers of lies[b][a]; all of you are worthless physicians.
translation:
  language: te
  text: కాని మీరు అబద్ధాల పూత పూసేవారు[a]; మీరందరూ పనికిరాని వైద్యులు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘అబద్ధాన్ని పూసేవారు,’ ‘అబద్ధాలను కల్పించేవారు.’ హీబ్రూ పదం పూయడం లేదా పైపూతతో కప్పడం అనే భావాన్ని కలిగిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘ఏ విలువా లేని వైద్యులు.’ హీబ్రూ పదం ఇక్కడ నిష్ప్రయోజనతను సూచిస్తుంది; దానికి మరోచోట ఉన్న అర్థాన్ని అనుసరించి ‘విగ్రహాల వైద్యులు’ అని అనువదించడం తక్కువ సంభావ్యమైనది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאוּלָם
  choice: కాని
  rationale: ముందటి మాటకు పదునైన వ్యతిరేకతను చూపే సంధానపదం; ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: אַתֶּם
  choice: మీరు
  rationale: యోబు తన స్నేహితులను నేరుగా బహువచనంలో సంబోధిస్తున్నాడు.
- source_word: טֹפְלֵי
  choice: పూత పూసేవారు
  rationale: హీబ్రూ క్రియలో ఉన్న పూయడం లేదా కప్పివేయడం అనే దృశ్యరూపకాన్ని నిలుపుతుంది; కేవలం ‘కల్పించేవారు’ అని అనువదించడం కంటే మూలంలోని చిత్రాన్ని బాగా వ్యక్తం చేస్తుంది.
- source_word: שָׁקֶר
  choice: అబద్ధాల
  rationale: హీబ్రూ ఏకవచనం సమూహార్థకంగా ఉండగలదు; ‘అబద్ధాల పూత’ తెలుగులో రూపకాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: רֹפְאֵי
  choice: వైద్యులు
  rationale: విఫలమైన సలహాదారులను వైద్యులతో పోల్చే మూలరూపకాన్ని, గౌరవప్రదమైన ఆధునిక పదప్రయోగంతో నిలుపుతుంది.
- source_word: אֱלִל
  choice: పనికిరాని
  rationale: ఈ సందర్భంలో ‘విలువలేని, నిష్ప్రయోజనమైన’ అనే అర్థమే అత్యంత సహజం; వారి వైద్యం ఏ మేలు చేయదని తెలియజేస్తుంది.
- source_word: כֻּלְּכֶם
  choice: మీరందరూ
  rationale: యోబు ఎదుటున్న వారిలో ఒక్కరినీ మినహాయించకుండా అందరినీ ఉద్దేశించిన బలాన్ని నిలుపుతుంది.
