source:
  edition: WLC
  text: הַ֭/לְ/אֵל תְּדַבְּר֣וּ עַוְלָ֑ה וְ֝/ל֗/וֹ תְּֽדַבְּר֥וּ רְמִיָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/013/007.yaml
  text: Will you speak injustice for God[a], and deceit for him?
translation:
  language: te
  text: దేవుని పక్షాన మీరు అన్యాయమైన మాటలు మాట్లాడతారా[a]? ఆయన పక్షాన మోసపూరితమైన మాటలు మాట్లాడతారా?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దేవునికి’; రెండో పాదంలో కూడా ‘ఆయనకు.’ హీబ్రూ ఉపసర్గను ఒకరికోసం లేదా ఒకరి పక్షాన మాట్లాడడమనే అర్థంలోనూ, ఒకరితో మాట్లాడడమనే అర్థంలోనూ గ్రహించవచ్చు. ఈ సందర్భం దేవుని పక్షాన వాదించడానికే ఎక్కువ మద్దతిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלְאֵל
  choice: దేవుని పక్షాన
  rationale: లְ ఉపసర్గకు ‘దేవునికి,’ ‘దేవుని కోసం,’ ‘దేవుని పక్షాన’ అనే భావాలు సాధ్యమైనా, సమీప సందర్భంలో యోబు స్నేహితులు దేవుని పక్షం వహిస్తున్నారని గద్దిస్తున్నాడు. అందువల్ల ‘దేవుని పక్షాన’ సందర్భార్థాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: תְּדַבְּרוּ
  choice: మీరు ... మాట్లాడతారా?
  rationale: ప్రశ్నార్థక వాక్యంలో ఉన్న అసంపూర్ణ క్రియారూపం సవాలు, గద్దింపు వ్యక్తం చేస్తుంది. ‘మాట్లాడతారా?’ ఆధునిక తెలుగులో ఆ వాక్చాతుర్య బలాన్ని నిలుపుతుంది.
- source_word: עַוְלָה
  choice: అన్యాయమైన మాటలు
  rationale: ఈ పదం అన్యాయం, దుర్నీతి, తప్పు అనే నైతిక భావాన్ని కలిగి ఉంది. ‘అన్యాయమైన మాటలు’ అనేది ‘మాట్లాడు’ అనే క్రియతో సహజంగా కలుస్తూ, తరువాతి ‘మోసపూరితమైన మాటలు’తో భేదాన్ని కాపాడుతుంది.
- source_word: וְלוֹ
  choice: ఆయన పక్షాన
  rationale: సర్వనామం దేవునినే సూచిస్తుంది. మొదటి పాదంలోని నిర్మాణానికి సమాంతరంగా ‘ఆయన పక్షాన’ అని అనువదించడం హీబ్రూ సమాంతరతను నిలుపుతుంది.
- source_word: רְמִיָּה
  choice: మోసపూరితమైన మాటలు
  rationale: ఈ నామవాచకం మోసం, కపటం లేదా వంచనను సూచిస్తుంది. తెలుగులో ‘మోసం మాట్లాడడం’ కంటే ‘మోసపూరితమైన మాటలు మాట్లాడడం’ సహజంగా ఉండి మూలంలోని భావాన్ని స్పష్టంగా అందిస్తుంది.
theological_decisions:
- issue: యోబు స్నేహితులు దేవునితో మాట్లాడుతున్నారా, లేక దేవుని పక్షాన వాదిస్తున్నారా?
  choice: దేవుని పక్షాన అన్యాయంగా, మోసపూరితంగా మాట్లాడుతున్నారని యోబు వారిని గద్దిస్తున్నాడు.
  alternative: వారు దేవునికి అన్యాయమైన, మోసపూరితమైన మాటలు చెబుతున్నారని యోబు గద్దిస్తున్నాడు.
  rationale: యోబు 13:4, 8 వచనాల సందర్భం స్నేహితులు దేవుని పక్షం వహించి వాదిస్తున్నారని సూచిస్తుంది. అయితే హీబ్రూ לְ ఉపసర్గలోని ప్రత్యామ్నాయ అర్థాన్ని పాదటిప్పణిలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా రూపొందించబడింది. మూలంలోని రెండు సమాంతర పాదాల్లోనూ ఉన్న ‘మాట్లాడు’ క్రియను తెలుగులో పునరావృతం చేసి గద్దింపు బలాన్ని, కవితా సమాంతరతను నిలిపాం.
