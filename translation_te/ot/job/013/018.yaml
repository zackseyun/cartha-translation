  text: See now[a], I have prepared my case; I know that I will be vindicated.
translation:
  language: te
  text: ఇదిగో, నేను నా వాదాన్ని సిద్ధం చేసుకున్నాను; నేను సరైనవాడినని తేలుతుందని[a] నాకు తెలుసు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నేను నీతిమంతునిగా తీర్చబడతాను.” హిబ్రూ క్రియ న్యాయస్థాన సంబంధమైనది; ఒకరు సరైన పక్షంలో ఉన్నారని నిర్ధారించబడటాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה נָא
  choice: ఇదిగో
  rationale: శ్రద్ధను బలంగా ఆకర్షించే హిబ్రూ పదబంధాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; נָא ఇక్కడ మర్యాదపూర్వక అభ్యర్థనకన్నా ఉద్ఘాటనను సూచిస్తుంది.
- source_word: עָרַכְתִּי
  choice: సిద్ధం చేసుకున్నాను
  rationale: ערך యొక్క ‘క్రమపరచు/అమర్చు’ భావాన్ని న్యాయస్థాన సందర్భంలో ఒక వాదాన్ని సిద్ధం చేయడంగా సహజంగా అందిస్తుంది.
- source_word: מִשְׁפָּט
  choice: నా వాదాన్ని
  rationale: ఇక్కడ న్యాయం అనే అమూర్త భావంకన్నా దేవుని ఎదుట యోబు ప్రవేశపెట్టే న్యాయపరమైన పక్షం లేదా కేసును సూచిస్తుంది. తెలుగు న్యాయ-వివాద సందర్భంలో ‘నా వాదం’ స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: יָדַעְתִּי
  choice: నాకు తెలుసు
  rationale: యోబుకు ప్రస్తుతం ఉన్న స్థిరమైన నిశ్చయాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: כִּי
  choice: అని
  rationale: యోబుకు తెలిసిన విషయాన్ని పరిచయం చేసే పూరకార్థక ప్రయోగం.
- source_word: אֲנִי
  choice: నేను
  rationale: హిబ్రూలోని స్పష్టమైన సర్వనామం కర్తకు ఇచ్చిన ఉద్ఘాటనను నిలుపుతుంది.
- source_word: אֶצְדָּק
  choice: నిర్దోషినని తీర్పు పొందుతాను
  rationale: צדק క్రియ యొక్క న్యాయస్థాన సంబంధ భావాన్ని—సరైన పక్షంలో ఉన్నవాడిగా తేల్చబడడం—తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది; తరువాతి కాలపు సిద్ధాంతపరమైన ప్రత్యేకార్థాన్ని అనవసరంగా చేర్చదు.
theological_decisions:
- issue: యోబు వాదనలోని న్యాయస్థాన సంబంధ భావం
  choice: తన వివాదంలో తాను నిర్దోషినని తీర్పు పొందుతాననే యోబు నమ్మకం
  alternative: నేను నీతిమంతునిగా తీర్చబడతాను
  rationale: צדק ఇక్కడ న్యాయవివాద చిత్రణలో వస్తుంది. అందువల్ల యోబు సరైన పక్షంలో ఉన్నాడని తేలే భావాన్ని ముందుకు తేవాలి; పౌలు పత్రికలలోని ‘నీతిమంతునిగా తీర్చడం’ అనే అభివృద్ధి చెందిన సిద్ధాంతార్థాన్ని ఈ వాక్యంలోకి దిగుమతి చేయకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే న్యాయస్థాన భాషను ఉపయోగించాం. ‘ఇదిగో’ ఉద్ఘాటనను నిలుపుతుంది; ‘నా వాదం’ మరియు ‘తీర్పు పొందుతాను’ న్యాయపరమైన సందర్భాన్ని స్పష్టంగా ఉంచుతాయి.
