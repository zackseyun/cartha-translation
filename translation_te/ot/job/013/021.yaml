    text: లేదా, ‘నీవు కలిగించే భయం నన్ను భయపెట్టనివ్వకు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּפְּךָ
  choice: నీ చేతిని
  rationale: כַּף అక్షరార్థంగా అరచేయి/చేయి. ఇక్కడ దేవుని ఒత్తిడి లేదా బాధను సూచించే సజీవ రూపకాన్ని నిలుపుతూ, తెలుగులో సహజమైన ‘చేయి’ని ఎంచుకున్నాం.
- source_word: מֵעָלַי הַרְחַק
  choice: నా మీదనుండి తొలగించు
  rationale: מֵעָלַי ‘నా మీదనుండి’ అనే భారంగా ఉన్న దృశ్యాన్ని నిలుపుతుంది; רחק యొక్క హిఫీల్ ఆజ్ఞారూపం దూరం చేయడం/తొలగించడం అని సూచిస్తుంది.
- source_word: אֵמָתְךָ
  choice: నీ భయం
  rationale: אֵימָה భయం, భీతి, భయానక ప్రభావం అనే అర్థాలు కలిగి ఉంది. ‘నీ భయం’ మూలంలోని రెండవ పురుష ప్రత్యయాన్ని కాపాడుతూ ఉద్దేశపూర్వక అస్పష్టతను నిలుపుతుంది.
- source_word: אַל תְּבַעֲתַנִּי
  choice: నన్ను భయభ్రాంతుణ్ణి చేయనివ్వకు
  rationale: אַל నిషేధార్థాన్ని, בעת తీవ్రంగా భయపెట్టడం లేదా దిగ్భ్రాంతికి గురిచేయడం అనే భావాన్ని వ్యక్తం చేస్తాయి; వాక్యంలోని కర్త אֵמָתְךָ కావడాన్ని తెలుగులో స్పష్టంగా నిలిపాం.
theological_decisions:
- issue: దేవుని గురించి మానవరూప భాష (‘నీ చేయి’)
  choice: ‘నీ చేయి’ అనే రూపకాన్ని యథాతథంగా నిలుపడం
  alternative: నీ శక్తి / నీ దెబ్బ
  rationale: మూలం దేవుని కార్యాన్ని శరీర సంబంధమైన సజీవ చిత్రంతో వర్ణిస్తుంది. దానిని ‘శక్తి’ లేదా ‘దెబ్బ’గా వివరిస్తే మూలంలోని అర్థ పరిధి అనవసరంగా కుదించబడుతుంది.
- issue: אֵמָתְךָ యొక్క భావం
  choice: నీ భయం
  alternative: నీ భీతి / నీవు కలిగించే భయం
  rationale: ‘నీ భయం’ మూలంలోని సంక్షిప్తతను, అది దేవునికి సంబంధించిన భయానక ప్రభావమా లేక దేవుడు కలిగించే భయమా అన్న స్వల్ప అస్పష్టతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో నేరుగా దేవునితో మాట్లాడే కవితాత్మక, గౌరవప్రద శైలి. ‘నా మీదనుండి’ అనే పదబంధం మూలంలోని భారంగా మోపబడిన చేయి అనే దృశ్యాన్ని కాపాడుతుంది; ‘భయభ్రాంతుణ్ణి’ בעת యొక్క తీవ్రతను తెలియజేస్తుంది.
