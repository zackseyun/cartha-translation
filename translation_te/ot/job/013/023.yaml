source:
  edition: WLC
  text: כַּ/מָּ֣ה לִ֭/י עֲוֺנ֣וֹת וְ/חַטָּא֑וֹת פִּֽשְׁעִ֥/י וְ֝/חַטָּאתִ֗/י הֹדִיעֵֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/job/013/023.yaml
  text: How many are my iniquities and sins? Make my transgression and my sin known to me[a][b].
translation:
  language: te
  text: నా దోషాలూ పాపాలూ ఎన్ని?[a] నా అతిక్రమాన్నీ నా పాపాన్నీ నాకు తెలియజేయి.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నా దోషాలూ పాపాలూ ఎంత గొప్పవి?” హీబ్రూ ప్రశ్నార్థక పదం సంఖ్యతో పాటు పరిమాణం లేదా తీవ్రతను కూడా అడగగలదు; ప్రధాన పాఠం బహువచన పదాలకు నేరుగా సరిపోయే సంఖ్యార్థాన్ని ఉంచుతుంది.
    reason: lexical_alternative
  - marker: b
    text: “అతిక్రమం”గా అనువదించిన హీబ్రూ పదానికి “తిరుగుబాటు” అనే భావం కూడా ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּמָּה לִי
  choice: నా ... ఎన్ని?
  rationale: לִיతో కూడిన ప్రశ్నార్థక పదం సంఖ్యను లేదా పరిమాణాన్ని అడుగుతుంది. బహువచన నామవాచకాలతో ఇక్కడ ‘ఎన్ని’ సహజంగా ఉండి, హీబ్రూ ప్రశ్నలోని ప్రత్యక్షతను నిలుపుతుంది.
- source_word: עֲוֺנוֹת
  choice: దోషాలు
  rationale: עָוֹן నైతిక అపరాధం లేదా దోషభారాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘దోషాలు’ సహజంగా ఉండి, తరువాతి ‘పాపాలు’తో ఉన్న పదభేదాన్ని కూడా సాధ్యమైనంత వరకు కాపాడుతుంది.
- source_word: וְחַטָּאוֹת
  choice: పాపాలు
  rationale: חַטָּאת బహువచనానికి ‘పాపాలు’ స్పష్టమైన, సాధారణ తెలుగు అనువాదం.
- source_word: פִּשְׁעִי
  choice: నా అతిక్రమం
  rationale: פֶּשַׁע ఉద్దేశపూర్వక హద్దుమీరడం లేదా తిరుగుబాటు భావాన్ని కలిగి ఉండవచ్చు. ‘అతిక్రమం’ ఆ నైతిక బరువును ఉంచుతూ, ‘తిరుగుబాటు’ అని భావాన్ని అతిగా నిర్దిష్టం చేయదు.
- source_word: וְחַטָּאתִי
  choice: నా పాపం
  rationale: ఏకవచన חַטָּאתకు ‘నా పాపం’ నేరుగా, సహజంగా సరిపోతుంది; హీబ్రూలోని జంట నిర్మాణాన్ని నిలుపుతుంది.
- source_word: הֹדִיעֵנִי
  choice: నాకు తెలియజేయి
  rationale: ידע హిఫిల్ రూపం ‘తెలిసేలా చేయు, తెలియజేయు’ అనే కారక భావాన్ని ఇస్తుంది. ‘నాకు తెలియజేయి’ ఆ భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ప్రార్థనాత్మకమైనా ప్రత్యక్షంగా ప్రశ్నించే యోబు స్వరాన్ని నిలిపాం. దేవునితో ఏకవచన సంబోధనకు సహజమైన ‘తెలియజేయి’ వాడాం; మూలంలోని దోషం/పాపం/అతిక్రమం అనే పదభేదాన్ని సాధ్యమైనంత వరకు కాపాడాం.
