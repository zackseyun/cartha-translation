source:
  edition: WLC
  text: אוּלָ֗ם אֲ֭נִי אֶל שַׁדַּ֣י אֲדַבֵּ֑ר וְ/הוֹכֵ֖חַ אֶל אֵ֣ל אֶחְפָּֽץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/013/003.yaml
  text: But I would speak to the Almighty[a], and I desire to argue with God.
translation:
  language: te
  text: 'కాని నేనైతే సర్వశక్తిమంతునితో మాట్లాడతాను;

    దేవునితో వాదించాలని[a] కోరుకుంటాను.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘దేవునితో తర్కించాలని’; లేదా ‘దేవుని ఎదుట నా పక్షం వినిపించాలని.’ హీబ్రూ క్రియలో వాదించడం, నిరూపించడం, వివాదించడం వంటి న్యాయవిచారణ సంబంధమైన భావం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: אוּלָם
  choice: కాని
  rationale: మునుపటి మాటలకు యోబు తన ఉద్దేశాన్ని బలమైన వ్యతిరేకతతో ఎదురుగా ఉంచుతున్నందున సహజమైన ఆధునిక తెలుగు విరోధార్థక పదాన్ని వాడాం.
- source_word: אֲנִי
  choice: నేనైతే
  rationale: హీబ్రూలో స్పష్టంగా వచ్చిన సర్వనామంలోని ఉద్ఘాటనను ‘నేనైతే’ నిలుపుతుంది.
- source_word: שַׁדַּי
  choice: సర్వశక్తిమంతుడు
  rationale: దైవ బిరుదును లిప్యంతరీకరించకుండా దాని సాధారణ తెలుగు భావంతో అనువదించాం.
- source_word: אֲדַבֵּר
  choice: మాట్లాడతాను
  rationale: ఈ అసంపూర్ణ క్రియ యోబు ఉద్దేశాన్ని లేదా దృఢ సంకల్పాన్ని వ్యక్తం చేస్తుంది; తెలుగులో భవిష్యద్రూపం ఆ సంకల్పాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וְהוֹכֵחַ
  choice: వాదించాలని
  rationale: יכח హిఫిల్ రూపానికి ఈ సందర్భంలో న్యాయవిచారణ సంబంధమైన వాదించడం, తన పక్షాన్ని నిరూపించడం, వివాదించడం అనే విస్తృత భావం ఉంది; ప్రధాన పాఠంలో సంక్షిప్తంగా ‘వాదించడం’ ఎంచుకుని ఇతర సాధ్య భావాలను పాదసూచికలో ఉంచాం.
- source_word: אֶל אֵל
  choice: దేవునితో
  rationale: దేవుని ఉద్దేశించి వాదించడం లేదా ఆయన ఎదుట తన పక్షాన్ని వినిపించడం అనే సంబంధాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: אֶחְפָּץ
  choice: కోరుకుంటాను
  rationale: ఈ క్రియలోని బలమైన ఇష్టం, అభిలాష అనే భావాన్ని గంభీరమైనదిగానూ సాధారణ పాఠకులకు స్పష్టమైనదిగానూ అందిస్తుంది.
theological_decisions:
- issue: שַׁדַּי మరియు אֵל అనే రెండు దైవ నిర్దేశాల అనువాదం
  choice: ‘సర్వశక్తిమంతుడు’ మరియు ‘దేవుడు’ అని వేర్వేరుగా అనువదించడం
  alternative: ‘షద్దయి ... దేవుడు’ లేదా రెండింటినీ ఒకే పదంతో సమానీకరించడం
  rationale: మూల వాక్యంలో సమాంతర పాదాల్లో రెండు వేర్వేరు దైవ నిర్దేశాలు ఉన్నాయి. వాటి అర్థాన్నీ శైలీవైవిధ్యాన్నీ నిలుపుతూ అదనపు సిద్ధాంతార్థాన్ని చేర్చలేదు.
- issue: దేవునితో ‘వాదించడం’ అనే మాట యొక్క భావం
  choice: ప్రధాన పాఠంలో ‘వాదించాలని’ ఉంచి న్యాయవిచారణ సంబంధమైన ప్రత్యామ్నాయ భావాలను పాదసూచికలో ఇవ్వడం
  alternative: ‘దేవుణ్ణి గద్దించాలని’ లేదా కేవలం ‘దేవునితో మాట్లాడాలని’ అనడం
  rationale: మూల క్రియకు వాదించడం, తర్కించడం, తన పక్షాన్ని వినిపించడం వంటి భావాలు ఉన్నాయి. ‘గద్దించడం’ సందర్భానికి అతిగా నిర్దిష్టం; ‘మాట్లాడడం’ మాత్రం న్యాయవాద భావాన్ని కోల్పోతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలిని వాడాం. ‘నేనైతే’ మూలంలోని ఉద్ఘాటనను నిలుపుతుంది; రెండు సమాంతర పాదాల నిర్మాణాన్ని పంక్తి విభజనతో కాపాడాం.
