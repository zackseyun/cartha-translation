translation:
  language: te
  text: 'నా మాటను శ్రద్ధగా వినండి;

    నా ప్రకటనను మీ చెవులతో ఆలకించండి.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שִׁמְעוּ שָׁמוֹעַ
  choice: శ్రద్ధగా వినండి
  rationale: క్రియతో పాటు అదే ధాతువుకు చెందిన infinitive absolute వాడటం ఆజ్ఞను బలపరుస్తుంది. సహజమైన ఆధునిక తెలుగులో ‘శ్రద్ధగా వినండి’ ఆ ఉద్ఘాటనను స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: מִלָּתִי
  choice: నా మాటను
  rationale: מִלָּה అనే ఏకవచన నామవాచకానికి ‘మాట’ నేరమైన, సహజమైన సమానార్థకం; యోబు చేస్తున్న గంభీరమైన విజ్ఞప్తికి కూడా ఇది సరిపోతుంది.
- source_word: וַאֲחֲוָתִי
  choice: నా వివరణ
  rationale: חוה నుండి వచ్చిన ఈ రూపం చెప్పిన విషయం, ప్రకటన, లేదా వివరణ అనే భావాలను కలిగి ఉండవచ్చు. సందర్భంలో యోబు తన వాదనను వినిపిస్తున్నందున ‘నా వివరణ’ సహజంగా ఉంది; ‘నా ప్రకటన’ అనే ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచి పదంలోని అర్థవిస్తృతిని కాపాడాం.
- source_word: בְּאָזְנֵיכֶם
  choice: మీ చెవుల్లో పడనివ్వండి
  rationale: హీబ్రూ భాషలోని ‘మీ చెవుల్లో’ అనే సజీవమైన రూపకాన్ని నిలుపుతూ, తెలుగులో సహజంగా అర్థమయ్యేలా ‘మీ చెవుల్లో పడనివ్వండి’ అని అనువదించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే శైలిని వాడాం. మొదటి పాదంలోని బలమైన వినికిడి ఆజ్ఞను, రెండవ పాదంలోని ‘చెవుల్లో’ అనే హీబ్రూ రూపకాన్ని సాధ్యమైనంత సహజంగా నిలిపాం.
