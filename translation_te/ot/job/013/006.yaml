translation:
  language: te
  text: 'దయచేసి నా వాదనను[a] వినండి;

    నా పెదవుల వాదనలను[b] ఆలకించండి.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నా గద్దింపును.’ హీబ్రూ పదం దిద్దుబాటు, గద్దింపు, నిరూపణ లేదా తర్కబద్ధమైన వాదనను సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘నా పెదవుల వివాదాలను’ లేదా ‘నా పెదవుల న్యాయవాదాలను.’ హీబ్రూ వ్యక్తీకరణలో మాటల వివాదం లేదా న్యాయపరమైన వాదన అనే భావం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ נָא
  choice: దయచేసి ... వినండి
  rationale: బహువచన ఆజ్ఞతో పాటు ఉన్న నָא విన్నపభావాన్ని మృదువుగా తెలియజేస్తుంది; ఆధునిక ప్రామాణిక తెలుగులో ‘దయచేసి ... వినండి’ సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: תוֹכַחְתִּי
  choice: నా వాదనను
  rationale: תוכחת అనే పదం మందలింపు, నిరూపణ, తర్కం లేదా వాదనను సూచించగలదు. యోబు తన పక్షాన్ని వినిపిస్తున్న న్యాయవాద సందర్భంలో ‘నా వాదనను’ ప్రధాన భావాన్ని అందిస్తూనే, ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలుపుతుంది.
- source_word: וְרִבוֹת
  choice: విన్నపాలను
  rationale: ריבות వివాదాలు, వాదనలు లేదా న్యాయపరమైన విజ్ఞాపనలను సూచించగలదు. ఇక్కడ ‘విన్నపాలు’ యోబు పలుకుతున్న అభ్యర్థనాత్మక-న్యాయవాద స్వరాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది; పదంలోని వివాదార్థాన్ని పాదసూచికలో సూచించాం.
- source_word: שְׂפָתַי
  choice: నా పెదవుల
  rationale: హీబ్రూలోని శరీరాంగ రూపకాన్ని సమతలీకరించకుండా ‘నా పెదవుల’ అని యథాతథంగా నిలిపాం.
- source_word: הַקְשִׁיבוּ
  choice: ఆలకించండి
  rationale: קשׁב శ్రద్ధగా వినడాన్ని సూచిస్తుంది. మొదటి పాదంలోని ‘వినండి’ కంటే కొద్దిగా గాఢమైన శ్రద్ధాభావాన్ని ‘ఆలకించండి’ తెలియజేసి కవితా సమాంతరతను కాపాడుతుంది.
