translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం. మూలంలోని రెండు సమాంతర వాదనలను సెమికోలన్‌తో నిలిపి, అదనపు వ్యాఖ్యానాన్ని చేర్చలేదు.
