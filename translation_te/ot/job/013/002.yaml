  text: What you know[a], I also know; I am not inferior to you.
translation:
  language: te
  text: మీకు తెలిసినది నాకు కూడా తెలుసు; నేను మీకంటే తక్కువవాడిని కాను.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְּדַעְתְּכֶם
  choice: మీకు తెలిసినదంతా
  rationale: כְּ ఉపసర్గతో కూడిన דַּעַת మరియు రెండవ పురుష బహువచన ప్రత్యయం, యోబు జ్ఞానాన్ని అతని స్నేహితుల జ్ఞానంతో పోలుస్తున్నాయి. తెలుగులో ‘మీకు తెలిసినదంతా’ ఈ భావాన్ని సహజంగా తెలియజేసి, తరువాతి ‘నాకూ తెలుసు’తో చక్కని సమాంతరతను కలిగిస్తుంది.
- source_word: יָדַעְתִּי
  choice: నాకు తెలుసు
  rationale: 'ఇది రూపరీత్యా పరిపూర్ణ క్రియ అయినప్పటికీ, ఇక్కడ వర్తమాన స్థితిని సూచిస్తోంది: వారి వద్ద ఉన్న జ్ఞానం తనకూ ఉందని యోబు చెబుతున్నాడు.'
- source_word: גַם אָנִי
  choice: నాకూ
  rationale: גַם యోబు కూడా అదే జ్ఞానం కలిగివున్నాడని నొక్కిచెబుతుంది. ‘నాకూ’ ఆధునిక తెలుగులో సంక్షిప్తంగా, సహజంగా ఆ ఉద్ఘాటనను అందిస్తుంది.
- source_word: לֹא נֹפֵל אָנֹכִי מִכֶּם
  choice: నేను మీకంటే తక్కువవాణ్ణి కాను
  rationale: నֹפֵל తో מִן తులనాత్మకంగా వాడబడినప్పుడు ‘కంటే దిగువగా ఉండడం/తక్కువగా ఉండడం’ అనే భావం వస్తుంది. సందర్భంలో యోబు తన స్నేహితులకంటే జ్ఞానంలో తక్కువవాడు కాదని అంటున్నాడు; అయితే మూలంలో ‘జ్ఞానంలో’ ప్రత్యక్షంగా లేనందున దానిని పాఠ్యంలో చేర్చలేదు.
- source_word: אָנֹכִי
  choice: నేను
  rationale: స్వతంత్ర సర్వనామం యోబు తనను ఉద్ఘాటిస్తున్నట్లు చూపుతుంది. వాక్యాంతర భాగంలో ‘నేను’ను ప్రత్యక్షంగా ఉంచడం ద్వారా ఆ బలం నిలుస్తుంది.
