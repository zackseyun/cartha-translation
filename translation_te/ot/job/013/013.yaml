translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన ఆజ్ఞార్థక శైలి వాడబడింది. మూలంలోని బహువచన సంబోధనను గౌరవ/బహువచన రూపమైన ‘ఉండండి, మాట్లాడనివ్వండి’తో నిలిపి, చివరి భాగంలోని ధైర్యమైన సమర్పణను పునరుక్త ‘సంభవించినా సంభవించనివ్వండి’ ద్వారా వ్యక్తపరచాం.
