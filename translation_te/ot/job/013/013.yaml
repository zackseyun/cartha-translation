  text: Be silent before me[a], and let me speak; then let come upon me what may.
translation:
  language: te
  text: నా ఎదుట మౌనంగా ఉండండి[a]; నన్ను మాట్లాడనివ్వండి. ఆ తర్వాత, నాపై ఏది వచ్చినా రానివ్వండి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, మరింత అక్షరార్థంగా: “నా నుండి మౌనంగా ఉండండి; నేను మాట్లాడతాను. ఏదైనా నాపై దాటిపోనివ్వండి.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֲרִישׁוּ
  choice: మౌనంగా ఉండండి
  rationale: హిఫిల్ ఆజ్ఞార్థక బహువచనం; యోబు తనతో మాట్లాడుతున్నవారిని నిశ్శబ్దంగా ఉండమని దృఢంగా ఆదేశిస్తున్న భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: מִמֶּנִּי
  choice: నా ఎదుట
  rationale: అక్షరార్థంగా ‘నా నుండి’; అయితే הַחֲרִישׁוּతో కలిసినప్పుడు యోబుకు సంబంధించి లేదా అతని సమక్షంలో మాట్లాడడం మానేయాలనే భావం. ‘నా ఎదుట’ ఆ సంబంధార్థాన్ని సహజంగా అందిస్తుంది; అక్షరార్థ ప్రత్యామ్నాయం పాదసూచికలో ఉంచబడింది.
- source_word: וַאֲדַבְּרָה
  choice: నన్ను మాట్లాడనివ్వండి
  rationale: మొదటి పురుష ఏకవచన కోహోర్టేటివ్ రూపం సంకల్పం లేదా అనుమతి కోరే భావాన్ని ఇస్తుంది. ‘నన్ను మాట్లాడనివ్వండి’ ఆ భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: אָנִי
  choice: నన్ను
  rationale: స్వతంత్ర సర్వనామం వక్తపై నొక్కును ఉంచుతుంది. తెలుగులో ‘నన్ను మాట్లాడనివ్వండి’ అనే నిర్మాణం ఆ నొక్కును సహజంగా ప్రతిబింబిస్తుంది.
- source_word: וְיַעֲבֹר
  choice: సంభవించనివ్వండి
  rationale: עבר యొక్క మూలభావం ‘దాటిపోవడం’; עָלַיతో ఈ సందర్భంలో తనపై ఏదైనా రావడం లేదా జరగడం అనే భావం. అనుమతించే/సవాలు స్వీకరించే క్రియాభావాన్ని ‘సంభవించనివ్వండి’ నిలుపుతుంది.
- source_word: עָלַי
  choice: నాకు
  rationale: עברతో కలసి యోబుపై ఏది వచ్చినా అనే భావాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘నాకు సంభవించడం’ సహజమైన ప్రయోగం; ‘నాపై దాటిపోవడం’ అనే అక్షరార్థ రూపం పాదసూచికలో సూచించబడింది.
- source_word: מָה
  choice: ఏది ... అయినా
  rationale: ఇక్కడ מָה అనిర్దిష్టంగా ‘ఏదైనా/ఏది వచ్చినా’ అనే భావం ఇస్తుంది. ‘ఏది సంభవించినా’ యోబు ఫలితాన్ని స్వీకరించడానికి సిద్ధంగా ఉన్న భావాన్ని, దాని అనిర్దిష్టతను కాపాడుతుంది.
