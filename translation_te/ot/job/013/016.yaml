  text: This also will be my salvation[b][a], for no godless man may come before him.
translation:
  language: te
  text: ఇది[c] కూడా నాకు రక్షణగా ఉంటుంది[a]; ఎందుకంటే భక్తిహీనుడు[b] ఆయన సన్నిధికి రాలేడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘రక్షణ’కు బదులుగా ‘విడుదల’ లేదా ‘నిర్దోషిత్వ నిరూపణ’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘భక్తిహీనుడు’ అనే హెబ్రీ పదాన్ని ‘కపటి’ లేదా ‘దైవభక్తి లేనివాడు’ అని కూడా అనువదించవచ్చు. ఇది కేవలం నిజాయితీ లేని వ్యక్తిని కాక, దేవునిపట్ల భయభక్తులు లేని వ్యక్తిని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: ‘ఇది’ అని అనువదించిన హెబ్రీ పదాన్ని రూపరీత్యా ‘ఆయనే’ అని కూడా అర్థం చేసుకోవచ్చు.
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: גַּם הוּא
  choice: ఇది కూడా
  rationale: גַּם అదనాన్ని సూచిస్తుంది; הוּא రూపరీత్యా ‘అతడు/అది’ అయినా, ఈ సందర్భంలో ముందున్న విషయం లేదా యోబు చేస్తున్న వాదనను సూచించే ‘ఇది’ అనే భావం సహజంగా సరిపోతుంది.
- source_word: לִי לִישׁוּעָה
  choice: నాకు రక్షణగా ఉంటుంది
  rationale: లామెద్ నిర్మాణం యోబుకు కలిగే ప్రయోజనాన్ని తెలియజేస్తుంది. יְשׁוּעָה రక్షణను సూచించినప్పటికీ, ఈ న్యాయవాద సందర్భంలో విడుదల లేదా నిర్దోషిత్వ నిరూపణ అనే ఛాయను కూడా కలిగి ఉంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి ప్రకటనకు కారణాన్ని పరిచయం చేసే సంబంధాన్ని తెలుగులో స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: חָנֵף
  choice: భక్తిహీనుడు
  rationale: ఈ హెబ్రీ పదం కేవలం నటించే కపటిని కాక, దేవునిపట్ల భయభక్తులు లేని దైవవిరోధ స్వభావం గల వ్యక్తిని సూచిస్తుంది.
- source_word: לְפָנָיו
  choice: ఆయన సన్నిధికి
  rationale: అక్షరార్థంగా ‘ఆయన ఎదుటికి’; దేవుని సమక్షంలో ప్రత్యక్షమవడం అనే హెబ్రీ నుడికారాన్ని సహజమైన, గౌరవప్రదమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: יָבוֹא
  choice: రాలేడు
  rationale: లֹאతో కలిసి ఇక్కడ కేవలం భవిష్యత్ సంఘటనను కాక, భక్తిహీనుడు దేవుని సన్నిధిలో నిలిచే అర్హత లేదా అవకాశం లేకపోవడాన్ని సూచిస్తుంది.
theological_decisions:
- issue: לְפָנָיו లోని సర్వనామం ఎవరిని సూచిస్తుంది
  choice: ‘ఆయన’—దేవునిని సూచించేది
  alternative: యోబు ఎవరి ఎదుట హాజరవుతున్నాడో ఆ వ్యక్తిని సాధారణంగా సూచించేది
  rationale: సందర్భంలో యోబు దేవుని ఎదుట తన వాదనను వినిపించి న్యాయం పొందడం గురించి మాట్లాడుతున్నాడు. అందువల్ల దైవసూచన అత్యంత సహజం; అయితే మూలపాఠంలో ‘దేవుడు’ అనే నామం ప్రత్యక్షంగా చేర్చబడలేదు.
- issue: יְשׁוּעָה యొక్క భావం
  choice: రక్షణ—విడుదల లేదా నిర్దోషిత్వ నిరూపణ అనే భావఛాయలతో
  alternative: విడుదల; నిర్దోషిత్వ నిరూపణ
  rationale: ‘రక్షణ’ మూలపదపు విస్తృత, గంభీర భావాన్ని నిలుపుతుంది. యోబు న్యాయవాద సందర్భం దానికి అనుకూల తీర్పు లేదా తన నిర్దోషిత్వ నిరూపణ అనే ప్రత్యేక ఛాయను ఇస్తుంది; దానిని పాదసూచికలో వెల్లడించడం భావాన్ని ఒకే అర్థానికి పరిమితం చేయదు.
- issue: גַּם הוּא లో הוּא యొక్క సూచన
  choice: ముందున్న పరిస్థితి లేదా వాదనను సూచించే ‘ఇది’
  alternative: ‘ఆయనే’
  rationale: హెబ్రీ సర్వనామం రూపరీత్యా పురుష ఏకవచనమైనా, సందర్భంలో ముందున్న విషయాన్ని సూచించగలదు. ప్రధాన పాఠంలో సహజమైన సందర్భార్థాన్ని ఇచ్చి, రూపసాధ్యమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచడం అస్పష్టతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయితే యోబు మాటల గంభీరతను నిలుపుతూ అనువదించబడింది. ‘సన్నిధికి’ గౌరవప్రదమైన దైవసంబంధ నుడికారంగా వాడబడింది; ‘భక్తిహీనుడు’ అనే పదాన్ని పాదసూచిక ద్వారా స్పష్టం చేశాం.
