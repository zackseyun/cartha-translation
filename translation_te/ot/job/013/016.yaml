  source_fidelity: 'ప్రధాన అనువాదం హెబ్రీ వాక్యనిర్మాణం మరియు భావాన్ని నమ్మకంగా ప్రతిబింబిస్తుంది: גַּם הוּא కు “ఇది కూడా,” לִי לִישׁוּעָה కు “నాకు రక్షణగా ఉంటుంది,” మరియు חָנֵף కు “భక్తిహీనుడు” సందర్భానుకూలంగా ఉన్నాయి. “ఆయన సన్నిధికి రాలేడు” అనేది לֹא לְפָנָיו חָנֵף יָבוֹא లోని దేవుని సమక్షంలో ప్రవేశం/నిలబడగల అర్హత అనే భావాన్ని సహజంగా ఇస్తుంది.'
