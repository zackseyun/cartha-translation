  register: ఆధునిక ప్రామాణిక తెలుగు; యోబు కవిత్వానికి తగిన గంభీరతను ఉంచుతూ సాధారణ పాఠకులకు అర్థమయ్యే పదాలను వాడాం. రెండు సమాంతర ఉపమానాలను రెండు పాదాలుగా అమర్చాం.
