translation:
  language: te
  text: 'అతడు కుళ్లిన దానిలా క్షీణించిపోతున్నాడు,[a]

    చిమ్మట తిన్న వస్త్రంలా.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతడు కుళ్లు వలె క్షీణించిపోతున్నాడు; చిమ్మట తిన్న వస్త్రంలా.”
    reason: כְּרָקָב ను కాంక్రీటు ఉపమానంగా (‘కుళ్లిన దానిలా’) కాక, భావవాచకంగా (‘కుళ్లు వలె’) అనువదించే రూపసన్నిహిత ప్రత్యామ్నాయం.
lexical_decisions:
- source_word: וְהוּא
  choice: అతడు
  rationale: స్వతంత్ర సర్వనామం సందర్భంలోని బాధితుణ్ణి మళ్లీ ముందుకు తెస్తుంది. וְ అనే సంధిని తెలుగులో విడిగా అనువదించకుండా వాక్యప్రవాహంలో అంతర్లీనంగా ఉంచడం సహజం.
- source_word: כְּרָקָב
  choice: కుళ్లిపోయిన దానిలా
  rationale: רָקָב అంటే కుళ్లు, క్షయం, కుళ్లిన స్థితి. తరువాత వచ్చే క్రియతో కలిసి తెలుగులో స్పష్టమైన, సజీవమైన ఉపమానంగా ఉండేందుకు ‘కుళ్లిపోయిన దానిలా’ అని ఎంచుకున్నాం.
- source_word: יִבְלֶה
  choice: క్షీణించిపోతున్నాడు
  rationale: בלה క్రమంగా అరిగిపోవడం, క్షీణించడం అనే భావాన్ని ఇస్తుంది. మానవ బాధ సందర్భంలో ‘క్షీణించిపోతున్నాడు’ సహజంగా ప్రగతిశీల నాశనాన్ని తెలియజేస్తుంది.
- source_word: כְּבֶגֶד
  choice: వస్త్రంలా
  rationale: בֶּגֶד సాధారణంగా వస్త్రం లేదా దుస్తును సూచిస్తుంది. ఏకవచనాన్ని, కవితాత్మక సంక్షిప్తతను నిలుపుతూ ‘వస్త్రంలా’ అనువదించాం.
- source_word: אֲכָלוֹ
  choice: తినేసిన
  rationale: אכל ఇక్కడ వస్త్రాన్ని చిమ్మట తిని నాశనం చేసిన ఫలితస్థితిని సూచిస్తుంది. ‘తినేసిన’ సంపూర్ణ నాశన భావాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: עָשׁ
  choice: చిమ్మట
  rationale: హీబ్రూలో ఏకవచనం ఉంది; తెలుగులోనూ వర్గార్థక ఏకవచనమైన ‘చిమ్మట’ సహజంగా ఉండి మూలరూపాన్ని నిలుపుతుంది.
