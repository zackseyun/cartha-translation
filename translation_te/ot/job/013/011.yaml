  terminology: “ఔన్నత్యం” suitably represents שְׂאֵתוֹ without importing a doctrinal interpretation. “ఆయన భయం” formally preserves the Hebrew possessive phrasing; the footnote explains the likely contextual sense and the alternative “ఆయన పట్ల భయం.”
