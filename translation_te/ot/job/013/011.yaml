  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: הֲ/לֹ֣א שְׂ֭אֵת/וֹ תְּבַעֵ֣ת אֶתְ/כֶ֑ם וּ֝/פַחְדּ֗/וֹ יִפֹּ֥ל עֲלֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/job/013/011.yaml
  text: Will not his majesty terrify you[b][a], and his dread fall upon you?
translation:
  language: te
  text: ఆయన ఔన్నత్యం[a] మిమ్మల్ని భయభ్రాంతులకు గురిచేయదా? ఆయన భయం[b] మీ మీద పడదా?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆయన ఘనత’ లేదా ‘ఆయన మహిమ.’ హీబ్రూ పదం ఔన్నత్యం, ఘనత, లేదా ఉన్నత స్థితిని సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘ఆయన పట్ల భయం.’ హీబ్రూ పదబంధం అక్షరార్థంగా ‘ఆయన భయం’; సందర్భంలో ఆయన రేకెత్తించే భయం అనే అర్థం ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: చేయదా? ... పడదా?
  rationale: ఇది సమ్మతిని ఆశించే అలంకారిక ప్రశ్న. తెలుగులో నిషేధార్థక ప్రశ్నారూపం దాని బలాన్ని సహజంగా నిలుపుతుంది.
- source_word: שְׂאֵתוֹ
  choice: ఆయన మహోన్నతత్వం
  rationale: ఈ నామవాచకం ఉన్నత స్థితి, ఘనత, మహోన్నతత్వం అనే భావాలను సూచించగలదు. సందర్భంలో దేవుని ఔన్నత్యం భయానికి కారణమవుతున్నందున ‘మహోన్నతత్వం’ మూలంలోని ఎత్తు/ఔన్నత్య భావాన్ని కాపాడుతుంది.
- source_word: תְּבַעֵת
  choice: భయభ్రాంతులకు గురిచేయదా
  rationale: בעת అనే క్రియ యొక్క తీవ్రతను, అంటే ఆకస్మికమైన గాఢ భయాన్ని కలిగించడాన్ని, గంభీరమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אֶתְכֶם
  choice: మిమ్మల్ని
  rationale: ద్వితీయ పురుష బహువచన ప్రత్యక్ష కర్మకు సహజమైన తెలుగు రూపం.
- source_word: וּפַחְדּוֹ
  choice: ఆయన కలిగించే భయం
  rationale: హీబ్రూ స్వామ్య నిర్మాణం ‘ఆయన భయం’ అని అక్షరార్థంగా రావచ్చు; సందర్భంలో అది ఆయన పట్ల కలిగే లేదా ఆయన రేకెత్తించే భయాన్ని సూచించగలదు. ప్రధాన పాఠంలో సహజత కోసం ‘ఆయన కలిగించే భయం’ వాడి, ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలిపాం.
- source_word: יִפֹּל עֲלֵיכֶם
  choice: మీ మీద పడదా
  rationale: ఒక శక్తివంతమైన అనుభవం పైకి వచ్చి ఆవరించే హీబ్రూ చిత్రాన్ని నేరుగా, సహజంగా కాపాడుతుంది.
theological_decisions:
- issue: וּפַחְדּוֹ లోని స్వామ్య సంబంధం
  choice: ఆయన కలిగించే భయం
  alternative: ఆయన పట్ల భయం / ఆయన భయం
  rationale: ఈ నిర్మాణం దేవుడు అనుభవించే భయాన్ని కాక, ఆయన రేకెత్తించే భయాన్ని లేదా ఆయన పట్ల కలిగే భయాన్ని సూచిస్తుంది. ప్రధాన పాఠం సందర్భోచిత భావాన్ని ఇస్తుంది; నిజమైన భాషాత్మక ప్రత్యామ్నాయం పాదసూచికలో ఉంచబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన, కానీ సామాన్య పాఠకులకు అర్థమయ్యే శైలి. రెండు సమాంతర అలంకారిక ప్రశ్నలను నిలిపి, హీబ్రూ వాక్యంలోని తీవ్రతను ‘భయభ్రాంతులకు గురిచేయదా’ అనే రూపంతో వ్యక్తం చేశాం.
