  yaml_path: translation/ot/job/013/012.yaml
  text: Your maxims are proverbs of ashes[a]; your defenses are defenses of clay.
translation:
  language: te
  text: మీ జ్ఞాపకవాక్యాలు బూడిదతో చేసిన సామెతలు[a]; మీ రక్షణలు మట్టితో చేసిన రక్షణలు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీ జ్ఞాపకవాక్యాలు బూడిదతో చేసిన సామెతలు; మీ వీపులు మట్టితో చేసిన వీపులు.” హీబ్రూ వాక్యం సంక్షిప్తంగా ఉంది; చివరి పదబంధం అర్థం అనిశ్చితం. “రక్షణలు” అనేది పునరుక్తమైన నామవాచకానికి సందర్భానుసారమైన అర్థం.
    reason: alternative_reading
lexical_decisions:
- source_word: זִכְרֹנֵיכֶם
  choice: మీ సూక్తులు
  rationale: זכר మూలానికి సాధారణంగా జ్ఞాపకం అనే భావం ఉన్నా, ఇక్కడ యోబు స్నేహితులు అధికారపూర్వకంగా చెప్పే జ్ఞానవాక్యాలను సూచిస్తున్న సందర్భంలో ‘సూక్తులు’ సహజంగా ఉంటుంది.
- source_word: מִשְׁלֵי
  choice: సామెతలు
  rationale: מָשָׁל అనే నామవాచకంలోని సామెత లేదా జ్ఞానోక్తి భావాన్ని నిలుపుతూ, ‘బూడిద సామెతలు’ అనే సంక్షిప్త రూపకాన్ని యథాతథంగా ఉంచుతుంది.
- source_word: אֵפֶר
  choice: బూడిద
  rationale: పదానికి సాధారణ అర్థం ‘బూడిద’; ఇక్కడ పనికిరానితనం, బలహీనత అనే రూపకభావానికి సరిపోతుంది.
- source_word: לְגַבֵּי
  choice: —
  rationale: ఈ కుదించిన కవితా వాక్యంలో సంబంధాన్ని తెలుగులో నామవాచక వాక్య నిర్మాణంతో వ్యక్తం చేయవచ్చు; ప్రత్యేక అనువాద పదం అవసరం లేదు.
- source_word: חֹמֶר
  choice: మట్టి
  rationale: חֹמֶר మట్టి, బంకమట్టి లేదా గారను సూచించగలదు. సాధారణ పాఠకునికి సహజంగా ఉండి బలహీనమైన నిర్మాణ పదార్థం అనే బింబాన్ని నిలుపేందుకు ‘మట్టి’ ఎంచుకున్నాం.
- source_word: גַּבֵּיכֶם
  choice: మీ రక్షణకట్టలు
  rationale: గַּב పదానికి ‘వీపు/ఎత్తైన ఉపరితలం’ అనే మూలార్థం ఉన్నా, ఈ కవితా సందర్భంలో రక్షణనిచ్చే కట్టలు లేదా ప్రాకారాలు అనే సందర్భార్థం సంభావ్యమైనది. పునరుక్తిని నిలుపుతూ ‘రక్షణకట్టలు’ అని అనువదించాం.
