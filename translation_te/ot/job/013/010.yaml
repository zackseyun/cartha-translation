  text: He will surely rebuke you if in secret you show partiality[a].
translation:
  language: te
  text: 'మీరు రహస్యంగా పక్షపాతం చూపితే,

    ఆయన మిమ్మల్ని తప్పకుండా గద్దిస్తాడు.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘ముఖాలను ఎత్తితే’; ఇది అనుకూలత లేదా పక్షపాతం చూపడాన్ని సూచించే హీబ్రూ నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹכֵחַ יוֹכִיחַ
  choice: తప్పకుండా గద్దిస్తాడు
  rationale: ఒకే ధాతువుకు చెందిన క్రియావిశేషక క్రియారూపం, సమాపక క్రియ కలిసి నిశ్చయార్థక ఉద్ఘాటనను ఇస్తాయి. సందర్భంలో దేవుడు యోబు స్నేహితులను తీవ్రంగా మందలిస్తాడనే భావానికి ‘తప్పకుండా గద్దిస్తాడు’ సహజంగా సరిపోతుంది.
- source_word: אֶתְכֶם
  choice: మిమ్మల్ని
  rationale: ఇది ద్వితీయ పురుష బహువచన కర్మ; యోబు తన స్నేహితులందరినీ ఉద్దేశిస్తున్నాడు.
- source_word: אִם
  choice: చూపితే
  rationale: హీబ్రూ షరతార్థక ‘అయితే’ భావాన్ని తెలుగులో సహజమైన షరతు క్రియారూపం ‘చూపితే’ వ్యక్తం చేస్తుంది; ఆ చర్య జరిగిపోయిందని ముందే నిర్ధారించదు.
- source_word: בַּסֵּתֶר
  choice: రహస్యంగా
  rationale: దాచిపెట్టి లేదా గోప్యంగా చేసే చర్యను సూచించే అవ్యయార్థాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: פָּנִים תִּשָּׂאוּן
  choice: పక్షపాతం చూపితే
  rationale: అక్షరార్థంగా ‘ముఖాలను ఎత్తడం’ అనే హీబ్రూ నుడికారం తీర్పులో లేదా వ్యవహారంలో ఒకరి పక్షం వహించడాన్ని సూచిస్తుంది. ‘పక్షపాతం చూపడం’ దాని నైతిక, న్యాయసంబంధ బలాన్ని స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: נשׂא פנים అనే నుడికారపు అనువాదం
  choice: పక్షపాతం చూపడం
  alternative: ముఖాలను ఎత్తడం; ముఖపక్షం చూపడం; అనుకూలత చూపడం
  rationale: ఇక్కడ యోబు స్నేహితులు దేవుని తరఫున పక్షపాతంతో వాదించడాన్ని హెచ్చరిస్తున్నాడు. అక్షరానువాదం తెలుగులో భావాన్ని తెలియజేయదు; ‘పక్షపాతం చూపడం’ నుడికారపు న్యాయసంబంధ, నైతిక భావాన్ని కాపాడుతుంది. దేవునికి అనుకూలంగా మాట్లాడటమే తప్పని ఈ వాక్యం చెప్పడం లేదు; రహస్యంగా పక్షపాతంతో వ్యవహరించడమే గద్దింపుకు కారణమని షరతును నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గంభీరమైన హెచ్చరిక ధోరణి వాడబడింది. హీబ్రూ పదక్రమాన్ని బలవంతంగా అనుసరించకుండా, షరతు ముందుగా మరియు ఫలితం తరువాత వచ్చే సహజ తెలుగు నిర్మాణం ఎంచుకోబడింది; మూలంలోని నిశ్చయార్థక ఉద్ఘాటన ‘తప్పకుండా’ ద్వారా నిలుపబడింది.
