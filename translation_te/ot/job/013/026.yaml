source:
  edition: WLC
  text: כִּֽי תִכְתֹּ֣ב עָלַ֣/י מְרֹר֑וֹת וְ֝/תוֹרִישֵׁ֗/נִי עֲוֺנ֥וֹת נְעוּרָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/013/026.yaml
  text: For you write bitter things against me and make me inherit the iniquities of my youth[a][b].
translation:
  language: te
  text: ఎందుకంటే నీవు నాకు వ్యతిరేకంగా చేదైన సంగతులు రాస్తున్నావు[a]; నా యౌవనపు దోషాలను నాకు స్వాస్థ్యంగా పొందేలా చేస్తున్నావు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నాకు వ్యతిరేకంగా చేదైన తీర్పులు విధిస్తున్నావు.” హీబ్రూలో అక్షరార్థంగా, “నాకు వ్యతిరేకంగా చేదైన సంగతులు రాస్తున్నావు” అని ఉంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “నా యౌవనపు దోషభారాన్ని నాకు మోయేలా చేస్తున్నావు” లేదా “నా యౌవనపు దోషాల శిక్షను నాకు అనుభవింపజేస్తున్నావు.” హీబ్రూ పదం దోషాన్ని, అపరాధభారాన్ని లేదా దాని శిక్షాఫలాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: యోబు తన ఫిర్యాదుకు కారణాన్ని వివరిస్తున్న వాదనా ప్రవాహాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: תִכְתֹּב עָלַי
  choice: నాకు విరోధంగా ... రాస్తున్నావు
  rationale: כתב అనే క్రియ యొక్క ‘రాయడం’ రూపకాన్ని నిలుపుతూ, עַל యొక్క ప్రతికూల భావాన్ని ‘విరోధంగా’ ద్వారా వ్యక్తం చేస్తుంది; అధికారికంగా విధించడం అనే సందర్భార్థాన్ని పాదటిప్పణిలో సూచించాం.
- source_word: מְרֹרוֹת
  choice: చేదైన సంగతులు
  rationale: ఆరోపణలు, తీర్పులు లేదా బాధలు అనే అర్థాల్లో ఏదో ఒకదానికి పరిమితం చేయకుండా, హీబ్రూ బహువచన నామవాచకంలోని విస్తృత భావాన్ని కాపాడుతుంది.
- source_word: וְתוֹרִישֵׁנִי
  choice: నాకు స్వాస్థ్యంగా అనుభవింపజేస్తున్నావు
  rationale: ירשׁ హిఫీల్ రూపంలోని కారణార్థాన్ని, ‘స్వాస్థ్యం’ అనే రూపకాన్ని నిలుపుతూ తెలుగులో అర్థమయ్యేలా వ్యక్తం చేస్తుంది.
- source_word: עֲוֺנוֹת
  choice: దోషాలను
  rationale: עָוֹן పాపకార్యం, అపరాధభారం లేదా దాని శిక్షాఫలాన్ని సూచించగలదు. ‘దోషాలు’ ఈ విస్తృతిని కొంతవరకు నిలుపుతుంది; ప్రత్యామ్నాయ భావాలను పాదటిప్పణిలో తెలిపాం.
- source_word: נְעוּרָי
  choice: నా యౌవనకాలపు
  rationale: ‘నా యౌవనానికి చెందిన’ అనే సంబంధార్థాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: עֲוֺנוֹת పదానికి సందర్భంలో ఉన్న భావపరిధి
  choice: యౌవనకాలపు దోషాలు, వాటితో కూడిన అపరాధభారం లేదా ఫలితాన్ని సూచించేలా విస్తృతంగా ఉంచడం
  alternative: నా యౌవనకాలపు పాపాల శిక్షను నాకు మోయించడం
  rationale: హీబ్రూ పదం పాపం, అపరాధభారం, లేదా శిక్షాఫలాన్ని సూచించగలదు. మూలపాఠం వీటిలో ఒక్కదానికే భావాన్ని పరిమితం చేయదు కాబట్టి ప్రధాన పాఠంలో ఆ ఉద్రిక్తతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘రాస్తున్నావు’ మరియు ‘స్వాస్థ్యం’ ద్వారా మూలంలోని రెండు రూపకాలను సాధ్యమైనంతవరకు నిలిపి, అస్పష్టమైన న్యాయ/శిక్షార్థాలను పాదటిప్పణుల్లో ఉంచాం.
