lexical_decisions:
- source_word: הֶן
  choice: ఇదిగో
  rationale: శ్రద్ధను ఆకర్షిస్తూ వాక్యాన్ని బలంగా ప్రవేశపెట్టే హీబ్రూ అవ్యయానికి సహజమైన, గౌరవప్రదమైన తెలుగు సమానం.
- source_word: כֹּל
  choice: ఇదంతా
  rationale: అక్షరార్థంగా ‘అంతా’; సందర్భంలో ఇప్పటివరకు చర్చించిన విషయాల సమాహారాన్ని సూచించేందుకు ‘ఇదంతా’ సహజంగా ఉంది.
- source_word: רָאֲתָה עֵינִי
  choice: నా కన్ను చూసింది
  rationale: హీబ్రూలోని ఏకవచన శరీరాంగ కర్తను నిలిపి, తదుపరి ‘నా చెవి’తో ఉన్న సమాంతర నిర్మాణాన్ని కాపాడుతుంది.
- source_word: שָׁמְעָה אָזְנִי
  choice: నా చెవి విని
  rationale: మూలంలోని ఏకవచన శరీరాంగ కర్తను, ‘నా కన్ను’తో ఉన్న కవితాత్మక సమాంతరతను నిలుపుతుంది.
- source_word: וַתָּבֶן לָהּ
  choice: గ్రహించింది
  rationale: בין ధాతువు ఇక్కడ వినినదాన్ని అర్థం చేసుకోవడం లేదా వివేచించడం అనే భావాన్ని ఇస్తుంది. స్త్రీలింగ క్రియ సమీపంలోని ‘నా చెవి’ని కొనసాగిస్తుంది; לָהּ అనే ప్రయోగాన్ని తెలుగులో సహజంగా క్రియలోనే వ్యక్తం చేశాం.
