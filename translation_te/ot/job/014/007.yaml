source:
  edition: WLC
  text: כִּ֤י יֵ֥שׁ לָ/עֵ֗ץ תִּ֫קְוָ֥ה אִֽם יִ֭כָּרֵת וְ/ע֣וֹד יַחֲלִ֑יף וְ֝/יֹֽנַקְתּ֗/וֹ לֹ֣א תֶחְדָּֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/014/007.yaml
  text: 'For there is hope for a tree: if it is cut down[a], it will sprout again[b], and its shoot will not cease.'
translation:
  language: te
  text: 'ఎందుకంటే, చెట్టుకు ఆశ ఉంది:


    దాన్ని నరికివేస్తే,


    అది మళ్లీ చిగురిస్తుంది[a];


    దాని లేత చిగురు[b] రావడం ఆగదు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అది తనను తాను నూతనపరచుకుంటుంది.” హీబ్రూ క్రియకు నూతనమవడం అనే భావం ఉండవచ్చు; చెట్టు సందర్భంలో దానిని మళ్లీ చిగురించడంగా అనువదించారు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “దాని లేత మొలక” లేదా “దాని చిగురు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి మాటకు కారణం లేదా వివరణను పరిచయం చేసే అనుసంధాన భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: יֵשׁ לָעֵץ תִּקְוָה
  choice: చెట్టుకు ఆశ ఉంది
  rationale: హీబ్రూ అస్తిత్వ నిర్మాణాన్ని, ఏదో ఒక నిర్దిష్ట చెట్టును కాక సాధారణంగా చెట్టును సూచించే సామెతసదృశ భావాన్ని కాపాడుతుంది.
- source_word: אִם יִכָּרֵת
  choice: దాన్ని నరికివేస్తే
  rationale: אִם అనే షరతు భావాన్ని నేరుగా నిలుపుతుంది; నిఫాల్ క్రియలోని కర్మణి భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וְעוֹד יַחֲלִיף
  choice: అది మళ్లీ చిగురిస్తుంది
  rationale: చెట్టు నరికివేయబడిన తర్వాత కొత్తగా పెరగడాన్ని సందర్భానుగుణంగా స్పష్టంగా తెలియజేస్తుంది; עוֹד లోని పునరావృత్తి భావాన్ని ‘మళ్లీ’ నిలుపుతుంది.
- source_word: וְיֹנַקְתּוֹ
  choice: దాని లేత చిగురు
  rationale: కొత్తగా వచ్చే సున్నితమైన కొమ్మ లేదా మొలకను సూచించే వృక్షసంబంధ చిత్రాన్ని సాధారణ పాఠకులకు సహజంగా అందిస్తుంది.
- source_word: לֹא תֶחְדָּל
  choice: పెరగడం ఆగదు
  rationale: కేవలం ఉనికి ఆగదనే భావం కంటే చిగురు కొనసాగి ఎదిగే సందర్భార్థాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తూనే ‘ఆగదు’ అనే మూల క్రియా భావాన్ని నిలుపుతుంది.
