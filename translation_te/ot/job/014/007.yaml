translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కవితా శైలిని ఉపయోగించాం. హీబ్రూ పాద విభజనను ప్రతిబింబించేలా పంక్తులుగా అమర్చాం; షరతు భావాన్ని ‘నరికివేస్తే’ అని నిలిపి, పునరుజ్జీవన చిత్రాన్ని అతిగా వ్యాఖ్యానించలేదు.
