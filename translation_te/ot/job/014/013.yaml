id: JOB.14.13
reference: Job 14:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: מִ֤י יִתֵּ֨ן בִּ/שְׁא֬וֹל תַּצְפִּנֵ֗/נִי תַּ֭סְתִּירֵ/נִי עַד שׁ֣וּב אַפֶּ֑/ךָ תָּ֤שִׁ֥ית לִ֖/י חֹ֣ק וְ/תִזְכְּרֵֽ/נִי׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/014/013.yaml
  text: Oh[a], that you would hide me in Sheol, that you would conceal me until your anger turns away[b], that you would appoint a time for me and remember me!
translation:
  language: te
  text: నీవు నన్ను షియోల్‌లో[a] దాచిపెట్టి, నీ కోపం వెనుదిరిగే వరకు నన్ను మరుగుచేసి, నాకు ఒక గడువు నిర్ణయించి[b], నన్ను జ్ఞాపకం చేసుకుంటే ఎంత బాగుండును!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, “సమాధిలో” లేదా “మృతుల లోకంలో.” హెబ్రీ: “షియోల్.”'
    reason: lexical_alternative
  - marker: b
    text: లేదా, “నాకు ఒక హద్దు నిర్ణయించి.” హెబ్రీ నామవాచకం స్థిరపరచబడిన, నిర్దేశించబడిన లేదా పరిమితం చేయబడిన దానిని సూచించగలదు.
    reason: alternative_reading
lexical_decisions:
- source_word: מִי יִתֵּן
  choice: చేస్తే ఎంత బాగుండును!
  rationale: ఈ హెబ్రీ నుడికారం అక్షరార్థ ప్రశ్న కాకుండా బలమైన కోరికను వ్యక్తం చేస్తుంది. తెలుగులో వాక్యాంతంలోని ఈ రూపం ఆ ఆశాభావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: בִּשְׁאוֹל
  choice: షియోల్‌లో
  rationale: ఇది కేవలం సమాధిని కాక మృతుల లోకాన్ని సూచించగల హెబ్రీ భావన. తరువాతి కాలపు ‘నరకం’ భావాన్ని చొప్పించకుండా ఉండేందుకు పదాన్ని లిప్యంతరీకరించాం.
- source_word: תַּצְפִּנֵנִי / תַּסְתִּירֵנִי
  choice: దాచిపెట్టి / మరుగుచేసి
  rationale: మూలంలోని సమానార్థక కవితా సమాంతరతను ఒకే పదంగా చదును చేయకుండా, సహజమైన రెండు తెలుగు పదబంధాలతో నిలిపాం.
- source_word: עַד שׁוּב אַפֶּךָ
  choice: నీ కోపం వెనుదిరిగే వరకు
  rationale: אַף ఇక్కడ ‘కోపం’ అనే నుడికారార్థంలో ఉంది; שׁוּב లోని తిరిగి వెళ్లే చిత్రాన్ని ‘వెనుదిరిగే’ నిలుపుతుంది.
- source_word: תָּשִׁית לִי חֹק
  choice: నాకు ఒక గడువు నిర్ణయించి
  rationale: חֹק స్థిరపరచబడినది, నిర్దేశించబడినది లేదా పరిమితమైనది అనే విస్తృతిని కలిగి ఉంది. సందర్భంలో నిర్ణీత కాలపరిమితిని సూచించే ‘గడువు’ సహజంగా సరిపోతుంది; ప్రత్యామ్నాయ భావాన్ని పాదసూచికలో ఉంచాం.
- source_word: וְתִזְכְּרֵנִי
  choice: నన్ను జ్ఞాపకం చేసుకుంటే
  rationale: దైవిక జ్ఞాపకంలోని సంబంధాత్మక బలాన్ని వ్యాఖ్యానంతో విస్తరించకుండా నేరుగా నిలుపుతుంది.
theological_decisions:
- issue: שְׁאוֹל అనువాదం
  choice: షియోల్
  alternative: సమాధి; మృతుల లోకం
  rationale: లిప్యంతరీకరణ మూల హెబ్రీ భావప్రపంచాన్ని నిలుపుతూ, దీనిని కేవలం భౌతిక సమాధిగా కుదించడాన్నీ తరువాతి ‘నరకం’ సిద్ధాంతంతో సమానం చేయడాన్నీ నివారిస్తుంది.
- issue: దేవుని కోపం ‘తిరగడం’
  choice: కోపం వెనుదిరగడం
  alternative: కోపం తొలగిపోవడం
  rationale: ‘తొలగిపోవడం’ సహజ ప్రత్యామ్నాయమైనా, ‘వెనుదిరగడం’ שׁוּב క్రియలోని చలన చిత్రాన్ని మరియు వచనంలోని ఉద్రిక్తతను నిలుపుతుంది.
- issue: חֹק యొక్క సందర్భార్థం
  choice: గడువు
  alternative: హద్దు; నిర్ణీత కాలం; శాసనం
  rationale: యోబు దాచబడిన తరువాత దేవుడు తనను జ్ఞాపకం చేసుకునే ఒక నిర్దేశిత పరిమిత కాలాన్ని కోరుతున్నట్లు సందర్భం సూచిస్తుంది; అయినా నామవాచకంలోని పరిమితి/నిర్దేశం అనే విస్తృతిని పాదసూచికలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కవితా విన్నపంగా రూపొందించాం. ‘ఎంత బాగుండును’ కొద్దిగా ఉన్నతమైనా సాధారణ పాఠకులకు స్పష్టంగా ఉండి, మూలంలోని తీవ్రమైన ఆకాంక్షను మోస్తుంది. ‘షియోల్’ వంటి అపరిచిత పదానికి వెంటనే పాదసూచిక ఇచ్చాం.
