  text: 'సముద్రంలోని నీళ్లు కనుమరుగైనట్టు,

    నది ఇంకిపోయి ఎండిపోయినట్టు,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָזְלוּ
  choice: కనుమరుగైనట్టు
  rationale: ‘తరిగిపోవడం/అంతరించిపోవడం’ అనే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; సముద్రం పూర్తిగా ఎండిపోతుందని అనవసరంగా స్పష్టీకరించదు.
- source_word: מִנִּי יָם
  choice: సముద్రంలోని
  rationale: నీళ్లు సముద్రం నుండి పోయి కనుమరుగవుతున్న దృశ్యాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: נָהָר
  choice: నది
  rationale: సాధారణ అర్థమైన ‘నది/ప్రవాహం’లో సందర్భానికి సరిపోయే విస్తృత పదం.
- source_word: יֶחֱרַב
  choice: ఇంకిపోయి
  rationale: నీరు తగ్గి లేకుండా పోవడం, ప్రవాహం ఎండిపోవడం అనే భావాన్ని సూచిస్తుంది.
- source_word: וְיָבֵשׁ
  choice: ఎండిపోయినట్టు
  rationale: ముందటి క్రియకు సమాంతరంగా ఎండిపోయిన స్థితిని స్పష్టంగా నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, కవితాత్మక సమాంతరతను నిలుపుతూ రెండు పాదాలుగా అనువదించబడింది. ఇది తదుపరి వచనంతో కొనసాగే ఉపమానం కాబట్టి రెండు పాదాల్లోనూ ‘అట్టు’ ఉపయోగించబడింది.
