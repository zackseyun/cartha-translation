  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אֲבָנִ֤ים שָׁ֥חֲקוּ מַ֗יִם תִּשְׁטֹֽף סְפִיחֶ֥י/הָ עֲפַר אָ֑רֶץ וְ/תִקְוַ֖ת אֱנ֣וֹשׁ הֶאֱבַֽדְתָּ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/014/019.yaml
  text: Water wears away stones[a]; its torrents wash away the soil of the earth; so you destroy the hope of man.
translation:
  language: te
  text: 'నీళ్లు రాళ్లను అరిగిస్తాయి;

    వాటి ప్రవాహాలు[a] భూమి మట్టిని కొట్టుకుపోతాయి;

    అలాగే నీవు మర్త్యుని ఆశను నాశనం చేస్తావు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ ‘ప్రవాహాలు’ అని అనువదించిన హీబ్రూ పదం అరుదైనది; దాని అర్థం అనిశ్చితం. అది ‘పొంగిపొర్లేవి,’ ‘కడిగివేతలు,’ లేదా ‘దానిలోనుంచి మొలిచేవి’ అనే భావాన్నీ సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲבָנִים שָׁחֲקוּ מַיִם
  choice: నీళ్లు రాళ్లను అరిగిస్తాయి
  rationale: హీబ్రూ కవితా వాక్యక్రమాన్ని సహజమైన తెలుగు క్రమంలో ఇచ్చి, నీటి నిరంతర రాపిడివల్ల రాళ్లు క్రమంగా అరిగిపోవడం అనే చిత్రాన్ని నిలిపింది.
- source_word: תִּשְׁטֹף
  choice: కొట్టుకుపోతాయి
  rationale: నీటి ప్రవాహం మట్టిని కడిగి దూరంగా తీసుకుపోయే భావాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: סְפִיחֶיהָ
  choice: వాటి ప్రవాహాలు
  rationale: అరుదైన, అర్థం అనిశ్చితమైన పదానికి సందర్భంలోని నీటి కోత చిత్రంతో సరిపోయే అర్థాన్ని ఎంచుకుంది; ఇతర సాధ్యార్థాలను పాదసూచికలో ఉంచింది.
- source_word: עֲפַר אָרֶץ
  choice: భూమి మట్టి
  rationale: అక్షరార్థమైన ‘భూమి ధూళి’కి దగ్గరగా ఉంటూనే, నీరు కొట్టుకుపోయే ఉపరితల పదార్థాన్ని ఈ సందర్భంలో ‘మట్టి’ సహజంగా తెలియజేస్తుంది.
- source_word: תִקְוַת אֱנוֹשׁ
  choice: మర్త్యుని ఆశ
  rationale: אֱנוֹשׁ సూచించే మానవ బలహీనత, మరణశీలతలను ‘మర్త్యుడు’ ప్రతిబింబిస్తుంది; ఏకవచన ప్రతినిధి రూపాన్ని కూడా నిలుపుతుంది.
- source_word: הֶאֱבַדְתָּ
  choice: నీవు ... నాశనం చేస్తావు
  rationale: దేవునికి చేసిన ప్రత్యక్ష సంబోధనను, హిఫిల్ క్రియలోని నశింపజేయడం అనే బలమైన భావాన్ని నేరుగా నిలుపుతుంది.
theological_decisions:
- issue: చివరి పాదంలో దేవునికి ప్రత్యక్ష సంబోధన
  choice: అలాగే నీవు మర్త్యుని ఆశను నాశనం చేస్తావు
  alternative: మర్త్యుని ఆశను నీవు నాశనం చేస్తావు
  rationale: ద్వితీయ పురుష ఏకవచన క్రియ దేవునినే నేరుగా సంబోధిస్తుంది. ‘అలాగే’ ముందున్న ప్రకృతి దృశ్యాలకు చివరి పాదంతో ఉన్న ఉపమాన సంబంధాన్ని వ్యక్తం చేస్తుంది; యోబు ఆరోపణలోని వేదాంతపరమైన ఉద్వేగాన్ని తగ్గించదు.
- issue: אֱנוֹשׁ యొక్క అనువాదం
  choice: మర్త్యుడు
  alternative: మానవుడు; నరుడు
  rationale: ఈ పదం సాధారణ మానవత్వంతో పాటు బలహీనమైన, మరణశీల మానవుని భావాన్ని మోస్తుంది. ‘మర్త్యుడు’ ఆ స్వరాన్ని సహజంగా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యేలా గంభీరమైన కవితా శైలిని ఉపయోగించింది. మూడు సమాంతర పాదాలు మూలంలోని క్రమాన్నీ, ప్రకృతి కోత నుంచి మానవ ఆశ నాశనానికి వెళ్లే భావోద్వేగ తీవ్రతనూ నిలుపుతున్నాయి.
