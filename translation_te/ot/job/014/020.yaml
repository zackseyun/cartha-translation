source:
  edition: WLC
  text: תִּתְקְפֵ֣/הוּ לָ֭/נֶצַח וַֽ/יַּהֲלֹ֑ךְ מְשַׁנֶּ֥ה פָ֝נָ֗י/ו וַֽ/תְּשַׁלְּחֵֽ/הוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/014/020.yaml
  text: You overpower him forever[a], and he passes on[b]; you alter his face and send him away.
translation:
  language: te
  text: నీవు అతనిపై శాశ్వతంగా ప్రబలుతావు; అతడు వెళ్లిపోతాడు[a]. నీవు అతని ముఖాన్ని[b] మార్చి, అతన్ని పంపివేస్తావు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘అతడు నిష్క్రమిస్తాడు.’ హీబ్రూ క్రియ అక్షరార్థంగా ‘వెళ్తాడు’; ఇక్కడ అది జీవితం నుండి లేదా మానవ లోకం నుండి వెళ్లిపోవడాన్ని సూచించే అవకాశం ఉంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘అతని రూపాన్ని.’ ‘ముఖం’ అనే హీబ్రూ పదం విస్తృతంగా ఒకరి బాహ్య రూపాన్ని లేదా ముఖకవళికను కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּתְקְפֵהוּ
  choice: అతనిపై ప్రబలుతావు
  rationale: תקף హిఫీల్ రూపం ఒకరికి వ్యతిరేకంగా బలపడి పైచేయి సాధించడం లేదా జయించడం అనే భావాన్ని ఇస్తుంది. ‘అతనిపై ప్రబలుతావు’ దైవిక ఆధిక్యాన్ని స్పష్టంగా చూపుతూ, మూలంలోని సంబంధాన్ని నిలుపుతుంది.
- source_word: לָנֶצַח
  choice: శాశ్వతంగా
  rationale: נֶצַח ఇక్కడ నిలిచిపోయే, తిరుగులేని వ్యవధిని సూచిస్తుంది. ‘శాశ్వతంగా’ యోబు విలాపంలోని అంతిమతను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וַיַּהֲלֹךְ
  choice: అతడు వెళ్లిపోతాడు
  rationale: הלך యొక్క ప్రాథమిక అర్థం ‘వెళ్లు.’ సందర్భంలో ఇది జీవితం నుండి లేదా మానవ లోకం నుండి తొలగిపోవడాన్ని సూచించవచ్చు; అయితే మరణాన్ని నేరుగా పదంలోకి చేర్చకుండా మూలంలోని అస్పష్టతను ‘వెళ్లిపోతాడు’ కాపాడుతుంది.
- source_word: מְשַׁנֶּה
  choice: మార్చి
  rationale: שנה అంటే ‘మార్చడం.’ తెలుగు వాక్యనిర్మాణంలో తరువాతి క్రియతో సహజంగా కలిసేలా ‘మార్చి’ అని అనువదించబడింది; క్రియ కర్త దేవుడేననే భావం నిలుస్తుంది.
- source_word: פָנָיו
  choice: అతని ముఖాన్ని
  rationale: פנים యొక్క ప్రత్యక్ష అర్థం ‘ముఖం’; అది విస్తృతంగా బాహ్య రూపాన్ని కూడా సూచించగలదు. ప్రధాన పాఠ్యంలో స్పష్టమైన హీబ్రూ ప్రతిమను నిలుపుతూ ప్రత్యామ్నాయ భావాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: וַתְּשַׁלְּחֵהוּ
  choice: అతన్ని పంపివేస్తావు
  rationale: שלח పీయేల్ రూపం పంపివేయడం, తొలగించడం లేదా సాగనంపడం అనే భావాలను కలిగి ఉంటుంది. ‘పంపివేస్తావు’ తొలగింపు స్వభావాన్ని అనవసరంగా కఠినతరం చేయకుండా విస్తృత అర్థాన్ని కాపాడుతుంది.
theological_decisions:
- issue: ‘అతడు వెళ్లిపోతాడు’ అనేది మరణాన్ని నేరుగా సూచిస్తుందా?
  choice: ప్రధాన పాఠ్యంలో ‘వెళ్లిపోతాడు’ అని ఉంచడం
  alternative: ‘మరణించి వెళ్లిపోతాడు’ లేదా ‘చనిపోతాడు’
  rationale: సందర్భం మరణాన్ని బలంగా సూచించినప్పటికీ, మూల క్రియ הלך స్వయంగా ‘వెళ్లు’ అని మాత్రమే చెబుతుంది. కాబట్టి సందర్భార్థాన్ని పాదసూచికలో తెలియజేసి, ప్రధాన పాఠ్యంలో నిజమైన భావ అస్పష్టతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కవితాత్మక శైలి వాడబడింది. ‘ప్రబలుతావు’ మూలంలోని బలమైన ఆధిక్యాన్ని నిలుపుతుంది; ‘వెళ్లిపోతాడు’ మరణ సందర్భాన్ని సూచించినా దానిని అతిగా నిర్దిష్టం చేయదు.
