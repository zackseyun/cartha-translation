source:
  edition: WLC
  text: וְ/גֶ֣בֶר יָ֭מוּת וַֽ/יֶּחֱלָ֑שׁ וַ/יִּגְוַ֖ע אָדָ֣ם וְ/אַיּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/014/010.yaml
  text: But a man dies and is laid low[a]; a human being expires[c][b], and where is he?
translation:
  language: te
  text: కాని పురుషుడు చనిపోతాడు, బలహీనుడైపోతాడు[a]; మానవుడు ప్రాణం విడుస్తాడు[b]—అతడు ఎక్కడ ఉన్నాడు?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘బలహీనపడతాడు’ లేదా ‘శక్తిహీనుడైపోతాడు.’
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో ఇక్కడ మొదట ‘పురుషుడు’ (גבר), తరువాత ‘మానవుడు’ (אדם) అనే రెండు వేరు పదాలు సమాంతరంగా వాడబడ్డాయి; ఇవి మానవుల మరణశీలతను నొక్కిచెబుతున్నాయి.
    reason: cultural_note
lexical_decisions:
- source_word: גֶּבֶר
  choice: పురుషుడు
  rationale: ఈ పదం సాధారణంగా వయోజన పురుషుణ్ణి సూచిస్తూ బలం లేదా పౌరుషం అనే అంతర్నిహిత ఛాయను కలిగి ఉండవచ్చు. ఇక్కడ ఆ ఛాయను అతిగా స్పష్టీకరించకుండా, తరువాతి אָדָםతో ఉన్న కవితాత్మక భేదాన్ని నిలుపుతుంది.
- source_word: יָמוּת
  choice: చనిపోయి
  rationale: ఇది ఒక నిర్దిష్ట భవిష్యత్ సంఘటనకన్నా మానవ మరణం అనే సాధారణ సత్యాన్ని తెలుపుతుంది. తెలుగు వాక్యప్రవాహంలో తరువాతి క్రియతో సహజంగా అనుసంధానించేందుకు అసమాపక రూపం వాడబడింది.
- source_word: וַיֶּחֱלָשׁ
  choice: బలహీనుడవుతాడు
  rationale: חלש యొక్క ప్రాథమిక భావం బలహీనమవడం లేదా శక్తిహీనుడవడం. సందర్భం సూచించే అంతిమ పతనాన్ని వ్యాఖ్యానాత్మకంగా విస్తరించకుండా మూలంలోని పదార్థాన్ని నిలుపుతుంది.
- source_word: וַיִּגְוַע
  choice: ప్రాణం విడుస్తాడు
  rationale: גוע మరణించడం, ప్రాణం పోవడం అనే భావాన్ని ఇస్తుంది. ‘ప్రాణం విడుస్తాడు’ మొదటి ‘చనిపోయి’తో ఉన్న కవితాత్మక సమాంతరాన్ని నిలుపుతూ కేవలం అదే పదాన్ని పునరావృతం చేయదు.
- source_word: אָדָם
  choice: మానవుడు
  rationale: ఇక్కడ ఇది ఏకవచనంలో మానవ వ్యక్తిని సూచిస్తూ גברకు సమాంతరంగా ఉంది. ‘మానవుడు’ రెండు హీబ్రూ పదాల మధ్య వ్యత్యాసాన్ని తెలుగులోనూ నిలుపుతుంది.
- source_word: וְאַיּוֹ
  choice: అప్పుడు అతడు ఎక్కడ ఉన్నాడు?
  rationale: మరణానంతరం ఆ వ్యక్తి కనబడకపోవడాన్ని ప్రశ్నించే ప్రత్యక్ష ప్రశ్నగా నిలుపబడింది. తెలుగు సహజత్వం కోసం సంధిని ‘అప్పుడు’గా వ్యక్తం చేశాం; సమాధానాన్ని ముందుగానే నిర్ణయించలేదు.
theological_decisions:
- issue: ‘అతడు ఎక్కడ ఉన్నాడు?’ అనే ప్రశ్న మరణానంతర స్థితి గురించి ఏమి నిర్ధారిస్తుంది?
  choice: ప్రశ్నను నిజమైన కవితాత్మక ప్రశ్నగానే నిలుపడం
  alternative: ‘అతడు లేకుండా పోతాడు’ అని నిర్ధారణగా అనువదించడం
  rationale: హీబ్రూ వాక్యం ప్రశ్నార్థక రూపంలో ఉంది. దాన్ని ఒక నిర్దిష్ట మరణానంతర సిద్ధాంతానికి అనుగుణంగా నిర్ధారణగా మార్చడం మూలంలోని ఉద్వేగం మరియు సందిగ్ధతను తొలగిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కవితాత్మక శైలి. ‘బలహీనుడవుతాడు’ మూలపదానికి సన్నిహితంగా ఉండగా, ‘ప్రాణం విడుస్తాడు’ మరణార్థాన్ని సాధారణ పాఠకునికి స్పష్టంగా తెలియజేస్తుంది. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
