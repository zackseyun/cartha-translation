id: JOB.14.14
reference: Job 14:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אִם יָמ֥וּת גֶּ֗בֶר הֲ/יִ֫חְיֶ֥ה כָּל יְמֵ֣י צְבָאִ֣/י אֲיַחֵ֑ל עַד בּ֝֗וֹא חֲלִיפָתִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/014/014.yaml
  text: If a man dies[a], will he live again? All the days of my hard service I would wait, until my relief comes.
translation:
  language: te
  text: ఒక మనిషి చనిపోతే, అతడు మళ్లీ బ్రతుకుతాడా? నా కఠిన సేవాకాలమంతా, నా మార్పు[a] వచ్చేవరకు నేను ఎదురుచూస్తాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘నా ఉపశమనం,’ ‘నా పునరుద్ధరణ.’ హీబ్రూ పదానికి మార్పు, ఉపశమనం లేదా పునరుద్ధరణ అనే అర్థాలు ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם יָמוּת גֶּבֶר
  choice: ఒక మనిషి చనిపోతే
  rationale: אִם యొక్క షరతు భావాన్ని ‘చనిపోతే’ సహజంగా వ్యక్తం చేస్తుంది; גֶּבֶר లోని ఏకవచన పురుష సూచనను ‘ఒక మనిషి’ నిలుపుతుంది.
- source_word: הֲיִחְיֶה
  choice: అతడు మళ్లీ బ్రతుకుతాడా?
  rationale: క్రియలో ‘మళ్లీ’ ప్రత్యక్షంగా లేకపోయినా, మరణం తరువాత జీవించడం అనే సందర్భార్థాన్ని తెలుగులో స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: כָּל יְמֵי צְבָאִי
  choice: నా కఠిన సేవాకాలమంతా
  rationale: צָבָא కు సైనిక సేవ, విధిగా నిర్ణయించబడిన సేవాకాలం అనే అర్థాలు ఉన్నాయి. యోబు విలాప సందర్భంలో భారమైన, నిర్ణీత సేవాకాలం అనే భావాన్ని ఈ పదబంధం అందిస్తుంది.
- source_word: אֲיַחֵל
  choice: నేను ఎదురుచూస్తాను
  rationale: יחל యొక్క నిరీక్షించడం/ఆశతో వేచిచూడడం అనే అర్థాలలో, עַד తో కూడిన ఈ వాక్యంలో ఎదురుచూడడం ప్రధానంగా ఉంది; ఆశాభావం అంతర్లీనంగా మిగులుతుంది.
- source_word: עַד בּוֹא חֲלִיפָתִי
  choice: నా మార్పు వచ్చేవరకు
  rationale: חֲלִיפָה కు మార్పు, ఉపశమనం, పునరుద్ధరణ వంటి విస్తృత అర్థపరిధి ఉంది. ‘మార్పు’ మూలపదపు అనిశ్చితిని కాపాడి, పునరుత్థానాన్ని గానీ కేవలం కష్టవిముక్తిని గానీ ముందుగానే నిర్ణయించదు.
theological_decisions:
- issue: ఈ వాక్యం మరణానంతర పునరుత్థానాన్ని స్పష్టంగా బోధిస్తున్నదా, లేక దాని సాధ్యతను ప్రశ్నిస్తూ ఆశాభరిత ఉద్వేగాన్ని నిలుపుతున్నదా?
  choice: ప్రశ్నను ‘అతడు మళ్లీ బ్రతుకుతాడా?’గా ఉంచి, חֲלִיפָתִי ను ‘నా మార్పు’గా అనువదించడం.
  alternative: ‘నా పునరుద్ధరణ’ లేదా ‘నా ఉపశమనం’ అని అనువదించడం.
  rationale: హీబ్రూ వాక్యం నిశ్చిత సిద్ధాంత ప్రకటన కంటే ప్రశ్న, నిరీక్షణ, అనిశ్చిత ఆశను వ్యక్తం చేస్తుంది. ‘మార్పు’ ఈ వేదాంత ఉద్వేగాన్ని పరిష్కరించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన శైలి. ‘సేవాకాలమంతా’ నిర్ణీతమైన భారమైన కాలం అనే సందర్భభావాన్ని ఇస్తుంది; ‘మార్పు’ మూలంలోని ఉద్దేశపూర్వక అర్థవిస్తృతిని నిలుపుతుంది.
