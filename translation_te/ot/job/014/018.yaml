source:
  edition: WLC
  text: וְ֭/אוּלָם הַר נוֹפֵ֣ל יִבּ֑וֹל וְ֝/צ֗וּר יֶעְתַּ֥ק מִ/מְּקֹמֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/014/018.yaml
  text: But even a mountain falling wears away[b][a], and a rock is moved from its place.
translation:
  language: te
  text: అయినా, పడిపోతున్న పర్వతం క్షీణించిపోతుంది[a]; బండ తన స్థానం నుండి తొలగిపోతుంది[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వాడిపోతుంది.’ ఈ క్రియ సాధారణంగా వాడిపోవడం లేదా మసకబారడం అనే అర్థంలో వస్తుంది; ఇక్కడ పర్వతాన్ని గురించి రూపకాలంకారంగా వాడబడింది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘స్థానభ్రంశం చెందుతుంది’ / ‘తన చోటు నుండి కదిలిపోతుంది.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאוּלָם
  choice: అయినా
  rationale: ముందటి భావానికి బలమైన వ్యతిరేక మలుపును సూచిస్తూ, హీబ్రూ అవ్యయపు ఉద్ఘాటనను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: הַר
  choice: పర్వతం
  rationale: కవితాత్మకంగా సాధారణ సత్యాన్ని తెలిపే సందర్భంలో నిర్దిష్టతను బలవంతంగా చేర్చకుండా మూల నామవాచకాన్ని నేరుగా అందిస్తుంది.
- source_word: נוֹפֵל
  choice: పడిపోతున్న
  rationale: Qal వర్తమాన కృదంతంలోని కొనసాగుతున్న, సజీవమైన దృశ్యాన్ని నిలుపుతుంది; ‘పడే’ అనే లక్షణార్థం కూడా సందర్భంలో సాధ్యమే.
- source_word: יִבּוֹל
  choice: క్షీణించిపోతుంది
  rationale: ఈ క్రియ సాధారణంగా వాడిపోవడం లేదా మసకబారడం అనే భావాన్ని ఇస్తుంది; పర్వతానికి రూపకాలంకారంగా వాడినందున, క్రమంగా నశించడాన్ని తెలిపే ‘క్షీణించిపోతుంది’ మూలంలోని రూపకాన్ని అతిగా భౌతికీకరించకుండా నిలుపుతుంది.
- source_word: וְצוּר
  choice: బండ
  rationale: צוּר యొక్క విస్తృతమైన ‘రాయి/బండ/శిల’ భావాన్ని సాధారణ పాఠకునికి సహజంగా, పర్వతంతో సమాంతర చిత్రంగా అందిస్తుంది.
- source_word: יֶעְתַּק
  choice: తొలగిపోతుంది
  rationale: తన చోటు నుండి కదలడం, తొలగిపోవడం, స్థానభ్రంశం చెందడం అనే క్రియా భావాన్ని సహజమైన అకర్మక రూపంలో వ్యక్తం చేస్తుంది.
- source_word: מִמְּקֹמוֹ
  choice: తన స్థానం నుండి
  rationale: మూలంలోని ‘దాని స్థలం నుండి’ అనే భావాన్ని తెలుగులో సహజమైన ఆత్మార్థక నిర్మాణంతో నేరుగా నిలుపుతుంది.
