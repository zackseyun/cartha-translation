translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గంభీరమైన కవితాత్మక ధోరణితో రూపొందించబడింది. పర్వతం ‘వాడిపోవడం’ అనే అసాధారణ హీబ్రూ రూపకాన్ని పూర్తిగా ‘కూలిపోవడం’గా మార్చకుండా ‘క్షీణించిపోతుంది’ అని నిలుపుతూ, ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం. రెండు పాదాల సమాంతరతను సెమీకోలన్‌తో స్పష్టంచేశాం.
