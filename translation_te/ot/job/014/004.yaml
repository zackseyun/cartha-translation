  text: Who can bring a clean thing out of an unclean? No one[a].
translation:
  language: te
  text: అశుద్ధమైనదానిలోనుంచి శుద్ధమైనదాన్ని ఎవరు తీసుకురాగలరు? ఒక్కరు కూడా లేరు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అశుద్ధమైనదానిలోనుంచి శుద్ధమైనదాన్ని ఎవరు కలుగజేయగలరు? ఒక్కరు కూడా లేరు.”
    reason: יִתֵּן అనే క్రియకు ఈ సందర్భంలో ‘తీసుకురావడం’ లేదా ‘కలుగజేయడం’ అనే రెండు సహజమైన భావవ్యక్తీకరణలు సాధ్యమని చూపించడానికి.
lexical_decisions:
- source_word: מִי
  choice: ఎవరు
  rationale: ప్రత్యక్షమైన అలంకార ప్రశ్నను సహజమైన ఆధునిక తెలుగులో అలాగే నిలుపుతుంది.
- source_word: יִתֵּן
  choice: తీసుకురాగలరు
  rationale: נתן అనే క్రియకు అక్షరార్థంగా ‘ఇచ్చు’ అనే భావం ఉన్నా, ఈ నిర్మాణంలో అది దేనినైనా ఉత్పన్నం చేయడం లేదా వెలికి తేవడం అనే భావాన్ని ఇస్తుంది. ప్రశ్నలో అంతర్లీనంగా ఉన్న అసాధ్యతను ‘గలరు’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: טָהוֹר
  choice: శుద్ధమైనదాన్ని
  rationale: నామవాచకంగా వాడిన విశేషణాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తూ, ఆచారపరమైనదా, నైతికమైనదా, సాధారణమైనదా అనే శుద్ధత భావాన్ని అనవసరంగా పరిమితం చేయదు.
- source_word: מִטָּמֵא
  choice: అశుద్ధమైనదానిలోనుంచి
  rationale: מִן ఉపసర్గతో నామవాచకంగా వాడిన טָמֵאను ప్రతిబింబిస్తుంది; శుద్ధం–అశుద్ధం అనే మూలభాష వ్యతిరేకతను నిలుపుతుంది.
- source_word: לֹא אֶחָד
  choice: ఒక్కరు కూడా లేరు
  rationale: అలంకార ప్రశ్నకు సంపూర్ణ నిరాకరణగా ఉన్న హెబ్రీ వ్యక్తీకరణను సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: శుద్ధత–అశుద్ధత పదాల ఉద్దేశం
  choice: అశుద్ధమైనదానిలోనుంచి శుద్ధమైనదాన్ని కలుగజేయడంలో మానవ అసమర్థతను తెలిపే సాధారణ వాక్యంగా అనువదించబడింది.
  alternative: అశుద్ధులైన తల్లిదండ్రుల నుంచి పుట్టుకను ప్రత్యేకంగా సూచించడం; లేదా కేవలం ఆచారపరమైన అపవిత్రతను సూచించడం.
  rationale: హెబ్రీ వాక్యం సంక్షిప్తంగా, సామెతలా ఉంది. ‘శుద్ధమైనది/అశుద్ధమైనది’ అనే పదాలు నైతిక, ఆచారపరమైన, వంశపారంపర్య లేదా అస్తిత్వ సంబంధమైన ఏ ఒక్క అర్థానికీ పరిమితం కాకుండా మూలంలోని వేదాంత ఉద్వేగాన్ని నిలుపుతాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన శైలి. ‘శుద్ధం/అశుద్ధం’ అనే జంట మూలంలోని పరిశుద్ధత–అపవిత్రత వ్యత్యాసాన్ని నిలుపుతూ సాధారణ పాఠకులకు అర్థమయ్యేలా ఉంది.
