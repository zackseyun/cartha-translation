  text: אִ֥ם חֲרוּצִ֨ים יָמָ֗י/ו מִֽסְפַּר חֳדָשָׁ֥י/ו אִתָּ֑/ךְ חק/ו עָ֝שִׂ֗יתָ וְ/לֹ֣א יַעֲבֽוֹר׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/014/005.yaml
  text: Since his days are determined[a], the number of his months is with you; you have set his limit[b], and he cannot pass it.
translation:
  language: te
  text: అతని రోజులు నిర్ణయించబడి ఉన్నందున[a], అతని నెలల సంఖ్య నీ వద్ద ఉంది. నీవు అతని హద్దును నిర్ణయించావు[b]; అతడు దాన్ని దాటలేడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతని రోజులు నిర్ణయించబడి ఉంటే.” హీబ్రూ అవ్యయం షరతును పరిచయం చేయగలదు; అయితే ఈ సందర్భంలో అది యోబు విజ్ఞప్తికి ఆధారాన్ని ఇస్తున్నట్లు కూడా అర్థం కావచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “అతని హద్దు”కు బదులుగా “అతని పరిమితి” లేదా “అతనికోసం నిర్దేశించిన సరిహద్దు” అని కూడా అనువదించవచ్చు. హీబ్రూ పదం స్థిరంగా నిర్దేశించిన సరిహద్దును లేదా విధిని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: నిర్ణయించబడ్డాయి
  rationale: ఈ సందర్భంలో אִם కేవలం ఊహాత్మక షరతును సూచించకుండా, యోబు విజ్ఞప్తికి ఆధారాన్ని పరిచయం చేస్తున్నట్లు అర్థమవుతుంది. తెలుగులో వాక్యాన్ని సహజంగా ఉంచేందుకు దాని కారణార్థ భావాన్ని ప్రధాన వాక్య నిర్మాణంలో వ్యక్తం చేశాం; షరతార్థ ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో నిలిపాం.
- source_word: חֲרוּצִים
  choice: నిర్ణయించబడ్డాయి
  rationale: నిష్క్రియార్థక రూపం మానవుని రోజులు ముందే ఖరారయ్యాయని సూచిస్తుంది. ‘నిర్ణయించబడ్డాయి’ ఆధునిక తెలుగులో స్పష్టంగా ఉండి మూలంలోని బలాన్ని కాపాడుతుంది.
- source_word: יָמָיו
  choice: అతని రోజులు
  rationale: మూడవ పురుష ఏకవచన ప్రత్యయంతో ఉన్న బహువచనానికి నేరమైన అనువాదం; సందర్భంలో జీవించే రోజుల కాలాన్ని సూచిస్తుంది.
- source_word: מִסְפַּר חֳדָשָׁיו
  choice: అతని నెలల సంఖ్య
  rationale: మూలంలోని నామవాచక నిర్మాణాన్ని పారదర్శకంగా నిలుపుతుంది.
- source_word: אִתָּךְ
  choice: నీ దగ్గర ఉంది
  rationale: అక్షరార్థంగా ‘నీతో/నీ దగ్గర’ అనే భావం. దేవుని జ్ఞానం లేదా ఆధీనత అనే భావాలను ఒక్కదానికే పరిమితం చేయకుండా మూలంలోని విస్తృతిని కాపాడుతుంది.
- source_word: חֻקּוֹ
  choice: అతని హద్దు
  rationale: ఈ నామవాచకం నిర్దేశిత పరిమితి, సరిహద్దు, లేదా విధించిన నియమాన్ని సూచించగలదు. తరువాతి ‘దాటలేడు’తో ‘హద్దు’ సహజంగా సరిపోతుంది.
- source_word: עָשִׂיתָ
  choice: నీవే నిర్ణయించావు
  rationale: సాధారణంగా ‘చేశావు’ అయినప్పటికీ, హద్దుతో కలిసి వచ్చినప్పుడు దానిని స్థాపించడం లేదా నిర్దేశించడం అనే భావం వస్తుంది. ‘నీవే’ కర్తను స్పష్టం చేస్తుంది; కొత్త సిద్ధాంతార్థాన్ని చేర్చదు.
- source_word: וְלֹא יַעֲבוֹר
  choice: అతడు దాన్ని దాటలేడు
  rationale: ఏకవచన క్రియ మనిషినే సూచిస్తుంది. దేవుడు నిర్ణయించిన హద్దుకు మించి వెళ్లలేని భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: మానవ జీవితకాలంపై దేవుని నిర్ణయం
  choice: మానవుని రోజులు నిర్ణయించబడ్డాయని, అతని నెలల సంఖ్య దేవుని దగ్గర ఉందని, అతడు దాటలేని హద్దును దేవుడే నిర్ణయించాడని వచనం చెబుతుంది.
  alternative: ఈ వచనం దేవుడు జీవితకాలాన్ని చురుకుగా నిర్ణయిస్తాడనే దానికంటే, దాని సంఖ్య ఆయనకు తెలుసనే భావాన్నే ప్రధానంగా చెబుతుందని చదవవచ్చు.
  rationale: ‘నిర్ణయించబడ్డాయి,’ ‘నీ దగ్గర ఉంది,’ ‘హద్దును నీవే నిర్ణయించావు’ అనే సమ్మేళనం దేవుని జ్ఞానంతోపాటు ఆయన నిర్ణయాధికారాన్ని కూడా బలంగా సూచిస్తుంది. అయితే దీని ఆధారంగా విస్తృతమైన సిద్ధాంతవ్యవస్థను అనువాదంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన శైలిని ఉపయోగించాం. దేవునితో ఏకవచన సంబోధనను ‘నీ/నీవే’గా ఉంచాం. సమాంతర కవితా నిర్మాణాన్ని రెండు వాక్యాలుగా నిలిపి, మూలంలోని షరతు/కారణార్థ సందిగ్ధతను పాదటిప్పణిలో సంరక్షించాం.
