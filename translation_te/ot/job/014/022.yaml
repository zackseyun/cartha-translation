source:
  edition: WLC
  text: אַךְ בְּ֭שָׂר/וֹ עָלָ֣י/ו יִכְאָ֑ב וְ֝/נַפְשׁ֗/וֹ עָלָ֥י/ו תֶּאֱבָֽל־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/job/014/022.yaml
  text: Surely his flesh on him feels pain[b][a], and his soul on him mourns.
translation:
  language: te
  text: నిశ్చయంగా, అతని దేహం అతనికి నొప్పి కలిగిస్తుంది; అతని ప్రాణం[a] అతని గురించే దుఃఖిస్తుంది.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ప్రాణం’ అనే పదాన్ని ‘జీవం,’ ‘తాను,’ లేదా ‘అంతరంగం’ అని కూడా అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
  - marker: b
    text: హీబ్రూ వాక్యం అక్షరార్థానికి దగ్గరగా, ‘నిశ్చయంగా/మాత్రమే అతని దేహం అతని మీద నొప్పిపడుతుంది; అతని ప్రాణం అతని మీద దుఃఖిస్తుంది’ అని ఉంటుంది. ఇక్కడ రెండుసార్లు వచ్చిన ‘అతని మీద’ అనే పదబంధం తెలుగులో సందర్భానుసారంగా ‘అతనికి’ లేదా ‘అతని గురించే’ అని వ్యక్తమవుతుంది. אַךְ అనే పదానికి ‘మాత్రమే,’ ‘నిశ్చయంగా,’ లేదా ‘అయితే’ అనే అర్థాలు సాధ్యమైనవి.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: …నే
  rationale: ఈ సందర్భంలో ఈ కణానికి ఉన్న నిర్బంధార్థాన్ని తెలుగులో ‘బాధనే’, ‘తన గురించే’ అనే నొక్కిచెప్పే రూపాల ద్వారా సహజంగా వ్యక్తం చేశాం; ఇది ‘నిశ్చయంగా’ అనే ఉద్ఘాటనార్థానికీ అవకాశం ఉన్న పదం.
- source_word: בְּשָׂרוֹ
  choice: అతని దేహం
  rationale: ‘మాంసం’ మూలచిత్రానికి దగ్గరగా ఉన్నా, ఇక్కడ వ్యక్తి యొక్క శారీరక అస్తిత్వాన్ని సూచించేందుకు ఆధునిక తెలుగులో ‘దేహం’ మరింత సహజంగా, గౌరవప్రదంగా ఉంటుంది.
- source_word: עָלָיו
  choice: తన బాధనే / తన గురించే
  rationale: రెండు పాదాల్లో పునరావృతమైన עָלָיוను యాంత్రికంగా ‘అతని మీద’ అని అనువదిస్తే తెలుగు అసహజంగా ఉంటుంది. సందర్భానుసారంగా స్వీయసంబంధ భావాన్ని ఈ రూపాలు తెలియజేస్తాయి; అక్షరార్థాన్ని పాదటిప్పణిలో భద్రపరిచాం.
- source_word: יִכְאָב
  choice: బాధను అనుభవిస్తుంది
  rationale: כאב శారీరక నొప్పి లేదా బాధను అనుభవించడాన్ని సూచిస్తుంది. ఈ ప్రయోగం అనుభవార్థాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: נַפְשׁוֹ
  choice: అతని ప్రాణం
  rationale: נֶפֶשׁకు ప్రాణం, జీవం, వ్యక్తి, అంతరంగం వంటి అర్థాలు ఉన్నాయి. దేహంతో ఉన్న కవితాత్మక సమాంతరాన్ని, మానవ స్వభావంపై వాక్యం కలిగించే ఉద్వేగాన్ని అతిగా సిద్ధాంతీకరించకుండా ‘ప్రాణం’ నిలుపుతుంది.
- source_word: תֶּאֱבָל
  choice: దుఃఖిస్తుంది
  rationale: אבל శోకించడం లేదా విలపించడం అనే అర్థం ఇస్తుంది; ‘దుఃఖిస్తుంది’ సాధారణ ఆధునిక తెలుగులో సహజంగా ఉండి భావబలాన్ని నిలుపుతుంది.
theological_decisions:
- issue: దేహానికి సమాంతరంగా נֶפֶשׁ యొక్క మానవశాస్త్రీయ భావం
  choice: ‘ప్రాణం’ అని అనువదించి దేహం–ప్రాణం కవితాత్మక వ్యత్యాసాన్ని నిలిపాం.
  alternative: ‘జీవం’, ‘తాను’, లేదా ‘అంతరంగం’
  rationale: ఈ పాదం మానవ నిర్మాణంపై నిర్దిష్ట సిద్ధాంతాన్ని బోధించకుండా శారీరక బాధను, అంతరంగ దుఃఖాన్ని సమాంతరంగా ఉంచుతుంది. ‘ప్రాణం’ ఆ ఉద్వేగాన్ని పరిష్కరించకుండా కాపాడుతుంది.
- issue: మరణించిన వ్యక్తి అనుభూతి చెందుతున్నాడా అనే ప్రశ్న
  choice: కవితాత్మక వాక్యాన్ని నేరుగా ఉంచాం; మరణానంతర చైతన్యంపై అదనపు వివరణ చేర్చలేదు.
  alternative: ఈ మాటలను కేవలం మరణించే ప్రక్రియకు లేదా స్పష్టమైన మరణానంతర చైతన్యానికి పరిమితం చేయడం
  rationale: హీబ్రూ వాక్యం సంక్షిప్తంగా, కవితాత్మకంగా ఉంది. సందర్భం కలిగించే ఉద్వేగాన్ని ఏదో ఒక సిద్ధాంతపరమైన దిశలో పరిష్కరించడం మూలపాఠాన్ని మించిపోతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; యోబు కవిత్వానికి తగిన గంభీరతను ఉంచుతూ, హీబ్రూలోని అసహజమైన పదక్షర క్రమాన్ని సహజమైన తెలుగు స్వీయసంబంధ ప్రయోగాలుగా మలిచాం. రెండు సమాంతర పాదాల సంక్షిప్తతను కాపాడాం.
