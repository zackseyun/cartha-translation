  variant: modern standard Telugu
source:
  edition: WLC
  text: אַף עַל זֶ֭ה פָּקַ֣חְתָּ עֵינֶ֑/ךָ וְ/אֹ֘תִ֤/י תָבִ֖יא בְ/מִשְׁפָּ֣ט עִמָּֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/014/003.yaml
  text: Yet on such a one you open your eyes[a], and you bring me into judgment with you.
translation:
  language: te
  text: అయినా, అలాంటివాడిమీద నీవు దృష్టి నిలుపుతున్నావు; నన్ను నీతో[a] న్యాయవిచారణలోకి తెస్తున్నావు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘నీ ఎదుట.’ హీబ్రూలో అక్షరార్థంగా ‘నీతో’ అని ఉంది; ఇది దేవుని ఎదుట న్యాయవిచారణకు హాజరుకావడాన్ని గానీ, ఆయనతో న్యాయవ్యాజ్యంలో ప్రవేశించడాన్ని గానీ సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: אַף
  choice: అయినా
  rationale: ముందటి వచనాల్లో చెప్పిన మానవుని క్షణభంగురతకు విరుద్ధంగా దేవుడు అతనిపై దృష్టి పెట్టడాన్ని యోబు ఆశ్చర్యం, అభ్యంతరం కలిసిన స్వరంతో చెబుతున్నాడు.
- source_word: עַל זֶה
  choice: ఇలాంటివాడిపైన
  rationale: అక్షరార్థం ‘దీనిపైన.’ సందర్భంలో ఇది 1–2 వచనాల్లో వర్ణించిన బలహీన మానవుణ్ణి సూచిస్తుంది; వ్యక్తిని స్పష్టంగా చూపుతూ మూలానికి దగ్గరగా ఉండే రూపం ఇది.
- source_word: פָּקַחְתָּ עֵינֶךָ
  choice: నీవు నీ కళ్లు తెరుస్తున్నావు
  rationale: హీబ్రూ కవితాత్మక రూపకాన్ని నిలుపుతూ, ఒకరిపై శ్రద్ధ లేదా పరిశీలన నిలపడమనే సందర్భార్థాన్ని పాఠకుడు గ్రహించేలా నేరుగా అనువదించబడింది.
- source_word: וְאֹתִי
  choice: నన్ను
  rationale: ప్రత్యక్ష కర్మ సర్వనామానికి ఉన్న ఉద్ఘాటనను సహజమైన తెలుగు వాక్యనిర్మాణంలో వ్యక్తిగతంగా నిలుపుతుంది.
- source_word: תָבִיא
  choice: తెస్తున్నావు
  rationale: בוא హిఫీల్ రూపంలోని ‘తీసుకురావడం/రప్పించడం’ అనే ప్రధాన భావాన్ని నిలుపుతుంది; ‘సమన్లు జారీచేయడం’ వంటి ఆధునిక న్యాయపదాన్ని అనవసరంగా చేర్చదు.
- source_word: בְמִשְׁפָּט
  choice: న్యాయవిచారణలోకి
  rationale: న్యాయపరమైన ప్రక్రియ లేదా తీర్పు అనే భావాన్ని తెలియజేస్తూ, దానిని కేవలం ఆధునిక న్యాయస్థానానికి పరిమితం చేయదు.
- source_word: עִמָּךְ
  choice: నీతో
  rationale: עם అనే పూర్వప్రత్యయం యొక్క సాధారణ అర్థం ‘తో.’ దేవుని సమక్షంలో విచారణనా, లేక దేవునితో న్యాయవ్యాజ్యమా అనే ఉద్రిక్తమైన ద్వంద్వార్థాన్ని పరిష్కరించకుండా నిలుపుతుంది.
theological_decisions:
- issue: దేవునితో యోబుకు ఉన్న న్యాయసంబంధాన్ని עִמָּךְ ఎలా వ్యక్తపరుస్తుంది
  choice: నీతో
  alternative: నీ ఎదుట
  rationale: ‘నీతో’ అనేది హీబ్రూ పూర్వప్రత్యయానికి అత్యంత ప్రత్యక్షమైన సమానం. ఇది దేవుని ఎదుట హాజరుకావడం, దేవునితో న్యాయవివాదంలో ప్రవేశించడం అనే రెండు సాధ్య భావాల మధ్య ఉన్న వేదాంతపరమైన ఉద్రిక్తతను ఉద్దేశపూర్వకంగా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కవితాత్మక శైలి వాడబడింది. ‘కళ్లు తెరుస్తున్నావు’ అనే మూల రూపకం, ‘నీతో’ అనే ఉద్దేశపూర్వక న్యాయ అస్పష్టత రెండూ నిలుపబడ్డాయి.
