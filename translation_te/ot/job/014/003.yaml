- from: అయినా ఇలాంటివాడిపైన నీవు నీ కళ్లు తెరుస్తున్నావు; నన్ను నీతో[a] న్యాయవిచారణలోకి తెస్తున్నావు.
  to: అయినా, అలాంటివాడిమీద నీవు దృష్టి నిలుపుతున్నావు; నన్ను నీతో[a] న్యాయవిచారణలోకి తెస్తున్నావు.
