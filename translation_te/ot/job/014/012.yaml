- from: అలాగే మనిషి పడుకొని మళ్లీ లేవడు[a]; ఆకాశాలు లేకపోయే వరకు వారు మేలుకోరు, తమ నిద్రనుండి లేపబడరు[b].
  to: అలాగే మనిషి పడుకొని లేవడు; ఆకాశాలు లేకుండా పోయే వరకు[a] వారు మేలుకోరు, తమ నిద్రనుండి మేల్కొలుపబడరు[b].
  rationale: The revision removes an unnecessary interpretive addition, uses a more idiomatic expression for the heavens’ ceasing to be, and renders the final passive awakening verb more precisely. It also restores footnote content and anchors consistent with the English POB audit trail while retaining the Hebrew’s death-as-sleep imagery and its singular-to-plural shift.
