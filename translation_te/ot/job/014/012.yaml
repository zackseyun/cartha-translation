  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אִ֥ישׁ שָׁכַ֗ב וְֽ/לֹא יָ֫ק֥וּם עַד בִּלְתִּ֣י שָׁ֭מַיִם לֹ֣א יָקִ֑יצוּ וְ/לֹֽא יֵ֝עֹ֗רוּ מִ/שְּׁנָתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/014/012.yaml
  text: So a man lies down and does not rise[a]; until the heavens are no more[b], they will not awake or be roused from their sleep.
translation:
  language: te
  text: అలాగే మనిషి పడుకొని లేవడు; ఆకాశాలు లేకుండా పోయే వరకు[a] వారు మేలుకోరు, తమ నిద్రనుండి మేల్కొలుపబడరు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆకాశాలు ఇక లేకపోయే వరకు.’ హెబ్రీ ప్రయోగం వాస్తవానికి చేరలేని కాలసీమను సూచించే జాతీయవాక్యంగా ఉంది.
    reason: lexical_alternative
  - marker: b
    text: ఈ వచనం మరణాన్ని నిద్రగా చిత్రిస్తూ, వారు మేలుకోరని లేదా తమ నిద్రనుండి మేల్కొలుపబడరని చెబుతుంది.
    reason: cultural_note
lexical_decisions:
- source_word: וְאִישׁ
  choice: అలాగే మనిషి
  rationale: אִישׁ ఇక్కడ మానవ మరణశీలతను ప్రతినిధిగా చెప్పే ఏకవచన పురుషరూపం. וְ ను ముందున్న పోలికతో అనుసంధానించే సందర్భార్థంలో ‘అలాగే’గా అనువదించాం.
- source_word: שָׁכַב
  choice: పడుకొని
  rationale: שׁכב యొక్క ‘పడుకోవడం’ అనే రూపకాన్ని నిలుపుతుంది; సందర్భంలో ఇది మరణానికి సౌమ్యోక్తి అయినా, ప్రధాన పాఠ్యంలో నేరుగా ‘చనిపోవడం’గా విప్పలేదు.
- source_word: וְלֹא יָקוּם
  choice: మళ్లీ లేవడు
  rationale: קום లోని లేవడం అనే భావాన్ని నిలుపుతూ, మరణానంతరం తిరిగి లేవకపోవడాన్ని సహజ తెలుగులో తెలియజేస్తుంది. ‘మళ్లీ’ సందర్భం సూచించే పునరుదయం భావాన్ని స్పష్టం చేస్తుంది గాని సిద్ధాంతపరంగా విస్తరించదు.
- source_word: עַד בִּלְתִּי שָׁמַיִם
  choice: ఆకాశాలు లేకపోయే వరకు
  rationale: అక్షరార్థానికి సమీపంగా ఉండి, ఆకాశాలు ఇక ఉండని దాదాపు అందనంత కాలసీమను సూచించే హెబ్రీ ప్రయోగాన్ని సహజ తెలుగులో నిలుపుతుంది.
- source_word: לֹא יָקִיצוּ
  choice: వారు మేలుకోరు
  rationale: బహువచన క్రియను ‘వారు’తో ప్రతిబింబిస్తూ, మరణాన్ని నిద్రగా చిత్రించే రూపకాన్ని కాపాడుతుంది.
- source_word: וְלֹא יֵעֹרוּ
  choice: లేపబడరు
  rationale: Niphal రూపంలోని కర్మణి/స్థితిమార్పు భావాన్ని చూపుతుంది; ‘మేలుకోరు’తో కవితాత్మక సమాంతరతను నిలుపుతుంది.
- source_word: מִשְּׁנָתָם
  choice: తమ నిద్రనుండి
  rationale: ‘నిద్ర’ అనే సాధారణ పదం మరణరూపకాన్ని పారదర్శకంగా ఉంచుతుంది; స్వీయసంబంధక ‘తమ’ బహువచన కర్తలకు సహజంగా సరిపోతుంది.
theological_decisions:
- issue: మరణరూపకాన్ని సంపూర్ణ నాశనంగా లేదా పునరుత్థాన నిరాకరణగా స్పష్టీకరించాలా
  choice: పడుకోవడం, లేవకపోవడం, మేలుకోకపోవడం అనే మూల రూపకాలను సిద్ధాంతపరమైన విస్తరణ లేకుండా నిలుపడం
  alternative: ‘చనిపోయి మళ్లీ జీవించడు’ అని స్పష్టంగా అనువదించడం లేదా పునరుత్థానాన్ని ప్రత్యక్షంగా ప్రస్తావించడం
  rationale: వాక్యం యోబు దృష్టికోణం నుంచి మరణాన్ని నిద్రరూపకంతో కవితాత్మకంగా వర్ణిస్తుంది. అంతిమ పునరుత్థానం లేదా సంపూర్ణ నాశనం గురించి వ్యవస్థీకృత నిర్ణయంగా మార్చకుండా మూలంలోని ఉద్రిక్తతను నిలుపాం.
- issue: אִישׁ యొక్క లింగరూపం
  choice: మనిషి
  alternative: వ్యక్తి / మానవుడు
  rationale: తెలుగులో ‘మనిషి’ సాధారణ మానవుడిని సూచిస్తూ, హెబ్రీ ఏకవచన ప్రతినిధి వాడుకను సహజంగా అందిస్తుంది; అనవసరమైన లింగసిద్ధాంతాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గంభీరమైన కవితా శైలి. ఏకవచన ‘మనిషి’ నుంచి మూలంలోని బహువచన క్రియలకు అనుగుణంగా ‘వారు/తమ’కు జరిగే మార్పును ఉద్దేశపూర్వకంగా నిలుపాం.
