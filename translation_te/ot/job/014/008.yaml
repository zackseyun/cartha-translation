  yaml_path: translation/ot/job/014/008.yaml
  text: Though its root grows old in the earth[a], and its stump dies in the dust[b],
translation:
  language: te
  text: దాని వేరు భూమిలో వృద్ధమైనా[a], దాని మొద్దు ధూళిలో చనిపోయినా[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దాని వేరు భూమిలో వృద్ధమైతే.” హీబ్రూ పదానికి షరతార్థం ఉండవచ్చు; అయితే చెట్టు ఉపమాన ప్రవాహంలో ఇక్కడ “అయినా” అనే రాయితి భావం ఎక్కువగా సరిపోతుంది.
    reason: alternative_reading
  - marker: b
    text: “మొద్దు” అంటే నరికిన చెట్టులో నేలవద్ద మిగిలిన కాండం; దీనిని “మోడు” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: -అయినా
  rationale: ఈ కవితా సందర్భంలో אִם సాధారణ షరతుకంటే రాయితి భావాన్ని తెలియజేస్తుంది; తరువాతి వచనంలోని పునరుజ్జీవన అవకాశానికి విరుద్ధంగా కనిపించే స్థితిని ఇది పరిచయం చేస్తుంది. అయినప్పటికీ షరతార్థం సాధ్యమే కాబట్టి పాదటిప్పణిలో ఉంచబడింది.
- source_word: יַזְקִין
  choice: ముసలిదైనా
  rationale: זקן యొక్క ప్రక్రియాత్మకమైన ‘ముసలిదగు/వృద్ధమగు’ భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: בָּאָרֶץ
  choice: భూమిలో
  rationale: వృక్ష సంబంధ సందర్భంలో ‘భూమి/నేల’ భావం సరిపోతుంది; עָפָרతో ఉన్న కవితాత్మక సమాంతరాన్ని కూడా నిలుపుతుంది.
- source_word: שָׁרְשׁוֹ
  choice: దాని వేరు
  rationale: హీబ్రూ ఏకవచనాన్ని కాపాడుతూ, చెట్టు వేరును సమష్టిగా సూచిస్తుంది.
- source_word: וּבֶעָפָר
  choice: మట్టిలో
  rationale: עָפָרకు ‘ధూళి’ అనే ప్రత్యక్ష అర్థం ఉన్నప్పటికీ, మొద్దు పాతుకుపోయే వృక్ష సందర్భంలో ‘మట్టి’ సహజంగా ఉంటుంది; మరణాన్ని సూచించే మూల ప్రతిధ్వనిని ‘ధూళిలో’ అనే ప్రత్యామ్నాయం మరింత స్పష్టంగా చూపుతుంది.
- source_word: יָמוּת
  choice: చనిపోయినా
  rationale: מות అనే సాధారణ ‘చనిపోవు’ క్రియను నేరుగా అనువదిస్తుంది; మూలంలో లేని ‘వాడిపోవు’ భావాన్ని చేర్చదు.
- source_word: גִּזְעוֹ
  choice: దాని మొద్దు
  rationale: నరికిన చెట్టులో నేలవద్ద మిగిలే భాగాన్ని గెజע సూచిస్తుంది; తెలుగులో ‘మొద్దు’ ఈ వృక్షచిత్రానికి సహజమైన పదం.
