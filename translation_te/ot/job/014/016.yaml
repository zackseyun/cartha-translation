source:
  edition: WLC
  text: כִּֽי עַ֭תָּה צְעָדַ֣/י תִּסְפּ֑וֹר לֹֽא תִ֝שְׁמ֗וֹר עַל חַטָּאתִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/014/016.yaml
  text: For now you count my steps[b][a]; you do not keep watch over my sin.
translation:
  language: te
  text: ఎందుకంటే ఇప్పుడు నీవు నా అడుగులను లెక్కిస్తున్నావు[a]; నా పాపంపై నీవు నిఘా ఉంచడం లేదు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నా అడుగులను సంఖ్యపెడుతున్నావు.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘నా పాపాన్ని గమనించడం లేదు’; లేదా, ‘నా పాపం కోసం పొంచి చూడడం లేదు.’
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: సందర్భంలో ఈ అవ్యయం ముందున్న మాటకు వివరణాత్మక సంబంధాన్ని కల్పిస్తుంది; దాని అనుసంధాన భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: עַתָּה
  choice: ఇప్పుడు
  rationale: యోబు ఆశిస్తున్న భిన్న పరిస్థితికి ఎదురుగా ప్రస్తుత స్థితిని సూచించే కాలవాచక అవ్యయం.
- source_word: צְעָדַי
  choice: నా అడుగులను
  rationale: ఈ నామవాచకం అడుగులు లేదా అడుగుల కదలికలను సూచిస్తుంది; దేవుడు యోబు ప్రతి కదలికను లెక్కిస్తున్నాడనే చిత్రాన్ని నేరుగా నిలుపుతుంది.
- source_word: תִּסְפּוֹר
  choice: లెక్కిస్తున్నావు
  rationale: ספר అనే క్రియకు ఇక్కడ ‘లెక్కించు’ లేదా ‘సంఖ్య నిర్ణయించు’ అనే అర్థం ఉంది. ‘లెక్కిస్తున్నావు’ ఆధునిక తెలుగులో సహజంగా ఉండి కొనసాగుతున్న ప్రస్తుత చర్యను వ్యక్తపరుస్తుంది.
- source_word: לֹא
  choice: లేదు
  rationale: హీబ్రూ నిరాకరణను తెలుగు వర్తమాన క్రియారూపంతో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: תִשְׁמוֹר עַל
  choice: నిఘా ఉంచడం
  rationale: שׁמר + עַל నిర్మాణం కాపలా కాయడం, గమనిస్తూ ఉండడం, లేదా వెదకడం అనే భావాలను ఇవ్వగలదు. ‘నిఘా ఉంచడం’ పాపాన్ని జాగ్రత్తగా గమనించే భావాన్ని నిలుపుతుంది.
- source_word: חַטָּאתִי
  choice: నా పాపంపై
  rationale: ఇక్కడ ఈ పదానికి ‘పాపం’ అనే అర్థమే సందర్భోచితం. హీబ్రూలోని ఏకవచనాన్ని సమూహార్థం లేదా సారాంశార్థంగా ఉండనిస్తూ ఏకవచనంగానే ఉంచింది.
theological_decisions:
- issue: לֹא תִשְׁמוֹר עַל חַטָּאתִי అనే నిరాకరణ వాక్యభాగం యొక్క భావం
  choice: ‘నా పాపంపై నీవు నిఘా ఉంచడం లేదు’ అని ప్రస్తుత స్థితిని తెలిపే మాటగా అనువదించడం.
  alternative: ‘నా పాపంపై నీవు నిఘా ఉంచవు’ అని ఊహాత్మక కోరికలో భాగంగా, లేదా ‘నా పాపం కోసం నీవు పొంచి చూడడం లేదు’ అని అనువదించడం.
  rationale: హీబ్రూ రూపం నిరాకరణతో కూడిన సాధారణ అసంపూర్ణ క్రియ; విడిగా చూస్తే ప్రస్తుత పరిస్థితిని చెప్పే వాక్యంగా సహజంగా అర్థమవుతుంది. సమీప వచనాలతో ఏర్పడే ఉద్విగ్నతను సమన్వయపరచకుండా మూలపాఠంలోని theological tensionను అలాగే నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన శైలి. ‘అడుగులు,’ ‘లెక్కించడం,’ ‘నిఘా ఉంచడం’ అనే పదాలు మూలంలోని గమనింపు చిత్రాన్ని స్పష్టంగా ఉంచుతాయి; హీబ్రూ వాక్యంలోని భావ ఉద్విగ్నతను పరిష్కరించకుండా కాపాడాయి.
