source:
  edition: WLC
  text: יִכְבְּד֣וּ בָ֭נָי/ו וְ/לֹ֣א יֵדָ֑ע וְ֝/יִצְעֲר֗וּ וְֽ/לֹא יָבִ֥ין לָֽ/מוֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/014/021.yaml
  text: His sons come to honor[a], and he does not know it; they are brought low, and he does not perceive it.
translation:
  language: te
  text: అతని కుమారులు ఘనత పొందుతారు[a], కానీ అతనికి తెలియదు; వారు అల్పులవుతారు, వారి విషయాన్ని అతను గ్రహించడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతని కుమారులు గౌరవింపబడతారు.”
    reason: יִכְבְּדוּ అనే రూపాన్ని ‘ఘనత పొందడం’ అనే స్థితిమార్పుగా లేదా ‘గౌరవింపబడడం’ అనే ఫలితస్థితిగా అర్థం చేసుకోవచ్చు.
lexical_decisions:
- source_word: יִכְבְּדוּ
  choice: ఘనత పొందినా
  rationale: כבד యొక్క ఖల్ రూపం ఇక్కడ ‘గౌరవస్థితికి చేరడం/ఘనత పొందడం’ అనే భావాన్ని ఇస్తుంది. తెలుగు సందర్భంలో ‘ఘనత పొందు’ సహజంగా ఉండి, స్థితిమార్పు భావాన్ని నిలుపుతుంది.
- source_word: בָנָיו
  choice: అతని కుమారులు
  rationale: హీబ్రూ పదం పురుష బహువచనంలో, మూడవ పురుష ఏకవచన స్వామ్య ప్రత్యయంతో ఉంది; అందువల్ల నిర్దిష్టమైన ‘అతని కుమారులు’ అని అనువదించబడింది.
- source_word: וְלֹא יֵדָע
  choice: అతనికి తెలియదు
  rationale: ידע యొక్క ప్రాథమిక భావం ‘తెలుసుకొను/తెలియు.’ ముందున్న పరిస్థితి తెలుగులో సహజంగానే కర్మగా గ్రహించబడుతుంది కాబట్టి అదనంగా ‘అది’ చేర్చలేదు.
- source_word: וְיִצְעֲרוּ
  choice: వారు అల్పులైనా
  rationale: צער ఇక్కడ ముందున్న ఘనతకు విరుద్ధంగా అల్పస్థితికి రావడం లేదా ప్రాముఖ్యత తగ్గడం సూచిస్తుంది. ‘అల్పులవడం’ ఆ వ్యతిరేకతను సంక్షిప్తంగా నిలుపుతుంది; క్రియారూపం కర్తరి లేదా స్థితిమార్పు భావంలో అర్థమయ్యే అవకాశాన్ని అతిగా నిర్ణయించదు.
- source_word: וְלֹא יָבִין
  choice: అతనికి గ్రహింపుకు రాదు
  rationale: בין అంటే గ్రహించడం, వివేచించడం. మరణించిన వ్యక్తికి కుమారుల స్థితి తెలియకపోవడాన్ని ‘గ్రహింపుకు రాదు’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לָמוֹ
  choice: వారి సంగతి
  rationale: ఈ సర్వనామ రూపం తిరిగి కుమారులనే సూచిస్తుంది. ‘వారి సంగతి’ అనేది ‘వారి విషయమై/వారి గురించి’ అనే సంబంధాన్ని తెలుగులో స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా ఉండే శైలి. రెండు సమాంతర వాక్యభాగాలైన కుమారుల ఉన్నతి–అల్పత మరియు తండ్రి తెలియకపోవడం–గ్రహించకపోవడం నిలుపబడ్డాయి.
