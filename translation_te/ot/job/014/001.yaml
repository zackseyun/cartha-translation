  text: אָ֭דָם יְל֣וּד אִשָּׁ֑ה קְצַ֥ר יָ֝מִ֗ים וּֽ/שְׂבַֽע רֹֽגֶז־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/014/001.yaml
  text: Man[a], born of woman[b], is short of days and full of turmoil.
translation:
  language: te
  text: స్త్రీకి పుట్టిన మనిషి[a] కొద్దిరోజులు మాత్రమే జీవించేవాడు; కలతతో నిండివుంటాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మానవుడు”; హీబ్రూ పదం ఇక్కడ మానవ స్థితిని సాధారణంగా సూచించే ఏకవచనం.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “కష్టాలతో నిండివుంటాడు” లేదా “అశాంతితో నిండివుంటాడు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אָדָם
  choice: మనిషి
  rationale: ఇక్కడ ఏ ఒక్క పురుషుణ్ణి మాత్రమే కాక, మానవ స్థితిని ప్రతినిధిగా తెలిపే ఏకవచన నామవాచకం. ‘మనిషి’ ఆధునిక తెలుగులో ఈ సాధారణ అర్థాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: יְלוּד אִשָּׁה
  choice: స్త్రీకి పుట్టిన
  rationale: స్త్రీ ద్వారా జన్మించినవాడనే స్పష్టమైన, శరీరధారిత భావాన్ని నిలుపుతూ తెలుగులో సహజంగా ఉంటుంది.
- source_word: קְצַר יָמִים
  choice: జీవించేది కొద్దిరోజులే
  rationale: అక్షరార్థమైన ‘రోజులు తక్కువ’ అనే హీబ్రూ చిత్రాన్ని కాపాడుతూ, జీవితం స్వల్పమనే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: וּשְׂבַע רֹגֶז
  choice: కలతతో నిండివుంటాడు
  rationale: שְׂבַע లోని ‘నిండిన’ భావాన్ని నిలుపుతుంది; רֹגֶז సూచించగల అంతరంగ అశాంతి, జీవన బాధ రెండింటినీ ‘కలత’ పూర్తిగా ఒకదానికే పరిమితం చేయకుండా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: אָדָם అనే సాధారణ ఏకవచన పదం
  choice: మనిషి
  alternative: మానవజాతి
  rationale: వాక్యం మొత్తం మానవ స్థితి గురించి చెబుతున్నప్పటికీ, మూలంలోని ప్రతినిధి ఏకవచనాన్ని అమూర్తమైన సమూహపదంగా మార్చకుండా నిలిపాం.
- issue: רֹגֶז పదంలోని భావ పరిధి
  choice: కలత
  alternative: కష్టం లేదా అశాంతి
  rationale: ఈ పదం బాహ్య బాధను, అంతరంగ అశాంతిని రెండింటినీ సూచించగలదు. ‘కలత’ ఆ ఉద్రిక్తతను నిలుపుతుంది; పాదసూచిక ఇతర సాధ్యార్థాలను తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గంభీరమైన వాక్య నిర్మాణం వాడబడింది. ‘కొద్దిరోజులే’ మూలంలోని దినాల చిత్రాన్ని, ‘నిండివుంటాడు’ పరిపూర్ణత భావాన్ని నిలుపుతున్నాయి.
