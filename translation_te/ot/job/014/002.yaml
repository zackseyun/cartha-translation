translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కవితా శైలిని ఉపయోగించాం. సమాంతర వాక్య నిర్మాణాన్ని, పువ్వు మరియు నీడ అనే మూల ఉపమానాలను నిలిపాం.
