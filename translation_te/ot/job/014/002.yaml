base_translation:
  language: en
  yaml_path: translation/ot/job/014/002.yaml
  text: Like a flower he comes forth and withers[a]; he flees like a shadow and does not remain.
translation:
  language: te
  text: పువ్వులా అతడు వెలువడి వాడిపోతాడు[a]; నీడలా పారిపోతాడు, నిలిచి ఉండడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘కోయబడతాడు’; ఇక్కడి హీబ్రూ క్రియను, ముఖ్యంగా పువ్వు ఉపమానంలో, వాడిపోవడం లేదా కోయబడడం అనే రెండు విధాలుగా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּצִיץ
  choice: పువ్వులా
  rationale: צִיץ అంటే పువ్వు లేదా పుష్పం. ఆధునిక తెలుగులో ‘పువ్వు’ సహజంగా ఉండి, మానవ జీవితపు క్షణభంగురతను తెలిపే ఉపమానాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: יָצָא
  choice: వికసించి
  rationale: ఈ క్రియకు అక్షరార్థంగా ‘బయలుదేరు/వెలువడు’ అనే భావం ఉంది. పువ్వు ఉపమానంలో తెలుగులో ‘వికసించి’ అనడం సహజంగా ఉండి, జీవితం స్వల్పకాలం ప్రత్యక్షమయ్యే చిత్రాన్ని అందిస్తుంది.
- source_word: וַיִּמָּל
  choice: వాడిపోతాడు
  rationale: ఈ సందర్భంలో מול క్రియను వాడిపోవడం లేదా కోయబడడం/తొలగించబడడం అనే విధాలుగా అర్థం చేసుకోవచ్చు. పువ్వు ఉపమానంతో ‘వాడిపోతాడు’ సహజంగా సరిపోతుంది; మరో అర్థాన్ని పాదసూచికలో నిలిపాం.
- source_word: וַיִּבְרַח
  choice: పారిపోతాడు
  rationale: ברח యొక్క సూటి భావం ‘పారిపోవడం’. జీవితపు వేగవంతమైన గతిని చూపే సజీవమైన క్రియాబలాన్ని ఇది కాపాడుతుంది.
- source_word: כַּצֵּל
  choice: నీడలా
  rationale: క్షణభంగురతను, నిలకడలేమిని తెలిపే సూటి ఉపమానం; తెలుగులో ‘నీడలా’ సహజమైన సమానార్థకం.
- source_word: וְלֹא יַעֲמוֹד
  choice: నిలిచి ఉండడు
  rationale: עמד అక్షరార్థంగా ‘నిలుచు’; ఇక్కడ కొనసాగడం లేదా నిలిచి ఉండడం అనే భావం ఉంది. ‘నిలిచి ఉండడు’ మూల చిత్రాన్నీ సందర్భార్థాన్నీ రెండింటినీ కాపాడుతుంది.
