source:
  edition: WLC
  text: חָתֻ֣ם בִּ/צְר֣וֹר פִּשְׁעִ֑/י וַ֝/תִּטְפֹּ֗ל עַל עֲוֺנִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/014/017.yaml
  text: My transgression is sealed up in a bag[a], and you cover over my iniquity.
translation:
  language: te
  text: నా అతిక్రమం ఒక సంచిలో ముద్రవేయబడి ఉంది; నా దోషం మీద నీవు పూత పూస్తున్నావు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నా దోషాన్ని కప్పివేస్తున్నావు,” “కుట్టి మూసివేస్తున్నావు,” లేదా “బిగించి మూసివేస్తున్నావు.” ఇక్కడి హీబ్రూ క్రియ అర్థం కఠినమైనది; ఖచ్చితమైన రూపకం గురించి భిన్నాభిప్రాయాలు ఉన్నాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָתֻם
  choice: ముద్రవేయబడి ఉంది
  rationale: నిష్క్రియాత్మక ఫలితస్థితిని, అంటే మూసి భద్రపరచబడిన భావాన్ని, సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: בִּצְרוֹר
  choice: ఒక సంచిలో
  rationale: צְרוֹר అనేది కట్టిన మూట, చిన్న సంచి లేదా సంచిని సూచించగలదు; ఇక్కడ వస్తువును దాచిపెట్టి భద్రపరిచే స్పష్టమైన రూపకాన్ని ‘సంచి’ సహజంగా నిలుపుతుంది.
- source_word: פִּשְׁעִי
  choice: నా అతిక్రమం
  rationale: פֶּשַׁע లోని హద్దుమీరడం లేదా తిరుగుబాటు భావాన్ని ‘అతిక్రమం’ గంభీరంగా తెలియజేస్తుంది; సందర్భానికి మించిన బహిరంగ తిరుగుబాటు భావాన్ని బలవంతంగా రుద్దదు.
- source_word: וַתִּטְפֹּל
  choice: నీవు పూత పూస్తున్నావు
  rationale: טפל ఇక్కడ కప్పడం, పూత పూయడం, అతికించడం వంటి అర్థాలు ఇవ్వగల కఠినమైన క్రియ. עַל తో కలిసి ‘పూత పూయడం’ మూలంలోని స్పష్టమైన భౌతిక రూపకాన్ని, దాని సందిగ్ధతను తగినంతగా నిలుపుతుంది.
- source_word: עַל
  choice: మీద
  rationale: దోషంపై ఏదో పదార్థాన్ని పూయడం లేదా అమర్చడం అనే స్థానిక సంబంధాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: עֲוֺנִי
  choice: నా దోషం
  rationale: עָוֹן దోషం, అపరాధం లేదా దోషఫలితాన్ని సూచించగలదు. ‘దోషం’ నైతిక భారాన్ని నిలుపుతూ మొదటి పాదంలోని ‘అతిక్రమం’తో పదభేదాన్ని కాపాడుతుంది.
theological_decisions:
- issue: ఈ వచనంలోని రూపకాల భావబలం
  choice: యోబు చేసిన తప్పులను దేవుడు లెక్క కోసం సంచిలో మూసి, వాటిపై పూత పూసి భద్రపరుస్తున్నట్లుగా వచనం చిత్రిస్తుంది; అనువాదం దీనిని క్షమాపణగా స్పష్టీకరించదు.
  alternative: పాపాన్ని కప్పివేయడం లేదా తొలగించడం ద్వారా క్షమిస్తున్నాడనే భావంగా రూపకాన్ని చదవవచ్చు.
  rationale: ముందరి వచనంతో కూడిన విలాప సందర్భంలో దేవుడు యోబు తప్పులను జాగ్రత్తగా గమనించి నిల్వచేస్తున్నాడనే ప్రతికూల భావం బలంగా ఉంది. అయినా ‘కప్పడం’ అనే రూపకానికి క్షమాపణ అర్థం రావచ్చనే వేదాంత ఉద్రిక్తతను అనువాదం సిద్ధాంతపరంగా పరిష్కరించకుండా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కవితాత్మక గంభీరతతో పాటు సాధారణ పాఠకులకు అర్థమయ్యే పదజాలం. హీబ్రూ సమాంతర నిర్మాణంలోని ‘అతిక్రమం/దోషం’ పదభేదం నిలుపబడింది. అడుగుసూచిక గుర్తు ప్రధాన పాఠ్యంలో చేర్చబడింది.
