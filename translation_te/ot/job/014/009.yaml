  text: at the scent of water it will bud and produce growth like a planted tree[a].
translation:
  language: te
  text: నీటి వాసనకే అది చిగురించి, నాటిన మొక్కలా కొత్త రెమ్మలు వేస్తుంది[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నాటిన మొక్కలా కొత్త పెరుగుదలను కలుగజేస్తుంది.” “కొత్త రెమ్మలు వేస్తుంది” అని అనువదించిన హీబ్రూ పదబంధం సంక్షిప్తంగా ఉంది; అందులోని קָצִיר అనే పదానికి సాధారణంగా “కోత” లేదా “పంట” అని అర్థం. అయితే ఈ సందర్భంలో అది కొత్త రెమ్మలను లేదా కొత్త పెరుగుదలను సూచించే అవకాశం ఎక్కువ.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵרֵיחַ
  choice: నీటి వాసన తగలగానే
  rationale: רֵיחַ అంటే ‘వాసన’; מִן ఉపసర్గతో కలిసి నీరు సమీపించిన స్వల్ప సూచనకే చెట్టు స్పందించే కవితాత్మక భావాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: מַיִם
  choice: నీటి
  rationale: హీబ్రూలో రూపపరంగా బహువచనమైనా, ఇది సాధారణంగా పరిమాణవాచక నామంగా ‘నీరు’ అనే అర్థంలో వాడబడుతుంది.
- source_word: יַפְרִחַ
  choice: చిగురించి
  rationale: פרח హిఫీల్ రూపం చిగురించడం, మొలకెత్తడం లేదా పుష్పించడం అనే భావాలు ఇవ్వగలదు. నరికిన చెట్టు తిరిగి జీవించే సందర్భంలో ‘చిగురించి’ తగినది; ఎదుగుదల దశను అతిగా నిర్దిష్టం చేయదు.
- source_word: וְעָשָׂה קָצִיר
  choice: కొత్త రెమ్మలు వేస్తుంది
  rationale: עָשָׂה సాధారణంగా ‘చేయు/కలుగజేయు’; קָצִיר సాధారణంగా ‘కోత/పంట’ అయినా, ఈ వృక్ష సందర్భంలో కొత్తగా వెలువడే పెరుగుదల లేదా రెమ్మలను సూచిస్తుందని గ్రహించడం సహజం. తెలుగు వృక్షప్రయోగంలో ‘రెమ్మలు వేస్తుంది’ స్పష్టంగా, సహజంగా ఉంటుంది; ప్రత్యామ్నాయ అర్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: כְּמוֹ נָטַע
  choice: నాటిన మొక్కలా
  rationale: כְּמוֹ పోలికను సూచిస్తుంది; נָטַע ఇక్కడ నాటబడిన దానిని సూచించే నామవాచక ప్రయోగం. ‘నాటిన మొక్క’ అనేది ‘చెట్టు’ అని అదనంగా నిర్దిష్టం చేయకుండా సహజ తెలుగు రూపాన్ని ఇస్తుంది.
