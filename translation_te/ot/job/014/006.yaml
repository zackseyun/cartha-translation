translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన కవితా శైలిని వాడాం. దేవునిని నేరుగా సంబోధిస్తున్నందున ‘నీ’ రూపాన్ని నిలిపాం. మూలంలోని חדל మరియు רצה పదాల భావవ్యాప్తిని ప్రధాన పాఠ్యం, పాదటిప్పణి కలిసి ప్రతిబింబిస్తాయి.
