- from: అతని మీద నుండి నీ దృష్టి మళ్లించు[a]; అప్పుడు అతనికి విరామం దొరుకుతుంది; కూలివానిలా అతడు తన రోజుతో తృప్తి పొందే వరకు.
  to: అతని నుండి నీ దృష్టి మళ్లించు[a]; కూలివానిలా అతడు తన రోజుతో సంతృప్తి చెందేవరకు అతనికి విశ్రాంతి కలుగనివ్వు.
