  text: שְׁעֵ֣ה מֵ/עָלָ֣י/ו וְ/יֶחְדָּ֑ל עַד יִ֝רְצֶ֗ה כְּ/שָׂכִ֥יר יוֹמֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/014/006.yaml
  text: Look away from him[a], so that he may rest, until he fulfills his day like a hired worker.
translation:
  language: te
  text: అతని నుండి నీ దృష్టి మళ్లించు[a]; కూలివానిలా అతడు తన రోజుతో సంతృప్తి చెందేవరకు అతనికి విశ్రాంతి కలుగనివ్వు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతని నుండి నీ దృష్టి మళ్లించు; కూలివానిలా అతడు తన రోజును పూర్తిచేసేవరకు అతనికి విరమణ కలుగనివ్వు.” హీబ్రూ పదాలు అతడు మానడం లేదా విరామం పొందడం అనే భావాన్నీ, కూలివాడు తన కేటాయించిన పనిదినాన్ని పూర్తిచేయడం లేదా దానితో సంతృప్తి చెందడం అనే భావాన్నీ సూచించగలవు.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁעֵה מֵעָלָיו
  choice: అతని మీద నుండి నీ దృష్టి మళ్లించు
  rationale: שׁעה అనే ఆజ్ఞారూపం ఇక్కడ చూపును లేదా శ్రద్ధను మరల్చడాన్ని సూచిస్తుంది; מֵעָלָיו అతని మీద ఉన్న పరిశీలన తొలగించబడాలని తెలియజేస్తుంది. దేవుని నిరంతర పరిశీలన నుండి ఉపశమనం కోరుతున్న సందర్భాన్ని ఈ సహజ తెలుగు వ్యక్తీకరణ నిలుపుతుంది.
- source_word: וְיֶחְדָּל
  choice: అప్పుడు అతనికి విరామం దొరుకుతుంది
  rationale: חדל యొక్క ప్రాథమిక భావం ‘ఆగు/మాను.’ సందర్భంలో అది మనిషి ఉనికి ఆగిపోవడం కాక, బాధ లేదా పరిశీలన నుండి విరామం లభించడాన్ని సూచిస్తుంది.
- source_word: עַד
  choice: వరకు
  rationale: కోరబడిన విరామానికి కాలపరమైన హద్దును సూచించే సాధారణ పదం.
- source_word: יִרְצֶה
  choice: తృప్తి పొందే
  rationale: רצה ఇక్కడ సంతోషించడం, తృప్తి పొందడం, అంగీకరించడం అనే భావాలను అనుమతిస్తుంది. కూలివాని దినంతో కూడిన ఉపమానంలో తనకు కేటాయించిన రోజు ముగింపుకు చేరి దానితో తృప్తి పొందే భావాన్ని ఈ ఎంపిక సహజంగా వ్యక్తం చేస్తుంది; ‘పూర్తిచేయు’ అనే ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: כְּשָׂכִיר
  choice: కూలివానిలా
  rationale: שָׂכִיר వేతనానికి పనిచేసే వ్యక్తిని సూచిస్తుంది. ‘కూలివాడు’ ఆధునిక తెలుగులో స్పష్టమైన, సహజమైన సామాజిక-ఆర్థిక చిత్రం.
- source_word: יוֹמוֹ
  choice: తన రోజుతో
  rationale: అక్షరార్థంగా ‘అతని రోజు.’ కూలివాని ఉపమానం పని దినాన్ని సూచిస్తున్నందున మూలంలోని సంక్షిప్తతను నిలిపాం.
