review_pass:
  verdict: revise
  source_fidelity: The draft correctly understands שְׁעֵה מֵעָלָיו as a request that God turn his attention away from the human being, and it retains the hired-worker comparison. However, “అప్పుడు అతనికి విరామం దొరుకుతుంది” changes the Hebrew volitive/jussive sequence into a declarative result (“then he will get respite”). The wording should express the request, “let him have rest/cessation.”
  naturalness: The opening is natural, but the three semicolon-separated segments leave the final “వరకు” phrase syntactically hanging. A connected sentence with “అతనికి విశ్రాంతి కలుగనివ్వు” is more idiomatic modern standard Telugu and clearly governs the temporal clause.
  terminology: “కూలివానిలా” appropriately conveys שָׂכִיר, a person working for wages. “తన రోజుతో సంతృప్తి చెందు” preserves the plausible sense of יִרְצֶה without forcing the alternative sense “complete”; that alternative is retained in the footnote.
  issues:
  - severity: medium
    issue: The jussive וְיֶחְדָּל is rendered as a declarative future/result.
    rationale: The Hebrew asks God to turn away and allow the person respite/cessation. “అప్పుడు ... దొరుకుతుంది” asserts what will happen rather than continuing the request.
  - severity: medium
    issue: The temporal clause is syntactically disconnected by punctuation.
    rationale: “కూలివానిలా అతడు తన రోజుతో తృప్తి పొందే వరకు” needs to modify the request for respite, rather than stand as an incomplete final clause.
  revised_text: అతని నుండి నీ దృష్టి మళ్లించు[a]; కూలివానిలా అతడు తన రోజుతో సంతృప్తి చెందేవరకు అతనికి విశ్రాంతి కలుగనివ్వు.
  revised_footnotes:
