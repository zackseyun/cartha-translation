  edition: WLC
  text: תִּ֭קְרָא וְ/אָנֹכִ֣י אֶֽעֱנֶ֑/ךָּ לְֽ/מַעֲשֵׂ֖ה יָדֶ֣י/ךָ תִכְסֹֽף׃
base_translation:
  language: en
  yaml_path: translation/ot/job/014/015.yaml
  text: You would call[a], and I would answer you[b]; you would long for the work of your hands.
translation:
  language: te
  text: మీరు పిలిచేవారు[a], నేను మీకు జవాబిచ్చేవాడిని; మీ చేతుల పనిని మీరు ఎంతో కోరుకునేవారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘మీరు పిలుస్తారు’ అని కూడా అనువదించవచ్చు; ఇక్కడి సందర్భంలో ఇది యోబు ఆశిస్తున్న సంభావ్య పరిస్థితిని సూచిస్తుంది.
    reason: grammatical_alternative
  - marker: b
    text: ‘మీ చేతుల పని’ అంటే దేవుడు చేసిన మానవుడు—ఆయన సృష్టి.
    reason: cultural_note
lexical_decisions:
- source_word: תִּקְרָא
  choice: మీరు పిలిచేవారు
  rationale: קרא అనే క్రియ యొక్క అసంపూర్ణ రూపం. యోబు 14లోని ఆశాత్మక ఊహా సందర్భాన్ని బట్టి సాధారణ భవిష్యత్తుగా కాక, ‘పిలిచేవారు’ అనే సంభావ్య భావంతో అనువదించబడింది.
- source_word: וְאָנֹכִי
  choice: నేను
  rationale: వావ్ సంధి, బలవంతమైన ప్రథమ పురుష సర్వనామం దేవుని పిలుపుకు యోబు ఇచ్చే ప్రత్యుత్తరాన్ని ఎదురెదురుగా నిలుపుతున్నాయి. తెలుగులో సహజమైన వాక్యక్రమం కోసం ప్రత్యేకంగా ‘మరియు’ చేర్చలేదు.
- source_word: אֶעֱנֶךָּ
  choice: మీకు జవాబిచ్చేవాణ్ణి
  rationale: ענה క్రియ యొక్క ప్రథమ పురుష అసంపూర్ణ రూపం, ద్వితీయ పురుష ఏకవచన ప్రత్యయం కలది. ‘జవాబిచ్చేవాణ్ణి’ మూలార్థాన్నీ, సందర్భంలోని సంభావ్య భావాన్నీ నిలుపుతుంది.
- source_word: לְמַעֲשֵׂה
  choice: పనికోసం
  rationale: מַעֲשֶׂה పని, కార్యం, లేదా తయారైన దానిని సూచించగలదు. ‘మీ చేతుల’ అనే పదబంధంతో కలిసి ఇది దేవుడు చేసిన సృష్టిని సూచిస్తున్నప్పటికీ, ప్రధాన పాఠ్యంలో సృష్టికర్త రూపకాన్ని విప్పకుండా ‘పని’ అని ఉంచబడింది.
- source_word: יָדֶיךָ
  choice: మీ చేతుల
  rationale: మూలంలోని ‘మీ చేతుల’ అనే మానవరూప వర్ణనను నేరుగా నిలుపుతూ, దాన్ని వెంటనే ‘సృష్టి’గా వివరణాత్మకంగా మార్చలేదు.
- source_word: תִכְסֹף
  choice: మీరు ఆరాటపడేవారు
  rationale: כסף అనే క్రియకు బలమైన కోరిక, తపన, ఆరాటం అనే భావం ఉంది. ‘ఆరాటపడేవారు’ ఆధునిక తెలుగులో సహజంగా ఉండి, కేవలం పట్టించుకోవడం కంటే మూలంలోని భావోద్వేగ తీవ్రతను బాగా తెలియజేస్తుంది.
theological_decisions:
- issue: మానవునిపట్ల దేవుని వైఖరిని ఈ వాక్యం కేవలం శ్రద్ధగా చూపాలా, లేక తన సృష్టిపట్ల ఆరాటంగా చూపాలా
  choice: మీ చేతుల పనికోసం మీరు ఆరాటపడేవారు
  alternative: మీ చేతుల పనిపై మీరు శ్రద్ధ చూపేవారు
  rationale: כסף సాధారణంగా కేవలం గమనించడం లేదా శ్రద్ధ చూపడం కంటే బలమైన తపనను సూచిస్తుంది. అందువల్ల తీర్పు మధ్యలోనూ దేవుడు తన సృష్టిని మళ్లీ కోరుకుంటాడనే యోబు ఆశలోని భావోద్వేగ, దైవశాస్త్ర ఉద్రిక్తతను అనువాదం పరిష్కరించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవార్థక ద్వితీయ పురుష రూపాలు వాడబడ్డాయి. కవితాత్మక గంభీరతను నిలుపుతూ వాక్యాన్ని సాధారణ పాఠకులకు సహజంగా ఉంచాం; ‘మీ చేతుల పని’ అనే సృష్టి రూపకాన్ని ప్రధాన పాఠ్యంలో యథాతథంగా కాపాడాం.
