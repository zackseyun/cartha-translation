  text: וַ/יָּ֣מָת אִיּ֔וֹב זָקֵ֖ן וּ/שְׂבַ֥ע יָמִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/job/042/017.yaml
  text: And Job died[a], old and full of days.
translation:
  language: te
  text: యోబు వృద్ధుడై, సంపూర్ణ ఆయుష్కాలం గడిపి[a] చనిపోయాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “దినాలతో తృప్తి చెంది” లేదా “దినాలు నిండినవాడై”; ఇది సంపూర్ణ జీవితకాలాన్ని సూచించే హెబ్రీయ నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: చనిపోయాడు
  rationale: మూత్ ధాతువు యొక్క వయ్యిక్తోల్ రూపం కథనంలోని తదుపరి సంఘటనను తెలియజేస్తుంది. తెలుగు సహజ వాక్యక్రమంలో క్రియను చివర ఉంచడం సముచితం.
- source_word: אִיּוֹב
  choice: యోబు
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన పేరురూపాన్ని అనుసరించాం.
- source_word: זָקֵן
  choice: వృద్ధుడై
  rationale: ‘ముసలివాడు/వృద్ధుడు’ అనే భావాన్ని గౌరవప్రదమైన, సహజమైన ఆధునిక తెలుగు రూపంలో తెలియజేస్తుంది.
- source_word: וּשְׂבַע יָמִים
  choice: నిండైన జీవితకాలం గడిపి
  rationale: అక్షరార్థంగా ‘దినాలతో తృప్తి చెందినవాడు/దినాలు నిండినవాడు’ అనే హెబ్రీయ నుడికారాన్ని సాధారణ తెలుగు పాఠకుడికి అర్థమయ్యేలా, సంపూర్ణ ఆయుష్కాలం అనే భావంతో అందిస్తుంది; ప్రత్యామ్నాయ అక్షరార్థాన్ని పాదసూచికలో నిలిపాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన మరణవార్త శైలిని ఉపయోగించాం. హెబ్రీయ సమన్వయక్రమాన్ని యాంత్రికంగా అనుకరించకుండా తెలుగు వాక్యక్రమాన్ని అనుసరించాం; మూల నుడికారపు రూపాన్ని పాదసూచికలో భద్రపరిచాం.
