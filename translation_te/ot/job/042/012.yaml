revisions:
- from: యెహోవా యోబు తొలినాటి స్థితికంటే అతని మలినాటి స్థితిని మరింతగా ఆశీర్వదించాడు.[a] అతనికి పద్నాలుగు వేల గొర్రెలు, ఆరు వేల ఒంటెలు, వెయ్యి జతల ఎద్దులు,[b] వెయ్యి ఆడ గాడిదలు ఉన్నాయి.
  to: యెహోవా యోబు తొలినాటి స్థితికంటే అతని తరువాతి స్థితిని మరింతగా ఆశీర్వదించాడు.[a] అతనికి పద్నాలుగు వేల గొర్రెలు, ఆరు వేల ఒంటెలు, వెయ్యి జతల ఎద్దులు,[b] వెయ్యి ఆడ గాడిదలు ఉన్నాయి.
  rationale: ‘మలినాటి’ స్థానంలో ‘తరువాతి’ని వాడి, యోబు జీవితంలోని తరువాతి దశను సూచించే אַחֲרִיתను స్పష్టంగా, సహజంగా అందించాం; ఇది ‘చివరి రోజులు’ అనే అనవసర సంకుచితార్థాన్ని కూడా నివారిస్తుంది. ఎద్దులపై ఉన్న పాదసూచికను హెబ్రీలోని జత/కాడి భావాన్ని స్పష్టంగా నిలుపునట్లు సవరించాం.
