id: JOB.42.12
reference: Job 42:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַֽ/יהוָ֗ה בֵּרַ֛ךְ אֶת אַחֲרִ֥ית אִיּ֖וֹב מֵ/רֵאשִׁת֑/וֹ וַֽ/יְהִי ל֡/וֹ אַרְבָּעָה֩ עָשָׂ֨ר אֶ֜לֶף צֹ֗אן וְ/שֵׁ֤שֶׁת אֲלָפִים֙ גְּמַלִּ֔ים וְ/אֶֽלֶף צֶ֥מֶד בָּקָ֖ר וְ/אֶ֥לֶף אֲתוֹנֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/042/012.yaml
  text: And Yahweh blessed the latter part of Job more than his beginning[a]. And he had fourteen thousand sheep, six thousand camels, a thousand yoke of oxen[b], and a thousand female donkeys.
translation:
  language: te
  text: యెహోవా యోబు తొలినాటి స్థితికంటే అతని తరువాతి స్థితిని మరింతగా ఆశీర్వదించాడు.[a] అతనికి పద్నాలుగు వేల గొర్రెలు, ఆరు వేల ఒంటెలు, వెయ్యి జతల ఎద్దులు,[b] వెయ్యి ఆడ గాడిదలు ఉన్నాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హెబ్రీలో అక్షరార్థంగా: “యోబు అంత్యభాగాన్ని అతని ఆరంభంకంటే.”'
    reason: lexical_alternative
  - marker: b
    text: 'లేదా: “వెయ్యి కాడి జతల ఎద్దులు” లేదా “వెయ్యి ఎద్దుల జతలు.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיהוָה
  choice: యెహోవా
  rationale: దేవుని వ్యక్తిగత నామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన ‘యెహోవా’ రూపంలో అందించాం.
- source_word: בֵּרַךְ
  choice: ఆశీర్వదించాడు
  rationale: ברך అనే క్రియకు సహజమైన ప్రాథమిక అర్థాన్ని నిలుపుతూ, యోబు సంపదకు దేవుడే మూలమని వ్యక్తం చేస్తుంది.
- source_word: אַחֲרִית אִיּוֹב מֵרֵאשִׁתוֹ
  choice: యోబు తొలినాటి స్థితికంటే అతని మలినాటి స్థితిని మరింతగా
  rationale: אַחֲרִית–רֵאשִׁית మధ్య ఉన్న కాలస్థితి వ్యత్యాసాన్ని సహజమైన తెలుగులో చూపిస్తుంది; ‘చివరి రోజులు’ అని సంకుచితం చేయకుండా, యోబు జీవితంలోని తరువాతి దశను సూచిస్తుంది.
- source_word: וַיְהִי לוֹ
  choice: అతనికి ... ఉన్నాయి
  rationale: ‘అతనికి ఉండెను’ అనే హెబ్రీ అస్తిత్వ నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: אַרְבָּעָה עָשָׂר אֶלֶף צֹאן
  choice: పద్నాలుగు వేల గొర్రెలు
  rationale: צֹאן చిన్న పశువుల సమూహాన్ని సూచించగలిగినా, యోబు 1:3తో ఉన్న సమాంతరతలో సంప్రదాయబద్ధమైన ‘గొర్రెలు’ సరైన ఎంపిక.
- source_word: שֵׁשֶׁת אֲלָפִים גְּמַלִּים
  choice: ఆరు వేల ఒంటెలు
  rationale: సంఖ్యను, జంతువు పేరును నేరుగా మరియు సహజంగా అనువదిస్తుంది.
- source_word: אֶלֶף צֶמֶד בָּקָר
  choice: వెయ్యి జతల ఎద్దులు
  rationale: צֶמֶד పని కోసం జతగా కట్టే పశువులను సూచిస్తుంది. ‘జతల ఎద్దులు’ మూలంలోని లెక్కింపు విధానాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: אֶלֶף אֲתוֹנוֹת
  choice: వెయ్యి ఆడ గాడిదలు
  rationale: אֲתוֹנוֹתలోని స్త్రీలింగ ప్రత్యేకతను ఆధునిక, స్పష్టమైన తెలుగులో పరిరక్షిస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలోని వ్యక్తిగత దైవనామాన్ని బిరుదుగా మార్చకుండా నిలుపుతూ, సాధారణ తెలుగు క్రైస్తవ పాఠకులకు విస్తృతంగా తెలిసిన రూపాన్ని ఎంచుకున్నాం.
- issue: యోబు తరువాతి స్థితికి వచ్చిన ఆశీర్వాదం యొక్క స్వభావం
  choice: ‘ఆశీర్వదించాడు’ అనే మూల క్రియను యథాతథంగా ఉంచడం
  alternative: ‘సంపన్నుణ్ణి చేశాడు’
  rationale: వచనంలో కనిపించే భౌతిక సమృద్ధిని అంగీకరిస్తూనే, ఆశీర్వాదాన్ని కేవలం సంపదకు పరిమితం చేయకుండా మూలంలోని ధార్మిక భావాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ‘తొలినాటి స్థితి/మలినాటి స్థితి’ అనే సమాంతర పదబంధం హెబ్రీ వ్యత్యాసాన్ని సహజంగా తెలియజేస్తుంది; జంతువుల జాబితా సరళమైన గద్యలయలో ఉంచబడింది.
