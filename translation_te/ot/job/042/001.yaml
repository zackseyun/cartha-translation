  text: וַ/יַּ֖עַן אִיּ֥וֹב אֶת יְהוָ֗ה וַ/יֹּאמַֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/042/001.yaml
  text: Then Job answered Yahweh and said:[a]
translation:
  language: te
  text: అప్పుడు యోబు యాహ్వేకు జవాబిచ్చి ఇలా అన్నాడు:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూలో: “YHWH”; తెలుగులో సంప్రదాయంగా “యెహోవా” అని అనువదిస్తారు. “ప్రభువు” అనేది బిరుదురూప అనువాదం.'
    reason: దైవనామానికి ఉన్న లిప్యంతరీకరణ, సంప్రదాయ అనువాద ప్రత్యామ్నాయాలను తెలియజేయడం.
lexical_decisions:
- source_word: וַיַּעַן
  choice: జవాబిచ్చాడు
  rationale: ענה అనే క్రియ ఈ సంభాషణాత్మక కథన సూత్రంలో ‘జవాబిచ్చాడు’ లేదా ‘ప్రతిస్పందించాడు’ అనే అర్థం ఇస్తుంది. ప్రత్యక్ష ప్రశ్న వెంటనే ముందు లేకపోయినా, యోబు దేవుని మాటలకు ఇచ్చిన జవాబును ఇది సూచిస్తుంది.
- source_word: אִיּוֹב
  choice: యోబు
  rationale: אִיּוֹב అనే వ్యక్తినామానికి తెలుగులో స్థిరపడిన రూపం.
- source_word: אֶת
  choice: '[ప్రత్యేకంగా అనువదించలేదు]'
  rationale: ఇది నిర్దిష్ట ప్రత్యక్ష కర్మను సూచించే హీబ్రూ వ్యాకరణ చిహ్నం; తెలుగులో దీనికి ప్రత్యేక పదం అవసరం లేదు.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామానికి తెలుగులో విస్తృతంగా గుర్తింపుపొందిన లిప్యంతరీకరణను వాడి, దానిని బిరుదుతో భర్తీ చేయలేదు.
- source_word: וַיֹּאמַר
  choice: ఇలా
  rationale: ‘అని చెప్పాడు’ అనే హీబ్రూ కథన సూత్రం తరువాత వచ్చే ప్రత్యక్ష వాక్యాన్ని పరిచయం చేస్తుంది. తెలుగులో ‘ఇలా జవాబిచ్చాడు’ అనే సమగ్ర నిర్మాణం సహజంగా ఉండి, రెండు క్రియల భావాన్నీ నిలుపుతుంది.
- source_word: וַ
  choice: అప్పుడు
  rationale: ఆరంభంలోని వావ్ కథన క్రమాన్ని ముందుకు తీసుకెళ్తుంది; ఆధునిక తెలుగులో ‘అప్పుడు’ ఆ వరుసను సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా తెలుగులో సుపరిచితమైన ‘యెహోవా’ రూపంలో ఉంచాం; మూల ఉచ్చారణను ‘యాహ్వే’గా సూచించే ప్రత్యామ్నాయాన్ని పాదసూచిక తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన కథన శైలి. హీబ్రూలోని ‘జవాబిచ్చి చెప్పాడు’ అనే ద్విక్రియా సూత్రాన్ని తెలుగులో అసహజ పునరుక్తి లేకుండా ‘ఇలా జవాబిచ్చాడు’గా అందించాం.
