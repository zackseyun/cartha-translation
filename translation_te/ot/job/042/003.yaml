  text: מִ֤י זֶ֨ה מַעְלִ֥ים עֵצָ֗ה בְּֽלִ֫י דָ֥עַת לָ/כֵ֣ן הִ֭גַּדְתִּי וְ/לֹ֣א אָבִ֑ין נִפְלָא֥וֹת מִ֝מֶּ֗/נִּי וְ/לֹ֣א אֵדָֽע׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/042/003.yaml
  text: ‘Who is this who hides counsel without knowledge?’ Therefore I have spoken, but I did not understand—things too wonderful for me[b][a], which I did not know.
translation:
  language: te
  text: “జ్ఞానం లేకుండా యోచనను దాచిపెట్టే ఇతడెవడు?” అందుచేత నేను గ్రహించని సంగతుల గురించి మాట్లాడాను—అవి నాకు అందనంత అద్భుతమైనవి, నేను ఎరుగనివి.[b][a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత సంప్రదాయబద్ధంగా, “జ్ఞానం లేకుండా యోచనను చీకటిపరచే ఇతడెవడు?” అని అనువదించవచ్చు. అయితే ఇక్కడి హీబ్రూ పదప్రయోగం యోబు 38:2లోనిదానికంటే భిన్నంగా ఉంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా “నన్ను మించిన సంగతులు,” లేక “నాకు అతీతమైన అద్భుతాలు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי זֶה
  choice: ఇతడెవడు?
  rationale: దేవుని ప్రశ్నలోని ప్రత్యక్ష ప్రశ్నార్థక బలాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: מַעְלִים
  choice: దాచిపెట్టే
  rationale: עלם హిఫిల్ రూపానికి ప్రధాన భావం దాచడం లేదా మరుగుపరచడం. 38:2లోని వేరే హీబ్రూ క్రియ ప్రభావంతో ‘చీకటిపరచే’ అని సమన్వయపరచకుండా, ఇక్కడి పదాన్నే అనుసరిస్తుంది.
- source_word: עֵצָה
  choice: ఆలోచనను
  rationale: దైవిక వివేచన, ఉద్దేశం, యోచన అనే భావవ్యాప్తిని ఉంచే సాధారణ తెలుగు పదం; ‘యోచన’ కూడా సాధ్యమే.
- source_word: בְּלִי דָעַת
  choice: జ్ఞానం లేకుండా
  rationale: హీబ్రూ పదబంధానికి సన్నిహితమైన, స్పష్టమైన అనువాదం.
- source_word: לָכֵן
  choice: అందుచేత
  rationale: దైవిక గద్దింపునకు యోబు ఒప్పుకోలు అనుసంధానమవుతున్న తార్కిక సంబంధాన్ని చూపుతుంది.
- source_word: הִגַּדְתִּי
  choice: నేను మాట్లాడాను
  rationale: యోబు తన మునుపటి మాటలను ఒప్పుకుంటున్న సందర్భానికి సహజంగా, అతిశయోక్తి లేకుండా సరిపోతుంది.
- source_word: וְלֹא אָבִין
  choice: కాని గ్రహించలేదు
  rationale: మాట్లాడటానికీ గ్రహించకపోవటానికీ మధ్య సందర్భసిద్ధమైన వ్యతిరేకతను తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; దానిని సంబంధవాచక ఉపవాక్యంగా మార్చదు.
- source_word: נִפְלָאוֹת
  choice: అద్భుతమైన సంగతులను
  rationale: మానవ అవగాహనను మించిన ఆశ్చర్యకరమైన విషయాల భావాన్ని కాపాడుతుంది.
- source_word: מִמֶּנִּי
  choice: నాకు అందనంత
  rationale: ఈ సందర్భంలోని ‘నన్ను మించిన/నా సామర్థ్యానికి అతీతమైన’ అనే ప్రయోగార్థాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: וְלֹא אֵדָע
  choice: నేను ఎరుగని సంగతులను
  rationale: చివరి పదబంధాన్ని ముందున్న ‘సంగతులు’తో సహజంగా కలుపుతూ, యోబు అజ్ఞానాన్ని స్పష్టంగా ఉంచుతుంది.
theological_decisions:
- issue: యోబు 42:3కు యోబు 38:2లోని దైవవాక్యంతో ఉన్న సంబంధం
  choice: 42:3లో నిజంగా ఉన్న పదాన్ని అనుసరించి ‘ఆలోచనను దాచిపెట్టే’ అని అనువదించడం
  alternative: ‘ఆలోచనను చీకటిపరచే’
  rationale: యోబు దేవుని మునుపటి గద్దింపును ఉటంకిస్తున్నట్లు లేదా అనుకరిస్తున్నట్లు కనిపించినా, 42:3లోని హీబ్రూ క్రియ 38:2లోనిదానికంటే భిన్నం. కాబట్టి రెండు వచనాలను నిశ్శబ్దంగా సమన్వయపరచకుండా ఇక్కడి మూలపాఠాన్ని అనుసరించి, సంప్రదాయ ప్రత్యామ్నాయాన్ని గమనికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘ఎరుగని’ అనే స్వల్పంగా ఉన్నతమైన పదం జ్ఞానం/అనుభవం లేమిని సంక్షిప్తంగా తెలియజేస్తుంది. మూలంలోని విరామాన్ని డాష్‌తో నిలిపి, చివరి రెండు వాక్యభాగాల భావసంబంధాన్ని స్పష్టంగా చేశాం.
