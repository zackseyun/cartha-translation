- from: “జ్ఞానం లేకుండా ఆలోచనను దాచిపెట్టే ఇతడెవడు?” అందుచేత నేను మాట్లాడాను, కాని గ్రహించలేదు—నాకు అందనంత అద్భుతమైన సంగతులను[b], నేను ఎరుగని సంగతులను.[a]
