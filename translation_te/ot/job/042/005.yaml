  text: I had heard of you by the hearing of the ear[a], but now my eye has seen you.
translation:
  language: te
  text: వినికిడి ద్వారా నేను నీ గురించి విన్నాను[a]; కానీ ఇప్పుడు నా కన్ను నిన్ను చూసింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘విన్న మాటల ద్వారా’; హీబ్రూలో పదశః, ‘చెవి వినికిడి ద్వారా.’
    reason: lexical_alternative
lexical_decisions:
- source_word: לְשֵׁמַע אֹזֶן
  choice: చెవి విని మాత్రమే
  rationale: ‘వినికిడి’ మరియు ‘చెవి’ కలిసిన హీబ్రూ నుడికారాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తూ, పరోక్షంగా విన్నదానికీ ప్రత్యక్షంగా చూసినదానికీ ఉన్న వ్యత్యాసాన్ని నిలుపుతుంది. ‘మాత్రమే’ మూలంలోని పరిమిత పరోక్ష జ్ఞాన భావాన్ని సందర్భానుసారంగా స్పష్టం చేస్తుంది.
- source_word: שְׁמַעְתִּיךָ
  choice: నీ గురించి విన్నాను
  rationale: పదశః ‘నిన్ను విన్నాను’ అయినప్పటికీ, ఇక్కడ దేవుని గురించి ఇతరుల ద్వారా తెలుసుకున్న భావం ఉంది; తెలుగులో ‘నీ గురించి విన్నాను’ సహజంగా అదే భావాన్ని అందిస్తుంది.
- source_word: וְעַתָּה
  choice: కానీ ఇప్పుడు
  rationale: మునుపటి పరోక్ష వినికిడికీ ప్రస్తుత ప్రత్యక్ష దర్శనానికీ మధ్య బలమైన వ్యత్యాసాన్ని సంధానం వ్యక్తపరుస్తుంది.
- source_word: עֵינִי
  choice: నా కన్ను
  rationale: హీబ్రూలోని ఏకవచనాన్ని నిలిపి, కవితాత్మక అభివ్యక్తినీ యోబు అనుభవంలోని వ్యక్తిగత తక్షణతనూ కాపాడుతుంది.
- source_word: רָאָתְךָ
  choice: నిన్ను చూసింది
  rationale: పూర్తయిన దర్శనాన్ని సూటిగా తెలియజేస్తుంది. తెలుగు సందర్భంలో భూతకాల రూపం ప్రస్తుత ఫలితమున్న అనుభవాన్ని సహజంగా మోస్తుంది.
theological_decisions:
- issue: యోబు దేవుణ్ణి ‘చూడడం’ యొక్క స్వభావం
  choice: ‘నిన్ను చూసింది’ అని ఎలాంటి వివరణాత్మక పరిమితి లేకుండా సూటిగా అనువదించడం
  alternative: ‘నిన్ను గ్రహించింది’ లేదా ‘నిన్ను ప్రత్యక్షంగా అనుభవించింది’
  rationale: హీబ్రూ ‘చూచు’ అనే క్రియనే వాడుతుంది. అది అక్షరార్థ దర్శనమా, ఆత్మీయ గ్రహింపా అనే ఉద్వేగాన్ని వచనం స్వయంగా పరిష్కరించదు; కాబట్టి అనువాదం కూడా దానిని ముందుగానే నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సహజంగా ఉండేలా, అయితే కవితాత్మక ఏకవచనమైన ‘నా కన్ను’ను నిలిపి గౌరవప్రదమైన శైలిని పాటించాం.
