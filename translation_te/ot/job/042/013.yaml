translation:
  language: te
  text: అతనికి ఏడుగురు కుమారులూ ముగ్గురు కుమార్తెలూ కూడా కలిగారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי לוֹ
  choice: అతనికి ... కలిగారు
  rationale: హీబ్రూ అస్తిత్వ-స్వామ్య నుడికారం అక్షరార్థంగా ‘అతనికి ఉన్నారు’ అనే భావాన్ని ఇస్తుంది. వ్యక్తులను సూచిస్తున్నందున ఆధునిక సహజ తెలుగులో ‘అతనికి ... కలిగారు’ అని గౌరవబహువచన క్రియతో వ్యక్తం చేశాం.
- source_word: שִׁבְעָנָה
  choice: ఏడుగురు
  rationale: పురుష వ్యక్తులను లెక్కించడానికి సహజమైన తెలుగు సంఖ్యారూపాన్ని వాడాం.
- source_word: בָנִים
  choice: కుమారులు
  rationale: మూలపదం మగ సంతానాన్ని ప్రత్యేకంగా సూచిస్తుంది; అందువల్ల లింగనిర్దిష్ట భావాన్ని నిలిపాం.
- source_word: וְשָׁלוֹשׁ
  choice: ముగ్గురు
  rationale: స్త్రీ వ్యక్తులను లెక్కించడానికి సహజమైన తెలుగు సంఖ్యారూపాన్ని వాడాం; ‘మరియు’ భావం కామాతో సహజంగా వ్యక్తమవుతుంది.
- source_word: בָּנוֹת
  choice: కుమార్తెలు
  rationale: మూలపదం ఆడ సంతానాన్ని ప్రత్యేకంగా సూచిస్తుంది; సందర్భానికి తగిన ప్రామాణిక పదాన్ని ఎంచుకున్నాం.
- source_word: וַ
  choice: కూడా
  rationale: వావ్ కథన కొనసాగింపును సూచిస్తుంది. ముందటి పునరుద్ధరణ వాక్యాలకు అనుసంధానంగా తెలుగులో ‘కూడా’ సహజంగా ఉంటుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు స్పష్టంగా ఉండేలా, అయితే వచన గౌరవాన్ని నిలిపే సంక్షిప్త కథన శైలి. మూలంలోని సంఖ్యలు, సంతాన లింగనిర్దిష్టత యథాతథంగా నిలిపాం.
