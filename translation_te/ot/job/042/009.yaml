base_translation:
  language: en
  yaml_path: translation/ot/job/042/009.yaml
  text: So Eliphaz the Temanite[a], Bildad the Shuhite, and Zophar the Naamathite went and did as Yahweh had spoken to them, and Yahweh accepted Job.
translation:
  language: te
  text: అప్పుడు తేమానీయుడైన ఎలీఫజు, షూహీయుడైన బిల్దదు, నయమాతీయుడైన జోఫరు వెళ్లి, యాహ్వే తమతో చెప్పినట్టే చేశారు. యాహ్వే యోబును అంగీకరించాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ అక్షరార్థం: “యాహ్వే యోబు ముఖాన్ని పైకెత్తాడు.” ఇది ఒకరిపట్ల అనుగ్రహం చూపడం లేదా వారిని అంగీకరించడం అనే నుడికారం.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: వెళ్లి
  rationale: הלך క్రియ కథనంలోని తదుపరి చర్యను సాధారణంగా తెలియజేస్తుంది. తరువాతి క్రియతో సహజంగా అనుసంధానించేందుకు ‘వెళ్లి’ అని అనువదించాం.
- source_word: הַתֵּימָנִי / הַשּׁוּחִי / הַנַּעֲמָתִי
  choice: తేమానీయుడైన / షూహీయుడైన / నయమాతీయుడైన
  rationale: ఇవి స్థలం లేదా వంశంతో వ్యక్తులను గుర్తించే హీబ్రూ విశేషణరూపాలు. తెలుగులో వ్యక్తిపేర్లతో సహజంగా కలిసే విధంగా ‘-యుడైన’ రూపాన్ని వాడాం.
- source_word: וַיַּעֲשׂוּ כַּאֲשֶׁר
  choice: చెప్పినట్టే చేశారు
  rationale: עשה మరియు כאשר కలయిక ‘చెప్పిన ప్రకారమే చేయడం’ అనే విస్తృత అర్థాన్ని ఇస్తుంది; చర్యను అవసరానికి మించి నిర్దిష్టం చేయకుండా సహజ తెలుగులో అందించాం.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హీబ్రూ చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా వ్యక్తిగత నామంగా లిప్యంతరీకరించాం.
- source_word: וַיִּשָּׂא יְהוָה אֶת־פְּנֵי אִיּוֹב
  choice: యాహ్వే యోబును అంగీకరించాడు
  rationale: נשׂא פנים అనే నుడికారం ఇక్కడ అనుగ్రహంగా స్వీకరించడం లేదా అంగీకరించడం అనే భావాన్ని ఇస్తుంది. తెలుగులో స్పష్టంగా ఉండేందుకు నుడికారార్థాన్ని ప్రధాన పాఠ్యంలో ఇచ్చి, అక్షరార్థ చిత్రాన్ని పాదటిప్పణిలో ఉంచాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: యెహోవా / ప్రభువు
  rationale: మూలపాఠ్యంలో వ్యక్తిగత దైవనామమే ఉన్నందున దానిని బిరుదుగా మార్చకుండా ‘యాహ్వే’గా లిప్యంతరీకరించాం.
- issue: యోబు పట్ల దైవానుగ్రహాన్ని తెలిపే నుడికారం
  choice: యాహ్వే యోబును అంగీకరించాడు
  alternative: యాహ్వే యోబుపట్ల అనుగ్రహం చూపించాడు / యాహ్వే యోబు ముఖాన్ని పైకెత్తాడు
  rationale: సందర్భంలో యోబు మరియు అతని మధ్యవర్తిత్వం అనుకూలంగా స్వీకరించబడిన భావం ఉంది. ‘అంగీకరించాడు’ ఆ భావాన్ని తెలియజేస్తూనే, దాని పరిధిని అదనపు సిద్ధాంత వివరణతో పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలిని అనుసరించాం. వ్యక్తుల ప్రాంతీయ లేదా వంశీయ గుర్తింపులను సంప్రదాయ బైబిలు పేర్లకు దగ్గరగా ఉంచాం; అరుదైన హీబ్రూ నుడికారాన్ని ప్రధాన పాఠ్యంలో అర్థానువాదంగా, పాదటిప్పణిలో అక్షరార్థంగా ఇచ్చాం.
