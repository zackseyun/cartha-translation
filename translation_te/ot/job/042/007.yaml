source:
  edition: WLC
  text: וַ/יְהִ֗י אַחַ֨ר דִּבֶּ֧ר יְהוָ֛ה אֶת הַ/דְּבָרִ֥ים הָ/אֵ֖לֶּה אֶל אִיּ֑וֹב וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל אֱלִיפַ֣ז הַ/תֵּֽימָנִ֗י חָרָ֨ה אַפִּ֤/י בְ/ךָ֙ וּ/בִ/שְׁנֵ֣י רֵעֶ֔י/ךָ כִּ֠י לֹ֣א דִבַּרְתֶּ֥ם אֵלַ֛/י נְכוֹנָ֖ה כְּ/עַבְדִּ֥/י אִיּֽוֹב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/042/007.yaml
  text: And it happened[a], after Yahweh had spoken these words to Job, that Yahweh said to Eliphaz the Temanite, “My anger burns against you and against your two friends, because you have not spoken rightly of me, as my servant Job has.”
translation:
  language: te
  text: 'యెహోవా యోబుతో ఈ మాటలు చెప్పిన తరువాత, యెహోవా తేమానీయుడైన ఎలీఫజుతో ఇలా అన్నాడు: “నీ మీదా నీ ఇద్దరు స్నేహితుల మీదా నా కోపం రగులుతోంది. ఎందుకంటే నా సేవకుడైన యోబు మాట్లాడినట్లు మీరు నా గురించి[a] సరిగా మాట్లాడలేదు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నా సేవకుడైన యోబు మాట్లాడినట్లు మీరు నాతో సరైనది మాట్లాడలేదు.” హీబ్రూ ఉపసర్గ అక్షరార్థంగా “నాకు/నా వైపు” అని ఉంటుంది; సందర్భంలో అది “నా గురించి” అనే భావాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַחַר
  choice: చెప్పిన తరువాత
  rationale: హీబ్రూ కథన సంధిని తెలుగులో అసహజమైన పదానువాదం లేకుండా సహజమైన కాలసంబంధ వాక్యంగా అందిస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామంలోని నాలుగు హీబ్రూ వ్యంజనాలకు తెలుగులో విస్తృతంగా పరిచితమైన ప్రత్యేక నామరూపాన్ని ఉపయోగిస్తుంది.
- source_word: אֱלִיפַז הַתֵּימָנִי
  choice: తేమానీయుడైన ఎలీఫజు
  rationale: వ్యక్తి పేరునూ అతని ప్రాంతీయ గుర్తింపునూ సహజమైన తెలుగు క్రమంలో నిలుపుతుంది.
- source_word: חָרָה אַפִּי
  choice: నా కోపం రగులుతోంది
  rationale: కోపం మండడం అనే హీబ్రూ రూపకంలోని తీవ్రతను సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: בְךָ וּבִשְׁנֵי רֵעֶיךָ
  choice: నీ మీదా నీ ఇద్దరు స్నేహితుల మీదా
  rationale: కోపం ఎవరికి విరోధంగా ఉందో స్పష్టంగా చూపిస్తూ, రెండు పదబంధాలకూ సమాన బలాన్ని ఇస్తుంది.
- source_word: אֵלַי
  choice: నా గురించి
  rationale: ఉపసర్గ అక్షరార్థంగా ‘నా వైపు/నాతో’ అయినప్పటికీ, సందర్భంలో దేవుని గురించిన వారి మాటల విషయవస్తువే పరిశీలనలో ఉంది; సందిగ్ధతను పాదటిప్పణిలో నిలిపాం.
- source_word: נְכוֹנָה
  choice: సరిగా
  rationale: ఈ పదంలోని సరైనది, యథార్థమైనది, తగినది అనే విస్తృత భావాన్ని ఒక్క నిర్దిష్ట సిద్ధాంతార్థానికి పరిమితం చేయదు.
- source_word: כְּעַבְדִּי אִיּוֹב
  choice: నా సేవకుడైన యోబు మాట్లాడినట్లు
  rationale: ‘నా సేవకుడు’ అనే ముఖ్యమైన దైవీయ సంబోధనను, యోబుతో చేసిన పోలికను రెండింటినీ నిలుపుతుంది.
theological_decisions:
- issue: אֵלַי అనే ఉపసర్గను ‘నాతో’ అని అక్షరార్థంగా ఇవ్వాలా, ‘నా గురించి’ అని సందర్భానుసారంగా ఇవ్వాలా
  choice: నా గురించి
  alternative: నాతో
  rationale: సంభాషణల్లో దేవుని గురించి స్నేహితులు చేసిన వాదనల విషయవస్తువును దేవుడు తీర్పు చేస్తున్న సందర్భానికి ‘నా గురించి’ సరిపోతుంది. అయితే హీబ్రూ రూపం ‘నాతో/నా వైపు’ అనే అర్థానికీ వీలు కల్పించేందున దానిని పాదటిప్పణిలో ఉంచాం.
- issue: נְכוֹנָה ద్వారా సూచించబడిన తీర్పు స్వభావం
  choice: సరిగా
  alternative: సరైనదాన్ని
  rationale: ఇది కేవలం వాస్తవ ఖచ్చితత్వమా, నైతిక సముచితతా, లేక దైవశాస్త్రీయ యథార్థతా అని అనవసరంగా సంకుచితం చేయకుండా మూలంలోని భావ విస్తృతిని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. ‘నా కోపం రగులుతోంది’ అనే రూపం మూలంలోని సజీవ రూపకాన్ని నిలుపుతుంది; అతి ప్రాచీన లేదా మతశాఖాపరమైన పదజాలాన్ని నివారించాం.
