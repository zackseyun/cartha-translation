  text: וַ/יָּבֹ֣אוּ אֵ֠לָי/ו כָּל אֶחָ֨י/ו וְ/כָל אחיתי/ו וְ/כָל יֹדְעָ֣י/ו לְ/פָנִ֗ים וַ/יֹּאכְל֨וּ עִמּ֣/וֹ לֶחֶם֮ בְּ/בֵית/וֹ֒ וַ/יָּנֻ֤דוּ ל/וֹ֙ וַ/יְנַחֲמ֣וּ אֹת֔/וֹ עַ֚ל כָּל הָ֣/רָעָ֔ה אֲשֶׁר הֵבִ֥יא יְהוָ֖ה עָלָ֑י/ו וַ/יִּתְּנוּ ל֗/וֹ אִ֚ישׁ קְשִׂיטָ֣ה אֶחָ֔ת וְ/אִ֕ישׁ נֶ֥זֶם זָהָ֖ב אֶחָֽד־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/job/042/011.yaml
  text: Then all his brothers[a], all his sisters, and all who had known him before came to him, and they ate bread with him in his house. They showed him sympathy and comforted him for all the calamity that Yahweh had brought upon him[d][c][b]. And each one gave him one qesitah and one gold ring.
translation:
  language: te
  text: అప్పుడు అతని సహోదరులందరూ, సహోదరీలందరూ, అంతకు ముందు అతనికి పరిచయమున్న వారందరూ అతని దగ్గరికి వచ్చారు. వారు అతని ఇంట్లో అతనితో కలిసి భోజనం చేశారు.[a] యాహ్వే అతని మీదికి రప్పించిన ఆ విపత్తంతటినిగూర్చి వారు అతనిపట్ల సానుభూతి చూపించి, అతన్ని ఓదార్చారు. వారిలో ఒక్కొక్కరు అతనికి ఒక్క కెసీటా[b], ఒక్క బంగారు ఉంగరం[c] ఇచ్చారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూలభాషలో, ‘అతనితో కలిసి రొట్టె తిన్నారు’; ఇది కలిసి భోజనం చేయడాన్ని సూచించే సాధారణ ప్రయోగం.
    reason: cultural_note
  - marker: b
    text: ‘కెసీటా’ అనేది ప్రాచీనకాలంలో విలువగల వస్తువు లేదా విలువ కొలమానం. దానికి సమానమైన నేటి విలువ ఏమిటో ఖచ్చితంగా తెలియదు.
    reason: cultural_note
  - marker: c
    text: ఈ మూలభాషా పదం ముక్కుకు లేదా చెవికి ధరించే ఉంగరాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ אֵלָיו
  choice: అతని దగ్గరికి వచ్చారు
  rationale: בוא with אֶל indicates movement toward Job; this is natural modern Telugu narrative wording.
- source_word: כָּל אֶחָיו וְכָל אֲחִיתָיו
  choice: అతని సహోదరులందరూ, సహోదరీలందరూ
  rationale: The repeated כָּל and the separate masculine and feminine kinship terms are retained.
- source_word: וְכָל יֹדְעָיו לְפָנִים
  choice: అంతకు ముందు అతనికి పరిచయమున్న వారందరూ
  rationale: יֹדְעָיו denotes people who knew Job, while לְפָנִים marks an earlier time. The Telugu preserves that temporal qualification without forcing a break in the relationship.
- source_word: וַיֹּאכְלוּ עִמּוֹ לֶחֶם בְּבֵיתוֹ
  choice: వారు అతని ఇంట్లో అతనితో కలిసి భోజనం చేశారు
  rationale: The Hebrew literally says ‘ate bread with him,’ a conventional expression for sharing a meal. The main text uses the natural Telugu idiom, with the concrete Hebrew wording noted in a footnote.
- source_word: וַיָּנֻדוּ לוֹ
  choice: వారు అతనిపట్ల సానుభూతి చూపించి
  rationale: In this consolatory setting נוד describes an expression or gesture of sympathy, not mockery.
- source_word: וַיְנַחֲמוּ אֹתוֹ
  choice: అతన్ని ఓదార్చారు
  rationale: A direct, current Telugu equivalent for consoling someone in distress.
- source_word: עַל כָּל הָרָעָה
  choice: విపత్తంతటి విషయమై
  rationale: Here רָעָה refers to experienced calamity or disaster rather than moral evil.
- source_word: אֲשֶׁר הֵבִיא יְהוָה עָלָיו
  choice: యెహోవా అతని మీదికి రప్పించిన
  rationale: The causative force of הֵבִיא and the explicit divine agency are preserved rather than softened.
- source_word: קְשִׂיטָה
  choice: కెసీటా
  rationale: The precise value and physical nature of this ancient item are uncertain, so transliteration avoids a misleading modern monetary equivalent.
- source_word: נֶזֶם זָהָב
  choice: బంగారు పోగు
  rationale: נֶזֶם is a gold ring ornament that may be worn in the nose or ear. ‘పోగు’ is concise in the main text, while a footnote preserves the lexical range.
theological_decisions:
- issue: యోబు అనుభవించిన విపత్తులో యెహోవా క్రియాశీలత
  choice: యెహోవా అతని మీదికి రప్పించిన
  alternative: యెహోవా అతని మీదికి రావడానికి అనుమతించిన
  rationale: The Hebrew explicitly says that Yahweh ‘brought’ the calamity upon Job. The translation retains this difficult theological attribution and does not replace it with mere permission.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘సహోదరులు/సహోదరీలు’ మూలంలోని వేర్వేరు బంధుత్వ పదాలను నిలుపుతాయి. దైవనామం ‘యెహోవా’గా ఇచ్చి, విపత్తును ఆయన రప్పించాడనే మూలపాఠంలోని theological tensionను తగ్గించలేదు.
