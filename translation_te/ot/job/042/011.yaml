  terminology: Use “యాహ్వే” for יהוה, in line with the supplied English POB audit trail. Retain the transliterated “కెసీటా” because the exact nature/value of קְשִׂיטָה is uncertain. Render נֶזֶם generically as “ఉంగరం,” with the lexical-range note.
