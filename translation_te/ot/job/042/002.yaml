id: JOB.42.2
reference: Job 42:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: ידעת כִּי כֹ֣ל תּוּכָ֑ל וְ/לֹא יִבָּצֵ֖ר מִמְּ/ךָ֣ מְזִמָּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/042/002.yaml
  text: I know that you can do all things[a], and no purpose of yours can be thwarted.
translation:
  language: te
  text: నీవు సమస్తం చేయగలవని, నీ సంకల్పమేదీ అడ్డగించబడదని నాకు తెలుసు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీ ప్రణాళిక ఏదీ నిరోధించబడదు.” హీబ్రూ నామవాచకానికి “సంకల్పం” లేదా “ప్రణాళిక” అనే అర్థాలు ఉండవచ్చు; క్రియకు అడ్డగించడం, నిరోధించడం లేదా నెరవేరకుండా చేయడం అనే భావాలు ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ידעת
  choice: నాకు తెలుసు
  rationale: ידע అనే క్రియ యొక్క Qal perfect 2ms రూపం దేవుణ్ణి ఉద్దేశించి పలికినది. ఇక్కడ యోబు ప్రస్తుత అంగీకారాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేయడానికి ‘నాకు తెలుసు’ అని అనువదించాం.
- source_word: כִּי
  choice: అని
  rationale: యోబుకు తెలిసిన విషయాన్ని పరిచయం చేసే పూరక అవ్యయంగా ఇక్కడ ‘అని’ సహజంగా సరిపోతుంది.
- source_word: כֹל
  choice: సమస్తం
  rationale: תוכל తో కలిసి దేవుని సంపూర్ణ సామర్థ్యాన్ని సూచిస్తుంది. ‘సమస్తం’ మూలంలోని విస్తృతిని సంక్షిప్తంగా, గౌరవప్రదంగా కాపాడుతుంది.
- source_word: תּוּכָל
  choice: చేయగలవు
  rationale: יכל అంటే ‘సామర్థ్యం కలిగి ఉండు’. כֹל తో ఉన్నప్పుడు తెలుగులో ‘సమస్తం చేయగలవు’ అనడం భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וְלֹא
  choice: ఏదీ ... కాదు
  rationale: రెండవ వాక్యభాగాన్ని మొదటిదానితో కలిపి సంపూర్ణ నిరాకరణను తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: יִבָּצֵר
  choice: అడ్డగించబడదు
  rationale: בצר యొక్క Niphal రూపం ఈ నిర్మాణంలో నిలిపివేయడం, నిరోధించడం లేదా నెరవేరకుండా చేయడం అనే భావాన్ని ఇస్తుంది. ‘అడ్డగించబడదు’ దైవ సంకల్పాన్ని నిరోధించలేమనే సందర్భార్థాన్ని వ్యక్తం చేస్తుంది.
- source_word: מִמְּךָ
  choice: నీ
  rationale: మూలంలో అక్షరార్థంగా ‘నీ నుండి’ అనే సంబంధం ఉన్నా, מְזִמָּה తో కలిసి అది దేవునికి చెందిన సంకల్పాన్ని సూచిస్తుంది; తెలుగులో స్వామ్యార్థకమైన ‘నీ’ సహజం.
- source_word: מְזִמָּה
  choice: సంకల్పం
  rationale: ఈ నామవాచకానికి ప్రణాళిక, ఉద్దేశం, సంకల్పం వంటి అర్థాలు ఉన్నాయి. దేవుని విషయంగా ఇక్కడ ‘సంకల్పం’ ఉద్దేశపూర్వకతను, గంభీరతను తెలియజేస్తూ ప్రతికూల ఛాయను నివారిస్తుంది.
theological_decisions:
- issue: దేవుని సమగ్ర సామర్థ్యాన్ని, ఆయన సంకల్పం నిరోధింపబడదనే వాక్యాన్ని అనువదించడం
  choice: నీవు సమస్తం చేయగలవని, నీ సంకల్పమేదీ అడ్డగించబడదని నాకు తెలుసు.
  alternative: నీవు సమస్తం చేయగలవని, నీ ప్రణాళిక ఏదీ నిరోధించబడదని నాకు తెలుసు.
  rationale: ఈ అనువాదం దేవుని సామర్థ్యాన్నీ ఆయన ఉద్దేశం విఫలం చేయబడదనే మూలపాఠ భావాన్నీ అదనపు సిద్ధాంత వివరణ లేకుండా కాపాడుతుంది. ‘సంకల్పం’ మరియు ‘అడ్డగించబడదు’ మְזִמָּה, יִבָּצֵר పదాల భావపరిధిని సందర్భానుసారంగా తెలియజేస్తాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, అయినా గౌరవప్రదమైన బైబిలు శైలిని నిలిపాం. ‘నీవు’ అనే ఏకవచన సంబోధన మూలంలోని 2ms రూపాన్ని కాపాడుతుంది; కృత్రిమంగా పాతబడిన పదప్రయోగాలను నివారించాం.
