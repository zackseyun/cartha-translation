  text: He named the first Jemimah[a], the second Keziah, and the third Keren-happuch.
translation:
  language: te
  text: మొదటిదానికి యెమీమా అని, రెండోదానికి కెజీయా అని, మూడోదానికి కెరెన్-హప్పూకు[a] అని అతడు పేరు పెట్టాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “కెరెన్-హప్పూకు” అనే పేరుకు బహుశా “కాటుక కొమ్ము” లేదా “కంటికి వేసే రంగును ఉంచే కొమ్ము పాత్ర” అని అర్థం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא שֵׁם
  choice: పేరు పెట్టాడు
  rationale: హీబ్రూ పదబంధం అక్షరార్థంగా ‘పేరు పిలిచాడు’ అన్నట్టున్నా, ఒకరికి పేరు ఇవ్వడాన్ని ఆధునిక తెలుగులో సహజంగా ‘పేరు పెట్టాడు’ అని చెబుతారు.
- source_word: הָאַחַת / הַשֵּׁנִית / הַשְּׁלִישִׁית
  choice: మొదటిదానికి / రెండోదానికి / మూడోదానికి
  rationale: స్త్రీలింగ క్రమసంఖ్యలతో కుమార్తెలను వరుసగా సూచిస్తున్న హీబ్రూ నిర్మాణాన్ని, సందర్భానికి తగిన సహజమైన తెలుగు రూపాల్లో అందించాం.
- source_word: יְמִימָה
  choice: యెమీమా
  rationale: వ్యక్తి పేరును దాని హీబ్రూ ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించాం.
- source_word: קְצִיעָה
  choice: కెజీయా
  rationale: వ్యక్తి పేరును అనువదించకుండా, హీబ్రూ రూపానికి దగ్గరగా మరియు తెలుగులో పలకడానికి సహజంగా లిప్యంతరీకరించాం.
- source_word: קֶרֶן הַפּוּךְ
  choice: కెరెన్-హప్పూకు
  rationale: సమాస స్వభావం కనిపించేలా మధ్యగీతతో వ్యక్తి పేరును లిప్యంతరీకరించాం; పేరులోని భావాన్ని పాదసూచికలో తెలిపాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడబడింది. హీబ్రూలోని స్త్రీలింగ క్రమసూచనను ‘మొదటిదానికి, రెండోదానికి, మూడోదానికి’ అనే రూపాలతో నిలిపి, సందర్భంలో ఇప్పటికే తెలిసిన ‘కుమార్తెలు’ అనే పదాన్ని అనవసరంగా పునరుక్తి చేయలేదు.
