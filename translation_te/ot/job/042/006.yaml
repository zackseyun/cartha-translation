source:
  edition: WLC
  text: עַל כֵּ֭ן אֶמְאַ֣ס וְ/נִחַ֑מְתִּי עַל עָפָ֥ר וָ/אֵֽפֶר־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/job/042/006.yaml
  text: Therefore I despise myself[a], and I repent in dust and ashes.
translation:
  language: te
  text: కాబట్టి నన్ను నేనే అసహ్యించుకుంటున్నాను[a]; ధూళిలోను బూడిదలోను పశ్చాత్తాపపడుతున్నాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కాబట్టి నేను వెనక్కి తీసుకుంటున్నాను; ధూళి బూడిదల విషయమై మనసు మార్చుకుంటున్నాను.” హీబ్రూ వాక్యం సంక్షిప్తమైనది; దాని అర్థంపై భిన్నాభిప్రాయాలున్నాయి. “అసహ్యించుకుంటున్నాను/తిరస్కరిస్తున్నాను” అనే క్రియకు కర్మ స్పష్టంగా లేదు; కొందరు దానిని యోబు తన మాటలను లేదా తన వాదనను వెనక్కి తీసుకోవడంగా అర్థం చేసుకుంటారు. తరువాతి క్రియకు “పశ్చాత్తాపపడుతున్నాను,” “మనసు మార్చుకుంటున్నాను,” లేదా “ఓదార్పు పొందుతున్నాను” అనే భావాలు రావచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: עַל כֵּן
  choice: కాబట్టి
  rationale: మునుపటి దేవుని మాటలు, యోబు పొందిన ప్రత్యక్ష జ్ఞానం ఆధారంగా వచ్చిన ముగింపును సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: אֶמְאַס
  choice: నన్ను నేనే అసహ్యించుకుంటున్నాను
  rationale: మָאַס్ క్రియకు ‘తిరస్కరించు/అసహ్యించుకో’ అనే అర్థాలున్నాయి; హీబ్రూలో కర్మ చెప్పబడలేదు. సందర్భాన్ని బట్టి ‘నన్ను నేనే’ అని పూరించడం సహజమైన ప్రధాన పఠనం, అయితే అది వ్యాఖ్యానాత్మకమైనందున ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: וְנִחַמְתִּי
  choice: పశ్చాత్తాపపడుతున్నాను
  rationale: నిఫాల్ రూపంలోని נחם సందర్భానుసారం పశ్చాత్తాపపడడం, వెనక్కి తగ్గడం, ఓదార్పు పొందడం అనే భావాలను ఇవ్వగలదు. దేవునితో యోబు ఎదుర్కొన్న అనుభవం నేపథ్యంలో పశ్చాత్తాప భావం ప్రధాన పాఠానికి తగినది; ఇతర సాధ్యార్థాలు పాదసూచికలో నిలుపబడ్డాయి.
- source_word: עַל
  choice: లోను…లోను
  rationale: అక్షరార్థంగా ‘మీద/గురించి’ కావచ్చు; ‘ధూళి బూడిదల్లో’ అనే దుఃఖదీన స్థితిని ఆధునిక తెలుగులో సహజంగా వ్యక్తపరచడానికి స్థానార్థక రూపం వాడబడింది.
- source_word: עָפָר וָאֵפֶר
  choice: ధూళిలోను బూడిదలోను
  rationale: ఈ జంట పదాలు మరణశీలత, దీనత్వం, దుఃఖాన్ని సూచిస్తాయి; తెలుగు బైబిలు శైలికి పరిచితమైనప్పటికీ సాధారణ పాఠకుడికి స్పష్టమైన రూపం.
theological_decisions:
- issue: 'యోబు చివరి స్పందన: తనను తాను తక్కువ చేసుకొని పశ్చాత్తాపపడడమా, లేక తన వాదనను వెనక్కి తీసుకోవడమా'
  choice: యోబు తనను తాను అసహ్యించుకొని ధూళి బూడిదల్లో పశ్చాత్తాపపడుతున్నాడనే పఠనం
  alternative: “కాబట్టి నేను నా మాటలను వెనక్కి తీసుకుంటున్నాను; ధూళి బూడిదల విషయమై నా వైఖరిని మార్చుకుంటున్నాను” అనే పఠనం
  rationale: 'హీబ్రూ వాక్యం అత్యంత సంక్షిప్తం: אֶמְאַסకు కర్మ లేదు; נִחַמְתִּיకు అనేక సందర్భార్థాలున్నాయి; עַל עָפָר וָאֵפֶרను స్థితిగా లేదా విషయంగా గ్రహించవచ్చు. 42:5లోని దేవదర్శన సందర్భం దీనత్వం, పశ్చాత్తాప పఠనానికి మద్దతిస్తుంది; అయినా ప్రత్యామ్నాయాన్ని తొలగించకుండా పాదసూచికలో నిలిపాం.'
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనా సాధారణ పాఠకుడికి అర్థమయ్యే శైలి. మూలంలోని సంక్షిప్తత వల్ల ఏర్పడిన సందిగ్ధతను ప్రధాన పాఠంలో బలవంతంగా పూర్తిగా పరిష్కరించకుండా, అవసరమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
