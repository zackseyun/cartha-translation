translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన శైలిని ఉపయోగించాం. హీబ్రూలోని పురుషలింగ బంధుత్వ పదాలను నిలుపుతూ, ‘నాలుగు తరాల వరకు’ అనే సహజ తెలుగు నిర్మాణంతో వంశపరంపర విస్తృతిని తెలిపాం.
