  yaml_path: translation/ot/job/042/016.yaml
  text: After this[a], Job lived one hundred and forty years, and saw his sons and his grandsons, four generations.
translation:
  language: te
  text: దీని తరువాత యోబు నూట నలభై సంవత్సరాలు జీవించాడు. అతడు తన కుమారులను, తన కుమారుల కుమారులను[a] నాలుగు తరాల వరకు చూశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అంటే, అతని మనవళ్లను. హీబ్రూ వాక్యం అక్షరార్థంగా “తన కుమారుల కుమారులను” అని ఉంది. మొత్తం వాక్యాన్ని మరింత భావసహజంగా “తన కుమారులను, మనవళ్లను చూసేంతకాలం జీవించాడు” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחִי
  choice: జీవించాడు
  rationale: חיה అనే క్రియ ఇక్కడ పునరుద్ధరణ తరువాత యోబు జీవితం కొనసాగిందని నేరుగా తెలియజేస్తుంది.
- source_word: אַחֲרֵי זֹאת
  choice: దీని తరువాత
  rationale: ముందు వివరించిన సంఘటనల తరువాతి కాలాన్ని సూచించే సహజమైన, మూలానికి దగ్గరైన తెలుగు ప్రయోగం.
- source_word: מֵאָה וְאַרְבָּעִים שָׁנָה
  choice: నూట నలభై సంవత్సరాలు
  rationale: హీబ్రూ సంఖ్యా వ్యక్తీకరణను స్పష్టంగా, సహజమైన తెలుగు రూపంలో అందిస్తుంది.
- source_word: וַיַּרְא
  choice: చూశాడు
  rationale: ראה అనే క్రియకు నేరమైన అర్థం ‘చూశాడు’; ‘చూసేంతకాలం జీవించాడు’ అనే అంతర్లీన భావాన్ని ప్రధాన పాఠ్యంలో అదనంగా విప్పలేదు.
- source_word: בָּנָיו
  choice: తన కుమారులను
  rationale: మూలంలో పురుషలింగ బహువచనమైన ‘కుమారులు’ ఉన్నందున దానిని నిర్దిష్టంగానే నిలుపుతుంది.
- source_word: בְּנֵי בָנָיו
  choice: తన కుమారుల కుమారులను
  rationale: అక్షరార్థంగా ‘అతని కుమారుల కుమారులు’; ‘మనవళ్లు’ కంటే హీబ్రూ నిర్మాణాన్నీ పురుషలింగ సూచననూ స్పష్టంగా కాపాడుతుంది.
- source_word: אַרְבָּעָה דֹּרוֹת
  choice: నాలుగు తరాల వరకు
  rationale: యోబు చూసిన వంశపరంపర విస్తృతిని సహజమైన తెలుగులో తెలియజేస్తుంది; ‘నాలుగు తరాలు’ అనే మూల భావాన్ని నిలుపుతుంది.
