source:
  edition: WLC
  text: וַֽ/יהוָ֗ה שָׁ֚ב אֶת שבית אִיּ֔וֹב בְּ/הִֽתְפַּֽלְל֖/וֹ בְּעַ֣ד רֵעֵ֑/הוּ וַ֧/יֹּסֶף יְהוָ֛ה אֶת כָּל אֲשֶׁ֥ר לְ/אִיּ֖וֹב לְ/מִשְׁנֶֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/042/010.yaml
  text: And Yahweh restored Job’s fortunes when he prayed for his friends[c][b][a], and Yahweh gave Job twice as much as he had before.
translation:
  language: te
  text: యోబు తన స్నేహితుల కొరకు ప్రార్థించినప్పుడు, యెహోవా యోబు పరిస్థితిని పునరుద్ధరించాడు[a]. యెహోవా యోబుకు ఇంతకుముందు ఉన్నదానికంటే రెండింతలు ఇచ్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘యోబు చెరస్థితిని మార్చాడు’ అని అనువదించవచ్చు. ఈ హీబ్రూ నుడికారం తప్పనిసరిగా నిజమైన బందిఖానా నుండి విడుదలను సూచించదు; ఒకరి పరిస్థితిని పునరుద్ధరించడం లేదా దుస్థితిని మార్చడాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామంలోని నాలుగు హల్లులకు తెలుగు బైబిలు వాడుకలో స్థిరపడిన, సాధారణ పాఠకులకు సుపరిచితమైన రూపం.
- source_word: שָׁב אֶת שבית
  choice: అతని స్థితిని మళ్లీ బాగుచేశాడు
  rationale: ఈ హీబ్రూ నుడికారం ఇక్కడ అక్షరార్థ బందిఖానా నుంచి విడుదలను కాక, యోబు పరిస్థితిని పునరుద్ధరించడాన్ని సూచిస్తుంది. సహజమైన ఆధునిక తెలుగులో భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: בְּהִתְפַּלְלוֹ
  choice: ప్రార్థించినప్పుడు
  rationale: בְּ + క్రియార్థక నామరూపం కాలసంబంధ పరిస్థితిని సూచిస్తుంది. కారణార్థాన్ని అవసరానికి మించి బలపరచకుండా ఆ సంబంధాన్ని నిలుపుతుంది.
- source_word: בְּעַד רֵעֵהוּ
  choice: తన స్నేహితుల పక్షంగా
  rationale: בְּעַד మధ్యవర్తిత్వ భావంలో ‘పక్షంగా/కొరకు’ అని అర్థం; ఏకవచన సమూహప్రయోగమైన רֵעֵהוּ సందర్భంలో యోబు స్నేహితులను సూచిస్తుంది.
- source_word: וַיֹּסֶף ... לְמִשְׁנֶה
  choice: రెండింతలు ఇచ్చాడు
  rationale: ‘చేర్చాడు’ అనే మూలభావాన్ని సహజ తెలుగులో ఫలితార్థంగా వ్యక్తం చేస్తూ, לְמִשְׁנֶה సూచించే ద్విగుణ పరిమాణాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: אֶת כָּל אֲשֶׁר לְאִיּוֹב
  choice: యోబుకు ఇంతకుముందు ఉన్నదంతా
  rationale: యోబు కోల్పోవడానికి ముందు అతనికి చెందిన సమస్తాన్ని సందర్భానుసారంగా, సహజంగా సూచిస్తుంది.
theological_decisions:
- issue: యోబు ప్రార్థనకు యెహోవా చేసిన పునరుద్ధరణకు మధ్య సంబంధం
  choice: ‘ప్రార్థించినప్పుడు’ అనే కాలసంబంధ అనువాదం
  alternative: ‘ప్రార్థించినందువల్ల’ అనే కారణార్థ అనువాదం
  rationale: హీబ్రూ నిర్మాణం కాలాన్ని లేదా అనుబంధ పరిస్థితిని సూచించగలదు. ప్రార్థనకు పునరుద్ధరణకు ఉన్న సంబంధాన్ని నిలుపుతూ, యాంత్రిక ప్రతిఫల సిద్ధాంతాన్ని పాఠ్యంలోకి చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్యనిర్మాణం. ‘యెహోవా’ అనే రూపం తెలుగు బైబిలు సంప్రదాయంలో సుపరిచితం. మూలంలోని రెండు సమన్విత వాక్యభాగాలను తెలుగులో స్పష్టత కోసం రెండు వాక్యాలుగా ఇచ్చాం.
