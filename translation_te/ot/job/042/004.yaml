source:
  edition: WLC
  text: שְֽׁמַֽע נָ֭א וְ/אָנֹכִ֣י אֲדַבֵּ֑ר אֶ֝שְׁאָלְ/ךָ֗ וְ/הוֹדִיעֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/042/004.yaml
  text: Hear[a], please, and I will speak; I will ask you[b], and you declare to me.
translation:
  language: te
  text: దయచేసి విను[a], నేను మాట్లాడతాను; నేను నిన్ను అడుగుతాను, నీవు నాకు తెలియజేయి[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ యోబు, యోబు 38:3; 40:7లో యెహోవా ఇంతకుముందు పలికిన మాటలను దాదాపు యథాతథంగా ప్రతిధ్వనిస్తున్నాడు.
    reason: cross_reference
  - marker: b
    text: అక్షరార్థంగా, ‘నేను తెలుసుకునేలా చేయి.’ ‘నాకు ప్రకటించు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמַע
  choice: విను
  rationale: שׁמע యొక్క ఏకవచన ఆజ్ఞార్థాన్ని నేరుగా, ఆధునిక తెలుగులో సహజంగా వ్యక్తపరుస్తుంది; సందర్భంలోని గంభీరమైన ప్రత్యక్ష సంబోధనను నిలుపుతుంది.
- source_word: נָא
  choice: దయచేసి
  rationale: విన్నపం లేదా మర్యాదను సూచించే నָאకు ఆధునిక తెలుగులో స్పష్టమైన, సహజమైన సమానం.
- source_word: וְאָנֹכִי אֲדַבֵּר
  choice: నేను మాట్లాడతాను
  rationale: స్వతంత్ర సర్వనామం ఇచ్చే స్వల్ప ఉద్ఘాటనను ‘నేను’ నిలుపుతుంది; క్రియను భవిష్యదర్థకంగా సహజంగా అందిస్తుంది.
- source_word: אֶשְׁאָלְךָ
  choice: నేను నిన్ను అడుగుతాను
  rationale: שאל యొక్క ప్రాథమిక అర్థాన్ని కాపాడుతుంది; ‘ప్రశ్నిస్తాను’ కంటే తక్కువ వ్యాఖ్యానాత్మకంగా ఉండి, తరువాతి ఆజ్ఞతో ఉన్న సమాంతరతను నిలుపుతుంది.
- source_word: וְהוֹדִיעֵנִי
  choice: నీవు నాకు తెలియజేయి
  rationale: ידע హిఫీల్ ఆజ్ఞార్థంలోని ‘నేను తెలుసుకునేలా చేయి’ అనే కారణార్థక భావాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది; ‘నాకు జవాబివ్వు’ అని అర్థాన్ని సంకుచితం చేయదు.
theological_decisions:
- issue: ఈ వాక్యానికి యోబు 38:3; 40:7తో ఉన్న సంబంధం
  choice: యెహోవా ఇంతకుముందు పలికిన సవాలును యోబు ప్రతిధ్వనిస్తున్నట్లుగా పాఠాన్ని నేరుగా అనువదించి, ప్రధాన పాఠంలో ‘నీవు అన్నావు’ వంటి మాటలు చేర్చలేదు.
  alternative: ఉద్ధరణ చిహ్నాలు పెట్టడం లేదా ‘నీవు ఇలా అన్నావు’ అనే పరిచయ వాక్యాన్ని చేర్చడం.
  rationale: హీబ్రూ పాఠంలో పరిచయ పదాలు లేవు. ప్రతిధ్వనిని పాదటిప్పణిలో సూచించడం ద్వారా మూలంలోని సంక్షిప్తతను, సందర్భంలోని దైవ–మానవ ఉద్రిక్తతను రెండింటినీ కాపాడవచ్చు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరమైన ప్రత్యక్ష సంబోధన వాడబడింది. మూలంలోని రెండవ పురుష ఏకవచన రూపాలను గౌరవ బహువచనంగా మార్చకుండా ‘విను,’ ‘నీవు,’ ‘తెలియజేయి’గా నిలిపాం. వాక్యంలోని రెండు భాగాల సమాంతర నిర్మాణాన్ని అర్ధవిరామంతో స్పష్టంచేశాం.
