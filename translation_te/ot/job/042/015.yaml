source:
  edition: WLC
  text: וְ/לֹ֨א נִמְצָ֜א נָשִׁ֥ים יָפ֛וֹת כִּ/בְנ֥וֹת אִיּ֖וֹב בְּ/כָל הָ/אָ֑רֶץ וַ/יִּתֵּ֨ן לָ/הֶ֧ם אֲבִי/הֶ֛ם נַחֲלָ֖ה בְּ/ת֥וֹךְ אֲחֵי/הֶֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/job/042/015.yaml
  text: And nowhere in all the land were women found as beautiful as Job’s daughters[a], and their father gave them an inheritance among their brothers.
translation:
  language: te
  text: దేశమంతటిలో[a] యోబు కుమార్తెలంత అందమైన స్త్రీలు ఎక్కడా కనిపించలేదు. వారి తండ్రి వారి సోదరులతో పాటు వారికి వారసత్వం ఇచ్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “భూమంతటిలో.”
    reason: lexical_alternative
lexical_decisions:
- source_word: נִמְצָא
  choice: కనిపించలేదు
  rationale: מצא యొక్క నిఫాల్ రూపం ఇక్కడ ఉనికి లేదా కనుగొనబడడాన్ని సూచిస్తుంది. నిషేధంతో కలిసి ‘ఎక్కడా కనిపించలేదు’ అనేది సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: נָשִׁים יָפוֹת
  choice: అందమైన స్త్రీలు
  rationale: נָשִׁים అంటే ఇక్కడ ‘స్త్రీలు’; యָפוֹת అంటే ‘అందమైన.’ ‘భార్యలు’ అని ప్రత్యేకార్థం ఇవ్వకుండా మూలంలోని సాధారణ లింగపదాన్ని నిలుపుతుంది.
- source_word: כִּבְנוֹת אִיּוֹב
  choice: యోబు కుమార్తెలంత
  rationale: ఉపసర్గ כ పోలికను సూచిస్తుంది. తెలుగులో ‘కుమార్తెలంత అందమైన’ అనే నిర్మాణం ఆ పోలికను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בְּכָל הָאָרֶץ
  choice: దేశమంతటిలో
  rationale: אֶרֶץ కు ‘దేశం/ప్రాంతం’ మరియు ‘భూమి’ అనే అర్థాలు ఉన్నాయి. కథన సందర్భంలో ‘దేశమంతటిలో’ సహజంగా ఉండి అతిశయోక్తి బలాన్ని నిలుపుతుంది; ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: נַחֲלָה
  choice: వారసత్వపు ఆస్తి
  rationale: נַחֲלָה వారసత్వంగా లభించే వాటా లేదా ఆస్తిని సూచిస్తుంది. ‘వారసత్వపు ఆస్తి’ సాధారణ పాఠకునికి స్పష్టంగా ఉంటుంది.
- source_word: בְּתוֹךְ אֲחֵיהֶם
  choice: వారి సహోదరుల మధ్య
  rationale: בְּתוֹךְ అంటే ‘మధ్య/నడుమ’; אֲחֵיהֶם పురుషలింగ బహువచనంగా ‘వారి సహోదరులు.’ కుమార్తెలకు పురుష వారసులతోపాటు ఆస్తి ఇవ్వబడిన విశేషాన్ని ఈ అనువాదం నిలుపుతుంది.
theological_decisions:
- issue: బంధుత్వ పదంలోని లింగ నిర్దిష్టత
  choice: వారి సహోదరుల మధ్య
  alternative: వారి తోబుట్టువుల మధ్య
  rationale: హీబ్రూ పదం ప్రత్యేకంగా పురుషలింగ బహువచనమైన ‘సహోదరులు’ అని చెబుతుంది. దానిని లింగతటస్థంగా మార్చకుండా మూలంలోని సామాజిక విశేషాన్ని నిలిపాం.
- issue: הָאָרֶץ పదపు పరిధి
  choice: దేశమంతటిలో
  alternative: భూమంతటిలో
  rationale: ఈ పదానికి ‘దేశం/ప్రాంతం’ లేదా ‘భూమి’ అనే రెండు అర్థాలు సాధ్యమే. కథన సందర్భానికి ‘దేశం’ అనుకూలంగా ఉన్నా, నిజమైన పదార్థ సందిగ్ధతను పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. పోలికను ‘కుమార్తెలంత అందమైన’గా, ఉనికి-నిషేధాన్ని ‘ఎక్కడా కనిపించలేదు’గా వ్యక్తం చేశాం.
