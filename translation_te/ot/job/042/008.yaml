  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/עַתָּ֡ה קְחֽוּ לָ/כֶ֣ם שִׁבְעָֽה פָרִים֩ וְ/שִׁבְעָ֨ה אֵילִ֜ים וּ/לְכ֣וּ אֶל עַבְדִּ֣/י אִיּ֗וֹב וְ/הַעֲלִיתֶ֤ם עוֹלָה֙ בַּֽעַדְ/כֶ֔ם וְ/אִיּ֣וֹב עַבְדִּ֔/י יִתְפַּלֵּ֖ל עֲלֵי/כֶ֑ם כִּ֧י אִם פָּנָ֣י/ו אֶשָּׂ֗א לְ/בִלְתִּ֞י עֲשׂ֤וֹת עִמָּ/כֶם֙ נְבָלָ֔ה כִּ֠י לֹ֣א דִבַּרְתֶּ֥ם אֵלַ֛/י נְכוֹנָ֖ה כְּ/עַבְדִּ֥/י אִיּֽוֹב־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/042/008.yaml
  text: Take for yourselves seven bulls and seven rams[a], and go to my servant Job, and offer up a burnt offering for yourselves. And my servant Job will pray for you, for I will accept him, so that I may not deal with you disgracefully. For you have not spoken rightly about me[c][b], as my servant Job has.
translation:
  language: te
  text: ఇప్పుడు మీరు మీ కోసం ఏడు ఎద్దులను, ఏడు పొట్టేళ్లను తీసుకొని, నా సేవకుడైన యోబు దగ్గరికి వెళ్లి, మీ కోసం దహనబలి అర్పించండి. నా సేవకుడైన యోబు మీ కోసం ప్రార్థిస్తాడు. నేను అతణ్ణి అంగీకరిస్తాను[a] కాబట్టి, మీతో అవమానకరంగా వ్యవహరించను[b]. ఎందుకంటే నా సేవకుడైన యోబు మాట్లాడినట్టు మీరు నా గురించి[c] సరిగా మాట్లాడలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “అతని ముఖాన్ని ఎత్తుతాను”; ఇది “అతణ్ణి అంగీకరిస్తాను” లేదా “అతనిపై అనుగ్రహం చూపుతాను” అనే అర్థమిచ్చే హెబ్రీయ నుడికారం.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “మీ అవివేకానికి తగినట్టు మీతో వ్యవహరించను.” హెబ్రీయ పదం అవివేకాన్ని గానీ, నీచమైన లేదా అవమానకరమైన కార్యాన్ని గానీ సూచించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: లేదా, “మీరు నాతో సరిగా మాట్లాడలేదు.” హెబ్రీయ పదబంధాన్ని “నాతో/నాకు” అని లేదా సందర్భార్థంగా “నా గురించి” అని అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: וְעַתָּה
  choice: కాబట్టి
  rationale: וְעַתָּה అనే సంధాన పదబంధం ఇక్కడ ముందటి గద్దింపునుంచి ఇప్పుడు చేయవలసిన కార్యానికి మార్పును సూచిస్తుంది. కాలార్థకమైన ‘ఇప్పుడు’ కంటే సందర్భానుసారమైన ఫలితార్థాన్ని సహజ తెలుగులో ‘కాబట్టి’ వ్యక్తం చేస్తుంది.
- source_word: קְחוּ לָכֶם
  choice: మీ కోసం ... తీసుకొని
  rationale: ఆజ్ఞతో కూడిన לָכֶם లబ్ధిదారుని సూచిస్తుంది; బలికి కావలసిన జంతువులను తమ కోసమే సమకూర్చుకోవాలనే భావాన్ని నిలుపుతుంది.
- source_word: שִׁבְעָה פָרִים וְשִׁבְעָה אֵילִים
  choice: ఏడు ఎద్దులను, ఏడు పొట్టేళ్లను
  rationale: פָרִים మగ పశువులను, אֵילִים మగ గొర్రెలను సూచిస్తాయి. ఆధునిక సాధారణ తెలుగులో ‘ఎద్దులు’, ‘పొట్టేళ్లు’ స్పష్టమైన పదాలు.
- source_word: עַבְדִּי אִיּוֹב
  choice: నా సేవకుడైన యోబు
  rationale: ఇక్కడ עֶבֶד బానిసత్వాన్ని నొక్కిచెప్పకుండా దేవునికి నమ్మకంగా సేవచేసే వ్యక్తికి గౌరవపూర్వక బిరుదుగా ఉంది.
- source_word: וְהַעֲלִיתֶם עוֹלָה
  choice: దహనబలి అర్పించండి
  rationale: עלה హిఫీల్‌తో עוֹלָה కలయిక సంపూర్ణంగా కాల్చే బలిని అర్పించే స్థిరమైన బలిపూజా ప్రయోగం.
- source_word: בַּעַדְכֶם
  choice: మీ కోసం
  rationale: బలి వారి పక్షాన, వారి ప్రయోజనం కోసం అర్పించబడుతుందని సూచించే సహజ తెలుగు రూపం.
- source_word: יִתְפַּלֵּל עֲלֵיכֶם
  choice: మీ కోసం ప్రార్థిస్తాడు
  rationale: ఈ సందర్భంలో ప్రార్థనకు మధ్యవర్తిత్వ భావం ఉన్నప్పటికీ, మూలంలోని సాధారణ క్రియను అనుసరించి ‘ప్రార్థిస్తాడు’ అని ఉంచడం సహజం.
- source_word: כִּי אִם פָּנָיו אֶשָּׂא
  choice: నేను అతణ్ణి అంగీకరిస్తాను
  rationale: అక్షరార్థంగా ‘అతని ముఖాన్ని ఎత్తుతాను’ అనే హెబ్రీయ నుడికారం ఒకరిని అనుగ్రహంతో అంగీకరించడాన్ని సూచిస్తుంది; నుడికారాన్ని పాదసూచికలో నిలిపాం.
- source_word: לְבִלְתִּי עֲשׂוֹת עִמָּכֶם נְבָלָה
  choice: మీ అవివేకానికి తగినట్టు మీతో వ్యవహరించను
  rationale: נְבָלָה అవివేకం, నీచమైన లేదా అవమానకరమైన కార్యం అనే పరిధి కలిగిన పదం. సందర్భంలో వారి దోషపూరిత అవివేకానికి తగిన ప్రతిఫలం ఇవ్వకపోవడమనే న్యాయ భావాన్ని ఈ రూపం తెలియజేస్తుంది; ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: לֹא דִבַּרְתֶּם אֵלַי נְכוֹנָה
  choice: మీరు నా గురించి సరిగా మాట్లాడలేదు
  rationale: אֵלַי వ్యాకరణపరంగా ‘నాతో/నాకు’ అని రావచ్చు; సందర్భంలో స్నేహితులు దేవుని గురించి చేసిన వాదనలే అంశం కావడంతో ‘నా గురించి’ సహజంగా ఉంది. నిజమైన సందిగ్ధతను పాదసూచికలో నిలిపాం.
- source_word: כְּעַבְדִּי אִיּוֹב
  choice: నా సేవకుడైన యోబు మాట్లాడినట్టు
  rationale: హెబ్రీయులో పోలిక సంక్షిప్తంగా ఉన్నా, తెలుగులో క్రియను పూరించడం ద్వారా స్నేహితుల మాటలను యోబు మాటలతో పోలుస్తున్న భావం స్పష్టమవుతుంది.
theological_decisions:
- issue: యోబు ప్రార్థనలో మధ్యవర్తిత్వం మరియు దేవుని అంగీకారం
  choice: యోబు వారి కోసం ప్రార్థిస్తాడు; దేవుడు యోబును అంగీకరించడం వల్ల స్నేహితులపై తగిన తీర్పు అమలు చేయడు.
  alternative: దేవుడు యోబుకు వ్యక్తిగతంగా అనుగ్రహం చూపడమే ప్రధాన భావం; మధ్యవర్తిత్వానికి ప్రత్యేక ప్రాధాన్యం లేదు.
  rationale: బలి ఆజ్ఞ, యోబు ప్రార్థన, అతణ్ణి అంగీకరించడం, స్నేహితులపై చర్య తీసుకోకపోవడం అనే వరుస యోబు మధ్యవర్తిత్వ పాత్రను సూచిస్తుంది. అయితే తరువాతి యాజక లేదా ప్రాయశ్చిత్త సిద్ధాంతాలను వచనంలోకి చేర్చలేదు.
- issue: נְבָלָה పదం మరియు దేవుని చర్య స్వభావం
  choice: దేవుడు వారి అవివేకానికి తగినట్టు వారితో వ్యవహరించకపోవడం.
  alternative: దేవుడు వారిపట్ల ‘అవమానకరమైన/నీచమైన పని’ చేయకపోవడం.
  rationale: మూలపదానికి రెండు భావసాధ్యతలు ఉన్నాయి. దేవుని చర్యనే నైతికంగా నీచమైనదని అనిపించే అపార్థాన్ని నివారిస్తూ, సందర్భంలోని న్యాయపరమైన భావాన్ని ప్రధాన పాఠ్యంలో ఉంచి, మరింత అక్షరార్థ ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- issue: אֵלַי యొక్క సంబంధార్థం
  choice: స్నేహితులు దేవుని గురించి సరిగా మాట్లాడలేదు.
  alternative: స్నేహితులు దేవునితో/దేవునికి సరిగా మాట్లాడలేదు.
  rationale: విస్తృత సందర్భం దేవుని స్వభావం, న్యాయం గురించి వారి మాటలను ముందుకు తెస్తుంది; అయినప్పటికీ హెబ్రీయ ఉపసర్గకు ప్రత్యక్ష ‘నాతో/నాకు’ భావం సాధ్యమే కనుక దానిని పాదసూచికలో పరిరక్షించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన, సాధారణ పాఠకులకు సులభమైన శైలి వాడబడింది. ఆజ్ఞలకు బహువచన గౌరవ/సమూహ రూపాలు, బలిపూజకు స్థిరమైన ‘దహనబలి అర్పించండి’, దైవసంబంధ సందర్భానికి సహజమైన ‘సేవకుడు’ వాడబడ్డాయి. మూలంలోని భావసందిగ్ధతలు ప్రధాన పాఠ్యాన్ని భారంగా చేయకుండా పాదసూచికల్లో నిలుపబడ్డాయి.
