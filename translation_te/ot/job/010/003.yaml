source:
  edition: WLC
  text: הֲ/ט֤וֹב לְ/ךָ֨ כִּֽי תַעֲשֹׁ֗ק כִּֽי תִ֭מְאַס יְגִ֣יעַ כַּפֶּ֑י/ךָ וְ/עַל עֲצַ֖ת רְשָׁעִ֣ים הוֹפָֽעְתָּ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/010/003.yaml
  text: Is it good for you that you oppress[a], that you despise the work of your hands, and shine upon the counsel of the wicked?
translation:
  language: te
  text: నీవు పీడించడం, నీ చేతుల పనిని తృణీకరించడం, దుష్టుల ఆలోచనపై వెలుగు ప్రసరించడం[a] నీకు మంచిదా?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దుష్టుల ఆలోచనకు అనుకూలత చూపడం.’ హెబ్రీ క్రియ అక్షరార్థంగా ‘ప్రకాశించడం’ లేదా ‘వెలుగు ప్రసరించడం’ అని అర్థమిస్తుంది; ఇక్కడ అది అనుకూల దృష్టిని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲטוֹב לְךָ
  choice: నీకు మంచిదా?
  rationale: ప్రశ్నార్థక రూపాన్నీ, యోబు దేవునికి నేరుగా సంధిస్తున్న సవాలునూ సరళంగా నిలుపుతుంది.
- source_word: תַעֲשֹׁק
  choice: నీవు పీడించడం
  rationale: עָשַׁק సూచించే అణచివేత లేదా అన్యాయమైన పీడన భావాన్ని మృదుపరచకుండా వ్యక్తం చేస్తుంది; మూలంలో కర్మ స్పష్టంగా చెప్పబడనందున అనువాదంలోనూ దాన్ని చేర్చలేదు.
- source_word: תִמְאַס
  choice: తృణీకరించడం
  rationale: מָאַס లోని తిరస్కారంతో కూడిన చులకన భావాన్ని గౌరవప్రదమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: יְגִיעַ כַּפֶּיךָ
  choice: నీ చేతుల పని
  rationale: అక్షరార్థంలోని శ్రమ లేదా దాని ఫలం అనే పరిధిని సందర్భానుసారంగా సహజంగా తెలియజేస్తూ, దేవుని సృజనాత్మక కార్యాన్ని సూచిస్తుంది.
- source_word: עֲצַת רְשָׁעִים
  choice: దుష్టుల ఆలోచన
  rationale: עֵצָה లోని సలహా, యోచన, పథకం అనే విస్తృత భావపరిధిని తెలుగులో అతిగా నిర్దిష్టం చేయకుండా నిలుపుతుంది.
- source_word: הוֹפָעְתָּ
  choice: వెలుగు ప్రసరించడం
  rationale: యָפַע హిఫీల్ రూపంలోని ప్రకాశించే రూపకాన్ని ప్రధాన పాఠ్యంలో నిలుపుతుంది; సందర్భంలో ఉండగల అనుకూలత భావాన్ని పాదటిప్పణిలో ఇస్తుంది.
theological_decisions:
- issue: దేవునిపై మానవరూపకమైన నేర ఆరోపణ
  choice: యోబు అడిగిన కఠినమైన ప్రత్యక్ష ప్రశ్నను మృదుపరచకుండా నిలుపడం
  alternative: ‘నీవు పీడిస్తున్నట్లు కనిపించడం’ లేదా ‘ఇలా చేయడం నీకు ఇష్టమా?’ అని సవరించడం
  rationale: హెబ్రీ పాఠ్యం యోబు విలాపంలోని ఉద్రిక్తతను ప్రత్యక్ష ఆరోపణ రూపంలోనే ఉంచుతుంది. సిద్ధాంతపరమైన రక్షణార్థం దాన్ని కేవలం కనిపించే విషయంగా మార్చడం మూలపాఠ్యంలోని ఉద్రిక్తతను తొలగిస్తుంది.
- issue: దుష్టుల ఆలోచనపై దేవుడు ‘ప్రకాశించడం’ అనే రూపకం
  choice: రూపకాన్ని ప్రధాన పాఠ్యంలో నిలిపి, అనుకూలత చూపడం అనే సందర్భార్థాన్ని పాదటిప్పణిలో తెలియజేయడం
  alternative: ప్రధాన పాఠ్యంలోనే ‘దుష్టుల ఆలోచనకు అనుకూలత చూపడం’ అని అనువదించడం
  rationale: మూల క్రియలోని వెలుగు రూపకాన్ని కాపాడుతూ, అది అనుకూల దృష్టిని సూచించవచ్చనే భావాన్ని పాఠకునికి అందిస్తుంది; అర్థాన్ని ఒక్క వ్యాఖ్యానానికే పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గంభీరంగా ఉండే పదాలను ఎంచుకున్నాం. వాక్యంలోని మూడు చర్యలను సమాంతరంగా అమర్చి, చివరనున్న ‘నీకు మంచిదా?’ ద్వారా హెబ్రీ అలంకారప్రశ్న ప్రభావాన్ని నిలిపాం.
