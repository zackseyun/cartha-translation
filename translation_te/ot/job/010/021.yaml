revisions:
- from: నేను వెళ్లి, తిరిగి రాకముందే—చీకటి, గాఢాంధకారం[a] ఉన్న దేశానికి వెళ్లకముందే—
  to: నేను వెళ్లి తిరిగి రాని ఆ చీకటి, గాఢాంధకార దేశానికి వెళ్లకముందే—
  rationale: The revision makes “వెళ్లకముందే” govern the whole destination phrase and uses “నేను వెళ్లి తిరిగి రాని” to represent the Hebrew parenthetic sequence ‘I go—and do not return.’ It removes the erroneous suggestion that Job is speaking before a return. The lexical alternative for צַלְמָוֶת remains available in the footnote.
