  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: בְּ/טֶ֣רֶם אֵ֭לֵךְ וְ/לֹ֣א אָשׁ֑וּב אֶל אֶ֖רֶץ חֹ֣שֶׁךְ וְ/צַלְמָֽוֶת־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/010/021.yaml
  text: before I go—and do not return—to the land of darkness and deep shadow,[a]
translation:
  language: te
  text: నేను వెళ్లి తిరిగి రాని ఆ చీకటి, గాఢాంధకార దేశానికి వెళ్లకముందే—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּטֶרֶם
  choice: వెళ్లకముందే
  rationale: కాలసూచకమైన ఈ పదానికి ‘ముందు/ముందే’ అనే అర్థం ఉంది; తెలుగు వాక్యనిర్మాణంలో క్రియతో కలిపి ‘వెళ్లకముందే’ సహజంగా ఉంటుంది.
- source_word: אֵלֵךְ
  choice: నేను వెళ్లి / వెళ్లకముందే
  rationale: הלך సాధారణంగా ‘వెళ్లు’ అని అర్థం. మరణలోకానికి ప్రయాణం సందర్భంలో సూచితమైనా, నేరుగా ‘చనిపోవు’ అని వ్యాఖ్యానించకుండా మూలంలోని ప్రయాణ రూపకాన్ని నిలుపుతుంది.
- source_word: וְלֹא אָשׁוּב
  choice: తిరిగి రాక
  rationale: שׁוב అంటే ‘తిరిగి రావడం.’ ‘ఎప్పటికీ’ వంటి మూలంలో లేని తీవ్రతను చేర్చకుండా నిరాకరణను నేరుగా వ్యక్తం చేస్తుంది.
- source_word: אֶל
  choice: దేశానికి
  rationale: గమ్యాన్ని సూచించే ఉపసర్గను తెలుగులో చతుర్థీ విభక్తి ‘-కి’తో సహజంగా వ్యక్తం చేశాం.
- source_word: אֶרֶץ
  choice: దేశం
  rationale: ఇక్కడ సాధారణ భూమి కాక, చీకటితో వర్ణించబడిన ఒక లోకం లేదా ప్రదేశం ఉద్దేశించబడింది; ‘దేశం’ ఆ భావాన్ని కాపాడుతుంది.
- source_word: חֹשֶׁךְ
  choice: చీకటి
  rationale: మూలపదపు ప్రాథమిక, ప్రత్యక్ష అర్థం ‘చీకటి.’
- source_word: צַלְמָוֶת
  choice: గాఢాంధకారం
  rationale: ఈ పదం అత్యంత దట్టమైన చీకటి లేదా మరణఛాయను సూచించవచ్చు. ప్రధాన పాఠంలో సహజమైన ‘గాఢాంధకారం’ను వాడి, సంప్రదాయ ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
theological_decisions:
- issue: కావ్యాత్మక మరణ సందర్భంలో צַלְמָוֶת అనువాదం
  choice: గాఢాంధకారం
  alternative: మరణఛాయ
  rationale: ఈ హెబ్రీ పదం ‘దట్టమైన చీకటి’ అనే భావానికీ, సంప్రదాయంగా ‘మరణఛాయ’ అనే భావానికీ అవకాశం ఇస్తుంది. సమాంతర కావ్య నిర్మాణంలో ‘చీకటి’తో సరిపడే సహజ తెలుగు కోసం ప్రధాన పాఠంలో ‘గాఢాంధకారం’ను ఎంచుకొని, మరణాన్ని స్పష్టంగా సూచించే సంప్రదాయ పఠనాన్ని పాదసూచికలో కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కావ్య ధోరణి పాటించబడింది. ఈ వచనం తరువాతి వచనంలో కొనసాగే వాక్యభాగం కావడం వల్ల చివరలో దీర్ఘవిరామం ఉంచాం. హెబ్రీ పదక్రమంలోని ‘నేను వెళ్లి—తిరిగి రాను’ అనే మధ్యచొప్పింపును తెలుగులో అర్థస్పష్టతతో నిలుపేందుకు పునరుక్త ‘వెళ్లకముందే’ నిర్మాణం వాడబడింది.
