review_pass:
  verdict: revise
  source_fidelity: 'The draft wrongly duplicates the temporal construction: it says both “నేను వెళ్లి, తిరిగి రాకముందే” and “దేశానికి వెళ్లకముందే,” obscuring the Hebrew sense, “before I go—and do not return—to the land.” The non-return must qualify the speaker after going to that land, not introduce a separate ‘before returning’ action.'
  naturalness: The revised wording is clear, idiomatic modern standard Telugu, and retains the elevated poetic register and the unfinished cadence appropriate to a clause continuing into the next verse.
  terminology: “చీకటి” accurately renders חֹשֶׁךְ. “గాఢాంధకారం” is a suitable rendering of צַלְמָוֶת in the main text, while the footnote preserves the traditional ‘shadow of death’ reading as “మరణఛాయ.” “దేశం” appropriately conveys the portrayed realm without unnecessarily identifying it doctrinally.
  issues:
  - severity: high
    issue: Duplicated and mis-scoped temporal phrasing
    rationale: “నేను వెళ్లి, తిరిగి రాకముందే ... వెళ్లకముందే” can mean ‘before I go and before I return,’ whereas the Hebrew states that Job will go and not return. It also repeats ‘before going’ without source support.
  revised_text: నేను వెళ్లి తిరిగి రాని ఆ చీకటి, గాఢాంధకార దేశానికి వెళ్లకముందే—
  revised_footnotes:
  - marker: a
    text: లేదా, సంప్రదాయంగా, “మరణఛాయ.”
    reason: lexical_alternative
  revision_rationale: The revision makes “వెళ్లకముందే” govern the whole destination phrase and uses “నేను వెళ్లి తిరిగి రాని” to represent the Hebrew parenthetic sequence ‘I go—and do not return.’ It removes the erroneous suggestion that Job is speaking before a return. The lexical alternative for צַלְמָוֶת remains available in the footnote.
