  revision_rationale: The revision replaces the infinitival wording with finite verbs, making explicit the Hebrew imperfects and preserving this verse’s role as the continuation of Job’s rhetorical question. It retains the moral-term parallel and the footnote’s legitimate alternative reading of כִּי without resolving Job’s claimed innocence or guilt.
