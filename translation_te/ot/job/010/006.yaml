translation:
  language: te
  text: 'నీవు నా దోషాన్ని వెదకి,

    నా పాపాన్ని శోధిస్తున్నావా?[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఎందుకంటే నీవు నా అపరాధాన్ని వెదకి, నా పాపాన్ని శోధిస్తున్నావు.”
    reason: כִּי పదాన్ని కారణార్థకంగా చదవవచ్చు; עָוֹןకు ‘అపరాధం’ కూడా సాధ్యమైన పదార్థ ప్రత్యామ్నాయం.
lexical_decisions:
- source_word: כִּי
  choice: -డానికీ
  rationale: ముందటి వచనంలోని అలంకారప్రశ్నను కొనసాగిస్తూ ఉద్దేశం/విషయాన్ని తెలిపే ఉపవాక్యంగా గ్రహించాం; తెలుగులో క్రియార్థక రూపం సహజంగా ఆ సంబంధాన్ని వ్యక్తం చేస్తుంది.
- source_word: תְבַקֵּשׁ
  choice: వెదకడం
  rationale: పియేల్ రూపంలోని చురుకైన అన్వేషణ భావాన్ని సాధారణ ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: לַעֲוֺנִי
  choice: నా దోషాన్ని
  rationale: עָוֹן సూచించగల అపరాధం/దోషం అనే నైతిక భావాన్ని ఉంచుతుంది; యోబు నిజంగా దోషి అని ముందే తీర్పు చెప్పదు.
- source_word: וּלְחַטָּאתִי
  choice: నా పాపాన్ని
  rationale: חַטָּאתకు సహజమైన సమానార్థకం; సమాంతర పదజంటలోని రెండవ నైతిక పదాన్ని ప్రత్యేకంగా నిలుపుతుంది.
- source_word: תִדְרֹשׁ
  choice: శోధించడం
  rationale: דרשలోని వెదకడం, విచారించి కనుగొనడం అనే లోతైన పరిశీలన భావాన్ని సమాంతర పాదంలో నిలుపుతుంది.
theological_decisions:
- issue: עָוֹן మరియు חַטָּאת అనే జంట పదాల అనువాదం
  choice: “దోషం” మరియు “పాపం” అని అనువదించి, యోబు నిజంగా దోషి అని సూచించకుండా ఉంచడం
  alternative: “అపరాధం” మరియు “పాపం”
  rationale: ఇది దేవుడు తనలో తప్పు కోసం వెదుకుతున్నాడనే యోబు ఫిర్యాదు. అనువాదం ఆ ఆరోపణాత్మక భావాన్ని నిలుపుతూ, యోబు వాస్తవ దోషిత్వంపై గ్రంథంలోని ఉద్రిక్తతను పరిష్కరించకుండా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కవితాత్మక శైలి. ఈ పాదం ముందటి వచనంలోని ప్రశ్నకు కొనసాగింపుగా ఉండేలా క్రియార్థక నిర్మాణం వాడబడింది.
