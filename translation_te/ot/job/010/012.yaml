source:
  edition: WLC
  text: חַיִּ֣ים וָ֭/חֶסֶד עָשִׂ֣יתָ עִמָּדִ֑/י וּ֝/פְקֻדָּתְ/ךָ֗ שָֽׁמְרָ֥ה רוּחִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/job/010/012.yaml
  text: You have granted me life and steadfast love[b][a], and your care has preserved my spirit.
translation:
  language: te
  text: 'నీవు నాకు జీవాన్నీ అచంచలమైన ప్రేమనూ ప్రసాదించావు;

    నీ శ్రద్ధ[a] నా ఆత్మను[b] కాపాడింది.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నీ పర్యవేక్షణ’ లేదా ‘నీ పరామర్శ’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘నా ఊపిరిని,’ ‘నా జీవశ్వాసను.’
    reason: lexical_alternative
lexical_decisions:
- source_word: חַיִּים
  choice: జీవం
  rationale: హీబ్రూలో రూపరీత్యా బహువచనమైనా, ఇక్కడ సంపూర్ణ జీవాన్ని సూచించే భావవాచక పదంగా ఉంది; తెలుగులో ఏకవచనమైన ‘జీవం’ సహజంగా ఉంటుంది.
- source_word: וָחֶסֶד
  choice: అచంచలమైన ప్రేమ
  rationale: חֶסֶדలో దయతో పాటు నిలకడ, విశ్వసనీయత, నిబద్ధత అనే భావాలు ఉన్నాయి. ‘అచంచలమైన ప్రేమ’ వాటిని సాధారణ పాఠకునికి అర్థమయ్యేలా తెలియజేస్తుంది; దీనిని కేవలం ‘కనికరం’గా పరిమితం చేయదు.
- source_word: עָשִׂיתָ עִמָּדִי
  choice: నాకు … ప్రసాదించావు
  rationale: అక్షరార్థంగా ‘నాతో చేశావు’ అనే నిర్మాణం ఇక్కడ జీవం, ప్రేమ అనే మేళ్లను దేవుడు అనుగ్రహించడాన్ని సూచిస్తుంది. ‘ప్రసాదించావు’ ఆ ప్రయోజనార్థక భావాన్ని సహజమైన తెలుగులో ఇస్తుంది.
- source_word: וּפְקֻדָּתְךָ
  choice: నీ శ్రద్ధ
  rationale: פְקֻדָּהకు పర్యవేక్షణ, పరామర్శ, శ్రద్ధగల సంరక్షణ వంటి భావాలు ఉన్నాయి. తరువాతి ‘కాపాడింది’ అనే క్రియవల్ల ఇక్కడ అనుకూలమైన శ్రద్ధ అనే భావం ప్రధానంగా కనిపిస్తుంది; విస్తృత పదార్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: שָׁמְרָה
  choice: కాపాడింది
  rationale: ఈ క్రియకు ఉంచడం, కావలికాయడం, సంరక్షించడం అనే అర్థాలున్నాయి. దేవుని శ్రద్ధ యోబు ఆత్మను నిలిపిందనే సందర్భంలో ‘కాపాడింది’ స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: רוּחִי
  choice: నా ఆత్మ
  rationale: רוּחַకు ఆత్మ, ఊపిరి, జీవశ్వాస అనే అర్థాలు రావచ్చు. ప్రధాన పాఠంలో ‘ఆత్మ’ వ్యక్తి అంతరంగ జీవాన్ని సూచిస్తుంది; ‘ఊపిరి’ అనే నిజమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలిపాం.
theological_decisions:
- issue: దేవునికి సంబంధించి חֶסֶד యొక్క భావవ్యాప్తి
  choice: అచంచలమైన ప్రేమ
  alternative: దయ; కనికరం; నిబద్ధమైన ప్రేమ
  rationale: వాక్యం దేవుని మేలుచేసే చర్యను చెబుతుంది గాని, ఏదైనా ప్రత్యేక ఒడంబడిక సిద్ధాంతాన్ని తప్పనిసరిగా నిర్దేశించదు. ‘అచంచలమైన ప్రేమ’ ప్రేమలోని నిలకడ, విశ్వసనీయతను నిలుపుతూ అదనపు సిద్ధాంతాన్ని చేర్చదు.
- issue: פְקֻדָּה యొక్క భావం
  choice: అనుకూలమైన దైవిక శ్రద్ధ
  alternative: పర్యవేక్షణ; పరామర్శ; దర్శనం
  rationale: ‘నా ఆత్మను కాపాడింది’ అనే సమీప సందర్భం శిక్షాత్మక దర్శనం కంటే శ్రద్ధగల పర్యవేక్షణను బలపరుస్తుంది. అయినా మూలపదంలోని విస్తృత భావాన్ని పాదసూచిక ద్వారా నిలిపాం.
- issue: רוּחִי యొక్క సూచన
  choice: నా ఆత్మ
  alternative: నా ఊపిరి; నా జీవశ్వాస
  rationale: ఈ సందర్భంలో అంతరంగ జీవం లేదా జీవించే స్వరూపం భావం సరిపోతుంది. అయితే శరీర జీవాన్ని నిలిపే ఊపిరి అనే భావం కూడా మూలపదంలో నిజంగా ఉన్నందున దాన్ని పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా ఉండే వాక్యనిర్మాణం వాడాం. కవితాత్మక సమాంతరతను రెండు పాదాలుగా ఉంచాం. ‘ప్రసాదించావు,’ ‘అచంచలమైన ప్రేమ,’ ‘శ్రద్ధ’ వంటి పదాలు సాధారణ పాఠకునికి అర్థమయ్యే స్థాయిలో ఉండి మూలంలోని గంభీరతను నిలుపుతాయి.
