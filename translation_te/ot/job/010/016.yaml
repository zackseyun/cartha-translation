source:
  edition: WLC
  text: וְ֭/יִגְאֶה כַּ/שַּׁ֣חַל תְּצוּדֵ֑/נִי וְ֝/תָשֹׁ֗ב תִּתְפַּלָּא בִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/010/016.yaml
  text: If I lift myself up[a], you hunt me like a lion[b], and again you show yourself wonderful against me.
translation:
  language: te
  text: నేను తల ఎత్తితే[a], సింహంలా నన్ను వేటాడుతావు; మళ్లీ నాపట్ల అద్భుతంగా కార్యం చేస్తావు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ వాక్యం క్లిష్టంగా, సంక్షిప్తంగా ఉంది. దీనిని ‘అది పైకి లేస్తే’ లేదా ‘నేను హెచ్చింపబడితే’ అని కూడా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘మళ్లీ నాకు విరోధంగా అసాధారణంగా కార్యం చేస్తావు.’ ఇక్కడి హీబ్రూ పదం అద్భుతమైన లేదా అసాధారణమైన చర్యను సూచించగలదు; ఈ సందర్భంలో అది యోబుకు విరోధంగా జరిగే చర్య.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִגְאֶה
  choice: నేను తల ఎత్తితే
  rationale: גאה అంటే పైకి లేవడం లేదా హెచ్చింపబడడం. రూపం 3వ పురుష ఏకవచనమైనా వాక్యం సంక్షిప్తంగా, క్లిష్టంగా ఉంది; సందర్భంలోని యోబు ప్రథమపురుష ఫిర్యాదును బట్టి ‘నేను తల ఎత్తితే’ సహజంగా అర్థమవుతుంది. ప్రత్యామ్నాయాలను పాదటిప్పణిలో ఉంచాం.
- source_word: כַּשַּׁחַל
  choice: సింహంలా
  rationale: שַׁחַל బలమైన లేదా క్రూరమైన సింహాన్ని సూచిస్తుంది; ‘సింహంలా’ ఉపమానాన్ని అతివివరణ లేకుండా స్పష్టంగా ఉంచుతుంది.
- source_word: תְּצוּדֵנִי
  choice: నన్ను వేటాడుతావు
  rationale: צוד వేటాడడం లేదా ఎరను వెంబడించడం అనే భావం కలిగి ఉంది; సింహపు ఉపమానంతో ‘వేటాడుతావు’ సహజంగా సరిపోతుంది.
- source_word: וְתָשֹׁב
  choice: మళ్లీ
  rationale: שׁוב అక్షరార్థంగా తిరిగిరావడం; ఇక్కడ పునరావృత చర్యను సూచిస్తుంది. ‘మళ్లీ’ ఆధునిక తెలుగులో ఆ భావాన్ని సంక్షిప్తంగా అందిస్తుంది.
- source_word: תִּתְפַּלָּא
  choice: నీ అసాధారణ శక్తిని ప్రదర్శిస్తావు
  rationale: פלא హిత్పయేల్ రూపం తనను అద్భుతమైనవానిగా చూపించుకోవడం లేదా అసాధారణ కార్యం చేయడం అనే భావాన్ని ఇస్తుంది. తెలుగు వాక్యంలో ప్రతికూల సందర్భాన్ని కాపాడుతూ భావాన్ని సహజంగా అందించేందుకు ఈ రూపాన్ని ఎంచుకున్నాం.
- source_word: בִי
  choice: నాపట్ల
  rationale: בִי సందర్భానుసారంగా ‘నాలో,’ ‘నాతో,’ లేదా ‘నాకు విరోధంగా’ కావచ్చు. యోబు బాధను వర్ణించే ఈ సందర్భంలో ‘నాపట్ల’ చర్య దిశను చూపిస్తూ, ‘విరోధంగా’ అని అతిగా నిర్ధారించదు.
theological_decisions:
- issue: దైవిక విరోధ సందర్భంలో פלא పదాన్ని అనువదించడం
  choice: నాపట్ల నీ అసాధారణ శక్తిని ప్రదర్శిస్తావు
  alternative: నాకు విరోధంగా నిన్ను నీవు అద్భుతమైనవాడిగా చూపించుకుంటావు
  rationale: దేవుని అసాధారణ, విస్మయం కలిగించే కార్యం యోబు బాధ సందర్భంలో చెప్పబడుతోంది. ఎంపిక చేసిన అనువాదం దానిని దయగల అద్భుతకార్యంగా మార్చకుండా, అలాగే సాధారణ ‘దాడి’గా కుదించకుండా, దైవిక మహత్తు మరియు యోబు అనుభవిస్తున్న విరోధం మధ్య ఉద్రిక్తతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. యోబు దేవునితో నేరుగా మాట్లాడుతున్నందున ఏకవచన సంబోధన క్రియారూపాలు వాడబడ్డాయి. మూలంలోని సంక్షిప్తత, వేట ఉపమానం, దైవిక అసాధారణ కార్యం మరియు బాధ మధ్య ఉన్న ఉద్రిక్తత కాపాడబడ్డాయి.
