source:
  edition: WLC
  text: וְ/לָ֣/מָּה מֵ֭/רֶחֶם הֹצֵאתָ֑/נִי אֶ֝גְוַ֗ע וְ/עַ֣יִן לֹא תִרְאֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/010/018.yaml
  text: Why[a], then, did you bring me out from the womb? I should have died, and no eye would have seen me.
translation:
  language: te
  text: మరి నన్ను గర్భం నుండి ఎందుకు బయటికి తెచ్చావు? నేను చనిపోయి ఉండేవాణ్ణి; ఏ కన్నూ నన్ను చూసి ఉండేది కాదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నేను చనిపోయేవాణ్ణి; ఏ కన్నూ నన్ను చూసేది కాదు.” హీబ్రూ అసంపూర్ణ క్రియారూపాలను ఇలా మరింత రూపనిష్ఠంగా అనువదించవచ్చు; అయితే సందర్భం నిజం కాని గత సంభావ్యతను సూచించే భావానికి మొగ్గుచూపుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָמָּה
  choice: అయితే ... ఎందుకు
  rationale: ప్రశ్నార్థకమైన ‘ఎందుకు’తో పాటు ముందరి విలాపానికి ఉన్న అనుసంధానాన్ని ‘అయితే’ సహజంగా తెలియజేస్తుంది.
- source_word: מֵרֶחֶם
  choice: గర్భంలోనుండి
  rationale: జననానికి సంబంధించిన స్పష్టమైన మూలస్థాన భావాన్ని నిలుపుతుంది.
- source_word: הֹצֵאתָנִי
  choice: నన్ను ... బయటికి తెచ్చావు
  rationale: יצא హిఫీల్ రూపం బయటికి వచ్చేలా చేయడాన్ని సూచిస్తుంది; దేవునితో నేరుగా మాట్లాడే భావాన్ని కూడా నిలుపుతుంది.
- source_word: אֶגְוַע
  choice: నేను చనిపోయి ఉండేవాణ్ణి
  rationale: సందర్భంలో ఈ అసంపూర్ణ క్రియారూపం నిజం కాని, యోబు కోరుకున్న గత ఫలితాన్ని సూచిస్తుంది.
- source_word: וְעַיִן לֹא תִרְאֵנִי
  choice: ఏ కన్నూ నన్ను చూసి ఉండేది కాదు
  rationale: ‘కన్ను’ చూసే వ్యక్తికి రూపకాలంకారంగా నిలుస్తుంది; ప్రతికూల గత సంభావ్య ఫలితాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన విలాప శైలి. ‘బయటికి తెచ్చావు’ జనన చిత్రణను స్పష్టంగా ఉంచుతుంది; క్రియారూపాల్లోని సందర్భాధారిత ప్రతికల్పిత భావాన్ని ప్రధాన పాఠ్యంలో వ్యక్తం చేసి, రూపనిష్ఠ ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
