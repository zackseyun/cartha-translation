id: JOB.10.15
reference: Job 10:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אִם רָשַׁ֡עְתִּי אַלְלַ֬י לִ֗/י וְ֭/צָדַקְתִּי לֹא אֶשָּׂ֣א רֹאשִׁ֑/י שְׂבַ֥ע קָ֝ל֗וֹן וּ/רְאֵ֥ה עָנְיִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/010/015.yaml
  text: If I am wicked[a], woe to me! Even if I am righteous, I cannot lift up my head, filled with disgrace and looking on my affliction.
translation:
  language: te
  text: నేను దుష్టంగా ప్రవర్తించి ఉంటే, నాకు అయ్యో! నేను నీతిమంతుడినైనా నా తల ఎత్తలేను; అవమానంతో నిండిపోయి, నా బాధను చూస్తూ ఉన్నాను.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నా బాధను చూడు” లేదా “ఇదిగో నా బాధ.” ఇక్కడి హీబ్రూ వాక్యనిర్మాణం క్లిష్టంగా ఉంది. కొందరు దీన్ని యోబు తన స్థితిని వర్ణించడంగా కాక, దేవునికి నేరంగా చేసిన విజ్ఞప్తిగా అర్థం చేసుకుంటారు.
    reason: alternative_reading
lexical_decisions:
- source_word: אִם רָשַׁעְתִּי
  choice: నేను దుష్టంగా ప్రవర్తించి ఉంటే
  rationale: רשע క్రియారూపంలోని దుష్టంగా ప్రవర్తించడమనే నైతిక భావాన్ని నిలుపుతూ, షరతుతో కూడిన విలాపానికి సహజమైన తెలుగును ఉపయోగిస్తుంది.
- source_word: אַלְלַי לִי
  choice: నాకు అయ్యో!
  rationale: విలాపం, ఆపదభావం రెండింటినీ సాధారణ ఆధునిక తెలుగులో బలంగా వ్యక్తం చేస్తుంది.
- source_word: וְצָדַקְתִּי
  choice: నేను నీతిమంతుడినైనా
  rationale: ముందటి వాక్యభాగంతో ఉన్న వ్యతిరేకతను ‘అయినా’ తెలియజేస్తుంది; צדק లోని నైతిక-న్యాయ భావాన్ని ‘నీతిమంతుడు’ నిలుపుతుంది.
- source_word: לֹא אֶשָּׂא רֹאשִׁי
  choice: నా తల ఎత్తలేను
  rationale: గౌరవంతో లేదా ధైర్యంతో తల ఎత్తడం అనే హీబ్రూ నుడికారాన్ని సహజంగా తెలియజేస్తుంది; సందర్భంలో యోబు అలా చేయలేని స్థితిని సూచిస్తుంది.
- source_word: שְׂבַע קָלוֹן
  choice: అవమానంతో నిండిపోయి
  rationale: שׂבע లోని పూర్తిగా నిండిన స్థితిని, קלון లోని సిగ్గు మరియు పరాభవ భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: וּרְאֵה עָנְיִי
  choice: నా బాధనే చూస్తూ ఉన్నాను
  rationale: కష్టమైన హీబ్రూ నిర్మాణాన్ని యోబు తన స్థితిని వర్ణించడంగా తీసుకుంటూ, ‘చూడటం’ అనే క్రియార్థాన్ని నిలుపుతుంది; ‘నే’ అతని దృష్టి బాధపైనే నిలిచిందనే భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: וּרְאֵה עָנְיִי యొక్క వాక్యనిర్మాణ సంబంధం
  choice: 'యోబు తన స్థితిని కొనసాగిస్తూ వర్ణించడం: ‘నా బాధనే చూస్తూ ఉన్నాను’'
  alternative: 'దేవునికి నేర విజ్ఞప్తి: ‘నా బాధను చూడు’; లేదా ఆశ్చర్యార్థకంగా ‘ఇదిగో నా బాధ’'
  rationale: హీబ్రూ రూపం ఒకటి కంటే ఎక్కువ విధాలుగా అర్థం చేసుకోవచ్చు. ప్రధాన పాఠం ముందున్న స్వీయవర్ణన ప్రవాహాన్ని కొనసాగిస్తుంది; పాదసూచిక నేర విజ్ఞప్తి అనే నిజమైన ప్రత్యామ్నాయాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన విలాప శైలి వాడబడింది. కఠినమైన చివరి హీబ్రూ పదబంధాన్ని ప్రధాన పాఠంలో బలవంతంగా స్పష్టం చేయకుండా, ప్రత్యామ్నాయ పఠనాన్ని పాదసూచికలో ఉంచాం.
