source:
  edition: WLC
  text: זְכָר נָ֭א כִּי כַ/חֹ֣מֶר עֲשִׂיתָ֑/נִי וְֽ/אֶל עָפָ֥ר תְּשִׁיבֵֽ/נִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/010/009.yaml
  text: Remember[a], please, that you made me like clay[b], and will you return me to dust?
translation:
  language: te
  text: దయచేసి గుర్తుచేసుకో—నీవు నన్ను బంకమట్టిలా[a] చేశావు; నన్ను తిరిగి ధూళికి చేర్చుతావా?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘బంకమట్టివలె.’ హీబ్రూ పదబంధం పోలికను సూచిస్తుంది; ‘బంకమట్టితో’ అని మూలపదార్థాన్ని స్పష్టంగా చెప్పదు, అయితే సృష్టి చిత్రణను తలపిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘నన్ను తిరిగి ధూళికి చేర్చుతావు.’ హీబ్రూ క్రియారూపాన్ని నిశ్చయవాక్యంగానో, సందర్భానుసారం అలంకారిక ప్రశ్నగానో చదవవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: זְכָר־נָא
  choice: దయచేసి గుర్తుచేసుకో
  rationale: זְכָר అనేది దేవునిని నేరుగా ఉద్దేశించిన ఏకవచన ఆజ్ఞ; נָא అభ్యర్థనను మృదువుగా చేసే వినయార్థక అవ్యయం. ఆధునిక తెలుగులో ఈ రెండింటి భావాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: כִּי
  choice: — … అని (తెలుగు వాక్యనిర్మాణంలో అంతర్భావంగా)
  rationale: ఇది గుర్తుచేసుకోవలసిన విషయాన్ని పరిచయం చేస్తుంది. తెలుగులో తరువాతి వాక్యాన్ని విరామరేఖతో ఉంచడం సహజం; ‘అని’ భావం సందర్భంలో స్పష్టంగా ఉంటుంది.
- source_word: כַחֹמֶר
  choice: బంకమట్టిలా
  rationale: כ ఉపసర్గ పోలికను సూచిస్తుంది; కాబట్టి ‘మట్టితో’ అని మూలపదార్థాన్ని స్పష్టంగా చెప్పకుండా ‘బంకమట్టిలా’ అని ఉపమానాన్ని నిలుపుతుంది. חֹמֶרకు ‘బంకమట్టి’ సాధారణంగా స్పష్టమైన తెలుగు పదం.
- source_word: עֲשִׂיתָנִי
  choice: నన్ను … చేశావు
  rationale: עשה అనే విస్తృతార్థక క్రియను మరీ నిర్దిష్టంగా ‘మలిచావు’ అని చేయకుండా, దాని సాధారణ ‘చేయు’ భావాన్ని కాపాడుతుంది.
- source_word: עָפָר
  choice: ధూళి
  rationale: సృష్టి, మరణశీలత సందర్భాల్లో עָפָרకు ప్రామాణికమైన సమానార్థకం; ఆదికాండంలోని సృష్టి ప్రతిధ్వనిని కూడా సహజంగా నిలుపుతుంది.
- source_word: תְּשִׁיבֵנִי
  choice: నన్ను తిరిగి … చేర్చుతావా
  rationale: שוב హిఫీల్ రూపంలోని ‘తిరిగి చేర్చు/తిరిగి తీసుకుపో’ అనే కారణార్థాన్ని తెలియజేస్తుంది. సందర్భంలోని విలాపపూర్వక సవాలును ప్రశ్నారూపం ప్రతిబింబిస్తుంది.
theological_decisions:
- issue: రెండో భాగాన్ని నిశ్చయవాక్యంగా తీసుకోవాలా, అలంకారిక ప్రశ్నగా తీసుకోవాలా
  choice: 'అలంకారిక ప్రశ్నగా: ‘నన్ను తిరిగి ధూళికి చేర్చుతావా?’'
  alternative: 'నిశ్చయవాక్యంగా: ‘నన్ను తిరిగి ధూళికి చేర్చుతావు.’'
  rationale: హీబ్రూలో స్పష్టమైన ప్రశ్నార్థక సూచిక లేదు; అందువల్ల రెండు పఠనాలూ వ్యాకరణపరంగా సాధ్యమే. యోబు విలాపంలోని విజ్ఞాపన, నిరసన ధోరణిని ప్రధాన పాఠంలో ప్రశ్నారూపం సహజంగా వ్యక్తపరుస్తుంది; ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో నిలుపుతున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; దేవునితో యోబు నేరుగా మాట్లాడే ఏకవచన సంబోధనను, వినయపూర్వకమైనప్పటికీ వేదనతో కూడిన ప్రశ్నను నిలిపింది. ‘బంకమట్టి’ మరియు ‘ధూళి’ మధ్య మూలంలోని పదభేదాన్ని కాపాడింది.
