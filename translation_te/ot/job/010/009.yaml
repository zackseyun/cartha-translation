    issue: English audit-trail footnote anchoring differs from the Telugu anchoring.
    rationale: In the supplied English text, marker a follows “Remember” although its note concerns “like clay,” whereas the Telugu correctly places marker a after “బంకమట్టిలా.” This is an audit-trail inconsistency, not a defect in the Telugu draft.
