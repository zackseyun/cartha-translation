  yaml_path: translation/ot/job/010/007.yaml
  text: Though you know that I am not wicked[b][a], there is no one who can deliver from your hand.
translation:
  language: te
  text: నేను దుష్టుణ్ణి కానని[a] నీకు తెలిసినప్పటికీ, నీ చేతిలోనుండి[b] నన్ను విడిపించేవారు ఎవరూ లేరు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నేను దోషిని కానని.” హీబ్రూలో అక్షరార్థంగా “దుష్టుణ్ణి కాను” అని ఉంది. ఇది యోబు తాను సంపూర్ణంగా పాపరహితుడనని చెప్పడం కంటే, తాను దుష్టుడననే ఆరోపణను తిరస్కరించడాన్ని నొక్కిచెబుతుంది.
    reason: lexical_alternative
  - marker: b
    text: “నీ చేతిలోనుండి” అనేది ఒకరి అధికారం లేదా నియంత్రణ కింద ఉండడాన్ని సూచించే హీబ్రూ వ్యక్తీకరణ.
    reason: cultural_note
lexical_decisions:
- source_word: עַל דַּעְתְּךָ
  choice: నీకు తెలిసినప్పటికీ
  rationale: ఈ సందర్భంలో దేవునికి తెలిసిన విషయాన్ని యోబు తన ఫిర్యాదుకు ఆధారంగా చూపుతున్నాడు; వాక్యసందర్భంలోని concessive భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: כִּי
  choice: అని
  rationale: దేవునికి తెలిసిన విషయం ఏమిటో పరిచయం చేసే content marker‌గా పనిచేస్తుంది.
- source_word: לֹא אֶרְשָׁע
  choice: నేను దుష్టుణ్ణి కానని
  rationale: רשע అనే నైతిక పదాన్ని నేరుగా ప్రతిబింబిస్తూ, యోబు సంపూర్ణ పాపరహితుడని అవసరానికి మించి చెప్పకుండా అతడు దుష్టుడు కాదనే వాదనను నిలుపుతుంది.
- source_word: וְאֵין
  choice: ఎవడూ లేడు
  rationale: హీబ్రూ అస్తిత్వ నిరాకరణను సహజమైన తెలుగు వ్యక్తీకరణగా అందిస్తుంది.
- source_word: מִיָּדְךָ
  choice: నీ చేతిలోనుండి
  rationale: ‘చేయి’ అనే హీబ్రూ అధికార-నియంత్రణ రూపకాన్ని అనువాదంలో నిలుపుతుంది.
- source_word: מַצִּיל
  choice: నన్ను విడిపించేవాడు
  rationale: హిఫిల్ కృదంతంలోని రక్షించే లేదా విడిపించే వ్యక్తి భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; ‘నన్ను’ అనేది సందర్భంలో అంతర్లీనంగా ఉన్న కర్మను స్పష్టం చేస్తుంది.
theological_decisions:
- issue: దేవుని ఎదుట యోబు తన నిర్దోషిత్వాన్ని ప్రకటించడం
  choice: యోబు తాను దుష్టుడు కాదని వాదిస్తున్నట్లుగా అనువదించడం
  alternative: ‘నేను నిర్దోషిని’ లేదా ‘నేను దోషిని కాను’ అని అనువదించడం
  rationale: హీబ్రూ పాఠంలో ‘దుష్టుడు’ అనే అర్థమిచ్చే רשע ఉంది. కాబట్టి యోబు సంపూర్ణంగా పాపరహితుడని తీర్మానించకుండా, తాను దుష్టుడు కాదనే అతని నిరసనలోని వేదాంత ఉద్రిక్తతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలిని ఉపయోగించాం. దేవునితో ఏకవచన ప్రత్యక్ష సంభాషణకు ‘నీకు/నీ’ రూపాలను, పురుష వక్త అయిన యోబుకు ‘దుష్టుణ్ణి’ రూపాన్ని వాడాం. మూలంలోని ‘చేయి’ రూపకాన్ని నిలిపి, దాని భావాన్ని పాదటిప్పణిలో వివరించాం.
