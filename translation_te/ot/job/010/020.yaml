source:
  edition: WLC
  text: הֲ/לֹא מְעַ֣ט יָמַ֣/י יחדל ישית מִ֝מֶּ֗/נִּי וְ/אַבְלִ֥יגָה מְּעָֽט־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/010/020.yaml
  text: Are not my days few? Then cease and leave me alone[a], so that I may brighten up a little[b],
translation:
  language: te
  text: నా దినాలు కొద్దే కదా? ఇక మాని, నన్ను ఒంటరిగా విడిచిపెట్టు[a], నేను కాస్త ఊరట పొందేందుకు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘నా నుండి తొలగిపో’ / ‘నా నుండి తిరిగిపో.’ ‘మాను’ అనే క్రియతో పాటు వచ్చే హెబ్రీ పదబంధం సంక్షిప్తమైన, అర్థనిర్ణయం కొంత క్లిష్టమైన జాతీయ ప్రయోగం.
    reason: alternative_reading
  - marker: b
    text: లేదా ‘నేను కాస్త ఉల్లాసం పొందేందుకు’ లేదా ‘కాస్త తేరుకొనేందుకు.’ ఈ క్రియ కొద్దిగా ఉపశమనం పొందడం, మనసు తేలికపడడం లేదా తేరుకోవడం అనే భావాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: కదా?
  rationale: ప్రతికూల రూపంలో ఉన్న అలంకారప్రశ్న సమ్మతిని ఆశిస్తోంది; తెలుగులో ‘కదా?’ దాని సహజమైన ప్రశ్నార్థక బలాన్ని తెలియజేస్తుంది.
- source_word: מְעַט יָמַי
  choice: నా దినాలు కొద్దే
  rationale: ‘దినాలు’ అనే పదంతో מְעַט సంఖ్య లేదా కాలవ్యవధి తక్కువగా ఉండడాన్ని సూచిస్తుంది; యోబు తనకు మిగిలిన జీవితకాలం స్వల్పమని చెబుతున్నాడు.
- source_word: יחדל
  choice: ఇక మాని
  rationale: חדל అనే క్రియ ‘మాను, ఆపు’ అనే అర్థాన్ని ఇస్తుంది. తరువాతి సంక్షిప్త పదబంధంతో దీనికి ఉన్న వేరు క్రియాబలాన్ని నిలుపుకోవడానికి ప్రత్యేకంగా అనువదించబడింది.
- source_word: ישית ממני
  choice: నన్ను ఒంటరిగా విడిచిపెట్టు
  rationale: שׁית + מן ఇక్కడ సంక్షిప్తమైన, కొంత క్లిష్టమైన ప్రయోగం. సందర్భంలో దేవుడు తనను బాధించడం మాని తననుంచి తొలగిపోవాలని యోబు వేడుకుంటున్న భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: וְאַבְלִיגָה
  choice: అప్పుడు నేను ఊరట పొందుతాను
  rationale: בלג అనే క్రియ కొద్దిసేపు మనసు తేలికపడడం, తేరుకోవడం లేదా ఉల్లాసం పొందడం అనే భావాన్ని సూచిస్తుంది. ‘ఊరట పొందుతాను’ శారీరకంగా పూర్తిగా కోలుకోవడాన్ని అతిశయంగా సూచించకుండా ఆ ఉపశమనాన్ని వ్యక్తం చేస్తుంది.
- source_word: מְעָט
  choice: కాస్త
  rationale: ఉపశమనం స్వల్ప పరిమాణంలో లేదా కొద్దిసేపే ఉంటుందని తెలిపే క్రియావిశేషణ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: యోబు విన్నపం ఎవరిని ఉద్దేశించింది
  choice: దేవునితో నేరుగా మాట్లాడే ఏకవచన ఆజ్ఞారూప భావం
  alternative: ‘ఆయన మానుకొని నన్ను విడిచిపెట్టాలి’ అనే మూడవ పురుష రూపం
  rationale: సమీప సందర్భంలో యోబు దేవునితో నేరుగా మాట్లాడుతున్నాడు. మూలపాఠ ప్రసారంలో రూపభేదానికి సంబంధించిన సంక్లిష్టత ఉన్నప్పటికీ, సందర్భం మరియు సాధారణంగా స్వీకరించిన పఠనం ప్రత్యక్ష విన్నపాన్ని బలపరుస్తాయి; దీనివల్ల ప్రత్యేక సిద్ధాంతార్థం చేర్చబడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన విన్నప ధోరణి వాడబడింది. ‘దినాలు,’ ‘ఊరట’ వంటి సాధారణంగా అర్థమయ్యే సాహిత్యపదాలు నిలుపబడ్డాయి; ‘ఇక మాని’ రెండు హెబ్రీ క్రియలలో మొదటిదానికి స్వతంత్ర బలాన్ని ఇస్తుంది.
