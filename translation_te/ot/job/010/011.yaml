base_translation:
  language: en
  yaml_path: translation/ot/job/010/011.yaml
  text: You clothed me with skin and flesh[a], and wove me together with bones and sinews.
translation:
  language: te
  text: నాకు చర్మాన్నీ మాంసాన్నీ తొడిగావు; ఎముకలతో, స్నాయువులతో నన్ను అల్లావు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఎముకలతో, స్నాయువులతో నన్ను కప్పావు.” ఇక్కడి హీబ్రూ క్రియకు కప్పడం లేదా చుట్టుముట్టడం అనే అర్థం కూడా ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: עוֹר
  choice: చర్మం
  rationale: మనుష్య శరీర సందర్భంలో ఈ నామవాచకానికి సహజమైన, నేరమైన ఆధునిక తెలుగు పదం.
- source_word: בָשָׂר
  choice: మాంసం
  rationale: శరీరంలోని కండగల భాగాన్ని సూచిస్తూ ‘చర్మం’తో ఉన్న స్పష్టమైన సమాంతరాన్ని నిలుపుతుంది.
- source_word: תַּלְבִּישֵׁנִי
  choice: నాకు ... తొడిగావు
  rationale: హిఫిల్ రూపంలోని ‘తొడిగించు/వస్త్రంలా కప్పు’ అనే రూపకాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: בַעֲצָמוֹת
  choice: ఎముకలతో
  rationale: ఇక్కడ ב ఉపసర్గ శరీర నిర్మాణానికి ఉపయోగించిన లేదా దానితో అనుసంధానమైన అంశాన్ని సూచిస్తుంది.
- source_word: גִידִים
  choice: స్నాయువులు
  rationale: కండరాలను, ఎముకలను అనుసంధానించే శరీర కణజాలాన్ని ‘నరాలు’ అనే అస్పష్ట పదం కంటే కచ్చితంగా సూచిస్తుంది; అయినా కవితాత్మక సందర్భంలో అర్థమయ్యే ఆధునిక పదమే.
- source_word: תְּסֹכְכֵנִי
  choice: నన్ను అల్లావు
  rationale: సందర్భంలో శరీర భాగాలను పరస్పరం కలిపి రూపొందించే చిత్రాన్ని సహజంగా వ్యక్తం చేస్తుంది; అయితే మూల క్రియలోని ‘కప్పు/చుట్టుముట్టు’ అనే సాధ్యమైన భావాన్ని పాదటిప్పణిలో నిలుపుతుంది.
theological_decisions:
- issue: దేవుడు మానవ శరీరాన్ని రూపొందించినట్లు చెప్పే కవితాత్మక చిత్రం
  choice: యోబు శరీరాన్ని దేవుడు చర్మం, మాంసం, ఎముకలు, స్నాయువులతో రూపొందించినట్లు కవితాత్మకంగా అనువదించడం
  alternative: రెండవ క్రియను ‘కప్పావు’ లేదా ‘చుట్టుముట్టావు’ అని మరింత అక్షరార్థంగా అనువదించడం
  rationale: సమీప సందర్భంలోని శరీర నిర్మాణ చిత్రాన్ని తెలియజేస్తూనే, వచనంలో స్పష్టంగా లేని అదనపు సృష్టి సిద్ధాంత వివరాలను చేర్చదు; మూలంలోని పదార్థ సందిగ్ధతను పాదటిప్పణి ద్వారా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గంభీరమైన కవితాత్మక శైలితో రూపొందించబడింది. ‘తొడిగావు’ మొదటి రూపకాన్ని, ‘అల్లావు’ శరీర నిర్మాణ చిత్రాన్ని నిలుపుతాయి; ‘స్నాయువులు’ శరీర సంబంధ అర్థాన్ని కచ్చితంగా తెలియజేస్తుంది.
