  yaml_path: translation/ot/job/010/019.yaml
  text: I would have been as though I had not been[b][a]; from the womb I would have been carried to the grave.
translation:
  language: te
  text: నేను లేనివాడినన్నట్టే ఉండేవాడిని; గర్భం నుండి సమాధి వరకు మోయబడి ఉండేవాడిని.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: లేనివాడినన్నట్టే
  rationale: ఈ సందర్భంలో ఇది వాస్తవం కాని స్థితితో పోలికను తెలియజేస్తుంది; తెలుగు సహజ ప్రయోగంలో ‘అన్నట్టే’ ఆ భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: לֹא הָיִיתִי אֶהְיֶה
  choice: నేను లేనివాడినన్నట్టే ఉండేవాడిని
  rationale: హీబ్రూ క్రియారూపాల క్రమం సందర్భంలో అవాస్తవమైన లేదా కోరుకున్న గతస్థితిని సూచిస్తుంది. ఈ తెలుగు నిర్మాణం అక్షరార్థ భవిష్యత్తును రుద్దకుండా ప్రతివాస్తవ భావాన్ని నిలుపుతుంది.
- source_word: מִבֶּטֶן
  choice: గర్భం నుంచే
  rationale: ‘గర్భం’ అనే మూలచిత్రాన్ని కాపాడుతూ, నేరుగా అక్కడి నుంచి సమాధికి తీసుకెళ్లబడిన భావాన్ని ‘నుంచే’ సహజంగా బలపరుస్తుంది.
- source_word: לַקֶּבֶר
  choice: సమాధికి
  rationale: קבר ఇక్కడ పాతిపెట్టే స్థలాన్ని సూచిస్తుంది, పాతాళాన్ని కాదు; ఆధునిక ప్రామాణిక తెలుగులో ‘సమాధి’ సహజమైన సరిపోలిక.
- source_word: אוּבָל
  choice: మోయబడి ఉండేవాడిని
  rationale: יבל యొక్క హోఫల్ రూపం ‘తీసుకుపోబడుట/మోయబడుట’ అనే క్రియార్థాన్ని ఇస్తుంది. గర్భం నుంచి సమాధి వరకు అనే దృశ్యంలో ‘మోయబడి’ సజీవంగా, సహజంగా ఉంటుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే రీతిని అనుసరించాం. మూలంలోని ప్రతివాస్తవ భావాన్నీ, గర్భం నుంచి సమాధి వరకు అనే ఘాటైన చిత్రాన్నీ నిలిపాం.
