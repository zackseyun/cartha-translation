  source_fidelity: The draft accurately conveys the counterfactual comparison in כַּאֲשֶׁר לֹא הָיִיתִי אֶהְיֶה and the passive sense of אוּבָל. However, ‘గర్భం నుంచే సమాధికి’ can sound like an emphatic ‘from the womb itself’ rather than explicitly retaining the source’s womb-to-grave span. Rendering both endpoints with ‘నుండి ... వరకు’ more fully represents מִבֶּטֶן לַקֶּבֶר.
