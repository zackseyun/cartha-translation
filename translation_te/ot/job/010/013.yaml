revisions:
- from: అయినా వీటిని నీ హృదయంలో దాచావు[a]; ఇది నీలోనే ఉందని నాకు తెలుసు[b].
  to: అయినా వీటిని నీ హృదయంలో దాచావు[a]; ఇది నీతోనే ఉందని నాకు తెలుసు[b].
  rationale: The revision changes only ‘నీలోనే’ to ‘నీతోనే,’ restoring the literal force of Hebrew עִמָּךְ (‘with you’) and avoiding premature specification of the concealed matter as internal to God. The footnote is correspondingly aligned with the revised wording. The adversative ‘అయినా,’ the heart metaphor, and the ambiguity of ‘ఇది’ are retained.
