  text: Yet these things you hid in your heart[b][a]; I knew that this was with you.
translation:
  language: te
  text: అయినా వీటిని నీ హృదయంలో దాచావు[a]; ఇది నీతోనే ఉందని నాకు తెలుసు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వీటిని నీ హృదయంలో నిల్వచేశావు.” హీబ్రూ క్రియకు “దాచు,” “నిల్వచేయు,” లేదా “అవసరానికి ఉంచు” అనే అర్థాలు ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “ఇది నీతోనే ఉంది” అనే మాటకు “ఇది నీ మనస్సులో ఉంది” లేదా “ఇది నీ దాగిన ఉద్దేశంలో భాగం” అనే భావం ఉండవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: అయినా వీటిని
  rationale: ముందటి వచనంలోని దేవుని మేలుచేసే కార్యాల నుంచి దాగి ఉన్న ఉద్దేశం వైపు యోబు మళ్లుతున్న సందర్భంలో וְ కు వ్యతిరేక భావాన్ని సహజంగా వ్యక్తం చేస్తుంది; אֵלֶּה బహువచన సూచనార్థకంగా ‘వీటిని’ అని అనువదించబడింది.
- source_word: צָפַנְתָּ
  choice: దాచావు
  rationale: צפן కు ‘దాచు,’ ‘నిల్వచేయు,’ ‘రిజర్వులో ఉంచు’ అనే అర్థాలు ఉన్నాయి. ఇక్కడ రహస్యంగా ఉంచిన దైవిక ఉద్దేశం సందర్భంలో ‘దాచావు’ సహజంగా సరిపోతుంది.
- source_word: בִלְבָבֶךָ
  choice: నీ హృదయంలో
  rationale: לֵבָב అంతరంగం, మనస్సు, సంకల్పం లేదా హృదయాన్ని సూచించగలదు. ‘నీ హృదయంలో’ అనే రూపం హీబ్రూ రూపకాన్ని నిలుపుతుంది.
- source_word: יָדַעְתִּי
  choice: నాకు తెలుసు
  rationale: హీబ్రూ qatal రూపం ‘నేను తెలిసికొన్నాను/నాకు తెలుసు’ అనే భావాన్ని ఇస్తుంది. తెలుగులో ప్రస్తుత జ్ఞానస్థితిని సహజంగా తెలిపేందుకు ‘నాకు తెలుసు’ ఎంచుకోబడింది.
- source_word: כִּי
  choice: అని
  rationale: ఇక్కడ כִּי యోబుకు తెలిసిన విషయాన్ని పరిచయం చేస్తుంది; తెలుగులో ఉద్ధరణపూరకంగా ‘అని’ సహజం.
- source_word: זֹאת
  choice: ఇది
  rationale: స్త్రీలింగ ఏకవచన సూచనార్థకం ముందుగా చెప్పిన దాగి ఉన్న సంగతిని సమష్టిగా సూచించవచ్చు. ‘ఇది’ మూలంలోని సంక్షిప్తతను, అస్పష్టతను కాపాడుతుంది.
- source_word: עִמָּךְ
  choice: నీలోనే ఉంది
  rationale: పదశః ‘నీతో ఉంది.’ సందర్భంలో అది దేవుని అంతరంగంలో ఉన్న దాగిన ఉద్దేశమనే భావాన్ని తెలుగులో సహజంగా తెలియజేస్తూ, దాని ఖచ్చిత స్వభావాన్ని నిర్ధారించకుండా ‘నీలోనే ఉంది’ అని ఇవ్వబడింది.
theological_decisions:
- issue: యోబు మాటల్లో దేవుని దాగిన ఉద్దేశ స్వభావం
  choice: ‘ఇది’ దేనిని సూచిస్తుందో అస్పష్టంగానే ఉంచి, దాగిన దైవిక ఉద్దేశంపై యోబు చేస్తున్న ఫిర్యాదుగా వాక్యాన్ని అందించడం.
  alternative: ‘ఇది’ ప్రత్యేకంగా యోబును బాధించాలనే దేవుని రహస్య ప్రణాళిక అని స్పష్టీకరించడం; లేదా ‘వీటిని’ ముందటి వచనంలోని ఆశీర్వాదాలుగా మాత్రమే అర్థం చేసుకోవడం.
  rationale: మూలవాక్యం దేవుని హృదయంలో దాచబడిన సంగతిని పేర్కొంటుంది గాని, దాని నిర్దిష్ట స్వభావాన్ని వెల్లడించదు. అందువల్ల యోబు ఫిర్యాదులోని వేదాంతపరమైన ఉద్రిక్తతను పరిష్కరించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన శైలి. ‘హృదయం’ అనే హీబ్రూ అంతరంగ రూపకాన్ని నిలిపి, ‘ఇది’ అనే సూచనలోని ఉద్దేశపూర్వక అస్పష్టతను కాపాడాం. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
