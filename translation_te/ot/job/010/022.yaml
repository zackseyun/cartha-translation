  text: a land of gloom[a], like deep darkness, of the shadow of death and without order, where it shines like deep darkness.
translation:
  language: te
  text: 'కటికచీకటి దేశం,

    గాఢాంధకారంలాంటిది,

    మరణఛాయ[a]తోను క్రమం లేనిదీ;

    అది వెలిగినా గాఢాంధకారంలానే ఉంటుంది.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘గాఢమైన చీకటి.’ צַלְמָוֶת అనే హీబ్రూ పదం ప్రత్యేకంగా మరణఛాయను గానీ, మరింత సాధారణంగా అత్యంత గాఢమైన చీకటిని గానీ సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶרֶץ
  choice: దేశం
  rationale: యోబు ఇక్కడ మృతుల లోకాన్ని ఒక ప్రాంతంగా వర్ణిస్తున్నాడు; ఆధునిక తెలుగులో ‘దేశం’ ఈ స్థలరూపకాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: עֵיפָתָה
  choice: చీకటి కమ్మిన
  rationale: ఈ రూపం అంధకారం, మసకదనం అనే భావాన్ని ఇస్తుంది. భావోద్వేగపరమైన ‘విషాదం’గా కాక, సందర్భంలోని చీకటి దృశ్యాన్ని నిలుపుతుంది.
- source_word: כְּמוֹ אֹפֶל
  choice: గాఢాంధకారంలాంటి
  rationale: אֹפֶל సాధారణ చీకటికన్నా దట్టమైన, లోతైన అంధకారాన్ని సూచిస్తుంది; ‘గాఢాంధకారం’ ఆ తీవ్రతను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: צַלְמָוֶת
  choice: మరణఛాయ
  rationale: మరణంతో ముడిపడిన ఛాయ అనే సాధ్యమైన భావాన్ని ప్రధాన పాఠంలో నిలిపి, ‘గాఢమైన చీకటి’ అనే విస్తృత అర్థాన్ని పాదసూచికలో ఉంచింది.
- source_word: וְלֹא סְדָרִים
  choice: ఏ క్రమమూ లేని
  rationale: సక్రమమైన అమరిక లేదా వ్యవస్థ పూర్తిగా లేకపోవడాన్ని తెలుగులో స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: וַתֹּפַע כְּמוֹ אֹפֶל
  choice: అది వెలిగినా గాఢాంధకారంలానే ఉంటుంది
  rationale: భూమి/దేశమే వెలుగుతున్నదనే వ్యాకరణ సంబంధాన్ని నిలుపుతూ, దాని వెలుగు కూడా అంధకారంలా ఉండే హీబ్రూ విరోధాభాసాన్ని పరిష్కరించకుండా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: צַלְמָוֶת పదంలో మరణ సూచనా, కేవలం తీవ్రమైన చీకటా
  choice: ప్రధాన పాఠంలో ‘మరణఛాయ’
  alternative: ‘గాఢమైన చీకటి’
  rationale: యోబు మృతుల లోకానికి వెళ్లడం గురించి మాట్లాడుతున్న సందర్భంలో మరణ సూచన సముచితం; అయితే ఈ హీబ్రూ పదానికి కేవలం అత్యంత గాఢమైన చీకటి అనే అర్థమూ సాధ్యమైనందున దానిని పాదసూచికలో భద్రపరచింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కవితాత్మక పునరుక్తిని, చీకటి తీవ్రతను, చివరి పాదంలోని ఉద్దేశపూర్వక విరోధాభాసాన్ని నిలిపి, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన శైలిని ఉపయోగించింది.
