  terminology: ‘దోషిగా తీర్చవద్దు’ appropriately retains the judicial nuance without making the line overly technical. ‘వాదిస్తున్నావు’ is a good broad equivalent for ריב. The footnotes offer legitimate alternatives; the b-footnote should retain the explicit question form to correspond clearly to the anchored clause.
