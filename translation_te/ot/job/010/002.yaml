  variant: modern standard Telugu
source:
  edition: WLC
  text: אֹמַ֣ר אֶל אֱ֭לוֹהַּ אַל תַּרְשִׁיעֵ֑/נִי הֽ֝וֹדִיעֵ֗/נִי עַ֣ל מַה תְּרִיבֵֽ/נִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/010/002.yaml
  text: I will say to God[a], ‘Do not condemn me[b]; let me know why you contend with me.’
translation:
  language: te
  text: 'నేను దేవునితో ఇలా చెబుతాను: “నన్ను దోషిగా తీర్చవద్దు[a]; నాతో నీవు ఎందుకు వాదిస్తున్నావో నాకు తెలియజేయి[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నన్ను దోషిగా ప్రకటించవద్దు”; హీబ్రూ క్రియకు న్యాయపరమైన భావం ఉంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా “నాపై ఎందుకు వ్యాజ్యం నడుపుతున్నావో” లేదా “నాతో ఎందుకు వివాదపడుతున్నావో.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹמַר
  choice: నేను ... అంటాను
  rationale: ఇది אמר క్రియ యొక్క ఖల్ అసంపూర్ణ రూపం, ప్రథమ పురుష ఏకవచనం. యోబు దేవునితో చెప్పబోయే మాటను పరిచయం చేస్తున్న సందర్భంలో, తెలుగు సహజ వాక్యరీతిలో ఉద్దేశ్యాన్ని సూచించే ‘నేను ... అంటాను’ సరిపోతుంది.
- source_word: אֶל אֱלוֹהַּ
  choice: దేవునితో
  rationale: אֱלוֹהַּ యోబు గ్రంథంలో దేవునికి వాడిన ఏకవచన నామం/బిరుదు. తెలుగు వాడుకలో లిప్యంతరీకరణకన్నా ‘దేవుడు’ సహజం; אמר ... אֶל అనే సంభాషణ నిర్మాణాన్ని ‘దేవునితో ... అంటాను’గా ఇచ్చాం.
- source_word: אַל תַּרְשִׁיעֵנִי
  choice: నన్ను దోషిగా తీర్చవద్దు
  rationale: אַל నిషేధాన్ని సూచిస్తుంది. רשע హిఫిల్ రూపానికి న్యాయపరంగా ‘దోషిగా ప్రకటించు/తీర్పు తీర్చు’ అనే భావం ఉంది. ‘దోషిగా తీర్చవద్దు’ ఆ న్యాయసంబంధ భావాన్ని స్పష్టంగా, సంక్షిప్తంగా నిలుపుతుంది.
- source_word: הוֹדִיעֵנִי
  choice: నాకు తెలియజేయి
  rationale: ידע హిఫిల్ ఆజ్ఞారూపం ‘తెలిసేలా చేయి, తెలియజేయి’ అని అర్థం. ‘నాకు తెలియజేయి’ ఆధునిక ప్రామాణిక తెలుగులో సహజంగా ఉండి, మూలంలోని causative భావాన్ని నిలుపుతుంది.
- source_word: עַל מַה
  choice: ఎందుకు
  rationale: అక్షరార్థంగా ‘దేనిమీద/ఏ కారణం చేత’ అయినా, ఈ ప్రశ్నార్థక సందర్భంలో కారణాన్ని అడుగుతోంది. అందువల్ల ‘ఎందుకు’ స్పష్టమైన సహజ సమానం.
- source_word: תְּרִיבֵנִי
  choice: నాతో నీవు ... వాదిస్తున్నావో
  rationale: ריב క్రియకు వాదించడం, వివాదపడడం, న్యాయవివాదం నడపడం అనే విస్తృత భావపరిధి ఉంది. ‘వాదిస్తున్నావు’ వ్యక్తిగత ఘర్షణను, న్యాయపరమైన వివాదాన్ని రెండింటినీ అనుమతిస్తూ భావాన్ని అనవసరంగా సంకుచితం చేయదు.
theological_decisions:
- issue: యోబు దేవునికి చేసే విజ్ఞప్తిలోని న్యాయపరమైన భావం
  choice: ‘దోషిగా తీర్చవద్దు’ మరియు ‘నాతో ... వాదిస్తున్నావు’
  alternative: ‘నన్ను దుష్టునిగా ఎంచవద్దు’ మరియు ‘నాపై వ్యాజ్యం ఎందుకు వేస్తున్నావు’
  rationale: హీబ్రూ పదాలు న్యాయస్థాన సంబంధ ఛాయను కలిగివున్నా, పూర్తిగా సాంకేతిక న్యాయపరిభాషనే తప్పనిసరి చేయవు. ఎంపిక చేసిన అనువాదం దేవునితో న్యాయవివాద భాషలో మాట్లాడుతున్న యోబు మాటలోని ఉద్రిక్తతను నిలుపుతుంది; దేవుని తీర్పు గురించి మూలంలో లేని సిద్ధాంత నిర్ధారణను చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ప్రత్యక్ష సంభాషణ శైలిని వాడాం. ‘దోషిగా తీర్చవద్దు’ న్యాయపరమైన భావాన్ని నిలుపుతుండగా, ‘వాదిస్తున్నావు’ ריב పదంలోని వ్యక్తిగత మరియు న్యాయవివాద సంబంధ అర్థాలను తెరిచి ఉంచుతుంది. పాదసూచిక గుర్తులను వాటికి సంబంధించిన పదబంధాల వెంట ఉంచాం.
