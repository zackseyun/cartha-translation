  yaml_path: translation/ot/job/010/005.yaml
  text: Are your days like the days of man[b][a], or your years like the days of a mighty man?
translation:
  language: te
  text: 'నీ రోజులు మానవుని రోజులవంటివా[a]?

    లేక నీ సంవత్సరాలు బలవంతుడైన మనిషి రోజులవంటివా[b]?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘మానవుడు’కు బదులుగా ‘నశ్వరుడు’ అని కూడా అనువదించవచ్చు; అలా అనువదిస్తే אֱנוֹשׁ అనే పదంలోని మానవ బలహీనత, మరణశీలత స్పష్టమవుతాయి.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ גָבֶר పదానికి ‘మనిషి’, ‘బలవంతుడు’, లేదా ‘పరాక్రమవంతుడు’ అనే అర్థాలు రావచ్చు. మొదటి పాదంలోని אֱנוֹשׁతో ఉన్న పదభేదాన్ని నిలుపడానికి ఇక్కడ ‘బలవంతుడైన మనిషి’ అని అనువదించాం.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲכִימֵי
  choice: రోజులు ... రోజులవంటివా?
  rationale: ప్రశ్నార్థక הֲ, ఉపమానార్థక כִּ, మరియు ‘రోజులు’ అనే నిర్మాణాన్ని సహజమైన తెలుగు అలంకారప్రశ్నగా అందిస్తుంది.
- source_word: אֱנוֹשׁ
  choice: మానవుడు
  rationale: సందర్భంలో దేవుని కాలపరిమితిని బలహీనుడూ మరణశీలుడూ అయిన మానవుని కాలంతో పోలుస్తుంది; ప్రధాన పాఠంలో సహజమైన ‘మానవుడు’ను ఉంచి, నశ్వరత భావాన్ని పాదసూచికలో తెలిపాం.
- source_word: יָמֶיךָ
  choice: నీ రోజులు
  rationale: దేవుణ్ణి ఉద్దేశించిన రెండవ పురుష ఏకవచన రూపాన్ని నేరుగా నిలుపుతుంది.
- source_word: אִם
  choice: లేక
  rationale: కావ్య సమాంతర నిర్మాణంలో ఇది షరతును కాక రెండవ ప్రత్యామ్నాయ పోలికను ప్రవేశపెడుతుంది.
- source_word: שְׁנוֹתֶיךָ
  choice: నీ సంవత్సరాలు
  rationale: మూలంలోని బహువచన నామవాచకాన్నీ రెండవ పురుష ఏకవచన ప్రత్యయాన్నీ నేరుగా ప్రతిబింబిస్తుంది.
- source_word: כִּימֵי
  choice: రోజులవంటివా
  rationale: మొదటి పాదంలోని ఉపమాన నిర్మాణాన్ని రెండవ పాదంలోనూ సమాంతరంగా నిలుపుతుంది.
- source_word: גָבֶר
  choice: బలవంతుడైన మనిషి
  rationale: אֱנוֹשׁతో ఉన్న పదభేదాన్ని నిలుపుతూ, גָבֶרలోని బలం లేదా పరాక్రమ ఛాయను ‘యోధుడు’ అని అతిగా నిర్దిష్టం చేయకుండా వ్యక్తపరుస్తుంది.
