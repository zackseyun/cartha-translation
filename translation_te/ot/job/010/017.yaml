source:
  edition: WLC
  text: תְּחַדֵּ֬שׁ עֵדֶ֨י/ךָ נֶגְדִּ֗/י וְ/תֶ֣רֶב כַּֽ֭עַשְׂ/ךָ עִמָּדִ֑/י חֲלִיפ֖וֹת וְ/צָבָ֣א עִמִּֽ/י׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/010/017.yaml
  text: You renew your witnesses against me[a], and you increase your anger with me[b]; changes and hard service are with me.
translation:
  language: te
  text: 'నాకు విరోధంగా నీ సాక్షులను కొత్తకొత్తగా తీసుకువస్తున్నావు[a];

    నాపై నీ కోపాన్ని మరింత పెంచుతున్నావు;

    మార్పులూ యుద్ధమూ నాకు ఎదురవుతున్నాయి[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నీ సాక్ష్యాలను’ లేదా ‘నీ రుజువులను’ అని కూడా అనువదించవచ్చు. హీబ్రూ పదం యోబుకు విరోధంగా నిలిచే సాక్షులను గానీ, అతనికి వ్యతిరేకంగా చూపబడే రుజువులను గానీ సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: పదశః, ‘మార్పులూ సైన్యమూ నాతో ఉన్నాయి.’ ‘మార్పులూ యుద్ధమూ నాపై ఉన్నాయి’ అని కూడా అనువదించవచ్చు. ‘సైన్యం’ స్థానంలో ‘కఠిన సేవ’ అనే అర్థమూ సాధ్యం; ఈ పదబంధం వరుసగా ఎదురయ్యే కష్టాలు లేదా దాడుల సైనిక చిత్రణను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּחַדֵּשׁ
  choice: మళ్లీ మళ్లీ నిలబెడుతున్నావు
  rationale: పీయేల్ రూపం కొత్తగా చేయడం లేదా తిరిగి పునరుద్ధరించడం అనే భావాన్ని ఇస్తుంది. సందర్భంలో యోబుకు విరోధంగా సాక్షులు పదేపదే ముందుకు తేబడుతున్నారనే పునరావృత భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: עֵדֶיךָ
  choice: నీ సాక్షులను
  rationale: עֵד బహువచనం సాధారణంగా సాక్షులు లేదా సాక్ష్యాలు అని అర్థం. న్యాయస్థాన సంబంధమైన చిత్రణను నిలుపుకోవడానికి ‘సాక్షులను’ ఎంచుకున్నాం; ‘సాక్ష్యాలను’ అనే నిర్జీవార్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: נֶגְדִּי
  choice: నాకు విరోధంగా
  rationale: పదశః ‘నా ఎదుట’ అయినప్పటికీ, ఈ న్యాయపరమైన ప్రతికూల సందర్భంలో ‘నాకు విరోధంగా’ అనే అర్థం సహజం.
- source_word: וְתֶרֶב
  choice: మరింత పెంచుతున్నావు
  rationale: רבה యొక్క ఈ రూపం అధికం చేయడం లేదా విస్తరించడం అనే భావాన్ని ఇస్తుంది. తరువాతి ‘కోపం’తో ‘పెంచుతున్నావు’ సహజంగా సరిపోతుంది.
- source_word: כַּעַשְׂךָ
  choice: నీ కోపాన్ని
  rationale: כעס కోపం, ఆగ్రహం, మనస్తాపం అనే భావాలు కలిగి ఉండవచ్చు. దేవునితో ప్రత్యక్ష సంభాషణలో ‘నీ కోపం’ స్పష్టమైన, సహజమైన ఎంపిక.
- source_word: עִמָּדִי
  choice: నాపై
  rationale: పదశః ‘నాతో’ అయినా కోపం దిశను ఆధునిక తెలుగులో సహజంగా తెలియజేయడానికి ‘నాపై’ అని అనువదించాం.
- source_word: חֲלִיפוֹת
  choice: ఒకదాని తర్వాత ఒకటిగా
  rationale: ఈ పదం మార్పులు, ప్రత్యామ్నాయాలు లేదా వరుసగా వచ్చే బృందాలను సూచించగలదు. צבאతో కలిపి వరుస దాడుల సైనిక చిత్రాన్ని ఇది సహజంగా తెలియజేస్తుంది.
- source_word: וְצָבָא
  choice: సైనిక దళాలు
  rationale: צבאకు సైన్యం, సైనిక సమూహం, యుద్ధం లేదా కఠిన సేవ అనే అర్థాలు ఉన్నాయి. חֲלִיפוֹתతో జతగా ఉన్నందున వరుసగా వచ్చే ‘సైనిక దళాలు’ అనే చిత్రణ సందర్భానికి బాగా సరిపోతుంది; ఇతర సాధ్యార్థాలను పాదసూచికలో ఉంచాం.
- source_word: עִמִּי
  choice: నాపైకి వస్తున్నాయి
  rationale: పదశః ‘నాతో’ అనే సంక్షిప్త హీబ్రూ ప్రయోగం ఇక్కడ శత్రుత్వ భావాన్ని కలిగి ఉంది. సైనిక దళాల చిత్రణను తెలుగులో స్పష్టంగా, సహజంగా అందించడానికి ‘నాపైకి వస్తున్నాయి’ అని అనువదించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కవితా స్వరాన్ని ఉంచాం. మొదటి రెండు పాదాల్లో న్యాయస్థాన చిత్రణను, చివరి పాదంలో సైనిక చిత్రణను స్పష్టంగా నిలిపాం. హీబ్రూ చివరి భాగంలోని సంక్షిప్తత మరియు పదార్థ అనిశ్చితిని ప్రధాన పాఠంలో అతిగా విప్పకుండా, పాదసూచికలో ప్రత్యామ్నాయాలతో భద్రపరిచాం.
