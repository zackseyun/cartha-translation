  to: నా ప్రాణానికి నా జీవితం అసహ్యమైంది[a]; నా ఫిర్యాదును స్వేచ్ఛగా వెలువడనిస్తాను[b]; నా ప్రాణంలోని చేదుతో మాట్లాడతాను.
