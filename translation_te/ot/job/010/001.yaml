translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కవితాత్మక ధోరణి పాటించబడింది. హీబ్రూలోని ‘ప్రాణం’ పునరుక్తిని నిలిపి, ఫిర్యాదును ఇక నిరోధించననే నుడికారాన్ని సాధారణ పాఠకులకు అర్థమయ్యేలా అనువదించాం.
