base_translation:
  language: en
  yaml_path: translation/ot/job/010/001.yaml
  text: My soul loathes my life[a]; I will give free course to my complaint[b]; I will speak in the bitterness of my soul.
translation:
  language: te
  text: నా ప్రాణానికి నా జీవితం అసహ్యమైంది[a]; నా ఫిర్యాదును స్వేచ్ఛగా వెలువడనిస్తాను[b]; నా ప్రాణంలోని చేదుతో మాట్లాడతాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నా ప్రాణం నా జీవితంతో విసిగిపోయింది.’ హీబ్రూ క్రియ తీవ్రమైన విసుగుతోపాటు అసహ్యాన్ని కూడా వ్యక్తం చేయగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘నా ఫిర్యాదును విడిచిపెడతాను.’ హీబ్రూ నుడికారం యోబు ఇక తన విలాపాన్ని అదుపులో ఉంచబోనని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָקְטָה
  choice: అసహ్యమైంది
  rationale: ఈ క్రియ తీవ్రమైన విసుగు లేదా ఏవగింపును సూచిస్తుంది. సందర్భంలోని బలమైన భావాన్ని సహజమైన ఆధునిక తెలుగులో ‘అసహ్యమైంది’ వ్యక్తం చేస్తుంది; ‘విసిగిపోయింది’ కూడా సాధ్యమైన అర్థం.
- source_word: נַפְשִׁי
  choice: నా ప్రాణానికి / నా ప్రాణపు
  rationale: נֶפֶשׁ ఇక్కడ యోబు అంతరంగ స్వరూపాన్ని సూచిస్తుంది. రెండు చోట్లా ‘ప్రాణం’ అనే పదాన్ని నిలుపుతూ హీబ్రూ పునరుక్తిని, భావతీవ్రతను కాపాడాం.
- source_word: בְּחַיָּי
  choice: నా జీవితం
  rationale: ఈ సందర్భంలో యోబుకు అసహ్యమైనదిగా అతని జీవితాన్నే ఈ పదబంధం సూచిస్తుంది.
- source_word: אֶעֶזְבָה עָלַי שִׂיחִי
  choice: నా ఫిర్యాదును అడ్డుకోకుండా వెళ్లనిస్తాను
  rationale: అక్షరార్థమైన ‘విడిచిపెడతాను’ కంటే, ఇక తన విలాపాన్ని అదుపు చేయననే హీబ్రూ నుడికార భావాన్ని ఈ రూపం స్పష్టంగా తెలియజేస్తుంది.
- source_word: שִׂיחִי
  choice: నా ఫిర్యాదు
  rationale: యోబు విలాప సందర్భంలో ఇది తటస్థమైన ధ్యానం కాక, బాధతో కూడిన ఫిర్యాదు లేదా విలాపాన్ని సూచిస్తుంది.
- source_word: אֲדַבְּרָה
  choice: మాట్లాడతాను
  rationale: కోహోర్టేటివ్ రూపం యోబు సంకల్పాన్ని తెలియజేస్తుంది; ‘మాట్లాడతాను’ దాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בְּמַר נַפְשִׁי
  choice: నా ప్రాణపు చేదులో
  rationale: యోబు మాటలు అతని అంతరంగ చేదులోనుంచి వస్తున్నాయని తెలిపే రూపకాన్ని సాధ్యమైనంతగా నిలుపుతుంది.
