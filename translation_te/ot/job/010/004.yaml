source:
  edition: WLC
  text: הַ/עֵינֵ֣י בָשָׂ֣ר לָ֑/ךְ אִם כִּ/רְא֖וֹת אֱנ֣וֹשׁ תִּרְאֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/010/004.yaml
  text: Do you have eyes of flesh[a], or do you see as a man sees?
translation:
  language: te
  text: నీకు మాంసపు కళ్ళు ఉన్నాయా? లేక మనిషి[a] చూసే విధంగా నీవు చూస్తావా?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మర్త్యుడు.’ ఇక్కడి హీబ్రూ పదం אֱנוֹשׁ సాధారణంగా ఒక మానవుణ్ణి సూచిస్తుంది; దానిలో తరచుగా మర్త్యత్వం లేదా బలహీనత అనే భావఛాయ ఉంటుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַ/עֵינֵי בָשָׂר לָךְ
  choice: నీకు మాంసపు కళ్లు ఉన్నాయా?
  rationale: హీబ్రూ ప్రశ్నార్థక అవ్యయం, ‘కళ్లు,’ ‘మాంసం,’ మరియు לָךְలోని స్వామ్యభావాన్ని సహజమైన తెలుగు ప్రశ్నగా వ్యక్తం చేస్తుంది; ‘మాంసపు కళ్లు’ అనే స్పష్టమైన మానవరూపక చిత్రాన్ని అలాగే నిలుపుతుంది.
- source_word: אִם
  choice: లేక
  rationale: ఇక్కడ ఇది షరతును కాక, అలంకారిక ప్రశ్నలోని రెండవ ప్రత్యామ్నాయాన్ని పరిచయం చేస్తుంది.
- source_word: כִּ/רְאוֹת ... תִּרְאֶה
  choice: చూసినట్లు నీవు చూస్తావా
  rationale: כְּతో కూడిన ראה ధాతువు తులనను సూచిస్తుంది. ‘చూసినట్లు ... చూస్తావా’ అనేది మూలంలోని ‘చూడడం’ అనే పదపునరుక్తిని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: אֱנוֹשׁ
  choice: మనిషి
  rationale: ఇది మానవుణ్ణి సాధారణ ఏకవచనంలో సూచిస్తుంది; ఈ పదంలో కొన్నిసార్లు కనిపించే మర్త్యత్వం లేదా బలహీనత భావాన్ని ప్రధాన వాక్యంలో అతిగా స్పష్టీకరించకుండా, పాదసూచికలో తెలియజేస్తుంది.
theological_decisions:
- issue: దేవుని దర్శనశక్తిని గురించి మానవరూపక భాష
  choice: ‘మాంసపు కళ్లు’ మరియు మనిషిలా చూడడం అనే స్పష్టమైన వ్యత్యాసాన్ని అలాగే ఉంచడం
  alternative: ‘నీవు మనుషుల్లా బాహ్యరూపాన్ని బట్టి తీర్పు తీరుస్తావా?’ అని వివరణాత్మకంగా మార్చడం
  rationale: మూలపాఠం దేవుని గ్రహణశక్తిని శరీరబద్ధమైన మానవ దృష్టితో అలంకారికంగా పోలుస్తుంది. దాన్ని తీర్పు గురించి వ్యాఖ్యానంగా మార్చకుండా అసలు వేదాంత ఉద్రిక్తతను నిలుపాలి.
- issue: אֱנוֹשׁ అనే సాధారణ ఏకవచనం
  choice: మనిషి
  alternative: మర్త్యుడు
  rationale: ‘మనిషి’ సాధారణ ప్రతినిధి ఏకవచన భావాన్ని సహజమైన ఆధునిక తెలుగులో ఇస్తుంది. ‘మర్త్యుడు’ మూలపదంలోని బలహీనత ఛాయను ముందుకు తెస్తుంది గాని, సందర్భం తప్పనిసరిగా దానిని ప్రధానార్థంగా చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా ఉండే ప్రశ్నారూపం వాడబడింది. ‘మాంసపు కళ్లు’ అనే మూలంలోని దృశ్యరూపకాన్ని సరళీకరించకుండా నిలిపి, ‘నీవు’ రూపంతో యోబు దేవునితో నేరుగా మాట్లాడుతున్న స్వరాన్ని కాపాడింది.
