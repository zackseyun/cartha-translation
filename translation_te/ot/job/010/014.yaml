  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אִם חָטָ֥אתִי וּ/שְׁמַרְתָּ֑/נִי וּ֝/מֵ/עֲוֺנִ֗/י לֹ֣א תְנַקֵּֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/010/014.yaml
  text: If I sin[a], you watch me[b], and you will not acquit me of my iniquity.
translation:
  language: te
  text: నేను పాపం చేస్తే[a], నీవు నన్ను నిశితంగా గమనిస్తావు[b]; నా దోషం విషయంలో నన్ను నిర్దోషిగా ప్రకటించవు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నేను పాపం చేసి ఉంటే.”
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ “నిశితంగా గమనిస్తావు” అంటే రక్షణగా కాపాడడం కాదు; తప్పు కోసం దగ్గరగా పరిశీలించడం.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: చేస్తే
  rationale: షరతును సూచించే אִם భావాన్ని సహజమైన తెలుగు ‘చేస్తే’ నిర్మాణంతో నిలుపుతుంది; ‘చేసినప్పుడు’ అని సాధారణీకరించదు.
- source_word: חָטָאתִי
  choice: నేను పాపం చేస్తే
  rationale: Qal perfect 1cs అయినప్పటికీ, ఈ షరతుతో కూడిన ఫిర్యాదులో తెలుగు వర్తమాన షరతు సహజంగా ఉంటుంది; పూర్తయిన గతక్రియ భావం కూడా సాధ్యమేనని పాదసూచికలో ఉంచబడింది.
- source_word: וּשְׁמַרְתָּנִי
  choice: నీవు నన్ను నిశితంగా గమనిస్తావు
  rationale: ఇక్కడ שׁמר రక్షణగా కాపాడడం కంటే తప్పు కోసం దగ్గరగా పరిశీలించడం అనే సందర్భార్థం కలిగివుంది; ‘నిశితంగా గమనిస్తావు’ ఆ భావాన్ని స్పష్టం చేస్తుంది.
- source_word: וּמֵעֲוֺנִי
  choice: నా దోషం నుండి
  rationale: עָוֹן పాపకార్యం, దోషం లేదా దాని శిక్షను సూచించగలదు. న్యాయసంబంధ సందర్భంలో ‘దోషం’ నైతిక మరియు అపరాధ బాధ్యత భావాలను తగినంతగా నిలుపుతుంది.
- source_word: לֹא תְנַקֵּנִי
  choice: నన్ను నిర్దోషిగా ప్రకటించవు
  rationale: Piel נקה యొక్క న్యాయస్థాన సంబంధ భావమైన నిర్దోషిగా తేల్చడం లేదా విడుదల చేయడం ఇక్కడ ప్రధానమైనది; ‘శుద్ధి చేయవు’ అనే ఆచార సంబంధ భావాన్ని అనవసరంగా తీసుకురాదు.
theological_decisions:
- issue: נקה పదంలోని న్యాయసంబంధ భావమా, శుద్ధీకరణ భావమా
  choice: నన్ను నిర్దోషిగా ప్రకటించవు
  alternative: నన్ను శుద్ధి చేయవు; నన్ను శిక్షించకుండా విడిచిపెట్టవు
  rationale: చుట్టుపక్కల వాక్యభాగం దేవుడు పాపాన్ని గమనించి దోషిని విడుదల చేయకపోవడం అనే న్యాయస్థాన రూపకాన్ని కలిగివుంది. అందువల్ల న్యాయసంబంధ అనువాదం సరిపోతుంది; అయితే శిక్ష ఫలితాన్ని లేదా ఆచార శుద్ధిని పాఠ్యంలోకి బలవంతంగా చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. ‘నిర్దోషిగా ప్రకటించవు’ న్యాయసంబంధ భావాన్ని సాధారణ పాఠకునికి స్పష్టంగా అందిస్తుంది; మూలంలోని షరతు మరియు కాలార్థ అస్పష్టతను ప్రధాన పాఠ్యం, పాదసూచిక కలిసి నిలుపుతాయి.
