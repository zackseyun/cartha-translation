lexical_decisions:
- source_word: הֲלֹא
  choice: చేయలేదా?
  rationale: అవుననే జవాబును ఆశించే అలంకారప్రశ్న భావాన్ని సహజమైన తెలుగు ప్రశ్నారూపంలో నిలుపుతుంది.
- source_word: כֶחָלָב
  choice: పాలవలె
  rationale: כ ఉపసర్గ సూచించే పోలికను సంక్షిప్తంగా, గౌరవప్రదమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: תַּתִּיכֵנִי
  choice: నన్ను ... కుమ్మరించి
  rationale: హిఫిల్ రూపంలోని ద్రవాన్ని పోయడం లేదా కుమ్మరించడం అనే భావాన్ని పాల ఉపమానానికి అనుగుణంగా తెలియజేస్తుంది.
- source_word: וְכַגְּבִנָּה
  choice: జున్నువలె
  rationale: గడ్డకట్టిన పాల పదార్థాన్ని సూచించే גְּבִנָּהకు సహజమైన తెలుగు సమానార్థకం; నిర్దిష్టంగా ఆధునిక చీజ్‌ను సూచించకుండా మూలంలోని పాల రూపకాన్ని కాపాడుతుంది.
- source_word: תַּקְפִּיאַנִי
  choice: గడ్డకట్టించు
  rationale: కారణార్థక రూపంలో చిక్కబడేలా లేదా ఘనీభవించేలా చేయడం అనే భావాన్ని పాల పదార్థ సందర్భంలో స్పష్టంగా అందిస్తుంది.
