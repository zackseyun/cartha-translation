  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా ఉండేలా, అయినా కవితాత్మక గౌరవాన్ని నిలుపుతూ అనువదించబడింది. పాల నుంచి గడ్డకట్టిన పాల పదార్థం ఏర్పడే మూల రూపకం యథాతథంగా ఉంచబడింది.
