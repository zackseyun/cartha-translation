  text: Your hands shaped me and made me[a], together all around[c][b]; yet you swallow me up.
translation:
  language: te
  text: నీ చేతులు నన్ను మలిచి[a], నన్ను పూర్తిగా, అన్నివైపులా రూపొందించాయి[b]; అయినా నీవు నన్ను మింగివేస్తున్నావు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘రూపించి’ లేదా ‘ఆకృతి కల్పించి.’
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ పదబంధం అక్షరార్థంగా ‘కలసి, చుట్టూ’ అని ఉంటుంది; దేవుడు యోబును పూర్తిగా, అన్నివైపులా రూపొందించాడనే భావాన్ని వ్యక్తం చేస్తుంది.
    reason: cultural_note
  - marker: c
    text: లేదా ‘అయినా నీవు నన్ను నాశనం చేస్తున్నావు.’ హీబ్రూలో అక్షరార్థంగా ‘మింగివేస్తున్నావు’ అని ఉంది; ఇది నాశనాన్ని తెలిపే సజీవ రూపకం.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָדֶיךָ
  choice: నీ చేతులు
  rationale: మూలంలో బహువచన నామవాచకానికి ద్వితీయ పురుష ఏకవచన ప్రత్యయం ఉంది. దేవుని వ్యక్తిగత సృజనాత్మక కార్యాన్ని తెలిపే సజీవ రూపకాన్ని యథాతథంగా ఉంచుతుంది.
- source_word: עִצְּבוּנִי
  choice: నన్ను మలిచి
  rationale: పియేల్ రూపంలోని עצב ఇక్కడ ఉద్దేశపూర్వకంగా ఆకృతి కల్పించడం అనే అర్థాన్ని ఇస్తుంది. ‘మలిచి’ అనే పదం శిల్పి పనిని సూచించే భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: וַיַּעֲשׂוּנִי
  choice: నన్ను … చేశాయి
  rationale: עשה అనే సాధారణ ‘చేయు/నిర్మించు’ క్రియను ముందున్న ‘మలిచి’తో జతచేసి, సృష్టి కార్యానికి సంబంధించిన రెండు క్రియలనూ నిలుపుతుంది.
- source_word: יַחַד סָבִיב
  choice: చుట్టూ అన్నివైపులా సంపూర్ణంగా
  rationale: יַחַד మరియు סָבִיב కలయిక యోబును మొత్తంగా, ప్రతి వైపునా రూపొందించడాన్ని సూచిస్తుంది. పదేపదే అనువదిస్తే తెలుగులో అసహజంగా ఉండేందున, సమగ్రతను మరియు ప్రాదేశిక చిత్రాన్ని రెండింటినీ ఈ పదబంధం అందిస్తుంది.
- source_word: וַתְּבַלְּעֵנִי
  choice: అయినా నీవు నన్ను మింగివేస్తున్నావు
  rationale: בלע యొక్క సూటి అర్థమైన ‘మింగివేయు’ అనే విధ్వంస రూపకాన్ని నిలుపుతుంది. సందర్భంలోని సృష్టి–నాశన వైరుధ్యాన్ని ‘అయినా’ స్పష్టంగా తెలియజేస్తుంది; మూల సంధికారకం స్వతహాగా సాధారణ waw అయినప్పటికీ ఈ వ్యతిరేక భావం సందర్భం నుంచి వస్తుంది.
theological_decisions:
- issue: దేవుని సృష్టి కార్యానికి మానవరూప వర్ణన
  choice: ‘నీ చేతులు’ అనే స్పష్టమైన రూపకాన్ని, అలాగే ‘మలిచి … చేశాయి’ అనే జత క్రియలను నిలుపడం
  alternative: ‘నీవు నన్ను సృష్టించావు’ అని సాధారణీకరించడం
  rationale: యోబు విలాపంలో దేవుడు తనను సన్నిహితంగా, ఉద్దేశపూర్వకంగా రూపొందించాడనే భావమే వాదనకు బలం. రూపకాన్ని తొలగిస్తే ఆ వాక్చాతుర్య బలం తగ్గుతుంది.
- issue: దేవుని సృజనాత్మక శ్రద్ధకు, ఆయన చేస్తున్నట్లు యోబు ఆరోపించే నాశనానికి మధ్య ఉద్రిక్తత
  choice: ‘అయినా నీవు నన్ను మింగివేస్తున్నావు’ అని తీవ్రమైన వైరుధ్యాన్ని నిలుపడం
  alternative: ‘ఇప్పుడు నన్ను నాశనం చేస్తున్నావు’ అని రూపకాన్ని సడలించడం
  rationale: యోబు పలుకులో సృష్టించిన దేవుడే తనను నాశనం చేస్తున్నాడనే పరిష్కరించని ఉద్రిక్తత ఉద్దేశపూర్వకంగా ఉంది. అనువాదం దానిని సిద్ధాంతపరంగా సర్దుబాటు చేయకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన విలాప ధోరణి పాటించబడింది. ‘నీ చేతులు’ అనే మానవరూప చిత్రణను మృదువుచేయలేదు; ‘మింగివేస్తున్నావు’ అనే తీవ్రమైన రూపకాన్నీ అలాగే ఉంచారు. יחד סָבִיב యొక్క అసహజ పదక్రమాన్ని యాంత్రికంగా అనుసరించకుండా, దాని సమగ్రత మరియు ‘అన్నివైపులా’ అనే భావాలను సహజమైన తెలుగు క్రమంలో అందించారు.
