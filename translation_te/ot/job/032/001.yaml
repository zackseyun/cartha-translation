source:
  edition: WLC
  text: וַֽ/יִּשְׁבְּת֡וּ שְׁלֹ֤שֶׁת הָ/אֲנָשִׁ֣ים הָ֭/אֵלֶּה מֵ/עֲנ֣וֹת אֶת אִיּ֑וֹב כִּ֤י ה֖וּא צַדִּ֣יק בְּ/עֵינָֽי/ו־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/job/032/001.yaml
  text: So these three men stopped answering Job[a], because he was righteous in his own eyes.
translation:
  language: te
  text: అప్పుడు ఈ ముగ్గురు మనుషులు యోబుకు జవాబివ్వడం మానేశారు, ఎందుకంటే అతడు తన దృష్టిలో[a] నీతిమంతుడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరొక పాఠ సంప్రదాయం ప్రకారం: “ఎందుకంటే అతడు వారి దృష్టిలో నీతిమంతుడు.”'
    reason: textual_variant
lexical_decisions:
- source_word: וַיִּשְׁבְּתוּ
  choice: మానేశారు
  rationale: שׁבת ఇక్కడ ‘ఆపివేయడం/మానడం’ అనే భావంలో, ‘జవాబివ్వడం’ అనే క్రియతో వాడబడింది. ఆధునిక తెలుగులో ‘మానేశారు’ సహజంగా ఉండి, చర్య నిలిచిపోయిన భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: שְׁלֹשֶׁת הָאֲנָשִׁים הָאֵלֶּה
  choice: ఆ ముగ్గురు మనుషులు
  rationale: నిర్దేశక పదంతో కూడిన పుంలింగ బహువచన పదబంధాన్ని నేరుగా, సహజమైన తెలుగులో అందిస్తుంది; సందర్భంలో వీరు యోబు ముగ్గురు స్నేహితులు.
- source_word: מֵעֲנוֹת
  choice: జవాబివ్వడం
  rationale: ענה యొక్క infinitive construct ఇక్కడ ‘జవాబు చెప్పడం/ప్రత్యుత్తరం ఇవ్వడం’ అనే అర్థం. వాదోపవాద సందర్భంలో ‘జవాబివ్వడం’ సహజమైన ఎంపిక.
- source_word: אֶת אִיּוֹב
  choice: యోబుకు
  rationale: హీబ్రూ ప్రత్యక్ష కర్మ సూచికను తెలుగులో విడిగా అనువదించాల్సిన అవసరం లేదు. ‘జవాబివ్వడం’ అనే తెలుగు క్రియతో వ్యక్తి సాధారణంగా సంప్రదాన విభక్తిలో వస్తాడు; అందువల్ల ‘యోబుకు’ సహజంగా ఉంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: వారు జవాబివ్వడం మానేసిన కారణాన్ని పరిచయం చేస్తుంది; ఆధునిక తెలుగులో కారణ సంబంధాన్ని స్పష్టంగా చూపిస్తుంది.
- source_word: צַדִּיק
  choice: నీతిమంతుడు
  rationale: צַדִּיק లోని నైతిక-న్యాయ సంబంధ భావాన్ని నిలుపుతుంది; తెలుగు బైబిలు వాడుకలో తెలిసినదైనా, ఇప్పటికీ స్పష్టమైన పదం.
- source_word: בְּעֵינָיו
  choice: తన దృష్టికి తాను
  rationale: సరఫరా చేసిన మసొరెటిక్ పాఠంలో ఉన్న మూడవ పురుష ఏకవచన ప్రత్యయాన్ని నిలుపుతూ, వ్యక్తి తనను తాను అంచనా వేసుకున్నాడనే ప్రతిబింబ భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: యోబు నిజంగానే నీతిమంతుడని వచనం నిర్ధారిస్తున్నదా, లేక తన అంచనాలో నీతిమంతుడా?
  choice: “అతడు తన దృష్టికి తాను నీతిమంతుడిగా ఉన్నాడు” అని అనువదించి, ఇది యోబు స్వీయ అంచనా అని సూచించడం.
  alternative: “అతడు వారి దృష్టిలో నీతిమంతుడిగా ఉన్నాడు” అనే భిన్న పాఠ సంప్రదాయం.
  rationale: సరఫరా చేసిన WLC పాఠంలోని בְּעֵינָיו ఏకవచన ప్రత్యయం ‘అతని దృష్టిలో’ అని సూచిస్తుంది. ఈ అనువాదం యోబు నీతి గురించి అదనపు తీర్పు ఇవ్వకుండా కథనంలోని ఉద్రిక్తతను నిలుపుతుంది; బహువచన పాఠాన్ని పాదటిప్పణిలో భద్రపరుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘నీతిమంతుడు’ మూలంలోని నైతిక-న్యాయ భావాన్ని నిలుపుతుంది. ప్రధాన పాఠంలో ఏకవచన ‘తన దృష్టికి తాను’ ఉంచి, పాఠభేదాన్ని [a] ద్వారా సూచించాం.
