source:
  edition: WLC
  text: פֶּן תֹּ֣֭אמְרוּ מָצָ֣אנוּ חָכְמָ֑ה אֵ֖ל יִדְּפֶ֣/נּוּ לֹא אִֽישׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/032/013.yaml
  text: Lest you say[a], ‘We have found wisdom; God will vanquish him, not man.’
translation:
  language: te
  text: 'మీరు ఇలా అనకండి: “మేము జ్ఞానాన్ని కనుగొన్నాం; అతన్ని తరిమివేయగలది దేవుడే, మనిషి కాదు.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతన్ని ఓడించేది దేవుడే, మనిషి కాదు,” లేదా “అతనికి జవాబిచ్చేది దేవుడే, మనిషి కాదు,” లేదా “అతన్ని అణచివేసేది దేవుడే, మనిషి కాదు.” హీబ్రూ క్రియకు సాధారణంగా “తరిమివేయడం” లేదా “వెంటాడి పంపడం” అని అర్థం; అయితే ఇక్కడ అది యోబును ఓడించడం లేదా అతని వాదనను ఖండించడం అనే విస్తృత భావాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּן תֹּאמְרוּ
  choice: అని మీరు అనకండి
  rationale: פֶּן ఇక్కడ సంభవించగల వాదనకు వ్యతిరేకంగా హెచ్చరికను పరిచయం చేస్తుంది. సహజమైన ఆధునిక తెలుగులో నిషేధాత్మక హెచ్చరికగా వ్యక్తం చేశాం.
- source_word: מָצָאנוּ חָכְמָה
  choice: మేము జ్ఞానాన్ని కనుగొన్నాం
  rationale: హీబ్రూ పరిపూర్ణ క్రియ సూచించే సాధించామని చెప్పుకునే భావాన్ని, חָכְמָה యొక్క సాధారణ అర్థాన్ని నిలిపాం.
- source_word: אֵל
  choice: దేవుడు
  rationale: ఈ సందర్భంలో ఇది బలవంతుడిని సాధారణంగా కాక దేవుణ్ణే సూచిస్తుంది.
- source_word: יִדְּפֶנּוּ
  choice: అతన్ని ఓడించేది
  rationale: נדף యొక్క ప్రాథమిక భావం తరిమివేయడం; అయితే ఇక్కడ యోబును వాదనలో జయించడం లేదా ఖండించడం అనే విస్తృత సందర్భార్థం ఉండవచ్చు. ప్రధాన పాఠ్యంలో సహజంగా అర్థమయ్యే ‘ఓడించేది’ను ఎంచుకుని, మరింత అక్షరార్థ మరియు సందర్భార్థ ప్రత్యామ్నాయాలను పాదసూచికలో ఉంచాం.
- source_word: לֹא אִישׁ
  choice: మనిషి కాదు
  rationale: దేవునికీ మానవ ప్రతివాదికీ మధ్య ఉన్న సాధారణ ఏకవచన వ్యత్యాసాన్ని నిలిపే సహజ తెలుగు రూపం.
theological_decisions:
- issue: אֵל יִדְּפֶנּוּ לֹא אִישׁ అనే వాక్యభాగపు భావం
  choice: అతన్ని ఓడించేది దేవుడే, మనిషి కాదు
  alternative: అతన్ని తరిమివేసేది దేవుడే, మనిషి కాదు; అతనికి జవాబిచ్చేది దేవుడే, మనిషి కాదు; అతన్ని అణచివేసేది దేవుడే, మనిషి కాదు
  rationale: క్రియ యొక్క మూలచిత్రం ‘తరిమివేయడం’ అయినా, సందర్భంలో యోబును జయించడం, ఖండించడం, లేదా అతనికి సమాధానం చెప్పడం అనే భావం ఉండవచ్చు. అస్పష్టతను పాదసూచికలో కాపాడాం.
- issue: దేవునితో వ్యత్యాసంలో సాధారణ ఏకవచన אִישׁ
  choice: మనిషి
  alternative: ఒక మానవుడు
  rationale: ఇది ప్రత్యేకంగా పురుషుడిని కాక మానవ ప్రతివాదిని సాధారణంగా సూచిస్తుంది; ‘మనిషి’ తెలుగు భాషలో సహజమైన ప్రతినిధి ఏకవచనం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం. ‘దేవుడే’లోని ఉద్ఘాటన హీబ్రూ దేవుడు/మనిషి వ్యత్యాసాన్ని స్పష్టం చేస్తుంది; పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో చేర్చబడింది.
