  text: They are dismayed[a]; they answer no more[b]; words have departed from them.
translation:
  language: te
  text: వారు దిగ్భ్రాంతి చెందారు[a]; ఇక జవాబు చెప్పలేదు; మాటలు వారిని విడిచిపోయాయి[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వారు కుంగిపోయారు’ / ‘వారు కలవరపడ్డారు’; హీబ్రూ క్రియ విరిగిపోవడం లేదా దిగ్భ్రాంతి చెందడం అనే భావాలను ఇవ్వగలదు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘మాటలు వారి నుండి తొలగిపోయాయి’; అంటే, వారికి చెప్పడానికి ఇక ఏమీ లేదని సూచించే ప్రయోగం.
