translation:
  language: te
  text: ఎలీహూ యోబుతో మాట్లాడడానికి వేచి ఉన్నాడు[a], ఎందుకంటే వారు అతనికంటే వయస్సులో పెద్దవారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'పదశః: ‘ఎలీహూ యోబును మాటలలో వేచాడు’; భావం, యోబుతో మాట్లాడడానికి అతడు వేచి ఉన్నాడని.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וֶאֱלִיהוּ
  choice: ఎలీహూ
  rationale: వావ్ సంధి కథన అనుసంధానాన్ని సూచిస్తుంది; తెలుగులో ప్రత్యేకంగా ‘మరియు’ అని పెట్టకుండానే సహజంగా కొనసాగించవచ్చు. పేరును ‘ఎలీహూ’గా లిప్యంతరీకరించాం.
- source_word: חִכָּה אֶת אִיּוֹב בִּדְבָרִים
  choice: యోబుతో మాట్లాడడానికి వేచి ఉన్నాడు
  rationale: పదశః నిర్మాణం ‘యోబును మాటలలో వేచాడు.’ సందర్భంలో దీని భావం యోబుతో మాట్లాడేందుకు వేచి ఉండడమే; తెలుగులో సహజంగా, స్పష్టంగా ఈ విధంగా వ్యక్తీకరించాం.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ఎలీహూ వేచి ఉండడానికి కారణాన్ని తెలిపే కారణార్థక సంధిగా అనువదించాం.
- source_word: זְקֵנִים הֵמָּה מִמֶּנּוּ לְיָמִים
  choice: వారు అతనికంటే వయస్సులో పెద్దవారు
  rationale: ఇక్కడ זְקֵנִים పదం పదవిగల ‘పెద్దలు’ అనే అర్థంలో కాక, తులనాత్మకంగా ఎక్కువ వయస్సు గలవారిని సూచిస్తుంది. לְיָמִים అనే ‘రోజుల పరంగా’ ఉన్న హీబ్రూ నుడికారాన్ని సహజ తెలుగులో ‘వయస్సులో’గా ఇచ్చాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని వాడాం. హీబ్రూ నుడికారాన్ని ప్రధాన పాఠంలో స్పష్టంగా తెలిపి, పదశః రూపాన్ని పాదసూచికలో నిలిపాం.
