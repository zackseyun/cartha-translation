  edition: WLC
  text: וַ/יַּ֤רְא אֱלִיה֗וּא כִּ֘י אֵ֤ין מַעֲנֶ֗ה בְּ֭/פִי שְׁלֹ֥שֶׁת הָ/אֲנָשִׁ֗ים וַ/יִּ֥חַר אַפּֽ/וֹ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/job/032/005.yaml
  text: When Elihu saw that there was no answer in the mouth of the three men[a], his anger burned.
translation:
  language: te
  text: ఆ ముగ్గురు మనుష్యుల నోట జవాబు లేదని ఎలీహు చూసినప్పుడు[a], అతని కోపం రగులుకుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ మూలంలో అక్షరార్థంగా, “ఆ ముగ్గురు మనుష్యుల నోట జవాబు లేదు”; అంటే, వారు చెప్పడానికి జవాబు ఏదీ లేకపోయింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: చూసినప్పుడు
  rationale: వావ్-క్రమక్రియ కథనాన్ని ముందుకు నడిపిస్తూ, ఎలీహు గమనించిన విషయం అతని ప్రతిస్పందనకు కాలసంబంధ నేపథ్యంగా నిలుస్తుంది; తెలుగులో ‘చూసినప్పుడు’ సహజంగా ఈ సంబంధాన్ని తెలియజేస్తుంది.
- source_word: אֱלִיהוּא
  choice: ఎలీహు
  rationale: హీబ్రూ వ్యక్తినామాన్ని ఆధునిక తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: כִּי
  choice: అని
  rationale: ఇక్కడ כִּי ఎలీహు చూసిన విషయాన్ని పరిచయం చేస్తుంది; కారణార్థం కంటే విషయార్థకమైన ‘అని’ సరిపోతుంది.
- source_word: אֵין מַעֲנֶה
  choice: జవాబు లేదు
  rationale: గతకాల కథనంలో ఉన్న అస్తిత్వ నిరాకరణను తెలుగులో సహజమైన రూపంలో ఇచ్చాం; యోబుకు ప్రత్యుత్తరం చెప్పలేని స్థితిని ‘జవాబు’ స్పష్టంగా సూచిస్తుంది.
- source_word: בְּפִי
  choice: నోట
  rationale: హీబ్రూ ‘నోటిలో’ అనే దృశ్యరూపాన్ని సంక్షిప్తమైన సహజ తెలుగు ప్రయోగంతో నిలిపాం; ఇది వారికి చెప్పడానికి జవాబు లేకపోవడాన్ని సూచించే నుడికారం.
- source_word: שְׁלֹשֶׁת הָאֲנָשִׁים
  choice: ఆ ముగ్గురు మనుష్యులు
  rationale: ముందే ప్రస్తావించబడిన ముగ్గురిని నిర్దిష్టంగా సూచిస్తూ మూలంలోని లెక్కింపును, ‘మనుష్యులు’ అనే పదాన్ని నిలిపాం.
- source_word: וַיִּחַר אַפּוֹ
  choice: అతని కోపం రగులుకుంది
  rationale: అక్షరార్థంగా ముక్కు మండడాన్ని సూచించే హీబ్రూ నుడికారంలోని ఉష్ణతా రూపకాన్ని సహజ తెలుగులో కాపాడుతూ, కేవలం ‘కోపపడ్డాడు’ అనే సాదా భావానువాదాన్ని నివారించాం.
