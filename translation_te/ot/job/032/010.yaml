  text: Therefore I say[a], ‘Listen to me; I too will declare my knowledge.’
translation:
  language: te
  text: 'కాబట్టి నేను చెబుతున్నాను[a]: “నా మాట విను; నేను కూడా నాకు తెలిసినది తెలియజేస్తాను.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, “కాబట్టి నేను అన్నాను: ‘నా మాట విను; నేను కూడా నాకు తెలిసినది తెలియజేస్తాను.’” హీబ్రూ క్రియారూపం అక్షరార్థంగా భూతకాలంలోని “నేను అన్నాను” అని అనువదించవచ్చు; అయితే ఈ సందర్భంలో అది ప్రస్తుతం చేస్తున్న ప్రకటన భావాన్ని కలిగి ఉండవచ్చు.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: కాబట్టి
  rationale: ముందటి వాదన నుంచి తీసుకున్న ముగింపును సూచించే సహజమైన ఆధునిక తెలుగు అనుసంధాన పదం.
- source_word: אָמַרְתִּי
  choice: నేను చెబుతున్నాను
  rationale: రూపపరంగా భూతకాల సంపూర్ణ క్రియ అయినప్పటికీ, ఈ ప్రసంగ సందర్భంలో ప్రస్తుతం చేస్తున్న ప్రకటనగా పనిచేస్తుంది; వర్తమాన రూపం ఆ సజీవ భావాన్ని నిలుపుతుంది.
- source_word: שִׁמְעָה לִּי
  choice: నా మాట విను
  rationale: ఏకవచన ఆజ్ఞను, శ్రద్ధగా ఆలకించాలనే భావాన్ని సహజమైన తెలుగు నుడికారంలో వ్యక్తం చేస్తుంది.
- source_word: אֲחַוֶּה
  choice: తెలియజేస్తాను
  rationale: ఏదైనా తెలిసేలా చేయడం లేదా ప్రకటించడం అనే భావాన్ని ఇస్తుంది; ‘వివరిస్తాను’ అని అతిగా అర్థనిర్ణయం చేయదు.
- source_word: דֵּעִי
  choice: నాకు తెలిసినది
  rationale: అక్షరార్థమైన ‘నా జ్ఞానం’ కంటే సాధారణ ఆధునిక తెలుగులో సహజంగా ఉండి, వక్త తనకు తెలిసినదాన్ని ప్రకటిస్తున్నాడనే జ్ఞానసంబంధ భావాన్ని కాపాడుతుంది.
- source_word: אַף אֲנִי
  choice: నేను కూడా
  rationale: ఇతరులతోపాటు తాను సైతం మాట్లాడతాననే చేర్పు మరియు ఉద్ఘాటనను సహజంగా వ్యక్తం చేస్తుంది.
