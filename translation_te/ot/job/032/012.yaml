source:
  edition: WLC
  text: וְ/עָֽדֵי/כֶ֗ם אֶתְבּ֫וֹנָ֥ן וְ/הִנֵּ֤ה אֵ֣ין לְ/אִיּ֣וֹב מוֹכִ֑יחַ עוֹנֶ֖ה אֲמָרָ֣י/ו מִ/כֶּֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/job/032/012.yaml
  text: I paid close attention to you[a], and behold, there was no one among you to refute Job[b], to answer his words.
translation:
  language: te
  text: నేను మిమ్మల్ని శ్రద్ధగా గమనించాను[a]. ఇదిగో, యోబును ఖండించి అతని మాటలకు జవాబిచ్చేవాడు మీలో ఎవరూ లేరు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నేను మీపై శ్రద్ధగా దృష్టి పెట్టాను.” హీబ్రూ క్రియ శ్రద్ధతో పరిశీలించడం లేదా జాగ్రత్తగా గమనించడం అనే భావాన్ని ఇస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “యోబును గద్దించేవాడు” లేదా “అతని తప్పును దిద్దేవాడు.” హీబ్రూ పదం వాదనలో ఖండించడాన్ని లేదా గద్దించి సరిదిద్దడాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָדֵיכֶם אֶתְבּוֹנָן
  choice: నేను మీ మాటలను శ్రద్ధగా పరిశీలించాను
  rationale: בין యొక్క హిత్‌పోలేల్ రూపం శ్రద్ధగా గమనించడం లేదా ఆలోచించి పరిశీలించడం అనే భావాన్ని ఇస్తుంది. సందర్భంలో ఎలీహూ వారి వాదనలను జాగ్రత్తగా విన్నాడనే భావం సహజంగా వ్యక్తమవుతుంది; ‘మీ మాటలను’ అనేది తెలుగులో అవసరమైన సందర్భస్పష్టతను అందిస్తుంది.
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: వక్త తాను గమనించిన ఫలితాన్ని బలంగా పరిచయం చేసే హీబ్రూ సంభాషణ సూచికను నిలుపుతుంది.
- source_word: אֵין לְאִיּוֹב מוֹכִיחַ
  choice: యోబును ఖండించేవాడూ ... ఎవరూ లేరు
  rationale: יכח నుంచి వచ్చిన מוֹכִיחַ వాదనలో తప్పని చూపడం, ప్రతివాదంతో ఖండించడం, లేదా గద్దించడం అనే అర్థాలను కలిగి ఉంటుంది. ఈ వాదప్రతివాద సందర్భంలో ‘ఖండించేవాడు’ ప్రధాన భావాన్ని సహజంగా అందిస్తుంది.
- source_word: עוֹנֶה אֲמָרָיו
  choice: అతని మాటలకు జవాబిచ్చేవాడూ
  rationale: ענה మరియు ‘అతని మాటలు’ కలయిక యోబు చెప్పిన వాటికి సమాధానం ఇవ్వడాన్ని సూచిస్తుంది. తెలుగు వాక్య నిర్మాణంలో కర్తను స్పష్టంగా ఉంచుతూ మూల భావాన్ని కాపాడుతుంది.
- source_word: מִכֶּם
  choice: మీలో
  rationale: సమూహం నుంచి ఒక్కరూ లేరనే భావాన్ని తెలుగులో సహజంగా ‘మీలో ... ఎవరూ లేరు’ అని వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: מוֹכִיחַ అనే పదంలో వాదనాత్మక ఖండన మరియు నైతిక గద్దింపు రెండూ సాధ్యమవడం
  choice: ఖండించేవాడు
  alternative: గద్దించేవాడు / తప్పు దిద్దేవాడు
  rationale: యోబు మాటలకు జవాబివ్వడం అనే సమాంతర పదబంధం వల్ల ఇక్కడ వాదనలో ప్రతివాదంతో తప్పని చూపే భావం ముందుంటుంది. ఇతర సాధ్యార్థాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన వాక్యనిర్మాణం వాడబడింది. ‘ఇదిగో’ ద్వారా మూలంలోని వాక్చాతుర్య బలం నిలుపబడింది; ‘ఖండించేవాడు’ ద్వారా వాదప్రతివాద సందర్భం స్పష్టమవుతుంది, కాగా పదంలోని విస్తృతార్థం పాదసూచికలో భద్రపరచబడింది.
