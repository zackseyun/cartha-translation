translation:
  language: te
  text: అతడు నాకు వ్యతిరేకంగా మాటలు పేర్చలేదు[a]; నేనూ మీ పలుకులతో అతనికి జవాబివ్వను[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతడు నాకు మాటలను క్రమంగా అమర్చలేదు.” హీబ్రూ క్రియకు మాటలను క్రమపరచడం, పేర్చడం, లేదా వాదనగా సిద్ధం చేయడం అనే భావాలు ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “నేను మీ వాదనలతో అతనికి జవాబివ్వను.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עָרַךְ
  choice: పేర్చలేదు
  rationale: ఈ క్రియకు ‘క్రమంగా అమర్చడం, సిద్ధపరచడం’ అనే ప్రాథమిక భావం ఉంది; వాదప్రసంగ సందర్భంలో మాటలను ఎదుటివానికి వ్యతిరేకంగా పేర్చడం అనే భావాన్ని ఇది నిలుపుతుంది.
- source_word: אֵלַי
  choice: నాకు ఎదిరిగా
  rationale: ఉపసర్గకు ‘నా వైపు/నాతో’ అనే సాధారణ భావం ఉన్నా, ఈ వాద సందర్భంలో మాటలను ఏలీహుకు వ్యతిరేకంగా ఉద్దేశించడం సూచితం. ‘ఎదిరిగా’ ఆ సందర్భార్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: מִלִּין
  choice: మాటలను
  rationale: ఈ అరామీయ ప్రభావమున్న బహువచనం పలికిన మాటలు లేదా ప్రసంగాన్ని సూచిస్తుంది; ‘మాటలు’ ప్రత్యక్షమైన, సహజమైన అనువాదం.
- source_word: אִמְרֵיכֶם
  choice: మీ పలుకులతో
  rationale: ముందటి ‘మాటలు’ అనే పదంతో మూలంలోని పదభేదాన్ని కొంత నిలుపుతూ, בְּ యొక్క సాధనార్థాన్ని ‘తో’ ద్వారా వ్యక్తం చేస్తుంది.
- source_word: אֲשִׁיבֶנּוּ
  choice: అతనికి జవాబివ్వను
  rationale: హిఫిల్ రూపం ఇక్కడ ‘జవాబివ్వడం’ అని అర్థం; ఏకవచన పుంలింగ ప్రత్యయం యోబును సూచిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కానీ సాధారణ పాఠకులకు స్పష్టమైన శైలి. ‘మాటలు/పలుకులు’ అనే భేదం మూలంలోని מִלִּין/אִמְרֵיכֶם పదభేదాన్ని ప్రతిబింబిస్తుంది; ‘పేర్చడం’ మూలక్రియ యొక్క దృశ్యాన్ని కాపాడుతుంది.
