source:
  edition: WLC
  text: וַ/יִּ֤חַר אַ֨ף אֱלִיה֣וּא בֶן בַּרַכְאֵ֣ל הַ/בּוּזִי֮ מִ/מִּשְׁפַּ֪חַ֫ת רָ֥ם בְּ֭/אִיּוֹב חָרָ֣ה אַפּ֑/וֹ עַֽל צַדְּק֥/וֹ נַ֝פְשׁ֗/וֹ מֵ/אֱלֹהִֽים׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/032/002.yaml
  text: Then Elihu son of Barakel the Buzite[a], from the family of Ram, burned with anger against Job; his anger burned because he justified himself rather than God.
translation:
  language: te
  text: అప్పుడు రాము వంశానికి చెందిన బూజీయుడైన బరకేలు కుమారుడు ఎలీహూకు యోబుపై కోపం మండింది. దేవునికంటే తనను తాను ఎక్కువ నీతిమంతునిగా నిరూపించుకున్నందుకు[a] అతని కోపం మండింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దేవునిని సమర్థించడంకంటే తనను తాను సమర్థించుకున్నందుకు.”
    reason: హీబ్రూ వాక్యనిర్మాణం క్లిష్టంగా ఉంది. ప్రధాన పాఠం తులనాత్మక భావాన్ని స్పష్టంగా తెలియజేస్తుంది; ఈ ప్రత్యామ్నాయం యోబు దేవునికంటే తన స్వపక్ష సమర్థనకే ప్రాధాన్యం ఇచ్చాడనే భావాన్ని నిలుపుతుంది.
lexical_decisions:
- source_word: וַיִּחַר אַף / חָרָה אַפּוֹ
  choice: కోపం మండింది / అతని కోపం మండింది
  rationale: కోపం ‘మండడం’ అనే హీబ్రూ రూపకాన్ని సహజమైన ఆధునిక తెలుగులో నిలిపి, మూలంలోని పునరుక్తిని కూడా కాపాడుతుంది.
- source_word: אֱלִיהוּא בֶן בַּרַכְאֵל
  choice: బరకేలు కుమారుడు ఎలీహూ
  rationale: వ్యక్తినామాలను తెలుగు ధ్వన్యనుసారంగా లిప్యంతరీకరించి, వంశసంబంధాన్ని నేరుగా వ్యక్తం చేసింది.
- source_word: הַבּוּזִי
  choice: బూజీయుడు
  rationale: నిర్దిష్ట జాతి లేదా వంశ సంబంధాన్ని సూచించే పదాన్ని తెలుగు వ్యక్తివాచక రూపంలో అందించింది.
- source_word: מִמִּשְׁפַּחַת רָם
  choice: రాము వంశానికి చెందిన
  rationale: מִשְׁפָּחָה సూచించే కుటుంబం లేదా వంశ సమూహ భావాన్ని ఈ సందర్భంలో సహజంగా తెలియజేస్తుంది.
- source_word: בְּאִיּוֹב
  choice: యోబు మీద
  rationale: కోపం ఎవరిపై మళ్లిందో తెలిపే בְ ప్రయోగానికి సహజమైన తెలుగు సమానం.
- source_word: צַדְּקוֹ נַפְשׁוֹ
  choice: తననే నీతిమంతునిగా సమర్థించుకున్నందుకు
  rationale: צדק క్రియలోని న్యాయపరమైన ‘నీతిమంతుడని నిర్ధారించడం/సమర్థించడం’ భావాన్ని, נַפְשׁוֹ యొక్క ఆత్మనిర్దేశక ప్రయోగాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: מֵאֱלֹהִים
  choice: దేవునికంటే
  rationale: מִן యొక్క తులనాత్మక భావాన్ని నిలిపి, యోబు తన పక్షాన్ని దేవుని పక్షంకంటే సమర్థించాడనే ఉద్రిక్తతను కాపాడుతుంది.
theological_decisions:
- issue: עַל צַדְּקוֹ נַפְשׁוֹ מֵאֱלֹהִים అనే వాక్యభాగంలో యోబు చేసిన తప్పు యొక్క అర్థం
  choice: దేవునికంటే తననే నీతిమంతునిగా సమర్థించుకున్నందుకు
  alternative: తాను దేవునికంటే ఎక్కువ నీతిమంతుడని భావించినందుకు
  rationale: ప్రధాన పాఠం యోబు తనను సమర్థించుకోవడం దేవుని సమర్థించడంకంటే ముందుకు వచ్చిందనే తులనాత్మక విరోధాన్ని నిలుపుతుంది. ప్రత్యామ్నాయం నైతిక ఆధిక్యాన్ని మరింత స్పష్టంగా చెబుతుంది కాబట్టి దానిని పాదసూచికలో ఉంచింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే గంభీరతను కోల్పోకుండా అనువదించబడింది. హీబ్రూ మూలంలోని ‘కోపం మండింది’ అనే పునరుక్తి ఉద్దేశపూర్వకంగా నిలుపబడింది.
