  text: And his anger burned against his three friends because they had found no answer[a], yet they had condemned Job.
translation:
  language: te
  text: వారు జవాబు కనుగొనకపోయినా యోబును దోషిగా తీర్చినందుకు, అతని ముగ్గురు స్నేహితుల మీద అతని కోపం మండింది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘యోబును దుష్టుడిగా ప్రకటించారు’; లేదా, ‘యోబును దుష్టుడిగా పరిగణించారు.’
    reason: וַיַּרְשִׁיעוּ అనే క్రియకు న్యాయపరంగా ‘దోషిగా ప్రకటించడం’ అనే భావంతో పాటు, ఒకరిని దుష్టుడిగా పరిగణించడం అనే భావం కూడా ఉండవచ్చు.
lexical_decisions:
- source_word: וּבִשְׁלֹשֶׁת רֵעָיו
  choice: అతని ముగ్గురు స్నేహితుల మీద
  rationale: חָרָה אַף అనే కోపాన్ని సూచించే నుడికారంతో వచ్చిన ב ఇక్కడ కోపం ఎవరిమీద ఉందో తెలియజేస్తుంది. అందువల్ల సహజమైన తెలుగులో ‘మీద’ అని అనువదించాం.
- source_word: חָרָה אַפּוֹ
  choice: అతని కోపం మండింది
  rationale: అక్షరార్థంగా శరీర భాగాన్ని సూచించే హెబ్రీ నుడికారాన్ని కాకుండా, దానిలోని ‘కోపం మండడం’ అనే రూపకాన్ని సహజమైన ఆధునిక తెలుగులో నిలిపాం.
- source_word: עַל אֲשֶׁר
  choice: కాబట్టి
  rationale: ఈ పదబంధం అతని కోపానికి కారణాన్ని పరిచయం చేస్తుంది. తెలుగు వాక్య నిర్మాణానికి అనుగుణంగా కారణాన్ని ముందుంచి ‘కాబట్టి’ అని ఇచ్చాం.
- source_word: לֹא מָצְאוּ מַעֲנֶה
  choice: వారు జవాబు కనుగొనకపోయినా
  rationale: מַעֲנֶה అంటే ‘జవాబు’ లేదా ‘ప్రత్యుత్తరం.’ వాదప్రతివాద సందర్భంలో ‘జవాబు’ సహజంగా ఉంది; తరువాతి చర్యతో ఉన్న వైరుధ్యాన్ని ‘కపోయినా’ తెలియజేస్తుంది.
- source_word: וַיַּרְשִׁיעוּ
  choice: దోషిగా తీర్చారు
  rationale: רשע ధాతువు హిఫీల్ రూపం ఇక్కడ ఒకరిని దోషిగా ప్రకటించడం లేదా ఖండించడం అనే న్యాయనిర్ణయ భావాన్ని కలిగి ఉంది. ‘దోషిగా తీర్చారు’ ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: אֶת אִיּוֹב
  choice: యోబును
  rationale: ప్రత్యక్ష కర్మ సూచికతో వచ్చిన వ్యక్తినామాన్ని ప్రామాణిక తెలుగు రూపంలో ఇచ్చాం.
- source_word: וַ
  choice: కపోయినా
  rationale: వావ్ సాధారణంగా ‘మరియు’ అనే అనుసంధానార్థం ఇవ్వగలిగినా, ఇక్కడ జవాబు దొరకకపోవడం మరియు అయినప్పటికీ యోబును దోషిగా తీర్చడం మధ్యనున్న వైరుధ్యాన్ని తెలుగు ఉపవాక్య రూపంలో వ్యక్తం చేశాం.
theological_decisions:
- issue: స్నేహితులు యోబుపట్ల చేసిన చర్య యొక్క భావం
  choice: యోబును దోషిగా తీర్చారు
  alternative: యోబును దుష్టుడిగా ప్రకటించారు / యోబును దుష్టుడిగా చూశారు
  rationale: హిఫీల్ రూపంలోని וַיַּרְשִׁיעוּ వాదన సందర్భంలో న్యాయనిర్ణయ లేదా ప్రకటనా భావాన్ని సహజంగా కలిగి ఉంది. ‘దోషిగా తీర్చారు’ అనే అనువాదం వారు యోబును ఖండించారనే భావాన్ని ఉంచుతుంది; అతని అంతరంగ స్థితి గురించి అదనపు సిద్ధాంత నిర్ణయాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే గంభీరతను నిలుపుతూ అనువదించాం. హెబ్రీ కోప నుడికారంలోని రూపకాన్ని ‘కోపం మండింది’గా ఉంచాం. మూలంలోని కారణ సంబంధాన్ని తెలుగు సహజ వాక్యక్రమం కోసం ముందుకు మార్చాం; స్నేహితులకు జవాబు లేకపోవడం మరియు అయినా యోబును దోషిగా తీర్చడం మధ్యనున్న ఉద్రిక్తతను ‘కపోయినా’తో నిలిపాం.
