  text: Look[a], my belly is like wine that has no vent[b]; like new wineskins it is about to burst.
translation:
  language: te
  text: ఇదిగో, నా కడుపు తెరవని ద్రాక్షారసంలా ఉంది; కొత్త తోలు తిత్తుల్లా పగిలిపోబోతోంది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: ఇదిగో
  rationale: ఎలీహు చెప్పబోయే సజీవమైన ఉపమానంపై దృష్టి నిలిపే సూచక అవ్యయ బలాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: בִטְנִי
  choice: నా కడుపు
  rationale: ఈ పదం అక్షరార్థంగా కడుపును, విస్తృతంగా అంతరంగాన్ని సూచించగలదు. ఇక్కడ శారీరక ఒత్తిడినీ అంతర్గత భావోద్వేగాన్నీ కలిపే హీబ్రూ చిత్రాన్ని ‘నా కడుపు’ నిలుపుతుంది.
- source_word: כְּיַיִן
  choice: ద్రాక్షారసంలా
  rationale: మూలంలో కేవలం ‘ద్రాక్షారసంలా’ అనే పోలికే ఉంది; పులియడం సందర్భం ద్వారా సూచితమైనా మూలంలో స్పష్టంగా లేనందున దాన్ని ప్రధాన పాఠ్యంలో చేర్చలేదు.
- source_word: לֹא יִפָּתֵחַ
  choice: తెరవని
  rationale: నిఫాల్ రూపానికి నేరమైన అర్థం ‘తెరవబడని.’ విడుదలకు మార్గం లేని భావం సందర్భంలో ఉన్నప్పటికీ, తెలుగు పాఠ్యంలో మూలంలోని సంక్షిప్తతను, స్వల్ప అస్పష్టతను నిలిపింది.
- source_word: כְּאֹבוֹת חֲדָשִׁים
  choice: కొత్త ద్రాక్షారసపు తోలు తిత్తుల్లా
  rationale: ఇక్కడ אֹבוֹת దయ్యాలు లేదా ఆత్మలు కాక, ద్రవాలను—ప్రత్యేకంగా ద్రాక్షారసాన్ని—ఉంచే తోలు పాత్రలు. ‘తోలు తిత్తులు’ సాంస్కృతిక వస్తువును స్పష్టంగా తెలియజేస్తుంది.
- source_word: יִבָּקֵעַ
  choice: అది పగిలిపోబోతోంది
  rationale: בקע అంటే చీలిపోవడం లేదా పగిలిపోవడం. సందర్భంలోని తీవ్రమైన, సమీప ఒత్తిడిని సహజమైన తెలుగులో ‘పగిలిపోబోతోంది’ తెలియజేస్తుంది.
