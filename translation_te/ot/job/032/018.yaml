  yaml_path: translation/ot/job/032/018.yaml
  text: For I am full of words[a]; the spirit within me constrains me.
translation:
  language: te
  text: ఎందుకంటే, నేను మాటలతో నిండిపోయాను; నా అంతరంగంలోని ఆత్మ[a] నన్ను ఒత్తిడి చేస్తోంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “నా కడుపులోని ఆత్మ” లేదా “నా అంతర్భాగాల్లోని ఆత్మ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ఎలీహు తాను ఎందుకు మాట్లాడవలసి వస్తోందో వివరించే కారణార్థక సంబంధాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: מָלֵתִי מִלִּים
  choice: నేను మాటలతో నిండిపోయాను
  rationale: మాట్లాడవలసిన మాటలు లోపల పేరుకుపోయిన ప్రస్తుత స్థితిని, మూలంలోని ‘నిండుట’ రూపకాన్ని నిలుపుతూ వ్యక్తం చేస్తుంది.
- source_word: הֱצִיקַתְנִי
  choice: నన్ను ఒత్తిడి చేస్తోంది
  rationale: צוק క్రియలోని ఒత్తిడి, ఇరుకు మరియు మాట్లాడేలా నిర్బంధించే భావాలను ఒకే నిర్దిష్ట వ్యాఖ్యానంగా మార్చకుండా కాపాడుతుంది.
- source_word: רוּחַ
  choice: ఆత్మ
  rationale: ఇక్కడ గాలి లేదా శ్వాసకన్నా అంతర్గతంగా ప్రేరేపించే జీవాత్మ/ఉద్వేగ భావం సందర్భానికి సరిపోతుంది; మూలంలోని మానవశాస్త్రీయ పదాన్ని నిలుపుతుంది.
- source_word: בִּטְנִי
  choice: నా అంతరంగంలోని
  rationale: అక్షరార్థంగా ‘నా కడుపులోని’ అయిన ఈ హెబ్రీయ భావప్రయోగం అంతరంగ భాగాలను సూచిస్తుంది; ప్రధాన పాఠంలో సహజంగా అనువదించి, శరీర రూపకాన్ని పాదటిప్పణిలో ఉంచింది.
theological_decisions:
- issue: רוּחַ దేవుని ఆత్మను సూచిస్తుందా, ఎలీహు అంతర్గత ఆత్మను సూచిస్తుందా
  choice: నా అంతరంగంలోని ఆత్మ
  alternative: దేవుని ఆత్మ / నాలోని ప్రేరణ
  rationale: ఈ వాక్యంలోని בִּטְנִי (‘నా అంతర్భాగాల్లో’) అనే నిర్మాణం ఎలీహులోని అంతర్గత ఆత్మ లేదా ప్రేరణను ముందుకు తెస్తుంది. అయినా ‘ఆత్మ’ అనే పదాన్ని ఉంచడం ద్వారా సందర్భంలోని భావతీవ్రతను లేదా సాధ్యమైన ఆధ్యాత్మిక ప్రతిధ్వనిని అతిగా నిర్ధారించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సహజంగా ఉండేలా ‘అంతరంగం’ వాడబడింది. ‘మాటలతో నిండిపోయాను’ మరియు ‘ఒత్తిడి చేస్తోంది’ అనే రూపకాలు మూలంలోని అంతర్గత ఒత్తిడిని, కవితాత్మక ఉద్వేగాన్ని నిలుపుతాయి.
