  text: Then Elihu son of Barakel the Buzite answered and said[a], “I am young in days, and you are aged[b]; therefore I was timid and afraid to declare my knowledge to you.
translation:
  language: te
  text: 'అప్పుడు బూజీయుడైన బరకేలు కుమారుడు ఎలీహూ ఇలా జవాబిచ్చాడు: “నేను వయసులో చిన్నవాణ్ణి[a], మీరు వృద్ధులు. అందుచేత నేను వెనకంజ వేశాను; నాకు తెలిసినదాన్ని మీకు తెలియజేయడానికి భయపడ్డాను[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ అక్షరార్థం: “నేను దినాల్లో చిన్నవాణ్ణి”; అంటే, వయసులో చిన్నవాణ్ణి.'
    reason: cultural_note
  - marker: b
    text: లేదా “నేను వెనకంజ వేసి, నాకు తెలిసినదాన్ని మీకు చెప్పడానికి భయపడ్డాను.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמַר
  choice: ఇలా జవాబిచ్చాడు
  rationale: హీబ్రూ వచనంలోని సాంప్రదాయ ప్రసంగ పరిచయాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; ముందు నేరుగా ప్రశ్న అడిగారని ఇది తప్పనిసరిగా సూచించదు.
- source_word: אֱלִיהוּא בֶן בַּרַכְאֵל הַבּוּזִי
  choice: బూజీయుడైన బరకేలు కుమారుడు ఎలీహూ
  rationale: వ్యక్తుల పేర్లను తెలుగు లిపిలో ధ్వన్యనుకరణ చేసి, הַבּוּזִי అనే వంశీయ లేదా జాతిసంబంధ విశేషణాన్ని ‘బూజీయుడు’గా నిలిపింది.
- source_word: צָעִיר אֲנִי לְיָמִים
  choice: నేను వయసులో చిన్నవాణ్ణి
  rationale: అక్షరార్థంగా ‘దినాల్లో చిన్నవాణ్ణి’ అనే హీబ్రూ నుడికారాన్ని ఆధునిక తెలుగు పాఠకులకు సహజంగా అర్థమయ్యేలా ‘వయసులో చిన్నవాణ్ణి’గా అనువదించింది; మూల చిత్రాన్ని పాదసూచికలో తెలిపింది.
- source_word: יְשִׁישִׁים
  choice: వృద్ధులు
  rationale: అధిక వయస్సును గౌరవప్రదంగా, సంక్షిప్తంగా సూచించే సహజ తెలుగు పదం.
- source_word: עַל כֵּן
  choice: అందుచేత
  rationale: వయస్సులోని వ్యత్యాసం వల్ల కలిగిన సంకోచాన్ని స్పష్టమైన కారణ-ఫల సంబంధంతో కలుపుతుంది.
- source_word: זָחַלְתִּי וָאִירָא
  choice: వెనకంజ వేసి భయపడ్డాను
  rationale: అరుదైన זחל క్రియలోని వెనక్కి తగ్గడం లేదా జంకడం అనే భావాన్ని, దానితో జతైన ‘భయపడ్డాను’ అనే రెండవ క్రియను విడివిడిగా నిలుపుతుంది.
- source_word: מֵחַוּוֹת דֵּעִי אֶתְכֶם
  choice: నా అవగాహనను మీకు తెలియజేయడానికి
  rationale: חוה యొక్క ‘తెలియజేయడం’ అనే భావాన్నీ, דֵּעִי యొక్క జ్ఞానం లేదా అవగాహన అనే భావాన్నీ కాపాడుతుంది; ‘నా అభిప్రాయం’ అని బలహీనపరచకుండా సహజమైన తెలుగును అందిస్తుంది.
