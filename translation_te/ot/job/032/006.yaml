  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సహజమైన ప్రసంగశైలిని ఉపయోగించాం. ఎలీహూ తనకన్నా పెద్దవారితో మాట్లాడుతున్న సందర్భానికి తగిన మర్యాదను నిలిపి, హీబ్రూలోని రెండు సంకోచ క్రియలను కలిపివేయకుండా అనువదించాం.
