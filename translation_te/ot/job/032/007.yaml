  terminology: “జ్ఞానాన్ని తెలియజేయాలి” properly reflects the Hiphil sense of making wisdom known. “అనుకున్నాను” is a contextually valid rendering of אָמַרְתִּי, and the footnote appropriately supplies the more formal alternative “అన్నాను.”
