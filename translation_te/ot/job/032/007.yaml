translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కవితాత్మక గద్యశైలి. హీబ్రూ వ్యక్తీకరణలోని వయస్సు–సంవత్సరాల సమాంతరతను భావపరంగా నిలుపుతూ, తెలుగులో అపార్థం కలిగించే నిర్జీవ వ్యక్తీకరణను ప్రధాన పాఠ్యంలో స్పష్టం చేశాం.
