base_translation:
  language: en
  yaml_path: translation/ot/job/032/007.yaml
  text: I said[a], ‘Days should speak, and many years should make wisdom known.’
translation:
  language: te
  text: “వయసులో పెద్దవారు మాట్లాడాలి; ఎన్నో సంవత్సరాలు గడిపినవారు జ్ఞానాన్ని తెలియజేయాలి” అని నేను అనుకున్నాను.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వయసులో పెద్దవారు మాట్లాడాలి; ఎన్నో సంవత్సరాలు జ్ఞానాన్ని తెలియజేయాలి” అని నేను అన్నాను. హీబ్రూలో అక్షరార్థంగా “దినాలు,” “అనేక సంవత్సరాలు” అని ఉంది; ఇవి ముదిరిన వయసుగలవారిని సూచిస్తున్నాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָמַרְתִּי
  choice: అని నేను అనుకున్నాను
  rationale: ఈ క్రియకు ప్రాథమికంగా ‘నేను అన్నాను’ అనే అర్థం ఉన్నా, సందర్భంలో ఎలీహు తన మునుపటి అభిప్రాయాన్ని తెలియజేస్తున్నాడు. ఆధునిక తెలుగులో ‘అనుకున్నాను’ ఆ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది; ప్రత్యక్ష ఉక్తి నిర్మాణాన్ని కూడా నిలుపుతుంది.
- source_word: יָמִים
  choice: వయసులో పెద్దవారు
  rationale: అక్షరార్థంగా ‘దినాలు.’ ఇక్కడ అది అధిక దినాలు గడిపిన వృద్ధులను సూచించే లక్షణార్థ ప్రయోగం. తెలుగులో కేవలం ‘దినాలు మాట్లాడాలి’ అనడం భావాన్ని అస్పష్టం చేస్తుంది కాబట్టి ఉద్దేశిత మానవ సూచనను స్పష్టంగా ఇచ్చాం.
- source_word: יְדַבֵּרוּ
  choice: మాట్లాడాలి
  rationale: Piel imperfect ఇక్కడ భవిష్యద్వాణికన్నా ఎలీహు ఆశించిన సముచితత్వాన్ని సూచిస్తుంది. ‘మాట్లాడాలి’ ఆ నిరీక్షణను సహజంగా తెలియజేస్తుంది.
- source_word: וְרֹב שָׁנִים
  choice: ఎన్నో సంవత్సరాలు గడిపినవారు
  rationale: అక్షరార్థంగా ‘సంవత్సరాల సమృద్ధి/అనేక సంవత్సరాలు.’ సమాంతర పాదంలోని వృద్ధులనే సూచిస్తున్నందున తెలుగులో సహజమైన వ్యక్తి-సూచక రూపం వాడబడింది.
- source_word: יֹדִיעוּ
  choice: తెలియజేయాలి
  rationale: Hiphil రూపం ‘తెలిసేలా చేయడం, తెలియజేయడం’ అని అర్థం. ‘బోధించాలి’ కంటే ఇది మూలపద విస్తృతిని మెరుగ్గా నిలుపుతుంది.
- source_word: חָכְמָה
  choice: జ్ఞానాన్ని
  rationale: మూలంలోని అమూర్త నామవాచకమైన ‘జ్ఞానం’ను నేరుగా నిలుపుతూ, తెలుగు వాక్య నిర్మాణానికి అనుగుణంగా ద్వితీయా విభక్తి వాడబడింది.
