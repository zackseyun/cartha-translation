  yaml_path: translation/ot/job/032/021.yaml
  text: Please[a], let me not show partiality to any man[b], nor flatter any person.
translation:
  language: te
  text: దయచేసి, నేను ఏ మనిషిపట్లా పక్షపాతం చూపను గాక; ఏ వ్యక్తినీ పొగడ్తల బిరుదులతో సంబోధించను గాక.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఏ వ్యక్తినీ పొగడను.” హీబ్రూ క్రియకు పొగడ్తల బిరుదులతో సంబోధించడం అనే మరింత నిర్దిష్ట భావం ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל נָא
  choice: దయచేసి, ... చూపకుందును గాక
  rationale: אַל־נָא లోని మర్యాదతో కూడిన, ఆతురమైన ప్రతికూల కోరికను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אֶשָּׂא פְנֵי אִישׁ
  choice: ఏ మనిషిపట్లా పక్షపాతం చూపు
  rationale: అక్షరార్థంగా ‘మనిషి ముఖాన్ని ఎత్తడం’ అనే హీబ్రూ నుడికారానికి ఇక్కడ పక్షపాతం లేదా ప్రత్యేక అనుకూలత చూపడం అనే భావం ఉంది.
- source_word: אִישׁ
  choice: మనిషి
  rationale: మూలంలోని ఏకవచన పురుషవాచక పదాన్ని నిలుపుతూ, నిర్దిష్ట వ్యక్తి కాదు అనే భావాన్ని ‘ఏ ... పట్లా’ తెలియజేస్తుంది.
- source_word: וְאֶל אָדָם
  choice: ఏ వ్యక్తినీ
  rationale: אָדָם ఇక్కడ మానవ వ్యక్తిని సూచిస్తుంది; సమాంతర వాక్యంలో అనవసర పునరుక్తిని తగ్గించడానికి ‘వ్యక్తి’ సహజమైన ఎంపిక.
- source_word: לֹא אֲכַנֶּה
  choice: పొగడ్త పేర్లతో సంబోధించు
  rationale: כנה పియేల్ రూపం పేర్లు లేదా బిరుదులు పెట్టి సంబోధించడాన్ని సూచించగలదు; సందర్భంలో మెప్పుకోసం వాడే పొగడ్తపూర్వక సంబోధన భావాన్ని, కేవలం సాధారణ ‘పొగడు’ కంటే ఇది మరింత స్పష్టంగా నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. హీబ్రూ సమాంతర నిర్మాణాన్ని రెండు ప్రతికూల కోరికలుగా నిలిపి, అరుదైన రెండవ క్రియలోని నిజమైన అర్థసందిగ్ధతను పాదటిప్పణిలో సూచించాం.
