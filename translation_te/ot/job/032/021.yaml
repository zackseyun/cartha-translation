revisions:
- from: దయచేసి, నేను ఏ మనిషిపట్లా పక్షపాతం చూపకుందును గాక; ఏ వ్యక్తినీ పొగడ్త పేర్లతో సంబోధించకుందును గాక.[a]
  to: దయచేసి, నేను ఏ మనిషిపట్లా పక్షపాతం చూపను గాక; ఏ వ్యక్తినీ పొగడ్తల బిరుదులతో సంబోధించను గాక.[a]
  rationale: The revision retains the source’s two-coordinate negative wish and the semantic distinction between partiality and flattering address. It improves modern Telugu idiom and grammar without narrowing the source’s lexical ambiguity; that ambiguity remains represented in the footnote.
