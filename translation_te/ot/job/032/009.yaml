    text: లేదా “తీర్పును” లేదా “సరైనదేదో.” హీబ్రూ పదం మిష్పాట్ న్యాయం, తీర్పు, లేదా సరైన క్రమాన్ని సూచించవచ్చు.
    reason: lexical_alternative
  revision_rationale: The revision removes the added conditional ‘ఉన్నంత మాత్రాన’ and renders the first colon as a direct statement that wise people are not many. It also uses a direct negated verb in the second colon to retain the Hebrew’s compact parallel structure. The existing lexical footnote remains appropriate and its anchor is preserved.
