  text: לֹֽא רַבִּ֥ים יֶחְכָּ֑מוּ וּ֝/זְקֵנִ֗ים יָבִ֥ינוּ מִשְׁפָּֽט־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/032/009.yaml
  text: It is not the many who are wise[a], nor the old who understand justice.
translation:
  language: te
  text: 'జ్ఞానులు అనేకమంది కారు;

    వృద్ధులు న్యాయాన్ని గ్రహించరు.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “తీర్పును” లేదా “సరైనదేదో.” హీబ్రూ పదం మిష్పాట్ న్యాయం, తీర్పు, లేదా సరైన క్రమాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא רַבִּים יֶחְכָּמוּ
  choice: ఎక్కువమంది ఉన్నంత మాత్రాన జ్ఞానులు కారు
  rationale: హీబ్రూ వాక్యంలోని నిషేధాన్ని, వయస్సు లేదా సంఖ్య మాత్రమే జ్ఞానానికి హామీ కాదనే సామెతసదృశ భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది. רַבִּים‌ను సంఖ్యాపరమైన ‘ఎక్కువమంది’గా తీసుకుంది; ‘గొప్పవారు’ అనే భావాన్ని దిగుమతి చేయలేదు.
- source_word: וּזְקֵנִים
  choice: వృద్ధులు
  rationale: ఇక్కడ పదం అధికారిక పదవిలోని ‘పెద్దలు’కన్నా వయస్సులో పెద్దవారిని సూచిస్తోంది; సందర్భంలోని వయస్సు-జ్ఞానం వ్యత్యాసాన్ని ‘వృద్ధులు’ స్పష్టంగా నిలుపుతుంది.
- source_word: יָבִינוּ
  choice: గ్రహిస్తారని లేదు
  rationale: בין అనే క్రియలోని అర్థం చేసుకోవడం లేదా వివేచించడం అనే భావాన్ని సహజ తెలుగులో అందిస్తుంది; సమాంతర రెండో పాదంలో హీబ్రూ నిషేధపు పరిధిని కొనసాగిస్తుంది.
- source_word: מִשְׁפָּט
  choice: న్యాయమేమిటో
  rationale: מִשְׁפָּט‌కు న్యాయం, తీర్పు, సరైనది అనే అర్థవిస్తృతి ఉంది. సందర్భంలో నైతిక-న్యాయ వివేచనను సహజంగా తెలిపేందుకు ‘న్యాయమేమిటో’ ఎంచుకుంది; ఇతర సాధ్యార్థాలను పాదటిప్పణిలో ఉంచింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామెతసదృశ సమాంతర నిర్మాణాన్ని నిలుపుతూ సాధారణ పాఠకులకు సహజంగా ఉండే గౌరవప్రదమైన శైలి. ‘ఉన్నంత మాత్రాన’ అనే నిర్మాణం మూలంలోని సంక్షిప్త నిషేధాన్ని తెలుగులో సహజంగా స్పష్టం చేస్తుంది.
