  terminology: ‘వేచి ఉన్నాను’ appropriately renders וְהוֹחַלְתִּי in this context. ‘నిలిచిపోయారు’ retains the standing/stopping image of עָמְדוּ more closely than a bare interpretation of silence, and ‘ఇక జవాబివ్వలేదు’ accurately renders לֹא עָנוּ עוֹד.
  issues:
