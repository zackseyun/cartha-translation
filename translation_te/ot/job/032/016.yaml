  yaml_path: translation/ot/job/032/016.yaml
  text: And I waited[a], because they did not speak[b], because they stood still and answered no more.
translation:
  language: te
  text: వారు మాట్లాడలేదు కాబట్టి, వారు నిలిచిపోయి ఇక జవాబివ్వలేదు కాబట్టి నేను వేచి ఉన్నాను[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నేను ఆశతో ఎదురుచూశాను.’ ఈ క్రియకు నిరీక్షణతో కూడిన ఆశ అనే భావం ఉండవచ్చు; ఇక్కడి సందర్భం ‘వేచి ఉన్నాను’ అనే భావానికి అనుకూలంగా ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹחַלְתִּי
  choice: నేను వేచి ఉన్నాను
  rationale: יחל అనే క్రియకు నిరీక్షణతో ఆశపడడం అనే భావం కూడా ఉండవచ్చు; అయితే పెద్దవారు మౌనంగా ఉన్నప్పుడు ఎలీహూ తన మాటను ఆలస్యం చేసిన సందర్భంలో ‘వేచి ఉన్నాను’ సహజంగా సరిపోతుంది. ఆరంభ సంధికారకాన్ని తెలుగులో విడిగా అనువదించకపోవడం సహజ వాక్యప్రవాహానికి అనుకూలం.
- source_word: כִּי לֹא יְדַבֵּרוּ
  choice: ఎందుకంటే వారు మాట్లాడలేదు
  rationale: మొదటి כִּי ఎలీహూ వేచి ఉండడానికి కారణాన్ని తెలియజేస్తుంది; అసంపూర్ణ క్రియను ఈ సందర్భంలో గతకాల భావంతో అనువదించాం.
- source_word: כִּי עָמְדוּ
  choice: వారు ఆగిపోయి
  rationale: עָמְדוּ అక్షరార్థంగా ‘వారు నిలిచారు’; మాటల సందర్భంలో అది వారు మాట్లాడడం నిలిపివేశారని సూచిస్తుంది. తెలుగు సహజత కోసం ‘ఆగిపోయి’ అని ఇచ్చి, అక్షరార్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: לֹא עָנוּ עוֹד
  choice: ఇక జవాబివ్వలేదు
  rationale: עוֹד తో కూడిన ఈ పదబంధం వారు మరలా జవాబు చెప్పకపోవడాన్ని, వారి ప్రతిస్పందనలు ముగిసినట్లు తెలియజేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని వాడాం. హీబ్రూ వాక్యంలోని రెండు కారణవాచక ఉపవాక్యాల సంబంధాన్ని తెలుగులో స్పష్టంగా ఉంచుతూ, రెండవదాన్ని సెమీకోలన్ తరువాత సహజంగా ప్రవహించేలా ఇచ్చాం.
