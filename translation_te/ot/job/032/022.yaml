revisions:
- from: ఎందుకంటే, ముఖస్తుతి చేయడం నాకు తెలియదు[a]; అలా చేస్తే నా సృష్టికర్త నన్ను త్వరలోనే తీసివేస్తాడు[b].
  to: ఎందుకంటే, ముఖస్తుతి చేయడం నాకు తెలియదు[a]; అలా చేస్తే నా సృష్టికర్త నన్ను త్వరలోనే తీసుకుపోతాడు[b].
  rationale: 'The revision makes only a safe lexical and idiomatic adjustment: ‘తీసుకుపోతాడు’ reflects the broad ‘take/carry away’ sense of נשא more transparently than ‘తీసివేస్తాడు,’ while preserving the text’s ambiguity about death. The footnote wording is smoothed without changing its scope or interpretive restraint.'
