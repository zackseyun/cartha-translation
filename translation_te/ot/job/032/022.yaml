  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּ֤י לֹ֣א יָדַ֣עְתִּי אֲכַנֶּ֑ה כִּ֝/מְעַ֗ט יִשָּׂאֵ֥/נִי עֹשֵֽׂ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/job/032/022.yaml
  text: For I do not know how to flatter[b][a]; otherwise my Maker would soon carry me away.
translation:
  language: te
  text: ఎందుకంటే, ముఖస్తుతి చేయడం నాకు తెలియదు[a]; అలా చేస్తే నా సృష్టికర్త నన్ను త్వరలోనే తీసుకుపోతాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పొగడ్తల బిరుదులు ఇవ్వడం.’ హీబ్రూ క్రియ ఎవరినైనా పొగడ్తగా లేదా పక్షపాతంగా గౌరవ బిరుదులతో సంబోధించడాన్ని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘నా సృష్టికర్త నన్ను త్వరలోనే తీసుకుపోతాడు.’ హీబ్రూ పాఠం ‘చంపుతాడు’ అని స్పష్టంగా చెప్పదు; అయితే తీర్పుగా తొలగించడం సూచితమై ఉండవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: మునుపటి వచనంలో పక్షపాతం చూపనని చెప్పిన దానికి ఇది కారణాన్ని పరిచయం చేస్తుంది.
- source_word: לֹא יָדַעְתִּי
  choice: నాకు తెలియదు
  rationale: తదుపరి క్రియతో కలిసి, అలాంటి పని చేసే నేర్పు లేదా అలవాటు తనకు లేదనే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: אֲכַנֶּה
  choice: ముఖస్తుతి చేయడం
  rationale: పీయేల్ రూపంలోని ఈ అరుదైన క్రియకు బిరుదులతో సంబోధించడం లేదా పొగడ్తలతో అనుగ్రహం సంపాదించడం అనే భావం ఉండవచ్చు; సందర్భంలో ప్రతికూల భావాన్ని ‘ముఖస్తుతి’ సంక్షిప్తంగా అందిస్తుంది.
- source_word: כִּמְעַט
  choice: త్వరలోనే
  rationale: ఇక్కడ సమీపిస్తున్న పరిణామాన్ని సూచించే కాలార్థం సందర్భానికి సరిపోతుంది.
- source_word: יִשָּׂאֵנִי
  choice: నన్ను తీసివేస్తాడు
  rationale: נשא అనే క్రియకు ఎత్తడం, మోసుకుపోవడం, తీసివేయడం వంటి విస్తృత అర్థాలున్నాయి. తీర్పులో తొలగింపును సూచిస్తూ, మరణాన్ని స్పష్టంగా చేర్చకుండా ‘తీసివేస్తాడు’ మూలంలోని విస్తృతతను కాపాడుతుంది.
- source_word: עֹשֵׂנִי
  choice: నా సృష్టికర్త
  rationale: ‘నన్ను చేసినవాడు’ అనే వ్యక్తిగత సృష్టికర్త–సృష్టి సంబంధాన్ని సహజంగా, గౌరవప్రదంగా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: హెచ్చరించబడిన దైవిక చర్య స్వభావం
  choice: ‘నా సృష్టికర్త నన్ను త్వరలోనే తీసివేస్తాడు’ అని సాధారణ దైవిక తొలగింపు లేదా తీర్పుగా అనువదించడం
  alternative: ‘నా సృష్టికర్త నన్ను త్వరలోనే చంపేస్తాడు’ లేదా ‘నన్ను ఎత్తుకుపోతాడు’
  rationale: హీబ్రూ נשא నేరుగా ‘చంపడం’ అని చెప్పదు. మరణం సూచితమై ఉండవచ్చుగాని, దాన్ని స్పష్టంగా చేర్చకుండా మూలంలోని అనిశ్చితిని, హెచ్చరిక తీవ్రతను రెండింటినీ నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘ముఖస్తుతి’ సాధారణ పాఠకునికి అర్థమయ్యేలా ప్రతికూల సామాజిక భావాన్ని అందిస్తుంది. క్రియ క్రమాన్ని తెలుగుకు సహజంగా మార్చినా, కారణం–పరిణామ సంబంధాన్ని మరియు మూలంలోని దైవిక చర్య అస్పష్టతను కాపాడింది.
