source:
  edition: WLC
  text: אָ֭כֵן רֽוּחַ הִ֣יא בֶ/אֱנ֑וֹשׁ וְ/נִשְׁמַ֖ת שַׁדַּ֣י תְּבִינֵֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/032/008.yaml
  text: But there is a spirit in man[a], and the breath of the Almighty gives them understanding.
translation:
  language: te
  text: అయితే మనిషిలో ఆత్మ ఉంది[a]; సర్వశక్తిమంతుని శ్వాస వారికి అవగాహన కలిగిస్తుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నిశ్చయంగా ఒక మనిషిలో ఆత్మ ఉంది; సర్వశక్తిమంతుని శ్వాస అతనికి అవగాహన కలిగిస్తుంది.” హీబ్రూ పాఠంలో ‘మనిషి’ ఏకవచనంలో ఉండగా, ‘వారికి’ అనే సర్వనామ ప్రత్యయం బహువచనంలో ఉంది; కొన్ని అనువాదాలు దానిని ఏకవచనంగా సమన్వయిస్తాయి.
    reason: alternative_reading
lexical_decisions:
- source_word: אָכֵן
  choice: అయితే
  rationale: ఎలీహు ముందటి మాటను సరిదిద్దుతూ చెప్పే వ్యతిరేకతను, అలాగే వాక్యంలోని ఉద్ఘాటనను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: רוּחַ
  choice: ఆత్మ
  rationale: ఇక్కడ ఈ పదం గాలి లేదా కేవలం ఊపిరి కంటే మనిషిలోని అభౌతిక జీవతత్వాన్ని సూచిస్తుంది; తరువాత వచ్చే ‘శ్వాస’తో ఉన్న కవితాత్మక భేదాన్ని కూడా ఇది నిలుపుతుంది.
- source_word: הִיא
  choice: ఉంది
  rationale: హీబ్రూ నామవాచక వాక్యాన్ని తెలుగులో సహజమైన అస్తిత్వార్థక నిర్మాణంగా అందిస్తుంది; ‘అది’ అని యాంత్రికంగా అనువదించదు.
- source_word: בֶאֱנוֹשׁ
  choice: మనిషిలో
  rationale: אֱנוֹשׁ ఇక్కడ మర్త్య మానవుణ్ణి ఏకవచన సాధారణ ప్రతినిధిగా సూచిస్తుంది. ‘మనిషిలో’ ఆ సాధారణ ఏకవచనాన్ని నిలుపుతుంది.
- source_word: וְנִשְׁמַת
  choice: శ్వాస
  rationale: נְשָׁמָהకు ఇక్కడ ‘శ్వాస’ సహజమైన అర్థం. దీనిని רוּחַతో సమానంగా ‘ఆత్మ’ అని అనువదించకుండా కవితాత్మక సమాంతరంలోని భేదాన్ని కాపాడుతుంది.
- source_word: שַׁדַּי
  choice: సర్వశక్తిమంతుడు
  rationale: దైవ బిరుదైన שַׁדַּיకి తెలుగులో స్థిరమైన, అర్థవంతమైన అనువాదం.
- source_word: תְּבִינֵם
  choice: వారికి అవగాహన కలిగిస్తుంది
  rationale: హిఫిల్ రూపంలోని కారణార్థాన్ని ‘అవగాహన కలిగిస్తుంది’ తెలియజేస్తుంది; 3వ పురుష బహువచన ప్రత్యయాన్ని ‘వారికి’గా యథాతథంగా నిలుపుతుంది.
theological_decisions:
- issue: మానవ స్వభావాన్ని సూచించే భాష మరియు ఏకవచనం నుంచి బహువచనానికి మార్పు
  choice: ‘మనిషిలో’ అనే సాధారణ ఏకవచనానంతరం ‘వారికి’ అనే బహువచనాన్ని ఉంచడం
  alternative: ‘ఒక మనిషిలో ఆత్మ ఉంది; ... అతనికి అవగాహన కలిగిస్తుంది’ అని సంఖ్యను ఏకవచనంగా సమన్వయించడం
  rationale: మూల హీబ్రూలో אֱנוֹשׁ ఏకవచనంలో ఉండగా, תְּבִינֵםలోని ప్రత్యయం బహువచనంలో ఉంది. ఈ మార్పును సరిచేసి ఒకే సంఖ్యగా మార్చకుండా మూలంలోని భావ ఉద్రిక్తతను అనువాదం నిలుపుతుంది.
- issue: మానవ ఆత్మకు మరియు దేవుని శ్వాసకు మధ్య సంబంధం
  choice: ‘ఆత్మ’ మరియు ‘శ్వాస’ అనే వేర్వేరు పదాలను ఉంచడం
  alternative: రెండింటినీ ‘ఆత్మ’గా అనువదించి సమానీకరించడం
  rationale: పద్యంలోని సమాంతరత్వం ఈ రెండింటిని దగ్గరగా ఉంచుతుంది గాని పూర్తిగా ఒకటేనని స్పష్టంగా చెప్పదు. అందువల్ల పదభేదాన్ని నిలుపుతూ ఏ ప్రత్యేక మానవశాస్త్ర సిద్ధాంతాన్నీ అనువాదంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి ఉపయోగించబడింది. ‘మనిషిలో’ సాధారణ మానవుణ్ణి సూచిస్తుంది; ‘వారికి’ మూలంలోని బహువచన మార్పును ఉద్దేశపూర్వకంగా నిలుపుతుంది. ‘శ్వాస’ సులభంగా అర్థమయ్యే పదంగా ఉండి, ‘ఆత్మ’తో పదభేదాన్ని స్పష్టంగా ఉంచుతుంది.
