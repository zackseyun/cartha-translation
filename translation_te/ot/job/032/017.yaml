translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. హెబ్రీ సమాంతర నిర్మాణంలో రెండుసార్లు వచ్చిన אַף אֲנִי (‘నేనూ’) నిలుపబడింది. మొదటి పాదంలోని ‘నా వంతుగా’ చర్చలో తన భాగాన్ని చెప్పే భావాన్ని ఇస్తుంది; రెండవ పాదంలోని ‘నాకు తెలిసినదాన్ని’ సాధారణ పాఠకుడికి సహజంగా వినిపిస్తుంది.
