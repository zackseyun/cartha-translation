  terminology: “జవాబిస్తాను” సంభాషణాత్మక సందర్భానికి తగినది. “తెలియజేస్తాను” אֲחַוֶּה యొక్క ప్రకటించడం/తెలియపరచడం అనే అర్థాన్ని బాగా అందిస్తుంది. “నాకు తెలిసినదాన్ని” దֵעִי యొక్క జ్ఞాన-విషయక భావాన్ని అనవసరంగా ‘అభిప్రాయం’గా బలహీనపరచకుండా సహజంగా వ్యక్తం చేస్తుంది.
