  yaml_path: translation/ot/job/017/005.yaml
  text: He denounces friends for a share[a], and the eyes of his children will fail.
translation:
  language: te
  text: వాటా కోసం తన స్నేహితులను బయటపెట్టేవాని పిల్లల కళ్లు క్షీణించిపోతాయి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ మొదటి పాదం క్లిష్టమైనది. దీనిని ‘వాటా కోసం,’ ‘లాభం కోసం,’ లేదా మరో వివరణ ప్రకారం ‘ముఖస్తుతిగా’ అని కూడా అర్థం చేసుకోవచ్చు. భావం స్నేహితులను స్వప్రయోజనం కోసం వాడుకోవడాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְחֵלֶק
  choice: లాభంలో వాటా కోసం
  rationale: חֵלֶק యొక్క ప్రాథమిక అర్థం ‘వాటా, భాగం.’ ఈ క్లిష్ట సందర్భంలో వ్యక్తిగత ప్రయోజనం కోసం స్నేహితులను అప్పగించే భావాన్ని ‘లాభంలో వాటా కోసం’ సహజంగా తెలియజేస్తుంది; ‘దోపుడుసొమ్ము’ అని ప్రత్యేకంగా చేర్చి మూలంలో లేని నిర్దిష్టతను రుద్దదు.
- source_word: יַגִּיד
  choice: అప్పగించేవాని
  rationale: נגד హిఫీల్ సాధారణంగా ‘తెలియజేయు, ప్రకటించు.’ ఇక్కడ వాటా కోసం స్నేహితుల విషయంలో చేసే ప్రతికూల చర్యను బట్టి ‘అప్పగించు’ ద్రోహపూరితంగా బయటపెట్టే భావాన్ని సహజమైన తెలుగులో అందిస్తుంది; న్యాయస్థాన సందర్భాన్ని అనవసరంగా నిర్దిష్టం చేయదు.
- source_word: רֵעִים
  choice: స్నేహితులను
  rationale: רֵעִים అంటే ‘స్నేహితులు’ లేదా ‘సహచరులు.’ సంబంధంలో జరిగే ద్రోహాన్ని ‘స్నేహితులు’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: וְעֵינֵי בָנָיו
  choice: వాని పిల్లల కళ్లు
  rationale: בנים సందర్భానుసారం కుమారులు లేదా విస్తృతంగా పిల్లలు అని అర్థమవుతుంది. ఇక్కడ ‘పిల్లలు’ సహజంగా ఉండి మూలంలోని వంశసంబంధ భావాన్ని నిలుపుతుంది.
- source_word: תִּכְלֶנָה
  choice: క్షీణించిపోతాయి
  rationale: כלה ముగిసిపోవడం, క్షీణించడం, విఫలమవడం అనే భావాలను కలిగి ఉంటుంది. కళ్లతో వచ్చినప్పుడు ‘క్షీణించిపోతాయి’ చూపు మందగించడం లేదా ఆశతో వాడిపోవడం అనే మూల రూపకంలోని విస్తృతిని నిలుపుతుంది.
theological_decisions:
- issue: రెండవ పాదం శాపమా, ఫలిత ప్రకటనమా
  choice: సాధారణ భవిష్యత్ ప్రకటనగా అనువదించడం
  alternative: ‘క్షీణించిపోవుగాక’ అనే శాపార్థక అనువాదం
  rationale: תִּכְלֶנָה రూపం సందర్భంలో భవిష్యత్ ఫలితాన్ని లేదా శాపసదృశ ప్రకటనను సూచించగలదు. స్పష్టమైన శాపార్థాన్ని చేర్చకుండా సాధారణ భవిష్యత్ రూపం అస్పష్టతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘వాని’ వాక్యంలోని సాధారణ సూత్రప్రాయ వ్యక్తిని స్పష్టంగా సూచిస్తుంది; మూలంలోని క్లిష్టతను ప్రధాన పాఠం మరియు పాదటిప్పణి ద్వారా నిలుపుకున్నాం.
