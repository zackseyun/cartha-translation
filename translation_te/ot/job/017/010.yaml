    text: లేదా, “మీరందరూ తిరిగి రండి, రండి.” హీబ్రూలో ఇది బలమైన పిలుపు; యోబు తన స్నేహితులు తమ వాదనలను మళ్లీ వినిపించమని సవాలు చేస్తున్నట్లు అర్థం కావచ్చు.
