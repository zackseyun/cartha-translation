id: JOB.17.10
reference: Job 17:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְֽ/אוּלָ֗ם כֻּלָּ֣/ם תָּ֭שֻׁבוּ וּ/בֹ֣אוּ נָ֑א וְ/לֹֽא אֶמְצָ֖א בָ/כֶ֣ם חָכָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/017/010.yaml
  text: But all of you[a], come back now, and come; I will not find a wise man among you.
translation:
  language: te
  text: అయితే మీరందరూ తిరిగి రండి, ఇప్పుడు రండి; మీలో జ్ఞానవంతుడైన ఒక్కరినీ నేను కనుగొనను.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאוּלָם
  choice: అయితే
  rationale: బలమైన వ్యతిరేక మలుపును సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: כֻּלָּם
  choice: మీరందరూ
  rationale: తరువాతి క్రియలు ద్వితీయ పురుష బహువచనంలో ఉన్నందున యోబు తన సహచరులందరినీ నేరుగా సంబోధిస్తున్నాడు.
- source_word: תָּשֻׁבוּ
  choice: మళ్లీ వచ్చి
  rationale: שוב యొక్క ‘తిరిగి రావడం/మళ్లీ ప్రయత్నించడం’ అనే భావాన్ని, వాదనకు తిరిగి రావాలనే సందర్భానుసార సవాలుతో సహజంగా తెలియజేస్తుంది.
- source_word: וּבֹאוּ נָא
  choice: ముందుకు రండి
  rationale: בוא మరియు నొక్కిచెప్పే נָא కలిపి ఇచ్చే సవాలుతో కూడిన తక్షణ పిలుపును తెలుగులో సహజంగా అందిస్తుంది; మర్యాదపూర్వకమైన ‘దయచేసి’ భావాన్ని అనవసరంగా చేర్చదు.
- source_word: וְלֹא אֶמְצָא
  choice: నేను కనుగొనను
  rationale: పిలుపు తరువాత వచ్చే ఫలితాన్ని సూచించే హీబ్రూ అసంపూర్ణ క్రియారూపపు భవిష్యత్ ఛాయను నిలుపుతుంది; ‘కనుగొనలేను’ అని సామర్థ్యలేమిని జోడించదు.
- source_word: בָכֶם
  choice: మీలో
  rationale: సంబోధితుల సమూహంలో అనే స్థానార్థాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: חָכָם
  choice: జ్ఞానియైన ఒక్కరినీ
  rationale: ఏకవచన విశేషణం నామవాచకంగా వాడబడింది. సందర్భంలో పురుష సహచరులే ఉద్దేశించబడినా, తెలుగు రూపం సహజంగా ఉండి ‘ఒక్కరు’ ద్వారా ఏకవచనాన్ని స్పష్టపరుస్తుంది.
theological_decisions:
- issue: חָכָם యొక్క లింగసూచక అనువాదం
  choice: జ్ఞానియైన ఒక్కరినీ
  alternative: జ్ఞానవంతుడైన ఒక్క మనిషినీ
  rationale: మూలంలో పురుష ఏకవచనం ఉండి యోబు పురుష సహచరులను ఉద్దేశిస్తున్నాడు. అయితే తెలుగులో ‘జ్ఞాని’ సందర్భానుసారంగా వారినే సూచిస్తూ, మూల భావాన్ని తగ్గించకుండా మరింత సహజంగా ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ యోబు పలికే సవాలు స్పష్టంగా వినిపించే శైలి. పునరుక్త హీబ్రూ క్రియలను పూర్తిగా చెరపకుండా, తెలుగులో సహజంగా ‘మళ్లీ వచ్చి ముందుకు రండి’ అని అందించబడింది.
