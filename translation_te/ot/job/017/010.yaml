revisions:
- from: అయితే మీరందరూ[a] మళ్లీ వచ్చి ముందుకు రండి; మీలో జ్ఞానియైన ఒక్కరినీ నేను కనుగొనను.
  to: అయితే మీరందరూ తిరిగి రండి, ఇప్పుడు రండి; మీలో జ్ఞానవంతుడైన ఒక్కరినీ నేను కనుగొనను.
  rationale: The revision removes the unsupported directional addition ‘ముందుకు’ and renders the second imperative with ‘ఇప్పుడు రండి,’ preserving the urgent force of נָא and the rhetorical repetition. The masculine singular reference to a wise person among Job’s male companions is made explicit in idiomatic Telugu.
  reviewer_model: gpt-5.6-terra
