  text: And where[a], then, is my hope? And my hope—who can see it?
translation:
  language: te
  text: మరి, నా ఆశ ఎక్కడ ఉంది? నా ఆశను ఎవరు చూడగలరు[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నా ఆశను ఎవరు చూస్తారు?” హీబ్రూ క్రియకు “చూడు” లేదా “దృష్టిపెట్టు” అనే అర్థాలు రావచ్చు; ఇక్కడి క్రియారూపాన్ని సాధారణ భవిష్యత్తుగా గానీ, సామర్థ్యాన్ని సూచించే “చూడగలరు” అనే భావంలో గానీ తీసుకోవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַיֵּה אֵפוֹ
  choice: మరి, ... ఎక్కడ ఉంది?
  rationale: אַיֵּה స్థలాన్ని ప్రశ్నించే పదం; וְ మరియు אֵפוֹ ముందటి విలాపంతో అనుసంధానించి ప్రశ్నకు నొక్కింపు ఇస్తాయి. ఆధునిక తెలుగులో ‘మరి’ ఆ ప్రవాహాన్నీ నొక్కింపునీ సహజంగా తెలియజేస్తుంది.
- source_word: תִקְוָתִי / וְתִקְוָתִי
  choice: నా ఆశ / నా ఆశను
  rationale: תִּקְוָהకు సందర్భానుసారమైన సహజ అర్థం ‘ఆశ’. హీబ్రూ కవిత్వంలోని నొక్కింపును నిలుపుతూ పదాన్ని రెండుసార్లు అనువదించాం.
- source_word: מִי
  choice: ఎవరు
  rationale: రెండవ ప్రశ్నను ప్రారంభించే సాధారణ ప్రశ్నార్థక సర్వనామం.
- source_word: יְשׁוּרֶנָּה
  choice: చూడగలరు
  rationale: שׁור అంటే ‘చూడు, దృష్టిపెట్టు’. ఈ సందర్భంలో imperfect రూపాన్ని సామర్థ్యార్థకంగా తీసుకున్నాం; స్త్రీలింగ ఏకవచన ప్రత్యయం ‘ఆశ’ను సూచిస్తుంది.
theological_decisions: []
