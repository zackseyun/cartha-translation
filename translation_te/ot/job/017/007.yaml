  text: וַ/תֵּ֣כַהּ מִ/כַּ֣עַשׂ עֵינִ֑/י וִֽ/יצֻרַ֖/י כַּ/צֵּ֣ל כֻּלָּֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/job/017/007.yaml
  text: My eye has grown dim from grief[b][a], and all my members are like a shadow.
translation:
  language: te
  text: 'దుఃఖంతో నా కన్ను మసకబారింది[a];

    నా అవయవాలన్నీ నీడలా అయ్యాయి[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘కోపంతో,’ ‘చికాకుతో,’ లేదా ‘వ్యథతో.’ హీబ్రూ పదం వివిధ రకాల భావోద్వేగ కలతను సూచించగలదు; విలాపం, బాధ అనే సందర్భాన్ని బట్టి ఇక్కడ ‘దుఃఖంతో’ అని అనువదించబడింది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘నా ఆకారమంతా,’ ‘నా శరీర భాగాలన్నీ,’ లేదా ‘నా దేహమంతా.’ హీబ్రూ పదం ఇక్కడ యోబు శరీరాకృతిని లేదా శరీర అవయవాల సమష్టిని సూచించే అవకాశం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּכַהּ
  choice: మసకబారింది
  rationale: כהה అనే క్రియ మసకబారడం, క్షీణించడం అనే భావాలను ఇస్తుంది. ఇక్కడ చూపు మందగించిన కవితాత్మక చిత్రాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: מִכַּעַשׂ
  choice: దుఃఖంతో
  rationale: כעס భావోద్వేగ కలత, వ్యథ, కోపం వంటి అర్థాలను కలిగి ఉండవచ్చు. యోబు విలాప సందర్భంలో ‘దుఃఖంతో’ సహజంగా సరిపోతుంది; ఇతర సాధ్యార్థాలు పాదసూచికలో ఉంచబడ్డాయి.
- source_word: עֵינִי
  choice: నా కన్ను
  rationale: మూలంలో ఏకవచనం ఉంది. ‘నా కన్ను’ దానిని నిలుపుతూ చూపును సూచించే తెలుగు కవితా ప్రయోగంగా సహజంగా ఉంటుంది.
- source_word: וִיצֻרַי
  choice: నా అవయవాలు
  rationale: ఈ పదం యోబు శరీరాకృతి, అవయవాలు లేదా శరీర భాగాల సమష్టిని సూచించే అవకాశం ఉంది. ‘అవయవాలు’ సమష్టి భావాన్ని స్పష్టంగా తెలియజేస్తుంది; పదార్థంలోని అనిశ్చితి పాదసూచికలో భద్రపరచబడింది.
- source_word: כַּצֵּל
  choice: నీడలా
  rationale: మూలంలోని నీడ ఉపమానాన్ని సంక్షిప్తమైన, సహజమైన తెలుగులో యథాతథంగా నిలుపుతుంది.
- source_word: כֻּלָּם
  choice: అన్నీ
  rationale: యోబు శరీర అవయవాలన్నిటినీ సమష్టిగా సూచించే మూలపద బలాన్ని నిలుపుతుంది.
