translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గంభీర కవితా శైలి. హీబ్రూ ఏకవచనమైన ‘నా కన్ను’ను, ‘నీడ’ ఉపమానాన్ని నిలిపి, వివాదాస్పద పదాల అర్థవిస్తృతిని పాదసూచికల్లో భద్రపరచింది.
