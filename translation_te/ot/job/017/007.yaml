  source_fidelity: 'హీబ్రూ వచనంలోని రెండు ప్రధాన భావాలను అనువాదం నమ్మకంగా ప్రతిబింబిస్తుంది: బాధ/భావోద్వేగ కలత కారణంగా కన్ను మసకబారడం, అలాగే యోబు శరీర భాగాలన్నీ నీడవలె క్షీణంగా లేదా అస్థిరంగా ఉండడం. עֵינִי యొక్క ఏకవచనాన్ని ‘నా కన్ను’గా నిలిపింది; כֻּלָּם యొక్క సమష్టి బలాన్ని ‘అవయవాలన్నీ’గా అందించింది.'
