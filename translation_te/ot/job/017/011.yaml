  yaml_path: translation/ot/job/017/011.yaml
  text: My days have passed by; my plans are broken off[a], the desires of my heart.
translation:
  language: te
  text: నా రోజులు గడిచిపోయాయి; నా ప్రణాళికలు తెగిపోయాయి—నా హృదయానికి ప్రియమైనవి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘నా హృదయ స్వాస్థ్యాలు,’ ‘నా హృదయం ప్రీతిగా దాచుకున్నవి,’ లేదా ‘నా హృదయ వారసత్వాలు.’ ఇక్కడి హీబ్రూ ప్రయోగం అరుదైనది, అర్థనిర్ణయం కష్టమైనది.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָמַי
  choice: నా రోజులు
  rationale: ‘నా రోజులు’ అనే సహజమైన తెలుగు ప్రయోగం వ్యక్తి జీవితకాలాన్ని సూచించే హీబ్రూ నుడికారాన్ని నిలుపుతుంది.
- source_word: עָבְרוּ
  choice: గడిచిపోయాయి
  rationale: Qal perfect బహువచన క్రియ; రోజులు ఇక గతించిపోయాయనే పూర్తయిన భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: זִמֹּתַי
  choice: నా ఆలోచనలు
  rationale: ఈ పదానికి ఆలోచనలు, ఉద్దేశాలు, ప్రణాళికలు అనే అర్థాలు ఉండవచ్చు. ఇక్కడ ‘ఆలోచనలు’ మూలపద విస్తృతిని ఉంచుతూ, దుష్ట పన్నాగాలనే ప్రతికూల భావాన్ని రానివ్వదు.
- source_word: נִתְּקוּ
  choice: తెగిపోయాయి
  rationale: Nifal perfect రూపం వేరుచేయబడటం, తెగిపోవటం అనే బలమైన భావాన్ని ఇస్తుంది; ‘తెగిపోయాయి’ తెలుగు కవితాత్మక విలాపంలో సహజంగా సరిపోతుంది.
- source_word: מוֹרָשֵׁי
  choice: ప్రీతిగా దాచుకున్నవి
  rationale: అరుదైన, క్లిష్టమైన పదం. స్వాస్థ్యాలు లేదా వారసత్వాలు అనే మూలభావం నుంచి ‘హృదయం తనవిగా కలిగివున్న అమూల్యమైనవి’ అనే భావాన్ని సందర్భానుగుణంగా వ్యక్తం చేస్తుంది; అనిశ్చితిని పాదసూచికలో వెల్లడించాం.
- source_word: לְבָבִי
  choice: నా హృదయం
  rationale: ఆలోచన, కోరిక, అంతరంగానికి కేంద్రంగా ఉన్న హీబ్రూ రూపకాన్ని ‘హృదయం’ నేరుగా నిలుపుతుంది.
