translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన విలాప స్వరాన్ని నిలిపాం. చివరి పదబంధాన్ని ముందున్న ‘నా ఆలోచనలు’కు వివరణాత్మక సమాంతరంగా ఉంచాం; అరుదైన מוֹרָשֵׁי పదంలోని నిజమైన సందిగ్ధతను పాదసూచికలో సంరక్షించాం.
