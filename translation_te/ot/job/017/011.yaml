    text: లేదా ‘నా హృదయ స్వాస్థ్యాలు,’ ‘నా హృదయం ప్రీతిగా దాచుకున్నవి,’ లేదా ‘నా హృదయ వారసత్వాలు.’ ఇక్కడి హీబ్రూ ప్రయోగం అరుదైనది, అర్థనిర్ణయం కష్టమైనది.
    reason: lexical_alternative
