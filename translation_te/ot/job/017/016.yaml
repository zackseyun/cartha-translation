  yaml_path: translation/ot/job/017/016.yaml
  text: Will they go down to the bars of Sheol? Shall we descend together into the dust?[a][b]
translation:
  language: te
  text: అవి షెయోల్ అడ్డకమ్మీల దగ్గరకు దిగిపోతాయా?[a] కలిసి ధూళిలోకి దిగిపోతామా?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘షెయోల్’ అంటే మృతుల లోకం. ‘షెయోల్ భాగాల దగ్గరకు’ లేదా ‘షెయోల్ గడియబోల్టుల దగ్గరకు’ అని కూడా అనువదించవచ్చు. ఇక్కడి చిత్రం మృతుల లోకపు మూసివేసే ద్వారాలను సూచిస్తున్నట్లు ఉంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘కలిసి ధూళిలో విశ్రమిస్తామా?’ చివరి హెబ్రీ పదాన్ని ‘దిగిపోవడం’ అని లేదా ‘విశ్రాంతి’ అని అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: בַּדֵּי
  choice: అడ్డగడియల
  rationale: షియోల్‌తో కూడిన ఈ సందర్భంలో, మృతుల లోకాన్ని మూసివేసే ద్వారాల అడ్డగడియలు లేదా గడియబోల్టులు అనే కవితాత్మక చిత్రాన్ని ఇది సహజంగా వ్యక్తం చేస్తుంది. ‘భాగాలు’ అనే అర్థసాధ్యతను పాదటిప్పణిలో ఉంచాం.
- source_word: שְׁאֹל
  choice: షియోల్
  rationale: ఇది కేవలం వ్యక్తిగత సమాధిని కాక, మృతుల లోకం అనే విస్తృత హెబ్రీ భావాన్ని సూచిస్తుంది. అందువల్ల భావపరిధిని కుదించకుండా లిప్యంతరీకరించాం.
- source_word: תֵּרַדְנָה
  choice: అవి దిగిపోతాయా?
  rationale: స్త్రీలింగ బహువచన క్రియ ముందటి సందర్భంలోని యోబు ఆశలను తిరిగి సూచిస్తున్నట్లు ఉంది. సందర్భంలోని అలంకారప్రశ్నను తెలుగులో ప్రశ్నారూపంలో నిలిపాం.
- source_word: אִם
  choice: …తామా?
  rationale: ఇక్కడ ‘అయితే/లేదా’ అనే సాధారణ షరతు కంటే రెండో అలంకారప్రశ్నను ప్రవేశపెట్టే ప్రయోగంగా గ్రహించాం; తెలుగులో ప్రశ్నార్థక క్రియాంతంతో సహజంగా తెలిపాం.
- source_word: יַחַד
  choice: కలిసి
  rationale: ఉమ్మడి దిగుదల లేదా విశ్రాంతి భావాన్ని నేరుగా కాపాడుతుంది.
- source_word: עַל עָפָר
  choice: ధూళిలోకి
  rationale: עַל అక్షరార్థంగా ‘ధూళిమీద’ అయినప్పటికీ, దిగిపోవడమనే చలనభావంతో తెలుగులో ‘ధూళిలోకి’ సహజంగా ఉంటుంది; మరణంలో శరీరం ధూళికి చేరడమనే చిత్రమూ నిలుస్తుంది.
- source_word: נָחַת
  choice: దిగిపోతామా
  rationale: మొదటి పాదంలోని ‘దిగిపోవడం’తో ఉన్న కవితాత్మక సమాంతరాన్ని కాపాడుతూ దిగుదల అనే భావాన్ని ప్రధాన పాఠ్యంలో ఎంచుకున్నాం. ‘విశ్రమిస్తామా’ అనే పఠనాన్ని పాదటిప్పణిలో ఇచ్చాం.
theological_decisions:
- issue: שְׁאֹל యొక్క భావపరిధి
  choice: షియోల్ అని లిప్యంతరీకరణ
  alternative: సమాధి / మృతుల లోకం
  rationale: దీనిని కేవలం సమాధిగా లేదా తరువాతి సిద్ధాంతపరమైన నరక భావంగా నిర్ణయించకుండా, హెబ్రీ పదంలోని మృతుల లోక భావపరిధిని నిలిపాం.
- issue: చివరి పదబంధం దిగుదలా, విశ్రాంతా
  choice: దిగిపోతామా
  alternative: ధూళిలో కలిసి విశ్రమిస్తామా
  rationale: תֵּרַדְנָהతో సమాంతరత్వం దిగుదల పఠనానికి మద్దతిస్తుంది; అయితే విశ్రాంతి పఠనం ప్రాచీన మరణ-విశ్రాంతి చిత్రానికి అనుగుణంగా సాధ్యమైనందున దాన్ని పాదటిప్పణిలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కవితాత్మక ప్రశ్నారూపాన్ని వాడాం. ‘అవి’ అనేది ముందటి సందర్భంలోని యోబు ఆశలను సూచిస్తుంది; ‘మేము’ యోబు మరియు ఆ ఆశలు కలిసి ధూళికి దిగే చిత్రాన్ని సహజంగా వ్యక్తం చేస్తుంది. ‘షియోల్’ అనే సాంకేతిక హెబ్రీ భావపదాన్ని ఉంచి పాదటిప్పణిలో సులభంగా వివరించాం.
