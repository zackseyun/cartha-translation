  text: שִֽׂימָ/ה נָּ֭א עָרְבֵ֣/נִי עִמָּ֑/ךְ מִֽי ה֝֗וּא לְ/יָדִ֥/י יִתָּקֵֽעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/017/003.yaml
  text: Lay down[a], please, a pledge for me with yourself[b]; who else is there who would strike hands with me?
translation:
  language: te
  text: దయచేసి, నాకు నీవే పూచీగా ఉండు; నా చేతికి చెయ్యి కొట్టి హామీ ఇచ్చేవాడు ఇంకెవడు?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “దయచేసి, నాకు నీతో పూచీని ఉంచు; నా చేతికి చెయ్యి కొట్టేవాడు ఎవడు?” ‘పూచీని ఉంచు’ మరియు ‘చెయ్యి కొట్టడం’ అనేవి పూచీ లేదా హామీ ఒప్పందానికి సంబంధించిన న్యాయపరమైన భాష, సంకేతాలు. ‘నీతో’ అనే అసాధారణ పదబంధం దేవునినే పూచీ కోసం ఆశ్రయిస్తున్న భావాన్ని వ్యక్తం చేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂימָה
  choice: ఉంచు
  rationale: שׂים ఆజ్ఞార్థక రూపం ‘పెట్టు/ఉంచు’ అనే అర్థం ఇస్తుంది. పూచీని ఒకరి దగ్గర ఉంచే న్యాయపరమైన సందర్భంలో ‘ఉంచు’ సహజంగా ఉంది.
- source_word: נָּא
  choice: దయచేసి
  rationale: విన్నప స్వరాన్ని మృదువుచేసే కణం; ఆధునిక తెలుగులో ‘దయచేసి’ ఆ వేడుకోలును స్పష్టంగా తెలియజేస్తుంది.
- source_word: עָרְבֵנִי
  choice: నాకోసం పూచీని
  rationale: ערב ఇక్కడ పూచీ లేదా హామీ ఇవ్వడాన్ని సూచిస్తుంది; ప్రత్యయం యోబు తరఫున అది ఇవ్వబడాలని తెలియజేస్తుంది. ‘పూచీ’ న్యాయపరమైన భావాన్ని సంక్షిప్తంగా కాపాడుతుంది.
- source_word: עִמָּךְ
  choice: నీ దగ్గరే
  rationale: పూచీ దేవుని వద్దనే ఉండాలని వాక్యభావం సూచిస్తుంది. ‘ఏ’ ప్రత్యయం దేవుడే అభ్యర్థించబడినవాడూ, పూచీ ఉంచబడే పక్షమూ అనే అసాధారణ ఉద్రిక్తతను అతిగా వివరించకుండా వ్యక్తపరుస్తుంది.
- source_word: מִי הוּא
  choice: ఇంకెవడున్నాడు
  rationale: ఇది మరొక హామీదారు లేడని సూచించే అలంకారప్రశ్న. మూలంలోని పుంలింగ ఏకవచన ప్రశ్నను సహజమైన తెలుగు రూపంలో నిలుపుతుంది.
- source_word: לְיָדִי
  choice: నాతో
  rationale: అక్షరార్థంగా ‘నా చేతికి’; ఒప్పందంలో ప్రవేశించే చేతి సంకేతాన్ని తెలుగులో ‘నాతో చెయ్యి కలపడం’ సహజంగా తెలియజేస్తుంది.
- source_word: יִתָּקֵעַ
  choice: చెయ్యి కలిపేవాడు
  rationale: תקע ఇక్కడ పూచీ ఒప్పందాన్ని స్థిరపరచడానికి చేతులు కలిపే లేదా కొట్టే న్యాయసంబంధమైన నుడికారంలో ఉంది. ‘చెయ్యి కలపడం’ ఆ దృశ్యరూపాన్ని చదవదగిన తెలుగులో కాపాడుతుంది.
theological_decisions:
- issue: దేవునికి ఉద్దేశించిన న్యాయపరమైన రూపకం
  choice: యోబు తన తరఫున పూచీని దేవుని దగ్గరే ఉంచమని దేవునినే వేడుకుంటున్నట్లు అనువదించడం
  alternative: దేవుడే రెండు పక్షాలుగా ఉండాలనే సూచన లేకుండా, యోబు సాధారణంగా ఒక హామీదారుని కోరుతున్నట్లు అనువదించడం
  rationale: עָרְבֵנִי עִמָּךְ పదబంధం దేవునినే ఆశ్రయించి, మరొక హామీదారు లేడనే ఉద్రిక్త భావాన్ని బలంగా సూచిస్తుంది. అయితే దేవుడు ఖచ్చితంగా ఏ న్యాయపాత్రను స్వీకరిస్తాడో ప్రధాన వాక్యంలో సిద్ధాంతపరంగా విపులీకరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన, సులభంగా అర్థమయ్యే శైలి. దేవునితో ప్రత్యక్ష సంభాషణలో తెలుగు బైబిల్ సంప్రదాయానికి అనుగుణంగా ఏకవచన సంబోధన వాడబడింది. ‘పూచీ’ న్యాయసంబంధ భావాన్ని నిలుపుతూ సాధారణ పాఠకునికి అందుబాటులో ఉంటుంది; ‘చెయ్యి కలపడం’ మూలంలోని సాంస్కృతిక సంకేతాన్ని సహజంగా వ్యక్తపరుస్తుంది.
