  text: רוּחִ֣/י חֻ֭בָּלָה יָמַ֥/י נִזְעָ֗כוּ קְבָרִ֥ים לִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/job/017/001.yaml
  text: My spirit is broken[a]; my days are extinguished[b]; graves await me.
translation:
  language: te
  text: నా ఆత్మ విరిగిపోయింది[a]; నా రోజులు ఆరిపోయాయి[b]; నా కోసం సమాధులు ఉన్నాయి[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నా ఊపిరి విరిగిపోయింది.” רוּחַ అనే హీబ్రూ పదానికి “ఆత్మ” లేదా “ఊపిరి” అనే అర్థాలు రావచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “నా రోజులు ఆర్పివేయబడ్డాయి.” ఈ క్రియ ఆర్పడం లేదా ఆరిపోవడం అనే చిత్రాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: అక్షరార్థంగా, “సమాధులు నాకు.” సందర్భంలో ఇవి యోబుకు ఎదురుగా ఉన్న మరణాన్ని సూచిస్తాయి.
    reason: source_ambiguity
lexical_decisions:
- source_word: רוּחִי
  choice: నా ఆత్మ
  rationale: רוּחַ అనే పదానికి ‘ఆత్మ’ లేదా ‘ఊపిరి’ అనే అర్థాలు రావచ్చు. యోబు విలాప సందర్భంలో ‘నా ఆత్మ’ అతని అంతరంగ జీవితం కూలిపోయిన భావాన్ని సహజంగా తెలియజేస్తుంది; ‘నా ఊపిరి’ అనే సాధ్యార్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: חֻבָּלָה
  choice: ఛిన్నాభిన్నమైంది
  rationale: ఈ నిష్క్రియ రూపం పాడుచేయబడిన లేదా నాశనమైన స్థితిని సూచిస్తుంది. ‘ఛిన్నాభిన్నమైంది’ విలాప తీవ్రతను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: יָמַי
  choice: నా రోజులు
  rationale: యోబుకు మిగిలిన జీవితకాలాన్ని సూచించే స్వామ్య బహువచనాన్ని నేరుగా నిలుపుతుంది.
- source_word: נִזְעָכוּ
  choice: ఆరిపోయాయి
  rationale: క్రియ ఆర్పివేయబడడం లేదా ఆరిపోవడం అనే చిత్రాన్ని కలిగిస్తుంది. ‘ఆరిపోయాయి’ దీపం లేదా జీవం ఆరిపోతున్న రూపకాన్ని తెలుగులో సహజంగా నిలుపుతుంది.
- source_word: קְבָרִים
  choice: సమాధులు
  rationale: హీబ్రూ బహువచనాన్ని ఏకవచనంగా మార్చకుండా ‘సమాధులు’గా నిలిపాం.
- source_word: לִי
  choice: నాకోసం ఉన్నాయి
  rationale: לִי అక్షరార్థంగా ‘నాకు/నాకోసం’ అని అర్థం. ‘ఎదురుచూస్తున్నాయి’ అని భావవిస్తరణ చేయకుండా మూలంలోని సంక్షిప్తతనూ అస్పష్టతనూ నిలుపుతుంది.
theological_decisions:
- issue: רוּחִי అనేది అంతరంగ ఆత్మనా లేక ప్రాణవాయువైన ఊపిరినా
  choice: ప్రధాన పాఠ్యంలో ‘నా ఆత్మ’
  alternative: ‘నా ఊపిరి’
  rationale: సందర్భం యోబు అంతరంగ విరుగుదలను సూచించవచ్చు; అదే సమయంలో మరణానికి సమీపించిన అతని జీవశ్వాస భావమూ సాధ్యమే. అందువల్ల ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన విలాప ధోరణి ఉంచబడింది. మొదటి రెండు వాక్యఖండాల్లో రూపకాల తీవ్రతను నిలిపి, చివరి ఖండంలో హీబ్రూ לִי యొక్క సంక్షిప్తతను అతిగా వివరణ చేయకుండా అనువదించాం.
