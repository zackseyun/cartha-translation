  text: I call to the pit, ‘You are my father,’ and to the worm, ‘My mother and my sister.’
translation:
  language: te
  text: నేను గొయ్యిని, ‘నీవు నా తండ్రివి’ అని, పురుగును, ‘నీవు నా తల్లి, నా సహోదరివి’ అని పిలుస్తాను.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שַׁחַת
  choice: గోతి
  rationale: ఈ పదానికి ‘గోతి/సమాధి/నాశనం’ అనే అర్థపరిధి ఉంది. మరణస్థలాన్ని వ్యక్తిగా సంబోధిస్తున్న రూపకాన్ని సహజంగా నిలుపుతూ ‘గోతి’ అని అనువదించాం.
- source_word: קָרָאתִי
  choice: నేను పిలుస్తున్నాను
  rationale: మూలంలోని קרא క్రియకు ‘పిలుచు, సంబోధించు’ అనే భావం ఉంది. ‘చెబుతున్నాను’ కంటే ప్రత్యక్షంగా ‘పిలుస్తున్నాను’ మూలరూపాన్ని బాగా ప్రతిబింబిస్తుంది.
- source_word: רִמָּה
  choice: పురుగు
  rationale: శవక్షయంతో సంబంధమున్న పురుగును సూచించే ఏకవచన సామూహిక పదం. తెలుగు పాఠకులకు సహజమైన ‘పురుగు’ను ఎంచుకున్నాం.
- source_word: אָבִי / אִמִּי / אֲחֹתִי
  choice: నా తండ్రివి / నా తల్లివి / నా సహోదరివి
  rationale: మరణం, క్షయం తనకు అత్యంత సన్నిహిత బంధువులైనట్లుగా యోబు పలికే తీవ్రమైన రూపకాన్ని యథాతథంగా నిలిపాం.
theological_decisions:
- issue: గోతి మరియు పురుగును కుటుంబ బంధువులుగా సంబోధించడం
  choice: రూపకాన్ని వివరణ జోడించకుండా ప్రత్యక్షంగా నిలిపాం
  alternative: ‘మరణమే నాకు తండ్రి; క్షయమే నాకు తల్లి, సహోదరి’ అని భావార్థంగా స్పష్టీకరించడం
  rationale: మూలపాఠంలోని కవితాత్మక వ్యక్తీకరణను సిద్ధాంతపరంగా విశదీకరించకుండా, దాని తీవ్రతనూ అంతర్లీన అస్పష్టతనూ కాపాడటం అవసరం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కవితా ధోరణి. ‘సహోదరి’ అనే పదం ‘అక్క/చెల్లి’ మధ్య మూలంలోని అనిర్దిష్టతను కాపాడుతుంది; సంబోధనలో ఏకవచన ‘నువ్వు’ రూపం వాడబడింది.
