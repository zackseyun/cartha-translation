  edition: WLC
  text: אִם אֲ֭קַוֶּה שְׁא֣וֹל בֵּיתִ֑/י בַּ֝/חֹ֗שֶׁךְ רִפַּ֥דְתִּי יְצוּעָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/017/013.yaml
  text: If I hope for Sheol as my house[a], if I spread my bed in the darkness,
translation:
  language: te
  text: నేను షెయోలునే నా ఇల్లుగా ఆశిస్తే[a], చీకటిలో నా పడకను పరచుకుంటే,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘సమాధినే నా ఇల్లుగా’ లేదా ‘మృతుల లోకాన్నే నా ఇల్లుగా.’ హీబ్రూలో ‘షెయోలు’ అనే పదం కేవలం పూడ్చే స్థలాన్ని మాత్రమే కాక, మృతుల లోకాన్ని కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: అయితే
  rationale: హీబ్రూ షరతును నిలుపుతుంది; ఇక్కడ దానిని కాలార్థకంగా మార్చకుండా, రెండు సమాంతర ఉపవాక్యాలకు సహజమైన తెలుగు షరతు నిర్మాణాన్ని వాడాం.
- source_word: אֲקַוֶּה
  choice: నిరీక్షిస్తే
  rationale: קוה పీయేల్ రూపంలోని ఆశతో ఎదురుచూడడం/నిరీక్షించడం అనే భావాన్ని తెలియజేస్తుంది; సందర్భంలోని మరణ నిరీక్షణను అతిగా వ్యాఖ్యానించదు.
- source_word: שְׁאוֹל
  choice: పాతాళం
  rationale: తెలుగులో మృతుల లోకాన్ని సూచించే స్థిరమైన, గంభీరమైన పదం; కేవలం సమాధి అనే సంకుచిత అర్థానికి పరిమితం చేయదు.
- source_word: בֵּיתִי
  choice: నా ఇల్లు అని
  rationale: ‘షెయోల్—నా ఇల్లు’ అనే క్రియలేని సంబంధాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తూ, దానిని తన నివాసంగా భావించే అర్థాన్ని నిలుపుతుంది.
- source_word: בַּחֹשֶׁךְ
  choice: చీకటిలో
  rationale: ఉపసర్గతో కూడిన పదానికి సహజమైన తెలుగు సమానం; షెయోల్‌తో ముడిపడిన అంధకార చిత్రణను కాపాడుతుంది.
- source_word: רִפַּדְתִּי
  choice: పరచుకుంటే
  rationale: పడకను పరచడం/అమర్చడం అనే స్పష్టమైన చిత్రాన్ని సహజ తెలుగులో ఇస్తుంది; మధ్యమార్థక తెలుగు రూపం తనకోసం పానుపు సిద్ధం చేసుకోవడాన్ని సూచిస్తుంది.
- source_word: יְצוּעָי
  choice: నా పానుపు
  rationale: పడుకునే స్థలాన్ని సూచించే గంభీరమైన కానీ అర్థమయ్యే పదం; ‘మంచం’ కంటే పరచబడే పడక అనే క్రియాచిత్రంతో బాగా సరిపోతుంది.
theological_decisions:
- issue: שְׁאוֹל ను వ్యాఖ్యానాత్మకంగా ఎలా అనువదించాలి
  choice: పాతాళం
  alternative: సమాధి; మృతుల లోకం
  rationale: ఈ పదం కేవలం భౌతిక సమాధికంటే విస్తృతంగా మృతుల స్థితి/లోకాన్ని సూచించగలదు. ‘పాతాళం’ ఆ భావవ్యాప్తిని నిలుపుతూ, తరువాతి సిద్ధాంతపరమైన భావనలను బలవంతంగా చేర్చదు; ప్రత్యామ్నాయాలు పాదసూచికలో ఇవ్వబడ్డాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; యోబు కవిత్వానికి తగిన గంభీరతను ఉంచుతూ వాక్యాన్ని సాధారణ పాఠకులకు సహజంగా తీర్చిదిద్దాం. ‘పానుపు’ పరచడం అనే మూలభాష చిత్రాన్ని నిలుపుతుంది. పద్యం తరువాతి వాక్యంతో కొనసాగవచ్చనే తెరచిన నిర్మాణాన్ని చివరి కామాతో కాపాడాం.
