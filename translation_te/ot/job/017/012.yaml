source:
  edition: WLC
  text: לַ֭יְלָה לְ/י֣וֹם יָשִׂ֑ימוּ א֝֗וֹר קָר֥וֹב מִ/פְּנֵי חֹֽשֶׁךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/017/012.yaml
  text: They make night into day; they say, ‘Light is near,’ in the face of darkness.
translation:
  language: te
  text: 'వారు రాత్రిని పగలుగా చేస్తారు;

    చీకటి ఎదురుగానే ఉన్నా, ‘వెలుగు దగ్గరలో ఉంది’ అంటారు.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יָשִׂימוּ
  choice: చేస్తారు
  rationale: ‘పెడతారు/నియమిస్తారు’ అనే మూలభావాన్ని సందర్భానుసారంగా సహజమైన ‘చేస్తారు’ అని అందించి, రాత్రిని పగలుగా చూపించే భావాన్ని నిలిపింది.
- source_word: אוֹר קָרוֹב
  choice: వెలుగు దగ్గరలో ఉంది
  rationale: ‘వెలుగు సమీపంలో ఉంది’ అనే వాక్యభావాన్ని సాధారణ ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: מִפְּנֵי חֹשֶׁךְ
  choice: చీకటి ఎదురుగానే ఉన్నా
  rationale: అక్షరార్థంగా ‘చీకటి ముఖం ముందు/సమక్షంలో’ అనే భావం ఉంది; ఇక్కడ స్పష్టంగా ఉన్న చీకటికి విరుద్ధంగా వెలుగు దగ్గరలో ఉందని చెప్పడంలోని ఉద్రిక్తతను తెలుగులో నిలిపింది.
theological_decisions:
- issue: ‘వెలుగు దగ్గరలో ఉంది’ అన్న మాట ఎవరిది, దాని ఉద్దేశం ఏమిటి?
  choice: దాన్ని ‘వారు ... అంటారు’ అనే ప్రత్యక్ష వాక్యంగా అందించడం
  alternative: ‘చీకటి ఎదుట వెలుగు దగ్గరలో ఉంది’ అని వ్యాఖ్యాత మాటగా అనుసంధానించడం
  rationale: హీబ్రూ పాఠ్యంలో ‘అంటారు’ స్పష్టంగా లేకపోయినా, మొదటి భాగంలోని బహువచన కర్తతో రెండో భాగాన్ని సహజంగా కలుపుతుంది. ఇది ఆ మాటను నిజమైన ఆశావాక్యంగా నిర్ధారించకుండా, యోబు విమర్శిస్తున్న వారి వాదనగానే ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కవితాత్మక సమాంతరతను రెండు పాదాల్లో ఉంచి, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన భాషను వాడింది.
