- from: ఆయన నన్ను జనాల మధ్య సామెతగా నిలబెట్టాడు[a]; నేను ముఖం మీద ఉమ్మివేసేంత హీనమైనవాడినయ్యాను[b].
  to: ఆయన నన్ను ప్రజల మధ్య అపహాస్య సామెతగా చేశాడు[a]; నేను ముఖాముఖిగా ఉమ్మివేయబడే వాడిగా అయ్యాను[b].
  rationale: The revision makes the derisive force of the first colon explicit, uses standard-register “ప్రజల,” and replaces the expanded ‘so degraded that people spit on my face’ with an idiomatic expression for becoming an object of face-to-face public spitting. The note retains the compressed literal wording and acknowledges the lexical difficulty without resolving it more narrowly than the source permits.
