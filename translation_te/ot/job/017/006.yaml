base_translation:
  language: en
  yaml_path: translation/ot/job/017/006.yaml
  text: He has made me a byword among the peoples[b][a], and I have become one before whom people spit.
translation:
  language: te
  text: ఆయన నన్ను ప్రజల మధ్య అపహాస్య సామెతగా చేశాడు[a]; నేను ముఖాముఖిగా ఉమ్మివేయబడే వాడిగా అయ్యాను[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ప్రజల మధ్య సామెతగా.” హీబ్రూ పదం ఇక్కడ అవమానానికి గురైన సామెతసదృశ ఉదాహరణను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థానికి దగ్గరగా, “నేను ముఖాల ఎదుట ఉమ్మిగా అయ్యాను.” హీబ్రూ ప్రయోగం అసాధారణమైనది; బహిరంగంగా ఉమ్మివేయబడే, ధిక్కారానికి గురయ్యే వ్యక్తి అనే భావాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִצִּגַנִי
  choice: ఆయన నన్ను ... నిలబెట్టాడు
  rationale: హిఫీల్ రూపంలోని కారణార్థాన్ని, యోబును బహిరంగంగా ఒక స్థితిలో ఉంచిన భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: לִמְשֹׁל
  choice: సామెతగా
  rationale: ఈ అసాధారణ రూపం సందర్భంలో అపహాస్యానికి గురైన సామెతసదృశ ఉదాహరణను సూచిస్తుంది. ‘సామెత’ మూలంలోని proverbial భావాన్ని నిలుపుతుంది; అవమానార్థాన్ని పాదసూచిక వివరిస్తుంది.
- source_word: עַמִּים
  choice: జనాల మధ్య
  rationale: బహువచనమైన עַמִּיםను సహజ తెలుగు సమూహార్థక ప్రయోగంతో అందిస్తుంది; అనేక ప్రజల మధ్య బహిరంగ అవమానం అనే భావం నిలుస్తుంది.
- source_word: וְתֹפֶת
  choice: ఉమ్మివేసేంత హీనమైనవాడిని
  rationale: ఈ అరుదైన నామవాచకం ‘ఉమ్మి/ఉమ్మివేయబడే వస్తువు’ అనే అవమాన చిత్రాన్ని సూచిస్తుంది. తెలుగులో అర్థవంతంగా ఉండేందుకు వ్యక్తిపై ఉమ్మివేసే బహిరంగ ధిక్కారంగా వ్యక్తీకరించబడింది.
- source_word: לְפָנִים
  choice: ముఖం మీద
  rationale: అక్షరార్థంగా ‘ముఖాల ఎదుట’; ఇది ముఖాముఖిగా, బహిరంగంగా చూపే ధిక్కారాన్ని సూచిస్తుంది. ‘ముఖం మీద’ ఆ చిత్రాన్ని సహజంగా నిలుపుతుంది.
- source_word: אֶהְיֶה
  choice: అయ్యాను
  rationale: రూపతః అసంపూర్ణ క్రియ అయినా, కవితా సందర్భంలో ఏర్పడిన ప్రస్తుత దుస్థితిని సూచిస్తుంది. ‘అయ్యాను’ ముందు చర్య ఫలితంగా వచ్చిన స్థితిని తెలియజేస్తుంది.
theological_decisions:
- issue: కర్తగా దేవుని గుర్తింపు
  choice: ‘ఆయన’ అనే సర్వనామాన్ని మాత్రమే ఉంచడం
  alternative: ‘దేవుడు’ అని స్పష్టీకరించడం
  rationale: హీబ్రూ పాఠ్యంలో కర్త 3వ పురుష ఏకవచన క్రియలో అంతర్లీనంగా ఉంది; ఈ వాక్యంలో ‘దేవుడు’ అనే నామం లేదు. సందర్భాన్ని మించి స్పష్టీకరించకుండా మూలంలోని సూచనాత్మకతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కవితా వాక్యంగా రూపొందించబడింది. అరుదైన హీబ్రూ పదాల అస్పష్టతను పాదసూచికల్లో నిలిపి, ప్రధాన పాఠ్యంలో బహిరంగ అవమానం మరియు ముఖం మీద ఉమ్మివేయడం అనే దృశ్యాన్ని స్పష్టంగా అందించింది.
