source:
  edition: WLC
  text: כִּֽי לִ֭בָּ/ם צָפַ֣נְתָּ מִּ/שָּׂ֑כֶל עַל כֵּ֝֗ן לֹ֣א תְרֹמֵֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/017/004.yaml
  text: For you have hidden their heart from understanding[b][a]; therefore you will not exalt them.
translation:
  language: te
  text: ఎందుకంటే నీవు వారి హృదయాన్ని[a] వివేకం నుండి దాచివేశావు; అందుచేత నీవు వారిని ఉన్నతపరచవు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వారి మనస్సును,’ ‘వారి అంతరంగాన్ని.’ హీబ్రూలో ‘హృదయం’ తరచుగా భావోద్వేగాలను మాత్రమే కాక ఆలోచన, సంకల్పం, వివేచనలకు కేంద్రాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘వారిని పైకెత్తవు,’ ‘వారు విజయం పొందేలా చేయవు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ఈ పదం తరువాతి వాక్యానికి కారణాన్ని లేదా ఆధారాన్ని పరిచయం చేస్తుంది; తెలుగు కవితాత్మక వాదప్రవాహంలో ‘ఎందుకంటే’ సహజంగా ఉంది.
- source_word: לִבָּם
  choice: వారి హృదయాన్ని
  rationale: మూలంలోని ‘హృదయం’ అనే రూపకాన్ని నిలుపుతుంది. ఇక్కడ అది కేవలం భావోద్వేగాలకు కాక ఆలోచన, సంకల్పం, వివేచనలకు కేంద్రంగా ఉన్న అంతరంగాన్ని సూచించగలదు.
- source_word: צָפַנְתָּ
  choice: నీవు ... దాచిపెట్టావు
  rationale: צפן అనే క్రియలోని దాచడం లేదా మరుగుపరచడం అనే ప్రత్యక్ష చిత్రాన్ని, అలాగే దేవునిని ఉద్దేశించిన ద్వితీయ పురుష ఏకవచన రూపాన్ని నిలుపుతుంది.
- source_word: מִשָּׂכֶל
  choice: వివేకానికి దూరంగా
  rationale: שׂכל ఇక్కడ గ్రహింపు, అంతర్దృష్టి, వివేచన అనే భావాన్ని ఇస్తుంది; מן వియోగాన్ని సూచిస్తున్నందున ‘వివేకానికి దూరంగా’ అని అనువదించడం తెలుగు వాక్యంలో స్పష్టంగా ఉంటుంది.
- source_word: עַל כֵּן
  choice: అందుచేత
  rationale: మొదటి భాగంలోని కారణం నుంచి రెండవ భాగంలోని పర్యవసానానికి తీసుకెళ్లే అనుమానరహిత నిర్ధారణాత్మక సంధిని వ్యక్తం చేస్తుంది.
- source_word: לֹא תְרֹמֵם
  choice: నీవు వారిని హెచ్చించవు
  rationale: רום క్రియలోని పైకి లేపడం లేదా ఉన్నత స్థితికి చేర్చడం అనే భావాన్ని ‘హెచ్చించు’ నిలుపుతుంది. సందర్భం ఆధారంగా అర్థమయ్యే బహువచన కర్మను తెలుగులో ‘వారిని’ అని స్పష్టం చేశాం.
theological_decisions:
- issue: ‘వారి’ మరియు ‘వారిని’ అనే బహువచన సూచన ఎవరికి వర్తిస్తుంది?
  choice: యోబు దేవునితో మాట్లాడుతూ, వివేకం లేని తన ప్రత్యర్థులను లేదా వారి పక్షాన ఉన్నవారిని నిర్దిష్టంగా పేరు చెప్పకుండా ‘వారు’ అని సూచిస్తున్నట్లే ఉంచడం.
  alternative: ఇది వివేచన లేని మనుషుల గురించి సాధారణంగా చెప్పిన మాటగా గ్రహించడం.
  rationale: ద్వితీయ పురుష ఏకవచన క్రియలు దేవునిని సంబోధిస్తున్నాయని చూపుతాయి; తృతీయ పురుష బహువచన ప్రత్యయం మరో వర్గాన్ని సూచిస్తుంది. ఆ వర్గాన్ని వచనం స్పష్టంగా గుర్తించనందున అనువాదంలో అదనపు వివరణను చేర్చలేదు.
- issue: దేవుడు వారి అంతరంగాన్ని వివేకానికి దూరంగా దాచాడనే వాక్యంలోని దైవిక కార్యసాధకత్వం
  choice: దేవుడే ఈ చర్య చేసినట్లు చెప్పే మూలవాక్యపు ప్రత్యక్ష రూపాన్ని నిలుపడం.
  alternative: దేవుడు కేవలం వారి అవివేకాన్ని అనుమతించాడని లేదా వారు తమను తాము వివేకానికి దూరం చేసుకున్నారని సున్నితపరచడం.
  rationale: మూలంలో צָפַנְתָּ నేరుగా దేవునిని కర్తగా పేర్కొంటుంది. ఈ theological tension‌ను అనువాదం తగ్గించకూడదు లేదా పరిష్కరించకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన, కవితాత్మకమైన శైలిని ఉపయోగించాం. ‘హృదయం,’ ‘దాచిపెట్టావు,’ ‘హెచ్చించవు’ అనే పదాలు మూలంలోని రూపకాలను నిలుపుతాయి; అసాధారణమైన హీబ్రూ నిర్మాణాన్ని అర్థమయ్యేలా చేయడానికి ‘వివేకానికి దూరంగా’ అని సహజీకరించాం. ప్రతి పాదటిప్పణి గుర్తును సంబంధిత పదబంధం వెంట ఉంచాం.
