review_pass:
  verdict: revise
  source_fidelity: The draft correctly retains the causal connection, God's direct second-person action, the plural referents without identifying them, and the final refusal to raise/exalt them. However, “వివేకానికి దూరంగా దాచిపెట్టావు” slightly recasts the Hebrew separation construction as physical distance; “వివేకం నుండి దాచివేశావు” more directly reflects the Hebrew “hidden ... from understanding.”
  naturalness: The verse is generally fluent in modern standard Telugu. Replacing “హెచ్చించవు,” which can suggest increasing or intensifying and is less precise here, with “ఉన్నతపరచవు” gives a clearer natural rendering of the poetic image of raising/exalting.
  terminology: “హృదయం” appropriately preserves the Hebrew idiom, with the footnote usefully clarifying its intellectual and volitional sense. “వివేకం” is a suitable rendering of שֶׂכֶל. “ఉన్నతపరచు” accurately conveys רום without importing a specific interpretation such as granting military victory.
  issues:
  - severity: medium
    issue: “వివేకానికి దూరంగా” is a somewhat interpretive spatial paraphrase of מִשָּׂכֶל.
    rationale: The Hebrew expresses separation from understanding. “వివేకం నుండి” preserves that relation more directly while remaining idiomatic Telugu.
  - severity: medium
    issue: “హెచ్చించవు” is semantically broad and may be heard as “will not increase.”
    rationale: The context and Hebrew רום call for raising or exalting; “ఉన్నతపరచవు” is clearer in modern standard Telugu.
  revised_text: ఎందుకంటే నీవు వారి హృదయాన్ని[a] వివేకం నుండి దాచివేశావు; అందుచేత నీవు వారిని ఉన్నతపరచవు[b].
