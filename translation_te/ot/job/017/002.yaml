translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన కవితాత్మక శైలిని ఉపయోగించాం. ‘నా కన్ను రాత్రంతా నిలిచి ఉంది’ అనే రూపకం హీబ్రూ మూలంలోని బసచేయడం అనే సజీవ చిత్రాన్ని నిలుపుతుంది.
