  to: నిశ్చయంగా, ఎగతాళి చేసేవారు నా దగ్గరే ఉన్నారు[a]; వారి రెచ్చగొట్టే ప్రవర్తనలోనే[b] నా కన్ను బసచేస్తుంది.
