  text: אִם לֹ֣א הֲ֭תֻלִים עִמָּדִ֑/י וּ֝/בְ/הַמְּרוֹתָ֗/ם תָּלַ֥ן עֵינִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/017/002.yaml
  text: Surely mockers are with me[b][a], and my eye lodges on their provocation.
translation:
  language: te
  text: నిశ్చయంగా, ఎగతాళి చేసేవారు నా దగ్గరే ఉన్నారు[a]; వారి రెచ్చగొట్టే ప్రవర్తనలోనే[b] నా కన్ను బసచేస్తుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘మోసగాళ్లు నా దగ్గరే ఉన్నారు’; హీబ్రూ పదం మోసం చేసేవారిని లేదా ఎగతాళి చేసేవారిని సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘వారి తిరుగుబాటులోనే’ లేదా ‘వారి చేదు ప్రవర్తనలోనే’; ఈ హీబ్రూ పదబంధం క్లిష్టమైనది. అది రెచ్చగొట్టే, తిరుగుబాటు చేసే లేదా చేదుతో కూడిన ప్రవర్తనను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם לֹא
  choice: నిశ్చయంగా
  rationale: ఇక్కడ ఈ పదబంధం షరతును సూచించకుండా బలమైన నిశ్చయాన్ని వ్యక్తం చేస్తుంది; అందువల్ల సహజమైన తెలుగులో ‘నిశ్చయంగా’ అని అనువదించాం.
- source_word: הֲתֻלִים
  choice: ఎగతాళి చేసేవారు
  rationale: ఈ పదం అపహాస్యం లేదా ఎగతాళి చేసేవారిని సూచించగలదు. యోబుతో వాదిస్తున్నవారి మాటల సందర్భంలో ఈ అర్థం చక్కగా సరిపోతుంది; ‘మోసగాళ్లు’ అనే భావం కూడా సాధ్యమే కాబట్టి పాదసూచికలో ఉంచాం.
- source_word: עִמָּדִי
  choice: నా దగ్గరే ఉన్నారు
  rationale: ఇది యోబు సమక్షంలో, అతని సమీపంలో వారు ఉన్నారని సూచిస్తుంది. ‘దగ్గరే’ అనే రూపం ఆ సమీపత్వాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וּבְהַמְרוֹתָם
  choice: వారు రెచ్చగొట్టే తీరుపైనే
  rationale: మూలపదం రెచ్చగొట్టడం, తిరుగుబాటు చేయడం లేదా చేదుగా ప్రవర్తించడం అనే భావాలను మోయగలదు. ఈ సందర్భంలో ప్రత్యర్థుల వైరం నిండిన ప్రవర్తనను అతిగా నిర్దిష్టం చేయకుండా ‘రెచ్చగొట్టే తీరు’ వ్యక్తం చేస్తుంది.
- source_word: תָּלַן
  choice: రాత్రంతా నిలిచి ఉంది
  rationale: ఈ క్రియకు మూలంగా ‘రాత్రి బసచేయడం’ అనే అర్థం ఉంది. కన్నుకు వర్తించినప్పుడు అది ఒకదానిపైనే నిలిచి ఉండటాన్ని రూపకంగా సూచిస్తుంది; ‘రాత్రంతా నిలిచి ఉంది’ ఆ హీబ్రూ చిత్రాన్ని తెలుగులో నిలుపుతుంది.
- source_word: עֵינִי
  choice: నా కన్ను
  rationale: హీబ్రూలో ఏకవచనం ఉంది; తెలుగులోనూ ‘నా కన్ను’ సహజంగా ఉండి మూలరూపాన్ని కాపాడుతుంది.
