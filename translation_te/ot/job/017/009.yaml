source:
  edition: WLC
  text: וְ/יֹאחֵ֣ז צַדִּ֣יק דַּרְכּ֑/וֹ וּֽ/טֳהָר יָ֝דַ֗יִם יֹסִ֥יף אֹֽמֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/017/009.yaml
  text: Yet the righteous holds fast to his way[a], and the one with clean hands grows stronger.
translation:
  language: te
  text: అయినా నీతిమంతుడు తన మార్గాన్ని గట్టిగా పట్టుకుంటాడు; శుద్ధమైన చేతులు గలవాడు మరింత బలాన్ని పొందుతాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “శుద్ధమైన చేతులు గలవాడు బలాన్ని పెంచుకుంటాడు.” హీబ్రూలో అక్షరార్థంగా, “బలాన్ని చేర్చుతాడు”; దీన్ని “బలంలో వృద్ధి చెందుతాడు” అని, మరింత సంకుచితంగా “ధైర్యాన్ని పొందుతాడు” అని కూడా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֹאחֵז
  choice: అయినా ... గట్టిగా పట్టుకుంటాడు
  rationale: וְ సందర్భంలో యోబు చెప్పిన నిరాశాజనక పరిస్థితికి స్వల్ప విరుద్ధ భావాన్ని ఇస్తుంది; אחז పట్టుకోవడం, విడువకుండా కొనసాగడం అనే భావాలను కలిగి ఉంది.
- source_word: צַדִּיק
  choice: నీతిమంతుడు
  rationale: ఏకవచన విశేషణం నామవాచకంగా వాడబడింది; తెలుగు సహజ వాడుకలో ప్రతినిధి ఏకవచనాన్ని నిలుపుతుంది.
- source_word: דַּרְכּוֹ
  choice: తన మార్గాన్ని
  rationale: דֶּרֶךְ అక్షరార్థమైన దారినీ, రూపకాలంకారంగా జీవన విధానాన్నీ సూచించగలదు; ‘మార్గం’ రెండు భావాలను నిలుపుతుంది.
- source_word: וּטֳהָר יָדַיִם
  choice: చేతులు శుద్ధంగా ఉన్నవాడు
  rationale: నిర్దోషిత్వం లేదా నైతిక పవిత్రతను సూచించే హీబ్రూ దృశ్యరూపాన్ని స్పష్టమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: יֹסִיף אֹמֶץ
  choice: మరింత బలాన్ని పొందుతాడు
  rationale: పదశః ‘బలాన్ని చేర్చుకుంటాడు’; సందర్భంలో బలం లేదా స్థైర్యం పెరగడాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది. ‘ధైర్యం పొందుతాడు’ కూడా సాధ్యమే కాని అది భావాన్ని సంకుచితం చేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే శైలి. సమాంతర కవితా నిర్మాణం, ‘మార్గం’ మరియు ‘చేతులు’ అనే మూలభాష దృశ్యరూపాలు నిలుపబడ్డాయి.
