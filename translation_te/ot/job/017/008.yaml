source:
  edition: WLC
  text: יָשֹׁ֣מּוּ יְשָׁרִ֣ים עַל זֹ֑את וְ֝/נָקִ֗י עַל חָנֵ֥ף יִתְעֹרָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/017/008.yaml
  text: The upright are appalled at this[a], and the innocent stirs himself up against the godless.
translation:
  language: te
  text: నీతిమంతులు దీనివల్ల దిగ్భ్రాంతి చెందుతారు; నిర్దోషి భక్తిహీనునికి[a] వ్యతిరేకంగా తనను తాను పురికొల్పుకుంటాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘కపటుడు.’ హీబ్రూ పదం దైవభయం లేని లేదా అపవిత్రమైన వ్యక్తిని సూచించగలదు; కొన్ని సందర్భాల్లో సంప్రదాయంగా ‘కపటుడు’ అని అనువదించారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשֹׁמּוּ
  choice: దిగ్భ్రాంతి చెందుతారు
  rationale: שׁמם అనే క్రియ ఇక్కడ భయమిశ్రితమైన తీవ్రమైన ఆశ్చర్యాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘దిగ్భ్రాంతి చెందుతారు’ ఈ భావోద్వేగ బలాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: יְשָׁרִים
  choice: యథార్థవంతులు
  rationale: నామవాచకంగా వాడిన బహువచన విశేషణం; నైతికంగా నిటారైన లేదా సత్ప్రవర్తనగల వారిని సూచిస్తుంది.
- source_word: עַל זֹאת
  choice: దీనిని చూసి
  rationale: עַל זֹאת ఇక్కడ ప్రతిస్పందనకు కారణమైన సందర్భాన్ని సూచిస్తుంది. ‘దీనిని చూసి’ అనేది తెలుగులో సహజంగా ఉండి, ‘దీనివల్ల/దీనినిబట్టి’ అనే భావాన్ని అందిస్తుంది.
- source_word: נָקִי
  choice: నిర్దోషి
  rationale: అపరాధం లేదా దోషం లేని వ్యక్తిని సూచించే నైతిక అర్థాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: חָנֵף
  choice: భక్తిహీనుడు
  rationale: ఈ పదం కేవలం కపటత్వాన్ని కాకుండా దైవభయం లేని, అపవిత్రమైన లేదా అధార్మిక వ్యక్తిని విస్తృతంగా సూచించగలదు. ‘భక్తిహీనుడు’ ఆ మతనైతిక భావాన్ని అనవసరంగా సంకుచితం చేయదు.
- source_word: יִתְעֹרָר
  choice: తనను తాను పురికొల్పుకుంటాడు
  rationale: హిత్పోలేల్ రూపంలోని ఆత్మార్థక భావాన్ని, అలాగే చర్యకు తనను తాను ప్రేరేపించుకునే అర్థాన్ని నిలుపుతుంది.
- source_word: עַל חָנֵף
  choice: భక్తిహీనునికి ఎదిరిగా
  rationale: మేల్కొనడం లేదా పురికొల్పుకోవడం అనే క్రియతో עַל ఇక్కడ వ్యతిరేకతను సూచిస్తుంది; అందువల్ల ‘ఎదిరిగా’ సరైన సందర్భార్థాన్ని ఇస్తుంది.
theological_decisions:
- issue: חָנֵף పదానికి అనువాదం
  choice: భక్తిహీనుడు
  alternative: కపటుడు
  rationale: ఈ వచనంలో యథార్థవంతుడు/నిర్దోషి అనే నైతిక వర్గాలకు విరుద్ధంగా దైవభయం లేని వ్యక్తి నిలుస్తున్నాడు. ‘కపటుడు’ అని అనడం పదార్థాన్ని కేవలం ద్వంద్వ ప్రవర్తనకు పరిమితం చేయవచ్చు; ‘భక్తిహీనుడు’ విస్తృతమైన నైతిక-మతపరమైన వ్యతిరేకతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన శైలి. కవితాత్మక సమాంతరతను నిలుపుతూ, יִתְעֹרָר లోని ఆత్మార్థక భావాన్ని స్పష్టంగా వ్యక్తం చేయడానికి ‘తనను తాను పురికొల్పుకుంటాడు’ వాడబడింది. పాదటిప్పణి సూచిక [a] ప్రధాన పాఠ్యంలో చేర్చబడింది.
