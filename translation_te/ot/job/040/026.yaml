source:
  edition: WLC
  text: הֲ/תָשִׂ֣ים אַגְמ֣וֹן בְּ/אַפּ֑/וֹ וּ֝/בְ/ח֗וֹחַ תִּקּ֥וֹב לֶֽחֱי/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/040/026.yaml
  text: Can you put a rope through his nose[b][a], or pierce his jaw with a hook?
translation:
  language: te
  text: దాని ముక్కులో ఒక తాడును[a] వేయగలవా? కొక్కెంతో దాని దవడను[b] గుచ్చగలవా?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దాని ముక్కులో ఒక రెల్లు’; హెబ్రీ పదం אַגְמוֹן అక్షరార్థంగా రెల్లు లేదా జమ్మును సూచిస్తుంది; అయితే ఇక్కడ రెల్లుతో చేసిన తాడు ఉద్దేశమై ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘దాని చెంపను.’
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתָשִׂים
  choice: పెట్టగలవా?
  rationale: ప్రశ్నార్థక הֲతో కూడిన שׂים రూపం యోబుకు విసిరిన సవాలును సూచిస్తుంది; ‘పెట్టగలవా?’ ఆధునిక తెలుగులో ఆ అలంకారిక ప్రశ్నను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אַגְמוֹן
  choice: రెల్లుతాడు
  rationale: ఈ పదానికి ప్రాథమికంగా ‘రెల్లు’ అని అర్థం; ఇక్కడ జంతువును అదుపు చేయడానికి ముక్కులో పెట్టే రెల్లుతో చేసిన తాడు భావం సందర్భానికి సరిపోతుంది. సమాసరూపం వస్తువు స్వభావాన్నీ దాని ఉపయోగాన్నీ నిలుపుతుంది.
- source_word: בְּאַפּוֹ
  choice: దాని ముక్కులో
  rationale: אַף ఇక్కడ ముక్కు లేదా ముక్కురంధ్రాన్ని సూచిస్తుంది. בְּను అతిగా నిర్దిష్టం చేయకుండా ‘ముక్కులో’ అని అనువదించడం మూలంలోని భావాన్ని నిలుపుతుంది.
- source_word: וּבְחוֹחַ
  choice: కొక్కెంతో
  rationale: חוֹחַకు ముల్లు లేదా కొక్కెం అనే అర్థాలు ఉండవచ్చు; జంతువును పట్టి అదుపు చేసే ఈ సందర్భంలో ‘కొక్కెం’ స్పష్టమైన, సహజమైన ఎంపిక.
- source_word: תִּקּוֹב
  choice: గుచ్చగలవా?
  rationale: ఈ క్రియ రంధ్రం చేయడం లేదా చీల్చి దూర్చడం అనే భావాన్ని ఇస్తుంది; కొక్కెం సందర్భంలో ‘గుచ్చు’ సంక్షిప్తంగా, సజీవంగా ఉంటుంది.
- source_word: לֶחֱיוֹ
  choice: దాని దవడను
  rationale: לְחִי అంటే దవడ లేదా చెంప. కొక్కెంతో అదుపు చేసే సందర్భంలో ‘దవడ’ ప్రధాన పాఠానికి తగినది; ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
