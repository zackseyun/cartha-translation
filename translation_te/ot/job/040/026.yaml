translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, దేవుడు యోబుకు వేస్తున్న సూటి అలంకారిక ప్రశ్నల బలాన్ని కాపాడుతూ అనువదించబడింది. ‘రెల్లుతాడు’ సాధారణ పాఠకుడికి అర్థమయ్యేలా సందర్భోచిత అర్థాన్ని ఇస్తుంది; అక్షరార్థం పాదసూచికలో నిలుపబడింది.
