source:
  edition: WLC
  text: הֲ֭/רֹב עִם שַׁדַּ֣י יִסּ֑וֹר מוֹכִ֖יחַ אֱל֣וֹהַּ יַעֲנֶֽ/נָּה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/job/040/002.yaml
  text: Will one who contends with the Almighty correct him? Let the one who argues with God answer it[a][b].
translation:
  language: te
  text: సర్వశక్తిమంతునితో వాదించేవాడు ఆయనను సరిదిద్దుతాడా?[a] దేవునితో వాదించేవాడు దీనికి జవాబివ్వాలి.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సర్వశక్తిమంతునిలో తప్పు వెదికేవాడు ఆయనకు ఉపదేశిస్తాడా/ఆయనను గద్దిస్తాడా?” హీబ్రూ పదాలు న్యాయవివాద భావాన్నీ, సరిదిద్దడం లేదా గద్దించడం అనే భావాన్నీ కలిపి వ్యక్తం చేస్తాయి.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “దీనికి అతడు జవాబివ్వాలి,” లేక “ఆయనకు జవాబివ్వాలి.” హీబ్రూ ప్రత్యయం నేరుగా దేవుణ్ణి కాక, ప్రస్తావించిన విషయాన్ని సూచిస్తుండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲרֹב
  choice: వాదించేవాడు
  rationale: ריב మూలానికి వాదించడం, వివాదానికి దిగడం అనే న్యాయవివాద భావం ఉంది. ఆధునిక తెలుగులో సహజంగా ఉండేలా క్రియాత్మక నామరూపాన్ని వాడాం.
- source_word: עִם
  choice: తో
  rationale: మూలార్థం ‘తో’; వాదన సందర్భంలో వ్యతిరేక భావం సహజంగానే వినిపిస్తుంది.
- source_word: שַׁדַּי
  choice: సర్వశక్తిమంతుడు
  rationale: యోబులోని שדי అనే దైవ బిరుదుకు తెలుగులో స్థిరమైన, అర్థవంతమైన అనువాదం.
- source_word: יִסּוֹר
  choice: సరిదిద్దుతాడా
  rationale: יסרకు శిక్షణ ఇవ్వడం, గద్దించడం, సరిదిద్దడం వంటి అర్థాలున్నాయి. ఇక్కడ మానవ వాది దేవుణ్ణి సరిదిద్దాలనే ధోరణిని ప్రశ్నించే వాక్యంగా ‘సరిదిద్దుతాడా’ సరిపోతుంది.
- source_word: מוֹכִיחַ
  choice: వాదించేవాడు
  rationale: יכח న్యాయవివాదం చేయడం, తప్పు చూపడం, గద్దించడం వంటి భావాలు కలిగి ఉంది. సందర్భంలోని వివాదాత్మక భావాన్ని సాధారణ పాఠకులకు స్పష్టంగా అందిస్తుంది.
- source_word: אֱלוֹהַּ
  choice: దేవుడు
  rationale: యోబు గ్రంథంలో సాధారణంగా కనిపించే ఏకవచన కవితాత్మక దైవపదాన్ని అదనపు విశేషణం లేకుండా అనువదించాం.
- source_word: יַעֲנֶנָּה
  choice: దీనికి జవాబివ్వాలి
  rationale: స్త్రీలింగ ఏకవచన ప్రత్యయం ముందున్న విషయం లేదా ఆరోపణను సూచించే అవకాశముంది. తెలుగులో ‘దీనికి’ ఆ సంక్షిప్త సూచనను సహజంగా నిలుపుతుంది.
theological_decisions:
- issue: ఈ వాక్యం మనిషి దేవుణ్ణి సరిదిద్దడాన్ని సూచిస్తుందా, లేక దేవుడు మనిషిని సరిదిద్దడాన్ని సూచిస్తుందా?
  choice: సర్వశక్తిమంతునితో వాదించే మనిషే ఆయనను సరిదిద్దే ప్రయత్నం చేస్తున్నట్లు అలంకారిక ప్రశ్న సూచిస్తుంది.
  alternative: సర్వశక్తిమంతునితో వాదించేవాడు దిద్దుబాటును స్వీకరించాలి.
  rationale: వాక్యనిర్మాణం, రెండో పాదంలోని సమాంతర భావం יִסּוֹרకు మానవ వాదినే కర్తగా తీసుకోవడానికి అనుకూలంగా ఉన్నాయి. రెండో పాదం దేవునితో వాదించేవాణ్ణి జవాబు చెప్పమని పిలుస్తూ మొదటి పాదాన్ని బలపరుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనా సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్యనిర్మాణం. ‘వాదించేవాడు’ అనే పునరుక్తి రెండు పాదాల న్యాయవివాద సమాంతరతను నిలుపుతుంది.
