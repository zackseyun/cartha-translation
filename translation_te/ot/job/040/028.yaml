source:
  edition: WLC
  text: הֲ/יִכְרֹ֣ת בְּרִ֣ית עִמָּ֑/ךְ תִּ֝קָּחֶ֗/נּוּ לְ/עֶ֣בֶד עוֹלָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/job/040/028.yaml
  text: Will he make a covenant with you[b][a], that you would take him as a servant forever?
translation:
  language: te
  text: అది నీతో ఒడంబడిక[a] చేసుకుంటుందా? దాన్ని శాశ్వతంగా నీ బానిసగా[b] తీసుకుంటావా?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, ‘నీతో ఒడంబడికను కోస్తుందా?’ ఇది ‘ఒడంబడిక చేసుకోవడం’ అనే అర్థమిచ్చే స్థిర నుడికారం.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘సేవకునిగా.’ హీబ్రూ עֶבֶד అనే పదానికి ‘సేవకుడు’ లేదా ‘బానిస’ అనే అర్థాలు రావచ్చు; ఇక్కడ ‘శాశ్వతంగా’ అనే మాట స్థిరమైన బానిసత్వాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיִכְרֹת בְּרִית
  choice: ఒడంబడిక చేసుకుంటుందా?
  rationale: כרת ברית అనే స్థిర హీబ్రూ నుడికారానికి అక్షరార్థం ‘ఒడంబడికను కోయడం’; ఆధునిక తెలుగులో దాని సహజమైన అర్థం ‘ఒడంబడిక చేసుకోవడం.’ הֲ సూచించే ప్రశ్నార్థక భావాన్ని నిలిపాము.
- source_word: עִמָּךְ
  choice: నీతో
  rationale: రెండవ పురుష ఏకవచన సంబోధనను సహజమైన ఆధునిక తెలుగు రూపంలో అనువదించాము.
- source_word: תִּקָּחֶנּוּ
  choice: దాన్ని … తీసుకుంటావా?
  rationale: לקח యొక్క ప్రాథమిక భావమైన ‘తీసుకోవడం’ను నిలిపి, మూడవ పురుష ఏకవచన కర్మను జంతువుకు సహజమైన తెలుగు సర్వనామం ‘దాన్ని’తో వ్యక్తం చేశాము. హీబ్రూలోని రెండవ క్రియారూపాన్ని ప్రత్యేక ప్రశ్నగా ఉంచడం వాక్యంలోని వాక్చాతుర్య ప్రశ్నల సమాంతరతను కాపాడుతుంది.
- source_word: לְעֶבֶד
  choice: నీ బానిసగా
  rationale: עֶבֶדకు ‘సేవకుడు’ లేదా ‘బానిస’ అనే అర్థాలు రావచ్చు. עוֹלָםతో కూడిన ఈ సందర్భం శాశ్వత స్వాధీన సేవను నొక్కిచెబుతుంది కాబట్టి ‘బానిస’ను ప్రధాన పాఠంలో ఎంచుకున్నాము.
- source_word: עוֹלָם
  choice: శాశ్వతంగా
  rationale: ఇక్కడ ఈ పదం అంతం లేని లేదా స్థిరంగా కొనసాగే కాలాన్ని సూచిస్తుంది; ‘శాశ్వతంగా’ ఆధునిక తెలుగులో స్పష్టంగా, సహజంగా ఉంది.
