  yaml_path: translation/ot/job/040/005.yaml
  text: I have spoken once[a], and I will not answer; twice, and I will add nothing more.
translation:
  language: te
  text: ఒకసారి మాట్లాడాను[a]; ఇక నేను జవాబివ్వను. రెండుసార్లు మాట్లాడాను; ఇక మరేమీ చెప్పను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఒకసారి మాట్లాడాను, కానీ జవాబివ్వను; రెండుసార్లు మాట్లాడాను, కానీ ఇక కొనసాగించను.” ‘చేర్చడం’ అనే హీబ్రూ ప్రయోగానికి ఒక పనిని కొనసాగించడం లేదా మళ్లీ చేయడం అనే అర్థం కూడా ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחַת
  choice: ఒకసారి
  rationale: స్త్రీలింగ సంఖ్యావాచకమైన ‘ఒకటి’ ఇక్కడ క్రియావిశేషణంగా వాడబడి ‘ఒకసారి’ అనే భావాన్ని ఇస్తుంది.
- source_word: דִּבַּרְתִּי
  choice: మాట్లాడాను
  rationale: ప్రథమ పురుష ఏకవచన సంపూర్ణ క్రియ యోబు ఇప్పటికే పలికిన మాటలను సూచిస్తుంది; సహజమైన ఆధునిక తెలుగులో ‘మాట్లాడాను’ సరిపోతుంది.
- source_word: וְלֹא אֶעֱנֶה
  choice: ఇక నేను జవాబివ్వను
  rationale: ענה అనే క్రియకు ఇక్కడ ‘జవాబివ్వడం’ అనే సాధారణ అర్థం. సందర్భంలో ఇకపై జవాబు కొనసాగించననే యోబు సంకల్పాన్ని ‘ఇక’ స్పష్టం చేస్తుంది.
- source_word: וּשְׁתַּיִם
  choice: రెండుసార్లు
  rationale: ‘రెండు’ అనే సంఖ్యావాచకం ‘ఒకసారి’కి సమాంతరంగా క్రియావిశేషణ భావంలో ఉంది.
- source_word: וְלֹא אוֹסִיף
  choice: ఇక మరేమీ చెప్పను
  rationale: יסף హిఫీల్ రూపం ‘మరింత చేయడం, కొనసాగించడం, మళ్లీ చేయడం’ అనే పరిధిని కలిగి ఉంది. ఇక్కడ మాటలను కొనసాగించననే భావాన్ని సహజ తెలుగులో తెలియజేస్తుంది; ప్రత్యామ్నాయ అక్షరార్థాన్ని పాదటిప్పణి కాపాడుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. హీబ్రూ సమాంతర నిర్మాణాన్ని నిలుపుతూ, ‘ఒకసారి—రెండుసార్లు’ అనే జంటను స్పష్టంగా ఉంచింది.
