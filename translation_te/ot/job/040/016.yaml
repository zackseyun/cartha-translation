translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలిని ఉపయోగించాం. వర్ణించబడుతున్న జీవికి తెలుగు సహజ ప్రయోగానుసారం నపుంసక ఏకవచనమైన ‘దాని’ వాడాం. హీబ్రూ కవితా సమాంతరాన్ని అర్ధవిరామంతో నిలుపుతూ ‘బలం/శక్తి’ అనే దగ్గరి అర్థాల పదజోడును ఉంచాం.
