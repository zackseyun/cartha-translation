  terminology: ‘బలం,’ ‘శక్తి,’ ‘నడుము,’ ‘పొట్ట,’ ‘కండరాలు’ అన్నీ ఆధునిక ప్రామాణిక తెలుగులో సరైనవి. ‘స్నాయువులు’ అనే ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇవ్వడం שְׁרִירֵי యొక్క సాధ్యమైన విస్తృతార్థాన్ని తగిన విధంగా సూచిస్తుంది.
