  source_fidelity: హీబ్రూ వాక్యంలోని దృష్టి ఆకర్షణ (הִנֵּה נָא), శరీరబలాన్ని సూచించే సమాంతర పదజోడు (כֹחוֹ / אֹנוֹ), నడుము ప్రాంతం, మరియు పొట్ట కండరాలు అనే శరీర వర్ణనను అనువాదం విశ్వసనీయంగా ప్రతిబింబిస్తుంది. ‘దాని బలం/దాని శక్తి’ అనే ఎంపిక మూలంలోని సమీపార్థక కవితా సమాంతరాన్ని నిలుపుతుంది.
