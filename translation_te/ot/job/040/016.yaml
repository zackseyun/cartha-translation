  text: הִנֵּה נָ֣א כֹח֣/וֹ בְ/מָתְנָ֑י/ו וְ֝/אֹנ֗/וֹ בִּ/שְׁרִירֵ֥י בִטְנֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/040/016.yaml
  text: Look now[a], his strength is in his loins[b], and his power in the muscles of his belly.
translation:
  language: te
  text: ఇదిగో చూడు! దాని బలం దాని నడుములో ఉంది; దాని శక్తి[a] దాని పొట్ట కండరాల్లో[b] ఉంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘శక్తి’కి బదులు ‘సత్తువ’ అని కూడా అనువదించవచ్చు; హీబ్రూ కవితా సమాంతరంలో శారీరక బలాన్ని సూచించే దగ్గరి అర్థాల రెండు పదాలు ఉన్నాయి.
    reason: lexical_alternative
  - marker: b
    text: ‘పొట్ట కండరాలు’కి బదులు ‘పొట్ట స్నాయువులు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה נָא
  choice: ఇదిగో చూడు!
  rationale: הִנֵּה శ్రోత దృష్టిని ఆకర్షిస్తుంది; נָא ఆ పిలుపుకు తక్షణతను, ఉద్ఘాటనను జోడిస్తుంది. ‘ఇదిగో చూడు!’ ఆధునిక తెలుగులో సహజంగా ఉండి ఆ సజీవ పిలుపును నిలుపుతుంది.
- source_word: כֹחוֹ
  choice: దాని బలం
  rationale: כֹחַ ఇక్కడ జీవి శరీర బలాన్ని సూచిస్తుంది. ‘బలం’ స్పష్టమైన, సహజమైన భౌతిక పదం.
- source_word: בְמָתְנָיו
  choice: దాని నడుములో
  rationale: מָתְנַיִם నడుము–తుంటి ప్రాంతాన్ని సూచిస్తుంది. ‘నడుము’ సాధారణ పాఠకులకు సహజంగా అర్థమవుతూ మూలంలోని శరీర సూచనను నిలుపుతుంది.
- source_word: וְאֹנוֹ
  choice: దాని శక్తి
  rationale: אוֹן బలం, సత్తువ లేదా శక్తిని సూచిస్తుంది. సమాంతరమైన כֹחַకు ‘బలం’ వాడినందున, అర్థసామ్యాన్ని కాపాడుతూ సహజ వైవిధ్యం కోసం ఇక్కడ ‘శక్తి’ వాడబడింది.
- source_word: בִּשְׁרִירֵי
  choice: కండరాల్లో
  rationale: שְׁרִירִים కండరాలు, స్నాయువులు లేదా దృఢమైన మాంసభాగాలను సూచించవచ్చు. ఆధునిక శరీర వర్ణనలో ‘కండరాలు’ అత్యంత స్పష్టమైన ఎంపిక; ప్రత్యామ్నాయం పాదసూచికలో ఉంచబడింది.
- source_word: בִטְנוֹ
  choice: దాని పొట్ట
  rationale: בֶּטֶן ఇక్కడ శరీరంలోని పొట్ట లేదా ఉదర భాగాన్ని సూచిస్తుంది. ‘పొట్ట’ సాధారణ ఆధునిక తెలుగులో నేరుగా, స్పష్టంగా ఉంటుంది.
