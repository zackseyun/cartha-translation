lexical_decisions:
- source_word: הֲ/יַרְבֶּה
  choice: ఎన్నో ... వేడుకుంటుందా
  rationale: ప్రశ్నార్థక הֲను ప్రశ్నారూపంతోనూ, רבה హిఫీల్ భావమైన ‘అనేకం చేయడం’ను సహజమైన తెలుగు ప్రయోగంతోనూ తెలిపింది.
- source_word: אֵלֶיךָ
  choice: నిన్ను / నీతో
  rationale: ఎదుటి వ్యక్తివైపు ఉద్దేశించిన మాట అనే אֶל భావాన్ని రెండు సమాంతర భాగాల్లో సహజ తెలుగు వాక్యనిర్మాణానికి అనుగుణంగా వ్యక్తం చేసింది.
- source_word: תַּחֲנוּנִים
  choice: కనికరం కోసం ... వేడుకోళ్లు
  rationale: దయ లేదా అనుగ్రహం కోరే గాఢమైన మనవులు అనే పదార్థాన్ని సాధారణ పాఠకునికి స్పష్టంగా ఉంచుతుంది.
- source_word: אִם
  choice: లేక
  rationale: ఇక్కడ షరతును కాక, సమాంతర ప్రశ్నలో రెండవ ప్రత్యామ్నాయాన్ని పరిచయం చేస్తుంది.
- source_word: יְדַבֵּר
  choice: మాట్లాడుతుందా
  rationale: דבר పీయేల్‌కు సాధారణమైన ‘మాట్లాడు’ అనే అర్థాన్ని సహజంగా ప్రతిబింబిస్తుంది.
- source_word: רַכּוֹת
  choice: మృదువైన మాటలు
  rationale: స్త్రీలింగ బహువచన విశేషణం ఇక్కడ నామవాచకార్థంగా వాడబడి, మృదువైన లేదా సున్నితమైన పలుకులను సూచిస్తుంది; ‘మృదువైన మాటలు’ అనవసరంగా ముఖస్తుతి భావాన్ని చేర్చదు.
