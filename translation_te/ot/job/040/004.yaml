  yaml_path: translation/ot/job/040/004.yaml
  text: Look[a], I am insignificant; what can I answer you? I put my hand over my mouth.
translation:
  language: te
  text: ఇదిగో, నేను అల్పుడిని[a]; నీకు ఏమని జవాబివ్వగలను? నా నోటిమీద నా చెయ్యి ఉంచాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నేను లెక్కకు రానివాడిని”; సంప్రదాయక అనువాదం, “నేను నీచుడిని.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: ఇదిగో
  rationale: యోబు జవాబులో అకస్మాత్తుగా వచ్చిన గ్రహింపును, శ్రద్ధను ఆకర్షించే అవ్యయ బలాన్ని సహజమైన గౌరవప్రద తెలుగు రూపంలో తెలియజేస్తుంది.
- source_word: קַלֹּתִי
  choice: నేను అల్పుడిని
  rationale: קלל మూలంలోని చిన్నదనం, తక్కువ ప్రాముఖ్యత, స్వల్పత అనే భావాన్ని వ్యక్తం చేస్తుంది. నైతికంగా ‘నీచుడు’ అనే మరింత బలమైన భావాన్ని అనవసరంగా చేర్చదు.
- source_word: מָה אֲשִׁיבֶךָּ
  choice: నీకు ఏమని జవాబివ్వగలను?
  rationale: మָהను ‘ఏమని’గా, שוב హిఫీల్ రూపాన్ని ‘జవాబివ్వడం’గా అందిస్తుంది; సందర్భంలోని తన అసమర్థతను తెలుగులో సహజంగా తెలిపేందుకు ‘గలను’ వాడబడింది.
- source_word: יָדִי שַׂמְתִּי לְמוֹ פִי
  choice: నా నోటిమీద నా చెయ్యి ఉంచుకుంటాను
  rationale: మౌనం, వినయం సూచించే శరీరభాషను యథాతథంగా ఉంచుతుంది. హెబ్రీ ఖతల్ రూపం సందర్భంలో నిర్ణయాత్మక ప్రస్తుత చర్యను సూచించగలదని భావించి తెలుగులో సహజమైన ‘ఉంచుకుంటాను’ ఎంచుకోబడింది.
theological_decisions:
- issue: యోబు తనను వర్ణించుకున్న మాటకు నైతిక అపవిత్రత భావం ఇవ్వాలా?
  choice: నేను అల్పుడిని
  alternative: నేను నీచుడిని; నేను లెక్కకు రానివాడిని
  rationale: హెబ్రీ పదం ఈ సందర్భంలో దేవుని ఎదుట తన స్వల్పతను, తక్కువతనాన్ని ప్రధానంగా సూచిస్తుంది. ‘నీచుడిని’ అనడం వాక్యంలో స్పష్టంగా లేని నైతిక భ్రష్టత ఒప్పుకోలును చేర్చే ప్రమాదం ఉంది; ‘అల్పుడిని’ వినయాన్ని నిలుపుతూ ఆ అతివ్యాఖ్యానాన్ని నివారిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘అల్పుడిని’ సాధారణ పాఠకునికి అర్థమయ్యేలా ఉండి మూలంలోని స్వల్పత భావాన్ని కాపాడుతుంది; నోటి మీద చెయ్యి ఉంచే రూపకాన్ని మార్చకుండా నిలిపింది.
