  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּֽי ב֭וּל הָרִ֣ים יִשְׂאוּ ל֑/וֹ וְֽ/כָל חַיַּ֥ת הַ֝/שָּׂדֶ֗ה יְשַֽׂחֲקוּ שָֽׁם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/040/020.yaml
  text: For the mountains bear food for him[b][a], and all the wild animals of the field play there.
translation:
  language: te
  text: ఎందుకంటే, కొండలు దానికి ఆహారాన్ని పండిస్తాయి[a], బయలులోని అడవి జంతువులన్నీ అక్కడ ఆడుకుంటాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కొండలు దానికి దిగుబడిని ఇస్తాయి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ఈ వాక్యం ముందున్న వర్ణనకు కారణాన్ని లేదా వివరణను జోడిస్తుంది; ఆధునిక తెలుగులో ‘ఎందుకంటే’ ఆ సంబంధాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: בּוּל
  choice: ఆహారం
  rationale: ఈ పదానికి పంట, దిగుబడి లేదా భూమి పండించే ఉత్పత్తి అనే భావం ఉంది. ఇక్కడ ఆ జంతువుకు కొండలు సమకూర్చే పోషణను సూచిస్తున్నందున ‘ఆహారం’ సహజంగా, సందర్భానుకూలంగా ఉంది.
- source_word: הָרִים
  choice: కొండలు
  rationale: హీబ్రూ బహువచన నామవాచకానికి నేరుగా సరిపోయే, సాధారణ ఆధునిక తెలుగు పదం.
- source_word: יִשְׂאוּ לוֹ
  choice: అతనికి … పండిస్తాయి
  rationale: నשא అనే క్రియకు మోయడం అనే ప్రాథమిక భావం ఉన్నా, בּוּלతో కలిసి ఇక్కడ భూమి దిగుబడిని పుట్టించడం లేదా ఇవ్వడం అనే భావాన్ని వ్యక్తం చేస్తుంది. ‘పండిస్తాయి’ ఆ దృశ్యరూపాన్ని సహజ తెలుగులో నిలుపుతుంది.
- source_word: וְכָל חַיַּת הַשָּׂדֶה
  choice: అడవి జంతువులన్నీ
  rationale: ఈ పదబంధం బహిరంగ ప్రదేశాల్లో సంచరించే అడవి జంతువులను సమూహంగా సూచిస్తుంది. ‘పొలంలోని జంతువులు’ అనడం పెంపుడు జంతువుల భావాన్ని కలిగించవచ్చు; అందువల్ల ‘అడవి జంతువులన్నీ’ స్పష్టంగా ఉంటుంది.
- source_word: יְשַׂחֲקוּ
  choice: ఆడుకుంటాయి
  rationale: Piel రూపంలోని שׂחק ఇక్కడ ఉల్లాసంగా ఆడడం అనే భావాన్ని ఇస్తుంది; ‘ఆడుకుంటాయి’ సహజమైన ఆధునిక తెలుగు.
- source_word: שָׁם
  choice: అక్కడ
  rationale: కొండలు లేదా ఆ నివాస ప్రాంతాన్ని సూచించే సాధారణ స్థలవాచక పదం.
