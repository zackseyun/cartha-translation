translation_notes:
  register: సాధారణ పాఠకులకు అర్థమయ్యే ఆధునిక ప్రామాణిక తెలుగును ఉపయోగించాం. ‘ఆహారం పండిస్తాయి’ అనే పదబంధం మూలంలోని కొండలు దిగుబడిని మోస్తాయి/పుట్టిస్తాయి అనే కవితాత్మక చిత్రాన్ని సహజంగా నిలుపుతుంది; వాక్యంలోని జంతువుకు పుంలింగ ఏకవచన సూచనను ‘అతనికి’గా ఉంచాం.
