translation:
  language: te
  text: అది తామర చెట్ల కింద పడుకుంటుంది[a], రెల్లులూ చిత్తడి నేలా మాటున పడుకుంటుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీడనిచ్చే చెట్ల కింద.” ఇక్కడి హీబ్రూ పదం సూచించే ఖచ్చితమైన వృక్షజాతి తెలియదు; సందర్భాన్ని బట్టి సాధారణంగా “తామర చెట్లు” అని గుర్తిస్తారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּחַת
  choice: కింద
  rationale: స్థానాన్ని తెలిపే ఈ ఉపసర్గకు ఆధునిక తెలుగులో సహజమైన సమానార్థకం.
- source_word: צֶאֱלִים
  choice: తామర చెట్లు
  rationale: నదీతీర పరిసరంలో నీడనిచ్చే ఒక వృక్షజాతిని సూచించే అవకాశం ఉంది; ఖచ్చితమైన జాతి అనిశ్చితమైనందున ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: יִשְׁכָּב
  choice: పడుకుంటుంది
  rationale: Qal imperfect 3ms ఇక్కడ జంతువు అలవాటుగా లేదా సజీవ వర్ణనలో విశ్రమించడాన్ని సూచిస్తుంది. తెలుగులో జంతువుకు సహజమైన నపుంసక ఏకవచన రూపాన్ని వాడాం.
- source_word: בְּסֵתֶר
  choice: ఆశ్రయంగా
  rationale: దాగుడు, ఆవరణ, రక్షణ అనే భావాల్లో ఈ సందర్భానికి వృక్షసమూహం ఇచ్చే ఆశ్రయం సహజంగా సరిపోతుంది.
- source_word: קָנֶה
  choice: రెల్లులు
  rationale: హీబ్రూలో ఏకవచన సమూహవాచకంగా ఉన్న పదాన్ని తెలుగులో సహజమైన బహువచన వృక్షసమూహంగా అనువదించాం.
- source_word: וּבִצָּה
  choice: చిత్తడి నేల
  rationale: నీరు నిలిచి తడిగా ఉండే బురదప్రదేశాన్ని సూచిస్తుంది; 'చిత్తడి నేల' ఆధునిక తెలుగులో స్పష్టంగా, సహజంగా ఉంటుంది.
