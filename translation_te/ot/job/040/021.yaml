translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరతను, దృశ్య స్పష్టతను నిలిపాం. ముందున్న బేహెమోతును సూచిస్తూ సహజ తెలుగు నపుంసక సర్వనామమైన ‘అది’ వాడాం; రెండో భాగంలోని సమాంతర ఆశ్రయ భావాన్ని సహజ వాక్యనిర్మాణంతో వ్యక్తం చేశాం.
