  yaml_path: translation/ot/job/040/022.yaml
  text: The lotus trees cover him with their shade[b][a]; the willows of the brook surround him.
translation:
  language: te
  text: తామర చెట్లు[a] తమ నీడతో దానిని కప్పుతాయి; వాగు ఒడ్డుననున్న విల్లో చెట్లు[b] దానిని చుట్టుముడతాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నీడనిచ్చే చెట్లు’; צֶאֱלִים అనే పదం సూచించే ఖచ్చితమైన వృక్షజాతి తెలియదు. ‘తామర చెట్లు’ అనేది సంప్రదాయ అనువాదం.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘వాగుబెడిలోని పోప్లర్ చెట్లు’; עַרְבֵי నָחַל అనే పదబంధంలోని వృక్షం మరియు జలమార్గం యొక్క ఖచ్చితమైన గుర్తింపు అనిశ్చితం.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְסֻכֻּהוּ
  choice: దానిని కప్పుతాయి
  rationale: סכך అనే ధాతువు కప్పడం లేదా ఆశ్రయం కల్పించడం అనే భావాన్ని ఇస్తుంది. ఇక్కడ చెట్ల నీడ జంతువును కప్పుతున్న దృశ్యాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: צֶאֱלִים
  choice: తామర చెట్లు
  rationale: ఈ వృక్షపదానికి ఖచ్చితమైన గుర్తింపు అనిశ్చితమైనప్పటికీ, సంప్రదాయంగా ‘lotus trees’ అని అనువదిస్తారు. తెలుగులో ఆ సంప్రదాయ గుర్తింపును ‘తామర చెట్లు’గా ఉంచి, ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: צִלֲלוֹ
  choice: తమ నీడతో
  rationale: צֵל అంటే నీడ. ‘కప్పుతాయి’తో కలిపి ‘తమ నీడతో’ అనడం తెలుగు వాక్యంలో సహజంగా ఉండి, మూలంలోని నీడ భావాన్ని నిలుపుతుంది.
- source_word: יְסֻבּוּהוּ
  choice: దానిని చుట్టుముడతాయి
  rationale: סבב అంటే చుట్టుముట్టడం లేదా ఆవరించడం. ‘చుట్టుముడతాయి’ కవితాత్మకమైనప్పటికీ ఆధునిక పాఠకులకు స్పష్టంగా ఉంటుంది.
- source_word: עַרְבֵי נָחַל
  choice: వాగు ఒడ్డున ఉన్న నిరవంజి చెట్లు
  rationale: עַרְבֵי అనేది విల్లో లేదా పాప్లర్ వంటి నీటితీరపు చెట్లను సూచించవచ్చు; נחל వాగు, ప్రవాహం లేదా కాలానుగుణంగా నీరు పారే వాగుబెడును సూచిస్తుంది. ‘వాగు ఒడ్డున ఉన్న నిరవంజి చెట్లు’ నివాసస్థల దృశ్యాన్ని సహజ తెలుగులో అందిస్తుంది; వృక్షం మరియు జలమార్గం విషయంలోని ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
