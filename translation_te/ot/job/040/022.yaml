translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కవితాత్మక శైలిని వాడాం. సందర్భంలోని జంతువుకు తెలుగు వ్యాకరణానుసారం నపుంసక ఏకవచన సర్వనామమైన ‘దానిని’ వాడాం. వృక్షశాస్త్రీయ అనిశ్చితిని ప్రధాన పాఠ్యంలో బలవంతంగా పరిష్కరించకుండా పాదసూచికల్లో నిలిపాం.
