  yaml_path: translation/ot/job/040/012.yaml
  text: Look on everyone who is proud[a], and humble him; and tread down the wicked where they stand.
translation:
  language: te
  text: 'ప్రతి గర్విష్ఠుణ్ణీ చూడు, వాణ్ణి అణచివేయి;

    దుష్టులను వారు ఉన్న చోటనే[a] తొక్కివేయి.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారి స్థానంలోనే.”
    reason: תַּחְתָּם అనే పదబంధానికి సాధ్యమైన మరింత పదానుసార ప్రత్యామ్నాయం.
lexical_decisions:
- source_word: רְאֵה
  choice: చూడు
  rationale: యోబును ఉద్దేశించిన ఏకవచన ఆజ్ఞార్థక రూపాన్ని సహజమైన ఆధునిక తెలుగులో నేరుగా నిలుపుతుంది.
- source_word: כָל גֵּאֶה
  choice: గర్విష్ఠుడైన ప్రతివాణ్ణీ
  rationale: విశేషణం నామవాచకార్థంలో వాడబడింది; כָל యొక్క పంపిణీ భావాన్ని ‘ప్రతివాణ్ణీ’ స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: הַכְנִיעֵהוּ
  choice: వాణ్ణి అణచివేయి
  rationale: గర్విష్ఠుణ్ణి కిందికి దించడం లేదా లోబరచడం అనే హిఫీల్ ఆజ్ఞార్థక భావాన్ని తెలియజేస్తుంది; కేవలం అంతర్గత వినయాన్ని కలిగించడం అనే పరిమిత భావాన్ని రుద్దదు.
- source_word: וַהֲדֹךְ
  choice: నలగదొక్కు
  rationale: తీర్పు సందర్భంలోని బలమైన అణచివేత, తొక్కివేత భావాలను సహజంగా కలిపి వ్యక్తం చేస్తుంది.
- source_word: רְשָׁעִים
  choice: దుష్టులను
  rationale: నైతిక వర్గాన్ని సూచించే బహువచనానికి సాధారణమైన, గంభీరమైన తెలుగు పదం.
- source_word: תַּחְתָּם
  choice: వారు ఉన్న చోటనే
  rationale: ఈ సందర్భంలో ‘వారి స్థలంలోనే/వారు ఉన్నచోటనే’ అనే స్థానార్థక భావాన్ని సహజంగా అందిస్తుంది; పదబంధంలోని సాధ్యమైన ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచింది.
theological_decisions:
- issue: యోబుకు ఇచ్చిన ఆజ్ఞ స్వభావం
  choice: దైవిక తీర్పు కార్యాలను పేర్కొనే సూటి ఆజ్ఞలుగానే అనువదించడం
  alternative: యోబుకు నిజంగానే దైవిక తీర్పు అధికారాన్ని అప్పగిస్తున్నట్లు లేదా ఇవి కేవలం అవాస్తవ ఊహలని వివరణాత్మకంగా మార్చడం
  rationale: సందర్భంలో దేవుడు యోబును సవాలు చేస్తున్నప్పటికీ, మూలంలోని ఆజ్ఞార్థక బలాన్ని అనువాదం నిలుపుతుంది; యోబుకు అలాంటి అధికారం ఉందా అనే విషయాన్ని పద్యంలో అదనంగా నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కవితాత్మక ఆజ్ఞాశైలిని ఉపయోగించాం. ‘చూడు … అణచివేయి … నలగదొక్కు’ అనే సమాంతర ఆజ్ఞారూపాలు హెబ్రీ పద్య బలాన్ని నిలుపుతాయి.
