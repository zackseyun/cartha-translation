  yaml_path: translation/ot/job/040/032.yaml
  text: Lay your hand on him[a]; remember the battle—you will not do it again.
translation:
  language: te
  text: దానిమీద నీ చేయి వేయి; పోరాటాన్ని గుర్తుంచుకో—మళ్లీ అలా చేయవు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో పదశః, “ఇంక జోడించకు.” ఇది నిషేధాజ్ఞగా “మళ్లీ అలా చేయకు” అని కూడా అర్థమవుతుంది; సందర్భంలో, పోరాటాన్ని గుర్తుచేసుకున్నవాడు ఆ ప్రయత్నాన్ని మళ్లీ చేయడని చెప్పే ఫలితసూచక హెచ్చరికగా అర్థం చేసుకోవచ్చు.
    reason: హీబ్రూ నిషేధార్థక రూపాన్నీ, సందర్భంలో సాధ్యమైన ఫలితసూచక పఠనాన్నీ నిలుపుతుంది.
lexical_decisions:
- source_word: שִׂים
  choice: వేయి
  rationale: שׂים అనే ఆజ్ఞారూపం ‘పెట్టు/వేయి’ అని అర్థం. ‘చెయ్యి వేయి’ అనేది తెలుగులో సహజంగా ఉండి, లివ్యాతానును పట్టుకోవడానికి లేదా ఎదుర్కోవడానికి చేసే ప్రయత్నాన్ని తెలియజేస్తుంది.
- source_word: עָלָיו
  choice: వాడి మీద
  rationale: עַל కు జోడించిన మూడవ పురుష ఏకవచన పుంలింగ ప్రత్యయం ‘అతని/వాడి మీద’ అని అర్థం. ఇక్కడ జంతువైన లివ్యాతానును సూచిస్తున్నందున ‘వాడి మీద’ సహజంగా ఉంది.
- source_word: כַּפֶּךָ
  choice: నీ చెయ్యి
  rationale: כַּף ప్రాథమికంగా అరచేయిని లేదా చేతిని సూచిస్తుంది. సందర్భంలో ‘నీ చెయ్యి’ అనేది సహజమైన సమానార్థకం.
- source_word: זְכֹר
  choice: గుర్తుంచుకో
  rationale: זכר యొక్క ఆజ్ఞారూపాన్ని నేరుగా ప్రతిబింబిస్తూ, రాబోయే పోరాట ఫలితాన్ని మనసులో ఉంచుకోవాలనే హెచ్చరికను తెలియజేస్తుంది.
- source_word: מִלְחָמָה
  choice: పోరాటాన్ని
  rationale: מִלְחָמָה యుద్ధం లేదా పోరాటాన్ని సూచిస్తుంది. లివ్యాతానుతో తలపడే ఈ సందర్భంలో ‘పోరాటం’ స్పష్టంగా, సహజంగా ఉంది.
- source_word: אַל תּוֹסַף
  choice: మళ్లీ అలా చేయకు
  rationale: పదశః ‘ఇంక జోడించకు’ అనే నిషేధార్థక నిర్మాణం. సందర్భంలో మునుపటి చర్యను—లివ్యాతాను మీద చెయ్యి వేయడాన్ని—మళ్లీ చేయవద్దనే భావం ఉంది. ఆజ్ఞ/హెచ్చరిక స్వరాన్ని కాపాడేందుకు ‘మళ్లీ అలా చేయకు’ అని అనువదించబడింది.
