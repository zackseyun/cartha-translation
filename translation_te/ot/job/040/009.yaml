language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אִם זְר֖וֹעַ כָּ/אֵ֥ל לָ֑/ךְ וּ֝/בְ/ק֗וֹל כָּמֹ֥/הוּ תַרְעֵֽם־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/040/009.yaml
  text: Or do you have an arm like God’s[a], and can you thunder with a voice like his?
translation:
  language: te
  text: లేక దేవునివంటి బాహువు నీకు ఉందా[a]? ఆయన స్వరంలా నీవు ఉరుమగలవా?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అంతగా సంభావ్యం కాని అర్థంగా, אֵל పదాన్ని సాధారణార్థంలో తీసుకుంటే, “ఒక దేవునివంటి బాహువు” అని అనువదించవచ్చు; అయితే సందర్భం “దేవుడు” అనే అర్థానికే బలంగా మద్దతిస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאִם
  choice: లేక ... ఉందా?
  rationale: ముందటి వాక్యంలోని సవాలును కొనసాగించే అలంకారప్రశ్నగా సహజమైన తెలుగులో ‘లేక’ అని అనువదించాం.
- source_word: זְרוֹעַ
  choice: భుజం
  rationale: ఈ పదం బలానికి రూపకంగా ఉన్నప్పటికీ, హీబ్రూ మూలంలోని శరీరాంగ చిత్రాన్ని నిలిపేందుకు ‘భుజం’ ఎంచుకున్నాం.
- source_word: כָּאֵל
  choice: దేవుని ... లాంటి
  rationale: సందర్భంలో యోబుతో మాట్లాడుతున్న ఇశ్రాయేలు దేవుడే సూచితుడు; తెలుగు వాక్యనిర్మాణానికి అనుగుణంగా పోలికను ‘దేవుని భుజంలాంటి’ అని వ్యక్తం చేశాం.
- source_word: לָךְ
  choice: నీకు ఉందా
  rationale: అక్షరార్థంగా ‘నీకు’ అయిన ఈ రూపం ఇక్కడ స్వాధీనతను సూచిస్తుంది; సహజ తెలుగులో ‘నీకు ఉందా’ అని ఇచ్చాం.
- source_word: וּבְקוֹל
  choice: స్వరంతో
  rationale: בְּ ఇక్కడ సాధనార్థకంగా ఉంది; ఉరుమే క్రియకు సాధనంగా స్వరాన్ని తెలుపుతుంది.
- source_word: כָּמֹהוּ
  choice: ఆయన స్వరంలాంటి స్వరం
  rationale: ప్రత్యయం దేవుణ్ణి సూచిస్తోంది; పోలిక ‘స్వరం’తో ఉన్నందున తెలుగులో సంబంధాన్ని స్పష్టంగా, సహజంగా వ్యక్తం చేశాం.
- source_word: תַרְעֵם
  choice: నీవు ఉరుమగలవా
  rationale: רעם హిఫీల్ రూపం ఉరుమును వెలువరించడాన్ని సూచిస్తుంది. అలంకారప్రశ్నలో సామర్థ్యాన్ని తెలిపేందుకు ‘ఉరుమగలవా’ అనువైనది; దైవ ప్రత్యక్షతకు సంబంధించిన తుఫాను ప్రతిధ్వనినీ నిలుపుతుంది.
theological_decisions:
- issue: אֵל పదం సూచించే వ్యక్తి
  choice: దేవుడు
  alternative: ఒక దేవుడు
  rationale: తక్షణ సందర్భంలో ఇశ్రాయేలు దేవుడు యోబును తన దైవిక శక్తితో పోల్చమని సవాలు చేస్తున్నాడు. కాబట్టి ప్రధాన పాఠంలో ‘దేవుడు’ అనేది బలమైన సందర్భోచిత అర్థం; సాధ్యమైన సాధారణ అర్థాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ‘భుజం’ మరియు ‘ఉరుము’ అనే మూల చిత్రాలను అలాగే నిలిపాం; రెండు సమాంతర అలంకారప్రశ్నల నిర్మాణాన్ని స్పష్టంగా ఉంచాం.
