  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కవితా శైలిని పాటించాం. ‘కోపావేశాలు’ మూలంలోని బహువచన తీవ్రతను, ‘వెదజల్లు’ క్రియలోని వ్యాప్తి చిత్రాన్ని నిలుపుతాయి. వ్యక్తిగత పంపిణీ భావాన్ని సహజంగా చూపేందుకు ‘ప్రతి ఒక్కరినీ’ వాడాం.
