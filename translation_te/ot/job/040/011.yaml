translation:
  language: te
  text: 'నీ కోపావేశాలను వెదజల్లు[a];

    గర్వించే ప్రతి ఒక్కరినీ చూసి, ఒక్కొక్కరినీ అణగదొక్కు[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నీ కోపావేశాలను చెదరగొట్టు.’
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో ‘ప్రతి గర్విష్ఠుడు’; తరువాతి క్రియకు ఉన్న ఏకవచన ప్రత్యయం ప్రతి గర్విష్ఠ వ్యక్తినీ విడివిడిగా ఉద్దేశిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָפֵץ
  choice: వెదజల్లు
  rationale: ఈ ఆజ్ఞారూప క్రియకు ‘చెదరగొట్టు/వ్యాపింపజేయి’ అనే భావం ఉంది. కోపావేశాలను బలంగా వెలువరించే సందర్భంలో ‘వెదజల్లు’ సహజంగా ఉండి, మూలంలోని విస్తరింపజేసే చిత్రాన్ని నిలుపుతుంది.
- source_word: עֶבְרוֹת אַפֶּךָ
  choice: నీ కోపావేశాలను
  rationale: עֶבְרוֹת అనే బహువచనం ఉప్పొంగే ఆగ్రహపు ఉద్ధృత వ్యక్తీకరణలను సూచిస్తుంది; אַף ఇక్కడ ‘ముక్కు’ అనే అక్షరార్థంలో కాక, కోపానికి సంబంధించిన స్థిర హీబ్రూ నుడికారంగా ఉంది. ‘కోపావేశాలు’ బహువచన తీవ్రతను సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: וּרְאֵה
  choice: చూసి
  rationale: ఇది ఆజ్ఞార్థకమైన ‘చూడు’. తరువాతి చర్యతో సాఫీగా అనుసంధానించడానికి తెలుగులో ‘చూసి’ అని ఇచ్చాం; దీని ఆజ్ఞార్థ భావం ప్రధాన క్రియతో కలిసి నిలుస్తుంది.
- source_word: כָל גֵּאֶה
  choice: గర్వించే ప్రతి ఒక్కరినీ
  rationale: ఏకవచన విశేషణం వ్యక్తిని సూచిస్తూ כָל తో పంపిణీ భావాన్ని ఇస్తుంది—గర్వించే ఒక్కొక్కరినీ. ‘ప్రతి ఒక్కరినీ’ ఆ భావాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: וְהַשְׁפִּילֵהוּ
  choice: వారిని అణగదొక్కు
  rationale: హిఫీల్ ఆజ్ఞారూపం ‘దిగజార్చు, తక్కువచేయి, అణచివేయి’ అనే భావం ఇస్తుంది. ‘అణగదొక్కు’ గర్వానికి విరుద్ధంగా దిగువకు తెచ్చే బలమైన కవితాత్మక భావాన్ని అందిస్తుంది. తెలుగు గౌరవ/లింగనిరపేక్ష ఏకవచన ప్రయోగంలో ‘వారిని’ ఒక్కొక్క గర్విష్ఠ వ్యక్తిని సూచించగలదు.
