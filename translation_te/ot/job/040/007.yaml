  text: אֱזָר נָ֣א כְ/גֶ֣בֶר חֲלָצֶ֑י/ךָ אֶ֝שְׁאָלְ/ךָ֗ וְ/הוֹדִיעֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/040/007.yaml
  text: Gird up your loins like a man; I will question you[a], and you shall make it known to me.
translation:
  language: te
  text: ఇప్పుడు పురుషునిలా నీ నడుము బిగించుకో[a]; నేను నిన్ను ప్రశ్నిస్తాను, నీవు నాకు తెలియజేయాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యోధునిలా సిద్ధపడు.” హెబ్రీలో అక్షరార్థంగా, “ఇప్పుడు పురుషునిలా నీ నడుము బిగించుకో” అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱזָר נָא
  choice: బిగించుకో
  rationale: אזר అనే ఆజ్ఞారూపం వస్త్రాన్ని నడుముకు బిగించుకొని కార్యానికి సిద్ధపడే దృశ్యాన్ని వ్యక్తం చేస్తుంది. נָא ఇక్కడ ఆజ్ఞకు తక్షణత, బలాన్ని జోడిస్తుంది; దాన్ని ప్రత్యేకంగా ‘ఇప్పుడు’ లేదా ‘దయచేసి’ అని అనువదిస్తే కాలార్థం లేదా మర్యాదార్థం అనవసరంగా ముందుకు వస్తాయి.
- source_word: כְגֶבֶר
  choice: పురుషునిలా
  rationale: גבר ఇక్కడ బలం, ధైర్యం సూచించగల పురుషవాచక నామం. ‘పురుషునిలా’ మూలంలోని లింగసూచనను నిలుపుతూ, ‘యోధునిలా’ అనే సాధ్యమైన భావాన్ని పాఠ్యంలోనే ఖరారు చేయదు.
- source_word: חֲלָצֶיךָ
  choice: నీ నడుము
  rationale: ఈ పదం నడుము లేదా నడుము చుట్టుపక్కల భాగాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘నీ నడుము బిగించుకో’ శరీర దృశ్యాన్ని సహజంగా నిలుపుతుంది.
- source_word: אֶשְׁאָלְךָ
  choice: నేను నిన్ను ప్రశ్నిస్తాను
  rationale: שאל సాధారణంగా అడగడం అని అర్థం; ఇక్కడ దేవుని సవాలు మరియు పరిశీలనాత్మక ప్రశ్నల సందర్భంలో ‘ప్రశ్నిస్తాను’ తగిన బలాన్ని ఇస్తుంది.
- source_word: וְהוֹדִיעֵנִי
  choice: నీవు నాకు తెలియజేయాలి
  rationale: ידע హిఫీల్ రూపం ‘తెలియజేయు’ లేదా ‘తెలిసేలా చేయు’ అనే కారణార్థాన్ని కలిగి ఉంది. ‘సమాధానం చెప్పాలి’ కంటే ‘తెలియజేయాలి’ మూలరూపానికి దగ్గరగా ఉంటుంది.
theological_decisions:
- issue: גבר లోని పురుషలింగ సూచన
  choice: పురుషునిలా
  alternative: యోధునిలా / బలవంతునిలా
  rationale: యోబును ఉద్దేశించిన మూలపాఠం పురుషవాచక పదాన్ని వాడుతుంది. దాన్ని లింగతటస్థంగా మార్చకుండా నిలిపాము; అయితే ఆ పదం తప్పనిసరిగా ‘యోధుడు’ అనే ప్రత్యేక అర్థమే ఇస్తుందని పాఠ్యంలో నిర్ణయించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన, నేరుగా సవాలు చేసే శైలిని ఉపయోగించాము. మూలంలోని శరీరాధారిత నుడికారాన్ని నిలుపుతూ, పాదటిప్పణిలో దాని సహజ భావానువాదాన్ని ఇచ్చాము.
