  text: Will you play with him like a bird[b][a], or tie him up for your girls?
translation:
  language: te
  text: నీవు పక్షితో ఆడుకున్నట్లే దానితో[a] కూడా ఆడుకుంటావా? లేక నీ అమ్మాయిల కోసం[b] దాన్ని కట్టి ఉంచుతావా?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పాఠంలో లివ్యాతానును సూచించే సర్వనామం పుంలింగ ఏకవచనంలో ఉంది; అందువల్ల ‘వానితో’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘నీ యువతుల కోసం.’
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתְשַׂחֶק
  choice: ఆడతావా
  rationale: שׂחק అనే క్రియకు ‘ఆడడం, వినోదంగా తీసుకోవడం’ అనే భావాలు ఉన్నాయి. పక్షితో ఆడే ఉపమానానికి సహజమైన ఆధునిక తెలుగు పదం ‘ఆడు’.
- source_word: בּוֹ
  choice: దానితో
  rationale: హీబ్రూలో పుంలింగ ఏకవచన సర్వనామం లివ్యాతానును సూచిస్తుంది. అయితే జంతువును సూచించేటప్పుడు తెలుగులో ‘దానితో’ అనడం సహజం; మూలంలోని పుంలింగ రూపాన్ని పాదసూచిక తెలియజేస్తుంది.
- source_word: כַּצִּפּוֹר
  choice: పక్షితో ఆడినట్లు
  rationale: צִפּוֹר సాధారణంగా పక్షిని సూచిస్తుంది. లివ్యాతానును మచ్చికైన పక్షిలా చూసే ఉపమానాన్ని ఈ రూపం సహజంగా నిలుపుతుంది.
- source_word: וְתִקְשְׁרֶנּוּ
  choice: దాన్ని కట్టి ఉంచుతావా
  rationale: קשר అంటే కట్టడం లేదా బంధించడం. జంతువును అదుపులో ఉంచే దృశ్యాన్ని ‘కట్టి ఉంచు’ స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: לְנַעֲרוֹתֶיךָ
  choice: నీ అమ్మాయిల కోసం
  rationale: נַעֲרוֹת అనేది బాలికలను లేదా యువతులను సూచించగల స్త్రీలింగ బహువచనం. ‘అమ్మాయిలు’ ఆధునిక తెలుగులో సహజంగా ఉండి వయస్సుకు సంబంధించిన మూలంలోని విస్తృతిని కొంతవరకు నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ప్రశ్నారూపం వాడబడింది. వరుసగా ఉన్న రెండు అలంకారిక ప్రశ్నలను స్పష్టంగా ఉంచి, లివ్యాతానును మచ్చికైన పెంపుడు జీవిలా చూడగలమా అనే వ్యంగ్యభావాన్ని నిలుపుకుంది.
