translation:
  language: te
  text: దాని ఎముకలు కంచు గొట్టాలు[a]; దాని ఎముకలు ఇనుప కడ్డీ వంటివి[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘కంచు కాలువలు.’ אֲפִיקֵי అనే హీబ్రూ పదం కాలువలు, ప్రవాహమార్గాలు లేదా గొట్టాలను సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘ఇనుప పోసిన లోహపు దిమ్మె వంటివి.’ גְּרָמָיוకు ‘ఎముకలు’ అనే అర్థం ఉంది; מַטִּיל పోసి రూపొందించిన లోహపు దిమ్మెను లేదా కడ్డీని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲצָמָיו
  choice: దాని ఎముకలు
  rationale: עֶצֶם అనే పదానికి సాధారణ శరీరార్థం ‘ఎముక’; ఆధునిక తెలుగులో ఇది సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: אֲפִיקֵי
  choice: గొట్టాలు
  rationale: ఈ పదం కాలువలు, ప్రవాహమార్గాలు లేదా గొట్టాల వంటి పొడవైన నిర్మాణాలను సూచించగలదు. ఎముకల ఆకారాన్నీ బలాన్నీ తెలిపే సందర్భంలో ‘గొట్టాలు’ సహజమైన రూపకం; ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: נְחוּשָׁה
  choice: కంచు
  rationale: బైబిలు లోహరూపకాలలో నְחוּשָׁה సాధారణంగా కంచు/రాగిని సూచిస్తుంది; ఇక్కడ బలాన్ని సూచించే ‘కంచు’ అనువైనది.
- source_word: גְּרָמָיו
  choice: దాని అవయవాలు
  rationale: גֶּרֶם ‘ఎముకలు’ అని కూడా అర్థమవుతుంది; అయితే సమాంతర పాదంలో ఉన్న పదవైవిధ్యాన్ని, మొత్తం శరీరబల చిత్రాన్ని తెలుగులో నిలుపుటకు ‘అవయవాలు’ ఎంచుకున్నాం.
- source_word: כִּמְטִיל
  choice: కడ్డీల వంటివి
  rationale: מָטִיל పోతపోసిన లేదా ఘనంగా రూపుదిద్దిన లోహపు ముక్కను సూచించవచ్చు. సందర్భంలోని దృఢత్వాన్ని సాధారణ పాఠకునికి స్పష్టంగా తెలియజేయడానికి ‘కడ్డీలు’ ఉపయోగించాం.
- source_word: בַּרְזֶל
  choice: ఇనుప
  rationale: בַּרְזֶל కు ప్రామాణికమైన, సహజమైన తెలుగు సమానార్థకం ‘ఇనుము’; సమాసంలో ‘ఇనుప’ వాడటం సహజం.
