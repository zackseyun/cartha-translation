  text: And Yahweh answered Job and said:[a]
translation:
  language: te
  text: 'యాహ్వే[a] యోబుకు జవాబిచ్చి ఇలా అన్నాడు:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ: YHWH; “యెహోవా” అనేది ప్రత్యామ్నాయ లిప్యంతరీకరణ.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַן
  choice: జవాబిస్తూ
  rationale: ענה అనే క్రియకు ఈ సంభాషణ సందర్భంలో ‘జవాబిచ్చాడు/ప్రత్యుత్తరమిచ్చాడు’ అనే అర్థం ఉంది. తరువాతి וַיֹּאמַר‌తో కలిసి తెలుగులో సహజంగా ఉండేందుకు ‘జవాబిస్తూ’ అని అనువదించాం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా స్థిరపడిన ‘యెహోవా’ రూపంలో లిప్యంతరీకరించాం.
- source_word: אֶת
  choice: '[ప్రత్యక్ష కర్మ సూచిక; ప్రత్యేకంగా అనువదించలేదు]'
  rationale: אֶת ‘యోబు’ను ప్రత్యక్ష కర్మగా సూచిస్తుంది; తెలుగులో దీనికి విడిగా పదం అవసరం లేదు. ‘యోబుకు’ అనే సహజ ప్రయోగంలో సంబంధం వ్యక్తమవుతుంది.
- source_word: אִיּוֹב
  choice: యోబు
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగులో ప్రామాణికంగా వాడుకలో ఉన్న రూపం.
- source_word: וַיֹּאמַר
  choice: ఇలా అన్నాడు
  rationale: אמר యొక్క సాధారణ అర్థం ‘అన్నాడు.’ ముందున్న ‘జవాబిస్తూ’తో కలిసి మూలంలోని రెండు వాక్కు క్రియలను నిలుపుతూ సహజమైన తెలుగు వాక్యాన్ని ఇస్తుంది.
theological_decisions:
- issue: దైవనామం יהוה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో ఉన్న చతురక్షర దైవనామాన్ని ‘ప్రభువు’ అనే బిరుదుగా మార్చకుండా వ్యక్తినామంగా ఉంచాం. ఉచ్చారణ పూర్తిగా నిర్ధారించలేనందున ప్రత్యామ్నాయ లిప్యంతరీకరణను పాదటిప్పణిలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన కథన శైలి. హీబ్రూలోని ‘జవాబిచ్చి అన్నాడు’ అనే ద్విక్రియా సూత్రాన్ని తెలుగులో సహజంగా ‘జవాబిస్తూ ఇలా అన్నాడు’గా వ్యక్తపరిచాం.
