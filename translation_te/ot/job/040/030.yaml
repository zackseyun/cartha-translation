translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో ప్రశ్నల సమాంతర నిర్మాణాన్ని నిలిపాం. గంభీరతతో పాటు సాధారణ పాఠకులకు సహజంగా ఉండే ‘బేరమాడతారా’, ‘పంచుకుంటారా’ వంటి పదాలను వాడాం. జీవిని తెలుగులో సహజమైన నపుంసక సర్వనామాలతో సూచించాం.
