source:
  edition: WLC
  text: יִכְר֣וּ עָ֭לָי/ו חַבָּרִ֑ים יֶ֝חֱצ֗וּ/הוּ בֵּ֣ין כְּֽנַעֲנִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/job/040/030.yaml
  text: Will traders bargain over him? Will they divide him among the merchants?[a][b]
translation:
  language: te
  text: 'వర్తకులు దాని గురించి బేరమాడతారా?[a]

    వ్యాపారుల మధ్య దాన్ని పంచుకుంటారా?[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సహచరులు దానితో విందు చేసుకుంటారా?” మొదటి పాదంలోని హెబ్రీ పాఠం అర్థం చేసుకోవడం కష్టం; חַבָּרִים అనే పదాన్ని కొందరు వాణిజ్యేతర అర్థంలో తీసుకుంటారు.
    reason: alternative_reading
  - marker: b
    text: హెబ్రీలో “కనానీయులు”; ఈ సందర్భంలో అది బహుశా “వ్యాపారులు” అని అర్థం.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִכְרוּ
  choice: బేరమాడతారా
  rationale: כרת/כרה రూపానికి ఇక్కడ అక్షరార్థమైన ‘తవ్వు’ భావం సందర్భానికి సరిపోదు. తరువాతి వాణిజ్య సంబంధ సమాంతర పాదాన్ని బట్టి, ఒక ఒప్పందం లేదా బేరం కుదుర్చుకోవడం అనే భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: עָלָיו
  choice: దాని గురించి
  rationale: ఈ ప్రయోగంలో על అనేది ఆ జీవిని బేరానికి సంబంధించిన విషయంగా సూచిస్తుంది. తెలుగులో ‘దాని గురించి’ అనేది ఈ సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: חַבָּרִים
  choice: వర్తకులు
  rationale: ఈ పదానికి ‘సహచరులు/సహవాసులు’ అనే సాధారణ అర్థం ఉన్నా, రెండో పాదంలోని כְּנַעֲנִים తో సమాంతరత వాణిజ్య సందర్భాన్ని సూచిస్తుంది. అందువల్ల ‘వర్తకులు’ ప్రధాన పాఠంలో ఉంచి, నిజమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలిపాం.
- source_word: יֶחֱצוּהוּ
  choice: దాన్ని పంచుకుంటారా
  rationale: חצה అంటే విభజించడం లేదా వాటాలు వేయడం. అది జీవిని కోయడాన్నే స్పష్టంగా చెప్పదు కాబట్టి, విస్తృత భావాన్ని కాపాడే ‘పంచుకుంటారా’ ఎంచుకున్నాం.
- source_word: בֵּין
  choice: మధ్య
  rationale: బహువచన సమూహంలో విభజనను తెలుగులో సహజంగా తెలిపే రూపం.
- source_word: כְּנַעֲנִים
  choice: వ్యాపారులు
  rationale: అక్షరార్థంగా ‘కనానీయులు’ అయినా, కొన్ని హెబ్రీ సందర్భాల్లో ఈ పదం వ్యాపారులను సూచిస్తుంది. ఇక్కడి వాణిజ్య సమాంతరత వల్ల ‘వ్యాపారులు’ ప్రధాన పాఠానికి తగినది; అక్షరార్థాన్ని పాదసూచికలో ఇచ్చాం.
