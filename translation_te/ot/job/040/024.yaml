source:
  edition: WLC
  text: בְּ/עֵינָ֥י/ו יִקָּחֶ֑/נּוּ בְּ֝/מֽוֹקְשִׁ֗ים יִנְקָב אָֽף־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/040/024.yaml
  text: Can one capture him before his eyes? Can one pierce his nose with snares?[a][b]
translation:
  language: te
  text: దాని కళ్లముందే ఎవరైనా దాన్ని పట్టుకోగలరా? ఉచ్చులతో దాని ముక్కును పొడిచగలరా?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దాని కళ్లముందే అతడు దాన్ని పట్టుకుంటాడా? ఉచ్చులతో దాని ముక్కును పొడుస్తాడా?” హీబ్రూ వాక్యం సంక్షిప్తంగా ఉండి, అర్థనిర్ణయం కష్టంగా ఉంది; క్రియలను సామర్థ్యాన్ని తెలిపే సాధారణ ప్రశ్నలుగా కాకుండా మరింత అక్షరార్థంగా కూడా అనువదించవచ్చు.
    reason: alternative_reading
  - marker: b
    text: హీబ్రూ అక్షరార్థంగా “ఉచ్చులతో.” కొన్ని సంప్రదాయ అనువాదాల్లో “కొంకీలతో” అనే భావం కనిపిస్తుంది; అయితే ఇక్కడి నామవాచకం సాధారణంగా ఉచ్చులు లేదా బోనులను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעֵינָיו
  choice: దాని కళ్లముందే
  rationale: కళ్లను సాధనంగా చూపడం కంటే, ఆ జీవి చూస్తుండగానే దాన్ని పట్టుకోవడం అనే భావాన్ని ఈ సందర్భంలో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: יִקָּחֶנּוּ
  choice: ఎవరైనా దాన్ని పట్టుకోగలరా
  rationale: לקח ప్రాథమికంగా ‘తీసుకొను’ అయినా, వేట సందర్భంలో ‘పట్టుకొను’ తగినది. నిర్దిష్టంగా చెప్పని కర్తను ‘ఎవరైనా’ అని, సందర్భంలోని సవాలును సామర్థ్యాన్ని ప్రశ్నించే అలంకార ప్రశ్నగా వ్యక్తం చేశాం.
- source_word: בְּמוֹקְשִׁים
  choice: ఉచ్చులతో
  rationale: מוֹקֵשׁ సాధారణంగా ఉచ్చు లేదా వల అనే అర్థాన్నిస్తుంది; ‘కొంకీలు’ అని మార్చకుండా మూలపదంలోని అసాధారణ చిత్రణను నిలిపాం.
- source_word: יִנְקָב
  choice: పొడవగలరా
  rationale: נקב అంటే పొడుచుట లేదా రంధ్రం చేయుట. ఆధునిక తెలుగులో ‘పొడవడం’ సహజంగా ఉండి, బలవంతంగా ముక్కును చీల్చే చిత్రాన్ని నిలుపుతుంది.
- source_word: אָף
  choice: ముక్కు
  rationale: ఈ సందర్భంలో אַף‌కు ‘కోపం’ కాదు, శరీరభాగమైన ముక్కు అనే అర్థమే అవసరం; ‘ముక్కురంధ్రం’ కంటే ‘ముక్కు’ మూలంలోని విస్తృత శరీరార్థాన్ని కాపాడుతుంది.
theological_decisions:
- issue: వాక్యాలను సామర్థ్యాన్ని ప్రశ్నించే అలంకార ప్రశ్నలుగా గ్రహించడం
  choice: ‘ఎవరైనా ... పట్టుకోగలరా? ... పొడవగలరా?’
  alternative: ‘అతడు ... పట్టుకుంటాడా? ... పొడుస్తాడా?’
  rationale: హీబ్రూ సంక్షిప్తంగా ఉండి కర్తను స్పష్టంగా చెప్పదు. పరిసరంలోని దేవుని సవాలు ఈ వాక్యాలను అలంకార ప్రశ్నలుగా గ్రహించడానికి తోడ్పడుతుంది; అయినా మరింత అక్షరార్థమైన భవిష్యత్ క్రియారూపాన్ని పాదటిప్పణిలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ప్రశ్నారూపం వాడబడింది. హీబ్రూలోని అసాధారణమైన ‘ఉచ్చులతో ముక్కును పొడవడం’ అనే చిత్రాన్ని సులభతరం చేయకుండా నిలిపి, దాని వివరణను పాదటిప్పణిలో ఇచ్చాం.
