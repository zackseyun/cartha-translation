  to: దాని కళ్లముందే ఎవరైనా దాన్ని పట్టుకోగలరా? ఉచ్చులతో దాని ముక్కును పొడిచగలరా?[a][b]
  rationale: A small idiomatic clarification is made in the second question, while preserving the Hebrew’s deliberately unusual image of piercing a nose ‘with snares.’ The lexical footnote is narrowed away from ‘nets’ and toward traps/snares. Both original footnote anchors and their stated functions are retained.
