  text: הַֽ/תְמַלֵּ֣א בְ/שֻׂכּ֣וֹת עוֹר֑/וֹ וּ/בְ/צִלְצַ֖ל דָּגִ֣ים רֹאשֽׁ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/040/031.yaml
  text: Can you fill his hide with harpoons[b][a], or his head with fishing spears?
translation:
  language: te
  text: దాని చర్మాన్ని ముళ్లుగల ఈటెలతో[a], దాని తలను చేపలు పట్టే ఈటెలతో[b] నింపగలవా?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ముళ్లుగల పరికరాలతో’; హీబ్రూ పదం అరుదైనది. అది పదునైన లేదా ముళ్లుగల వేట పరికరాలను సాధారణంగా సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘చేపల గాలాలతో’; హీబ్రూ పదబంధం చేపలను పట్టే పరికరాన్ని సాధారణంగా సూచించవచ్చు. అయితే ఇక్కడి సమాంతర చిత్రంలో ‘చేపలు పట్టే ఈటెలు’ బాగా సరిపోతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַתְמַלֵּא
  choice: నింపగలవా?
  rationale: ప్రశ్నార్థక రూపంతో కూడిన పియేల్ అసంపూర్ణ క్రియ ఇక్కడ సవాలు చేసే అలంకారప్రశ్నను సూచిస్తుంది. ‘నింపగలవా?’ సామర్థ్యాన్ని ప్రశ్నించే భావాన్నీ, పదశః ‘నింపు’ అర్థాన్నీ నిలుపుతుంది.
- source_word: בְשֻׂכּוֹת
  choice: ముళ్ల ఈటెలతో
  rationale: ఈ అరుదైన నామవాచకం పదునైన లేదా ముళ్లు గల వేట/చేపల వేట పరికరాలను సూచించే అవకాశం ఉంది. సమాంతర పాదంలోని చేపల ఈటెలకు అనుగుణంగా, చర్మాన్ని చీల్చే అనేక ఆయుధాల చిత్రాన్ని ఈ ఎంపిక సహజంగా తెలియజేస్తుంది.
- source_word: עוֹרוֹ
  choice: దాని చర్మాన్ని
  rationale: పెద్ద జంతువు వెలుపలి చర్మాన్ని సూచించే సాధారణ, స్పష్టమైన ఆధునిక తెలుగు పదం; హీబ్రూ శరీరావయవ పదాన్ని నేరుగా నిలుపుతుంది.
- source_word: וּבְצִלְצַל דָּגִים
  choice: చేపల ఈటెలతో
  rationale: పదబంధం చేపలకు సంబంధించిన ఒక పట్టే లేదా పొడిచే పరికరాన్ని సూచిస్తుంది. మొదటి పాదంలోని పదునైన ఆయుధాలతో సమాంతరంగా ఉండే ‘చేపల ఈటెలు’ సందర్భానికి బాగా సరిపోతుంది; అయితే ‘చేపల గాలాలు’ అనే అర్థం కూడా సాధ్యమే.
- source_word: רֹאשׁוֹ
  choice: దాని తలను
  rationale: మూలంలోని శరీరావయవ పదాన్ని నేరుగా అనువదించి, ‘చర్మం—తల’ అనే సమాంతర నిర్మాణాన్ని నిలిపింది.
