translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే అలంకారప్రశ్నగా అనువదించబడింది. లేవీయాతానును సూచించే సర్వనామాలకు తెలుగు సహజ వాడుక ప్రకారం ‘దాని’ ఉపయోగించబడింది. అరుదైన రెండు ఆయుధపదాల అనిశ్చితిని పాదటిప్పణుల్లో నిలిపాం.
