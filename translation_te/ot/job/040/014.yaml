source:
  edition: WLC
  text: וְ/גַם אֲנִ֥י אוֹדֶ֑/ךָּ כִּֽי תוֹשִׁ֖עַ לְ/ךָ֣ יְמִינֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/040/014.yaml
  text: Then even I will praise you[a], because your right hand can save you.
translation:
  language: te
  text: అప్పుడు నీ కుడిచేయి నిన్ను రక్షించగలదు కాబట్టి నేను కూడా నిన్ను స్తుతిస్తాను.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీ కుడిచేయి నీకు రక్షణ కలిగించగలదు.” హీబ్రూలో “నీ కోసం/నీ కొరకు” అనే ప్రయోజనార్థక ఉపసర్గ ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: అప్పుడు … కూడా
  rationale: ముందటి సవాలుకు కొనసాగింపును, నొక్కిచెప్పే భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אֲנִי
  choice: నేను
  rationale: దేవుడే స్వయంగా మాట్లాడుతున్నాడనే నొక్కును నిలుపుతుంది.
- source_word: אוֹדֶךָ
  choice: నిన్ను స్తుతిస్తాను
  rationale: ידה హిఫీల్ రూపం ఇక్కడ ప్రశంసించడం లేదా మెచ్చుకోవడం అనే భావాన్ని ఇస్తుంది; యోబు తన శక్తిని నిరూపిస్తే దేవుడు అతన్ని స్తుతిస్తాడనే సందర్భానికి ఇది సరిపోతుంది.
- source_word: כִּי
  choice: అని
  rationale: తెలుగు వాక్య నిర్మాణంలో స్తుతికి ఆధారమైన విషయాన్ని సహజంగా పరిచయం చేస్తుంది; సందర్భంలో కారణార్థం అంతర్లీనంగా ఉంటుంది.
- source_word: תוֹשִׁיעַ
  choice: రక్షించగలదు
  rationale: ישׁע హిఫీల్ రూపం రక్షించడం లేదా విడిపించడం అని అర్థం. ముందటి షరతుతో కూడిన సవాలు దృష్ట్యా, కార్యసామర్థ్యాన్ని తెలుపడానికి ‘గలదు’ సరిపోతుంది.
- source_word: לְךָ
  choice: నిన్ను
  rationale: ప్రయోజనార్థక לְ భావాన్ని సహజమైన తెలుగులో కర్మరూపంగా వ్యక్తం చేస్తుంది; ‘నీ కోసం/నీ అంతట నీవే’ అనే సూక్ష్మభావాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: יְמִינֶךָ
  choice: నీ కుడిచేయి
  rationale: శక్తిని సూచించే హీబ్రూ రూపకాన్ని వ్యాఖ్యానంగా మార్చకుండా ప్రధాన పాఠ్యంలో నిలుపుతుంది.
theological_decisions:
- issue: శక్తిని సూచించే మానవరూపక ప్రయోగం
  choice: నీ కుడిచేయి నిన్ను రక్షించగలదు
  alternative: నీ సొంత శక్తి నిన్ను రక్షించగలదు
  rationale: మూల హీబ్రూ ‘కుడిచేయి’ అనే స్పష్టమైన రూపకాన్ని వాడుతుంది. దాన్ని ‘శక్తి’గా విప్పి చెప్పకుండా నిలుపడం మూలంలోని చిత్రణను, దైవిక సవాలులోని ఉద్రిక్తతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గంభీరమైన శైలి. ‘కుడిచేయి’ అనే బైబిలీయ రూపకాన్ని నిలిపి, సామర్థ్య భావాన్ని ‘రక్షించగలదు’తో తెలిపాం.
