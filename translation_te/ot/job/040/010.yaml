  terminology: గָּאוֹן, גֹּבַהּలకు ‘ఘనత,’ ‘ఔన్నత్యం’ అనేవి సందర్భానుకూలంగా ప్రతికూల నైతిక ‘గర్వం’ భావాన్ని రుద్దవు. הוֹד, הָדָרలకు ‘వైభవం,’ ‘మహిమ’ అనేవి సరైన రాజోచిత పదజాలం. ప్రత్యామ్నాయ పాదటిప్పణిలో గֹּבַהּకు ‘గౌరవం’ అనడం సరైన ప్రత్యామ్నాయం కాదు; దానిని ‘ఉన్నతత్వం’గా సవరించాలి.
