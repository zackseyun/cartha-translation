source:
  edition: WLC
  text: עֲדֵ֥ה נָ֣א גָֽא֣וֹן וָ/גֹ֑בַהּ וְ/ה֖וֹד וְ/הָדָ֣ר תִּלְבָּֽשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/040/010.yaml
  text: Adorn yourself[a], please, with majesty and loftiness, and clothe yourself with splendor and honor.
translation:
  language: te
  text: ఇప్పుడు[a] ఘనతతోను ఔన్నత్యంతోను నిన్ను నీవు అలంకరించుకో; వైభవాన్నీ మహిమనూ ధరించుకో.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దయచేసి గర్వంతోను ఉన్నతత్వంతోను నిన్ను నీవు అలంకరించుకో; మహిమనూ రాజసాన్నీ ధరించుకో.”
    reason: נָאకు ‘దయచేసి’ అనే విన్నపార్థం, గָּאוֹןకు ‘గర్వం,’ גֹּבַהּకు ‘ఉన్నతత్వం,’ הוֹדకు ‘మహిమ,’ הָדָరకు ‘రాజసం’ అనే సందర్భానుసార సాధ్యమైన ప్రత్యామ్నాయాలను సూచించడానికి.
lexical_decisions:
- source_word: עֲדֵה
  choice: నిన్ను నీవు అలంకరించుకో
  rationale: రెండవ పురుష ఏకవచన ఆజ్ఞారూపంలోని, తనను తాను అలంకరించుకోవడం అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది; తరువాతి ‘ధరించుకో’ అనే వస్త్ర రూపకంతోనూ సరిపోతుంది.
- source_word: נָא
  choice: ఆజ్ఞలోని సవాలు-ఉద్బోధన స్వరంలో అంతర్లీనంగా వ్యక్తీకరించబడింది
  rationale: ఈ కణం విన్నపాన్ని లేదా ఉద్ఘాటనను సూచించగలదు. ఇక్కడ దేవుడు యోబుకు విసురుతున్న సవాలు సందర్భంలో ‘దయచేసి’ అనడం అనుచితమైన మర్యాద స్వరాన్ని తెస్తుంది; ‘ఇప్పుడు’ అని ప్రత్యేకంగా చేరిస్తే కాలార్థాన్ని అవసరానికి మించి నిర్దిష్టం చేస్తుంది.
- source_word: גָּאוֹן
  choice: ఘనత
  rationale: ఇక్కడ పాపపూరిత గర్వం కన్నా రాజోచితమైన గొప్పతనం, మహోన్నత స్థితి ప్రధాన భావం. ‘ఘనత’ ఆ సానుకూల భావాన్ని తెలుగులో సహజంగా అందిస్తుంది.
- source_word: גֹּבַהּ
  choice: ఔన్నత్యం
  rationale: అక్షరార్థమైన ‘ఎత్తు’ ఇక్కడ గָּאוֹן‌తో సమాంతరంగా ఉన్నత వైభవాన్ని సూచిస్తుంది. ‘ఔన్నత్యం’ ప్రతికూలమైన అహంకార భావాన్ని బలవంతంగా రుద్దకుండా ఆ రూపకార్థాన్ని కాపాడుతుంది.
- source_word: הוֹד
  choice: వైభవం
  rationale: కంటికి కనిపించే గొప్పదనం, రాజసమైన శోభ అనే భావాన్ని ఇస్తుంది; ఇతర సమీపార్థ పదాలనుంచి కవితాత్మక భేదాన్ని నిలుపుతుంది.
- source_word: הָדָר
  choice: మహిమ
  rationale: గౌరవం, శోభ, రాజసత్వం కలిసిన భావాన్ని ఇక్కడ ‘మహిమ’ సహజంగా అందిస్తుంది; ‘వైభవం’తో కలిసి సమాంతరమైన ఘన పదజాలాన్ని నిలుపుతుంది.
- source_word: תִּלְבָּשׁ
  choice: వస్త్రాలుగా ధరించుకో
  rationale: కొనసాగుతున్న ఆజ్ఞార్థాన్ని, ధరించే వస్త్ర రూపకాన్ని స్పష్టంగా కాపాడుతుంది. తెలుగులో కేవలం ‘ధరించుకో’ అన్నా భావం వస్తుంది; ‘వస్త్రాలుగా’ అనడం రూపకాన్ని సామాన్య పాఠకునికి సులభంగా గ్రాహ్యం చేస్తుంది.
theological_decisions:
- issue: גָּאוֹן మరియు גֹּבַהּ పదాలను ప్రతికూల నైతిక భావంతో (‘గర్వం,’ ‘అహంకారం’) అనువదించాలా, లేక రాజోచిత/దైవిక గొప్పతనంగా అనువదించాలా
  choice: దేవునికి తగిన ఘనత, ఔన్నత్యం అనే సానుకూల రాజోచిత భావంతో అనువదించబడింది.
  alternative: ‘గర్వం,’ ‘అహంకారం’ వంటి ప్రతికూల భావంతో అనువదించడం.
  rationale: తక్షణ సందర్భంలో దేవుడు యోబును తనవంటి పరిపాలనా శక్తి, గొప్పతనం ప్రదర్శించమని సవాలు చేస్తున్నాడు. వస్త్రధారణ రూపకం, అలాగే הוֹד మరియు הָדָר పదాలతో ఉన్న జత, నైతిక దోషం కన్నా రాజసమైన వైభవానికే అనుకూలంగా ఉన్నాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కవితాత్మక శైలి ఉపయోగించబడింది. మూలంలోని రెండు సమాంతర ఆజ్ఞలను, నాలుగు రాజోచిత లక్షణాల సమాహారాన్ని నిలిపి, అతిగా సంస్కృతీకృతమైన లేదా మతశాఖాపరమైన పదజాలాన్ని నివారించాం.
