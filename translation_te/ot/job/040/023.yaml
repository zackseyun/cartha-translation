  yaml_path: translation/ot/job/040/023.yaml
  text: Look, if a river rages, he is not alarmed; he is confident even if the Jordan surges against his mouth.
translation:
  language: te
  text: చూడు, నది ఉద్ధృతంగా ప్రవహించినా అది బెదరదు; యొర్దాను దాని నోటివరకు ఉప్పొంగివచ్చినా అది నిశ్చింతగా ఉంటుంది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יַעֲשֹׁק נָהָר
  choice: నది ఉప్పొంగినా
  rationale: יַעֲשֹׁק అనే అరుదైన ప్రయోగం ఇక్కడ నది బలంగా పొంగడం లేదా ఉద్ధృతంగా ప్రవహించడాన్ని సూచిస్తుంది; సందర్భానికి సహజమైన తెలుగు రూపం.
- source_word: לֹא יַחְפּוֹז
  choice: అది బెదరదు
  rationale: ఆందోళన చెందడం, తొందరపడడం అనే భావాన్ని ఈ జంతువు సందర్భంలో సహజంగా ‘బెదరదు’ అని వ్యక్తపరుస్తుంది.
- source_word: יִבְטַח
  choice: అది ధైర్యంగా ఉంటుంది
  rationale: భద్రంగా, నిశ్చింతగా ఉండే భావాన్ని తెలుపుతుంది; ఇక్కడ దేవునిపై విశ్వాసం అనే ప్రత్యేక మతార్థాన్ని అనవసరంగా దిగుమతి చేయదు.
- source_word: יָגִיחַ יַרְדֵּן אֶל־פִּיהוּ
  choice: యొర్దాను దాని నోటివైపు పొంగివచ్చినా
  rationale: יָגִיחַ యొక్క దూసుకొచ్చే లేదా పొంగివచ్చే కదలికను నిలుపుతూ, אֶל־פִּיהוּను ‘దాని నోటివైపు’ అని నేరుగా అనువదిస్తుంది.
