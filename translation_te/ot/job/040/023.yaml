translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. సందర్భంలోని జంతువును సూచించేందుకు తెలుగు వ్యాకరణానుసారం నపుంసక ఏకవచన సర్వనామం వాడబడింది.
