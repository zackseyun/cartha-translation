  text: Then Job answered Yahweh and said:[a]
translation:
  language: te
  text: 'అప్పుడు యోబు యాహ్వేకు[a] జవాబిచ్చి ఇలా అన్నాడు:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూలో: “YHWH”; ప్రత్యామ్నాయ రూపాలు: “యాహ్వే” లేదా “యెహోవా.”'
    reason: దైవనామానికి సంబంధించిన హీబ్రూ అక్షరరూపం మరియు ప్రాచుర్యంలో ఉన్న ప్రత్యామ్నాయ ఉచ్చారణను తెలియజేయడం.
lexical_decisions:
- source_word: וַיַּעַן
  choice: జవాబిచ్చి
  rationale: ענה ధాతువు Qal wayyiqtol రూపంలో యోబు ఇచ్చే ప్రత్యుత్తరాన్ని పరిచయం చేస్తుంది. తరువాతి క్రియతో సహజమైన తెలుగు వాక్యంగా కలపడానికి ‘జవాబిచ్చి’ అని అనువదించాం.
- source_word: אִיּוֹב
  choice: యోబు
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: אֶת
  choice: ప్రత్యేకంగా అనువదించలేదు
  rationale: ఇది ప్రత్యక్ష కర్మను సూచించే వ్యాకరణ చిహ్నం; దాని పని తెలుగులో ‘యాహ్వేకు’ అనే విభక్తి రూపం ద్వారా వ్యక్తమవుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, హీబ్రూ నామానికి సమీపమైన తెలుగు లిప్యంతరీకరణగా ఇచ్చాం.
- source_word: וַיֹּאמַר
  choice: ఇలా అన్నాడు
  rationale: אמר ధాతువు Qal wayyiqtol రూపం. హీబ్రూలోని ‘జవాబిచ్చి ... అన్నాడు’ అనే రెండు క్రియల మాట-పరిచయ సూత్రాన్ని తెలుగులో సహజంగా నిలిపాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా
  rationale: మూలపాఠం దైవనామాన్ని ప్రత్యక్షంగా ఉపయోగిస్తుంది. అందువల్ల దానిని ‘ప్రభువు’ వంటి బిరుదుతో మార్చకుండా వ్యక్తినామంగా లిప్యంతరీకరించాం; ప్రాచుర్యంలో ఉన్న ప్రత్యామ్నాయ ఉచ్చారణను పాదసూచికలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన కథన శైలి. ‘జవాబిచ్చి ఇలా అన్నాడు’ అనే రూపం మూలంలోని రెండు క్రియలను నిలుపుతూ సహజమైన తెలుగు ప్రవాహాన్ని ఇస్తుంది.
