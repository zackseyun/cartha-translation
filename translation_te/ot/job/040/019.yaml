  yaml_path: translation/ot/job/040/019.yaml
  text: He is the first of the works of God[b][a]; only his Maker can bring near his sword.
translation:
  language: te
  text: అది దేవుని కార్యాల్లో ప్రథమమైనది[a]; దానిని చేసినవాడే తన ఖడ్గాన్ని దాని దగ్గరకు తీసుకురాగలడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అది దేవుని మార్గాల్లో ప్రధానమైనది.”
    reason: lexical_alternative
  - marker: b
    text: చివరి పాదంలోని హీబ్రూ పాఠం క్లిష్టమైనది. దానికి “దానిని చేసినవాడే ఖడ్గంతో దాని దగ్గరకు వెళ్లగలడు” లేదా “దానిని చేసినవాడు దానికి ఖడ్గాన్ని సమకూర్చాడు” అనే అర్థాలు కూడా ఉండవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: רֵאשִׁית
  choice: ప్రథమమైనది
  rationale: ఈ సందర్భంలో కాలపరమైన ఆరంభం మాత్రమే కాక, దేవుని సృష్టికార్యాల్లో అగ్రస్థానం లేదా ప్రాధాన్యాన్ని కూడా సూచించగల సంక్షిప్త పదప్రయోగం.
- source_word: דַּרְכֵי אֵל
  choice: దేవుని కార్యాల్లో
  rationale: సృష్టి సందర్భంలో דֶּרֶךְ దేవుని క్రియలు లేదా కార్యాలను సూచిస్తుంది; ఆధునిక తెలుగులో ‘కార్యాలు’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: אֵל
  choice: దేవుడు
  rationale: ఇక్కడ సాధారణ దైవనామంగా ఉన్న אֵל‌కు సహజమైన తెలుగు సమానం.
- source_word: הָעֹשׂוֹ
  choice: దానిని చేసినవాడు
  rationale: వ్యాసంతో కూడిన కృదంతం మరియు కర్మప్రత్యయాన్ని నేరుగా ప్రతిబింబిస్తూ, సృష్టికర్తను స్పష్టంగా సూచిస్తుంది.
- source_word: יַגֵּשׁ
  choice: దగ్గరకు తీసుకురాగలడు
  rationale: హిఫీల్ రూపంలోని ‘దగ్గరకు తేవడం’ అనే ప్రాథమిక భావాన్ని నిలుపుతూ, సందర్భంలో సామర్థ్యాన్ని సూచించే పఠనాన్ని సహజ తెలుగులో అందిస్తుంది.
- source_word: חַרְבּוֹ
  choice: తన ఖడ్గాన్ని
  rationale: మూడవ పురుష ఏకవచన పురుషలింగ ప్రత్యయాన్ని నిలుపుతుంది; ‘తన’ అనే రూపం ఖడ్గం చేసినవాడిదనే ప్రధాన వాక్యనిర్మాణ పఠనాన్ని తెలుగులో తెలియజేస్తుంది, అయితే ఇతర సాధ్య పఠనాలు పాదటిప్పణిలో ఇవ్వబడ్డాయి.
theological_decisions:
- issue: క్లిష్టమైన చివరి పాదం యొక్క అర్థం
  choice: దానిని చేసినవాడే తన ఖడ్గాన్ని దాని దగ్గరకు తీసుకురాగలడు
  alternative: దానిని చేసినవాడే ఖడ్గంతో దాని దగ్గరకు వెళ్లగలడు; లేదా దానిని చేసినవాడు దానికి ఖడ్గాన్ని సమకూర్చాడు
  rationale: హీబ్రూ వాక్యనిర్మాణం సంక్షిప్తంగా, అనిశ్చితంగా ఉంది. ప్రధాన పాఠం ‘దగ్గరకు తేవడం’ అనే క్రియాభావాన్ని నిలుపుతూ, ‘చేసినవాడే’ ద్వారా సందర్భంలో కనిపించే ప్రత్యేక సామర్థ్యాన్ని తెలియజేస్తుంది; ప్రత్యామ్నాయ అర్థాలను పాదటిప్పణి సంరక్షిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన శైలి. ‘అది/దానిని’ అనే నపుంసక రూపాలు సందర్భంలోని మహా జంతువును సూచిస్తాయి. మూలంలోని భావసందిగ్ధతను ప్రధాన పాఠం మరియు పాదటిప్పణుల ద్వారా సంరక్షించాం.
