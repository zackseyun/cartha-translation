  text: תִּמְשֹׁ֣ךְ לִוְיָתָ֣ן בְּ/חַכָּ֑ה וּ֝/בְ/חֶ֗בֶל תַּשְׁקִ֥יעַ לְשֹׁנֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/040/025.yaml
  text: Can you draw out Leviathan with a fishhook[b][a], or press down his tongue with a rope?
translation:
  language: te
  text: నీవు లివ్యాతానును చేపల కొక్కెంతో బయటికి లాగగలవా? లేదా తాడుతో దాని నాలుకను కిందికి అణచగలవా?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘తాడుతో దాని నాలుకను మునిగేలా చేయగలవా?’ లేదా ‘తాడుతో దాని నాలుకను కిందికి అదుపు చేయగలవా?’ హీబ్రూ చిత్రణ క్లిష్టంగా ఉంది; ఇది ఆ జీవిని నోటి దగ్గర తాడుతో అదుపు చేయడాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּמְשֹׁךְ
  choice: బయటికి లాగగలవా
  rationale: משׁך అనే క్రియ ఇక్కడ చేపను కొంకితో నీటిలోనుండి బయటికి లాగే భావాన్ని ఇస్తుంది. తెలుగు సందర్భంలో ‘బయటికి లాగు’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: לִוְיָתָן
  choice: లివ్యాతాను
  rationale: ఇది జీవికి వాడిన ప్రత్యేక నామం/పేరు; అందువల్ల అర్థానువాదం చేయకుండా తెలుగులో లిప్యంతరీకరించబడింది. విభక్తి కోసం ‘ను’ చేర్చబడింది.
- source_word: בְּחַכָּה
  choice: చేపకొంకితో
  rationale: חכה చేపలు పట్టే కొంకిని సూచిస్తుంది. ‘చేపకొంకి’ ఆధునిక తెలుగు పాఠకునికి సందర్భాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: וּבְחֶבֶל
  choice: తాడుతో
  rationale: חבל అంటే తాడు లేదా దారం. ఈ భారీ జీవి సందర్భంలో ‘తాడు’ సహజమైన, విస్తృతమైన పదం.
- source_word: תַּשְׁקִיעַ
  choice: కిందికి అణచగలవా
  rationale: שׁקע హిఫిల్ రూపానికి అక్షరార్థంగా ‘మునిగేలా చేయు/కిందికి దించు’ అనే భావం ఉంది. నాలుకకు తాడు వాడుతున్న క్లిష్ట చిత్రణలో ‘కిందికి అణచు’ అనేది బలవంతంగా కింద ఉంచే భావాన్ని నిలుపుతుంది; ఖచ్చితమైన పద్ధతిని నిర్ణయించదు.
- source_word: לְשֹׁנוֹ
  choice: దాని నాలుకను
  rationale: మూల హీబ్రూ స్పష్టంగా ‘దాని నాలుక’ అంటుంది. ‘నోరు’గా విస్తరించకుండా శరీర భాగాన్ని యథాతథంగా ఉంచడం జరిగింది.
