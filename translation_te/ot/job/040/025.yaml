translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన ప్రత్యక్ష ప్రశ్నారూపం వాడబడింది. దైవిక సంబోధనలో ఏకవచన ‘నీవు’ను నిలిపి, మూలంలోని రెండు సమాంతర ప్రశ్నలను సహజంగా వ్యక్తీకరించాం. క్లిష్టమైన రెండో పాదాన్ని ప్రధాన పాఠ్యంలో అతిగా వివరణాత్మకం చేయకుండా, ప్రత్యామ్నాయాలను పాదటిప్పణిలో ఇచ్చాం.
