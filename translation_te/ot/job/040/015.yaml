id: JOB.40.15
reference: Job 40:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: הִנֵּה נָ֣א בְ֭הֵמוֹת אֲשֶׁר עָשִׂ֣יתִי עִמָּ֑/ךְ חָ֝צִ֗יר כַּ/בָּקָ֥ר יֹאכֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/040/015.yaml
  text: Look now at Behemoth[a], which I made along with you; he eats grass like an ox.
translation:
  language: te
  text: ఇదిగో, నీతోపాటు నేను చేసిన బెహేమోతును[a] చూడు; అది ఎద్దులా గడ్డి తింటుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఆ మృగాన్ని.’ చాలామంది వ్యాఖ్యాతలు ‘బెహేమోతు’ను ఒక ప్రత్యేకమైన మహా ప్రాణి పేరు లేదా బిరుదుగా అర్థం చేసుకుంటారు; మరికొందరు దాన్ని నీటిగుర్రం లేదా వేరే పెద్ద జంతువుగా గుర్తిస్తారు.
    reason: alternative_reading
lexical_decisions:
- source_word: הִנֵּה נָא
  choice: ఇదిగో, ... చూడు
  rationale: הִנֵּה శ్రద్ధను ఆకర్షిస్తుంది; נָא ఈ సందర్భంలో తక్షణ దృష్టిని సూచిస్తుంది. సహజమైన ఆధునిక తెలుగులో ఈ రెండింటి బలాన్ని ‘ఇదిగో ... చూడు’ తెలియజేస్తుంది.
- source_word: בְהֵמוֹת
  choice: బెహేమోతు
  rationale: ఇది సాధారణంగా ‘మృగాలు/పశువులు’ అనే పదంతో సంబంధం ఉన్నప్పటికీ, ఇక్కడ ఒక విశిష్టమైన మహా ప్రాణికి నామం లేదా బిరుదుగా పనిచేస్తుంది. లిప్యంతరీకరణ దాని ఖచ్చితమైన జంతుశాస్త్రీయ గుర్తింపును ముందుగానే నిర్ణయించదు.
- source_word: אֲשֶׁר עָשִׂיתִי עִמָּךְ
  choice: నిన్ను చేసినట్లే నేను చేసిన
  rationale: עִמָּךְ సృష్టిలో సహభాగిత లేదా ‘నీతోపాటు’ అనే భావాన్ని ఇస్తుంది. తెలుగులో ‘నిన్ను చేసినట్లే’ అనేది దేవుడు యోబును చేసినట్లే ఈ ప్రాణినీ చేశాడనే భావాన్ని సహజంగా వ్యక్తం చేస్తుంది; భౌతిక సమీపాన్ని సూచించదు.
- source_word: חָצִיר
  choice: గడ్డి
  rationale: ఈ పదం గడ్డి లేదా పచ్చికను సూచిస్తుంది; ‘గడ్డి’ సాధారణ పాఠకులకు స్పష్టమైన సహజ సమానం.
- source_word: כַּבָּקָר
  choice: ఎద్దులా
  rationale: בָּקָר పశువులను సమూహార్థంలో సూచించగలదు. ఈ ఉపమానంలో ‘ఎద్దులా’ ఏకవచన జీవితో పోలికను స్పష్టంగా, సజీవంగా తెలుపుతుంది.
- source_word: יֹאכֵל
  choice: అది ... తింటుంది
  rationale: హీబ్రూలో క్రియ పుంలింగ ఏకవచనమైనా, ఆధునిక తెలుగులో జంతువును తెలియని లింగంతో సూచించడానికి ‘అది’ సహజం; క్రియ యొక్క వర్తమాన వర్ణనను ‘తింటుంది’ నిలుపుతుంది.
theological_decisions:
- issue: בְהֵמוֹת యొక్క గుర్తింపు
  choice: ప్రధాన పాఠ్యంలో ఒక విశిష్ట ప్రాణి పేరు/బిరుదుగా ‘బెహేమోతు’ అని లిప్యంతరీకరించడం
  alternative: ‘ఆ మృగం’ అని సాధారణంగా అనువదించడం, లేదా నీటిగుర్రం వంటి నిర్దిష్ట జంతువుగా గుర్తించడం
  rationale: మూలపాఠం ఈ ప్రాణి జంతుశాస్త్రీయ గుర్తింపును స్పష్టంగా నిర్ధారించదు. లిప్యంతరీకరణ కవితాత్మక బలాన్ని, అస్పష్టతను కాపాడుతూ ఏ నిర్దిష్ట వ్యాఖ్యానాన్నీ పాఠ్యంలోకి చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనా సాధారణ పాఠకులకు సులభంగా ఉండే శైలి. ‘ఇదిగో ... చూడు’ దైవ ప్రసంగంలోని దృష్టి ఆకర్షణను నిలుపుతుంది. బెహేమోతు లింగం నిర్ధారించకుండా సహజ తెలుగు సర్వనామం ‘అది’ వాడబడింది.
