  text: Would you even annul my justice? Would you condemn me so that you may be justified?[a]
translation:
  language: te
  text: నీవు నా న్యాయాన్ని కూడా[a] రద్దు చేస్తావా? నీవు సరైనవాడిగా తేలడానికి నన్ను దోషిగా తీర్చుతావా?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నా తీర్పును కూడా.’ హీబ్రూ పదం న్యాయం, తీర్పు లేదా న్యాయపరమైన హక్కు అనే అర్థాలను ఇవ్వగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַאַף
  choice: నీవు ... న్యాయాన్నే ... చేస్తావా?
  rationale: ప్రశ్నార్థక భావాన్ని ప్రశ్న నిర్మాణంతో, אַף ఇచ్చే విస్మయపూర్వక ఉద్ఘాటనను ‘న్యాయాన్నే’లోని ‘-ఏ’ నొక్కుతో సహజమైన తెలుగులో వ్యక్తం చేసింది.
- source_word: תָּפֵר
  choice: రద్దు చేస్తావా
  rationale: హిఫిల్ రూపంలోని ‘చెల్లకుండా చేయడం, నిర్వీర్యం చేయడం’ అనే న్యాయసంబంధ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: מִשְׁפָּטִי
  choice: నా న్యాయం
  rationale: ఈ సందర్భంలో దేవుని న్యాయపరమైన పరిపాలన లేదా న్యాయమైన తీర్పు అనే విస్తృత భావాన్ని ఇస్తుంది; ‘నా తీర్పు’ అనే సాధ్యమైన అర్థాన్ని పాదసూచికలో ఉంచింది.
- source_word: תַּרְשִׁיעֵנִי
  choice: నన్ను దోషిగా తీర్చుతావా
  rationale: రשע హిఫిల్‌కు ఉన్న న్యాయస్థాన సంబంధమైన ‘దోషిగా ప్రకటించడం’ అనే భావాన్ని సహజంగా, స్పష్టంగా నిలుపుతుంది.
- source_word: לְמַעַן
  choice: నిలవడానికి
  rationale: ప్రయోజనం లేదా ఉద్దేశాన్ని తెలిపే ‘దానికోసం’ అనే సంబంధాన్ని సంక్షిప్తమైన తెలుగు ప్రయోజనార్థక నిర్మాణంతో వ్యక్తం చేస్తుంది.
- source_word: תִּצְדָּק
  choice: నీవు నీతిమంతుడిగా నిలవడానికి
  rationale: ‘న్యాయమైనవాడిగా లేదా సరైనవాడిగా తేలడం’ అనే צדק యొక్క భావాన్ని, ముందున్న ‘దోషిగా తీర్చడం’తో ఉన్న న్యాయపరమైన వ్యత్యాసాన్ని కాపాడుతూ వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: వచనంలోని న్యాయస్థాన భాషను నిలుపడం
  choice: ‘న్యాయం—దోషిగా తీర్చడం—నీతిమంతుడిగా నిలవడం’ అనే న్యాయపరమైన పదజాలం
  alternative: ‘నా నీతిని తక్కువ చేసి, నీవు సరైనవాడివని చూపుకోవడం’ వంటి సాధారణ నైతిక భాష
  rationale: מִשְׁפָּט, רשע, צדק పదాలకు ఈ సందర్భంలో బలమైన న్యాయస్థాన నేపథ్యం ఉంది. ఈ రూపం యోబు దేవుని న్యాయాన్ని ప్రశ్నిస్తున్నాడనే తీవ్రమైన భావాన్ని మృదువుపరచదు.
- issue: מִשְׁפָּטִי యొక్క విస్తృతార్థం
  choice: నా న్యాయం
  alternative: నా తీర్పు
  rationale: సందర్భం ఒక్క తీర్పుకన్నా దేవుని న్యాయమైన పరిపాలనను కూడా సూచించగలదు. అయినా ‘నా తీర్పు’ సార్థకమైన ప్రత్యామ్నాయం కావడంతో పాదసూచికలో ఇచ్చింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన ప్రత్యక్ష ప్రశ్నలుగా అనువదించబడింది. ‘రద్దు చేయడం,’ ‘దోషిగా తీర్చడం,’ ‘నీతిమంతుడిగా నిలవడం’ అనే పదబంధాలు సాధారణ పాఠకులకు అర్థమయ్యేలా ఉండి, మూలంలోని న్యాయస్థాన స్వరాన్ని కాపాడుతాయి.
