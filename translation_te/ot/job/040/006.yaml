  text: וַ/יַּֽעַן יְהוָ֣ה אֶת אִ֭יּוֹב מנ סערה וַ/יֹּאמַֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/040/006.yaml
  text: Then Yahweh answered Job out of the storm and said:[a]
translation:
  language: te
  text: అప్పుడు యాహ్వే తుఫానులోనుండి యోబుకు జవాబిచ్చి ఇలా అన్నాడు:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సుడిగాలిలోనుండి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן
  choice: అప్పుడు ... జవాబిస్తూ
  rationale: వావ్-అనుక్రమ రూపం కథనాన్ని ముందుకు నడిపిస్తుంది; ענה ఇక్కడ యోబుకు జవాబు ఇవ్వడాన్ని సూచిస్తుంది. తరువాతి וַיֹּאמַרతో సహజమైన తెలుగులో కలిపి పలికించబడింది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే లిప్యంతరీకరణగా ఇచ్చాం.
- source_word: אֶת אִיּוֹב
  choice: యోబుకు
  rationale: אֵת యోబును క్రియ యొక్క వ్యక్తి-కర్మగా గుర్తిస్తుంది; తెలుగు వాడుకలో ‘యోబుకు జవాబిచ్చాడు’ అనే దత్తివిభక్తి సహజం.
- source_word: מן סערה
  choice: తుఫానులోనుండి
  rationale: סְעָרָה బలమైన గాలి తుఫాను, సుడిగాలి, లేదా ప్రళయగాలిని సూచించగలదు. ‘తుఫాను’ అర్థపరిధిని అతిగా సంకుచితం చేయకుండా సహజంగా తెలియజేస్తుంది.
- source_word: וַיֹּאמַר
  choice: 'ఇలా అన్నాడు:'
  rationale: తదుపరి వచనంలో వచ్చే ప్రత్యక్ష ప్రసంగాన్ని పరిచయం చేసే సాధారణ కథన సూత్రం; ద్విబిందువు ఆ ప్రసంగాన్ని సూచిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో వ్యక్తిగత దైవనామం ఉంది; దానిని ‘ప్రభువు’ అనే బిరుదుతో మార్చలేదు. తెలుగు పాఠకులకు పరిచితమైన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం; ‘యాహ్వే’ కూడా సాధ్యమైన పండిత లిప్యంతరీకరణ.
- issue: סְעָרָה యొక్క దైవప్రత్యక్ష సందర్భంలోని చిత్రం
  choice: తుఫాను
  alternative: సుడిగాలి
  rationale: మూలపదం నిర్దిష్టంగా కేవలం సుడిగాలినే తప్పనిసరిగా సూచించదు. అందువల్ల విస్తృతమైన ‘తుఫాను’ను ప్రధాన పాఠ్యంలో ఉంచి, సంప్రదాయబద్ధమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. హీబ్రూ ‘జవాబిచ్చి అన్నాడు’ అనే ద్విక్రియా నిర్మాణాన్ని తెలుగులో సులభంగా చదవబడే ‘జవాబిస్తూ ఇలా అన్నాడు’గా అందించాం; భావంలోని ప్రతిస్పందన మరియు ప్రత్యక్ష ప్రసంగ పరిచయం రెండూ నిలిచాయి.
