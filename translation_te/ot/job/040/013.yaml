translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కావ్య ఆజ్ఞారూపాన్ని ఉపయోగించాం. ‘దాచిపెట్టు/పాతిపెట్టు’ అనే నిజమైన అర్థసందిగ్ధతను పాదసూచికలో ఉంచాం; క్లిష్టమైన చివరి పదబంధాన్ని అతిగా వ్యాఖ్యానించకుండా స్థలార్థంతో అనువదించాం.
