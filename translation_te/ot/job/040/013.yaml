  text: טָמְנֵ֣/ם בֶּ/עָפָ֣ר יָ֑חַד פְּ֝נֵי/הֶ֗ם חֲבֹ֣שׁ בַּ/טָּמֽוּן׃
base_translation:
  language: en
  yaml_path: translation/ot/job/040/013.yaml
  text: Hide them together in the dust[b][a]; bind their faces in the hidden place.
translation:
  language: te
  text: వారందరినీ కలిసి ధూళిలో దాచిపెట్టు[a]; వారి ముఖాలను దాగిన స్థలంలో బంధించు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారందరినీ కలిసి ధూళిలో పాతిపెట్టు.” హీబ్రూ క్రియకు “దాచు” అనే అర్థం ఉంది; ఈ సందర్భంలో అది పాతిపెట్టడాన్ని కూడా సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “వారి ముఖాలను రహస్యంగా బంధించు,” లేదా “మరుగులో బంధించు.” చివరి హీబ్రూ పదబంధం అర్థం నిర్ధారించడం కష్టం; అది దాగిన స్థలాన్ని సూచిస్తూ, మొదటి భాగంలోని “దాచిపెట్టు” అనే క్రియను ప్రతిధ్వనింపజేస్తుండవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: טָמְנֵם
  choice: వారిని దాచిపెట్టు
  rationale: טמן అనే క్రియ యొక్క ప్రాథమిక అర్థం ‘దాచు/మరుగుపరచు.’ ధూళి, మరణం అనే సందర్భంలో పాతిపెట్టడం సూచితమవొచ్చు; అయినా మూలంలోని విస్తృతార్థాన్ని నిలుపుకోవడానికి ‘దాచిపెట్టు’ ఎంచుకున్నాం.
- source_word: בֶּעָפָר
  choice: ధూళిలో
  rationale: עָפָר సాధారణంగా ధూళి లేదా వదులైన మట్టిని సూచిస్తుంది. కావ్య సందర్భంలోని మరణశీలత భావాన్ని ‘ధూళి’ సహజంగా నిలుపుతుంది.
- source_word: יָחַד
  choice: అందరినీ కలిపి
  rationale: సమష్టిగా జరిగే చర్యను సూచించే క్రియావిశేషణం. తెలుగులో ‘వారందరినీ కలిపి’ 3వ పురుష బహువచన కర్మతో సహజంగా సరిపోతుంది.
- source_word: פְּנֵיהֶם
  choice: వారి ముఖాలను
  rationale: మూలంలో అక్షరార్థంగా ‘వారి ముఖాలు.’ వ్యక్తులను సూచించే అలంకారార్థం ఉండవచ్చుగానీ, పారదర్శకత కోసం స్పష్టమైన బహువచన రూపాన్ని నిలిపాం.
- source_word: חֲבֹשׁ
  choice: బంధించు
  rationale: חבשׁ యొక్క ప్రధాన భావం ‘కట్టు/బంధించు.’ ఇక్కడ నిర్బంధం లేదా మూసివేత భావం ఉండవచ్చు; ‘బంధించు’ మూల చిత్రాన్ని, దాని ఉద్రిక్తతను కాపాడుతుంది.
- source_word: בַּטָּמוּן
  choice: రహస్య స్థలంలో
  rationale: ఇది טמן నుంచి వచ్చిన, ‘దాచబడినది’ లేదా ‘దాగిన స్థలం’ అనే భావమిచ్చే రూపంగా ఉండవచ్చు. సహజమైన ఆధునిక తెలుగులో ‘రహస్య స్థలంలో’ ఆ స్థలార్థాన్ని నిలుపుతుంది; చివరి పదబంధంలోని క్లిష్టతను పాదసూచిక తెలియజేస్తుంది.
