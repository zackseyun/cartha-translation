  text: יַחְפֹּ֣ץ זְנָב֣/וֹ כְמוֹ אָ֑רֶז גִּידֵ֖י פחד/ו יְשֹׂרָֽגוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/040/017.yaml
  text: He makes his tail stiff like a cedar[a]; the sinews of his thighs are knit together.
translation:
  language: te
  text: అది తన తోకను దేవదారు వలె గట్టిపరుస్తుంది; దాని తొడల స్నాయువులు పెనవేసుకొని ఉన్నాయి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “దాని నడుము భాగపు స్నాయువులు”; మరింత నిర్దిష్టంగా, “దాని జననేంద్రియాల కండరాలు/స్నాయువులు.” ఇక్కడి హీబ్రూ పదం అర్థం అనిశ్చితమైనది, చర్చనీయమైనది.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחְפֹּץ
  choice: బిగిస్తుంది
  rationale: ఈ సందర్భంలో క్రియ తోకను దేవదారుతో పోల్చే శారీరక చర్యను సూచిస్తుంది. ‘బిగిస్తుంది’ దృఢత్వ భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; ‘ఆనందిస్తుంది’ అనే సాధారణ అర్థం ఇక్కడ సరిపోదు.
- source_word: זְנָבוֹ
  choice: దాని తోకను
  rationale: మూడవ పురుష ఏకవచన స్వామ్యప్రత్యయంతో ఉన్న నామవాచకానికి సూటియైన అనువాదం.
- source_word: כְמוֹ אָרֶז
  choice: దేవదారు చెట్టులా
  rationale: బలం, దృఢత్వం, పరిమాణాన్ని సూచించే ప్రత్యక్ష ఉపమానాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: גִּידֵי
  choice: నరాలు
  rationale: గీద్ అనేది స్నాయువు లేదా కండరబంధాన్ని సూచిస్తుంది. సాధారణ పాఠకులకు అర్థమయ్యే కవితాత్మక శరీరవర్ణనగా ‘నరాలు’ వాడబడింది; మరింత శరీరనిర్దిష్ట భావం పాదసూచికలో వివరించబడింది.
- source_word: פחדו
  choice: దాని తొడల
  rationale: ఈ పదం అర్థం అనిశ్చితమైనది. ప్రధాన పాఠ్యంలో సందర్భానికి సరిపోయే, అసభ్యంగా అనిపించని ‘తొడలు’ ఉంచి, నడుము లేదా జననాంగాల కండరాలు/స్నాయువులు అనే ప్రత్యామ్నాయాలను పాదసూచికలో భద్రపరచాం.
- source_word: יְשֹׂרָגוּ
  choice: ఒకదానితో ఒకటి అల్లుకొని ఉన్నాయి
  rationale: క్రియలోని పెనవేసుకోవడం లేదా అల్లుకుపోవడం అనే భావాన్ని స్పష్టమైన, సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
