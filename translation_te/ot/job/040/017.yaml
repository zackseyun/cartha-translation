- from: దేవదారు చెట్టులా అది తన తోకను బిగిస్తుంది; దాని తొడల నరాలు[a] ఒకదానితో ఒకటి అల్లుకొని ఉన్నాయి.
  to: అది తన తోకను దేవదారు వలె గట్టిపరుస్తుంది; దాని తొడల స్నాయువులు పెనవేసుకొని ఉన్నాయి.[a]
  rationale: The revision corrects the anatomical sense of גִּידֵי from 'nerves' to 'sinews,' makes the cedar-tail image more explicit in idiomatic Telugu, and continues to leave the disputed meaning of פַחֲדוֹ unresolved in the main text while documenting viable alternatives in the footnote.
