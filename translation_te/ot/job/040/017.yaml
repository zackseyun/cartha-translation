  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా కవితాత్మక గంభీరతను నిలిపాం. హీబ్రూ పదంలోని శరీరనిర్దిష్ట అనిశ్చితిని ప్రధాన పాఠ్యంలో పరిష్కరించకుండా పాదసూచికలో సంరక్షించాం.
