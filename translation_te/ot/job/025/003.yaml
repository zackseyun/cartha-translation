  - marker: c
    text: ‘ఆయన వెలుగు’ అనేది దేవుడు అందరికీ ఇచ్చే వెలుగును, ఆయన తేజస్సును, లేదా ఆయన ప్రభావం అందరినీ చేరడాన్ని సూచించవచ్చు; హీబ్రూ దీనిని మరింత నిర్దిష్టంగా చెప్పదు.
