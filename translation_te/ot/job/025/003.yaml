lexical_decisions:
- source_word: הֲיֵשׁ מִסְפָּר
  choice: లెక్క ఉందా?
  rationale: హీబ్రూలోని అస్తిత్వార్థక ప్రశ్నను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తూ, ‘సంఖ్య/లెక్క’ అనే మూలభావాన్ని నిలుపుతుంది.
- source_word: לִגְדוּדָיו
  choice: ఆయన సైన్యాలకు
  rationale: גְּדוּד అనే పదం సైనిక దండు, బృందం, లేదా సైన్యాన్ని సూచించగలదు. సందర్భంలో దేవుని అపారమైన ఆధిపత్యాన్ని తెలిపేందుకు ‘సైన్యాలు’ సహజంగా, గౌరవప్రదంగా ఉంది.
- source_word: וְעַל־מִי
  choice: ఎవరి మీద
  rationale: עַל లోని స్థానసంబంధ రూపకాన్ని తెలుగులో సహజంగా నిలుపుతుంది.
- source_word: לֹא יָקוּם
  choice: ఉదయించదు
  rationale: קוּם కు ‘లేచు/ఉదయించు’ అనే భావం ఉంది; వెలుగు కర్తగా ఉన్నందున ‘ఉదయించు’ తెలుగులో సహజమైన పదప్రయోగం.
- source_word: אוֹרֵהוּ
  choice: ఆయన వెలుగు
  rationale: אוֹר అనే పదానికి నేరుగా ‘వెలుగు’ అని అనువదించి, దాని భౌతిక లేదా రూపకాలంకార భావాన్ని మరింత సంకుచితం చేయకుండా ఉంచింది; పురుష ఏకవచన ప్రత్యయం ‘ఆయన’గా నిలుపబడింది.
theological_decisions:
- issue: ‘ఆయన సైన్యాలు,’ ‘ఆయన వెలుగు’ అనే పదబంధాల్లోని పురుష ఏకవచన ప్రత్యయానికి పూర్వపదం
  choice: యోబు 25:2 సందర్భానుసారం అది దేవుణ్ణి సూచిస్తుంది; అయినా ప్రధాన పాఠంలో ‘దేవుని’ అని స్పష్టీకరించకుండా ‘ఆయన’ అనే సర్వనామమే ఉంచబడింది.
  alternative: ఒక పరలోక పాలకునికి సాధారణ సూచనగా గ్రహించడం.
  rationale: బిల్దదు దేవుని పరిపాలన, భయమహిమ గురించి మాట్లాడుతున్న సందర్భం దేవుణ్ణే అత్యంత సహజమైన పూర్వపదంగా చేస్తుంది. అయితే హీబ్రూ రూపాన్ని గౌరవిస్తూ సర్వనామాన్ని స్పష్టీకరణతో భర్తీ చేయలేదు.
- issue: ‘ఆయన వెలుగు’ యొక్క భావం
  choice: అందరిపై వ్యాపించే దేవుని వెలుగును సూచించే విస్తృత రూపకం; ప్రధాన పాఠం దీనిని కేవలం ‘వెలుగు’గానే ఉంచుతుంది.
  alternative: ప్రత్యేకంగా సూర్యకాంతి, దైవ తేజస్సు, అనుగ్రహం, లేదా దేవుని చేరువను సూచించడం.
  rationale: హీబ్రూ ఈ చిత్రాన్ని ఒకే నిర్దిష్ట అర్థానికి పరిమితం చేయదు. అందువల్ల భౌతిక, రూపకాలంకార భావాల మధ్యనున్న ఉద్దేశపూర్వక విస్తృతిని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ప్రశ్నారూపం వాడబడింది. ‘సైన్యాలు,’ ‘వెలుగు,’ ‘ఉదయించు’ అనే పదాలు సాధారణ పాఠకులకు సులభంగా ఉండటంతో పాటు మూలంలోని సైనిక, ప్రకాశ రూపకాలను నిలుపుతాయి.
