source:
  edition: WLC
  text: הַמְשֵׁ֣ל וָ/פַ֣חַד עִמּ֑/וֹ עֹשֶׂ֥ה שָׁ֝ל֗וֹם בִּ/מְרוֹמָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/job/025/002.yaml
  text: Dominion and dread are with him[b][a]; he makes peace in his heights.
translation:
  language: te
  text: ఆధిపత్యం, భయం ఆయనతో ఉన్నాయి[a]; ఆయన తన ఉన్నత స్థలాల్లో[b] శాంతిని కలిగిస్తాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆధిపత్యం, భయం ఆయనవే.’
    reason: alternative_reading
  - marker: b
    text: లేదా, ‘తన ఉన్నత లోకాలలో’; ఈ పదబంధం మహోన్నతమైన పరలోక ప్రాంతాన్ని సూచిస్తుండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמְשֵׁל
  choice: ఆధిపత్యం
  rationale: ఈ నామవాచకం ఏలుబడి లేదా అధికారం అనే భావాన్ని సూచిస్తుంది. ‘ఆధిపత్యం’ మూలంలోని అమూర్త భావాన్ని, కవితాత్మక నామవాచక నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: וָפַחַד
  choice: భయం
  rationale: פחדకు భయం, భీతి, భయంకరమైన బెదురు అనే అర్థాలు ఉన్నాయి. ‘భయం’ అతిగా తీవ్రతను చేర్చకుండా మూలంలోని విస్తృత భావాన్ని నిలుపుతుంది; దీనిని ‘భయభక్తి’గా అనువదిస్తే మూలంలో స్పష్టంగా లేని ఆరాధనా భావం చేరే అవకాశం ఉంది.
- source_word: עִמּוֹ
  choice: ఆయనతో ఉన్నాయి
  rationale: ఈ పదబంధానికి అక్షరార్థం ‘ఆయనతో’ అని. హీబ్రూ వాక్యంలో క్రియ లేకపోవడం వల్ల తెలుగులో సహజత కోసం ‘ఉన్నాయి’ చేర్చబడింది. ఇది స్వామ్య భావాన్ని బలవంతంగా స్పష్టీకరించకుండా మూల చిత్రణను కాపాడుతుంది.
- source_word: עֹשֶׂה
  choice: కలిగిస్తాడు
  rationale: עשה సాధారణంగా చేయడం అనే అర్థమిచ్చే క్రియ; ఇక్కడ కర్త యొక్క నిరంతర లేదా లక్షణాత్మక కార్యాన్ని తెలిపే కృదంత రూపంలో ఉంది. ‘శాంతిని కలిగిస్తాడు’ అనేది తెలుగులో సహజంగా ఉండి, ‘స్థాపిస్తాడు’ కంటే తక్కువ వ్యాఖ్యానాత్మకం.
- source_word: שָׁלוֹם
  choice: శాంతి
  rationale: שׁלוםకు శాంతి, క్షేమం, సంపూర్ణత వంటి విస్తృత అర్థాలున్నాయి. ఈ విశ్వవ్యాప్త సందర్భంలో ‘శాంతి’ సహజమైనదీ, సందర్భోచితమైనదీ.
- source_word: בִּמְרֹמָיו
  choice: తన ఉన్నత స్థలాల్లో
  rationale: మూల పదం ఎత్తు లేదా ఉన్నత స్థలాన్ని సూచిస్తుంది; బహువచన ప్రత్యయంతో ‘ఆయన ఉన్నత స్థలాల్లో’ అనే భావం వస్తుంది. ఈ అనువాదం పరలోకాన్ని సూచించే అవకాశాన్ని నిలుపుతూ, దానిని నేరుగా ‘పరలోకాల్లో’ అని పరిమితం చేయదు.
theological_decisions:
- issue: ప్రారంభ వాక్యభాగం స్వభావం
  choice: ఆధిపత్యం, భయం దేవునితో ఉన్నాయని తెలిపే వాక్యంగా అనువదించడం
  alternative: ‘ఆధిపత్యం, భయం ఆయనవే’ అని స్వామ్యార్థంలో అనువదించడం
  rationale: క్రియలేని హీబ్రూ వాక్యం ‘ఆయనతో ఉన్నాయి’ అనే సహచర్య/స్థితి భావాన్నీ, ‘ఆయనవే’ అనే స్వామ్య భావాన్నీ అనుమతిస్తుంది. ప్రధాన పాఠం మూలానికి పారదర్శకమైన ‘ఆయనతో ఉన్నాయి’ అనే రూపాన్ని ఉంచి, ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన, సులభంగా అర్థమయ్యే కవితాత్మక శైలి ఉపయోగించబడింది. మూలంలోని సమాంతర నిర్మాణం, ‘ఆయనతో’ అనే అస్పష్టత, ‘ఉన్నత స్థలాలు’ అనే విశాలమైన ఆకాశీయ చిత్రణ నిలుపబడ్డాయి.
