source:
  edition: WLC
  text: וּ/מַה יִּצְדַּ֣ק אֱנ֣וֹשׁ עִם אֵ֑ל וּ/מַה יִּ֝זְכֶּ֗ה יְל֣וּד אִשָּֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/025/004.yaml
  text: So how can man be righteous before God? And how can one born of woman be pure?[a][b]
translation:
  language: te
  text: అయితే దేవుని ఎదుట నరుడు ఎలా నీతిమంతుడు కాగలడు?[a] స్త్రీకి పుట్టినవాడు ఎలా శుద్ధుడు కాగలడు?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దేవునితో.’ హీబ్రూలో అక్షరార్థంగా ‘దేవునితో’; అయితే ఈ పదబంధం ఆయన ఎదుట ఒకరి స్థితిని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘నిర్మలుడు’ లేదా ‘నిర్దోషి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמַה
  choice: అయితే ... ఎలా కాగలడు?
  rationale: సంయోజక అవ్యయంతో కూడిన מַה ఇక్కడ అలంకారిక ప్రశ్నను పరిచయం చేస్తుంది. సందర్భ సంబంధాన్ని ‘అయితే’ తెలియజేస్తుంది; ‘ఎలా కాగలడు?’ దాని సహజమైన తెలుగు ప్రశ్నారూపం.
- source_word: יִצְדַּק
  choice: నీతిమంతుడు ... కాగలడు
  rationale: צדק యొక్క Qal రూపం నీతిగా లేదా సరైన స్థితిలో ఉండడాన్ని సూచిస్తుంది. ‘నీతిమంతుడు కాగలడు’ ఆ భావాన్ని నిలుపుతూ, నిర్దిష్టమైన న్యాయశాస్త్ర సిద్ధాంతాన్ని అనవసరంగా చేర్చదు.
- source_word: אֱנוֹשׁ
  choice: నరుడు
  rationale: אֱנוֹשׁ బలహీనమైన, మర్త్య మానవుని సూచిస్తుంది. ‘నరుడు’ కవితాత్మక గౌరవాన్ని, ఏకవచన మానవ ప్రతినిధిత్వాన్ని నిలుపుతుంది.
- source_word: עִם אֵל
  choice: దేవుని ఎదుట
  rationale: అక్షరార్థంగా ‘దేవునితో’; ఇక్కడ దేవునితో సంబంధంలో మానవుని స్థితిని ప్రశ్నిస్తున్నందున ‘దేవుని ఎదుట’ సహజంగా ఉంది. అక్షరార్థ ప్రత్యామ్నాయం పాదటిప్పణిలో ఇవ్వబడింది.
- source_word: יִזְכֶּה
  choice: పవిత్రుడు ... కాగలడు
  rationale: זכה Qalలో శుభ్రంగా, నిర్మలంగా లేదా నిర్దోషిగా ఉండడాన్ని సూచించగలదు. ‘పవిత్రుడు’ నైతిక నిర్మలతను సహజంగా వ్యక్తం చేస్తూ మొదటి పాదంలోని ‘నీతిమంతుడు’తో సమాంతరంగా నిలుస్తుంది.
- source_word: יְלוּד אִשָּׁה
  choice: స్త్రీకి పుట్టినవాడు
  rationale: ఈ పదబంధం మానవ జన్మ, మర్త్యత, సృష్టిత్వాన్ని సూచించే సామాన్య ప్రయోగం. తెలుగు రూపం మూలంలోని ఏకవచన సమాంతరతను నిలుపుతుంది.
theological_decisions:
- issue: మానవజాతిని సూచించే ఏకవచన భాష
  choice: నరుడు ... స్త్రీకి పుట్టినవాడు
  alternative: మానవుడు ... స్త్రీకి పుట్టిన ఎవరైనా
  rationale: హీబ్రూ పురుషలింగ ఏకవచన రూపాలతో సాధారణ మానవత్వాన్ని సూచిస్తుంది. అనువాదం ఆ ప్రతినిధి ఏకవచనాన్ని, కవితా సమాంతరతను నిలుపుతుంది.
- issue: దేవునితో సంబంధంలో మానవుని నీతి స్థితి
  choice: దేవుని ఎదుట
  alternative: దేవునితో
  rationale: עִם అక్షరార్థంగా ‘తో’ అయినప్పటికీ, సందర్భంలో దేవుని సమక్షంలో లేదా ఆయనతో సంబంధంలో మానవుని నీతి స్థితి ఉద్దేశించబడింది. ‘ఎదుట’ న్యాయసంబంధ ఛాయను సూచిస్తుంది గాని, దానిని ఒక నిర్దిష్ట సిద్ధాంతంగా నిర్ణయించదు.
- issue: זכה లోని నిర్మలత మరియు నిర్దోషిత్వ భావాలు
  choice: పవిత్రుడు
  alternative: శుద్ధుడు లేదా నిర్దోషి
  rationale: మూలపదం శుభ్రత, నిర్మలత, నిర్దోషిత్వం అనే పరస్పర సంబంధిత భావాలను అనుమతిస్తుంది. ప్రధాన పాఠంలో ‘పవిత్రుడు’ విస్తృత నైతిక భావాన్ని ఇస్తుంది; ఇతర సాధ్యార్థాలు పాదటిప్పణిలో ఉంచబడ్డాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన కవితా శైలి. ‘నరుడు’ యోబు గ్రంథపు జ్ఞానసాహిత్య స్వరానికి సరిపోతూ సాధారణ మానవుని సూచిస్తుంది. రెండు సమాంతర అలంకారిక ప్రశ్నల నిర్మాణం నిలుపబడింది.
