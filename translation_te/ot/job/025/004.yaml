    issue: ‘పవిత్రుడు’ for יִזְכֶּה
    rationale: In standard Telugu, ‘పవిత్రుడు’ commonly denotes one who is holy or sacred. The Hebrew asks whether one born of woman can be clean/pure/innocent; ‘శుద్ధుడు’ preserves this lexical range and avoids importing a holiness/consecration nuance.
