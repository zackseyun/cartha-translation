  text: 'Then Bildad the Shuhite answered and said:'
translation:
  language: te
  text: 'అప్పుడు షూహీయుడైన బిల్దదు జవాబుగా ఇలా అన్నాడు:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן
  choice: జవాబిచ్చాడు
  rationale: ענה అనే క్రియ ఈ సంభాషణ సూత్రంలో ‘జవాబిచ్చాడు’ అనే అర్థాన్ని ఇస్తుంది; ఇది ముందున్న మాటకు ప్రతిస్పందనను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: בִּלְדַּד
  choice: బిల్దదు
  rationale: వ్యక్తి పేరును హెబ్రీ ఉచ్చారణకు దగ్గరగా, తెలుగులో స్థిరపడిన బైబిలు నామరూపానికి అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: הַשֻּׁחִי
  choice: షూహీయుడైన
  rationale: ఈ జాతి/ప్రాంత సూచక పదం బిల్దదును షూహుతో సంబంధమున్నవాడిగా గుర్తిస్తుంది; ‘షూహీయుడు’ ఆ సంబంధాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: וַיֹּאמַר
  choice: ఇలా
  rationale: హెబ్రీలోని ‘జవాబిచ్చి చెప్పాడు’ అనే ద్విక్రియా సూత్రాన్ని తెలుగులో యాంత్రికంగా పునరావృతం చేయకుండా, తరువాత వచ్చే ప్రత్యక్ష ప్రసంగాన్ని సూచించే ‘ఇలా జవాబిచ్చాడు’గా సహజంగా వ్యక్తపరిచాం.
- source_word: וַיַּעַן ... וַיֹּאמַר
  choice: అప్పుడు ... ఇలా జవాబిచ్చాడు
  rationale: ప్రారంభ వావ్ కథన పురోగతిని సూచించేందున ‘అప్పుడు’ వాడాం; మొత్తం సూత్రాన్ని భావం కోల్పోకుండా ప్రస్తుత ప్రామాణిక తెలుగులో సహజంగా మలిచాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే కథన శైలి. వచనాంతంలోని ద్విబిందువు తరువాతి ప్రత్యక్ష ప్రసంగాన్ని సూచిస్తుంది.
