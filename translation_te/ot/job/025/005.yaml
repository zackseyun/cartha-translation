source:
  edition: WLC
  text: הֵ֣ן עַד יָ֭רֵחַ וְ/לֹ֣א יַאֲהִ֑יל וְ֝/כוֹכָבִ֗ים לֹא זַכּ֥וּ בְ/עֵינָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/025/005.yaml
  text: Behold[a], even the moon does not shine[b], and the stars are not pure in his eyes.
translation:
  language: te
  text: ఇదిగో, చంద్రుడు కూడా ప్రకాశించడు[a]; నక్షత్రాలు ఆయన దృష్టిలో నిర్మలమైనవి కావు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘చంద్రుడు వెలుగు ఇవ్వడు’ లేదా ‘చంద్రుడు కాంతిమంతంగా ఉండడు.’
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘నక్షత్రాలు ఆయన దృష్టిలో శుభ్రమైనవి కావు’; ‘ప్రకాశవంతమైనవి కావు’ అనే భావం కూడా సాధ్యమే.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: ఇదిగో
  rationale: బిల్దదు చెప్పే గంభీరమైన పరిశీలనవైపు శ్రోత దృష్టిని మళ్లించే ఉద్ఘాటనను నిలుపుతుంది.
- source_word: עַד
  choice: కూడా
  rationale: ఇక్కడ స్థలకాల పరిమితిని కాకుండా ‘చంద్రుడు సైతం’ అనే ఉద్ఘాటన భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: יָרֵחַ
  choice: చంద్రుడు
  rationale: పోలికలో పేర్కొన్న ఆకాశగోళానికి నేరమైన, సహజమైన తెలుగు పదం.
- source_word: לֹא יַאֲהִיל
  choice: ప్రకాశించడు
  rationale: హిఫిల్ రూపం ఇక్కడ వెలుగు ఇవ్వడం లేదా ప్రకాశించడం అనే భావాన్ని సూచిస్తుంది; చంద్రుణ్ని వ్యక్తీకరించే తెలుగు వ్యాకరణానికి అనుగుణంగా పుంలింగ క్రియ వాడబడింది.
- source_word: וְכוֹכָבִים
  choice: నక్షత్రాలు
  rationale: ఆకాశ సంబంధమైన కవితా చిత్రణను నేరుగా కొనసాగిస్తుంది; తెలుగు వాక్యప్రవాహంలో ‘మరియు’ అవసరం లేకుండా విరామచిహ్నంతో సమన్వయం చూపబడింది.
- source_word: לֹא זַכּוּ
  choice: నిర్మలమైనవి కావు
  rationale: మూలధాతువులోని శుద్ధత/స్వచ్ఛత భావాన్ని నిలుపుతూ, దేవుని మూల్యాంకన సందర్భంలో అతిగా నైతికీకరించకుండా గుణాత్మక లోపాన్ని తెలియజేస్తుంది.
- source_word: בְעֵינָיו
  choice: ఆయన దృష్టిలో
  rationale: ‘అతని కళ్లలో’ అనే హీబ్రూ నుడికారానికి సహజమైన తెలుగు సమానార్థకం; సందర్భంలో సూచితుడైన దేవునికి గౌరవసూచక ఏకవచనం వాడబడింది.
theological_decisions:
- issue: בְעֵינָיו లోని మూడవ పురుష ఏకవచన ప్రత్యయం ఎవరిని సూచిస్తుంది?
  choice: ‘ఆయన’ అంటే దేవుడు
  alternative: కవితా వాదనలో నిర్దిష్టంగా చెప్పని ఒక పరిశీలకుడు
  rationale: 25:2–6 సందర్భంలో బిల్దదు దేవుని మహోన్నతతనాన్ని, ఆయన ఎదుట సృష్టి మరియు మానవుని అపరిపూర్ణతను వివరిస్తున్నాడు. అందువల్ల ఈ ఏకవచన ప్రత్యయం సహజంగా దేవునినే సూచిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కవితా శైలి పాటించబడింది. ‘ఇదిగో’ మూలంలోని దృష్టి ఆకర్షణను నిలుపుతుంది. ‘ఆయన దృష్టిలో’ తెలుగు నుడికారానికి సహజంగా ఉండి, సందర్భంలోని దేవుని సూచనను స్పష్టం చేస్తుంది. రెండు సందిగ్ధ మూలపదాల ప్రత్యామ్నాయ భావాలు పాదసూచికల్లో భద్రపరచబడ్డాయి.
