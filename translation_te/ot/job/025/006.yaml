translation:
  language: te
  text: మరి కుళ్లుపురుగైన నరుడు[a], పురుగైన నరపుత్రుడు[b] మరెంత అల్పుడు!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నరుడు’కు బదులు ‘మరణశీలుడైన మనిషి’ అని కూడా అనువదించవచ్చు; హీబ్రూ אֱנוֹשׁ తరచుగా మానవుని బలహీనతను నొక్కి చెబుతుంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా ‘నరపుత్రుడు’ లేదా ‘మనిషి కుమారుడు.’ ఇక్కడ ఇది ఒక మానవుణ్ణి సూచించే కవితాత్మక ప్రయోగమే గాని మెస్సీయ బిరుదు కాదు.
    reason: cultural_note
lexical_decisions:
- source_word: אַף כִּי
  choice: మరి … ఇంకెంత తక్కువ
  rationale: ముందటి వచనంలోని అధిక–అల్ప తర్కాన్ని కొనసాగించే హీబ్రూ ప్రయోగం. తెలుగులో ‘ఇంకెంత తక్కువ’ దాని అనుమానార్థక నిర్ధారణ బలాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: אֱנוֹשׁ
  choice: నరుడు
  rationale: ఈ పదం మానవుని బలహీనతను, మరణశీలతను సూచిస్తుంది. ఏకవచన కవితాత్మక ప్రతినిధిత్వాన్ని ‘నరుడు’ నిలుపుతుంది; ప్రత్యామ్నాయ భావాన్ని పాదటిప్పణిలో ఇచ్చాం.
- source_word: רִמָּה
  choice: కుళ్లు పురుగు
  rationale: కుళ్లిపోతున్న పదార్థంతో సంబంధమున్న లార్వా లేదా మగ్గట్‌ను సూచిస్తుంది. తరువాతి תּוֹלֵעָה నుండి తేడాను నిలుపుతూ తెలుగులో స్పష్టంగా ఉండేందుకు ‘కుళ్లు పురుగు’ ఎంచుకున్నాం.
- source_word: בֶן אָדָם
  choice: మనిషి కుమారుడు
  rationale: మూలంలోని ‘మనిషి కుమారుడు’ అనే కవితాత్మక రూపాన్ని నిలుపుతుంది. ఇక్కడ అది ఒక మానవుణ్ణి సూచించే సమాంతర ప్రయోగం; బిరుదు కాదు.
- source_word: תּוֹלֵעָה
  choice: పురుగు
  rationale: ఇది సాధారణంగా పురుగును సూచించే విస్తృత పదం. רִמָּה కు ఇచ్చిన ‘కుళ్లు పురుగు’తో ఉన్న పదభేదాన్ని నిలుపుతుంది.
theological_decisions:
- issue: ‘మనిషి కుమారుడు’ అనే మాటను మెస్సీయ బిరుదుగా చదవాలా?
  choice: ఒక మానవుణ్ణి సూచించే బిరుదేతర కవితాత్మక ప్రయోగం
  alternative: మెస్సీయను సూచించే బిరుదు
  rationale: ఇక్కడ בֶן אָדָם అనేది אֱנוֹשׁ కు సమాంతరంగా ఉండి, మానవుని అల్పత్వాన్ని సూచిస్తుంది. సందర్భంలో ఇది మెస్సీయ సంబంధమైన బిరుదు కాదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కవితాత్మక శైలిని ఉపయోగించాం. మూలంలోని రెండు పురుగు పదాల భేదాన్ని ‘కుళ్లు పురుగు’ మరియు ‘పురుగు’గా నిలిపాం. ముందటి వచనం నుంచి అర్థమయ్యే పోలికను విపులీకరించకుండా, హీబ్రూ వాక్యంలోని సంక్షిప్తతను సాధ్యమైనంతవరకు కాపాడాం.
