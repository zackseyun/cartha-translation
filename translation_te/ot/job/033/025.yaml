  text: his flesh becomes fresher than in youth[b][a]; he returns to the days of his youthful vigor.
translation:
  language: te
  text: 'అతని శరీరం యౌవనంలో ఉన్నప్పటికంటే తాజాగా అవుతుంది[a];

    అతడు తన యౌవన దినాలకు తిరిగి వస్తాడు[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అతని శరీరం బాలునిదానిలా తాజాగా చేయబడుతుంది,’ లేదా ‘అతని శరీరం యువకునిదానికంటే తాజాగా అవుతుంది.’ హీబ్రూ క్రియ అరుదైనది; యౌవనంతో చేసిన పోలికను కొద్దిగా భిన్న రీతుల్లో అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘అతడు తన యౌవన బలం ఉన్న దినాలకు తిరిగి వస్తాడు.’ హీబ్రూ నామవాచకం యౌవనదశను లేదా దానితో ముడిపడిన బలాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֻטֲפַשׁ
  choice: తాజాగా అవుతుంది
  rationale: అరుదైన ఈ క్రియ మళ్లీ తాజాగా, పుష్టిగా కావడాన్ని సూచిస్తుంది. శారీరక పునరుద్ధరణ భావాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: בְּשָׂרוֹ
  choice: అతని శరీరం
  rationale: హీబ్రూలో అక్షరార్థంగా ‘అతని మాంసం’; ఆధునిక తెలుగులో వ్యక్తి దేహాన్ని సహజంగా, గౌరవప్రదంగా సూచించేందుకు ‘శరీరం’ ఎంచుకున్నాం.
- source_word: מִנֹּעַר
  choice: యౌవనంలో ఉన్నప్పటికంటే
  rationale: מִן‌ను పోలికను తెలిపే రూపంగా తీసుకొని, అతని శరీరం యౌవనకాలంలోకంటే మరింత తాజాగా కావడం అనే భావాన్ని నిలిపాం.
- source_word: יָשׁוּב
  choice: అతడు ... తిరిగి వస్తాడు
  rationale: పుంలింగ ఏకవచన క్రియను ‘శరీరం’ కంటే ఆ వ్యక్తినే సూచించేదిగా తీసుకున్నాం; సందర్భంలోని కర్త కొనసాగింపును ఇది కాపాడుతుంది.
- source_word: לִימֵי
  choice: రోజులకు
  rationale: ‘... రోజులలోకి/రోజులకు’ అనే హీబ్రూ నుడికారాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: עֲלוּמָיו
  choice: తన యౌవన బలం
  rationale: ఈ నామవాచకం కేవలం వయస్సునే కాక యౌవనదశలోని శక్తి లేదా పుష్టిని కూడా సూచించగలదు; ప్రధాన పాఠంలో ఆ విస్తృత భావాన్ని సహజంగా వ్యక్తం చేశాం.
