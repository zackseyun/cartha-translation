source:
  edition: WLC
  text: הֵ֣ן תְּ֭נוּאוֹת עָלַ֣/י יִמְצָ֑א יַחְשְׁבֵ֖/נִי לְ/אוֹיֵ֣ב לֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/033/010.yaml
  text: Look[a], he finds grounds for hostility against me; he counts me as his enemy.
translation:
  language: te
  text: ఇదిగో[a], ఆయన నాకు వ్యతిరేకంగా కారణాలు కనుగొంటున్నాడు; నన్ను తన శత్రువుగా పరిగణిస్తున్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నాపై విరోధాలను కనుగొంటున్నాడు,’ ‘నాకు వ్యతిరేకంగా సందర్భాలను కనుగొంటున్నాడు,’ లేదా బహుశా ‘నాపై ఫిర్యాదులను కనుగొంటున్నాడు.’ ఇక్కడి హెబ్రీయ నామవాచకం అరుదైనది; దాని అర్థం సందర్భాన్ని బట్టి మారుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: ఇదిగో
  rationale: బలంగా దృష్టిని ఆకర్షించే హెబ్రీయ పదప్రయోగాన్ని గౌరవప్రదమైన, సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: תְּנוּאוֹת
  choice: విరోధంగా కారణాలు
  rationale: అరుదైన ఈ నామవాచకం సందర్భంలో శత్రుత్వానికి కారణాలు లేదా వ్యతిరేక సందర్భాలు అనే భావాన్ని సూచిస్తుంది. తెలుగు వాక్యంలో ‘కనుగొంటున్నాడు’తో సహజంగా కలుస్తూనే దాని అనిశ్చితిని పాదటిప్పణిలో ఉంచుతుంది.
- source_word: עָלַי
  choice: నాకు విరోధంగా
  rationale: ఈ సందర్భంలో עַל ప్రతికూల లేదా విరోధార్థక సంబంధాన్ని సూచిస్తుంది.
- source_word: יִמְצָא
  choice: కనుగొంటున్నాడు
  rationale: ‘కనుగొను’ అనే మూలార్థాన్ని కాపాడుతుంది; ‘కల్పిస్తున్నాడు’ అని అనువదించి అన్యాయ ఆరోపణ భావాన్ని అదనంగా చేర్చదు.
- source_word: יַחְשְׁבֵנִי
  choice: నన్ను ...గా ఎంచుతున్నాడు
  rationale: חשב ఇక్కడ ఒక వ్యక్తిని నిర్దిష్ట స్థితిలో పరిగణించడం లేదా లెక్కించడం అనే మూల్యాంకన భావాన్ని ఇస్తుంది; తెలుగులో ‘ఎంచు’ కంటే ‘ఎంచుతున్నాడు’ కొంత ఉద్దేశపూర్వక ఎంపికను సూచించినా, శత్రువుగా భావించే బలాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לְאוֹיֵב לוֹ
  choice: తన శత్రువుగా
  rationale: హెబ్రీయ దాతృక నిర్మాణం యోబును దేవుడు ఏ స్థితిలో పరిగణిస్తున్నాడో తెలియజేస్తుంది; ‘తన శత్రువుగా’ సహజమైన తెలుగు రూపం.
theological_decisions:
- issue: యోబుపట్ల దేవుని వ్యవహారం గురించి వక్త తెలియజేసే దృక్కోణం
  choice: ‘ఆయన నాకు విరోధంగా కారణాలు కనుగొంటున్నాడు; నన్ను తన శత్రువుగా ఎంచుతున్నాడు’ అని యోబు ఫిర్యాదును నివేదికగా నిలుపడం
  alternative: ‘ఆయన నాపై నేరాలు కల్పిస్తున్నాడు’
  rationale: ఇది యోబు భావించిన ఫిర్యాదును ఏలీహు ఉటంకిస్తున్న సందర్భం. ‘కల్పిస్తున్నాడు’ అని పదును పెట్టి దేవుడు అన్యాయంగా ఆరోపణలు సృష్టిస్తున్నాడనే నిర్ణయాన్ని అనువాదం స్వయంగా చేయకుండా, అసలు వాక్యంలోని ఉద్రిక్తతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయినా గంభీరతను కాపాడే శైలి. అరుదైన హెబ్రీయ పదంలోని నిజమైన అనిశ్చితిని ప్రధాన వాక్యంలో అతిగా వివరించకుండా పాదటిప్పణిలో తెలియజేశాం.
