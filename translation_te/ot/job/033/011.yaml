  text: He puts my feet in the stocks[a]; he watches all my paths.
translation:
  language: te
  text: ఆయన నా కాళ్లను బొండలో పెడతాడు; నా దారులన్నిటినీ గమనిస్తాడు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘నా దారులన్నిటినీ కాపాడుతాడు.’ హెబ్రీ క్రియకు ‘గమనించు’ లేదా ‘కాపాడు’ అనే రెండు అర్థాలు రావచ్చు; ఇక్కడి సందర్భం రక్షణకన్నా నిశిత పరిశీలనను సూచిస్తున్నట్లు కనిపిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשֵׂם
  choice: పెడతాడు
  rationale: שׂים అనే సాధారణ క్రియకు ‘పెట్టు/ఉంచు’ అనే అర్థం ఉంది. నిర్బంధ సాధనంలో కాళ్లను పెట్టే స్పష్టమైన దృశ్యానికి ‘పెడతాడు’ సహజంగా సరిపోతుంది.
- source_word: בַּסַּד
  choice: బొండలో
  rationale: סַד కాళ్లను కదలకుండా నిర్బంధించే సాధనాన్ని సూచిస్తుంది. తెలుగు బైబిలు సందర్భంలో ‘బొండ’ ఈ శిక్షాత్మక నిర్బంధ దృశ్యాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: רַגְלָי
  choice: నా కాళ్లను
  rationale: మొదటి పురుష ఏకవచన ప్రత్యయంతో ఉన్న ఈ రూపం సహజంగా రెండు కాళ్లను సూచిస్తుంది.
- source_word: יִשְׁמֹר
  choice: గమనిస్తాడు
  rationale: שׁמר అంటే కాపాడు, కనిపెట్టు, గమనించు అనే అర్థాలు రావచ్చు. యోబు ఫిర్యాదును ఏలీహు ఉటంకిస్తున్న ఈ సందర్భంలో రక్షణకన్నా నిశిత పరిశీలన భావం బలంగా ఉంది; అయినా ప్రత్యామ్నాయ అర్థాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: כָּל
  choice: అన్నిటినీ
  rationale: బహువచనమైన ‘దారులు’తో సహజంగా కలిసే సంపూర్ణత సూచక రూపం.
- source_word: אָרְחֹתָי
  choice: నా దారులన్నిటినీ
  rationale: אֹרַח అంటే దారి లేదా మార్గం; రూపకంగా జీవన నడవడిని కూడా సూచిస్తుంది. ‘దారులు’ మూలంలోని రూపకాన్ని నిలుపుతుంది.
theological_decisions:
- issue: రెండవ పాదంలో దేవుని చర్య రక్షణాత్మక కాపుదలా, శిక్షాత్మక పరిశీలనా?
  choice: శిక్షాత్మక లేదా న్యాయపరమైన పరిశీలనను సూచించే ‘గమనిస్తాడు’
  alternative: రక్షణాత్మక భావం కలిగిన ‘కాపాడుతాడు’
  rationale: ఈ సందర్భంలో దేవుడు తనను శత్రువులా నిర్బంధించి తన నడవడినంతటినీ పరిశీలిస్తున్నాడనే యోబు ఫిర్యాదును ఏలీహు సంగ్రహిస్తున్నాడు. అందువల్ల ‘గమనిస్తాడు’ సందర్భానికి మెరుగ్గా సరిపోతుంది; అయితే హెబ్రీ క్రియలోని నిజమైన ద్వంద్వార్థాన్ని పాదటిప్పణిలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడబడింది. ‘బొండ’ నిర్బంధ సాధనాన్ని సూచించే సంక్షిప్త పదంగా ఉంచబడింది; ‘దారులు’ అనే రూపకం మూలభాష ప్రకారమే నిలుపబడింది. పాదటిప్పణి గుర్తు అది వివరించే ‘గమనిస్తాడు’ తరువాత ఉంచబడింది.
