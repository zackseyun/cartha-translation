translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా అనువదించబడింది. రెండవ అర్ధపాదంలో హీబ్రూ కవిత్వం విడిచిపెట్టిన క్రియాభావాన్ని తెలుగులో ‘రుచించదు’ అని స్పష్టపరిచాం; ఇది మొదటి అర్ధపాదంలోని ఆహారవిరక్తిని కొనసాగిస్తుంది.
