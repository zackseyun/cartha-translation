  text: so that his life loathes bread[b][a], and his soul desirable food.
translation:
  language: te
  text: అతని జీవశక్తికి రొట్టె అసహ్యమవుతుంది; అతని ప్రాణానికి[b] కోరదగిన ఆహారం[a] కూడా అసహ్యమవుతుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఇష్టమైన ఆహారం’ లేదా ‘మంచి ఆహారం’; హీబ్రూ పదబంధం కోరబడే లేదా ఆకర్షణీయమైన ఆహారాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో ‘అతని ప్రాణం’; సందర్భాన్ని బట్టి ఇది అతని జీవాన్ని, అతనినే, లేదా అతని ఆకలిని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזִהֲמַתּוּ
  choice: అసహ్యమవుతుంది
  rationale: זהם అనే క్రియ ఆహారం పట్ల కలిగే తీవ్రమైన విరక్తిని సూచిస్తుంది. తెలుగులో ‘అసహ్యమవుతుంది’ ఈ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: חַיָּתוֹ
  choice: అతని ప్రాణానికి
  rationale: חיה ఇక్కడ జంతువును కాక వ్యక్తి జీవాన్ని లేదా జీవశక్తిని సూచిస్తుంది. ‘ప్రాణానికి’ అనేది కవితాత్మక భావాన్ని నిలుపుతూ తెలుగులో అర్థమయ్యే రూపం.
- source_word: לָחֶם
  choice: రొట్టె
  rationale: మూలపదం యొక్క ప్రాథమిక, స్పష్టమైన అర్థాన్ని నిలుపుతుంది; తరువాతి అర్ధపాదంలోని విస్తృతమైన ‘ఆహారం’తో ఉన్న కవితా సమాంతరతను కూడా కాపాడుతుంది.
- source_word: נַפְשׁוֹ
  choice: అతనికి
  rationale: נפשׁ ఇక్కడ వ్యక్తిని, అతని జీవాన్ని లేదా ఆకలిని సూచించగలదు. పదశః ‘అతని ఆత్మ’ అనడం ఆధునిక తెలుగులో అనవసరమైన ద్వైతార్థాన్ని కలిగించవచ్చు; ‘అతనికి’ సందర్భార్థాన్ని సహజంగా అందిస్తుంది.
- source_word: מַאֲכַל
  choice: ఆహారం
  rationale: తినే పదార్థాన్ని సూచించే సాధారణ పదానికి ‘ఆహారం’ సహజమైన సమానార్థకం.
- source_word: תַּאֲוָה
  choice: ఇష్టమైన
  rationale: కోరదగిన లేదా ఆకర్షణీయమైనదనే భావాన్ని ఆహారానికి సహజంగా అన్వయిస్తుంది; ‘ఎంపికైన’ లేదా ‘శ్రేష్ఠమైన’ అనే భావానికే పరిమితం చేయదు.
