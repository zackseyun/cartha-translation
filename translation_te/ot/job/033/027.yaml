  yaml_path: translation/ot/job/033/027.yaml
  text: He sings before men and says, ‘I have sinned and twisted what was right, and it was not repaid to me.’
translation:
  language: te
  text: 'అతడు ప్రజల ఎదుట పాడుతూ ఇలా అంటాడు: “నేను పాపం చేశాను; సరైనదాన్ని వక్రీకరించాను. అయినా దానికి తగిన ప్రతిఫలం నాకు కలగలేదు.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יָשֹׁר
  choice: పాడుతూ
  rationale: ఈ రూపాన్ని ‘పాడుట’ అనే అర్థమిచ్చే שׁיר ధాతువుతో అనుసంధానించే పఠనాన్ని అనుసరిస్తుంది; సందర్భంలో రక్షణ పొందిన వ్యక్తి ప్రజల ఎదుట తన అనుభవాన్ని ప్రకటిస్తున్నాడు.
- source_word: עַל אֲנָשִׁים
  choice: ప్రజల ఎదుట
  rationale: అక్షరార్థంగా ‘మనుష్యుల మీద/వైపు’; ఇక్కడ బహిరంగంగా ఇతరుల సమక్షంలో చెప్పడాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: חָטָאתִי
  choice: నేను పాపం చేశాను
  rationale: మొదటి పురుష ఏకవచనంలోని స్పష్టమైన పాప ఒప్పుకోలును నేరుగా నిలుపుతుంది.
- source_word: וְיָשָׁר הֶעֱוֵיתִי
  choice: సరైనదాన్ని వక్రీకరించాను
  rationale: יָשָׁר అంటే న్యాయమైనది/సరైనది; עוה హిఫీల్ రూపం దానిని వంకర చేయడం లేదా వక్రీకరించడం అనే భావాన్ని ఇస్తుంది.
- source_word: וְלֹא שָׁוָה לִי
  choice: అయినా దానికి తగిన ప్రతిఫలం నాకు కలగలేదు
  rationale: అరుదైన నిర్మాణం ‘అది నాకు సమానంగా/తగినట్లుగా కాలేదు’ అనే భావాన్ని కలిగి ఉంది; సందర్భానుసారంగా పాపానికి తగిన ఫలితం అతనికి పూర్తిగా రాలేదని తెలుపుతుంది, అయితే దానిని ‘క్షమించబడింది’ అని సిద్ధాంతపరంగా విస్తరించదు.
theological_decisions:
- issue: וְלֹא שָׁוָה לִי ద్వారా వ్యక్తమయ్యే దైవిక వ్యవహారం
  choice: దానికి తగిన ప్రతిఫలం నాకు కలగలేదు
  alternative: అది నాకు ప్రయోజనం కలిగించలేదు
  rationale: శిక్ష నుంచి కాపాడబడిన సందర్భం (33:24-30) ప్రతిఫలం/ప్రతికార భావానికి మద్దతిస్తుంది. అయినప్పటికీ ‘పూర్తిగా క్షమించాడు’ లేదా ‘అర్హించిన శిక్ష విధించలేదు’ వంటి మరింత నిర్దిష్ట సిద్ధాంత భాషను చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, బహిరంగ పాప ఒప్పుకోలు వంటి గంభీర స్వరాన్ని నిలుపుతూ సాధారణ పాఠకునికి సహజంగా రూపొందించబడింది. మూలంలోని చివరి అరుదైన పదబంధాన్ని సందర్భానికి అనుగుణంగా స్పష్టీకరించినా, క్షమాపణ లేదా ప్రాయశ్చిత్తం గురించి మూలంలో లేని పదాలను జోడించలేదు.
