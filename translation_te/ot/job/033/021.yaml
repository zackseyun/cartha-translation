  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే కవితాత్మక గంభీరతను నిలుపుతూ అనువదించబడింది. రెండు సమాంతర పాదాల నిర్మాణం మరియు శరీర క్షీణతకు సంబంధించిన స్పష్టమైన దృశ్యభాష సంరక్షించబడ్డాయి.
