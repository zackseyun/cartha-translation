  text: His flesh wastes away from sight[a], and his bones, once unseen, stick out.
translation:
  language: te
  text: 'అతని మాంసం కంటికి కనిపించనంతగా క్షీణించిపోతుంది;

    ఇంతకు ముందు కనిపించని అతని ఎముకలు బయటికి పొడుచుకొస్తాయి.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతని మాంసం కనిపించకుండా కరిగిపోతుంది; కనిపించని అతని ఎముకలు బయటపడతాయి.” ఈ పాదంలోని హీబ్రూ వాక్యం సంక్షిప్తంగాను కొంత క్లిష్టంగాను ఉంది; ముఖ్యంగా “బయటికి పొడుచుకొస్తాయి” అని అనువదించిన క్రియ అర్థం అనిశ్చితంగా ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִכֶל
  choice: క్షీణించిపోతుంది
  rationale: כלה అనే క్రియ ఇక్కడ శరీరం క్రమంగా క్షీణించి తగ్గిపోవడాన్ని సూచిస్తుంది. తెలుగు సందర్భంలో ‘క్షీణించిపోతుంది’ సహజంగా ఉండి శారీరక నశింపును స్పష్టంగా తెలియజేస్తుంది.
- source_word: בְּשָׂרוֹ
  choice: అతని మాంసం
  rationale: ‘మాంసం’ అనే సూటి అనువాదం శరీర క్షీణతకు సంబంధించిన స్పష్టమైన దృశ్యరూపాన్ని నిలుపుతుంది.
- source_word: מֵרֹאִי
  choice: కంటికి కనిపించనంతగా
  rationale: מן + רֹאִי మాంసం చూపు నుండి కనుమరుగయ్యేంతగా తగ్గిపోవడాన్ని సూచిస్తుంది. ‘కంటికి కనిపించనంతగా’ ఆధునిక తెలుగులో ఆ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: וְשֻׁפִי
  choice: బయటికి పొడుచుకొస్తాయి
  rationale: ఈ అరుదైన, క్లిష్టమైన రూపం సందర్భంలో మాంసం క్షీణించడంతో ఎముకలు స్పష్టంగా బయటపడటం లేదా పొడుచుకొని కనిపించడాన్ని సూచిస్తుంది. ‘బయటికి పొడుచుకొస్తాయి’ ఆ దృశ్యాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: עַצְמוֹתָיו
  choice: అతని ఎముకలు
  rationale: బహువచన నామవాచకాన్ని మూడవ పురుష ఏకవచన సంబంధప్రత్యయంతో సూటిగా అనువదించింది.
- source_word: לֹא רֻאּוּ
  choice: ఇంతకు ముందు కనిపించని
  rationale: ראה క్రియ యొక్క నిషేధార్థక కర్మణి రూపం ఎముకలు ముందుగా కనిపించలేదని సూచిస్తుంది. ‘ఇంతకు ముందు’ అనడం మాంసం క్షీణించిన తరువాత ఏర్పడే వ్యత్యాసాన్ని సహజంగా తెలియజేస్తుంది.
