source:
  edition: WLC
  text: הֶן כָּל אֵ֭לֶּה יִפְעַל אֵ֑ל פַּעֲמַ֖יִם שָׁל֣וֹשׁ עִם גָּֽבֶר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/033/029.yaml
  text: Look[a], God does all these things two or three times with a man,
translation:
  language: te
  text: చూడండి, దేవుడు ఈ కార్యాలన్నిటినీ ఒక మనిషితో[a] రెండు లేదా మూడు సార్లు చేస్తాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఒక వ్యక్తితో”; హీబ్రూలో “ఒక మనిషితో” అని ఉంది. ఇక్కడ ఏకవచనం ప్రతినిధి ప్రయోగంగా ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶן
  choice: చూడండి
  rationale: వాక్యంపై శ్రద్ధ నిలిపే ఉద్ఘాటనాత్మక సంభాషణ అవ్యయం; ఆధునిక తెలుగులో సహజంగా, గౌరవప్రదంగా ఉంది.
- source_word: כָּל אֵלֶּה
  choice: ఈ కార్యాలన్నిటినీ
  rationale: ముందు సందర్భంలో వివరించిన దేవుని చర్యలను సూచిస్తుంది; ‘కార్యాలు’ సందర్భార్థాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: יִפְעַל
  choice: చేస్తాడు
  rationale: פעל ఇక్కడ చర్యలను చేయడం లేదా నెరవేర్చడం అనే సాధారణ భావంలో ఉంది.
- source_word: אֵל
  choice: దేవుడు
  rationale: ఇక్కడ אֵל దేవుణ్ణి సూచించే సాధారణ పదం; ప్రత్యేక నామంగా అనువదించాల్సిన అవసరం లేదు.
- source_word: פַּעֲמַיִם שָׁלֹשׁ
  choice: రెండు సార్లు, మూడు సార్లు
  rationale: హీబ్రూ పదక్రమంలోని ‘రెండుసార్లు, మూడుసార్లు’ అనే పునరావృత భావాన్ని అస్పష్టత కోల్పోకుండా నిలుపుతుంది.
- source_word: עִם
  choice: విషయంలో
  rationale: దేవుడు ఒక మనిషితో వ్యవహరించడాన్ని సహజ తెలుగులో తెలియజేస్తుంది; ‘కోసం’ వంటి ప్రయోజనార్థక వ్యాఖ్యానాన్ని రుద్దదు.
- source_word: גָּבֶר
  choice: ఒక మనిషి
  rationale: పుంలింగ ఏకవచన మూలపదాన్ని కాపాడుతుంది; సందర్భంలో ఇది ప్రతినిధి ఏకవచనంగా మనుష్యుని సూచించగలదని పాదటిప్పణి స్పష్టం చేస్తుంది.
theological_decisions:
- issue: גָּבֶר లోని ప్రతినిధి పుంలింగ ప్రయోగం
  choice: ఒక మనిషి
  alternative: ఒక వ్యక్తి / ఒక మానవుడు
  rationale: హీబ్రూ పుంలింగ ఏకవచనాన్ని ప్రధాన పాఠ్యంలో నిలిపి, అది పురుషులకు మాత్రమే పరిమితం అన్న భావన రాకుండా దాని ప్రతినిధి ప్రయోగాన్ని పాదటిప్పణిలో వివరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే సహజమైన, గౌరవప్రదమైన శైలి. సంఖ్యా జంటలోని హీబ్రూ ఉద్ఘాటనను ‘రెండు సార్లు, మూడు సార్లు’గా నిలిపింది.
