source:
  edition: WLC
  text: לְ֭/הָסִיר אָדָ֣ם מַעֲשֶׂ֑ה וְ/גֵוָ֖ה מִ/גֶּ֣בֶר יְכַסֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/033/017.yaml
  text: to turn a man from his deed[a], and to cover pride from a strong man,
translation:
  language: te
  text: మనిషిని అతని కార్యం నుండి మళ్లించడానికి[a], బలవంతుని నుండి గర్వాన్ని కప్పివేయడానికి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, మరింత అక్షరార్థంగా, “మనిషి కార్యాన్ని తొలగించడానికి, బలవంతుని నుండి గర్వాన్ని కప్పివేయడానికి.” హెబ్రీ వాక్యం సంక్షిప్తంగా ఉంది. దీనిని మనిషిని అతని కార్యం నుండి మళ్లించడం అనిగానీ, ఆ కార్యాన్నే అతని నుండి తొలగించడం అనిగానీ అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: לְהָסִיר
  choice: మళ్లించడానికి
  rationale: סור యొక్క హిఫిల్ రూపం ఒకరిని దేనినుండైనా తొలగిపోయేలా చేయడం అనే కారణార్థాన్ని ఇస్తుంది. ఈ సందర్భంలో ‘పని నుండి మళ్లించడం’ సహజంగా ఉంది.
- source_word: אָדָם
  choice: మనిషిని
  rationale: ఇక్కడ ఏకవచనంలో ఉండి, రెండో పాదంలోని גֶּבֶרతో సమాంతరంగా ఉంది; అందువల్ల ఏకవచన ‘మనిషి’ తగినది.
- source_word: מַעֲשֶׂה
  choice: అతని పని
  rationale: ఈ నామవాచకానికి పని, కార్యం, క్రియ అనే అర్థాలు ఉన్నాయి. హెబ్రీలో సంబంధం సంక్షిప్తంగా ఉన్నందున ‘అతని పని’ సందర్భోచితమైన అర్థాన్ని తెలుపుతుంది.
- source_word: וְגֵוָה
  choice: గర్వాన్ని
  rationale: ఇక్కడ ప్రతికూలమైన స్వీయోన్నతి లేదా అహంభావాన్ని సూచిస్తుంది; ‘గర్వం’ సాధారణ పాఠకులకు సహజమైన, గౌరవప్రదమైన పదం.
- source_word: מִגֶּבֶר
  choice: బలవంతుని
  rationale: גֶּבֶר పదంలో బలం లేదా పౌరుషంపై ఉండే ఛాయను నిలుపుతూ, మొదటి పాదంలోని אָדָםతో ఉన్న పదభేదాన్ని ప్రతిబింబిస్తుంది.
- source_word: יְכַסֶּה
  choice: కప్పివేయడానికి
  rationale: ఇది రూపపరంగా అసంపూర్ణ క్రియ అయినా, ముందున్న ఉద్దేశార్థక క్రియతో సమాంతరంగా పనిచేస్తుంది. ‘కప్పివేయడం’ హెబ్రీలోని స్పష్టమైన రూపకాన్ని నిలుపుతుంది.
theological_decisions:
- issue: దేవుడు పలికే హెచ్చరిక ఉద్దేశాన్ని తెలిపే సంక్షిప్త వాక్య నిర్మాణం
  choice: మనిషిని అతని పని నుండి మళ్లించి, అతని గర్వాన్ని అణచడం దేవుని ఉద్దేశమని ప్రధాన పాఠం సూచిస్తుంది.
  alternative: మనిషి పనినే అతని నుండి తొలగించి, మనిషి నుండి గర్వాన్ని కప్పివేయడం అని మరింత అక్షరార్థంగా గ్రహించవచ్చు.
  rationale: హెబ్రీ వాక్యం సంక్షిప్తంగా ఉండి రెండు విధాలుగా అన్వయించవచ్చు. యోబు 33:14–18 సందర్భం మనిషిని హానికరమైన కార్యం నుండి వెనక్కి తిప్పే భావానికి మద్దతిస్తుంది; అయితే ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలి. ‘కప్పివేయడం’ ద్వారా మూలంలోని రూపకం, ‘బలవంతుడు’ ద్వారా אָדָם/גֶּבֶר పదభేదం నిలుపబడ్డాయి.
