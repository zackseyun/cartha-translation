  yaml_path: translation/ot/job/033/022.yaml
  text: His soul draws near to the pit[b][a], and his life to those who bring death.
translation:
  language: te
  text: 'అతని ప్రాణం గోతికి[a] సమీపిస్తుంది;

    అతని జీవితం మరణం కలిగించేవారి వద్దకు[b] చేరుతుంది.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “సమాధికి,” లేదా “నాశనానికి.”
    reason: lexical_alternative
  - marker: b
    text: లేదా “మృతుల వద్దకు,” లేదా “మరణాన్ని తెచ్చే శక్తుల వద్దకు.” హీబ్రూ వ్యక్తీకరణ క్లిష్టమైనది; అది మరణం కలిగించే కర్తలను గానీ, మరణ లోకాన్ని లేదా మరణ శక్తులను గానీ సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּקְרַב
  choice: చేరువవుతుంది
  rationale: קרב అంటే ‘దగ్గరకు రావడం/సమీపించడం.’ రూపం కథన భూతకాలాన్ని సూచించగలిగినా, బాధపడుతున్న మనిషికి సాధారణంగా జరిగేదాన్ని వర్ణించే ఈ కావ్య సందర్భంలో వర్తమానకాలం సహజంగా ఉంది.
- source_word: לַשַּׁחַת
  choice: గోతికి
  rationale: שַׁחַת అనే పదానికి గొయ్యి, సమాధి, నాశనం అనే భావాలు ఉన్నాయి. ‘గోతి’ మూలంలోని స్పష్టమైన కావ్య రూపకాన్ని నిలుపుతూ, మరణ భావాన్ని పాఠకుడు గ్రహించడానికి వీలు కల్పిస్తుంది.
- source_word: נַפְשׁוֹ
  choice: అతని ప్రాణం
  rationale: נֶפֶשׁ అంటే ప్రాణం, జీవితం, వ్యక్తి లేదా అంతరంగ జీవి కావచ్చు. ఇక్కడ ‘ప్రాణం’ రెండో పాదంలోని ‘జీవితం’తో ఉన్న పదభేదాన్ని నిలుపుతుంది; అయితే దీనిని సాంకేతికమైన శరీర–ఆత్మ విభజనగా నిర్దేశించదు.
- source_word: וְחַיָּתוֹ
  choice: అతని జీవితం
  rationale: ఈ సందర్భంలో חַיָּה/חַיּוּת జీవితం లేదా సజీవ ఉనికిని సూచిస్తుంది. ‘అతని జీవితం’ సహజమైన తెలుగులో మరణానికి దగ్గరవుతున్న స్థితిని తెలియజేస్తుంది.
- source_word: לַמְמִתִים
  choice: మరణం కలిగించేవారి దగ్గరికి
  rationale: ఈ రూపాన్ని מות ధాతువు నుండి వచ్చిన, ‘మరణం కలిగించేవారు’ అనే క్రియాశీల భావంలో తీసుకున్నాం. ఇది కేవలం మానవ హంతకులు లేదా శిక్ష అమలు చేసేవారు అని అతిగా నిర్దిష్టం చేయకుండా మూలంలోని కర్తృభావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: נַפְשׁוֹ మరియు וְחַיָּתוֹ మధ్య మానవ స్వభావ సంబంధమైన కావ్య సమాంతరత
  choice: వాటిని వరుసగా ‘అతని ప్రాణం,’ ‘అతని జీవితం’ అని అనువదించి, కఠినమైన శరీర–ఆత్మ ద్వైతాన్ని సూచించకుండా ఉండడం.
  alternative: రెండింటినీ ‘అతని జీవితం,’ ‘అతని ఉనికి’ అని సమతలీకరించడం; లేదా ‘ప్రాణం’ను శరీరానికి వేరైన అభౌతిక భాగమని సాంకేతికంగా అర్థం చేయడం.
  rationale: ఈ వాక్యం కావ్యాత్మకమైన సమీపార్థ సమాంతరతను ఉపయోగిస్తుంది. అనువాదం పదాల మధ్య భేదాన్ని నిలుపుతుంది గాని మానవ నిర్మాణం గురించి పాఠం చెప్పనిదాన్ని సిద్ధాంతంగా చేర్చదు.
- issue: לַמְמִתִים సూచించే మరణ సంబంధ గమ్యం లేదా కర్తలు
  choice: ప్రధాన పాఠంలో ‘మరణం కలిగించేవారు’ అనే క్రియాశీల భావాన్ని ఉంచి, ఇతర సాధ్యార్థాలను పాదటిప్పణిలో ఇవ్వడం.
  alternative: ‘మృతులు’ అని లేదా మరణ లోకం/మరణ శక్తులు అని ప్రధాన పాఠంలో అనువదించడం.
  rationale: హీబ్రూ వ్యక్తీకరణ క్లిష్టమైనది. ప్రధాన పాఠం రూపంలోని క్రియాశీల శక్తిని కాపాడుతుంది; పాదటిప్పణి నిజమైన వ్యాఖ్యాన అనిశ్చితిని దాచకుండా తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గంభీరమైన కావ్య గద్యశైలిని ఉపయోగించాం. రెండు సమాంతర పాదాల్లో ‘ప్రాణం/జీవితం’ అనే భేదాన్ని నిలిపి, రెండో పాదంలో తెలుగుకు అవసరమైన క్రియను స్పష్టంగా చేర్చాం.
