  terminology: “ప్రాణం/జీవితం” preserves the lexical and poetic distinction without imposing a technical anthropology. “గోతి” retains the concrete ‘pit’ image, and “మరణం కలిగించేవారు” maintains the active participial interpretation of לממתים. The footnotes appropriately retain ‘grave/destruction’ and ‘dead/death-related powers’ as alternatives.
