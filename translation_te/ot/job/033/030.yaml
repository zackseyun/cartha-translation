translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కావ్యశైలిని ఉపయోగించాం. ‘గోతి’ మరియు ‘జీవపు వెలుగు’ అనే పరస్పర విరుద్ధ దృశ్యాలను నిలిపాం. మూలంలోని ఉద్దేశం/ఫలితం సంబంధం మరియు לֵאוֹר యొక్క అస్పష్టతను ప్రధాన పాఠ్యంలో ఒక సహజ రూపంతో, పాదటిప్పణిలో ప్రత్యామ్నాయాలతో భద్రపరిచాం.
