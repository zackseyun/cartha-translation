  edition: WLC
  text: לְ/הָשִׁ֣יב נַ֭פְשׁ/וֹ מִנִּי שָׁ֑חַת לֵ֝/א֗וֹר בְּ/א֣וֹר הַֽ/חַיִּים־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/033/030.yaml
  text: to bring back his soul from the pit[c][b][a], that he may be enlightened with the light of life.
translation:
  language: te
  text: 'అతని ప్రాణాన్ని గోతినుండి తిరిగి తీసుకురావడానికి,

    జీవపు వెలుగుతో అతనిని ప్రకాశింపజేయడానికి.[a][b][c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘అతని ప్రాణాన్ని’ అనే మాటకు ‘అతని జీవితాన్ని’ లేదా ‘అతనిని’ అని కూడా అనువదించవచ్చు. హీబ్రూ נֶפֶשׁ (నెఫెష్) అనే పదానికి ప్రాణం, జీవితం, వ్యక్తి అనే అర్థాలు ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘గోతినుండి’ అనే మాటకు ‘సమాధినుండి’ లేదా ‘నాశనం నుండి’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: ‘జీవపు వెలుగుతో అతనిని ప్రకాశింపజేయడానికి’ అనే మాటకు ‘వెలుగును చూసేలా చేయడానికి’ లేదా ‘వెలుగులోకి తీసుకురావడానికి’ అని కూడా అనువదించవచ్చు. హీబ్రూ వాక్యనిర్మాణం సంక్షిప్తమైనది, కావ్యాత్మకమైనది.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהָשִׁיב
  choice: తిరిగి రప్పించి
  rationale: שׁוב అనే ధాతువు హిఫీల్ రూపంలో కారణార్థకమైన తిరిగి రావడం లేదా పునరుద్ధరణను సూచిస్తుంది. ‘తిరిగి రప్పించి’ అనే అనువాదం ఆ స్పష్టమైన కారణార్థక భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: נַפְשׁוֹ
  choice: అతని ప్రాణాన్ని
  rationale: נפש అనే పదం ప్రాణం, జీవితం, వ్యక్తి లేదా ఆత్మను సూచించగలదు. మరణగోతి నుండి రక్షణ అనే సందర్భంలో ‘ప్రాణం’ సహజంగా ఉండి, జీవితం మరియు అంతరంగ వ్యక్తిత్వం రెండింటి భావాన్నీ మోస్తుంది.
- source_word: מִנִּי שָׁחַת
  choice: గోతిలోనుండి
  rationale: שחת కావ్య సందర్భాల్లో గోతి, సమాధి లేదా నాశనాన్ని సూచించగలదు. ‘గోతి’ మూలంలోని దృశ్యరూపాన్ని కాపాడి, ‘జీవపు వెలుగు’కు వ్యతిరేక చిత్రాన్ని నిలుపుతుంది.
- source_word: לֵאוֹר
  choice: వెలుగు పొందేలా చేయడానికి
  rationale: ఈ హీబ్రూ నిర్మాణం సంక్షిప్తంగా, కొంత అస్పష్టంగా ఉంది. ‘వెలుగు పొందేలా చేయడానికి’ అని అనువదించడం రక్షణ తరువాత వెలుగులోకి రావడం అనే ఉద్దేశం లేదా ఫలితాన్ని తెలిపి, אור పదమూలాన్ని కూడా నిలుపుతుంది.
- source_word: בְּאוֹר הַחַיִּים
  choice: జీవపు వెలుగులో
  rationale: בְּ ఉపసర్గ ఇక్కడ స్థితి, సాధనం లేదా సహవాస భావాన్ని ఇవ్వగలదు. ‘జీవపు వెలుగులో’ సహజమైన తెలుగు కావ్యరూపంగా ఉండి, హీబ్రూ పదబంధంలోని సంక్షిప్త చిత్రణను కాపాడుతుంది.
