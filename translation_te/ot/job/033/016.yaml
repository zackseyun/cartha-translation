translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన శైలి వాడబడింది. ‘చెవులు తెరవడం’ మరియు ‘ముద్ర వేయడం’ అనే మూలంలోని రూపకాలు నిలుపబడ్డాయి; మֹסָר పదంలోని అర్థ వైవిధ్యం పాదసూచికలో భద్రపరచబడింది.
