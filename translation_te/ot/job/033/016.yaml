  text: then he opens the ears of men and seals their instruction[a].
translation:
  language: te
  text: 'అప్పుడు ఆయన మనుషుల చెవులు తెరుస్తాడు,

    వారి ఉపదేశాన్ని వారిలో ముద్రిస్తాడు.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వారి హెచ్చరికను వారిలో ముద్రిస్తాడు,’ లేదా ‘వారి క్రమశిక్షణను వారిలో ముద్రిస్తాడు.’ హెబ్రీ పదం మוּסָר అంటే ఉపదేశం, దిద్దుబాటు, క్రమశిక్షణ, లేదా హెచ్చరిక అని అర్థం కావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: అప్పుడు
  rationale: మునుపటి వచనాల్లో చెప్పిన దేవుని సంభాషణకు కొనసాగింపుగా వచ్చే కాలక్రమాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: יִגְלֶה אֹזֶן
  choice: చెవులు తెరిచి
  rationale: అక్షరార్థంగా ‘చెవిని బయలుపరచడం’; వినడానికి, గ్రహించడానికి చెవిని తెరవడం అనే హెబ్రీ నుడికారాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: אֲנָשִׁים
  choice: మనుషుల
  rationale: ఇక్కడ సాధారణంగా మానవులను సూచించే బహువచనం; ఆధునిక తెలుగులో సహజంగా, మూలార్థానికి దగ్గరగా ఉంది.
- source_word: וּבְמֹסָרָם
  choice: వారికి ఇచ్చే ఉపదేశంపై
  rationale: మֹסָר/מוּסָר ఉపదేశం, దిద్దుబాటు, క్రమశిక్షణ లేదా హెచ్చరికను సూచించగలదు. సందర్భంలో దేవుడు వారికి అందించే బోధనాత్మక హెచ్చరిక అనే భావాన్ని ‘ఉపదేశం’ స్పష్టంగా తెలియజేస్తుంది; మూడవ పురుష బహువచన ప్రత్యయాన్ని తెలుగులో ‘వారికి ఇచ్చే’ అని సహజంగా వ్యక్తం చేసింది.
- source_word: יַחְתֹּם
  choice: ముద్ర వేస్తాడు
  rationale: חתם లోని ముద్రించే రూపకాన్ని నిలుపుతూ, ఉపదేశాన్ని వారిపై స్థిరపరచడం లేదా ధృవీకరించడం అనే భావానికి వీలు కల్పిస్తుంది.
