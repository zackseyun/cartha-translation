  text: Why do you contend against him, because he does not answer for all his words?
translation:
  language: te
  text: ఆయన తన మాటలన్నిటికీ[a] జవాబు చెప్పడని నీవు ఆయనతో ఎందుకు వాదిస్తున్నావు?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “తన మాటలన్నిటికీ” అని ఉన్న హీబ్రూ పదబంధాన్ని సందర్భాన్ని బట్టి “తన విషయాలన్నిటికీ” లేదా “తన కార్యాలన్నిటికీ” అని కూడా అనువదించవచ్చు.
    reason: דבר అనే పదానికి ‘మాట’తో పాటు ‘విషయం’ లేదా ‘కార్యం’ అనే సందర్భానుసార అర్థాలు కూడా ఉండవచ్చు.
lexical_decisions:
- source_word: רִיבוֹתָ
  choice: వాదిస్తున్నావు
  rationale: ఈ క్రియ ఇక్కడ దేవునితో వివాదపడడం లేదా ఆయనపై అభియోగం మోపడం అనే భావాన్ని ఇస్తుంది; ఆధునిక తెలుగులో ‘వాదిస్తున్నావు’ సహజంగా, నేరుగా ఉంది.
- source_word: דְּבָרָיו
  choice: తన మాటలన్నిటి గురించి
  rationale: דבר అనే పదానికి ‘మాట’, ‘విషయం’, ‘కార్యం’ అనే విస్తృత అర్థాలు ఉన్నాయి. ‘మాటలు’ మూలంలోని పదరూపాన్ని నిలుపుతుంది; ‘గురించి’ అనేది ענה భావంతో సహజమైన తెలుగు నిర్మాణాన్ని ఇస్తుంది.
- source_word: כִּי
  choice: …డని
  rationale: 'ఇక్కడ כִּי వాదనకు కారణాన్ని సూచిస్తుంది: ‘ఆయన జవాబు చెప్పడు కాబట్టి/అని’. ప్రశ్నతో సహజంగా కలిసే తెలుగులో ‘…డని’గా అందించబడింది.'
- source_word: יַעֲנֶה
  choice: జవాబు చెప్పడని
  rationale: ענה యొక్క సాధారణ అర్థం ‘సమాధానం ఇవ్వడం’; ఈ సందర్భంలో ‘జవాబు చెప్పడం’ స్పష్టమైన, సహజమైన తెలుగు.
theological_decisions:
- issue: దేవుడు తన మాటలు లేదా విషయాలన్నిటి గురించి జవాబు చెప్పకపోవడం
  choice: తన మాటలన్నిటి గురించి ఆయన జవాబు చెప్పడని
  alternative: ఆయన తన కార్యాలన్నిటికీ లెక్క చెప్పడని
  rationale: మూలవాక్యంలోని గట్టి ప్రశ్నను మృదువుపరచకుండా ఉంచింది. అదే సమయంలో דבר యొక్క ‘మాటలు/విషయాలు/కార్యాలు’ అనే అర్థవిస్తృతిని పాదటిప్పణిలో గుర్తించింది; దేవుడు ఎవరికీ లెక్క చెప్పనవసరం లేదనే వ్యాఖ్యానాన్ని ప్రధాన పాఠ్యంలోకి దిగుమతి చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనా సాధారణ పాఠకులకు స్పష్టంగా ఉండే ప్రశ్నారూపం. దేవునిని సూచించే ‘ఆయన’కు గౌరవ ఏకవచనం వాడబడింది; ‘నీవు’ మూలంలోని ఏకవచన సంబోధనను నిలుపుతుంది.
