source:
  edition: WLC
  text: אַ֭ךְ אָמַ֣רְתָּ בְ/אָזְנָ֑/י וְ/ק֖וֹל מִלִּ֣ין אֶשְׁמָֽע׃
base_translation:
  language: en
  yaml_path: translation/ot/job/033/008.yaml
  text: 'Surely you have spoken in my hearing[a], and I have heard the sound of your words:'
translation:
  language: te
  text: 'నిశ్చయంగా, నీవు నాకు వినిపించేలా మాట్లాడావు[a]; నీ మాటల ధ్వని నేను విన్నాను:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ అక్షరార్థం: “నీవు నా చెవుల్లో చెప్పావు; మాటల ధ్వని నేను వింటాను.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: నిశ్చయంగా
  rationale: ఇక్కడ ఈ పదం పరిమితిని సూచించే ‘మాత్రమే’ అనే అర్థంలో కాక, యోబు పలికిన మాటలను ఎలీహు ప్రస్తావించడానికి వాడిన నొక్కిచెప్పే అవ్యయంగా ఉంది.
- source_word: אָמַרְתָּ
  choice: నీవు ... మాట్లాడావు
  rationale: ద్వితీయ పురుష ఏకవచన సంపూర్ణ క్రియ గతంలో పలికిన మాటను సూచిస్తుంది; ఆధునిక తెలుగులో ‘మాట్లాడావు’ సహజంగా ఉంది.
- source_word: בְאָזְנָי
  choice: నాకు వినిపించేలా
  rationale: అక్షరార్థంగా ‘నా చెవుల్లో’ అయినా, హీబ్రూ శ్రవణ నుడికారాన్ని సహజమైన తెలుగులో ఇలా వ్యక్తం చేశాం; అక్షరార్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: וְקוֹל
  choice: ధ్వని
  rationale: קוֹל అనే పదానికి ‘స్వరం’ లేదా ‘ధ్వని’ అనే అర్థాలు రావచ్చు. ‘మాటల ధ్వని’ మూలంలోని శ్రవణ చిత్రాన్ని నిలుపుతుంది.
- source_word: מִלִּין
  choice: నీ మాటల
  rationale: అరామీయ శైలిగల ఈ బహువచన రూపానికి ‘మాటలు’ అని అర్థం. ఎవరి మాటలో సందర్భం స్పష్టమైనందున తెలుగులో సహజత్వం కోసం ‘నీ’ చేర్చాం.
- source_word: אֶשְׁמָע
  choice: నేను విన్నాను
  rationale: రూపరీత్యా అసంపూర్ణ క్రియ అయినప్పటికీ, ముందు పలికిన యోబు మాటలను ఎలీహు విన్నాడనే గత సందర్భంలో సంపూర్ణ శ్రవణాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన వాక్య నిర్మాణం వాడాం. ‘నీవు’ అనే ఏకవచన సంబోధనను నిలిపి, మూలంలోని పునరుక్త శ్రవణ చిత్రాన్ని ‘వినిపించేలా’ మరియు ‘ధ్వని ... విన్నాను’ ద్వారా సాధ్యమైనంతవరకు కాపాడాం.
