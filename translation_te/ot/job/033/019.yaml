revisions:
- from: 'అతడు తన మంచం మీద నొప్పితో సరిదిద్దబడతాడు;

    అతని ఎముకల్లో పోరాటం ఎడతెగకుండా ఉంటుంది.[a]'
  to: 'అతడు కూడా తన పడకపై నొప్పితో దిద్దుబాటు పొందుతాడు;

    అతని ఎముకల్లో ఎడతెగని పోరాటం ఉంటుంది.[a]'
  rationale: The revision explicitly reflects the additive conjunction, uses a more precise Telugu expression for corrective reproof, and adopts a register-appropriate term for the bed. It retains the audit trail’s reading of רִיב as bodily “strife/conflict” and preserves the lexical ambiguity of אֵתָן in the footnote.
  reviewer_model: gpt-5.6-terra
