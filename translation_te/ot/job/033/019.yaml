  text: וְ/הוּכַ֣ח בְּ֭/מַכְאוֹב עַל מִשְׁכָּב֑/וֹ ו/ריב עֲצָמָ֣י/ו אֵתָֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/033/019.yaml
  text: He is also reproved with pain on his bed[a], and with continual strife in his bones,
translation:
  language: te
  text: 'అతడు కూడా తన పడకపై నొప్పితో దిద్దుబాటు పొందుతాడు;

    అతని ఎముకల్లో ఎడతెగని పోరాటం ఉంటుంది.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతని ఎముకల్లో బలమైన పోరాటం ఉంటుంది.” హీబ్రూ విశేషణం ‘ఎడతెగని/నిలకడైన’ లేదా ‘బలమైన’ అనే అర్థాన్ని ఇవ్వవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּכַח
  choice: సరిదిద్దబడతాడు
  rationale: יכח ధాతువు హొఫాల్ రూపం గద్దింపు, దిద్దుబాటు లేదా క్రమశిక్షణకు లోనవడాన్ని సూచిస్తుంది. ఇక్కడ కేవలం శిక్షించబడటం అనే భావాన్ని రుద్దకుండా, బాధ ద్వారా వ్యక్తి సరిదిద్దబడుతున్న భావాన్ని నిలుపుతుంది. ముందు వచనంతో అనుసంధానించే וְ భావం సందర్భంలో సహజంగా కొనసాగుతుంది.
- source_word: בְּמַכְאוֹב
  choice: నొప్పితో
  rationale: מַכְאוֹב శారీరక నొప్పి లేదా బాధను సూచిస్తుంది; సాధనార్థక בְּ భావాన్ని ‘తో’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: עַל מִשְׁכָּבוֹ
  choice: తన మంచం మీద
  rationale: మంచాన పడిన స్థితిలో బాధ అనుభవించడాన్ని నేరుగా, సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: וְרִיב
  choice: పోరాటం
  rationale: רִיב యొక్క ప్రాథమిక భావం కలహం, వివాదం లేదా పోరాటం. ఎముకలతో కలిసినప్పుడు శరీరంలోని తీవ్రమైన అంతర్గత సంఘర్షణకు రూపకంగా ఉంది; ‘పోరాటం’ ఆ రూపకాన్ని నిలుపుతుంది.
- source_word: עֲצָמָיו
  choice: అతని ఎముకల్లో
  rationale: మూలంలోని ‘అతని ఎముకలు’ అనే స్పష్టమైన శారీరక చిత్రాన్ని నిలుపుతూ, తెలుగులో పోరాటం జరిగే అంతర్గత స్థానాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אֵתָן
  choice: ఎడతెగకుండా ఉంటుంది
  rationale: אֵתָן ఇక్కడ నిలకడగా, నిరంతరంగా కొనసాగేదనే భావాన్ని ఇవ్వవచ్చు. ‘ఎడతెగకుండా’ బాధ యొక్క విడవని స్వభావాన్ని సహజంగా తెలియజేస్తుంది; ‘బలమైన’ అనే సాధ్యమైన అర్థాన్ని పాదసూచికలో ఉంచాం.
theological_decisions:
- issue: బాధ దైవిక దిద్దుబాటుగా పనిచేసే స్వభావం
  choice: బాధ ద్వారా వ్యక్తి సరిదిద్దబడుతున్నాడని చెప్పే కర్తృరహిత ప్రయోగాన్ని నిలుపడం
  alternative: ఇది పూర్తిగా శిక్షాత్మక తీర్పని లేదా కేవలం సహజ అనారోగ్యమని స్పష్టీకరించడం
  rationale: ఎలీహూ వాదనలో బాధ దేవుడు మనిషితో వ్యవహరించే సాధనంగా కనిపిస్తుంది. అయితే ఈ వచనం ప్రతిఫల సిద్ధాంతాన్ని పూర్తిగా నిర్వచించదు. అందువల్ల ‘శిక్షించబడతాడు’ కంటే ‘సరిదిద్దబడతాడు’ అని అనువదించి మూలంలోని దిద్దుబాటు భావాన్నీ, వేదాంతపరమైన ఉద్రిక్తతనూ నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా గంభీరమైన, సహజమైన వాక్యనిర్మాణం. ‘ఎముకల్లో పోరాటం’ అనే మూల రూపకాన్ని వివరణాత్మకంగా మార్చకుండా నిలిపాం.
