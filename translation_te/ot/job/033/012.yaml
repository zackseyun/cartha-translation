id: JOB.33.12
reference: Job 33:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: הֶן זֹ֣את לֹא צָדַ֣קְתָּ אֶעֱנֶ֑/ךָּ כִּֽי יִרְבֶּ֥ה אֱ֝ל֗וֹהַ מֵ/אֱנֽוֹשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/033/012.yaml
  text: Look[a], in this you are not right; I will answer you, for God is greater than man.
translation:
  language: te
  text: ఇదిగో, ఈ విషయంలో నీవు సరైనవాడివి కాదు; నేను నీకు ప్రత్యుత్తరం ఇస్తాను, ఎందుకంటే దేవుడు మనిషికంటే[a] గొప్పవాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మర్త్యునికంటే.” హీబ్రూ אֱנוֹשׁ అనే పదం తరచుగా మానవుని బలహీనతను, మరణశీలతను నొక్కిచెబుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶן
  choice: ఇదిగో
  rationale: శ్రద్ధను బలంగా ఆకర్షించే సంభాషణ అవ్యయంగా ఉంది; ఆధునిక గౌరవప్రదమైన తెలుగులో ‘ఇదిగో’ దాని ఉద్ఘాటనను సహజంగా నిలుపుతుంది.
- source_word: זֹאת
  choice: ఈ విషయంలో
  rationale: ఈ సూచన సర్వనామం ముందున్న వాదనలోని విషయాన్ని సూచిస్తోంది; తెలుగులో ‘ఈ విషయంలో’ సందర్భార్థాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: לֹא צָדַקְתָּ
  choice: నీవు సరైనవాడివి కావు
  rationale: ఇక్కడ צדק విస్తృత నైతిక నీతిని కాక, వాదనలో సరి కావడాన్ని సూచిస్తుంది.
- source_word: אֶעֱנֶךָּ
  choice: నేను నీకు జవాబిస్తాను
  rationale: ప్రథమ పురుష ఏకవచన అసంపూర్ణ క్రియతో ద్వితీయ పురుష ఏకవచన ప్రత్యయం, ఎలీహు ఇవ్వబోయే ప్రత్యుత్తరాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: తదుపరి వాక్యం ఎలీహు జవాబుకు కారణాన్ని ఇస్తోంది; ‘ఎందుకంటే’ ఆ కారణ సంబంధాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: יִרְבֶּה
  choice: గొప్పవాడు
  rationale: מן తో కూడిన רבה ఇక్కడ సంఖ్యను కాక తులనాత్మక మహత్తును లేదా ఆధిక్యాన్ని సూచిస్తుంది.
- source_word: אֱלוֹהַ
  choice: దేవుడు
  rationale: ఏకవచన దైవపదానికి సందర్భానుకూలమైన సూటి తెలుగు సమానార్థకం.
- source_word: מֵאֱנוֹשׁ
  choice: నరునికంటే
  rationale: אֱנוֹשׁ ఏకవచన సామాన్యార్థంలో బలహీనమైన మానవుణ్ణి సూచిస్తుంది; ‘నరుడు’ దేవుడు–మనిషి మధ్యనున్న అలంకారిక వ్యత్యాసాన్ని, మూలంలోని పుంలింగ ఏకవచన రూపాన్ని నిలుపుతుంది.
theological_decisions:
- issue: אֱנוֹשׁ అనే మానవపదం అనువాదం
  choice: నరుడు
  alternative: మర్త్యుడు / మానవుడు
  rationale: హీబ్రూ పదం బలహీనతకు లోబడిన మానవుణ్ణి ఏకవచన సామాన్యార్థంలో దేవునితో పోలుస్తోంది. ప్రధాన పాఠంలో ‘నరుడు’ మూలరూపపు వ్యత్యాసాన్ని నిలుపుతుండగా, ‘మర్త్యుడు’ అనే భావ ఛాయను పాదటిప్పణి తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘నీవు’ అనే ఏకవచన సంబోధన మూలంలోని ద్వితీయ పురుష ఏకవచనాన్ని నిలుపుతుంది; కారణార్థక כִּי ను సహజమైన ‘ఎందుకంటే’తో వ్యక్తం చేశాం.
