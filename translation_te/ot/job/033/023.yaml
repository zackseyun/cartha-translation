source:
  edition: WLC
  text: אִם יֵ֤שׁ עָלָ֨י/ו מַלְאָ֗ךְ מֵלִ֗יץ אֶחָ֥ד מִנִּי אָ֑לֶף לְ/הַגִּ֖יד לְ/אָדָ֣ם יָשְׁרֽ/וֹ־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/033/023.yaml
  text: If there is for him an angel[a], a mediator, one among a thousand, to declare to man his uprightness[b],
translation:
  language: te
  text: అతని పక్షంగా ఒక దేవదూత[a], ఒక మధ్యవర్తి—వెయ్యిమందిలో ఒక్కడు—మనిషికి ఏది సరైనదో తెలియజేయడానికి ఉంటే,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఒక దూత, ఒక వివరణకర్త’; లేదా ‘ఒక దూత, ఒక మధ్యవర్తి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם יֵשׁ
  choice: ఉంటే
  rationale: షరతును సూచించే אִםతో పాటు అస్తిత్వాన్ని తెలిపే יֵשׁ భావాన్ని సహజమైన తెలుగు షరతు నిర్మాణంలో కలిపి వ్యక్తం చేస్తుంది.
- source_word: עָלָיו
  choice: అతని పక్షంగా
  rationale: ఆ వ్యక్తి తరఫున లేదా అతని మేలు కోసం ఆ మధ్యవర్తి వ్యవహరిస్తున్న భావాన్ని తెలియజేస్తుంది; కేవలం ‘అతని మీద’ అనే స్థలార్థాన్ని అనవసరంగా ముందుకు తేవదు.
- source_word: מַלְאָךְ
  choice: దేవదూత
  rationale: ఈ సందర్భంలో పరలోక మధ్యవర్తి ఉద్దేశించబడ్డాడనే సంభావ్యతకు ఇది సరిపోతుంది. అయితే మూలపదానికి సాధారణ ‘దూత’ అనే అర్థమూ ఉన్నందున దానిని పాదసూచికలో నిలిపాం.
- source_word: מֵלִיץ
  choice: మధ్యవర్తి
  rationale: మరొకరి తరఫున మాట్లాడే, వివరించే లేదా మధ్యవర్తిత్వం చేసే వ్యక్తి భావాన్ని విస్తృతంగా అందిస్తుంది; ‘వివరణకర్త’ అనే అర్థసంభావ్యతను పాదసూచికలో ఉంచాం.
- source_word: אֶחָד מִנִּי אָלֶף
  choice: వెయ్యిమందిలో ఒక్కడు
  rationale: అసాధారణ అరుదును సూచించే హీబ్రూ ప్రయోగాన్ని తెలుగులో సహజంగా, మూలానికి దగ్గరగా వ్యక్తం చేస్తుంది.
- source_word: לְהַגִּיד
  choice: తెలియజేయడానికి
  rationale: మధ్యవర్తి చేసే కార్యపు ఉద్దేశాన్ని తెలిపే క్రియారూపం; ‘ప్రకటించడానికి’ కంటే సాధారణ పాఠకునికి సహజంగా ఉండి, చెప్పడం లేదా వివరించడం అనే భావపరిధిని నిలుపుతుంది.
- source_word: לְאָדָם
  choice: మనిషికి
  rationale: ఇక్కడ אָדָם ఒక వ్యక్తిగత మానవుణ్ణి సూచిస్తుంది; తెలుగు సందర్భంలో సహజమైన ఏకవచన రూపాన్ని వాడాం.
- source_word: יָשְׁרוֹ
  choice: అతని యథార్థతను
  rationale: ישר మూలంలోని నిటారుతనం, సరైనతనం, యథార్థత అనే భావాన్ని మరియు పురుష ఏకవచన ప్రత్యయాన్ని దగ్గరగా నిలుపుతుంది. ‘అతనికి ఏది సరైనదో’ అనే సందర్భోచిత అర్థాన్ని పాదసూచికలో ఇచ్చాం.
theological_decisions:
- issue: מַלְאָךְ מֵלִיץ అనే వ్యక్తి గుర్తింపు, పాత్ర
  choice: ‘ఒక దేవదూత, ఒక మధ్యవర్తి’ అని సాధారణంగానే అనువదించాం; అతణ్ణి మరింత నిర్దిష్టంగా గుర్తించలేదు.
  alternative: మానవ దూత లేదా వివరణకర్త; ప్రత్యేకమైన పరలోక మధ్యవర్తి లేదా విజ్ఞాపనకర్త.
  rationale: వచనం మధ్యవర్తిత్వ పాత్రను సూచించినా, ఆ వ్యక్తి గుర్తింపును ఈ పదాలకు మించి స్పష్టపరచదు. అందువల్ల అభివృద్ధి చెందిన దేవదూతల సిద్ధాంతాన్నిగానీ క్రీస్తుసంబంధ ప్రత్యేక వ్యాఖ్యానాన్నిగానీ అనువాదంలో చేర్చలేదు.
- issue: יָשְׁרוֹలోని ప్రత్యయం, భావం
  choice: ‘అతని యథార్థతను’ అని, ప్రత్యయం మనిషిని సూచిస్తున్నట్లు ప్రధాన పాఠంలో ఉంచాం.
  alternative: ‘అతనికి ఏది సరైనదో’—అంటే అతని విషయంలో సరైన మార్గం లేదా కర్తవ్యం.
  rationale: హీబ్రూ రూపం వ్యక్తి యథార్థతను గానీ అతనికి తగిన సరైన మార్గాన్ని గానీ సూచించవచ్చు. ప్రధాన పాఠం రూపసామ్యాన్ని కాపాడగా, పాదసూచిక భావార్థాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సులభంగా అర్థమయ్యే శైలిని వాడాం. దీర్ఘమైన షరతు వాక్యాన్ని స్పష్టంగా చదవడానికి మధ్యవర్తి పదబంధాన్ని డాష్‌ల మధ్య ఉంచాం. వాక్యం తరువాతి వచనంలో పూర్తయ్యే షరతు నిర్మాణం కాబట్టి చివర కామాను నిలిపాం.
