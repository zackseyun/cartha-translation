translation:
  language: te
  text: నీకు చెప్పడానికి ఏమైనా మాటలు ఉంటే, నాకు జవాబివ్వు; మాట్లాడు, ఎందుకంటే నిన్ను సరైనవాడిగా నిరూపించాలని నేను కోరుతున్నాను.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నిన్ను నిర్దోషిగా నిరూపించాలని” లేదా “నీ పక్షం న్యాయమైనదని సమర్థించాలని.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם יֵשׁ מִלִּין
  choice: నీకు చెప్పడానికి ఏమైనా మాటలు ఉంటే
  rationale: అస్తిత్వార్థకమైన యֵשׁ మరియు ‘మాటలు’ అనే מִלִּין కలయికను ఆధునిక తెలుగులో సహజమైన షరతుగా వ్యక్తపరుస్తూ, ప్రతివాదం చెప్పడానికి ఉన్న అవకాశాన్ని నిలుపుతుంది.
- source_word: הֲשִׁיבֵנִי
  choice: నాకు జవాబివ్వు
  rationale: హిఫిల్ ఆజ్ఞారూపానికి సందర్భానుసారమైన ‘జవాబివ్వు/ప్రత్యుత్తరమివ్వు’ భావాన్ని నేరుగా, సహజంగా అందిస్తుంది.
- source_word: דַּבֵּר
  choice: మాట్లాడు
  rationale: ప్రత్యక్ష ఆజ్ఞ యొక్క సంక్షిప్త బలాన్ని నిలుపుతుంది.
- source_word: כִּי חָפַצְתִּי
  choice: ఎందుకంటే ... నేను కోరుతున్నాను
  rationale: כִּי ఇచ్చే కారణార్థాన్ని, חפץ తెలిపే హృదయపూర్వక కోరికను స్పష్టమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: צַדְּקֶךָ
  choice: నీవు నిర్దోషివని చూపాలని
  rationale: ఇక్కడ צדק రూపం యోబు పక్షం సరైనదని లేదా అతడు నిర్దోషి అని నిరూపించాలనే ఎలీహూ కోరికను సూచిస్తుంది; ‘నీతిమంతునిగా తీర్చడం’ అనే సిద్ధాంతపరమైన అదనపు భావాన్ని రుద్దకుండా సందర్భార్థాన్ని అందిస్తుంది.
theological_decisions:
- issue: צַדְּקֶךָ యొక్క న్యాయ/నీతిసంబంధ భావం
  choice: నీవు నిర్దోషివని చూపాలని
  alternative: నీవు సరైనవాడివని నిరూపించాలని; నీ పక్షం న్యాయమైనదని సమర్థించాలని
  rationale: ఇది దేవుని ఎదుట సిద్ధాంతపరమైన నీతీకరణను ప్రకటించడం కాదు; యోబు సమాధానం చెప్పగలిగితే అతని పక్షమే సరైనదని చూపాలనే ఎలీహూ మాట. ప్రధాన పాఠం సందర్భానికి సహజమైన అర్థాన్ని ఇస్తుంది; అసలు పదంలోని ‘సరైనవాడిగా ప్రకటించడం/సమర్థించడం’ అనే పరిధిని పాదసూచికలో నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన సంభాషణ శైలి. ఎలీహూ ఇచ్చే ప్రత్యక్ష ఆహ్వానంలోని వరుస ఆజ్ఞలను నిలిపి, צדק పదానికి సంబంధించిన సందర్భోచిత న్యాయార్థం మరియు ప్రత్యామ్నాయాలను సంరక్షించాం.
