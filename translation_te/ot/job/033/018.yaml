translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, కవితాత్మక సమాంతరతను నిలుపుతూ సాధారణ పాఠకులకు సహజంగా అర్థమయ్యే గంభీర శైలి ఉపయోగించబడింది. ‘ప్రాణం/జీవితం’ అనే జంట మూలంలోని సమాంతర పదాలను ప్రతిబింబిస్తుంది; రెండో పాదంలోని క్లిష్టమైన హెబ్రీ ప్రయోగానికి ప్రధాన పాఠ్యంలో భావానువాదం, పాదసూచికలో అక్షరార్థ ప్రత్యామ్నాయం ఇవ్వబడింది.
