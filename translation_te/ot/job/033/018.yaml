  language: en
  yaml_path: translation/ot/job/033/018.yaml
  text: He spares his soul from the pit[c][b][a], and his life from passing by the weapon.
translation:
  language: te
  text: 'అతని ప్రాణాన్ని గోతిలో పడకుండా[a],

    అతని జీవితాన్ని ఆయుధం చేత నశించకుండా[b][c] కాపాడుతాడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘గోతి’కి బదులుగా ‘సమాధి’ లేదా ‘నాశనం’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడి హెబ్రీ పదం మరింత నిర్దిష్టంగా ‘బాణం’, ‘విసిరే ఆయుధం’ లేదా బహుశా ‘ఖడ్గం’ను సూచించవచ్చు; ఈ పాదం హింసాత్మక మరణం నుండి కాపాడబడడాన్ని తెలియజేస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: మరింత అక్షరార్థంగా, ‘ఆయుధంలోకి దాటిపోకుండా’ అని అనువదించవచ్చు.
    reason: source_ambiguity
lexical_decisions:
- source_word: יַחְשֹׂךְ
  choice: కాపాడుతాడు
  rationale: חשׂך హిఫీల్ రూపం ‘వెనక్కి ఉంచడం, అడ్డుకోవడం, కాపాడడం’ అనే భావాన్ని ఇస్తుంది. మరణం నుండి రక్షించే సందర్భంలో ‘కాపాడుతాడు’ సహజమైన తెలుగు ప్రయోగం; ‘పడకుండా/నశించకుండా’ అనే నిర్మాణం నిరోధ భావాన్ని నిలుపుతుంది.
- source_word: נַפְשׁוֹ
  choice: అతని ప్రాణాన్ని
  rationale: נפש ఇక్కడ వ్యక్తి ప్రాణం లేదా జీవాన్ని సూచిస్తుంది. రెండో పాదంలోని חיהతో ఉన్న కవితాత్మక సమాంతరతను నిలుపుతూ ‘ప్రాణం’ అని అనువదించబడింది.
- source_word: מִנִּי שָׁחַת
  choice: నాశనపు గోతిలో పడకుండా
  rationale: שׁחת ‘గోతి’, ‘సమాధి’ లేదా ‘నాశనం’ అనే భావాలను కలిగి ఉంది. ‘నాశనపు గోతి’ మరణలోకానికి సంబంధించిన స్పష్టమైన కవితా చిత్రాన్ని, అలాగే నాశన భావాన్ని నిలుపుతుంది.
- source_word: וְחַיָּתוֹ
  choice: అతని జీవితాన్ని
  rationale: חיה నుండి వచ్చిన ఈ రూపం సందర్భంలో వ్యక్తి జీవాన్ని సూచిస్తుంది. మొదటి పాదంలోని ‘ప్రాణం’తో కవితాత్మక సమాంతరత కోసం ‘జీవితం’ ఎంచుకోబడింది.
- source_word: מֵעֲבֹר
  choice: నశించకుండా
  rationale: עבר యొక్క మూలార్థం ‘దాటడం/వెళ్లడం’. అయితే בַּשֶּׁלַחతో కలిసిన ఈ సందర్భంలో ఆయుధం ద్వారా హింసాత్మక మరణానికి గురికాకుండా నిరోధించడమే భావం. సహజమైన తెలుగులో ‘నశించకుండా’ అని ఇవ్వగా, చలనాన్ని ప్రతిబింబించే అక్షరార్థ ప్రత్యామ్నాయం పాదసూచికలో నిలుపబడింది.
- source_word: בַּשָּׁלַח
  choice: ఆయుధం చేత
  rationale: שׁלח ఇక్కడ బాణం, విసిరే ఆయుధం లేదా ఖడ్గం వంటి హింసాత్మక సాధనాన్ని సూచించవచ్చు. ఖచ్చితమైన ఆయుధం సందిగ్ధంగా ఉన్నందున విస్తృతమైన ‘ఆయుధం’ అనే పదం ఎంచుకోబడింది; ‘చేత’ దాని సాధనార్థక సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
