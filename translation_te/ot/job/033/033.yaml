lexical_decisions:
- source_word: אִם אַיִן
  choice: లేకపోతే
  rationale: ముందటి వాక్యంలో యోబుకు జవాబు చెప్పమని ఇచ్చిన ఆహ్వానానికి విరుద్ధమైన షరతును ఈ పదబంధం సూచిస్తుంది. సంక్షిప్తమైన ‘లేకపోతే’ ఆ షరతు భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: שְׁמַע לִי
  choice: నా మాట విను
  rationale: לִיతో కూడిన שׁמע, మాట్లాడుతున్న వ్యక్తివైపు శ్రద్ధగా వినడాన్ని సూచిస్తుంది. ‘నా మాట విను’ ఆజ్ఞార్థాన్ని సహజంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: הַחֲרֵשׁ
  choice: మౌనంగా ఉండు
  rationale: חרש ధాతువు నుండి వచ్చిన ఈ ఆజ్ఞ ఇక్కడ మాట్లాడకుండా ఉండమని చెబుతుంది. ‘మౌనంగా ఉండు’ నేరుగా, గౌరవప్రదంగా ఉంది.
- source_word: וַאֲאַלֶּפְךָ
  choice: నేను నీకు జ్ఞానం నేర్పుతాను
  rationale: పియేల్ రూపంలోని אלף బోధించడం లేదా నేర్పించడం అనే అర్థం ఇస్తుంది. ఆజ్ఞల తరువాతి అసంపూర్ణ క్రియను ఇక్కడ భవిష్యత్ ఫలితంగా సహజంగా వ్యక్తం చేశాం.
- source_word: חָכְמָה
  choice: జ్ఞానం
  rationale: חָכְמָה జ్ఞానసాహిత్యంలో ప్రామాణికంగా ‘జ్ఞానం’ అనే భావాన్ని సూచిస్తుంది; సందర్భం దానిని విస్తరించి చెప్పవలసిన అవసరం లేదు.
