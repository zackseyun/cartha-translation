  text: יֶעְתַּ֤ר אֶל אֱל֨וֹהַּ וַ/יִּרְצֵ֗/הוּ וַ/יַּ֣רְא פָּ֭נָי/ו בִּ/תְרוּעָ֑ה וַ/יָּ֥שֶׁב לֶ֝/אֱנ֗וֹשׁ צִדְקָתֽ/וֹ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/033/026.yaml
  text: He prays to God[a], and he accepts him; he sees his face with a shout of joy[c][b], and he restores to man his righteousness.
translation:
  language: te
  text: అతడు దేవుణ్ణి వేడుకుంటాడు[a]; దేవుడు అతణ్ణి అనుకూలంగా స్వీకరిస్తాడు. అతడు ఆనందధ్వనితో ఆయన ముఖాన్ని చూస్తాడు[b]. దేవుడు ఆ మనిషికి అతని నీతిని తిరిగి ఇస్తాడు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దేవునికి మనవి చేస్తాడు.’ హీబ్రూ క్రియ ప్రార్థనలో గాఢంగా వేడుకోవడాన్ని సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: అంటే, అతడు దేవుని ముఖాన్ని చూస్తాడు. హీబ్రూలో అక్షరార్థంగా ‘అతని ముఖాన్ని’ అని మాత్రమే ఉంది.
    reason: alternative_reading
  - marker: c
    text: లేదా, ‘అతని సరైన స్థితిని’ లేదా ‘అతని నిర్దోషిత్వ నిర్ధారణను.’ ఇక్కడ ‘నీతి’ దేవుని ఎదుట తిరిగి పొందిన సరైన స్థితిని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶעְתַּר
  choice: వేడుకుంటాడు
  rationale: עתר దేవునికి చేసే గాఢమైన ప్రార్థన లేదా విన్నపాన్ని సూచిస్తుంది. ‘వేడుకుంటాడు’ దాని earnest pleading భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: אֶל אֱלוֹהַּ
  choice: దేవుణ్ణి
  rationale: אֱלוֹהַּ యోబులో దేవునికి వాడే ఏకవచన కవితాత్మక పదం. మూలంలో లేని ‘సర్వశక్తిమంతుడు’ వంటి విశేషణాన్ని చేర్చలేదు.
- source_word: וַיִּרְצֵהוּ
  choice: దేవుడు అతణ్ణి అనుగ్రహంతో అంగీకరిస్తాడు
  rationale: רצה ఇక్కడ ప్రార్థించే మనిషిని దేవుడు అనుకూలంగా స్వీకరించడాన్ని సూచిస్తుంది. తెలుగులో కర్త మార్పు స్పష్టంగా ఉండేందుకు ‘దేవుడు’ను వ్యక్తపరిచాం; ‘అనుగ్రహంతో’ అనుకూల స్వీకరణ భావాన్ని అందిస్తుంది.
- source_word: וַיַּרְא פָּנָיו
  choice: అతడు ఆయన ముఖాన్ని చూస్తాడు
  rationale: సందర్భం ప్రకారం పునరుద్ధరించబడిన మనిషి దేవుని ముఖాన్ని చూడటం అత్యంత సహజమైన పఠనం. ‘ఆయన’ ద్వారా సూచిత వ్యక్తిని స్పష్టం చేసినా, గమనికలో హీబ్రూ సంక్షిప్తతను తెలిపాం.
- source_word: בִּתְרוּעָה
  choice: ఆనందధ్వనితో
  rationale: תְּרוּעָה ఆనందం లేదా విజయంతో కూడిన బిగ్గర ధ్వనిని సూచిస్తుంది. ‘ఆనందధ్వనితో’ స్వరపూర్వకమైన ఉల్లాసాన్ని సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: וַיָּשֶׁב
  choice: తిరిగి ఇస్తాడు
  rationale: שוב హిఫిల్ రూపం ఇక్కడ తిరిగి కలుగజేయడం లేదా పునరుద్ధరించడం అనే కారణార్థక భావాన్ని కలిగిస్తుంది.
- source_word: לֶאֱנוֹשׁ
  choice: ఆ మనిషికి
  rationale: אֱנוֹשׁ మర్త్య మానవుణ్ణి సూచిస్తుంది. సందర్భంలోని నిర్దిష్ట వ్యక్తిని సహజంగా కొనసాగించేందుకు ‘ఆ మనిషికి’ అని అనువదించాం.
- source_word: צִדְקָתוֹ
  choice: అతని నీతిని
  rationale: צדקה యొక్క ప్రత్యక్ష సమానార్థం ‘నీతి’. ఇది సరైన స్థితి లేదా నిర్దోషిత్వ నిర్ధారణను కూడా సూచించవచ్చు; ప్రధాన పాఠంలో ‘నీతి’ ఉంచడం ద్వారా అర్థ విస్తృతిని కాపాడాం.
theological_decisions:
- issue: ‘అతణ్ణి అంగీకరిస్తాడు; అతడు ఆయన ముఖాన్ని చూస్తాడు’ అనే వరుసలో సర్వనామాల సూచన
  choice: దేవుడు ప్రార్థించే మనిషిని అంగీకరిస్తాడు; ఆ మనిషి దేవుని ముఖాన్ని చూస్తాడు.
  alternative: దేవుడు మనిషి ముఖాన్ని చూస్తాడు; లేదా, తక్కువ సంభావ్యతతో, మనిషి దేవుణ్ణి అనుకూలంగా స్వీకరిస్తాడు.
  rationale: సమీప సందర్భం మనిషి దేవుని వైపు తిరిగి, దైవానుగ్రహం మరియు పునరుద్ధరణ పొందడాన్ని వివరిస్తుంది. దేవుని ముఖాన్ని చూడటం పునరుద్ధరించబడిన సహవాసానికి సహజమైన వాక్ప్రయోగం; అయినా హీబ్రూలోని సర్వనామ సంక్షిప్తతను గమనికలో నిలిపాం.
- issue: ‘అతని నీతి’ అనే పదబంధం యొక్క భావం
  choice: మనిషికి చెందిన నీతి లేదా తిరిగి పొందిన సరైన స్థితి.
  alternative: మనిషి నిర్దోషిత్వ నిర్ధారణ; లేదా దేవుడు తన స్వంత నీతిని మనిషికి ఇస్తాడనే పఠనం.
  rationale: ప్రత్యయం అత్యంత సహజంగా మనిషిని సూచిస్తుంది. ‘అతని నీతి’ అనే మూలపద రూపాన్ని నిలుపుతూ, తరువాతి కాలపు ప్రత్యేక సిద్ధాంతాన్ని వచనంలోకి చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కవితాత్మక గద్యశైలిని వాడాం. హీబ్రూ సర్వనామాల అస్పష్టతను ప్రధాన పాఠంలో సందర్భానుసారంగా స్పష్టం చేసి, నిజమైన ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో నిలిపాం. అన్ని పాదటిప్పణి సూచికలు ప్రధాన పాఠంలో ఉన్నాయి.
