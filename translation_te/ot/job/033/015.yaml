  source_fidelity: 'ముసాయిదా మూలంలోని ప్రధాన భావాలను సరిగ్గా ఇస్తుంది: కల, రాత్రి దర్శనం, మనుష్యులపై పడే గాఢనిద్ర, పడకపై కునుకులు. అయితే చివరి హెబ్రీయ పదబంధం బִּתְנוּמוֹת עֲלֵי מִשְׁכָּב (‘పడకపై కునుకుల్లో’) కాల ఉపవాక్యం కాదు. ‘వారు ... ఉన్నప్పుడు’ అని మార్చడం మూలంలో లేని క్రియను, కాలసంబంధ నిర్మాణాన్ని జోడిస్తుంది.'
  naturalness: ‘కలలో, రాత్రి దర్శనంలో’ మరియు ‘మనుష్యుల మీద గాఢనిద్ర పడినప్పుడు’ ఆధునిక ప్రామాణిక తెలుగులో సహజంగా ఉన్నాయి. చివరి భాగాన్ని ‘పడకపై కునుకుల్లో—’గా ఉంచితే కవితాత్మక సమాంతరత, మూలంలోని అసంపూర్ణ కొనసాగింపు రెండూ మరింత స్పష్టంగా ఉంటాయి.
