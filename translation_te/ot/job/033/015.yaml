  text: In a dream[a], a vision of the night, when deep sleep falls on men, in slumbers on the bed,
translation:
  language: te
  text: కలలో, రాత్రి దర్శనంలో, మనుష్యుల మీద గాఢనిద్ర పడినప్పుడు, పడకపై కునుకుల్లో—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּחֲלוֹם
  choice: కలలో
  rationale: ב־ ఉపసర్గ కలను దేవుడు తెలియజేసే సందర్భం లేదా మాధ్యమంగా చూపుతుంది; తెలుగులో ‘కలలో’ సహజంగా ఉండి మూలంలోని సంక్షిప్తతను నిలుపుతుంది.
- source_word: חֶזְיוֹן לַיְלָה
  choice: రాత్రి దర్శనంలో
  rationale: ‘రాత్రి యొక్క దర్శనం’ అనే నిర్మాణార్థాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తూ, ‘కలలో’తో ఉన్న కవితాత్మక సమాంతరతను కాపాడుతుంది.
- source_word: בִּנְפֹל
  choice: పడినప్పుడు
  rationale: ב־తో కూడిన క్రియానామ రూపం కాలసంబంధ ఉపవాక్యాన్ని పరిచయం చేస్తుంది; ‘పడినప్పుడు’ మూలంలోని రూపకాన్ని, కాలభావాన్ని రెండింటినీ నిలుపుతుంది.
- source_word: תַּרְדֵּמָה
  choice: గాఢనిద్ర
  rationale: ఇది సాధారణ నిద్రకన్నా లోతైన నిద్రను సూచిస్తుంది; ‘గాఢనిద్ర’ స్పష్టమైనది, పారవశ్య స్థితి అనే అదనపు అర్థాన్ని రుద్దదు.
- source_word: עַל אֲנָשִׁים
  choice: మనుష్యుల మీద
  rationale: אֲנָשִׁים ఇక్కడ సాధారణంగా మానవులను సూచిస్తుంది. తెలుగు ‘మనుష్యులు’ సహజంగానే సమగ్రార్థాన్ని ఇస్తూ, ‘మీద’ ద్వారా עַל‌ను ప్రతిబింబిస్తుంది.
- source_word: בִּתְנוּמוֹת
  choice: కునుకుల్లో
  rationale: మూలంలోని బహువచన రూపాన్ని తెలుగులోని సహజ బహువచనంతో నిలుపుతూ, తేలికపాటి లేదా వరుస నిద్రమత్తు స్థితులను సూచిస్తుంది.
- source_word: עֲלֵי מִשְׁכָּב
  choice: పడకపై
  rationale: ‘పడక మీద’ అనే మూలార్థాన్ని సంక్షిప్తమైన, సహజమైన తెలుగులో ఇస్తుంది; మూలంలో లేని స్వామ్యసూచకాన్ని జోడించదు.
theological_decisions:
- issue: אֲנָשִׁים యొక్క లింగసంబంధ సాధారణార్థం
  choice: మనుష్యులు
  alternative: పురుషులు
  rationale: ఈ సందర్భంలో హెబ్రీయ masculine plural రూపం పురుషులను మాత్రమే కాక మానవులను సాధారణంగా సూచిస్తుంది. తెలుగు ‘మనుష్యులు’ మూలంలోని సమగ్ర సూచనను ఖచ్చితంగా అందిస్తుంది; ‘పురుషులు’ అనవసరంగా అర్థాన్ని పరిమితం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కవితాత్మక శైలి. మూలపాఠం తదుపరి వచనంలో కొనసాగుతున్న అసంపూర్ణ వాక్యభావాన్ని చివరి దీర్ఘవిరామంతో నిలిపాం. ‘వారు’ను తెలుగు వాక్యస్పష్టత కోసం చేర్చాం; అది కొత్త సమాచారాన్ని జోడించకుండా ‘మనుష్యులు’నే తిరిగి సూచిస్తుంది.
