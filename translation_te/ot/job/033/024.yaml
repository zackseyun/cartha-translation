source:
  edition: WLC
  text: וַ/יְחֻנֶּ֗/נּוּ וַ/יֹּ֗אמֶר פְּ֭דָעֵ/הוּ מֵ/רֶ֥דֶת שָׁ֗חַת מָצָ֥אתִי כֹֽפֶר׃
base_translation:
  language: en
  yaml_path: translation/ot/job/033/024.yaml
  text: then he is gracious to him and says[a], ‘Deliver him from going down to the pit[b]; I have found a ransom.’
translation:
  language: te
  text: 'అప్పుడు అతడు అతనిపై దయచూపి ఇలా అంటాడు: “అతడు గోతిలోకి దిగిపోకుండా అతన్ని విడిపించు; నేను విమోచన మూల్యాన్ని కనుగొన్నాను[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘విమోచన మూల్యం’ అనే హీబ్రూ పదానికి ‘విమోచన వెల,’ ‘పరిహార మూల్యం,’ లేదా సందర్భానుసారం ‘ప్రాయశ్చిత్త మూల్యం’ అనే అర్థాలు కూడా ఉండవచ్చు. ‘గోతి’ సమాధిని, మరణాన్ని లేదా నాశనాన్ని కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחֻנֶּנּוּ
  choice: అప్పుడు అతడు అతనిపై కరుణ చూపి
  rationale: חנן అనుగ్రహం, దయ, కరుణ చూపడాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘కరుణ చూపి’ సహజంగా ఉండి, కేవలం జాలి అనే భావానికి పరిమితం కాదు.
- source_word: וַיֹּאמֶר
  choice: ఇలా అంటాడు
  rationale: వావ్-కన్సెక్యూటివ్ కథన క్రమాన్ని సందర్భానుకూలమైన సజీవ వర్తమాన రూపంలో తెలిపి, ప్రత్యక్ష వాక్యాన్ని సహజంగా పరిచయం చేస్తుంది.
- source_word: פְּדָעֵהוּ
  choice: అతన్ని విడిపించు
  rationale: פדה విమోచించడం, వెల చెల్లించి విడిపించడం, లేదా రక్షించడం అనే పరిధి కలిగిన పదం. తరువాతి כֹפֶר మూల్య భావాన్ని స్పష్టంగా ఇస్తున్నందున, క్రియలోనే సాంకేతిక ప్రాయశ్చిత్త భావాన్ని చొప్పించకుండా ‘విడిపించు’ అని అనువదించబడింది.
- source_word: מֵרֶדֶת
  choice: దిగిపోకుండా
  rationale: מן తో కూడిన ירד క్రియానామం దిగడాన్ని నిరోధించే భావాన్ని ఇస్తుంది; ‘దిగిపోకుండా’ తెలుగులో సంక్షిప్తంగా, సహజంగా అదే భావాన్ని అందిస్తుంది.
- source_word: שָׁחַת
  choice: గోతిలోకి
  rationale: שחת గోతిని సూచిస్తూ సమాధి, మరణం, నాశనం అనే అంతర్భావాలను కూడా కలిగి ఉండవచ్చు. ‘గోతి’ దృశ్యరూపకాన్ని నిలుపుతుంది; విస్తృత భావం పాదటిప్పణిలో ఇవ్వబడింది.
- source_word: מָצָאתִי
  choice: నాకు దొరికింది
  rationale: మొదటి పురుష ఏకవచన పరిపూర్ణ క్రియ. ‘నాకు దొరికింది’ కనుగొనబడిన మూల్యం ఇప్పుడు అందుబాటులో ఉందనే ఫలిత భావాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: כֹפֶר
  choice: విడుదలకు మూల్యం
  rationale: כֹפֶר ఒకరిని విడుదల చేయడానికి ఇచ్చే వెల, పరిహారం, లేదా విమోచన మూల్యాన్ని సూచిస్తుంది. ‘విడుదలకు మూల్యం’ సందర్భంలోని విడుదల భావాన్ని స్పష్టంగా ఉంచుతూ, తరువాతి సిద్ధాంతపరమైన అర్థాలను బలవంతంగా చేర్చదు.
theological_decisions:
- issue: ఎలీహూ మాటల్లో כֹפֶר యొక్క భావం
  choice: విడుదలకు మూల్యం
  alternative: ప్రాయశ్చిత్త మూల్యం; పరిహారం; కప్పివేత
  rationale: ఈ వచనం గోతిలోకి దిగకుండా ఒక వ్యక్తిని విడిపించడానికి లభించిన ఆధారాన్ని చెబుతుంది. ‘విడుదలకు మూల్యం’ విడుదలను సాధించే ధర అనే సూటి భావాన్ని కాపాడుతుంది; ప్రాయశ్చిత్త సంబంధమైన విస్తృత ప్రతిధ్వనులను ప్రధాన పాఠ్యంలో నిర్ణయాత్మకంగా మోపకుండా పాదటిప్పణిలో నిలుపుతుంది.
- issue: וַיְחֻנֶּנּוּ మరియు וַיֹּאמֶר యొక్క కర్త
  choice: మునుపటి వచనంలోని మధ్యవర్తి/దూతను సూచించే ‘అతడు’
  alternative: దేవుడే ప్రత్యక్ష కర్త
  rationale: సమీప వాక్యనిర్మాణంలో 23వ వచనంలోని దూత లేదా మధ్యవర్తి సాధ్యమైన కర్త. అయితే సందర్భంలో దేవుని కార్యం కూడా భావించబడవచ్చు. అనువాదం హీబ్రూ సర్వనామంలోని అస్పష్టతను ‘అతడు’ ద్వారా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. హీబ్రూ వాక్యంలోని కర్త అస్పష్టతను నిలుపుతూ, ‘గోతి’ అనే రూపకాన్ని ప్రధాన పాఠ్యంలో కాపాడి, כֹפֶר యొక్క విమోచన/ప్రాయశ్చిత్త అర్థ పరిధిని పాదటిప్పణిలో తెలిపింది.
