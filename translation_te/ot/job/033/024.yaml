    issue: మָצָאתִי యొక్క అనువాదం
    rationale: ‘నాకు దొరికింది’ అంటే ‘నాకు లభించింది’ అనే భావం ప్రధానంగా వస్తుంది. హీబ్రూ మָצָאתִי క్రియ కర్త చేసిన ‘కనుగొనడం’ను వ్యక్తం చేస్తుంది. కాబట్టి ‘నేను విమోచన మూల్యాన్ని కనుగొన్నాను’ అని అనువదించాలి.
  - severity: low
