    rationale: ‘విడుదలకు మూల్యం’ భావపరంగా సాధ్యమైనప్పటికీ, నామవాచకమైన כֹפֶר యొక్క విమోచన/పరిహార మూల్య భావాన్ని ‘విమోచన మూల్యం’ మరింత నేరుగా తెలియజేస్తుంది.
