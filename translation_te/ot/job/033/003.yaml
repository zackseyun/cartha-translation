  text: The uprightness of my heart is in my words[a], and my lips speak knowledge clearly.
translation:
  language: te
  text: నా హృదయపు నిష్కపటత నా మాటల్లో ఉంది; నా పెదవులు జ్ఞానాన్ని స్పష్టంగా పలుకుతాయి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నా పెదవులు స్వచ్ఛమైన జ్ఞానాన్ని పలుకుతాయి,’ లేదా ‘నా పెదవులు తమకు తెలిసినదాన్ని సూటిగా పలుకుతాయి.’ ‘స్పష్టంగా’ అని అనువదించిన హీబ్రూ పదానికి స్వచ్ఛత లేదా సూటితనం అనే భావాలు కూడా ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹשֶׁר
  choice: యథార్థత
  rationale: ఈ నామవాచకం సూటితనం, నిజాయితీ, నైతిక నిష్కపటత అనే భావాలను కలిగి ఉంది. సందర్భంలో ఏలీహూ తన అంతరంగ ఉద్దేశపు నిజాయితీని చెబుతున్నందున ‘యథార్థత’ సహజంగా సరిపోతుంది.
- source_word: לִבִּי
  choice: నా హృదయ
  rationale: హీబ్రూ పదం ఆలోచన, సంకల్పం సహా అంతరంగ వ్యక్తిని సూచిస్తుంది. ‘హృదయం’ మూలభాషలోని మానవశాస్త్రీయ రూపకాన్ని నిలుపుతుంది.
- source_word: אֲמָרָי
  choice: నా మాటల్లో
  rationale: ఈ బహువచన నామవాచకం ఏలీహూ పలికే మాటలను సూచిస్తుంది. స్థలార్థక నిర్మాణం హీబ్రూ వాక్యనిర్మాణాన్ని సాధ్యమైనంత దగ్గరగా ప్రతిబింబిస్తుంది.
- source_word: וְדַעַת
  choice: జ్ఞానాన్ని
  rationale: ఇది పెదవులు పలికే విషయాన్ని సూచిస్తుంది. ‘జ్ఞానం’ ప్రత్యక్షమైన, సహజమైన సమానార్థకం.
- source_word: שְׂפָתַי
  choice: నా పెదవులు
  rationale: మాటకు ప్రతీకగా వాడిన ‘పెదవులు’ అనే కవితాత్మక రూపాన్ని అలాగే ఉంచి, ‘హృదయం’తో ఉన్న సమాంతరతను కాపాడుతుంది.
- source_word: בָּרוּר
  choice: స్పష్టంగా
  rationale: ఈ రూపం స్పష్టత లేదా స్వచ్ఛతను సూచించగలదు. మాటల సందర్భంలో ‘స్పష్టంగా’ సహజంగా ఉన్నప్పటికీ, ‘స్వచ్ఛమైన జ్ఞానం’ అనే భావసాధ్యతను పాదసూచికలో నిలిపాం.
- source_word: מִלֵּלוּ
  choice: పలుకుతాయి
  rationale: కవితాత్మక సందర్భంలో పెదవులు మాటలాడడాన్ని ‘పలుకు’ సహజంగా వ్యక్తం చేస్తుంది. సంపూర్ణ క్రియారూపం ఇక్కడ తక్షణ స్వవివరణగా వర్తమానార్థంలో అనువదించబడింది.
