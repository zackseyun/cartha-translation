translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కవితాత్మక శైలి. హృదయం–పెదవులు, మాటలు–జ్ఞానం అనే హీబ్రూ సమాంతరతను నిలిపి, మొదటి పాదంలోని సంక్షిప్త మూల వాక్యనిర్మాణాన్ని అతిగా వివరణాత్మకం చేయకుండా అనువదించాం.
