  text: But now[a], Job, please hear my words, and listen to all my speech.
translation:
  language: te
  text: అయితే ఇప్పుడు, యోబూ, దయచేసి నా మాటలు విను; నా మాటలన్నిటినీ శ్రద్ధగా ఆలకించు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ మూలంలో ‘నా మాటలు’ మరియు ‘నా మాటలన్నీ’ అనే సమీపార్థక పదబంధాలతో పాటు, వినడాన్ని సూచించే రెండు వేర్వేరు క్రియలు నొక్కిచెప్పడానికి వాడబడ్డాయి. రెండవ భాగాన్ని ‘నా మాటలన్నిటికీ చెవియొగ్గు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאוּלָם
  choice: అయితే ఇప్పుడు
  rationale: ఎలీహు ప్రసంగంలో స్పష్టమైన మలుపును సూచించే సంధాన భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: שְׁמַע נָא
  choice: దయచేసి ... విను
  rationale: ఆజ్ఞారూపాన్ని నָא మర్యాదపూర్వక విజ్ఞప్తిగా మృదువు చేస్తుంది; తెలుగు వాక్యనిర్మాణానికి అనుగుణంగా పదాల క్రమం మార్చబడింది.
- source_word: אִיּוֹב
  choice: యోబూ
  rationale: ప్రత్యక్ష సంబోధనను తెలుగులో సహజమైన సంబోధన రూపంతో చూపిస్తుంది.
- source_word: מִלָּי
  choice: నా మాటలు
  rationale: మొదటి వ్యక్తి ఏకవచన ప్రత్యయంతో ఉన్న బహువచన నామవాచకానికి నేరమైన, సహజమైన అనువాదం.
- source_word: וְכָל דְּבָרַי
  choice: నేను చెప్పేదంతా
  rationale: כָּל యొక్క సమగ్ర భావాన్ని నిలుపుతూ, మునుపటి ‘నా మాటలు’తో ఉన్న సమీప సమాంతరతను సహజ తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: הַאֲזִינָה
  choice: శ్రద్ధగా ఆలకించు
  rationale: కేవలం వినడమే కాక చెవియొగ్గి శ్రద్ధగా వినాలనే హిఫిల్ ఆజ్ఞారూప భావాన్ని తెలియజేస్తుంది.
