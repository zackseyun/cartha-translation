  yaml_path: translation/ot/job/033/031.yaml
  text: Pay attention[a], Job; listen to me. Be silent[b], and I will speak.
translation:
  language: te
  text: యోబూ, శ్రద్ధగా విను; నా మాట విను. మౌనంగా ఉండు, నేను మాట్లాడతాను.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַקְשֵׁב
  choice: శ్రద్ధగా విను
  rationale: קשׁב హిఫీల్ ఆజ్ఞారూపం సాధారణంగా వినడం కంటే శ్రద్ధపెట్టి వినమనే బలాన్ని తెలియజేస్తుంది; ఆధునిక తెలుగులో ‘శ్రద్ధగా విను’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: אִיּוֹב
  choice: యోబూ
  rationale: వ్యక్తి పేరును ప్రామాణిక తెలుగు రూపంలో ఇచ్చి, ప్రత్యక్ష సంబోధనను సూచించేందుకు సంబోధన విభక్తి ‘యోబూ’ వాడబడింది.
- source_word: שְׁמַע לִי
  choice: నా మాట విను
  rationale: שׁמע + לి ఇక్కడ మాట్లాడుతున్న వ్యక్తివైపు ఉద్దేశించిన వినికిడిని సూచిస్తుంది. ‘నా మాట విను’ సహజమైన తెలుగు ప్రయోగం; మూలంలోని ‘నాకు/నన్ను విను’ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: הַחֲרֵשׁ
  choice: మౌనంగా ఉండు
  rationale: חרשׁ ఆజ్ఞారూపం ఇక్కడ మాట్లాడకుండా ఉండమనే అర్థంలో ఉంది. ‘మౌనంగా ఉండు’ గౌరవప్రదమైన ఆధునిక తెలుగు, ప్రత్యక్ష ఆజ్ఞ బలాన్ని నిలుపుతుంది.
- source_word: וְאָנֹכִי
  choice: నేను
  rationale: וְ తో కూడిన బలప్రదమైన మొదటి పురుష సర్వనామం. తెలుగు వాక్యంలో ‘నేను’ను స్పష్టంగా ఉంచడం ఆ వ్యక్తి మీదున్న స్వల్ప ఉద్ఘాటనను కాపాడుతుంది; సంధర్భానుసారంగా సంధిని విరామచిహ్నంతో సహజీకరించాం.
- source_word: אֲדַבֵּר
  choice: మాట్లాడతాను
  rationale: דבר పియేల్ అసంపూర్ణ రూపం ఇక్కడ వెంటనే అనుసరించబోయే ఉద్దేశిత చర్యను సూచిస్తుంది. ‘మాట్లాడతాను’ ఆధునిక తెలుగులో సహజంగా ఆ భావాన్ని అందిస్తుంది.
