translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ప్రత్యక్ష సంభాషణ శైలి వాడబడింది. రెండు సమీప వినికిడి ఆజ్ఞల మధ్య తేడాను ‘శ్రద్ధగా విను’ మరియు ‘నా మాట విను’గా నిలిపాం. మూలంలో ప్రచురణకు అవసరమైన ముఖ్యమైన అర్థసందిగ్ధత లేకపోవడంతో పాదటిప్పణులు చేర్చలేదు.
