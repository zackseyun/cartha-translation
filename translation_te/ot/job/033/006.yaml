  terminology: దేవుని ఎదుట, నీ తరఫున, మట్టి, and మలచబడినవాడిని are suitable modern-standard Telugu. “చిటికిపట్టి” preserves the concrete shaping/pinching image without asserting a specific mechanism of creation.
