  yaml_path: translation/ot/job/033/006.yaml
  text: Look[a], I am like your mouthpiece before God[b]; I too was pinched off from clay.
translation:
  language: te
  text: 'చూడు, దేవుని ఎదుట నేను నీ తరఫున మాట్లాడేవాడిని[a];

    నేనూ మట్టినుంచి చిటికిపట్టి మలచబడినవాడినే[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “దేవునికి/దేవుని ఎదుట నీ నోరులా.” దీన్ని “దేవుని ఎదుట నీ తరఫున మాట్లాడేవాడిలా,” “దేవుని విషయంలో నీ కోరిక ప్రకారం,” లేదా “దేవుని ఎదుట నీతో సమానంగా” అని అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
  - marker: b
    text: లేదా, “నేనూ మట్టితో రూపుదిద్దబడ్డాను.” హీబ్రూ క్రియ మట్టిని చిటికిపట్టి విడదీయడం లేదా చేతితో ఆకారమివ్వడం వంటి భావాన్ని కలిగిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: చూడు
  rationale: శ్రోత దృష్టిని బలంగా ఆకర్షించే సంభాషణ సూచకం. ఆధునిక తెలుగులో సహజంగా ఉండి, మూలంలోని ఉద్ఘాటనను నిలుపుతుంది.
- source_word: כְפִיךָ לָאֵל
  choice: దేవుని ఎదుట నేను నీ తరఫున మాట్లాడే నోరులా
  rationale: మూలంలో సంక్షిప్తంగా ‘దేవునికి/దేవుని ఎదుట నీ నోరులా’ ఉంది. సందర్భంలో యోబు తరఫున మాట్లాడే మానవ ప్రతినిధి భావాన్ని ప్రధాన పాఠంలో సహజంగా వ్యక్తం చేస్తూ, వేరే సాధ్యార్థాలను పాదసూచికలో ఉంచాం.
- source_word: מֵחֹמֶר
  choice: మట్టినుంచి
  rationale: חֹמֶר అనేది మట్టి లేదా బంకమట్టిని సూచిస్తుంది. ఇక్కడ ఉమ్మడి మానవ సృష్టిమూలాన్ని తెలియజేస్తుంది; సాధారణ పాఠకునికి ‘మట్టి’ సహజం.
- source_word: קֹרַצְתִּי
  choice: చిటికిపట్టి మలచబడినవాడినే
  rationale: క్రియలో మట్టిని చిటికిపట్టి విడదీయడం లేదా చేతితో ఆకారమివ్వడం వంటి స్పర్శాత్మక చిత్రం ఉంది. ‘మలచబడ్డాను’ కంటే ఈ రూపం ఆ చిత్రాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: גַם אֲנִי
  choice: నేనూ
  rationale: ఎలీహూ కూడా యోబులాగే మట్టితో చేయబడిన మానవుడేనని నొక్కిచెప్పే అదనపు భావాన్ని సంక్షిప్తంగా అందిస్తుంది.
theological_decisions:
- issue: ఎలీహూ తనకూ యోబుకూ, దేవునికీ మధ్య ఉన్న సంబంధాన్ని ఎలా వర్ణిస్తున్నాడు
  choice: ఎలీహూ దేవుని ఎదుట యోబు తరఫున మాట్లాడగల మానవ ప్రతినిధిగా తనను చూపుతున్నాడు; వెంటనే తానూ మట్టితో చేయబడినవాడినని చెప్పి ఉమ్మడి మానవత్వాన్ని నొక్కిచెబుతున్నాడు.
  alternative: ‘దేవుని విషయంలో నీ కోరిక ప్రకారం ఉన్నవాడిని’ లేదా ‘దేవుని ఎదుట నీలాంటి వాడిని’ అని అర్థం చేసుకోవచ్చు.
  rationale: ‘నీ నోరులా’ అనే మూలపదబంధం సంక్షిప్తమైనది, బహుళార్థసాధ్యమైనది. రెండవ పాదం ఎలీహూకు దైవిక స్థాయి ఉందని కాక, అతడు యోబులాంటి సృష్టించబడిన మానవుడేనని స్పష్టం చేస్తుంది; అందువల్ల ప్రధాన పాఠం ప్రతినిధి భావాన్ని ఇస్తూ ఇతర అర్థాలను పాదసూచికలో నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకునికి అర్థమయ్యే సంభాషణ శైలి. క్లిష్టమైన హీబ్రూ పదబంధాన్ని ప్రధాన పాఠంలో సహజంగా అందించి, దాని నిజమైన అర్థసందిగ్ధతను పాదసూచికలో సంరక్షించాం.
