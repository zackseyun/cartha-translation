  text: Look now[a], I have opened my mouth; my tongue speaks in my palate.
translation:
  language: te
  text: 'ఇదిగో, ఇప్పుడు[a] నేను నా నోరు తెరిచాను;

    నా నాలుక నా అంగిటిలో పలుకుతోంది.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఇదిగో, దయచేసి విను; నేను నా నోరు తెరిచాను; నా నాలుక నా నోటిలో పలుకుతోంది.” చివరి పాదంలోని హీబ్రూ వ్యక్తీకరణ ఎంతో సజీవంగా, కొంత అసాధారణంగా ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: ఇదిగో
  rationale: తరువాత చెప్పబోయే మాటపై శ్రోత దృష్టిని నిలిపే సూచక అవ్యయంగా సహజమైన, గంభీరమైన తెలుగు రూపం.
- source_word: נָא
  choice: ఇప్పుడు
  rationale: ఇక్కడ మర్యాదపూర్వక విన్నపం కంటే మాటపై తక్షణ శ్రద్ధ కోరే ప్రయోగం; అందువల్ల ‘ఇప్పుడు’ సందర్భోచితం. ‘దయచేసి’ అనే భావమూ సాధ్యమేనని పాదసూచికలో ఉంచాం.
- source_word: פָּתַחְתִּי פִי
  choice: నేను నా నోరు తెరిచాను
  rationale: మాట్లాడడం ప్రారంభించడాన్ని సూచించే హీబ్రూ నుడికారాన్ని దాని సజీవ శరీరాంగ చిత్రణతోనే నిలిపింది.
- source_word: דִּבְּרָה
  choice: పలుకుతోంది
  rationale: అసాధారణ రూపాన్ని ‘నా నాలుక’ అనే కర్తతో వర్తమానంగా గ్రహించి, మొదటి పాదానికి సమాంతరంగా సాగుతున్న ప్రస్తుత వాక్కును వ్యక్తం చేసింది; కాలరూపాన్ని అనవసరంగా గతంలో స్థిరపరచలేదు.
- source_word: לְשׁוֹנִי
  choice: నా నాలుక
  rationale: మాటకు ప్రతినిధిగా వచ్చిన శరీరాంగ రూపకాన్ని అక్షరార్థంగా నిలిపి, ‘నా నోరు’తో ఉన్న కవితా సమాంతరతను కాపాడింది.
- source_word: בְחִכִּי
  choice: నా అంగిటిలో
  rationale: חֵךְ సూచించే నోటి పైభాగం/అంగిటి అనే స్పష్టమైన శరీరాంగ చిత్రాన్ని కాపాడింది; సాధారణీకరించిన ‘నా నోటిలో’ కంటే మూలానికి దగ్గరగా ఉంది.
