source:
  edition: WLC
  text: זַ֥ךְ אֲנִ֗י בְּֽלִ֫י פָ֥שַׁע חַ֥ף אָנֹכִ֑י וְ/לֹ֖א עָוֺ֣ן לִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/job/033/009.yaml
  text: ‘I am pure[a], without transgression; I am clean[b], and there is no iniquity in me.’
translation:
  language: te
  text: '‘నేను నిర్మలుడను, అతిక్రమం లేనివాడను;

    నేను నిర్దోషిని[a], నాలో ఏ దోషమూ లేదు[b].’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘శుద్ధుడను’; חַף అనే హీబ్రూ పదం శుభ్రతను లేదా అపరాధం లేకపోవడాన్ని సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘నాలో ఏ దుర్మార్గమూ లేదు’; עָוֺן అనే హీబ్రూ పదం తప్పును, అపరాధాన్ని లేదా దోషభారాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: זַךְ
  choice: నిర్మలుడను
  rationale: ఈ విశేషణం నైతిక శుద్ధతను లేదా కల్మషం లేకపోవడాన్ని సూచిస్తుంది. తరువాతి חַףతో పదభేదాన్ని నిలుపుతూ, ఆధునిక తెలుగులో సహజంగా ఉండేందుకు ‘నిర్మలుడను’ ఎంచుకున్నాం.
- source_word: בְּלִי פָשַׁע
  choice: అతిక్రమం లేనివాడను
  rationale: בְּלִי ‘లేకుండా’ అనే భావాన్ని, פֶּשַׁע నైతిక-న్యాయపరమైన అతిక్రమం లేదా తిరుగుబాటును సూచిస్తుంది. సందర్భాన్ని మించి ప్రత్యేక ఒడంబడిక భావాన్ని చేర్చకుండా ‘అతిక్రమం లేనివాడను’ అని అనువదించాం.
- source_word: חַף
  choice: నిర్దోషిని
  rationale: ఈ పదం శుభ్రంగా ఉండడం లేదా అపరాధం నుంచి విముక్తిగా ఉండడం అనే భావాలను కలిగి ఉంటుంది. ఇక్కడ వ్యక్తి తన నిరపరాధిత్వాన్ని ప్రకటిస్తున్నందున ‘నిర్దోషిని’ సహజంగా, స్పష్టంగా ఉంది; ‘నిర్మలుడను’తో అనవసర పునరుక్తినీ నివారిస్తుంది.
- source_word: עָוֺן
  choice: దోషం
  rationale: עָוֺן దుర్మార్గం, అపరాధం, దాని వల్ల కలిగే దోషభారం అనే భావాలను సూచించగలదు. తెలుగు ‘దోషం’ నైతిక తప్పు మరియు అపరాధభారం రెండింటికీ అవకాశం ఉంచి మూలంలోని భావవిస్తృతిని కాపాడుతుంది.
- source_word: לִי
  choice: నాలో
  rationale: అక్షరార్థంగా ‘నాకు’ అయినా, నైతిక స్థితి తనలో లేదని చెప్పే తెలుగు వాక్యనిర్మాణంలో ‘నాలో’ సహజంగా ఉంటుంది.
theological_decisions:
- issue: ఏలీహు ఉటంకిస్తున్న యోబు స్వీయ ప్రకటన ఎంత బలమైనది?
  choice: మూలంలోని ప్రత్యక్షమైన, బలమైన నైతిక శుద్ధత ప్రకటనను తగ్గించకుండా లేదా మరింత తీవ్రం చేయకుండా అనువదించాం.
  alternative: ‘నేను నిర్మలుడనని భావిస్తున్నాను’ అని ప్రకటనను బలహీనపరచడం, లేదా మూలంలో ఉన్నదానికంటే మించి సంపూర్ణ పాపరాహిత్య సిద్ధాంతంగా వివరించడం.
  rationale: హీబ్రూ వాక్యం ‘నేను నిర్మలుడను... నేను నిర్దోషిని’ అని ప్రత్యక్షంగా, emphatic స్వీయ ప్రకటన చేస్తుంది. అది నిజమా కాదా అనే సిద్ధాంతపరమైన తీర్పును అనువాదంలో చేర్చకుండా ఆ ఉద్రిక్తతను అలాగే ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన ప్రత్యక్ష వాక్యశైలి వాడబడింది. సమాంతర హీబ్రూ నిర్మాణాన్ని రెండు పాదాలుగా నిలిపి, ‘నిర్మలుడను’ మరియు ‘నిర్దోషిని’ ద్వారా మూలంలోని సమీపార్థక పదాల భేదాన్ని సాధ్యమైనంతవరకు కాపాడాం.
