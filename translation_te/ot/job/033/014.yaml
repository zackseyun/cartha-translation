  yaml_path: translation/ot/job/033/014.yaml
  text: For God speaks in one way[a], and in two, though one does not perceive it.
translation:
  language: te
  text: 'ఎందుకంటే దేవుడు ఒక విధంగా[a] మాట్లాడతాడు,

    రెండు విధాలుగా కూడా మాట్లాడతాడు;

    అయినా మనిషి దానిని గ్రహించడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దేవుడు ఒకసారి, రెండుసార్లు మాట్లాడతాడు; అయినా మనిషి దానిని గమనించడు.” హీబ్రూ సంఖ్యలను “ఒకసారి… రెండుసార్లు” అని కాలసూచకంగా లేదా “ఒక విధంగా… రెండు విధాలుగా” అని పద్ధతులను సూచించేలా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ఎలీహు ముందటి మాటకు వివరణను అందించే కారణార్థక సంబంధాన్ని సహజమైన తెలుగులో చూపిస్తుంది.
- source_word: בְאַחַת
  choice: ఒక విధంగా
  rationale: స్త్రీలింగ సంఖ్యావాచకంతో కూడిన ఈ ప్రయోగం ‘ఒకసారి’ అని కాలసంఖ్యను గానీ, ‘ఒక విధంగా’ అని పద్ధతిని గానీ సూచించవచ్చు. ప్రధాన పాఠంలో సందర్భానుకూలమైన విధానార్థాన్ని ఎంచుకుని, నిజమైన సందిగ్ధతను పాదటిప్పణిలో ఉంచాం.
- source_word: יְדַבֶּר
  choice: మాట్లాడతాడు
  rationale: Piel imperfect ఇక్కడ దేవుని సాధారణ లేదా అలవాటైన క్రియను తెలుపుతుంది; తెలుగు వర్తమానకాల రూపం ఆ సార్వత్రిక భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אֵל
  choice: దేవుడు
  rationale: אֵל అనే సాధారణ దైవపదవికి అదనపు విశేషార్థాన్ని చేర్చకుండా నేరుగా సమానార్థక పదాన్ని వాడాం.
- source_word: וּבִשְׁתַּיִם
  choice: మరో విధంగా కూడా
  rationale: ‘రెండులో’ అనే అక్షరార్థ సంఖ్యా నిర్మాణాన్ని తెలుగులో సహజంగా పునరుత్పత్తి చేయడం కష్టమైనందున, సమాంతర భావాన్ని ‘మరో విధంగా కూడా’ అని తెలిపాం. ‘రెండుసార్లు’ అనే ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో సంరక్షించాం.
- source_word: לֹא
  choice: అయినా ... డు
  rationale: దేవుడు మాట్లాడుతున్నప్పటికీ మానవుడు గ్రహించకపోవచ్చనే వ్యతిరేక లేదా అనుమతిసూచక సంబంధాన్ని ‘అయినా’ సహజంగా చూపిస్తుంది; నిషేధార్థం క్రియలో నిలిచింది.
- source_word: יְשׁוּרֶנָּה
  choice: దానిని గ్రహించడు
  rationale: שׁור ఇక్కడ చూడడం నుంచి ఉద్భవించిన ‘గమనించు/గ్రహించు’ భావాన్ని కలిగిస్తుంది. తరువాతి వచనాల్లోని కలలు, బాధ వంటి దేవుని సమాచార మార్గాలను గుర్తించకపోవడమే సందర్భార్థం.
theological_decisions:
- issue: చివరి ఉపవాక్యంలో వ్యక్తం చేయని 3వ పురుష ఏకవచన కర్త
  choice: సాధారణ మానవ కర్తగా ‘మనిషి’
  alternative: ‘అతడు’ లేదా కర్తను ప్రస్తావించకుండా ‘గ్రహించరు’
  rationale: హీబ్రూ 3ms కర్తను స్పష్టంగా పేర్కొనదు. తెలుగు ఏకవచన క్రియకు సహజమైన కర్త అవసరమైనందున ‘మనిషి’ అని సాధారణ మానవార్థంలో ఇచ్చాం; ఇది ఏ నిర్దిష్ట వ్యక్తినీ లేదా కేవలం పురుష లింగాన్నీ ఉద్దేశించదు.
- issue: 'సంఖ్యల భావం: విధానాలా లేక పునరావృత సందర్భాలా'
  choice: ప్రధాన పాఠంలో రెండు విధాలుగా దేవుడు మాట్లాడటం
  alternative: దేవుడు ఒకసారి, రెండుసార్లు మాట్లాడటం
  rationale: בְאַחַת ... וּבִשְׁתַּיִם అనే నిర్మాణం రెండు వ్యాఖ్యానాలకు అవకాశం ఇస్తుంది. తరువాతి సందర్భంలో దేవుడు కల ద్వారా, బాధ ద్వారా పలికే విభిన్న మార్గాలు ప్రస్తావించబడటం విధానార్థానికి మద్దతిస్తుంది; అయినప్పటికీ పునరావృతార్థాన్ని పాదటిప్పణిలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కవితాత్మక శైలిని వాడాం. హీబ్రూ సంఖ్యాప్రయోగంలోని అసలైన సందిగ్ధతను ప్రధాన పాఠం మరియు [a] పాదటిప్పణి ద్వారా సంరక్షించాం.
