source:
  edition: WLC
  text: רֽוּחַ אֵ֥ל עָשָׂ֑תְ/נִי וְ/נִשְׁמַ֖ת שַׁדַּ֣י תְּחַיֵּֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/033/004.yaml
  text: The Spirit of God has made me[a], and the breath of the Almighty gives me life.
translation:
  language: te
  text: 'దేవుని ఆత్మ నన్ను చేసింది[a];

    సర్వశక్తిమంతుని ఊపిరి నాకు జీవం ఇస్తోంది.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దేవుని ఊపిరి నన్ను చేసింది.” హీబ్రూ רוּחַ అనే పదానికి “ఊపిరి” లేదా “గాలి” అనే అర్థాలు కూడా ఉన్నాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: רוּחַ
  choice: ఆత్మ
  rationale: רוּחַ అనే పదానికి ‘ఆత్మ,’ ‘ఊపిరి,’ ‘గాలి’ అనే అర్థాలు ఉండవచ్చు. אֵל‌తో కలిసి, సమాంతర పాదంలోని జీవాన్నిచ్చే ‘ఊపిరి’తో సంబంధం కలిగి ఉన్నందున ప్రధాన పాఠంలో ‘ఆత్మ’ను ఎంచుకున్నాం; పదంలోని నిజమైన సందిగ్ధతను పాదసూచికలో నిలిపాం.
- source_word: אֵל
  choice: దేవుని
  rationale: ఇక్కడ אֵל, שַׁדַּי‌కు సమాంతరంగా దేవుని సూచించే బిరుదుగా ఉంది. ఆధునిక తెలుగులో ‘దేవుని’ సహజమైన అనువాదం.
- source_word: עָשָׂתְנִי
  choice: నన్ను చేసింది
  rationale: עשה యొక్క ప్రాథమిక భావమైన ‘చేయడం/సృష్టించడం’ను అతిగా విస్తరించకుండా తెలిపే రూపం. ‘నన్ను రూపించింది’ కూడా సాధ్యమే గాని అది మూల క్రియకన్నా కొంత ఎక్కువ వ్యాఖ్యానాత్మకం.
- source_word: נִשְׁמַת
  choice: ఊపిరి
  rationale: נשמה జీవింపజేసే శ్వాసను సూచిస్తుంది. సాధారణ పాఠకునికి సహజంగా ఉండి, సృష్టి సంబంధమైన జీవశ్వాస భావాన్ని కాపాడేందుకు ‘ఊపిరి’ ఎంచుకున్నాం.
- source_word: שַׁדַּי
  choice: సర్వశక్తిమంతుని
  rationale: שַׁדַּי అనే దైవ బిరుదుకు తెలుగులో స్థిరంగా, అర్థవంతంగా వినిపించే అనువాదం ‘సర్వశక్తిమంతుడు’; సంబంధ విభక్తిలో ‘సర్వశక్తిమంతుని’ వాడాం.
- source_word: תְּחַיֵּנִי
  choice: నాకు జీవం ఇస్తోంది
  rationale: חיה పీయేల్ రూపం ఇక్కడ ‘జీవింపజేయడం’ అనే కారణార్థాన్ని వ్యక్తం చేస్తుంది. ‘నాకు జీవం ఇస్తోంది’ ఆధునిక తెలుగులో స్పష్టంగా ఉండి, కేవలం ప్రాణాలతో నిలిపి ఉంచడం లేదా తిరిగి బ్రతికించడం అనే సంకుచిత భావాలను రుద్దదు.
theological_decisions:
- issue: רוּחַ אֵל‌ను వ్యక్తిగతమైన ‘దేవుని ఆత్మ’గా అనువదించాలా, లేక ‘దేవుని ఊపిరి/గాలి’గా అనువదించాలా
  choice: దేవుని ఆత్మ
  alternative: దేవుని ఊపిరి; దేవుని గాలి
  rationale: రెండవ పాదంలోని ‘సర్వశక్తిమంతుని ఊపిరి’తో కవితాత్మక సమాంతరత ఉన్నప్పటికీ, רוח మరియు נשמה అనే రెండు వేర్వేరు పదాలను ప్రధాన పాఠంలో వేరు చేసి చూపడం సముచితం. అందువల్ల ‘ఆత్మ’ను ఎంచుకుని, ‘ఊపిరి’ అనే సాధ్యమైన అర్థాన్ని పాదసూచికలో ఇచ్చాం; దీనివల్ల మూలంలోని ధార్మిక ఉద్వేగం అనవసరంగా పరిష్కరించబడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కవితాత్మక శైలిని వాడాం. రెండు సమాంతర పాదాలను విడిగా ఉంచి హెబ్రీ కవితా నిర్మాణాన్ని స్పష్టంచేశాం. ‘ఆత్మ’కు స్త్రీలింగ క్రియారూపమైన ‘చేసింది’ తెలుగు వ్యాకరణ సహజత్వాన్ని అనుసరిస్తుంది; ఇది దేవుని స్వభావం గురించి లింగ నిర్ధారణ కాదు.
