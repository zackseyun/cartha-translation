  yaml_path: translation/ot/job/033/028.yaml
  text: He has redeemed my soul from passing into the pit[b][a], and my life will look upon the light.
translation:
  language: te
  text: గొయ్యిలోకి వెళ్లకుండా ఆయన నా ప్రాణాన్ని విమోచించాడు[a][b]; నా జీవం వెలుగును చూస్తుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘గొయ్యిలోకి వెళ్లకుండా నా జీవితాన్ని విడిపించాడు.’
    reason: lexical_alternative
  - marker: b
    text: ‘గొయ్యి’ అనేది మరణం లేదా సమాధిని సూచించడానికి హీబ్రూ కవిత్వంలో సాధారణంగా వాడే రూపకం.
    reason: cultural_note
lexical_decisions:
- source_word: פָּדָה
  choice: విమోచించాడు
  rationale: ప్రమాదం లేదా బంధం నుంచి విడిపించడం/వెల చెల్లించి విడిపించడం అనే భావాన్ని ఇస్తుంది. ఇక్కడ చెల్లించిన వెల స్పష్టంగా చెప్పబడలేదు కాబట్టి, ‘విమోచించాడు’ ఆ భావపరిధిని సహజంగా నిలుపుతుంది.
- source_word: נַפְשִׁי
  choice: నా ప్రాణాన్ని
  rationale: נֶפֶשׁ ఇక్కడ వ్యక్తి ప్రాణం, జీవితం, లేదా తననే సూచించవచ్చు. తరువాతి పాదంలోని חַיָּתִיతో ఉన్న కవితాత్మక భేదాన్ని ఉంచుతూ, ఆధునిక తెలుగులో ‘నా ప్రాణాన్ని’ సహజంగా ఉంది.
- source_word: מֵעֲבֹר
  choice: దిగిపోకుండా
  rationale: మూలంలో ‘దాటి వెళ్లడం/ప్రవేశించడం నుంచి’ అనే కదలిక భావం ఉంది. గోతి అనే రూపకంతో తెలుగులో ‘గోతిలోకి దిగిపోకుండా’ సహజంగా ఉండి, మరణంలోకి వెళ్లకుండా కాపాడబడిన భావాన్ని తెలియజేస్తుంది.
- source_word: בַּשַּׁחַת
  choice: గోతిలోకి
  rationale: שַׁחַת అక్షరార్థంగా గోతిని, సందర్భానుసారంగా మరణం లేదా సమాధిని సూచిస్తుంది. ‘గోతి’ అనే రూపకాన్ని అలాగే ఉంచడం వల్ల మూలంలోని సూచనాత్మకత నిలుస్తుంది.
- source_word: וְחַיָּתִי
  choice: నా జీవం
  rationale: జీవించి ఉన్న స్థితి లేదా జీవితం అనే భావం. మొదటి పాదంలోని ‘నా ప్రాణం’తో కవితాత్మక సమాంతరతను, కొంత పదభేదాన్ని ఉంచడానికి ‘నా జీవం’ ఎంచుకున్నాం.
- source_word: בָּאוֹר
  choice: వెలుగును
  rationale: నిర్దిష్టమైన ‘వెలుగు’ను సూచిస్తుంది; గోతి/మరణానికి వ్యతిరేకంగా జీవితం మరియు క్షేమాన్ని సూచించే కవితాత్మక రూపకాన్ని నిలుపుతుంది.
- source_word: תִּרְאֶה
  choice: చూస్తుంది
  rationale: స్త్రీలింగ ఏకవచన క్రియకు ‘నా జీవం’ కర్తగా సరిపోతుంది. హీబ్రూ అసంపూర్ణ క్రియ ఇక్కడ భవిష్యత్ ఫలితాన్ని సూచించగలదు; తెలుగులో సందర్భం దానిని సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ఆరంభంలోని క్రియకు కర్త ఎవరు?
  choice: ఆయన నా ప్రాణాన్ని విమోచించాడు
  alternative: దేవుడు నా ప్రాణాన్ని విమోచించాడు; ఆయన నన్ను విమోచించాడు
  rationale: హీబ్రూలో కర్త ప్రత్యక్షంగా లేదు; సందర్భంలో అది దేవుణ్ణి సూచిస్తుంది. అయితే ఈ వచనంలో లేని ‘దేవుడు’ అనే నామాన్ని నేరుగా చేర్చకుండా ‘ఆయన’ అని ఉంచడం మూలంలోని అంతర్నిహిత కర్తను కాపాడుతుంది.
- issue: נֶפֶשׁ మరియు חַיָּה మధ్య కవితాత్మక సంబంధం
  choice: నా ప్రాణం ... నా జీవం
  alternative: నా జీవితం ... నేను; నన్ను ... నేను
  rationale: రెండు పదాలూ జీవితం/వ్యక్తిని సూచించగలిగినా, మూలంలోని రెండు వేర్వేరు పదాల కవితాత్మక ఉద్రిక్తతను పూర్తిగా ఒకే పదంగా కలపకుండా ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కవితాత్మక శైలి. ‘విమోచించాడు’ మూలంలోని రక్షణ/విడిపింపు భావాన్ని ఉంచుతుంది; ‘గోతి’ మరియు ‘వెలుగు’ రూపకాలను వివరణగా మార్చకుండా యథాతథంగా నిలిపాం. ప్రధాన వాక్యంలో రెండు పాదాల సమాంతరతను సంక్షిప్తంగా కాపాడాం.
