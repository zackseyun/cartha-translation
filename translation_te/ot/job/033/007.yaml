  yaml_path: translation/ot/job/033/007.yaml
  text: Look[a], my terror will not frighten you, and my hand on you will not be heavy.
translation:
  language: te
  text: ఇదిగో, నావల్ల కలిగే భీతి నిన్ను బెదరించదు; నా చెయ్యి[a] నీ మీద భారంగా ఉండదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నా ఒత్తిడి.” ఇక్కడి హీబ్రూ నామవాచకం אַכְפִּי అర్థనిర్ణయం క్లిష్టమైనది. “నా చెయ్యి” సంప్రదాయ, మరింత ప్రత్యక్షమైన అనువాదం; “ఒత్తిడి” అనేది ‘భారంగా ఉండదు’ అనే తరువాతి క్రియను బట్టి వచ్చే సందర్భానుగుణ అర్థం.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: ఇదిగో
  rationale: శ్రద్ధను ఆకర్షిస్తూ ధైర్యం చెప్పే మాటను బలంగా పరిచయం చేసే సూచక అవ్యయానికి సహజమైన ఆధునిక తెలుగు సమానం.
- source_word: אֵמָתִי
  choice: నావల్ల కలిగే భీతి
  rationale: ఎలీహు తాను భయపడుతున్నాడని కాక, తన ఉనికి యోబులో కలిగించగల భీతిని సూచిస్తున్న సందర్భార్థాన్ని తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: תְבַעֲתֶךָ
  choice: నిన్ను బెదరించదు
  rationale: בעת పీయేల్ రూపంలోని తీవ్రంగా భయపెట్టడం అనే భావాన్ని సహజంగా, అతిశయోక్తి లేకుండా వ్యక్తం చేస్తుంది.
- source_word: אַכְפִּי
  choice: నా ఒత్తిడి
  rationale: ఈ క్లిష్ట నామవాచకం כבד (‘భారంగా ఉండు’)తో కలిసి, యోబుపై మోపబడే ఒత్తిడి లేదా బరువు అనే సందర్భార్థాన్ని ఇస్తుంది; సంప్రదాయ ‘చెయ్యి’ రూపాన్ని పాదసూచికలో ఉంచాం.
- source_word: עָלֶיךָ
  choice: నీ మీద
  rationale: על మరియు ద్వితీయ పురుష ఏకవచన ప్రత్యయానికి ఈ సందర్భంలో సహజమైన తెలుగు సమానం.
- source_word: יִכְבָּד
  choice: భారంగా ఉండదు
  rationale: כבד అనే క్రియలోని ‘బరువుగా/భారంగా ఉండు’ అనే మూలచిత్రాన్ని నిలుపుతూ తెలుగులో స్పష్టంగా ఉంటుంది.
