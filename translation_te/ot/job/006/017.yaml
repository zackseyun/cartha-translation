source:
  edition: WLC
  text: בְּ֭/עֵת יְזֹרְב֣וּ נִצְמָ֑תוּ בְּ֝/חֻמּ֗/וֹ נִדְעֲכ֥וּ מִ/מְּקוֹמָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/job/006/017.yaml
  text: When they are warmed[a], they vanish; when it is hot[c][b], they dry up from their place.
translation:
  language: te
  text: వెచ్చబడినప్పుడు అవి కనుమరుగవుతాయి[a]; వేడిలో[b] అవి తమ స్థలం నుండి ఎండిపోతాయి[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అవి ఆరిపోతాయి’; ఇక్కడి హెబ్రీ చిత్రణ కనుమరుగవడం, ఆరిపోవడం అనే భావాలను కలగలుపుతుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘దాని వేడిలో’; ‘వేడిగా ఉన్నప్పుడు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: ‘తమ స్థలం’ సందర్భంలో ప్రవాహపాత్రను లేదా వాగు కాలువను సూచించవచ్చు.
    reason: cultural_note
lexical_decisions:
- source_word: בְּעֵת
  choice: వేళ
  rationale: కాలాన్ని సూచించే ఈ పదబంధాన్ని ఆధునిక తెలుగులో సహజమైన కాలవాచక ఉపవాక్యంగా వ్యక్తపరుస్తుంది.
- source_word: יְזֹרְבוּ
  choice: వెచ్చబడే
  rationale: అరుదైన ఈ క్రియ వేడెక్కడం లేదా వెచ్చబడడం అనే భావాన్ని ఇస్తుంది; ప్రవాహాల సందర్భంలో కారణాన్ని అదనంగా ఊహించకుండా భావాన్ని నిలుపుతుంది.
- source_word: נִצְמָתוּ
  choice: కనుమరుగవుతాయి
  rationale: నశించడం, అంతమవడం, కనిపించకుండా పోవడం అనే భావాలలో కాలానుగుణ ప్రవాహాలు మాయమయ్యే దృశ్యానికి ఇది సహజంగా సరిపోతుంది.
- source_word: בְּחֻמּוֹ
  choice: వేడి ఎక్కువైనప్పుడు
  rationale: అక్షరార్థంగా ‘దాని వేడిలో’; సమాంతర కాలవాచక నిర్మాణాన్ని తెలుగులో సహజంగా అందిస్తూ, సర్వనామ సూచనను అతిగా నిర్దిష్టం చేయదు.
- source_word: נִדְעֲכוּ
  choice: ఎండిపోతాయి
  rationale: క్రియకు ఆరిపోవడం లేదా నివారింపబడడం అనే విస్తృత భావం ఉన్నా, నీటి ప్రవాహాల సందర్భంలో ఎండిపోవడం దృశ్యాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: מִמְּקוֹמָם
  choice: తమ స్థలంలోనే
  rationale: హెబ్రీ పదం సాధారణంగా ‘వారి స్థలం’ అని అర్థం. సందర్భంలోని ప్రవాహపాత్రను ప్రధాన పాఠ్యంలో నిర్బంధించకుండా స్థలార్థాన్ని కాపాడుతుంది; מִן ఇక్కడ తొలగింపును సూచిస్తూ ‘తమ స్థలం నుండి’ అని కూడా అనువదించవచ్చు.
