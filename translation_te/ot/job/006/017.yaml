  - severity: low
    issue: “వేడి ఎక్కువైనప్పుడు” adds a comparative/intensive nuance.
    rationale: The Hebrew says “in its heat” and does not explicitly say that the heat becomes greater. “వేడిలో” preserves the expression more closely while remaining idiomatic.
