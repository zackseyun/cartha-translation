translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కవితా గద్యశైలిని ఉపయోగించాం. కాలానుగుణ వాగుల రూపకాన్ని స్పష్టంగా ఉంచుతూ, అరుదైన క్రియల కనుమరుగవడం/ఆరిపోవడం అనే ఉద్దేశపూర్వక భావసమ్మేళనాన్ని పాదటిప్పణిలో నిలిపాం.
