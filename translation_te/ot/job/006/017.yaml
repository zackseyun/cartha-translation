  naturalness: The Telugu is generally fluent and suitably literary. “వేడి ఎక్కువైనప్పుడు” is natural, though it slightly intensifies the compact Hebrew “in its heat.” “వేడిలో” is both closer and natural in this poetic context.
  terminology: “కనుమరుగవుతాయి” and “ఎండిపోతాయి” appropriately render the contextual force of the two verbs. “వెచ్చబడినప్పుడు” is a smooth temporal rendering of the first clause. The wording retains the stream imagery without specifying a channel in the main text.
