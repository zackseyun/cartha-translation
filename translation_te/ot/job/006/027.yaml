  yaml_path: translation/ot/job/006/027.yaml
  text: You would even cast lots over the fatherless[b][a], and bargain over your friend.
translation:
  language: te
  text: తండ్రిలేని వానిమీద కూడా మీరు చీట్లు వేస్తారు[a]; మీ స్నేహితుణ్ణి బేరానికి పెడతారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తండ్రిలేని వాని కోసం కూడా మీరు చీటి వేస్తారు.” హీబ్రూ నుడికారానికి అక్షరార్థం, “తండ్రిలేని వానిమీద పడేలా చేస్తారు.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “మీ స్నేహితుని కోసం గొయ్యి తవ్వుతారు.” ఇక్కడి హీబ్రూ క్రియ అర్థం కష్టమైనది; చాలామంది దీన్ని స్నేహితుని విషయంలో బేరమాడడం లేదా అతణ్ణి దోచుకోవడం అనే భావంలో అర్థం చేసుకుంటారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף
  choice: కూడా / సైతం
  rationale: ఆరోపణలోని దిగ్భ్రాంతికరమైన తీవ్రతను చూపిస్తుంది; రెండో పాదంలో ‘సైతం’ తెలుగు సహజత్వంతో అదే భావాన్ని కొనసాగిస్తుంది.
- source_word: יָתוֹם
  choice: తండ్రిలేని వాడు
  rationale: హీబ్రూ పదం సూచించే సామాజికంగా బలహీనమైన వర్గాన్ని స్పష్టంగా, ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: תַּפִּילוּ
  choice: చీట్లు వేస్తారు
  rationale: נפל యొక్క హిఫీల్ రూపం עַל‌తో కలిసినప్పుడు ఒకరి విషయంలో చీటి పడేలా చేయడం, అంటే చీట్లు వేయడం అనే సంభావ్య నుడికారార్థాన్ని వ్యక్తం చేస్తుంది.
- source_word: תִכְרוּ
  choice: బేరానికి పెడతారు
  rationale: సందిగ్ధమైన క్రియను సమాంతర పాదంలోని దోపిడీ భావానికి అనుగుణంగా, స్నేహితుణ్ణి లాభం కోసం వస్తువులా చూడడమనే అర్థంలో అందిస్తుంది; ‘గోతిని తవ్వడం’ అనే ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచింది.
- source_word: רֵיעֲכֶם
  choice: మీ స్నేహితుడు
  rationale: యోబు తన సహచరులను నేరుగా గద్దిస్తున్న సందర్భంలో ‘స్నేహితుడు’ ద్రోహంలోని తీవ్రతను స్పష్టం చేస్తుంది.
- source_word: עַל ... עַל
  choice: మీద ... బేరానికి
  rationale: మొదటి పాదంలో ‘మీద’ను ప్రత్యక్షంగా నిలిపి, రెండో పాదంలో సహజమైన తెలుగు నుడికారమైన ‘బేరానికి పెట్టడం’ ద్వారా వ్యక్తులను లాభవస్తువులుగా చూడడమనే సంబంధాన్ని అందిస్తుంది.
