id: JOB.6.4
reference: Job 6:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּ֤י חִצֵּ֪י שַׁדַּ֡י עִמָּדִ֗/י אֲשֶׁ֣ר חֲ֭מָתָ/ם שֹׁתָ֣ה רוּחִ֑/י בִּעוּתֵ֖י אֱל֣וֹהַּ יַֽעַרְכֽוּ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/job/006/004.yaml
  text: For the arrows of the Almighty are in me[a]; my spirit drinks their poison[c][b]; the terrors of God array themselves against me.
translation:
  language: te
  text: ఎందుకంటే సర్వశక్తిమంతుని బాణాలు నాలో ఉన్నాయి[a]; వాటి విషాన్ని నా ఆత్మ తాగుతోంది[b]; దేవుని భయోత్పాతాలు నాకు వ్యతిరేకంగా మోహరిస్తున్నాయి[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘నాతో ఉన్నాయి.’ హీబ్రూ ఉపసర్గకు అక్షరార్థంగా ఈ భావం రావచ్చు; అయితే బాణాలు, విషం అనే సందర్భం ‘నాలో ఉన్నాయి’ అనే భావాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘వాటి విషద్రవాన్ని’; ఈ హీబ్రూ పదాన్ని కొందరు మరింత అమూర్తంగా ‘వాటి కోపాన్ని’ అని అర్థం చేసుకుంటారు.
    reason: lexical_alternative
  - marker: c
    text: అక్షరార్థంగా ‘నాకు వ్యతిరేకంగా యుద్ధపంక్తిలో తమను తాము అమర్చుకుంటున్నాయి’; ఇది సైనిక రూపకం.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి మాటల్లో యోబు వ్యక్తం చేసిన వేదనకు కారణాన్ని పరిచయం చేస్తుంది; హీబ్రూ పదంలోని వివరణాత్మక/కారణార్థక సంబంధాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: חִצֵּי שַׁדַּי
  choice: సర్వశక్తిమంతుని బాణాలు
  rationale: యుద్ధసంబంధ రూపకాన్ని యథాతథంగా ఉంచుతూ, שַׁדַּי అనే దైవ బిరుదును సాధారణంగా అర్థమయ్యే తెలుగులో అనువదిస్తుంది.
- source_word: עִמָּדִי
  choice: నాలో ఉన్నాయి
  rationale: ఉపసర్గ అక్షరార్థంగా ‘నాతో/నా దగ్గర’ అని ఉండగలిగినా, బాణాలు మరియు వాటి విషం అనే సందర్భం అవి యోబులో దిగివున్న భావాన్ని సూచిస్తుంది. నిజమైన పదార్థ ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: חֲמָתָם
  choice: వాటి విషం
  rationale: ఈ పదానికి ‘కోపం’ అనే అర్థం కూడా ఉన్నా, బాణాల రూపకంలో వాటి విషం అనే స్పష్టమైన అర్థమే సందర్భానికి బాగా సరిపోతుంది.
- source_word: שֹׁתָה רוּחִי
  choice: నా ఆత్మ తాగుతోంది
  rationale: యోబు అంతరంగం విషప్రభావాన్ని అనుభవిస్తున్నదనే సజీవ రూపకాన్ని, కొనసాగుతున్న అనుభవంగా తెలుగులో నిలుపుతుంది.
- source_word: בִּעוּתֵי אֱלוֹהַּ
  choice: దేవుని భయోత్పాతాలు
  rationale: భయాన్ని, దిగ్భ్రాంతిని కలిగించే అనేక భీకర అనుభవాలను సూచించే బహువచన తీవ్రతను కాపాడుతుంది.
- source_word: יַעַרְכוּנִי
  choice: నాకు ఎదురుగా మోహరిస్తున్నాయి
  rationale: యుద్ధానికి క్రమంగా అమర్చుకోవడం అనే సైనిక రూపకాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: שַׁדַּי మరియు אֱלוֹהַּ అనే రెండు దైవ నామాల అనువాదం
  choice: మొదటిదాన్ని ‘సర్వశక్తిమంతుడు’, రెండవదాన్ని ‘దేవుడు’గా అనువదించడం
  alternative: שַׁדַּיని ‘షద్దాయి’గా లిప్యంతరీకరించడం లేదా రెండింటినీ ఒకే బిరుదుతో అనువదించడం
  rationale: మూలంలోని రెండు వేర్వేరు దైవ సంబోధనలను సమానపరచకుండా, వాటి అర్థాన్ని సాధారణ పాఠకునికి స్పష్టంగా అందిస్తుంది.
- issue: חֲמָתָם యొక్క సందర్భార్థం
  choice: బాణాల ‘విషం’గా చదవడం
  alternative: ‘వాటి కోపం’ లేదా ‘ఆయన కోపం’గా చదవడం
  rationale: బాణాలు, తాగడం అనే సమీప రూపకాలతో ‘విషం’ సహజంగా సరిపోతుంది; దేవుని కోపం అనే మరింత అమూర్తమైన వ్యాఖ్యానాన్ని వచనంపై బలవంతంగా రుద్దదు.
- issue: యోబు బాధకు దేవునితో ఉన్న సంబంధం
  choice: దైవ బిరుదులు మరియు ‘దేవుని భయోత్పాతాలు’ అనే మూలంలోని ప్రత్యక్ష సంబంధాన్ని నిలుపడం
  alternative: బాధను కేవలం సాధారణ విపత్తులుగా మృదువుగా చెప్పడం
  rationale: దేవుడే తనను లక్ష్యంగా చేసుకున్నాడని యోబు అనుభవిస్తున్న తీవ్రమైన వేదాంత ఉద్రిక్తతను మూలం వ్యక్తం చేసినట్లే ఉంచుతుంది; దానిని సమర్థించడమో పరిష్కరించడమో చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైన కవితాత్మక ధోరణితో అనువదించబడింది. ‘మోహరిస్తున్నాయి’ సైనిక రూపకాన్ని సంక్షిప్తంగా, సహజంగా నిలుపుతుంది; ‘భయోత్పాతాలు’ మూలంలోని బహువచన తీవ్రతను కాపాడుతుంది.
