source:
  edition: WLC
  text: וּ֥/תְהִי ע֨וֹד נֶ֘חָ֤מָתִ֗/י וַ/אֲסַלְּדָ֣ה בְ֭/חִילָה לֹ֣א יַחְמ֑וֹל כִּי לֹ֥א כִ֝חַ֗דְתִּי אִמְרֵ֥י קָדֽוֹשׁ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/006/010.yaml
  text: This would still be my comfort[a], and I would exult in unrelenting pain; for I have not denied the words of the Holy One.
translation:
  language: te
  text: ఇదే ఇంకా నాకు ఓదార్పుగా ఉంటుంది; తగ్గని వేదనలోనూ నేను ఆనందంతో ఉప్పొంగుతాను[a]. ఎందుకంటే పరిశుద్ధుని మాటలను నేను తిరస్కరించలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత రూపానుగుణంగా: “ఆయన విడిచిపెట్టని వేదనలోనూ నేను ఆనందంతో ఉప్పొంగుతాను.” ఈ హీబ్రూ వాక్యభాగం క్లిష్టంగా, సంక్షిప్తంగా ఉంది.'
    reason: alternative_reading
lexical_decisions:
- source_word: נֶחָמָתִי
  choice: నాకు ఓదార్పు
  rationale: నחם మూలానికి చెందిన ఈ నామవాచకం ఓదార్పు లేదా ఆదరణను సూచిస్తుంది. ఆధునిక తెలుగులో ‘ఓదార్పు’ సహజంగా ఉండి, యోబుకు మిగిలే మనశ్శాంతి భావాన్ని నిలుపుతుంది.
- source_word: וַאֲסַלְּדָה
  choice: నేను ఆనందంతో ఉప్పొంగుతాను
  rationale: సלד అరుదైన, అర్థనిర్ణయం కష్టమైన క్రియ. సందర్భంలో తీవ్రమైన, దాదాపు ధిక్కారపూరితమైన ఆనంద స్పందనను సూచించవచ్చు; ‘ఆనందంతో ఉప్పొంగుతాను’ ఆ తీవ్రతను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בְחִילָה
  choice: వేదనలోనూ
  rationale: חִילָה మెలికలు తిరిగేంత బాధ, యాతన లేదా తీవ్రమైన వేదనను సూచించగలదు. ‘వేదన’ సాధారణ పాఠకులకు స్పష్టంగా ఉండి, తీవ్రమైన బాధ అనే సందర్భార్థాన్ని ఇస్తుంది.
- source_word: לֹא יַחְמֹל
  choice: తగ్గని
  rationale: חמל అంటే కనికరించడం లేదా విడిచిపెట్టడం. సంక్షిప్తమైన హీబ్రూ నిర్మాణంలో ఈ భావాన్ని ‘తగ్గని వేదన’గా కలిపి చెప్పడం తెలుగులో సహజం; మరింత రూపానుగుణమైన పఠనాన్ని పాదసూచికలో ఉంచాం.
- source_word: כִחַדְתִּי
  choice: నేను తిరస్కరించలేదు
  rationale: పియేల్ రూపంలోని כחד దాచడం, అణచివేయడం లేదా నిరాకరించడం అనే అర్థాలు కలిగి ఉంటుంది. దేవుని మాటలతో ఉన్న సందర్భంలో ‘తిరస్కరించలేదు’ అనేది వాటిని తోసిపుచ్చలేదనే యోబు వాదనను సహజంగా తెలియజేస్తుంది.
- source_word: אִמְרֵי
  choice: మాటలను
  rationale: אמרה బహువచన నిర్మాణరూపం పలికిన మాటలు లేదా వాక్కులను సూచిస్తుంది. ‘మాటలు’ విస్తృతమైన, సహజమైన తెలుగు సమానార్థకం.
- source_word: קָדוֹשׁ
  choice: పరిశుద్ధుని
  rationale: ఇక్కడ విశేషణం నామవాచకంగా దేవునికి బిరుదుగా వాడబడింది. ‘పరిశుద్ధుడు’ దైవసూచనను కాపాడుతూ అదనపు సిద్ధాంతార్థాన్ని చేర్చదు.
theological_decisions:
- issue: కָדוֹשׁ అనే దైవ బిరుదు
  choice: పరిశుద్ధుడు
  alternative: పవిత్రుడు
  rationale: సందర్భం సాధారణంగా ఒక పవిత్ర వ్యక్తిని కాక దేవునినే సూచిస్తుంది. ‘పరిశుద్ధుడు’ దీనిని దైవ బిరుదుగా స్పష్టంగా నిలుపుతుంది.
- issue: בְחִילָה לֹא יַחְמֹל అనే క్లిష్టమైన మధ్య వాక్యభాగం
  choice: తగ్గని వేదనలోనూ
  alternative: ఆయన కనికరించని వేదనలోనూ
  rationale: హీబ్రూ వాక్యభాగం సంక్షిప్తంగా, వ్యాకరణపరంగా అనిశ్చితంగా ఉంది. ప్రధాన పాఠంలోని రూపం ఉపశమనం లేని తీవ్రమైన వేదన భావాన్ని చదవదగిన తెలుగులో ఇస్తుంది; ప్రత్యామ్నాయ రూపం పాదసూచికలో ఇచ్చి అసలు పాఠంలోని ఉద్వేగాన్ని, అనిశ్చితిని కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలిని ఉపయోగించాం. అరుదైన క్రియలోని తీవ్ర భావాన్ని ‘ఆనందంతో ఉప్పొంగుతాను’గా, క్లిష్టమైన మధ్య వాక్యభాగాన్ని ‘తగ్గని వేదన’గా సహజీకరించాం; అసలు పాఠంలోని ప్రత్యామ్నాయ నిర్మాణాన్ని పాదసూచికలో నిలిపాం.
