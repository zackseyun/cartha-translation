source:
  edition: WLC
  text: מַה כֹּחִ֥/י כִֽי אֲיַחֵ֑ל וּ/מַה קִּ֝צִּ֗/י כִּֽי אַאֲרִ֥יךְ נַפְשִֽׁ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/006/011.yaml
  text: What strength do I have[a], that I should keep hoping? And what is my end, that I should prolong my life?
translation:
  language: te
  text: నేను ఇంకా ఆశతో ఎదురుచూడటానికి నా బలం ఎంత ఉంది? నా ప్రాణాన్ని ఇంకా సాగదీయటానికి నా అంతం ఏమిటి?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నేను ఇంకా ఓపిక పట్టడానికి.” హెబ్రీలో అక్షరార్థంగా, “నా ప్రాణాన్ని పొడిగించడానికి”; ఈ మాట జీవితాన్ని కొనసాగించడం లేదా సహనంతో భరించడం అనే భావాలను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה כֹּחִי
  choice: నాకున్న బలమేమిటి?
  rationale: מַה అనే ప్రశ్నార్థకం ఇక్కడ అలంకారిక ప్రశ్నను ప్రవేశపెడుతుంది; כֹּחִי యోబుకు మిగిలిన శక్తి లేదా సామర్థ్యాన్ని సూచిస్తుంది.
- source_word: כִּי אֲיַחֵל
  choice: నేను ఇంకా నిరీక్షిస్తూ ఉండడానికి
  rationale: יחל ఆశతో ఎదురుచూడడం లేదా నిరీక్షించడం అనే భావాలను కలిగి ఉంది. ‘ఇంకా నిరీక్షిస్తూ’ అనే రూపం కొనసాగుతున్న సహనాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తూ, ఆశ మరియు వేచియుండడం మధ్యనున్న భావవిస్తృతిని పూర్తిగా తొలగించదు.
- source_word: וּמַה קִצִּי
  choice: నా అంతమేమిటి?
  rationale: קֵץ అంతం, హద్దు లేదా తుదిస్థితిని సూచిస్తుంది. ‘నా అంతం’ మూలంలోని సంక్షిప్తతను, యోబు ప్రశ్నలోని అస్తిత్వభారాన్ని నిలుపుతుంది.
- source_word: כִּי אַאֲרִיךְ נַפְשִׁי
  choice: నా ప్రాణాన్ని ఇంకా సాగదీయడానికి
  rationale: అక్షరార్థంగా ‘నా నెఫెష్‌ను పొడిగించడానికి’ అనే ఈ మాట జీవితం కొనసాగించడాన్నీ, ఓర్పుతో భరించడాన్నీ సూచించగలదు. ‘ప్రాణాన్ని సాగదీయడం’ హెబ్రీ చిత్రణను కొంత నిలుపుతూ ఆధునిక తెలుగులో అర్థమయ్యేలా ఉంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, యోబు మాటలలోని అలసటను మరియు రెండు సమాంతర అలంకారిక ప్రశ్నల నిర్మాణాన్ని నిలుపుతూ అనువదించబడింది.
