  yaml_path: translation/ot/job/006/013.yaml
  text: Is my help not within me[a], and has sound wisdom been driven from me?
translation:
  language: te
  text: నాలో నాకు సహాయం లేదా? కార్యసాధక వివేకం[a] నా నుండి తరిమివేయబడిందా?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఆచరణాత్మక వివేకం’ లేదా ‘సామర్థ్యం’; హెబ్రీ పదం ఆచరణాత్మక వివేకం, సామర్థ్యం, లేదా ఫలప్రదమైన సలహాను సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַאִם אֵין
  choice: లేదుకదా?
  rationale: హెబ్రీలోని అలంకారప్రశ్నతో కూడిన నిషేధ భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: עֶזְרָתִי בִי
  choice: నాలోనే నాకు సహాయం
  rationale: ‘నా సహాయం నాలో’ అనే మూలభావాన్ని కాపాడుతూ, యోబులో అంతర్గత ఆధారం లేదనే భావాన్ని తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: וְתֻשִׁיָּה
  choice: కార్యసాధక వివేకం
  rationale: ఈ జ్ఞానసాహిత్య పదం కేవలం జ్ఞానాన్ని మాత్రమే కాక, ఆచరణలో పనికివచ్చే వివేకం, సామర్థ్యం, వనరులను ఉపయోగించగల నేర్పును కూడా సూచిస్తుంది.
- source_word: נִדְּחָה
  choice: తరిమివేయబడలేదా?
  rationale: నిఫాల్ రూపంలోని కర్మణి భావాన్నీ, దూరంగా నెట్టివేయడం లేదా వెళ్లగొట్టడం అనే బలమైన అర్థాన్నీ నిలుపుతుంది.
- source_word: מִמֶּנִּי
  choice: నా నుండి
  rationale: మూలంలోని మొదటి పురుష ఏకవచన విభక్తి సంబంధాన్ని నేరుగా ప్రతిబింబిస్తుంది.
