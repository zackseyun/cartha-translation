translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కవితా శైలి. సందర్భంలో ముందుగా ప్రస్తావించిన వాగులను స్పష్టంగా సూచించేందుకు ‘ఆ వాగులు’ అని చేర్చబడింది. ఒకే తెలుగు పదమైన ‘మంచు’ ద్వారా קָרַח మరియు שָׁלֶג మధ్యనున్న భేదం తగ్గిపోవచ్చునని పాదసూచికలో ‘గడ్డమంచు’ ప్రత్యామ్నాయం ఇవ్వబడింది.
