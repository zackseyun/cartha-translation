translation:
  language: te
  text: గడ్డమంచువల్ల నల్లబడే ఆ వాగులు[a], వాటిమీద మంచు దాగుకుంటుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “గడ్డమంచువల్ల మసకబారే ఆ వాగులు.” హీబ్రూ పదానికి ప్రధానంగా “చీకటిపడే” లేదా “నల్లబడే” అనే అర్థం ఉంది; ఈ సందర్భంలో శీతకాల పరిస్థితులవల్ల నీరు మసకబారడాన్ని కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקֹּדְרִים
  choice: నల్లబడే
  rationale: קדר ధాతువు యొక్క ప్రాథమిక దృశ్యార్థమైన చీకటిపడడం లేదా నల్లబడడాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది; ‘బురదగా మారే’ అనేది సందర్భోచితమైనా మరింత వ్యాఖ్యానాత్మకం.
- source_word: מִנִּי
  choice: వల్ల
  rationale: ఇక్కడ מן రూపం మూలం లేదా కారణాన్ని సూచిస్తుంది; మంచు కారణంగా వాగులు నల్లబడుతున్న భావానికి ‘వల్ల’ సహజంగా సరిపోతుంది.
- source_word: קָרַח
  choice: మంచు
  rationale: ఈ పదం ice/frost‌ను సూచిస్తుంది. తరువాత వచ్చే హిమపాతం సంబంధిత שׁלגతో భేదం తెలుగులో పూర్తిగా స్పష్టంకాకపోయినా, సాధారణ పాఠకునికి ‘మంచు’ సహజమైన పదం; ప్రత్యామ్నాయం పాదసూచికలో తెలియజేయబడింది.
- source_word: עָלֵימוֹ
  choice: వాటిమీద
  rationale: మునుపటి వాగులను సూచించే మూడవ పురుష బహువచన ప్రత్యయంతో కూడిన ప్రదేశార్థక ప్రయోగాన్ని నేరుగా అందిస్తుంది.
- source_word: יִתְעַלֶּם
  choice: దాగుకుంటుంది
  rationale: హిత్పయేల్ రూపంలోని ఆత్మనేపద భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది; కేవలం ‘కప్పబడుతుంది’ అని నిష్క్రియార్థంగా మార్చదు.
- source_word: שָׁלֶג
  choice: మంచు
  rationale: పడిన మంచు లేదా హిమాన్ని సూచించే సాధారణ తెలుగు పదం; కవితాత్మకంగా అది వాగులమీద దాగుకుంటున్నట్లు వ్యక్తీకరించబడింది.
