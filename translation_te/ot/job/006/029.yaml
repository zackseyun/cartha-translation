source:
  edition: WLC
  text: שֻֽׁבוּ נָ֭א אַל תְּהִ֣י עַוְלָ֑ה ו/שבי ע֝וֹד צִדְקִ/י בָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/006/029.yaml
  text: Turn back[a], please; let there be no injustice. Turn back again; my righteousness is still in it.
translation:
  language: te
  text: దయచేసి, పునరాలోచించండి[a]; అన్యాయం ఉండకూడదు. మళ్లీ పునరాలోచించండి; ఈ విషయంలో నా నీతి ఇంకా ఉంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వెనుదిరగండి” లేదా “తిరిగి రండి.”
    reason: שׁוּב అనే క్రియ అక్షరార్థంగా వెనుదిరగడం లేదా తిరిగి రావడం అని అర్థం. ఈ సందర్భంలో యోబు తన స్నేహితులు తమ తీర్పును పునఃపరిశీలించాలని కోరుతున్నాడు.
lexical_decisions:
- source_word: שֻׁבוּ
  choice: మీ వైఖరి మార్చుకోండి
  rationale: ఇది బహువచన ఆజ్ఞారూపం. యోబు తన స్నేహితులు తమ తీర్పును వెనక్కి తీసుకొని పునరాలోచించాలని కోరుతున్న సందర్భంలో, ‘మీ వైఖరి మార్చుకోండి’ అనేది שוב లోని తిరుగుదల భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: נָא
  choice: దయచేసి
  rationale: ఆజ్ఞను మృదువుగా చేసే అభ్యర్థనా అవ్యయానికి సహజమైన ఆధునిక తెలుగు సమానం.
- source_word: אַל תְּהִי עַוְלָה
  choice: అన్యాయం జరగకూడదు
  rationale: హీబ్రూలోని ‘అన్యాయం ఉండకూడదు’ అనే నిర్దిష్ట కర్తలేని నిర్మాణాన్ని నిలుపుతూ, తెలుగులో సహజంగా వినిపించే రూపం.
- source_word: וְשֻׁבוּ
  choice: మళ్లీ ఆలోచించండి
  rationale: పునరుక్త ఆజ్ఞను సందర్భానుసారంగా సహజ తెలుగులో అందిస్తుంది; స్నేహితులు తమ నిర్ణయాన్ని తిరిగి పరిశీలించాలనే విజ్ఞప్తిని తెలియజేస్తుంది.
- source_word: עוֹד
  choice: ఇంకా
  rationale: యోబు నీతి ఇప్పటికీ నిలిచి ఉందనే కొనసాగింపు భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: צִדְקִי
  choice: నా నీతి
  rationale: צדק పదంలోని నైతిక-న్యాయ సంబంధ భావాన్ని కాపాడుతుంది; ఇక్కడ ఇది సంపూర్ణ పాపరాహిత్యాన్ని కాక, వివాదంలో యోబు తన యథార్థతను సమర్థించుకోవడాన్ని సూచిస్తుంది.
- source_word: בָהּ
  choice: ఈ విషయంలో
  rationale: స్త్రీలింగ ఏకవచన ప్రత్యయానికి స్పష్టమైన పూర్వపదం లేకపోయినా, సందర్భం యోబు గురించి జరుగుతున్న వివాదం లేదా వ్యవహారాన్ని సూచిస్తుంది. ‘ఈ విషయంలో’ అనేది ఆ భావాన్ని సహజంగా అందిస్తుంది.
theological_decisions:
- issue: צִדְקִי అనే యోబు వాదన యొక్క పరిధి
  choice: ఈ వివాదంలో తన నీతి ఇంకా నిలిచి ఉందని యోబు వాదిస్తున్నాడు.
  alternative: తన న్యాయమైన పక్షం ఈ వ్యవహారంలో ఇంకా నిలిచే ఉందని యోబు చెబుతున్నాడు.
  rationale: ‘నా నీతి’ అనే అనువాదం మూలపదంలోని నైతిక-న్యాయ ఉద్రిక్తతను నిలుపుతుంది; దానిని యోబు సంపూర్ణంగా పాపరహితుడనని చేసే వాదనగా విస్తరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. మొదటి שוב ను సందర్భోచితమైన ‘మీ వైఖరి మార్చుకోండి’గా, దాని పునరుక్తిని ‘మళ్లీ ఆలోచించండి’గా అందించి సహజత్వాన్ని సాధించాం; అక్షరార్థ తిరుగుదల భావాన్ని పాదటిప్పణిలో ఉంచాం.
