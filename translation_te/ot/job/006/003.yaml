base_translation:
  language: en
  yaml_path: translation/ot/job/006/003.yaml
  text: For now it would be heavier than the sand of the seas[a]; therefore my words have been rash.
translation:
  language: te
  text: ఎందుకంటే ఇప్పుడు అది సముద్రాల ఇసుకకంటే బరువుగా ఉండేది; అందుచేత నా మాటలు అదుపు తప్పాయి[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నా మాటలు అస్తవ్యస్తంగా ఉన్నాయి.” ఇక్కడి హీబ్రూ క్రియ అర్థనిర్ణయం కష్టమైనది; అది అదుపులేని లేదా గందరగోళమైన మాటలను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి వచనంలో యోబు చేసిన విలాపానికి కారణాన్ని వివరిస్తున్న అనుసంధాన పదంగా సహజంగా ఉంది.
- source_word: עַתָּה
  choice: ఇప్పుడు
  rationale: యోబు ప్రస్తుత స్థితిని నొక్కిచెప్పే కాలసూచక పదాన్ని నేరుగా నిలుపుతుంది.
- source_word: מֵחוֹל יַמִּים
  choice: సముద్రాల ఇసుకకంటే
  rationale: హీబ్రూలోని తులనార్థక రూపాన్నీ, ‘సముద్రాలు’ అనే బహువచనాన్నీ సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: יִכְבָּד
  choice: బరువుగా ఉంటుంది
  rationale: כבד అనే మూలంలోని ‘బరువుగా ఉండు’ భావాన్ని కాపాడుతుంది; కర్త ముందటి వచనంలోని దుఃఖం/బాధ అని సందర్భం ద్వారా గ్రహించబడుతుంది.
- source_word: עַל־כֵּן
  choice: అందుచేత
  rationale: అతని బాధ భారానికి అతని మాటల స్థితి పర్యవసానమని తెలిపే కారణ-ఫల సంబంధాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: דְּבָרַי
  choice: నా మాటలు
  rationale: బహువచన నామవాచకాన్ని సరళంగా, నేరుగా అనువదిస్తుంది.
- source_word: לָעוּ
  choice: అదుపు తప్పాయి
  rationale: అర్థనిర్ణయం కష్టమైన ఈ క్రియ సూచించగల నియంత్రణలేని లేదా అస్తవ్యస్తమైన మాటల భావాన్ని సహజమైన ఆధునిక తెలుగులో ఇస్తుంది; ప్రత్యామ్నాయ అర్థాన్ని పాదటిప్పణిలో ఉంచుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ముందటి వచనంలోని బాధను సూచించే హీబ్రూ అంతర్లీన కర్తను ‘అది’గా ఉంచి సందర్భ సంబంధాన్ని కాపాడాం. పాదటిప్పణి సూచికను సంబంధిత వివాదాస్పద క్రియ తరువాత ఉంచాం.
