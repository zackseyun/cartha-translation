  text: הֲ/יֵאָכֵ֣ל תָּ֭פֵל מִ/בְּלִי מֶ֑לַח אִם יֶשׁ טַ֝֗עַם בְּ/רִ֣יר חַלָּמֽוּת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/006/006.yaml
  text: Can tasteless food be eaten without salt[a], or is there any taste in the slime of mallow?
translation:
  language: te
  text: ఉప్పు లేకుండా చప్పని ఆహారాన్ని తినగలరా? మాలో మొక్కలోని జిగురులో రుచి ఏమైనా ఉంటుందా?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: రెండవ పాదంలోని హీబ్రూ పదాల అర్థం అనిశ్చితం. “మాలో మొక్కలోని జిగురు” అనే మాటను “మాలో మొక్క రసం” అని కూడా అర్థం చేసుకోవచ్చు; సంప్రదాయంగా కొందరు దీనిని “గుడ్డులోని తెల్లసొన” అని అనువదించారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲ/יֵאָכֵל
  choice: తినగలరా?
  rationale: ప్రశ్నార్థక అవ్యయంతో కూడిన నిఫాల్ అసంపూర్ణ క్రియ అలంకారిక ప్రశ్నను సూచిస్తుంది; తెలుగులో ‘తినగలరా?’ దాని భావబలాన్ని సహజంగా నిలుపుతుంది.
- source_word: תָּפֵל
  choice: చప్పని ఆహారం
  rationale: ఈ పదం రుచిలేని లేదా ఉప్పూకారం లేని దానిని సూచిస్తుంది. సందర్భంలో సూచితమైన తినదగిన వస్తువును ‘ఆహారం’ అని స్పష్టం చేయడం సహజంగా ఉంటుంది.
- source_word: מִ/בְּלִי מֶלַח
  choice: ఉప్పు లేకుండా
  rationale: ఉప్పు లేని స్థితిని నేరుగా, సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: אִם יֶשׁ
  choice: ఏమైనా ఉంటుందా?
  rationale: మొదటి ప్రశ్నకు సమాంతరమైన రెండవ అలంకారిక ప్రశ్నగా తెలుగులో సహజంగా వ్యక్తమవుతుంది.
- source_word: טַעַם
  choice: రుచి
  rationale: మూలపదానికి నేరమైన సమానార్థకం; మొదటి పాదంలోని ‘చప్పని’ అనే భావంతో సంబంధాన్ని నిలుపుతుంది.
- source_word: בְּ/רִיר
  choice: జిగురులో
  rationale: అర్థం అనిశ్చితమైన ఈ నామవాచకం జిగురులాంటి ద్రవం, రసం లేదా శ్లేష్మాన్ని సూచించవచ్చు. ‘జిగురు’ సందర్భంలోని అసహ్యకరమైన భావాన్ని నిలుపుతూ తెలుగులో అర్థమయ్యే పదం.
- source_word: חַלָּמוּת
  choice: మాలో మొక్క
  rationale: అనిశ్చితమైన మొక్కపేరు. గుర్తింపును అతిగా నిర్ధారించకుండా సాధారణ పండిత అనువాదమైన ‘mallow’కు లిప్యంతరీకరణతో ‘మొక్క’ను జోడించాం.
