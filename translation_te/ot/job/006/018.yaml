- from: వాటి గమనపు దారులు మెలికలు తిరిగి దూరమవుతాయి[a]; అవి బీడు ప్రదేశంలోకి పైకి వెళ్లి నశిస్తాయి.
  to: వాటి ప్రవాహ మార్గాలు మెలికలు తిరుగుతాయి[a]; అవి పైకి ఎక్కి నిర్జన ప్రదేశంలోకి వెళ్లి నశిస్తాయి.
  rationale: The revision replaces an opaque Telugu construct with a natural expression suited to the immediate wadi/stream context, smooths the syntax of the second clause, and preserves the Hebrew’s difficult imagery rather than resolving it into an interpretive paraphrase. The alternative caravan understanding remains explicitly available in the footnote.
