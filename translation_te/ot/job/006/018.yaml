translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన శైలి పాటించబడింది. అసలు హెబ్రీలోని కఠినమైన రూపకాన్ని ప్రధాన పాఠ్యంలో నిలిపి, వర్తక బృందాలకు సంబంధించిన ప్రత్యామ్నాయ పఠనాన్ని పాదసూచికలో ఇచ్చాం.
