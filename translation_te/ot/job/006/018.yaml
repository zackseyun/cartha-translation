source:
  edition: WLC
  text: יִ֭לָּ֣פְתוּ אָרְח֣וֹת דַּרְכָּ֑/ם יַעֲל֖וּ בַ/תֹּ֣הוּ וְ/יֹאבֵֽדוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/006/018.yaml
  text: The paths of their course wind away[a]; they go up into wasteland and perish.
translation:
  language: te
  text: వాటి ప్రవాహ మార్గాలు మెలికలు తిరుగుతాయి[a]; అవి పైకి ఎక్కి నిర్జన ప్రదేశంలోకి వెళ్లి నశిస్తాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరో అనువాదం: “వర్తక బృందాల బాటలు పక్కకు మళ్లుతాయి; అవి నిర్జన ప్రదేశంలోకి వెళ్లి కనుమరుగవుతాయి.” ఇక్కడి హెబ్రీ రూపకం అర్థం చేసుకోవడం కష్టం. కొందరు ఈ వాక్యం దారులు లేదా నీటి ప్రవాహ మార్గాల గురించి కాకుండా, ప్రయాణించే వర్తక బృందాల గురించే చెబుతోందని భావిస్తారు.'
    reason: alternative_reading
lexical_decisions:
- source_word: יִלָּפְתוּ
  choice: మెలికలు తిరిగి దూరమవుతాయి
  rationale: నిఫాల్ క్రియ ఇక్కడ మెలికలు తిరగడం లేదా పక్కకు మళ్లడం అనే భావాన్ని ఇస్తుంది. వాగుల ప్రవాహ మార్గాల సందర్భంలో ఈ ప్రయోగం సహజంగా ఉండి, అవి ఆశించిన దిశనుంచి దూరమవుతున్న చిత్రాన్ని నిలుపుతుంది.
- source_word: אָרְחוֹת
  choice: దారులు
  rationale: ఈ పదానికి సాధారణంగా దారులు లేదా బాటలు అనే అర్థం. సందర్భంలో ఇది వాగుల ప్రవాహ మార్గాలను సూచించగలదు; వర్తక బృందాల బాటలు అనే భిన్న అవగాహనను పాదసూచికలో ఉంచాం.
- source_word: דַּרְכָּם
  choice: వాటి గమనపు
  rationale: ‘వాటి మార్గం/గమనం’ అనే భావాన్ని ఇచ్చి, ముందున్న ‘దారులు’తో అసహజమైన పునరుక్తిని తగ్గిస్తుంది. నీటి ప్రవాహ దిశ అనే సందర్భాన్నీ సరిపడా వ్యక్తం చేస్తుంది.
- source_word: יַעֲלוּ
  choice: పైకి వెళ్లి
  rationale: עלה అనే క్రియలోని పైకి వెళ్లడం లేదా ఎక్కడం అనే స్పష్టమైన చలనార్థాన్ని నిలిపాం. కఠినమైన రూపకాన్ని ‘అదృశ్యమవుతాయి’ అని ముందుగానే వ్యాఖ్యానించలేదు.
- source_word: בַתֹּהוּ
  choice: బీడు ప్రదేశంలోకి
  rationale: תֹהוּ సూచించే శూన్యత, నిర్జనత, పాడుబడిన విస్తీర్ణం అనే భావాలకు ‘బీడు ప్రదేశం’ సహజమైన ఆధునిక తెలుగు సమానార్థకం. בַ ఉపసర్గను చలన సందర్భంలో ‘లోకి’గా అనువదించాం.
- source_word: וְיֹאבֵדוּ
  choice: నశిస్తాయి
  rationale: אבד క్రియలోని నశించడం, కనుమరుగవడం లేదా పోగొట్టబడడం అనే బలమైన భావాన్ని ‘నశిస్తాయి’ నిలుపుతుంది; ఎడారిలో నీరు అంతరించిపోయే చిత్రానికి ఇది సరిపోతుంది.
