  yaml_path: translation/ot/job/006/025.yaml
  text: How forceful are upright words! But what does reproof from you prove?[a]
translation:
  language: te
  text: నిజాయితీగల మాటలు ఎంత ప్రభావవంతమైనవి! అయితే మీ నుండి వచ్చే గద్దింపు ఏమి నిరూపిస్తుంది?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నిజాయితీగల మాటలు ఎంత బాధాకరమైనవి! అయితే మీ వాదన ఏమి నిరూపిస్తుంది?” మొదటి భాగంలోని హీబ్రూ పదానికి “బాధాకరమైనవి,” “ఒప్పించగలవి,” లేదా “బలమైనవి” అనే భావఛాయలు ఉండవచ్చు; రెండో భాగంలోని పదాలు “వాదన,” “గద్దింపు,” లేదా “సరిదిద్దడం” అనే భావాలను కూడా ఇవ్వవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה נִּמְרְצוּ
  choice: ఎంత బలమైనవి
  rationale: מַה ఇక్కడ తీవ్రతను తెలిపే ఆశ్చర్యార్థక ప్రయోగం. נמרצו యొక్క బలం, ప్రభావం అనే భావాన్ని ‘బలమైనవి’ సహజంగా వ్యక్తపరుస్తుంది; ‘బాధాకరమైనవి’ లేదా ‘ఒప్పించగలవి’ అనే సాధ్యమైన ఛాయలను పాదటిప్పణిలో ఉంచాం.
- source_word: אִמְרֵי יֹשֶׁר
  choice: న్యాయమైన మాటలు
  rationale: יֹשֶׁר లోని నేరుతనం, సత్యనిష్ఠ, సరిగా ఉండడం అనే భావాలను ‘న్యాయమైన’ తెలియజేస్తుంది; అక్షరార్థానికి దగ్గరగా ఉండి ఆధునిక తెలుగులో సహజంగా ఉంటుంది.
- source_word: וּמַה
  choice: అయితే ... ఏమి
  rationale: రెండు భాగాల మధ్య ఉన్న వ్యత్యాసాన్ని తెలుగులో సహజంగా చూపేందుకు సంధిని ‘అయితే’గా అనువదించాం.
- source_word: יוֹכִיחַ הוֹכֵחַ
  choice: గద్దింపు ఏమి నిరూపిస్తుంది
  rationale: יכח ధాతువుకు నిరూపించడం, వాదించడం, గద్దించడం లేదా సరిదిద్దడం వంటి అర్థాలు ఉన్నాయి. ఇక్కడ స్నేహితుల గద్దింపు వాస్తవంగా ఏమి స్థాపిస్తుందనే యోబు సవాలును ‘ఏమి నిరూపిస్తుంది’ స్పష్టంగా అందిస్తుంది; మూలంలోని పదప్రయోగాన్ని తెలుగులో బలవంతంగా పునరావృతం చేయలేదు.
- source_word: מִכֶּם
  choice: మీ నుండి వచ్చే
  rationale: מן మూలం లేదా ఉద్భవాన్ని సూచిస్తుంది. ‘మీ నుండి వచ్చే’ అనే రూపం ఆ సంబంధాన్ని స్పష్టంగా, సహజంగా తెలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. హీబ్రూలోని పదార్థ అనిశ్చితిని ప్రధాన పాఠ్యంలో అతిగా పరిష్కరించకుండా, ప్రత్యామ్నాయ భావాలను పాదటిప్పణిలో భద్రపరిచాం.
