  yaml_path: translation/ot/job/006/002.yaml
  text: Oh[a], that my vexation were fully weighed[b], and my calamity lifted together in the balances.
translation:
  language: te
  text: అయ్యో, నా మనస్తాపం పూర్తిగా తూయబడితే[a], నా విపత్తును దానితో కలిపి త్రాసులో ఉంచితే[b] ఎంత బాగుండునో!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నా వేదన’ అని కూడా అనువదించవచ్చు. హీబ్రూ పదం అంతరంగ వేదన, మనస్తాపం, విసుగు లేదా ఆగ్రహాన్ని సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: ‘త్రాసు పళ్లెములపై’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: לוּ
  choice: ఎంత బాగుండేది!
  rationale: నెరవేరని బలమైన కోరికను లేదా విలాపపూర్వక ఆకాంక్షను తెలుపుతుంది. తెలుగు వాక్యాంతంలో ఈ రూపం సహజంగా ఆ భావోద్వేగ బలాన్ని వ్యక్తం చేస్తుంది.
- source_word: שָׁקוֹל יִשָּׁקֵל
  choice: పూర్తిగా తూయబడితే
  rationale: అనంతక్రియతో కూడిన సమాపక క్రియ తూచడాన్ని బలపరుస్తుంది. ‘పూర్తిగా’ ఆ ఉద్ఘాటనను సహజమైన తెలుగులో అందిస్తుంది; కర్మణి రూపాన్ని కూడా నిలుపుతుంది.
- source_word: כַּעְשִׂי
  choice: నా మనస్తాపం
  rationale: ఈ పదం అంతరంగ వేదన, కలత, విసుగు లేదా ఆగ్రహాన్ని సూచించగలదు. యోబు విలాప సందర్భంలో ‘మనస్తాపం’ దాని భావవ్యాప్తిని అతిగా కుదించకుండా సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וְהַוָּתִי
  choice: నా విపత్తు
  rationale: వినాశకరమైన ఆపద లేదా దుర్ఘటనను సూచించే పదం. ‘విపత్తు’ యోబు అనుభవించిన బాహ్య దుస్థితిని స్పష్టంగా తెలియజేస్తుంది.
- source_word: בְּמֹאזְנַיִם
  choice: త్రాసు పళ్లెములపై
  rationale: మూలంలోని ద్వివచన రూపం త్రాసు అనే తూకపు సాధనాన్ని సూచిస్తుంది. ‘త్రాసు పళ్లెములపై’ అనేది తూయబడే దృశ్యాన్ని ఆధునిక తెలుగులో స్పష్టంగా ఇస్తుంది.
- source_word: יִשְׂאוּ
  choice: ఉంచబడితే
  rationale: పదశః ‘ఎత్తుతారు/మోస్తారు.’ త్రాసు సందర్భంలో తూయడానికి పళ్లెములపై ఉంచడమే ఉద్దేశిత భావం; తెలుగులో కర్మణి రూపం పేర్కొనని కర్తను నిలుపుతుంది.
- source_word: יָחַד
  choice: కూడా దానితోపాటు
  rationale: మనస్తాపం మరియు విపత్తు రెండూ కలిపి ఒకే తూకంలో ఉండడాన్ని స్పష్టం చేస్తుంది.
theological_decisions:
- issue: כַּעְשִׂי అనే పదంలో వేదన మరియు ఆగ్రహం రెండింటి సంభావ్యత
  choice: ప్రధాన పాఠ్యంలో ‘మనస్తాపం’
  alternative: ‘నా వేదన’ లేదా ‘నా ఆగ్రహం’
  rationale: సందర్భం యోబు బాధను ముందుకు తెస్తున్నా, మూలపదం ఆగ్రహం/విసుగు ఛాయను కూడా కలిగి ఉండగలదు. ‘మనస్తాపం’ ఈ ఉద్రిక్తతను కొంతవరకు నిలుపుతుంది; పాదటిప్పణి ఇతర అర్థాలను తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కవితాత్మక వాక్యనిర్మాణం వాడబడింది. మూలంలోని కోరిక/విలాప భావం వాక్యాంతంలోని ‘ఎంత బాగుండేది!’ ద్వారా, తూకపు రూపకం ‘త్రాసు పళ్లెములపై’ ద్వారా స్పష్టంగా నిలుపబడింది.
