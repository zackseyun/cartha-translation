  text: Is my strength the strength of stones[a], or is my flesh bronze?
translation:
  language: te
  text: నా బలం రాళ్ల బలమా? నా మాంసం కంచువంటిదా?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “నా మాంసం కంచా?” అని ఉంది. ‘మాంసం’ అనే పదం మానవ బలహీనతకూ లోహంలాంటి కాఠిన్యానికీ మధ్య ఉన్న వ్యత్యాసాన్ని నిలుపుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: …మా?
  rationale: ఇక్కడ אִם షరతును కాక అలంకారిక ప్రశ్నను పరిచయం చేస్తుంది; తెలుగులో ప్రశ్నార్థక ప్రత్యయం సహజంగా ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: כֹּחַ אֲבָנִים כֹּחִי
  choice: నా బలం రాళ్ల బలమా?
  rationale: כֹּחַ పదపునరుక్తిని ‘బలం’తో నిలిపి, אֲבָנִים అనే బహువచనంలోని స్పష్టమైన రాళ్ల రూపకాన్ని కాపాడుతుంది.
- source_word: בְּשָׂרִי
  choice: నా శరీరం
  rationale: మూలంలో అక్షరార్థంగా ‘నా మాంసం’; ఇక్కడ అది యోబు భౌతిక దేహాన్ని సూచిస్తుంది. సాధారణ ఆధునిక తెలుగులో ‘నా శరీరం’ సహజంగా ఉండి భావాన్ని స్పష్టంగా అందిస్తుంది; అక్షరార్థాన్ని పాదటిప్పణిలో తెలియజేస్తాం.
- source_word: נָחוּשׁ
  choice: కంచు
  rationale: ఈ పదం రాగి లేదా కంచును సూచించగలదు; రాళ్ల కాఠిన్యంతో సమాంతరంగా ఉన్న సందర్భంలో ‘కంచు’ లోహసదృశ దృఢత్వాన్ని సహజంగా వ్యక్తం చేస్తుంది.
