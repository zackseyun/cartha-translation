translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, యోబు పలికే రెండు అలంకారిక ప్రశ్నల సమాంతరతను, కవితాత్మక గాంభీర్యాన్ని కాపాడాం. రెండవ ప్రశ్నలో సహజమైన తెలుగు కోసం ‘చేసిందా?’ చేర్చబడింది; మూలంలోని ‘నా మాంసం కంచా?’ అనే సంక్షిప్త రూపం పాదటిప్పణిలో నిలిపాం.
