source:
  edition: WLC
  text: מִֽי יִ֭תֵּן תָּב֣וֹא שֶֽׁאֱלָתִ֑/י וְ֝/תִקְוָתִ֗/י יִתֵּ֥ן אֱלֽוֹהַּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/006/008.yaml
  text: Oh[a], that my request would come, and that God would grant my hope.
translation:
  language: te
  text: నా విన్నపం నెరవేరితే ఎంత బాగుండునో![a] దేవుడు నేను ఆశించినది ఇస్తే ఎంత బాగుండునో!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఒకవేళ నా విన్నపం నెరవేరి, దేవుడు నేను ఆశించినది ఇస్తే ఎంత బాగుండునో!’
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי יִתֵּן
  choice: ఎంత బాగుండునో!
  rationale: ఈ హీబ్రూ పదబంధం అక్షరార్థ ప్రశ్నగా కాక, బలమైన కోరికను తెలిపే ఆశార్థక నుడికారంగా పనిచేస్తుంది. తెలుగు విలాప స్వరంలో ‘ఎంత బాగుండునో!’ ఆ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: תָּבוֹא
  choice: నెరవేరితే
  rationale: అక్షరార్థంగా ‘వస్తే’ అయినప్పటికీ, ‘మనవి’తో కలిసినప్పుడు తెలుగులో ‘నెరవేరితే’ అనడం కోరినది సిద్ధించాలనే భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: שֶׁאֱלָתִי
  choice: నా మనవి
  rationale: ఈ నామవాచకం అభ్యర్థన లేదా విన్నపాన్ని సూచిస్తుంది. ‘మనవి’ స్పష్టమైన, గౌరవప్రదమైన ఆధునిక తెలుగు పదం.
- source_word: וְתִקְוָתִי
  choice: నేను ఆశించేదాన్ని
  rationale: తִּקְוָה అంటే ‘ఆశ’ లేదా ‘ఎదురుచూపు.’ ఇక్కడ అది దేవుడు ఇవ్వగల కోరుకున్న విషయాన్ని సూచిస్తున్నందున, ‘నేను ఆశించేదాన్ని’ అనేది తెలుగులో సహజంగా ఉంటుంది.
- source_word: יִתֵּן
  choice: అనుగ్రహిస్తే
  rationale: క్రియకు అక్షరార్థం ‘ఇస్తే.’ దేవుడు కోరుకున్నదాన్ని ఇవ్వడం అనే సందర్భంలో ‘అనుగ్రహిస్తే’ భావాన్ని సహజంగా, గౌరవప్రదంగా అందిస్తుంది.
- source_word: אֱלוֹהַּ
  choice: దేవుడు
  rationale: ఇది యోబు గ్రంథంలో తరచుగా కనిపించే ‘దేవుడు’ అనే ఏకవచన సాధారణ పదం; ‘సర్వశక్తిమంతుడు’ వంటి అదనపు భావాన్ని చేర్చలేదు.
theological_decisions:
- issue: ‘నా ఆశ’ అనే అమూర్త నామవాచకాన్ని దేవుడు ‘ఇవ్వడం’
  choice: నేను ఆశించేదాన్ని దేవుడు అనుగ్రహిస్తే
  alternative: నా ఆశను దేవుడు నెరవేరిస్తే
  rationale: మూలంలోని ‘ఇవ్వు’ అనే క్రియను నిలుపుకుంటూనే, యోబు ఆశిస్తున్న విషయాన్ని దేవుడు ప్రసాదించాలనే భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది; ఆశకు సంబంధించిన విషయమేమిటో ఈ వచనంలో ముందుగానే నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, విలాపానికి తగిన గౌరవప్రదమైన ఆశార్థక శైలిని వాడాం. రెండు సమాంతర పాదాల్లోని బలమైన కోరికను పునరుక్తి ద్వారా నిలిపాం.
