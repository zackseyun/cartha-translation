translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కవితా వాక్య నిర్మాణం వాడబడింది. ‘నా ప్రాణం’ ద్వారా మూలంలోని נפש పదానికి ఉన్న విస్తృత భావాన్ని ప్రధాన పాఠ్యంలో నిలిపి, ‘నా ఆకలి’ అనే సందర్భోచిత ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం. రెండో పాదంలోని క్లిష్టమైన హీబ్రూ నిర్మాణాన్ని ప్రధాన పాఠ్యంలో అర్థమయ్యేలా చేసి, దాని నిజమైన సందిగ్ధతను పాదసూచికలో సంరక్షించాం.
