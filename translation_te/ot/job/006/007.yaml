  yaml_path: translation/ot/job/006/007.yaml
  text: My soul refuses to touch them[b][a]; they are like the sickness of my food.
translation:
  language: te
  text: వాటిని ముట్టుకోవడానికి నా ప్రాణం నిరాకరిస్తోంది[a]; అవి నాకు జబ్బు పట్టిన ఆహారంలా ఉన్నాయి[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వాటిని ముట్టుకోవడానికి నా ఆకలి నిరాకరిస్తోంది.” ఇక్కడి హీబ్రూ పదం ‘ప్రాణం,’ ‘వ్యక్తి,’ లేదా కొన్ని సందర్భాల్లో ‘ఆకలి’ అని అర్థమివ్వగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “అవి నాకు అసహ్యకరమైన ఆహారంలా ఉన్నాయి,” లేదా మరింత అక్షరార్థంగా, “అవి నా ఆహారపు జబ్బులా ఉన్నాయి.” హీబ్రూ వ్యక్తీకరణ సంక్షిప్తంగానూ అర్థనిర్ణయం కష్టంగానూ ఉంది.
    reason: alternative_reading
lexical_decisions:
- source_word: מֵאֲנָה
  choice: నిరాకరిస్తోంది
  rationale: మאן అనే క్రియలోని ‘తిరస్కరించు, ఇష్టపడకపోవు’ అనే సంకల్పపూర్వక భావాన్ని వర్తమాన కవితా సందర్భంలో సహజంగా తెలియజేస్తుంది.
- source_word: לִנְגּוֹעַ
  choice: ముట్టుకోవడానికి
  rationale: נגע యొక్క ప్రాథమిక అర్థమైన ‘ముట్టుకొను’ను నేరుగా నిలుపుతూ, ముందున్న అసహ్యకరమైన వాటిపట్ల యోబు విరక్తిని తెలియజేస్తుంది.
- source_word: נַפְשִׁי
  choice: నా ప్రాణం
  rationale: נפש సూచించగల వ్యక్తి, ప్రాణం, అంతరంగం, ఆకలి అనే విస్తృత భావపరిధిని పూర్తిగా ‘ఆకలి’కే పరిమితం చేయకుండా ఉంచుతుంది.
- source_word: הֵמָּה
  choice: అవి
  rationale: మునుపటి వచనంలో చెప్పిన అసహ్యకరమైన వాటిని తిరిగి సూచించే హీబ్రూ సర్వనామానికి సహజమైన తెలుగు రూపం.
- source_word: כִּדְוֵי
  choice: జబ్బు పట్టిన ... లా
  rationale: דוה తో సంబంధమున్న అనారోగ్య భావాన్ని నిలుపుతూ, తెలుగులో అర్థమయ్యే ఉపమానంగా అందిస్తుంది; మూలంలోని సంక్షిప్తమైన, క్లిష్టమైన నిర్మాణాన్ని పాదసూచికలో తెలియజేస్తుంది.
- source_word: לַחְמִי
  choice: ఆహారం
  rationale: לחם అక్షరార్థంగా ‘రొట్టె’ అయినా విస్తృతంగా ‘ఆహారం’ను సూచించగలదు; ఈ సందర్భంలో ‘ఆహారం’ సాధారణ భావాన్ని సహజంగా అందిస్తుంది.
