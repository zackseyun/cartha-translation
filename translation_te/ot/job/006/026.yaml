source:
  edition: WLC
  text: הַ/לְ/הוֹכַ֣ח מִלִּ֣ים תַּחְשֹׁ֑בוּ וּ֝/לְ/ר֗וּחַ אִמְרֵ֥י נֹאָֽשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/006/026.yaml
  text: Do you think to reprove words[a], when the words of a despairing man are for the wind?
translation:
  language: te
  text: మీరు మాటలను తప్పుబట్టాలని అనుకుంటున్నారా? నిరాశలో ఉన్నవాని మాటలు గాలివంటివా?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “నిరాశలో ఉన్నవాని మాటలను గాలికి వదిలేయదగినవిగా భావించి, వాటిని తప్పుబట్టాలని అనుకుంటున్నారా?” హీబ్రూ వాక్యనిర్మాణం రెండవ భాగాన్ని స్వతంత్ర ప్రశ్నగా గానీ, ‘తప్పుబట్టాలని అనుకుంటున్నారా?’ అనే ప్రశ్నలో భాగంగా గానీ అర్థం చేసుకోవడానికి వీలు కల్పిస్తుంది.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַ/לְ/הוֹכַח
  choice: ఖండించాలని
  rationale: יכח అనే క్రియకు ఇక్కడ మాటలను తప్పుబట్టడం లేదా వాదనలో ఎదిరించడం అనే భావం ఉంది; ‘ఖండించడం’ ఆ ప్రతికూల, మూల్యాంకన భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: מִלִּים
  choice: మాటలను
  rationale: సాధారణమైన ‘మాటలు’ అనే అర్థాన్ని తీసుకుని, మూలంలోని సంక్షిప్తతను కాపాడుతుంది; ‘వట్టి మాటలు’ అని చేరిస్తే మూలంలో స్పష్టంగా లేని తృణీకార భావం అధికమవుతుంది.
- source_word: תַּחְשֹׁבוּ
  choice: అనుకుంటున్నారా
  rationale: חשב అంటే ఆలోచించడం, ఉద్దేశించడం, యోచించడం. అలంకారప్రశ్నలో ‘అనుకుంటున్నారా’ సహజంగా ఉండి, ఆలోచనతో పాటు ఉద్దేశ భావాన్నీ అనుమతిస్తుంది.
- source_word: וּ֝/לְ/ר֗וּחַ
  choice: గాలికే
  rationale: רוּחַను రూపకాత్మకమైన ‘గాలి’గానే ఉంచి, మాటలు క్షణికమైనవి లేదా పట్టించుకోదగనివి అన్న చిత్రాన్ని నిలుపుతుంది. ל ఉపసర్గలోని సంబంధం/గమ్యం భావాన్ని ‘గాలికే’ వ్యక్తం చేస్తుంది.
- source_word: אִמְרֵי
  choice: మాటలు
  rationale: אמר యొక్క బహువచన నిర్మాణరూపానికి ‘మాటలు’ సరళమైన సమానార్థకం; ముందు ఉన్న מִלִּיםతో సమాంతరతను కాపాడుతుంది.
- source_word: נֹאָשׁ
  choice: నిరాశలో ఉన్నవాని
  rationale: నిఫాల్ కృదంతం ఆశ కోల్పోయిన వ్యక్తిని సూచిస్తుంది. ‘నిరాశలో ఉన్నవాడు’ ఆధునిక తెలుగులో సహజంగా, వ్యక్తిగత వేదనను స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: రెండవ భాగపు వాక్యనిర్మాణ సంబంధం
  choice: ‘నిరాశలో ఉన్నవాని మాటలు గాలికే కదా?’ అనే స్వతంత్ర అలంకారప్రశ్నగా ప్రధాన పాఠంలో చూపడం
  alternative: ‘నిరాశలో ఉన్నవాని మాటలను గాలిగా ఎంచి, వాటిని ఖండించాలని అనుకుంటున్నారా?’ అని మొత్తం భాగాన్ని ఒకే ప్రశ్నలోని కర్మగా తీసుకోవడం
  rationale: హీబ్రూ వాక్యనిర్మాణం రెండింటినీ అనుమతిస్తుంది. ప్రధాన పాఠం మొదటి అవగాహనను సహజమైన తెలుగులో ఇస్తుంది; ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచి అసలు సందిగ్ధతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ‘గాలి’ అనే మూల రూపకాన్ని నిలిపి, వాక్యనిర్మాణ సందిగ్ధతను పాదటిప్పణిలో స్పష్టంగా సంరక్షించాం.
