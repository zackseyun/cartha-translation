translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలి వాడబడింది. ‘ఏమీలేనివారయ్యారు’ అనే రూపం అసాధారణ హెబ్రీ పాఠాన్ని సహజంగా తెలియజేస్తుంది; పాఠ్య సమస్యను పాదసూచిక స్పష్టంగా నమోదు చేస్తుంది.
