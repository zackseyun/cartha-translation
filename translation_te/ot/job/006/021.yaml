source:
  edition: WLC
  text: כִּֽי עַ֭תָּה הֱיִ֣יתֶם לא תִּֽרְא֥וּ חֲ֝תַ֗ת וַ/תִּירָֽאוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/006/021.yaml
  text: For now you have become nothing[a]; you see terror[b], and you are afraid.
translation:
  language: te
  text: ఎందుకంటే, ఇప్పుడు మీరు ఏమీలేనివారయ్యారు[a]; మీరు భీతిని చూసి భయపడుతున్నారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీ వ్రాతపాఠం అక్షరార్థంగా ‘మీరు కాదు అయ్యారు’ అన్నట్లుగా ఉంది. దీన్ని చాలామంది ‘మీరు ఏమీలేనివారయ్యారు’ అని, లేదా ముందటి వచనాల్లోని నమ్మదగని వాగులవలె ‘మీరు దానిలా అయ్యారు’ అని అర్థం చేసుకుంటారు.
    reason: textual_variant
  - marker: b
    text: లేదా, ‘విపత్తును చూసి భయపడుతున్నారు.’ ఇక్కడి నామవాచకం భీతి, దిగ్భ్రాంతి లేదా ఛిన్నాభిన్నం చేసే విపత్తును సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి వచనాల్లోని ఎండిపోయే వాగుల పోలిక ఆధారంగా యోబు చేస్తున్న వివరణను లేదా నిర్ధారణను పరిచయం చేస్తుంది.
- source_word: עַתָּה
  choice: ఇప్పుడు
  rationale: యోబు ఆశించిన సహాయానికి భిన్నంగా స్నేహితుల ప్రస్తుత వైఖరిని సూచించే కాలవాచకం.
- source_word: הֱיִיתֶם
  choice: అయ్యారు
  rationale: היה అనే క్రియ ఇక్కడ కేవలం ఉనికిని కాక, స్థితిలో వచ్చిన మార్పును సూచిస్తుంది.
- source_word: לא
  choice: ఏమీలేనివారు
  rationale: వ్రాయబడిన హెబ్రీ రూపం అక్షరార్థంగా ‘కాదు’ అని ఉన్నప్పటికీ, సందర్భంలో స్నేహితులు పనికిరానివారిగా తేలారనే భావం సహజంగా సరిపోతుంది; పాఠ్య అస్పష్టతను పాదసూచికలో నిలిపాం.
- source_word: תִּרְאוּ
  choice: చూసి
  rationale: ראה యొక్క ప్రాథమిక భావాన్ని నిలుపుతూ, యోబుకు సంభవించిన భయంకర పరిస్థితిని వారు గమనించడాన్ని సూచిస్తుంది.
- source_word: חֲתַת
  choice: భయంకరమైన దాన్ని
  rationale: ఈ నామవాచకం భీతి, దిగ్భ్రాంతి లేదా ఛిన్నాభిన్నం చేసే విపత్తును సూచించవచ్చు. తెలుగు ప్రధాన పాఠంలో ఈ భావాల మధ్య ఉన్న అస్పష్టతను సాధ్యమైనంతవరకు నిలిపే సహజమైన పదబంధాన్ని ఎంచుకున్నాం.
- source_word: וַתִּירָאוּ
  choice: భయపడుతున్నారు
  rationale: యోబు పరిస్థితిని చూసి స్నేహితులు చూపుతున్న ప్రస్తుత భయప్రతిస్పందనను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
