  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ֭/עַתָּה הוֹאִ֣ילוּ פְנוּ בִ֑/י וְ/עַל פְּ֝נֵי/כֶ֗ם אִם אֲכַזֵּֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/006/028.yaml
  text: But now[a], please turn to me, and before your faces[c][b], would I lie?
translation:
  language: te
  text: కానీ ఇప్పుడు దయచేసి నా వైపు చూడండి[a]; మీ సమక్షంలోనే[b] నేను అబద్ధం చెబుతానా[c]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నా వైపు తిరగండి.’
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘మీ ముఖాల ఎదుట’; అంటే ‘మీ సమక్షంలో’ లేదా ‘మీ ముఖం ఎదుటనే.’
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘నేను మోసం చేస్తానా?’ హీబ్రూ క్రియకు అబద్ధం చెప్పడం లేదా అసత్యంగా మాట్లాడడం అనే అర్థాలు రావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: కానీ ఇప్పుడు
  rationale: సందర్భంలో మునుపటి మాటలకు భిన్నంగా యోబు వెంటనే చేస్తున్న విజ్ఞప్తిని సూచిస్తుంది; కాలార్థాన్నీ సందర్భానుసారమైన వ్యతిరేక భావాన్నీ నిలుపుతుంది.
- source_word: הוֹאִילוּ
  choice: దయచేసి
  rationale: సమ్మతి లేదా సిద్ధతను కోరే ఆజ్ఞారూపం ఇక్కడ తరువాతి ఆజ్ఞను మర్యాదపూర్వక విజ్ఞప్తిగా చేస్తుంది.
- source_word: פְנוּ בִי
  choice: నా వైపు చూడండి
  rationale: మాట్లాడుతున్న వ్యక్తివైపు తిరిగి శ్రద్ధగా చూడమనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וְעַל פְּנֵיכֶם
  choice: మీ సమక్షంలోనే
  rationale: అక్షరార్థంలోని ‘మీ ముఖాల ఎదుట’ అనే దృశ్యాన్ని తెలుగులో సహజంగా, ప్రత్యక్షతను నొక్కిచెప్పే విధంగా అందిస్తుంది.
- source_word: אִם אֲכַזֵּב
  choice: నేను అబద్ధం చెబుతానా?
  rationale: אִם ఇక్కడ సాధారణ షరతుకన్నా సవాలుతో కూడిన అలంకారిక ప్రశ్నను ప్రవేశపెడుతుంది; כזב అసత్యం పలకడం లేదా మోసపూర్వకంగా మాట్లాడడం అనే భావాన్ని కలిగి ఉంది.
theological_decisions:
- issue: యోబు తన నిజాయితీని ఎలా ప్రతిపాదిస్తున్నాడు
  choice: ‘నేను అబద్ధం చెబుతానా?’ అనే అలంకారిక ప్రశ్నగా ఉంచడం
  alternative: ‘నేను అబద్ధం చెబితే’ అనే షరతుగా అనువదించడం
  rationale: హీబ్రూ אִם రూపరీత్యా షరతును సూచించగలిగినా, ఈ సందర్భంలో యోబు తన స్నేహితులు తనను నేరుగా చూసి తన మాట నిజమో కాదో తీర్చాలని సవాలు చేస్తున్నాడు. ప్రశ్నారూపం ఆ సందర్భబలాన్ని అందిస్తుంది; అయితే షరతు ఛాయను పూర్తిగా సిద్ధాంతపరంగా పరిష్కరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో మర్యాదపూర్వకమైనప్పటికీ సవాలుతో కూడిన యోబు స్వరాన్ని నిలిపాం. ‘మీ ముఖాల ఎదుట’ అనే అక్షరానువాదం ప్రధాన వాక్యంలో అసహజంగా ఉండటంతో ‘మీ సమక్షంలోనే’ అని ఇచ్చి, మూలంలోని రూపకాన్ని పాదటిప్పణిలో భద్రపరిచాం.
