source:
  edition: WLC
  text: אַ֭חַ/י בָּגְד֣וּ כְמוֹ נָ֑חַל כַּ/אֲפִ֖יק נְחָלִ֣ים יַעֲבֹֽרוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/006/015.yaml
  text: My brothers have dealt treacherously like a wadi[a], like the channels of wadis that pass away,
translation:
  language: te
  text: 'నా సోదరులు ఎడారి వాగులా[a] ద్రోహంగా ప్రవర్తించారు;

    కనుమరుగైపోయే ఎడారి వాగుల ప్రవాహ మార్గాల్లా ఉన్నారు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వాగులా ... వాగుల ప్రవాహ మార్గాల్లా.” హీబ్రూ נחל అనే పదం వాగు, వరదనీరు ప్రవహించే లోయ, లేదా కాలానుగుణ జలమార్గం అని అర్థమివ్వగలదు. ఇక్కడి పొడి ప్రాంతపు దృశ్యాన్ని తెలియజేయడానికి “ఎడారి వాగు” అని అనువదించాం.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחַי
  choice: నా సోదరులు
  rationale: మూలపదానికి అక్షరార్థం ‘నా సోదరులు.’ సందర్భంలో ఇది సన్నిహిత సహచరులను కూడా సూచించవచ్చు; అయినా కుటుంబ సంబంధ పదాన్నే ప్రధాన పాఠ్యంలో నిలిపాం.
- source_word: בָּגְדוּ
  choice: నమ్మకద్రోహంగా ప్రవర్తించారు
  rationale: ఈ క్రియ సంబంధంలో విశ్వాసఘాతుకంగా, మోసపూరితంగా ప్రవర్తించడాన్ని సూచిస్తుంది. ఒక నిర్దిష్ట ద్రోహ చర్యగా అతిగా వివరించకుండా దాని నైతిక బలాన్ని ఈ రూపం నిలుపుతుంది.
- source_word: נָחַל / נְחָלִים
  choice: ఎడారి వాగు / ఎడారి వాగులు
  rationale: ఇక్కడ శాశ్వతంగా ప్రవహించే నది కాకుండా, వర్షకాలంలో ప్రవహించి తరువాత ఎండిపోయే పొడి ప్రాంతపు జలమార్గం ఉద్దేశించబడింది. ‘ఎడారి వాగు’ ఆ భౌగోళిక చిత్రాన్ని సాధారణ తెలుగు పాఠకునికి స్పష్టంగా అందిస్తుంది.
- source_word: כַאֲפִיק
  choice: ప్రవాహమార్గాల్లా
  rationale: אפיק నీరు ప్రవహించే కాలువ, పడక లేదా మార్గాన్ని సూచిస్తుంది. ‘ప్రవాహమార్గాలు’ జలసంబంధ రూపకాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: יַעֲבֹרוּ
  choice: కనుమరుగైపోయే
  rationale: మూలక్రియకు ప్రాథమికంగా ‘దాటిపోవు/గతించిపోవు’ అనే అర్థం ఉంది. కాలానుగుణ వాగులు ప్రవహించి తరువాత లేకపోవడమే సందర్భంలోని భావం; ‘కనుమరుగైపోయే’ వాటి అశాశ్వతత్వాన్ని తెలియజేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. ‘వాడి’ అనే అపరిచిత అరబిక్ భౌగోళిక పదానికి బదులుగా ‘ఎడారి వాగు’ వాడి, ప్రత్యామ్నాయ అర్థాన్ని పాదసూచికలో ఇచ్చాం. హీబ్రూ కవితలోని రెండు సమాంతర పోలికలను రెండు పాదాలుగా నిలిపాం.
