  text: Does a wild donkey bray over grass[b][a], or does an ox low over its fodder?
translation:
  language: te
  text: పచ్చిక ఉన్నప్పుడు అడవి గాడిద[a] ఓండ్ర పెడుతుందా? తన మేత[b] ఉన్నప్పుడు ఎద్దు రంకె వేస్తుందా?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పదం ప్రత్యేకంగా అడవి గాడిదను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడి హీబ్రూ పదం కలిపి సిద్ధం చేసిన పశువుల మేతను లేదా మేతముద్దను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיִנְהַק
  choice: ఓండ్ర పెడుతుందా?
  rationale: נהק గాడిద చేసే ప్రత్యేక ధ్వనిని సూచిస్తుంది. ఆధునిక తెలుగులో ‘ఓండ్ర పెట్టడం’ సహజమైన, నిర్దిష్టమైన సమానార్థక ప్రయోగం.
- source_word: פֶּרֶא
  choice: అడవి గాడిద
  rationale: ఈ పదం అడవిలో నివసించే గాడిదను, అంటే onagerను సూచిస్తుంది. ‘అడవి గాడిద’ సాధారణ పాఠకులకు స్పష్టంగా ఉంటుంది.
- source_word: עֲלֵי דֶשֶׁא
  choice: పచ్చిక దొరికినప్పుడు
  rationale: అక్షరార్థంగా ‘పచ్చిక మీద/దగ్గర’ అనే భావం ఉన్నా, ప్రశ్నలో పచ్చిక అందుబాటులో ఉన్న పరిస్థితి ఉద్దేశించబడింది. తెలుగులో ‘దొరికినప్పుడు’ ఆ సందర్భాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: אִם
  choice: (రెండవ ప్రశ్నగా)
  rationale: జతగా వచ్చిన అలంకారిక ప్రశ్నల్లో אִם రెండవ ప్రత్యామ్నాయాన్ని పరిచయం చేస్తుంది. తెలుగులో విడి ప్రశ్నల సమాంతర నిర్మాణమే ‘లేక’ అనే భావాన్ని సహజంగా అందిస్తుంది.
- source_word: יִגְעֶה
  choice: రంకె వేస్తుందా?
  rationale: געה పశువు చేసే లోతైన అరుపును సూచిస్తుంది. ఎద్దు ధ్వనికి ‘రంకె వేయడం’ సహజమైన తెలుగు ప్రయోగం.
- source_word: שׁוֹר
  choice: ఎద్దు
  rationale: ఏకవచనంలోని గోవుజాతి పశువును సూచించే ఈ పదానికి సందర్భానుకూలమైన సాధారణ తెలుగు పదం ‘ఎద్దు’.
- source_word: עַל בְּלִילוֹ
  choice: తన మేత దొరికినప్పుడు
  rationale: בְּלִיל కలిపిన పశువుల మేతను సూచిస్తుంది; ప్రత్యయాన్ని ‘తన’గా చూపించాం. ఆ మేత అందుబాటులో ఉన్న సందర్భాన్ని తెలుగులో సహజంగా వ్యక్తం చేయడానికి ‘దొరికినప్పుడు’ వాడాం.
