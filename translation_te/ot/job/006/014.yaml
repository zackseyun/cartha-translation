  yaml_path: translation/ot/job/006/014.yaml
  text: Kindness from his friend is due to one who is despairing[b][a], even if he forsakes the fear of the Almighty.
translation:
  language: te
  text: నిరాశతో కుంగిపోతున్నవానికి అతని స్నేహితుని నుండి దయ[a] లభించాలి—అతడు సర్వశక్తిమంతుని పట్ల భయభక్తిని విడిచిపెట్టినా సరే.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “దయ” అని అనువదించిన חֶסֶד పదానికి విశ్వసనీయ ప్రేమ, కరుణ, నిబద్ధత అనే భావాలు కూడా ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “నిరాశతో కుంగిపోతున్నవానికి దయ చూపని స్నేహితుడు సర్వశక్తిమంతుని పట్ల భయభక్తిని విడిచిపెడతాడు.” హీబ్రూ వాక్యనిర్మాణం సంక్షిప్తంగా ఉన్నందున ఈ విధంగానూ అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמָּס
  choice: నిరాశతో కుంగిపోతున్నవానికి
  rationale: మూలపదంలోని ‘కరిగిపోవడం, కూలిపోవడం’ అనే రూపకాన్ని మానసికంగా కుంగిపోతున్న బాధితునికి అన్వయిస్తూ, సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: מֵרֵעֵהוּ
  choice: అతని స్నేహితుని నుండి
  rationale: מִן సూచించే మూలాన్ని, అలాగే మూడవ పురుష ఏకవచన ప్రత్యయాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: חָסֶד
  choice: దయ
  rationale: ఈ మానవ సంబంధ సందర్భంలో కరుణతో వ్యక్తమయ్యే నమ్మకమైన ఆదరణను సహజంగా తెలియజేస్తుంది; విశ్వసనీయ ప్రేమ, కరుణ అనే విస్తృత భావపరిధిని పాదటిప్పణిలో ఉంచాం.
- source_word: וְיִרְאַת שַׁדַּי
  choice: సర్వశక్తిమంతుని పట్ల భయభక్తులను
  rationale: దేవునిపట్ల భయం మరియు భక్తిపూర్వక గౌరవం రెండూ కలిగిన యִרְאָה భావాన్ని తెలుగులో స్థిరమైన బైబిలు ప్రయోగంతో అందిస్తుంది.
- source_word: יַעֲזֹב
  choice: విడిచిపెట్టినా
  rationale: עזב అనే ‘వదలడం, విడిచిపెట్టడం’ భావాన్ని నిలుపుతూ, ఎంపిక చేసిన అన్వయంలో చివరి ఉపవాక్యాన్ని concessive భావంతో సహజంగా కలుపుతుంది.
- source_word: שַׁדַּי
  choice: సర్వశక్తిమంతుడు
  rationale: యోబు గ్రంథంలో ఈ దైవ బిరుదుకు ప్రామాణికమైన, సులభంగా అర్థమయ్యే తెలుగు అనువాదం.
theological_decisions:
- issue: చివరి ఉపవాక్యపు వాక్యనిర్మాణ సంబంధం
  choice: నిరాశతో కుంగిపోతున్న వ్యక్తి సర్వశక్తిమంతుని పట్ల భయభక్తులను విడిచిపెట్టినా, అతనికి స్నేహితుని దయ లభించాలి.
  alternative: కుంగిపోతున్నవానికి దయ చూపని స్నేహితుడు సర్వశక్తిమంతుని పట్ల భయభక్తులను విడిచిపెడతాడు.
  rationale: హీబ్రూ వాక్యనిర్మాణం సంక్షిప్తంగా ఉండి రెండు అన్వయాలకు వీలు కల్పిస్తుంది. ప్రధాన పాఠంలోని అన్వయం యోబు తన బాధలో స్నేహితుల విశ్వసనీయ ఆదరణను ఆశిస్తున్న సమీప సందర్భానికి సరిపోతుంది; ముఖ్యమైన ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయితే యోబు గ్రంథానికి తగిన గంభీరతతో రచించబడింది. మూలంలోని రూపకాన్ని ‘నిరాశతో కుంగిపోతున్నవాడు’గా సహజీకరించి, భయభక్తులు అనే స్థిరమైన ఆధ్యాత్మిక పదబంధాన్ని ఉపయోగించాం.
