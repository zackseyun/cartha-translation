source:
  edition: WLC
  text: הֲֽ/כִי אָ֭מַרְתִּי הָ֣בוּ לִ֑/י וּ֝/מִ/כֹּחֲ/כֶ֗ם שִׁחֲד֥וּ בַעֲדִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/006/022.yaml
  text: Have I ever said[a], ‘Give to me,’ or, ‘From your strength[b], pay a bribe on my behalf’?”
translation:
  language: te
  text: “‘నాకు ఇవ్వండి’ అని గానీ, ‘మీ వనరులలోనుండి నా తరఫున లంచం చెల్లించండి’ అని గానీ నేను ఎప్పుడైనా అన్నానా?[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “మీ బలంతో నా తరఫున కానుక ఇవ్వండి” అని కూడా అనువదించవచ్చు. ఇక్కడ “వనరులు”గా అనువదించిన హీబ్రూ పదానికి అక్షరార్థం “బలం”; చెల్లింపు సందర్భంలో అది స్తోమత, సాధనాలు లేదా సంపదను సూచించవచ్చు. “లంచం చెల్లించండి” అనే క్రియను కొందరు మరింత సాధారణంగా “కానుక ఇవ్వండి” లేదా “చెల్లింపు చేయండి” అని అర్థం చేసుకుంటారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲכִי אָמַרְתִּי
  choice: నేను ఎప్పుడైనా అన్నానా?
  rationale: ప్రశ్నార్థక కణాలు సందర్భంలో యోబు తాను అలాంటి కోరిక చేయలేదని బలంగా నిరాకరించే అలంకారిక ప్రశ్నను సూచిస్తున్నాయి. ఆధునిక తెలుగులో ‘ఎప్పుడైనా ... అన్నానా?’ ఆ భావాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: הָבוּ לִי
  choice: నాకు ఇవ్వండి
  rationale: బహువచన ఆజ్ఞారూపాన్ని, పరోక్ష కర్మను నేరుగా మరియు సహజంగా నిలుపుతుంది.
- source_word: וּמִכֹּחֲכֶם
  choice: మీ ఆస్తిలోనుండి
  rationale: כֹּחַ యొక్క మూలార్థం ‘బలం/శక్తి’; అయితే చెల్లింపు సందర్భంలో అది వ్యక్తి సాధనాలు లేదా ఆస్తిని సూచించే అవకాశమే ఎక్కువ. తెలుగులో ‘మీ బలంలోనుండి’ అసహజంగా ఉండటంతో సందర్భోచిత అర్థాన్ని ప్రధాన పాఠ్యంలో ఇచ్చాం.
- source_word: שִׁחֲדוּ
  choice: లంచం చెల్లించండి
  rationale: ఈ క్రియ ‘లంచం/కానుక’ అనే నామవాచకంతో సంబంధమున్నది. దాని లావాదేవీ సంబంధిత, నైతికంగా తీవ్ర స్వరాన్ని మృదువుచేయకుండా నిలుపుతుంది.
- source_word: בַעֲדִי
  choice: నా తరఫున
  rationale: ‘నా కోసం/నా పక్షంగా’ అనే ప్రతినిధిత్వ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన అలంకారిక ప్రశ్నగా అనువదించబడింది. మూలంలోని ఆర్థిక పదాల అస్పష్టతను ప్రధాన పాఠ్యం మరియు పాదటిప్పణి ద్వారా నిలుపుకున్నాం.
