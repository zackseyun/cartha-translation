  text: or[b][a], ‘Deliver me from the hand of the adversary,’ and ‘Redeem me from the hand of the ruthless’?”
translation:
  language: te
  text: లేదా, ‘విరోధి చేతిలోనుండి నన్ను తప్పించండి; క్రూరుల చేతిలోనుండి నన్ను విమోచించండి[a]’ అని నేను అడిగానా?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “క్రూరుల చేతిలోనుండి వెల చెల్లించి నన్ను విడిపించండి.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמַלְּטוּנִי
  choice: నన్ను తప్పించండి
  rationale: మלט హిఫిల్ ఆజ్ఞారూపం ప్రమాదం లేదా శత్రువు ఆధీనంనుండి తప్పించడాన్ని సూచిస్తుంది. ‘తప్పించండి’ ఆధునిక తెలుగులో సహజంగా ఉండి, కలిగించే-తప్పించు భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: מִיַּד
  choice: చేతిలోనుండి
  rationale: హెబ్రీయులో ఇది ఒకరి శక్తి లేదా ఆధీనంనుండి విడుదలను సూచించే సజీవమైన నుడికారం. తెలుగులోనూ ‘చేతిలోనుండి’ అర్థవంతంగా, సహజంగా ఉంది.
- source_word: צָר
  choice: విరోధి
  rationale: צָר శత్రుత్వం చూపే వ్యక్తిని సూచిస్తుంది. ‘విరోధి’ ఏకవచనాన్ని, విస్తృతమైన శత్రుత్వ భావాన్ని కాపాడుతుంది; సైనిక శత్రువనే అర్థానికి పరిమితం చేయదు.
- source_word: עָרִיצִים
  choice: క్రూరులు
  rationale: ఈ బహువచన నామవాచకం నిర్దయగా, హింసాత్మకంగా లేదా అణచివేసేలా ప్రవర్తించేవారిని సూచిస్తుంది. ‘క్రూరులు’ దాని నైతిక బలాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: תִּפְדּוּנִי
  choice: నన్ను విమోచించండి
  rationale: פדה మూల్యమిచ్చి విడిపించడం లేదా బంధం/ఆపదనుండి విడుదల చేయడం అనే భావాన్ని కలిగి ఉంది. ‘విమోచించండి’ మొదటి అర్ధపాదంలోని ‘తప్పించండి’తో ఉన్న పదభేదాన్ని నిలుపుతుంది; ఇక్కడ తప్పనిసరిగా ఆధ్యాత్మిక విమోచన మాత్రమే ఉద్దేశించబడలేదు.
theological_decisions:
- issue: ఆరాధనా లేదా రక్షణశాస్త్ర సందర్భం కాని చోట פדה అనువాదం
  choice: విమోచించండి
  alternative: విడిపించండి / వెల చెల్లించి విడిపించండి
  rationale: హెబ్రీ పదం ఆపద లేదా బంధంనుండి విడుదలను కూడా సూచిస్తుంది. ‘విమోచించండి’ మూలపద ప్రత్యేకతను కాపాడుతుంది; అయితే దీనికి అనవసరంగా సిద్ధాంతపరమైన అర్థాన్ని మోపకుండా సందర్భం సాధారణ విడుదలగానే చదవాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన బహువచన ఆజ్ఞారూపాలు వాడబడ్డాయి. 21–23 వచనాల కొనసాగుతున్న అలంకారప్రశ్నను తెలియజేయడానికి ‘లేదా’ మరియు చివర ‘అని నేను అడిగానా?’ చేర్చబడ్డాయి; ఉద్ధరణలోని రెండు అభ్యర్థనలు సెమీకోలన్‌తో సమాంతరంగా ఉంచబడ్డాయి.
