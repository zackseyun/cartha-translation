  - marker: b
    text: ‘వాటి’ అనేది ముందటి వచనాల్లో చెప్పిన కాలానుగుణ నీటి ప్రవాహాలను సూచిస్తుంది.
    reason: cross_reference
  - marker: c
    text: ‘బిడారులు’ అని అనువదించిన హీబ్రూ పదానికి అక్షరార్థంగా ‘దారులు’ లేదా ‘మార్గాలు’ అని కూడా అర్థం రావచ్చు; ఇక్కడ అది ఆ మార్గాల్లో ప్రయాణించే బృందాలను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִבִּיטוּ
  choice: చూశారు
  rationale: נבט ధాతువు చూడడం లేదా దృష్టి నిలపడం అనే భావాన్ని ఇస్తుంది. నీటి ప్రవాహాల కోసం వెదుకుతున్న సందర్భంలో సరళమైన ‘చూశారు’ సహజంగా ఉంది.
- source_word: אָרְחוֹת
  choice: బిడారులు
  rationale: ఈ పదం అక్షరార్థంగా ‘దారులు’ అని అర్థమివ్వగలిగినా, ఇక్కడ షేబా ప్రయాణికులతో ఉన్న సమాంతర నిర్మాణం వల్ల ఆ దారుల్లో ప్రయాణించే వర్తక బృందాలను సూచిస్తుంది.
- source_word: תֵּמָא
  choice: తేమా
  rationale: స్థలనామాన్ని ఆధునిక ప్రామాణిక తెలుగు లిప్యంతరీకరణలో ఇచ్చాం.
- source_word: הֲלִיכֹת
  choice: ప్రయాణికులు
  rationale: అక్షరార్థంగా ‘ప్రయాణాలు/వెళ్లేవి’ అనే భావమున్నా, సందర్భంలో ప్రయాణం చేసే వారిని సూచించే రూపకప్రయోగం. ‘ప్రయాణికులు’ సమాంతర భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: שְׁבָא
  choice: షేబా
  rationale: స్థలనామాన్ని తెలుగు లిప్యంతరీకరణలో ఇచ్చాం.
- source_word: קִוּוּ
  choice: ఆశగా ఎదురుచూశారు
  rationale: קוה అనే క్రియ ఆశించడం లేదా నిరీక్షించడం అనే రెండూ భావాలను కలిగి ఉంటుంది. నీటి కోసం ఆశతో వేచివున్న ఎడారి ప్రయాణికుల సందర్భంలో ఈ సంయుక్త వ్యక్తీకరణ రెండు భావఛాయలనూ సహజంగా నిలుపుతుంది.
- source_word: לָמוֹ
  choice: వాటికోసం
  rationale: ఈ సర్వనామం ముందటి వచనాల్లో చెప్పిన కాలానుగుణ ప్రవాహాలను సూచించే అవకాశం ఉంది. వాటిని పేరుపెట్టి స్పష్టీకరించకుండా సర్వనామ సంబంధాన్ని నిలిపాం.
