  text: తేమా బిడారులు చూశారు[c][b]; షెబా ప్రయాణికులు వాటికోసం ఆశతో ఎదురుచూశారు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘వాటికోసం నిరీక్షించారు.’ హీబ్రూ క్రియ ఆశించడాన్నీ, ఆశతో వేచి ఉండడాన్నీ సూచించగలదు.
