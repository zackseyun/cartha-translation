  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన ప్రశ్నార్థక కవితా శైలిని వాడాం. ‘నాలుక,’ ‘అంగిలి’ అనే శరీరావయవ రూపకాలను మూలానికి అనుగుణంగా నిలిపి, הַוּוֹת పదంలోని విపత్తు/నైతిక వక్రత ద్వంద్వార్థాన్ని పాదటిప్పణిలో భద్రపరిచాం.
