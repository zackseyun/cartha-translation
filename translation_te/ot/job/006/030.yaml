translation:
  language: te
  text: 'నా నాలుక మీద అన్యాయం ఉందా?


    నా అంగిలి వినాశకరమైన వాటిని గుర్తించదా?[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “విపత్తులను” లేదా “వక్రమైన విషయాలను.” హీబ్రూ పదం వినాశకరమైన కీడులను లేదా విపత్తులను సూచించవచ్చు; నైతికంగా వక్రమైన విషయాలను కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיֵשׁ
  choice: ఉందా?
  rationale: అలంకారిక అవును–కాదు ప్రశ్నను తెలుగులో సహజంగా, సంక్షిప్తంగా వ్యక్తపరుస్తుంది.
- source_word: בִּלְשׁוֹנִי
  choice: నా నాలుక మీద
  rationale: మాటను సూచించే శరీరావయవ రూపకాన్ని వ్యాఖ్యానించి తొలగించకుండా నిలుపుతుంది.
- source_word: עַוְלָה
  choice: అన్యాయం
  rationale: ఈ పదంలోని నైతిక తప్పు, అవినీతి భావాలను గంభీరమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: אִם
  choice: రెండవ ప్రశ్నగా వ్యక్తీకరణ
  rationale: ఇక్కడ ఈ పదం మొదటి ప్రశ్నకు సమాంతరమైన రెండవ అలంకారిక ప్రశ్నను ప్రవేశపెడుతుంది; తెలుగులో ప్రత్యేకంగా ‘అయితే’ అని అనువదించడం అసహజం.
- source_word: חִכִּי
  choice: నా అంగిలి
  rationale: రుచి చూడడం ద్వారా వివేచించే అవయవానికి సంబంధించిన స్పష్టమైన రూపకాన్ని కాపాడుతుంది.
- source_word: לֹא יָבִין
  choice: గుర్తించలేదా?
  rationale: అంగిలి రూపకంతో కలిసి, తేడాను గ్రహించి వివేచించడం అనే భావాన్ని సహజ తెలుగులో అందిస్తుంది.
- source_word: הַוּוֹת
  choice: వినాశకరమైన వాటిని
  rationale: హీబ్రూ బహువచనం విపత్తులు లేదా నాశనం కలిగించే విషయాలను సూచించగలదు; ఈ ఎంపిక ఆ విస్తృతిని కాపాడుతూ తెలుగులో సహజంగా ఉంటుంది.
