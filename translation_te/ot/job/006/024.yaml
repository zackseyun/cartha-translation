  text: Teach me[a], and I will be silent; make me understand how I have gone astray.
translation:
  language: te
  text: నాకు బోధించండి, అప్పుడు నేను మౌనంగా ఉంటాను; నేను ఏ విషయంలో తప్పు చేశానో నాకు అర్థమయ్యేలా చేయండి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הוֹרוּנִי
  choice: నాకు బోధించండి
  rationale: ירה ధాతువు హిఫిల్ రూపంలో సాధారణంగా ‘బోధించు/ఉపదేశించు’ అనే అర్థం ఇస్తుంది. యోబు తన స్నేహితుల నుంచి నిజమైన దిద్దుబాటును కోరుతున్న సందర్భానికి ఇది సహజంగా సరిపోతుంది.
- source_word: וַאֲנִי אַחֲרִישׁ
  choice: అప్పుడు నేను మౌనంగా ఉంటాను
  rationale: హీబ్రూ సంధానం సందర్భంలో ఫలిత భావాన్ని కలిగిస్తుంది; אַחֲרִישׁ అంటే ‘మౌనంగా ఉండడం.’ తెలుగు వాక్యంలో ‘అప్పుడు’ షరతు-ఫలిత సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וּמַה שָּׁגִיתִי
  choice: నేను దేనిలో తప్పిపోయానో
  rationale: מַה అక్షరార్థంగా ‘ఏమి/దేనిలో’ అనే ప్రశ్నను సూచిస్తుంది; שׁגה అంటే తప్పు చేయడం లేదా దారి తప్పడం. ‘దేనిలో తప్పిపోయానో’ మూలంలోని ప్రశ్నాత్మక అస్పష్టతను, దారి తప్పిన రూపక భావాన్ని రెండింటినీ నిలుపుతుంది.
- source_word: הָבִינוּ לִי
  choice: నాకు అర్థమయ్యేలా చేయండి
  rationale: בין హిఫిల్ ఆజ్ఞారూపం అవగాహన కలిగించమనే కారణార్థక భావాన్ని వ్యక్తం చేస్తుంది. ఈ తెలుగు రూపం ఆ భావాన్ని స్పష్టంగా, సహజంగా అందిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన బహువచన ఆజ్ఞారూపాలు వాడబడ్డాయి. కవితాత్మక గంభీరతను ఉంచుతూ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్యనిర్మాణం ఎంచుకోబడింది.
