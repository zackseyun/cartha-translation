review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the plural imperatives, Job’s stated response of silence, and the causative request for understanding. However, “తప్పిపోయానో” can naturally suggest being lost or missing one’s way in Telugu more than committing an error; the Hebrew שׁגה here concerns the error Job is challenged to identify. “ఏ విషయంలో తప్పు చేశానో” expresses this contextual sense more precisely while retaining the source’s open question.
  naturalness: The sentence is clear and appropriately dignified in modern standard Telugu. Replacing “దేనిలో తప్పిపోయానో” with “ఏ విషయంలో తప్పు చేశానో” improves idiomatic clarity. “అప్పుడు” naturally conveys the consequent sense in Telugu and is acceptable for the Hebrew conjunction in context.
  terminology: “బోధించండి,” “మౌనంగా ఉంటాను,” and “నాకు అర్థమయ్యేలా చేయండి” are suitable, respectful, and semantically faithful choices. The revised wording avoids an unintended Telugu ambiguity without introducing theological interpretation.
  issues:
  - severity: low
    issue: “తప్పిపోయానో” is potentially ambiguous in modern Telugu.
    rationale: It may be understood as ‘got lost’ rather than ‘erred.’ In this context Job asks his friends to identify the matter in which he has erred, so “ఏ విషయంలో తప్పు చేశానో” is clearer and remains faithful to the Hebrew question.
  revised_text: నాకు బోధించండి, అప్పుడు నేను మౌనంగా ఉంటాను; నేను ఏ విషయంలో తప్పు చేశానో నాకు అర్థమయ్యేలా చేయండి.
  revised_footnotes: []
