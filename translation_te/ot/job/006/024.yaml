- from: నాకు బోధించండి, అప్పుడు నేను మౌనంగా ఉంటాను; నేను దేనిలో తప్పిపోయానో నాకు అర్థమయ్యేలా చేయండి.
  to: నాకు బోధించండి, అప్పుడు నేను మౌనంగా ఉంటాను; నేను ఏ విషయంలో తప్పు చేశానో నాకు అర్థమయ్యేలా చేయండి.
