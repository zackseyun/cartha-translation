- from: వారు దానిని నమ్ముకున్నారు కాబట్టి సిగ్గుపడ్డారు; దాని దగ్గరికి[b] వచ్చి తలవంపులయ్యారు[a].
  to: వారు ఆశ పెట్టుకున్నారు కాబట్టి సిగ్గుపడ్డారు; అక్కడికి[b] వచ్చి అవమానపడ్డారు[a].
  rationale: The revision avoids supplying an explicit object for בטח, gives a natural Telugu expression for reliance/expectation in context, and represents the two Hebrew shame verbs with related but distinct Telugu terms. It also corrects the destination nuance and places each footnote marker at its proper referent.
