  text: בֹּ֥שׁוּ כִּֽי בָטָ֑ח בָּ֥אוּ עָ֝דֶ֗י/הָ וַ/יֶּחְפָּֽרוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/006/020.yaml
  text: They are ashamed because they trusted[b][a]; they came there and were disappointed.
translation:
  language: te
  text: వారు ఆశ పెట్టుకున్నారు కాబట్టి సిగ్గుపడ్డారు; అక్కడికి[b] వచ్చి అవమానపడ్డారు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘తలవంపులయ్యారు,’ ‘ఖంగుతిన్నారు,’ లేదా ‘సిగ్గుతో ముఖం వాల్చారు.’ హీబ్రూలో సిగ్గు, అవమానాలకు సంబంధించిన రెండు క్రియలు ఉన్నాయి; రెండో క్రియను ‘అవమానానికి గురయ్యారు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘దాని దగ్గరికి వచ్చారు’; ఇది ముందటి సందర్భంలో చెప్పిన కాలానుగుణంగా ప్రవహించే వాగును సూచిస్తుంది.
    reason: cross_reference
lexical_decisions:
- source_word: בֹּשׁוּ
  choice: సిగ్గుపడ్డారు
  rationale: בוש అనే క్రియ ఇక్కడ సిగ్గు పడడం లేదా ఆశాభంగంతో అవమానానికి గురికావడం అనే ఫలితభావాన్ని సూచిస్తుంది. ‘సిగ్గుపడ్డారు’ మూలపదానికి నేరమైన, సహజమైన తెలుగు సమానం.
- source_word: כִּי
  choice: కాబట్టి
  rationale: ఇక్కడ כִּי వారి సిగ్గుకు కారణాన్ని తెలియజేస్తుంది. తెలుగు వాక్యనిర్మాణంలో ‘నమ్ముకున్నారు కాబట్టి’ సహజంగా causal సంబంధాన్ని చూపుతుంది.
- source_word: בָטָח
  choice: నమ్ముకున్నారు
  rationale: రూపం వ్యాకరణపరంగా ఏకవచనమైనప్పటికీ, ముందు వెనుక ఉన్న బహువచన క్రియలు ప్రయాణికుల సమూహాన్నే సూచిస్తున్నాయి. తెలుగులో బహువచన కర్తను కొనసాగిస్తూ ‘నమ్ముకున్నారు’ అని ఇవ్వడం సందర్భార్థాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: בָּאוּ
  choice: వచ్చి
  rationale: בוא అనే సాధారణ ‘రావడం’ క్రియను తెలుగు వాక్యప్రవాహానికి అనుగుణంగా ‘వచ్చి’ అని అనుసంధాన రూపంలో ఇచ్చాం.
- source_word: עָדֶיהָ
  choice: దాని దగ్గరికి
  rationale: స్త్రీలింగ ప్రత్యయం ముందటి సందర్భంలోని వాగు/కాలువను తిరిగి సూచిస్తుంది. తెలుగులో ‘దాని దగ్గరికి’ గమ్యభావాన్ని సహజంగా వ్యక్తం చేస్తుంది; మూలంలోని సూచనను పాదటిప్పణి స్పష్టం చేస్తుంది.
- source_word: וַיֶּחְפָּרוּ
  choice: తలవంపులయ్యారు
  rationale: חפר ఇక్కడ అవమానం, కలవరపాటు, ఆశాభంగం కలిసిన భావాన్ని ఇస్తుంది. ‘తలవంపులయ్యారు’ మొదటి క్రియలోని సిగ్గు భావంతో సంబంధాన్ని నిలుపుతూ, రెండో క్రియ యొక్క తీవ్ర అవమానభావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గంభీరమైన శైలిని ఉపయోగించాం. ‘తలవంపులయ్యారు’ అనే పదబంధం అవమానం మరియు ఆశాభంగం రెండింటినీ సూచిస్తూ, హీబ్రూలోని పరస్పర సంబంధమున్న రెండు shame verbs మధ్య స్వల్ప భేదాన్ని నిలుపుతుంది.
