lexical_decisions:
- source_word: וַיַּעַן
  choice: జవాబిచ్చాడు
  rationale: ענה ధాతువు సంభాషణలో ముందటి మాటకు ప్రతిస్పందనను పరిచయం చేస్తుంది. ‘జవాబిచ్చాడు’ సహజమైన ఆధునిక తెలుగు ప్రయోగంగా ఆ భావాన్ని నిలుపుతుంది.
- source_word: אִיּוֹב
  choice: యోబు
  rationale: వ్యక్తి పేరును ప్రామాణిక తెలుగు బైబిల్ లిప్యంతరీకరణ ప్రకారం ఇచ్చాం.
- source_word: וַיֹּאמַר
  choice: ఇలా
  rationale: హీబ్రూ సంభాషణ సూత్రంలోని ‘అని చెప్పాడు’ అనే భావాన్ని తెలుగులో ‘ఇలా జవాబిచ్చాడు’ అనే సహజ నిర్మాణంలో వ్యక్తం చేశాం; దీనివల్ల אמר యొక్క వాక్యప్రవేశ విధి నిలుస్తుంది, అనవసర పునరుక్తి తప్పుతుంది.
- source_word: וַ
  choice: అప్పుడు
  rationale: ప్రారంభ వావ్ కథన క్రమాన్ని సూచిస్తుంది. ‘అప్పుడు’ ముందటి ప్రసంగానికి యోబు ఇచ్చిన ప్రతిస్పందనను సహజంగా అనుసంధానిస్తుంది; ‘మరియు’ కూడా సాధ్యమైన ప్రత్యామ్నాయం.
