source:
  edition: WLC
  text: מִ֭י לֹא יָדַ֣ע בְּ/כָל אֵ֑לֶּה כִּ֥י יַד יְ֝הוָה עָ֣שְׂתָה זֹּֽאת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/012/009.yaml
  text: Who among all these does not know that the hand of Yahweh has done this?[a]
translation:
  language: te
  text: వీటన్నిటిలో దేనికి యాహ్వే[a] హస్తం దీనిని చేసిందని తెలియదు?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూలో: ‘YHWH’; సంప్రదాయంగా ‘ప్రభువు’ అని అనువదిస్తారు.'
    reason: దైవనామపు మూలరూపం మరియు సంప్రదాయ అనువాదాన్ని తెలియజేయడం.
lexical_decisions:
- source_word: מִי לֹא יָדַע
  choice: ఏది ... ఎరుగదు?
  rationale: ఇది అలంకారప్రశ్న. ముందున్న సందర్భంలో జంతువులు, పక్షులు, భూమి, చేపలు ప్రస్తావించబడుతున్నందున, ఆధునిక తెలుగులో వాటిని సూచించడానికి ‘ఎవరు’ కంటే ‘ఏది’ సహజం. יָדַע యొక్క ‘తెలుసుకొను/ఎరుగు’ భావాన్ని గంభీరమైనప్పటికీ సులభంగా అర్థమయ్యే ‘ఎరుగు’తో వ్యక్తం చేశాం.
- source_word: בְּ/כָל אֵלֶּה
  choice: వీటన్నిటిలో
  rationale: בְּ ఇక్కడ సమూహంలోనిది అనే భావాన్ని ఇవ్వగలదు; అందువల్ల ‘వీటన్నిటిలో’ అని అనువదించడం ‘among all these’ అనే పఠనాన్ని సహజంగా నిలుపుతుంది.
- source_word: כִּי
  choice: అని
  rationale: తెలిసిన విషయాన్ని పరిచయం చేసే content particleగా כִּיని తెలుగులో సహజమైన ‘అని’తో అనువదించాం.
- source_word: יַד יְהוָה
  choice: యాహ్వే హస్తమే
  rationale: ‘చెయ్యి’ అనే మానవరూపకాన్ని తొలగించి కేవలం ‘శక్తి’ అని చెప్పకుండా, మూలంలోని ‘హస్తం’ రూపకాన్ని నిలిపాం. ‘మే’ దైవిక కర్తృత్వంపై వాక్యంలోని ఉద్దేశిత బలాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పండిత లిప్యంతరీకరణ ‘Yahweh’కు అనుగుణంగా ‘యాహ్వే’ అని ఇచ్చాం.
- source_word: עָשְׂתָה זֹּאת
  choice: దీనిని చేసిందని
  rationale: עָשָׂה యొక్క విస్తృతమైన ‘చేయు’ భావాన్ని, ఏకవచన సూచకసర్వనామం זֹאתను నేరుగా నిలుపుతూ ‘దీనిని చేసింది’ అని అనువదించాం.
theological_decisions:
- issue: దైవనామం יהוהను ఎలా అనువదించాలి
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో బిరుదు కాక దేవుని వ్యక్తిగత నామమైన יהוה ఉంది. అందువల్ల దానిని ‘యాహ్వే’గా లిప్యంతరీకరించి, సంప్రదాయ ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో తెలిపాం.
- issue: ‘యాహ్వే హస్తం’ అనే మానవరూపకాన్ని నిలుపాలా
  choice: హస్తం అనే రూపకాన్ని నిలిపాం
  alternative: యాహ్వే శక్తి
  rationale: మూలంలోని יַד దైవిక కార్యసాధకత్వం, శక్తి రెండింటినీ సూచించే ఉద్దేశపూర్వక రూపకం. ‘శక్తి’ అని మాత్రమే అనువదిస్తే ఆ చిత్రణ తగ్గిపోతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకునికి అర్థమయ్యే గంభీరమైన శైలిని వాడాం. ‘ఎరుగదు’, ‘హస్తం’ స్వల్ప సాహిత్య గౌరవాన్ని కలిగించినా విస్తృతంగా అర్థమయ్యే పదాలు. అలంకారప్రశ్న స్వరూపాన్ని అలాగే ఉంచాం.
