source:
  edition: WLC
  text: הֵ֣ן יַ֭הֲרוֹס וְ/לֹ֣א יִבָּנֶ֑ה יִסְגֹּ֥ר עַל אִ֝֗ישׁ וְ/לֹ֣א יִפָּתֵֽחַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/012/014.yaml
  text: Look[a], if he tears down, it cannot be rebuilt; if he shuts a man in[b], it cannot be opened.
translation:
  language: te
  text: చూడండి[a], ఆయన కూలదోస్తే, అది తిరిగి కట్టబడదు; ఆయన ఒక మనిషిని లోపల బంధిస్తే[b], అది తెరవబడదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘నిజంగా’ లేదా ‘ఇదిగో.’
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘ఒక మనిషిని లోపల మూసివేస్తే’ లేదా ‘నిర్బంధిస్తే.’
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: చూడండి
  rationale: ఈ అవ్యయం శ్రద్ధను ఆకర్షిస్తూ వాక్యాన్ని బలంగా ప్రవేశపెడుతుంది. ఆధునిక తెలుగులో ‘చూడండి’ సహజంగా ఈ ఉద్దేశాన్ని వ్యక్తం చేస్తుంది; ప్రత్యామ్నాయ భావాలను పాదసూచికలో ఉంచాం.
- source_word: יַהֲרוֹס
  choice: కూలదోస్తే
  rationale: הרס అనేది కట్టడాన్ని పడగొట్టడం లేదా ధ్వంసం చేయడం అనే భావాన్ని ఇస్తుంది. తరువాత వచ్చే ‘కట్టబడదు’తో ఉన్న నిర్మాణ రూపకాన్ని ‘కూలదోస్తే’ నిలుపుతుంది.
- source_word: וְלֹא יִבָּנֶה
  choice: అది తిరిగి కట్టబడదు
  rationale: בנה నిఫాల్ రూపం కర్మణి భావంలో ‘కట్టబడడం’ అని సూచిస్తుంది. సందర్భంలో ముందుగా కూలదోయబడినదే ఉద్దేశం కాబట్టి ‘తిరిగి’ సహజంగా పునర్నిర్మాణ భావాన్ని స్పష్టం చేస్తుంది; అసాధ్య ఫలితాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: יִסְגֹּר עַל אִישׁ
  choice: ఒక మనిషిని లోపల బంధిస్తే
  rationale: סגר మరియు עַל אִישׁ కలయిక ఒక మనిషిని మూసిన స్థలంలో ఉంచడం లేదా నిర్బంధించడం అనే భావాన్ని ఇస్తుంది. ‘లోపల బంధిస్తే’ స్పష్టమైన మూసివేత చిత్రాన్ని నిలుపుతూ, అధికారిక కారాగార శిక్ష అనే అదనపు భావాన్ని రుద్దదు.
- source_word: וְלֹא יִפָּתֵחַ
  choice: అది తెరవబడదు
  rationale: פתח నిఫాల్ రూపం కర్మణి భావంలో ‘తెరవబడడం’ అని సూచిస్తుంది. ‘అది తెరవబడదు’ మూసివేత రూపకాన్ని, అలాగే ముందు భాగంలోని ‘కట్టబడదు’తో సమాంతర నిర్మాణాన్ని నిలుపుతుంది.
theological_decisions:
- issue: దైవిక కర్తను సూచించడం
  choice: ఆయన
  alternative: దేవుడు / యెహోవా
  rationale: ఈ వచనంలో హెబ్రీ పాఠం దైవనామాన్ని లేదా బిరుదును ప్రత్యక్షంగా ఉపయోగించకుండా మూడవ పురుష ఏకవచన క్రియలను వాడుతుంది. సందర్భంలో యోబు దేవుని గురించి మాట్లాడుతున్నందున ‘ఆయన’ సంభాషణ ప్రవాహాన్ని నిలుపుతుంది; మూలంలో లేని పేరును చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని ఉపయోగించాం. కూలదోయడం–తిరిగి కట్టబడకపోవడం, బంధించడం–తెరవబడకపోవడం అనే హెబ్రీ సమాంతర చిత్రాలను సాధ్యమైనంత స్పష్టంగా నిలిపాం.
