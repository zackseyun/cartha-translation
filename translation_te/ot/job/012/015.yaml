source:
  edition: WLC
  text: הֵ֤ן יַעְצֹ֣ר בַּ/מַּ֣יִם וְ/יִבָ֑שׁוּ וִֽ֝/ישַׁלְּחֵ֗/ם וְ/יַ֖הַפְכוּ אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/012/015.yaml
  text: Look[a], if he holds back the waters, they dry up; if he sends them out, they overturn the earth.
translation:
  language: te
  text: ఇదిగో, ఆయన జలాలను అడ్డుకుంటే అవి ఎండిపోతాయి; వాటిని విడిచిపెడితే అవి భూమిని[a] అతలాకుతలం చేస్తాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నేలను” లేదా “దేశాన్ని.” హీబ్రూ పదం אָרֶץ సందర్భాన్ని బట్టి “భూమి,” “నేల,” లేదా “దేశం” అని అర్థం కావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: ఇదిగో
  rationale: శ్రద్ధను ఆకర్షిస్తూ బలమైన ప్రకటనను పరిచయం చేసే హీబ్రూ పదం. ఆధునిక తెలుగులో గంభీరతను, ఉద్ఘాటనను నిలుపుతుంది.
- source_word: יַעְצֹר בַּמַּיִם
  choice: జలాలను అడ్డుకుంటే
  rationale: עצר ఇక్కడ జలాలను నిలువరించడం లేదా ఆపడం అనే భావాన్ని ఇస్తుంది. షరతుతో కూడిన సమాంతర వాక్య నిర్మాణాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וְיִבָשׁוּ
  choice: అవి ఎండిపోతాయి
  rationale: బహువచన క్రియను ముందున్న జలాలతో అనుసంధానిస్తూ, హీబ్రూ వాక్యంలోని సంక్షిప్తతను నిలుపుతుంది.
- source_word: וִישַׁלְּחֵם
  choice: వాటిని విడిచిపెడితే
  rationale: సర్వనామ ప్రత్యయం ముందున్న జలాలను సూచిస్తుంది. జలాలపై దేవుని నియంత్రణను, వాటిని విడుదల చేయడాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: וְיַהַפְכוּ
  choice: అతలాకుతలం చేస్తాయి
  rationale: הפך సూచించే తలకిందులు చేయడం, విధ్వంసకరంగా కల్లోలం కలిగించడం అనే బలమైన భావాన్ని సహజమైన తెలుగు నుడికారంలో అందిస్తుంది.
- source_word: אָרֶץ
  choice: భూమిని
  rationale: జ్ఞానసాహిత్యంలోని విశాల సందర్భంలో దేవుని సార్వభౌమ శక్తిని సూచించేందుకు ‘భూమి’ సరిపోతుంది; అయితే ‘నేల/దేశం’ అనే పరిమిత అర్థం కూడా సాధ్యమే.
theological_decisions:
- issue: దేవుని సార్వభౌమత్వాన్ని వర్ణించే కవితాత్మక ప్రకటనలో אָרֶץ పరిధి
  choice: భూమిని
  alternative: నేలను లేదా దేశాన్ని
  rationale: జలాలను నిలువరించడం, విడుదల చేయడం ద్వారా కలిగే విస్తృత ప్రభావాన్ని ఈ వాక్యం వర్ణిస్తుంది. ‘భూమి’ విశ్వవ్యాప్త పరిధిని నిలుపుతుంది; అయినా ఒక నిర్దిష్ట ప్రళయ కథనాన్ని ఇందులోకి చేర్చదు, అలాగే స్థానిక ‘నేల/దేశం’ అర్థం సాధ్యమని పాదటిప్పణి తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గంభీరమైన కవితాత్మక శైలిని ఉపయోగించాం. ‘జలాలు’ అనే పదం హీబ్రూ బహువచన రూపాన్ని, వాక్యపు విశాల పరిధిని నిలుపుతుంది; ‘అతలాకుతలం చేస్తాయి’ విధ్వంసకరమైన తారుమారును సహజంగా వ్యక్తం చేస్తుంది.
