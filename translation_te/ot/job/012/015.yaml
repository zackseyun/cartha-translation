  terminology: “భూమి” אָרֶץ కు సందర్భానుకూలమైన ప్రధాన అనువాదం. పాదటిప్పణి “నేల” మరియు “దేశం” అనే సాధ్యమైన పరిమిత అర్థాలను సముచితంగా నమోదు చేస్తుంది; ఏ నిర్దిష్ట ప్రళయ-వ్యాఖ్యానాన్నీ బలవంతం చేయదు.
