  yaml_path: translation/ot/job/012/023.yaml
  text: He makes nations great[a], and he destroys them; he enlarges nations, and he leads them away.
translation:
  language: te
  text: ఆయన జనాలను గొప్పవిగా చేస్తాడు[a], వాటిని నాశనం చేస్తాడు; జనాలను విస్తరింపజేస్తాడు, వాటిని దూరంగా నడిపిస్తాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆయన జనాలను విస్తరింపజేస్తాడు, వాటిని నడిపిస్తాడు.” హీబ్రూ క్రియలను జనాల విస్తరణను అనుసరించి వాటిని నడిపించడం అని కూడా అర్థం చేసుకోవచ్చు; ప్రధాన పాఠం సందర్భంలో సంభావ్యమైన తిరోగమన సమాంతరతను ప్రతిబింబిస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: מַשְׂגִּיא
  choice: గొప్పవిగా చేస్తాడు
  rationale: שׂגא హిఫిల్ కృదంతంలోని కారణార్థాన్ని నిలుపుతూ, జనాలు గొప్ప స్థితికి చేరేలా చేయడాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: לַגּוֹיִם
  choice: జనాలను
  rationale: ఇక్కడ גּוֹיִם ఇశ్రాయేలేతరులను మాత్రమే కాక, విస్తృతంగా రాజకీయ ప్రజాసమూహాలను సూచిస్తుంది; ‘జనాలు’ ఆ విస్తృత భావాన్ని కాపాడుతుంది.
- source_word: וַיְאַבְּדֵם
  choice: వాటిని నాశనం చేస్తాడు
  rationale: אבד యొక్క కారణార్థమైన ‘నశింపజేయడం’ను సంక్షిప్తంగా తెలియజేస్తూ, మొదటి క్రియతో ఉన్న వ్యతిరేక సమాంతరతను నిలుపుతుంది.
- source_word: שֹׁטֵחַ
  choice: విస్తరింపజేస్తాడు
  rationale: שטח లోని పరచడం లేదా విస్తరించడం అనే చిత్రాన్ని, జనాల భూభాగం లేదా ప్రభావం పెరగడం అనే సందర్భార్థంతో సహజంగా అందిస్తుంది.
- source_word: וַיַּנְחֵם
  choice: వాటిని దూరంగా నడిపిస్తాడు
  rationale: נחה యొక్క ‘నడిపించు’ అనే ప్రాథమిక భావాన్ని నిలుపుతూ, ఈ సందర్భంలోని విస్తరణకు ప్రతికూలమైన మలుపును ‘దూరంగా’ అనే పదంతో సూచిస్తుంది; అయినా క్రియలోని మార్గనిర్దేశ భావం పూర్తిగా తొలగిపోదు.
theological_decisions:
- issue: రెండవ పాదంలో జనాల కదలికకు సంబంధించిన అర్థం
  choice: దేవుడు జనాలను విస్తరింపజేసి, తరువాత వాటిని దూరంగా నడిపిస్తాడు
  alternative: దేవుడు జనాలను విస్తరింపజేసి వాటికి మార్గం చూపుతాడు
  rationale: వాక్యం జనాల ఎదుగుదల, పతనాలపై దేవుని సార్వభౌమాధికారాన్ని చూపుతుంది. נחה అనుకూలమైన ‘మార్గం చూపు’ అనే భావాన్నీ కలిగి ఉండగలదు; అయితే నాశనం మరియు విస్తరణ-తిరోగమన సమాంతరతలో ‘దూరంగా నడిపిస్తాడు’ సందర్భంలోని ఉద్రిక్తతను మెరుగ్గా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కవితాత్మక గద్యరూపం. ‘జనాలు’ అనే పదం జాతి లేదా అన్యజనులనే పరిమిత భావాన్ని నివారిస్తుంది; పునరుక్తి హీబ్రూ సమాంతర నిర్మాణాన్ని నిలుపుతుంది.
