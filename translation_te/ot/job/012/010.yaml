source:
  edition: WLC
  text: אֲשֶׁ֣ר בְּ֭/יָד/וֹ נֶ֣פֶשׁ כָּל חָ֑י וְ֝/ר֗וּחַ כָּל בְּשַׂר אִֽישׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/012/010.yaml
  text: In whose hand is the life of every living thing[a], and the breath of all mankind.
translation:
  language: te
  text: ప్రతి జీవి ప్రాణమూ[a], మానవులందరి ఊపిరీ ఆయన చేతిలో ఉన్నాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ప్రతి జీవి ఆత్మ, సమస్త మానవుల శరీరాల్లోని ఆత్మ లేదా స్ఫూర్తి.”
    reason: נֶפֶשׁకు ‘ఆత్మ’, רוּחַకు ‘ఆత్మ/స్ఫూర్తి’, మరియు כָּל בְּשַׂר אִישׁకు ‘సమస్త మానవుల శరీరాలు’ అనే మరింత అక్షరార్థక ప్రత్యామ్నాయాలు సాధ్యమైనందున.
lexical_decisions:
- source_word: אֲשֶׁר בְּיָדוֹ
  choice: ఆయన చేతిలో
  rationale: సాపేక్ష పదమైన אֲשֶׁר ముందున్న దేవుణ్ణి సూచిస్తుంది. తెలుగులో సహజమైన వాక్య నిర్మాణం కోసం దాన్ని సర్వనామంతో కలిపి అనువదించాం; ‘చేతిలో’ అనే రూపకం అధికారం, అదుపు అనే భావాలను నిలుపుతుంది.
- source_word: נֶפֶשׁ
  choice: ప్రాణం
  rationale: ఇక్కడ ఈ పదం ప్రతి జీవిని సజీవంగా ఉంచే జీవాన్ని సూచిస్తుంది. ‘ఆత్మ’ అని అనువదిస్తే మూలంలో తప్పనిసరిగా లేని దేహం–ఆత్మ విభజనను పాఠకుడు గ్రహించే అవకాశం ఉంది.
- source_word: כָּל חָי
  choice: ప్రతి జీవి
  rationale: సజీవమైన వాటన్నిటినీ సమగ్రంగా సూచించే హెబ్రీ పదబంధానికి ఇది సహజమైన, విస్తృతార్థకమైన తెలుగు రూపం.
- source_word: וְרוּחַ
  choice: ఊపిరి
  rationale: נֶפֶשׁతో ఉన్న సమాంతర నిర్మాణంలో רוּחַ జీవాన్ని నిలిపే శ్వాసను సూచించే అవకాశం ఎక్కువ. ‘ఊపిరి’ దాని స్పష్టమైన జీవసంబంధ భావాన్ని అందిస్తుంది; ‘ఆత్మ’ అనే సాధ్యమైన అర్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: כָּל בְּשַׂר אִישׁ
  choice: మానవులందరి
  rationale: అక్షరార్థంగా ‘మనిషికి చెందిన సమస్త శరీరం/మాంసం’ అనే ఈ పదబంధం మరణశీల మానవజాతిని సమష్టిగా సూచిస్తుంది. ‘మానవులందరి’ ఆధునిక తెలుగులో స్పష్టంగా, సహజంగా ఆ సమష్టి భావాన్ని తెలియజేస్తుంది.
theological_decisions:
- issue: נֶפֶשׁ మరియు רוּחַ అనే మానవశాస్త్ర సంబంధ పదాలు
  choice: ‘ప్రాణం’, ‘ఊపిరి’ అని అనువదించాం.
  alternative: ‘ఆత్మ’, ‘ఆత్మ/స్ఫూర్తి’ అని అనువదించడం.
  rationale: ఈ సందర్భంలో దేవుని చేతిలో సమస్త జీవుల జీవమూ, మానవుల శ్వాసమూ ఉన్నాయనే భావం ప్రధానమైనది. స్పష్టమైన దేహం–ఆత్మ ద్వైతాన్ని మూలపాఠం కంటే ఎక్కువగా చేర్చకుండా, కవితా సమాంతరతను కాపాడే concrete పదాలను ఎంచుకున్నాం.
- issue: אִישׁలోని సాధారణ మానవ సూచన
  choice: ‘మానవులందరి’ అని సమష్టిగా అనువదించాం.
  alternative: ‘ప్రతి మనిషి’ లేదా మరింత అక్షరార్థంగా ‘సమస్త మానవ శరీరాల’ అని అనువదించడం.
  rationale: వ్యాకరణపరంగా పుంలింగ రూపం ఉన్నప్పటికీ, ఇక్కడ భావం మానవజాతి మొత్తాన్ని సూచిస్తుంది. ఎంపిక చేసిన రూపం ఆ సమగ్రతను స్పష్టంగా తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యేలా సహజమైన పదక్రమాన్ని వాడుతూ, ‘ఆయన చేతిలో’ అనే గంభీరమైన బైబిలు రూపకాన్ని నిలిపాం. ‘ప్రాణమూ… ఊపిరీ’ అనే జత హెబ్రీ కవితా సమాంతరతను తెలుగులో ప్రతిబింబిస్తుంది.
