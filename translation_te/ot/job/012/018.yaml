source:
  edition: WLC
  text: מוּסַ֣ר מְלָכִ֣ים פִּתֵּ֑חַ וַ/יֶּאְסֹ֥ר אֵ֝ז֗וֹר בְּ/מָתְנֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/job/012/018.yaml
  text: He loosens the bonds of kings and binds a belt around their waists[a][b].
translation:
  language: te
  text: ఆయన రాజుల బంధనాలను సడలిస్తాడు[a]; వారి నడుముల చుట్టూ నడికట్టు కడతాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “రాజుల క్రమశిక్షణను.” హీబ్రూ నామవాచకానికి “క్రమశిక్షణ/శిక్ష” లేదా “బంధనం” అనే అర్థాలు రావచ్చు; తరువాతి భాగంలోని “కడతాడు” అనే మాటకు సమాంతరంగా “బంధనాలు” ఇక్కడ బాగా సరిపోతుంది.
    reason: lexical_alternative
  - marker: b
    text: 'ఈ చిత్రం అవమానాన్ని లేదా అణచివేతను సూచించవచ్చు: దేవుడు రాజుల అధికారస్థానాన్ని తొలగించి, వారిని సామాన్యులవలె లేదా బందీలవలె కట్టివేస్తాడు. అయితే నడికట్టు కట్టడం కార్యానికి సిద్ధపరచడాన్ని కూడా సూచించగలదు.'
    reason: cultural_note
lexical_decisions:
- source_word: מוּסַר
  choice: బంధనాలు
  rationale: ఈ నామవాచకానికి ‘శిక్షణ/క్రమశిక్షణ’ అనే భావంతో పాటు ‘బంధనం’ అనే అర్థమూ ఉంది. తరువాత వచ్చే ‘కడతాడు’ అనే క్రియతో ఏర్పడే సడలించడం–కట్టడం వ్యతిరేక సమాంతరతలో ‘బంధనాలు’ అనే స్పష్టమైన అర్థం సహజంగా సరిపోతుంది.
- source_word: פִּתֵּחַ
  choice: సడలిస్తాడు
  rationale: మూలక్రియ అక్షరార్థంగా ‘తెరవడం’ లేదా ‘వదులు చేయడం’ అని సూచిస్తుంది. బంధనాలతో కలిసినప్పుడు ‘సడలిస్తాడు’ భౌతిక రూపకాన్ని నిలుపుతుంది.
- source_word: מְלָכִים
  choice: రాజులు
  rationale: హీబ్రూ పదానికి సాధారణమైన, నిర్దిష్టమైన అర్థం ‘రాజులు’; ‘పాలకులు’ అని విస్తరించాల్సిన అవసరం లేదు.
- source_word: וַיֶּאְסֹר
  choice: కడతాడు
  rationale: ఈ క్రియకు ‘కట్టు/బంధించు’ అనే అర్థం ఉంది. నడికట్టుతో తెలుగులో ‘కడతాడు’ సహజంగా ఉండి, మొదటి భాగంలోని ‘సడలిస్తాడు’కు వ్యతిరేక చిత్రాన్ని నిలుపుతుంది.
- source_word: אֵזוֹר
  choice: నడికట్టు
  rationale: నడుము చుట్టూ ధరించే బెల్టు లేదా కట్టును సూచిస్తుంది. ‘నడికట్టు’ ఆధునిక తెలుగులో అర్థమయ్యే పదం; అది సేవకు సిద్ధపడడం లేదా అవమానకరంగా బంధించబడడం అనే ఏ ఒక్క వ్యాఖ్యానాన్నీ ప్రధాన వాక్యంలో బలవంతంగా చేర్చదు.
- source_word: בְּמָתְנֵיהֶם
  choice: వారి నడుముల చుట్టూ
  rationale: మూలపదబంధం నడుము/నడుము భాగాన్ని సూచిస్తుంది. ఈ రూపం పాతకాలపు ‘కటిప్రదేశం’ వంటి పదజాలాన్ని తప్పించి స్థలాన్ని స్పష్టంగా తెలుపుతుంది.
theological_decisions:
- issue: రాజుల స్థితిని తారుమారు చేసే రూపకానికి అర్థం
  choice: దేవుడు రాజుల బంధనాలను సడలించి, తరువాత వారి నడుములకు నడికట్టు కట్టే చర్యలుగా రూపకాన్ని యథాతథంగా ఉంచడం
  alternative: దేవుడు రాజులను విడిపించి కార్యానికి సిద్ధపరుస్తాడని, లేదా వారి అధికారాన్ని తొలగించి వారిని బందీలుగా చేస్తాడని నేరుగా వ్యాఖ్యానించడం
  rationale: హీబ్రూ వాక్యం సంక్షిప్తంగా, రూపకాలతో ఉంది. ‘సడలిస్తాడు’–‘కడతాడు’ అనే జత దేవుని సార్వభౌమత్వం కింద జరిగే స్థితిమార్పును సూచించినా, అది విముక్తి తరువాత సిద్ధపరచడమా లేక అవమానం మరియు అణచివేతనా అనేది పూర్తిగా స్పష్టం చేయదు. అందువల్ల అనువాదం ఆ ఉద్రిక్తతను పరిష్కరించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘బంధనాలు—సడలిస్తాడు’ మరియు ‘నడికట్టు—కడతాడు’ అనే స్పష్టమైన భౌతిక చిత్రాలు నిలుపబడ్డాయి; అర్థాన్ని ఒకే సిద్ధాంతపరమైన వ్యాఖ్యానానికి పరిమితం చేయలేదు.
