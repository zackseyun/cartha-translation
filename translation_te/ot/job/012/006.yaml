  yaml_path: translation/ot/job/012/006.yaml
  text: The tents of destroyers are at ease[a], and those who provoke God are secure—those whose god brings into their hand.
translation:
  language: te
  text: దోచుకునేవారి గుడారాలు నిశ్చింతగా ఉన్నాయి; దేవుణ్ణి కోపపెట్టేవారు సురక్షితంగా ఉన్నారు—దేవుడు ఎవరి చేతిలోకి తెస్తాడో వారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో చివరి వాక్యభాగం క్లిష్టమైనది; దేవుడు వారి చేతికి ఏమి తెస్తాడో వస్తువును స్పష్టంగా చెప్పదు. లేదా, “దేవుడు ఎవరిని తన చేతికి అప్పగిస్తాడో వారు” అని అర్థం కావచ్చు. ఇంకొక వ్యంగ్య పఠనంలో, దుష్టులు తమ చేతిలోని శక్తినే తమ ‘దేవుడు’గా చేసుకుంటారని అర్థం కావచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: יִשְׁלָיוּ
  choice: ప్రశాంతంగా ఉన్నాయి
  rationale: שלה అనే మూలపదం భౌతిక సమృద్ధికన్నా కలతలేని ప్రశాంత స్థితిని సూచిస్తుంది; సందర్భంలోని వ్యంగ్య నైతిక వైరుధ్యాన్ని ఇది నిలుపుతుంది.
- source_word: אֹהָלִים
  choice: గుడారాలు
  rationale: మూలంలోని స్పష్టమైన దృశ్యరూపాన్ని నిలుపుతూ, కుటుంబాలు లేదా నివాసాలనే విస్తృత భావాన్నీ సందర్భంలో అనుమతిస్తుంది.
- source_word: לְשֹׁדְדִים
  choice: దోచుకునేవారి
  rationale: ఈ కృదంత నామం హింసాత్మకంగా కొల్లగొట్టేవారిని సూచిస్తుంది; ఆధునిక తెలుగులో సహజంగా ఉండేలా అనువదించబడింది.
- source_word: וּבַטֻּחוֹת
  choice: సురక్షితంగా ఉన్నారు
  rationale: בטח నుంచి వచ్చిన ఈ రూపం ముందరి ‘ప్రశాంతంగా’ అనే పదానికి సమాంతరంగా భద్రమైన స్థితిని తెలియజేస్తుంది.
- source_word: לְמַרְגִּיזֵי אֵל
  choice: దేవుణ్ణి రెచ్చగొట్టేవారు
  rationale: רגז హిఫీల్ రూపం దేవునికి కోపం కలిగించేలా ప్రవర్తించడాన్ని సూచిస్తుంది; ‘రెచ్చగొట్టు’ ఆ ఉద్దేశాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לַאֲשֶׁר הֵבִיא אֱלוֹהַּ בְּיָדוֹ
  choice: తమ చేతిలో ఉన్నదే తమకు దేవుడైనవారు
  rationale: కఠినమైన హీబ్రూ వాక్యభాగాన్ని, దుష్టుడు తన చేతిలోని శక్తి లేదా సంపదనే దేవునిగా చేసుకుంటున్నాడనే వ్యంగ్య పఠనంగా అందిస్తుంది; ఇతర వ్యాకరణ పఠనాలను పాదసూచికలో ఉంచింది.
theological_decisions:
- issue: చివరి వాక్యభాగంలోని אֱלוֹהַּ పదానికి సూచన
  choice: దుష్టుని చేతిలోని శక్తి లేదా ఆస్తి అతనికి ‘దేవుడు’గా ఉందనే వ్యంగ్య పఠనం
  alternative: ‘దేవుడు వారిని తన చేతికి అప్పగించేవారు’ లేదా ‘దేవుడు ఎవరి చేతిలోకి ఇస్తాడో వారు’
  rationale: సందర్భం దోచుకునేవారి ప్రశాంతతను, దేవుణ్ణి రెచ్చగొట్టేవారి భద్రతను నొక్కిచెబుతుంది. వ్యంగ్య పఠనం వారి భక్తిహీనతను తీవ్రం చేస్తుంది; అయితే హీబ్రూ వాక్యనిర్మాణం అనేక విధాలుగా అర్థమవుతుంది కాబట్టి ప్రత్యామ్నాయాలను పాదసూచికలో స్పష్టంగా ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కవితాత్మక గద్యం. ‘గుడారాలు’ అనే మూల దృశ్యాన్ని నిలిపి, క్లిష్టమైన చివరి భాగంలోని నిజమైన అర్థసందిగ్ధతను పాదసూచిక ద్వారా భద్రపరిచాం.
