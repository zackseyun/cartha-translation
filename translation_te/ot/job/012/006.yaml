  edition: WLC
  text: יִשְׁלָ֤יוּ אֹֽהָלִ֨ים לְ/שֹׁ֥דְדִ֗ים וּֽ֭/בַטֻּחוֹת לְ/מַרְגִּ֣יזֵי אֵ֑ל לַ/אֲשֶׁ֤ר הֵבִ֖יא אֱל֣וֹהַּ בְּ/יָדֽ/וֹ׀׃
base_translation:
