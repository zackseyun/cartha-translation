source:
  edition: WLC
  text: עִ֭מּ/וֹ עֹ֣ז וְ/תֽוּשִׁיָּ֑ה ל֝֗/וֹ שֹׁגֵ֥ג וּ/מַשְׁגֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/012/016.yaml
  text: With him are strength and sound wisdom[a]; the one who goes astray and the one who leads astray belong to him.
translation:
  language: te
  text: ఆయనయొద్ద బలమూ సుజ్ఞానమూ ఉన్నాయి; దారితప్పేవాడూ దారి తప్పించేవాడూ ఆయనకు చెందినవారే.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మోసపోయినవాడూ మోసగించేవాడూ ఆయనకు చెందినవారే.’ అయితే హీబ్రూ కృదంతాలు ఒకడు దారితప్పడానికీ మరొకడు దారి తప్పించడానికీ మధ్య ఉన్న భేదాన్ని చూపుతాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: עִמּוֹ
  choice: ఆయన దగ్గర ఉన్నాయి
  rationale: ఈ ప్రయోగం సహవాసంతో పాటు స్వాధీనతను సూచిస్తుంది. దేవునికి బలమూ జ్ఞానమూ ఉన్నాయని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తూ హీబ్రూ నుడికారాన్ని కాపాడుతుంది.
- source_word: עֹז
  choice: బలం
  rationale: ఈ నామవాచకానికి సాధారణ అర్థం బలం లేదా శక్తి. సందర్భంలో ‘బలం’ సహజంగా సరిపోతుంది.
- source_word: תּוּשִׁיָּה
  choice: సమర్థమైన జ్ఞానం
  rationale: జ్ఞానసాహిత్యంలో ఈ పదం కేవలం జ్ఞానాన్ని కాక, కార్యసాధకమైన వివేకాన్ని లేదా దృఢమైన ఆలోచనను కూడా సూచిస్తుంది. ‘సమర్థమైన జ్ఞానం’ ఆ విస్తృత భావాన్ని సంక్షిప్తంగా అందిస్తుంది.
- source_word: לוֹ
  choice: ఆయనవారే
  rationale: לֹו ఇక్కడ స్వాధీనత లేదా అధీన సంబంధాన్ని సూచిస్తుంది. ‘ఆయనవారే’ అనే రూపం ఇద్దరూ ఆయన పరిధికి చెందినవారనే బలమైన వాక్యాన్ని సహజంగా తెలుపుతుంది.
- source_word: שֹׁגֵג
  choice: దారితప్పేవాడు
  rationale: שׁגה ధాతువు Qal వర్తమాన కృదంతంగా తప్పిపోవడం లేదా దారితప్పడం అనే అకర్మక భావాన్ని ఇస్తుంది. ఈ ఎంపిక ఆ రూపభేదాన్ని నిలుపుతుంది.
- source_word: מַשְׁגֶּה
  choice: దారి తప్పించేవాడు
  rationale: అదే ధాతువు Hiphil వర్తమాన కృదంతంగా మరొకరిని తప్పుదారి పట్టించే కారక భావాన్ని ఇస్తుంది. ముందరి పదంతో ఉన్న పదబంధ సమాంతరాన్ని ఇది కాపాడుతుంది.
theological_decisions:
- issue: దారితప్పేవాడితోను దారి తప్పించేవాడితోను దేవుని సంబంధం
  choice: ఇద్దరూ ‘ఆయనవారే’ అని పేర్కొని, దేవుని అధీన పరిధిలో ఉన్నారనే భావాన్ని నిలిపాం; వారి తప్పుకు దేవుడే నైతిక కారణమని చెప్పలేదు.
  alternative: ఇద్దరినీ దేవుడు ఎరుగుతాడు; లేదా దేవుడే వారి తప్పుకు ప్రత్యక్ష కారణం.
  rationale: హీబ్రూ לֹו స్వాధీనత లేదా సంబంధాన్ని బలంగా పేర్కొంటుంది; అయితే నైతిక కారణత్వాన్ని స్పష్టంగా నిర్వచించదు. అందువల్ల మూలంలోని దైవ సార్వభౌమాధికార ఉద్వేగాన్ని పరిష్కరించకుండా అలాగే ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన వాక్యనిర్మాణం వాడబడింది. ‘దారితప్పేవాడు / దారి తప్పించేవాడు’ అనే జంట మూలంలోని Qal–Hiphil భేదాన్ని స్పష్టంగా నిలుపుతుంది.
