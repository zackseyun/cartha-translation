source:
  edition: WLC
  text: מְגַלֶּ֣ה עֲ֭מֻקוֹת מִנִּי חֹ֑שֶׁךְ וַ/יֹּצֵ֖א לָ/א֣וֹר צַלְמָֽוֶת־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/012/022.yaml
  text: He reveals deep things out of darkness[a], and brings the shadow of death to light.
translation:
  language: te
  text: ఆయన చీకటిలోనుండి లోతైన సంగతులను బయలుపరుస్తాడు; మరణఛాయను వెలుగులోకి తెస్తాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘మరణఛాయ’ అని అనువదించిన హీబ్రూ పదానికి ‘గాఢాంధకారం’ లేదా ‘మరణాంధకారం’ అనే అర్థం కూడా ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְגַלֶּה
  choice: బయలుపరుస్తాడు
  rationale: గלה ధాతువు కప్పబడినదాన్ని వెలికి తీయడం లేదా తెలియజేయడం అనే భావాలను కలిగి ఉంది; ‘బయలుపరుస్తాడు’ ఈ రెండింటినీ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: עֲמֻקוֹת
  choice: లోతైనవాటిని
  rationale: స్త్రీలింగ బహువచన విశేషణం నామవాచకార్థంలో వాడబడింది. ‘లోతైనవాటిని’ అనేది స్థలసంబంధమైన లోతులనూ, గ్రహించడానికి కష్టమైన గూఢ విషయాలనూ సూచించగల అస్పష్టతను నిలుపుతుంది.
- source_word: מִנִּי חֹשֶׁךְ
  choice: చీకటిలోనుండి
  rationale: మూలం లేదా దాగి ఉన్న స్థితినుండి బయటపడటాన్ని సూచిస్తుంది; తెలుగు కవితాత్మక సందర్భంలో ఇది సహజంగా ఉంది.
- source_word: וַיֹּצֵא
  choice: తెస్తాడు
  rationale: יצא హిఫీల్ రూపంలోని కారణార్థాన్ని—బయటికి వచ్చేలా చేయడం—సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: לָאוֹר
  choice: వెలుగులోకి
  rationale: వెలుగు వైపు లేదా వెలుగులోనికి జరిగే కదలికను తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: צַלְמָוֶת
  choice: మరణఛాయను
  rationale: సాంప్రదాయిక సమాసార్థమైన ‘మరణఛాయ’ను ప్రధాన పాఠంలో నిలిపి, ‘గాఢాంధకారం’ అనే సాధ్యమైన పదార్థాన్ని పాదటీకలో ఇస్తుంది.
theological_decisions:
- issue: צַלְמָוֶת పదానికి అర్థం
  choice: మరణఛాయ
  alternative: గాఢాంధకారం లేదా మృత్యుసమానమైన చీకటి
  rationale: ఇది ప్రధానంగా పదార్థ-కవిత్వ సంబంధమైన సందిగ్ధత. ‘మరణఛాయ’ హీబ్రూ పద నిర్మాణాన్నీ కవితాత్మక తీవ్రతనూ నిలుపుతుంది; అదే పదాన్ని తీవ్రమైన చీకటిగా అర్థం చేసుకునే అవకాశాన్ని పాదటీకలో భద్రపరుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కవితాత్మక శైలి. ‘లోతైనవాటిని’ అనే రూపం మూలంలోని స్థలసంబంధమైన మరియు రూపకాలంకార సంబంధమైన భావసంభావ్యతలను రెండింటినీ నిలుపుతుంది; ‘మరణఛాయ’ సాంప్రదాయికమైనదైనా సాధారణ పాఠకునికి గ్రాహ్యంగా ఉంది.
