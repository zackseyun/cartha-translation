source:
  edition: WLC
  text: שׁוֹפֵ֣ךְ בּ֭וּז עַל נְדִיבִ֑ים וּ/מְזִ֖יחַ אֲפִיקִ֣ים רִפָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/012/021.yaml
  text: He pours contempt on nobles[b][a], and loosens the belt of the strong.
translation:
  language: te
  text: 'ఆయన ప్రభువులపై[a] ధిక్కారాన్ని కుమ్మరిస్తాడు;

    బలవంతుల నడికట్టును[b] వదులుచేస్తాడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఉన్నతులపై,’ ‘ప్రముఖులపై.’
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా ‘నడికట్టును వదులుచేస్తాడు’; ఇది వారి బలాన్ని, సంసిద్ధతను లేదా అధికారాన్ని బలహీనపరచడాన్ని సూచించే రూపకం.
    reason: cultural_note
lexical_decisions:
- source_word: שׁוֹפֵךְ
  choice: కుమ్మరిస్తాడు
  rationale: ‘కుమ్మరించు’ అనే పదం ‘పోయు/కుమ్మరించు’ అనే మూలార్థాన్నీ, ధిక్కారాన్ని ఒకరిపై కుమ్మరించే సజీవ రూపకాన్నీ నిలుపుతుంది.
- source_word: בּוּז
  choice: ధిక్కారం
  rationale: ఈ సందర్భంలో బహిరంగ అవమానంతో కూడిన తిరస్కార భావాన్ని ‘ధిక్కారం’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: נְדִיבִים
  choice: ఉన్నతులు
  rationale: ఇక్కడ ఈ పదం ఉదారులను కాక, ఉన్నత హోదా మరియు అధికారమున్న ప్రముఖులను సూచిస్తుంది. ‘ఉన్నతులు’ రాజకుమారులకే పరిమితం చేయకుండా ఆ సామాజిక స్థితిని తెలియజేస్తుంది.
- source_word: מְזִיחַ
  choice: నడికట్టు
  rationale: ఇది నడుముకు కట్టుకునే కట్టు లేదా బెల్టును సూచిస్తుంది. ‘నడికట్టు’ మూలంలోని దృశ్యరూపాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: אֲפִיקִים
  choice: బలవంతులు
  rationale: సమాంతర నిర్మాణంలో ఇది బలం లేదా అధికారమున్న వ్యక్తులను సూచిస్తుంది. ‘బలవంతులు’ ఆ విస్తృత భావాన్ని కాపాడుతుంది.
- source_word: רִפָּה
  choice: వదులుచేస్తాడు
  rationale: ఈ క్రియకు వదులుచేయడం, బిగువు తగ్గించడం అనే అర్థం ఉంది; నడికట్టు రూపకంతో ఇది నేరుగా సరిపోతుంది.
theological_decisions:
- issue: దేవుడు మానవ గౌరవాన్నీ శక్తినీ తారుమారు చేసే రూపకం
  choice: ‘బలవంతుల నడికట్టును వదులుచేస్తాడు’ అని దృశ్యరూపాన్ని ప్రధాన పాఠ్యంలో నిలుపడం
  alternative: ‘బలవంతులను నిరాయుధులను చేస్తాడు’ లేదా ‘వారి బలాన్ని తొలగిస్తాడు’
  rationale: మూలపాఠ్యం అవమానపరచడం, శక్తిహీనులను చేయడం అనే భావాన్ని స్పష్టమైన నడికట్టు రూపకం ద్వారా తెలియజేస్తుంది. దానిని కేవలం సైనిక లేదా అమూర్త అర్థంగా మార్చకుండా కవితాత్మక ఉద్వేగాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, కవితాత్మకమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రద శైలిని ఉపయోగించాం. రెండు సమాంతర పాదాల నిర్మాణాన్నీ మూలంలోని సజీవ రూపకాలనూ నిలిపాం.
