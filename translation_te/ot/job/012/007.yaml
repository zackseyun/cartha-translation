  yaml_path: translation/ot/job/012/007.yaml
  text: But ask the animals[a], please, and they will teach you, and the birds of the heavens, and they will tell you.
translation:
  language: te
  text: అయితే, జంతువులను అడుగు, అవి నీకు నేర్పుతాయి; ఆకాశ పక్షులు నీకు తెలియజేస్తాయి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאוּלָם
  choice: అయితే
  rationale: యోబు మాటల్లో వచ్చే వ్యతిరేక మలుపును సహజమైన ఆధునిక తెలుగులో సూచిస్తుంది.
- source_word: שְׁאַל נָא
  choice: ఒక్కసారి అడుగు
  rationale: שְׁאַל అనేది ఆజ్ఞార్థకమైన ‘అడుగు’; נָא ఇక్కడ కచ్చితమైన కాలార్థక ‘ఇప్పుడు’ కంటే అభ్యర్థన లేదా ప్రోత్సాహ భావాన్ని జోడిస్తుంది. ‘ఒక్కసారి అడుగు’ ఆ ప్రయోగబలాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: בְהֵמוֹת
  choice: జంతువులను
  rationale: ఇక్కడ ఈ పదం పశువులకే పరిమితం కాకుండా భూజంతువులను విస్తృతంగా సూచిస్తుంది; పక్షులతో ఉన్న సమాంతరతకు కూడా ‘జంతువులు’ సరిపోతుంది.
- source_word: וְתֹרֶךָּ
  choice: అవి నీకు బోధిస్తాయి
  rationale: ירה హిఫిల్ రూపానికి ‘బోధించు/నేర్పు’ అనే అర్థం ఉంది. హీబ్రూలో సమూహవాచక నామానికి అనుగుణంగా క్రియ ఏకవచనంలో ఉన్నా, తెలుగులో ‘జంతువులు’తో బహువచన క్రియ సహజం.
- source_word: וְעוֹף הַשָּׁמַיִם
  choice: ఆకాశ పక్షులను
  rationale: עוֹף ఇక్కడ ఎగిరే జీవులను, సందర్భానుసారం పక్షులను సూచిస్తుంది. ‘ఆకాశ పక్షులు’ ఆధునిక తెలుగులో సహజంగా ఉండి హీబ్రూ పదబంధ భావాన్ని నిలుపుతుంది.
- source_word: וְיַגֶּד לָךְ
  choice: అవి నీకు తెలియజేస్తాయి
  rationale: נגד హిఫిల్ రూపం ‘తెలియజేయు, చెప్పు, ప్రకటించు’ అనే భావాన్ని ఇస్తుంది. ఈ సందర్భంలో ‘తెలియజేస్తాయి’ బోధనాత్మక సమాంతరతను నిలుపుతూ సహజంగా ఉంది.
