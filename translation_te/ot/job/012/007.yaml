  register: ఆధునిక ప్రామాణిక తెలుగులో, కవితాత్మక గౌరవాన్ని నిలుపుతూ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. సమాంతర వాక్య నిర్మాణాన్ని స్పష్టత కోసం రెండు వాక్యాలుగా ఇచ్చాం; హీబ్రూలోని సమూహవాచక ఏకవచన క్రియలను తెలుగులో సహజమైన బహువచన రూపాలతో అనువదించాం.
