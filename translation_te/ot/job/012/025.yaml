source:
  edition: WLC
  text: יְמַֽשְׁשׁוּ חֹ֥שֶׁךְ וְ/לֹא א֑וֹר וַ֝/יַּתְעֵ֗/ם כַּ/שִּׁכּֽוֹר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/012/025.yaml
  text: They grope in darkness[a], without light; he makes them stagger like a drunkard.
translation:
  language: te
  text: 'వారు వెలుగే లేని చీకటిలో తడుముకుంటారు;

    ఆయన వారిని మత్తులో ఉన్నవాడిలా తూలేలా చేస్తాడు.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఆయన వారిని దారి తప్పేలా చేస్తాడు.’ హీబ్రూ క్రియ అటూ ఇటూ తిరగడం లేదా దారి తప్పడం అనే అర్థాన్నివ్వగలదు; ఇక్కడ మత్తులో ఉన్నవాడితో చేసిన పోలిక ‘తూలేలా చేస్తాడు’ అనే అనువాదానికి మద్దతిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְמַשְׁשׁוּ
  choice: తడుముకుంటారు
  rationale: పీయేల్ రూపం చూపులేక చేతులతో దారి వెదకడాన్ని సూచిస్తుంది. ‘తడుముకుంటారు’ అనే పదం ఆ దృశ్యాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: חֹשֶׁךְ
  choice: చీకటిలో
  rationale: మూలంలోని ‘చీకటి’ భావాన్ని యథాతథంగా ఉంచుతూ, తెలుగులో సహజమైన స్థలవాచక నిర్మాణంగా ఇచ్చాం.
- source_word: וְלֹא אוֹר
  choice: వెలుగే లేని
  rationale: అక్షరార్థంగా ‘వెలుగు లేదు’; ‘వెలుగే లేని’ అనడం మూలంలోని తీవ్రమైన వ్యత్యాసాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וַיַּתְעֵם
  choice: వారిని … తూలేలా చేస్తాడు
  rationale: תעה అనే ధాతువు తిరగడం, దారి తప్పడం అనే అర్థాలు ఇవ్వగలదు. చీకటిలో తడుముకోవడం, మద్యం తాగిన వ్యక్తితో పోల్చడం అనే సందర్భంలో దిక్కుతోచని అస్థిర నడకను ‘తూలేలా చేస్తాడు’ స్పష్టంగా చూపుతుంది.
- source_word: ־ם
  choice: వారిని
  rationale: మూడవ పురుష బహువచన కర్మ ప్రత్యయం సందర్భంలోని బహువచన వ్యక్తులను తిరిగి సూచిస్తుంది.
- source_word: כַּשִּׁכּוֹר
  choice: మద్యం తాగినవాడిలా
  rationale: ఈ పదం మత్తులో ఉన్న వ్యక్తిని సూచిస్తుంది. ‘మద్యం తాగినవాడిలా’ అనేది సాధారణ పాఠకులకు స్పష్టంగా, గౌరవప్రదమైన ఆధునిక తెలుగులో ఉంది.
theological_decisions:
- issue: וַיַּתְעֵם క్రియలో అంతర్లీనంగా ఉన్న కర్త
  choice: ఆయన … చేస్తాడు
  alternative: వారు తూలుతారు
  rationale: క్రియారూపం మూడవ పురుష ఏకవచన కర్తతోను, మూడవ పురుష బహువచన కర్మ ప్రత్యయంతోను ఉంది. కాబట్టి ‘ఆయన’ అనే అంతర్లీన కర్తను నిలిపాం; విస్తృత సందర్భంలో ఇది దేవుణ్ణి సూచిస్తుంది. కేవలం ‘వారు తూలుతారు’ అనడం మూలంలోని కారణకర్త భావాన్ని కోల్పోతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, కవితాత్మక సమాంతరతను మరియు గంభీరతను నిలుపుతూ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే పదాలను వాడాం. ‘వెలుగే లేని’లోని ‘ఏ’ మూలంలోని వెలుగు పూర్తిగా లేకపోవడాన్ని నొక్కిచెబుతుంది.
