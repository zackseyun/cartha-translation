id: JOB.12.24
reference: Job 12:24
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: מֵסִ֗יר לֵ֭ב רָאשֵׁ֣י עַם הָ/אָ֑רֶץ וַ֝/יַּתְעֵ֗/ם בְּ/תֹ֣הוּ לֹא דָֽרֶךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/012/024.yaml
  text: He removes understanding from the heads of the people of the land[c][b][a], and makes them wander in a trackless waste.
translation:
  language: te
  text: దేశ ప్రజల నాయకుల[b] వివేకాన్ని[a] ఆయన తీసివేస్తాడు; దారి లేని నిర్జన ప్రదేశంలో[c] వారిని తిరుగులాడేలా చేస్తాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా ‘హృదయాన్ని’; ఇక్కడ అది వివేకాన్ని లేదా నిర్ణయ సామర్థ్యాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా ‘దేశపు/భూమి యొక్క ప్రజల తలలు’; అంటే ‘దేశ ప్రజల నాయకులు.’ ‘భూమి ప్రజల నాయకులు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: అక్షరార్థంగా ‘శూన్య ప్రదేశంలో—దారి లేదు’; అంటే దారిలేని నిర్జన ప్రదేశంలో.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵסִיר
  choice: తీసివేస్తాడు
  rationale: హిఫిల్ రూపంలోని ‘తొలగించు, తీసివేయు’ అనే కారణార్థాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: לֵב
  choice: వివేకం
  rationale: అక్షరార్థం ‘హృదయం’; అయితే ఇక్కడ అది భావోద్వేగాలకన్నా ఆలోచనా శక్తి, నిర్ణయ సామర్థ్యం లేదా వివేకాన్ని సూచిస్తుంది.
- source_word: רָאשֵׁי עַם הָאָרֶץ
  choice: దేశ ప్రజల నాయకులు
  rationale: רָאשֵׁי అనే ‘తలలు’ అన్న రూపం నాయకులను సూచించే హీబ్రూ నుడికారం. הָאָרֶץకు ‘దేశం/భూమి’ అనే రెండు భావాలు సాధ్యమైనా, రాజకీయ నాయకత్వ సందర్భంలో ‘దేశ ప్రజలు’ సహజంగా సరిపోతుంది.
- source_word: וַיַּתְעֵם
  choice: వారిని తిరుగులాడేలా చేస్తాడు
  rationale: תעה ధాతువు ‘తిరుగు, దారితప్పు’ అని అర్థం; కారణార్థక రూపం వారిని అలా తిరిగేలా చేయడాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: בְּתֹהוּ
  choice: నిర్జన ప్రదేశంలో
  rationale: תֹהוּ ఇక్కడ శూన్యమైన, పాడుబడిన లేదా నిర్జన ప్రదేశాన్ని సూచిస్తుంది; సందర్భంలోని దారిలేని ప్రదేశ చిత్రాన్ని తెలుగులో స్పష్టంగా అందిస్తుంది.
- source_word: לֹא דָרֶךְ
  choice: దారి లేని
  rationale: హీబ్రూలో అక్షరార్థంగా ‘దారి లేదు’; ‘దారి లేని’ అనే రూపం మూల చిత్రాన్ని సంక్షిప్తంగా, సహజంగా నిలుపుతుంది.
theological_decisions:
- issue: క్రియలకు అంతర్లీనంగా ఉన్న కర్త
  choice: సందర్భానుసారం ‘ఆయన’ దేవుణ్ణి సూచిస్తుంది.
  alternative: ఈ వాక్యంలో కర్తను మళ్లీ పేర్కొనకుండా క్రియలను మాత్రమే ఉంచడం.
  rationale: యోబు 12వ అధ్యాయ సందర్భంలో ఈ చర్యలకు దేవుడే కర్త. ‘ఆయన’ అని ఉంచడం తెలుగులో వాక్యాన్ని స్పష్టం చేస్తుంది; మూలానికి మించిన సిద్ధాంత వ్యాఖ్యానాన్ని జోడించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘వివేకం’ ద్వారా హీబ్రూ ‘హృదయం’ యొక్క జ్ఞానాత్మక భావం అందించబడింది; ‘దారి లేని నిర్జన ప్రదేశం’ మూలంలోని కఠినమైన ఎడారి చిత్రాన్ని నిలుపుతుంది.
