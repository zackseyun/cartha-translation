source:
  edition: WLC
  text: שְׂחֹ֤ק לְ/רֵעֵ֨/הוּ אֶֽהְיֶ֗ה קֹרֵ֣א לֶ֭/אֱלוֹהַּ וַֽ/יַּעֲנֵ֑/הוּ שְׂ֝ח֗וֹק צַדִּ֥יק תָּמִֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/012/004.yaml
  text: I am a laughingstock to my friend[a], one who called to God and he answered him[b], a laughingstock to the righteous and blameless man.
translation:
  language: te
  text: నేను నా స్నేహితునికి[a] నవ్వులపాలయ్యాను—దేవునికి మొరపెట్టగా ఆయన జవాబిచ్చినవాడిని[b]; నీతిమంతుడనూ నిర్దోషినైన నన్ను నవ్వులపాలు చేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘అతని స్నేహితునికి’; హీబ్రూ ప్రత్యయాన్ని అలా చదవవచ్చు. అయితే యోబు తన సహచరుల గురించి మాట్లాడుతున్న సందర్భం ‘నా స్నేహితునికి’ అనే భావానికి అనుకూలంగా ఉంది.
    reason: alternative_reading
  - marker: b
    text: అక్షరార్థంగా ‘దేవునికి మొరపెట్టినవాడు, ఆయన అతనికి జవాబిచ్చాడు’; హీబ్రూ రూపంలో కర్మ మూడవ పురుషంలో ఉంది, కాని ఇక్కడ సూచించబడినవాడు యోబే.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂחֹק
  choice: నవ్వులపాలు
  rationale: ఎవరినైనా ఎగతాళికి గురిచేసే స్థితిని సూచించే ఈ నామవాచకానికి సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: לְרֵעֵהוּ
  choice: నా స్నేహితునికి
  rationale: రూపపరంగా ‘అతని స్నేహితునికి’ అనే పఠనం సాధ్యమైనా, యోబు తన సహచరుల దృష్టిలో తన స్థితిని చెబుతున్న సందర్భం మొదటి పురుష పఠనానికి అనుకూలంగా ఉంది; ప్రత్యామ్నాయం పాదటిప్పణిలో ఉంచబడింది.
- source_word: אֶהְיֶה
  choice: అయ్యాను
  rationale: అసంపూర్ణ క్రియారూపం సందర్భంలో యోబు ప్రస్తుతం అనుభవిస్తున్న స్థితిని తెలియజేస్తుంది; తెలుగులో ‘అయ్యాను’ ఆ స్థితిలోకి వచ్చిన భావాన్నీ ప్రస్తుత ఫలితాన్నీ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: קֹרֵא לֶאֱלוֹהַּ
  choice: దేవునికి మొరపెట్టగా
  rationale: దేవుని సహాయం కోరుతూ పిలిచిన భావాన్ని ‘మొరపెట్టు’ స్పష్టంగా అందిస్తుంది; తరువాతి దైవిక జవాబుతో కాలక్రమ సంబంధాన్ని ‘-గా’ నిర్మాణం చూపిస్తుంది.
- source_word: וַיַּעֲנֵהוּ
  choice: ఆయన జవాబిచ్చినవాడిని
  rationale: హీబ్రూలో కర్త దేవుడు, కర్మ మూడవ పురుష ఏకవచనం ‘అతనికి’; సందర్భంలో ఆ వ్యక్తి యోబే. ప్రధాన పాఠ్యంలో తెలుగు వాక్యసౌలభ్యం కోసం స్వీయసూచనను వాడి, రూపపరమైన ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో నిలిపాం.
- source_word: צַדִּיק
  choice: నీతిమంతుడు
  rationale: జ్ఞానసాహిత్యంలో నైతిక న్యాయవర్తనను సూచించే ప్రామాణిక తెలుగు పదం.
- source_word: תָּמִים
  choice: నిర్దోషి
  rationale: సంపూర్ణ పాపరాహిత్యాన్ని తప్పనిసరిగా సూచించకుండా, యథార్థత మరియు నైతిక సమగ్రత భావాన్ని తెలియజేస్తుంది.
theological_decisions:
- issue: యోబు స్వీయవర్ణన సంపూర్ణ పాపరాహిత్యాన్ని సూచిస్తుందా
  choice: ‘నిర్దోషి’ని నైతిక సమగ్రతకు సంబంధించిన పదంగా వాడటం
  alternative: ‘పరిపూర్ణుడు’
  rationale: תָּמִים జ్ఞానసాహిత్యంలో సాధారణంగా సంపూర్ణ పాపరాహిత్యం కంటే యథార్థత, సమగ్రతను సూచిస్తుంది. ‘నిర్దోషి’ మూలపాఠంలోని గంభీరమైన నైతిక వాదనను అతిశయింపకుండా నిలుపుతుంది.
- issue: చివరి צַדִּיק תָּמִים పదబంధం ఎవరిని వర్ణిస్తుంది
  choice: ‘నీతిమంతుడూ నిర్దోషీ’ అనే కర్త-వర్ణనగా యోబును సూచించడం
  alternative: ‘నీతిమంతుడైన నిర్దోషికి నవ్వులపాలు’ అని దాతృక సంబంధంగా చదవడం
  rationale: పదబంధంలో ముందున్న לְ ఉపసర్గను చివరి విశేషణాలకు నేరుగా వర్తింపజేయడం వ్యాకరణపరంగా అవసరం కాదు. హీబ్రూ కవితా సమాంతరతలో ‘నీతిమంతుడూ నిర్దోషీ’ ముందటి మొదటి పురుష వక్తను సంక్షిప్తంగా తిరిగి వర్ణిస్తుంది; అయినా వాక్య నిర్మాణంలోని సంక్షిప్తతను అనవసరంగా విస్తరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన విలాప స్వరం నిలుపబడింది. ‘నవ్వులపాలు’, ‘మొరపెట్టు’, ‘నీతిమంతుడు’, ‘నిర్దోషి’ సాధారణ పాఠకులకు అర్థమయ్యే సజీవ పదాలు. హీబ్రూ కవిత్వంలోని పునరుక్తిని నిలుపుతూ, తెలుగులో సంబంధం స్పష్టమయ్యేందుకు డ్యాష్ మరియు అర్ధవిరామం ఉపయోగించబడ్డాయి.
