  text: עִ֭מּ/וֹ חָכְמָ֣ה וּ/גְבוּרָ֑ה ל֝֗/וֹ עֵצָ֥ה וּ/תְבוּנָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/012/013.yaml
  text: With him are wisdom and might[a]; to him belong counsel and understanding.
translation:
  language: te
  text: ఆయనతో జ్ఞానమూ బలమూ ఉన్నాయి; ఆలోచన, వివేచన ఆయనకు ఉన్నాయి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עִמּוֹ
  choice: ఆయనతోనే
  rationale: עִם ప్రత్యయంతో సాధారణంగా ‘ఆయనతో’ అని అర్థమిస్తుంది; ఇక్కడ దైవిక లక్షణాలు ఆయనతో ఉన్నాయని చెప్పే సహవాస-స్వామ్య భావం ఉంది. ‘నే’ పద్యం ఉద్దేశించిన ప్రత్యేక స్వామ్యాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: חָכְמָה
  choice: జ్ఞానం
  rationale: నైపుణ్యపూర్వకమైన జ్ఞానాన్ని, నిజమైన అవగాహనను సూచించే సహజమైన ప్రామాణిక తెలుగు పదం.
- source_word: וּגְבוּרָה
  choice: బలం
  rationale: גְבוּרָהకు బలం, శక్తి, పరాక్రమం అనే భావాలు ఉన్నాయి; ‘బలం’ సంక్షిప్తంగా ఉండి ‘జ్ఞానం’తో కవితాత్మకంగా జతకడుతుంది.
- source_word: לוֹ
  choice: ఆయనకే చెందుతాయి
  rationale: ל ప్రత్యయంతో ఇక్కడ స్వామ్యాన్ని సూచిస్తుంది. తెలుగు బహువచన కర్తలకు అనుగుణంగా ‘చెందుతాయి’ వాడి, ప్రత్యేక స్వామ్యాన్ని ‘కే’తో తెలిపాం.
- source_word: עֵצָה
  choice: ఆలోచన
  rationale: עֵצָהలో సలహా, యోచన, కార్యప్రణాళిక అనే భావాలు ఉన్నాయి. ఈ సందర్భంలో ‘ఆలోచన’ దేవుని సమాలోచనాత్మక యోచనను సాధారణ ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: וּתְבוּנָה
  choice: వివేచన
  rationale: תְבוּנָה అవగాహన, అంతర్దృష్టి, వివేచనను సూచిస్తుంది; ‘వివేచన’ విషయాలను సరిగ్గా గ్రహించి భేదించే సామర్థ్యాన్ని స్పష్టంగా అందిస్తుంది.
theological_decisions:
- issue: సర్వనామ ప్రత్యయాల నిర్దేశ్యం
  choice: సందర్భానుసారం సర్వనామాలు దేవుణ్ణి సూచిస్తాయి; అయితే మూలంలోని ‘ఆయన’ రూపాన్నే అనువాదంలో ఉంచాం.
  alternative: ‘దేవునితోనే’ లేదా ‘దేవునికే’ అని నిర్దేశ్యాన్ని అనువాదంలో స్పష్టంగా పేర్కొనడం.
  rationale: సమీప సందర్భం దేవుని జ్ఞానం, శక్తిని వర్ణిస్తుంది. అయినా హీబ్రూ వచనం దేవుని పేరు పెట్టకుండా సర్వనామాలను వాడుతుంది; ఆ రూపాన్ని నిలుపుకోవడం మూలానికి దగ్గరగా ఉండి, నిర్దేశ్యాన్ని సందర్భమే తెలియజేయనిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గంభీరంగా, సంక్షిప్త కవితాత్మక సమాంతరతతో అనువదించబడింది. హీబ్రూ మొదటి భాగంలోని ‘ఆయనతో’ అనే నిర్మాణాన్ని నిలిపి, రెండో భాగంలోని స్వామ్య భావాన్ని స్పష్టమైన తెలుగులో తెలిపాం.
