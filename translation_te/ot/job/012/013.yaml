  to: ఆయనతో జ్ఞానమూ బలమూ ఉన్నాయి; ఆలోచన, వివేచన ఆయనకు ఉన్నాయి.
  rationale: Removed the unsupported emphatic/exclusive particles while preserving the Hebrew parallelism, the distinction between “with him” and dative possession, and the concise poetic register. No footnote is required because the chosen Telugu wording directly represents the primary reading without obscuring a material ambiguity.
