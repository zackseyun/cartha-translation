id: JOB.12.8
reference: Job 12:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: א֤וֹ שִׂ֣יחַ לָ/אָ֣רֶץ וְ/תֹרֶ֑/ךָּ וִֽ/יסַפְּר֥וּ לְ֝/ךָ֗ דְּגֵ֣י הַ/יָּֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/job/012/008.yaml
  text: Or speak to the earth[a], and it will teach you[b]; and the fish of the sea will tell you.
translation:
  language: te
  text: లేదా భూమితో[a] మాట్లాడు; అది నీకు బోధిస్తుంది[b]. సముద్రపు చేపలు నీకు తెలియజేస్తాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘భూమి’ అని అనువదించిన హీబ్రూ పదానికి ‘నేల’ లేదా ‘దేశం’ అనే అర్థం కూడా ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో ‘భూమి’ వ్యాకరణపరంగా స్త్రీలింగ పదం; అందుకు అనుగుణంగా క్రియ కూడా స్త్రీలింగ ఏకవచనంలో ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: א֤וֹ
  choice: లేదా
  rationale: సందర్భంలోని వరుస పిలుపులను కలిపే వికల్ప సూచక అవ్యయాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: שִׂ֣יחַ
  choice: మాట్లాడు
  rationale: לָאָרֶץ తో వచ్చిన ఈ ఆజ్ఞారూప సందర్భంలో అంతరంగ ధ్యానం కంటే భూమిని సంబోధించి మాట్లాడడం అనే అర్థమే సరిపోతుంది.
- source_word: לָ/אָ֣רֶץ
  choice: భూమితో
  rationale: אֶרֶץ కు ‘భూమి’ లేదా ‘దేశం/నేల’ అనే అర్థాలు ఉండవచ్చు; జంతువులు, పక్షులు, సముద్రపు చేపలు అనే విశాల సృష్టి సందర్భం ఇక్కడ ‘భూమి’ని బలపరుస్తుంది. తెలుగులో మాట్లాడు అనే క్రియతో ‘భూమితో’ సహజంగా ఉంటుంది.
- source_word: וְ/תֹרֶ֑/ךָּ
  choice: అది నీకు బోధిస్తుంది
  rationale: ירה హిఫిల్ రూపానికి ‘బోధించు’ సరైన అర్థం. ‘అది’ భూమి వ్యక్తీకరణను నిలుపుతూ ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: וִֽ/יסַפְּר֥וּ לְ֝/ךָ֗
  choice: నీకు తెలియజేస్తాయి
  rationale: ספר పియేల్ రూపంలోని చెప్పడం/వివరించడం అనే భావాన్ని స్పష్టమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: דְּגֵ֣י הַ/יָּֽם
  choice: సముద్రపు చేపలు
  rationale: హీబ్రూ సంయుక్త పదబంధంలోని చిత్రణను సహజమైన తెలుగు నిర్మాణంలో నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కవితాత్మక వాక్యనిర్మాణం వాడబడింది. ‘భూమితో మాట్లాడు’ అనే వ్యక్తీకరణ మూలంలోని సృష్టి వ్యక్తీకరణను నిలుపుతుంది; రెండు సమాంతర వాక్యాల బోధనా భావం స్పష్టంగా ఉంచబడింది.
