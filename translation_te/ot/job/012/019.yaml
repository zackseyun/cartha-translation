  text: מוֹלִ֣יךְ כֹּהֲנִ֣ים שׁוֹלָ֑ל וְ/אֵֽתָנִ֣ים יְסַלֵּֽף׃
base_translation:
  language: en
  yaml_path: translation/ot/job/012/019.yaml
  text: He leads priests away stripped[b][a], and he overthrows the mighty.
translation:
  language: te
  text: ఆయన యాజకులను దోపిడీకి గురైనవారిగా తీసుకుపోతాడు[a]; బలవంతులను పడద్రోస్తాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వస్త్రాలు తీసివేయబడినవారిగా’; లేదా, ‘దోపుడుసొమ్ముగా.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘స్థిరంగా నిలిచినవారిని,’ అంటే తమ స్థానం దృఢంగా స్థాపించబడిందని భావించబడినవారిని.
    reason: lexical_alternative
lexical_decisions:
- source_word: מוֹלִיךְ
  choice: తీసుకుపోతాడు
  rationale: הלך హిఫీల్ రూపం ‘వెళ్లేలా చేయడం/నడిపించడం’ అనే భావాన్ని ఇస్తుంది. తీర్పు సందర్భంలో బందీలుగా దూరంగా తీసుకుపోవడాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: כֹּהֲנִים
  choice: యాజకులను
  rationale: כהנים యొక్క సాధారణ, ప్రత్యక్ష అర్థం ‘యాజకులు’; ఇక్కడ మతపరంగా, సామాజికంగా గౌరవస్థానంలో ఉన్నవారు సూచించబడుతున్నారు.
- source_word: שׁוֹלָל
  choice: దోచుకోబడినవారిగా
  rationale: שלל మూలానికి సంబంధించిన ఈ రూపం దోపిడీకి గురై ఆస్తి, గౌరవం కోల్పోయిన అవమానకర స్థితిని సూచిస్తుంది. ‘దోచుకోబడినవారిగా’ ఆ భావాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: אֵתָנִים
  choice: బలవంతులను
  rationale: איתן బలం, దృఢత్వం, స్థిరత్వం అనే భావాలను కలిగి ఉంది. అధికారవంతులు దిగజార్చబడుతున్న సమాంతర సందర్భంలో ‘బలవంతులు’ సహజంగా సరిపోతుంది; స్థిరత్వ భావాన్ని పాదటిప్పణిలో నిలిపాం.
- source_word: יְסַלֵּף
  choice: తలకిందులు చేస్తాడు
  rationale: סלף పీయేల్ రూపానికి వంకర చేయడం, తారుమారు చేయడం, కూల్చివేయడం వంటి భావాలు ఉన్నాయి. స్థిరంగా కనిపించేవారి స్థితిని పూర్తిగా తారుమారు చేయడాన్ని ‘తలకిందులు చేస్తాడు’ సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: యోబు 12 సందర్భంలో సూచిత కర్త కొనసాగింపు
  choice: దేవునిని సూచించే ఏకవచన ‘ఆయన’ను వాడటం
  alternative: స్పష్టత కోసం ‘దేవుడు’ అని నేరుగా పేర్కొనటం
  rationale: చుట్టుపక్కల వచనాల్లో ఒకే దైవిక కర్త చేసిన కార్యాలు కొనసాగుతున్నాయి. ‘ఆయన’ అని ఉంచడం హెబ్రీ కవితా ప్రవాహాన్ని కాపాడుతూ, సందర్భంలోని దైవిక కర్తను కొనసాగిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కవితా శైలిని ఉపయోగించాం. మొదటి పాదంలోని అవమానం, రెండవ పాదంలోని స్థిరమైన అధికారాన్ని తారుమారు చేసే భావం నిలుపబడ్డాయి.
