  yaml_path: translation/ot/job/012/017.yaml
  text: He leads counselors away stripped[a], and he makes judges foolish.
translation:
  language: te
  text: 'ఆయన సలహాదారులను దోచబడినవారిగా[a] తీసుకుపోతాడు;

    న్యాయాధిపతులను మూర్ఖులుగా చేస్తాడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘కొల్లగొట్టబడినవారిగా,’ ‘సర్వస్వం పోగొట్టుకున్నవారిగా’; హీబ్రూ పదం సలహాదారులు అవమానంతో, తమ ఆస్తులను కోల్పోయి తీసుకుపోబడడాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: מוֹלִיךְ
  choice: తీసుకుపోతాడు
  rationale: హిఫిల్ రూపంలోని కారణార్థక గమనాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది; ఓటమిలో వారిని వెంట తీసుకెళ్లే భావం సందర్భంలో స్పష్టమవుతుంది.
- source_word: יוֹעֲצִים
  choice: సలహాదారులను
  rationale: సలహా ఇచ్చేవారిని సూచించే బహువచన నామానికి నేరమైన, ఆధునిక తెలుగు సమానార్థకం.
- source_word: שׁוֹלָל
  choice: దోచబడినవారిగా
  rationale: దోపిడికి, స్వాధీనాల కోల్పోవడానికి, అవమానకరమైన స్థితికి గురైన భావాన్ని కాపాడుతుంది; వస్త్రాలు తొలగించబడ్డాయని అతిగా నిర్దిష్టపరచదు.
- source_word: שֹׁפְטִים
  choice: న్యాయాధిపతులను
  rationale: న్యాయ లేదా పరిపాలనా అధికారులను సూచించే మూలపదానికి నేరమైన అనువాదం; సలహాదారులతో ఉన్న సమాంతరతను నిలుపుతుంది.
- source_word: יְהוֹלֵל
  choice: మూర్ఖులుగా చేస్తాడు
  rationale: పియేల్ రూపంలోని కారణార్థక భావాన్ని స్పష్టంగా ఇస్తుంది; వారిని వివేకరహితులుగా లేదా అవివేకంగా ప్రవర్తించేవారిగా చేయడమనే భావాన్ని వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: వాక్యంలో అంతర్లీనంగా ఉన్న కర్త
  choice: ‘ఆయన’ అని స్పష్టపరచి, దేవుణ్ణి సూచించే కర్తగా ఉంచడం
  alternative: కర్తను వ్యక్తం చేయకుండా క్రియారూపాలతో మాత్రమే అనువదించడం
  rationale: యోబు 12 పరిసర సందర్భం ఈ కార్యాలను దేవునికే ఆపాదిస్తుంది. తెలుగు వాక్యానికి సహజత్వం, స్పష్టత కలిగించేందుకు ‘ఆయన’ను చేర్చడం సందర్భంలోని భావాన్ని మాత్రమే వ్యక్తపరుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన కవితాత్మక శైలి. రెండు సమాంతర పాదాలను నిలిపి, హీబ్రూ పదంలోని దోపిడి/అవమాన భావవ్యాప్తిని పాదసూచికలో భద్రపరచాం.
