source:
  edition: WLC
  text: מֵסִ֣יר שָׂ֭פָה לְ/נֶאֱמָנִ֑ים וְ/טַ֖עַם זְקֵנִ֣ים יִקָּֽח׃
base_translation:
  language: en
  yaml_path: translation/ot/job/012/020.yaml
  text: He removes speech from the trusted[b][a], and takes away discernment from the elders.
translation:
  language: te
  text: 'ఆయన నమ్మదగినవారి మాట్లాడే శక్తిని తీసివేస్తాడు[a];

    పెద్దల వివేచనను తీసివేస్తాడు[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘నమ్మదగినవారి పెదవిని తొలగిస్తాడు’; అంటే, వారి మాట్లాడే సామర్థ్యాన్ని లేదా వాక్చాతుర్యాన్ని హరిస్తాడు.
    reason: lexical_alternative
  - marker: b
    text: ‘వివేచన’కు బదులుగా ‘నిర్ణయశక్తి’ లేదా ‘అవగాహన’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵסִיר
  choice: తొలగిస్తాడు
  rationale: హిఫిల్ రూపం ఇక్కడ ఒక సామర్థ్యాన్ని లేకుండా చేయడం లేదా తీసివేయడం అనే కారణార్థాన్ని ఇస్తుంది. రెండవ పాదంలోని ‘తీసివేస్తాడు’తో భావసమాంతరతను నిలుపుతుంది.
- source_word: שָׂפָה
  choice: మాటను
  rationale: అక్షరార్థంగా ‘పెదవి’; ఇక్కడ మాట లేదా మాట్లాడగల సామర్థ్యానికి లక్షణార్థకంగా వాడబడింది. ‘మాటను’ సహజమైన ఆధునిక తెలుగు.
- source_word: לְנֶאֱמָנִים
  choice: నమ్మదగినవారి
  rationale: ఈ పదం నమ్మకమైన, విశ్వసనీయమైన, ఇతరుల నమ్మకం పొందినవారిని సూచించగలదు. ‘నమ్మదగినవారి’ ఈ అర్థవిస్తృతిని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: טַעַם
  choice: వివేచనను
  rationale: అక్షరార్థం ‘రుచి’; రూపకాలంకారంగా నిర్ణయశక్తి, అవగాహన, వివేచన అనే భావం. జ్ఞానసాహిత్య సందర్భంలో ‘వివేచన’ తగినది.
- source_word: זְקֵנִים
  choice: పెద్దల
  rationale: వయోవృద్ధులతో పాటు అనుభవం, సామాజిక గౌరవం గల పెద్దలను కూడా సూచిస్తుంది. ‘పెద్దలు’ రెండు పార్శ్వాలనూ సహజంగా తెలియజేస్తుంది.
- source_word: יִקָּח
  choice: తీసివేస్తాడు
  rationale: సాధారణంగా ‘తీసుకుంటాడు’; ఈ సమాంతర సందర్భంలో దూరం చేయడం అనే భావం స్పష్టంగా ఉంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన జ్ఞానసాహిత్య శైలి. హెబ్రీ కవిత్వంలోని రెండు సమాంతర పాదాలను నిలిపి, ‘పెదవి’ అనే అక్షరార్థాన్ని ప్రధాన పాఠ్యంలో సహజమైన ‘మాట’గా, పాదటిప్పణిలో ప్రత్యామ్నాయంగా ఇచ్చాం.
