    reason: מִלִּיןకు ‘మాటలు’ మరియు תִּבְחָןకు ‘పరిశీలించు’ అనే సమీపమైన పదప్రత్యామ్నాయాలను సూచిస్తుంది; మూలంలోని పూర్తి పోలికనూ ప్రశ్నారూపాన్నీ నిలుపుతుంది.
lexical_decisions:
- source_word: הֲלֹא
  choice: కదా?
  rationale: సమ్మతిని ఆశించే అలంకారిక ప్రశ్నను సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: אֹזֶן
  choice: చెవి
  rationale: వినికిడి, వివేచనను సూచించే మూలభాషలోని శరీరావయవ రూపకాన్ని నిలుపుతుంది.
- source_word: מִלִּין
  choice: మాటలను
  rationale: ‘పదాలు/మాటలు/వాక్కు’ అనే అర్థపరిధిలో, చెవి వినే విషయానికి సహజమైన తెలుగు ఎంపిక.
- source_word: תִּבְחָן
  choice: పరీక్షిస్తుంది
  rationale: విని పరిశీలించి మంచిచెడులను నిర్ధారించే భావాన్ని, రుచి చూసే సమాంతర చిత్రంతో కలిపి నిలుపుతుంది.
- source_word: חֵךְ
  choice: అంగిలి
  rationale: ‘నోరు’ కంటే నిర్దిష్టంగా palate అనే శరీరభాగాన్ని సూచించి, చెవితో ఉన్న ఇంద్రియ సమాంతరతను కాపాడుతుంది.
- source_word: אֹכֶל
  choice: ఆహారాన్ని
  rationale: తినే పదార్థాన్ని సూచించే గౌరవప్రదమైన, సాధారణ ఆధునిక తెలుగు పదం.
- source_word: יִטְעַם
  choice: రుచి చూస్తుంది
  rationale: మూలంలోని ‘రుచి చూడు’ అనే సాధారణ క్రియార్థాన్ని సహజ తెలుగులో అందిస్తుంది.
- source_word: לוֹ
  choice: ప్రత్యేకంగా అనువదించలేదు
  rationale: ఇక్కడ అంగిలి చేసే క్రియను సూచించే దాతృక సర్వనామం తెలుగులో సహజంగా అంతర్లీనమవుతుంది; ‘తనకొరకు’ అని వ్యక్తం చేస్తే అనవసరమైన స్వార్థార్థ ఛాయ కలగవచ్చు.
