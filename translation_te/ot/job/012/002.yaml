source:
  edition: WLC
  text: אָ֭מְנָם כִּ֣י אַתֶּם עָ֑ם וְ֝/עִמָּ/כֶ֗ם תָּמ֥וּת חָכְמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/012/002.yaml
  text: No doubt you are the people[a], and wisdom will die with you.
translation:
  language: te
  text: నిజమే, ప్రజలంటే మీరే[a]; మీతోపాటే జ్ఞానం చనిపోతుంది!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నిజమే, ప్రజలంటే మీరే; మీతో జ్ఞానం అంతమవుతుంది.” ఈ మాటను సాధారణంగా యోబు తన స్నేహితులను ఉద్దేశించి చెప్పిన వ్యంగ్యంగా అర్థం చేసుకుంటారు.
    reason: ‘ప్రజలు’ అనే పదబంధానికి సాధ్యమైన మరింత అక్షరార్థ రూపాన్ని, వాక్యంలోని వ్యంగ్య స్వరాన్ని తెలియజేయడానికి.
lexical_decisions:
- source_word: אָמְנָם כִּי
  choice: నిజమే
  rationale: ఈ సంయుక్త ప్రయోగం బలమైన అంగీకారాన్ని సూచిస్తుంది; సందర్భంలో యోబు వ్యంగ్యంగా మాట్లాడుతున్నాడు. ‘నిజమే’ సహజమైన ఆధునిక తెలుగులో ఆ బలాన్ని నిలుపుతుంది.
- source_word: אַתֶּם
  choice: మీరు
  rationale: యోబు తన స్నేహితులను నేరుగా సంబోధిస్తున్న ద్వితీయ పురుష బహువచన సర్వనామం.
- source_word: עָם
  choice: ప్రజలంటే … మీరే
  rationale: ‘ప్రజలు’ అనే మూలార్థాన్ని నిలుపుతూ, వారు మాత్రమే లెక్కించదగిన ప్రజలన్నట్టు చెప్పే వ్యంగ్య భావాన్ని సహజమైన తెలుగు వాక్యనిర్మాణంలో వ్యక్తం చేస్తుంది.
- source_word: וְעִמָּכֶם
  choice: మీతోపాటే
  rationale: జ్ఞానం వారి వెంటనే అంతమవుతుందనే వ్యంగ్య సహచర్య భావాన్ని స్పష్టంగా తెలియజేస్తుంది; ‘ఏ’ నొక్కి చెప్పే భావాన్ని ఇస్తుంది.
- source_word: תָּמוּת
  choice: చనిపోతుంది
  rationale: מות అనే క్రియ యొక్క ప్రత్యక్షమైన ‘చనిపోవు’ భావాన్ని, జ్ఞానాన్ని వ్యక్తీకరించే మూలపాఠ చిత్రణను నిలుపుతుంది.
- source_word: חָכְמָה
  choice: జ్ఞానం
  rationale: חָכְמָהకు సాధారణమైన, సందర్భోచితమైన తెలుగు సమానార్థకం.
theological_decisions:
- issue: వాక్యంలోని వ్యంగ్య స్వరం
  choice: ప్రధాన పాఠంలో మాటలను ప్రత్యక్షంగా ఉంచి, ఆశ్చర్యార్థక చిహ్నంతో వ్యంగ్యపు కాటును సూచించడం
  alternative: ‘మీరు అలా అనుకుంటున్నారు’ వంటి వివరణాత్మక మాటలను పాఠంలో చేర్చడం
  rationale: వ్యంగ్యం సందర్భం నుంచి ఉద్భవిస్తుంది; మూలంలో లేని వివరణను చేర్చకుండా దాని ఉద్వేగాన్ని నిలుపడం సముచితం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా, సామాన్య పాఠకులకు అర్థమయ్యేలా రూపొందించబడింది. ‘ప్రజలంటే మీరే’ అనే నుడికారం హెబ్రీ వ్యంగ్యాన్ని తెలుగులో సహజంగా మోస్తుంది; ‘చనిపోతుంది’ జ్ఞానాన్ని వ్యక్తీకరించే మూలచిత్రాన్ని కాపాడుతుంది.
