  text: With the aged is wisdom[a], and with length of days[b], understanding.
translation:
  language: te
  text: వృద్ధులలో జ్ఞానం ఉంది[a]; దీర్ఘాయుష్షులో వివేచన ఉంది[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వృద్ధుల దగ్గర జ్ఞానం ఉంది.’ హీబ్రూ ఉపసర్గ సహవాసాన్ని లేదా ఒక వర్గంలో ఉండటాన్ని సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘దినాల పొడవు’; అంటే దీర్ఘ జీవితం లేదా అనేక దినాలు.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּישִׁישִׁים
  choice: వృద్ధుల దగ్గర
  rationale: בְּ ఉపసర్గ ఇక్కడ సహవాసాన్ని లేదా ఒక వర్గంలో ఉండటాన్ని సూచించగలదు. ‘వృద్ధుల దగ్గర’ అనేది జ్ఞానం వృద్ధులతో ఉందనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; ‘వృద్ధులలో’ కూడా సాధ్యమే.
- source_word: חָכְמָה
  choice: జ్ఞానం
  rationale: జ్ఞానసాహిత్యంలో חָכְמָהకు ప్రామాణికమైన, సహజమైన తెలుగు పదం; ఆచరణాత్మక జ్ఞాన భావాన్ని మోయగలదు.
- source_word: וְאֹרֶךְ יָמִים
  choice: దీర్ఘాయుష్షుతో
  rationale: అక్షరార్థంగా ‘దినాల దీర్ఘత.’ తెలుగులో ‘దీర్ఘాయుష్షు’ అదే హీబ్రూ నుడికార భావాన్ని సంక్షిప్తంగా, గౌరవప్రదంగా అందిస్తుంది; అక్షరార్థ రూపాన్ని పాదసూచికలో ఉంచాం.
- source_word: תְּבוּנָה
  choice: వివేచన
  rationale: תְּבוּנָה అవగాహనతో కూడిన విచక్షణను సూచిస్తుంది. ‘వివేచన’ మొదటి అర్ధపాదంలోని ‘జ్ఞానం’తో అర్థభేదాన్ని నిలుపుతుంది.
theological_decisions:
- issue: వయస్సు మరియు జ్ఞానం మధ్య సంబంధం
  choice: సామెతసదృశమైన సాధారణ వాక్యంగా అనువదించబడింది
  alternative: వృద్ధులందరూ తప్పనిసరిగా జ్ఞానులనే నిరపేక్ష ప్రకటనగా చూపడం
  rationale: హీబ్రూ కవితా సందర్భంలోని ఉద్రిక్తతను నిలుపుతూ, మూలంలో లేని సిద్ధాంతాత్మక నిర్ధారణను చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కవితా సమాంతరతను లక్ష్యంగా పెట్టుకున్నాం. రెండవ అర్ధపాదంలో తెలుగు సహజత్వం కోసం ‘వస్తుంది’ వాడబడింది; అది మూలంలోని నామవాచక వాక్య భావాన్ని స్పష్టపరుస్తుంది.
