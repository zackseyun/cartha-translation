source:
  edition: WLC
  text: גַּם לִ֤/י לֵבָ֨ב כְּֽמוֹ/כֶ֗ם לֹא נֹפֵ֣ל אָנֹכִ֣י מִ/כֶּ֑ם וְ/אֶת מִי אֵ֥ין כְּמוֹ אֵֽלֶּה־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/012/003.yaml
  text: I too have a mind like you; I am not inferior to you[a]. And who does not know such things as these?
translation:
  language: te
  text: నాకూ మీలాగే ఆలోచించే సామర్థ్యం ఉంది; నేను మీకంటే తక్కువవాడిని కాను.[a] ఇలాంటి విషయాలు ఎవరికి తెలియవు?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “నాకూ మీలాంటి హృదయం ఉంది.” ఇక్కడ “హృదయం” ఆలోచన లేదా అవగాహన సామర్థ్యాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: నాకూ
  rationale: అయోబు తన స్నేహితులకు ఉన్న సామర్థ్యం తనకూ ఉందని చేర్పుతో కూడిన నొక్కిచెప్పడం సహజంగా వ్యక్తమవుతుంది.
- source_word: לִי לֵבָב
  choice: ఆలోచించే సామర్థ్యం ఉంది
  rationale: לֵבָב అక్షరార్థంగా ‘హృదయం’; ఇక్కడ అది ఆలోచన, అవగాహన అనే అంతరంగిక మానసిక సామర్థ్యాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో సందర్భార్థాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: כְּמוֹכֶם
  choice: మీలాగే
  rationale: అయోబు తన సంభాషణ సహచరులతో చేసుకున్న పోలికను సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: לֹא נֹפֵל אָנֹכִי מִכֶּם
  choice: నేను మీకంటే తక్కువవాడిని కాను
  rationale: נפל מן అనే తులనాత్మక ప్రయోగం ‘ఎవరికన్నా దిగువన లేదా తక్కువగా ఉండడం’ అనే భావాన్ని ఇస్తుంది; ఈ తెలుగు రూపం ఆ భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: וְאֶת מִי אֵין כְּמוֹ אֵלֶּה
  choice: ఇలాంటి విషయాలు ఎవరికి తెలియవు?
  rationale: హీబ్రూ వాక్యం సంక్షిప్తంగా, కొంత అధ్యాహారంగా ఉంది. సందర్భంలో స్నేహితుల మాటలు అందరికీ తెలిసిన సాధారణ విషయాలేనని అయోబు ప్రశ్నార్థకంగా పేర్కొంటున్న భావాన్ని ఈ రూపం అందిస్తుంది.
