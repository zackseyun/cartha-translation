translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. హీబ్రూ ‘హృదయం’ అనే రూపకానికి గల సందర్భార్థాన్ని ప్రధాన పాఠ్యంలో స్పష్టపరచి, అక్షరార్థాన్ని పాదసూచికలో నిలిపాం. చివరి ప్రశ్నలోని అలంకారిక, స్వల్ప వ్యంగ్య ధోరణిని కాపాడాం.
