  yaml_path: translation/ot/job/041/026.yaml
  text: He looks on everything that is high[a]; he is king over all the sons of pride.
translation:
  language: te
  text: 'అతడు ఎత్తైనదంతటినీ చూస్తాడు;

    గర్వపుత్రులందరి మీద అతడే రాజు.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘గర్వపు కుమారులందరు’; అంటే గర్విష్ఠులందరు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵת כָּל גָּבֹהַּ
  choice: ఎత్తైనదంతటినీ
  rationale: אֵת కర్మను సూచిస్తుంది; כָּל‌తో ఏకవచన విశేషణమైన גָּבֹהַּ కలసి ‘ఎత్తైనదంతా’ అనే సమగ్ర భావాన్ని ఇస్తుంది. ‘ఎత్తైన’ అనే మాట భౌతిక ఎత్తుతోపాటు ఔన్నత్యం లేదా గర్వం అనే సూచనను కూడా తెరిచి ఉంచుతుంది.
- source_word: יִרְאֶה
  choice: చూస్తాడు
  rationale: ראה యొక్క ప్రాథమిక అర్థం ‘చూడు’. సందర్భం సూచించే నిర్భయమైన వీక్షణను పాఠకుడు గ్రహించగలిగేలా, మూలానికి దగ్గరగా ఉన్న సహజమైన తెలుగు రూపం ఎంచుకోబడింది.
- source_word: הוּא מֶלֶךְ
  choice: అతడే రాజు
  rationale: స్వతంత్ర సర్వనామం הוּא ఇచ్చే ఉద్ఘాటనను ‘అతడే’ తెలియజేస్తుంది; מֶלֶךְ యొక్క రాజరిక రూపకాన్ని ‘రాజు’ నిలుపుతుంది.
- source_word: עַל כָּל בְּנֵי שָׁחַץ
  choice: గర్వపుత్రులందరి మీద
  rationale: עַל పాలన లేదా ఆధిపత్యాన్ని సూచించే ‘మీద’గా అనువదించబడింది. בְּנֵי שָׁחַץ అనే ‘గర్వపు కుమారులు’ రూపకాన్ని సంక్షిప్తమైన ‘గర్వపుత్రులు’గా నిలిపి, అది ఏ ప్రత్యేక జీవుల వర్గమో నిర్ణయించకుండా ఉంచబడింది.
theological_decisions:
- issue: ‘గర్వపుత్రులందరు’ ఎవరిని సూచిస్తారు?
  choice: గర్వం లేదా అహంకారంతో లక్షణీకరించబడిన జీవులు/వ్యక్తులందరినీ సూచించే కవితాత్మక వర్గనామంగా ఉంచడం
  alternative: ప్రత్యేకంగా క్రూరమృగాలు లేదా గర్విష్ఠమైన విశ్వశక్తులు అని నిర్దిష్టీకరించడం
  rationale: మూలంలోని రూపకం ఏ ఒక్క జంతుశాస్త్రీయ లేదా పురాణాత్మక వర్గానికీ పరిమితం చేయదు. లివ్యాతాను వారందరి మీద రాజుగా చిత్రించే భావాన్ని ఉంచుతూ ఆ ఉద్దేశపూర్వక అస్పష్టతను కాపాడాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కవితా వాక్యనిర్మాణం వాడబడింది. ‘గర్వపుత్రులు’ సాధారణ సంభాషణలో అరుదైనా, మూలంలోని బలమైన ‘sons of pride’ రూపకాన్ని నిలుపుతుంది; పాదటిప్పణి దాని అర్థాన్ని స్పష్టం చేస్తుంది.
