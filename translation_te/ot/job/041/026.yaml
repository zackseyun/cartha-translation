  terminology: ‘రాజు’ is the direct and suitable rendering of מֶלֶךְ. ‘గర్వపుత్రులు’ responsibly maintains the Hebrew ‘sons of pride’ idiom without prematurely identifying the referents as animals, hostile powers, or merely proud people. The footnote supplies an accessible explanation while retaining the literal expression.
