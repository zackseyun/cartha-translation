  text: הֵן תֹּחַלְתּ֥/וֹ נִכְזָ֑בָה הֲ/גַ֖ם אֶל מַרְאָ֣י/ו יֻטָֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/041/001.yaml
  text: Behold[a], his hope proves false[b]; is one not cast down even at the sight of him?
translation:
  language: te
  text: ఇదిగో, అతని ఆశ వమ్మవుతుంది[a]; దాని రూపాన్ని చూడగానే ఎవడైనా అణగిపోడా[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతని నిరీక్షణ భగ్నమవుతుంది,” లేదా “అతని నమ్మకం విఫలమవుతుంది.” హెబ్రీ క్రియ ఆశ మోసపూరితమైనదిగా లేదా నెరవేరనిదిగా తేలడాన్ని నొక్కిచెప్పగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “దాని రూపాన్ని చూసినంత మాత్రాన ఎవడైనా కూలిపోడా?” లేదా “దాని రూపం కనిపించగానే ఎవడైనా పడగొట్టబడడా?”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: ఇదిగో
  rationale: శ్రోత దృష్టిని ఆకర్షిస్తూ బలమైన ప్రకటనను పరిచయం చేసే హెబ్రీ పదబలాన్ని, కవితాత్మకమైనప్పటికీ సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: תֹּחַלְתּוֹ
  choice: అతని ఆశ
  rationale: ఈ నామవాచకం ఆశ లేదా నిరీక్షణను సూచిస్తుంది. ‘అతని ఆశ’ మూలంలోని పురుష ఏకవచన ప్రత్యయాన్ని, అలాగే ఎవరి ఆశ అన్న సందర్భార్థాన్ని అతిగా వివరించకుండా కాపాడుతుంది.
- source_word: נִכְזָבָה
  choice: వమ్మవుతుంది
  rationale: כזב మూలంలోని విఫలమవడం, మోసపోవడం లేదా నిజం కాదని తేలడం అనే ఫలిత భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; ఆశ నెరవేరదనే భావాన్ని అతిగా వ్యాఖ్యానించకుండా వ్యక్తం చేస్తుంది.
- source_word: הֲגַם
  choice: …పోడా?
  rationale: ప్రశ్నార్థక కణం మరియు బలపరిచే కణం కలసి సృష్టించే అలంకార ప్రశ్నను తెలుగు వ్యతిరేక ప్రశ్నారూపం సహజంగా అందిస్తుంది; ‘చూడగానే’ అన్న నిర్మాణం ‘కనిపించినంత మాత్రాన కూడా’ అనే తీవ్రతను మోస్తుంది.
- source_word: אֶל מַרְאָיו
  choice: దాని రూపం చూడగానే
  rationale: మַרְאֶהలోని రూపం/కనిపించడం అనే భావాన్ని కాపాడుతూ, దాన్ని చూసినప్పుడు కలిగే ప్రతిచర్యను తెలుగులో సహజంగా వ్యక్తం చేస్తుంది. జీవిని సూచించేందుకు ‘దాని’ వాడటం వల్ల, ఆశ పెట్టుకున్న మనిషిని సూచించే ‘అతని’తో భేదం స్పష్టమవుతుంది.
- source_word: יֻטָל
  choice: అతడు నేలకూలిపోడా
  rationale: హోఫల్ రూపంలోని కింద పడవేయబడటం లేదా అణగిపోవడం అనే నిష్క్రియాత్మక ఫలితాన్ని సహజమైన తెలుగు అలంకార ప్రశ్నగా అందిస్తుంది. మూలంలో కర్త స్పష్టంగా లేకపోయినా, ముందు చెప్పిన ఆశ కలిగిన వ్యక్తినే సూచించేలా ‘అతడు’ ఉపయోగించబడింది.
