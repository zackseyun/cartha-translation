translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కవితాత్మక శైలి పాటించబడింది. ‘ఇదిగో’ మూలంలోని ఉద్ఘాటనను, ‘వమ్మవుతుంది’ సాధారణ పాఠకులకు అర్థమయ్యే సహజ భాషను అందిస్తాయి. మనిషికి ‘అతని/అతడు,’ లివ్యాతానుకు ‘దాని’ వాడటం ద్వారా హెబ్రీ ప్రత్యయాల సూచనలను తెలుగులో స్పష్టంగా వేరు చేశాం; అయితే వ్యక్తి ఎవరన్నది మూలంలాగే నిర్దిష్టం చేయలేదు.
