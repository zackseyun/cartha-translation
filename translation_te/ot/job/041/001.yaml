- from: ఇదిగో, అతని ఆశ వమ్మవుతుంది[a]; దాని రూపం చూడగానే అతడు నేలకూలిపోడా[b]?
  to: ఇదిగో, అతని ఆశ వమ్మవుతుంది[a]; దాని రూపాన్ని చూడగానే ఎవడైనా అణగిపోడా[b]?
  rationale: 'The revision preserves the contrast implicit in the verse: a person''s hope proves false, and any person is overwhelmed merely on seeing the creature. It avoids making the second subject identical with the first-clause possessor, preserves the creature-reference with ‘దాని,’ and uses ‘అణగిపోవడం’ for the broader passive/resultative sense of being laid low.'
  reviewer_model: gpt-5.6-terra
