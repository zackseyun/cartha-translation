  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు స్పష్టంగా ఉండే గంభీర కవితాత్మక శైలి. సందర్భం పొలుసుల గురించి కావడంతో నపుంసక సూచనలను వాడి, హెబ్రీ సమాంతర నిర్మాణాన్ని రెండు పాదాలుగా నిలిపాం.
