source:
  edition: WLC
  text: אִישׁ בְּ/אָחִ֥י/הוּ יְדֻבָּ֑קוּ יִ֝תְלַכְּד֗וּ וְ/לֹ֣א יִתְפָּרָֽדוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/041/009.yaml
  text: Each one sticks to its fellow[a]; they are clasped together and cannot be separated.
translation:
  language: te
  text: 'ఒక్కొక్కటి తన తోటి దానితో[a] అతుక్కొని ఉంటుంది;

    అవి ఒకదానితో ఒకటి బిగుసుకొని విడిపోవు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “ఒక్కొక్కటి తన సహోదరునితో అంటుకొని ఉంటుంది.” ఇక్కడ “సహోదరుడు” పక్కపక్కనే ఉన్న పొలుసుల మధ్య సన్నిహిత సంబంధాన్ని తెలిపే కవితాత్మక రూపకం.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: ఒక్కొక్కటి
  rationale: ఇక్కడ אִישׁ ‘మనిషి’ అనే అర్థంలో కాకుండా, లివ్యాతాను పొలుసుల్లో ప్రతి ఒక్కదానిని విడివిడిగా సూచించే పంపిణీయ ప్రయోగం. అందువల్ల ‘ఒక్కొక్కటి’ సహజంగా, సందర్భానుగుణంగా ఉంది.
- source_word: בְּאָחִיהוּ
  choice: తన తోటి దానితో
  rationale: అక్షరార్థంగా ‘తన సహోదరునితో/సోదరునితో.’ ప్రాణిలేని పొలుసుల కవితాత్మక వర్ణనలో పక్కనున్న సమాన భాగాన్ని సూచించడానికి ‘తన తోటి దానితో’ సహజంగా ఉంటుంది; మూలంలోని బంధుత్వ రూపకాన్ని పాదసూచికలో ఉంచాం.
- source_word: יְדֻבָּקוּ
  choice: అతుక్కొని ఉంటుంది
  rationale: דבק ధాతువు దగ్గరగా అంటుకొని ఉండడాన్ని సూచిస్తుంది. హెబ్రీలో క్రియ బహువచనమైనా, పంపిణీయ భావమున్న ‘ఒక్కొక్కటి’తో తెలుగులో ఏకవచన క్రియ సహజం.
- source_word: יִתְלַכְּדוּ
  choice: ఒకదానితో ఒకటి బిగుసుకొని
  rationale: ఈ క్రియ పట్టుబడటం, కలసి చిక్కుకోవటం లేదా గట్టిగా బంధించబడటాన్ని సూచిస్తుంది. ‘బిగుసుకొని’ పొలుసులు గట్టిగా పరస్పరం అమరిన దృశ్యాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וְלֹא יִתְפָּרָדוּ
  choice: విడిపోవు
  rationale: నిషేధంతో కూడిన క్రియ అవి వేరుపడవని తెలుపుతుంది. ‘విడిపోవు’ మూలంలోని నేరైన వాక్యరూపాన్ని కాపాడుతుంది; సామర్థ్యార్థమైన ‘విడదీయలేరు’ అని అవసరానికి మించి వ్యాఖ్యానించదు.
