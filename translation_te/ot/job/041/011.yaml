  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ కవితాత్మక గాంభీర్యం నిలిచే పదాలను వాడాం. రెండు సమాంతర పాదాల అగ్ని దృశ్యాన్ని కాపాడాం; అరుదైన హెబ్రీ పదంలోని అనిశ్చితిని పాదటిప్పణిలో స్పష్టంగా ఉంచాం.
