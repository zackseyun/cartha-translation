translation:
  language: te
  text: 'దాని నోటినుండి కాగడాలు వెలువడతాయి;

    నిప్పు రవ్వలు[a] ఎగసివెలువడతాయి.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అరుదైన ఈ హెబ్రీ పదబంధాన్ని ‘మండే కొరివులు’ లేదా ‘మండే అగ్ని బాణాలు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִפִּיו
  choice: దాని నోటినుండి
  rationale: מִן‌తో కూడిన ‘నోరు’ మరియు 3వ పురుష ఏకవచన ప్రత్యయం మూలం లేదా వెలువడే స్థలాన్ని సూచిస్తున్నాయి. సందర్భంలో లివ్యాతాను ఒక జంతువు కాబట్టి ఆధునిక తెలుగులో ‘దాని’ సహజంగా ఉంది; హెబ్రీ వ్యాకరణ లింగాన్ని తెలుగులో అనవసరంగా పురుషలింగంగా మార్చలేదు.
- source_word: לַפִּידִים
  choice: కాగడాలు
  rationale: ఈ పదం సాధారణంగా వెలిగే కాగడాలను లేదా మండే కొరివులను సూచిస్తుంది. ‘కాగడాలు’ స్పష్టమైన, concrete అగ్ని దృశ్యాన్ని నిలుపుతుంది.
- source_word: יַהֲלֹכוּ
  choice: బయలుదేరుతాయి
  rationale: మూల క్రియ అక్షరార్థంగా ‘వెళ్తాయి/నడుస్తాయి’; నోటినుండి వెలువడే అగ్ని వస్తువుల సందర్భంలో ‘బయలుదేరుతాయి’ దిశాభావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: כִּידֹדֵי אֵשׁ
  choice: నిప్పు రవ్వలు
  rationale: כִּידֹדֵי అరుదైన, అర్థం వివాదాస్పదమైన పదం. కవితా సమాంతరతలో ఇది మండే కణాలు లేదా అగ్ని ప్రక్షేపాల భావాన్ని ఇస్తుంది. ‘నిప్పు రవ్వలు’ సందర్భానికి సహజంగా సరిపోతూ, మరీ నిర్దిష్టమైన ఆయుధ రూపకాన్ని రుద్దదు; ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: יִתְמַלָּטוּ
  choice: దూసుకువస్తాయి
  rationale: מלט యొక్క ప్రాథమిక భావం ‘తప్పించుకొను/బయటపడు.’ ఇక్కడ అగ్ని అకస్మాత్తుగా నోటినుండి వెలువడే చలనాన్ని ‘దూసుకువస్తాయి’ సహజమైన, సజీవమైన తెలుగులో వ్యక్తం చేస్తుంది.
