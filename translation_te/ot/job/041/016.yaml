  text: His heart is hard like a stone[a], hard like the lower millstone.
translation:
  language: te
  text: దాని హృదయం రాయిలా గట్టిగా ఉంది; తిరుగలి కింది రాయిలా దృఢంగా ఉంది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తిరుగలి కింది రాయిలా ఘనంగా ఉంది.” హీబ్రూ క్రియకు అక్షరార్థంగా పోయడం లేదా పోసి మలచడం అనే భావం ఉంది; అందువల్ల ఇక్కడ అది గట్టిగా, ఘనంగా, లేదా దృఢంగా ఉండడాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבּוֹ
  choice: దాని హృదయం
  rationale: לֵב ఇక్కడ లివ్యాతాను అంతరంగంలోని ధైర్యం లేదా స్పందనలేమిని సూచించే కవితాత్మక ‘హృదయం’; తెలుగులో ‘హృదయం’ ఈ రూపకాన్ని సహజంగా నిలుపుతుంది.
- source_word: יָצוּק
  choice: గట్టిగా ఉంది / దృఢంగా ఉంది
  rationale: יצק మూలార్థం ‘పోయడం, పోతపోయడం’; ఇక్కడ పోతపోసిన వస్తువులా ఘనంగా, కదలని స్థితిని సూచిస్తుంది. రెండు సమాంతర పాదాల్లో ‘గట్టిగా’, ‘దృఢంగా’ అని ఇవ్వడం భావాన్నీ తెలుగు కవితాత్మక సహజత్వాన్నీ కాపాడుతుంది.
- source_word: כְּמוֹ אָבֶן
  choice: రాయిలా
  rationale: రాయితో చేసిన ప్రత్యక్ష ఉపమానాన్ని సంక్షిప్తమైన, సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: כְּפֶלַח תַּחְתִּית
  choice: తిరుగలి అడుగురాయిలా
  rationale: ఈ పదబంధం తిరుగలిలో స్థిరంగా ఉండే కింది రాయిని సూచిస్తుంది; ‘అడుగురాయి’ దాని స్థానాన్నీ అసాధారణ దృఢత్వాన్నీ స్పష్టంగా తెలియజేస్తుంది.
