  text: దాని ముఖపు తలుపులను ఎవరు తెరిచారు? దాని పళ్ల చుట్టూ భీతి ఉంది[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దాని నోటి తలుపులను ఎవరు తెరవగలరు?” హీబ్రూలో అక్షరార్థంగా “దాని ముఖపు తలుపులు” అని ఉంది; ఇది నోరు లేదా దవడలను సూచించే కవితాత్మక వ్యక్తీకరణ.
    reason: lexical_alternative
  - marker: b
