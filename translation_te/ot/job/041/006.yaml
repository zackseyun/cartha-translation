lexical_decisions:
- source_word: דַּלְתֵי
  choice: తలుపులను
  rationale: ‘తలుపులు’ అనే మూల రూపకాన్ని నిలుపుతుంది; ‘దవడలు’ అనేది సందర్భానుసార వివరణ కాబట్టి పాదసూచికలో ఉంచబడింది.
- source_word: פָנָיו
  choice: దాని ముఖపు
  rationale: హీబ్రూ పదానికి సాధారణ అర్థమైన ‘ముఖం’ను నిలుపుతూ, ముఖం లేదా నోటి ముందుభాగాన్ని సూచించే కవితాత్మక చిత్రణను సంరక్షిస్తుంది.
- source_word: מִי
  choice: ఎవరు
  rationale: అలంకారిక ప్రశ్నను ప్రారంభించే సాధారణ ప్రశ్నార్థక సర్వనామం.
- source_word: פִתֵּחַ
  choice: తెరిచారు
  rationale: ‘తెరవడం’ అనే క్రియ యొక్క పూర్తయిన చర్యరూపాన్ని నేరుగా వ్యక్తపరుస్తుంది; సామర్థ్యాన్ని సూచించే ‘తెరవగలరు’ అనేది సందర్భార్థ ప్రత్యామ్నాయం.
- source_word: סְבִיבוֹת
  choice: చుట్టూ
  rationale: చుట్టుముట్టిన స్థితిని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: שִׁנָּיו
  choice: దాని పళ్ల
  rationale: మూలంలోని సాధారణ ‘పళ్లు’ అనే అర్థాన్ని నిలుపుతుంది; ‘కోరలు’ అనడం మూలార్థాన్ని అనవసరంగా తీవ్రం చేస్తుంది.
- source_word: אֵימָה
  choice: భయానకత
  rationale: తీవ్రమైన భయం లేదా భీతిని సూచించే నామవాచక భావాన్ని, పళ్ల చుట్టూ ఉన్న భయంకర స్వభావంగా తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
