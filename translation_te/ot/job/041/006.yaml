- from: దాని ముఖపు తలుపులను ఎవరు తెరిచారు? దాని పళ్ల చుట్టూ భయానకత ఉంది[a][b].
  to: దాని ముఖపు తలుపులను ఎవరు తెరిచారు? దాని పళ్ల చుట్టూ భీతి ఉంది[a][b].
  rationale: The revision changes only the rendering of אֵימָה from భయానకత (‘frightfulness’) to భీతి (‘terror, dread’). This more closely reflects the Hebrew while improving idiomatic Telugu. The primary text continues to preserve the source’s striking ‘doors of his face’ image, and both footnote anchors and their lexical alternatives are retained.
