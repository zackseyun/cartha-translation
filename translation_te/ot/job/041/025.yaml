  text: אֵֽין עַל עָפָ֥ר מָשְׁל֑/וֹ הֶ֝/עָשׂ֗וּ לִ/בְלִי חָֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/041/025.yaml
  text: On earth there is none like him[b][a], one made without fear.
translation:
  language: te
  text: భూమిమీద దానికి సాటియైనది ఏదీ లేదు[a]; అది భయమెరుగనిదిగా చేయబడింది[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “భూమిమీద దానిలాంటిది ఏదీ లేదు”; ఇక్కడి హెబ్రీ పదం పోలికను లేదా సమానత్వాన్ని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “భయం లేకుండా చేయబడింది,” అంటే భీతికి లోబడని ప్రాణిగా చేయబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין עַל עָפָר
  choice: భూమిమీద ... లేదు
  rationale: అక్షరార్థంగా ‘ధూళిమీద లేదు’; సందర్భంలో భూలోకంలోని సమస్తాన్ని సూచించే సహజమైన తెలుగు ప్రయోగంగా ‘భూమిమీద’ ఎంచుకున్నాం.
- source_word: מָשְׁלוֹ
  choice: దానికి సాటి
  rationale: ఇక్కడ ఈ పదం పోలిక లేదా సమానత్వాన్ని సూచిస్తుంది. ‘దానికి సాటి’ అనేది రెండింటినీ సహజంగా వ్యక్తపరుస్తుంది; ‘దాని పాలకుడు’ అనే అర్థం సందర్భానికి సరిపోదు.
- source_word: הֶעָשׂוּ
  choice: అది ... చేయబడింది
  rationale: עשה మూలం నుంచి వచ్చిన ఈ రూపంలోని చేయబడిన స్థితిని కర్మణి ప్రయోగంతో నేరుగా నిలిపాం.
- source_word: לִבְלִי חָת
  choice: భయం లేకుండా
  rationale: ఈ పదబంధం భీతి లేదా జడుపు లేకపోవడాన్ని సూచిస్తుంది. ‘భయం లేకుండా’ సాధారణ పాఠకులకు సహజంగా ఉండి మూలంలోని భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: ప్రాణి భయపడదనే వర్ణనను దాని సృష్టి ఉద్దేశంగా అర్థం చేసుకోవాలా?
  choice: ‘భయం లేకుండా చేయబడింది’ అని మూలంలోని సంక్షిప్త నిర్మాణాన్ని నిలిపాం.
  alternative: ‘భయపడకుండా ఉండటానికి సృష్టించబడింది’
  rationale: ప్రత్యామ్నాయం ఉద్దేశం లేదా లక్ష్యాన్ని మరింత స్పష్టంగా నిర్ధారిస్తుంది; హెబ్రీ నిర్మాణం స్థితిని లేదా ఫలితాన్ని కూడా సూచించవచ్చు. అందువల్ల ఆ ఉద్రిక్తతను పరిష్కరించకుండా ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గంభీరమైనప్పటికీ సాధారణ పాఠకులకు స్పష్టంగా ఉండే శైలి. సందర్భంలోని ప్రాణిని తెలుగులో సహజంగా సూచించేందుకు నపుంసక ఏకవచన సర్వనామం ‘అది/దానికి’ వాడాం.
