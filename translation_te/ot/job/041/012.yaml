translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, కవితాత్మక గంభీరతతో పాటు సామాన్య పాఠకులకు అర్థమయ్యే పదజాలం వాడబడింది. హీబ్రూ ఉపమానంలోని సంక్షిప్త నిర్మాణాన్ని తెలుగులో స్పష్టంగా చేయడానికి ‘లోనుండి వచ్చినట్లుగా’ చేర్చబడింది. మూలంలో జంతువుకు పుంలింగ ఏకవచన ప్రత్యయం ఉన్నా, సహజ తెలుగు వాడుకలో ‘దాని’ ఎంచుకోబడింది.
