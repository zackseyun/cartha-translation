source:
  edition: WLC
  text: מִ֭/נְּחִירָי/ו יֵצֵ֣א עָשָׁ֑ן כְּ/ד֖וּד נָפ֣וּחַ וְ/אַגְמֹֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/job/041/012.yaml
  text: Smoke goes out from his nostrils[b][a], like a boiling pot and burning rushes.
translation:
  language: te
  text: దాని ముక్కురంధ్రాల నుండి పొగ వెలువడుతుంది—గాలి ఊది వేడెక్కించిన కుండ నుండీ, రెల్లుల నుండీ పొగ వచ్చినట్లుగా.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘కుండ’కు మూలమైన హీబ్రూ పదం వంటకుండను లేదా పెద్ద లోహపాత్రను కూడా సూచించవచ్చు. ‘గాలి ఊది వేడెక్కించిన’ అనే మాట మూలంలోని ఊదడం ద్వారా వేడెక్కించిన భావాన్ని తెలియజేస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘రెల్లు’ అనేది చిత్తడి నేలలో పెరిగే రెల్లు లేదా జమ్మువంటి మొక్కలను సూచిస్తుంది. ఇక్కడ అవి మంటకు ఇంధనంగా వాడబడి దట్టమైన పొగను కలిగిస్తున్న దృశ్యం ఉద్దేశించి ఉండవచ్చు.
    reason: cultural_note
lexical_decisions:
- source_word: מִנְּחִירָיו
  choice: దాని ముక్కురంధ్రాల నుండి
  rationale: నְחִירַיִם శరీరంలోని ముక్కురంధ్రాలను సూచిస్తుంది; מִן ఉపసర్గను ‘నుండి’గా, 3 పుంలింగ ఏకవచన ప్రత్యయాన్ని సందర్భానుసారం ‘దాని’గా అనువదించాం.
- source_word: יֵצֵא
  choice: బయలుదేరుతుంది
  rationale: ఇక్కడ అసంపూర్ణ క్రియ కవితాత్మక వర్ణనలో సహజంగా జరిగే చర్యను తెలియజేస్తుంది; ‘బయలుదేరుతుంది’ పొగ వెలువడే చిత్రాన్ని సహజ తెలుగులో నిలుపుతుంది.
- source_word: עָשָׁן
  choice: పొగ
  rationale: עָשָׁןకు సాధారణమైన, సందర్భోచితమైన తెలుగు సమానం.
- source_word: כְּדוּד נָפוּחַ
  choice: మరుగుతున్న కుండలోనుండి వచ్చినట్లుగా
  rationale: דּוּד వంటకుండ లేదా పెద్ద లోహపాత్రను సూచించవచ్చు; נָפוּחַ అక్షరార్థంగా ఊదబడిన లేదా గాలి ఊది వేడెక్కించబడిన భావాన్ని ఇస్తుంది. తెలుగులో దృశ్యాన్ని సహజంగా తెలియజేయడానికి ‘మరుగుతున్న కుండ’ అని ఇచ్చాం.
- source_word: וְאַגְמֹן
  choice: మండుతున్న రెల్లులలోనుండి
  rationale: אַגְמוֹן రెల్లు లేదా చిత్తడి నేలలో పెరిగే రెల్లువంటి మొక్కను సూచిస్తుంది. ఉపమానంలో అవి ఇంధనంగా మండుతూ పొగను కలిగిస్తున్న భావాన్ని సందర్భం సూచిస్తుంది; ‘మండుతున్న’ అనేది ఆ సంక్షిప్త భావాన్ని స్పష్టం చేస్తుంది.
