  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కవితాత్మక శైలిని ఉంచి, ‘డాళ్లు’ అనే మూల రూపకాన్ని ‘పొలుసులు’గా వివరణాత్మకంగా మార్చకుండా నిలిపాం.
