translation:
  language: te
  text: దాని డాళ్ల వరుసలే దాని గర్వం; అవి బిగుతైన ముద్రతో మూసివేయబడ్డాయి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גַּאֲוָה
  choice: గర్వకారణమైన
  rationale: ‘గర్వం/మహిమ’ అనే భావాన్ని, తరువాతి ‘డాళ్ల వరుసలు’తో సహజమైన విశేషణ సంబంధంలో వ్యక్తం చేస్తుంది; జీవి తనంతట తాను గర్విస్తోందనే భావాన్ని అనవసరంగా బలపరచదు.
- source_word: אֲפִיקֵי מָגִנִּים
  choice: డాళ్ల వరుసలు
  rationale: אֲפִיקֵי ఇక్కడ క్రమంగా అమరిన వరుసలు లేదా పొడవైన శ్రేణులను సూచిస్తుంది; מָגִנִּים అనే ‘డాళ్లు’ జీవి పొలుసులకు వాడిన రూపకం కాబట్టి దానిని అలాగే నిలుపుతుంది.
- source_word: סָגוּר
  choice: మూసుకుపోయి
  rationale: డాళ్లలాంటి భాగాల మధ్య ఖాళీ లేకుండా అవి దగ్గరగా మూసి ఉన్న స్థితిని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: חוֹתָם צָר
  choice: బిగువుగా ముద్ర వేయబడ్డాయి
  rationale: ‘బిగువైన ముద్ర’ అనే హీబ్రూ చిత్రాన్ని సహజమైన తెలుగు క్రియారూపంలో నిలుపుతూ, వాటి దృఢమైన అతుకును వ్యక్తం చేస్తుంది.
theological_decisions: []
