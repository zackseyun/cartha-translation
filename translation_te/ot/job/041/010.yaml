  text: His sneezings flash forth light[b][a], and his eyes are like the eyelids of dawn.
translation:
  language: te
  text: దాని తుమ్ములు వెలుగును వెదజల్లుతాయి[a]; దాని కళ్లు ఉషోదయపు కనురెప్పలవలె ఉన్నాయి[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దాని తుమ్ములు వెలుగును ప్రకాశింపజేస్తాయి.” హెబ్రీ క్రియకు వెలుగు ప్రకాశించేలా చేయడం అనే కారణార్థక భావం ఉంది; ఈ వాక్యం అత్యంత కవితాత్మకమైనది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “ఉషోదయపు కనురెప్పలవలె.” ఇది పగలు తొలిసారిగా కళ్లు తెరుస్తున్నట్లుగా కనిపించే వెలుగును సూచించే హెబ్రీ కవితాత్మక రూపకం.
    reason: cultural_note
lexical_decisions:
- source_word: עֲטִישֹׁתָיו
  choice: అది తుమ్మినప్పుడు
  rationale: עטש మూలం తుమ్మడాన్ని సూచిస్తుంది. హెబ్రీ బహువచన నామరూపాన్ని తెలుగులో సహజంగా క్రియాత్మక ఉపవాక్యంగా వ్యక్తం చేశాం.
- source_word: תָּהֶל אוֹר
  choice: వెలుగు మెరుస్తుంది
  rationale: హిఫీల్ క్రియ వెలుగు ప్రకాశించేలా చేయడం అనే భావాన్ని ఇస్తుంది. కవితాత్మక దృశ్యాన్ని సహజ తెలుగులో నిలిపేందుకు ‘వెలుగు మెరుస్తుంది’ ఎంచుకున్నాం.
- source_word: וְעֵינָיו
  choice: దాని కళ్లు
  rationale: వర్ణించబడుతున్న జీవిని తెలుగులో సహజంగా నపుంసక ఏకవచన సర్వనామంతో సూచించాం.
- source_word: כְּעַפְעַפֵּי שָׁחַר
  choice: ఉదయపు కనురెప్పల్లా
  rationale: ‘కనురెప్పలు’ అనే మూల కవితాత్మక రూపకాన్ని వ్యాఖ్యానాత్మకంగా మార్చకుండా నిలిపి, שחרను సహజమైన ‘ఉదయం’తో అనువదించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కవితా శైలిని ఉపయోగించాం. జంతువును సూచించేందుకు ‘దాని’ వాడి, మూలంలోని ‘ఉదయపు కనురెప్పలు’ అనే అసాధారణమైన కానీ ఉద్దేశపూర్వక రూపకాన్ని నిలిపాం.
