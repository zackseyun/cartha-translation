translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కవితా ప్రశ్నలుగా అనువదించాం. జీవిని సూచించడానికి వ్యాకరణపరంగా సహజమైన ‘దాని’ వాడాం. మూలంలోని వస్త్రం–కళ్లెం రూపకాలను నిలుపుతూ, అస్పష్టమైన రెండవ పాదాన్ని పాదటిప్పణిలో వివరించాం.
