source:
  edition: WLC
  text: מִֽי גִ֭לָּה פְּנֵ֣י לְבוּשׁ֑/וֹ בְּ/כֶ֥פֶל רִ֝סְנ֗/וֹ מִ֣י יָבֽוֹא־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/041/005.yaml
  text: Who has stripped off the front of his garment? Who can come within his double bridle?[a]
translation:
  language: te
  text: 'దాని వస్త్రం ముందుభాగాన్ని ఎవరు తొలగించగలరు?


    దాని రెండంచెల కళ్లెంలోకి ఎవరు ప్రవేశించగలరు?[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దాని కళ్లెం మడతలోకి ఎవరు ప్రవేశించగలరు?” హీబ్రూ వ్యక్తీకరణ క్లిష్టమైనది; ఇది రూపకంగా లేవ్యాతాను నోరు, దవడలు, లేదా రెండంచెల పళ్ల వరుసను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: גִלָּה
  choice: విప్పగలరు
  rationale: గלה అంటే కప్పి ఉన్నదాన్ని బయల్పరచడం లేదా తొలగించడం. లివ్యాతాను బయటి కవచాన్ని వస్త్రంగా చిత్రించే సందర్భంలో, ‘విప్పడం’ ఆ రూపకాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: פְּנֵי לְבוּשׁוֹ
  choice: దాని వస్త్రపు పైభాగాన్ని
  rationale: פְּנֵי అనేది ముఖం లేదా ఉపరితలం, לְבוּשׁוֹ అనేది దాని వస్త్రం. ‘పైభాగం’ బయటి కనిపించే ఉపరితలాన్ని సూచిస్తూ, దాన్ని చర్మం లేదా పొలుసులు అని అతిగా నిర్దిష్టం చేయదు.
- source_word: בְּכֶפֶל
  choice: రెండంచెల ... లోపలికి
  rationale: כֶּפֶל రెండింతలు, మడత, లేదా రెండుగా ఉన్న భాగాన్ని సూచిస్తుంది. క్లిష్టమైన మూలచిత్రాన్ని పూర్తిగా పరిష్కరించకుండా ‘రెండంచెల’ అనే పదం దాని ద్విగుణ స్వభావాన్ని నిలుపుతుంది.
- source_word: רִסְנוֹ
  choice: దాని ... కళ్లెం
  rationale: רֶסֶן సాధారణంగా కళ్లెం లేదా మూతికట్టు. లివ్యాతాను నోరు లేదా దవడల ప్రాంతానికి రూపకంగా వాడబడినప్పటికీ, ప్రత్యక్ష పదసామ్యమైన ‘కళ్లెం’ను ప్రధాన పాఠంలో ఉంచాం.
- source_word: מִי יָבוֹא
  choice: ఎవరు వెళ్లగలరు?
  rationale: ప్రశ్నార్థకం మరియు అసంపూర్ణ క్రియ కలిసి సవాలు లేదా అసాధ్యతను వ్యక్తం చేస్తున్నాయి. ‘వెళ్లగలరు?’ సామర్థ్యాన్ని ప్రశ్నిస్తూ తెలుగు కవితా సందర్భంలో సహజంగా ఉంది.
