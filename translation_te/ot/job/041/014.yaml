  yaml_path: translation/ot/job/041/014.yaml
  text: In his neck strength lodges[a], and before him dismay leaps.
translation:
  language: te
  text: దాని మెడలో బలం బస చేస్తుంది; దాని ముందర దిగులు[a] గంతులేస్తుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దాని ముందర భీతి గంతులేస్తుంది.” హెబ్రీ నామవాచకం דְּאָבָה అరుదైనది; ఈ కవితా సందర్భంలో దాని భావం దిగులు లేదా నిరుత్సాహం మొదలుకొని భీతి వరకు ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּצַוָּארוֹ
  choice: దాని మెడలో
  rationale: בְּ అనే ఉపసర్గ ఇక్కడ స్థానార్థకంగా ఉంది. ‘మెడలో’ అనడం బలం అక్కడ నివసిస్తున్నదనే హెబ్రీ కవితా చిత్రాన్ని నిలుపుతుంది.
- source_word: יָלִין
  choice: బస చేస్తుంది
  rationale: לין అనే క్రియకు మౌలికంగా ‘రాత్రి బసచేయడం/నిలిచి ఉండడం’ అనే భావం ఉంది. ఇక్కడ బలం స్థిరంగా నివసిస్తున్నట్లు వ్యక్తీకరించబడింది; ‘బస చేస్తుంది’ ఆ సజీవ చిత్రాన్ని సహజమైన తెలుగులో కాపాడుతుంది.
- source_word: עֹז
  choice: బలం
  rationale: శక్తి లేదా బలాన్ని సూచించే సాధారణ నామవాచకం; ఈ సందర్భంలో ‘బలం’ సూటిగా, సహజంగా ఉంది.
- source_word: וּלְפָנָיו
  choice: దాని ముందర
  rationale: פָּנִיםతో ఏర్పడిన ఈ ప్రయోగం ‘ముందర/ఎదుట’ అని అర్థం. ‘దాని ముందర’ సంక్షిప్తంగా ఉండి మూలంలోని వ్యక్తీకరణను నిలుపుతుంది.
- source_word: תָּדוּץ
  choice: గంతులేస్తుంది
  rationale: అరుదైన דוץ క్రియ ఎగరడం, గంతులు వేయడం అనే చలనాన్ని సూచిస్తుంది. ‘గంతులేస్తుంది’ కవితాత్మక వ్యక్తీకరణను స్పష్టంగా అందిస్తుంది; ‘నాట్యం చేస్తుంది’ ఈ ప్రతికూల సందర్భంలో అనవసరమైన సంతోషభావాన్ని కలిగించవచ్చు.
- source_word: דְּאָבָה
  choice: దిగులు
  rationale: ఈ అరుదైన నామవాచకం దిగులు, నిరుత్సాహం, భీతి వంటి భావపరిధిని కలిగి ఉండవచ్చు. ‘దిగులు’ మూలంలోని అనిశ్చితిని అతిగా నిర్దిష్టం చేయకుండా భయంతో కుంగిపోయే భావాన్ని తెలియజేస్తుంది.
