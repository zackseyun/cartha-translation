  text: At his rising the mighty are afraid; at the crashing they are beside themselves.
translation:
  language: te
  text: అది పైకి లేచినప్పుడు శక్తిమంతులు భయపడతారు; అది విరుచుకుపడే సమయంలో వారు తికమకపడతారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִשֵּׂתוֹ
  choice: అది లేచినప్పుడు
  rationale: שֵׂת అనే అరుదైన రూపాన్ని సందర్భానుసారంగా ‘లేవడం/పైకి లేవడం’గా గ్రహించాం; లేవీయాతానును సూచించే తెలుగు సర్వనామాన్ని సహజంగా వాడాం.
- source_word: יָגוּרוּ
  choice: భయపడతారు
  rationale: ఇక్కడ גור క్రియకు సందర్భానుగుణమైన ‘భయపడు’ అనే అర్థం సరిపోతుంది.
- source_word: אֵלִים
  choice: బలవంతులు
  rationale: ఈ సందర్భంలో ‘దేవుళ్లు’ కంటే ‘బలవంతులు/శక్తిమంతులు’ అనే అర్థమే సహజం; మానవ పరాక్రమవంతులను సూచించే అవకాశాన్ని నిలుపుతుంది.
- source_word: מִשְּׁבָרִים
  choice: దాని విరుచుకుపడే శబ్దానికి
  rationale: שׁברים అనే బహువచనం ‘విరుగుళ్లు, పగుళ్లు, విరుచుకుపడే ఘోషలు’ వంటి భావాలను కలిగి ఉంది. సందర్భంలోని భయానక కదలిక లేదా ఘోషను సహజ తెలుగులో వ్యక్తం చేశాం; ‘దాని’ అనేది సందర్భం ద్వారా పూరించబడింది.
- source_word: יִתְחַטָּאוּ
  choice: తికమకపడతారు
  rationale: חטא యొక్క హిత్పయేల్ రూపం ఇక్కడ ‘తమను తాము తప్పించుకోవడం/దారి తప్పడం/స్థిమితం కోల్పోవడం’ అనే అరుదైన భావంలో ఉంది. ‘తికమకపడతారు’ మూలంలోని అస్థిరతను అతిగా నిర్దిష్టం చేయకుండా తెలియజేస్తుంది.
theological_decisions:
- issue: אֵלִים పదం దేవుళ్లను సూచిస్తుందా, బలవంతులను సూచిస్తుందా
  choice: బలవంతులు
  alternative: దేవుళ్లు
  rationale: యోబు 41లోని కవితాత్మక సందర్భం లేవీయాతాను ఎదుట అత్యంత పరాక్రమవంతులుకూడా భయపడతారని చెబుతోంది. కాబట్టి అనవసరమైన దేవతాశాస్త్ర నిర్ధారణను దిగుమతి చేయకుండా మానవ శక్తిమంతుల అర్థాన్ని ఎంచుకున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కవితాత్మక ధోరణి. అరుదైన హెబ్రీ పదాల అస్పష్టతను వీలైనంతవరకు కాపాడుతూ, సాధారణ పాఠకునికి అర్థమయ్యే వాక్యనిర్మాణం వాడబడింది.
