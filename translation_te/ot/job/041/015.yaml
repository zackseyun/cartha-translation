  source_fidelity: 'The Telugu accurately conveys the Hebrew imagery: the folds of the creature''s flesh adhere closely, are fixed upon it with cast-metal-like firmness, and cannot be moved. The plural presentation is consistent with the English audit trail and naturally resolves the compact Hebrew poetic syntax without adding meaning.'
