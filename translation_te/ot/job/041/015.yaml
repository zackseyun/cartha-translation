  edition: WLC
  text: מַפְּלֵ֣י בְשָׂר֣/וֹ דָבֵ֑קוּ יָצ֥וּק עָ֝לָ֗י/ו בַּל יִמּֽוֹט־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/041/015.yaml
  text: The folds of his flesh cling together[a]; they are cast firm upon him and cannot be moved.
translation:
  language: te
  text: అతని మాంసపు మడతలు ఒకదానికొకటి అంటుకొని ఉన్నాయి; అవి అతనిపై పోతపోసినట్లుగా[a] గట్టిగా స్థిరపడి ఉన్నాయి, కదలవు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతనిపై గట్టిగా బిగించబడి ఉన్నాయి.” హీబ్రూ పదం పోసిన లేదా పోతపోసిన పదార్థం గట్టిపడి స్థిరమైనట్లున్న చిత్రాన్ని ఉపయోగిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַפְּלֵי
  choice: మడతలు
  rationale: ఈ పదం వేలాడే లేదా మడతపడిన శరీర భాగాలను సూచిస్తుంది. సందర్భంలోని దృఢమైన శరీర నిర్మాణ చిత్రాన్ని సహజంగా తెలియజేయడానికి ‘మడతలు’ అనువైనది; ‘పొరలు’ లేదా ‘భాగాలు’ కంటే ఇది మూలంలోని స్పష్టమైన శారీరక చిత్రాన్ని మెరుగుగా నిలుపుతుంది.
- source_word: בְשָׂרוֹ
  choice: అతని మాంసపు
  rationale: בשר అనే పదానికి ప్రాథమిక అర్థం ‘మాంసం.’ ‘చర్మం’ లేదా ‘శరీరం’ అని వ్యాఖ్యానాత్మకంగా మార్చకుండా మూలపదాన్ని దగ్గరగా అనుసరిస్తుంది.
- source_word: דָבֵקוּ
  choice: ఒకదానికొకటి అంటుకొని ఉన్నాయి
  rationale: דבק గట్టిగా అతుక్కోవడం లేదా సన్నిహితంగా కలిసివుండడం అనే భావాన్ని ఇస్తుంది. బహువచన కర్త అయిన మడతల పరస్పర బిగుతును తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: יָצוּק
  choice: పోతపోసినట్లుగా గట్టిగా స్థిరపడి ఉన్నాయి
  rationale: ఈ రూపం పోసిన లేదా అచ్చుపోసిన పదార్థం గట్టిపడి స్థిరమైనట్లున్న దృశ్యాన్ని కలిగిస్తుంది. కేవలం ‘గట్టిగా ఉన్నాయి’ అని చదును చేయకుండా మూలంలోని పోతపోయు రూపకాన్ని నిలుపుతుంది.
- source_word: עָלָיו
  choice: అతనిపై
  rationale: ప్రత్యయంతో కూడిన ఉపసర్గకు నేరమైన, సహజమైన తెలుగు అనువాదం.
- source_word: בַּל יִמּוֹט
  choice: కదలవు
  rationale: కావ్యాత్మక నిషేధంతో ఉన్న מוט క్రియ కదలడం, తొలగడం లేదా తూలడం అనే భావాన్ని ఇస్తుంది. ‘కదలవు’ సంక్షిప్తంగా ఉండి వాటి అచంచలత్వాన్ని తెలియజేస్తుంది; ‘ఎప్పటికీ’ అని మూలంలో లేని కాలబలాన్ని జోడించదు.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, కావ్యానికి తగిన గౌరవప్రదమైన శైలిని పాటించాం. ‘పోతపోసినట్లుగా’ అనే రూపకం సాధారణ పాఠకునికి అర్థమయ్యేలా ఉండి హీబ్రూ చిత్రాన్ని కూడా నిలుపుతుంది.
