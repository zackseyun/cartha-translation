  terminology: “మాంసపు మడతలు” appropriately retains the concrete sense of בְשָׂרוֹ and מַפְּלֵי without interpretively substituting ‘hide.’ “పోతపోసినట్లుగా” suitably represents יָצוּק’s poured/cast-and-fixed imagery. The footnote provides a legitimate lexical alternative and explains the metaphor accurately.
