    text: 'హీబ్రూ అక్షరార్థం: ‘విల్లు కుమారుడు’; సందర్భంలో ఇది బాణాన్ని సూచిస్తుంది.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַבְרִיחֶנּוּ
  choice: దాన్ని పారిపోయేలా చేయదు
  rationale: ברח ధాతువు హిఫిల్ రూపంలో ‘ఎవరినైనా పారిపోయేలా చేయడం’ అనే కారణార్థాన్ని ఇస్తుంది. ఆయుధం లెవియాతానును బెదరించి తరిమివేయలేదనే భావాన్ని ఈ అనువాదం నేరుగా నిలుపుతుంది.
- source_word: בֶן קָשֶׁת
  choice: విల్లు నుంచి దూసుకొచ్చే బాణం
  rationale: అక్షరార్థంగా ‘విల్లు కుమారుడు.’ ఆయుధాల వరుసలోనూ, వెంటనే వచ్చే వడిసెల రాళ్ల సమాంతర ప్రయోగంలోనూ ఇది విల్లు నుంచి వచ్చే బాణాన్ని సూచిస్తుంది. సహజమైన తెలుగులో అర్థాన్ని స్పష్టం చేస్తూనే అక్షరార్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: לְקַשׁ
  choice: ఎండుగడ్డిలా
  rationale: קַשׁ పంట కోత తర్వాత మిగిలే ఎండిన కాడలు లేదా గడ్డిని సూచిస్తుంది. గట్టి వడిసెల రాళ్లు లెవియాతానుకు తేలికైన, పనికిరాని పదార్థంలా ఉండే చిత్రాన్ని ‘ఎండుగడ్డి’ సహజంగా తెలియజేస్తుంది.
- source_word: נֶהְפְּכוּ לוֹ
  choice: దానికి ... అవుతాయి
  rationale: 'הפך నిఫాల్ రూపం ఇక్కడ స్థితి మార్పును సూచిస్తుంది: వడిసెల రాళ్లు దాని విషయంలో ఎండుగడ్డిలా అయిపోతాయి. తెలుగు వాక్యనిర్మాణంలో ఈ సంబంధాన్ని సహజంగా వ్యక్తం చేస్తుంది.'
- source_word: אַבְנֵי קָלַע
  choice: వడిసెల రాళ్లు
  rationale: ఈ సమాసం వడిసెలతో విసిరే రాళ్లను సూచిస్తుంది. ‘వడిసెల రాళ్లు’ సంక్షిప్తమైన, స్పష్టమైన ఆధునిక తెలుగు ప్రయోగం.
