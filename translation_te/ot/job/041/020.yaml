translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరతను నిలిపే శైలి వాడబడింది. లెవియాతాను జంతువుగా వర్ణించబడుతున్నందున పుంలింగ వ్యక్తివాచక రూపానికి బదులు ‘దాన్ని/దానికి’ వాడాం. మూలంలోని ఆయుధాల సమాంతర చిత్రణను కాపాడాం.
