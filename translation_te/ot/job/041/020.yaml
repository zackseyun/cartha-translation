translation:
  language: te
  text: విల్లు బాణం[a] దాన్ని పారిపోయేలా చేయదు; వడిసెల రాళ్లు దానికి గడ్డిపరకల్లా అవుతాయి.
  philosophy: optimal-equivalence
  footnotes:
