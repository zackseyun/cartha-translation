translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కవితాత్మక వచనం. హీబ్రూ వాక్యంలోని మూడు అంశాలను ‘గురించి గానీ’ అనే సమాంతర నిర్మాణంతో నిలిపి, చివరలోని నిరాకరణ క్రియతో వాటిని అనుసంధానించాం. జంతువును సూచించడానికి తెలుగులో సహజమైన నపుంసక ఏకవచన సర్వనామం ‘దాని’ వాడాం.
