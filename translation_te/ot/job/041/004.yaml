  text: I will not keep silent about his limbs[a], or the account of his mighty strength and the grace of his proportions.
translation:
  language: te
  text: దాని అవయవాల గురించి గానీ, దాని మహాబలం గురించి గానీ, దాని నిర్మాణ సౌందర్యం గురించి గానీ నేను మౌనంగా ఉండను.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దాని భాగాల గురించి, దాని బలవైభవం గురించి, దాని అమరికలోని సొగసు గురించి నేను మౌనంగా ఉండను.”
    reason: మూలంలోని בַּדָּיו, גְּבוּרוֹת, חִין עֶרְכּוֹ పదబంధాలకు ‘అవయవాలు/భాగాలు,’ ‘మహాబలం/బలవైభవం,’ ‘నిర్మాణ సౌందర్యం/అమరికలోని సొగసు’ అనే సాధ్యమైన భావ ఛాయలు ఉన్నాయి.
lexical_decisions:
- source_word: אַחֲרִישׁ
  choice: నేను మౌనంగా ఉండను
  rationale: חרשׁ హిఫీల్ రూపం ఇక్కడ మాట్లాడకుండా ఉండడాన్ని సూచిస్తుంది. తెలుగు వాక్యం వక్త యొక్క ప్రథమ పురుష సంకల్పాన్ని సహజంగా నిలుపుతుంది.
- source_word: בַּדָּיו
  choice: దాని అవయవాలు
  rationale: בַּדִּים శరీర భాగాలు లేదా అవయవాలను సూచించగలదు. లివ్యాతాను శరీర వర్ణన సందర్భంలో ‘అవయవాలు’ స్పష్టమైన, సహజమైన ఎంపిక.
- source_word: דְבַר
  choice: గురించి
  rationale: తరువాతి పదబంధాన్ని మాటల విషయంగా పరిచయం చేసే ఈ నిర్మాణాన్ని తెలుగులో ‘గురించి’ సహజంగా వ్యక్తపరుస్తుంది; ‘వృత్తాంతం’ అని అనువదించడం మూలంలో లేని విస్తృత భావాన్ని కలిగించవచ్చు.
- source_word: גְּבוּרוֹת
  choice: మహాబలం
  rationale: ఈ బహువచన పదం శక్తులు, పరాక్రమ ప్రదర్శనలు లేదా గొప్ప బలాన్ని సూచించగలదు. జీవి యొక్క భౌతిక వర్ణనలో సమగ్ర భావాన్ని ‘మహాబలం’ సహజంగా అందిస్తుంది.
- source_word: חִין
  choice: సౌందర్యం
  rationale: חֵן అనుగ్రహం, ఆకర్షణ, మనోహరత్వం లేదా సౌందర్యాన్ని సూచిస్తుంది. ఇక్కడ శరీర నిర్మాణపు ఆకర్షణీయ వైభవమే ఉద్దేశం కాబట్టి ‘సౌందర్యం’ సరిపోతుంది.
- source_word: עֶרְכּוֹ
  choice: దాని నిర్మాణం
  rationale: ערך మూలం క్రమపరచడం లేదా అమరికను సూచిస్తుంది. శరీర సందర్భంలో ‘నిర్మాణం’ ఆ క్రమబద్ధమైన రూపాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
