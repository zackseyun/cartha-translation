  register: సాధారణ ఆధునిక తెలుగులోనూ కవితాత్మక గంభీరత నిలిచేలా రెండు సమాంతర పాదాలుగా అనువదించబడింది. జంతువును సూచించే సహజ తెలుగు సర్వనామంగా ‘అది’ వాడబడింది.
