translation:
  language: te
  text: 'అది అగాధ జలాలను వంటకుండలా మరగబెడుతుంది;

    సముద్రాన్ని సుగంధ లేపనంలా[a] చేస్తుంది.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘సుగంధ ద్రవ్యాల మిశ్రమంలా,’ లేదా ‘లేపనంలా.’ హీబ్రూ పదం కలిపి తయారుచేసిన ద్రవ్యాన్ని సూచిస్తుంది; అది తరచుగా లేపనం లేదా సుగంధ ద్రవ్యాలతో సంబంధం కలిగి ఉంటుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַרְתִּיחַ
  choice: మరగబెడుతుంది
  rationale: רתח ధాతువు హిఫీల్ రూపంలో ‘మరిగేలా చేయడం’ అనే కారణార్థాన్ని వ్యక్తం చేస్తుంది; ‘మరగబెడుతుంది’ సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: כַּסִּיר
  choice: కుండలా
  rationale: סִיר వంట చేయడానికి ఉపయోగించే కుండను సూచిస్తుంది. ‘కుండలా’ పోలికను స్పష్టంగా, సంక్షిప్తంగా నిలుపుతుంది.
- source_word: מְצוּלָה
  choice: అగాధ జలాలను
  rationale: ఈ పదం సముద్రపు లోతులను లేదా లోతైన జలాలను సూచిస్తుంది. తెలుగులో ‘అగాధ జలాలు’ కవితాత్మక భావాన్ని, తదుపరి పాదంలోని ‘సముద్రం’తో సమాంతరతను కాపాడుతుంది.
- source_word: יָם
  choice: సముద్రాన్ని
  rationale: יָם యొక్క సాధారణ, ప్రత్యక్ష అర్థం ‘సముద్రం’; మూలంలోని స్పష్టమైన జలచిత్రణను నిలుపుతుంది.
- source_word: יָשִׂים
  choice: చేస్తుంది
  rationale: שׂים సాధారణంగా ‘పెట్టు/నిలుపు’ అని అర్థమైనా, ఈ పోలిక నిర్మాణంలో ‘అలా చేస్తుంది’ అనే భావం సహజంగా సరిపోతుంది.
- source_word: כַּמֶּרְקָחָה
  choice: సుగంధ లేపన మిశ్రమంలా
  rationale: מֶרְקָחָה కలిపి తయారుచేసిన ద్రవ్యాన్ని, ముఖ్యంగా లేపనం లేదా సుగంధ ద్రవ్యాల మిశ్రమాన్ని సూచిస్తుంది. ఈ అనువాదం మిశ్రమం అనే మూలభావాన్ని నిలుపుతూ సందర్భానికి తగిన సుగంధ లేపన భావాన్ని తెలియజేస్తుంది.
