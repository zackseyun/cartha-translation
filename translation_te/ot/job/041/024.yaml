source:
  edition: WLC
  text: אַ֭חֲרָי/ו יָאִ֣יר נָתִ֑יב יַחְשֹׁ֖ב תְּה֣וֹם לְ/שֵׂיבָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/041/024.yaml
  text: Behind him a path shines[b][a]; one would think the deep to be gray-haired.
translation:
  language: te
  text: దాని వెనుక[a] ఒక బాట ప్రకాశిస్తుంది; అగాధం నెరిసిపోయిందని అనిపిస్తుంది.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దాని తరువాత.’ హీబ్రూ పదబంధం కాలపరంగా ‘దాని తరువాత’ అని, స్థలపరంగా ‘దాని వెనుక’ అని అర్థమివ్వగలదు. నీటిలో ఏర్పడే బాటను వర్ణిస్తున్న సందర్భం ‘దాని వెనుక’ అనే అర్థానికి అనుకూలంగా ఉంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘అగాధాన్ని నెరిసిన జుట్టుగా [భావిస్తారు].’ సముద్రం నురగతో తెల్లబడి, నెరిసినట్లుగా కనిపించడాన్ని ఈ రూపకం చిత్రిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרָיו
  choice: దాని వెనుక
  rationale: ఈ పదబంధం కాలపరంగా ‘దాని తరువాత’ లేదా స్థలపరంగా ‘దాని వెనుక’ అని అర్థమివ్వగలదు. సముద్రంలో లివ్యాతాను కదులుతూ వెనుక విడిచే బాటను వర్ణిస్తున్న సందర్భంలో స్థలపరమైన అర్థమే సహజంగా సరిపోతుంది.
- source_word: יָאִיר
  choice: ప్రకాశిస్తుంది
  rationale: హిఫీల్ రూపం ‘వెలుగు ఇస్తుంది’ లేదా ‘ప్రకాశిస్తుంది’ అని అర్థం. ఇక్కడ నీటిపై కనిపించే తెల్లని బాట ప్రకాశించడాన్ని సూచిస్తుంది.
- source_word: נָתִיב
  choice: ఒక బాట
  rationale: ఈ నామవాచకం బాటను లేదా జాడను సూచిస్తుంది. ఇక్కడ లివ్యాతాను నీటిలో కదిలినప్పుడు ఏర్పడే ప్రకాశవంతమైన చారకు రూపకాలంకారంగా వాడబడింది.
- source_word: יַחְשֹׁב
  choice: అనిపిస్తుంది
  rationale: రూపరీత్యా ఇది తృతీయ పురుష ఏకవచన క్రియ అయినా, ఇలాంటి సాధారణ పరిశీలనలో కర్తను నిర్దిష్టంగా చెప్పని భావాన్ని వ్యక్తం చేయగలదు. ‘అనిపిస్తుంది’ పరిశీలకునికి కలిగే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: תְּהוֹם
  choice: అగాధం
  rationale: ఈ పదం లోతైన జలాలను సూచిస్తుంది. ‘అగాధం’ దాని సంక్షిప్తమైన కావ్యబలాన్ని నిలుపుతుంది.
- source_word: לְשֵׂיבָה
  choice: నెరిసిపోయిందని
  rationale: שֵׂיבָה అనే నామవాచకం నెరిసిన జుట్టు, నెరుపు లేదా వృద్ధాప్యాన్ని సూచిస్తుంది. ఇక్కడ నురగతో తెల్లబడిన సముద్రాన్ని నెరిసినదానిగా చిత్రిస్తుంది; క్రియారూపంలో చేసిన ఈ తెలుగు వ్యక్తీకరణ ఆ దృశ్యరూపకాన్ని సహజంగా నిలుపుతుంది.
