translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గంభీరమైన కావ్యశైలిని కాపాడుతూ అనువదించబడింది. జీవిని సూచించడానికి తెలుగులో సహజమైన నపుంసక సర్వనామం ‘దాని’ వాడబడింది; హీబ్రూ వాక్యంలోని స్థల–కాల సందిగ్ధతను పాదసూచికలో నిలిపాం.
