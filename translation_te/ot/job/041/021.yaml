base_translation:
  language: en
  yaml_path: translation/ot/job/041/021.yaml
  text: A club is regarded as straw[b][a], and he laughs at the rattling of the javelin.
translation:
  language: te
  text: అతని దృష్టిలో గద[a] ఎండుగడ్డి[b] లాంటిదే; ఈటె చేసే ఖడఖడ శబ్దాన్ని అతడు చూసి నవ్వుతాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘గద’కు బదులు ‘బాణం/విసిరే ఆయుధం’ అని కూడా అనువదించవచ్చు; హీబ్రూ పదమైన תוֹתָח అరుదైనది, దాని ఖచ్చితమైన అర్థం అనిశ్చితం.
    reason: lexical_alternative
  - marker: b
    text: ‘ఎండుగడ్డి’కి బదులు ‘కొయ్యకాడి’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּקַשׁ
  choice: ఎండుగడ్డిలా
  rationale: קַשׁ అంటే ధాన్యం నుండి మిగిలే ఎండుగడ్డి లేదా పొట్టు. ఆయుధం తేలికైనదిగా, హాని చేయలేనిదిగా కనిపించే ఉపమానాన్ని ‘ఎండుగడ్డి’ సహజంగా తెలియజేస్తుంది.
- source_word: נֶחְשְׁבוּ
  choice: లెక్కించబడుతుంది
  rationale: חשׁב ధాతువు యొక్క నిష్క్రియ రూపాన్ని నిలుపుతూ, ‘అలా పరిగణించబడుతుంది’ అనే భావాన్ని సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: תוֹתָח
  choice: గద
  rationale: ఈ అరుదైన పదం ఖచ్చితంగా ఏ ఆయుధాన్ని సూచిస్తుందో అనిశ్చితం. యుద్ధాయుధాల సందర్భంలో ‘గద’ స్పష్టంగా అర్థమవుతుంది; ప్రత్యామ్నాయ అర్థాలు పాదసూచికలో ఇవ్వబడ్డాయి.
- source_word: וְיִשְׂחַק
  choice: అతడు నవ్వుతాడు
  rationale: ‘నవ్వు’ అనే మూలార్థాన్ని నిలుపుతూ, సందర్భంలో లివ్యాతానును సూచించే కర్తను తెలుగులో స్పష్టం చేస్తుంది.
- source_word: לְרַעַשׁ
  choice: గలగల శబ్దానికి
  rationale: רַעַשׁ లో శబ్దం, కదలిక, గలగల అనే భావాలు ఉన్నాయి. కదిలే ఆయుధం చేసే బెదిరించే శబ్దాన్ని ఈ పదబంధం సహజంగా తెలియజేస్తుంది.
- source_word: כִּידוֹן
  choice: ఈటె
  rationale: כִּידוֹן విసరగల బల్లెం లేదా జావెలిన్‌ను సూచిస్తుంది. ఆధునిక తెలుగులో ‘ఈటె’ సాధారణంగా, స్పష్టంగా అర్థమవుతుంది.
