    issue: Footnote b gives ‘పొట్టు’ as the alternative for כַּשׁ.
    rationale: ‘పొట్టు’ normally denotes husk/chaff, whereas the stated source alternative is ‘stubble.’ ‘కొయ్యకాడి’ is a closer Telugu rendering.
