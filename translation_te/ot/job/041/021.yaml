  terminology: ‘ఈటె’ is a suitable modern Telugu equivalent for כִּידוֹן. ‘గలగల శబ్దం’ is possible, but ‘ఖడఖడ శబ్దం’ more naturally evokes the clatter/rattle of weaponry. The rare weapon term is responsibly qualified in a footnote.
