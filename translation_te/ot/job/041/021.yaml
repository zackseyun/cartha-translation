translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కవితా వాక్యంగా రూపొందించబడింది. అరుదైన ఆయుధపదంలోని అనిశ్చితిని ప్రధాన పాఠంలో అతిగా నిర్దిష్టం చేయకుండా పాదసూచికలో భద్రపరచాం.
