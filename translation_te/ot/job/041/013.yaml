  yaml_path: translation/ot/job/041/013.yaml
  text: His breath kindles coals[a], and a flame comes out from his mouth.
translation:
  language: te
  text: అతని ఊపిరి మండే బొగ్గులను రగిలిస్తుంది[a]; అతని నోటి నుండి జ్వాల వెలువడుతుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అతని ప్రాణం’ లేదా ‘అతని గొంతు మండే బొగ్గులను రగిలిస్తుంది.’ హీబ్రూ నామవాచకం נֶפֶשׁకు ‘ప్రాణం,’ ‘జీవం,’ ‘గొంతు’ అనే అర్థాలు ఉండవచ్చు; ఈ సందర్భంలో విస్తృతార్థంగా ‘ఊపిరి’ని కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַפְשׁוֹ
  choice: అతని ఊపిరి
  rationale: נֶפֶשׁ సాధారణంగా ప్రాణం లేదా జీవం అని అర్థమిచ్చినా, శరీర సంబంధమైన కవితా సందర్భాల్లో గొంతు లేదా ఊపిరిని సూచించగలదు. సమాంతర పాదంలోని ‘అతని నోటినుండి’ అనే మాటతోను, అగ్నిమయమైన ఉచ్ఛ్వాస చిత్రణతోను ‘అతని ఊపిరి’ సహజంగా సరిపోతుంది; ఇతర సాధ్యార్థాలను పాదసూచికలో ఉంచాం.
- source_word: גֶּחָלִים
  choice: నిప్పుకణికలను
  rationale: ఈ బహువచన నామవాచకం అగ్నికణాలు లేదా మండే బొగ్గులను సూచిస్తుంది. ‘నిప్పుకణికలు’ ఆధునిక తెలుగులో చిత్రాన్ని స్పష్టంగా, సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: תְּלַהֵט
  choice: రగిలిస్తుంది
  rationale: להט పియేల్ రూపం మంటపుట్టించడం లేదా మండేలా చేయడం అనే కారక భావాన్ని ఇస్తుంది. ‘రగిలిస్తుంది’ ఆ కారకత్వాన్ని సహజ తెలుగులో నిలుపుతుంది.
- source_word: וְלַהַב
  choice: మంట
  rationale: לַהַב ఏకవచనంలో జ్వాల లేదా మంటను సూచిస్తుంది. ‘మంట’ సాధారణ పాఠకులకు సహజమైన పదం; ఏకవచన చిత్రణను నిలుపుతుంది.
- source_word: מִפִּיו
  choice: అతని నోటినుండి
  rationale: ఉపసర్గతో కూడిన నామవాచకానికి నేరమైన, సహజమైన తెలుగు అనువాదం.
- source_word: יֵצֵא
  choice: బయలుదేరుతుంది
  rationale: ఈ క్రియ బయటకు వెళ్లడం లేదా రావడం అని అర్థం. నోటినుండి మంట వెలువడే కవితా చిత్రణలో ‘బయలుదేరుతుంది’ గంభీరతతో కూడిన సహజ ప్రయోగం.
