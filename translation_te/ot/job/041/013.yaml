translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కవితా శైలిని అనుసరించాం. హీబ్రూ పాదాల సమాంతరత్వాన్ని నిలుపుతూ, נֶפֶשׁ పదంలోని నిజమైన అర్థసందిగ్ధతను పాదసూచికలో భద్రపరచాం.
