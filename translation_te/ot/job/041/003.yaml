source:
  edition: WLC
  text: מִ֣י הִ֭קְדִּימַ/נִי וַ/אֲשַׁלֵּ֑ם תַּ֖חַת כָּל הַ/שָּׁמַ֣יִם לִ/י הֽוּא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/041/003.yaml
  text: Who has first given to me[a], that I should repay him? Whatever is under all the heavens is mine.
translation:
  language: te
  text: నాకు ముందుగా ఇచ్చినవాడు ఎవడు, నేను అతనికి తిరిగి చెల్లించాలి?[a] ఆకాశాలన్నిటి కింద ఉన్నదంతా నాదే.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత రూపానుసారంగా: “నాకంటే ముందుగా వచ్చినవాడు ఎవడు, నేను అతనికి తిరిగి చెల్లించడానికి?” హీబ్రూ క్రియకు “ముందుగా రావడం” లేదా “ముందుగా చేయడం” అనే అర్థాలు ఉండవచ్చు; ఇక్కడ అది ముందుగా ఏదైనా ఇచ్చి, మరొకరిని తిరిగి చెల్లించాల్సిన బాధ్యతలో ఉంచడాన్ని సూచిస్తున్నట్లు కనిపిస్తుంది.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי
  choice: ఎవడు
  rationale: ఇది అలంకారిక ప్రశ్నను ప్రారంభించే ప్రశ్నార్థక సర్వనామం. ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన సందర్భానికి సహజంగా ఉండే సంక్షిప్త రూపాన్ని ఎంచుకున్నాం.
- source_word: הִקְדִּימַנִי
  choice: నాకు ముందుగా ఇచ్చి
  rationale: קדם హిఫీల్ రూపానికి ప్రాథమికంగా ‘ముందుగా రావడం/చేయడం’ అనే భావం ఉన్నా, తరువాతి ‘తిరిగి చెల్లించడం’తో కలిపి ఇక్కడ ముందుగా ఏదైనా ఇచ్చి దేవుణ్ణి ఋణబద్ధుణ్ణి చేయడమనే సందర్భార్థం వస్తుంది. ఈ భావాన్ని ప్రధాన పాఠంలో సహజంగా తెలిపి, మరింత రూపానుసారమైన అర్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: וַאֲשַׁלֵּם
  choice: నేను తిరిగి చెల్లించాల్సిన స్థితిలో నన్ను ఉంచినవాడు
  rationale: ఈ అలంకారిక ప్రశ్నలో క్రియ ముందరి చర్య ఫలితాన్ని సూచిస్తుంది. కేవలం ‘నేను తిరిగి చెల్లిస్తాను’ అంటే వాగ్దానంలా వినిపించే అవకాశం ఉంది; ఎవరూ దేవుణ్ణి బాకీ తీర్చాల్సినవాడిగా చేయలేరనే వాక్యబలాన్ని ఈ రూపం స్పష్టం చేస్తుంది.
- source_word: תַּחַת כָּל הַשָּׁמַיִם
  choice: ఆకాశాలన్నిటి కింద
  rationale: హీబ్రూ బహువచనమైన ‘ఆకాశాలు’ను నిలుపుతూ, సృష్టిలోని సమస్తాన్ని సూచించే సహజమైన తెలుగు వ్యక్తీకరణను వాడాం.
- source_word: לִי הוּא
  choice: నాదే
  rationale: ‘నాకే అది’ అనే హీబ్రూ ఉద్ఘాటనను తెలుగు ప్రత్యయం ‘-ఏ’తో సంక్షిప్తంగా నిలిపాం. సందర్భంలో సూచితమైన సమస్తత్వాన్ని ‘ఉన్నదంతా’ వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: దేవుణ్ణి ఋణబద్ధుణ్ణి చేయగలగడం మరియు సమస్తంపై ఆయన యాజమాన్యం
  choice: ఎవరూ ముందుగా దేవునికి ఏదైనా ఇచ్చి, ఆయనను తిరిగి చెల్లించాల్సిన స్థితిలో ఉంచలేరనే అలంకారిక నిరాకరణగా అనువదించాం; తరువాతి వాక్యం సమస్తమూ ఆయనదేనని ప్రకటిస్తుంది.
  alternative: మొదటి భాగాన్ని ‘నాకంటే ముందుగా వచ్చినవాడు ఎవడు? నేను అతనికి తిరిగి చెల్లిస్తాను’ అని మరింత రూపానుసారంగా ఇవ్వవచ్చు.
  rationale: ‘ముందుగా చేయడం’ మరియు ‘తిరిగి చెల్లించడం’ మధ్య ఉన్న సంబంధం కేవలం కాలక్రమాన్ని కాక, ప్రతిఫలం కోరగల ముందస్తు ఉపకారాన్ని సూచిస్తుంది. అయినా మూల క్రియలోని ‘ముందుగా రావడం/చేయడం’ అనే నిజమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో భద్రపరిచాం; వాక్యం చెప్పేదానికంటే విస్తృతమైన సిద్ధాంత సూత్రీకరణను చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన శైలిని అనుసరించాం. ‘నాదే’ అనే ఉద్ఘాటన మూలంలోని బలాన్ని నిలుపుతుంది. ప్రధాన పాఠం సందర్భార్థాన్ని స్పష్టం చేస్తుండగా, పాదసూచిక మూల క్రియలోని పదార్థపరమైన సందిగ్ధతను కాపాడుతుంది.
