  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: לֹֽא אַ֭כְזָר כִּ֣י יְעוּרֶ֑/נּוּ וּ/מִ֥י ה֝֗וּא לְ/פָנַ֥/י יִתְיַצָּֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/041/002.yaml
  text: No one is so fierce that he dares to stir him up[a]. Who then is he who can stand before me?
translation:
  language: te
  text: దానిని లేపడానికి తెగించేంత క్రూరుడు ఎవరూ లేరు.[a] అలాంటప్పుడు నా ఎదుట నిలబడగలవాడు ఎవడు?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దానిని మేల్కొలిపేంత నిర్దయుడు ఎవరూ లేరు.” హీబ్రూ క్రియకు “మేల్కొలుపు,” “లేపు” అనే అర్థాలున్నాయి; ఇక్కడ లివ్యాతానును రెచ్చగొట్టే భావంలో వాడబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא אַכְזָר
  choice: క్రూరుడు ఎవరూ లేరు
  rationale: లֹא అనే నిషేధాన్ని אַכְזָר అనే విశేషణంతో కలిపి, తెలుగులో సహజమైన వ్యక్తి-సూచక వాక్యంగా అందిస్తుంది. ‘క్రూరుడు’ అనే పదం కాఠిన్యం, నిర్దయ, ఉగ్రత్వం అనే మూలపద విస్తృతిని కాపాడుతుంది.
- source_word: כִּי יְעוּרֶנּוּ
  choice: దానిని లేపడానికి తెగించేంత
  rationale: עור అంటే మేల్కొలపడం లేదా లేపడం. ఈ సందర్భంలో లివ్యాతానును కదిలించి రెచ్చగొట్టే భావం ఉంది; ‘తెగించేంత’ అనేది హీబ్రూ వాక్యంలోని ధైర్యసాహస ఫలితభావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וּמִי הוּא
  choice: అలాంటప్పుడు ... ఎవడు?
  rationale: వావ్‌తో కూడిన ప్రశ్న ముందటి వాక్యం నుంచి నిగమనాన్ని ముందుకు తీసుకెళ్తుంది. ‘అలాంటప్పుడు’ ఆ తార్కిక సంబంధాన్ని తెలుగులో స్పష్టం చేస్తుంది; הוּא యొక్క వ్యక్తి-ఉద్ఘాటనను ‘ఎవడు’ నిలుపుతుంది.
- source_word: לְפָנַי
  choice: నా ఎదుట
  rationale: అక్షరార్థంగా ‘నా ముఖం/సన్నిధి ముందు.’ ‘నా ఎదుట’ సన్నిధిలో నిలవడం లేదా ప్రతిఘటిస్తూ నిలవడం అనే స్థలరూపకాన్ని సంక్షిప్తంగా కాపాడుతుంది.
- source_word: יִתְיַצָּב
  choice: నిలబడగలవాడు
  rationale: హిత్పయేల్ రూపం తనను తాను నిలబెట్టుకోవడం లేదా స్థానం తీసుకోవడం అని సూచిస్తుంది. ఈ అలంకారిక ప్రశ్నలో సామర్థ్యాన్ని సూచించే ‘నిలబడగలవాడు’ సహజంగా సరిపోతుంది.
theological_decisions:
- issue: మొదటి భాగంలోని లివ్యాతాను నుంచి రెండవ భాగంలోని దేవునికి సూచన మారుతుందా?
  choice: రెండవ భాగంలోని ‘నా ఎదుట’ దేవుని సూచిస్తుంది; లివ్యాతానును లేపడానికి ఎవరూ తెగించకపోతే, దేవుని ఎదుట మరెవరు నిలబడగలరనే అధికతర్కం వ్యక్తమవుతుంది.
  alternative: రెండు భాగాలూ లివ్యాతానునే సూచిస్తాయని చదవడం.
  rationale: לְפָנַי లోని ప్రథమ పురుష ఏకవచన ప్రత్యయం ‘నా’ అనేది దేవుని ప్రత్యక్ష ప్రసంగాన్ని స్పష్టంగా సూచిస్తుంది. పరిసర దైవప్రసంగానికీ సృష్టి నుంచి సృష్టికర్త వైపు సాగే తర్కానికీ ఇది సరిపోతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనా సులభంగా అర్థమయ్యే శైలి. లివ్యాతాను పేరు ఈ వచనంలో ప్రత్యక్షంగా లేకపోవడంతో నపుంసక సూచన ‘దానిని’ వాడబడింది. ‘క్రూరుడు’ మూలంలోని నైతిక కాఠిన్య భావాన్ని ఉంచుతుండగా, సందర్భంలోని ఉగ్రసాహస భావం ‘తెగించేంత’ ద్వారా వ్యక్తమవుతుంది.
