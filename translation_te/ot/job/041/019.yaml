revisions:
- from: 'ఇనుమును గడ్డిపరకలాగా,

    కంచును కుళ్లిన చెక్కలాగా అది ఎంచుతుంది.[a]'
  to: 'అది ఇనుమును గడ్డిలాగా,

    కంచును కుళ్లిన చెక్కలాగా పరిగణిస్తుంది.[a]'
  rationale: The revision replaces the semantically inaccurate “chooses” with “regards/considers,” while retaining the source’s parallel comparisons, the contextual subject, and the bronze/copper alternative note.
