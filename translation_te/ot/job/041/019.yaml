base_translation:
  language: en
  yaml_path: translation/ot/job/041/019.yaml
  text: He regards iron as straw[a], and bronze as rotten wood.
translation:
  language: te
  text: 'అది ఇనుమును గడ్డిలాగా,

    కంచును కుళ్లిన చెక్కలాగా పరిగణిస్తుంది.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘కంచు’ స్థానంలో ‘రాగి’ (נְחוּשָׁה).
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחְשֹׁב
  choice: ఎంచుతుంది
  rationale: חשׁב ఇక్కడ ఒక వస్తువును ఏ విధంగా పరిగణిస్తుందో, విలువ కడుతుందో సూచిస్తుంది. ‘ఎంచుతుంది’ అనే ప్రయోగం ఆ అంచనా భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: לְתֶבֶן
  choice: గడ్డిపరకలాగా
  rationale: תבן సాధారణంగా గడ్డి లేదా పశుగ్రాసానికి మిగిలే ఎండుగడ్డిని సూచిస్తుంది. ఇనుమును అల్పమైనదిగా చూసే ఉపమానాన్ని ‘గడ్డిపరకలాగా’ స్పష్టంగా అందిస్తుంది.
- source_word: בַּרְזֶל
  choice: ఇనుము
  rationale: ఈ లోహానికి ప్రామాణికమైన తెలుగు పదం.
- source_word: לְעֵץ רִקָּבוֹן
  choice: కుళ్లిన చెక్కలాగా
  rationale: అక్షరార్థంగా ‘కుళ్లు/క్షయం కలిగిన చెక్క’ అనే భావం. ‘కుళ్లిన చెక్క’ దాని బలహీనతను సహజంగా, స్పష్టంగా చిత్రిస్తుంది.
- source_word: נְחוּשָׁה
  choice: కంచు
  rationale: נְחוּשָׁה రాగి లేదా కంచును సూచించవచ్చు. బలమైన లోహాలైన ఇనుము, కంచు మధ్య సమాంతరత ఉన్న ఈ సందర్భంలో ‘కంచు’ సముచితమైన ప్రధాన పాఠం; ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, కవితాత్మక సమాంతర నిర్మాణాన్ని నిలుపుతూ సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే గౌరవప్రదమైన శైలి. పాదసూచిక గుర్తు ప్రధాన పాఠంలో చేర్చబడింది.
