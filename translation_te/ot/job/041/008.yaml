  yaml_path: translation/ot/job/041/008.yaml
  text: They press close[a], one to another, and no air can come between them.
translation:
  language: te
  text: అవి ఒకదానికొకటి గట్టిగా ఆనుకుని ఉంటాయి; వాటి మధ్యకు గాలి[a] కూడా రాదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వాటి మధ్య గాలి వీయదు.” ఇక్కడి హెబ్రీ పదం “వాయువు,” “గాలి,” లేదా “శ్వాస” అని అర్థం కావచ్చు; ఈ సందర్భంలో భౌతికమైన గాలి ఉద్దేశించబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶחָד ... בְּאֶחָד
  choice: ఒకదానికొకటి
  rationale: ఈ పునరుక్త నిర్మాణం ప్రతి పొలుసు దాని పక్కనున్న పొలుసుతో సన్నిహితంగా ఉండడాన్ని సూచిస్తుంది. ‘ఒకదానికొకటి’ తెలుగులో ఈ పరస్పర సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: יִגַּשׁוּ
  choice: గట్టిగా ఆనుకుని ఉంటాయి
  rationale: נגשׁ ప్రాథమికంగా దగ్గరకు రావడాన్ని సూచించినా, ఇక్కడ లివ్యాతాను పొలుసులు ఖాళీ లేకుండా దగ్గరగా అమరి ఉండడమే సందర్భార్థం. ‘గట్టిగా ఆనుకుని ఉంటాయి’ సంపర్కాన్ని సహజంగా వ్యక్తం చేస్తుంది; అవి అతికించబడ్డాయని అనవసరంగా సూచించదు.
- source_word: וְרוּחַ
  choice: గాలి
  rationale: רוּחַ అనే పదానికి గాలి, వాయువు, శ్వాస అనే అర్థాలు ఉండవచ్చు. ఇక్కడ పొలుసుల మధ్య ఖాళీ లేకపోవడాన్ని తెలిపే భౌతిక అర్థంలో ‘గాలి’ సహజమైన తెలుగు పదం; పదంలోని భావవ్యాప్తిని పాదసూచికలో నిలిపాం.
- source_word: לֹא יָבֹא
  choice: కూడా రాదు
  rationale: నిషేధార్థక అసంపూర్ణ క్రియ ఇక్కడ వాటి మధ్య గాలి ప్రవేశించదనే వాస్తవాన్ని తెలియజేస్తుంది. ‘కూడా’ అత్యల్పమైన గాలికీ చోటు లేదనే సందర్భబలాన్ని తెలుగులో సహజంగా అందిస్తుంది.
- source_word: בֵינֵיהֶם
  choice: వాటి మధ్యకు
  rationale: בין యొక్క స్థలార్థాన్ని, అలాగే గాలి ఆ మధ్యనున్న చోటులోకి ప్రవేశించడాన్ని, ‘వాటి మధ్యకు’ స్పష్టంగా తెలియజేస్తుంది.
