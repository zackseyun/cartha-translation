source:
  edition: WLC
  text: מַשִּׂיגֵ֣/הוּ חֶ֭רֶב בְּלִ֣י תָק֑וּם חֲנִ֖ית מַסָּ֣ע וְ/שִׁרְיָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/041/018.yaml
  text: The sword that reaches him cannot stand[a]; nor can spear, dart[b], or javelin.
translation:
  language: te
  text: అతనిని చేరే ఖడ్గం నిలవదు[a]; ఈటె, బాణం[b], బల్లెం కూడా నిలవవు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతనిని వెంబడించి అందుకునే ఖడ్గం జయించదు.” హీబ్రూ వ్యక్తీకరణ అక్షరార్థంగా ఖడ్గం “నిలవదు” అని చెబుతుంది.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ “బాణం,” “బల్లెం” అని అనువదించిన హీబ్రూ పదాలు అరుదైనవి; వాటి అర్థం అనిశ్చితం. మొదటి పదానికి “విసిరే ఆయుధం” లేదా “కాడ,” రెండవ పదానికి “గొలుసు కవచం” లేదా “కవచం” అనే అర్థాలు కూడా సాధ్యమే.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַשִּׂיגֵהוּ
  choice: అతనిని చేరే
  rationale: נשׂג/השיג అనే క్రియకు ‘చేరు, అందుకొను, వెంబడించి పట్టుకొను’ అనే అర్థాలున్నాయి. ఖడ్గం అతని వరకు చేరడాన్ని సహజంగా తెలిపేందుకు ‘అతనిని చేరే’ అని అనువదించాం; తగిలి గాయపరుస్తుందనే అదనపు భావాన్ని చేర్చలేదు.
- source_word: חֶרֶב
  choice: ఖడ్గం
  rationale: ఇది సాధారణంగా ఖడ్గాన్ని సూచించే పదం. కావ్యోచితమైన, అయినా ఆధునిక పాఠకులకు స్పష్టమైన ‘ఖడ్గం’ ఎంచుకున్నాం.
- source_word: בְּלִי תָקוּם
  choice: నిలువలేదు
  rationale: בלי + קום అక్షరార్థంగా ‘నిలువదు’ అనే బింబాన్ని ఇస్తుంది; సందర్భంలో అది అతనిపై ప్రభావం చూపలేకపోవడాన్ని సూచిస్తుంది. మూలంలోని సజీవ బింబాన్ని కాపాడేందుకు ‘నిలువలేదు’ అని ఉంచాం.
- source_word: חֲנִית
  choice: ఈటె
  rationale: పొడిచే ఆయుధాన్ని సూచించే సాధారణ పదం; ఆధునిక తెలుగులో సులభంగా అర్థమయ్యే సమానార్థకం.
- source_word: מַסָּע
  choice: బాణం
  rationale: ఈ అరుదైన పదం అర్థం అనిశ్చితం; సందర్భంలో విసిరే లేదా ప్రయోగించే ఆయుధాన్ని సూచించే అవకాశం ఉంది. సాధారణ పాఠకునికి సహజమైన ‘బాణం’ ఎంచుకుని, అనిశ్చితిని పాదసూచికలో తెలిపాం.
- source_word: וְשִׁרְיָה
  choice: బల్లెం
  rationale: ఆయుధాల వరుసలో ఇది మొనగల విసిరే ఆయుధాన్ని సూచిస్తుందని గ్రహించి ‘బల్లెం’ ఎంచుకున్నాం. ‘కవచం’ అనే ప్రత్యామ్నాయ అర్థం కూడా సాధ్యమైనందున పాదసూచికలో నిలిపాం.
