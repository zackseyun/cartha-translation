translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కావ్యశైలిని వాడాం. మొదటి క్రియలోని ఏకవచనాన్ని ‘నిలువలేదు’గా ఉంచి, తరువాతి ఆయుధాల జాబితాకు తెలుగులో సహజంగా ‘నిలువవు’ను పూరించాం. అరుదైన ఆయుధపదాల అనిశ్చితిని ప్రధాన వాక్యంలో భారంగా చేయకుండా పాదసూచికలో స్పష్టంగా కాపాడాం.
