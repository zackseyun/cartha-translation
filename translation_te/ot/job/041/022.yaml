  yaml_path: translation/ot/job/041/022.yaml
  text: Under him are sharp shards of pottery[b][a]; he spreads himself like a threshing sledge over the mud.
translation:
  language: te
  text: 'అతని కింద పదునైన మట్టిపాత్రల పెంకులు[a] ఉన్నాయి;

    అతడు బురదపై నూర్పిడి పలకవలె పరచుకుంటాడు.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కుండపెంకులు.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, ఈ పాదాన్ని ప్రత్యక్ష కర్మ నిర్మాణంగా తీసుకుని, “అతడు బురదను నూర్పిడి పలకలా చేస్తాడు” అని అనువదించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: תַּחְתָּיו
  choice: అతని కింద
  rationale: లివ్యాతాను శరీరానికి దిగువన ఉన్నదాన్ని సూచించే స్థానార్థాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: חַדּוּדֵי
  choice: పదునైన
  rationale: పదును లేదా మొన అనే భావమున్న బహువచన నిర్మాణాన్ని, తరువాతి నామవాచకాన్ని విశేషించే సహజ తెలుగు రూపంలో అందిస్తుంది.
- source_word: חָרֶשׂ
  choice: మట్టిపాత్రల పెంకులు
  rationale: ఇక్కడ మట్టి పాత్రల విరిగిన, పదునైన ముక్కల దృశ్యం ఉద్దేశించబడింది; ఈ పదబంధం సాధారణ పాఠకులకు స్పష్టంగా ఉంటుంది.
- source_word: יִרְפַּד
  choice: తనను పరచుకుంటాడు
  rationale: పరచడం లేదా పాన్పులా చేసుకోవడం అనే క్రియాభావాన్ని, లివ్యాతాను బురదపై పడే దృశ్యంలో ప్రతిబింబకంగా సహజంగా వ్యక్తం చేస్తుంది.
- source_word: חָרוּץ
  choice: నూర్పిడి బల్ల
  rationale: పదునైన అంచులు గల ధాన్య నూర్పిడి పరికరాన్ని సూచిస్తుంది; వ్యవసాయ దృశ్యాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: עֲלֵי
  choice: మీద
  rationale: బురదపై లేదా దానిమీద ఉన్న స్థాన సంబంధాన్ని సహజంగా తెలుపుతుంది.
- source_word: טִיט
  choice: బురద
  rationale: తడి మట్టి లేదా బురద అనే స్పష్టమైన భౌతిక దృశ్యాన్ని ఇస్తుంది.
