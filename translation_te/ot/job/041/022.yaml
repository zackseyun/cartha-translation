translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, కావ్యాత్మక దృశ్యాన్ని నిలుపుతూ సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన శైలి వాడబడింది. అరుదైన వ్యవసాయ పరికరానికి ‘నూర్పిడి బల్ల’ అనే స్పష్టమైన పదబంధం ఎంచుకోబడింది; మూలంలోని వాక్యనిర్మాణ సందిగ్ధత పాదటిప్పణిలో నిలుపబడింది.
