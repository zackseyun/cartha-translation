source:
  edition: WLC
  text: הֲ֭/זֹאת חָשַׁ֣בְתָּ לְ/מִשְׁפָּ֑ט אָ֝מַ֗רְתָּ צִדְקִ֥/י מֵ/אֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/job/035/002.yaml
  text: 'Do you think this is just: you say[a], ‘My righteousness is greater than God’s’?'
translation:
  language: te
  text: నీవు, ‘నా నీతి దేవుని నీతికంటే గొప్పది[a]’ అని చెప్పడం న్యాయమని అనుకుంటున్నావా?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నా నీతి దేవుని ఎదుట ఉంది,” లేదా, “నా నీతి దేవుని నుండి వచ్చింది.” హీబ్రూ వాక్యం సంక్షిప్తంగా ఉంది; ‘నా నీతి’కి ‘దేవుని’తో ఉన్న సంబంధం గురించి భిన్నాభిప్రాయాలు ఉన్నాయి.
    reason: alternative_reading
lexical_decisions:
- source_word: הֲזֹאת חָשַׁבְתָּ
  choice: నీవు ఇలా ... భావిస్తున్నావా
  rationale: ప్రశ్నార్థక הֲ, సూచనార్థక זֹאת, ‘తలంచు/ఎంచు’ అనే חָשַׁבְתָּ కలసి అలంకారిక ప్రశ్నను ఏర్పరుస్తాయి; ఆధునిక తెలుగులో ఈ రూపం సహజంగా ఉంటుంది.
- source_word: לְמִשְׁפָּט
  choice: న్యాయమని
  rationale: מִשְׁפָּט ఇక్కడ ‘న్యాయం/సరి అయినది’ అనే మూల్యాంకన భావాన్ని ఇస్తుంది; ‘న్యాయమని’ న్యాయపరమైన ఛాయను నిలుపుతుంది.
- source_word: אָמַרְתָּ
  choice: ఇలా అనడం
  rationale: హీబ్రూ పరిపూర్ణ క్రియను ఎలీహూ యోబు మాటను ఉటంకిస్తున్న సందర్భంలో తెలుగులో సహజమైన ఉక్తి పరిచయంగా అనువదించాం.
- source_word: צִדְקִי
  choice: నా నీతి
  rationale: צדק మూలానికి చెందిన ఈ నామవాచకం నీతి, న్యాయబద్ధత, నిర్దోష స్థితి అనే నైతిక-న్యాయ భావాలను కలిగి ఉంది; ‘నా నీతి’ ఆ విస్తృతిని సాధ్యమైనంతగా నిలుపుతుంది.
- source_word: מֵאֵל
  choice: దేవుని నీతికంటే గొప్పది
  rationale: מִן‌ను ఇక్కడ తులనార్థకంగా గ్రహించాం. తెలుగులో పోలిక స్పష్టంగా ఉండేందుకు సందర్భం సూచించే ‘నీతి’ని దేవునితో జోడించి చెప్పాం; ఇతర సాధ్యార్థాలను పాదసూచికలో ఉంచాం.
theological_decisions:
- issue: ఎలీహూ ఆపాదిస్తున్న యోబు వాదంలోని צִדְקִי מֵאֵל సంబంధం
  choice: 'తులనార్థకం: ‘నా నీతి దేవుని నీతికంటే గొప్పది’'
  alternative: ‘దేవుని ఎదుట నేను నీతిమంతుణ్ణి’ లేదా ‘నా న్యాయం దేవుని నుండి వచ్చింది’
  rationale: మూల హీబ్రూ అత్యంత సంక్షిప్తంగా ఉండి מִן సంబంధం వివాదాస్పదంగా ఉంది. తక్షణ సందర్భంలో ఎలీహూ చేస్తున్న అభియోగానికి తులనార్థకం చక్కగా సరిపోతుంది; అయినా వేదాంతపరంగా ప్రాముఖ్యమైన ఇతర పఠనాలను తొలగించకుండా పాదసూచికలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలిని ఉపయోగించాం. ప్రధాన పఠనంలో నైతిక-న్యాయ పదసంబంధాన్ని నిలుపుతూ, మూలంలోని నిజమైన సందిగ్ధతను పాదసూచికలో తెలిపాం.
