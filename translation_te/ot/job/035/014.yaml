source:
  edition: WLC
  text: אַ֣ף כִּֽי תֹ֭אמַר לֹ֣א תְשׁוּרֶ֑/נּוּ דִּ֥ין לְ֝/פָנָ֗י/ו וּ/תְח֥וֹלֵֽל לֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/035/014.yaml
  text: How much less when you say[a], ‘You do not see him’; the case is before him, and you must wait for him.
translation:
  language: te
  text: నీవు, “నేను ఆయనను చూడలేకపోతున్నాను” అని చెప్పినప్పుడు అయితే ఆయన ఇంకెంత తక్కువగా వింటాడు! అయినా నీ కేసు ఆయన ఎదుట ఉంది; ఆయన కోసం నిరీక్షించు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, మరింత అక్షరార్థంగా, “ఆయన ఎదుట విలవిలలాడు.” ఇక్కడి హీబ్రూ క్రియ అర్థం క్లిష్టమైనది; చాలామంది దీన్ని “ఆయన కోసం ఆశతో నిరీక్షించు” అని అర్థం చేసుకుంటారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף כִּי
  choice: అప్పుడు మరెంతగా!
  rationale: మునుపటి వాక్యంతో కొనసాగుతున్న అధికతర్క భావాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది. ఈ పదబంధాన్ని కేవలం ‘అయినప్పటికీ’ అనే concessive భావంగా కాక, ‘మరెంతగా’ అనే బలపరిచే భావంగా తీసుకున్నాం.
- source_word: תֹאמַר
  choice: నీవు ... అని చెప్పినప్పుడు
  rationale: ఎలీహు యోబును ఏకవచనంలో నేరుగా సంబోధిస్తున్న సాధారణ పలుకు క్రియను సహజ తెలుగులో నిలుపుతుంది.
- source_word: לֹא תְשׁוּרֶנּוּ
  choice: నేను ఆయనను చూడలేకపోతున్నాను
  rationale: שׁור అనే క్రియలోని చూడటం/గ్రహించడం అనే భావాన్ని, దేవుడు కనిపించడం లేదనే యోబు ఫిర్యాదుగా వ్యక్తం చేస్తుంది; దేవుడు వ్యాజ్యాన్ని చూడడంలేదనే భావాన్ని దిగుమతి చేయదు.
- source_word: דִּין
  choice: నీ వ్యాజ్యం
  rationale: ఇక్కడ న్యాయం అనే అమూర్త భావం కంటే తీర్పు కోసం ఉంచిన న్యాయపరమైన వాదం లేదా కేసు ఉద్దేశించబడింది. సందర్భానుసారంగా రెండవ పురుష సంబంధాన్ని తెలుగులో స్పష్టం చేశాం.
- source_word: לְפָנָיו
  choice: ఆయన ఎదుటే
  rationale: వ్యాజ్యం దేవుని సమక్షంలో తీర్పు కోసం ఉందనే న్యాయస్థాన రూపకాన్ని సహజంగా నిలుపుతుంది; ‘ఏ’ బలప్రయోగం ఆ విషయం ఇంకా ఆయన ఎదుట ఉందనే సందర్భోచిత భావాన్ని ఇస్తుంది.
- source_word: וּתְחוֹלֵל לוֹ
  choice: ఆయన కోసం నిరీక్షించు
  rationale: అరుదైన, క్లిష్టమైన חול రూపాన్ని సందర్భానికి అనుగుణంగా ఆశతో వేచియుండమనే ప్రబోధంగా తీసుకున్నాం. క్రియ యొక్క మరింత అక్షరార్థమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలిపాం.
theological_decisions:
- issue: దేవుడు కనిపించకపోవడం, న్యాయం చేయడం గురించి ఎలీహు ఇచ్చిన ప్రబోధం
  choice: యోబు దేవుణ్ణి ప్రస్తుతం చూడలేకపోయినా, అతని వ్యాజ్యం దేవుని ఎదుటే ఉంది; అతడు దేవుని కోసం నిరీక్షించాలి.
  alternative: దేవుడు వ్యాజ్యాన్ని చూడడం లేదని ఎలీహు అంటున్నాడు; లేదా చివరి భాగం ‘ఆయన ఎదుట విలవిలలాడు’ అని అర్థం.
  rationale: విస్తృత సందర్భం దేవుని అవగాహనను, న్యాయాన్ని ఊహిస్తుంది. అందువల్ల ‘చూడలేకపోతున్నాను’ అనేది యోబు దేవుణ్ణి గ్రహించలేకపోవడాన్ని సూచిస్తుంది. అయితే చివరి హీబ్రూ క్రియకు ఉన్న నిజమైన పదార్థ సందిగ్ధతను పాదసూచికలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలిని వాడాం. న్యాయస్థాన సందర్భాన్ని నిలుపుతూ ‘వ్యాజ్యం’, నిరీక్షణ భావానికి ‘నిరీక్షించు’ ఎంచుకున్నాం; అరుదైన హీబ్రూ క్రియలోని సందిగ్ధతను పాదసూచికలో స్పష్టంగా ఉంచాం.
