  to: నీవు, “నేను ఆయనను చూడలేకపోతున్నాను” అని చెప్పినప్పుడు అయితే ఆయన ఇంకెంత తక్కువగా వింటాడు! అయినా నీ కేసు ఆయన ఎదుట ఉంది; ఆయన కోసం నిరీక్షించు.[a]
  rationale: The revision corrects the crucial ‘how much less’ force, supplies the contextually implied verb ‘listen’ so that the Telugu is complete, and uses the readily understood legal term “కేసు.” The final clause and its footnote continue to preserve the lexical ambiguity of the Hebrew verb.
