id: JOB.35.7
reference: Job 35:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אִם צָ֭דַקְתָּ מַה תִּתֶּן ל֑/וֹ א֥וֹ מַה מִ/יָּדְ/ךָ֥ יִקָּֽח־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/035/007.yaml
  text: If you are righteous[b][a], what do you give to him? Or what does he take from your hand?
translation:
  language: te
  text: నీవు నీతిమంతుడవైతే, ఆయనకు[a] ఏమి ఇస్తావు? లేదా నీ చేతినుండి ఆయన ఏమి తీసుకుంటాడు[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'అంటే, దేవునికి. సందర్భంలో ఎలీహు చెప్పే భావం: మానవుని నీతి దేవునికి ఏ లాభాన్నీ చేకూర్చదు.'
    reason: cross_reference
  - marker: b
    text: లేదా, ‘పొందుతాడు?’
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: అయితే
  rationale: షరతును సూచించే אִם భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేయడానికి ‘-అయితే’ వాడబడింది.
- source_word: צָדַקְתָּ
  choice: నీవు నీతిమంతుడవైతే
  rationale: צדק ఇక్కడ నైతికంగా నీతిమంతుడై ఉండడాన్ని లేదా న్యాయస్థితిలో ఉండడాన్ని సూచిస్తుంది. సందర్భానికి తగిన గంభీరతతో ‘నీతిమంతుడు’ ఆ భావాన్ని అందిస్తుంది.
- source_word: מַה תִּתֶּן לוֹ
  choice: ఆయనకు ఏమి ఇస్తావు?
  rationale: హెబ్రీ ప్రశ్నలోని ప్రత్యక్షతను నిలుపుతూ, అసంపూర్ణ క్రియ యొక్క సాధారణ/వాక్చాతుర్య ప్రశ్నార్థక బలాన్ని సహజమైన తెలుగు భవిష్యద్రూపంతో వ్యక్తం చేసింది.
- source_word: אוֹ
  choice: లేదా
  rationale: సమాంతరంగా ఉన్న రెండవ ప్రశ్నను మొదటిదానితో కలిపే సాధారణ వికల్ప సంధి.
- source_word: מִיָּדְךָ
  choice: నీ చేతినుండి
  rationale: మూలంలోని ‘నీ చేతి నుండి’ అనే స్పష్టమైన రూపకాన్ని నిలిపింది; ఇది ఒకరి వద్దనుండి లేదా వారి ద్వారా ఏదైనా పొందడాన్ని సూచిస్తుంది.
- source_word: יִקָּח
  choice: తీసుకుంటాడు
  rationale: לקח యొక్క ప్రాథమిక భావమైన ‘తీసుకొను’ను నిలిపింది. సందర్భంలో ‘పొందుతాడు’ అనే భావం కూడా సాధ్యమైనందున దాన్ని పాదటిప్పణిలో ఇచ్చింది.
theological_decisions:
- issue: לוֹ / יִקָּח లోని తృతీయ పురుష ఏకవచన సర్వనామం ఎవరిని సూచిస్తుంది?
  choice: ప్రధాన పాఠ్యంలో దేవుడు అనే నామాన్ని చేర్చకుండా ‘ఆయనకు/ఆయన’ అని అనువదించబడింది; సందర్భంలో అది దేవుణ్ణి సూచిస్తుంది.
  alternative: పేర్కొనబడని ఒక వ్యక్తిని సూచించవచ్చు; లేదా స్పష్టత కోసం ప్రధాన పాఠ్యంలోనే ‘దేవునికి/దేవుడు’ అని పెట్టవచ్చు.
  rationale: యోబు 35:6–8లో ఎలీహు వాదన మానవుని పాపం లేదా నీతి దేవునికి నష్టం గాని లాభం గాని కలిగించదన్నది. అయినప్పటికీ హెబ్రీ పాఠ్యంలో దేవుని నామం కాక సర్వనామమే ఉన్నందున, ప్రధాన పాఠ్యం దానిని సర్వనామంగానే ఉంచి వివరణను పాదటిప్పణికి పరిమితం చేసింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ప్రశ్నారూపం వాడబడింది. మూలంలోని ‘నీ చేతినుండి’ అనే దృశ్యరూపం నిలుపబడింది. దేవుణ్ణి సూచించే సర్వనామానికి గౌరవార్థక ‘ఆయన’ వాడినా, మూలంలో లేని ‘దేవుడు’ అనే నామాన్ని ప్రధాన పాఠ్యంలో చేర్చలేదు.
