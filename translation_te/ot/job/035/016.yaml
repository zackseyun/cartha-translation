  yaml_path: translation/ot/job/035/016.yaml
  text: So Job opens his mouth in vain[a]; without knowledge he multiplies words.
translation:
  language: te
  text: కాబట్టి యోబు వ్యర్థంగా[a] నోరు తెరుస్తున్నాడు; జ్ఞానం లేకుండా ఎక్కువ మాటలు మాట్లాడుతున్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “శూన్యతతో.” హీబ్రూ పదం הֶבֶל ఆవిరి, శూన్యత, వ్యర్థత లేదా ఫలహీనతను సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶבֶל
  choice: వ్యర్థంగా
  rationale: ఈ సందర్భంలో הֶבֶל ఆవిరి, శూన్యత, వ్యర్థత అనే భావపరిధిని కలిగి, యోబు మాట్లాడడం ఫలహీనమని క్రియావిశేషణార్థంగా సూచిస్తుంది. ‘వ్యర్థంగా’ సహజమైన ఆధునిక తెలుగు; మూలంలోని భావవిస్తృతిని పాదసూచికలో ఉంచాం.
- source_word: יִפְצֶה פִּיהוּ
  choice: నోరు తెరుస్తున్నాడు
  rationale: פצה פה అనేది మాట్లాడడం మొదలుపెట్టడాన్ని సూచించే ‘నోరు తెరవడం’ అనే జాతీయ ప్రయోగం. తెలుగులోనూ ఇదే ప్రయోగం సహజంగా అర్థమవుతుంది.
- source_word: בִּבְלִי דַעַת
  choice: జ్ఞానం లేకుండా
  rationale: בִּבְלִי లేమిని, דַעַת జ్ఞానాన్ని సూచిస్తాయి. ఈ నేర అనువాదం ఎలీహూ చేస్తున్న ఆరోపణను స్పష్టంగా నిలుపుతుంది.
- source_word: מִלִּין
  choice: మాటలు
  rationale: అరామీయ ప్రభావంగల ఈ బహువచన రూపానికి ‘మాటలు’ సరళమైన, సహజమైన తెలుగు సమానార్థకం.
- source_word: יַכְבִּר
  choice: పెంచుతున్నాడు
  rationale: כבר యొక్క హిఫీల్ రూపం సమృద్ధిగా చేయడం లేదా అధికం చేయడం అనే భావాన్ని ఇస్తుంది. ‘మాటలు పెంచుతున్నాడు’ మూలంలోని రూపకాన్ని నిలుపుతూ తెలుగులో అర్థవంతంగా ఉంటుంది.
- source_word: וְאִיּוֹב
  choice: కాబట్టి యోబు
  rationale: వావ్ ఇక్కడ ముందు చెప్పిన నిర్ణయానికి అనుసంధానంగా ఉంది. సందర్భంలోని నిగమన భావాన్ని ‘కాబట్టి’ సహజంగా వ్యక్తం చేస్తుంది.
