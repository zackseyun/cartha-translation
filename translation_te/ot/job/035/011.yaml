  text: who teaches us more than the beasts of the earth and makes us wiser than the birds of the heavens[a].
translation:
  language: te
  text: 'భూమిమీది జంతువులకంటే మనకు ఎక్కువగా బోధించేవాడు,

    ఆకాశంలోని పక్షులకంటే మనలను జ్ఞానవంతులుగా చేసేవాడు[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “భూమిమీది జంతువులనుండి మనకు బోధించేవాడు, ఆకాశంలోని పక్షులనుండి మనలను జ్ఞానవంతులుగా చేసేవాడు.” హెబ్రీ ఉపసర్గ తులనకు బదులుగా మూలాన్ని లేదా ఆధారాన్ని కూడా సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: מַ֭לְּפֵנוּ
  choice: మనకు ఎక్కువగా బోధించేవాడు
  rationale: למד పియేల్ రూపం క్రియాశీలంగా బోధించడం అనే భావాన్ని ఇస్తుంది. తులనార్థక מִן‌తో కలిసి ఉన్నందున, తెలుగులో సహజంగా తులనను వెల్లడించడానికి ‘ఎక్కువగా’ చేర్చబడింది.
- source_word: מִבַּהֲמוֹת אָרֶץ
  choice: భూమి జంతువులకంటే
  rationale: ఈ కవితా సమాంతర నిర్మాణంలో מִן‌ను ప్రధానంగా తులనార్థకంగా తీసుకున్నాం. ‘భూమి జంతువులు’ మూలంలోని concrete imageryను సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: וּמֵעוֹף הַשָּׁמַיִם
  choice: ఆకాశ పక్షులకంటే
  rationale: మొదటి పాదానికి సమాంతరంగా מֵ తులనార్థకంగా అనువదించబడింది. ‘ఆకాశ పక్షులు’ עוֹף הַשָּׁמַיִם‌కు సహజమైన, గౌరవప్రదమైన తెలుగు రూపం.
- source_word: יְחַכְּמֵנוּ
  choice: మనలను జ్ఞానవంతులుగా చేసేవాడు
  rationale: חכם పియేల్ రూపంలోని causative భావాన్ని ‘జ్ఞానవంతులుగా చేసేవాడు’ స్పష్టంగా వ్యక్తం చేస్తుంది. తులన ‘పక్షులకంటే’ అనే పదబంధంలో ఇప్పటికే వెల్లడవుతుంది.
theological_decisions:
- issue: రెండు పాదాల్లోని מִן / מֵ ఉపసర్గల భావం
  choice: 'తులనార్థకం: భూమి జంతువులకంటే మనుషులకు ఎక్కువగా బోధించి, ఆకాశ పక్షులకంటే వారిని జ్ఞానవంతులుగా చేసేవాడు'
  alternative: 'మూలం/ఆధారం: భూమి జంతువులనుండి మనకు బోధించి, ఆకాశ పక్షులనుండి మనలను జ్ఞానవంతులుగా చేసేవాడు'
  rationale: కవితా సమాంతరత మరియు సందర్భం తులనార్థక భావానికే ఎక్కువ మద్దతిస్తాయి. అయితే హెబ్రీ ఉపసర్గ మూలం లేదా ఆధారం అనే భావాన్నీ అనుమతించేందున ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కవితా వాక్యనిర్మాణం వాడబడింది. హెబ్రీలో కర్త ఈ వాక్యంలో ప్రత్యక్ష నామవాచకంగా లేకపోవడంతో ‘దేవుడు’ అని చేర్చకుండా ‘చేసేవాడు’ అనే సంబంధార్థక రూపంతో అస్పష్టతను నిలిపాం.
