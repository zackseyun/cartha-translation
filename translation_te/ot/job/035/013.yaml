id: JOB.35.13
reference: Job 35:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אַךְ שָׁ֭וְא לֹא יִשְׁמַ֥ע אֵ֑ל וְ֝/שַׁדַּ֗י לֹ֣א יְשׁוּרֶֽ/נָּה־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/035/013.yaml
  text: Surely God does not hear emptiness[a], and the Almighty does not regard it.
translation:
  language: te
  text: 'నిశ్చయంగా దేవుడు వ్యర్థమైనదాన్ని[a] వినడు;

    సర్వశక్తిమంతుడు దానిని గమనించడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘శూన్యమైనదాన్ని,’ ‘అసత్యాన్ని,’ లేదా ‘పనికిరానిదాన్ని.’ హీబ్రూ పదం ఖాళీగా, నిష్ఫలంగా లేదా మోసపూరితంగా ఉన్నదాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: నిశ్చయంగా
  rationale: ఇక్కడ ఈ పదం ఎలీహూ మాటకు నొక్కి చెప్పే బలాన్ని ఇస్తుంది; ‘నిశ్చయంగా’ ఆధునిక తెలుగులో ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: שָׁוְא
  choice: వ్యర్థతను
  rationale: ఈ పదానికి శూన్యత, నిష్ఫలత, మోసం అనే భావపరిధి ఉంది. ‘వ్యర్థత’ దాని నైరూప్య రూపాన్ని నిలుపుతూ, దానిని ప్రత్యేకంగా ‘అసత్యం’గా గానీ ‘వ్యర్థమైన మొర’గా గానీ సంకుచితం చేయదు.
- source_word: יִשְׁמַע
  choice: వినడు
  rationale: సందర్భంలో అసంపూర్ణ క్రియ సాధారణ సత్యాన్ని వ్యక్తపరుస్తుంది. ‘వినడు’ మూలక్రియను నేరుగా, సహజంగా అందిస్తుంది.
- source_word: אֵל
  choice: దేవుడు
  rationale: ఈ సాధారణ దైవ బిరుదుకు ‘దేవుడు’ సహజమైన ప్రామాణిక తెలుగు సమానం.
- source_word: וְשַׁדַּי
  choice: సర్వశక్తిమంతుడు
  rationale: షద్దయ్ అనే దైవ బిరుదును లిప్యంతరీకరించకుండా దాని స్థిరమైన అర్థాన్ని తెలుగులో అందిస్తుంది.
- source_word: יְשׁוּרֶנָּה
  choice: దానిని లక్ష్యపెట్టడు
  rationale: שׁוּר అంటే చూడడం, గమనించడం, పరిగణించడం. ‘లక్ష్యపెట్టడు’ దృష్టితో చూడడమే కాక శ్రద్ధగా పరిగణించే భావాన్ని కూడా తెలియజేసి, ‘వినడు’తో ఉన్న సమాంతరతను నిలుపుతుంది.
theological_decisions:
- issue: ఎలీహూ వాక్యంలో שָׁוְא దేనిని సూచిస్తుంది?
  choice: మూలంలోని నైరూప్య భావాన్ని ‘వ్యర్థత’గా ఉంచడం
  alternative: దానిని ‘వ్యర్థమైన మొర,’ ‘అసత్యం,’ లేదా ‘గర్వపు మాటలు’ అని స్పష్టీకరించడం
  rationale: వాక్యం దేవుని సర్వజ్ఞతను నిరాకరించడం కంటే ఆయన వినని దాని స్వభావాన్ని చెబుతుంది. అయితే హీబ్రూ పదం దానిని ప్రత్యేకంగా ప్రార్థన లేదా మొరగా పేర్కొనదు; అందువల్ల ఆ అస్పష్టతను అనువాదంలో నిలుపుతున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలి ఉపయోగించబడింది. హీబ్రూ కవితా సమాంతరతను రెండు పాదాలుగా నిలిపాం; మూలంలో లేని ‘మొర’ లేదా ‘ప్రార్థన’ను ప్రధాన పాఠ్యంలో చేర్చలేదు.
