lexical_decisions:
- source_word: הַבֵּט ... וּרְאֵה
  choice: చూసి చూడు
  rationale: మొదటి రెండు ఆజ్ఞారూప క్రియలైన ‘దృష్టి పెట్టు’ మరియు ‘చూడు’ అనే భావాలను సహజమైన ఆధునిక తెలుగులో సంక్షిప్తంగా నిలుపుతుంది.
- source_word: וְשׁוּר
  choice: తేరి చూడు
  rationale: సాధారణంగా చూడటం కంటే శ్రద్ధగా, నిలకడగా దృష్టి పెట్టడాన్ని సూచించే ఈ క్రియను ‘తేరి చూడు’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: שְׁחָקִים
  choice: మేఘాలు
  rationale: ఈ సందర్భంలో ఆకాశంలోని ఎత్తైన మేఘాలను సూచిస్తుంది; ‘మేఘాలు’ సాధారణ పాఠకులకు స్పష్టమైన, సందర్భోచిత పదం.
- source_word: גָּבְהוּ מִמֶּךָּ
  choice: అవి నీకంటే ఎత్తుగా ఉన్నాయి
  rationale: పోలికను మరియు బహువచన క్రియ భావాన్ని నేరుగా నిలుపుతుంది.
