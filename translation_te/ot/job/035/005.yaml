review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the two imperatives, the elevated heavenly objects, and the comparison “higher than you.” However, “చూసి చూడు” is not a natural way to represent the distinct Hebrew imperatives הַבֵּט and וּרְאֵה; it can sound merely repetitive or sequentially redundant.
  naturalness: “ఆకాశాలవైపు చూసి చూడు” is awkward in modern standard Telugu. “ఆకాశాలను చూడు, గమనించు” naturally retains the deliberate double call to look. “తేరి చూడు” is intelligible but somewhat colloquial; “నిశితంగా చూడు” gives the attentive force of שׁוּר in a more standard register.
  terminology: “మేఘాలు” is an acceptable contextual rendering of שְׁחָקִים and agrees with the English POB audit trail. No theological terminology or names occur, and no footnotes are required.
  issues:
  - severity: medium
    issue: Redundant/unnatural rendering of the first paired imperatives
    rationale: “చూసి చూడు” does not idiomatically distinguish “look” and “see” in Telugu and may imply “having looked, see.” Rendering the second verb as “గమనించు” preserves the source’s rhetorical reinforcement.
  - severity: low
    issue: Register of “తేరి చూడు”
    rationale: The expression can work, but “నిశితంగా చూడు” more clearly and naturally expresses the sustained, attentive observation denoted by שׁוּר in modern standard Telugu.
  revised_text: ఆకాశాలను చూడు, గమనించు; మేఘాలను నిశితంగా చూడు—అవి నీకంటే ఎత్తుగా ఉన్నాయి.
  revised_footnotes: []
  revision_rationale: The revision removes an unnatural repetition while retaining the Hebrew’s paired opening imperatives and the intensified second command. It preserves the poetic parallelism, direct singular address, and the comparison that the clouds are higher than the hearer. “మేఘాలు” is retained in accordance with the contextual sense and the English POB audit trail.
