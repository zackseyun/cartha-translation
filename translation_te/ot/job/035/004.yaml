translation:
  language: te
  text: నేను నీకు మాటలతో జవాబు ఇస్తాను[a]; నీతో పాటు నీ స్నేహితులకూ జవాబు ఇస్తాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నేను నీకూ, నీతో పాటు నీ స్నేహితులకూ జవాబు ఇస్తాను.” హీబ్రూ క్రియకు ‘ప్రత్యుత్తరం ఇవ్వడం’ అనే భావం ఉంది; ఈ పాదాన్ని ఏలీహు యోబునూ, అతనితో పాటు అతని స్నేహితులనూ సంబోధిస్తున్నట్లు అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲנִי
  choice: నేను
  rationale: హీబ్రూలో కర్త సర్వనామం స్పష్టంగా ఉండి ఉద్ఘాటనను ఇస్తుంది; అందువల్ల తెలుగులోనూ దాన్ని నిలిపాం.
- source_word: אֲשִׁיבְךָ
  choice: నీకు ... జవాబిస్తాను
  rationale: שוב క్రియ యొక్క హిఫీల్ రూపం ఈ సందర్భంలో ‘జవాబివ్వడం/ప్రత్యుత్తరం చెప్పడం’ అనే భావాన్ని ఇస్తుంది. ఆధునిక ప్రామాణిక తెలుగులో ‘జవాబిస్తాను’ సహజంగా ఉంది.
- source_word: מִלִּין
  choice: మాటలతో
  rationale: ఈ బహువచన పదానికి ‘మాటలు/వాక్కులు’ అనే అర్థం ఉంది; క్రియకు సాధనార్థకంగా అనుసంధానమైన రూపాన్ని నిలుపుతూ ‘మాటలతో’ అని అనువదించాం.
- source_word: וְאֶת רֵעֶיךָ
  choice: నీ స్నేహితులకు కూడా
  rationale: את రెండవ కర్మను పరిచయం చేస్తుంది; తెలుగు వాక్య నిర్మాణంలో క్రియను పునరుక్తం చేసి ‘కూడా’ వాడటం సమన్వయాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది. רֵעַను సందర్భానుసారంగా ‘స్నేహితులు’గా అనువదించాం.
- source_word: עִמָּךְ
  choice: నీతో ఉన్న
  rationale: עם సహవాసాన్ని సూచిస్తుంది. యోబుతో కలిసి ఉన్న అతని స్నేహితులనే సూచించేలా ‘నీతో ఉన్న’ అని నేరుగా అనువదించాం.
