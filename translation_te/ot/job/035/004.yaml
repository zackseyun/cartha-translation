  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడబడింది. ‘మాటలతో’ అనే స్పష్టమైన పదబంధం మూలంలోని מִלִּין‌ను నిలుపుతుంది; రెండవ కర్మకు క్రియను పునరుక్తం చేయడం తెలుగులో అస్పష్టతను తగ్గిస్తుంది.
