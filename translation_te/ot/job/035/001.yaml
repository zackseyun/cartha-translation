  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. హీబ్రూ వాక్యసూత్రంలోని భావాన్ని నిలుపుతూ, అసహజమైన ‘జవాబిచ్చి చెప్పాడు’ అనే పదశః నిర్మాణాన్ని నివారించాం.
