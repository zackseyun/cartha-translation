source:
  edition: WLC
  text: אִם חָ֭טָאתָ מַה תִּפְעָל בּ֑/וֹ וְ/רַבּ֥וּ פְ֝שָׁעֶ֗י/ךָ מַה תַּעֲשֶׂה לּֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/035/006.yaml
  text: If you sin[a], what do you accomplish against him? And if your transgressions are many, what do you do to him?
translation:
  language: te
  text: 'నీవు పాపం చేస్తే, ఆయనకు వ్యతిరేకంగా ఏమి సాధిస్తావు?[a]

    నీ అతిక్రమాలు అనేకమైతే, ఆయనకు ఏమి చేస్తావు?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, మొదటి పాదాన్ని కూడా ‘ఆయనకు ఏమి చేస్తావు?’ అని అనువదించవచ్చు. ఇక్కడి హీబ్రూ క్రియ ‘చేయు’ లేదా ‘ఫలితం కలిగించు’ అని అర్థమివ్వగలదు; ‘ఆయనకు వ్యతిరేకంగా ఏమి సాధిస్తావు?’ అనే అనువాదం అలంకారిక ప్రశ్న భావాన్ని స్పష్టం చేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם חָטָאתָ
  choice: నీవు పాపం చేస్తే
  rationale: אִם షరతును సూచిస్తుంది; חָטָאתָ రూపం పూర్తయిన క్రియ అయినప్పటికీ, ఈ అలంకారిక షరతులో సాధారణ పరిస్థితిని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరచడానికి ‘పాపం చేస్తే’ అని అనువదించాం.
- source_word: מַה תִּפְעָל בּוֹ
  choice: ఆయనకు వ్యతిరేకంగా ఏమి సాధిస్తావు?
  rationale: פעל చేయడం లేదా ఫలితాన్ని కలిగించడం అనే భావాలను కలిగి ఉంది; בּוֹ ఇక్కడ దేవునికి సంబంధించి లేదా ఆయనకు వ్యతిరేకంగా అనే భావాన్ని ఇవ్వగలదు. మానవ పాపం దేవుణ్ణి నష్టపరచగలదా అనే అలంకారిక ప్రశ్నను ఈ పదప్రయోగం వ్యక్తం చేస్తుంది; అయినా దానిని ‘హాని’ అని మరీ స్పష్టీకరించలేదు.
- source_word: וְרַבּוּ פְשָׁעֶיךָ
  choice: నీ అతిక్రమాలు విస్తరిస్తే
  rationale: רבב రూపం అనేకం కావడం లేదా పెరగడం అనే భావాన్ని ఇస్తుంది. మొదటి పాదంలోని షరతు రెండవ పాదంలో అంతర్లీనంగా కొనసాగుతుంది; ‘విస్తరిస్తే’ ఆ సమాంతరతను తెలుగులో సహజంగా చూపిస్తుంది.
- source_word: פְשָׁעֶיךָ
  choice: నీ అతిక్రమాలు
  rationale: פשע ఉద్దేశపూర్వక అతిక్రమం లేదా తిరుగుబాటు భావాన్ని కలిగి ఉంది. ‘అతిక్రమాలు’ నైతిక తీవ్రతను నిలుపుతూ సాధారణ తెలుగు పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన పదం.
- source_word: מַה תַּעֲשֶׂה לּוֹ
  choice: ఆయనకు ఏమి చేస్తావు?
  rationale: עשה సాధారణంగా ‘చేయు’; לּוֹ ఎవరికో చేయబడేదాన్ని సూచిస్తుంది. ‘చేయగలవు’ అని సామర్థ్య భావాన్ని చేర్చకుండా మూలంలోని సరళమైన అలంకారిక ప్రశ్నను నిలిపాం.
theological_decisions:
- issue: మానవ పాపం దేవునికి అసలు ఏ విధంగానూ సంబంధం లేదని చెప్పాలా, లేక అది దేవుణ్ణి నష్టపరచదు లేదా తగ్గించదు అనే పరిమిత భావాన్ని తెలియజేయాలా?
  choice: మానవ పాపం దేవునికి వ్యతిరేకంగా ఏమి సాధించగలదని ప్రశ్నించేలా అనువదించడం
  alternative: ‘ఆయనకు ఏ హాని చేస్తావు?’ అని స్పష్టంగా అనువదించడం; లేదా రెండు పాదాల్లోనూ ‘ఆయనకు ఏమి చేస్తావు?’ అని తటస్థంగా ఉంచడం
  rationale: ఈ అలంకారిక ప్రశ్నలు దేవుని అతీతత్వం, స్వతంత్రతను నొక్కిచెబుతాయి; పాపం దేవుని ఎదుట నైతికంగా ప్రాముఖ్యం లేనిదని చెప్పవు. ‘వ్యతిరేకంగా ఏమి సాధిస్తావు’ అనే పదబంధం בּוֹ యొక్క సాధ్యమైన ప్రతికూల దిశను తెలియజేస్తూనే ‘హాని’ అనే వివరణను నేరుగా మూలంలోకి చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే కవితాత్మక సమాంతరత మరియు గౌరవప్రదమైన దైవసంబంధ సంబోధనను నిలిపాం. ‘నీవు/నీ’ ఏకవచనాన్ని హీబ్రూ 2ms రూపాలకు అనుగుణంగా వాడాం.
