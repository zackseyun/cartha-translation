revisions:
- from: 'ఎందుకంటే నీవు ఇలా అంటున్నావు[a]: “దానివల్ల నీకు ఏ ప్రయోజనం? నా పాపం వల్ల నాకు ఏ లాభం?”'
  to: 'ఎందుకంటే నీవు ఇలా అంటున్నావు[a]: “నీకు ఏ ప్రయోజనం? నా పాపం వల్ల నాకు ఏ లాభం?”'
  rationale: The revision removes an added demonstrative so that the first question preserves the Hebrew’s elliptical referent. It retains the main-text source reading of מִן (‘వల్ల’) while presenting the plausible comparative understanding in an idiomatic footnote. No doctrinal interpretation is imposed.
