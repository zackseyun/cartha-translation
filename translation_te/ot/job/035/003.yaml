  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּֽי תֹ֭אמַר מַה יִּסְכָּן לָ֑/ךְ מָֽה אֹ֝עִ֗יל מֵֽ/חַטָּאתִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/035/003.yaml
  text: For you say[a], ‘What advantage is it to you? What profit do I have from my sin?’
translation:
  language: te
  text: 'ఎందుకంటే నీవు ఇలా అంటున్నావు[a]: “నీకు ఏ ప్రయోజనం? నా పాపం వల్ల నాకు ఏ లాభం?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీకు ఏ ప్రయోజనం? నేను పాపం చేసిన దానికంటే నాకు అదనంగా ఏ లాభం?” హీబ్రూ వాక్యం సంక్షిప్తంగా ఉంది; నీతిగా ఉండడానికీ పాపం చేయడానికీ మధ్య పోలికను అది సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ఎలీహు యోబు మాటలను ఎందుకు ప్రశ్నిస్తున్నాడో వివరిస్తూ ఉద్ధరణను ప్రవేశపెడుతుంది.
- source_word: תֹאמַר
  choice: నీవు ఇలా అంటున్నావు
  rationale: కాల్ అసంపూర్ణ క్రియ, ద్వితీయ పురుష ఏకవచనం; సందర్భంలో కొనసాగుతున్న వాదనను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: מַה יִּסְכָּן לָךְ
  choice: దానివల్ల నీకు ఏ ప్రయోజనం?
  rationale: סכן ప్రయోజనకరంగా ఉండడాన్ని సూచిస్తుంది. హీబ్రూలోని స్త్రీలింగ ‘నీకు’ మునుపటి వాక్యంలోని ‘నీ నీతి’ని సూచించే అవకాశం ఉన్నందున, ‘దానివల్ల’ ఆ సంక్షిప్త సంబంధాన్ని అతిగా నిర్దిష్టం చేయకుండా తెలుపుతుంది.
- source_word: מָה אֹעִיל
  choice: నాకు ఏ లాభం?
  rationale: יעל హిఫిల్ రూపం ‘లాభపడు/ప్రయోజనం పొందు’ అనే భావం ఇస్తుంది; ప్రథమ పురుష ఏకవచనాన్ని సహజంగా ఉంచుతుంది.
- source_word: מֵחַטָּאתִי
  choice: నా పాపం వల్ల
  rationale: מן మూలం లేదా పోలికను సూచించగలదు. ప్రధాన పాఠ్యంలో మూలార్థాన్ని నిలిపి, సాధ్యమైన పోలిక భావాన్ని పాదటిప్పణిలో ఇస్తుంది.
theological_decisions:
- issue: ఎలీహు ఉటంకిస్తున్న మాటల భావబలం
  choice: నీతి వల్ల కలిగే వ్యక్తిగత ప్రయోజనం ఏమిటని, పాపంతో సంబంధించి యోబు అడిగినట్లుగా ఎలీహు అతని మాటలను పునర్వ్యాఖ్యానిస్తున్నాడు.
  alternative: దేవునికి యోబు నీతి వల్ల ఏ ప్రయోజనం కలుగుతుందని యోబు అడిగాడు; లేదా తాను పాపం చేసిన దానికంటే ఎక్కువగా ఏ లాభం పొందానని అడిగాడు.
  rationale: హీబ్రూ వాక్యం సంక్షిప్తంగా, అధ్యాహారంగా ఉంది. ప్రధాన అనువాదం వ్యక్తిగత లాభం అనే ఉద్రిక్తతను ఉంచుతూ, పోలికను గానీ దేవునికి కలిగే ప్రయోజనాన్ని గానీ ఖచ్చితంగా నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ప్రశ్నారూపం వాడబడింది. ‘ప్రయోజనం/లాభం’ అనే సమాంతర పదాలు మూలంలోని రెండు లాభసూచక క్రియల భేదాన్ని నిలుపుతాయి; [a] సూచిక ప్రధాన పాఠ్యంలో చేర్చబడింది.
