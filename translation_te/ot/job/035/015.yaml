source:
  edition: WLC
  text: וְ/עַתָּ֗ה כִּי אַ֭יִן פָּקַ֣ד אַפּ֑/וֹ וְ/לֹֽא יָדַ֖ע בַּ/פַּ֣שׁ מְאֹֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/035/015.yaml
  text: And now[a], because his anger has not punished, and he does not greatly heed transgression[b],
translation:
  language: te
  text: ఇప్పుడు, ఆయన కోపం ఇంకా శిక్షించలేదు[a] గనుక, అతిక్రమాన్ని[b] ఆయన ఎంతగానో పరిగణించలేదు,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆయన తన కోపంలో సందర్శించలేదు.’ ఇక్కడి హీబ్రూ క్రియకు ‘సందర్శించు,’ ‘శ్రద్ధ చూపు,’ లేదా ‘శిక్షించు’ అనే అర్థాలు రావచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘అతిక్రమం’ అని అనువదించిన హీబ్రూ పదం అర్థం అనిశ్చితం; అది ‘తిరుగుబాటు,’ ‘ధిక్కారం,’ లేదా ‘గొప్ప అపరాధం’ అనే భావాలను కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: ఇప్పుడు
  rationale: కాలసూచకమైన సంధిని సహజమైన ఆధునిక తెలుగులో చూపిస్తుంది; వాక్యంలోని అనుసంధానం విరామచిహ్నం ద్వారా స్పష్టమవుతుంది.
- source_word: כִּי
  choice: గనుక
  rationale: ఈ సందర్భంలో కారణార్థాన్ని తెలియజేస్తుంది; ‘ఎందుకంటే’ కంటే కొనసాగుతున్న వాక్య నిర్మాణానికి ‘గనుక’ సహజంగా సరిపోతుంది.
- source_word: אַיִן פָּקַד אַפּוֹ
  choice: ఆయన కోపం శిక్షించలేదు
  rationale: פקד అనే క్రియలోని ‘విచారించు/పర్యవేక్షించు/శిక్షించు’ అర్థపరిధిలో, కోపానికి సంబంధించిన న్యాయపరమైన భావాన్ని ‘శిక్షించలేదు’ స్పష్టంగా తెలియజేస్తుంది; అయితే ప్రత్యామ్నాయ భావాన్ని పాదసూచికలో ఉంచాం.
- source_word: וְלֹא יָדַע
  choice: ఆయన ... పెద్దగా పట్టించుకోలేదు
  rationale: ידע ఇక్కడ కేవలం తెలిసికొనడాన్ని కాక గమనించడం లేదా పరిగణనలోకి తీసుకోవడాన్ని సూచించే అవకాశముంది; ‘పట్టించుకోలేదు’ ఆ భావాన్ని సహజమైన తెలుగులో ఇస్తుంది.
- source_word: בַּפַּשׁ
  choice: అతిక్రమాన్ని
  rationale: అరుదైన, అర్థం అనిశ్చితంగా ఉన్న పదానికి న్యాయపరమైన సందర్భంలో సరిపోయే అర్థం; ఇతర సాధ్యార్థాలు పాదసూచికలో ఇవ్వబడ్డాయి.
- source_word: מְאֹד
  choice: పెద్దగా
  rationale: క్రియను తీవ్రపరిచే מְאֹדను ప్రతికూల వాక్యంలో సహజంగా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: దేవుడు అతిక్రమాన్ని గమనించడనే క్లిష్టమైన వాక్యభాగం
  choice: అతిక్రమాన్ని ఆయన పెద్దగా పట్టించుకోలేదు
  alternative: గొప్ప ధిక్కారాన్ని ఆయన ఎరుగలేదు
  rationale: దేవునికి తెలియదనే సిద్ధాంతపరమైన నిర్ణయాన్ని చొప్పించకుండా, ידעకు సాధ్యమైన ‘గమనించు/పరిగణించు’ భావాన్ని అనుసరించాం. ఈ మాట ఏలీహూ వాదనలో భాగమనే సందర్భంలోని ఉద్రిక్తతను అలాగే ఉంచాం.
- issue: ఆయన కోపం మరియు శిక్ష మధ్య వ్యాకరణ సంబంధం
  choice: ఆయన కోపం శిక్షించలేదు
  alternative: ఆయన తన కోపంతో విచారించలేదు
  rationale: హీబ్రూ వాక్యంలోని సంక్షిప్తమైన, క్లిష్టమైన నిర్మాణాన్ని పూర్తిగా సరిచేసి చెప్పకుండా ప్రధాన పాఠ్యంలో సమీప రూపాన్ని ఉంచి, పקד యొక్క విస్తృత అర్థాన్ని పాదసూచికలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. మూల వచనం తదుపరి వాక్యంతో కొనసాగుతున్నందున చివర కామా ఉంచబడింది; క్లిష్టమైన హీబ్రూ భావాన్ని అతిగా వివరించకుండా పాదసూచికలతో అనిశ్చితిని నిలిపాం.
