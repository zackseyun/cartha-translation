source:
  edition: WLC
  text: וְֽ/לֹא אָמַ֗ר אַ֭יֵּה אֱל֣וֹהַּ עֹשָׂ֑/י נֹתֵ֖ן זְמִר֣וֹת בַּ/לָּֽיְלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/035/010.yaml
  text: But no one says[a], ‘Where is God my Maker, who gives songs in the night?’
translation:
  language: te
  text: అయితే ఎవరూ, “రాత్రివేళ పాటలు ఇచ్చే నా సృష్టికర్తయైన దేవుడు ఎక్కడ ఉన్నాడు?[a]” అని అడగరు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “నా సృష్టికర్త” అని అనువదించిన హీబ్రూ పదం రూపపరంగా “నా సృష్టికర్తలు” అనే బహువచనంలో ఉంది; అయితే ఇక్కడ అది ఏక దేవుణ్ణే సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא אָמַר
  choice: అయితే ఎవరూ ... అని అడగరు
  rationale: ముందటి సందర్భానికి వ్యతిరేక భావాన్ని וְלֹא తెలియజేస్తుంది. אָמַר రూపతః భూతకాలమైనా, ఇక్కడ సాధారణంగా ప్రజలు ఇలా అనరు/అడగరు అనే అలవాటుసంబంధ వర్తమాన భావం ఉంది. ప్రత్యక్ష ప్రశ్నను పరిచయం చేస్తున్నందున తెలుగులో ‘అని అడగరు’ సహజం.
- source_word: אַיֵּה
  choice: ఎక్కడ ఉన్నాడు?
  rationale: స్థానం లేదా సాన్నిధ్యాన్ని ప్రశ్నించే పదం; దేవుణ్ణి సూచిస్తున్నందున తెలుగు పుంలింగ ఏకవచన రూపం వాడబడింది.
- source_word: אֱלוֹהַּ
  choice: దేవుడు
  rationale: యోబు గ్రంథంలో దేవునికి వాడే సాధారణ ఏకవచన దైవనామం.
- source_word: עֹשָׂי
  choice: నన్ను చేసిన
  rationale: హీబ్రూ రూపం వ్యాకరణపరంగా బహువచనమైనా, ఇక్కడ ఏక దేవుణ్ణే సూచిస్తుంది. ‘నా సృష్టికర్త’ కంటే ‘నన్ను చేసిన’ సాధారణ ఆధునిక తెలుగులో సహజంగా ఉండి మూల క్రియాభావాన్ని నిలుపుతుంది; రూపంలోని బహువచనం పాదటిప్పణిలో తెలిపబడింది.
- source_word: נֹתֵן
  choice: అనుగ్రహించేవాడు
  rationale: దేవుడు లక్షణాత్మకంగా ఇచ్చేవాడని తెలిపే కృదంతం. ‘ఇచ్చేవాడు’ సాధ్యమైనప్పటికీ, రాత్రి కష్టంలో పాటలను ప్రసాదించే భావానికి ‘అనుగ్రహించేవాడు’ సహజమైన గౌరవభరిత తెలుగు.
- source_word: זְמִרוֹת
  choice: పాటలు
  rationale: ఈ నామవాచకం పాటలు లేదా గీతాలను సూచిస్తుంది. ‘స్తుతిగీతాలు’ అని చేస్తే మూలంలో తప్పనిసరిగా లేని ఆరాధనా భావాన్ని చేర్చినట్లవుతుంది.
- source_word: בַּלָּיְלָה
  choice: రాత్రివేళ
  rationale: ‘రాత్రిలో’ అనే భావాన్ని సహజమైన, కవితాత్మక ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: దేవుణ్ణి సూచించే עֹשָׂי పదంలోని సంఖ్య
  choice: 'అర్థపరంగా ఏకవచనం: ‘నన్ను చేసిన దేవుడు’'
  alternative: 'రూపపరమైన బహువచనం: ‘నన్ను చేసినవారు/నా సృష్టికర్తలు’'
  rationale: పదరూపం బహువచనమైనా వాక్యంలో సూచించబడేది ఏకవచన దేవుడే. ప్రధాన పాఠ్యంలో బహువచనం ఉంచితే అనవసరంగా అనేక సృష్టికర్తల భావం కలగవచ్చు. అందువల్ల ఏకవచనార్థాన్ని ప్రధాన పాఠ్యంలో ఇచ్చి, మూలరూపంలోని ఉద్రిక్తతను పాదటిప్పణిలో సంరక్షించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, యోబు కవిత్వానికి తగిన గౌరవభరిత స్వరం నిలుపబడింది. ‘పాటలు’ అనే విస్తృత పదంతో మూలంలోని సాధ్యమైన స్తుతి భావాన్ని నిర్బంధంగా నిర్ణయించలేదు.
