source:
  edition: WLC
  text: שָׁ֣ם יִ֭צְעֲקוּ וְ/לֹ֣א יַעֲנֶ֑ה מִ֝/פְּנֵ֗י גְּא֣וֹן רָעִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/job/035/012.yaml
  text: There they cry out[a], but he does not answer[b], because of the pride of evil men.
translation:
  language: te
  text: అక్కడ వారు మొరపెడతారు; కానీ జవాబివ్వడు[b]—దుష్టుల గర్వం[a] కారణంగా.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘దుష్టుల అహంకారం.’
    reason: lexical_alternative
  - marker: b
    text: ‘జవాబివ్వడు’ అనే క్రియకు కర్త ఎవరో హీబ్రూ పాఠం స్పష్టంగా పేరుపెట్టి చెప్పదు; సందర్భం దేవుణ్ణి సూచిస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: שָׁם
  choice: అక్కడ
  rationale: ఇది ప్రధానంగా స్థలాన్ని సూచించే క్రియావిశేషణం; ముందుగా వర్ణించిన పరిస్థితినే సూచించేలా ‘అక్కడ’ సహజంగా ఉంది.
- source_word: יִצְעֲקוּ
  choice: వారు మొరపెడతారు
  rationale: צעק బాధలో లేదా అణచివేతలో సహాయం కోసం గట్టిగా వేడుకోవడాన్ని సూచిస్తుంది; ‘మొరపెడతారు’ ఆ అత్యవసర భావాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: וְלֹא
  choice: కానీ ... లేదు
  rationale: వావ్ సాధారణంగా ‘మరియు’ అని అర్థమిచ్చినా, ఇక్కడ మొరకు జవాబు రాకపోవడంలోని వ్యత్యాసాన్ని ‘కానీ’ స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: יַעֲנֶה
  choice: జవాబివ్వడు
  rationale: హీబ్రూ క్రియ తృతీయ పురుష ఏకవచనంలో ఉన్నా కర్తను పేరుతో చెప్పదు. తెలుగు క్రియారూపం కూడా కర్తను ప్రత్యేకంగా చేర్చకుండా ఆ నియంత్రణను నిలుపుతుంది.
- source_word: מִפְּנֵי
  choice: కారణంగా
  rationale: ఈ సందర్భంలో ఈ పదబంధం కారణాన్ని సూచిస్తుంది; ‘కారణంగా’ సంక్షిప్తంగా, సహజంగా ఉంది.
- source_word: גְּאוֹן
  choice: గర్వం
  rationale: ఈ పదానికి ఘనత, ఔన్నత్యం, గర్వం వంటి అర్థాలు ఉండవచ్చు; దుష్టులతో కలిసివచ్చినందున ప్రతికూల భావంలోని ‘గర్వం’ తగినది.
- source_word: רָעִים
  choice: దుష్టులు
  rationale: ఇది చెడు చేసే మనుషులను సూచించే పుంలింగ బహువచన విశేషణ-నామవాచకం. తెలుగులో ‘దుష్టులు’ మానవ దుర్మార్గులను సహజంగా సూచిస్తుంది; అవసరం లేని అదనపు లింగపదాన్ని చేర్చదు.
theological_decisions:
- issue: ‘జవాబివ్వడు’ అనే క్రియకు అంతర్లీన కర్త
  choice: కర్తను ‘దేవుడు’ అని ప్రధాన వాక్యంలో స్పష్టంగా చేర్చకుండా ‘జవాబివ్వడు’ అని అనువదించడం
  alternative: దేవుడు వారికి జవాబివ్వడు
  rationale: సందర్భం కర్త దేవుడని సూచించినా, ఈ హీబ్రూ వాక్యభాగం ఆయన పేరును గానీ సర్వనామాన్ని గానీ స్పష్టంగా ఇవ్వదు. కర్తను పేరుతో చేర్చకపోవడం మూలపాఠంలోని సంయమనాన్ని, స్వల్ప అస్పష్టతను కాపాడుతుంది.
- issue: מִפְּנֵי גְּאוֹן רָעִים యొక్క కారణ సంబంధం
  choice: జవాబు రాకపోవడానికి దుష్టుల గర్వాన్ని కారణంగా చూపించడం
  alternative: దుష్టుల అహంకారం కారణంగా
  rationale: వ్యాకరణపరంగా కారణాన్ని తెలిపే పదబంధం ముందున్న ‘జవాబివ్వడు’ అనే క్రియతో సహజంగా అనుసంధానమవుతుంది. ‘గర్వం’ మరియు ‘అహంకారం’ రెండూ సాధ్యమైన ప్రతికూల అర్థాలు; ప్రధాన పాఠంలో విస్తృతమైన ‘గర్వం’ ఉంచబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. ‘మొరపెడతారు’ బాధలో సహాయం కోరే తీవ్రతను వ్యక్తం చేస్తుంది. మూలంలోని కర్త-అస్పష్టతను కాపాడటానికి ‘ఆయన’ లేదా ‘దేవుడు’ అని ప్రధాన పాఠంలో చేర్చలేదు. పాదసూచిక [a] సంబంధిత ‘గర్వం’ పదం వద్ద, [b] ‘జవాబివ్వడు’ వద్ద ఉంచబడ్డాయి.
