  yaml_path: translation/ot/job/035/008.yaml
  text: Your wickedness affects a man like yourself[a], and your righteousness a son of man.
translation:
  language: te
  text: నీలాంటి మనిషికి నీ దుష్టత్వం హాని చేస్తుంది; మానవునికి నీ నీతి మేలు చేస్తుంది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'పదశః: “మనిషి కుమారునికి.” ఇక్కడ ఇది మెస్సీయ బిరుదు కాదు; మర్త్య మానవుణ్ణి సూచించే సాధారణ హీబ్రూ నుడికారం.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְאִישׁ
  choice: మనిషికే హాని చేస్తుంది
  rationale: సందర్భంలోని సంక్షిప్త వాక్య నిర్మాణంలో לְ ప్రభావం ఎవరికి చేరుతుందో సూచిస్తుంది. దుష్టత్వానికి సహజమైన ప్రతికూల ప్రభావాన్ని తెలుగులో స్పష్టంగా తెలియజేయడానికి ‘హాని చేస్తుంది’ అని అనువదించాం.
- source_word: כָּמוֹךָ
  choice: నీలాంటి
  rationale: యోబుతో పోల్చబడుతున్న మరొక మనిషిని సూచించే ప్రత్యక్ష పోలికను సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: רִשְׁעֶךָ
  choice: నీ దుష్టత్వం
  rationale: ఈ పదం నైతిక దుర్మార్గతను సూచిస్తుంది; సమాంతరంగా ఉన్న ‘నీతి’కి తగిన వ్యతిరేక పదం ‘దుష్టత్వం’.
- source_word: וּלְבֶן אָדָם
  choice: మానవునికే
  rationale: בֶּן־אָדָם ఇక్కడ మెస్సీయ బిరుదు కాదు; אִישׁకు సమాంతరంగా ఒక మర్త్య మానవుణ్ణి సూచించే సాధారణ కవితాత్మక నుడికారం. తెలుగులో అర్థసహజత కోసం ‘మానవుడు’ వాడాం.
- source_word: צִדְקָתֶךָ
  choice: నీ నీతి ... మేలు చేస్తుంది
  rationale: צְדָקָה ఇక్కడ నీతిని లేదా సరైన ప్రవర్తనను సూచిస్తుంది. సందర్భానుసారంగా దాని అనుకూల ప్రభావాన్ని ‘మేలు చేస్తుంది’ అనే పూరక క్రియతో వ్యక్తం చేశాం.
theological_decisions:
- issue: בֶּן־אָדָם అనే పదబంధం అర్థం
  choice: సాధారణ మానవుడు
  alternative: ‘మనుష్య కుమారుడు’ అనే పదశః రూపం లేదా మెస్సీయ బిరుదు
  rationale: యోబు గ్రంథంలోని ఈ కవితా సందర్భంలో ఇది ‘నీలాంటి మనిషి’కి సమాంతరంగా సాధారణ మర్త్యుణ్ణి సూచిస్తుంది; మెస్సీయ సంబంధమైన ప్రత్యేక బిరుదుగా పనిచేయదు.
- issue: దుష్టత్వం, నీతి కలిగించే ప్రభావాన్ని తెలిపే క్రియలు
  choice: ‘హాని చేస్తుంది’, ‘మేలు చేస్తుంది’ అని సందర్భం నుంచి పూరించడం
  alternative: ‘మనిషికే నీ దుష్టత్వం; మానవునికే నీ నీతి’ అని క్రియలేని పదశః నిర్మాణం
  rationale: హీబ్రూ కవితలో క్రియలు సంక్షిప్తంగా విడిచిపెట్టబడ్డాయి; 6–7 వచనాల సందర్భం మానవ ప్రవర్తన ప్రభావం ఇతర మానవులకు చేరుతుందని సూచిస్తుంది. తెలుగు పాఠకునికి వాక్యం సహజంగా, స్పష్టంగా ఉండేందుకు తగిన క్రియలు పూరించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కవితా గద్యశైలి. హీబ్రూ సమాంతర నిర్మాణాన్ని నిలుపుతూ, తెలుగులో అర్థం పూర్తికావడానికి సందర్భం సూచించే ‘హాని చేస్తుంది/మేలు చేస్తుంది’ అనే క్రియలను పూరించాం.
