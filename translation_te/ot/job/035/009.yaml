translation:
  language: te
  text: 'అనేక అణచివేతల వల్ల మొరపెడతారు;

    బలవంతుల బాహువు వల్ల[a][b] సహాయం కోసం కేకలు వేస్తారు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘బలవంతుల బాహువు నుంచి సహాయం కోసం కేకలు వేస్తారు.’ హీబ్రూ విభక్తి ప్రత్యయాన్ని అక్షరార్థంగా ‘నుంచి’ అని అనువదించవచ్చు; అయితే ఇక్కడ అది వారి కేకకు కారణాన్ని సూచించే అవకాశం ఎక్కువ.
    reason: lexical_alternative
  - marker: b
    text: ‘బాహువు’ అనేది బలం లేదా అధికారాన్ని సూచించే హీబ్రూ రూపకం.
    reason: cultural_note
lexical_decisions:
- source_word: מֵרֹב
  choice: అనేక … వల్ల
  rationale: מִן + רֹב ఇక్కడ కారణాన్ని సూచిస్తుంది. ‘అనేక … వల్ల’ సహజమైన ఆధునిక తెలుగులో కారణార్థాన్నీ, అణచివేతల విస్తృతినీ తెలియజేస్తుంది.
- source_word: עֲשׁוּקִים
  choice: అణచివేతలు
  rationale: ఈ సందర్భంలో עשק మూలం నుంచి వచ్చిన బహువచన రూపం ప్రధానంగా అణచివేయబడిన వ్యక్తులను కాక, అణచివేత చర్యలు లేదా సందర్భాలను సూచిస్తుంది.
- source_word: יַזְעִיקוּ
  choice: ప్రజలు మొరపెడతారు
  rationale: זעק హిఫీల్ రూపం బాధలో గట్టిగా మొరపెట్టడాన్ని సూచిస్తుంది. హీబ్రూలో కర్త స్పష్టంగా పేర్కొనబడకపోయినా, తెలుగులో సహజత కోసం సందర్భానుసారంగా ‘ప్రజలు’ అని వ్యక్తీకరించబడింది.
- source_word: יְשַׁוְּעוּ
  choice: సహాయం కోసం కేకలు వేస్తారు
  rationale: שוע పియేల్ రూపం సహాయం కోరుతూ చేసే విజ్ఞప్తిని సూచిస్తుంది; ముందున్న ‘మొరపెడతారు’తో సమాంతరతను ఉంచుతూ స్వల్ప భావభేదాన్ని తెలియజేస్తుంది.
- source_word: מִזְּרֹעַ
  choice: బాహువువల్ల
  rationale: זְרוֹעַ అనే ‘బాహువు’ రూపకాన్ని నిలిపి, מִן‌ను సందర్భానుసారంగా కారణార్థకమైన ‘వల్ల’గా అనువదించాం.
- source_word: רַבִּים
  choice: బలవంతులు
  rationale: ఇక్కడ רַבִּים కేవలం ‘అనేకులు’ అనే సంఖ్యార్థం కన్నా సామాజిక శక్తిగల గొప్పవారిని లేదా బలవంతులను సూచిస్తుంది.
