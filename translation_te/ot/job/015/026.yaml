  text: He rushes at him with his neck[a], with the thick bosses of his shields.
translation:
  language: te
  text: 'అతడు తన మెడతో[a] ఆయనమీదికి దూసుకుపోతాడు,

    తన డాళ్ల మందమైన ఉబ్బులతో.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మెడను చాచి.” హీబ్రూలో అక్షరార్థంగా “మెడతో” అని ఉంది. ఇది మెడను ముందుకు చాచి లేదా మొండిగా దాడి చేసే సజీవమైన, సంక్షిప్తమైన చిత్రణ కావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָרוּץ
  choice: దూసుకుపోతాడు
  rationale: רוץ యొక్క ప్రాథమిక అర్థం ‘పరుగెత్తడం’; ఈ శత్రుత్వ సందర్భంలో వేగమైన దాడిని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: אֵלָיו
  choice: ఆయనమీదికి
  rationale: ఈ సందర్భంలో אֶל దాడి లక్ష్యాన్ని సూచిస్తుంది. ముందున్న వచనసందర్భంలో లక్ష్యం దేవుడు కాబట్టి గౌరవార్థక సర్వనామం వాడబడింది.
- source_word: בְּצַוָּאר
  choice: మెడ చాపుకొని
  rationale: అక్షరార్థంగా ‘మెడతో’; సంక్షిప్తమైన హీబ్రూ దృశ్యాన్ని తెలుగులో అర్థమయ్యేలా చేస్తూ, తలవంచని ముందడుగు భావాన్ని అతిగా సిద్ధాంతీకరించకుండా వ్యక్తం చేస్తుంది.
- source_word: בַּעֲבִי
  choice: మందమైన
  rationale: עֳבִי మందం లేదా దృఢమైన పరిమాణాన్ని సూచిస్తుంది; డాళ్ల ఉబ్బులకు సహజమైన విశేషణంగా అనువదించబడింది.
- source_word: גַּבֵּי
  choice: ఉబ్బులతో
  rationale: డాళ్ల సందర్భంలో ఈ పదం వాటి పైకి పొంగిన లేదా ఉబ్బిన భాగాలను సూచిస్తుంది. అరుదైన సాంకేతిక పదం కంటే సాధారణ పాఠకునికి స్పష్టమైన రూపం ఎంచుకోబడింది.
- source_word: מָגִנָּיו
  choice: తన డాళ్ల
  rationale: రూపం బహువచనమూ తృతీయ పురుష ఏకవచన స్వామ్యప్రత్యయమూ కలిగి ఉంది; అందువల్ల బహువచనం నిలుపబడింది.
theological_decisions:
- issue: אֵלָיו లోని సర్వనామ లక్ష్యం
  choice: ఆయనమీదికి
  alternative: అతనిమీదికి
  rationale: యోబు 15:25లో దేవునికి ఎదురు తిరిగిన దుష్టుణ్ణి ఈ వాక్యం కొనసాగిస్తుంది; లక్ష్యం దేవుడని సందర్భం సూచిస్తుంది. అయితే హీబ్రూలో సర్వనామం మాత్రమే ఉన్నందున కొత్త నామాన్ని చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కవితా శైలి. హీబ్రూ రూపకంలోని డాళ్ల బహువచనాన్ని, వాటి ఉబ్బిన భాగాల చిత్రాన్ని నిలిపి, అరుదైన ఆయుధ సాంకేతిక పదజాలాన్ని నివారించాం.
