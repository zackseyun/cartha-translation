  text: Should he argue with useless words[a], or with speech that does no good?
translation:
  language: te
  text: ప్రయోజనం లేని మాటలతో అతడు వాదించాలా[a]? తనకు ఏ మేలు కలగని మాటలతోనా?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ప్రయోజనం లేని మాటలతో అతడు తర్కించాలా? తనకు ఏ ప్రయోజనమూ కలగని మాటలతోనా?”
    reason: హోఖీయఖ్‌కు ‘తర్కించు’ అనే సందర్భానుకూల ప్రత్యామ్నాయం ఉంది; చివరి పాదం మాటల ద్వారా ప్రయోజనం కలగకపోవడాన్ని కూడా వ్యక్తం చేయవచ్చు.
lexical_decisions:
- source_word: הוֹכֵחַ
  choice: వాదించాలా
  rationale: יכח హిఫిల్ రూపానికి ‘వాదించు, తర్కించు, గద్దించు’ అనే భావాలు ఉండవచ్చు. యోబు వివాద సందర్భంలో మాటల ద్వారా ప్రతివాదం చేయడాన్ని ‘వాదించు’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בְּדָבָר לֹא יִסְכּוֹן
  choice: ప్రయోజనం లేని మాటలతో
  rationale: דבר ఇక్కడ సమాంతర పాదంలోని מלים వలె మాటలను సూచిస్తుంది; סכן ప్రయోజనకరంగా ఉండడాన్ని సూచిస్తుంది. ఈ ఎంపిక మూలంలోని నిషేధ భావాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: וּמִלִּים
  choice: పలుకులతో
  rationale: מלים అంటే ‘మాటలు.’ మొదటి పాదంలోని ‘మాటలు’తో సమాంతరతను నిలుపుతూ తెలుగు శైలిలో అనవసర పునరుక్తి తగ్గించడానికి ‘పలుకులు’ ఎంచుకున్నాం.
- source_word: לֹא יוֹעִיל בָּם
  choice: మేలు చేయని
  rationale: יעל హిఫిల్ రూపం ప్రయోజనం కలిగించడం లేదా మేలు చేయడం అనే భావాన్ని ఇస్తుంది. בם ఆ మాటల ద్వారానే మేలు కలగదని సూచిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైన ప్రశ్నారూపంతో అనువదించబడింది. హీబ్రూ సమాంతర నిర్మాణాన్ని రెండు ప్రశ్నలుగా సహజంగా ప్రతిబింబించింది; వాక్యంలోని కర్తకు ఉన్న సందర్భసిద్ధ అస్పష్టతను ‘అతడు’గా నిలిపింది.
