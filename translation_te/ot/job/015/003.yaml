  source_fidelity: మొదటి పాదం హీబ్రూ భావాన్ని సరిగ్గా ఇస్తుంది. అయితే రెండవ పాదంలోని בָּם (‘వాటి ద్వారా/వాటిలో’) మాటలను సాధనంగా సూచిస్తుంది; ప్రస్తుత ‘మేలు చేయని పలుకులు’ పలుకులే మేలు చేయవని చెప్పి ఆ సంబంధాన్ని కొద్దిగా మార్చుతుంది. ‘తనకు ఏ మేలు కలగని మాటలతో’ మూలానికి మరింత సమీపం.
