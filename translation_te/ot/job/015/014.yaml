- from: నరుడు[a] నిర్మలుడుగా[b] ఉండడానికి అతడు ఎంతటివాడు? స్త్రీకి పుట్టినవాడు నీతిమంతుడుగా[c] ఉండడానికి ఎంతటివాడు?
  to: నరుడు[a] నిర్మలంగా[b] ఉండగలిగేంతటివాడా? స్త్రీకి జన్మించినవాడు నీతిమంతుడిగా[c] ఉండగలిగేంతటివాడా?
  rationale: సవరణ మూలంలోని రెండు సమాంతర అలంకారప్రశ్నలను, ప్రతినిధి ఏకవచనాన్ని, నిర్మలత మరియు నీతి మధ్య భేదాన్ని నిలుపుతుంది. తెలుగు వాక్యనిర్మాణాన్ని సహజంగా చేయడానికి ఉద్దేశార్థకంగా వినిపించే ‘ఉండడానికి’ని ‘ఉండగలిగేంతటివాడా?’గా మార్చి, అనవసరమైన ‘అతడు’ను తొలగించాం. ఆంగ్ల పాదటిప్పణుల క్రమదోషాన్ని తెలుగులో పునరావృతం చేయలేదు; ప్రతి గుర్తు తాను సూచించే పదానికే అనుసంధానమై ఉంది.
