id: JOB.15.14
reference: Job 15:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: מָֽה אֱנ֥וֹשׁ כִּֽי יִזְכֶּ֑ה וְ/כִֽי יִ֝צְדַּ֗ק יְל֣וּד אִשָּֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/015/014.yaml
  text: What is man[a], that he should be pure, or one born of a woman[c][b], that he should be righteous?
translation:
  language: te
  text: నరుడు[a] నిర్మలంగా[b] ఉండగలిగేంతటివాడా? స్త్రీకి జన్మించినవాడు నీతిమంతుడిగా[c] ఉండగలిగేంతటివాడా?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నరుడు’ అని అనువదించిన హీబ్రూ ఏకవచన పదం బలహీనమైన, మరణశీల మానవుని సూచిస్తుంది; ఇక్కడ అది మానవాళికి సాధారణంగా వర్తిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘శుద్ధంగా’. హీబ్రూ పదం శుభ్రతను లేదా నైతిక నిర్మలతను సూచించగలదు.
    reason: lexical_alternative
  - marker: c
    text: లేదా ‘న్యాయవంతుడిగా’ లేదా ‘సరైనవాడిగా’. హీబ్రూ పదం నీతిమంతుడిగా ఉండడం లేదా సరైనవాడిగా ఉండడం అనే భావాలను కలిగి ఉంటుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה
  choice: ఎంతటివాడు
  rationale: ఈ అలంకారప్రశ్నలో మానవుని స్థితి లేదా సామర్థ్యం ఎంత అల్పమో ప్రశ్నిస్తుంది. ‘ఎంతటివాడు’ అనే తెలుగు ప్రయోగం ఆ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אֱנוֹשׁ
  choice: నరుడు
  rationale: ఈ పదం బలహీనమైన, మరణశీల మానవుని సూచిస్తుంది. ఏకవచన ప్రతినిధి భావాన్ని నిలుపుతూ ఇక్కడ ‘నరుడు’ సమస్త మానవాళిని సూచిస్తుంది.
- source_word: כִּי
  choice: ఉండడానికి
  rationale: ప్రశ్నార్థక నిర్మాణం తరువాత వచ్చే ఈ పదం ‘అతడు ... ఉండగలిగేంతటివాడా?’ అనే భావసంబంధాన్ని తెలియజేస్తుంది. తెలుగు వాక్యంలో ‘ఉండడానికి’ ఆ సంబంధాన్ని సహజంగా అందిస్తుంది.
- source_word: יִזְכֶּה
  choice: నిర్మలుడుగా
  rationale: זכה అనే ధాతువు శుభ్రంగా, పవిత్రంగా లేదా అపరాధం లేకుండా ఉండడాన్ని సూచించగలదు. ఇక్కడ నైతిక పరిశుద్ధతను భౌతిక శుభ్రతగా పరిమితం చేయకుండా ‘నిర్మలుడు’ విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: וְכִי
  choice: రెండవ సమాంతర ప్రశ్నగా
  rationale: వావ్ రెండవ సమాంతర వాక్యభాగాన్ని కలుపుతుంది. తెలుగులో ప్రత్యేక ప్రశ్నగా ఉంచడం కవితాత్మక సమాంతరతను సహజంగా వ్యక్తం చేస్తుంది; దాని సంబంధాన్ని ‘మరియు’ లేదా ‘లేదా’గా అతిగా నిర్ణయించదు.
- source_word: יִצְדַּק
  choice: నీతిమంతుడుగా
  rationale: צדק Qal రూపం నీతిమంతుడిగా లేదా న్యాయపరంగా సరైనవాడిగా ఉండే స్థితిని సూచిస్తుంది. ‘నీతిమంతుడు’ నైతిక, మూల్యాంకన పరమైన విస్తృతిని నిలుపుతుంది.
- source_word: יְלוּד אִשָּׁה
  choice: స్త్రీకి పుట్టినవాడు
  rationale: ఇది మానవుని జన్మస్థితిని, మరణశీల బలహీనతను సూచించే హీబ్రూ నుడికారం. తెలుగు అనువాదం దాని ఏకవచన రూపాన్నీ ప్రత్యక్ష చిత్రాన్నీ నిలుపుతుంది.
theological_decisions:
- issue: אֱנוֹשׁ మరియు יְלוּד אִשָּׁה యొక్క మానవశాస్త్ర పరిధి
  choice: ‘నరుడు’, ‘స్త్రీకి పుట్టినవాడు’ అనే ప్రతినిధి ఏకవచనాలు సమస్త మానవాళిని సూచిస్తాయి
  alternative: ‘మానవుడు’ లేదా ‘స్త్రీకి పుట్టిన ఎవరైనా’
  rationale: హీబ్రూలో వ్యాకరణపరంగా పురుష ఏకవచనం ఉన్నా, దాని ఉద్దేశం మానవాళి అంతటినీ సూచించడం. రూపాన్ని సాధ్యమైనంతగా నిలుపుతూ సామాన్య పరిధిని పాదటిప్పణిలో స్పష్టం చేశాం.
- issue: יִצְדַּק లోని నైతిక మరియు న్యాయస్థాన సంబంధ భావాలు
  choice: నీతిమంతుడుగా
  alternative: న్యాయవంతుడుగా; నిర్దోషిగా తేలడం
  rationale: ఈ జ్ఞానసాహిత్య సందర్భంలో పదం ఒక సాంకేతిక సిద్ధాంతపదంగా కాక, దేవుని ఎదుట మానవుని సరైన లేదా నీతిగల స్థితిని విస్తృతంగా సూచిస్తుంది. ‘నీతిమంతుడు’ ఆ ఉద్రిక్తతను నిలుపుతుంది.
- issue: וְכִי యొక్క సమాంతర సంబంధం
  choice: రెండు అనుసంధానిత అలంకారప్రశ్నలుగా అనువదించడం
  alternative: ‘మరియు’తో లేదా ‘లేదా’తో స్పష్టంగా కలపడం
  rationale: హీబ్రూ వావ్ సాధారణంగా సమన్వయాన్ని సూచించినా, ఈ కవితాత్మక సమాంతరతలో తెలుగు సంధి లేకుండానే సంబంధం స్పష్టంగా ఉంటుంది. అందువల్ల ‘మరియు/లేదా’ అని అర్థాన్ని అనవసరంగా సంకుచితం చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరమైన కవితాత్మక ప్రశ్నారూపాన్ని ఉపయోగించాం. ‘నరుడు’ కొంత సాహిత్య గౌరవాన్ని, ప్రతినిధి ఏకవచనాన్ని నిలుపుతుంది. రెండు ప్రశ్నల సమాంతర నిర్మాణం హీబ్రూ కవిత్వాన్ని స్పష్టంగా ప్రతిబింబిస్తుంది.
