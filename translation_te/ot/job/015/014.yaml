    rationale: ‘నరుడు ... అతడు’ రెండూ ఒకే కర్తను సూచిస్తున్నాయి. పునరుక్తిని తొలగించడం కవితాత్మక సంక్షిప్తతను మెరుగుపరుస్తుంది.
  - severity: low
