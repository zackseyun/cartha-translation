translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కవితా శైలి ఉపయోగించబడింది. మూలంలోని ఆకస్మిక వ్యత్యాసాన్ని తెలియజేయడానికి రెండు వాక్యభాగాల నిర్మాణం నిలుపబడింది.
