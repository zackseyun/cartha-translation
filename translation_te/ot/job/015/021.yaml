  yaml_path: translation/ot/job/015/021.yaml
  text: A sound of terrors is in his ears[a]; in prosperity the destroyer comes upon him.
translation:
  language: te
  text: భయోత్పాతాల ధ్వని అతని చెవుల్లో వినిపిస్తుంది; సుఖసమృద్ధిలో ఉన్నప్పుడు[a] విధ్వంసకుడు అతని మీదికి వస్తాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘శాంతిగా ఉన్నప్పుడు’ లేదా ‘సురక్షితంగా ఉన్నప్పుడు’; హీబ్రూ పదం క్షేమం, శాంతి, సురక్షిత స్థితి లేదా సుఖసమృద్ధిని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: קוֹל פְּחָדִים
  choice: భయోత్పాతాల ధ్వని
  rationale: קוֹל అనే ఏకవచనాన్ని ‘ధ్వని’గా, פְּחָדִים అనే బహువచనంలోని తీవ్రతను ‘భయోత్పాతాలు’గా వ్యక్తం చేస్తుంది. ఇది కేవలం అంతరంగ భయాన్ని కాక, అతనికి వినిపించే భయంకర సంకేతాల భావాన్ని నిలుపుతుంది.
- source_word: בְּאָזְנָיו
  choice: అతని చెవుల్లో వినిపిస్తుంది
  rationale: హీబ్రూలోని ‘అతని చెవుల్లో’ అనే స్పష్టమైన శరీర రూపకాన్ని నిలుపుతూ, తెలుగులో సహజంగా ఉండేందుకు ‘వినిపిస్తుంది’ ఉపయోగించబడింది.
- source_word: בַּשָּׁלוֹם
  choice: సుఖసమృద్ధిలో ఉన్నప్పుడు
  rationale: שָׁלוֹם ఇక్కడ క్షేమం, సౌఖ్యం, సమృద్ధి ఉన్న స్థితిని సూచించవచ్చు. అకస్మాత్తుగా విధ్వంసకుడు రావడమనే వ్యత్యాసాన్ని ఈ ఎంపిక స్పష్టంగా వ్యక్తం చేస్తుంది; ఇతర సాధ్యమైన అర్థాలు పాదటిప్పణిలో ఉంచబడ్డాయి.
- source_word: שׁוֹדֵד
  choice: విధ్వంసకుడు
  rationale: ఈ కృదంతం దోచుకునే లేదా నాశనం చేసే వ్యక్తిని సూచిస్తుంది. ‘విధ్వంసకుడు’ సందర్భంలోని వినాశన ముప్పును సాధారణ ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: יְבוֹאֶנּוּ
  choice: అతని మీదికి వస్తాడు
  rationale: క్రియకు జతైన తృతీయ పురుష ఏకవచన కర్మ ప్రత్యయాన్ని ‘అతని మీదికి’గా వ్యక్తం చేసి, శత్రుత్వపూర్వకంగా సమీపించే భావాన్ని అతిగా విస్తరించకుండా నిలుపుతుంది.
