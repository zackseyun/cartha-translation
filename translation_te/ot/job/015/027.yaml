translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ యోబు గ్రంథపు కవితాత్మక, గంభీర శరీర చిత్రణను నిలిపాం. ‘కొవ్వు’ అనే ప్రత్యక్ష రూపకాన్ని సంపద లేదా స్వీయభోగం అని వివరణాత్మకంగా మార్చలేదు. పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో చేర్చబడింది.
