  text: because he has covered his face with his fat[a], and has put fatness on his loins.
translation:
  language: te
  text: ఎందుకంటే అతడు తన కొవ్వుతో తన ముఖాన్ని కప్పుకున్నాడు; తన నడుము పక్కలపై కొవ్వు మడతలను ఏర్పరచుకున్నాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తన నడుము పక్కలపై కొవ్వుదనాన్ని ఏర్పరచుకున్నాడు.” అరుదైన హీబ్రూ పదం కొవ్వుదనం, మందం లేదా కొవ్వు మడతలను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి వర్ణనకు కారణాన్ని లేదా వివరణాత్మక ఆధారాన్ని పరిచయం చేసే సంబంధాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: כִסָּה
  choice: కప్పుకున్నాడు
  rationale: ‘కప్పు, మరుగుచేయు’ అనే మూలార్థాన్ని నిలుపుతూ, తన కొవ్వు తన ముఖాన్ని కప్పే స్థితిని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: פָנָיו
  choice: తన ముఖాన్ని
  rationale: శరీర సంబంధమైన సమాంతర చిత్రణలో ‘ముఖం’ అనే ప్రత్యక్ష అర్థమే సహజమైనది.
- source_word: בְּחֶלְבּוֹ
  choice: తన కొవ్వుతో
  rationale: חֵלֶב యొక్క స్పష్టమైన శరీరరూపకాన్ని అమూర్తమైన ‘సమృద్ధి’గా మార్చకుండా నిలుపుతుంది.
- source_word: וַיַּעַשׂ
  choice: పెంచుకున్నాడు
  rationale: అక్షరార్థంగా ‘చేశాడు’ అయినా, కొవ్వు శరీరంపై ఏర్పడడం లేదా కూడడం అనే సందర్భార్థాన్ని సహజ తెలుగులో తెలియజేస్తుంది; కర్త చర్యను సూచించే హీబ్రూ రూపాన్ని కూడా నిలుపుతుంది.
- source_word: פִּימָה
  choice: కొవ్వు పొరలను
  rationale: అరుదైన ఈ నామవాచకం మందం, కొవ్వుదనం లేదా కొవ్వు మడతలను సూచించవచ్చు. సందర్భంలోని శరీర చిత్రణను స్పష్టంగా ఉంచుతూ దాని అనిశ్చితిని పాదసూచికలో నమోదు చేస్తుంది.
- source_word: עֲלֵי
  choice: పై
  rationale: సాధారణ స్థాన సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: כָסֶל
  choice: నడుము పక్కలు
  rationale: ఈ పదం నడుము, పార్శ్వాలు లేదా తుంటి పరిసర భాగాలను సూచించగలదు. ఆధునిక పాఠకునికి అర్థమయ్యేలా, అతిగా నిర్దిష్టం చేయకుండా ‘నడుము పక్కలు’ ఎంచుకోబడింది.
