  yaml_path: translation/ot/job/015/004.yaml
  text: Indeed[c][b][a], you annul the fear of God and diminish meditation before God.
translation:
  language: te
  text: నిజానికి[a], నీవు భయాన్ని[b] నిష్ఫలపరుస్తున్నావు; దేవుని సన్నిధిలో ధ్యానాన్ని[c] తగ్గిస్తున్నావు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నిశ్చయంగా,” “అంతేకాదు,” లేదా సందర్భానుసారం “అయినా.”
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా “భయాన్ని.” సందర్భంలో ఇది “దేవునిపట్ల భయాన్ని” లేదా “భయభక్తిని” సూచించే అవకాశం ఉంది. లేదా “భయాన్ని బలహీనపరుస్తున్నావు,” “భయాన్ని భంగపరుస్తున్నావు,” లేదా “దాన్ని నిష్ఫలం చేస్తున్నావు.”
    reason: lexical_alternative
  - marker: c
    text: లేదా “ప్రార్థనను,” “భక్తిపూర్వక మననాన్ని,” “సంభాషణను,” లేదా “ఫిర్యాదును.” హీబ్రూ పదం మననం, ప్రార్థనాపూర్వక మాట, లేదా ఆవేదనతో కూడిన మాటను సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף
  choice: నిజానికి
  rationale: ఎలీఫజు చేస్తున్న ఆరోపణను బలపరిచే ఉద్ఘాటనార్థక అవ్యయంగా ఇక్కడ పనిచేస్తుంది.
- source_word: אַתָּה
  choice: నీవు
  rationale: స్పష్టంగా వాడిన ద్వితీయ పురుష ఏకవచన సర్వనామంలోని ఉద్ఘాటనను నిలుపుతుంది.
- source_word: תָּפֵר
  choice: నిర్వీర్యం చేస్తున్నావు
  rationale: פרר హిఫీల్ రూపానికి ‘భంగపరచు, రద్దుచేయు, పనిచేయకుండా చేయు’ అనే కారణార్థక భావం ఉంది; సందర్భంలో భయాన్ని ప్రభావరహితం చేయడమనే ఆరోపణను ఈ పదం సహజంగా వ్యక్తం చేస్తుంది.
- source_word: יִרְאָה
  choice: దేవునిపట్ల భయం
  rationale: మూలంలో ‘భయం’ మాత్రమే ఉన్నా, సమాంతర పాదంలోని ‘దేవుని సన్నిధిలో’ అనే మాట దీనికి ఆధ్యాత్మిక భయభక్తి భావం ఉందని సూచిస్తుంది. ‘భయం’ అనే మూల పదార్థాన్ని ప్రధాన పాఠంలో నిలిపాం.
- source_word: וְתִגְרַע
  choice: తగ్గిస్తున్నావు
  rationale: גרע అనే క్రియలోని తగ్గించు, కుదించు, వెనక్కి తీసివేయు అనే భావాలను సరళమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: שִׂיחָה
  choice: ధ్యానం
  rationale: ఈ పదం మననం, ప్రార్థనాపూర్వక మాట, విన్నపం లేదా ఫిర్యాదును సూచించగలదు. దేవుని సన్నిధి అనే సందర్భంలో ‘ధ్యానం’ విస్తృతమైన ఆధ్యాత్మిక భావాన్ని నిలుపుతుంది; ఇతర సాధ్యార్థాలు పాదసూచికలో ఇవ్వబడ్డాయి.
- source_word: לִפְנֵי אֵל
  choice: దేవుని సన్నిధిలో
  rationale: ‘దేవుని ఎదుట/సన్నిధిలో’ అనే స్థలాత్మక, సంబంధాత్మక భావాన్ని సహజమైన గౌరవప్రద తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: יִרְאָה పదంలోని మతపరమైన భావం
  choice: దేవునిపట్ల భయం
  alternative: భయం; భయభక్తి
  rationale: ఇది సాధారణ భయాన్ని గూర్చినది కాక, దేవుని ఎదుటి భక్తిపూర్వక వైఖరిని గూర్చిన ఆరోపణ. అయినా ‘భయభక్తి’ అని మాత్రమే అనువదించి మూలంలోని ‘భయం’ భావాన్ని మృదువు చేయలేదు.
- issue: దేవుని సన్నిధిలో שִׂיחָה యొక్క అర్థం
  choice: ధ్యానం
  alternative: ప్రార్థన; భక్తిపూర్వక సంభాషణ; విన్నపం; ఫిర్యాదు
  rationale: హీబ్రూ పదం ఉద్దేశపూర్వకంగా విస్తృతార్థం కలిగి ఉంది. ‘ధ్యానం’ ఆధ్యాత్మిక మననాన్ని ప్రధాన పాఠంలో తెలియజేస్తూ, మరింత నిర్దిష్టమైన ప్రార్థన లేదా ఫిర్యాదు అనే అర్థాన్ని బలవంతంగా నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైన కావ్య ఆరోపణ స్వరంతో అనువదించబడింది. రెండు సమాంతర పాదాల నిర్మాణం అర్ధవిరామంతో నిలుపబడింది; పాఠకులకు అసహజంగా అనిపించే అత్యంత సంస్కృతీకృత పదజాలాన్ని నివారించాం.
