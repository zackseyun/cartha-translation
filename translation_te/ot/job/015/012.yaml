  text: Why does your heart carry you away[a], and why do your eyes flash?
translation:
  language: te
  text: నీ హృదయం నిన్ను ఎందుకు కొట్టుకుపోతుంది? మరి నీ కళ్లు ఎందుకు మెరుస్తున్నాయి[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘కనుసైగ చేస్తున్నాయి,’ ‘సంకేతం చేస్తున్నాయి,’ లేదా బహుశా ‘కళ్లను తిప్పుతున్నాయి.’ ఇక్కడి హీబ్రూ క్రియ అరుదైనది; దాని ఖచ్చితమైన భావం అనిశ్చితం.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה
  choice: ఎందుకు
  rationale: పదశః ‘ఏమి’ అయినప్పటికీ, ఇక్కడ కారణాన్ని లేదా ఉద్దేశాన్ని ప్రశ్నించే అలంకారిక ప్రశ్నలో సహజమైన తెలుగు రూపం ‘ఎందుకు’.
- source_word: יִקָּחֲךָ
  choice: నిన్ను కొట్టుకుపోతోంది
  rationale: לקח (‘తీసుకొను’) అనే క్రియకు ‘నీ హృదయం’ కర్తగా ఉంది. అంతరంగం ఒకరిని అదుపు తప్పించి తీసుకుపోతున్న రూపక భావాన్ని ‘కొట్టుకుపోతోంది’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לִבֶּךָ
  choice: నీ హృదయం
  rationale: హీబ్రూలో ‘హృదయం’ ఆలోచన, భావోద్వేగం సహా అంతరంగ వ్యక్తిని సూచించగలదు. మూలంలోని రూపకాన్ని నిలుపుతూ తెలుగులోనూ సహజంగా ఉంటుంది.
- source_word: וּמַה
  choice: ఎందుకు
  rationale: మొదటి ప్రశ్నలాగే, సంధితో కూడిన ఈ ప్రశ్నార్థక పదం ఇక్కడ ‘మరి ఎందుకు’ అనే భావాన్ని ఇస్తుంది; తెలుగులో ప్రశ్నల సమాంతర నిర్మాణం వల్ల ప్రత్యేక సంధి అవసరం లేదు.
- source_word: יִרְזְמוּן
  choice: మెరుస్తున్నాయి
  rationale: ఈ క్రియ అరుదైనది; దాని ఖచ్చితమైన భావం అనిశ్చితం. ‘మెరుస్తున్నాయి’ కళ్లలో కనిపించే తీవ్ర లేదా ధిక్కారభరిత వ్యక్తీకరణను సూచించగలదు, అయితే ఇతర సాధ్యార్థాలను పాదసూచికలో ఉంచాం.
- source_word: עֵינֶיךָ
  choice: నీ కళ్లు
  rationale: పదశః అనువాదం తెలుగులో సహజంగా ఉండి, మూలంలోని శరీర సంబంధ చిత్రణను నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ప్రశ్నారూపాన్ని వాడాం. హృదయం వ్యక్తిని కొట్టుకుపోవడం అనే మూల రూపకాన్ని నిలిపాం; అరుదైన నేత్రక్రియలోని అనిశ్చితిని ప్రధాన పాఠంలో బలవంతంగా పరిష్కరించకుండా పాదసూచికలో ప్రత్యామ్నాయాలతో తెలిపాం.
