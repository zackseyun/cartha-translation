  yaml_path: translation/ot/job/015/018.yaml
  text: what wise men declare[a], and have not hidden from their fathers—
translation:
  language: te
  text: జ్ఞానులు తెలియజేసిన దానిని, తమ పితరుల నుండి దాచని దానిని[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారి పితరులు దాచని దానిని”; లేదా, “తమ పితరుల నుండి పొందిన దేనినీ వారు దాచలేదు.” ‘దాచారు’ అనే క్రియకూ ‘వారి పితరులు’ అనే మాటకూ మధ్య సంబంధాన్ని హీబ్రూ వాక్య నిర్మాణం ఒకటి కంటే ఎక్కువ విధాలుగా అర్థం చేసుకోవడానికి వీలిస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: אֲשֶׁר
  choice: దాన్ని
  rationale: మునుపటి వచనంలో చెప్పబోయే విషయం ఏమిటో తెలిపే సంబంధార్థక రూపం. తెలుగులో ‘దాన్ని’ సహజంగా ఉండి, ‘ఏదైతే’ అనే భావాన్ని సంక్షిప్తంగా అందిస్తుంది.
- source_word: חֲכָמִים
  choice: జ్ఞానులు
  rationale: పూర్వకాల జ్ఞానపరంపరను అందించే జ్ఞానవంతులను సూచిస్తుంది. ‘జ్ఞానులు’ ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన బహువచన రూపం.
- source_word: יַגִּידוּ
  choice: తెలియజేసినదాన్ని
  rationale: נגד హిఫీల్ రూపం ఏదైనా విషయాన్ని తెలియజేయడం లేదా ప్రకటించడం అనే భావం ఇస్తుంది. ఇక్కడ పారంపర్య జ్ఞానాన్ని ఇతరులకు అందించడం ప్రధాన భావం కావడంతో ‘తెలియజేసిన’ అని అనువదించబడింది.
- source_word: וְלֹא
  choice: దాచనిదాన్ని
  rationale: రెండవ క్రియను నిషేధార్థంతో మొదటి క్రియకు కలుపుతుంది. తెలుగు సంబంధార్థక నిర్మాణంలో ‘దాచనిదాన్ని’ సంక్షిప్తంగా, సహజంగా ఉంటుంది.
- source_word: כִחֲדוּ
  choice: దాచనిదాన్ని
  rationale: ఈ క్రియకు దాచడం లేదా మరుగుపరచడం ప్రధాన అర్థం. వారసత్వంగా అందిన జ్ఞానాన్ని నిలిపివేయకుండా అందించిన సందర్భానికి ‘దాచు’ సరిపోతుంది.
- source_word: מֵאֲבוֹתָם
  choice: తమ పితరుల నుండి
  rationale: מִן విభక్తి మూలాన్ని లేదా ఎవరినుండి దాచారో సూచించగలదు. ‘తమ పితరుల నుండి’ హీబ్రూ పదబంధాన్ని నేరుగా ప్రతిబింబించి, దాని సంక్షిప్తతను ప్రధాన పాఠ్యంలో నిలుపుతుంది.
theological_decisions:
- issue: כִחֲדוּ అనే క్రియకు מֵאֲבוֹתָם అనే పదబంధానికి మధ్య సంబంధం
  choice: తమ పితరుల నుండి దాచనిదాన్ని
  alternative: వారి పితరులు దాచకుండా తెలియజేసినదాన్ని; లేదా తమ పితరుల నుండి పొందిన దేనినీ వారు దాచకుండా తెలియజేసినదాన్ని
  rationale: హీబ్రూ వాక్యం సంక్షిప్తంగా ఉండటం వల్ల పితరులు సంప్రదాయానికి మూలమా, లేక ఎవరి నుండి విషయం దాచబడలేదో వారేనా అనే విషయంలో ఒకటి కంటే ఎక్కువ నిర్మాణాలు సాధ్యమవుతాయి. ప్రధాన పాఠ్యం పదబంధాన్ని నేరుగా ఉంచుతుంది; పాదసూచిక ఇతర సాధ్యమైన అర్థాలను తెలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, కావ్యాత్మకమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. వాక్యం మునుపటి వచనాన్ని కొనసాగించే భాగం కాబట్టి చివర దీర్ఘవిరామ సూచికను నిలిపాం.
