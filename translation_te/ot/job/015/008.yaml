source:
  edition: WLC
  text: הַ/בְ/ס֣וֹד אֱל֣וֹהַ תִּשְׁמָ֑ע וְ/תִגְרַ֖ע אֵלֶ֣י/ךָ חָכְמָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/015/008.yaml
  text: Have you listened in the council of God[a], and restricted wisdom to yourself?
translation:
  language: te
  text: దేవుని ఆంతరంగిక సభలో[a] నీవు విన్నావా? జ్ఞానాన్ని నీకే పరిమితం చేసుకున్నావా?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దేవుని రహస్య ఆలోచనలో’ లేదా ‘దేవుని రహస్యంలో.’ హీబ్రూ పదం సన్నిహితుల రహస్య సభను, గోప్యమైన సంప్రదింపును, లేదా రహస్యాన్ని సూచించగలదు.
    reason: సוֹד అనే హీబ్రూ పదంలోని నిజమైన పదార్థ వైవిధ్యాన్ని తెలియజేయడానికి.
lexical_decisions:
- source_word: הַ/בְ/סוֹד
  choice: ఆంతరంగిక సభలో
  rationale: סוֹד అనేది రహస్య చర్చ జరిగే సన్నిహిత వర్గాన్ని, ఆంతరంగిక సభను, లేదా రహస్య ఆలోచనను సూచించగలదు. ఇక్కడ దేవుని అంతరంగ నిర్ణయాల్లో ప్రవేశం ఉన్నదనే వ్యంగ్య ప్రశ్నకు ‘ఆంతరంగిక సభ’ సహజంగా సరిపోతుంది; ఇతర భావసాధ్యతను పాదసూచికలో ఉంచాం.
- source_word: אֱלוֹהַ
  choice: దేవుని
  rationale: అయోబు గ్రంథంలో తరచుగా కనిపించే ఏకవచన దైవనామానికి ఆధునిక ప్రామాణిక తెలుగు సమానార్థకం.
- source_word: תִּשְׁמָע
  choice: నీవు విన్నావా
  rationale: שׁמע వినడం లేదా శ్రద్ధగా ఆలకించడం అనే భావాలు కలిగి ఉంది. సభ సందర్భంలో ‘విన్నావా’ సహజంగా ఉండి, అక్కడ జరిగిన మాటలను ఆలకించావా అనే భావాన్నీ మోస్తుంది.
- source_word: וְ/תִגְרַע
  choice: పరిమితం చేసుకున్నావా
  rationale: גרע తగ్గించడం, లోటు చేయడం, నిలిపివేయడం అనే అర్థాలు ఇస్తుంది. אֵלֶיךָతో కలిసి ఇక్కడ జ్ఞానం తనకే ప్రత్యేకమన్నట్లుగా దానిని తనకే పరిమితం చేసుకోవడం అనే సందర్భోచిత భావాన్ని తెలియజేస్తుంది.
- source_word: אֵלֶיךָ
  choice: నీకే
  rationale: దిశ లేదా సంబంధాన్ని తెలిపే ఉపసర్గకు ద్వితీయ పురుష ఏకవచన ప్రత్యయం జతైంది. ‘నీకే’ అనే రూపం ప్రత్యేక స్వాధీనత లేదా మినహాయింపు భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: חָכְמָה
  choice: జ్ఞానాన్ని
  rationale: חָכְמָהకు సాధారణమైన తెలుగు సమానార్థకం; ఇక్కడ ప్రత్యేక సాంకేతిక పదం కాకుండా జ్ఞానం లేదా వివేకాన్ని సూచిస్తుంది.
theological_decisions:
- issue: అయోబు గ్రంథంలోని వాదనలో దేవుని סוֹד అర్థం
  choice: దేవుని ‘ఆంతరంగిక సభ’గా అనువదించి, ఆయన అంతరంగ నిర్ణయసభలో పాల్గొన్నావా అనే ఎలీఫజు వ్యంగ్యాన్ని నిలిపాం.
  alternative: దేవుని రహస్యం; దేవుని రహస్య ఆలోచన/సలహా
  rationale: ఈ పదం కేవలం దాచిన సమాచారాన్ని మాత్రమే కాక, సన్నిహితమైన రహస్య సభను లేదా సంప్రదింపును కూడా సూచించగలదు. ప్రధాన పాఠంలో సభా చిత్రాన్ని నిలిపి, నిజమైన పదార్థ సందిగ్ధతను పాదసూచికలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన ప్రశ్నారూపాన్ని వాడాం. ఎలీఫజు పలికిన వ్యంగ్య సవాలును రెండు సమాంతర ప్రశ్నలుగా స్పష్టంగా ఉంచాం; మతశాఖాపరమైన వ్యాఖ్యానాన్ని చేర్చలేదు.
