id: JOB.15.31
reference: Job 15:31
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אַל יַאֲמֵ֣ן ב/שו נִתְעָ֑ה כִּי שָׁ֝֗וְא תִּהְיֶ֥ה תְמוּרָתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/015/031.yaml
  text: Let him not trust in emptiness[a], deceiving himself[c][b], for emptiness will be his recompense.
translation:
  language: te
  text: 'మోసపోయి[a] వ్యర్థమైనదానిపై[b] అతడు నమ్మకం పెట్టుకోకూడదు;

    ఎందుకంటే అతనికి ప్రతిఫలంగా దక్కేది వ్యర్థమే[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “దారితప్పి,” “తప్పుదారి పట్టించబడి.” హీబ్రూ పదం అతడు తనను తానే ఉద్దేశపూర్వకంగా మోసగించుకున్నాడని తప్పనిసరిగా చెప్పదు.
    reason: lexical_alternative
  - marker: b
    text: “వ్యర్థమైనది” అని అనువదించిన హీబ్రూ పదానికి “శూన్యమైనది,” “విలువలేనిది,” లేదా “అసత్యమైనది” అనే అర్థాలు కూడా ఉండవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: లేదా “ఎందుకంటే అతనికి బదులుగా లభించేది వ్యర్థమే.” ఈ పాదంలో మొదటి పాదంలోని అదే హీబ్రూ పదం మళ్లీ వస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל יַאֲמֵן
  choice: అతడు నమ్మకం పెట్టుకోకూడదు
  rationale: నిషేధార్థక אַל, అసంపూర్ణ క్రియారూపంతో కలిసి హెచ్చరికను తెలియజేస్తుంది; హిఫిల్ రూపమైన יַאֲמֵן ఇక్కడ ఒకదానిపై విశ్వాసం లేదా నమ్మకం ఉంచడాన్ని సూచిస్తుంది.
- source_word: בַשָּׁוְא
  choice: వ్యర్థమైనదానిపై
  rationale: שָׁוְא శూన్యత, వ్యర్థత, విలువలేనితనం లేదా అసత్యం అనే భావాలను ఇవ్వగలదు. సందర్భంలో నమ్మదగని, ఫలంలేని దానిని సహజమైన తెలుగులో తెలియజేయడానికి ఈ రూపం ఎంచుకోబడింది.
- source_word: נִתְעָה
  choice: మోసపోయి
  rationale: תעה ధాతువు నిఫల్ రూపం దారితప్పడం, తప్పుదారి పట్టించబడడం లేదా భ్రమపడడం అనే భావాలను కలిగి ఉంది. కర్త తనను తానే మోసగించుకుంటున్నాడని స్పష్టంగా చేర్చకుండా, మూలంలోని కర్మణి/స్థితి భావాన్ని ఈ ఎంపిక కాపాడుతుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందున్న హెచ్చరికకు కారణాన్ని పరిచయం చేస్తుంది.
- source_word: שָׁוְא
  choice: వ్యర్థమే
  rationale: మొదటి పాదంలోని שָׁוְא పదాన్ని భావపరంగా పునరావృతం చేసి, హీబ్రూ కవిత్వంలోని ప్రతిధ్వనిని నిలుపుతుంది.
- source_word: תִּהְיֶה תְמוּרָתוֹ
  choice: అతనికి ప్రతిఫలంగా దక్కేది
  rationale: תְּמוּרָה అనేది మార్పిడి, బదులు లేదా తిరిగి లభించేది అని అర్థమవుతుంది. ఇక్కడ అతడు పెట్టిన నమ్మకానికి చివరికి పొందే ఫలితాన్ని ఈ తెలుగు ప్రయోగం సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: נִתְעָה లో కర్త స్వయంగా తనను మోసగించుకుంటున్నాడా, లేక తప్పుదారి పట్టించబడ్డాడా?
  choice: మోసపోయి
  alternative: తనను తాను మోసగించుకొని / దారితప్పి
  rationale: మూల నిఫల్ రూపం ఉద్దేశపూర్వకమైన స్వీయ మోసాన్ని తప్పనిసరిగా నిర్ధారించదు. అందువల్ల వ్యాఖ్యానాన్ని బలవంతంగా నిర్ణయించకుండా దాని సందిగ్ధతను ప్రధాన పాఠం, పాదటిప్పణిలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన కవితా శైలిని వాడాం. “వ్యర్థమైనదానిపై / వ్యర్థమే” అనే పునరుక్తితో హీబ్రూ שָׁוְא పదపు కవితాత్మక ప్రతిధ్వనిని సాధ్యమైనంతవరకు నిలిపాం.
