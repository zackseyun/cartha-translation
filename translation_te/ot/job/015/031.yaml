  source_fidelity: 'The translation accurately represents the Hebrew warning: אַל יַאֲמֵן as a prohibition against placing trust, בַּשָּׁוְא as what is empty/worthless, נִתְעָה as being deceived or led astray without forcing an explicitly self-deceptive sense, and the repeated שָׁוְא in the resulting recompense. “ప్రతిఫలంగా దక్కేది” is a sound contextual rendering of תְּמוּרָתוֹ.'
