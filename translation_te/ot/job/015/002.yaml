translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరమైన శైలి వాడబడింది. పద్యంలోని అలంకారిక ప్రశ్న, గాలి రూపకం, కడుపు అనే స్పష్టమైన శరీరచిత్రం నిలుపబడ్డాయి.
