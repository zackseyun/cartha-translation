  text: הֶֽ/חָכָ֗ם יַעֲנֶ֥ה דַֽעַת ר֑וּחַ וִֽ/ימַלֵּ֖א קָדִ֣ים בִּטְנֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/015/002.yaml
  text: Should a wise man answer with windy knowledge[a], and fill his belly with the east wind?
translation:
  language: te
  text: 'జ్ఞాని గాలివంటి జ్ఞానంతో జవాబిస్తాడా?

    తన కడుపును తూర్పుగాలితో నింపుకుంటాడా?[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘గాలి జ్ఞానంతో’; అంటే సారంలేని, నిరర్థకమైన జ్ఞానంతో.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶחָכָם
  choice: జ్ఞాని
  rationale: ప్రశ్నార్థక הֲ తో కూడిన חָכָם అలంకారిక ప్రశ్నను ప్రారంభిస్తుంది. సందర్భంలో ఇది ఒక నిర్దిష్ట వ్యక్తిని సూచించకుండా, జ్ఞాని అని చెప్పుకొనే వ్యక్తిని సాధారణంగా సూచిస్తుంది.
- source_word: יַעֲנֶה
  choice: జవాబిచ్చి ... నింపుకోవాలా?
  rationale: అసంపూర్ణ క్రియారూపం ఇక్కడ తగినది లేదా ఆశించదగినది ఏమిటనే మందలింపు భావమున్న అలంకారిక ప్రశ్నలో ఉంది. తెలుగులో రెండు క్రియలను కలిపి చివర ‘నింపుకోవాలా?’ అని ప్రశ్నించడం సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: דַעַת רוּחַ
  choice: గాలివంటి జ్ఞానం
  rationale: ఈ నిర్మాణబంధం అక్షరార్థంగా ‘గాలి/ఆత్మ యొక్క జ్ఞానం.’ సందర్భంలో רוּחַ ‘గాలి’గా ఉండి, సారంలేని లేదా డాంబికమైన జ్ఞానాన్ని సూచిస్తుంది. ‘గాలివంటి జ్ఞానం’ రూపకాన్ని నిలుపుతూ తెలుగులో స్పష్టంగా ఉంటుంది.
- source_word: וִימַלֵּא
  choice: నింపుకోవాలా
  rationale: ఇది అలంకారిక ప్రశ్నను కొనసాగిస్తుంది. ‘నింపుకొను’ అనే ఆత్మనేపద రూపం తన కడుపును తానే నింపుకునే శరీరరూపకాన్ని సహజ తెలుగులో నిలుపుతుంది.
- source_word: קָדִים
  choice: తూర్పుగాలి
  rationale: קָדִים సాధారణంగా తూర్పునుంచి వీచే, తరచుగా వేడి మరియు హానికరమైన గాలిని సూచిస్తుంది. మూలంలోని స్పష్టమైన గాలి రూపకాన్ని అదనపు వివరణ లేకుండా నిలుపుతుంది.
- source_word: בִּטְנוֹ
  choice: తన కడుపును
  rationale: בֶּטֶן కు ఇక్కడ అక్షరార్థమైన ‘కడుపు’ సరిపోతుంది; గాలితో నిండిపోవడం అనే స్పష్టమైన శరీరరూపకాన్ని ఇది కాపాడుతుంది.
