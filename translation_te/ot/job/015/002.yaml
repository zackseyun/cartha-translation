    reason: lexical_alternative
  revision_rationale: The revision changes the participial sequence into two parallel rhetorical questions, preserving the Hebrew’s coordinated imperfect verbs and making the rebuke more direct in modern Telugu. The metaphorical wording and the lexical-alternative footnote are retained.
