  yaml_path: translation/ot/job/015/009.yaml
  text: What do you know that we do not know? What do you understand that is not with us?[a]
translation:
  language: te
  text: 'నీకు తెలిసి మాకు తెలియనిది ఏమిటి?

    నీవు గ్రహించి, మా దగ్గర లేనిది ఏమిటి?[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మాకు లేనిది.” హెబ్రీలో అక్షరార్థంగా, “అది మాతో లేదు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה יָדַעְתָּ
  choice: నీకు తెలిసి … ఏమిటి?
  rationale: מַה ప్రశ్నార్థక సర్వనామం; ידע పరిపూర్ణ రూపమైనా ఇక్కడ వర్తమాన భావమున్న అలంకారిక ప్రశ్న. తెలుగు సహజ వాక్యనిర్మాణంలో ‘నీకు తెలిసి … ఏమిటి?’ సంక్షిప్తతను, సవాలు చేసే ధోరణిని నిలుపుతుంది.
- source_word: וְלֹא נֵדָע
  choice: మాకు తెలియనిది
  rationale: మొదటి పురుష బహువచన నిషేధ క్రియను తెలుగులో సంబంధార్థక రూపంగా చెప్పడం సహజం; హెబ్రీ పాఠంలోని ‘నీకు—మాకు’ వ్యత్యాసం స్పష్టంగా ఉంటుంది.
- source_word: תָּבִין
  choice: నీవు గ్రహించి
  rationale: בין ఇక్కడ అర్థం చేసుకోవడం లేదా వివేచించడం అనే భావం ఇస్తుంది. ‘గ్రహించు’ సాధారణ ఆధునిక తెలుగులో ఈ జ్ఞానాత్మక భావాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: וְלֹא עִמָּנוּ הוּא
  choice: మా దగ్గర లేనిది
  rationale: అక్షరార్థంగా ‘అది మాతో లేదు.’ ‘మా దగ్గర లేదు’ అనే తెలుగు ప్రయోగం עִם లోని సమీపత/స్వాధీన భావాన్ని నిలుపుతూ సహజంగా ఉంటుంది; ‘మాకు లేనిది’ కూడా సాధ్యమే.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ఎలీఫజు వేసే రెండు సమాంతర అలంకారిక ప్రశ్నల సంక్షిప్తతను, సవాలు చేసే స్వరాన్ని కాపాడింది. ‘మా దగ్గర’ అనే సాధారణమైనప్పటికీ గౌరవప్రదమైన ప్రయోగం మూలంలోని ‘మాతో’ అనే అస్పష్ట స్వాధీన/సాన్నిధ్య భావాన్ని నిలుపుతుంది.
