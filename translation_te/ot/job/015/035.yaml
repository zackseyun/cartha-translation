  text: הָרֹ֣ה עָ֭מָל וְ/יָ֣לֹד אָ֑וֶן וּ֝/בִטְנָ֗/ם תָּכִ֥ין מִרְמָֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/job/015/035.yaml
  text: They conceive trouble and give birth to wickedness[a]; their womb prepares deceit.
translation:
  language: te
  text: వారు కష్టాన్ని గర్భంలో ధరించి, దుష్టత్వాన్ని కంటారు[a]; వారి గర్భం మోసాన్ని సిద్ధం చేస్తుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారు కష్టాన్ని గర్భంలో మోసి, అధర్మాన్ని కంటారు.”
    reason: הָרֹה మరియు אָוֶן పదాలకు సాధ్యమైన మరింత ప్రత్యక్షమైన పదప్రయోగాన్ని చూపే ప్రత్యామ్నాయ అనువాదం.
lexical_decisions:
- source_word: הָרֹה
  choice: గర్భం దాల్చి
  rationale: హרה క్రియలోని గర్భధారణ రూపకాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా నిలుపుతుంది.
- source_word: עָמָל
  choice: కష్టాన్ని
  rationale: జ్ఞానసాహిత్యంలో ఈ పదం శ్రమతో పాటు కలిగించే కష్టం, హాని, దుష్కార్య భావాలను సూచించగలదు; ఇక్కడ రూపకానికి సరిపోయే విస్తృత అర్థాన్ని నిలుపుతుంది.
- source_word: וְיָלֹד
  choice: కంటారు
  rationale: ילד యొక్క ప్రసవ భావాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేసి గర్భధారణ–ప్రసవ రూపకాన్ని కొనసాగిస్తుంది.
- source_word: אָוֶן
  choice: దుష్టత్వాన్ని
  rationale: ఈ సందర్భంలోని నైతిక దోష భావాన్ని తెలియజేస్తుంది; ‘అధర్మం’ అనే ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: וּבִטְנָם
  choice: వారి గర్భం
  rationale: בטן కు కడుపు/గర్భం అనే అర్థాలున్నాయి; కొనసాగుతున్న జనన రూపకం వల్ల ‘గర్భం’ సందర్భోచితం. ఏకవచన నామానికి బహువచన స్వామ్య ప్రత్యయం ఉన్న సమూహార్థాన్ని అలాగే ప్రతిబింబిస్తుంది.
- source_word: תָּכִין
  choice: సిద్ధం చేస్తుంది
  rationale: כון హిఫిల్ రూపంలోని సిద్ధపరచు/ఏర్పరచు భావాన్ని నేరుగా నిలుపుతుంది.
- source_word: מִרְמָה
  choice: మోసాన్ని
  rationale: మోసం లేదా వంచన అనే నైతిక భావాన్ని సాధారణ ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: అవ్యక్త కర్త యొక్క వచనం, లింగం
  choice: వారు ... వారి గర్భం
  alternative: అతడు ... అతని గర్భం; ఒకడు ... అతని గర్భం
  rationale: మొదటి రూపం హెబ్రీలో ఏకవచనంగా ఉన్నా, ‘వారి గర్భం’లోని తృతీయ పురుష బహువచన ప్రత్యయం మరియు దుష్టులను ఒక వర్గంగా వర్ణించే సందర్భం బహువచన సమూహార్థాన్ని సమర్థిస్తాయి.
- issue: ఆవెన్ (אָוֶן) యొక్క నైతిక అర్థ ఛాయ
  choice: దుష్టత్వం
  alternative: అధర్మం; చెడు; కష్టం
  rationale: మోసంతో ఉన్న సమాంతర నిర్మాణంలో నైతిక దోషాన్ని వ్యక్తం చేయడానికి ‘దుష్టత్వం’ అనుకూలం; అయినా ‘అధర్మం’ కూడా సముచితమైన అనువాదం కాబట్టి పాదటిప్పణిలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కవితాత్మక గౌరవాన్ని కాపాడుతూ సాధారణ పాఠకులకు అర్థమయ్యే పదాలు వాడాం. మూలంలోని గర్భధారణ–ప్రసవ రూపకాన్ని మూడు భాగాల్లోనూ నిలిపాం.
