  text: הֲ/רִאישׁ֣וֹן אָ֭דָם תִּוָּלֵ֑ד וְ/לִ/פְנֵ֖י גְבָע֣וֹת חוֹלָֽלְתָּ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/015/007.yaml
  text: Were you born as the first man[a], and were you brought forth before the hills?
translation:
  language: te
  text: 'మొట్టమొదటి మనిషిగా[a] నీవు పుట్టావా?

    కొండలకంటే ముందే నీవు జన్మించావా?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మొదటి మనిషియైన ఆదాముగా నీవు పుట్టావా?” హెబ్రీలో “మొట్టమొదటి మనిషి” అని ఉంది; అది ‘ఆదాము’ అనే పేరును స్పష్టంగా ఉపయోగించకపోయినా, అతనిని సూచిస్తూ ఉండవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: הֲ/רִאישׁוֹן אָדָם
  choice: మొట్టమొదటి మనిషిగా
  rationale: ప్రశ్నార్థక הֲ వ్యంగ్యార్థక ప్రశ్నను ప్రారంభిస్తుంది. רִאשׁוֹן కాలక్రమంలో మొదటివాడనే భావాన్ని ఇస్తుంది; אָדָם ఇక్కడ సహజంగా ‘మనిషి’ అని అర్థమవుతుంది. తెలుగులో విధేయార్థాన్ని ‘మనిషిగా’ సహజంగా వ్యక్తపరుస్తుంది.
- source_word: תִּוָּלֵד
  choice: నువ్వు పుట్టావా
  rationale: ילד ధాతువు నిఫల్ రూపం సాధారణంగా ‘పుట్టడం’ అని అర్థం. ఆధునిక తెలుగులో ఇది సహజమైన, ప్రత్యక్ష సమానార్థకం.
- source_word: וְ/לִ/פְנֵי גְבָעוֹת
  choice: కొండలకంటే ముందే
  rationale: לִפְנֵי కాలపరంగా ‘ముందు’ అని, גְבָעוֹת ‘కొండలు’ అని సూచిస్తాయి. ‘కంటే ముందే’ ఆదికాలపు ప్రాధాన్యాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: חוֹלָלְתָּ
  choice: నువ్వు జన్మించావా
  rationale: ఈ క్రియ ప్రసవం ద్వారా ఉనికిలోకి రావడం అనే భావాన్ని కలిగి ఉంది. మొదటి పాదంలోని ‘పుట్టావా’తో పదవైవిధ్యాన్ని ఉంచుతూ జనన రూపకాన్ని ‘జన్మించావా’ కాపాడుతుంది.
theological_decisions:
- issue: אָדָם ను వ్యక్తినామమైన ‘ఆదాము’గా చదవాలా, లేక సాధారణార్థంలో ‘మనిషి’గా చదవాలా
  choice: ‘మొట్టమొదటి మనిషి’ అనే సాధారణార్థం
  alternative: ‘మొట్టమొదటి వాడైన ఆదాము’ లేదా ‘ఆదాముగా’
  rationale: ఈ వాక్యం ఎలీఫజు వేసిన వ్యంగ్యార్థక ప్రశ్న; యోబు ఆదికాలం నుంచే ఉన్నవాడా అని సవాలు చేస్తుంది. హెబ్రీ పదబంధం ఆదామును సూచించే ప్రతిధ్వని కలిగి ఉండవచ్చు, కాని אָדָם ను ఇక్కడ తప్పనిసరిగా వ్యక్తినామంగా గుర్తించదు. అందువల్ల ప్రధాన పాఠంలో సాధారణార్థాన్ని ఉంచి, సాధ్యమైన సూచనను పాదటిప్పణిలో కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కవితా ప్రశ్నగా అనువదించాం. రెండు సమాంతర ప్రశ్నల నిర్మాణాన్ని నిలిపి, ילד మరియు חולל మధ్య స్వల్ప పదవైవిధ్యాన్ని ‘పుట్టావా / జన్మించావా’ ద్వారా ప్రతిబింబించాం.
