source:
  edition: WLC
  text: אַ֭ף כִּֽי נִתְעָ֥ב וְֽ/נֶאֱלָ֑ח אִישׁ שֹׁתֶ֖ה כַ/מַּ֣יִם עַוְלָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/015/016.yaml
  text: how much less a man who is detestable and corrupt[b][a], who drinks injustice like water!
translation:
  language: te
  text: అసహ్యకరుడూ కలుషితుడైన[a] మనిషి—నీళ్లలా అన్యాయాన్ని[b] తాగే అతడు—ఇంకెంత తక్కువ!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘మలినుడైన.’ హీబ్రూ נֶאֱלָח అరుదైన పదం; కలుషితమైన, అపవిత్రమైన లేదా జుగుప్సాకరమైన స్థితిని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘దుర్మార్గాన్ని,’ ‘అక్రమాన్ని.’
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף כִּי
  choice: ఇంకెంత తక్కువ!
  rationale: 'ముందటి వచనంలోని వాదనను బలపరిచే a fortiori భావాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది: దేవుని సమక్షంలో ఆకాశాలే పవిత్రం కాకపోతే, ఇలాంటి మనిషి మరెంత తక్కువ.'
- source_word: נִתְעָב
  choice: అసహ్యుడై
  rationale: నిఫాల్ రూపంలోని అసహ్యకరమైన, జుగుప్సాకరమైన స్థితిని బలంగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: נֶאֱלָח
  choice: కలుషితుడైన
  rationale: అరుదైన ఈ పదంలోని అపవిత్రత, మలినత, నైతిక చెడుదల భావాలను కలిపి తెలియజేస్తుంది; ప్రత్యామ్నాయంగా ‘మలినుడైన’ సాధ్యం.
- source_word: אִישׁ
  choice: మనిషి
  rationale: ఏకవచనంలోని ప్రతినిధి భావాన్ని నిలుపుతూ, ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: שֹׁתֶה
  choice: తాగే వాడు
  rationale: అసలు భాషలోని కృదంతం సూచించే అలవాటైన లేదా నిరంతర క్రియను సంబంధార్థక నిర్మాణంతో వ్యక్తపరుస్తుంది.
- source_word: כַמַּיִם
  choice: నీళ్లలా
  rationale: సులభంగా, తరచుగా, సహజంగా సేవించే దృశ్యాన్ని సాధారణ ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: עַוְלָה
  choice: అన్యాయాన్ని
  rationale: తప్పు, దుర్నీతి, నీతివిరుద్ధత అనే నైతిక బలాన్ని ప్రాచీన పదజాలం లేకుండా స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: אִישׁ లోని ప్రతినిధి పురుష ఏకవచనం
  choice: మనిషి
  alternative: ఒక పురుషుడు; మానవజాతి
  rationale: హీబ్రూ పదం వ్యాకరణపరంగా పురుష ఏకవచనమైనా, ఇక్కడ సాధారణ మానవునికి ప్రతినిధిగా వాడబడింది. ‘మనిషి’ మూలరూపపు ఏకవచనాన్ని, విస్తృత ప్రయోగాన్ని రెండింటినీ నిలుపుతుంది.
- issue: עַוְלָה అనే నైతిక పదం
  choice: అన్యాయం
  alternative: దుర్మార్గం; అక్రమం; అధర్మం
  rationale: మూలంలోని తప్పు, నీతివిరుద్ధత భావాన్ని స్పష్టంగా ఉంచి, తరువాతి మతపరమైన ప్రత్యేకార్థాలను అనవసరంగా దిగుమతి చేయదు.
- issue: אַף כִּי వాదనా దిశ
  choice: ఇంకెంత తక్కువ
  alternative: నిజంగా; ఇంకెంత ఎక్కువ
  rationale: 15వ వచనంతో సంబంధంలో ఇది మనిషి పవిత్రత లేదా ఆమోదయోగ్యతను మరింత తగ్గిస్తూ చెప్పే a fortiori వాదన. తెలుగులో ‘ఇంకెంత తక్కువ’ ఆ తార్కిక ఉద్వేగాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకుడికి అర్థమయ్యే శైలి. హీబ్రూ వాక్యంలోని తీవ్రతను, నీటిని తాగడం అనే రూపకాన్ని, ముందటి వచనంతో ఉన్న ‘ఇంకెంత తక్కువ’ తర్కాన్ని కాపాడింది. ప్రధాన పాఠంలో ప్రతి పాదటిప్పణి గుర్తు చేర్చబడింది.
