  yaml_path: translation/ot/job/015/032.yaml
  text: It will be paid in full before his time[b][a], and his branch will not stay green.
translation:
  language: te
  text: అతని దినం రాకముందే అది పూర్తవుతుంది[a]; అతని కొమ్మ[b] పచ్చగా ఉండదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతని దినం రాకముందే అది నిండుతుంది.” హీబ్రూ క్రియకు అక్షరార్థంగా “నిండుతుంది” లేదా “పూర్తవుతుంది” అనే భావం ఉంది; ఇక్కడ దాని ఖచ్చితమైన భావం వివాదాస్పదం.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “అతని తాటి ఆకుమట్ట” లేదా “అతని పై చిగురు.” హీబ్రూ పదం చెట్టు లేదా మొక్కలోని కొమ్మవంటి భాగాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּלֹא יוֹמוֹ
  choice: అతని సమయం రాకముందే
  rationale: అక్షరార్థంగా ‘అతని దినంలో కాకుండా’ అనే భావాన్ని సందర్భానుగుణంగా సహజమైన తెలుగులో ‘అతని సమయం రాకముందే’ అని ఇచ్చాం; ఇది అకాల పరిణామాన్ని సూచిస్తుంది.
- source_word: תִּמָּלֵא
  choice: అది పూర్తిగా చెల్లించబడుతుంది
  rationale: מלא నిఫాల్ రూపానికి ‘నిండుతుంది/పూర్తి అవుతుంది’ అనేది మూలభావం. ముందటి వచనంలోని ‘ప్రతిఫలం’తో సంబంధం ఉండవచ్చని భావించి ‘పూర్తిగా చెల్లించబడుతుంది’ అని ఇచ్చాం; అయితే ఆర్థిక భావం క్రియలో స్వతహాగా స్పష్టంగా లేనందున ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: כִפָּתוֹ
  choice: అతని కొమ్మ
  rationale: ఈ పదం మొక్కలోని కొమ్మ, తాటి మట్ట లేదా పై చిగురును సూచించవచ్చు. తరువాతి ‘పచ్చగా’ అనే వృక్షరూపకానికి సరిపోయే విస్తృత పదంగా ‘కొమ్మ’ను ఎంచుకున్నాం.
- source_word: לֹא רַעֲנָנָה
  choice: పచ్చగా ఉండదు
  rationale: רענן మొక్కల తాజాదనం, పచ్చదనం లేదా ఏపుదనాన్ని సూచిస్తుంది. రూపకాన్ని స్పష్టంగా నిలుపుతూ సహజమైన తెలుగులో ‘పచ్చగా ఉండదు’ అని అనువదించాం.
theological_decisions:
- issue: תִּמָּלֵא క్రియకు ప్రతిఫలం చెల్లించబడటం అనే భావమా, లేక సాధారణంగా పూర్తికావడమా?
  choice: అది పూర్తిగా చెల్లించబడుతుంది
  alternative: అది పూర్తవుతుంది
  rationale: మునుపటి వచనంలోని ‘ప్రతిఫలం’ ఈ స్త్రీలింగ క్రియకు సూచ్యంగా ఉండవచ్చు; అందువల్ల ప్రధాన పాఠ్యంలో చెల్లింపు భావాన్ని ఉంచాం. అయినా క్రియ యొక్క మూలార్థం సాధారణ ‘నిండటం/పూర్తికావటం’ కావడంతో ఆ అనిశ్చితిని పాదసూచికలో పరిరక్షించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గంభీరమైన కానీ సహజమైన శైలిని వాడాం. వృక్షరూపకాన్ని నిలిపి, హీబ్రూ క్రియలోని నిజమైన అర్థసందిగ్ధతను పాదసూచికలో స్పష్టంగా తెలిపాం.
