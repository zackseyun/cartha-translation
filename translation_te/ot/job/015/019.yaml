  text: לָ/הֶ֣ם לְ֭/בַדָּ/ם נִתְּנָ֣ה הָ/אָ֑רֶץ וְ/לֹא עָ֖בַר זָ֣ר בְּ/תוֹכָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/015/019.yaml
  text: To them alone the land was given[b][a], and no stranger passed among them.
translation:
  language: te
  text: వారికే ఆ దేశం[a] ఇవ్వబడింది; వారి మధ్యన ఏ పరదేశీయుడూ వెళ్లలేదు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ఆ భూమి’ అని కూడా అనువదించవచ్చు. హీబ్రూ אֶרֶץ అనే పదానికి ‘దేశం,’ ‘భూమి’ అనే రెండు అర్థాలూ రావచ్చు; ఇక్కడ ఒక ప్రజకు ప్రత్యేకంగా ఇవ్వబడిన ప్రాంతం గురించి చెబుతున్నందున ‘దేశం’ అని అనువదించబడింది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘ఏ విదేశీయుడూ వారి మధ్యన దాటివెళ్లలేదు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: לָהֶם לְבַדָּם
  choice: వారికే
  rationale: లָהֶםలోని గ్రహీత భావాన్నీ, לְבַדָּםలోని ప్రత్యేకతను సూచించే భావాన్నీ సహజమైన తెలుగు నొక్కిచెప్పే ‘వారికే’ సమగ్రంగా తెలియజేస్తుంది.
- source_word: נִתְּנָה
  choice: ఇవ్వబడింది
  rationale: నిఫాల్ రూపంలోని కర్మణి ప్రయోగాన్ని నిలుపుతుంది.
- source_word: הָאָרֶץ
  choice: ఆ దేశం
  rationale: אֶרֶץకు ‘భూమి’ లేదా ‘దేశం’ అనే అర్థాలు ఉండవచ్చు; ఒక ప్రజకు ప్రత్యేకంగా ఇవ్వబడిన ప్రాంతం, బయటి వ్యక్తులు ప్రవేశించకపోవడం అనే సందర్భంలో ‘దేశం’ సహజంగా సరిపోతుంది.
- source_word: זָר
  choice: పరదేశి
  rationale: సమూహానికి చెందని బయటి వ్యక్తి అనే భావాన్ని గౌరవప్రదమైన, కవితాత్మక తెలుగులో వ్యక్తం చేస్తుంది; జాతి లేదా పౌరసత్వాన్ని అనవసరంగా నిర్దిష్టం చేయదు.
- source_word: עָבַר בְּתוֹכָם
  choice: వారి మధ్యగా ... వెళ్లలేదు
  rationale: עָבַרలోని దాటివెళ్లే చలన భావాన్నీ, בְּתוֹכָםలోని ‘వారి మధ్యలో’ అనే స్థాన భావాన్నీ సహజమైన తెలుగులో నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కవితాత్మక శైలి. ‘వారికే’ ద్వారా మూలంలోని ప్రత్యేకతకు నొక్కు ఇవ్వబడింది; కర్మణి ప్రయోగం నిలుపబడింది. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
