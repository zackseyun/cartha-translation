- from: వారికే ఆ దేశం ఇవ్వబడింది[a]; వారి మధ్యగా పరదేశి ఎవడూ వెళ్లలేదు[b].
  to: వారికే ఆ దేశం[a] ఇవ్వబడింది; వారి మధ్యన ఏ పరదేశీయుడూ వెళ్లలేదు[b].
  rationale: The revision relocates footnote a to ‘దేశం,’ the term addressed by that note. It makes a minor stylistic improvement to the locative phrase and revises footnote b so that its alternative retains the Hebrew verb’s sense of passing through. The verse’s ambiguity between ‘land’ and ‘earth’ remains in the footnote.
