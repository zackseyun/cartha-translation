  text: גַּם שָׂ֣ב גַּם יָשִׁ֣ישׁ בָּ֑/נוּ כַּבִּ֖יר מֵ/אָבִ֣י/ךָ יָמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/015/010.yaml
  text: Both the gray-haired and the aged are among us[a], older in days than your father.
translation:
  language: te
  text: మా మధ్య నెరిసినవారూ, ముదిమి చెందినవారూ ఉన్నారు; వారు నీ తండ్రికంటే ఎక్కువ వయసుగలవారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “దినాల విషయంలో నీ తండ్రికంటే గొప్పవారు”; సందర్భంలోని భావం “నీ తండ్రికంటే ఎక్కువ వయసుగలవారు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם ... גַּם
  choice: నెరిసినవారూ, ముదిమి చెందినవారూ
  rationale: పునరుక్త גַּם రెండు వర్గాలను జతచేసి నొక్కిచెబుతుంది; తెలుగులో ‘-ఊ ... -ఊ’ నిర్మాణం ఆ జోడింపు భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: שָׂב
  choice: నెరిసినవారు
  rationale: వృద్ధాప్యంతోపాటు నెరిసిన జుట్టు అనే స్పష్టమైన చిత్రాన్ని ఈ పదం సూచిస్తుంది; దానిని ‘నెరిసినవారు’ నిలుపుతుంది.
- source_word: יָשִׁישׁ
  choice: ముదిమి చెందినవారు
  rationale: అత్యంత వృద్ధాప్యాన్ని సూచించే సమాంతర పదంగా, మొదటి పదంతో ఉన్న తేడాను సాధ్యమైనంతవరకు నిలుపుతుంది.
- source_word: בָּנוּ
  choice: మా మధ్య ... ఉన్నారు
  rationale: בְּ + మొదటి పురుష బహువచన ప్రత్యయం ఇక్కడ ఎలీఫజు వర్గంలో లేదా వారి సమాజంలో ఉన్నారనే సామాజిక-స్థానిక భావాన్ని ఇస్తుంది.
- source_word: כַּבִּיר
  choice: ఎక్కువ వయసుగలవారు
  rationale: మూలార్థం ‘గొప్ప/బలమైన’ అయినా, מן తో పోలికగా మరియు ‘దినాలు’ అనే పరిమితితో ఇక్కడ వయసులో మించినవారు అనే భావం వస్తుంది.
- source_word: מֵאָבִיךָ יָמִים
  choice: నీ తండ్రికంటే ఎక్కువ వయసుగలవారు
  rationale: ‘నీ తండ్రికంటే దినాలలో గొప్పవారు’ అనే హీబ్రూ నుడికారాన్ని సహజమైన ఆధునిక తెలుగులో వయసు పోలికగా అందిస్తుంది.
