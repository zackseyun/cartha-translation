source:
  edition: WLC
  text: הַ/מְעַ֣ט מִ֭מְּ/ךָ תַּנְחֻמ֣וֹת אֵ֑ל וְ֝/דָבָ֗ר לָ/אַ֥ט עִמָּֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/015/011.yaml
  text: Are the consolations of God too small for you[a], or a word spoken gently to you?
translation:
  language: te
  text: దేవుని ఆదరణలు నీకు అల్పమైనవా[a]? నీతో మృదువుగా పలికిన మాట కూడా అల్పమైనదా?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దేవుని ఓదార్పులు నీకు చాలా స్వల్పమైనవా, నీతో మృదువుగా పలికిన మాటా?”
    reason: הַמְעַט కు ‘చాలా స్వల్పమైనవా’ అనే ప్రత్యామ్నాయ వ్యక్తీకరణను, וְ యొక్క సముచ్చయ నిర్మాణాన్ని మరింత దగ్గరగా చూపిస్తుంది.
lexical_decisions:
- source_word: הַמְעַט
  choice: అల్పమైనవా / అల్పమైనదా
  rationale: ప్రశ్నార్థక הַ తో מְעַט కలసి ‘అల్పమా?’ అనే నిందార్థక ప్రశ్నను ఏర్పరుస్తుంది. తెలుగులో రెండవ భాగంలో క్రియను పునరుక్తి చేయడం భావాన్ని సహజంగా, స్పష్టంగా ఉంచుతుంది.
- source_word: מִמְּךָ
  choice: నీకు
  rationale: ఈ నిర్మాణంలో מִן అక్షరార్థమైన ‘నుండి’ కంటే, సంబోధితునికి సంబంధించి ‘నీకు అల్పమా?’ అనే భావాన్ని ఇస్తుంది.
- source_word: תַּנְחֻמוֹת
  choice: ఆదరణలు
  rationale: נחם మూలం నుంచి వచ్చిన బహువచన నామవాచకం ఓదార్చే మాటలు లేదా కార్యాలను సూచిస్తుంది; ‘ఆదరణలు’ బహువచనాన్ని, గంభీరతను నిలుపుతుంది.
- source_word: אֵל
  choice: దేవుని
  rationale: ఇక్కడ אֵל దేవుణ్ణి సూచించే దైవనామం; షష్ఠీ సంబంధాన్ని తెలుగులో ‘దేవుని’గా సహజంగా వ్యక్తం చేశాం.
- source_word: וְדָבָר
  choice: మాట కూడా
  rationale: דָבָר కు ప్రసంగ సందర్భంలో ‘మాట’ సరిపోతుంది. וְ ను తప్పనిసరిగా వికల్పార్థక ‘లేదా’గా నిర్ణయించకుండా, సముచ్చయ భావాన్ని ‘కూడా’తో నిలిపాం.
- source_word: לָאַט
  choice: మృదువుగా పలికిన
  rationale: לָאַט నెమ్మది లేదా మృదుత్వాన్ని సూచిస్తుంది. తెలుగులో ‘మృదువుగా ఉన్న మాట’ కంటే ‘మృదువుగా పలికిన మాట’ సహజం; పలకడం మూలపాఠంలో అంతర్లీనంగా ఉంది.
- source_word: עִמָּךְ
  choice: నీతో
  rationale: עִם యొక్క ప్రాథమిక సహవాసార్థమైన ‘తో’ను నిలుపుతూ, మాటల సందర్భంలో సహజమైన ‘నీతో ... పలికిన’ నిర్మాణాన్ని వాడాం.
