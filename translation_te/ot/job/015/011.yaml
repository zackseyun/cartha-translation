translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనా సాధారణ పాఠకులకు అర్థమయ్యే శైలిని వాడాం. హెబ్రీ సముచ్చయమైన וְ ను ‘లేదా’గా నిర్బంధించకుండా ‘కూడా’గా అనువదించి అస్పష్టతను కాపాడాం; లింగ-వచన భేదం వల్ల తెలుగులో ప్రశ్నను రెండో భాగంలో పునరుక్తి చేశాం.
