  terminology: ‘దేవుని,’ ‘ఆదరణలు,’ ‘మృదువుగా,’ ‘మాట’ అన్న పదప్రయోగాలు సందర్భానుకూలంగా ఉన్నాయి. ‘ఆదరణలు’ נחם-సంబంధిత బహువచనానికి తగిన గంభీరమైన పదం; దీనికి పాదటిప్పణిలో ‘ఓదార్పులు’ ప్రత్యామ్నాయం కూడా సముచితంగా ఇవ్వబడింది.
