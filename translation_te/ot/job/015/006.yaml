translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, న్యాయపరమైన రూపకాన్ని నిలుపుతూ సాధారణ పాఠకులకు సహజంగా అర్థమయ్యే గౌరవప్రదమైన శైలి వాడబడింది. ‘నోరే/పెదవులే’ అనే రూపాలు మూలంలోని స్వీయ-ఆరోపణ ఉద్ఘాటనను తెలుగులో సహజంగా తెలియజేస్తాయి.
