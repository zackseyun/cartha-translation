  yaml_path: translation/ot/job/015/006.yaml
  text: Your own mouth condemns you[a], and not I; your own lips testify against you.
translation:
  language: te
  text: నీ నోరే నిన్ను దోషిగా నిర్ధారిస్తోంది, నేను కాదు; నీ పెదవులే నీకు వ్యతిరేకంగా సాక్ష్యం చెబుతున్నాయి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీ పెదవులే నీకు వ్యతిరేకంగా ప్రత్యుత్తరం ఇస్తున్నాయి.” హీబ్రూ క్రియకు మరింత అక్షరార్థంగా “ప్రత్యుత్తరం ఇవ్వడం” అని అర్థం రావచ్చు; ఇక్కడ అది సాక్ష్యమిచ్చే భావాన్ని కలిగి ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַרְשִׁיעֲךָ
  choice: నిన్ను దోషిగా తీర్పుతీరుస్తోంది
  rationale: רשע ధాతువు హిఫీల్ రూపంలో ఒకరిని దోషిగా ప్రకటించడం లేదా ఖండించడం అనే న్యాయపరమైన భావాన్ని ఇస్తుంది. ఈ సందర్భంలో యోబు మాటలే అతనిని దోషిగా నిలుపుతున్నాయనే భావం స్పష్టంగా వస్తుంది.
- source_word: פִיךָ
  choice: నీ నోరే
  rationale: మూలంలో ‘నీ నోరు.’ తెలుగు ‘ఏ’ నిశ్చయార్థక ప్రత్యయం, ‘నేను కాదు’ అనే తరువాతి వ్యతిరేకతను సహజంగా బలపరుస్తుంది.
- source_word: וְלֹא אָנִי
  choice: నేను కాదు
  rationale: మాట్లాడుతున్న ఎలీఫజు తన తీర్పుకూ యోబు సొంత మాటల తీర్పుకూ మధ్య ఉంచిన ప్రత్యక్ష వ్యత్యాసాన్ని సంక్షిప్తంగా కాపాడుతుంది.
- source_word: וּשְׂפָתֶיךָ
  choice: నీ పెదవులే
  rationale: ‘నీ పెదవులు’ అనే మూలార్థాన్ని నిలుపుతూ, మొదటి పాదంలోని ‘నీ నోరే’తో సమాంతరమైన ఉద్ఘాటనను ఇస్తుంది.
- source_word: יַעֲנוּ
  choice: సాక్ష్యమిస్తున్నాయి
  rationale: ענה సాధారణంగా ‘జవాబివ్వడం’ అని అర్థమైనా, ఇక్కడ ఒకరి మాటలే అతనికి వ్యతిరేక సాక్ష్యంగా నిలిచే న్యాయపరమైన సందర్భం ఉంది. ‘సాక్ష్యమిస్తున్నాయి’ ఆ భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; మరింత అక్షరార్థమైన ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: בָךְ
  choice: నీకు వ్యతిరేకంగా
  rationale: ఈ న్యాయపరమైన సందర్భంలో בְ ప్రత్యర్థక భావంతో, యోబు మాటలు అతనికే వ్యతిరేకంగా నిలుస్తున్నాయని సూచిస్తుంది.
