source:
  edition: WLC
  text: כִּֽי עֲדַ֣ת חָנֵ֣ף גַּלְמ֑וּד וְ֝/אֵ֗שׁ אָכְלָ֥ה אָֽהֳלֵי שֹֽׁחַד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/015/034.yaml
  text: For the company of the godless is barren[b][a], and fire consumes the tents of bribery.
translation:
  language: te
  text: ఎందుకంటే భక్తిహీనుల సమూహం ఫలించనిది[a]; లంచపు గుడారాలను అగ్ని దహిస్తుంది[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కపటుల సమూహం ఫలించనిది.” హెబ్రీ పదం కపటుడిని సూచించగలదు; అయితే యోబు గ్రంథంలో అది తరచుగా విస్తృతంగా భక్తిహీనుడిని లేదా దైవభక్తిలేని వ్యక్తిని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “లంచపు గుడారాలు” లేదా “లంచం యొక్క గుడారాలు.” ఈ మాట లంచం లేదా అవినీతి లాభంతో ముడిపడిన నివాసాలను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి వాక్యానికి కారణం లేదా వివరణను పరిచయం చేసే అనుసంధానంగా తీసుకున్నాం.
- source_word: עֲדַת חָנֵף
  choice: భక్తిహీనుల సమూహం
  rationale: עֲדַת అనేది సమూహాన్ని సూచిస్తుంది; חָנֵף యోబు గ్రంథంలో సాధారణంగా దేవునిపట్ల భక్తిలేని, దుష్ట స్వభావాన్ని తెలియజేస్తుంది. హెబ్రీ ఏకవచనానికి ఇక్కడ సమూహార్థం ఉంది.
- source_word: גַּלְמוּד
  choice: నిష్ఫలంగా ఉంటుంది
  rationale: సంతానం లేదా ఫలం లేని, ఉత్పాదకత కోల్పోయిన స్థితిని సూచించే రూపకాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: וְאֵשׁ
  choice: అగ్ని
  rationale: రెండవ సమాంతర వాక్యాన్ని కలుపుతూ హెబ్రీలోని స్పష్టమైన అగ్ని చిత్రాన్ని నిలుపుతుంది.
- source_word: אָכְלָה
  choice: దహిస్తుంది
  rationale: హెబ్రీ ఖాతల్ రూపాన్ని జ్ఞానసాహిత్యంలోని సాధారణ సత్యార్థక వర్తమానంగా గ్రహించాం; అగ్ని సందర్భంలో 'దహిస్తుంది' సహజంగా ఉంటుంది.
- source_word: אָהֳלֵי
  choice: గుడారాలను
  rationale: మూలంలోని నిర్దిష్ట ప్రాచీన సమీప ప్రాచ్య చిత్రాన్ని 'నివాసాలు' అని సాధారణీకరించకుండా నిలుపుతుంది.
- source_word: שֹׁחַד
  choice: లంచంతో సంపాదించినవారి
  rationale: అక్షరార్థంగా 'లంచపు గుడారాలు' అనే సంక్షిప్త నిర్మాణం తెలుగులో అసహజంగా ఉంటుంది. అవినీతి లాభంతో గుర్తింపబడిన నివాసాల భావాన్ని వ్యక్తం చేస్తుంది; అయితే 'వారి' అనే సూచన మూలంలోని అంతర్లీన సంబంధాన్ని స్పష్టం చేస్తుంది.
theological_decisions:
- issue: חָנֵף యొక్క నైతిక-మతపరమైన భావం
  choice: భక్తిహీనులు
  alternative: కపటులు
  rationale: యోబు గ్రంథంలో ఈ పదం కేవలం సామాజిక కపటత్వం కంటే విస్తృతమైన దేవభక్తిలేమి లేదా దుష్టత్వాన్ని తరచుగా సూచిస్తుంది; ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గంభీరమైన జ్ఞానసాహిత్య శైలిని వాడాం. సమాంతర నిర్మాణం, అగ్ని-గుడారాల దృశ్యరూపం నిలుపబడ్డాయి; అసహజమైన హెబ్రీ సంబంధ నిర్మాణాన్ని స్వల్పంగా సహజీకరించాం.
