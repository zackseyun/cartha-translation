id: JOB.15.30
reference: Job 15:30
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: לֹֽא יָס֨וּר מִנִּי חֹ֗שֶׁךְ יֹֽ֭נַקְתּ/וֹ תְּיַבֵּ֣שׁ שַׁלְהָ֑בֶת וְ֝/יָס֗וּר בְּ/ר֣וּחַ פִּֽי/ו־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/015/030.yaml
  text: He will not depart from darkness[a]; a flame will dry up his shoots[b], and by the breath of his mouth he will pass away.
translation:
  language: te
  text: అతడు చీకటి నుండి బయటపడడు; జ్వాల అతని లేత చిగురును[b] ఎండబెడుతుంది; తన నోటి ఊపిరివల్ల అతడు గతించిపోతాడు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, చివరి పదబంధంలోని ‘తన’ దేవుణ్ణి సూచిస్తే, “ఆయన నోటి ఊపిరివల్ల అతడు గతించిపోతాడు.”
    reason: alternative_reading
  - marker: b
    text: “లేత చిగురు” మొక్కకు సంబంధించిన రూపకం. దుష్టుడు ఒక చెట్టులా చిత్రించబడ్డాడు; దాని కొత్త పెరుగుదలను జ్వాల మాడ్చి ఎండబెడుతుంది.
    reason: cultural_note
lexical_decisions:
- source_word: יָסוּר ... מִנִּי חֹשֶׁךְ
  choice: చీకటి నుండి బయటపడడు
  rationale: סור מן అనే నిర్మాణం చీకటి లేదా విపత్తు నుండి తొలగిపోవడం, తప్పించుకోవడం అనే భావాన్ని ఇస్తుంది. ‘బయటపడడు’ ఆధునిక తెలుగులో సహజంగా ఉండి, అతడు ఆ చీకటి నుండి తప్పించుకోలేడనే భావాన్ని తెలియజేస్తుంది.
- source_word: יֹנַקְתּוֹ
  choice: అతని లేత చిగురును
  rationale: ఈ నామవాచకం మొక్క నుండి కొత్తగా వచ్చే చిగురు లేదా లేత కొమ్మను సూచిస్తుంది. ఏకవచన రూపాన్ని నిలుపుతూ చెట్టు రూపకాన్ని స్పష్టంగా తెలియజేయడానికి ‘లేత చిగురు’ ఎంచుకోబడింది.
- source_word: תְּיַבֵּשׁ שַׁלְהָבֶת
  choice: జ్వాల ... ఎండబెడుతుంది
  rationale: יבש పియేల్ రూపంలో ‘ఎండబెట్టు, వాడగొట్టు’ అని, שלהבת ‘జ్వాల’ అని అర్థం. ఈ పదప్రయోగం అగ్ని వల్ల మొక్క చిగురు ఎండిపోయే తీర్పు చిత్రాన్ని నిలుపుతుంది.
- source_word: וְיָסוּר
  choice: అతడు గతించిపోతాడు
  rationale: ఇక్కడ రెండవ סור దుష్టుడు తొలగించబడటం లేదా నశించిపోవడాన్ని సూచించే అవకాశం ఉంది. ‘గతించిపోతాడు’ మరణం లేదా అంతరించిపోవడం అనే ఫలితాన్ని సహజ తెలుగులో తెలియజేస్తూ, మరీ నిర్దిష్టంగా ‘చనిపోతాడు’ అని పరిమితం చేయదు.
- source_word: בְּרוּחַ פִּיו
  choice: తన నోటి ఊపిరివల్ల
  rationale: רוּחַ కు ఊపిరి, గాలి, ఆత్మ అనే అర్థాలు ఉండవచ్చు. ‘నోటి’తో కలిసి ఉన్నందున ‘ఊపిరి’ ప్రత్యక్షమైన అర్థం; అది ఎవరి నోరో అన్న సందిగ్ధతను పాదసూచికలో నిలిపాం.
- source_word: פִּיו
  choice: తన నోటి
  rationale: మూడవ పురుష ఏకవచన ప్రత్యయం సమీప వ్యాకరణ పూర్వపదమైన దుష్టుణ్ణి సూచిస్తున్నట్లు ప్రధాన పాఠం తీసుకుంటుంది. అయితే దేవుని నోరు అనే సాధ్యమైన పఠనాన్ని పాదసూచికలో ఇచ్చాం.
theological_decisions:
- issue: చివరి పదబంధంలోని ‘అతని నోరు’ ఎవరిది?
  choice: దుష్టుని నోరు
  alternative: దేవుని నోరు
  rationale: తక్షణ వ్యాకరణ సందర్భంలో ఏకవచన దుష్టుడే సమీప సూచితుడు. అయినా ‘నోటి ఊపిరి’ దైవిక తీర్పును కూడా సూచించగలదు; కాబట్టి ఆ పఠనాన్ని తొలగించకుండా పాదసూచికలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం ఉపయోగించబడింది. మొక్క రూపకాన్ని నిలిపి, చివరి సర్వనామ సూచనలోని నిజమైన సందిగ్ధతను పాదసూచిక ద్వారా భద్రపరిచాం.
