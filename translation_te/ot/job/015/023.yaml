  terminology: ‘రొట్టె,’ ‘చీకటి దినం,’ and ‘సిద్ధంగా ఉంది’ appropriately retain the lexical imagery and do not impose an interpretation such as judgment or destruction. Footnotes correctly identify the broader food sense, supplied connective wording, and the literal ‘in his hand’ expression.
