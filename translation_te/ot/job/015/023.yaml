  text: נֹ֘דֵ֤ד ה֣וּא לַ/לֶּ֣חֶם אַיֵּ֑ה יָדַ֓ע כִּֽי נָכ֖וֹן בְּ/יָד֣/וֹ יֽוֹם חֹֽשֶׁךְ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/015/023.yaml
  text: He wanders about for bread[a], saying[b], ‘Where is it?’ He knows that a day of darkness is ready at hand for him.
translation:
  language: te
  text: అతడు రొట్టె[a] కోసం, “అది ఎక్కడ?” అంటూ[b] తిరుగుతుంటాడు. చీకటి దినం అతనికి సమీపంలోనే సిద్ధంగా ఉందని[c] అతనికి తెలుసు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ‘రొట్టె’; ఈ పదం ఆహారాన్ని సాధారణంగా కూడా సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ వాక్యనిర్మాణం సంక్షిప్తంగా, ‘అతడు రొట్టె కోసం తిరుగుతాడు—ఎక్కడ?’ అన్నట్లుగా ఉంది. సహజమైన తెలుగు కోసం ‘అది,’ ‘అంటూ’ అనే మాటలు చేర్చబడ్డాయి.
    reason: supplied_words
  - marker: c
    text: అక్షరార్థంగా ‘అతని చేతిలో సిద్ధంగా ఉంది’; ఇక్కడ అది అతనికి సమీపంలో ఉందనే భావం కావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹדֵד
  choice: తిరుగుతుంటాడు
  rationale: נדד అనే క్రియారూపం నిలకడలేక కొనసాగుతూ తిరగడాన్ని సూచిస్తుంది. ‘తిరుగుతుంటాడు’ ఆ నిరంతర, అశాంతమైన చర్యను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; అతడు ప్రవాసి అని అదనంగా నిర్ధారించదు.
- source_word: לַלֶּחֶם
  choice: రొట్టె కోసం
  rationale: לֶחֶם యొక్క ప్రత్యక్ష అర్థం ‘రొట్టె’; సందర్భానుసారంగా అది ఆహారాన్ని సాధారణంగా కూడా సూచించగలదు. మూలంలోని స్పష్టమైన రూపకల్పనను ప్రధాన పాఠంలో ఉంచి, విస్తృత అర్థాన్ని పాదసూచికలో తెలిపాం.
- source_word: אַיֵּה
  choice: అది ఎక్కడ?
  rationale: ప్రశ్నార్థక పదానికి ‘ఎక్కడ?’ అని అర్థం. సహజమైన తెలుగు వాక్యం కోసం ముందు చెప్పిన రొట్టెను సూచించే ‘అది’ చేర్చబడింది.
- source_word: יָדַע
  choice: అతనికి తెలుసు
  rationale: ידע యొక్క సాధారణ అర్థమైన స్థిరమైన అవగాహనను నేరుగా తెలియజేస్తుంది.
- source_word: נָכוֹן
  choice: సిద్ధంగా ఉంది
  rationale: ఈ రూపం సిద్ధపరచబడినది లేదా సిద్ధంగా ఉన్నది అనే భావాన్ని ఇస్తుంది. రాబోయే చీకటి దినం తప్పించుకోలేనంత దగ్గరగా ఉందనే సందర్భానికి ఇది సరిపోతుంది.
- source_word: בְּיָדוֹ
  choice: తనకు అతి సమీపంలోనే
  rationale: అక్షరార్థంగా ‘అతని చేతిలో’ అయినా, ఇక్కడ ఆ దినం అతని మీదికి వచ్చేందుకు దగ్గరగా, అందుబాటులో ఉన్నదనే భావం సంభవిస్తుంది. ‘అతి సమీపంలోనే’ తెలుగులో ఆ సమీపత్వాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: יוֹם חֹשֶׁךְ
  choice: చీకటి దినం
  rationale: చీకటితో లక్షణీకరించబడిన దినం అనే హీబ్రూ ప్రతీకను నిలుపుతుంది; దానిని విపత్తు, తీర్పు లేదా వినాశనం అని ప్రధాన పాఠంలోనే నిర్దిష్టీకరించదు.
theological_decisions:
- issue: ‘చీకటి దినం’ అనే మాటలోని రూపకాలంకార భావం
  choice: చీకటి దినం
  alternative: విపత్తు దినం / వినాశన దినం / తీర్పు దినం
  rationale: ఎలీఫజు మాటల సందర్భంలో ఇది దుష్టునికి రాబోయే ఆపదను సూచించవచ్చు. అయితే హీబ్రూ పదబంధం దానిని దైవిక తీర్పు అని స్పష్టంగా నిర్వచించకుండా ప్రతీకాత్మకంగా ఉంచుతుంది. అందువల్ల ఆ వేదాంతపరమైన ఉద్విగ్నతను పరిష్కరించకుండా మూల ప్రతీకనే నిలిపాం.
- issue: בְּיָדוֹ ద్వారా సూచించబడే సమీపత్వం
  choice: తనకు అతి సమీపంలోనే
  alternative: తన చేతిలోనే
  rationale: అక్షరార్థ రూపం తెలుగులో ఆ దినాన్ని అతడు నియంత్రిస్తున్నాడనే తప్పుదారి పట్టించే భావం ఇవ్వవచ్చు. సందర్భంలో ప్రధానంగా కనిపించే ఆసన్నతను వ్యక్తం చేస్తూ, అక్షరార్థాన్ని పాదసూచికలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సామాన్య పాఠకులకు అర్థమయ్యేలా, అయినా గంభీరతను నిలుపుతూ అనువదించబడింది. ‘తిరుగుతుంటాడు’ కొనసాగుతున్న అశాంత సంచారాన్ని, ‘చీకటి దినం’ మూలంలోని కవితాత్మక ప్రతీకను కాపాడుతాయి. మూలంలో లేని కానీ తెలుగులో స్పష్టతకు అవసరమైన మాటలను పాదసూచికలో వెల్లడించాం.
