  edition: WLC
  text: הֵ֣ן ב/קדש/ו לֹ֣א יַאֲמִ֑ין וְ֝/שָׁמַ֗יִם לֹא זַכּ֥וּ בְ/עֵינָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/015/015.yaml
  text: Look[a], he puts no trust even in his holy ones, and the heavens are not pure in his eyes.
translation:
  language: te
  text: 'ఇదిగో, ఆయన తన పరిశుద్ధులనైనా నమ్మకం ఉంచడు;

    ఆయన దృష్టిలో ఆకాశాలు కూడా నిర్మలమైనవి కావు.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֵן
  choice: ఇదిగో
  rationale: వాక్యంపై బలంగా దృష్టి నిలిపే హీబ్రూ సంభాషణ సూచకాన్ని గౌరవప్రదమైన, సహజమైన ఆధునిక తెలుగు రూపంలో అందిస్తుంది.
- source_word: בִּקְדֹשָׁיו
  choice: తన పరిశుద్ధులనైనా
  rationale: అక్షరార్థమైన ‘ఆయన పరిశుద్ధులు’ అనే విస్తృత భావాన్ని నిలుపుతుంది; సమాంతరంగా వచ్చే ‘ఆకాశాలు’ కారణంగా పరలోక జీవులు ఉద్దేశించబడి ఉండవచ్చు, కాని ప్రధాన పాఠం దానిని అతిగా నిర్దిష్టం చేయదు.
- source_word: לֹא יַאֲמִין
  choice: నమ్మడు
  rationale: ఇక్కడ אמן హిఫీల్ రూపం నమ్మకం ఉంచడం అనే భావాన్ని ఇస్తుంది. తెలుగు ‘నమ్మడు’ సహజంగా ఉండి ఆ సంబంధాత్మక భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: וְשָׁמַיִם
  choice: ఆకాశాలు సైతం
  rationale: హీబ్రూ బహువచనాన్ని ‘ఆకాశాలు’గా నిలుపుతూ, కవితా సమాంతరంలోని బలాన్ని ‘సైతం’ వ్యక్తం చేస్తుంది.
- source_word: לֹא זַכּוּ
  choice: పవిత్రమైనవి కావు
  rationale: ఈ సందర్భంలో పదం శుద్ధత లేదా నిర్మలతను సూచిస్తుంది. ముందున్న ‘పరిశుద్ధులు’తో ధ్వని గందరగోళం రాకుండా, విశ్వసంబంధ కవితా భావానికి సరిపోయే రూపం ఎంచుకోబడింది.
- source_word: בְּעֵינָיו
  choice: ఆయన దృష్టిలో
  rationale: అక్షరార్థం ‘ఆయన కళ్లలో’; తెలుగు వాడుకలో ‘ఆయన దృష్టిలో’ అదే దైవిక మదింపు భావాన్ని సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ‘ఆయన పరిశుద్ధులు’ ఎవరిని సూచిస్తున్నారు?
  choice: ప్రధాన పాఠంలో విస్తృతమైన ‘తన పరిశుద్ధులు’ అనే రూపాన్ని నిలుపడం; అధస్సూచికలో పరలోక జీవులు కావచ్చని తెలియజేయడం
  alternative: ‘ఆయన దూతలు’ అని నేరుగా అనువదించడం లేదా మానవ పరిశుద్ధులుగా అర్థం నిర్దిష్టం చేయడం
  rationale: ‘ఆకాశాలు’తో ఉన్న కవితా సమాంతరత పరలోక జీవులను సూచించే అవకాశాన్ని బలపరుస్తుంది. అయినా హీబ్రూ పదం నేరుగా ‘దూతలు’ అనదు; అందుచేత మూలంలోని విస్తృతతను, స్వల్ప అస్పష్టతను ప్రధాన పాఠంలో కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కవితా శైలిని ఉపయోగించాం. ‘ఇదిగో’ మూలంలోని ఉద్ఘాటనను నిలుపుతుంది; రెండవ పాదంలోని ‘సైతం’ కవితా సమాంతరతను బలపరుస్తుంది. ‘పరిశుద్ధులు’ అనే రూపం భావాన్ని అతిగా నిర్దిష్టం చేయకుండా ఉంచుతుంది.
