- from: విపత్తు, వేదన అతణ్ణి భయభ్రాంతుణ్ణి చేస్తాయి; యుద్ధానికి సిద్ధమైన రాజులా అవి అతణ్ణి జయిస్తాయి.[a]
  to: ఆపద, సంకటం అతనిని భయభ్రాంతుణ్ణి చేస్తాయి; యుద్ధానికి సిద్ధమైన రాజువలె అవి అతనిపై పైచేయి సాధిస్తాయి.[a]
