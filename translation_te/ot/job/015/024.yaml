  text: Distress and anguish terrify him[a]; they overpower him like a king ready for battle.
translation:
  language: te
  text: ఆపద, సంకటం అతనిని భయభ్రాంతుణ్ణి చేస్తాయి; యుద్ధానికి సిద్ధమైన రాజువలె అవి అతనిపై పైచేయి సాధిస్తాయి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దాడికి సిద్ధమైన రాజువలె.” ఇక్కడ “యుద్ధం” అని అనువదించిన హీబ్రూ పదం అరుదైనది; అది మరింత నిర్దిష్టంగా సాయుధ దాడిని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְבַעֲתֻהוּ
  choice: అతణ్ణి భయభ్రాంతుణ్ణి చేస్తాయి
  rationale: పీయేల్ రూపం తీవ్రమైన భయాన్ని కలిగించడాన్ని సూచిస్తుంది. ఈ తెలుగు ప్రయోగం ఆ బలమైన కారక భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: צַר
  choice: విపత్తు
  rationale: ఈ నామవాచకం ఇరుకు పరిస్థితి, కష్టం లేదా ఆపదను సూచిస్తుంది. సమాంతర పదమైన מְצוּקָהతో భేదాన్ని నిలుపుతూ సందర్భంలోని బాధాకర పరిస్థితిని తెలియజేస్తుంది.
- source_word: מְצוּקָה
  choice: వేదన
  rationale: తీవ్రమైన ఒత్తిడి, సంకటస్థితి లేదా మనోవేదన అనే భావాన్ని ఇస్తుంది. צַרకు ఎంచుకున్న ‘విపత్తు’తో సహజమైన కవితా జోడీగా ఉంటుంది.
- source_word: תִּתְקְפֵהוּ
  choice: అవి అతణ్ణి జయిస్తాయి
  rationale: క్రియ రూపపరంగా స్త్రీలింగ ఏకవచనమైనా, ముందున్న రెండు నామవాచకాలు కలిపి కవితాత్మక కర్తగా పనిచేస్తాయి. తెలుగు బహువచనం రెండింటినీ సూచిస్తుంది; ‘జయిస్తాయి’ బలంగా పైచేయి సాధించే భావాన్ని అందిస్తుంది.
- source_word: כְּמֶלֶךְ
  choice: రాజులా
  rationale: ఉపమార్థక כను సహజమైన తెలుగు ఉపమాన రూపంలో ప్రతిబింబిస్తుంది.
- source_word: עָתִיד
  choice: సిద్ధమైన
  rationale: ఈ సందర్భంలో సిద్ధంగా లేదా సమాయత్తంగా ఉన్న భావం ప్రధానమైనది.
- source_word: לַכִּידוֹר
  choice: యుద్ధానికి
  rationale: כידור అరుదైన, అర్థనిర్ణయం కష్టమైన పదం. సందర్భంలో సైనిక సమరం లేదా దాడిని సూచించే అవకాశం ఎక్కువ; ప్రధాన వాక్యంలో స్పష్టమైన విస్తృతార్థాన్ని ఇచ్చి, నిర్దిష్ట ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
