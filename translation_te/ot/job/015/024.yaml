translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కవితా వాక్యనిర్మాణం వాడబడింది. హీబ్రూ సమాంతరతను నిలుపుతూ అరుదైన సైనిక పదంలోని అనిశ్చితిని పాదసూచికలో సంరక్షించాం.
