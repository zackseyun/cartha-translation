source:
  edition: WLC
  text: כִּֽי תָשִׁ֣יב אֶל אֵ֣ל רוּחֶ֑/ךָ וְ/הֹצֵ֖אתָ מִ/פִּ֣י/ךָ מִלִּֽין־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/015/013.yaml
  text: that you turn your spirit against God and bring words out of your mouth?[a]
translation:
  language: te
  text: నీవు నీ మనస్సును దేవుని వైపు తిప్పి, నీ నోటి నుండి మాటలను వెలువరించుచున్నావెందుకు?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, సందర్భానుసారంగా, ‘దేవునికి విరోధంగా.’ హీబ్రూలో అక్షరార్థంగా ‘దేవుని వైపు/దేవుని దగ్గరకు’ అని ఉంది; సందర్భంలో ప్రతిఘటన భావం సూచించబడవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: -డానికా
  rationale: ముందరి వచనంలోని ప్రశ్నకు ఈ వాక్యం కొనసాగింపుగా, ఎలీఫజు ఆరోపిస్తున్న చర్యను తెలుగులో సహజమైన ప్రశ్నార్థక ప్రయోజన నిర్మాణంతో అనుసంధానిస్తుంది.
- source_word: תָשִׁיב
  choice: తిప్పి
  rationale: హిఫిల్ రూపం ఇక్కడ తిరిగి రావడం కంటే ఒకరి అంతరంగ వైఖరిని ఒక దిశగా మళ్లించడాన్ని సూచిస్తుంది; ‘తిప్పి’ మూలంలోని దిశాత్మక భావాన్ని నిలుపుతుంది.
- source_word: אֶל אֵל
  choice: దేవునికి విరోధంగా
  rationale: אֶל యొక్క ప్రాథమిక భావం ‘వైపు/దిశగా’; అయితే ఎలీఫజు చేస్తున్న ఆరోపణ సందర్భంలో ఆ దిశ ప్రతిఘటనగా ఉద్దేశించబడింది. ప్రధాన పాఠంలో సందర్భార్థాన్ని ఇచ్చి, అక్షరార్థ ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: רוּחֶךָ
  choice: నీ ఆత్మను
  rationale: רוּחַ ఇక్కడ గాలి లేదా శ్వాసను కాక, యోబు అంతరంగ స్వభావం లేదా వైఖరిని సూచిస్తుంది. ‘ఆత్మ’ మూలపదంలోని విస్తృత మానవశాస్త్రీయ భావాన్ని కాపాడుతుంది.
- source_word: וְהֹצֵאתָ
  choice: వెలువరించడానికా
  rationale: హిఫిల్ రూపంలోని ‘బయటకు రప్పించు’ అనే సజీవ చిత్రాన్ని, నోటినుండి మాటలు రావడం అనే సహజ తెలుగు ప్రయోగంతో వ్యక్తం చేస్తుంది.
- source_word: מִפִּיךָ
  choice: నీ నోటినుండి
  rationale: מִן సూచించే మూలస్థాన భావాన్ని నేరుగా, సహజంగా తెలియజేస్తుంది.
- source_word: מִלִּין
  choice: మాటలు
  rationale: అరామీయ శైలిగల ఈ బహువచనానికి సందర్భంలో సరళమైన, సహజమైన సమానార్థకం ‘మాటలు’.
theological_decisions:
- issue: אֶל אֵל లోని దిశాత్మకతను ప్రతిఘటనగా అనువదించడం
  choice: దేవునికి విరోధంగా
  alternative: దేవుని వైపు
  rationale: మూల ఉపసర్గ స్వతహాగా విరోధాన్ని తప్పనిసరిగా సూచించదు; అయినా ఎలీఫజు ఆరోపణ సందర్భం ప్రతికూల దిశను సూచిస్తుంది. ఈ వ్యాఖ్యానాత్మక ఉద్రిక్తతను పాదసూచిక ద్వారా బహిర్గతంగా ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన శైలి వాడబడింది. ఇది 12వ వచనంలోని ప్రశ్నకు కొనసాగింపు కావడంతో, ‘-డానికా?’ నిర్మాణం ద్వారా అనుసంధానం నిలుపబడింది; మూలంలోని ‘ఆత్మ,’ ‘నోటి నుండి మాటలు వెలువరించడం’ అనే చిత్రాలు సాధ్యమైనంతవరకు కాపాడబడ్డాయి.
