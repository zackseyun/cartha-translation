source:
  edition: WLC
  text: כִּ֤י יְאַלֵּ֣ף עֲוֺנְ/ךָ֣ פִ֑י/ךָ וְ֝/תִבְחַ֗ר לְשׁ֣וֹן עֲרוּמִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/job/015/005.yaml
  text: For your iniquity teaches your mouth[b][a], and you choose the tongue of the crafty.
translation:
  language: te
  text: 'ఎందుకంటే నీ దోషమే[a] నీ నోటికి మాటలు నేర్పుతోంది;

    నీవు కపటుల మాటతీరును[b] ఎంచుకుంటావు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నీ అపరాధమే’ లేదా ‘నీ పాపమే’ అని కూడా అనువదించవచ్చు. హీబ్రూ עָוֹן సందర్భానుసారం దోషం, అపరాధం లేదా అపరాధభారం అనే భావాలను సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘కపటుల నాలుకను.’ ‘కపటుల భాషను,’ ‘జిత్తులవారి మాటతీరును,’ లేదా ‘చతురుల మాటతీరును’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి ఆరోపణకు ఎలీఫజు చెప్పే కారణాన్ని పరిచయం చేస్తుంది; సందర్భంలోని వాదనా ప్రవాహాన్ని సహజంగా నిలుపుతుంది.
- source_word: יְאַלֵּף
  choice: నేర్పుతుంది
  rationale: పీయేల్ రూపంలోని ‘నేర్పు/శిక్షణ ఇవ్వు’ భావాన్ని, దోషం యోబు నోటికి బోధిస్తున్నదనే వ్యక్తీకరణతో సహా నిలుపుతుంది.
- source_word: עֲוֺנְךָ
  choice: నీ దోషమే
  rationale: עָוֹן పాపకార్యం, దోషం లేదా అపరాధభారం అనే భావాలను సూచించగలదు. ఇక్కడ యోబు మాటలకు మూలంగా ఆరోపించబడుతున్న నైతిక తప్పును ‘దోషం’ సహజంగా తెలియజేస్తుంది; ‘మే’ కర్తను స్పష్టం చేస్తుంది.
- source_word: פִיךָ
  choice: నీ నోటికి
  rationale: హీబ్రూ శరీరాంగ రూపకాన్ని నిలుపుతూ, తెలుగులో ‘నేర్పుతుంది’ అనే క్రియతో సహజమైన విభక్తిని ఉపయోగిస్తుంది.
- source_word: וְתִבְחַר
  choice: నీవు ... ఎంచుకుంటావు
  rationale: בחר అనే క్రియలోని ప్రత్యక్షమైన ‘ఎంచుకొను’ భావాన్నీ, రెండవ పురుషునిపై ఉన్న ఆరోపణనూ నిలుపుతుంది.
- source_word: לְשׁוֹן
  choice: నాలుకను
  rationale: మొదటి పాదంలోని ‘నోరు’తో ఉన్న కవితాత్మక సమాంతరతను కాపాడటానికి అక్షరార్థ శరీరాంగ రూపకాన్ని ఉంచుతుంది.
- source_word: עֲרוּמִים
  choice: కపటుల
  rationale: ఈ పదం సందర్భానుసారం వివేకులు, చతురులు లేదా జిత్తులవారు అని అర్థమివ్వగలదు. ఎలీఫజు ఆరోపణాత్మక సందర్భంలో మోసపూరిత చాతుర్యాన్ని ‘కపటులు’ స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: עָוֹן అనే పదంలోని నైతిక భావ ఛాయ
  choice: ‘నీ దోషమే’ అని అనువదించబడింది.
  alternative: ‘నీ అపరాధమే’ లేదా ‘నీ పాపమే’
  rationale: ఎలీఫజు యోబు మాటలకు అతని నైతిక తప్పే మూలమని ఆరోపిస్తున్నాడు. ‘దోషం’ పాపకార్యం మరియు దాని బాధ్యత మధ్య ఉన్న మూలపద విస్తృతిని పూర్తిగా ఒక్క భావానికి పరిమితం చేయదు.
- issue: עֲרוּמִים యొక్క సానుకూల లేదా ప్రతికూల భావం
  choice: ‘కపటుల’ అనే ప్రతికూల భావం తీసుకోబడింది.
  alternative: ‘చతురుల’ లేదా ‘వివేకుల’
  rationale: పదానికి సానుకూలంగా ‘వివేకులు’ అనే భావం సాధ్యమైనా, ఇక్కడ యోబు మాటలను తప్పుబట్టే ఎలీఫజు వాక్యంలో మోసపూరిత చాతుర్యమే ఉద్దేశించిన భావంగా కనిపిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన, సులభంగా అర్థమయ్యే కవితాత్మక శైలి వాడబడింది. ‘నోరు—నాలుక’ అనే హీబ్రూ సమాంతర రూపకం నిలుపబడింది; అసహజతను తగ్గించేందుకు తెలుగు విభక్తి నిర్మాణం సహజంగా అమర్చబడింది.
