base_translation:
  language: en
  yaml_path: translation/ot/job/015/033.yaml
  text: He will shake off his unripe grapes like a vine[b][a], and cast off his blossom like an olive tree.
translation:
  language: te
  text: 'ద్రాక్షతీగలా అతడు తన పచ్చి ద్రాక్షపండ్లను రాల్చివేస్తాడు[a];

    ఒలీవ చెట్టులా తన పూతను రాల్చివేస్తాడు[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ద్రాక్షతీగలా అతడు తన పచ్చి ద్రాక్షపండ్లను బలంగా తొలగిస్తాడు.” హీబ్రూ క్రియకు సాధారణంగా బలప్రయోగం చేయడం, లాక్కోవడం అనే బలమైన భావం ఉంది; ఇక్కడ అది పక్వానికి ముందే ద్రాక్షపండ్లు పోవడాన్ని చిత్రిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “తన పువ్వును” లేదా “తన వికాసాన్ని.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחְמֹס
  choice: రాల్చివేస్తాడు
  rationale: ఈ క్రియ సాధారణంగా బలప్రయోగం, దోచుకోవడం, లాక్కోవడం వంటి బలమైన భావాన్ని కలిగిస్తుంది. అయితే ఇక్కడ ద్రాక్షతీగపై పక్వానికి రాని కాయలు అకాలంగా పోవడమే వ్యవసాయ రూపకం; అందువల్ల సహజమైన తెలుగులో ఫలితాన్ని స్పష్టంగా తెలిపే ‘రాల్చివేస్తాడు’ను ఎంచుకున్నాం. బలంగా తొలగించే అంతర్భావాన్ని పాదసూచికలో నిలిపాం.
- source_word: כַּגֶּפֶן
  choice: ద్రాక్షతీగలా
  rationale: כ ఉపసర్గతో ఉన్న గפן పోలికను సహజమైన ఆధునిక తెలుగులో ‘ద్రాక్షతీగలా’ అని అందించాం.
- source_word: בִּסְרוֹ
  choice: తన పచ్చికాయలను
  rationale: בֹּסֶר పక్వానికి రాని ద్రాక్షకాయలను సూచిస్తుంది. ‘పచ్చికాయలు’ సాధారణ పాఠకులకు సహజంగా అర్థమయ్యే తెలుగు పదం; సందర్భం వల్ల అవి ద్రాక్షకాయలని స్పష్టమవుతుంది. మూడవ పురుష ఏకవచన ప్రత్యయాన్ని ‘తన’గా నిలిపాం.
- source_word: וְיַשְׁלֵךְ
  choice: రాల్చివేస్తాడు
  rationale: Hiphil రూపం విసరడం లేదా పడవేయడం అనే క్రియాశీల భావాన్ని ఇస్తుంది. చెట్టు తన పూతను పోగొట్టుకునే రూపకంలో ‘రాల్చివేస్తాడు’ సహజంగా ఉండి ఆ క్రియాశీల చిత్రాన్ని నిలుపుతుంది.
- source_word: כַּזַּיִת
  choice: ఒలీవ చెట్టులా
  rationale: זית ఒలీవ పండునూ చెట్టునూ సూచించగలదు; పూత రాల్చడం ఇక్కడ చెట్టుకు సంబంధించినందున ‘ఒలీవ చెట్టు’ అని స్పష్టం చేశాం.
- source_word: נִצָּתוֹ
  choice: తన పూతను
  rationale: ఈ నామవాచకం మొక్క పువ్వు లేదా వికసించిన పూతను సూచిస్తుంది. ఒలీవ చెట్టు రూపకంలో సహజమైన తెలుగు వ్యవసాయ పదం ‘పూత’; వ్యక్తిని సూచించే ప్రత్యయాన్ని ‘తన’గా నిలిపాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన కవితా శైలిని వాడాం. రెండు సమాంతర వ్యవసాయ రూపకాలను విడి పాదాలుగా ఉంచాం. ‘ఒలీవ’ అనే పరిచిత లిప్యంతరీకరణను ఉపయోగించాం; మూలంలోని పురుష ఏకవచన స్వాధీన భావాన్ని సహజ తెలుగులో ‘తన’తో తెలిపాం. అన్ని పాదసూచిక సూచికలు ప్రధాన పాఠ్యంలో ఉన్నాయి.
