translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. కవితా పాద విభజనను ఉపయోగించి సమాంతర చిత్రణను నిలిపాం. మూలంలోని మధ్య ఉపవాక్యపు అనిశ్చితిని పాదటిప్పణిలో సంరక్షించాం.
