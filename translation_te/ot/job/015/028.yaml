  yaml_path: translation/ot/job/015/028.yaml
  text: He has lived in ruined cities[a], in houses where no one dwells, which were destined to become heaps.
translation:
  language: te
  text: 'అతడు నాశనమైన పట్టణాల్లో,

    ఎవరూ నివసించని ఇళ్లలో నివసించాడు[a]—

    అవి రాళ్ల కుప్పలుగా మారేందుకు సిద్ధంగా ఉన్నవి.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతడు ధ్వంసమైన పట్టణాల్లో, అక్కడ వారు నివసించని ఇళ్లలో నివసించాడు; అవి శిథిలాల కుప్పలుగా మారేందుకు సిద్ధంగా ఉన్నాయి.” ఈ వచనంలోని హీబ్రూ సంక్షిప్తంగా ఉంది; ముఖ్యంగా మధ్య భాగాన్ని దగ్గరి సంబంధమున్న పలు విధాలుగా అనువదించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁכּוֹן
  choice: నివసించాడు
  rationale: שׁכן అనే క్రియ నివసించడం లేదా స్థిరపడడం అనే అర్థాన్ని ఇస్తుంది. హీబ్రూ కథనరూపాన్ని సహజమైన ఆధునిక తెలుగులో భూతకాలంతో ప్రతిబింబిస్తుంది.
- source_word: עָרִים נִכְחָדוֹת
  choice: నాశనమైన పట్టణాలు
  rationale: נכחדות అనేది తుడిచివేయబడిన, ధ్వంసమైన లేదా పాడైపోయిన స్థితిని సూచిస్తుంది. తరువాతి నిర్జన గృహాలు, రాళ్లకుప్పలు అనే చిత్రణతో ‘నాశనమైన’ చక్కగా సరిపోతుంది.
- source_word: בָּתִּים לֹא יֵשְׁבוּ לָמוֹ
  choice: ఎవరూ నివసించని ఇళ్లు
  rationale: మూలంలోని ఈ సంక్షిప్తమైన, క్లిష్టమైన పదబంధం నిర్జనమైన గృహాలను సూచిస్తున్నట్లు సహజంగా అర్థమవుతుంది. సర్వనామ ప్రత్యయాన్ని కృత్రిమంగా నిర్దిష్టీకరించకుండా తెలుగు భావాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: אֲשֶׁר הִתְעַתְּדוּ
  choice: సిద్ధపరచబడినవి
  rationale: עתד హిత్పయేల్ రూపం సిద్ధంగా ఉండడం, నియమించబడడం లేదా ఉద్దేశించబడడం అనే భావాలను అనుమతిస్తుంది. ‘సిద్ధపరచబడినవి’ మూలంలోని ఉద్దేశిత ఫలితాన్ని నిలుపుతూ అతిగా నిర్ణయాత్మకమైన భావాన్ని రుద్దదు.
- source_word: לְגַלִּים
  choice: రాళ్లకుప్పలుగా మారడానికి
  rationale: גַּלִּים ఇక్కడ శిథిలాలుగా మిగిలిన రాళ్లకుప్పలను సూచిస్తుంది. ‘మారడానికి’ అనే ప్రయోగం לְ సూచించే ఫలితాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
