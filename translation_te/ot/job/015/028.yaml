revisions:
- from: 'అతడు నాశనమైన పట్టణాల్లో,

    ఎవరూ నివసించని ఇళ్లలో నివసించాడు[a]—

    అవి రాళ్లకుప్పలుగా మారడానికి సిద్ధపరచబడినవి.'
  to: 'అతడు నాశనమైన పట్టణాల్లో,

    ఎవరూ నివసించని ఇళ్లలో నివసించాడు[a]—

    అవి రాళ్ల కుప్పలుగా మారేందుకు సిద్ధంగా ఉన్నవి.'
  rationale: The revision preserves the verse’s compact, ominous imagery and the interpretive openness of the difficult middle clause. It replaces a passive formulation that can introduce an unstated agent with a Telugu expression that represents the Hebrew’s ‘prepared/ready/destined’ sense more directly.
