source:
  edition: WLC
  text: כִּֽי נָטָ֣ה אֶל אֵ֣ל יָד֑/וֹ וְ/אֶל שַׁ֝דַּ֗י יִתְגַּבָּֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/015/025.yaml
  text: because he has stretched out his hand against God[a], and has shown himself mighty against the Almighty.
translation:
  language: te
  text: ఎందుకంటే అతడు దేవునికి విరోధంగా తన చెయ్యి చాచాడు[a]; సర్వశక్తిమంతునికి ఎదురు తనను తాను బలవంతునిగా చూపుకున్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతడు దేవుని వైపు తన చెయ్యి చాచాడు; సర్వశక్తిమంతునికి ఎదురు తనను తాను బలపరచుకున్నాడు.”
    reason: אֶל అనే ఉపసర్గకు ‘వైపు’ అనే దిశార్థం, יִתְגַּבָּרకు ‘తనను తాను బలపరచుకొను’ అనే మరింత అక్షరార్థ రూపం సాధ్యమైనందున ఈ ప్రత్యామ్నాయం ఇవ్వబడింది.
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: చుట్టుపక్కల సందర్భంలో దుష్టునికి తీర్పు రావడానికి కారణాన్ని పరిచయం చేస్తుంది; ఆధునిక తెలుగులో కారణార్థాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: נָטָה
  choice: చాచాడు
  rationale: ‘చాపడం/విస్తరించడం’ అనే మూల చిత్రాన్ని నిలుపుతుంది; ‘చెయ్యి’తో కలిసినప్పుడు ప్రతిఘటనతో కూడిన చర్యను సూచిస్తుంది.
- source_word: אֶל
  choice: విరోధంగా / ఎదురు
  rationale: సాధారణంగా ‘వైపు’ అని అర్థమైనా, ఈ శత్రుత్వ సందర్భంలో దేవునికి వ్యతిరేకంగా నిలవడాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది; అక్షరార్థ ప్రత్యామ్నాయం పాదటిప్పణిలో ఉంచబడింది.
- source_word: אֵל
  choice: దేవుడు
  rationale: ఇక్కడ సాధారణ దైవ బిరుదుగా ఉంది; తరువాతి שַׁדַּיతో ఉన్న కవితాత్మక సమాంతరతను కాపాడుతుంది.
- source_word: יָדוֹ
  choice: తన చెయ్యి
  rationale: హీబ్రూ ఏకవచన రూపాన్నీ, చెయ్యి చాచడం అనే స్పష్టమైన చిత్రాన్నీ నిలుపుతుంది.
- source_word: שַׁדַּי
  choice: సర్వశక్తిమంతుడు
  rationale: దైవ బిరుదును లిప్యంతరీకరించకుండా అర్థానుసారంగా అనువదిస్తుంది; తెలుగులో సుపరిచితమైన, గౌరవప్రదమైన రూపం.
- source_word: יִתְגַּבָּר
  choice: తనను తాను బలవంతునిగా చూపుకున్నాడు
  rationale: హిత్పయేల్ రూపంలోని స్వీయ-బలప్రదర్శన భావాన్ని నిలుపుతూ, సర్వశక్తిమంతునికి ఎదురు మనిషి తన బలాన్ని ప్రదర్శించడంలోని వ్యంగ్య ఉద్వేగాన్ని తెలియజేస్తుంది.
theological_decisions:
- issue: కవితాత్మక సమాంతరతలోని దైవ బిరుదుల అనువాదం
  choice: אֵלను ‘దేవుడు’గా, שַׁדַּיను ‘సర్వశక్తిమంతుడు’గా అనువదించడం
  alternative: ‘ఏల్’ / ‘షద్దయి’ అని లిప్యంతరీకరించడం
  rationale: రెండు వేర్వేరు దైవ సూచనలను అర్థవంతమైన తెలుగు బిరుదులతో అందించడం ద్వారా సమాంతరతను నిలుపుతుంది; పేర్లుగా కాక బిరుదులుగా ఉన్న వాటి భావాన్ని పాఠకునికి నేరుగా తెలియజేస్తుంది.
- issue: יִתְגַּבָּרలోని స్వీయ బలప్రదర్శన భావం
  choice: ‘తనను తాను బలవంతునిగా చూపుకున్నాడు’
  alternative: ‘ధిక్కారంగా ప్రవర్తించాడు’ లేదా ‘తనను తాను బలపరచుకున్నాడు’
  rationale: ధిక్కార భావాన్ని అతిగా వ్యాఖ్యానించకుండా, మూలంలోని ప్రతిబింబక క్రియాభావాన్నీ ‘బలవంతుడు’ అనే భావాన్నీ కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, అయితే యోబు కవిత్వానికి తగిన గంభీరతతో రూపొందించబడింది. ‘చెయ్యి చాచాడు’ అనే మూల దృశ్యరూపం, రెండు దైవ బిరుదుల సమాంతరత, స్వీయ బలప్రదర్శనలోని ఉద్వేగం నిలుపబడ్డాయి.
