translation:
  language: te
  text: నేను నీకు తెలియజేస్తాను; నా మాట విను. నేను చూసినదాన్ని[a] చెబుతాను—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నేను నీకు చూపిస్తాను; నా మాట విను; నేను చూసిన ఈ విషయాన్ని చెబుతాను.’
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲחַוְךָ
  choice: నేను నీకు తెలియజేస్తాను
  rationale: పియేల్ రూపం ఇక్కడ ఎలీఫజు చెప్పబోయే మాటలను పరిచయం చేస్తుంది. దృశ్యంగా చూపించడం భావం కానందున, ఆధునిక తెలుగులో సహజమైన ‘తెలియజేస్తాను’ అనేది ప్రకటించడం/చెప్పడం అనే భావాన్ని అందిస్తుంది.
- source_word: שְׁמַע לִי
  choice: నా మాట విను
  rationale: ఆజ్ఞార్థక క్రియతో కూడిన పూర్వప్రత్యయం, మాట్లాడుతున్నవాని మాటను శ్రద్ధగా వినమనే విజ్ఞప్తిని వ్యక్తం చేస్తుంది. ‘నా మాట విను’ ఆధునిక తెలుగులో సహజంగా ఆ బలాన్ని నిలుపుతుంది.
- source_word: וְזֶה
  choice: …దాన్ని
  rationale: రూపపరంగా ‘మరియు ఇది’ అయినా, తరువాతి ‘నేను చూసినది’ అనే విషయాన్ని సూచించే సంభాషణాత్మక నిర్దేశకంగా పనిచేస్తుంది. తెలుగులో ‘నేను చూసినదాన్ని’ అని కలిపి చెప్పడం సహజంగా అదే కార్యాన్ని నిలుపుతుంది.
- source_word: חָזִיתִי
  choice: నేను చూసిన
  rationale: పూర్త క్రియారూపం ఎలీఫజు తన వ్యక్తిగత పరిశీలనగా పేర్కొంటున్నదాన్ని సూచిస్తుంది. ‘చూసిన’ అనేది అనుభవపూర్వక పరిశీలన భావాన్ని నిలుపుతుంది.
- source_word: וַאֲסַפֵּרָה
  choice: వివరిస్తాను
  rationale: కోహోర్టేటివ్ రూపం తాను గమనించినదాన్ని వివరించి చెప్పాలనే వక్త ఉద్దేశాన్ని తెలియజేస్తుంది. ‘వివరిస్తాను’ సాధారణ ‘చెబుతాను’ కంటే విషయాన్ని వరుసగా తెలియజేసే ఛాయను మెరుగ్గా అందిస్తుంది.
