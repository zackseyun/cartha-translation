  text: לֹֽא יֶ֭עְשַׁר וְ/לֹא יָק֣וּם חֵיל֑/וֹ וְ/לֹֽא יִטֶּ֖ה לָ/אָ֣רֶץ מִנְלָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/015/029.yaml
  text: He will not become rich[a], and his wealth will not endure[b], and his produce will not bend down to the earth.
translation:
  language: te
  text: అతడు ధనవంతుడు కాలేడు; అతని సంపద నిలిచి ఉండదు; అతని పంట[a] నేలవైపు వంగదు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “అతని సమృద్ధి,” “అతని ఆస్తి,” లేదా “అతని లాభం.” ఇక్కడి హీబ్రూ పదం అరుదైనది; దాని అర్థం అనిశ్చితం.
    reason: lexical_alternative
  - marker: b
    text: సమృద్ధిగా ఉన్న కొమ్మలు లేదా పంట బరువుతో నేలవైపు వంగకపోవడం ఈ మాటల్లో సూచితమై ఉండవచ్చు. మరికొందరు దీనిని అతని ఆస్తి దేశమంతటా విస్తరించకపోవడం అనే సాధారణ భావంలో అర్థం చేసుకుంటారు.
    reason: alternative_reading
lexical_decisions:
- source_word: יֶעְשַׁר
  choice: ధనవంతుడు కాడు
  rationale: עשר అనే క్రియ ఇక్కడ ధనవంతుడు కావడం లేదా సంపద పొందడం అనే భావాన్ని ఇస్తుంది. సహజమైన తెలుగులో భవిష్యత్ ఫలితాన్ని సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: יָקוּם
  choice: నిలిచి ఉండదు
  rationale: మూలార్థం ‘నిలబడదు’; సంపద సందర్భంలో అది స్థిరంగా ఉండకపోవడం లేదా కొనసాగకపోవడం అనే భావాన్ని ఇస్తుంది.
- source_word: חֵילוֹ
  choice: అతని సంపద
  rationale: חַיִל బలం, వనరులు, ఆస్తి లేదా సంపదను సూచించగలదు. ఇక్కడ ఐశ్వర్యం నిలవకపోవడమే సందర్భోచిత భావం.
- source_word: יִטֶּה
  choice: నేలవైపు వంగదు
  rationale: נטה వంగడం, చాపడం, విస్తరించడం వంటి భావాలను కలిగి ఉంది. అరుదైన చివరి నామవాచకంతో కలిపి శాఖలు లేదా పంట సమృద్ధితో నేలవైపు వంగే దృశ్యాన్ని నిలుపుతుంది.
- source_word: מִנְלָם
  choice: అతని సమృద్ధి
  rationale: ఈ పదరూపం అరుదైనదీ అర్థనిర్ణయం కష్టమైనదీ. ‘సమృద్ధి’ అనేది పంట, దిగుబడి, ఆస్తి లేదా విస్తారమైన సంపద వంటి సాధ్యార్థాలను పూర్తిగా ఒకే అర్థానికి పరిమితం చేయకుండా ఉంచుతుంది.
