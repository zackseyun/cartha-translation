  yaml_path: translation/ot/job/015/022.yaml
  text: He does not expect to return from darkness[a], and he is destined for the sword.
translation:
  language: te
  text: 'చీకటి నుండి తిరిగి వస్తాడని అతను నమ్మడు;

    ఖడ్గం అతని కోసం ఎదురుచూస్తోంది.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఈ హెబ్రీయ క్రియారూపం అర్థం నిర్ధారించడం కష్టం. దీన్ని ‘ఖడ్గం అతని కోసం పొంచి ఉంది,’ ‘అతడు ఖడ్గానికి గురికావడానికి నిర్ణయించబడ్డాడు,’ లేదా ‘ఖడ్గం అతని కోసం ఎదురుచూస్తోంది’ అని కూడా అనువదించవచ్చు. ఈ పాదం సమీపిస్తున్న హింసాత్మక తీర్పును సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא יַאֲמִין
  choice: నమ్మకం అతనికి లేదు
  rationale: హిఫీల్ రూపం ఇక్కడ మతపరమైన విశ్వాసాన్ని కాక, భవిష్యత్తులో జరిగేదానిపై ఆశ లేదా నిరీక్షణను సూచిస్తుంది. సహజమైన తెలుగులో ‘నమ్మకం అతనికి లేదు’ ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: שׁוּב
  choice: తిరిగి వస్తాననే
  rationale: ఈ క్రియారూపం అతని నిరీక్షణలోని విషయాన్ని—చీకటి నుండి మళ్లీ బయటపడడాన్ని—తెలియజేస్తుంది. తెలుగు వాక్య నిర్మాణానికి అనుగుణంగా ప్రథమ పురుష భావం ఉపయోగించబడింది.
- source_word: מִנִּי חֹשֶׁךְ
  choice: చీకటి నుండి
  rationale: చీకటి అనేది ఇక్కడ అక్షరార్థంతో పాటు ఆపద, నిరాశ లేదా మరణ ముప్పును సూచించే రూపకంగా ఉండవచ్చు; అనిశ్చితిని పరిష్కరించకుండా మూల రూపకాన్ని నిలిపింది.
- source_word: וְצָפוּ הוּא אֱלֵי חָרֶב
  choice: ఖడ్గం అతని కోసం ఎదురుచూస్తోంది
  rationale: కష్టమైన హెబ్రీయ రూపాన్ని ఖడ్గాన్ని వ్యక్తీకరించే విధంగా అనువదించింది. ఇది సమీపిస్తున్న హింసాత్మక మరణ భావాన్ని తెలియజేస్తూనే, ‘నియమించబడ్డాడు’ అనే ఒక్క వ్యాఖ్యానానికే వాక్యాన్ని పరిమితం చేయదు.
theological_decisions:
- issue: ఖడ్గానికి సంబంధించిన కర్తృత్వం లేదా విధి భావం
  choice: ఖడ్గం అతని కోసం ఎదురుచూస్తోంది
  alternative: అతడు ఖడ్గానికి గురికావడానికి నిర్ణయించబడ్డాడు
  rationale: మూలంలోని కష్టమైన క్రియారూపం దైవ నియామకం, విధి, లేదా పొంచి ఉన్న హింస అనే భావాల్లో ఏదో ఒక్కదాన్ని స్పష్టంగా నిర్ణయించదు. అందువల్ల ప్రధాన పాఠం ఆ ఉద్రిక్తతను నిలిపి, ప్రత్యామ్నాయాలను పాదసూచికలో తెలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కవితా శైలిని ఉపయోగించింది. ‘చీకటి’ మరియు ‘ఖడ్గం’ అనే మూల రూపకాలను అలాగే ఉంచి, రెండవ పాదంలోని హెబ్రీయ అస్పష్టతను పాదసూచిక ద్వారా సంరక్షించింది.
