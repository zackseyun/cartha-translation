source:
  edition: WLC
  text: כָּל יְמֵ֣י רָ֭שָׁע ה֣וּא מִתְחוֹלֵ֑ל וּ/מִסְפַּ֥ר שָׁ֝נִ֗ים נִצְפְּנ֥וּ לֶ/עָרִֽיץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/015/020.yaml
  text: All the days of the wicked man he writhes[c][b][a], and a number of years are stored up for the ruthless.
translation:
  language: te
  text: దుష్టుడు తన జీవితకాలమంతా మెలికలు తిరుగుతుంటాడు[a]; క్రూరునికోసం కొన్ని సంవత్సరాలు దాచిపెట్టబడ్డాయి[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వేదనలో ఉంటాడు”; హీబ్రూ క్రియ మెలికలు తిరగడం, వణకడం, లేదా ప్రసవవేదనలాంటి తీవ్రమైన బాధను సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “క్రూరునికోసం నిల్వ చేయబడ్డాయి” లేదా “కేటాయించబడ్డాయి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל יְמֵי רָשָׁע
  choice: దుష్టుడు తన జీవితకాలమంతా
  rationale: మూలంలోని సంపూర్ణ కాలవ్యాప్తిని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; ఏకవచనంలోని దుష్ట వ్యక్తిని ఒక రకానికి ప్రతినిధిగా నిలుపుతుంది.
- source_word: הוּא מִתְחוֹלֵל
  choice: వేదనతో మెలికలు తిరుగుతుంటాడు
  rationale: హిత్పోలేల్ రూపంలోని నిరంతర, తీవ్ర కలవరాన్ని ‘మెలికలు తిరుగు’ ద్వారా నిలుపుతూ, అది కేవలం శారీరక కదలిక కాదని ‘వేదనతో’ స్పష్టం చేస్తుంది.
- source_word: וּמִסְפַּר שָׁנִים
  choice: కొన్ని సంవత్సరాలు
  rationale: లెక్క నిర్దిష్టమైనదైనా వెల్లడించబడని కాలపరిమితి అనే భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: נִצְפְּנוּ
  choice: దాచిపెట్టబడ్డాయి
  rationale: צפן నిఫాల్ రూపంలోని ‘దాచబడ్డాయి/నిల్వ చేయబడ్డాయి/కేటాయించబడ్డాయి’ అనే రూపక ద్వంద్వార్థాన్ని సాధ్యమైనంతవరకు నిలుపుతుంది.
- source_word: לֶעָרִיץ
  choice: క్రూరునికోసం
  rationale: עָרִיץ లోని హింసాత్మక, నిర్దయ స్వభావాన్ని రాజకీయ ‘నియంత’ అనే అతి నిర్దిష్ట భావం లేకుండా తెలియజేస్తుంది.
theological_decisions:
- issue: క్రూరునికోసం దాచిపెట్టబడిన సంవత్సరాల స్వభావం
  choice: అవి శిక్ష సంవత్సరాలా, జీవిత సంవత్సరాలా అని ప్రధాన వాక్యంలో నిర్ధారించలేదు.
  alternative: ‘క్రూరునికి నిర్ణయించబడిన జీవిత సంవత్సరాలు’ లేదా ‘శిక్ష సంవత్సరాలు’ అని స్పష్టీకరించడం.
  rationale: హీబ్రూ వాక్యం ‘సంవత్సరాలు దాచిపెట్టబడ్డాయి/కేటాయించబడ్డాయి’ అని మాత్రమే చెబుతుంది; సందర్భార్థాన్ని అనువాదంలో సిద్ధాంతపరంగా ఖరారు చేయకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; జ్ఞానసాహిత్యానికి తగిన గంభీరతతో, సాధారణ పాఠకునికి అర్థమయ్యే సహజ వాక్యనిర్మాణం. హీబ్రూ ఏకవచన ప్రతినిధి రూపాన్ని ‘దుష్టుడు’, ‘క్రూరుడు’గా నిలిపాం.
