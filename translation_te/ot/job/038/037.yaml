  source_fidelity: 'మొదటి ప్రశ్న హెబ్రీ מִי יְסַפֵּר שְׁחָקִים בְּחָכְמָהను సరిగ్గా ప్రతిబింబిస్తుంది: మేఘాలను లెక్కించడం, జ్ఞానంతో అనే సాధనార్థకం రెండూ నిలిచాయి. రెండవ ప్రశ్నలో נִבְלֵי שָׁמַיִםకు ‘ఆకాశపు కుండలు’ తగిన కవితాత్మక రూపకం; మూలంలో లేని ‘నీటి’ని ప్రధాన పాఠ్యంలో చేర్చకపోవడం సముచితం. అయితే יַשְׁכִּיבకు ‘ఒంపు’ కంటే పాత్రలను తలక్రిందులుగా వంచి వాటి లోపలి ద్రవం జారే దృశ్యాన్ని తెలిపే ‘బోర్లించు’ మరింత స్పష్టమైన, సహజమైన సమానార్థకం.'
