lexical_decisions:
- source_word: מִי
  choice: ఎవడు
  rationale: దైవ సామర్థ్యాన్ని గురించి అడిగే అలంకారప్రశ్నను సహజమైన తెలుగు ప్రశ్నార్థక సర్వనామంతో వ్యక్తం చేస్తుంది.
- source_word: יְסַפֵּר
  choice: లెక్కించగల
  rationale: పియేల్ రూపంలోని ‘లెక్కించు/సంఖ్య నిర్ణయించు’ అనే భావాన్ని, అలంకారప్రశ్నలోని సామర్థ్య సూచనతో సహజంగా అందిస్తుంది.
- source_word: שְׁחָקִים
  choice: మేఘాలను
  rationale: చుట్టుపక్కల వచనాల్లోని వర్ష సంబంధ సందర్భంలో ఈ కవితాత్మక పదం ‘మేఘాలు’ అనే అర్థాన్ని ఇస్తుంది.
- source_word: בְּחָכְמָה
  choice: జ్ఞానంతో
  rationale: בְּ ఉపసర్గంలోని సాధనార్థాన్ని నిలుపుతూ, חָכְמָהను నేరుగా మరియు సహజంగా అనువదిస్తుంది.
- source_word: וְנִבְלֵי שָׁמַיִם
  choice: ఆకాశపు కుండలను
  rationale: נֵבֶל సూచించే పాత్ర లేదా తోలుతిత్తి రూపకాన్ని ఆధునిక పాఠకులకు స్పష్టమైన ‘కుండలు’తో నిలుపుతుంది; మూలంలో ప్రత్యక్షంగా లేని ‘నీటి’ అనే పదాన్ని ప్రధాన పాఠ్యంలో చేర్చదు.
- source_word: יַשְׁכִּיב
  choice: ఒంపగల
  rationale: హిఫీల్ రూపంలోని అక్షరార్థమైన ‘పడుకోబెట్టు’ భావాన్ని పాత్రల సందర్భంలో వాటిని వంచడం లేదా ఒంపడం అనే దృశ్యంగా సహజంగా వ్యక్తం చేస్తుంది; ‘కుమ్మరించు’ అని స్పష్టీకరించి మూలంలోని కవితాత్మక సూచనను అతిగా విప్పదు.
