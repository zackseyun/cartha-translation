  terminology: ‘జ్ఞానం,’ ‘మేఘాలు,’ ‘ఆకాశపు కుండలు’ సరైనవి. అడుగుటిప్పణిలోని ‘తోలుతిత్తులు’ נֵבֶלకు చెల్లుబాటయ్యే ప్రత్యామ్నాయాన్ని ఇస్తుంది; ‘హెబ్రీ కవితా చిత్రం’ అన్న వివరణ రూపకాన్ని అవసరమైనంత మాత్రమే వివరిస్తుంది.
