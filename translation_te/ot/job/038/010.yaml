  text: when I prescribed my boundary for it and set bars and doors,[a]
translation:
  language: te
  text: 'దానికి నా సరిహద్దును నిర్ణయించి,[a]

    అడ్డగడియలనూ తలుపులనూ అమర్చినప్పుడు,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దానికోసం నా శాసనాన్ని స్థిరపరచి.” హీబ్రూ క్రియకు సాధారణంగా “విరిచాను” అనే అర్థం ఉన్నా, ఇక్కడ సముద్రానికి హద్దు ఏర్పరచడమే ఉద్దేశమై ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשְׁבֹּר
  choice: నిర్ణయించి
  rationale: שׁבר సాధారణంగా ‘విరుచుట’ అని అర్థమిచ్చినా, ఇక్కడ సముద్రాన్ని అదుపులో ఉంచే హద్దును స్థిరపరచడమే సందర్భోచిత భావం. ‘నిర్ణయించి’ ఆ భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; పదంలోని క్లిష్టతను పాదసూచికలో ఉంచాం.
- source_word: עָלָיו
  choice: దానికి
  rationale: పూర్వసందర్భంలోని సముద్రాన్నే 3వ పురుష ఏకవచన ప్రత్యయం సూచిస్తుంది. ‘సరిహద్దును నిర్ణయించి’ అనే నిర్మాణంతో ‘దానికి’ సహజంగా సరిపోతుంది.
- source_word: חֻקִּי
  choice: నా సరిహద్దును
  rationale: חֹקకు శాసనం, నిర్ణయం, నిర్దేశిత హద్దు అనే భావాలు ఉన్నాయి. సముద్రాన్ని నిరోధించే సందర్భంలో ‘సరిహద్దు’ దృశ్యమైన హద్దును, దైవ నిర్ణయ భావాన్ని రెండింటినీ అందిస్తుంది.
- source_word: וָאָשִׂים
  choice: అమర్చినప్పుడు
  rationale: שׂים అంటే ఉంచుట లేదా అమర్చుట. తలుపులు, అడ్డగడియల నిర్మాణ దృశ్యంలో ‘అమర్చు’ సహజంగా ఉంది; హీబ్రూ క్రియల కాలసంబంధాన్ని తెలుగు వాక్యనిర్మాణంలో ‘-నప్పుడు’తో చూపించాం.
- source_word: בְּרִיחַ
  choice: అడ్డగడియలను
  rationale: בְּרִיחַ తలుపును బిగించే అడ్డకర్ర లేదా గడియను సూచిస్తుంది. ఆధునిక తెలుగులో ‘అడ్డగడియ’ నిరోధక నిర్మాణ దృశ్యాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: וּדְלָתָיִם
  choice: తలుపులను
  rationale: ద్వివచన రూపం తలుపుల జతను సూచించగలదు. అయితే ‘తలుపులు’ తెలుగులో సహజంగా ఉండి మూలంలోని నిర్మాణ రూపకాన్ని కాపాడుతుంది.
theological_decisions:
- issue: సముద్రంపై దేవుని అధికారాన్ని మానవరూప నిర్మాణ చిత్రణతో వ్యక్తపరచడం
  choice: దేవుడు సముద్రానికి సరిహద్దు నిర్ణయించి, అడ్డగడియలు మరియు తలుపులు అమర్చినట్లు చెప్పే స్పష్టమైన చిత్రణను నిలుపుకోవడం.
  alternative: దీనిని ప్రకృతిపై దేవుని సార్వభౌమాధికారాన్ని తెలిపే అమూర్త వాక్యంగా మార్చడం.
  rationale: హీబ్రూ కవిత్వం దైవాధికారాన్ని నిర్మాణాత్మకమైన సజీవ రూపకంతో చూపిస్తుంది. దానిని నిలుపుకోవడం మూలంలోని కవితా బలాన్నీ, దైవ పాలన భావాన్నీ అనవసర సిద్ధాంతీకరణ లేకుండా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కవితా శైలిని పాటించాం. ముందరి వచనాలతో కలిసే కాలసంబంధ ఉపవాక్యంగా ‘నిర్ణయించి … అమర్చినప్పుడు’ అని రూపొందించాం. ‘అడ్డగడియలు, తలుపులు’ అనే స్పష్టమైన నిర్మాణ రూపకాన్ని నిలిపాం.
