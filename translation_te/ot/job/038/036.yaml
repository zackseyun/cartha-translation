  text: מִי שָׁ֭ת בַּ/טֻּח֣וֹת חָכְמָ֑ה א֤וֹ מִֽי נָתַ֖ן לַ/שֶּׂ֣כְוִי בִינָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/038/036.yaml
  text: Who has put wisdom in the inward parts[a], or who has given understanding to the mind?
translation:
  language: te
  text: 'అంతర్భాగాల్లో జ్ఞానాన్ని ఉంచినవాడు ఎవరు?[a]


    లేదా మనస్సుకు వివేచనను ఇచ్చినవాడు ఎవరు?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దాగిన అంతర్భాగాల్లో జ్ఞానాన్ని ఉంచినవాడు ఎవరు? కోడికి వివేచనను ఇచ్చినవాడు ఎవరు?” రెండో పదం మనస్సును కాక ఒక పక్షిని—సాంప్రదాయంగా కోడిని, కొన్నిసార్లు ఐబిస్ పక్షిని—సూచిస్తుందని కొందరు భావిస్తారు.
    reason: మూలంలోని בַּטֻּחוֹת, שֶׂכְוִי పదాల అర్థాలు వివాదాస్పదమైనవి; సాధ్యమైన అంతర్భాగం/పక్షి పఠనాన్ని సంరక్షించడం.
lexical_decisions:
- source_word: מִי
  choice: ఎవరు?
  rationale: దేవుని అలంకారిక ప్రశ్నను సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: שָׁת
  choice: ఉంచినవాడు
  rationale: ‘పెట్టడం/స్థాపించడం’ అనే మూలభావాన్ని నిలుపుతూ, రెండో పాదంలోని ‘ఇచ్చినవాడు’తో సమాంతరతను కాపాడుతుంది.
- source_word: בַּטֻּחוֹת
  choice: అంతరంగంలో
  rationale: అర్థం కష్టమైన ఈ పదం లోపలి అవయవాలు లేదా దాగిన అంతర్భాగాన్ని సూచించవచ్చు. ఆధునిక పాఠకుడిని తప్పుదారి పట్టించే అతి అక్షరార్థమైన ‘మూత్రపిండాల్లో’కు బదులు శరీరాధారిత అంతర్భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: חָכְמָה
  choice: జ్ఞానాన్ని
  rationale: ఈ సందర్భంలో חָכְמָהకు ప్రామాణికమైన, సహజమైన తెలుగు సమానార్థకం.
- source_word: אוֹ
  choice: (రెండో సమాంతర ప్రశ్నగా)
  rationale: హీబ్రూలోని ‘లేదా’ సమాంతర పాదాలను కలుపుతుంది. తెలుగులో రెండు వరుస ప్రశ్నలుగా ఇవ్వడం సహజంగా ఉండి అదే అలంకారిక సంబంధాన్ని వ్యక్తపరుస్తుంది.
- source_word: נָתַן
  choice: ఇచ్చినవాడు
  rationale: נתן యొక్క సాధారణ అర్థాన్ని ఇస్తూ మొదటి పాదంలోని ‘ఉంచినవాడు’తో సమాంతరంగా ఉంటుంది.
- source_word: לַשֶּׂכְוִי
  choice: మనసుకు
  rationale: వివాదాస్పదమైన ఈ పదాన్ని, మొదటి పాదంలోని ‘అంతరంగం’తో ఉన్న సమాంతరత ప్రకారం అంతర్గత గ్రహణశక్తిగా అనువదిస్తుంది; పక్షిని సూచించే ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో నిలుపుతుంది.
- source_word: בִינָה
  choice: వివేచనను
  rationale: ‘అవగాహన/విచక్షణ’ భావాన్ని వ్యక్తపరుస్తూ ‘జ్ఞానం’తో ఉన్న సున్నితమైన అర్థభేదాన్ని కాపాడుతుంది.
theological_decisions:
- issue: దైవిక జ్ఞానప్రసంగ సందర్భంలోని రెండు క్లిష్టమైన పదాలు మానవ అంతర్గత సామర్థ్యాలనో, జీవుల సహజజ్ఞానాన్నో సూచిస్తాయా?
  choice: దేవుడు మానవ అంతరంగానికి జ్ఞానాన్నీ మనసుకు వివేచననూ ఇచ్చాడనే పఠనం.
  alternative: దేవుడు కోడి లేదా ఐబిస్ వంటి పక్షికి సహజజ్ఞానం ఇచ్చాడనే పఠనం.
  rationale: ‘అంతరంగం // మనసు’ మరియు ‘జ్ఞానం // వివేచన’ అనే కవితా సమాంతరత అంతర్గత సామర్థ్యాల పఠనానికి బలం ఇస్తుంది. అయితే పక్షిని సూచించే ప్రాచీన ప్రత్యామ్నాయ పఠనం సాధ్యమైనందున దాన్ని తొలగించకుండా పాదటిప్పణిలో పేర్కొనబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యేలా, అయినా దైవిక ప్రసంగానికి తగిన గంభీరతతో రెండు సమాంతర అలంకారిక ప్రశ్నలుగా రూపొందించబడింది.
