source:
  edition: WLC
  text: בְּ/רָן יַ֭חַד כּ֣וֹכְבֵי בֹ֑קֶר וַ֝/יָּרִ֗יעוּ כָּל בְּנֵ֥י אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/038/007.yaml
  text: when the morning stars sang together[a], and all the sons of God shouted for joy?
translation:
  language: te
  text: 'ఉదయ నక్షత్రాలు కలిసి పాడగా,

    దేవుని కుమారులందరూ[a] ఆనందంతో జయధ్వానాలు చేశారు?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా “పరలోక జీవులు”; లేదా “దేవదూతలు.” హీబ్రూలో: “దేవుని కుమారులు.”'
    reason: בְּנֵי אֱלֹהִים అనే హీబ్రూ పదబంధానికి సాధ్యమైన సందర్భార్థాలను తెలియజేస్తూ, ప్రధాన పాఠంలోని అక్షరార్థ అనువాదాన్ని స్పష్టం చేయడం.
lexical_decisions:
- source_word: בְּ/רָן
  choice: పాడినప్పుడు
  rationale: רנן అనే క్రియ ఉల్లాసభరితమైన గానం లేదా ఆనందధ్వనిని సూచిస్తుంది. ముందు ఉన్న בְּ ఉపసర్గ ఈ సందర్భంలో కాలార్థక ఉపవాక్యాన్ని ఏర్పరుస్తుంది; అందువల్ల ‘పాడినప్పుడు’ సహజంగా ఉంది.
- source_word: יַחַד
  choice: ఏకంగా
  rationale: יַחַד సమిష్టిత్వాన్ని లేదా ఒకే సమయంలో చేయడాన్ని సూచిస్తుంది. ‘ఏకంగా’ కవితాత్మకంగానూ సహజంగానూ ఆ భావాన్ని నిలుపుతుంది.
- source_word: כּוֹכְבֵי בֹקֶר
  choice: ఉదయ నక్షత్రాలు
  rationale: అక్షరార్థంగా ‘ఉదయపు నక్షత్రాలు.’ ‘ఉదయ నక్షత్రాలు’ మూలంలోని కవితాత్మక రూపకాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: וַ/יָּרִיעוּ
  choice: ఆనందంతో కేకలు వేసినప్పుడు
  rationale: హిఫిల్ రూపంలోని ריע ఉల్లాసంగా పెద్దగా ధ్వని చేయడం లేదా జయధ్వని చేయడం అనే అర్థాన్ని ఇస్తుంది. సమాంతర పాదంలోని గానానికి అనుగుణంగా ‘ఆనందంతో కేకలు వేశారు’ అనే భావం సరిపోతుంది; తెలుగు వాక్యనిర్మాణంలో ముందు కాలార్థక ఉపవాక్యంతో సమన్వయానికి ‘వేసినప్పుడు’ వాడబడింది.
- source_word: כָּל
  choice: అందరూ
  rationale: כָּל సమూహంలోని సంపూర్ణతను నొక్కిచెబుతుంది. వ్యక్తులను సూచించే ఈ సందర్భంలో ‘అందరూ’ సహజమైన తెలుగు రూపం.
- source_word: בְּנֵי אֱלֹהִים
  choice: దేవుని కుమారులు
  rationale: ఇది హీబ్రూ పదబంధానికి నేరమైన అనువాదం. యోబు గ్రంథ సందర్భంలో పరలోక జీవులను సూచించే అవకాశం ఉన్నా, ప్రధాన పాఠంలో దానిని వ్యాఖ్యానాత్మకంగా ‘దేవదూతలు’ అని మార్చకుండా మూలంలోని భావ ఉద్రిక్తతను నిలుపుతుంది.
theological_decisions:
- issue: בְּנֵי אֱלֹהִים అనే వారి గుర్తింపు
  choice: ప్రధాన పాఠంలో ‘దేవుని కుమారులు’
  alternative: ‘పరలోక జీవులు’ లేదా ‘దేవదూతలు’
  rationale: యోబు గ్రంథంలో ఈ పదబంధం పరలోక సభకు చెందిన జీవులను సూచించవచ్చు. అయినా ‘దేవదూతలు’ అనడం గుర్తింపును ముందుగానే నిర్ణయిస్తుంది. అక్షరార్థ రూపాన్ని ప్రధాన పాఠంలో ఉంచి, సాధ్యమైన అర్థాలను పాదసూచికలో ఇవ్వడం మూలంలోని వేదాంతపరమైన ఉద్రిక్తతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా కవితాత్మక గాంభీర్యాన్ని నిలుపుతూ అనువదించబడింది. మూలంలోని ప్రశ్నార్థక కొనసాగింపును అలాగే ఉంచింది.
