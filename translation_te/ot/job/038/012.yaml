  text: הְֽ֭/מִ/יָּמֶי/ךָ צִוִּ֣יתָ בֹּ֑קֶר ידעתה שחר מְקֹמֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/038/012.yaml
  text: Have you[a], in your days, commanded the morning[b], and caused the dawn to know its place?
translation:
  language: te
  text: నీ జీవితకాలంలో ఎప్పుడైనా[a] ఉదయానికి ఆజ్ఞ ఇచ్చి, వేకువకు దాని స్థానం తెలిసేలా చేశావా?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పదబంధానికి అక్షరార్థం ‘నీ దినాలనుండి’; భావం ‘నీ జీవితం మొదలైనప్పటి నుంచి ఎప్పుడైనా.’
    reason: cultural_note
lexical_decisions:
- source_word: הֲמִיָּמֶיךָ
  choice: నీ జీవితకాలంలో ఎప్పుడైనా
  rationale: అక్షరార్థంగా ‘నీ దినాలనుండి’; ఇక్కడ యోబు జీవితం ప్రారంభమైనప్పటి నుంచి ఏ సమయంలోనైనా అనే ప్రశ్నార్థక భావం ఉంది. సహజమైన ఆధునిక తెలుగులో ఆ భావాన్ని స్పష్టంగా తెలిపింది.
- source_word: צִוִּיתָ
  choice: ఆజ్ఞాపించి
  rationale: సృష్టిపై అధికారంతో ఆదేశించడాన్ని సూచించే ‘ఆజ్ఞాపించు’ అనే ప్రధాన అర్థాన్ని నిలుపుతుంది.
- source_word: בֹּקֶר
  choice: ఉదయం
  rationale: ప్రతిరోజూ వచ్చే ఉదయాన్ని వ్యక్తీకరించి సంబోధించిన కవితాత్మక భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: יָדַעְתָּה
  choice: తెలియజేశావా
  rationale: హిఫీల్ causative రూపంలోని ‘తెలిసేలా చేయు/తెలియజేయు’ భావాన్ని నేరుగా వ్యక్తం చేస్తుంది.
- source_word: שַׁחַר
  choice: వేకువ
  rationale: ఉదయపు తొలి వెలుగు లేదా dawn అనే భావాన్ని తెలుపుతూ, సమాంతర పాదంలోని ‘ఉదయం’తో ఉన్న పదభేదాన్ని నిలుపుతుంది.
- source_word: מְקוֹמוֹ
  choice: దాని స్థానం
  rationale: ‘దాని చోటు’ అనే సాధారణ అర్థాన్ని అదనపు వ్యాఖ్యానం లేకుండా అందిస్తుంది; వేకువను వ్యక్తిగా చిత్రించే కవితాత్మకతను కూడా నిలుపుతుంది.
