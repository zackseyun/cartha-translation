translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనదిగానూ గంభీరమైనదిగానూ ఉంచబడింది. ‘ఉదయం’ మరియు ‘వేకువ’ అనే రెండు సమీపార్థక పదాలను వేర్వేరుగా అనువదించి హీబ్రూ కవితా సమాంతరతను కాపాడింది; వేకువకు స్థానం తెలిసేలా చేయడం అనే వ్యక్తీకరణను పరిష్కరించకుండా నిలిపింది.
