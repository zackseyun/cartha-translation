  source_fidelity: 'మొదటి పాదం הֲמִיָּמֶיךָ యొక్క జీవితకాల-పరిధి ప్రశ్నను, అలాగే צִוִּיתָ యొక్క అధికారపూర్వక ఆజ్ఞ భావాన్ని సరిగ్గా ప్రతిబింబిస్తుంది. అయితే יָדַעְתָּה హిఫీల్ కారణార్థకం: వేకువకు దాని స్థానం ‘తెలియజేయడం’ కంటే, దాని స్థానం ‘తెలిసేలా చేయడం’ మూలానికి మరింత సన్నిహితం.'
