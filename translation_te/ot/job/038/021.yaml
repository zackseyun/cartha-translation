lexical_decisions:
- source_word: יָדַעְתָּ
  choice: నీకు తెలుసు కదా
  rationale: ידע Qal perfect 2ms. సందర్భంలోని దేవుని వ్యంగ్యభరితమైన అలంకారప్రశ్నను సహజ తెలుగు వర్తమాన రూపంతో వ్యక్తం చేస్తుంది; భూతకాల భావం వ్యాకరణపరంగా సాధ్యమైనా, ఇక్కడ ఉద్దేశించిన వ్యంగ్యాన్ని ఇది మెరుగ్గా అందిస్తుంది.
- source_word: כִּי
  choice: కాబట్టి
  rationale: ముందటి అలంకారప్రశ్నకు వ్యంగ్యపూర్వక కారణాన్ని సూచిస్తుంది. తెలుగులో వాక్య ప్రవాహానికి అనుగుణంగా కారణవాచక సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: אָז
  choice: అప్పుడే
  rationale: ముందు ప్రస్తావించిన సృష్టి సంఘటనల కాలాన్ని సూచించే కాలవాచక క్రియావిశేషణం; ‘అప్పుడే’ ఆ కాలసూచనను స్పష్టంగా ఉంచుతుంది.
- source_word: תִּוָּלֵד
  choice: నీవు ... పుట్టావు
  rationale: ילד Niphal imperfect 2ms. ఈ వ్యంగ్య సందర్భంలో గతకాల సూచనతో వాడబడింది; యోబు ఆ సృష్టికాలంలోనే జీవించి ఉండాల్సిందన్న అసంభవ ఊహను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וּמִסְפַּר יָמֶיךָ
  choice: నీ రోజుల సంఖ్య
  rationale: సంయోజక అవ్యయంతో కూడిన construct chain ను తెలుగులో సహజమైన స్వామ్య నిర్మాణంగా, మూలంలోని ‘నీ రోజుల సంఖ్య’ అనే రూపానికి దగ్గరగా అనువదించింది.
- source_word: רַבִּים
  choice: చాలా గొప్పది
  rationale: ‘అనేకమైనవి/గొప్పది’ అనే అర్థ పరిధి కలిగిన బహువచన విశేషణం. ఇది భావపరంగా ‘రోజులు అనేకం’ అని సూచించినా, వ్యాకరణ కేంద్రపదమైన ‘సంఖ్య’కు అన్వయించి మూల నిర్మాణాన్ని నిలుపుతుంది.
