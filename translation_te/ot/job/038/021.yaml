    text: లేదా, “నీ రోజులు ఎన్నో ఉన్నాయి.” హీబ్రూ వాక్యం అక్షరార్థంగా, “నీ రోజుల సంఖ్య అనేకమైనది/ఎక్కువైనది” అని చెబుతుంది.
    reason: lexical_alternative
