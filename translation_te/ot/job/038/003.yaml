source:
  edition: WLC
  text: אֱזָר נָ֣א כְ/גֶ֣בֶר חֲלָצֶ֑י/ךָ וְ֝/אֶשְׁאָלְ/ךָ֗ וְ/הוֹדִיעֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/038/003.yaml
  text: Gird up your loins like a man[a]; I will question you[b], and you shall make it known to me.
translation:
  language: te
  text: పురుషునిలా నీ నడుము బిగించుకో[a]; నేను నిన్ను ప్రశ్నిస్తాను; నీవు నాకు తెలియజేయి[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “యోధునిలా నిన్ను నీవు సిద్ధపరచుకో.” హీబ్రూలో అక్షరార్థంగా “పురుషునిలా నీ నడుము బిగించుకో” అని ఉంది; ఇది దృఢంగా కార్యానికి సిద్ధపడడాన్ని సూచించే నుడికారం.
    reason: lexical_alternative
  - marker: b
    text: లేదా “నాకు జవాబివ్వి.” హీబ్రూ క్రియకు మరింత అక్షరార్థంగా “నాకు తెలియజేయి” అని అర్థం.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱזָר ... חֲלָצֶיךָ
  choice: నీ నడుము బిగించుకో
  rationale: నడుముకు వస్త్రాన్ని బిగించుకొని కార్యానికి సిద్ధపడే హీబ్రూ నుడికారంలోని దృశ్యరూపాన్నీ, దృఢంగా సిద్ధపడాలనే భావాన్నీ సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: נָא
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఇక్కడ ఇది మర్యాదపూర్వకమైన ‘దయచేసి’ కంటే ఆజ్ఞకు తక్షణత లేదా బలాన్ని చేర్చే కణం. తెలుగులో ఆ బలం ఆజ్ఞార్థక క్రియ ద్వారానే సహజంగా వ్యక్తమవుతుంది; ‘ఇప్పుడు’ అని పెడితే లేని కాలార్థం ప్రధానమయ్యే అవకాశం ఉంది.
- source_word: כְגֶבֶר
  choice: పురుషునిలా
  rationale: גֶּבֶר బలసూచన కలిగిన పురుషుణ్ణి సూచించగలదు. మూలంలోని పుంలింగ నిర్దిష్టతను నిలుపుతూ, ‘యోధునిలా’ అనే సాధ్యమైన భావాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: וְאֶשְׁאָלְךָ
  choice: నేను నిన్ను ప్రశ్నిస్తాను
  rationale: שׁאל యొక్క ప్రాథమిక భావం అడగడం. ఈ దైవిక సవాలు సందర్భంలో వరుసగా ప్రశ్నించడాన్ని ‘ప్రశ్నిస్తాను’ సహజంగా తెలియజేస్తుంది.
- source_word: וְהוֹדִיעֵנִי
  choice: నీవు నాకు తెలియజేయి
  rationale: ידע యొక్క హిఫీల్ రూపం అక్షరార్థంగా ‘తెలిసేలా చేయి/తెలియజేయి’ అని అర్థం. సాంప్రదాయ ‘నాకు జవాబివ్వు’ కంటే ఇది మూల క్రియను మరింత నేరుగా ప్రతిబింబిస్తుంది.
theological_decisions:
- issue: దైవిక సవాలులోని లింగసూచక ఉపమానం
  choice: పురుషునిలా
  alternative: యోధునిలా / బలవంతునిలా
  rationale: మూలంలో పుంలింగ ఏకవచనమైన גֶּבֶר ఉంది. అందువల్ల దానిని లింగతటస్థంగా మార్చలేదు. ఈ నుడికారం ధైర్యంగా, దృఢంగా సిద్ధపడమనే సవాలును వ్యక్తం చేస్తుంది; పురుషుల ఆధిక్యాన్ని బోధించే సిద్ధాంత ప్రకటనగా దాన్ని విస్తరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన, నేరుగా సవాలు చేసే ధోరణి వాడబడింది. దేవుడు యోబును ఏకవచనంలో సంబోధిస్తున్నందున ‘నీ/నిన్ను/నీవు’ రూపాలు నిలుపబడ్డాయి. మూలంలోని శరీరాధారిత నుడికారాన్ని పూర్తిగా వివరణాత్మకంగా మార్చకుండా పాఠ్యంలో ఉంచి, దాని భావాన్ని పాదసూచికలో స్పష్టం చేశాం.
