  yaml_path: translation/ot/job/038/030.yaml
  text: The waters are hidden like stone[b][a], and the surface of the deep is frozen.
translation:
  language: te
  text: జలాలు రాయిలా గట్టిపడతాయి[a]; అగాధ జలాల ఉపరితలం బిగుసుకుపోతుంది[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “జలాలు రాయిలా తమను తాము దాచుకుంటాయి.” ఇక్కడి హీబ్రూ క్రియ అసాధారణంగా వాడబడింది; జలాలు గడ్డకట్టి గట్టిపడటాన్ని ఇది సూచిస్తున్నట్లు సందర్భం తెలియజేస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా “అగాధ జలాల ఉపరితలం గడ్డకడుతుంది,” లేక “ఒకటిగా బంధింపబడుతుంది.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּאֶבֶן
  choice: రాయిలా
  rationale: כ ఉపసర్గ పోలికను సూచిస్తుంది. కాబట్టి రూపాంతరాన్ని సూచించే ‘రాయిగా’ కంటే పోలికను నిలిపే ‘రాయిలా’ సరైనది.
- source_word: מַיִם
  choice: జలాలు
  rationale: మూలంలో బహువచన రూపం ఉన్నప్పటికీ ఇది నీటిని సూచించే సమూహార్థక పదం. కావ్యాత్మక సందర్భానికి ‘జలాలు’ సహజంగా సరిపోతుంది.
- source_word: יִתְחַבָּאוּ
  choice: గట్టిపడతాయి
  rationale: ఈ క్రియ సాధారణంగా ‘తమను తాము దాచుకొను’ అని అర్థమిస్తుంది. అయితే ‘రాయిలా’ అనే పోలిక, సమాంతర పాదంలోని బిగుసుకుపోవడం అనే భావం చలివల్ల నీరు గట్టిపడటాన్ని సూచిస్తున్నాయి. అసాధారణమైన మూలపద ప్రయోగాన్ని పాదసూచికలో నిలిపాం.
- source_word: וּפְנֵי
  choice: ఉపరితలం
  rationale: జలాలకు సంబంధించినప్పుడు ‘ముఖం’ అనే హీబ్రూ రూపకం సహజంగా ‘ఉపరితలం’ అనే అర్థాన్నిస్తుంది.
- source_word: תְהוֹם
  choice: అగాధ జలాలు
  rationale: תהום అంటే లోతైన, అగాధమైన జలరాశి. కేవలం ‘అగాధం’ కంటే ‘అగాధ జలాలు’ ఈ సందర్భంలోని జలసంబంధ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: יִתְלַכָּדוּ
  choice: బిగుసుకుపోతుంది
  rationale: ఈ క్రియ పట్టుబడటం, కలసి బంధింపబడటం లేదా గట్టిగా కూడిపోవటం అనే భావాలను కలిగిస్తుంది. ‘బిగుసుకుపోతుంది’ ఆ రూపకాన్ని నిలుపుతూ గడ్డకట్టే దృశ్యాన్ని సహజంగా వ్యక్తం చేస్తుంది.
