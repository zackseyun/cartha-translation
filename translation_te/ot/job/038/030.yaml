translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన కావ్య శైలి వాడబడింది. మొదటి పాదంలో సందర్భానుగుణమైన గడ్డకట్టే భావాన్ని ప్రధాన పాఠ్యంలో ఇచ్చి, హీబ్రూ క్రియలోని ‘దాచుకొను’ అనే అసాధారణ అక్షరార్థాన్ని పాదసూచికలో భద్రపరిచాం; రెండో పాదంలో రూపకాన్ని పూర్తిగా సమతలీకరించకుండా ‘బిగుసుకుపోతుంది’ అని అనువదించాం.
