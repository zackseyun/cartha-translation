  text: הֲ/תֹצִ֣יא מַזָּר֣וֹת בְּ/עִתּ֑/וֹ וְ֝/עַ֗יִשׁ עַל בָּנֶ֥י/הָ תַנְחֵֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/038/032.yaml
  text: Can you bring out the Mazzaroth in its season[b][a], or guide Ayish along with her children?
translation:
  language: te
  text: 'మజ్జారోత్‌ను దాని కాలంలో నీవు బయటికి రప్పించగలవా?[a]

    లేక అయిషును ఆమె పిల్లలతో పాటు నడిపించగలవా?[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “మజ్జారోత్” అనేది అరుదైన హీబ్రూ ఖగోళ పదం; ఇది నక్షత్రరాశులను లేదా రాశిచక్రాన్ని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “అయిషు” అనేది ఒక హీబ్రూ నక్షత్రం లేదా నక్షత్రరాశి పేరు. కొన్ని అనువాదాల్లో సంప్రదాయంగా దీనిని “ఆర్క్టూరస్” అని ఇచ్చారు; చాలామంది దీనిని “ఎలుగుబంటి” నక్షత్రరాశిగా భావిస్తారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתֹצִיא
  choice: నీవు బయటికి రప్పించగలవా?
  rationale: יצא అనే క్రియ యొక్క హిఫీల్ రూపం ఇక్కడ ఆకాశ సమూహాన్ని కనిపించేలా బయటికి తీసుకురావడం అనే కారణార్థాన్ని సూచిస్తుంది; ప్రశ్న యొక్క అలంకారిక స్వభావాన్నీ నిలుపుతుంది.
- source_word: מַזָּרוֹת
  choice: మజ్జారోతు
  rationale: ఇది అరుదైన, ఖచ్చితార్థం తెలియని ఖగోళ పదం. ‘రాశిచక్రం’ లేదా ‘నక్షత్రరాశులు’ అని నిర్దిష్టం చేయకుండా హీబ్రూ పేరును లిప్యంతరీకరించడం మూలంలోని అస్పష్టతను కాపాడుతుంది.
- source_word: בְּעִתּוֹ
  choice: దాని కాలంలో
  rationale: ఆకాశ సమూహం కనిపించడానికి తగిన లేదా నియమిత సమయాన్ని సూచిస్తుంది. ‘దాని కాలంలో’ అనేది భావాన్ని సహజంగా, అతివ్యాఖ్యానం లేకుండా అందిస్తుంది.
- source_word: וְעַיִשׁ
  choice: అయిషు
  rationale: ఇది ఖచ్చితంగా గుర్తించలేని హీబ్రూ నక్షత్రం లేదా నక్షత్రరాశి పేరు. సంప్రదాయంగా ఇచ్చే ‘ఆర్క్టూరస్’ లేదా సాధ్యమైన ‘ఎలుగుబంటి’ అనే గుర్తింపులను ప్రధాన పాఠ్యంలో నిర్బంధించకుండా లిప్యంతరీకరించబడింది.
- source_word: עַל־בָּנֶיהָ
  choice: దాని పిల్లలతో కూడ
  rationale: మూలంలో అక్షరార్థంగా ‘ఆమె పిల్లలతో’ ఉంది; సందర్భంలో ఇవి వెంట ఉండే నక్షత్రాలు కావచ్చు. తెలుగులో ఖగోళ నామానికి సహజమైన నపుంసక సర్వనామాన్ని వాడుతూ కుటుంబ రూపకాన్ని ‘పిల్లలు’గా నిలిపాము.
- source_word: תַנְחֵם
  choice: నడిపించగలవా?
  rationale: נחה హిఫీల్ రూపం ‘నడిపించు/మార్గం చూపు’ అని అర్థం. ఆకాశంలో నక్షత్రరాశిని దాని అనుచర నక్షత్రాలతో నడిపించే చిత్రాన్ని ‘నడిపించు’ సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. అరుదైన ఖగోళ నామాలను లిప్యంతరీకరించి, వాటి అనిశ్చిత గుర్తింపులను పాదసూచికల్లో ఉంచాం. రెండు పాదసూచిక గుర్తులూ సంబంధిత పేర్ల వెంట ప్రధాన పాఠ్యంలో ఉన్నాయి.
