source:
  edition: WLC
  text: הֲ/תָרִ֣ים לָ/עָ֣ב קוֹלֶ֑/ךָ וְֽ/שִׁפְעַת מַ֥יִם תְּכַסֶּֽ/ךָּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/038/034.yaml
  text: Can you raise your voice to the clouds[b][a], so that an abundance of water covers you?
translation:
  language: te
  text: 'మేఘం వైపు నీ స్వరాన్ని పైకెత్తగలవా,[a]

    దానివల్ల జలసమృద్ధి నిన్ను కప్పివేస్తుందా?[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దట్టమైన మేఘానికి.’ హీబ్రూ నామవాచకం ఏకవచనంలో ఉంది; అది దట్టమైన వర్షమేఘాన్ని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘మరియు జలప్రవాహం నిన్ను కప్పివేస్తుందా?’ హీబ్రూ పదబంధం పొంగిపొర్లే జలసమృద్ధిని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתָרִים
  choice: వినిపించగలవా
  rationale: రום ధాతువు హిఫీల్ రూపానికి అక్షరార్థంగా ‘పైకెత్తగలవా’ అని ఉన్నా, ‘స్వరం’తో కలిసినప్పుడు తెలుగులో ‘నీ స్వరం వినిపించగలవా’ అనేది స్వరాన్ని మేఘం వైపు పైకెత్తి పిలిచే భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: לָעָב
  choice: మేఘానికి
  rationale: עָב ఏకవచనంలో మేఘాన్ని, ముఖ్యంగా దట్టమైన వర్షమేఘాన్ని సూచించగలదు. మూలంలోని ఏకవచనాన్ని నిలిపి ఉంచేందుకు ‘మేఘానికి’ ఎంచుకోబడింది.
- source_word: קוֹלֶךָ
  choice: నీ స్వరం
  rationale: קוֹל ఇక్కడ పైకి పిలిచే వ్యక్తి స్వరాన్ని సూచిస్తుంది; ‘నీ స్వరం’ నేరుగా, సహజంగా ఉంది.
- source_word: וְשִׁפְעַת מַיִם
  choice: అప్పుడు జలసమృద్ధి
  rationale: שִׁפְעָה సమృద్ధి, విస్తారం లేదా పొంగిపొర్లే పరిమాణాన్ని సూచిస్తుంది. ‘జలసమృద్ధి’ అధిక పరిమాణ భావాన్ని నిలుపుతూ తప్పనిసరిగా విధ్వంసకరమైన వరద అని నిర్ణయించదు.
- source_word: תְּכַסֶּךָּ
  choice: నిన్ను కప్పివేస్తుందా
  rationale: כסה పియేల్ రూపం ‘కప్పివేయడం’ అనే బలమైన భావాన్ని ఇస్తుంది; రెండవ పురుష ఏకవచన ప్రత్యయం ‘నిన్ను’గా స్పష్టంగా అనువదించబడింది.
theological_decisions:
- issue: రెండు ఉపవాక్యాల మధ్య సంబంధం
  choice: రెండవ ఉపవాక్యాన్ని మొదటి చర్య ఫలితంగా సూచించే ‘అప్పుడు’తో అనుసంధానించడం
  alternative: సాధారణ సమన్వయంగా ‘మరియు జలసమృద్ధి నిన్ను కప్పివేస్తుందా?’
  rationale: హీబ్రూ וְ సమన్వయాన్నీ, సందర్భానుసార ఫలితాన్నీ అనుమతిస్తుంది. దేవుని వాతావరణాన్ని నియంత్రించగల మానవ సామర్థ్యంపై ఉన్న అలంకారిక ప్రశ్నలో ‘అప్పుడు’ ఫలిత సంబంధాన్ని సహజంగా చూపుతుంది; అయినా సమన్వయ పఠనాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; దేవుని సవాలుతో కూడిన అలంకారిక ప్రశ్నను గంభీరంగా, సాధారణ పాఠకులకు సహజంగా ఉంచింది. మూలంలోని ఏకవచన ‘మేఘం’ను ప్రధాన పాఠ్యంలో నిలిపి, దట్టమైన మేఘం మరియు పొంగిపొర్లే జలప్రవాహం అనే భావాలను పాదసూచికల్లో ఇచ్చింది.
