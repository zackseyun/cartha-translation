  text: Who is this who darkens counsel with words without knowledge?[a]
translation:
  language: te
  text: “జ్ఞానం లేని మాటలతో ఆలోచనను[a] మసకబార్చుతున్నవాడెవడు?”
  philosophy: optimal-equivalence
  footnotes:
