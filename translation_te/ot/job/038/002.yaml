    text: లేదా “ప్రణాళికను,” “సంకల్పాన్ని.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי זֶה
  choice: ఇతడెవడు
  rationale: ప్రశ్నలోని సవాలు, ఎదుర్కొనే ధోరణి సహజమైన ఆధునిక తెలుగులో నిలిచేలా ఈ రూపాన్ని ఎంచుకున్నాం.
- source_word: מַחְשִׁיךְ
  choice: చీకటి కమ్ముతున్న
  rationale: ‘చీకటిగా చేయడం’ అనే హీబ్రూ రూపకాన్ని నిలుపుతూ, తెలుగులో సహజంగా వినిపించే ప్రయోగాన్ని వాడాం.
- source_word: עֵצָה
  choice: ఆలోచన
  rationale: ఈ పదంలో వివేకపూర్వక ఆలోచన, ప్రణాళిక, సంకల్పం అనే భావాలు ఉండవచ్చు. ‘ఆలోచన’ వాటిలో ఒక్కదానికే అర్థాన్ని పరిమితం చేయకుండా తగిన విస్తృతిని ఉంచుతుంది.
- source_word: בְמִלִּין
  choice: మాటలతో
  rationale: בְ ఇక్కడ సాధనార్థకంగా ఉంది; చీకటి కమ్మే సాధనం మాటలేనని సహజంగా తెలియజేస్తుంది.
- source_word: בְּלִי דָעַת
  choice: జ్ఞానం లేని
  rationale: హీబ్రూ పదబంధంలోని ‘జ్ఞానం లేకపోవడం’ అనే ప్రత్యక్ష భావాన్ని వ్యాఖ్యానాత్మకంగా మార్చకుండా నిలుపుతుంది.
theological_decisions:
- issue: దైవ ప్రసంగంలో עֵצָה పదార్థం
  choice: ఆలోచన
  alternative: ప్రణాళిక; సంకల్పం
  rationale: దేవుడు నిజమైన జ్ఞానాన్ని మరుగుపరచే మాటలను గద్దిస్తున్నాడు; అదే సమయంలో దైవ ప్రణాళిక లేదా సంకల్పం కూడా భావంలో ఉండవచ్చు. ప్రధాన పాఠం ఏ ఒక్క అర్థాన్నీ బలవంతంగా ఖరారు చేయకుండా భావ విస్తృతిని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గంభీరమైన దైవిక సవాలు స్పష్టంగా వినిపించేలా అనువదించాం. మూలంలోని చీకటి రూపకాన్ని నిలిపి, తెలుగులో అసహజమైన ‘చీకటిమయం చేయడం’కు బదులుగా ‘చీకటి కమ్మడం’ వాడాం.
