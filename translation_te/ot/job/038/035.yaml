  edition: WLC
  text: הַֽ/תְשַׁלַּ֣ח בְּרָקִ֣ים וְ/יֵלֵ֑כוּ וְ/יֹאמְר֖וּ לְ/ךָ֣ הִנֵּֽ/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/038/035.yaml
  text: Can you send out lightnings so that they go and say to you[a], ‘Here we are’ ?
translation:
  language: te
  text: నీవు మెరుపులను[a] పంపగలవా—అవి వెళ్లి నీకు, ‘ఇదిగో, మేమున్నాం’ అని చెబుతాయా?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మెరుపు పిడుగులను.’ హీబ్రూ పదం బహువచనంలో ఉంది; మెరుపులు ఆజ్ఞకు లోబడే దూతల్లా చిత్రించబడ్డాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתְשַׁלַּח
  choice: పంపగలవా
  rationale: ప్రశ్నార్థక హֲ మరియు హిఫీల్ అసంపూర్ణ క్రియ కలిపి యోబు సామర్థ్యాన్ని సవాలు చేసే అలంకారిక ప్రశ్నను వ్యక్తం చేస్తున్నాయి. ‘పంపగలవా’ ఆ భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: בְּרָקִים
  choice: మెరుపులను
  rationale: హీబ్రూలో ఇది బహువచనం. తెలుగు సామాన్య వాడుకలో ‘మెరుపులు’ సహజంగా ఉండి, తరువాత వచ్చే కదలిక మరియు మాటల వ్యక్తీకరణకు అనుకూలంగా ఉంటుంది.
- source_word: וְיֵלֵכוּ
  choice: అవి వెళ్లి
  rationale: వావ్‌తో కూడిన అసంపూర్ణ క్రియ పంపబడిన మెరుపుల తదుపరి చర్యను సూచిస్తుంది. ‘అవి వెళ్లి’ క్రమాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: וְיֹאמְרוּ לְךָ
  choice: నీతో అంటాయా
  rationale: మెరుపులు విధేయ దూతల్లా మాట్లాడుతున్న కావ్యాత్మక వ్యక్తీకరణను కాపాడుతుంది; לְךָ యొక్క ఏకవచన సంబోధనను ‘నీతో’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: הִנֵּנוּ
  choice: ఇదిగో, మేమున్నాం
  rationale: సన్నద్ధతతో హాజరై ఉన్నామని తెలిపే హీబ్రూ జవాబును సహజంగా, గంభీరంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: దేవుని ప్రసంగంలో మెరుపుల వ్యక్తీకరణ
  choice: మెరుపులు ‘వెళ్తాయి,’ ‘అంటాయి’ అనే వ్యక్తీకరణను యథాతథంగా నిలుపడం
  alternative: ప్రకృతి దేవుని ఆధీనంలో ఉందనే సాధారణ వివరణగా వ్యక్తీకరణను తొలగించడం
  rationale: మూల హీబ్రూ మెరుపులను ఆజ్ఞకు లోబడే దూతల్లా చిత్రిస్తుంది. ఈ కావ్యరూపాన్ని నిలపడం వాటికి అక్షరార్థమైన చైతన్యం ఉందని బోధించకుండా, సృష్టిపై దేవుని అధికారాన్ని స్పష్టంగా చూపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ దైవ ప్రసంగానికి తగిన గంభీరతను ఉంచింది. ఏకవచన సంబోధనకు ‘నువ్వు/నీతో’ వాడబడింది. దీర్ఘ గీత ఒకే అలంకారిక ప్రశ్నలో పంపడం, వెళ్లడం, జవాబివ్వడం అనే వరుసను అనుసంధానిస్తుంది.
