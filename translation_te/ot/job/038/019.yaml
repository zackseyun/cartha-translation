  text: Where is the way to the dwelling of light[a], and where is the place of darkness,
translation:
  language: te
  text: వెలుగు నివసించే చోటుకు వెళ్లే మార్గం ఎక్కడ ఉంది? చీకటి ఉండే స్థలం ఎక్కడ ఉంది?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵי זֶה
  choice: ఎక్కడ ఉంది?
  rationale: ఈ ప్రశ్నార్థక పదబంధం స్థలాన్ని లేదా దిశను అడుగుతుంది. ఆధునిక తెలుగులో ‘ఎక్కడ ఉంది?’ సహజంగా దాని భావాన్ని తెలియజేస్తుంది.
- source_word: הַדֶּרֶךְ
  choice: వెళ్లే మార్గం
  rationale: דֶּרֶךְ అంటే మార్గం, దారి. ‘వెళ్లే మార్గం’ అని చెప్పడం ద్వారా వెలుగు నివసించే చోటుకు చేరే దారి అనే వాక్యసంబంధం స్పష్టంగా, సహజంగా నిలుస్తుంది.
- source_word: יִשְׁכָּן
  choice: నివసించే
  rationale: שׁכן అంటే నివసించడం, స్థిరపడడం. వెలుగుకు నివాసం ఉన్నట్లు వ్యక్తీకరించే మూలభాషలోని కావ్యరూపాన్ని ‘నివసించే’ నిలుపుతుంది.
- source_word: אוֹר
  choice: వెలుగు
  rationale: చీకటికి వ్యతిరేకంగా ఉన్న విశ్వసంబంధ వెలుగుకు ప్రామాణికమైన తెలుగు పదం.
- source_word: וְחֹשֶׁךְ
  choice: చీకటి
  rationale: సంయోజకంతో వచ్చిన ఈ నామవాచకం మొదటి భాగంలోని వెలుగుతో సమాంతరమైన వ్యత్యాసాన్ని ఏర్పరుస్తుంది. తెలుగులో రెండో ప్రశ్నగా సహజంగా అమర్చబడింది.
- source_word: מְקֹמוֹ
  choice: ఉండే స్థలం
  rationale: מָקוֹם అంటే స్థలం; ప్రత్యయం ‘దాని’ అని చీకటిని సూచిస్తుంది. ‘చీకటి ఉండే స్థలం’ అనే రూపం ఆ స్వామ్యభావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన రెండు ప్రశ్నలుగా అనువదించబడింది. వెలుగు ‘నివసిస్తుంది’ అనే మూలంలోని వ్యక్తీకరణను నిలిపి, కవితాత్మక గంభీరతను కాపాడింది.
