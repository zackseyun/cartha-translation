  text: הֲ֭/יָדַעְתָּ חֻקּ֣וֹת שָׁמָ֑יִם אִם תָּשִׂ֖ים מִשְׁטָר֣/וֹ בָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/038/033.yaml
  text: Do you know the ordinances of the heavens? Can you establish their rule on the earth?[a]
translation:
  language: te
  text: ఆకాశాల నియమాలు నీకు తెలుసా? భూమిపై వాటి అధికారాన్ని నీవు స్థాపించగలవా?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దాని ఆధిపత్యాన్ని” లేదా “దాని అధికారాన్ని.” హీబ్రూ ప్రత్యయం ఏకవచనంలో ఉంది; అది బహుశా ఆకాశాలను ఒక సమష్టిగా సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיָדַעְתָּ
  choice: నీకు తెలుసా?
  rationale: ప్రశ్నార్థక הֲతో కూడిన ידע క్రియ ఇక్కడ ప్రస్తుత జ్ఞానాన్ని సవాలు చేస్తోంది; ఆధునిక తెలుగులో ‘నీకు తెలుసా?’ సహజంగా, నేరుగా ఆ భావాన్ని అందిస్తుంది.
- source_word: חֻקּוֹת
  choice: నియమాలు
  rationale: חק మూలంలోని ఈ పదం నిర్ణయించబడిన హద్దులు లేదా స్థిరమైన విధానాలను సూచిస్తుంది. విశ్వ సందర్భంలో ‘నియమాలు’ సహజంగా ఉండి, కేవలం మానవ చట్టాల భావానికి పరిమితం చేయదు.
- source_word: שָׁמָיִם
  choice: ఆకాశాలు
  rationale: హీబ్రూ బహువచన రూపాన్ని నిలుపుతూ, నక్షత్రాలు మరియు ఖగోళ వ్యవస్థ ప్రస్తావనకు తగిన విస్తృత భావాన్ని ఇస్తుంది.
- source_word: אִם
  choice: -గలవా?
  rationale: ఇక్కడ אִם మొదటి ప్రశ్నకు సమాంతరమైన రెండవ ప్రశ్నను ప్రవేశపెడుతుంది. తెలుగులో సామర్థ్యాన్ని ప్రశ్నించే ‘గలవా?’ రూపం వాక్యంలోని అలంకారిక సవాలును సహజంగా వ్యక్తం చేస్తుంది.
- source_word: תָּשִׂים
  choice: స్థాపించగలవా
  rationale: שׂים ప్రాథమికంగా ‘పెట్టు/ఉంచు’ అయినప్పటికీ, పాలన లేదా అధికారంతో కలిసి ఇక్కడ దానిని అమలులో నిలపడం అనే భావం ఉంది; ‘స్థాపించు’ ఆ భావాన్ని స్పష్టంగా ఇస్తుంది.
- source_word: מִשְׁטָרוֹ
  choice: వాటి అధికారాన్ని
  rationale: מִשְׁטָר పాలన, ఆధిపత్యం లేదా అధికారం అనే భావాలను కలిగి ఉంది. హీబ్రూలో ప్రత్యయం ఏకవచనమైనా, అది ‘ఆకాశాలు’ అనే సమష్టిని సూచించే అవకాశం ఉంది; తెలుగులో బహువచన పూర్వపదానికి ‘వాటి’ సహజంగా సరిపోతుంది. ‘అధికారం’ పాలనా భావాన్ని నిలుపుతుంది.
- source_word: בָאָרֶץ
  choice: భూమిపై
  rationale: ఈ సందర్భంలో ב భూమండలంపై ఆకాశ నియమాల అధికారం అమలవడాన్ని సూచిస్తుంది; ‘భూమిపై’ సహజమైన తెలుగు ప్రయోగం.
theological_decisions:
- issue: ఆకాశ నియమాల స్వభావం
  choice: దేవుడు సృష్టిలో ఏర్పరచిన స్థిరమైన ఖగోళ నియమాలు, వాటి పాలనా అధికారం అనే సాధారణ భావాన్ని నిలుపడం
  alternative: నక్షత్రరాశులు భూలోక సంఘటనలను జ్యోతిషపరంగా నిర్ణయిస్తాయని ప్రత్యేకంగా అర్థం చేయడం
  rationale: సమీప సందర్భం నక్షత్రాలు, ఆకాశం గురించి మాట్లాడుతున్నా, హీబ్రూ పదాలు స్థిర నియమాలు మరియు పాలనా అధికారాన్ని మాత్రమే వ్యక్తం చేస్తాయి. అందువల్ల మూలంలో లేని జ్యోతిష నిర్ణయవాదాన్ని అనువాదంలో చేర్చలేదు.
- issue: מִשְׁטָרוֹలోని ఏకవచన ప్రత్యయం
  choice: ‘ఆకాశాలు’ అనే సమష్టికి అన్వయించి ప్రధాన పాఠ్యంలో ‘వాటి అధికారాన్ని’ అని అనువదించడం
  alternative: రూపసామ్యాన్ని నేరుగా నిలుపుతూ ‘దాని అధికారాన్ని’ అని అనువదించడం
  rationale: హీబ్రూ ప్రత్యయం వ్యాకరణపరంగా ఏకవచనం; అయితే అది ఆకాశాలను ఒక సమష్టిగా సూచించవచ్చు. సహజ తెలుగు కోసం బహువచన అన్వయాన్ని ప్రధాన పాఠ్యంలో ఉంచి, నిజమైన వ్యాకరణ సందిగ్ధతను పాదటిప్పణిలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే ప్రశ్నారూపాన్ని ఉపయోగించాం. దేవుని ప్రత్యక్ష సవాలును నిలుపడానికి ఏకవచన అనౌపచారిక ‘నువ్వు/నీకు’ రూపాలు వాడబడ్డాయి; అవి సందర్భంలోని ప్రత్యక్షతను తెలుగులో సహజంగా వ్యక్తం చేస్తాయి.
