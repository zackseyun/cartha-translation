  text: הֲ/נִגְל֣וּ לְ֭/ךָ שַׁעֲרֵי מָ֑וֶת וְ/שַׁעֲרֵ֖י צַלְמָ֣וֶת תִּרְאֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/038/017.yaml
  text: Have the gates of death been revealed to you[a], or have you seen the gates of deep darkness?
translation:
  language: te
  text: మరణ ద్వారాలు నీకు వెల్లడయ్యాయా? లేక గాఢాంధకారపు ద్వారాలను[a] నీవు చూశావా?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మరణ ఛాయ.’ హీబ్రూ పదమైన צַלְמָוֶת ను సంప్రదాయంగా ఈ విధంగా అనువదించారు; అయితే అది సాధారణంగా గాఢాంధకారాన్ని లేదా విషాదాంధకారాన్ని కూడా సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲ/נִגְלוּ
  choice: వెల్లడయ్యాయా?
  rationale: ప్రశ్నార్థక הֲ తో వచ్చిన גלה ధాతువు నిఫల్ సంపూర్ణ క్రియ యొక్క కర్మణి భావాన్ని నిలుపుతూ, దేవుడు అడిగే అలంకారిక ప్రశ్నను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: לְךָ
  choice: నీకు
  rationale: రెండవ పురుష ఏకవచన ప్రత్యయంతో కూడిన ఉపసర్గ, ద్వారాలు ఎవరికి వెల్లడయ్యాయనే ఉద్దేశిత వ్యక్తిని నేరుగా సూచిస్తుంది.
- source_word: שַׁעֲרֵי מָוֶת
  choice: మరణ ద్వారాలు
  rationale: హీబ్రూ సమాస నిర్మాణాన్ని సూటిగా నిలుపుతూ, మరణలోక ప్రవేశద్వారాల స్పష్టమైన కవితాత్మక చిత్రాన్ని కాపాడుతుంది.
- source_word: וְ/שַׁעֲרֵי
  choice: లేక ... ద్వారాలను
  rationale: וְ సాధారణంగా ‘మరియు’ అయినప్పటికీ, పరస్పర సమాంతరమైన రెండు అలంకారిక ప్రశ్నలను ఆధునిక తెలుగులో సహజంగా అనుసంధానించడానికి ‘లేక’ ఉపయోగించబడింది; ఇది ప్రశ్నార్థక బలాన్ని నిలుపుతుంది.
- source_word: צַלְמָוֶת
  choice: గాఢాంధకారం
  rationale: ఈ పదం మరణంతో సంబంధమున్న చీకటి చిత్రాన్ని కలిగి ఉన్నప్పటికీ, విస్తృతంగా తీవ్రమైన చీకటి లేదా విషాదాంధకారాన్ని కూడా సూచించగలదు. ‘గాఢాంధకారం’ ఆ అర్థపరిధిని అతిగా నిర్దిష్టం చేయకుండా కాపాడుతుంది.
- source_word: תִּרְאֶה
  choice: నీవు చూశావా?
  rationale: కవితాత్మక ప్రశ్నలోని రెండవ పురుష ఏకవచన అసంపూర్ణ క్రియను, ముందటి ప్రశ్నకు సమాంతరంగా సహజమైన తెలుగు భూతకాల ప్రశ్నగా అందిస్తుంది.
