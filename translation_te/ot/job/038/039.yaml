  yaml_path: translation/ot/job/038/039.yaml
  text: Do you hunt prey for the lioness[a], and satisfy the appetite of the young lions,
translation:
  language: te
  text: నువ్వు సింహం[a] కోసం ఎరను వేటాడతావా? యువ సింహాల ఆకలిని[b] తీర్చుతావా?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆడ సింహం.’ హీబ్రూ పదం సింహాన్ని లేదా ఆడ సింహాన్ని సూచించగలదు.
    reason: lexical_ambiguity
  - marker: b
    text: అక్షరార్థంగా, ‘యువ సింహాల జీవాన్ని నింపుతావా?’ ఇక్కడ వారి ఆకలి లేదా జీవావసరాన్ని తీర్చడం అనే భావం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲ/תָצוּד
  choice: వేటాడేది నువ్వేనా?
  rationale: ప్రశ్నార్థక הֲతో కూడిన צוד క్రియ యోబును ఉద్దేశించిన అలంకారిక ప్రశ్న. తెలుగు సహజ వాక్యనిర్మాణంలో ‘వేటాడేది నువ్వేనా?’ దేవుడే దీనిని చేస్తాడనే భావాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: לְ/לָבִיא
  choice: సింహం[a] కోసం
  rationale: לָבִיא మగ లేదా ఆడ సింహాన్ని సూచించగలదు. సందర్భం వల్ల ‘ఆడ సింహం’ సాధ్యమైనా, మూలంలోని లింగ అస్పష్టతను ప్రధాన పాఠ్యంలో ‘సింహం’గా నిలిపి, ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: טָרֶף
  choice: ఎరను
  rationale: ఈ పదం మాంసాహారి జంతువు వేటాడి తినే జీవిని లేదా మాంసాన్ని సూచిస్తుంది. ‘ఎర’ వేట సందర్భాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: וְ/חַיַּת
  choice: ఆకలిని[b]
  rationale: מלאతో కలిసి ఈ పదం యువ సింహాల జీవావసరం లేదా తినాలనే కోరిక నింపబడటాన్ని సూచిస్తుంది. తెలుగులో ‘ఆకలిని తీర్చడం’ సహజమైన భావానువాదం; అక్షరార్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: כְּפִירִים
  choice: యువ సింహాల
  rationale: כְּפִירִים అంటే పూర్తిగా ఎదగని యువ సింహాలు. ‘యువ సింహాలు’ మూలానికి దగ్గరగా ఉండి సాధారణ పాఠకులకు స్పష్టంగా ఉంటుంది.
- source_word: תְּמַלֵּא
  choice: తీర్చేది నువ్వేనా?
  rationale: מלא అక్షరార్థంగా ‘నింపు’ అని అర్థం. ‘ఆకలి’తో తెలుగులో ‘తీర్చు’ అనడం సహజమైన సమానార్థక ప్రయోగం.
theological_decisions:
- issue: సింహానికి ఆహారం సమకూర్చేది ఎవరు అనే అలంకారిక ప్రశ్న
  choice: దేవుడే సమకూరుస్తాడనే సూచనను ప్రశ్న రూపంలోనే ఉంచడం
  alternative: ‘దేవుడే వేటాడి ఆకలి తీరుస్తాడు’ అని వివరణాత్మక ప్రకటనగా మార్చడం
  rationale: మూలపాఠ్యం యోబును ప్రశ్నిస్తూ దేవుని సృష్టి పరిపాలనను సూచిస్తుంది; దానిని ప్రత్యక్ష సిద్ధాంత ప్రకటనగా మార్చకుండా మూలంలోని వాక్చాతుర్యాన్ని కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యే, గంభీరమైన ప్రశ్నారూపాన్ని ఉపయోగించాం. రెండు సమాంతర భాగాల్లో ‘నువ్వేనా?’ను పునరుక్తి చేయడం తెలుగు సహజత్వాన్ని, అలంకారిక బలాన్ని పెంచుతుంది.
