  yaml_path: translation/ot/job/038/018.yaml
  text: Have you comprehended the expanse of the earth? Tell me, if you know it all.
translation:
  language: te
  text: భూమి విస్తారాలను నీవు గ్రహించావా? భూమి అంతటినీ నీకు తెలుసైతే చెప్పు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִתְבֹּנַנְתָּ
  choice: నీవు గ్రహించావా
  rationale: ఈ క్రియ ఇక్కడ కేవలం చూడడాన్ని కాక, పరిశీలించి అవగాహన చేసుకోవడాన్ని సూచిస్తుంది; అందుకే సహజమైన ఆధునిక తెలుగులో ‘గ్రహించావా’ అని ఇచ్చాం.
- source_word: רַחֲבֵי אָרֶץ
  choice: భూమి విస్తారాలను
  rationale: బహువచన నిర్మాణం భూమి యొక్క విశాలమైన పరిమాణాలు లేదా విస్తృత ప్రదేశాలను సూచిస్తుంది; మూలంలోని విస్తృతి భావాన్ని నిలుపుతుంది.
- source_word: כֻלָּהּ
  choice: అదంతా
  rationale: స్త్రీలింగ ఏకవచన ప్రత్యయం సమీపంలోని ‘భూమి’ని తిరిగి సూచించవచ్చు; సందర్భంలో భూమి విస్తారమంతటినీ తెలిసిన భావాన్ని సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: దేవుని ప్రశ్నలోని జ్ఞానపరమైన సవాలు
  choice: రెండు అలంకారిక ప్రశ్నల తీవ్రతను అలాగే ఉంచడం
  alternative: యోబుకు తెలియదని వివరణాత్మక వాక్యంగా నేరుగా చెప్పడం
  rationale: మూలపాఠం దేవుని ప్రశ్న రూపంలోనే మానవ జ్ఞాన పరిమితిని ఎదుర్కొంటుంది; దాన్ని వ్యాఖ్యానంగా మార్చకుండా నిలుపుకున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనదైనా సాధారణ పాఠకులకు స్పష్టంగా ఉండే ప్రశ్నారూప శైలి. ‘విస్తారాలు’ మూలంలోని బహువచనాన్ని నిలుపుతుంది.
