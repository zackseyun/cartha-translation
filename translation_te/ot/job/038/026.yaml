  text: to make it rain on a land where no man is[a], on a wilderness in which there is no human,
translation:
  language: te
  text: 'మనిషి లేని నేలపైనా,

    మానవుడు లేని అరణ్యంపైనా[a] వర్షం కురిపించడానికి,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హెబ్రీలో ఇక్కడ సంబంధమున్నా భిన్నమైన రెండు పదాలు వాడబడ్డాయి: אִישׁ (‘మనిషి’) మరియు אָדָם (‘మానవుడు, మానవజాతి’).'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהַמְטִיר
  choice: వర్షం కురిపించడానికి
  rationale: హిఫీల్ క్రియారూపంలోని కారణార్థాన్ని సహజమైన ఆధునిక తెలుగులో ‘వర్షం కురిపించు’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: עַל אֶרֶץ
  choice: నేలపై
  rationale: ఇక్కడ אֶרֶץ భూగోళమంతటిని కాక, వర్షం పడే ఒక భూభాగాన్ని సూచిస్తుంది; ‘నేలపై’ తెలుగు కవితా సందర్భంలో సహజంగా ఉంది.
- source_word: לֹא אִישׁ
  choice: మనిషి లేని
  rationale: אִישׁ యొక్క ఏకవచన మానవ సూచనను సంక్షిప్తమైన అస్తిత్వార్థ పదబంధంతో నిలుపుతుంది.
- source_word: מִדְבָּר
  choice: అరణ్యం
  rationale: מִדְבָּר తప్పనిసరిగా ఇసుక ఎడారి మాత్రమే కాక, జనావాసం లేని బంజరు అరణ్యప్రాంతాన్ని సూచించగలదు; ‘అరణ్యం’ విస్తృత భావాన్ని ఇస్తుంది.
- source_word: לֹא אָדָם בּוֹ
  choice: నరమానవుడు లేని
  rationale: אָדָם యొక్క సాధారణ మానవజాతి భావాన్ని చూపిస్తూ, ముందున్న אִישׁతో ఉన్న సంబంధితమైనా భిన్నమైన పదప్రయోగాన్ని తెలుగులో సాధ్యమైనంతవరకు నిలుపుతుంది.
theological_decisions:
- issue: సాధారణ మానవత్వాన్ని సూచించే אָדָם అనువాదం
  choice: నరమానవుడు
  alternative: మనిషి / మానవజాతి
  rationale: ఈ సందర్భంలో אָדָם ఒక నిర్దిష్ట పురుషుణ్ణి కాక మానవుణ్ణి సాధారణంగా సూచిస్తుంది. ‘నరమానవుడు’ కవితా గంభీరతతో పాటు ముందున్న ‘మనిషి’తో పదభేదాన్ని కూడా నిలుపుతుంది; అయితే తెలుగులో ఈ భేదం హెబ్రీ భాషలో ఉన్నంత ఖచ్చితంగా వ్యక్తం కాదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, యోబు గ్రంథపు కవితా గంభీరతను నిలుపుతూ రెండు సమాంతర పాదాలుగా అనువదించబడింది. మూలంలోని రెండు మానవసూచక పదాల భేదం ప్రధాన పాఠ్యంలో ‘మనిషి / నరమానవుడు’గా, పాదసూచికలో వివరణతో చూపబడింది.
