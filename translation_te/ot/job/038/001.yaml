source:
  edition: WLC
  text: וַ/יַּֽעַן יְהוָ֣ה אֶת אִ֭יּוֹב מנ ה/סערה וַ/יֹּאמַֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/038/001.yaml
  text: Then Yahweh answered Job out of the whirlwind and said:[a]
translation:
  language: te
  text: అప్పుడు యాహ్వే తుఫాను నుండి యోబుకు జవాబిచ్చి ఇలా అన్నాడు:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సుడిగాలి నుండి” లేదా “పెనుతుఫాను నుండి.”
    reason: సְעָרָה అనే హెబ్రీ పదం తీవ్రమైన తుఫాను అనే విస్తృత అర్థాన్ని కలిగి ఉండవచ్చు; సుడిగాలి లేదా పెనుతుఫాను కూడా సందర్భానుసార సాధ్యమైన అనువాదాలు.
lexical_decisions:
- source_word: וַיַּעַן
  choice: జవాబిస్తూ
  rationale: ענה అనే క్రియ ఇక్కడ కథన రూపంలో ‘జవాబిచ్చాడు/ప్రత్యుత్తరమిచ్చాడు’ అని అర్థం. తరువాతి וַיֹּאמַרతో సహజంగా కలిపేందుకు ‘జవాబిస్తూ ఇలా అన్నాడు’ అని అనువదించబడింది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షరి יהוהను బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగు బైబిలు వాడుకలో సుపరిచితమైన ‘యెహోవా’గా లిప్యంతరీకరించబడింది.
- source_word: אֶת אִיּוֹב
  choice: యోబుకు
  rationale: ענה క్రియకు వ్యక్తిని సూచించే హెబ్రీ ప్రత్యక్ష కర్మను తెలుగులో సహజంగా సంప్రదానార్థక ‘యోబుకు’తో వ్యక్తపరచడం జరిగింది.
- source_word: מִן־הַסְּעָרָה
  choice: సుడిగాలి మధ్యనుండి
  rationale: סְעָרָה తీవ్రమైన తుఫాను, పెనుగాలి లేదా సుడిగాలిని సూచించగలదు. దైవప్రత్యక్షత దృశ్యంలోని బలమైన గాలి చిత్రాన్ని నిలుపుతూ సహజమైన తెలుగు కోసం ‘సుడిగాలి మధ్యనుండి’ ఎంచుకోబడింది.
- source_word: וַיֹּאמַר
  choice: ఇలా అన్నాడు
  rationale: אמר యొక్క కథన రూపానికి సహజమైన తెలుగు సమానం. తరువాత వచ్చే ప్రత్యక్ష వాక్యాన్ని పరిచయం చేయడానికి ‘ఇలా’ చేర్చబడింది.
theological_decisions:
- issue: יהוה అనే దైవనామాన్ని ఎలా అందించాలి
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో వ్యక్తిగత దైవనామమే ఉంది; ‘ప్రభువు’ అనే బిరుదుతో దానిని భర్తీ చేయలేదు. తెలుగు పాఠకులకు విస్తృతంగా గుర్తుపట్టదగిన లిప్యంతరీకరణ ‘యెహోవా’ను ప్రధాన పాఠంలో ఉంచాం; ఉచ్చారణ పునర్నిర్మాణానికి దగ్గరైన ‘యాహ్వే’ కూడా సాధ్యమైన రూపం.
- issue: סְעָרָה యొక్క నిర్దిష్ట వాతావరణ చిత్రం
  choice: సుడిగాలి
  alternative: పెనుతుఫాను
  rationale: ఈ పదం తీవ్రమైన తుఫానును విస్తృతంగా లేదా సుడిగాలి వంటి దృశ్యంతో సూచించగలదు. ప్రధాన పాఠం సాంప్రదాయంగా గుర్తించదగిన ‘సుడిగాలి’ని ఉంచి, విస్తృత అర్థాన్ని పాదసూచికలో కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కథన శైలి పాటించబడింది. హెబ్రీలోని రెండు వరుస వాక్యక్రియలను తెలుగులో భారంగా పునరావృతం చేయకుండా ‘జవాబిస్తూ ఇలా అన్నాడు’గా సహజంగా కలిపాం; కాలక్రమ సూచనగా ‘అప్పుడు’ నిలుపబడింది.
