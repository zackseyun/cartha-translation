  text: It is changed like clay under a seal[b][a], and they stand forth like a garment.
translation:
  language: te
  text: అది ముద్ర కింద ఉన్న మట్టిలా మారుతుంది[a]; అవి వస్త్రంలా నిలుస్తాయి[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అది ముద్ర కింద ఉన్న మట్టిలా తిరుగుతుంది.” హీబ్రూ క్రియకు “తనంతట తాను తిరుగుతుంది” లేదా “తిప్పబడుతుంది” అనే భావాలు కూడా ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో బహువచనంగా, “అవి వస్త్రంలా నిలుస్తాయి.” ఈ బహువచనం ఉదయకాంతిలో స్పష్టమయ్యే భూమి ఆకృతులను సూచిస్తుండవచ్చు.
    reason: cultural_note
lexical_decisions:
- source_word: תִּתְהַפֵּךְ
  choice: మారుతుంది
  rationale: హిత్పయేల్ రూపంలోని తిరగడం/మార్పు చెందడం అనే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; కర్తరి, కర్మణి భావాల మధ్యనున్న మూలభాష అస్పష్టతను పాదసూచికలో ఉంచింది.
- source_word: כְּחֹמֶר חוֹתָם
  choice: ముద్ర కింద మట్టిలా
  rationale: ముద్ర ఒత్తిడితో మట్టిపై ఆకృతి పడే ఉపమానాన్ని సంక్షిప్తంగా, అర్థవంతంగా వ్యక్తం చేస్తుంది.
- source_word: וְיִתְיַצְּבוּ
  choice: స్పష్టంగా కనిపిస్తాయి
  rationale: అక్షరార్థంగా ‘నిలుస్తాయి/నిలిచి కనిపిస్తాయి’; ఉదయకాంతిలో భూమి ఆకృతులు ప్రస్ఫుటమవుతున్న సందర్భార్థాన్ని సహజ తెలుగులో అందిస్తుంది.
- source_word: כְּמוֹ לְבוּשׁ
  choice: వస్త్రంలా
  rationale: ఏకవచన వస్త్ర ఉపమానాన్ని కాపాడుతుంది; వెలుగులో కనిపించే మడతలు లేదా రూపురేఖలను సూచించే కవితాత్మక చిత్రాన్ని నిలుపుతుంది.
theological_decisions:
- issue: ‘అవి’ అనే బహువచన కర్త ఎవరిని సూచిస్తుంది?
  choice: ప్రధాన పాఠ్యంలో ‘దాని ఆకృతులు’ అని సందర్భానుసారంగా స్పష్టం చేయడం
  alternative: ‘అవి వస్త్రంలా నిలుస్తాయి’ అని మూలంలోని అనిర్దిష్ట బహువచనాన్ని యథాతథంగా ఉంచడం
  rationale: మునుపటి వచనాల్లోని భూమి, ఉదయకాంతి సందర్భంలో భూమి లక్షణాలు స్పష్టమవడమే సంభావ్య భావం; అయినా ఇది మూలపాఠ్యంలో ప్రత్యక్షంగా పేర్కొనబడలేదు కాబట్టి పాదసూచికలో అనిశ్చితిని వెల్లడించింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కవితా శైలి. ‘మట్టి,’ ‘ముద్ర,’ ‘వస్త్రం’ అనే స్పష్టమైన సాధారణ పదాలతో మూలంలోని ఉపమానాలను నిలిపి, మూలభాషలోని క్రియారూప మరియు బహువచన కర్త అస్పష్టతలను పాదసూచికల్లో సంరక్షించాం.
