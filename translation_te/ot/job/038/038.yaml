translation:
  language: te
  text: ధూళి గట్టిపడి ముద్దగా మారినప్పుడు[a], మట్టి గడ్డలు ఒకదానితో ఒకటి అతుక్కుపోయినప్పుడు?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ధూళి పోసి ఘనంగా చేసిన దానిలా గట్టిపడినప్పుడు.” హీబ్రూలో పోయడం లేదా పోతపోయడం అనే చిత్రం ఉంది; అది నేల కుదిగి గట్టిపడడాన్ని వర్ణిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּצֶקֶת
  choice: గట్టి ... మారినప్పుడు
  rationale: సందర్భంలో ఇది కాలాన్ని సూచించే ఉపవాక్యాన్ని ప్రారంభిస్తుంది. పోయడం/పోతపోయడం అనే మూలచిత్రం ఉన్నప్పటికీ, దుమ్ము కుదించి గట్టిపడే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: עָפָר
  choice: దుమ్ము
  rationale: ఈ పదం దుమ్ము లేదా వదులైన మట్టిని సూచిస్తుంది; ఇక్కడ వర్షంతో గట్టిపడే నేల పదార్థానికి ‘దుమ్ము’ మూలపదానికి దగ్గరగా ఉంటుంది.
- source_word: לַמּוּצָק
  choice: ముద్దగా
  rationale: పోయబడిన లేదా పోతపోసిన ఘనరాశి అనే రూపకాన్ని పూర్తిగా లోహార్థానికి పరిమితం చేయకుండా, దుమ్ము ఏకరాశిగా గట్టిపడే ఫలితాన్ని తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: וּרְגָבִים
  choice: మట్టి పెళ్లలు
  rationale: రెగావీమ్ అనేది మట్టి గడ్డలు లేదా పెళ్లలను సూచిస్తుంది; ‘మట్టి పెళ్లలు’ సాధారణ ఆధునిక తెలుగులో స్పష్టంగా ఉంటుంది.
- source_word: יְדֻבָּקוּ
  choice: ఒకదానికొకటి అతుక్కున్నప్పుడు
  rationale: మట్టి పెళ్లలు పరస్పరం అంటుకొని కలిసిపోవడాన్ని సూచించే నిష్క్రియాత్మక భావాన్ని సహజంగా తెలియజేస్తుంది.
