  yaml_path: translation/ot/job/038/006.yaml
  text: On what were its bases sunk[a], or who laid its cornerstone[b],
translation:
  language: te
  text: 'దాని పునాది పీఠాలు దేనిమీద దిగబెట్టబడ్డాయి?[a]

    లేదా దాని మూలరాయిని ఎవరు వేశారు?[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘దాని పునాది పీఠాలు’ అనే చోట ‘దాని పునాదులు’ లేదా ‘దాని ఆధారపు గూళ్లు’ అని కూడా అనువదించవచ్చు. హెబ్రీ పదం నిర్మాణాన్ని మోసే పీఠాలను, పునాది ఆధారాలను, లేదా వాటిని అమర్చే గూళ్లను సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘దాని మూలకు చెందిన రాయిని ఎవరు విసిరారు/వేశారు?’ నిర్మాణ సందర్భంలో ఇది మూలరాయిని వేయడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל מָה
  choice: దేనిమీద
  rationale: ఆధారం లేదా పునాది దేనిపై నిలిచిందనే ప్రశ్నను సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: אֲדָנֶיהָ
  choice: దాని పునాదులు
  rationale: אֶדֶן అనేది పీఠం, ఆధారపు అడుగు, లేదా పునాది-దిమ్మను సూచించగలదు. భూమిని కట్టడంగా చిత్రించే సందర్భంలో ‘పునాదులు’ సాధారణ పాఠకులకు స్పష్టంగా ఉండి నిర్మాణ రూపకాన్ని నిలుపుతుంది.
- source_word: הָטְבָּעוּ
  choice: దిగబిగించబడ్డాయి
  rationale: హోఫాల్ రూపంలోని నిష్క్రియార్థంతో పాటు లోపలికి దింపి స్థిరపరచిన దృశ్యాన్ని కాపాడుతుంది; కేవలం ‘పెట్టబడ్డాయి’ అనడం మూలంలోని బలమైన చిత్రాన్ని తగ్గిస్తుంది.
- source_word: אוֹ
  choice: లేదా
  rationale: రెండు అలంకారిక ప్రశ్నలను కలిపే సాధారణ విభాజక సముచ్చయం.
- source_word: מִי
  choice: ఎవరు
  rationale: రెండవ ప్రశ్నను ప్రారంభించే ప్రత్యక్ష ప్రశ్నార్థక సర్వనామం.
- source_word: יָרָה
  choice: వేశాడు
  rationale: ఈ క్రియకు అక్షరార్థంగా విసరడం లేదా ఎగవేయడం అనే భావం ఉన్నా, నిర్మాణ సందర్భంలో రాయిని తగిన స్థానంలో వేయడాన్ని సూచిస్తుంది. ‘వేశాడు’ తెలుగు నిర్మాణ వాడుకలో సహజంగా ఉంటుంది.
- source_word: אֶבֶן פִּנָּתָהּ
  choice: దాని మూలరాయి
  rationale: అక్షరార్థంగా ‘దాని మూలకు చెందిన రాయి.’ ‘మూలరాయి’ నిర్మాణ రూపకాన్ని సంక్షిప్తంగా, సహజంగా నిలుపుతుంది; స్త్రీలింగ ఏకవచన ప్రత్యయం సందర్భంలోని భూమిని సూచిస్తూ ‘దాని’గా వచ్చింది.
theological_decisions:
- issue: భూమి సృష్టిని కట్టడ నిర్మాణంగా చిత్రించే రూపకం
  choice: పునాదులు, మూలరాయి అనే నిర్మాణ రూపకాన్ని యథాతథంగా నిలుపడం
  alternative: ‘భూమిని నిలబెట్టేది ఏమిటి?’ అని భావానువాదం చేయడం
  rationale: ఇది యోబును దేవుడు ప్రశ్నించే కావ్య భాగం. నిర్మాణ చిత్రాన్ని నిలపడం హెబ్రీ కావ్యానికి న్యాయం చేస్తుంది; ఆధునిక శాస్త్రీయ వివరణను గానీ, అతిగా వ్యాఖ్యానించిన భావాన్ని గానీ పాఠ్యంలోకి చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, కావ్యగాంభీర్యాన్ని కోల్పోకుండా సాధారణ పాఠకులకు అర్థమయ్యే పదజాలం వాడబడింది. ప్రశ్నల సమాంతర నిర్మాణం మరియు భూమిని కట్టడంగా చూపే రూపకం నిలుపబడ్డాయి.
