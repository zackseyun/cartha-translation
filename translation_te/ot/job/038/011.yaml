source:
  edition: WLC
  text: וָ/אֹמַ֗ר עַד פֹּ֣ה תָ֭בוֹא וְ/לֹ֣א תֹסִ֑יף וּ/פֹ֥א יָ֝שִׁ֗ית בִּ/גְא֥וֹן גַּלֶּֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/038/011.yaml
  text: and I said[a], ‘You may come this far, and no farther; here your proud waves shall stop.’
translation:
  language: te
  text: 'అప్పుడు నేను ఇలా అన్నాను: “ఇంతవరకే వస్తావు, ఇక ముందుకు రావు; నీ అలల ఉప్పొంగే గర్వం ఇక్కడే నిలువరించబడుతుంది[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీ అలల ఉప్పొంగే గర్వం ఇక్కడే ఉంచబడుతుంది.” హీబ్రూ క్రియకు అక్షరార్థంగా ‘పెట్టు, ఉంచు’ అనే భావం ఉంది; ఈ సందర్భంలో సముద్రపు అలలు ఈ హద్దు వద్ద అడ్డగించబడతాయని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר
  choice: అప్పుడు నేను ఇలా అన్నాను
  rationale: אמר క్రియ యొక్క వరుస కథనరూపాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; దేవుడే మాట్లాడుతున్నాడనే ప్రథమ పురుష భావాన్ని నిలుపుతుంది.
- source_word: עַד פֹּה תָבוֹא
  choice: ఇంతవరకే వస్తావు
  rationale: עַד־פֹּה సూచించే స్థలపరమైన హద్దును ‘ఇంతవరకే’ స్పష్టంగా తెలియజేస్తుంది; సముద్రాన్ని నేరుగా సంబోధించే ద్వితీయ పురుష ఏకవచనాన్ని కూడా కాపాడుతుంది.
- source_word: וְלֹא תֹסִיף
  choice: ఇక ముందుకు రావు
  rationale: יסף యొక్క ‘ఇంకా కొనసాగు/మరింత చేయు’ అనే భావాన్ని, సముద్రానికి విధించిన హద్దు సందర్భంలో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וּפֹא יָשִׁית
  choice: ఇక్కడే నిలువరించబడుతుంది
  rationale: שׁית యొక్క ప్రాథమిక ‘పెట్టు/నిలుపు’ భావం ఈ సందర్భంలో హద్దు వద్ద అడ్డగించబడటాన్ని సూచిస్తుంది. తెలుగు కర్మణి రూపం పేర్కొనబడని కర్తను చేర్చకుండా భావాన్ని నిలుపుతుంది.
- source_word: בִּגְאוֹן גַּלֶּיךָ
  choice: నీ అలల ఉప్పొంగే గర్వం
  rationale: גאון లోని గర్వం, మహోన్నతి, ఉప్పొంగడం వంటి భావ ఛాయలను పూర్తిగా సమతలపరచకుండా, అలల ఉద్ధృతిని కవితాత్మకంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: దేవుని ఆజ్ఞకు లోబడిన సముద్రానికి మానవీకరణ
  choice: సముద్రాన్ని ద్వితీయ పురుష ఏకవచనంలో నేరుగా సంబోధించడం నిలుపబడింది.
  alternative: సముద్రాన్ని పూర్తిగా నిర్జీవ ప్రకృతి శక్తిగా పేర్కొనడం.
  rationale: హీబ్రూ పాఠం సముద్రాన్ని ‘నీవు’ అని కవితాత్మకంగా సంబోధిస్తుంది. ఇది సృష్టిపై దేవుని అధికారాన్ని బలపరుస్తుంది; సముద్రాన్ని స్వతంత్ర దేవతగా లేదా దేవునికి సమానమైన ప్రత్యర్థిగా చూపదు.
- issue: בִּגְאוֹן యొక్క భావ ఛాయ
  choice: ‘నీ అలల ఉప్పొంగే గర్వం’ అని అనువదించి గర్వం మరియు ఉద్ధృతి రెండింటినీ నిలుపడం.
  alternative: ‘నీ గర్విష్ఠమైన అలలు’ అని విశేషణ రూపంలో సరళీకరించడం.
  rationale: మూలంలో ‘అలల గర్వం/మహోన్నతి’ అనే నామవాచక నిర్మాణం ఉంది. దానిలోని కవితాత్మక ఉద్వేగాన్నీ, గర్వం–మహిమ మధ్య ఉన్న కొంత అర్థవిస్తృతినీ ఈ రూపం మెరుగ్గా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కవితాత్మక శైలిని ఉపయోగించాం. ‘ఇంతవరకే… ఇక ముందుకు… ఇక్కడే’ అనే పదక్రమం హద్దు విధించే ఆజ్ఞను స్పష్టంగా వినిపిస్తుంది; సముద్రానికి చేసిన ప్రత్యక్ష సంబోధనను అలాగే ఉంచాం.
