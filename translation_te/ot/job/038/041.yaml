  source_fidelity: 'మూల హీబ్రూలో ఒకే అలంకారిక ప్రశ్న ఉంది: కాకికి దాని వేట/ఆహారాన్ని ఎవరు సమకూర్చుతారు? దాని పిల్లలు దేవునికి మొరపెట్టి ఆహారం లేక తిరుగుతారు అనే పరిస్థితిని כִּי పరిచయం చేస్తుంది. ముసాయిదాలో ఈ ప్రశ్న రెండుసార్లు రావడం మూలంలో లేదు. సవరణలో ప్రశ్నను ఒక్కసారే ఉంచి, כִּי యొక్క కాలసూచక పఠనాన్ని నిలుపుతున్నాం.'
  naturalness: ‘వేటను సిద్ధం చేయడం’ కంటే ‘వేటను సమకూర్చడం’ ఆధునిక తెలుగులో ఈ సందర్భానికి సహజం. ఉపవాక్యాన్ని ముందుకు తేవడం ద్వారా ‘ఉన్నప్పుడు’ అనే కాలసూచక అనుసంధానం స్పష్టంగా, ప్రవాహంగా ఉంటుంది.
  terminology: ‘కాకి,’ ‘దాని పిల్లలు,’ ‘దేవునికి మొరపెట్టి,’ ‘ఆహారం లేక తిరుగులాడుతున్నప్పుడు’ మూలార్థానికీ గౌరవప్రదమైన ఆధునిక ప్రామాణిక తెలుగు శైలికీ తగినవి. ‘దాని వేటను’ హీబ్రూ ప్రత్యయాన్ని, జంతు-ఆహార చిత్రణను నిలుపుతుంది.
