  text: Who prepares its prey for the raven when its young cry out to God and wander about for lack of food?[a][b][c]
translation:
  language: te
  text: దాని పిల్లలు దేవునికి మొరపెట్టి, ఆహారం లేక తిరుగులాడుతున్నప్పుడు[b][c], కాకికి దాని వేటను[a] సమకూర్చేది ఎవరు?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘కాకికి ఆహారం సమకూర్చేది.’ హీబ్రూ క్రియకు ‘సిద్ధం చేయడం’ లేదా ‘సమకూర్చడం’ అని అర్థం; ‘వేట’ అనే పదాన్ని సాధారణంగా ‘ఆహారం’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘ఎందుకంటే దాని పిల్లలు దేవునికి మొరపెడతాయి.’ హీబ్రూ సంధిపదాన్ని కాలసూచకంగా ‘ఉన్నప్పుడు’ అనడమే కాక, కారణసూచకంగా ‘ఎందుకంటే’ అని కూడా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: ‘తిరుగులాడుతున్నప్పుడు’ అనే పదాన్ని ‘సంచరిస్తున్నప్పుడు’ లేదా ‘దారితప్పి తిరుగుతున్నప్పుడు’ అని కూడా అనువదించవచ్చు. హీబ్రూ క్రియ ఆహారం కోసం తిరగడం లేదా దారితప్పడాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי
  choice: ఎవరు?
  rationale: దేవుని ప్రసంగంలో అలంకారిక ప్రశ్నను ప్రారంభించే ప్రశ్నార్థక సర్వనామం.
- source_word: יָכִין
  choice: సిద్ధం చేసేది
  rationale: כון ధాతువు హిఫీల్ రూపంలో ‘సిద్ధం చేయడం’ లేదా ‘సమకూర్చడం’ అనే భావం ఇస్తుంది; ‘సిద్ధం చేసేది’ మూలంలోని స్పష్టమైన క్రియాభావాన్ని నిలుపుతుంది.
- source_word: לָעֹרֵב
  choice: కాకికి
  rationale: ל ఉపసర్గ లబ్ధిదారుణ్ణి సూచిస్తుంది; ఏకవచనంలోని కాకి ఇక్కడ జాతికి ప్రాతినిధ్యం వహించే సాధారణ ప్రయోగం.
- source_word: צֵידוֹ
  choice: దాని వేటను
  rationale: ציד అంటే వేటాడి సంపాదించిన ఆహారం లేదా వేట; ప్రత్యయం కాకిని సూచిస్తుంది. ‘దాని వేటను’ జంతు సందర్భంలోని సజీవ చిత్రాన్ని నిలుపుతుంది.
- source_word: כִּי
  choice: అప్పుడు / ఉన్నప్పుడు
  rationale: ఇక్కడ כִּי కాకి అవసరం కనిపించే సందర్భాన్ని పరిచయం చేస్తుంది; తెలుగు వాక్యంలో కాలసూచక ‘ఉన్నప్పుడు’ సహజంగా సరిపోతుంది.
- source_word: ילדיו
  choice: దాని పిల్లలు
  rationale: ప్రత్యయంతో ఉన్న నామవాచకం కాకి పిల్లలను సూచిస్తుంది; ఆధునిక తెలుగులో ఇది సహజమైన రూపం.
- source_word: אֶל אֵל
  choice: దేవునికి
  rationale: ఈ సందర్భంలో אֵל సాధారణంగా దేవుణ్ణి సూచిస్తుంది; ప్రత్యేక నామంగా లిప్యంతరీకరించాల్సిన అవసరం లేదు.
- source_word: יְשַׁוֵּעוּ
  choice: మొరపెట్టి
  rationale: שוע పియేల్ రూపం సహాయం కోసం బిగ్గరగా మొరపెట్టడాన్ని సూచిస్తుంది; ‘మొరపెట్టి’ ఆ ఆర్తిని సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: יִתְעוּ
  choice: తిరుగులాడుతున్నప్పుడు
  rationale: תעה క్వాల్ రూపం తిరగడం, సంచరించడం లేదా దారితప్పడాన్ని సూచిస్తుంది; ఆకలితో ఆహారం కోసం అటూ ఇటూ తిరిగే భావాన్ని ఇది సహజంగా అందిస్తుంది.
- source_word: לִבְלִי אֹכֶל
  choice: ఆహారం లేక
  rationale: ఈ పదబంధం ఆహారలేమిని సూచిస్తుంది; తెలుగు భాషలో ‘ఆహారం లేక’ సరళంగా, స్పష్టంగా ఉంటుంది.
theological_decisions:
- issue: కాకి పిల్లలు దేవునికి మొరపెట్టడం
  choice: మూలంలోని వ్యక్తీకరణను నేరుగా నిలుపుతూ ‘దేవునికి మొరపెట్టి’ అని అనువదించబడింది.
