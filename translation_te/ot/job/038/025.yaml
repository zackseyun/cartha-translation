translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన ప్రశ్నారూపం వాడబడింది. హీబ్రూ కవితా సమాంతరతను రెండు ప్రశ్నలుగా నిలిపి, అరుదైన వాతావరణ పదబంధంలోని అస్పష్టతను పాదసూచికలో భద్రపరచాం.
