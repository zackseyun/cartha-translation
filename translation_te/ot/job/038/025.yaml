  text: מִֽי פִלַּ֣ג לַ/שֶּׁ֣טֶף תְּעָלָ֑ה וְ֝/דֶ֗רֶךְ לַ/חֲזִ֥יז קֹלֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/038/025.yaml
  text: Who has cut a channel for the flood[a], or a path for the thunderbolt,
translation:
  language: te
  text: వరదనీటికి కాలువను కోసి, ఉరుము పిడుగుకు దారిని ఏర్పరచినవాడెవడు?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కుండపోతకు కాలువను, ఉరుముల పిడుగుకు దారిని ఏర్పరచినవాడెవడు?” అక్షరార్థంగా చివరి పదబంధం “శబ్దాల/ఉరుముల మెరుపుకు” అని ఉంది.
    reason: שֶׁטֶף యొక్క ‘కుండపోత’ అనే సాధ్యమైన భావాన్ని, అలాగే అరుదైన కవితాత్మక పదబంధం חֲזִיז קֹלוֹתలోని ‘మెరుపు/పిడుగు’ మరియు ‘శబ్దాలు/ఉరుములు’ అనే భాగాలను నిలుపుతుంది.
lexical_decisions:
- source_word: פִלַּג
  choice: కోసినవాడు
  rationale: కాలువ ఏర్పడేలా చీల్చడం లేదా కోయడం అనే దృశ్యాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: שֶּׁטֶף
  choice: వరదనీరు
  rationale: ఈ పదం ఉద్ధృతంగా పారే నీటిని లేదా కుండపోతను సూచించగలదు; ‘కాలువ’తో ఉన్న సందర్భంలో ‘వరదనీరు’ సహజంగా సరిపోతుంది.
- source_word: תְּעָלָה
  choice: కాలువ
  rationale: నీరు ప్రవహించే మార్గం లేదా వాహిక అనే అర్థాన్ని సాధారణ ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: דֶרֶךְ
  choice: దారి
  rationale: సమాంతర కవిత్వంలో మెరుపుకు నిర్దేశించబడిన మార్గాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: חֲזִיז
  choice: మెరుపు
  rationale: అరుదైన ఈ పదానికి మెరుపు లేదా పిడుగు అనే అర్థాలు సాధ్యమైనవి; קֹלוֹתతో కలిసి ఉన్నందున ‘ఉరుములతో కూడిన మెరుపు’ మూలంలోని రెండు అంశాలను నిలుపుతుంది.
- source_word: קֹלוֹת
  choice: ఉరుములతో కూడిన
  rationale: అక్షరార్థంగా ‘స్వరాలు/శబ్దాలు’; వాతావరణ సందర్భంలో ఉరుములను సూచిస్తుంది. חֲזִיזతో దాని సంబంధాన్ని స్పష్టంగా చూపుతుంది.
