source:
  edition: WLC
  text: אֲשֶׁר חָשַׂ֥כְתִּי לְ/עֶת צָ֑ר לְ/י֥וֹם קְ֝רָ֗ב וּ/מִלְחָמָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/038/023.yaml
  text: which I have reserved for a time of distress[a], for a day of battle and war[b],
translation:
  language: te
  text: వాటిని నేను దాచిపెట్టాను[a]—ఆపద సమయం కోసం[b], పోరాటం మరియు యుద్ధం జరిగే రోజు కోసం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వెనక్కి ఉంచాను” లేదా “కాపాడి ఉంచాను.”
    reason: lexical_alternative
  - marker: b
    text: “ఆపద” అనే పదాన్ని “కష్టం” లేదా “విపత్తు” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: వాటిని
  rationale: ఈ సంబంధవాచక పదం ముందరి వచనంలో చెప్పిన మంచు, వడగళ్ల నిల్వలను సూచిస్తుంది. తెలుగు వాక్యంలో ఆ సంబంధాన్ని సహజంగా తెలియజేయడానికి ‘వాటిని’ అని వ్యక్తపరిచాం.
- source_word: חָשַׂכְתִּי
  choice: నేను నిలిపి ఉంచాను
  rationale: ఈ క్రియకు ‘వెనక్కి ఉంచడం, నిర్దిష్ట సమయం కోసం కాపాడి ఉంచడం’ అనే భావాలు ఉన్నాయి. తరువాత ఉపయోగించడానికి దేవుడు వాటిని ఉంచాడనే ఉద్దేశాన్ని ‘నిలిపి ఉంచాను’ సహజంగా తెలియజేస్తుంది.
- source_word: לְעֶת
  choice: కాలం కోసం
  rationale: לְ ఇక్కడ ఉద్దేశం లేదా నిర్దిష్ట సందర్భాన్ని సూచిస్తుంది; עֵת అంటే సమయం లేదా కాలం.
- source_word: צָר
  choice: ఆపద
  rationale: ఈ సందర్భంలో ఈ పదం ఇబ్బంది, కష్టం, విపత్తు కలిగే స్థితిని సూచిస్తుంది. ‘ఆపద’ సంక్షిప్తంగా, గంభీరంగా ఉంది.
- source_word: לְיוֹם
  choice: రోజు కోసం
  rationale: ముందున్న לְעֶת కు సమాంతరంగా, ఉద్దేశించిన సమయాన్ని సూచించే విధంగా అనువదించాం.
- source_word: קְרָב
  choice: పోరాటం
  rationale: సైనిక తలపడటాన్ని సూచించే సాధారణ పదం; ఆధునిక తెలుగులో స్పష్టంగా ఉంటుంది.
- source_word: וּמִלְחָמָה
  choice: యుద్ధం
  rationale: కְרָב తో ఉన్న సమీపార్థక జంటను కుదించకుండా, హెబ్రీ వాక్యంలోని ‘పోరాటం, యుద్ధం’ అనే రెండింటినీ నిలిపాం.
theological_decisions:
- issue: తీర్పు దృశ్యభాషలో ప్రకృతి శక్తులను దేవుడు ఉపయోగించడం
  choice: ఆపద, పోరాటం, యుద్ధం సంభవించే సమయం కోసం దేవుడు వీటిని నిలిపి ఉంచాడనే వచనం యొక్క ప్రత్యక్ష భావాన్ని నిలిపాం.
  alternative: ఇందులోని సైనిక సూచనను తొలగించి, దైవ పరిపాలనకు సంబంధించిన పూర్తిగా రూపకాలంకార భాషగా అనువదించడం.
  rationale: మూలవచనం స్వయంగా పోరాటం, యుద్ధం జరిగే రోజును పేర్కొంటుంది. అందువల్ల ఆ చిత్రణను మృదువుపరచకుండా, దాని వేదాంతపరమైన పరిధిని అనువాదంలో అదనంగా నిర్వచించకుండా ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన శైలి. హెబ్రీ సమాంతర నిర్మాణాన్ని నిలుపుతూ, తెలుగులో సహజమైన పదక్రమాన్ని ఉపయోగించాం.
