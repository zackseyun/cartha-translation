  text: when I made a cloud its garment[a], and thick darkness its swaddling band,
translation:
  language: te
  text: 'నేను మేఘాన్ని దాని వస్త్రంగా,

    కారుచీకటిని దాని పొత్తిగుడ్డగా చేసినప్పుడు[a],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దాని పొత్తిబట్టగా.’ ఇక్కడి హీబ్రూ పదం పసిబిడ్డను గుడ్డతో చుట్టే దృశ్యాన్ని సూచిస్తుంది; చుట్టుపక్కల వచనాల్లో సముద్రాన్ని పుట్టిన శిశువుగా వర్ణించే రూపకాన్ని ఇది కొనసాగిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשׂוּמִי
  choice: నేను … చేసినప్పుడు
  rationale: ב plus infinitive construct and first-person suffix has a temporal sense here. Telugu ‘చేసినప్పుడు’ naturally presents God’s action while retaining the poetic sequence.
- source_word: עָנָן
  choice: మేఘాన్ని
  rationale: עָנָן means ‘cloud.’ The accusative form is natural in Telugu because it is made into the sea’s garment.
- source_word: לְבֻשׁוֹ
  choice: దానికి వస్త్రంగా
  rationale: לְבוּשׁ denotes a garment or clothing; ‘వస్త్రం’ preserves the clothing metaphor. ‘దానికి’ refers contextually to the sea.
- source_word: וַעֲרָפֶל
  choice: కారుచీకటిని
  rationale: עֲרָפֶל denotes dense atmospheric darkness or gloom. ‘కారుచీకటి’ conveys its density and poetic force in current dignified Telugu.
- source_word: חֲתֻלָּתוֹ
  choice: దాని పొత్తిగుడ్డగా
  rationale: The noun is related to wrapping or swaddling. ‘పొత్తిగుడ్డ’ clearly preserves the newborn-swaddling image continued from the surrounding birth metaphor.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కవితా శైలిని ఉపయోగించాం. రెండు సమాంతర పాదాల్లో ‘చేసినప్పుడు’ను పునరుక్తి చేయడం తెలుగు వాక్యాన్ని స్పష్టంగా ఉంచుతూ హీబ్రూ సమాంతర నిర్మాణాన్ని ప్రతిబింబిస్తుంది.
