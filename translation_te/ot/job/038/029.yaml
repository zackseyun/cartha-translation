  yaml_path: translation/ot/job/038/029.yaml
  text: From whose womb did the ice come forth[a], and who gave birth to the frost of heaven?
translation:
  language: te
  text: 'ఎవరి గర్భం నుంచి మంచుగడ్డ పుట్టుకొచ్చింది?

    ఆకాశపు తెల్లమంచుకు[a] జన్మనిచ్చిందెవరు?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆకాశపు తుషారానికి.”
    reason: כְּפוֹר అనే పదం తెల్లమంచు లేదా తుషారం అనే సమీపార్థాలను కలిగి ఉండవచ్చు; ప్రధాన పాఠం సాధారణ అవగాహనకు అనుకూలమైన పదాన్ని వాడగా, ప్రత్యామ్నాయం మరింత నిర్దిష్టమైన వాతావరణ పదాన్ని ఇస్తుంది.
lexical_decisions:
- source_word: מִבֶּטֶן מִי
  choice: ఎవరి గర్భం నుంచి
  rationale: ‘గర్భం’ అనే ప్రత్యక్ష అర్థాన్ని నిలుపుతూ, రెండు పాదాలను ఏకం చేసే జనన రూపకాన్ని సహజమైన ఆధునిక తెలుగులో కాపాడుతుంది.
- source_word: יָצָא
  choice: పుట్టుకొచ్చింది
  rationale: మూల క్రియకు ‘బయటికి వచ్చింది’ అనే అర్థం ఉన్నా, ఇక్కడి గర్భం–జననం రూపకంతో అనుసంధానమయ్యేలా ‘పుట్టుకొచ్చింది’ సహజంగా, కవితాత్మకంగా ఉంది.
- source_word: הַקָּרַח
  choice: మంచుగడ్డ
  rationale: קֶרַח సూచించే గడ్డకట్టిన మంచును సాధారణ తెలుగు పాఠకునికి స్పష్టంగా తెలియజేస్తుంది; కేవలం ‘మంచు’ అంటే తుషారం లేదా హిమం అనే అస్పష్టత రావచ్చు.
- source_word: וּכְפֹר שָׁמַיִם
  choice: ఆకాశపు తెల్లమంచుకు
  rationale: כְּפוֹר అనేది నేలపై తెల్లగా పేరుకునే తుషారాన్ని సూచిస్తుంది. ‘ఆకాశపు’ అనే సంబంధరూపం שָׁמַיִם యొక్క కవితాత్మక విశాలతను నిలుపుతుంది.
- source_word: מִי יְלָדוֹ
  choice: జన్మనిచ్చిందెవరు
  rationale: ילד యొక్క ప్రసవం/జననం భావాన్ని స్పష్టంగా నిలుపుతుంది. మూలంలోని పుంలింగ వ్యాకరణ రూపాన్ని తెలుగులో అనవసరంగా లింగనిర్దిష్టం చేయకుండా ప్రశ్నగా సహజంగా వ్యక్తపరుస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైన కవితా ప్రశ్నల స్వరాన్ని నిలుపుతూ సాధారణ పాఠకులకు అర్థమయ్యే పదజాలం వాడబడింది. రెండు పాదాల్లోని గర్భం–జననం రూపకం సంరక్షించబడింది.
