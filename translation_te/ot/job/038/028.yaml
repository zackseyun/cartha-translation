  source_fidelity: ముసాయిదా הֲיֵשׁ לַמָּטָר אָב అనే మొదటి ప్రశ్నను, అలాగే אֶגְלֵי טָל ను సరిగ్గా ప్రతిబింబిస్తుంది. అయితే లేదా అనే స్పష్టమైన అనుసంధాన పదం లేకపోవడం వల్ల మూలంలోని אוֹ వ్యక్తం కాలేదు. హిఫీల్ הוֹלִיד కు ‘కన్నవాడు’ అర్థసంభావ్యమైనదే అయినా, ఆధునిక తెలుగులో అది ప్రధానంగా ప్రసవించిన వ్యక్తిని సూచించే అవకాశం ఉంది; పితృత్వ సమాంతరతలో ‘పుట్టించినవాడు’ మరింత స్పష్టం.
