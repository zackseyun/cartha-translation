  yaml_path: translation/ot/job/038/028.yaml
  text: Does the rain have a father[a], or who has begotten the drops of dew?
translation:
  language: te
  text: వర్షానికి తండ్రి ఉన్నాడా? లేదా మంచుబిందువులను పుట్టించినవాడు ఎవరు?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֲיֵשׁ לַמָּטָר
  choice: వర్షానికి ... ఉన్నాడా?
  rationale: ప్రశ్నార్థక అవ్యయం הֲ తో יֵשׁ, సంబంధాన్ని సూచించే ל కలసి ‘వర్షానికి ... ఉన్నాడా?’ అనే సహజమైన తెలుగు స్వామ్యప్రశ్నగా వ్యక్తమవుతాయి.
- source_word: אָב
  choice: తండ్రి
  rationale: మూలంలోని పితృత్వ రూపకాన్ని, తరువాతి జనన చిత్రణతో ఉన్న కవితా సమాంతరతను నిలుపుతుంది.
- source_word: אוֹ מִי
  choice: '... ఎవరు?'
  rationale: אוֹ రెండు సమాంతర ప్రశ్నలను ప్రత్యామ్నాయంగా కలుపుతుంది. తెలుగులో ప్రశ్నలను వరుసగా ఉంచడం ద్వారా ఆ సంబంధం సహజంగా స్పష్టమవుతుంది; ‘లేక’ను చేర్చడం అవసరం లేదు.
- source_word: הוֹלִיד
  choice: కన్నవాడు
  rationale: ילד యొక్క హిఫీల్ రూపం ‘కనడం/పుట్టించడం’ అనే జననార్థాన్ని ఇస్తుంది. ‘కన్నవాడు’ ఆధునిక తెలుగులో సహజంగా ఉండి, మొదటి అర్ధపాదంలోని ‘తండ్రి’తో పితృత్వ సమాంతరతను కాపాడుతుంది.
- source_word: אֶגְלֵי טָל
  choice: మంచుబిందువులను
  rationale: אֶגְלֵי అనేది ‘బిందువులు,’ טָל అనేది ఇక్కడ ఉదయం ఏర్పడే మంచు/dew. సమాసరూపమైన ‘మంచుబిందువులు’ స్పష్టమైన, సహజమైన తెలుగు పదబంధం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన, గంభీరమైన కవితా ప్రశ్నగా అనువదించబడింది. ‘తండ్రి’ మరియు ‘కన్నవాడు’ ద్వారా మూలంలోని మానవ జనన రూపకం నిలుపబడింది.
