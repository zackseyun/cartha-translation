translation:
  language: te
  text: అవి తమ గుహల్లో నక్కి, పొదల మాటున పొంచి ఉన్నప్పుడు? [a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘పొదల మాటున’ అనే చోట ‘మరుగున’ లేదా ‘ఆవరణలో’ అని కూడా అనువదించవచ్చు. ఇక్కడి హీబ్రూ పదం పండుగ కోసం కట్టే పర్ణశాలను కాకుండా, మాటువేసేందుకు అనువైన దాపు స్థలాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఉన్నప్పుడు
  rationale: దైవిక ప్రశ్నల వరుసలో ఇది సింహాలు వేటాడే సందర్భాన్ని సూచిస్తుంది; అందువల్ల కారణార్థం కంటే కాలార్థం సహజంగా సరిపోతుంది.
- source_word: יָשֹׁחוּ
  choice: నక్కి
  rationale: వేట కోసం శరీరాన్ని కిందికి దించి దాగి ఉండే జంతువుల భంగిమను ఆధునిక తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: בַמְּעוֹנוֹת
  choice: తమ గుహల్లో
  rationale: సందర్భం సింహాల నివాస స్థలాల గురించి కాబట్టి ‘గుహలు’ సహజమైన ఎంపిక; ‘తమ’ అనేది సందర్భం నుంచి తెలుగులో సహజంగా చేర్చబడింది.
- source_word: יֵשְׁבוּ ... לְמוֹ אָרֶב
  choice: పొంచి ఉన్నప్పుడు
  rationale: ‘కూర్చుండు’ అనే క్రియతో ‘దాడి కోసం’ అనే ఉద్దేశ్యపదబంధం కలిసి ఆకస్మిక దాడికి సిద్ధంగా దాగి ఉండడాన్ని సూచిస్తున్నాయి; తెలుగులో ‘పొంచి ఉండు’ ఈ సమగ్ర భావాన్ని సహజంగా అందిస్తుంది.
- source_word: בַסֻּכָּה
  choice: పొదల మాటున
  rationale: ఇక్కడ పదం పండుగకు సంబంధించిన నిర్మిత పర్ణశాలను కాకుండా, మాటువేసేందుకు అనువైన సహజమైన మరుగును లేదా ఆవరణను సూచిస్తుంది.
theological_decisions: []
