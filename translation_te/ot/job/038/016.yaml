source:
  edition: WLC
  text: הֲ֭/בָאתָ עַד נִבְכֵי יָ֑ם וּ/בְ/חֵ֥קֶר תְּ֝ה֗וֹם הִתְהַלָּֽכְתָּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/038/016.yaml
  text: Have you come to the springs of the sea[b][a], or walked in the recesses of the deep?
translation:
  language: te
  text: నీవు సముద్రపు ఊటల[a] వరకు వెళ్లావా? లేక అగాధపు అంతరాళాల్లో[b] నీవు సంచరించావా?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘సముద్రపు మూలాల.’
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘అగాధపు అత్యంత సుదూర ప్రదేశాల్లో.’
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲבָאתָ עַד
  choice: వరకు వెళ్లావా?
  rationale: בוא అనే గమన క్రియతో עַד చేరే హద్దును సూచిస్తుంది. తెలుగు ప్రశ్నలో ‘వరకు వెళ్లావా?’ అనేది సహజంగా ఉండి, యోబుకు నేరుగా విసిరిన సవాలును నిలుపుతుంది.
- source_word: נִבְכֵי
  choice: ఊటలు
  rationale: ఈ అరుదైన పదం సముద్ర జలాలు ఉద్భవించే ఊటలు లేదా మూలాలను సూచించవచ్చు. ‘ఊటలు’ దాని సజీవమైన జలసంబంధ భావాన్ని తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది; ‘మూలాలు’ అనే ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: יָם
  choice: సముద్రపు
  rationale: ఇక్కడ יָם సాధారణ నామవాచకం. సంబంధ విభక్తితో ‘సముద్రపు ఊటలు’ అనడం సహజమైన ఆధునిక తెలుగు.
- source_word: וּבְחֵקֶר תְּהוֹם
  choice: లేక అగాధపు అంతరాళాల్లో
  rationale: חֵקֶר అనేది పరిశోధన, అందుకోలేని హద్దు, లేదా లోపలి/సుదూర ప్రదేశం అనే భావాలను కలిగి ఉండవచ్చు. תְּהוֹם యొక్క సముద్రగర్భ, ప్రాచీన అగాధ భావాన్ని నిలుపుతూ ‘అగాధపు అంతరాళాలు’ చేరలేని లోపలి ప్రదేశాలను సూచిస్తుంది. సమాంతర ప్రశ్నలను సహజంగా కలపడానికి וְ ను ‘లేక’గా అనువదించాం.
- source_word: הִתְהַלָּכְתָּ
  choice: సంచరించావా?
  rationale: హిత్పయేల్ రూపం అటూ ఇటూ నడవడం లేదా తిరగడం అనే భావాన్ని ఇస్తుంది. ‘సంచరించావా?’ inaccessible ప్రాంతాన్ని విస్తారంగా తిరిగి చూశావా అనే అలంకారిక సవాలును సహజ తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: תְּהוֹם యొక్క భావ పరిధి
  choice: అగాధం
  alternative: అగాధ జలాలు; పాతాళం
  rationale: ‘అగాధం’ సముద్రపు లోతులనూ ప్రాచీన విశ్వచిత్రణలోని లోతైన జలరాశినీ సూచించే కావ్యాత్మక విస్తృతిని నిలుపుతుంది. ‘పాతాళం’ మరణలోక భావాన్ని అనవసరంగా చేర్చుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, దేవుడు యోబును నేరుగా ప్రశ్నించే గంభీరమైన కావ్య శైలిని ఉపయోగించాం. అరుదైన హీబ్రూ పదాల అనిశ్చితిని ప్రధాన పాఠంలో అతిగా వివరించకుండా పాదసూచికల్లో నిలిపాం.
