  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ప్రశ్నారూపాన్ని వాడాం. రెండు కవితాత్మక భాగాల సమాంతరతను ‘ఏ మార్గంలో’ అనే పునరుక్తితో స్పష్టంచేశాం; హీబ్రూలోని స్థలం–విధానం సందిగ్ధతను పాదసూచికలో కాపాడాం.
