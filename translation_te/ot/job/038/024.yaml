source:
  edition: WLC
  text: אֵי זֶ֣ה הַ֭/דֶּרֶךְ יֵחָ֣לֶק א֑וֹר יָפֵ֖ץ קָדִ֣ים עֲלֵי אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/038/024.yaml
  text: By what way is light divided[b][a], or the east wind scattered over the earth?
translation:
  language: te
  text: వెలుగు ఏ మార్గం ద్వారా విభజింపబడుతుంది[a][b], లేక తూర్పుగాలి భూమిమీద ఎలా వ్యాపింపజేయబడుతుంది?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వెలుగు విభజింపబడే మార్గం ఎక్కడ ఉంది?” హీబ్రూ ప్రశ్నార్థక పదబంధం స్థలాన్ని లేదా విధానాన్ని అడుగుతున్నట్లు అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “వెలుగు”కు బదులుగా “మెరుపు” అని కూడా అనువదించవచ్చు. హీబ్రూ పదం సాధారణంగా “వెలుగు” అని అర్థమిస్తుంది; అయితే ఈ సందర్భాన్ని బట్టి కొందరు దానిని తుఫానుతో సంబంధమున్న వెలుగుగా పరిమితం చేస్తారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵי זֶה
  choice: ఏ మార్గంలో
  rationale: ఈ ప్రశ్నార్థక పదబంధం స్థలాన్నిగానీ విధానాన్నిగానీ సూచించవచ్చు. דֶּרֶךְతో కలిపి ఆధునిక తెలుగులో సహజంగా ఉండేందుకు ‘ఏ మార్గంలో’ అని అనువదించాం; స్థలార్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: הַדֶּרֶךְ
  choice: మార్గం
  rationale: דֶּרֶךְకు సాధారణ అర్థం ‘మార్గం/దారి.’ ఈ కవితాత్మక ప్రశ్నలో ‘మార్గం’ గంభీరంగానూ సహజంగానూ ఉంది.
- source_word: יֵחָלֶק
  choice: విభజించబడుతుంది
  rationale: חלק ధాతువు నిఫాల్ రూపం విభజింపబడడం లేదా పంచబడడం అనే నిష్క్రియాత్మక/ఆత్మనేపద భావాన్ని ఇస్తుంది. ‘విభజించబడుతుంది’ మూలంలోని భావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: אוֹר
  choice: వెలుగు
  rationale: אוֹר యొక్క సాధారణ అర్థం ‘వెలుగు.’ తుఫాను సందర్భాన్ని బట్టి కొందరు దీనిని ‘మెరుపు’గా పరిమితం చేసినా, మూలపదం యొక్క విస్తృతమైన సాధారణ అర్థాన్ని ప్రధాన పాఠంలో నిలిపి ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: יָפֵץ
  choice: చెదరగొట్టబడుతుంది
  rationale: פוץ హిఫీల్ రూపానికి ‘చెదరగొట్టు/వ్యాపింపజేయు’ అనే కారణార్థక భావం ఉంది. మార్గం ద్వారా తూర్పుగాలి వ్యాపింపబడే భావాన్ని తెలుగులో సహజంగా తెలిపేందుకు నిష్క్రియాత్మక నిర్మాణాన్ని వాడాం.
- source_word: קָדִים
  choice: తూర్పుగాలి
  rationale: קָדִים సాధారణంగా తూర్పు దిశ నుండి వచ్చే గాలిని సూచిస్తుంది. వాతావరణ సంబంధ సందర్భం ‘తూర్పుగాలి’ అనే అర్థాన్ని బలపరుస్తుంది.
- source_word: עֲלֵי אָרֶץ
  choice: భూమిమీద
  rationale: ఈ పదబంధం ‘భూమి/దేశం మీద’ అని అర్థమవుతుంది. యోబు 38లోని విశ్వవ్యాప్త దైవ ప్రసంగ సందర్భానికి ‘భూమిమీద’ సరిపోతుంది.
