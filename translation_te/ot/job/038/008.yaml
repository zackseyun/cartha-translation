  text: Or who shut in the sea with doors when it burst out from the womb[b][a],
translation:
  language: te
  text: లేక, సముద్రం ఉబికి,[a] గర్భం నుంచి బయటికి వచ్చినప్పుడు దాన్ని తలుపులతో మూసివేసినవాడు ఎవరు?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ఉబికి’ అనే చోట ‘బలంగా పొంగి వెలువడి’ అని కూడా అనువదించవచ్చు; హీబ్రూ క్రియ శక్తివంతంగా వెలువడే భావాన్ని ఇస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ఈ కవితాత్మక చిత్రంలో సముద్రం గర్భం నుంచి పుట్టుకొస్తున్న శిశువులా వర్ణించబడింది.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּסֶךְ
  choice: బంధించినవాడు
  rationale: ఈ సందర్భంలో క్రియ సముద్రాన్ని అదుపుచేసి ఒక హద్దులో నిర్బంధించడాన్ని సూచిస్తుంది. ‘బంధించినవాడు’ అనే పదం తలుపుల రూపకంతో సహజంగా సరిపోతూ, కేవలం మూయడం కంటే నిరోధించే భావాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: בִּדְלָתַיִם
  choice: తలుపులతో
  rationale: హీబ్రూ ద్వివచన నామవాచకంలోని తలుపుల చిత్రాన్ని, అలాగే בְּ విభక్తి సూచించే సాధనార్థాన్ని నేరుగా నిలుపుతుంది.
- source_word: יָם
  choice: సముద్రం
  rationale: సృష్టి సందర్భంలో తెలిసిన విశ్వసంబంధ వాస్తవంగా సముద్రాన్ని సహజమైన ఆధునిక తెలుగు రూపంలో సూచిస్తుంది.
- source_word: בְּגִיחוֹ
  choice: ఉబికి బయటికి వచ్చినప్పుడు
  rationale: גיח క్రియలోని బలంగా పొంగి వెలువడే చలనాన్ని ‘ఉబికి’ తెలియజేస్తుంది; ‘బయటికి వచ్చినప్పుడు’ తరువాతి יֵצֵאతో కలసి తెలుగులో సహజంగా ఉంటుంది.
- source_word: מֵרֶחֶם
  choice: గర్భం నుంచి
  rationale: సముద్రాన్ని పుట్టుకొస్తున్న శిశువుగా చిత్రించే కవితాత్మక జనన రూపకాన్ని అదనపు వివరణ లేకుండా నిలుపుతుంది.
- source_word: יֵצֵא
  choice: బయటికి వచ్చినప్పుడు
  rationale: సముద్రం గర్భం నుంచి వెలువడిన చర్యను స్పష్టంగా వ్యక్తం చేస్తుంది. తెలుగులో గీహో మరియు యేత్సే భావాలను ఒకే సహజ క్రియాపదబంధంలో కలపడం అనవసర పునరుక్తిని నివారిస్తుంది.
theological_decisions:
- issue: సముద్ర సృష్టిని జననంగా చిత్రించే కవితాత్మక రూపకం
  choice: సముద్రం గర్భం నుంచి ఉబికి రావడం, దేవుడు దాన్ని తలుపులతో బంధించడం అనే రూపకాన్ని యథాతథంగా నిలుపడం
  alternative: దేవుడు సముద్రానికి కేవలం హద్దులు నిర్ణయించాడని అమూర్తంగా అనువదించడం
  rationale: హీబ్రూ వాక్యం సముద్రాన్ని గర్భం నుంచి వెలువడే శిశువుగా, దేవుణ్ణి దాన్ని అదుపుచేసేవానిగా సజీవంగా చిత్రిస్తుంది. ఆ కవితాత్మక ఉద్వేగాన్ని నిలపడం మూలపాఠానికి నమ్మకంగా ఉంటుంది; దానిని నిర్దిష్ట పురాణ లేదా సిద్ధాంత వాదనగా మార్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన కవితా శైలిని ఉపయోగించాం. మూలంలోని ప్రశ్నారూప కొనసాగింపును ‘లేక’తో చూపించాం. గీహో–యేత్సే అనే సమీప భావాలను తెలుగులో సహజమైన ‘ఉబికి బయటికి వచ్చినప్పుడు’ అనే ఒక్క పదబంధంగా వ్యక్తం చేశాం; రూపకాన్ని మాత్రం పూర్తిగా నిలిపాం.
