source:
  edition: WLC
  text: וְ/יִמָּנַ֣ע מֵ/רְשָׁ אוֹרָ֑/ם וּ/זְר֥וֹעַ רָ֝מָ֗ה תִּשָּׁבֵֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/job/038/015.yaml
  text: Their light is withheld from the wicked[b][a], and the uplifted arm is broken.
translation:
  language: te
  text: దుష్టులకు వారి వెలుగు అందకుండా చేయబడుతుంది; ఎత్తబడిన బాహువు[a][b] విరుగుతుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ఎత్తబడిన బాహువు విరుగుతుంది’ అనే మాటను భవిష్యదర్థంలో ‘ఎత్తబడిన బాహువు విరుగును’ అని కూడా అర్థం చేసుకోవచ్చు. హీబ్రూ అసంపూర్ణ క్రియ సజీవ వర్తమానాన్నీ భవిష్యత్తునీ సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ ‘బాహువు’ బలాన్ని లేదా అధికారాన్ని, ముఖ్యంగా హింసాత్మక శక్తిని సూచించే రూపకం కావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִמָּנַע
  choice: దక్కకుండా చేయబడుతుంది
  rationale: מנע నిఫాల్ అసంపూర్ణ క్రియకు ఉన్న కర్మణి భావాన్ని నిలుపుతూ, వెలుగు దుష్టులకు అందకుండా నిరోధించబడుతుందనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: מֵרְשָׁעִים
  choice: దుష్టులకు
  rationale: מן విభక్తి సూచించే వేరుచేయడం లేదా దూరంగా ఉంచడం అనే భావం, తెలుగు వాక్య నిర్మాణంలో ‘దక్కకుండా’తో కలిసి ‘దుష్టులకు’ అని సహజంగా వ్యక్తమవుతుంది; లింగాన్ని అనవసరంగా నిర్దిష్టం చేయదు.
- source_word: אוֹרָם
  choice: వారి వెలుగు
  rationale: మూడవ పురుష బహువచన ప్రత్యయాన్ని నేరుగా నిలుపుతుంది. సందర్భంలో ఇది దుష్టులు అనుభవించే వెలుగును, ముఖ్యంగా ఉదయవెలుగును సూచించినా, ప్రధాన పాఠంలో ‘వెలుగు’ అనే విస్తృత కవితాత్మక రూపాన్ని కాపాడుతుంది.
- source_word: וּזְרוֹעַ
  choice: చేయి
  rationale: זְרוֹעַ యొక్క శరీరాంగ రూపకాన్ని ప్రధాన పాఠంలో ఉంచుతుంది. తెలుగులో ‘చేయి’ బలం, అధికారం, హింసాత్మక శక్తి అనే రూపకాలకూ సహజంగా ఉపయోగపడుతుంది.
- source_word: רָמָה
  choice: ఎత్తిన
  rationale: רום నుంచి వచ్చిన ‘పైకి ఎత్తబడిన’ అనే విశేషణార్థాన్ని సరళంగా నిలుపుతుంది; గర్వంగా లేదా దాడికి సిద్ధంగా ఎత్తిన చేయి అనే సందర్భార్థాన్ని బలవంతంగా ఒక్క విధంగా నిర్ణయించదు.
- source_word: תִּשָּׁבֵר
  choice: విరగగొట్టబడుతుంది
  rationale: שבר నిఫాల్ అసంపూర్ణ క్రియలోని కర్మణి భావాన్ని స్పష్టంగా ఇస్తుంది. కవితలో ఉదయం దుష్టుల శక్తిని భంగపరచే సజీవ వర్ణనకు వర్తమాన/సాధారణ ఫలిత భావం సరిపోతుంది.
theological_decisions:
- issue: ఎత్తిన చేయి సూచించే భావం
  choice: ప్రధాన పాఠంలో శరీరాంగ రూపకాన్ని అలాగే ఉంచడం
  alternative: ‘అహంకార శక్తి’ లేదా ‘హింసాత్మక బలం’ అని స్పష్టీకరించడం
  rationale: హీబ్రూ పాఠం ‘చేయి’ అనే రూపకాన్ని ఉపయోగిస్తుంది. అది బలం, అధికారం లేదా హింసాత్మక సామర్థ్యాన్ని సూచించవచ్చు; వాటిలో ఒక్కదానికే పరిమితం చేయకుండా ఉద్రిక్తతను నిలుపాలి.
- issue: תִּשָּׁבֵר యొక్క కాల/దృక్కోణ విలువ
  choice: ‘విరగగొట్టబడుతుంది’ అనే సజీవ వర్తమాన/సాధారణ ఫలిత భావం
  alternative: ‘విరగగొట్టబడుతుంది’ అనే భవిష్యదర్థ పఠనం
  rationale: హీబ్రూ అసంపూర్ణ క్రియ కవితాత్మక సందర్భంలో సజీవ వర్తమానాన్ని లేదా భవిష్యత్తును సూచించగలదు. ప్రధాన పాఠం సందర్భంలోని ఉదయ కార్యాన్ని సజీవంగా వర్ణిస్తుంది; ప్రత్యామ్నాయాన్ని పాదసూచికలో వెల్లడించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కవితాత్మక శైలి. ‘వారి వెలుగు’ మరియు ‘ఎత్తిన చేయి’ అనే మూల రూపకాలను నిలిపి, అర్థాన్ని అతిగా వివరణాత్మకం చేయలేదు. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠంలో చేర్చబడ్డాయి.
