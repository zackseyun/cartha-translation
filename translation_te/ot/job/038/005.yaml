source:
  edition: WLC
  text: מִי שָׂ֣ם מְ֭מַדֶּי/הָ כִּ֣י תֵדָ֑ע א֤וֹ מִֽי נָטָ֖ה עָלֶ֣י/הָ קָּֽו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/038/005.yaml
  text: Who set its measurements[a], if you know, or who stretched a line upon it?
translation:
  language: te
  text: దాని కొలతలను ఎవరు నిర్ణయించారు—నీకు తెలిస్తే—లేక దానిమీద కొలత దారాన్ని[a] ఎవరు చాపారు?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కొలిచే దారాన్ని.”
    reason: కָּו అనే పదం నిర్మాణం లేదా భూమి కొలత సందర్భంలో చాపే కొలత దారం/తాడును సూచిస్తుంది.
lexical_decisions:
- source_word: מִי
  choice: ఎవరు
  rationale: దేవుని అలంకారిక ప్రశ్నను ప్రారంభించే ప్రశ్నార్థక సర్వనామం.
- source_word: שָׂם
  choice: నిర్ణయించారు
  rationale: భూమి నిర్మాణ చిత్రణలో కొలతలను స్థిరపరచడం లేదా నిర్దేశించడం అనే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: מְמַדֶּיהָ
  choice: దాని కొలతలను
  rationale: స్త్రీలింగ ఏకవచన ప్రత్యయం సందర్భంలోని భూమిని సూచిస్తుంది; బహువచనం దాని పరిమాణ కొలతలను తెలియజేస్తుంది.
- source_word: כִּי תֵדָע
  choice: నీకు తెలిస్తే చెప్పు
  rationale: హీబ్రూ పదబంధంలోని షరతు భావాన్ని నిలుపుతూ, వ్యంగ్యభరిత అలంకారిక ప్రశ్న బలాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది; ‘చెప్పు’ సందర్భానుగుణంగా అంతర్భావాన్ని స్పష్టం చేస్తుంది.
- source_word: אוֹ
  choice: లేక
  rationale: సమాంతర ప్రశ్నలను కలిపే విభాజక అవ్యయం.
- source_word: נָטָה
  choice: చాపారు
  rationale: నిర్మాణ సందర్భంలో కొలనూలును బిగించి విస్తరింపజేయడం అనే దృశ్యాన్ని సహజంగా అందిస్తుంది.
- source_word: עָלֶיהָ
  choice: దానిమీద
  rationale: సందర్భంలోని భూమిని సూచిస్తూ על యొక్క స్థలసంబంధ భావాన్ని నిలుపుతుంది.
- source_word: קָּו
  choice: కొలనూలు
  rationale: నిర్మాణంలో కొలవడానికి చాపే నూలు లేదా తాడును సూచించే సాంకేతిక భావాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
