source:
  edition: WLC
  text: הַֽ֭/תְקַשֵּׁר מַעֲדַנּ֣וֹת כִּימָ֑ה אֽוֹ מֹשְׁכ֖וֹת כְּסִ֣יל תְּפַתֵּֽחַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/038/031.yaml
  text: Can you bind the chains of the Pleiades[c][b][a], or loosen the cords of Orion?
translation:
  language: te
  text: కృత్తిక నక్షత్రగుచ్ఛపు బంధాలను నీవు కట్టగలవా?[a][b] లేక ఓరయన్ నక్షత్రరాశి కట్లను నీవు విప్పగలవా?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘బంధాలు’కు బదులుగా ‘కట్లు’ లేదా ‘కలిపి ఉంచే బంధనాలు’ అని కూడా అనువదించవచ్చు; ఈ అరుదైన హీబ్రూ పదం యొక్క ఖచ్చితమైన అర్థం నిశ్చితం కాదు.
    reason: lexical_alternative
  - marker: b
    text: పాత అనువాదాల్లో దీనిని కొన్నిసార్లు ‘మధుర ప్రభావాలు’ అని అనువదించారు; అయితే హీబ్రూ పదం బంధాలు లేదా కలిపి ఉంచే బంధనాలను సూచించే అవకాశమే ఎక్కువ.
    reason: lexical_alternative
  - marker: c
    text: ఇక్కడ హీబ్రూ పదం బహుశా ఓరయన్ నక్షత్రరాశిని సూచిస్తుంది; ఇతర సందర్భాల్లో అదే పదానికి ‘మూర్ఖుడు’ అనే అర్థం రావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתְקַשֵּׁר
  choice: నీవు బిగించగలవా?
  rationale: ప్రశ్నార్థక కణంతో కూడిన పీయేల్ క్రియ మానవుని అసమర్థతను సూచించే అలంకారప్రశ్న. ‘బిగించు’ అనేది ఖగోళ బంధాల చిత్రణకు సహజంగా సరిపోతుంది.
- source_word: מַעֲדַנּוֹת
  choice: బంధాలను
  rationale: అరుదైన ఈ బహువచన నామవాచకం బంధాలు, కట్లు లేదా కలిపి ఉంచేవాటిని సూచించే అవకాశముంది. సమాంతర పాదంలోని ‘కట్లు’తోనూ ‘బిగించు’ అనే క్రియతోనూ ‘బంధాలు’ సరిగ్గా సరిపోతుంది; అనిశ్చితిని పాదటిప్పణిలో నిలిపాం.
- source_word: כִּימָה
  choice: కృత్తిక నక్షత్రగుచ్ఛం
  rationale: ఇది సాధారణంగా Pleiadesగా గుర్తించబడే ఖగోళ నామం. తెలుగు పాఠకులకు పరిచితమైన భారతీయ ఖగోళ నామం ‘కృత్తిక’; ఇది ఒక నక్షత్రగుచ్ఛమని స్పష్టపరిచాం.
- source_word: מֹשְׁכוֹת
  choice: కట్లను
  rationale: లాగడానికి ఉపయోగించేవి లేదా పొడవుగా సాగిన బంధాలు అనే భావం గల నామవాచకం. ‘కట్లు’ అనేది స్పష్టమైన భౌతిక చిత్రణను ఇస్తూ మొదటి పాదంలోని ‘బంధాలు’తో సమాంతరంగా ఉంటుంది.
- source_word: כְּסִיל
  choice: మృగశిర నక్షత్రరాశి
  rationale: ఈ ఖగోళ సందర్భంలో Orion నక్షత్రరాశిని సూచిస్తుంది. తెలుగు సంప్రదాయంలో Orionకు వాడే ‘మృగశిర’ను ఎంచుకొని, సాధారణ నామవాచకార్థాన్ని పాదటిప్పణిలో తెలిపాం.
- source_word: תְּפַתֵּחַ
  choice: విప్పగలవా?
  rationale: మూలార్థం ‘తెరచు’; కట్లు లేదా బంధాలతో వచ్చినప్పుడు ‘విప్పు’ సహజమైన అర్థం. ఇది మొదటి పాదంలోని ‘బిగించు’కు చక్కని వ్యతిరేక సమాంతరాన్ని ఇస్తుంది.
