translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన, సులభగ్రాహ్యమైన అలంకారప్రశ్నగా రూపొందించాం. ఖగోళ నామాలకు తెలుగు పాఠకులకు పరిచితమైన ‘కృత్తిక’, ‘మృగశిర’ రూపాలను వాడి, అవి వరుసగా నక్షత్రగుచ్ఛం మరియు నక్షత్రరాశి అని స్పష్టంచేశాం. మూలంలోని రెండు సమాంతర బంధన రూపకాలను ‘బంధాలు/కట్లు’ మరియు ‘బిగించు/విప్పు’తో నిలిపాం.
