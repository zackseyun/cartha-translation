  yaml_path: translation/ot/job/038/004.yaml
  text: Where were you when I founded the earth? Tell me[a], if you know understanding.
translation:
  language: te
  text: నేను భూమికి పునాది వేసినప్పుడు నువ్వు ఎక్కడ ఉన్నావు? నీకు అవగాహన ఉంటే చెప్పు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵיפֹה
  choice: ఎక్కడ
  rationale: స్థలాన్ని ప్రశ్నించే అవ్యయం; దేవుని సవాలు యొక్క నేరైన బలాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: הָיִיתָ
  choice: నువ్వు ఉన్నావు
  rationale: היה క్రియ యొక్క Qal perfect 2ms రూపం గతకాల సందర్భంలోని ప్రశ్నగా ఉంది; తెలుగులో ‘నువ్వు ఎక్కడ ఉన్నావు?’ సహజమైన సమానం.
- source_word: בְּיָסְדִי
  choice: నేను … పునాది వేసినప్పుడు
  rationale: ב + infinitive construct + 1cs suffix కాలార్థాన్ని, ‘నేను పునాది వేసినప్పుడు,’ తెలియజేస్తుంది. יסד లోని నిర్మాణ రూపకాన్ని ఈ ప్రయోగం స్పష్టంగా కాపాడుతుంది.
- source_word: אָרֶץ
  choice: భూమికి
  rationale: విశ్వసృష్టి సందర్భంలో ఇది స్థానిక దేశం లేదా నేలకన్నా భూమిని సూచిస్తుంది.
- source_word: הַגֵּד
  choice: చెప్పు
  rationale: నגד యొక్క imperative; ‘చెప్పు’ ఆజ్ఞాత్మకమైన, సవాలు చేసే స్వరాన్ని సహజంగా అందిస్తుంది. హీబ్రూలో ప్రత్యేకంగా లేని ‘నాకు’ను అనవసరంగా చేర్చలేదు.
- source_word: אִם
  choice: ఉంటే
  rationale: షరతుతో కూడిన సవాలును తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: יָדַעְתָּ
  choice: నీకు … ఉంటే
  rationale: రూపపరంగా perfect అయినా, ఈ అలంకారిక షరతులో ప్రస్తుత జ్ఞానంపై సవాలుగా పనిచేస్తుంది.
- source_word: בִינָה
  choice: అవగాహన
  rationale: బుద్ధి, వివేచన, గ్రహింపు అనే అర్థవలయాన్ని సాధారణ ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: దైవిక ప్రసంగంలో సృష్టి సంబంధ నిర్మాణ రూపకం
  choice: ‘భూమికి పునాది వేసినప్పుడు’ అని అనువదించడం
  alternative: ‘భూమిని స్థాపించినప్పుడు’
  rationale: יסד లోని నిర్మాణ రూపకాన్ని స్పష్టంగా నిలుపుతూ, దేవుడే భూమిని స్థాపించినవాడనే వాక్యంలోని ప్రత్యక్ష ప్రకటనకన్నా మించి సిద్ధాంత వివరణను చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే నేరైన దైవిక సవాలు. ఏకవచన పురుష సంబోధనకు ‘నువ్వు’ వాడి హీబ్రూ 2ms రూపాన్ని సహజంగా ప్రతిబింబించాం.
