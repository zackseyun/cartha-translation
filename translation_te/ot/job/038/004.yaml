  source_fidelity: The translation accurately renders the temporal question in בְּיָסְדִי (‘when I laid the foundation of/founded’), the cosmic sense of אָרֶץ as ‘భూమి,’ and the rhetorical conditional challenge ‘if you have understanding.’ ‘భూమికి పునాది వేసినప్పుడు’ appropriately preserves the architectural metaphor of יסד.
  naturalness: The Telugu is fluent, direct, and suitably forceful for divine speech. ‘నువ్వు ఎక్కడ ఉన్నావు?’ and ‘నీకు అవగాహన ఉంటే చెప్పు’ are idiomatic modern-standard Telugu. The singular address correctly reflects the Hebrew 2ms form.
  terminology: ‘పునాది వేసినప్పుడు’ is an apt equivalent for the foundation-laying imagery, and ‘అవగాహన’ naturally conveys בִּינָה in this context. No doctrinal interpretation is added.
