translation:
  language: te
  text: అది భూమి అంచులను పట్టుకొనునట్లు[a], దుష్టులు దానిలోనుండి విదిలించబడునట్లు[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “భూమి కొసలను.” హీబ్రూ పదం అక్షరార్థంగా “భూమి రెక్కలను” అంటుంది; ఇది భూమి వెలుపలి అంచులను సూచించే కవితా రూపకం.
    reason: lexical_alternative
  - marker: b
    text: ఉదయం భూమి అంచులను పట్టుకొని దానిని విదిలించినప్పుడు, ఒక వస్త్రం నుండి దుమ్మును విదిలించినట్లుగా దుష్టులు దానిలోనుండి తొలగిపోతున్న దృశ్యం ఇక్కడ ఉంది.
    reason: cultural_note
lexical_decisions:
- source_word: לֶאֱחֹז
  choice: పట్టుకొని
  rationale: అחז్ అనే క్రియకు ‘పట్టుకోవడం/గట్టిగా అందుకోవడం’ అనే భావం ఉంది. ముందటి వచనంలో ఉదయానికి ఇచ్చిన ఆజ్ఞ యొక్క ఉద్దేశం లేదా ఫలితాన్ని ఈ రూపం కొనసాగిస్తుంది; తెలుగులో తదనంతర క్రియతో కలిసి ‘పట్టుకొని ... విదిలించబడేలా’ అని సహజంగా వ్యక్తమవుతుంది.
- source_word: בְּכַנְפוֹת
  choice: అంచులను
  rationale: כָּנָף అక్షరార్థంగా ‘రెక్క’; భూమితో కూడిన ఈ స్థలసంబంధ కవితా ప్రయోగంలో అది దాని వెలుపలి అంచులు లేదా కొసలను సూచిస్తుంది. ‘అంచులు’ రూపకాన్ని సహజంగా అందిస్తుంది.
- source_word: הָאָרֶץ
  choice: భూమి
  rationale: సృష్టి, ఉదయం గురించిన విశ్వవ్యాప్త సందర్భంలో הארץ ఒక ప్రాంతీయ ‘దేశం’ కంటే ‘భూమి’ని సూచిస్తుంది.
- source_word: וְיִנָּעֲרוּ
  choice: విదిలించబడేలా
  rationale: నిఫాల్ రూపం కుదిపి తొలగించబడడాన్ని సూచిస్తుంది. వస్త్రాన్ని విదిలించినప్పుడు దానిపై ఉన్నది రాలిపోవడం వంటి కవితా దృశ్యాన్ని ‘విదిలించబడడం’ నిలుపుతుంది.
- source_word: רְשָׁעִים
  choice: దుష్టులు
  rationale: ఇది దుష్టులైన వ్యక్తులను సూచించే నామవాచక ప్రయోగం. ‘దుష్టులు’ సంక్షిప్తంగా, గంభీరంగా, నైతిక వర్గాన్ని యథాతథంగా తెలియజేస్తుంది.
- source_word: מִמֶּנָּה
  choice: దానిలోనుండి
  rationale: స్త్రీలింగ ఏకవచన ప్రత్యయం భూమినే తిరిగి సూచిస్తుంది. ‘దానిలోనుండి’ మూలంలోని מן భావాన్ని స్పష్టంగా ఉంచి, తొలగింపును తెలియజేస్తుంది.
