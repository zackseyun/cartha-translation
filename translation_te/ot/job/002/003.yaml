source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל הַ/שָּׂטָ֗ן הֲ/שַׂ֣מְתָּ לִבְּ/ךָ֮ אֶל עַבְדִּ֣/י אִיּוֹב֒ כִּי֩ אֵ֨ין כָּמֹ֜/הוּ בָּ/אָ֗רֶץ אִ֣ישׁ תָּ֧ם וְ/יָשָׁ֛ר יְרֵ֥א אֱלֹהִ֖ים וְ/סָ֣ר מֵ/רָ֑ע וְ/עֹדֶ֨/נּוּ֙ מַחֲזִ֣יק בְּ/תֻמָּת֔/וֹ וַ/תְּסִיתֵ֥/נִי ב֖/וֹ לְ/בַלְּע֥/וֹ חִנָּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/002/003.yaml
  text: Then Yahweh said to the Accuser[a], “Have you set your heart on my servant Job? For there is no one like him on the earth, a blameless and upright man, one who fears God and turns away from evil. He still holds fast his integrity[d][c][b], though you incited me against him to destroy him for nothing.”
translation:
  language: te
  text: 'అప్పుడు యాహ్వే నిందారోపకునితో[a] ఇలా అన్నాడు: “నా సేవకుడైన యోబు మీద నీ మనసు నిలిపావా?[b] భూమిమీద అతనిలాంటి వాడు ఎవరూ లేరు. అతడు నిందలేని, యథార్థమైన మనిషి; దేవునికి భయపడి చెడుకు దూరంగా ఉంటాడు. అతన్ని కారణం లేకుండా నాశనం చేయడానికి నీవు నన్ను అతనికి విరోధంగా ప్రేరేపించినా, అతడు ఇంకా తన యథార్థతను గట్టిగా పట్టుకొని ఉన్నాడు.[c]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ: “ఆ నిందారోపకుడు”; సంప్రదాయ అనువాదం: “సాతాను.”'
    reason: alternative_reading
  - marker: b
    text: 'లేదా “నా సేవకుడైన యోబును పరిశీలించావా?” అక్షరార్థం: “నా సేవకుడైన యోబు మీద నీ హృదయాన్ని ఉంచావా?”'
    reason: lexical_alternative
  - marker: c
    text: “నాశనం చేయడానికి” అనే హీబ్రూ మాటకు అక్షరార్థం “మింగివేయడానికి.” “కారణం లేకుండా” అనేది “ఉచితంగా/ఏ ప్రయోజనం లేకుండా” అని కూడా అర్థమవుతుంది; యోబు 1:9లో యోబు దేవునికి “ఊరికే” భయపడుతున్నాడా అని నిందారోపకుడు అడిగిన మాటను ఇది ప్రతిధ్వనింపజేస్తుంది.
    reason: lexical_alternative_and_cross_reference
lexical_decisions:
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవ నామాన్ని బిరుదుతో భర్తీ చేయకుండా, హీబ్రూ చతురక్షర నామానికి తెలుగు లిప్యంతరీకరణను వాడాం.
- source_word: הַשָּׂטָן
  choice: నిందారోపకుడు
  rationale: నిర్దిష్ట ఉపపదంతో ఉన్న ఈ హీబ్రూ పదం ఇక్కడ వ్యక్తినామం కంటే పాత్రను లేదా విధిని సూచిస్తుంది; న్యాయస్థాన సంబంధమైన ఆరోపణ భావాన్ని ఈ పదం స్పష్టంగా తెలియజేస్తుంది.
- source_word: הֲשַׂמְתָּ לִבְּךָ אֶל
  choice: మీద నీ మనసు నిలిపావా?
  rationale: ‘హృదయాన్ని ఉంచడం’ అనే మూల రూపకాన్ని సహజమైన ఆధునిక తెలుగులో సాధ్యమైనంతవరకు నిలుపుతుంది; భావం ‘పరిశీలించావా?’ అని కూడా రావచ్చు.
- source_word: עַבְדִּי
  choice: నా సేవకుడు
  rationale: యోబు దేవునికి చెందినవాడిగా, ఆయనను సేవించేవాడిగా ఉన్న సంబంధాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אֵין כָּמֹהוּ בָּאָרֶץ
  choice: భూమిమీద అతనిలాంటి వాడు ఎవరూ లేరు
  rationale: ఈ పరలోక సభా సందర్భంలోని విస్తృత పరిధికి ‘భూమిమీద’ సరిపోతుంది; ‘దేశంలో’ అనే పరిమిత భావాన్ని అనవసరంగా ఎంచుకోదు.
- source_word: אִישׁ תָּם וְיָשָׁר
  choice: నిందలేని, యథార్థమైన మనిషి
  rationale: תָּם పాపరహిత పరిపూర్ణత కంటే సంపూర్ణ నైతిక నిష్ఠను సూచిస్తుంది; יָשָׁר యొక్క నేరుగా, సరిగా ఉండే భావాన్ని ‘యథార్థమైన’ తెలియజేస్తుంది.
- source_word: יְרֵא אֱלֹהִים
  choice: దేవునికి భయపడేవాడు
  rationale: భక్తిపూర్వక భయాన్ని నామవాచక విశేషణంగా కుదించకుండా క్రియాత్మకంగా ఉంచుతుంది.
- source_word: וְסָר מֵרָע
  choice: చెడుకు దూరంగా ఉంటాడు
  rationale: చెడు నుండి వైదొలగడం అనే నిరంతర ప్రవర్తనను సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: וְעֹדֶנּוּ מַחֲזִיק בְּתֻמָּתוֹ
  choice: అతడు ఇంకా తన యథార్థతను గట్టిగా పట్టుకొని ఉన్నాడు
  rationale: מחזיק లోని దృఢంగా పట్టుకొనే భావాన్ని, תֻמָּה లోని సమగ్ర నైతిక నిష్ఠను నిలుపుతుంది.
- source_word: וַתְּסִיתֵנִי בוֹ
  choice: నీవు నన్ను అతనికి విరోధంగా ప్రేరేపించినా
  rationale: దైవ ప్రమేయాన్ని మృదువుచేయకుండా causative భావాన్ని నిలుపుతూ, సందర్భంలోని concessive సంబంధాన్ని ‘అయినా’ ద్వారా సహజంగా తెలియజేస్తుంది.
- source_word: לְבַלְּעוֹ
  choice: అతన్ని నాశనం చేయడానికి
  rationale: మూలార్థం ‘మింగివేయడం’; ఈ సందర్భంలో అది రూపకంగా సంపూర్ణ నాశనాన్ని సూచిస్తుంది. ప్రధాన వాక్యంలో సహజత కోసం భావానువాదాన్ని ఎంచుకున్నాం.
- source_word: חִנָּם
  choice: కారణం లేకుండా
  rationale: ‘ఏ కారణమూ లేకుండా’ అనే భావాన్ని స్పష్టంగా ఇస్తుంది; యోబు 1:9లోని అదే పదంతో ఉన్న సాహిత్య ప్రతిధ్వనిని పాదసూచిక తెలియజేస్తుంది.
theological_decisions:
- issue: యోబు బాధలో యాహ్వే ప్రమేయాన్ని ఎలా వ్యక్తపరచాలి
  choice: ‘నీవు నన్ను అతనికి విరోధంగా ప్రేరేపించినా’ అని ప్రత్యక్షంగా ఉంచడం
  alternative: ‘అతనికి హాని జరగనివ్వడానికి నీవు నన్ను ప్రేరేపించినా’
  rationale: హీబ్రూ వాక్యం యాహ్వే చర్యను నిందారోపకుని ప్రేరేపణతో నేరుగా అనుసంధానిస్తుంది. ఈ మాటను మృదువుచేస్తే మూలపాఠంలోని దైవ సార్వభౌమత్వం మరియు నైతిక ఉద్రిక్తత ముందుగానే పరిష్కరించబడుతుంది.
- issue: הַשָּׂטָן వ్యక్తి గుర్తింపు
  choice: పాత్రసూచకంగా ‘నిందారోపకుడు’
  alternative: ‘సాతాను’
  rationale: హీబ్రూలో నిర్దిష్ట ఉపపదం ఉండడం వల్ల ఈ సందర్భంలో అది వ్యక్తినామం కంటే బిరుదు లేదా విధిగా చదవడం సముచితం; తరువాతి సంప్రదాయ గుర్తింపును వాక్యంలోనే నిర్బంధించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనా సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్యనిర్మాణం. ‘యథార్థత’ ద్వారా תם/תמה పదకుటుంబ సంబంధాన్ని సాధ్యమైనంతవరకు నిలిపాం. ప్రధాన పాఠంలో సహజతకు ప్రాధాన్యమిస్తూ, ముఖ్యమైన అక్షరార్థాలు మరియు ప్రత్యామ్నాయ పఠనాలను పాదసూచికల్లో ఉంచాం.
