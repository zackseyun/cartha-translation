revisions:
- from: మళ్లీ ఒక రోజు, దేవుని కుమారులు[a] యాహ్వే ఎదుట తమను తాము హాజరుపరచుకోవడానికి వచ్చారు. ప్రత్యర్థి[b] కూడా వారితో కలిసి యాహ్వే ఎదుట తనను తాను హాజరుపరచుకోవడానికి వచ్చాడు.
  to: మళ్లీ ఒక రోజు వచ్చింది; దేవుని కుమారులు[a] యాహ్వే ఎదుట హాజరుకావడానికి వచ్చారు. ఆ ప్రత్యర్థి[b] కూడా వారి మధ్యలో యాహ్వే ఎదుట హాజరుకావడానికి వచ్చాడు.
  rationale: The revision retains the source text’s ambiguity concerning the identity of the sons of God and the satan, preserves the repeated formal appearance before Yahweh, and improves idiomatic modern Telugu. It also represents the definite, likely titular form of הַשָּׂטָן more clearly and renders בְּתוֹכָם more directly.
