  text: וַ/יְהִ֣י הַ/יּ֔וֹם וַ/יָּבֹ֨אוּ֙ בְּנֵ֣י הָֽ/אֱלֹהִ֔ים לְ/הִתְיַצֵּ֖ב עַל יְהוָ֑ה וַ/יָּב֤וֹא גַֽם הַ/שָּׂטָן֙ בְּ/תֹכָ֔/ם לְ/הִתְיַצֵּ֖ב עַל יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/002/001.yaml
  text: Again there was a day when the sons of God came to present themselves before Yahweh[b][a], and the Adversary also came among them to present himself before Yahweh.
translation:
  language: te
  text: మళ్లీ ఒక రోజు వచ్చింది; దేవుని కుమారులు[a] యాహ్వే ఎదుట హాజరుకావడానికి వచ్చారు. ఆ ప్రత్యర్థి[b] కూడా వారి మధ్యలో యాహ్వే ఎదుట హాజరుకావడానికి వచ్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ మూలంలో అక్షరార్థంగా ‘దేవుని కుమారులు.’ ఇది పరలోక జీవులను లేదా దైవసభ సభ్యులను సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘సాతాను’ లేదా ‘నిందారోపకుడు.’ హీబ్రూలో నిర్దిష్ట ఉపపదంతో ‘ఆ ప్రత్యర్థి’ అని ఉంది; ఇక్కడ ఇది వ్యక్తినామం కంటే బిరుదుగా లేదా పాత్రపేరుగా వాడి ఉండవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי הַיּוֹם
  choice: మళ్లీ ఒక రోజు
  rationale: ఈ మాట 1:6లోని సభా దృశ్యం తిరిగి జరుగుతున్నదని సూచిస్తుంది. సహజమైన ఆధునిక తెలుగులో కథన పునరావృతిని వ్యక్తం చేస్తూనే, ‘ఒక రోజు’ అనే హీబ్రూ కాలసూచనను నిలుపుతుంది.
- source_word: בְּנֵי הָאֱלֹהִים
  choice: దేవుని కుమారులు
  rationale: హీబ్రూ నుడికారాన్ని నేరుగా నిలుపుతూ, వీరు పరలోక జీవులా లేక దైవసభ సభ్యులా అనే వ్యాఖ్యానాన్ని ప్రధాన పాఠ్యంలో ముందుగానే తేల్చదు.
- source_word: לְהִתְיַצֵּב עַל יְהוָה
  choice: యాహ్వే ఎదుట తమను తాము హాజరుపరచుకోవడానికి
  rationale: ఈ సందర్భంలో התיצב అనేది ఉన్నతాధికారి ఎదుట అధికారికంగా హాజరు కావడాన్ని సూచిస్తుంది. ‘హాజరుపరచుకోవడం’ సభా/న్యాయస్థాన భావాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, హీబ్రూ చతురక్షర నామానికి సమీపమైన రూపంలో లిప్యంతరీకరిస్తుంది.
- source_word: הַשָּׂטָן
  choice: ప్రత్యర్థి
  rationale: హీబ్రూలో నిర్దిష్ట ఉపపదం ఉండడం వల్ల ఇది ఇక్కడ స్థిరమైన వ్యక్తినామం కంటే పాత్రను లేదా బిరుదును సూచించే అవకాశం ఎక్కువ. ‘ప్రత్యర్థి’ మూలపదపు విస్తృత అర్థాన్ని నిలుపుతుంది.
- source_word: בְּתוֹכָם
  choice: వారితో కలిసి
  rationale: అతడు ఆ సమూహం మధ్యలో, వారితోపాటు వచ్చాడనే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: הַשָּׂטָן అనేది వ్యక్తినామమా లేక బిరుదా
  choice: ప్రత్యర్థి
  alternative: సాతాను; నిందారోపకుడు
  rationale: నిర్దిష్ట ఉపపదంతో ఉన్న హీబ్రూ రూపం ఇక్కడ ఒక పాత్ర లేదా బిరుదుగా సహజంగా అర్థమవుతుంది. అందువల్ల తరువాతి సంప్రదాయంలోని స్థిర వ్యక్తినామ భావాన్ని పాఠ్యంలోకి బలవంతంగా తీసుకురాకుండా వ్యాకరణ సంకేతాన్ని నిలిపాం.
- issue: בְּנֵי הָאֱלֹהִים యొక్క గుర్తింపు
  choice: దేవుని కుమారులు
  alternative: పరలోక జీవులు; దైవసభ సభ్యులు
  rationale: మూలపాఠ్యంలోని రూపక నుడికారాన్నే ప్రధాన పాఠ్యంలో ఉంచడం ద్వారా వారి ఖచ్చిత గుర్తింపుపై ఉన్న నిజమైన వ్యాఖ్యాన విస్తృతిని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు స్పష్టంగా ఉండే శైలి. పునరుక్త క్రియావాక్యాన్ని ఉద్దేశపూర్వకంగా నిలిపి, దేవుని కుమారుల రాకకు మరియు ప్రత్యర్థి రాకకు మధ్యనున్న హీబ్రూ సమాంతర నిర్మాణాన్ని కాపాడాం.
