  text: וַ/יִּשְׂא֨וּ אֶת עֵינֵי/הֶ֤ם מֵ/רָחוֹק֙ וְ/לֹ֣א הִכִּירֻ֔/הוּ וַ/יִּשְׂא֥וּ קוֹלָ֖/ם וַ/יִּבְכּ֑וּ וַֽ/יִּקְרְעוּ֙ אִ֣ישׁ מְעִל֔/וֹ וַ/יִּזְרְק֥וּ עָפָ֛ר עַל רָאשֵׁי/הֶ֖ם הַ/שָּׁמָֽיְמָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/002/012.yaml
  text: And when they lifted up their eyes from a distance[a], they did not recognize him. Then they raised their voices and wept[b], and each man tore his robe and threw dust over his head toward the heavens.
translation:
  language: te
  text: 'వారు దూరం నుంచి[a] కళ్లెత్తి చూసినప్పుడు, అతణ్ణి గుర్తుపట్టలేకపోయారు. అప్పుడు వారు గొంతెత్తి ఏడ్చారు. ఒక్కొక్కరూ తమ పైవస్త్రాన్ని చింపుకొని, ఆకాశం వైపుగా[b] తమ తలల మీదికి దుమ్ము విసిరారు.


    [a] లేదా, “దూరం నుంచే.”


    [b] హీబ్రూలో, “ఆకాశం వైపుగా”; అంటే, దుఃఖాన్ని వ్యక్తం చేసే సూచనగా దుమ్మును పైకి విసిరారు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దూరం నుంచే.”
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో, “ఆకాశం వైపుగా”; అంటే, దుఃఖాన్ని వ్యక్తం చేసే సూచనగా దుమ్మును పైకి విసిరారు.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׂאוּ אֶת עֵינֵיהֶם
  choice: కళ్లెత్తి చూసినప్పుడు
  rationale: హీబ్రూ నుడికారంలోని పైకి చూడడాన్ని నిలుపుతూ, ఆధునిక తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: מֵרָחוֹק
  choice: దూరం నుంచి
  rationale: స్థలపరమైన దూరాన్ని స్పష్టమైన, సాధారణ ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: הִכִּירֻהוּ
  choice: అతణ్ణి గుర్తుపట్టలేకపోయారు
  rationale: ఇక్కడ యోబు రూపాన్ని చూసి గుర్తించలేకపోవడమే భావం; కేవలం ‘తెలియలేదు’ కంటే ఇది సందర్భానికి ఖచ్చితంగా సరిపోతుంది.
- source_word: וַיִּשְׂאוּ קוֹלָם וַיִּבְכּוּ
  choice: వారు గొంతెత్తి ఏడ్చారు
  rationale: స్వరాన్ని ఎత్తడం మరియు రోదించడం అనే రెండు అంశాలను సంక్షిప్తంగా, సహజమైన తెలుగు నుడికారంలో నిలుపుతుంది.
- source_word: וַיִּקְרְעוּ אִישׁ מְעִלוֹ
  choice: ఒక్కొక్కరూ తమ పైవస్త్రాన్ని చింపుకొని
  rationale: אִישׁ యొక్క పంపిణీ భావాన్ని ‘ఒక్కొక్కరూ’తోను, מְעִיל అనే వెలుపలి వస్త్రాన్ని ‘పైవస్త్రం’తోను వ్యక్తపరుస్తుంది.
- source_word: וַיִּזְרְקוּ עָפָר עַל רָאשֵׁיהֶם
  choice: తమ తలల మీదికి దుమ్ము విసిరారు
  rationale: దుఃఖాచారంలో దుమ్మును పైకి విసిరి తలలపై పడే చర్యను అతిగా వివరణ చేయకుండా ప్రతిబింబిస్తుంది.
- source_word: הַשָּׁמָיְמָה
  choice: ఆకాశం వైపుగా
  rationale: దిశను సూచించే హీబ్రూ రూపాన్ని నిలుపుతూ, తెలుగులో సహజంగా పైదిశను తెలియజేస్తుంది.
