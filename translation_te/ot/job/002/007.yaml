  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֵּצֵא֙ הַ/שָּׂטָ֔ן מֵ/אֵ֖ת פְּנֵ֣י יְהוָ֑ה וַ/יַּ֤ךְ אֶת אִיּוֹב֙ בִּ/שְׁחִ֣ין רָ֔ע מִ/כַּ֥ף רַגְל֖/וֹ עד קָדְקֳדֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/002/007.yaml
  text: So the Adversary went out from the presence of Yahweh and struck Job with painful sores from the sole of his foot to the crown of his head[a][b].
translation:
  language: te
  text: అప్పుడు విరోధి యాహ్వే సన్నిధి నుండి బయలుదేరి, యోబును తీవ్రమైన కురుపులతో పాదతలం నుండి నడినెత్తి వరకు బాధించాడు[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీలో ‘ఆ విరోధి’; సంప్రదాయంగా ‘సాతాను’ అని అనువదిస్తారు. ఇక్కడ ఈ పదానికి నిర్దిష్ట ఉపపదం ఉండడం వల్ల అది ‘విరోధి’ అనే బిరుదుగా పనిచేస్తుండవచ్చు.
    reason: alternative_reading
  - marker: b
    text: ‘తీవ్రమైన పుండ్లతో’ లేదా ‘బాధాకరమైన కురుపులతో’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשָּׂטָן
  choice: విరోధి
  rationale: ఈ సందర్భంలో హెబ్రీ పదానికి నిర్దిష్ట ఉపపదం ఉంది; కాబట్టి స్థిరమైన వ్యక్తినామంగా కాక, పాత్రను సూచించే బిరుదుగా అనువదించడం మూలంలోని భావాన్ని కాపాడుతుంది.
- source_word: מֵאֵת פְּנֵי יְהוָה
  choice: యాహ్వే సన్నిధి నుండి
  rationale: ఈ నిర్మాణంలో ‘ముఖం’ అనే పదం సహజంగా ‘సన్నిధి’ని సూచిస్తుంది; יְהוָה అనే దైవనామాన్ని ‘యాహ్వే’గా లిప్యంతరీకరించాం.
- source_word: וַיַּךְ
  choice: కొట్టాడు
  rationale: నכה అనే క్రియలోని ప్రత్యక్షమైన ‘కొట్టు/దెబ్బతీయు’ భావాన్ని ఆధునిక తెలుగులో స్పష్టంగా నిలుపుతుంది.
- source_word: בִּשְׁחִין רָע
  choice: తీవ్రమైన కురుపులతో
  rationale: שְׁחִין వాపుతో కూడిన చర్మ కురుపులు లేదా పుండ్లను సూచించగలదు; רָע ఇక్కడ నైతిక దుష్టత్వాన్ని కాక వ్యాధి తీవ్రతను తెలియజేస్తుంది.
- source_word: מִכַּף רַגְלוֹ
  choice: పాదతలం మొదలుకొని
  rationale: పాదానికి సంబంధించిన כַּף అంటే పాదతలం; ‘మొదలుకొని’ అనే ప్రయోగం శరీరమంతటా వ్యాపించిన పరిధిని సహజంగా తెలియజేస్తుంది.
- source_word: עַד קָדְקֳדוֹ
  choice: నడినెత్తి వరకు
  rationale: קָדְקֹד తల పైభాగాన్ని సూచిస్తుంది; ‘నడినెత్తి’ ఆధునిక తెలుగులో సంక్షిప్తమైన, స్పష్టమైన సమానార్థకం.
theological_decisions:
- issue: యోబు గ్రంథపు ప్రస్తావనలో הַשָּׂטָן అనువాదం
  choice: విరోధి
  alternative: సాతాను; ఆ విరోధి
  rationale: నిర్దిష్ట ఉపపదంతో ఉన్న హెబ్రీ రూపం ఇక్కడ ఒక బిరుదు లేదా విధిని సూచించవచ్చు. ‘విరోధి’ అనడం తరువాతి కాలపు వ్యక్తినామ భావాన్ని మూలపాఠంపై ముందుగానే మోపకుండా, దానిలోని ఉద్దేశపూర్వక ఉద్రిక్తతను నిలుపుతుంది.
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠంలో ఉన్న నాలుగు అక్షరాల దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా ‘యాహ్వే’గా అందించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన శైలి వాడబడింది. ‘సన్నిధి’, ‘పాదతలం’, ‘నడినెత్తి’ వంటి సహజ పదాలతో మూలంలోని ప్రత్యక్షతను, శరీరమంతటినీ సూచించే పరిధిని నిలిపాం; ‘కొట్టాడు’ అనే క్రియ మూలంలోని కఠినమైన చర్యను మృదువుచేయదు.
