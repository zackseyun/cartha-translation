  text: וַֽ/יִּשְׁמְע֞וּ שְׁלֹ֣שֶׁת רֵעֵ֣י אִיּ֗וֹב אֵ֣ת כָּל הָ/רָעָ֣ה הַ/זֹּאת֮ הַ/בָּ֣אָה עָלָי/ו֒ וַ/יָּבֹ֨אוּ֙ אִ֣ישׁ מִ/מְּקֹמ֔/וֹ אֱלִיפַ֤ז הַ/תֵּימָנִי֙ וּ/בִלְדַּ֣ד הַ/שּׁוּחִ֔י וְ/צוֹפַ֖ר הַ/נַּֽעֲמָתִ֑י וַ/יִּוָּעֲד֣וּ יַחְדָּ֔ו לָ/ב֥וֹא לָ/נֽוּד ל֖/וֹ וּֽ/לְ/נַחֲמֽ/וֹ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/002/011.yaml
  text: 'When Job’s three friends heard about all this trouble that had come upon him[a], they came each from his own place: Eliphaz the Temanite, Bildad the Shuhite, and Zophar the Naamathite[d][c][b]. They agreed together to come to sympathize with him and to comfort him.'
translation:
  language: te
  text: 'యోబుకు వచ్చిన ఈ విపత్తు అంతటి సంగతి అతని ముగ్గురు స్నేహితులు విన్నప్పుడు[a], వారు తమ తమ ప్రాంతాల నుండి వచ్చారు: తేమానీయుడైన ఎలీఫజు, షూహీయుడైన బిల్దదు, నయమాతీయుడైన జోఫరు. అతని దగ్గరకు వచ్చి అతనితో సంతాపం తెలియజేయడానికి[c], అతన్ని ఓదార్చడానికి వారు కలసి నిర్ణయించుకున్నారు[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఈ కష్టమంతటి సంగతి,’ ‘ఈ దురవస్థ అంతటి సంగతి.’ ఇక్కడి హీబ్రూ పదం רָעָה యోబు చేసిన నైతిక చెడును కాక, అతనికి సంభవించిన విపత్తును సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘వారు కలుసుకోవడానికి ఏర్పాటు చేసుకున్నారు.’ హీబ్రూ క్రియ ఉద్దేశపూర్వకంగా కలిసి ఏర్పాటుచేసుకోవడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘అతనిపై సానుభూతి చూపడానికి,’ ‘అతనితో కలిసి దుఃఖించడానికి.’ హీబ్రూ క్రియ బాధ లేదా మరణ సందర్భంలో సానుభూతి, సంతాపం వ్యక్తం చేయడాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמְעוּ
  choice: విన్నప్పుడు
  rationale: వావ్ వరుస కథనాన్ని ముందుకు నడిపిస్తుంది; తెలుగు కథన ప్రవాహంలో కాలసంబంధ ఉపవాక్యంగా సహజంగా వ్యక్తమవుతుంది.
- source_word: שְׁלֹשֶׁת רֵעֵי אִיּוֹב
  choice: యోబు ... ముగ్గురు స్నేహితులు
  rationale: నిర్మాణ శ్రేణిని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; רֵעַ యొక్క సాధారణ భావం ‘స్నేహితుడు’.
- source_word: כָּל הָרָעָה הַזֹּאת
  choice: ఈ విపత్తంతటి
  rationale: ఇక్కడ רָעָה నైతిక చెడును కాక యోబుకు సంభవించిన దురవస్థ లేదా విపత్తును సూచిస్తుంది.
- source_word: הַבָּאָה עָלָיו
  choice: యోబుకు వచ్చిన
  rationale: ‘మీదికి వచ్చిన’ అనే మూల రూపకాన్ని అతిగా కృత్రిమం చేయకుండా, సంభవించిన విపత్తు అనే భావాన్ని తెలుగులో సహజంగా నిలుపుతుంది.
- source_word: וַיָּבֹאוּ אִישׁ מִמְּקֹמוֹ
  choice: వారిలో ప్రతి ఒక్కరూ తమ తమ ప్రాంతాల నుంచి వచ్చారు
  rationale: אִישׁ ఇక్కడ విభజనార్థకంగా ‘ప్రతి ఒక్కరూ’; מָקוֹם సందర్భంలో వారి వారి నివాస ప్రాంతాలను సూచిస్తుంది.
- source_word: הַתֵּימָנִי / הַשּׁוּחִי / הַנַּעֲמָתִי
  choice: తేమానీయుడు / షూహీయుడు / నయమాతీయుడు
  rationale: వ్యక్తుల ప్రాంతీయ లేదా వంశ సంబంధ గుర్తింపులను తెలుగు పేర్ల రూపానికి అనుగుణంగా లిప్యంతరీకరించింది.
- source_word: וַיִּוָּעֲדוּ יַחְדָּו
  choice: వారు కలసి నిర్ణయించుకున్నారు
  rationale: యעד్ నిఫాల్ రూపంలోని ఉద్దేశపూర్వక సమన్వయం లేదా ముందస్తు ఏర్పాటు భావాన్ని తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: לָבוֹא
  choice: అతని దగ్గరకు వచ్చి
  rationale: ప్రయోజనార్థక క్రియారూపాన్ని మూలంలోని ‘రావడం’ దృష్టికోణంతో నిలుపుతూ తెలుగులో సహజమైన అనుసంధాన క్రియగా ఇచ్చింది.
- source_word: לָנוּד לוֹ
  choice: అతనితో కలిసి దుఃఖించి
  rationale: נוּד ఇక్కడ బాధలో సానుభూతి చూపడం, సంతాపం వ్యక్తం చేయడం అనే భావం కలిగి ఉంది; తరువాతి ‘ఓదార్చడం’తో భేదాన్ని నిలుపుతుంది.
- source_word: וּלְנַחֲמוֹ
  choice: అతన్ని ఓదార్చాలని
  rationale: נחם యొక్క పియేల్ భావమైన ఓదార్చడం లేదా ఆదరించడం సహజమైన ఆధునిక తెలుగులో వ్యక్తమవుతుంది.
theological_decisions:
- issue: רָעָה యొక్క నైతిక లేదా విపత్తు భావం
  choice: విపత్తు
  alternative: చెడు
  rationale: సందర్భం యోబు చేసిన నైతిక చెడును కాదు, అతనికి సంభవించిన దుర్ఘటనలను సూచిస్తుంది.
- issue: לָנוּד యొక్క భావవ్యాప్తి
  choice: అతనితో కలిసి దుఃఖించడం
  alternative: అతనిపై సానుభూతి చూపడం
  rationale: మూలక్రియ సానుభూతితో పాటు సంతాపం లేదా దుఃఖప్రకటనను కూడా సూచించగలదు; ప్రధాన పాఠం ఆ భావాన్ని నిలుపుతుంది, పాదసూచిక ప్రత్యామ్నాయాన్ని తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే కథన శైలి. పేర్లు, ప్రాంతీయ గుర్తింపులు తెలుగు బైబిల్ వినియోగానికి దగ్గరగా లిప్యంతరీకరించబడ్డాయి. ‘దుఃఖించి’ మరియు ‘ఓదార్చాలని’ అనే రెండు వేరు క్రియలతో మూలంలోని భావభేదం నిలుపబడింది.
