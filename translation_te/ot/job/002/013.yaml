  text: וַ/יֵּשְׁב֤וּ אִתּ/וֹ֙ לָ/אָ֔רֶץ שִׁבְעַ֥ת יָמִ֖ים וְ/שִׁבְעַ֣ת לֵיל֑וֹת וְ/אֵין דֹּבֵ֤ר אֵלָי/ו֙ דָּבָ֔ר כִּ֣י רָא֔וּ כִּֽי גָדַ֥ל הַ/כְּאֵ֖ב מְאֹֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/002/013.yaml
  text: And they sat with him on the ground seven days and seven nights[a], and no one spoke a word to him, because they saw that his pain was very great.
translation:
  language: te
  text: వారు అతనితో పాటు నేలమీద ఏడు రోజులు, ఏడు రాత్రులు కూర్చున్నారు. అతని బాధ ఎంతో తీవ్రమైనదని వారు చూశారు కాబట్టి, వారిలో ఎవరూ అతనితో ఒక్క మాట కూడా మాట్లాడలేదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతని వేదన ఎంతో తీవ్రమైనది” లేదా “అతని దుఃఖం ఎంతో తీవ్రమైనది.” హీబ్రూ పదం శారీరక వేదనతో పాటు మానసిక వ్యథను కూడా సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשְׁבוּ אִתּוֹ לָאָרֶץ
  choice: వారు అతనితో పాటు నేలమీద ... కూర్చున్నారు
  rationale: ישׁב యొక్క ప్రత్యక్ష అర్థమైన ‘కూర్చోవడం’ను, אִתּוֹ యొక్క సహవాస భావాన్ని, לָאָרֶץ సూచించే శోకాచరణ స్థలాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: שִׁבְעַת יָמִים וְשִׁבְעַת לֵילוֹת
  choice: ఏడు పగళ్లు, ఏడు రాత్రులు
  rationale: పూర్తి కాలవ్యవధిని సూచించే హీబ్రూ వ్యక్తీకరణను స్పష్టంగా, సహజంగా ప్రతిబింబిస్తుంది.
- source_word: וְאֵין דֹּבֵר אֵלָיו דָּבָר
  choice: వారిలో ఎవరూ అతనితో ఒక్క మాట కూడా మాట్లాడలేదు
  rationale: హీబ్రూ నిర్మాణం నొక్కిచెప్పే సంపూర్ణ మౌనాన్ని ‘ఒక్క మాట కూడా’ అనే సహజ తెలుగు ప్రయోగంతో కాపాడుతుంది.
- source_word: כִּי רָאוּ
  choice: వారు చూశారు కాబట్టి
  rationale: כִּי ఇక్కడ వారి మౌనానికి కారణాన్ని తెలియజేస్తుంది.
- source_word: כִּי גָדַל הַכְּאֵב מְאֹד
  choice: అతని బాధ ఎంతో తీవ్రమైనదని
  rationale: כאב శారీరక వేదనతో పాటు విస్తృతమైన బాధ, దుఃఖాన్ని కూడా సూచించగలదు. సందర్భంలో రెండింటినీ మోయగల ‘బాధ’ను ఎంచుకుని, מְאֹד యొక్క తీవ్రతను ‘ఎంతో తీవ్రమైనది’గా తెలిపాం.
theological_decisions:
- issue: הַכְּאֵב సూచించే బాధ స్వభావం
  choice: బాధ
  alternative: వేదన; దుఃఖం
  rationale: యోబు శారీరక వ్యాధి తక్షణ సందర్భంలో ఉన్నప్పటికీ, పదం శారీరక వేదనకే పరిమితం కాదు. ‘బాధ’ శారీరక, మానసిక కష్టాల రెండింటినీ తెరిచి ఉంచి మూలంలోని భావవిస్తృతిని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైన శోక సందర్భానికి తగిన సరళ, గౌరవప్రదమైన శైలి. తెలుగు వాక్యప్రవాహం కోసం కారణ వాక్యాన్ని ప్రధాన వాక్యానికి ముందు ఉంచినా, మూలంలోని కారణ సంబంధం యథాతథంగా నిలిపాం.
