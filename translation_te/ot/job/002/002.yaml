source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל הַ/שָּׂטָ֔ן אֵ֥י מִ/זֶּ֖ה תָּבֹ֑א וַ/יַּ֨עַן הַ/שָּׂטָ֤ן אֶת יְהוָה֙ וַ/יֹּאמַ֔ר מִ/שֻּׁ֣ט בָּ/אָ֔רֶץ וּ/מֵ/הִתְהַלֵּ֖ךְ בָּֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/002/002.yaml
  text: And Yahweh said to the Accuser[a], “From where have you come?” And the Accuser answered Yahweh and said, “From roaming about on the earth and from walking around on it.”
translation:
  language: te
  text: 'యహ్వే నిందారోపకునితో[a], “నువ్వు ఎక్కడి నుంచి వచ్చావు?” అని అడిగాడు. నిందారోపకుడు యహ్వేకు జవాబిచ్చి ఇలా అన్నాడు: “భూమిమీద అటూ ఇటూ తిరుగుతూ, దానిమీద సంచరిస్తూ వచ్చాను.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూలో: ‘హ-సాతాను’—అంటే ‘సాతాను’కు నిర్దిష్ట ఉపపదం జతచేయబడింది; ఇక్కడ ఇది వ్యక్తినామం కాక, ‘నిందారోపకుడు’ లేదా ‘విరోధి’ అనే అర్థమిచ్చే బిరుదై ఉండవచ్చు.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో ఇచ్చాం.
- source_word: הַשָּׂטָן
  choice: నిందారోపకుడు
  rationale: నిర్దిష్ట ఉపపదంతో ఉన్న ఈ హీబ్రూ పదం ఇక్కడ వ్యక్తినామం కంటే పాత్రను లేదా బిరుదును సూచిస్తుంది. న్యాయస్థాన సంబంధమైన ఆరోపణ భావాన్ని ‘నిందారోపకుడు’ సహజంగా తెలియజేస్తుంది.
- source_word: אֵי מִזֶּה תָּבֹא
  choice: నువ్వు ఎక్కడి నుంచి వచ్చావు?
  rationale: మూలస్థానాన్ని అడిగే హీబ్రూ నుడికారాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וַיַּעַן ... וַיֹּאמַר
  choice: జవాబిస్తూ ... అన్నాడు
  rationale: హీబ్రూలోని రెండు వరుస క్రియల భావాన్ని నిలుపుతూ, తెలుగులో అనవసరమైన పునరుక్తి రాకుండా సహజంగా వ్యక్తం చేశాం.
- source_word: מִשֻּׁט
  choice: అటూ ఇటూ తిరిగి
  rationale: శׁוּט పదంలోని పలుచోట్లకు తిరిగే లేదా ఇటూ అటూ సంచరించే భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: בָּאָרֶץ
  choice: భూమి మీద
  rationale: ఈ సందర్భంలో אֶרֶץ ఒక నిర్దిష్ట దేశాన్ని కాక భూమిని లేదా నివాస ప్రపంచాన్ని సూచిస్తుంది.
- source_word: וּמֵהִתְהַלֵּךְ בָּהּ
  choice: దానిపై సంచరించి
  rationale: హిత్పయేల్ రూపంలోని పదేపదే లేదా చుట్టూ తిరిగే భావాన్ని నిలుపుతుంది; ‘గస్తీ కాసి’ వంటి మరింత నిర్దిష్ట భావాన్ని చేర్చదు.
theological_decisions:
- issue: הַשָּׂטָן అనే పదాన్ని వ్యక్తినామంగా ఇవ్వాలా, పాత్ర లేదా బిరుదుగా ఇవ్వాలా
  choice: నిందారోపకుడు
  alternative: సాతాను; విరోధి
  rationale: హీబ్రూలో ఈ పదానికి నిర్దిష్ట ఉపపదం ఉండటం, పరలోక సభలో అతని పాత్రను సూచించే బిరుదుగా దీన్ని అర్థం చేసుకోవడానికి బలం ఇస్తుంది. కాబట్టి తర్వాతి సంప్రదాయ భావనను ముందుగానే పాఠ్యంలోకి తేవకుండా మూలంలోని ఉద్రిక్తతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన కథన శైలిని వాడాం. దేవుడు ప్రత్యక్షంగా సంభాషించే చోట సహజమైన ఏకవచన సంబోధన ‘నువ్వు’ను ఉపయోగించాం.
