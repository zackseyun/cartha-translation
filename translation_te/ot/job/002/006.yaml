  yaml_path: translation/ot/job/002/006.yaml
  text: And the LORD said to the Accuser, “Look, he is in your hand; only spare his life.”
translation:
  language: te
  text: అప్పుడు యెహోవా నిందారోపకునితో, “ఇదిగో, అతడు నీ చేతిలో ఉన్నాడు. అయితే అతని ప్రాణాన్ని మాత్రం కాపాడు” అన్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన టెట్రాగ్రామటన్‌ను సాధారణ బిరుదుతో భర్తీ చేయకుండా, తెలుగులో సుపరిచితమైన రూపంలో సూచించాం.
- source_word: הַשָּׂטָן
  choice: నిందారోపకుడు
  rationale: నిర్దిష్ట ఉపపదంతో ఉన్న ఈ పదం ఇక్కడ ఒక పాత్ర/హోదాను సూచిస్తుంది; అందువల్ల వ్యక్తినామంగా మార్చకుండా దాని కార్యార్థాన్ని నిలిపాం.
- source_word: הִנּוֹ
  choice: ఇదిగో
  rationale: దృష్టిని ఆకర్షించే హీబ్రూ ఉద్ఘాటనను సహజమైన తెలుగు రూపంలో నిలిపాం.
- source_word: בְיָדֶךָ
  choice: నీ చేతిలో ఉన్నాడు
  rationale: అతడు ఎదుటివాని అధీనానికి అప్పగించబడ్డాడనే హీబ్రూ రూపకాన్ని యథాతథంగా, తెలుగులో సహజంగా ఉంచాం.
- source_word: נַפְשׁוֹ
  choice: అతని ప్రాణం
  rationale: ఈ సందర్భంలో నెఫెష్ శరీరానికి విరుద్ధమైన అమరాత్మను కాకుండా జీవితం/ప్రాణాన్ని సూచిస్తుంది.
- source_word: שְׁמֹר
  choice: కాపాడు
  rationale: మూల క్రియ యొక్క ప్రత్యక్ష అర్థం ‘కాపాడు/భద్రపరచు’; సందర్భంలో అతని ప్రాణం తీయకూడదనే పరిమితిని తెలియజేస్తుంది.
theological_decisions:
- issue: הַשָּׂטָן ను వ్యక్తినామంగా లేదా పాత్రబిరుదుగా అనువదించడం
  choice: నిందారోపకుడు
  alternative: సాతాను
  rationale: హీబ్రూలోని నిర్దిష్ట ఉపపదం ఈ సందర్భంలో ‘ఆ నిందారోపకుడు’ అనే సభాపాత్రను ముందుకు తెస్తుంది; తరువాతి సంప్రదాయ గుర్తింపును అనువాదంలో ముందుగానే ఖరారు చేయలేదు.
- issue: נפשׁ యొక్క స్వరూపం
  choice: ప్రాణం
  alternative: ఆత్మ
  rationale: అతని శారీరక జీవితం తీయకూడదనే సందర్భార్థాన్ని ‘ప్రాణం’ స్పష్టంగా అందిస్తుంది; ఆత్మ-శరీర ద్వైతంపై అదనపు సిద్ధాంతార్థాన్ని దిగుమతి చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకునికి సులభంగా ఉండే వాక్యనిర్మాణం. ‘అయితే… మాత్రం’ అనే నిర్మాణం אַךְ తెలిపే కఠిన పరిమితిని సహజంగా వ్యక్తం చేస్తుంది.
