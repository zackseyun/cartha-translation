id: JOB.2.4
reference: Job 2:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּ֧עַן הַ/שָּׂטָ֛ן אֶת יְהוָ֖ה וַ/יֹּאמַ֑ר ע֣וֹר בְּעַד ע֗וֹר וְ/כֹל֙ אֲשֶׁ֣ר לָ/אִ֔ישׁ יִתֵּ֖ן בְּעַ֥ד נַפְשֽׁ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/002/004.yaml
  text: Then the Adversary answered Yahweh and said[a], “Skin for skin! Indeed[c][b], all that a man has he will give for his life.”
translation:
  language: te
  text: 'అప్పుడు ప్రత్యర్థి[a] యెహోవాకు ప్రత్యుత్తరమిస్తూ ఇలా అన్నాడు: “చర్మానికి బదులు చర్మం![b] ఒక మనిషి తన ప్రాణం[c] కోసం తనకున్నదంతా ఇస్తాడు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “సాతాను”; హెబ్రీలో ఇది “ఆ ప్రత్యర్థి/నిందారోపకుడు” అనే బిరుదులాంటి రూపంలో ఉంది.
    reason: alternative_reading
  - marker: b
    text: “చర్మానికి బదులు చర్మం” అనేది సంక్షిప్తమైన సామెత. తన ప్రాణాన్ని కాపాడుకోవడానికి మనిషి మరొకదాన్ని వదులుకుంటాడనే భావం దీనిలో ఉండవచ్చు.
    reason: cultural_note
  - marker: c
    text: లేదా “తన జీవితం” లేదా “తన స్వయం.” ఈ సందర్భంలో “ప్రాణం” సరిపోతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשָּׂטָן
  choice: ప్రత్యర్థి
  rationale: నిర్దిష్ట ఉపపదంతో ఉన్న హెబ్రీ పదం ఇక్కడ వ్యక్తిగత పేరుకన్నా పాత్రను సూచించే బిరుదులా పనిచేస్తుంది. ‘ప్రత్యర్థి’ ఆ పాత్రార్థాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవ నామాన్ని తెలుగు బైబిలు పఠనంలో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో ఉంచింది.
- source_word: עוֹר בְּעַד עוֹר
  choice: చర్మానికి చర్మం
  rationale: మూలంలోని సంక్షిప్తమైన సామెత రూపాన్ని వ్యాఖ్యానంతో విప్పకుండా సాధ్యమైనంత దగ్గరగా నిలుపుతుంది; అర్థసూచనను పాదసూచికలో ఇస్తుంది.
- source_word: בְּעַד
  choice: కోసం / -కి
  rationale: ఈ సందర్భంలో మార్పిడి లేదా ఒకదాన్ని కాపాడుకోవడానికి మరొకదాన్ని వదులుకునే భావం ఉంది. సామెతలో ‘-కి’, రెండో వాక్యంలో సహజమైన ‘కోసం’ వాడబడ్డాయి.
- source_word: אִישׁ
  choice: ఒక మనిషి
  rationale: ఏ మనిషికైనా వర్తించే సాధారణ ఏకవచన పురుషవాచక ప్రయోగాన్ని మూలానికి దగ్గరగా నిలుపుతుంది.
- source_word: נַפְשׁוֹ
  choice: తన ప్రాణం
  rationale: ఇక్కడ పదం అమూర్తమైన ఆత్మను కాకుండా వ్యక్తి జీవాన్ని లేదా తనను తాను కాపాడుకోవడాన్ని సూచిస్తుంది; అందువల్ల ‘ప్రాణం’ సందర్భానికి సరిపోతుంది.
- source_word: וְכֹל אֲשֶׁר לָאִישׁ
  choice: తనకున్నదంతా
  rationale: ‘మనిషికి ఉన్నదంతా’ అనే స్వామ్య భావాన్ని సంక్షిప్తంగా, సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: יִתֵּן
  choice: ఇచ్చేస్తాడు
  rationale: సామాన్యంగా మనిషి ఏమి చేయడానికి సిద్ధపడతాడో తెలిపే హెబ్రీ అసంపూర్ణ క్రియాభావాన్ని తెలుగులో సాధారణ వర్తమాన-భవిష్యత్ భావంతో వ్యక్తం చేస్తుంది; ‘-ేస్తాడు’ సంపూర్ణంగా వదులుకునే తీవ్రతను సహజంగా సూచిస్తుంది.
theological_decisions:
- issue: యోబు గ్రంథపు ప్రస్తావనలో הַשָּׂטָן అనువాదం
  choice: ప్రత్యర్థి
  alternative: సాతాను; నిందారోపకుడు
  rationale: నిర్దిష్ట ఉపపదం మరియు పరలోక న్యాయసభను పోలిన సందర్భం పాత్రాధారిత బిరుదును సూచిస్తాయి. ‘ప్రత్యర్థి’ అని అనువదించడం తరువాతి గ్రంథాల గుర్తింపును ముందుగానే ఈ వచనంలోకి దిగుమతి చేయకుండా, ఇక్కడి సాహిత్య-దైవశాస్త్ర అనిశ్చితిని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి వాడబడింది. హెబ్రీ సామెత యొక్క ఉద్దేశపూర్వక సంక్షిప్తతను ప్రధాన పాఠ్యంలో నిలిపి, సంభావ్య భావాన్ని పాదసూచికకు పరిమితం చేశాం.
