source:
  edition: WLC
  text: אוּלָם֙ שְֽׁלַֽח נָ֣א יָֽדְ/ךָ֔ וְ/גַ֥ע אֶל עַצְמ֖/וֹ וְ/אֶל בְּשָׂר֑/וֹ אִם לֹ֥א אֶל פָּנֶ֖י/ךָ יְבָרֲכֶֽ/ךָּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/002/005.yaml
  text: But stretch out your hand[a], please, and touch his bone and his flesh, and he will surely curse you to your face.
translation:
  language: te
  text: అయితే, దయచేసి నీ చెయ్యి చాపి అతని ఎముకను, మాంసాన్ని తాకు. అప్పుడు అతడు నీ ముఖం ఎదుటే నిన్ను తప్పకుండా శపిస్తాడు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థం ‘నిన్ను ఆశీర్వదిస్తాడు’; ఇక్కడ అది ‘నిన్ను శపిస్తాడు’ అనే అర్థంలో వాడిన సభ్యోక్తి.
    reason: lexical_alternative
lexical_decisions:
- source_word: אוּלָם
  choice: అయితే
  rationale: సాతాను ముందటి మాటకు విరుద్ధంగా తన సవాలును కొనసాగిస్తున్న భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: שְׁלַח נָא יָדְךָ
  choice: దయచేసి నీ చెయ్యి చాపి
  rationale: ‘చెయ్యి పంపు’ అనే హీబ్రూ నుడికారానికి ఇక్కడ చర్య తీసుకోవడం అనే భావం ఉంది. ‘చెయ్యి చాపి’ ఆ రూపకాన్ని నిలుపుతుంది; ‘దయచేసి’ נָא లోని అభ్యర్థన భావాన్ని ప్రతిబింబిస్తుంది.
- source_word: וְגַע
  choice: తాకు
  rationale: నגע క్రియ యొక్క ప్రాథమిక అర్థమైన ‘తాకడం’ను నిలుపుతూ, సందర్భంలోని హానికరమైన చర్యను పాఠకుడు గ్రహించేలా చేస్తుంది; ‘కొట్టు’ లేదా ‘బాధించు’ అని భావాన్ని ముందే నిర్దిష్టం చేయదు.
- source_word: אֶל עַצְמוֹ וְאֶל בְּשָׂרוֹ
  choice: అతని ఎముకను, మాంసాన్ని
  rationale: హీబ్రూలో ఏకవచన సమష్టి పదాలుగా ఉన్న ‘ఎముక’, ‘మాంసం’ అనే శరీర సంబంధమైన స్పష్టమైన వ్యక్తీకరణను ‘శరీరం’గా చదును చేయకుండా నిలుపుతుంది.
- source_word: אִם לֹא
  choice: తప్పకుండా
  rationale: ఇక్కడ ఇది సాధారణ షరతు కాక, ప్రమాణసదృశమైన బలమైన నిశ్చయ ప్రకటన. ‘తప్పకుండా’ ఆ ఉద్ఘాటనను సహజమైన తెలుగులో అందిస్తుంది.
- source_word: אֶל פָּנֶיךָ
  choice: నీ ముఖం ఎదుటే
  rationale: దేవుని సమక్షంలోనే ప్రత్యక్షంగా, బహిరంగంగా ఎదురుతిరగడం అనే భావాన్ని తెలియజేస్తుంది.
- source_word: יְבָרֲכֶךָּ
  choice: నిన్ను శపిస్తాడు
  rationale: ברך సాధారణంగా ‘ఆశీర్వదించు’ అని అర్థమైనా, ఈ పరీక్ష సందర్భంలో భక్తిపూర్వక పరిహారప్రయోగంగా ‘శపించు’ అనే భావంలో వాడబడింది. సందర్భార్థాన్ని ప్రధాన పాఠ్యంలో స్పష్టంగా ఇచ్చి, అక్షరార్థాన్ని పాదటిప్పణిలో ఉంచాం.
theological_decisions:
- issue: యోబు పరీక్ష వృత్తాంతంలో ברך అనే పదం పరిహారప్రయోగంగా ఉండటం
  choice: ప్రధాన పాఠ్యంలో ‘శపిస్తాడు’ అని అనువదించడం
  alternative: ‘ఆశీర్వదిస్తాడు’ అని అక్షరార్థంగా అనువదించి వివరణ ఇవ్వడం
  rationale: సాతాను చేస్తున్న సవాలు యోబు బాధలో దేవుణ్ణి తిరస్కరిస్తాడనే భావంలో ఉంది. ప్రధాన పాఠ్యంలో ‘ఆశీర్వదిస్తాడు’ అంటే ఆధునిక పాఠకుడు విరుద్ధార్థం గ్రహించే ప్రమాదం ఉంది. అయినా హీబ్రూ రూపంలోని నిజమైన అక్షరార్థాన్ని పాదటిప్పణి ద్వారా పారదర్శకంగా నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైనప్పటికీ సులభంగా అర్థమయ్యే శైలి వాడబడింది. దేవునితో ప్రత్యక్ష సంభాషణ కావడంతో ఏకవచన సంబోధనను నిలిపాం. హీబ్రూ శరీర రూపకమైన ‘ఎముకను, మాంసాన్ని’ అలాగే ఉంచి, ప్రమాణసదృశమైన నిశ్చయాన్ని ‘తప్పకుండా’తో వ్యక్తం చేశాం.
