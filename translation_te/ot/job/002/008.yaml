  text: וַ/יִּֽקַּֽח ל֣/וֹ חֶ֔רֶשׂ לְ/הִתְגָּרֵ֖ד בּ֑/וֹ וְ/ה֖וּא יֹשֵׁ֥ב בְּ/תוֹךְ הָ/אֵֽפֶר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/002/008.yaml
  text: And he took a potsherd to scrape himself with while he was sitting among the ashes[a][b].
translation:
  language: te
  text: యోబు బూడిద మధ్యలో కూర్చుని ఉండగా, తనను తాను గీకుకోవడానికి[b] ఒక కుండపెంకును[a] తీసుకున్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మట్టిపాత్ర పెంకు.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘తనను తాను గోక్కోవడానికి.’ హీబ్రూ క్రియ గోకడం అనే భావాన్నీ సూచించవచ్చు; అయితే కుండపెంకు వాడుకకు ‘గీకుకోవడానికి’ మరింత తగినది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח לוֹ
  choice: తీసుకొని
  rationale: కథనాన్ని ముందుకు నడిపే క్రియాక్రమాన్ని సహజమైన తెలుగులో ‘తీసుకొని’ అని వ్యక్తం చేశాం; לוֹలోని స్వప్రయోజన భావాన్ని సందర్భమే స్పష్టం చేస్తుంది.
- source_word: חֶרֶשׂ
  choice: ఒక కుండపెంకు
  rationale: ఇది మట్టిపాత్ర పగిలిన ముక్కను సూచిస్తుంది. ‘కుండపెంకు’ ఆధునిక తెలుగులో సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: לְהִתְגָּרֵד
  choice: తనను తాను గోక్కోవడానికి
  rationale: హిత్పయేల్ రూపంలోని స్వకర్మక భావాన్ని స్పష్టంగా నిలిపాం. ఈ క్రియకు గోక్కోవడం లేదా గీకుకోవడం అనే భావాలు ఉండగలవు.
- source_word: בּוֹ
  choice: '[కుండపెంకుతో]'
  rationale: హీబ్రూ సర్వనామం కుండపెంకును సాధనంగా సూచిస్తుంది; తెలుగులో ‘కుండపెంకు తీసుకొని ... గోక్కోవడానికి’ అనే నిర్మాణంలో సాధన భావం సహజంగా అంతర్భవిస్తుంది.
- source_word: וְהוּא יֹשֵׁב
  choice: కూర్చున్నాడు
  rationale: సమకాలిక స్థితిని తెలుగు సంయుక్త వాక్య నిర్మాణంలో సహజంగా తెలిపాం; చర్య జరుగుతున్నప్పుడు యోబు బూడిదలో కూర్చున్నాడనే భావం నిలుస్తుంది.
- source_word: בְּתוֹךְ הָאֵפֶר
  choice: బూడిదలో
  rationale: అక్షరార్థంగా ‘బూడిద మధ్యలో’; ‘బూడిదలో’ సాధారణ పాఠకునికి సహజంగా ఉండి మూలంలోని స్థలచిత్రాన్ని కాపాడుతుంది.
