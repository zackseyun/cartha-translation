  yaml_path: translation/ot/job/002/009.yaml
  text: Then his wife said to him[a], “Are you still holding fast to your integrity? Bless God and die.”
translation:
  language: te
  text: అప్పుడు అతని భార్య అతనితో, “నువ్వు ఇంకా నీ యథార్థతను గట్టిగా పట్టుకొని ఉన్నావా? దేవుణ్ణి దీవించి చనిపో[a]” అంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “దేవుణ్ణి దీవించి చనిపో.” ఇక్కడ “దీవించు” అనేది గౌరవభావంతో వాడిన వ్యతిరేకోక్తి అని, దాని భావం “దూషించు” లేదా “శపించు” అని చాలామంది అర్థం చేసుకుంటారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: అప్పుడు ... అంది
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని ముందుకు తీసుకెళ్తుంది; ఆధునిక తెలుగు కథన ప్రవాహంలో ‘అప్పుడు’ సహజంగా క్రమాన్ని తెలియజేస్తుంది.
- source_word: אִשְׁתּוֹ
  choice: అతని భార్య
  rationale: మూడవ పురుష ఏకవచన స్వామ్యార్థక నామరూపాన్ని నేరుగా, సహజంగా అనువదిస్తుంది.
- source_word: עֹדְךָ
  choice: నువ్వు ఇంకా
  rationale: రెండవ పురుష ఏకవచనాన్ని ఉద్దేశించిన కొనసాగింపు భావాన్ని ‘ఇంకా’ స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: מַחֲזִיק
  choice: గట్టిగా పట్టుకొని ఉన్నావా
  rationale: חזק కృదంతం దేనినైనా దృఢంగా అంటిపెట్టుకొని కొనసాగడాన్ని సూచిస్తుంది; ప్రశ్నలోని మందలింపు ధోరణిని కూడా ఈ రూపం నిలుపుతుంది.
- source_word: בְּתֻמָּתֶךָ
  choice: నీ యథార్థతను
  rationale: תֻּמָּהకు యథార్థత, నిష్కళంకత, సమగ్రత అనే భావాలు ఉన్నాయి. ‘యథార్థత’ యోబు నైతిక స్థిరత్వాన్ని సహజంగా తెలుపుతూ పాపరాహిత్యాన్ని అతిశయంగా సూచించదు.
- source_word: בָּרֵךְ
  choice: దీవించి
  rationale: హీబ్రూ క్రియకు ప్రత్యక్ష అర్థం ‘దీవించు.’ మూలపాఠ రూపాన్ని ప్రధాన వాక్యంలో నిలిపి, ఈ సందర్భంలో భావించబడే వ్యతిరేకార్థాన్ని పాదసూచికలో తెలియజేస్తుంది.
- source_word: אֱלֹהִים
  choice: దేవుణ్ణి
  rationale: ఇది యహ్వే అనే నిబంధన నామం కాక, సాధారణ దైవ బిరుదు; కర్మవిభక్తితో ‘దేవుణ్ణి’ సరైన రూపం.
- source_word: וָמֻת
  choice: చనిపో
  rationale: మొదటి ఆజ్ఞ తరువాత వచ్చే రెండవ ఆజ్ఞ యొక్క కఠినమైన సంక్షిప్తతను సహజ తెలుగులో నిలుపుతుంది; ముందున్న ‘దీవించి’ రూపం హీబ్రూ సమన్వయాన్ని వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: దేవుని విషయంలో ‘దీవించు’ అనే పదం వ్యంగ్యోక్తి లేదా గౌరవార్థక వ్యతిరేకోక్తిగా వాడబడటం
  choice: ప్రధాన పాఠంలో ‘దేవుణ్ణి దీవించి చనిపో’ అని మూల హీబ్రూ పదాన్ని నిలుపడం
  alternative: ‘దేవుణ్ణి దూషించి చనిపో’
  rationale: హీబ్రూ పాఠంలో ברך (‘దీవించు’) ఉన్నప్పటికీ, ఈ సందర్భంలో చాలామంది దానిని దేవుణ్ణి ‘దూషించు/శపించు’ అనే భావాన్ని గౌరవార్థకంగా తప్పించి చెప్పిన వ్యతిరేకోక్తిగా అర్థం చేసుకుంటారు. మూలభాషకు ప్రాధాన్యం ఇస్తూ అసలైన ఉద్వేగాన్ని పరిష్కరించకుండా ప్రధాన పాఠంలో ప్రత్యక్ష రూపాన్ని ఉంచి, సంభావ్య సందర్భార్థాన్ని పాదసూచికలో నమోదు చేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన సంభాషణ శైలిని వాడాం. ‘యథార్థత’ సాధారణ పాఠకులకు అర్థమయ్యేలా ఉండి תֻּמָּה యొక్క నైతిక సమగ్రత భావాన్ని కాపాడుతుంది. ‘దీవించు’ అనే మూలపదం వల్ల కలిగే ఉద్దేశపూర్వక ఉద్వేగాన్ని పాదసూచికతో సంరక్షించాం.
