  text: וַ/יֹּ֣אמֶר אֵלֶ֗י/הָ כְּ/דַבֵּ֞ר אַחַ֤ת הַ/נְּבָלוֹת֙ תְּדַבֵּ֔רִי גַּ֣ם אֶת הַ/טּ֗וֹב נְקַבֵּל֙ מֵ/אֵ֣ת הָ/אֱלֹהִ֔ים וְ/אֶת הָ/רָ֖ע לֹ֣א נְקַבֵּ֑ל בְּ/כָל זֹ֛את לֹא חָטָ֥א אִיּ֖וֹב בִּ/שְׂפָתָֽי/ו־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/job/002/010.yaml
  text: But he said to her[a], “You speak as one of the foolish women speaks. Shall we receive the good from God, and shall we not receive the bad?” In all this Job did not sin with his lips.
translation:
  language: te
  text: అయితే అతడు ఆమెతో, “నీవు మూర్ఖ స్త్రీలలో ఒకరిలా మాట్లాడుతున్నావు. దేవుని నుండి మేలును స్వీకరించి, కీడును[a] స్వీకరించకూడదా?” అన్నాడు. ఇవన్నిటిలో యోబు తన పెదవులతో పాపం చేయలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “విపత్తును”; సాంప్రదాయంగా “చెడును.” ఇక్కడి హెబ్రీ పదం רָע, “మేలు”కు విరుద్ధంగా, హానికరమైన లేదా ప్రతికూల పరిస్థితులను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּדַבֵּר אַחַת הַנְּבָלוֹת תְּדַבֵּרִי
  choice: నీవు మూర్ఖ స్త్రీలలో ఒకరిలా మాట్లాడుతున్నావు
  rationale: נְבָלוֹת నైతిక, ఆధ్యాత్మిక అవివేకాన్ని సూచిస్తుంది; కేవలం తక్కువ తెలివిని కాదు. ‘మూర్ఖ’ అనే పదం ఆ నైతిక భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: גַּם אֶת הַטּוֹב נְקַבֵּל מֵאֵת הָאֱלֹהִים
  choice: దేవుని నుండి మేలును స్వీకరిస్తాం
  rationale: తదుపరి ప్రతికూల ప్రశ్నతో కలిసి ఇది అలంకారిక ప్రశ్నలోని మొదటి భాగం. ‘మేలు’ అనేది అనుకూలమైన వాటి విస్తృత వర్గాన్ని నిలుపుతుంది.
- source_word: וְאֶת הָרָע לֹא נְקַבֵּל
  choice: కీడును మాత్రం స్వీకరించమా?
  rationale: רָע సందర్భానుసారం నైతిక చెడును లేదా అనుభవించే విపత్తు, ప్రతికూలతను సూచించగలదు. ‘కీడు’ మేలు–కీడు వ్యతిరేక సమాంతరాన్ని నిలుపుతూ మూలంలోని కొంత భావవిస్తృతిని కాపాడుతుంది; సందర్భార్థాన్ని పాదసూచిక స్పష్టం చేస్తుంది.
- source_word: בְּכָל זֹאת
  choice: ఇదంతటిలో
  rationale: కథకుని మూల్యాంకన సారాంశాన్ని పరిచయం చేసే సంక్షిప్తమైన, సహజమైన తెలుగు ప్రయోగం.
- source_word: לֹא חָטָא אִיּוֹב בִּשְׂפָתָיו
  choice: యోబు తన పెదవులతో పాపం చేయలేదు
  rationale: ‘పెదవులతో’ అనే శరీరాంగ ప్రయోగాన్ని నిలుపడం ద్వారా తీర్పు ప్రత్యేకంగా యోబు మాటలకు సంబంధించినదనే కథన సూక్ష్మతను కాపాడుతుంది.
theological_decisions:
- issue: దేవుని నుండి స్వీకరించే הָרָע యొక్క అర్థం
  choice: ‘కీడు’ అని అనువదించి, పాదసూచికలో ప్రతికూల పరిస్థితులు లేదా విపత్తు అనే సందర్భార్థాన్ని తెలియజేయడం
  alternative: ‘చెడు’ లేదా ‘విపత్తు’
  rationale: ఈ వాక్యం అనుకూలమైనదాన్ని, ప్రతికూలమైనదాన్ని దేవుని నుండి స్వీకరించడం గురించి మాట్లాడుతుంది. ‘విపత్తు’ సందర్భార్థాన్ని స్పష్టపరుస్తుంది గాని మూలపదంలోని విస్తృతిని కుదిస్తుంది; ‘చెడు’ నైతిక చెడును దేవునికి ఆపాదించినట్లు అపార్థం కలిగించవచ్చు. ‘కీడు’తో పాటు పాదసూచిక మూలంలోని ఉద్రిక్తతను అతిగా పరిష్కరించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. అలంకారిక ప్రశ్న స్పష్టంగా ఉండేలా ‘మాత్రం’ వాడబడింది; అయితే మూలంలోని మేలు–కీడు సమాంతరతను, యోబు మాటలపైనే కథకుని తీర్పు కేంద్రీకృతమై ఉండడాన్ని నిలుపుకుంది.
