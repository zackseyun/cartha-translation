  text: Is there no end to windy words? Or what provokes you[a], that you answer this way?
translation:
  language: te
  text: గాలిమాటలకు అంతమే లేదా? నువ్వు ఇలా జవాబివ్వడానికి నిన్ను రెచ్చగొట్టేది[a] ఏమిటి?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నువ్వు జవాబివ్వడానికి నీకు ధైర్యమిచ్చేది ఏమిటి?”
    reason: יַמְרִיצְךָ అనే క్రియకు ‘రెచ్చగొట్టడం/పురికొల్పడం’తో పాటు ‘ధైర్యమివ్వడం’ అనే భావం కూడా సాధ్యమైనందున ఈ ప్రత్యామ్నాయాన్ని ఇచ్చాం.
lexical_decisions:
- source_word: הֲקֵץ
  choice: అంతమే లేదా?
  rationale: קֵץ అంటే ‘అంతం, హద్దు.’ ప్రశ్నార్థక הֲతో కూడిన ఈ ప్రశ్న యోబు విసుగును వ్యక్తం చేసే అలంకారిక ప్రశ్న; అందుకే సహజమైన తెలుగులో ‘అంతమే లేదా?’ అని అనువదించాం.
- source_word: לְדִבְרֵי רוּחַ
  choice: గాలిమాటలకు
  rationale: అక్షరార్థంగా ‘గాలి మాటలు.’ సందర్భంలో సారంలేని, నిరర్థకమైన మాటలను సూచిస్తుంది. ‘గాలిమాటలు’ మూలంలోని రూపకాన్ని నిలుపుతూ ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: יַמְרִיצְךָ
  choice: నిన్ను రెచ్చగొట్టేది
  rationale: ఈ అరుదైన క్రియకు పురికొల్పడం, ప్రేరేపించడం లేదా ధైర్యమివ్వడం అనే భావాలు సాధ్యపడతాయి. వాదనాత్మక సందర్భంలో ‘రెచ్చగొట్టేది’ ప్రధాన పాఠంలో తగినది; ‘ధైర్యమిచ్చేది’ అనే సాధ్యమైన భావాన్ని పాదసూచికలో ఉంచాం.
- source_word: כִּי תַעֲנֶה
  choice: నువ్వు ఇలా జవాబివ్వడానికి
  rationale: ענה అంటే ‘జవాబివ్వడం, ప్రతిస్పందించడం.’ כִּי ఇక్కడ జవాబివ్వడానికి కారణమైన ప్రేరణను కలుపుతుంది. సందర్భంలోని మందలింపు స్వరాన్ని సహజంగా తెలియజేయడానికి ‘ఇలా’ అనే స్వల్ప సందర్భ విస్తరణ వాడాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; యోబు విసుగుతో వేసే రెండు అలంకారిక ప్రశ్నల కఠిన స్వరాన్ని నిలిపి, సాధారణ పాఠకులకు సహజంగా అర్థమయ్యే పదజాలాన్ని వాడాం.
