translation:
  language: te
  text: ఆయన నన్ను ఒక చీలికపై మరొక చీలిక చేస్తూ పగులగొడుతున్నాడు[a]; యోధునిలా నా మీదికి దూసుకొస్తున్నాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “చీలికపై చీలికతో ఆయన నన్ను పగులగొడుతున్నాడు.”
    reason: lexical_alternative
  - marker: b
    text: “యోధుడు” అనే మాటను “పరాక్రమశాలి” లేదా “బలవంతుడు” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִפְרְצֵנִי
  choice: నన్ను ... చీల్చివేస్తున్నాడు
  rationale: פרץ అనే క్రియలో బలవంతంగా పగులగొట్టడం లేదా చీల్చడం అనే భావం ఉంది. తెలుగు వాక్యంలో సహజంగా ఉండడంతో పాటు యోబుపై జరుగుతున్న హింసాత్మక దాడి చిత్రాన్ని నిలుపుతుంది.
- source_word: פֶרֶץ עַל־פְּנֵי פָרֶץ
  choice: చీలిక మీద చీలికగా
  rationale: ఒకదాని వెంట మరొకటి సంభవించే చీలికలను సూచించే హెబ్రీ పునరుక్తిని, దాని కవితాత్మక తీవ్రతను సాధ్యమైనంతవరకు నిలుపుతుంది.
- source_word: יָרוּץ עָלַי
  choice: నా మీదికి దూసుకొస్తున్నాడు
  rationale: רוץ ప్రాథమికంగా పరుగెత్తడాన్ని సూచించినా, ఇక్కడ శత్రుత్వంతో వేగంగా సమీపించే భావం ఉంది. ‘దూసుకొస్తున్నాడు’ ఆ వేగాన్నీ దాడి స్వభావాన్నీ సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: כְגִבּוֹר
  choice: యోధునిలా
  rationale: גבור బలవంతుడు, పరాక్రమశాలి లేదా యోధుడు అని అర్థమవుతుంది. దాడి సందర్భంలో ‘యోధుడు’ సైనిక చిత్రాన్ని స్పష్టంగా అందిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కవితా ధోరణి పాటించబడింది. హెబ్రీ పునరుక్తి మరియు దాడి దృశ్యం నిలుపబడగా, వాక్యం సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా రూపొందించబడింది.
