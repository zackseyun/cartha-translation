    reason: lexical_alternative
  revision_rationale: The revision preserves the Hebrew repetition and its image of successive violent breaches while using natural Telugu syntax. “పగులగొడుతున్నాడు” conveys the forceful sense of פרץ without treating the repeated noun as an unnatural adverbial. The second clause and its lexical note are retained.
