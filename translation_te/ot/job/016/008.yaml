id: JOB.16.8
reference: Job 16:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַֽ֭/תִּקְמְטֵ/נִי לְ/עֵ֣ד הָיָ֑ה וַ/יָּ֥קָם בִּ֥/י כַ֝חֲשִׁ֗/י בְּ/פָנַ֥/י יַעֲנֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/016/008.yaml
  text: You have shriveled me up—it has become a witness; my gauntness rises up against me and answers to my face.
translation:
  language: te
  text: నీవు నన్ను కృశింపజేశావు—అది సాక్ష్యంగా నిలిచింది; నా కృశత్వం[a] నాకు విరోధంగా లేచి, నా ఎదుటే జవాబిస్తోంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నా అబద్ధం” లేదా “నా మోసం.” ఇక్కడి హీబ్రూ పదానికి ‘కృశత్వం, క్షీణత’ అనే అర్థంతో పాటు ‘అబద్ధం/మోసం’ అనే అర్థసాధ్యత కూడా ఉంది.
    reason: כַּחֲשִׁי పదానికి ఉన్న నిఘంటు సంబంధిత సందిగ్ధతను తెలియజేస్తూ, సందర్భానుకూలమైన ప్రధాన అనువాదాన్ని పాఠ్యంలో ఉంచుతుంది.
lexical_decisions:
- source_word: וַתִּקְמְטֵנִי
  choice: నీవు నన్ను ముడుచుకుపోయేలా చేశావు
  rationale: קמט అనే క్రియ శరీరం ముడుచుకుపోవడం లేదా కుంచించుకుపోవడం అనే భావాన్ని ఇస్తుంది; యోబు శారీరక క్షీణతను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: כַחֲשִׁי
  choice: నా కృశత్వం
  rationale: ఈ సందర్భంలో యోబు క్షీణించిన శరీరమే అతనికి విరోధంగా సాక్ష్యమిస్తున్నందున ‘కృశత్వం’ సందర్భోచితం; అయితే పదానికి ‘నా అబద్ధం’ అనే అర్థసాధ్యత కూడా ఉన్నందున దానిని పాదటిప్పణిలో నిలిపాం.
- source_word: יַעֲנֶה
  choice: నాకు జవాబిస్తోంది
  rationale: మూలంలోని ‘జవాబివ్వడం/ప్రతిస్పందించడం’ అనే సాధారణ భావాన్ని కాపాడుతుంది; సందర్భంలో సాక్ష్యమివ్వడం అనే న్యాయస్థాన ఛాయ కూడా వినిపిస్తుంది.
theological_decisions:
- issue: యోబు శరీర క్షీణత సాక్షిగా వ్యక్తీకరించబడటం
  choice: ‘అది సాక్ష్యంగా నిలిచింది; నా కృశత్వం ... నాకు జవాబిస్తోంది’ అని వ్యక్తీకరణను అలాగే ఉంచాం.
  alternative: శరీర క్షీణత యోబు దోషాన్ని నిరూపిస్తోందని స్పష్టీకరించడం.
  rationale: మూలం క్షీణతను సాక్షిగా చిత్రిస్తుంది గాని ఆ సాక్ష్యం నిజమని లేదా యోబు దోషాన్ని నిర్ధారిస్తుందని తేల్చదు; అందువల్ల ఆ వేదాంతపరమైన ఉద్రిక్తతను పరిష్కరించకుండా ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకుడికి అర్థమయ్యే శైలి. ‘నా ముఖం మీదనే’ అనే ప్రయోగం హీబ్రూ ప్రత్యక్షతను, ఎదురెదురుగా నిలిచి జవాబిచ్చే భావాన్ని సహజంగా అందిస్తుంది.
