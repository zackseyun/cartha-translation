- from: నీవు నన్ను ముడుచుకుపోయేలా చేశావు—అది సాక్ష్యంగా నిలిచింది; నా కృశత్వం[a] నాకు విరోధంగా లేచి, నా ముఖం మీదనే నాకు జవాబిస్తోంది.
