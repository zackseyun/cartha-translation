translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. మొదటి క్రియలోని ఊహాత్మక భావాన్ని ‘బలపరిచేవాణ్ణి’తో నిలిపి, రెండో భాగంలోని అస్పష్టమైన נִידను ప్రధాన పాఠ్యంలో concrete రూపంతో ఉంచి ప్రత్యామ్నాయ భావాన్ని పాదసూచికలో ఇచ్చాం.
