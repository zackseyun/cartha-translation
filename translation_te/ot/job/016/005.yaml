  text: אֲאַמִּצְ/כֶ֥ם בְּמוֹ פִ֑/י וְ/נִ֖יד שְׂפָתַ֣/י יַחְשֹֽׂךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/016/005.yaml
  text: I could strengthen you with my mouth[b][a], and the moving of my lips could hold back grief.
translation:
  language: te
  text: నా నోటితో మిమ్మల్ని బలపరిచేవాణ్ణి; నా పెదవుల కదలిక[a] మీ దుఃఖాన్ని తగ్గించేది.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నా పెదవుల ఓదార్పు.” హెబ్రీయ పదం సానుభూతిని లేదా ఓదార్పును వ్యక్తం చేసే కదలికను/మాటను ప్రత్యేకంగా సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “నా పెదవుల కదలిక అడ్డుకొనేది.” హెబ్రీయ మూలంలో దేనిని అడ్డుకొనేదో స్పష్టంగా చెప్పలేదు; సందర్భాన్ని బట్టి “మీ దుఃఖాన్ని” అని చేర్చబడింది.
    reason: implicit_object
lexical_decisions:
- source_word: אֲאַמִּצְכֶם
  choice: మిమ్మల్ని బలపరిచేవాణ్ణి
  rationale: אמץ యొక్క పియేల్ రూపం ‘బలపరచడం’ అనే అర్థాన్నిస్తుంది; 4వ వచనంలో ప్రారంభమైన ఊహాత్మక పాత్రమార్పును తెలుగులో సహజంగా కొనసాగించడానికి ‘బలపరిచేవాణ్ణి’ అని అనువదించాం.
- source_word: בְּמוֹ פִי
  choice: నా నోటితో
  rationale: మాటలను సాధనంగా చూపే హెబ్రీయ concrete imageను సహజమైన తెలుగులో అలాగే నిలుపుతుంది.
- source_word: נִיד
  choice: కదలిక
  rationale: ఈ పదం కదలికను, ముఖ్యంగా సానుభూతి లేదా విలాపాన్ని సూచించే తలూపు/సంజ్ఞను సూచించవచ్చు. ‘పెదవులు’తో కలిసినప్పుడు పెదవుల కదలిక లేదా వాటి ద్వారా పలికే ఓదార్పు అనే భావసంభావ్యతను తెరిచి ఉంచుతుంది.
- source_word: שְׂפָתַי
  choice: నా పెదవుల
  rationale: ‘పెదవులు’ అనే ప్రత్యక్ష రూపకం ‘నోరు’తో ఉన్న హెబ్రీయ సమాంతర నిర్మాణాన్ని కాపాడుతుంది.
- source_word: יַחְשֹׂךְ
  choice: తగ్గించేది
  rationale: חשׂךకు ‘నిలిపివేయడం, అడ్డుకోవడం, తగ్గించడం’ అనే భావాలు ఉన్నాయి. దుఃఖాన్ని పూర్తిగా తొలగిస్తుందని కాక, దాని తీవ్రతను తగ్గిస్తుందని సందర్భానుగుణంగా సహజమైన తెలుగులో తెలియజేస్తుంది.
