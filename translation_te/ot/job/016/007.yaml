- from: అయితే ఇప్పుడు ఆయన నన్ను పూర్తిగా అలసిపోయేలా చేశాడు[a]; నీవు నా పరివారమంతటినీ నాశనం చేశావు[b].
  to: నిశ్చయంగా, ఇప్పుడు ఆయన నన్ను అలసటకు గురిచేశాడు[a]; నీవు నా సమూహమంతటినీ[b] నాశనం చేశావు.
  rationale: The revision renders אַךְ with Telugu emphasis rather than an adversative connective, removes an unsupported intensifier, and uses a broader primary equivalent for עֲדָתִי. It retains the Hebrew’s abrupt ‘he ...; you ...’ person shift and leaves the antecedent implicit, as does the source.
