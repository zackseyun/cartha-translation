id: JOB.16.7
reference: Job 16:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אַךְ עַתָּ֥ה הֶלְאָ֑/נִי הֲ֝שִׁמּ֗וֹתָ כָּל עֲדָתִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/016/007.yaml
  text: Surely now he has worn me out[b][a]; you have devastated all my company.
translation:
  language: te
  text: నిశ్చయంగా, ఇప్పుడు ఆయన నన్ను అలసటకు గురిచేశాడు[a]; నీవు నా సమూహమంతటినీ[b] నాశనం చేశావు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆయన నన్ను శక్తిహీనుణ్ణి చేశాడు’; ‘ఆయన నన్ను అలసిపోయేలా చేశాడు.’
    reason: lexical_alternative
  - marker: b
    text: ‘నా సమూహం’ అనే మాటకు ‘నా సభ,’ ‘నా సంఘం,’ లేదా సందర్భానుసారంగా ‘నా ఇంటివారు’ అని కూడా అర్థం కావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: అయితే
  rationale: ఇక్కడ ఈ పదం యోబు ప్రస్తుత దుఃఖస్థితివైపు బలమైన మలుపును సూచిస్తుంది. ఆధునిక తెలుగులో ‘అయితే’ ఆ ప్రసంగ మలుపును సహజంగా తెలియజేస్తుంది.
- source_word: עַתָּה
  choice: ఇప్పుడు
  rationale: యోబు ప్రస్తుత పరిస్థితి యొక్క తక్షణత్వాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: הֶלְאָנִי
  choice: ఆయన నన్ను పూర్తిగా అలసిపోయేలా చేశాడు
  rationale: לאה ధాతువు ‘అలసిపోవడం/అలసిపోయేలా చేయడం’ అనే భావాన్ని ఇస్తుంది. తృతీయ పురుష ఏకవచన కర్తను ‘ఆయన’గా ఉంచి, దేవుడు అని పాఠ్యంలోనే స్పష్టీకరించలేదు.
- source_word: הֲשִׁמּוֹתָ
  choice: నీవు ... నాశనం చేశావు
  rationale: שמם యొక్క కారణార్థక రూపం ‘నిర్జనంగా చేయడం, పాడుచేయడం, నాశనం చేయడం’ అనే బలమైన భావం కలిగి ఉంది. ద్వితీయ పురుష ఏకవచనాన్ని యథాతథంగా నిలిపాం.
- source_word: כָּל
  choice: అంతటినీ
  rationale: తదుపరి నామవాచక సమూహం మొత్తాన్ని సూచించే సంపూర్ణతా భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: עֲדָתִי
  choice: నా పరివారం
  rationale: עֵדָה సాధారణంగా సమూహం లేదా సభను సూచించినా, ఈ సందర్భంలో యోబును చుట్టుముట్టిన కుటుంబ-సన్నిహితుల వర్గాన్ని సూచించే అవకాశం ఉంది. ‘పరివారం’ ఈ సందర్భానికి సహజంగా సరిపోతుంది; ఇతర సాధ్యార్థాలు పాదసూచికలో ఉంచబడ్డాయి.
theological_decisions:
- issue: రెండు క్రియల మధ్య వ్యాకరణ పురుష మార్పు
  choice: ‘ఆయన ... చేశాడు; నీవు ... చేశావు’ అనే తృతీయ పురుషం నుంచి ద్వితీయ పురుషానికి మార్పును నిలుపడం
  alternative: రెండు క్రియలనూ ‘నీవు’గా లేదా రెండింటినీ ‘ఆయన’గా ఏకరీకరించడం
  rationale: మసొరెటిక్ పాఠ్యంలో మొదటి క్రియ తృతీయ పురుష ఏకవచనంలో, రెండవది ద్వితీయ పురుష ఏకవచనంలో ఉన్నాయి. యోబు దేవుని గురించి మాట్లాడటం నుంచి నేరుగా దేవునితో మాట్లాడటానికి మారుతున్నాడా అనే ఉద్దేశపూర్వక ఉద్వేగాన్ని పరిష్కరించకుండా నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన విలాప స్వరం పాటించబడింది. మూలంలోని అకస్మాత్తు పురుష మార్పును సరిచేయకుండా అలాగే నిలిపాం; ‘నాశనం’ అనే బలమైన పదం שמם యొక్క పాడుచేయడం/నిర్జనంగా చేయడం అనే తీవ్రతను అందిస్తుంది.
