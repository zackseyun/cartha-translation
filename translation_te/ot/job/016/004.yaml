base_translation:
  language: en
  yaml_path: translation/ot/job/016/004.yaml
  text: I too could speak like you[a], if your soul were in place of my soul[c][b]; I could heap up words against you and shake my head at you.
translation:
  language: te
  text: మీ ప్రాణం నా ప్రాణం స్థానంలో ఉంటే, నేనూ మీలాగే మాట్లాడేవాడిని; మీకు విరోధంగా మాటలు పేర్చేవాడిని, మీ వైపు తల ఊపేవాడిని[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీ జీవితం నా జీవితం స్థానంలో ఉంటే,” లేక భావానువాదంగా, “మీరు నా స్థానంలో ఉంటే.” హీబ్రూ נֶפֶשׁ అనే పదం సందర్భానుసారంగా ప్రాణం, జీవితం, స్వయం లేదా వ్యక్తి అని సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: “మాటలు పేర్చడం” అనే హీబ్రూ క్రియకు మాటలను కలపడం, వరుసగా కూర్చడం లేదా పోగుచేయడం అనే భావాలు ఉండవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: ఈ సందర్భంలో “తల ఊపడం” ధిక్కారం లేదా ఎగతాళిని తెలిపే సంజ్ఞ.
    reason: cultural_note
