  text: God hands me over to the ungodly and throws me into the hands of the wicked[a][b].
translation:
  language: te
  text: 'దేవుడు నన్ను భక్తిహీనునికి[a] అప్పగిస్తున్నాడు;

    దుష్టుల చేతుల్లోకి నన్ను విసిరేస్తున్నాడు[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘దైవభక్తి లేనివాడికి’ లేదా ‘అన్యాయస్థునికి.’
    reason: lexical_alternative
  - marker: b
    text: చివరి క్రియ అర్థం క్లిష్టమైనది; అది బహుశా ‘నన్ను విసిరేస్తున్నాడు’ లేదా ‘నన్ను బలంగా త్రోసివేస్తున్నాడు’ అని అర్థమిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַסְגִּירֵנִי
  choice: నన్ను … అప్పగిస్తున్నాడు
  rationale: సגר అనే క్రియ యొక్క హిఫీల్ రూపం ఇక్కడ ఒకరిని మరొకరి అధికారానికి అప్పగించడాన్ని సూచిస్తుంది. ‘అప్పగిస్తున్నాడు’ ఈ భావాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: אֵל
  choice: దేవుడు
  rationale: ఈ సందర్భంలో אֵל దేవుణ్ణి సూచించే దైవనామంగా ఉంది; యోబు ఫిర్యాదులో చర్యకు కర్త దేవుడే.
- source_word: אֶל עֲוִיל
  choice: భక్తిహీనునికి
  rationale: עֲוִיל కేవలం బుద్ధిహీనుణ్ణి కాక, నైతికంగా వక్రమైన లేదా దైవభక్తి లేని వ్యక్తిని సూచిస్తుంది. ఏకవచనాన్ని నిలుపుతూ ‘భక్తిహీనునికి’ అని అనువదించబడింది.
- source_word: וְעַל יְדֵי רְשָׁעִים
  choice: దుష్టుల చేతుల్లోకి
  rationale: ‘చేతులు’ అనే మూలభాషా రూపకాన్ని నిలుపుతూ, దుష్టుల అధికారంలోకి అప్పగించబడే భావాన్ని సహజమైన తెలుగు నుడికారంతో వ్యక్తం చేస్తుంది.
- source_word: יִרְטֵנִי
  choice: నన్ను విసిరేస్తున్నాడు
  rationale: ఈ అరుదైన క్రియ అర్థం క్లిష్టమైనదైనా, సందర్భం మరియు సాంప్రదాయ అవగాహన హింసాత్మకంగా విసరడం లేదా త్రోసివేయడం అనే భావాన్ని సూచిస్తాయి. ‘విసిరేస్తున్నాడు’ ఆ బలాన్ని నిలుపుతుంది.
theological_decisions:
- issue: אֵל పదం ఎవరిని సూచిస్తుంది?
  choice: యోబును భక్తిహీనునికి అప్పగిస్తున్నవాడు దేవుడే.
  alternative: ‘బలవంతుడొకడు’ యోబును అప్పగిస్తున్నాడని చదవడం.
  rationale: యోబు గ్రంథంలోని సందర్భంలో אֵל సాధారణంగా దేవుణ్ణి సూచిస్తుంది. దేవుడే తనను శత్రువుల అధికారానికి అప్పగించాడని యోబు ఫిర్యాదు చేస్తున్న ఉద్వేగాన్ని ఈ పఠనం నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గంభీరమైన కవితాత్మక శైలి ఉపయోగించబడింది. సమాంతర వాక్య నిర్మాణం మరియు ‘చేతుల్లోకి’ అనే మూల రూపకం నిలుపబడ్డాయి; అరుదైన చివరి క్రియలోని అనిశ్చితి పాదసూచికలో స్పష్టంగా తెలియజేయబడింది.
