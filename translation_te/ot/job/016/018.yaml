  text: אֶ֭רֶץ אַל תְּכַסִּ֣י דָמִ֑/י וְֽ/אַל יְהִ֥י מָ֝ק֗וֹם לְ/זַעֲקָתִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/016/018.yaml
  text: O earth[a], do not cover my blood[c][b], and let there be no resting place for my cry.
translation:
  language: te
  text: ఓ భూమీ, నా రక్తాన్ని[a][b] కప్పివేయకు; నా మొరకు[c] విశ్రాంతి స్థలం ఉండనివ్వకు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘నా రక్తపాతాన్ని.’ హీబ్రూలో అక్షరార్థంగా ‘నా రక్తాన్ని’ అని ఉంది; సందర్భంలో అది అన్యాయంగా చిందించబడిన రక్తాన్ని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: నేలనుంచి న్యాయం కోసం మొరపెట్టే రక్తం అనే చిత్రణను ఇది జ్ఞాపకం చేస్తుంది; ఆదికాండము 4:10 చూడండి.
    reason: cross_reference
  - marker: c
    text: లేదా ‘నా ఆర్తనాదానికి.’ ఈ పదం బాధతో కూడిన కేకను, న్యాయం కోసం చేసే విజ్ఞప్తిని కూడా సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶרֶץ
  choice: ఓ భూమీ
  rationale: స్త్రీలింగ ఏకవచన క్రియారూపం ప్రత్యక్ష సంబోధనను సూచిస్తుంది. ‘భూమి’ విశాలమైన కవితాత్మక విజ్ఞప్తిని నిలుపుతుంది; ‘ఓ’ సంబోధన బలాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: תְּכַסִּי
  choice: కప్పివేయకు
  rationale: כסה అనే క్రియ యొక్క మౌలికమైన ‘కప్పు’ భావాన్ని నిలుపుతూ, రక్తం కనబడకుండా లేదా న్యాయం కోరలేకుండా చేయబడే చిత్రణను వివరణాత్మకంగా విప్పకుండా ఉంచుతుంది.
- source_word: דָמִי
  choice: నా రక్తాన్ని
  rationale: మూలపాఠంలో అక్షరార్థంగా ‘నా రక్తం’ ఉంది. సందర్భంలో అది అన్యాయంగా చిందించబడిన రక్తాన్ని సూచించగలిగినా, ప్రధాన పాఠంలో స్పష్టమైన రూపకాన్ని, దాని ఉద్దేశపూర్వక సందిగ్ధతను నిలిపాము.
- source_word: מָקוֹם
  choice: విశ్రాంతి స్థలం
  rationale: పదానికి సాధారణ అర్థం ‘స్థలం.’ ఇక్కడ యోబు మొర ఎక్కడా ఆగిపోకూడదనే కవితాత్మక భావాన్ని సహజంగా తెలియజేయడానికి ‘విశ్రాంతి స్థలం’ అని అనువదించాము.
- source_word: לְזַעֲקָתִי
  choice: నా మొరకు
  rationale: זעקה బాధలోనుంచి వచ్చే కేకను, సహాయం లేదా న్యాయం కోసం చేసే విజ్ఞప్తిని సూచించగలదు. ‘మొర’ ఈ రెండు ఛాయలనూ సంక్షిప్తంగా, సహజంగా మోస్తుంది.
theological_decisions:
- issue: న్యాయం కోసం నేలనుంచి మొరపెట్టే నిర్దోషి రక్తం అనే సూచన
  choice: ప్రధాన పాఠంలో ‘నా రక్తం,’ ‘నా మొర’ అనే స్పష్టమైన చిత్రణను నిలుపడం
  alternative: ‘నా రక్తపాతం’ లేదా ‘న్యాయం కోసం నా మొర’ అని భావాన్ని స్పష్టీకరించడం
  rationale: ఈ వాక్యం ఆదికాండము 4:10లోని, నేలనుంచి మొరపెట్టే రక్తం అనే అంశాన్ని జ్ఞాపకం చేయవచ్చు. అయితే హీబ్రూ పాఠం రక్తం, బాధామొర, న్యాయవిన్నపం మధ్యనున్న కవితాత్మక ఉద్రిక్తతను పూర్తిగా విప్పదు; అందువల్ల అనువాదంలో దానిని సిద్ధాంతపరంగా నిర్ణయించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, కవితాత్మక గాంభీర్యాన్ని కాపాడుతూ సాధారణ పాఠకులకు స్పష్టంగా ఉండే శైలి. ‘ఓ భూమీ’ ప్రత్యక్ష సంబోధనను, ‘కప్పివేయకు’ మూలంలోని భౌతిక చిత్రాన్ని, ‘విశ్రాంతి స్థలం’ మొర ఆగిపోవడం లేదా అణచివేయబడడం అనే సందర్భార్థాన్ని నిలుపుతున్నాయి.
