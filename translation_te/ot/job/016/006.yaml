translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కవితా శైలి. రెండు సమాంతర పాదాల్లో యోబు మాట్లాడినా మౌనంగా ఉన్నా తన బాధలో మార్పు లేదనే ఉద్వేగం నిలిపివేయబడింది.
