translation:
  language: te
  text: 'నేను మాట్లాడితే[a] నా బాధ తగ్గదు;

    నేను మాట మానితే, నా నుండి ఏమి తొలగిపోతుంది?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నా నుండి ఏమి వెళ్లిపోతుంది?” హీబ్రూ వాక్యం సంక్షిప్తంగా ఉంది; తొలగిపోయేది యోబు బాధే అని అంతర్లీనంగా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם אֲדַבְּרָה
  choice: నేను మాట్లాడినా
  rationale: ఈ సందర్భంలో אִם షరతును సూచించినా, రెండు మార్గాలూ ఫలించవనే భావాన్ని సహజమైన తెలుగులో ‘మాట్లాడినా’ వ్యక్తం చేస్తుంది.
- source_word: לֹא יֵחָשֵׂךְ כְּאֵבִי
  choice: నా బాధ తగ్గదు
  rationale: חשׂך నిఫాల్ రూపం ‘నిలిపివేయబడడం/అణచబడడం’ అనే చిత్రాన్ని ఇస్తుంది; బాధ సందర్భంలో ‘తగ్గదు’ అనేది భావాన్ని సహజంగా తెలియజేస్తుంది. כְּאֵבִי ని శారీరక లేదా మానసిక వేదన రెండింటికీ సరిపోయే ‘నా బాధ’గా ఇచ్చాం.
- source_word: וְאַחְדְּלָה
  choice: నేను మౌనంగా ఉన్నా
  rationale: חדל అంటే ఆగడం లేదా మానుకోవడం. ముందున్న ‘మాట్లాడడం’కు సమాంతరంగా ఇక్కడ మాట మానుకోవడమే ఉద్దేశం; తెలుగులో ‘మౌనంగా ఉన్నా’ సహజంగా ఉంటుంది.
- source_word: מַה מִנִּי יַהֲלֹךְ
  choice: నన్ను విడిచి వెళ్లేదేమిటి?
  rationale: మూలంలోని సంక్షిప్తతను నిలిపి, వెళ్లిపోయేది బాధే అని వాక్యంలో ప్రత్యక్షంగా చేర్చకుండా ప్రశ్నార్థక ఉద్వేగాన్ని కాపాడుతుంది.
