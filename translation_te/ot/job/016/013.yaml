source:
  edition: WLC
  text: יָ֘סֹ֤בּוּ עָלַ֨/י רַבָּ֗י/ו יְפַלַּ֣ח כִּ֭לְיוֹתַ/י וְ/לֹ֣א יַחְמ֑וֹל יִשְׁפֹּ֥ךְ לָ֝/אָ֗רֶץ מְרֵרָֽתִ/י׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/016/013.yaml
  text: His archers surround me[a]; he splits open my kidneys and does not spare[c][b]; he pours out my gall on the ground.
translation:
  language: te
  text: 'ఆయన విలుకాండ్రు నన్ను చుట్టుముడుతున్నారు[a];


    ఆయన కనికరించకుండా నా మూత్రపిండాలను చీల్చుతున్నాడు[b];


    నా పిత్తాన్ని నేలమీద కుమ్మరిస్తున్నాడు[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఆయన గొప్పవారు’ లేదా ‘ఆయన అధిపతులు.’ హీబ్రూ రూపం క్లిష్టంగా ఉంది; ఈ వాక్యంలోని, విస్తృత సందర్భంలోని దాడి చిత్రణకు ‘విలుకాండ్రు’ సరిపోతుంది.
    reason: alternative_reading
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా ‘నా మూత్రపిండాలు.’ అవి శరీరంలోని అంతర్గత అవయవాలను, హీబ్రూ నుడికారంలో విస్తృతార్థంగా వ్యక్తి అంతరంగ స్వరూపాన్ని సూచించగలవు.
    reason: cultural_note
  - marker: c
    text: లేదా ‘నా చేదును.’ కొందరు ఈ పదాన్ని ‘నా వేదన/చేదు’ అనే భావార్థంలో తీసుకుంటారు; అయితే ఈ వాక్యంలోని హింసాత్మక శరీర చిత్రణకు ‘పిత్తం’ అనే అర్థం సరిపోతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָסֹבּוּ
  choice: చుట్టుముట్టారు
  rationale: సבב అనే ధాతువు ఇక్కడ శత్రువులు దాడికి చుట్టుముట్టే భావాన్ని ఇస్తుంది; ఆధునిక తెలుగులో ‘చుట్టుముట్టారు’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: רַבָּיו
  choice: ఆయన విలుకాండ్రు
  rationale: హీబ్రూ రూపం క్లిష్టమైనదే అయినా, ఈ వాక్యంలోని దాడి దృశ్యానికీ సమీప సందర్భానికీ ‘విలుకాండ్రు’ అనే సాంప్రదాయిక భావం సరిపోతుంది; ‘ఆయన ప్రముఖులు/అధిపతులు’ అనే పఠనసాధ్యతను పాదసూచికలో ఉంచాం.
- source_word: יְפַלַּח
  choice: చీల్చుతున్నాడు
  rationale: פלח పియేల్ రూపం శరీరాన్ని హింసాత్మకంగా చీల్చే చర్యను సూచిస్తుంది; ‘చీల్చుతున్నాడు’ ఆ తీవ్రతను సహజ తెలుగులో నిలుపుతుంది.
- source_word: כִּלְיוֹתַי
  choice: నా మూత్రపిండాలను
  rationale: ఈ పదం అక్షరార్థంగా మూత్రపిండాలను సూచిస్తుంది. అంతరంగానికి హీబ్రూ రూపకంగా వాడబడగలిగినా, ఇక్కడి శరీర సంబంధ హింసాత్మక చిత్రణను కాపాడేందుకు నిర్దిష్ట అవయవాన్నే ఉంచాం.
- source_word: וְלֹא יַחְמוֹל
  choice: కనికరించకుండా
  rationale: חמל అంటే కనికరించడం లేదా విడిచిపెట్టడం. తెలుగులో క్రియతో సహజంగా అనుసంధానమయ్యే ‘కనికరించకుండా’ మూలంలోని కరుణలేమిని స్పష్టంగా తెలియజేస్తుంది.
- source_word: יִשְׁפֹּךְ
  choice: కుమ్మరిస్తున్నాడు
  rationale: שפך అంటే పోయడం లేదా కుమ్మరించడం; శరీర ద్రవం నేలపై హింసాత్మకంగా ఒలికించబడే దృశ్యానికి ‘కుమ్మరిస్తున్నాడు’ బలమైన, సహజమైన ఎంపిక.
- source_word: מְרֵרָתִי
  choice: నా పిత్తాన్ని
  rationale: ఈ నామవాచకం పిత్తం/చేదును సూచించగలదు. శరీర అవయవాలను చీల్చే తక్షణ సందర్భంలో ‘పిత్తం’ అనే అక్షరార్థ శారీరక భావం సముచితం.
theological_decisions:
- issue: బాధను వర్ణించే కవితాత్మక మానవ శరీర చిత్రణ
  choice: ‘మూత్రపిండాలు,’ ‘పిత్తం’ అనే నిర్దిష్ట శరీర పదాలను ప్రధాన పాఠ్యంలో నిలుపడం.
  alternative: ‘అంతరంగం,’ ‘చేదు/వేదన’ వంటి భావార్థ పదాలను ఉపయోగించడం.
  rationale: యోబు బాధను ఈ వాక్యం తీవ్రమైన శారీరక చిత్రాలతో చూపుతుంది. వాటిని భావార్థ పదాలతో మృదువుచేయకుండా ఉంచడం హీబ్రూ కవిత్వ బలాన్ని కాపాడుతుంది; అదే సమయంలో ‘మూత్రపిండాలు’ అంతరంగ స్వరూపానికి కూడా హీబ్రూ నుడికారంలో సూచన కావచ్చని పాదసూచిక తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కవితా శైలిని పాటించాం. శరీర హింసకు సంబంధించిన మూలపాఠ్య స్పష్టతను మృదువుచేయలేదు. ‘విలుకాండ్రు’ కొంత సాహిత్య గంభీరత కలిగినప్పటికీ సాధారణ పాఠకుడికి అర్థమయ్యే పదం; సంఖ్యలో బహువచనం నుంచి తరువాతి ఏకవచన క్రియకు మారే మూలపాఠ్య ఉద్రిక్తతను అలాగే నిలిపాం.
