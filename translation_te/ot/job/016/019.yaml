  yaml_path: translation/ot/job/016/019.yaml
  text: Even now[a], behold, my witness is in heaven[b], and he who testifies for me is in the heights.
translation:
  language: te
  text: ఇప్పుడుకూడా, ఇదిగో, పరలోకంలో నా సాక్షి ఉన్నాడు; ఉన్నత స్థలాల్లో నా పక్షంగా సాక్ష్యమిచ్చేవాడు[a] ఉన్నాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నా సాక్షి.’ ఇక్కడి రెండవ పదం ‘సాక్షి’కి సమీపార్థకం; ఇలా అనువదిస్తే రెండు అర్ధపాదాల సమాంతరత్వం మరింత స్పష్టంగా కనిపిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘ఉన్నత స్థలాల్లో’ అనే మాటను ‘ఉన్నతంలో’ లేదా ‘పైలోకంలో’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם עַתָּה
  choice: ఇప్పటికీ
  rationale: ఈ పదబంధం యోబు ప్రస్తుత దుస్థితిలో కూడా ఈ సంగతి నిజమేనని నొక్కి చెబుతుంది; ఆధునిక తెలుగులో ‘ఇప్పటికీ’ ఆ కాలసంబంధమైన ఉద్ఘాటనను సహజంగా తెలియజేస్తుంది.
- source_word: הִנֵּה
  choice: ఇదిగో
  rationale: తరువాత చెప్పే దృఢమైన ప్రకటనవైపు శ్రద్ధను మళ్లించే సూచక అవ్యయపు బలాన్ని కాపాడుతుంది.
- source_word: בַשָּׁמַיִם
  choice: పరలోకంలో
  rationale: ఈ సందర్భంలో భౌతికమైన ఆకాశం కంటే పరలోక పరిధి ఉద్దేశించబడింది; తెలుగులో ‘పరలోకం’ ఆ భావాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: עֵדִי
  choice: నా సాక్షి
  rationale: న్యాయస్థాన సంబంధమైన రూపకాన్ని నేరుగా కాపాడుతూ, తన పక్షంలోని సాక్షిని యోబు సూచిస్తున్నాడనే భావాన్ని తెలియజేస్తుంది.
- source_word: וְשָׂהֲדִי
  choice: నా పక్షంగా సాక్ష్యమిచ్చేవాడు
  rationale: అరామీయ ప్రభావం గల ఈ పదం ‘సాక్షి’కి సమీపార్థకం. వ్యక్తిని సూచించే న్యాయసంబంధ భావాన్ని ఉంచుతూ, మొదటి అర్ధపాదాన్ని యాంత్రికంగా పునరావృతం చేయకుండా సమాంతరత్వాన్ని వ్యక్తం చేస్తుంది.
- source_word: בַּמְּרוֹמִים
  choice: ఉన్నత లోకాల్లో
  rationale: ‘పరలోకంలో’ అనే పదానికి సమాంతరంగా ఉన్న ఎత్తైన పరలోక పరిధుల చిత్రాన్ని కాపాడుతుంది; ‘ఉన్నత స్థలాల్లో’ అని అనువదిస్తే తెలుగులో వేరే భావం కలిగే అవకాశం ఉంది.
theological_decisions:
- issue: పరలోక సాక్షి ఎవరు?
  choice: ‘నా సాక్షి… నా పక్షంగా సాక్ష్యమిచ్చేవాడు’ అని అతని కార్యాన్ని మాత్రమే చెప్పి, అతని గుర్తింపును నిర్ధారించకుండా ఉంచడం.
  alternative: అతడు దేవుడే అని, దేవదూతసంబంధ మధ్యవర్తి అని, లేదా యోబు సాక్ష్యానికి కవితాత్మక వ్యక్తీకరణ అని స్పష్టీకరించడం.
  rationale: హీబ్రూ వాక్యం పరలోకంలోని సాక్షిని ప్రస్తావిస్తుంది గానీ అతడు ఎవరో స్పష్టంగా చెప్పదు. అందువల్ల మూలంలోని న్యాయసంబంధ రూపకాన్నీ వేదాంతపరమైన అనిశ్చితినీ అలాగే ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరతను నిలుపుకున్న శైలి. ‘ఇదిగో’ మూలంలోని ఆకస్మిక ఉద్ఘాటనను కాపాడుతుంది. వ్యక్తి పురుషుడని హీబ్రూ వ్యాకరణం మాత్రమే కాక వ్యక్తిగత సాక్షి భావం సూచిస్తున్నందున ‘ఉన్నాడు/వాడు’ వాడబడింది; అయితే అతని నిర్దిష్ట గుర్తింపును అనువాదం నిర్ణయించదు.
