  terminology: “కోపం,” “ద్వేషించాడు,” “విరోధి” సరైన పదఎంపికలు. “విరోధి” అనేది צָרִי యొక్క వ్యక్తిగత శత్రుత్వాన్ని, కర్త ఎవరో నిర్ధారించని మూలపాఠ స్వభావాన్ని కాపాడుతుంది. అయితే ప్రస్తుత పాదసూచిక పాఠంలోని మాటలనే అక్షరార్థంగా మళ్లీ చెబుతోంది; అందువల్ల అది నిజమైన ప్రత్యామ్నాయ పఠనాన్ని ఇవ్వడం లేదు. ఇంగ్లీషు ఆడిట్‌లో ఉన్న ‘enemy/whets’ ప్రత్యామ్నాయాన్ని తెలుగులో ప్రతిబింబించాలి.
