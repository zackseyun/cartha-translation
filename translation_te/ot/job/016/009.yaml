  text: His anger has torn me and hated me[a]; he gnashes his teeth at me; my adversary sharpens his eyes against me.
translation:
  language: te
  text: అతని కోపం నన్ను చీల్చివేసింది; అతడు నన్ను ద్వేషించాడు. నాపై పళ్లు కొరుకుతున్నాడు; నా విరోధి నాపై తన కళ్లను పదును పెడుతున్నాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నా శత్రువు నాపై తన కళ్లకు మెరుగు పెడుతున్నాడు.” హీబ్రూ రూపకం అక్షరార్థంగా కళ్లను ‘పదును పెట్టడం’; ఇది శత్రుభావంతో తీక్షణంగా చూడడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַפּוֹ
  choice: అతని కోపం
  rationale: אַף అనే పదానికి అక్షరార్థంగా ‘ముక్కు’ అనే భావం ఉన్నా, ఇక్కడ అది కోపాన్ని సూచించే స్థిరమైన ప్రయోగం. ఆధునిక తెలుగులో ‘కోపం’ సహజంగా ఉండి భావోద్వేగ తీవ్రతను నిలుపుతుంది.
- source_word: טָרַף
  choice: నన్ను చీల్చివేసింది
  rationale: ఈ క్రియ మృగం తన ఎరను చీల్చే బలమైన చిత్రాన్ని సూచిస్తుంది. ‘చీల్చివేసింది’ ఆ హింసాత్మక కవితా రూపకాన్ని నిలుపుతుంది; కర్మ మొదటి క్రియలో అంతర్భావంగా ఉన్నందున తెలుగులో ‘నన్ను’ స్పష్టంగా చేర్చబడింది.
- source_word: וַיִּשְׂטְמֵנִי
  choice: అతడు నన్ను ద్వేషించాడు
  rationale: שׂטם శత్రుత్వం లేదా ద్వేషాన్ని తెలియజేస్తుంది. ‘ద్వేషించాడు’ చర్యను అదనంగా ఊహించకుండా మూలార్థాన్ని నేరుగా అందిస్తుంది.
- source_word: חָרַק עָלַי בְּשִׁנָּיו
  choice: నాపై పళ్లు కొరుకుతున్నాడు
  rationale: కోపంతో పళ్లు కొరకడం లేదా కరకరలాడించడం అనే హీబ్రూ చిత్రాన్ని సహజమైన తెలుగు నుడికారంతో అందిస్తుంది.
- source_word: צָרִי
  choice: నా విరోధి
  rationale: ఈ పదం శత్రుత్వంతో ఎదిరించేవాణ్ణి సూచిస్తుంది. ‘విరోధి’ సైనిక లేదా న్యాయపరమైన భావాన్ని అనవసరంగా నిర్దిష్టం చేయకుండా వ్యక్తిగత ప్రతికూలతను నిలుపుతుంది.
- source_word: יִלְטוֹשׁ עֵינָיו לִי
  choice: నాపై తన కళ్లను పదును పెడుతున్నాడు
  rationale: לָטַשׁ అక్షరార్థంగా పదును పెట్టడాన్ని సూచిస్తుంది. కళ్లకు వర్తించిన అసాధారణమైన హీబ్రూ రూపకాన్ని ‘తీక్షణంగా చూస్తున్నాడు’ అని సరళీకరించకుండా తెలుగులోనూ నిలుపుతుంది; ‘నాపై’ శత్రుభావంతో కేంద్రీకరించిన దృష్టిని తెలియజేస్తుంది.
theological_decisions:
- issue: యోబు విలాపంలో శత్రుభావంతో వ్యవహరిస్తున్న ఏకవచన పురుష కర్త ఎవరు?
  choice: మూలపాఠంలోని ఏకవచన పురుష సూచనలను మాత్రమే ఉంచి, ఆ వ్యక్తిని పేరుతో గుర్తించలేదు.
  alternative: ఆ కర్త దేవుడని, మానవ శత్రువని, లేదా శత్రువులా వ్యవహరిస్తున్న దేవుని కవితాత్మక చిత్రణ అని స్పష్టీకరించడం.
  rationale: వచనం ఏకవచన పురుష రూపాలను వాడుతున్నా ప్రతి వాక్యభాగంలో కర్తను పేరుతో మళ్లీ చెప్పదు. ‘దేవుడు’ లేదా కేవలం మానవ శత్రువు అని చేర్చకుండా అనిశ్చితినీ దైవశాస్త్ర సంబంధమైన ఉద్రిక్తతనూ అనువాదం కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కవితా ధోరణి పాటించబడింది. ‘చీల్చివేసింది,’ ‘పళ్లు కొరుకుతున్నాడు’ వంటి సులభమైన పదాలతో తీవ్ర చిత్రణను నిలిపి, ‘కళ్లను పదును పెడుతున్నాడు’ అనే ఉద్దేశపూర్వకంగా అసాధారణమైన రూపకానికి పాదసూచిక ఇచ్చాం.
