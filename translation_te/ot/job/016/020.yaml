  text: My friends are my mockers[a]; my eye pours out tears to God.
translation:
  language: te
  text: నా స్నేహితులే నన్ను అపహసించేవారు[a]; దేవుని వైపు నా కన్ను కన్నీరు కారుస్తోంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నా స్నేహితులు నా తరఫున వాదించేవారు/నా మధ్యవర్తులు.” מְלִיצַי అనే హీబ్రూ పదాన్ని కొందరు ఈ సానుకూల భావంలో అర్థం చేసుకున్నారు; అయితే ఈ సందర్భంలో “అపహసించేవారు” అనే భావం యోబు ఫిర్యాదుకు మరింత సరిపోతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְלִיצַי
  choice: నన్ను అపహసించేవారు
  rationale: ఈ సందర్భంలో ఈ పదం ఎగతాళి లేదా అపహాస్యం చేసేవారిని సూచించడం యోబు ఫిర్యాదుకు బాగా సరిపోతుంది. సంబంధిత సానుకూల అర్థసాధ్యతను పాదసూచికలో ఉంచాం.
- source_word: רֵעָי
  choice: నా స్నేహితులే
  rationale: רֵעַ అంటే స్నేహితుడు లేదా సహచరుడు. ‘స్నేహితులే’ అనే రూపం, తనకు తోడుగా ఉండవలసినవారే అపహసిస్తున్నారనే వ్యంగ్యాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אֶל אֱלוֹהַ
  choice: దేవుని వైపు
  rationale: אֶל లోని దిశార్థాన్ని ‘వైపు’ స్పష్టంగా నిలుపుతుంది; אֱלוֹהַ ఇక్కడ దేవుణ్ణి సూచిస్తుంది.
- source_word: דָּלְפָה
  choice: కన్నీరు కారుస్తోంది
  rationale: క్రియ ప్రాథమికంగా బొట్లు బొట్లుగా కారడం లేదా స్రవించడం అనే భావాన్ని ఇస్తుంది. కన్ను కర్తగా ఉన్నందున ఆధునిక తెలుగులో ‘కన్నీరు కారుస్తోంది’ సహజంగా ఉండి మూలంలోని ద్రవప్రవాహ చిత్రాన్ని కాపాడుతుంది.
- source_word: עֵינִי
  choice: నా కన్ను
  rationale: హీబ్రూలో ఏకవచనం ఉంది; కవితాత్మక దృశ్యాన్ని నిలుపడానికి తెలుగులోనూ ఏకవచనాన్నే ఉంచాం.
theological_decisions:
- issue: מְלִיצַי యొక్క ప్రతికూల లేదా సానుకూల భావం
  choice: అపహసించేవారు
  alternative: నా తరఫున వాదించేవారు / మధ్యవర్తులు
  rationale: యోబు స్నేహితుల విరోధభావంతో కూడిన తక్షణ సందర్భంలో ప్రతికూల అర్థం బలంగా సరిపోతుంది. అయితే పదానికి ప్రతిపాదించబడిన సానుకూల భావాన్ని తొలగించకుండా పాదసూచికలో కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యేలా సహజమైన, గౌరవప్రదమైన కవితాత్మక శైలి. ‘నా స్నేహితులే’ ద్వారా మూలంలోని విరోధాభాసానికి స్వల్ప ఉద్ఘాటన ఇచ్చాం; ఏకవచనమైన ‘నా కన్ను’ను నిలిపాం.
