  source_fidelity: మూల హీబ్రూలోని మְלִיצַי రֵעָי అనే సంక్షిప్త నామవాక్యాన్ని సందర్భానుసారంగా “నా స్నేహితులే నన్ను అపహసించేవారు” అని సరిగ్గా గ్రహించింది. מְלִיצַיకి ఉన్న సానుకూల ప్రత్యామ్నాయార్థాన్ని పాదసూచికలో కాపాడింది. אֶל אֱלוֹהַ యొక్క దిశార్థం “దేవుని వైపు”లో, దָּלְפָה యొక్క కారడం/స్రవించడం భావం “కన్నీరు కారుస్తోంది”లో, మరియు עֵינִי యొక్క ఏకవచనం “నా కన్ను”లో నిలిచాయి.
