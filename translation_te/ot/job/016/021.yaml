source:
  edition: WLC
  text: וְ/יוֹכַ֣ח לְ/גֶ֣בֶר עִם אֱל֑וֹהַּ וּֽ/בֶן אָדָ֥ם לְ/רֵעֵֽ/הוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/016/021.yaml
  text: that he would arbitrate for a man with God[c][b][a], as a son of man does for his neighbor.
translation:
  language: te
  text: అతడు ఒక మనిషి పక్షంగా దేవునితో వాదించుగాక[a]—ఒక మానవుడు[b] తన స్నేహితుని పక్షంగా వాదించినట్లు.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఒక మనిషి పక్షంగా దేవునితో వాదనను పరిష్కరించుగాక.” హీబ్రూ క్రియకు న్యాయపరమైన సందర్భంలో వాదించడం, వాదనను తీర్చడం, లేదా ఒకరి పక్షంగా వాదించడం అనే అర్థాలు ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా “మనిషి కుమారుడు.” ఇక్కడ ఇది ఒక మానవుణ్ణి సూచించే సాధారణ ప్రయోగం; తప్పనిసరిగా మెస్సీయ బిరుదు కాదు.
    reason: lexical_alternative
  - marker: c
    text: లేదా, “తన పొరుగువాని పక్షంగా.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיוֹכַח
  choice: వాదించాలి గాక
  rationale: హిఫిల్ రూపమైన יכח న్యాయపరమైన సందర్భంలో తీర్పు తీర్చడం, మధ్యవర్తిత్వం చేయడం, లేదా ఒకరి పక్షంగా వాదించడం అనే భావాలను ఇవ్వగలదు. ఇక్కడ కోర్టు సంబంధిత విన్నపభావాన్ని సహజమైన తెలుగులో చూపుతూ, ఖచ్చితంగా మధ్యవర్తిత్వమే అని నిర్ణయించకుండా “వాదించాలి గాక” అని అనువదించాం.
- source_word: לְגֶבֶר
  choice: ఒక మనిషి పక్షంగా
  rationale: לְ అనే ఉపసర్గను హితార్థకంగా తీసుకున్నాం. גֶּבֶר ఇక్కడ దేవునితో వ్యవహరించే మానవుణ్ణి సూచిస్తుంది; “మనిషి” దాని పురుషవాచక రూపాన్ని నిలుపుతుంది.
- source_word: עִם אֱלוֹהַּ
  choice: దేవునితో
  rationale: עִם యొక్క ప్రాథమిక అర్థం “తో.” వివాద సందర్భంలోని ప్రతిపక్ష భావాన్ని క్రియ, సందర్భం తెలియజేస్తాయి; “దేవునికి వ్యతిరేకంగా” అని మరీ స్పష్టీకరించలేదు.
- source_word: וּבֶן אָדָם
  choice: ఒక నరపుత్రుడు
  rationale: בן אדם అనే హీబ్రూ పదబంధానికి అక్షరరూపాన్ని నిలుపుతూ, కవితా సమాంతరతను కాపాడాం. ఇక్కడ అది సాధారణ మానవుణ్ణి సూచిస్తుందని పాదసూచిక వివరిస్తుంది.
- source_word: לְרֵעֵהוּ
  choice: తన పొరుగువాని పక్షంగా
  rationale: רֵעַ కు పొరుగువాడు, స్నేహితుడు, సహచరుడు అనే అర్థాలు ఉన్నాయి. לְ ను మొదటి పాదంలోని לְגֶבֶר కు సమాంతరమైన హితార్థక ప్రయోగంగా తీసుకుని “పక్షంగా” అని ఇచ్చాం.
theological_decisions:
- issue: “నరపుత్రుడు” అనే పదబంధాన్ని మెస్సీయ సంబంధ బిరుదుగా చదివే అవకాశం
  choice: తక్షణ సందర్భంలో సాధారణ మానవుణ్ణి సూచించే హీబ్రూ నుడికారంగా అనువదించడం
  alternative: దానిని మెస్సీయ సంబంధ బిరుదుగా భావించి ప్రత్యేక బిరుదులా చూపడం, లేదా పూర్తిగా “మానవుడు” అని భావానువాదం చేయడం
  rationale: ఈ వాక్యంలో בן אדם అనేది גבר కు కవితా సమాంతరంగా నిలిచి ఒక మానవుణ్ణి సూచిస్తుంది. తరువాతి ధార్మిక ప్రయోగాన్ని ఇక్కడికి దిగుమతి చేయకుండా, మూలంలోని రూపాన్ని “నరపుత్రుడు”గా నిలిపి దాని సాధారణ భావాన్ని పాదసూచికలో తెలిపాం.
- issue: వక్త కోరుతున్న వ్యక్తి తటస్థ మధ్యవర్తినా లేక మనిషి పక్షవాదినా
  choice: לְ ఉపసర్గల సమాంతర హితార్థక భావాన్ని అనుసరించి “మనిషి పక్షంగా” అని ఉంచడం
  alternative: “మనిషికీ దేవునికీ మధ్య తీర్పు తీర్చాలి” అని తటస్థ మధ్యవర్తిత్వంగా అనువదించడం
  rationale: לְגֶבֶר మరియు לְרֵעֵהוּ సమాంతరంగా ఉన్నందున పక్షంగా/హితార్థకంగా వాదించే భావం బలంగా ఉంది. అయినా క్రియలోని న్యాయపరమైన విస్తృతిని పాదసూచికలో ఉంచి అస్పష్టతను పూర్తిగా తొలగించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కవితా-న్యాయపర శైలిని ఉపయోగించాం. “వాదించాలి గాక” ఆకాంక్షను, “పక్షంగా” హితార్థక לְ సమాంతరతను తెలియజేస్తాయి. “నరపుత్రుడు” మూలరూపాన్ని నిలుపుతుంది; దాని సాధారణ మానవార్థాన్ని పాదసూచిక స్పష్టం చేస్తుంది.
