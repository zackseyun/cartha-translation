revisions:
- from: 'అతడు ఒక మనిషి పక్షంగా దేవునితో వాదించాలి గాక[a]—ఒక నరపుత్రుడు[b] తన పొరుగువాని[c] పక్షంగా వాదించినట్లు.


    [a] లేదా, “ఒక మనిషి పక్షంగా దేవుని ఎదుట న్యాయం తీర్చాలి గాక.” హీబ్రూ క్రియకు న్యాయపరమైన సందర్భంలో తీర్పు తీర్చడం, మధ్యవర్తిగా వ్యవహరించడం, లేదా ఒకరి పక్షంగా వాదించడం అనే అర్థాలు ఉండవచ్చు.

    [b] హీబ్రూలో అక్షరార్థంగా “నరపుత్రుడు.” ఇక్కడ ఇది ఒక మానవుణ్ణి సూచించే సాధారణ ప్రయోగం; తప్పనిసరిగా మెస్సీయ బిరుదు కాదు.

    [c] లేదా, “తన స్నేహితుని.”'
  to: అతడు ఒక మనిషి పక్షంగా దేవునితో వాదించుగాక[a]—ఒక మానవుడు[b] తన స్నేహితుని పక్షంగా వాదించినట్లు.[c]
  rationale: సవరణలు మూలంలోని న్యాయపరమైన ఆకాంక్షను మరియు రెండు לְ ఉపసర్గల హితార్థక సమాంతరతను కాపాడుతున్నాయి. “మానవుడు” ఆధునిక సహజ ప్రయోగం; పాదసూచికలో అక్షరార్థాన్ని ఇచ్చి בן־אדם యొక్క రూపాన్నీ, అది ప్రత్యేక బిరుదు కాదనే సందర్భార్థాన్నీ తెలియజేస్తుంది. పాదసూచిక aలో తటస్థ న్యాయనిర్ణేత భావాన్ని తగ్గించి, మూలక్రియ యొక్క విస్తృత న్యాయపర అర్థాలను నిలిపాం.
