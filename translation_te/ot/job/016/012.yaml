source:
  edition: WLC
  text: שָׁ֘לֵ֤ו הָיִ֨יתִי וַֽ/יְפַרְפְּרֵ֗/נִי וְ/אָחַ֣ז בְּ֭/עָרְפִּ/י וַֽ/יְפַצְפְּצֵ֑/נִי וַ/יְקִימֵ֥/נִי ל֝֗/וֹ לְ/מַטָּרָֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/016/012.yaml
  text: I was at ease[a], but he shattered me; he seized me by my neck and dashed me to pieces; he set me up for himself as a target.
translation:
  language: te
  text: నేను నిశ్చింతగా ఉన్నాను[a]; కానీ అతడు నన్ను ఛిన్నాభిన్నం చేశాడు; నా మెడను పట్టుకుని నన్ను నుజ్జునుజ్జు చేశాడు; తనకు గురిగా నన్ను నిలబెట్టాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ఛిన్నాభిన్నం చేశాడు’ అని అనువదించిన క్రియ అరుదైనది; దీనిని ‘తీవ్రంగా కుదిపేశాడు’ లేదా ‘చీల్చివేశాడు’ అని కూడా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלֵו
  choice: నిశ్చింతగా
  rationale: ఈ విశేషణం ప్రశాంతతతో, భద్రతతో ఉన్న స్థితిని సూచిస్తుంది. ‘నిశ్చింతగా’ అనేది సహజమైన ఆధునిక తెలుగు పదం; ఆ ప్రశాంత స్థితికీ తరువాతి హింసకూ ఉన్న వ్యత్యాసాన్ని స్పష్టంగా చూపుతుంది.
- source_word: וַיְפַרְפְּרֵנִי
  choice: నన్ను ముక్కలు చేశాడు
  rationale: ఇది అరుదైన, అర్థనిర్ణయం కష్టమైన క్రియ. సందర్భంలో యోబు నిశ్చింతను తీవ్రంగా ఛిన్నాభిన్నం చేసిన చర్యను సూచిస్తుంది. ఇతర సాధ్యార్థాలను పాదసూచికలో ఉంచాం.
- source_word: וְאָחַז
  choice: పట్టుకొని
  rationale: ఈ క్రియ గట్టిగా పట్టుకోవడం లేదా బలవంతంగా అదుపులోకి తీసుకోవడం అనే అర్థం ఇస్తుంది. ‘పట్టుకొని’ తెలుగులో సహజంగా ఉండి, సందర్భంలోని దౌర్జన్యాన్ని తరువాతి క్రియతో కలిపి వ్యక్తం చేస్తుంది.
- source_word: בְּעָרְפִּי
  choice: నా మెడ
  rationale: עֹרֶף ప్రధానంగా మెడ వెనుక భాగాన్ని సూచిస్తుంది. ‘నా మెడ పట్టుకొని’ సహజమైన తెలుగు ప్రయోగం; పట్టుకున్న శరీరభాగాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: וַיְפַצְפְּצֵנִי
  choice: నన్ను చితకగొట్టాడు
  rationale: ఈ తీవ్రరూప క్రియ బద్దలుకొట్టడం లేదా నలగగొట్టడం వంటి విధ్వంసక హింసను సూచిస్తుంది. ‘చితకగొట్టాడు’ మొదటి అరుదైన క్రియతో పదేపదే ఒకే రూపం రాకుండా, రెండవ దాడి తీవ్రతను సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: וַיְקִימֵנִי
  choice: నన్ను నిలబెట్టాడు
  rationale: קום యొక్క హిఫిల్ రూపం ఇక్కడ నిలబడేలా చేయడం లేదా ఒక స్థానంలో ఉంచడం అనే కారణార్థాన్ని ఇస్తుంది. తరువాత వచ్చే లక్ష్య రూపకానికి ‘నిలబెట్టాడు’ నేరుగా సరిపోతుంది.
- source_word: לוֹ
  choice: తనకు
  rationale: ఈ సర్వనామ ప్రత్యయం క్రియకర్త తన ఉపయోగార్థం యోబును ఉంచిన భావాన్ని తెలియజేస్తుంది. ‘తనకు’ ఆ ఆత్మనిర్దేశక సంబంధాన్ని సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: לְמַטָּרָה
  choice: లక్ష్యంగా
  rationale: ఈ నామవాచకం దాడి చేయడానికి ఉద్దేశించిన గురి లేదా లక్ష్యాన్ని సూచిస్తుంది. ‘లక్ష్యంగా’ యుద్ధసంబంధ రూపకాన్ని స్పష్టంగా, సహజంగా నిలుపుతుంది.
theological_decisions:
- issue: వచనమంతటా ఉన్న తృతీయ పురుష ఏకవచన పుంలింగ క్రియకర్త ఎవరు?
  choice: ‘అతడు’ అని మాత్రమే అనువదించి, ఆ వ్యక్తిని వచనంలో స్పష్టంగా గుర్తించలేదు.
  alternative: సూచిత దాడిచేసేవాడు దేవుడని నేరుగా పేర్కొనడం; లేదా నిర్దిష్టం కాని విరోధిగా అర్థం చేసుకోవడం.
  rationale: యోబు ప్రసంగ సందర్భంలో సూచన దేవునివైపు ఉన్నప్పటికీ, ఈ వచనంలోని హీబ్రూ పాఠం తృతీయ పురుష క్రియారూపాలు, సర్వనామ ప్రత్యయాలు మాత్రమే వాడుతుంది. అందువల్ల మూలంలోని అస్పష్టతను, దైవశాస్త్రీయ ఉద్రిక్తతను అలాగే ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనదిగా, అయితే యోబు కవిత్వంలోని గంభీరతను మరియు వరుస హింసాత్మక చిత్రాలను నిలుపుకునేలా రూపొందించబడింది.
