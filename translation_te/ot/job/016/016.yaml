source:
  edition: WLC
  text: פָּנַ֣/י חמרמרה מִנִּי בֶ֑כִי וְ/עַ֖ל עַפְעַפַּ֣/י צַלְמָֽוֶת־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/016/016.yaml
  text: My face is red from weeping[a], and on my eyelids is deep darkness.
translation:
  language: te
  text: 'ఏడుపువల్ల నా ముఖం ఎర్రబడింది;

    నా కనురెప్పలపై గాఢాంధకారం[a] కమ్ముకుంది.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘మరణఛాయ.’ హీబ్రూ పదం మరణాన్ని తలపించే ఛాయను గానీ అత్యంత గాఢమైన చీకటిని గానీ సూచించగలదు. ఇక్కడి సందర్భం కనురెప్పలపై కమ్ముకున్న తీవ్రమైన విషాదాంధకారాన్ని సూచిస్తున్నట్లు ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּנַי
  choice: నా ముఖం
  rationale: మొదటి పురుష ఏకవచన ప్రత్యయంతో ఉన్న ఈ బహువచన రూపం ఇక్కడ సమష్టిగా ‘ముఖం’ అనే అర్థాన్నిస్తుంది; ఆధునిక తెలుగులో ఇదే సహజమైన వ్యక్తీకరణ.
- source_word: חמרמרה
  choice: ఎర్రబడింది
  rationale: ఈ అరుదైన క్రియ తీవ్రమైన వేదనవల్ల ముఖంలో కలిగిన స్పష్టమైన మార్పును సూచిస్తుంది. ఏడుపు సందర్భంలో ‘ఎర్రబడింది’ అనేది భావాన్ని అతిగా నిర్దిష్టం చేయకుండా సహజంగా తెలియజేస్తుంది.
- source_word: מִנִּי בֶכִי
  choice: ఏడుపువల్ల
  rationale: מִנִּי ఇక్కడ కారణాన్ని సూచిస్తుంది; בֶכִי అంటే ఏడుపు. రెండింటినీ కలిపి ‘ఏడుపువల్ల’ అని అనువదించడం సంక్షిప్తంగా, సహజంగా ఉంది.
- source_word: עַפְעַפַּי
  choice: నా కనురెప్పలపై
  rationale: మూలపదం సాధారణంగా కళ్లను కాక ప్రత్యేకంగా కనురెప్పలను సూచిస్తుంది; ఆ శరీర భాగపు స్పష్టతను నిలిపాం.
- source_word: צַלְמָוֶת
  choice: గాఢాంధకారం
  rationale: ఈ కవితాత్మక పదం అత్యంత దట్టమైన చీకటిని లేదా మరణఛాయను సూచించగలదు. ఇక్కడ యోబు ముఖంపై కనిపించే శోకస్థితి సందర్భంలో ‘గాఢాంధకారం’ అనేది సహజంగా సరిపోతుంది; మరొక సాధ్యమైన అర్థాన్ని పాదసూచికలో నిలిపాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కవితా శైలిని వాడాం. మూలంలోని రెండు సమాంతర పాదాలను నిలిపి, రెండవ పాదంలోని నామవాచక వాక్యాన్ని తెలుగులో సహజంగా చేయడానికి ‘కమ్ముకుంది’ అనే క్రియను చేర్చాం. పాదసూచిక గుర్తును అది వివరిస్తున్న ‘గాఢాంధకారం’ పదానికే జతచేశాం.
