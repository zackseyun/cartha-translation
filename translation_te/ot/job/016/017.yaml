  text: עַ֭ל לֹא חָמָ֣ס בְּ/כַפָּ֑/י וּֽ/תְפִלָּתִ֥/י זַכָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/016/017.yaml
  text: although there is no violence in my hands[b][a], and my prayer is pure.
translation:
  language: te
  text: నా చేతుల్లో హింస లేకపోయినప్పటికీ[a], నా ప్రార్థన నిర్మలంగా ఉంది[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఎందుకంటే నా చేతుల్లో హింస లేదు.” హీబ్రూ సంబంధపదాన్ని ఒకటి కంటే ఎక్కువ విధాలుగా అర్థం చేసుకోవచ్చు; సందర్భాన్ని బట్టి ప్రధాన పాఠం రాయితీ భావాన్ని అనుసరిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘నిర్మలంగా’ అనే మాటకు బదులు “శుద్ధంగా” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל
  choice: లేకపోయినప్పటికీ
  rationale: సందర్భంలో యోబు తన నిర్దోషిత్వాన్ని నొక్కిచెబుతూ, తాను అనుభవిస్తున్న బాధకు విరుద్ధంగా ఈ మాట చెబుతున్నాడు. అందువల్ల సంబంధాన్ని రాయితీ భావంలో సహజమైన తెలుగులో వ్యక్తం చేశాం; అయితే హీబ్రూ విభక్త్యర్థంలోని సందిగ్ధతను పాదటిప్పణిలో ఉంచాం.
- source_word: לֹא
  choice: లేకపోయి
  rationale: ‘హింస’ అనే నామవాచకంతో కలిసి ఉనికి నిరాకరణను తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: חָמָס
  choice: హింస
  rationale: ఈ పదానికి హింస, అన్యాయం, దుర్మార్గం అనే అర్థపరిధి ఉంది. ‘హింస’ మూలపదంలోని బలమైన, ప్రత్యక్ష భావాన్ని నిలుపుతుంది; అది కేవలం శారీరక దాడికే పరిమితం కావలసిన అవసరం లేదు.
- source_word: בְּכַפָּי
  choice: నా చేతుల్లో
  rationale: యోబు చేసిన కార్యాలు లేదా వాటికి అతని బాధ్యతను సూచించే స్పష్టమైన శరీరరూపకాన్ని ఇది నిలుపుతుంది.
- source_word: וּתְפִלָּתִי
  choice: నా ప్రార్థన
  rationale: תְּפִלָּהకు సాధారణమైన, సందర్భోచితమైన తెలుగు సమానార్థకం ‘ప్రార్థన’; ఇది కేవలం విన్నపం కంటే విస్తృతమైన భావాన్ని కలిగి ఉంది.
- source_word: זַכָּה
  choice: నిర్మలంగా
  rationale: శుభ్రత, స్వచ్ఛత, నైతిక కల్మషరాహిత్యం అనే భావాలను సహజమైన తెలుగులో తెలియజేస్తుంది; యోబు సంపూర్ణ పాపరహితుడని అదనంగా నిర్ధారించదు.
theological_decisions:
- issue: యోబు తన నిర్దోషిత్వం గురించి చేస్తున్న వాదన
  choice: ‘నా చేతుల్లో హింస లేదు; నా ప్రార్థన నిర్మలంగా ఉంది’ అనే ఈ సందర్భానికి పరిమితమైన నిర్దోషిత్వ వాదనగా అనువదించడం
  alternative: యోబు సంపూర్ణంగా పాపరహితుడని చెప్పే నిరపేక్ష వాదనగా, లేదా కేవలం ఆచారపరమైన శుద్ధత వాదనగా అనువదించడం
  rationale: హింసాత్మక దోషం వల్లనే తనకు బాధ కలిగిందనే భావాన్ని యోబు తిరస్కరిస్తున్నాడు. మూలపాఠంలోని అతని బలమైన స్వీయసమర్థనను నిలుపుతూ, సంపూర్ణ నైతిక పరిపూర్ణతను గానీ కేవలం ఆచారశుద్ధిని గానీ అనువాదం చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘నా చేతుల్లో’ అనే మూలపాఠ రూపకాన్ని నిలిపి, వాక్య సంబంధాన్ని సహజమైన ‘లేకపోయినప్పటికీ’తో తెలిపాం.
