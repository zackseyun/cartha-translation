lexical_decisions:
- source_word: שָׁמַעְתִּי
  choice: నేను విన్నాను
  rationale: שׁמע అనే ధాతువు యొక్క Qal perfect 1cs రూపం. తెలుగులో ‘నేను విన్నాను’ గతంలో పలుమార్లు విన్న సంగతుల సమాహారాన్ని సందర్భానుసారంగా సహజంగా తెలియజేస్తుంది.
- source_word: כְאֵלֶּה רַבּוֹת
  choice: ఇలాంటివి ఎన్నో
  rationale: తులనార్థక כְּ, సూచకపదం אֵלֶּה, మరియు ‘అనేకం’ అనే భావమున్న רַבּוֹת కలిసి ‘ఇలాంటివి ఎన్నో’ అనే dismissive భావాన్ని సహజమైన ఆధునిక తెలుగులో ఇస్తాయి.
- source_word: מְנַחֲמֵי
  choice: ఓదార్పుదారులు
  rationale: נחם ధాతువు నుండి వచ్చిన కర్తృవాచక participle ఇక్కడ నామవాచకంగా ‘ఓదార్చేవారు’ అని సూచిస్తుంది. ‘ఓదార్పుదారులు’ స్నేహితుల ప్రకటిత పాత్రను, దానిలోని వ్యంగ్యాన్ని నిలుపుతుంది.
- source_word: עָמָל
  choice: బాధ కలిగించే
  rationale: עָמָל కు శ్రమ, కష్టం, బాధ, దుఃఖం వంటి అర్థాలు ఉన్నాయి. Construct phraseలో వీరి ఓదార్పు ఉపశమనంకాక బాధను తెస్తుందనే భావాన్ని ‘బాధ కలిగించే’ స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది; మూలంలోని సంబంధాన్ని పాదటిప్పణిలో మరింత అక్షరార్థంగా చూపించాం.
- source_word: כֻּלְּכֶם
  choice: మీరంతా
  rationale: రెండవ పురుష బహువచన సమగ్రతను సహజమైన ప్రత్యక్ష సంబోధనగా తెలియజేస్తుంది.
