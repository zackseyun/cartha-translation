source:
  edition: WLC
  text: כִּֽי שְׁנ֣וֹת מִסְפָּ֣ר יֶאֱתָ֑יוּ וְ/אֹ֖רַח לֹא אָשׁ֣וּב אֶהֱלֹֽךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/016/022.yaml
  text: For a few years will come[b][a], and I will go on the path from which I will not return.
translation:
  language: te
  text: ఎందుకంటే, కొద్ది సంవత్సరాలు మాత్రమే వస్తాయి[a]; ఆ తర్వాత నేను తిరిగిరాని దారిలో వెళ్లిపోతాను[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా ‘లెక్కగల సంవత్సరాలు’; అంటే సంఖ్యలో కొద్దివి లేదా పరిమితమైనవి.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘నేను తిరిగి రాని మార్గంలో.’ ఈ మాట మరణం వైపు సాగే తిరుగులేని ప్రయాణాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి వాక్యానికి కారణాన్ని తెలియజేసే సంబంధాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: שְׁנוֹת מִסְפָּר
  choice: కొద్ది సంవత్సరాలు మాత్రమే
  rationale: అక్షరార్థంగా ‘లెక్కగల సంవత్సరాలు’; అంటే సంఖ్యలో కొద్దివి లేదా పరిమితమైనవి. తెలుగు పాఠకులకు భావాన్ని స్పష్టంగా తెలియజేసే సహజ ప్రయోగం.
- source_word: יֶאֱתָיוּ
  choice: వస్తాయి
  rationale: ‘రావడం/చేరడం’ అనే మూలార్థాన్ని నిలుపుతుంది; సంవత్సరాలే ఈ క్రియకు కర్తలు.
- source_word: וְאֹרַח
  choice: ఆ తర్వాత ... దారిలో
  rationale: אֹרַח లోని స్పష్టమైన ‘దారి’ రూపకాన్ని నిలుపుతూ, రెండు ఉపవాక్యాల కాలక్రమ సంబంధాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לֹא אָשׁוּב
  choice: తిరిగిరాని
  rationale: ‘నేను తిరిగి రాను’ అనే భావాన్ని దారిని విశేషించే సహజ తెలుగు రూపంలో అందిస్తుంది; ప్రయాణం తిరుగులేనిదనే భావం నిలుస్తుంది.
- source_word: אֶהֱלֹךְ
  choice: వెళ్లిపోతాను
  rationale: הלך అనే ‘వెళ్లు/నడుచు’ భావాన్ని భవిష్యత్ చర్యగా తెలియజేస్తుంది; ‘వెళ్లిపోతాను’ సందర్భంలోని తుదిప్రయాణ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ‘తిరిగిరాని దారి’ సూచించే గమ్యం
  choice: మరణాన్ని ప్రధాన పాఠ్యంలో నేరుగా చేర్చకుండా దారి రూపకాన్ని నిలుపడం
  alternative: ‘మరణ మార్గంలో వెళ్లిపోతాను’ అని స్పష్టీకరించడం
  rationale: సందర్భం మరణాన్ని సూచించినప్పటికీ, హీబ్రూ పాఠ్యం ‘మరణం’ అనే పదాన్ని ఉపయోగించదు. అందువల్ల మూలంలోని రూపకాన్నీ దాని గంభీరతనూ నిలిపి, వివరణను పాదసూచికకు పరిమితం చేశాము.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు స్పష్టంగా ఉండేలా గంభీరమైన శైలిని వాడాం. ‘దారి’ అనే మూల రూపకాన్ని నిలిపి, ‘కొద్ది సంవత్సరాలు మాత్రమే’ ద్వారా పరిమిత కాల భావాన్ని సహజంగా వ్యక్తం చేశాం.
