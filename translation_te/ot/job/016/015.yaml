  text: I have sewn sackcloth over my skin[b][a], and thrust my horn into the dust.
translation:
  language: te
  text: నా చర్మం మీద గోనెపట్టను కుట్టాను; ధూళిలో నా కొమ్మును[a] పడవేశాను.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘కొమ్ము’ బలం, గౌరవం లేదా ఉన్నత స్థితికి హీబ్రూ రూపకం.
    reason: cultural_note
  - marker: b
    text: లేదా, “నా కొమ్మును ధూళిలోకి దించాను” లేదా “అపవిత్రం చేశాను.” ఇక్కడి హీబ్రూ క్రియ క్లిష్టమైనది; దాని ఖచ్చితమైన భావం అనిశ్చితం.
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׂק
  choice: గోనెపట్ట
  rationale: దుఃఖాన్ని వ్యక్తం చేయడానికి ధరించే ముతక వస్త్రాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘గోనెపట్ట’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: תָּפַרְתִּי
  choice: కుట్టుకున్నాను
  rationale: తפר అనే క్రియ యొక్క Qal perfect 1cs రూపానికి ‘కుట్టాను’ మూలార్థం; తన చర్మం మీద తానే దాన్ని కుట్టుకున్నాడనే సందర్భార్థాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: עֲלֵי גִלְדִּי
  choice: నా చర్మం మీద
  rationale: על స్థానాన్ని, גֶּלֶד చర్మాన్ని సూచిస్తాయి; శరీరబాధ మరియు శోకవస్త్రపు దృశ్యాన్ని నేరుగా నిలుపుతుంది.
- source_word: וְעֹלַלְתִּי
  choice: అణచివేశాను
  rationale: ఈ క్రియ అర్థం క్లిష్టమైనది. ధూళితో కూడిన సందర్భంలో కిందికి దించడం లేదా అవమాన స్థితికి చేర్చడం అనే భావాన్ని ‘అణచివేశాను’ అందిస్తుంది; అనిశ్చితిని పాదటీపులో తెలియజేశాం.
- source_word: בֶעָפָר
  choice: ధూళిలోకి
  rationale: בְ సాధారణంగా ‘లో’ అయినప్పటికీ, ఎంచుకున్న కిందికి నెట్టే క్రియతో గమ్యస్థితిని తెలుగులో ‘ధూళిలోకి’ సహజంగా తెలియజేస్తుంది.
- source_word: קַרְנִי
  choice: నా కొమ్మును
  rationale: ‘కొమ్ము’ అనే హీబ్రూ రూపకాన్ని అనువదించి తొలగించకుండా నిలిపింది; అది బలం, గౌరవం లేదా ఉన్నత స్థితిని సూచించగలదని పాదటీపు వివరిస్తుంది.
theological_decisions:
- issue: ‘కొమ్ము’ అనే రూపకం
  choice: ప్రధాన పాఠంలో ‘నా కొమ్మును’ అని రూపకాన్ని యథాతథంగా ఉంచడం
  alternative: నా బలాన్ని; నా గౌరవాన్ని
  rationale: హీబ్రూ కవితాత్మక దృశ్యాన్ని, అవమానానికి సంబంధించిన భావగాఢతను ఇది కాపాడుతుంది; ఒకే వివరణను ప్రధాన పాఠంలో బలవంతంగా నిర్ణయించదు.
- issue: וְעֹלַלְתִּי క్రియ యొక్క అనిశ్చిత భావం
  choice: ‘అణచివేశాను’ అనే కిందికి దించే చర్యగా అనువదించడం
  alternative: పడవేశాను; అపవిత్రం చేశాను; ధూళిలో ముంచాను
  rationale: ధూళి మరియు అవమాన సందర్భానికి సరిపోయే స్పష్టమైన చర్యను ఇస్తూనే, వివాదాస్పదమైన సూక్ష్మార్థాన్ని పాదటీపులో తెరిచి ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన విలాప శైలిని వాడాం. ‘గోనెపట్ట’, ‘చర్మం’, ‘ధూళి’ సాధారణ పాఠకులకు స్పష్టమైన పదాలు; ‘కొమ్ము’ అనే మూల రూపకాన్ని వివరణాత్మక పాదటీపుతో నిలిపాం.
