revisions:
- from: వారు నాకు విరోధంగా నోళ్లు పెద్దగా తెరిచారు; అవమానంతో నా చెంపపై కొట్టారు; అందరూ కలిసి నాకు విరోధంగా గుమికూడారు.[a]
  to: వారు నాకు విరోధంగా నోళ్లు పెద్దగా తెరిచారు; నిందిస్తూ నా చెంపపై కొట్టారు; కలిసి నాకు విరోధంగా గుమికూడారు.[a]
  rationale: The revision removes the added universal force of ‘అందరూ,’ renders the reproachful manner more directly, and refines the note to preserve the unresolved force of יִתְמַלָּאוּן. It retains the draft’s faithful, natural rendering of the other clauses.
