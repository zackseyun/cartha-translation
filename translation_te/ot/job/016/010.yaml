  text: They have opened their mouths wide against me[a]; with reproach they have struck my cheek; together they gather themselves against me.
translation:
  language: te
  text: వారు నాకు విరోధంగా నోళ్లు పెద్దగా తెరిచారు; నిందిస్తూ నా చెంపపై కొట్టారు; కలిసి నాకు విరోధంగా గుమికూడారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: చివరి క్రియ నుడికారపూర్వకమైనది, దాని అర్థం క్లిష్టం. ‘నాకు విరోధంగా సమకూడారు’ అని కూడా అనువదించవచ్చు; మరింత అక్షరార్థంగా ‘నాకు విరోధంగా నిండిపోయారు’ అనే భావం కూడా సాధ్యమే. ఇక్కడ శత్రువులు ఏకమై మోహరించిన భావం ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּעֲרוּ
  choice: నోళ్లు పెద్దగా తెరిచారు
  rationale: పער అనే క్రియ ఇక్కడ ఎగతాళి లేదా శత్రుత్వంతో నోరు వెడల్పుగా తెరవడాన్ని సూచిస్తుంది; ఈ సజీవ దృశ్యాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: עָלַי
  choice: నాకు విరోధంగా
  rationale: శత్రుత్వ చర్యల సందర్భంలో עַל ప్రత్యర్థిత్వ భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: בְּפִיהֶם
  choice: నోళ్లు
  rationale: హీబ్రూలో అక్షరార్థంగా ‘వారి నోటితో’ ఉన్నా, బహువచన కర్తకు తెలుగులో ‘నోళ్లు’ సహజంగా ఉంటుంది.
- source_word: בְּחֶרְפָּה
  choice: అవమానంతో
  rationale: חֶרְפָּה నింద, అవహేళన, అవమానం అనే భావాలను కలిగి ఉంది; ‘అవమానంతో’ దాడిలోని పరాభవ ఉద్దేశాన్ని తెలియజేస్తుంది.
- source_word: הִכּוּ
  choice: కొట్టారు
  rationale: נכה యొక్క సాధారణ అర్థం కొట్టడం; ఆధునిక తెలుగులో ఇది స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: לְחָיָי
  choice: నా చెంపపై
  rationale: לְחִי చెంప లేదా దవడను సూచిస్తుంది; ఇక్కడ అవమానకరమైన దెబ్బ చిత్రానికి ‘చెంప’ సరిపోతుంది.
- source_word: יַחַד
  choice: అందరూ కలిసి
  rationale: יַחַד సమష్టిగా, ఏకకాలంలో చేసే చర్యను సూచిస్తుంది.
- source_word: יִתְמַלָּאוּן
  choice: గుమికూడారు
  rationale: מלא యొక్క ఈ రూపం ఇక్కడ క్లిష్టమైన నుడికారం; సందర్భంలో శత్రువులు సమష్టిగా దాడికి కూడడాన్ని ‘గుమికూడారు’ సహజంగా తెలియజేస్తుంది, అయితే అక్షరార్థంలోని ‘నిండిపోవడం’ భావం అనిశ్చితిగానే ఉంది.
