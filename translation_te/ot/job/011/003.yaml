translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన ప్రశ్నారూపాన్ని ఉపయోగించాం. హీబ్రూ కవిత్వంలోని రెండు సమాంతర వాక్యభాగాలను రెండు పంక్తులుగా ఉంచి, మొదటి క్రియలోని కారణార్థక భావాన్ని స్పష్టంగా వ్యక్తపరిచాం.
