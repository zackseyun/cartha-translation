  terminology: ‘వ్యర్థమైన మాటలు,’ ‘ఎగతాళి,’ and ‘సిగ్గుపరచు’ are suitable contemporary equivalents. The footnote preserves the principal lexical alternatives for בַּדֶּיךָ and does not impose a disputed nuance.
