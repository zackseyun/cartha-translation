  text: בַּ֭דֶּי/ךָ מְתִ֣ים יַחֲרִ֑ישׁו וַ֝/תִּלְעַ֗ג וְ/אֵ֣ין מַכְלִֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/job/011/003.yaml
  text: Will your empty talk make men keep silent[a], and when you mock, will no one shame you?
translation:
  language: te
  text: 'నీ వ్యర్థమైన మాటలు[a] మనుషులను మౌనంగా ఉండేలా చేస్తాయా?


    నీవు ఎగతాళి చేస్తుంటే, నిన్ను సిగ్గుపరచేవారు ఎవరూ ఉండరా?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నీ ప్రగల్భాలు,” “నీ అర్థంలేని మాటలు.” హీబ్రూ పదం వ్యర్థమైన, పనికిమాలిన, ప్రగల్భమైన లేదా అసత్యమైన మాటలను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּדֶּיךָ
  choice: నీ వ్యర్థపు మాటలు
  rationale: ఈ పదం ఖాళీ, పనికిమాలిన, ప్రగల్భమైన లేదా అసత్యమైన మాటలను సూచించగలదు. సందర్భంలో జోఫరు యోబు మాటలను తృణీకరిస్తున్నాడు; ‘వ్యర్థపు మాటలు’ ఆ మందలింపు ధోరణిని నిలుపుతూ, నేరుగా ‘అబద్ధాలు’ అని అర్థాన్ని పరిమితం చేయదు.
- source_word: מְתִים
  choice: మనుషులను
  rationale: హీబ్రూ బహువచనం మనుషులను లేదా వ్యక్తులను సూచిస్తుంది. ఇక్కడ సాధారణంగా ఇతర మనుషులనే ఉద్దేశిస్తున్నందున సహజమైన ఆధునిక తెలుగు రూపాన్ని ఎంచుకున్నాం.
- source_word: יַחֲרִישׁו
  choice: మౌనంగా ఉండేలా చేస్తాయా
  rationale: హిఫిల్ రూపంలోని కారణార్థక భావాన్ని—ఇతరులు మౌనంగా ఉండేలా చేయడం—తెలుగులో స్పష్టంగా నిలుపుతుంది.
- source_word: וַתִּלְעַג
  choice: నీవు ఎగతాళి చేస్తుంటే
  rationale: לעג అంటే ఎగతాళి చేయడం లేదా అపహాస్యం చేయడం. కవితాత్మక ప్రశ్నలో రెండో భాగాన్ని సహజంగా అనుసంధానించేందుకు ‘చేస్తుంటే’ అని ఇచ్చాం.
- source_word: מַכְלִם
  choice: నిన్ను సిగ్గుపరచేవాడు
  rationale: כלם హిఫిల్ రూపం అవమానం లేదా సిగ్గు కలిగించడాన్ని సూచిస్తుంది. ‘సిగ్గుపరచేవాడు’ మూలంలోని వ్యక్తిగత అవమాన భావాన్ని నిలుపుతుంది; ‘మందలించేవాడు’ కంటే తక్కువ వ్యాఖ్యానాత్మకం.
