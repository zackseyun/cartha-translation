source:
  edition: WLC
  text: הַ/חֵ֣קֶר אֱל֣וֹהַ תִּמְצָ֑א אִ֤ם עַד תַּכְלִ֖ית שַׁדַּ֣י תִּמְצָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/011/007.yaml
  text: Can you discover the depths of God? Can you find the limit of the Almighty?[a][b]
translation:
  language: te
  text: దేవుని లోతైన సంగతులను నీవు కనుగొనగలవా?[a] సర్వశక్తిమంతుని అంతిమ హద్దును నీవు కనుగొనగలవా?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దేవుని గురించిన అన్వేషణను నీవు తెలుసుకోగలవా?” హీబ్రూ పదం అన్వేషణను, పరిశోధనను, లేదా అన్వేషించి తెలుసుకున్న విషయాన్ని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “అంతిమ హద్దు”కు బదులుగా “అంతం,” “పూర్తి విస్తృతి,” లేదా “పరిపూర్ణత” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֵקֶר
  choice: అగాధాలను
  rationale: חֵקֶר అనేది అన్వేషణను, పరిశోధనను, లేదా అన్వేషించి తెలుసుకోవలసిన లోతైన విషయాన్ని సూచించగలదు. ఇక్కడ మానవ పరిశోధనకు అందని దేవుని లోతులను సహజమైన తెలుగులో తెలియజేయడానికి ‘అగాధాలను’ ఎంచుకున్నాం.
- source_word: אֱלוֹהַ
  choice: దేవుని
  rationale: యోబు గ్రంథంలో వాడిన ఏకవచన దైవపదానికి సరళమైన, ప్రామాణిక తెలుగు రూపం.
- source_word: תִּמְצָא (మొదటి పాదం)
  choice: కనుగొనగలవా
  rationale: מצא యొక్క ప్రాథమిక అర్థం ‘కనుగొను’. חֵקֶרతో కలిసి విజయవంతంగా శోధించి తెలుసుకోవడమనే భావాన్ని ఇది సహజంగా అందిస్తుంది.
- source_word: אִם
  choice: —గలవా
  rationale: ఇక్కడ אִם షరతును కాక, సమాంతరమైన రెండో అలంకారప్రశ్నను ప్రవేశపెడుతుంది; తెలుగులో సామర్థ్యార్థక ప్రశ్నారూపం దాని బలాన్ని తెలియజేస్తుంది.
- source_word: עַד תַּכְלִית
  choice: సంపూర్ణ పరిమితిని
  rationale: ఈ పదబంధం అంతిమ హద్దు లేదా పూర్తి విస్తృతిని సూచిస్తుంది. ‘సంపూర్ణ పరిమితి’ హద్దు మరియు పూర్తి విస్తృతి అనే రెండు భావాలను నిలుపుతుంది.
- source_word: שַׁדַּי
  choice: సర్వశక్తిమంతుని
  rationale: తెలుగులో స్థిరపడిన దైవబిరుదు; యోబులోని దైవనామానికి సందర్భోచితమైన అర్థానువాదం.
- source_word: תִּמְצָא (రెండో పాదం)
  choice: చేరగలవా
  rationale: ప్రాథమికంగా ‘కనుగొనగలవా’ అయినా, עַד תַּכְלִיתతో కలిసి అంతిమ హద్దువరకు చేరడమనే భావం సహజమైన తెలుగులో స్పష్టమవుతుంది.
theological_decisions:
- issue: దేవుణ్ణి మానవుడు గ్రహించగల పరిమితి
  choice: ఈ వాక్యాన్ని దేవుని అగాధాలను, సంపూర్ణ పరిమితిని మానవుడు పూర్తిగా శోధించి చేరలేడనే అలంకారప్రశ్నలుగా ఉంచాం.
  alternative: మానవుడు దేవుని గురించి అసలు ఏమీ తెలుసుకోలేడని సంపూర్ణ అజ్ఞేయతను ప్రకటించడం.
  rationale: హీబ్రూ పాఠం దేవుని సంపూర్ణంగా శోధించి చివరి హద్దును చేరలేమని నొక్కిచెబుతుంది; దేవుని గురించి నిజమైన జ్ఞానం ఏదీ సాధ్యం కాదని మాత్రం చెప్పదు. అందువల్ల ఆ ఉద్రిక్తతను పరిష్కరించకుండా నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలిని వాడాం. రెండు సమాంతర అలంకారప్రశ్నలను నిలిపి, మొదటి పాదంలో ‘కనుగొనగలవా’, రెండో పాదంలో విస్తృతి/హద్దు భావానికి సహజమైన ‘చేరగలవా’ వాడాం.
