source:
  edition: WLC
  text: אִם אַ֭תָּ֗ה הֲכִינ֣וֹתָ לִבֶּ֑/ךָ וּ/פָרַשְׂתָּ֖ אֵלָ֣י/ו כַּפֶּֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/011/013.yaml
  text: If you prepare your heart and stretch out your hands to him,[a]
translation:
  language: te
  text: నీవు నీ హృదయాన్ని సిద్ధపరచుకొని, ఆయనవైపు నీ చేతులు చాపితే,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆయనవైపు నీ చేయి చాపితే.’ హీబ్రూలో ‘అరచేయి/చేయి’ అనే నామవాచకం ఏకవచనంలో ఉంది; అయితే ఈ ప్రయోగం సాధారణంగా ప్రార్థనలో చేతులు చాపే భంగిమను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: చాపితే
  rationale: హీబ్రూ షరతార్థక అవ్యయం వాక్యంలోని రెండు క్రియలకూ వర్తిస్తుంది. తెలుగులో సహజమైన షరతు నిర్మాణం కోసం చివరి క్రియకు ‘-తే’ జోడించబడింది.
- source_word: אַתָּה
  choice: నీవు
  rationale: యోబును నేరుగా ఉద్దేశించిన రెండవ పురుష ఏకవచన సర్వనామం; మూలంలోని ఉద్ఘాటనను నిలుపుతుంది.
- source_word: הֲכִינוֹתָ
  choice: సిద్ధపరచుకొని
  rationale: כון హిఫిల్ రూపం దృఢపరచడం, సరిగా అమర్చడం లేదా సిద్ధం చేయడం అనే భావాలను ఇస్తుంది. ‘హృదయాన్ని సిద్ధపరచు’ అనేది అంతరంగాన్ని సిద్ధం చేసుకోవడాన్ని అతిగా వ్యాఖ్యానించకుండా సహజంగా తెలియజేస్తుంది.
- source_word: לִבֶּךָ
  choice: నీ హృదయాన్ని
  rationale: హీబ్రూ ‘హృదయం’ ఆలోచన, సంకల్పం సహా అంతరంగ వ్యక్తిని సూచించగలదు. ‘హృదయం’ అనే మూల రూపకాన్నే నిలుపుతుంది.
- source_word: וּפָרַשְׂתָּ
  choice: చాపితే
  rationale: פרשׂ విస్తరించడం లేదా చాపడం అని అర్థం. ప్రార్థనా భంగిమ సందర్భంలో ‘చేతులు చాపడం’ సహజమైన తెలుగు ప్రయోగం.
- source_word: אֵלָיו
  choice: ఆయనవైపు
  rationale: దిశను సూచించే పూర్వప్రత్యయంతో కూడిన పురుష ఏకవచన సర్వనామం. సందర్భంలోని దేవుని సూచిస్తూ, మూలంలో లేని ‘దేవుడు’ అనే నామాన్ని చేర్చకుండా గౌరవార్థక సర్వనామంతో దిశను నిలుపుతుంది.
- source_word: כַּפֶּךָ
  choice: నీ చేతులు
  rationale: మూలంలో ‘అరచేయి/చేయి’ ఏకవచన రూపం ఉన్నా, ప్రార్థనలో చేతులు చాపే సాధారణ భంగిమను తెలుగులో సహజంగా తెలియజేయడానికి బహువచనం వాడబడింది; ప్రత్యక్ష ఏకవచనాన్ని పాదటిప్పణి సూచిస్తుంది.
theological_decisions:
- issue: אֵלָיו లోని సర్వనామం ఎవరిని సూచిస్తుంది?
  choice: ‘ఆయనవైపు’ అని సర్వనామంగానే అనువదించడం
  alternative: స్పష్టత కోసం ‘దేవునివైపు’ అని అనువదించడం
  rationale: సందర్భంలో సూచితుడు దేవుడే అయినా, హీబ్రూ పాఠ్యంలో నామవాచకం కాక సర్వనామమే ఉంది. అందువల్ల సందర్భాన్ని అర్థమయ్యేలా ఉంచుతూ మూలంలోని పరోక్షతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. షరతార్థాన్ని తెలుగులో వాక్యాంత క్రియ ద్వారా వ్యక్తం చేసి, సమన్విత క్రియకు ‘సిద్ధపరచుకొని’ వాడబడింది. దేవునికి గౌరవార్థకంగా ‘ఆయన’ ఉపయోగించబడింది.
