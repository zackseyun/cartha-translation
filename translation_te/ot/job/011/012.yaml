  edition: WLC
  text: וְ/אִ֣ישׁ נָ֭בוּב יִלָּבֵ֑ב וְ/עַ֥יִר פֶּ֝֗רֶא אָדָ֥ם יִוָּלֵֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/job/011/012.yaml
  text: But an empty-headed man will gain understanding when a wild donkey’s colt is born a man[a][b].
translation:
  language: te
  text: కాని బుద్ధిహీనుడైన మనిషి వివేకం పొందేది అడవి గాడిద పిల్ల మనిషిగా పుట్టినప్పుడే[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “బోలుగా ఉన్న మనిషి హృదయం పొందుతాడు.” ఇక్కడ “హృదయం పొందడం” అంటే బుద్ధి లేదా వివేకం పొందడం.
    reason: lexical_alternative
  - marker: b
    text: 'ఈ పాదం వ్యంగ్యోక్తి కావచ్చు: అడవి గాడిద పిల్ల మనిషిగా పుట్టడం ఎంత అసాధ్యమో, బుద్ధిహీనుడు వివేకవంతుడు కావడం కూడా అంతే అసాధ్యమని భావం.'
    reason: alternative_reading
lexical_decisions:
- source_word: אִישׁ
  choice: మనిషి
  rationale: సామెతసదృశమైన సాధారణ వాక్యంలో ఒక మానవ వ్యక్తిని సూచిస్తుంది; సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: נָבוּב
  choice: బుద్ధిహీనుడైన
  rationale: అక్షరార్థంగా ‘బోలుగా/ఖాళీగా ఉన్న’ అనే భావం; ఇక్కడ రూపకంగా వివేకం లేని వ్యక్తిని సూచిస్తుంది.
- source_word: יִלָּבֵב
  choice: వివేకం పొందేది
  rationale: అక్షరార్థంగా ‘హృదయం పొందడం’; హీబ్రూ నుడికారంలో బుద్ధి లేదా వివేకం సంపాదించడమనే అర్థం.
- source_word: וְ
  choice: కాని
  rationale: సందర్భంలోని వ్యంగ్యభరితమైన వైరుధ్యాన్ని తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: עַיִר פֶּרֶא
  choice: అడవి గాడిద పిల్ల
  rationale: అడవి గాడిదకు పుట్టిన చిన్నదాన్ని సూచించే నిర్మాణాన్ని స్పష్టంగా, సహజంగా అందిస్తుంది.
- source_word: אָדָם
  choice: మనిషి
  rationale: జంతువుకు విరుద్ధంగా మానవుడిని సూచించే ఏకవచన నామవాచకం.
- source_word: יִוָּלֵד
  choice: పుట్టినప్పుడు
  rationale: నిఫాల్ క్రియ యొక్క ‘పుట్టడం’ అనే అర్థాన్ని అసాధ్యమైన షరతును సూచించే తెలుగు నిర్మాణంలో అందిస్తుంది.
theological_decisions:
- issue: సామెతలోని వ్యంగ్యం మరియు అసాధ్యత
  choice: బుద్ధిహీనుడు వివేకం పొందడం అడవి గాడిద పిల్ల మనిషిగా పుట్టినప్పుడే జరుగుతుందనే వ్యంగ్యోక్తిగా అనువదించబడింది.
  alternative: ‘బుద్ధిహీనుడు వివేకం పొందుతాడు; అడవి గాడిద పిల్ల మనిషిగా పుడుతుంది’ అని తక్కువ వివరణాత్మకంగా సమాంతర వాక్యాలుగా అనువదించడం.
  rationale: హీబ్రూ వాక్యం సంక్షిప్తంగా, క్లిష్టంగా ఉన్నప్పటికీ, సమాంతర నిర్మాణం అసాధ్యమైన పోలికను బలంగా సూచిస్తుంది. ‘అప్పుడే’ ఆ వ్యంగ్య తర్కాన్ని సహజమైన తెలుగులో వెల్లడిస్తుంది; పాదటిప్పణి ఈ వ్యాఖ్యాన స్వభావాన్ని తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. మూలంలోని ‘బోలు’ అనే రూపకాన్ని ప్రధాన వాక్యంలో ‘బుద్ధిహీనుడు’గా అర్థస్పష్టంగా అందించి, అక్షరార్థాన్ని పాదటిప్పణిలో నిలిపాం. వ్యంగ్యాన్ని ‘అప్పుడే’ ద్వారా స్పష్టం చేసినా, దాని వ్యాఖ్యాన స్వభావాన్ని పాదటిప్పణిలో సూచించాం.
