  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּי ה֭וּא יָדַ֣ע מְתֵי שָׁ֑וְא וַ/יַּרְא אָ֝֗וֶן וְ/לֹ֣א יִתְבּוֹנָֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/011/011.yaml
  text: For he knows men of falsehood; when he sees wickedness[a], does he not take notice?
translation:
  language: te
  text: 'ఎందుకంటే మోసపూరితులైన మనుషులు ఆయనకు తెలుసు;

    దుష్టత్వాన్ని ఆయన చూసినప్పుడు, దాన్ని గమనించకుండా ఉంటాడా?[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆయన దుష్టత్వాన్ని చూస్తాడు, దానిని గమనించడు.” హీబ్రూ చివరి ఉపవాక్యాన్ని సాధారణ నిషేధ వాక్యంగా కూడా చదవవచ్చు; అయితే సందర్భం “దాన్ని గమనించకుండా ఉంటాడా?” అనే అలంకార ప్రశ్నను బలంగా సమర్థిస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: జోఫరు ముందుగా చెప్పిన మాటకు కారణాన్ని పరిచయం చేస్తుంది; ఆధునిక తెలుగులో వాదనా ప్రవాహానికి సహజంగా సరిపోతుంది.
- source_word: הוּא
  choice: ఆయన
  rationale: సందర్భంలో దేవుణ్ణి సూచిస్తుంది; గౌరవప్రదమైన తెలుగు సర్వనామం సహజం.
- source_word: יָדַע
  choice: తెలుసు
  rationale: Qal perfect ఇక్కడ దేవుని స్థిరమైన, సమగ్ర జ్ఞానాన్ని సాధారణ సత్యంగా వ్యక్తం చేస్తుంది.
- source_word: מְתֵי שָׁוְא
  choice: వ్యర్థులైన మనుషులు
  rationale: שָׁוְא లోని వ్యర్థత, అసత్యం, విలువలేమి అనే భావపరిధిని సంక్షిప్తంగా నిలుపుతుంది; ‘మోసగాళ్లు’ అని అనవసరంగా కుదించదు.
- source_word: וַיַּרְא
  choice: ఆయన చూసినప్పుడు
  rationale: తరువాతి అలంకార ప్రశ్నతో ఉన్న సంబంధాన్ని తెలుగులో సహజమైన కాలవాచక ఉపవాక్యంగా తెలియజేస్తుంది.
- source_word: אָוֶן
  choice: దుష్టత్వం
  rationale: ఇక్కడ నైతిక చెడును సూచించే భావం సందర్భానికి తగినది; ‘కష్టం’ అనే సాధ్యమైన భావాన్ని సందర్భం సమర్థించదు.
- source_word: וְלֹא יִתְבּוֹנָן
  choice: దాన్ని గమనించకుండా ఉంటాడా?
  rationale: התבונן లోని శ్రద్ధగా పరిశీలించడం లేదా గమనించడం అనే భావాన్ని సహజమైన తెలుగు అలంకార ప్రశ్నగా అందిస్తుంది.
theological_decisions:
- issue: וְלֹא יִתְבּוֹנָן అనే చివరి ఉపవాక్యపు బలం
  choice: “దాన్ని గమనించకుండా ఉంటాడా?” అనే అలంకార ప్రశ్నగా అనువదించడం
  alternative: “అయినా ఆయన గమనించడు” అనే సాధారణ నిషేధ వాక్యంగా అనువదించడం
  rationale: హీబ్రూ రూపం సాధారణ నిషేధ వాక్యాన్ని అనుమతించినా, దేవుడు వ్యర్థులైన మనుషులను ఎరుగుతాడనీ దుష్టత్వాన్ని చూస్తాడనీ జోఫరు చేస్తున్న వాదనలో అలంకార ప్రశ్న మెరుగ్గా సరిపోతుంది. నిజమైన వ్యాకరణ అస్పష్టతను పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. కవితా సమాంతరత్వాన్ని రెండు పాదాలుగా ఉంచి, హీబ్రూలోని చివరి ఉపవాక్యపు అస్పష్టతను పాదసూచికలో సంరక్షించాం.
