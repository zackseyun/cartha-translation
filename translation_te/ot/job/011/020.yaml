source:
  edition: WLC
  text: וְ/עֵינֵ֥י רְשָׁעִ֗ים תִּ֫כְלֶ֥ינָה וּ֭/מָנוֹס אָבַ֣ד מִנְ/הֶ֑ם וְ֝/תִקְוָתָ֗/ם מַֽפַּח נָֽפֶשׁ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/job/011/020.yaml
  text: But the eyes of the wicked will fail[a], and refuge will perish from them, and their hope will be the breathing out of life.
translation:
  language: te
  text: 'కాని దుష్టుల కళ్లు క్షీణిస్తాయి;

    వారికి తప్పించుకునే మార్గం లేకుండా పోతుంది;

    వారి ఆశ చివరి ఊపిరే అవుతుంది.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పదబంధం క్లిష్టమైనది. అక్షరార్థానికి దగ్గరగా ఇది “ప్రాణం విడిచే ఊపిరి” అనే భావాన్ని ఇస్తుంది; మరణించే వేళ విడిచే చివరి ఊపిరిని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵינֵי רְשָׁעִים
  choice: దుష్టుల కళ్లు
  rationale: ‘దుష్టుల కళ్లు’ అనే హీబ్రూ రూపకాన్ని యథాతథంగా నిలుపుతూ, నెరవేరని నిరీక్షణతో చూపు క్షీణించే భావానికి సందర్భం కల్పిస్తుంది.
- source_word: תִּכְלֶינָה
  choice: క్షీణిస్తాయి
  rationale: כלה అనే క్రియ ఇక్కడ కళ్లను కర్తగా తీసుకొని అవి అలసిపోవడం, విఫలమవడం లేదా మసకబారడం అనే భావాన్ని ఇస్తుంది. ‘క్షీణిస్తాయి’ హీబ్రూ రూపకాన్ని అతిగా వివరించకుండా సహజమైన తెలుగులో అందిస్తుంది.
- source_word: מָנוֹס אָבַד מִנְהֶם
  choice: వారికి తప్పించుకునే మార్గం లేకుండాపోతుంది
  rationale: מָנוֹס పారిపోవడానికి లేదా తప్పించుకోవడానికి ఉన్న మార్గం/అవకాశాన్ని సూచిస్తుంది. ‘ఆశ్రయం’ కంటే ‘తప్పించుకునే మార్గం’ ఈ సందర్భంలోని భావాన్ని స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది; אָבַד యొక్క నశించిపోవు భావాన్ని ‘లేకుండాపోతుంది’ అందిస్తుంది.
- source_word: תִקְוָתָם
  choice: వారి ఆశ
  rationale: תקוה యొక్క సాధారణ అర్థమైన ఆశ లేదా ఎదురుచూపును సంక్షిప్తంగా నిలుపుతుంది.
- source_word: מַפַּח נָפֶשׁ
  choice: చివరి ఊపిరి
  rationale: ఈ క్లిష్టమైన పదబంధం ప్రాణం ఊదివిడవడం లేదా మరణించే ఊపిరి అనే దృశ్యాన్ని కలిగిస్తుంది. ‘చివరి ఊపిరి’ మరణ చిత్రాన్ని నిలుపుతూ ఆధునిక తెలుగులో సహజంగా ఉంటుంది.
theological_decisions:
- issue: מַפַּח נָפֶשׁ అనే క్లిష్టమైన ముగింపు పదబంధం
  choice: వారి ఆశ చివరి ఊపిరే అవుతుంది
  alternative: వారి ఆశ ప్రాణం విడవడమే
  rationale: హీబ్రూలో స్పష్టమైన అనుసంధాన క్రియ లేకపోయినా, ‘వారి ఆశ’ను ‘చివరి ఊపిరి’తో సమీకరించే కఠినమైన కవితా భావాన్ని నిలిపాం. ‘ప్రాణం విడవడమే’ భావాన్ని మరింత స్పష్టీకరిస్తుంది కానీ మూలంలోని ఊపిరి చిత్రాన్ని కొంత తగ్గిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కవితా ధోరణి పాటించబడింది. సమాంతర నిర్మాణాన్ని చూపేందుకు మూడు పాదాలుగా అమర్చాం. ‘కళ్లు క్షీణిస్తాయి’ మరియు ‘చివరి ఊపిరి’ ద్వారా మూలంలోని దృశ్యభాషను నిలుపుతూ, సాధారణ పాఠకులకు అర్థమయ్యే పదజాలాన్ని వాడాం.
