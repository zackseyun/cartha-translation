lexical_decisions:
- source_word: רָבַצְתָּ
  choice: పడుకొని విశ్రమిస్తావు
  rationale: רבץ అనే క్రియ యొక్క పడుకోవడం/సురక్షితంగా విశ్రమించడం అనే స్పష్టమైన దృశ్యాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: מַחֲרִיד
  choice: భయపెట్టేవాడు
  rationale: హిఫీల్ భావంలోని ‘వణికించేవాడు, భయపెట్టేవాడు’ అనే అర్థాన్ని కర్తృవాచకంగా తెలియజేస్తుంది.
- source_word: חִלּוּ פָנֶיךָ
  choice: నీ అనుగ్రహాన్ని వేడుకుంటారు
  rationale: అక్షరార్థంగా ‘నీ ముఖాన్ని వేడుకుంటారు’ అనే హీబ్రూ నుడికారానికి సహజమైన తెలుగు సమానార్థకం; ఒకరి అనుకూలతను వినయంగా కోరడాన్ని సూచిస్తుంది.
- source_word: רַבִּים
  choice: అనేకులు
  rationale: పెద్ద సంఖ్యలో మనుషులను సూచించే సరళమైన, గౌరవప్రదమైన తెలుగు పదం.
- source_word: וְאֵין
  choice: ఎవడూ ఉండడు
  rationale: అస్తిత్వ నిరాకరణను సహజమైన తెలుగు వాక్యనిర్మాణంలో నిలుపుతుంది.
