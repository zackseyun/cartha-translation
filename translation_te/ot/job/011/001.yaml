translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. హీబ్రూ సూత్రప్రాయమైన ‘జవాబిచ్చి చెప్పాడు’ను పదేపదే అనువదించకుండా, అర్థాన్ని నిలుపుతూ ‘ఇలా జవాబిచ్చాడు’గా ఇచ్చాం.
