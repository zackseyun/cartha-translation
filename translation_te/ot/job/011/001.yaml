  language: en
  yaml_path: translation/ot/job/011/001.yaml
  text: 'Then Zophar the Naamathite answered and said:'
translation:
  language: te
  text: 'అప్పుడు నయమాతీయుడైన సోఫరు జవాబిచ్చి ఇలా అన్నాడు:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן
  choice: జవాబిచ్చాడు
  rationale: ענה అనే క్రియ ఈ సంభాషణాత్మక కథన సూత్రంలో ‘జవాబివ్వడం’ అనే అర్థాన్ని ఇస్తుంది. ఆధునిక తెలుగులో ‘జవాబిచ్చాడు’ సహజంగా ఉండి, సంభాషణలో ప్రతిస్పందనను స్పష్టంగా తెలియజేస్తుంది.
- source_word: צֹפַר
  choice: జోఫరు
  rationale: హీబ్రూ వ్యక్తిపేరు צֹפַר ను తెలుగు బైబిలు నామరూప సంప్రదాయానికి అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: הַנַּעֲמָתִי
  choice: నయమాతీయుడైన
  rationale: ఈ స్థానసంబంధ విశేషణం నయమా ప్రాంతానికి చెందినవాడని లేదా దానితో సంబంధం ఉన్నవాడని సూచిస్తుంది. ‘నయమాతీయుడైన’ మూలంలోని జెంటిలిక్ రూపాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: וַיֹּאמַר
  choice: ఇలా
  rationale: హీబ్రూ వాక్యారంభ సూత్రంలోని ‘జవాబిచ్చి చెప్పాడు’ అనే జంట క్రియలను తెలుగులో యథాతథంగా ఉంచితే భారంగా ఉంటుంది. తదుపరి ప్రత్యక్ష ప్రసంగాన్ని పరిచయం చేసే ‘ఇలా జవాబిచ్చాడు’ సహజంగా ఉండి, రెండు క్రియల సంభాషణాత్మక పనిని కలిపి తెలియజేస్తుంది.
