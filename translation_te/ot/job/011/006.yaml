source:
  edition: WLC
  text: וְ/יַגֶּד לְ/ךָ֨ תַּֽעֲלֻמ֣וֹת חָכְמָה֮ כִּֽי כִפְלַ֪יִם לְֽ/ת֫וּשִׁיָּ֥ה וְ/דַ֡ע כִּֽי יַשֶּׁ֥ה לְ/ךָ֥ אֱ֝ל֗וֹהַ מֵ/עֲוֺנֶֽ/ךָ־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/011/006.yaml
  text: and would tell you the hidden things of wisdom[a], for sound wisdom has two sides. Know, then[c][b], that God has overlooked some of your iniquity.
translation:
  language: te
  text: జ్ఞానంలోని నిగూఢ విషయాలను[a] ఆయన నీకు తెలియజేస్తే బాగుండేది! ఎందుకంటే సమర్థమైన జ్ఞానానికి రెండు పార్శ్వాలున్నాయి.[b] కాబట్టి, దేవుడు నీ దోషంలో కొంతను పట్టించుకోకుండా వదిలేశాడని తెలుసుకో.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘జ్ఞాన రహస్యాలను.’
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘సమర్థమైన జ్ఞానానికి అది రెండింతలు.’ ఈ హీబ్రూ పదబంధం జ్ఞానం పైకి కనిపించేదానికంటే ఎక్కువ పార్శ్వాలు గలదని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘దేవుడు నీ దోషంలో కొంతను మరచిపోయాడు’; లేదా, ‘నీ అపరాధానికి తగినదానికంటే తక్కువనే దేవుడు నీ నుంచి వసూలు చేస్తున్నాడు.’ ఇక్కడి హీబ్రూ క్రియ అర్థం క్లిష్టమైనది.
    reason: alternative_reading
lexical_decisions:
- source_word: וְיַגֶּד לְךָ
  choice: ఆయన నీకు తెలియజేస్తే బాగుండేది
  rationale: נגד హిఫిల్ రూపం ‘తెలియజేయడం/ప్రకటించడం’ అని అర్థం. ముందటి వచనంలో కొనసాగుతున్న జోఫరు కోరికను తెలుగులో సహజంగా వ్యక్తం చేయడానికి షరతు-కోరిక రూపాన్ని వాడాం.
- source_word: תַּעֲלֻמוֹת חָכְמָה
  choice: జ్ఞానంలోని నిగూఢ విషయాలు
  rationale: תעלמות దాచబడిన లేదా అంతుచిక్కని విషయాలను సూచిస్తుంది. బహువచనాన్నీ, ‘జ్ఞానానికి చెందినవి’ అనే సంబంధాన్నీ నిలిపాం.
- source_word: כִפְלַיִם לְתוּשִׁיָּה
  choice: నిజమైన జ్ఞానానికి రెండు పార్శ్వాలు ఉన్నాయి
  rationale: כפלים లోని ద్విత్వ భావాన్ని ‘రెండు పార్శ్వాలు’గా నిలిపాం. תושיה అనే క్లిష్టమైన జ్ఞానపదాన్ని ఈ సందర్భంలో ‘నిజమైన జ్ఞానం’గా సహజంగా అనువదించాం; పదబంధపు అక్షరార్థాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: וְדַע
  choice: కాబట్టి ... తెలుసుకో
  rationale: ఆజ్ఞార్థక రూపాన్ని నిలుపుతూ, ముందున్న మాటనుంచి వచ్చే నిర్ధారణను ‘కాబట్టి’ తెలియజేస్తుంది.
- source_word: יַשֶּׁה לְךָ אֱלוֹהַ מֵעֲוֺנֶךָ
  choice: దేవుడు నీ దోషంలో కొంత భాగాన్ని పట్టించుకోకుండా వదిలేశాడు
  rationale: נשה అనే క్రియ ఇక్కడ క్లిష్టమైనది; ‘మరచిపోవడం’ అనే మూలభావం ఉన్నా, సందర్భంలో జోఫరు ఉద్దేశం దేవుడు యోబు దోషానికి తగిన శిక్ష అంతటినీ విధించలేదన్నది. מן ను భాగార్థకంగా ‘కొంత భాగం’ అని అనువదించాం; ఇతర సాధ్యార్థాలను పాదసూచికలో నిలిపాం.
theological_decisions:
- issue: యోబు దోషాన్ని దేవుడు ఎలా పరిగణించాడన్న జోఫరు వాదన
  choice: దేవుడు యోబు దోషంలో కొంత భాగాన్ని పట్టించుకోకుండా వదిలేశాడని జోఫరు అంటున్నట్లు అనువదించడం
  alternative: దేవుడు నీ దోషంలో కొంత భాగాన్ని మరచిపోయాడు; లేదా నీ అపరాధం కోరే శిక్షకంటే తక్కువనే నీ నుంచి వసూలు చేస్తున్నాడు
  rationale: ఇది జోఫరు చేసిన ఆరోపణ; అనువాదం దానిని గ్రంథకర్త ఆమోదించిన సిద్ధాంతంగా చూపదు. క్లిష్టమైన హీబ్రూ క్రియ వల్ల ఏర్పడే ప్రత్యామ్నాయ అర్థాలను పాదసూచికలో వెల్లడించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని వాడాం. ముందటి వచనంలోని కోరిక-సందర్భాన్ని కొనసాగించాం. జోఫరు మాటను అతని వాదనగానే ఉంచి, దానికి అనువాదకుని సిద్ధాంతపరమైన ఆమోదం జోడించలేదు.
