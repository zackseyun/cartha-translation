translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కవితా శైలిని ఉపయోగించాం. హీబ్రూ మూలంలోని వెలుగు–చీకటి వ్యతిరేకతను, ‘పైకి లేస్తుంది’ అనే రూపకాన్ని నిలిపి, అరుదైన పదంలోని అనిశ్చితిని పాదటిప్పణిలో తెలిపాం.
