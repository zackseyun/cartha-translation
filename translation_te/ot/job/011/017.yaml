  yaml_path: translation/ot/job/011/017.yaml
  text: And your lifetime will rise brighter than noon[a]; though there is darkness[c][b], it will become like the morning.
translation:
  language: te
  text: 'నీ జీవితకాలం[b] మధ్యాహ్నం కంటే ప్రకాశవంతంగా పైకి లేస్తుంది[a];

    చీకటి కమ్మినా[c], అది ఉదయంలా అవుతుంది.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీ జీవితం మధ్యాహ్నం కంటే ప్రకాశవంతంగా ఉంటుంది; చీకటి ఉదయంలా అవుతుంది.” ముఖ్యంగా రెండవ పాదంలో హీబ్రూ కవితా వ్యక్తీకరణలు సంక్షిప్తంగా ఉన్నాయి.
    reason: alternative_reading
  - marker: b
    text: “జీవితకాలం” అని అనువదించిన హీబ్రూ పదానికి “జీవితం” లేదా మరింత విస్తృతంగా “భూమిమీద ఒకరి ఉనికి” అనే అర్థాలు కూడా ఉండవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: “చీకటి” అని అనువదించిన అరుదైన హీబ్రూ పదం అర్థం అనిశ్చితం; “మబ్బు చీకటి” లేదా “మసక” అనే అర్థాలు కూడా ప్రతిపాదించబడ్డాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִצָּהֳרַיִם
  choice: మధ్యాహ్నం కంటే ప్రకాశవంతంగా
  rationale: మִן అనే విభక్తి ఇక్కడ పోలికను సూచించగలదు. సందర్భంలోని వెలుగు చిత్రణను సహజమైన తెలుగులో తెలియజేయడానికి ‘మధ్యాహ్నం కంటే ప్రకాశవంతంగా’ అని అనువదించాం.
- source_word: יָקוּם
  choice: పైకి లేస్తుంది
  rationale: קוּם పదంలోని ‘లేచుట/పైకి రావుట’ అనే కవితాత్మక రూపకాన్ని నిలిపి ఉంచుతుంది.
- source_word: חָלֶד
  choice: నీ జీవితకాలం
  rationale: ఈ పదం జీవితకాలం, జీవితం, లేదా భూమిమీద గడిచే ఉనికిని సూచించగలదు. ఇక్కడ కాలవ్యాప్తిని స్పష్టంగా చూపడానికి ‘జీవితకాలం’ ఎంచుకున్నాం.
- source_word: תָּעֻפָה
  choice: చీకటి కమ్మినా
  rationale: అరుదైన, అర్థం అనిశ్చితమైన ఈ పదాన్ని తరువాతి ‘ఉదయం’తో ఉన్న వ్యతిరేకత ఆధారంగా ‘చీకటి’గా తీసుకున్నాం. కవితలో అంతర్లీనంగా ఉన్న concessive భావాన్ని తెలుగులో ‘కమ్మినా’తో వ్యక్తం చేశాం.
- source_word: כַּבֹּקֶר
  choice: ఉదయంలా
  rationale: כְּ సూచించే ఉపమానాన్ని, בֹּקֶר యొక్క సాధారణ అర్థమైన ‘ఉదయం’ను నేరుగా నిలిపాం.
- source_word: תִּהְיֶה
  choice: అవుతుంది
  rationale: היה సాధారణంగా ‘ఉండు’ అని అర్థమైనా, ఇక్కడ చీకటి ఉదయంలా మారే భావాన్ని సహజంగా వ్యక్తం చేయడానికి ‘అవుతుంది’ అనువైనది.
