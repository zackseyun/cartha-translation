translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, గౌరవప్రదమైన మరియు సహజమైన శైలిని వాడాం. חפרలోని నిజమైన పదార్థ అనిశ్చితిని పాదటిప్పణిలో సంరక్షించాం.
