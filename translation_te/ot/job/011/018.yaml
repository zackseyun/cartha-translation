  yaml_path: translation/ot/job/011/018.yaml
  text: And you will be secure[a], because there is hope; you will look around and lie down in safety.
translation:
  language: te
  text: ఆశ ఉంది కాబట్టి నీవు ధైర్యంగా ఉంటావు; నీవు చుట్టూ చూసి[a] సురక్షితంగా పడుకుంటావు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘తవ్వుతావు.’ ఈ హీబ్రూ క్రియ సాధారణంగా తవ్వడాన్ని సూచిస్తుంది; ఇక్కడ పడుకునే ముందు చుట్టూ వెదకడం, పరిశీలించడం లేదా స్థలాన్ని సిద్ధం చేసుకోవడం అనే భావం ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָטַחְתָּ
  choice: నీవు నిశ్చింతగా ఉంటావు
  rationale: בטח ఇక్కడ ఆశ ఉన్నందువల్ల కలిగే భద్రత, ధైర్యం లేదా నిశ్చింత స్థితిని సూచిస్తుంది. ఆధునిక తెలుగులో ‘నిశ్చింతగా ఉంటావు’ ఈ సందర్భార్థాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: כִּי יֵשׁ תִּקְוָה
  choice: ఆశ ఉంది కాబట్టి
  rationale: תִּקְוָה అంటే ‘ఆశ’ లేదా ‘నిరీక్షణ’; כִּי యొక్క కారణార్థాన్ని ‘కాబట్టి’ స్పష్టంగా నిలుపుతుంది.
- source_word: וְחָפַרְתָּ
  choice: నీవు చుట్టూ పరిశీలించుకొని
  rationale: חפר యొక్క సాధారణ ప్రత్యక్షార్థం ‘తవ్వడం’; అయితే ఈ సందర్భంలో పడుకునే ముందు పరిసరాలను వెదకడం, పరిశీలించడం లేదా స్థలాన్ని సిద్ధం చేసుకోవడం అనే భావం ఉండవచ్చు. ప్రధాన పాఠంలో సందర్భానికి సహజమైన అర్థాన్ని ఉంచి, ప్రత్యక్షార్థాన్ని పాదటిప్పణిలో నిలిపాం.
- source_word: לָבֶטַח
  choice: సురక్షితంగా
  rationale: ఈ క్రియావిశేషణ ప్రయోగం భద్రతతో, ప్రమాదభయం లేకుండా ఉండడాన్ని సూచిస్తుంది; ‘పడుకుంటావు’తో ‘సురక్షితంగా’ సహజంగా సరిపోతుంది.
- source_word: תִּשְׁכָּב
  choice: పడుకుంటావు
  rationale: שׁכב యొక్క స్పష్టమైన భౌతిక భావం ‘పడుకోవడం’; ‘విశ్రాంతి తీసుకుంటావు’ కంటే ఇది మూలంలోని దృశ్యాన్ని నేరుగా నిలుపుతుంది.
