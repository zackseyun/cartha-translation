    issue: “పెదవుల మనిషి” is an overly literal, unnatural Telugu construction.
    rationale: Although it mirrors Hebrew אִישׁ שְׂפָתַיִם, it does not function naturally as an intelligible Telugu idiom. “మాటలవాడు,” with a literal-image footnote, conveys the idiom faithfully and naturally.
