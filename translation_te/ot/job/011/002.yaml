  naturalness: A modest revision makes both questions idiomatic modern standard Telugu while retaining the Hebrew rhetorical force. “మాటలవాడు” is a natural Telugu idiom for a person characterized by talk; the footnote preserves the literal Hebrew image and its likely critical implication.
  terminology: “సరైనవాడిగా తేలాలా?” accurately renders the contextual sense of יִצְדָּק without importing theological terminology. The note appropriately identifies the literal expression and preserves the alternative “నీతిమంతుడిగా తీర్చబడాలా?” only as an alternative, not as the main rendering.
  issues:
