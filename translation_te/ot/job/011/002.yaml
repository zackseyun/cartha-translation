source:
  edition: WLC
  text: הֲ/רֹ֣ב דְּ֭בָרִים לֹ֣א יֵעָנֶ֑ה וְ/אִם אִ֖ישׁ שְׂפָתַ֣יִם יִצְדָּֽק־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/011/002.yaml
  text: Should a multitude of words go unanswered[a], and should a man of lips be proved right?
translation:
  language: te
  text: ఇన్ని మాటలకు జవాబు చెప్పకుండా ఉండాలా? మాటలవాడు సరైనవాడిగా తేలాలా?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘పెదవుల మనిషి.’ ఈ హీబ్రూ నుడికారం మాటలతో లక్షణీకరించబడిన వ్యక్తిని, బహుశా అతిగా లేదా వట్టి మాటలు మాట్లాడేవాణ్ణి, సూచిస్తుంది. చివరి పదబంధాన్ని ‘నీతిమంతుడిగా తీర్చబడాలా?’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲרֹב דְּבָרִים
  choice: మాటల విస్తారం
  rationale: רֹב דְּבָרִים మాటల అధిక పరిమాణాన్ని సూచిస్తుంది. ‘మాటల విస్తారం’ హీబ్రూ కవితాత్మక భావాన్ని, మితిమీరిన మాటల సూచనను నిలుపుతుంది.
- source_word: לֹא יֵעָנֶה
  choice: జవాబు పొందకుండా పోవాలా
  rationale: ענה నిఫాల్ రూపంలోని ‘జవాబు ఇవ్వబడుట’ అనే నిష్క్రియార్థాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తూ, అలంకారప్రశ్న బలాన్ని కాపాడుతుంది.
- source_word: וְאִם
  choice: …ఆలా?
  rationale: ఇక్కడ וְאִם షరతును మాత్రమే కాక సమాంతర అలంకారప్రశ్నను ప్రవేశపెడుతుంది. తెలుగులో రెండవ ప్రశ్నగా సహజంగా వ్యక్తం చేయబడింది.
- source_word: אִישׁ שְׂפָתַיִם
  choice: పెదవుల మనిషి
  rationale: అక్షరార్థ చిత్రాన్ని నిలుపుతూ, మాటలతో—బహుశా అతిగా లేదా వట్టి మాటలతో—లక్షణీకరించబడిన వ్యక్తి అనే హీబ్రూ నుడికారాన్ని సంరక్షిస్తుంది.
- source_word: יִצְדָּק
  choice: తాను సరైనవాడని నిరూపించబడాలా
  rationale: צדק ఖాల్ రూపం ఇక్కడ న్యాయనిర్ణయాత్మకంగా ‘సరైన పక్షంలో ఉన్నవాడిగా తేలడం’ అనే భావం ఇస్తుంది. ‘నీతిమంతుడని తీర్చబడటం’ వంటి తరువాతి సిద్ధాంతార్థాన్ని అనవసరంగా దిగుమతి చేయదు.
theological_decisions:
- issue: יִצְדָּק లోని న్యాయనిర్ణయాత్మక భావం
  choice: తాను సరైనవాడని నిరూపించబడాలా
  alternative: నీతిమంతుడని తీర్చబడాలా
  rationale: సందర్భం వాదనలో ఎవరు సరైనవారో తేలడాన్ని సూచిస్తుంది; రక్షణసిద్ధాంత సంబంధమైన ప్రత్యేక అర్థాన్ని ఇక్కడ చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కవితాత్మక అలంకారప్రశ్నను, హీబ్రూ ‘పెదవులు’ అనే చిత్రాన్ని నిలుపుతూ సాధారణ పాఠకులకు అర్థమయ్యే గంభీర శైలి.
