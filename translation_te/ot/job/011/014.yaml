id: JOB.11.14
reference: Job 11:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אִם אָ֣וֶן בְּ֭/יָדְ/ךָ הַרְחִיקֵ֑/הוּ וְ/אַל תַּשְׁכֵּ֖ן בְּ/אֹהָלֶ֣י/ךָ עַוְלָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/011/014.yaml
  text: If iniquity is in your hand[a], put it far away[b], and do not let injustice dwell in your tents.
translation:
  language: te
  text: నీ చేతిలో దుష్టత్వం ఉంటే[a], దాన్ని దూరంగా తొలగించు; నీ గుడారాల్లో[b] అన్యాయం నివసించనివ్వకు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘దుష్టత్వం’ అనే పదానికి ‘కీడు,’ ‘చెడుతనం,’ లేదా ‘హానికరమైన తప్పు’ అనే భావాలు కూడా ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘నీ గుడారాల్లో’ అనేది ఒకరి నివాస పరిధిని లేదా కుటుంబ జీవనాన్ని సూచిస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: אִם
  choice: ఉంటే
  rationale: ఇది షరతును సూచించే పదం. తెలుగు వాక్యనిర్మాణంలో ‘ఉంటే’ సహజంగా ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: אָוֶן
  choice: దుష్టత్వం
  rationale: ఈ పదం కీడు, దుష్టత్వం, హానికరమైన తప్పు అనే భావాలను ఇవ్వగలదు. עַוְלָהతో ఉన్న నైతిక సమాంతరతలో ‘దుష్టత్వం’ తగిన విస్తృత నైతిక భావాన్ని నిలుపుతుంది.
- source_word: בְּיָדְךָ
  choice: నీ చేతిలో
  rationale: హీబ్రూ భాషలోని స్పష్టమైన ‘చేతి’ రూపకాన్ని నిలుపుతూ, వ్యక్తి ఆధీనంలో లేదా ఆచరణలో ఉన్న దుష్టత్వాన్ని సూచిస్తుంది.
- source_word: הַרְחִיקֵהוּ
  choice: దాన్ని దూరంగా తొలగించు
  rationale: హిఫిల్ ఆజ్ఞారూపంలోని క్రియాశీల కారణార్థాన్ని, దూరం చేయాలనే భావాన్ని రెండింటినీ వ్యక్తం చేస్తుంది.
- source_word: וְאַל תַּשְׁכֵּן
  choice: నివసించనివ్వకు
  rationale: שׁכן అనే ‘నివసించు’ క్రియ యొక్క రూపకాన్ని నిలుపుతూ, దానికి చోటివ్వవద్దనే నిషేధార్థాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: בְּאֹהָלֶיךָ
  choice: నీ గుడారాల్లో
  rationale: మూలంలోని బహువచనాన్ని, ప్రాచీన జీవన నేపథ్యంలోని స్పష్టమైన గుడారాల చిత్రాన్ని నిలుపుతుంది.
- source_word: עַוְלָה
  choice: అన్యాయం
  rationale: ఈ పదం అన్యాయం లేదా తప్పైన ప్రవర్తనను సూచిస్తుంది. ముందున్న אָוֶןకు సంబంధితమైనా భిన్నమైన పదంగా ఉంచి కవితాత్మక సమాంతరతను కాపాడుతుంది.
theological_decisions:
- issue: కవితాత్మక సమాంతరతలో నైతిక పదజాలం
  choice: אָוֶןను ‘దుష్టత్వం’గా, עַוְלָהను ‘అన్యాయం’గా సంబంధితమైనా భిన్నమైన పదాలతో అనువదించడం
  alternative: రెండింటినీ ఒకే పదంతో అనువదించడం లేదా రెండింటినీ సాధారణంగా ‘కీడు’ అని ఇవ్వడం
  rationale: హీబ్రూ వాక్యంలో రెండు సమీపార్థక నైతిక పదాలు ఉన్నాయి. వాటి భేదాన్ని నిలుపడం కవితాత్మక వైవిధ్యాన్ని కాపాడుతుంది; అయితే వాటి మధ్య మూలపాఠం నిర్దేశించని సాంకేతిక వేదాంత భేదాన్ని సృష్టించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ఆజ్ఞాత్మక శైలి ఉపయోగించబడింది. ‘చేతిలో,’ ‘గుడారాల్లో,’ ‘నివసించు’ అనే మూలంలోని స్పష్టమైన రూపకాలు నిలుపబడ్డాయి; అవసరమైన సాంస్కృతిక వివరణను పాదటిప్పణిలో ఇచ్చాం.
