  text: וְֽ/אוּלָ֗ם מִֽי יִתֵּ֣ן אֱל֣וֹהַּ דַּבֵּ֑ר וְ/יִפְתַּ֖ח שְׂפָתָ֣י/ו עִמָּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/011/005.yaml
  text: But if only God would speak and open his lips against you,[a]
translation:
  language: te
  text: అయితే, దేవుడు మాట్లాడి, నీతో తన పెదవులను విప్పితే ఎంత బాగుండేది![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నిన్ను ఎదిరించి’ లేదా ‘నీకు వ్యతిరేకంగా’ అని కూడా అనువదించవచ్చు. హీబ్రూ పదం అక్షరార్థంగా ‘నీతో’; ఈ సందర్భంలో అది ఎదుర్కొని మాట్లాడే భావాన్ని కలిగి ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאוּלָם
  choice: అయితే
  rationale: ముందటి మాటకు బలమైన వ్యతిరేక మలుపును సహజమైన ఆధునిక తెలుగులో సూచిస్తుంది.
- source_word: מִי יִתֵּן
  choice: ఎంత బాగుండేది
  rationale: ఇది అక్షరార్థ ప్రశ్న కాకుండా తీవ్రమైన కోరికను తెలిపే హీబ్రూ నుడికారం; తెలుగులో సహజమైన ఆశాభావ నిర్మాణంతో అనువదించబడింది.
- source_word: אֱלוֹהַּ
  choice: దేవుడు
  rationale: ఏ అదనపు దైవబిరుదును చేర్చకుండా ఏకవచన దైవనామాన్ని నేరుగా అందిస్తుంది.
- source_word: דַּבֵּר
  choice: మాట్లాడితే
  rationale: కోరికను తెలిపే నిర్మాణంలో దేవుడు పలకాలని సోఫరు కోరుతున్న భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וְיִפְתַּח שְׂפָתָיו
  choice: తన పెదవులు తెరిస్తే
  rationale: దైవ ప్రసంగాన్ని సూచించే మానవరూప వర్ణనను ‘నోరు’ అని సడలించకుండా మూలంలోని ‘పెదవులు’ రూపకంతోనే నిలుపుతుంది.
- source_word: עִמָּךְ
  choice: నీతో
  rationale: హీబ్రూ ఉపసర్గ యొక్క ప్రాథమిక అర్థాన్ని నిలుపుతూ, సందర్భంలోని ప్రతివాద లేదా ఎదుర్కొనే భావాన్ని పాదటిప్పణిలో తెలియజేస్తుంది.
theological_decisions:
- issue: దేవుని గురించి ‘తన పెదవులు తెరవడం’ అనే మానవరూప భాష
  choice: మానవరూప వ్యక్తీకరణను నేరుగా నిలుపుకోవడం
  alternative: ‘నీతో మాట్లాడడం’ అని మాత్రమే భావానువాదం చేయడం
  rationale: మూలంలోని స్పష్టమైన చిత్రణను కాపాడటం దేవునికి భౌతిక శరీరం ఉందని సిద్ధాంతపరంగా నిర్ణయించదు; ఇది సాధారణ బైబిలీయ అలంకార భాష.
- issue: עִמָּךְ యొక్క సందర్భానుసార బలం
  choice: ప్రధాన పాఠంలో ‘నీతో’; పాదటిప్పణిలో ఎదుర్కొనే భావం
  alternative: ప్రధాన పాఠంలో ‘నీకు వ్యతిరేకంగా’ లేదా ‘నీకు ఎదురు’
  rationale: ఉపసర్గ అక్షరార్థంగా ‘తో’ అని ఉన్నందున నిజమైన పదార్థ సందిగ్ధతను ప్రధాన పాఠంలో నిలిపాం; అయితే సోఫరు దేవుడు యోబును ప్రతివాదించాలని కోరుతున్న సందర్భాన్ని పాదటిప్పణిలో స్పష్టం చేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్యనిర్మాణం. హీబ్రూ కోరిక నుడికారాన్ని సహజమైన తెలుగు ఆశాభావ రూపంలో అందించి, ‘పెదవులు’ అనే మూల చిత్రణను నిలిపాం.
