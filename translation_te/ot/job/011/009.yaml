source:
  edition: WLC
  text: אֲרֻכָּ֣ה מֵ/אֶ֣רֶץ מִדָּ֑/הּ וּ֝/רְחָבָ֗ה מִנִּי יָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/011/009.yaml
  text: Its measure is longer than the earth and broader than the sea[a].
translation:
  language: te
  text: దాని కొలత భూమికంటే పొడవైనది, సముద్రంకంటే వెడల్పైనది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దాని విస్తృతి భూమికంటే పొడవైనది, సముద్రంకంటే విశాలమైనది.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲרֻכָּה
  choice: పొడవైనది
  rationale: ఇది מִדָּהּ అనే స్త్రీలింగ ఏకవచన నామవాచకంతో సరిపోలే విశేషణం. పోలికను తెలుగులో సహజంగా చూపేందుకు ‘భూమికంటే పొడవైనది’ అని అనువదించాం.
- source_word: מֵאֶרֶץ
  choice: భూమికంటే
  rationale: ఇక్కడ מִן వియోగాన్ని కాక పోలికను సూచిస్తుంది. ‘సముద్రం’తో ఉన్న సమాంతర విశ్వవ్యాప్త చిత్రణలో אֶרֶץకు ‘భూమి’ తగిన అర్థం.
- source_word: מִדָּהּ
  choice: దాని కొలత
  rationale: מִדָּה అంటే కొలత, పరిమాణం లేదా విస్తృతి. ‘దాని కొలత’ మూలంలోని స్పష్టమైన నామవాచక రూపాన్నీ, స్త్రీలింగ ఏకవచన ప్రత్యయాన్నీ కాపాడుతుంది; ‘దాని’ అనడం ద్వారా పూర్వపద సూచనను అనవసరంగా నిర్దిష్టం చేయలేదు.
- source_word: וּרְחָבָה
  choice: వెడల్పైనది
  rationale: ఇది אֲרֻכָּהకు సమాంతరమైన స్త్రీలింగ ఏకవచన విశేషణం. ‘సముద్రంకంటే వెడల్పైనది’ అనే రూపం పోలికను స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: מִנִּי יָם
  choice: సముద్రంకంటే
  rationale: מִנִּי అనేది מִן యొక్క కవితాత్మక రూపం; ఇక్కడ పోలికను సూచిస్తుంది. יָםకు ప్రత్యక్షమైన ‘సముద్రం’ అనే అర్థాన్ని నిలిపాం.
theological_decisions:
- issue: ‘దాని’ అనే స్త్రీలింగ ప్రత్యయం దేనిని సూచిస్తుంది?
  choice: పాఠ్యంలో ‘దాని’ అనే అనిర్దిష్ట సూచననే నిలిపాం.
  alternative: ‘జ్ఞానం యొక్క కొలత’ లేదా ‘దేవుని జ్ఞానం యొక్క కొలత’ అని స్పష్టీకరించడం.
  rationale: హీబ్రూ వచనం ప్రత్యయాన్ని మాత్రమే ఇస్తుంది; దాని పూర్వపదాన్ని ఈ వచనంలో పేరుతో మళ్లీ చెప్పదు. సందర్భం దాని సూచనను తెలియజేసినా, అనువాదంలో అదనపు వ్యాఖ్యానాన్ని చేర్చకుండా మూలంలోని సూచనాత్మక స్వభావాన్ని కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, కవితాత్మక సమాంతరతను మరియు గంభీరతను కాపాడుతూ సాధారణ పాఠకులకు సహజంగా ఉండే పదాలను ఉపయోగించాం.
