source:
  edition: WLC
  text: גָּבְהֵ֣י שָׁ֭מַיִם מַה תִּפְעָ֑ל עֲמֻקָּ֥ה מִ֝/שְּׁא֗וֹל מַה תֵּדָֽע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/011/008.yaml
  text: It is higher than the heavens—what can you do? Deeper than Sheol—what can you know?[a]
translation:
  language: te
  text: అది ఆకాశాలకంటే ఎత్తైనది—నీవు ఏమి చేయగలవు? షెయోల్‌కంటే లోతైనది—నీవు ఏమి తెలుసుకోగలవు?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా “సమాధి కంటే లోతైనది,” లేదా “మృతుల లోకం కంటే లోతైనది.” హీబ్రూ: షెయోల్.'
    reason: שְׁאוֹל పదంలోని అర్థ పరిధిని, అనువాద ప్రత్యామ్నాయాలను సంరక్షించడానికి.
lexical_decisions:
- source_word: גָּבְהֵי שָׁמַיִם
  choice: ఆకాశాలకంటే ఎత్తైనది
  rationale: నిర్మాణ పదబంధం అక్షరార్థంగా ‘ఆకాశాల ఎత్తులు’ అని సూచిస్తుంది. సందర్భంలో ముందటి వచనం నుండి కొనసాగుతున్న విషయాన్ని ఉద్దేశించి, తెలుగు కవితా సమాంతరతకు సహజంగా ఉండే తులనాత్మక రూపాన్ని ఎంచుకున్నాం.
- source_word: מַה
  choice: ఏమి
  rationale: రెండు పాదాల్లోనూ అలంకారిక ప్రశ్నను ప్రవేశపెట్టే ప్రశ్నార్థక సర్వనామానికి నేరమైన తెలుగు సమానం.
- source_word: תִּפְעָל
  choice: నీవు ఏమి చేయగలవు
  rationale: פעל క్రియ యొక్క ఖల్ అసంపూర్ణ 2 పురుష ఏకవచన రూపం. ఇక్కడ భవిష్యత్తు చర్యకన్నా మానవ సామర్థ్య పరిమితిని ప్రశ్నిస్తున్నందున ‘చేయగలవు’ అని అనువదించాం.
- source_word: עֲמֻקָּה
  choice: లోతైనది
  rationale: స్త్రీలింగ ఏకవచన విశేషణం; ముందటి సందర్భం నుండి వచ్చిన అంతర్లీన విషయంతో ఏకీభవిస్తుంది. మొదటి పాదంలోని ఎత్తుతో సమాంతరంగా లోతును వ్యక్తపరుస్తుంది.
- source_word: מִשְּׁאוֹל
  choice: పాతాళం కంటే
  rationale: מִן ఇక్కడ తులనను సూచిస్తుంది. שְׁאוֹל కేవలం భౌతిక సమాధిని కాక మృతుల లోకాన్ని సూచించగలందున, తెలుగులో విస్తృత భావం కలిగిన ‘పాతాళం’ను వాడి పాదటిప్పణిలో మూలపదాన్ని తెలిపాం.
- source_word: תֵּדָע
  choice: నీవు ఏమి తెలుసుకోగలవు
  rationale: ידע క్రియ యొక్క ఖల్ అసంపూర్ణ 2 పురుష ఏకవచన రూపం. మొదటి పాదంలోని ‘చేయగలవు’కు సమాంతరంగా, తెలుసుకునే మానవ సామర్థ్య పరిమితిని తెలియజేస్తుంది.
theological_decisions:
- issue: שְׁאוֹל పదం అనువాదం
  choice: పాతాళం
  alternative: సమాధి; మృతుల లోకం; షెయోల్
  rationale: ఈ పదం లోతును సూచించే కవితాత్మక పోలికలో వచ్చింది. ‘సమాధి’ అని మాత్రమే అనడం భావాన్ని భౌతిక ఖనన స్థలానికి పరిమితం చేయవచ్చు; ‘పాతాళం’ మృతుల లోకం అనే విస్తృత భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది. పాదటిప్పణి మూల హీబ్రూ పదాన్నీ ఇతర సాధ్యమైన అర్థాలనూ భద్రపరుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే కవితాత్మక శైలి. రెండు అలంకారిక ప్రశ్నల సమాంతర నిర్మాణం నిలుపబడింది.
