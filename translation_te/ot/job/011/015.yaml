  text: For then you will lift up your face without blemish[b][a]; you will stand firm and will not fear.
translation:
  language: te
  text: ఎందుకంటే అప్పుడు నీవు మచ్చలేకుండా నీ ముఖాన్ని పైకెత్తుతావు[a]; నీవు స్థిరంగా ఉంటావు[b], భయపడవు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘అవమానం లేకుండా తలెత్తుకొని ఉంటావు.’ హీబ్రూలో అక్షరార్థంగా ‘మచ్చలేకుండా నీ ముఖాన్ని పైకెత్తుతావు’ అని ఉంది; ఇది తిరిగి పొందిన ధైర్యం, అవమానం నుంచి విముక్తి అనే రూపకాన్ని కలిగి ఉంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘భద్రంగా ఉంటావు,’ ‘దృఢంగా స్థాపించబడతావు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אָז
  choice: ఎందుకంటే అప్పుడు
  rationale: ముందున్న షరతుకు కలిగే ఫలితాన్ని పరిచయం చేసే కారణార్థక-ఫలితార్థక సంబంధాన్ని, దాని కాలసూచనతో సహా సహజంగా తెలియజేస్తుంది.
- source_word: תִּשָּׂא פָנֶיךָ
  choice: నీ ముఖాన్ని పైకెత్తుతావు
  rationale: హీబ్రూ రూపకాన్ని నిలుపుతూ, తిరిగి పొందిన ధైర్యం మరియు అవమానం నుంచి విముక్తి అనే భావాలకు అవకాశం ఇస్తుంది.
- source_word: מִמּוּם
  choice: మచ్చలేకుండా
  rationale: מוּם అనే పదంలోని మచ్చ లేదా లోపం అనే మూలచిత్రాన్ని కాపాడుతుంది; సందర్భంలో ఇది నైతిక కళంకం లేదా అవమానం లేని స్థితిని రూపకంగా సూచించవచ్చు.
- source_word: מֻצָק
  choice: స్థిరంగా ఉంటావు
  rationale: יצק మూలం నుంచి వచ్చిన ఈ రూపం సూచించే దృఢత్వం, స్థిరపరచబడిన స్థితి, భద్రత అనే భావాలను సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: וְלֹא תִירָא
  choice: భయపడవు
  rationale: భవిష్యత్ నిషేధార్థాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
