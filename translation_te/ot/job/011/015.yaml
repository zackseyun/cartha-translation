  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన కవితాత్మక శైలి. ‘ముఖాన్ని పైకెత్తడం,’ ‘మచ్చ’ అనే హీబ్రూ రూపకాలను ప్రధాన పాఠ్యంలో నిలిపి, వాటి భావార్థాలను పాదటిప్పణిలో ఇచ్చాం.
