  text: וַ֭/תֹּאמֶר זַ֣ךְ לִקְחִ֑/י וּ֝/בַ֗ר הָיִ֥יתִי בְ/עֵינֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/011/004.yaml
  text: For you say[a], ‘My teaching is pure, and I am clean in your eyes.’
translation:
  language: te
  text: 'నీవు ఇలా అంటున్నావు: “నా బోధ స్వచ్ఛమైనది, నీ దృష్టిలో నేను శుద్ధుడిని.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నా ఉపదేశం’ లేదా ‘నా వక్తవ్యము’ అని కూడా అనువదించవచ్చు. హీబ్రూ నామవాచకం ఒకరు నేర్చుకున్న విషయాన్నీ, లేదా బోధనగా/వక్తవ్యంగా ప్రతిపాదించిన విషయాన్నీ సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: అని అంటున్నావు
  rationale: ఇది אמר ధాతువు Qal wayyiqtol, ద్వితీయ పురుష ఏకవచన రూపం. వ్యాకరణపరంగా గతకాల భావం సాధ్యమైనా, యోబు ప్రస్తుతం చేస్తున్న వాదనగా జోఫరు ఆరోపిస్తున్నందున తెలుగు వర్తమాన ప్రయోగం సహజంగా ఉంది.
- source_word: זַךְ
  choice: నిర్మలమైనది
  rationale: ‘పవిత్రమైనది/శుభ్రమైనది/నిర్మలమైనది’ అనే భావం. తరువాతి בַר పదంతో తెలుగు పదభేదాన్ని నిలుపుతూ, ఉపదేశం కల్తీలేనిదని చెప్పే భావానికి ‘నిర్మలమైనది’ సరిపోతుంది.
- source_word: לִקְחִי
  choice: నా ఉపదేశం
  rationale: לקח నామవాచకం నేర్చుకున్న లేదా బోధనగా అందించిన విషయాన్ని సూచించగలదు. ఇక్కడ యోబు ప్రతిపాదించిన అభిప్రాయాల విషయసారాన్ని ‘ఉపదేశం’ సహజంగా వ్యక్తం చేస్తుంది; కేవలం మాట లేదా ప్రసంగం అనే భావానికే పరిమితం చేయదు.
- source_word: וּבַר
  choice: శుద్ధుడిని
  rationale: ‘శుభ్రమైన/శుద్ధమైన’ అనే విశేషణం. ఇది యోబును సూచిస్తున్నందున తెలుగులో పుంలింగ వ్యక్తివాచక రూపం వాడబడింది; זַךְకు వాడిన ‘నిర్మలమైనది’తో పదభేదం కూడా నిలిచింది.
- source_word: הָיִיתִי
  choice: నేను ... శుద్ధుడిని
  rationale: היה ధాతువు perfect 1cs అయినప్పటికీ, ఉటంకించబడిన వాదనలో కొనసాగుతున్న స్థితిని సూచిస్తుంది. అందువల్ల తెలుగులో సహజమైన వర్తమాన నామవాచక వాక్య నిర్మాణం వాడబడింది.
- source_word: בְעֵינֶיךָ
  choice: నీ దృష్టిలో
  rationale: అక్షరార్థంగా ‘నీ కళ్లలో’; ఒకరి అంచనా లేదా తీర్పులో అనే హీబ్రూ నుడికారాన్ని ఆధునిక తెలుగులో ‘నీ దృష్టిలో’ సహజంగా, గౌరవప్రదంగా అందిస్తుంది.
theological_decisions:
- issue: ‘నీ దృష్టిలో’ అన్న ద్వితీయ పురుష ఏకవచన సర్వనామం ఎవరిని సూచిస్తుంది?
  choice: ఉటంకించబడిన యోబు వాదనలో దేవునిని ఉద్దేశించిన మాటగా పాఠ్యంలో వివరణ లేకుండా నిలిపింది.
  alternative: సంభాషణలోని ఎదుటివారిని సాధారణంగా ఉద్దేశించిన మాటగా చదవడం.
  rationale: జోఫరు యోబు దేవుని ఎదుట తాను శుద్ధుడినని చెప్పినట్లుగా సంక్షిప్తంగా ఉటంకిస్తున్నాడు. అయినా మూలపాఠ్యం ‘దేవుడు’ అని స్పష్టంగా చేర్చనందున అనువాదంలో కూడా దానిని చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కవితాత్మక వాదప్రతివాదానికి తగిన గంభీరతను ఉంచుతూ సాధారణ పాఠకులకు అర్థమయ్యే పదజాలం వాడబడింది. ప్రధాన పాఠ్యంలో [a] గుర్తు తప్పనిసరిగా చేర్చబడింది.
