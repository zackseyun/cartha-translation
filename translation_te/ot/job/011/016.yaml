review_pass:
  verdict: revise
  source_fidelity: The draft accurately retains the explanatory כִּי, the explicit second-person address, future sense, and the implied object of ‘remember.’ However, ‘దాటిపోయిన నీళ్లు’ can suggest water that crossed over something, rather than the Hebrew image of waters that have flowed/passed away. ‘ప్రవహించి వెళ్లిపోయిన నీళ్లు’ conveys עָבְרוּ more precisely in this context.
  naturalness: The verse is otherwise clear and idiomatic in modern standard Telugu. ‘నీళ్లవలె’ is slightly more suitable for the elevated poetic register than the colloquial contraction ‘నీళ్లలా,’ while remaining accessible.
  terminology: ‘దుఃఖం’ is an acceptable contextual rendering of עָמָל. No theological terminology is at issue. The supplied object ‘దాన్ని’ naturally refers to the preceding misery and is warranted for Telugu clarity.
  issues:
  - severity: medium
    issue: ‘దాటిపోయిన నీళ్లలా’ is potentially ambiguous.
    rationale: For waters, ‘దాటిపోయిన’ may be understood as having crossed a location. The Hebrew perfect עָבְרוּ in this simile evokes waters that have passed/flowed away; ‘ప్రవహించి వెళ్లిపోయిన’ expresses that image directly.
  revised_text: ఎందుకంటే, నీవు నీ దుఃఖాన్ని మరచిపోతావు; ప్రవహించి వెళ్లిపోయిన నీళ్లవలె దాన్ని జ్ఞాపకం చేసుకుంటావు.[a]
