  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కవితాత్మక శైలి. ‘నీళ్లలా’ సాధారణ పాఠకులకు ‘జలాలవలె’ కంటే సులభంగా అర్థమవుతూ మూల రూపకాన్ని నిలుపుతుంది.
