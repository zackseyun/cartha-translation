  text: For you will forget your misery[a]; you will remember it as waters that have passed by.
translation:
  language: te
  text: ఎందుకంటే, నీవు నీ దుఃఖాన్ని మరచిపోతావు; ప్రవహించి వెళ్లిపోయిన నీళ్లవలె దాన్ని జ్ఞాపకం చేసుకుంటావు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ప్రవహించి వెళ్లిపోయిన నీళ్లలా మాత్రమే దాన్ని జ్ఞాపకం చేసుకుంటావు.” హీబ్రూ రూపకం గత దుఃఖాన్ని అప్పటికే ప్రవహించి వెళ్లిపోయిన నీళ్లతో పోలుస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందున్న వాగ్దానానికి కారణం లేదా వివరణను పరిచయం చేసే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: אַתָּה
  choice: నీవు
  rationale: హీబ్రూలో స్పష్టంగా ఉన్న ద్వితీయ పురుష ఏకవచన సర్వనామపు నొక్కిచెప్పే భావాన్ని నిలుపుతుంది.
- source_word: עָמָל
  choice: దుఃఖం
  rationale: ఈ సందర్భంలో శ్రమకన్నా అనుభవిస్తున్న బాధ, కష్టం అనే విస్తృత భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: תִּשְׁכָּח
  choice: మరచిపోతావు
  rationale: సందర్భంలో భవిష్యత్ భావమున్న Qal imperfect ద్వితీయ పురుష ఏకవచన రూపాన్ని నేరుగా అందిస్తుంది.
- source_word: כְמַיִם
  choice: నీళ్లలా
  rationale: పోలికను సహజమైన ఆధునిక తెలుగులో చూపుతూ, ప్రవహించి వెళ్లిపోయే నీటి కవితాత్మక చిత్రాన్ని నిలుపుతుంది.
- source_word: עָבְרוּ
  choice: దాటిపోయిన
  rationale: నీళ్లు ఇప్పటికే వెళ్లిపోయి ఇక లేవనే పూర్తయిన చర్యను, עבר క్రియ యొక్క చిత్రాన్ని వ్యక్తం చేస్తుంది.
- source_word: תִזְכֹּר
  choice: దాన్ని జ్ఞాపకం చేసుకుంటావు
  rationale: హీబ్రూలో కర్మ స్పష్టంగా లేకపోయినా, ముందున్న దుఃఖాన్ని సూచించే ‘దాన్ని’ తెలుగులో పోలికను స్పష్టంగా, సహజంగా చేస్తుంది.
