  text: If he passes by and shuts someone in[a], and calls an assembly[b], then who can turn him back?
translation:
  language: te
  text: ఆయన దాటివెళ్లి, ఒకరిని నిర్బంధించి[a], సభను సమకూర్చితే[b], అప్పుడు ఆయనను వెనక్కి తిప్పగలవాడెవడు?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “నిర్బంధించి” అనే పదాన్ని “మూసివేసి” లేదా “అప్పగించి” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “సభను సమకూర్చితే” అనే మాటకు “కూడగట్టితే” లేదా “సమావేశపరిస్తే” అని కూడా అర్థం కావచ్చు; ఇక్కడ న్యాయవిచారణ కోసం కూడగట్టడం అనే భావం ఉండవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: లేదా, “ఆయన చేసినదాన్ని ఎవరు తిరగదోడగలడు?” చివరి హీబ్రూ రూపాన్ని కార్యం చేస్తున్న వ్యక్తిని వెనక్కి తిప్పడంగా గానీ, ఆయన కార్యాన్ని తిరగదోడడంగా గానీ అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: אִם
  choice: చేస్తే
  rationale: ఈ హీబ్రూ షరతును తెలుగులో సహజంగా తెలిపేందుకు క్రియల చివర ‘చేస్తే’ భావాన్ని ఉంచాం; ఇది ఊహాత్మకమైనా నిశ్చయభరితమైన వాక్యరూపాన్ని కాపాడుతుంది.
- source_word: יַחֲלֹף
  choice: దాటివెళ్లి
  rationale: חלף క్రియలోని ‘దాటి వెళ్లడం/గుండా వెళ్లడం’ అనే ప్రాథమిక భావాన్ని, విధ్వంసార్థాన్ని అదనంగా చేర్చకుండా వ్యక్తం చేస్తుంది.
- source_word: וְיַסְגִּיר
  choice: ఒకరిని నిర్బంధించి
  rationale: סגר హిఫిల్ రూపం ‘మూసివేయడం, నిర్బంధించడం, అప్పగించడం’ అనే అర్థాలను ఇవ్వగలదు. సందర్భంలో ‘నిర్బంధించి’ సహజంగా ఉండగా, హీబ్రూలో కర్మ స్పష్టంగా లేకపోవడాన్ని ‘ఒకరిని’ అనే అనిర్దిష్ట రూపంతో ప్రతిబింబించాం.
- source_word: וְיַקְהִיל
  choice: సభను సమకూరిస్తే
  rationale: קהל హిఫిల్ రూపంలోని ‘కూడగట్టడం, సమావేశపరచడం’ అనే కారణార్థాన్ని నిలుపుతూ, సంభవించగల బహిరంగ లేదా న్యాయసభ భావాన్ని అతిగా నిర్ధారించని రూపం.
- source_word: וּמִי
  choice: అప్పుడు … ఎవడు?
  rationale: సంయోజక అవ్యయం మరియు ప్రశ్నార్థక పదం కలిగించే తార్కిక ఫలితాన్ని సహజమైన తెలుగు అలంకారప్రశ్నగా వ్యక్తం చేస్తుంది.
- source_word: יְשִׁיבֶנּוּ
  choice: ఆయనను వెనక్కి తిప్పగలవాడు
  rationale: שוב హిఫిల్ రూపంలోని ‘తిరిగి వెళ్లేలా చేయడం, వెనక్కి తిప్పడం’ అనే భావాన్ని, పురుష ఏకవచన ప్రత్యయాన్ని వ్యక్తిగతంగా తీసుకొని అనువదించాం; చర్యను రద్దు చేయడం అనే విస్తృత భావాన్ని పాదసూచికలో ఉంచాం.
theological_decisions:
- issue: పురుష ఏకవచన క్రియల కర్త మరియు చివరి ప్రత్యయ సూచ్యం
  choice: సందర్భానుసారం కర్త దేవుడు; చివరి ప్రత్యయాన్ని వ్యక్తిగతంగా ‘ఆయనను’ అని అనువదించడం.
  alternative: చివరి భావాన్ని ‘ఆయన చేసినదాన్ని ఎవరు తిరగదోడగలరు?’ అని, చర్యను సాధారణంగా సూచించేదిగా గ్రహించడం.
  rationale: ముందున్న సందర్భం దేవుని జ్ఞానం మరియు అడ్డుకోలేని కార్యాన్ని గురించి మాట్లాడుతుంది. అయినా చివరి హీబ్రూ రూపం చర్యను తిరగదోడడం అనే భావానికీ దారితీయగలదు; కాబట్టి ఆ అనిశ్చితిని పాదసూచికలో కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘ఆయన’ ద్వారా సందర్భంలోని దేవుని సూచించాం; ‘వెనక్కి తిప్పడం’ అనే స్పష్టమైన రూపకం మూలంలోని అలంకారప్రశ్న బలాన్ని నిలుపుతుంది. మూలంలో స్పష్టంగా లేని న్యాయార్థాన్ని ప్రధాన వాక్యంలో బలవంతంగా చేర్చకుండా పాదసూచికలో సూచించాం.
