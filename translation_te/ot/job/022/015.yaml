  text: Will you keep to the ancient path that men of wickedness have trodden?[a][b]
translation:
  language: te
  text: దుష్టులు[b] నడిచిన ఆ పురాతన[a] మార్గాన్ని నీవు అనుసరిస్తావా?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “పూర్వకాలపు మార్గం,” “ఎన్నో ఏళ్లనాటి మార్గం.” హీబ్రూ పదబంధం గతంలో చాలాకాలం క్రితం ఉన్న మార్గాన్ని సూచిస్తుంది; అది తప్పనిసరిగా నిత్యమైన మార్గమని అర్థం కాదు.
