  text: For you took pledges from your brothers for no reason[b][a], and stripped the clothing from the naked.
translation:
  language: te
  text: ఎందుకంటే, నువ్వు కారణం లేకుండానే నీ సహోదరుల దగ్గర తాకట్టు తీసుకున్నావు[a][b]; వస్త్రాలు లేనివారి వస్త్రాలను సైతం విప్పి తీసుకున్నావు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నువ్వు ఏ కారణమూ లేకుండా నీ సహోదరుల దగ్గర అప్పుకు పూచీగా వస్తువులను స్వాధీనం చేసుకున్నావు.”
    reason: lexical_alternative
  - marker: b
    text: “నీ సహోదరులు” అనేది కేవలం ఒకే తల్లిదండ్రులకు పుట్టినవారిని కాకుండా, సమాజంలోని తోటి సభ్యులను కూడా సూచించవచ్చు.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి ఆరోపణతో ఈ వాక్యాన్ని కారణాత్మకంగా అనుసంధానిస్తుంది.
- source_word: תַחְבֹּל
  choice: తాకట్టు తీసుకున్నావు
  rationale: అప్పుకు భద్రతగా తాకట్టు తీసుకోవడం అనే חבל క్రియార్థాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: אַחֶיךָ
  choice: నీ సహోదరుల
  rationale: హీబ్రూ పదంలోని అక్షరార్థమైన ‘సోదరులు’ భావాన్ని నిలుపుతూ, సమాజంలోని తోటి సభ్యులనే విస్తృత అర్థాన్ని కూడా అనుమతిస్తుంది.
- source_word: חִנָּם
  choice: కారణం లేకుండానే
  rationale: చెల్లింపు లేకపోవడం కంటే, న్యాయమైన కారణం లేకుండా చేసిన చర్య అనే నైతిక ఆరోపణను వ్యక్తం చేస్తుంది.
- source_word: וּבִגְדֵי
  choice: వస్త్రాలను
  rationale: בגד అనే పదానికి నేరుగా సరిపోయే, గౌరవప్రదమైన సాధారణ తెలుగు పదం.
- source_word: עֲרוּמִּים
  choice: వస్త్రాలు లేనివారి
  rationale: ‘నగ్నులు’ లేదా చాలినన్ని వస్త్రాలు లేనివారు అనే మూలపద భావాన్ని, ఈ సందర్భంలోని తీవ్రమైన వ్యంగ్యాన్ని నిలుపుతూ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: תַּפְשִׁיט
  choice: విప్పి తీసుకున్నావు
  rationale: హిఫీల్ రూపంలోని వస్త్రాన్ని తొలగింపజేయడం లేదా లాగివేయడం అనే సకర్మక భావాన్ని స్పష్టంగా అందిస్తుంది.
