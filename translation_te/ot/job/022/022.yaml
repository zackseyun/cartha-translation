  text: Please[a], receive instruction from his mouth, and lay up his words in your heart.
translation:
  language: te
  text: 'దయచేసి, ఆయన నోటినుండి ఉపదేశాన్ని[a] స్వీకరించు;

    ఆయన మాటలను నీ హృదయంలో దాచుకో.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘బోధ’; హీబ్రూ పదం తోరా. కొన్ని సందర్భాల్లో దీనికి ‘ధర్మశాస్త్రం’ అని కూడా అర్థం.
    reason: lexical_alternative
lexical_decisions:
- source_word: קַח
  choice: స్వీకరించు
  rationale: లָקַח్ అనే ఆజ్ఞారూపానికి అక్షరార్థంగా ‘తీసుకో’ అని అర్థమైనా, ఒకరి నోటినుండి ఉపదేశాన్ని పొందే సందర్భంలో దానిని అంగీకరించి స్వీకరించడాన్ని ‘స్వీకరించు’ సహజంగా తెలియజేస్తుంది.
- source_word: נָא
  choice: దయచేసి
  rationale: ఇక్కడ ఈ కణం కాలార్థకమైన ‘ఇప్పుడు’ కంటే విజ్ఞాపనతో కూడిన ప్రోత్సాహాన్ని సూచిస్తుంది; ‘దయచేసి’ ఆ స్వరాన్ని ఆధునిక తెలుగులో సహజంగా నిలుపుతుంది.
- source_word: מִפִּיו
  choice: ఆయన నోటినుండి
  rationale: హీబ్రూ పాఠంలోని స్పష్టమైన ‘అతని నోటినుండి’ అనే వాగ్రూపాన్ని సరళీకరించకుండా నిలిపింది. సందర్భంలోని దేవుని సూచనకు తగినట్లు తెలుగులో గౌరవార్థక ‘ఆయన’ వాడింది.
- source_word: תּוֹרָה
  choice: ఉపదేశం
  rationale: యోబు గ్రంథంలోని ఈ జ్ఞానోపదేశ సందర్భంలో תּוֹרָה ప్రత్యేకంగా మోషే ధర్మశాస్త్రాన్నే సూచించదు; అధికారపూర్వక బోధ లేదా ఉపదేశం అనే విస్తృత భావానికి ‘ఉపదేశం’ సరిపోతుంది.
- source_word: וְשִׂים
  choice: దాచుకో
  rationale: అక్షరార్థం ‘ఉంచు/పెట్టు’; అయితే మాటలను హృదయంలో ఉంచడం అనే రూపకం వాటిని అంతరంగంలో భద్రపరచుకోవడాన్ని సూచిస్తుంది. ‘దాచుకో’ ఆ రూపకార్థాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אֲמָרָיו
  choice: ఆయన మాటలు
  rationale: హీబ్రూ బహువచన నామవాచకానికి నేరుగా, సహజంగా సరిపోయే అనువాదం.
- source_word: בִּלְבָבֶךָ
  choice: నీ హృదయంలో
  rationale: ఆలోచన, సంకల్పం, అంతరంగానికి కేంద్రంగా హృదయాన్ని చూపే హీబ్రూ వాగ్రూపాన్ని తెలుగులోనూ నిలిపింది.
theological_decisions:
- issue: జ్ఞానోపదేశ సందర్భంలో תּוֹרָה పద భావం
  choice: ఉపదేశం
  alternative: ధర్మశాస్త్రం లేదా బోధ
  rationale: ‘ఉపదేశం’ అని అనువదించడం వల్ల పాఠం కోరని మోషే ధర్మశాస్త్ర సంబంధమైన ప్రత్యేకతను రుద్దకుండా, ఎలీఫజు దేవుని అధికారపూర్వక బోధను స్వీకరించమని చేస్తున్న విజ్ఞాపన నిలుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా ఉండే శైలి. ఏకవచన ఆజ్ఞారూపాలు నిలిపాయి; దేవుని సూచించే సర్వనామానికి గౌరవార్థక రూపం వాడింది.
