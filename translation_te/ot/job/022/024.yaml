  text: and lay gold in the dust[a], and the gold of Ophir among the stones of the wadis[c][b],
translation:
  language: te
  text: బంగారాన్ని ధూళిమీద ఉంచు[a], ఓఫీరు[b] బంగారాన్ని వాగుల రాళ్ల మధ్య ఉంచు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘బంగారు ఖనిజాన్ని ధూళిమీద ఉంచు.’ హెబ్రీ పదం శుద్ధి చేసిన బంగారాన్నే కాక విలువైన లోహాన్ని లేదా ఖనిజాన్ని కూడా సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘ఓఫీరు’ శ్రేష్ఠమైన బంగారానికి పేరుపొందిన ప్రదేశం; అందుకే ‘ఓఫీరు బంగారం’ అని అనువదించబడింది.
    reason: cross_reference
  - marker: c
    text: ఇక్కడ ‘వాగులు’ అనేది కాలానుగుణంగా నీరు ప్రవహించే వాగులను లేదా వాటి ప్రవాహపాత్రలను సూచించవచ్చు.
    reason: cultural_note
lexical_decisions:
- source_word: וְשִׁית
  choice: పెట్టు
  rationale: שׁית అంటే ‘పెట్టు, ఉంచు’ అని అర్థం. ఇక్కడ వరుసలోని ఉపదేశాత్మక ఆజ్ఞను సహజమైన ఆధునిక తెలుగులో ‘పెట్టు’ వ్యక్తపరుస్తుంది.
- source_word: עַל עָפָר
  choice: ధూళిలో
  rationale: עַל సాధారణంగా ‘మీద’ అని అర్థమైనా, విలువైన లోహాన్ని విడిచిపెట్టే ఈ కవితాత్మక చిత్రంలో ‘ధూళిలో’ అనేది తెలుగులో సహజంగా ఉండి సందర్భ భావాన్ని అందిస్తుంది.
- source_word: בָּצֶר
  choice: బంగారం
  rationale: ఈ పదం విలువైన లోహాన్ని, ముఖ్యంగా బంగారాన్ని లేదా బంగారు ఖనిజాన్ని సూచించగలదు. ఓఫీరుతో ఉన్న సమాంతర నిర్మాణాన్ని బట్టి ప్రధాన పాఠంలో ‘బంగారం’ స్పష్టంగా ఉంది; విస్తృత అర్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: וּבְצוּר נְחָלִים
  choice: వాగుల రాళ్ల మధ్య
  rationale: צוּר అంటే రాయి/బండ; נְחָלִים కాలానుగుణంగా ప్రవహించే వాగులు లేదా వాటి ప్రవాహపాత్రలను సూచించగలదు. ‘వాగుల రాళ్ల మధ్య’ మూలంలోని భౌగోళిక చిత్రాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: אוֹפִיר
  choice: ఓఫీరు బంగారం
  rationale: ఓఫీరు శ్రేష్ఠమైన బంగారానికి పేరుపొందిన ప్రదేశం. హెబ్రీ పాఠంలో ప్రదేశనామమే ఉన్నా, సమాంతరార్థాన్ని తెలుగులో స్పష్టంచేయడానికి ‘ఓఫీరు బంగారం’ అని ఇచ్చాం.
theological_decisions:
- issue: ఎలీఫజు ఉపదేశంలో ఈ వాక్యపు భావబలం
  choice: భౌతిక సంపదపై ఆధారపడడాన్ని విడిచిపెట్టమనే పిలుపుగా చిత్రాన్ని అనువదించడం
  alternative: బంగారాన్ని సహజమైన సురక్షిత ప్రదేశాల్లో దాచిపెట్టమనే ఆజ్ఞగా గ్రహించడం
  rationale: 22:24–25 సందర్భంలో బంగారాన్ని ధూళిలోను వాగుల రాళ్ల మధ్యను పెట్టడం, సంపదను పరమాధారంగా ఎంచుకోకుండా సర్వశక్తుడినే విలువైన సంపదగా చూడాలనే ఉపదేశంతో సరిపోతుంది. అయితే మూలంలోని సంక్షిప్త కవితాత్మక రూపాన్ని విప్పి సిద్ధాంత ప్రకటనగా మార్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గంభీరమైన కవితాత్మక ఆజ్ఞారూపం వాడబడింది. మూలంలో లేని ‘నీ’ అనే స్వామ్యసూచకాన్ని చేర్చలేదు. సాధారణ పాఠకుడికి అపరిచితమైన ‘వాడి’ అనే అరువు పదానికి బదులు ‘వాగులు’ వాడి, దాని భౌగోళిక విశేషాన్ని పాదసూచికలో వివరించాం.
