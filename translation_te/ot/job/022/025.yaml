  text: then the Almighty will be your gold[a], and choice silver for you.
translation:
  language: te
  text: అప్పుడు సర్వశక్తిమంతుడు నీ బంగారమై, నీకు మేలిమి వెండిగా ఉంటాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అప్పుడు సర్వశక్తిమంతుడు నీ నిధిగా ఉంటాడు; నీకు వెండి సమృద్ధిగా ఉంటుంది.” ‘బంగారం’గా అనువదించిన హీబ్రూ పదం, వెండిని విశేషించే పదం రెండూ అర్థనిర్ణయానికి కఠినమైనవి. దేవుడే నిధి అనే భావానికి బదులుగా, దేవుడు సమృద్ధిని అనుగ్రహిస్తాడనే భావం కూడా ఉండవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה
  choice: అప్పుడు ... ఉంటాడు
  rationale: ముందున్న షరతుతో అనుసంధానమైన ఫలితాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది; సాధారణ ‘మరియు’ కంటే సందర్భంలోని పర్యవసాన భావాన్ని స్పష్టం చేస్తుంది.
- source_word: שַׁדַּי
  choice: సర్వశక్తిమంతుడు
  rationale: యోబు గ్రంథంలో దేవునికి వాడిన ఈ బిరుదు యొక్క అర్థాన్ని తెలిపే, ఆధునిక ప్రామాణిక తెలుగులో స్థిరపడిన అనువాదం.
- source_word: בְּצָרֶיךָ
  choice: నీకు బంగారముగా
  rationale: בצר అనే కఠిన పదం ముడి విలువైన లోహం, బంగారం లేదా నిధిని సూచించవచ్చు. వెండితో ఉన్న కవితా సమాంతరతలో ‘బంగారం’ సహజమైన ప్రధాన పఠనం; ‘నీకు’ అనే రూపం వ్యక్తిగత సంబంధాన్ని నిలుపుతుంది.
- source_word: וְכֶסֶף תּוֹעָפוֹת
  choice: మేలిమి వెండిగా
  rationale: כסף స్పష్టంగా ‘వెండి’; అరుదైన תועפות ఇక్కడ నాణ్యత లేదా సమృద్ధిని సూచించవచ్చు. ‘మేలిమి’ ఉన్నత నాణ్యతను సహజంగా వ్యక్తపరుస్తూ, పదార్థపరమైన పఠనాన్ని అతిగా నిర్ణయించదు.
- source_word: לָךְ
  choice: నీకు
  rationale: హీబ్రూ ప్రయోజనార్థక/సంబంధార్థక భావాన్ని సంక్షిప్తంగా, సహజంగా నిలుపుతుంది.
theological_decisions:
- issue: ఎలీఫజు వాగ్దానంలో దేవుడే సంపదగా ఉండడమా, లేక దేవుడు సంపదను సమకూర్చడమా
  choice: సర్వశక్తిమంతుడే యోబుకు బంగారం, మేలిమి వెండిగా ఉంటాడనే రూపకాన్ని ప్రధాన పాఠ్యంలో ఉంచడం
  alternative: సర్వశక్తిమంతుడు యోబుకు బంగారాన్ని, విస్తారమైన వెండిని సమకూరుస్తాడని అర్థం చేసుకోవడం
  rationale: హీబ్రూ వాక్యనిర్మాణం దేవుణ్ణి విలువైన లోహాలతో నేరుగా సమీకరించే బలమైన రూపకాన్ని అనుమతిస్తుంది; అయితే కఠినమైన పదాలు భౌతిక సంపదను దేవుడు ప్రసాదిస్తాడనే పఠనాన్నీ అనుమతిస్తాయి. అందువల్ల ప్రధాన పాఠ్యంలో రూపకాన్ని, పాదసూచికలో ప్రత్యామ్నాయాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కవితా గాంభీర్యాన్ని కాపాడుతూ సాధారణ పాఠకులకు అర్థమయ్యే పదజాలం. ‘బంగారముగా/వెండిగా’ అనే రూపాలు రెండు కవితా పాదాల సమాంతరతను నిలుపుతాయి.
