source:
  edition: WLC
  text: הַ/חֵ֣פֶץ לְ֭/שַׁדַּי כִּ֣י תִצְדָּ֑ק וְ/אִם בֶּ֝֗צַע כִּֽי תַתֵּ֥ם דְּרָכֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/022/003.yaml
  text: Is it any pleasure to the Almighty that you are righteous[b][a], or any gain that you make your ways blameless?
translation:
  language: te
  text: నీవు నీతిమంతుడిగా ఉండడం సర్వశక్తిమంతునికి ఏమైనా ఆనందమా[a]? లేదా నీవు నీ మార్గాలను నిర్దోషమైనవిగా చేయడం వల్ల ఆయనకు ఏమైనా లాభమా[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘సంతోషమా.’
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘ప్రయోజనమా.’
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֵפֶץ
  choice: ఏమైనా ఆనందమా
  rationale: חֵפֶץ అనే నామవాచకం ఆనందం, సంతోషం లేదా అభిలాషను సూచించగలదు. ప్రశ్నార్థక నిర్మాణంలో ‘ఏమైనా ఆనందమా’ అనేది సహజమైన తెలుగులో దాని భావాన్ని నిలుపుతుంది.
- source_word: לְשַׁדַּי
  choice: సర్వశక్తిమంతునికి
  rationale: שַׁדַּי యోబు గ్రంథంలో దేవునికి వాడే బిరుదు. לְ ఉపసర్గను ‘-కి’తో సహజంగా వ్యక్తం చేశాం.
- source_word: כִּי תִצְדָּק
  choice: నీవు నీతిమంతుడిగా ఉండడం
  rationale: Qal రూపంలోని צדק ఇక్కడ ‘నీతిమంతుడిగా ఉండు’ లేదా ‘న్యాయపక్షంలో ఉండు’ అనే అర్థం ఇస్తుంది; ఆత్మన్యాయీకరణ భావాన్ని చేర్చలేదు.
- source_word: וְאִם
  choice: లేదా
  rationale: సమాంతర అలంకారిక ప్రశ్నలో రెండవ అంశాన్ని ప్రవేశపెట్టే ఈ పదబంధాన్ని సహజమైన తెలుగులో ‘లేదా’గా ఇచ్చాం.
- source_word: בֶּצַע
  choice: లాభం
  rationale: בֶּצַע ప్రయోజనం లేదా లాభాన్ని సూచిస్తుంది. ‘లాభం’ ఆర్థిక ప్రయోజన రూపకాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: כִּי תַתֵּם
  choice: నిర్దోషమైనవిగా చేసుకోవడం వల్ల
  rationale: Hiphil రూపంలోని תמם సంపూర్ణం చేయడం లేదా నిర్దోషంగా చేయడం అనే కారక భావాన్ని ఇస్తుంది. నైతిక సందర్భంలో ‘నిర్దోషమైనవిగా చేసుకోవడం’ తగినది.
- source_word: דְּרָכֶיךָ
  choice: నీ మార్గాలను
  rationale: דֶּרֶךְ బహువచనంలో జీవన విధానాన్ని సూచించే రూపకం. తెలుగులోనూ ‘మార్గాలు’ అనే రూపకాన్ని నిలిపాం.
theological_decisions:
- issue: మానవ నీతి దేవునికి అంతర్గతంగా ప్రయోజనం కలిగిస్తుందని ఈ వాక్యం సూచిస్తుందా?
  choice: ఎలీఫజు వాదనలోని అలంకారిక ప్రశ్నలను అలాగే ఉంచి, మానవ నీతి వల్ల దేవునికి లాభం కలుగదనే అతని వాదనను వ్యక్తం చేశాం.
  alternative: దేవునికి అవసరం లేదనే భావానికే పరిమితం చేసి, నీతిలో ఆయనకు ఆనందం లేదనే సూచనను మృదువుపరచడం.
  rationale: హీబ్రూ పాఠం ఆనందం, లాభం అనే పదాలతో నేరుగా అలంకారిక ప్రశ్నలు వేస్తుంది. ఇది ఎలీఫజు మాట కావడం వల్ల, లేఖనంలోని ఇతర చోట్ల దేవుడు నీతిలో ఆనందిస్తాడనే భావాన్ని నిరాకరించే విస్తృత సిద్ధాంతంగా మార్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ప్రశ్నార్థక శైలిని వాడాం. ‘సర్వశక్తిమంతుడు,’ ‘నీ మార్గాలు’ వంటి బైబిలు పదబంధాలను సాధారణ పాఠకులకు అర్థమయ్యేలా నిలిపాం; మూలంలోని రెండు సమాంతర అలంకారిక ప్రశ్నల నిర్మాణాన్ని కాపాడాం.
