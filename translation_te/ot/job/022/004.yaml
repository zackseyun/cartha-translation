source:
  edition: WLC
  text: הֲֽ֭/מִ/יִּרְאָ֣תְ/ךָ יֹכִיחֶ֑/ךָ יָב֥וֹא עִ֝מְּ/ךָ֗ בַּ/מִּשְׁפָּֽט׃
base_translation:
  language: en
  yaml_path: translation/ot/job/022/004.yaml
  text: Is it because of your fear of him that he reproves you and enters into judgment with you?[a][b][c]
translation:
  language: te
  text: నీవు ఆయనకు భయపడుతున్నందుకే ఆయన నిన్ను గద్దించి, నీతో న్యాయవిచారణకు వస్తాడా?[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నీ భయం కారణంగానే’; హీబ్రూలో అక్షరార్థంగా, ‘నీ భయం నుండి/నీ భయం కారణంగా.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘నిన్ను మందలించి’ లేదా ‘నిన్ను సరిదిద్ది.’
    reason: lexical_alternative
  - marker: c
    text: అక్షరార్థంగా, ‘నీతో కలిసి న్యాయవిచారణలోకి వస్తాడా?’
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲמִיִּרְאָתְךָ
  choice: నీవు ఆయనకు భయపడుతున్నందుకే
  rationale: ప్రశ్నార్థక הֲ మరియు కారణార్థక מִן‌ను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది. יִרְאָהకు ‘భయం’ లేదా ‘భక్తిపూర్వక భయం’ అనే భావాలు ఉండవచ్చు; సందర్భంలో దాని లక్ష్యం దేవుడని స్పష్టంచేయడానికి ‘ఆయనకు’ చేర్చబడింది.
- source_word: יֹכִיחֶךָ
  choice: ఆయన నిన్ను గద్దించి
  rationale: יכח హిఫీల్ రూపం గద్దించడం, మందలించడం, తప్పు చూపడం లేదా న్యాయవివాదంలో ఎదిరించడం అనే భావాలను కలిగి ఉండగలదు. ‘గద్దించి’ నైతిక మందలింపు భావాన్ని నిలుపుతూ, తరువాతి న్యాయపరమైన వాక్యంతో సరిపోతుంది.
- source_word: יָבֹא עִמְּךָ בַּמִּשְׁפָּט
  choice: నీతో న్యాయవిచారణకు వస్తాడా
  rationale: ‘నీతో తీర్పులోకి వస్తాడు’ అనే హీబ్రూ నుడికారాన్ని సహజ తెలుగులో అందిస్తూ, משפט యొక్క న్యాయపరమైన నేపథ్యాన్నీ עִם సూచించే ఎదురెదురు పక్షాల భావాన్నీ కాపాడుతుంది.
- source_word: מִּשְׁפָּט
  choice: న్యాయవిచారణ
  rationale: ఇక్కడ ఈ పదం సాధారణ న్యాయం కంటే న్యాయపరమైన విచారణ లేదా వ్యాజ్యాన్ని సూచిస్తుంది. ‘న్యాయవిచారణ’ సందర్భానికి స్పష్టంగా సరిపోతుంది.
theological_decisions:
- issue: ‘నీ భయం’లో సూచిత లక్ష్యం
  choice: భయం దేవునివైపు మళ్లిందని ‘నీవు ఆయనకు భయపడుతున్నందుకు’ అని స్పష్టీకరించడం
  alternative: లక్ష్యాన్ని సూచించకుండా ‘నీ భయం కారణంగా’ అని ఉంచడం
  rationale: ఎలీఫజు దేవుడు యోబుతో ఎలా వ్యవహరిస్తున్నాడో మాట్లాడుతున్న సందర్భంలో, సూచిత లక్ష్యం దేవుడే. తెలుగులో అసహజమైన అసంపూర్ణతను నివారించేందుకు ‘ఆయనకు’ అని స్పష్టంచేయడం కొత్త సిద్ధాంత వాదనను చేర్చదు.
- issue: ఎలీఫజు ప్రశ్న యొక్క బలం
  choice: ‘కాదు’ అనే సమాధానాన్ని ఆశించే వ్యంగ్యార్థక rhetorical questionగా ఉంచడం
  alternative: నిరపేక్షమైన సమాచార ప్రశ్నగా అనువదించడం
  rationale: హీబ్రూ ప్రశ్నార్థక రూపం మరియు సందర్భం ప్రకారం, యోబు దేవునికి భయపడుతున్నందువల్ల దేవుడు అతన్ని విచారిస్తున్నాడనే భావాన్ని ఎలీఫజు తిరస్కరిస్తున్నాడు. అదనపు వివరణ లేకుండానే ప్రశ్నారూపం ఈ ఉద్వేగాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ప్రశ్నారూపం వాడబడింది. ‘గద్దించి’ సాధారణ పాఠకులకు అర్థమయ్యేలా ఉండి మూలంలోని నైతిక-న్యాయపరమైన బలాన్ని కాపాడుతుంది; ‘న్యాయవిచారణ’ న్యాయస్థాన సంబంధిత సందర్భాన్ని స్పష్టం చేస్తుంది.
