  text: Come to terms with him, please, and be at peace; by this good will come to you.
translation:
  language: te
  text: దయచేసి ఆయనతో సఖ్యత కలిగి, శాంతిగా ఉండు; వాటివల్ల[a] నీకు మేలు కలుగుతుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ‘వాటివల్ల/వాటి ద్వారా’ అని బహువచన రూపం ఉంది. అది దేనిని సూచిస్తుందో స్పష్టంగా లేదు.
    reason: בָּהֶם యొక్క బహువచన రూపాన్నీ, దాని అనిశ్చిత సూచననూ సంరక్షించడానికి.
lexical_decisions:
- source_word: הַסְכֶּן נָא עִמּוֹ
  choice: దయచేసి ఆయనతో సఖ్యత కుదుర్చుకుని
  rationale: הַסְכֶּן ఇక్కడ ఎదుటివానితో సన్నిహిత అవగాహన లేదా సఖ్యత ఏర్పరచుకోవడం అనే భావాన్ని ఇస్తుంది; נָא అనే వినయపూర్వక అభ్యర్థనను ‘దయచేసి’గా వ్యక్తం చేశాం.
- source_word: וּשְׁלם
  choice: సమాధానంగా ఉండు
  rationale: שׁלם యొక్క ఆజ్ఞార్థక రూపం శాంతి లేదా సామరస్య స్థితిలో ఉండమనే భావాన్ని ఇక్కడ ఇస్తుంది.
- source_word: תְּבוֹאַתְךָ טוֹבָה
  choice: నీకు మేలు కలుగుతుంది
  rationale: అక్షరార్థంగా ‘మేలు నీ దగ్గరకు వస్తుంది’; సహజమైన ఆధునిక తెలుగులో అదే భావాన్ని ‘మేలు కలుగుతుంది’గా అందించాం.
theological_decisions:
- issue: עִמּוֹ లోని ‘అతనితో’ అనే సర్వనామం ఎవరిని సూచిస్తుంది?
  choice: ఆయనతో
  alternative: అతనితో / దేవునితో
  rationale: సందర్భంలో ఇది దేవుణ్ణి సూచించినప్పటికీ, మూలపాఠంలోని సర్వనామాన్ని స్పష్టమైన నామవాచకంగా మార్చకుండా ఉంచాం; తెలుగులో దేవునికి తగిన గౌరవార్థక సర్వనామాన్ని వాడాం.
- issue: בָּהֶם అనే బహువచన రూపం యొక్క సూచన
  choice: దీనివల్ల[a]
  alternative: వాటివల్ల / ఈ విషయాల ద్వారా
  rationale: హీబ్రూలో బహువచనం ఉన్నా దాని పూర్వపదం స్పష్టంగా లేదు. వాక్యంలోని ముందు చెప్పిన చర్యల సమగ్ర ఫలితాన్ని సహజ తెలుగులో ‘దీనివల్ల’గా ఇచ్చి, రూప సంబంధిత అస్పష్టతను పాదటిప్పణిలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా, సాధారణ పాఠకులకు అర్థమయ్యే రీతిలో రూపొందించాం. ‘సఖ్యత కుదుర్చుకుని’ అనేది పరిచయం, అనుకూలత, సామరస్యం అనే మూలభావాలను అతిగా సిద్ధాంతీకరించకుండా అందిస్తుంది.
