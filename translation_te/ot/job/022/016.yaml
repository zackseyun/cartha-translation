  - severity: low
    issue: Footnote b identifies ‘వారి పునాది ... పోయబడింది’ as the near-literal wording.
    rationale: The Hebrew verb naturally aligns with the river/stream image, not straightforwardly with the foundation. The note should explain the compact construction without presenting a misleading literal gloss.
