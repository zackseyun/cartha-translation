translation:
  language: te
  text: 'తమ కాలం రాకముందే వారు తొలగించబడ్డారు[a];

    వారి పునాదిపై నది ఉప్పొంగి పారింది[b][c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘తమ కాలం రాకముందే వారు నరికివేయబడ్డారు.’ ఇక్కడి హెబ్రీ క్రియ క్లిష్టమైనది; అది పట్టివేయబడడం, ముడుచుకుపోవడం, లేదా హఠాత్తుగా తొలగించబడడం అనే భావాలను సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘వారి పునాది నదిచేత కొట్టుకుపోయింది.’ హెబ్రీలో నది పోయబడినట్లు చెప్పే సంక్షిప్త చిత్రం ఉంది; నది వారి పునాదిపై ఉప్పొంగి పారిందని లేదా దానిని ముంచివేసిందని అర్థమవవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: ఈ వచనం జలప్రళయంలో నాశనమైన తరాన్ని ప్రత్యేకంగా సూచించవచ్చు; లేదా దుష్టుల ఆకస్మిక పతనాన్ని సాధారణంగా వర్ణించవచ్చు.
    reason: cross_reference
lexical_decisions:
- source_word: אֲשֶׁר
  choice: వారు
  rationale: ముందటి సందర్భంలో చెప్పబడిన దుష్టులను వర్ణించే సంబంధార్థక ప్రయోగం; తెలుగులో స్వతంత్ర వాక్యంగా సహజంగా ఉండేందుకు ‘వారు’ వాడబడింది.
- source_word: קֻמְּטוּ
  choice: అకస్మాత్తుగా తొలగించబడ్డారు
  rationale: ఈ క్లిష్టమైన కర్మణి క్రియ పట్టివేయడం, ముడుచుకుపోవడం లేదా హఠాత్తుగా తొలగిపోవడం అనే భావాలను సూచించవచ్చు. సందర్భంలో అకాల నాశనాన్ని తెలియజేస్తూ, ఒక నిర్దిష్ట భౌతిక చిత్రాన్ని బలవంతంగా రుద్దకుండా ఈ అనువాదం ఉంచబడింది.
- source_word: וְלֹא עֵת
  choice: తమ కాలం రాకముందే
  rationale: నిర్ణీత లేదా తగిన సమయానికి ముందే అంతమవడాన్ని తెలుగులో స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: נָהָר
  choice: నది
  rationale: మూలపదానికి సాధారణ అర్థమైన ‘నది’నే నిలిపి, ‘జలప్రళయం’ అనే వ్యాఖ్యానాన్ని ప్రధాన పాఠ్యంలో చేర్చలేదు.
- source_word: יוּצַק
  choice: కొట్టుకుపోయింది
  rationale: క్రియకు అక్షరార్థంగా పోయబడడం అనే భావం ఉన్నా, ‘పునాది’ మరియు ‘నది’తో కూడిన సంక్షిప్త చిత్రంలో నీటి ప్రవాహం దానిని ముంచి లేదా కొట్టుకుపోయే భావాన్ని సహజ తెలుగులో అందిస్తుంది.
- source_word: יְסוֹדָם
  choice: వారి పునాది
  rationale: ఏకవచన సమూహార్థ రూపాన్ని అలాగే ఉంచి, వారి స్థిరత్వం కూలిపోవడాన్ని సూచించే రూపకాన్ని కాపాడుతుంది.
theological_decisions:
- issue: తీర్పుకు సంబంధించిన జలవినాశన చిత్రం
  choice: దుష్టులు అకాలంగా నాశనం కావడం, వారి పునాది నీటిచేత కొట్టుకుపోవడం అనే చిత్రాన్ని నిర్దిష్ట చారిత్రక సంఘటనగా తేల్చకుండా అనువదించడం
  alternative: ఈ వచనం జలప్రళయంలో నాశనమైన తరాన్ని ప్రత్యేకంగా సూచిస్తుందని స్పష్టీకరించడం
  rationale: సందర్భం పూర్వకాల దుష్టులను, నీటివల్ల కలిగిన వినాశనాన్ని గుర్తుచేయవచ్చు; అయితే హెబ్రీ పాఠ్యం ఇది జలప్రళయానికి నిర్దిష్ట సూచనా లేక దుష్టుల ఆకస్మిక పతనానికి సాధారణ రూపకమా అన్నది తేల్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. మొదటి పాదంలోని క్లిష్ట క్రియను ప్రధాన పాఠ్యంలో సహజంగా అనువదించి, ప్రత్యామ్నాయ అర్థాలను పాదటిప్పణిలో ఉంచాం. రెండవ పాదంలోని సంక్షిప్త జలరూపకాన్ని నిలిపి, జలప్రళయ సూచనను వ్యాఖ్యానంగా మాత్రమే ఇచ్చాం.
