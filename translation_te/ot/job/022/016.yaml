  source_fidelity: 'The first line appropriately conveys an untimely removal, though the added adverb ‘అకస్మాత్తుగా’ is not required in the main text. In the second line, the Hebrew has compressed syntax: ‘a river/stream was poured out’ in relation to ‘their foundation.’ Rendering the foundation itself as directly ‘washed away’ is a plausible interpretation, but it reverses/clarifies the compressed image more than necessary. A rendering in which the river overflows upon the foundation better preserves the Hebrew expression and its ambiguity.'
