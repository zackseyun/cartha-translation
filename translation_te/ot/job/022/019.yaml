source:
  edition: WLC
  text: יִרְא֣וּ צַדִּיקִ֣ים וְ/יִשְׂמָ֑חוּ וְ֝/נָקִ֗י יִלְעַג לָֽ/מוֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/022/019.yaml
  text: The righteous see and rejoice[a], and the innocent mock them.
translation:
  language: te
  text: 'నీతిమంతులు చూసి సంతోషిస్తారు;

    నిర్దోషి వారిని ఎగతాళి చేస్తాడు.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘వారిని చూసి నవ్వుతాడు,’ లేదా ‘వారిని అపహసిస్తాడు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְאוּ
  choice: చూసి
  rationale: ראה అనే క్రియ ఇక్కడ జరిగినదాన్ని చూడడం లేదా గమనించడం అనే భావాన్ని ఇస్తుంది. తెలుగు వాక్యప్రవాహంలో తరువాతి ప్రతిస్పందనతో కలిపి ‘చూసి’ సహజంగా ఉంది.
- source_word: צַדִּיקִים
  choice: నీతిమంతులు
  rationale: బహువచన విశేషణం నామవాచకంగా వాడబడింది. ‘నీతిమంతులు’ మూలంలోని నైతిక వర్గాన్ని స్పష్టంగా, గౌరవప్రదంగా తెలియజేస్తుంది.
- source_word: וְיִשְׂמָחוּ
  choice: సంతోషిస్తారు
  rationale: שׂמח ఆనందించడం అనే భావాన్ని తెలియజేస్తుంది. ‘సంతోషిస్తారు’ ఆధునిక సాధారణ తెలుగులో సహజంగా ఉండి, మూలంలో లేని అదనపు తీవ్రతను చేర్చదు.
- source_word: וְנָקִי
  choice: నిర్దోషి
  rationale: ఏకవచన విశేషణం నామవాచకంగా, సాధారణ ప్రతినిధి అర్థంలో వాడబడింది. దాని ఏకవచన రూపాన్ని ‘నిర్దోషి’గా నిలిపాం.
- source_word: יִלְעַג
  choice: ఎగతాళి చేస్తాడు
  rationale: לעג తృణీకారంతో కూడిన అపహాస్యాన్ని సూచిస్తుంది. ‘ఎగతాళి చేస్తాడు’ ఆధునిక తెలుగులో ఈ భావాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది; ఇతర సాధ్యమైన పదాలను పాదటిప్పణిలో ఇచ్చాం.
- source_word: לָמוֹ
  choice: వారిని
  rationale: ఈ సర్వనామం సందర్భంలోని దుష్టులను సూచిస్తుంది. తెలుగు క్రియాప్రయోగానికి అనుగుణంగా ‘వారిని’ అని అనువదించాం; సూచిత వ్యక్తులను ప్రధాన పాఠంలో వివరించి చేర్చలేదు.
theological_decisions:
- issue: సందర్భంలో సర్వనామం సూచించే వారు
  choice: నీతిమంతులు, నిర్దోషి చుట్టుపక్కల వచనాల్లో చెప్పబడిన దుష్టుల పతనాన్ని చూసి స్పందిస్తున్నారు.
  alternative: దేవుని తీర్పును చూసినప్పుడు నీతిమంతులు సంతోషిస్తారనే సాధారణ ప్రకటన.
  rationale: తక్షణ సందర్భం దుష్టుల నాశనాన్ని గురించి చెబుతుంది. అయినా మూలంలోని సర్వనామాన్ని మాత్రమే ‘వారిని’గా ఉంచి, దాని సూచనను ప్రధాన పాఠంలో వివరణగా చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. హెబ్రీ సమాంతర నిర్మాణం మరియు ‘నిర్దోషి’ అనే ఏకవచన సాధారణ ప్రయోగం నిలుపబడ్డాయి. మూలంలో ప్రత్యక్ష కర్మ లేకపోవడంతో ‘చూసి’కి ‘దానిని’ వంటి పదం చేర్చలేదు.
