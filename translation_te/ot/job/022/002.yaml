reference: Job 22:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: הַ/לְ/אֵ֥ל יִסְכָּן גָּ֑בֶר כִּֽי יִסְכֹּ֖ן עָלֵ֣י/מוֹ מַשְׂכִּֽיל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/022/002.yaml
  text: Can a man be of use to God? Surely he who is wise is of use to himself[a].
translation:
  language: te
  text: మనిషి దేవునికి ప్రయోజనం కలిగించగలడా? నిజానికి, వివేకమున్నవాడు తనకే ప్రయోజనం కలిగిస్తాడు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “మనిషి దేవునికి లాభం చేకూర్చగలడా? అవగాహనగలవాడు తనకే లాభం చేకూర్చుకుంటాడు.”'
    reason: סכן అనే క్రియకు ‘ప్రయోజనం కలిగించు’తో పాటు ‘లాభం చేకూర్చు’ అనే భావం ఉంది; מַשְׂכִּילను ‘అవగాహనగలవాడు’ అని కూడా అనువదించవచ్చు.
lexical_decisions:
- source_word: הַלְאֵל
  choice: దేవునికి ... ఉండగలడా?
  rationale: ప్రశ్నార్థక הֲ మరియు לְאֵל కలసి, మనిషి దేవునికి ఏదైనా మేలు చేకూర్చగలడా అనే అలంకారిక ప్రశ్నను సూచిస్తున్నాయి.
- source_word: יִסְכָּן / יִסְכֹּן
  choice: ప్రయోజనకరంగా ఉండగలడా / ప్రయోజనకరంగా ఉంటాడు
  rationale: סכן ఇక్కడ ‘ఉపయోగపడటం, ప్రయోజనం కలిగించడం’ అనే భావంలో ఉంది. రెండు పాదాల్లోనూ ఒకే మూలభావాన్ని ఉంచి సమాంతరతను కాపాడాం.
- source_word: גָּבֶר
  choice: మనిషి
  rationale: పదం వ్యాకరణపరంగా పుంలింగ ఏకవచనమైనా, ఇక్కడ మానవుణ్ణి సాధారణంగా సూచిస్తుంది; ఆధునిక తెలుగులో ‘మనిషి’ సహజంగా ఆ ప్రతినిధి భావాన్ని అందిస్తుంది.
- source_word: כִּי
  choice: నిజానికి
  rationale: రెండవ పాదాన్ని వివరణాత్మకంగా లేదా నొక్కిచెప్పే విధంగా అనుసంధానించే భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: עָלֵימוֹ
  choice: తనకే
  rationale: על మరియు సర్వనామ ప్రత్యయం ఇక్కడ ప్రయోజనం ఆ వ్యక్తికే చెందుతుందని సూచిస్తున్నాయి; ‘కే’ వ్యత్యాసాన్ని స్పష్టంగా, సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: מַשְׂכִּיל
  choice: వివేకమున్నవాడు
  rationale: שכל మూలం నుంచి వచ్చిన ఈ కృదంతం అవగాహనతో, వివేకంతో ఉండే వ్యక్తిని సూచిస్తుంది; ‘వివేకమున్నవాడు’ ఆధునిక, గౌరవప్రదమైన తెలుగు.
theological_decisions:
- issue: మానవుడు దేవునికి ప్రయోజనం చేకూర్చగలడా, జ్ఞానం వల్ల కలిగే ప్రయోజనం ఎవరికి చెందుతుంది?
  choice: మొదటి పాదాన్ని అలంకారిక ప్రశ్నగా, రెండవ పాదాన్ని వివేకం వల్ల కలిగే ప్రయోజనం ఆ వ్యక్తికే చెందుతుందని తెలిపే వాక్యంగా అనువదించాం.
  alternative: రెండవ పాదాన్ని బలమైన వ్యత్యాసం లేకుండా, ‘వివేకమున్నవాడు తనకు ప్రయోజనం కలిగించుకుంటాడు’ అని సాధారణ సత్యంగా చదవవచ్చు.
  rationale: హీబ్రూ సమాంతర నిర్మాణం దేవునికి కలిగే ప్రయోజనాన్ని, మనిషికే కలిగే ప్రయోజనంతో ఎదురెదురుగా ఉంచుతుంది. అయితే దీనిని విస్తరించి అదనపు సిద్ధాంత ప్రకటనగా మార్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ప్రశ్నోత్తర శైలి వాడబడింది. ‘ప్రయోజనకరంగా’ అనే పదం వాణిజ్యార్థాన్ని అతిగా రానివ్వకుండా మూలంలోని ఉపయోగం/లాభం భావాన్ని నిలుపుతుంది; [a] ప్రత్యామ్నాయంలో ‘లాభం’ అనే మరింత అక్షరార్థ పదాన్ని ఇచ్చాం.
