base_translation:
  language: en
  yaml_path: translation/ot/job/022/018.yaml
  text: Yet he filled their houses with good things[b][a], but the counsel of the wicked is far from me.
translation:
  language: te
  text: అయినా ఆయన వారి ఇళ్లను మంచి వాటితో నింపాడు[a]; అయితే దుష్టుల ఆలోచన నాకు దూరంగా ఉంది[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “మేలుతో.” సందర్భంలో ఇది మంచి వాటిని లేదా ఉపకారాలను సూచిస్తుంది; “సమృద్ధితో” అని కూడా భావానువాదం చేయవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: 'మరొక సాధ్యమైన భావం: “దుష్టుల ఆలోచన నాకు దూరంగా ఉండుగాక.” అయితే హీబ్రూ మరింత నేరుగా, “దుష్టుల ఆలోచన నాకు దూరంగా ఉంది” అనే ప్రకటనగా ఉంది.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהוּא
  choice: అయినా ఆయన
  rationale: ముందరి సందర్భంలో దుష్టులు దేవుణ్ణి తిరస్కరించిన దానికి విరుద్ధంగా దేవుడు వారికి మేలు చేసిన భావాన్ని సంధి మరియు సర్వనామం సూచిస్తున్నాయి; దేవుడనే కర్తను స్పష్టంగా ఉంచుతుంది.
- source_word: מִלֵּא
  choice: నింపాడు
  rationale: హీబ్రూ క్రియ యొక్క ప్రాథమిక అర్థమైన ‘నింపుట’ను, కవితాత్మక గతసందర్భానికి తగిన భూతకాలంలో నిలుపుతుంది.
- source_word: בָתֵּיהֶם
  choice: వారి ఇళ్లను
  rationale: ‘వారి ఇళ్లు’ అనే హీబ్రూ దృశ్యరూపాన్ని వ్యాఖ్యానాత్మకమైన ‘కుటుంబాలు’ లేదా ‘జీవితాలు’గా మార్చకుండా కాపాడుతుంది.
- source_word: טוֹב
  choice: మేలులతో
  rationale: ఇక్కడ ‘మేలు’ నామవాచకార్థంలో వాడబడింది. తెలుగు బహువచన రూపం మంచి వాటిని లేదా ఉపకారాలను సహజంగా సూచిస్తుంది; ‘సమృద్ధి’ కంటే మూలానికి దగ్గరగా ఉంటుంది.
- source_word: וַעֲצַת
  choice: అయితే ... ఆలోచన
  rationale: రెండో పాదం దుష్టుల దృక్పథం నుంచి వక్తను వేరుచేస్తున్నందున సంధిని వ్యతిరేకార్థకంగా ఇచ్చాం. עֵצָה సలహా, యోచన లేదా సంకల్పాన్ని సూచించగలదు; ‘ఆలోచన’ ఈ పరిధిని సహజంగా నిలుపుతుంది.
- source_word: רְשָׁעִים
  choice: దుష్టుల
  rationale: నామవాచకంగా వాడిన హీబ్రూ బహువచన విశేషణానికి ఆధునిక ప్రామాణిక తెలుగు రూపం.
- source_word: רָחֲקָה מֶנִּי
  choice: నాకు దూరం
  rationale: హీబ్రూ వాక్యం ఆజ్ఞ లేదా ప్రార్థనకన్నా స్థితిని తెలిపే ప్రకటనగా నేరుగా ఉంది. తెలుగులో వర్తమాన స్థితిని సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: చివరి పాదంలో వక్త వైఖరి
  choice: ‘దుష్టుల ఆలోచన నాకు దూరం’ అనే వియోగ ప్రకటన
  alternative: ‘దుష్టుల ఆలోచన నాకు దూరంగా ఉండుగాక’ అనే కోరిక లేదా ప్రార్థన
  rationale: హీబ్రూలో ఆజ్ఞార్థక లేదా జస్సివ్ రూపం కాకుండా qatal రూపం ఉంది. అందువల్ల మూలంలోని ప్రకటనాత్మక భావాన్ని నిలిపి, భక్తిపూర్వక కోరికను అదనంగా చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కవితాత్మక గద్యం. ‘ఇళ్లు’ అనే స్పష్టమైన మూలచిత్రాన్ని, చివరి పాదంలోని ప్రకటనాత్మక ఉద్వేగాన్ని నిలిపాం. పాదాల వ్యత్యాసాన్ని సెమీకోలన్‌తో చూపించాం.
