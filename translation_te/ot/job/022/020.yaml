  text: אִם לֹ֣א נִכְחַ֣ד קִימָ֑/נוּ וְ֝/יִתְרָ֗/ם אָ֣כְלָה אֵֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/022/020.yaml
  text: Surely our adversaries have been cut off[b][a], and fire has consumed what was left of them.
translation:
  language: te
  text: నిశ్చయంగా మన విరోధులు నిర్మూలమయ్యారు[a]; వారిలో మిగిలినదాన్ని[b] అగ్ని దహించింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘మన విరోధులు’ అని అనువదించిన కִימָנוּ అనే హీబ్రూ రూపం క్లిష్టమైనది. దీనిని ‘మన ఆస్తి’ లేదా ‘మన సంపద’ అని కూడా అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
  - marker: b
    text: లేదా ‘వారి శేషాన్ని.’
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם לֹא
  choice: నిశ్చయంగా
  rationale: ఇక్కడ ఇది నిజమైన షరతును సూచించకుండా, బలమైన నిశ్చయ ప్రకటనగా పనిచేస్తుంది.
- source_word: נִכְחַד
  choice: నిర్మూలమయ్యారు
  rationale: నిఫాల్ రూపంలోని కర్మణి/ఫలిత భావాన్ని, పూర్తిగా తొలగించబడిన స్థితిని ఈ పదం సహజంగా తెలియజేస్తుంది.
- source_word: קִימָנוּ
  choice: మన విరోధులు
  rationale: హీబ్రూ రూపం క్లిష్టమైనది. తరువాతి భాగంలోని ‘వారిలో మిగిలినది’ అనే భావంతో సమాంతరంగా, మనకు ఎదిరిగా లేచినవారిని సూచించే సందర్భార్థాన్ని ప్రధాన పాఠంలో ఎంచుకున్నాం.
- source_word: וְיִתְרָם
  choice: వారిలో మిగిలినదాన్ని
  rationale: יתר మిగిలినది లేదా శేషం అనే భావాన్ని ఇస్తుంది; ప్రత్యయం నాశనమైన ఆ సమూహాన్ని సూచిస్తుంది.
- source_word: אָכְלָה אֵשׁ
  choice: అగ్ని దహించింది
  rationale: అగ్ని పూర్తిగా తినివేయడం లేదా నాశనం చేయడం అనే స్పష్టమైన హీబ్రూ చిత్రాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
