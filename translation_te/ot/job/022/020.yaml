translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే జ్ఞానసాహిత్యానికి తగిన గంభీరతతో అనువదించబడింది. మూలంలోని బలమైన నిశ్చయ భావం, కర్మణి ఫలితార్థం, అగ్ని దహించే దృశ్యరూపం నిలుపబడ్డాయి; క్లిష్టమైన קִימָנוּ రూపంలోని నిజమైన అనిశ్చితి పాదటిప్పణిలో భద్రపరచబడింది.
