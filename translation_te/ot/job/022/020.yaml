  source_fidelity: మూలంలోని אִם־לֹא యొక్క దృఢనిశ్చయార్థం ‘నిశ్చయంగా’ ద్వారా సరిగ్గా వ్యక్తమైంది. נִכְחַד యొక్క ఫలితాత్మక నిష్క్రియ భావాన్ని ‘నిర్మూలమయ్యారు’ సముచితంగా ఇస్తుంది. క్లిష్టమైన קִימָנוּ ను సందర్భానుసారంగా ‘మన విరోధులు’గా తీసుకొని, దాని ప్రత్యామ్నాయ అర్థాన్ని పాదటిప్పణిలో ఉంచడం మూలంలోని అనిశ్చితిని కాపాడుతుంది. וְיִתְרָם మరియు అగ్ని దహన చిత్రణ కూడా విశ్వసనీయంగా ఉన్నాయి.
