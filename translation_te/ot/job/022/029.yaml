review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the plural abasement, the singular addressee, and the final third-person singular verb. However, ‘అణచివేయబడినప్పుడు’ can suggest oppression rather than being brought/cast low, and ‘వారికి ఉన్నతి కలగాలి!’ turns the elliptical noun גֵּוָה into a wish or command. The Hebrew is better represented as a terse declaration of reversal. The final subject remains implicit in Hebrew; an uncapitalized Telugu pronoun preserves this without making an explicit theological identification.
  naturalness: ‘కళ్లు వాలినవానిని’ is a more idiomatic modern Telugu expression than ‘కళ్లను దించుకున్నవాణ్ణి’ and can convey either dejection or humility without implying a deliberate action. The revised sentence is fluent and maintains the solemn register.
  terminology: ‘దిగజార్చబడినప్పుడు’ reflects the lowering/abasement image more closely than ‘అణచివేయబడినప్పుడు.’ ‘ఉన్నతి కలుగుతుంది!’ renders the positive reversal while avoiding the introduced volitional force of ‘కలగాలి.’ ‘రక్షిస్తాడు’ suitably represents יוֹשִׁעַ.
  issues:
  - severity: medium
    issue: ‘వారికి ఉన్నతి కలగాలి!’ gives גֵּוָה an imperative/wish sense.
    rationale: The difficult Hebrew word is an elliptical noun, conventionally understood here as ‘uplift/exaltation’ or ‘there is lifting up,’ not explicitly as a request that uplift occur.
  - severity: low
    issue: ‘అణచివేయబడినప్పుడు’ is narrower than the source image.
    rationale: It may imply oppression by a ruler or oppressor, whereas שׁפל here concerns being made low, humbled, or cast down.
  - severity: low
    issue: ‘కళ్లను దించుకున్నవాణ్ణి’ can imply intentional lowering of one’s eyes.
    rationale: The Hebrew idiom describes one low/downcast in respect of the eyes; ‘కళ్లు వాలినవానిని’ preserves the image more naturally and leaves humility/dejection open.
  revised_text: ఎందుకంటే, వారు దిగజార్చబడినప్పుడు[a], “ఉన్నతి కలుగుతుంది!” అని నీవు అంటావు; కళ్లు వాలినవానిని[b] అతడు రక్షిస్తాడు.
