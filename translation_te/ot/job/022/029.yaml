  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּֽי הִ֭שְׁפִּילוּ וַ/תֹּ֣אמֶר גֵּוָ֑ה וְ/שַׁ֖ח עֵינַ֣יִם יוֹשִֽׁעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/022/029.yaml
  text: For when they are brought low[a], you say[b], ‘Lift them up!’ and he saves the one with downcast eyes.
translation:
  language: te
  text: ఎందుకంటే, వారు దిగజార్చబడినప్పుడు[a], “ఉన్నతి కలుగుతుంది!” అని నీవు అంటావు; కళ్లు వాలినవానిని[b] అతడు రక్షిస్తాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారు కూలదోయబడినప్పుడు, ‘ఉన్నతి ఉంది!’ అని నీవు అంటావు.” హీబ్రూ వాక్యభాగం సంక్షిప్తంగా, అసంపూర్ణంగా ఉంది; దాన్ని మరింత అక్షరార్థంగా ఇలా అనువదించవచ్చు.
    reason: alternative_reading
  - marker: b
    text: అక్షరార్థంగా, “కళ్ల విషయంలో దిగువగా ఉన్నవానిని”; అంటే వినయస్థుణ్ణి లేదా నిరుత్సాహపడినవాణ్ణి.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే, ...ప్పుడు
  rationale: ముందున్న వాగ్దానానికి కారణాన్ని లేదా అది నెరవేరే సందర్భాన్ని పరిచయం చేస్తుంది; హీబ్రూ పదంలోని కారణార్థక, కాలార్థక ఛాయలను తెలుగులో సహజంగా కలిపి వ్యక్తం చేస్తుంది.
- source_word: הִשְׁפִּילוּ
  choice: వారు అణచివేయబడినప్పుడు
  rationale: שׁפל మూలం దిగజార్చబడడం లేదా దీనస్థితికి రావడం అనే భావం ఇస్తుంది. రూపం బహువచనాన్ని సూచిస్తున్నందున దానిని నిలిపి, సందర్భానుగుణంగా స్థితిని తెలిపే కర్మణి ప్రయోగం వాడబడింది.
- source_word: וַתֹּאמֶר
  choice: నీవు అంటావు
  rationale: ఎలీఫజు సంబోధిస్తున్న ఏకవచన వ్యక్తినే సూచిస్తుంది. సందర్భంలోని సామెతసదృశమైన వాగ్దాన భావానికి తెలుగు వర్తమాన రూపం సహజంగా సరిపోతుంది.
- source_word: גֵּוָה
  choice: వారికి ఉన్నతి కలగాలి!
  rationale: ఈ నామవాచకంతో ఉన్న హీబ్రూ వాక్యభాగం అసంపూర్ణంగా, సంక్షిప్తంగా ఉంది. అణచివేయబడడానికి విరుద్ధంగా ఉన్నతి లేదా పైకి లేపబడడం అనే సానుకూల భావాన్ని వ్యక్తం చేస్తూ, ముందున్న బహువచనంతో సహజ సంబంధం ఏర్పడేలా అనువదించబడింది.
- source_word: וְשַׁח עֵינַיִם
  choice: కళ్లను దించుకున్నవాణ్ణి
  rationale: అక్షరార్థంగా ‘కళ్ల విషయంలో దిగువగా ఉన్నవాడు’ అనే చిత్రాన్ని నిలుపుతుంది. ఇది వినయస్థుణ్ణి లేదా నిరుత్సాహపడిన వ్యక్తిని సూచించవచ్చు; ఆ రెండు భావాల్లో ఒక్కదానికే పరిమితం చేయలేదు.
- source_word: יוֹשִׁעַ
  choice: ఆయన రక్షిస్తాడు
  rationale: ישׁע మూలంలోని రక్షించడం లేదా విడిపించడం అనే భావాన్ని ‘రక్షిస్తాడు’ సహజంగా తెలియజేస్తుంది. క్రియ తృతీయ పురుష ఏకవచనంలో ఉంది; సందర్భంలో సూచిత కర్త దేవుడు అయినప్పటికీ, మూలంలో లేని ‘దేవుడు’ అనే నామాన్ని చేర్చలేదు.
theological_decisions:
- issue: יוֹשִׁעַ అనే క్రియకు కర్త
  choice: సందర్భంలో దేవుణ్ణి సూచించే ‘ఆయన’ను కర్తగా ఉంచడం
  alternative: ‘ఎవరో రక్షిస్తారు’ అనే అనిర్దిష్ట కర్తగా తీసుకోవడం; లేదా సంబోధితుడే కర్తగా ‘నీవు రక్షిస్తావు’ అని అనువదించడం
  rationale: హీబ్రూ క్రియ తృతీయ పురుష పుంలింగ ఏకవచనంలో ఉంది; కాబట్టి ‘నీవు’ కర్త కాదు. సందర్భం దేవుణ్ణి సూచించినా, మూలపాఠంలోని సంక్షిప్తతను కాపాడేందుకు ఆయన పేరును స్పష్టంగా చేర్చలేదు.
- issue: గֵּוָה యొక్క భావం
  choice: అణచివేతకు విరుద్ధమైన ఉన్నతిని కోరే ప్రకటనగా ‘వారికి ఉన్నతి కలగాలి!’
  alternative: ‘ఉన్నతి ఉంది!’ లేదా కేవలం ‘ఉన్నతి!’; ప్రతికూలార్థంలో ‘గర్వం’
  rationale: గֵּוָה కొన్నిచోట్ల గర్వం లేదా ఔన్నత్యాన్ని సూచించగలిగినా, ఇక్కడ అణచివేయబడడానికి నేరుగా విరుద్ధంగా ఉన్నందున సానుకూలమైన పైకి లేపబడే భావం సందర్భానికి బాగా సరిపోతుంది. అయినప్పటికీ హీబ్రూ వాక్యభాగంలోని అసంపూర్ణతను పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, అయినా గంభీరత కోల్పోకుండా అనువదించబడింది. ‘అణచివేయబడినప్పుడు,’ ‘ఉన్నతి,’ ‘కళ్లను దించుకున్నవాణ్ణి’ అనే పదబంధాలు మూలంలోని దిగజార్చడం–పైకి లేపడం అనే వ్యతిరేక చిత్రాన్ని కాపాడుతాయి.
