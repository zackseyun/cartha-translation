  yaml_path: translation/ot/job/022/010.yaml
  text: Therefore snares are all around you[a], and sudden terror terrifies you.
translation:
  language: te
  text: అందుచేత నీ చుట్టూ ఉచ్చులు ఉన్నాయి; ఆకస్మిక భయం నిన్ను భయభ్రాంతికి గురిచేస్తుంది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఉచ్చులు నిన్ను చుట్టుముట్టాయి; భయం నిన్ను హఠాత్తుగా కలవరపెడుతుంది.”
    reason: హీబ్రూ పదక్రమంలో פִּתְאֹם అనే పదాన్ని ‘ఆకస్మిక భయం’గా నామవాచకంతో కలిపి గ్రహించవచ్చు; లేదా ‘హఠాత్తుగా కలవరపెడుతుంది’గా క్రియను విశేషించే పదంగా గ్రహించవచ్చు. అలాగే మొదటి భాగాన్ని స్థితిగా లేదా క్రియాత్మకంగా అనువదించవచ్చు.
lexical_decisions:
- source_word: עַל כֵּן
  choice: అందుచేత
  rationale: ముందటి ఆరోపణల ఫలితాన్ని లేదా పర్యవసానాన్ని సూచించే హేత్వర్థక సంబంధాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: סְבִיבוֹתֶיךָ
  choice: నీ చుట్టూ ఉన్నాయి
  rationale: ఒక వ్యక్తిని అన్ని వైపులా ఆవరించిన స్థితిని సూచిస్తుంది; ‘ఉచ్చులు’తో కలిపి తెలుగులో సహజమైన వాక్యనిర్మాణాన్ని ఇస్తుంది.
- source_word: פַחִים
  choice: ఉచ్చులు
  rationale: పట్టుకోవడానికి వేసే ఉచ్చు లేదా వల అనే మూలార్థాన్ని, ఇక్కడి రూపకాలంకారమైన ప్రమాద భావాన్ని నిలుపుతుంది.
- source_word: וִיבַהֶלְךָ
  choice: నిన్ను భయభ్రాంతికి గురిచేస్తుంది
  rationale: בהל క్రియలోని దిగ్భ్రాంతి, కలవరం, భయపెట్టడం అనే తీవ్రమైన ప్రభావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: פַּחַד
  choice: భయం
  rationale: తీవ్రమైన భయం లేదా భీతి అనే అర్థాన్ని ఇస్తుంది; క్రియతో కలిసి సందర్భంలోని ముప్పు తీవ్రతను తెలియజేస్తుంది.
- source_word: פִּתְאֹם
  choice: ఆకస్మిక
  rationale: హఠాత్తుగా సంభవించే స్వభావాన్ని తెలుపుతుంది. ప్రధాన పాఠంలో దీనిని ‘భయం’కు విశేషణంగా అమర్చడం తెలుగు ప్రవాహానికి అనుకూలం; క్రియావిశేషణంగా గ్రహించే అవకాశం పాదటిప్పణిలో నిలుపబడింది.
