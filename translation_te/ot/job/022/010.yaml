  register: ఆధునిక ప్రామాణిక తెలుగు; కవితాత్మక గంభీరతను ఉంచుతూ సాధారణ పాఠకుడికి అర్థమయ్యే పదజాలం వాడబడింది. హీబ్రూ కవిత్వంలోని సంక్షిప్తతను, అకస్మాత్తుగా చుట్టుముట్టే ప్రమాద భావాన్ని కాపాడింది.
