  yaml_path: translation/ot/job/022/026.yaml
  text: For then you will delight yourself in the Almighty[b][a], and lift up your face to God.
translation:
  language: te
  text: ఎందుకంటే అప్పుడు నీవు సర్వశక్తిమంతునిలో ఆనందిస్తావు[a]; దేవునివైపు నీ ముఖాన్ని ఎత్తుతావు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘సర్వశక్తిమంతునిలో ఆనందం పొందుతావు.’
    reason: lexical_alternative
  - marker: b
    text: ‘దేవునివైపు నీ ముఖాన్ని ఎత్తడం’ అనే నుడికారం ధైర్యంగా ఆయనను సమీపించడం, తిరిగి అనుగ్రహం పొందడం, లేదా ధైర్యంగా ప్రార్థించడం అనే భావాలను సూచించవచ్చు.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי אָז
  choice: ఎందుకంటే అప్పుడు
  rationale: ముందటి ఉపదేశాన్ని అనుసరించే ఫలితాన్ని లేదా పర్యవసానాన్ని సూచించే హేతు-కాల సంబంధాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: עַל שַׁדַּי
  choice: సర్వశక్తిమంతునిలో
  rationale: עַל అనేది ఇక్కడ ఆనందానికి ఆధారమైన వ్యక్తిని సూచిస్తుంది; שַׁדַּי అనే దైవ బిరుదును అర్థవంతంగా, తెలుగు పాఠకులకు స్పష్టంగా అనువదిస్తుంది.
- source_word: תִּתְעַנָּג
  choice: నీవు ఆనందిస్తావు
  rationale: హిత్పయేల్ రూపం వ్యక్తిగతంగా ఆనందం పొందడాన్ని తెలియజేస్తుంది. ‘ఆనందిస్తావు’ ఆధునిక తెలుగులో సహజంగా ఉండి ఆ భావాన్ని అందిస్తుంది.
- source_word: וְתִשָּׂא
  choice: ఎత్తుతావు
  rationale: נשׂא యొక్క ‘ఎత్తు’ అనే దృశ్యరూపాన్ని, ముఖంతో కూడిన మూలభాషా నుడికారాన్ని నిలుపుతుంది.
- source_word: אֶל אֱלוֹהַּ
  choice: దేవునివైపు
  rationale: אֶל సూచించే దిశను సహజమైన తెలుగులో తెలియజేస్తుంది; אֱלוֹהַּకు అదనపు దైవబిరుదును చేర్చకుండా ‘దేవుడు’ అని అనువదిస్తుంది.
- source_word: פָּנֶיךָ
  choice: నీ ముఖాన్ని
  rationale: మూలంలోని స్పష్టమైన శరీర దృశ్యాన్ని నిలుపుతుంది; దానిని కేవలం ప్రార్థనగా లేదా నిరీక్షణగా పరిమితం చేయదు.
theological_decisions:
- issue: ‘దేవునివైపు ముఖాన్ని ఎత్తడం’ అనే నుడికారపు భావం
  choice: దేవునివైపు నీ ముఖాన్ని ఎత్తుతావు
  alternative: నీవు దేవుణ్ణి ధైర్యంగా సమీపిస్తావు / దేవునికి ధైర్యంగా ప్రార్థిస్తావు
  rationale: ఈ హీబ్రూ నుడికారం ధైర్యంగా సమీపించడం, అనుగ్రహం తిరిగి పొందడం, లేదా ధైర్యంగా ప్రార్థించడం వంటి భావాలను సూచించవచ్చు. ఒకే అర్థానికి పరిమితం చేయకుండా కవితాత్మకమైన దృశ్యాన్ని, వేదాంతపరమైన విస్తృతిని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. మూలంలోని దైవబిరుదు, ఆనంద భావం, ముఖాన్ని ఎత్తే కవితాత్మక నుడికారం నిలుపబడ్డాయి; నుడికారానికి సాధ్యమైన ఒక్క వేదాంతార్థాన్ని మాత్రమే రుద్దలేదు.
