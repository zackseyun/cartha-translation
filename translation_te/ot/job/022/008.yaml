  yaml_path: translation/ot/job/022/008.yaml
  text: But the land belonged to the strong man[b][a], and the favored man lived in it.
translation:
  language: te
  text: 'కాని భూమి బలవంతునిదిగా[a] ఉండేది;

    ఆదరణ పొందినవాడు[b] దానిలో నివసించేవాడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: పదశః, “బాహువుగల మనిషి”; ఇది బలం లేదా అధికారంగల వ్యక్తిని సూచించే నుడికారం.
    reason: lexical_alternative
  - marker: b
    text: లేదా “గౌరవం పొందినవాడు,” “అనుకూలంగా చూడబడినవాడు,” లేదా “పక్షపాతంతో ప్రాధాన్యం పొందినవాడు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ
  choice: కాని ... వాడు
  rationale: ముందున్న వచనాల్లో బలహీనులకు జరిగిన నిరాకరణకు, ఇక్కడ బలవంతుడు పొందిన ఆధిక్యానికి మధ్య ఉన్న వ్యత్యాసాన్ని సందర్భానుసారంగా ‘కాని’ తెలియజేస్తుంది. אִישׁను తెలుగులో వ్యక్తిని సూచించే ‘వాడు’ రూపంలో సహజంగా వ్యక్తపరిచాం.
- source_word: זְרוֹעַ
  choice: బలవంతుడు
  rationale: పదశః ‘చేయి/బాహువు’; אִישׁ זְרוֹעַ అనే ప్రయోగం బలం లేదా అధికారంగల వ్యక్తిని సూచిస్తుంది. అందువల్ల సహజమైన తెలుగులో ‘బలవంతుడు’ అని అనువదించాం.
- source_word: לוֹ הָאָרֶץ
  choice: భూమి ... నిదిగా ఉండేది
  rationale: לְ ప్రత్యయంతో కూడిన సర్వనామం ఇక్కడ స్వాధీనత లేదా నియంత్రణను సూచిస్తుంది—‘భూమి అతనిది.’ సందర్భంలోని గతకాల ఆరోపణకు తగినట్లుగా ‘ఉండేది’ వాడాం.
- source_word: וּנְשׂוּא פָנִים
  choice: ఆదరణ పొందినవాడు
  rationale: పదశః ‘ముఖం ఎత్తబడినవాడు’; ఇది గౌరవం పొందిన, అనుకూలంగా చూడబడిన, లేదా పక్షపాతంతో ప్రాధాన్యం పొందిన వ్యక్తిని సూచించగల నుడికారం. ‘ఆదరణ పొందినవాడు’ ఈ అర్థపరిధిని అతిగా నిర్ధారించకుండా నిలుపుతుంది.
- source_word: יֵשֶׁב בָּהּ
  choice: దానిలో నివసించేవాడు
  rationale: יָשַׁב అంటే కూర్చోవడం, నివసించడం, స్థిరపడడం. ఇక్కడ భూమిని ఆక్రమించి నివసించే స్థితి ఉద్దేశం; అసంపూర్ణ క్రియారూపంలోని కొనసాగింపు లేదా అలవాటు భావాన్ని ‘నివసించేవాడు’ సహజంగా తెలియజేస్తుంది.
