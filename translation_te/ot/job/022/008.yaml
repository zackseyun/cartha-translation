  terminology: “బలవంతుడు” appropriately communicates strength or power without forcing a literal-body-part reading into the text. “ఆదరణ పొందినవాడు” naturally retains the source idiom’s possible senses of honor, favorable treatment, and partiality. The footnotes responsibly preserve the literal and alternative senses.
