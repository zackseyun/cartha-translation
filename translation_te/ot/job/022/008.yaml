translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గంభీరమైన శైలి వాడబడింది. సమాంతర కవితా నిర్మాణాన్ని రెండు పాదాలుగా నిలిపి, సందర్భంలోని వ్యత్యాసాన్ని ‘కాని’తో స్పష్టం చేశాం; ‘ఆదరణ’ అనే పదంతో గౌరవం, అనుకూలత, పక్షపాతం అనే సాధ్యార్థాల మధ్య ఉన్న అస్పష్టతను కాపాడాం.
