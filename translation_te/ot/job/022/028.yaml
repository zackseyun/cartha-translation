  text: You will decree a matter[a], and it will be established for you, and light will shine on your ways.
translation:
  language: te
  text: నీవు ఒక విషయాన్ని తీర్మానిస్తావు; అది నీకు స్థిరమవుతుంది, మరియు నీ మార్గాలపై వెలుగు ప్రకాశిస్తుంది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תִגְזַר
  choice: తీర్మానిస్తావు
  rationale: גזר అనే క్రియకు సందర్భానుసారంగా నిర్ణయించడం, తీర్మానించడం, ఆజ్ఞగా ప్రకటించడం అనే భావాలు ఉన్నాయి. ఇక్కడ ‘తీర్మానిస్తావు’ అనేది దృఢమైన నిర్ణయం లేదా ప్రకటన భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; రాజాధికారాన్ని అనవసరంగా సూచించదు.
- source_word: אֹמֶר
  choice: ఒక విషయాన్ని
  rationale: אֹמֶר సాధారణంగా మాట, పలుకు, ప్రకటన అని అర్థమిచ్చినా, גזרతో కలిసిన ఈ ప్రయోగంలో నిర్ణయించిన లేదా పలికిన విషయాన్ని సూచిస్తుంది. ప్రధాన పాఠ్యంలో సహజమైన ‘ఒక విషయాన్ని’ వాడి, అక్షరార్థానికి దగ్గరైన ‘ఒక మాటను’ పాదసూచికలో ఉంచాం.
- source_word: יָקָם
  choice: స్థిరమవుతుంది
  rationale: קום క్రియకు నిలుచుట, నిలిచి ఉండుట, స్థిరపడుట అనే భావాలు ఉన్నాయి. పలికిన తీర్మానం అమలులో నిలిచే భావాన్ని ‘స్థిరమవుతుంది’ అతిశయోక్తి లేకుండా ప్రతిబింబిస్తుంది.
- source_word: לָךְ
  choice: నీకు
  rationale: ל ఇక్కడ సంబంధం లేదా ప్రయోజనాన్ని సూచిస్తుంది. ‘నీకు’ అనేది సంక్షిప్తమైన, సహజమైన సమానార్థకం.
- source_word: דְּרָכֶיךָ
  choice: నీ మార్గాల మీద
  rationale: דרך భౌతిక మార్గాన్నీ, రూపకంగా జీవన గమనాన్నీ సూచించగలదు. ‘మార్గాలు’ అనే రూపకాన్ని నిలిపి ఉంచడం వల్ల వెలుగు ప్రకాశించే కవితాత్మక చిత్రం చెదరకుండా ఉంటుంది.
- source_word: נָגַהּ אֹור
  choice: వెలుగు ప్రకాశిస్తుంది
  rationale: נגהּ అంటే ప్రకాశించడం లేదా వెలుగులు విరజిమ్మడం. ‘వెలుగు ప్రకాశిస్తుంది’ మూలంలోని సరళమైన కవితాత్మక చిత్రాన్ని స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: ఎలీఫజు పలికిన వాగ్దానం స్వభావం
  choice: అతడు నిశ్చయంగా ఆశిస్తున్న ఫలితంగా నేరుగా అనువదించాం; దానిని షరతులేని సార్వత్రిక దైవవాగ్దానంగా బలపరచలేదు.
  alternative: దీనిని సంపద లేదా విజయానికి సంపూర్ణ హామీగా అనువదించడం; లేదా కేవలం ఒక అవకాశంగా బలహీనపరచడం.
  rationale: ఇది ఎలీఫజు ప్రసంగంలోని ధీమాతో కూడిన ప్రకటన. యోబు గ్రంథం చివరికి అతని వాదనలన్నింటినీ సమర్థించదు. కాబట్టి మూలంలోని నిశ్చయ భావాన్ని ఉంచుతూ, అదనపు సిద్ధాంతపరమైన హామీని చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా ఉండే శైలిని వాడాం. ‘తీర్మానిస్తావు’, ‘స్థిరమవుతుంది’ అనే పదాలు మూలంలోని అధికారపూర్వక ధోరణిని అతిగా రాజాజ్ఞగా మార్చకుండా నిలుపుతాయి; రెండో వాక్యంలో కవితాత్మక ‘మార్గాలు—వెలుగు’ రూపకాన్ని యథాతథంగా ఉంచాం.
