source:
  edition: WLC
  text: עָבִ֣ים סֵֽתֶר ל֭/וֹ וְ/לֹ֣א יִרְאֶ֑ה וְ/ח֥וּג שָׁ֝מַ֗יִם יִתְהַלָּֽךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/022/014.yaml
  text: Clouds are a covering for him[a], so that he does not see; and he walks on the vault of heaven.
translation:
  language: te
  text: మేఘాలు ఆయనకు ఆవరణంగా ఉన్నాయి[a]; అందువల్ల ఆయన చూడడు; ఆయన ఆకాశపు వలయం మీద నడుస్తాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దట్టమైన మేఘాలు ఆయనకు ఆవరణంగా ఉన్నాయి, ఆయన చూడడు; ఆయన ఆకాశాల వలయం మీద నడుస్తాడు.”
    reason: עָבִיםకు ‘దట్టమైన మేఘాలు’ అనే సాధ్యమైన అర్థాన్ని, וְלֹא יִרְאֶהలోని సమన్వయార్థాన్ని, మరియు שָׁמַיִםకు బహువచనమైన ‘ఆకాశాలు’ అనే ప్రత్యామ్నాయాన్ని సూచిస్తుంది.
lexical_decisions:
- source_word: עָבִים
  choice: మేఘాలు
  rationale: ఈ బహువచన నామవాచకం దట్టమైన వర్షమేఘాలను కూడా సూచించగలదు. అయితే తరువాతి ‘మరుగుగా’ అనే మాట వాటి కప్పివేసే స్వభావాన్ని ఇప్పటికే తెలియజేస్తుంది కాబట్టి సహజమైన ‘మేఘాలు’ను ఎంచుకున్నాం.
- source_word: סֵתֶר
  choice: మరుగుగా
  rationale: ఈ నామవాచకం దాగుచోటు, మరుగు లేదా కప్పుదలను సూచిస్తుంది. ఇక్కడ మేఘాలు చూపును అడ్డుకునే ఆవరణమనే భావాన్ని ‘మరుగు’ సహజంగా వ్యక్తపరుస్తుంది.
- source_word: לוֹ
  choice: ఆయనకు
  rationale: ‘మేఘాలు ఆయనకు మరుగుగా ఉన్నాయి’ అనే నిర్మాణంలో ఈ విభక్తి ప్రత్యయం, ఆయన విషయంలో మేఘాలు తెరలా పనిచేస్తున్నాయని తెలియజేస్తుంది.
- source_word: וְלֹא יִרְאֶה
  choice: అందువల్ల ఆయన చూడడు
  rationale: హీబ్రూ సంధి సమన్వయార్థంగా ‘మరియు’ అని గానీ, ఫలితార్థంగా గానీ అర్థమవుతుంది. ముందున్న మరుగు భావంతో సంబంధాన్ని సహజంగా చూపేందుకు ఫలితార్థాన్ని ప్రధాన పాఠ్యంలో ఉంచి, సమన్వయార్థాన్ని పాదసూచికలో నిలిపాం.
- source_word: חוּג
  choice: వలయం
  rationale: ఈ పదం వృత్తం, వలయం లేదా ఆకాశపు వంపును సూచించగలదు. ‘ఆకాశమండలపు వలయం’ మూలంలోని దృశ్యరూపాన్ని నిలుపుతూ నిర్దిష్ట విశ్వనిర్మాణ సిద్ధాంతాన్ని రుద్దదు.
- source_word: שָׁמַיִם
  choice: ఆకాశమండలం
  rationale: ఈ సందర్భంలో దేవుడు సంచరించే ఉన్నత ఆకాశవిస్తారాన్ని సూచించేందుకు ఆధునిక, గంభీరమైన ‘ఆకాశమండలం’ సరిపోతుంది.
- source_word: יִתְהַלָּךְ
  choice: నడుస్తాడు
  rationale: הלך క్రియ యొక్క హిత్పయేల్ రూపం నడుచుట లేదా అటూ ఇటూ సంచరించుటను సూచిస్తుంది. ‘నడుస్తాడు’ సంక్షిప్తంగా ఉండి మూలంలోని మానవరూపక చిత్రణను కాపాడుతుంది.
theological_decisions:
- issue: మాట్లాడేవారి దృష్టికోణం మరియు సూచిత కర్త
  choice: ‘ఆయన’ అనే సర్వనామాన్ని అలాగే ఉంచి, సందర్భం ద్వారా అది దేవుణ్ణి సూచించేలా అనువదించాం; దేవుడు మేఘాల వెనుక ఉండి చూడడని ఎలీఫజు దుష్టులకు ఆపాదిస్తున్న వాదనగా వచనం కొనసాగుతుంది.
  alternative: దేవుని అతీతత్వం గురించి తటస్థ ప్రకటనగా అనువదించడం, లేదా ‘దేవుడు’ అనే పేరును పాఠ్యంలో చేర్చడం.
  rationale: యోబు 22:13-14లో ఎలీఫజు దుష్టుని మాటలుగా ఆరోపిస్తున్న భావమే కొనసాగుతుంది. మూలంలో పేరు లేక సర్వనామమే ఉన్నందున ‘దేవుడు’ అని స్పష్టీకరించకుండా సంభాషణలోని ఉద్రిక్తతను, సందర్భాధారిత సూచనను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరమైన శైలిని వాడాం. ‘ఆయన’ గౌరవ సర్వనామం సందర్భంలోని దేవుని సూచిస్తుంది; మూలంలో లేని ‘దేవుడు’ అనే నామాన్ని చేర్చలేదు. కవితాత్మక ఆకాశ దృశ్యాన్ని ‘ఆకాశమండలపు వలయం’గా నిలిపాం.
