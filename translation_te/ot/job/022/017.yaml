  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: הָ/אֹמְרִ֣ים לָ֭/אֵל ס֣וּר מִמֶּ֑/נּוּ וּ/מַה יִּפְעַ֖ל שַׁדַּ֣י לָֽ/מוֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/022/017.yaml
  text: who said to God, ‘Depart from us,’ and, ‘What can the Almighty do to them?’
translation:
  language: te
  text: 'దేవునికి, “మమ్మల్ని విడిచి వెళ్లిపో,” అనీ,

    “సర్వశక్తుడు వారికి ఏమి చేయగలడు?” అనీ చెప్పినవారు.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: סוּר מִמֶּנּוּ
  choice: మా దగ్గర నుంచి తొలగిపో
  rationale: సוּר అనే ఆజ్ఞారూపంలోని ‘తొలగిపో/దూరంగా పో’ భావాన్ని, מִמֶּנּוּలోని మొదటి పురుష బహువచనార్థాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: שַׁדַּי
  choice: సర్వశక్తుడు
  rationale: యోబు గ్రంథంలో ఈ దైవనామానికి సంప్రదాయంగా ఉన్న అర్థసంబంధమైన తెలుగు రూపం; దేవుని బిరుదుగా గౌరవప్రదంగా ఉంటుంది.
- source_word: לָמוֹ
  choice: వారికి
  rationale: వ్యంజన పాఠంలోని మూడవ పురుష బహువచన సర్వనామార్థాన్ని నేరుగా అనుసరిస్తుంది; ముందున్న ‘మా’గా మార్చి వక్తలతో సమీకరించదు.
theological_decisions:
- issue: לָמוֹ అనే సర్వనామం ఎవరిని సూచిస్తుంది?
  choice: వారికి
  alternative: మాకు
  rationale: WLC పాఠం לָמוֹ సాధారణంగా ‘వారికి’ అని అర్థమిస్తుంది. సందర్భాన్ని బట్టి ‘మాకు’గా సవరించడం సాధ్యమైన వ్యాఖ్యానమైనప్పటికీ, మూలపాఠంలోని వ్యక్తి మార్పును అనువాదంలో నిలిపి దాని ఉద్వేగాన్ని పరిష్కరించకుండా ఉంచాం.
- issue: וּמַה יִּפְעַל అనే ప్రశ్న యొక్క భావం
  choice: ఏమి చేయగలడు?
  alternative: ఏమి చేస్తాడు?
  rationale: ఈ సందర్భంలో ప్రశ్న ధిక్కారపూర్వకంగా దేవుని కార్యసామర్థ్యాన్ని సవాలు చేస్తుంది; తెలుగు ‘చేయగలడు’ ఆ ప్రయోగార్థాన్ని సహజంగా తెలియజేస్తుంది, అయితే అది దేవుని అసమర్థతను అనువాదకుడి నిర్ధారణగా ప్రకటించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; నేరుగా పలికిన ధిక్కార వాక్యాల తీవ్రతను కాపాడుతూ, సహజమైన మరియు గౌరవప్రదమైన బైబిలు గద్యశైలిని ఉపయోగించాం.
