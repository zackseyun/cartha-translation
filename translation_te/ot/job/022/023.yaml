source:
  edition: WLC
  text: אִם תָּשׁ֣וּב עַד שַׁ֭דַּי תִּבָּנֶ֑ה תַּרְחִ֥יק עַ֝וְלָ֗ה מֵ/אָהֳלֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/022/023.yaml
  text: If you return to the Almighty[a], you will be restored; if you put unrighteousness far from your tent[b],
translation:
  language: te
  text: నీవు సర్వశక్తిమంతుని వద్దకు తిరిగివస్తే, పునఃస్థాపించబడతావు[a]; నీ గుడారంలోనుండి అన్యాయాన్ని[b] దూరం చేస్తే,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “కట్టబడతావు,” “మళ్లీ కట్టబడతావు.” హీబ్రూ క్రియకు అక్షరార్థం “కట్టబడడం”; ఇక్కడ అది పునఃస్థాపించబడడం లేదా తిరిగి స్థిరపరచబడడం అనే రూపకార్థంలో ఉంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా “దుష్కార్యాన్ని,” “అక్రమాన్ని.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: తిరిగివస్తే / దూరం చేస్తే
  rationale: ఇది షరతును పరిచయం చేస్తుంది. తెలుగులో క్రియకు జోడించిన ‘-తే’ రూపం షరతును సహజంగా తెలియజేస్తుంది; రెండో క్రియను కూడా అదే షరతుకు కొనసాగింపుగా అందించాం.
- source_word: תָּשׁוּב
  choice: తిరిగివస్తే
  rationale: שוב అనే క్రియకు ప్రాథమిక అర్థం ‘తిరుగు/తిరిగిరా.’ ‘పశ్చాత్తాపపడితే’ అని సంకుచితం చేయకుండా, దేవుని వద్దకు తిరిగివచ్చే భావాన్ని నిలుపుతుంది.
- source_word: עַד
  choice: వద్దకు
  rationale: שובతో కలిసి దేవుని దిశగా తిరిగి రావడాన్ని సూచిస్తుంది. ‘వద్దకు’ ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: שַׁדַּי
  choice: సర్వశక్తిమంతుడు
  rationale: దైవ బిరుదును లిప్యంతరీకరించకుండా అర్థానువాదం చేశాం. ఇది తెలుగులో స్థిరమైన, గౌరవప్రదమైన రూపం.
- source_word: תִּבָּנֶה
  choice: పునఃస్థాపించబడతావు
  rationale: నిఫాల్ రూపానికి అక్షరార్థం ‘కట్టబడతావు/మళ్లీ కట్టబడతావు.’ ఇక్కడ వ్యక్తి తిరిగి స్థిరపరచబడే రూపకార్థాన్ని ‘పునఃస్థాపించబడతావు’ సహజంగా తెలియజేస్తూ కర్మణి భావాన్ని నిలుపుతుంది.
- source_word: תַּרְחִיק
  choice: దూరం చేస్తే
  rationale: רחק హిఫిల్ రూపం ‘దూరంగా ఉండేలా చేయడం’ అనే కారణార్థక భావాన్ని కలిగిస్తుంది; ‘దూరం చేస్తే’ దానిని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: עַוְלָה
  choice: అన్యాయం
  rationale: ఈ నామవాచకం అన్యాయం, అక్రమం, దుష్కార్యం వంటి నైతిక తప్పును సూచిస్తుంది. ‘అన్యాయం’ విస్తృతమైన అర్థాన్ని సహజంగా అందిస్తుంది.
- source_word: מֵאָהֳלֶךָ
  choice: నీ గుడారంలోనుండి
  rationale: మూలంలోని ‘నీ గుడారం నుండి’ అనే స్పష్టమైన చిత్రాన్ని నిలిపి, దాన్ని సాధారణంగా ‘నీ నివాసం’ లేదా ‘నీ ఇంటివారు’ అని విప్పి చెప్పలేదు.
theological_decisions:
- issue: ‘కట్టబడతావు’ అనే పునఃస్థాపన రూపకాన్ని అక్షరార్థంగా ఇవ్వాలా, భావార్థంగా ఇవ్వాలా
  choice: పునఃస్థాపించబడతావు
  alternative: కట్టబడతావు / మళ్లీ కట్టబడతావు
  rationale: మూలంలోని కట్టడం అనే రూపకం ఇక్కడ తిరిగి స్థిరపరచబడటాన్ని సూచిస్తుంది. ప్రధాన పాఠంలో అర్థాన్ని సహజంగా అందించి, అక్షరార్థాన్ని పాదసూచికలో ఉంచాం.
- issue: שובను ‘తిరిగిరావడం’గా ఇవ్వాలా, ‘పశ్చాత్తాపపడడం’గా ఇవ్వాలా
  choice: తిరిగివస్తే
  alternative: పశ్చాత్తాపపడితే / వెనుదిరిగితే
  rationale: మూల క్రియ యొక్క ప్రాథమికమైన ‘తిరుగు/తిరిగిరా’ భావాన్ని నిలుపుతూ, సందర్భంలో ఉండే పశ్చాత్తాప సూచనను ఒక నిర్దిష్ట సిద్ధాంత పదంతో పరిమితం చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడాం. ‘గుడారం’ అనే సాంస్కృతిక చిత్రాన్ని అలాగే ఉంచాం. వచనం తదుపరి భావానికి కొనసాగే షరతు నిర్మాణంగా ఉన్నందున చివర కామాను నిలిపాం.
