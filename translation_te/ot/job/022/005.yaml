  text: הֲ/לֹ֣א רָעָֽתְ/ךָ֣ רַבָּ֑ה וְ/אֵֽין קֵ֝֗ץ לַ/עֲוֺנֹתֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/022/005.yaml
  text: Is not your evil abundant[b][a], and there is no end to your iniquities?
translation:
  language: te
  text: నీ దుష్టత్వం[a] ఎంతో అధికం కాదా? నీ దోషాలకు అంతమే లేదు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీ చెడుతనం.” ఈ హీబ్రూ పదం కొన్ని సందర్భాల్లో “విపత్తు” అని కూడా అర్థమిస్తుంది; అయితే ఇక్కడ “నీ దోషాలు” అనే సమాంతర పదబంధం నైతిక చెడునే సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “నీ దోషాలకు హద్దే లేదు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: కాదా?
  rationale: సానుకూల జవాబును ఆశించే అలంకారిక ప్రశ్నను తెలుగులో సహజంగా, ఆరోపణాత్మక ధోరణితో వ్యక్తం చేస్తుంది.
- source_word: רָעָתְךָ
  choice: నీ దుష్టత్వం
  rationale: רעה అనే పదానికి ‘విపత్తు’ అనే అర్థం కూడా ఉండగలిగినా, సమాంతరంగా వచ్చిన ‘నీ దోషాలు’ అనే మాట ఇక్కడ నైతిక చెడును సూచిస్తుంది.
- source_word: רַבָּה
  choice: ఎంతో అధికం
  rationale: పరిమాణం లేదా తీవ్రత చాలా ఎక్కువగా ఉందనే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: וְאֵין קֵץ
  choice: అంతమే లేదు
  rationale: హీబ్రూ నుడికారంలోని ‘ముగింపు/హద్దు లేదు’ అనే భావాన్ని సంక్షిప్తంగా, సహజంగా అందిస్తుంది.
- source_word: לַעֲוֺנֹתֶיךָ
  choice: నీ దోషాలకు
  rationale: עון పదంలోని నైతిక అపరాధ భావాన్ని నిలుపుతుంది; బహువచనాన్ని కూడా ప్రతిబింబిస్తుంది.
theological_decisions:
- issue: רָעָתְךָ అనే పదం నైతిక చెడునా, విపత్తునా?
  choice: నైతిక చెడు—‘దుష్టత్వం’
  alternative: విపత్తు / దురవస్థ
  rationale: ‘నీ దోషాలకు అంతమే లేదు’ అనే సమాంతర వాక్యభాగం ప్రకారం ఎలీఫజు యోబు బాధను వర్ణించడం కాకుండా అతనిపై నైతిక ఆరోపణ చేస్తున్నాడు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. మొదటి భాగంలోని అలంకారిక ప్రశ్నను నిలిపి, రెండవ భాగాన్ని హీబ్రూ నిర్మాణానుసారం నిర్దిష్ట ప్రకటనగా ఉంచాం.
