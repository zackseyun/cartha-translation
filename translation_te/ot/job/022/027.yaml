  text: You will pray to him[a], and he will hear you, and you will fulfill your vows.
translation:
  language: te
  text: నీవు ఆయనకు ప్రార్థిస్తావు; ఆయన నీ మాట వింటాడు. నీవు చేసిన మొక్కుబడులను నెరవేరుస్తావు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תַּעְתִּיר
  choice: ప్రార్థిస్తావు
  rationale: עתר హిఫిల్ రూపం earnest entreaty లేదా ప్రార్థనను సూచిస్తుంది. దేవుడు వినడం అనే సమాంతర భావానికి అనుగుణంగా, ఆధునిక తెలుగులో సహజమైన ‘ప్రార్థిస్తావు’ను ఎంచుకున్నాం.
- source_word: אֵלָיו
  choice: ఆయనకు
  rationale: అక్షరార్థంగా ‘ఆయన వైపుకు/ఆయనకు.’ సమీప సందర్భంలో సూచించబడుతున్నది దేవుడే అయినప్పటికీ, హీబ్రూ సర్వనామాన్ని నిలుపుతూ ‘ఆయనకు’ అని అనువదించాం.
- source_word: וְיִשְׁמָעֶךָּ
  choice: ఆయన నీ మాట వింటాడు
  rationale: שׁמע యొక్క ప్రాథమిక అర్థం ‘వినడం.’ తెలుగులో వ్యక్తి ప్రార్థనను వినడాన్ని సహజంగా తెలియజేయడానికి ‘నీ మాట వింటాడు’ అన్నాం; ‘జవాబిస్తాడు’ అని చెప్పి మూలార్థాన్ని విస్తరించలేదు.
- source_word: וּנְדָרֶיךָ
  choice: నీవు చేసిన మొక్కుబడులను
  rationale: נֶדֶר దేవునికి చేసిన ప్రతిజ్ఞ లేదా మొక్కుబడిని సూచిస్తుంది. సాధారణ తెలుగు ఆధ్యాత్మిక వాడుకలో ‘మొక్కుబడి’ సహజంగా ఉండి, మూలంలోని దేవునికి చేసిన బాధ్యత భావాన్ని తెలియజేస్తుంది.
- source_word: תְשַׁלֵּם
  choice: నెరవేరుస్తావు
  rationale: שלם పియేల్ రూపం మొక్కుబడులతో వచ్చినప్పుడు వాటిని ‘చెల్లించడం,’ అంటే వాగ్దానం చేసినదాన్ని కార్యరూపంలో నెరవేర్చడం అనే నుడికారార్థాన్ని ఇస్తుంది. తెలుగులో ‘మొక్కుబడులను నెరవేర్చడం’ సహజమైన సమానార్థక ప్రయోగం.
theological_decisions:
- issue: చివరి పదబంధాన్ని అక్షరార్థంగా ‘మొక్కుబడులను చెల్లిస్తావు’ అనాలా, నుడికారంగా ‘నెరవేరుస్తావు’ అనాలా
  choice: నీవు చేసిన మొక్కుబడులను నెరవేరుస్తావు
  alternative: నీ మొక్కుబడులను చెల్లిస్తావు
  rationale: హీబ్రూ నుడికారం దేవునికి మొక్కుకున్నదాన్ని ఆచరించడాన్ని సూచిస్తుంది. ‘నెరవేరుస్తావు’ ఆధునిక తెలుగులో ఆ బాధ్యతను స్పష్టంగా తెలియజేస్తుంది; దానిని కేవలం ధన చెల్లింపుగా అపార్థం చేసుకునే అవకాశాన్ని తగ్గిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. రెండు సమన్వయ వాక్యాలుగా విభజించి పఠన సౌలభ్యాన్ని పెంచాం. మూలంలోని దైవ సర్వనామాన్ని ‘ఆయన’గా నిలిపాం; ఏ ప్రత్యేక సంప్రదాయ వ్యాఖ్యానాన్నీ చేర్చలేదు.
