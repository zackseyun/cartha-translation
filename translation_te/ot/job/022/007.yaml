id: JOB.22.7
reference: Job 22:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: לֹא מַ֭יִם עָיֵ֣ף תַּשְׁקֶ֑ה וּ֝/מֵ/רָעֵ֗ב תִּֽמְנַֽע לָֽחֶם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/022/007.yaml
  text: You gave no water to the weary to drink[a], and from the hungry you withheld bread.
translation:
  language: te
  text: అలసిపోయినవాడికి తాగడానికి నీవు నీళ్లు ఇవ్వలేదు; ఆకలిగొన్నవాడికి రొట్టె దక్కకుండా చేశావు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ ‘రొట్టె’ అనే పదం విస్తృతార్థంలో ‘ఆహారం’ అని కూడా సూచించవచ్చు; ప్రధాన పాఠ్యం మూలంలోని స్పష్టమైన పదాన్నే ఉంచింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא
  choice: ఇవ్వలేదు
  rationale: హీబ్రూ నిరాకరణను మొదటి ఆరోపణలో సహజమైన తెలుగు క్రియారూపంతో వ్యక్తపరుస్తుంది.
- source_word: מַיִם
  choice: నీళ్లు
  rationale: సాధారణ ఆధునిక తెలుగులో తాగునీటిని సూచించే సహజమైన బహువచన ద్రవ్యనామ రూపం.
- source_word: עָיֵף
  choice: అలసిపోయినవాడు
  rationale: ‘అలసిన/సొమ్మసిల్లిన వ్యక్తి’ అనే విశేషణాత్మక నామవాచక ప్రయోగాన్ని ఏకవచన సాధారణ ప్రతినిధిగా నిలుపుతుంది.
- source_word: תַּשְׁקֶה
  choice: తాగడానికి ... ఇవ్వలేదు
  rationale: హిఫిల్ క్రియలోని ‘తాగించు/తాగడానికి ఇవ్వు’ భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: וּמֵרָעֵב
  choice: ఆకలిగొన్నవాడికి
  rationale: మూలంలోని ఏకవచన సాధారణ వ్యక్తిని నిలుపుతూ, מנע క్రియతో సహజ తెలుగు వాక్యనిర్మాణం కోసం సంప్రదానార్థక రూపాన్ని వాడింది.
- source_word: תִּמְנַע
  choice: దక్కకుండా చేశావు
  rationale: מִן తో కూడిన ‘ఒకరి నుండి నిలిపివేయు/అందనీయకు’ అనే భావాన్ని సహజంగా వ్యక్తపరుస్తుంది; అవసరమైన ఆహారాన్ని నిరాకరించిన ఆరోపణను నిలుపుతుంది.
- source_word: לָחֶם
  choice: రొట్టె
  rationale: ఈ పదం విస్తృతంగా ‘ఆహారం’ అని కూడా సూచించగలిగినా, మూలంలోని స్పష్టమైన concrete image అయిన ‘రొట్టె’ను ప్రధాన పాఠ్యంలో ఉంచుతుంది.
