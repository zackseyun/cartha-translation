  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన ఆరోపణ శైలి. రెండు అర్ధవాక్యాల్లోని ఏకవచన విశేషణాత్మక నామప్రయోగాలను సాధారణ ప్రతినిధులుగా నిలిపింది; మతశాఖాపరమైన వ్యాఖ్యానాన్ని చేర్చలేదు.
