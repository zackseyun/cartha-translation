source:
  edition: WLC
  text: אַ֭לְמָנוֹת שִׁלַּ֣חְתָּ רֵיקָ֑ם וּ/זְרֹע֖וֹת יְתֹמִ֣ים יְדֻכָּֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/job/022/009.yaml
  text: You sent widows away empty[c][b][a], and the arms of orphans were crushed.
translation:
  language: te
  text: విధవలను వట్టి చేతులతో పంపివేశావు; తండ్రిలేని పిల్లల బాహువులు నలిపివేయబడ్డాయి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘బాహువులు’ వారి బలాన్ని లేదా శక్తిని కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַלְמָנוֹת
  choice: విధవరాళ్లను
  rationale: భర్తలను కోల్పోయి సామాజికంగా బలహీన స్థితిలో ఉన్న స్త్రీలను సూచించే సాధారణ బహువచన పదం.
- source_word: שִׁלַּחְתָּ
  choice: పంపివేశావు
  rationale: పీయేల్ రూపంలోని ‘పంపివేయడం/వెళ్లగొట్టడం’ అనే ఆరోపణాత్మక భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: רֵיקָם
  choice: వట్టి చేతులతో
  rationale: ఏమీ ఇవ్వకుండా, ఖాళీగా పంపడం అనే క్రియావిశేషణ భావాన్ని ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: זְרֹעוֹת
  choice: బాహువులు
  rationale: హీబ్రూ పదంలోని శరీరావయవ చిత్రాన్ని నిలుపుతుంది; అదే సమయంలో బలం లేదా శక్తి అనే రూపకాలంకార భావానికీ అవకాశం ఉంచుతుంది.
- source_word: יְתֹמִים
  choice: తండ్రిలేని పిల్లల
  rationale: ప్రాచీన సామాజిక సందర్భంలో తండ్రిని కోల్పోయి రక్షణలేని పిల్లలను ఖచ్చితంగా సూచిస్తుంది; ‘అనాథలు’ కంటే మూలపద పరిధిని సన్నిహితంగా నిలుపుతుంది.
- source_word: יְדֻכָּא
  choice: నలగగొట్టబడ్డాయి
  rationale: דכא యొక్క బలమైన నలిపివేయడం/చితగ్గొట్టడం అనే నిష్క్రియ భావాన్ని నిలుపుతుంది; తెలుగు వాక్యంలో బహువచన కర్తకు సహజమైన అన్వయం వాడబడింది.
theological_decisions:
- issue: ‘బాహువులు’ అనే పదం అక్షరార్థమా లేక బలం అనే రూపకమా
  choice: ప్రధాన పాఠ్యంలో ‘బాహువులు’ అనే స్పష్టమైన హీబ్రూ చిత్రాన్ని ఉంచడం
  alternative: వారి బలం నాశనం చేయబడింది
  rationale: సందర్భం శారీరక హింసను లేదా సామాజిక శక్తిని అణచివేయడాన్ని సూచించవచ్చు; అనువాదం ఈ ఉద్దేశపూర్వక అస్పష్టతను పరిష్కరించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కావ్యాత్మక ఆరోపణ యొక్క గంభీరతను నిలుపుతూ సాధారణ పాఠకులకు స్పష్టంగా ఉండే పదజాలం. హీబ్రూ సమాంతర నిర్మాణం మరియు ‘బాహువులు’ అనే సజీవ చిత్రణ పరిరక్షించబడ్డాయి.
