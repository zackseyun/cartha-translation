review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately renders the two Hebrew clauses: widows are sent away with nothing, and the concrete image of the fatherless children''s ''arms'' being crushed is retained. ''తండ్రిలేని పిల్లలు'' appropriately preserves the source''s social sense of fatherless children without over-specifying ''orphans.'''
  naturalness: ‘వట్టి చేతులతో పంపివేశావు’ is idiomatic modern Telugu. However, ‘నలగగొట్టబడ్డాయి’ is an awkward passive construction for ‘arms were crushed.’ ‘నలిపివేయబడ్డాయి’ is clearer and more natural while retaining the crushing image.
  terminology: ‘బాహువులు’ suitably preserves the literal Hebrew image and the footnote correctly notes its possible figurative sense of strength/power. ‘విధవలను’ is the more neutral modern-standard form than ‘విధవరాళ్లను’ in this solemn poetic accusation.
  issues:
  - severity: low
    issue: Register of ‘విధవరాళ్లను’
    rationale: The term is understandable, but ‘విధవలను’ is more neutral and standard in a formal biblical translation.
  - severity: medium
    issue: Awkward passive ‘నలగగొట్టబడ్డాయి’
    rationale: The expression is not idiomatic Telugu for the passive crushing of arms. ‘నలిపివేయబడ్డాయి’ expresses the Hebrew passive sense naturally without resolving the literal/metaphorical ambiguity.
  revised_text: విధవలను వట్టి చేతులతో పంపివేశావు; తండ్రిలేని పిల్లల బాహువులు నలిపివేయబడ్డాయి.[a]
