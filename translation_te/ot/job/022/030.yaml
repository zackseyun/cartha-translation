id: JOB.22.30
reference: Job 22:30
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: יְֽמַלֵּ֥ט אִֽי נָקִ֑י וְ֝/נִמְלַ֗ט בְּ/בֹ֣ר כַּפֶּֽי/ךָ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/job/022/030.yaml
  text: He delivers even one who is not innocent[b][a], and he will be delivered through the cleanness of your hands.
translation:
  language: te
  text: 'నిర్దోషి కానివాణ్ణి కూడా ఆయన విడిపిస్తాడు[a];

    నీ చేతుల స్వచ్ఛతవల్ల అతడు విడిపించబడతాడు[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆయన నిర్దోషిని విడిపిస్తాడు.” మొదటి పాదంలోని హీబ్రూ పాఠం క్లిష్టంగా ఉంది; ఈ పదబంధాన్ని వేరే విధంగా కూడా అర్థం చేసుకుంటారు.
    reason: alternative_reading
  - marker: b
    text: అక్షరార్థంగా, “నీ చేతుల స్వచ్ఛత ద్వారా.” చేతుల స్వచ్ఛత అనేది నిర్దోషిత్వం లేదా నైతిక పవిత్రతను సూచించే నానుడి.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְמַלֵּט
  choice: విడిపిస్తాడు
  rationale: מלט ధాతువు పియేల్ రూపంలో ఒకరిని తప్పించించడం లేదా విడిపించడం అనే భావాన్ని ఇస్తుంది. తెలుగు వాక్యంలో ‘విడిపిస్తాడు’ సహజంగా ఉండి, తరువాతి నిఫ్అల్ రూపంతో సమాంతరతను నిలుపుతుంది.
- source_word: אִי נָקִי
  choice: నిర్దోషి కానివాణ్ణి కూడా
  rationale: ఈ క్లిష్టమైన పదబంధంలో אִי ని నిషేధార్థక ప్రయోగంగా తీసుకొని, נָקִי కి నైతిక/న్యాయపరమైన ‘నిర్దోషి’ అనే అర్థం ఇచ్చాం. ‘కూడా’ అనే పదం, నిర్దోషి కాని వ్యక్తికీ విమోచనం వర్తిస్తుందనే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; అయితే పాఠంలోని అనిశ్చితిని పాదటిప్పణిలో ఉంచాం.
- source_word: וְנִמְלַט
  choice: అతడు విడిపించబడతాడు
  rationale: מלט ధాతువు నిఫ్అల్ రూపంలోని కర్మణి భావాన్ని నిలుపుతూ, మొదటి పాదంలోని ‘విడిపిస్తాడు’తో ఉన్న పదసామ్యాన్ని స్పష్టంగా చూపుతుంది.
- source_word: בְּבֹר
  choice: స్వచ్ఛతవల్ల
  rationale: בֹּר ఇక్కడ శుద్ధి లేదా స్వచ్ఛతను సూచిస్తుంది; בְּ ఉపసర్గం సాధనార్థకంగా ఉంది. ‘వల్ల’ ఆ సంబంధాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: כַּפֶּיךָ
  choice: నీ చేతుల
  rationale: ద్వివచన రూపం అక్షరార్థంగా అరచేతులను సూచించినా, ఈ సందర్భంలో చేతులు అనే సాధారణ ప్రయోగమే సహజం. ‘చేతుల స్వచ్ఛత’ నైతిక నిర్దోషిత్వం లేదా యథార్థతకు రూపకంగా ఉంది.
theological_decisions:
- issue: మొదటి పాదంలోని క్లిష్టమైన אִי נָקִי పదబంధం
  choice: దేవుడు నిర్దోషి కాని వ్యక్తిని కూడా విడిపిస్తాడని ఎలీఫజు చెబుతున్నట్లుగా అనువదించడం
  alternative: ‘ఆయన నిర్దోషిని విడిపిస్తాడు’ అని అనువదించడం; లేదా ‘నిర్దోషమైన ద్వీపాన్ని/దేశాన్ని విడిపిస్తాడు’ అని పదార్థానుసారంగా తీసుకోవడం
  rationale: హీబ్రూ వాక్యనిర్మాణం క్లిష్టమైనదే. అయినా אִי కి ఇక్కడ నిషేధార్థక భావం ఇచ్చే సాంప్రదాయ అవగాహన, రెండవ పాదంలో యోబు చేతుల స్వచ్ఛత ద్వారా మరొకడు విడిపించబడతాడనే భావంతో సరిపోతుంది. ఇది మధ్యవర్తిత్వం గురించి పాఠం చెప్పినదానికంటే బలమైన సిద్ధాంతాన్ని చేర్చకుండా దాని ఉద్వేగాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన శైలి ఉపయోగించబడింది. మూలంలోని క్రియాసమాంతరతను ‘విడిపిస్తాడు/విడిపించబడతాడు’ ద్వారా నిలిపి, క్లిష్టమైన మొదటి పాదానికి ప్రత్యామ్నాయ పఠనాన్ని పాదటిప్పణిలో ఇచ్చాం.
