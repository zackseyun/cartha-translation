id: JOB.22.12
reference: Job 22:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: הֲֽ/לֹא אֱ֭לוֹהַּ גֹּ֣בַהּ שָׁמָ֑יִם וּ/רְאֵ֤ה רֹ֖אשׁ כּוֹכָבִ֣ים כִּי רָֽמּוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/022/012.yaml
  text: Is not God in the height of heaven? And see the highest stars[b][a], how lofty they are.
translation:
  language: te
  text: దేవుడు ఆకాశపు ఎత్తున లేడా?[a] అత్యున్నత నక్షత్రాలను చూడు[b]—అవి ఎంత ఎత్తుగా ఉన్నాయో!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఆకాశపు ఉన్నత స్థలాల్లో.’ హీబ్రూ పదబంధం అక్షరార్థంగా ‘ఆకాశపు ఎత్తు.’
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా ‘నక్షత్రాల తల/పైభాగం’; భావం ‘అత్యున్నత నక్షత్రాలు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: లేడా?
  rationale: ఏకీభావాన్ని ఆశించే అలంకారిక ప్రశ్నను తెలుగులో సహజంగా, దాని ప్రశ్నార్థక బలాన్ని నిలుపుతూ వ్యక్తం చేస్తుంది.
- source_word: אֱלוֹהַּ
  choice: దేవుడు
  rationale: ఇది దేవునికి వాడిన ఏకవచన పదానికి సాధారణమైన, అదనపు భావాలను చేర్చని తెలుగు సమానార్థకం.
- source_word: גֹּבַהּ שָׁמָיִם
  choice: ఆకాశపు ఎత్తున
  rationale: ‘ఆకాశపు ఎత్తు’ అనే ఏకవచన నిర్మాణాన్నీ, సందర్భంలోని స్థలసూచక భావాన్నీ సహజమైన తెలుగులో నిలుపుతుంది; దీనిని పోలికగా మార్చదు.
- source_word: וּרְאֵה
  choice: చూడు
  rationale: రָאָה క్రియలోని ఆజ్ఞార్థక, పరిశీలనకు పిలిచే భావాన్ని నేరుగా తెలియజేస్తుంది. తెలుగు వాక్యప్రవాహంలో సంధిని విడిగా అనువదించాల్సిన అవసరం లేదు.
- source_word: רֹאשׁ כּוֹכָבִים
  choice: అత్యున్నత నక్షత్రాలను
  rationale: అక్షరార్థంగా ‘నక్షత్రాల తల/పైభాగం’; ఇక్కడ నక్షత్రాల అత్యున్నత స్థితిని సూచించే పదబంధంగా గ్రహించడం తెలుగులో సహజంగా ఉంటుంది. అక్షరార్థాన్ని పాదసూచికలో నిలిపాం.
- source_word: כִּי
  choice: ఎంత … ఉన్నాయో
  rationale: ఇక్కడ నక్షత్రాల ఎత్తును ఆశ్చర్యసూచకంగా చూపించే ప్రయోగాన్ని సహజమైన తెలుగు ఆశ్చర్యార్థక నిర్మాణంతో వ్యక్తం చేస్తుంది; కారణార్థకంగా మార్చదు.
- source_word: רָמּוּ
  choice: ఎంత ఎత్తుగా ఉన్నాయో
  rationale: רוּם ధాతువులోని భౌతిక ఎత్తు భావాన్ని నక్షత్రాల సందర్భానికి తగినట్లు తెలియజేస్తుంది; గౌరవస్థానాన్ని సూచించే ‘ఉన్నతమైనవి’ అనే అస్పష్టతను నివారిస్తుంది.
theological_decisions:
- issue: ఈ వాక్యాన్ని దేవుని స్థలపరమైన అతీతత గురించిన సిద్ధాంత ప్రకటనగా విస్తరించాలా, లేక ఎలీఫజు మాటల్లోని అలంకారిక పరిశీలనగా ఉంచాలా
  choice: స్థలసూచక చిత్రణతో కూడిన అలంకారిక ప్రశ్నను ఉన్నట్లుగా నిలుపడం
  alternative: దేవుడు దూరంగా ఉన్నాడని నొక్కిచెప్పేలా భావానువాదం చేయడం, లేదా యోబుపై ఎలీఫజు చేస్తున్న విమర్శను వాక్యంలో విస్తరించడం
  rationale: హీబ్రూ వాక్యం దేవుని ఉన్నత స్థానాన్నీ నక్షత్రాల ఎత్తునూ చూపిస్తుంది గాని, దాని నుంచి వచ్చే పూర్తి సిద్ధాంతపరమైన నిర్ధారణను ఇక్కడ స్పష్టంగా చెప్పదు. అందువల్ల అంతర్లీన ఉద్వేగాన్ని వివరణతో పరిష్కరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన కవితాత్మక శైలిని వాడాం. ‘ఎత్తున’ అనే రూపం స్థలసూచక చిత్రణను సంక్షిప్తంగా నిలుపుతుంది; ఆశ్చర్యార్థక ముగింపు హీబ్రూ వాక్యంలోని పరిశీలనాత్మక ఉద్ఘాటనను సహజంగా వ్యక్తం చేస్తుంది.
