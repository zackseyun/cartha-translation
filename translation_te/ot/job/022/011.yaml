  yaml_path: translation/ot/job/022/011.yaml
  text: or darkness[a], so that you cannot see, and an abundance of waters covers you.
translation:
  language: te
  text: లేదా, నీవు చూడలేనంతగా చీకటి ఉంటుంది; జలాల సమృద్ధి[a] నిన్ను కప్పేస్తుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “జలప్రవాహం నిన్ను కప్పేస్తుంది.” హెబ్రీ పదబంధం పొంగిపొర్లే జలాలను లేదా వరదను సూచించగలదు; ప్రధాన పాఠం ‘సమృద్ధి’ అనే విస్తృత భావాన్ని నిలుపుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹ
  choice: లేదా
  rationale: ఎలీఫజు వర్ణిస్తున్న తదుపరి విపత్తును ప్రత్యామ్నాయంగా పరిచయం చేసే సంక్షిప్త అనుసంధానాన్ని నిలుపుతుంది.
- source_word: חֹשֶׁךְ לֹא תִרְאֶה
  choice: నీవు చూడలేనంత చీకటి కమ్ముతుంది
  rationale: హెబ్రీ వాక్యరూపం అక్షరార్థంగా ‘చీకటి—నీవు చూడవు.’ సహజమైన తెలుగులో చీకటి వల్ల చూడలేని ఫలితాన్ని వ్యక్తం చేస్తూ, మూలంలోని సంక్షిప్త కవితాత్మక భావాన్ని నిలుపుతుంది.
- source_word: וְשִׁפְעַת מַיִם
  choice: సమృద్ధిగా పొంగే జలాలు
  rationale: שִׁפְעָה లోని సమృద్ధి, పొంగిపొర్లడం అనే భావవ్యాప్తిని రెండింటినీ తెలుగులో నిలుపుతుంది; దానిని తప్పనిసరిగా నిర్దిష్టమైన ‘వరద’గా మాత్రమే పరిమితం చేయదు.
- source_word: תְּכַסֶּךָּ
  choice: నిన్ను కప్పేస్తాయి
  rationale: כסה పియేల్ రూపంలోని ‘కప్పు’ అనే ప్రత్యక్ష చిత్రాన్ని నిలుపుతూ, సందర్భంలోని సంపూర్ణంగా ఆవరించే తీవ్రతను సహజంగా తెలియజేస్తుంది.
