  rationale: The wording removes the added action ‘darkness envelops’ and represents the first Hebrew clause as darkness so great that the addressee cannot see. It also renders שִׁפְעַת מַיִם as ‘an abundance of waters’ in the main text, preserving the possible ‘flood/overflow’ sense in the anchored footnote.
