translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, కవితాత్మకమైనప్పటికీ సాధారణ పాఠకులకు స్పష్టంగా ఉండే గంభీర శైలి. ‘జలాలు’ కవితా సందర్భానికి తగిన బహువచన సామూహిక రూపం.
