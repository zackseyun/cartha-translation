id: JOB.22.13
reference: Job 22:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְֽ֭/אָמַרְתָּ מַה יָּ֣דַֽע אֵ֑ל הַ/בְעַ֖ד עֲרָפֶ֣ל יִשְׁפּֽוֹט־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/022/013.yaml
  text: Yet you say[b][a], ‘What does God know? Can he judge through thick darkness?’
translation:
  language: te
  text: 'అయినా నీవు ఇలా అంటావు: “దేవునికి ఏమి తెలుసు? దట్టమైన చీకటి[b] గుండా ఆయన తీర్పు తీర్చగలడా?[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దట్టమైన చీకటి గుండా ఆయన తీర్పు తీరుస్తాడా?” హెబ్రీ అసంపూర్ణ క్రియారూపాన్ని సాధారణ లేదా భవిష్యత్ చర్యగా కూడా అర్థం చేసుకోవచ్చు; ఈ అలంకారిక ప్రశ్నలో సామర్థ్య భావం అంతర్లీనంగా ఉండవచ్చు.
    reason: alternative_reading
  - marker: b
    text: “దట్టమైన చీకటి”ని “కారుమబ్బు” లేదా “గాఢాంధకారం” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתָּ
  choice: అయినా నీవు ఇలా అంటావు
  rationale: సంధర్భంలో ఎలీఫజు యోబు మాటలను ఆరోపణాత్మకంగా ఉటంకిస్తున్నాడు. హెబ్రీ సంధికారకంలోని వ్యతిరేక భావాన్ని ‘అయినా’ సహజంగా తెలియజేస్తుంది; ప్రత్యక్ష ఉల్లేఖనానికి ‘ఇలా అంటావు’ స్పష్టతనిస్తుంది.
- source_word: מַה יָדַע
  choice: ఏమి తెలుసు?
  rationale: ప్రశ్నార్థక సర్వనామాన్ని, జ్ఞానం లేదా అవగాహనను సూచించే క్రియను నేరుగా, సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אֵל
  choice: దేవునికి
  rationale: ఇక్కడ אֵל దేవుణ్ణి సూచించే సాధారణ బిరుదు; లిప్యంతరీకరణకన్నా ఆధునిక తెలుగు పాఠకులకు సహజమైన ‘దేవుడు’ తగినది.
- source_word: הַבְעַד
  choice: గుండా
  rationale: తరువాతి నామవాచకం సూచించే అడ్డంకి మధ్యనుంచి లేదా దాని ఆవల నుంచి చూడడం, తీర్పు చేయడం అనే భావాన్ని ‘గుండా’ సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: עֲרָפֶל
  choice: దట్టమైన చీకటి
  rationale: ఈ పదం దట్టమైన మబ్బు, గాఢాంధకారం లేదా మసక కమ్మిన స్థితిని సూచిస్తుంది. ‘దట్టమైన చీకటి’ దృష్టికి అడ్డుపడే గంభీరమైన దృశ్యాన్ని నిలుపుతుంది.
- source_word: יִשְׁפּוֹט
  choice: తీర్పు తీర్చగలడా?
  rationale: హెబ్రీ అసంపూర్ణ క్రియారూపం సాధారణ లేదా భవిష్యత్ చర్యను సూచించగలదు; ఈ అలంకారిక ప్రశ్నలో సామర్థ్యంపై సందేహం అంతర్లీనంగా ఉండవచ్చు. ‘తీర్పు తీర్చగలడా?’ ఆ భావాన్ని సహజమైన తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: יִשְׁפּוֹט అనే క్రియను సామర్థ్య ప్రశ్నగా అనువదించాలా, లేక సాధారణ/భవిష్యత్ చర్యగా అనువదించాలా?
  choice: దట్టమైన చీకటి గుండా ఆయన తీర్పు తీర్చగలడా?
  alternative: దట్టమైన చీకటి గుండా ఆయన తీర్పు తీరుస్తాడా?
  rationale: ఎలీఫజు నివేదిస్తున్న మాటల్లో, చీకటి అడ్డుగా ఉన్నందున దేవుడు మానవ వ్యవహారాలను గ్రహించి తీర్పు చేయగలడా అనే సందేహం ధ్వనిస్తుంది. అయితే హెబ్రీ క్రియారూపం సామర్థ్య భావానికే పరిమితం కాదు; అందువల్ల సాధారణ/భవిష్యత్ పఠనాన్ని పాదసూచికలో నిలుపుతున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గంభీరమైన సంభాషణ శైలి వాడబడింది. ‘తీర్పు తీర్చడం’ న్యాయనిర్ణయ భావాన్ని సహజంగా తెలియజేస్తుంది; మూలంలోని అలంకారిక ప్రశ్న మరియు దాని అనిశ్చితి ప్రధాన పాఠం, పాదసూచిక కలిసి కాపాడుతున్నాయి.
