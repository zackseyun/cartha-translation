translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన అలంకారప్రశ్నగా రూపొందించబడింది. ‘ఎత్తుకు ఎగిరి’ మరియు ‘ఎత్తున కట్టుకుంటుంది’ అనే సమాంతర పదప్రయోగం మూలంలోని ఎత్తు భావాన్ని నిలుపుతుంది; అయితే రెండవ క్రియను గూడును భౌతికంగా పైకెత్తడంగా కాక, ఎత్తైన చోట గూడు కట్టడంగా సందర్భానుసారం వ్యక్తం చేస్తుంది.
