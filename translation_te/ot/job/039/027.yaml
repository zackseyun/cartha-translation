  text: Is it at your command that the eagle flies high and lifts up its nest?[a][b][c]
translation:
  language: te
  text: నీ ఆజ్ఞ ప్రకారమే[b] డేగ[c] ఎత్తుకు ఎగిరి[a], తన గూడును ఎత్తైన చోట కట్టుకుంటుందా?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ఎత్తుకు ఎగిరి” అనే మాటకు “పైకి ఎగసి” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: హెబ్రీలో అక్షరార్థంగా, “నీ నోటి ప్రకారం”; ఇది “నీ ఆజ్ఞ ప్రకారం” లేదా “నీ మాట ప్రకారం” అనే నుడికారం.
    reason: lexical_alternative
  - marker: c
    text: “డేగ” అని అనువదించిన హెబ్రీ పదం పెద్ద వేటపక్షిని విస్తృతంగా సూచించవచ్చు; కొన్ని సందర్భాల్లో రాబందును కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: ప్రకారమే ... కట్టుకుంటుందా?
  rationale: ఈ సందర్భంలో אִם షరతును కాక అలంకారప్రశ్నను ప్రారంభిస్తుంది; తెలుగులో ప్రశ్నార్థక క్రియాంతం మరియు ‘ఏ’ నొక్కిచెప్పడం ఆ భావాన్ని సహజంగా వ్యక్తం చేస్తాయి.
- source_word: עַל־פִּיךָ
  choice: నీ ఆజ్ఞ ప్రకారమే
  rationale: అక్షరార్థంగా ‘నీ నోటి ప్రకారం’; ఇక్కడ అధికారంతో పలికిన మాట లేదా ఆజ్ఞ అనే నుడికార భావం ఉంది.
- source_word: יַגְבִּיהַּ
  choice: ఎత్తుకు ఎగిరి
  rationale: גבה హిఫీల్ రూపం పైకి లేవడం లేదా ఎత్తుకు చేరడం అనే భావాన్ని ఇస్తుంది; పక్షి సందర్భంలో ‘ఎత్తుకు ఎగురు’ సహజమైన తెలుగు.
- source_word: נָשֶׁר
  choice: గద్ద
  rationale: ఎత్తుగా ఎగిరి ఎత్తైన చోట గూడు కట్టే పెద్ద వేటపక్షిని సూచించే సంప్రదాయ, సందర్భోచిత తెలుగు పదం; హెబ్రీ పదానికి ‘రాబందు’ అనే విస్తృత సాధ్యతను పాదసూచికలో నిలిపాం.
- source_word: וְכִי
  choice: మరియు అనే భావాన్ని కామాతో సమన్వయించడం
  rationale: రెండవ క్రియను అదే అలంకారప్రశ్నలో మొదటి క్రియతో కలుపుతుంది; తెలుగులో కామాతో కలిపిన సంయుక్త క్రియ నిర్మాణం సహజంగా ఉంటుంది.
- source_word: יָרִים קִנּוֹ
  choice: తన గూడును ఎత్తున కట్టుకుంటుంది
  rationale: అక్షరార్థంగా ‘తన గూడును పైకెత్తుతుంది’; సందర్భంలో గూడును ఎత్తైన ప్రదేశంలో ఏర్పాటు చేయడమే ఉద్దేశ్యం. ‘ఎత్తున కట్టుకుంటుంది’ ఆ దృశ్యాన్ని సహజంగా తెలియజేస్తుంది.
