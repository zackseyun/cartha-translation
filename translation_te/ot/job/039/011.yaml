translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ప్రశ్నార్థక శైలి వాడబడింది. మూలంలోని రెండు సమన్విత ప్రశ్నల వాక్చాతుర్యాన్ని నిలుపుకోవడానికి తెలుగులో రెండు ప్రశ్నలుగా మలిచాం. సందర్భంలోని జంతువుకు ‘దాని/దానిని/దానికి’ అనే సాధారణ నపుంసక సూచన వాడబడింది.
