  yaml_path: translation/ot/job/039/011.yaml
  text: Will you trust him because his strength is great[a], and leave your labor to him?
translation:
  language: te
  text: దాని బలం గొప్పది కాబట్టి దానిని నమ్ముతావా? నీ శ్రమను[a] దానికి వదిలిపెడతావా?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నీ శ్రమ ఫలితాన్ని.’ హీబ్రూ పదం శ్రమను గానీ, ఆ శ్రమ వల్ల లభించిన ఫలితాన్ని గానీ సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתִבְטַח
  choice: నమ్ముతావా?
  rationale: בטח అనే క్రియ ఇక్కడ ప్రశ్నార్థక నిర్మాణంలో ఉంది. సందర్భంలోని అడవి ఎద్దుపై ఆధారపడగలమా అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో ‘నమ్ముతావా?’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: בּוֹ
  choice: దానిని
  rationale: పుంలింగ ఏకవచన ప్రత్యయం సందర్భంలోని అడవి ఎద్దును సూచిస్తుంది. తెలుగులో జంతువును సూచించడానికి ‘దానిని’ సహజం.
- source_word: כִּי
  choice: కాబట్టి
  rationale: ప్రతిపాదిత నమ్మకానికి కారణాన్ని సూచించే కారణార్థక భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: רַב כֹּחוֹ
  choice: దాని బలం గొప్పది
  rationale: רַב పరిమాణాధిక్యాన్ని, כֹּחַ బలాన్ని సూచిస్తాయి. జంతువు చేత వ్యవసాయ పని చేయించే సందర్భంలో ‘బలం’ అనేది ‘శక్తి’ కంటే నిర్దిష్టంగా సరిపోతుంది.
- source_word: וְתַעֲזֹב
  choice: వదిలిపెడతావా?
  rationale: עזב యొక్క ప్రాథమిక భావమైన ‘వదిలివేయడం’ను కాపాడుతూ, పనిని జంతువుకు అప్పగించే అంతర్లీన భావాన్ని కూడా సందర్భం ద్వారా అందిస్తుంది.
- source_word: אֵלָיו
  choice: దానికి
  rationale: אֶל + పుంలింగ ఏకవచన ప్రత్యయం దిశ లేదా అప్పగింపును సూచిస్తుంది. ‘వదిలిపెట్టు’తో ‘దానికి’ సహజమైన తెలుగు ప్రయోగం.
- source_word: יְגִיעֶךָ
  choice: నీ శ్రమను
  rationale: יְגִיעַ శ్రమను, ప్రయాసను, లేదా శ్రమ ఫలితాన్ని సూచించగలదు. ప్రధాన పాఠంలో ‘శ్రమ’ పని అప్పగింపు సందర్భానికి నేరుగా సరిపోతుంది; ‘శ్రమ ఫలితం’ అనే సాధ్యార్థాన్ని పాదటిప్పణి కాపాడుతుంది.
