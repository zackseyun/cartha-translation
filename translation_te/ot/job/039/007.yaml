  source_fidelity: 'హీబ్రూ వచనంలోని రెండు సమాంతర భాగాలూ నమ్మకంగా ప్రతిఫలించాయి: అడవి గాడిద పట్టణపు కోలాహాసాన్ని ఎగతాళిగా/తృణీకారంగా నవ్వడం, తోలేవాని కేకలను వినకపోవడం. “కోలాహాసాన్ని చూసి ... నవ్వుతుంది” అనేది తెలుగులో ‘దానిని చూసి నవ్వడం/ఎగతాళి చేయడం’ అనే సహజ ప్రయోగంగా ఇక్కడ לְ యొక్క ‘at’ భావాన్ని సముచితంగా వ్యక్తం చేస్తుంది; దృశ్యగ్రహణాన్ని ప్రధాన అర్థంగా బలవంతపెట్టదు.'
