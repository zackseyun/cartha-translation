source:
  edition: WLC
  text: יִ֭שְׂחַק לַ/הֲמ֣וֹן קִרְיָ֑ה תְּשֻׁא֥וֹת נ֝וֹגֵ֗שׂ לֹ֣א יִשְׁמָֽע׃
base_translation:
  language: en
  yaml_path: translation/ot/job/039/007.yaml
  text: He laughs at the tumult of the city[b][a]; he does not hear the shouts of the driver.
translation:
  language: te
  text: పట్టణపు కోలాహాసాన్ని చూసి అది నవ్వుతుంది[a]; తోలేవాడి కేకలను అది వినదు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పట్టణపు శబ్దాన్ని చూసి.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “పని చేయించేవాడి” లేదా “పర్యవేక్షకుడి కేకలను.” హీబ్రూ పదం జంతువును తోలేవాడినే కాక, పని రాబట్టేవాడిని లేదా అధికారం చెలాయించేవాడిని కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׂחַק
  choice: నవ్వుతుంది
  rationale: שׂחק అనే క్రియకు ఇక్కడ నేరమైన అర్థం ‘నవ్వడం.’ అడవి గాడిద పట్టణపు సందడిని లెక్కచేయని భావం సందర్భంలో ఉన్నప్పటికీ, ‘ఎగతాళి చేస్తుంది’ అని విస్తరించకుండా మూలంలోని రూపాన్ని నిలిపాం.
- source_word: לַהֲמוֹן
  choice: కోలాహాసాన్ని చూసి
  rationale: הָמוֹן శబ్దం, సందడి, కోలాహలం అనే భావాలను కలిగి ఉంది. ‘కోలాహాసం’ పట్టణంలోని పెద్ద శబ్దాన్నీ హడావిడినీ సహజంగా తెలియజేస్తుంది; לַ־ సంబంధాన్ని తెలుగులో సహజమైన ‘చూసి నవ్వుతుంది’ నిర్మాణంతో వ్యక్తం చేశాం.
- source_word: קִרְיָה
  choice: పట్టణపు
  rationale: קִרְיָה అంటే పట్టణం లేదా నగరం. అడవి ప్రదేశానికి విరుద్ధమైన జనావాస భావాన్ని సాధారణ పాఠకునికి సహజంగా తెలిపేందుకు ‘పట్టణం’ ఎంచుకున్నాం.
- source_word: תְּשֻׁאוֹת
  choice: కేకలను
  rationale: ఈ బహువచన నామవాచకం బిగ్గరగా చేసే అరుపులు లేదా కేకలను సూచిస్తుంది. నియంత్రించేవాడు జంతువును అదిలించే సందర్భంలో ‘కేకలు’ సహజంగా సరిపోతుంది.
- source_word: נֹגֵשׂ
  choice: తోలేవాడి
  rationale: נֹגֵשׂ తోలేవాడు, పని రాబట్టేవాడు, లేదా పర్యవేక్షకుడు అనే విస్తృత అర్థాలు కలిగి ఉంది. ఇక్కడ జంతువు గురించిన సందర్భం కావడంతో ‘తోలేవాడు’ తక్షణ చిత్రాన్ని స్పష్టంగా అందిస్తుంది; ‘వెట్టి చేయించేవాడు’ వంటి అణచివేత భావాన్ని అనవసరంగా బలపరచదు.
- source_word: לֹא יִשְׁמָע
  choice: అది వినదు
  rationale: హీబ్రూ పదబంధంలోని నేరమైన శ్రవణ క్రియను నిలిపాం. సందర్భంలో ‘లెక్కచేయదు’ అనే భావం ఉండవచ్చుగాని, దానిని ప్రధాన పాఠ్యంలో వివరణాత్మకంగా చేర్చలేదు.
