translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడాం. ముందరి వచనాల్లోని అడవి గాడిదను సూచించేందుకు లింగనిరపేక్షమైన ‘అది’ ఉపయోగించాం. మూలంలోని రెండు సమాంతర వాక్యభాగాలను అర్ధవిరామంతో నిలిపాం.
