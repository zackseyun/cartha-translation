  yaml_path: translation/ot/job/039/006.yaml
  text: to whom I have given the desert for his house[a], and the salt land for his dwelling place[c][b],
translation:
  language: te
  text: 'దాని ఇంటిగా ఎడారిని నియమించాను[a],

    ఉప్పు నేలను దాని నివాసస్థలాలుగా నియమించాను[b][c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ఎడారి’ అనే చోట ‘అరణ్యం’ లేదా ‘బీడు మైదానం’ అని కూడా అనువదించవచ్చు (עֲרָבָה).
    reason: lexical_alternative
  - marker: b
    text: ‘ఉప్పు నేల’ అనే చోట ‘ఉప్పు మైదానం’ లేదా ‘ఉప్పు బీడు’ అని కూడా అనువదించవచ్చు (מְלֵחָה).
    reason: lexical_alternative
  - marker: c
    text: హీబ్రూలో ‘దాని నివాసస్థలాలు’ బహువచనంలో ఉంది; అది కవితాత్మకంగా నివాస ప్రాంతాన్ని సమష్టిగా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: దానికి
  rationale: మునుపటి వచనంలోని అడవి గాడిదను సూచించే సంబంధార్థక నిర్మాణం. తెలుగులో వాక్యానుసంధానాన్ని సహజంగా ఉంచేందుకు ‘దానికి’ అని అనువదించబడింది.
- source_word: שַׂמְתִּי
  choice: ఉంచాను / చేశాను
  rationale: שׂוּם అనే క్రియకు ‘ఉంచు, నియమించు, చేయు’ అనే అర్థాలున్నాయి. ఇక్కడ దేవుడు జంతువుకు నివాసాన్ని కేటాయించిన భావాన్ని మొదటి పాదంలో ‘ఉంచాను’, సమాంతర రెండో పాదంలో సహజమైన ‘చేశాను’ ద్వారా వ్యక్తం చేశాం.
- source_word: עֲרָבָה
  choice: ఎడారి
  rationale: ఇది పొడి బీడు మైదానం లేదా ఎడారి ప్రాంతాన్ని సూచిస్తుంది. సాధారణ ఆధునిక తెలుగు పాఠకులకు ‘ఎడారి’ స్పష్టంగా, కవితాత్మక సందర్భానికి తగినట్లుగా ఉంటుంది.
- source_word: בֵיתוֹ
  choice: నివాసంగా
  rationale: అక్షరార్థం ‘దాని ఇల్లు’. జంతువు సహజావాసాన్ని సూచించే సందర్భంలో ‘నివాసంగా’ సహజంగా ఉండి, ఆ ప్రాంతమే దానికి ఇల్లుగా నియమించబడిందనే భావాన్ని నిలుపుతుంది.
- source_word: וּמִשְׁכְּנוֹתָיו
  choice: దాని నివాసస్థలాలుగా
  rationale: హీబ్రూలో రూపం బహువచనం. దానిని తెలుగులో కూడా బహువచనంగా ఉంచి, మూలంలోని సంఖ్యను మరియు కవితాత్మక విస్తృతిని సంరక్షించాం.
- source_word: מְלֵחָה
  choice: ఉప్పు నేల
  rationale: ఉప్పు ప్రభావంతో బంజరమైన భూభాగాన్ని సూచిస్తుంది. ‘ఉప్పు నేల’ సంక్షిప్తంగా, సులభంగా అర్థమవుతూ, ‘ఉప్పు మైదానం’ లేదా ‘ఉప్పు బీడు’ అనే సాధ్యమైన భావాలను అతిగా సంకుచితం చేయదు.
