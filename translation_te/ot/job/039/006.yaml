translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కవితాత్మక శైలి. జంతువును సూచించేందుకు లింగనిరపేక్షమైన ‘దాని’ వాడబడింది. హీబ్రూ సమాంతరతను రెండు పాదాలుగా నిలిపి, మూలంలోని బహువచనాన్ని సంరక్షించాం.
