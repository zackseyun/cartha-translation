  yaml_path: translation/ot/job/039/023.yaml
  text: Over him the quiver rattles[b][a], the flashing spear and javelin.
translation:
  language: te
  text: దానిపై అమ్ములపొది గలగలమంటుంది[a]; మెరుస్తున్న ఈటె, బల్లెం[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దానికి ఎదురుగా అమ్ములపొది మోగుతుంది.’ హీబ్రూ విభక్తి ప్రత్యయం, క్రియ స్థలసంబంధమైన భావంలోను శబ్దపు స్వల్ప భేదంలోను వేరే అనువాదాలను అనుమతిస్తాయి.
    reason: lexical_alternative
  - marker: b
    text: పదశః, ‘ఈటె, బల్లెం యొక్క జ్వాల’; వాటి మెరుపును వర్ణించే కవితాత్మక ప్రయోగం.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלָיו
  choice: దాని మీద
  rationale: עַל + 3ms ప్రత్యయం గుర్రానికి సంబంధించి ఆయుధాల శబ్దం వినిపించే స్థలాన్ని సూచిస్తుంది. గుర్రాన్ని తెలుగులో సహజంగా నపుంసక ఏకవచనంతో పేర్కొంటూ, spatial imagery నిలుపుటకు ‘దాని మీద’ ఎంచుకున్నాం.
- source_word: תִּרְנֶה
  choice: గలగలమంటుంది
  rationale: ఈ కవితాత్మక క్రియ అమ్ములపొది కదలడంతో వచ్చే పదునైన మోగుడు లేదా గలగల శబ్దాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో concrete battlefield soundను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אַשְׁפָּה
  choice: అమ్ములపొది
  rationale: బాణాలను ఉంచే పొదిని సూచించే ప్రామాణిక, సంక్షిప్త తెలుగు పదం.
- source_word: לַהַב
  choice: మంటలా మెరుస్తాయి
  rationale: పదశః ‘మంట/అలుగు’; ఆయుధాల ప్రకాశాన్ని సూచించే కవితాత్మక రూపకాన్ని తెలుగులో స్పష్టంగా, సహజంగా నిలుపుతుంది.
- source_word: חֲנִית
  choice: ఈటె
  rationale: సాధారణ spearకు సహజమైన తెలుగు సమానార్థకం.
- source_word: כִידוֹן
  choice: బల్లెం
  rationale: חֲנִית నుండి వేరైన తేలికైన విసిరే ఆయుధ భావాన్ని సాధ్యమైనంతవరకు నిలుపుతుంది.
