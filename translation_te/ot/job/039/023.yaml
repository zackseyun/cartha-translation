translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కవితాత్మక శైలిని, యుద్ధరంగంలోని శబ్దం మరియు మెరుపు చిత్రణను నిలిపాం. ‘అమ్ములపొది’ సాధారణ పాఠకునికి అర్థమయ్యే సాంప్రదాయిక పదం; ‘ఈటె, బల్లెం’ రెండు హీబ్రూ ఆయుధ పదాల భేదాన్ని సాధ్యమైనంతగా కాపాడుతాయి.
