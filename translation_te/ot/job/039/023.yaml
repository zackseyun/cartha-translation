revisions:
- from: దాని మీద అమ్ములపొది గలగలమంటుంది[a]; ఈటె, బల్లెం మంటలా మెరుస్తాయి[b].
  to: దానిపై అమ్ములపొది గలగలమంటుంది[a]; మెరుస్తున్న ఈటె, బల్లెం[b].
  rationale: The revision makes a small spatial clarification, improves the idiomatic expression of the shared weapon imagery, and corrects the lexical explanation in footnote b. It preserves the Hebrew poetic compression and does not resolve the contextual spatial ambiguity beyond what the note records.
