  text: When she lifts herself up on high[b][a], she laughs at the horse and its rider.
translation:
  language: te
  text: అది ఎత్తున ఎగసినప్పుడు[a], గుర్రాన్నీ దాని రౌతునీ చూసి నవ్వుతుంది[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “అది ఎత్తున తన రెక్కలను చాచినప్పుడు,” లేదా “అది రెక్కలు కొడుతూ పైకి ఎగసినప్పుడు.” హీబ్రూ క్రియ బహుశా పైకి లేవడాన్ని సూచిస్తుంది; అయితే దాని ఖచ్చితమైన భావఛాయపై భిన్నాభిప్రాయాలు ఉన్నాయి.
