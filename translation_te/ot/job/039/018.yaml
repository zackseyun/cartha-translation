    reason: lexical_alternative
lexical_decisions:
- source_word: כָּעֵת
  choice: లేచినప్పుడు
  rationale: ఈ సందర్భంలో కాలసంబంధ భావాన్ని సహజమైన తెలుగు ఉపవాక్యంతో తెలియజేస్తుంది.
- source_word: בַּמָּרוֹם
  choice: ఎత్తుకు
  rationale: ఎత్తైన స్థితి లేదా పైకి సాగే కదలికను సూచిస్తుంది; పూర్తిగా ఎగరడాన్ని అనవసరంగా నిర్ధారించదు.
- source_word: תַּמְרִיא
  choice: లేచినప్పుడు
  rationale: హిఫీల్ రూపంలోని పైకి లేవడం లేదా తనను పైకి ఎత్తుకోవడం అనే భావాన్ని సంక్షిప్తంగా నిలుపుతుంది; ఖచ్చితమైన కదలికపై ఉన్న సందిగ్ధతను పాదటిప్పణిలో ఉంచింది.
- source_word: תִּשְׂחַק
  choice: చూసి నవ్వుతుంది
  rationale: ל తో వచ్చిన కర్మపట్ల ఎగతాళి భావం కలిగిన నవ్వును సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: לַסּוּס
  choice: గుర్రాన్ని
  rationale: నిర్దిష్ట/జాతివాచక ఏకవచనాన్ని తెలుగులో సహజంగా అందిస్తుంది.
- source_word: וּלְרֹכְבוֹ
  choice: దాని రౌతును
  rationale: సర్వనామ ప్రత్యయం గుర్రాన్ని సూచిస్తుందని స్పష్టంగా ఉంచి, గుర్రంపై స్వారీ చేసేవానిని ‘రౌతు’గా సంక్షిప్తంగా తెలిపింది.
