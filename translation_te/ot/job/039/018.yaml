translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కవితా ధోరణి. ఉష్ట్రపక్షి ఆడలింగ సూచనను తెలుగులో బలవంతంగా వ్యక్తం చేయకుండా ‘అది’ వాడబడింది. ప్రధాన పాఠంలో కదలికను అతిగా నిర్దిష్టం చేయకుండా, ప్రత్యామ్నాయాలను పాదటిప్పణిలో నిలిపాం.
