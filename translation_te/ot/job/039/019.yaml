  text: Do you give the horse its strength? Do you clothe its neck with a mane?[a]
translation:
  language: te
  text: 'గుర్రానికి బలాన్ని ఇచ్చేది నీవేనా?

    దాని మెడకు జూలును తొడిగేది నీవేనా?[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, רַעְמָה అనే పదాన్ని అనుసరించిన పాత వ్యాఖ్యాన సంప్రదాయం ప్రకారం, “దాని మెడకు ఉరుముతో తొడిగేది నీవేనా?” అని కూడా అర్థం చేసుకోవచ్చు. అయితే మెడను తొడిగే చిత్రణ కారణంగా ఇక్కడ “జూలు” అని అనువదించబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתִתֵּן
  choice: ఇచ్చేది నీవేనా?
  rationale: ప్రశ్నార్థక కణంతో కూడిన రెండవ పురుష ఏకవచన క్రియ యోబును ఉద్దేశించిన అలంకారిక ప్రశ్న. తెలుగు సహజత్వంతో పాటు ప్రత్యక్ష సవాలును నిలుపుతుంది.
- source_word: לַסּוּס
  choice: గుర్రానికి
  rationale: హీబ్రూలోని నిర్దిష్ట రూపం ఇక్కడ మొత్తం జాతిని సూచించే సాధారణ ఏకవచనంగా పనిచేస్తుంది; తెలుగులో ‘గుర్రానికి’ సహజంగా అదే భావాన్ని ఇస్తుంది.
- source_word: גְּבוּרָה
  choice: బలాన్ని
  rationale: ఈ సందర్భంలో గుర్రపు శారీరక శక్తి, సామర్థ్యాన్ని సూచించే స్పష్టమైన ఆధునిక తెలుగు పదం.
- source_word: הֲתַלְבִּישׁ
  choice: వస్త్రంలా తొడిగేది నీవేనా?
  rationale: לבש హిఫీల్ రూపంలోని ‘ధరింపజేయడం/తొడగడం’ అనే రూపకాన్ని స్పష్టంగా కాపాడుతుంది; ‘వస్త్రంలా’ అనేది తెలుగులో మెడకు జూలును ‘తొడగడం’ అనే చిత్రాన్ని సహజంగా చేస్తుంది.
- source_word: צַוָּארוֹ
  choice: దాని మెడకు
  rationale: పుంలింగ ఏకవచన ప్రత్యయం గుర్రాన్ని సూచిస్తుంది. తెలుగు సాధారణ జంతు ప్రస్తావనలో ‘దాని’ సహజమైనది; గుర్రం తప్పనిసరిగా మగదని సూచించదు.
- source_word: רַעְמָה
  choice: జూలును
  rationale: మెడను వస్త్రంలా కప్పే దృశ్యంతో సందర్భానుసారంగా గుర్రపు జూలు అనే అర్థం బలంగా సరిపోతుంది. ‘ఉరుము’ అనే పాత వ్యాఖ్యాన ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో నిలుపుతున్నాం.
