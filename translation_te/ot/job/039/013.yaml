  text: כְּנַף רְנָנִ֥ים נֶעֱלָ֑סָה אִם אֶ֝בְרָ֗ה חֲסִידָ֥ה וְ/נֹצָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/039/013.yaml
  text: The wings of the ostrich flap joyfully—are they the pinions and plumage of the stork?[a]
translation:
  language: te
  text: ఉష్ట్రపక్షి రెక్కలు ఉల్లాసంగా రెపరెపలాడుతాయి—అవి కొంగకు చెందిన రెక్కల ఈకలూ పింఛాలూనా?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఉష్ట్రపక్షి రెక్క గర్వంగా రెపరెపలాడుతుంది; అయితే అది కొంగకు చెందిన రెక్క ఈకా, పింఛమా?” హీబ్రూ పాఠం క్లిష్టంగా ఉంది; దీనిని అనేక విధాలుగా అర్థం చేసుకున్నారు.
    reason: alternative_reading
lexical_decisions:
- source_word: כְּנַף
  choice: రెక్కలు
  rationale: హీబ్రూలో ఏకవచన సమూహార్థక రూపం; తెలుగులో జతగా ఉన్న అవయవాన్ని సహజంగా బహువచనంలో ఇచ్చాం.
- source_word: רְנָנִים
  choice: ఉష్ట్రపక్షి
  rationale: జంతువుల గురించిన ఈ సందర్భంలో ఈ పదం ఉష్ట్రపక్షిని సూచిస్తుంది; తరువాతి వచనాలూ ఇదే పక్షిని వర్ణిస్తాయి.
- source_word: נֶעֱלָסָה
  choice: ఉల్లాసంగా అల్లాడుతాయి
  rationale: ఈ క్రియలో ఉల్లాసం లేదా అతిశయంతో కూడిన కదలిక భావం ఉంది; రెక్కల సందర్భంలో కదలికనూ భావఛాయనూ రెండింటినీ ఈ ప్రయోగం తెలియజేస్తుంది.
- source_word: אִם
  choice: అవి ... నా?
  rationale: హీబ్రూ పదం ఇక్కడ సంక్షిప్తమైన అలంకారప్రశ్న లేదా పోలికను ప్రవేశపెడుతుంది; తెలుగు ప్రశ్నార్థక నిర్మాణం ఆ అనిశ్చిత భావాన్ని నిలుపుతుంది.
- source_word: אֶבְרָה
  choice: రెక్కఈకలు
  rationale: మొత్తం రెక్కకన్నా దాని ప్రధాన ఈకలను సూచించే నిర్దిష్ట అర్థాన్ని సాధారణ పాఠకునికి అర్థమయ్యే తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: חֲסִידָה
  choice: కొంగ
  rationale: ఇక్కడ విశేషణార్థం కాక, పక్షి పేరు ‘stork’; ఆధునిక సాధారణ తెలుగులో ‘కొంగ’ సహజమైన సమీప పదం.
- source_word: וְנֹצָה
  choice: పింఛాలు
  rationale: ఈ పదం ఈకలు లేదా పక్షి ఈకల సముదాయాన్ని సూచిస్తుంది; ‘రెక్కఈకలు’తో తేడాను కొంత నిలుపుతూ కవితాత్మకంగా ఉంటుంది.
