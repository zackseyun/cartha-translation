source:
  edition: WLC
  text: הֲ/יֹ֣אבֶה רֵּ֣ים עָבְדֶ֑/ךָ אִם יָ֝לִ֗ין עַל אֲבוּסֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/039/009.yaml
  text: Will the wild ox be willing to serve you? Will he spend the night at your feeding trough?[a][b]
translation:
  language: te
  text: అడవి ఎద్దు నీకు సేవ చేయడానికి ఇష్టపడుతుందా? అది నీ మేత తొట్టి దగ్గర రాత్రి గడుపుతుందా?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నీ పశువుల దాణా తొట్టి.’ హీబ్రూ పదం జంతువులు మేత తినే స్థలాన్ని లేదా తొట్టిని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘అడవి వృషభం’ లేదా ‘ఆరోక్స్.’ హీబ్రూ పదం సూచించే జంతువు ఖచ్చితంగా ఏదో తెలియదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיֹאבֶה
  choice: ఇష్టపడుతుందా
  rationale: אבה అనే క్రియ సామర్థ్యాన్ని కాకుండా సమ్మతి లేదా ఇష్టాన్ని సూచిస్తుంది; ప్రశ్నలోని సంకల్ప భావాన్ని ఈ అనువాదం సహజంగా నిలుపుతుంది.
- source_word: רֵּים
  choice: అడవి ఎద్దు
  rationale: ఈ జంతువు ఖచ్చితంగా ఏదో అనిశ్చితం. తెలుగులో సులభంగా అర్థమయ్యేలా, అతిగా నిర్దిష్టం చేయకుండా ‘అడవి ఎద్దు’ అని అనువదించాం.
- source_word: עָבְדֶךָ
  choice: నీకు సేవ చేయడానికి
  rationale: ఇక్కడ עבד ఒక యజమానికి చేసే పని లేదా సేవను సూచిస్తుంది; ‘నీకు సేవ చేయడం’ సంక్షిప్తంగా, సహజంగా ఉంది.
- source_word: אִם
  choice: అది ... గడుపుతుందా?
  rationale: కవితా సమాంతర నిర్మాణంలో אִם రెండవ అలంకారిక ప్రశ్నను ప్రవేశపెడుతుంది. తెలుగులో విడి ప్రశ్నగా పలకడం సహజం.
- source_word: יָלִין
  choice: రాత్రి గడుపుతుందా
  rationale: לין రాత్రిపూట బస చేయడం లేదా ఉండిపోవడం అనే అర్థాన్ని ఇస్తుంది; ‘రాత్రి గడపడం’ ఆధునిక తెలుగులో స్పష్టంగా ఉంది.
- source_word: עַל
  choice: దగ్గర
  rationale: అక్షరార్థంగా ‘మీద/వద్ద’ అనే భావం ఉన్నా, మేత తొట్టి సమీపంలో ఉండడాన్ని తెలుగులో ‘దగ్గర’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אֲבוּסֶךָ
  choice: నీ మేత తొట్టి
  rationale: אֲבוּס జంతువులు మేత తినే తొట్టి లేదా స్థలాన్ని సూచిస్తుంది. ‘మేత తొట్టి’ స్పష్టమైన, నేటి వాడుకకు తగిన పదబంధం.
