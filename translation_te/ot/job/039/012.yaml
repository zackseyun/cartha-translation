  text: Will you trust him that he will bring back your seed and gather it to your threshing floor?[a]
translation:
  language: te
  text: అది నీ విత్తనాన్ని తిరిగి తీసుకొచ్చి, నీ కళ్లంలో దాన్ని పోగుచేస్తుందని దానిపై నమ్మకం ఉంచుతావా?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ మూలంలో అక్షరార్థంగా ‘నీ విత్తనం’ అని ఉంది; ఈ సందర్భంలో అది పొలం నుండి తీసుకొచ్చే కోసిన ధాన్యాన్ని లేదా పంటను సూచిస్తుండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתַאֲמִין
  choice: నమ్ముతావా
  rationale: అמן హిఫీల్ రూపం ఇక్కడ అడవి ఎద్దుపై ఆచరణాత్మకంగా నమ్మకం ఉంచడాన్ని సూచిస్తుంది; తెలుగులో ‘నమ్ముతావా’ సహజంగా ఈ భావాన్ని అందిస్తుంది.
- source_word: בּוֹ
  choice: దానిని
  rationale: పుంలింగ ఏకవచన ప్రత్యయం ముందున్న అడవి ఎద్దును సూచిస్తుంది. ఆధునిక తెలుగులో జంతువును సూచించడానికి ‘దానిని’ సహజమైన రూపం.
- source_word: כִּי
  choice: అని
  rationale: ఇది నమ్మకానికి సంబంధించిన విషయాన్ని పరిచయం చేస్తుంది; తెలుగులో ఉద్ధరణార్థక ‘అని’ సహజమైన అనుసంధానం.
- source_word: יָשׁוּב
  choice: తిరిగి తీసుకొచ్చి
  rationale: שׁוב సాధారణంగా ‘తిరిగివచ్చు’ అని అర్థమైనా, זרעך కర్మగా ఉన్నందున ఇక్కడ పొలం నుండి పంటను తిరిగి తీసుకురావడం అనే భావం వస్తుంది.
- source_word: זַרְעֶךָ
  choice: నీ విత్తనాన్ని
  rationale: మూలంలోని ‘నీ విత్తనం’ అనే పదరూపాన్ని నిలుపుతుంది; వ్యవసాయ సందర్భంలో ఇది కోసిన ధాన్యాన్ని లేదా పంటను సూచించే అవకాశాన్ని పాదసూచిక వివరిస్తుంది.
- source_word: גָרְנְךָ
  choice: నీ కళ్లంలో
  rationale: גֹּרֶן ధాన్యం నూర్చే కళ్లాన్ని సూచిస్తుంది, గాదెను లేదా నిల్వగదిని కాదు. స్థానార్థాన్ని తెలుగులో ‘కళ్లంలో’ సహజంగా తెలియజేస్తుంది.
- source_word: יֶאֱסֹף
  choice: దాన్ని పోగుచేస్తుందని
  rationale: אָסַף అంటే పోగుచేయడం లేదా సమకూర్చడం. తెలుగులో అవసరమైన కర్మగా ‘దాన్ని’ ముందున్న విత్తనం/పంటను సూచిస్తుంది.
