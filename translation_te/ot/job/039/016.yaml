  yaml_path: translation/ot/job/039/016.yaml
  text: She treats her young harshly[a], as if they were not hers; her labor is in vain, without fear.
translation:
  language: te
  text: తన పిల్లలతో అవి తనవి కానట్టుగా కఠినంగా వ్యవహరిస్తుంది[a]; తన శ్రమ వ్యర్థమే, అయినా ఆమెకు భయం లేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, మరింత అక్షరార్థంగా, “తన పిల్లలను కఠినపరుస్తుంది, అవి తనవి కానట్టుగా.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הִקְשִׁיחַ
  choice: కఠినంగా ప్రవర్తిస్తుంది
  rationale: קשׁח హిఫీల్ రూపం కఠినపరచడం లేదా కఠినంగా వ్యవహరించడం అనే భావాన్ని ఇస్తుంది. ఉష్ట్రపక్షి తన పిల్లలపట్ల చూపే ప్రవర్తన సందర్భంలో ఈ సహజమైన తెలుగు పదబంధం తగినది.
- source_word: בָּנֶיהָ
  choice: తన పిల్లలు
  rationale: అక్షరార్థంగా ‘ఆమె కుమారులు/పిల్లలు’; జంతువు సందర్భంలో ‘తన పిల్లలు’ సహజంగా ఉండి మూలంలోని సంబంధాన్ని కాపాడుతుంది.
- source_word: לְלֹא לָהּ
  choice: తనవి కానట్టుగా
  rationale: ‘ఆమెకు చెందినవి కానట్లుగా’ అనే భావాన్ని సంక్షిప్తమైన, సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: לְרִיק
  choice: వ్యర్థమైనా
  rationale: ריק యొక్క నిష్ఫలత భావాన్ని ఇస్తుంది; వాక్యంలోని בְּלִי פָחַד తో సంబంధాన్ని తెలుగులో సహజంగా చూపేందుకు concessive నిర్మాణం వాడబడింది.
- source_word: יְגִיעָהּ
  choice: తన శ్రమ
  rationale: పిల్లలను కనడం లేదా వాటికోసం పడిన ప్రయాసను సూచించే విస్తృత భావాన్ని ‘శ్రమ’ సహజంగా అందిస్తుంది.
- source_word: בְּלִי פָחַד
  choice: అది భయపడదు
  rationale: అక్షరార్థమైన ‘భయం లేకుండా’ అనే భావాన్ని తెలుగులో స్పష్టమైన క్రియారూపంగా వ్యక్తం చేస్తుంది; ఆందోళన లేకపోవడం అనే సందర్భార్థాన్ని ముందుగానే సంకుచితం చేయదు.
