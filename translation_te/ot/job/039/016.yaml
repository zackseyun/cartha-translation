translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన శైలి. ఉష్ట్రపక్షిని సూచించే స్త్రీలింగ హీబ్రూ రూపానికి తెలుగులో సహజమైన నపుంసక సూచన ‘అది’ వాడబడింది. చివరి పదబంధంలోని సంక్షిప్తతను సాధ్యమైనంతవరకు నిలిపి, దాని సంబంధాన్ని స్పష్టంచేయడానికి ‘వ్యర్థమైనా’ అనే నిర్మాణం ఎంచుకోబడింది.
