  terminology: ‘అడవి జంతువు’ is a natural modern equivalent for חַיַּת הַשָּׂדֶה in this context. ‘నలిపివేయు’ and ‘తొక్కివేయు’ suitably distinguish the two parallel Hebrew verbs without overinterpreting them.
