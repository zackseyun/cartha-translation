source:
  edition: WLC
  text: וַ֭/תִּשְׁכַּח כִּי רֶ֣גֶל תְּזוּרֶ֑/הָ וְ/חַיַּ֖ת הַ/שָּׂדֶ֣ה תְּדוּשֶֽׁ/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/039/015.yaml
  text: and she forgets that a foot may crush them[b][a], and a wild animal may trample them.
translation:
  language: te
  text: ఒక కాలు తన గుడ్లను నలిపివేయవచ్చని[a], అడవి జంతువు వాటిని తొక్కివేయవచ్చని అది మరచిపోతుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘ఒక కాలు దానిని నలిపివేయవచ్చు ... అడవి జంతువు దానిని తొక్కివేయవచ్చు.’ హీబ్రూలోని స్త్రీలింగ ఏకవచన ప్రత్యయం, విడిచిపెట్టిన గుడ్లను సమిష్టిగా సూచిస్తున్నట్లు కనిపిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּשְׁכַּח
  choice: అది మరచిపోతుంది
  rationale: שׁכח ధాతువు Qal wayyiqtol తృతీయ పురుష స్త్రీలింగ ఏకవచనం. నిప్పుకోడి గురించిన సజీవ వర్ణన కొనసాగుతున్నందున తెలుగులో వర్తమాన కాలం సహజంగా ఉంది.
- source_word: כִּי
  choice: అని
  rationale: ఇక్కడ כִּי కారణాన్ని కాక, మరచిపోయిన విషయాన్ని పరిచయం చేస్తుంది; అందువల్ల తెలుగులో ‘అని’ తగినది.
- source_word: רֶגֶל
  choice: ఏదైనా కాలు
  rationale: ఏ కాలు అయినా వాటికి హాని చేయగలదనే అనిర్దిష్ట భావాన్ని, అలాగే మూలంలోని స్పష్టమైన ‘కాలు’ రూపకాన్ని నిలుపుతుంది.
- source_word: תְּזוּרֶהָ
  choice: నలిపివేయవచ్చు
  rationale: ఈ సందర్భంలో కాలితో తొక్కడం వల్ల కలిగే నష్టాన్ని సూచిస్తుంది. స్త్రీలింగ ఏకవచన ప్రత్యయం సందర్భానుసారం సమిష్టిగా గుడ్లను సూచిస్తుంది.
- source_word: וְחַיַּת הַשָּׂדֶה
  choice: అడవి జంతువు
  rationale: అక్షరార్థంగా ‘పొలంలోని/బయటి ప్రదేశంలోని జంతువు’; ఆధునిక తెలుగులో ‘అడవి జంతువు’ సహజంగా ఉండి, పెంపుడు కాని భూజంతువు అనే భావాన్ని అందిస్తుంది.
- source_word: תְּדוּשֶׁהָ
  choice: వాటిని తొక్కివేయవచ్చు
  rationale: דושׁ అంటే ‘తొక్కు/కాలితో అణగదొక్కు.’ ‘తొక్కివేయు’ ముందు క్రియకు సమాంతరంగా ఉండి సందర్భంలోని ప్రమాదాన్ని స్పష్టంగా తెలియజేస్తుంది.
