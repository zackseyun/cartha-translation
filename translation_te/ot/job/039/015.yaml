translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కవితాత్మక వాక్య నిర్మాణం. మునుపటి సందర్భంలో నిప్పుకోడి నేలపై విడిచిన గుడ్లు స్పష్టంగా ఉన్నందున ప్రధాన పాఠంలో ‘తన గుడ్లను’ అని వ్యక్తీకరించబడింది; హీబ్రూ ప్రత్యయపు వ్యాకరణ రూపం పాదటిప్పణిలో భద్రపరచబడింది.
