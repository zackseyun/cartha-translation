translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన కవితాత్మక శైలిని ఉపయోగించాం. యుద్ధగుఱ్ఱం చర్య స్పష్టంగా ఉండేందుకు ‘గిట్టలతో’ అని వ్యక్తీకరించాం; ‘దూసుకుపోతుంది’ వంటి మూలంలో లేని తీవ్రతను చేర్చలేదు.
