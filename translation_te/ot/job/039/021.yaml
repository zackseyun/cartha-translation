  text: יַחְפְּר֣וּ בָ֭/עֵמֶק וְ/יָשִׂ֣ישׂ בְּ/כֹ֑חַ יֵ֝צֵ֗א לִ/קְרַאת נָֽשֶׁק־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/039/021.yaml
  text: It paws in the valley and rejoices in its strength[b][a]; it goes out to meet the weapons.
translation:
  language: te
  text: అది లోయలో గిట్టలతో నేలను గీకుతుంది[a], తన బలంతో ఉల్లసిస్తుంది; ఆయుధాలను ఎదుర్కొనడానికి బయలుదేరుతుంది.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘లోయలో తవ్వుతుంది.’ హీబ్రూ క్రియకు అక్షరార్థం ‘తవ్వు’; ఇక్కడ అది యుద్ధగుఱ్ఱం తన గిట్టలతో నేలను గీకడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘యుద్ధాన్ని ఎదుర్కోవడానికి.’ హీబ్రూ నామవాచకం ఆయుధాలను లేదా ఆయుధసామగ్రిని సూచించగలదు; విస్తృతార్థంలో సాయుధ పోరాటాన్ని కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחְפְּרוּ
  choice: నేలను గిట్టలతో గీకుతూ
  rationale: חפר అనే క్రియకు అక్షరార్థంగా ‘తవ్వు’ అని అర్థం. ఇక్కడ యుద్ధగుఱ్ఱం తన గిట్టలతో నేలను గీకే చర్యను సూచిస్తున్నందున, ఆధునిక తెలుగులో స్పష్టమైన సహజ చిత్రణగా ఇలా అనువదించబడింది.
- source_word: בָעֵמֶק
  choice: లోయలో
  rationale: עֵמֶק సాధారణంగా లోయను లేదా పల్లపు ప్రాంతాన్ని సూచిస్తుంది; ‘లోయలో’ మూలపదానికి నేరమైన సమానార్థకం.
- source_word: וְיָשִׂישׂ
  choice: ఉల్లసిస్తుంది
  rationale: שׂושׂ ఆనందించడం, ఉప్పొంగడం అనే బలమైన భావాన్ని వ్యక్తం చేస్తుంది. ‘ఉల్లసిస్తుంది’ గుఱ్ఱం ఉత్సాహాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: בְּכֹחַ
  choice: తన బలాన్ని బట్టి
  rationale: בְּ ఉపసర్గ ఇక్కడ బలంలో, బలంతో, లేదా బలాన్ని బట్టి ఉల్లసించడాన్ని సూచించవచ్చు. తెలుగు సహజత్వం కోసం ‘తన బలాన్ని బట్టి’ ఎంచుకున్నప్పటికీ మూలంలోని సంబంధాన్ని అతిగా నిర్దిష్టం చేయదు.
- source_word: יֵצֵא
  choice: బయలుదేరుతుంది
  rationale: יצא యొక్క ప్రాథమిక భావం బయటికి వెళ్లడం. ‘బయలుదేరుతుంది’ దాడి చేస్తుంది అనే అదనపు భావాన్ని చేర్చకుండా సందర్భానికి సహజంగా సరిపోతుంది.
- source_word: לִקְרַאת
  choice: ఎదుర్కోవడానికి
  rationale: לקראת అంటే ఎదురుగా వెళ్లడం లేదా కలుసుకోవడం. ఆయుధాల సందర్భంలో ‘ఎదుర్కోవడానికి’ సహజమైన తెలుగు ప్రయోగం.
- source_word: נָשֶׁק
  choice: ఆయుధాలను
  rationale: נֶשֶׁק ఆయుధాలను లేదా సమష్టిగా ఆయుధసామగ్రిని సూచిస్తుంది; విస్తృతార్థంలో యుద్ధాన్నీ సూచించగలదు. ప్రధాన పాఠంలో concrete అర్థమైన ‘ఆయుధాలను’ నిలిపాం.
