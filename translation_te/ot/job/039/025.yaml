source:
  edition: WLC
  text: בְּ/דֵ֤י שֹׁפָ֨ר יֹ֘אמַ֤ר הֶאָ֗ח וּֽ֭/מֵ/רָחוֹק יָרִ֣יחַ מִלְחָמָ֑ה רַ֥עַם שָׂ֝רִים וּ/תְרוּעָֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/039/025.yaml
  text: At the blast of the trumpet he says[a], ‘Aha!’ From far away he smells the battle[c][b], the thunder of commanders and the war cry.
translation:
  language: te
  text: బాకా మోగినప్పుడల్లా అది, “ఆహా!” అంటుంది.[a] దూరం నుంచే యుద్ధపు వాసనను పసిగడుతుంది—సేనాధిపతుల ఉరుమును, యుద్ధకేకను.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ఆహా!” అనేది యుద్ధానికి సిద్ధంగా ఉన్న గుర్రపు ఉత్సాహాన్ని తెలిపే కేక.
    reason: cultural_note
  - marker: b
    text: “ఉరుము” అనేది ఇక్కడ పెద్ద యుద్ధధ్వనికి రూపకం. “యుద్ధకేక”కు అనువదించిన హీబ్రూ పదం యుద్ధకేకను లేదా సంకేతంగా చేసే బాకా ధ్వనిని కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּדֵי שֹׁפָר
  choice: బాకా మోగగానే
  rationale: ఈ హీబ్రూ ప్రయోగం బాకా మోగే సందర్భాన్ని సూచిస్తుంది. ‘మోగగానే’ కాలసంబంధ భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: שֹׁפָר
  choice: బాకా
  rationale: యుద్ధ సంకేతానికి ఉపయోగించే కొమ్ము వాయిద్యాన్ని సందర్భానుకూలంగా, సామాన్య పాఠకులకు అర్థమయ్యేలా సూచిస్తుంది.
- source_word: יֹאמַר הֶאָח
  choice: అది, “ఆహా!” అంటుంది
  rationale: సాధారణమైన ‘అను’ అనే క్రియను నిలిపి, యుద్ధాశ్వాన్ని సజీవంగా చిత్రించే వ్యక్తీకరణను కాపాడుతుంది; ‘ఆహా!’ ఉత్సాహభరితమైన స్పందన.
- source_word: וּמֵרָחוֹק
  choice: దూరం నుంచే
  rationale: దూరంలో ఉండగానే గ్రహిస్తుందనే బలాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: יָרִיחַ מִלְחָמָה
  choice: యుద్ధపు వాసనను పసిగడుతుంది
  rationale: ריח యొక్క వాసన ద్వారా గ్రహించే సూటి చిత్రాన్ని కాపాడుతూ, తెలుగులో సహజమైన ‘పసిగట్టు’ను ఉపయోగిస్తుంది.
- source_word: רַעַם שָׂרִים
  choice: సేనాధిపతుల ఉరుమును
  rationale: రַעַם యొక్క అక్షరార్థమైన ‘ఉరుము’ రూపకాన్ని నిలిపి, సైనిక సందర్భంలో שָׂרִיםను ‘సేనాధిపతులు’గా అనువదిస్తుంది.
- source_word: וּתְרוּעָה
  choice: యుద్ధనాదాన్ని
  rationale: ఈ పదానికి కేక లేదా సంకేతధ్వని అనే అర్థాలు ఉండవచ్చు; ఇక్కడ సైనిక సందర్భాన్ని స్పష్టంగా ఉంచుతూ ఆ విస్తృత ధ్వని భావాన్ని ‘యుద్ధనాదం’ తెలియజేస్తుంది.
