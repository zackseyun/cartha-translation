translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కవితాత్మక శైలి. సందర్భంలోని యుద్ధాశ్వాన్ని తెలుగులో నపుంసక ఏకవచనంగా సూచించాం. చివరి భాగంలో ‘వింటుంది’ అనేది హీబ్రూ వాక్యంలో స్పష్టంగా లేని, కానీ ధ్వనులను తెలుగులో సహజంగా అనుసంధానించడానికి అవసరమైన పూరక క్రియ.
