  text: יְת֣וּר הָרִ֣ים מִרְעֵ֑/הוּ וְ/אַחַ֖ר כָּל יָר֣וֹק יִדְרֽוֹשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/039/008.yaml
  text: He explores the mountains for his pasture[b][a], and he searches after every green thing.
translation:
  language: te
  text: కొండల ప్రాంతమే దాని మేతస్థలం[a]; అది ప్రతి పచ్చని మొక్కను వెదుకుతుంది[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కొండల శ్రేణులే దాని మేతభూమి.”
    reason: lexical_alternative
  - marker: b
    text: “పచ్చని మొక్క” ఇక్కడ తాజా పచ్చని వృక్షసంపద లేదా పచ్చికను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְתוּר
  choice: సంచరిస్తుంది
  rationale: תור అనే క్రియకు అన్వేషించడం, గాలిస్తూ తిరగడం, సంచరించడం అనే భావాలు ఉన్నాయి. అడవి గాడిద ఆహారం కోసం కొండల్లో స్వేచ్ఛగా తిరిగే సందర్భంలో ‘సంచరిస్తుంది’ సహజంగా ఉంది; అన్వేషణ భావాన్నీ సందర్భం ద్వారా తెలియజేస్తుంది.
- source_word: הָרִים
  choice: కొండల్లో
  rationale: הָרִים అంటే పర్వతాలు లేదా కొండలు. సాధారణ ఆధునిక తెలుగులో ఈ జంతువు మేత కోసం తిరిగే భూభాగాన్ని ‘కొండల్లో’ సహజంగా వ్యక్తపరుస్తుంది.
- source_word: מִרְעֵהוּ
  choice: తన మేత కోసం
  rationale: מִרְעֶה మేత, మేతభూమి, లేదా మేసే స్థలాన్ని సూచించగలదు. ‘తన మేత కోసం’ అనే రూపం స్వామ్య ప్రత్యయాన్ని నిలుపుతూ, ఆహారం కోసం సంచరించే భావాన్ని తెలుగులో సహజంగా ఇస్తుంది.
- source_word: וְאַחַר
  choice: —నూ
  rationale: אַחַר తో కూడిన דרשׁ ఇక్కడ దేనినైనా వెదకడం లేదా దాని వెంటపడడం అనే భావాన్ని ఇస్తుంది. తెలుగులో ‘ప్రతి మొక్కనూ వెదుకుతుంది’ అనే నిర్మాణం ఆ లక్ష్యార్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: כָּל
  choice: ప్రతి
  rationale: כָּל ఇక్కడ విభజనార్థకంగా ‘ప్రతి’ లేదా ‘ఏదైనా’ అనే భావం ఇస్తుంది. ‘ప్రతి’ మూలంలోని విస్తృతిని నిలుపుతుంది.
- source_word: יָרוֹק
  choice: పచ్చగా ఉన్న ప్రతి మొక్క
  rationale: יָרוֹק అక్షరార్థంగా పచ్చనిదాన్ని, ఈ సందర్భంలో తాజా పచ్చని వృక్షవృద్ధిని సూచిస్తుంది. తెలుగులో ‘పచ్చగా ఉన్న ... మొక్క’ స్పష్టంగా, సహజంగా ఉంటుంది; పదం విస్తృతంగా పచ్చని మేతను సూచించగలదని పాదటిప్పణి తెలియజేస్తుంది.
- source_word: יִדְרֹשׁ
  choice: వెదుకుతుంది
  rationale: דרשׁ Qal రూపం ఇక్కడ వెదకడం, అన్వేషించడం అనే అర్థం ఇస్తుంది. మేత కోసం చురుకుగా గాలించే సందర్భానికి ‘వెదుకుతుంది’ సరిపోతుంది.
