revisions:
- from: అది తన మేత కోసం కొండల్లో సంచరిస్తుంది[a]; పచ్చగా ఉన్న ప్రతి మొక్కనూ వెదుకుతుంది[b].
  to: కొండల ప్రాంతమే దాని మేతస్థలం[a]; అది ప్రతి పచ్చని మొక్కను వెదుకుతుంది[b].
  rationale: 'The revision restores the nominal syntax of the first Hebrew colon: the mountainous range is the wild donkey’s grazing ground. It retains the second colon’s active searching and the comprehensive sense of “every/all green thing,” while using natural Telugu vocabulary and footnotes that do not narrow the vegetation to trees.'
