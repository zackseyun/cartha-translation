translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. సందర్భంలోని అడవి గాడిదను సూచిస్తూ సహజ తెలుగు ప్రకారం నపుంసక ఏకవచన సర్వనామం ‘అది’ ఉపయోగించబడింది. హెబ్రీ వాక్యంలోని అన్వేషణ, సంచారం, తాజా పచ్చని మేత అనే భావాలు నిలుపబడ్డాయి.
