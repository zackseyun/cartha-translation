lexical_decisions:
- source_word: תִּכְרַעְנָה
  choice: వంగి
  rationale: כרע అనే క్రియ శరీరాన్ని కిందికి వంచడాన్ని సూచిస్తుంది. జంతువుల ప్రసవ సందర్భంలో సహజంగా ఉండే భంగిమను సంక్షిప్తంగా, కవితాత్మకంగా వ్యక్తం చేస్తుంది.
- source_word: יַלְדֵיהֶן
  choice: తమ పిల్లలను
  rationale: ילד యొక్క ఈ నామరూపం పుట్టిన సంతానాన్ని సూచిస్తుంది. ఇక్కడ జంతువుల సందర్భం కాబట్టి ‘పిల్లలు’ సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: תְּפַלַּחְנָה
  choice: కంటాయి
  rationale: ఈ అరుదైన క్రియ ఇక్కడ ప్రసవించి పిల్లలను వెలికి తేవడాన్ని సూచిస్తుంది. ‘కంటాయి’ స్పష్టమైనది, సహజమైనది, సందర్భానికి తగినది.
- source_word: חֶבְלֵיהֶם
  choice: తమ ప్రసవవేదనలను
  rationale: חבל కు తాళ్లు వంటి ఇతర అర్థాలు ఉన్నా, ప్రసవ సందర్భంలో ఇది ప్రసవవేదనలను సూచిస్తుంది. తెలుగు పాఠకులకు ఈ ఎంపిక స్పష్టంగా ఉంటుంది.
- source_word: תְּשַׁלַּחְנָה
  choice: విడిచిపెడతాయి
  rationale: שלח యొక్క ప్రాథమిక భావం పంపివేయడం లేదా విడుదల చేయడం. ఇక్కడ ప్రసవంతో వేదనలు తొలగిపోవడాన్ని చిత్రాత్మకంగా తెలియజేస్తుంది.
