  - marker: b
    text: లేదా, ‘తమ జననవేదనలను.’ హీబ్రూలో ‘వారి’ అనే స్వత్వప్రత్యయం వ్యాకరణపరంగా పుంలింగంలో ఉంది; సందర్భంలో అది ఆడ జంతువుల ప్రసవవేదనలనే సూచిస్తుంది.
