    rationale: כרע ప్రసవసందర్భంలో కేవలం వంగడాన్ని కాక శరీరాన్ని కిందికి దించడం లేదా మోకరిల్లడాన్ని సూచిస్తుంది. ‘క్రిందికి వంగి’ ఈ భావాన్ని స్పష్టపరుస్తుంది.
