  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదమైన కవితా ధోరణితో అనువదించబడింది. మొదటి రెండు క్రియలను తెలుగు వాక్యప్రవాహానికి అనుగుణంగా కలిపి, హీబ్రూ సమాంతర నిర్మాణాన్ని సాధ్యమైనంతవరకు నిలిపాం.
