  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: הֲ/יָדַ֗עְתָּ עֵ֭ת לֶ֣דֶת יַעֲלֵי סָ֑לַע חֹלֵ֖ל אַיָּל֣וֹת תִּשְׁמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/039/001.yaml
  text: Do you know the time when the mountain goats give birth? Do you watch over the deer in labor?[a][b][c]
translation:
  language: te
  text: కొండ మేకలు ప్రసవించే సమయం నీకు తెలుసా? ప్రసవవేదన పడుతున్న ఆడ జింకలను నీవు గమనిస్తావా?[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “బండల అడవి మేకలు”; హీబ్రూ పదబంధం కొండల్లో నివసించే అడవి మేకలను, బహుశా ఐబెక్స్‌లను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ పదం ప్రత్యేకంగా ఆడ జింకలను సూచిస్తుంది.
    reason: lexical_clarification
  - marker: c
    text: “గమనిస్తావా?” అని అనువదించిన క్రియకు “గమనించి చూస్తావా?” లేదా “కాపలా కాస్తావా?” అనే అర్థాలు కూడా ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיָדַעְתָּ
  choice: నీకు తెలుసా?
  rationale: ప్రశ్నార్థక הֲతో కూడిన ידע క్రియ ఇక్కడ అలంకారిక ప్రశ్నగా ఉంది; ఆధునిక తెలుగులో “నీకు తెలుసా?” దాని భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: עֵת לֶדֶת
  choice: ప్రసవించే సమయం
  rationale: עֵת అంటే సమయం లేదా కాలం; ילד క్రియారూపంతో కలిసి ప్రసవించే సమయాన్ని సూచిస్తుంది.
- source_word: יַעֲלֵי סָלַע
  choice: కొండ మేకలు
  rationale: అక్షరార్థంగా “బండల అడవి మేకలు”; ఇది కొండ ప్రాంతాల్లో నివసించే అడవి మేకలను, బహుశా ఐబెక్స్‌లను సూచిస్తుంది. “కొండ మేకలు” స్పష్టంగా, సహజంగా ఉంది.
- source_word: חֹלֵל
  choice: ప్రసవవేదన పడుతున్న
  rationale: ఈ రూపం ప్రసవ సమయంలో కలిగే వేదన లేదా మెలికలు పడడాన్ని సూచిస్తుంది; తెలుగులో ఈ సందర్భానికి “ప్రసవవేదన పడుతున్న” సహజమైన వ్యక్తీకరణ.
- source_word: אַיָּלוֹת
  choice: ఆడ జింకలను
  rationale: ఈ పదం ఆడ జింకలను సూచిస్తుంది; లింగసూచనను తెలుగులో స్పష్టంగా నిలిపేందుకు “ఆడ జింకలు” అని అనువదించబడింది.
- source_word: תִּשְׁמֹר
  choice: నీవు గమనిస్తావా?
  rationale: שׁמרకు కాపాడడం, కనిపెట్టడం, గమనించడం అనే భావాలు ఉన్నాయి. ఈ సందర్భంలో జంతువుల ప్రసవాన్ని శ్రద్ధగా పరిశీలించడమే ప్రధాన భావం; సంరక్షణ అనే అదనపు భావాన్ని బలవంతంగా చేర్చకుండా “గమనిస్తావా?” అని ఇచ్చాం.
theological_decisions:
- issue: תִּשְׁמֹרలో పర్యవేక్షణ వర్సెస్ సంరక్షణ
  choice: గమనిస్తావా?
  alternative: కాపలా కాస్తావా? / సంరక్షిస్తావా?
  rationale: దేవుని శ్రద్ధగల పర్యవేక్షణ సందర్భంలో సూచితమవవచ్చు; అయినా మూలక్రియలోని ద్వంద్వార్థాన్ని ఒక నిర్దిష్ట సంరక్షణ సిద్ధాంతంగా మార్చకుండా, సందర్భానుకూలమైన తటస్థ భావాన్ని ప్రధాన పాఠ్యంలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. దేవుడు యోబును ఏకవచనంలో సంబోధిస్తున్నందున “నీకు,” “నీవు” రూపాలు వాడబడ్డాయి. సమాంతర ప్రశ్నా నిర్మాణం నిలుపబడింది.
