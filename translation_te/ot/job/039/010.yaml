source:
  edition: WLC
  text: הֲֽ/תִקְשָׁר רֵ֭ים בְּ/תֶ֣לֶם עֲבֹת֑/וֹ אִם יְשַׂדֵּ֖ד עֲמָקִ֣ים אַחֲרֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/039/010.yaml
  text: Will you bind the wild ox in the furrow with its rope[b][a], or will it harrow the valleys behind you?
translation:
  language: te
  text: అడవి ఎద్దును దాని తాడుతో చాళ్లో కట్టగలవా?[a] లేక అది నీ వెనుక లోయలను చదును చేస్తుందా?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘అడవి ఎద్దు’కు బదులు ‘ఆరోక్స్’ లేదా ‘అడవి కోడె’ అని కూడా అనువదించవచ్చు. హీబ్రూ רֵים బలమైన అడవి గోజాతి జంతువును సూచిస్తుంది; పాత అనువాదాల్లో కనిపించే పౌరాణిక ‘ఏకశృంగి’ని కాదు.
    reason: lexical_alternative
  - marker: b
    text: ‘లోయలను దున్నుతుందా?’ అని కూడా అనువదించవచ్చు. హీబ్రూ క్రియ ఇక్కడ నేలను గడ్డలు విరిచి చదును చేయడం వంటి పనిని మరింత నిర్దిష్టంగా సూచించే అవకాశం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתִקְשָׁר
  choice: కట్టగలవా?
  rationale: קשׁר అంటే కట్టు లేదా బంధించు. ఇక్కడ వ్యవసాయ పనికోసం అదుపులో పెట్టడాన్ని సూచించే సహజమైన ఆధునిక తెలుగు ప్రయోగం ‘కట్టగలవా?’
- source_word: רֵים
  choice: అడవి ఎద్దు
  rationale: רֵים బలమైన అడవి గోజాతి జంతువును సూచిస్తుంది; పౌరాణిక ‘ఏకశృంగి’ని కాదు. ‘అడవి ఎద్దు’ సాధారణ పాఠకులకు స్పష్టంగా ఉండి, దాని మచ్చికలేని బలాన్ని తెలియజేస్తుంది.
- source_word: בְּתֶלֶם
  choice: చాళ్లో
  rationale: תלם దున్నిన నేలలో ఏర్పడే చాలు. ‘చాళ్లో’ అనే రూపం జంతువును వ్యవసాయ పనికి కట్టే దృశ్యాన్ని సంక్షిప్తంగా, సహజంగా అందిస్తుంది.
- source_word: עֲבֹתוֹ
  choice: దాని తాడుతో
  rationale: עבות కట్టడానికి ఉపయోగించే తాడు లేదా దృఢమైన త్రాడును సూచిస్తుంది; ఏకవచన పుంలింగ ప్రత్యయం అడవి ఎద్దునే సూచిస్తుంది.
- source_word: אִם
  choice: లేక
  rationale: ఈ అలంకారిక ప్రశ్నలో אִם షరతును కాక రెండవ సమాంతర ప్రశ్నను ప్రవేశపెడుతుంది. అందువల్ల ‘లేక’ సరైన అనుసంధానం.
- source_word: יְשַׂדֵּד
  choice: చదును చేస్తుందా?
  rationale: వ్యవసాయ సందర్భంలో שׂדד నేలను మరింతగా పనిచేయడం, గడ్డలను విరిచి చదును చేయడం అనే భావాన్ని ఇస్తుంది. తెలుగు పాఠకులకు ‘చదును చేయు’ స్పష్టంగా ఉండి, మొదటి దున్నుడుతో దీనిని కలిపివేయదు.
- source_word: עֲמָקִים
  choice: లోయలను
  rationale: עמקים యొక్క సాధారణ అర్థం లోయలు లేదా పల్లపు ప్రదేశాలు. మూలంలోని విస్తృత భూదృశ్యాన్ని వ్యాఖ్యానంతో కుదించకుండా ‘లోయలను’గా నిలిపాం.
- source_word: אַחֲרֶיךָ
  choice: నీ వెనుక
  rationale: రైతు దిశానిర్దేశంలో జంతువు అతని వెనుక పనిచేసే దృశ్యాన్ని ‘నీ వెనుక’ సహజంగా, సజీవంగా తెలియజేస్తుంది.
