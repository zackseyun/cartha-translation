source:
  edition: WLC
  text: מִֽי שִׁלַּ֣ח פֶּ֣רֶא חָפְשִׁ֑י וּ/מֹסְר֥וֹת עָ֝ר֗וֹד מִ֣י פִתֵּֽחַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/039/005.yaml
  text: Who has let the wild donkey go free? Who has untied the bonds of the swift donkey?[a]
translation:
  language: te
  text: అడవి గాడిదను స్వేచ్ఛగా విడిచిపెట్టినవాడు ఎవరు? అడవి గాడిద బంధనాలను విప్పినవాడు ఎవరు?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఒనాగర్ బంధనాలను విప్పినవాడు ఎవరు?” עָרוֹד అనే హీబ్రూ పదాన్ని అడవి గాడిదకు మరో పేరుగా అర్థం చేసుకోవచ్చు; కొందరు దానిని “ఒనాగర్” అని అనువదిస్తారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי
  choice: ఎవరు
  rationale: దేవుడు అడిగే అలంకారిక ప్రశ్నను పరిచయం చేసే ప్రశ్నార్థక సర్వనామం.
- source_word: שִׁלַּח
  choice: వదిలింది
  rationale: పియేల్ సంపూర్ణ క్రియ ఇక్కడ విడుదల చేయడం లేదా స్వేచ్ఛగా వెళ్లనివ్వడం అనే భావాన్ని ఇస్తుంది.
- source_word: פֶּרֶא
  choice: అడవి గాడిద
  rationale: మచ్చిక చేయని అడవి గాడిదను సూచించే స్పష్టమైన ఆధునిక తెలుగు పదబంధం.
- source_word: חָפְשִׁי
  choice: స్వేచ్ఛగా
  rationale: విడుదలైన స్థితిని తెలియజేస్తుంది; క్రియతో కలిపి తెలుగులో సహజంగా ఉంది.
- source_word: וּמֹסְרוֹת
  choice: కట్లను
  rationale: జంతువును అదుపులో ఉంచే బంధనాలను సూచిస్తుంది; సందర్భంలో సహజమైన, స్పష్టమైన పదం.
- source_word: עָרוֹד
  choice: అడవి గాడిద
  rationale: ఈ పదం కూడా అడవి గాడిదనే సూచిస్తుంది. మూలంలోని సమాంతరతను నిలుపుతూ, ఆధారం లేని ‘వేగమైన’ అనే లక్షణాన్ని చేర్చలేదు; ‘ఒనాగర్’ అనే నిర్దిష్ట పేరును పాదసూచికలో ఉంచాం.
- source_word: פִתֵּחַ
  choice: విప్పింది
  rationale: కట్ల సందర్భంలో బంధనాలను సడలించడం లేదా విప్పడం అనే అర్థాన్ని సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గంభీరమైన ప్రశ్నారూపాన్ని వాడాం. రెండు అర్ధపాదాల సమాంతర నిర్మాణాన్ని నిలిపాం; עָרוֹדకు ‘వేగమైన గాడిద’ అని సందర్భం నుంచి ఊహించిన లక్షణాన్ని ప్రధాన పాఠ్యంలో చేర్చలేదు.
