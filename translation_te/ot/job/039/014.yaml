  text: For she leaves her eggs to the earth and warms them on the dust,[a]
translation:
  language: te
  text: ఎందుకంటే, అది తన గుడ్లను నేలకు వదిలివేసి[a], వాటిని దుమ్ముమీద వెచ్చబరుస్తుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తన గుడ్లను నేలకు పరిత్యజించి.” హీబ్రూ క్రియకు కేవలం ‘వదిలివేయు’ కంటే బలమైన భావం ఉండవచ్చు; అయితే తరువాతి పాదం సంపూర్ణంగా పరిత్యజించడం కంటే గుడ్లు నేలపై బహిర్గతంగా ఉండడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి వర్ణనకు కారణాన్ని లేదా వివరణను పరిచయం చేసే హీబ్రూ సంధానపదంలోని భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: תַעֲזֹב
  choice: విడిచిపెట్టి
  rationale: עזב అనే క్రియకు ‘విడిచిపెట్టు, వదిలివేయు, పరిత్యజించు’ అనే భావాలు ఉన్నాయి. ఇక్కడ నేలపై గుడ్లను ఉంచడమే ప్రధాన దృశ్యం కాబట్టి ‘విడిచిపెట్టి’ సహజంగా ఉంటుంది; బలమైన ప్రత్యామ్నాయ భావాన్ని పాదసూచికలో ఉంచాం.
- source_word: לָאָרֶץ
  choice: నేలమీద
  rationale: అక్షరార్థంగా ‘భూమికి/నేలకు’ అనే భావం. ఈ జంతుశాస్త్రీయ దృశ్యంలో తెలుగులో ‘నేలమీద’ స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: בֵּצֶיהָ
  choice: తన గుడ్లను
  rationale: స్త్రీలింగ ఏకవచన స్వామ్యప్రత్యయంతో ఉన్న బహువచన నామవాచకాన్ని సందర్భానుసారంగా అందిస్తుంది.
- source_word: וְעַל עָפָר
  choice: దుమ్ములో
  rationale: עַל సాధారణంగా ‘మీద’ అయినా, గుడ్లు దుమ్ముతో సంబంధించి వెచ్చబడే దృశ్యాన్ని తెలుగులో ‘దుమ్ములో’ సహజంగా వ్యక్తపరుస్తుంది; కవితాత్మకమైన ‘దుమ్ము’ రూపాన్ని నిలుపుతుంది.
- source_word: תְּחַמֵּם
  choice: వెచ్చగా ఉంచుతుంది
  rationale: పియేల్ రూపంలోని ‘వెచ్చబరచు’ భావాన్ని సులభమైన ఆధునిక తెలుగులో ఇస్తుంది. ‘పొదుగుతుంది’ అనడం మూలంలో లేని సాంకేతిక భావాన్ని అధికంగా చేర్చవచ్చు.
