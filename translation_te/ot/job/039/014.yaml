translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కవితా గద్యశైలిని ఉపయోగించాం. ‘నేల’ మరియు ‘దుమ్ము’ అనే సమాంతర చిత్రాలను నిలిపి, హీబ్రూ క్రియలోని ‘విడిచిపెట్టడం/పరిత్యజించడం’ అనే అనిశ్చితిని పాదసూచికలో సంరక్షించాం.
