  terminology: ‘వదిలివేసి’ suitably represents עזב without forcing the stronger sense ‘abandons’; the footnote appropriately preserves that lexical possibility. ‘వెచ్చబరుస్తుంది’ directly renders the Piel verb ‘makes warm.’
