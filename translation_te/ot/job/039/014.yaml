  source_fidelity: 'The draft accurately conveys the causal כִּי, the eggs, and the warming action. However, it renders both לָאָרֶץ and וְעַל־עָפָר with locatives that blur the Hebrew’s deliberate distinction: she leaves the eggs “to the ground/earth,” then warms them “on the dust.”'
