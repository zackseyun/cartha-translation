    issue: The two Hebrew location phrases are not kept distinct.
    rationale: לָאָרֶץ is directional (‘to the earth/ground’), whereas וְעַל־עָפָר is ‘on the dust.’ The draft’s ‘నేలమీద’ followed by ‘దుమ్ములో’ both changes the second preposition and weakens the source’s contrast.
