translation:
  language: te
  text: ఎందుకంటే దేవుడు దానికి జ్ఞానం లేకుండా చేశాడు[a]; దానికి వివేచనలో వాటా ఇవ్వలేదు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దేవుడు దానికి జ్ఞానాన్ని మరిపించాడు,” లేదా “దానికి జ్ఞానం కొరవడేలా చేశాడు.”
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “దానికి వివేచనలో వాటా పంచలేదు”; అంటే, దానికి వివేచనలో వాటా ఇవ్వలేదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి వచనంలో చెప్పిన ఉష్ట్రపక్షి ప్రవర్తనకు కారణాన్ని పరిచయం చేసే కారణార్థక ప్రయోగం.
- source_word: הִשָּׁהּ
  choice: దానికి జ్ఞానం లేకుండా చేశాడు
  rationale: נשה ధాతువు హిఫీల్ రూపంలోని కారణార్థక భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; ‘మరచిపోయేలా చేశాడు’ అనే సాధ్యమైన భావాన్ని పాదటిప్పణిలో ఉంచి మూలంలోని అర్థవిస్తృతిని కాపాడింది.
- source_word: אֱלוֹהַּ
  choice: దేవుడు
  rationale: యోబు గ్రంథంలో ఏకవచన దైవనామానికి సహజమైన, ప్రమాణ తెలుగు అనువాదం.
- source_word: חָכְמָה
  choice: జ్ఞానం
  rationale: సరైన నిర్ణయశక్తి లేదా సహజ సామర్థ్యాన్ని సూచించే సాధారణ అర్థాన్ని నేరుగా వ్యక్తపరుస్తుంది.
- source_word: וְלֹא
  choice: ఇవ్వలేదు
  rationale: రెండవ వాక్యభాగంలోని నిరాకరణను స్పష్టంగా తెలియజేస్తుంది; తెలుగు వాక్య నిర్మాణంలో అర్థం సహజంగా ఉండేందుకు సంధి భావం విరామచిహ్నం ద్వారా వ్యక్తమైంది.
- source_word: חָלַק לָהּ
  choice: దానికి భాగం ఇవ్వలేదు
  rationale: חלק అనే క్రియలోని ‘పంచడం, వాటా కేటాయించడం’ అనే పంపిణీ భావాన్ని నిలుపుతుంది.
- source_word: בַּבִּינָה
  choice: వివేచనలో
  rationale: בינה సూచించే అవగాహన, విచక్షణ భావాన్ని ‘జ్ఞానం’తో భేదం కనిపించేలా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: ఉష్ట్రపక్షికి జ్ఞానం లేకపోవడంలో దేవుని క్రియాశీల పాత్ర
  choice: జ్ఞానం లేకుండా చేసినవాడిగా, వివేచనలో భాగం ఇవ్వనివాడిగా దేవుణ్ణి స్పష్టమైన కర్తగా ఉంచడం.
  alternative: దైవిక క్రియాశీలతను తగ్గించి, ‘దానికి జ్ఞానం లేదు’ అని మాత్రమే చెప్పడం.
  rationale: హీబ్రూ పాఠంలో אֱלוֹהַּ రెండు క్రియలకూ స్పష్టమైన కర్త. అందువల్ల అందులోని దైవశాస్త్ర సంబంధమైన ఉద్వేగాన్ని మృదువుచేయకుండా అలాగే నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రమాణ తెలుగులో సహజంగా, గంభీరంగా ఉండే శైలి ఉపయోగించబడింది. ఉష్ట్రపక్షిని సూచించేందుకు తెలుగులో సహజమైన నపుంసక సర్వనామం ‘దానికి’ వాడబడింది. మూలంలోని కారణార్థక క్రియను, ‘భాగం పంచడం’ అనే రూపకాన్ని ప్రధాన పాఠంలో సాధ్యమైనంత స్పష్టంగా నిలిపి, నిజమైన పదార్థ సందిగ్ధతలను పాదటిప్పణుల్లో ఇచ్చాం.
