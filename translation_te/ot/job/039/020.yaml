  text: Can you make him leap like the locust? The majesty of his snorting is terrifying[a].
translation:
  language: te
  text: 'మిడతలా దానిని గెంతించగలవా?[a]


    దాని బుసకొట్టడపు ఠీవి భయంకరమైనది.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేక, “మిడతలా దానిని ఉరుమింపజేయగలవా?” హెబ్రీ క్రియకు కంపింపజేయడం, కుదిపివేయడం, లేదా బలంగా కదిలించడం అనే భావాలు ఉండవచ్చు; కొందరు ఇక్కడ కదలికతోపాటు శబ్దం కూడా సూచించబడిందని భావిస్తారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתַרְעִישֶׁנּוּ
  choice: దాన్ని గెంతించగలవా
  rationale: רעשׁ హిఫిల్ రూపం కంపింపజేయడం, బలంగా కదిలించడం అనే భావాలను ఇవ్వగలదు. యుద్ధగుర్రాన్ని మిడతతో పోల్చిన ఈ సందర్భంలో, దాని ఉత్సాహభరితమైన ఎగిరే కదలికను సహజ తెలుగులో ‘గెంతించు’ అని వ్యక్తం చేశాం; ప్రశ్నార్థక దైవవాక్యాన్ని నిలిపాం.
- source_word: כָּאַרְבֶּה
  choice: మిడతలా
  rationale: ఏకవచన/జాతివాచక పోలికను తెలుగులో సహజంగా ‘మిడతలా’ అని అనువదించాం.
- source_word: הוֹד
  choice: గంభీరత
  rationale: ఈ పదానికి మహిమ, వైభవం, ఠీవి అనే భావాలున్నాయి. గుర్రం బుసకొట్టడంలోని భయంకరమైన ఠీవిని సహజంగా తెలియజేయడానికి ‘గంభీరత’ను ఎంచుకున్నాం.
- source_word: נַחְרוֹ
  choice: దాని బుసలోని
  rationale: ఈ రూపం ముక్కుపుటాల నుంచి బలంగా ఊదే శ్వాసను, అంటే గుర్రం బుసకొట్టడాన్ని సూచిస్తుంది; ‘సకిలింపు’ కంటే ‘బుస’ మూలభావానికి దగ్గరగా ఉంది.
- source_word: אֵימָה
  choice: భయం పుట్టిస్తుంది
  rationale: మూలంలోని ‘భయం/భీతి’ అనే నామవాచక విధేయాన్ని సహజ తెలుగులో ప్రభావాన్ని తెలిపే క్రియాత్మక నిర్మాణంగా ఇచ్చాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, కవితాత్మక గంభీరతను నిలుపుతూ సాధారణ పాఠకులకు స్పష్టంగా ఉండే పదాలను వాడాం. గుర్రానికి తెలుగులో సహజమైన నపుంసక సర్వనామ రూపం ‘దాన్ని/దాని’ ఉపయోగించాం.
