  text: Its young ones suck up blood[a], and where the slain are[b], there it is.
translation:
  language: te
  text: దాని పిల్లలు రక్తాన్ని పీల్చుతాయి[a]; హతులైనవారు ఎక్కడ ఉన్నారో[b], అక్కడ అది ఉంటుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దాని పిల్లలు రక్తాన్ని గుటకలు వేసి తాగుతాయి.’ హీబ్రూ క్రియ పీల్చడం, గుటకలు వేయడం, లేదా నాలుకతో నాకి తాగడం వంటి సజీవమైన భావాన్ని ఇవ్వవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘శవాలు ఎక్కడ ఉంటాయో, అక్కడ అది ఉంటుంది.’ హీబ్రూ పదం ‘హతులైనవారు’ అని చెప్పి, హింసాత్మక మరణాన్ని నొక్కిచెబుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶפְרֹחָיו
  choice: దాని పిల్లలు
  rationale: సందర్భంలో ఇది గద్ద పిల్లలను సూచిస్తుంది. తెలుగు వాక్యంలో ‘దాని పిల్లలు’ సహజంగా ఉండి, గూటిపిల్లలా లేక ఎగరడం నేర్చుకుంటున్న పిల్లలా అనే దశను అనవసరంగా నిర్దిష్టం చేయదు.
- source_word: יְעַלְעוּ
  choice: పీల్చుతాయి
  rationale: ఈ క్రియ రక్తాన్ని ఆత్రంగా పీల్చడం లేదా గుటకలు వేయడం అనే సజీవమైన చిత్రాన్ని ఇస్తుంది. ‘పీల్చుతాయి’ మూలంలోని తీవ్రతను సంక్షిప్తంగా, సహజంగా నిలుపుతుంది.
- source_word: דָם
  choice: రక్తాన్ని
  rationale: మూలపదానికి నేరమైన అర్థం; చిత్రాన్ని మృదువుచేయకుండా యథాతథంగా ఉంచుతుంది.
- source_word: וּבַאֲשֶׁר
  choice: ఎక్కడ ఉంటారో
  rationale: ఇది స్థానాన్ని తెలిపే సంబంధ వాక్యాన్ని ప్రవేశపెడుతుంది. తెలుగు వాక్యనిర్మాణంలో ‘ఎక్కడ ఉంటారో, అక్కడ’ సహజమైన సమానార్థక నిర్మాణం.
- source_word: חֲלָלִים
  choice: హతులైనవారు
  rationale: ఈ పదం సాధారణంగా హింసాత్మకంగా చంపబడినవారిని లేదా ప్రాణాంతకంగా గాయపడినవారిని సూచిస్తుంది. ‘హతులైనవారు’ హింసాత్మక మరణ భావాన్ని నిలుపుతూ కేవలం శవాలపై దృష్టిని పరిమితం చేయదు.
- source_word: שָׁם הוּא
  choice: అక్కడ అది ఉంటుంది
  rationale: సర్వనామం సందర్భంలోని పక్షిని తిరిగి సూచిస్తుంది. సాధారణ వర్ణనకు తెలుగు వర్తమానకాల రూపం సహజంగా సరిపోతుంది.
