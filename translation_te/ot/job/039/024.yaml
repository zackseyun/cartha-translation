  yaml_path: translation/ot/job/039/024.yaml
  text: With fierceness and rage he devours the ground[b][a], and he cannot stand still at the sound of the trumpet.
translation:
  language: te
  text: ఉద్ధృతితో, ఉగ్రావేశంతో అది నేలను మింగివేస్తుంది[a]; బాకా ధ్వని వినిపించగానే అది నిలకడగా ఉండలేకపోతుంది[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “నేలను మింగివేస్తుంది”; గుర్రం అత్యంత వేగంగా, ఉత్సాహంగా ముందుకు దూసుకుపోవడాన్ని తెలిపే సజీవమైన రూపకం.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “బాకా ధ్వని వినిపించినప్పుడు అది వెనుకాడదు.” ఇక్కడి హీబ్రూ క్రియకు సాధారణంగా “నమ్ము” అనే అర్థం ఉన్నా, ఈ సందర్భంలో “నిలకడగా ఉండు” లేదా “తనను అదుపులో ఉంచుకో” అనే ప్రయోగార్థం ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרַעַשׁ
  choice: ఉద్ధృతితో
  rationale: ఈ సందర్భంలో పదం సూచించే తీవ్రమైన కదలికను, కల్లోలభరితమైన దూకుడును సహజమైన తెలుగులో తెలియజేస్తుంది; భూకంపమనే అక్షరార్థాన్ని అనవసరంగా రుద్దదు.
- source_word: וְרֹגֶז
  choice: ఉగ్రావేశంతో
  rationale: కలవరం, వణుకు, ఆగ్రహావేశం అనే అర్థపరిధిలో, యుద్ధాశ్వం యొక్క అదుపులేని ఉద్రేకాన్ని వ్యక్తం చేస్తుంది.
- source_word: יְגַמֶּא אָרֶץ
  choice: నేలను మింగివేస్తుంది
  rationale: ‘నేలను మింగడం’ అనే హీబ్రూ రూపకాన్ని నిలుపుతూ, అత్యంత వేగంగా దూసుకుపోవడాన్ని స్పష్టంగా చిత్రిస్తుంది.
- source_word: וְלֹא יַאֲמִין
  choice: నిలకడగా ఉండలేకపోతుంది
  rationale: אמן పదానికి సాధారణంగా ‘నమ్ము’ అనే అర్థం ఉన్నప్పటికీ, ఇక్కడ యుద్ధబాకా వినగానే గుర్రం స్థిరంగా నిలవలేకపోవడం లేదా తనను అదుపులో ఉంచుకోలేకపోవడం అనే సందర్భోచిత అర్థాన్ని ఇస్తుంది; మూలంలోని సందిగ్ధతను పాదసూచనలో ఉంచాం.
- source_word: כִּי קוֹל שׁוֹפָר
  choice: బాకా ధ్వని వినిపించగానే
  rationale: యుద్ధసంకేతానికి ఉపయోగించే కొమ్ముబూర శబ్దాన్ని ‘బాకా ధ్వని’గా, దానికి గుర్రం వెంటనే స్పందించే సందర్భాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
