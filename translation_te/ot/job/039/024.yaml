translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కవితాత్మక ధోరణి పాటించబడింది. గుర్రాన్ని సూచించడానికి తెలుగు వ్యాకరణానుసారం నపుంసక ఏకవచనమైన ‘అది’ వాడబడింది. ‘నేలను మింగివేస్తుంది’ అనే మూల రూపకం ఉద్దేశపూర్వకంగా నిలుపబడింది; וְלֹא יַאֲמִין లోని నిజమైన పదార్థసందిగ్ధత పాదసూచనలో వెల్లడించబడింది.
