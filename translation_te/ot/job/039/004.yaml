  register: ఆధునిక ప్రామాణిక తెలుగులో, జంతువుల సందర్భానికి తగిన ‘వాటి పిల్లలు’ అనే సహజ ప్రయోగాన్ని వాడాం. కవితాత్మక సమాంతరతను సెమీకోలన్లతో నిలిపి, మూలంలోని సంక్షిప్తతను సాధ్యమైనంతవరకు కాపాడాం.
