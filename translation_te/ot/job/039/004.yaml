  text: יַחְלְמ֣וּ בְ֭נֵי/הֶם יִרְבּ֣וּ בַ/בָּ֑ר יָ֝צְא֗וּ וְ/לֹא שָׁ֥בוּ לָֽ/מוֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/039/004.yaml
  text: Their young ones become strong[a]; they grow up in the open field; they go out and do not return to them.
translation:
  language: te
  text: వాటి పిల్లలు బలపడతాయి; అవి బయలు ప్రదేశంలో[a] ఎదుగుతాయి; అవి వెళ్లిపోతాయి, వాటి దగ్గరకు తిరిగి రావు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అడవిలో’ లేదా ‘బహిరంగ ప్రాంతంలో.’
    reason: בַּבָּר అనే పదం సాగుచేయని బహిరంగ లేదా అడవి ప్రాంతాన్ని సూచించగలదు; ఈ సాధ్యమైన పదార్థాలను పాదసూచికలో నిలిపాం.
lexical_decisions:
- source_word: יַחְלְמוּ
  choice: బలపడతాయి
  rationale: ఈ సందర్భంలో חלם శారీరకంగా దృఢంగా, ఆరోగ్యంగా కావడాన్ని సూచిస్తుంది. ‘బలపడతాయి’ సహజమైన ఆధునిక తెలుగు పదప్రయోగం; కేవలం కొవ్వెక్కడం అనే భావాన్ని అనవసరంగా చేర్చదు.
- source_word: בְנֵיהֶם
  choice: వాటి పిల్లలు
  rationale: మూలపదానికి అక్షరార్థంగా ‘వాటి కుమారులు/పిల్లలు’ అనే భావం ఉన్నా, జంతువుల సందర్భంలో లింగాన్ని నిర్దేశించని ‘వాటి పిల్లలు’ సహజంగా ఉంటుంది.
- source_word: יִרְבּוּ
  choice: ఎదుగుతాయి
  rationale: רבה సాధారణంగా ‘విస్తరించు/అధికమగు’ అని అర్థమివ్వగలదు. ఇక్కడ పిల్లలు బలపడి స్వతంత్రంగా వెళ్లిపోవడం అనే సమాంతర సందర్భంలో పరిపక్వతకు చేరే భావంతో ‘ఎదుగుతాయి’ అని అనువదించబడింది.
- source_word: בַבָּר
  choice: బయలు ప్రదేశంలో
  rationale: בָּר ఇక్కడ సాగుచేసిన పొలం కంటే బహిరంగమైన అడవి ప్రాంతాన్ని సూచిస్తుంది. ‘బయలు ప్రదేశం’ ఆ విస్తారమైన, బహిరంగ ప్రదేశ భావాన్ని సహజంగా అందిస్తుంది; ప్రత్యామ్నాయ భావాన్ని పాదసూచికలో ఉంచాం.
- source_word: יָצְאוּ
  choice: అక్కడి నుంచి వెళ్లిపోయి
  rationale: יצא యొక్క బయటికి వెళ్లే భావాన్ని స్పష్టంగా తెలుపుతుంది. తెలుగులో వాక్యప్రవాహం సహజంగా ఉండేందుకు ‘అక్కడి నుంచి’ చేర్చబడింది; ఇది సందర్భంలోని బయలు ప్రదేశాన్ని సూచిస్తుంది.
- source_word: וְלֹא שָׁבוּ לָמוֹ
  choice: వాటి దగ్గరకు తిరిగి రావు
  rationale: שׁוב తో కూడిన לָמוֹ పిల్లలు తల్లి జంతువుల దగ్గరకు తిరిగి రాకపోవడాన్ని సూచిస్తుంది. ‘ఎప్పటికీ’ వంటి మూలంలో లేని బలమైన కాలార్థాన్ని చేర్చలేదు.
