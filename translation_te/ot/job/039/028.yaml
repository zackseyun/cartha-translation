source:
  edition: WLC
  text: סֶ֣לַע יִ֭שְׁכֹּן וְ/יִתְלֹנָ֑ן עַֽל שֶׁן סֶ֝֗לַע וּ/מְצוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/039/028.yaml
  text: He dwells on the cliff and spends the night there[c][b][a], on the tooth of the crag and the stronghold.
translation:
  language: te
  text: అది కొండచరియపై నివసిస్తుంది, అక్కడే రాత్రి బస చేస్తుంది[a]—కొండరాతి పంటి మీద[b], దుర్గం మీద[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అక్కడే రాత్రి గడుపుతుంది.”
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “కొండరాతి పంటి”; ఇది పదునుగా ముందుకు పొడుచుకొచ్చిన రాతి భాగాన్ని సూచించే హీబ్రూ చిత్రణ.
    reason: cultural_note
  - marker: c
    text: లేదా, “కోట.”
    reason: lexical_alternative
lexical_decisions:
- source_word: סֶלַע
  choice: కొండచరియ
  rationale: గద్ద నివసించే నిటారైన రాతి ఎత్తును సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: יִשְׁכֹּן
  choice: నివసిస్తూ
  rationale: స్థిరంగా ఉండడం లేదా నివసించడం అనే క్రియ భావాన్ని గంభీరమైనప్పటికీ సులభమైన తెలుగులో నిలుపుతుంది.
- source_word: וְיִתְלֹנָן
  choice: అక్కడే రాత్రి గడుపుతుంది
  rationale: లూన్/లీన్ ధాతువులోని రాత్రిపూట బసచేయడం అనే కాలసూచక భావాన్ని స్పష్టంగా తెలియజేస్తుంది; ‘అక్కడే’ సందర్భం నుంచి సహజంగా పూరించబడింది.
- source_word: עַל
  choice: పై
  rationale: స్థానాన్ని సూచించే ఉపసర్గకు సహజమైన తెలుగు సమానం.
- source_word: שֶׁן סֶלַע
  choice: కొండరాతి పంటిమొన
  rationale: ‘రాతి పంటి’ అనే హీబ్రూ రూపకాన్ని నిలుపుతూ, పదునుగా ముందుకు పొడుచుకొచ్చిన రాతిమొనను తెలుగులో గ్రాహ్యంగా వ్యక్తపరుస్తుంది.
- source_word: וּמְצוּדָה
  choice: దుర్గం
  rationale: చేరుకోవడం కష్టమైన సురక్షిత ఆశ్రయం అనే భావంతో పాటు ‘కోట/దుర్గం’ అనే కవితాత్మక రూపకాన్ని నిలుపుతుంది.
