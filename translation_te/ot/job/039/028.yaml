translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కవితా శైలి వాడబడింది. మూలంలోని సమాంతర స్థలవర్ణనను దీర్ఘవిరామంతో నిలిపి, ‘కొండరాతి పంటిమొన’ మరియు ‘దుర్గం’ అనే బలమైన చిత్రాలను సంరక్షించాం.
