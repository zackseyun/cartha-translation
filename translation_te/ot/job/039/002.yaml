  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సామాన్య పాఠకులకు స్పష్టంగా ఉండే ప్రశ్నారూపాన్ని వాడాం. మూలంలోని క్రియాశీల నిర్మాణాన్ని ప్రధాన పాఠ్యంలో నిలిపి, మరింత సహజమైన భావవ్యక్తీకరణను పాదసూచికలో ఇచ్చాం.
