  yaml_path: translation/ot/job/039/002.yaml
  text: Do you count the months they fulfill[a], and do you know the time when they give birth?
translation:
  language: te
  text: 'అవి తమ గర్భకాలపు నెలలను[a] పూర్తి చేసే వరకు నువ్వు లెక్కపెడతావా?


    అవి పిల్లలను కనే సమయం నీకు తెలుసా?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “అవి నెలలను పూర్తిచేస్తాయి” అని ఉంది. ఇది వాటి గర్భకాలం నిండడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּסְפֹּר
  choice: నువ్వు లెక్కపెడతావా
  rationale: Qal అపూర్ణ క్రియ, ద్వితీయ పురుష ఏకవచనం. దేవుని అలంకారిక ప్రశ్నల వరుసలో వర్తమానార్థక ప్రశ్నగా సహజంగా ఇచ్చాం; సామర్థ్యాన్ని సూచించే ‘లెక్కపెట్టగలవా’ అని అదనంగా స్పష్టీకరించలేదు.
- source_word: יְרָחִים
  choice: నెలలను
  rationale: సాధారణంగా ‘నెలలు’ అనే అర్థమే; ‘చాంద్రమాసాలు’ అని మరీ నిర్దిష్టం చేయాల్సిన సందర్భం లేదు.
- source_word: תְּמַלֶּאנָה
  choice: అవి పూర్తిచేసే
  rationale: Piel అపూర్ణ క్రియ, స్త్రీలింగ బహువచనం; ముందుగా ప్రస్తావించిన ఆడ జంతువులను సూచిస్తుంది. గర్భకాలపు నెలలు పూర్తి కావడాన్ని తెలిపే క్రియాశీల రూపాన్ని సాధ్యమైనంతవరకు నిలిపాం.
- source_word: וְיָדַעְתָּ
  choice: నీకు తెలుసా
  rationale: Qal పరిపూర్ణ క్రియను ప్రశ్నల వరుసకు తగిన సహజ తెలుగు వర్తమాన ప్రశ్నగా అనువదించాం. సంధికారక భావం తెలుగు సమాంతర వాక్య నిర్మాణంలో సహజంగా వ్యక్తమవుతుంది.
- source_word: עֵת
  choice: సమయం
  rationale: ఈ సందర్భంలో సాధారణమైన ‘సమయం’ సరిపోతుంది; ‘నియమిత సమయం’ అనడం మూలంలో సూచితమైనదానికంటే ఎక్కువ వ్యాఖ్యానాత్మకం కావచ్చు.
- source_word: לִדְתָּנָה
  choice: అవి పిల్లలను కనే
  rationale: ילד ధాతువు infinitive construct, స్త్రీలింగ బహువచన ప్రత్యయంతో ఉంది. తెలుగు సహజ కాలవాచక నిర్మాణంలో, జంతువుల సందర్భానికి సరిపోయేలా ‘పిల్లలను కనే’ అని ఇచ్చాం.
