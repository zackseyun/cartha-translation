translation:
  language: te
  text: అక్కడి నుండి అది ఆహారాన్ని వెదుకుతుంది; దాని కళ్లు దూరం నుండి చూస్తాయి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దాని కళ్లు ఆహారాన్ని చాలా దూరం నుంచే గుర్తిస్తాయి.” హీబ్రూ వాక్యాన్ని భావానువాదంగా ఇస్తే, ఆహారాన్ని దూరం నుంచే గుర్తించే భావం ఉద్ఘాటించబడుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשָּׁם
  choice: అక్కడి నుంచే
  rationale: పక్షి తన ఎత్తైన గూడు లేదా వీక్షణ స్థలం నుంచి ఆహారాన్ని వెదకడాన్ని సూచిస్తుంది; ‘నుంచే’ మూలంలోని స్థానబోధను సహజమైన తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: חָפַר
  choice: వెదుకుతుంది
  rationale: ఈ క్రియ సాధారణంగా ‘తవ్వు’ అని అర్థమిచ్చినా, గద్ద ఆహారాన్ని గుర్తించే ఈ సందర్భంలో ‘వెదుకు’ అనే సందర్భోచిత భావం సహజంగా సరిపోతుంది.
- source_word: אֹכֶל
  choice: ఆహారాన్ని
  rationale: మూలపదం సాధారణంగా ‘ఆహారం’ అని అర్థం; సందర్భంలో అది వేటాడే జీవిని సూచించగలిగినా, విస్తృతమైన మూలార్థాన్ని నిలుపుకోవడానికి ‘ఆహారం’ ఎంచుకోబడింది.
- source_word: לְמֵרָחוֹק
  choice: దూరం నుంచే
  rationale: చాలా దూరం నుంచి చూడడాన్ని సూచించే సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: עֵינָיו יַבִּיטוּ
  choice: దాని కళ్లు … చూస్తాయి
  rationale: మూలంలోని స్పష్టమైన ‘దాని కళ్లు’ అనే కర్తను, దిశగా చూడటం అనే క్రియాభావాన్ని నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన శైలి. గద్దను సూచించడానికి తెలుగులో సహజమైన నపుంసక ఏకవచన సర్వనామం ‘అది’ వాడబడింది; మూలంలోని దృశ్యరూపం మరియు రెండు ఉపవాక్యాల సమాంతర నిర్మాణం నిలుపబడ్డాయి.
