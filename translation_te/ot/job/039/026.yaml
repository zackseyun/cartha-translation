  text: Is it by your understanding that the hawk soars[a], spreading its wings toward the south?
translation:
  language: te
  text: నీ అవగాహన వల్ల డేగ[a] పైకెగురుతూ, దక్షిణం వైపు తన రెక్కలను చాపుతుందా?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ נֵץ డేగ లేదా ఫాల్కన్ వంటి వేటపక్షిని సాధారణంగా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲמִבִּינָתְךָ
  choice: నీ అవగాహన వల్లనే
  rationale: ప్రశ్నార్థక הֲ, సాధనార్థక מִן, בִּינָה (‘అవగాహన/వివేచన’) మరియు ద్వితీయ పురుష ఏకవచన ప్రత్యయం కలిసి, ఈ చర్య యోబు అవగాహన వల్ల జరుగుతుందా అని ప్రశ్నిస్తున్నాయి. ‘అవగాహన’ మూలపదానికి నేరుగా, సహజంగా సరిపోతుంది.
- source_word: יַאֲבֶר
  choice: ఎగిరి పైకెగసి
  rationale: అబర్ ధాతువు హిఫీల్ రూపం పక్షి రెక్కలతో పైకి ఎగరడం లేదా ఎగసిపోవడాన్ని సూచిస్తుంది. ‘ఎగిరి పైకెగసి’ అనే ప్రయోగం గమనాన్నీ ఎత్తుకు చేరడాన్నీ సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: נֵץ
  choice: డేగ
  rationale: נֵץ డేగ లేదా గద్దవంటి వేటపక్షిని సూచించగల సాధారణ పదం. ఖచ్చితమైన జాతి నిర్ధారణ లేనందున తెలుగులో విస్తృతంగా అర్థమయ్యే ‘డేగ’ను ఎంచుకున్నాం; ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: יִפְרֹשׂ
  choice: చాపుతుందా
  rationale: פרשׂ అంటే విప్పడం లేదా చాపడం. రెక్కల సందర్భంలో ‘రెక్కలు చాపడం’ సహజమైన తెలుగు ప్రయోగం; ముందటి క్రియతో సమాంతరంగా ప్రశ్నను కొనసాగిస్తుంది.
- source_word: כנפו
  choice: తన రెక్కలు
  rationale: హీబ్రూలో రూపం ఏకవచనమైనప్పటికీ పక్షి రెక్కను సమాహారార్థంలో సూచించవచ్చు. తెలుగులో ఎగిరే పక్షి గురించి ‘రెక్కలు’ అనే బహువచనం సహజం; ‘తన’ కర్తతో అన్వయాన్ని స్పష్టం చేస్తుంది.
- source_word: לְתֵימָן
  choice: దక్షిణం వైపు
  rationale: లామెద్ దిశను సూచిస్తుంది; תֵימָן ఇక్కడ ‘దక్షిణం’. ‘దక్షిణం వైపు’ దిశాభావాన్ని స్పష్టంగా, సహజంగా అందిస్తుంది.
