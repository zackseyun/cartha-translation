  text: יִשְׂחַ֣ק לְ֭/פַחַד וְ/לֹ֣א יֵחָ֑ת וְ/לֹֽא יָ֝שׁ֗וּב מִ/פְּנֵי חָֽרֶב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/039/022.yaml
  text: He laughs at fear and is not dismayed[b][a], and he does not turn back from the sword.
translation:
  language: te
  text: అది భయాన్ని చూసి నవ్వుతుంది[a], బెదరదు; ఖడ్గం ఎదుట వెనుదిరగదు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అది భయాన్ని ఎగతాళి చేస్తుంది.” హీబ్రూ క్రియ నవ్వడమే కాక ఎగతాళి చేసే భావాన్ని కూడా సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ఖడ్గం ఎదుట వెనక్కి తగ్గదు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׂחַק
  choice: నవ్వుతుంది
  rationale: שׂחק అనే క్రియ యొక్క ప్రత్యక్షమైన, సజీవమైన రూపకాన్ని నిలుపుతూ, యుద్ధంలో గుర్రం భయాన్ని లెక్కచేయని తీరును తెలియజేస్తుంది.
- source_word: לְפַחַד
  choice: భయాన్ని చూసి
  rationale: פחד అంటే భయం లేదా భీతి. לְ నిర్మాణాన్ని తెలుగులో సహజంగా వ్యక్తం చేయడానికి ‘భయాన్ని చూసి’ అని అనువదించాం; ఇది మూలంలోని సంక్షిప్త భావాన్ని కాపాడుతుంది.
- source_word: יֵחָת
  choice: బెదరదు
  rationale: חתת యొక్క నిఫాల్ రూపం ఇక్కడ దిగులుపడటం, భయపడి కుంగిపోవటం అనే మానసిక భావాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘బెదరదు’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: יָשׁוּב
  choice: వెనుదిరగదు
  rationale: שׁוב యొక్క ప్రాథమిక భావం తిరగటం లేదా వెనక్కి తిరగటం. యుద్ధ సందర్భంలో ‘వెనుదిరగదు’ మూలపదాన్ని, సందర్భాన్ని రెండింటినీ నిలుపుతుంది.
- source_word: מִפְּנֵי
  choice: ఎదుట
  rationale: מִפְּנֵי ఇక్కడ ప్రమాదకరమైన ఆయుధం సమక్షంలో లేదా దాని కారణంగా వెనక్కి తగ్గడాన్ని సూచిస్తుంది. ‘ఖడ్గం ఎదుట’ అనే నిర్మాణం తెలుగులో సహజంగా ఉంది.
- source_word: חָרֶב
  choice: ఖడ్గం
  rationale: חָרֶב ఏకవచనంలో ఖడ్గాన్ని సూచిస్తూ యుద్ధాయుధానికి ప్రతినిధి చిత్రంగా పనిచేస్తుంది. ‘ఖడ్గం’ గంభీరమైన కవితా సందర్భానికి తగిన సాధారణ బైబిలు పదం.
