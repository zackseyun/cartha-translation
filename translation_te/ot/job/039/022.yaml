  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా ఉండే శైలిని ఉపయోగించాం. యుద్ధగుర్రాన్ని సూచించడానికి తెలుగులో సహజమైన నపుంసక ఏకవచన సర్వనామం ‘అది’ వాడాం; మూలంలోని సజీవమైన కవితా రూపకాన్ని నిలిపాం.
