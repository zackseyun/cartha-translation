id: JDG.11.10
reference: Judges 11:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּאמְר֥וּ זִקְנֵֽי גִלְעָ֖ד אֶל יִפְתָּ֑ח יְהוָ֗ה יִהְיֶ֤ה שֹׁמֵ֨עַ֙ בֵּֽינוֹתֵ֔י/נוּ אִם לֹ֥א כִ/דְבָרְ/ךָ֖ כֵּ֥ן נַעֲשֶֽׂה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/010.yaml
  text: Then the elders of Gilead said to Jephthah[a], “Yahweh will be witness between us if we do not do according to your word.”
translation:
  language: te
  text: అప్పుడు గిలాదు పెద్దలు యెఫ్తాతో, “మేము నీ మాట ప్రకారం చేయకపోతే, యాహ్వే మన మధ్య సాక్షిగా ఉంటాడు[a]” అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “యాహ్వే మన మధ్య వినేవాడిగా ఉంటాడు”—అంటే, రెండు పక్షాల మధ్య విని సాక్షిగా లేదా న్యాయనిర్ణేతగా వ్యవహరిస్తాడు.
    reason: lexical_alternative
lexical_decisions:
- source_word: זִקְנֵי גִלְעָד
  choice: గిలాదు పెద్దలు
  rationale: ఈ నిర్మాణ పదబంధం గిలాదుకు చెందిన గుర్తింపు పొందిన నాయకులను సూచిస్తుంది; ‘గిలాదు పెద్దలు’ సహజమైన, సంక్షిప్తమైన తెలుగు రూపం.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, దాని వ్యక్తిగత నామరూపాన్ని తెలుగులో లిప్యంతరీకరించింది.
- source_word: יִהְיֶה שֹׁמֵעַ בֵּינוֹתֵינוּ
  choice: మన మధ్య సాక్షిగా ఉంటాడు
  rationale: అక్షరార్థంగా ‘మన మధ్య వినేవాడిగా ఉంటాడు.’ అయితే ప్రమాణం, వివాద పరిష్కార సందర్భంలో ‘మధ్య వినడం’ అంటే రెండు పక్షాల మధ్య సాక్షిగా లేదా న్యాయనిర్ణేతగా ఉండడం. ప్రధాన పాఠంలో సందర్భార్థాన్ని సహజంగా తెలిపి, అక్షరార్థాన్ని పాదటిప్పణిలో ఉంచింది.
- source_word: אִם לֹא
  choice: చేయకపోతే
  rationale: ఇక్కడ ప్రమాణానికి సంబంధించిన ప్రతికూల షరతును సూచిస్తుంది; అందువల్ల ‘చేయకపోతే’ సరైన తెలుగు రూపం.
- source_word: כִדְבָרְךָ
  choice: నీ మాట ప్రకారం
  rationale: మూలంలోని ‘నీ మాట ప్రకారం’ అనే రూపాన్ని నిలుపుతూ, యెఫ్తా చెప్పిన షరతులు లేదా ఆదేశాన్ని సూచిస్తుంది.
- source_word: כֵּן נַעֲשֶׂה
  choice: చేయడం
  rationale: ముందున్న ‘నీ మాట ప్రకారం’తో కలిపి ‘నీ మాట ప్రకారం చేయడం’ అనే అర్థాన్ని ఇస్తుంది; తెలుగు షరతు వాక్యంలో భవిష్యత్ ఉద్దేశం సహజంగా వ్యక్తమవుతుంది.
- source_word: וַיֹּאמְרוּ
  choice: అప్పుడు … అన్నారు
  rationale: కథనాన్ని ముందుకు నడిపించే వావ్‌ను తెలుగులో సహజమైన క్రమసూచకమైన ‘అప్పుడు’తో వ్యక్తం చేసింది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది. కాబట్టి దానిని బిరుదుగా మార్చకుండా ‘యాహ్వే’ అని లిప్యంతరీకరించడం మూలంలోని నామాన్ని కాపాడుతుంది.
- issue: שֹׁמֵעַ בֵּינוֹתֵינוּ లో యాహ్వే పాత్ర
  choice: మన మధ్య సాక్షిగా ఉంటాడు
  alternative: మన మధ్య వినేవాడిగా ఉంటాడు; మన మధ్య న్యాయనిర్ణేతగా ఉంటాడు
  rationale: ఈ ప్రమాణ సందర్భంలో ‘వినడం’ న్యాయపరమైన సాక్షి లేదా నిర్ణేత పాత్రను సూచించవచ్చు. ‘సాక్షి’ సందర్భార్థాన్ని స్పష్టంగా తెలుపుతుంది; అయితే ‘న్యాయనిర్ణేత’ అనే మరింత నిర్దిష్ట భావాన్ని ప్రధాన పాఠంలో బలవంతంగా విధించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని ఉపయోగించింది. ప్రమాణ వాక్యంలోని గంభీరతను నిలుపుతూ, మూలంలోని న్యాయపరమైన రూపకానికి సంబంధించిన అస్పష్టతను పాదటిప్పణిలో భద్రపరిచింది.
