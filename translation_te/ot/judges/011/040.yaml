  variant: modern standard Telugu
source:
  edition: WLC
  text: מִ/יָּמִ֣ים יָמִ֗ימָ/ה תֵּלַ֨כְנָה֙ בְּנ֣וֹת יִשְׂרָאֵ֔ל לְ/תַנּ֕וֹת לְ/בַת יִפְתָּ֖ח הַ/גִּלְעָדִ֑י אַרְבַּ֥עַת יָמִ֖ים בַּ/שָּׁנָֽה׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/040.yaml
  text: From year to year the daughters of Israel would go to commemorate the daughter of Jephthah the Gileadite four days in the year[a].
translation:
  language: te
  text: ఏటేటా ఇశ్రాయేలు కుమార్తెలు గిలాదీయుడైన యెఫ్తా కుమార్తెను స్మరించడానికి[a] వెళ్లేవారు; సంవత్సరానికి నాలుగు రోజులు ఇలా చేసేవారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “విలపించడానికి”; లేదా, “యెఫ్తా కుమార్తెను గూర్చి చెప్పుకోవడానికి.” ఇక్కడి హీబ్రూ క్రియ అరుదైనది; దాని అర్థం వివాదాస్పదం.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִיָּמִים יָמִימָה
  choice: ఏటేటా
  rationale: ఈ హీబ్రూ నానుడి ఏటా క్రమంగా పునరావృతమయ్యే ఆచారాన్ని సూచిస్తుంది; ‘ఏటేటా’ ఆధునిక తెలుగులో సహజంగా, స్పష్టంగా ఉంది.
- source_word: תֵּלַכְנָה
  choice: వెళ్లేవారు
  rationale: ఈ సందర్భంలో అసంపూర్ణ క్రియ గతంలో అలవాటుగా పునరావృతమైన చర్యను తెలియజేస్తుంది.
- source_word: בְּנוֹת יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమార్తెలు
  rationale: వయస్సు లేదా వివాహస్థితిని ఊహించకుండా హీబ్రూ వ్యక్తీకరణను దగ్గరగా నిలుపుతుంది.
- source_word: לְתַנּוֹת
  choice: స్మరించడానికి
  rationale: అరుదైన ఈ క్రియకు ఇక్కడ స్మరించడం లేదా ఆమెను గూర్చి చెప్పుకోవడం అనే అర్థం సాధ్యమైనది; పదంలోని అనిశ్చితిని పాదటిప్పణిలో నిలిపాం.
- source_word: לְבַת יִפְתָּח הַגִּלְעָדִי
  choice: గిలాదీయుడైన యెఫ్తా కుమార్తెను
  rationale: సంబంధాన్ని, గిలాదు ప్రాంతీయ గుర్తింపును సహజమైన తెలుగు పదక్రమంలో వ్యక్తపరుస్తుంది.
- source_word: אַרְבַּעַת יָמִים בַּשָּׁנָה
  choice: సంవత్సరానికి నాలుగు రోజులు
  rationale: ఆ ఆచారం జరిగే వార్షిక వ్యవధిని స్పష్టమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: యెఫ్తా కుమార్తెకు సంబంధించిన వార్షిక ఆచారం స్వభావం
  choice: ప్రధాన పాఠంలో ‘స్మరించడానికి’
  alternative: ‘విలపించడానికి’ లేదా ‘ఆమెను గూర్చి చెప్పుకోవడానికి’
  rationale: לְתַנּוֹת అనే అరుదైన క్రియ వివాదాస్పదం. యెఫ్తా ప్రతిజ్ఞ మరియు అతని కుమార్తెకు జరిగినదాని విషయంలో ఒక నిర్దిష్ట వ్యాఖ్యానాన్ని అనువాదం ద్వారా ఖరారు చేయకుండా, ప్రధాన పాఠంలో విస్తృతమైన ‘స్మరించడానికి’ను ఉపయోగించి ఇతర సాధ్యార్థాలను పాదటిప్పణిలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన శైలి. హీబ్రూ నానుడిని ‘ఏటేటా’గా సహజీకరించాం; కాలవ్యవధి స్పష్టత కోసం చివరి భాగాన్ని స్వతంత్ర ఉపవాక్యంగా ఇచ్చాం.
