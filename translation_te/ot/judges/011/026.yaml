source:
  edition: WLC
  text: בְּ/שֶׁ֣בֶת יִ֠שְׂרָאֵל בְּ/חֶשְׁבּ֨וֹן וּ/בִ/בְנוֹתֶ֜י/הָ וּ/בְ/עַרְע֣וֹר וּ/בִ/בְנוֹתֶ֗י/הָ וּ/בְ/כָל הֶֽ/עָרִים֙ אֲשֶׁר֙ עַל יְדֵ֣י אַרְנ֔וֹן שְׁלֹ֥שׁ מֵא֖וֹת שָׁנָ֑ה וּ/מַדּ֥וּעַ לֹֽא הִצַּלְתֶּ֖ם בָּ/עֵ֥ת הַ/הִֽיא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/026.yaml
  text: While Israel has lived in Heshbon and its daughter towns[a], and in Aroer and its daughter towns, and in all the cities that are along the Arnon, for three hundred years[b], why did you not recover them during that time?
translation:
  language: te
  text: ఇశ్రాయేలు హెష్బోనులో, దాని అనుబంధ పట్టణాల్లో[a], అరోయేరులో, దాని అనుబంధ పట్టణాల్లో, అర్నోను వెంబడి ఉన్న పట్టణాలన్నిటిలో మూడు వందల సంవత్సరాలుగా నివసించినప్పుడు, ఆ కాలంలో మీరు వాటిని ఎందుకు తిరిగి స్వాధీనం చేసుకోలేదు?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా ‘దాని కుమార్తెలు’; అంటే ప్రధాన పట్టణంపై ఆధారపడిన చిన్న పట్టణాలు లేదా నివాసాలు.
    reason: cultural_note
  - marker: b
    text: ‘వాటిని విడిపించలేదు’ లేదా ‘రక్షించలేదు’ అని కూడా అనువదించవచ్చు; ఈ సందర్భంలో భూభాగాన్ని తిరిగి స్వాధీనం చేసుకోవడం భావం.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשֶׁבֶת יִשְׂרָאֵל
  choice: ఇశ్రాయేలు ... నివసిస్తుండగా
  rationale: בְּ + infinitive construct కాలసంబంధమైన, కొనసాగుతున్న పరిస్థితిని సూచిస్తుంది; తెలుగు వాక్యంలో ‘నివసిస్తుండగా’ ఆ భావాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: בְּנוֹתֶיהָ
  choice: దాని అనుబంధ పట్టణాలు
  rationale: అక్షరార్థంగా ‘దాని కుమార్తెలు’; ప్రధాన పట్టణంపై ఆధారపడిన చిన్న నివాసాలను సూచించే హీబ్రూ నుడికారం. ‘అనుబంధ పట్టణాలు’ భావాన్ని స్పష్టంగా, సహజంగా అందిస్తుంది.
- source_word: עַרְעוֹר
  choice: అరోయేరు
  rationale: హీబ్రూ స్థలనామానికి తెలుగు లిప్యంతరీకరణ.
- source_word: עַל יְדֵי אַרְנוֹן
  choice: అర్నోను పొడవునా
  rationale: ఈ పదబంధం ‘పక్కన, వెంట’ అనే అర్థాన్నిస్తుంది; అనేక పట్టణాల స్థానాన్ని సూచించే సందర్భంలో ‘పొడవునా’ సహజమైన తెలుగు.
- source_word: שְׁלֹשׁ מֵאוֹת שָׁנָה
  choice: మూడు వందల సంవత్సరాలుగా
  rationale: నివాసం కొనసాగిన కాలవ్యవధిని తెలుగులో సహజంగా సూచిస్తుంది.
- source_word: הִצַּלְתֶּם
  choice: తిరిగి స్వాధీనం చేసుకోలేదు
  rationale: హిఫిల్ రూపానికి సాధారణంగా ‘విడిపించు, రక్షించు’ అనే అర్థం ఉన్నా, ఇక్కడ భూభాగ వివాద సందర్భంలో పట్టణాలను తిరిగి తమ అధీనంలోకి తెచ్చుకోవడం ఉద్దేశం; సందర్భార్థాన్ని ప్రధాన పాఠ్యంలో అందిస్తూ ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలిపాం.
- source_word: בָּעֵת הַהִיא
  choice: ఆ కాలంలో
  rationale: ముందు చెప్పిన మూడు వందల సంవత్సరాల కాలవ్యవధిని సహజంగా వెనక్కి సూచిస్తుంది.
theological_decisions:
- issue: הִצַּלְתֶּם అనే క్రియ యొక్క సందర్భార్థం
  choice: తిరిగి స్వాధీనం చేసుకోలేదు
  alternative: వాటిని విడిపించలేదు / రక్షించలేదు
  rationale: వాదన భూభాగపు హక్కు గురించి సాగుతున్నందున ‘తిరిగి స్వాధీనం చేసుకోవడం’ సందర్భానికి సరిపోతుంది; అయితే మూల క్రియలోని రక్షణ/విడుదల భావాన్ని పాదసూచిక ద్వారా సంరక్షించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు స్పష్టమైన శైలి. ‘కుమార్తె పట్టణాలు’ అనే అపరిచిత అక్షరానువాదం బదులు ప్రధాన పాఠ్యంలో ‘అనుబంధ పట్టణాలు’ వాడి, మూల రూపకాన్ని పాదసూచికలో ఇచ్చాం.
