id: JDG.11.22
reference: Judges 11:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּ֣ירְשׁ֔וּ אֵ֖ת כָּל גְּב֣וּל הָ/אֱמֹרִ֑י מֵֽ/אַרְנוֹן֙ וְ/עַד הַ/יַּבֹּ֔ק וּ/מִן הַ/מִּדְבָּ֖ר וְ/עַד הַ/יַּרְדֵּֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/022.yaml
  text: So they took possession of all the territory of the Amorites[a], from the Arnon as far as the Jabbok[c][b], and from the wilderness as far as the Jordan.
translation:
  language: te
  text: కాబట్టి వారు అమోరీయుల ప్రాంతమంతటినీ స్వాధీనం చేసుకున్నారు[a]—అర్నోను నుండి యబ్బోకు వరకు, అరణ్యం నుండి యొర్దాను వరకు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఆక్రమించుకున్నారు’ లేదా ‘వారసత్వంగా పొందారు’; హీబ్రూ క్రియకు ఈ భావాలు ఉండవచ్చు, అయితే ఇక్కడ భూభాగంపై అధికారం సంపాదించడమే ఉద్దేశం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּירְשׁוּ
  choice: స్వాధీనం చేసుకున్నారు
  rationale: యుద్ధం ద్వారా ఒక ప్రాంతంపై అధికారం సంపాదించడాన్ని ఈ సందర్భంలో ירשׁ సూచిస్తుంది; తెలుగు వాడుకలో ‘స్వాధీనం చేసుకున్నారు’ ఆ క్రియాశీల భూసంబంధ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: כָּל גְּבוּל
  choice: ప్రాంతమంతటినీ
  rationale: כָּל యొక్క సంపూర్ణతను, గְּבוּל ఇక్కడ సరిహద్దుల మధ్యనున్న భూభాగాన్ని సూచించే భావాన్ని కలిపి సహజమైన తెలుగులో అందిస్తుంది.
- source_word: הָאֱמֹרִי
  choice: అమోరీయుల
  rationale: హీబ్రూలో ఏకవచన సమూహవాచకంగా ఉన్నప్పటికీ, అమోరీ ప్రజలను సమష్టిగా సూచిస్తున్నందున తెలుగులో బహువచన రూపం సహజం.
- source_word: מֵאַרְנוֹן וְעַד הַיַּבֹּק
  choice: అర్నోను నుండి యబ్బోకు వరకు
  rationale: మొదటి రెండు భౌగోళిక హద్దులను సంక్షిప్తంగా, స్పష్టంగా చూపిస్తుంది.
- source_word: וּמִן הַמִּדְבָּר וְעַד הַיַּרְדֵּן
  choice: అరణ్యం నుండి యొర్దాను వరకు
  rationale: మִדְבָּר తప్పనిసరిగా ఇసుక ఎడారినే సూచించదు కాబట్టి ‘అరణ్యం’ అనువైన భౌగోళిక పదం; ఈ పదబంధం రెండవ హద్దుల జంటను నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం ఉపయోగించబడింది. రెండు సమాంతర భౌగోళిక హద్దుల జంటలు అలాగే నిలుపబడ్డాయి; ‘ప్రాంతమంతటినీ’ అనే రూపం כָּל మరియు గְּבוּל భావాలను సమగ్రంగా అందిస్తుంది.
