base_translation:
  language: en
  yaml_path: translation/ot/judges/011/024.yaml
  text: Will you not possess what Chemosh your god causes you to possess? And all that Yahweh our God has dispossessed before us[b][a], that we will possess.
translation:
  language: te
  text: నీ దేవుడైన కెమోషు నీకు స్వాధీనం కలిగించేదానిని నీవు స్వాధీనం చేసుకుంటావు కదా?[a] అలాగే, యెహోవా మా దేవుడు మా ఎదుట నుండి తొలగించినదంతా మేము స్వాధీనం చేసుకుంటాం.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘స్వాధీనం కలిగించడం’ అని అనువదించిన హెబ్రీ క్రియకు, ఇతరులను వారి స్వాధీనం నుంచి తొలగించి మరొకరికి స్వాధీనం కలిగించడం అనే భావం కూడా ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘స్వాధీనం చేసుకోవడం’ అని అనువదించిన హెబ్రీ క్రియకు ‘వారసత్వంగా పొందడం’ లేదా ‘ఆక్రమించుకోవడం’ అనే భావాలు కూడా ఉన్నాయి; ఇక్కడ అది భూభాగాన్ని తన అధీనంలోకి తీసుకోవడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: నీవు ... చేసుకుంటావు కదా?
  rationale: ఇది ఎదుటివారి సమ్మతిని ఆశించే అలంకారప్రశ్న. ఆధునిక తెలుగులో ‘కదా?’ ఆ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: יוֹרִישְׁךָ
  choice: నీకు స్వాధీనపరచేదాన్ని
  rationale: ירשׁ అనే క్రియ యొక్క హిఫీల్ రూపం, ఇతరులను తొలగించడం ద్వారా ఒకరికి స్వాధీనం కలిగించే భావాన్ని సూచించగలదు. ఈ ఎంపిక ఫలితమైన స్వాధీనాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: כְּמוֹשׁ אֱלֹהֶיךָ
  choice: నీ దేవుడైన కెమోషు
  rationale: దైవనామాన్ని లిప్యంతరీకరించి, ‘నీ దేవుడు’ అనే సమానాధికార సంబంధాన్ని సహజమైన తెలుగులో వ్యక్తం చేసింది.
- source_word: תִירָשׁ / נִירָשׁ
  choice: స్వాధీనం చేసుకుంటావు / స్వాధీనం చేసుకుంటాం
  rationale: ఇక్కడ ירשׁ భూభాగాన్ని లేదా అధికారాన్ని పొందడం, దానిని తన అధీనంలో ఉంచుకోవడం అనే భావంలో ఉంది. రెండు అర్ధభాగాల్లోని మూలపద పునరుక్తిని తెలుగులోనూ నిలిపింది.
- source_word: הוֹרִישׁ
  choice: తొలగించినదంతా
  rationale: హిఫీల్ రూపంలోని వెళ్లగొట్టడం లేదా స్వాధీనాన్ని కోల్పోయేలా చేయడం అనే భావాన్ని సంక్షిప్తంగా వ్యక్తం చేస్తుంది; కర్మ ప్రజలా, వారి ఆధీనంలోని భూభాగమా అనే మూలంలోని కొంత అనిశ్చితిని పూర్తిగా పరిష్కరించదు.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే వ్యక్తినామ రూపంతో అందించింది.
- source_word: מִפָּנֵינוּ
  choice: మా ఎదుట నుంచి
  rationale: ‘మా సమక్షం/మార్గం నుంచి’ అనే స్థలసంబంధమైన హెబ్రీ నుడికారాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: యెఫ్తా మాటల్లో కెమోషును ‘నీ దేవుడు’ అని పేర్కొనడం
  choice: ఏ వివరణాత్మక దూరీకరణను చేర్చకుండా నేరుగా అనువదించడం
  alternative: ‘నీవు దేవుడని భావించే కెమోషు’ అని విపులీకరించడం లేదా వ్యంగ్యసూచక గుర్తులు పెట్టడం
  rationale: ఇది ఎదుటివారి మతదావాను ఆధారంగా చేసుకున్న దౌత్యపూర్వక అలంకార వాదన. కెమోషు నిజమైన దైవమని కథకుడు సమర్థిస్తున్నాడని గాని, ఈ మాటలు తప్పక వ్యంగ్యమని గాని మూలపాఠం స్పష్టంగా చెప్పదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సహజంగా ఉండేలా, అయితే దౌత్యపూర్వక వాదనలోని గంభీరతను నిలుపుతూ అనువదించబడింది. ‘స్వాధీనం’ అనే పదపునరుక్తి మూలంలోని ירשׁ పదశ్రేణిని ప్రతిబింబిస్తుంది.
