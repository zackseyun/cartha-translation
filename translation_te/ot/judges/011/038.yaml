source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר לֵ֔כִי וַ/יִּשְׁלַ֥ח אוֹתָ֖/הּ שְׁנֵ֣י חֳדָשִׁ֑ים וַ/תֵּ֤לֶךְ הִיא֙ וְ/רֵ֣עוֹתֶ֔י/הָ וַ/תֵּ֥בְךְּ עַל בְּתוּלֶ֖י/הָ עַל הֶ/הָרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/038.yaml
  text: And he said[a], “Go.” So he sent her away for two months, and she went, she and her companions, and wept over her virginity on the mountains.
translation:
  language: te
  text: అతడు, “వెళ్లు” అన్నాడు. అప్పుడు అతడు ఆమెను రెండు నెలలపాటు పంపించాడు. ఆమె తన సఖులతో కలిసి వెళ్లి, పర్వతాల మీద తన కన్యత్వం గురించి[a] ఏడ్చింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తన కన్యత్వం కోసం” / “తన కన్యత్వం కారణంగా.” ఆమె విలపించిన విషయం తన కన్యత్వమేనని హీబ్రూ పాఠం స్పష్టంగా చెబుతుంది; విస్తృత కథనాన్ని అర్థం చేసుకోవడంలో ఈ వివరానికి ప్రాముఖ్యత ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵכִי
  choice: వెళ్లు
  rationale: הלך ధాతువు నుంచి వచ్చిన స్త్రీలింగ ఏకవచన ఆజ్ఞారూపం. సందర్భానికి తగిన సంక్షిప్తమైన, సహజమైన ఆజ్ఞ ఇది.
- source_word: וַיִּשְׁלַח אוֹתָהּ
  choice: అతడు ఆమెను ... వెళ్లనిచ్చాడు
  rationale: ఇక్కడ שׁלח ఆమె కోరిన కాలానికి వెళ్లేందుకు అనుమతించి పంపడాన్ని సూచిస్తుంది. ‘పంపివేశాడు’ అనడం తిరస్కరణ భావాన్ని కలిగించవచ్చు; ‘వెళ్లనిచ్చాడు’ సందర్భంలోని అనుమతి భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: שְׁנֵי חֳדָשִׁים
  choice: రెండు నెలలపాటు
  rationale: ఇది ఆమెకు ఇచ్చిన సమయ వ్యవధిని సూచిస్తుంది; తెలుగులో ‘రెండు నెలలపాటు’ స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: וַתֵּלֶךְ הִיא וְרֵעוֹתֶיהָ
  choice: ఆమె తన సఖులతో కలిసి వెళ్లి
  rationale: హీబ్రూ వాక్యంలో ఆమెతోపాటు ఆమె సహచరులు వెళ్లారని స్పష్టంగా ఉంది. తెలుగు కథనశైలిలో ‘తన సఖులతో కలిసి’ సహజంగా ఆ సమూహ చర్యను వ్యక్తపరుస్తుంది.
- source_word: רֵעוֹתֶיהָ
  choice: తన సఖులు
  rationale: רֵעוֹתֶיהָ స్త్రీ సహచరులను లేదా స్నేహితురాళ్లను సూచిస్తుంది. ‘సఖులు’ కథన గౌరవాన్ని నిలుపుతూ సంబంధాన్ని అతిగా నిర్దిష్టం చేయదు.
- source_word: וַתֵּבְךְּ
  choice: ఏడ్చింది
  rationale: בכה ఏడవడం లేదా రోదించడాన్ని సూచిస్తుంది. ‘ఏడ్చింది’ ఆధునిక సాధారణ తెలుగులో సహజంగా ఉండి, సందర్భంలోని విషాదాన్ని నిలుపుతుంది.
- source_word: עַל בְּתוּלֶיהָ
  choice: తన కన్యత్వం గురించి
  rationale: ఈ పదబంధం ఆమె విలాపానికి అంశం తన కన్యత్వమేనని స్పష్టంగా చెబుతుంది. ‘గురించి’ అనే రూపం కారణం లేదా విస్తృత కథనార్థాన్ని ముందుగానే నిర్ణయించకుండా హీబ్రూ పదబంధంలోని భావాన్ని నిలుపుతుంది.
- source_word: עַל הֶהָרִים
  choice: పర్వతాల మీద
  rationale: הָרִים అంటే పర్వతాలు లేదా కొండలు; עַל‌కు దగ్గరగా ‘మీద’ అని అనువదించడం దృశ్యస్థలాన్ని స్పష్టంగా ఉంచుతుంది.
theological_decisions:
- issue: యెఫ్తా కుమార్తె తన కన్యత్వం గురించి విలపించడం యొక్క అర్థం
  choice: ప్రధాన పాఠం ఆమె విలాపానికి అంశం తన కన్యత్వమేనని చెబుతుంది; విస్తృత కథనంలోని వివాదాన్ని పరిష్కరించదు.
  alternative: ఆమె మానవ బలిగా మరణించబోతున్నందుకు విలపించింది; లేదా జీవితాంతం కన్యగా, సంతానం లేకుండా ఉండబోతున్నందుకు విలపించింది.
  rationale: ఈ వచనం స్పష్టంగా ఆమె తన కన్యత్వం గురించి ఏడ్చిందని మాత్రమే పేర్కొంటుంది. అంతకుమించి అనువదిస్తే, విస్తృత కథనానికి సంబంధించిన ఒక వ్యాఖ్యానాన్ని ఈ వచనంలోకి చేర్చినట్లవుతుంది. అందువల్ల అసలు పాఠంలోని ధార్మిక, వ్యాఖ్యాన సంబంధ ఉద్రిక్తతను అలాగే ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. ‘వెళ్లనిచ్చాడు’ అనుమతి భావాన్ని, ‘కన్యత్వం గురించి’ అసలు పాఠంలోని ఉద్దేశపూర్వక అనిశ్చితిని నిలుపుతాయి. పాదసూచిక గుర్తు అది వివరిస్తున్న ‘కన్యత్వం గురించి’ అన్న పదబంధం వెంట ఉంచబడింది.
