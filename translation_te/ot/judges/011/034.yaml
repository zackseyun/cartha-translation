id: JDG.11.34
reference: Judges 11:34
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּבֹ֨א יִפְתָּ֣ח הַ/מִּצְפָּה֮ אֶל בֵּית/וֹ֒ וְ/הִנֵּ֤ה בִתּ/וֹ֙ יֹצֵ֣את לִ/קְרָאת֔/וֹ בְ/תֻפִּ֖ים וּ/בִ/מְחֹל֑וֹת וְ/רַק֙ הִ֣יא יְחִידָ֔ה אֵֽין ל֥/וֹ מִמֶּ֛/נּוּ בֵּ֖ן אוֹ בַֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/034.yaml
  text: Then Jephthah came to Mizpah[a], to his house, and behold, his daughter was coming out to meet him with tambourines and with dances. Now she was his only child[b]; besides her he had neither son nor daughter.
translation:
  language: te
  text: యెఫ్తా మిస్పాలోని తన ఇంటికి వచ్చాడు. ఇదిగో, అతని కుమార్తె చేతి డప్పులు వాయిస్తూ, నృత్యాలు చేస్తూ అతన్ని కలవడానికి బయటికి వస్తూ ఉంది. ఆమె అతనికి ఒక్కగానొక్క సంతానం[a]; ఆమె తప్ప అతనికి కుమారుడుగానీ కుమార్తెగానీ లేరు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ: ‘అతని ఏకైకమైనది’; సందర్భంలో, అతని ఒక్కగానొక్క సంతానం.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: వచ్చినప్పుడు
  rationale: హీబ్రూ కథన క్రమాన్ని సహజమైన తెలుగు ఉపవాక్యంతో వ్యక్తం చేస్తుంది; యెఫ్తా చేరుకున్న వేళ కుమార్తె ఎదురుగా రావడం అనే సమకాలీన దృశ్యాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: הַמִּצְפָּה
  choice: మిస్పాకు
  rationale: నిర్దిష్ట స్థలనామాన్ని ఆధునిక తెలుగు లిప్యంతరీకరణతో ఇస్తుంది; హీబ్రూలోని దిశార్థక రూపాన్ని ‘-కు’ తెలియజేస్తుంది.
- source_word: אֶל בֵּיתוֹ
  choice: తన ఇంటికి
  rationale: בַּיִת అనే స్పష్టమైన నామవాచకాన్ని ‘ఇల్లు’గా నిలుపుతూ, కర్తను సూచించే ప్రతిబింబ స్వామ్యరూపం తెలుగులో సహజంగా ఉంటుంది.
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: అనూహ్యమైన, విషాదభరితమైన దృశ్యానికి పాఠకుని దృష్టిని ఆకస్మికంగా మళ్లించే హీబ్రూ సూచక పద బలాన్ని నిలుపుతుంది.
- source_word: יֹצֵאת לִקְרָאתוֹ
  choice: అతనిని ఎదుర్కోవడానికి బయటికి వస్తోంది
  rationale: వర్తమాన కృదంతంలోని కొనసాగుతున్న, కళ్లముందు జరిగే భావాన్ని ‘వస్తోంది’తో వ్యక్తం చేస్తుంది; לִקְרָאתוֹ యొక్క స్వాగతార్థక ఎదురురావడాన్ని సహజంగా అందిస్తుంది.
- source_word: בְתֻפִּים
  choice: తంబురాలు మోగిస్తూ
  rationale: תֹּף అనేది పండుగ సందర్భంలో వాయించే చేతి చట్రపు వాద్యం. తెలుగులో పరిచితమైన ‘తంబురాలు’ను ఉపయోగించి, వాద్యాలతో రావడం అనే భావాన్ని సహజ క్రియారూపంలో చెబుతుంది.
- source_word: וּבִמְחֹלוֹת
  choice: నాట్యాలతో
  rationale: బహువచన నామవాచకాన్ని నేరుగా నిలుపుతూ విజయోత్సవ వాతావరణాన్ని వ్యక్తం చేస్తుంది.
- source_word: וְרַק הִיא יְחִידָה
  choice: ఆమె అతనికి ఒక్కగానొక్క సంతానం
  rationale: యְחִידָה అక్షరార్థంగా ‘ఒక్కతే/ఏకైకమైనది’; తరువాతి కుమారుడు లేదా కుమార్తె లేరనే వాక్యం దానిని ఏకైక సంతానంగా స్పష్టం చేస్తుంది.
- source_word: אֵין לוֹ מִמֶּנּוּ בֵּן אוֹ בַת
  choice: ఆమె తప్ప అతనికి కుమారుడుగాని కుమార్తెగాని లేరు
  rationale: ఆమెను మినహాయించి మరే సంతానమూ లేదనే వివరణాత్మక బలాన్ని సహజమైన తెలుగు నిరాకరణ నిర్మాణంతో నిలుపుతుంది.
theological_decisions:
- issue: యెఫ్తా కుమార్తె స్థితి మరియు తరువాతి పరిణామం
  choice: ఈ వచనం చెప్పినంతవరకే—ఆమె అతని ఏకైక సంతానమని, విజయోత్సవంగా ఎదురువచ్చిందని—వర్ణించడం
  alternative: ఈ ఏకైక సంతానం ప్రస్తావనను తరువాతి అక్షరార్థ బలి లేదా జీవితాంత కన్యత్వం/సంతానరాహిత్యం అనే వ్యాఖ్యానాలలో ఏదో ఒకదానికి అనుగుణంగా ముందుగానే వివరించడం
  rationale: ఈ వచనం ఆమె తరువాతి గతి గురించి తేల్చదు. అందువల్ల విస్తృత కథనంలోని వ్యాఖ్యాన వివాదాన్ని అనువాదంలో పరిష్కరించకుండా, మూలంలోని విషాద ఉద్వేగం మరియు అస్పష్టతను నిలుపాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన కథన శైలి, అయితే ‘ఇదిగో’ వంటి మూలంలోని నాటకీయ సూచనను నిలుపుతూ గౌరవప్రదమైన సాహిత్య ధోరణి పాటించబడింది. పాదసూచిక గుర్తు [a] ప్రధాన పాఠ్యంలో చేర్చబడింది.
