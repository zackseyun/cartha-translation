id: JDG.11.30
reference: Judges 11:30
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּדַּ֨ר יִפְתָּ֥ח נֶ֛דֶר לַ/יהוָ֖ה וַ/יֹּאמַ֑ר אִם נָת֥וֹן תִּתֵּ֛ן אֶת בְּנֵ֥י עַמּ֖וֹן בְּ/יָדִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/030.yaml
  text: And Jephthah made a vow to Yahweh and said[a], “If you indeed give the Ammonites into my hand,”
translation:
  language: te
  text: 'యెఫ్తా యాహ్వేకు ఒక మొక్కుబడి చేసి ఇలా అన్నాడు: “నీవు అమ్మోనీయులను నా చేతికి నిశ్చయంగా అప్పగిస్తే,[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నీవు అమ్మోనీయులను తప్పకుండా నా చేతికి అప్పగిస్తే.” హీబ్రూలో ఉద్ఘాటన కోసం అనంతక్రియారూపంతో పాటు పరిమిత క్రియారూపం ఉపయోగించబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּדַּר ... נֶדֶר
  choice: ఒక మొక్కుబడి చేసుకొని
  rationale: మూలంలోని ఒకే ధాతువుతో వచ్చిన క్రియ–నామ పదబంధాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తూ, ఇది గంభీరమైన వాగ్దానమని స్పష్టం చేస్తుంది.
- source_word: לַיהוָה
  choice: యెహోవాకు
  rationale: లְ అనే సంబంధార్థక ఉపసర్గను ‘కు’తో చూపించి, יהוה అనే దైవనామాన్ని తెలుగులో విస్తృతంగా పరిచితమైన ‘యెహోవా’గా లిప్యంతరీకరించింది.
- source_word: וַיֹּאמַר
  choice: ఇలా అన్నాడు
  rationale: తరువాత వచ్చే ప్రత్యక్ష వాక్యాన్ని సహజంగా పరిచయం చేస్తుంది.
- source_word: אִם
  choice: అప్పగిస్తే
  rationale: షరతును తెలుగులో సహజమైన క్రియా ప్రత్యయం ‘-తే’తో వ్యక్తపరచింది; దాని ఫలిత భాగం తదుపరి వచనంలో కొనసాగుతుందనే అసంపూర్ణతను నిలుపుతుంది.
- source_word: נָתוֹן תִּתֵּן
  choice: నిజంగా ... అప్పగిస్తే
  rationale: అనంతక్రియారూపం మరియు సమాపక క్రియ కలయికలోని ఉద్ఘాటనను ‘నిజంగా’తో తెలియజేస్తుంది.
- source_word: בְּנֵי עַמּוֹן
  choice: అమ్మోనీయులను
  rationale: ‘అమ్మోను కుమారులు’ అనే శాబ్దిక రూపానికి బదులు ఆధునిక తెలుగులో స్పష్టమైన ప్రజానామాన్ని వాడింది.
- source_word: בְּיָדִי
  choice: నా చేతికి
  rationale: జయాధికారంలోకి అప్పగించడం అనే హీబ్రూ రూపకాన్ని, తెలుగులో అర్థమయ్యే విధంగా ఏకవచన ‘చేతి’తో నిలుపుతుంది.
theological_decisions:
- issue: יהוה దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో ఉన్న ఒడంబడిక దైవనామాన్ని బిరుదుగా మార్చకుండా లిప్యంతరీకరించింది; ‘యెహోవా’ ఆధునిక తెలుగు బైబిల్ పాఠకులకు విస్తృతంగా పరిచితమైన రూపం.
- issue: యెఫ్తా చేసిన మొక్కుబడి స్వరూపం
  choice: ఈ వచనంలో దానిని కేవలం ‘మొక్కుబడి’గా పేర్కొనడం
  alternative: మంచి లేదా చెడు మొక్కుబడిగా ముందుగానే విశేషించడం
  rationale: ఈ వచనం మొక్కుబడి యొక్క నైతిక విలువపై తీర్పు ఇవ్వదు; కథలోని ఉద్రిక్తతను ముందుగానే పరిష్కరించకుండా మూలంలోని తటస్థతను కాపాడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సహజంగా అర్థమయ్యే శైలి. వాక్యం తదుపరి వచనంలో కొనసాగుతున్నందున ముగింపును తెరిచి ఉంచింది.
