  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּאמְר֣וּ לְ/יִפְתָּ֔ח לְכָ֕/ה וְ/הָיִ֥יתָה לָּ֖/נוּ לְ/קָצִ֑ין וְ/נִֽלָּחֲמָ֖ה בִּ/בְנֵ֥י עַמּֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/006.yaml
  text: And they said to Jephthah[a], “Come and be our commander, and let us fight against the Ammonites.”
translation:
  language: te
  text: వారు యెఫ్తాతో, “నువ్వు వచ్చి మాకు సేనాధిపతిగా ఉండు; మనం అమ్మోనీయులతో[a] యుద్ధం చేద్దాం” అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో, “అమ్మోను కుమారులు”; ఇది అమ్మోనీయులను సూచించే సాధారణ జాతి-సూచక పదబంధం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ לְיִפְתָּח
  choice: వారు యెఫ్తాతో ... అన్నారు
  rationale: హీబ్రూ కథన క్రమాన్ని సహజమైన తెలుగు ప్రత్యక్ష సంభాషణ నిర్మాణంలో వ్యక్తం చేస్తుంది; יפתח అనే పేరును ‘యెఫ్తా’గా లిప్యంతరీకరించింది.
- source_word: לְכָה
  choice: నువ్వు వచ్చి
  rationale: ఈ సందర్భంలో ఆజ్ఞారూపం ఆహ్వానం లేదా పిలుపుగా పనిచేస్తుంది; తెలుగులో ‘వచ్చి’ తదుపరి ఆజ్ఞతో సహజంగా కలుస్తుంది.
- source_word: וְהָיִיתָה לָּנוּ
  choice: మాకు ... ఉండు
  rationale: అక్షరార్థంగా ‘మాకు/మన కొరకు అవు’ అనే భావాన్ని సహజమైన తెలుగు వ్యక్తీకరణగా అందిస్తుంది.
- source_word: לְקָצִין
  choice: సేనాధిపతిగా
  rationale: קָצִין నాయకుడు లేదా సైనిక అధిపతిని సూచించగలదు; సమీప యుద్ధ సందర్భంలో ‘సేనాధిపతి’ తగిన స్పష్టతను ఇస్తుంది.
- source_word: וְנִלָּחֲמָה
  choice: మనం ... యుద్ధం చేద్దాం
  rationale: మొదటి పురుష బహువచన కోహోర్టేటివ్ భావాన్ని ‘చేద్దాం’ నేరుగా, సహజంగా వ్యక్తం చేస్తుంది; ఉద్దేశార్థాన్ని అనవసరంగా చేర్చదు.
- source_word: בִּבְנֵי עַמּוֹן
  choice: అమ్మోనీయులతో
  rationale: לחם తో వచ్చిన ב యుద్ధ ప్రత్యర్థిని సూచిస్తుంది. ‘అమ్మోను కుమారులతో’ అనే జాతి సూచక పదబంధాన్ని సహజమైన తెలుగు ప్రజానామంగా ‘అమ్మోనీయులతో’ అని అందించింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన కథన శైలి వాడబడింది. ప్రత్యక్ష సంభాషణలో సహజమైన ఏకవచన ‘నువ్వు’ ఉపయోగించబడింది; ‘సేనాధిపతి’ యుద్ధ సందర్భాన్ని స్పష్టంగా ఉంచుతుంది.
