source:
  edition: WLC
  text: וַ/יְהִי֩ כִ/רְאוֹת֨/וֹ אוֹתָ֜/הּ וַ/יִּקְרַ֣ע אֶת בְּגָדָ֗י/ו וַ/יֹּ֨אמֶר֙ אֲהָ֤הּ בִּתִּ/י֙ הַכְרֵ֣עַ הִכְרַעְתִּ֔/נִי וְ/אַ֖תְּ הָיִ֣יתְ בְּ/עֹֽכְרָ֑/י וְ/אָנֹכִ֗י פָּצִ֤יתִי פִ/י֙ אֶל יְהוָ֔ה וְ/לֹ֥א אוּכַ֖ל לָ/שֽׁוּב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/035.yaml
  text: And when he saw her[a], he tore his clothes and said, “Alas, my daughter! You have brought me very low, and you have become the cause of my trouble. For I have opened my mouth to Yahweh, and I cannot turn back.”
translation:
  language: te
  text: అతడు ఆమెను చూసినప్పుడు తన బట్టలు చింపుకొని, “అయ్యో, నా కుమార్తె! నువ్వు నన్ను పూర్తిగా కుంగదీశావు; నువ్వు నన్ను కష్టపెట్టేదానివయ్యావు. నేను యహ్వేకు నా నోరు తెరిచాను[a]; ఇక వెనక్కి తిరగలేను” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, భావాన్ని మరింత స్పష్టంగా చెప్పాలంటే, “నేను యహ్వేకు ప్రమాణం చేశాను.” హీబ్రూలో అక్షరార్థంగా, “నేను యహ్వేకు నా నోరు తెరిచాను.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִרְאוֹתוֹ אוֹתָהּ
  choice: అతడు ఆమెను చూసినప్పుడు
  rationale: వַיְהִיతో కూడిన కాలసూచక నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగు ఉపవాక్యంగా ఇచ్చాం; ‘అప్పుడు ఇలా జరిగింది’ అని పదశః చేర్చడం ఇక్కడ అనవసరంగా బరువుగా ఉంటుంది.
- source_word: וַיִּקְרַע אֶת־בְּגָדָיו
  choice: తన బట్టలు చింపుకొని
  rationale: దుఃఖం లేదా తీవ్ర కలతను వ్యక్తం చేసే సాంప్రదాయ చర్యను సహజమైన తెలుగులో నేరుగా తెలిపింది.
- source_word: אֲהָהּ
  choice: అయ్యో
  rationale: తీవ్ర దుఃఖం, దిగ్భ్రాంతిని వ్యక్తం చేసే ఈ ఆశ్చర్యోక్తికి ‘అయ్యో’ సహజమైన, గౌరవప్రదమైన తెలుగు సమానం.
- source_word: בִּתִּי
  choice: నా కుమార్తె
  rationale: ప్రత్యక్ష సంబోధనను స్పష్టంగా, సహజంగా అనువదించింది.
- source_word: הַכְרֵעַ הִכְרַעְתִּנִי
  choice: నువ్వు నన్ను పూర్తిగా కుంగదీశావు
  rationale: క్రియాధాతురూపం, పరిమిత క్రియ కలిసి ఇచ్చే తీవ్రతను ‘పూర్తిగా’ ద్వారా నిలిపి, כרעలోని కిందికి వంగిపోవడం/కుంగిపోవడం అనే భావాన్ని సహజంగా వ్యక్తం చేసింది.
- source_word: וְאַתְּ הָיִיתְ בְּעֹכְרָי
  choice: నన్ను కష్టపెట్టినవారిలో నువ్వూ ఒకదానివయ్యావు
  rationale: బహువచన రూపంలోని ‘నన్ను ఇబ్బందికి గురిచేసేవారిలో’ అనే భావాన్ని నిలిపింది. కుమార్తెపై మూలపాఠానికి మించిన నైతిక నిందను మోపకుండా యెఫ్తా పలికిన ఆవేదనను తెలియజేస్తుంది.
- source_word: וְאָנֹכִי פָצִיתִי פִי אֶל־יְהוָה
  choice: నేను యహ్వే ఎదుట నా నోరు తెరిచాను[a]
  rationale: ‘నా నోరు తెరిచాను’ అనే హీబ్రూ రూపకాన్ని ప్రధాన పాఠంలో నిలిపాం. సందర్భంలో అది ప్రమాణం చేయడాన్ని సూచిస్తుందని పాదసూచిక స్పష్టం చేస్తుంది; אֶל‌ను తెలుగులో సహజమైన ‘ఎదుట’గా ఇచ్చాం.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, హీబ్రూ చతురక్షర నామానికి సమీపమైన తెలుగు లిప్యంతరీకరణను ఉపయోగించాం.
- source_word: וְלֹא אוּכַל לָשׁוּב
  choice: ఇక వెనక్కి తిరగలేను
  rationale: שובలోని ‘వెనక్కి తిరగడం’ అనే చిత్రాన్ని నిలిపి, తాను పలికిన మాట నుంచి వెనుదిరగలేననే సందర్భార్థాన్ని సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: యెఫ్తా పలికినది ప్రమాణమని ప్రధాన పాఠంలోనే స్పష్టంగా చెప్పాలా
  choice: ‘యహ్వే ఎదుట నా నోరు తెరిచాను’ అనే హీబ్రూ నుడికారాన్ని ప్రధాన పాఠంలో నిలిపి, ప్రమాణార్థాన్ని పాదసూచికలో వివరించడం.
  alternative: ‘నేను యహ్వేకు ప్రమాణం చేశాను’ లేదా ‘యహ్వేకు మాట ఇచ్చాను.’
  rationale: సందర్భం ప్రమాణాన్ని స్పష్టంగా సూచించినా, మూలంలోని గంభీరమైన రూపకం కేవలం ‘ప్రమాణం చేశాను’ కంటే విస్తృతంగా ఉంది. దాన్ని నిలపడం వల్ల పాఠంలోని స్వరూపం, వ్యాఖ్యాన ఉద్వేగం రెండూ కాపాడబడతాయి.
- issue: యెఫ్తా తన కుమార్తెను ఎంత తీవ్రంగా నిందిస్తున్నట్లు అనువదించాలి
  choice: తీవ్ర ఆవేదనను ‘పూర్తిగా కుంగదీశావు’ అని, సంబంధాన్ని ‘కష్టపెట్టినవారిలో నువ్వూ ఒకదానివయ్యావు’ అని ఇవ్వడం.
  alternative: ‘నన్ను నాశనం చేశావు’ లేదా ‘నా వినాశనానికి కారణమయ్యావు.’
  rationale: మూలపాఠంలో తీవ్ర భావోద్వేగం ఉంది; అయితే ‘నాశనం’ వంటి పదాలు అవసరానికి మించిన నైతిక నిందను లేదా అంతిమ వినాశనాన్ని సూచించవచ్చు. ఎంపిక చేసిన పదాలు తీవ్రతను నిలిపి అతివ్యాఖ్యానాన్ని నివారిస్తాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన కథనశైలిని ఉపయోగించాం. ‘అయ్యో’, ‘కుంగదీశావు’, ‘వెనక్కి తిరగలేను’ వంటి సహజ పదబంధాలతో భావోద్వేగ తీవ్రతను నిలిపాం. పాదసూచిక గుర్తును దానికి సంబంధించిన ప్రమాణ నుడికారం వద్ద ఉంచాం.
