revisions:
- from: గిలాదు పెద్దలు యెఫ్తాతో, “ఆ కారణంగానే ఇప్పుడు మేము నీ దగ్గరికి తిరిగి వచ్చాము[a]. నువ్వు మాతో వెళ్లి అమ్మోనీయులతో[b] యుద్ధం చేస్తావు; గిలాదులో నివసించే వారందరికీ అధిపతిగా ఉంటావు” అన్నారు.
  to: 'గిలాదు పెద్దలు యెఫ్తాతో ఇలా అన్నారు: “ఆ కారణంగానే ఇప్పుడు మేము మీ దగ్గరికి తిరిగి వచ్చాము[a]. మీరు మాతో వెళ్లి అమ్మోనీయులతో[b] యుద్ధం చేయడానికి వచ్చాము; అప్పుడు మీరు గిలాదులో నివసించే వారందరిపై అధిపతిగా ఉంటారు.”'
  rationale: 'సురక్షిత సవరణ అవసరం ఉంది. అయితే ప్రతిపాదిత వాక్యంలో ‘మీరు మాతో వెళ్లి ... యుద్ధం చేయడానికి వచ్చాము’ అనే భాగంలో కర్త అసంగతి ఏర్పడుతుంది: పెద్దలు ‘వచ్చాము,’ యెఫ్తా ‘వెళ్లి’ అనే ఉద్దేశం. దీనిని అర్థం మారకుండా సరిచేయాలి. పూర్తి సవరించిన పాఠం: గిలాదు పెద్దలు యెఫ్తాతో ఇలా అన్నారు: “ఆ కారణంగానే ఇప్పుడు మేము మీ దగ్గరికి తిరిగి వచ్చాము[a]. మీరు మాతో వెళ్లి అమ్మోనీయులతో[b] యుద్ధం చేయండి; అప్పుడు మీరు గిలాదులో నివసించే వారందరిపై అధిపతిగా ఉంటారు.” ఈ ఆజ్ఞార్థకం హీబ్రూ ప్రతిపాదనలోని ఆహ్వానాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది; ‘అప్పుడు’ వాగ్దాన పరిణామాన్ని సూచిస్తుంది, అదనపు సిద్ధాంతపరమైన షరతును విధించదు.'
