id: JDG.11.8
reference: Judges 11:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּאמְרוּ֩ זִקְנֵ֨י גִלְעָ֜ד אֶל יִפְתָּ֗ח לָ/כֵן֙ עַתָּה֙ שַׁ֣בְנוּ אֵלֶ֔י/ךָ וְ/הָלַכְתָּ֣ עִמָּ֔/נוּ וְ/נִלְחַמְתָּ֖ בִּ/בְנֵ֣י עַמּ֑וֹן וְ/הָיִ֤יתָ לָּ֨/נוּ֙ לְ/רֹ֔אשׁ לְ/כֹ֖ל יֹשְׁבֵ֥י גִלְעָֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/008.yaml
  text: And the elders of Gilead said to Jephthah[a], “That is why we have now come back to you, so that you may go with us and fight against the Ammonites[b], and you will be head over all the inhabitants of Gilead.”
translation:
  language: te
  text: 'గిలాదు పెద్దలు యెఫ్తాతో ఇలా అన్నారు: “ఆ కారణంగానే ఇప్పుడు మేము మీ దగ్గరికి తిరిగి వచ్చాము[a]. మీరు మాతో వెళ్లి అమ్మోనీయులతో[b] యుద్ధం చేయడానికి వచ్చాము; అప్పుడు మీరు గిలాదులో నివసించే వారందరిపై అధిపతిగా ఉంటారు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మేము మీ వద్దకు తిరిగి వచ్చాము.’
    reason: אֵלֶיךָకు ‘మీ దగ్గరికి’తో పాటు ‘మీ వద్దకు’ కూడా సహజ సందర్భానువాదం; ప్రత్యామ్నాయం పదసన్నిహితమైనది.
  - marker: b
    text: హీబ్రూలో ‘అమ్మోను కుమారులతో,’ అంటే అమ్మోనీయులతో.
    reason: మూలంలోని జాతినామపు అక్షరార్థ రూపాన్ని తెలియజేస్తుంది.
lexical_decisions:
- source_word: זִקְנֵי
  choice: పెద్దలు
  rationale: సమాజంలో గుర్తింపు పొందిన పెద్దలు, నాయకులు అనే సామాజిక-పాలనా హోదాను ‘పెద్దలు’ సహజంగా, నేరుగా తెలియజేస్తుంది.
- source_word: לָכֵן עַתָּה
  choice: ఆ కారణంగానే ఇప్పుడు
  rationale: ముందటి వచనంలో యెఫ్తా లేవనెత్తిన అభ్యంతరానికి సమాధానంగా ఉన్న కారణార్థాన్ని, అలాగే ప్రస్తుత సమయ ప్రాధాన్యాన్ని నిలుపుతుంది.
- source_word: שַׁבְנוּ אֵלֶיךָ
  choice: మేము నీ దగ్గరికి తిరిగి వచ్చాము
  rationale: שׁוּב యొక్క ప్రాథమిక అర్థమైన ‘తిరిగి రావడం’ను కాపాడుతూ, గతంలో తిరస్కరించిన యెఫ్తాతో పెద్దలు మళ్లీ సంబంధం పెట్టుకోవడాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וְהָלַכְתָּ עִמָּנוּ
  choice: నువ్వు మాతో వెళ్లి
  rationale: הלך యొక్క ‘వెళ్లు’ అనే దిశార్థాన్ని నిలుపుతూ, పెద్దలతో కలిసి యుద్ధానికి బయలుదేరడాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: וְנִלְחַמְתָּ בִּבְנֵי עַמּוֹן
  choice: అమ్మోనీయులతో యుద్ధం చేస్తావు
  rationale: ‘అమ్మోను కుమారులు’ అనే హీబ్రూ జాతినామాన్ని సాధారణ తెలుగు జాతిపేరైన ‘అమ్మోనీయులు’గా అందించింది; సందర్భంలో ‘తో’ ప్రతికూల యుద్ధ సంబంధాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: וְהָיִיתָ לָּנוּ לְרֹאשׁ
  choice: అధిపతిగా ఉంటావు
  rationale: רֹאשׁ లోని నాయకత్వం, అధికార భావాన్ని ‘అధిపతి’ స్పష్టంగా తెలియజేస్తుంది; కేవలం సైనిక నాయకత్వానికి పరిమితం చేయదు.
- source_word: לְכֹל יֹשְׁבֵי גִלְעָד
  choice: గిలాదులో నివసించే వారందరికీ
  rationale: స్థలంలో నివసించే మొత్తం ప్రజాసమూహాన్ని సూచించే participial expression యొక్క విస్తృత పరిధిని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: యెఫ్తాకు వాగ్దానం చేసిన అధికార పరిధి
  choice: గిలాదులో నివసించే వారందరిపై విస్తరించే పౌర-సైనిక అధిపత్యం
  alternative: యుద్ధకాలానికి మాత్రమే పరిమితమైన తాత్కాలిక సైనిక నాయకత్వం
  rationale: ‘గిలాదులో నివసించే వారందరికీ అధిపతి’ అనే పదబంధం తక్షణ యుద్ధ బాధ్యతను మించి విస్తృత నాయకత్వాన్ని సూచిస్తుంది; అయితే తరువాతి కాలపు నిర్దిష్ట పాలనా హోదాలను దీనిలోకి చేర్చలేదు.
- issue: వరుసగా వచ్చిన హీబ్రూ క్రియారూపాల సంబంధం
  choice: వెళ్లడం, యుద్ధం చేయడం, అధిపతిగా ఉండడం అనే ప్రతిపాదిత పరిణామాన్ని భవిష్యత్ రూపాలతో వరుసగా ఉంచడం
  alternative: దీనిని స్పష్టమైన షరతుగా ‘యుద్ధం చేస్తే’ అని మార్చడం
  rationale: మూలంలో స్పష్టమైన షరతు సూచిక లేదు. అందువల్ల సహజమైన ప్రతిపాదన/వాగ్దాన ప్రవాహాన్ని కాపాడుతూ, లేని షరతును చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన కథన శైలిని ఉపయోగించాం. సంభాషణలో యెఫ్తాను ఏకవచన ‘నువ్వు’తో సంబోధించడం మూలంలోని ఏకవచన ద్వితీయ పురుష రూపానికి, సందర్భంలోని ప్రత్యక్ష సంభాషణకు అనుగుణం. ‘పెద్దలు,’ ‘అధిపతి’ వంటి పదాలు సామాజిక-పాలనా భావాన్ని సాధారణ పాఠకులకు స్పష్టంగా ఉంచుతాయి.
