translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. యెఫ్తా మాటల్లోని నిందారోపణాత్మక అలంకారిక ప్రశ్నను ‘కదా?’తో స్పష్టంగా ఉంచి, పదబద్ధత కంటే సహజ వాక్యక్రమానికి ప్రాధాన్యం ఇచ్చాం.
