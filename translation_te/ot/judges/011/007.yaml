id: JDG.11.7
reference: Judges 11:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יִפְתָּח֙ לְ/זִקְנֵ֣י גִלְעָ֔ד הֲ/לֹ֤א אַתֶּם֙ שְׂנֵאתֶ֣ם אוֹתִ֔/י וַ/תְּגָרְשׁ֖וּ/נִי מִ/בֵּ֣ית אָבִ֑/י וּ/מַדּ֜וּעַ בָּאתֶ֤ם אֵלַ/י֙ עַ֔תָּה כַּ/אֲשֶׁ֖ר צַ֥ר לָ/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/007.yaml
  text: Jephthah said to the elders of Gilead[a], “Did you not hate me and drive me out from my father’s house? So why have you come to me now, when you are in distress?”
translation:
  language: te
  text: 'యెఫ్తా గిలాదు పెద్దలతో ఇలా అన్నాడు: “మీరు నన్ను ద్వేషించి, నా తండ్రి ఇంటి నుండి నన్ను వెళ్లగొట్టారు కదా? ఇప్పుడు మీకు కష్టం వచ్చినప్పుడు నా దగ్గరికి ఎందుకు వచ్చారు?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: ఇలా అన్నాడు
  rationale: హీబ్రూ కథనంలో אמר యొక్క సాధారణ వాక్యారంభ ప్రయోగాన్ని సహజమైన తెలుగు ప్రత్యక్ష సంభాషణగా అందిస్తుంది.
- source_word: זִקְנֵי גִלְעָד
  choice: గిలాదు పెద్దలు
  rationale: ఇది కేవలం వృద్ధులను కాక సమాజ నాయకత్వ బాధ్యత గల పెద్దలను సూచిస్తుంది; ‘పెద్దలు’ ఆ సామాజిక-రాజకీయ పాత్రను నిలుపుతుంది.
- source_word: הֲלֹא
  choice: కదా?
  rationale: సమ్మతిని ఆశించే అలంకారిక ప్రశ్నను ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: שְׂנֵאתֶם
  choice: ద్వేషించి
  rationale: שׂנא యొక్క సూటి అర్థమైన ద్వేషాన్ని తగ్గించకుండా, అతిశయింపకుండా నిలుపుతుంది.
- source_word: וַתְּגָרְשׁוּנִי
  choice: నన్ను వెళ్లగొట్టారు
  rationale: גרשׁ లోని బలవంతపు బహిష్కరణ భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: מִבֵּית אָבִי
  choice: నా తండ్రి ఇంటి నుండి
  rationale: ‘తండ్రి ఇల్లు’ అనే కుటుంబ-గృహ పరిధిని మూలానికి దగ్గరగా నిలుపుతుంది; సందర్భంలో కుటుంబ గృహం లేదా కుటుంబ వర్గం రెండింటినీ సూచించగల విస్తృతిని పూర్తిగా మూసివేయదు.
- source_word: וּמַדּוּעַ
  choice: ఎందుకు
  rationale: ముందటి ఆరోపణతో కారణాత్మక అనుసంధానం తెలుగులో వాక్యక్రమం మరియు ‘ఇప్పుడు’ ద్వారా స్పష్టమవుతుంది; అదనపు వివరణ అవసరం లేదు.
- source_word: בָּאתֶם אֵלַי עַתָּה
  choice: ఇప్పుడు ... నా దగ్గరికి ఎందుకు వచ్చారు
  rationale: עתה యొక్క కాల ఉద్ఘాటనను ‘ఇప్పుడు’ నిలుపుతుంది; perfect క్రియను తెలుగు ప్రత్యక్ష సంభాషణలో సహజమైన భూతకాల రూపంతో అందిస్తుంది.
- source_word: כַּאֲשֶׁר צַר לָכֶם
  choice: మీకు కష్టం వచ్చినప్పుడు
  rationale: צר ל అనే ప్రయోగంలోని ఇరుకు పరిస్థితి, ఆపద లేదా బాధ భావాన్ని సాధారణ పాఠకులకు సహజంగా తెలియజేస్తుంది; కారణాన్ని అతిగా నిర్దిష్టం చేయదు.
