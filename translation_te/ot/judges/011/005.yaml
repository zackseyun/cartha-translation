  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా, అయితే కథన గౌరవాన్ని నిలుపుకునే శైలి. వ్యక్తి, ప్రాంత పేర్లకు ‘యెఫ్తా,’ ‘గిలాదు,’ ‘టోబు’ రూపాలు వాడబడ్డాయి.
