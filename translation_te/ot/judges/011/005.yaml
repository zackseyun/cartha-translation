  yaml_path: translation/ot/judges/011/005.yaml
  text: And when the Ammonites fought against Israel[a], the elders of Gilead went to bring Jephthah from the land of Tob.
translation:
  language: te
  text: అమ్మోనీయులు ఇశ్రాయేలుతో యుద్ధం చేసినప్పుడు, గిలాదు పెద్దలు యెఫ్తాను టోబు దేశం నుండి వెంట తీసుకురావడానికి[a] వెళ్లారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తీసుకోవడానికి.” హెబ్రీ క్రియ సాధారణంగా “తీసుకోవడం” అని అర్థమిస్తుంది; ఇక్కడ వారు యెఫ్తాను తిరిగి వెంట తీసుకురావడానికి వెళ్లారని సందర్భం సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: చేసినప్పుడు
  rationale: హెబ్రీ కథన సూత్రంలోని కాలసంబంధ భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; ‘అప్పుడు జరిగినదేమిటంటే’ అనే పదశః రూపం ఇక్కడ అనవసరంగా భారంగా ఉంటుంది.
- source_word: נִלְחֲמוּ
  choice: యుద్ధం చేశారు
  rationale: לחם నిఫాల్ రూపం ఇక్కడ యుద్ధంలో తలపడడాన్ని సూచిస్తుంది; సందర్భానికి స్పష్టమైన, సహజమైన తెలుగు ప్రయోగం.
- source_word: בְנֵי עַמּוֹן
  choice: అమ్మోనీయులు
  rationale: ‘అమ్మోను కుమారులు’ అనే పదశః రూపానికి బదులుగా ఈ ప్రజావర్గాన్ని సూచించే ప్రామాణిక తెలుగు పేరు.
- source_word: עִם יִשְׂרָאֵל
  choice: ఇశ్రాయేలుతో
  rationale: עִם యొక్క మౌలిక భావమైన ‘తో’ను నిలుపుతుంది; ‘యుద్ధం చేయు’ అనే క్రియతో కలిసి ఇది ప్రత్యర్థి సంబంధాన్ని సహజంగానే తెలియజేస్తుంది.
- source_word: זִקְנֵי גִלְעָד
  choice: గిలాదు పెద్దలు
  rationale: గిలాదులో అధికారపూర్వక నాయకత్వం వహించిన పెద్దలను సూచించే సహజమైన నిర్మాణం.
- source_word: לָקַחַת
  choice: వెంట తీసుకురావడానికి
  rationale: לקח సాధారణంగా ‘తీసుకోవడం’ అని అర్థమైనా, పెద్దలు యెఫ్తాను ఉన్న చోటికి వెళ్లి తమతో తిరిగి తీసుకురావడం ఇక్కడి సందర్భం; ‘వెంట తీసుకురావడం’ దిశను స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: אֶת יִפְתָּח
  choice: యెఫ్తాను
  rationale: ప్రత్యక్ష కర్మ సూచికతో ఉన్న వ్యక్తి పేరును తెలుగు వాక్యంలోని కర్మవిభక్తితో అందించింది.
- source_word: מֵאֶרֶץ טוֹב
  choice: టోబు దేశం నుండి
  rationale: אֶרֶץ ఇక్కడ ఒక ప్రాంతం లేదా దేశాన్ని సూచిస్తుంది; ‘టోబు దేశం’ స్థలపేరును స్పష్టంగా నిలుపుతుంది.
