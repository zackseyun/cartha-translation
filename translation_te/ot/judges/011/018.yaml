  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. స్థలనామాలను తెలుగు బైబిలు వాడుకకు అనుగుణంగా ‘ఎదోము,’ ‘మోయాబు,’ ‘అర్నోను’గా లిప్యంతరీకరించాం. మూలంలోని ఏకవచన సమూహ కథనం నుండి బహువచనానికి జరిగే మార్పును అలాగే ఉంచాం.
