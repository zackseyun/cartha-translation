source:
  edition: WLC
  text: וַ/יֵּ֣לֶךְ בַּ/מִּדְבָּ֗ר וַ/יָּ֜סָב אֶת אֶ֤רֶץ אֱדוֹם֙ וְ/אֶת אֶ֣רֶץ מוֹאָ֔ב וַ/יָּבֹ֤א מִ/מִּזְרַח שֶׁ֨מֶשׁ֙ לְ/אֶ֣רֶץ מוֹאָ֔ב וַֽ/יַּחֲנ֖וּ/ן בְּ/עֵ֣בֶר אַרְנ֑וֹן וְ/לֹא בָ֨אוּ֙ בִּ/גְב֣וּל מוֹאָ֔ב כִּ֥י אַרְנ֖וֹן גְּב֥וּל מוֹאָֽב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/018.yaml
  text: Then he went through the wilderness and went around the land of Edom and the land of Moab[a], and came to the east side of the land of Moab, and they camped beyond the Arnon; but they did not enter the territory of Moab[b], for the Arnon was the border of Moab.
translation:
  language: te
  text: తరువాత అతడు అరణ్యం గుండా ప్రయాణించి, ఎదోము దేశాన్నీ మోయాబు దేశాన్నీ చుట్టి వెళ్లాడు. అతడు మోయాబు దేశానికి తూర్పు వైపుకు చేరుకున్నాడు[a]. వారు అర్నోను అవతల[b] శిబిరం వేశారు. అయితే వారు మోయాబు భూభాగంలోకి ప్రవేశించలేదు; ఎందుకంటే అర్నోను మోయాబు సరిహద్దుగా ఉండేది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “సూర్యోదయం వైపు నుండి మోయాబు దేశానికి వచ్చాడు”; అంటే మోయాబును తూర్పు వైపు నుండి సమీపించాడు.
    reason: lexical_alternative
  - marker: b
    text: లేదా “అర్నోనుకు మరొక వైపున.” ఏ వైపు అన్నది చూసే దృష్టికోణంపై ఆధారపడి ఉంటుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ בַּמִּדְבָּר
  choice: అరణ్యం గుండా ప్రయాణించి
  rationale: הלך అనే క్రియకు ‘వెళ్లు/నడుచు’ అనే ప్రాథమిక అర్థం ఉంది; בַּמִּדְבָּר తో కలిసి ఇక్కడ ప్రయాణ మార్గాన్ని సూచిస్తుంది. ‘అరణ్యం గుండా ప్రయాణించి’ అనేది సహజమైన ఆధునిక తెలుగు.
- source_word: וַיָּסָב אֶת אֶרֶץ אֱדוֹם וְאֶת אֶרֶץ מוֹאָב
  choice: ఎదోము దేశాన్నీ మోయాబు దేశాన్నీ చుట్టి వెళ్లాడు
  rationale: סבב ఇక్కడ ఆ దేశాల గుండా కాకుండా వాటి చుట్టూ మార్గం తీసుకోవడాన్ని సూచిస్తుంది. ‘చుట్టి వెళ్లాడు’ దిశాభావాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: וַיָּבֹא מִמִּזְרַח שֶׁמֶשׁ לְאֶרֶץ מוֹאָב
  choice: మోయాబు దేశానికి తూర్పు వైపునకు చేరుకున్నాడు
  rationale: ‘సూర్యోదయం వైపు నుండి’ అనే హీబ్రూ భౌగోళిక నుడికారం తూర్పు దిశను సూచిస్తుంది. మోయాబు భూభాగంలోకి ప్రవేశించలేదనే తరువాతి వాక్యానికి అనుగుణంగా, దాని తూర్పు వైపుకు చేరడమే ఉద్దేశం.
- source_word: וַיַּחֲנוּן
  choice: వారు శిబిరం వేశారు
  rationale: חנה అంటే శిబిరం వేయడం. హీబ్రూలో ఏకవచన సమూహ సూచన నుండి బహువచనానికి మార్పు ఉంది; తెలుగులోనూ ‘అతడు’ నుండి ‘వారు’కు ఆ మార్పును నిలిపాం.
- source_word: בְּעֵבֶר אַרְנוֹן
  choice: అర్నోను అవతల
  rationale: עֵבֶר అంటే అవతలి వైపు లేదా మరొక వైపు. ‘అవతల’ సంక్షిప్తంగా ఉండి, నిర్దిష్ట దృష్టికోణాన్ని అనవసరంగా నిర్ణయించదు.
- source_word: וְלֹא בָאוּ בִּגְבוּל מוֹאָב
  choice: వారు మోయాబు భూభాగంలోకి ప్రవేశించలేదు
  rationale: גְּבוּל సరిహద్దునూ, ఆ సరిహద్దులోని భూభాగాన్నీ సూచించగలదు. ఇక్కడ లోపలికి వెళ్లకపోవడమే భావం కాబట్టి ‘భూభాగంలోకి ప్రవేశించలేదు’ సహజంగా ఉంటుంది.
- source_word: כִּי אַרְנוֹן גְּבוּל מוֹאָב
  choice: ఎందుకంటే అర్నోను మోయాబు సరిహద్దు
  rationale: ఇది ముందటి వాక్యానికి కారణాన్ని తెలిపే నామవాచక వాక్యం. ‘సరిహద్దు’ గְּבוּל యొక్క ప్రత్యక్ష అర్థాన్ని నిలుపుతుంది.
