id: JDG.11.29
reference: Judges 11:29
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/תְּהִ֤י עַל יִפְתָּח֙ ר֣וּחַ יְהוָ֔ה וַ/יַּעֲבֹ֥ר אֶת הַ/גִּלְעָ֖ד וְ/אֶת מְנַשֶּׁ֑ה וַֽ/יַּעֲבֹר֙ אֶת מִצְפֵּ֣ה גִלְעָ֔ד וּ/מִ/מִּצְפֵּ֣ה גִלְעָ֔ד עָבַ֖ר בְּנֵ֥י עַמּֽוֹן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/029.yaml
  text: Then the Spirit of Yahweh came upon Jephthah[a], and he passed through Gilead and Manasseh. He passed through Mizpah of Gilead, and from Mizpah of Gilead he passed on to the Ammonites.
translation:
  language: te
  text: అప్పుడు యాహ్వే ఆత్మ యెఫ్తా మీదికి వచ్చింది. అతడు గిలాదు, మనష్షే ప్రాంతాల గుండా వెళ్లాడు. అతడు గిలాదులోని మిస్పా గుండా వెళ్లి, గిలాదులోని మిస్పా నుండి అమ్మోనీయుల దగ్గరకు సాగిపోయాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అమ్మోనీయుల దగ్గరకు దాటి వెళ్లాడు,” లేదా “అమ్మోనీయుల వైపు ముందుకు సాగాడు.” హీబ్రూ క్రియ సందర్భానుసారం గుండా వెళ్లడం, దాటి వెళ్లడం, లేదా ముందుకు సాగడం అనే అర్థాలను ఇవ్వగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ר֣וּחַ יְהוָ֔ה
  choice: యెహోవా ఆత్మ
  rationale: న్యాయాధిపతుల గ్రంథంలోని ఈ సందర్భంలో רוּחַ అనేది గాలి లేదా ఊపిరి కాక, నాయకుణ్ణి శక్తిమంతుణ్ణి చేసే దేవుని ఆత్మను సూచిస్తుంది; יְהוָהను covenant పేరుగా ‘యెహోవా’ అని లిప్యంతరీకరించాం.
- source_word: וַ/תְּהִ֤י עַל
  choice: మీదికి వచ్చింది
  rationale: దైవిక శక్తినిచ్చే సంఘటనను సూచించే హీబ్రూ ప్రయోగంలోని చలనాత్మక భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: יִפְתָּח
  choice: యెఫ్తా
  rationale: వ్యక్తి పేరుకు తెలుగులో సాధారణంగా గుర్తించదగిన లిప్యంతరీకరణ.
- source_word: וַ/יַּעֲבֹ֥ר אֶת הַ/גִּלְעָ֖ד וְ/אֶת מְנַשֶּׁ֑ה
  choice: గిలాదులోనూ మనష్షే ప్రాంతంలోనూ ప్రయాణించి
  rationale: עבר అనే క్రియకు ఇక్కడ ప్రాంతాల గుండా వెళ్లడం అనే భావం ఉంది. ‘ప్రాంతంలో’ అని చేర్చడం మనష్షే వ్యక్తిని కాక భూభాగాన్ని సూచిస్తోందని తెలుగులో స్పష్టం చేస్తుంది.
- source_word: מִצְפֵּ֣ה גִלְעָ֔ד
  choice: గిలాదు మిస్పా
  rationale: ఇది స్థల నామం కాబట్టి ‘కావలిగోపురం’ అని అర్థానువాదం చేయకుండా లిప్యంతరీకరించాం; తెలుగు పదక్రమంలో సంబంధాన్ని సహజంగా చూపించాం.
- source_word: עָבַ֖ר בְּנֵ֥י עַמּֽוֹן
  choice: అమ్మోనీయుల వైపుకు సాగిపోయాడు
  rationale: עבר ఇక్కడ దాటడం, ముందుకు వెళ్లడం, లేదా శత్రువువైపు సాగడం అనే భావాలను కలిగి ఉండవచ్చు. తక్షణ దాడిని అనవసరంగా చేర్చకుండా గమ్యదిశను తెలియజేస్తుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు; యాహ్వే
  rationale: మూలపాఠంలో ఉన్న నాలుగు అక్షరాల దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా వ్యక్తినామంగా నిలిపాం. ఆధునిక తెలుగు బైబిల్ పాఠకులకు విస్తృతంగా పరిచితమైన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం.
- issue: యెఫ్తా మీదికి వచ్చిన רוּחַ స్వభావం
  choice: యెహోవా ఆత్మ యెఫ్తా మీదికి వచ్చింది
  alternative: యెహోవా గాలి/ఊపిరి అతని మీదికి వచ్చింది
  rationale: న్యాయాధిపతుల కథన సందర్భంలో ఈ స్థిరప్రయోగం దేవుడు నాయకుణ్ణి కార్యసాధనకు శక్తిమంతుణ్ణి చేయడాన్ని సూచిస్తుంది. అయితే ఆ శక్తినిచ్చుట ఫలితాల గురించి మూలంలో లేని వివరాలు చేర్చలేదు.
translation_notes:
  register: సహజమైన, గౌరవప్రదమైన ఆధునిక ప్రామాణిక తెలుగు వాడబడింది. కథనంలోని వరుస కదలికలు స్పష్టంగా ఉండేందుకు చిన్న వాక్యాలుగా అమర్చాం. స్థల నామాలను లిప్యంతరీకరించాం; యుద్ధం వెంటనే మొదలైందని మూలంలో లేని భావాన్ని చేర్చలేదు.
