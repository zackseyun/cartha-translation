id: JDG.11.27
reference: Judges 11:27
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אָֽנֹכִי֙ לֹֽא חָטָ֣אתִי לָ֔/ךְ וְ/אַתָּ֞ה עֹשֶׂ֥ה אִתִּ֛/י רָעָ֖ה לְ/הִלָּ֣חֶם בִּ֑/י יִשְׁפֹּ֨ט יְהוָ֤ה הַ/שֹּׁפֵט֙ הַ/יּ֔וֹם בֵּ֚ין בְּנֵ֣י יִשְׂרָאֵ֔ל וּ/בֵ֖ין בְּנֵ֥י עַמּֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/027.yaml
  text: I have not sinned against you[a], but you are doing me wrong by making war against me. May Yahweh, the Judge, judge today between the sons of Israel and the sons of Ammon.
translation:
  language: te
  text: నేను నీకు వ్యతిరేకంగా పాపం చేయలేదు; కానీ నీవు నాకు వ్యతిరేకంగా యుద్ధం చేస్తూ నాకు అన్యాయం చేస్తున్నావు. న్యాయాధిపతియైన యాహ్వే ఈ రోజు ఇశ్రాయేలీయులకూ అమ్మోనీయులకూ మధ్య[a] తీర్పు తీర్చుగాక.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘ఇశ్రాయేలు కుమారులకూ అమ్మోను కుమారులకూ మధ్య.’
    reason: మూలంలోని בְּנֵי అనే సమష్టి జాతీయ ప్రయోగం యొక్క అక్షరార్థాన్ని తెలియజేయడానికి.
lexical_decisions:
- source_word: חָטָאתִי לָךְ
  choice: నీకు వ్యతిరేకంగా పాపం చేయలేదు
  rationale: חטא అనే క్రియకు ‘పాపం చేయు’ లేదా ‘తప్పు చేయు’ అనే అర్థాలు ఉన్నాయి. ఈ న్యాయపరమైన వాదనలో ‘పాపం చేయలేదు’ అనడం మూలంలోని నైతిక బలాన్ని నిలుపుతుంది; לָךְ సంబంధాన్ని తెలుగులో సహజంగా ‘నీకు వ్యతిరేకంగా’ అని వ్యక్తం చేశాం.
- source_word: וְאַתָּה עֹשֶׂה אִתִּי רָעָה
  choice: కాని నువ్వు ... నాకు అన్యాయం చేస్తున్నావు
  rationale: ఈ సందర్భంలో רָעָה సాధారణ ‘కీడు’కన్నా యెఫ్తా చేస్తున్న న్యాయపరమైన ఆరోపణను సూచిస్తుంది. అందువల్ల సహజమైన ఆధునిక తెలుగులో ‘అన్యాయం చేస్తున్నావు’ అని అనువదించాం.
- source_word: לְהִלָּחֶם בִּי
  choice: నాతో యుద్ధం చేసి
  rationale: ఇది ఆ అన్యాయం ఏ విధంగా జరుగుతోందో వివరిస్తుంది. దేశాల మధ్య సంగ్రామ సందర్భానికి ‘యుద్ధం చేసి’ సహజంగా సరిపోతుంది; ‘నాతో’ అనేది ప్రత్యర్థిత్వ భావాన్ని తెలుగులో అందిస్తుంది.
- source_word: יִשְׁפֹּט יְהוָה הַשֹּׁפֵט
  choice: న్యాయాధిపతియైన యాహ్వే ... తీర్పు తీర్చుగాక
  rationale: మూలంలోని שפט క్రియ, దానితో సంబంధమున్న ‘న్యాయాధిపతి’ అనే బిరుదు రెండింటినీ సాధ్యమైనంతవరకు నిలిపాం. జస్సివ్ భావాన్ని ‘తీర్పు తీర్చుగాక’ ద్వారా వ్యక్తం చేశాం.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పునర్నిర్మిత ఉచ్చారణకు అనుగుణంగా ‘యాహ్వే’ అని లిప్యంతరీకరించాం.
- source_word: הַיּוֹם
  choice: ఈ రోజు
  rationale: విన్నపంలోని తక్షణత్వాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בֵּין בְּנֵי יִשְׂרָאֵל וּבֵין בְּנֵי עַמּוֹן
  choice: ఇశ్రాయేలీయులకూ అమ్మోనీయులకూ మధ్య
  rationale: בני అనే పదం అక్షరార్థంగా ‘కుమారులు’ అయినా, ఇక్కడ రెండు జాతి సమూహాలను సమష్టిగా సూచిస్తుంది. అందువల్ల ప్రధాన పాఠంలో సహజమైన జాతి పేర్లను వాడి, అక్షరార్థాన్ని పాదసూచికలో ఇచ్చాం.
theological_decisions:
- issue: దైవనామం יהוה అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలంలో వ్యక్తిగత దైవనామమే ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుగా మార్చకుండా ‘యాహ్వే’గా అందించడం మూలరూపాన్ని స్పష్టంగా నిలుపుతుంది.
- issue: בני అనే సమష్టి పురుషలింగ వ్యక్తీకరణ
  choice: ఇశ్రాయేలీయులు ... అమ్మోనీయులు
  alternative: ఇశ్రాయేలు కుమారులు ... అమ్మోను కుమారులు
  rationale: ఈ సందర్భంలో בני ఆయా జనసమూహాల సభ్యులను సూచించే హీబ్రూ జాతీయ ప్రయోగం. ప్రధాన పాఠంలో భావాన్ని సహజంగా తెలిపి, మూలంలోని అక్షరార్థ రూపాన్ని పాదసూచికలో భద్రపరిచాం.
- issue: יִשְׁפֹּט యొక్క భావం
  choice: తీర్పు తీర్చుగాక
  alternative: తీర్పు తీరుస్తాడు
  rationale: ఈ మాటను ఖచ్చితమైన భవిష్యద్వాణిగా కాక, దేవునికి చేసే న్యాయవిన్నపంగా గ్రహించాం. హీబ్రూ రూపానికి భవిష్యదర్థం సాధ్యమైనప్పటికీ, సందర్భం ఆశీర్వచనాత్మక/విన్నప భావానికి బలంగా అనుకూలిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, న్యాయపరమైన గంభీరతను కాపాడుతూ సాధారణ పాఠకులకు సులభంగా ఉండే రీతిని ఉపయోగించాం. సంభాషణలోని ఏకవచన ‘నువ్వు’ను నిలిపి, ముగింపులోని అధికారిక దేవవిన్నపానికి గౌరవప్రదమైన ‘తీర్చుగాక’ రూపాన్ని వాడాం.
