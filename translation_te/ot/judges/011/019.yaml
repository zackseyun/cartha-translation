id: JDG.11.19
reference: Judges 11:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֤ח יִשְׂרָאֵל֙ מַלְאָכִ֔ים אֶל סִיח֥וֹן מֶֽלֶךְ הָ/אֱמֹרִ֖י מֶ֣לֶךְ חֶשְׁבּ֑וֹן וַ/יֹּ֤אמֶר ל/וֹ֙ יִשְׂרָאֵ֔ל נַעְבְּרָה נָּ֥א בְ/אַרְצְ/ךָ֖ עַד מְקוֹמִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/019.yaml
  text: Then Israel sent messengers to Sihon king of the Amorites[a], king of Heshbon, and Israel said to him[b], “Please let us pass through your land to our place.”
translation:
  language: te
  text: 'అప్పుడు ఇశ్రాయేలు అమోరీయుల రాజు, హెష్బోను రాజైన సీహోనుకు దూతలను[a] పంపింది. ఇశ్రాయేలు అతనితో ఇలా చెప్పింది: “దయచేసి, మమ్మల్ని నీ దేశం గుండా నా స్థలానికి[b] వెళ్లనివ్వు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఈ రాజదౌత్య సందర్భంలో “దూతలు” అంటే సందేశాన్ని తీసుకెళ్లిన మానవ ప్రతినిధులు; “రాయబారులు” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: మూల హీబ్రూలో అక్షరార్థంగా “నా స్థలానికి” ఉంది; ఇశ్రాయేలు సమష్టిగా మాట్లాడుతున్నందున “మా స్థలానికి” అని కూడా అర్థం చేసుకోవచ్చు. సంఖ్యాకాండము 21:22లోని సమాంతర అభ్యర్థనను పోల్చండి.
    reason: textual_ambiguity
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: పంపింది
  rationale: కథనంలోని సాధారణ భూతకాల క్రియను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; ‘ఇశ్రాయేలు’ను సమష్టి దేశంగా ఏకవచనంలో ఉంచుతుంది.
- source_word: מַלְאָכִים
  choice: దూతలను
  rationale: ఇక్కడ రాజుకు పంపిన మానవ ప్రతినిధులు ఉద్దేశించబడ్డారు; ‘దూతలు’ дипломатిక సందర్భానికీ సాధారణ పాఠకులకూ స్పష్టంగా ఉంటుంది.
- source_word: סִיחוֹן
  choice: సీహోను
  rationale: వ్యక్తి పేరును తెలుగులో ప్రాచుర్యంలో ఉన్న బైబిలు లిప్యంతరీకరణకు అనుగుణంగా ఇచ్చాం.
- source_word: מֶלֶךְ הָאֱמֹרִי
  choice: అమోరీయుల రాజు
  rationale: హీబ్రూ జాతివాచక ఏకవచనం ఇక్కడ ఆ ప్రజాసమూహాన్ని సూచిస్తుంది; తెలుగులో సహజంగా బహువచన జాతిపేరుతో వ్యక్తం చేశాం.
- source_word: מֶלֶךְ חֶשְׁבּוֹן
  choice: హెష్బోను రాజైన
  rationale: సీహోను పాలించిన రాజ్యాన్ని తెలిపే రెండవ సమానాధికరణ బిరుదును నిలుపుతుంది.
- source_word: וַיֹּאמֶר לוֹ יִשְׂרָאֵל
  choice: ఇశ్రాయేలు అతనితో … అని చెప్పింది
  rationale: మూలంలో ‘ఇశ్రాయేలు’ మళ్లీ స్పష్టంగా ఉన్నందున ఆ పునరుక్తిని తొలగించలేదు.
- source_word: נַעְבְּרָה נָּא
  choice: దయచేసి మేము … వెళ్లడానికి అనుమతించు
  rationale: మొదటి పురుష బహువచన కోహోర్టేటివ్‌తో కూడిన నָא మర్యాదపూర్వక అభ్యర్థనను సూచిస్తుంది; తెలుగులో ‘దయచేసి’ మరియు ‘అనుమతించు’ దాన్ని సహజంగా తెలియజేస్తాయి.
- source_word: בְאַרְצְךָ
  choice: నీ దేశం గుండా
  rationale: עבר క్రియతో ఈ పదబంధం ఒక భూభాగం గుండా ప్రయాణించడాన్ని సూచిస్తుంది.
- source_word: עַד מְקוֹמִי
  choice: నా స్థలానికి
  rationale: మూల హీబ్రూలో మొదటి పురుష ఏకవచన ప్రత్యయం ఉంది. ముందున్న బహువచన అభ్యర్థనతో ఏర్పడే అసాధారణ మార్పును సమన్వయపరచకుండా నిలిపాం.
theological_decisions:
- issue: ఇశ్రాయేలు సమష్టి వక్తగా బహువచనం నుంచి ఏకవచన స్వామ్యరూపానికి మారడం
  choice: “మేము … నా స్థలానికి” అని మూలంలోని సంఖ్యా మార్పును నిలిపాం
  alternative: “మేము … మా స్థలానికి” అని సహజీకరించడం
  rationale: נַעְבְּרָה మొదటి పురుష బహువచనం కాగా מְקוֹמִי ‘నా స్థలం’ అనే ఏకవచన రూపం. పాఠంలోని నిజమైన ఉద్వేగాన్ని నిశ్శబ్దంగా పరిష్కరించకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలిని ఉపయోగించాం. రాజదౌత్య సందర్భానికి సరిపోయే ‘దూతలు’, ‘అనుమతించు’ పదాలను ఎంచుకున్నాం. మూలంలోని ‘మేము/నా’ సంఖ్యా ఉద్వేగం అసహజంగా అనిపించినా ఉద్దేశపూర్వకంగా నిలిపి, పాదటిప్పణిలో వివరించాం.
