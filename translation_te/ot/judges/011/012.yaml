source:
  edition: WLC
  text: וַ/יִּשְׁלַ֤ח יִפְתָּח֙ מַלְאָכִ֔ים אֶל מֶ֥לֶךְ בְּנֵֽי עַמּ֖וֹן לֵ/אמֹ֑ר מַה לִּ֣/י וָ/לָ֔/ךְ כִּֽי בָ֥אתָ אֵלַ֖/י לְ/הִלָּחֵ֥ם בְּ/אַרְצִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/012.yaml
  text: Then Jephthah sent messengers to the king of the Ammonites[a], saying, “What is there between me and you, that you have come against me to fight in my land?”
translation:
  language: te
  text: 'అప్పుడు యెఫ్తా అమ్మోనీయుల రాజు వద్దకు దూతలను పంపి ఇలా చెప్పించాడు: “నాకూ నీకూ ఏమి సంబంధం ఉంది? నీవు నా దేశంలో నాతో యుద్ధం చేయడానికి ఎందుకు వచ్చావు?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నాకూ నీకూ మధ్య ఏముంది?” ఈ హీబ్రూ నుడికారం రెండు పక్షాల మధ్య ఉన్న విరోధాన్ని లేదా వివాదాన్ని వ్యక్తం చేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: అప్పుడు ... పంపి
  rationale: వావ్-కన్సిక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది; ‘అప్పుడు’ సహజమైన తెలుగు కథన క్రమాన్ని తెలియజేస్తుంది.
- source_word: יִפְתָּח
  choice: యెఫ్తా
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగులో ప్రాచుర్యంలో ఉన్న లిప్యంతరీకరణ.
- source_word: מַלְאָכִים
  choice: దూతలను
  rationale: ఈ దౌత్య సందర్భంలో ఇది పరలోక దూతలను కాక, మానవ సందేశవాహకులను సూచిస్తుంది.
- source_word: אֶל מֶלֶךְ בְּנֵי עַמּוֹן
  choice: అమ్మోనీయుల రాజు దగ్గరికి
  rationale: ‘అమ్మోను కుమారులు’ అనే హీబ్రూ జాతినామాన్ని సహజమైన ఆధునిక తెలుగులో ‘అమ్మోనీయులు’గా ఇచ్చాం.
- source_word: לֵאמֹר
  choice: అని అడిగాడు
  rationale: ప్రత్యక్ష సంభాషణను పరిచయం చేసే హీబ్రూ రూపాన్ని, వాక్యంలోని ప్రశ్నకు సరిపోయే సహజ తెలుగు సంభాషణ క్రియతో వ్యక్తం చేశాం.
- source_word: מַה לִּי וָלָךְ
  choice: నాకూ నీకూ మధ్య ఏముంది?
  rationale: పక్షాల మధ్య విరోధం లేదా వివాదాన్ని సూచించే హీబ్రూ నుడికారానికి దగ్గరగా ఉండి, తెలుగులోనూ అర్థమయ్యే రూపం; మరింత వివరణాత్మక ప్రత్యామ్నాయం పాదసూచికలో ఉంది.
- source_word: כִּי
  choice: నువ్వెందుకు
  rationale: ఇక్కడ ఫిర్యాదుకు ఆధారమైన పరిస్థితిని ప్రశ్నారూపంలో సహజ తెలుగులో కలిపి వ్యక్తం చేస్తుంది; కారణసంబంధాన్ని అతిగా నిర్దిష్టం చేయదు.
- source_word: בָאתָ אֵלַי
  choice: నాతో ... చేయడానికి నువ్వెందుకు వచ్చావు
  rationale: అక్షరార్థంగా ‘నా దగ్గరికి వచ్చావు’; తరువాతి ‘యుద్ధం చేయడానికి’ అనే పదబంధమే శత్రుత్వ భావాన్ని స్పష్టం చేస్తుంది, కాబట్టి తెలుగులో అనవసర పునరుక్తి లేకుండా ఇచ్చాం.
- source_word: לְהִלָּחֵם
  choice: యుద్ధం చేయడానికి
  rationale: నిఫాల్ అనంతరూపం యుద్ధంలో పాల్గొనడాన్ని సూచిస్తుంది; ‘యుద్ధం చేయడం’ ఈ రాజ్యాల మధ్య ఘర్షణ సందర్భానికి సహజంగా సరిపోతుంది.
- source_word: בְּאַרְצִי
  choice: నా దేశంలో
  rationale: בְּ అనే విభక్తి ఇక్కడ ‘లో’ అనే స్థానార్థాన్ని ఇస్తుంది; ‘నా దేశంలో’ మూలంలోని భావాన్ని స్పష్టంగా, సహజంగా అందిస్తుంది.
