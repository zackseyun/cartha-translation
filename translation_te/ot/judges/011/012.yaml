  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. రాజుల మధ్య ప్రత్యక్ష సంభాషణలో తెలుగు ఏకవచన సంబోధనను నిలిపాం. పాదసూచిక గుర్తు [a] ప్రధాన పాఠ్యంలో సంబంధిత నుడికారం వెంట ఉంచబడింది.
