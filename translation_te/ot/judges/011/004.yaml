  text: After some time[a], the Ammonites fought against Israel.
translation:
  language: te
  text: కొంతకాలం గడిచిన తర్వాత[a], అమ్మోనీయులు ఇశ్రాయేలుతో యుద్ధం చేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూలో: ‘దినాల తరువాత జరిగింది’; ఇది కొంతకాలం గడిచిందని తెలిపే నుడికారం.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי מִיָּמִים
  choice: కొంతకాలం గడిచిన తర్వాత
  rationale: అక్షరార్థంగా ‘దినాలు గడిచిన తరువాత జరిగింది’ అనే నిర్మాణం ఇక్కడ కాలం గడిచిందని తెలిపే హీబ్రూ నుడికారం. ఆధునిక తెలుగులో సహజంగా కాలవ్యవధిని తెలియజేయడానికి ఈ రూపం ఎంచుకోబడింది.
- source_word: וַיִּלָּחֲמוּ
  choice: యుద్ధం చేశారు
  rationale: לחם ధాతువు యొక్క ఈ రూపం యుద్ధంలో తలపడడాన్ని సూచిస్తుంది. ‘యుద్ధం చేశారు’ అనేది సందర్భానికి తగిన సహజమైన తెలుగు ప్రయోగం.
- source_word: בְּנֵי עַמּוֹן
  choice: అమ్మోనీయులు
  rationale: అక్షరార్థంగా ‘అమ్మోను కుమారులు’ అయినా, ఇక్కడ అది అమ్మోను ప్రజలను సూచించే జాతినామం. ‘అమ్మోనీయులు’ ప్రామాణికమైన, సహజమైన తెలుగు రూపం.
- source_word: עִם יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులతో
  rationale: עִם ప్రాథమికంగా ‘తో’ అని అర్థమైనా, לחם అనే యుద్ధక్రియతో కలిసి వచ్చినప్పుడు ప్రత్యర్థిని సూచిస్తుంది. తెలుగులో ‘ఇశ్రాయేలీయులతో యుద్ధం చేశారు’ అనే నిర్మాణమే ఆ విరోధ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన కథన శైలి వాడబడింది. మూలంలోని కాలసూచక నుడికారాన్ని సహజ తెలుగులో అందిస్తూ పాదసూచికలో దాని అక్షరార్థ నిర్మాణాన్ని పేర్కొనబడింది.
