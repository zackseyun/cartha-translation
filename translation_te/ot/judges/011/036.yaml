  revised_text: 'ఆమె అతనితో ఇలా అంది: “నా తండ్రీ, నీవు యాహ్వేకు నీ నోరు తెరిచావు[a]. నీ నోటి నుండి వెలువడిన దాని ప్రకారం నాకు చేయి. ఎందుకంటే యాహ్వే నీ కొరకు నీ శత్రువులపై, అమ్మోను కుమారులపై ప్రతీకారం తీర్చుకున్నాడు[b].”'
