source:
  edition: WLC
  text: וַ/תֹּ֣אמֶר אֵלָ֗י/ו אָבִ/י֙ פָּצִ֤יתָה אֶת פִּ֨י/ךָ֙ אֶל יְהוָ֔ה עֲשֵׂ֣ה לִ֔/י כַּ/אֲשֶׁ֖ר יָצָ֣א מִ/פִּ֑י/ךָ אַחֲרֵ֡י אֲשֶׁ֣ר עָשָׂה֩ לְ/ךָ֙ יְהוָ֧ה נְקָמ֛וֹת מֵ/אֹיְבֶ֖י/ךָ מִ/בְּנֵ֥י עַמּֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/036.yaml
  text: And she said to him[a], “My father, you have opened your mouth to Yahweh; do to me according to what has gone out from your mouth, since Yahweh has taken vengeance for you on your enemies[b], on the sons of Ammon.”
translation:
  language: te
  text: 'ఆమె అతనితో ఇలా అంది: “నా తండ్రీ, నీవు యాహ్వేకు నీ నోరు తెరిచావు[a]. నీ నోటి నుండి వెలువడిన దాని ప్రకారం నాకు చేయి. ఎందుకంటే యాహ్వే నీ కొరకు నీ శత్రువులపై, అమ్మోను కుమారులపై ప్రతీకారం తీర్చుకున్నాడు[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “యాహ్వేకు నీ నోరు తెరిచావు” అనేది గంభీరంగా నోటితో మొక్కుబడి చేయడాన్ని సూచించే హీబ్రూ నుడికారం.
    reason: cultural_note
  - marker: b
    text: 'లేదా, “నీ శత్రువులైన అమ్మోనీయులపై.” హీబ్రూ అక్షరార్థం: “నీ శత్రువులపై, అమ్మోను కుమారులపై.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּצִיתָה אֶת־פִּיךָ
  choice: నీ నోరు తెరిచావు
  rationale: మూలంలోని స్పష్టమైన రూపకాన్ని నిలుపుతుంది. ఇది యాహ్వేకు గంభీరంగా పలికిన మొక్కుబడిని సూచించే హీబ్రూ నుడికారం; అర్థాన్ని పాదసూచిక వివరిస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా ఆధునిక తెలుగు లిప్యంతరీకరణలో అందిస్తుంది.
- source_word: עֲשֵׂה לִי
  choice: నాపట్ల చేయి
  rationale: తన విషయంలో అతడు పలికిన మాటను అమలు చేయమనే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తూ, అది ఏ విధంగా నెరవేరుతుందో ఈ వచనంలో నిర్ణయించదు.
- source_word: כַּאֲשֶׁר יָצָא מִפִּיךָ
  choice: నీ నోటినుంచి వెలువడిన మాట ప్రకారం
  rationale: నోటి నుంచి వెలువడినదనే మూలభాషా చిత్రాన్ని నిలుపుతూ, తెలుగులో భావం స్పష్టంగా ఉండేందుకు ‘మాట’ను వ్యక్తం చేస్తుంది.
- source_word: אַחֲרֵי אֲשֶׁר
  choice: ఎందుకంటే
  rationale: ఇక్కడ కేవలం కాలక్రమం కాకుండా, ఆమె అంగీకారానికి కారణాన్ని తెలిపే భావం ప్రధానంగా ఉంది.
- source_word: עָשָׂה לְךָ יְהוָה נְקָמוֹת
  choice: యాహ్వే నీ పక్షంగా ... ప్రతీకారం తీర్చుకున్నాడు
  rationale: లְךָ అనే ప్రయోజనార్థక భావాన్ని ‘నీ పక్షంగా’తో వ్యక్తం చేసి, נְקָמוֹת లోని ప్రతీకార చర్య భావాన్ని సహజమైన తెలుగు నుడిలో అందిస్తుంది.
- source_word: מֵאֹיְבֶיךָ מִבְּנֵי עַמּוֹן
  choice: నీ శత్రువులైన అమ్మోనీయులపై
  rationale: ‘నీ శత్రువులు’ మరియు ‘అమ్మోను కుమారులు’ ఒకే వర్గాన్ని సూచిస్తున్న అన్వయాన్ని సహజంగా చూపిస్తుంది; ‘అమ్మోను కుమారులు’ అనే అక్షరార్థం పాదసూచికలో ఇవ్వబడింది.
theological_decisions:
- issue: యెఫ్తా మొక్కుబడి కుమార్తె విషయంలో ఏ విధంగా నెరవేరిందనే వివాదం
  choice: ఆమె తన తండ్రి పలికిన మాటకు లోబడినట్లు మాత్రమే అనువదించి, మొక్కుబడి నెరవేర్పు స్వరూపాన్ని నిర్ణయించలేదు.
  alternative: ఆమె బలిగా మరణించడానికి అంగీకరించిందని లేదా జీవితాంతం కన్యగా ప్రతిష్ఠింపబడటానికి అంగీకరించిందని స్పష్టీకరించడం.
  rationale: ఈ వచనం ఆమె సమ్మతిని నమోదు చేస్తుంది గాని, మొక్కుబడి ఎలా నెరవేరిందో ఇక్కడ చెప్పదు. కాబట్టి మూలంలోని ఉద్దేశపూర్వక అనిశ్చితిని అనువాదం కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలిని ఉపయోగించాం. ‘నీ నోరు తెరిచావు’ మరియు ‘నీ నోటినుంచి వెలువడిన మాట’ అనే పరస్పర సంబంధిత మూలభాషా చిత్రాలను ఉద్దేశపూర్వకంగా నిలిపాం; వాక్యార్థం స్పష్టత కోసం పాదసూచికలు జోడించాం.
