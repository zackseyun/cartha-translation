- from: 'ఆమె అతనితో ఇలా అంది: “నా తండ్రీ, నీవు యాహ్వేకు నీ నోరు తెరిచావు[a]. నీ నోటినుంచి వెలువడిన మాట ప్రకారం నాపట్ల చేయి. ఎందుకంటే యాహ్వే నీ పక్షంగా నీ శత్రువులైన అమ్మోనీయులపై ప్రతీకారం తీర్చుకున్నాడు[b].”'
  to: 'ఆమె అతనితో ఇలా అంది: “నా తండ్రీ, నీవు యాహ్వేకు నీ నోరు తెరిచావు[a]. నీ నోటి నుండి వెలువడిన దాని ప్రకారం నాకు చేయి. ఎందుకంటే యాహ్వే నీ కొరకు నీ శత్రువులపై, అమ్మోను కుమారులపై ప్రతీకారం తీర్చుకున్నాడు[b].”'
  rationale: సవరణలు అర్థాన్ని మార్చవు. ‘నాకు చేయి’ అనేది తండ్రి పలికిన మాటను తన విషయంలో అమలు చేయమనే మూల భావాన్ని మరింత సహజంగా, ప్రత్యక్షంగా తెలియజేస్తుంది; అయితే ఆ అమలు స్వరూపాన్ని నిర్ణయించదు. చివరి పదబంధంలో హీబ్రూ సమాంతర నిర్మాణాన్ని ప్రధాన పాఠంలో నిలిపి, సులభమైన ‘అమ్మోనీయులు’ ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
