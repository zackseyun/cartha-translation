source:
  edition: WLC
  text: וַ/יִּבְרַ֤ח יִפְתָּח֙ מִ/פְּנֵ֣י אֶחָ֔י/ו וַ/יֵּ֖שֶׁב בְּ/אֶ֣רֶץ ט֑וֹב וַ/יִּֽתְלַקְּט֤וּ אֶל יִפְתָּח֙ אֲנָשִׁ֣ים רֵיקִ֔ים וַ/יֵּצְא֖וּ עִמּֽ/וֹ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/003.yaml
  text: So Jephthah fled from his brothers and lived in the land of Tob[a], and worthless men gathered around Jephthah and went out with him.
translation:
  language: te
  text: అప్పుడు యెఫ్తా తన సహోదరుల దగ్గరనుంచి పారిపోయి, తోబు దేశంలో నివసించాడు. పనికిమాలిన మనుషులు[a] యెఫ్తా దగ్గరికి చేరి, అతనితో బయలుదేరారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా ‘ఖాళీ మనుషులు’; ఈ హీబ్రూ నుడికారం కేవలం ఆస్తిలేని వారిని కాకుండా, తక్కువ నడవడి లేదా తక్కువ సామాజిక గౌరవం ఉన్న వారిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבְרַח
  choice: పారిపోయి
  rationale: ఈ క్రియ ప్రమాదం లేదా శత్రుత్వం కారణంగా తప్పించుకొని వెళ్లడాన్ని సూచిస్తుంది; ఆధునిక తెలుగు కథనంలో ‘పారిపోయి’ సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: מִפְּנֵי אֶחָיו
  choice: తన సహోదరుల దగ్గరనుంచి
  rationale: మూలంలోని ‘వారి సన్నిధినుంచి/ముఖం ఎదుటనుంచి’ అనే హీబ్రూ నుడికారాన్ని, సహోదరుల శత్రుత్వం నుంచి దూరమవడమనే సందర్భార్థంతో సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וַיֵּשֶׁב
  choice: నివసించాడు
  rationale: ישב ఇక్కడ ఒక ప్రాంతంలో ఉండి జీవించడాన్ని సూచిస్తుంది; ‘స్థిరపడ్డాడు’ అనేది శాశ్వతత్వాన్ని ఎక్కువగా సూచించవచ్చు కాబట్టి ‘నివసించాడు’ ఎంచుకున్నాం.
- source_word: בְּאֶרֶץ טוֹב
  choice: తోబు దేశంలో
  rationale: אֶרֶץ అంటే దేశం లేదా ప్రాంతం; తోబు స్థలనామం కావడంతో లిప్యంతరీకరించబడింది.
- source_word: וַיִּתְלַקְּטוּ אֶל יִפְתָּח
  choice: యెఫ్తా దగ్గరికి చేరి
  rationale: హిత్పయేల్ రూపం వారు కూడివచ్చిన భావాన్ని, אֶל యెఫ్తా వైపు వచ్చి అతనితో అనుబంధం ఏర్పరచుకున్న భావాన్ని ఇస్తాయి. ‘దగ్గరికి చేరి’ సహజంగా ఉండి మూలంలోని దిశను కాపాడుతుంది.
- source_word: אֲנָשִׁים רֵיקִים
  choice: పనికిమాలిన మనుషులు
  rationale: רֵיקִים అక్షరార్థంగా ‘ఖాళీ’ అయినా, ఈ నుడికారంలో తక్కువ నడవడి లేదా సామాజిక గౌరవం కలిగిన వారిని సూచిస్తుంది. ‘పనికిమాలిన’ ఆ ప్రతికూల అంచనాను తెలియజేస్తుంది; నిర్దిష్టంగా నేరస్థులని మాత్రం చెప్పదు.
- source_word: וַיֵּצְאוּ עִמּוֹ
  choice: అతనితో బయలుదేరేవారు
  rationale: మూలం వారి బయలుదేరుట యొక్క ఉద్దేశాన్ని చెప్పదు. హీబ్రూ వరుస కథనంలో పునరావృత లేదా అలవాటైన కార్యాన్ని సూచించే అవకాశం ఉన్నందున ‘బయలుదేరేవారు’ అనువైనది; ‘దాడులు చేసేవారు’ వంటి సందర్భానుమానాన్ని చేర్చలేదు.
