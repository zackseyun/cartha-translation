  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి పాటించబడింది. ‘యెఫ్తా’, ‘తోబు’ అనే రూపాలు హీబ్రూ పేర్లకు సమీపంగా ఉన్నాయి. చివరి క్రియ యొక్క ఉద్దేశాన్ని మూలం స్పష్టంచేయనందున దాడులు లేదా దోపిడీలు అని విపులీకరించలేదు.
