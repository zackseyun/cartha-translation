source:
  edition: WLC
  text: וַ/תֹּ֨אמֶר֙ אֶל אָבִ֔י/הָ יֵעָ֥שֶׂה לִּ֖/י הַ/דָּבָ֣ר הַ/זֶּ֑ה הַרְפֵּ֨ה מִמֶּ֜/נִּי שְׁנַ֣יִם חֳדָשִׁ֗ים וְ/אֵֽלְכָה֙ וְ/יָרַדְתִּ֣י עַל הֶֽ/הָרִ֔ים וְ/אֶבְכֶּה֙ עַל בְּתוּלַ֔/י אָנֹכִ֖י ו/רעית/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/037.yaml
  text: 'And she said to her father[a], “Let this thing be done for me: leave me alone for two months, that I may go and wander on the mountains and weep over my virginity[b], I and my companions.”'
translation:
  language: te
  text: 'ఆమె తన తండ్రితో ఇలా చెప్పింది: “నా కోసం ఈ మాటను అనుగ్రహించు: రెండు నెలలపాటు నన్ను విడిచిపెట్టు[a]. నేనూ నా స్నేహితురాళ్లూ కొండలలో తిరుగుతూ నా కన్యత్వం గురించి విలపించడానికి వెళ్లనివ్వు[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “రెండు నెలలపాటు వెళ్లడానికి నాకు అనుమతి ఇవ్వు.”
    reason: హీబ్రూలోని ప్రయోగం ఆమెను కొంతకాలం విడిచిపెట్టడం లేదా వెళ్లేందుకు అనుమతి ఇవ్వడం అనే భావాలను అనుమతిస్తుంది.
  - marker: b
    text: అక్షరార్థంగా, “నా కన్యత్వం మీద విలపించడానికి.” ఇక్కడ ఆమె అవివాహిత స్థితి, సంతానం లేకపోవడం ప్రధానంగా ఉన్నాయి; విస్తృత కథనాన్ని ఎలా అర్థం చేసుకోవాలనే ప్రశ్నను ఈ మాటలు తేల్చవు.
    reason: మూలపాఠంలోని కన్యత్వం గురించిన విలాపాన్ని నిలుపుతూ, విస్తృత కథనంలోని వ్యాఖ్యాన భేదాన్ని పరిష్కరించకుండా ఉంచుతుంది.
lexical_decisions:
- source_word: יֵעָשֶׂה לִּי הַדָּבָר הַזֶּה
  choice: నా కోసం ఈ పని చేయబడనివ్వు
  rationale: నిఫాల్ క్రియలోని అనుమతి/అభిలాష భావాన్ని, అలాగే ‘ఈ పని’ అనే హీబ్రూ నిర్దేశక వ్యక్తీకరణను నిలుపుతుంది.
- source_word: הַרְפֵּה מִמֶּנִּי שְׁנַיִם חֳדָשִׁים
  choice: రెండు నెలలపాటు నన్ను స్వేచ్ఛగా వెళ్లనివ్వు
  rationale: רפה מן అనే ప్రయోగం ఇక్కడ ఆమెకు కొంతకాలం స్వేచ్ఛనిచ్చి వెళ్లనివ్వమనే అభ్యర్థనను సూచిస్తుంది; ఆధునిక తెలుగులో ఇది సహజంగా ఉంటుంది.
- source_word: וְאֵלְכָה וְיָרַדְתִּי עַל הֶהָרִים
  choice: కొండల్లోకి వెళ్లి తిరుగుతూ
  rationale: రెండు హీబ్రూ క్రియల కదలిక భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది. అక్షరార్థమైన ‘వెళ్లి కొండల మీదికి దిగుతాను’ తెలుగులో అసహజంగా, స్థలార్థంలో అయోమయంగా ఉంటుంది.
- source_word: וְאֶבְכֶּה עַל בְּתוּלַי
  choice: నా కన్యత్వాన్ని గురించి ఏడుస్తాం
  rationale: בכה על లోని విలాప భావాన్నీ, בְּתוּלִים సూచించే అవివాహిత కన్య స్థితినీ వ్యాఖ్యానాత్మక విస్తరణ లేకుండా నిలుపుతుంది. కర్తలో స్నేహితురాళ్లు కూడా చేరడం వల్ల తెలుగులో సహజమైన బహువచన క్రియ వాడబడింది.
- source_word: אָנֹכִי וְרֵעוֹתָי
  choice: నేనూ నా స్నేహితురాళ్లూ
  rationale: స్త్రీలింగ బహువచన రూపాన్ని తెలుగులో స్పష్టంగా తెలియజేస్తూ, సాధారణ పాఠకులకు సహజమైన పదాన్ని ఉపయోగిస్తుంది.
theological_decisions:
- issue: యెఫ్తా కుమార్తె తన కన్యత్వం గురించి విలపించడం యొక్క అర్థం
  choice: వచనంలో ప్రత్యక్షంగా ఉన్న కన్యత్వం గురించిన విలాపాన్నే అనువదించడం
  alternative: ఆమె రాబోయే మరణం మరియు సంతానరాహిత్యం రెండింటి గురించి విలపించింది; లేదా జీవితాంతం కన్యగా అంకితమై ఉండబోతున్నందుకు మాత్రమే విలపించింది
  rationale: ఈ వచనం మరణాన్ని ప్రత్యక్షంగా పేర్కొనదు; కన్యత్వాన్ని ముందుకు తెస్తుంది. అందువల్ల విస్తృత కథనంలోని బలి/శాశ్వత కన్యత్వం వివాదాన్ని అనువాదం తేల్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభమైన వాక్యనిర్మాణం. మూలంలోని భావోద్వేగాన్ని నిలుపుతూ, అసహజమైన అక్షరానువాదాన్ని నివారించింది.
