source:
  edition: WLC
  text: וְ/יִפְתָּ֣ח הַ/גִּלְעָדִ֗י הָיָה֙ גִּבּ֣וֹר חַ֔יִל וְ/ה֖וּא בֶּן אִשָּׁ֣ה זוֹנָ֑ה וַ/יּ֥וֹלֶד גִּלְעָ֖ד אֶת יִפְתָּֽח־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/001.yaml
  text: Jephthah the Gileadite was a mighty warrior[a], and he was the son of a prostitute[c][b]; and Gilead fathered Jephthah.
translation:
  language: te
  text: గిలాదీయుడైన యెఫ్తా పరాక్రమశాలి యోధుడు[a]. అతడు ఒక వేశ్య కుమారుడు[b]. యెఫ్తాకు తండ్రైనవాడు గిలాదు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత పదక్షరంగా, “పరాక్రమవంతుడైన పురుషుడు.”
    reason: lexical_alternative
  - marker: b
    text: 'హీబ్రూ: “ఒక వేశ్య కుమారుడు.” పాత అనువాదాల్లో దీనికి పురాతన లేదా మరింత కఠినమైన పదాలు కనిపించవచ్చు.'
    reason: lexical_alternative
  - marker: c
    text: ఇక్కడ గిలాదు అనేది కేవలం ప్రాంతం పేరు కాదు; యెఫ్తా తండ్రి వ్యక్తిగత పేరు.
    reason: cultural_note
lexical_decisions:
- source_word: הַגִּלְעָדִי
  choice: గిలాదీయుడైన
  rationale: ఈ ప్రాంతవాచక విశేషణం యెఫ్తాను గిలాదు ప్రాంతానికి చెందినవాడిగా గుర్తిస్తుంది; ఆధునిక తెలుగులో సహజంగా ఉండే రూపాన్ని ఎంచుకున్నాం.
- source_word: גִּבּוֹר חַיִל
  choice: పరాక్రమశాలి యోధుడు
  rationale: ఈ పదబంధం బలం, శౌర్యం, ముఖ్యంగా యుద్ధసామర్థ్యాన్ని సూచిస్తుంది; కథాసందర్భంలో ఈ అనువాదం సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: בֶּן אִשָּׁה זוֹנָה
  choice: ఒక వేశ్య కుమారుడు
  rationale: זוֹנָה అనే పదానికి ఉన్న సూటి సామాజిక, వృత్తిపరమైన అర్థాన్ని తగ్గించకుండా, నేటి తెలుగులో స్పష్టంగా అనువదించాం.
- source_word: וַיּוֹלֶד
  choice: తండ్రి
  rationale: హిఫిల్ రూపం ఇక్కడ జీవసంబంధమైన పితృత్వాన్ని తెలియజేస్తుంది. 'గిలాదు యెఫ్తాకు తండ్రి' అనేది తెలుగులో సహజంగా ఉండి ఆ భావాన్ని కాపాడుతుంది.
- source_word: גִּלְעָד
  choice: గిలాదు
  rationale: ఇక్కడ ఈ పేరు క్రియకు కర్తగా ఉండి ప్రాంతాన్ని కాక యెఫ్తా తండ్రి పేరుగల వ్యక్తిని సూచిస్తుంది.
- source_word: וְ
  choice: వాక్య నిర్మాణంలో సహజ అనుసంధానం
  rationale: ప్రారంభ వావ్ కథన అనుసంధానాన్ని సూచిస్తుంది; తెలుగులో కృత్రిమమైన ప్రారంభ 'మరియు' చేర్చకుండా వాక్యప్రవాహం ద్వారా దాన్ని వ్యక్తం చేశాం.
