translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన కథనశైలి ఉపయోగించబడింది. మూలంలోని వరుస సమన్వయ వాక్యాలను తెలుగులో సహజమైన చిన్న వాక్యాలుగా మలిచాం; భావసంబంధం, పితృత్వ సూచన యథాతథంగా ఉన్నాయి. అన్ని పాదటిప్పణి గుర్తులు ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
