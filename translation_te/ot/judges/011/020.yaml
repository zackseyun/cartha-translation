translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. మూలంలోని 'ప్రజలందరినీ' అనే విస్తృత పదాన్ని అలాగే ఉంచి, సందర్భం ఆధారంగా 'సైన్యం' అని సంకుచితం చేయలేదు. 'ఇశ్రాయేలుతో యుద్ధం చేశాడు' అనే రూపం హీబ్రూ עִם నిర్మాణాన్ని నిలుపుతూ తెలుగులో స్పష్టమైన విరోధార్థాన్ని ఇస్తుంది.
