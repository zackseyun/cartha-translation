  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/לֹא הֶאֱמִ֨ין סִיח֤וֹן אֶת יִשְׂרָאֵל֙ עֲבֹ֣ר בִּ/גְבֻל֔/וֹ וַ/יֶּאֱסֹ֤ף סִיחוֹן֙ אֶת כָּל עַמּ֔/וֹ וַֽ/יַּחֲנ֖וּ בְּ/יָ֑הְצָ/ה וַ/יִּלָּ֖חֶם עִם יִשְׂרָאֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/020.yaml
  text: But Sihon did not trust Israel to pass through his territory[a]. So Sihon gathered all his people, and they camped at Jahaz[c][b], and he fought against Israel.
translation:
  language: te
  text: కాని ఇశ్రాయేలీయులు తన దేశం గుండా వెళ్లడానికి సీహోను వారిని నమ్మలేదు[a]. కాబట్టి సీహోను తన ప్రజలందరినీ సమకూర్చాడు; వారు యాహసులో మకాం వేశారు, అతడు ఇశ్రాయేలుతో యుద్ధం చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఇశ్రాయేలును నమ్మలేదు”; సందర్భార్థంగా, “ఇశ్రాయేలీయులు తన దేశం గుండా వెళ్లేంతగా వారిని విశ్వసించలేదు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶאֱמִין
  choice: వారిని నమ్మలేదు
  rationale: హిఫిల్ రూపం ఇక్కడ ఒకరిపై నమ్మకం ఉంచడాన్ని సూచిస్తుంది. సీహోను ఇశ్రాయేలీయులు తన దేశం గుండా వెళ్లే విషయంలో వారిని విశ్వసించలేదనే భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: עֲבֹר בִּגְבֻלוֹ
  choice: తన దేశం గుండా వెళ్లడానికి
  rationale: עֲבֹר అనేది దాటిపోవడం లేదా గుండా వెళ్లడం; גְּבוּל ఇక్కడ కేవలం సరిహద్దు రేఖకన్నా అతని అధీనంలోని భూభాగాన్ని సూచిస్తుంది. అందువల్ల 'దేశం గుండా వెళ్లడానికి' సందర్భానికి సహజంగా సరిపోతుంది.
- source_word: וַיֶּאֱסֹף
  choice: సమకూర్చాడు
  rationale: ఆసఫ్ ఇక్కడ ప్రజలను, సందర్భానుసారం యుద్ధం కోసం, ఒకచోట చేర్చడాన్ని సూచిస్తుంది. 'సమకూర్చాడు' మూలంలోని విస్తృత అర్థాన్ని నిలుపుతుంది.
- source_word: כָּל עַמּוֹ
  choice: తన ప్రజలందరినీ
  rationale: హీబ్రూ స్పష్టంగా 'అతని ప్రజలందరినీ' అంటుంది; సందర్భం సైనికమైనప్పటికీ 'సైన్యమంతటినీ' అని పరిమితం చేయలేదు.
- source_word: וַיַּחֲנוּ
  choice: వారు ... మకాం వేసి
  rationale: క్రియ బహువచనంలో ఉండి, సమకూర్చబడిన ప్రజలను కర్తగా సూచిస్తుంది. 'మకాం వేశారు' ఆధునిక తెలుగులో సహజం; వాక్యప్రవాహం కోసం సంయోజక రూపం వాడబడింది.
- source_word: בְּיָהְצָה
  choice: యాహసులో
  rationale: యָהְצָה స్థలనామాన్ని తెలుగులో 'యాహసు'గా లిప్యంతరీకరించి, స్థలార్థక విభక్తితో అందించబడింది.
- source_word: וַיִּלָּחֶם עִם יִשְׂרָאֵל
  choice: అతడు ఇశ్రాయేలుతో యుద్ధం చేశాడు
  rationale: ఏకవచన క్రియతో కర్త మళ్లీ సీహోను. עִם అక్షరార్థంగా 'తో'; యుద్ధ సందర్భంలో తెలుగు 'ఇశ్రాయేలుతో యుద్ధం చేశాడు' సహజంగానే విరోధార్థాన్ని తెలియజేస్తూ మూల నిర్మాణాన్ని కాపాడుతుంది.
