id: JDG.11.32
reference: Judges 11:32
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּעֲבֹ֥ר יִפְתָּ֛ח אֶל בְּנֵ֥י עַמּ֖וֹן לְ/הִלָּ֣חֶם בָּ֑/ם וַ/יִתְּנֵ֥/ם יְהוָ֖ה בְּ/יָדֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/032.yaml
  text: So Jephthah crossed over to the Ammonites to fight against them[a], and Yahweh gave them into his hand.
translation:
  language: te
  text: యెఫ్తా అమ్మోనీయుల వద్దకు దాటి వెళ్లాడు[a], వారితో యుద్ధం చేయడానికి. యాహ్వే వారిని అతని చేతికి అప్పగించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “అమ్మోను కుమారుల వద్దకు దాటి వెళ్లాడు.” ఈ మాట యెఫ్తా అమ్మోనీయులపై యుద్ధం చేయడానికి వారి వద్దకు వెళ్లాడని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: దాటివెళ్లాడు
  rationale: עבר అనే క్రియకు ప్రాథమికంగా ‘దాటడం, అవతలికి వెళ్లడం’ అనే అర్థం ఉంది. సైనిక సందర్భాన్ని అనవసరంగా క్రియలోనే చేర్చకుండా, కథనంలోని కదలికను ఈ పదం నిలుపుతుంది.
- source_word: אֶל בְּנֵי עַמּוֹן
  choice: అమ్మోనీయుల దగ్గరికి
  rationale: אֶל సాధారణంగా ‘వైపు/దగ్గరికి’ అని, בְּנֵי עַמּוֹן జాతివాచకంగా ‘అమ్మోనీయులు’ అని అర్థమిస్తుంది. తరువాతి పదబంధమే యుద్ధ ఉద్దేశాన్ని స్పష్టం చేస్తుంది.
- source_word: לְהִלָּחֶם בָּם
  choice: వారితో యుద్ధం చేయడానికి
  rationale: לחם నిఫాల్ రూపం, בְּ ఉపసర్గతో కలిసి, ఎదుటివారితో యుద్ధంలో తలపడడాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘వారితో యుద్ధం చేయడానికి’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: וַיִּתְּנֵם
  choice: వారిని ... అప్పగించాడు
  rationale: נתן + ‘చేతిలోకి/చేతికి’ అనే హీబ్రూ యుద్ధప్రయోగం శత్రువులను ఒకరి అధికారానికి లోబరచడాన్ని సూచిస్తుంది. తెలుగులో ‘చేతికి అప్పగించాడు’ మూలభావాన్నీ రూపకాన్నీ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా పరిచయమైన నామరూపం ‘యెహోవా’గా లిప్యంతరీకరించాం.
- source_word: בְּיָדוֹ
  choice: అతని చేతికి
  rationale: ‘చేతిలో/చేతికి ఇవ్వడం’ అనే హీబ్రూ రూపకం విజయాన్నీ ఆధీనాన్నీ సూచిస్తుంది. ‘అతని చేతికి’ మూలచిత్రాన్ని నిలుపుతూ తెలుగులో సహజంగా ఉంటుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దానిని ‘ప్రభువు’ వంటి బిరుదుగా మార్చకుండా నామంగానే ఉంచాం; ఆధునిక తెలుగు బైబిలు పాఠకులకు బాగా పరిచయమైన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. ‘దాటివెళ్లాడు’ మూలంలోని కదలికను నిలుపుతుంది; ‘చేతికి అప్పగించాడు’ హీబ్రూ యుద్ధరూపకాన్ని తెలుగులో అర్థవంతంగా కాపాడుతుంది.
