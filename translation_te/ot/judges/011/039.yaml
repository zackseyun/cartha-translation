source:
  edition: WLC
  text: וַ/יְהִ֞י מִ/קֵּ֣ץ שְׁנַ֣יִם חֳדָשִׁ֗ים וַ/תָּ֨שָׁב֙ אֶל אָבִ֔י/הָ וַ/יַּ֣עַשׂ לָ֔/הּ אֶת נִדְר֖/וֹ אֲשֶׁ֣ר נָדָ֑ר וְ/הִיא֙ לֹא יָדְעָ֣ה אִ֔ישׁ וַ/תְּהִי חֹ֖ק בְּ/יִשְׂרָאֵֽל׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/039.yaml
  text: 'And at the end of two months she returned to her father[a], and he did to her according to his vow that he had vowed. Now she had not known a man[b]. And it became a statute in Israel:'
translation:
  language: te
  text: 'రెండు నెలలు ముగిసినప్పుడు ఆమె తన తండ్రి దగ్గరకు తిరిగి వచ్చింది. అతడు ఆమె విషయంలో తాను మొక్కుకున్న మొక్కుబడి ప్రకారం చేశాడు[a]. ఆమె ఏ పురుషుణ్ణీ ఎరుగలేదు[b]. అది ఇశ్రాయేలులో ఒక ఆచారంగా ఏర్పడింది:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరొక విధంగా: “తాను చేసిన మొక్కుబడిని ఆమె విషయంలో అమలు చేశాడు.” దీని అర్థం యెఫ్తా ఆమెను బలిగా అర్పించాడా, లేక జీవితాంతం కన్యగా ఉండేందుకు అంకితం చేశాడా అనే విషయంలో వ్యాఖ్యాతలకు భిన్నాభిప్రాయాలు ఉన్నాయి. ఇక్కడి హెబ్రీ మాటలు ఈ ప్రశ్నను స్పష్టంగా తేల్చవు.'
    reason: alternative_reading
  - marker: b
    text: అక్షరార్థంగా, “ఆమె పురుషుణ్ణి ఎరుగలేదు.” ఇది ఆమె ఏ పురుషునితోనూ లైంగిక సంబంధం కలిగి ఉండలేదని తెలిపే హెబ్రీ నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקֵּץ שְׁנַיִם חֳדָשִׁים
  choice: రెండు నెలలు ముగిసినప్పుడు
  rationale: מִקֵּץ కాలవ్యవధి ముగింపును సూచిస్తుంది. ఈ అనువాదం ‘రెండు నెలల తర్వాత’ అన్నదానికంటే ఆ కాలపు ముగింపు సరిహద్దును స్పష్టంగా నిలుపుతుంది.
- source_word: וַתָּשָׁב אֶל אָבִיהָ
  choice: ఆమె తన తండ్రి దగ్గరకు తిరిగి వచ్చింది
  rationale: שׁוּב అనే క్రియకు ఈ కథన సందర్భంలో సహజమైన అర్థం ‘తిరిగి రావడం.’ హెబ్రీ పాఠంలో గమ్యంగా ‘ఆమె తండ్రి’ స్పష్టంగా ఉన్నందున ‘ఇంటికి’ అని సాధారణీకరించలేదు.
- source_word: וַיַּעַשׂ לָהּ אֶת נִדְרוֹ אֲשֶׁר נָדָר
  choice: అతడు తాను చేసిన మొక్కుబడి ప్రకారం ఆమెకు చేశాడు
  rationale: మూలంలోని ‘తాను మొక్కుకున్న మొక్కుబడిని ఆమెకు చేశాడు’ అనే కఠినమైన, పునరుక్తితో కూడిన నిర్మాణాన్ని సాధ్యమైనంతవరకు నిలిపి, తెలుగులో చదవదగినట్లుగా ‘ప్రకారం’ చేర్చబడింది. ‘నెరవేర్చాడు’ మాత్రమే అనడం לָהּ యొక్క ప్రత్యక్షతను తగ్గించవచ్చు.
- source_word: וְהִיא לֹא יָדְעָה אִישׁ
  choice: ఆమె ఏ పురుషుణ్ణీ ఎరుగలేదు
  rationale: יָדַע אִישׁ అనే హెబ్రీ నుడికారం లైంగిక సంబంధాన్ని సూచిస్తుంది. ‘కన్య’ అని వ్యాఖ్యానాత్మకంగా కుదించకుండా మూలంలోని నుడికారాన్ని తెలుగులో నిలిపి, అర్థాన్ని పాదసూచికలో వివరించాం.
- source_word: וַתְּהִי חֹק בְּיִשְׂרָאֵל
  choice: అది ఇశ్రాయేలులో ఒక ఆచారంగా ఏర్పడింది
  rationale: తరువాతి వచనంలో చెప్పబడే వార్షిక సామూహిక పాటింపుకు ఈ వాక్యం పరిచయంగా ఉంది. అందువల్ల חֹק ను ఇక్కడ అధికారిక ‘చట్టం’ కంటే సందర్భోచితమైన ‘ఆచారం’గా అనువదించాం; וַתְּהִי సూచించే ఆరంభాన్ని ‘ఏర్పడింది’ తెలియజేస్తుంది.
theological_decisions:
- issue: యెఫ్తా తన మొక్కుబడిని నెరవేర్చిన విధానం
  choice: అతడు మొక్కుబడి ప్రకారం ‘ఆమెకు చేశాడు’ అనే మూలంలోని ప్రత్యక్షమైనప్పటికీ నిర్ణయాత్మకంగా వివరించని మాటనే ప్రధాన పాఠంలో నిలిపాం.
  alternative: అతడు ఆమెను దహనబలిగా అర్పించాడు; లేదా ఆమెను జీవితాంతం కన్యగా ఉండేలా అంకితం చేశాడు.
  rationale: ఈ వచనం అతడు ‘తన మొక్కుబడి ప్రకారం ఆమెకు చేశాడు’ అని మాత్రమే చెబుతుంది; వెంటనే ఆమె పురుషుణ్ణి ఎరుగలేదని పేర్కొంటుంది. ఈ మాటలు ఏ వివరణను ఉద్దేశిస్తున్నాయనే విషయంలో దీర్ఘకాలంగా భిన్నాభిప్రాయాలు ఉన్నాయి. అందువల్ల ప్రధాన పాఠం ఆ వివాదాన్ని తేల్చకుండా హెబ్రీ పాఠంలోని ఉద్రిక్తతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గంభీరంగా అనువదించబడింది. ‘మొక్కుబడి,’ ‘ఎరుగలేదు,’ ‘ఆచారం’ వంటి పదాలు మూలంలోని మతపరమైన సందర్భం, నుడికారం, సామూహిక పాటింపు అనే భావాలను నిలుపుతూనే సాధారణ పాఠకులకు అర్థమయ్యేలా ఎంపికయ్యాయి.
