  to: 'రెండు నెలలు ముగిసినప్పుడు ఆమె తన తండ్రి దగ్గరకు తిరిగి వచ్చింది. అతడు ఆమె విషయంలో తాను మొక్కుకున్న మొక్కుబడి ప్రకారం చేశాడు[a]. ఆమె ఏ పురుషుణ్ణీ ఎరుగలేదు[b]. అది ఇశ్రాయేలులో ఒక ఆచారంగా ఏర్పడింది:'
  rationale: ప్రధాన పాఠంలో ఒక చిన్న శైలీ సవరణ మాత్రమే అవసరం. ‘ఆమె విషయంలో’ అనే పదబంధం హెబ్రీ לָהּ ను తెలుగులో సహజంగా ప్రతిబింబిస్తుంది. ‘నెరవేర్చాడు’ లేదా ‘అమలు చేశాడు’ అని ప్రధాన పాఠంలో పెట్టకుండా ‘చేశాడు’ అని ఉంచడం ద్వారా, యెఫ్తా తన కుమార్తెను బలి అర్పించాడా లేక జీవితాంత కన్యత్వానికి అంకితం చేశాడా అన్న చారిత్రక వ్యాఖ్యాన వివాదాన్ని పాఠం తేల్చకుండా ఉంచుతుంది.
