id: JDG.11.31
reference: Judges 11:31
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הָיָ֣ה הַ/יּוֹצֵ֗א אֲשֶׁ֨ר יֵצֵ֜א מִ/דַּלְתֵ֤י בֵיתִ/י֙ לִ/קְרָאתִ֔/י בְּ/שׁוּבִ֥/י בְ/שָׁל֖וֹם מִ/בְּנֵ֣י עַמּ֑וֹן וְ/הָיָה֙ לַֽ/יהוָ֔ה וְ/הַעֲלִיתִ֖/הוּ עוֹלָֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/031.yaml
  text: then whatever comes out from the doors of my house to meet me when I return in peace from the Ammonites shall be Yahweh’s[a], and I will offer it up as a burnt offering.
translation:
  language: te
  text: అప్పుడు, అమ్మోనీయుల నుండి నేను క్షేమంగా తిరిగి వచ్చినప్పుడు, నన్ను కలవడానికి నా ఇంటి తలుపుల నుండి బయటికి వచ్చేది ఏదైనా యెహోవాకు చెందుతుంది[a], మరియు దానిని నేను దహనబలిగా అర్పిస్తాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యెహోవాకు చెందుతుంది, లేదా దానిని నేను దహనబలిగా అర్పిస్తాను.” ఇక్కడి హీబ్రూ సంయోజక పదాన్ని కొందరు వియోజకార్థంలో తీసుకుంటారు; అలా అయితే యెఫ్తాను కలవడానికి బయటికి వచ్చేది ఏదో బట్టి రెండు వేర్వేరు పరిణామాలు ఉంటాయి.
    reason: alternative_reading
lexical_decisions:
- source_word: הַיּוֹצֵא אֲשֶׁר יֵצֵא
  choice: బయటికి వచ్చేది ఏదైనా
  rationale: హీబ్రూ పదబంధం వ్యక్తినైనా జంతువునైనా సూచించగల వ్యాకరణాత్మక అస్పష్టతను కలిగి ఉంది. ‘ఎవరైనా’ అని అనువదిస్తే మనిషికే పరిమితం చేసినట్లవుతుంది; ‘ఏదైనా’ ఆ అస్పష్టతను కాపాడుతుంది.
- source_word: מִדַּלְתֵי בֵיתִי
  choice: నా ఇంటి తలుపుల నుంచి
  rationale: דַּלְתֵי అనే బహువచన రూపాన్ని సన్నిహితంగా అనుసరిస్తూ, ఇంటి లోపలినుంచి బయటికి రావడాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: לִקְרָאתִי
  choice: నన్ను కలవడానికి
  rationale: ఎదురుగా వచ్చి కలుసుకోవడం అనే గమనార్థాన్ని సహజంగా వ్యక్తం చేస్తుంది; ‘స్వాగతించడానికి’ కంటే మూలంలోని విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: בְּשׁוּבִי בְשָׁלוֹם
  choice: నేను క్షేమంగా తిరిగి వచ్చినప్పుడు
  rationale: בְשָׁלוֹם ఇక్కడ యుద్ధం నుంచి సురక్షితంగా, క్షేమంగా తిరిగి రావడాన్ని సూచిస్తుంది. ఈ సందర్భంలో ‘క్షేమంగా’ ఆధునిక తెలుగులో సహజం.
- source_word: מִבְּנֵי עַמּוֹן
  choice: అమ్మోనీయుల దగ్గరనుంచి
  rationale: ‘అమ్మోను కుమారులు’ అనే అక్షరార్థానికి బదులుగా ప్రామాణిక ప్రజానామాన్ని వాడి, వారితో జరిగిన యుద్ధం నుంచి తిరిగి రావడం అనే సందర్భాన్ని వ్యక్తం చేస్తుంది.
- source_word: וְהָיָה לַיהוָה
  choice: యెహోవాదే అవుతుంది
  rationale: యెహోవాకు చెందినదిగా ఉండడం లేదా ఆయనకు ప్రతిష్ఠితం కావడం అనే భావాన్ని, తరువాతి వివాదాస్పద వాక్యభాగాన్ని ముందుగానే పరిష్కరించకుండా నిలుపుతుంది.
- source_word: לַיהוָה
  choice: యెహోవా
  rationale: దైవనామమైన יהוה ను వ్యక్తినామంగా స్పష్టంగా, గౌరవప్రదంగా ప్రతిబింబిస్తుంది.
- source_word: וְהַעֲלִיתִהוּ עוֹלָה
  choice: దానిని నేను దహనబలిగా అర్పిస్తాను
  rationale: హిఫిల్ రూపంలోని עלה మరియు עוֹלָה కలయిక బలిని ‘దహనబలిగా అర్పించడం’ అనే సాధారణ బలిపదబంధం. పుంలింగ ఏకవచన ప్రత్యయం ముందున్న అస్పష్ట సూచ్యాన్ని అనుసరించేలా తెలుగులో ‘దానిని’గా ఇచ్చింది.
theological_decisions:
- issue: ప్రతిజ్ఞలో ఒకే పరిణామమా (‘యెహోవాదే అవుతుంది, మరియు దహనబలిగా అర్పిస్తాను’) లేక రెండు ప్రత్యామ్నాయాలా (‘యెహోవాదే అవుతుంది, లేదా దహనబలిగా అర్పిస్తాను’) అన్నది.
  choice: ప్రధాన పాఠంలో సంయోజక భావంతో ఒకే పరిణామం.
  alternative: వచ్చేది ఏదో బట్టి యెహోవాకు ప్రతిష్ఠించడం లేదా దహనబలిగా అర్పించడం అనే రెండు ప్రత్యామ్నాయాలు.
  rationale: ו సాధారణంగా ‘మరియు’ అనే సంయోజకార్థాన్నే ఇస్తుంది; అందువల్ల ప్రధాన పాఠం ఒకే ప్రతిజ్ఞగా సహజంగా చదవబడుతుంది. అయితే ఇక్కడ వియోజకార్థం సాధ్యమని కొందరు భావించే కారణంగా, ఆ పఠనాన్ని పాదసూచికలో ఉంచి వచనంలోని వ్యాఖ్యాన ఉద్రిక్తతను కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘బయటికి వచ్చేది ఏదైనా’ అనే నిర్మాణం వ్యక్తి/జంతువు అనే మూలపాఠ అస్పష్టతను ఉద్దేశపూర్వకంగా నిలుపుతుంది. ప్రధాన పాఠంలో హీబ్రూ ו యొక్క సాధారణ సంయోజకార్థం స్వీకరించబడింది; ప్రత్యామ్నాయ వియోజక పఠనం పాదసూచికలో ఇవ్వబడింది.
