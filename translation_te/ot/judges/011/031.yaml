revisions:
- from: అప్పుడు అమ్మోనీయుల దగ్గరనుంచి నేను క్షేమంగా తిరిగి వచ్చినప్పుడు, నన్ను కలవడానికి నా ఇంటి తలుపుల నుంచి బయటికి వచ్చేది ఏదైనా యెహోవాదే అవుతుంది[a]; దానిని నేను దహనబలిగా అర్పిస్తాను.
  to: అప్పుడు, అమ్మోనీయుల నుండి నేను క్షేమంగా తిరిగి వచ్చినప్పుడు, నన్ను కలవడానికి నా ఇంటి తలుపుల నుండి బయటికి వచ్చేది ఏదైనా యెహోవాకు చెందుతుంది[a], మరియు దానిని నేను దహనబలిగా అర్పిస్తాను.
  rationale: The revision explicitly represents the source’s normal conjunctive reading with “మరియు,” while retaining the disputed disjunctive reading in the anchored footnote. It also makes two minor modern-standard Telugu improvements without changing the verse’s ambiguity or theological tension.
