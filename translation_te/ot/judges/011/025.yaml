source:
  edition: WLC
  text: וְ/עַתָּ֗ה הֲ/ט֥וֹב טוֹב֙ אַתָּ֔ה מִ/בָּלָ֥ק בֶּן צִפּ֖וֹר מֶ֣לֶךְ מוֹאָ֑ב הֲ/ר֥וֹב רָב֙ עִם יִשְׂרָאֵ֔ל אִם נִלְחֹ֥ם נִלְחַ֖ם בָּֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/025.yaml
  text: And now[a], are you really better than Balak son of Zippor, king of Moab? Did he ever contend with Israel[b], or did he ever fight against them?
translation:
  language: te
  text: ఇప్పుడు మరి[a] నువ్వు మోయాబు రాజైన సిప్పోరు కుమారుడు బాలాకు కంటే నిజంగా మిన్నవాడివా? అతడు ఇశ్రాయేలుతో ఎన్నడైనా వివాదపడ్డాడా[b], లేదా వారిపై ఎన్నడైనా యుద్ధం చేశాడా?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అయితే నువ్వు మోయాబు రాజైన సిప్పోరు కుమారుడు బాలాకు కంటే ఏమైనా మిన్నవాడివా?” హీబ్రూలో ‘మంచి/మిన్న’ అనే పదం ఉద్ఘాటన కోసం పునరుక్తమైంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “అతడు ఇశ్రాయేలుతో ఎన్నడైనా తగాదా పడ్డాడా, లేదా వారిపై ఎన్నడైనా యుద్ధం చేశాడా?” మొదటి క్రియ న్యాయపరమైన వివాదాన్ని లేదా తగాదాను సూచించవచ్చు; రెండవది ప్రత్యేకంగా పోరాటాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: ఇప్పుడు
  rationale: వాదనలో తదుపరి అలంకారిక ప్రశ్నకు మార్పును సూచించే సహజమైన ఆధునిక తెలుగు ప్రయోగం; సందర్భమే సంధాన భావాన్ని తెలియజేస్తుంది.
- source_word: הֲטוֹב טוֹב אַתָּה
  choice: నువ్వు ... కంటే నిజంగా గొప్పవాడివా?
  rationale: טוֹב పదపు ఉద్ఘాటనాత్మక పునరుక్తిని తెలుగులో ‘నిజంగా’తో వ్యక్తం చేసి, వ్యక్తుల మధ్య పోలికలో సహజమైన ‘గొప్పవాడివా’ను ఉపయోగించింది.
- source_word: מִבָּלָק בֶּן־צִפּוֹר מֶלֶךְ מוֹאָב
  choice: మోయాబు రాజైన సిప్పోరు కుమారుడు బాలాకు కంటే
  rationale: హీబ్రూ సంబంధాలను స్పష్టంగా ఉంచుతూ తెలుగు వాక్యక్రమానికి సహజంగా అమర్చింది; వ్యక్తి, ప్రాంత నామాలను తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించింది.
- source_word: הֲרֹב רָב
  choice: అతడు ... ఎన్నడైనా వివాదపడ్డాడా?
  rationale: ריב యొక్క వాదన, తగాదా లేదా హక్కు వివాదం అనే విస్తృత భావాన్ని ‘వివాదపడు’ కాపాడుతుంది; ఉద్ఘాటనాత్మక నిర్మాణాన్ని ‘ఎన్నడైనా’తో సహజంగా అందించింది.
- source_word: עִם יִשְׂרָאֵל
  choice: ఇశ్రాయేలుతో
  rationale: עִם యొక్క ప్రాథమిక ‘తో’ భావాన్ని నిలుపుతూ, తరువాతి యుద్ధ క్రియతో ఉన్న భావభేదాన్ని కాపాడింది.
- source_word: אִם
  choice: రెండవ ప్రశ్నగా అనుసంధానం
  rationale: ఇక్కడ אִם ప్రత్యామ్నాయ ప్రశ్నలో ‘లేదా’ భావం ఇస్తుంది. ఆధునిక తెలుగులో వరుసగా రెండు అలంకారిక ప్రశ్నలు సహజంగా ఉండటంతో భావాన్ని ప్రశ్నల సమాంతర నిర్మాణం ద్వారా తెలిపింది.
- source_word: נִלְחֹם נִלְחַם בָּם
  choice: వారితో ఎన్నడైనా యుద్ధం చేశాడా?
  rationale: לחם యొక్క నిర్దిష్ట సైనిక భావాన్ని ‘యుద్ధం చేశాడు’ స్పష్టంగా తెలియజేస్తుంది; హీబ్రూ ఉద్ఘాటనాత్మక పునరుక్తిని ‘ఎన్నడైనా’తో అందించింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైనప్పటికీ ప్రత్యక్షమైన వాదన శైలిని ఉపయోగించింది. యెఫ్తా అమ్మోనీయుల రాజును ఏకవచనంగా సంబోధిస్తున్నందున ‘నువ్వు’ను ఉంచింది. రెండు హీబ్రూ ఉద్ఘాటనాత్మక క్రియా నిర్మాణాలను పదేపదే అనుకరించకుండా ‘ఎన్నడైనా’తో సహజంగా వ్యక్తం చేసింది; ריב మరియు לחם మధ్యనున్న వివాదం–యుద్ధం భావభేదాన్ని కాపాడింది.
