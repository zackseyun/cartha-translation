revisions:
- from: ఇప్పుడు[a] నువ్వు మోయాబు రాజైన సిప్పోరు కుమారుడు బాలాకు కంటే నిజంగా గొప్పవాడివా? అతడు ఇశ్రాయేలుతో ఎన్నడైనా వివాదపడ్డాడా[b]? వారితో ఎన్నడైనా యుద్ధం చేశాడా?
