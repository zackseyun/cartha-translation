source:
  edition: WLC
  text: וְ/עַתָּ֞ה יְהוָ֣ה אֱלֹהֵ֣י יִשְׂרָאֵ֗ל הוֹרִישׁ֙ אֶת הָ֣/אֱמֹרִ֔י מִ/פְּנֵ֖י עַמּ֣/וֹ יִשְׂרָאֵ֑ל וְ/אַתָּ֖ה תִּירָשֶֽׁ/נּוּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/023.yaml
  text: And now Yahweh[a], the God of Israel, has dispossessed the Amorites from before his people Israel; and are you to possess it?
translation:
  language: te
  text: కాబట్టి ఇప్పుడు ఇశ్రాయేలు దేవుడైన యాహ్వే తన ప్రజలైన ఇశ్రాయేలు ఎదుటనుండి అమోరీయులను వెళ్లగొట్టాడు; మరి నీవు ఆ దేశాన్ని స్వాధీనం చేసుకుంటావా?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దానిని వారసత్వంగా పొందుతావా?” హీబ్రూ క్రియకు భూమిని వారసత్వంగా పొందడం లేదా స్వాధీనం చేసుకోవడం అనే భావాలు ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: కాబట్టి ఇప్పుడు
  rationale: ముందటి వాదన నుంచి యెఫ్తా తీసుకొస్తున్న ముగింపును సూచించే అనుసంధానాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే రూపంలో వ్యక్తిగత నామంగా ఉంచుతుంది.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు దేవుడైన
  rationale: యెహోవాను ఇశ్రాయేలు దేవునిగా గుర్తించే సమాస పదబంధాన్ని సహజమైన తెలుగు వాక్య నిర్మాణంలో నిలుపుతుంది.
- source_word: הוֹרִישׁ
  choice: వెళ్లగొట్టాడు
  rationale: హిఫిల్ రూపం ఇక్కడ అమోరీయులను భూస్వాధీన స్థితి నుంచి తొలగించడాన్ని సూచిస్తుంది; సాధారణ పాఠకులకు సహజంగా ఉండే ఈ పదం ఆ భావాన్ని సందర్భంలో అందిస్తుంది.
- source_word: הָאֱמֹרִי
  choice: అమోరీయులను
  rationale: హీబ్రూలో ఏకవచన జాతివాచకం సమూహార్థంలో ఉంది; తెలుగులో ప్రజాసమూహాన్ని బహువచనంగా ఇవ్వడం సహజం.
- source_word: מִפְּנֵי
  choice: ఎదుట నుండి
  rationale: తన ప్రజల సన్నిధి లేదా వారి ముందున్న ప్రాంతం నుంచి తొలగించడాన్ని తెలిపే హీబ్రూ స్థలవాచక నుడికారాన్ని దగ్గరగా నిలుపుతుంది.
- source_word: עַמּוֹ יִשְׂרָאֵל
  choice: తన ప్రజలైన ఇశ్రాయేలు
  rationale: ప్రజలు యెహోవాకు చెందినవారనే సర్వనామ భావాన్నీ, వారు ఇశ్రాయేలని తెలిపే సమానాధికార సంబంధాన్నీ స్పష్టంగా ఉంచుతుంది.
- source_word: וְאַתָּה
  choice: మరి నువ్వు
  rationale: స్వతంత్ర సర్వనామంలోని విరుద్ధాత్మక ఉద్ఘాటనను, ఎదుటివానిని సూటిగా ప్రశ్నించే ధోరణిని నిలుపుతుంది.
- source_word: תִּירָשֶׁנּוּ
  choice: వారి దేశాన్ని స్వాధీనం చేసుకుంటావా?
  rationale: క్రియ భూమిని పొందడం లేదా స్వాధీనం చేసుకోవడం అనే భావాన్ని ఇస్తుంది. ఏకవచన ప్రత్యయం ప్రజలను కాక వారి భూభాగాన్ని సూచిస్తుందని తెలుగులో స్పష్టం చేయడానికి ‘వారి దేశాన్ని’ వాడబడింది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలోని వ్యక్తిగత దైవనామాన్ని ‘ప్రభువు’ వంటి బిరుదుతో భర్తీ చేయకుండా నిలుపుతూ, ఆధునిక తెలుగు బైబిలు పాఠకులకు విస్తృతంగా పరిచయమైన లిప్యంతరీకరణను ఎంచుకుంది.
- issue: תִּירָשֶׁנּוּ యొక్క భూస్వాధీన భావం
  choice: వారి దేశాన్ని స్వాధీనం చేసుకుంటావా?
  alternative: దాన్ని వారసత్వంగా పొందుతావా?
  rationale: ఈ సందర్భంలో యుద్ధానంతర భూహక్కు ప్రధానంగా ఉంది. అయినా హీబ్రూ క్రియలో ‘వారసత్వంగా పొందడం’ అనే విస్తృత భావం ఉండగలదని పాదటిప్పణిలో నిలుపబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. యెఫ్తా పలికిన ప్రతివాదంలోని సూటితనం కోసం ‘నువ్వు’ ఉపయోగించబడింది; ప్రశ్న యొక్క వాక్ప్రశ్న స్వభావం నిలుపబడింది.
