source:
  edition: WLC
  text: כִּ֖י בַּ/עֲלוֹתָ֣/ם מִ/מִּצְרָ֑יִם וַ/יֵּ֨לֶךְ יִשְׂרָאֵ֤ל בַּ/מִּדְבָּר֙ עַד יַם ס֔וּף וַ/יָּבֹ֖א קָדֵֽשָׁ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/016.yaml
  text: For when they came up from Egypt[a], Israel went through the wilderness as far as the Red Sea and came to Kadesh.
translation:
  language: te
  text: ఎందుకంటే, వారు ఐగుప్తు నుండి బయలుదేరినప్పుడు, ఇశ్రాయేలు అరణ్యంలో ప్రయాణిస్తూ ఎర్ర సముద్రం[a] వరకు వెళ్లి, కాదేషుకు చేరుకుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘రెల్ల సముద్రం.’
    reason: יַם סוּף అనే పేరుకు సంప్రదాయ అనువాదం ‘ఎర్ర సముద్రం’; దాని పదార్థానికి దగ్గరైన ‘రెల్ల సముద్రం’ అనే సాధ్యమైన ప్రత్యామ్నాయాన్ని సంరక్షించడానికి.
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: యెఫ్తా వివరిస్తున్న చారిత్రక నేపథ్యానికి కారణసూచక అనుసంధానంగా ఉంది; తరువాతి కాలసూచక ఉపవాక్యాన్ని విడిగా స్పష్టంగా ఉంచుతుంది.
- source_word: בַּעֲלוֹתָם מִמִּצְרָיִם
  choice: వారు ఐగుప్తు నుండి బయలుదేరి వచ్చినప్పుడు
  rationale: ב + క్రియానామ రూపం కాలార్థాన్ని ఇస్తుంది. עלה యొక్క ‘పైకి రావడం’ అనే రూపకాన్ని తెలుగులో కృత్రిమంగా చేయకుండా, నిర్గమన సందర్భానికి సహజమైన ‘బయలుదేరి వచ్చినప్పుడు’గా ఇచ్చాం.
- source_word: וַיֵּלֶךְ יִשְׂרָאֵל בַּמִּדְבָּר
  choice: ఇశ్రాయేలు అరణ్యంలో ప్రయాణిస్తూ ... వెళ్లి
  rationale: הלך యొక్క సాధారణ గమనార్థాన్ని, בַּמִּדְבָּר సూచించే ప్రదేశంతో సహజ తెలుగు వాక్యనిర్మాణంలో వ్యక్తం చేస్తుంది. ‘ఇశ్రాయేలు’ ఇక్కడ సమూహవాచకమైనప్పటికీ వ్యాకరణపరంగా ఏకవచనంగా ఉంచాం.
- source_word: עַד יַם סוּף
  choice: ఎర్ర సముద్రం[a] వరకు
  rationale: עַד యొక్క హద్దు/అంత్యస్థాన భావాన్ని ‘వరకు’ కచ్చితంగా తెలియజేస్తుంది. יַם סוּף‌కు సంప్రదాయంగా పరిచితమైన ‘ఎర్ర సముద్రం’ను ప్రధాన పాఠ్యంలో ఉంచి, ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
- source_word: וַיָּבֹא קָדֵשָׁה
  choice: కాదేషుకు చేరుకుంది
  rationale: בוא యొక్క చేరిక భావాన్ని సహజమైన తెలుగులో ‘చేరుకుంది’గా ఇచ్చాం; కָדֵשָׁהలోని దిశాసూచక הను ‘కు’ ద్వారా వ్యక్తం చేశాం. మూలంలో లేని ‘కాదేషు-బర్నేయ’ను చేర్చలేదు.
