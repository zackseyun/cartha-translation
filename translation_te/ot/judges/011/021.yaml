id: JDG.11.21
reference: Judges 11:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ֠/יִּתֵּן יְהוָ֨ה אֱלֹהֵֽי יִשְׂרָאֵ֜ל אֶת סִיח֧וֹן וְ/אֶת כָּל עַמּ֛/וֹ בְּ/יַ֥ד יִשְׂרָאֵ֖ל וַ/יַּכּ֑וּ/ם וַ/יִּירַשׁ֙ יִשְׂרָאֵ֔ל אֵ֚ת כָּל אֶ֣רֶץ הָ/אֱמֹרִ֔י יוֹשֵׁ֖ב הָ/אָ֥רֶץ הַ/הִֽיא־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/021.yaml
  text: And Yahweh[a], the God of Israel, gave Sihon and all his people into the hand of Israel, and they struck them down. So Israel took possession of all the land of the Amorites who lived in that land.
translation:
  language: te
  text: ఇశ్రాయేలు దేవుడైన యాహ్వే సీహోనును, అతని ప్రజలందరినీ ఇశ్రాయేలు చేతికి[a] అప్పగించాడు. ఇశ్రాయేలీయులు వారిని ఓడించారు. అలా ఇశ్రాయేలు ఆ దేశంలో నివసించిన అమోరీయుల దేశమంతటినీ స్వాధీనం చేసుకుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ మూలంలో అక్షరార్థంగా, ‘ఇశ్రాయేలు చేతిలోకి’; అంటే ఇశ్రాయేలు అధికారానికి అప్పగించాడు.
    reason: హీబ్రూ జాతీయ ప్రయోగంలోని రూపకార్థాన్ని వివరిస్తుంది.
lexical_decisions:
- source_word: וַיִּתֵּן ... בְּיַד יִשְׂרָאֵל
  choice: ఇశ్రాయేలు చేతికి అప్పగించాడు
  rationale: נתן + בְּיַד అనే హీబ్రూ జాతీయం ఒకరి అధికారానికి అప్పగించడాన్ని సూచిస్తుంది. ‘చేతికి అప్పగించాడు’ మూలంలోని రూపకాన్ని, సైనిక సందర్భంలోని అర్థాన్ని రెండింటినీ సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ శాస్త్రీయ ఉచ్చారణకు అనుగుణంగా తెలుగులో లిప్యంతరీకరించింది.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు దేవుడు
  rationale: ఇది యాహ్వేను ఇశ్రాయేలు దేవునిగా గుర్తించే నిర్మాణ సంబంధ పదబంధానికి సూటి, సహజమైన తెలుగు రూపం.
- source_word: סִיחוֹן
  choice: సీహోను
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగు ధ్వన్యనుకరణ.
- source_word: כָּל עַמּוֹ
  choice: అతని ప్రజలందరూ
  rationale: עַם యొక్క సాధారణ అర్థం ‘ప్రజలు’; యుద్ధ సందర్భం ఉన్నప్పటికీ మూలపాఠం ‘సైన్యం’ అని ప్రత్యేకంగా చెప్పదు.
- source_word: וַיַּכּוּם
  choice: ఇశ్రాయేలీయులు వారిని ఓడించారు
  rationale: נכה యుద్ధ కథనంలో కొట్టి జయించడం లేదా నిర్ణాయకంగా ఓడించడం అనే భావాన్ని ఇస్తుంది. ‘ఓడించారు’ అనవసరంగా అందరూ చంపబడ్డారని నిర్ధారించకుండా ఫలితాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וַיִּירַשׁ
  choice: స్వాధీనం చేసుకుంది
  rationale: ירש ఇక్కడ విజయానంతరం భూభాగాన్ని ఆధీనంలోకి తీసుకోవడాన్ని సూచిస్తుంది; ‘స్వాధీనం చేసుకుంది’ ఆ భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: כָּל אֶרֶץ הָאֱמֹרִי
  choice: అమోరీయుల దేశమంతా
  rationale: హీబ్రూలో ఏకవచన సామూహిక జాతినామం ఉన్నా, ఆధునిక తెలుగులో బహువచన జాతిరూపం సహజంగా ఉంటుంది.
- source_word: יוֹשֵׁב הָאָרֶץ הַהִיא
  choice: ఆ దేశంలో నివసించిన
  rationale: ఈ కృదంత పదబంధం అమోరీయులను వారు నివసించిన ప్రాంతంతో వర్ణిస్తుంది; తెలుగు ఉపవాక్య రూపం సంబంధాన్ని స్పష్టంగా ఉంచుతుంది.
theological_decisions:
- issue: దైవనామం יהוה అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా / ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమే ఉంది. బిరుదైన ‘ప్రభువు’తో దాన్ని భర్తీ చేయకుండా, ‘Yahweh’కు అనుగుణమైన ‘యాహ్వే’ రూపాన్ని వాడటం మూలంలోని ప్రత్యేక నామాన్ని నిలుపుతుంది.
- issue: נכה క్రియలో మరణార్థం ఎంతవరకు స్పష్టం చేయాలి
  choice: ఓడించారు
  alternative: హతమార్చారు / కొట్టివేశారు
  rationale: యుద్ధ సందర్భంలో క్రియ నిర్ణాయక దెబ్బను సూచించినా, ఈ రూపం మాత్రమే ప్రతి వ్యక్తి మరణించాడని తప్పనిసరిగా నిర్ధారించదు. అందువల్ల ‘ఓడించారు’ మూలంలోని పరిధిని అతిగా సంకుచితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్య నిర్మాణం వాడబడింది. ‘చేతికి అప్పగించాడు’ అనే సహజ తెలుగు జాతీయంతో హీబ్రూ రూపకం నిలుపబడింది; దాని అర్థం పాదటిప్పణిలో వివరించబడింది.
