translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; దౌత్యపూర్వక ప్రకటనకు తగిన గౌరవప్రదమైన శైలి. మూలంలోని సర్వనామ సూచనను వివరణాత్మక పేర్లతో భర్తీ చేయలేదు. ‘బְּנֵי עַמּוֹן’ను తెలుగులో సహజమైన ‘అమ్మోనీయులు’గా అనువదించినందున ప్రత్యేక పాదటిప్పణి అవసరం లేదు.
