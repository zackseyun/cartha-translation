source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר ל֔/וֹ כֹּ֖ה אָמַ֣ר יִפְתָּ֑ח לֹֽא לָקַ֤ח יִשְׂרָאֵל֙ אֶת אֶ֣רֶץ מוֹאָ֔ב וְ/אֶת אֶ֖רֶץ בְּנֵ֥י עַמּֽוֹן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/015.yaml
  text: 'And he said to him[a], “Thus says Jephthah: Israel did not take the land of Moab or the land of the sons of Ammon.”'
translation:
  language: te
  text: 'అతడు అతనితో ఇలా అన్నాడు: “యెఫ్తా ఇలా అంటున్నాడు: ఇశ్రాయేలు మోయాబు దేశాన్నిగానీ, అమ్మోనీయుల[a] దేశాన్నిగానీ స్వాధీనం చేసుకోలేదు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, “అమ్మోను కుమారుల దేశం.” హీబ్రూలో: “అమ్మోను కుమారుల దేశం.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר לוֹ
  choice: అతడు అతనితో ఇలా అన్నాడు
  rationale: హీబ్రూ కథన క్రమాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; సర్వనామాల అస్పష్టతను మూలపాఠం ప్రకారమే నిలుపుతుంది.
- source_word: כֹּה אָמַר יִפְתָּח
  choice: యెఫ్తా చెప్పేది ఇదే
  rationale: దూత ద్వారా తెలియజేసే అధికారిక ప్రకటన సూత్రాన్ని సహజమైన, గౌరవప్రదమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: לֹא לָקַח
  choice: స్వాధీనం చేసుకోలేదు
  rationale: భూభాగాన్ని రాజకీయంగా లేదా సైనికంగా తీసుకోవడం అనే సందర్భార్థాన్ని స్పష్టంగా తెలియజేస్తుంది; అవసరానికి మించిన హింసాత్మక భావాన్ని చేర్చదు.
- source_word: אֶרֶץ
  choice: దేశం
  rationale: ఇక్కడ ప్రజల అధీనంలోని భూభాగాన్ని సూచించే సహజమైన తెలుగు పదం; హీబ్రూలోని పునరుక్త నిర్మాణాన్ని రెండుచోట్లా నిలుపుతుంది.
- source_word: מוֹאָב
  choice: మోయాబు
  rationale: పేరు యొక్క ప్రామాణిక తెలుగు లిప్యంతరీకరణ.
- source_word: בְּנֵי עַמּוֹן
  choice: అమ్మోనీయులు
  rationale: అక్షరార్థంగా ‘అమ్మోను కుమారులు’ అయిన ఈ హీబ్రూ జాతీయనామానికి ఆధునిక తెలుగులో సహజమైన సమూహవాచక రూపం.
