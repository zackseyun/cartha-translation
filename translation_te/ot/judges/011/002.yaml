id: JDG.11.2
reference: Judges 11:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/תֵּ֧לֶד אֵֽשֶׁת גִּלְעָ֛ד ל֖/וֹ בָּנִ֑ים וַ/יִּגְדְּל֨וּ בְֽנֵי הָ/אִשָּׁ֜ה וַ/יְגָרְשׁ֣וּ אֶת יִפְתָּ֗ח וַ/יֹּ֤אמְרוּ ל/וֹ֙ לֹֽא תִנְחַ֣ל בְּ/בֵית אָבִ֔י/נוּ כִּ֛י בֶּן אִשָּׁ֥ה אַחֶ֖רֶת אָֽתָּה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/002.yaml
  text: And Gilead’s wife bore him sons. When the sons of the wife grew up, they drove Jephthah out and said to him, “You will not have an inheritance in our father’s house, for you are the son of another woman.”
translation:
  language: te
  text: గిలాదు భార్య అతనికి కుమారులను కనింది. ఆ భార్య కుమారులు పెద్దవారైనప్పుడు, వారు యెఫ్తాను వెళ్లగొట్టి, అతనితో, “మా తండ్రి ఇంటిలో నీకు వారసత్వం ఉండదు; ఎందుకంటే నీవు వేరొక స్త్రీ కుమారుడివి” అన్నారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵשֶׁת גִּלְעָד
  choice: గిలాదు భార్య
  rationale: హీబ్రూ నిర్మాణాన్ని సహజమైన తెలుగులో నేరుగా వ్యక్తపరుస్తుంది.
- source_word: בְנֵי הָאִשָּׁה
  choice: ఆ భార్య కుమారులు
  rationale: మూలంలోని నిర్దిష్ట పదబంధమైన ‘the sons of the woman/wife’ను ‘అతని భార్య కుమారులు’గా మార్చకుండా నిలుపుతుంది; ముందున్న గిలాదు భార్యనే సూచిస్తుంది.
- source_word: וַיְגָרְשׁוּ
  choice: వెళ్లగొట్టి
  rationale: బలవంతంగా బయటకు పంపడం అనే భావాన్ని సహజంగా అందిస్తుంది.
- source_word: לֹא תִנְחַל בְּבֵית אָבִינוּ
  choice: మా తండ్రి ఇంటిలో నీకు స్వాస్థ్యం ఉండదు
  rationale: נחל క్రియలోని వారసత్వ భాగస్వామ్య భావాన్ని తెలుగులో స్పష్టంగా వ్యక్తపరుస్తూ, కేవలం చర్యకన్నా హక్కు నిరాకరణను చూపిస్తుంది.
- source_word: בֶּן אִשָּׁה אַחֶרֶת
  choice: వేరొక స్త్రీ కుమారుడివి
  rationale: యెఫ్తా తల్లి గురించి సోదరులు చూపిన భేదాన్ని మూలానికి దగ్గరగా, అదనపు వివరణ లేకుండా ఉంచుతుంది.
theological_decisions:
- issue: యెఫ్తా వారసత్వ హక్కు నిరాకరణ
  choice: ‘నీకు స్వాస్థ్యం ఉండదు’ అని హక్కు నిరాకరణగా అనువదించడం
  alternative: ‘నీవు స్వాస్థ్యాన్ని పొందవు’
  rationale: రెండూ సాధ్యమే; ఎంపిక చేసిన రూపం కుటుంబ గృహంలో అతనికి భాగం లేదని సోదరులు ప్రకటించిన న్యాయ-సామాజిక భావాన్ని సహజమైన తెలుగులో అందిస్తుంది, వారి వాదన న్యాయసమ్మతమని అనువాదం తేల్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కథనానికి తగిన గంభీరతతో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్య నిర్మాణం. వ్యక్తి పేరును ‘యెఫ్తా’, న్యాయ-కుటుంబ సంబంధ పదాన్ని ‘స్వాస్థ్యం’గా వాడాం.
