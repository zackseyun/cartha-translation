revisions:
- from: గిలాదుకు అతని భార్య కుమారులను కన్నది. ఆ భార్య కుమారులు పెద్దవారైనప్పుడు, వారు యెఫ్తాను వెళ్లగొట్టి, అతనితో, “మా తండ్రి ఇంటిలో నీకు స్వాస్థ్యం ఉండదు; ఎందుకంటే నీవు వేరొక స్త్రీ కుమారుడివి” అన్నారు.
  to: గిలాదు భార్య అతనికి కుమారులను కనింది. ఆ భార్య కుమారులు పెద్దవారైనప్పుడు, వారు యెఫ్తాను వెళ్లగొట్టి, అతనితో, “మా తండ్రి ఇంటిలో నీకు వారసత్వం ఉండదు; ఎందుకంటే నీవు వేరొక స్త్రీ కుమారుడివి” అన్నారు.
  rationale: The revision improves modern Telugu idiom in the first clause and uses the clearer current term “వారసత్వం,” while preserving the Hebrew's definite reference to “the woman/wife,” the force of expulsion, the denial of inheritance, and the deliberately non-specific description “another woman.”
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T21:46:54Z'
review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately represents the Hebrew sequence and key terms: Gilead''s wife bears sons; the woman''s sons grow up, expel Jephthah, and deny him inheritance on the grounds that he is the son of another woman. The definite expression בְנֵי הָאִשָּׁה is suitably retained as “ఆ భార్య కుమారులు,” without adding an interpretive claim about Jephthah''s mother.'
  naturalness: The opening, “గిలాదుకు అతని భార్య కుమారులను కన్నది,” is understandable but is syntactically awkward in modern standard Telugu because “గిలాదుకు” and “అతని భార్య” redundantly encode the same relationship. “గిలాదు భార్య అతనికి కుమారులను కనింది” is natural and keeps the Hebrew sense. “వారసత్వం” is more current and broadly clear than “స్వాస్థ్యం.”
  terminology: “యెఫ్తా” is a suitable Telugu form of Jephthah. “వేరొక స్త్రీ కుమారుడివి” correctly preserves the non-specific “another woman,” rather than introducing “wife,” “concubine,” or a moral judgment. “వారసత్వం” faithfully conveys the inheritance terminology.
  issues:
  - severity: low
    issue: Awkward redundant possessive construction in the opening clause
    rationale: “గిలాదుకు అతని భార్య” is less idiomatic than a direct possessive subject construction, though it does not materially alter the meaning.
  - severity: low
    issue: Less current term for inheritance
    rationale: “స్వాస్థ్యం” can mean inherited property, but “వారసత్వం” is more natural modern standard Telugu and clearly conveys the denied inheritance right.
  revised_text: గిలాదు భార్య అతనికి కుమారులను కనింది. ఆ భార్య కుమారులు పెద్దవారైనప్పుడు, వారు యెఫ్తాను వెళ్లగొట్టి, అతనితో, “మా తండ్రి ఇంటిలో నీకు వారసత్వం ఉండదు; ఎందుకంటే నీవు వేరొక స్త్రీ కుమారుడివి” అన్నారు.
  revised_footnotes: []
  revision_rationale: The revision improves modern Telugu idiom in the first clause and uses the clearer current term “వారసత్వం,” while preserving the Hebrew's definite reference to “the woman/wife,” the force of expulsion, the denial of inheritance, and the deliberately non-specific description “another woman.”
