  text: וַ/יּ֥וֹסֶף ע֖וֹד יִפְתָּ֑ח וַ/יִּשְׁלַח֙ מַלְאָכִ֔ים אֶל מֶ֖לֶךְ בְּנֵ֥י עַמּֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/014.yaml
  text: Then Jephthah again sent messengers to the king of the Ammonites[a].
translation:
  language: te
  text: అప్పుడు యెఫ్తా అమ్మోనీయుల రాజు దగ్గరికి మళ్లీ దూతలను పంపాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ: ‘అమ్మోను కుమారుల రాజు’; ఇది అమ్మోనీయ ప్రజలను సూచించే ప్రయోగం.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹסֶף עוֹד
  choice: అప్పుడు ... మళ్లీ
  rationale: יָסַף עוֹד + క్రియ అనే హీబ్రూ ప్రయోగం చర్య పునరావృతమైందని లేదా కొనసాగిందని సూచిస్తుంది. కథన క్రమాన్ని ‘అప్పుడు’, పునరావృతాన్ని ‘మళ్లీ’ సహజంగా తెలియజేస్తాయి.
- source_word: יִפְתָּח
  choice: యెఫ్తా
  rationale: వ్యక్తి పేరును ఆధునిక ప్రామాణిక తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: וַיִּשְׁלַח
  choice: పంపాడు
  rationale: ఈ కథన సందర్భంలో שׁלח కు సహజమైన, స్పష్టమైన తెలుగు సమానార్థకం.
- source_word: מַלְאָכִים
  choice: దూతలను
  rationale: ఇది రాజుల మధ్య దౌత్య సంబంధమైన మానవ సందేశవాహకులను సూచిస్తుంది; దేవదూతలను కాదు. ‘దూతలు’ సాధారణ పాఠకులకు సహజంగా ఉండి మూలపద విస్తృతార్థాన్ని నిలుపుతుంది.
- source_word: אֶל
  choice: దగ్గరికి
  rationale: వ్యక్తుల దగ్గరికి పంపడం అనే తెలుగు ప్రయోగంలో దిశను సహజంగా వ్యక్తపరుస్తుంది.
- source_word: מֶלֶךְ בְּנֵי עַמּוֹן
  choice: అమ్మోనీయుల రాజు
  rationale: అక్షరార్థంగా ‘అమ్మోను కుమారుల రాజు’; అయితే בְּנֵי עַמּוֹן అనేది అమ్మోను ప్రజలను సూచించే జాతివాచక హీబ్రూ ప్రయోగం. ‘అమ్మోనీయులు’ తెలుగులో సహజంగా అదే సూచనను ఇస్తుంది.
