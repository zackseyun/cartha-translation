translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. ‘దూతలు’ అనే పదం సందర్భానుసారంగా మానవ సందేశవాహకులను సూచిస్తుంది. మూలంలోని పునరావృత భావాన్ని ‘మళ్లీ’తో స్పష్టంగా నిలిపాం.
