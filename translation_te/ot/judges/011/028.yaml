translation:
  language: te
  text: అయితే అమ్మోనీయుల రాజు యెఫ్తా తనకు పంపిన మాటలను వినలేదు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלֹא שָׁמַע
  choice: అయితే ... వినిపించుకోలేదు
  rationale: שׁמע ఇక్కడ కేవలం శబ్దాలు వినడం కాక, పంపిన సందేశాన్ని ఆలకించి అంగీకరించడం లేదా దానికి స్పందించడం అనే భావాన్ని ఇస్తుంది. సందర్భంలో సహజమైన ఆధునిక తెలుగు కోసం ‘వినిపించుకోలేదు’ ఎంచుకున్నాం.
- source_word: מֶלֶךְ בְּנֵי עַמּוֹן
  choice: అమ్మోనీయుల రాజు
  rationale: అక్షరార్థంగా ‘అమ్మోను కుమారుల రాజు’; ప్రజాజాతిని సూచించే సహజ తెలుగు రూపం ‘అమ్మోనీయుల రాజు’.
- source_word: דִּבְרֵי יִפְתָּח אֲשֶׁר שָׁלַח אֵלָיו
  choice: యెఫ్తా తనకు పంపిన సందేశాన్ని
  rationale: ‘యెఫ్తా మాటలు—అతడు అతని దగ్గరకు పంపినవి’ అనే హీబ్రూ నిర్మాణం దూతల ద్వారా పంపిన సమాచారాన్ని సూచిస్తుంది. తెలుగు వాక్యంలో సర్వనామ సందిగ్ధతను తగ్గిస్తూ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
