  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. వ్యక్తి పేరు ‘యెఫ్తా’, జాతి పేరు ‘అమ్మోనీయులు’గా వాడబడ్డాయి.
