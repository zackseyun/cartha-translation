  yaml_path: translation/ot/judges/011/033.yaml
  text: And he struck them from Aroer as far as the entrance to Minnith[a], twenty cities, and as far as Abel-keramim, with a very great slaughter[d][c][b]. So the sons of Ammon were subdued before the sons of Israel.
translation:
  language: te
  text: అతడు అరోయేరు మొదలుకొని మిన్నీతు ప్రవేశం వరకు[a]—మొత్తం ఇరవై పట్టణాలు—మరియు ఆబేల్-కెరామీము[b] వరకు వారిని అత్యంత ఘోరమైన దెబ్బతో కొట్టాడు[c]. అలా అమ్మోను వంశస్థులు ఇశ్రాయేలు వంశస్థుల ఎదుట అణచివేయబడ్డారు[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘మిన్నీతు వరకు,’ లేక ‘మిన్నీతుకు చేరే చోటు వరకు.’ హీబ్రూ పదబంధం కొంత క్లిష్టంగా ఉంది; అది పట్టణ ప్రవేశాన్ని గానీ, పట్టణాన్నే గానీ సూచించవచ్చు.
    reason: alternative_reading
  - marker: b
    text: ‘ఆబేల్-కెరామీము’ ఒక స్థలనామం. దాని పదభాగాలకు ‘ద్రాక్షతోటల మైదానం’ వంటి అర్థం ఉండవచ్చు; అయితే ఇక్కడ అది పేరుగా ఉన్నందున లిప్యంతరీకరించబడింది.
    reason: lexical_alternative
  - marker: c
    text: హీబ్రూ పదబంధాన్ని ‘అత్యంత గొప్ప దెబ్బతో’ లేదా ‘అత్యంత ఘోరమైన ఓటమితో’ అని కూడా అనువదించవచ్చు. అది యుద్ధంలో జరిగిన వినాశకరమైన దాడిని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: d
    text: మరింత సాధారణంగా, ‘అమ్మోనీయులు ఇశ్రాయేలీయుల ఎదుట అణచివేయబడ్డారు’ అని అనువదించవచ్చు. ప్రధాన పాఠ్యం హీబ్రూలోని వంశసంబంధ వ్యక్తీకరణల సమాంతరతను నిలుపుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכֵּם
  choice: వారిని ... హతమార్చాడు
  rationale: נכה అనే క్రియకు ‘కొట్టు, దెబ్బతీయు’ అనే ప్రాథమిక భావం ఉంది; ఇక్కడి యుద్ధ సందర్భంలో ‘హతమార్చాడు’ సహజంగా ఉంది. అయితే మరణాల పరిమాణాన్ని క్రియ ఒక్కటే నిర్దిష్టం చేయదు కాబట్టి తదుపరి מַכָּה పదబంధంలోని అర్థవిస్తృతిని పాదటిప్పణిలో ఉంచాం.
- source_word: מֵעֲרוֹעֵר
  choice: అరోయేరు మొదలుకొని
  rationale: ఇది స్థలనామం; అనువదించకుండా తెలుగులో లిప్యంతరీకరించాం. מִן ఆరంభస్థానాన్ని సూచిస్తుంది.
- source_word: וְעַד בּוֹאֲךָ מִנִּית
  choice: మిన్నీతు ప్రవేశం వరకు
  rationale: భౌగోళిక పరిధిని తెలిపే సందర్భంలో בּוֹאֲךָ అనేది ఒక పట్టణానికి చేరే ప్రదేశం లేదా ప్రవేశాన్ని సూచించవచ్చు. తెలుగు వాక్యంలో ‘ప్రవేశం వరకు’ సహజంగా ఉండగా, ‘మిన్నీతు వరకు’ అనే ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో నిలిపాం.
- source_word: עֶשְׂרִים עִיר
  choice: ఇరవై పట్టణాల్లోను
  rationale: సంఖ్యతో కూడిన עִיר ను ‘ఇరవై పట్టణాలు’గా గ్రహించాం. భౌగోళిక శ్రేణిలో ఆ పట్టణాలపై జరిగిన చర్యను తెలుగులో సహజంగా అనుసంధానించడానికి ‘పట్టణాల్లోను’ అని రూపాంతరం చేశాం.
- source_word: וְעַד אָבֵל כְּרָמִים
  choice: ఆబేల్-కెరామీము వరకు
  rationale: ఇది స్థలనామంగా పనిచేస్తున్నందున దాని భాగాల అర్థాన్ని ప్రధాన పాఠ్యంలో అనువదించకుండా లిప్యంతరీకరించాం.
- source_word: מַכָּה גְּדוֹלָה מְאֹד
  choice: అత్యంత ఘోరంగా హతమార్చాడు
  rationale: ఈ పదబంధం అక్షరార్థంగా ‘అత్యంత గొప్ప దెబ్బ’ అయినా యుద్ధ సందర్భంలో వినాశకరమైన దాడి, ఘోర ఓటమి లేదా సంహారాన్ని సూచిస్తుంది. ప్రధాన పాఠ్యంలో తీవ్రతను సహజ తెలుగులో తెలిపి, అర్థవిస్తృతిని పాదటిప్పణిలో ఇచ్చాం.
- source_word: וַיִּכָּנְעוּ
  choice: అణచివేయబడ్డారు
  rationale: כנע నిఫ్అల్ రూపం యుద్ధ-రాజకీయ సందర్భంలో లోబడిపోవడం లేదా అణచివేయబడడాన్ని సూచిస్తుంది. ‘అణచివేయబడ్డారు’ ఆ ఫలితాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: בְּנֵי עַמּוֹן
  choice: అమ్మోను సంతతివారు
  rationale: హీబ్రూలోని ‘అమ్మోను కుమారులు’ అనే వంశసంబంధ వ్యక్తీకరణను తెలుగులో గౌరవప్రదంగా, అర్థవంతంగా ‘అమ్మోను సంతతివారు’ అని ఇచ్చాం.
- source_word: מִפְּנֵי בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు సంతతివారి ఎదుట
  rationale: מִפְּנֵי ఇక్కడ ప్రత్యర్థి ఎదుట అణచబడిన స్థితిని సూచిస్తుంది. ‘ఇశ్రాయేలు సంతతివారి ఎదుట’ మూలంలోని సంబంధబలాన్ని, వంశసంబంధ పదప్రయోగాన్ని నిలుపుతుంది.
