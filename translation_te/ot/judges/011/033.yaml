  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన వచనశైలిని ఉపయోగించాం. స్థలనామాలను లిప్యంతరీకరించాం; మూలంలోని భౌగోళిక అస్పష్టతను, యుద్ధపదమైన מַכָּה యొక్క అర్థవిస్తృతిని పాదటిప్పణుల్లో నిలిపాం. ‘సంతతివారు’ అనే రూపం మూలంలోని בְּנֵי నిర్మాణాన్ని పదక్షరంగా కాకుండా సహజ తెలుగులో ప్రతిబింబిస్తుంది.
