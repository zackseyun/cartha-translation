  to: అతడు అరోయేరు మొదలుకొని మిన్నీతు ప్రవేశం వరకు[a]—మొత్తం ఇరవై పట్టణాలు—మరియు ఆబేల్-కెరామీము[b] వరకు వారిని అత్యంత ఘోరమైన దెబ్బతో కొట్టాడు[c]. అలా అమ్మోను వంశస్థులు ఇశ్రాయేలు వంశస్థుల ఎదుట అణచివేయబడ్డారు[d].
