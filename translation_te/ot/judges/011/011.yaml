  text: וַ/יֵּ֤לֶךְ יִפְתָּח֙ עִם זִקְנֵ֣י גִלְעָ֔ד וַ/יָּשִׂ֨ימוּ הָ/עָ֥ם אוֹת֛/וֹ עֲלֵי/הֶ֖ם לְ/רֹ֣אשׁ וּ/לְ/קָצִ֑ין וַ/יְדַבֵּ֨ר יִפְתָּ֧ח אֶת כָּל דְּבָרָ֛י/ו לִ/פְנֵ֥י יְהוָ֖ה בַּ/מִּצְפָּֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/011.yaml
  text: So Jephthah went with the elders of Gilead[a], and the people made him head and commander over them[b]. And Jephthah spoke all his words before Yahweh at Mizpah.
translation:
  language: te
  text: యెఫ్తా గిలాదు పెద్దలతో కలిసి వెళ్లాడు. ప్రజలు అతణ్ణి తమకు అధిపతిగా, సేనాధిపతిగా నియమించారు[a]. యెఫ్తా తన మాటలన్నిటినీ మిస్పాలో యాహ్వే సన్నిధిలో పలికాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘సేనాధిపతి’ అని అనువదించిన హీబ్రూ పదానికి ‘పాలకుడు,’ ‘అధికారి’ లేదా ‘సైన్యాధికారి’ అనే అర్థాలు కూడా రావచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘యెఫ్తా తన షరతులన్నిటినీ మిస్పాలో యాహ్వే సన్నిధిలో మళ్లీ చెప్పాడు.’ హీబ్రూ వాక్యం అక్షరార్థంగా ‘తన మాటలన్నిటినీ పలికాడు’ అని ఉంది.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּלֶךְ יִפְתָּח עִם זִקְנֵי גִלְעָד
  choice: యెఫ్తా గిలాదు పెద్దలతో కలిసి వెళ్లాడు
  rationale: הלך యొక్క సాధారణ కథనార్థమైన ‘వెళ్లాడు’ను, עִם సూచించే సహవాసాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: וַיָּשִׂימוּ הָעָם אוֹתוֹ עֲלֵיהֶם
  choice: ప్రజలు అతణ్ణి తమకు ... నియమించారు
  rationale: שׂים + עַל ఇక్కడ అధికార స్థానంలో ఉంచడం లేదా నియమించడం అనే భావాన్ని ఇస్తుంది. ‘నియమించారు’ ప్రజల అధికారిక అంగీకారాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: לְרֹאשׁ
  choice: అధిపతిగా
  rationale: רֹאשׁ అక్షరార్థంగా ‘తల’ అయినా, ఇక్కడ ప్రధాన నాయకుణ్ణి సూచించే రూపక ప్రయోగం. ‘అధిపతి’ ఆ నాయకత్వ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: וּלְקָצִין
  choice: సేనాధిపతిగా
  rationale: קָצִין అధికారిని, పాలకుణ్ణి లేదా సైనికాధికారిని సూచించగలదు. అమ్మోనీయులతో యుద్ధ సందర్భంలో ‘సేనాధిపతి’ ప్రధాన సందర్భార్థాన్ని అందిస్తూనే, ఇతర సాధ్యార్థాలను పాదసూచికలో ఉంచుతుంది.
- source_word: וַיְדַבֵּר ... אֶת כָּל דְּבָרָיו
  choice: తన మాటలన్నిటినీ ... పలికాడు
  rationale: ‘తన మాటలన్నిటినీ పలికాడు’ అనే హీబ్రూ విస్తృత పదబంధాన్ని నిలుపుతుంది; వాటిని షరతులు, ప్రమాణం లేదా ప్రార్థనగా మాత్రమే పరిమితం చేయదు.
- source_word: לִפְנֵי יְהוָה
  choice: యాహ్వే సన్నిధిలో
  rationale: లిఖిత దైవనామాన్ని ‘యాహ్వే’గా ఉంచి, לִפְנֵי యొక్క సమక్షత మరియు గంభీరమైన ఒడంబడిక/న్యాయ సందర్భాన్ని ‘సన్నిధిలో’ ద్వారా తెలియజేస్తుంది.
- source_word: בַּמִּצְפָּה
  choice: మిస్పాలో
  rationale: స్థలనామాన్ని తెలుగులో లిప్యంతరీకరించి, సంఘటన జరిగిన ప్రదేశాన్ని సహజ విభక్తితో సూచిస్తుంది.
theological_decisions:
- issue: దైవనామమైన יהוה అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలంలో ఉన్న ఒడంబడిక దైవనామాన్ని బిరుదుతో మార్చకుండా, సాధ్యమైనంత నేరుగా లిప్యంతరీకరిస్తుంది.
- issue: యెఫ్తా యాహ్వే సన్నిధిలో పలికిన మాటల స్వరూపం
  choice: తన మాటలన్నిటినీ ... పలికాడు
  alternative: తన షరతులన్నిటినీ మళ్లీ చెప్పాడు; తన విషయాలన్నిటినీ వివరించాడు
  rationale: ఈ మాటలు ఒప్పంద షరతుల పునరుద్ఘాటన, గంభీర ప్రకటన లేదా యాహ్వే సన్నిధిలో ధృవీకరణ కావచ్చు. మూలంలోని విస్తృతమైన పదప్రయోగాన్ని నిలిపి, ఒకే వివరణకు పరిమితం చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన శైలి వాడబడింది. ‘అధిపతి, సేనాధిపతి’ అనే జంట పదాలు పౌర నాయకత్వం మరియు యుద్ధ నాయకత్వం అనే రెండు పాత్రలను వేరుగా నిలుపుతాయి. ప్రతి పాదసూచిక గుర్తు సంబంధిత పదబంధం వెంట ప్రధాన పాఠ్యంలో ఉంచబడింది.
