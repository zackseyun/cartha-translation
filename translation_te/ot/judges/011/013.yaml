- from: 'అమ్మోనీయుల రాజు యెఫ్తా దూతలతో ఇలా అన్నాడు: “ఇశ్రాయేలు ఐగుప్తు నుండి పైకి వచ్చినప్పుడు, అర్నోను మొదలుకొని యబ్బోకు వరకు, యొర్దాను వరకు ఉన్న నా దేశాన్ని స్వాధీనం చేసుకుంది. కాబట్టి ఇప్పుడు దాన్ని శాంతియుతంగా తిరిగి ఇచ్చేయి.”'
  to: 'అమ్మోనీయుల రాజు యెఫ్తా దూతలతో ఇలా అన్నాడు: “ఎందుకంటే ఇశ్రాయేలు ఐగుప్తు నుండి పైకి వచ్చినప్పుడు అర్నోను నుండి యబ్బోకు వరకు, యొర్దాను వరకు ఉన్న నా దేశాన్ని స్వాధీనం చేసుకుంది. కాబట్టి ఇప్పుడు ఆ భూభాగాలను శాంతియుతంగా తిరిగి ఇచ్చివేయి.”'
  rationale: The revision directly represents the causal כִּי and retains the plural object in the king’s final demand. It otherwise preserves the draft’s accurate geographic sequence, narrative register, and noncommittal presentation of the king’s claim as quoted speech.
