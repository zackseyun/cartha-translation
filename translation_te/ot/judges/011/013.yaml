source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ מֶ֨לֶךְ בְּנֵי עַמּ֜וֹן אֶל מַלְאֲכֵ֣י יִפְתָּ֗ח כִּֽי לָקַ֨ח יִשְׂרָאֵ֤ל אֶת אַרְצִ/י֙ בַּ/עֲלוֹת֣/וֹ מִ/מִּצְרַ֔יִם מֵ/אַרְנ֥וֹן וְ/עַד הַ/יַּבֹּ֖ק וְ/עַד הַ/יַּרְדֵּ֑ן וְ/עַתָּ֕ה הָשִׁ֥יבָ/ה אֶתְ/הֶ֖ן בְּ/שָׁלֽוֹם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/013.yaml
  text: And the king of the Ammonites said to Jephthah’s messengers, “Because Israel took my land when it came up from Egypt, from the Arnon as far as the Jabbok and as far as the Jordan, now restore them peacefully.”
translation:
  language: te
  text: 'అమ్మోనీయుల రాజు యెఫ్తా దూతలతో ఇలా అన్నాడు: “ఎందుకంటే ఇశ్రాయేలు ఐగుప్తు నుండి పైకి వచ్చినప్పుడు అర్నోను నుండి యబ్బోకు వరకు, యొర్దాను వరకు ఉన్న నా దేశాన్ని స్వాధీనం చేసుకుంది. కాబట్టి ఇప్పుడు ఆ భూభాగాలను శాంతియుతంగా తిరిగి ఇచ్చివేయి.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: కాబట్టి అనే ముగింపు వాక్యంతో కారణ సంబంధాన్ని సహజంగా వ్యక్తపరచడం
  rationale: హీబ్రూ వాక్యంలో రాజు తన డిమాండుకు కారణంగా ఇశ్రాయేలు భూమిని తీసుకుందని చెబుతున్నాడు. తెలుగులో నేరుగా ‘ఎందుకంటే’తో ప్రారంభిస్తే ముందున్న ప్రశ్నతో అనుసంధానం అసహజంగా ఉండవచ్చు; రెండు వాక్యాలుగా చేసి కారణ–డిమాండ్ సంబంధాన్ని ‘కాబట్టి’తో స్పష్టంగా నిలిపాం.
- source_word: לָקַח
  choice: స్వాధీనం చేసుకుంది
  rationale: సందర్భంలో ఇది కేవలం ‘తీసుకుంది’ కాదు, భూభాగాన్ని అధీనంలోకి తీసుకోవడాన్ని సూచిస్తుంది.
- source_word: בַעֲלוֹתוֹ מִמִּצְרַיִם
  choice: ఐగుప్తు నుండి పైకి వచ్చినప్పుడు
  rationale: ‘పైకి రావడం’ అనే హీబ్రూ ప్రయాణ వ్యక్తీకరణను నిలుపుతూ సహజమైన తెలుగు వాక్యనిర్మాణం వాడాం.
- source_word: מֵאַרְנוֹן וְעַד הַיַּבֹּק וְעַד הַיַּרְדֵּן
  choice: అర్నోను మొదలుకొని యబ్బోకు వరకు, యొర్దాను వరకు
  rationale: మూడు భౌగోళిక సరిహద్దులను మూలంలోని క్రమంలోనే ఉంచాం; రెండవ ‘వరకు’ను కూడా నిలిపి అసలు వాక్య నిర్మాణాన్ని ప్రతిబింబించాం.
- source_word: הָשִׁיבָה אֶתְהֶן
  choice: దాన్ని తిరిగి ఇచ్చేయి
  rationale: ప్రత్యయం రూపపరంగా బహువచనంగా కనిపించినా, ముందున్న ‘నా దేశం’ను సూచిస్తూ సమష్టి భూభాగ భావంలో ఉంది; సహజ తెలుగులో ఏకవచన ‘దాన్ని’ సరిపోతుంది.
- source_word: בְשָׁלוֹם
  choice: శాంతియుతంగా
  rationale: హింస లేదా యుద్ధం లేకుండా తిరిగి అప్పగించాలనే డిమాండును సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: అమ్మోనీయుల రాజు చేసిన భూహక్కు వాదనను వాస్తవ నిర్ధారణగా చూపాలా
  choice: అతని ప్రత్యక్ష ప్రసంగంలోని వాదనగానే ఉంచడం
  alternative: ఇశ్రాయేలు నిజంగానే అతని భూమిని అన్యాయంగా తీసుకుందని కథకుని నిర్ధారణలా అనువదించడం
  rationale: మూలపాఠ్యం ఇక్కడ రాజు ఆరోపణను మాత్రమే నమోదు చేస్తుంది; దాని చారిత్రక లేదా నైతిక సత్యాసత్యాలను ఈ వచనం తీర్మానించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి. వ్యక్తి, జాతి, నది పేర్లకు సాధారణ తెలుగు బైబిలు రూపాలు వాడబడ్డాయి. ప్రత్యక్ష ప్రసంగం స్పష్టంగా, సామాన్య పాఠకులకు అర్థమయ్యేలా రెండు వాక్యాలుగా అమర్చబడింది.
