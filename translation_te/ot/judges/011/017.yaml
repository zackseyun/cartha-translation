translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. హీబ్రూలోని సమిష్టి ‘ఇశ్రాయేలు’కు తెలుగు వ్యాకరణానుసారం స్త్రీలింగ ఏకవచన క్రియలు వాడబడ్డాయి. ప్రత్యక్ష వాక్యంలో ఉన్న నిజమైన ఏకవచనాన్ని ప్రధాన పాఠంలో నిలిపి, సమిష్టి బహువచన ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
