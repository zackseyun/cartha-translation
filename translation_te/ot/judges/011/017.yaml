source:
  edition: WLC
  text: וַ/יִּשְׁלַ֣ח יִשְׂרָאֵ֣ל מַלְאָכִ֣ים אֶל מֶלֶךְ֩ אֱד֨וֹם לֵ/אמֹ֜ר אֶעְבְּרָה נָּ֣א בְ/אַרְצֶ֗/ךָ וְ/לֹ֤א שָׁמַע֙ מֶ֣לֶךְ אֱד֔וֹם וְ/גַ֨ם אֶל מֶ֧לֶךְ מוֹאָ֛ב שָׁלַ֖ח וְ/לֹ֣א אָבָ֑ה וַ/יֵּ֥שֶׁב יִשְׂרָאֵ֖ל בְּ/קָדֵֽשׁ׀־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/017.yaml
  text: Then Israel sent messengers to the king of Edom[a], saying, ‘Please let us pass through your land,’ but the king of Edom did not listen. And he also sent to the king of Moab, but he was unwilling[b], so Israel remained at Kadesh.
translation:
  language: te
  text: అప్పుడు ఇశ్రాయేలు ఎదోము రాజు దగ్గరకు దూతలను పంపి, “దయచేసి నన్ను నీ దేశం గుండా వెళ్లనివ్వు”[a] అని అడిగింది. అయితే ఎదోము రాజు వినలేదు. ఇశ్రాయేలు మోయాబు రాజు దగ్గరకు కూడా దూతలను పంపింది; కానీ అతడు అందుకు ఇష్టపడలేదు.[b] కాబట్టి ఇశ్రాయేలు కాదేషులో ఉండిపోయింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ మూలంలో “నన్ను వెళ్లనివ్వు” అని ఏకవచనం ఉంది; ఇశ్రాయేలు సమాజం ఒకే వ్యక్తిలా మాట్లాడుతోంది. భావానుసారంగా దీనిని “మమ్మల్ని వెళ్లనివ్వు” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా “అతడు సమ్మతించలేదు”; ఇంకా బలంగా, “అతడు నిరాకరించాడు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאָכִים
  choice: దూతలను
  rationale: ఇది మానవ రాజుల మధ్య దౌత్య సందర్భం; కాబట్టి ఇక్కడ ‘దూతలు’ అంటే సందేశవాహకులు, దేవదూతలు కాదు.
- source_word: אֶעְבְּרָה נָּא
  choice: దయచేసి నన్ను ... వెళ్లనివ్వు
  rationale: మొదటి పురుష ఏకవచన కోహోర్టేటివ్ రూపాన్నీ, נָא సూచించే మర్యాదపూర్వక అభ్యర్థననూ నిలుపుతుంది; ఇశ్రాయేలు సమిష్టిగా ఒకే వ్యక్తిలా మాట్లాడుతోంది.
- source_word: בְאַרְצֶךָ
  choice: నీ దేశం గుండా
  rationale: ప్రయాణ సందర్భంలో בְ తో עבר కలయిక కేవలం దేశంలో ఉండడాన్ని కాక, దాని గుండా ప్రయాణించడాన్ని సూచిస్తుంది.
- source_word: וְלֹא שָׁמַע
  choice: వినలేదు
  rationale: ఇక్కడ שׁמע అంటే శబ్దం వినకపోవడం కంటే అభ్యర్థనను ఆలకించి అనుకూలంగా స్పందించకపోవడం; తెలుగు ‘వినలేదు’ ఈ సందర్భార్థాన్ని సహజంగా మోస్తుంది.
- source_word: וְלֹא אָבָה
  choice: అందుకు ఇష్టపడలేదు
  rationale: אָבָה యొక్క ‘సమ్మతించడానికి లేదా చేయడానికి సిద్ధంగా ఉండటం’ అనే భావాన్ని, మరింత తీవ్రమైన ‘నిరాకరించాడు’ అని పెంచకుండా వ్యక్తం చేస్తుంది.
- source_word: וַיֵּשֶׁב
  choice: ఉండిపోయింది
  rationale: ప్రయాణం కొనసాగించకుండా ఆ ప్రదేశంలోనే నిలిచిపోయిన భావాన్ని ఇస్తుంది; శాశ్వత నివాసం ఏర్పరచుకున్నట్టు సూచించదు.
- source_word: בְּקָדֵשׁ
  choice: కాదేషులోనే
  rationale: ప్రయాణ కథనంలో స్థలాన్ని సహజంగా సూచిస్తుంది; ‘నే’ కొనసాగిన నిలుపును స్పష్టం చేస్తుంది.
