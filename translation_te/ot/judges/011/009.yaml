language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יִפְתָּ֜ח אֶל זִקְנֵ֣י גִלְעָ֗ד אִם מְשִׁיבִ֨ים אַתֶּ֤ם אוֹתִ/י֙ לְ/הִלָּחֵם֙ בִּ/בְנֵ֣י עַמּ֔וֹן וְ/נָתַ֧ן יְהוָ֛ה אוֹתָ֖/ם לְ/פָנָ֑/י אָנֹכִ֕י אֶהְיֶ֥ה לָ/כֶ֖ם לְ/רֹֽאשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/009.yaml
  text: Jephthah said to the elders of Gilead[a], “If you bring me back to fight against the Ammonites, and Yahweh gives them before me[b], I will be your head.”
translation:
  language: te
  text: 'యెఫ్తా గిలాదు పెద్దలతో ఇలా అన్నాడు: “అమ్మోనీయులపై యుద్ధం చేయడానికి మీరు నన్ను తిరిగి తీసుకొస్తే, యహ్వే వారిని నా ముందు అప్పగిస్తే, నేనే మీకు అధిపతిగా[a] ఉంటాను.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూలభాషలో అక్షరార్థంగా “తలగా”; భావం “నాయకుడిగా” లేదా “ముఖ్యుడిగా.”
    reason: lexical_alternative
  - marker: b
    text: 'చివరి మాటలను ప్రశ్నగా కూడా అర్థం చేసుకోవచ్చు: “అప్పుడు నేనే మీకు అధిపతిగా ఉంటానా?”'
    reason: alternative_reading
lexical_decisions:
- source_word: מְשִׁיבִים אַתֶּם אוֹתִי
  choice: మీరు నన్ను తిరిగి తీసుకొస్తే
  rationale: שׁוב హిఫిల్ రూపంలోని ‘తిరిగి రప్పించడం’ అనే కారణార్థాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; యెఫ్తా ముందుగా వెళ్లగొట్టబడిన సందర్భాన్నీ నిలుపుతుంది.
- source_word: לְהִלָּחֵם בִּבְנֵי עַמּוֹן
  choice: అమ్మోనీయులతో యుద్ధం చేయడానికి
  rationale: לחם నిఫాల్ ఇక్కడ యుద్ధంలో పాల్గొనడాన్ని సూచిస్తుంది. ‘అమ్మోనీయులు’ అనేది ‘అమ్మోను కుమారులు’ అనే జాతివాచకానికి సహజమైన తెలుగు రూపం.
- source_word: וְנָתַן יְהוָה אוֹתָם לְפָנַי
  choice: యహ్వే వారిని నా ముందు అప్పగిస్తే
  rationale: ‘నా ముందు’ అని అనువదించడం לְפָנַי రూపాన్ని నిలుపుతుంది; మూలంలో లేని ‘నా చేతికి’ అనే భావాన్ని చేర్చదు. נתן యొక్క సందర్భార్థాన్ని ‘అప్పగిస్తే’ సహజంగా తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పండితీయ ఉచ్చారణకు దగ్గరైన తెలుగు లిప్యంతరీకరణను వాడింది.
- source_word: לְרֹאשׁ
  choice: అధిపతిగా
  rationale: ראשׁ అక్షరార్థంగా ‘తల’ అయినా, ఇక్కడ సమాజంపై అధికారమున్న ముఖ్య నాయకుడిని సూచిస్తుంది. ‘అధిపతి’ రాజకీయ-పాలనా భావాన్ని సహజంగా అందిస్తుంది; అక్షరార్థాన్ని పాదసూచికలో ఉంచింది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమే ఉంది. కాబట్టి దానిని బిరుదుగా మార్చకుండా లిప్యంతరీకరించింది.
- issue: אָנֹכִי אֶהְיֶה לָכֶם לְרֹאשׁ వాక్యబలం
  choice: 'ప్రకటనగా: ‘నేనే మీకు అధిపతిగా ఉంటాను’'
  alternative: 'ప్రశ్నగా: ‘అప్పుడు నేనే మీకు అధిపతిగా ఉంటానా?’'
  rationale: హీబ్రూ రూపంలో స్పష్టమైన ప్రశ్నార్థక సూచిక లేదు; అందువల్ల ప్రధాన పాఠంలో ప్రకటనను నిలిపింది. అయితే సందర్భంలో యెఫ్తా షరతులను నిర్ధారించుకుంటున్న ప్రశ్నగా గ్రహించే అవకాశం ఉన్నందున దానిని పాదసూచికలో తెలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు స్పష్టమైన శైలిని వాడింది. హీబ్రూ షరతుల క్రమాన్ని సాధ్యమైనంతవరకు నిలిపి, తెలుగులో సహజమైన వాక్యనిర్మాణాన్ని ఎంచుకుంది.
