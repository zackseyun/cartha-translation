translation_notes:
  register: సామాన్య ఆధునిక పాఠకులకు అర్థమయ్యే, గౌరవప్రదమైన ప్రామాణిక తెలుగు వాడబడింది. పొడవైన హీబ్రూ వాక్యాన్ని చదవడానికి సులభంగా రెండు వాక్యాలుగా విభజించాం. ‘ముక్కుపోగులు’ సందర్భాధారంగా ఎంచుకున్నప్పటికీ మూలంలోని అనిశ్చితిని పాదసూచనలో నిలిపాం; [a] ప్రధాన పాఠ్యంలో ఉంచబడింది.
