  text: וַ/יְהִ֗י מִשְׁקַ֞ל נִזְמֵ֤י הַ/זָּהָב֙ אֲשֶׁ֣ר שָׁאָ֔ל אֶ֥לֶף וּ/שְׁבַע מֵא֖וֹת זָהָ֑ב לְ֠/בַד מִן הַ/שַּׂהֲרֹנִ֨ים וְ/הַ/נְּטִפ֜וֹת וּ/בִגְדֵ֣י הָ/אַרְגָּמָ֗ן שֶׁ/עַל֙ מַלְכֵ֣י מִדְיָ֔ן וּ/לְ/בַד֙ מִן הָ֣/עֲנָק֔וֹת אֲשֶׁ֖ר בְּ/צַוְּארֵ֥י גְמַלֵּי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/026.yaml
  text: And the weight of the gold rings that he requested was 1,700 shekels of gold[a], besides the crescent ornaments and the pendants and the purple garments that were on the kings of Midian[b], and besides the necklaces that were on the necks of their camels.
translation:
  language: te
  text: అతడు అడిగిన బంగారు ఉంగరాల[b] బరువు 1,700 షెకెల్ల బంగారం[a]; ఈ లెక్కలో చంద్రవంక ఆకారపు ఆభరణాలు, వేలాడే ఆభరణాలు, మిద్యాను రాజులు ధరించిన ఊదారంగు వస్త్రాలు, వారి ఒంటెల మెడలపై ఉన్న హారాలు చేరలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరాలా, “1,700 బంగారం.” ఇక్కడ బరువు కొలమానంగా “షెకెల్లు” అని సందర్భానుసారంగా చేర్చబడింది.
    reason: lexical_alternative
  - marker: b
    text: “ఉంగరాలు” అని అనువదించిన హీబ్రూ పదం చెవికి లేదా ముక్కుకు ధరించే ఉంగరాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁקַל
  choice: బరువు
  rationale: ఈ నామవాచకం కేవలం పరిమాణాన్ని కాక, తూచి కొలిచిన బరువును సూచిస్తుంది.
- source_word: נִזְמֵי הַזָּהָב
  choice: బంగారు ముక్కుపోగులు
  rationale: נזם చెవికి లేదా ముక్కుకు ధరించే ఉంగరాకార ఆభరణాన్ని సూచించగలదు. న్యాయాధిపతులు 8:24లోని సందర్భం ఇష్మాయేలీయుల ముక్కుపోగులను సూచించే అవకాశాన్ని బలపరుస్తుంది; అయినా శరీరస్థానం పూర్తిగా నిశ్చితం కాదు కాబట్టి పాదసూచనలో ప్రత్యామ్నాయం ఇవ్వబడింది.
- source_word: אֲשֶׁר שָׁאָל
  choice: అతడు అడిగిన
  rationale: గిద్యోను దోపుడుసొమ్ములో నుంచి ఈ ఆభరణాలను ఇవ్వమని అడిగిన మునుపటి కథనంతో సహజంగా అనుసంధానమవుతుంది.
- source_word: אֶלֶף וּשְׁבַע מֵאוֹת זָהָב
  choice: 1,700 షెకెల్ల బంగారం
  rationale: హీబ్రూలో కొలమానం పేరు స్పష్టంగా లేకపోయినా, విలువైన లోహపు బరువు సందర్భంలో ‘షెకెల్లు’ అర్థగతమైన ప్రమాణం.
- source_word: לְבַד מִן
  choice: కాకుండా
  rationale: తర్వాత పేర్కొన్న వస్తువులు ముందటి బంగారం బరువు లెక్కలో చేరలేదని స్పష్టం చేస్తుంది.
- source_word: הַשַּׂהֲרֹנִים
  choice: చంద్రవంక ఆకారపు ఆభరణాలు
  rationale: పదం చంద్రవంక ఆకారంలో ఉండే అలంకారాలను సూచిస్తుంది; ఆధునిక పాఠకునికి ఆకారం స్పష్టమయ్యేలా అనువదించబడింది.
- source_word: הַנְּטִפוֹת
  choice: వేలాడే ఆభరణాలు
  rationale: ఈ పదం వేలాడే లేదా బొట్టువలె కిందికి ఉండే అలంకారాలను సూచించే అవకాశం ఉంది; నిర్దిష్ట రకాన్ని అనవసరంగా నిర్ణయించకుండా సాధారణ రూపం నిలుపబడింది.
- source_word: בִגְדֵי הָאַרְגָּמָן
  choice: ఊదారంగు వస్త్రాలు
  rationale: రాజరికంతో ముడిపడిన ఊదారంగు వస్త్రాలను సహజమైన ఆధునిక తెలుగులో సూచిస్తుంది.
- source_word: שֶׁעַל מַלְכֵי מִדְיָן
  choice: మిద్యాను రాజులు ధరించిన
  rationale: వస్త్రాల విషయంలో על అవి రాజుల మీద ఉన్నాయని, అంటే వారు ధరించారని సూచిస్తుంది; తెలుగులో ‘ధరించిన’ సహజంగా ఉంటుంది.
- source_word: הָעֲנָקוֹת
  choice: హారాలు
  rationale: మెడకు వేసే ఆభరణాలు లేదా గొలుసులను సూచిస్తుంది; వెంటనే ఒంటెల మెడలు ప్రస్తావించబడటం వల్ల ‘హారాలు’ స్పష్టంగా, సహజంగా ఉంది.
- source_word: בְּצַוְּארֵי גְמַלֵּיהֶם
  choice: వారి ఒంటెల మెడలపై ఉన్న
  rationale: ఆభరణాలు ఎక్కడ ఉన్నాయో తెలిపే హీబ్రూ భావాన్ని సహజమైన తెలుగు పదక్రమంలో అందిస్తుంది.
