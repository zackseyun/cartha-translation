source:
  edition: WLC
  text: בְּ/יֶדְ/כֶם֩ נָתַ֨ן אֱלֹהִ֜ים אֶת שָׂרֵ֤י מִדְיָן֙ אֶת עֹרֵ֣ב וְ/אֶת זְאֵ֔ב וּ/מַה יָּכֹ֖לְתִּי עֲשׂ֣וֹת כָּ/כֶ֑ם אָ֗ז רָפְתָ֤ה רוּחָ/ם֙ מֵֽ/עָלָ֔י/ו בְּ/דַבְּר֖/וֹ הַ/דָּבָ֥ר הַ/זֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/003.yaml
  text: Into your hand God gave the princes of Midian[a], Oreb and Zeeb; and what was I able to do compared with you? Then their spirit relaxed toward him when he spoke this word.
translation:
  language: te
  text: దేవుడు మిద్యాను అధిపతులైన ఓరేబును, జేబును మీ చేతికి అప్పగించాడు. మీతో పోలిస్తే నేను చేయగలిగింది ఏమిటి? అతడు ఈ మాట చెప్పినప్పుడు, అతనిపై వారి కోపం చల్లారింది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “అతని మీదనుండి వారి ఆత్మ సడలింది.”
    reason: హీబ్రూ నుడికారంలోని రూపకాన్ని చూపుతూ, ప్రధాన పాఠంలోని సహజార్థ అనువాదానికి ఆధారం తెలియజేయడం.
lexical_decisions:
- source_word: בְּיֶדְכֶם נָתַן אֱלֹהִים
  choice: దేవుడు ... మీ చేతికి అప్పగించాడు
  rationale: ‘చేతికి ఇవ్వడం’ అనే హీబ్రూ నుడికారం ఒకరి అధికారానికి లేదా అదుపుకు అప్పగించడాన్ని సూచిస్తుంది. తెలుగులో సహజంగా ఉండే ‘చేతికి అప్పగించాడు’ ఆ భావాన్ని నిలుపుతుంది.
- source_word: שָׂרֵי מִדְיָן
  choice: మిద్యాను అధిపతులు
  rationale: שָׂרִים పాలకులు, నాయకులు లేదా ఉన్నతాధికారులను సూచిస్తుంది. ‘అధిపతులు’ వారి ఉన్నత స్థానాన్ని సహజమైన, గంభీరమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: עֹרֵב וְאֶת זְאֵב
  choice: ఓరేబు, జెయేబు
  rationale: వ్యక్తుల పేర్లను హీబ్రూ ఉచ్చారణకు దగ్గరగా తెలుగు లిప్యంతరీకరణలో ఇచ్చాం.
- source_word: וּמַה יָּכֹלְתִּי עֲשׂוֹת כָּכֶם
  choice: మీతో పోలిస్తే నేను చేయగలిగింది ఏమిటి?
  rationale: כָכֶם ఇక్కడ పోలికను సూచిస్తుంది. గిద్యోను తన విజయాన్ని ఎఫ్రాయిమీయుల విజయంకంటే తక్కువగా చూపుతూ వారిని శాంతింపజేస్తున్న భావాన్ని ఈ సహజ తెలుగు ప్రశ్న నిలుపుతుంది.
- source_word: רָפְתָה רוּחָם מֵעָלָיו
  choice: అతని మీదున్న వారి కోపం చల్లారింది
  rationale: అక్షరార్థంగా ‘అతని మీదనుండి వారి ఆత్మ సడలింది.’ సందర్భంలో ఇది అతనిపై ఉన్న ఆగ్రహం తగ్గడాన్ని సూచించే హీబ్రూ నుడికారం; తెలుగులో ‘కోపం చల్లారింది’ సహజంగా అదే భావాన్ని తెలియజేస్తుంది.
- source_word: בְּדַבְּרוֹ הַדָּבָר הַזֶּה
  choice: అతడు ఈ మాట చెప్పినప్పుడు
  rationale: ఈ నిర్మాణం ఆ ప్రతిస్పందన ఎప్పుడు సంభవించిందో తెలియజేస్తుంది. דָבָר ను ‘మాట’గా దగ్గరగా, సహజంగా అనువదించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కథన శైలి వాడాం. హీబ్రూ నుడికారాన్ని ప్రధాన పాఠంలో అర్థస్పష్టంగా అనువదించి, దాని అక్షర రూపాన్ని పాదసూచికలో నిలిపాం.
