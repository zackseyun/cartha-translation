  text: Then Jerubbaal son of Joash went and lived in his house[a].
translation:
  language: te
  text: అప్పుడు యోవాషు కుమారుడైన యెరుబ్బయలు వెళ్లి తన ఇంట్లో నివసించాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వెళ్లి తన ఇంట్లో స్థిరపడ్డాడు” లేదా “వెళ్లి తన ఇంట్లో నివాసమున్నాడు.” హీబ్రూ క్రియ కేవలం కూర్చోవడాన్ని మాత్రమే కాక, నివసించడాన్ని లేదా స్థిరపడడాన్ని కూడా సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: వెళ్లి
  rationale: క్రమంగా సాగే హీబ్రూ కథనంలో הלך సాధారణంగా ‘వెళ్లాడు’ అనే అర్థాన్నిస్తుంది. సందర్భం ఇంటికి తిరిగి వెళ్లడాన్ని సూచించవచ్చుగానీ, ‘తిరిగి’ అనే భావం క్రియలో స్పష్టంగా లేదు.
- source_word: יְרֻבַּעַל
  choice: యెరుబ్బయలు
  rationale: హీబ్రూ పాఠంలో ఉన్న పేరునే లిప్యంతరీకరించాం; దాని స్థానంలో ‘గిద్యోను’ అని పెట్టలేదు.
- source_word: בֶּן יוֹאָשׁ
  choice: యోవాషు కుమారుడైన
  rationale: ఇది తండ్రి-కొడుకు సంబంధాన్ని తెలిపే సాధారణ హీబ్రూ నిర్మాణానికి సహజమైన తెలుగు అనువాదం.
- source_word: וַיֵּשֶׁב
  choice: నివసించాడు
  rationale: ישב అనే క్రియకు ‘కూర్చున్నాడు,’ ‘నివసించాడు,’ ‘స్థిరపడ్డాడు’ అనే అర్థాలు ఉండవచ్చు. בְּבֵיתוֹతో కలిసినప్పుడు ఇక్కడ నివాసముండడమే సందర్భోచిత భావం.
- source_word: בְּבֵיתוֹ
  choice: తన ఇంట్లో
  rationale: ב ఉపసర్గ, ‘ఇల్లు’ అనే నామవాచకం, తృతీయ పురుష ఏకవచన ప్రత్యయం కలిసి అక్షరార్థంగా ‘అతని ఇంట్లో’ అని వస్తాయి. తెలుగు ప్రతిబింబక వాడుకలో కర్తకు చెందిన ఇంటిని ‘తన ఇంట్లో’ అని చెప్పడం సహజం.
- source_word: וַ...וַ
  choice: అప్పుడు ... వెళ్లి ... నివసించాడు
  rationale: వరుస వావ్-కన్సెక్యూటివ్ క్రియలు కథనాన్ని ముందుకు నడిపిస్తాయి. ‘అప్పుడు’ మరియు సంయుక్త క్రియారూపం ఆ క్రమాన్ని సహజమైన తెలుగులో చూపుతాయి.
