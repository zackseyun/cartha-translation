  to: వారు, “మేము తప్పకుండా ఇస్తాము[a]” అన్నారు. తరువాత వారు ఆ పైవస్త్రాన్ని[b] పరచారు; ప్రతి మనిషి తన దోపుడుసొమ్ములో నుండి ఒక చెవిపోగును[c] అక్కడ విసిరేశాడు.
