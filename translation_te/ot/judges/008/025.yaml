translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. హీబ్రూ ఉద్ఘాటనను ‘తప్పకుండా’తో నిలిపి, మూలంలో స్పష్టంగా లేని ‘సంతోషంగా’ అనే భావాన్ని చేర్చలేదు. נֶזֶם లోని నిజమైన అర్థసందిగ్ధతను ప్రధాన పాఠంలో సందర్భోచితమైన ‘పోగు’గా ఇచ్చి పాదటిప్పణిలో భద్రపరిచాం.
