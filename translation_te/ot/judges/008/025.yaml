  text: וַ/יֹּאמְר֖וּ נָת֣וֹן נִתֵּ֑ן וַֽ/יִּפְרְשׂוּ֙ אֶת הַ/שִּׂמְלָ֔ה וַ/יַּשְׁלִ֣יכוּ שָׁ֔מָּ/ה אִ֖ישׁ נֶ֥זֶם שְׁלָלֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/025.yaml
  text: And they said[a], “We will surely give them.” Then they spread out the cloak[c][b], and each man threw there an earring from his spoil.
translation:
  language: te
  text: వారు, “మేము తప్పకుండా ఇస్తాము[a]” అన్నారు. తరువాత వారు ఆ పైవస్త్రాన్ని[b] పరచారు; ప్రతి మనిషి తన దోపుడుసొమ్ములో నుండి ఒక చెవిపోగును[c] అక్కడ విసిరేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ఒకే ధాతువుకు చెందిన అనంతరూపాన్ని సమాపక క్రియతో కలిపి ఉద్ఘాటన చేశారు; అందువల్ల “మేము నిశ్చయంగా ఇస్తాము” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: 'హీబ్రూ: “ఆ వస్త్రం”; వస్తువులను స్వీకరించేందుకు పరచిన కప్పుకునే వస్త్రం లేదా పైవస్త్రం.'
    reason: cultural_note
  - marker: c
    text: “చెవిపోగు” అని అనువదించిన హీబ్రూ పదం విస్తృతంగా “ఉంగరం” అని కూడా అర్థమివ్వగలదు; కొన్ని సందర్భాల్లో అది ముక్కుపుడకను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָתוֹן נִתֵּן
  choice: మేము తప్పకుండా ఇస్తాము
  rationale: క్రియావిశేషక ధాతురూపంతో కూడిన సమాపక క్రియ ఇక్కడ ఇవ్వడాన్ని బలంగా నొక్కిచెబుతుంది. ‘తప్పకుండా’ ఆ ఉద్ఘాటనను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; సంతోషపూర్వక సంసిద్ధతను మూలపాఠంలో లేనంతగా చేర్చదు.
- source_word: הַשִּׂמְלָה
  choice: ఆ పైవస్త్రం
  rationale: שִׂמְלָה సాధారణంగా వస్త్రం లేదా కప్పుకునే పైవస్త్రాన్ని సూచిస్తుంది. వస్తువులను సేకరించేందుకు పరచిన వస్త్రం అనే దృశ్యాన్ని ‘పైవస్త్రం’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: וַיִּפְרְשׂוּ
  choice: పరచారు
  rationale: פרשׂ అంటే విప్పి పరచడం లేదా చాపడం. వస్త్రానికి సంబంధించి ‘పరచారు’ సహజమైన తెలుగు ప్రయోగం.
- source_word: וַיַּשְׁלִיכוּ שָׁמָּה
  choice: దానిపై వేశాడు
  rationale: שלך కి విసరడం లేదా వేయడం అనే బలమైన భావం ఉంది; שָׁמָּה అంటే ‘అక్కడ’. తెలుగులో ‘అక్కడ వేశాడు’కన్నా, ముందే పరచిన వస్త్రాన్ని సూచిస్తూ ‘దానిపై వేశాడు’ అనడం సహజంగా ఉంటుంది; ఇది సందర్భం నుంచి స్పష్టమయ్యే స్వల్ప వివరణ.
- source_word: אִישׁ
  choice: ప్రతి మనిషి
  rationale: ఇక్కడ אִישׁ విభక్తార్థకంగా ‘ఒక్కొక్క పురుషుడు/ప్రతి మనిషి’ అని అర్థం. మూలంలోని పురుష ఏకవచన పంపిణీ భావాన్ని ఇది నిలుపుతుంది.
- source_word: נֶזֶם
  choice: ఒక పోగు
  rationale: נֶזֶם చెవికి లేదా ముక్కుకు ధరించే ఉంగరాన్ని సందర్భానుసారం సూచించగలదు. మునుపటి వచనంలోని అభ్యర్థన మరియు మిద్యానీయుల దోపుడుసొమ్ము సందర్భంలో చెవిపోగు అత్యంత సంభావ్యమైన అర్థం; సంక్షిప్తంగా ‘పోగు’ సహజం.
- source_word: שְׁלָלוֹ
  choice: తాను కొల్లగొట్టిన దానిలోని
  rationale: שָׁלָל యుద్ధంలో స్వాధీనం చేసుకున్న దోపుడుసొమ్ము లేదా కొల్లసొమ్మును సూచిస్తుంది. ‘తాను కొల్లగొట్టిన దానిలోని’ సాధారణ పాఠకుడికి అర్థమయ్యే సహజమైన తెలుగు రూపం; 3వ పురుష ఏకవచన ప్రత్యయాన్ని కూడా ప్రతిబింబిస్తుంది.
