  yaml_path: translation/ot/judges/008/031.yaml
  text: And his concubine who was in Shechem also bore him a son[a], and he named him Abimelek.
translation:
  language: te
  text: షెకెములో ఉన్న అతని ఉపపత్ని కూడా అతనికి ఒక కుమారుణ్ణి కనింది. అతడు అతనికి అబీమెలెకు అని పేరు పెట్టాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּפִילַגְשׁוֹ
  choice: అతని ఉపపత్ని కూడా
  rationale: פִּילֶגֶשׁ ప్రధాన భార్యతో భిన్నమైన సామాజిక స్థితిగల స్త్రీని సూచిస్తుంది. అవమానార్థ ఛాయగల పదాలను నివారిస్తూ ఆ భేదాన్ని నిలిపేందుకు ‘ఉపపత్ని’ ఎంచుకోబడింది; వాక్యంలోని וּ మరియు తరువాతి גַם הִיא భావం తెలుగులో సహజంగా ‘కూడా’ ద్వారా వ్యక్తమైంది.
- source_word: אֲשֶׁר בִּשְׁכֶם
  choice: షెకెములో ఉన్న
  rationale: בִּ అనే స్థలార్థాన్ని నేరుగా ‘లో’తో వ్యక్తం చేసింది. ‘నివసించిన’ అని అనడం మూలంలో స్పష్టంగా లేని సమాచారాన్ని చేర్చుతుంది కాబట్టి ‘ఉన్న’ అని అనువదించబడింది.
- source_word: יָלְדָה לּוֹ גַם הִיא בֵּן
  choice: కూడా అతనికి ఒక కుమారుణ్ణి కనింది
  rationale: יָלְדָה לּוֹ అనే ప్రయోగాన్ని సహజమైన తెలుగులో ‘అతనికి … కనింది’గా ఇచ్చి, גַם הִיא లోని ‘ఆమె కూడా’ అనే భావాన్ని నిలిపింది.
- source_word: וַיָּשֶׂם אֶת־שְׁמוֹ
  choice: అతడు అతనికి … అని పేరు పెట్టాడు
  rationale: అక్షరార్థంగా ‘అతని పేరును ఉంచాడు’ అనే హీబ్రూ నుడికారానికి తెలుగులో సహజమైన సమానార్థక ప్రయోగం ‘పేరు పెట్టాడు.’ మూలంలోని పురుష ఏకవచన కర్తను పేరు చేర్చి నిర్దిష్టం చేయకుండా ‘అతడు’గానే ఉంచింది.
- source_word: אֲבִימֶלֶךְ
  choice: అబీమెలెకు
  rationale: హీబ్రూ పేరును తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన, ఉచ్చరించడానికి సహజమైన రూపంలో లిప్యంతరీకరించింది.
theological_decisions:
- issue: పేరు పెట్టిన వ్యక్తి ఎవరో సర్వనామం ద్వారా మాత్రమే సూచించబడటం
  choice: అతడు
  alternative: గిద్యోను
  rationale: సందర్భం కర్తను గిద్యోనుగా సూచించినా, ఈ వచనంలోని హీబ్రూ పాఠం పేరును కాక పురుష ఏకవచన క్రియారూపాన్ని మాత్రమే ఉపయోగిస్తుంది. అందువల్ల మూలంలోని సూచన విధానాన్ని నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడబడింది. ‘ఉపపత్ని’ సామాజిక స్థితి భేదాన్ని తెలిపే అధికారిక పదంగా ఎంచుకోబడింది; మరింత అవమానార్థకమైన సాధారణ పదాలు నివారించబడ్డాయి.
