translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘ఇదిగో,’ ‘నీ చేతిలో’ వంటి మూల రూపకాలను అర్థస్పష్టత కోల్పోకుండా నిలిపాం. గిద్యోను వారి పూర్వపు ఎద్దేవాను తిరిగి ఉటంకిస్తున్నాడని చూపేందుకు ‘అన్నారు కదా’ ఉపయోగించాం.
