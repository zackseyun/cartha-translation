  text: וַ/יָּבֹא֙ אֶל אַנְשֵׁ֣י סֻכּ֔וֹת וַ/יֹּ֕אמֶר הִנֵּ֖ה זֶ֣בַח וְ/צַלְמֻנָּ֑ע אֲשֶׁר֩ חֵרַפְתֶּ֨ם אוֹתִ֜/י לֵ/אמֹ֗ר הֲ֠/כַף זֶ֣בַח וְ/צַלְמֻנָּ֤ע עַתָּה֙ בְּ/יָדֶ֔/ךָ כִּ֥י נִתֵּ֛ן לַ/אֲנָשֶׁ֥י/ךָ הַ/יְּעֵפִ֖ים לָֽחֶם־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/015.yaml
  text: Then he came to the men of Succoth and said[a], “Here are Zebah and Zalmunna, about whom you taunted me, saying, ‘Are Zebah and Zalmunna already in your hand[b], that we should give bread to your weary men?’”
translation:
  language: te
  text: 'తరువాత అతడు సుక్కోతు పురుషుల దగ్గరకు వచ్చి ఇలా అన్నాడు: “ఇదిగో జెబహు, సల్మున్నా! ‘జెబహు, సల్మున్నా ఇప్పుడే నీ చేతిలో ఉన్నారా, మేము నీ అలసిన మనుషులకు రొట్టె ఇవ్వడానికి?’ అని వీరిని గురించి మీరు నన్ను ఎగతాళి చేశారు.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַנְשֵׁי סֻכּוֹת
  choice: సుక్కోతు పురుషులు
  rationale: అక్షరార్థంగా ‘సుక్కోతు పురుషులు.’ సందర్భంలో గిద్యోనుతో మాట్లాడిన పట్టణపు పురుషులను సూచిస్తుంది; విస్తృతమైన ‘ప్రజలు’ కంటే మూలంలోని లింగ, సామాజిక భావాన్ని నిలుపుతుంది.
- source_word: הִנֵּה
  choice: ఇదిగో
  rationale: కళ్లముందున్న వ్యక్తులవైపు దృష్టి మళ్లించే సూచనార్థక అవ్యయం; ఆధునిక తెలుగులో సహజంగా, గంభీరంగా ఉంది.
- source_word: זֶבַח וְצַלְמֻנָּע
  choice: జెబహు, సల్మున్నా
  rationale: వ్యక్తుల పేర్లను హీబ్రూ రూపాలకు దగ్గరగా లిప్యంతరీకరించాం.
- source_word: אֲשֶׁר חֵרַפְתֶּם אוֹתִי
  choice: వీరిని గురించి మీరు నన్ను ఎగతాళి చేస్తూ
  rationale: חרף అవమానకరమైన నింద లేదా ఎద్దేవాను సూచిస్తుంది. ఈ రాజులను పట్టుకోలేనని గిద్యోనును హేళన చేసిన సందర్భాన్ని ‘ఎగతాళి’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לֵאמֹר
  choice: అని
  rationale: ముందు పలికిన మాటలను ప్రత్యక్ష ఉక్తిగా పరిచయం చేసే సాధారణ తెలుగు రూపం.
- source_word: הֲכַף ... בְּיָדֶךָ
  choice: ఇప్పుడు నీ చేతిలో ఉన్నారా
  rationale: పట్టుబడి ఆధీనంలో ఉండటాన్ని సూచించే హీబ్రూ చేతి రూపకాన్ని తెలుగులోనూ సహజంగా నిలిపింది; עַתָּה ను ‘ఇప్పుడు’గా అనువదించింది.
- source_word: כִּי נִתֵּן
  choice: అలాంటప్పుడు మేము ... ఎందుకు ఇవ్వాలి?
  rationale: వారి నిరాకరణలోని అలంకార ప్రశ్న భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది. సందర్భానుసారంగా ‘వారు నీ చేతిలో ఉంటేనే మేము ఇవ్వాలా?’ అనే వ్యంగ్య కారణ-ఫలిత సంబంధం స్పష్టమవుతుంది.
- source_word: לַאֲנָשֶׁיךָ הַיְּעֵפִים
  choice: నీ అలసిపోయిన మనుషులకు
  rationale: యుద్ధపు వెంటాడటంతో కలిగిన తీవ్రమైన అలసటను సూచిస్తుంది; ‘మనుషులు’ మూలంలోని אֲנָשִׁים ను నిలుపుతుంది.
- source_word: לָחֶם
  choice: రొట్టె
  rationale: మూల పదానికి ప్రత్యక్ష సమానార్థకం; సందర్భంలో ఆహారాన్ని సూచించినా, నిర్దిష్ట ‘రొట్టె’ రూపాన్ని నిలుపుతుంది.
