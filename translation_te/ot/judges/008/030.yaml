id: JDG.8.30
reference: Judges 8:30
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/לְ/גִדְע֗וֹן הָיוּ֙ שִׁבְעִ֣ים בָּנִ֔ים יֹצְאֵ֖י יְרֵכ֑/וֹ כִּֽי נָשִׁ֥ים רַבּ֖וֹת הָ֥יוּ לֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/030.yaml
  text: Gideon had seventy sons[a], his own offspring, because he had many wives.
translation:
  language: te
  text: గిద్యోనుకు డెబ్బై మంది సొంత కుమారులు ఉన్నారు[a], ఎందుకంటే అతనికి అనేకమంది భార్యలు ఉండేవారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “అతని నడుము నుండి బయలుదేరినవారు”; ఇది అతని జీవసంబంధ సంతానాన్ని సూచించే హీబ్రూ నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְגִדְעוֹן הָיוּ
  choice: గిద్యోనుకు ... ఉన్నారు
  rationale: లְ + היה అనే హీబ్రూ నిర్మాణం స్వామ్యాన్ని సూచిస్తుంది. తెలుగులో ‘గిద్యోనుకు ... ఉన్నారు’ అనేది సహజంగా, గౌరవవాచక క్రియతో వ్యక్తమవుతుంది. ప్రారంభ וּ సందర్భానుసంధానాన్ని ఇస్తుంది; ఇక్కడ ప్రత్యేకంగా ‘మరియు’ చేర్చనవసరం లేదు.
- source_word: שִׁבְעִים בָּנִים
  choice: డెబ్బై మంది కుమారులు
  rationale: בָּנִים ఇక్కడ సాధారణంగా పిల్లలు కాదు, ప్రత్యేకంగా కుమారులు. వ్యక్తులను లెక్కించడానికి ‘మంది’ సహజమైన తెలుగు ప్రయోగం.
- source_word: יֹצְאֵי יְרֵכוֹ
  choice: తన సొంత సంతానమైన
  rationale: అక్షరార్థంగా ‘అతని తొడ/నడుము నుండి బయలుదేరినవారు’ అనే శరీరాధారిత హీబ్రూ నుడికారం; భావం అతని జీవసంబంధ సంతానం. ప్రధాన వాక్యంలో సహజమైన రూపాన్ని ఇచ్చి, అక్షరార్థాన్ని పాదసూచికలో నిలిపాం.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ఇది గిద్యోనుకు అంతమంది కుమారులు ఉండడానికి కారణాన్ని పరిచయం చేస్తుంది.
- source_word: נָשִׁים רַבּוֹת הָיוּ לוֹ
  choice: అతనికి అనేకమంది భార్యలు ఉండేవారు
  rationale: ఈ కుటుంబ సందర్భంలో נָשִׁים అంటే కేవలం స్త్రీలు కాక భార్యలు; היה + ל స్వామ్యసంబంధాన్ని సూచిస్తుంది. ‘ఉండేవారు’ కొనసాగిన కుటుంబస్థితిని సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: బహుభార్యత్వ కుటుంబ పరిస్థితి వర్ణన
  choice: ‘అనేకమంది భార్యలు’ అని విలువతీర్పు లేకుండా వర్ణనాత్మకంగా అనువదించడం
  alternative: ‘అనేకమంది స్త్రీలు’ అని సంబంధాన్ని అస్పష్టపరచడం, లేదా ఆచారంపై సమ్మతి/ఖండనను అనువాదంలో చేర్చడం
  rationale: వచనం గిద్యోను కుటుంబ పరిస్థితిని నివేదిస్తుంది గాని దానిపై స్పష్టమైన నైతిక తీర్పు ఇవ్వదు. కాబట్టి వివాహసంబంధ భావాన్ని దాచకూడదు; పాఠ్యంలో లేని ఆమోదం లేదా ఖండనను కూడా చేర్చకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన వాక్యనిర్మాణం వాడబడింది. ‘సొంత సంతానం’ జీవసంబంధాన్ని స్పష్టపరుస్తుంది; మూలంలోని శరీరాధారిత నుడికారాన్ని పాదసూచిక సంరక్షిస్తుంది. పాదసూచిక గుర్తు సంబంధిత పదబంధం ముగింపున ఉంచబడింది.
