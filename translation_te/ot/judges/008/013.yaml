  text: Then Gideon son of Joash returned from the battle by the ascent of Heres[a].
translation:
  language: te
  text: అప్పుడు యోవాషు కుమారుడైన గిద్యోను యుద్ధం నుండి హెరెసు ఎక్కుదారి గుండా తిరిగి వచ్చాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సూర్యుని ఎక్కుదారి నుండి.” హీబ్రూ పదబంధం అర్థం స్పష్టంగా లేదు; הֶחָרֶס అనే పదాన్ని “హెరెసు” అనే స్థలపేరుగానో, “సూర్యుడు” అనే అర్థంలోనో గ్రహించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: అప్పుడు ... తిరిగి వచ్చాడు
  rationale: కథనాన్ని ముందుకు నడిపించే wayyiqtol రూపాన్ని సహజమైన తెలుగు భూతకాల వాక్యంగా అనువదించాం; ‘అప్పుడు’ కథన క్రమాన్ని తెలియజేస్తుంది.
- source_word: גִּדְעוֹן בֶּן יוֹאָשׁ
  choice: యోవాషు కుమారుడైన గిద్యోను
  rationale: హీబ్రూ పితృనామ నిర్మాణాన్ని సహజమైన తెలుగు సంబంధవాచక రూపంలో ఉంచాం; వ్యక్తి పేర్లను తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: מִן הַמִּלְחָמָה
  choice: యుద్ధం నుండి
  rationale: מִלְחָמָה అనే పదానికి ‘యుద్ధం’ లేదా ‘పోరాటం’ అనే భావాలు ఉండవచ్చు; ఇక్కడ నిర్దిష్ట సైనిక సమరాన్ని సూచించినా, ‘యుద్ధం’ సహజంగా మరియు విస్తృతంగా అర్థమవుతుంది.
- source_word: מִלְמַעֲלֵה
  choice: ఎక్కుదారి మీదుగా
  rationale: מַעֲלֶה కొండపైకి వెళ్లే దారి లేదా ఎక్కే ప్రదేశాన్ని సూచిస్తుంది. సందర్భంలో మార్గసూచక భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: הֶחָרֶס
  choice: హెరెసు
  rationale: ఇది స్థలపేరుగా ఉండవచ్చనే ప్రధాన పఠనాన్ని లిప్యంతరీకరించాం; ‘సూర్యుడు’ అనే సాధ్యమైన సామాన్యనామ అర్థాన్ని పాదసూచికలో నిలిపాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని వాడాం. హీబ్రూ పదబంధంలోని భౌగోళిక/పదార్థ సందిగ్ధతను ప్రధాన పాఠ్యం మరియు పాదసూచిక ద్వారా అలాగే నిలిపాం.
