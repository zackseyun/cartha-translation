source:
  edition: WLC
  text: וַ/יַּעַשׂ֩ אוֹת֨/וֹ גִדְע֜וֹן לְ/אֵפ֗וֹד וַ/יַּצֵּ֨ג אוֹת֤/וֹ בְ/עִיר/וֹ֙ בְּ/עָפְרָ֔ה וַ/יִּזְנ֧וּ כָֽל יִשְׂרָאֵ֛ל אַחֲרָ֖י/ו שָׁ֑ם וַ/יְהִ֛י לְ/גִדְע֥וֹן וּ/לְ/בֵית֖/וֹ לְ/מוֹקֵֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/027.yaml
  text: Gideon made it into an ephod and set it up in his city[a], in Ophrah. And all Israel prostituted themselves after it there[b], and it became a snare to Gideon and to his house.
translation:
  language: te
  text: గిద్యోను దానితో ఒక ఏఫోదును[a] చేసి, దానిని తన పట్టణమైన ఒఫ్రాలో నిలిపాడు. ఇశ్రాయేలీయులందరూ అక్కడ దాని వెంబడి వ్యభిచారం చేశారు[b]. అది గిద్యోనుకు, అతని ఇంటివారికి ఉచ్చుగా మారింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ఏఫోదు’ యాజక సేవతో సంబంధమున్న వస్తువు లేదా వస్త్రం. అయితే ఇక్కడ దాని ఖచ్చితమైన రూపం లేదా ఉపయోగం ఏమిటో వచనం పూర్తిగా చెప్పదు.
    reason: cultural_note
  - marker: b
    text: మూలభాషలోని మాట అక్షరార్థంగా లైంగిక వ్యభిచారాన్ని సూచిస్తుంది; ఇక్కడ అది విగ్రహారాధన ద్వారా ఇశ్రాయేలు చూపిన అవిశ్వాసానికి రూపకం.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְאֵפוֹד
  choice: ఒక ఏఫోదును
  rationale: 'ల ఉపసర్గతో కూడిన עשה ఇక్కడ ఫలితాన్ని సూచిస్తుంది: ఆ బంగారాన్ని ఏఫోదుగా చేయించాడు. ఏఫోదు రూపం లేదా పని ఏమిటో వచనం పూర్తిగా నిర్దేశించనందున పదాన్ని లిప్యంతరీకరించాం.'
- source_word: וַיַּצֵּג
  choice: నిలబెట్టాడు
  rationale: ఈ క్రియ ఏదో ఒక వస్తువును నిలిచేలా ఉంచడం లేదా ప్రతిష్ఠించడం అనే భావాన్ని ఇస్తుంది. ఆరాధనా వస్తువుగా నిర్దిష్టంగా వ్యాఖ్యానించకుండా 'నిలబెట్టాడు' మూలభావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: בְעִירוֹ בְעָפְרָה
  choice: తన పట్టణమైన ఒఫ్రాలో
  rationale: రెండు స్థానపదబంధాలను తెలుగులో సహజమైన సమానాధికార నిర్మాణంగా కలిపాం; עִיר ను నివాసస్థల పరిమాణాన్ని అతిశయింపజేయని 'పట్టణం'గా అనువదించాం.
- source_word: וַיִּזְנוּ ... אַחֲרָיו
  choice: దాని వెంట వ్యభిచారుల్లా వెళ్లారు
  rationale: זנה లోని లైంగిక అవిశ్వాస రూపకాన్ని నిలుపుతూ, తెలుగులో ఈ సందర్భానికి సహజంగా అర్థమయ్యేలా ఉపమాన రూపంలో ఇచ్చాం. సర్వనామం ఏఫోదునే సూచిస్తుంది.
- source_word: שָׁם
  choice: అక్కడ
  rationale: ఈ ప్రవర్తన ఒఫ్రాలోనే జరిగిందనే కథన ప్రాధాన్యాన్ని నిలుపుతుంది.
- source_word: לְמוֹקֵשׁ
  choice: ఉచ్చుగా
  rationale: מוֹקֵשׁ యొక్క ఉచ్చు/ప్రమాదకరమైన చిక్కు అనే రూపకాన్ని నేరుగా నిలుపుతుంది.
- source_word: וּלְבֵיתוֹ
  choice: అతని ఇంటివారికి
  rationale: בַּיִת ఇక్కడ భవనం కంటే గిద్యోను కుటుంబం లేదా గృహస్థులను సూచిస్తుంది; 'ఇంటివారు' ఆధునిక తెలుగులో ఆ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ఏఫోదు పట్ల ఇశ్రాయేలు చూపిన విగ్రహారాధనా స్పందనలోని రూపకం
  choice: '''దాని వెంట వ్యభిచారుల్లా వెళ్లారు'' అని లైంగిక అవిశ్వాస చిత్రాన్ని నిలుపడం'
  alternative: '''దాని వెంట దారి తప్పారు'' లేదా ''దానికి అవిశ్వాసులయ్యారు'''
  rationale: זנה బలమైన లైంగిక రూపకం ద్వారా ఆరాధనా/నిబంధన అవిశ్వాసాన్ని తెలియజేస్తుంది. దానిని సాధారణ అవిధేయతగా మృదువుపరచకుండా, తెలుగు పాఠకులకు అర్థమయ్యే రూపంలో నిలిపాం.
- issue: గిద్యోను చేసిన ఏఫోదు స్వరూపం
  choice: దానిని 'ఏఫోదు' అనే పేరుతోనే పేర్కొని, దాని ఖచ్చిత రూపం లేదా ఉపయోగాన్ని ప్రధాన వచనంలో నిర్ణయించకపోవడం
  alternative: '''యాజక వస్త్రం'', ''విగ్రహం'' లేదా ''పవిత్ర ప్రతిమ'''
  rationale: హీబ్రూ వచనం వస్తువుకు పేరు చెబుతుంది గాని అది వస్త్రమా, ప్రతిమా, దైవవిచారణ వస్తువా అనే ప్రశ్నను పూర్తిగా పరిష్కరించదు. అందువల్ల అసలు అస్పష్టతను కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా చదవగల కథన శైలి వాడబడింది. ఏఫోదు స్వరూపంపై ఉన్న అస్పష్టతను కాపాడి, זנה లోని బలమైన అవిశ్వాస రూపకాన్ని మృదువుపరచకుండా సహజ తెలుగులో వ్యక్తం చేశాం. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
