revisions:
- from: గిద్యోను ఆ బంగారంతో ఒక ఏఫోదును చేయించి, దానిని తన పట్టణమైన ఒఫ్రాలో నిలబెట్టాడు. ఇశ్రాయేలీయులందరూ అక్కడ దాని వెంట వ్యభిచారుల్లా వెళ్లారు[a]. అది గిద్యోనుకు, అతని ఇంటివారికి ఉచ్చుగా మారింది.[b]
  to: గిద్యోను దానితో ఒక ఏఫోదును[a] చేసి, దానిని తన పట్టణమైన ఒఫ్రాలో నిలిపాడు. ఇశ్రాయేలీయులందరూ అక్కడ దాని వెంబడి వ్యభిచారం చేశారు[b]. అది గిద్యోనుకు, అతని ఇంటివారికి ఉచ్చుగా మారింది.
