translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కథన శైలి వాడబడింది. మూలంలోని పురుషలింగ సూచనను ప్రధాన పాఠ్యంలో నిలిపి, దాని సామాజిక పరిధిని పాదసూచికలో వివరించాం. שָׁלוֹם యొక్క సందర్భార్థాన్ని ‘క్షేమంగా’గా అనువదించి, అక్షరార్థం మరియు ఇతర సాధ్యార్థాలను పాదసూచికలో భద్రపరిచాం.
