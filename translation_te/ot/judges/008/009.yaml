  to: 'అతడు పెనూయేలు పురుషులకు కూడా ఇలా చెప్పాడు: “నేను క్షేమంగా తిరిగి వచ్చినప్పుడు[b], ఈ గోపురాన్ని[c] కూలగొడతాను.”'
  rationale: The revision removes the unsupported addition 'పట్టణపు' and changes the recipient phrase to the clearer dative construction. The cultural note is retained and adjusted to match the revised wording. The unused footnote marker a is intentionally omitted from the main text because it explains the translated expression as a whole rather than introducing a lexical alternative; however, it should be anchored to 'పెనూయేలు పురుషులకు' if the publication system requires every footnote to have an in-text anchor.
