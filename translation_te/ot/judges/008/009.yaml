source:
  edition: WLC
  text: וַ/יֹּ֛אמֶר גַּם לְ/אַנְשֵׁ֥י פְנוּאֵ֖ל לֵ/אמֹ֑ר בְּ/שׁוּבִ֣/י בְ/שָׁל֔וֹם אֶתֹּ֖ץ אֶת הַ/מִּגְדָּ֥ל הַ/זֶּֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/009.yaml
  text: He also said to the men of Penuel[a], “When I return in peace[c][b], I will tear down this tower.”
translation:
  language: te
  text: 'అతడు పెనూయేలు పురుషులకు కూడా ఇలా చెప్పాడు: “నేను క్షేమంగా తిరిగి వచ్చినప్పుడు[b], ఈ గోపురాన్ని[c] కూలగొడతాను.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: హెబ్రీలో అక్షరార్థంగా “శాంతితో.” ఇక్కడ “సురక్షితంగా,” “విజయవంతంగా, హాని లేకుండా” అనే భావం ఉండవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: “గోపురం” అనేది పెనూయేలులోని రక్షణ బురుజును లేదా పటిష్ఠమైన ఆశ్రయ నిర్మాణాన్ని సూచించి ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: కూడా
  rationale: మునుపటి పట్టణ ప్రజలతో గిద్యోను చెప్పిన మాటలకు దీనిని అదనంగా కలుపుతుంది; హెబ్రీ సంధాన భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: לְאַנְשֵׁי פְנוּאֵל
  choice: పెనూయేలు పట్టణపు పురుషులతో
  rationale: אַנְשֵׁי అనే పదానికి అక్షరార్థంగా ‘పురుషులు’ అని అర్థం. తెలుగు వాక్యంలో స్థలపేరు స్పష్టంగా ఉండేందుకు ‘పట్టణపు’ చేర్చబడింది; ఇది బహుశా అక్కడి పురుష నాయకులు లేదా ప్రతినిధులను సూచిస్తుంది.
- source_word: בְּשׁוּבִי
  choice: నేను ... తిరిగి వచ్చినప్పుడు
  rationale: בְּ ఉపసర్గతో కూడిన ప్రథమ పురుష ఏకవచన ప్రత్యయాంత క్రియానామం కాలార్థాన్ని ఇస్తుంది; ఆధునిక తెలుగులో ఈ రూపం సహజం.
- source_word: בְשָׁלוֹם
  choice: క్షేమంగా
  rationale: ఈ యుద్ధ సందర్భంలో שָׁלוֹם సురక్షితంగా, హాని లేకుండా, విజయవంతంగా తిరిగి రావడాన్ని సూచించవచ్చు. ‘క్షేమంగా’ సహజమైన తెలుగులో ఆ సందర్భార్థాన్ని అందిస్తుంది; మూలంలోని విస్తృత భావాన్ని పాదసూచిక తెలియజేస్తుంది.
- source_word: אֶתֹּץ
  choice: కూలగొడతాను
  rationale: נתץ ధాతువు నిర్మాణాన్ని పడగొట్టడం లేదా ధ్వంసం చేయడం అనే బలమైన భావాన్ని కలిగి ఉంది; ‘కూలగొడతాను’ స్పష్టమైన, సహజమైన తెలుగు.
- source_word: הַמִּגְדָּל הַזֶּה
  choice: ఈ గోపురాన్ని
  rationale: מִגְדָּל సాధారణంగా ‘గోపురం’ లేదా ‘బురుజు’; ప్రధాన పాఠ్యంలో దాని స్పష్టమైన నిర్మాణార్థాన్ని నిలుపుతూ, రక్షణ కోటగా ఉండవచ్చనే అవకాశాన్ని పాదసూచికలో ఉంచాం.
