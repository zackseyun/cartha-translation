revisions:
- from: గిద్యోను చనిపోయినప్పుడు, ఇశ్రాయేలీయులు మళ్లీ వెనుదిరిగి బయలులను అనుసరిస్తూ వ్యభిచరించారు[a]. వారు బయల్-బెరీతును తమకు దేవుడిగా చేసుకున్నారు[b].
  to: గిద్యోను చనిపోయినప్పుడు, ఇశ్రాయేలీయులు మళ్లీ తిరిగి బయలుల వెంట వ్యభిచారం చేశారు[a]. వారు బయల్బెరీతును తమకు దేవునిగా చేసుకున్నారు[b].
  rationale: The revision removes a potentially misleading participial construction, renders the Hebrew idiom זנה אחרי more naturally while preserving its sexual metaphor, and standardizes the transliterated cultic name. Footnote markers remain attached to the relevant expressions.
