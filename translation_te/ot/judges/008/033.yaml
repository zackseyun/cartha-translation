  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְהִ֗י כַּֽ/אֲשֶׁר֙ מֵ֣ת גִּדְע֔וֹן וַ/יָּשׁ֨וּבוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וַ/יִּזְנ֖וּ אַחֲרֵ֣י הַ/בְּעָלִ֑ים וַ/יָּשִׂ֧ימוּ לָ/הֶ֛ם בַּ֥עַל בְּרִ֖ית לֵ/אלֹהִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/033.yaml
  text: And it happened that[a], when Gideon died, the sons of Israel turned back and prostituted themselves after the Baals[b], and they made Baal-berith their god.
translation:
  language: te
  text: గిద్యోను చనిపోయినప్పుడు, ఇశ్రాయేలీయులు మళ్లీ తిరిగి బయలుల వెంట వ్యభిచారం చేశారు[a]. వారు బయల్బెరీతును తమకు దేవునిగా చేసుకున్నారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరో విధంగా: “బయలుల వెంట వ్యభిచారుల్లా తిరిగారు.” హీబ్రూ విగ్రహారాధనలోని అవిశ్వాసాన్ని లైంగిక రూపకంతో వర్ణిస్తుంది.'
    reason: lexical_alternative
  - marker: b
    text: “బయల్బెరీతు” అనే పేరుకు “నిబంధనకు చెందిన బయలు” లేదా “నిబంధన ప్రభువు” అని అర్థం కావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: చనిపోయినప్పుడు
  rationale: ఈ హీబ్రూ కథన సూత్రం కాలపరమైన మార్పును పరిచయం చేస్తుంది. తెలుగులో ప్రత్యేకంగా ‘అప్పుడు ఇలా జరిగింది’ అని చేర్చడం భారంగా ఉండేందున, సహజమైన కాలవాచక ఉపవాక్యంతో భావాన్ని అందించాం.
- source_word: וַיָּשׁוּבוּ
  choice: మళ్లీ వెనుదిరిగి
  rationale: ఇది భౌతికంగా తిరిగి రావడం కాదు; పూర్వపు విగ్రహారాధనలోకి మళ్లీ జారిపోవడాన్ని సూచిస్తుంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులు
  rationale: ఇక్కడ ఈ పదబంధం ఇశ్రాయేలు ప్రజలను సమష్టిగా సూచిస్తుంది; ఆధునిక తెలుగులో ‘ఇశ్రాయేలీయులు’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: וַיִּזְנוּ אַחֲרֵי
  choice: అనుసరిస్తూ వ్యభిచరించారు
  rationale: זנה లోని లైంగిక రూపకాన్ని నిలుపుతూ, אַחֲרֵי లోని అనుసరణ భావాన్ని తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: הַבְּעָלִים
  choice: బయలులు
  rationale: బయలు ఆరాధనకు సంబంధించిన వివిధ స్థానిక రూపాలు లేదా దేవతా ప్రతిరూపాలను సూచించే హీబ్రూ బహువచనాన్ని నిలిపాం.
- source_word: בַּעַל בְּרִית
  choice: బయల్-బెరీతు
  rationale: ఇది ప్రత్యేక ఆరాధనా నామం కాబట్టి ప్రధాన పాఠ్యంలో లిప్యంతరీకరించి, దాని అర్థాన్ని పాదటీపులో ఇచ్చాం.
- source_word: וַיָּשִׂימוּ לָהֶם ... לֵאלֹהִים
  choice: తమకు దేవుడిగా చేసుకున్నారు
  rationale: తమ కోసం ఒక దేవతగా నియమించుకోవడం లేదా స్వీకరించడం అనే భావాన్ని సహజమైన తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: విగ్రహారాధనకు ఉపయోగించిన లైంగిక రూపకం
  choice: బయలులను అనుసరిస్తూ వ్యభిచరించారు
  alternative: బయలులను అనుసరించి దేవునికి నమ్మకద్రోహం చేశారు
  rationale: హీబ్రూ זנה ఉద్దేశపూర్వకంగా బలమైన లైంగిక రూపకాన్ని ఉపయోగిస్తుంది. దాన్ని మృదువుగా మార్చకుండా ఉంచడం ఇశ్రాయేలు ఆధ్యాత్మిక విశ్వాసఘాతుకతలోని తీవ్రతను కాపాడుతుంది.
- issue: בְּנֵי יִשְׂרָאֵל అనువాదం
  choice: ఇశ్రాయేలీయులు
  alternative: ఇశ్రాయేలు కుమారులు
  rationale: ఇక్కడ మొత్తం ప్రజాసమూహమే ఉద్దేశం. తెలుగులో ‘ఇశ్రాయేలు కుమారులు’ అనేది కేవలం పురుషులను సూచిస్తున్నట్లు అపార్థం కావచ్చు; ‘ఇశ్రాయేలీయులు’ సమష్టి భావాన్ని సహజంగా అందిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కథన శైలి. హీబ్రూ వాక్యంలోని దీర్ఘ సమన్వయ నిర్మాణాన్ని పఠన సౌలభ్యం కోసం రెండు వాక్యాలుగా విభజించాం. బలమైన వ్యభిచార రూపకాన్ని నిలిపి, దాని ఆధ్యాత్మిక సందర్భాన్ని పాదటీపులో స్పష్టం చేశాం.
