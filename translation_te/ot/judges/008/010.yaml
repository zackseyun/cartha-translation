  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్య నిర్మాణం. హీబ్రూలోని బహువచన ‘శిబిరాలు,’ సుమారు సంఖ్య, యుద్ధ నుడికారం నిలుపబడ్డాయి.
