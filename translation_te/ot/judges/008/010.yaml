source:
  edition: WLC
  text: וְ/זֶ֨בַח וְ/צַלְמֻנָּ֜ע בַּ/קַּרְקֹ֗ר וּ/מַחֲנֵי/הֶ֤ם עִמָּ/ם֙ כַּ/חֲמֵ֤שֶׁת עָשָׂר֙ אֶ֔לֶף כֹּ֚ל הַ/נּ֣וֹתָרִ֔ים מִ/כֹּ֖ל מַחֲנֵ֣ה בְנֵי קֶ֑דֶם וְ/הַ/נֹּ֣פְלִ֔ים מֵאָ֨ה וְ/עֶשְׂרִ֥ים אֶ֛לֶף אִ֖ישׁ שֹׁ֥לֵֽף חָֽרֶב־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/010.yaml
  text: Zebah and Zalmunna were in Karkor[a], and their camps were with them, about fifteen thousand men, all who were left from all the camp of the sons of the east; and those who had fallen were one hundred twenty thousand men drawing the sword.
translation:
  language: te
  text: జెబహు, సల్మున్నా కర్కోరులో ఉన్నారు. వారితోపాటు వారి శిబిరాలు కూడా ఉన్నాయి. తూర్పుదేశీయుల[a] మొత్తం శిబిరంలో మిగిలినవారందరూ దాదాపు పదిహేను వేలమంది. కత్తి దూసే లక్షా ఇరవై వేలమంది పడిపోయారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “తూర్పు కుమారుల.” అంటే తూర్పు ప్రాంతాల ప్రజలు.
    reason: హీబ్రూ జాతి-భౌగోళిక నుడికారాన్ని తెలియజేయడానికి.
lexical_decisions:
- source_word: בַּקַּרְקֹר
  choice: కర్కోరులో
  rationale: בְּ స్థలాన్ని సూచిస్తుంది; స్థలనామంతో సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: וּמַחֲנֵיהֶם עִמָּם
  choice: వారితోపాటు వారి శిబిరాలు కూడా ఉన్నాయి
  rationale: מַחֲנֵיהֶם అనే బహువచనాన్ని ‘శిబిరాలు’గా నిలిపి, עִמָּם భావాన్ని సహజంగా వ్యక్తం చేసింది.
- source_word: כַּחֲמֵשֶׁת עָשָׂר אֶלֶף
  choice: దాదాపు పదిహేను వేలమంది
  rationale: సంఖ్యకు ముందు ఉన్న כְּ సుమారు అనే భావాన్ని తెలియజేస్తుంది.
- source_word: כֹּל הַנּוֹתָרִים
  choice: మిగిలినవారు
  rationale: יתר యొక్క నిఫాల్ కృదంతం యుద్ధం తర్వాత మిగిలినవారిని సూచిస్తుంది.
- source_word: מִכֹּל מַחֲנֵה בְנֵי קֶדֶם
  choice: తూర్పుదేశీయుల శిబిరమంతటిలో
  rationale: מִן యొక్క సమూహంలోనుండి మిగిలిన భాగం అనే భావాన్ని తెలుగులో ‘శిబిరమంతటిలో మిగిలినవారు’గా సహజంగా తెలిపింది; בְנֵי קֶדֶם అనే జాతి-భౌగోళిక పదబంధానికి పాఠకసౌలభ్య రూపం ఇచ్చింది.
- source_word: וְהַנֹּפְלִים
  choice: పడిపోయినవారు
  rationale: యుద్ధంలో హతమైనవారిని సూచించే נפל పదంలోని చిత్రాత్మకతను నిలిపింది.
- source_word: אִישׁ שֹׁלֵף חָרֶב
  choice: కత్తి దూసేవారు
  rationale: సాయుధ యోధులను సూచించే హీబ్రూ యుద్ధ నుడికారంలోని సజీవ రూపకాన్ని సాధ్యమైనంతగా నిలిపింది.
