source:
  edition: WLC
  text: וַ/יַּ֤עַל מִ/שָּׁם֙ פְּנוּאֵ֔ל וַ/יְדַבֵּ֥ר אֲלֵי/הֶ֖ם כָּ/זֹ֑את וַ/יַּעֲנ֤וּ אוֹת/וֹ֙ אַנְשֵׁ֣י פְנוּאֵ֔ל כַּ/אֲשֶׁ֥ר עָנ֖וּ אַנְשֵׁ֥י סֻכּֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/008.yaml
  text: From there he went up to Penuel and spoke to them in the same way[b][a], and the men of Penuel answered him just as the men of Succoth had answered.
translation:
  language: te
  text: అక్కడి నుండి అతడు పెనూయేలుకు పైకి వెళ్లి, వారితో అదేవిధంగా మాట్లాడాడు.[a] పెనూయేలు[b] పురుషులు సుక్కోతు పురుషులు జవాబిచ్చినట్లే అతనికి జవాబిచ్చారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “వారితో ఈ విధంగా మాట్లాడాడు.” ఇది ముందటి వచనంలో చెప్పిన మాట లేదా చేసిన మనవినే సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: పెనూయేలు అనే పేరు ఇతర చోట్ల “పెనీయేలు” అని కూడా వ్రాయబడింది.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַל מִשָּׁם
  choice: అక్కడి నుండి అతడు ... వెళ్లి
  rationale: עלהలోని పైకి వెళ్లడం అనే దిశాభావం సందర్భంలో సహజ తెలుగు ప్రయోగంలో ప్రత్యేకంగా చెప్పనవసరం లేదు; ‘వెళ్లి’ ప్రయాణాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: פְּנוּאֵל
  choice: పెనూయేలు
  rationale: ఈ వచనంలోని హీబ్రూ వ్యంజన రూపానికి దగ్గరగా ఉన్న తెలుగు లిప్యంతరీకరణ.
- source_word: וַיְדַבֵּר אֲלֵיהֶם כָּזֹאת
  choice: వారితో కూడా అలాగే మాట్లాడాడు
  rationale: అక్షరార్థంగా ‘వారితో ఈ విధంగా మాట్లాడాడు’; ఇది ముందటి వచనంలో గిద్యోను చేసిన మనవినే వెనక్కి సూచిస్తున్నందున ‘కూడా అలాగే’ సహజంగా ఆ అన్వయాన్ని తెలియజేస్తుంది.
- source_word: וַיַּעֲנוּ אוֹתוֹ
  choice: అతనికి జవాబిచ్చారు
  rationale: ענה యొక్క ‘జవాబివ్వడం’ అనే సాధారణ అర్థాన్ని సంక్షిప్తంగా, సహజంగా అందిస్తుంది.
- source_word: אַנְשֵׁי פְנוּאֵל
  choice: పెనూయేలు పురుషులు
  rationale: אַנְשֵׁי అనే పుంలింగ సామాజిక సూచనను సాధారణీకరించకుండా నిలుపుతుంది.
- source_word: כַּאֲשֶׁר עָנוּ אַנְשֵׁי סֻכּוֹת
  choice: సుక్కోతు పురుషులు జవాబిచ్చినట్లే
  rationale: כַּאֲשֶׁרలోని పోలికను ‘జవాబిచ్చినట్లే’ స్పష్టంగా తెలియజేస్తుంది; తెలుగు క్రియారూపమే ముందుగా జరిగిన చర్యను సహజంగా సూచిస్తుంది.
- source_word: סֻכּוֹת
  choice: సుక్కోతు
  rationale: హీబ్రూ స్థలనామానికి సమీపమైన, తెలుగులో పలకడానికి అనువైన లిప్యంతరీకరణ.
