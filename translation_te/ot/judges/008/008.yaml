translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. స్థలనామాలు హీబ్రూ రూపాలకు దగ్గరగా లిప్యంతరీకరించబడ్డాయి; పాఠ్యంలో ఉన్న పుంలింగ సూచన నిలుపబడింది.
