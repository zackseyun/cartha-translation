- from: అక్కడి నుండి అతడు పెనూయేలుకు వెళ్లి, వారితో కూడా అలాగే మాట్లాడాడు.[a] పెనూయేలు పురుషులు సుక్కోతు పురుషులు జవాబిచ్చినట్లే అతనికి జవాబిచ్చారు.
  to: అక్కడి నుండి అతడు పెనూయేలుకు పైకి వెళ్లి, వారితో అదేవిధంగా మాట్లాడాడు.[a] పెనూయేలు[b] పురుషులు సుక్కోతు పురుషులు జవాబిచ్చినట్లే అతనికి జవాబిచ్చారు.
