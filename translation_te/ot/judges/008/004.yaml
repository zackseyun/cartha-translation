  source_fidelity: 'ముసాయిదా ప్రధానార్థాన్ని బాగా అందిస్తుంది: గిద్యోను యొర్దాను వద్దకు వచ్చాడు, అతడు అలసిపోయినప్పటికీ వెంటాడడం కొనసాగించాడు. అయితే మూలంలోని עֹבֵר הוּא וּשְׁלֹשׁ מֵאוֹת הָאִישׁ నిర్మాణం గిద్యోనుతో పాటు అతనితో ఉన్న మూడువందల మంది కూడా దాటుతున్నారనే భావాన్ని కలిగిస్తుంది. ప్రస్తుత రెండు వాక్యాల విభజనలో దాటినవాడు గిద్యోను ఒక్కడేనన్న సూచన కలుగుతుంది.'
