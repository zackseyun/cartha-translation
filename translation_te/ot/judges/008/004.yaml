  text: Then Gideon came to the Jordan and crossed over[a], he and the three hundred men who were with him, exhausted yet pursuing.
translation:
  language: te
  text: గిద్యోను, అతనితో ఉన్న మూడువందల మందితో కలిసి, యొర్దాను నదికి వచ్చి దాటాడు; వారు అలసిపోయి ఉన్నప్పటికీ వెంబడిస్తూనే ఉన్నారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  choice: వచ్చి
  rationale: בוא ఇక్కడ గమ్యస్థానమైన యొర్దాను దగ్గరికి చేరడాన్ని సూచిస్తుంది; తెలుగు కథన ప్రవాహంలో ‘వచ్చి’ సహజంగా ఉంది.
- source_word: הַיַּרְדֵּנָה
  choice: యొర్దాను నది దగ్గరికి
  rationale: దిశాసూచక ה గమనం యొర్దాను వైపు అని తెలియజేస్తుంది. సాధారణ తెలుగు పాఠకునికి అది నది అని స్పష్టంచేయడానికి ‘నది’ చేర్చబడింది.
- source_word: עֹבֵר הוּא
  choice: దాన్ని దాటాడు
  rationale: కర్తను బలపరిచే సర్వనామంతో కూడిన కృదంత రూపం గిద్యోను స్వయంగా దాటిన చర్యను సజీవంగా చూపుతుంది; తెలుగులో సహజమైన సంపూర్ణ కథన క్రియగా అనువదించబడింది.
- source_word: וּשְׁלֹשׁ מֵאוֹת הָאִישׁ אֲשֶׁר אִתּוֹ
  choice: అతనూ అతనితో ఉన్న మూడువందల మందీ
  rationale: గిద్యోనుతో పాటు అతని సైనిక బృందమంతా ఇందులో ఉన్నారని మూలంలోని నిర్మాణానికి అనుగుణంగా తెలియజేస్తుంది.
- source_word: עֲיֵפִים
  choice: అలసిపోయినా
  rationale: ఈ పదం శారీరకంగా బాగా అలసిన స్థితిని సూచిస్తుంది. తరువాతి వెంటాడే చర్యతో ఉన్న వ్యతిరేక భావాన్ని తెలుగులో ‘-యినా’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וְרֹדְפִים
  choice: వెంటాడుతూనే ఉన్నారు
  rationale: కృదంతం కొనసాగుతున్న వెంబడింపును సూచిస్తుంది; ‘తూనే’ వారు అలసిపోయినప్పటికీ దాన్ని కొనసాగించారనే సందర్భార్థాన్ని అందిస్తుంది.
