translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కథన శైలి. మూలంలోని సంక్షిప్తతను సాధ్యమైనంతగా నిలుపుతూ, తెలుగు వాక్య నిర్మాణం కోసం రెండు వాక్యాలుగా విభజించబడింది. ‘అలసిపోయినా’ అనే రూపం మూలంలోని וְ సంధికి సందర్భంలో సాధ్యమైన వ్యతిరేకార్థాన్ని వ్యక్తం చేస్తుంది; ప్రత్యేక పాఠభేదం లేదా అవసరమైన పాదటిప్పణి లేదు.
