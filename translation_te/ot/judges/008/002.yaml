source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֲלֵי/הֶ֔ם מֶה עָשִׂ֥יתִי עַתָּ֖ה כָּ/כֶ֑ם הֲ/ל֗וֹא ט֛וֹב עֹלְל֥וֹת אֶפְרַ֖יִם מִ/בְצִ֥יר אֲבִיעֶֽזֶר־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/002.yaml
  text: But he said to them[a], “What have I done now compared to you? Are not the gleanings of Ephraim better than the grape harvest of Abiezer?”
translation:
  language: te
  text: అయితే అతడు వారితో, “మీరు చేసిన దానితో పోలిస్తే నేను ఇప్పుడు చేసిందేమిటి? అబీయెజెరు ద్రాక్షకోతకంటే ఎఫ్రాయిము కోత తర్వాత ఏరుకున్న మిగిలిన ద్రాక్షపండ్లు మేలైనవి కావా?” అన్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵיהֶם
  choice: అయితే అతడు వారితో … అన్నాడు
  rationale: వావ్ రూపం కథనాన్ని కొనసాగిస్తున్నప్పటికీ, ముందటి వచనంలోని ఎఫ్రాయిమీయుల ఫిర్యాదుకు గిద్యోను ఇచ్చిన శాంతింపజేసే ప్రతిస్పందనను సందర్భానుసారంగా ‘అయితే’ సహజంగా తెలియజేస్తుంది.
- source_word: מֶה עָשִׂיתִי עַתָּה כָּכֶם
  choice: మీతో పోలిస్తే నేను ఇప్పుడు చేసింది ఏమిటి?
  rationale: כָּכֶם ఇక్కడ కేవలం పోలికను కాక, వారి కార్యంతో తన కార్యాన్ని తక్కువగా చూపే తులనను వ్యక్తం చేస్తుంది.
- source_word: הֲלוֹא טוֹב
  choice: మేలైనవి కావా?
  rationale: הֲלוֹא సమ్మతిని ఆశించే అలంకారప్రశ్నను సూచిస్తుంది; מִן‌తో కూడిన טוֹב తులనాత్మకంగా ‘మేలైనవి’ అనే భావం ఇస్తుంది.
- source_word: עֹלְלוֹת
  choice: కోత తర్వాత ఏరుకున్న మిగిలిన ద్రాక్షపండ్లు
  rationale: ప్రధాన ద్రాక్షకోత తర్వాత మిగిలి, పరిగెగా ఏరుకునే ద్రాక్షపండ్లను సూచించే వ్యవసాయ రూపకాన్ని సాధారణ ఆధునిక తెలుగు పాఠకులకు స్పష్టంగా తెలియజేస్తుంది.
- source_word: מִבְצִיר
  choice: ద్రాక్షకోతకంటే
  rationale: בָּצִיר ద్రాక్షపండ్ల కోతను సూచిస్తుంది; మִן తులనను తెలిపేందున ‘కంటే’గా అనువదించబడింది.
- source_word: אֶפְרַיִם / אֲבִיעֶזֶר
  choice: ఎఫ్రాయిము / అబీయెజెరు
  rationale: గోత్రం మరియు వంశం పేర్లకు తెలుగులో స్థిరపడిన బైబిలు లిప్యంతరీకరణలను ఉపయోగించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా అనువదించబడింది. గిద్యోను తన విజయాన్ని తగ్గించి ఎఫ్రాయిము సాధించినదాన్ని పొగిడే అలంకారప్రశ్నను, అలాగే ద్రాక్షతోట రూపకాన్ని నిలుపుకున్నాం.
