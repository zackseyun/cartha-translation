source:
  edition: WLC
  text: וַ/יֹּאמְר֨וּ אֵלָ֜י/ו אִ֣ישׁ אֶפְרַ֗יִם מָֽה הַ/דָּבָ֤ר הַ/זֶּה֙ עָשִׂ֣יתָ לָּ֔/נוּ לְ/בִלְתִּי֙ קְרֹ֣אות לָ֔/נוּ כִּ֥י הָלַ֖כְתָּ לְ/הִלָּחֵ֣ם בְּ/מִדְיָ֑ן וַ/יְרִיב֥וּ/ן אִתּ֖/וֹ בְּ/חָזְקָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/001.yaml
  text: Then the men of Ephraim said to him[a], “What is this thing you have done to us[b], not calling us when you went to fight against Midian?” And they contended with him strongly.
translation:
  language: te
  text: అప్పుడు ఎఫ్రాయిమీయులు[a] అతనితో, “నువ్వు మిద్యానుతో యుద్ధం చేయడానికి వెళ్లినప్పుడు మమ్మల్ని పిలవకుండా, మాకు చేసిన ఈ పని ఏమిటి?” అన్నారు. వారు అతనితో తీవ్రంగా వాదించారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా “ఎఫ్రాయిము మనుషులు”; ఇది ఎఫ్రాయిము గోత్రాన్ని సమూహంగా సూచించే హీబ్రూ ప్రయోగం.
    reason: lexical_alternative
  - marker: b
    text: లేదా “అతనితో గట్టిగా కలహించారు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ אֶפְרַיִם
  choice: ఎఫ్రాయిమీయులు
  rationale: אִישׁ రూపరీత్యా ఏకవచనమైనా, గోత్రనామంతో కూడిన ఈ ప్రయోగం సమూహార్థకమైనది; తరువాతి బహువచన క్రియలు దీనిని నిర్ధారిస్తాయి. ఆధునిక తెలుగులో ‘ఎఫ్రాయిమీయులు’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: מָה הַדָּבָר הַזֶּה
  choice: ఈ పని ఏమిటి?
  rationale: דָּבָר యొక్క ‘విషయం/పని’ భావాన్ని నిలుపుతూ హీబ్రూ అలంకారిక ప్రశ్న బలాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: עָשִׂיתָ לָּנוּ
  choice: మాకు చేసిన
  rationale: లామెద్‌తో ఉన్న సర్వనామాన్ని ‘మాకు’గా అనువదించడం మూలంలోని దత్తార్థాన్ని నిలుపుతుంది; ‘మాకు విరోధంగా’ అని సందర్భాన్ని అతిగా వ్యాఖ్యానించదు.
- source_word: לְבִלְתִּי קְרֹאות לָנוּ
  choice: మమ్మల్ని పిలవకుండా
  rationale: ఈ నిరాకరణార్థక క్రియారూపం తెలిపే ప్రధాన ఫిర్యాదును సంక్షిప్తంగా, సహజంగా అందిస్తుంది.
- source_word: כִּי הָלַכְתָּ לְהִלָּחֵם בְּמִדְיָן
  choice: నువ్వు మిద్యానుతో యుద్ధం చేయడానికి వెళ్లినప్పుడు
  rationale: ఇక్కడ כִּיని సందర్భానుసారంగా కాలార్థకంగా తీసుకొని, בְּ యొక్క ప్రత్యర్థి భావాన్ని తెలుగులో సహజమైన ‘మిద్యానుతో యుద్ధం’ అనే ప్రయోగంతో వ్యక్తపరుస్తుంది.
- source_word: וַיְרִיבוּן אִתּוֹ
  choice: వారు అతనితో ... వాదించారు
  rationale: ריב సూచించే గంభీరమైన వివాదాన్ని ‘వాదించారు’ స్పష్టంగా తెలియజేస్తుంది; దానిని న్యాయపరమైన ఆరోపణగా లేదా కేవలం చిన్నపాటి గొడవగా కుదించదు.
- source_word: בְּחָזְקָה
  choice: తీవ్రంగా
  rationale: పూర్వప్రత్యయంతో ఉన్న నామవాచకం ఇక్కడ క్రియావిశేషణంగా వివాద తీవ్రతను తెలియజేస్తుంది; ‘తీవ్రంగా’ ఆధునిక, గౌరవప్రదమైన తెలుగు.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన ప్రత్యక్ష సంభాషణను ఉపయోగించాం. మూలంలోని సమూహార్థక ప్రయోగం, అలంకారిక ప్రశ్న, వివాద తీవ్రత నిలిచేలా చూసి, అనవసరమైన మతసిద్ధాంత వ్యాఖ్యానాన్ని చేర్చలేదు.
