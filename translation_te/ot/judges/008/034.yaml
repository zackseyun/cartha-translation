  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/לֹ֤א זָֽכְרוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל אֶת יְהוָ֖ה אֱלֹהֵי/הֶ֑ם הַ/מַּצִּ֥יל אוֹתָ֛/ם מִ/יַּ֥ד כָּל אֹיְבֵי/הֶ֖ם מִ/סָּבִֽיב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/034.yaml
  text: And the sons of Israel did not remember Yahweh their God[a], who had delivered them from the hand of all their enemies all around.
translation:
  language: te
  text: ఇశ్రాయేలు కుమారులు తమ దేవుడైన యాహ్వేను, తమ చుట్టూ ఉన్న శత్రువులందరి చేతిలోనుండి వారిని విడిపించినవానిని, జ్ఞాపకం చేసుకోలేదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, ‘ఇశ్రాయేలీయులు.’ హీబ్రూ: ‘ఇశ్రాయేలు కుమారులు.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא
  choice: జ్ఞాపకం చేసుకోలేదు
  rationale: వావ్ సంధి ముందరి వాక్యంతో కథన ప్రవాహాన్ని కొనసాగిస్తుంది; తెలుగులో ప్రత్యేకంగా ‘మరియు’ చేర్చకుండానే ఆ కొనసాగింపు సహజంగా వ్యక్తమవుతుంది.
- source_word: זָכְרוּ
  choice: జ్ఞాపకం చేసుకోలేదు
  rationale: ఇది కేవలం మనసుకు తెచ్చుకోవడం మాత్రమే కాక, దేవుని రక్షణను గుర్తుంచుకొని నిబద్ధత చూపే భావాన్నీ మోస్తుంది; ‘జ్ఞాపకం చేసుకోవడం’ ఆ విస్తృతిని నిలుపుతుంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: హీబ్రూ పదబంధంలోని ‘కుమారులు’ అనే రూపాన్ని ప్రధాన పాఠ్యంలో నిలిపి, సహజమైన సామూహిక ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన ‘యెహోవా’ రూపంలో వ్యక్తిగత నామంగా నిలిపాం.
- source_word: אֱלֹהֵיהֶם
  choice: తమ దేవుడైన
  rationale: ఇక్కడ బహువచన రూపం యెహోవాను సూచించే ఏకవచన బిరుదుగా ఉంది; ‘తమ దేవుడైన’ ఒడంబడిక సంబంధాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: הַמַּצִּיל
  choice: ఆయనే ... విడిపించాడు
  rationale: నిర్దిష్ట ఆర్టికల్‌తో కూడిన కృదంతం యెహోవాను ఆయన రక్షణ కార్యం ద్వారా గుర్తిస్తుంది; తెలుగు సంబంధవాక్య భావాన్ని ప్రత్యేక వాక్యంగా సహజంగా అందించాం.
- source_word: מִיַּד
  choice: చేతిలోనుండి
  rationale: అధికారం లేదా ఆధీనతను సూచించే హీబ్రూ రూపకాన్ని అర్థమయ్యే తెలుగు రూపంలో నిలిపాం.
- source_word: כָּל אֹיְבֵיהֶם
  choice: వారి శత్రువులందరి
  rationale: మొత్తాన్ని సూచించే כָּל భావాన్ని ‘అందరి’ స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: מִסָּבִיב
  choice: చుట్టూ ఉన్న
  rationale: అన్ని వైపులా ఉన్న శత్రువులను సూచించే స్థలభావాన్ని సహజ ఆధునిక తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో వ్యక్తిగత దైవనామమే ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుతో మార్చకుండా నామంగానే ఉంచాం; తెలుగు పాఠకులకు విస్తృతంగా సుపరిచితమైన రూపం ‘యెహోవా’, కాగా ‘యాహ్వే’ మూల ఉచ్చారణకు దగ్గరైన ప్రత్యామ్నాయం.
- issue: בְּנֵי יִשְׂרָאֵל అనే సామూహిక సంబోధన
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలీయులు
  rationale: మూలంలోని వ్యాకరణపరమైన పురుష బహువచన రూపాన్ని ప్రధాన పాఠ్యంలో నిలిపాం; ఆ పదబంధం మొత్తం ఇశ్రాయేలు ప్రజలను సూచించగలదనే సహజ ప్రత్యామ్నాయాన్ని పాదసూచికలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన శైలి. హీబ్రూ ‘చేతి’ రూపకాన్ని నిలిపి, దీర్ఘమైన మూల వాక్యాన్ని తెలుగులో స్పష్టత కోసం రెండు వాక్యాలుగా విభజించాం. పాదసూచిక గుర్తు [a] ప్రధాన పాఠ్యంలో ఉంది.
