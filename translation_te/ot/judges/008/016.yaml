  text: וַ/יִּקַּח֙ אֶת זִקְנֵ֣י הָ/עִ֔יר וְ/אֶת קוֹצֵ֥י הַ/מִּדְבָּ֖ר וְ/אֶת הַֽ/בַּרְקֳנִ֑ים וַ/יֹּ֣דַע בָּ/הֶ֔ם אֵ֖ת אַנְשֵׁ֥י סֻכּֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/016.yaml
  text: Then he took the elders of the city[a], and thorns of the wilderness and briers, and with them he disciplined the men of Succoth.
translation:
  language: te
  text: తర్వాత అతడు ఆ పట్టణపు పెద్దలను, అరణ్యంలోని ముళ్లను, ముళ్లపొదలను తీసుకొని, వాటితో సుక్కోతు మనుషులకు బుద్ధి చెప్పాడు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ వ్యక్తీకరణ క్లిష్టమైనది. అక్షరార్థంగా ఇది ‘వాటితో సుక్కోతు మనుషులకు తెలియజేశాడు’ లేదా ‘నేర్పించాడు’ అనే భావాన్ని ఇస్తుంది; సందర్భాన్ని బట్టి ‘వారిని శిక్షించాడు’ అని, మరింత బలంగా ‘వారిని నూర్చాడు’ అని కూడా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: זִקְנֵי הָעִיר
  choice: ఆ పట్టణపు పెద్దలు
  rationale: ‘పెద్దలు’ అనే పదం వయోవృద్ధులను మాత్రమే కాక పట్టణపు అధికార నాయకులను సూచించే హీబ్రూ సామాజిక-రాజకీయ బిరుదును సహజంగా నిలుపుతుంది.
- source_word: קוֹצֵי הַמִּדְבָּר
  choice: అరణ్యంలోని ముళ్లు
  rationale: ముళ్లతో కూడిన అడవి మొక్కలను సూచించే స్పష్టమైన రూపం; మూలంలోని అరణ్య సంబంధాన్ని నిలుపుతుంది.
- source_word: הַבַּרְקֳנִים
  choice: ముళ్లపొదలు
  rationale: ఈ పదం ఏ నిర్దిష్ట జాతి మొక్కను సూచిస్తుందో అనిశ్చితంగా ఉన్నందున, గుచ్చుకునే పొదల సాధారణ భావాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: וַיֹּדַע בָּהֶם
  choice: వాటితో … బుద్ధి చెప్పాడు
  rationale: ידע హిఫీల్ రూపంలోని ‘తెలియజేయడం/నేర్పడం’ భావాన్నీ, ఈ సందర్భంలోని శిక్షాత్మక చర్యనూ తెలుగు జాతీయంలో కలిపి వ్యక్తం చేస్తుంది; ఆ చర్య స్వరూపాన్ని అవసరానికి మించి నిర్దిష్టం చేయదు.
- source_word: אַנְשֵׁי סֻכּוֹת
  choice: సుక్కోతు మనుషులు
  rationale: మూలంలోని పుంలింగ బహువచనమైన ‘మనుషులు/పురుషులు’ భావాన్ని నిలుపుతూ, పట్టణ సమూహాన్ని సూచిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన శైలి వాడబడింది. ‘బుద్ధి చెప్పాడు’ అనే సహజ తెలుగు ప్రయోగం బోధన మరియు శిక్ష అనే రెండు ఛాయలనూ ఉంచుతుంది; క్లిష్టమైన హీబ్రూ పదబంధంలోని ప్రత్యామ్నాయ అర్థాలు పాదసూచికలో ఇవ్వబడ్డాయి.
