  text: וַ/יָּ֛מָת גִּדְע֥וֹן בֶּן יוֹאָ֖שׁ בְּ/שֵׂיבָ֣ה טוֹבָ֑ה וַ/יִּקָּבֵ֗ר בְּ/קֶ֨בֶר֙ יוֹאָ֣שׁ אָבִ֔י/ו בְּ/עָפְרָ֖ה אֲבִ֥י הָֽעֶזְרִֽי־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/032.yaml
  text: And Gideon son of Joash died at a good old age and was buried in the tomb of Joash his father[b][a], in Ophrah of the Abiezrites.
translation:
  language: te
  text: యోవాషు కుమారుడైన గిద్యోను మంచి వృద్ధాప్యంలో చనిపోయాడు. అతన్ని అతని తండ్రి యోవాషు సమాధిలో[a] పాతిపెట్టారు; అది అబీయెజెరీయుల ఒఫ్రాలో[b] ఉంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సమాధి గొయ్యిలో” లేదా “ఖనన స్థలంలో.” హీబ్రూ పదం సమాధిని, సమాధి గొయ్యిని, లేదా ఖనన స్థలాన్ని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా “అబీయెజెరీయుని ఒఫ్రా”; అంటే అబీయెజెరు వంశానికి చెందిన ఒఫ్రా.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּמָת
  choice: చనిపోయాడు
  rationale: מות అనే క్రియకు నేరుగా ‘చనిపోవడం’ అనే అర్థం. హీబ్రూ వాక్యంలోని సూటిదనాన్ని నిలుపుతుంది.
- source_word: גִּדְעוֹן בֶּן יוֹאָשׁ
  choice: యోవాషు కుమారుడైన గిద్యోను
  rationale: వంశసంబంధాన్ని సహజమైన ఆధునిక తెలుగు పదక్రమంలో స్పష్టంగా తెలియజేస్తుంది.
- source_word: בְּשֵׂיבָה טוֹבָה
  choice: మంచి ముసలితనంలో
  rationale: שֵׂיבָה వృద్ధాప్యాన్ని, טוֹבָה దాని అనుకూల స్వభావాన్ని సూచిస్తాయి. ‘నిండు వృద్ధాప్యం’ అని అనువదిస్తే మూలంలో స్పష్టంగా లేని సంపూర్ణత భావం చేరవచ్చు.
- source_word: וַיִּקָּבֵר
  choice: అతణ్ణి … పాతిపెట్టారు
  rationale: హీబ్రూ నిఫల్ రూపంలోని కర్మణి భావాన్ని తెలుగులో సహజమైన అనిర్దిష్ట కర్త నిర్మాణంతో వ్యక్తం చేస్తుంది.
- source_word: בְּקֶבֶר
  choice: సమాధిలో
  rationale: קֶבֶר సమాధి, సమాధి గుహ లేదా పాతిపెట్టే స్థలాన్ని సూచించగలదు. తెలుగు సందర్భంలో ‘సమాధి’ సహజమైన విస్తృత పదం; అర్థపరిధిని పాదసూచికలో తెలియజేస్తున్నాం.
- source_word: יוֹאָשׁ אָבִיו
  choice: అతని తండ్రి యోవాషు
  rationale: మూలంలోని సంబంధాన్ని అసందిగ్ధంగా, సహజమైన తెలుగు పదక్రమంలో అందిస్తుంది.
- source_word: בְּעָפְרָה אֲבִי הָעֶזְרִי
  choice: అబీయెజెరీయుల ఒఫ్రాలో
  rationale: אֲבִי הָעֶזְרִי ఏకవచన జాతి/వంశ విశేషణంగా ఉన్నా, ఆ పట్టణం అబీయెజెరు వంశానికి చెందినదని భావం. తెలుగులో వంశసమూహాన్ని సూచించే బహువచన రూపం సహజంగా ఉంటుంది.
