translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సూటిగా, గౌరవప్రదంగా రూపొందించబడింది. ‘మంచి ముసలితనం’ అనే కొంత సెమిటిక్ స్వరూపమున్న మాటను మూలంలోని అనుకూల భావాన్ని అతివ్యాఖ్యానం చేయకుండా నిలుపుటకు ఎంచుకున్నాం. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
