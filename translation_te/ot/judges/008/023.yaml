revisions:
- from: అయితే గిద్యోను వారితో[a], “నేను మిమ్మల్ని పాలించను; నా కుమారుడూ మిమ్మల్ని పాలించడు. యెహోవా మిమ్మల్ని పాలిస్తాడు” అన్నాడు.
  to: 'అయితే గిద్యోను వారితో[a] ఇలా అన్నాడు: “నేను మీపై పాలించను; నా కుమారుడూ మీపై పాలించడు. యహ్వే మీపై పాలిస్తాడు.”'
  rationale: The revision aligns the divine-name transliteration with the POB’s source and English audit trail, improves the modern Telugu speech introduction, and makes the ‘over you’ relation explicit. It preserves the Hebrew syntax, the singular ‘son,’ the repeated ruling terminology, and the contextual—but not lexically mandatory—adversative sense of the opening conjunction.
