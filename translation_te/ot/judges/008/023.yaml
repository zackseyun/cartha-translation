  text: וַ/יֹּ֤אמֶר אֲלֵ/הֶם֙ גִּדְע֔וֹן לֹֽא אֶמְשֹׁ֤ל אֲנִי֙ בָּ/כֶ֔ם וְ/לֹֽא יִמְשֹׁ֥ל בְּנִ֖/י בָּ/כֶ֑ם יְהוָ֖ה יִמְשֹׁ֥ל בָּ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/023.yaml
  text: But Gideon said to them[a], “I will not rule over you, and my son will not rule over you; Yahweh will rule over you.”
translation:
  language: te
  text: 'అయితే గిద్యోను వారితో[a] ఇలా అన్నాడు: “నేను మీపై పాలించను; నా కుమారుడూ మీపై పాలించడు. యహ్వే మీపై పాలిస్తాడు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “గిద్యోను వారితో ఇలా అన్నాడు.” హీబ్రూ సంధిపదాన్ని సాధారణ కథన కొనసాగింపుగా “మరియు” అని కూడా అనువదించవచ్చు; ఇక్కడ “అయితే” అనేది ముందటి వచనంలోని ప్రజల అభ్యర్థనకు గిద్యోను ఇచ్చిన వ్యతిరేక సమాధానాన్ని స్పష్టం చేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అయితే ... అన్నాడు
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని కొనసాగిస్తుంది; అయితే ముందటి వచనంలోని ప్రజల అభ్యర్థనను గిద్యోను తిరస్కరిస్తున్న వ్యతిరేక భావాన్ని సందర్భానుసారంగా ‘అయితే’ స్పష్టం చేస్తుంది.
- source_word: אֲלֵהֶם
  choice: వారితో
  rationale: ప్రత్యయంతో కూడిన దిశాసూచక విభక్తికి సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: גִּדְעוֹן
  choice: గిద్యోను
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: לֹא אֶמְשֹׁל אֲנִי בָּכֶם
  choice: నేను మిమ్మల్ని పాలించను
  rationale: מָשַׁל సూచించే రాజకీయ పాలన భావాన్ని ‘పాలించు’ నేరుగా తెలియజేస్తుంది; స్పష్టంగా ఉన్న אֲנִיను ‘నేను’గా ఉంచింది.
- source_word: וְלֹא יִמְשֹׁל בְּנִי בָּכֶם
  choice: నా కుమారుడూ మిమ్మల్ని పాలించడు
  rationale: మొదటి నిరాకరణకు సమాంతరంగా కుమారుని ద్వారా వంశపారంపర్య పాలననూ నిరాకరిస్తుంది; ‘కూడా’ భావాన్ని ‘-ూ’ సహజంగా అందిస్తుంది.
- source_word: בְּנִי
  choice: నా కుమారుడు
  rationale: ఏకవచన నామవాచకాన్ని యథాతథంగా ఉంచి, సందర్భం సూచించే వంశపారంపర్య భావాన్ని పాఠ్యంలో విస్తరించలేదు.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన లిప్యంతరీకరణలో ఇచ్చింది.
- source_word: יְהוָה יִמְשֹׁל בָּכֶם
  choice: యెహోవా మిమ్మల్ని పాలిస్తాడు
  rationale: మునుపటి రెండు వాక్యాల్లోని מָשַׁל పదాన్నే ‘పాలించు’గా పునరావృతం చేసి, మానవ పాలనకూ దైవిక పాలనకూ మధ్యనున్న అలంకారిక వ్యత్యాసాన్ని కాపాడింది.
theological_decisions:
- issue: గిద్యోను రాజరికాన్ని పోలిన అధికారాన్ని తిరస్కరించడం
  choice: గిద్యోను తన పాలననూ తన కుమారుని పాలననూ తిరస్కరించి, యెహోవాయే పాలిస్తాడని ప్రకటిస్తున్నట్లు అనువదించడం.
  alternative: గిద్యోను రాజు అనే అధికారిక బిరుదును మాత్రమే తిరస్కరించి, వాస్తవ పాలనను కొనసాగించాడని పాఠ్యంలో స్పష్టం చేయడం.
  rationale: హీబ్రూ పాఠ్యం గిద్యోను, అతని కుమారుడు, యెహోవా—ముగ్గురి విషయంలోనూ ఒకే מָשַׁל క్రియను వాడుతుంది; ‘రాజు’ అనే ప్రత్యేక పదాన్ని వాడదు. కాబట్టి వచనంలోని మానవ-దైవిక పాలన వ్యత్యాసాన్ని కాపాడుతూ, విస్తృత కథనంలోని ఉద్రిక్తతను ఇక్కడే పరిష్కరించలేదు.
translation_notes:
  register: సహజమైన, గౌరవప్రదమైన ఆధునిక ప్రామాణిక తెలుగు. ‘పాలించు’ అనే కీలక క్రియను మూడు చోట్లా ఒకేలా ఉంచి మూలంలోని పునరుక్తి, వ్యత్యాసం నిలిపాం. సంభాషణలో ‘వారితో ... అన్నాడు’ అనే తెలుగు సహజ పదక్రమాన్ని ఉపయోగించాం.
