source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ שָׂרֵ֣י סֻכּ֔וֹת הֲ֠/כַף זֶ֧בַח וְ/צַלְמֻנָּ֛ע עַתָּ֖ה בְּ/יָדֶ֑/ךָ כִּֽי נִתֵּ֥ן לִֽ/צְבָאֲ/ךָ֖ לָֽחֶם־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/006.yaml
  text: Then the leaders of Succoth said, “Are the hands of Zebah and Zalmunna already in your hand, that we should give bread to your army?”
translation:
  language: te
  text: అప్పుడు సుక్కోతు నాయకులు, “జెబహు, సల్మున్నాల చేతులు ఇప్పటికే నీ చేతిలో ఉన్నాయా? నీ సైన్యానికి మేము రొట్టెలు ఎందుకు ఇవ్వాలి?” అన్నారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׂרֵי סֻכּוֹת
  choice: సుక్కోతు నాయకులు
  rationale: שָׂרֵי అంటే పాలకులు, అధికారులు లేదా నాయకులు కావచ్చు; పట్టణ ప్రతినిధులను సూచించే సహజమైన ఆధునిక తెలుగు పదంగా ‘నాయకులు’ ఎంచుకున్నాం.
- source_word: הֲכַף זֶבַח וְצַלְמֻנָּע
  choice: జెబహు, సల్మున్నాల చేతులు
  rationale: మూలంలోని ‘చేతులు/అరచేతులు’ అనే దేహభాగ రూపకాన్ని నిలిపి, వారు పట్టుబడి గిద్యోను ఆధీనంలో ఉన్నారా అనే వ్యంగ్య సవాలును యథాతథంగా ఉంచాం.
- source_word: עַתָּה בְּיָדֶךָ
  choice: ఇప్పటికే నీ చేతిలో ఉన్నాయా?
  rationale: עַתָּה ఇక్కడ ‘ఇప్పటికే/ఇప్పుడే’ అనే భావంతో, ఇంకా పట్టుకోని శత్రువులపై విజయం సాధించినట్లు ప్రవర్తిస్తున్నావా అనే ప్రశ్నను తెలియజేస్తుంది.
- source_word: לִצְבָאֲךָ לָחֶם
  choice: నీ సైన్యానికి ... రొట్టెలు
  rationale: צָבָא ఇక్కడ గిద్యోను వెంట ఉన్న యోధుల సమూహం; לֶחֶם సాధారణ ఆహారాన్ని సూచించగలిగినా, మూలంలోని స్పష్టమైన ‘రొట్టె’ పదాన్ని బహువచన సహజ తెలుగులో ఉంచాం.
theological_decisions:
- issue: సుక్కోతు నాయకుల ప్రశ్నలోని షరతు/కారణ సంబంధం
  choice: “నీ సైన్యానికి మేము రొట్టెలు ఎందుకు ఇవ్వాలి?”
  alternative: “మేము నీ సైన్యానికి రొట్టెలు ఇవ్వడానికి?”
  rationale: כִּי ఇక్కడ మునుపటి వ్యంగ్య ప్రశ్నకు ఆధారాన్ని తెలిపే వాక్యసంబంధకం. తెలుగులో అక్షరానువాదం అసహజంగా ఉండటంతో, సహాయం నిరాకరించే భావాన్ని స్పష్టంగా కానీ అదనపు సిద్ధాంతార్థం లేకుండా ప్రశ్నారూపంలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన కథనశైలి. మూలంలోని వ్యంగ్య ప్రశ్నను, ‘చేతులు ... నీ చేతిలో’ అనే పదప్రయోగాన్ని కాపాడుతూ వాక్యాన్ని సాధారణ పాఠకునికి సహజంగా రూపొందించాం.
