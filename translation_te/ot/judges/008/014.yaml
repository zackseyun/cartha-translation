translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన, సులభంగా అర్థమయ్యే కథన శైలి వాడబడింది. హీబ్రూలో ‘పేర్లు’ అనే పదం స్పష్టంగా లేకపోవడంతో దాన్ని ప్రధాన పాఠ్యంలో చేర్చలేదు; ‘గురించి ... రాసిచ్చాడు’ అనే రూపం చర్యను సహజంగా వ్యక్తం చేస్తూ మూలంలోని సంక్షిప్తతను కాపాడుతుంది. అందించిన ఆంగ్ల consultation layerలో [a] గుర్తు ‘questioned him’ తర్వాత ఉన్నా, దాని గమనిక שָׂרֵי (‘అధికారులు’) గురించినదే కాబట్టి సంబంధిత పదం తర్వాత ఉంచబడింది.
