source:
  edition: WLC
  text: וַ/יִּלְכָּד נַ֛עַר מֵ/אַנְשֵׁ֥י סֻכּ֖וֹת וַ/יִּשְׁאָלֵ֑/הוּ וַ/יִּכְתֹּ֨ב אֵלָ֜י/ו אֶת שָׂרֵ֤י סֻכּוֹת֙ וְ/אֶת זְקֵנֶ֔י/הָ שִׁבְעִ֥ים וְ/שִׁבְעָ֖ה אִֽישׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/014.yaml
  text: And he captured a young man from the men of Succoth and questioned him[a], and he wrote down for him the officials of Succoth and its elders, seventy-seven men.
translation:
  language: te
  text: అతడు సుక్కోతు మనుషుల్లో ఒక యువకుణ్ణి పట్టుకొని అతణ్ణి ప్రశ్నించాడు. ఆ యువకుడు సుక్కోతు అధికారుల[a], ఆ పట్టణపు పెద్దల జాబితాను అతనికి రాసిచ్చాడు—వారు డెబ్బై ఏడుగురు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘సుక్కోతు నాయకులు’ లేదా ‘పాలకులు’; హీబ్రూ పదం అధికారులు, అధిపతులు, లేదా పాలకులను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלְכָּד
  choice: పట్టుకొని
  rationale: לכד అంటే పట్టుకోవడం లేదా బంధించడం. కథా సందర్భంలో యువకుణ్ణి సమాచారానికై అదుపులోకి తీసుకున్న భావాన్ని సహజంగా తెలియజేస్తుంది; అరెస్టు విధానాన్ని అదనంగా ఊహించదు.
- source_word: נַעַר
  choice: ఒక యువకుణ్ణి
  rationale: נַעַר బాలుడు, యువకుడు, లేదా సేవకుడు అనే అర్థాలు పొందగలదు. ఇతడు పట్టణ నాయకుల గురించి రాయగల వ్యక్తి కావడంతో, బాల్యాన్ని లేదా సేవక స్థితిని నిర్దేశించకుండా ‘యువకుడు’ సరిపోతుంది.
- source_word: מֵאַנְשֵׁי סֻכּוֹת
  choice: సుక్కోతు మనుషుల్లో ఒక
  rationale: מן సమూహంలోనుండి ఒకరిని ఎంచుకున్న భావాన్ని ఇస్తుంది. ఈ రూపం అతడు సుక్కోతుకు చెందినవాడని స్పష్టంగా, సహజంగా తెలుపుతుంది.
- source_word: וַיִּשְׁאָלֵהוּ
  choice: అతణ్ణి ప్రశ్నించాడు
  rationale: שׁאל అడగడం లేదా విచారించడం. సైనిక సందర్భంలోని ఉద్దేశపూర్వక ప్రశ్నలను తెలియజేస్తూనే, ఆధునిక ‘విచారణ’ అనే మరీ బలమైన భావాన్ని రుద్దదు.
- source_word: וַיִּכְתֹּב אֵלָיו
  choice: అతనికి రాసిచ్చాడు
  rationale: బంధించబడిన యువకుడే గిద్యోనుకు సమాచారాన్ని రాసిచ్చాడని వాక్యనిర్మాణం సూచిస్తుంది. ‘రాసిచ్చాడు’ తెలుగు వాడుకలో אֵלָיו యొక్క ‘అతనికి/అతని కోసం’ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: שָׂרֵי סֻכּוֹת
  choice: సుక్కోతు అధికారులు
  rationale: שׂרים పాలకులు, అధిపతులు, లేదా అధికారులు కావచ్చు. పట్టణ పరిపాలనా సందర్భంలో ‘అధికారులు’ సరిపోతుంది; ఆధునిక పాఠకునికి తప్పుదారి పట్టించే రాజవంశీయ ‘రాజకుమారులు’ అనే భావాన్ని నివారిస్తుంది.
- source_word: זְקֵנֶיהָ
  choice: ఆ పట్టణ పెద్దలు
  rationale: స్త్రీలింగ ఏకవచన ప్రత్యయం సుక్కోతు పట్టణాన్ని సూచిస్తుంది. ‘ఆ పట్టణ పెద్దలు’ అనేది గుర్తింపు పొందిన వయోవృద్ధ నాయకులను సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: שִׁבְעִים וְשִׁבְעָה אִישׁ
  choice: వారు డెబ్బై ఏడుగురు
  rationale: హీబ్రూ సంఖ్య నేరుగా డెబ్బై ఏడుగురిని సూచిస్తుంది. ‘వారు’ అనేది ముందున్న అధికారులు, పెద్దలను కలిపి సూచిస్తూ איש యొక్క వ్యక్తుల భావాన్ని నిలుపుతుంది.
