  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר גִּדְע֔וֹן לָ/כֵ֗ן בְּ/תֵ֧ת יְהוָ֛ה אֶת זֶ֥בַח וְ/אֶת צַלְמֻנָּ֖ע בְּ/יָדִ֑/י וְ/דַשְׁתִּי֙ אֶת בְּשַׂרְ/כֶ֔ם אֶת קוֹצֵ֥י הַ/מִּדְבָּ֖ר וְ/אֶת הַֽ/בַּרְקֳנִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/007.yaml
  text: And Gideon said[a], “Therefore, when Yahweh gives Zebah and Zalmunna into my hand, I will thresh your flesh with the thorns of the wilderness and with briers.”
translation:
  language: te
  text: అందుకు గిద్యోను, “యాహ్వే జెబహును, సల్మున్నాను నా చేతిలోకి అప్పగించినప్పుడు, అరణ్యపు ముళ్లతోనూ ముళ్లపొదలతోనూ[a] మీ మాంసాన్ని నూర్చివేస్తాను” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “గుచ్చే పొదలతో.” ఇక్కడి హీబ్రూ పదం సూచించే మొక్క ఖచ్చితంగా ఏదో తెలియదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: అందుకు
  rationale: మునుపటి వచనంలో సుక్కోతు ప్రజలు నిరాకరించినందుకు ప్రతిస్పందనగా గిద్యోను పలికిన పరిణామాత్మక బెదిరింపును సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: בְּתֵת
  choice: అప్పగించినప్పుడు
  rationale: בְּ + క్రియానామ రూపం ఇక్కడ కాలసంబంధ అర్థాన్ని ఇస్తుంది. భవిష్యత్తులో యాహ్వే వారిని గిద్యోను అధికారంలోకి ఇచ్చే సందర్భాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన నాలుగు అక్షరాల పేరును బిరుదుతో భర్తీ చేయకుండా పేరుగానే లిప్యంతరీకరిస్తుంది.
- source_word: בְּיָדִי
  choice: నా చేతికి
  rationale: ఎవరినైనా ఒకరి అధికారంలోకి అప్పగించడాన్ని సూచించే హీబ్రూ రూపకాన్ని తెలుగులో అర్థమయ్యే విధంగా అలాగే నిలుపుతుంది.
- source_word: וְדַשְׁתִּי
  choice: నూర్చివేస్తాను
  rationale: ధాన్యాన్ని నూర్చే వ్యవసాయ రూపకాన్నీ, గిద్యోను బెదిరింపులోని తీవ్ర హింసనూ నిలుపుతుంది.
- source_word: בְּשַׂרְכֶם
  choice: మీ శరీరాలను
  rationale: పదశః ‘మీ మాంసాన్ని’ అయినా, తెలుగులో వ్యక్తులపై శారీరక హింసను సహజంగా సూచించేందుకు ‘శరీరాలను’ వాడబడింది; బెదిరింపు తీవ్రత కొనసాగుతుంది.
- source_word: קוֹצֵי הַמִּדְבָּר
  choice: అరణ్యపు ముళ్లు
  rationale: ముళ్ల మొక్కల చిత్రాన్నీ మిద్బార్ ప్రాంత సూచననూ సంక్షిప్తమైన సహజ తెలుగులో నిలుపుతుంది.
- source_word: הַבַּרְקֳנִים
  choice: ముళ్లపొదలు
  rationale: ఖచ్చితమైన వృక్షజాతి తెలియనందున అతిగా నిర్దిష్టం చేయకుండా గుచ్చే మొక్క అనే ప్రధాన భావాన్ని ఇస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో బిరుదు కాకుండా దైవనామమే ఉంది. అందువల్ల దానిని దాచకుండా, సాధారణంగా పునర్నిర్మిత ఉచ్చారణకు దగ్గరగా ‘యాహ్వే’ అని లిప్యంతరీకరించబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కథనశైలి వాడబడింది. ‘నూర్చివేస్తాను’ అనే మాట మూలంలోని వ్యవసాయ రూపకాన్నీ బెదిరింపు తీవ్రతనూ కాపాడుతుంది. వృక్షజాతి అనిశ్చితిని పాదసూచికలో స్పష్టంగా ఉంచాం.
