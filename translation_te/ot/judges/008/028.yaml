source:
  edition: WLC
  text: וַ/יִּכָּנַ֣ע מִדְיָ֗ן לִ/פְנֵי֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/לֹ֥א יָסְפ֖וּ לָ/שֵׂ֣את רֹאשָׁ֑/ם וַ/תִּשְׁקֹ֥ט הָ/אָ֛רֶץ אַרְבָּעִ֥ים שָׁנָ֖ה בִּ/ימֵ֥י גִדְעֽוֹן׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/028.yaml
  text: So Midian was subdued before the sons of Israel[a], and they did not again lift up their head. And the land had rest forty years in the days of Gideon.
translation:
  language: te
  text: ఈ విధంగా మిద్యాను ఇశ్రాయేలీయుల ఎదుట లోబడిపోయింది; మిద్యానీయులు మళ్లీ తల ఎత్తలేదు.[a] గిద్యోను దినాల్లో దేశానికి నలభై సంవత్సరాలు విశ్రాంతి కలిగింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మళ్లీ తమ బలాన్ని పుంజుకోలేదు” లేదా “మళ్లీ తల పైకెత్తలేదు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכָּנַע
  choice: అణచివేయబడింది
  rationale: నిఫ్అల్ రూపంలోని నిష్క్రియ భావాన్ని, సైనిక సందర్భంలో మిద్యాను లోబడిన స్థితిని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: לִפְנֵי
  choice: ఎదుట
  rationale: ఇశ్రాయేలీయులతో సంబంధంలో మిద్యాను లోబడిందనే హెబ్రీయ సమాసప్రయోగాన్ని అతిగా విపులీకరించకుండా నిలుపుతుంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులు
  rationale: ఇది ఒక జాతీయ సమూహాన్ని సూచించే స్థిరమైన హెబ్రీయ పదబంధం; ఆధునిక తెలుగులో సహజంగా, సమగ్రంగా ‘ఇశ్రాయేలీయులు’ అని అనువదించబడింది.
- source_word: וְלֹא יָסְפוּ
  choice: మళ్లీ ... లేకపోయారు
  rationale: యָסַף + క్రియారూపం ఇక్కడ పూర్వపు శక్తి లేదా దూకుడును తిరిగి ప్రదర్శించకపోవడాన్ని సూచిస్తుంది.
- source_word: לָשֵׂאת רֹאשָׁם
  choice: తల ఎత్తలేకపోయారు
  rationale: పునరుద్ధరించిన ధైర్యం, శక్తి లేదా ఆధిపత్యాన్ని సూచించే మూలభాష రూపకాన్ని సహజమైన తెలుగు నుడికారంగా నిలుపుతుంది; ‘లేకపోయారు’ ఓటమి వల్ల ఏర్పడిన అసమర్థతను సందర్భానుగుణంగా వ్యక్తం చేస్తుంది.
- source_word: וַתִּשְׁקֹט
  choice: విశ్రాంతిగా ఉంది
  rationale: న్యాయాధిపతులు గ్రంథంలోని సారాంశ వాక్యాల్లో యుద్ధ కలతల నుంచి శాంతి పొందిన కాలాన్ని సూచించే భావాన్ని అందిస్తుంది.
- source_word: הָאָרֶץ
  choice: దేశం
  rationale: ఇక్కడ ఇశ్రాయేలు దేశభూభాగాన్ని సామూహిక-జాతీయ అర్థంలో సూచిస్తుంది; ఆధునిక తెలుగులో ‘దేశం’ సహజంగా ఉంటుంది.
- source_word: אַרְבָּעִים שָׁנָה
  choice: నలభై సంవత్సరాలు
  rationale: సంఖ్యా వ్యక్తీకరణను నేరుగా, ఎటువంటి వ్యాఖ్యాన విస్తరణ లేకుండా అందిస్తుంది.
- source_word: בִּימֵי גִדְעוֹן
  choice: గిద్యోను కాలంలో
  rationale: హెబ్రీయ కాలసూచక ప్రయోగాన్ని సహజమైన తెలుగులో అందిస్తూ, అది అతని జీవితకాలమంతటినే సూచిస్తుందని అతిగా నిర్దిష్టం చేయదు.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל అనువాదం
  choice: ఇశ్రాయేలీయులు
  alternative: ఇశ్రాయేలు కుమారులు / ఇశ్రాయేలు ప్రజలు
  rationale: మూలంలోని పదశః పుంలింగ రూపాన్ని తెలుగులో కృత్రిమంగా ప్రతిరూపించకుండా, జాతీయ నామంగా దాని ఉద్దేశిత సామూహిక అర్థాన్ని సహజంగా అందిస్తుంది.
- issue: לָשֵׂאת רֹאשָׁם అనే హెబ్రీయ రూపకాన్ని నిలుపడం
  choice: తల ఎత్తలేకపోయారు
  alternative: తమ బలాన్ని తిరిగి పొందలేకపోయారు
  rationale: మూలంలోని దృశ్యరూపకాన్ని ప్రధాన పాఠ్యంలో నిలిపి, అది బలం లేదా ఆధిపత్యం తిరిగి పొందడాన్ని సూచించవచ్చనే భావాన్ని పాదసూచికలో ఉంచడం ద్వారా వ్యాఖ్యానాన్ని పాఠ్యంలోనే నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన వాక్యనిర్మాణం వాడబడింది. ‘తల ఎత్తడం’ అనే నుడికారం మూలభాష రూపకాన్ని తెలుగులోనూ సులభంగా అర్థమయ్యేలా నిలుపుతుంది. జాతీయ సమూహానికి ‘ఇశ్రాయేలీయులు’ అనే సాధారణ రూపం ఎంచుకోబడింది.
