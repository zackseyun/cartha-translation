  yaml_path: translation/ot/judges/008/019.yaml
  text: And he said[a], “They were my brothers, the sons of my mother. As Yahweh lives, if you had let them live[b], I would not have killed you.”
translation:
  language: te
  text: 'అతడు ఇలా అన్నాడు: “వారు నా సహోదరులు—నా తల్లి కుమారులు.[a] యాహ్వే జీవిస్తున్నంత నిశ్చయంగా చెబుతున్నాను: మీరు వారిని బతకనిచ్చి ఉంటే, నేను మిమ్మల్ని చంపి ఉండేవాణ్ణి కాదు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “నా తల్లి కుమారులు” అంటే కేవలం బంధువులు కాదు; ఒకే తల్లికి పుట్టిన సహోదరులు.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמַר
  choice: అతడు ఇలా అన్నాడు
  rationale: హీబ్రూ కథన ప్రవాహంలోని సాధారణ wayyiqtol రూపాన్ని సహజమైన ఆధునిక తెలుగు కథన శైలిలో అందిస్తుంది.
- source_word: אַחַי
  choice: నా సహోదరులు
  rationale: ఇక్కడ ఇది సాధారణ బంధువులను కాక నిజమైన అన్నదమ్ములను సూచిస్తుంది; వెంట వచ్చే ‘నా తల్లి కుమారులు’ అనే వివరణ దీనిని స్పష్టం చేస్తుంది.
- source_word: בְּנֵי אִמִּי
  choice: నా తల్లి కుమారులు
  rationale: మూలంలోని సమానార్థక వివరణను నేరుగా నిలుపుతూ, వారు ఒకే తల్లికి పుట్టిన సహోదరులని తెలియజేస్తుంది.
- source_word: חַי יְהוָה
  choice: యాహ్వే జీవిస్తున్నంత నిశ్చయంగా చెబుతున్నాను
  rationale: ‘యాహ్వే సజీవుడు’ అనే ప్రమాణ సూత్రంలోని గంభీరతను సహజమైన తెలుగులో వ్యక్తపరుస్తుంది; ‘చెబుతున్నాను’ అనేది ప్రమాణ సందర్భాన్ని స్పష్టం చేయడానికి సరఫరా చేసిన పదం.
- source_word: לוּ הַחֲיִתֶם אוֹתָם
  choice: మీరు వారిని బతకనిచ్చి ఉంటే
  rationale: לוּ సూచించే జరగని గత షరతును, חיה హిఫీల్‌లోని ‘బతికనివ్వడం/సజీవంగా ఉంచడం’ భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: לֹא הָרַגְתִּי אֶתְכֶם
  choice: నేను మిమ్మల్ని చంపి ఉండేవాణ్ణి కాదు
  rationale: గతంలో నెరవేరని షరతుకు సంబంధించిన ఫలితాన్ని సహజమైన తెలుగు ప్రతికల్పన రూపంలో వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: ప్రమాణ వాక్యంలో יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో ఉన్న వ్యక్తిగత దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగు లిపిలో ధ్వన్యనువాదంగా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరమైన ప్రత్యక్ష ప్రసంగ శైలి వాడబడింది. హీబ్రూ ప్రమాణ సూత్రం మరియు గత ప్రతికల్పన భావం స్పష్టంగా నిలుపబడ్డాయి.
