  terminology: The personal-name forms “జెబహు” and “సల్మున్నా,” the military term “శిబిరం,” and “భయాందోళనకు గురిచేశాడు” are suitable. The footnote appropriately preserves the semantic range of הֶחֱרִיד without forcing “routed” into the main text.
