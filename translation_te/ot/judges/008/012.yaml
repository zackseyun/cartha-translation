translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలిని ఉపయోగించాం. హీబ్రూ వాక్యంలోని వరుస చర్యలను తెలుగులో సులభంగా చదవడానికి రెండు వాక్యాలుగా విభజించాం; చివరి క్రియలోని భయం/సైనిక చెదరగొట్టడం అనే అర్థవిస్తృతిని పాదసూచికలో నిలిపాం.
