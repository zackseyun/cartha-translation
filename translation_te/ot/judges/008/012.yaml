source:
  edition: WLC
  text: וַ/יָּנ֗וּסוּ זֶ֚בַח וְ/צַלְמֻנָּ֔ע וַ/יִּרְדֹּ֖ף אַחֲרֵי/הֶ֑ם וַ/יִּלְכֹּ֞ד אֶת שְׁנֵ֣י מַלְכֵ֣י מִדְיָ֗ן אֶת זֶ֨בַח֙ וְ/אֶת צַלְמֻנָּ֔ע וְ/כָל הַֽ/מַּחֲנֶ֖ה הֶחֱרִֽיד־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/012.yaml
  text: Zebah and Zalmunna fled[a], and he pursued them and captured the two kings of Midian, Zebah and Zalmunna; and he threw the whole camp into panic.
translation:
  language: te
  text: జెబహు, సల్మున్నా పారిపోయారు. అతడు వారిని వెంబడించి మిద్యాను ఇద్దరు రాజులైన జెబహును, సల్మున్నాను పట్టుకున్నాడు; శిబిరమంతటినీ భయాందోళనకు గురిచేశాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “శిబిరమంతటినీ భయపెట్టాడు”; లేదా, “శిబిరమంతటినీ చెదరగొట్టాడు.” హీబ్రూ క్రియకు వణికించడం లేదా భయాందోళన కలిగించడం అనే అర్థం ఉంది; ఈ యుద్ధ సందర్భంలో సైన్యాన్ని చెదరగొట్టడం అనే భావం కూడా ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּנוּסוּ
  choice: పారిపోయారు
  rationale: נוּס అనే క్రియ పారిపోవడం లేదా తప్పించుకొని పోవడం అనే భావాన్ని ఇస్తుంది. ఆధునిక తెలుగు కథనంలో ‘పారిపోయారు’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: זֶבַח וְצַלְמֻנָּע
  choice: జెబహు, సల్మున్నా
  rationale: వ్యక్తుల పేర్లను అనువదించకుండా, వాటి హీబ్రూ ఉచ్చారణకు దగ్గరగా తెలుగు లిపిలో ఇచ్చాం.
- source_word: וַיִּרְדֹּף אַחֲרֵיהֶם
  choice: అతడు వారిని వెంబడించి
  rationale: רדף + אחרי అంటే ఒకరి వెనుక తరుముతూ వెళ్లడం. ‘వెంబడించి’ యుద్ధకథనానికి తగిన సహజమైన ప్రామాణిక తెలుగు పదం.
- source_word: וַיִּלְכֹּד
  choice: పట్టుకున్నాడు
  rationale: לכד ఇక్కడ శత్రు రాజులను సజీవంగా పట్టుకోవడం అనే సైనిక సందర్భార్థాన్ని కలిగి ఉంది. ‘పట్టుకున్నాడు’ సాధారణ పాఠకులకు సహజంగా అర్థమవుతుంది.
- source_word: שְׁנֵי מַלְכֵי מִדְיָן
  choice: మిద్యాను రాజులిద్దరైన
  rationale: హీబ్రూలోని సంబంధాన్ని తెలుగులో సహజంగా వ్యక్తపరుస్తూ, తరువాత వచ్చే పేర్లు ఆ ఇద్దరు రాజులను గుర్తిస్తున్నాయని స్పష్టం చేస్తుంది.
- source_word: אֶת זֶבַח וְאֶת צַלְמֻנָּע
  choice: జెబహును, సల్మున్నాను
  rationale: ముందు ప్రస్తావించిన ఇద్దరు రాజులు ఎవరో తెలిపే హీబ్రూ పునరుక్తిని స్పష్టత, ఉద్ఘాటన కోసం నిలిపాం.
- source_word: וְכָל הַמַּחֲנֶה
  choice: శిబిరమంతటినీ
  rationale: מַחֲנֶה ఇక్కడ సైనిక శిబిరాన్ని లేదా అందులోని సైన్యాన్ని సమష్టిగా సూచిస్తుంది. ‘శిబిరమంతటినీ’ ఆ సమష్టి భావాన్ని నిలుపుతుంది.
- source_word: הֶחֱרִיד
  choice: భయాందోళనకు గురిచేశాడు
  rationale: חרד యొక్క హిఫీల్ రూపం వణికించడం, భయపెట్టడం, కలవరపరచడం అనే కారణార్థాన్ని ఇస్తుంది. యుద్ధ సందర్భంలో ‘భయాందోళనకు గురిచేశాడు’ భయంతోపాటు ఏర్పడిన సైనిక కలవరాన్నీ తెలియజేస్తుంది.
