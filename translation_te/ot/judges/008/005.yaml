revisions:
- from: అప్పుడు అతడు సుక్కోతు పట్టణపు పురుషులతో, “దయచేసి నాతో వస్తున్న ప్రజలకు రొట్టెలు ఇవ్వండి[a]. వారు అలసిపోయారు; నేనైతే మిద్యాను రాజులైన జెబహును సల్మున్నాను తరుముతున్నాను” అన్నాడు.
  to: అప్పుడు అతడు సుక్కోతు పురుషులతో ఇలా అన్నాడు, “దయచేసి నాతో వస్తున్న ప్రజలకు రొట్టెలు ఇవ్వండి[a], ఎందుకంటే వారు అలసిపోయారు, నేను మిద్యాను రాజులైన జెబహును, సల్మున్నాను తరుముతున్నాను.”
  rationale: «నేనైతే»ను «నేను»గా మార్చి, హీబ్రూ వాక్యంలోని అనవసరమైన వ్యతిరేక భావాన్ని తొలగించాం. పేర్ల జతకు కామా జోడించాం. నుడికారం యొక్క అర్థానువాదం మరియు పాదసూచికలోని అక్షరార్థ వివరణను నిలిపాం.
