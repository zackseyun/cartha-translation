translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. హీబ్రూ నుడికారాన్ని ప్రధాన పాఠంలో అర్థానుసారంగా ఇచ్చి, దాని అక్షరార్థ రూపాన్ని పాదసూచికలో నిలిపాం.
