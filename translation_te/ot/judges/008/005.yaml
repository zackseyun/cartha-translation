id: JDG.8.5
reference: Judges 8:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ לְ/אַנְשֵׁ֣י סֻכּ֔וֹת תְּנוּ נָא֙ כִּכְּר֣וֹת לֶ֔חֶם לָ/עָ֖ם אֲשֶׁ֣ר בְּ/רַגְלָ֑/י כִּי עֲיֵפִ֣ים הֵ֔ם וְ/אָנֹכִ֗י רֹדֵ֛ף אַחֲרֵ֛י זֶ֥בַח וְ/צַלְמֻנָּ֖ע מַלְכֵ֥י מִדְיָֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/005.yaml
  text: And he said to the men of Succoth[a], “Please give loaves of bread to the people who are with me, for they are weary, and I am pursuing Zebah and Zalmunna, the kings of Midian.”
translation:
  language: te
  text: అప్పుడు అతడు సుక్కోతు పురుషులతో ఇలా అన్నాడు, “దయచేసి నాతో వస్తున్న ప్రజలకు రొట్టెలు ఇవ్వండి[a], ఎందుకంటే వారు అలసిపోయారు, నేను మిద్యాను రాజులైన జెబహును, సల్మున్నాను తరుముతున్నాను.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “నా పాదాల దగ్గర ఉన్న ప్రజలకు”; ఇది అతనితో వస్తున్న లేదా అతన్ని అనుసరిస్తున్నవారిని సూచించే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְאַנְשֵׁי סֻכּוֹת
  choice: సుక్కోతు పట్టణపు పురుషులతో
  rationale: אַנְשֵׁי అనే పురుష బహువచన రూపాన్ని నిలుపుతూ, పట్టణపు పురుష ప్రతినిధులను సూచించే సహజమైన తెలుగు రూపం.
- source_word: תְּנוּ נָא
  choice: దయచేసి ... ఇవ్వండి
  rationale: ఆజ్ఞార్థక క్రియతో కూడిన נָא లోని వినయపూర్వకమైన లేదా అత్యవసరమైన అభ్యర్థన భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: כִּכְּרוֹת לֶחֶם
  choice: రొట్టెలు
  rationale: సందర్భంలో כִּכָּר రొట్టె ముద్ద లేదా రొట్టెను సూచిస్తుంది; తెలుగులో ‘రొట్టెలు’ స్పష్టంగా, సహజంగా ఉంది.
- source_word: לָעָם אֲשֶׁר בְּרַגְלָי
  choice: నాతో వస్తున్న ప్రజలకు
  rationale: అక్షరార్థంగా ‘నా పాదాల వద్ద ఉన్న ప్రజలు’; ఇక్కడ గిద్యోనుతో కలిసి వస్తున్న లేదా అతన్ని అనుసరిస్తున్న వారిని సూచించే హీబ్రూ నుడికారాన్ని సహజంగా అనువదించింది.
- source_word: עֲיֵפִים
  choice: అలసిపోయారు
  rationale: ప్రయాసవల్ల కలిగిన తీవ్రమైన అలసటను తెలుపుతుంది; శారీరకంగా కూలిపోయారనే అధిక భావాన్ని చేర్చదు.
- source_word: רֹדֵף אַחֲרֵי
  choice: తరుముతున్నాను
  rationale: వర్తమాన కృదంతం తెలిపే కొనసాగుతున్న వెంబడింపును సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: זֶבַח וְצַלְמֻנָּע
  choice: జెబహును సల్మున్నాను
  rationale: వ్యక్తి పేర్లను తెలుగు ధ్వన్యంతరీకరణలో ఇచ్చి, ‘తరుముతున్నాను’ క్రియకు తగిన ద్వితీయా విభక్తిని జోడించింది.
- source_word: מַלְכֵי מִדְיָן
  choice: మిద్యాను రాజులైన
  rationale: హీబ్రూ నిర్మాణంలోని ‘మిద్యాను రాజులు’ అనే సంబంధాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
