translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కథన శైలిని వాడాం. హీబ్రూ వాక్యంలోని ఆజ్ఞ, దానికి విరుద్ధమైన స్పందన, భయానికి కారణంగా అతని యౌవనాన్ని చెప్పే పునరుక్తి అన్నిటినీ నిలిపాం.
