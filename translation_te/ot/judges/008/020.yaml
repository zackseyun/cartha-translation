id: JDG.8.20
reference: Judges 8:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ לְ/יֶ֣תֶר בְּכוֹר֔/וֹ ק֖וּם הֲרֹ֣ג אוֹתָ֑/ם וְ/לֹא שָׁלַ֨ף הַ/נַּ֤עַר חַרְבּ/וֹ֙ כִּ֣י יָרֵ֔א כִּ֥י עוֹדֶ֖/נּוּ נָֽעַר־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/020.yaml
  text: Then he said to Jether his firstborn[a], “Get up, kill them.” But the young man did not draw his sword, because he was afraid, for he was still a young man.
translation:
  language: te
  text: అప్పుడు అతడు తన తొలిపుట్టిన కుమారుడైన యెతెరుతో, “లేచి, వారిని చంపు” అన్నాడు. కానీ ఆ యువకుడు[a] తన కత్తిని ఒరనుండి తీయలేదు, ఎందుకంటే అతడు భయపడ్డాడు; అతడు ఇంకా యువకుడే.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ ‘నఅర్’ అనే పదాన్ని సందర్భానుసారం ‘బాలుడు,’ ‘యువకుడు’ అని అనువదించవచ్చు. ఇక్కడ అతనికి వారిని చంపమని ఆజ్ఞ ఇవ్వబడినందున ‘యువకుడు’ అని అనువదించాం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు అతడు ... అన్నాడు
  rationale: వావ్-క్రమరూపం కథనాన్ని ముందుకు నడిపిస్తుంది; ‘అప్పుడు’ సంఘటనల క్రమాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: לְיֶתֶר
  choice: యెతెరుతో
  rationale: వ్యక్తి పేరును హీబ్రూ ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించాం; אמרతో వచ్చే לְను తెలుగులో సహజమైన సంభాషణా నిర్మాణమైన ‘తో ... అన్నాడు’గా వ్యక్తం చేశాం.
- source_word: בְּכוֹרוֹ
  choice: తన తొలిపుట్టిన కుమారుడైన
  rationale: בכורలోని జననక్రమ భావాన్ని ‘పెద్ద కుమారుడు’ కంటే స్పష్టంగా నిలుపుతుంది.
- source_word: קוּם
  choice: లేచి
  rationale: קום ఆజ్ఞారూపాన్ని తరువాతి ఆజ్ఞతో సహజంగా అనుసంధానించే ఆధునిక తెలుగు రూపం.
- source_word: הֲרֹג אוֹתָם
  choice: వారిని చంపు
  rationale: הרגకు నేరమైన సాధారణ అర్థాన్ని అలంకారికత లేకుండా అందిస్తుంది.
- source_word: וְלֹא שָׁלַף
  choice: అయితే ... దూయలేదు
  rationale: ఆజ్ఞకు విరుద్ధంగా యువకుడు చర్య తీసుకోకపోవడాన్ని ‘అయితే’ స్పష్టం చేస్తుంది; కత్తిని ఒర నుంచి బయటకు తీయడాన్ని తెలుగులో సహజంగా ‘కత్తిని దూయడం’ అంటారు.
- source_word: הַנַּעַר
  choice: ఆ యువకుడు
  rationale: נער బాలుడి నుండి యువకుడి వరకు వయస్సు పరిధిని సూచించవచ్చు. ఇతడు కత్తి ధరించి, బందీలను చంపగలవాడిగా సంబోధించబడినందున ‘యువకుడు’ సందర్భానికి సరిపోతుంది; పదంలోని విస్తృతార్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: חַרְבּוֹ
  choice: తన కత్తిని
  rationale: స్వామ్యాన్ని తెలుగులో సహజంగా, సందిగ్ధత లేకుండా వ్యక్తం చేస్తుంది.
- source_word: כִּי יָרֵא
  choice: భయపడి
  rationale: కత్తిని దూయకపోవడానికి భయమే కారణమని కారణార్థక క్రియారూపంతో సహజంగా తెలియజేస్తుంది.
- source_word: כִּי עוֹדֶנּוּ נָעַר
  choice: ఎందుకంటే అతడు ఇంకా యువకుడే
  rationale: עוֹדֶנּוּలోని ‘ఇంకా’ అనే కొనసాగింపు భావాన్నీ, נער పునరుక్తినీ నిలుపుతుంది.
