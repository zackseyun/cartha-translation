  text: וְ/לֹֽא עָשׂ֣וּ חֶ֔סֶד עִם בֵּ֥ית יְרֻבַּ֖עַל גִּדְע֑וֹן כְּ/כָל הַ/טּוֹבָ֔ה אֲשֶׁ֥ר עָשָׂ֖ה עִם יִשְׂרָאֵֽל־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/035.yaml
  text: And they did not show kindness to the house of Jerubbaal (that is, Gideon), in keeping with all the good that he had done for Israel.
translation:
  language: te
  text: యెరుబ్బయలు అనగా గిద్యోను ఇశ్రాయేలుకు చేసిన సమస్త మేలుకు తగినట్లుగా, వారు అతని ఇంటివారి పట్ల దయ చూపలేదు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֶסֶד
  choice: దయ
  rationale: ఈ సందర్భంలో కుటుంబం పట్ల చూపవలసిన విశ్వాసపూర్వక కృతజ్ఞతతో కూడిన మేలును సూచిస్తుంది; సహజమైన తెలుగులో ‘దయ చూపడం’ మూల భావాన్ని విస్తృతంగా నిలుపుతుంది.
- source_word: בֵּית
  choice: కుటుంబం
  rationale: ఇక్కడ భవనం కాదు, గిద్యోను వంశస్థులు లేదా ఇంటివారిని సూచిస్తుంది; ఆధునిక పాఠకులకు ‘కుటుంబం’ స్పష్టంగా ఉంటుంది.
- source_word: כְּכָל הַטּוֹבָה
  choice: చేసిన మేలంతటికి తగినట్లుగా
  rationale: గిద్యోను చేసిన సమస్త మేలుకు అనుగుణంగా ప్రతిస్పందించలేదనే పోలికను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: יְרֻבַּעַל גִּדְעוֹן
  choice: యెరుబ్బయలు, అంటే గిద్యోను
  rationale: రెండు పేర్లు ఒకే వ్యక్తిని సూచిస్తున్నాయని సందర్భానుసారంగా స్పష్టం చేస్తూ రెండింటినీ నిలుపుతుంది.
theological_decisions:
- issue: חֶסֶד అనే పదంలోని ఒడంబడిక విశ్వాసం లేదా సాధారణ దయ భావం
  choice: దయ
  alternative: విశ్వాసపూర్వక ప్రేమ
  rationale: ఈ వచనంలో ప్రధానంగా గిద్యోను కుటుంబానికి ఇశ్రాయేలు చూపని కృతజ్ఞతాపూర్వక మేలే ఉద్దేశం. మరింత ప్రత్యేకమైన ఒడంబడిక పరిభాషను చేర్చకుండా మూలంలోని భావ విస్తృతిని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదంగా, సాధారణ పాఠకులకు స్పష్టంగా ఉండే వాక్యనిర్మాణం. హీబ్రూ వాక్యంలోని నిరాకరణను, గిద్యోను చేసిన మేలుకు తగిన ప్రతిస్పందన లేకపోవడాన్ని ముందుకు తెచ్చింది.
