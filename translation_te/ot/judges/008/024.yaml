source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אֲלֵ/הֶ֜ם גִּדְע֗וֹן אֶשְׁאֲלָ֤ה מִ/כֶּם֙ שְׁאֵלָ֔ה וּ/תְנוּ לִ֕/י אִ֖ישׁ נֶ֣זֶם שְׁלָל֑/וֹ כִּֽי נִזְמֵ֤י זָהָב֙ לָ/הֶ֔ם כִּ֥י יִשְׁמְעֵאלִ֖ים הֵֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/024.yaml
  text: 'Then Gideon said to them, “Let me ask one request of you: each man, give me an earring from his spoil.” For they had gold earrings, because they were Ishmaelites.'
translation:
  language: te
  text: 'అప్పుడు గిద్యోను వారితో, “నేను మీ దగ్గర ఒక అభ్యర్థన చేస్తున్నాను: మీలో ప్రతి ఒక్కరూ తమ దోపుడు సొమ్ములోనుండి ఒక చెవిపోగును నాకు ఇవ్వండి” అన్నాడు. వారు ఇష్మాయేలీయులు కాబట్టి వారి దగ్గర బంగారు చెవిపోగులు ఉండేవి.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֶשְׁאֲלָה מִכֶּם שְׁאֵלָה
  choice: నేను మిమ్మల్ని ఒకటి అడుగుతాను
  rationale: హీబ్రూ ధాతు పునరుక్తిని తెలుగులో సహజంగా వ్యక్తం చేస్తూ, గిద్యోను ఒక అభ్యర్థన చేస్తున్న భావాన్ని నిలుపుతుంది.
- source_word: אִישׁ
  choice: మీలో ప్రతి ఒక్కరూ
  rationale: పంపిణీ భావంలో ఉన్న ‘ఒక్కొక్క మనిషి’ అనే అర్థాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: נֶזֶם
  choice: చెవిపోగు
  rationale: ఈ సందర్భంలో తరువాతి వాక్యంలోని బంగారు ఆభరణాల సూచనతో సరిపడే చెవి ఆభరణం అనే అర్థాన్ని ఎంచుకుంది.
- source_word: שְׁלָלוֹ
  choice: తన దోపుడు సొమ్ము
  rationale: యుద్ధంలో స్వాధీనం చేసుకున్న వ్యక్తిగత కొల్లసొత్తును సూచిస్తుంది.
- source_word: יִשְׁמְעֵאלִים
  choice: ఇష్మాయేలీయులు
  rationale: జనసమూహ నామానికి సాధారణ తెలుగు లిప్యంతరీకరణ.
theological_decisions:
- issue: మిద్యానీయులను ఇష్మాయేలీయులు అని పిలవడం
  choice: మూలంలోని ‘ఇష్మాయేలీయులు’ అనే గుర్తింపును యథాతథంగా ఉంచడం
  alternative: ఈ పేరును ‘మిద్యానీయులు’గా మార్చడం లేదా రెండింటి సంబంధాన్ని వివరణలో పరిష్కరించడం
  rationale: వచనం ఉపయోగించిన విస్తృత లేదా పరస్పర సంబంధిత జాతిపేరును అనువాదం సిద్ధాంతపరంగా లేదా చారిత్రకంగా సమన్వయపరచకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయితే కథనానికి తగిన గౌరవప్రదమైన శైలితో అనువదించబడింది. మూలంలోని కారణసూచక ‘కాబట్టి’ సంబంధం నిలుపబడింది.
