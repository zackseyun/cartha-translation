  yaml_path: translation/ot/judges/008/011.yaml
  text: Then Gideon went up by the route of those who dwell in tents[a], east of Nobah and Jogbehah, and struck the camp while the camp was unsuspecting.
translation:
  language: te
  text: అప్పుడు గిద్యోను గుడారాల్లో నివసించేవారి దారిన, నోబహు, యొగ్బెహాలకు తూర్పున వెళ్లి శిబిరంపై దాడి చేశాడు; ఆ శిబిరం నిశ్చింతగా ఉంది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆ శిబిరం భద్రంగా ఉంది.” హీబ్రూ పదం భద్రతగా లేదా నమ్మకంగా ఉన్న స్థితిని సూచించవచ్చు; ఈ సందర్భంలో శిబిరం అప్రమత్తంగా లేకపోవడం అనే భావమూ ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: వెళ్లి
  rationale: עלה యొక్క ప్రాథమిక భావం ‘పైకి వెళ్లడం’; అయితే ఇక్కడ భౌగోళికంగా ఎక్కడం స్పష్టంగా లేక, మార్గంలో గిద్యోను సాగినట్లు సహజమైన తెలుగులో ‘వెళ్లి’ అని ఇచ్చాం.
- source_word: דֶּרֶךְ הַשְּׁכוּנֵי בָאֳהָלִים
  choice: గుడారాల్లో నివసించేవారి మార్గంలో
  rationale: ‘గుడారాల్లో నివసించేవారు’ అనే మూలంలోని వివరణాత్మక భావాన్ని నిలిపి, ‘సంచారజాతివారు’ వంటి అదనపు సామాజిక నిర్ధారణను చేర్చలేదు.
- source_word: מִקֶּדֶם לְנֹבַח וְיָגְבֳּהָה
  choice: నోబహుకు, యొగ్బెహాకు తూర్పుగా
  rationale: ఈ భౌగోళిక సందర్భంలో קדם రెండు స్థలాలకు తూర్పున ఉన్న స్థానాన్ని సూచిస్తుంది; స్థలనామాలను లిప్యంతరీకరించాం.
- source_word: וַיַּךְ אֶת־הַמַּחֲנֶה
  choice: శిబిరంపై దాడి చేశాడు
  rationale: נכה అక్షరార్థంగా ‘కొట్టడం’ అయినా, సైనిక సందర్భంలో ‘శిబిరాన్ని కొట్టాడు’ కంటే ‘శిబిరంపై దాడి చేశాడు’ ఆధునిక తెలుగులో సహజంగా, సందర్భానుకూలంగా ఉంది; సంపూర్ణంగా ఓడించాడనే అర్థాన్ని చేర్చదు.
- source_word: וְהַמַּחֲנֶה הָיָה בֶטַח
  choice: ఆ శిబిరం నిశ్చింతగా ఉంది
  rationale: בטח భద్రత, నమ్మకం లేదా నిర్భయ స్థితిని సూచించగలదు. ‘అప్రమత్తంగా లేదు’ అని కారణార్థాన్ని మాత్రమే ఖరారు చేయకుండా, మూలంలోని స్థితి భావాన్ని ‘నిశ్చింతగా’ నిలిపాం; శిబిరం అనే పునరుక్తినీ ఉంచాం.
