- from: అప్పుడు అతడు జెబహును, సల్మున్నాను చూసి, “తాబోరులో మీరు చంపిన మనుషులు ఎక్కడ ఉన్నారు?[a]” అని అడిగాడు. వారు, “వారు నీలాగే ఉన్నారు; వారిలో ప్రతి ఒక్కరూ రాజకుమారునిలా కనిపించాడు”[b] అని చెప్పారు.
