  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని ప్రశ్న-జవాబు నిర్మాణం, గిద్యోనుతో పోలిక, రాజవంశీయ రూపం అనే భావం నిలుపబడ్డాయి. పాదసూచిక సూచికలు [a], [b] ప్రధాన పాఠ్యంలో సంబంధిత స్థానాల్లో చేర్చబడ్డాయి.
