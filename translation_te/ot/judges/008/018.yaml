source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר אֶל זֶ֨בַח֙ וְ/אֶל צַלְמֻנָּ֔ע אֵיפֹה֙ הָ/אֲנָשִׁ֔ים אֲשֶׁ֥ר הֲרַגְתֶּ֖ם בְּ/תָב֑וֹר וַֽ/יֹּאמרוּ֙ כָּמ֣וֹ/ךָ כְמוֹ/הֶ֔ם אֶחָ֕ד כְּ/תֹ֖אַר בְּנֵ֥י הַ/מֶּֽלֶךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/018.yaml
  text: Then he said to Zebah and Zalmunna[a], “Where are the men whom you killed at Tabor?” And they said, “As you are, so were they[b]; each one had the appearance of the sons of a king.”
translation:
  language: te
  text: అప్పుడు అతడు జెబహుతోను సల్మున్నాతోను, “తాబోరులో మీరు చంపిన పురుషులు ఎలాంటి మనుషులు?” అని అడిగాడు.[a] వారు, “నీవు ఎలా ఉన్నావో వారు కూడా అలాగే ఉన్నారు; ప్రతి ఒక్కరి రూపం రాజకుమారుల రూపంలా ఉండేది” అని చెప్పారు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: తాబోరు అంటే తాబోరు కొండ.
    reason: cultural_note
  - marker: b
    text: లేదా, “వారు నీలాగే ఉన్నారు; ప్రతి ఒక్కరి రూపం రాజు కుమారుల రూపంలా ఉండేది.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵיפֹה
  choice: ఎక్కడ ఉన్నారు?
  rationale: స్థానాన్ని ప్రశ్నించే క్రియావిశేషణం. చంపబడినవారి గురించి అడుగుతున్నప్పటికీ, హెబ్రీ మూలంలోని ‘ఎక్కడ?’ అనే ప్రత్యక్ష ప్రశ్నను తెలుగులో సహజంగా నిలుపుతుంది.
- source_word: הָאֲנָשִׁים
  choice: మనుషులు
  rationale: ఇక్కడ గుర్తించదగిన వయోజన పురుషులను సూచిస్తుంది; సాధారణ ‘ప్రజలు’ కంటే ‘మనుషులు’ సందర్భానికి సరిపోతుంది.
- source_word: הֲרַגְתֶּם
  choice: మీరు చంపిన
  rationale: హెబ్రీ క్రియ యొక్క ప్రాథమిక భావం ‘చంపడం’. ‘హత్య చేసిన’ అని అనువదిస్తే మూలంలో స్పష్టంగా లేని న్యాయపరమైన తీర్పు చేరుతుంది.
- source_word: בְּתָבוֹר
  choice: తాబోరులో
  rationale: בְּ ఉపసర్గకు సందర్భానుసారంగా ‘లో/వద్ద/మీద’ అనే భావాలు ఉండవచ్చు. ప్రదేశనామంతో ‘తాబోరులో’ సహజమైన తెలుగు; అది కొండను సూచిస్తుందని పాదసూచిక వివరిస్తుంది.
- source_word: כָּמוֹךָ כְמוֹהֶם
  choice: వారు నీలాగే ఉన్నారు
  rationale: మూలంలోని సంక్షిప్త, సమాంతర పోలికను తెలుగులో అర్థవంతంగా వ్యక్తపరుస్తుంది; గిద్యోనుతో వారి పోలికను నిలుపుతుంది.
- source_word: אֶחָד
  choice: వారిలో ప్రతి ఒక్కరూ
  rationale: ఇక్కడ אֶחָד పంపిణీ భావంలో ఉండి, ఆ మనుషుల్లో ఒక్కొక్కరినీ సూచిస్తుంది.
- source_word: כְּתֹאַר
  choice: కనిపించాడు
  rationale: תֹּאַר రూపం, ఆకృతి, బాహ్య రూపురేఖలను సూచిస్తుంది. ‘కనిపించాడు’ ఆధునిక తెలుగులో సహజంగా ఆ బాహ్య పోలికను తెలియజేస్తుంది.
- source_word: בְּנֵי הַמֶּלֶךְ
  choice: రాజకుమారునిలా
  rationale: అక్షరార్థంగా ‘రాజు కుమారులు’; ఏదో నిర్దిష్ట రాజు కుమారులకంటే రాజవంశీయ రూపాన్ని సూచించే సందర్భంలో ఏకవచన పంపిణీ పోలికగా ‘రాజకుమారునిలా’ సహజంగా ఉంటుంది.
- source_word: וַיֹּאמֶר ... וַיֹּאמְרוּ
  choice: అని అడిగాడు ... అని చెప్పారు
  rationale: రెండు క్రియల మూలార్థం ‘చెప్పాడు/చెప్పారు’; మొదటి మాట ప్రశ్న కావడంతో తెలుగులో ‘అడిగాడు’ సహజం, రెండవదానికి తటస్థమైన ‘చెప్పారు’ వాడబడింది.
