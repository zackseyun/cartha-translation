source:
  edition: WLC
  text: וַ/יֹּאמְר֤וּ אִֽישׁ יִשְׂרָאֵל֙ אֶל גִּדְע֔וֹן מְשָׁל בָּ֨/נוּ֙ גַּם אַתָּ֔ה גַּם בִּנְ/ךָ֖ גַּ֣ם בֶּן בְּנֶ֑/ךָ כִּ֥י הוֹשַׁעְתָּ֖/נוּ מִ/יַּ֥ד מִדְיָֽן־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/022.yaml
  text: Then the men of Israel said to Gideon[a], “Rule over us—you, your son, and your grandson as well—for you have saved us from the hand of Midian.”
translation:
  language: te
  text: 'అప్పుడు ఇశ్రాయేలు పురుషులు గిద్యోనుతో ఇలా అన్నారు: “నీవు కూడా, నీ కుమారుడు కూడా, నీ కుమారుని కుమారుడు[a] కూడా మమ్మల్ని పాలించండి—ఎందుకంటే నీవు మిద్యాను చేతిలోనుండి మమ్మల్ని రక్షించావు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నీ మనవడు.’ హీబ్రూ పాఠం ‘నీ కుమారుని కుమారుడు’ అని చెప్పి వరుస తరాలను స్పష్టంగా సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: అప్పుడు ... అన్నారు
  rationale: వావ్-అనుక్రమ రూపం కథనాన్ని ముందుకు నడిపిస్తుంది. ఆధునిక తెలుగు కథన ప్రవాహంలో ‘అప్పుడు’ ఆ క్రమాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: אִישׁ יִשְׂרָאֵל
  choice: ఇశ్రాయేలు పురుషులు
  rationale: אִישׁ ఏకవచన రూపంలో ఉన్నా, బహువచన క్రియతో ఇక్కడ సమూహార్థకంగా ఇశ్రాయేలు పురుషులను సూచిస్తుంది.
- source_word: מְשָׁל בָּנוּ
  choice: మమ్మల్ని పాలించు
  rationale: משל ఇక్కడ రాజకీయ అధికారంతో పాలించడాన్ని సూచిస్తుంది. ‘పాలించు’ ప్రత్యక్షమైన, సహజమైన తెలుగు రూపం.
- source_word: גַּם אַתָּה גַּם בִּנְךָ גַּם בֶּן בְּנֶךָ
  choice: నీవు, నీ కుమారుడు, నీ కుమారుని కుమారుడు కూడా
  rationale: పునరుక్తమైన גַּם గిద్యోనుతో ఆగని వరుస తరాల పాలనను నొక్కిచెబుతుంది. ‘నీ కుమారుని కుమారుడు’ అనే స్పష్టమైన రూపం హీబ్రూ తరాల క్రమాన్ని కాపాడుతుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: పాలించమనే అభ్యర్థనకు కారణాన్ని పరిచయం చేస్తుంది.
- source_word: הוֹשַׁעְתָּנוּ
  choice: నీవు మమ్మల్ని రక్షించావు
  rationale: ישע ఇక్కడ శత్రు ఆధీనంనుండి విడిపించడం లేదా కాపాడడం అనే భావాన్ని ఇస్తుంది. ‘రక్షించావు’ సైనిక సందర్భానికీ, విస్తృత బైబిలు పదప్రయోగానికీ సరిపోతుంది.
- source_word: מִיַּד מִדְיָן
  choice: మిద్యాను చేతిలోనుండి
  rationale: ‘చేయి’ అధికారం లేదా అదుపును సూచించే హీబ్రూ నుడికారం. తెలుగులోనూ అర్థమయ్యే బైబిలు రూపకాన్ని నిలుపుతుంది.
theological_decisions:
- issue: గిద్యోనుకు ప్రతిపాదించిన పాలన స్వభావం
  choice: గిద్యోను, అతని కుమారుడు, అతని కుమారుని కుమారుడు వరుసగా పాలించాలనే వంశపారంపర్య రాజకీయ పాలన అభ్యర్థనగా అనువదించడం.
  alternative: వంశపారంపర్య భావం లేని సాధారణ నాయకత్వ అభ్యర్థనగా అనువదించడం.
  rationale: משל అనే ఆజ్ఞారూపంతోపాటు ‘నీవు ... నీ కుమారుడు ... నీ కుమారుని కుమారుడు’ అనే స్పష్టమైన తరాల వరుస, తాత్కాలిక సైనిక నాయకత్వం కంటే కొనసాగుతూ వచ్చే కుటుంబ పాలనను సూచిస్తుంది. అయితే మూలంలో లేని ‘రాజు’ లేదా ‘రాజ్యం’ అనే పదాలను చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే శైలిని ఉపయోగించాం. ‘మిద్యాను చేతిలోనుండి’ అనే బైబిలు నుడికారాన్ని ఉద్దేశపూర్వకంగా నిలిపి, తరాల వరుసను మూలానికి దగ్గరగా వ్యక్తం చేశాం.
