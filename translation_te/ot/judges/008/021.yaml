source:
  edition: WLC
  text: וַ/יֹּ֜אמֶר זֶ֣בַח וְ/צַלְמֻנָּ֗ע ק֤וּם אַתָּה֙ וּ/פְגַע בָּ֔/נוּ כִּ֥י כָ/אִ֖ישׁ גְּבוּרָת֑/וֹ וַ/יָּ֣קָם גִּדְע֗וֹן וַֽ/יַּהֲרֹג֙ אֶת זֶ֣בַח וְ/אֶת צַלְמֻנָּ֔ע וַ/יִּקַּח֙ אֶת הַ/שַּׂ֣הֲרֹנִ֔ים אֲשֶׁ֖ר בְּ/צַוְּארֵ֥י גְמַלֵּי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/021.yaml
  text: Then Zebah and Zalmunna said[a], “Rise yourself and strike us down, for as the man is, so is his strength.” So Gideon rose and killed Zebah and Zalmunna[c][b], and he took the crescent ornaments that were on the necks of their camels.
translation:
  language: te
  text: అప్పుడు జెబహు, సల్మున్నా, “నీవే లేచి మమ్మల్ని హతమార్చు[a]. ఎందుకంటే మనిషి ఎలాంటివాడో అతని బలం కూడా అలాంటిదే[b]” అన్నారు. అప్పుడు గిద్యోను లేచి జెబహును, సల్మున్నాను చంపి, వారి ఒంటెల మెడలపై ఉన్న చంద్రవంక ఆకారపు ఆభరణాలను[c] తీసుకున్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీవే లేచి మమ్మల్ని కొట్టి పడేయి.” ఇక్కడి హెబ్రీ క్రియ సందర్భంలో ప్రాణాంతక దెబ్బను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: హెబ్రీలో అక్షరార్థంగా, “మనిషి ఎలాంటివాడో, అతని బలం అలాంటిదే.” ఇది ఒక వ్యక్తి స్థాయికి లేదా పరాక్రమానికి తగిన బలం అతనికి ఉంటుందనే సామెతాత్మక మాట.
    reason: cultural_note
  - marker: c
    text: లేదా, “చంద్రవంకలు,” అంటే చంద్రవంక ఆకారంలో ఉన్న అలంకారాలు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר ... זֶבַח וְצַלְמֻנָּע
  choice: అప్పుడు జెబహు, సల్మున్నా ... అన్నారు
  rationale: సంయుక్త కర్తతో హెబ్రీలో ఏకవచన క్రియ రావడం సహజం; తెలుగులో ఇద్దరు మాట్లాడినందున బహువచన క్రియ సహజంగా ఉంటుంది. కథనంలోని వావ్‌ను ‘అప్పుడు’గా అందించాం.
- source_word: קוּם אַתָּה
  choice: మీరే లేచి
  rationale: ప్రత్యేకంగా వచ్చిన אַתָּה ఇచ్చే ఉద్ఘాటనను ‘మీరే’ నిలుపుతుంది; రాజులతో సంభాషణ సందర్భంలో గౌరవ బహువచనం సహజ తెలుగు.
- source_word: וּפְגַע בָּנוּ
  choice: మమ్మల్ని హతమార్చండి
  rationale: פגע అనే క్రియకు ఎదురుపడు, దాడిచేయి, కొట్టు వంటి విస్తృత అర్థాలున్నా, ఇక్కడ ఇది మరణశిక్ష సందర్భంలోని ప్రాణాంతక చర్యను సూచిస్తుంది. ‘హతమార్చండి’ ఆ సందర్భార్థాన్ని స్పష్టంగా, గంభీరంగా అందిస్తుంది.
- source_word: כִּי כָאִישׁ גְּבוּרָתוֹ
  choice: ఎందుకంటే మనిషి ఎలాంటివాడో అతని బలం కూడా అలాంటిదే
  rationale: మూలంలోని సామెత స్వరూపాన్ని, వ్యక్తి సామర్థ్యానికి అతని బలం తగినదనే భావాన్ని నిలుపుతూ తెలుగులో సహజంగా అర్థమయ్యే నిర్మాణాన్ని వాడాం.
- source_word: וַיָּקָם גִּדְעוֹן
  choice: కాబట్టి గిద్యోను లేచి
  rationale: కథన పరిణామాన్ని ‘కాబట్టి’ తెలియజేస్తుంది; ‘లేచి’ అని పునరావృతం చేయడం రాజుల ఆజ్ఞకు గిద్యోను స్పందించిన విధానాన్ని మూలంలాగే ప్రతిధ్వనింపజేస్తుంది.
- source_word: וַיַּהֲרֹג
  choice: చంపి
  rationale: సాధారణంగా చంపడాన్ని సూచించే క్రియకు స్పష్టమైన, ప్రస్తుత తెలుగులో సహజమైన సమానార్థకం.
- source_word: הַשַּׂהֲרֹנִים
  choice: చంద్రవంక ఆభరణాలు
  rationale: ఈ నామవాచకం చంద్రవంక ఆకారపు అలంకారాలను సూచిస్తుంది. ‘చంద్రవంక ఆభరణాలు’ ఆకారాన్నీ వస్తువు స్వభావాన్నీ స్పష్టంగా తెలియజేస్తుంది.
- source_word: אֲשֶׁר בְּצַוְּארֵי גְמַלֵּיהֶם
  choice: వారి ఒంటెల మెడలపై ఉన్న
  rationale: ఆభరణాల స్థానాన్ని తెలుగులో సహజంగా, మూలానికి సమీపంగా తెలియజేస్తుంది.
theological_decisions:
- issue: כָאִישׁ అనే పుంలింగ సామెతాత్మక ప్రయోగం
  choice: మనిషి ఎలాంటివాడో అతని బలం కూడా అలాంటిదే
  alternative: ఒకడు ఎలాంటివాడో అతని బలం కూడా అలాంటిదే
  rationale: ఈ సందర్భం పురుష యోధుని పరాక్రమాన్ని సూచిస్తుంది. ‘మనిషి’ మరియు ‘అతని’ ద్వారా సందర్భంలోని పుంలింగ సూచన నిలుస్తుంది; అదే సమయంలో సామెత తెలుగులో సహజంగా వినిపిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో స్పష్టమైన, గంభీరమైన కథన శైలిని వాడాం. రాజులను ఉద్దేశించిన మాటలో ‘మీరే/మమ్మల్ని/హతమార్చండి’ అనే గౌరవ బహువచనం సహజంగా ఉంటుంది. పేర్లను జెబహు, సల్మున్నా, గిద్యోను అని తెలుగు బైబిలు వాడుకకు అనుకూలంగా లిప్యంతరీకరించాం.
