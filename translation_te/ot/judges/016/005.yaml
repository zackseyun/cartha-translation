translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన కథనశైలి. సంభాషణలో సహజమైన ఏకవచన సంబోధనను, కథనంలో అధికార బిరుదుకు స్పష్టమైన ‘పాలకులు’ అనే పదాన్ని ఉపయోగించాం.
