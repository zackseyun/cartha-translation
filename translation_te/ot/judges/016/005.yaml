id: JDG.16.5
reference: Judges 16:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּעֲל֨וּ אֵלֶ֜י/הָ סַרְנֵ֣י פְלִשְׁתִּ֗ים וַ/יֹּ֨אמְרוּ לָ֜/הּ פַּתִּ֣י אוֹת֗/וֹ וּ/רְאִי֙ בַּ/מֶּה֙ כֹּח֣/וֹ גָד֔וֹל וּ/בַ/מֶּה֙ נ֣וּכַל ל֔/וֹ וַ/אֲסַרְנֻ֖/הוּ לְ/עַנֹּת֑/וֹ וַ/אֲנַ֨חְנוּ֙ נִתַּן לָ֔/ךְ אִ֕ישׁ אֶ֥לֶף וּ/מֵאָ֖ה כָּֽסֶף־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/005.yaml
  text: Then the lords of the Philistines came up to her and said to her[a], “Entice him, and see in what his great strength lies, and by what means we may prevail against him, so that we may bind him to afflict him; and we will each give you eleven hundred pieces of silver.”
translation:
  language: te
  text: 'అప్పుడు ఫిలిష్తీయుల అధిపతులు ఆమె దగ్గరికి వచ్చి ఆమెతో ఇలా అన్నారు: “అతణ్ణి ప్రలోభపెట్టి, అతని గొప్ప బలం దేనిలో ఉందో, మేము దేనివల్ల అతనిపై పైచేయి సాధించి అతణ్ణి బంధించి బాధించగలమో తెలుసుకో. మాలో ప్రతి ఒక్కరం నీకు పదకొండువందల వెండి ముక్కలు[a] ఇస్తాం.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ మూలంలో అక్షరాలా, “పదకొండువందల వెండి.” ఇది ప్రతి ఫిలిష్తీయ అధిపతి ఇచ్చే వెండి ముక్కలను లేదా షెకెల్లను సూచించి ఉండవచ్చు.
    reason: మూలంలో వెండి పరిమాణానికి ప్రమాణపదం స్పష్టంగా లేదు; ‘వెండి ముక్కలు’ అనేది అర్థవంతమైన పూరకం, కాగా ‘షెకెల్లు’ అనే సంభావ్యతను పాదసూచికలో ఉంచాం.
lexical_decisions:
- source_word: וַיַּעֲלוּ אֵלֶיהָ
  choice: ఆమె దగ్గరికి వచ్చి
  rationale: עלה אל ఇక్కడ ఒక వ్యక్తివైపు వెళ్లడాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘దగ్గరికి వచ్చి’ సహజంగా దిశాభావాన్ని అందిస్తుంది.
- source_word: סַרְנֵי פְלִשְׁתִּים
  choice: ఫిలిష్తీయుల పాలకులు
  rationale: סרן అనేది ఫిలిష్తీయ నగర-పాలకుల ప్రత్యేక బిరుదు; ‘పాలకులు’ సాధారణ పాఠకులకు స్పష్టంగా ఉండి వారి అధికార స్థానాన్ని తెలియజేస్తుంది.
- source_word: פַּתִּי
  choice: మాయచేసి
  rationale: పియేల్ ఆజ్ఞారూపం మోసపూరితంగా ఆకర్షించి రహస్యాన్ని రాబట్టడాన్ని సూచిస్తుంది; మూలంలో తప్పనిసరిగా లేని లైంగిక భావాన్ని చేర్చకుండా ‘మాయచేసి’ ఆ భావాన్ని అందిస్తుంది.
- source_word: וּרְאִי בַּמֶּה כֹּחוֹ גָדוֹל
  choice: అతని గొప్ప బలం దేనిలో ఉందో ... తెలుసుకో
  rationale: במה బలానికి ఆధారం లేదా రహస్యం ఏమిటని అడుగుతుంది; ‘దేనిలో ఉందో’ మూల నిర్మాణాన్ని సహజ తెలుగులో నిలుపుతుంది.
- source_word: וּבַמֶּה נוּכַל לוֹ
  choice: మేము దేనివల్ల అతణ్ణి జయించగలమో
  rationale: יכל ל అనే నుడికారం ఒకరిపై పైచేయి సాధించడం లేదా జయించడం అనే భావం ఇస్తుంది; ‘జయించగలమో’ సందర్భానికి తగినది.
- source_word: וַאֲסַרְנֻהוּ לְעַנֹּתוֹ
  choice: బంధించి బాధించగలమో
  rationale: אסר అంటే బంధించడం; ענה పియేల్‌కు బాధించడం, అణచివేయడం, అవమానించడం వంటి విస్తృత భావాలు ఉన్నాయి. ‘బాధించు’ ఆ విస్తృతతను అతిగా నిర్దిష్టం చేయకుండా నిలుపుతుంది.
- source_word: וַאֲנַחְנוּ נִתַּן לָךְ אִישׁ אֶלֶף וּמֵאָה כָּסֶף
  choice: మాలో ప్రతి ఒక్కరం నీకు వెయ్యినూట యాభై తులాల వెండి ఇస్తాం
  rationale: איש ఇక్కడ పంపిణీ భావంతో ‘ప్రతి ఒక్కరు’ అని అర్థం. మూలంలోని సంఖ్య 1,100; כָּסֶף ముందు కొలమానం స్పష్టంగా లేకున్నా సందర్భంలో బరువు/నాణెపు ప్రమాణం సూచితం. ప్రధాన పాఠంలో తెలుగు బైబిలు పాఠకులకు పరిచితమైన ‘తులాలు’ వాడి, ఖచ్చిత మూలరూపాన్ని పాదసూచికలో తెలిపాం.
