  to: అప్పుడు అతని సోదరులూ, అతని తండ్రి ఇంటివారందరూ దిగి వచ్చి, అతన్ని మోసుకొని పైకి తీసుకెళ్లి, సొరా, ఎష్టావోలు మధ్యనున్న అతని తండ్రియైన మానోహు సమాధిలో పాతిపెట్టారు. అతడు ఇశ్రాయేలుకు ఇరవై సంవత్సరాలు న్యాయాధిపతిగా ఉన్నాడు.[a]
