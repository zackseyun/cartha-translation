source:
  edition: WLC
  text: וַ/יֵּרְד֨וּ אֶחָ֜י/ו וְ/כָל בֵּ֣ית אָבִי/הוּ֮ וַ/יִּשְׂא֣וּ אֹת/וֹ֒ וַֽ/יַּעֲל֣וּ וַ/יִּקְבְּר֣וּ אוֹת֗/וֹ בֵּ֤ין צָרְעָה֙ וּ/בֵ֣ין אֶשְׁתָּאֹ֔ל בְּ/קֶ֖בֶר מָנ֣וֹחַ אָבִ֑י/ו וְ/ה֛וּא שָׁפַ֥ט אֶת יִשְׂרָאֵ֖ל עֶשְׂרִ֥ים שָׁנָֽה־׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/031.yaml
  text: Then his brothers and all his father’s household came down[a], carried him away, brought him up, and buried him between Zorah and Eshtaol, in the tomb of Manoah his father. And he judged Israel twenty years.
translation:
  language: te
  text: అప్పుడు అతని సోదరులూ, అతని తండ్రి ఇంటివారందరూ దిగి వచ్చి, అతన్ని మోసుకొని పైకి తీసుకెళ్లి, సొరా, ఎష్టావోలు మధ్యనున్న అతని తండ్రియైన మానోహు సమాధిలో పాతిపెట్టారు. అతడు ఇశ్రాయేలుకు ఇరవై సంవత్సరాలు న్యాయాధిపతిగా ఉన్నాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతడు ఇశ్రాయేలుకు ఇరవై సంవత్సరాలు న్యాయాధిపతిగా ఉండెను.” హీబ్రూ వాక్యాన్ని అతని న్యాయాధిపత్యాన్ని వెనుదిరిగి చెప్పే ముగింపు సారాంశంగా కూడా అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּרְדוּ
  choice: దిగి వచ్చి
  rationale: ירד సూచించే దిగువ దిశలోని కదలికను సహజమైన తెలుగు కథన శైలిలో నిలుపుతుంది.
- source_word: אֶחָיו
  choice: అతని సహోదరులు
  rationale: సందర్భం విస్తృత బంధుత్వాన్ని తప్పనిసరి చేయనందున, సాధారణ అర్థమైన సోదరులను నేరుగా సూచిస్తుంది.
- source_word: כָּל בֵּית אָבִיהוּ
  choice: అతని తండ్రి ఇంటివారందరూ
  rationale: పితృవంశ కుటుంబం లేదా గృహసమూహాన్ని సూచించే హీబ్రూ నుడికారాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וַיִּשְׂאוּ אֹתוֹ
  choice: అతన్ని మోసుకొని
  rationale: అంత్యక్రియల సందర్భంలో శరీరాన్ని మోయడం అనే భావాన్ని స్పష్టంగా ఇస్తుంది.
- source_word: וַיַּעֲלוּ
  choice: పైకి తీసుకెళ్లి
  rationale: עלה లోని ఎగువ దిశ కదలికను నిలుపుతూ, ముందున్న కర్మను తెలుగులో సహజంగా కొనసాగిస్తుంది.
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: అతన్ని ... పాతిపెట్టారు
  rationale: సాధారణ సమాధి క్రియను స్పష్టమైన, ప్రస్తుత ప్రామాణిక తెలుగులో అందిస్తుంది.
- source_word: בֵּין צָרְעָה וּבֵין אֶשְׁתָּאֹל
  choice: జొర్యా ఎష్టాయోలు మధ్య
  rationale: రెండు స్థలాల మధ్యనున్న సమాధి ప్రాంతాన్ని నేరుగా తెలియజేస్తుంది; పేర్లను హీబ్రూ ఉచ్చారణకు సమీపంగా లిప్యంతరీకరించింది.
- source_word: בְּקֶבֶר מָנוֹחַ אָבִיו
  choice: అతని తండ్రి మానోహ సమాధిలో
  rationale: కుటుంబ సమాధి భావానికి సరిపోయే ‘సమాధి’ని ఎంచుకొని, ‘అతని తండ్రి’ అనే సంబంధాన్ని నిలిపింది.
- source_word: וְהוּא שָׁפַט אֶת־יִשְׂרָאֵל
  choice: అతడు ఇశ్రాయేలుకు ... న్యాయాధిపతిగా ఉన్నాడు
  rationale: న్యాయాధిపతుల గ్రంథంలోని పునరావృత పాత్రపదాన్ని నిలుపుతూ, ‘ఇశ్రాయేలును తీర్చాడు’ కంటే ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: עֶשְׂרִים שָׁנָה
  choice: ఇరవై సంవత్సరాలు
  rationale: సంఖ్యా కాలవ్యవధిని నేరుగా అనువదిస్తుంది.
theological_decisions:
- issue: సంసోను న్యాయాధిపత్య కాలానికి సంబంధించిన ముగింపు సారాంశం
  choice: అతడు ఇశ్రాయేలుకు ఇరవై సంవత్సరాలు న్యాయాధిపతిగా ఉన్నాడు
  alternative: అతడు ఇశ్రాయేలుకు ఇరవై సంవత్సరాలు న్యాయాధిపతిగా ఉండివచ్చాడు
  rationale: సమాధి ప్రస్తావన తరువాతి హీబ్రూ రూపం సాధారణ భూతకాల ముగింపు సారాంశంగానూ, గతాన్ని వెనుదిరిగి తెలిపే పూర్వభూత భావంగానూ అర్థమవుతుంది. ప్రధాన పాఠం గ్రంథంలోని పునరావృత ముగింపు సూత్రాన్ని సహజంగా నిలుపుతుంది; ప్రత్యామ్నాయ కాలసంబంధ భావాన్ని పాదటిప్పణి సంరక్షిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభమైన కథన శైలి. దిశను సూచించే ‘దిగి’, ‘పైకి’ పదాలు మూలంలోని భౌగోళిక కదలికను నిలుపుతున్నాయి. ‘న్యాయాధిపతిగా ఉన్నాడు’ అనే రూపం గ్రంథపు పాత్రపదాన్ని కాపాడుతూ సహజ తెలుగు వాక్యనిర్మాణాన్ని ఇస్తుంది.
