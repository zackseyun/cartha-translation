  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/תֹּ֤אמֶר דְּלִילָה֙ אֶל שִׁמְשׁ֔וֹן הִנֵּה֙ הֵתַ֣לְתָּ בִּ֔/י וַ/תְּדַבֵּ֥ר אֵלַ֖/י כְּזָבִ֑ים עַתָּה֙ הַגִּֽידָ/ה נָּ֣א לִ֔/י בַּ/מֶּ֖ה תֵּאָסֵֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/010.yaml
  text: Then Delilah said to Samson[a], “Look, you have mocked me and spoken lies to me. Now please tell me what you may be bound with.”
translation:
  language: te
  text: అప్పుడు దెలీలా షింషోనుతో, “చూడు, నువ్వు నన్ను ఆటపట్టించావు[a], నాతో అబద్ధాలు చెప్పావు. ఇప్పుడు నువ్వు దేనితో బంధించబడవచ్చో దయచేసి నాకు చెప్పు” అంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నన్ను మూర్ఖురాలిని చేశావు”; ఇక్కడి హీబ్రూ క్రియ మోసంతో ఒకరిని ఎగతాళి చేయడం లేదా వారితో చెలగాటమాడడం అనే భావాన్ని ఇవ్వగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: అప్పుడు ... అంది
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది; ఆధునిక తెలుగు కథన ప్రవాహంలో ‘అప్పుడు’ సహజంగా క్రమాన్ని తెలియజేస్తుంది.
- source_word: הִנֵּה
  choice: చూడు
  rationale: దెలీలా తన ఆరోపణవైపు సమ్సోను దృష్టిని తిప్పే సంబోధన; ప్రాచీన ఛాయ లేకుండా హీబ్రూ పదంలోని దృష్ట్యాకర్షణ బలాన్ని నిలుపుతుంది.
- source_word: הֵתַלְתָּ בִּי
  choice: నన్ను ఆటపట్టించి
  rationale: התל మోసంతో ఒకరిని పరిహాసాస్పదంగా చేయడం లేదా వారితో చెలగాటమాడడం అనే భావాన్ని ఇస్తుంది. ‘ఆటపట్టించి’ అవమానం, మోసం రెండింటి ఛాయను సహజ తెలుగులో అందిస్తుంది; ప్రత్యామ్నాయ భావాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: וַתְּדַבֵּר אֵלַי כְּזָבִים
  choice: నాతో అబద్ధాలు చెప్పావు
  rationale: అక్షరార్థంగా ‘నాతో అబద్ధాలు పలికావు’; బహువచన నామవాచకాన్ని నిలుపుతూ తెలుగులో సహజంగా ఉంది.
- source_word: עַתָּה
  choice: ఇప్పుడు
  rationale: ఆరోపణ నుంచి మళ్లీ చేసే విన్నపానికి మార్పును స్పష్టంగా సూచిస్తుంది.
- source_word: הַגִּידָה נָּא לִי
  choice: దయచేసి నాకు చెప్పు
  rationale: ఆజ్ఞారూపంతో ఉన్న נָא కఠిన ఆజ్ఞకన్నా విన్నపాన్ని సూచిస్తుంది; ‘దయచేసి’ ఆ స్వరాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: בַּמֶּה תֵּאָסֵר
  choice: నిన్ను దేనితో బంధించవచ్చో
  rationale: בַּמֶּה సాధనాన్ని—‘దేనితో’—అడుగుతుంది; నిఫాల్ రూపం క్రియ యొక్క కర్మణి భావాన్ని, సందర్భంలోని సాధ్యతను ‘బంధించవచ్చో’ నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. సంభాషణలో ఏకవచన సన్నిహిత రూపమైన ‘నువ్వు/చెప్పు’ సందర్భానుకూలంగా వాడబడింది. మూలంలోని సాధనార్థక ప్రశ్నను ‘దేనితో’ అని స్పష్టంగా నిలిపాం.
