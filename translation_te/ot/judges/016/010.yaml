  terminology: 'Revise “సమ్సోను” to “షింషోను,” a closer and established Telugu rendering of Samson/שִׁמְשׁוֹן. The footnote’s alternative must agree with the female speaker: “మూర్ఖురాలిని చేశావు,” not masculine “వెర్రివాణ్ణి చేశావు.”'
  issues:
  - severity: medium
    issue: The personal name “సమ్సోను” does not adequately represent Hebrew שִׁמְשׁוֹן.
    rationale: “షింషోను” more accurately reflects the source name and is appropriate in standard Telugu biblical usage.
  - severity: low
    issue: The footnote says “నన్ను వెర్రివాణ్ణి చేశావు,” using a masculine form for Delilah.
    rationale: Delilah is female; the alternative should use a feminine expression such as “నన్ను మూర్ఖురాలిని చేశావు.”
  - severity: low
    issue: “నిన్ను దేనితో బంధించవచ్చో” is understandable but does not explicitly retain the Hebrew Niphal passive.
    rationale: “నువ్వు దేనితో బంధించబడవచ్చో” directly preserves the passive/potential sense without unnatural Telugu.
  revised_text: అప్పుడు దెలీలా షింషోనుతో, “చూడు, నువ్వు నన్ను ఆటపట్టించావు[a], నాతో అబద్ధాలు చెప్పావు. ఇప్పుడు నువ్వు దేనితో బంధించబడవచ్చో దయచేసి నాకు చెప్పు” అంది.
