revisions:
- from: ఆమె కోసం మాటువేసినవారు లోపలి గదిలో వేచి ఉన్నారు. అప్పుడు ఆమె అతనితో, “సమ్సోనూ, ఫిలిష్తీయులు నీ మీదికి వచ్చారు!” అంది. అయితే నిప్పు వాసన తగలగానే అవిసెనారపు దారం తెగిపోయినట్లు అతడు ఆ వింటినారాలను తెంచేశాడు. అతని బలం ఏమిటో బయటపడలేదు.
  to: ఆమెతో పాటు మాటువేసినవాడు లోపలి గదిలో కూర్చొని ఉన్నాడు. అప్పుడు ఆమె అతనితో, “సమ్సోనూ, ఫిలిష్తీయులు నీ మీదికి వచ్చారు!” అంది. అయితే నిప్పు వాసన పడగానే అవిసెనారపు దారం తెగిపోయినట్లు అతడు ఆ వింటినారాలను తెంచేశాడు. అతని బలం తెలిసిపోలేదు.
  rationale: The revision corrects the potentially reversed sense of the ambusher’s relationship to Delilah, follows the singular Hebrew participle, and makes two minor idiomatic adjustments without altering the verse’s imagery, narrative register, or the ambiguity of the final clause.
