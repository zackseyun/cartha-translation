base_translation:
  language: en
  yaml_path: translation/ot/judges/016/009.yaml
  text: The ambush was waiting for her in the inner room, and she said to him, “Philistines are upon you, Samson!” But he snapped the cords as a thread of tow snaps when it smells fire, and his strength was not discovered.
translation:
  language: te
  text: ఆమెతో పాటు మాటువేసినవాడు లోపలి గదిలో కూర్చొని ఉన్నాడు. అప్పుడు ఆమె అతనితో, “సమ్సోనూ, ఫిలిష్తీయులు నీ మీదికి వచ్చారు!” అంది. అయితే నిప్పు వాసన పడగానే అవిసెనారపు దారం తెగిపోయినట్లు అతడు ఆ వింటినారాలను తెంచేశాడు. అతని బలం తెలిసిపోలేదు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָאֹרֵב
  choice: మాటువేసినవారు
  rationale: ఏకవచన రూపంలో ఉన్నప్పటికీ సందర్భంలో ఇది దాడికి పొంచి ఉన్న మనుషులను సూచించే సమష్టివాచకం; తెలుగులో సహజంగా బహువచనంగా అనువదించబడింది.
- source_word: יְתָרִים
  choice: వింటినారాలు
  rationale: ఈ సందర్భంలో తడి/కొత్త bowstrings‌ను సూచిస్తుంది; సాధారణ ‘తాళ్లు’ కంటే ‘వింటినారాలు’ మూలపదార్థాన్ని స్పష్టంగా ప్రతిబింబిస్తుంది.
- source_word: פְּתִיל הַנְּעֹרֶת
  choice: అవిసెనారపు దారం
  rationale: మూలంలోని flax towతో చేసిన సన్నని దారం అనే చిత్రాన్ని సాధారణ పాఠకునికి అర్థమయ్యేలా నిలుపుతుంది.
- source_word: וְלֹא נוֹדַע כֹּחוֹ
  choice: అతని బలం ఏమిటో బయటపడలేదు
  rationale: ‘అతని బలం తెలియబడలేదు’ అనే మూలభావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తూ, బలానికి కారణాన్ని అతిగా నిర్దిష్టం చేయదు.
theological_decisions:
- issue: సమ్సోను బల రహస్యం ఇంకా వెల్లడికాకపోవడం
  choice: అతని బలం ఏమిటో బయటపడలేదు
  alternative: అతని బలానికి కారణం తెలియలేదు
  rationale: మూలవాక్యం కేవలం అతని బలం తెలిసిపోలేదని చెబుతుంది; ‘కారణం’ అని చేర్చి భావాన్ని అనవసరంగా సంకుచితం చేయకుండా మూలంలోని విస్తృతతను నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కథనానికి తగిన గంభీరతతో పాటు సామాన్య పాఠకుడికి సులభంగా అర్థమయ్యే పదజాలం వాడబడింది. ‘నిప్పు వాసన తగలగానే’ అనే మూలంలోని స్పష్టమైన రూపకాన్ని సాధ్యమైనంతవరకు నిలుపుకున్నాం.
