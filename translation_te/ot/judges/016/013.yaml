  text: וַ/תֹּ֨אמֶר דְּלִילָ֜ה אֶל שִׁמְשׁ֗וֹן עַד הֵ֜נָּה הֵתַ֤לְתָּ בִּ/י֙ וַ/תְּדַבֵּ֤ר אֵלַ/י֙ כְּזָבִ֔ים הַגִּ֣ידָ/ה לִּ֔/י בַּ/מֶּ֖ה תֵּאָסֵ֑ר וַ/יֹּ֣אמֶר אֵלֶ֔י/הָ אִם תַּאַרְגִ֗י אֶת שֶׁ֛בַע מַחְלְפ֥וֹת רֹאשִׁ֖/י עִם הַ/מַּסָּֽכֶת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/013.yaml
  text: Then Delilah said to Samson[a], “Until now you have mocked me and told me lies. Tell me what you may be bound with.” And he said to her, “If you weave the seven locks of my head with the web.”
translation:
  language: te
  text: అప్పుడు దెలీలా సమ్సోనుతో, “ఇంతవరకు నన్ను ఆటపట్టించి నాకు అబద్ధాలు చెప్పావు. నిన్ను దేనితో కట్టవచ్చో నాకు చెప్పు” అంది. అతడు ఆమెతో, “నా తల జుట్టులోని ఏడు పాయలను నేతబట్టలో అల్లితే[a]” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నా జుట్టులోని ఏడు జడలను మగ్గంతో అల్లితే,” లేదా “నేసిన వస్త్రంతో అల్లితే.” ఇక్కడి హీబ్రూ నేతపని పదం ఖచ్చితంగా దేనిని సూచిస్తుందో స్పష్టంగా లేదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵתַלְתָּ בִּי
  choice: నన్ను పరిహసిస్తూ
  rationale: ఈ క్రియ ఇక్కడ ఒకరిని మోసపూరితంగా ఆటపట్టించడం లేదా ఎగతాళి చేయడం అనే భావాన్ని ఇస్తుంది. తరువాతి ‘అబద్ధాలు చెప్పావు’ అనే మాట మోసాన్ని స్పష్టంగా తెలుపుతున్నందున ఈ ఎంపిక అనవసర పునరుక్తిని నివారిస్తుంది.
- source_word: כְּזָבִים
  choice: అబద్ధాలు
  rationale: అసత్యమైన మాటలను సూచించే సాధారణ బహువచన నామవాచకానికి సహజమైన ఆధునిక తెలుగు సమానార్థకం.
- source_word: הַגִּידָה לִּי
  choice: నాకు చెప్పు
  rationale: נגד క్రియ యొక్క ఆజ్ఞార్థక రూపానికి సందర్భానుకూలమైన, సహజమైన తెలుగు వ్యక్తీకరణ.
- source_word: בַּמֶּה תֵּאָסֵר
  choice: నిన్ను దేనితో కట్టవచ్చో
  rationale: హీబ్రూలోని ‘దేనితో’ అనే సాధనార్థక భావాన్నీ, కర్మణి రూపాన్నీ నిలుపుతుంది.
- source_word: תַּאַרְגִי
  choice: కలిపి నేస్తే
  rationale: ארג యొక్క ప్రాథమిక అర్థం ‘నేయడం’. జుట్టు పాయలను నేతలో చేర్చే చర్య తెలుగులో స్పష్టంగా ఉండేందుకు ‘కలిపి’ వాడబడింది.
- source_word: שֶׁבַע מַחְלְפוֹת רֹאשִׁי
  choice: నా తల జుట్టులోని ఏడు పాయలను
  rationale: מחלפות జుట్టు పాయలు, జడలు లేదా కురులు కావచ్చు. ‘జుట్టు పాయలు’ జడలుగా అల్లబడి ఉన్నాయని నిర్ణయించకుండా మూలంలోని విస్తృత భావాన్ని కాపాడుతుంది.
- source_word: עִם הַמַּסָּכֶת
  choice: నేతలో కలిపి
  rationale: מַסֶּכֶת అనేది ఇక్కడ నేత, నేసిన వస్త్రం లేదా మగ్గానికి సంబంధించిన ప్రత్యేక పదం. ‘నేతలో’ చర్యకు తగిన అర్థాన్ని ఇస్తూనే ఖచ్చిత వస్తువును అతిగా నిర్దేశించదు.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. హీబ్రూ వాక్యం షరతుతో ముగుస్తున్న అసంపూర్ణ స్వరూపాన్ని దీర్ఘగీతతో నిలిపి ఉంచాం; ఫలితాన్ని మూలంలో లేనట్లుగా చేర్చలేదు. ప్రతి ప్రత్యామ్నాయానికి సరిపోయేలా ప్రధాన పాఠంలో [a] గుర్తు సంబంధిత నేతపని పదబంధం వద్ద ఉంచబడింది.
