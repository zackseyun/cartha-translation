translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కథన శైలి వాడబడింది. హింసను మూలపాఠం చెప్పినంత స్పష్టంగా ఉంచి, మరింత తీవ్రంగా లేదా సౌమ్యంగా మార్చలేదు. వాక్యాలను తెలుగు పఠనసౌలభ్యం కోసం విభజించినా, హీబ్రూ చర్యల క్రమం నిలుపబడింది.
