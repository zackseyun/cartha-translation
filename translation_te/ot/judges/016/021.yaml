base_translation:
  language: en
  yaml_path: translation/ot/judges/016/021.yaml
  text: Then the Philistines seized him[a], gouged out his eyes, brought him down to Gaza, bound him with bronze shackles[b], and he was grinding in the prison house.
translation:
  language: te
  text: అప్పుడు ఫిలిష్తీయులు అతణ్ణి పట్టుకొని, అతని కళ్లను పెరికివేశారు[a]. అతణ్ణి గాజాకు తీసుకెళ్లి, కంచు సంకెళ్లతో బంధించారు. చెరసాలలో[b] అతడు రుబ్బుతూ ఉండేవాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘అతని కళ్లను పొడిచి నాశనం చేశారు.’ హీబ్రూ క్రియ కళ్లకు చేసిన శారీరక హానిని స్పష్టంగా సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా ‘ఖైదీల ఇంటిలో.’
    reason: literal_rendering
lexical_decisions:
- source_word: וַיֹּאחֲזוּהוּ
  choice: అతణ్ణి పట్టుకొని
  rationale: אחז అంటే గట్టిగా పట్టుకోవడం లేదా అదుపులోకి తీసుకోవడం. శత్రువులు చేసిన బలవంతపు చర్యను ‘పట్టుకొని’ సహజంగా తెలియజేస్తుంది.
- source_word: פְלִשְׁתִּים
  choice: ఫిలిష్తీయులు
  rationale: ఈ ప్రజాసమూహానికి తెలుగులో స్థిరపడిన బైబిలు పేరు.
- source_word: וַיְנַקְּרוּ אֶת־עֵינָיו
  choice: అతని కళ్లను పెరికివేశారు
  rationale: נקר ఇక్కడ కళ్లను శారీరకంగా ఛిద్రం చేసి తొలగించే హింసాత్మక చర్యను సూచిస్తుంది. ‘పెరికివేశారు’ ఆ స్పష్టమైన భావాన్ని కేవలం ‘గుడ్డివాణ్ణి చేశారు’ అనే సాధారణీకరణ లేకుండా నిలుపుతుంది.
- source_word: וַיּוֹרִידוּ אֹתוֹ עַזָּתָה
  choice: అతణ్ణి గాజాకు తీసుకెళ్లి
  rationale: హిఫీల్ రూపంలోని ירד ‘కిందికి తీసుకెళ్లడం’ అనే దిశాభావాన్ని కలిగి ఉన్నా, తెలుగులో గాజాకు ప్రయాణాన్ని సహజంగా చెప్పేందుకు ‘తీసుకెళ్లి’ వాడబడింది; עַזָּתָה లోని దిశాసూచక భావం ‘గాజాకు’లో వ్యక్తమవుతుంది.
- source_word: וַיַּאַסְרוּהוּ
  choice: బంధించారు
  rationale: אסר అంటే కట్టడం లేదా బంధించడం. తరువాతి లోహపు సంకెళ్ల పదబంధంతో సరిగ్గా సరిపోతుంది; ‘చెరలో వేశారు’ అని స్థలార్థాన్ని ముందుగానే కలపదు.
- source_word: בַּנְחֻשְׁתַּיִם
  choice: కంచు సంకెళ్లతో
  rationale: ద్వివచన/బహువచన రూపం లోహపు బంధనాలను సూచిస్తుంది. ‘కంచు సంకెళ్లు’ ఆధునిక తెలుగులో స్పష్టంగా ఉండి, సాధారణ ‘గొలుసులు’ కంటే నిర్దిష్టంగా ఉంది.
- source_word: וַיְהִי טוֹחֵן
  choice: అతడు రుబ్బుతూ ఉండేవాడు
  rationale: ఈ నిర్మాణం కొనసాగుతున్న స్థితి లేదా పనిని సూచిస్తుంది. మూలంలో చెప్పని ‘ధాన్యం’ అనే కర్మను చేర్చకుండా నిరంతర బలవంతపు శ్రమను తెలియజేస్తుంది.
- source_word: בְּבֵית הָאֲסִירִים
  choice: చెరసాలలో
  rationale: అక్షరార్థంగా ‘ఖైదీల ఇంటిలో’ అయిన ఈ హీబ్రూ ప్రయోగానికి సహజమైన ఆధునిక తెలుగు సమానార్థకం ‘చెరసాలలో’.
