id: JDG.16.4
reference: Judges 16:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַֽ/יְהִי֙ אַחֲרֵי כֵ֔ן וַ/יֶּאֱהַ֥ב אִשָּׁ֖ה בְּ/נַ֣חַל שֹׂרֵ֑ק וּ/שְׁמָ֖/הּ דְּלִילָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/004.yaml
  text: After this[a], he loved a woman in the Valley of Sorek, and her name was Delilah.
translation:
  language: te
  text: ఆ తరువాత అతడు సోరేకు లోయలో[a] ఒక స్త్రీని ప్రేమించాడు. ఆమె పేరు దెలీలా.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సోరేకు వాగు దగ్గర.” హీబ్రూ పదం נַחַל లోయను, వాగు పడగను లేదా కాలానుగుణంగా నీరు ప్రవహించే జలమార్గాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי כֵן
  choice: ఆ తరువాత
  rationale: హీబ్రూ కథన సూత్రంలోని కాలక్రమ భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; ‘అప్పుడు ఇలా జరిగింది’ అనే అనవసరమైన భారాన్ని నివారిస్తుంది.
- source_word: וַיֶּאֱהַב
  choice: ప్రేమించాడు
  rationale: אָהַב అనే క్రియకు నేరమైన అర్థం ‘ప్రేమించు’; మూలంలో లేని అదనపు కాల్పనిక లేదా శృంగార భావాన్ని చేర్చదు.
- source_word: אִשָּׁה
  choice: ఒక స్త్రీని
  rationale: ఈ సందర్భంలో వివాహ బంధం సూచించబడలేదు కాబట్టి ‘భార్యను’ అని కాకుండా తటస్థమైన ‘ఒక స్త్రీని’ అని అనువదించబడింది.
- source_word: בְּנַחַל שֹׂרֵק
  choice: సోరేకు లోయలో
  rationale: נַחַל అనే పదం లోయ, వాగు పడగ లేదా కాలానుగుణ జలమార్గాన్ని సూచించగలదు. ‘లోయ’ సాధారణ పాఠకులకు సహజంగా ఉండి భౌగోళిక భావాన్ని నిలుపుతుంది; בְּ ఇక్కడ ‘లో’గా అనువదించబడింది, అయితే ‘దగ్గర’ అనే అర్థసాధ్యతను పాదసూచికలో ఉంచాం.
- source_word: וּשְׁמָהּ
  choice: ఆమె పేరు
  rationale: స్త్రీ పేరును స్పష్టంగా పరిచయం చేసే హీబ్రూ నిర్మాణాన్ని సహజమైన తెలుగు వాక్యంగా అందిస్తుంది.
- source_word: דְּלִילָה
  choice: దెలీలా
  rationale: హీబ్రూ వ్యక్తినామాన్ని ఆధునిక తెలుగు ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించింది.
