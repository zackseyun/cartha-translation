source:
  edition: WLC
  text: וַ/יִּרְא֤וּ אֹת/וֹ֙ הָ/עָ֔ם וַֽ/יְהַלְל֖וּ אֶת אֱלֹהֵי/הֶ֑ם כִּ֣י אָמְר֗וּ נָתַ֨ן אֱלֹהֵ֤י/נוּ בְ/יָדֵ֨/נוּ֙ אֶת א֣וֹיְבֵ֔/נוּ וְ/אֵת֙ מַחֲרִ֣יב אַרְצֵ֔/נוּ וַ/אֲשֶׁ֥ר הִרְבָּ֖ה אֶת חֲלָלֵֽי/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/024.yaml
  text: When the people saw him, they praised their god, for they said, “Our god has given into our hand our enemy, the devastator of our land, the one who multiplied our slain.”
translation:
  language: te
  text: ప్రజలు అతన్ని చూసినప్పుడు తమ దేవుణ్ణి స్తుతించారు. ఎందుకంటే వారు, “మన శత్రువును, మన దేశాన్ని నాశనం చేసినవాణ్ణి, మన హతుల సంఖ్యను పెంచినవాణ్ణి మన దేవుడు మన చేతికి అప్పగించాడు” అని అన్నారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהַלְלוּ
  choice: స్తుతించారు
  rationale: పియేల్ రూపంలోని బలమైన ప్రశంస/కీర్తన భావాన్ని సహజమైన ఆధునిక తెలుగు పదంతో వ్యక్తం చేస్తుంది.
- source_word: נָתַן ... בְיָדֵנוּ
  choice: మన చేతికి అప్పగించాడు
  rationale: హీబ్రూ ‘చేతిలో ఇవ్వడం’ అనే విజయాధీనత నుడికారాన్ని తెలుగులో సహజంగా, భావాన్ని నిలుపుతూ అందిస్తుంది.
- source_word: מַחֲרִיב אַרְצֵנוּ
  choice: మన దేశాన్ని నాశనం చేసినవాణ్ణి
  rationale: מַחֲרִיב అనే కార్యసూచక రూపాన్ని సందర్భానుగుణంగా సమ్సోనును సూచించే విశేషణీయ పదబంధంగా అనువదిస్తుంది.
- source_word: הִרְבָּה אֶת חֲלָלֵינוּ
  choice: మనలో హతులైనవారి సంఖ్యను పెంచినవాణ్ణి
  rationale: ‘మన హతులను విస్తరింపజేసినవాడు’ అనే మూలంలోని ఉద్దేశాన్ని సహజంగా తెలియజేస్తూ, మరణించినవారి సంఖ్య అధికం చేశాడనే భావాన్ని కాపాడుతుంది.
theological_decisions:
- issue: ఫిలిష్తీయుల దేవుని ప్రస్తావన
  choice: తమ దేవుణ్ణి / మన దేవుడు
  alternative: తమ దేవతను / మన దేవత
  rationale: אֱלֹהִים వ్యాకరణపరంగా ఇక్కడ ఏకవచన క్రియతో వారి ఆరాధ్యదైవాన్ని సూచిస్తుంది; మూలం లింగాన్ని ప్రత్యేకంగా నిర్ధారించనందున సాధారణ ‘దేవుడు’ పదాన్ని నిలిపాం.
- issue: విజయం వారి దేవునివల్ల వచ్చిందనే ఫిలిష్తీయుల వాదన
  choice: ఉద్ధరణలో యథాతథంగా ఉంచడం
  alternative: వివరణాత్మకంగా ఖండించడం
  rationale: వచనం వారి మాటను నివేదిస్తుంది; కథకుడు ఇక్కడ ప్రత్యక్ష వ్యాఖ్య చేయడు. అందువల్ల వాదనను సమర్థించకుండా లేదా ముందుగానే ఖండించకుండా మూలంలోని ఉద్రిక్తతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సామాన్య పాఠకులకు స్పష్టంగా ఉండే వాక్య నిర్మాణం. మూలంలోని వరుస appositionలను తెలుగులో సమాంతర విశేషణీయ పదబంధాలుగా నిలిపాం.
