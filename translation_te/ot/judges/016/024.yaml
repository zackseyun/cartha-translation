- from: ప్రజలు అతన్ని చూసినప్పుడు తమ దేవుణ్ణి స్తుతించారు. ఎందుకంటే వారు, “మన శత్రువును, మన దేశాన్ని నాశనం చేసినవాణ్ణి, మనలో హతులైనవారి సంఖ్యను పెంచినవాణ్ణి మన దేవుడు మన చేతికి అప్పగించాడు” అని చెప్పుకున్నారు.
