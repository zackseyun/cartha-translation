    rationale: హీబ్రూ חֲלָלֵינוּ నేరుగా ‘మన హతులు’ అని చెబుతుంది. ‘మనలో’ అనేది సమూహంలో ఉన్నవారనే స్వల్ప అదనపు నుడికారాన్ని కలిగిస్తుంది; ‘మన హతుల సంఖ్య’ మూలానికి మరింత సమీపం.
