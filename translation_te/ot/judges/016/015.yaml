source:
  edition: WLC
  text: וַ/תֹּ֣אמֶר אֵלָ֗י/ו אֵ֚יךְ תֹּאמַ֣ר אֲהַבְתִּ֔י/ךְ וְ/לִבְּ/ךָ֖ אֵ֣ין אִתִּ֑/י זֶ֣ה שָׁלֹ֤שׁ פְּעָמִים֙ הֵתַ֣לְתָּ בִּ֔/י וְ/לֹא הִגַּ֣דְתָּ לִּ֔/י בַּ/מֶּ֖ה כֹּחֲ/ךָ֥ גָדֽוֹל־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/015.yaml
  text: Then she said to him[a], “How can you say, ‘I love you,’ when your heart is not with me? These three times you have mocked me and have not told me in what your great strength lies.”
translation:
  language: te
  text: అప్పుడు ఆమె అతనితో, “నీ హృదయం నాతో లేనప్పుడు, ‘నేను నిన్ను ప్రేమిస్తున్నాను’ అని నువ్వు ఎలా చెప్పగలవు? ఈ మూడు సార్లు నన్ను ఆటపట్టించావు[a]; నీ గొప్ప బలం దేనిలో ఉందో నాకు చెప్పలేదు” అంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నాతో చెలగాటమాడావు,” “నన్ను మోసం చేశావు,” లేక “నన్ను వెర్రిదానిగా చేశావు.” హీబ్రూ క్రియలో మోసపూరితమైన అపహాస్యంతో ఒకరిని తేలికగా తీసుకొని ఆటపట్టించడం అనే భావం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵיךְ
  choice: నువ్వెలా చెప్పగలవు?
  rationale: దెలీలా వ్యక్తం చేస్తున్న నమ్మలేని సవాలును సహజమైన ఆధునిక తెలుగులో ప్రశ్నార్థకంగా తెలియజేస్తుంది.
- source_word: אֲהַבְתִּיךְ
  choice: నేను నిన్ను ప్రేమిస్తున్నాను
  rationale: ప్రత్యక్ష సంభాషణలో సమ్సోను చెప్పుకుంటున్న కొనసాగుతున్న ప్రేమను తెలుగు వర్తమాన కాలంతో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לִבְּךָ אֵין אִתִּי
  choice: నీ హృదయం నాతో లేనప్పుడు
  rationale: విశ్వాసం లేదా అంతరంగ నిబద్ధతను సూచించే హీబ్రూ హృదయ-నుడికారాన్ని అతిగా వివరణ చేయకుండా నిలుపుతుంది.
- source_word: זֶה שָׁלֹשׁ פְּעָמִים
  choice: ఇప్పటికే మూడుసార్లు
  rationale: గతంలో పదేపదే జరిగిన మూడు సందర్భాలను ఆధునిక తెలుగులో సహజంగా సూచిస్తుంది.
- source_word: הֵתַלְתָּ בִּי
  choice: నన్ను ఆటపట్టించావు
  rationale: మోసపూరితంగా ఒకరితో చెలగాటమాడి వారిని అపహాస్యం చేయడం అనే క్రియలోని భావాన్ని సహజంగా అందిస్తుంది; ఇతర అర్థఛాయలను పాదసూచికలో ఉంచింది.
- source_word: הִגַּדְתָּ לִּי
  choice: నాకు చెప్పలేదు
  rationale: ఈ సంభాషణ సందర్భంలో נגד అనే క్రియకు సరళమైన, సహజమైన తెలుగు సమానం.
- source_word: בַּמֶּה כֹּחֲךָ גָדוֹל
  choice: నీ గొప్ప బలం దేనిలో ఉందో
  rationale: అతని అసాధారణ బలానికి ఆధారం ఏమిటని అడిగే భావాన్ని నిలుపుతూ, హీబ్రూ నిర్మాణానికి దగ్గరగా ఉంటుంది.
