translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన సంభాషణ శైలి వాడబడింది. ‘హృదయం నాతో లేదు’ అనే మూలభాషా నుడికారం ఉద్దేశపూర్వకంగా నిలుపబడింది. పాదసూచిక సూచిక [a] ప్రధాన పాఠ్యంలో సంబంధిత పదబంధం వెంట ఉంచబడింది.
