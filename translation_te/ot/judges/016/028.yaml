source:
  edition: WLC
  text: וַ/יִּקְרָ֥א שִׁמְשׁ֛וֹן אֶל יְהוָ֖ה וַ/יֹּאמַ֑ר אֲדֹנָ֣/י יֱהֹוִ֡ה זָכְרֵ֣/נִי נָא֩ וְ/חַזְּקֵ֨/נִי נָ֜א אַ֣ךְ הַ/פַּ֤עַם הַ/זֶּה֙ הָ/אֱלֹהִ֔ים וְ/אִנָּקְמָ֧ה נְקַם אַחַ֛ת מִ/שְּׁתֵ֥י עֵינַ֖/י מִ/פְּלִשְׁתִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/028.yaml
  text: Then Samson called to Yahweh and said[a], “Lord GOD, please remember me, and please strengthen me just this once, O God, so that I may take vengeance on the Philistines for my two eyes with one act of vengeance.”
translation:
  language: te
  text: 'అప్పుడు సమ్సోను యహ్వేకు మొరపెట్టి ఇలా అన్నాడు: “ప్రభువైన యహ్వే, దయచేసి నన్ను జ్ఞాపకం చేసుకో; దేవా, ఈ ఒక్కసారి మాత్రమే దయచేసి నన్ను బలపరచు. నా రెండు కళ్లకుగాను ఫిలిష్తీయులపై ఒకే ప్రతీకారం తీర్చుకునేలా చేయి[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “నా రెండు కళ్లకుగాను ఒక ప్రతీకారం” అని ఉంది. సందర్భంలో ఇది ఫిలిష్తీయులు సమ్సోను రెండు కళ్లను పోగొట్టినందుకు ప్రతీకారం కోరడాన్ని సూచిస్తుంది. ఈ అసాధారణ నిర్మాణాన్ని కొందరు “నా రెండు కళ్లలో ఒకదానికిగాను ప్రతీకారం” అని కూడా అర్థం చేసుకుంటారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא ... אֶל־יְהוָה
  choice: యహ్వేకు మొరపెట్టి
  rationale: קרא אל దేవునికి చేసే తీవ్రమైన పిలుపు లేదా ప్రార్థనను సూచిస్తుంది. ‘మొరపెట్టి’ సందర్భానికి సహజంగా ఉండి, కేవలం పేరుపెట్టి పిలిచాడనే భావాన్ని నివారిస్తుంది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవిక వ్యక్తినామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా ఆధునిక తెలుగు లిప్యంతరీకరణలో నిలుపుతుంది.
- source_word: אֲדֹנָי יֱהֹוִה
  choice: ప్రభువైన యహ్వే
  rationale: אֲדֹנָי అనే ‘ప్రభువు’ బిరుదునూ, יְהוָה అనే వ్యక్తినామాన్నీ వేరువేరుగా స్పష్టంగా నిలుపుతుంది; తెలుగులో అసహజమైన బిరుదుల పునరుక్తిని తప్పిస్తుంది.
- source_word: זָכְרֵנִי נָא
  choice: దయచేసి నన్ను జ్ఞాపకం చేసుకో
  rationale: נָא లోని వేడుకోలు భావాన్ని ‘దయచేసి’ తెలియజేస్తుంది. ‘జ్ఞాపకం చేసుకో’ దేవుడు సమ్సోను పక్షాన మళ్లీ కార్యం చేయాలనే సందర్భార్థాన్ని అతిగా విప్పకుండా మూల రూపకాన్ని నిలుపుతుంది.
- source_word: וְחַזְּקֵנִי נָא
  choice: దయచేసి ... నన్ను బలపరచు
  rationale: Piel రూపం సమ్సోనుకు బలం కలిగించమనే అభ్యర్థన. ‘బలపరచు’ సంక్షిప్తంగా, సహజంగా ఉంది.
- source_word: אַךְ הַפַּעַם הַזֶּה
  choice: ఈ ఒక్కసారి మాత్రమే
  rationale: אַךְ అభ్యర్థనను ప్రస్తుత సందర్భానికే పరిమితం చేస్తుంది; ఈ తెలుగు పదబంధం ఆ ప్రత్యేక పరిమితిని స్పష్టంగా నిలుపుతుంది.
- source_word: הָאֱלֹהִים
  choice: దేవా
  rationale: ఇది ప్రత్యక్ష సంబోధన. ‘దేవా’ ఆధునిక గౌరవప్రదమైన ప్రార్థనా భాషలో సహజంగా ఉంటుంది.
- source_word: וְאִנָּקְמָה
  choice: ప్రతీకారం తీర్చుకునేలా చేయి
  rationale: Cohortative రూపంలోని ఉద్దేశం మరియు విజ్ఞాపన రెండింటినీ సహజ తెలుగులో వ్యక్తం చేస్తుంది; దేవుడే ప్రతీకారం తీర్చుకుంటున్నాడని మార్చదు.
- source_word: נְקַם אַחַת
  choice: ఒక్క ప్రతీకారం
  rationale: మూలంలోని ఏకత్వ ప్రాధాన్యాన్ని నిలుపుతూ, ‘ఒక్క దెబ్బ’ వంటి సందర్భం నుంచి ఊహించిన సాధనాన్ని పాఠ్యంలో చేర్చదు. అసాధారణ హీబ్రూ నిర్మాణంలోని ప్రత్యామ్నాయ అవగాహనను పాదసూచికలో ఉంచింది.
- source_word: מִשְּׁתֵי עֵינַי
  choice: నా రెండు కళ్లకుగాను
  rationale: సమ్సోనును అంధుణ్ణి చేసినందుకు పరిహారాత్మక ప్రతీకారం కోరుతున్న భావాన్ని సహజంగా తెలియజేస్తూనే ‘నా రెండు కళ్లు’ అనే మూలంలోని స్పష్టమైన పదాలను నిలుపుతుంది.
- source_word: מִפְּלִשְׁתִּים
  choice: ఫిలిష్తీయుల మీద
  rationale: נקם తో వచ్చిన מִן ను తెలుగు ప్రతీకార ప్రయోగంలో సహజమైన ‘మీద’తో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: సమ్సోను ప్రార్థనలోని దైవిక నామాలు, బిరుదులను ఎలా చూపాలి
  choice: יְהוָה ను ‘యహ్వే’గా, אֲדֹנָי יֱהֹוִה ను ‘ప్రభువైన యహ్వే’గా వేరు చేసి చూపడం
  alternative: ‘యెహోవా’; లేదా రెండింటినీ ‘ప్రభువు/దేవుడు’ వంటి సాధారణ బిరుదులతో చూపడం
  rationale: హీబ్రూ ప్రార్థనలోని వ్యక్తినామం మరియు ప్రభుత్వ బిరుదు రెండింటినీ కలిపివేయకుండా నిలుపుతుంది; ఏ ప్రత్యేక సంప్రదాయానికి చెందిన వ్యాఖ్యానాన్ని చేర్చదు.
- issue: సమ్సోను కోరిన ప్రతీకారాన్ని నైతికంగా సమర్థించడం లేదా మృదువుగా మార్చడం
  choice: అతని విజ్ఞాపనగా నేరుగా అనువదించడం
  alternative: దేవుని న్యాయతీర్పుగా విస్తరించడం లేదా ‘ప్రతీకారం’ను మృదువైన పదంతో మార్చడం
  rationale: వచనం సమ్సోను పలికిన ప్రార్థనను నివేదిస్తుంది; దాని నైతిక లేదా ధార్మిక మూల్యాంకనాన్ని ఈ వాక్యం స్వయంగా ఇవ్వదు. అందువల్ల ఆ ఉద్రిక్తతను అనువాదం అలాగే ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన-ప్రార్థనా శైలి వాడబడింది. వాక్యాలు సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా విభజించబడ్డాయి. ‘మొరపెట్టి’, ‘జ్ఞాపకం చేసుకో’, ‘బలపరచు’, ‘ప్రతీకారం తీర్చుకో’ వంటి ప్రస్తుత వాడుకలో ఉన్న పదాలను ఎంచుకున్నాం; అతిగా ప్రాచీనమైన క్రియారూపాలను నివారించాం.
