  to: 'అప్పుడు సమ్సోను యహ్వేకు మొరపెట్టి ఇలా అన్నాడు: “ప్రభువైన యహ్వే, దయచేసి నన్ను జ్ఞాపకం చేసుకో; దేవా, ఈ ఒక్కసారి మాత్రమే దయచేసి నన్ను బలపరచు. నా రెండు కళ్లకుగాను ఫిలిష్తీయులపై ఒకే ప్రతీకారం తీర్చుకునేలా చేయి[a].”'
  rationale: మూలంలోని ప్రార్థనా స్వరం, దైవిక నామాలు, మరియు ప్రతీకార విజ్ఞాపనను మార్చకుండా ఉంచాం. చివరి హీబ్రూ పదబంధంలోని అనిశ్చితిని తీర్మానాత్మకంగా పరిష్కరించకుండా, ప్రధాన పాఠ్యంలో సందర్భానుకూల అర్థాన్ని మరియు పాదసూచికలో సాధ్యమైన ప్రత్యామ్నాయ వ్యాకరణ అవగాహనను కాపాడాం. పదప్రయోగాన్ని స్వల్పంగా సహజీకరించాం.
