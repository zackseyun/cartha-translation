    rationale: מִשְּׁתֵי עֵינַי అక్షరార్థంగా ‘నా రెండు కళ్లనుండి/కోసం’ అనే కష్టమైన నిర్మాణం. సందర్భంలో అది రెండు కళ్లను పోగొట్టుకున్నందుకు ప్రతీకారం అనే అర్థానికి దారితీస్తుంది; అయితే ‘నా రెండు కళ్లలో ఒకదానికిగాను’ అనే సంకుచిత ప్రత్యామ్నాయాన్ని ఖచ్చితమైన పాఠ్యార్థంలా కాక, సాధ్యమైన వ్యాకరణ అవగాహనగా మాత్రమే పేర్కొనాలి.
