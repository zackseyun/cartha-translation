  revised_text: 'అప్పుడు సమ్సోను యహ్వేకు మొరపెట్టి ఇలా అన్నాడు: “ప్రభువైన యహ్వే, దయచేసి నన్ను జ్ఞాపకం చేసుకో; దేవా, ఈ ఒక్కసారి మాత్రమే దయచేసి నన్ను బలపరచు. నా రెండు కళ్లకుగాను ఫిలిష్తీయులపై ఒకే ప్రతీకారం తీర్చుకునేలా చేయి[a].”'
