  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ֠/יְהִי כִּֽי הֵצִ֨יקָה לּ֧/וֹ בִ/דְבָרֶ֛י/הָ כָּל הַ/יָּמִ֖ים וַ/תְּאַֽלֲצֵ֑/הוּ וַ/תִּקְצַ֥ר נַפְשׁ֖/וֹ לָ/מֽוּת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/016.yaml
  text: And it happened that[a], when she pressed him with her words all the days and urged him on, his soul grew short to the point of death.
translation:
  language: te
  text: ఆమె ప్రతిరోజూ తన మాటలతో అతన్ని వేధిస్తూ, అతనిపై ఒత్తిడి తెస్తూనే ఉండగా, అతడు చచ్చిపోయేంతగా విసిగిపోయాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “అతని ప్రాణం మరణించడానికి కుంచించుకుపోయింది.” ఇది తీవ్రమైన వేదన, విసుగు లేదా అలసటను తెలిపే నానుడి.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּי
  choice: ఉండగా
  rationale: హీబ్రూ కథన సంధిని తెలుగులో సహజమైన కాలసంబంధ ఉపవాక్యంగా వ్యక్తం చేస్తుంది; ప్రత్యేకంగా ‘ఇలా జరిగింది’ అని చేర్చడం తెలుగులో భారంగా ఉంటుంది.
- source_word: הֵצִיקָה לוֹ בִדְבָרֶיהָ
  choice: తన మాటలతో అతన్ని ఒత్తిడి చేస్తూ
  rationale: ఆమె మాటలవల్ల కలిగిన నిరంతర ఒత్తిడిని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: כָּל הַיָּמִים
  choice: ప్రతిరోజూ
  rationale: అక్షరార్థంగా ‘అన్ని రోజులు’; సందర్భంలో పదేపదే, రోజు రోజుకూ కొనసాగిన చర్యను ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וַתְּאַלֲצֵהוּ
  choice: బలవంతపెడుతూ
  rationale: ముందున్న ‘ఒత్తిడి’ అనే భావాన్ని కేవలం పునరావృతం చేయకుండా, ఆమె పట్టుదలతో అతన్ని నిర్బంధించిన తీవ్రతను నిలుపుతుంది.
- source_word: וַתִּקְצַר נַפְשׁוֹ לָמוּת
  choice: అతని ప్రాణం చచ్చేంతగా విసిగిపోయింది
  rationale: అక్షరార్థంగా ‘అతని ప్రాణం చావువరకు చిన్నదైంది.’ తెలుగులో అసహజమైన అక్షరానువాదాన్ని నివారిస్తూ, తీవ్రమైన అంతరంగ సంకోచం, విసుగు, బాధ అనే నానుడి భావాన్ని ‘ప్రాణం’ అనే మూలరూపంతో నిలుపుతుంది; అతడు చనిపోవాలని కోరుకున్నాడని అనవసరంగా నిర్ణయించదు.
