translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సహజంగా ఉండేలా, అయితే ‘అతని ప్రాణం’ అనే హీబ్రూ రూపకంలోని ప్రధాన అంశాన్ని నిలుపుతూ గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం.
