  text: וַֽ/יְהִי֙ כי טוב לִבָּ֔/ם וַ/יֹּ֣אמְר֔וּ קִרְא֥וּ לְ/שִׁמְשׁ֖וֹן וִ/ישַֽׂחֶק לָ֑/נוּ וַ/יִּקְרְא֨וּ לְ/שִׁמְשׁ֜וֹן מִ/בֵּ֣ית ה/אסירים וַ/יְצַחֵק֙ לִ/פְנֵי/הֶ֔ם וַ/יַּעֲמִ֥ידוּ אוֹת֖/וֹ בֵּ֥ין הָ/עַמּוּדִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/025.yaml
  text: And when their hearts were merry[a], they said, “Call for Samson, so that he may entertain us.” So they called for Samson from the prison house, and he entertained them[b]. And they made him stand between the pillars.
translation:
  language: te
  text: వారి హృదయాలు ఉల్లాసంగా ఉన్నప్పుడు, వారు, “సమ్సోనును పిలిపించండి; అతడు మనకు వినోదం కలిగించాలి[a]” అన్నారు. అప్పుడు వారు చెరసాల నుండి సమ్సోనును పిలిపించారు; అతడు వారి ఎదుట వినోదం కలిగించాడు. వారు అతణ్ణి స్తంభాల మధ్య నిలబెట్టారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతడు మన కోసం ప్రదర్శన చేయాలి,” లేదా “అతణ్ణి చూసి మనం నవ్వుకోవాలి.” హీబ్రూ క్రియ వినోదం కలిగించడం, అపహాస్యానికి గురిచేయడం, లేదా బహిరంగంగా ప్రదర్శించడం అనే భావాలను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי טוֹב לִבָּם
  choice: వారి హృదయాలు ఉల్లాసంగా ఉన్నప్పుడు
  rationale: హీబ్రూ నుడికారంలో హృదయం ‘మంచిగా’ ఉండడం అంటే సంతోషంగా లేదా ఉల్లాసంగా ఉండడం. ‘హృదయాలు ఉల్లాసంగా’ అనే రూపం మూలభాష చిత్రణను సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: קִרְאוּ לְשִׁמְשׁוֹן
  choice: సమ్సోనును పిలిపించండి
  rationale: קרא తో ל ఇక్కడ ఒకరిని రప్పించమని ఆజ్ఞాపించడాన్ని సూచిస్తుంది. ‘పిలిపించండి’ సభాసందర్భంలోని ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וִישַׂחֶק לָנוּ
  choice: అతడు మనకు వినోదం కలిగించాలి
  rationale: שׂחק ఇక్కడ వినోదం, అపహాస్యం లేదా బహిరంగ ప్రదర్శన అనే పరస్పరం మిళితమైన భావాలను కలిగి ఉండవచ్చు. ప్రధాన పాఠంలో సహజమైన ‘వినోదం కలిగించాలి’ వాడి, విస్తృత భావపరిధిని పాదటిప్పణిలో ఉంచాం.
- source_word: מִבֵּית הָאֲסִירִים
  choice: చెరసాల నుండి
  rationale: అక్షరార్థం ‘ఖైదీల ఇల్లు.’ ఆధునిక తెలుగులో ‘చెరసాల’ ఆ స్థలాన్ని గౌరవప్రదంగా, సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: וַיְצַחֵק לִפְנֵיהֶם
  choice: అతడు వారి ఎదుట వినోదం కలిగించాడు
  rationale: צחק సందర్భంలో వారి ఎదుట ప్రదర్శన చేసి వారికి వినోద వస్తువుగా మారడాన్ని సూచిస్తుంది. ‘వారి ఎదుట’ మూలంలోని బహిరంగ అంశాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: וַיַּעֲמִידוּ אֹתוֹ בֵּין הָעַמּוּדִים
  choice: వారు అతణ్ణి స్తంభాల మధ్య నిలబెట్టారు
  rationale: עמד హిఫిల్ రూపంలోని కారణార్థక భావాన్ని ‘నిలబెట్టారు’ సహజంగా తెలియజేస్తూ, సమ్సోనుపై వారి నియంత్రణను నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. మూలంలోని ‘హృదయాలు’ అనే రూపకాన్ని నిలిపి, שׂחק/צחק పదాల ఉద్దేశపూర్వక భావవిస్తృతిని ప్రధాన పాఠం మరియు పాదటిప్పణి ద్వారా సంరక్షించాం. ప్రధాన పాఠంలోని ప్రతి పాదటిప్పణి సూచికకు సరిపోలే పాదటిప్పణి ఇవ్వబడింది.
