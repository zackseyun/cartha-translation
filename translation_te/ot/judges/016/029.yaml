source:
  edition: WLC
  text: וַ/יִּלְפֹּ֨ת שִׁמְשׁ֜וֹן אֶת שְׁנֵ֣י עַמּוּדֵ֣י הַ/תָּ֗וֶךְ אֲשֶׁ֤ר הַ/בַּ֨יִת֙ נָכ֣וֹן עֲלֵי/הֶ֔ם וַ/יִּסָּמֵ֖ךְ עֲלֵי/הֶ֑ם אֶחָ֥ד בִּ/ימִינ֖/וֹ וְ/אֶחָ֥ד בִּ/שְׂמֹאלֽ/וֹ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/029.yaml
  text: Then Samson grasped the two middle pillars on which the house stood[a], and he braced himself against them[b], one with his right hand and one with his left.
translation:
  language: te
  text: అప్పుడు సమ్సోను భవనం వాటిమీద నిలిచి ఉన్న రెండు మధ్య స్తంభాలను గట్టిగా పట్టుకొని, వాటికి ఆనుకున్నాడు[a]—తన కుడిచేతితో ఒకదానిని, ఎడమచేతితో మరొకదానిని.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వాటిమీద తన బరువును మోపాడు.’ హీబ్రూ క్రియ దేనికైనా ఆనుకోవడం లేదా దానిని ఆధారంగా చేసుకోవడం అనే భావాలను ఇవ్వగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלְפֹּת
  choice: గట్టిగా పట్టుకొని
  rationale: ఈ క్రియ బలంగా పట్టుకోవడం లేదా పట్టు బిగించడం అనే భావాన్ని ఇస్తుంది. సందర్భంలోని ఉద్దేశపూర్వకమైన శారీరక చర్యను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: שְׁנֵי עַמּוּדֵי הַתָּוֶךְ
  choice: రెండు మధ్య స్తంభాలను
  rationale: עַמּוּדֵי అంటే ‘స్తంభాలు’; הַתָּוֶךְ మధ్య లేదా కేంద్ర స్థానాన్ని సూచిస్తుంది. ‘మధ్య స్తంభాలు’ సంక్షిప్తంగానూ నిర్మాణ సంబంధమైన సందర్భానికి తగినట్టుగానూ ఉంది.
- source_word: אֲשֶׁר הַבַּיִת נָכוֹן עֲלֵיהֶם
  choice: ఆ భవనం నిలిచి ఉన్న
  rationale: נָכוֹן ఇక్కడ స్థిరంగా నిలిచి ఉండడం లేదా ఆధారపడి ఉండడం అనే భావాన్ని ఇస్తుంది. స్తంభాలు భవనాన్ని మోస్తున్న నిర్మాణాధారాలని ఈ ప్రయోగం సహజంగా తెలియజేస్తుంది.
- source_word: וַיִּסָּמֵךְ עֲלֵיהֶם
  choice: వాటికి ఆనుకున్నాడు
  rationale: סמך అనే క్రియ ఆనుకోవడం, ఆధారపడడం, తన బరువును మోపడం వంటి భావాలను కలిగి ఉంటుంది. ‘ఆనుకున్నాడు’ మూలంలోని అర్థవిస్తృతిని అతిగా నిర్దిష్టం చేయకుండా శారీరక చర్యను స్పష్టంగా చెబుతుంది.
- source_word: אֶחָד בִּימִינוֹ וְאֶחָד בִּשְׂמֹאלוֹ
  choice: ఒకదాన్ని తన కుడిచేతితో, మరొకదాన్ని తన ఎడమచేతితో
  rationale: אֶחָד ... וְאֶחָד ఒక్కో వైపున ఒక్కో స్తంభం ఉన్న పంపిణీ భావాన్ని ఇస్తుంది. పట్టుకోవడం అనే ముందరి క్రియతో కలిపి చూస్తే, కుడిచేతి–ఎడమచేతి అని చెప్పడం తెలుగులో సహజంగా శారీరక అమరికను తెలియజేస్తుంది.
- source_word: הַבַּיִת
  choice: భవనం
  rationale: మూలపదానికి ప్రాథమిక అర్థం ‘ఇల్లు’ అయినా, ఇక్కడ ప్రజలు కూడిన పెద్ద నిర్మాణాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘భవనం’ సందర్భాన్ని స్పష్టంగా తెలియజేస్తూ, అది దేవాలయమని ఈ వాక్యంలోనే అదనంగా నిర్దిష్టం చేయదు.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. మూలంలోని వరుస చర్యలు నిలుపబడ్డాయి; סמך అనే క్రియలోని నిజమైన అర్థవిస్తృతి పాదసూచికలో భద్రపరచబడింది.
