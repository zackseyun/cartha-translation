- from: అప్పుడు సమ్సోను ఆ భవనం నిలిచి ఉన్న రెండు మధ్య స్తంభాలను గట్టిగా పట్టుకొని, వాటికి ఆనుకున్నాడు[a]—ఒకదాన్ని తన కుడిచేతితో, మరొకదాన్ని తన ఎడమచేతితో పట్టుకున్నాడు.
  to: అప్పుడు సమ్సోను భవనం వాటిమీద నిలిచి ఉన్న రెండు మధ్య స్తంభాలను గట్టిగా పట్టుకొని, వాటికి ఆనుకున్నాడు[a]—తన కుడిచేతితో ఒకదానిని, ఎడమచేతితో మరొకదానిని.
  rationale: The revision preserves the source sequence and ambiguity while clarifying that the building stood on the pillars. It also recasts the final distributive expression as part of Samson’s single act of grasping, rather than redundantly stating that he grasped them again. The footnote remains correctly anchored to ‘ఆనుకున్నాడు’; the English audit trail’s footnote lettering appears cross-associated, so it was not used to relocate the Telugu lexical note contrary to the Hebrew.
