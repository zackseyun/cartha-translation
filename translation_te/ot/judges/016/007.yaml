  revision_rationale: The revision removes the unsupported explicit sense ‘the rest/remaining,’ uses a clearer modern term for ‘bowstrings,’ and otherwise preserves the draft’s faithful rendering of the Hebrew condition and result. The idiomatic ‘any other man’ interpretation remains available in the anchored footnote.
