id: JDG.16.7
reference: Judges 16:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֵלֶ֨י/הָ֙ שִׁמְשׁ֔וֹן אִם יַאַסְרֻ֗/נִי בְּ/שִׁבְעָ֛ה יְתָרִ֥ים לַחִ֖ים אֲשֶׁ֣ר לֹא חֹרָ֑בוּ וְ/חָלִ֥יתִי וְ/הָיִ֖יתִי כְּ/אַחַ֥ד הָ/אָדָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/007.yaml
  text: And Samson said to her[a], “If they bind me with seven fresh bowstrings that have not dried, then I will become weak and be like one of the men.”
translation:
  language: te
  text: అప్పుడు సమ్సోను ఆమెతో, “ఏడు ఇంకా ఎండిపోని తాజా విల్లునారలతో నన్ను కట్టివేస్తే, నేను బలహీనుడనై మనుష్యులలో ఒకడిలా అవుతాను[a]” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఏ ఇతర మనిషిలా అవుతాను.”
    reason: כְּאַחַד הָאָדָם అనే హీబ్రూ జాతీయ ప్రయోగానికి మరింత సహజమైన ప్రత్యామ్నాయ అనువాదం.
lexical_decisions:
- source_word: וַיֹּאמֶר ... שִׁמְשׁוֹן אֵלֶיהָ
  choice: అప్పుడు సమ్సోను ఆమెతో ... అన్నాడు
  rationale: హీబ్రూ కథనంలోని wayyiqtol తదుపరి సంఘటనను కొనసాగిస్తుంది; ఆధునిక తెలుగు కథనశైలిలో ‘అప్పుడు’ సహజంగా ఆ ప్రవాహాన్ని తెలియజేస్తుంది.
- source_word: אִם יַאַסְרֻנִי
  choice: నన్ను కట్టివేస్తే
  rationale: మూడవ పురుష బహువచనం ఇక్కడ నిర్దిష్ట కర్తను సూచించదు. తెలుగు షరతు నిర్మాణంలో కర్తను పేర్కొనకుండా చెప్పడం ఆ అనిర్దిష్ట భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: בְּשִׁבְעָה יְתָרִים
  choice: ఏడు వింటినారలతో
  rationale: יְתָרִים ఈ సందర్భంలో సాధారణ తాళ్లకన్నా విల్లుకు ఉపయోగించే నారలను సూచిస్తుంది; ‘తో’ సాధనార్థక בְను తెలియజేస్తుంది.
- source_word: לַחִים אֲשֶׁר לֹא חֹרָבוּ
  choice: ఇంకా ఎండిపోని ... తాజా
  rationale: לַחִים లోని తడి/తాజా భావాన్ని, לֹא חֹרָבוּ లోని ఇంకా ఎండని స్థితిని రెండింటినీ సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: וְחָלִיתִי
  choice: నేను బలహీనుడనై
  rationale: חלה ఇక్కడ అనారోగ్యం కంటే బలం కోల్పోవడాన్ని సూచిస్తుంది; ‘బలహీనుడనై’ ఫలితంగా కలిగే మార్పును స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: וְהָיִיתִי כְּאַחַד הָאָדָם
  choice: మిగతా మనుషుల్లో ఒకడిలా అవుతాను
  rationale: మూలంలోని ‘మనుషుల్లో ఒకడిలా’ అనే పోలికను నిలుపుతూ, అసాధారణ బలం లేని ఇతరులవలె అవుతాననే సందర్భార్థాన్ని తెలుగులో అర్థమయ్యేలా చేస్తుంది.
theological_decisions:
- issue: כְּאַחַד הָאָדָם అనే పోలికలో אָדָם భావం
  choice: మిగతా మనుషుల్లో ఒకడిలా
  alternative: ఏ ఇతర మనిషిలా / ఒక సాధారణ మనిషిలా
  rationale: మూలపాఠంలోని సమూహంలో ‘ఒకడు’ అనే రూపాన్ని సాధ్యమైనంతవరకు నిలుపుతుంది. అయితే ఈ జాతీయ ప్రయోగం సందర్భంలో ‘ఇతర ఏ మనిషిలాగానైనా’ అనే భావాన్నీ అనుమతిస్తుంది; ఆ ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టమైన, గౌరవప్రదమైన కథనశైలి. ‘వింటినారలు’ సందర్భానుకూలమైన నిర్దిష్ట పదం; మూలంలోని షరతు, బలహీనత, మానవులతో పోలికలను కాపాడింది.
