  to: అప్పుడు సమ్సోను ఆమెతో, “ఏడు ఇంకా ఎండిపోని తాజా విల్లునారలతో నన్ను కట్టివేస్తే, నేను బలహీనుడనై మనుష్యులలో ఒకడిలా అవుతాను[a]” అన్నాడు.
