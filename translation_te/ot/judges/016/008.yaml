id: JDG.16.8
reference: Judges 16:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּעֲלוּ לָ֞/הּ סַרְנֵ֣י פְלִשְׁתִּ֗ים שִׁבְעָ֛ה יְתָרִ֥ים לַחִ֖ים אֲשֶׁ֣ר לֹא חֹרָ֑בוּ וַ/תַּאַסְרֵ֖/הוּ בָּ/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/008.yaml
  text: So the Philistine rulers brought up to her seven fresh bowstrings that had not been dried[a], and she bound him with them.
translation:
  language: te
  text: అప్పుడు ఫిలిష్తీయుల పాలకులు ఇంకా ఎండని ఏడు తడి విల్లుతీగలను ఆమె వద్దకు తీసుకొచ్చారు; ఆమె వాటితో అతనిని బంధించింది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲלוּ לָהּ
  choice: ఆమె దగ్గరికి తీసుకొచ్చారు
  rationale: עלה యొక్క ‘పైకి తీసుకురావడం’ అనే మూలభావాన్ని సందర్భానుసారంగా సహజమైన తెలుగులో వ్యక్తపరుస్తుంది; ఇక్కడ అధికారులు దెలీలా కోరిన వస్తువులను ఆమెకు సమకూరుస్తున్నారు.
- source_word: סַרְנֵי פְלִשְׁתִּים
  choice: ఫిలిష్తీయుల పాలకులు
  rationale: సַרְנֵי అనే పదం ఫిలిష్తీయుల ప్రధాన రాజకీయ అధికారులను సూచిస్తుంది. ‘పాలకులు’ ఆధునిక పాఠకులకు స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: שִׁבְעָה יְתָרִים
  choice: ఏడు వింటినారలు
  rationale: יְתָרִים సాధారణ తాళ్లకంటే విల్లుకు ఉపయోగించే నారలను సూచించే అవకాశం ఎక్కువ; ‘వింటినారలు’ ఆ నిర్దిష్ట భావాన్ని నిలుపుతుంది.
- source_word: לַחִים אֲשֶׁר לֹא חֹרָבוּ
  choice: ఎండబెట్టని ... తాజా
  rationale: לַחִים లోని తడి/తాజా స్థితినీ, לֹא חֹרָבוּ లోని ఇంకా ఎండని భావాన్నీ కలిపి తెలియజేస్తుంది; తెలుగు వాక్యక్రమం కోసం విశేషణాలను విడదీసి అమర్చాం.
- source_word: וַתַּאַסְרֵהוּ בָּהֶם
  choice: ఆమె వాటితో అతణ్ణి బంధించింది
  rationale: אסר యొక్క ‘బంధించు’ అనే భావాన్నీ, בָּהֶם సూచించే సాధనార్థాన్నీ నేరుగా, గంభీరమైన కథనశైలిలో అందిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. మూలంలోని వరుస చర్యలను ‘అప్పుడు ...; ...’ నిర్మాణంతో నిలిపాం. ‘వింటినారలు’ కొంత అరుదైన పదం కావడంతో పాఠకునికి అర్థమయ్యే ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
