- from: అప్పుడు ఫిలిష్తీయుల పాలకులు ఎండబెట్టని ఏడు తాజా వింటినారలను[a] ఆమె దగ్గరికి తీసుకొచ్చారు; ఆమె వాటితో అతణ్ణి బంధించింది.
  to: అప్పుడు ఫిలిష్తీయుల పాలకులు ఇంకా ఎండని ఏడు తడి విల్లుతీగలను ఆమె వద్దకు తీసుకొచ్చారు; ఆమె వాటితో అతనిని బంధించింది.
  rationale: The revision uses clear modern Telugu, explicitly renders both “moist/fresh” and “not dried,” and retains the contextual rendering “bowstrings” while noting the broader lexical alternative in an accurately anchored footnote.
