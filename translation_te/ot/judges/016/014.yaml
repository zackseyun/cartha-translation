  yaml_path: translation/ot/judges/016/014.yaml
  text: Then she fastened it with the pin and said to him[a], “The Philistines are upon you[c][b], Samson!” And he awoke from his sleep and pulled away the pin of the loom and the web.
translation:
  language: te
  text: అప్పుడు ఆమె దానిని మగ్గపు మేకుతో బిగించి, “సమ్సోనూ, ఫిలిష్తీయులు నీ మీదికి వచ్చారు!” అని అతనితో ఇలా అంది. అతడు నిద్రనుంచి మేల్కొని, మగ్గపు మేకును, నేసిన వస్త్రాన్ని పెకలించి తీసేశాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మగ్గపు మేకును, మగ్గంపై నేసిన పదార్థాన్ని బలంగా ఊడదీశాడు.” చివరి హెబ్రీ పదం మగ్గంపై నేసిన పదార్థాన్ని సూచిస్తుంది; దాని ఖచ్చితమైన సాంకేతిక అర్థం అనిశ్చితం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּתְקַע בַּיָּתֵד
  choice: మగ్గపు మేకుతో బిగించి
  rationale: תקע అనే క్రియకు ‘దిగగొట్టు, బిగించు’ అనే భావాలున్నాయి; యָתֵד అనేది మేకు లేదా కొయ్యమేకును సూచిస్తుంది. నేయడం అనే సందర్భంలో చర్యను సహజంగా తెలియజేయడానికి ఈ రూపం ఎంచుకోబడింది.
- source_word: פְּלִשְׁתִּים עָלֶיךָ
  choice: ఫిలిష్తీయులు నీ మీదికి వచ్చారు
  rationale: హెబ్రీ హెచ్చరిక సూత్రంలోని ‘నీ మీద’ అనే అత్యవసర భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది; దాడి మొదలైందని పాఠానికి మించి నిర్దిష్టం చేయదు.
- source_word: וַיִּיקַץ מִשְּׁנָתוֹ
  choice: అతడు నిద్రనుంచి మేల్కొని
  rationale: క్రియను, దాని విభక్తి సంబంధాన్ని నేరుగా మరియు సహజంగా అందిస్తుంది.
- source_word: וַיִּסַּע
  choice: పెకలించి తీసేశాడు
  rationale: נסע ఇక్కడ బలంగా ఊడదీయడం లేదా తొలగించడం అనే భావంలో ఉంది. ‘పెకలించి తీసేశాడు’ ప్రయాణం అనే వేరొక అర్థాన్ని నివారిస్తూ బలవంతపు తొలగింపును వ్యక్తం చేస్తుంది.
- source_word: הַיְתַד הָאֶרֶג
  choice: మగ్గపు మేకు
  rationale: నేయు పరికరానికి సంబంధించిన మేకు అనే సంబంధాన్ని సంక్షిప్తంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: הַמַּסָּכֶת
  choice: నేసిన వస్త్రం
  rationale: ఈ అరుదైన నేయు పదం మగ్గంపై నేసిన పదార్థాన్ని సూచిస్తుంది. ‘వస్త్రం’ సాధారణ పాఠకులకు స్పష్టం; ‘పడుగు’ వంటి మరింత సాంకేతిక అర్థాన్ని అనవసరంగా నిర్ణయించదు.
