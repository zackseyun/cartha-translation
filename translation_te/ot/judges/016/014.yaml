  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన కథన శైలి. హెబ్రీ నేయు పరిభాషలోని అనిశ్చితిని పాదటిప్పణిలో నిలిపి, ప్రధాన పాఠంలో సాధారణ పాఠకులకు అర్థమయ్యే పదాలను వాడాం.
