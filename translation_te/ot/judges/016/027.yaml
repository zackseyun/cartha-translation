source:
  edition: WLC
  text: וְ/הַ/בַּ֗יִת מָלֵ֤א הָֽ/אֲנָשִׁים֙ וְ/הַ/נָּשִׁ֔ים וְ/שָׁ֕מָּ/ה כֹּ֖ל סַרְנֵ֣י פְלִשְׁתִּ֑ים וְ/עַל הַ/גָּ֗ג כִּ/שְׁלֹ֤שֶׁת אֲלָפִים֙ אִ֣ישׁ וְ/אִשָּׁ֔ה הָ/רֹאִ֖ים בִּ/שְׂח֥וֹק שִׁמְשֽׁוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/027.yaml
  text: The house was full of men and women[a], and all the lords of the Philistines were there. And on the roof were about three thousand men and women watching Samson as he performed.
translation:
  language: te
  text: ఆ భవనం పురుషులతోను స్త్రీలతోను నిండి ఉంది; ఫిలిష్తీయుల అధిపతులందరూ అక్కడ ఉన్నారు. పైకప్పుమీద సుమారు మూడు వేలమంది పురుషులు, స్త్రీలు సమ్సోను ఆటను[a] చూస్తూ ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సమ్సోను ప్రదర్శనను చూస్తూ ఉన్నారు.” మరింత పదానుసారంగా, “సమ్సోను క్రీడను చూస్తూ ఉన్నారు.” ఇక్కడి హీబ్రూ పదం నవ్వడం, ఆడడం, క్రీడించడం, లేదా వినోదం చేయడం అనే అర్థాలను ఇవ్వగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבַּיִת
  choice: ఆ భవనం
  rationale: בַּיִת యొక్క ప్రాథమిక అర్థం ‘ఇల్లు/భవనం.’ సందర్భంలో ఇది దాగోను ఆలయ సముదాయంలోని కట్టడాన్ని సూచించినా, మూలపాఠం ‘ఆలయం’ అని ప్రత్యేకంగా చెప్పదు; అందువల్ల ‘భవనం’ సందర్భానికి సహజంగా ఉండి అతివ్యాఖ్యను నివారిస్తుంది.
- source_word: מָלֵא
  choice: నిండిపోయింది
  rationale: ‘నిండియుండడం’ అనే స్థితిని ఆధునిక తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: הָאֲנָשִׁים ... וְהַנָּשִׁים
  choice: పురుషులతో, స్త్రీలతో
  rationale: మూలంలోని రెండు వర్గాల స్పష్టమైన ప్రస్తావనను నిలుపుతుంది.
- source_word: וְשָׁמָּה
  choice: అక్కడే ఉన్నారు
  rationale: స్థలాన్ని నొక్కిచెప్పే ‘అక్కడ’ అనే భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: כֹּל סַרְנֵי פְלִשְׁתִּים
  choice: ఫిలిష్తీయుల అధిపతులందరూ
  rationale: סְרָנִים ఫిలిష్తీయుల ప్రత్యేక రాజకీయ పాలకులను సూచిస్తుంది; ‘అధిపతులు’ వారి హోదాను స్పష్టంగా, గౌరవప్రదంగా తెలియజేస్తుంది.
- source_word: וְעַל הַגָּג
  choice: పైకప్పు మీద
  rationale: గָּג అనే పదానికి నేరమైన, సాధారణ తెలుగు సమానార్థకం.
- source_word: כִּשְׁלֹשֶׁת אֲלָפִים
  choice: దాదాపు మూడు వేలమంది
  rationale: כְּ ఉపసర్గ ఇక్కడ సూచించే సుమారు సంఖ్యను ‘దాదాపు’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: אִישׁ וְאִשָּׁה
  choice: పురుషులు, స్త్రీలు
  rationale: ఏకవచన రూపాలు సమూహంలోని వ్యక్తులను పంపిణీ భావంలో సూచిస్తున్నందున తెలుగులో సహజమైన బహువచనం వాడబడింది.
- source_word: הָרֹאִים
  choice: చూస్తూ ఉన్నారు
  rationale: కొనసాగుతున్న వీక్షణను తెలిపే కృదంత భావాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: בִּשְׂחוֹק שִׁמְשׁוֹן
  choice: సమ్సోను ప్రదర్శనను
  rationale: שׂחק ధాతువు నవ్వడం, ఆడడం, వినోదం చేయడం వంటి భావాలను కలిగి ఉంది. ఈ సందర్భంలో సమ్సోను జనసమూహం ఎదుట వినోదాత్మక ప్రదర్శన చేస్తున్న భావాన్ని ‘ప్రదర్శన’ సంక్షిప్తంగా తెలియజేస్తుంది; అయితే పదంలోని విస్తృత భావపరిధిని పాదసూచికలో ఉంచింది.
theological_decisions:
- issue: సమ్సోను స్వచ్ఛందంగా ప్రదర్శించాడా లేక అవమానకరంగా వినోదవస్తువుగా చేయబడ్డాడా అన్నది
  choice: ప్రధాన పాఠంలో ‘సమ్సోను ప్రదర్శనను’ అని తటస్థంగా ఉంచడం
  alternative: ‘సమ్సోనును ఎగతాళి చేయడాన్ని’ లేదా ‘సమ్సోను వారిని వినోదపరచడాన్ని’
  rationale: ఈ పదబంధం ఎలా జరిగిందో మూలపాఠం ఈ వాక్యంలో స్పష్టంగా నిర్ణయించదు. సందర్భం అవమానకర వినోదాన్ని సూచించినా, ప్రధాన పాఠంలో కర్తృత్వం లేదా ఉద్దేశాన్ని అతిగా నిర్ధారించకుండా అస్పష్టతను నిలుపుకోవడం సముచితం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన వాక్యనిర్మాణం వాడబడింది. ‘ఆలయం’ అని అతిగా నిర్దిష్టం చేయకుండా ‘భవనం,’ మరియు సంప్రదాయ రాజకీయ హోదాను స్పష్టంగా చూపేందుకు ‘అధిపతులు’ ఎంచుకున్నాం.
