source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר שִׁמְשׁ֗וֹן תָּמ֣וֹת נַפְשִׁ/י֮ עִם פְּלִשְׁתִּים֒ וַ/יֵּ֣ט בְּ/כֹ֔חַ וַ/יִּפֹּ֤ל הַ/בַּ֨יִת֙ עַל הַ/סְּרָנִ֔ים וְ/עַל כָּל הָ/עָ֖ם אֲשֶׁר בּ֑/וֹ וַ/יִּהְי֤וּ הַ/מֵּתִים֙ אֲשֶׁ֣ר הֵמִ֣ית בְּ/מוֹת֔/וֹ רַבִּ֕ים מֵ/אֲשֶׁ֥ר הֵמִ֖ית בְּ/חַיָּֽי/ו־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/030.yaml
  text: And Samson said[a], “Let me die with the Philistines.” Then he bent with all his strength, and the house fell on the rulers and on all the people who were in it[c][b]. So the dead whom he killed at his death were more than those whom he had killed during his life.
translation:
  language: te
  text: అప్పుడు సమ్సోను, “ఫిలిష్తీయులతోపాటు నేను చనిపోవుగాక[a]” అని చెప్పి, తన బలంతో వంగాడు. ఆ భవనం[c] పాలకుల[b] మీదా, దానిలో ఉన్న ప్రజలందరి మీదా కూలిపోయింది. అతడు తన జీవితంలో చంపినవారికంటే, తన మరణ సమయంలో చంపినవారు ఎక్కువమంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “నా ప్రాణం ఫిలిష్తీయులతోపాటు చనిపోవుగాక.” ఇక్కడ “నా ప్రాణం” అంటే సమ్సోను తానే.
    reason: lexical_alternative
  - marker: b
    text: లేదా “ఫిలిష్తీయుల అధిపతులు.”
    reason: lexical_alternative
  - marker: c
    text: లేదా “ఇల్లు”; హీబ్రూలో ఇది ‘ఇల్లు’ లేదా ‘కట్టడం’ అనే సాధారణ పదం.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּמוֹת נַפְשִׁי
  choice: నన్నూ చనిపోనివ్వు
  rationale: నֶפֶשׁ ఇక్కడ సమ్సోను అనే వ్యక్తినే సూచించే హీబ్రూ నుడికారం. ప్రత్యేకమైన ఆత్మసంబంధ సిద్ధాంతాన్ని సూచించకుండా, అభిలాషార్థక భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: עִם פְּלִשְׁתִּים
  choice: ఫిలిష్తీయులతోపాటు
  rationale: సమ్సోను తన శత్రువులతో కలిసి మరణించడానికి సిద్ధపడిన భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: וַיֵּט בְּכֹחַ
  choice: తన శక్తినంతా ఉపయోగించి వంగాడు
  rationale: נטה లోని వంగడం లేదా ఒత్తిడి పెట్టడం అనే శారీరక చర్యను, בְּכֹחַ లోని బలప్రయోగాన్ని సందర్భానుగుణంగా తెలియజేస్తుంది.
- source_word: הַבַּיִת
  choice: ఆ భవనం
  rationale: בַּיִת సాధారణంగా ఇల్లు లేదా కట్టడం అనే అర్థం ఇస్తుంది. ఇక్కడ ప్రజలు కూడిన నిర్మాణాన్ని సూచిస్తున్నందున ‘భవనం’ సహజంగా ఉంది; ‘ఆలయం’ అని అనువదించడం సందర్భం నుంచి చేసిన నిర్దిష్ట వ్యాఖ్యానం అవుతుంది.
- source_word: הַסְּרָנִים
  choice: పాలకులు
  rationale: ఫిలిష్తీయుల రాజకీయ నాయకులను సూచించే పదం. ‘ప్రభువులు’ కంటే ఆధునిక పాఠకులకు వారి అధికార స్థానాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: כָּל הָעָם אֲשֶׁר בּוֹ
  choice: దానిలో ఉన్న ప్రజలందరి
  rationale: మొత్తం ప్రజలను సూచించే כָּל భావాన్నీ, భవనం లోపల ఉన్నారనే సంబంధ వాక్యాన్నీ కాపాడుతుంది.
- source_word: אֲשֶׁר הֵמִית בְּמוֹתוֹ
  choice: తాను చనిపోయినప్పుడు చంపినవారు
  rationale: సమ్సోను మరణించిన అదే సంఘటనలో అతని వల్ల ఇతరులు చనిపోయారనే కాలసంబంధాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: רַבִּים מֵאֲשֶׁר
  choice: కంటే ... ఎక్కువమంది
  rationale: మరణ సమయంలో చంపబడిన వారి సంఖ్య జీవితకాలంలో చంపబడిన వారి సంఖ్యను మించిందనే హీబ్రూ తులనను స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: בְּחַיָּיו
  choice: తన జీవితకాలంలో
  rationale: ‘తాను చనిపోయినప్పుడు’ అనే పదబంధంతో స్పష్టమైన కాలవ్యత్యాసాన్ని ఏర్పరుస్తుంది.
theological_decisions:
- issue: సమ్సోను చివరి మాటలో נֶפֶשׁ పదాన్ని అనువదించడం
  choice: నన్నూ చనిపోనివ్వు
  alternative: నా ప్రాణం ఫిలిష్తీయులతోపాటు చనిపోనివ్వు
  rationale: ఈ సందర్భంలో נֶפֶשׁ వ్యక్తినే సూచించే నుడికారం. ‘ప్రాణం’ అనే అక్షరార్థ రూపాన్ని ప్రధాన పాఠంలో ఉంచితే శరీరానికి వేరైన అంశంపై హీబ్రూ వాక్యం చేయని సిద్ధాంత ప్రకటన చేస్తున్నట్లు అపార్థం కలగవచ్చు. అక్షరసన్నిహిత రూపాన్ని పాదటిప్పణిలో ఉంచడం ద్వారా మూలభాష రూపం కూడా కనిపిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘ఆలయం’ వంటి సందర్భాధారిత నిర్దిష్టీకరణను నివారించి, మూలంలోని సాధారణ పదానికి అనుగుణంగా ‘భవనం’ ఎంచుకోబడింది. అన్ని పాదటిప్పణి సూచికలు ప్రధాన పాఠంలో ఉన్నాయి.
