id: JDG.16.19
reference: Judges 16:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/תְּיַשְּׁנֵ֨/הוּ֙ עַל בִּרְכֶּ֔י/הָ וַ/תִּקְרָ֣א לָ/אִ֔ישׁ וַ/תְּגַלַּ֕ח אֶת שֶׁ֖בַע מַחְלְפ֣וֹת רֹאשׁ֑/וֹ וַ/תָּ֨חֶל֙ לְ/עַנּוֹת֔/וֹ וַ/יָּ֥סַר כֹּח֖/וֹ מֵ/עָלָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/019.yaml
  text: So she made him sleep on her knees[a], and she called for a man, and she shaved off the seven locks of his head. Then she began to afflict him[c][b], and his strength left him.
translation:
  language: te
  text: అప్పుడు ఆమె అతణ్ణి తన మోకాళ్ల మీద నిద్రపుచ్చి[a], ఒక మనిషిని పిలిపించింది[b]. అతని తల వెంట్రుకల ఏడు పాయలను[c] గొరిగివేసింది. ఆ తర్వాత ఆమె అతణ్ణి బాధించడం మొదలుపెట్టింది; అతని బలం అతణ్ణి విడిచిపోయింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘తన ఒడిలో.’ అక్షరార్థంగా, ‘తన మోకాళ్ల మీద.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘ఒక మనిషిని పిలిచింది.’ హీబ్రూ మాట పని చేయడానికి ఒక మనిషిని రప్పించడాన్నిగానీ, అప్పటికే దృష్టిలో ఉన్న మనిషిని పిలవడాన్నిగానీ సూచించవచ్చు.
    reason: alternative_reading
  - marker: c
    text: లేదా, ‘ఏడు జడలను.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּיַשְּׁנֵהוּ
  choice: అతణ్ణి ... నిద్రపుచ్చి
  rationale: ישׁן హిఫీల్ రూపంలోని కారణార్థాన్ని—ఆమె అతడు నిద్రపోయేలా చేసిందనే భావాన్ని—సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది; అతణ్ణి ఎలా నిద్రపుచ్చిందో అనవసరంగా నిర్దిష్టం చేయదు.
- source_word: עַל בִּרְכֶּיהָ
  choice: తన మోకాళ్ల మీద
  rationale: హీబ్రూ పదానికి అక్షరార్థం ‘ఆమె మోకాళ్ల మీద.’ సందర్భంలో ‘ఒడిలో’ అనే సహజ భావం ఉండవచ్చు కాబట్టి దానిని పాదటిప్పణిలో ఇస్తూ, ప్రధాన పాఠ్యంలో మూలరూపాన్ని నిలిపాం.
- source_word: וַתִּקְרָא לָאִישׁ
  choice: ఒక మనిషిని పిలిపించింది
  rationale: לతో కూడిన קרא ఇక్కడ పనికోసం ఒక మనిషిని రప్పించడాన్ని సూచిస్తుంది. אישׁ నిర్దిష్టతను బలవంతంగా నిర్ణయించకుండా ‘ఒక మనిషి’ అని అనువదించాం.
- source_word: וַתְּגַלַּח
  choice: గొరిగివేసింది
  rationale: క్రియ స్త్రీలింగ ఏకవచనంలో ఉండి దెలీలానే వ్యాకరణ కర్తగా చూపుతుంది. పిలిపించిన మనిషి ద్వారా ఆమె పని చేయించి ఉండవచ్చనే అవకాశాన్ని తొలగించకుండా, హీబ్రూ వాక్యనిర్మాణాన్ని అనుసరించాం.
- source_word: שֶׁבַע מַחְלְפוֹת רֹאשׁוֹ
  choice: అతని తల వెంట్రుకల ఏడు పాయలు
  rationale: מַחְלְפוֹת అనేది జుట్టు పాయలు లేదా జడలను సూచించగలదు. ‘పాయలు’ అనేది అవి తప్పనిసరిగా అల్లిన జడలేనని నిర్ణయించకుండా మూలంలోని విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: וַתָּחֶל לְעַנּוֹתוֹ
  choice: ఆమె అతణ్ణి బాధించడం మొదలుపెట్టింది
  rationale: וַתָּחֶל చర్య ఆరంభాన్ని తెలియజేస్తుంది; ענה పియేల్‌కు బాధించడం, అణచడం, హింసించడం వంటి భావాలున్నాయి. ‘బాధించడం’ నిర్దిష్ట విధానాన్ని చేర్చకుండా విస్తృత భావాన్ని కాపాడుతుంది.
- source_word: וַיָּסַר כֹּחוֹ מֵעָלָיו
  choice: అతని బలం అతణ్ణి విడిచిపోయింది
  rationale: బలం అతని నుంచి తొలగిపోయిందనే హీబ్రూ నుడికారాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: సంసోను కోల్పోయిన బలానికి మూలం
  choice: ‘అతని బలం అతణ్ణి విడిచిపోయింది’ అని మాత్రమే అనువదించడం
  alternative: ‘యెహోవా ఇచ్చిన బలం అతణ్ణి విడిచిపోయింది’ అని విస్తరించడం
  rationale: ఈ వచనం బలం అతణ్ణి విడిచిపోయిందని మాత్రమే చెబుతుంది; యెహోవాను ఇక్కడ ప్రత్యక్షంగా ప్రస్తావించదు. విస్తృత సందర్భంలో దేవుని శక్తినిచ్చే కార్యం ఉన్నప్పటికీ, దానిని ఈ వచనంలో చేర్చడం మూలానికి మించిన వివరణ అవుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలిని ఉపయోగించాం. ‘నిద్రపుచ్చి,’ ‘పిలిపించింది,’ ‘బాధించడం మొదలుపెట్టింది’ వంటి రూపాలు మూలంలోని కారణార్థం, క్రమం, చర్య ఆరంభాన్ని స్పష్టంగా ఉంచుతాయి. మూలంలో ఉన్న సందిగ్ధతలను ప్రధాన పాఠ్యంలో అతిగా పరిష్కరించకుండా పాదటిప్పణుల్లో సూచించాం.
