review_pass:
  verdict: revise
  source_fidelity: 'The draft conveys the verse’s sequence and core sense well: Samson fully discloses what is in his heart, identifies himself as a Nazirite from the womb, and describes the consequence of shaving. However, “మంగలికత్తి పడలేదు” literally evokes a razor falling on his head rather than a razor being used over it; it does not adequately convey the Hebrew shaving idiom.'
  naturalness: Most of the Telugu is modern and clear. Replacing the caste-linked and semantically imprecise “మంగలికత్తి పడలేదు” with “క్షౌరకత్తి నడవలేదు” is more neutral and idiomatic in this context. “చెప్పి ఇలా అన్నాడు” also preserves the completed narrative sequence more naturally than “వెల్లడిస్తూ ఇలా అన్నాడు.”
  terminology: “నాజీరు” appropriately preserves the technical Nazirite term and the explanatory footnote is useful. “దేవునికి నాజీరుగాను” naturally expresses the Hebrew “a Nazirite of God” without imposing an interpretive expansion. The footnote anchor is placed directly after the technical term.
  issues:
  - severity: medium
    issue: “మంగలికత్తి పడలేదు” for מוֹרָה לֹא עָלָה עַל רֹאשִׁי
    rationale: “పడలేదు” means ‘did not fall,’ which can misrepresent the idiom as physical falling rather than shaving. “మంగలికత్తి” is also less suitable as neutral modern standard terminology. “క్షౌరకత్తి ... నడవలేదు” clearly conveys that no razor has passed over his head.
  - severity: low
    issue: “వెల్లడిస్తూ ఇలా అన్నాడు” blurs the sequential verbs.
    rationale: The Hebrew first says that he told her all his heart and then that he spoke. “చెప్పి ఇలా అన్నాడు” retains that sequence without changing the sense.
  revised_text: 'అప్పుడు అతడు తన హృదయంలో ఉన్నదంతా ఆమెకు చెప్పి ఇలా అన్నాడు: “నా తలపై ఎన్నడూ క్షౌరకత్తి నడవలేదు. ఎందుకంటే నేను నా తల్లి గర్భం నుంచే దేవునికి నాజీరుగాను[a] ఉన్నాను. నా తల గొరిగితే, నా బలం నన్ను విడిచిపోతుంది; నేను బలహీనుడనై మిగతా మనుషులందరిలా అవుతాను.”'
