  to: 'అప్పుడు అతడు తన హృదయంలో ఉన్నదంతా ఆమెకు చెప్పి ఇలా అన్నాడు: “నా తలపై ఎన్నడూ క్షౌరకత్తి నడవలేదు. ఎందుకంటే నేను నా తల్లి గర్భం నుంచే దేవునికి నాజీరుగాను[a] ఉన్నాను. నా తల గొరిగితే, నా బలం నన్ను విడిచిపోతుంది; నేను బలహీనుడనై మిగతా మనుషులందరిలా అవుతాను.”'
  rationale: The revision corrects the razor idiom, uses neutral modern terminology, and preserves the Hebrew narrative sequence. It retains the technical term “నాజీరు,” the womb-from-birth formulation, the passive implication of being shaved, and the contrast with ordinary people.
