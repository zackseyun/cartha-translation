source:
  edition: WLC
  text: וַ/יַּגֶּד לָ֣/הּ אֶת כָּל לִבּ֗/וֹ וַ/יֹּ֤אמֶר לָ/הּ֙ מוֹרָה֙ לֹֽא עָלָ֣ה עַל רֹאשִׁ֔/י כִּֽי נְזִ֧יר אֱלֹהִ֛ים אֲנִ֖י מִ/בֶּ֣טֶן אִמִּ֑/י אִם גֻּלַּ֨חְתִּי֙ וְ/סָ֣ר מִמֶּ֣/נִּי כֹחִ֔/י וְ/חָלִ֥יתִי וְ/הָיִ֖יתִי כְּ/כָל הָ/אָדָֽם־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/017.yaml
  text: So he told her all his heart and said to her[a], “A razor has never come upon my head, for I have been a Nazirite of God from my mother’s womb. If I am shaved, then my strength will leave me[c][b], and I will become weak and be like every other man.”
translation:
  language: te
  text: 'అప్పుడు అతడు తన హృదయంలో ఉన్నదంతా ఆమెకు చెప్పి ఇలా అన్నాడు: “నా తలపై ఎన్నడూ క్షౌరకత్తి నడవలేదు. ఎందుకంటే నేను నా తల్లి గర్భం నుంచే దేవునికి నాజీరుగాను[a] ఉన్నాను. నా తల గొరిగితే, నా బలం నన్ను విడిచిపోతుంది; నేను బలహీనుడనై మిగతా మనుషులందరిలా అవుతాను.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '“నాజీరు” అంటే దేవునికి ప్రత్యేకంగా అంకితం చేయబడిన వ్యక్తి. చూడండి: సంఖ్యాకాండము 6:1–21.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּגֶּד ... אֶת כָּל לִבּוֹ
  choice: తన హృదయంలో ఉన్నదంతా ఆమెకు వెల్లడిస్తూ
  rationale: హీబ్రూ ‘తన హృదయమంతా’ అనే పూర్తి అంతరంగ వెల్లడిని సూచించే నుడికారాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; కేవలం ‘అన్నీ చెప్పాడు’ కంటే భావచిత్రాన్ని మెరుగ్గా నిలుపుతుంది.
- source_word: מוֹרָה לֹא עָלָה עַל רֹאשִׁי
  choice: నా తలపై ఎన్నడూ మంగలికత్తి పడలేదు
  rationale: ‘మంగలికత్తి’ ఇక్కడ తలను గొరిగే కత్తిని స్పష్టంగా సూచిస్తుంది; ‘తలపై పడలేదు’ అనే రూపం మూలంలోని ‘పైకి రాలేదు’ అనే చిత్రాన్ని సహజ తెలుగు నుడికారంలో నిలుపుతుంది.
- source_word: נְזִיר אֱלֹהִים
  choice: దేవునికి నాజీరు
  rationale: నాజీరత్వానికి సంబంధించిన సాంకేతిక పదాన్ని లిప్యంతరీకరించడం ద్వారా సంఖ్యాకాండము 6తోనూ సమ్సోను పిలుపుతోనూ ఉన్న సంబంధం నిలుస్తుంది; దత్తివ సంబంధం అతడు దేవునికి ప్రత్యేకంగా అంకితమైనవాడని సహజంగా తెలియజేస్తుంది.
- source_word: מִבֶּטֶן אִמִּי
  choice: నా తల్లి గర్భం నుంచే
  rationale: జననానికి ముందునుంచే ఉన్న అంకితాన్ని తెలిపే హీబ్రూ నుడికారానికి ఇది సహజమైన, సన్నిహిత తెలుగు రూపం.
- source_word: אִם גֻּלַּחְתִּי
  choice: నా తల గొరిగితే
  rationale: హీబ్రూ క్రియ కర్మణి భావాన్ని కలిగి ఉంది. తెలుగులో ఈ నిర్మాణం ఎవరో అతని తలను గొరిగే అర్థాన్ని సహజంగా ఇస్తుంది; సందర్భానుసారం ‘తల’ను స్పష్టం చేస్తుంది.
- source_word: וְסָר מִמֶּנִּי כֹחִי
  choice: నా బలం నన్ను విడిచిపోతుంది
  rationale: బలం అతని నుంచి తొలగిపోతుందనే మూలంలోని వ్యక్తీకరణను స్పష్టంగా, సహజంగా నిలుపుతుంది.
- source_word: וְחָלִיתִי
  choice: నేను బలహీనుడనై
  rationale: సందర్భంలో ఈ క్రియ అనారోగ్యాన్ని కాక శక్తి కోల్పోవడాన్ని సూచిస్తుంది; అందువల్ల ‘బలహీనుడనై’ తగిన అర్థాన్ని ఇస్తుంది.
- source_word: כְּכָל הָאָדָם
  choice: మిగతా మనుషులందరిలా
  rationale: సమ్సోను అసాధారణ బలానికి విరుద్ధంగా సాధారణ మానవ స్థితిని సూచిస్తుంది. ‘మిగతా’ అనే పదం ఆ పోలికను తెలుగులో స్పష్టం చేస్తుంది; ‘మనుషులు’ మూలంలోని సమూహార్థాన్ని సహజంగా అందిస్తుంది.
theological_decisions:
- issue: నְזִיר అనే అంకిత సంబంధ సాంకేతిక పదం
  choice: దేవునికి నాజీరు
  alternative: దేవునికి అంకితమైనవాడు
  rationale: సాధారణ వివరణాత్మక పదబంధం కంటే ‘నాజీరు’ అనే సాంకేతిక పదం ధర్మశాస్త్రంలోని సంస్థతోనూ సమ్సోను జనన కథనంతోనూ ఉన్న కానానిక సంబంధాన్ని నిలుపుతుంది. పాదసూచిక దాని అర్థాన్ని వివరిస్తుంది.
- issue: כְּכָל הָאָדָם లోని సాధారణ మానవ పోలిక
  choice: మిగతా మనుషులందరిలా
  alternative: ఏ ఇతర మనిషిలా
  rationale: ఈ పదబంధం సమ్సోనును సాధారణ మానవులతో పోలుస్తుంది. బహువచన సహజ తెలుగు రూపం హీబ్రూ సమూహార్థాన్ని నిలుపుతూ అనవసరంగా పోలికను ఒక్క పురుషునికే పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనప్పటికీ గౌరవప్రదమైన కథన శైలి. హీబ్రూ నుడికారాన్ని పదేపదే అనుకరించి అసహజత కలిగించకుండా, పూర్తి అంతరంగ వెల్లడనే భావాన్ని నిలుపుకుంది. సాంకేతికమైన ‘నాజీరు’ పదానికి పాదసూచిక ఇచ్చింది.
