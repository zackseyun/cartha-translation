  text: וְ/סַרְנֵ֣י פְלִשְׁתִּ֗ים נֶֽאֱסְפוּ֙ לִ/זְבֹּ֧חַ זֶֽבַח גָּד֛וֹל לְ/דָג֥וֹן אֱלֹהֵי/הֶ֖ם וּ/לְ/שִׂמְחָ֑ה וַ/יֹּ֣אמְר֔וּ נָתַ֤ן אֱלֹהֵ֨י/נוּ֙ בְּ/יָדֵ֔/נוּ אֵ֖ת שִׁמְשׁ֥וֹן אוֹיְבֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/023.yaml
  text: The rulers of the Philistines gathered to offer a great sacrifice to Dagon their god and to celebrate[a], and they said[b], “Our god has given Samson our enemy into our hand.”
translation:
  language: te
  text: ఫిలిష్తీయుల పాలకులు తమ దేవుడైన దాగోనుకు గొప్ప బలిని అర్పించడానికి, సంబరాలు చేసుకోవడానికి సమకూడారు. వారు, “మన దేవుడు మన శత్రువైన సమ్సోనును మన చేతికి అప్పగించాడు[a]” అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీయంలో, “మన చేతిలో”; అంటే మన అధికారానికి లేదా అదుపుకు అప్పగించాడు.
    reason: lexical_alternative
lexical_decisions:
- source_word: סַרְנֵי
  choice: పాలకులు
  rationale: ఫిలిష్తీయుల నగర-రాజ్యాల ప్రధాన అధికారులను సూచిస్తుంది. ‘పాలకులు’ ఆధునిక తెలుగులో వారి పరిపాలనా హోదాను స్పష్టంగా తెలియజేస్తుంది.
- source_word: נֶאֱסְפוּ
  choice: సమకూడారు
  rationale: ఒక సమూహంగా కూడివచ్చారనే నిఫ్అల్ రూప భావాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: לִזְבֹּחַ זֶבַח גָּדוֹל
  choice: గొప్ప బలి అర్పించి
  rationale: మూలంలోని క్రియ-నామ పునరుక్తిని తెలుగులో అసహజంగా పునరావృతం చేయకుండా, ఘనమైన బలి అర్పణ భావాన్ని నిలుపుతుంది.
- source_word: לְדָגוֹן אֱלֹהֵיהֶם
  choice: తమ దేవుడైన దాగోనుకు
  rationale: బలి స్వీకర్త దాగోను అని, అతడే వారి దేవుడని సహజమైన తెలుగు సంబంధ నిర్మాణంతో తెలియజేస్తుంది.
- source_word: וּלְשִׂמְחָה
  choice: సంబరాలు చేసుకోవడానికి
  rationale: ఈ విజయోత్సవ సందర్భంలో ఆనందం, వేడుక అనే ఉద్దేశాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: נָתַן ... בְּיָדֵנוּ
  choice: మన చేతికి అప్పగించాడు
  rationale: నియంత్రణలోకి అప్పగించడాన్ని తెలిపే హెబ్రీయ నుడికారంలోని ‘చేతి’ రూపకాన్ని తెలుగులోనూ అర్థమయ్యే విధంగా నిలుపుతుంది.
- source_word: אֵת שִׁמְשׁוֹן
  choice: సమ్సోనును
  rationale: వ్యక్తి పేరును ప్రామాణిక తెలుగు బైబిలు రూపానికి సమీపంగా లిప్యంతరీకరించి, వాక్యంలోని కర్మ విభక్తిని జోడిస్తుంది.
- source_word: אוֹיְבֵינוּ
  choice: మన శత్రువైన
  rationale: రూపపరంగా బహువచన ప్రత్యయం ఉన్నప్పటికీ సందర్భంలో సమ్సోను అనే ఏకవచన వ్యక్తినే సూచిస్తుంది; విశేషణ సంబంధ రూపం తెలుగులో సహజంగా ఉంటుంది.
theological_decisions:
- issue: అన్యదేవత సందర్భంలో אֱלֹהֵיהֶם / אֱלֹהֵינוּ అనువాదం
  choice: దేవుడు / మన దేవుడు
  alternative: దేవుళ్లు / మన దేవుళ్లు
  rationale: రెండు చోట్లా సమీప సందర్భం పేరుతో పేర్కొన్న దాగోను అనే ఒకే దేవతను సూచిస్తుంది. కాబట్టి మూల వాక్య నిర్మాణానికీ సందర్భానికీ ఏకవచనమే సరిపోతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే సహజమైన, గౌరవప్రదమైన కథన శైలి. మూలంలో లేని కాలసూచక ‘ఇప్పుడు’ చేర్చలేదు. హెబ్రీయ ‘మన చేతిలో’ అనే రూపకాన్ని ప్రధాన పాఠ్యంలో సహజ తెలుగు నుడికారమైన ‘మన చేతికి’గా ఉంచి, దాని అక్షరార్థాన్ని పాదటిప్పణిలో ఇచ్చాం.
