  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. ‘పడుకొని ఉన్నాడు’ నిద్రపోయాడని నిర్బంధించకుండా మూలంలోని భావవిస్తృతిని కాపాడుతుంది. నిర్మాణ పదాలకు సాధారణ పాఠకుడికి అర్థమయ్యే ‘ద్వారబంధాలు,’ ‘అడ్డగడియ’ అనే పదాలు ఎంచుకోబడ్డాయి.
