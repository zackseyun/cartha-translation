  text: וַ/יִּשְׁכַּ֣ב שִׁמְשׁוֹן֮ עַד חֲצִ֣י הַ/לַּיְלָה֒ וַ/יָּ֣קָם בַּ/חֲצִ֣י הַ/לַּ֗יְלָה וַ/יֶּאֱחֹ֞ז בְּ/דַלְת֤וֹת שַֽׁעַר הָ/עִיר֙ וּ/בִ/שְׁתֵּ֣י הַ/מְּזוּז֔וֹת וַ/יִּסָּעֵ/ם֙ עִֽם הַ/בְּרִ֔יחַ וַ/יָּ֖שֶׂם עַל כְּתֵפָ֑י/ו וַֽ/יַּעֲלֵ/ם֙ אֶל רֹ֣אשׁ הָ/הָ֔ר אֲשֶׁ֖ר עַל פְּנֵ֥י חֶבְרֽוֹן־׀־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/003.yaml
  text: And Samson lay until midnight[a]. Then he arose at midnight and seized the doors of the city gate and the two doorposts, and pulled them up with the bar[b]; he put them on his shoulders and carried them up to the top of the hill that is opposite Hebron.
translation:
  language: te
  text: సమ్సోను అర్ధరాత్రి వరకు పడుకొని ఉన్నాడు. అర్ధరాత్రి అతడు లేచి, పట్టణ ద్వారపు తలుపులను, రెండు ద్వారబంధాలను పట్టుకొని, అడ్డగడియతో సహా వాటిని పెకలించాడు[a]. వాటిని తన భుజాల మీద పెట్టుకొని, హెబ్రోనుకు ఎదురుగా ఉన్న[b] కొండ శిఖరానికి మోసుకొని వెళ్లాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘అడ్డగడియతో సహా వాటిని లాగి బయటికి తీశాడు.’ హీబ్రూ క్రియ వాటిని వాటి స్థానం నుంచి లాగి తీయడం లేదా పెకలించడం అనే భావాన్ని ఇవ్వగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘హెబ్రోను వైపు ముఖం చేసి ఉన్న.’ హీబ్రూ నుడికారం అక్షరార్థంగా ‘హెబ్రోను ముఖానికి ఎదురుగా’ అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: పడుకొని ఉన్నాడు
  rationale: שׁכב యొక్క ప్రాథమిక భావమైన ‘పడుకొని ఉండడం’ను సహజమైన తెలుగులో తెలియజేస్తుంది; అతడు నిద్రపోయాడని మూలంలో లేనిదాన్ని నిర్దిష్టంగా చెప్పదు.
- source_word: עַד חֲצִי הַלַּיְלָה / בַּחֲצִי הַלַּיְלָה
  choice: అర్ధరాత్రి వరకు / అర్ధరాత్రి
  rationale: ‘రాత్రి సగం’ అనే హీబ్రూ భావానికి ఆధునిక తెలుగులో సహజమైన కాలసూచన.
- source_word: וַיֶּאֱחֹז
  choice: పట్టుకొని
  rationale: బలంగా చేతబట్టిన చర్యను స్పష్టంగా, అతిశయోక్తి లేకుండా తెలుపుతుంది.
- source_word: דַּלְתוֹת שַׁעַר הָעִיר
  choice: పట్టణ ద్వారపు తలుపులు
  rationale: పట్టణ ప్రవేశద్వారంలోని జత తలుపులను సాధారణ పాఠకుడికి స్పష్టంగా తెలియజేస్తుంది.
- source_word: וּבִשְׁתֵּי הַמְּזוּזוֹת
  choice: రెండు ద్వారబంధాలు
  rationale: מְזוּזוֹת సూచించే ద్వారపు ఇరువైపుల నిలువు కమ్ములను తెలుగులో సంక్షిప్తంగా సూచిస్తుంది.
- source_word: וַיִּסָּעֵם עִם הַבְּרִיחַ
  choice: అడ్డగడియతో సహా వాటిని పెకలించాడు
  rationale: נסע ఇక్కడ వాటిని వాటి స్థానం నుంచి లాగి తొలగించడాన్ని సూచిస్తుంది; ‘పెకలించాడు’ ఆ బలప్రయోగాన్ని సహజంగా తెలియజేస్తుంది. עִם హీబ్రూ ప్రకారం అడ్డగడియ కూడా వాటితోపాటు తీసివేయబడింది.
- source_word: וַיָּשֶׂם עַל כְּתֵפָיו
  choice: తన భుజాల మీద పెట్టుకొని
  rationale: మూలంలోని శరీరచర్యను నేరుగా, సహజంగా అందిస్తుంది.
- source_word: וַיַּעֲלֵם
  choice: మోసుకొని వెళ్లాడు
  rationale: ముందటి వాక్యంలో భుజాల మీద పెట్టుకున్నందున, పైకి తీసుకెళ్లిన విధానాన్ని సందర్భానుగుణంగా స్పష్టం చేస్తుంది.
- source_word: אֶל רֹאשׁ הָהָר
  choice: కొండ శిఖరానికి
  rationale: ‘కొండ తల/పైభాగం’ అనే హీబ్రూ పదబంధానికి సహజమైన, గౌరవప్రదమైన తెలుగు సమానం.
- source_word: אֲשֶׁר עַל פְּנֵי חֶבְרוֹן
  choice: హెబ్రోనుకు ఎదురుగా ఉన్న
  rationale: עַל־פְּנֵי అనే భౌగోళిక సంబంధాన్ని ‘ఎదురుగా’ అని అందిస్తూ, ఖచ్చితమైన దిశ లేదా దూరాన్ని అనవసరంగా నిర్ణయించదు.
