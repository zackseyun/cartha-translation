source:
  edition: WLC
  text: וַ/תִּקַּ֣ח דְּלִילָה֩ עֲבֹתִ֨ים חֲדָשִׁ֜ים וַ/תַּאַסְרֵ֣/הוּ בָ/הֶ֗ם וַ/תֹּ֤אמֶר אֵלָי/ו֙ פְּלִשְׁתִּ֤ים עָלֶ֨י/ךָ֙ שִׁמְשׁ֔וֹן וְ/הָ/אֹרֵ֖ב יֹשֵׁ֣ב בֶּ/חָ֑דֶר וַֽ/יְנַתְּקֵ֛/ם מֵ/עַ֥ל זְרֹעֹתָ֖י/ו כַּ/חֽוּט׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/012.yaml
  text: Then Delilah took new ropes and bound him with them[a], and said to him, “The Philistines are upon you, Samson!” Now the ambush was sitting in the inner room[c][b], but he snapped them from off his arms like a thread.
translation:
  language: te
  text: అప్పుడు దెలీలా కొత్త తాళ్లు తీసుకొని, వాటితో అతణ్ణి బంధించింది.[a] ఆమె అతనితో, “సమ్సోనూ, ఫిలిష్తీయులు నీ మీదికి వచ్చారు!” అంది. మాటువేసి ఉన్నవాడు లోపలి గదిలో కూర్చొని ఉన్నాడు.[b][c] అయితే అతడు తన బాహువుల మీదినుండి ఆ తాళ్లను దారంలా తెంచివేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘తాళ్లు’ అనే పదాన్ని ‘త్రాళ్లు’ లేదా ‘కట్టే తాళ్లు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “మాటువేసినవారు లోపలి గదిలో వేచి ఉన్నారు.” హెబ్రీలో మాటువేసి ఉన్న వ్యక్తిని సూచించే కృదంతం ఏకవచనంలో ఉంది; అది ఒక వ్యక్తిని లేదా మాటువేసినవారి సమూహాన్ని సమష్టిగా సూచించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: ‘లోపలి గది’ అనే మాటను ‘అంతర్గది’ లేదా ‘గది’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲבֹתִים
  choice: తాళ్లు
  rationale: ఈ పదం సన్నని దారాలను కాక, కట్టడానికి ఉపయోగించే మందమైన తాళ్లను సూచిస్తుంది; చివరలోని ‘దారంలా’ అనే పోలికతోనూ స్పష్టమైన వ్యత్యాసం ఏర్పడుతుంది.
- source_word: חֲדָשִׁים
  choice: కొత్త
  rationale: సాధారణ విశేషణార్థాన్ని నేరుగా తెలియజేస్తూ, ఈ తాళ్లు ముందుగా ఉపయోగించి బలహీనపరచబడనివని కథనంలో సూచిస్తుంది.
- source_word: וַתַּאַסְרֵהוּ
  choice: అతణ్ణి బంధించింది
  rationale: אסר క్రియలోని కట్టివేయడం అనే భావాన్ని గౌరవప్రదమైన కథన శైలిలో నేరుగా వ్యక్తం చేస్తుంది.
- source_word: פְּלִשְׁתִּים עָלֶיךָ
  choice: ఫిలిష్తీయులు నీ మీదికి వచ్చారు
  rationale: హెబ్రీ అత్యవసర హెచ్చరికలోని సమీప ప్రమాద భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: וְהָאֹרֵב
  choice: మాటువేసినవాడు
  rationale: హెబ్రీలో ఏకవచన కృదంతం ఉన్నందున, దానిని సామూహిక ‘మాటుదండు’గా మార్చకుండా వ్యక్తిగత ఏకవచన అస్పష్టతను నిలిపింది.
- source_word: יֹשֵׁב
  choice: కూర్చొని ఉన్నాడు
  rationale: కృదంతంలోని ప్రత్యక్ష ‘కూర్చోవడం/ఉండడం’ చిత్రాన్ని నిలుపుతుంది; సందర్భంలో అతడు దాగి వేచి ఉన్నాడనే భావం సహజంగా తెలుస్తుంది.
- source_word: בֶּחָדֶר
  choice: లోపలి గదిలో
  rationale: חֶדֶר ఒక అంతర్గత లేదా ఏకాంత గదిని సూచించగలదు; దాగి ఉండటానికి అనుకూలమైన స్థలభావాన్ని తెలుగులో సహజంగా అందిస్తుంది.
- source_word: וַיְנַתְּקֵם
  choice: తెంచివేశాడు
  rationale: బలంగా విడదీయడం లేదా తెంపడం అనే క్రియార్థాన్ని, దారంతో చేసిన పోలికకు సరిపోయే రీతిలో వ్యక్తం చేస్తుంది.
- source_word: מֵעַל זְרֹעֹתָיו
  choice: తన చేతుల మీదినుండి
  rationale: హెబ్రీ పదబంధంలోని స్థలసంబంధ భావాన్ని నిలుపుతుంది; ‘זרועות’కు సందర్భానుకూలంగా సాధారణ తెలుగు ‘చేతులు’ వాడబడింది.
- source_word: כַּחוּט
  choice: దారంలా
  rationale: חוּטలోని సన్నని దారం అనే స్పష్టమైన చిత్రాన్ని సంక్షిప్తంగా, సహజంగా అందిస్తుంది.
