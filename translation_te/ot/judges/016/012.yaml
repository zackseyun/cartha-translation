translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. హెబ్రీలోని ఏకవచన ‘మాటువేసినవాడు’ ప్రధాన పాఠ్యంలో నిలుపబడింది; సామూహిక అర్థసాధ్యతను పాదటిప్పణిలో ఇచ్చాం. అన్ని పాదటిప్పణి గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
