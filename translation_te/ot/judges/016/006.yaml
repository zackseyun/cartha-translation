  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/תֹּ֤אמֶר דְּלִילָה֙ אֶל שִׁמְשׁ֔וֹן הַגִּֽידָ/ה נָּ֣א לִ֔/י בַּ/מֶּ֖ה כֹּחֲ/ךָ֣ גָד֑וֹל וּ/בַ/מֶּ֥ה תֵאָסֵ֖ר לְ/עַנּוֹתֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/006.yaml
  text: Then Delilah said to Samson[a], “Please tell me where your great strength lies, and how you could be bound to afflict you.”
translation:
  language: te
  text: అప్పుడు దెలీలా సమ్సోనుతో, “నీ గొప్ప బలం దేనిలో ఉందో, నిన్ను లొంగదీయడానికి నిన్ను ఎలా బంధించవచ్చో దయచేసి నాకు చెప్పు” అంది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నిన్ను బాధించడానికి నిన్ను ఎలా బంధించవచ్చో.” ఇక్కడి హీబ్రూ క్రియకు “బాధించు,” “అణచివేయి,” లేదా ఈ సందర్భంలో “లొంగదీయి/జయించు” అనే అర్థాలు రావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: అప్పుడు ... అంది
  rationale: వావ్-కన్సిక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది; ఆధునిక తెలుగు కథనశైలిలో ‘అప్పుడు’ క్రమాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: דְּלִילָה אֶל שִׁמְשׁוֹן
  choice: దెలీలా సమ్సోనుతో
  rationale: వ్యక్తుల పేర్లను తెలుగు ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించి, మాట చెప్పబడిన వ్యక్తిని ‘తో’ విభక్తితో సహజంగా వ్యక్తం చేసింది.
- source_word: הַגִּידָה נָּא לִי
  choice: దయచేసి నాకు చెప్పు
  rationale: הגיד అంటే ‘చెప్పు/తెలియజేయి’; נא లోని అభ్యర్థన భావాన్ని ‘దయచేసి’ నిలుపుతుంది.
- source_word: בַּמֶּה כֹּחֲךָ גָדוֹל
  choice: నీ గొప్ప బలం దేనిలో ఉందో
  rationale: బలం యొక్క ఆధారం లేదా రహస్యాన్ని అడిగే ‘దేనిలో’ అనే మూలభాష భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: וּבַמֶּה תֵאָסֵר
  choice: నిన్ను ఎలా బంధించవచ్చో
  rationale: אסר నిఫాల్ రూపం ‘బంధింపబడడం’ అనే అర్థం ఇస్తుంది; ప్రశ్నలో సాధనం లేదా విధానాన్ని ‘ఎలా’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לְעַנּוֹתֶךָ
  choice: నిన్ను లొంగదీయడానికి
  rationale: ענה పియేల్‌కు ‘బాధించు, అణచు, అవమానపరచు’ అనే అర్థవిస్తృతి ఉంది; ఈ సందర్భంలో సమ్సోనును అదుపులోకి తెచ్చి జయించడం ప్రధాన భావం. ప్రత్యామ్నాయ అర్థాన్ని పాదసూచికలో తెలిపింది.
