  text: Samson went to Gaza[a], and there he saw a prostitute, and he went in to her.
translation:
  language: te
  text: సమ్సోను గాజాకు వెళ్లాడు. అక్కడ అతడు ఒక వేశ్యను చూసి, ఆమె వద్దకు వెళ్లాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆమెతో లైంగిక సంబంధం పెట్టుకున్నాడు.’ హెబ్రీలో అక్షరాలా, ‘ఆమె వద్దకు వెళ్లాడు’ అని ఉంది; ఈ సందర్భంలో అది లైంగిక సంబంధాన్ని సూచించే సాధారణ సభ్యోక్తి.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: వెళ్లాడు
  rationale: కథన క్రమంలో הלך సాధారణ గమనాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘వెళ్లాడు’ సహజమైన, అదనపు భావం చేర్చని అనువాదం.
- source_word: שִׁמְשׁוֹן
  choice: సమ్సోను
  rationale: హెబ్రీ వ్యక్తినామాన్ని తెలుగులో స్థిరపడిన బైబిలు రూపానికి దగ్గరగా లిప్యంతరీకరించాం.
- source_word: עַזָּתָה
  choice: గాజాకు
  rationale: స్థలనామానికి జతైన దిశాసూచక ה నగరం వైపు గమనాన్ని తెలియజేస్తుంది; తెలుగులో విభక్తి ప్రత్యయం ‘కు’ దీనిని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וַיַּרְא שָׁם
  choice: అక్కడ అతడు … చూసి
  rationale: שָׁם అంటే ‘అక్కడ’; వరుసగా జరిగిన చర్యలను సహజ తెలుగు కథనశైలిలో కలిపేందుకు ‘చూసి’ వాడాం.
- source_word: אִשָּׁה זוֹנָה
  choice: ఒక వేశ్యను
  rationale: זוֹנָה ఇక్కడ వ్యభిచార వృత్తిలో ఉన్న స్త్రీని సూచిస్తుంది. ‘వేశ్య’ ఆధునిక ప్రామాణిక తెలుగులో స్పష్టమైన, సంక్షిప్త పదం; ‘వ్యభిచారిణి’ కంటే వృత్తిసంబంధ భావాన్ని మెరుగ్గా నిలుపుతుంది.
- source_word: וַיָּבֹא אֵלֶיהָ
  choice: ఆమె దగ్గరికి వెళ్లాడు
  rationale: ఈ సందర్భంలో בוא אל లైంగిక సంబంధానికి సభ్యోక్తిగా పనిచేస్తుంది. ప్రధాన పాఠంలో హెబ్రీ వ్యక్తీకరణలోని పరోక్షతను నిలుపుతూ, అర్థాన్ని పాదసూచికలో స్పష్టం చేశాం.
theological_decisions:
- issue: וַיָּבֹא אֵלֶיהָ లోని లైంగిక భావాన్ని ప్రధాన పాఠంలో పూర్తిగా స్పష్టం చేయాలా, లేక హెబ్రీ సభ్యోక్తిని నిలుపాలా?
  choice: ‘ఆమె దగ్గరికి వెళ్లాడు’ అని సభ్యోక్తిని నిలిపి, పాదసూచికలో లైంగిక భావాన్ని వివరించడం
  alternative: ‘ఆమెతో లైంగిక సంబంధం పెట్టుకున్నాడు’ లేదా ‘ఆమెతో పడుకున్నాడు’
  rationale: సందర్భం లైంగిక సంబంధాన్ని బలంగా సూచించినా, హెబ్రీ ప్రత్యక్ష లైంగిక క్రియాపదం కాక సంప్రదాయ సభ్యోక్తిని వాడుతుంది. ప్రధాన పాఠంలో దాని పరోక్షతను నిలపడం మూలంలోని భావస్థాయిని అనవసరంగా తీవ్రం చేయకుండా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథనశైలిని ఉపయోగించాం. ‘ఆమె యొద్దకు పోయెను’ వంటి ప్రాచీన రూపాలను నివారించాం. పాదసూచిక గుర్తును అది వివరించే చివరి పదబంధం వద్ద ఉంచాం.
