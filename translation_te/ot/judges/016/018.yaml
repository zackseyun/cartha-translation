  text: וַ/תֵּ֣רֶא דְלִילָ֗ה כִּֽי הִגִּ֣יד לָ/הּ֮ אֶת כָּל לִבּ/וֹ֒ וַ/תִּשְׁלַ֡ח וַ/תִּקְרָא֩ לְ/סַרְנֵ֨י פְלִשְׁתִּ֤ים לֵ/אמֹר֙ עֲל֣וּ הַ/פַּ֔עַם כִּֽי הִגִּ֥יד ל/ה אֶת כָּל לִבּ֑/וֹ וְ/עָל֤וּ אֵלֶ֨י/הָ֙ סַרְנֵ֣י פְלִשְׁתִּ֔ים וַ/יַּעֲל֥וּ הַ/כֶּ֖סֶף בְּ/יָדָֽ/ם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/018.yaml
  text: When Delilah saw that he had told her all his heart[a], she sent and called for the Philistine rulers, saying, “Come up this time[c][b], for he has told her all his heart.” Then the Philistine rulers came up to her and brought the silver in their hands.
translation:
  language: te
  text: దెలీలా అతడు తన హృదయంలో ఉన్నదంతా తనకు చెప్పాడని గ్రహించి, ఫిలిష్తీయుల పాలకులకు కబురు పంపి వారిని పిలిపించి, “ఈసారి రండి; అతడు తన హృదయంలో ఉన్నదంతా ఆమెకు చెప్పాడు[a]” అని చెప్పింది. అప్పుడు ఫిలిష్తీయుల పాలకులు[b] తమ చేతుల్లో వెండిని[c] తీసుకొని ఆమె దగ్గరికి వచ్చారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీయ పాఠంలో ఇక్కడ “ఆమెకు” అని ఉంది. ప్రత్యక్ష సంభాషణలో “నాకు” అని ఉండాలని కొందరికి అనిపించవచ్చు; అయితే స్వీకృత హెబ్రీయ పాఠం మూడవ పురుష స్త్రీలింగ ఏకవచన రూపాన్నే కలిగి ఉంది.
    reason: textual_variant
  - marker: b
    text: లేదా “ఫిలిష్తీయుల అధిపతులు.”
    reason: lexical_alternative
  - marker: c
    text: అంటే, చెల్లింపుగా ఇవ్వవలసిన వెండి.
    reason: cultural_note
lexical_decisions:
- source_word: וַתֵּרֶא
  choice: గ్రహించి
  rationale: ראה యొక్క ప్రాథమిక భావం ‘చూచుట’ అయినా, ఇక్కడ దెలీలా అతడు నిజమంతా చెప్పాడని గుర్తించిన భావం సందర్భంలో ప్రధానంగా ఉంది; సహజమైన ఆధునిక తెలుగులో ‘గ్రహించి’ దాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: כִּי
  choice: అని
  rationale: ‘గ్రహించి’ అనే క్రియ తరువాత దెలీలా గ్రహించిన విషయాన్ని పరిచయం చేస్తుంది.
- source_word: הִגִּיד
  choice: చెప్పాడు
  rationale: హిఫిల్ రూపంలోని נגד ఇక్కడ ‘తెలియజేశాడు/చెప్పాడు’ అనే సాధారణ భావంలో ఉంది; ‘చెప్పాడు’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: אֶת כָּל לִבּוֹ
  choice: తన హృదయంలో ఉన్నదంతా
  rationale: హెబ్రీయ ‘అతని హృదయమంతా’ అనే నుడికారానికి తెలుగులో సహజమైన సమానార్థక రూపం; అతడు ఏదీ దాచకుండా పూర్తిగా వెల్లడించాడనే భావాన్ని నిలుపుతుంది.
- source_word: וַתִּשְׁלַח וַתִּקְרָא
  choice: కబురు పంపి వారిని పిలిపించి
  rationale: రెండు హెబ్రీయ క్రియల క్రమాన్ని నిలుపుతూ, దూత ద్వారా పిలిపించిన భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: סַרְנֵי פְלִשְׁתִּים
  choice: ఫిలిష్తీయుల పాలకులు
  rationale: סרן ఫిలిష్తీయుల ఉన్నత అధికారులను సూచిస్తుంది; ‘పాలకులు’ ఆధునిక పాఠకులకు స్పష్టమైన పదం.
- source_word: עֲלוּ הַפַּעַם
  choice: ఈసారి రండి
  rationale: הַפַּעַם యొక్క ‘ఈసారి’ భావాన్ని నిలుపుతుంది; עלה సూచించే పైకి రావడం తెలుగులో సందర్భానుసారంగా సహజమైన ‘రండి’గా ఇవ్వబడింది.
- source_word: כִּי הִגִּיד לָהּ אֶת כָּל לִבּוֹ
  choice: అతడు తన హృదయంలో ఉన్నదంతా ఆమెకు చెప్పాడు
  rationale: ప్రత్యక్ష సంభాషణలో ‘నాకు’ సహజంగా అనిపించినా, ప్రామాణిక మసొరెటిక్ పాఠంలోని మూడవ పురుష స్త్రీలింగ ఏకవచన సర్వనామమైన ‘ఆమెకు’ను మార్చకుండా నిలుపుతుంది.
- source_word: וְעָלוּ אֵלֶיהָ
  choice: ఆమె దగ్గరికి వచ్చారు
  rationale: దెలీలా ఉన్న చోటికి వారి గమనాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: וַיַּעֲלוּ הַכֶּסֶף בְּיָדָם
  choice: వెండిని తమ చేతుల్లో తీసుకొని
  rationale: వారు చెల్లింపుగా ఇవ్వవలసిన వెండిని వెంట తీసుకొచ్చారనే భావాన్ని, ‘వెండి’ అనే మూలపదార్థ సూచనను నిలుపుతూ వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ప్రత్యక్ష సంభాషణలో לָהּ అనే సర్వనామం
  choice: ఆమెకు
  alternative: నాకు
  rationale: ప్రత్యక్ష వాక్యంలో ‘నాకు’ సందర్భపరంగా సహజమైనప్పటికీ, స్వీకృత హెబ్రీయ పాఠం మూడవ పురుష స్త్రీలింగ ఏకవచనాన్ని కలిగి ఉంది. పాఠంలోని నిజమైన ఉద్వేగాన్ని సవరణతో తొలగించకుండా ప్రధాన పాఠంలో నిలిపి, పాదటిప్పణిలో వివరించబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. హెబ్రీయ నుడికారాన్ని పదక్షరంగా అసహజం చేయకుండా ‘తన హృదయంలో ఉన్నదంతా’గా ఇచ్చాం. లింగం/పురుషానికి సంబంధించిన మూలపాఠ ఉద్వేగాన్ని ప్రధాన పాఠంలోనే నిలిపాం; అన్ని పాదటిప్పణి గుర్తులు [a], [b], [c] ప్రధాన వచనంలో ఉన్నాయి.
