  to: 'అప్పుడు సమ్సోను తన చెయ్యి పట్టుకొని ఉన్న యువకునితో ఇలా అన్నాడు: “నన్ను స్తంభాలను తడిమేందుకు అనుమతించు; ఈ భవనం వాటిమీద నిలిచి ఉంది కాబట్టి, నేను వాటికి ఆనుకుంటాను.”'
  rationale: 'మూలవాక్యంలోని రెండు అభ్యర్థనలను స్పర్శ-సందర్భానికి అనుగుణంగా సవరించాం: యువకుడు సమ్సోను చేతిని పట్టుకొని ఉన్నాడు; సమ్సోను స్తంభాలను తడిమి వాటికి ఆనుకోవాలనుకుంటున్నాడు. ఇంగ్లీషు ఆడిట్‌లోని ‘rest’ మరియు ‘guide’ నిర్ణయాలకన్నా హీబ్రూ పాఠానికే ప్రాధాన్యం ఇచ్చాం. పాఠభేదంపై ప్రత్యేక పాదటిప్పణి అవసరమయ్యేంత స్పష్టమైన ప్రత్యామ్నాయ పాఠం ఇక్కడ లేదు; అసాధారణ క్రియారూపాన్ని సందర్భానుగుణంగా, అతిశయ వ్యాఖ్యానం లేకుండా అనువదించాం.'
