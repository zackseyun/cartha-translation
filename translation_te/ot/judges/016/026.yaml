  - severity: high
    issue: ‘స్తంభాల దగ్గరికి నన్ను నడిపించు’ అనే అనువాదం
    rationale: וַהֲמִישֵׁנִי అసాధారణ రూపమైనప్పటికీ, ఈ సందర్భంలో స్తంభాలను తడిమేలా/స్పృశించేలా చేయమనే భావమే బలమైనది. ‘నడిపించు’ మూలంలోని స్పర్శను తొలగిస్తుంది.
