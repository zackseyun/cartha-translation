  yaml_path: translation/ot/judges/016/026.yaml
  text: Then Samson said to the young man who was holding his hand, “Let me rest, and guide me to the pillars on which the house stands, so that I may lean against them.”
translation:
  language: te
  text: 'అప్పుడు సమ్సోను తన చెయ్యి పట్టుకొని ఉన్న యువకునితో ఇలా అన్నాడు: “నన్ను స్తంభాలను తడిమేందుకు అనుమతించు; ఈ భవనం వాటిమీద నిలిచి ఉంది కాబట్టి, నేను వాటికి ఆనుకుంటాను.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַנַּעַר
  choice: బాలుడు
  rationale: ఈ పదం బాలుడు లేదా యువకుడు అనే అర్థం ఇవ్వగలదు; సందర్భంలోని సహాయకుడిని సహజంగా సూచించడానికి ‘బాలుడు’ ఎంచుకున్నాం.
- source_word: הַנִּיחָה אוֹתִי
  choice: నేను కాస్త విశ్రాంతి తీసుకునేలా నన్ను విడిచిపెట్టు
  rationale: הניח అనే క్రియకు ‘విడిచిపెట్టు/విశ్రాంతి పొందనివ్వు’ అనే భావాలు ఉన్నాయి. సందర్భానికి తగినట్లుగా రెండింటి భావాన్ని సహజమైన తెలుగులో నిలిపాం.
- source_word: ו/הימש/ני
  choice: నన్ను నడిపించు
  rationale: మసొరేటిక్ పాఠంలోని రూపం అసాధారణమైనదైనా, సందర్భం మరియు సంప్రదాయ పఠనం స్తంభాల దగ్గరికి మార్గనిర్దేశం చేయమనే భావాన్ని సూచిస్తున్నాయి.
- source_word: נָכוֹן עֲלֵיהֶם
  choice: వాటిమీద నిలిచి ఉన్న
  rationale: ఇల్లు/మందిరం ఆ స్తంభాలపై స్థిరంగా నిలిచి ఉందనే నిర్మాణాత్మక భావాన్ని నేరుగా వ్యక్తం చేస్తుంది.
- source_word: וְאֶשָּׁעֵן עֲלֵיהֶם
  choice: నేను వాటికి ఆనుకుంటాను
  rationale: సమ్సోను చెప్పిన ఉద్దేశాన్ని సరళంగా, మూలంలోని ప్రథమ పురుష భావంతో అనువదించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కథనానికి తగిన గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన శైలి. మూలంలోని ‘ఇల్లు’ భావాన్ని సందర్భానుసారంగా ‘మందిరం’గా ఇచ్చాం; ఇది దేవాలయాన్ని తప్పనిసరిగా సూచించకుండా సమావేశ భవనాన్ని సూచిస్తుంది.
