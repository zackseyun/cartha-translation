source:
  edition: WLC
  text: וַ/תֹּ֕אמֶר פְּלִשְׁתִּ֥ים עָלֶ֖י/ךָ שִׁמְשׁ֑וֹן וַ/יִּקַ֣ץ מִ/שְּׁנָת֗/וֹ וַ/יֹּ֨אמֶר֙ אֵצֵ֞א כְּ/פַ֤עַם בְּ/פַ֨עַם֙ וְ/אִנָּעֵ֔ר וְ/הוּא֙ לֹ֣א יָדַ֔ע כִּ֥י יְהוָ֖ה סָ֥ר מֵ/עָלָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/020.yaml
  text: And she said[a], “The Philistines are upon you, Samson!” And he awoke from his sleep and said, “I will go out as at other times and shake myself free.” But he did not know that Yahweh had departed from him.
translation:
  language: te
  text: అప్పుడు ఆమె, “సమ్సోనూ, ఫిలిష్తీయులు నీ మీదికి వచ్చారు!” అంది. అతడు తన నిద్రనుంచి మేల్కొని, “మునుపటిలాగే బయటికి వెళ్లి నన్ను నేను విదిలించుకుంటాను[a]” అన్నాడు. అయితే యాహ్వే అతనిని విడిచిపోయాడని అతనికి తెలియదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నన్ను నేను విదిలించుకుంటాను”; మునుపటి సందర్భాల్లోలాగే తనను తాను విడిపించుకోవడం అనే భావం ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּלִשְׁתִּים עָלֶיךָ
  choice: ఫిలిష్తీయులు నీ మీదికి వచ్చారు
  rationale: శత్రుత్వ సందర్భంలోని עַל సమీపిస్తున్న దాడి లేదా పట్టుకోవడాన్ని సూచిస్తుంది. తెలుగు సహజత్వంతో పాటు ఆ హెచ్చరికలోని తక్షణతను ఈ రూపం నిలుపుతుంది.
- source_word: וַיִּקַץ מִשְּׁנָתוֹ
  choice: అతడు నిద్రనుంచి మేల్కొని
  rationale: יקץ క్రియను, దానికి తోడైన מִשְּׁנָתוֹ పదబంధాన్ని నేరుగా, ఆధునిక ప్రామాణిక తెలుగులో అందిస్తుంది.
- source_word: אֵצֵא
  choice: బయటికి వెళ్లి
  rationale: יצא యొక్క సాధారణ అర్థం ‘బయటికి వెళ్లడం.’ దాడిచేసేవారిని ఎదుర్కోవడం భావంలో ఉండవచ్చుగానీ, మూలపాఠం దానిని స్పష్టంగా చెప్పనందున అదనపు వివరణ చేర్చలేదు.
- source_word: כְּפַעַם בְּפַעַם
  choice: ఎప్పటిలాగే
  rationale: గతంలో పదేపదే జరిగిన సందర్భాల మాదిరిగానే ఇప్పుడు కూడా జరుగుతుందని సమ్సోను భావించినట్లు ఈ హీబ్రూ నుడికారం సూచిస్తుంది.
- source_word: וְאִנָּעֵר
  choice: నన్ను నేను విడిపించుకుంటాను
  rationale: נער నిఫాల్ రూపం తనను తాను విదిలించుకొని బంధం లేదా పట్టునుంచి బయటపడే భావాన్ని ఇక్కడ ఇస్తుంది. ప్రధాన పాఠంలో సహజమైన తెలుగు కోసం ఫలితార్థాన్ని ఉపయోగించి, అక్షరార్థ ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన రూపంతో దైవనామాన్ని బిరుదుగా మార్చకుండా వ్యక్తిగత నామంగానే ఉంచుతుంది.
- source_word: סָר מֵעָלָיו
  choice: తనను విడిచిపోయాడు
  rationale: סור מן/מעל తెలిపే తొలగిపోవడం లేదా దూరమవడం అనే భావాన్ని గంభీరంగా, సహజంగా వ్యక్తం చేస్తుంది; ఆ విరమణ స్వభావం లేదా శాశ్వతత్వం గురించి మూలపాఠానికి మించిన వివరణ ఇవ్వదు.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలపాఠంలోని చతురక్షర దైవనామాన్ని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా పేరుగానే ఉంచాం. ఆధునిక తెలుగు పాఠకులకు విస్తృతంగా పరిచితమైన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం.
- issue: యెహోవా సమ్సోనును విడిచిపోవడం యొక్క స్వభావం
  choice: యెహోవా తనను విడిచిపోయాడని
  alternative: యెహోవా ఇచ్చిన శక్తి అతనినుంచి తొలగిపోయిందని
  rationale: వాక్యం దేవుని విరమణను మాత్రమే స్పష్టంగా చెబుతుంది; అది కేవలం శక్తినిచ్చే సన్నిధి, నిబంధన అనుగ్రహం లేదా మరేదైనా అని నిర్వచించదు. అందువల్ల మూలంలోని వేదాంతపరమైన ఉద్రిక్తతను అలాగే నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలిని ఉపయోగించాం. సమ్సోను మాటలోని అతివిశ్వాసం, చివరి వాక్యంలోని గంభీరమైన నాటకీయ వ్యత్యాసం నిలిచేలా సంక్షిప్త నిర్మాణాన్ని పాటించాం.
