  text: לַֽ/עַזָּתִ֣ים לֵ/אמֹ֗ר בָּ֤א שִׁמְשׁוֹן֙ הֵ֔נָּה וַ/יָּסֹ֛בּוּ וַ/יֶּאֶרְבוּ ל֥/וֹ כָל הַ/לַּ֖יְלָה בְּ/שַׁ֣עַר הָ/עִ֑יר וַ/יִּתְחָרְשׁ֤וּ כָל הַ/לַּ֨יְלָה֙ לֵ/אמֹ֔ר עַד א֥וֹר הַ/בֹּ֖קֶר וַ/הֲרְגְנֻֽ/הוּ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/002.yaml
  text: The Gazites were told[a], saying, “Samson has come here.” So they surrounded him and lay in wait for him all night at the city gate. They kept quiet all night, saying, “Until the light of morning[c][b], then we will kill him.”
translation:
  language: te
  text: గాజా ప్రజలకు[a], “సమ్సోను ఇక్కడికి వచ్చాడు” అనే వార్త అందింది. అప్పుడు వారు చుట్టుముట్టి, పట్టణ ద్వారం దగ్గర రాత్రంతా అతని కోసం మాటు వేశారు. “ఉదయపు వెలుగు వచ్చేవరకు[c] నిశ్శబ్దంగా ఉండి, అప్పుడు అతణ్ణి చంపుదాం” అనుకొని, రాత్రంతా చప్పుడు చేయకుండా ఉన్నారు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “గాజావాసులకు.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “రాత్రంతా మౌనంగా ఉన్నారు.” హీబ్రూ పదం మాటువేసి రహస్యంగా, నిశ్శబ్దంగా ఉండడాన్ని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: అక్షరార్థంగా, “ఉదయపు వెలుగు వరకు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לַעַזָּתִים
  choice: గాజా ప్రజలకు
  rationale: ఇది గాజా నివాసులను సూచించే బహువచన స్థానిక నామం. ఆధునిక తెలుగులో ‘గాజా ప్రజలు’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: לֵאמֹר
  choice: అనే వార్త అందింది
  rationale: హీబ్రూలో స్పష్టమైన ప్రధాన క్రియ లేకుండా ‘చెప్పుతూ’ అనే నిర్మాణం ఉంది. సందర్భంలో గాజా ప్రజలకు సమాచారం చేరిందనే భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בָּא ... הֵנָּה
  choice: ఇక్కడికి వచ్చాడు
  rationale: సమ్సోను అక్కడికి వచ్చి ఉన్నాడనే అప్పటి ప్రస్తుత సమాచారాన్ని సరళంగా తెలియజేస్తుంది.
- source_word: וַיָּסֹבּוּ
  choice: వారు చుట్టుముట్టి
  rationale: క్రియకు హీబ్రూ పాఠ్యంలో స్పష్టమైన కర్మ లేదు. ఎవరిని లేదా ఏ ప్రదేశాన్ని చుట్టుముట్టారో జోడించకుండా మూలంలోని సంక్షిప్తతను నిలుపుతుంది.
- source_word: וַיֶּאֶרְבוּ לוֹ
  choice: అతని కోసం మాటు వేశారు
  rationale: హాని చేయాలనే ఉద్దేశంతో దాగి వేచి ఉండడాన్ని తెలుగులో సహజంగా వ్యక్తం చేసే నుడికారం.
- source_word: בְּשַׁעַר הָעִיר
  choice: పట్టణ ద్వారం దగ్గర
  rationale: పట్టణంలోకి రాకపోకలు జరిగే ద్వార ప్రాంతాన్ని ఆధునిక తెలుగులో స్పష్టంగా సూచిస్తుంది.
- source_word: וַיִּתְחָרְשׁוּ
  choice: చప్పుడు చేయకుండా ఉన్నారు
  rationale: మాటువేసిన సందర్భంలో నిశ్శబ్దంగా, కదలిక తెలియకుండా ఉండడాన్ని సూచిస్తుంది; ‘నిశ్శబ్దంగా ఉండి’ అనే మాటలు వారి నిర్ణయాన్ని కూడా సహజంగా వ్యక్తం చేస్తాయి.
- source_word: עַד אוֹר הַבֹּקֶר
  choice: ఉదయపు వెలుగు వచ్చేవరకు
  rationale: ‘ఉదయపు వెలుగు వరకు’ అనే మూలచిత్రాన్ని కాపాడుతూ తెలుగులో సహజంగా ఉంటుంది.
- source_word: וַהֲרְגְנֻהוּ
  choice: అప్పుడు అతణ్ణి చంపుదాం
  rationale: మొదటి పురుష బహువచన సంకల్పాన్ని, ఉదయం వరకు వేచి ఉన్న తర్వాత చేయబోయే చర్యగా సహజ తెలుగులో తెలియజేస్తుంది.
