translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కథనానికి తగిన గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన శైలి. హీబ్రూలో וַיָּסֹבּוּకు కర్మ స్పష్టంగా లేకపోవడంతో అనువాదంలోనూ దానిని నిర్దిష్టం చేయలేదు. మూలంలోని ఉదయపు వెలుగు చిత్రాన్ని నిలిపి ఉంచాం.
