  text: But the hair of his head began to grow again after it had been shaved[a][b].
translation:
  language: te
  text: అయితే అతని తల వెంట్రుకలు గొరగబడిన తరువాత మళ్లీ పెరగడం మొదలయ్యాయి.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పెరగడం మొదలయ్యాయి.” హీబ్రూ క్రియలో “మళ్లీ” అనే భావం ప్రత్యక్షంగా లేదు; ముందుగా వెంట్రుకలు గొరగబడిన సందర్భం వల్ల ఆ భావం వస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “గొరగబడినప్పుడు,” లేదా “అతడు గొరగబడిన తరువాత.” కాలాన్ని తెలిపే ఉపవాక్యాన్ని, దాని అంతర్లీన కర్తను కొద్దిగా భిన్నంగా వ్యక్తం చేయడానికి హీబ్రూ వీలు కల్పిస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּחֶל
  choice: మొదలయ్యాయి
  rationale: ఈ క్రియకు ‘మొదలగు’ అనే అర్థం ఉంది. తెలుగులో ‘పెరగడం మొదలయ్యాయి’ అనేది తరువాతి క్రియతో సహజంగా సరిపోతుంది.
- source_word: שְׂעַר רֹאשׁוֹ
  choice: అతని తలవెంట్రుకలు
  rationale: ‘అతని తల వెంట్రుకలు’ అనే హీబ్రూ నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగు పదంతో అందిస్తూ, సందర్భంలో ప్రాముఖ్యమైన తలవెంట్రుకలను స్పష్టంగా సూచిస్తుంది.
- source_word: לְצַמֵּחַ
  choice: మళ్లీ పెరగడం
  rationale: צמח అంటే ‘మొలచు/పెరుగు.’ ముందుగా వెంట్రుకలు గొరిగించబడ్డ సందర్భం వల్ల తెలుగులో ‘మళ్లీ’ సహజంగా అంతర్లీన భావాన్ని వ్యక్తం చేస్తుంది; అయితే అది క్రియలో ప్రత్యక్షంగా లేదని పాదసూచిక తెలియజేస్తుంది.
- source_word: כַּאֲשֶׁר
  choice: తరువాత
  rationale: ఈ సందర్భంలో గొరిగింపుకు తరువాత జరిగిన పెరుగుదలను స్పష్టంగా తెలిపే సహజ కాలసంబంధ పదం. ‘గొరిగించబడినప్పుడు’ అనే భావం కూడా వ్యాకరణపరంగా సాధ్యమే.
- source_word: גֻּלָּח
  choice: గొరిగించబడిన
  rationale: גלח క్రియ యొక్క కర్మణి రూపాన్ని నిలుపుతుంది. తెలుగు వాక్య నిర్మాణంలో ఇది తలవెంట్రుకలకు అన్వయించినప్పటికీ, వ్యక్తి గొరిగించబడ్డాడనే భావవ్యక్తీకరణ కూడా సాధ్యమే.
