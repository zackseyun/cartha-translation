  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֵלֶ֔י/הָ אִם אָס֤וֹר יַאַסְר֨וּ/נִי֙ בַּ/עֲבֹתִ֣ים חֲדָשִׁ֔ים אֲשֶׁ֛ר לֹֽא נַעֲשָׂ֥ה בָ/הֶ֖ם מְלָאכָ֑ה וְ/חָלִ֥יתִי וְ/הָיִ֖יתִי כְּ/אַחַ֥ד הָ/אָדָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/011.yaml
  text: He said to her[a], “If they bind me with new ropes that have never been used for work[b], then I will become weak and be like one of the men.”
translation:
  language: te
  text: 'అతడు ఆమెతో ఇలా అన్నాడు: “ఇంతవరకు ఏ పనికీ ఉపయోగించని కొత్త తాళ్లతో నన్ను గట్టిగా కట్టితే[a], నేను బలహీనుడనై సాధారణ మనుషుల్లో ఒకడిలా అవుతాను.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కొత్త తాళ్లతో నన్ను కట్టితే.” హీబ్రూలో క్రియను ఉద్ఘాటించే నిర్మాణం ఉంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ఏ మనిషిలాగానైనా అవుతాను,” అంటే అసాధారణ బలం లేని సాధారణ మానవునిలా.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלֶיהָ
  choice: అతడు ఆమెతో ఇలా అన్నాడు
  rationale: హీబ్రూ కథనంలోని వయిక్తోల్ రూపాన్ని సహజమైన ఆధునిక తెలుగు కథన శైలిలో వ్యక్తపరుస్తుంది.
- source_word: אִם אָסוֹר יַאַסְרוּנִי
  choice: నన్ను గట్టిగా కట్టితే
  rationale: ఇన్ఫినిటివ్ అబ్సల్యూట్‌తో కూడిన క్రియ కట్టడంలోని ఉద్ఘాటనను సూచిస్తుంది; ‘గట్టిగా’ ఆ బలాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది, అయితే అది ‘బిగిగా’ అనే ప్రత్యేక భౌతిక భావాన్ని తప్పనిసరిగా నిర్ధారించదు.
- source_word: בַּעֲבֹתִים חֲדָשִׁים
  choice: కొత్త తాళ్లతో
  rationale: עֲבֹתִים మందమైన తాళ్లు లేదా పేనిన తాళ్లను సూచించగలదు; సందర్భంలో ‘తాళ్లు’ స్పష్టమైన సాధారణ పదం.
- source_word: אֲשֶׁר לֹא נַעֲשָׂה בָהֶם מְלָאכָה
  choice: ఇంతవరకు ఏ పనికీ ఉపయోగించని
  rationale: అక్షరార్థంగా ‘వాటితో ఏ పని చేయబడలేదు’; తెలుగులో వాడని కొత్త తాళ్ల భావాన్ని సహజంగా అందిస్తుంది.
- source_word: וְחָלִיתִי
  choice: నేను బలహీనుడనై
  rationale: חלה ఇక్కడ అనారోగ్యం కంటే శక్తి కోల్పోయి బలహీనపడటాన్ని సూచిస్తుంది.
- source_word: וְהָיִיתִי כְּאַחַד הָאָדָם
  choice: సాధారణ మనుషుల్లో ఒకడిలా అవుతాను
  rationale: హీబ్రూ పదబంధంలోని ‘మనుషుల్లో ఒకడిలా’ అనే నిర్మాణాన్ని నిలుపుతూ, సందర్భంలోని అసాధారణ బలం లేని సాధారణ వ్యక్తి అనే వ్యత్యాసాన్ని స్పష్టం చేస్తుంది.
theological_decisions:
- issue: הָאָדָם పదబంధం యొక్క పరిధి
  choice: సాధారణ మనుషుల్లో ఒకడిలా
  alternative: ఏ మనిషిలాగానైనా
  rationale: ఇది మానవజాతి అనే సారాంశ భావం కంటే, సమ్సోను అసాధారణ బలం లేని ఒక సాధారణ మానవునిలా అవుతాడనే సందర్భార్థాన్ని సూచిస్తుంది; పురుష ఏకవచన సూచనను ‘ఒకడు’ నిలుపుతుంది.
- issue: אִם אָסוֹר יַאַסְרוּנִי లోని ఉద్ఘాటన
  choice: గట్టిగా కట్టితే
  alternative: కట్టితే
  rationale: ఇన్ఫినిటివ్ అబ్సల్యూట్ + పరిమిత క్రియ నిర్మాణంలోని ఉద్ఘాటనను తెలుగులో చూపేందుకు ‘గట్టిగా’ వాడబడింది; అయితే ఉద్ఘాటనను సందర్భంలో సహజంగానే గ్రహిస్తే సాధారణ ‘కట్టితే’ కూడా సాధ్యం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘తాళ్లు,’ ‘బలహీనుడనై’ వంటి సాధారణంగా అర్థమయ్యే పదాలను వాడి, హీబ్రూ ఉద్ఘాటన మరియు ‘సాధారణ మనిషి’ అనే సందర్భార్థాన్ని పాదటిప్పణుల్లో ప్రత్యామ్నాయాలతో సంరక్షించాం.
