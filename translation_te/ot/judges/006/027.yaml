  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּקַּ֨ח גִּדְע֜וֹן עֲשָׂרָ֤ה אֲנָשִׁים֙ מֵֽ/עֲבָדָ֔י/ו וַ/יַּ֕עַשׂ כַּ/אֲשֶׁ֛ר דִּבֶּ֥ר אֵלָ֖י/ו יְהוָ֑ה וַ/יְהִ֡י כַּ/אֲשֶׁ֣ר יָרֵא֩ אֶת בֵּ֨ית אָבִ֜י/ו וְ/אֶת אַנְשֵׁ֥י הָ/עִ֛יר מֵ/עֲשׂ֥וֹת יוֹמָ֖ם וַ/יַּ֥עַשׂ לָֽיְלָה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/027.yaml
  text: So Gideon took ten men from among his servants and did as Yahweh had spoken to him. But because he feared his father's household and the men of the city too much to do it by day[a], he did it at night.
translation:
  language: te
  text: అప్పుడు గిద్యోను తన సేవకులలో నుంచి పది మందిని తీసుకొని, యెహోవా అతనితో చెప్పినట్లే చేశాడు. అయితే అతడు తన తండ్రి ఇంటివారికీ పట్టణంలోని పురుషులకీ భయపడి, పగటిపూట దాన్ని చేయలేదు[a]; రాత్రిపూట చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “పగటిపూట చేయకుండా.” అంటే, తన తండ్రి ఇంటివారి, పట్టణంలోని పురుషుల భయంవల్ల అతడు దాన్ని పగటిపూట చేయలేదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: తీసుకొని
  rationale: לקח అనే సాధారణ కథన క్రియకు సందర్భానుసారమైన సహజ తెలుగు రూపం.
- source_word: עֲשָׂרָה אֲנָשִׁים
  choice: పది మందిని
  rationale: హీబ్రూ పురుషులను సూచిస్తుంది; తెలుగులో వ్యక్తుల లెక్కింపుకు సహజమైన ‘పది మంది’ వాడబడింది.
- source_word: מֵעֲבָדָיו
  choice: తన సేవకుల్లో నుంచి
  rationale: עֶבֶד ఇక్కడ గిద్యోను గృహానికి చెందిన సేవకులను సూచిస్తుంది; విభక్తి מִן యొక్క సమూహంలోనుంచి ఎంపిక భావాన్ని ‘లో నుంచి’ తెలియజేస్తుంది.
- source_word: וַיַּעַשׂ כַּאֲשֶׁר דִּבֶּר אֵלָיו יְהוָה
  choice: యెహోవా తనతో చెప్పినట్లే చేశాడు
  rationale: దైవ వాక్కుకు గిద్యోను విధేయత చూపిన భావాన్ని సహజంగా, మూలానికి దగ్గరగా వ్యక్తం చేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: తెలుగు బైబిలు వాడుకలో సుపరిచితమైన దైవనామ రూపం; బిరుదుతో భర్తీ చేయకుండా వ్యక్తిగత నామాన్ని నిలుపుతుంది.
- source_word: בֵּית אָבִיו
  choice: తన తండ్రి ఇంటివారు
  rationale: ఇక్కడ בַּיִת భవనాన్ని కాక తండ్రి గృహసమూహాన్ని సూచిస్తుంది; ‘ఇంటివారు’ ఆధునిక తెలుగులో సహజం.
- source_word: אַנְשֵׁי הָעִיר
  choice: పట్టణపు మనుషులు
  rationale: మూలంలోని ‘పట్టణపు పురుషులు/మనుషులు’ అనే నిర్దిష్ట సూచనను సాధారణ ‘ప్రజలు’గా విస్తరించకుండా నిలుపుతుంది.
- source_word: מֵעֲשׂוֹת יוֹמָם
  choice: పగటిపూట దాన్ని చేయలేక
  rationale: భయం పగటిపూట కార్యం చేయకుండా అడ్డుకున్న భావాన్ని తెలుగులో స్పష్టంగా తెలియజేస్తుంది; మూలంలోని నిర్మాణానికి మరింత అక్షరార్థ రూపం పాదసూచికలో ఇవ్వబడింది.
- source_word: וַיַּעַשׂ לָיְלָה
  choice: రాత్రిపూట చేశాడు
  rationale: పగటిపూటకు విరుద్ధమైన కాలసూచనను సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామ అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలోని దైవనామాన్ని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా పేరుగానే ఉంచాం. ‘యెహోవా’ ఆధునిక తెలుగు బైబిలు పాఠకులకు విస్తృతంగా పరిచితమైన రూపం; ‘యాహ్వే’ సాధ్యమైన ప్రత్యామ్నాయ లిప్యంతరీకరణ.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘ఇంటివారు’ ద్వారా సామాజిక గృహసమూహ భావం, ‘పట్టణపు మనుషులు’ ద్వారా మూలంలోని పురుషవాచక నిర్దిష్టత నిలుపబడ్డాయి.
