id: JDG.6.6
reference: Judges 6:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּדַּ֧ל יִשְׂרָאֵ֛ל מְאֹ֖ד מִ/פְּנֵ֣י מִדְיָ֑ן וַ/יִּזְעֲק֥וּ בְנֵֽי יִשְׂרָאֵ֖ל אֶל יְהוָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/006.yaml
  text: So Israel became very poor because of Midian[c][b][a], and the sons of Israel cried out to Yahweh.
translation:
  language: te
  text: మిద్యాను వలన ఇశ్రాయేలు ఎంతో బలహీనపడింది[a], మరియు ఇశ్రాయేలు కుమారులు[b] యాహ్వేకు[c] మొరపెట్టుకున్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఎంతో హీనస్థితికి చేరింది’ లేదా ‘తీవ్రంగా దరిద్రపడింది.’ హీబ్రూ క్రియ అణచివేతవల్ల బలహీనపడడం, తగ్గిపోవడం, లేదా హీనస్థితికి చేరడాన్ని సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా, ‘ఇశ్రాయేలు కుమారులు’; ఇది ఇశ్రాయేలు ప్రజలకు వాడే సమష్టి నిబంధనాత్మక పేరు.
    reason: lexical_alternative
  - marker: c
    text: హీబ్రూలో YHWH; సాంప్రదాయంగా ‘ప్రభువు’ అని కూడా అనువదిస్తారు.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּדַּל
  choice: ఎంతో దిగజారిపోయింది
  rationale: דל అనే క్రియ అణచివేతవల్ల బలహీనపడడం, హీనస్థితికి చేరడం, వనరులు తగ్గిపోవడం వంటి విస్తృత భావాన్ని ఇస్తుంది. సందర్భంలో ఆర్థిక దారిద్ర్యం ఉన్నప్పటికీ, దానికే భావాన్ని పరిమితం చేయకుండా ‘దిగజారిపోయింది’ అని అనువదించాం.
- source_word: מְאֹד
  choice: ఎంతో
  rationale: స్థితి తీవ్రతను సహజమైన ఆధునిక తెలుగులో స్పష్టంగా తెలిపే పరిమాణవాచకం.
- source_word: מִפְּנֵי
  choice: కారణంగా
  rationale: ఇక్కడ ఉపసర్గ కారణార్థకంగా ఉంది; మిద్యాను అణచివేతే ఇశ్రాయేలు దుస్థితికి కారణమని తెలుపుతుంది.
- source_word: מִדְיָן
  choice: మిద్యాను
  rationale: హీబ్రూ ప్రజానామానికి తెలుగులో స్థిరపడిన రూపం.
- source_word: וַיִּזְעֲקוּ
  choice: మొరపెట్టుకున్నారు
  rationale: זעק ఆపదలో సహాయం కోరుతూ చేసే తీవ్ర విజ్ఞప్తిని సూచిస్తుంది; ‘మొరపెట్టుకున్నారు’ ఆ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: హీబ్రూ పదబంధంలోని ‘కుమారులు’ అనే రూపాన్ని నిలుపుతూ, ఇశ్రాయేలు ప్రజలను సమష్టిగా సూచించే సంప్రదాయ నిబంధనాత్మక సంబోధనను ప్రతిబింబిస్తుంది.
- source_word: אֶל יְהוָה
  choice: యెహోవాకు
  rationale: אֶל యొక్క దిశార్థాన్ని తెలుగు విభక్తితో సహజంగా వ్యక్తం చేశాం; יהוה అనే దైవనామాన్ని ‘యెహోవా’గా లిప్యంతరీకరించాం.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో నిబంధన దైవనామం ప్రత్యక్షంగా ఉన్నందున బిరుదుతో భర్తీ చేయకుండా తెలుగులో సుపరిచితమైన ‘యెహోవా’ రూపాన్ని వాడాం.
- issue: בְנֵי יִשְׂרָאֵל యొక్క సమష్టి మరియు లింగ రూపం
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలీయులు
  rationale: మూలంలోని పుంలింగ బహువచన రూపాన్ని నిలిపాము; అదే సమయంలో ఇది మొత్తం ఇశ్రాయేలు ప్రజలకు సమష్టి సూచన అని పాదసూచికలో స్పష్టం చేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన, గౌరవప్రదమైన శైలి. మూలంలోని కారణ సంబంధం, ఆపదలో మొర, ‘ఇశ్రాయేలు కుమారులు’ అనే సమష్టి రూపం నిలుపబడ్డాయి.
