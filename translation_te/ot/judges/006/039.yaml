id: JDG.6.39
reference: Judges 6:39
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר גִּדְעוֹן֙ אֶל הָ֣/אֱלֹהִ֔ים אַל יִ֤חַר אַפְּ/ךָ֙ בִּ֔/י וַ/אֲדַבְּרָ֖ה אַ֣ךְ הַ/פָּ֑עַם אֲנַסֶּ֤ה נָּא רַק הַ/פַּ֨עַם֙ בַּ/גִּזָּ֔ה יְהִי נָ֨א חֹ֤רֶב אֶל הַ/גִּזָּה֙ לְ/בַדָּ֔/הּ וְ/עַל כָּל הָ/אָ֖רֶץ יִֽהְיֶה טָּֽל־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/039.yaml
  text: 'Then Gideon said to God[a], “Do not let your anger burn against me, and let me speak just this once. Please let me test just this once with the fleece: let there be dryness on the fleece alone[c][b], and on all the ground let there be dew.”'
translation:
  language: te
  text: 'అప్పుడు గిద్యోను దేవునితో ఇలా అన్నాడు: “నీ కోపం నా మీద రగులుకోనివ్వకు; నాతో ఇంకొక్క మాట మాత్రమే చెప్పనివ్వు. దయచేసి, ఈ ఒక్కసారి మాత్రమే ఉన్ని కట్టతో పరీక్ష చేయనివ్వు[a]. ఉన్ని కట్టు ఒక్కటే పొడిగా ఉండాలి; నేలంతటిమీద మంచు బిందువులు ఉండాలి[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “పరీక్ష చేయనివ్వు” అనే మాటను “ప్రయత్నించనివ్వు” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “మంచు బిందువులు” అంటే రాత్రివేళ నేలమీద ఏర్పడే తేమ (dew). “నేల”ను “భూమి” లేదా “దేశం” అని కూడా అనువదించవచ్చు; ఇక్కడ ఉన్ని కట్టు చుట్టూ ఉన్న నేలను సూచిస్తుంది.
    reason: clarification
lexical_decisions:
- source_word: אַל יִחַר אַפְּךָ בִּי
  choice: నీ కోపం నా మీద రగులుకోనివ్వకు
  rationale: కోపం ‘రగులుకోవడం’ అనే హీబ్రూ రూపకాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: וַאֲדַבְּרָה אַךְ הַפָּעַם
  choice: నన్ను ఈ ఒక్కసారి మాత్రమే మాట్లాడనివ్వు
  rationale: వినయపూర్వక అనుమతి అభ్యర్థనను, అభ్యర్థనకు విధించిన పరిమితిని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: אֲנַסֶּה נָּא רַק הַפַּעַם בַּגִּזָּה
  choice: దయచేసి ఈ ఒక్కసారి మాత్రమే ఉన్ని కట్టతో పరీక్షించనివ్వు
  rationale: נסה లోని ‘పరీక్షించు/ప్రయత్నించు’ భావాన్ని మృదువుచేయకుండా ఉంచి, בַּגִּזָּה ను పరీక్షకు ఉపయోగించే ఉన్ని కట్టగా సహజంగా తెలుపుతుంది.
- source_word: יְהִי נָא חֹרֶב אֶל הַגִּזָּה לְבַדָּהּ
  choice: ఉన్ని కట్ట ఒక్కటే పొడిగా ఉండాలి
  rationale: ఈ సందర్భంలో חֹרֶב విస్తృత కరువును కాక పొడితనాన్ని సూచిస్తుంది; తెలుగు వాక్యనిర్మాణంలో సహజంగా ఉండేలా స్థితిగా అనువదించబడింది.
- source_word: וְעַל כָּל הָאָרֶץ יִהְיֶה טָּל
  choice: నేలంతటిమీద మంచు ఉండాలి
  rationale: הָאָרֶץ ఇక్కడ భూమి మొత్తాన్ని కాక ఉన్ని కట్టు చుట్టూ ఉన్న నేలను సూచిస్తుంది; טַל కు సందర్భోచితమైన తెలుగు పదం ‘మంచు’.
theological_decisions:
- issue: గిద్యోను దేవుణ్ణి పరీక్షించాలనే పునరావృత అభ్యర్థన స్వభావం
  choice: భయంతో కూడిన వినయపూర్వక అభ్యర్థనగానూ, అయినా నిజమైన పరీక్షగానూ అనువదించడం
  alternative: దీనిని ధైర్యవంతమైన విశ్వాసంగా లేదా దోషపూరిత అవిశ్వాసంగా స్పష్టంగా తీర్పు చెప్పడం
  rationale: హీబ్రూ పాఠం గిద్యోను దేవుని కోపానికి భయపడుతున్నాడనీ, మరోసారి పరీక్షించాలని కోరుతున్నాడనీ చెబుతుంది; అతని చర్యను సమర్థించడమో ఖండించడమో పాఠం స్వయంగా చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవభరితమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. హీబ్రూ కోపరూపకాన్ని నిలిపి, ‘పరీక్ష’ అనే ఉద్విగ్న భావాన్ని మృదువుచేయలేదు. ప్రధాన పాఠంలోని ప్రతి పాదసూచిక గుర్తుకు అనుగుణమైన పాదసూచిక ఇవ్వబడింది.
