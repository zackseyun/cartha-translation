base_translation:
  language: en
  yaml_path: translation/ot/judges/006/024.yaml
  text: Then Gideon built an altar there to Yahweh and called it[a], “Yahweh Is Peace.” It remains there to this day in Ophrah of the Abiezrites.
translation:
  language: te
  text: అప్పుడు గిద్యోను అక్కడ యాహ్వేకు ఒక బలిపీఠం కట్టి, దానికి “యాహ్వేయే శాంతి”[a] అని పేరు పెట్టాడు. అది నేటివరకు అబీయెజెరీయుల ఒఫ్రాలో ఉంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ: ‘యాహ్వే షాలోమ్’; అక్షరార్థంగా, ‘యాహ్వే శాంతి’ లేదా ‘యాహ్వేయే శాంతి.’ ‘షాలోమ్’లో శాంతి, క్షేమం, సంపూర్ణత అనే భావాలు కూడా ఉన్నాయి.'
    reason: మూల నామరూపంలోని క్రియారహిత నిర్మాణాన్ని, అలాగే שָׁלוֹם పదపు విస్తృత భావపరిధిని తెలియజేయడం.
lexical_decisions:
- source_word: וַיִּבֶן
  choice: కట్టి
  rationale: బలిపీఠాన్ని నిర్మించడాన్ని తెలిపే בנה క్రియకు సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: מִזְבֵּחַ
  choice: బలిపీఠం
  rationale: బలి అర్పించే పీఠానికి సాధారణమైన, స్పష్టమైన ఆరాధనా పదం.
- source_word: לַיהוָה
  choice: యెహోవాకు
  rationale: ל ఉపసర్గ అంకితం లేదా దిశను సూచిస్తుంది; יהוה అనే దైవనామాన్ని లిప్యంతరీకరించి చూపుతుంది.
- source_word: וַיִּקְרָא לוֹ
  choice: దానికి ... అని పేరు పెట్టాడు
  rationale: పేరు పెట్టే సందర్భంలో קרא + ל భావాన్ని సహజమైన తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: יְהוָה שָׁלוֹם
  choice: యెహోవా సమాధానం
  rationale: హీబ్రూ క్రియారహిత నామసూత్రాన్ని సంక్షిప్తంగా ఉంచి, బలిపీఠపు స్మారక నామంలోని అర్థాన్ని అనువదిస్తుంది; ‘యెహోవా సమాధానమై ఉన్నాడు’ అనే భావం అంతర్లీనంగా ఉంది.
- source_word: שָׁלוֹם
  choice: సమాధానం
  rationale: శాంతి, క్షేమం, సంపూర్ణత అనే విస్తృత భావపరిధి ఉన్నప్పటికీ, దైవనామ సూత్రంలో గౌరవప్రదంగా, సంక్షిప్తంగా సరిపడే సంప్రదాయ తెలుగు పదం.
- source_word: עַד הַיּוֹם הַזֶּה עוֹדֶנּוּ
  choice: అది నేటివరకు ... ఉంది
  rationale: కథకుని కాలం వరకు బలిపీఠం కొనసాగి ఉన్నదనే durative భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: בְּעָפְרָת
  choice: ఒఫ్రాలో
  rationale: స్థలనామాన్ని ప్రామాణిక తెలుగు రూపంలో లిప్యంతరీకరించింది.
- source_word: אֲבִי הָעֶזְרִי
  choice: అబీయెజెరీయుల
  rationale: ఇది అబీయెజెరు వంశానికి చెందిన ప్రజలను సూచించే gentilic/clan designation; స్థలాన్ని గుర్తించే సహజ తెలుగు బహువచన సంబంధరూపం.
theological_decisions:
- issue: יהוה అనే దైవనామాన్ని అంకిత వాక్యంలోను బలిపీఠపు పేరులోను ఎలా చూపాలి
  choice: యెహోవా / యెహోవా సమాధానం
  alternative: ప్రభువు / ప్రభువు సమాధానం; యాహ్వే / యాహ్వే సమాధానం
  rationale: మూలపాఠం יהוה అనే ఒడంబడిక దైవనామాన్ని ప్రత్యక్షంగా ఉపయోగిస్తుంది. దానిని సాధారణ బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో ఉంచి, బలిపీఠపు పేరులోని שָׁלוֹם అర్థాన్నీ అందించింది.
- issue: יְהוָה שָׁלוֹם అనే క్రియారహిత సూత్రంలోని సంబంధం
  choice: యెహోవా సమాధానం
  alternative: యెహోవా సమాధానమై ఉన్నాడు; యెహోవా క్షేమం అనుగ్రహిస్తాడు
  rationale: హీబ్రూలో ‘ఉన్నాడు’ అనే క్రియ వ్యక్తంగా లేదు. ప్రధాన పాఠంలో నామసూత్రపు సంక్షిప్తతను కాపాడి, వ్యాఖ్యాత్మకంగా కారణార్థం లేదా అనుగ్రహార్థం చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కథనానికి సహజమైన వాక్యనిర్మాణం, దైవనామానికి గౌరవప్రదమైన రూపం, సాధారణ పాఠకులకు అర్థమయ్యే పదజాలం. మూలంలోని సంక్షిప్త నామసూత్రం మరియు దాని భావసంభావ్యత పాదటిప్పణిలో నిలుపబడ్డాయి.
