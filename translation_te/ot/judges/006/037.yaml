source:
  edition: WLC
  text: הִנֵּ֣ה אָנֹכִ֗י מַצִּ֛יג אֶת גִּזַּ֥ת הַ/צֶּ֖מֶר בַּ/גֹּ֑רֶן אִ֡ם טַל֩ יִהְיֶ֨ה עַֽל הַ/גִּזָּ֜ה לְ/בַדָּ֗/הּ וְ/עַל כָּל הָ/אָ֨רֶץ֙ חֹ֔רֶב וְ/יָדַעְתִּ֗י כִּֽי תוֹשִׁ֧יעַ בְּ/יָדִ֛/י אֶת יִשְׂרָאֵ֖ל כַּ/אֲשֶׁ֥ר דִּבַּֽרְתָּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/037.yaml
  text: Look[a], I am placing a fleece of wool on the threshing floor. If there is dew on the fleece alone, and dryness on all the ground, then I will know that you will save Israel by my hand, just as you have spoken.
translation:
  language: te
  text: “ఇదిగో, నేను నూర్పిడి కళ్లంలో ఉన్ని బొచ్చును ఉంచుతున్నాను. ఆ బొచ్చు మీద మాత్రమే మంచు ఉండి, నేలంతా[a] పొడిగా ఉంటే, నీవు చెప్పినట్లే నా చేత ఇశ్రాయేలును రక్షిస్తావని నేను తెలుసుకుంటాను.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “దేశమంతా,” లేదా “భూమంతా.” హీబ్రూ పదం స్థానికంగా నేలను గానీ, మరింత విస్తృతంగా దేశాన్ని లేదా భూమిని గానీ సూచించగలదు. ఇక్కడ ఈ సూచన జరుగుతున్న పరిసర నేలే ఉద్దేశమై ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: ఇదిగో
  rationale: గిద్యోను ప్రతిపాదిస్తున్న సూచనపై దృష్టి నిలిపే హీబ్రూ ఉద్ఘాటనను సహజమైన తెలుగు పదంతో నిలిపింది.
- source_word: מַצִּיג
  choice: ఉంచుతున్నాను
  rationale: אָנֹכִיతో కూడిన కృదంతం ప్రస్తుత లేదా తక్షణ కార్యాన్ని సూచిస్తుంది; వస్తువును ఒక చోట అమర్చే భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: גִּזַּת הַצֶּמֶר
  choice: ఉన్ని బొచ్చు
  rationale: కత్తిరించి తీసిన ఉన్నితో కూడిన fleece‌ను సూచిస్తుంది; ఆధునిక పాఠకునికి అర్థమయ్యే సంక్షిప్త రూపం.
- source_word: בַּגֹּרֶן
  choice: నూర్పిడి కళ్లంలో
  rationale: గింజలను నూర్చి ధాన్యాన్ని వేరుచేసే సిద్ధపరచిన ప్రదేశాన్ని సూచించే గֹּרֶןకు సహజమైన తెలుగు సమానం.
- source_word: טַל יִהְיֶה
  choice: మంచు ఉండి
  rationale: టַל ఇక్కడ రాత్రివేళ ఏర్పడే dew‌ను సూచిస్తుంది; దాని ఉనికిని మాత్రమే చెబుతూ ప్రక్రియను అదనంగా నిర్దేశించదు.
- source_word: עַל הַגִּזָּה לְבַדָּהּ
  choice: ఆ బొచ్చు మీద మాత్రమే
  rationale: לְבַדָּהּలోని ప్రత్యేకతను ‘మాత్రమే’ స్పష్టంగా నిలుపుతుంది.
- source_word: וְעַל כָּל הָאָרֶץ חֹרֶב
  choice: నేలంతా పొడిగా
  rationale: సూచన జరుగుతున్న తక్షణ పరిసరాల్లో הָאָרֶץకు ‘నేల’ సరిపోతుంది; חֹרֶבను ఇక్కడ ‘పొడిగా’ అనే స్థితిగా సహజంగా వ్యక్తం చేసింది.
- source_word: וְיָדַעְתִּי
  choice: నేను తెలుసుకుంటాను
  rationale: షరతు నెరవేరినప్పుడు వచ్చే ఫలితాన్ని భవిష్యత్ భావంతో తెలియజేస్తుంది.
- source_word: כִּי תוֹשִׁיעַ
  choice: రక్షిస్తావని
  rationale: יָשַׁע హిఫీల్ రూపంలోని రక్షించడం లేదా విడిపించడం అనే కార్యార్థాన్ని నేరుగా ఇస్తుంది.
- source_word: בְּיָדִי
  choice: నా చేత
  rationale: హీబ్రూ ‘నా చేతి ద్వారా’ అనే సాధనార్థక రూపకాన్ని తెలుగులో సహజంగా, సంక్షిప్తంగా నిలుపుతుంది.
- source_word: כַּאֲשֶׁר דִּבַּרְתָּ
  choice: నీవు చెప్పినట్లే
  rationale: ‘నీవు పలికిన ప్రకారం’ అనే మూలార్థాన్ని సహజ తెలుగులో ఇస్తుంది; ‘వాగ్దానం చేసినట్లే’ అని మూలంలో లేని బలమైన భావాన్ని చేర్చదు.
theological_decisions:
- issue: సూచనలో הָאָרֶץ పదం సూచించే పరిధి
  choice: నేల
  alternative: దేశమంతా / భూమంతా
  rationale: ఈ సందర్భంలో గిద్యోను బొచ్చును దాని చుట్టూ ఉన్న ఉపరితలంతో పోలుస్తున్నాడు. అందువల్ల స్థానిక భౌతిక భావమైన ‘నేల’ సరిపోతుంది; అయినప్పటికీ హీబ్రూ పదానికి విస్తృతమైన ‘దేశం’ లేదా ‘భూమి’ అనే అర్థాలు కూడా సాధ్యమే.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనా సులభంగా అర్థమయ్యే శైలి వాడబడింది. హీబ్రూ వాక్యంలోని షరతు–ఫలిత సంబంధం సహజ తెలుగు వాక్య నిర్మాణంలో నిలుపబడింది. అందిన ఆంగ్ల పొరలో [a] గుర్తు ‘Look’ తర్వాత ఉన్నప్పటికీ, దాని గమనిక הָאָרֶץ గురించినది కావడంతో తెలుగు ప్రధాన పాఠంలో సంబంధిత ‘నేలంతా’ తర్వాత ఉంచబడింది.
