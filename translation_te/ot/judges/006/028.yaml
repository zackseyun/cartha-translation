  to: పట్టణంలోని పురుషులు తెల్లవారుజామునే లేచారు; ఇదిగో, బయలు బలిపీఠం పడగొట్టబడి ఉంది, దాని మీద ఉన్న అషేరా[a] నరికివేయబడి ఉంది, రెండవ ఎద్దు కట్టబడిన బలిపీఠం మీద అర్పించబడి ఉంది.
