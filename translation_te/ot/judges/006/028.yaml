source:
  edition: WLC
  text: וַ/יַּשְׁכִּ֜ימוּ אַנְשֵׁ֤י הָ/עִיר֙ בַּ/בֹּ֔קֶר וְ/הִנֵּ֤ה נֻתַּץ֙ מִזְבַּ֣ח הַ/בַּ֔עַל וְ/הָ/אֲשֵׁרָ֥ה אֲשֶׁר עָלָ֖י/ו כֹּרָ֑תָה וְ/אֵת֙ הַ/פָּ֣ר הַ/שֵּׁנִ֔י הֹֽעֲלָ֔ה עַל הַ/מִּזְבֵּ֖חַ הַ/בָּנֽוּי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/028.yaml
  text: When the men of the city rose early in the morning[a], behold, the altar of Baal had been torn down, and the Asherah that was on it had been cut down[b], and the second bull had been offered up on the altar that had been built.
translation:
  language: te
  text: పట్టణంలోని పురుషులు తెల్లవారుజామునే లేచారు; ఇదిగో, బయలు బలిపీఠం పడగొట్టబడి ఉంది, దాని మీద ఉన్న అషేరా[a] నరికివేయబడి ఉంది, రెండవ ఎద్దు కట్టబడిన బలిపీఠం మీద అర్పించబడి ఉంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అషేరా స్తంభం’; హీబ్రూలో ‘అషేరా.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכִּימוּ אַנְשֵׁי הָעִיר בַּבֹּקֶר
  choice: పట్టణంలోని పురుషులు తెల్లవారుజామునే లేచినప్పుడు
  rationale: שׁכם తెలిపే పెందలకడనే లేవడమనే భావాన్ని ‘తెల్లవారుజామునే’ సహజంగా తెలియజేస్తుంది; אַנְשֵׁי అనే పుంలింగ పదాన్ని ‘పురుషులు’గా నిలిపింది.
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: అనూహ్యంగా కనిపించిన దృశ్యాన్ని సజీవంగా ముందుకు తెచ్చే హీబ్రూ కథన సూచికను నిలిపింది.
- source_word: נֻתַּץ מִזְבַּח הַבַּעַל
  choice: బయలు బలిపీఠం పడగొట్టబడి ఉంది
  rationale: נתץ అంటే నిర్మాణాన్ని కూల్చడం లేదా పడగొట్టడం; ఫలితస్థితిని తెలుగు సహజ వాక్యరూపంలో తెలిపింది.
- source_word: הָאֲשֵׁרָה
  choice: అషేరా
  rationale: ఈ పదం దేవతను లేదా ఆమెతో సంబంధమున్న ఆరాధనా వస్తువును సూచించగలదు. ‘స్తంభం’ అని ప్రధాన పాఠంలో నిర్దిష్టపరచకుండా పేరును లిప్యంతరీకరించింది.
- source_word: אֲשֶׁר עָלָיו
  choice: దాని మీద ఉన్న
  rationale: עַל యొక్క సాధారణ స్థానార్థమైన ‘మీద’ను నిలిపి, ఆ వస్తువు బలిపీఠానికి పక్కన ఉండేదని ఊహించి పాఠాన్ని మార్చలేదు.
- source_word: כֹּרָתָה
  choice: నరికివేయబడి ఉంది
  rationale: כרת ఇక్కడ చెక్కతో చేసిన ఆరాధనా వస్తువును నరికివేయడాన్ని సూచిస్తుంది.
- source_word: הַפָּר הַשֵּׁנִי הֹעֲלָה
  choice: రెండో ఎద్దు ... అర్పించబడి ఉంది
  rationale: ‘రెండో’ అనే అనుసంధానాన్ని నిలిపింది; עלה యొక్క బలిసంబంధ ప్రయోగాన్ని ‘అర్పించబడి’ అని తెలిపి, ఈ వాక్యంలో లేని అదనపు బలి వర్గపేరును చేర్చలేదు.
- source_word: הַמִּזְבֵּחַ הַבָּנוּי
  choice: కొత్తగా కట్టబడిన బలిపీఠం
  rationale: ముందటి సందర్భంలో అప్పుడే కట్టిన బలిపీఠమని సూచించే సహజ తెలుగు రూపం; ‘కొత్తగా’ సందర్భం ద్వారా స్పష్టమయ్యే కాలసంబంధ భావాన్ని అందిస్తుంది.
theological_decisions:
- issue: אֲשֵׁרָה యొక్క సూచన
  choice: అషేరా
  alternative: అషేరా స్తంభం / పవిత్ర స్తంభం
  rationale: మూలపదం దేవతతో సంబంధమున్న ఆరాధనా చిహ్నం లేదా వస్తువును సూచించవచ్చు; దాని ఆకారాన్ని ప్రధాన పాఠంలో ‘స్తంభం’గా పరిమితం చేయకుండా అస్పష్టతను నిలిపి, ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చింది.
- issue: עָלָיו యొక్క స్థానార్థం
  choice: దాని మీద
  alternative: దాని పక్కన / దాని దగ్గర
  rationale: ‘మీద’ అనేది עַל యొక్క ప్రత్యక్ష అర్థం. ఆరాధనా సందర్భంలో ‘పక్కన’ అనే భావం సాధ్యమైనా, దానిని నిశ్చయంగా ప్రధాన పాఠంలో పెట్టకుండా మూలంలోని ఉద్రిక్తతను కాపాడింది.
- issue: הֹעֲלָה తెలిపే బలి స్వరూపం
  choice: అర్పించబడి ఉంది
  alternative: దహనబలిగా అర్పించబడి ఉంది
  rationale: ముందటి వచన సందర్భం దహనబలిని సూచించినప్పటికీ, ఈ వచనంలోని క్రియను మాత్రమే అనుసరించి ప్రధాన పాఠంలో సాధారణ బలి భాషను ఉంచింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘ఇదిగో’ మూలంలోని ఆకస్మిక దర్శన భావాన్ని నిలుపుతుంది. పాదసూచిక గుర్తు [a] ప్రధాన పాఠంలో సంబంధిత పదం వెంట ఉంచబడింది.
