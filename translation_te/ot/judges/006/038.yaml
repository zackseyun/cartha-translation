  text: וַ/יְהִי כֵ֕ן וַ/יַּשְׁכֵּם֙ מִֽ/מָּחֳרָ֔ת וַ/יָּ֖זַר אֶת הַ/גִּזָּ֑ה וַ/יִּ֤מֶץ טַל֙ מִן הַ/גִּזָּ֔ה מְל֥וֹא הַ/סֵּ֖פֶל מָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/038.yaml
  text: And it was so. He rose early the next day and squeezed the fleece[a], wringing dew from the fleece—a bowlful of water.
translation:
  language: te
  text: అలాగే జరిగింది. మరుసటి రోజు అతడు తెల్లవారగానే లేచి, ఆ ఉన్నిని నొక్కి పిండి, దానినుండి మంచును పిండి తీశాడు[a]—ఒక గిన్నె నిండా నీళ్లు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆ ఉన్నిని ఒత్తి, దానినుండి మంచును వెలికితీశాడు.’ హీబ్రూ పాఠంలో ఉన్నిని ఒత్తడాన్నీ, దానినుండి మంచును వెలికితీయడాన్నీ వరుసగా తెలిపే రెండు క్రియలు ఉన్నాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כֵן
  choice: అలాగే జరిగింది
  rationale: గిద్యోను కోరిన సూచన అతడు అడిగినట్లే నెరవేరిందని తెలిపే సహజమైన ఆధునిక తెలుగు వ్యక్తీకరణ.
- source_word: וַיַּשְׁכֵּם מִמָּחֳרָת
  choice: మరుసటి రోజు అతడు తెల్లవారగానే లేచి
  rationale: క్రియలోని ‘పొద్దున్నే లేవడం’ అనే భావాన్నీ, మరుసటి రోజు అనే కాలసూచననూ స్పష్టంగా నిలుపుతుంది.
- source_word: וַיָּזַר אֶת־הַגִּזָּה
  choice: ఆ ఉన్ని ముద్దను నొక్కి పిండాడు
  rationale: ద్రవాన్ని వెలికితీయడానికి ఉన్నిని ఒత్తే చర్యను సాధారణ పాఠకులకు స్పష్టంగా తెలియజేస్తుంది; ‘ఉన్ని ముద్ద’ సందర్భంలోని fleece‌ను సహజంగా సూచిస్తుంది.
- source_word: וַיִּמֶץ טַל מִן־הַגִּזָּה
  choice: దానిలోని మంచును పిండినప్పుడు
  rationale: ఉన్ని నుంచి మంచు నీటిని వెలికితీసే రెండవ క్రియను మొదటి చర్యతో అనుసంధానిస్తూ, మూలంలోని చర్య–ఫలిత సంబంధాన్ని నిలుపుతుంది.
- source_word: מְלֹא הַסֵּפֶל מָיִם
  choice: ఒక గిన్నె నిండా నీళ్లు
  rationale: ఒక పాత్రను నింపేంత నీరు అనే పరిమాణ భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. ‘మంచు’ అనేది ఇక్కడ ఉదయపు మంచుబిందువులను సూచిస్తుంది; ‘నీళ్లు’ సాధారణ పాఠకులకు సహజంగా ఉండే బహువచన రూపం.
