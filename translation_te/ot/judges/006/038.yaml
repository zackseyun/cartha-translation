revisions:
- from: అలాగే జరిగింది. మరుసటి రోజు అతడు తెల్లవారగానే లేచి, ఆ ఉన్ని ముద్దను నొక్కి పిండాడు[a]. దానిలోని మంచును పిండినప్పుడు ఒక గిన్నె నిండా నీళ్లు వచ్చాయి.
  to: అలాగే జరిగింది. మరుసటి రోజు అతడు తెల్లవారగానే లేచి, ఆ ఉన్నిని నొక్కి పిండి, దానినుండి మంచును పిండి తీశాడు[a]—ఒక గిన్నె నిండా నీళ్లు.
  rationale: The revision preserves the source’s two coordinated verbs and its concise final measure expression, while using natural modern Telugu. No theological or interpretive expansion has been introduced.
