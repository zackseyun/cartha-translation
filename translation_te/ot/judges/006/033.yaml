translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే గౌరవప్రదమైన కథనశైలి. జాతినామాలను సహజమైన తెలుగు బహువచన రూపాల్లో ఇచ్చి, వాక్యంలోని వరుస సైనిక కదలికలను స్పష్టంగా ఉంచాం.
