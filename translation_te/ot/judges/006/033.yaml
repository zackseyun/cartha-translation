source:
  edition: WLC
  text: וְ/כָל מִדְיָ֧ן וַ/עֲמָלֵ֛ק וּ/בְנֵי קֶ֖דֶם נֶאֶסְפ֣וּ יַחְדָּ֑ו וַ/יַּעַבְר֥וּ וַֽ/יַּחֲנ֖וּ בְּ/עֵ֥מֶק יִזְרְעֶֽאל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/033.yaml
  text: Then all Midian and Amalek and the people of the East gathered together[a], crossed over, and camped in the Valley of Jezreel.
translation:
  language: te
  text: అప్పుడు మిద్యానీయులందరూ, అమాలేకీయులు, తూర్పు ప్రాంత ప్రజలు[a] కలిసి సమకూడారు. వారు దాటి యెజ్రెయేలు లోయలో మకాం వేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా ‘తూర్పు కుమారులు’; ఇది తూర్పు ప్రాంత ప్రజలను సూచించే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כָל מִדְיָן
  choice: మిద్యానీయులందరూ
  rationale: హీబ్రూలో అక్షరార్థంగా ‘మిద్యాను అంతా’ అనే సమూహవాచక ప్రయోగం ఉంది. ఆధునిక తెలుగులో ప్రజలను సూచించే ‘మిద్యానీయులందరూ’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: וַ/עֲמָלֵק
  choice: అమాలేకీయులు
  rationale: ‘అమాలేకు’ అనే జాతినామం ఇక్కడ ఆ ప్రజలను సమూహంగా సూచిస్తుంది; తెలుగులో ‘అమాలేకీయులు’ సహజమైన జాతివాచక రూపం.
- source_word: וּ/בְנֵי קֶדֶם
  choice: తూర్పు ప్రాంత ప్రజలు
  rationale: అక్షరార్థం ‘తూర్పు కుమారులు’; ఇది తూర్పున నివసించే ప్రజలు లేదా తెగలను సూచించే హీబ్రూ నుడికారం. భావాన్ని స్పష్టంగా తెలిపే సహజ తెలుగు రూపం ఎంచుకోబడింది.
- source_word: נֶאֶסְפוּ יַחְדָּו
  choice: కలిసి సమకూడారు
  rationale: నిఫల్ రూపం సమకూడడాన్ని, יַחְדָּו కలిసి ఉండడాన్ని సూచిస్తుంది. ఈ రెండింటి భావాన్నీ తెలుగు ప్రయోగం నిలుపుతుంది.
- source_word: וַ/יַּעַבְרוּ
  choice: దాటి వచ్చి
  rationale: עבר అంటే ‘దాటడం’. దేనిని దాటారో మూలపాఠం చెప్పదు; అందువల్ల తెలుగులోనూ దానిని నిర్దిష్టం చేయలేదు. కథన దృష్టికోణంలో గమ్యస్థలానికి రావడాన్ని ‘వచ్చి’ సహజంగా తెలియజేస్తుంది.
- source_word: וַֽ/יַּחֲנוּ
  choice: మకాం వేశారు
  rationale: חנה సైనిక సందర్భంలో శిబిరం వేయడం లేదా మకాం వేయడం. ‘మకాం వేశారు’ ఆధునిక తెలుగులో సహజంగా అర్థమవుతుంది.
- source_word: בְּ/עֵמֶק יִזְרְעֶאל
  choice: యెజ్రెయేలు లోయలో
  rationale: עֵמֶק లోయ లేదా మైదానాన్ని సూచించగలదు. ఈ ప్రసిద్ధ భౌగోళిక స్థలానికి ‘యెజ్రెయేలు లోయ’ స్పష్టమైన, మూలానికి దగ్గరైన రూపం.
