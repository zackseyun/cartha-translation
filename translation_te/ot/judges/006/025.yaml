source:
  edition: WLC
  text: וַ/יְהִי֮ בַּ/לַּ֣יְלָה הַ/הוּא֒ וַ/יֹּ֧אמֶר ל֣/וֹ יְהוָ֗ה קַ֤ח אֶת פַּר הַ/שּׁוֹר֙ אֲשֶׁ֣ר לְ/אָבִ֔י/ךָ וּ/פַ֥ר הַ/שֵּׁנִ֖י שֶׁ֣בַע שָׁנִ֑ים וְ/הָרַסְתָּ֗ אֶת מִזְבַּ֤ח הַ/בַּ֨עַל֙ אֲשֶׁ֣ר לְ/אָבִ֔י/ךָ וְ/אֶת הָ/אֲשֵׁרָ֥ה אֲשֶׁר עָלָ֖י/ו תִּכְרֹֽת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/025.yaml
  text: And it happened that night that Yahweh said to him[a], “Take your father’s bull and the second bull, seven years old, and tear down the altar of Baal that belongs to your father[b], and cut down the Asherah that is upon it.”
translation:
  language: te
  text: 'ఆ రాత్రి యాహ్వే అతనితో ఇలా అన్నాడు: “నీ తండ్రికి చెందిన ఎద్దును, ఏడేళ్ల వయసున్న రెండవ ఎద్దును తీసుకో. నీ తండ్రికి చెందిన బయలు బలిపీఠాన్ని కూలగొట్టు; దానిమీద[a] ఉన్న అషేరాను[b] నరికివేయి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా ‘దానిమీద.’ అషేరా బలిపీఠం మీద, దానికంటే ఎత్తుగా, లేదా దానితో అతి దగ్గరి సంబంధంలో నిలిచి ఉండడాన్ని ఈ మాట సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘అషేరా స్తంభం’ లేదా ‘పవిత్ర స్తంభం’ అని కూడా అనువదించవచ్చు. హీబ్రూ పదం అషేరాతో సంబంధమున్న ఒక ఆరాధనా వస్తువును సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַּלַּיְלָה הַהוּא
  choice: ఆ రాత్రి
  rationale: హీబ్రూ కథన సంధిని ఆధునిక తెలుగులో సహజంగా సంక్షిప్తం చేస్తూ కాలసూచనను స్పష్టంగా ఉంచుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామాన్ని బిరుదుగా మార్చకుండా, హీబ్రూ నాలుగు అక్షరాల నామానికి సాధారణ పునర్నిర్మిత ఉచ్చారణను లిప్యంతరీకరిస్తుంది.
- source_word: פַּר הַשּׁוֹר ... וּפַר הַשֵּׁנִי שֶׁבַע שָׁנִים
  choice: నీ తండ్రికి చెందిన కోడెను, ఏడేళ్ల వయసున్న రెండవ కోడెను
  rationale: פַּר అనే మగ పశువును ‘కోడె’గా సహజంగా తెలుపుతూ, వావ్ మరియు ‘రెండవది’ వల్ల కనిపించే రెండు జంతువుల పఠనాన్ని ప్రధాన పాఠ్యంలో నిలుపుతుంది.
- source_word: וְהָרַסְתָּ
  choice: కూలగొట్టు
  rationale: బలిపీఠాన్ని పూర్తిగా ధ్వంసం చేయాలనే ఆజ్ఞను సహజమైన, బలమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: מִזְבַּח הַבַּעַל
  choice: బయలు బలిపీఠం
  rationale: హీబ్రూ దేవతానామాన్ని తెలుగు బైబిలు వాడుకకు దగ్గరగా లిప్యంతరీకరిస్తూ సంబంధాన్ని స్పష్టంగా తెలుపుతుంది.
- source_word: הָאֲשֵׁרָה
  choice: అషేరా
  rationale: ఇది దేవతను సూచిస్తుందా, ఆమెతో సంబంధమున్న ఆరాధనా వస్తువును సూచిస్తుందా అన్న సందిగ్ధతను ‘స్తంభం’ వంటి వివరణతో ముందే పరిష్కరించకుండా ఉంచుతుంది.
- source_word: אֲשֶׁר עָלָיו
  choice: దానిమీద ఉన్న
  rationale: עַל యొక్క ప్రాథమిక స్థలార్థాన్ని దగ్గరగా నిలుపుతుంది; ఖచ్చితమైన అమరికపై ఉన్న సందిగ్ధతను పాదటిప్పణిలో సూచిస్తుంది.
- source_word: תִּכְרֹת
  choice: నరికివేయి
  rationale: చెక్కతో చేసిన ఆరాధనా వస్తువును నరికే చర్యకు స్పష్టమైన, సహజమైన తెలుగు క్రియ.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలంలోని వ్యక్తిగత దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా ఉంచుతుంది; ‘యెహోవా’కన్నా ‘యాహ్వే’ పునర్నిర్మిత హీబ్రూ ఉచ్చారణకు దగ్గరగా ఉంటుంది.
- issue: הָאֲשֵׁרָה యొక్క సూచన
  choice: అషేరా
  alternative: అషేరా స్తంభం / పవిత్ర స్తంభం
  rationale: పదం దేవతతో సంబంధమున్న ఆరాధనా చిహ్నం లేదా వస్తువును సూచించగలదు. ప్రధాన పాఠ్యంలో లిప్యంతరీకరణ ఆ చారిత్రక-మతపరమైన సందిగ్ధతను కాపాడుతుంది.
- issue: వచనంలో కోడెల సంఖ్య
  choice: రెండు కోడెలుగా అనువదించడం
  alternative: నీ తండ్రి కోడెను, అంటే ఏడేళ్ల వయసున్న రెండవ కోడెను
  rationale: וּפַר (‘మరియు కోడె’) మరియు הַשֵּׁנִי (‘రెండవది’) రెండు జంతువులను సూచించే పఠనానికి బలం ఇస్తాయి; అయితే హీబ్రూ నిర్మాణం కఠినమైనదని అంగీకరించాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన ఆజ్ఞారూపాలను ఉపయోగించాం. వాక్యం గంభీరంగా ఉన్నా పాతకాలపు కృత్రిమ నిర్మాణాలను నివారించాం. పాదటిప్పణి గుర్తులను అవి వివరిస్తున్న పదబంధాల దగ్గరే వరుసగా ఉంచాం.
