  to: 'ఆ రాత్రి యాహ్వే అతనితో ఇలా అన్నాడు: “నీ తండ్రికి చెందిన ఎద్దును, ఏడేళ్ల వయసున్న రెండవ ఎద్దును తీసుకో. నీ తండ్రికి చెందిన బయలు బలిపీఠాన్ని కూలగొట్టు; దానిమీద[a] ఉన్న అషేరాను[b] నరికివేయి.”'
