  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר גִּדְע֖וֹן אֶל הָ/אֱלֹהִ֑ים אִם יֶשְׁ/ךָ֞ מוֹשִׁ֧יעַ בְּ/יָדִ֛/י אֶת יִשְׂרָאֵ֖ל כַּ/אֲשֶׁ֥ר דִּבַּֽרְתָּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/036.yaml
  text: Then Gideon said to God, “If you will save Israel by my hand, as you have spoken,”
translation:
  language: te
  text: 'అప్పుడు గిద్యోను దేవునితో ఇలా అన్నాడు: “నీవు చెప్పినట్లుగా నా ద్వారా ఇశ్రాయేలును రక్షించబోతున్నావంటే—”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... ఇలా అన్నాడు
  rationale: వావ్-క్రమ రూపం కథనాన్ని ముందుకు తీసుకెళ్తుంది; ‘అప్పుడు’ ఆ క్రమ భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: אֶל הָאֱלֹהִים
  choice: దేవునితో
  rationale: సందర్భంలో గిద్యోను ఇశ్రాయేలు దేవునిని ఉద్దేశించి మాట్లాడుతున్నాడు; తెలుగు వాడుకలో ‘దేవునితో అన్నాడు’ సహజంగా ఉంటుంది.
- source_word: אִם יֶשְׁךָ מוֹשִׁיעַ
  choice: రక్షించబోతున్నావంటే
  rationale: אִם షరతును ప్రారంభిస్తుంది; יֵשׁ + ప్రత్యయంతో కూడిన కృదంత నిర్మాణం ఉద్దేశించిన లేదా ముందున్న కార్యాన్ని సూచిస్తుంది. ‘రక్షించబోతున్నావంటే’ ఈ భావాన్నీ, తరువాతి వచనంలో కొనసాగనున్న అసంపూర్ణ షరతునీ కాపాడుతుంది.
- source_word: בְּיָדִי
  choice: నా ద్వారా
  rationale: అక్షరార్థంగా ‘నా చేతి ద్వారా’; ఇక్కడ ‘చేతి’ సాధనత్వాన్ని సూచించే హీబ్రూ నుడికారం. ఆధునిక తెలుగులో ‘నా ద్వారా’ అర్థాన్ని స్పష్టంగా, సహజంగా అందిస్తుంది.
- source_word: אֶת יִשְׂרָאֵל
  choice: ఇశ్రాయేలును
  rationale: ప్రత్యక్ష కర్మ సూచకమైన אֵת అనువదించబడదు; ఇశ్రాయేలు రక్షింపబడే కర్మగా తెలుగులో ద్వితీయా విభక్తితో ఇవ్వబడింది.
- source_word: כַּאֲשֶׁר דִּבַּרְתָּ
  choice: నీవు చెప్పినట్లుగా
  rationale: దేవుడు ఇంతకు ముందు పలికిన మాటను సూచిస్తూ, దాని ప్రస్తుత ప్రాసంగికతను సహజమైన తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: గిద్యోను సంబోధిస్తున్న אֱלֹהִים యొక్క గుర్తింపు
  choice: దేవుడు
  alternative: ఒక దేవుడు / ఆ దేవుడు
  rationale: సందర్భంలో గిద్యోను అనిర్దిష్ట దేవతను కాక ఇశ్రాయేలు దేవునినే ఉద్దేశిస్తున్నాడు; ‘దేవుడు’ అదనపు సిద్ధాంతార్థాన్ని చేర్చకుండా ఈ నిర్దిష్ట సూచనను తెలియజేస్తుంది.
- issue: గిద్యోను మాటలోని షరతు మరియు భావి ఉద్దేశం
  choice: రక్షించబోతున్నావంటే
  alternative: రక్షిస్తావంటే
  rationale: మూలంలోని אִם షరతును తెరిచి ఉంచుతుంది; יֶשְׁךָ מוֹשִׁיעַ భావి/ఉద్దేశిత కార్యాన్ని సూచిస్తుంది. ఎంపిక చేసిన రూపం దేవుని వాగ్దానంపై గిద్యోను ఉంచిన పరీక్షాత్మక షరతును ముందుగానే నిశ్చయంగా మార్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే కథన శైలి. వాక్యం 37వ వచనంలో కొనసాగుతున్నందున చివర దీర్ఘ విరామచిహ్నం ఉపయోగించబడింది.
