id: JDG.6.20
reference: Judges 6:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אֵלָ֜י/ו מַלְאַ֣ךְ הָ/אֱלֹהִ֗ים קַ֣ח אֶת הַ/בָּשָׂ֤ר וְ/אֶת הַ/מַּצּוֹת֙ וְ/הַנַּח֙ אֶל הַ/סֶּ֣לַע הַלָּ֔ז וְ/אֶת הַ/מָּרַ֖ק שְׁפ֑וֹךְ וַ/יַּ֖עַשׂ כֵּֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/020.yaml
  text: Then the angel of God said to him[a], “Take the meat and the unleavened bread, and set them on this rock, and pour out the broth.” And he did so.
translation:
  language: te
  text: అప్పుడు దేవుని దూత అతనితో[a], “మాంసాన్ని, పులియని రొట్టెలను తీసుకొని ఈ బండమీద ఉంచు; మాంసరసాన్ని పోసివేయి” అన్నాడు. అతడు అలాగే చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “దేవదూత.” హీబ్రూ పదం మానవ దూతను గానీ అతీంద్రియ దూతను గానీ సూచించగలదు; ఇక్కడి సందర్భం అతీంద్రియ దూతను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאַךְ הָאֱלֹהִים
  choice: దేవుని దూత
  rationale: מַלְאַךְ అనే పదానికి ‘దూత’ లేదా సందర్భానుసారంగా ‘దేవదూత’ అనే అర్థాలు ఉండవచ్చు. ‘దేవుని దూత’ అనే తెలుగు రూపం మూలంలోని దూత భావాన్ని, ఈ సందర్భంలోని అతీంద్రియ సూచనను రెండింటినీ సహజంగా నిలుపుతుంది.
- source_word: קַח
  choice: తీసుకొని
  rationale: לקח ఆజ్ఞారూపానికి ప్రాథమిక అర్థం ‘తీసుకో’. తరువాతి ఆజ్ఞతో సహజంగా కలపడానికి తెలుగులో ‘తీసుకొని’ అని ఇచ్చాం.
- source_word: הַבָּשָׂר
  choice: మాంసాన్ని
  rationale: ఆహార సందర్భంలో בָּשָׂר కు సహజమైన ఆధునిక తెలుగు సమానం ‘మాంసం’.
- source_word: הַמַּצּוֹת
  choice: పులియని రొట్టెలను
  rationale: מַצּוֹת పులియబెట్టకుండా చేసిన రొట్టెలను సూచిస్తుంది. మూలంలోని బహువచనాన్ని నిలిపాం.
- source_word: וְהַנַּח
  choice: ఉంచి
  rationale: נוח హిఫీల్ ఆజ్ఞారూపం ఇక్కడ ‘ఉంచు/పెట్టు’ అని అర్థం. తెలుగు వాక్యప్రవాహంలో తరువాతి ఆజ్ఞతో కలిపి ‘ఉంచి’ సహజంగా ఉంటుంది.
- source_word: אֶל־הַסֶּלַע הַלָּז
  choice: ఈ బండమీద
  rationale: סֶלַע అంటే బండ లేదా శిల. ఉంచడం అనే క్రియతో אֶל ఇక్కడ ఉపరితల గమ్యాన్ని సూచిస్తుండటంతో ‘బండమీద’ సహజమైన అనువాదం; הַלָּז ను ‘ఈ’గా ఇచ్చాం.
- source_word: הַמָּרַק
  choice: పులుసును
  rationale: מָרָק వండిన మాంసపు ద్రవం లేదా broth ను సూచిస్తుంది. సాధారణ ఆధునిక తెలుగులో ‘పులుసు’ స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: שְׁפֹוךְ
  choice: కుమ్మరించు
  rationale: שפך అంటే ద్రవాన్ని పోయడం లేదా కుమ్మరించడం. పాత్రలోని పులుసును బండమీద పూర్తిగా పోయే సందర్భానికి ‘కుమ్మరించు’ సరిపోతుంది.
- source_word: וַיַּעַשׂ כֵּן
  choice: అతడు అలాగే చేశాడు
  rationale: ఈ హీబ్రూ నుడికారం ఆజ్ఞకు విధేయంగా చేసినదాన్ని సంక్షిప్తంగా తెలియజేస్తుంది; ‘అలాగే చేశాడు’ సహజమైన తెలుగు రూపం.
theological_decisions:
- issue: దైవిక దూతను సూచించే పదాన్ని దైవదర్శన సందర్భంలో అనువదించడం
  choice: దేవుని దూత
  alternative: దేవుని దేవదూత
  rationale: మూలంలోని מַלְאַךְ సాధారణంగా ‘సందేశవాహకుడు/దూత’ అని కూడా, అతీంద్రియ దూత అని కూడా అర్థమివ్వగలదు. న్యాయాధిపతులు 6లో సందర్భం అతీంద్రియ ప్రతినిధిని సూచించినా, ‘దేవుని దూత’ అనే రూపం ఆ భావాన్ని తెలియజేస్తూనే ఆ వ్యక్తి స్వరూపాన్ని మూలం కంటే ఎక్కువగా నిర్వచించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. ఆజ్ఞల క్రమాన్ని తెలుగులో సహజంగా వినిపించే అసమాపక క్రియలతో కలిపినా, మూలంలోని ప్రతి చర్యను నిలిపాం.
