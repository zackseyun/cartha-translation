source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֵלָי/ו֙ יְהוָ֔ה כִּ֥י אֶהְיֶ֖ה עִמָּ֑/ךְ וְ/הִכִּיתָ֥ אֶת מִדְיָ֖ן כְּ/אִ֥ישׁ אֶחָֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/016.yaml
  text: And Yahweh said to him[a], “Surely I will be with you, and you will strike Midian as one man.”
translation:
  language: te
  text: 'యాహ్వే అతనితో ఇలా అన్నాడు: “నిశ్చయంగా నేను నీతో ఉంటాను; నీవు మిద్యానును ఒక్క మనిషిని కొట్టినట్లు కొడతావు[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఒక్క మనిషిలా.” హీబ్రూలోని ఈ ఉపమానం మిద్యానుపై జరిగే దాడిని ఒక్క మనిషిని కొట్టినట్లుగా చిత్రిస్తుంది; సందర్భంలో ‘ఒక్క మనిషిని కొట్టినంత సులభంగా’ అనే భావమూ ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవ నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో దాని ఉచ్చారణకు సమీపమైన రూపంగా ఇచ్చాం.
- source_word: וַיֹּאמֶר אֵלָיו
  choice: అతనితో ... అన్నాడు
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది; తెలుగు కథన శైలిలో సహజంగా ఉండేందుకు వాక్యాంత క్రియాక్రమాన్ని వాడాం.
- source_word: כִּי
  choice: నిశ్చయంగా
  rationale: ఇక్కడ כִּי కారణాన్ని మాత్రమే సూచించడం కంటే గిద్యోనుకు దేవుడు ఇచ్చిన హామీని బలపరుస్తుంది; అందువల్ల ధృవీకరణ భావాన్ని నిలిపాం.
- source_word: אֶהְיֶה עִמָּךְ
  choice: నేను నీతో ఉంటాను
  rationale: היה యొక్క ప్రథమ పురుష ఏకవచన అసంపూర్ణ రూపం ఈ వాగ్దాన సందర్భంలో భవిష్య హామీని తెలియజేస్తుంది.
- source_word: וְהִכִּיתָ
  choice: కొడతావు
  rationale: נכה అనే క్రియలోని ‘కొట్టు’ భావాన్ని నిలిపి, ముందున్న వాగ్దానం ఫలితంగా జరిగే భవిష్య కార్యాన్ని తెలుగులో సహజంగా తెలిపాం.
- source_word: אֶת מִדְיָן
  choice: మిద్యానును
  rationale: హీబ్రూ వచనంలో ఉన్న ‘మిద్యాను’ అనే సమూహనామాన్ని ‘మిద్యానీయులు’గా విప్పకుండా అలాగే ఉంచాం.
- source_word: כְּאִישׁ אֶחָד
  choice: ఒకే మనిషిని కొట్టినట్లు
  rationale: మిద్యాను మొత్తం ఒకే మనిషి అన్నట్లుగా నిర్ణయాత్మకంగా ఓడించగలడనే ఉపమాన భావాన్ని, పురుష ఏకవచన చిత్రణతో సహా, తెలుగులో స్పష్టంగా నిలిపాం.
theological_decisions:
- issue: יְהוָה అనే దైవ నామం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలంలో వ్యక్తిగత దైవ నామమే ఉంది. దానిని బిరుదుగా మార్చకుండా లిప్యంతరీకరించడం మూలభేదాన్ని కాపాడుతుంది.
- issue: כְּאִישׁ אֶחָד అనే ప్రయోగం యొక్క భావం
  choice: ఒకే మనిషిని కొట్టినట్లు
  alternative: ఒకే మనిషిలా; ఒక మనిషిని కొట్టినంత సులభంగా
  rationale: ఈ మాట గిద్యోను, మిద్యాను ఐక్యంగా కలిసి పనిచేస్తారని చెప్పడం కంటే, మిద్యాను మొత్తాన్ని ఒకే వ్యక్తిగా పరిగణించి నిర్ణయాత్మకంగా కొట్టడాన్ని సూచించే అవకాశమే సందర్భానికి బాగా సరిపోతుంది. అయినా హీబ్రూ ఉపమానంలోని సంక్షిప్తత వల్ల ఉన్న భావవ్యాప్తిని పాదటిప్పణిలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే కథన శైలిని వాడాం. ‘కొడతావు’ మూలక్రియకు సమీపంగా ఉండగా, పాదటిప్పణి దాని సందర్భార్థమైన నిర్ణయాత్మక ఓటమిని వివరిస్తుంది. పాదటిప్పణి గుర్తును అది వివరిస్తున్న ఉపమానం వద్ద ఉంచాం.
