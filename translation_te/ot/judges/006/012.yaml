source:
  edition: WLC
  text: וַ/יֵּרָ֥א אֵלָ֖י/ו מַלְּאַ֣ךְ יְהוָ֑ה וַ/יֹּ֣אמֶר אֵלָ֔י/ו יְהוָ֥ה עִמְּ/ךָ֖ גִּבּ֥וֹר הֶ/חָֽיִל׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/012.yaml
  text: Then the angel of Yahweh appeared to him and said to him[a], “Yahweh is with you[b], mighty warrior.”
translation:
  language: te
  text: అప్పుడు యాహ్వే దూత[a] అతనికి ప్రత్యక్షమై, “యాహ్వే నీతో ఉన్నాడు, పరాక్రమవంతుడైన యోధుడా![b]” అని అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యాహ్వే సందేశకుడు.” హీబ్రూ పదానికి “సందేశకుడు,” “దూత” అనే రెండు అర్థాలూ రావచ్చు; ఈ ప్రత్యక్షత సందర్భంలో “దూత” బాగా సరిపోతుంది.
    reason: lexical_alternative
  - marker: b
    text: సాంప్రదాయికంగా, “పరాక్రమశాలియైన వీరుడా!”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרָא
  choice: ప్రత్యక్షమై
  rationale: ראה అనే క్రియ యొక్క నిఫాల్ రూపం ఇక్కడ దైవిక లేదా దూతసంబంధ ప్రత్యక్షతను సూచిస్తుంది. ‘కనిపించి’ కంటే ‘ప్రత్యక్షమై’ ఈ సందర్భానికి సహజంగా, గౌరవప్రదంగా సరిపోతుంది.
- source_word: מַלְאַךְ יְהוָה
  choice: యాహ్వే దూత
  rationale: מַלְאָךְ అనే పదానికి ‘దూత’ లేదా ‘సందేశకుడు’ అనే అర్థాలు ఉండవచ్చు. ప్రత్యక్షతను వర్ణించే ఈ సందర్భంలో ‘దూత’ సహజమైనది; ఆ దూత ఎవరో అనే మరింత బలమైన సిద్ధాంతపరమైన గుర్తింపును అనువాదం చేర్చదు.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హీబ్రూ దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, వ్యక్తిగత నామానికి ఆధునిక తెలుగు లిప్యంతరీకరణగా ‘యాహ్వే’ అని ఇచ్చాం.
- source_word: וַיֹּאמֶר אֵלָיו
  choice: అతనికి … అని అన్నాడు
  rationale: హీబ్రూలో ఉన్న ‘అతనికి’ అనే సర్వనామాన్ని అలాగే ఉంచి, ఈ వచనంలో లేని గిద్యోను పేరును చేర్చలేదు.
- source_word: יְהוָה עִמְּךָ
  choice: యాహ్వే నీతో ఉన్నాడు
  rationale: క్రియలేని హీబ్రూ వాక్యాన్ని సందర్భానుసారం ఆశీర్వాద ఆకాంక్షగా కాక, వర్తమాన ప్రకటనగా అనువదించాం.
- source_word: גִּבּוֹר הֶחָיִל
  choice: పరాక్రమవంతుడైన యోధుడు
  rationale: ఈ పదబంధం బలమైన, ధైర్యవంతమైన, యుద్ధసామర్థ్యమున్న వ్యక్తిని సూచిస్తుంది. సంబోధనలో ‘పరాక్రమవంతుడైన యోధుడా’ అని ఇవ్వడం ఆధునిక తెలుగులో సహజంగా ఉండి యుద్ధసంబంధ భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో ఉన్న ఒడంబడిక నామాన్ని బిరుదుతో భర్తీ చేయకుండా లిప్యంతరీకరించాం.
- issue: מַלְאַךְ יְהוָה యొక్క గుర్తింపు
  choice: యాహ్వే దూత
  alternative: యాహ్వే సందేశకుడు
  rationale: మూలంలోని పదబంధాన్ని పదార్థపరంగా నిలుపుతూ, ఈ వ్యక్తిని మరింత నిర్దిష్టమైన సిద్ధాంతపరమైన గుర్తింపుతో సమానం చేయలేదు.
- issue: יְהוָה עִמְּךָ వాక్య స్వభావం
  choice: యాహ్వే నీతో ఉన్నాడు
  alternative: యాహ్వే నీతో ఉండుగాక
  rationale: సందర్భంలో ఇది ఆకాంక్ష లేదా ఆశీర్వచనం కంటే ఒక ప్రకటనగా అర్థం కావడం సహజం; అయినా హీబ్రూ క్రియలేని వాక్య నిర్మాణం వల్ల ప్రత్యామ్నాయ పఠనం సాధ్యమే.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలిని ఉపయోగించాం. సంబోధనలోని ఆశ్చర్యార్థక బలాన్ని నిలుపుతూ, మూలంలో లేని వ్యక్తిపేరును లేదా సిద్ధాంతపరమైన వివరణను చేర్చలేదు.
