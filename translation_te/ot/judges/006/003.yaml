  yaml_path: translation/ot/judges/006/003.yaml
  text: And whenever Israel sowed[a], Midian and Amalek and the people of the East would come up against them.
translation:
  language: te
  text: ఇశ్రాయేలు విత్తనం విత్తినప్పుడల్లా, మిద్యానీయులు, అమాలేకీయులు, తూర్పు ప్రాంతపు ప్రజలు ఇశ్రాయేలుకు వ్యతిరేకంగా[a] వచ్చేవారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ మూలంలో అక్షరార్థంగా ‘అతనికి వ్యతిరేకంగా’ అని ఏకవచన ప్రత్యయం ఉంది; అది ఇశ్రాయేలును సమష్టిగా సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה אִם
  choice: విత్తనం విత్తినప్పుడల్లా
  rationale: ఈ సందర్భంలో ఈ నిర్మాణం ఒక్కసారి జరిగిన షరతును కాక, పదేపదే జరిగిన సందర్భాన్ని సూచిస్తుంది. ‘అప్పుడల్లా’ ఆ పునరావృత భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: זָרַע
  choice: విత్తనం విత్తిన
  rationale: వ్యవసాయ సందర్భంలో זרע అంటే విత్తనాన్ని విత్తడం. తెలుగు వాడుకలో ‘విత్తనం విత్తడం’ స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: מִדְיָן וַעֲמָלֵק
  choice: మిద్యానీయులు, అమాలేకీయులు
  rationale: హీబ్రూలో ప్రజలను సూచించే సమూహ నామాలుగా ‘మిద్యాను’, ‘అమాలేకు’ ఉన్నాయి. ఆధునిక తెలుగులో ఆయా జనసమూహాలను స్పష్టంగా సూచించేందుకు జాతివాచక రూపాలు వాడబడ్డాయి.
- source_word: וּבְנֵי קֶדֶם
  choice: తూర్పు దేశాల ప్రజలు
  rationale: అక్షరార్థంగా ‘తూర్పు కుమారులు’; ఇది తూర్పున నివసించే జనసమూహాలకు ప్రాంతీయ సమూహనామం. ‘తూర్పు దేశాల ప్రజలు’ ఆ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: וְעָלָה ... וְעָלוּ עָלָיו
  choice: ఇశ్రాయేలు మీదికి దండెత్తి వచ్చేవారు
  rationale: עלה ... על అనే నిర్మాణం ఇక్కడ శత్రుత్వంతో పైకి వచ్చి దాడి చేయడాన్ని సూచిస్తుంది. రెండు క్రియల భావాన్ని పునరావృత సందర్భానికి తగిన సహజ తెలుగు వ్యక్తీకరణగా ‘దండెత్తి వచ్చేవారు’లో కలిపి అందించాం.
