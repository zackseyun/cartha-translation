source:
  edition: WLC
  text: וְ/גִדְע֣וֹן בָּ֗א וַ/יַּ֤עַשׂ גְּדִֽי עִזִּים֙ וְ/אֵיפַת קֶ֣מַח מַצּ֔וֹת הַ/בָּשָׂר֙ שָׂ֣ם בַּ/סַּ֔ל וְ/הַ/מָּרַ֖ק שָׂ֣ם בַּ/פָּר֑וּר וַ/יּוֹצֵ֥א אֵלָ֛י/ו אֶל תַּ֥חַת הָ/אֵלָ֖ה וַ/יַּגַּֽשׁ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/019.yaml
  text: Then Gideon went in and prepared a young goat and unleavened bread from an ephah of flour[a]. He put the meat in a basket and the broth in a pot[b], and brought them out to him under the terebinth and presented them.
translation:
  language: te
  text: అప్పుడు గిద్యోను లోపలికి వెళ్లి, ఒక మేకపిల్లను, ఒక ఏఫా పిండితో పులియని రొట్టెలను సిద్ధం చేశాడు.[a] మాంసాన్ని ఒక బుట్టలో, పులుసును ఒక కుండలో పెట్టి, వాటిని టెరెబింతు చెట్టు కింద ఉన్న ఆయన దగ్గరికి తీసుకొచ్చి ఆయన ముందు ఉంచాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఒక ఏఫా అనేది ప్రాచీన పొడి కొలమానం; దాని ఖచ్చిత పరిమాణం అనిశ్చితమైనప్పటికీ, సుమారు 22 లీటర్లుగా అంచనా వేస్తారు.
    reason: ప్రాచీన కొలమాన వివరణ
  - marker: b
    text: లేదా, “ఆయన దగ్గరికి తెచ్చి సమర్పించాడు.” హీబ్రూ క్రియకు ‘దగ్గరకు తేవడం’ లేదా ‘సమర్పించడం’ అనే అర్థాలున్నాయి.
    reason: పదార్థ ప్రత్యామ్నాయం
lexical_decisions:
- source_word: בָּא
  choice: లోపలికి వెళ్లి
  rationale: సందర్శకుని దగ్గరనుంచి ఆహారం సిద్ధం చేయడానికి గిద్యోను లోపలికి వెళ్లిన సందర్భాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וַיַּעַשׂ גְּדִי עִזִּים
  choice: ఒక మేకపిల్లను వండి
  rationale: ఆహార సందర్భంలో עשה అంటే సిద్ధం చేయడం; తెలుగులో జంతువును ‘సిద్ధం చేశాడు’ అనడం అస్పష్టంగా ఉండవచ్చు కాబట్టి ‘వండి’ సహజంగా ఉంది.
- source_word: אֵיפַת קֶמַח
  choice: ఒక ఏఫా పిండి
  rationale: మూలంలోని నిర్దిష్ట కొలమానాన్ని నిలుపుతూ, పాఠకుని కోసం పాదసూచికలో సుమారు పరిమాణాన్ని వివరిస్తుంది.
- source_word: מַצּוֹת
  choice: పులియని రొట్టెలు
  rationale: పులియబెట్టే పదార్థం లేకుండా చేసిన రొట్టెలను సూచించే స్పష్టమైన, సాధారణ తెలుగు పదబంధం.
- source_word: הַבָּשָׂר
  choice: మాంసం
  rationale: ఆహార సందర్భంలో సహజమైన తెలుగు సమానార్థకం.
- source_word: סַּל
  choice: బుట్ట
  rationale: మోసుకెళ్లే పాత్రను సూచించే సరళమైన సాధారణ పదం.
- source_word: הַמָּרַק
  choice: దాని రసం
  rationale: వండిన మేకమాంసపు ఉడకనీరు లేదా పులుసును సూచిస్తుంది; ‘దాని’ అన్నది మాంసంతో సంబంధాన్ని స్పష్టం చేస్తుంది.
- source_word: פָּרוּר
  choice: కుండ
  rationale: వండిన ద్రవాన్ని ఉంచే పాత్రకు సహజమైన తెలుగు పదం.
- source_word: וַיּוֹצֵא אֵלָיו
  choice: వాటిని ఆయన దగ్గరికి బయటకు తీసుకొచ్చి
  rationale: హీబ్రూ క్రియ ఏకవచన రూపంలో ఉన్నప్పటికీ, మాంసం మరియు రసం కలిసిన సిద్ధపరిచిన పదార్థాలను సమష్టిగా సూచిస్తుంది; తెలుగులో బహువచనం సహజంగా ఉంటుంది.
- source_word: תַּחַת הָאֵלָה
  choice: మస్తకి చెట్టు కింద
  rationale: אֵלָה సాధారణంగా టెరెబింత్ చెట్టును సూచిస్తుంది; ఆధునిక తెలుగులో దాని వృక్షనామమైన ‘మస్తకి చెట్టు’ను వాడి మూలంలోని నిర్దిష్టతను నిలిపింది.
- source_word: וַיַּגַּשׁ
  choice: ఆయన ముందు ఉంచాడు
  rationale: ‘దగ్గరకు తెచ్చాడు/సమర్పించాడు’ అనే భావాన్ని ఆతిథ్య సందర్భంలో సహజంగా వ్యక్తం చేస్తుంది; బలి అర్పణ అని ముందుగానే నిర్ణయించదు.
theological_decisions:
- issue: గిద్యోను చేసిన కార్యంలో బలి అర్పణ భావం ఉందా
  choice: ఆతిథ్యంగా ఆయన ముందు ఉంచాడు
  alternative: బలిగా అర్పించాడు
  rationale: ఈ వచనంలోని క్రియలు ఆహారం సిద్ధం చేసి, బయటకు తీసుకొచ్చి, దగ్గర ఉంచడాన్నే చెబుతాయి. తరువాతి వచనాల్లో బలి సంబంధమైన ఛాయలు ఏర్పడినా, ఇక్కడే దానిని బలి అని స్పష్టీకరించడం మూలంలో ఉన్న కథన ఉద్వేగాన్ని తొలగిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘ఏఫా’ అనే మూల కొలమానాన్ని నిలిపి పాదసూచికలో వివరించాం. దైవదూతను సూచించే సర్వనామానికి గౌరవార్థక ‘ఆయన’ వాడాం. ‘మస్తకి చెట్టు’ ద్వారా టెరెబింత్‌ను ఓక్ చెట్టుగా మార్చకుండా మూల వృక్షసూచనను కాపాడాం.
