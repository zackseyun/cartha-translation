  text: וַ/יִּקְרָא ל֥/וֹ בַ/יּוֹם הַ/ה֖וּא יְרֻבַּ֣עַל לֵ/אמֹ֑ר יָ֤רֶב בּ/וֹ֙ הַ/בַּ֔עַל כִּ֥י נָתַ֖ץ אֶֽת מִזְבְּחֽ/וֹ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/032.yaml
  text: So on that day he called him Jerubbaal[a], saying, “Let Baal contend against him[b], because he tore down his altar.”
translation:
  language: te
  text: కాబట్టి ఆ రోజున అతనికి యెరుబ్బయలు[a] అని పేరు పెట్టాడు. “బయలు అతనికి వ్యతిరేకంగా వాదించుగాక[b]; ఎందుకంటే అతడు బయలు బలిపీఠాన్ని పడగొట్టాడు.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘యెరుబ్బయలు’ అనే పేరుకు “వాదించు” అనే క్రియతో శబ్దసంబంధం ఉంది; దానికి ఇచ్చిన వివరణ, “బయలు అతనికి వ్యతిరేకంగా వాదించుగాక.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “బయలు అతనికి వ్యతిరేకంగా వాదించుగాక.” హెబ్రీ క్రియను కోరికార్థకంగా అర్థం చేసుకోవచ్చు. కొందరు దాన్ని సూచనార్థకంగా, “బయలు అతనికి వ్యతిరేకంగా వాదిస్తాడు” అని అర్థం చేసుకుంటారు.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקְרָא לוֹ
  choice: అతడు అతనికి ... అని పేరు పెట్టి
  rationale: קרא + ל నిర్మాణం పేరు పెట్టడం లేదా ఒక పేరుతో పిలవడం అనే భావాన్ని ఇస్తుంది. హెబ్రీలోని ఏకవచన కర్తనూ, కర్మనూ స్పష్టపరచకుండా అలాగే నిలుపుతుంది.
- source_word: בַיּוֹם הַהוּא
  choice: ఆ రోజున
  rationale: కాలాన్ని సూచించే సహజమైన ఆధునిక తెలుగు ప్రయోగం; ב ఉపసర్గ భావాన్ని ప్రతిబింబిస్తుంది.
- source_word: יְרֻבַּעַל
  choice: యెరుబ్బయలు
  rationale: వ్యక్తినామాన్ని తెలుగు లిపిలో లిప్యంతరీకరించాం. తరువాతి ירב క్రియతో ఉన్న శబ్దార్థ సంబంధాన్ని వివరణాత్మక వాక్యం మరియు పాదసూచిక తెలియజేస్తాయి.
- source_word: לֵאמֹר
  choice: అన్నాడు
  rationale: పేరుకు ఇచ్చిన వివరణను ప్రత్యక్ష ఉక్తిగా సహజమైన తెలుగు కథన శైలిలో పరిచయం చేస్తుంది.
- source_word: יָרֶב בּוֹ הַבַּעַל
  choice: బయలు అతనితో వాదించుగాక
  rationale: יָרֶב రూపంలోని జస్సివ్ భావాన్ని ‘వాదించుగాక’ నిలుపుతుంది. ריב లోని పోరాడు, వివాదపడు, వ్యాజ్యమాడు అనే విస్తృత ప్రతికూల భావానికి ‘వాదించు’ సహజమైన సమానార్థకం; בּוֹను ‘అతనితో’గా నేరుగా ప్రతిబింబిస్తుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: పేరు లేదా పలుకుకు కారణాన్ని స్పష్టంగా పరిచయం చేస్తుంది.
- source_word: נָתַץ
  choice: పడగొట్టాడు
  rationale: బలిపీఠం వంటి నిర్మాణాన్ని కూల్చడం లేదా ధ్వంసం చేయడం అనే נתץ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: אֶת מִזְבְּחוֹ
  choice: బయలు బలిపీఠాన్ని
  rationale: సర్వనామ ప్రత్యయం సమీపంలోని బయలును సూచిస్తుంది. తెలుగులో ‘అతని బలిపీఠం’ అనడం గిద్యోనును సూచించినట్టు అపార్థం కలిగించవచ్చు కాబట్టి ఉద్దేశిత సంబంధాన్ని స్పష్టం చేశాం.
theological_decisions:
- issue: పోలెమికల్ సందర్భంలో בַּעַל అనే దేవతా నామం/బిరుదు
  choice: బయలు
  alternative: ప్రభువు
  rationale: ఇక్కడ בעל సాధారణంగా ‘ప్రభువు’ లేదా ‘యజమాని’ అని కాక కనానీయ దేవత పేరుగా వాడబడింది. ‘బయలు’ అనడం విగ్రహారాధనపై ఉన్న వ్యతిరేక సందర్భాన్ని నిలిపి, యెహోవాతో గందరగోళాన్ని నివారిస్తుంది.
- issue: יָרֶב క్రియాభావం
  choice: వాదించుగాక
  alternative: వాదిస్తాడు
  rationale: ఈ రూపాన్ని జస్సివ్ కోరిక లేదా సవాలుగా గ్రహించడం సందర్భానికి బాగా సరిపోతుంది; అయితే సూచనార్థక భవిష్యత్ భావం వ్యాకరణపరంగా సాధ్యమే కనుక పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని వాడాం. పేరు వెనుకనున్న పదప్రయోగాన్ని ప్రధాన వాక్యంలోని వివరణతోనూ పాదసూచికతోనూ నిలిపాం; హెబ్రీ క్రియలోని జస్సివ్–సూచనార్థక సందిగ్ధతను తొలగించలేదు.
