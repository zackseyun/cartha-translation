source:
  edition: WLC
  text: וַ/תָּ֥עָז יַד מִדְיָ֖ן עַל יִשְׂרָאֵ֑ל מִ/פְּנֵ֨י מִדְיָ֜ן עָשֽׂוּ לָ/הֶ֣ם בְּנֵ֣י יִשְׂרָאֵ֗ל אֶת הַ/מִּנְהָרוֹת֙ אֲשֶׁ֣ר בֶּֽ/הָרִ֔ים וְ/אֶת הַ/מְּעָר֖וֹת וְ/אֶת הַ/מְּצָדֽוֹת־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/002.yaml
  text: And the hand of Midian prevailed against Israel[a]. Because of Midian, the sons of Israel made for themselves the dens that are in the mountains, and the caves[b], and the strongholds.
translation:
  language: te
  text: మిద్యాను శక్తి ఇశ్రాయేలీయులపై ఆధిపత్యం చెలాయించింది. మిద్యాను కారణంగా ఇశ్రాయేలీయులు కొండల్లో తమ కోసం కలుగులు[a], గుహలు, దుర్గాలు ఏర్పాటు చేసుకున్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘కలుగులు’ అని అనువదించిన హీబ్రూ పదం అరుదైనది; దీనిని ‘బొరియలు,’ ‘దాగుడు స్థలాలు’ లేదా ‘సొరంగాలు’ అని కూడా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּעָז יַד מִדְיָן
  choice: మిద్యాను బలం ... పైచేయి సాధించింది
  rationale: ‘చేయి’ అధికారానికీ శక్తికీ హీబ్రూ నుడికారం. తెలుగులో సహజంగా శత్రువుల ఆధిపత్యాన్ని తెలియజేయడానికి ‘బలం ... పైచేయి సాధించింది’ అని అనువదించాం.
- source_word: עַל יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులపై
  rationale: సందర్భంలో మిద్యాను వారి అణచివేతను సూచిస్తుంది; సమూహాన్ని సహజ తెలుగు రూపంలో తెలిపాం.
- source_word: מִפְּנֵי מִדְיָן
  choice: మిద్యానీయుల భయంతో
  rationale: מִפְּנֵי అనే పదబంధం ఇక్కడ మిద్యాను వారి ముప్పు వల్ల ఆశ్రయాలు చేసుకున్నారని సూచిస్తుంది. ‘భయంతో’ సందర్భార్థాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: עָשׂוּ לָהֶם בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులు ... తమ కోసం ... ఏర్పాటు చేసుకున్నారు
  rationale: చోట్లను కొత్తగా నిర్మించడం లేదా ఆశ్రయాలుగా సిద్ధం చేసుకోవడం రెండింటినీ అనుమతించే విధంగా ‘ఏర్పాటు చేసుకున్నారు’ అని ఇచ్చాం.
- source_word: הַמִּנְהָרוֹת אֲשֶׁר בֶּהָרִים
  choice: కొండల్లో ... కలుగులు
  rationale: మిన్హారోత్ అరుదైన పదం; కొండల్లోని రంధ్రాలు, బొరియలు లేదా దాగుడు స్థలాలను సూచించవచ్చు. ‘కలుగులు’ మూలపదంలోని అనిశ్చితిని కొంతవరకు నిలుపుతూ తరువాతి ‘గుహలు’తో పూర్తిగా కలిసిపోకుండా ఉంటుంది.
- source_word: הַמְּעָרוֹת
  choice: గుహలు
  rationale: సహజ గుహలను సూచించే ప్రామాణిక, స్పష్టమైన తెలుగు పదం.
- source_word: הַמְּצָדוֹת
  choice: దుర్గాలు
  rationale: రక్షణ కలిగించే బలమైన లేదా కోటలాంటి స్థలాలను సంక్షిప్తంగా సూచిస్తుంది.
