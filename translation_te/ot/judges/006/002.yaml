  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా అనువదించాం. హీబ్రూ ‘చేయి’ అనే నుడికారాన్ని అక్షరార్థంగా ఉంచకుండా దాని భావాన్ని ‘బలం’ మరియు ‘పైచేయి’తో తెలిపాం. అరుదైన הַמִּנְהָרוֹת పదంలోని అనిశ్చితిని పాదసూచికలో నిలిపాం.
