  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּ֤פֶן אֵלָי/ו֙ יְהוָ֔ה וַ/יֹּ֗אמֶר לֵ֚ךְ בְּ/כֹחֲ/ךָ֣ זֶ֔ה וְ/הוֹשַׁעְתָּ֥ אֶת יִשְׂרָאֵ֖ל מִ/כַּ֣ף מִדְיָ֑ן הֲ/לֹ֖א שְׁלַחְתִּֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/014.yaml
  text: Then Yahweh turned to him and said[a], “Go in this strength of yours and save Israel from the hand of Midian[b]. Have I not sent you?”
translation:
  language: te
  text: అప్పుడు యహ్వే అతని వైపు తిరిగి, “నీ ఈ బలంతో[a] వెళ్లి, మిద్యాను చేతి నుండి ఇశ్రాయేలును రక్షించు[b]. నేను నిన్ను పంపలేదా?” అని అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నీ ఈ బలంలో.” ఇక్కడి హీబ్రూ విభక్తి ‘తో’ అనే సాధనార్థాన్నిగానీ, ‘లో’ అనే స్థిత్యర్థాన్నిగానీ సూచించవచ్చు; “ఈ” అనే పదం బలాన్ని ప్రత్యేకంగా ఉద్ఘాటిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా “మిద్యాను చేతి నుండి.” ఇది మిద్యాను శక్తి లేదా ఆధిపత్యం నుండి విడిపించడాన్ని సూచించే నుడికారం.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవనామమైన నాలుగు హల్లుల పేరును బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగులో సన్నిహితంగా లిప్యంతరీకరించింది.
- source_word: וַיִּפֶן אֵלָיו
  choice: అతని వైపు తిరిగి
  rationale: פנה యొక్క దిశాత్మక భావాన్ని, אֵלָיו సూచించే ‘అతని వైపు’ అనే భావంతో సహజమైన తెలుగులో నిలిపింది.
- source_word: לֵךְ
  choice: వెళ్లి
  rationale: הלף యొక్క ఆజ్ఞార్థక బలాన్ని నిలుపుతూ, తరువాతి సమన్వయ ఆజ్ఞతో సహజంగా కలిపింది.
- source_word: בְּכֹחֲךָ זֶה
  choice: నీ ఈ బలంతో
  rationale: ‘నీ బలం’తో పాటు זֶה ఇచ్చే సూచనాత్మక ఉద్ఘాటనను నిలిపి, בְ యొక్క సాధనార్థక భావాన్ని ప్రధాన పాఠ్యంలో సహజంగా వ్యక్తం చేసింది.
- source_word: וְהוֹשַׁעְתָּ
  choice: రక్షించు
  rationale: ముందున్న ఆజ్ఞను కొనసాగించే క్రియగా గ్రహించి, ఇశ్రాయేలును శత్రు ఆధిపత్యం నుండి విడిపించే భావాన్ని సాధారణ ఆధునిక పదంతో తెలిపింది.
- source_word: מִכַּף מִדְיָן
  choice: మిద్యాను చేతిలోనుండి
  rationale: כַּף యొక్క ‘చేతి’ రూపకాన్ని నిలిపింది; ఈ సందర్భంలో అది మిద్యాను అధికారాన్ని లేదా ఆధీనాన్ని సూచిస్తుంది.
- source_word: הֲלֹא שְׁלַחְתִּיךָ
  choice: నిన్ను పంపింది నేనే కాదా?
  rationale: הֲלֹא సూచించే సమ్మతిని ఆశించే అలంకార ప్రశ్నను సహజమైన, ఉద్ఘాటనగల తెలుగులో వ్యక్తం చేసింది.
theological_decisions:
- issue: יְהוָה అనే దైవనామాన్ని అనువదించడం
  choice: యహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో ప్రత్యేక దైవనామం నేరుగా ఉన్నందున దానిని సాధారణ బిరుదుగా మార్చకుండా లిప్యంతరీకరించింది.
- issue: దేవుని పంపింపు మాటలోని అలంకార ప్రశ్న
  choice: నిన్ను పంపింది నేనే కాదా?
  alternative: నేనే నిన్ను పంపాను కదా!
  rationale: ప్రకటనగా మార్చకుండా, మూలంలోని ప్రశ్నారూపాన్ని మరియు అది ఆశించే ధృవీకరణను నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు స్పష్టంగా ఉండే శైలిని వాడింది. మూలంలోని ఆజ్ఞ, ‘ఈ’ అనే ఉద్ఘాటన, ‘చేతి’ రూపకం, అలంకార ప్రశ్న అన్నిటినీ నిలిపింది; בְ పదంలోని నిజమైన సందిగ్ధతను పాదటిప్పణిలో తెలిపింది.
