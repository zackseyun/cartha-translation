    rationale: Using “మిద్యాను చేతి నుండి” more transparently marks Midian as the possessor and retains the source’s singular ‘hand’ metaphor.
  - severity: low
    issue: “నిన్ను పంపింది నేనే కాదా?” is somewhat marked and less direct than necessary.
    rationale: “నేను నిన్ను పంపలేదా?” naturally retains the Hebrew rhetorical negative question without changing its force.
