  yaml_path: translation/ot/judges/006/023.yaml
  text: But Yahweh said to him[a], “Peace be to you. Do not fear; you shall not die.”
translation:
  language: te
  text: 'అప్పుడు యాహ్వే అతనితో ఇలా అన్నాడు: “నీకు క్షేమం కలుగుగాక. భయపడకు; నీవు మరణించవు.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అని చెప్పాడు
  rationale: אמר యొక్క కథన రూపాన్ని ఆధునిక తెలుగు కథనశైలిలో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా లిప్యంతరీకరించి నిలుపుతుంది.
- source_word: שָׁלוֹם לְךָ
  choice: నీకు క్షేమం కలుగుగాక
  rationale: שָׁלוֹם ఇక్కడ కేవలం కలహం లేకపోవడమే కాక క్షేమం, భద్రత, ధైర్యం అనే భరోసా భావాన్ని కలిగిస్తుంది; ఈ తెలుగు పదబంధం ఆశీర్వాదం మరియు భరోసా రెండింటినీ సహజంగా తెలియజేస్తుంది.
- source_word: אַל תִּירָא
  choice: భయపడకు
  rationale: నిషేధార్థక భరోసా సూత్రాన్ని సంక్షిప్తంగా, సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: לֹא תָּמוּת
  choice: నీవు చనిపోవు
  rationale: హీబ్రూ అసంపూర్ణ క్రియ ఇక్కడ భవిష్యత్తు గురించి దైవిక భరోసాను వ్యక్తపరుస్తుంది; తెలుగు భవిష్యదర్థక రూపం దానిని నేరుగా నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. కాబట్టి దానిని బిరుదుగా మార్చకుండా, సాధారణంగా అంగీకరించబడిన ‘యాహ్వే’ లిప్యంతరీకరణతో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనదిగానూ సాధారణ పాఠకులకు స్పష్టమైనదిగానూ ఉన్న శైలి. שָׁלוֹם యొక్క విస్తృత భావాన్ని ‘క్షేమం’ ద్వారా ప్రధాన పాఠ్యంలోనే తెలిపినందున పాదసూచిక అవసరం లేదు.
