revisions:
- from: అప్పుడు యాహ్వే అతనితో, “నీకు క్షేమం కలుగుగాక. భయపడకు; నీవు చనిపోవు” అని చెప్పాడు.
  to: 'అప్పుడు యాహ్వే అతనితో ఇలా అన్నాడు: “నీకు క్షేమం కలుగుగాక. భయపడకు; నీవు మరణించవు.”'
  rationale: The revision retains every source element and the draft’s contextual rendering of שָׁלוֹם, while improving Telugu direct-speech syntax and making the future-negative assurance unambiguous. No footnote is required, since the main rendering is faithful and no disputed reading is involved.
