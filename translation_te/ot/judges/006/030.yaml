id: JDG.6.30
reference: Judges 6:30
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֨אמְר֜וּ אַנְשֵׁ֤י הָ/עִיר֙ אֶל יוֹאָ֔שׁ הוֹצֵ֥א אֶת בִּנְ/ךָ֖ וְ/יָמֹ֑ת כִּ֤י נָתַץ֙ אֶת מִזְבַּ֣ח הַ/בַּ֔עַל וְ/כִ֥י כָרַ֖ת הָ/אֲשֵׁרָ֥ה אֲשֶׁר עָלָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/030.yaml
  text: Then the men of the city said to Joash[a], “Bring out your son, that he may die, because he has torn down the altar of Baal and cut down the Asherah that was beside it.”
translation:
  language: te
  text: అప్పుడు పట్టణంలోని పురుషులు యోవాషుతో, “నీ కుమారుణ్ణి బయటికి తీసుకురా; అతడు చనిపోవాలి. ఎందుకంటే అతడు బయలు బలిపీఠాన్ని పడగొట్టి, దాని పక్కన ఉన్న అషేరాను[a] నరికివేశాడు” అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “అషేరా స్తంభాన్ని.” హీబ్రూ పదం అషేరాతో సంబంధమున్న ఆరాధనా వస్తువును సూచించగలదు; ఇక్కడి సందర్భం దేవతను కాక ఆ వస్తువునే సూచిస్తున్నట్లు కనిపిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַנְשֵׁי הָעִיר
  choice: పట్టణంలోని పురుషులు
  rationale: మూలంలోని పుంలింగ బహువచనాన్ని స్పష్టంగా నిలుపుతూ, పట్టణపు పురుష పౌరులను సూచించే సహజమైన ఆధునిక తెలుగు.
- source_word: הוֹצֵא
  choice: బయటికి తీసుకురా
  rationale: హిఫీల్ ఆజ్ఞారూపంలోని ‘బయటికి వచ్చేలా చేయి’ అనే భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וְיָמֹת
  choice: అతడు చనిపోవాలి
  rationale: ఆజ్ఞ తరువాత వచ్చే మరణ డిమాండును తెలుగులో సహజంగా, బలంగా వ్యక్తం చేస్తుంది; ‘చంపబడాలి’ అని న్యాయపరమైన విధానాన్ని అదనంగా నిర్దేశించదు.
- source_word: נָתַץ
  choice: పడగొట్టి
  rationale: బలిపీఠం వంటి నిర్మాణాన్ని కూల్చివేయడాన్ని తెలుగులో సహజంగా సూచిస్తుంది.
- source_word: מִזְבַּח הַבַּעַל
  choice: బయలు బలిపీఠాన్ని
  rationale: నిర్మాణ సంబంధాన్ని స్పష్టంగా, తెలుగు బైబిలు వినియోగానికి అనుగుణంగా తెలియజేస్తుంది.
- source_word: כָרַת
  choice: నరికివేశాడు
  rationale: చెక్కతో చేసిన ఆరాధనా వస్తువును నరికి తొలగించడాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: הָאֲשֵׁרָה
  choice: అషేరాను
  rationale: హీబ్రూ పదంలోని దేవత/ఆరాధనా వస్తువు సంబంధిత అస్పష్టతను ఒకే నిర్దిష్ట రూపంలో పరిష్కరించకుండా పేరును నిలుపుతుంది; సందర్భం వస్తువును సూచిస్తుందని పాదటిప్పణి వివరిస్తుంది.
- source_word: אֲשֶׁר עָלָיו
  choice: దాని పక్కన ఉన్న
  rationale: עַל ఇక్కడ ‘మీద’ లేదా ‘పక్కన’ అనే స్థానార్థాలను అనుమతిస్తుంది; ఆరాధనా అమరిక సందర్భంలో ‘పక్కన’ అత్యంత సంభావ్యమైన, సహజమైన అర్థం.
theological_decisions:
- issue: אֲשֵׁרָה పదం దేవతను సూచిస్తుందా, ఆరాధనా వస్తువును సూచిస్తుందా
  choice: అషేరా
  alternative: అషేరా స్తంభం; అషేరా దేవత
  rationale: ‘నరికివేశాడు’ అనే క్రియ సందర్భంలో ఆరాధనా వస్తువే ఉద్దేశమని బలంగా సూచించినా, మూలపదం స్వయంగా ‘స్తంభం’ అని నిర్దిష్టంగా చెప్పదు. అందువల్ల పేరును ప్రధాన పాఠ్యంలో ఉంచి ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో తెలిపాం.
- issue: וְיָמֹת యొక్క ఆజ్ఞాత్మక/ఫలితార్థ బలం
  choice: అతడు చనిపోవాలి
  alternative: అతడు చనిపోయేలా; అతణ్ణి చంపాలి
  rationale: మూలంలోని మరణ డిమాండును స్పష్టంగా నిలుపుతుంది; అయితే పాఠ్యంలో లేని అధికారిక న్యాయశిక్ష విధానాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ‘పురుషులు’ ద్వారా మూలంలోని లింగ సూచనను, ‘అషేరా’ ద్వారా మూలంలోని పదార్థ అస్పష్టతను నిలిపాం.
