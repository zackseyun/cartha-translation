id: JDG.6.34
reference: Judges 6:34
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/ר֣וּחַ יְהוָ֔ה לָבְשָׁ֖ה אֶת גִּדְע֑וֹן וַ/יִּתְקַע֙ בַּ/שּׁוֹפָ֔ר וַ/יִזָּעֵ֥ק אֲבִיעֶ֖זֶר אַחֲרָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/034.yaml
  text: Then the Spirit of Yahweh clothed Gideon[a], and he blew the trumpet[c][b], and Abiezer was summoned after him.
translation:
  language: te
  text: అప్పుడు యెహోవా ఆత్మ గిద్యోనును ధరించింది[a]. అతడు బూర ఊదాడు[b]; అబీయెజెరు వంశస్థులు అతని వెంబడి పిలువబడ్డారు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యెహోవా ఆత్మ గిద్యోనుమీదికి వచ్చింది.” అక్షరార్థంగా, “యెహోవా ఆత్మ గిద్యోనును ధరించింది.”
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడి హీబ్రూ పదం షోఫార్; ఇది సంకేతమివ్వడానికి ఉపయోగించే కొమ్ము వాద్యం.
    reason: cultural_note
  - marker: c
    text: లేదా, “అబీయెజెరు వంశస్థులు అతని వెనుక సమకూడారు” లేదా “అతని వెనుక చేరారు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרוּחַ יְהוָה
  choice: యెహోవా ఆత్మ
  rationale: ఈ కథనంలో רוּחַ దైవిక శక్తినిచ్చే ఆత్మను సూచిస్తుంది. יְהוָה అనే ఒడంబడిక నామాన్ని ‘యెహోవా’గా లిప్యంతరీకరించాం.
- source_word: לָבְשָׁה אֶת־גִּדְעוֹן
  choice: గిద్యోనును వస్త్రంలా ధరించింది
  rationale: లבשׁ యొక్క ‘వస్త్రాన్ని ధరించు’ అనే సజీవ రూపకాన్ని నిలుపుతూ, ఆత్మ గిద్యోనును ఆవరించిందని సులభంగా గ్రహించేందుకు ‘వస్త్రంలా’ చేర్చాం.
- source_word: וַיִּתְקַע בַּשּׁוֹפָר
  choice: అతడు బూర ఊదగా
  rationale: שׁוֹפָר సంకేతమివ్వడానికి ఉపయోగించే కొమ్ము వాద్యం. ఆధునిక తెలుగు పాఠకులకు సహజమైన ‘బూర’ ప్రధాన పాఠ్యంలో వాడాం.
- source_word: וַיִּזָּעֵק
  choice: సమకూడారు
  rationale: నిఫ్అల్ రూపం పిలుపుకు స్పందించి కూడడం లేదా సమీకరించబడడం అనే భావాన్ని ఇస్తుంది. తెలుగు సహజత్వం కోసం కర్తృప్రయోగంలో ‘సమకూడారు’ అని ఇచ్చాం; పాదటిప్పణిలో నిష్క్రియ ప్రత్యామ్నాయాన్ని నిలిపాం.
- source_word: אֲבִיעֶזֶר
  choice: అబీయెజెరు వంశస్థులు
  rationale: ఇక్కడ వ్యక్తికన్నా గిద్యోను చెందిన అబీయెజెరు వంశం లేదా గోత్రశాఖ ఉద్దేశించబడింది; తెలుగులో అపార్థం రాకుండా సమూహార్థాన్ని స్పష్టం చేశాం.
- source_word: אַחֲרָיו
  choice: అతని వెనుక
  rationale: ఈ పదబంధం దిశతోపాటు గిద్యోనుకు మద్దతుగా అతన్ని అనుసరించి సమకూడిన భావాన్ని కూడా నిలుపుతుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు; యాహ్వే
  rationale: మూలపాఠంలోని ప్రత్యేక ఒడంబడిక నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించదగిన రూపంలో లిప్యంతరీకరించాం.
- issue: ఆత్మ గిద్యోనును ‘ధరించడం’ అనే రూపకం
  choice: గిద్యోనును వస్త్రంలా ధరించింది
  alternative: గిద్యోనుమీదికి వచ్చింది; గిద్యోనును ఆవరించింది
  rationale: హీబ్రూ వాక్యంలో ఆత్మ కర్తగా, గిద్యోను ప్రత్యక్ష కర్మగా ఉన్న అసాధారణమైన ధార్మిక రూపకాన్ని వ్యాఖ్యానించి సద్దుమణగించకుండా నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. మూలంలోని సజీవ ‘ధరించడం’ రూపకాన్ని ప్రధాన పాఠ్యంలో నిలిపి, మరింత పరిచితమైన భావానువాదాన్ని పాదటిప్పణిలో ఇచ్చాం. ‘అబీయెజెరు’ సమూహనామమని ప్రధాన పాఠ్యంలో స్పష్టం చేశాం.
