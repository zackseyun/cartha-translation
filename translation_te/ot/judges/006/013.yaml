source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אֵלָ֤י/ו גִּדְעוֹן֙ בִּ֣י אֲדֹנִ֔/י וְ/יֵ֤שׁ יְהוָה֙ עִמָּ֔/נוּ וְ/לָ֥/מָּה מְצָאַ֖תְ/נוּ כָּל זֹ֑את וְ/אַיֵּ֣ה כָֽל נִפְלְאֹתָ֡י/ו אֲשֶׁר֩ סִפְּרוּ לָ֨/נוּ אֲבוֹתֵ֜י/נוּ לֵ/אמֹ֗ר הֲ/לֹ֤א מִ/מִּצְרַ֨יִם֙ הֶעֱלָ֣/נוּ יְהוָ֔ה וְ/עַתָּה֙ נְטָשָׁ֣/נוּ יְהוָ֔ה וַֽ/יִּתְּנֵ֖/נוּ בְּ/כַף מִדְיָֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/013.yaml
  text: Gideon said to him[a], “Please, my lord, if Yahweh is with us, why then has all this happened to us? And where are all his wonders that our fathers told us about, saying[c][b], ‘Did not Yahweh bring us up from Egypt?’ But now Yahweh has abandoned us and given us into the hand of Midian.”
translation:
  language: te
  text: 'గిద్యోను ఆయనతో ఇలా అన్నాడు: “దయచేసి, అయ్యా,[a] యాహ్వే మనతో ఉంటే, ఇదంతా మనకు ఎందుకు సంభవించింది? మన పితరులు మనకు చెప్పిన ఆయన అద్భుత కార్యాలన్నీ[b] ఎక్కడ ఉన్నాయి? వారు, ‘యాహ్వే మనల్ని ఐగుప్తు నుండి పైకి తీసుకురాలేదా?’ అని చెప్పలేదా? కానీ ఇప్పుడు యాహ్వే మనల్ని విడిచిపెట్టి మిద్యాను చేతికి[c] అప్పగించాడు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “క్షమించండి, అయ్యా.” హీబ్రూలో ఇది మర్యాదపూర్వకంగా మాట ప్రారంభించే సంబోధన.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ఆయన అద్భుతాలన్నీ” లేదా “ఆయన ఆశ్చర్యకార్యాలన్నీ.”
    reason: lexical_alternative
  - marker: c
    text: అక్షరార్థంగా, “మిద్యాను చేతికి.” ఇది మిద్యాను అధికారానికి అప్పగించడాన్ని తెలిపే హీబ్రూ నుడికారం.
    reason: idiom
lexical_decisions:
- source_word: בִּי אֲדֹנִי
  choice: దయచేసి వినండి, అయ్యా
  rationale: בִּי మర్యాదపూర్వక వినతిని, אֲדֹנִי గౌరవసూచక సంబోధనను తెలియజేస్తాయి. ఈ సందర్భంలో దైవబిరుదుగా ముందే నిర్ణయించకుండా సహజమైన ఆధునిక తెలుగు సంబోధనను వాడాం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించదగిన రూపంలో లిప్యంతరీకరించాం.
- source_word: וְיֵשׁ יְהוָה עִמָּנוּ
  choice: యెహోవా మనతో ఉంటే
  rationale: అక్షరార్థంగా ‘మరియు యెహోవా మనతో ఉన్నాడు’ అనే నిర్మాణం ఉన్నప్పటికీ, తరువాతి ‘ఎందుకు’ ప్రశ్నతో కలిపి ఇది షరతుతో కూడిన సవాలుగా పనిచేస్తుంది.
- source_word: לָמָּה מְצָאַתְנוּ כָּל זֹאת
  choice: ఇదంతా మనకు ఎందుకు సంభవించింది?
  rationale: విపత్తు కర్తగా వచ్చే מצא ‘ఎదురవడం/సంభవించడం’ అనే భావాన్ని ఇస్తుంది; తెలుగులో సహజంగా ‘సంభవించింది’ అని ఇచ్చాం.
- source_word: נִפְלְאֹתָיו
  choice: ఆయన అద్భుత కార్యాలన్నీ
  rationale: ఈ పదం ఆశ్చర్యాన్ని కలిగించే అసాధారణ దైవకార్యాలను సూచిస్తుంది. కేవలం భావోద్వేగ ‘అద్భుతాలు’ కంటే క్రియాత్మక భావాన్ని స్పష్టం చేయడానికి ‘అద్భుత కార్యాలు’ అన్నాం.
- source_word: סִפְּרוּ לָנוּ אֲבוֹתֵינוּ
  choice: మన పితరులు మనకు వివరించిన
  rationale: סִפֵּר జరిగిన కార్యాలను చెప్పడం లేదా వివరించడం; אֲבוֹתֵינוּ ఇశ్రాయేలు పూర్వపితరులను సూచిస్తుంది.
- source_word: הֲלֹא מִמִּצְרַיִם הֶעֱלָנוּ יְהוָה
  choice: యెహోవా మనల్ని ఐగుప్తు నుండి పైకి తీసుకురాలేదా?
  rationale: ప్రశ్నకు అవుననే సమాధానం ఆశించబడుతుంది. నిర్గమానికి సంబంధించిన ‘పైకి తీసుకురావడం’ అనే మూలభాషా రూపకాన్ని నిలిపాం.
- source_word: נְטָשָׁנוּ
  choice: మనల్ని విడిచిపెట్టి
  rationale: נטש విడిచివేయడం లేదా పరిత్యజించడం అనే బలమైన భావాన్ని ఇస్తుంది; ఆధునిక తెలుగులో స్పష్టమైన రూపాన్ని ఎంచుకున్నాం.
- source_word: וַיִּתְּנֵנוּ בְּכַף מִדְיָן
  choice: మిద్యాను చేతికి అప్పగించాడు
  rationale: ‘చేతిలో ఇవ్వడం’ అనే హీబ్రూ నుడికారం మరొకరి అధికారానికి అప్పగించడాన్ని సూచిస్తుంది. రూపకాన్ని ప్రధాన పాఠ్యంలో నిలిపి, పాదటిప్పణిలో అర్థాన్ని తెలిపాం.
- source_word: מִדְיָן
  choice: మిద్యాను
  rationale: ప్రజాసమూహం/దేశం పేరుకు తెలుగులో సుపరిచితమైన లిప్యంతరీకరణ.
theological_decisions:
- issue: יְהוָה దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో వ్యక్తిగత దైవనామమే ఉంది. బిరుదైన ‘ప్రభువు’తో దానిని భర్తీ చేయకుండా పేరు రూపంలో ఉంచాం; తెలుగులో సాధారణంగా గుర్తించబడే ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం.
- issue: אֲדֹנִי సంబోధన ఎవరిని ఎలా సూచిస్తుంది
  choice: మర్యాదపూర్వక మానవ సంబోధనగా ‘అయ్యా’
  alternative: దైవబిరుదుగా ‘ప్రభువా’
  rationale: ఈ దశలో గిద్యోను దూతను గౌరవంగా సంబోధిస్తున్నాడని వాక్యనిర్మాణం అనుమతిస్తుంది; అతని గుర్తింపుపై తరువాతి కథనం ఇచ్చే ఉద్వేగాన్ని ముందుగానే పరిష్కరించలేదు.
- issue: וְיֵשׁ నిర్మాణంలోని సంబంధం
  choice: షరతుగా ‘ఉంటే’
  alternative: అక్షరార్థ సముచ్చయంగా ‘మరియు ... ఉన్నాడు’
  rationale: గిద్యోను అడిగే తదుపరి కారణప్రశ్నలో ఈ మాట షరతుతో కూడిన ప్రతివాదంగా సహజంగా అర్థమవుతుంది; అయినా మూలంలోని సంక్షిప్తత కారణంగా ప్రత్యామ్నాయ నిర్మాణం సాధ్యమే.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరతను నిలుపుతూ సాధారణ పాఠకులకు స్పష్టంగా ఉండే వాక్యనిర్మాణం. ‘అయ్యా’ గౌరవాన్ని చూపుతుంది గాని ఈ దశలో దైవత్వాన్ని ముందే నిర్ధారించదు. ‘పైకి తీసుకురావడం’ మరియు ‘చేతికి అప్పగించడం’ వంటి మూల రూపకాలను సాధ్యమైనంతవరకు నిలిపాం.
