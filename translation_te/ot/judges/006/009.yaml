id: JDG.6.9
reference: Judges 6:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וָ/אַצִּ֤ל אֶתְ/כֶם֙ מִ/יַּ֣ד מִצְרַ֔יִם וּ/מִ/יַּ֖ד כָּל לֹחֲצֵי/כֶ֑ם וָ/אֲגָרֵ֤שׁ אוֹתָ/ם֙ מִ/פְּנֵי/כֶ֔ם וָ/אֶתְּנָ֥/ה לָ/כֶ֖ם אֶת אַרְצָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/009.yaml
  text: And I delivered you from the hand of Egypt and from the hand of all your oppressors, and I drove them out from before you and gave you their land.
translation:
  language: te
  text: నేను మిమ్మల్ని ఐగుప్తు చేతిలోనుండి, మిమ్మల్ని అణచివేసిన వారందరి చేతిలోనుండి విడిపించాను. వారిని మీ ఎదుటనుండి వెళ్లగొట్టి, వారి భూమిని మీకు ఇచ్చాను.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאַצִּל
  choice: విడిపించాను
  rationale: נצל అనే క్రియ ప్రమాదం లేదా మరొకరి అధికారం నుంచి రక్షించి విడిపించడాన్ని సూచిస్తుంది. సందర్భంలో ‘విడిపించాను’ సహజంగా ఉండి దైవిక రక్షణను స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: מִיַּד
  choice: చేతిలోనుండి
  rationale: ‘చెయ్యి’ అధికారం లేదా అదుపును సూచించే హీబ్రూ రూపకాన్ని తెలుగులోనూ అర్థమయ్యే విధంగా నిలుపుతుంది.
- source_word: מִצְרַיִם
  choice: ఐగుప్తు
  rationale: దేశం/జాతిని సూచించే מִצְרַיִםకు ప్రామాణిక తెలుగు బైబిలు నామరూపం.
- source_word: כָּל לֹחֲצֵיכֶם
  choice: మిమ్మల్ని అణచివేసిన వారందరి
  rationale: לֹחֲצֵי అనే రూపం ఒత్తిడి చేసి బాధించే లేదా అణచివేసే వారిని సూచిస్తుంది. ‘శత్రువులు’ అనే విస్తృత పదం కంటే ఇది మూలార్థాన్ని కచ్చితంగా తెలియజేస్తుంది.
- source_word: וָאֲגָרֵשׁ
  choice: వెళ్లగొట్టి
  rationale: גרש బలవంతంగా బయటకు పంపడం లేదా తరిమివేయడం అనే భావాన్ని కలిగిస్తుంది. ‘వెళ్లగొట్టి’ ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: מִפְּנֵיכֶם
  choice: మీ ఎదుటనుండి
  rationale: మూలంలోని ‘మీ ముఖం/సన్నిధి ఎదుటనుండి’ అనే ప్రదేశాత్మక నుడికారాన్ని అర్థవంతంగా నిలుపుతుంది.
- source_word: וָאֶתְּנָה לָכֶם אֶת אַרְצָם
  choice: వారి దేశాన్ని మీకు ఇచ్చాను
  rationale: נתן క్రియతో ఉన్న ప్రత్యక్ష, పరోక్ష కర్మలను సహజమైన తెలుగు పదక్రమంలో కచ్చితంగా అందిస్తుంది. אֶרֶץ ఇక్కడ జనులు అధీనంలో ఉంచుకున్న భూభాగాన్ని సూచించేందున ‘దేశం’ అనువైనది.
theological_decisions:
- issue: ఇశ్రాయేలు విమోచనలోను దేశ స్వాధీనంలోను దేవుని కార్యసాధకత్వం
  choice: విడిపించడం, వెళ్లగొట్టడం, దేశాన్ని ఇవ్వడం—మూడు కార్యాలకూ దేవుడే ప్రథమ పురుష కర్తగా స్పష్టంగా నిలుస్తాడు.
  alternative: కర్తను పరోక్షంగా ఉంచడం లేదా సంఘటనలను మాత్రమే వివరించడం.
  rationale: హీబ్రూ ప్రథమ పురుష క్రియలు యెహోవా ప్రత్యక్ష కార్యసాధకత్వాన్ని నొక్కిచెబుతాయి. మూలంలో ఉన్నదానికంటే అదనపు సిద్ధాంత వివరణను చేర్చకుండా ఆ నొక్కింపును అనువాదం కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ‘చేతిలోనుండి’, ‘మీ ఎదుటనుండి’ అనే మూల నుడికారాలను తెలుగులో పారదర్శకంగా ఉన్నందున నిలిపాం. పాదటిప్పణులు అవసరం లేదు.
