source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יוֹאָ֡שׁ לְ/כֹל֩ אֲשֶׁר עָמְד֨וּ עָלָ֜י/ו הַ/אַתֶּ֣ם תְּרִיב֣וּ/ן לַ/בַּ֗עַל אִם אַתֶּם֙ תּוֹשִׁיע֣וּ/ן אוֹת֔/וֹ אֲשֶׁ֨ר יָרִ֥יב ל֛/וֹ יוּמַ֖ת עַד הַ/בֹּ֑קֶר אִם אֱלֹהִ֥ים הוּא֙ יָ֣רֶב ל֔/וֹ כִּ֥י נָתַ֖ץ אֶֽת מִזְבְּחֽ/וֹ־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/031.yaml
  text: But Joash said to all who stood against him[a], “Will you contend for Baal? Will you save him? Whoever contends for him shall be put to death by morning. If he is a god, let him contend for himself, because his altar has been torn down.”
translation:
  language: te
  text: 'అయితే యోవాషు తనను ఎదిరించి నిలబడిన వారందరితో ఇలా అన్నాడు: “బయలు పక్షాన మీరే వాదిస్తారా? మీరే అతణ్ణి రక్షిస్తారా? అతని పక్షాన వాదించేవాడు ఉదయం కల్లా చంపబడతాడు. అతడు ఒక దేవుడైతే, తానే తన పక్షాన వాదించుకోనివ్వండి; ఎందుకంటే ఎవరో అతని బలిపీఠాన్ని కూలగొట్టాడు[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో, “ఎందుకంటే అతడు అతని బలిపీఠాన్ని కూలగొట్టాడు.” కర్త పేరు చెప్పబడలేదు; సందర్భంలో అది గిద్యోనును సూచించవచ్చు.
    reason: హీబ్రూ కర్తృవాచక పుంలింగ ఏకవచన క్రియను మరియు కర్త గురించిన సందర్భానుసార అస్పష్టతను సంరక్షించడానికి.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అయితే ... అన్నాడు
  rationale: సందర్భంలో నిందారోపణకు యోవాషు విరుద్ధంగా స్పందిస్తున్నందున వావ్‌కు ఇక్కడ సహజమైన వ్యతిరేక మలుపును సూచిస్తుంది.
- source_word: עָמְדוּ עָלָיו
  choice: తనకు ఎదిరిగా నిలబడిన
  rationale: ఇది కేవలం స్థలసంబంధమైన నిలబడటాన్ని కాక, యోవాషును ఎదుర్కొంటున్న ప్రజల ప్రతికూల వైఖరిని సూచిస్తుంది.
- source_word: תְּרִיבוּן / יָרִיב / יָרֶב
  choice: వాదిస్తారా / వాదించేవాడు / వాదించుకోవాలి
  rationale: రివ్ అనే ఒకే మూలపదం కలిగించే వాక్చాతుర్య పునరావృతిని నిలుపుతూ, న్యాయవివాదం మరియు పోరాటం రెండింటి ఛాయను అతిగా నిర్దిష్టం చేయకుండా వ్యక్తం చేస్తుంది.
- source_word: תּוֹשִׁיעוּן
  choice: రక్షిస్తారా
  rationale: ప్రజలే తమ దేవుణ్ణి రక్షించాలా అనే వ్యంగ్యాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: אֲשֶׁר יָרִיב לוֹ
  choice: అతని పక్షాన వాదించేవాడు
  rationale: అనిర్దిష్ట సంబంధవాచక నిర్మాణాన్ని సాధారణ నియమంలా సహజంగా వ్యక్తం చేస్తుంది.
- source_word: יוּמַת עַד הַבֹּקֶר
  choice: ఉదయం కల్లా చంపబడతాడు
  rationale: హోఫల్ క్రియలోని కర్మణి భావాన్ని, అలాగే రాబోయే ఉదయాన్ని గడువుగా సూచించే మాటను నిలుపుతుంది.
- source_word: אֱלֹהִים הוּא
  choice: అతడు ఒక దేవుడైతే
  rationale: ఇక్కడ ఇశ్రాయేలు దేవుణ్ణి కాక, బయలు నిజంగా దేవత అని చెప్పుకునే హక్కును షరతుగా పరీక్షిస్తున్నారు; అందువల్ల ‘ఒక దేవుడు’ సరైన భావం.
- source_word: כִּי נָתַץ אֶת מִזְבְּחוֹ
  choice: ఎందుకంటే అతని బలిపీఠం కూల్చివేయబడింది
  rationale: హీబ్రూ క్రియ పుంలింగ ఏకవచనంలో ఉన్నా కర్త స్పష్టంగా పేర్కొనబడలేదు. ప్రధాన పాఠ్యంలో కర్మణి నిర్మాణం వాడటం ద్వారా బలిపీఠం కూల్చబడిన వాస్తవాన్ని ముందుకు తెచ్చి, కర్తను అదనంగా చేర్చకుండా ఉంటుంది; ప్రత్యామ్నాయ సకర్మక పఠనం పాదసూచికలో ఇవ్వబడింది.
theological_decisions:
- issue: אֱלֹהִים అనే పదం బయలును సూచించడం
  choice: ‘ఒక దేవుడు’ అని అనువదించడం
  alternative: ‘దేవుడు’ అని అనువదించడం
  rationale: యోవాషు బయలును నిజ దేవుడిగా అంగీకరించడం లేదు; అతడు దేవుడని చెప్పుకునే హక్కును వ్యంగ్యపూర్వకమైన షరతుతో పరీక్షిస్తున్నాడు. ‘ఒక దేవుడు’ ఈ భావాన్ని మతపరమైన అదనపు వ్యాఖ్యానం లేకుండా స్పష్టం చేస్తుంది.
- issue: చివరి ఉపవాక్యంలో కర్త ఎవరు అనే అస్పష్టత
  choice: ప్రధాన పాఠ్యంలో ‘అతని బలిపీఠం కూల్చివేయబడింది’
  alternative: ‘అతడు అతని బలిపీఠాన్ని కూలగొట్టాడు’—అక్కడ సూచిత కర్త గిద్యోను
  rationale: మూలంలో క్రియకు స్పష్టమైన నామవాచక కర్త లేదు. కర్మణి అనువాదం కర్తను నిర్ణయించకుండా ఉంచుతుంది; గిద్యోను సూచిత కర్తగా గ్రహించే సాధ్యమైన పఠనాన్ని పాదసూచిక సంరక్షిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘వాదించు’ అనే పదాన్ని పునరావృతం చేసి హీబ్రూ ריב మూలపదపు వాక్చాతుర్యాన్ని సాధ్యమైనంతవరకు నిలిపాం. బయలుకు అనవసర గౌరవార్థక రూపాలు ఇవ్వకుండా, సాధారణ పుంలింగ ఏకవచన సర్వనామాలు వాడాం.
