revisions:
- from: 'అయితే యోవాషు తనకు ఎదిరిగా నిలబడిన వారందరితో ఇలా అన్నాడు: “బయలు పక్షాన మీరే వాదిస్తారా? మీరే అతణ్ణి రక్షిస్తారా? అతని పక్షాన వాదించేవాడు ఉదయం కల్లా చంపబడతాడు. అతడు ఒక దేవుడైతే, తన పక్షాన తానే వాదించుకోవాలి; ఎందుకంటే అతని బలిపీఠం కూల్చివేయబడింది[a].”'
  to: 'అయితే యోవాషు తనను ఎదిరించి నిలబడిన వారందరితో ఇలా అన్నాడు: “బయలు పక్షాన మీరే వాదిస్తారా? మీరే అతణ్ణి రక్షిస్తారా? అతని పక్షాన వాదించేవాడు ఉదయం కల్లా చంపబడతాడు. అతడు ఒక దేవుడైతే, తానే తన పక్షాన వాదించుకోనివ్వండి; ఎందుకంటే ఎవరో అతని బలిపీఠాన్ని కూలగొట్టాడు[a].”'
  rationale: సవరణ చివరి ఉపవాక్యంలో మూల హీబ్రూ కర్తృవాచక క్రియను పునరుద్ధరిస్తుంది, అయితే కర్తను గిద్యోనుగా ప్రధాన పాఠ్యంలో నిర్దిష్టపరచదు. స్వల్ప శైలీ సవరణలు ఆధునిక ప్రామాణిక తెలుగు సహజత్వాన్ని మెరుగుపరుస్తాయి; రీబ్ పునరావృతం, బెయలు గురించిన షరతుపూర్వక వ్యంగ్యం, మరియు ఉదయం వరకు మరణశిక్ష గడువు అన్నీ నిలిచాయి.
