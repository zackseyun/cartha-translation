    rationale: נָתַץ (“అతడు కూలగొట్టాడు”)కు కర్త స్పష్టంగా చెప్పబడకపోయినా అది కర్తృవాచకమే. “కూల్చివేయబడింది” చర్య చేసిన వ్యక్తిని పూర్తిగా తొలగించి వ్యాకరణిక స్వరాన్ని మారుస్తుంది.
