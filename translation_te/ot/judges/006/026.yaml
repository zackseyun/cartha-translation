id: JDG.6.26
reference: Judges 6:26
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/בָנִ֨יתָ מִזְבֵּ֜חַ לַ/יהוָ֣ה אֱלֹהֶ֗י/ךָ עַ֣ל רֹ֧אשׁ הַ/מָּע֛וֹז הַ/זֶּ֖ה בַּ/מַּֽעֲרָכָ֑ה וְ/לָֽקַחְתָּ֙ אֶת הַ/פָּ֣ר הַ/שֵּׁנִ֔י וְ/הַעֲלִ֣יתָ עוֹלָ֔ה בַּ/עֲצֵ֥י הָ/אֲשֵׁרָ֖ה אֲשֶׁ֥ר תִּכְרֹֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/026.yaml
  text: Then build an altar to Yahweh your God on the top of this stronghold[a], in orderly arrangement, and take the second bull and offer it up as a burnt offering with the wood of the Asherah that you cut down.
translation:
  language: te
  text: నీ దేవుడైన యాహ్వేకు ఈ దుర్గం శిఖరంపై తగిన క్రమంలో[a] ఒక బలిపీఠాన్ని కట్టు. రెండో ఎద్దును తీసుకొని, నీవు నరికివేసే అషేరా[b] కట్టెలతో దాన్ని దహనబలిగా అర్పించు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “క్రమబద్ధమైన అమరికతో.” ఇక్కడి హెబ్రీ పదం ఏర్పాటు లేదా వరుస క్రమాన్ని సూచిస్తుంది; ఖచ్చితమైన భావం అనిశ్చితం.
    reason: మూల పదబంధంలోని నిర్మాణాత్మక అనిశ్చితిని సంరక్షించడం.
  - marker: b
    text: అషేరా అనేది అషేరాతో సంబంధమున్న చెక్క ఆరాధనా వస్తువును సూచించవచ్చు; దాని ఖచ్చిత రూపం—స్తంభమా, చెట్టా, చెక్క విగ్రహమా—స్పష్టంగా లేదు.
    reason: వివాదాస్పదమైన ఆరాధనా వస్తువు రూపాన్ని అతిగా నిర్దిష్టం చేయకుండా వివరించడం.
lexical_decisions:
- source_word: וּבָנִיתָ
  choice: కట్టు
  rationale: సందర్భంలో వరుసగా ఇచ్చిన ఆజ్ఞను తెలుగులో సహజమైన ఏకవచన ఆజ్ఞారూపంతో వ్యక్తం చేసింది.
- source_word: מִזְבֵּחַ
  choice: బలిపీఠం
  rationale: బలులు అర్పించే నిర్మాణానికి ప్రామాణికమైన, సాధారణంగా అర్థమయ్యే తెలుగు పదం.
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: నీ దేవుడైన యాహ్వేకు
  rationale: ఒడంబడిక నామాన్ని లిప్యంతరీకరించి, ‘నీ దేవుడు’ అనే ప్రత్యక్ష సంబంధపూర్వక సంబోధనను నిలిపింది.
- source_word: עַל רֹאשׁ הַמָּעוֹז הַזֶּה
  choice: ఈ దుర్గం శిఖరంపై
  rationale: רֹאשׁ యొక్క ‘పైభాగం/శిఖరం’ భావాన్ని, מָעוֹז యొక్క బలమైన లేదా రక్షిత స్థలం భావాన్ని సంక్షిప్తంగా నిలిపింది.
- source_word: בַּמַּעֲרָכָה
  choice: తగిన క్రమంలో[a]
  rationale: ఏర్పాటు లేదా క్రమబద్ధమైన అమరిక అనే భావాన్ని అతిగా నిర్దిష్టం చేయకుండా సహజ తెలుగులో తెలిపింది; పదబంధంలోని అనిశ్చితిని పాదసూచికలో ఉంచింది.
- source_word: הַפָּר הַשֵּׁנִי
  choice: రెండో ఎద్దు
  rationale: ‘రెండోది’ అనే సందర్భసంబంధ భేదాన్ని, פַּר యొక్క సాధారణ అర్థమైన ‘ఎద్దు’ను యథాతథంగా ఉంచింది.
- source_word: וְהַעֲלִיתָ עוֹלָה
  choice: దాన్ని దహనబలిగా అర్పించు
  rationale: బలి మొత్తాన్ని దహనం చేసే సాంకేతిక బలిపదబంధాన్ని సహజమైన తెలుగు ఆరాధనా పదజాలంతో తెలిపింది.
- source_word: בַּעֲצֵי הָאֲשֵׁרָה
  choice: అషేరా[b] కట్టెలతో
  rationale: కట్టెలు ఇంధనంగా ఉపయోగించబడుతున్న భావాన్ని నిలిపి, అషేరా అనే పదం సూచించే వస్తువు యొక్క ఖచ్చిత రూపాన్ని ప్రధాన వాక్యంలో నిర్ధారించలేదు.
- source_word: אֲשֶׁר תִּכְרֹת
  choice: నీవు నరికివేసే
  rationale: ఇప్పుడిచ్చిన ఆజ్ఞ ప్రకారం నరికివేయబోయే అషేరాను సూచించే సంబంధ వాక్యంగా అనువదించింది.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలంలో ఉన్న నాలుగు అక్షరాల వ్యక్తిగత దైవనామాన్ని బిరుదుతో మార్చకుండా, సాధారణంగా పునర్నిర్మించబడిన ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించింది.
- issue: אֲשֵׁרָה యొక్క సూచన
  choice: అషేరా
  alternative: అషేరా స్తంభం; అషేరాకు సంబంధించిన చెక్క విగ్రహం
  rationale: ఇది అషేరాతో సంబంధమున్న ఆరాధనా వస్తువును సూచించవచ్చు; అయితే దాని ఖచ్చిత భౌతిక రూపం వివాదాస్పదం కాబట్టి ప్రధాన పాఠం మరింత నిర్దిష్టంగా చెప్పదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకుడికి సులభంగా అర్థమయ్యే ఆజ్ఞారూప శైలి వాడబడింది. ‘తగిన క్రమంలో’ అనే పదబంధం మూలంలోని అస్పష్టతను పూర్తిగా తొలగించకుండా సహజంగా చదవడానికి ఎంపికైంది.
