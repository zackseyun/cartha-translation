lexical_decisions:
- source_word: וַיְהִי כִּי
  choice: '…మొరపెట్టుకున్నప్పుడు, ఇలా జరిగింది:'
  rationale: ఈ సంయుక్త పదబంధం తరువాతి వచనంలో కొనసాగే కొత్త కథన పరిణామాన్ని పరిచయం చేస్తుంది. తెలుగు సహజ వాక్యక్రమం కోసం కాలసూచక ఉపవాక్యాన్ని ముందుంచి, కథన సూచికను ‘ఇలా జరిగింది’గా ఉంచాం.
- source_word: זָעֲקוּ
  choice: మొరపెట్టుకున్నారు
  rationale: ఈ క్రియ బాధలో సహాయం కోరుతూ చేసే అత్యవసర విజ్ఞప్తిని సూచిస్తుంది; ‘మొరపెట్టుకున్నారు’ ఆ తీవ్రతను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులు
  rationale: అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులు’ అయినా, ఇక్కడ మొత్తం ఇశ్రాయేలు ప్రజలను సూచిస్తుంది. ‘ఇశ్రాయేలీయులు’ ఆధునిక తెలుగులో సహజంగా, సమగ్రంగా ఉంది; అక్షరార్థ రూపాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: אֶל יְהוָה
  choice: యహ్వేకు
  rationale: אֶל ప్రార్థన ఎవరిని ఉద్దేశించిందో సూచిస్తుంది. దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా ‘యహ్వే’గా లిప్యంతరీకరించాం.
- source_word: עַל אֹדוֹת
  choice: కారణంగా
  rationale: ఈ సందర్భంలో మిద్యాను వల్ల కలిగిన బాధే ఇశ్రాయేలీయుల మొరకు కారణమని ఈ పదబంధం తెలియజేస్తుంది. ‘కారణంగా’ స్పష్టమైన, సహజమైన తెలుగు సమానార్థకం.
- source_word: מִדְיָן
  choice: మిద్యాను
  rationale: ప్రజాసమూహం లేదా ప్రాంతాన్ని సూచించే పేరుకు తెలుగులో స్థిరంగా వాడే లిప్యంతరీకరణ.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యహ్వే
  alternative: యెహోవా / ప్రభువు
  rationale: మూలపాఠం నాలుగు అక్షరాల దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది. దానిని బిరుదుగా మార్చకుండా వ్యక్తినామంగా నిలుపుకోవడానికి ‘యహ్వే’ అని లిప్యంతరీకరించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలిని వాడాం. ఈ వాక్యం తరువాతి వచనంలో పూర్తవుతుందనే కథన నిర్మాణాన్ని చివరి ద్విబిందువు సూచిస్తుంది.
