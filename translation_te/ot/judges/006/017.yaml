  yaml_path: translation/ot/judges/006/017.yaml
  text: And he said to him, “If now I have found favor in your eyes, then give me a sign that you are the one speaking with me.”
translation:
  language: te
  text: అతడు ఆయనతో, “ఇప్పుడు నీ దృష్టిలో నాకు అనుగ్రహం లభించి ఉంటే, నాతో మాట్లాడుతున్నది నీవే అని నాకు ఒక సూచన ఇవ్వు” అన్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֵן בְּעֵינֶיךָ
  choice: నీ దృష్టిలో నాకు అనుగ్రహం
  rationale: ‘నీ కళ్లలో కృప పొందడం’ అనే హీబ్రూ నుడికారపు భావాన్ని సహజమైన, గౌరవప్రదమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אוֹת
  choice: సూచన
  rationale: ఇక్కడ గిద్యోను తనతో మాట్లాడుతున్న వ్యక్తి ఎవరో నిర్ధారించే గుర్తును కోరుతున్నాడు; ‘సూచన’ ఆ విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: שָׁאַתָּה מְדַבֵּר עִמִּי
  choice: నాతో మాట్లాడుతున్నది నీవే అని
  rationale: నొక్కి చెప్పబడిన אַתָּה (‘నీవే’) భావాన్ని తెలుగులో సహజంగా కాపాడుతుంది.
theological_decisions:
- issue: మాట్లాడుతున్న వ్యక్తి గుర్తింపు
  choice: నాతో మాట్లాడుతున్నది నీవే అని
  alternative: నాతో మాట్లాడుతున్నది నీవేనని రుజువు చేసే
  rationale: మూలంలోని గుర్తింపు సంబంధమైన వాక్యాన్ని నిలిపి, ‘రుజువు’ వంటి అదనపు న్యాయార్థాన్ని చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన బైబిలు కథన శైలి. సంభాషణలో ఏకవచన ‘నీ/నీవే’ వాడకం మూలంలోని ప్రత్యక్ష సంబోధనను సహజంగా ప్రతిబింబిస్తుంది.
