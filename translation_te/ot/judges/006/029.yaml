id: JDG.6.29
reference: Judges 6:29
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּֽאמְרוּ֙ אִ֣ישׁ אֶל רֵעֵ֔/הוּ מִ֥י עָשָׂ֖ה הַ/דָּבָ֣ר הַ/זֶּ֑ה וַֽ/יִּדְרְשׁוּ֙ וַ/יְבַקְשׁ֔וּ וַ/יֹּ֣אמְר֔וּ גִּדְעוֹן֙ בֶּן יוֹאָ֔שׁ עָשָׂ֖ה הַ/דָּבָ֥ר הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/029.yaml
  text: And each man said to his neighbor[a], “Who has done this thing?” And they inquired and searched, and they said[b], “Gideon son of Joash has done this thing.”
translation:
  language: te
  text: వారు ఒకరితో ఒకరు[a], “ఈ పని[b] ఎవరు చేశారు?” అని అన్నారు. తరువాత వారు ఆరా తీశారు, వెదికారు; అప్పుడు, “యోవాషు కుమారుడు గిద్యోను ఈ పని చేశాడు” అని అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “ఒక మనిషి తన తోటివానితో.” ఇది అక్కడివారు పరస్పరం మాట్లాడుకున్నారని తెలిపే హీబ్రూ నుడికారం.
    reason: lexical_alternative
  - marker: b
    text: లేదా “ఈ కార్యం,” “ఈ చర్య.” ఇక్కడ హీబ్రూ పదం జరిగిన పనిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ אֶל־רֵעֵהוּ
  choice: ఒకరితో ఒకరు
  rationale: ‘ఒక మనిషి తన పొరుగువానితో’ అనే హీబ్రూ నుడికారానికి పరస్పర సంభాషణ భావం ఉంది. ఆధునిక తెలుగులో ‘ఒకరితో ఒకరు’ ఆ భావాన్ని సహజంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: מִי
  choice: ఎవరు
  rationale: చర్య చేసిన వ్యక్తి ఎవరని ప్రశ్నించే సాధారణ ప్రశ్నార్థక సర్వనామం.
- source_word: עָשָׂה
  choice: చేసింది / చేశాడు
  rationale: పూర్తయిన చర్యను సందర్భానుసార లింగసామరస్యంతో సహజ తెలుగులో వ్యక్తపరుస్తుంది; ‘తయారుచేయడం’ అనే అర్థం ఇక్కడ సరిపోదు.
- source_word: הַדָּבָר הַזֶּה
  choice: ఈ పని
  rationale: דָּבָר అనే పదానికి ‘మాట, విషయం, పని’ వంటి విస్తృత అర్థాలున్నాయి. ఇక్కడ అది అప్పటికే జరిగిన చర్యను సూచిస్తున్నందున ‘ఈ పని’ సహజంగా ఉంటుంది; ‘ఈ కార్యం’ కూడా సాధ్యమే.
- source_word: וַיִּדְרְשׁוּ
  choice: ఆరా తీసి
  rationale: דרשׁ ఇక్కడ ప్రశ్నించి పరిశోధించడం అనే భావాన్ని ఇస్తుంది. తరువాతి ‘వెదకడం’ నుంచి భేదాన్ని నిలుపుతూ ‘ఆరా తీసి’ సహజంగా ఉంటుంది.
- source_word: וַיְבַקְשׁוּ
  choice: వెదికి
  rationale: בקשׁ యొక్క వెదకడం లేదా కనుగొనడానికి ప్రయత్నించడం అనే భావాన్ని నేరుగా తెలియజేస్తుంది; ముందున్న విచారణ నుంచి చర్యలో పురోగతినీ సూచిస్తుంది.
- source_word: גִּדְעוֹן בֶּן־יוֹאָשׁ
  choice: యోవాషు కుమారుడు గిద్యోను
  rationale: హీబ్రూ పితృనామ సంబంధాన్ని తెలుగులో సహజమైన క్రమంలో వ్యక్తపరుస్తూ, పేర్లకు ప్రాచుర్యంలో ఉన్న తెలుగు లిప్యంతరీకరణలను ఉపయోగిస్తుంది.
- source_word: וַיֹּאמְרוּ
  choice: చెప్పారు
  rationale: విచారణ తరువాత వారు పలికిన మాటను మాత్రమే కథనం తెలియజేస్తుంది; ‘తీర్మానించారు’ వంటి బలమైన వ్యాఖ్యానాన్ని చేర్చదు.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన కథన శైలి వాడబడింది. హీబ్రూలోని ‘విచారించడం—వెదకడం’ అనే రెండు వరుస క్రియల భేదాన్ని ‘ఆరా తీసి వెదికి’ అని నిలిపి ఉంచాం; వాక్యప్రవాహం కోసం ‘తరువాత’ చేర్చబడింది.
