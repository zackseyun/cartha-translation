    rationale: Although the following direct speech is a question, the source deliberately uses the ordinary verb 'said' both before and after the inquiry. Rendering both as 'అన్నారు' preserves that repetition without reducing clarity.
  - severity: low
    issue: The linked participles 'ఆరా తీసి వెదికి' somewhat compress the two coordinated Hebrew verbs.
    rationale: The source presents inquiry and searching as two successive narrative actions. Finite coordinated verbs express this distinction more directly in Telugu.
