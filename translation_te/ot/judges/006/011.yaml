  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּבֹ֞א מַלְאַ֣ךְ יְהוָ֗ה וַ/יֵּ֨שֶׁב֙ תַּ֤חַת הָֽ/אֵלָה֙ אֲשֶׁ֣ר בְּ/עָפְרָ֔ה אֲשֶׁ֥ר לְ/יוֹאָ֖שׁ אֲבִ֣י הָֽעֶזְרִ֑י וְ/גִדְע֣וֹן בְּנ֗/וֹ חֹבֵ֤ט חִטִּים֙ בַּ/גַּ֔ת לְ/הָנִ֖יס מִ/פְּנֵ֥י מִדְיָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/011.yaml
  text: Then the angel of Yahweh came and sat under the oak that was in Ophrah[a], which belonged to Joash the Abiezrite[c][b], while Gideon his son was beating out wheat in the winepress to hide it from Midian.
translation:
  language: te
  text: అప్పుడు యాహ్వే దూత వచ్చి, ఒఫ్రాలో ఉన్న అబీయెజెరీయుడైన యోవాషుకు చెందిన తెరెబింతు చెట్టు[a] కింద కూర్చున్నాడు. యోవాషు కుమారుడైన గిద్యోను మిద్యాను చేతికి చిక్కకుండా ఉండేందుకు ద్రాక్షరస గానుగలో గోధుమలను కొడుతూ[c] ఉన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఓక్ చెట్టు.’ హీబ్రూ వృక్షనామాన్ని ‘తెరెబింతు’ లేదా ‘ఓక్’ అని అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘గోధుమలను నూర్పిడి చేస్తూ.’ హీబ్రూ పదం గింజలను వేరు చేయడానికి ధాన్యాన్ని కొట్టడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: యెహోవా దూత
  rationale: מַלְאַךְ అనే పదానికి ‘దూత’ లేదా ‘సందేశకుడు’ అనే అర్థాలు ఉండవచ్చు. ఈ కథన సందర్భంలో పరలోక దూత భావం సహజమైనది; అయితే అతని గుర్తింపుపై తరువాతి సిద్ధాంత నిర్ణయాన్ని వాక్యంలో చేర్చలేదు.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో లిప్యంతరీకరించాం.
- source_word: הָאֵלָה
  choice: మస్తకి చెట్టు
  rationale: హీబ్రూ పదం సాధారణంగా పెద్ద టెరెబింత్ తరహా చెట్టును సూచిస్తుంది. వృక్షజాతి విషయంలో ఉన్న అనిశ్చితిని పాదసూచికలో ఉంచాం.
- source_word: בְּעָפְרָה
  choice: ఒఫ్రాలో
  rationale: స్థలనామాన్ని అనువదించకుండా తెలుగులో లిప్యంతరీకరించాం.
- source_word: אֲשֶׁר לְיוֹאָשׁ
  choice: యోవాషుకు చెందిన
  rationale: లְ సూచించే స్వామ్య సంబంధాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: אֲבִי הָעֶזְרִי
  choice: అబీయెజ్రీయుడైన
  rationale: ఇది యోవాషు చెందిన వంశాన్ని సూచించే జాతివాచక రూపం; హీబ్రూ రూపానికి దగ్గరగా లిప్యంతరీకరించాం.
- source_word: חֹבֵט חִטִּים
  choice: గోధుమలను కర్రతో కొడుతూ
  rationale: חבט ధాన్యాన్ని కొట్టి గింజలను వేరు చేసే నిర్దిష్ట చర్యను సూచిస్తుంది. అసాధారణంగా ద్రాక్షగానుగలో చేస్తున్న పనిని స్పష్టంగా చూపేందుకు concrete rendering వాడాం.
- source_word: בַּגַּת
  choice: ద్రాక్షగానుగలో
  rationale: בְּ అనే ఉపసర్గలోని అంతర్భాగ భావాన్ని నిలుపుతూ, ద్రాక్షను తొక్కి రసం తీసే గానుగలో గిద్యోను దాగి పని చేస్తున్న దృశ్యాన్ని తెలుపుతుంది.
- source_word: לְהָנִיס מִפְּנֵי מִדְיָן
  choice: మిద్యాను చేతికి చిక్కకుండా ఉండేందుకు
  rationale: హిఫిల్ రూపం అక్షరార్థంగా ‘పారిపోయేలా చేయడం/దూరం చేయడం’ అని సూచిస్తుంది. ఇక్కడ గోధుమలను మిద్యాను దోచుకోకుండా కాపాడే ఉద్దేశాన్ని సహజమైన తెలుగులో తెలిపాం; ‘మిద్యాను’ అనే మూలంలోని ఏకవచన నామాన్ని నిలిపాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామాన్ని ఎలా అందించాలి
  choice: యెహోవా
  alternative: ప్రభువు; యాహ్వే
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దానిని బిరుదుగా మార్చకుండా తెలుగులో సుపరిచితమైన లిప్యంతరీకరణతో నిలిపాం.
- issue: מַלְאַךְ יְהוָה లోని מַלְאַךְ కు అతీంద్రియ భావం ఇవ్వాలా
  choice: యెహోవా దూత
  alternative: యెహోవా సందేశకుడు
  rationale: న్యాయాధిపతుల గ్రంథంలోని ఈ కథన రూపకల్పన పరలోక దూత భావానికి మద్దతిస్తుంది. అయినా ఈ వ్యక్తి యొక్క అంతిమ దైవశాస్త్రీయ గుర్తింపును అనువాదం నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. ‘ద్రాక్షగానుగ’ వంటి దృశ్యపరమైన పదాన్ని ఉంచి, సాధారణ పాఠకుడికి చర్య అర్థమయ్యేలా ‘కర్రతో కొడుతూ’ అని స్పష్టం చేశాం. పేర్లను తెలుగు బైబిల్ పఠనంలో గుర్తించదగిన రూపాలకు దగ్గరగా లిప్యంతరీకరించాం.
