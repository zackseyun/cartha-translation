revisions:
- from: అప్పుడు యెహోవా దూత వచ్చి, ఒఫ్రాలో[a] అబీయెజ్రీయుడైన[b] యోవాషుకు చెందిన మస్తకి చెట్టు కింద కూర్చున్నాడు. యోవాషు కుమారుడు గిద్యోను గోధుమలు మిద్యాను చేతికి చిక్కకుండా ఉండేందుకు ద్రాక్షగానుగలో వాటిని కర్రతో కొడుతూ[c] ఉన్నాడు.
  to: అప్పుడు యాహ్వే దూత వచ్చి, ఒఫ్రాలో ఉన్న అబీయెజెరీయుడైన యోవాషుకు చెందిన తెరెబింతు చెట్టు[a] కింద కూర్చున్నాడు. యోవాషు కుమారుడైన గిద్యోను మిద్యాను చేతికి చిక్కకుండా ఉండేందుకు ద్రాక్షరస గానుగలో గోధుమలను కొడుతూ[c] ఉన్నాడు.
  rationale: దైవనామాన్ని POB నిర్ణయానికి అనుగుణంగా ‘యాహ్వే’గా మార్చాం. అర్థపరంగా అసురక్షితమైన ‘మస్తకి చెట్టు’ స్థానంలో మూలపదానికి సన్నిహితమైన ‘తెరెబింతు చెట్టు’ ఉంచి, ఓక్ అనే ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం. చెట్టు, ఒఫ్రా, యోవాషు మధ్య ఉన్న సంబంధాలను మూల క్రమానికి అనుగుణంగా స్పష్టీకరించాం; మూలంలో లేని ‘కర్రతో’ను తొలగించాం. b పాదసూచిక ఈ వచనంలో ప్రత్యామ్నాయ జాతివాచక రూపాన్ని నమోదు చేస్తుంది; దానికి పాఠ్యంలో ప్రత్యేక గుర్తు అవసరం లేదు, ఎందుకంటే అది పేరురూపానికి సంబంధించిన సంపాదకీయ ప్రత్యామ్నాయం.
