id: JDG.6.21
reference: Judges 6:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֞ח מַלְאַ֣ךְ יְהוָ֗ה אֶת קְצֵ֤ה הַ/מִּשְׁעֶ֨נֶת֙ אֲשֶׁ֣ר בְּ/יָד֔/וֹ וַ/יִּגַּ֥ע בַּ/בָּשָׂ֖ר וּ/בַ/מַּצּ֑וֹת וַ/תַּ֨עַל הָ/אֵ֜שׁ מִן הַ/צּ֗וּר וַ/תֹּ֤אכַל אֶת הַ/בָּשָׂר֙ וְ/אֶת הַ/מַּצּ֔וֹת וּ/מַלְאַ֣ךְ יְהוָ֔ה הָלַ֖ךְ מֵ/עֵינָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/021.yaml
  text: Then the angel of Yahweh reached out the tip of the staff that was in his hand and touched the meat and the unleavened bread[a]. And fire went up from the rock and consumed the meat and the unleavened bread[c][b]. Then the angel of Yahweh went away from his sight.
translation:
  language: te
  text: అప్పుడు యాహ్వే దూత[a] తన చేతిలో ఉన్న దండపు కొనను చాపి, మాంసాన్ని[b], పులియని రొట్టెలను తాకాడు. బండనుండి అగ్ని పైకి లేచి, మాంసాన్ని, పులియని రొట్టెలను దహించివేసింది. ఆ తరువాత యాహ్వే దూత అతని కళ్ల ఎదుటినుండి వెళ్లిపోయాడు.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘యాహ్వే దేవదూత.’ హీబ్రూ పదం ‘దూత’ లేదా ‘సందేశవాహకుడు’ అనే అర్థాన్ని ఇవ్వగలదు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ పదానికి అక్షరార్థం ‘మాంసం’; ఇక్కడ అర్పణగా సిద్ధం చేసిన మాంసాన్ని సూచిస్తుంది.
    reason: lexical_clarification
  - marker: c
    text: హీబ్రూ అక్షరార్థంగా, ‘అతని కళ్లనుండి వెళ్లిపోయాడు’; అంటే యాహ్వే దూత గిద్యోనుకు ఇక కనిపించలేదు.
    reason: idiom_clarification
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: యాహ్వే దూత
  rationale: מַלְאָךְ అనే పదానికి ‘దూత’ లేదా ‘దేవదూత’ అనే అర్థాలు ఉండవచ్చు. ‘దూత’ మూలపదంలోని సందేశవాహక భావాన్ని, ఈ వ్యక్తి స్వరూపంపై ఉన్న భాషాపరమైన విస్తృతిని కాపాడుతుంది; సందర్భంలోని అద్భుత కార్యం పాఠకునికి స్వయంగా స్పష్టమవుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన నాలుగు హల్లుల పేరును బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగులో దాని సాధారణ లిప్యంతరీకరణగా ‘యాహ్వే’ అని ఇచ్చాం.
- source_word: קְצֵה הַמִּשְׁעֶנֶת
  choice: దండపు కొన
  rationale: קָצֶה అంటే చివర లేదా కొన; מִשְׁעֶנֶת అంటే ఆసరాగా ఉపయోగించే దండం. ‘దండపు కొన’ దృశ్యాన్ని సహజంగా, సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: וַיִּשְׁלַח
  choice: చాపి
  rationale: ఇక్కడ దండపు కొనను ముందుకు చాపడమే భావం; ‘పంపాడు’ అనే ప్రాథమిక అర్థం ఈ సందర్భానికి సరిపోదు.
- source_word: וַיִּגַּע
  choice: తాకాడు
  rationale: נגע క్రియ యొక్క సాధారణ అర్థం ‘తాకడం’; కొట్టాడనే బలమైన భావాన్ని మూలం తప్పనిసరిగా సూచించదు.
- source_word: בָּשָׂר
  choice: మాంసం
  rationale: ఇక్కడ అర్పణగా సిద్ధం చేసిన ఆహారాన్ని సూచిస్తున్నందున ‘శరీరం’ లేదా ‘దేహం’ కంటే ‘మాంసం’ స్పష్టంగా ఉంటుంది.
- source_word: מַצּוֹת
  choice: పులియని రొట్టెలు
  rationale: పులియబెట్టే పదార్థం లేకుండా చేసిన ఆహారాన్ని సామాన్య ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది; హీబ్రూ బహువచనాన్ని కూడా నిలుపుతుంది.
- source_word: וַתַּעַל הָאֵשׁ מִן הַצּוּר
  choice: బండలోనుండి అగ్ని పైకి లేచి
  rationale: అగ్ని బండనుండి పైకి రావడం అనే మూలంలోని దిశాత్మక, దృశ్యాత్మక భావాన్ని సహజ తెలుగులో కాపాడుతుంది.
- source_word: וַתֹּאכַל
  choice: దహించివేసింది
  rationale: క్రియ అక్షరార్థంగా ‘తినివేసింది’ అయినా, అగ్ని విషయంలో ‘దహించివేసింది’ సహజమైన తెలుగు ప్రయోగం; పూర్తిగా కాల్చివేసిన భావాన్ని ఇస్తుంది.
- source_word: הָלַךְ מֵעֵינָיו
  choice: అతని దృష్టికి దూరమయ్యాడు
  rationale: అక్షరార్థంగా ‘అతని కళ్లనుండి వెళ్లాడు.’ తెలుగు సహజత్వాన్ని కాపాడుతూ గిద్యోనుకు ఇక కనిపించకుండా పోయాడనే భావాన్ని తెలియజేస్తుంది; అకస్మాత్తుగా మాయమయ్యాడని అనవసరంగా నిర్ధారించదు.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దాన్ని ‘ప్రభువు’ అనే బిరుదుతో మార్చకుండా ‘యాహ్వే’గా లిప్యంతరీకరించడం మూలంలోని పేరును కాపాడుతుంది; ‘యెహోవా’ కంటే ఇది Yahweh ఉచ్చారణకు దగ్గరగా ఉంటుంది.
- issue: מַלְאַךְ యొక్క స్వరూప సూచన
  choice: దూత
  alternative: దేవదూత; సందేశవాహకుడు
  rationale: హీబ్రూ పదం సాధారణ సందేశవాహకుడినీ పరలోక దూతనూ సూచించగలదు. కథనంలో ఇతడు అద్భుతంగా వ్యవహరించినప్పటికీ, ‘దూత’ అనే ఎంపిక పదంలోని నిజమైన విస్తృతిని నిలుపుతూ ఏ ప్రత్యేక సిద్ధాంత గుర్తింపునూ పాఠ్యంలోకి చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘వెంటనే’ హీబ్రూ వరుస సంఘటనలోని తక్షణ ఫలితాన్ని తెలుగులో స్పష్టం చేస్తుంది. అతీంద్రియ సంఘటనను అలంకారికంగా విస్తరించకుండా, మూలంలోని క్రమం మరియు దృశ్యాన్ని నిలుపుకున్నాం.
