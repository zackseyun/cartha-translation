revisions:
- from: అప్పుడు యాహ్వే దూత[a] తన చేతిలో ఉన్న దండపు కొనను చాపి, మాంసాన్ని[b], పులియని రొట్టెలను తాకాడు. వెంటనే బండలోనుండి అగ్ని పైకి లేచి, మాంసాన్ని, పులియని రొట్టెలను దహించివేసింది. ఆ తరువాత యాహ్వే దూత అతని దృష్టికి దూరమయ్యాడు.[c]
  to: అప్పుడు యాహ్వే దూత[a] తన చేతిలో ఉన్న దండపు కొనను చాపి, మాంసాన్ని[b], పులియని రొట్టెలను తాకాడు. బండనుండి అగ్ని పైకి లేచి, మాంసాన్ని, పులియని రొట్టెలను దహించివేసింది. ఆ తరువాత యాహ్వే దూత అతని కళ్ల ఎదుటినుండి వెళ్లిపోయాడు.[c]
  rationale: మూలంలో లేని తక్షణతను తొలగించాం; చివరి హీబ్రూ నుడికారానికి దగ్గరైన, సహజమైన తెలుగు వాక్యాన్ని వాడాం; అలాగే పాదటిప్పణి bను మరింత ఖచ్చితంగా చేశాం. ఇతర పదప్రయోగాలు మూలార్థం, ఆధునిక తెలుగు సహజత్వం, మరియు పదసంబంధిత అస్పష్టతను తగిన విధంగా కాపాడుతున్నాయి.
