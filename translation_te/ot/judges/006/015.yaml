source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֵלָי/ו֙ בִּ֣י אֲדֹנָ֔/י בַּ/מָּ֥ה אוֹשִׁ֖יעַ אֶת יִשְׂרָאֵ֑ל הִנֵּ֤ה אַלְפִּ/י֙ הַ/דַּ֣ל בִּ/מְנַשֶּׁ֔ה וְ/אָנֹכִ֥י הַ/צָּעִ֖יר בְּ/בֵ֥ית אָבִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/015.yaml
  text: But he said to him[a], “Please, my lord, how can I save Israel? Look, my clan is the weakest in Manasseh[c][b], and I am the youngest in my father’s house.”
translation:
  language: te
  text: అయితే అతడు అతనితో, “దయచేసి, నా ప్రభువా, నేను ఇశ్రాయేలును ఎలా రక్షించగలను? చూడండి, మనష్షేలో నా వంశం అత్యంత బలహీనమైనది[a]; నా తండ్రి ఇంటివారిలో నేను అతి చిన్నవాణ్ణి[b]” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “వంశం” అని అనువదించిన హీబ్రూ పదానికి పదశః “వెయ్యి” అని అర్థం; అది ఒక గోత్రంలోని వంశ విభాగాన్ని సూచించగలదు. “అత్యంత బలహీనమైనది” అనే మాటకు “అత్యంత పేదది” లేదా “అత్యల్పమైనది” అనే అర్థాలు కూడా సాధ్యమే.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “నా తండ్రి ఇంటివారిలో అత్యల్పుణ్ణి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּי
  choice: దయచేసి వినండి
  rationale: ఇక్కడ ఇది స్థలార్థక పదం కాదు; వినయపూర్వక విన్నపాన్ని పరిచయం చేసే సంభాషణ అవ్యయం. ఆధునిక తెలుగులో సహజమైన గౌరవపూర్వక అభ్యర్థనగా అనువదించబడింది.
- source_word: אֲדֹנָי
  choice: నా ప్రభువా
  rationale: గిద్యోను ఎదుటివారిని గౌరవంగా సంబోధిస్తున్నాడు. ఇది దేవునికి వాడే బిరుదే అని ముందుగానే తేల్చకుండా, సందర్భంలోని అస్పష్టతను నిలుపుతుంది.
- source_word: בַּמָּה
  choice: ఎలా
  rationale: ‘దేనితో/ఏ సాధనంతో’ అనే మూల భావాన్ని, తన వల్ల ఇది ఎలా సాధ్యమనే ప్రశ్నగా సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אוֹשִׁיעַ
  choice: నేను ... రక్షించగలను
  rationale: ישׁע హిఫిల్ రూపానికి ‘రక్షించు/విడిపించు’ అనే భావం ఉంది. ఇక్కడ ప్రశ్నలోని సామర్థ్య భావాన్ని తెలుగులో ‘రక్షించగలను’ స్పష్టంగా అందిస్తుంది.
- source_word: הִנֵּה
  choice: చూడండి
  rationale: తరువాత చెప్పబోయే కారణంపై శ్రద్ధ నిలిపే సూచనాత్మక బలాన్ని ఆధునిక తెలుగులో సహజంగా నిలుపుతుంది.
- source_word: אַלְפִּי
  choice: నా వంశం
  rationale: పదశః ‘నా వెయ్యి’ అయినప్పటికీ, గోత్ర సంబంధ సామాజిక సందర్భంలో ఇది ఒక వంశ విభాగాన్ని సూచిస్తుంది. ‘వంశం’ సాధారణ పాఠకులకు స్పష్టంగా ఉంటుంది.
- source_word: הַדַּל
  choice: అత్యంత బలహీనమైనది
  rationale: דַּל పేదరికం, అల్పత్వం లేదా బలహీనతను సూచించగలదు. ఇక్కడ గిద్యోను తన వంశపు తక్కువ స్థాయి, అసమర్థతను చెబుతున్నందున ‘అత్యంత బలహీనమైనది’ సందర్భోచితం; ప్రత్యామ్నాయ భావాలు పాదటిప్పణిలో ఉంచబడ్డాయి.
- source_word: בִּמְנַשֶּׁה
  choice: మనష్షే గోత్రంలో
  rationale: ఇది మనష్షే గోత్రాన్ని సూచిస్తుంది; తెలుగు పాఠకునికి సంబంధం స్పష్టంగా ఉండేందుకు ‘గోత్రం’ చేర్చబడింది.
- source_word: הַצָּעִיר
  choice: అతి చిన్నవాణ్ణి
  rationale: ఈ పదం వయస్సులో చిన్నవాడు లేదా హోదాలో అల్పుడు అనే రెండు భావాలనూ కలిగి ఉండగలదు. ‘అతి చిన్నవాణ్ణి’ కుటుంబ సందర్భంలో సహజంగా ఉండి మూలంలోని కొంత అస్పష్టతను నిలుపుతుంది.
- source_word: בְּבֵית אָבִי
  choice: నా తండ్రి ఇంటివారిలో
  rationale: పితృసంబంధ కుటుంబ సమూహాన్ని సూచించే హీబ్రూ నుడికారాన్ని పదశః భవనం అనే అపార్థం రాకుండా సహజ తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: אֲדֹנָי అనే సంబోధనలోని భావం
  choice: గౌరవపూర్వక సంబోధనగా ‘నా ప్రభువా’
  alternative: దైవ బిరుదుగా ‘ప్రభువా’
  rationale: ఈ దశలో మాట్లాడుతున్న వ్యక్తి గుర్తింపు గురించి కథనం ఉంచిన ఉద్రిక్తతను ముందుగానే పరిష్కరించకూడదు. ‘నా ప్రభువా’ గౌరవాన్ని తెలియజేస్తూనే అది తప్పనిసరిగా దైవ బిరుదని నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. గిద్యోను వినయం, అసమర్థత భావం నిలుపబడ్డాయి. ‘ఇంటివారు’ అనే రూపం సామాజిక కుటుంబ యూనిట్‌ను స్పష్టపరుస్తుంది; ‘నా ప్రభువా’ అనే సంబోధన కథనంలోని దైవ-మానవ గుర్తింపు అస్పష్టతను ముందుగానే తొలగించదు.
