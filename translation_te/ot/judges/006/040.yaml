source:
  edition: WLC
  text: וַ/יַּ֧עַשׂ אֱלֹהִ֛ים כֵּ֖ן בַּ/לַּ֣יְלָה הַ/ה֑וּא וַ/יְהִי חֹ֤רֶב אֶל הַ/גִּזָּה֙ לְ/בַדָּ֔/הּ וְ/עַל כָּל הָ/אָ֖רֶץ הָ֥יָה טָֽל־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/040.yaml
  text: And God did so that night[a], and there was dryness on the fleece alone, and on all the ground there was dew.
translation:
  language: te
  text: ఆ రాత్రి దేవుడు అలాగే చేశాడు. గొర్రెబొచ్చు మీద మాత్రమే పొడితనం ఉంది; నేల అంతటా మంచు ఉంది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దేశమంతటా మంచు ఉంది.” హీబ్రూ אֶרֶץ అనే పదానికి ‘నేల,’ ‘దేశం,’ లేదా ‘భూమి’ అనే అర్థాలు ఉండవచ్చు; గిద్యోను సూచనకు సంబంధించిన ఈ సమీప సందర్భంలో ‘నేల’ బాగా సరిపోతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ אֱלֹהִים כֵּן
  choice: దేవుడు అలాగే చేశాడు
  rationale: עשה తో కూడిన כֵּן ముందటి వచనంలో గిద్యోను కోరిన సూచనను వెనక్కి సూచిస్తుంది. ‘అలాగే చేశాడు’ సంక్షిప్తమైన హీబ్రూ కథన శైలిని సహజ తెలుగులో నిలుపుతుంది.
- source_word: בַּלַּיְלָה הַהוּא
  choice: ఆ రాత్రి
  rationale: నిర్దిష్టమైన ఆ రాత్రిని సూచించే కాలవాచక పదబంధానికి సహజమైన తెలుగు రూపం.
- source_word: חֹרֶב
  choice: పొడితనం
  rationale: ఇది ‘పొడిగా’ అనే విశేషణం కాకుండా పొడి స్థితిని సూచించే నామవాచకం; మంచుతో ఉన్న వ్యత్యాసాన్ని కూడా నిలుపుతుంది.
- source_word: אֶל הַגִּזָּה לְבַדָּהּ
  choice: బొచ్చు మీద మాత్రమే
  rationale: גִּזָּה ఇక్కడ కత్తిరించిన గొర్రె ఉన్ని బొచ్చును సూచిస్తుంది; לְבַדָּהּ ఆ పొడితనం దానికే పరిమితమైందని తెలియజేస్తుంది.
- source_word: וְעַל כָּל הָאָרֶץ
  choice: నేల అంతటిమీద
  rationale: ఈ సందర్భంలో אֶרֶץ ప్రపంచమంతటినీ కాక, బొచ్చు చుట్టూ ఉన్న నేలను సూచించడం అత్యంత సహజం; అయితే ‘దేశం/భూమి’ అనే విస్తృత అర్థసాధ్యతను పాదటిప్పణిలో ఉంచాం.
- source_word: טָל
  choice: మంచు
  rationale: ఇక్కడ טַל రాత్రివేళ నేలపై ఏర్పడే dewను సూచిస్తుంది; సాధారణ ఆధునిక తెలుగులో ‘మంచు’ సహజమైన సమానార్థకం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. హీబ్రూ వాక్యంలోని వరుస ‘మరియు’ నిర్మాణాన్ని తెలుగులో యాంత్రికంగా పునరావృతం చేయకుండా రెండు సహజ వాక్యాలుగా ఇచ్చాం; అర్థక్రమం మాత్రం నిలిపాం. ప్రతి పాదటిప్పణి సూచిక ప్రధాన పాఠ్యంలో ఉంచబడింది.
