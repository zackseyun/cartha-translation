id: JDG.6.8
reference: Judges 6:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֧ח יְהוָ֛ה אִ֥ישׁ נָבִ֖יא אֶל בְּנֵ֣י יִשְׂרָאֵ֑ל וַ/יֹּ֨אמֶר לָ/הֶ֜ם כֹּה אָמַ֥ר יְהוָ֣ה אֱלֹהֵ֣י יִשְׂרָאֵ֗ל אָנֹכִ֞י הֶעֱלֵ֤יתִי אֶתְ/כֶם֙ מִ/מִּצְרַ֔יִם וָ/אֹצִ֥יא אֶתְ/כֶ֖ם מִ/בֵּ֥ית עֲבָדִֽים־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/008.yaml
  text: 'Then Yahweh sent a man[a], a prophet, to the sons of Israel, and he said to them, “Thus says Yahweh, the God of Israel: I brought you up from Egypt[b], and I brought you out from the house of slavery.”'
translation:
  language: te
  text: 'అప్పుడు యాహ్వే ఇశ్రాయేలు ప్రజల వద్దకు ఒక మనిషిని, ఒక ప్రవక్తను పంపాడు. అతడు వారితో ఇలా అన్నాడు: “ఇశ్రాయేలు దేవుడైన యాహ్వే ఇలా అంటున్నాడు: నేనే మిమ్మల్ని ఐగుప్తు నుండి పైకి తీసుకొచ్చాను; బానిసత్వపు గృహం నుండి మిమ్మల్ని బయటికి తీసుకొచ్చాను.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “బానిసల గృహం.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: అప్పుడు ... పంపాడు
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది; ఆధునిక తెలుగులో ‘అప్పుడు’ సహజంగా క్రమాన్ని తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించదగిన రూపంలో వ్యక్తిగత నామంగా ఉంచింది.
- source_word: אִישׁ נָבִיא
  choice: ఒక ప్రవక్తను
  rationale: హీబ్రూలోని ‘ఒక మనిషి, ఒక ప్రవక్త’ అనే సమానాధికరణ నిర్మాణం వ్యక్తి మానవుడని ప్రత్యేకంగా విరుద్ధీకరించడం లేదు; తెలుగులో ‘ఒక ప్రవక్త’ సహజంగా రెండింటి భావాన్నీ అందిస్తుంది.
- source_word: אֶל בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు ప్రజల దగ్గరికి
  rationale: ఇది యాకోబు కుమారులను మాత్రమే కాక ఒడంబడిక సమాజాన్ని సమష్టిగా సూచించే స్థిర ప్రయోగం; ‘ఇశ్రాయేలు ప్రజలు’ ఆధునిక తెలుగులో స్పష్టమూ సహజమూ.
- source_word: כֹּה אָמַר
  choice: ఇలా అంటున్నాడు
  rationale: ప్రవక్త సందేశ సూత్రాన్ని సహజమైన వర్తమాన తెలుగు రూపంలో నిలుపుతుంది.
- source_word: אָנֹכִי
  choice: నేనే
  rationale: స్వతంత్ర సర్వనామంలోని ఉద్ఘాటనను తెలుగులో ‘నేనే’ సహజంగా ప్రతిబింబిస్తుంది.
- source_word: הֶעֱלֵיתִי
  choice: పైకి తీసుకొచ్చాను
  rationale: నిర్గమనాన్ని వర్ణించే עלה హిఫీల్ రూపంలోని ‘పైకి తీసుకురావడం’ అనే దిశాత్మక చిత్రాన్ని నిలుపుతుంది.
- source_word: מִבֵּית עֲבָדִים
  choice: దాసుల గృహం నుండి
  rationale: ‘దాసుల ఇల్లు/గృహం’ అనే హీబ్రూ concrete రూపకాన్ని నిలుపుతూ, గౌరవప్రదమైన తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యెహోవా
  alternative: ప్రభువు / యాహ్వే
  rationale: మూలంలో వ్యక్తిగత దైవనామం ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయలేదు; తెలుగు పాఠకులకు పరిచితమైన లిప్యంతరీకరణను ఎంచుకుంది.
- issue: בְּנֵי יִשְׂרָאֵל అనే సమష్టి designation
  choice: ఇశ్రాయేలు ప్రజలు
  alternative: ఇశ్రాయేలు కుమారులు / ఇశ్రాయేలీయులు
  rationale: ఈ సందర్భంలో మొత్తం సమాజమే ఉద్దేశం. తెలుగు సహజత్వం కోసం ‘ప్రజలు’ వాడినా, ఒడంబడిక సమష్టి సూచనను నిలుపుకుంది.
- issue: בֵּית עֲבָדִים యొక్క రూపకం
  choice: దాసుల గృహం
  alternative: దాసత్వపు గృహం
  rationale: మూలంలోని బహువచన concrete నామవాచకాన్ని నిలుపుతుంది; దాని భావం దాసత్వ స్థితి అని పాదటిప్పణి వివరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా సహజ వాక్యనిర్మాణం, అయితే ప్రవచన సూత్రం మరియు నిర్గమన భాషలోని గంభీరతను నిలుపుకుంది. ప్రధాన పాఠంలోని [a] గుర్తు సంబంధిత పాదటిప్పణితో సరిపోతుంది.
