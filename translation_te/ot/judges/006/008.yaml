  to: 'అప్పుడు యాహ్వే ఇశ్రాయేలు ప్రజల వద్దకు ఒక మనిషిని, ఒక ప్రవక్తను పంపాడు. అతడు వారితో ఇలా అన్నాడు: “ఇశ్రాయేలు దేవుడైన యాహ్వే ఇలా అంటున్నాడు: నేనే మిమ్మల్ని ఐగుప్తు నుండి పైకి తీసుకొచ్చాను; బానిసత్వపు గృహం నుండి మిమ్మల్ని బయటికి తీసుకొచ్చాను.[a]”'
  rationale: మూలంలోని ‘మనిషి, ప్రవక్త’ అనే సమానాధికరణాన్ని పునరుద్ధరించాం; దైవనామాన్ని ప్రాజెక్టు నామ-విధానానికి అనుగుణంగా ‘యాహ్వే’గా ఇచ్చాం; మరియు బֵּית עֲבָדִיםకు సందర్భానుకూలమైన ప్రధాన అనువాదంతో పాటు అక్షరార్థ ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం. వాక్యార్థం లేదా ప్రవచన సూత్రం మార్చబడలేదు.
