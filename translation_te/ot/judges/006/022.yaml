id: JDG.6.22
reference: Judges 6:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּ֣רְא גִּדְע֔וֹן כִּֽי מַלְאַ֥ךְ יְהוָ֖ה ה֑וּא וַ/יֹּ֣אמֶר גִּדְע֗וֹן אֲהָהּ֙ אֲדֹנָ֣/י יְהוִ֔ה כִּֽי עַל כֵּ֤ן רָאִ֨יתִי֙ מַלְאַ֣ךְ יְהוָ֔ה פָּנִ֖ים אֶל פָּנִֽים־ס־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/022.yaml
  text: Then Gideon saw that he was the angel of Yahweh[a], and Gideon said, “Ah, Lord GOD! For I have seen the angel of Yahweh face to face.”
translation:
  language: te
  text: అప్పుడు గిద్యోను ఆయన యెహోవా దూత[a] అని గ్రహించి, “అయ్యో, ప్రభువైన యెహోవా! నేను యెహోవా దూతను ముఖాముఖిగా చూశాను!” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “యెహోవా దేవదూత.” హెబ్రీ పదానికి “దూత,” “దేవదూత” అనే రెండు అర్థాలూ ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: గ్రహించి
  rationale: ראה అనే క్రియకు ప్రాథమికంగా ‘చూచుట’ అనే అర్థం ఉన్నా, తరువాత వచ్చే כִּי ఉపవాక్యం గిద్యోను ఆ వ్యక్తి ఎవరో గుర్తించిన భావాన్ని తెలియజేస్తుంది. తెలుగులో ‘ఆయన ... అని చూశాడు’ కంటే ‘గ్రహించాడు’ సహజంగా ఉంటుంది.
- source_word: מַלְאַךְ יְהוָה
  choice: యెహోవా దూత
  rationale: מַלְאָךְ అంటే ‘దూత’ లేదా సందర్భానుసారం ‘దేవదూత.’ ‘దూత’ మూలపదంలోని కార్యపరమైన భావాన్ని, అలాగే వ్యక్తి స్వరూపం గురించిన వేదాంత ఉద్రిక్తతను కాపాడుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవ నామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా తెలుగులో సుపరిచితమైన ‘యెహోవా’ రూపంలో ఇచ్చాం.
- source_word: אֲהָהּ
  choice: అయ్యో
  rationale: భయం, దిగ్భ్రాంతి, అపాయం ఎదురైందనే భావాన్ని తెలిపే సహజమైన ఆధునిక తెలుగు ఆశ్చర్యోక్తి.
- source_word: אֲדֹנָי יְהוִה
  choice: ప్రభువైన యెహోవా
  rationale: אֲדֹנָי అనే బిరుదును ‘ప్రభువు’గా, יהוה అనే దైవ నామాన్ని ‘యెహోవా’గా వేరు చేసి రెండింటినీ నిలిపాం.
- source_word: כִּי עַל כֵּן
  choice: '[ప్రత్యేక సంధానపదం లేకుండా కారణార్థక సందర్భంలో]'
  rationale: ఈ పదబంధం గిద్యోను పలికిన భయోక్తికి కారణాన్ని పరిచయం చేస్తుంది. తెలుగులో ‘అయ్యో ...! నేను ... చూశాను!’ అనే వరుసే ఆ కారణ సంబంధాన్ని సహజంగా వ్యక్తం చేస్తుంది; ‘ఎందుకంటే’ చేరిస్తే పలుకు కృత్రిమంగా మారుతుంది.
- source_word: פָּנִים אֶל פָּנִים
  choice: ముఖాముఖిగా
  rationale: ప్రత్యక్షమైన ఎదుర్కొనడాన్ని తెలిపే హెబ్రీ స్థిరపదబంధానికి సహజమైన, సన్నిహిత తెలుగు సమానార్థకం.
theological_decisions:
- issue: יהוה అనే దైవ నామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలంలో వ్యక్తిగత దైవ నామం నేరుగా ఉంది. దానిని కేవలం బిరుదుగా మార్చకుండా తెలుగులో విస్తృతంగా తెలిసిన లిప్యంతరీకరణను వాడాం.
- issue: מַלְאַךְ יְהוָה యొక్క అర్థం
  choice: యెహోవా దూత
  alternative: యెహోవా దేవదూత
  rationale: מַלְאָךְ అనే పదం సాధారణ ‘దూత’నూ పరలోక ‘దేవదూత’నూ సూచించగలదు. ప్రధాన పాఠంలో ‘దూత’ అని ఉంచి, ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో తెలిపి మూలంలోని పదార్థ విస్తృతిని మరియు కథలోని వేదాంత ఉద్రిక్తతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరతను నిలిపే శైలి. గిద్యోను దిగ్భ్రాంతిని ‘అయ్యో’తో, ప్రత్యక్ష దర్శనాన్ని ‘ముఖాముఖిగా’తో వ్యక్తం చేశాం. పాదటిప్పణి సూచిక [a] ప్రధాన పాఠంలో ఉంది.
