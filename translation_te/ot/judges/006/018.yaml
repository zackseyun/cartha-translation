source:
  edition: WLC
  text: אַל נָ֨א תָמֻ֤שׁ מִ/זֶּה֙ עַד בֹּאִ֣/י אֵלֶ֔י/ךָ וְ/הֹֽצֵאתִי֙ אֶת מִנְחָתִ֔/י וְ/הִנַּחְתִּ֖י לְ/פָנֶ֑י/ךָ וַ/יֹּאמַ֕ר אָנֹכִ֥י אֵשֵׁ֖ב עַ֥ד שׁוּבֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/018.yaml
  text: Please do not depart from here until I come to you and bring out my offering and set it before you." And he said[a], "I will stay until you return.
translation:
  language: te
  text: “నేను నీ దగ్గరికి వచ్చి, నా అర్పణను[a] బయటికి తీసుకొచ్చి నీ ముందు ఉంచేంతవరకు దయచేసి ఇక్కడి నుంచి వెళ్లవద్దు” అని గిద్యోను అన్నాడు. అతడు, “నువ్వు తిరిగి వచ్చేవరకు నేను ఇక్కడే ఉంటాను” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నా కానుకను,” లేదా “నా కప్పాన్ని”; హీబ్రూ పదం సాధారణంగా సమర్పించే కానుకను సూచించగలదు, కొన్ని సందర్భాల్లో అర్పణను కూడా సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָמֻשׁ מִזֶּה
  choice: ఇక్కడి నుంచి వెళ్లవద్దు
  rationale: మושׁ అనే క్రియకు ఈ సందర్భంలో ఉన్న ‘స్థలాన్ని విడిచి వెళ్లడం’ అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: עַד בֹּאִי אֵלֶיךָ
  choice: నేను నీ దగ్గరికి వచ్చి … ఉంచేంతవరకు
  rationale: ప్రత్యయంతో కూడిన హీబ్రూ క్రియానామ రూపాన్ని తెలుగులో సహజమైన కాలపరిమితి వాక్యంగా మార్చింది.
- source_word: וְהוֹצֵאתִי
  choice: బయటికి తీసుకొచ్చి
  rationale: గిద్యోను సిద్ధం చేయబోయే వస్తువును ఉన్న చోటు నుంచి అతిథి దగ్గరికి తీసుకురావడాన్ని స్పష్టంగా సూచిస్తుంది.
- source_word: מִנְחָתִי
  choice: నా అర్పణను
  rationale: מִנְחָה కానుక, కప్పం లేదా ఆరాధనాత్మక అర్పణను సూచించగలదు. ‘అర్పణ’ ఈ కథనంలోని మతపరమైన ప్రతిధ్వనిని నిలుపుతూ, దానిని ప్రత్యేకంగా ధాన్యార్పణగా పరిమితం చేయదు.
- source_word: וְהִנַּחְתִּי לְפָנֶיךָ
  choice: నీ ముందు ఉంచి
  rationale: ఒకరి సమక్షంలో దేనినైనా ఉంచడం అనే హీబ్రూ భావాన్ని సరళంగా, గౌరవప్రదంగా అందిస్తుంది.
- source_word: אָנֹכִי אֵשֵׁב
  choice: నేను ఇక్కడే ఉంటాను
  rationale: ישׁב అక్షరార్థంగా ‘కూర్చోవడం’ అని అర్థమివ్వగలిగినా, ఇక్కడ ఆ స్థలంలోనే ఉండిపోవడం ఉద్దేశం. ‘ఇక్కడే ఉంటాను’ సందర్భార్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: עַד שׁוּבֶךָ
  choice: నువ్వు తిరిగి వచ్చేవరకు
  rationale: ప్రత్యయంతో కూడిన క్రియానామాన్ని తెలుగులో సహజమైన ఉపవాక్యంగా అనువదించింది.
- source_word: נָא
  choice: దయచేసి
  rationale: విన్నపంలోని మర్యాదపూర్వక స్వరాన్ని ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: గిద్యోను సమర్పించబోయే מִנְחָה యొక్క భావం
  choice: అర్పణ
  alternative: కానుక; కప్పం; ధాన్యార్పణ
  rationale: ఈ పదానికి విస్తృత అర్థపరిధి ఉంది. తదుపరి కథనం దైవికంగా స్వీకరించబడే సమర్పణ వైపు సాగుతుంది కాబట్టి ‘అర్పణ’ మతపరమైన సూచనను నిలుపుతుంది; అదే సమయంలో దానిని కేవలం విధివంతమైన ధాన్యార్పణగా నిర్ధారించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి ఉపయోగించబడింది. సంభాషణలో సందర్భానుకూల ఏకవచన ‘నీ/నువ్వు’ రూపాలు వాడబడ్డాయి. రెండవ వక్తను మూలంలోని సర్వనామ అస్పష్టతకు అనుగుణంగా ‘అతడు’ అని ఉంచినా, మొదటి వక్తను పాఠకుడి స్పష్టత కోసం ‘గిద్యోను’గా పేర్కొనబడింది.
