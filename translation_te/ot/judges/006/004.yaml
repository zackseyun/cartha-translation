id: JDG.6.4
reference: Judges 6:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּחֲנ֣וּ עֲלֵי/הֶ֗ם וַ/יַּשְׁחִ֨יתוּ֙ אֶת יְב֣וּל הָ/אָ֔רֶץ עַד בּוֹאֲ/ךָ֖ עַזָּ֑ה וְ/לֹֽא יַשְׁאִ֤ירוּ מִֽחְיָה֙ בְּ/יִשְׂרָאֵ֔ל וְ/שֶׂ֥ה וָ/שׁ֖וֹר וַ/חֲמֽוֹר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/004.yaml
  text: They would encamp against them and destroy the produce of the land as far as Gaza[a], and they would leave no sustenance in Israel, nor sheep, ox[b], or donkey.
translation:
  language: te
  text: వారు ఇశ్రాయేలీయులపైకి వచ్చి మకాం వేసి, గాజా వరకు[a] ఆ దేశంలోని పంటను నాశనం చేసేవారు. ఇశ్రాయేలులో జీవనాధారమేదీ[b] మిగిల్చేవారు కాదు; గొర్రెలనుగానీ, ఎద్దులనుగానీ, గాడిదలనుగానీ విడిచిపెట్టేవారు కాదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో పదశః, “నీవు గాజాకు చేరేంతవరకు”; ఇది గాజా దిశగా విస్తరించిన ప్రాంతాన్ని తెలిపే నుడికారం.
    reason: lexical_alternative
  - marker: b
    text: లేదా “బతుకుదెరువు” లేదా “పోషణకు కావలసినది.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחֲנוּ עֲלֵיהֶם
  choice: వారు ఇశ్రాయేలీయులకు ఎదురుగా మకాం వేసి
  rationale: חנה అంటే మకాం వేయడం; עַל ఇక్కడ ప్రతికూల సంబంధాన్ని సూచిస్తుంది. ముందున్న సందర్భంలో ఇది పదేపదే జరిగిన దాడి కాబట్టి ‘వేసేవారు’ అనే అలవాటుగా జరిగిన భూతకాల భావం తగినది. సర్వనామంలోని సూచనను తెలుగులో స్పష్టత కోసం ‘ఇశ్రాయేలీయులకు’ అని తెలిపాం.
- source_word: וַיַּשְׁחִיתוּ אֶת יְבוּל הָאָרֶץ
  choice: దేశపు పంటను నాశనం చేసేవారు
  rationale: שׁחת హిఫీల్ రూపం నాశనం చేయడం లేదా పాడుచేయడం అనే భావాన్ని ఇస్తుంది; יְבוּל వ్యవసాయ దిగుబడి లేదా పంటను సూచిస్తుంది. ఆధునిక తెలుగులో ‘దేశపు పంట’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: עַד בּוֹאֲךָ עַזָּה
  choice: గాజా వరకు[a]
  rationale: పదశః ‘నీవు గాజాకు చేరేంతవరకు/గాజా వైపు నీ రాక వరకు’ అనే హీబ్రూ ప్రదేశ సూచక నుడికారాన్ని తెలుగులో సహజంగా ‘గాజా వరకు’ అని అనువదించాం; పదశః రూపాన్ని పాదసూచికలో నిలిపాం.
- source_word: לֹא יַשְׁאִירוּ מִחְיָה בְּיִשְׂרָאֵל
  choice: ఇశ్రాయేలులో జీవనాధారమేదీ[b] మిగలనిచ్చేవారు కాదు
  rationale: מִחְיָה జీవించడానికి అవసరమైన ఆహారం, పోషణ లేదా జీవనోపాధి సాధనాలను విస్తృతంగా సూచించగలదు. ‘జీవనాధారం’ ఆ అర్థ విస్తృతిని నిలుపుతుంది; ‘మిగలనిచ్చేవారు కాదు’ పునరావృత చర్యను తెలియజేస్తుంది.
- source_word: וְשֶׂה וָשׁוֹר וַחֲמוֹר
  choice: గొర్రెలనుగానీ, ఎద్దులనుగానీ, గాడిదలనుగానీ విడిచిపెట్టేవారు కాదు
  rationale: హీబ్రూలో ఏకవచన నామాలు సమూహార్థకంగా ఉన్నాయి. తెలుగులో బహువచనం సహజంగా ఆ సమూహార్థాన్ని వ్యక్తం చేస్తుంది. వాక్యంలోని ‘మిగలనిచ్చేవారు కాదు’ అనే భావాన్ని పశువుల జాబితాకు స్పష్టంగా వర్తింపజేయడానికి ‘విడిచిపెట్టేవారు కాదు’ అని తెలిపాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన కథన శైలి వాడబడింది. పునరావృత దాడులను ‘చేసేవారు’ రూపాలతో వ్యక్తం చేశాం; హీబ్రూ నుడికారం మరియు מִחְיָה పదంలోని అర్థ విస్తృతిని పాదసూచికల్లో సంరక్షించాం.
