source:
  edition: WLC
  text: וּ/מַלְאָכִים֙ שָׁלַ֣ח בְּ/כָל מְנַשֶּׁ֔ה וַ/יִזָּעֵ֥ק גַּם ה֖וּא אַחֲרָ֑י/ו וּ/מַלְאָכִ֣ים שָׁלַ֗ח בְּ/אָשֵׁ֤ר וּ/בִ/זְבֻלוּן֙ וּ/בְ/נַפְתָּלִ֔י וַֽ/יַּעֲל֖וּ לִ/קְרָאתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/035.yaml
  text: And he sent messengers throughout all Manasseh[a], and it too was called out after him. He also sent messengers through Asher, Zebulun, and Naphtali, and they went up to meet them.
translation:
  language: te
  text: అతడు మనష్షే గోత్రమంతటా సందేశకులను పంపాడు; మనష్షే కూడా అతని వెంట చేరమని పిలువబడింది. అతడు ఆషేరు, జెబూలూను, నఫ్తాలి గోత్రాల మధ్యకు కూడా సందేశకులను పంపాడు. ఆ గోత్రాలవారు వారిని కలుసుకోవడానికి పైకి వెళ్లారు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘వారిని’ అనేది శత్రు సేనలను సూచించవచ్చు; లేదా గిద్యోనును, అతనితో అప్పటికే సమకూడిన వారిని సూచించవచ్చు. హీబ్రూ పదంలో బహువచన ప్రత్యయం ఉన్నా, అది ఎవరిని సూచిస్తుందో స్పష్టంగా చెప్పబడలేదు.
    reason: alternative_reading
lexical_decisions:
- source_word: מַלְאָכִים
  choice: సందేశకులు
  rationale: ఈ సైనిక సమీకరణ సందర్భంలో వీరు దేవదూతలు కాదు, పిలుపును తీసుకెళ్లిన మనుషులు. ఆధునిక తెలుగులో ‘సందేశకులు’ ఈ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: בְּכָל מְנַשֶּׁה
  choice: మనష్షే గోత్రమంతటా
  rationale: పిలుపు మనష్షే గోత్ర సముదాయమంతటా చేరిందనే విస్తృతిని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וַיִּזָּעֵק גַּם הוּא אַחֲרָיו
  choice: మనష్షే గోత్రమంతా కూడా అతని వెంట సమకూడింది
  rationale: నిఫల్ క్రియలోని సైనిక పిలుపుకు కూడివచ్చే భావాన్ని, మనష్షేను సమష్టిగా సూచించే ఏకవచన హీబ్రూ నిర్మాణాన్ని సహజ తెలుగులో అందిస్తుంది.
- source_word: בְּאָשֵׁר וּבִזְבֻלוּן וּבְנַפְתָּלִי
  choice: ఆషేరు, జెబూలూను, నఫ్తాలి గోత్రాల మధ్యకు
  rationale: ప్రతి గోత్రం వద్ద ఉన్న בְ ఉపసర్గ, సందేశకులు ఆ గోత్ర సముదాయాల మధ్యకు వెళ్లి పిలుపునిచ్చారని సూచిస్తుంది.
- source_word: וַיַּעֲלוּ
  choice: పైకి వెళ్లారు
  rationale: హీబ్రూ క్రియలోని ‘పైకి వెళ్లడం’ అనే దిశాత్మక భావాన్ని అనవసరంగా ‘దండెత్తారు’ అని నిర్దిష్టం చేయకుండా నిలుపుతుంది.
- source_word: לִקְרָאתָם
  choice: వారిని కలుసుకోవడానికి
  rationale: హీబ్రూలో బహువచన ప్రత్యయం ఉన్నందున ‘వారిని’ అని ఉంచబడింది. ‘కలుసుకోవడానికి’ అనేది ఎదురుగా వెళ్లే భావాన్ని ఇస్తూనే, వారు శత్రువులేనని ప్రధాన పాఠ్యంలో తేల్చదు.
theological_decisions:
- issue: לִקְרָאתָם లోని బహువచన ప్రత్యయం ఎవరిని సూచిస్తుంది?
  choice: ప్రధాన పాఠ్యంలో ‘వారిని’ అనే అస్పష్ట బహువచనాన్ని నిలుపడం
  alternative: శత్రు సేనలను ఎదుర్కోవడానికి వెళ్లారు; లేదా గిద్యోనును, అతనితో కూడిన వారిని కలుసుకోవడానికి వెళ్లారు
  rationale: హీబ్రూ ప్రత్యయం బహువచనమే అయినా దాని పూర్వపదం స్పష్టంగా లేదు. యుద్ధ సందర్భం శత్రు సేనలను సూచించవచ్చు; సమీప కథన ప్రవాహం గిద్యోను మరియు అప్పటికే అతనితో కూడిన బలగాలను కూడా సూచించవచ్చు. కాబట్టి ప్రధాన పాఠ్యంలో ఒకే అర్థాన్ని బలవంతంగా నిర్ణయించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. గోత్రాల సమష్టి భావం స్పష్టంగా ఉండేందుకు పేర్లతో ‘గోత్రం’ చేర్చబడింది; మూలంలోని సూచనాస్పష్టత చివరి వాక్యంలోను పాదసూచికలోను కాపాడబడింది.
