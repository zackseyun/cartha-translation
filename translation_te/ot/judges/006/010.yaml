  to: 'నేను మీతో ఇలా చెప్పాను: ‘నేను మీ దేవుడైన యహ్వేను. మీరు ఎవరి దేశంలో నివసిస్తున్నారో, ఆ అమోరీయుల దేవుళ్లకు భయపడకండి. కానీ మీరు నా మాట వినలేదు[a].’'
  rationale: The revision keeps all source-level referents and the Hebrew prohibition intact, while using the more idiomatic Telugu expression ‘నా మాట వినలేదు’ for the Hebrew idiom ‘you have not listened to my voice.’ The footnote preserves the obedience nuance without narrowing the main text.
