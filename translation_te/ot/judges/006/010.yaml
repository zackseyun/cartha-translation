id: JDG.6.10
reference: Judges 6:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וָ/אֹמְרָ֣/ה לָ/כֶ֗ם אֲנִי֙ יְהוָ֣ה אֱלֹהֵי/כֶ֔ם לֹ֤א תִֽירְאוּ֙ אֶת אֱלֹהֵ֣י הָ/אֱמֹרִ֔י אֲשֶׁ֥ר אַתֶּ֖ם יוֹשְׁבִ֣ים בְּ/אַרְצָ֑/ם וְ/לֹ֥א שְׁמַעְתֶּ֖ם בְּ/קוֹלִֽ/י־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/010.yaml
  text: And I said to you[a], ‘I am Yahweh your God; do not fear the gods of the Amorites, in whose land you dwell[b]. But you have not listened to my voice.’
translation:
  language: te
  text: 'నేను మీతో ఇలా చెప్పాను: ‘నేను మీ దేవుడైన యహ్వేను. మీరు ఎవరి దేశంలో నివసిస్తున్నారో, ఆ అమోరీయుల దేవుళ్లకు భయపడకండి. కానీ మీరు నా మాట వినలేదు[a].’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “నా మాట వినలేదు” అనే మాటను “నా మాటకు లోబడలేదు” అని కూడా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמְרָה לָכֶם
  choice: నేను మీతో … అని చెప్పాను
  rationale: אמר అనే సాధారణ ‘చెప్పు’ క్రియను సహజమైన ఆధునిక తెలుగు ప్రత్యక్ష వాక్య నిర్మాణంలో అందించింది; హీబ్రూ కథన కొనసాగింపును సందర్భమే స్పష్టం చేస్తుంది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవనామమైన టెట్రాగ్రామటన్‌ను బిరుదుతో భర్తీ చేయకుండా వ్యక్తిగత నామంగా లిప్యంతరీకరించింది.
- source_word: אֱלֹהֵיכֶם
  choice: మీ దేవుడు
  rationale: రూపపరంగా బహువచనమైన אֱלֹהִים ఇక్కడ ఇశ్రాయేలు దేవుణ్ణి సూచిస్తూ ఏకవచన అర్థంలో ఉంది.
- source_word: לֹא תִירְאוּ
  choice: భయపడకండి
  rationale: నిరాకరణతో కూడిన అసంపూర్ణ క్రియ ఇక్కడ నిషేధాజ్ఞను వ్యక్తం చేస్తుంది; ‘భయపడకండి’ ఆధునిక తెలుగులో నేరుగా, సహజంగా ఆ బలాన్ని తెలియజేస్తుంది.
- source_word: אֶת אֱלֹהֵי הָאֱמֹרִי
  choice: ఆ అమోరీయుల దేవుళ్లకు
  rationale: హీబ్రూ జాతివాచక ఏకవచనాన్ని తెలుగు సామూహిక బహువచనంగా అందించి, ఆ ప్రజలు ఆరాధించిన దేవతలను సూచించింది.
- source_word: אֲשֶׁר אַתֶּם יוֹשְׁבִים בְּאַרְצָם
  choice: మీరు ఎవరి దేశంలో నివసిస్తున్నారో, ఆ అమోరీయుల
  rationale: సంబంధ వాక్యం అమోరీయులను సూచిస్తుందనే విషయాన్ని స్పష్టంగా ఉంచుతూ, ישב లోని స్థిర నివాస భావాన్ని ‘నివసిస్తున్నారు’తో తెలిపింది.
- source_word: וְלֹא שְׁמַעְתֶּם בְּקוֹלִי
  choice: కానీ మీరు నా స్వరం వినలేదు
  rationale: שמע בקול అనే హీబ్రూ నుడికారంలోని ‘వినడం’ రూపకాన్ని నిలిపి, దానిలో అంతర్లీనంగా ఉన్న విధేయత భావాన్ని పాదసూచికలో తెలిపింది; וְ ఇక్కడ వ్యతిరేక భావాన్ని కలుపుతున్నందున ‘కానీ’ అని అనువదించింది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యహ్వే
  alternative: ప్రభువు
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది; దాన్ని బిరుదుగా మార్చకుండా ఉంచడం మూలంలోని నిబంధనాత్మక వ్యక్తిగత సూచనను కాపాడుతుంది.
- issue: ‘నా స్వరం వినలేదు’లో వినడం–విధేయత సంబంధం
  choice: మూల నుడికారాన్ని ప్రధాన పాఠంలో ఉంచడం
  alternative: మీరు నా మాటకు లోబడలేదు
  rationale: שמע בקולకు ‘విని లక్ష్యపెట్టడం/లోబడడం’ అనే భావం ఉంది. ప్రధాన పాఠంలో రూపకాన్ని నిలిపి, పాదసూచికలో విధేయత భావాన్ని తెలపడం ద్వారా భావవిస్తృతిని సంకుచితం చేయకుండా ఉంచింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి వాడబడింది. ‘యహ్వే’ను దైవనామంగా నిలిపి, హీబ్రూ ‘నా స్వరం వినడం’ నుడికారాన్ని సహజంగా కాపాడింది.
