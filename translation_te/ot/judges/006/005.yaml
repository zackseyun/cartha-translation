translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు స్పష్టంగా ఉండే గంభీరమైన కథన శైలి వాడబడింది. గతంలో పదేపదే జరిగిన దండయాత్రను ‘వచ్చేవారు/వచ్చేవి’ రూపాలు తెలియజేస్తాయి. హీబ్రూలోని ‘గుడారాలు వచ్చేవి’ అనే సజీవ రూపకప్రయోగాన్ని ప్రధాన పాఠ్యంలో నిలిపి, దాని భావాన్ని పాదటీకలో వివరించాం.
