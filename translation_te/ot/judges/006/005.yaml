review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the repeated invasions, livestock, countless people and camels, and destructive purpose. However, it separates the locust comparison from the preceding clause and changes the Hebrew's coming imagery into “they were like ... locust swarms.” In the Hebrew, the comparison qualifies the arrival of their tents/encampments.
  naturalness: The Telugu is generally clear and uses an appropriate modern narrative register. Reattaching the locust comparison to “their tents came” makes the sequence more coherent while retaining the Hebrew’s vivid metonymy, explained in the note.
  terminology: “పశువులు,” “గుడారాలు,” “ఒంటెలు,” and “నాశనం చేయడానికి” are suitable. “సంఖ్యే లేదు” is a more natural and direct Telugu equivalent for the Hebrew idiom “there was no number.”
  issues:
  - severity: medium
    issue: 'The locust comparison is made into a separate predication: “వారు విస్తారమైన మిడతల దండులా ఉండేవారు.”'
    rationale: The source says that their tents came in abundance like locusts; it does not say simply that the invaders ‘were’ like locust swarms. The revision reconnects the comparison to the arrival clause.
  - severity: low
    issue: “వారికీ వారి ఒంటెలకూ లెక్కే లేదు” is understandable but somewhat idiomatic/elliptical.
    rationale: “వారికీ వారి ఒంటెలకూ సంఖ్యే లేదు” closely represents the Hebrew expression and reads more naturally in this register.
  revised_text: ఎందుకంటే వారు తమ పశువులతో పైకి వచ్చేవారు; వారి గుడారాలు కూడా మిడతల దండులంత విస్తారంగా వచ్చేవి.[a][b] వారికీ వారి ఒంటెలకూ సంఖ్యే లేదు. దేశాన్ని నాశనం చేయడానికే వారు ఆ దేశంలోకి వచ్చేవారు.[c]
