  to: ఎందుకంటే వారు తమ పశువులతో పైకి వచ్చేవారు; వారి గుడారాలు కూడా మిడతల దండులంత విస్తారంగా వచ్చేవి.[a][b] వారికీ వారి ఒంటెలకూ సంఖ్యే లేదు. దేశాన్ని నాశనం చేయడానికే వారు ఆ దేశంలోకి వచ్చేవారు.[c]
