source:
  edition: WLC
  text: כִּ֡י הֵם֩ וּ/מִקְנֵי/הֶ֨ם יַעֲל֜וּ וְ/אָהֳלֵי/הֶ֗ם יבאו כְ/דֵֽי אַרְבֶּה֙ לָ/רֹ֔ב וְ/לָ/הֶ֥ם וְ/לִ/גְמַלֵּי/הֶ֖ם אֵ֣ין מִסְפָּ֑ר וַ/יָּבֹ֥אוּ בָ/אָ֖רֶץ לְ/שַׁחֲתָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/005.yaml
  text: For they and their livestock would come up[a], and their tents would come like locusts in multitude; both they and their camels were without number[c][b], and they came into the land to destroy it.
translation:
  language: te
  text: ఎందుకంటే వారు తమ పశువులతో పైకి వచ్చేవారు; వారి గుడారాలు కూడా మిడతల దండులంత విస్తారంగా వచ్చేవి.[a][b] వారికీ వారి ఒంటెలకూ సంఖ్యే లేదు. దేశాన్ని నాశనం చేయడానికే వారు ఆ దేశంలోకి వచ్చేవారు.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “వారి గుడారాలు వచ్చేవి”; ఇక్కడ గుడారాలు దండయాత్రికుల శిబిరాలను సూచిస్తున్నాయి.
    reason: cultural_note
  - marker: b
    text: లేదా “లెక్కలేనన్ని మిడతల్లా” లేదా “మిడతల గుంపుల్లా.”
    reason: lexical_alternative
  - marker: c
    text: లేదా “దేశాన్ని పాడుచేయడానికి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ఇశ్రాయేలు ఎందుకు దరిద్ర స్థితికి చేరిందో ముందరి వాక్యానికి వివరణను పరిచయం చేస్తుంది.
- source_word: וּמִקְנֵיהֶם
  choice: తమ పశువులతో
  rationale: מִקְנֶה అన్ని రకాల పెంపుడు పశుసంపదను సూచిస్తుంది; కేవలం పశువులలో ఒక జాతిని కాదు.
- source_word: יַעֲלוּ
  choice: పైకి వచ్చేవారు
  rationale: గతంలో పదేపదే జరిగే చర్యను సూచించే అసంపూర్ణ క్రియారూపాన్ని ‘వచ్చేవారు’ తెలియజేస్తుంది; ‘పైకి’ అనే దిశా భావాన్ని కూడా నిలుపుతుంది.
- source_word: וְאָהֳלֵיהֶם יָבֹאוּ
  choice: వారి గుడారాలు కూడా వచ్చేవి
  rationale: దండయాత్రికుల శిబిరాలను వారి ‘గుడారాలు’గా చెప్పే హీబ్రూ రూపకప్రయోగాన్ని సాధ్యమైనంతవరకు నిలుపుతుంది.
- source_word: כְּדֵי אַרְבֶּה לָרֹב
  choice: విస్తారమైన మిడతల దండులా
  rationale: దండయాత్రికుల అపార సంఖ్యను మిడతల సమూహంతో పోల్చే భావాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: וְלָהֶם וְלִגְמַלֵּיהֶם אֵין מִסְפָּר
  choice: వారికీ వారి ఒంటెలకూ లెక్కే లేదు
  rationale: మనుషులూ ఒంటెలూ లెక్కించలేనంతమంది ఉన్నారనే హీబ్రూ నుడికారాన్ని నేరుగా నిలుపుతుంది.
- source_word: וַיָּבֹאוּ בָאָרֶץ
  choice: వారు దానిలోకి వచ్చేవారు
  rationale: దేశంలోకి ప్రవేశించిన చర్యను తెలుపుతుంది; పేరా అంతటా ఉన్న పునరావృత గత చర్య భావానికి అనుగుణంగా ‘వచ్చేవారు’ వాడబడింది.
- source_word: לְשַׁחֲתָהּ
  choice: దేశాన్ని నాశనం చేయడానికి
  rationale: దండయాత్ర ఉద్దేశాన్ని తెలిపే שׁחת క్రియ యొక్క విస్తృతమైన, సూటి అర్థాన్ని అందిస్తుంది; ‘పాడుచేయడానికి’ కూడా సాధ్యమైన ప్రత్యామ్నాయం.
