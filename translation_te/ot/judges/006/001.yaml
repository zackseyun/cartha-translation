  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּעֲשׂ֧וּ בְנֵי יִשְׂרָאֵ֛ל הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה וַ/יִּתְּנֵ֧/ם יְהוָ֛ה בְּ/יַד מִדְיָ֖ן שֶׁ֥בַע שָׁנִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/001.yaml
  text: And the sons of Israel did what was evil in the eyes of Yahweh[c][b][a], and Yahweh gave them into the hand of Midian for seven years.
translation:
  language: te
  text: ఇశ్రాయేలు ప్రజలు[a] యెహోవా దృష్టిలో చెడ్డది చేశారు. కాబట్టి యెహోవా వారిని ఏడు సంవత్సరాలు మిద్యాను చేతికి అప్పగించాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘ఇశ్రాయేలు కుమారులు’; ఇక్కడ మొత్తం ఇశ్రాయేలు ప్రజలను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘మిద్యాను చేతికి అప్పగించాడు’; ‘చేతికి’ అనేది ఒకరి అధికారం లేదా నియంత్రణలో ఉండడాన్ని సూచించే హీబ్రూ నుడికారం.
    reason: cultural_note
lexical_decisions:
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు ప్రజలు
  rationale: అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులు.’ ఇక్కడ అది ఇశ్రాయేలు సమాజాన్ని సూచించే హీబ్రూ జాతీయ సంబోధన; ఆధునిక తెలుగులో ‘ఇశ్రాయేలు ప్రజలు’ సహజంగా, సమగ్రంగా అర్థాన్ని అందిస్తుంది.
- source_word: הָרַע
  choice: చెడ్డది
  rationale: עשה తో కలిసి ‘చెడ్డది చేయడం’ అనే నైతిక భావాన్ని ఇస్తుంది; తెలుగు వాక్యంలో మూలంలోని నిర్ణీత నైతిక విలువను నిలుపుతుంది.
- source_word: בְעֵינֵי יְהוָה
  choice: యెహోవా దృష్టిలో
  rationale: అక్షరార్థంగా ‘యెహోవా కళ్లలో’; ఇది ఆయన తీర్పు లేదా మూల్యాంకనం ప్రకారం అనే హీబ్రూ నుడికారం. ‘దృష్టిలో’ తెలుగులో సహజమైన సమానార్థక ప్రయోగం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన టెట్రాగ్రామటన్‌ను తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం ‘యెహోవా’గా లిప్యంతరీకరించాం; దాన్ని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయలేదు.
- source_word: וַיִּתְּנֵם
  choice: వారిని ... అప్పగించాడు
  rationale: తరువాతి ‘చేతిలో’ అనే అధికార నుడికారంతో కలిసి, נתן ఇక్కడ మరొకరి అధికారం కిందికి అప్పగించడాన్ని సూచిస్తుంది.
- source_word: בְיַד מִדְיָן
  choice: మిద్యాను ఆధీనానికి
  rationale: అక్షరార్థంగా ‘మిద్యాను చేతిలో.’ ‘చెయ్యి’ అధికారం లేదా నియంత్రణకు హీబ్రూ నుడికారం; ఆధునిక తెలుగులో ‘ఆధీనానికి’ ఆ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: מִדְיָן
  choice: మిద్యాను
  rationale: వ్యక్తి/ప్రజల పేరును తెలుగు బైబిలు సంప్రదాయానికి అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: שֶׁבַע שָׁנִים
  choice: ఏడు సంవత్సరాలు
  rationale: కాలవ్యవధిని తెలుగులో సహజంగా తెలిపే రూపం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో వ్యక్తిగత దైవనామమే ఉంది. దానిని బిరుదుగా మార్చకుండా, ఆధునిక తెలుగు క్రైస్తవ వాడుకలో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం; ‘యాహ్వే’ మరింత పండితీయ లిప్యంతరణగా సాధ్యమే.
- issue: בְנֵי יִשְׂרָאֵל అనే సామూహిక సంబోధన
  choice: ఇశ్రాయేలు ప్రజలు
  alternative: ఇశ్రాయేలు కుమారులు
  rationale: హీబ్రూ రూపం అక్షరార్థంగా పురుష బహువచనమైనా, ఈ సందర్భంలో మొత్తం ఇశ్రాయేలు సమాజాన్ని సూచించే జాతీయ నుడికారం. తెలుగులో అక్షరానువాదం కేవలం మగవారినే సూచించే అపార్థం కలిగించవచ్చు; అందువల్ల సామూహిక అర్థాన్ని ఇచ్చాం, అక్షరార్థాన్ని పాదటిప్పణిలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన కథనశైలి. హీబ్రూ నుడికారాల భావాన్ని ప్రధాన పాఠ్యంలో సహజంగా ఇచ్చి, ముఖ్యమైన మూలరూపాలను పాదటిప్పణుల్లో భద్రపరిచాం.
