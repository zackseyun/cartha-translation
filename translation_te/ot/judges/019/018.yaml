source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֵלָ֗י/ו עֹבְרִ֨ים אֲנַ֜חְנוּ מִ/בֵּֽית לֶ֣חֶם יְהוּדָה֮ עַד יַרְכְּתֵ֣י הַר אֶפְרַיִם֒ מִ/שָּׁ֣ם אָנֹ֔כִי וָ/אֵלֵ֕ךְ עַד בֵּ֥ית לֶ֖חֶם יְהוּדָ֑ה וְ/אֶת בֵּ֤ית יְהוָה֙ אֲנִ֣י הֹלֵ֔ךְ וְ/אֵ֣ין אִ֔ישׁ מְאַסֵּ֥ף אוֹתִ֖/י הַ/בָּֽיְתָ/ה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/018.yaml
  text: He said to him[a], “We are passing through from Bethlehem in Judah to the remote parts of the hill country of Ephraim. I am from there, and I went to Bethlehem in Judah, and I am going to the house of Yahweh, but no man is taking me into his house.”
translation:
  language: te
  text: 'అతడు అతనితో ఇలా అన్నాడు: “మేము యూదాలోని బేత్లెహేము నుండి ఎఫ్రాయిము కొండప్రాంతపు మారుమూల భాగాలకు ప్రయాణిస్తున్నాం. నేను అక్కడివాడిని; నేను యూదాలోని బేత్లెహేముకు వెళ్లాను. నేను యహ్వే ఇంటికి[a] వెళ్తున్నాను, అయితే నన్ను తన ఇంటికి చేర్చుకునే ఏ మనిషీ లేడు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఇంటికి వెళ్తున్నాను” లేదా “నా ఇంటికి వెళ్తున్నాను.” సందర్భంలో “యహ్వే ఇల్లు” అనేది అనూహ్యంగా కనిపించడం వల్ల, కొందరు దీనిని నుడికారంగా అర్థం చేసుకుంటారు లేదా భిన్న పాఠాన్ని ప్రతిపాదిస్తారు.
    reason: alternative_reading
lexical_decisions:
- source_word: עֹבְרִים אֲנַחְנוּ
  choice: మేము ... ప్రయాణిస్తున్నాం
  rationale: עבר క్రియారూపం కొనసాగుతున్న ప్రయాణాన్ని లేదా దారిలో సాగడాన్ని సూచిస్తుంది. తెలుగులో ‘ప్రయాణిస్తున్నాం’ సహజంగా ఉండి ఆ భావాన్ని నిలుపుతుంది.
- source_word: מִבֵּית לֶחֶם יְהוּדָה
  choice: యూదాలోని బేత్లెహేము నుండి
  rationale: భౌగోళిక గుర్తింపును ఆధునిక తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: יַרְכְּתֵי הַר אֶפְרַיִם
  choice: ఎఫ్రాయిము కొండప్రాంతపు మారుమూల భాగాలకు
  rationale: יַרְכְּתֵי అనే పదంలోని చివరి అంచులు లేదా దూర ప్రాంతాలు అనే భావాన్ని ‘మారుమూల భాగాలు’ తెలియజేస్తుంది; הַר אֶפְרַיִם ఇక్కడ ఎఫ్రాయిము కొండప్రాంతం.
- source_word: מִשָּׁם אָנֹכִי
  choice: నేను అక్కడివాడినే
  rationale: మాట్లాడేవాని మూలస్థానాన్ని తెలిపే సరళమైన, సహజమైన తెలుగు రూపం.
- source_word: וָאֵלֵךְ עַד בֵּית לֶחֶם יְהוּדָה
  choice: నేను యూదాలోని బేత్లెహేముకు వెళ్లాను
  rationale: הלך యొక్క wayyiqtol రూపాన్ని సందర్భాన్ని సులభతరం చేయకుండా గతకాల చర్యగానే అనువదిస్తుంది.
- source_word: וְאֶת בֵּית יְהוָה אֲנִי הֹלֵךְ
  choice: ఇప్పుడు యెహోవా మందిరానికి వెళ్తున్నాను
  rationale: మసొరెటిక్ పాఠంలోని ‘యెహోవా గృహం’ను నిలుపుతూ, ఆరాధనా స్థలాన్ని తెలుగులో సహజంగా సూచించేందుకు ‘మందిరం’ వాడబడింది. ‘ఇప్పుడు’ ప్రస్తుత ప్రయాణ దిశను స్పష్టం చేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో స్థిరపడిన లిప్యంతరీకరణతో అందిస్తుంది.
- source_word: וְאֵין אִישׁ מְאַסֵּף אוֹתִי הַבָּיְתָה
  choice: నన్ను తన ఇంట్లోకి చేర్చుకునే మనిషి ఎవరూ లేరు
  rationale: ఆతిథ్య సందర్భంలో אסף అంటే ఇంట్లోకి తీసుకొని ఆశ్రయం ఇవ్వడం. אִישׁ యొక్క పురుష ఏకవచనాన్ని ‘మనిషి’తో నిలుపుతూ వాక్యాన్ని సహజ తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: וְאֶת בֵּית יְהוָה אֲנִי הֹלֵךְ అనే పాఠం
  choice: యెహోవా మందిరానికి వెళ్తున్నాను
  alternative: ఇంటికి వెళ్తున్నాను / నా ఇంటికి వెళ్తున్నాను
  rationale: మసొరెటిక్ పాఠం స్పష్టంగా ‘యెహోవా గృహం’ అని ఉంది. సందర్భపరమైన క్లిష్టత కారణంగా ప్రతిపాదించిన ప్రత్యామ్నాయాన్ని ప్రధాన పాఠంలో పెట్టకుండా పాదసూచికలో ఉంచడం మూలపాఠానికీ దాని నిజమైన అనిశ్చితికీ న్యాయం చేస్తుంది.
- issue: אִישׁ యొక్క లింగసూచక ఏకవచనం
  choice: మనిషి ఎవరూ లేరు
  alternative: ఎవరూ లేరు
  rationale: ఇంటి ఆతిథ్యం ఇచ్చే పురుష గృహస్థుని గురించిన సందర్భంలో హెబ్రీ పురుష ఏకవచనాన్ని తెలుగులో నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరత కలిగిన శైలి. కథనంలోని ప్రయాణ భాషను సరళంగా ఉంచి, క్లిష్టమైన ‘యెహోవా గృహం’ పాఠాన్ని ప్రధాన వచనంలో సంరక్షించి ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
