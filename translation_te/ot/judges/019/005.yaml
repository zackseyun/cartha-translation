translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. హీబ్రూలో బహువచనం నుంచి ఏకవచనానికి, మళ్లీ బహువచనానికి జరిగే మార్పులను సాధ్యమైనంత స్పష్టంగా నిలిపాం; ‘హృదయాన్ని బలపరచుకో’ అనే మూల నుడికారాన్ని పాదసూచిక వివరణతో ఉంచాం.
