source:
  edition: WLC
  text: וַֽ/יְהִי֙ בַּ/יּ֣וֹם הָ/רְבִיעִ֔י וַ/יַּשְׁכִּ֥ימוּ בַ/בֹּ֖קֶר וַ/יָּ֣קָם לָ/לֶ֑כֶת וַ/יֹּאמֶר֩ אֲבִ֨י הַֽ/נַּעֲרָ֜ה אֶל חֲתָנ֗/וֹ סְעָ֧ד לִבְּ/ךָ֛ פַּת לֶ֖חֶם וְ/אַחַ֥ר תֵּלֵֽכוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/005.yaml
  text: On the fourth day[a], they rose early in the morning, and he got up to go. But the young woman’s father said to his son-in-law, “Refresh your heart with a morsel of bread[b], and afterward you may go.”
translation:
  language: te
  text: నాలుగవ రోజున వారు తెల్లవారుజామునే లేచారు. అతడు బయలుదేరడానికి లేచాడు. అప్పుడు ఆ యువతి తండ్రి తన అల్లుడితో, “కొంచెం రొట్టె తిని నీ హృదయాన్ని బలపరచుకో[a]. ఆ తరువాత మీరు వెళ్లవచ్చు[b]” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “రొట్టె ముక్కతో నీ హృదయాన్ని బలపరచుకో.” ఇది ఆహారం తిని శక్తి పొందడాన్ని సూచించే నుడికారం.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ “వెళ్లవచ్చు” అనే హీబ్రూ క్రియ బహువచనంలో ఉంది. తండ్రి నేరుగా తన అల్లుడితో మాట్లాడుతున్నప్పటికీ, ప్రయాణ బృందమంతటినీ ఉద్దేశించి ఉండవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: בַּיּוֹם הָרְבִיעִי
  choice: నాలుగవ రోజున
  rationale: కాలాన్ని సూచించే హీబ్రూ పదబంధాన్ని అదనపు వివరాలు చేర్చకుండా సహజంగా అనువదిస్తుంది.
- source_word: וַיַּשְׁכִּימוּ בַבֹּקֶר
  choice: వారు తెల్లవారుజామునే లేచారు
  rationale: బహువచన క్రియను నిలుపుతూ, వారు చాలా ఉదయాన్నే లేచారనే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: וַיָּקָם לָלֶכֶת
  choice: అతడు బయలుదేరడానికి లేచాడు
  rationale: ఇక్కడ ఏకవచనానికి మారి లేవీయునిపై దృష్టి పడటాన్ని, అలాగే వెళ్లాలనే ఉద్దేశాన్ని నిలుపుతుంది.
- source_word: אֲבִי הַנַּעֲרָה
  choice: ఆ యువతి తండ్రి
  rationale: נַעֲרָהను వయస్సును అతిగా నిర్దిష్టం చేయకుండా ఆధునిక తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: חֲתָנוֹ
  choice: తన అల్లుడితో
  rationale: సందర్భంలో తండ్రికి ఆ లేవీయునితో ఉన్న బంధాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: סְעָד לִבְּךָ
  choice: నీ హృదయాన్ని బలపరచుకో
  rationale: భోజనం ద్వారా శక్తి పొందడాన్ని సూచించే హీబ్రూ నుడికారంలోని ‘హృదయం’ అనే రూపకాన్ని ప్రధాన పాఠ్యంలో నిలుపుతుంది.
- source_word: פַּת לֶחֶם
  choice: కొంచెం రొట్టె తిని
  rationale: అక్షరార్థంగా ‘రొట్టె ముక్క’ అయినా, ఆహారం తీసుకొని బలపడమనే సందర్భార్థాన్ని సాధారణ పాఠకులకు సహజంగా అందిస్తుంది.
- source_word: וְאַחַר תֵּלֵכוּ
  choice: ఆ తరువాత మీరు వెళ్లవచ్చు
  rationale: చివరి క్రియలోని బహువచనాన్ని ‘మీరు’ ద్వారా నిలుపుతూ, ప్రయాణ బృందమంతటినీ ఉద్దేశించిన అనుమతి లేదా ఆహ్వాన భావాన్ని తెలియజేస్తుంది.
