  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘ఇదిగో’ ద్వారా మూలంలోని కథన సంకేతం నిలుపబడింది. స్థలనామాలు సాధారణ తెలుగు బైబిలు రూపాలకు అనుగుణంగా ‘ఎఫ్రాయిము,’ ‘గిబియా,’ ‘బెన్యామీను’గా లిప్యంతరీకరించబడ్డాయి.
