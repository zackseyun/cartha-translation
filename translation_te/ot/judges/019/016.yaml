source:
  edition: WLC
  text: וְ/הִנֵּ֣ה אִ֣ישׁ זָקֵ֗ן בָּ֣א מִֽן מַעֲשֵׂ֤/הוּ מִן הַ/שָּׂדֶה֙ בָּ/עֶ֔רֶב וְ/הָ/אִישׁ֙ מֵ/הַ֣ר אֶפְרַ֔יִם וְ/הוּא גָ֖ר בַּ/גִּבְעָ֑ה וְ/אַנְשֵׁ֥י הַ/מָּק֖וֹם בְּנֵ֥י יְמִינִֽי׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/016.yaml
  text: And behold[a], an old man was coming in from his work in the field at evening. The man was from the hill country of Ephraim, and he was staying in Gibeah[b], but the men of the place were Benjaminites.
translation:
  language: te
  text: ఇదిగో, ఒక వృద్ధుడు పొలంలోని తన పని నుండి సాయంకాలం వస్తున్నాడు. ఆ మనిషి ఎఫ్రాయిము కొండ ప్రాంతానికి[a] చెందినవాడు; అతడు గిబియాలో నివసించేవాడు[b]. కానీ ఆ ఊరి పురుషులు బెన్యామీనీయులు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “ఎఫ్రాయిము కొండప్రాంతం నుండి.”
    reason: lexical_alternative
  - marker: b
    text: “నివసించేవాడు” అని అనువదించిన హీబ్రూ క్రియకు “పరదేశిగా నివసించేవాడు” లేదా “తాత్కాలికంగా ఉండేవాడు” అనే అర్థం కూడా ఉండవచ్చు. అతడు గిబియాలో నివసించినప్పటికీ అక్కడి మూలవాసి కాకపోవచ్చని ఇది సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: కథలో కొత్తగా గమనించదగిన వ్యక్తి రంగప్రవేశాన్ని సూచించే హీబ్రూ అవ్యయ బలాన్ని నిలుపుతుంది.
- source_word: אִישׁ זָקֵן
  choice: ఒక వృద్ధుడు
  rationale: వయస్సును స్పష్టంగా తెలియజేస్తూ ఆధునిక ప్రామాణిక తెలుగులో సహజంగా ఉంటుంది.
- source_word: בָּא מִן מַעֲשֵׂהוּ מִן הַשָּׂדֶה
  choice: పొలంలో తన పని నుండి వస్తున్నాడు
  rationale: రెండు מִן పదబంధాల భావాన్ని సహజమైన తెలుగు వాక్య నిర్మాణంలో కలిపి, అతడు పొలపు పని నుంచి వస్తున్నాడనే అర్థాన్ని కాపాడుతుంది.
- source_word: בָּעֶרֶב
  choice: సాయంకాలం
  rationale: కాల సూచనను సంక్షిప్తంగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: מֵהַר אֶפְרַיִם
  choice: ఎఫ్రాయిము కొండ ప్రాంతానికి
  rationale: హీబ్రూ భౌగోళిక నామాన్ని ఆధునిక పాఠకునికి స్పష్టంగా అందిస్తుంది; అక్షరార్థమైన ‘ఎఫ్రాయిము కొండ’ను పాదసూచికలో ఉంచింది.
- source_word: גָר בַּגִּבְעָה
  choice: గిబియాలో నివసించేవాడు
  rationale: ప్రధాన వాక్యంలో సహజమైన తెలుగును ఉపయోగిస్తూ, גּוּר‌లోని పరదేశి లేదా తాత్కాలిక నివాసి భావాన్ని పాదసూచికలో వెల్లడిస్తుంది.
- source_word: וְאַנְשֵׁי הַמָּקוֹם
  choice: అయితే ఆ ప్రాంతపు మనుషులు
  rationale: వృద్ధుని ఎఫ్రాయిమీయ నేపథ్యానికి, స్థానికుల బెన్యామీనీయ గుర్తింపుకు మధ్యనున్న అంతర్లీన వ్యత్యాసాన్ని ‘అయితే’ స్పష్టం చేస్తుంది.
- source_word: בְּנֵי יְמִינִי
  choice: బెన్యామీనీయులు
  rationale: ‘బెన్యామీను కుమారులు’ అనే అక్షరార్థానికి బదులుగా గోత్ర గుర్తింపును సహజంగా, స్పష్టంగా తెలియజేస్తుంది.
