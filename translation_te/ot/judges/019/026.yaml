base_translation:
  language: en
  yaml_path: translation/ot/judges/019/026.yaml
  text: The woman came as morning was dawning and fell at the entrance of the house of the man where her master was[b][a], until it was light.
translation:
  language: te
  text: తెల్లవారుతున్న వేళ[a] ఆ స్త్రీ వచ్చి, తన యజమాని[b] ఉన్న ఆ మనిషి ఇంటి ద్వారం దగ్గర పడిపోయి, వెలుగు వచ్చే వరకు పడి ఉంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఉదయం వైపు తిరిగే వేళ’ లేదా ‘వేకువకు ముందు.’ హీబ్రూ నుడికారం అక్షరార్థంగా ఉదయం తిరగడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘తన ప్రభువు.’ హీబ్రూలో ‘తన యజమాని’ అని ఉంది; ఇది అధికారాన్ని సూచించే పదం, ‘తన భర్త’ అని స్పష్టంగా చెప్పే పదం కాదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִפְנוֹת הַבֹּקֶר
  choice: తెల్లవారుతున్న వేళ
  rationale: పנה + בֹּקֶר అనే హీబ్రూ కాలసూచక ప్రయోగం ఉదయం వైపు తిరుగుతున్న సమయాన్ని, అంటే తెల్లవారడం మొదలవుతున్న వేళను సూచిస్తుంది. ఈ రూపం సహజమైన ఆధునిక తెలుగులో ఆ భావచిత్రాన్ని నిలుపుతుంది.
- source_word: וַתָּבֹא
  choice: వచ్చి
  rationale: בוא అనే సాధారణ గమన క్రియకు ‘వచ్చింది’ ప్రాథమిక అర్థం. సందర్భం తిరిగి రావడాన్ని సూచించినా, ‘తిరిగి వచ్చింది’ అని మూలంలో లేని భావాన్ని చేర్చలేదు.
- source_word: וַתִּפֹּל
  choice: పడిపోయింది
  rationale: נפל యొక్క నేర అర్థం ‘పడిపోవడం.’ ఆమె కుప్పకూలిందని సందర్భం సూచించవచ్చుగాని, కారణం లేదా తీవ్రతను అదనంగా నిర్ధారించకుండా మూలంలోని నిరాడంబరమైన వర్ణనను నిలుపుతుంది.
- source_word: פֶּתַח בֵּית
  choice: ఇంటి ద్వారం దగ్గర
  rationale: פֶּתַח అంటే తెరువు, ప్రవేశద్వారం. ‘ఇంటి ద్వారం దగ్గర’ అనేది తెలుగులో సహజంగా ఉండి స్థలాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: הָאִישׁ
  choice: ఆ మనిషి
  rationale: אִישׁ యొక్క సాధారణ అర్థం ‘మనిషి/పురుషుడు.’ సందర్భం అతడు ఇంటి వృద్ధ యజమాని అని తెలియజేసినా, మూలపాఠం ఇచ్చిన దానికంటే ప్రత్యేకతను పెంచలేదు.
- source_word: אֲדוֹנֶיהָ
  choice: తన యజమాని
  rationale: אדון + 3fs ప్రత్యయం అక్షరార్థంగా ‘ఆమె యజమాని/ప్రభువు.’ ఇది అధికార సంబంధాన్ని వ్యక్తం చేస్తుంది; ‘భర్త’ అని సంబంధాన్ని స్పష్టీకరించడం మూలపాఠాన్ని మించి పోతుంది. తెలుగు వాక్యనిర్మాణంలో కర్తను తిరిగి సూచించేందుకు ‘తన’ సహజం.
- source_word: אֲשֶׁר ... שָׁם
  choice: ఉన్న
  rationale: సాపేక్ష పదం మరియు ‘అక్కడ’ అనే క్రియావిశేషణం కలసి ‘ఆమె యజమాని ఉన్న [ఇల్లు]’ అనే భావాన్ని ఇస్తాయి. తెలుగులో ‘ఉన్న’తో చేసిన సంబంధవాచక నిర్మాణం సహజంగా అదే భావాన్ని అందిస్తుంది.
- source_word: עַד הָאוֹר
  choice: వెలుగు వచ్చేవరకు
  rationale: ఈ పదబంధం పగటి వెలుగు వచ్చే సమయం వరకు కొనసాగిన స్థితిని సూచిస్తుంది. ‘వెలుగు వచ్చేవరకు’ ఆధునిక తెలుగులో సహజంగా ఉండి కాలపరిమితిని నిలుపుతుంది.
theological_decisions:
- issue: אֲדוֹנֶיהָ అనే అధికారసూచక పదం మరియు సంబంధ స్వరూపం
  choice: తన యజమాని
  alternative: తన భర్త / తన ప్రభువు
  rationale: ఈ సందర్భంలో ఆ స్త్రీ లేవీయుని ఉపపత్ని అయినప్పటికీ, హీబ్రూ పదం సంబంధాన్ని ‘భర్త’గా నేరుగా పేర్కొనదు; అతని అధికార స్థానాన్ని సూచిస్తుంది. ‘ప్రభువు’ ఆధునిక తెలుగులో దైవసంబంధ భావాన్ని అనవసరంగా రేకెత్తించవచ్చు. అందువల్ల ‘యజమాని’ మూలంలోని కఠినమైన సామాజిక వాస్తవాన్ని, ఉద్దేశపూర్వక ఉద్రిక్తతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కథనశైలి ఉపయోగించబడింది. హింసానంతర దృశ్యంలోని హీబ్రూ మూలపు సంక్షిప్తతను, కఠినత్వాన్ని మృదువుపరచకుండా ఉంచాం. చివరి ‘అక్కడే ఉంది’ అనేది తెలుగులో עַד־పదబంధం కోరే కొనసాగింపు భావాన్ని స్పష్టపరుస్తుంది; అది ఆమె సజీవంగా ఉందా అనే తదుపరి కథనంలోని ఉద్దేశపూర్వక అనిశ్చితిని పరిష్కరించదు.
