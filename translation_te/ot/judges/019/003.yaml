base_translation:
  language: en
  yaml_path: translation/ot/judges/019/003.yaml
  text: Then her husband arose and went after her to speak to her heart and bring her back[a]. His young servant was with him, along with a pair of donkeys. She brought him into her father’s house, and when the young woman’s father saw him[b], he rejoiced to meet him.
translation:
  language: te
  text: అప్పుడు ఆమె భర్త లేచి, ఆమెతో ఆప్యాయంగా మాట్లాడి ఆమెను తిరిగి తీసుకురావడానికి[b] ఆమె వెంబడి వెళ్లాడు[a]. అతనితో అతని యువ సేవకుడూ ఒక జత గాడిదలూ ఉన్నాయి. ఆమె అతణ్ణి తన తండ్రి ఇంటికి తీసుకొచ్చింది. ఆ యువతి తండ్రి అతణ్ణి చూసి, అతణ్ణి కలవడానికి సంతోషించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: పదశః, “ఆమె హృదయానికి మాట్లాడడానికి.” ఇది ఆప్యాయంగా లేదా ఒప్పించేలా మాట్లాడడాన్ని సూచించే హీబ్రూ నుడికారం.
    reason: lexical_alternative
  - marker: b
    text: “తిరిగి తీసుకురావడానికి” అనే చోట హీబ్రూ లిఖిత రూపం పాఠపరంగా క్లిష్టంగా ఉంది; సందర్భం ప్రకారం అతడు ఆ స్త్రీని తిరిగి తీసుకురావాలని ఉద్దేశించాడు.
    reason: textual_variant
lexical_decisions:
- source_word: אִישָׁהּ
  choice: ఆమె భర్త
  rationale: పదశః ‘ఆమె పురుషుడు’ అనే భావం ఉన్నా, ఇక్కడి వివాహసంబంధ సందర్భంలో సహజమైన అర్థం ‘ఆమె భర్త’.
- source_word: אַחֲרֶיהָ
  choice: ఆమె వెనుక వెళ్లాడు
  rationale: ఆమెను అనుసరించి వెళ్లిన కథన భావాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: לְדַבֵּר עַל־לִבָּהּ
  choice: ఆమె మనసుకు నచ్చేలా మాట్లాడి
  rationale: పదశః ‘ఆమె హృదయంతో మాట్లాడడం’ అనే హీబ్రూ నుడికారాన్ని తెలుగులో అర్థవంతంగా అందిస్తూ, ఆప్యాయంగా లేదా ఒప్పించేలా మాట్లాడడం అనే రెండు భావాలకు చోటు ఇస్తుంది.
- source_word: לַהֲשִׁיבוֹ
  choice: ఆమెను తిరిగి తీసుకురావడానికి
  rationale: లిఖిత రూపంలోని పురుషలింగ ప్రత్యయం పాఠపరంగా క్లిష్టమైనది; సందర్భం ప్రకారం తిరిగి తీసుకురావాలనుకున్నది ఆ స్త్రీనే.
- source_word: נַעֲרוֹ
  choice: అతని యువ సేవకుడు
  rationale: נַעַר అనే పదం యువకుడు లేదా సేవకుడు అనే అర్థాలు ఇవ్వగలదు; ప్రయాణంలో తోడుగా ఉన్న ఇతని వయస్సు, పాత్ర రెండింటినీ ఈ ఎంపిక సూచిస్తుంది.
- source_word: צֶמֶד חֲמֹרִים
  choice: ఒక జత గాడిదలు
  rationale: צֶמֶד రెండు జంతువుల జతను సూచిస్తుంది; అవి తప్పనిసరిగా కాడికి కట్టబడ్డాయని అదనంగా నిర్ధారించకుండా మూల భావాన్ని నిలుపుతుంది.
- source_word: וַתְּבִיאֵהוּ
  choice: ఆమె అతణ్ణి ... తీసుకొచ్చింది
  rationale: స్త్రీలింగ ఏకవచన క్రియకు ఆ స్త్రీ కర్త; పురుషలింగ కర్మప్రత్యయం ఆమె భర్తను సూచిస్తుంది.
- source_word: הַנַּעֲרָה
  choice: ఆ యువతి
  rationale: ఈ వాక్యభాగంలో వాడిన נַעֲרָה పదానికి సరళమైన, ఆధునిక తెలుగు సమానార్థకం.
- source_word: וַיִּשְׂמַח לִקְרָאתוֹ
  choice: అతణ్ణి కలుసుకున్నందుకు సంతోషించాడు
  rationale: అతణ్ణి చూడడం, కలుసుకోవడం పట్ల తండ్రికి కలిగిన ఆనందాన్ని సహజమైన తెలుగులో నేరుగా వ్యక్తపరుస్తుంది.
