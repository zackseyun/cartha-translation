    rationale: אוֹצִיאָה נָּא is a first-person volitional appeal, approximately ‘please, let me bring them out,’ rather than simply a future assertion. ‘దయచేసి, నన్ను ... తీసుకురానివ్వండి’ preserves both the speaker's intended action and his appeal.
