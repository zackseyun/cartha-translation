  source_fidelity: 'The principal meanings and contrasts are retained: the virgin daughter and the man''s concubine are offered, the sexualized violation is not softened, the hearers are told to do what is good in their own eyes, and the man is singled out as not to be subjected to this outrageous act. However, ‘దయచేసి వారిని బయటికి తీసుకొస్తాను’ is an unidiomatic assertion (‘please, I will bring them out’) and does not adequately convey the Hebrew cohortative appeal with נָא (‘please, let me bring them out’). ‘ఇలాంటి’ is less specific than the demonstrative ‘this.’'
