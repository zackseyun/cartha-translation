  yaml_path: translation/ot/judges/019/024.yaml
  text: Look[a], here are my virgin daughter and his concubine. Please let me bring them out. Violate them and do to them what is good in your eyes[c][b]. But to this man do not do this outrageous thing.
translation:
  language: te
  text: “ఇదిగో, కన్యయైన నా కుమార్తె, అతని ఉపపత్ని ఇక్కడ ఉన్నారు. దయచేసి, నన్ను వారిని బయటికి తీసుకురానివ్వండి. వారిని లైంగికంగా హింసించండి[a]; మీ దృష్టికి ఏది మంచిదో అది వారికి చేయండి[b]. కానీ ఈ మనిషికి మాత్రం ఈ ఘోరమైన పని[c] చేయకండి.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూల హీబ్రూ క్రియకు ‘అవమానించండి’ అనే అర్థం కూడా ఉంది; ఈ సందర్భంలో అది లైంగిక హింసను, అంటే అత్యాచారాన్ని, సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘మీ కళ్లలో మంచిదైనది.’ ఇది ‘మీకు నచ్చినది’ లేదా ‘మీకు సరైనదనిపించినది’ అనే హీబ్రూ నుడికారం.
    reason: cultural_note
  - marker: c
    text: ‘నీచమైన పని’ లేదా ‘అవమానకరమైన కార్యం’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: ఇదిగో
  rationale: అత్యవసరంగా శ్రద్ధను ఆకర్షించే హీబ్రూ సూచక అవ్యయానికి సహజమైన, గౌరవప్రదమైన ఆధునిక తెలుగు రూపం.
- source_word: בִתִּי הַבְּתוּלָה
  choice: కన్యయైన నా కుమార్తె
  rationale: בְּתוּלָה పదంలోని లైంగికంగా తాకబడని కన్య అనే భావాన్ని కేవలం ‘పెళ్లికాని’ అనే సామాజిక స్థితిగా మార్చకుండా నిలుపుతుంది.
- source_word: וּפִילַגְשֵׁהוּ
  choice: అతని ఉపపత్ని
  rationale: పִילֶגֶשׁ సూచించే ప్రధాన భార్యకాని స్త్రీ సహచరిని సంక్షిప్తంగా తెలిపే ప్రామాణిక తెలుగు పదం.
- source_word: אוֹצִיאָה נָּא אוֹתָם
  choice: దయచేసి వారిని బయటికి తీసుకొస్తాను
  rationale: కోహోర్టేటివ్ రూపం మరియు נָא కలిపి తెలిపే విన్నపంతో కూడిన సంకల్పాన్ని వ్యక్తం చేస్తుంది; మూలంలో లేని ‘మీ దగ్గరకు’ అనే మాటను చేర్చదు.
- source_word: וְעַנּוּ אוֹתָם
  choice: వారిని లైంగికంగా హింసించండి
  rationale: Piel రూపంలోని ענה ఈ సందర్భంలో లైంగిక అవమానం లేదా బలాత్కారాన్ని సూచిస్తుంది. ఈ అనువాదం హింసను అస్పష్టంగా చేయకుండా, హీబ్రూ క్రియకన్నా సంకుచితమైన న్యాయపరమైన అర్థాన్ని బలవంతంగా మోపదు.
- source_word: וַעֲשׂוּ לָהֶם הַטּוֹב בְּעֵינֵיכֶם
  choice: మీ దృష్టికి ఏది మంచిదో అది వారికి చేయండి
  rationale: ‘మీ కళ్లలో మంచిదైనది’ అనే హీబ్రూ నుడికారపు రూపకాన్ని గుర్తించగలిగే సహజ తెలుగు వాక్యంగా నిలుపుతుంది.
- source_word: וְלָאִישׁ הַזֶּה
  choice: కానీ ఈ మనిషికి మాత్రం
  rationale: ముందుకు తెచ్చిన విభక్తి పదబంధంలోని బలమైన వ్యత్యాసాన్ని ‘కానీ’ మరియు ‘మాత్రం’ ద్వారా స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: דְּבַר הַנְּבָלָה הַזֹּאת
  choice: ఇలాంటి ఘోరమైన పని
  rationale: נְבָלָה సూచించే తీవ్రమైన నైతిక నీచత్వం, అవమానం, సామాజిక దౌర్జన్యాన్ని ఆధునిక పాఠకులకు స్పష్టంగా అందిస్తుంది; దాన్ని కేవలం మూర్ఖత్వంగా తగ్గించదు.
theological_decisions:
- issue: లైంగిక హింసను స్పష్టంగా చూపుతూ హీబ్రూ క్రియలోని అర్థవిస్తృతిని నిలుపడం
  choice: ‘లైంగికంగా హింసించండి’ అని అనువదించడం
  alternative: ‘వారిపై అత్యాచారం చేయండి’ లేదా ‘వారిని అవమానించండి’
  rationale: ‘అత్యాచారం’ సందర్భానికి సరిపోయినా క్రియకు అత్యంత నిర్దిష్టమైన అర్థం ఇస్తుంది; ‘అవమానించండి’ మాత్రమే అయితే లైంగిక హింసను కప్పివేస్తుంది. ఎంచుకున్న రూపం రెండింటి మధ్య మూలపాఠ్య బాధ్యతను కాపాడుతుంది.
- issue: నְבָלָהలోని నైతిక తీర్పు
  choice: ‘ఘోరమైన పని’
  alternative: ‘నీచమైన పని’, ‘అవమానకరమైన కార్యం’, ‘మూర్ఖపు పని’
  rationale: ఇక్కడ పదం సాధారణ మూర్ఖత్వాన్ని కాక తీవ్రమైన నైతిక దౌర్జన్యాన్ని సూచిస్తుంది. ‘ఘోరమైన పని’ ఆ తీర్పును సాధారణ ఆధునిక తెలుగులో బలంగా తెలియజేస్తుంది.
- issue: వక్త పురుషునికి చేయబోయే దానిని మాత్రమే ‘ఘోరమైన పని’గా పేర్కొనే కథన ఉద్రిక్తత
  choice: మూలపాఠంలోని వ్యత్యాసాన్ని యథాతథంగా ఉంచడం
  alternative: స్త్రీలపై ప్రతిపాదించిన హింసను కూడా వాక్యంలో ప్రత్యక్షంగా ఖండించే వివరణను చేర్చడం
  rationale: వక్త చేసిన భయంకరమైన ప్రతిపాదనను అనువాదం సమర్థించదు; అయితే మూల కథనంలోని నైతిక వికృతిని వివరణ చేర్చి సరిచేయకుండా, పాఠకుడు ఎదుర్కొనేలా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గంభీరమైన శైలి వాడబడింది. లైంగిక హింసను మృదువుగా దాచలేదు; అదే సమయంలో మూల హీబ్రూ క్రియలోని అర్థవిస్తృతిని పాదసూచికలో నిలిపింది. కథనంలోని తీవ్రమైన నైతిక ఉద్రిక్తతను అనువాద వ్యాఖ్యతో పరిష్కరించలేదు.
