review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the men’s unwillingness, the man’s forceful seizure of his concubine, the overnight abuse, and her release at dawn. However, “వారు ఆమెను కూడి” is not an idiomatic or clear modern Telugu rendering of ידע אותה; it can be misunderstood and does not naturally convey the sexual euphemism. The spatial clause is also clearer when it explicitly states that he took her outside to them.
  naturalness: The narrative register is generally suitable, and “ఉపపత్ని” is an accepted precise term. Replacing the unclear “ఆమెను కూడి” with “ఆమెతో లైంగిక సంబంధం కలిగి” yields comprehensible modern standard Telugu while the footnote retains the Hebrew euphemism and explains the coercive context. “వేకువ పొడుస్తుండగా” naturally conveys the rising of dawn.
  terminology: “ఉపపత్ని” appropriately renders פילגש. “హింసించారు” suitably renders the broad, degrading abuse denoted by והתעללו בה. The revised footnote identifies the literal Hebrew idiom and its contextual sense without imposing an interpretation beyond the coercive narrative context.
  issues:
  - severity: high
    issue: “వారు ఆమెను కూడి” is unclear and non-idiomatic in modern Telugu.
    rationale: It does not naturally function as a sexual euphemism in contemporary standard Telugu and may be read as ‘gathered her.’ The wording must be replaced to communicate the source’s ידע euphemism intelligibly.
  - severity: low
    issue: The outward movement is phrased indirectly as “బయట ఉన్న వారి దగ్గరికి.”
    rationale: The Hebrew explicitly says that he brought her out to them. “వారి దగ్గరకు బయటికి తీసుకువచ్చాడు” more directly and naturally retains both movement and location.
  revised_text: కాని ఆ మనుషులు అతని మాట వినడానికి ఇష్టపడలేదు. అప్పుడు ఆ మనిషి తన ఉపపత్నిని బలవంతంగా పట్టుకొని, వారి దగ్గరకు బయటికి తీసుకువచ్చాడు. వారు ఆమెతో లైంగిక సంబంధం కలిగి[a], తెల్లవారేవరకు రాత్రంతా ఆమెను హింసించారు. వేకువ పొడుస్తుండగా ఆమెను వదిలేశారు.
