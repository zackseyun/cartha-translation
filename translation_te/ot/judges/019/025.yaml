  text: וְ/לֹֽא אָב֤וּ הָ/אֲנָשִׁים֙ לִ/שְׁמֹ֣עַֽ ל֔/וֹ וַ/יַּחֲזֵ֤ק הָ/אִישׁ֙ בְּ/פִ֣ילַגְשׁ֔/וֹ וַ/יֹּצֵ֥א אֲלֵי/הֶ֖ם הַ/ח֑וּץ וַ/יֵּדְע֣וּ א֠וֹתָ/הּ וַ/יִּֽתְעַלְּלוּ בָ֤/הּ כָּל הַ/לַּ֨יְלָה֙ עַד הַ/בֹּ֔קֶר וַֽ/יְשַׁלְּח֖וּ/הָ ב/עלות הַ/שָּֽׁחַר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/025.yaml
  text: But the men were not willing to listen to him[a], so the man seized his concubine and brought her out to them. And they knew her and abused her all night until morning, and they let her go at the dawn.
translation:
  language: te
  text: కాని ఆ మనుషులు అతని మాట వినడానికి ఇష్టపడలేదు. అప్పుడు ఆ మనిషి తన ఉపపత్నిని బలవంతంగా పట్టుకొని, వారి దగ్గరకు బయటికి తీసుకువచ్చాడు. వారు ఆమెతో లైంగిక సంబంధం కలిగి[a], తెల్లవారేవరకు రాత్రంతా ఆమెను హింసించారు. వేకువ పొడుస్తుండగా ఆమెను వదిలేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, ‘ఆమెను తెలుసుకున్నారు.’ ఈ సందర్భంలో ఇది ఆమెపై బలవంతంగా జరిగిన లైంగిక దాడిని సూచించే సభ్యోక్తి.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָבוּ
  choice: ఇష్టపడలేదు
  rationale: אבה సంకల్పం లేదా సమ్మతిని సూచిస్తుంది. ‘ఇష్టపడలేదు’ అనే రూపం వారి నిరాకరణలోని సంకల్పపూర్వకతను సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: לִשְׁמֹעַ לוֹ
  choice: అతని మాట వినడానికి
  rationale: שׁמע + ל సందర్భానుసారంగా వినడం, ఆలకించడం, విధేయత చూపడం అనే భావాలు ఇవ్వగలదు. ఇక్కడ అతని విజ్ఞప్తిని తిరస్కరించడం ప్రధానమైనందున ‘అతని మాట వినడానికి’ సరిపోతుంది.
- source_word: וַיַּחֲזֵק
  choice: బలవంతంగా పట్టుకొని
  rationale: חזק ఇక్కడ బలప్రయోగంతో పట్టుకోవడాన్ని సూచిస్తుంది. కేవలం ‘పట్టుకొని’ కంటే ఈ అనువాదం చర్యలోని బలవంతాన్ని స్పష్టం చేస్తుంది.
- source_word: פִּילַגְשׁוֹ
  choice: తన ఉపపత్నిని
  rationale: פילגש సూచించే గుర్తింపుపొందిన కాని ప్రధాన భార్యకన్నా తక్కువ సామాజిక స్థానం గల స్త్రీకి ‘ఉపపత్ని’ సంక్షిప్తమైన ప్రామాణిక సమానార్థకం.
- source_word: וַיֹּצֵא אֲלֵיהֶם הַחוּץ
  choice: బయట ఉన్న వారి దగ్గరికి తీసుకొచ్చాడు
  rationale: హిఫిల్ రూపం ఆమెను బయటకు తీసుకురావడాన్ని సూచిస్తుంది; הַחוּץను ‘బయట ఉన్న’ అని వ్యక్తపరచడం ద్వారా మూలంలోని బయట అనే అంశాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: וַיֵּדְעוּ אוֹתָהּ
  choice: వారు ఆమెను కూడి
  rationale: ידע ఇక్కడ లైంగిక సంబంధానికి వాడిన హీబ్రూ సభ్యోక్తి. ‘కూడి’ తెలుగు బైబిలు శైలిలో ఆ సభ్యోక్తిని నిలుపుతుంది; బలవంతపు లైంగిక హింస అనే సందర్భార్థాన్ని పాదసూచిక స్పష్టం చేస్తుంది.
- source_word: וַיִּתְעַלְּלוּ בָהּ
  choice: ఆమెను హింసించారు
  rationale: עלל హిత్పయేల్ రూపం అవమానకరమైన, క్రూరమైన దుర్వినియోగాన్ని సూచిస్తుంది. ‘హింసించారు’ శారీరక, లైంగిక, అవమానకర దాడుల విస్తృతిని సహజంగా తెలియజేస్తుంది.
- source_word: כָּל הַלַּיְלָה עַד הַבֹּקֶר
  choice: తెల్లవారేవరకు రాత్రంతా
  rationale: కాలవ్యవధినీ, దాడి కొనసాగిన తీవ్రతనీ స్పష్టంగా మరియు సహజంగా తెలియజేస్తుంది.
- source_word: וַיְשַׁלְּחוּהָ
  choice: ఆమెను వదిలేశారు
  rationale: שלח ఇక్కడ విడుదల చేయడం లేదా వెళ్లనివ్వడం అనే భావం ఇస్తుంది. ‘వదిలేశారు’ వారి నిర్దయతో కూడిన విడిచిపెట్టడాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: בעלות השחר
  choice: వేకువ ఉదయిస్తున్నప్పుడు
  rationale: మసొరెటిక్ పాఠంలోని ‘వేకువ పైకి రావడం’ అనే కాలచిత్రాన్ని తెలుగులో నేరుగా నిలుపుతుంది.
theological_decisions:
- issue: וַיֵּדְעוּ אוֹתָהּ అనే సభ్యోక్తిలోని లైంగిక హింస
  choice: ప్రధాన పాఠంలో ‘ఆమెను కూడి’ అని సభ్యోక్తిని నిలిపి, పాదసూచికలో బలవంతపు లైంగిక హింసను స్పష్టం చేయడం
  alternative: ప్రధాన పాఠంలోనే ‘ఆమెపై అత్యాచారం చేసి’ అని అనువదించడం
  rationale: మూలంలోని సభ్యోక్తిని కాపాడుతూ, సందర్భంలోని సమ్మతిలేమి మరియు హింసను పాఠకుడు తప్పుగా అర్థం చేసుకోకుండా స్పష్టం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కథనశైలి. హింసను మసకబార్చకుండా, మూలంలోని సభ్యోక్తిని పాదసూచిక సహాయంతో నిలుపుకుంది. ‘ఉపపత్ని’ కొంత గ్రంథీయ పదమైనప్పటికీ సామాజిక వర్గాన్ని సంక్షిప్తంగా, ఖచ్చితంగా సూచిస్తుంది.
