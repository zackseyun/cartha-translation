source:
  edition: WLC
  text: וַ/יֶּחֱזַק בּ֤/וֹ חֹֽתְנ/וֹ֙ אֲבִ֣י הַֽ/נַּעֲרָ֔ה וַ/יֵּ֥שֶׁב אִתּ֖/וֹ שְׁלֹ֣שֶׁת יָמִ֑ים וַ/יֹּאכְלוּ֙ וַ/יִּשְׁתּ֔וּ וַ/יָּלִ֖ינוּ שָֽׁם־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/004.yaml
  text: And his father-in-law[a], the young woman's father, urged him to stay, and he remained with him three days; and they ate and drank, and spent the nights there.
translation:
  language: te
  text: అతని మామ, ఆ యువతి తండ్రి, అతన్ని ఉండమని పట్టుబట్టాడు[a]; అతడు అతనితో మూడు రోజులు ఉన్నాడు. వారు తిన్నారు, తాగారు, అక్కడే రాత్రులు గడిపారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అతనిపై ఒత్తిడి చేశాడు,’ ‘అతన్ని ఒప్పించాడు,’ లేదా ‘అతన్ని వెళ్లనివ్వకుండా ఆపాడు.’ హీబ్రూ నుడికారం అక్షరార్థంగా అతని మామ ‘అతనితో/అతనికి ఎదిరిగా బలంగా ఉన్నాడు’ అని చెబుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּחֱזַק בּוֹ
  choice: అతన్ని ఉండమని పట్టుబట్టాడు
  rationale: חזק ב అనే హీబ్రూ నుడికారం అక్షరార్థంగా ‘అతనితో/అతనికి ఎదిరిగా బలంగా ఉన్నాడు’ అని ఉన్నా, ఇక్కడ అతడు ఉండేలా గట్టిగా ఒత్తిడి చేయడం లేదా పట్టుబట్టడం అనే భావాన్ని ఇస్తుంది. తరువాతి వాక్యభాగం సందర్భాన్ని బట్టి ‘ఉండమని’ స్పష్టం చేయబడింది; ఇది బలవంతంగా నిర్బంధించాడనే అతిశయార్థాన్ని కలిగించదు.
- source_word: חֹתְנוֹ
  choice: అతని మామ
  rationale: ఇక్కడ వివాహ సంబంధం ద్వారా లేవీయునికి మామ అయిన వ్యక్తిని సూచిస్తుంది. ఆధునిక తెలుగులో ‘మామ’ సహజమైన బంధుత్వ పదం; వెంటనే వచ్చే వివరణ దాని భావాన్ని నిర్దిష్టం చేస్తుంది.
- source_word: אֲבִי הַנַּעֲרָה
  choice: ఆ యువతి తండ్రి
  rationale: ఇది ‘అతని మామ’ ఎవరనే విషయాన్ని మరింత స్పష్టంగా తెలిపే సమానాధికరణ పదబంధం. נַעֲרָהకు ఈ వివాహ సందర్భంలో ‘యువతి’ సహజంగా సరిపోతుంది.
- source_word: וַיֵּשֶׁב אִתּוֹ
  choice: అతడు అతనితో మూడు రోజులు ఉన్నాడు
  rationale: ישב అంటే కూర్చోవడం, నివసించడం, ఉండిపోవడం అనే అర్థాలు కలవు. ఇక్కడ ఒత్తిడి చేసిన తరువాత అక్కడ కొనసాగి ఉండడమే సందర్భార్థం.
- source_word: שְׁלֹשֶׁת יָמִים
  choice: మూడు రోజులు
  rationale: కాలాన్ని తెలిపే సూటి పదబంధం.
- source_word: וַיֹּאכְלוּ וַיִּשְׁתּוּ
  choice: వారు తిని, తాగి
  rationale: మూలంలోని రెండు సాధారణ క్రియలను ‘విందు చేశారు’ వంటి వ్యాఖ్యానాత్మక సంక్షిప్తీకరణ లేకుండా నేరుగా అనువదిస్తుంది.
- source_word: וַיָּלִינוּ שָׁם
  choice: అక్కడే రాత్రులు గడిపారు
  rationale: לון ప్రత్యేకంగా రాత్రి బస చేయడాన్ని సూచిస్తుంది. బహువచన క్రియ మరియు మూడు రోజుల సందర్భానికి అనుగుణంగా ‘రాత్రులు గడిపారు’ పునరావృత బస భావాన్ని నిలుపుతుంది.
