  to: అతని మామ, ఆ యువతి తండ్రి, అతన్ని ఉండమని పట్టుబట్టాడు[a]; అతడు అతనితో మూడు రోజులు ఉన్నాడు. వారు తిన్నారు, తాగారు, అక్కడే రాత్రులు గడిపారు.
