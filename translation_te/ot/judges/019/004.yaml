translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. హీబ్రూ వాక్యంలోని సమానాధికరణాన్ని తెలుగులో స్పష్టత కోసం ‘అంటే’తో అమర్చాం. ‘పట్టుబట్టాడు’ సామాజిక ఒత్తిడిని తెలియజేస్తూ, బలవంతపు నిర్బంధమని ఖచ్చితంగా తేల్చకుండా మూలంలోని భావవ్యాప్తిని కాపాడుతుంది.
