source:
  edition: WLC
  text: וְ/הָיָ֣ה כָל הָ/רֹאֶ֗ה וְ/אָמַר֙ לֹֽא נִהְיְתָ֤ה וְ/לֹֽא נִרְאֲתָה֙ כָּ/זֹ֔את לְ/מִ/יּ֞וֹם עֲל֤וֹת בְּנֵֽי יִשְׂרָאֵל֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם עַ֖ד הַ/יּ֣וֹם הַ/זֶּ֑ה שִֽׂימוּ לָ/כֶ֥ם עָלֶ֖י/הָ עֻ֥צוּ וְ/דַבֵּֽרוּ־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/030.yaml
  text: And everyone who saw it said[a], “Nothing like this has happened or been seen from the day the sons of Israel came up from the land of Egypt until this day. Consider it, take counsel, and speak.”
translation:
  language: te
  text: 'దాన్ని చూసిన ప్రతి ఒక్కరూ ఇలా అన్నారు: “ఇలాంటిది ఇశ్రాయేలు కుమారులు[a] ఐగుప్తు దేశం నుండి బయలుదేరి వచ్చిన రోజు మొదలుకొని ఈ రోజు వరకు ఎన్నడూ జరగలేదు, ఎన్నడూ కనిపించలేదు. దీనిని పరిగణించండి, సలహా చేసుకోండి, మాట్లాడండి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఇశ్రాయేలీయులు” లేదా “ఇశ్రాయేలు సంతానం.”
    reason: בְּנֵי יִשְׂרָאֵל అనే సంప్రదాయ జాతినామానికి సహజమైన తెలుగు ప్రత్యామ్నాయాలను తెలియజేయడం.
lexical_decisions:
- source_word: וְהָיָה כָל הָרֹאֶה וְאָמַר
  choice: దాన్ని చూసిన ప్రతి ఒక్కరూ ఇలా అన్నారు
  rationale: וְהָיָה ఇక్కడ కొత్త సంఘటనను విడిగా చెప్పడం కంటే, చూసినవారి ప్రతిస్పందనగా ఏర్పడిన పరిస్థితిని పరిచయం చేస్తుంది. తెలుగు సహజ వాక్యనిర్మాణంలో దాన్ని ప్రధాన వాక్యంలో కలిపాం; כָל הָרֹאֶה యొక్క సమగ్ర భావాన్ని ‘ప్రతి ఒక్కరూ’ నిలుపుతుంది.
- source_word: לֹא נִהְיְתָה וְלֹא נִרְאֲתָה כָּזֹאת
  choice: ఇలాంటిది ... ఎన్నడూ జరగలేదు, ఎన్నడూ కనిపించలేదు
  rationale: హీబ్రూలోని రెండు సమాంతర నిషేధ క్రియలను విడివిడిగా నిలిపి, సంఘటన అపూర్వమైనదనే బలాన్ని సహజమైన తెలుగులో వ్యక్తం చేశాం.
- source_word: לְמִיּוֹם עֲלוֹת בְּנֵי יִשְׂרָאֵל מֵאֶרֶץ מִצְרַיִם
  choice: ఇశ్రాయేలు కుమారులు ఐగుప్తు దేశం నుండి బయలుదేరి వచ్చిన రోజు మొదలుకొని
  rationale: עֲלוֹת యొక్క అక్షరార్థం ‘పైకి రావడం’; నిర్గమ సందర్భంలో తెలుగు పాఠకులకు సహజమైన ‘బయలుదేరి వచ్చిన’ అనే ప్రయోగం మూల భావాన్ని స్పష్టంగా అందిస్తుంది. בְּנֵי יִשְׂרָאֵל ను రూపపరంగా ‘ఇశ్రాయేలు కుమారులు’గా ఉంచాం.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: ఈ రోజు వరకు
  rationale: కథకుని వర్తమాన కాలం వరకు వ్యాపించే కాలపరిమితిని తెలుగులో నేరుగా, సహజంగా తెలియజేస్తుంది.
- source_word: שִׂימוּ לָכֶם עָלֶיהָ
  choice: దీని గురించి బాగా ఆలోచించండి
  rationale: ఇది మనసు లేదా దృష్టిని విషయంపై నిలపమనే హీబ్రూ నుడికారం. ‘బాగా ఆలోచించండి’ దాని గంభీరమైన పరిశీలన భావాన్ని సహజ తెలుగులో అందిస్తుంది.
- source_word: עֻצוּ
  choice: కలిసి సంప్రదించండి
  rationale: ఈ బహువచన ఆజ్ఞ సమూహంగా ఆలోచించి సలహా చేసుకోవడాన్ని సూచిస్తుంది. ‘కలిసి’ అనే పదం సామూహిక deliberation భావాన్ని స్పష్టం చేస్తుంది.
- source_word: וְדַבֵּרוּ
  choice: మాట్లాడండి
  rationale: మూలంలో కర్మ పేర్కొనబడని సంక్షిప్తమైన, బలమైన ఆజ్ఞను అలాగే విస్తరించకుండా నిలిపాం.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל అనువాదం
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలీయులు / ఇశ్రాయేలు సంతానం
  rationale: మూలంలోని వ్యాకరణపరమైన పురుషలింగ రూపాన్ని ప్రధాన పాఠ్యంలో నిలిపాం. అయితే ఇది ఇశ్రాయేలు ప్రజలందరినీ సూచించే సంప్రదాయ జాతినామ ప్రయోగం కావచ్చనే భావాన్ని పాదటిప్పణిలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కథన శైలి. దిగ్భ్రాంతి మరియు సామూహిక విచారణకు ఇచ్చిన మూడు వరుస ఆజ్ఞల సంక్షిప్తతను నిలిపాం. ‘బాగా’ మరియు ‘కలిసి’ మూల నుడికారాల భావాన్ని సహజంగా వెల్లడిస్తాయి; చివరి ‘మాట్లాడండి’ను ఉద్దేశపూర్వకంగా విస్తరించలేదు.
