source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר הָ/אִ֤ישׁ הַ/זָּקֵן֙ שָׁל֣וֹם לָ֔/ךְ רַ֥ק כָּל מַחְסוֹרְ/ךָ֖ עָלָ֑/י רַ֥ק בָּ/רְח֖וֹב אַל תָּלַֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/020.yaml
  text: The old man said[a], “Peace be to you. Only let all your needs be my responsibility; only do not spend the night in the open square.”
translation:
  language: te
  text: ఆ వృద్ధుడు, “నీకు క్షేమం కలుగుగాక. నీ అవసరాలన్నీ నా బాధ్యతే; బహిరంగ కూడలిలో[a] మాత్రం రాత్రి గడపకు” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “వీధిలో.” ఇక్కడి హీబ్రూ పదం మరింత నిర్దిష్టంగా పట్టణంలోని ప్రజలు చేరే బహిరంగ ప్రదేశాన్ని లేదా కూడలిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאִישׁ הַזָּקֵן
  choice: ఆ వృద్ధుడు
  rationale: హీబ్రూ నామవాచకం–విశేషణం కలయికను సహజమైన ఆధునిక తెలుగు కథన శైలిలో ‘ఆ వృద్ధుడు’గా ఇచ్చాం.
- source_word: שָׁלוֹם לָךְ
  choice: నీకు క్షేమం కలుగుగాక
  rationale: ఇది పలకరింపు లేదా భరోసా ఇచ్చే సూత్రవాక్యం. ‘క్షేమం’ ద్వారా שָׁלוֹם యొక్క భావాన్ని నిలుపుతూ, ఆశీర్వచన స్వరాన్ని సహజమైన తెలుగులో వ్యక్తం చేశాం.
- source_word: רַק
  choice: -ఏ; మాత్రం
  rationale: రెండు చోట్లనున్న పరిమితి/ఉద్ఘాటనను తెలుగులో ఒకే పదాన్ని కృత్రిమంగా పునరావృతం చేయకుండా, మొదటి చోట ‘బాధ్యతే’, రెండవ చోట ‘మాత్రం’ ద్వారా ప్రతిబింబించాం.
- source_word: כָּל מַחְסוֹרְךָ
  choice: నీ అవసరాలన్నీ
  rationale: מַחְסוֹר అంటే లోటు లేదా అవసరం. ఆతిథ్య సందర్భంలో ‘నీ అవసరాలన్నీ’ స్పష్టంగా, సహజంగా ఉంది.
- source_word: עָלָי
  choice: నా బాధ్యతే
  rationale: అక్షరార్థంగా ‘నా మీద’ అనే ఈ హీబ్రూ ప్రయోగం, అవసరాలను తానే తీర్చే బాధ్యతను వక్త స్వీకరిస్తున్నాడని సూచిస్తుంది.
- source_word: בָּרְחוֹב
  choice: బహిరంగ కూడలిలో
  rationale: רְחוֹב కేవలం రహదారిని కాకుండా పట్టణంలోని విశాలమైన బహిరంగ ప్రదేశం లేదా కూడలిని సూచించగలదు. సందర్భంలోని బహిరంగతను ఈ ఎంపిక నిలుపుతుంది.
- source_word: אַל תָּלַן
  choice: రాత్రి గడపకు
  rationale: לון రాత్రిపూట బస చేయడం లేదా ఉండిపోవడం అనే అర్థం ఇస్తుంది; నిషేధాజ్ఞను సహజమైన తెలుగులో ఇచ్చాం.
