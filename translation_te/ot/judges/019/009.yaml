  yaml_path: translation/ot/judges/019/009.yaml
  text: When the man rose to leave with his concubine and his attendant, his father-in-law, the young woman’s father, said to him, “Look, the day is waning toward evening. Please stay the night. Look, the day is nearly over[a]. Spend the night here and let your heart be glad. Then rise early tomorrow for your journey[b], and go home[c].”
translation:
  language: te
  text: 'ఆ మనిషి తన ఉపపత్నితో, తన పరిచారకునితో బయలుదేరడానికి లేచినప్పుడు, అతని మామ—ఆ యువతి తండ్రి—అతనితో ఇలా అన్నాడు: “చూడు, పొద్దు వాలి సాయంకాలమవుతోంది. దయచేసి ఈ రాత్రి ఇక్కడే ఉండండి. చూడు, పొద్దు ముగియవస్తోంది[a]. ఈ రాత్రి ఇక్కడే గడుపు; నీ హృదయం సంతోషించనివ్వు. రేపు మీరు వేకువనే లేచి మీ ప్రయాణానికి బయలుదేరండి[b]; నువ్వు నీ ఇంటికి వెళ్లు[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “పొద్దు మకాం వేస్తోంది”; అంటే పొద్దు క్రమంగా నిలిచిపోతున్నట్లు లేదా ముగింపుకు వస్తున్నట్లు చూపించే చిత్రం.
    reason: source_image
  - marker: b
    text: “లేచి మీ ప్రయాణానికి బయలుదేరండి” అనే మాటలు హీబ్రూలో బహువచనంలో ఉండి, ప్రయాణ బృందాన్నంతటినీ ఉద్దేశిస్తున్నాయి; తరువాతి “నువ్వు…వెళ్లు” ఏకవచనంలో ఉండి, ఆ మనిషినే ఉద్దేశిస్తోంది.
    reason: grammar
  - marker: c
    text: అక్షరార్థంగా, “నీ గుడారానికి వెళ్లు”; ఇక్కడ ఇది ఇంటికి వెళ్లడాన్ని సూచించే సంప్రదాయ ప్రయోగం.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאִישׁ
  choice: ఆ మనిషి
  rationale: సాధారణ కథన పదమైన ‘మనిషి’ని నిలుపుతుంది; మూలంలో లేని మరింత నిర్దిష్టమైన ‘భర్త’ అనే సంబంధపదాన్ని చేర్చదు.
- source_word: פִילַגְשׁוֹ
  choice: తన ఉపపత్ని
  rationale: కథనంలోని ప్రత్యేక సామాజిక-వైవాహిక స్థితిని ‘భార్య’గా మృదూకరించకుండా, గౌరవప్రదమైన ఆధునిక తెలుగు పదంతో తెలియజేస్తుంది.
- source_word: נַעֲרוֹ
  choice: తన పరిచారకుడు
  rationale: ఇక్కడ వయస్సుకంటే ప్రయాణంలో అతడు నిర్వహించే సేవకుని/సహాయకుని పాత్ర ప్రధానమైనది.
- source_word: חֹתְנוֹ אֲבִי הַנַּעֲרָה
  choice: అతని మామ—ఆ యువతి తండ్రి
  rationale: వివాహ సంబంధాన్ని, దానికి మూలపాఠమే ఇచ్చే వివరణను రెండింటినీ స్పష్టంగా ఉంచుతుంది.
- source_word: רָפָה הַיּוֹם לַעֲרֹב
  choice: పొద్దు వాలి సాయంకాలమవుతోంది
  rationale: వెలుతురు తగ్గుతూ సాయంకాలం సమీపిస్తున్న భావాన్ని సహజమైన తెలుగులో, ‘వాలడం’ అనే దృశ్యంతో వ్యక్తపరుస్తుంది.
- source_word: לִינוּ נָא
  choice: దయచేసి ఈ రాత్రి ఇక్కడే ఉండు
  rationale: రాత్రి బస చేయమనే విన్నపాన్ని సహజంగా తెలియజేస్తుంది; నָא లోని అభ్యర్థన భావాన్ని ‘దయచేసి’ అందిస్తుంది.
- source_word: חֲנוֹת הַיּוֹם
  choice: పొద్దు ముగియవస్తోంది
  rationale: అసాధారణమైన ‘పొద్దు మకాం వేస్తోంది’ అనే మూలచిత్రం సూచించే కాలార్థాన్ని ప్రధాన పాఠ్యంలో స్పష్టంగా ఇస్తూ, చిత్రాన్ని పాదటిప్పణిలో భద్రపరుస్తుంది.
- source_word: וְיִיטַב לְבָבֶךָ
  choice: నీ హృదయం సంతోషించనివ్వు
  rationale: హృదయానికి మేలు/ఆనందం కలగడం అనే హీబ్రూ రూపకాన్ని పూర్తిగా సాధారణీకరించకుండా నిలుపుతుంది.
- source_word: וְהָלַכְתָּ לְאֹהָלֶךָ
  choice: నువ్వు నీ ఇంటికి వెళ్లు
  rationale: ‘నీ గుడారానికి’ అనేది ఇక్కడ ఇంటికి తిరిగి వెళ్లడాన్ని సూచించే సంప్రదాయ ప్రయోగం; పాఠకుడిని తప్పుదారి పట్టించకుండా భావాన్ని ప్రధాన పాఠ్యంలో ఇస్తుంది.
