translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా సహజమైన వాక్యనిర్మాణం వాడబడింది. ‘ఉపపత్ని’ సామాజిక వర్గాన్ని మృదూకరించకుండా గౌరవప్రదంగా సూచిస్తుంది. మూలంలోని హృదయ రూపకం ప్రధాన పాఠ్యంలో నిలుపబడింది; పొద్దు ‘మకాం వేయడం’ అనే అసాధారణ చిత్రం పాదటిప్పణిలో ఇవ్వబడింది. బహువచనం నుంచి ఏకవచనానికి జరిగే వ్యాకరణ మార్పు ఉద్దేశపూర్వకంగా సంరక్షించబడింది.
