base_translation:
  language: en
  yaml_path: translation/ot/judges/019/027.yaml
  text: Her master got up in the morning and opened the doors of the house and went out to go on his way[a], and behold, the woman, his concubine, was lying at the entrance of the house, with her hands on the threshold.
translation:
  language: te
  text: ఆమె యజమాని ఉదయాన్నే లేచి, ఇంటి తలుపులు తెరిచి, తన దారిన వెళ్లడానికి బయటికి వచ్చాడు. ఇదిగో, ఆ స్త్రీ, అతని ఉపపత్ని, ఇంటి ద్వారం వద్ద పడి ఉంది[a]; ఆమె చేతులు గడపపై ఉన్నాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, మరింత అక్షరార్థంగా, “ఇంటి ద్వారం వద్ద పడి ఉంది.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנֶיהָ
  choice: ఆమె యజమాని
  rationale: అక్షరార్థంగా ‘ఆమె ప్రభువు/యజమాని.’ కథలోని అసమాన సామాజిక సంబంధాన్ని నిలుపుతూ, ‘భర్త’ అని సంబంధాన్ని మరింత పరస్పరమైనదిగా మార్చకుండా ‘యజమాని’ ఎంచుకున్నాం.
- source_word: דַּלְתוֹת הַבַּיִת
  choice: ఇంటి తలుపులు
  rationale: హీబ్రూలో బహువచనం ఉన్నందున ‘తలుపులు’ అని నిలిపాం.
- source_word: וַיֵּצֵא לָלֶכֶת לְדַרְכּוֹ
  choice: తన దారిన వెళ్లడానికి బయటికి వచ్చాడు
  rationale: బయటికి రావడంలోని ఉద్దేశాన్ని తెలిపే హీబ్రూ నిర్మాణాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: అనూహ్యమైన, దిగ్భ్రాంతికరమైన దృశ్యంపై హఠాత్తుగా దృష్టి నిలిపే వాక్యసూచక పదం యొక్క బలాన్ని కాపాడుతుంది.
- source_word: הָאִשָּׁה פִילַגְשׁוֹ
  choice: అతని ఉపపత్ని అయిన ఆ స్త్రీ
  rationale: ‘ఆ స్త్రీ’ మరియు ‘అతని ఉపపత్ని’ అనే సమానాధికార నిర్మాణాన్ని తెలుగులో స్పష్టంగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: נֹפֶלֶת
  choice: పడి ఉంది
  rationale: వర్తమాన కృదంతం పడిపోయిన ఫలితస్థితిని సూచిస్తుంది; ‘పడి ఉంది’ భంగిమను సహజంగా తెలియజేస్తూ ఆమె మరణించిందని ముందుగానే నిర్ణయించదు.
- source_word: פֶּתַח הַבַּיִת
  choice: ఇంటి ప్రవేశద్వారం దగ్గర
  rationale: పֶּתַח సూచించే ప్రవేశస్థలాన్ని స్పష్టంగా తెలుపుతుంది.
- source_word: וְיָדֶיהָ עַל הַסַּף
  choice: ఆమె చేతులు గడప మీద ఉన్నాయి
  rationale: హీబ్రూ అవ్యయ వాక్యాన్ని దృశ్య స్పష్టతతో తెలుగులో సంపూర్ణ వాక్యంగా అందిస్తుంది.
