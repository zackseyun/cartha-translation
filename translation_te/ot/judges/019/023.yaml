review_pass:
  verdict: revise
  source_fidelity: The rendering preserves the verse’s narrative sequence, direct address, urgent prohibition, causal appeal to the guest’s arrival, and the moral force of נְבָלָה. Two minor wording adjustments make the movement and entry into the house more explicit and idiomatic.
  naturalness: ‘వారి దగ్గరికి బయటకు వచ్చి’ is somewhat awkward in modern Telugu; ‘వారి వద్దకు బయటికి వచ్చి’ is smoother. ‘నా ఇంట్లోకి వచ్చాడు’ clearly expresses entry, rather than merely arrival at the house.
  terminology: ‘ఇంటి యజమాని,’ ‘నా సోదరులారా,’ ‘దుర్మార్గంగా ప్రవర్తించకండి,’ and ‘అవమానకరమైన పని’ suitably convey the source terms in a modern, serious register. The footnote accurately signals the stronger lexical alternatives for נְבָלָה.
  issues:
  - severity: low
    issue: Movement wording is slightly awkward.
    rationale: వַיֵּצֵא אֲלֵיהֶם means that the householder went/came out to the group. ‘వారి వద్దకు బయటికి వచ్చి’ is more idiomatic than ‘వారి దగ్గరికి బయటకు వచ్చి.’
  - severity: low
    issue: Entry into the house is under-specified.
    rationale: With בוא and אֶל־בֵּיתִי, the guest has come into the speaker’s house. ‘నా ఇంట్లోకి వచ్చాడు’ retains this directional sense more clearly than ‘నా ఇంటికి వచ్చాడు.’
