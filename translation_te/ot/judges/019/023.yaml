translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గంభీరమైన కథన శైలిని మరియు విజ్ఞప్తిలోని అత్యవసరతను నిలిపాం. మూలంలోని పురుష సంబోధనను ‘నా సోదరులారా’గా ఉంచాం.
