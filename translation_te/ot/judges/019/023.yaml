base_translation:
  language: en
  yaml_path: translation/ot/judges/019/023.yaml
  text: Then the man[a], the master of the house, went out to them and said to them, “No, my brothers, please do not act wickedly. Since this man has come into my house, do not do this disgraceful thing.”
translation:
  language: te
  text: 'ఆ మనిషి, ఇంటి యజమాని, వారి వద్దకు బయటికి వచ్చి వారితో ఇలా అన్నాడు: “వద్దు, నా సోదరులారా! దయచేసి దుర్మార్గంగా ప్రవర్తించకండి. ఈ మనిషి నా ఇంట్లోకి వచ్చాడు కాబట్టి, ఈ అవమానకరమైన పని చేయకండి[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఈ నీచమైన పని” లేదా “ఈ ఘోరమైన కార్యం.” హీబ్రూ పదం సిగ్గుకరమైన, నైతికంగా అత్యంత ఘోరమైన పనిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּעַל הַבַּיִת
  choice: ఇంటి యజమాని
  rationale: ఇంటిపైన బాధ్యత, అధికారం గల వ్యక్తిని సూచించే హీబ్రూ పదబంధానికి ఇది సహజమైన ఆధునిక తెలుగు సమానార్థకం.
- source_word: אַחַי
  choice: నా సోదరులారా
  rationale: మూలంలోని పుంలింగ బహువచన సంబోధనను నేరుగా నిలుపుతుంది; సందర్భంలో ఇది తోటి పట్టణవాసులను ఉద్దేశించిన విజ్ఞప్తి.
- source_word: תָּרֵעוּ
  choice: దుర్మార్గంగా ప్రవర్తించకండి
  rationale: רעע ధాతువులోని బలమైన నైతిక నిందను సాధారణమైన ‘తప్పు చేయకండి’ కంటే స్పష్టంగా తెలియజేస్తుంది.
- source_word: נָא
  choice: దయచేసి
  rationale: విజ్ఞప్తిలోని వేడుకోలు, అత్యవసరతను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אַחֲרֵי אֲשֶׁר בָּא ... אֶל־בֵּיתִי
  choice: ఈ మనిషి నా ఇంటికి వచ్చాడు కాబట్టి
  rationale: ఇక్కడి నిర్మాణం అతడు వక్త ఇంటి ఆశ్రయంలోకి వచ్చిన పరిస్థితిని, దానివల్ల నేరం మరింత ఘోరమవుతుందనే భావాన్ని సూచిస్తుంది; తెలుగులో కారణసూచక రూపం సహజంగా ఉంటుంది.
- source_word: הַנְּבָלָה הַזֹּאת
  choice: ఇలాంటి అవమానకరమైన పని
  rationale: נְבָלָה సూచించే సిగ్గుకరమైన, నైతికంగా ఘోరమైన కార్యాన్ని సులభంగా అర్థమయ్యే తెలుగులో తెలియజేస్తుంది.
- source_word: וַיֵּצֵא אֲלֵיהֶם
  choice: వారి దగ్గరికి బయటకు వచ్చి
  rationale: ఇంటి లోపలి నుంచి గుంపు వద్దకు వెళ్లిన కదలికను సహజంగా వ్యక్తం చేస్తుంది.
