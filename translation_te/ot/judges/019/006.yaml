  text: וַ/יֵּשְׁב֗וּ וַ/יֹּאכְל֧וּ שְׁנֵי/הֶ֛ם יַחְדָּ֖ו וַ/יִּשְׁתּ֑וּ וַ/יֹּ֜אמֶר אֲבִ֤י הַֽ/נַּעֲרָה֙ אֶל הָ/אִ֔ישׁ הֽוֹאֶל נָ֥א וְ/לִ֖ין וְ/יִטַ֥ב לִבֶּֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/006.yaml
  text: So the two of them sat down together and ate and drank. Then the young woman's father said to the man[a], "Please, be willing to stay the night, and let your heart be glad."
translation:
  language: te
  text: అప్పుడు వారిద్దరూ కలిసి కూర్చుని భోజనం చేసి తాగారు. తరువాత యువతి తండ్రి ఆ మనిషితో, “దయచేసి ఈ రాత్రి బస చేయడానికి ఒప్పుకో; నీ హృదయం ఆనందించనివ్వు[a]” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీ హృదయం సంతోషంగా ఉండనివ్వు.”
    reason: וְיִטַב לִבֶּךָ అనే నుడికారం సందర్భానుసారం హృదయం ఆనందించడం లేదా సంతోషంగా ఉండడం అనే భావాన్ని వ్యక్తం చేస్తుంది.
lexical_decisions:
- source_word: וַיֵּשְׁבוּ
  choice: కూర్చుని
  rationale: భోజనం చేయడానికి కూర్చోవడాన్ని సూచించే కథన సందర్భానికి సహజమైన తెలుగు రూపం; ‘అక్కడే ఉండిపోయారు’ అనే అవసరం లేని భావాన్ని చేర్చదు.
- source_word: וַיֹּאכְלוּ
  choice: భోజనం చేసి
  rationale: אכל అనే సాధారణ క్రియను ఈ విందు సందర్భంలో సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: שְׁנֵיהֶם יַחְדָּו
  choice: వారిద్దరూ కలిసి
  rationale: ‘ఇద్దరూ’ మరియు ‘కలిసి’ అనే హెబ్రీ ఉద్ఘాటనను సహజమైన తెలుగు పదక్రమంలో నిలుపుతుంది.
- source_word: וַיִּשְׁתּוּ
  choice: తాగారు
  rationale: హెబ్రీ మూలంలో పానీయపు కర్మ చెప్పబడలేదు; అందువల్ల తెలుగులోనూ దానిని చేర్చలేదు.
- source_word: אֲבִי הַנַּעֲרָה
  choice: యువతి తండ్రి
  rationale: נַעֲרָהను సందర్భోచితంగా, గౌరవప్రదమైన ఆధునిక తెలుగులో ‘యువతి’గా అనువదిస్తుంది.
- source_word: הָאִישׁ
  choice: ఆ మనిషి
  rationale: విస్తృత సందర్భంలో అతని సంబంధం తెలిసినప్పటికీ, ఈ వచనంలోని సాధారణ ‘మనిషి’ అనే పదాన్నే నిలుపుతుంది.
- source_word: הוֹאֶל נָא
  choice: దయచేసి ... ఒప్పుకో
  rationale: יאלలోని సమ్మతి లేదా సంసిద్ధత భావాన్నీ, נָאలోని మర్యాదపూర్వక విన్నపాన్నీ స్పష్టంగా అందిస్తుంది.
- source_word: וְלִין
  choice: ఈ రాత్రి ఇక్కడే ఉండడానికి
  rationale: לוןలోని రాత్రి బసచేయడం అనే భావాన్ని ఆధునిక పాఠకులకు సహజంగా తెలియజేస్తుంది; ‘ఇక్కడే’ అనేది ఆతిథ్య సందర్భంలో అంతర్నిహితమైన స్థలాన్ని తెలుగులో స్పష్టం చేస్తుంది.
- source_word: וְיִטַב לִבֶּךָ
  choice: నీ హృదయం సంతోషంగా ఉండనివ్వు
  rationale: అక్షరార్థమైన ‘నీ హృదయం మంచిగా ఉండనివ్వు’ అనే హెబ్రీ నుడికారాన్ని, హృదయ ప్రస్తావనను నిలుపుతూ అర్థవంతమైన తెలుగులో అందిస్తుంది.
