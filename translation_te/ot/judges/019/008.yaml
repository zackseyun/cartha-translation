source:
  edition: WLC
  text: וַ/יַּשְׁכֵּ֨ם בַּ/בֹּ֜קֶר בַּ/יּ֣וֹם הַ/חֲמִישִׁי֮ לָ/לֶכֶת֒ וַ/יֹּ֣אמֶר אֲבִ֣י הַֽ/נַּעֲרָ֗ה סְעָד נָא֙ לְבָ֣בְ/ךָ֔ וְ/הִֽתְמַהְמְה֖וּ עַד נְט֣וֹת הַ/יּ֑וֹם וַ/יֹּאכְל֖וּ שְׁנֵי/הֶֽם׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/008.yaml
  text: He got up early in the morning on the fifth day to go[a], but the young woman's father said, “Please strengthen your heart with a morsel of food, and wait until the day declines.” So the two of them ate.
translation:
  language: te
  text: ఐదవ రోజు ఉదయాన్నే అతడు బయలుదేరడానికి లేచాడు. అయితే ఆ యువతి తండ్రి, “దయచేసి కొంచెం ఆహారం తిని నీ హృదయాన్ని బలపరచుకో[a]; పగలు వాలే వరకు ఆగండి” అన్నాడు. కాబట్టి వారిద్దరూ భోజనం చేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “నీ హృదయాన్ని బలపరచుకో.” ఇది ఆహారం తీసుకొని శక్తి పొందడాన్ని సూచించే నానుడి.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכֵּם בַּבֹּקֶר
  choice: ఉదయాన్నే ... లేచాడు
  rationale: שׁכם హిఫీల్ రూపం త్వరగా లేవడం లేదా ప్రయాణానికి త్వరగా సిద్ధపడడం అనే భావాన్ని ఇస్తుంది. ‘ఉదయాన్నే లేచాడు’ ఆధునిక తెలుగులో సహజంగా కాలప్రాధాన్యాన్ని నిలుపుతుంది.
- source_word: בַּיּוֹם הַחֲמִישִׁי
  choice: ఐదవ రోజు
  rationale: హీబ్రూ కాలసూచనకు సూటిగా, సహజంగా సరిపోతుంది.
- source_word: לָלֶכֶת
  choice: బయలుదేరడానికి
  rationale: הלך ప్రాథమికంగా ‘వెళ్లడం’; ఈ సందర్భంలో అక్కడి నుంచి ప్రయాణం మొదలుపెట్టడమే ఉద్దేశం. అందువల్ల ‘బయలుదేరడానికి’ సందర్భార్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: אֲבִי הַנַּעֲרָה
  choice: ఆ యువతి తండ్రి
  rationale: נַעֲרָהను వివాహసంబంధ సందర్భానికి తగిన గౌరవప్రదమైన ఆధునిక పదమైన ‘యువతి’గా ఇచ్చాం.
- source_word: סְעָד נָא לְבָבְךָ
  choice: దయచేసి కొంచెం ఆహారం తిని నీ హృదయాన్ని బలపరచుకో
  rationale: ‘నీ హృదయాన్ని బలపరచుకో’ అనే హీబ్రూ రూపకాన్ని నిలిపి, సందర్భంలో అది ఆహారం తీసుకుని శక్తి పొందడాన్ని సూచిస్తుందని ‘కొంచెం ఆహారం తిని’తో స్పష్టం చేశాం.
- source_word: וְהִתְמַהְמְהוּ
  choice: ఆలస్యం చేయండి
  rationale: מהה హిత్పయేల్ రూపం తాత్సారం చేయడం, బయలుదేరకుండా కొంతకాలం ఉండడం అనే భావాన్ని ఇస్తుంది. బహువచన ఆజ్ఞను తెలుగులో గౌరవ/బహువచన రూపంతో నిలిపాం.
- source_word: עַד נְטוֹת הַיּוֹם
  choice: పగలు వాలే వరకు
  rationale: రోజు సాయంత్రం వైపు ‘వాలడం’ అనే హీబ్రూ కాలరూపకాన్ని సహజమైన తెలుగు వ్యక్తీకరణతో నిలుపుతుంది.
- source_word: וַיֹּאכְלוּ שְׁנֵיהֶם
  choice: కాబట్టి వారిద్దరూ భోజనం చేశారు
  rationale: שְׁנֵיהֶםలోని ఇద్దరనే స్పష్టమైన ఉద్ఘాటనను ‘వారిద్దరూ’ నిలుపుతుంది; ‘కాబట్టి’ తండ్రి విజ్ఞప్తికి వచ్చిన కథన ఫలితాన్ని తెలియజేస్తుంది.
