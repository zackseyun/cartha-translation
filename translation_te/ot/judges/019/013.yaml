source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר לְ/נַעֲר֔/וֹ לְךָ֥ וְ/נִקְרְבָ֖ה בְּ/אַחַ֣ד הַ/מְּקֹמ֑וֹת וְ/לַ֥נּוּ בַ/גִּבְעָ֖ה א֥וֹ בָ/רָמָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/013.yaml
  text: He said to his young man[a], “Come, and let us draw near to one of these places[b], and spend the night in Gibeah or in Ramah.”
translation:
  language: te
  text: అతడు తన పరిచారకునితో[a], “రా, ఈ ఊళ్లలో ఒకదానికి వెళ్లి, గిబియాలో గానీ రామాలో గానీ రాత్రి గడుపుదాం” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “తన యువకునితో,” లేదా “తన సేవకునితో.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לְנַעֲרוֹ
  choice: తన పరిచారకునితో
  rationale: נַעַר అనే పదం యువకుడు, సేవకుడు, లేదా పరిచారకుడు అనే అర్థాలను సందర్భానుసారం కలిగి ఉంటుంది. ఇక్కడ లేవీయునితో ప్రయాణిస్తున్న పురుష సహాయకుణ్ణి సూచిస్తున్నందున, అతని పాత్రను సహజంగా తెలియజేసే ‘పరిచారకుడు’ ఎంచుకోబడింది; ప్రత్యామ్నాయం పాదసూచికలో ఉంచబడింది.
- source_word: לְךָ
  choice: రా
  rationale: הלך ఆజ్ఞారూపానికి అక్షరార్థంగా ‘వెళ్లు’ అయినా, వెంటనే వచ్చే ప్రథమ పురుష బహువచన సంకల్పార్థక రూపంతో కలిసి ఉమ్మడి ప్రయాణానికి పిలుపుగా ఉంది. అందువల్ల ఆధునిక తెలుగులో ‘రా’ సహజం.
- source_word: וְנִקְרְבָה
  choice: దగ్గరగా వెళ్లి
  rationale: קרב యొక్క సమీపించడం అనే గమన భావాన్నీ, cohortative రూపంలోని ‘మనము’ అనే ఉమ్మడి సంకల్పాన్నీ తరువాతి ‘గడుపుదాం’తో సహజంగా కలిపి వ్యక్తపరుస్తుంది.
- source_word: בְּאַחַד הַמְּקֹמוֹת
  choice: ఈ ఊళ్లలో ఒకదానికి
  rationale: మాట్లాడువాడు సమీపంలోని నివాస స్థలాలను—తరువాత గిబియా లేదా రామా అని పేర్కొన్న వాటిని—సూచిస్తున్నాడు. తెలుగు ప్రయాణ సందర్భంలో ‘ఊళ్లు’ సహజంగా ఉంది; ‘ఈ’ సమీప సూచనను స్పష్టం చేస్తుంది.
- source_word: וְלַנּוּ
  choice: రాత్రి గడుపుదాం
  rationale: לון అంటే రాత్రి బసచేయడం లేదా రాత్రిని గడపడం. ‘రాత్రి గడుపుదాం’ ఆధునిక, స్పష్టమైన తెలుగు.
- source_word: בַגִּבְעָה
  choice: గిబియాలో
  rationale: స్థలనామాన్ని తెలుగు లిపిలో ధ్వన్యనుసారంగా ఇచ్చి, పట్టణం లోపల రాత్రి గడపడాన్ని సూచించేందుకు ‘లో’ విభక్తి వాడబడింది.
- source_word: בָרָמָה
  choice: రామాలో
  rationale: స్థలనామాన్ని తెలుగు లిపిలో ధ్వన్యనుసారంగా ఇచ్చి, గిబియాతో సమాంతరంగా ‘లో’ విభక్తి వాడబడింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. సంభాషణలో ఉమ్మడి ప్రయాణ ఆహ్వానాన్ని ‘రా’ అని, cohortative భావాన్ని ‘గడుపుదాం’ అని వ్యక్తపరిచాం. మూలంలోని נַעַר పదానికి ఉన్న పాత్ర/వయస్సు అస్పష్టతను పాదసూచికలో నిలిపాం.
