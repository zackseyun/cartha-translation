  yaml_path: translation/ot/judges/019/021.yaml
  text: So he brought him into his house and fed the donkeys[b][a]. Then they washed their feet and ate and drank.
translation:
  language: te
  text: అప్పుడు అతడు అతన్ని తన ఇంట్లోకి తీసుకువచ్చి, గాడిదలకు మేత కలిపి పెట్టాడు.[a] తరువాత వారు తమ కాళ్లు కడుక్కొని,[b] తిని తాగారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూలభాషలో అక్షరార్థంగా, “గాడిదలకు మేత కలిపాడు.” అంటే వాటి కోసం మేతను కలిపి సిద్ధం చేశాడు.
    reason: lexical_alternative
  - marker: b
    text: కాళ్లు కడుక్కోవడం ప్రాచీన సమీప ప్రాచ్యంలో సాధారణ అతిథి మర్యాదలో భాగం.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְבִיאֵהוּ
  choice: అతన్ని తన ఇంట్లోకి తీసుకువచ్చి
  rationale: హిఫిల్ రూపంలోని בוא ఒకరిని లోపలికి తీసుకురావడం అనే భావాన్ని ఇస్తుంది; לְבֵיתוֹతో కలిపి ఇంట్లోకి జరిగిన కదలికను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וַיָּבָול
  choice: మేత కలిపి పెట్టాడు
  rationale: בלל యొక్క మౌలిక భావం ‘కలపడం’; ఇక్కడ గాడిదల కోసం మేతను కలిపి సిద్ధం చేయడాన్ని సూచిస్తుంది. కేవలం ‘మేత పెట్టాడు’ అనడం కంటే మూలంలోని ప్రత్యేక భావాన్ని ఇది నిలుపుతుంది.
- source_word: לַחֲמוֹרִים
  choice: గాడిదలకు
  rationale: חֲמוֹרִיםకు ఆధునిక ప్రామాణిక తెలుగు సమానార్థకం ‘గాడిదలు’.
- source_word: וַיִּרְחֲצוּ רַגְלֵיהֶם
  choice: వారు తమ కాళ్లు కడుక్కొని
  rationale: బహువచన క్రియ మరియు సర్వనామ ప్రత్యయం అతిథుల సమూహం తమ కాళ్లు కడుక్కున్నట్లు తెలియజేస్తాయి; తెలుగు క్రమబద్ధ కథనంలో ‘కడుక్కొని’ సహజంగా ఉంటుంది.
- source_word: וַיֹּאכְלוּ וַיִּשְׁתּוּ
  choice: తిని తాగారు
  rationale: హీబ్రూ కథనంలోని సంక్షిప్త వరుస చర్యలను సహజమైన తెలుగులో యథాతథంగా ఉంచుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని వరుస చర్యల సంక్షిప్తతను నిలుపుతూ, וַיָּבָולలోని ‘కలపడం’ అనే స్పష్టమైన భావాన్ని ప్రధాన పాఠ్యంలో సంరక్షించాం. ప్రతి పాదసూచిక గుర్తు సంబంధిత పదబంధం తరువాత ఉంచబడింది.
