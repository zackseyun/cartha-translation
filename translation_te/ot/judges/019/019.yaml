translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘నీ దాసి’, ‘నీ సేవకులు’ అనే వినయపూర్వక ప్రాచీన సామాజిక భాషను అర్థమయ్యే రూపంలో నిలిపి, మూలంలోని అసాధారణ సంబంధాన్ని పాదటిప్పణిలో వివరించాము.
