source:
  edition: WLC
  text: וְ/גַם תֶּ֤בֶן גַּם מִסְפּוֹא֙ יֵ֣שׁ לַ/חֲמוֹרֵ֔י/נוּ וְ֠/גַם לֶ֣חֶם וָ/יַ֤יִן יֶשׁ לִ/י֙ וְ/לַֽ/אֲמָתֶ֔/ךָ וְ/לַ/נַּ֖עַר עִם עֲבָדֶ֑י/ךָ אֵ֥ין מַחְס֖וֹר כָּל דָּבָֽר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/019.yaml
  text: Yet there is both straw and fodder for our donkeys[a], and there is bread and wine for me, for your female servant, and for the young man with your servants[c][b]; there is no lack of anything.
translation:
  language: te
  text: పైగా, మా గాడిదలకు ఎండుగడ్డి, మేత కూడా ఉన్నాయి;[a] నాకూ, నీ దాసికీ,[b] నీ సేవకులతో ఉన్న యువకునికీ[c] రొట్టె, ద్రాక్షామద్యం ఉన్నాయి. దేనికీ కొదువ లేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ‘కూడా’ అనే పదం పదేపదే వచ్చి, ‘మా గాడిదలకు ఎండుగడ్డి కూడా, మేత కూడా ఉన్నాయి; ఇంకా...’ అనే నొక్కిచెప్పే భావాన్ని ఇస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘నీ దాసి’ అనేది తనతో ప్రయాణిస్తున్న స్త్రీ గురించి అతిథేయునితో వినయంగా చెప్పిన మాట.
    reason: cultural_note
  - marker: c
    text: మూలపాఠంలో అక్షరార్థంగా ‘నీ సేవకులతో ఉన్న యువకుడు’ అని ఉంది. సందర్భంలో ‘నీ సేవకులు’ అనేది మాట్లాడేవాడు తనను, తన బృందాన్ని వినయంగా సూచించిన మాట కావచ్చుననే అవకాశం ఉంది.
    reason: textual_ambiguity
lexical_decisions:
- source_word: וְגַם ... גַם ... וְגַם
  choice: పైగా ... గడ్డి, మేత ... నాకూ ... యువకునికీ
  rationale: హీబ్రూలో ‘కూడా’ అనే భావం పదేపదే వచ్చి అదనపు సమృద్ధిని నొక్కిచెబుతుంది. తెలుగులో సహజంగా ఉండేందుకు మొదట ‘పైగా’ అని, తరువాత ‘-కూ/-కీ’ రూపాలతో ఆ సంకలిత భావాన్ని నిలిపాము.
- source_word: תֶּבֶן
  choice: గడ్డి
  rationale: ఇక్కడ పశువులకు ఇచ్చే ఎండుగడ్డి లేదా గడ్డిని సూచిస్తుంది; ఆధునిక సాధారణ తెలుగులో ‘గడ్డి’ సహజంగా ఉంటుంది.
- source_word: מִסְפּוֹא
  choice: మేత
  rationale: పశువుల ఆహారాన్ని సూచించే పదం; మనుషుల ఆహారం నుండి స్పష్టంగా వేరుచేస్తుంది.
- source_word: לַחֲמוֹרֵינוּ
  choice: మా గాడిదలకు
  rationale: మొదటి పురుష బహువచన స్వామ్య ప్రత్యయాన్ని ‘మా’తో స్పష్టంగా నిలిపాము.
- source_word: לֶחֶם וָיַיִן
  choice: రొట్టె, ద్రాక్షారసం
  rationale: పేర్కొన్న ఆహార పదార్థాలను నిర్దిష్టంగా అనువదించాము. יַיִן‌కు సాధారణంగా పులియబెట్టిన ద్రాక్ష పానీయాన్ని సూచించే ‘ద్రాక్షారసం’ వాడాము.
- source_word: יֶשׁ לִי
  choice: నాకూ ... ఉన్నాయి
  rationale: అందుబాటులో ఉన్న సరఫరాలను నొక్కిచెప్పే హీబ్రూ అస్తిత్వ నిర్మాణాన్ని తెలుగులో సహజమైన ‘ఉన్నాయి’తో ప్రతిబింబించాము.
- source_word: אֲמָתֶךָ
  choice: నీ దాసి
  rationale: స్త్రీని ఉద్దేశించి వినయంగా చెప్పే సామాజిక సంబోధనను, లింగ సూచనతో సహా, సంక్షిప్తంగా నిలిపాము.
- source_word: לַנַּעַר
  choice: యువకునికి
  rationale: נַעַר యువకుణ్ణి లేదా యువ పరిచారకుణ్ణి సూచించగలదు. సందర్భం సేవకుని పాత్రను సూచించినా, మూలంలోని విస్తృతార్థాన్ని కుదించకుండా ‘యువకుడు’ అని అనువదించాము.
- source_word: עִם עֲבָדֶיךָ
  choice: నీ సేవకులతో ఉన్న
  rationale: మసొరేటిక్ పాఠంలోని రెండవ పురుష ఏకవచన స్వామ్యరూపాన్ని నేరుగా నిలిపాము; ఇది ఎవరికీ సంబంధించినదో పాఠంలో కొంత అసాధారణంగా ఉంది కాబట్టి దాన్ని మౌనంగా సవరించలేదు.
- source_word: אֵין מַחְסוֹר כָּל דָּבָר
  choice: దేనికీ కొదువ లేదు
  rationale: ఏ అవసరమైన వస్తువూ లోపించలేదనే సంపూర్ణ సమృద్ధి భావాన్ని సహజమైన తెలుగు నుడికారంతో వ్యక్తం చేస్తుంది.
