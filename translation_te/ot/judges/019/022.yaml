source:
  edition: WLC
  text: הֵמָּה֮ מֵיטִיבִ֣ים אֶת לִבָּ/ם֒ וְ/הִנֵּה֩ אַנְשֵׁ֨י הָ/עִ֜יר אַנְשֵׁ֣י בְנֵֽי בְלִיַּ֗עַל נָסַ֨בּוּ֙ אֶת הַ/בַּ֔יִת מִֽתְדַּפְּקִ֖ים עַל הַ/דָּ֑לֶת וַ/יֹּאמְר֗וּ אֶל הָ֠/אִישׁ בַּ֣עַל הַ/בַּ֤יִת הַ/זָּקֵן֙ לֵ/אמֹ֔ר הוֹצֵ֗א אֶת הָ/אִ֛ישׁ אֲשֶׁר בָּ֥א אֶל בֵּיתְ/ךָ֖ וְ/נֵדָעֶֽ/נּוּ־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/022.yaml
  text: While they were making their hearts merry[a], behold, the men of the city, worthless men, surrounded the house, pounding on the door. They said to the old man, the master of the house, “Bring out the man who came into your house[b], so that we may know him.”
translation:
  language: te
  text: వారు ఉల్లాసంగా గడుపుతుండగా, ఇదిగో, పట్టణంలోని దుర్మార్గులు[a] ఆ ఇంటిని చుట్టుముట్టి, తలుపు మీద బలంగా కొడుతూ ఉన్నారు. వారు ఇంటి యజమానియైన ఆ వృద్ధునితో, “నీ ఇంటికి వచ్చిన ఆ మనిషిని బయటికి తీసుకురా; మేము అతణ్ణి తెలుసుకోవాలి[b]” అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “పనికిమాలినతనపు కుమారులు”; అంటే నియమరహితులైన లేదా చెడ్డ మనుషులు.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ “తెలుసుకోవడం” అనేది లైంగిక సభ్యోక్తి; వారు అతనిపై లైంగిక దాడి చేయాలని ఉద్దేశించారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵיטִיבִים אֶת לִבָּם
  choice: ఉల్లాసంగా గడుపుతుండగా
  rationale: ‘హృదయాన్ని మేలు చేసుకోవడం’ అనే హీబ్రూ నుడికారం ఇక్కడ విందులో సంతోషంగా గడపడాన్ని సూచిస్తుంది. అక్షరార్థపు అసహజతను నివారిస్తూ సందర్భార్థాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: కథనంలో అకస్మాత్తుగా వచ్చిన భయానక మలుపును సూచించే హీబ్రూ సంభాషణ సూచిక బలాన్ని నిలుపుతుంది.
- source_word: אַנְשֵׁי הָעִיר אַנְשֵׁי בְנֵי בְלִיַּעַל
  choice: పట్టణంలోని కొందరు దుర్మార్గులు
  rationale: ‘బెలీయాలు కుమారులు/పనికిమాలినతనపు కుమారులు’ అనే హీబ్రూ నుడికారం నైతికంగా చెడ్డ, నియమరహిత మనుషులను సూచిస్తుంది. ‘కొందరు’ అనేది పట్టణంలోని పురుషులందరినీ ఉద్దేశించినట్లు తప్పుగా వినిపించకుండా నిర్దిష్ట గుంపును స్పష్టం చేస్తుంది; అక్షరార్థ రూపం పాదసూచికలో ఇవ్వబడింది.
- source_word: נָסַבּוּ אֶת הַבַּיִת
  choice: ఆ ఇంటిని చుట్టుముట్టి
  rationale: ఇంటి చుట్టూ చేరి దాన్ని ఆవరించిన చర్యను నేరుగా, సహజంగా తెలియజేస్తుంది.
- source_word: מִתְדַּפְּקִים עַל הַדָּלֶת
  choice: తలుపును బలంగా బాదసాగారు
  rationale: పదేపదే, దూకుడుగా తలుపును కొట్టడాన్ని హిత్పయేల్ కృదంతం సూచిస్తుంది; ‘బలంగా బాదడం’ ఆ తీవ్రతను సహజ తెలుగులో అందిస్తుంది.
- source_word: בַּעַל הַבַּיִת הַזָּקֵן
  choice: ఇంటి యజమానియైన ఆ వృద్ధుడు
  rationale: ఇంటిపై బాధ్యత, అధికారం ఉన్న వృద్ధ ఆతిథ్యదాతను సూచిస్తుంది; ఇక్కడ זָקֵן అధికారిక ‘పెద్ద’ పదవికన్నా వయస్సును తెలియజేస్తుంది.
- source_word: הוֹצֵא
  choice: బయటికి తీసుకురా
  rationale: అతిథిని ఇంటి వెలుపలికి తీసుకురమ్మనే ప్రత్యక్ష ఆజ్ఞను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וְנֵדָעֶנּוּ
  choice: మేము అతణ్ణి తెలుసుకుంటాం
  rationale: יָדַע (‘తెలుసుకొను’) ఇక్కడ లైంగిక ఉద్దేశాన్ని తెలిపే సభ్యోక్తి. మూలంలోని రూపాన్ని, ఆదికాండం 19తో ఉన్న సాహిత్య ప్రతిధ్వనిని ప్రధాన పాఠంలో నిలిపి, ఉద్దేశాన్ని పాదసూచికలో స్పష్టం చేస్తుంది.
theological_decisions:
- issue: וְנֵדָעֶנּוּ అనే లైంగిక సభ్యోక్తి అనువాదం
  choice: ప్రధాన పాఠంలో ‘మేము అతణ్ణి తెలుసుకుంటాం’ అని హీబ్రూ సభ్యోక్తిని నిలిపి, పాదసూచికలో లైంగిక దాడి ఉద్దేశాన్ని స్పష్టం చేయడం.
  alternative: ‘మేము అతనితో లైంగిక సంబంధం పెట్టుకుంటాం’ లేదా ‘మేము అతనిపై లైంగిక దాడి చేస్తాం’ అని ప్రధాన పాఠంలోనే స్పష్టీకరించడం.
  rationale: మూలపాఠం ఉద్దేశపూర్వకంగా ‘తెలుసుకొను’ అనే సభ్యోక్తిని ఉపయోగిస్తుంది. దాన్ని నిలపడం హీబ్రూ పదప్రయోగాన్నీ ఆదికాండం 19తో సంబంధాన్నీ కాపాడుతుంది; పాదసూచిక ఆధునిక పాఠకునికి దాని హింసాత్మక లైంగిక అర్థాన్ని సందేహం లేకుండా తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కథనశైలి ఉపయోగించబడింది. ‘ఇదిగో’ అకస్మాత్తు మలుపును నిలుపుతుంది. లైంగిక సభ్యోక్తిని ప్రధాన పాఠంలో కాపాడి, అర్థం మరుగుపడకుండా పాదసూచికలో స్పష్టం చేయబడింది.
