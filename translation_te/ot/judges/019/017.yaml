source:
  edition: WLC
  text: וַ/יִּשָּׂ֣א עֵינָ֗י/ו וַ/יַּ֛רְא אֶת הָ/אִ֥ישׁ הָ/אֹרֵ֖חַ בִּ/רְחֹ֣ב הָ/עִ֑יר וַ/יֹּ֨אמֶר הָ/אִ֧ישׁ הַ/זָּקֵ֛ן אָ֥נָה תֵלֵ֖ךְ וּ/מֵ/אַ֥יִן תָּבֽוֹא־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/017.yaml
  text: He looked up and saw the traveler in the open square of the city[a], and the old man said, “Where are you going[b], and where do you come from?”
translation:
  language: te
  text: అతడు కళ్లెత్తి, పట్టణంలోని విశాలమైన బహిరంగ ప్రదేశంలో ఉన్న ప్రయాణికుణ్ణి[a] చూశాడు. అప్పుడు ఆ వృద్ధుడు, “నువ్వు ఎక్కడికి వెళ్తున్నావు? ఎక్కడి నుంచి వస్తున్నావు?” అని అడిగాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “బాటసారి.” ఈ హీబ్రూ పదం ప్రయాణంలో ఉన్న వ్యక్తిని సూచిస్తుంది; ఆతిథ్య సందర్భంలో “అతిథి” అనే భావాన్ని కూడా పొందవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא עֵינָיו
  choice: అతడు కన్నులెత్తి చూసినప్పుడు
  rationale: హీబ్రూ నుడికారంలోని ‘కళ్లను ఎత్తడం’ అనే రూపాన్ని సహజమైన ఆధునిక తెలుగు కథనశైలిలో నిలిపి, తరువాతి וַיַּרְאతో సులభంగా అనుసంధానించబడింది.
- source_word: וַיַּרְא
  choice: చూశాడు
  rationale: ఇక్కడ సాధారణ దృశ్యగ్రహణమే ఉద్దేశం; ‘గమనించాడు’ కంటే ‘చూశాడు’ మూలానికి నేరుగా సరిపోతుంది.
- source_word: הָאִישׁ הָאֹרֵחַ
  choice: ప్రయాణికుణ్ణి
  rationale: אֹרֵחַ ప్రయాణంలో ఉన్న వ్యక్తిని సూచిస్తుంది. ‘అతిథి’ అనడం ఇంకా ఆతిథ్యం పొందని స్థితిని ముందుగానే నిర్ణయించినట్లవుతుంది; ‘ప్రయాణికుడు’ సందర్భానికి సహజంగా సరిపోతుంది.
- source_word: בִּרְחֹב הָעִיר
  choice: పట్టణంలోని విశాల ప్రదేశంలో
  rationale: רְחוֹב సాధారణంగా ఇరుకైన వీధికంటే బహిరంగమైన వెడల్పాటి ప్రజా ప్రదేశం లేదా కూడలిని సూచిస్తుంది. ‘విశాల ప్రదేశం’ ఆ భావాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: הָאִישׁ הַזָּקֵן
  choice: ఆ వృద్ధుడు
  rationale: వ్యక్తిని వయస్సు ఆధారంగా గుర్తించే సరళమైన పదబంధం; ఆధునిక గౌరవప్రదమైన తెలుగులో ‘వృద్ధుడు’ తగినది.
- source_word: אָנָה תֵלֵךְ
  choice: నువ్వు ఎక్కడికి వెళ్తున్నావు?
  rationale: אָנָה గమ్యాన్ని అడుగుతుంది; సందర్భంలోని తక్షణ ప్రయాణ విచారణకు వర్తమాన కొనసాగింపు రూపం సహజంగా ఉంది.
- source_word: וּמֵאַיִן תָּבֹוא
  choice: ఎక్కడి నుంచి వస్తున్నావు?
  rationale: మూలంలోని ‘ఎక్కడి నుంచి’ అనే ఆరంభస్థాన భావాన్ని స్పష్టంగా నిలిపింది. హీబ్రూలో రెండు ప్రశ్నలు ‘మరియు’తో కలిసినా, తెలుగులో వరుస ప్రశ్నలుగా పలకడం సహజం.
