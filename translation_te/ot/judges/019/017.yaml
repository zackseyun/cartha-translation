translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే సహజమైన, గౌరవప్రదమైన కథనశైలి. మూలంలోని ప్రయాణికుడు/అతిథి పదార్థ విస్తృతిని పాదసూచికలో ఉంచాం. ఇంగ్లీషు consultation layerలో పాదసూచిక గుర్తుల స్థానాలు వాటి విషయాలతో సరిపోలనందున, తెలుగు ముసాయిదాలో [a]ను ‘ప్రయాణికుడు’ వద్ద సరిచేసి ఉంచాం; [b]ను హీబ్రూ క్రియారూపాల సందర్భాధీన కాలభావాన్ని సూచించడానికి ప్రశ్నల చివర ఉంచాం.
