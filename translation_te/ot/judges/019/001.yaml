  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְהִי֙ בַּ/יָּמִ֣ים הָ/הֵ֔ם וּ/מֶ֖לֶךְ אֵ֣ין בְּ/יִשְׂרָאֵ֑ל וַ/יְהִ֣י אִ֣ישׁ לֵוִ֗י גָּ֚ר בְּ/יַרְכְּתֵ֣י הַר אֶפְרַ֔יִם וַ/יִּֽקַּֽח ל/וֹ֙ אִשָּׁ֣ה פִילֶ֔גֶשׁ מִ/בֵּ֥ית לֶ֖חֶם יְהוּדָֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/001.yaml
  text: And it happened in those days[a], when there was no king in Israel, that a Levite man was dwelling in the remote parts of the hill country of Ephraim, and he took for himself a woman, a concubine[b], from Bethlehem in Judah.
translation:
  language: te
  text: ఆ రోజుల్లో[a], ఇశ్రాయేలులో రాజు లేనప్పుడు, ఎఫ్రాయిము కొండ ప్రాంతంలోని మారుమూల ప్రదేశాల్లో నివసిస్తున్న ఒక లేవీయుడు యూదాలోని బేత్లెహేము నుండి ఒక స్త్రీని, ఉపపత్నిని[b], తన కోసం తీసుకున్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆ రోజుల్లో ఇశ్రాయేలులో రాజు లేడు.” హీబ్రూలో ఇది సమన్వయ వాక్యం; దీనిని స్వతంత్ర ప్రకటనగా గానీ, కాలపరమైన నేపథ్యంగా గానీ అనువదించవచ్చు.
    reason: alternative_reading
  - marker: b
    text: “ఉపపత్ని” అంటే భార్యకంటే తక్కువ సామాజిక హోదా ఉన్నప్పటికీ గుర్తింపు పొందిన దాంపత్య సంబంధంలో ఉన్న స్త్రీ; కేవలం తాత్కాలిక భాగస్వామి కాదు.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי בַּיָּמִים הָהֵם
  choice: ఆ రోజుల్లో
  rationale: కొత్త కథాఘట్టాన్ని ప్రారంభించే హీబ్రూ కథన సూత్రాన్ని సహజమైన ఆధునిక తెలుగులో కాలపరిస్థితిగా అందిస్తుంది; వాక్యప్రవాహంలో అవసరం లేని ‘జరిగింది’ను బలవంతంగా చేర్చదు.
- source_word: וּמֶלֶךְ אֵין בְּיִשְׂרָאֵל
  choice: ఇశ్రాయేలులో రాజు లేనప్పుడు
  rationale: మూలంలో సమన్వయ వాక్యంగా ఉన్నప్పటికీ ఇక్కడ నేపథ్య కాలపరిస్థితిగా గ్రహించవచ్చు. న్యాయాధిపతులు గ్రంథంలోని పునరావృత వాక్యాన్ని వ్యాఖ్యానాత్మక విలువనిర్ణయం లేకుండా నిలుపుతుంది.
- source_word: אִישׁ לֵוִי
  choice: ఒక లేవీయుడు
  rationale: తెలుగులో ‘లేవీయుడైన ఒక మనిషి’ కంటే ఇది సహజం; పురుష ఏకవచన రూపమే אִישׁ భావాన్ని తగినంతగా తెలియజేస్తుంది.
- source_word: גָּר
  choice: నివసిస్తున్న
  rationale: גור లో తాత్కాలిక లేదా పరదేశ నివాస ఛాయ ఉండవచ్చు; సందర్భం దానిని ఖచ్చితంగా నిర్ణయించనందున సహజమైన విస్తృత పదాన్ని ఎంచుకుంది.
- source_word: בְּיַרְכְּתֵי
  choice: మారుమూల ప్రదేశాల్లో
  rationale: ప్రాంతపు చివరి, వెనుక లేదా దూర భాగాల భౌగోళిక భావాన్ని సాధారణ పాఠకులకు స్పష్టంగా తెలియజేస్తుంది.
- source_word: הַר אֶפְרַיִם
  choice: ఎఫ్రాయిము కొండ ప్రాంతం
  rationale: ఒకే కొండను కాక ఎఫ్రాయిముకు చెందిన పర్వతమయ ప్రాంతాన్ని సూచించే స్థిర భౌగోళిక ప్రయోగం.
- source_word: וַיִּקַּח לוֹ
  choice: తన కోసం తీసుకున్నాడు
  rationale: לְוֹ లోని స్వప్రయోజన లేదా సంబంధ ఏర్పాటుకు చెందిన భావాన్ని నిలుపుతుంది; ఇక్కడ ‘తీసుకున్నాడు’ వివాహసంబంధ సందర్భంలో వాడబడింది.
- source_word: אִשָּׁה פִילֶגֶשׁ
  choice: ఒక స్త్రీని, ఉపపత్నిని
  rationale: మూలంలోని אִשָּׁה మరియు פִילֶגֶשׁ రెండింటినీ నిలిపి, రెండవ పదం మొదటిదాని సామాజిక హోదాను వివరిస్తున్న నిర్మాణాన్ని ప్రతిబింబిస్తుంది.
- source_word: מִבֵּית לֶחֶם יְהוּדָה
  choice: యూదాలోని బేత్లెహేము నుండి
  rationale: ఇతర బేత్లెహేము పట్టణాల నుండి వేరు చేసే యూదా ప్రాంత సూచనను ఆధునిక తెలుగులో స్పష్టంగా అందిస్తుంది.
theological_decisions:
- issue: ఇశ్రాయేలులో రాజు లేడనే న్యాయాధిపతులు గ్రంథపు పునరుక్తి
  choice: ఇశ్రాయేలులో రాజు లేనప్పుడు
  alternative: ఇశ్రాయేలులో రాజు లేడు
  rationale: ఈ మాటను రాజరికానికి స్పష్టమైన సమర్థనగా గానీ వ్యతిరేకతగా గానీ వ్యాఖ్యానించకుండా కథన నేపథ్యంగా ఉంచుతుంది. హీబ్రూ సమన్వయ నిర్మాణాన్ని స్వతంత్ర ప్రకటనగా కూడా అనువదించవచ్చనే అస్పష్టతను పాదసూచికలో నిలిపింది.
- issue: פִילֶגֶשׁ యొక్క సంబంధ హోదా
  choice: ఉపపత్ని
  alternative: ద్వితీయ భార్య
  rationale: గుర్తింపు పొందిన గృహ లేదా దాంపత్య సంబంధంలో భార్యకంటే తక్కువ సామాజిక హోదా కలిగిన స్త్రీ అనే భావాన్ని సూచిస్తుంది; ఆమెను కేవలం అనధికారిక లైంగిక భాగస్వామిగా చిత్రించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనదిగా, అయితే కథన గాంభీర్యాన్ని నిలుపుకునేలా రూపొందించబడింది. వ్యక్తి, ప్రాంత నామాలు తెలుగు బైబిలు వాడుకకు దగ్గరగా లిప్యంతరీకరించబడ్డాయి. మూలంలోని వాక్య సమన్వయం మరియు సంబంధ హోదాకు సంబంధించిన అస్పష్టతలు పాదసూచికలతో సంరక్షించబడ్డాయి.
