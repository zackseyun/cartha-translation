revisions:
- from: అయితే అతని యజమాని అతనితో, “ఇశ్రాయేలు కుమారులకు చెందని పరదేశీయుల పట్టణంలోకి మనం పక్కకు తిరగము; గిబియా వరకు ముందుకు వెళ్దాం” అన్నాడు.
  to: అయితే అతని యజమాని అతనితో, “ఇశ్రాయేలు కుమారులది కాని పరదేశీయుల పట్టణానికి మనం మళ్లము; గిబియా వరకు ముందుకు వెళ్దాం” అన్నాడు.[a]
  rationale: The revision clarifies that the negated “of the sons of Israel” clause qualifies the city, not merely “foreigners,” while keeping the Hebrew ethnonym in the text. “మళ్లము” naturally conveys turning aside from the route, and the note is relocated to the ethnic expression it explains.
