language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֵלָי/ו֙ אֲדֹנָ֔י/ו לֹ֤א נָסוּר֙ אֶל עִ֣יר נָכְרִ֔י אֲשֶׁ֛ר לֹֽא מִ/בְּנֵ֥י יִשְׂרָאֵ֖ל הֵ֑נָּה וְ/עָבַ֖רְנוּ עַד גִּבְעָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/012.yaml
  text: But his master said to him[a], “We will not turn aside into a foreign city, which is not of the sons of Israel; rather, we will go on as far as Gibeah.”
translation:
  language: te
  text: అయితే అతని యజమాని అతనితో, “ఇశ్రాయేలు కుమారులది కాని పరదేశీయుల పట్టణానికి మనం మళ్లము; గిబియా వరకు ముందుకు వెళ్దాం” అన్నాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో, “ఇశ్రాయేలు కుమారులది కాదు.” ఇది ఇశ్రాయేలీయులను సూచించే సాధారణ జాతినామక వ్యక్తీకరణ.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָיו
  choice: అతని యజమాని
  rationale: సందర్భంలో ఇది దైవ బిరుదు కాదు; సేవకునిపై అధికారమున్న మానవ యజమానిని సూచిస్తుంది.
- source_word: נָסוּר
  choice: మనం పక్కకు తిరగము
  rationale: ప్రయాణ మార్గాన్ని విడిచి పట్టణంలో బస చేయడానికి మళ్లడాన్ని సూచించే దిశాత్మక భావాన్ని నిలుపుతుంది.
- source_word: עִיר נָכְרִי
  choice: పరదేశీయుల పట్టణం
  rationale: נָכְרִי ఇశ్రాయేలీయులు కాని బయటి ప్రజలను సూచిస్తుంది; తెలుగు సందర్భంలో ఈ రూపం సహజంగా ఉండి పట్టణ నివాసుల విదేశీయ గుర్తింపును తెలియజేస్తుంది.
- source_word: אֲשֶׁר לֹא מִבְּנֵי יִשְׂרָאֵל הֵנָּה
  choice: ఇశ్రాయేలు కుమారులకు చెందని
  rationale: హీబ్రూ జాతినామక వ్యక్తీకరణను సాధ్యమైనంత దగ్గరగా ఉంచుతూ, పట్టణం ఇశ్రాయేలీయులది కాదనే భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וְעָבַרְנוּ
  choice: ముందుకు వెళ్దాం
  rationale: ఇక్కడ ఆగకుండా ప్రయాణాన్ని కొనసాగించాలనే సందర్భార్థాన్ని సహజ తెలుగులో అందిస్తుంది.
- source_word: עַד גִּבְעָה
  choice: గిబియా వరకు
  rationale: עַד సూచించే ప్రయాణపు పరిమితి లేదా గమ్యస్థాన విస్తృతిని నేరుగా నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కథనశైలి. ‘ఇశ్రాయేలు కుమారులు’ అనే మూలభాషా జాతినామక రూపాన్ని నిలిపి, వాక్య నిర్మాణాన్ని సాధారణ పాఠకులకు స్పష్టంగా ఉంచాం.
