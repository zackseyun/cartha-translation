  text: Then the man got up to go[a], but his father-in-law urged him, so he turned back and spent the night there.
translation:
  language: te
  text: అప్పుడు ఆ మనిషి వెళ్లడానికి లేచాడు. అయితే అతని మామగారు అతన్ని పట్టుబట్టి కోరగా[a], అతడు వెనక్కి తిరిగి అక్కడ ఆ రాత్రి గడిపాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అతన్ని గట్టిగా ఒత్తిడి చేశాడు’; ఇక్కడి హీబ్రూ క్రియ పట్టుదలతో పదేపదే కోరడం లేదా ఒత్తిడి చేయడం అనే భావాన్ని ఇస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: లేచాడు
  rationale: קום అనే క్రియ ఇక్కడ వెళ్లడానికి సిద్ధమై లేవడాన్ని సూచిస్తుంది; ‘లేచాడు’ సహజమైన తెలుగు కథన రూపం.
- source_word: הָאִישׁ
  choice: ఆ మనిషి
  rationale: אִישׁ అక్షరార్థంగా ‘మనిషి’; సందర్భంలో లేవీయుణ్ణి సూచించినా, మూలపాఠంలోని సాధారణ కథన సంబోధనను నిలుపుతుంది.
- source_word: לָלֶכֶת
  choice: వెళ్లడానికి
  rationale: הלך యొక్క క్రియార్థక నామరూపం קום తరువాత ఉద్దేశాన్ని తెలియజేస్తుంది; ‘వెళ్లడానికి’ నేరుగా, సహజంగా ఉంది.
- source_word: וַיִּפְצַר בּוֹ
  choice: అతన్ని పట్టుబట్టి బతిమాలడంతో
  rationale: פצר పదం విడవకుండా గట్టిగా కోరడం లేదా ఒత్తిడి చేయడం అనే భావాన్ని కలిగి ఉంది. ఈ తెలుగు పదబంధం ఆ పట్టుదలను సహజంగా వ్యక్తపరుస్తుంది.
- source_word: חֹתְנוֹ
  choice: అతని మామ
  rationale: ఈ సందర్భంలో חֹתֵן ఆ స్త్రీ తండ్రిని, అంటే ఆ మనిషి మామను సూచిస్తుంది; ‘మామ’ ఆధునిక తెలుగులో సహజమైన బంధుత్వ పదం.
- source_word: וַיָּשָׁב
  choice: అతడు వెనక్కి తిరిగి
  rationale: שׁוב అంటే తిరగడం లేదా వెనక్కి రావడం. వెళ్లడానికి లేచిన నిర్ణయం మారినట్లు ‘వెనక్కి తిరిగి’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: וַיָּלֶן שָׁם
  choice: అక్కడ ఆ రాత్రి గడిపాడు
  rationale: לון ఇక్కడ రాత్రి బస చేయడాన్ని సూచిస్తుంది; ఈ ఎంపిక కాలభావాన్ని స్పష్టంగా, సహజంగా అందిస్తుంది.
