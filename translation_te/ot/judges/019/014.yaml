  edition: WLC
  text: וַ/יַּעַבְר֖וּ וַ/יֵּלֵ֑כוּ וַ/תָּבֹ֤א לָ/הֶם֙ הַ/שֶּׁ֔מֶשׁ אֵ֥צֶל הַ/גִּבְעָ֖ה אֲשֶׁ֥ר לְ/בִנְיָמִֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/014.yaml
  text: So they passed on and went their way[a], and the sun set on them near Gibeah, which belongs to Benjamin.
translation:
  language: te
  text: అలా వారు దాటి ముందుకు వెళ్లారు; బెన్యామీనుకు చెందిన గిబియా దగ్గర ఉండగా సూర్యుడు అస్తమించాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “బెన్యామీను ప్రాంతంలో ఉన్న గిబియా.” హీబ్రూ పదబంధం గిబియాకు బెన్యామీను గోత్రం లేదా దాని భూభాగంతో ఉన్న అనుబంధాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַבְרוּ וַיֵּלֵכוּ
  choice: వారు దాటి ముందుకు సాగారు
  rationale: రెండు వరుస గమన క్రియలను పూర్తిగా కలిపివేయకుండా, మునుపటి స్థలాన్ని దాటి ప్రయాణం కొనసాగించిన భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וַתָּבֹא לָהֶם הַשֶּׁמֶשׁ
  choice: వచ్చేసరికి సూర్యుడు అస్తమించాడు
  rationale: అక్షరార్థంగా ‘సూర్యుడు వారికి వచ్చాడు’ అనే హీబ్రూ ప్రయోగం ప్రయాణంలో సంధ్య వారిని చేరుకున్నదనే భావాన్ని సూచిస్తుంది; తెలుగు సందర్భంలో ‘సూర్యుడు అస్తమించాడు’ సహజమైన సమానార్థక వ్యక్తీకరణ.
- source_word: אֵצֶל
  choice: దగ్గరికి
  rationale: ప్రయాణ సందర్భంలో స్థల సమీపత్వాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: הַגִּבְעָה
  choice: గిబియా
  rationale: ఇక్కడ సాధారణ నామవాచకమైన ‘కొండ’ కాదు, బెన్యామీనుతో అనుబంధించబడిన స్థలనామం.
- source_word: אֲשֶׁר לְבִנְיָמִן
  choice: బెన్యామీనుకు చెందిన
  rationale: ఈ పదబంధం గిబియాకు బెన్యామీను గోత్రం లేదా దాని భూభాగంతో ఉన్న అనుబంధాన్ని సూచిస్తుంది; హీబ్రూలోని స్వామ్య/అనుబంధ భావాన్ని కాపాడుతుంది.
- source_word: בִנְיָמִן
  choice: బెన్యామీను
  rationale: గోత్రనామాన్ని ప్రాజెక్టుకు తగిన తెలుగు రూపంలో లిప్యంతరీకరించింది.
