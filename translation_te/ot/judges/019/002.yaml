id: JDG.19.2
reference: Judges 19:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/תִּזְנֶ֤ה עָלָי/ו֙ פִּֽילַגְשׁ֔/וֹ וַ/תֵּ֤לֶךְ מֵֽ/אִתּ/וֹ֙ אֶל בֵּ֣ית אָבִ֔י/הָ אֶל בֵּ֥ית לֶ֖חֶם יְהוּדָ֑ה וַ/תְּהִי שָׁ֕ם יָמִ֖ים אַרְבָּעָ֥ה חֳדָשִֽׁים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/002.yaml
  text: But his concubine was unfaithful to him[a], and she went away from him to her father's house, to Bethlehem in Judah, and was there for four months.
translation:
  language: te
  text: అయితే అతని ఉపపత్ని అతనికి లైంగికంగా అవిశ్వాసంగా ప్రవర్తించింది[a]. ఆమె అతన్ని విడిచి యూదాలోని బేత్లెహేములో ఉన్న తన తండ్రి ఇంటికి వెళ్లి, అక్కడ నాలుగు నెలలు ఉంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, మరింత అక్షరార్థంగా, “అతనికి విరోధంగా వేశ్యలా ప్రవర్తించింది.” కొందరు ప్రాచీన వ్యాఖ్యాతలు ఈ వాక్యాన్ని “ఆమె అతనిపై కోపపడింది” లేదా “అతనితో గొడవపడింది” అనే భిన్నార్థంలో గ్రహించారు.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּזְנֶה
  choice: నమ్మకద్రోహం చేసింది
  rationale: זנה అనే క్రియ సాధారణంగా లైంగిక అవిశ్వాసాన్ని సూచిస్తుంది. వాణిజ్య వ్యభిచారం అని అతిగా నిర్దిష్టం చేయకుండా, ఈ సందర్భంలోని సంబంధద్రోహ భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: עָלָיו
  choice: అతనికి
  rationale: זנהతో వచ్చిన על ప్రత్యయం భర్తపట్ల లేదా అతనికి విరోధంగా చేసిన అవిశ్వాసాన్ని సూచిస్తుంది; ‘అతనికి నమ్మకద్రోహం చేసింది’ తెలుగులో సహజమైన ప్రయోగం.
- source_word: פִּילַגְשׁוֹ
  choice: అతని ఉపపత్ని
  rationale: פילגש గుర్తింపు ఉన్నప్పటికీ తక్కువ సామాజిక హోదా గల వైవాహిక/లైంగిక బంధంలోని స్త్రీని సూచిస్తుంది; ‘ఉపపత్ని’ సంక్షిప్తమైన ప్రామాణిక తెలుగు సమానం.
- source_word: וַתֵּלֶךְ מֵאִתּוֹ
  choice: ఆమె అతన్ని విడిచి ... వెళ్లి
  rationale: కదలికను తెలిపే క్రియతోపాటు מן + אֵת సూచించే వేరుపడటాన్ని కూడా ఈ ప్రయోగం స్పష్టంగా తెలియజేస్తుంది.
- source_word: אֶל בֵּית אָבִיהָ
  choice: తన తండ్రి ఇంటికి
  rationale: కుటుంబ గృహాన్ని సూచించే హీబ్రూ పదబంధానికి సహజమైన, సన్నిహిత తెలుగు అనువాదం.
- source_word: אֶל בֵּית לֶחֶם יְהוּדָה
  choice: యూదాలోని బేత్లెహేములో ఉన్న
  rationale: యూదా ప్రాంతంలోని బేత్లెహేము పట్టణమే ఉద్దేశమని ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది; తండ్రి ఇల్లు అక్కడ ఉందనే వాక్యసంబంధాన్ని సహజంగా అమర్చుతుంది.
- source_word: וַתְּהִי שָׁם
  choice: అక్కడ ... ఉంది
  rationale: ‘అక్కడ ఉండింది’ అనే మూల భావాన్ని సరళమైన తెలుగు కథన శైలిలో కాపాడుతుంది.
- source_word: יָמִים אַרְבָּעָה חֳדָשִׁים
  choice: నాలుగు నెలలు
  rationale: అక్షరార్థంగా ‘దినాలు, నాలుగు నెలలు’ అనే హీబ్రూ కాలవ్యవధి నుడికారానికి స్పష్టమైన తెలుగు రూపం.
theological_decisions:
- issue: నైతిక ఆరోపణ ఉన్న కథనంలో וַתִּזְנֶה అర్థం
  choice: లైంగిక అవిశ్వాసం—‘నమ్మకద్రోహం చేసింది’
  alternative: ‘వేశ్యలా ప్రవర్తించింది’; లేదా కొన్ని ప్రాచీన వ్యాఖ్యాన సంప్రదాయాల ప్రకారం ‘అతనిపై కోపపడింది/అతనితో గొడవపడింది’
  rationale: మసొరేటిక్ స్వరచిహ్నాలు, זנה యొక్క సాధారణ పదార్థం లైంగిక అవిశ్వాసానికే మద్దతిస్తాయి. అయితే భిన్నమైన ప్రాచీన అవగాహనను పాదటిప్పణిలో ఉంచడం ద్వారా పాఠ్య-వ్యాఖ్యాన ఉద్రిక్తతను అనవసరంగా పరిష్కరించకుండా కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే సహజమైన, గంభీరమైన కథన శైలి. మూలంలోని నైతిక తీవ్రతను నిలుపుతూ వాణిజ్య వ్యభిచారం అనే అవసరానికి మించిన నిర్దిష్టతను ప్రధాన పాఠ్యంలో నివారించాం.
