revisions:
- from: అయితే అతని ఉపపత్ని అతనికి నమ్మకద్రోహం చేసింది[a]. ఆమె అతన్ని విడిచి యూదాలోని బేత్లెహేములో ఉన్న తన తండ్రి ఇంటికి వెళ్లి, అక్కడ నాలుగు నెలలు ఉంది.
  to: అయితే అతని ఉపపత్ని అతనికి లైంగికంగా అవిశ్వాసంగా ప్రవర్తించింది[a]. ఆమె అతన్ని విడిచి యూదాలోని బేత్లెహేములో ఉన్న తన తండ్రి ఇంటికి వెళ్లి, అక్కడ నాలుగు నెలలు ఉంది.
  rationale: The revision narrows the main rendering from general betrayal to sexual unfaithfulness, the ordinary sense of the pointed Masoretic verb זנה in this context. It does not force the more specific sense of commercial prostitution. The footnote continues to identify both the more literal sexual/prostitution-oriented rendering and the ancient less-accusatory alternative.
