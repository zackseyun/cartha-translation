    issue: The expression ‘పగలు చాలావరకు గడిచిపోయింది’ does not fully express the emphatic ‘very far gone’ force of רַד מְאֹד.
    rationale: It can mean simply that a large portion of daytime had passed. ‘రోజు బాగా ముదిరిపోయింది’ more naturally conveys the advanced lateness in the Hebrew idiom.
  - severity: low
    issue: ‘ఈ పట్టణంలోకి పక్కకు వెళ్లి’ has slightly awkward attachment of ‘పక్కకు’ to entering the city.
    rationale: The Hebrew describes turning aside from the route toward the city. ‘ఈ యెబూసీయుల పట్టణానికి దారి మళ్లించి’ states this naturally while preserving the motion and cohortative sense.
