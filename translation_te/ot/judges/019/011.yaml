translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. ప్రాచీన స్థలనామాన్ని ప్రధాన పాఠంలో నిలిపి, గుర్తింపును పాదసూచికలో ఇచ్చాం. ‘యువకుడు’ అనే మూలపదంలోని అర్థవ్యాప్తిని సంకుచితం చేయకుండా పాదసూచికతో వివరించాం.
