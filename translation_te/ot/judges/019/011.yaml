source:
  edition: WLC
  text: הֵ֣ם עִם יְב֔וּס וְ/הַ/יּ֖וֹם רַ֣ד מְאֹ֑ד וַ/יֹּ֨אמֶר הַ/נַּ֜עַר אֶל אֲדֹנָ֗י/ו לְכָ/ה נָּ֛א וְ/נָס֛וּרָה אֶל עִֽיר הַ/יְבוּסִ֥י הַ/זֹּ֖את וְ/נָלִ֥ין בָּֽ/הּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/011.yaml
  text: When they were near Jebus[a], and the day was far spent, the young man said to his master, “Please come[c][b], let us turn aside to this city of the Jebusites and spend the night in it.”
translation:
  language: te
  text: వారు యెబూసు[a] దగ్గర ఉన్నప్పుడు, రోజు బాగా ముదిరిపోయింది[b]. అప్పుడు ఆ యువకుడు[c] తన యజమానితో, “దయచేసి రండి; మనం ఈ యెబూసీయుల పట్టణానికి దారి మళ్లించి, అక్కడ రాత్రి గడుపుదాం” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: యెబూసు అనేది యెరూషలేముకు పూర్వపు పేరు.
    reason: cross_reference
  - marker: b
    text: లేదా, “రోజు చాలా దూరం గడిచిపోయింది”; అంటే, చాలా ఆలస్యమవుతోంది.
    reason: lexical_alternative
  - marker: c
    text: హీబ్రూ పదానికి “యువకుడు” అని అర్థం; సందర్భానుసారంగా అది సేవకుణ్ణి లేదా పరిచారకుణ్ణి కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵם עִם יְבוּס
  choice: వారు యెబూసు దగ్గర ఉన్నప్పుడు
  rationale: ప్రయాణ సందర్భంలో עִם స్థలానికి సమీపాన్ని సూచిస్తుంది. సహజమైన ఆధునిక తెలుగులో ‘దగ్గర’ ఆ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: יְבוּס
  choice: యెబూసు
  rationale: హీబ్రూ పాఠంలో ఉన్న ప్రాచీన స్థలనామాన్నే నిలిపి, దానిని ‘యెరూషలేము’గా ప్రధాన పాఠంలో మార్చలేదు.
- source_word: וְהַיּוֹם רַד מְאֹד
  choice: పగలు చాలావరకు గడిచిపోయింది
  rationale: రోజు సాయంత్రం వైపు బాగా దిగిపోయిందనే కాలసూచక రూపకాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; కేవలం ‘చాలా ఆలస్యమైంది’ అని సపాటుగా చేయదు.
- source_word: הַנַּעַר
  choice: ఆ యువకుడు
  rationale: נַעַר అనే పదానికి యువకుడు, బాలుడు, సేవకుడు అనే అర్థవ్యాప్తి ఉంది. ప్రధాన పాఠంలో విస్తృతమైన ‘యువకుడు’ను ఉంచి, సందర్భానుసారమైన సేవకుడు/పరిచారకుడు అనే అవకాశాన్ని పాదసూచికలో తెలిపాం.
- source_word: אֲדֹנָיו
  choice: తన యజమానితో
  rationale: ఈ సామాజిక సందర్భంలో אֲדוֹן పైఅధికారిని లేదా యజమానిని సూచిస్తుంది; ‘ప్రభువు’ కంటే ‘యజమాని’ సందర్భోచితం.
- source_word: לְכָה נָּא
  choice: దయచేసి రండి
  rationale: చలనాన్ని ఆదేశించే క్రియతో పాటు נָא లోని వినయపూర్వక విజ్ఞప్తి భావాన్ని నిలుపుతుంది.
- source_word: וְנָסוּרָה
  choice: మనం ... పక్కకు వెళ్లి
  rationale: ప్రధాన ప్రయాణ మార్గం నుంచి మళ్లి పట్టణంలోకి వెళ్లాలనే cohortative భావాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: עִיר הַיְבוּסִי הַזֹּאת
  choice: యెబూసీయుల ఈ పట్టణం
  rationale: הַיְבוּסִי ఇక్కడ సమూహార్థక జాతినామం; ‘ఈ’ అనే నిర్దేశక పదాన్ని కూడా నిలిపింది.
- source_word: וְנָלִין בָּהּ
  choice: అక్కడ రాత్రి గడుపుదాం
  rationale: לוּן యొక్క రాత్రిపూట బసచేయడం అనే అర్థాన్ని స్పష్టమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
