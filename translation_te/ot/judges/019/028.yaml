translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కథన శైలి. మూలంలోని సంక్షిప్తతను, చర్యల వరుసను, స్త్రీ స్పందించలేదనే ఉద్దేశపూర్వక అస్పష్టతను నిలిపాం; ఆమె స్థితిని వచనం చెప్పినదానికంటే ఎక్కువగా నిర్ధారించలేదు. ప్రధాన పాఠంలోని ప్రతి పాదసూచిక గుర్తు సంబంధిత పదబంధం వెంట ఉంచబడింది.
