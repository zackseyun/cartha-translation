  text: וַ/יֹּ֧אמֶר אֵלֶ֛י/הָ ק֥וּמִי וְ/נֵלֵ֖כָה וְ/אֵ֣ין עֹנֶ֑ה וַ/יִּקָּחֶ֨/הָ֙ עַֽל הַ/חֲמ֔וֹר וַ/יָּ֣קָם הָ/אִ֔ישׁ וַ/יֵּ֖לֶךְ לִ/מְקֹמֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/028.yaml
  text: He said to her[a], “Get up, and let us go.” But there was no answer. Then he put her on the donkey[c][b], and the man rose and went to his place.
translation:
  language: te
  text: అతడు ఆమెతో, “లేచి, మనం వెళ్దాం” అన్నాడు. కానీ జవాబు లేదు.[a] అప్పుడు అతడు ఆమెను గాడిద మీదికి ఎత్తి పెట్టాడు.[b] ఆ మనిషి లేచి తన చోటికి వెళ్లాడు.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ అక్షరార్థం: “జవాబు చెప్పేవారు ఎవరూ లేరు” లేదా “జవాబిచ్చేది లేదు.”'
    reason: lexical_alternative
  - marker: b
    text: లేదా, “అతడు ఆమెను గాడిదపైకి ఎక్కించాడు.” హీబ్రూ క్రియకు అక్షరార్థం “తీసుకున్నాడు”; ఇక్కడ ఆమెను జంతువు మీదికి ఎత్తి ఉంచడం అనే భావంలో ఉంది.
    reason: lexical_alternative
  - marker: c
    text: 'లేదా, “తన ఇంటికి వెళ్లాడు.” హీబ్రూ అక్షరార్థం: “తన చోటికి.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלֶיהָ
  choice: అతడు ఆమెతో అన్నాడు
  rationale: హీబ్రూ కథన క్రమాన్ని సహజమైన ఆధునిక తెలుగు వాక్య నిర్మాణంలో వ్యక్తం చేస్తుంది.
- source_word: קוּמִי
  choice: లేచి
  rationale: స్త్రీ ఏకవచన ఆజ్ఞారూపమైన קום ను సహజమైన ప్రత్యక్ష ఆజ్ఞగా అందిస్తుంది.
- source_word: וְנֵלֵכָה
  choice: మనం వెళ్దాం
  rationale: మొదటి పురుష బహువచన సంకల్పార్థక రూపంలోని ప్రోత్సాహక భావాన్ని నిలుపుతుంది.
- source_word: וְאֵין עֹנֶה
  choice: కానీ జవాబు లేదు
  rationale: అక్షరార్థంగా ‘జవాబిచ్చేవారు లేరు/జవాబిచ్చేది లేదు’; సందర్భంలో స్పందన లేకపోవడాన్ని సహజంగా తెలుపుతుంది. ‘కానీ’ ముందు పలికిన ఆజ్ఞకు విరుద్ధమైన ఫలితాన్ని సూచిస్తుంది.
- source_word: וַיִּקָּחֶהָ עַל הַחֲמוֹר
  choice: అతడు ఆమెను గాడిద మీదికి ఎత్తి పెట్టాడు
  rationale: לקח యొక్క మూలార్థం ‘తీసుకొను’; עַל הַחֲמוֹר తో కలిసిన సందర్భంలో ఆమెను జంతువు మీదికి ఎత్తి ఉంచిన చర్యను స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: וַיָּקָם הָאִישׁ
  choice: ఆ మనిషి లేచి
  rationale: קום ను తరువాతి הלך లో కలపకుండా, రెండు వరుస చర్యలలో మొదటిదిగా నిలుపుతుంది.
- source_word: וַיֵּלֶךְ לִמְקֹמוֹ
  choice: తన చోటికి వెళ్లాడు
  rationale: מקום యొక్క విస్తృతమైన ‘చోటు’ అనే అర్థాన్ని నిలుపుతుంది; సందర్భంలో అది ఇల్లు లేదా స్వస్థలాన్ని సూచించవచ్చు.
