translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. బహువచనం నుంచి ఏకవచనానికి వచ్చే హీబ్రూ కథన మార్పు నిలుపబడింది. ‘విశాల కూడలి’ మరియు ‘తన ఇంటికి చేర్చుకునే’ అనే పదబంధాలు మూలంలోని ప్రజాస్థలం, ఆతిథ్యం అనే భావాలను సహజంగా తెలియజేస్తాయి.
