  text: וַ/יָּסֻ֣רוּ שָׁ֔ם לָ/ב֖וֹא לָ/ל֣וּן בַּ/גִּבְעָ֑ה וַ/יָּבֹ֗א וַ/יֵּ֨שֶׁב֙ בִּ/רְח֣וֹב הָ/עִ֔יר וְ/אֵ֥ין אִ֛ישׁ מְאַסֵּֽף אוֹתָ֥/ם הַ/בַּ֖יְתָ/ה לָ/לֽוּן־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/015.yaml
  text: They turned aside there to go in and spend the night at Gibeah[a]. He went in and sat down in the open square of the city[b], and there was no man gathering them into his house to spend the night.
translation:
  language: te
  text: వారు గిబియాలోకి వెళ్లి అక్కడ రాత్రి గడపడానికి దారి మళ్లారు. అతడు వచ్చి పట్టణంలోని విశాల బహిరంగ ప్రదేశంలో[a] కూర్చున్నాడు. అయితే రాత్రి గడపడానికి వారిని తన ఇంటికి చేర్చుకునే మనిషి[b] ఎవరూ లేడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘పట్టణ వీధిలో’; హీబ్రూ పదం విశాలమైన బహిరంగ ప్రదేశాన్ని లేదా వీధిని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ మూలంలో ‘మనిషి ఎవరూ లేడు’; అంటే అక్కడి నివాసుల్లో ఎవరూ వారిని ఇంటికి ఆహ్వానించి ఆతిథ్యం ఇవ్వలేదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּסֻרוּ
  choice: దారి మళ్లారు
  rationale: ప్రయాణ మార్గం నుంచి పక్కకు తిరగడాన్ని సూచించే סור భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; కేవలం ‘ఆగారు’ అనే అర్థానికి పరిమితం చేయదు.
- source_word: לָבוֹא
  choice: లోకి వెళ్లి
  rationale: בוא అనే ప్రవేశ భావాన్ని ప్రయాణికుల దృష్టికోణం నుంచి సహజంగా తెలియజేస్తుంది.
- source_word: לָלוּן
  choice: రాత్రి గడపడానికి
  rationale: לון సూచించే రాత్రిపూట బసచేయడం అనే స్పష్టమైన భావాన్ని సాధారణ ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: בַּגִּבְעָה
  choice: గిబియాలో
  rationale: స్థలనామాన్ని తెలుగులో లిప్యంతరీకరించి, పట్టణంలోకి ప్రవేశించి అక్కడ బసచేయాలనే సందర్భానికి అనుగుణంగా విభక్తిని వాడింది.
- source_word: וַיָּבֹא וַיֵּשֶׁב
  choice: అతడు ... కూర్చున్నాడు
  rationale: హీబ్రూలో బహువచనం నుంచి ఏకవచనానికి మారిన కథన రూపాన్ని నిలుపుతుంది; ప్రధాన ప్రయాణికుడు బృందానికి ప్రతినిధిగా చేసిన చర్యను సూచిస్తుంది. ‘పట్టణంలోకి వెళ్లాడు’ అనే భావం ముందరి వాక్యంలో ఇప్పటికే స్పష్టంగా ఉండడంతో తెలుగులో అనవసర పునరుక్తి నివారించబడింది.
- source_word: בִּרְחוֹב הָעִיר
  choice: పట్టణంలోని విశాల కూడలిలో
  rationale: רְחוֹב ఇక్కడ ఇరుకైన వీధికన్నా బహిరంగమైన విశాల ప్రజాస్థలాన్ని లేదా కూడలిని సూచించగలదు; ఆ భావాన్ని స్పష్టంగా, సహజంగా అందిస్తుంది.
- source_word: וְאֵין אִישׁ
  choice: మనిషి ఎవరూ లేడు
  rationale: హీబ్రూలోని אִישׁ పదాన్ని ‘మనిషి’గా నిలుపుతూ, ఆ పట్టణ నివాసుల్లో ఎవ్వరూ ఆతిథ్యం ఇవ్వలేదనే సందర్భార్థాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: מְאַסֵּף אוֹתָם הַבַּיְתָה
  choice: వారిని తన ఇంటికి చేర్చుకునే
  rationale: אסף యొక్క ‘లోపలికి చేర్చుకోవడం’ అనే మూలభావాన్నీ, ప్రయాణికులకు ఇంట్లో ఆతిథ్యం ఇచ్చే సందర్భాన్నీ రెండింటినీ తెలియజేస్తుంది.
