translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘ఉపపత్ని’ మూలపదంలోని సామాజిక భేదాన్ని కాపాడుతూ అవమానకరమైన ప్రత్యామ్నాయాన్ని నివారిస్తుంది; ‘ఎదుటివరకు’ ప్రాదేశిక అస్పష్టతను నిలుపుతుంది.
