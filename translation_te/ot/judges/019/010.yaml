- from: అయితే ఆ మనిషి అక్కడ రాత్రి బస చేయడానికి ఇష్టపడలేదు. అతడు లేచి బయలుదేరి, యెబూసు ఎదుటివరకు[a] వచ్చాడు—అదే యెరూషలేము. అతనితో జీను కట్టిన ఒక జత గాడిదలు, అతని ఉపపత్ని ఉన్నారు.
  to: అయితే ఆ మనిషి అక్కడ రాత్రి బస చేయడానికి ఇష్టపడలేదు. అతడు లేచి బయలుదేరి, యెబూసుకు ఎదురుగా[a] వచ్చాడు—అదే యెరూషలేము. అతనితో జీను వేసిన ఒక జత గాడిదలు, అతని ఉపపత్ని ఉన్నారు.
