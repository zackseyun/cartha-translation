  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/לֹֽא אָבָ֤ה הָ/אִישׁ֙ לָ/ל֔וּן וַ/יָּ֣קָם וַ/יֵּ֗לֶךְ וַ/יָּבֹא֙ עַד נֹ֣כַח יְב֔וּס הִ֖יא יְרוּשָׁלִָ֑ם וְ/עִמּ֗/וֹ צֶ֤מֶד חֲמוֹרִים֙ חֲבוּשִׁ֔ים וּ/פִילַגְשׁ֖/וֹ עִמּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/010.yaml
  text: But the man was not willing to spend the night. He rose and went and came opposite Jebus (that is[a], Jerusalem), and with him were a pair of saddled donkeys and his concubine.
translation:
  language: te
  text: అయితే ఆ మనిషి అక్కడ రాత్రి బస చేయడానికి ఇష్టపడలేదు. అతడు లేచి బయలుదేరి, యెబూసుకు ఎదురుగా[a] వచ్చాడు—అదే యెరూషలేము. అతనితో జీను వేసిన ఒక జత గాడిదలు, అతని ఉపపత్ని ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘యెబూసు పరిసరాల వరకు’ లేదా ‘యెబూసుకు ఎదురుగా ఉన్న ఒక స్థానం వరకు.’ హీబ్రూ పదబంధం అతడు నగరంలోకి ప్రవేశించాడని స్పష్టంగా చెప్పకుండా, నగరానికి ఎదురుగా లేదా దాని ముందున్న స్థానాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָבָה
  choice: ఇష్టపడలేదు
  rationale: ఈ క్రియ కోరికకంటే సమ్మతి లేదా సంసిద్ధతను సూచిస్తుంది. సందర్భంలో ఉద్దేశపూర్వకంగా ఒప్పుకోకపోవడాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: לָלוּן
  choice: రాత్రి బస చేయడానికి
  rationale: ఈ రూపం ప్రత్యేకంగా రాత్రిపూట ఉండడాన్ని సూచిస్తుంది; ‘రాత్రి బస చేయడం’ స్పష్టంగా, సహజంగా ఉంది.
- source_word: וַיָּקָם וַיֵּלֶךְ וַיָּבֹא
  choice: లేచి బయలుదేరి ... వచ్చాడు
  rationale: హీబ్రూ వరుస క్రియల కథన గమనాన్ని తెలుగులో సహజంగా నిలుపుతూ, లేవడం, ప్రయాణం మొదలుపెట్టడం, చేరడం అనే వరుసను కాపాడుతుంది.
- source_word: עַד נֹכַח
  choice: ఎదుటివరకు
  rationale: నగరంలోకి ప్రవేశించాడని నిర్ధారించకుండా, యెబూసుకు ఎదురుగా లేదా దాని ముందున్న స్థానం వరకు వచ్చాడనే ప్రాదేశిక భావాన్ని కాపాడుతుంది.
- source_word: יְבוּס הִיא יְרוּשָׁלָם
  choice: యెబూసు—అదే యెరూషలేము
  rationale: పాత పేరైన యెబూసును యెరూషలేముతో గుర్తించే మూలపాఠంలోని వివరణాత్మక ఉపవాక్యాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: צֶמֶד חֲמוֹרִים
  choice: ఒక జత గాడిదలు
  rationale: జంతువుల విషయంలో צֶמֶד రెండు జంతువుల జతను సూచిస్తుంది.
- source_word: חֲבוּשִׁים
  choice: జీను కట్టిన
  rationale: ప్రయాణానికి సిద్ధం చేసిన గాడిదల సందర్భంలో జీను లేదా ప్రయాణ సామగ్రి కట్టబడిన భావాన్ని సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: פִּילַגְשׁוֹ
  choice: అతని ఉపపత్ని
  rationale: ఆ స్త్రీ ప్రత్యేక సామాజిక హోదాను అవమానకరమైన వాడుక పదం లేకుండా, ఖచ్చితమైన సాహిత్య తెలుగులో తెలియజేస్తుంది.
