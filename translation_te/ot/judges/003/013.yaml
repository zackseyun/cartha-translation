id: JDG.3.13
reference: Judges 3:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֶּאֱסֹ֣ף אֵלָ֔י/ו אֶת בְּנֵ֥י עַמּ֖וֹן וַ/עֲמָלֵ֑ק וַ/יֵּ֗לֶךְ וַ/יַּךְ֙ אֶת יִשְׂרָאֵ֔ל וַ/יִּֽירְשׁ֖וּ אֶת עִ֥יר הַ/תְּמָרִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/013.yaml
  text: He gathered to himself the Ammonites and Amalek[a], and he went and struck Israel[b], and they took possession of the City of Palms.
translation:
  language: te
  text: అతడు అమ్మోనీయులను, అమాలేకీయులను[a] తన దగ్గరికి సమకూర్చుకున్నాడు. తరువాత అతడు వెళ్లి ఇశ్రాయేలుపై దాడి చేశాడు; వారు ఖర్జూర చెట్ల పట్టణాన్ని[b] స్వాధీనం చేసుకున్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూల హీబ్రూలో “అమాలేకు” అనే పేరు ఉంది; అది ఇక్కడ అమాలేకీయులను సమూహంగా సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ఇది బహుశా యెరికో; ద్వితీయోపదేశకాండం 34:3; 2 దినవృత్తాంతాలు 28:15 చూడండి.
    reason: cross_reference
lexical_decisions:
- source_word: וַיֶּאֱסֹף אֵלָיו
  choice: తన దగ్గరికి సమకూర్చుకున్నాడు
  rationale: אָסַף‌తో אֵלָיו కలసి, ఇతరులను తన నాయకత్వం కింద తనవైపు కూడగట్టుకున్న భావాన్ని ఇస్తుంది. ఈ తెలుగు ప్రయోగం ఆ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בְּנֵי עַמּוֹן
  choice: అమ్మోనీయులను
  rationale: అక్షరార్థమైన ‘అమ్మోను కుమారులను’ కంటే, ఇక్కడ ప్రజాసమూహాన్ని సూచించే సహజమైన ఆధునిక తెలుగు జాతినామం సరిపోతుంది.
- source_word: עֲמָלֵק
  choice: అమాలేకీయులను
  rationale: హీబ్రూలో ‘అమాలేకు’ అనే ఏకవచన రూపం ప్రజాసమూహాన్ని సమష్టిగా సూచిస్తుంది. తెలుగులో ఉద్దేశించిన ప్రజలను స్పష్టంగా తెలియజేయడానికి ‘అమాలేకీయులు’ అని అనువదించబడింది; మూలరూపం పాదసూచికలో తెలియజేయబడింది.
- source_word: וַיֵּלֶךְ
  choice: అతడు వెళ్లి
  rationale: הלך సాధారణంగా ‘వెళ్లు’ అనే అర్థాన్నిస్తుంది. ‘దండెత్తి వెళ్లాడు’ వంటి అదనపు సైనిక భావాన్ని చేర్చకుండా కథన క్రమాన్ని నిలుపుతుంది.
- source_word: וַיַּךְ אֶת יִשְׂרָאֵל
  choice: ఇశ్రాయేలును ఓడించాడు
  rationale: נכה యుద్ధ సందర్భంలో కొట్టడం లేదా ఓడించడం అనే భావాన్ని కలిగి ఉంటుంది. తెలుగులో ‘ఇశ్రాయేలును కొట్టాడు’ అసహజంగా ఉండగలదు; ‘ఓడించాడు’ సందర్భానుగుణమైన సైనిక ఫలితాన్ని స్పష్టంగా చెబుతుంది.
- source_word: וַיִּירְשׁוּ
  choice: వారు … స్వాధీనం చేసుకున్నారు
  rationale: క్రియ మూడవ పురుష బహువచనంలో ఉంది; కాబట్టి ఎగ్లోను ఒక్కడే కాక అతనితో కూడిన మిత్రబలగాలు కర్తలు. ירשׁ ఇక్కడ జయించి ఆధీనంలోకి తెచ్చుకున్న భావాన్ని ఇస్తుంది.
- source_word: עִיר הַתְּמָרִים
  choice: ఖర్జూర చెట్ల పట్టణం
  rationale: హీబ్రూ వర్ణనాత్మక స్థలనామంలోని చిత్రాన్ని నిలుపుతూ సహజమైన తెలుగులో అనువదించబడింది. దానిని నేరుగా ‘యెరికో’గా మార్చలేదు.
theological_decisions:
- issue: עִיר הַתְּמָרִים అనే స్థలపు గుర్తింపు
  choice: ప్రధాన పాఠ్యంలో ‘ఖర్జూర చెట్ల పట్టణం’ అని ఉంచడం
  alternative: ‘యెరికో’ అని నేరుగా అనువదించడం
  rationale: మూల హీబ్రూ స్పష్టంగా ‘యెరికో’ అని కాక వర్ణనాత్మక బిరుదును ఉపయోగిస్తుంది. అందువల్ల మూలంలోని పదప్రయోగాన్ని ప్రధాన పాఠ్యంలో నిలిపి, యెరికోతో ఉండే సంభావ్య గుర్తింపును పాదసూచికకు పరిమితం చేశాము.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన కథన శైలి వాడబడింది. హీబ్రూ వాక్యంలోని ఏకవచన కర్త నుంచి బహువచన కర్తకు మార్పు ‘అతడు … వారు’ ద్వారా స్పష్టంగా నిలుపబడింది. అందించిన ఆంగ్ల సంప్రదింపు పాఠ్యంలో పాదసూచిక గుర్తులు విషయాలకు విరుద్ధంగా జతచేయబడినట్లు కనిపించినందున, తెలుగు ముసాయిదాలో అమాలేకు వివరణకు [a], ఖర్జూర చెట్ల పట్టణం గుర్తింపుకు [b] క్రమబద్ధంగా జతచేయబడ్డాయి.
