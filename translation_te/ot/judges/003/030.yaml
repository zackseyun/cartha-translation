  text: So Moab was subdued under the hand of Israel that day[c][b][a], and the land had rest for eighty years.
translation:
  language: te
  text: ఆ రోజున మోయాబు ఇశ్రాయేలు చేతికింద[a] లోబడింది. దేశం ఎనభై సంవత్సరాలు విశ్రాంతిగా ఉంది[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ఇశ్రాయేలు చేతికింద” అనేది ఇశ్రాయేలు అధికారానికి లోబడడాన్ని సూచించే హీబ్రూ నుడికారం.
    reason: cultural_note
  - marker: b
    text: లేదా “ప్రశాంతంగా ఉంది,” లేదా “శాంతిగా ఉంది.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּכָּנַע
  choice: అణచివేయబడింది
  rationale: నిఫల్ రూపం మోయాబు సైనిక-రాజకీయంగా లోబడేలా చేయబడిందని సూచిస్తుంది; కేవలం భావపరమైన వినయాన్ని గానీ సంపూర్ణ నిర్మూలనను గానీ సూచించదు.
- source_word: מוֹאָב
  choice: మోయాబు
  rationale: దేశం/జనాంగం పేరుకు తెలుగులో ప్రాచుర్యంలో ఉన్న రూపం.
- source_word: בַּיּוֹם הַהוּא
  choice: ఆ రోజు
  rationale: సూచనార్థక కాలవ్యక్తీకరణను సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: תַּחַת יַד יִשְׂרָאֵל
  choice: ఇశ్రాయేలు చేతి కింద
  rationale: ఇశ్రాయేలు అధికారానికి లోబడడాన్ని సూచించే హీబ్రూ నుడికారంలోని ‘చేతి కింద’ అనే దృశ్యరూపాన్ని నిలుపుతుంది.
- source_word: וַתִּשְׁקֹט
  choice: ప్రశాంతంగా ఉంది
  rationale: యుద్ధకలహాలు ఆగి దేశం విశ్రాంతి లేదా శాంతిని అనుభవించిందనే సందర్భార్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: הָאָרֶץ
  choice: దేశం
  rationale: ఇక్కడ ఇశ్రాయేలు ప్రాంతాన్ని సమగ్రంగా సూచిస్తుంది; ఆధునిక తెలుగులో ‘దేశం’ సహజంగా ఉంటుంది.
- source_word: שְׁמוֹנִים שָׁנָה
  choice: ఎనభై సంవత్సరాలు
  rationale: కాలవ్యవధిని తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: మోయాబుపై ఇశ్రాయేలు ఆధిపత్య స్వభావం
  choice: సైనిక-రాజకీయ లోబరచడం; హీబ్రూ నుడికారాన్ని నిలుపుతూ ‘ఇశ్రాయేలు చేతి కింద అణచివేయబడింది’
  alternative: కేవలం రూపకాలంకారమైన తగ్గింపు లేదా సంపూర్ణ నిర్మూలన
  rationale: మూలపాఠం మోయాబు అధికారపరంగా లోబడినదని, దాని ఫలితంగా దేశానికి ప్రశాంతత కలిగిందని చెబుతుంది; దీనిని నిర్మూలనగా తీవ్రతరం చేయకూడదు, కేవలం అంతరంగ వినయంగా బలహీనపరచకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన శైలి. ‘చేతి కింద’ అనే హీబ్రూ రూపకాన్ని పాఠ్యంలో నిలిపి, దాని అర్థాన్ని పాదటిప్పణిలో వివరించాం; שקט లోని ‘విశ్రాంతి/నిశ్చలత/శాంతి’ అర్థవిస్తృతిని పాదటిప్పణిలో సంరక్షించాం.
