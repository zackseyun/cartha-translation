revisions:
- from: కత్తి మొన తర్వాత దాని పిడి కూడా లోపలికి వెళ్లిపోయింది[a]. అతడు ఏగ్లోను కడుపులోనుంచి కత్తిని బయటికి తీయలేదు కాబట్టి, కొవ్వు కత్తి మొనను కప్పేసింది; మలము బయటికి వచ్చింది[b].
  to: కత్తి బ్లేడు తర్వాత దాని పిడి కూడా లోపలికి వెళ్లింది[a]; కొవ్వు బ్లేడును కప్పేసింది, ఎందుకంటే అతడు ఏగ్లోను కడుపులోనుంచి కత్తిని బయటికి తీయలేదు. మలం బయటికి వచ్చింది[b].
  rationale: The revision replaces the overly narrow “మొన” with “బ్లేడు,” restores the Hebrew clause order, and corrects footnote a so that it supplies alternatives for the hilt/handle term rather than introducing an unrelated alternative for blade. The final rare term remains translated directly with its lexical uncertainty preserved in a footnote.
