id: JDG.3.22
reference: Judges 3:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּבֹ֨א גַֽם הַ/נִּצָּ֜ב אַחַ֣ר הַ/לַּ֗הַב וַ/יִּסְגֹּ֤ר הַ/חֵ֨לֶב֙ בְּעַ֣ד הַ/לַּ֔הַב כִּ֣י לֹ֥א שָׁלַ֛ף הַ/חֶ֖רֶב מִ/בִּטְנ֑/וֹ וַ/יֵּצֵ֖א הַֽ/פַּרְשְׁדֹֽנָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/022.yaml
  text: The hilt also went in after the blade[a], and the fat closed over the blade, because he did not pull the sword out of his belly[b]; and the dung came out.
translation:
  language: te
  text: కత్తి బ్లేడు తర్వాత దాని పిడి కూడా లోపలికి వెళ్లింది[a]; కొవ్వు బ్లేడును కప్పేసింది, ఎందుకంటే అతడు ఏగ్లోను కడుపులోనుంచి కత్తిని బయటికి తీయలేదు. మలం బయటికి వచ్చింది[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పట్టీ” లేదా “కాడ.”
    reason: lexical_alternative
  - marker: b
    text: “మలం” అని అనువదించిన హీబ్రూ పదం చాలా అరుదైనది; అది విస్తృతంగా విసర్జిత పదార్థాన్ని లేదా పేగులలోని పదార్థాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנִּצָּב
  choice: దాని పిడి
  rationale: కత్తి సందర్భంలో, మొన తర్వాత శరీరంలోకి వెళ్లిన పిడి లేదా పిడిభాగాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘కత్తి పిడి’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: הַלַּהַב
  choice: కత్తి మొన
  rationale: ఈ ఆయుధ సందర్భంలో పదం కత్తి బ్లేడు భాగాన్ని సూచిస్తుంది. తెలుగులో ‘కత్తి మొన’ దృశ్యాన్ని సహజంగా తెలియజేస్తుంది; అయితే అది కేవలం అగ్రభాగమే అన్న అర్థానికి పరిమితం కాకుండా సందర్భానుసారంగా బ్లేడును సూచిస్తుంది.
- source_word: וַיִּסְגֹּר ... בְּעַד
  choice: కప్పేసింది
  rationale: కొవ్వు కత్తి మొన చుట్టూ మూసుకుపోయి దానిని కప్పిన దృశ్యాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: הַחֵלֶב
  choice: కొవ్వు
  rationale: హీబ్రూ పదంలోని స్పష్టమైన శారీరక చిత్రణను నిలుపుతుంది.
- source_word: שָׁלַף
  choice: బయటికి తీయలేదు
  rationale: శరీరంలో దిగిన కత్తిని వెనక్కి లాగి తీయకపోవడాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: מִבִּטְנוֹ
  choice: ఏగ్లోను కడుపులోనుంచి
  rationale: ‘కడుపు’ హీబ్రూ పదంలోని సామాన్యమైన, శారీరక భావాన్ని నిలుపుతుంది. సర్వనామ సూచనలో అయోమయం రాకుండా సందర్భంలోని ఏగ్లోను పేరును ఉపయోగించాం.
- source_word: הַפַּרְשְׁדֹנָה
  choice: మలము
  rationale: ఈ అరుదైన పదం సాధారణంగా విసర్జిత మలం లేదా పేగుల పదార్థంగా అర్థం చేసుకోబడుతుంది. ‘మలము’ గౌరవప్రదమైనప్పటికీ స్పష్టమైన ఆధునిక పదం; పదంలోని అనిశ్చితిని పాదటీపులో నిలిపాం.
- source_word: וַיֵּצֵא
  choice: బయటికి వచ్చింది
  rationale: సాధారణ కథన క్రియను, ఘట్టంలోని శారీరక వివరాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: גַם
  choice: కూడా
  rationale: మొన మాత్రమే కాక పిడి కూడా లోపలికి వెళ్లిందనే ఉద్ఘాటనను నిలుపుతుంది.
