translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరమైన కథన శైలి వాడబడింది. మూలంలోని ఘోరమైన శారీరక వివరాలను మృదువుగా మార్చకుండా, అసభ్యంగా కాకుండా స్పష్టంగా ఉంచాం. రెండు పాదటీపు సూచికలూ ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
