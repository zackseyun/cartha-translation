source:
  edition: WLC
  text: וְ/ה֤וּא יָצָא֙ וַ/עֲבָדָ֣י/ו בָּ֔אוּ וַ/יִּרְא֕וּ וְ/הִנֵּ֛ה דַּלְת֥וֹת הָ/עֲלִיָּ֖ה נְעֻל֑וֹת וַ/יֹּ֣אמְר֔וּ אַ֣ךְ מֵסִ֥יךְ ה֛וּא אֶת רַגְלָ֖י/ו בַּ/חֲדַ֥ר הַ/מְּקֵרָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/024.yaml
  text: When he had gone out[a], his servants came and looked, and behold, the doors of the upper room were locked. So they said, “Surely he is relieving himself in the cool inner room.”
translation:
  language: te
  text: అతడు బయటికి వెళ్లిన తర్వాత, అతని సేవకులు వచ్చారు. వారు చూడగా, ఇదిగో, మేడగది తలుపులు గడియ పెట్టబడి ఉన్నాయి. అప్పుడు వారు, “నిశ్చయంగా ఆయన చల్లని గదిలో మలవిసర్జన చేసుకుంటున్నాడు[a]” అనుకున్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “తన కాళ్లను కప్పుకుంటున్నాడు.” ఇది మలవిసర్జనను సూచించే సభ్యోక్తి.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּא יָצָא
  choice: అతడు బయటికి వెళ్లిన తర్వాత
  rationale: ఈ ఉపవాక్యం ఏహూదు వెళ్లిపోవడాన్ని వెనక్కి సూచిస్తూ, సేవకులు రావడానికి కాలపరమైన నేపథ్యాన్ని ఏర్పరుస్తుంది. తెలుగు కథనశైలిలో ‘వెళ్లిన తర్వాత’ సహజంగా ఈ సంబంధాన్ని తెలియజేస్తుంది.
- source_word: עֲבָדָיו
  choice: అతని సేవకులు
  rationale: రాజగృహ సందర్భంలో వీరు రాజుకు సేవచేసే పరిచారకులు. వారి బానిసస్థితిని వాక్యం ప్రధానంగా చెప్పడం లేదు కాబట్టి ‘సేవకులు’ తగిన సాధారణ పదం.
- source_word: וַיִּרְאוּ וְהִנֵּה
  choice: వారు చూడగా
  rationale: వారు వచ్చి పరిస్థితిని గమనించినప్పుడు కనిపించిన దృశ్యాన్ని ఈ తెలుగు నిర్మాణం సహజంగా పరిచయం చేస్తుంది; హీబ్రూ కథనంలోని అకస్మాత్తు గమనింపును కూడా నిలుపుతుంది.
- source_word: דַּלְתוֹת הָעֲלִיָּה
  choice: మేడగది తలుపులు
  rationale: עֲלִיָּה పై అంతస్తులోని గది లేదా మేడగదిని సూచిస్తుంది. ‘మేడగది’ సంక్షిప్తంగా, సాధారణ పాఠకులకు స్పష్టంగా ఉంటుంది.
- source_word: נְעֻלוֹת
  choice: గడియ వేసి ఉంది
  rationale: ఈ రూపం తలుపులు మూసి భద్రపరచబడ్డాయని సూచిస్తుంది. పురాతన సందర్భంలో ఆధునిక తాళంకన్నా తలుపు గడియ భావం తగినది; తలుపులు బహువచనమైనా, వాటి సమిష్టి స్థితిని తెలుగులో ఏకవచన క్రియతో సహజంగా తెలిపాం.
- source_word: אַךְ
  choice: …చేస్తున్నాడేమో
  rationale: ఇక్కడ ఈ నిపాతం సేవకులు తమ వద్ద ఉన్న సంకేతాన్ని బట్టి చేసిన బలమైన ఊహను పరిచయం చేస్తుంది. తెలుగులో ‘ఏమో’ ఆ ఊహను సహజంగా తెలియజేస్తుంది; సందర్భం దాని నిశ్చయభావాన్ని బలపరుస్తుంది.
- source_word: מֵסִיךְ הוּא אֶת רַגְלָיו
  choice: ఆయన … మలవిసర్జన చేస్తున్నాడేమో[a]
  rationale: అక్షరార్థంగా ‘తన కాళ్లను కప్పుకుంటున్నాడు’ అనే హీబ్రూ సభ్యోక్తి ఇక్కడ శరీరవిసర్జనను, ఈ సందర్భంలో ముఖ్యంగా మలవిసర్జనను సూచిస్తుంది. ప్రధాన పాఠ్యంలో అర్థాన్ని స్పష్టంగా ఇచ్చి, మూల సభ్యోక్తిని పాదసూచికలో నిలిపాం.
- source_word: בַּחֲדַר הַמְּקֵרָה
  choice: చల్లని గదిలో
  rationale: ఈ పదబంధం చల్లదనంతో సంబంధమున్న ఒక ప్రత్యేక గదిని సూచిస్తుంది. ‘లోపలి’ అనే భావం మూలంలో నిర్దిష్టంగా లేకపోవడంతో దాన్ని చేర్చకుండా, ‘చల్లని గది’ అనే సూటి రూపాన్ని ఎంచుకున్నాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలిని ఉపయోగించాం. రాజును గురించి సేవకులు మాట్లాడుతున్నందున వారి మాటలో ‘ఆయన’ అనే గౌరవసూచక సర్వనామం వాడాం. పాదసూచిక గుర్తును అది వివరించే సభ్యోక్తి అనువాదం దగ్గరే ఉంచాం.
