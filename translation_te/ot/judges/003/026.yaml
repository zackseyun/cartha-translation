translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యేలా సహజమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని ‘తప్పించుకున్నాడు’ అనే పునరుక్తిని ఉద్దేశపూర్వకంగా నిలిపాం. ఆంగ్ల సంప్రదాయ లిప్యంతరీకరణ భేదం తెలుగులో ఉపయోగకరమైన పాఠభేదం కానందున పాదటిప్పణి ఇవ్వలేదు.
