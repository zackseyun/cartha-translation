id: JDG.3.26
reference: Judges 3:26
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אֵה֥וּד נִמְלַ֖ט עַ֣ד הִֽתְמַהְמְהָ֑/ם וְ/הוּא֙ עָבַ֣ר אֶת הַ/פְּסִילִ֔ים וַ/יִּמָּלֵ֖ט הַ/שְּׂעִירָֽתָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/026.yaml
  text: But Ehud escaped while they delayed[b][a], and he passed beyond the carved images and escaped to Seirah.
translation:
  language: te
  text: అయితే వారు ఆలస్యం చేస్తున్నంతలో ఏహూదు తప్పించుకున్నాడు. అతడు చెక్కిన ప్రతిమలను దాటి, శెయీరాకు తప్పించుకున్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נִמְלַט / וַיִּמָּלֵט
  choice: తప్పించుకున్నాడు
  rationale: మלט ధాతువు నిఫాల్ రూపం ఇక్కడ ప్రమాదం నుంచి విజయవంతంగా తప్పించుకోవడాన్ని సూచిస్తుంది. మూలంలోని పునరుక్తిని తెలుగులోనూ నిలిపి, మొదటి తప్పించుకోవడాన్నీ సురక్షిత ప్రదేశానికి చేరడాన్నీ అనుసంధానిస్తుంది.
- source_word: עַד הִתְמַהְמְהָם
  choice: వారు ఆలస్యం చేస్తున్నంతలో
  rationale: ఈ నిర్మాణం సేవకులు తటపటాయిస్తూ ఆలస్యం చేసిన కాలంలో ఏహూదు తప్పించుకున్నాడని సూచిస్తుంది. ఆధునిక తెలుగులో ఇది సహజంగా ఉండి కాలసంబంధాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: עָבַר אֶת הַפְּסִילִים
  choice: చెక్కిన ప్రతిమలను దాటి
  rationale: עבר ప్రయాణ సందర్భంలో ఒక గుర్తింపు స్థలాన్ని దాటి వెళ్లడాన్ని సూచిస్తుంది; פסילים యొక్క రూపార్థమైన ‘చెక్కిన ప్రతిమలు’ను నిలుపుతుంది.
- source_word: הַפְּסִילִים
  choice: చెక్కిన ప్రతిమలు
  rationale: ఈ పదం ఆరాధనకు సంబంధించిన విగ్రహాలను సూచించే అవకాశం ఉన్నప్పటికీ, రూపార్థాన్ని నిలిపే ఈ అనువాదం ఖచ్చితమైన స్వరూపాన్ని ముందుగానే నిర్ణయించదు.
- source_word: הַשְּׂעִירָתָה
  choice: శెయీరాకు
  rationale: ఇది స్థలనామం; దిశను సూచించే హీబ్రూ ప్రత్యయాన్ని తెలుగులో ‘-కు’తో సహజంగా వ్యక్తం చేశాం.
- source_word: וְ
  choice: అయితే
  rationale: ముందటి వచనంలో సేవకులు వేచి ఉండటానికి విరుద్ధంగా ఏహూదు తప్పించుకున్నాడనే కథన వ్యత్యాసాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
