id: JDG.3.3
reference: Judges 3:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: חֲמֵ֣שֶׁת סַרְנֵ֣י פְלִשְׁתִּ֗ים וְ/כָל הַֽ/כְּנַעֲנִי֙ וְ/הַ/צִּ֣ידֹנִ֔י וְ/הַ֣/חִוִּ֔י יֹשֵׁ֖ב הַ֣ר הַ/לְּבָנ֑וֹן מֵ/הַר֙ בַּ֣עַל חֶרְמ֔וֹן עַ֖ד לְב֥וֹא חֲמָֽת׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/003.yaml
  text: the five rulers of the Philistines[a], and all the Canaanites, and the Sidonians, and the Hivites who lived in the hill country of Lebanon, from Mount Baal-hermon as far as Lebo-hamath.
translation:
  language: te
  text: ఫిలిష్తీయుల ఐదుగురు పాలకులు, కనానీయులందరూ, సీదోనీయులు, మరియు లెబానోను పర్వత ప్రాంతంలో బయల్‌-హెర్మోను కొండ నుండి లెబో-హమాతు[a] వరకు నివసించిన హివ్వీయులు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “హమాతు ప్రవేశమార్గం వరకు.” హీబ్రూ పదబంధాన్ని ‘లెబో-హమాతు’ అనే స్థలనామంగానైనా, వివరణాత్మకంగానైనా అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: חֲמֵשֶׁת סַרְנֵי פְלִשְׁתִּים
  choice: ఫిలిష్తీయుల ఐదుగురు పాలకులు
  rationale: సַרְנֵי అనే పదం ఫిలిష్తీయుల ప్రత్యేక రాజకీయ నాయకులను సూచిస్తుంది. ఆధునిక తెలుగులో ‘పాలకులు’ స్పష్టంగా ఉండి, ‘ప్రభువులు’ అనే పదానికి రావచ్చే సామంత లేదా దైవిక భావాలను నివారిస్తుంది.
- source_word: וְכָל הַכְּנַעֲנִי
  choice: కనానీయులందరూ
  rationale: హీబ్రూలో ఏకవచన జాతివాచక రూపం సమూహార్థంలో ఉంది; తెలుగులో బహువచనం సహజంగా ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: וְהַצִּידֹנִי
  choice: సీదోనీయులు
  rationale: సమూహార్థక జాతివాచక ఏకవచనాన్ని సహజమైన తెలుగు బహువచన జాతిపేరుగా అనువదించాం.
- source_word: וְהַחִוִּי
  choice: హివ్వీయులు
  rationale: సమూహార్థక జాతివాచక ఏకవచనాన్ని తెలుగు వాడుకకు అనుగుణంగా బహువచనంలో ఇచ్చాం.
- source_word: יֹשֵׁב
  choice: నివసించిన
  rationale: ఈ కృదంతం హివ్వీయులను విశేషిస్తుంది; కథన సందర్భంలో తెలుగు సంబంధార్థక కృదంత రూపం సహజంగా ఉంటుంది.
- source_word: הַר הַלְּבָנוֹן
  choice: లెబానోను పర్వత ప్రాంతం
  rationale: అక్షరార్థంగా ‘లెబానోను పర్వతం’ అయినా, సందర్భంలో ఇది ఒక్క శిఖరంకన్నా పర్వత ప్రాంతాన్ని సూచిస్తుంది.
- source_word: מֵהַר בַּעַל חֶרְמוֹן
  choice: బయల్‌-హెర్మోను కొండ మొదలుకొని
  rationale: స్థలనామాన్ని లిప్యంతరీకరించి, מִן ప్రారంభ సరిహద్దును ‘మొదలుకొని’ అని సహజంగా వ్యక్తం చేశాం.
- source_word: עַד לְבוֹא חֲמָת
  choice: లెబో-హమాతు వరకు
  rationale: తెలిసిన భౌగోళిక స్థలనామంగా ప్రధాన పాఠ్యంలో లిప్యంతరీకరించాం; హీబ్రూ పదబంధానికి సాధ్యమైన వివరణాత్మక అర్థాన్ని పాదసూచికలో ఉంచాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి వాడబడింది. జాతిపేర్లు తెలుగు బైబిలు వాడుకకు దగ్గరగా లిప్యంతరీకరించబడ్డాయి; భౌగోళిక పదబంధంలోని నిజమైన సందిగ్ధత పాదసూచికలో నిలుపబడింది.
