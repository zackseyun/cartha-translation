source:
  edition: WLC
  text: וַ/יִּזְעֲק֣וּ בְנֵֽי יִשְׂרָאֵל֮ אֶל יְהוָה֒ וַ/יָּקֶם֩ יְהוָ֨ה לָ/הֶ֜ם מוֹשִׁ֗יעַ אֶת אֵה֤וּד בֶּן גֵּרָא֙ בֶּן הַ/יְמִינִ֔י אִ֥ישׁ אִטֵּ֖ר יַד יְמִינ֑/וֹ וַ/יִּשְׁלְח֨וּ בְנֵי יִשְׂרָאֵ֤ל בְּ/יָד/וֹ֙ מִנְחָ֔ה לְ/עֶגְל֖וֹן מֶ֥לֶךְ מוֹאָֽב־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/015.yaml
  text: Then the sons of Israel cried out to Yahweh[a], and Yahweh raised up for them a deliverer, Ehud son of Gera, a Benjaminite, a man hindered in his right hand. And the sons of Israel sent tribute by his hand to Eglon king of Moab.
translation:
  language: te
  text: అప్పుడు ఇశ్రాయేలు కుమారులు యహ్వేకు మొరపెట్టుకున్నారు; యహ్వే వారి కోసం ఒక రక్షకుణ్ణి లేవనెత్తాడు—గేరా కుమారుడైన ఏహూదును, బెన్యామీనీయుడైన, కుడిచేయి వాడటంలో పరిమితి గల వ్యక్తిని[a]. ఇశ్రాయేలు కుమారులు అతని ద్వారా మోయాబు రాజైన ఎగ్లోనుకు కప్పం పంపారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, సంప్రదాయ అనువాదంలో, “ఎడమచేతివాడు.” హీబ్రూ పదబంధం అక్షరార్థంగా ఏహూదు కుడిచేయి పరిమితమైందని లేదా నిరోధించబడిందని వర్ణిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְעֲקוּ
  choice: మొరపెట్టుకున్నారు
  rationale: ఆపదలో సహాయం కోరుతూ గట్టిగా వేడుకోవడం అనే זעק భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: హీబ్రూ బంధుత్వపూర్వక రూపాన్ని కాపాడే గౌరవప్రదమైన, అర్థమయ్యే అనువాదం.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవిక నామాన్ని బిరుదుతో భర్తీ చేయకుండా, హీబ్రూ చతురక్షర నామానికి తెలుగు లిప్యంతరీకరణగా ఇస్తుంది.
- source_word: וַיָּקֶם ... מוֹשִׁיעַ
  choice: ఒక రక్షకుణ్ణి లేవనెత్తాడు
  rationale: దేవుడు ఇశ్రాయేలును విడిపించడానికి ఒక మానవ ప్రతినిధిని ఏర్పరచిన భావాన్నీ, ‘లేవనెత్తడం’ అనే మూలభాషా రూపకాన్నీ కాపాడుతుంది.
- source_word: אֵהוּד בֶּן גֵּרָא
  choice: గేరా కుమారుడైన ఏహూదు
  rationale: వ్యక్తినామాలను తెలుగు బైబిలు శైలికి అనుగుణంగా లిప్యంతరీకరించి, తండ్రి-కుమార సంబంధాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: בֶּן הַיְמִינִי
  choice: బెన్యామీనీయుడు
  rationale: ఈ రూపం గోత్ర సంబంధాన్ని సూచిస్తుంది; తెలుగులో సహజమైన జాతివాచక రూపం.
- source_word: אִישׁ אִטֵּר יַד יְמִינוֹ
  choice: కుడిచేతి వాడకంలో పరిమితి ఉన్నవాడు
  rationale: హీబ్రూ వాక్యంలోని కుడిచేతి నిరోధం లేదా పరిమితి భావాన్ని నేరుగా ఉంచి, దానిని కేవలం ‘ఎడమచేతివాడు’ అని నిర్ణయించకుండా అస్పష్టతను కాపాడుతుంది.
- source_word: וַיִּשְׁלְחוּ ... בְּיָדוֹ
  choice: అతని చేత ... పంపారు
  rationale: ఏహూదు కప్పాన్ని తీసుకెళ్లిన ప్రతినిధి అనే భావంతో పాటు ‘అతని చేత’ అనే హీబ్రూ ప్రయోగాన్ని సహజమైన తెలుగులో కాపాడుతుంది.
- source_word: מִנְחָה
  choice: కప్పం
  rationale: లోబడిన ప్రజలు అధిపతి రాజుకు చెల్లించే రాజకీయ పన్ను లేదా సమర్పణ అనే సందర్భోచిత భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: לְעֶגְלוֹן מֶלֶךְ מוֹאָב
  choice: మోయాబు రాజైన ఎగ్లోనుకు
  rationale: రాజు పేరు, రాజ్యాన్ని సహజమైన తెలుగు సంబంధ నిర్మాణంలో అందిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవిక నామం
  choice: యహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠం వ్యక్తిగత దైవిక నామాన్ని నేరుగా వాడుతుంది. అందువల్ల దానిని సాధారణ బిరుదుగా మార్చకుండా తెలుగు లిప్యంతరీకరణగా ఉంచడం మూలానికి పారదర్శకంగా ఉంటుంది.
- issue: מוֹשִׁיעַ యొక్క భావం
  choice: రక్షకుడు
  alternative: విమోచకుడు
  rationale: ఇక్కడ ఏహూదు చారిత్రకంగా ప్రజలను శత్రు ఆధిపత్యం నుంచి కాపాడే మానవ ప్రతినిధి. ‘రక్షకుడు’ ఆ సందర్భాన్ని తెలియజేస్తుంది; అతనికి మరింత విస్తృతమైన సిద్ధాంతార్థాన్ని బలవంతంగా ఆపాదించదు.
- issue: ఏహూదు కుడిచేతి గురించిన వర్ణన
  choice: కుడిచేతి వాడకంలో పరిమితి ఉన్నవాడు
  alternative: ఎడమచేతివాడు
  rationale: మూల హీబ్రూ నేరుగా ‘ఎడమచేతివాడు’ అని చెప్పకుండా కుడిచేతి నిరోధాన్ని వర్ణిస్తుంది. ప్రధాన పాఠం ఆ ఉద్రిక్తతను కాపాడి, సంప్రదాయ అర్థాన్ని పాదసూచికలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథనశైలి వాడబడింది. మూలంలోని ‘ఇశ్రాయేలు కుమారులు,’ ‘లేవనెత్తాడు,’ ‘అతని చేత’ వంటి ముఖ్య రూపకాలను సాధ్యమైనంత పారదర్శకంగా ఉంచుతూ, వాక్యాలను సాధారణ పాఠకులకు సులభంగా చదవదగినవిగా విభజించాం. పాదసూచిక గుర్తు [a] సంబంధిత అస్పష్ట పదబంధం వద్దనే ఉంచబడింది.
