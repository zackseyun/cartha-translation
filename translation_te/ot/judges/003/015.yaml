revisions:
- from: అప్పుడు ఇశ్రాయేలు కుమారులు యహ్వేకు మొరపెట్టుకున్నారు. యహ్వే వారి కోసం ఒక రక్షకుణ్ణి లేవనెత్తాడు. అతడు గేరా కుమారుడైన ఏహూదు, బెన్యామీనీయుడు, కుడిచేతి వాడకంలో పరిమితి ఉన్నవాడు[a]. ఇశ్రాయేలు కుమారులు అతని చేత మోయాబు రాజైన ఎగ్లోనుకు కప్పం పంపారు.
  to: అప్పుడు ఇశ్రాయేలు కుమారులు యహ్వేకు మొరపెట్టుకున్నారు; యహ్వే వారి కోసం ఒక రక్షకుణ్ణి లేవనెత్తాడు—గేరా కుమారుడైన ఏహూదును, బెన్యామీనీయుడైన, కుడిచేయి వాడటంలో పరిమితి గల వ్యక్తిని[a]. ఇశ్రాయేలు కుమారులు అతని ద్వారా మోయాబు రాజైన ఎగ్లోనుకు కప్పం పంపారు.
  rationale: సవరణలు అర్థాన్ని మార్చవు. ఏహూదు కుడిచేయి గురించి హీబ్రూ ఉద్దేశపూర్వకంగా ఉంచిన అస్పష్టతను ప్రధాన పాఠంలో కాపాడుతూ, సంప్రదాయమైన ‘ఎడమచేతివాడు’ అర్థాన్ని పాదసూచికలోనే ఉంచాయి. పాదసూచిక వివరణను దాని ఖచ్చితమైన వ్యాకరణ పరిధికి తగినట్లుగా మార్చి, వాక్యనిర్మాణాన్ని మరింత సహజమైన ఆధునిక తెలుగు కథనశైలిలో అమర్చాం.
