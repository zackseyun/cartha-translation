source:
  edition: WLC
  text: וַֽ/יְהִי֙ כַּ/אֲשֶׁ֣ר כִּלָּ֔ה לְ/הַקְרִ֖יב אֶת הַ/מִּנְחָ֑ה וַ/יְשַׁלַּח֙ אֶת הָ/עָ֔ם נֹשְׂאֵ֖י הַ/מִּנְחָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/018.yaml
  text: And when he had finished presenting the tribute[a], he sent away the people who were carrying the tribute.
translation:
  language: te
  text: అతడు కప్పం[a] సమర్పించడం ముగించినప్పుడు, కప్పాన్ని మోసిన ప్రజలను పంపివేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘కానుక’ లేదా ‘అర్పణ’. ఇక్కడ హీబ్రూ పదం బలి అర్పణకన్నా పాలకునికి సమర్పించే కప్పాన్నే సూచిస్తున్నట్లు ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: ముగించినప్పుడు
  rationale: హీబ్రూ కథన సూత్రంలోని కాలసంబంధ మార్పును సహజమైన ఆధునిక తెలుగులో తెలిపేందుకు ‘అప్పుడు జరిగినది’ వంటి కృతక రూపాన్ని విడిచిపెట్టి కాలవాచక నిర్మాణాన్ని వాడాం.
- source_word: כִּלָּה
  choice: ముగించినప్పుడు
  rationale: క్రియకు ‘పూర్తిచేయడం, ముగించడం’ అనే భావం ఉంది; ప్రజలను పంపివేయడానికి ముందే సమర్పణ పూర్తయిందనే క్రమాన్ని ఈ రూపం స్పష్టం చేస్తుంది.
- source_word: לְהַקְרִיב
  choice: సమర్పించడం
  rationale: హిఫిల్ రూపం ఇక్కడ దగ్గరకు తీసుకురావడం లేదా అధికారికి అందించడం అనే భావంలో ఉంది. రాజకీయ సందర్భానికి ‘సమర్పించడం’ సరిపోతుంది; బలిపూజ భావాన్ని అనవసరంగా కలిగించదు.
- source_word: הַמִּנְחָה
  choice: కప్పం
  rationale: ఈ సందర్భంలో ఇది ఏగ్లోనుకు లోబడిన ప్రజలు చెల్లించే రాజకీయ కానుక లేదా పన్ను. ‘కప్పం’ ఆ భావాన్ని సంక్షిప్తంగా, సందర్భోచితంగా తెలియజేస్తుంది; పదపునరుక్తిని వచనంలో నిలిపాం.
- source_word: וַיְשַׁלַּח
  choice: పంపివేశాడు
  rationale: మూల క్రియలో పంపడం లేదా వెళ్లనివ్వడం అనే భావం ఉంది. ‘పంపివేశాడు’ ఆధునిక తెలుగులో సహజంగా ఉండి, వారు అక్కడి నుంచి వెళ్లారనే భావాన్ని కాపాడుతుంది.
- source_word: הָעָם
  choice: ప్రజలను
  rationale: హీబ్రూ పదం సాధారణంగా ‘ప్రజలు’ అని అర్థం. సందర్భం పురుషులను సూచించవచ్చుగానీ, మూలంలో లింగాన్ని ప్రత్యేకంగా పేర్కొననందున విస్తృతమైన పదాన్నే నిలిపాం.
- source_word: נֹשְׂאֵי הַמִּנְחָה
  choice: కప్పాన్ని మోసుకొచ్చిన
  rationale: భాగధాతు నిర్మాణం ఆ ప్రజలను వారి పాత్ర ద్వారా గుర్తిస్తుంది. వారు కప్పాన్ని అక్కడికి తీసుకొచ్చిన సందర్భాన్ని సహజ తెలుగులో తెలియజేయడానికి ఈ రూపాన్ని ఎంచుకున్నాం.
