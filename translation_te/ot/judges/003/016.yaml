  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. అరుదైన కొలతను అంచనా వేసి ప్రధాన పాఠ్యంలో నిర్దిష్టం చేయకుండా ‘గోమెదు’గా ఉంచి, దాని అనిశ్చితిని పాదసూచికలో వివరించాం.
