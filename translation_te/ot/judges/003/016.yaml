  text: Ehud made himself a sword with two edges[a], a cubit in length[b], and strapped it on under his clothes on his right thigh.
translation:
  language: te
  text: ఏహూదు తన కోసం రెండు అంచులకూ పదునున్న, ఒక గోమెదు పొడవుగల ఖడ్గాన్ని తయారుచేసుకున్నాడు. దాన్ని తన వస్త్రాల కింద తన కుడి తొడకు కట్టుకున్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ לוֹ
  choice: తన కోసం ... తయారుచేసుకున్నాడు
  rationale: עשה తో కూడిన לוֹ, ఏహూదు తన సొంత ఉపయోగం కోసం ఆయుధాన్ని తయారుచేసుకున్నాడనే భావాన్ని తెలియజేస్తుంది.
- source_word: חֶרֶב
  choice: ఖడ్గం
  rationale: חֶרֶבకు సాధారణ అర్థం ‘ఖడ్గం’. సందర్భంలో అది చిన్న ఆయుధమైనప్పటికీ, ‘బాకు’ అని మరీ నిర్దిష్టంగా అనువదించకుండా మూలపదపు విస్తృతార్థాన్ని నిలిపింది.
- source_word: וְלָהּ שְׁנֵי פֵיוֹת
  choice: రెండు వైపులా పదునుగల
  rationale: అక్షరార్థంగా ‘దానికి రెండు నోళ్లు’ అనే హీబ్రూ నుడికారం, రెండు అంచులకూ పదునున్న ఖడ్గాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో సహజంగా, స్పష్టంగా ఉండే రూపాన్ని ఎంచుకున్నాం.
- source_word: גֹּמֶד אָרְכָּהּ
  choice: ఒక గోమెదు పొడవైన
  rationale: גֹּמֶד అరుదైన, ఖచ్చితమైన పరిమాణం తెలియని కొలత. దానిని ‘మూర’ వంటి నిర్దిష్ట స్థానిక కొలతగా మార్చకుండా లిప్యంతరీకరించి, అనిశ్చితిని పాదసూచికలో నిలిపాం.
- source_word: וַיַּחְגֹּר אוֹתָהּ
  choice: దాన్ని ... కట్టుకున్నాడు
  rationale: חגר అంటే ఆయుధాన్ని నడుముకు లేదా శరీరానికి బిగించుకోవడం. ‘కట్టుకున్నాడు’ సాధారణ ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: מִתַּחַת לְמַדָּיו
  choice: తన వస్త్రాల కింద
  rationale: מַד ఇక్కడ దుస్తులు లేదా వస్త్రాలను సూచిస్తుంది. వస్త్ర రకాన్ని అనవసరంగా నిర్దిష్టం చేయకుండా బహువచన భావాన్ని నిలిపింది.
- source_word: עַל יֶרֶךְ יְמִינוֹ
  choice: కుడి తొడకు
  rationale: יָרֵךְ తొడ లేదా తుంటి ప్రాంతాన్ని సూచిస్తుంది. ఆయుధం కట్టుకున్న స్థానాన్ని ‘కుడి తొడకు’ నేరుగా తెలియజేస్తుంది.
