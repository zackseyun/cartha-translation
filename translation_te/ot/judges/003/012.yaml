id: JDG.3.12
reference: Judges 3:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּסִ֨פוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל לַ/עֲשׂ֥וֹת הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה וַ/יְחַזֵּ֨ק יְהוָ֜ה אֶת עֶגְל֤וֹן מֶֽלֶךְ מוֹאָב֙ עַל יִשְׂרָאֵ֔ל עַ֛ל כִּֽי עָשׂ֥וּ אֶת הָ/רַ֖ע בְּ/עֵינֵ֥י יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/012.yaml
  text: And the sons of Israel again did what was evil in the eyes of Yahweh[a], and Yahweh strengthened Eglon king of Moab against Israel, because they had done what was evil in the eyes of Yahweh.
translation:
  language: te
  text: ఇశ్రాయేలు ప్రజలు మళ్లీ యెహోవా దృష్టిలో చెడు చేశారు. అప్పుడు యెహోవా ఇశ్రాయేలుకు విరోధంగా మోయాబు రాజైన ఎగ్లోనును బలపరిచాడు, ఎందుకంటే వారు యెహోవా దృష్టిలో చెడు చేశారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּסִפוּ
  choice: మళ్లీ ... చేశారు
  rationale: יסף + క్రియార్థక రూపం ఇక్కడ పునరావృత చర్యను సూచిస్తుంది. న్యాయాధిపతులు గ్రంథంలోని పునరావర్తన చక్రాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు ప్రజలు
  rationale: అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులు’; అయితే సమూహమంతటినీ సూచించే హీబ్రూ జాతీయ ప్రయోగానికి ‘ఇశ్రాయేలు ప్రజలు’ సహజమైన, సమగ్ర తెలుగు సమానార్థకం.
- source_word: לַעֲשׂוֹת הָרַע
  choice: చెడ్డది చేశారు
  rationale: హీబ్రూ నిర్దిష్ట రూపాన్ని పూర్తిగా తొలగించకుండా, తెలుగులో సహజంగా ఉండే విధంగా నైతికంగా చెడ్డ కార్యాన్ని సూచిస్తుంది.
- source_word: בְּעֵינֵי יְהוָה
  choice: యెహోవా దృష్టిలో
  rationale: ‘కళ్లలో’ అనే హీబ్రూ రూపకానికి తెలుగులో స్థిరమైన, సులభంగా అర్థమయ్యే సమానార్థక ప్రయోగం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే రూపంలో వ్యక్తిగత నామంగా అందిస్తుంది.
- source_word: וַיְחַזֵּק
  choice: బలపరిచాడు
  rationale: పియేల్ రూపంలోని ప్రత్యక్ష కర్తృత్వాన్ని నిలుపుతుంది; ‘అనుమతించాడు’ లేదా ‘విజయం ఇచ్చాడు’ అని వివరణాత్మకంగా మార్చదు.
- source_word: אֶת עֶגְלוֹן מֶלֶךְ מוֹאָב
  choice: మోయాబు రాజైన ఎగ్లోనును
  rationale: హీబ్రూ సమానాధికార నిర్మాణాన్ని సహజమైన తెలుగు విశేషణ నిర్మాణంగా అందిస్తుంది.
- source_word: עַל יִשְׂרָאֵל
  choice: ఇశ్రాయేలుకు విరోధంగా
  rationale: ఈ శత్రుత్వ సందర్భంలో עַל వ్యతిరేకతను సూచిస్తుంది; ‘మీద’ కంటే భావం స్పష్టంగా ఉంటుంది.
- source_word: עַל כִּי
  choice: చేసినందున
  rationale: దేవుని చర్యకు కారణాన్ని తెలిపే సంయుక్త అవ్యయ భావాన్ని సహజమైన తెలుగు కారణార్థక రూపంలో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్ని ఉపయోగిస్తుంది. దానిని సాధారణ బిరుదుగా మార్చకుండా తెలుగులో గుర్తింపుపొందిన నామరూపాన్ని నిలుపుతుంది.
- issue: וַיְחַזֵּק יְהוָה אֶת עֶגְלוֹן లో దైవ కర్తృత్వం
  choice: యెహోవా ... ఎగ్లోనును ... బలపరిచాడు
  alternative: ఎగ్లోను బలపడడానికి యెహోవా అనుమతించాడు
  rationale: హీబ్రూ వాక్యం యెహోవాను ప్రత్యక్ష కర్తగా చూపుతుంది. దానివల్ల కలిగే వేదాంతపరమైన ఉద్రిక్తతను ‘అనుమతించాడు’ అంటూ సడలించకుండా నిలుపుతుంది.
- issue: చివరి కారణ వాక్యంలోని కాల సంబంధం
  choice: వారు ... చేసినందున
  alternative: వారు ... చేస్తూ ఉన్నందున
  rationale: עָשׂוּ సంపూర్ణ క్రియారూపం కారణమైన కార్యాన్ని సమగ్రంగా చూపుతుంది; తెలుగులో కారణార్థక భూతక్రియా రూపం దానిని సహజంగా తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన కథన శైలి. మూలంలోని పునరుక్తి మరియు యెహోవా ప్రత్యక్ష కర్తృత్వం ఉద్దేశపూర్వకంగా నిలుపబడ్డాయి. ఫుట్‌నోట్లు లేవు; అందువల్ల ప్రధాన పాఠ్యంలో గుర్తులు అవసరం లేదు.
