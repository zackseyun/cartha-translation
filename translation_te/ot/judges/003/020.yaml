base_translation:
  language: en
  yaml_path: translation/ot/judges/003/020.yaml
  text: Then Ehud came to him while he was sitting alone in his cool roof chamber[a], and Ehud said[c][b], “I have a word from God for you.” So he rose from his seat.
translation:
  language: te
  text: అప్పుడు ఏహూదు ఎగ్లోను దగ్గరికి వచ్చాడు. ఎగ్లోను తనకోసం ప్రత్యేకంగా ఉన్న చల్లని మేడగదిలో[a] ఒంటరిగా కూర్చుని ఉన్నాడు. ఏహూదు, “నీతో చెప్పడానికి దేవుని నుండి నాకు ఒక మాట[b] ఉంది” అన్నాడు. అప్పుడు ఎగ్లోను తన ఆసనం[c] మీద నుండి లేచాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “చల్లని పైగది.”
    reason: lexical_alternative
  - marker: b
    text: లేదా “దేవుని నుండి ఒక సందేశం.”
    reason: lexical_alternative
  - marker: c
    text: 'హీబ్రూ: “ఆసనం మీద నుండి”; సందర్భాన్ని బట్టి “కుర్చీ” లేదా “సింహాసనం” అని కూడా అనువదించవచ్చు.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּא
  choice: దగ్గరికి వచ్చినప్పుడు
  rationale: క్రియ రాకను లేదా చేరడాన్ని సూచిస్తుంది. తరువాతి నేపథ్య క్రియతో సహజంగా అనుసంధానించేందుకు కాలసూచక ఉపవాక్యంగా అనువదించబడింది.
- source_word: יֹשֵׁב
  choice: కూర్చుని ఉన్నాడు
  rationale: హీబ్రూ కృదంతం కొనసాగుతున్న నేపథ్య స్థితిని చూపుతుంది; తెలుగు సంయుక్త క్రియ అదే భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: עֲלִיַּת הַמְּקֵרָה
  choice: చల్లని మేడగది
  rationale: עֲלִיָּה పై అంతస్తు లేదా మేడమీద గదిని సూచిస్తుంది; הַמְּקֵרָה చల్లదనం లేదా గాలి ప్రసరణ కలిగిన గది అనే భావాన్ని సూచించే అవకాశం ఉంది. ఈ రెండింటినీ సంక్షిప్తంగా నిలుపుతుంది.
- source_word: אֲשֶׁר לוֹ לְבַדּוֹ
  choice: తనకోసం ప్రత్యేకంగా ఉన్న ... ఒంటరిగా
  rationale: ఈ పదబంధం గది ఎగ్లోను వ్యక్తిగత వినియోగానికి ఉన్నదనీ, అతడు అక్కడ ఒంటరిగా ఉన్నాడనీ నొక్కిచెబుతుంది.
- source_word: דְּבַר אֱלֹהִים
  choice: దేవుని నుండి ... ఒక మాట
  rationale: דָּבָר ‘మాట’ లేదా ‘సందేశం’ అని అర్థమవుతుంది. ప్రధాన పాఠంలో ‘మాట’ ఉంచడం హీబ్రూ రూపానికి దగ్గరగా ఉండగా, ‘దేవుని నుండి’ మూలాన్ని సహజ తెలుగులో స్పష్టం చేస్తుంది.
- source_word: אֱלֹהִים
  choice: దేవుడు
  rationale: రూపం బహువచనంగా కనిపించినా, ఈ నిర్మాణంలోను సందర్భంలోను ఏకవచనార్థమే సహజం.
- source_word: וַיָּקָם
  choice: లేచాడు
  rationale: ఈ క్రియ కూర్చున్న స్థితి నుండి లేవడాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ఇది సహజమైన, గౌరవప్రదమైన వర్ణన.
- source_word: מֵעַל הַכִּסֵּא
  choice: తన ఆసనం మీద నుండి
  rationale: כִּסֵּא అనేది ఆసనం, కుర్చీ లేదా సింహాసనం కావచ్చు. వ్యక్తిగత గది సందర్భంలో ‘ఆసనం’ పదం నిర్దిష్టతను అతిగా పెంచకుండా మూలంలోని విస్తృతార్థాన్ని కాపాడుతుంది.
theological_decisions:
- issue: ఏహూదు పలికిన మాటలో אֱלֹהִים అనువాదం
  choice: దేవుడు
  alternative: దేవతలు
  rationale: אֱלֹהִים రూపపరంగా బహువచనమైనా, హీబ్రూలో ఇశ్రాయేలు దేవునికి సాధారణంగా ఏకవచనార్థంలో వాడబడుతుంది. דְּבַר אֱלֹהִים నిర్మాణం మరియు కథా సందర్భం ‘దేవుడు’ అనే పఠనానికే బలమిస్తాయి. ఏహూదు మాటలోని ఉద్దేశాన్ని పాఠం ఎలా నివేదిస్తుందో అలాగే ఉంచి, అదనపు theological తీర్పు చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన కథనశైలిని ఉపయోగించాం. ఏహూదు, ఎగ్లోను అనే పేర్లను పునరుక్తి చేయడం ద్వారా హీబ్రూ సర్వనామాలను యథాతథంగా అనుసరించినప్పుడు తెలుగులో కలిగే కర్త-సందిగ్ధతను నివారించాం. భాష గౌరవప్రదంగా ఉన్నప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా ఉంచాం.
