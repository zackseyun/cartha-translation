id: JDG.3.8
reference: Judges 3:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּֽחַר אַ֤ף יְהוָה֙ בְּ/יִשְׂרָאֵ֔ל וַֽ/יִּמְכְּרֵ֗/ם בְּ/יַד֙ כּוּשַׁ֣ן רִשְׁעָתַ֔יִם מֶ֖לֶךְ אֲרַ֣ם נַהֲרָ֑יִם וַ/יַּעַבְד֧וּ בְנֵֽי יִשְׂרָאֵ֛ל אֶת כּוּשַׁ֥ן רִשְׁעָתַ֖יִם שְׁמֹנֶ֥ה שָׁנִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/008.yaml
  text: So the anger of Yahweh burned against Israel[a], and he sold them into the hand of Cushan-rishathaim king of Aram-naharaim[b]. And the sons of Israel served Cushan-rishathaim eight years.
translation:
  language: te
  text: కాబట్టి యహ్వే కోపం ఇశ్రాయేలు మీద మండింది. ఆయన వారిని అరామ్-నహరయిమ్[a] రాజైన కూషన్-రిషాతయిమ్ చేతికి అమ్మివేశాడు. ఇశ్రాయేలు కుమారులు[b] కూషన్-రిషాతయిమ్‌కు ఎనిమిది సంవత్సరాలు సేవ చేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘మెసొపొటేమియా’; హీబ్రూలో ‘అరామ్-నహరయిమ్,’ సంప్రదాయంగా ‘రెండు నదుల అరామ్’గా అర్థం చేసుకుంటారు.
    reason: alternative_reading
  - marker: b
    text: ‘ఇశ్రాయేలు కుమారులు’ అనేది హీబ్రూ పదబంధానికి అక్షరార్థ రూపం; ఇది సాధారణంగా ఇశ్రాయేలీయులందరినీ సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: కోపం ... మండింది
  rationale: హీబ్రూ నుడికారంలోని ‘కోపం మండడం’ అనే సజీవ రూపకాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవనామమైన టెట్రాగ్రామటన్‌ను బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పండిత లిప్యంతరీకరణ ‘Yahweh’కు అనుగుణంగా తెలుగులో అందిస్తుంది.
- source_word: וַיִּמְכְּרֵם
  choice: వారిని ... అమ్మివేశాడు
  rationale: מכר అనే క్రియ యొక్క ప్రాథమిక అర్థమైన ‘అమ్ము’ను, న్యాయతీర్పులో శత్రువు ఆధీనానికి అప్పగించడమనే బలమైన రూపకంతో సహా నిలుపుతుంది.
- source_word: בְּיַד
  choice: చేతికి
  rationale: అధికారం లేదా ఆధీనాన్ని సూచించే హీబ్రూ ‘చేతిలో/చేతికి’ అనే రూపకాన్ని తెలుగులో సంక్షిప్తంగా నిలుపుతుంది.
- source_word: כּוּשַׁן רִשְׁעָתַיִם
  choice: కూషన్-రిషాతయిమ్
  rationale: వ్యక్తినామాన్ని అనువదించకుండా లిప్యంతరీకరించింది; హైఫన్ దీనిని ఒకే సంయుక్త నామంగా గుర్తించేందుకు సహాయపడుతుంది.
- source_word: אֲרַם נַהֲרָיִם
  choice: అరామ్-నహరయిమ్
  rationale: హీబ్రూ స్థలనామాన్ని ప్రధాన పాఠ్యంలో లిప్యంతరీకరించి, సంప్రదాయ అర్థవ్యాఖ్యను పాదసూచికలో ఇస్తుంది.
- source_word: וַיַּעַבְדוּ
  choice: సేవచేశారు
  rationale: עבד అనే క్రియ యొక్క ప్రత్యక్ష అర్థాన్ని నిలుపుతుంది; సందర్భంలో ఇది రాజకీయ అధీనతలో సేవ చేయడాన్ని సూచిస్తుంది.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: హీబ్రూలోని స్థిర పదబంధాన్ని సన్నిహితంగా ప్రతిబింబిస్తుంది; అది మొత్తం ఇశ్రాయేలు సమాజాన్ని సూచించగలదని పాదసూచిక స్పష్టం చేస్తుంది.
- source_word: שְׁמֹנֶה שָׁנִים
  choice: ఎనిమిది సంవత్సరాలు
  rationale: కాలవ్యవధిని నేరుగా, సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామాన్ని ఎలా అందించాలి
  choice: యహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠ్యం వ్యక్తిగత దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది. ‘యహ్వే’ దానిని బిరుదుగా మార్చకుండా నిలుపుతుంది; ‘యెహోవా’ సంప్రదాయ రూపమైనప్పటికీ ‘Jehovah’ ఉచ్చారణ సంప్రదాయానికి దగ్గరగా ఉంటుంది.
- issue: בְנֵי יִשְׂרָאֵל అనే సమూహపదం
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలీయులు / ఇశ్రాయేలు ప్రజలు
  rationale: ప్రధాన పాఠ్యం మూలంలోని పుంలింగ బంధుత్వ రూపాన్ని నిలుపుతుంది. అయితే సందర్భంలో అది పురుషులను మాత్రమే కాక ఒడంబడిక సమాజమంతటినీ సూచించే స్థిర నామమై ఉండగలదనే విస్తృతార్థాన్ని పాదసూచికలో పరిరక్షించింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సులభంగా అర్థమయ్యే వాక్యనిర్మాణం వాడబడింది. ‘కోపం మండింది,’ ‘చేతికి అమ్మివేశాడు’ అనే మూల రూపకాలు నిలుపబడ్డాయి. వ్యక్తి, స్థలనామాలు హీబ్రూ రూపాలకు దగ్గరగా లిప్యంతరీకరించబడ్డాయి; వివరణ అవసరమైన చోట మాత్రమే పాదసూచికలు ఇచ్చబడ్డాయి.
