source:
  edition: WLC
  text: וַ/יְהִ֣י בְּ/בוֹא֔/וֹ וַ/יִּתְקַ֥ע בַּ/שּׁוֹפָ֖ר בְּ/הַ֣ר אֶפְרָ֑יִם וַ/יֵּרְד֨וּ עִמּ֧/וֹ בְנֵֽי יִשְׂרָאֵ֛ל מִן הָ/הָ֖ר וְ/ה֥וּא לִ/פְנֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/027.yaml
  text: And when he arrived[a], he blew the trumpet in the hill country of Ephraim, and the sons of Israel went down with him from the hill country[b], and he was before them.
translation:
  language: te
  text: అతడు వచ్చినప్పుడు, ఎఫ్రాయిము కొండప్రాంతంలో కొమ్ముబూర ఊదాడు. ఇశ్రాయేలీయులు అతనితో కలిసి కొండప్రాంతం నుండి దిగివచ్చారు; అతడు వారి ముందు ఉన్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי בְּבוֹאוֹ
  choice: అతడు వచ్చినప్పుడు
  rationale: ఈ హీబ్రూ నిర్మాణం కథనంలో కాలసంబంధ మార్పును సూచిస్తుంది. ‘అతడు వచ్చినప్పుడు’ అనేది ‘అప్పుడు ఇలా జరిగింది’ అనే హీబ్రూ సూత్రాన్ని కృత్రిమంగా అనుకరించకుండా సహజమైన తెలుగులో క్రమాన్ని నిలుపుతుంది.
- source_word: וַיִּתְקַע בַּשּׁוֹפָר
  choice: కొమ్ముబూర ఊదాడు
  rationale: שׁוֹפָר అనేది సంకేతం ఇవ్వడానికి ఊదే కొమ్ముతో చేసిన బూర. ‘కొమ్ముబూర’ సాధారణ ‘బూర’ కంటే మూలపదంలోని వాద్య స్వరూపాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: בְּהַר אֶפְרָיִם
  choice: ఎఫ్రాయిము కొండప్రాంతంలో
  rationale: ఈ భౌగోళిక ప్రయోగంలో הַר ఒకే కొండను కాకుండా ఎఫ్రాయిము ఉన్నతభూములు లేదా కొండప్రాంతాన్ని సూచిస్తుంది.
- source_word: וַיֵּרְדוּ עִמּוֹ בְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులు అతనితో కలిసి దిగివచ్చారు
  rationale: בְנֵי יִשְׂרָאֵל అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులు’ అయినా, ఇక్కడ ఇశ్రాయేలు ప్రజలను—సందర్భంలో సమీకరించబడిన యోధులను—సూచించే జాతీయ సమూహనామం. ‘ఇశ్రాయేలీయులు’ ఆధునిక తెలుగులో సహజంగా అదే భావాన్ని అందిస్తుంది.
- source_word: מִן הָהָר
  choice: కొండప్రాంతం నుండి
  rationale: ముందు ప్రస్తావించిన ఎఫ్రాయిము కొండప్రాంతాన్నే తిరిగి సూచిస్తుంది; అందువల్ల ఏక కొండ అనే భావం రాకుండా ప్రాంతీయ అర్థం నిలుపబడింది.
- source_word: וְהוּא לִפְנֵיהֶם
  choice: అతడు వారి ముందు ఉన్నాడు
  rationale: హీబ్రూ వాక్యం అతని స్థానం మరియు నాయకత్వ సూచనను కలిపి ఉంచుతుంది. ‘వారిని నడిపించాడు’ అని స్పష్టీకరించడం కంటే ఈ రూపం మూలంలోని ఉద్దేశపూర్వక సంక్షిప్తతను, భావవిస్తృతిని కాపాడుతుంది.
theological_decisions:
- issue: בְנֵי יִשְׂרָאֵל అనే లింగసూచక సమూహప్రయోగం
  choice: ఇశ్రాయేలీయులు
  alternative: ఇశ్రాయేలు కుమారులు
  rationale: ఈ సందర్భంలో పదబంధం వ్యక్తిగత వంశపుత్రులను వేరు చేసి చెప్పడం కాకుండా ఇశ్రాయేలు సమూహాన్ని, ముఖ్యంగా సమీకరించబడిన బలగాన్ని సూచిస్తుంది. సహజమైన తెలుగు జాతీయ సమూహనామం మూల ఉద్దేశాన్ని తెలియజేస్తుంది; పాఠ్యంలో లేని సిద్ధాంతపరమైన లింగనిర్ణయాన్ని బలవంతంగా చేర్చదు.
- issue: וְהוּא לִפְנֵיהֶם లో నాయకత్వ సూచన
  choice: అతడు వారి ముందు ఉన్నాడు
  alternative: అతడు వారిని నడిపించాడు
  rationale: మూలపాఠం నాయకత్వాన్ని సూచించినప్పటికీ దానిని నేరుగా క్రియారూపంలో నిర్ధారించదు. స్థానం మరియు నాయకత్వం రెండూ వినిపించేలా సన్నిహిత రూపాన్ని ఉంచడం ద్వారా భావసందిగ్ధతను పరిష్కరించకుండా కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. భౌగోళిక పదబంధం ప్రాంతీయ అర్థంతో అనువదించబడింది; చివరి ఉపవాక్యంలో మూలంలోని సంక్షిప్తతను నిలుపుతూ అతని ముందున్న స్థానం మరియు నాయకత్వ సూచన రెండూ తెరిచి ఉంచబడ్డాయి.
