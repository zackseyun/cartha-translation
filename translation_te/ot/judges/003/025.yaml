  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు సులభంగా అర్థమయ్యేలా, గంభీరమైన కథన శైలిని ఉపయోగించాం. ‘ఇదిగో’ ద్వారా హీబ్రూ కథనంలోని ఆకస్మికతను నిలిపాం. ప్రధాన పాఠంలోని ప్రతి పాదసూచిక గుర్తు సంబంధిత పదబంధం వద్ద ఉంచబడింది.
