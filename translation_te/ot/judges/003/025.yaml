source:
  edition: WLC
  text: וַ/יָּחִ֣ילוּ עַד בּ֔וֹשׁ וְ/הְנֵּ֛ה אֵינֶ֥/נּוּ פֹתֵ֖חַ דַּלְת֣וֹת הָֽ/עֲלִיָּ֑ה וַ/יִּקְח֤וּ אֶת הַ/מַּפְתֵּ֨חַ֙ וַ/יִּפְתָּ֔חוּ וְ/הִנֵּה֙ אֲדֹ֣נֵי/הֶ֔ם נֹפֵ֥ל אַ֖רְצָ/ה מֵֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/025.yaml
  text: And they waited until they were embarrassed[a], and behold, he still was not opening the doors of the upper room. So they took the key and opened them, and behold, their master had fallen to the floor[c][b], dead.
translation:
  language: te
  text: వారు సిగ్గుపడేంతవరకు వేచి చూశారు.[a] ఇదిగో, అతడు మేడగది[b] తలుపులు తెరవడం లేదు. కాబట్టి వారు తాళంచెవి తీసుకొని తలుపులు తెరిచారు. ఇదిగో, వారి యజమాని[c] నేలమీద పడి చనిపోయి ఉన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వారికి ఇబ్బందిగా అనిపించేంతవరకు.’ హీబ్రూ ప్రయోగం సిగ్గును లేదా సామాజిక ఇబ్బందిని సూచించవచ్చు; ఇక్కడ వారు చాలాసేపు వేచి ఉండడం ఇబ్బందికరంగా మారిందనే భావం ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘మేడగది’ అంటే పై అంతస్తులోని గది; ‘పైగది’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘వారి ప్రభువు.’ ఇక్కడ ఈ పదం వారి మానవ అధిపతియైన ఎగ్లోనును సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּחִילוּ
  choice: వేచి చూశారు
  rationale: సేవకులు తలుపుల బయట నిరీక్షించడాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: עַד בּוֹשׁ
  choice: సిగ్గుపడేంతవరకు
  rationale: హీబ్రూ ప్రయోగంలోని సిగ్గు లేదా సామాజిక ఇబ్బంది అనే భావవిస్తృతిని నిలుపుతుంది; సందర్భంలో వారి నిరీక్షణ ఇబ్బందికరంగా మారిందనే భావం ఉండవచ్చు.
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: రెండుసార్లు వచ్చే ఆకస్మిక కథన మలుపును, దృశ్య స్పష్టతను నిలుపుతుంది.
- source_word: אֵינֶנּוּ פֹתֵחַ
  choice: అతడు ... తెరవడం లేదు
  rationale: ఆ సమయంలో కొనసాగుతున్న తెరవకపోవడాన్ని సహజంగా వ్యక్తం చేస్తుంది; మూలంలో స్పష్టంగా లేని ‘ఇంకా’ అనే పదాన్ని చేర్చదు.
- source_word: דַּלְתוֹת הָעֲלִיָּה
  choice: మేడగది తలుపులు
  rationale: עֲלִיָּה అనే పై అంతస్తు గది భావాన్ని సంక్షిప్తమైన, సాధారణ తెలుగులో అందిస్తుంది; బహువచనమైన ‘తలుపులు’ను నిలుపుతుంది.
- source_word: הַמַּפְתֵּחַ
  choice: తాళంచెవి
  rationale: తాళం తెరవడానికి ఉపయోగించే keyకు స్పష్టమైన ప్రామాణిక తెలుగు పదం.
- source_word: וַיִּפְתָּחוּ
  choice: తలుపులు తెరిచారు
  rationale: హీబ్రూలో కర్మ సందర్భం ద్వారా తెలిసినా, తెలుగులో స్పష్టత కోసం ‘తలుపులు’ను పునరుక్తి చేసింది.
- source_word: אֲדֹנֵיהֶם
  choice: వారి యజమాని
  rationale: ఇక్కడ దైవ బిరుదు కాదు, సేవకుల మానవ అధిపతియైన ఎగ్లోనును సూచిస్తుంది.
- source_word: נֹפֵל אַרְצָה
  choice: నేలమీద పడి ... ఉన్నాడు
  rationale: తలుపులు తెరిచినప్పుడు వారు కనుగొన్న శరీర స్థితిని తెలియజేస్తూ, אַרְצָהను నేరుగా ‘నేలమీద’గా అందిస్తుంది.
- source_word: מֵת
  choice: చనిపోయి
  rationale: వారు కనుగొన్నప్పుడు ఎగ్లోను మృతుడై ఉన్నాడనే స్థితిని సహజమైన తెలుగులో తెలియజేస్తుంది.
