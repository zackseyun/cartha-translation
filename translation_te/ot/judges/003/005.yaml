base_translation:
  language: en
  yaml_path: translation/ot/judges/003/005.yaml
  text: And the sons of Israel lived among the Canaanites[a], the Hittites, the Amorites, the Perizzites, the Hivites, and the Jebusites.
translation:
  language: te
  text: ఇశ్రాయేలు కుమారులు కనానీయులు, హిత్తీయులు, అమోరీయులు, పెరిజ్జీయులు, హివ్వీయులు, యెబూసీయుల మధ్య నివసించారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ మూలంలో ‘ఇశ్రాయేలు కుమారులు.’ సందర్భానుసారంగా దీనిని ‘ఇశ్రాయేలీయులు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: בְּנֵי అనే పుంలింగ బహువచన బంధుత్వ పదానికి సమీపమైన అర్థాన్ని నిలుపుతూ, ఆధునిక తెలుగులో సహజంగా ఉండే రూపాన్ని ఎంచుకున్నాం.
- source_word: יָשְׁבוּ
  choice: నివసించారు
  rationale: ఈ సందర్భంలో ישׁב నిరంతర నివాసాన్ని సూచిస్తుంది; ‘నివసించారు’ ఆధునిక, గౌరవప్రదమైన తెలుగు.
- source_word: בְּקֶרֶב
  choice: మధ్య
  rationale: ప్రజల నడుమ నివసించడాన్ని సహజంగా తెలియజేస్తుంది; ‘నడుమ’ కూడా సాధ్యమైన ప్రత్యామ్నాయం.
- source_word: הַכְּנַעֲנִי ... הַיְבוּסִי
  choice: కనానీయులు ... యెబూసీయులు
  rationale: హీబ్రూలో ఏకవచన రూపాల్లో ఉన్న ఈ జాతినామాలు సమూహార్థకాలు; తెలుగులో ప్రజాసమూహాలను సూచించేందుకు బహువచన రూపాలు సహజం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన శైలి పాటించబడింది. జాతినామాలు తెలుగు బైబిలు వాడుకకు అనుగుణమైన లిప్యంతరీకరణలతో ఇవ్వబడ్డాయి.
