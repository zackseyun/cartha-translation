source:
  edition: WLC
  text: וְ/ה֣וּא שָׁ֗ב מִן הַ/פְּסִילִים֙ אֲשֶׁ֣ר אֶת הַ/גִּלְגָּ֔ל וַ/יֹּ֕אמֶר דְּבַר סֵ֥תֶר לִ֛/י אֵלֶ֖י/ךָ הַ/מֶּ֑לֶךְ וַ/יֹּ֣אמֶר הָ֔ס וַ/יֵּֽצְאוּ֙ מֵֽ/עָלָ֔י/ו כָּל הָ/עֹמְדִ֖ים עָלָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/019.yaml
  text: But he himself turned back from the carved images that were near Gilgal and said[a], “I have a secret message for you, O king.” And he said[c][b], “Silence.” Then all who were standing by him went out from his presence.
translation:
  language: te
  text: అయితే అతడు గిల్గాలు దగ్గర ఉన్న చెక్కిన ప్రతిమల[a] వద్ద నుంచి వెనక్కి తిరిగి వచ్చి, “రాజా, నీకు చెప్పవలసిన ఒక రహస్య విషయం[b] నా దగ్గర ఉంది” అన్నాడు. రాజు, “నిశ్శబ్దం!” అన్నాడు. అప్పుడు అతని దగ్గర నిలబడి ఉన్నవారందరూ అతని సన్నిధి నుంచి బయటికి వెళ్లిపోయారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “విగ్రహాల.” హెబ్రీ పదం తరచుగా ఆరాధనకు సంబంధించిన చెక్కిన ప్రతిమలను సూచిస్తుంది. “గిల్గాలు దగ్గర” అనే స్థలవాచక పదబంధాన్ని “గిల్గాలు వద్ద” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా “ఒక రహస్య సందేశం,” “ఒక రహస్య మాట,” లేదా “ఒక వ్యక్తిగత విషయం.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁב
  choice: వెనక్కి తిరిగి వచ్చి
  rationale: క్రియ తిరిగి రావడం లేదా ప్రయాణ దిశను మార్చుకోవడం సూచిస్తుంది; ఏహూదు వెనుదిరిగిన కథన కదలికను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: הַפְּסִילִים
  choice: చెక్కిన ప్రతిమలు
  rationale: ఈ పదం చెక్కిన రూపాలను, తరచుగా ఆరాధనకు సంబంధించిన విగ్రహాలను సూచిస్తుంది. ప్రధాన పాఠంలో స్పష్టమైన భౌతిక అర్థాన్ని ఉంచి, ‘విగ్రహాలు’ అనే ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: אֲשֶׁר אֶת־הַגִּלְגָּל
  choice: గిల్గాలు దగ్గర ఉన్న
  rationale: సంక్షిప్తమైన హెబ్రీ స్థలవాచక నిర్మాణం గిల్గాలుతో సమీపం లేదా అక్కడి స్థానాన్ని సూచించవచ్చు; ‘దగ్గర’ సహజంగా ఉండి ఈ సంబంధాన్ని తెలియజేస్తుంది.
- source_word: דְּבַר סֵתֶר
  choice: రహస్యంగా చెప్పాల్సిన విషయం
  rationale: דבר అంటే మాట, సందేశం లేదా విషయం; סתר అంటే రహస్యమైనది. తెలుగు రాజసభ సందర్భంలో ఈ రూపం సహజంగా ఉండి, విషయం స్వరూపాన్ని అనవసరంగా నిర్దిష్టం చేయదు.
- source_word: לִי אֵלֶיךָ
  choice: నీతో ... నాకు ఉంది
  rationale: మూలంలోని మొదటి పురుష స్వాధీన భావాన్నీ, రాజువైపు దిశను సూచించే భావాన్నీ సహజమైన తెలుగు వాక్య నిర్మాణంలో నిలుపుతుంది.
- source_word: הַמֶּלֶךְ
  choice: రాజా
  rationale: ప్రత్యక్ష సంబోధనకు ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన రూపం.
- source_word: הָס
  choice: నిశ్శబ్దం!
  rationale: మౌనంగా ఉండమనే అకస్మాత్తైన, సంక్షిప్త ఆజ్ఞను నిలుపుతుంది.
- source_word: כָּל הָעֹמְדִים עָלָיו
  choice: అతని దగ్గర నిలబడి ఉన్నవారందరూ
  rationale: రాజు దగ్గర నిలిచి సేవలో ఉన్న పరివారాన్ని మూలానికి దగ్గరగా, అర్థమయ్యే రీతిలో వ్యక్తం చేస్తుంది.
- source_word: מֵעָלָיו
  choice: అతని సన్నిధి నుంచి
  rationale: అక్షరార్థంగా అతని పక్కనుండి తొలగిపోవడాన్ని, రాజసభ సందర్భంలో అతని సమక్షం విడిచి వెళ్లడంగా తెలియజేస్తుంది.
theological_decisions: []
