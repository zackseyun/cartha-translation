  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. రాజసంబోధనకు ‘రాజా’ వాడబడింది; హָס యొక్క హఠాత్తైన స్వరాన్ని ‘నిశ్శబ్దం!’ నిలుపుతుంది. ప్రధాన పాఠంలోని ప్రతి పాదసూచిక గుర్తు [a], [b] సంబంధిత స్థానంలో ఉంది.
