source:
  edition: WLC
  text: וְ/אַחֲרָ֤י/ו הָיָה֙ שַׁמְגַּ֣ר בֶּן עֲנָ֔ת וַ/יַּ֤ךְ אֶת פְּלִשְׁתִּים֙ שֵֽׁשׁ מֵא֣וֹת אִ֔ישׁ בְּ/מַלְמַ֖ד הַ/בָּקָ֑ר וַ/יֹּ֥שַׁע גַּם ה֖וּא אֶת יִשְׂרָאֵֽל־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/031.yaml
  text: After him was Shamgar son of Anath[a], and he struck down six hundred Philistines with an ox goad[b]; he too saved Israel.
translation:
  language: te
  text: అతని తరువాత అనాతు కుమారుడైన షమ్గరు ఉన్నాడు. అతడు ఎద్దులను తోలే ముల్లుకర్రతో[a] ఆరువందల మంది ఫిలిష్తీయులను కొట్టివేశాడు; అతడు కూడా ఇశ్రాయేలును రక్షించాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ఎద్దులను తోలే ముల్లుకర్ర’ అంటే పశువులను నడిపించడానికి ఉపయోగించే మొనగల కర్ర.
    reason: cultural_note
  - marker: b
    text: లేదా ‘విడిపించాడు.’ హీబ్రూ క్రియ సైనిక అపాయం నుంచి కాపాడడం లేదా విముక్తి కలిగించడం అనే భావాన్ని ఇవ్వగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחֲרָיו
  choice: అతని తరువాత
  rationale: ముందటి న్యాయాధిపతిని సూచించే సర్వనామ సంబంధాన్ని నిలుపుతూ, మూలంలో లేని పేరును చేర్చదు.
- source_word: הָיָה
  choice: వచ్చాడు
  rationale: తరువాతి వ్యక్తిని కథలో పరిచయం చేసే హీబ్రూ ప్రయోగాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; నాయకుడయ్యాడు వంటి అదనపు భావాన్ని చేర్చదు.
- source_word: שַׁמְגַּר בֶּן־עֲנָת
  choice: అనాతు కుమారుడైన షమ్గరు
  rationale: పేరు, పితృనామ రూపాన్ని యథాతథంగా ఉంచుతుంది; అది నిజమైన పితృనామమా లేక బిరుదా అనే అనిశ్చితిని పరిష్కరించదు.
- source_word: וַיַּךְ
  choice: హతమార్చాడు
  rationale: యుద్ధ సందర్భంలో נכה సూచించే ప్రాణాంతకంగా కొట్టివేయడం అనే భావాన్ని స్పష్టంగా, గౌరవప్రదమైన తెలుగులో తెలియజేస్తుంది.
- source_word: שֵׁשׁ מֵאוֹת אִישׁ ... פְּלִשְׁתִּים
  choice: ఆరువందల మంది ఫిలిష్తీయులను
  rationale: లెక్కించబడిన వ్యక్తులను సూచించే אִישׁ భావాన్ని సహజమైన తెలుగు సంఖ్యా నిర్మాణంలో నిలుపుతుంది.
- source_word: בְּמַלְמַד הַבָּקָר
  choice: ఎద్దులను తోలే ముల్లుకర్రతో
  rationale: పశువులను నడిపించడానికి ఉపయోగించే మొనగల వ్యవసాయ పనిముట్టును సాధారణ పాఠకునికి అర్థమయ్యే రీతిలో తెలియజేస్తుంది.
- source_word: וַיֹּשַׁע
  choice: రక్షించాడు
  rationale: న్యాయాధిపతుల గ్రంథంలోని సైనిక అపాయం నుంచి కాపాడడం లేదా విడిపించడం అనే విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: גַּם הוּא
  choice: అతడు కూడా
  rationale: షమ్గరు కూడా ఇశ్రాయేలును రక్షించిన మరో వ్యక్తి అనే కూడిక ఉద్ఘాటనను నిలుపుతుంది.
theological_decisions:
- issue: షమ్గరు చేసిన రక్షణ స్వభావం
  choice: అతడు కూడా ఇశ్రాయేలును రక్షించాడు
  alternative: అతడు కూడా ఇశ్రాయేలును విడిపించాడు
  rationale: వచనం షమ్గరు ద్వారా నిజమైన రక్షణ కలిగిందని చెబుతుంది గాని, దాని పరిధి లేదా కాలవ్యవధిని వివరించదు. ‘రక్షించాడు’ మూల క్రియ యొక్క విస్తృతిని నిలుపుతుంది; సైనిక విముక్తి భావాన్ని ప్రత్యామ్నాయంగా పాదసూచికలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకునికి అర్థమయ్యేలా సహజంగా, అయితే కథనానికి తగిన గౌరవప్రదమైన శైలిలో రూపొందించబడింది. మూలంలోని సంక్షిప్తతను నిలుపుతూ అవసరమైన సాంస్కృతిక వివరణను మాత్రమే పాదసూచికలో ఇచ్చింది.
