  yaml_path: translation/ot/judges/003/011.yaml
  text: So the land had rest for forty years. Then Othniel son of Kenaz died.
translation:
  language: te
  text: అలా ఆ దేశానికి నలభై సంవత్సరాలు విశ్రాంతి కలిగింది. తరువాత కెనజు కుమారుడైన ఒత్నీయేలు చనిపోయాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּשְׁקֹט
  choice: విశ్రాంతిగా ఉంది
  rationale: שׁקט అంటే ప్రశాంతంగా, కలత లేకుండా, విశ్రాంతిలో ఉండడం. న్యాయాధిపతులు గ్రంథంలోని విమోచనానంతర సందర్భంలో ఇది అణచివేత లేదా యుద్ధం లేని కాలాన్ని సూచిస్తుంది; ‘విశ్రాంతిగా ఉంది’ ఆ భావాన్ని అతిగా విస్తరించకుండా సహజంగా తెలియజేస్తుంది.
- source_word: הָאָרֶץ
  choice: దేశం
  rationale: ఈ సందర్భంలో אֶרֶץ భూమండలాన్ని కాక ఇశ్రాయేలు దేశాన్ని లేదా దాని ప్రదేశాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘దేశం’ సహజంగా, సందర్భోచితంగా ఉంది.
- source_word: אַרְבָּעִים שָׁנָה
  choice: నలభై సంవత్సరాలు
  rationale: ఇది కాలవ్యవధిని తెలిపే ప్రయోగం. తెలుగులో ప్రత్యేక విభక్తి లేకుండానే ‘నలభై సంవత్సరాలు’ అనే రూపం వ్యవధిని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וַיָּמָת
  choice: చనిపోయాడు
  rationale: మూల క్రియ మరణాన్ని సూటిగా తెలియజేస్తుంది. ముందున్న waw కథనాన్ని ముందుకు నడిపిస్తుంది; దానిని ‘ఆ తరువాత’ ద్వారా సహజ తెలుగు కథన క్రమంగా వ్యక్తం చేశాం.
- source_word: עָתְנִיאֵל
  choice: ఒత్నీయేలు
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగులో పరిచితమైన బైబిలు లిప్యంతరీకరణకు దగ్గరగా అందించాం.
- source_word: בֶּן קְנַז
  choice: కనజు కుమారుడైన
  rationale: ఈ నిర్మాణం ఒత్నీయేలు వంశసంబంధాన్ని గుర్తిస్తుంది. తెలుగు వాక్యనిర్మాణంలో ‘కనజు కుమారుడైన’ స్పష్టంగా, సహజంగా ఉంటుంది.
