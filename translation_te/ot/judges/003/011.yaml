revisions:
- from: అప్పుడు దేశం నలభై సంవత్సరాలు విశ్రాంతిగా ఉంది. ఆ తరువాత కనజు కుమారుడైన ఒత్నీయేలు చనిపోయాడు.
  to: అలా ఆ దేశానికి నలభై సంవత్సరాలు విశ్రాంతి కలిగింది. తరువాత కెనజు కుమారుడైన ఒత్నీయేలు చనిపోయాడు.
  rationale: The revision preserves the source’s narrative sequence, the forty-year duration, and the restrained sense of peace/rest. It improves Telugu idiom and corrects the transliteration of Kenaz without adding interpretive content.
  reviewer_model: gpt-5.6-terra
