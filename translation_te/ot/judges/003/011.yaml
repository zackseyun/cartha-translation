translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. మొదటి wawను ‘అప్పుడు’గా, రెండవదాన్ని ‘ఆ తరువాత’గా అందించి సంఘటనల క్రమాన్ని స్పష్టం చేశాం; మూలంలో లేని సంపూర్ణ శ్రేయస్సు వంటి భావాలను చేర్చలేదు.
