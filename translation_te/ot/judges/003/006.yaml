source:
  edition: WLC
  text: וַ/יִּקְח֨וּ אֶת בְּנוֹתֵי/הֶ֤ם לָ/הֶם֙ לְ/נָשִׁ֔ים וְ/אֶת בְּנוֹתֵי/הֶ֖ם נָתְנ֣וּ לִ/בְנֵי/הֶ֑ם וַ/יַּעַבְד֖וּ אֶת אֱלֹהֵי/הֶֽם־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/006.yaml
  text: They took their daughters for themselves as wives[a], and they gave their daughters to their sons, and they served their gods.
translation:
  language: te
  text: వారు ఆ ప్రజల కుమార్తెలను తమకు భార్యలుగా చేసుకున్నారు; తమ కుమార్తెలను ఆ ప్రజల కుమారులకు ఇచ్చారు; వారి దేవుళ్లను సేవించారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారి దేవుళ్లను ఆరాధించారు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: చేసుకున్నారు
  rationale: לקח అనే క్రియకు అక్షరార్థంగా ‘తీసుకోవడం’ అనే భావం ఉన్నా, לָהֶם לְנָשִׁיםతో కలిసి ఇక్కడ వివాహం చేసుకోవడాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘భార్యలుగా చేసుకున్నారు’ ఈ వివాహార్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: בְּנוֹתֵיהֶם
  choice: వారి కుమార్తెలను
  rationale: బహువచన ప్రత్యయం ముందున్న కనాను దేశ ప్రజలను సూచిస్తుంది; సందర్భం ద్వారా పూర్వపదం స్పష్టమవుతుంది.
- source_word: לָהֶם לְנָשִׁים
  choice: తమకు భార్యలుగా
  rationale: ‘తమ కొరకు’ అనే ప్రయోజనార్థాన్నీ, ‘భార్యలుగా’ అనే సంబంధాన్నీ రెండింటినీ నిలుపుతుంది.
- source_word: וְאֶת־בְּנוֹתֵיהֶם נָתְנוּ לִבְנֵיהֶם
  choice: తమ కుమార్తెలను వారి కుమారులకు ఇచ్చారు
  rationale: 'נתן యొక్క ‘ఇచ్చారు’ అనే మూలభావాన్ని నిలుపుతూ, సందర్భంలో వివాహ సంబంధాన్ని సూచిస్తుంది. ప్రత్యయాల సూచన మార్పును తెలుగులో ‘తమ’ మరియు ‘వారి’తో స్పష్టంగా చూపిస్తుంది: ఇశ్రాయేలీయులు తమ కుమార్తెలను ఆ ప్రజల కుమారులకు ఇచ్చారు.'
- source_word: וַיַּעַבְדוּ
  choice: సేవించారు
  rationale: עבד దేవుళ్లతో వాడినప్పుడు సేవించడం లేదా ఆరాధించడం అనే భావాలు కలవు. ‘సేవించారు’ మతపరమైన విధేయత అనే విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: אֱלֹהֵיהֶם
  choice: వారి దేవుళ్లను
  rationale: ఇది చుట్టుపక్కల ప్రజల దేవతలను సూచించే బహువచన రూపం; ‘వారి దేవుళ్లు’ సహజమైన, స్పష్టమైన తెలుగు.
theological_decisions:
- issue: అన్య దేవుళ్ల పట్ల עבד సూచించే మతపరమైన విధేయత
  choice: వారి దేవుళ్లను సేవించారు
  alternative: వారి దేవుళ్లను ఆరాధించారు
  rationale: ‘సేవించారు’ అనే అనువాదం ఆరాధనతోపాటు విధేయత, allegiance అనే విస్తృత నిబంధనాత్మక భావాన్ని నిలుపుతుంది; ‘ఆరాధించారు’ కూడా సందర్భానుసారంగా సాధ్యమైన అర్థం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. వరుస వాక్యభాగాలను సెమికోలన్లతో విభజించి హెబ్రీ కథన క్రమాన్ని నిలిపాం. ‘తమ/వారి’ భేదం ద్వారా మూలంలోని ప్రత్యయ సూచన మార్పును సాధ్యమైనంత స్పష్టంగా చూపించాం.
