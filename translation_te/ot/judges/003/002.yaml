    text: లేదా, ‘అంతకుముందు యుద్ధాన్ని అనుభవించని వారికి.’
    reason: alternative_reading
  revision_rationale: The revision makes the twofold restrictive-purpose construction intelligible in Telugu (‘కేవలం ఈ ఉద్దేశంతోనే’ / ‘నేర్పడానికే’) while preserving the Hebrew’s purpose and its semantic openness in ידע. It also corrects the footnote’s anchor and negative sense. No doctrinal interpretation has been added.
