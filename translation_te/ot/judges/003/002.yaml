source:
  edition: WLC
  text: רַ֗ק לְמַ֨עַן֙ דַּ֚עַת דֹּר֣וֹת בְּנֵֽי יִשְׂרָאֵ֔ל לְ/לַמְּדָ֖/ם מִלְחָמָ֑ה רַ֥ק אֲשֶׁר לְ/פָנִ֖ים לֹ֥א יְדָעֽוּ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/002.yaml
  text: only so that the generations of the sons of Israel might know[b][a], to teach them war—only those who formerly had not known it.
translation:
  language: te
  text: 'కేవలం ఈ ఉద్దేశంతోనే: ఇశ్రాయేలు కుమారుల తరాలు యుద్ధాన్ని తెలుసుకొనునట్లు—అంటే, అంతకుముందు దానిని ఎరుగని వారికి[a] యుద్ధం నేర్పడానికే.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అంతకుముందు యుద్ధాన్ని అనుభవించని వారికి.’
    reason: alternative_reading
lexical_decisions:
- source_word: רַק
  choice: మాత్రమే
  rationale: ఈ అవ్యయం ఉద్దేశాన్ని పరిమితం చేస్తుంది. హీబ్రూలోని పునరుక్తిని తెలుగులో సహజంగా ప్రతిబింబించేందుకు ‘నేర్పించడానికే—మాత్రమే’ అనే నిర్మాణం వాడబడింది.
- source_word: לְמַעַן
  choice: తెలుసుకోవడానికి
  rationale: ఉద్దేశార్థాన్ని తెలిపే నిర్మాణం; తరువాతి דַּעַתతో కలిపి సహజమైన తెలుగు ఉద్దేశరూపంగా అనువదించబడింది.
- source_word: דַּעַת
  choice: తెలుసుకోవడానికి
  rationale: ידע అనే ‘తెలుసుకొను/ఎరుగు’ మూలపదంతో సంబంధాన్ని నిలుపుతుంది; ‘అనుభవించడానికి’ అని అర్థాన్ని ముందుగానే కుదించలేదు.
- source_word: דֹּרוֹת בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారుల తరాలు
  rationale: నిర్మాణ సంబంధాన్ని, అలాగే ‘ఇశ్రాయేలు కుమారులు’ అనే మూలభాషలోని సామూహిక సంజ్ఞను నిలుపుతుంది.
- source_word: לְלַמְּדָם
  choice: వారికి ... నేర్పించడానికి
  rationale: లמד పియేల్ రూపంలోని బోధించు/నేర్పించు భావాన్ని నేరుగా అందిస్తుంది; సైనిక శిక్షణ అనే భావాన్ని ‘యుద్ధం’ అనే కర్మ స్పష్టం చేస్తుంది.
- source_word: מִלְחָמָה
  choice: యుద్ధం
  rationale: ఏకవచన భావవాచక నామానికి సరళమైన, విస్తృతమైన తెలుగు సమానం.
- source_word: אֲשֶׁר לְפָנִים
  choice: అంతకుముందు ... వారు
  rationale: గతకాల సూచనను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: לֹא יְדָעוּם
  choice: దాన్ని ఎరుగనివారు
  rationale: ידע యొక్క ‘ఎరుగు’ భావాన్ని నిలుపుతూ, యుద్ధాన్ని అనుభవించలేదు అనే సాధ్యమైన భావాన్ని ప్రధాన పాఠంలో ఖరారు చేయదు.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל అనే లింగసూచక సామూహిక వ్యక్తీకరణ
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలీయులు
  rationale: హీబ్రూ రూపాన్ని ప్రధాన పాఠంలో నిలిపినా, ఇది కేవలం పురుషులను కాక ఇశ్రాయేలు ప్రజలను సామూహికంగా సూచించే స్థిర సంజ్ఞ.
- issue: ‘యుద్ధాన్ని తెలుసుకోవడం’ అనే మాట యొక్క భావం
  choice: యుద్ధాన్ని తెలుసుకోవడం / దాన్ని ఎరుగకపోవడం
  alternative: యుద్ధాన్ని అనుభవించడం / అనుభవించకపోవడం
  rationale: మూలంలోని ידע పదానికి ఉన్న విస్తృతిని నిలుపుతూ, పరిచయం మరియు అనుభవం మధ్యనున్న భావసందిగ్ధతను ప్రధాన పాఠంలో పరిష్కరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. హీబ్రూ వాక్యంలోని అసంపూర్ణంగా అనిపించే వివరణాత్మక నిర్మాణాన్ని డాష్‌లతో నిలిపి, ‘తెలుసుకోవడం/ఎరుగడం’ అనే పదబంధంలోని ఉద్దేశపూర్వక భావవిస్తృతిని కాపాడింది.
