translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు స్పష్టంగా ఉండే గంభీరమైన కథనశైలి. మూలంలోని సుమారు సంఖ్యను, యుద్ధ సందర్భాన్ని, ఓటమి సంపూర్ణతను నిలిపాం. వివరణ అవసరమైన పాఠాంతరం లేదా ప్రధాన భావసందిగ్ధత లేనందున పాదటిప్పణులు ఇవ్వలేదు.
