  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּכּ֨וּ אֶת מוֹאָ֜ב בָּ/עֵ֣ת הַ/הִ֗יא כַּ/עֲשֶׂ֤רֶת אֲלָפִים֙ אִ֔ישׁ כָּל שָׁמֵ֖ן וְ/כָל אִ֣ישׁ חָ֑יִל וְ/לֹ֥א נִמְלַ֖ט אִֽישׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/029.yaml
  text: And at that time they struck down about ten thousand men of Moab[a], every stout man and every man of valor[c][b]; not a man escaped.
translation:
  language: te
  text: ఆ సమయంలో వారు మోయాబీయులను దాదాపు పదివేల మందిని హతమార్చారు—వారంతా బలిష్ఠులు, పరాక్రమవంతులు; ఒక్కరు కూడా తప్పించుకోలేదు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּכּוּ
  choice: హతమార్చారు
  rationale: యుద్ధ సందర్భంలో נכה శత్రువులను కొట్టి చంపడాన్ని సూచిస్తుంది. తెలుగు వాక్యంలో ఫలితాన్ని సహజంగా, స్పష్టంగా తెలియజేయడానికి ఈ పదాన్ని ఎంచుకున్నాం.
- source_word: אֶת מוֹאָב
  choice: మోయాబీయులలో
  rationale: హీబ్రూలో అక్షరార్థంగా ‘మోయాబును’ అని ఉన్నా, వెంటనే ‘దాదాపు పదివేల మంది’ అని లెక్క ఇవ్వబడింది. అందువల్ల మోయాబు ప్రజలలోని పురుషులే ఉద్దేశించబడ్డారని తెలుగులో సహజంగా వ్యక్తం చేశాం.
- source_word: בָּעֵת הַהִיא
  choice: ఆ సమయంలో
  rationale: కాలాన్ని సూచించే ఈ సాధారణ హీబ్రూ పదబంధానికి సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: כַּעֲשֶׂרֶת אֲלָפִים אִישׁ
  choice: దాదాపు పదివేల మందిని
  rationale: ముందున్న כְּ ఇక్కడ సుమారు అనే భావాన్ని ఇస్తుంది; ‘దాదాపు’ ఆ అంచనాను స్పష్టంగా తెలియజేస్తుంది.
- source_word: כָּל שָׁמֵן
  choice: వారంతా బలిష్ఠులు
  rationale: שָׁמֵן అక్షరార్థంగా ‘లావైన/కొవ్విన’ అని ఉన్నా, ఈ యుద్ధ సందర్భంలో బాగా పోషించబడిన, దృఢమైన లేదా బలమైన మనుషులను సూచించే అవకాశం ఉంది. ‘బలిష్ఠులు’ శారీరక బలం అనే సందర్భోచిత భావాన్ని సహజంగా అందిస్తుంది.
- source_word: וְכָל אִישׁ חָיִל
  choice: పరాక్రమవంతులు
  rationale: אִישׁ חַיִל యుద్ధ సందర్భంలో శౌర్యం, సామర్థ్యం, బలం గల వ్యక్తిని సూచిస్తుంది. ‘పరాక్రమవంతులు’ సైనిక భావాన్ని గౌరవప్రదమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: וְלֹא נִמְלַט אִישׁ
  choice: ఒక్కరు కూడా తప్పించుకోలేదు
  rationale: ఎవరూ తప్పించుకోలేదనే సంపూర్ణతను హీబ్రూ ఏకవచన పంపిణీ ప్రయోగం నొక్కిచెబుతుంది; తెలుగు నుడికారంలో ‘ఒక్కరు కూడా’ అదే బలాన్ని సహజంగా ఇస్తుంది.
