- from: ఆ సమయంలో వారు మోయాబీయులలో దాదాపు పదివేల మందిని హతమార్చారు—వారంతా బలిష్ఠులు, పరాక్రమవంతులు; ఒక్కరు కూడా తప్పించుకోలేదు.
  to: ఆ సమయంలో వారు మోయాబీయులను దాదాపు పదివేల మందిని హతమార్చారు—వారంతా బలిష్ఠులు, పరాక్రమవంతులు; ఒక్కరు కూడా తప్పించుకోలేదు.
