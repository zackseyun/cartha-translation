    text: లేదా, ‘అనుభవించని.’
    reason: ידע అనే క్రియ ఇక్కడ యుద్ధాలను కేవలం తెలుసుకోవడం కాక, వాటిని ప్రత్యక్షంగా అనుభవించడం అనే భావాన్ని కూడా ఇవ్వగలదు.
  revision_rationale: 'The revision retains every source element while placing the Hebrew appositional specification in idiomatic Telugu order: those in Israel who knew none of the wars of Canaan are the object of testing. It also uses “జాతులు” for the nations and preserves the footnote anchor directly after the term carrying the experiential nuance.'
