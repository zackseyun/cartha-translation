id: JDG.3.1
reference: Judges 3:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אֵ֤לֶּה הַ/גּוֹיִם֙ אֲשֶׁ֣ר הִנִּ֣יחַ יְהוָ֔ה לְ/נַסּ֥וֹת בָּ֖/ם אֶת יִשְׂרָאֵ֑ל אֵ֚ת כָּל אֲשֶׁ֣ר לֹֽא יָדְע֔וּ אֵ֖ת כָּל מִלְחֲמ֥וֹת כְּנָֽעַן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/001.yaml
  text: 'These are the nations that Yahweh left to test Israel by them[a], that is, all who had not known any of the wars of Canaan:'
translation:
  language: te
  text: 'కనాను యుద్ధాలలో దేనినీ ఎరుగని[a] ఇశ్రాయేలీయులందరిని వీరి ద్వారా పరీక్షించడానికి యాహ్వే విడిచిపెట్టిన జాతులు ఇవే:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అనుభవించని.’
    reason: ידע అనే క్రియ ఇక్కడ యుద్ధాలను కేవలం తెలుసుకోవడం కాక, వాటిని ప్రత్యక్షంగా అనుభవించడం అనే భావాన్ని కూడా ఇవ్వగలదు.
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: ఇవే
  rationale: ఈ రూపం కొత్త జాబితాను పరిచయం చేస్తూ ముందున్న కథనంతో సంబంధాన్ని సహజంగా కొనసాగిస్తుంది; మూలంలో లేని కాలసూచకమైన ‘ఇప్పుడు’ను చేర్చలేదు.
- source_word: הַגּוֹיִם
  choice: జనాలు
  rationale: ఇక్కడ ఈ పదం కనానులో మిగిలివున్న వేర్వేరు జాతి-రాజకీయ సమూహాలను సూచిస్తుంది.
- source_word: הִנִּיחַ
  choice: విడిచిపెట్టిన
  rationale: హిఫిల్ రూపం ‘మిగిలి ఉండనివ్వడం’ లేదా ‘విడిచిపెట్టడం’ అనే భావాన్ని ఇస్తుంది; సందర్భంలో సంక్షిప్తంగా ‘విడిచిపెట్టిన’ సహజంగా ఉంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగు లిపిలో లిప్యంతరీకరించాం.
- source_word: לְנַסּוֹת
  choice: పరీక్షించడానికి
  rationale: נסה ఇక్కడ పరీక్షించడం అనే అర్థంలో ఉంది; ‘శోధించడం’ వంటి ప్రతికూల నైతిక భావాన్ని అనవసరంగా చేర్చలేదు.
- source_word: בָּם
  choice: వీరి ద్వారా
  rationale: ఈ జనాలే ఇశ్రాయేలును పరీక్షించే సాధనమని సూచించే సాధనార్థక భావాన్ని స్పష్టంగా, సహజమైన తెలుగులో తెలిపింది.
- source_word: אֶת יִשְׂרָאֵל
  choice: ఇశ్రాయేలును
  rationale: వ్యక్తినామాన్ని ప్రత్యక్ష కర్మగా యథార్థంగా అనువదించాం.
- source_word: אֵת כָּל אֲשֶׁר לֹא יָדְעוּ
  choice: ఎరుగని వారందరిని
  rationale: ఈ పదబంధం ఇశ్రాయేలులో ఉద్దేశించబడిన వర్గాన్ని వివరిస్తుంది. ‘ఎరుగని’ మూలంలోని ‘తెలుసుకొను’ పదాన్ని కాపాడుతూ అనుభవపూర్వక జ్ఞానం అనే భావానికీ చోటిస్తుంది.
- source_word: אֵת כָּל מִלְחֲמוֹת כְּנָעַן
  choice: కనాను యుద్ధాలలో దేనినీ
  rationale: అక్షరార్థంగా ‘కనాను యుద్ధాలన్నిటినీ’; నిషేధ వాక్యంలో ‘దేనినీ’ అని చెప్పడం అవేవీ వారికి అనుభవంలో లేవనే భావాన్ని సహజమైన తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు
  rationale: మూలపాఠం దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది; కాబట్టి దానిని బిరుదుతో భర్తీ చేయకుండా లిప్యంతరీకరించాం.
- issue: దేవుడు జనాలను విడిచిపెట్టి ఇశ్రాయేలును పరీక్షించడం
  choice: వీరి ద్వారా పరీక్షించడానికి యాహ్వే విడిచిపెట్టిన
  alternative: ఇశ్రాయేలును రుజువు చేయడానికి మిగిలి ఉండనిచ్చిన
  rationale: దేవుని పరీక్ష అనే మూలపాఠంలోని ధార్మిక ఉద్వేగాన్ని తగ్గించకుండా, దానికి అదనపు వివరణను చేర్చకుండా ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరమైన శైలిని అనుసరించాం. మధ్యలోని వివరణాత్మక భాగాన్ని దీర్ఘ విరామచిహ్నాలతో ఉంచి, ‘ఇశ్రాయేలు’ అంటే ఇక్కడ కనాను యుద్ధాలను ఎరుగని తరమని స్పష్టపరిచాం. వాక్యం తరువాత వచ్చే జనాల జాబితాకు దారితీయడం వల్ల ముగింపులో ద్విబిందువును నిలిపాం.
