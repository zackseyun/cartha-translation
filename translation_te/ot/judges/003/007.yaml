id: JDG.3.7
reference: Judges 3:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּעֲשׂ֨וּ בְנֵי יִשְׂרָאֵ֤ל אֶת הָ/רַע֙ בְּ/עֵינֵ֣י יְהוָ֔ה וַֽ/יִּשְׁכְּח֖וּ אֶת יְהוָ֣ה אֱלֹֽהֵי/הֶ֑ם וַ/יַּעַבְד֥וּ אֶת הַ/בְּעָלִ֖ים וְ/אֶת הָ/אֲשֵׁרֽוֹת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/007.yaml
  text: And the sons of Israel did what was evil in the eyes of Yahweh[c][b][a], and they forgot Yahweh their God and served the Baals and the Asherahs.
translation:
  language: te
  text: ఇశ్రాయేలు కుమారులు[a] యెహోవా దృష్టిలో చెడైనది[b] చేశారు. వారు తమ దేవుడైన యెహోవాను మరచిపోయి, బయలులను, అషేరాలను[c] సేవించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఇశ్రాయేలీయులు.” హీబ్రూలో అక్షరార్థంగా “ఇశ్రాయేలు కుమారులు.”
    reason: lexical_alternative
  - marker: b
    text: “యెహోవా దృష్టిలో చెడు” అనేది యెహోవా చెడుగా తీర్మానించినదాన్ని సూచించే సాధారణ హీబ్రూ నుడికారం.
    reason: lexical_alternative
  - marker: c
    text: లేదా, “అషేరా స్తంభాలను.” హీబ్రూ పదం అషేరాతో ముడిపడిన ఆరాధనా వస్తువులనో, మరింత విస్తృతంగా అషేరా ఆరాధననో సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: హీబ్రూ రూపాన్ని పారదర్శకంగా నిలుపుతుంది; ఇది సమూహంగా ఇశ్రాయేలు ప్రజలను సూచించే సాంప్రదాయిక పదబంధం.
- source_word: הָרַע בְּעֵינֵי יְהוָה
  choice: యెహోవా దృష్టిలో చెడైనదాన్ని
  rationale: אֶת הָרַע లోని కర్మార్థాన్ని, అలాగే בְּעֵינֵי అనే హీబ్రూ మూల్యాంకన నుడికారాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగు బైబిలు వాడుకలో సుపరిచితమైన రూపంలో లిప్యంతరీకరిస్తుంది.
- source_word: וַיִּשְׁכְּחוּ
  choice: మరచిపోయి
  rationale: שׁכח యొక్క ప్రాథమిక అర్థమైన ‘మరచిపోవడం’ను నిలుపుతుంది; నిబంధన సంబంధమైన నిర్లక్ష్యం లేదా విడిచిపెట్టడం అనే భావం సందర్భం ద్వారా వెలువడుతుంది.
- source_word: אֱלֹהֵיהֶם
  choice: తమ దేవుడైన
  rationale: యెహోవానే సూచిస్తున్నందున ఏకవచన భావాన్ని స్పష్టంగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: וַיַּעַבְדוּ
  choice: సేవించారు
  rationale: ఆరాధనతో పాటు విధేయత లేదా అధీనత భావాన్నీ మోయగల עבד పదంలోని విస్తృతిని నిలుపుతుంది.
- source_word: הַבְּעָלִים
  choice: బయలులను
  rationale: హీబ్రూ బహువచనాన్ని నిలిపి, బయలు యొక్క స్థానిక రూపాలు లేదా ప్రతిరూపాల వైవిధ్యాన్ని అతిగా వివరించకుండా సూచిస్తుంది.
- source_word: הָאֲשֵׁרוֹת
  choice: అషేరాలను
  rationale: దేవతకు సంబంధించిన స్థానిక రూపాలనో, ఆరాధనా వస్తువులనో సూచించగల హీబ్రూ పదంలోని అస్పష్టతను ప్రధాన పాఠ్యంలో నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: దైవనామాన్ని ‘ప్రభువు’ అనే బిరుదుగా మార్చకుండా వ్యక్తినామంగానే ఉంచుతూ, సాధారణ తెలుగు పాఠకులకు విస్తృతంగా తెలిసిన రూపాన్ని ఎంచుకుంది.
- issue: הָאֲשֵׁרוֹת నిర్దిష్ట ఆరాధనా స్తంభాలనా లేక అషేరా ఆరాధనకు సంబంధించిన విస్తృత సూచనా
  choice: అషేరాలు
  alternative: అషేరా స్తంభాలు
  rationale: మూలపదం దేవతకు సంబంధించిన స్థానిక రూపాలను లేదా ఆమెతో ముడిపడిన ఆరాధనా వస్తువులను సూచించవచ్చు; అందువల్ల ప్రధాన పాఠ్యంలో సంకుచిత నిర్ణయాన్ని రుద్దకుండా అస్పష్టతను నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్యనిర్మాణం. మూలంలోని వరుస క్రియలను తెలుగులో రెండు సహజ వాక్యాలుగా అమర్చింది; దైవనామం, బహువచన విగ్రహనామాలు, అషేరా పదంలోని ఉద్దేశపూర్వక అస్పష్టత నిలుపబడ్డాయి.
