source:
  edition: WLC
  text: וַ/יִּשְׁלַ֤ח אֵהוּד֙ אֶת יַ֣ד שְׂמֹאל֔/וֹ וַ/יִּקַּח֙ אֶת הַ/חֶ֔רֶב מֵ/עַ֖ל יֶ֣רֶךְ יְמִינ֑/וֹ וַ/יִּתְקָעֶ֖/הָ בְּ/בִטְנֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/021.yaml
  text: Then Ehud reached with his left hand[a], took the sword from his right thigh[b], and thrust it into his belly.
translation:
  language: te
  text: అప్పుడు ఏహూదు తన ఎడమ చేతిని చాపి, తన కుడి తొడ మీద ఉన్న కత్తిని తీసి, దానిని అతని కడుపులో పొడిచాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: చాపి
  rationale: చేతిని ముందుకు చాపే భౌతిక చర్యను ఈ సందర్భంలో సహజంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: יַד שְׂמֹאלוֹ
  choice: తన ఎడమ చెయ్యి
  rationale: మూలంలో ‘చెయ్యి’ స్పష్టంగా ఉంది; ఏహూదు ఎడమచేతితో చేసిన చర్యపై కథనంలోని ప్రాధాన్యాన్ని నిలుపుతుంది.
- source_word: וַיִּקַּח
  choice: తీసి
  rationale: వరుసగా జరిగే చర్యలో לקח అనే సాధారణ క్రియకు సహజమైన తెలుగు సమానం; ‘లాక్కొని’ వంటి అదనపు తీవ్రతను చేర్చదు.
- source_word: הַחֶרֶב
  choice: కత్తిని
  rationale: חֶרֶב సాధారణంగా ఖడ్గం లేదా కత్తిని సూచిస్తుంది. ఇక్కడ ఆయుధం చిన్నదైనా, ‘బాకు’ అని మరీ నిర్దిష్టం చేయకుండా ఆధునిక పాఠకులకు సహజమైన విస్తృత పదం ‘కత్తి’.
- source_word: מֵעַל יֶרֶךְ יְמִינוֹ
  choice: తన కుడి తొడ మీద ఉన్న
  rationale: ఆయుధం కుడి తొడపై ధరించబడిన నిర్దిష్ట స్థానాన్ని మూలానికి దగ్గరగా, తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: וַיִּתְקָעֶהָ
  choice: దానిని దించాడు
  rationale: תקע ఇక్కడ ఆయుధాన్ని బలంగా లోపలికి పొడిచే చర్యను సూచిస్తుంది. ‘దించాడు’ హింసాత్మక చలనాన్ని సహజ కథనశైలిలో తెలియజేస్తుంది.
- source_word: בְּבִטְנוֹ
  choice: అతని కడుపులో
  rationale: בֶּטֶן కు ‘కడుపు’ ప్రత్యక్షమైన, సాధారణ తెలుగు సమానం; ‘ఉదరం’ కంటే తక్కువ సాంకేతికంగా, కథనానికి తగినదిగా ఉంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన కథనశైలి. వరుస హీబ్రూ క్రియలను తెలుగు అనుసంధాన క్రియలతో సహజంగా మలిచాం. ‘తన’ ఏహూదును, ‘అతని’ ఏగ్లోనును సూచించేలా కర్త–కర్మ భేదాన్ని స్పష్టం చేశాం.
