  text: And they were there to test Israel[a], to know whether they would listen to the commandments of Yahweh[c][b], which he commanded their fathers through Moses.
translation:
  language: te
  text: 'ఆ జాతులు అక్కడ ఉన్నాయి: వాటి ద్వారా ఇశ్రాయేలును పరీక్షించి, యాహ్వే మోషే ద్వారా వారి పితరులకు ఆజ్ఞాపించిన ఆజ్ఞలను వారు పాటిస్తారో లేదో తెలుసుకోవడానికి.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “వాటి ద్వారా” అంటే దేశంలో మిగిలి ఉన్న ఆ జాతులనే ఇశ్రాయేలును పరీక్షించే సాధనంగా ఉపయోగించడం.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో “వింటారో” అని ఉంది; ఆజ్ఞల సందర్భంలో దాని భావం వాటిని ఆలకించి పాటించడమే.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: ఆ జాతులు అక్కడ ఉన్నాయి
  rationale: ముందటి సందర్భంలో దేశంలో విడిచిపెట్టబడిన జాతులనే కర్తగా స్పష్టపరుస్తూ, హీబ్రూ క్రియ సూచించే కొనసాగుతున్న ఉనికిని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: לְנַסּוֹת
  choice: పరీక్షించి
  rationale: נסה ఇక్కడ శోధించి చెడుకు ప్రేరేపించడం కంటే, విధేయతను పరీక్ష ద్వారా వెల్లడించడం అనే అర్థం ఇస్తుంది.
- source_word: בָּם
  choice: వాటి ద్వారా
  rationale: దేశంలో మిగిలిన జాతులే ఇశ్రాయేలు పరీక్షకు సాధనమని సూచించే హీబ్రూ ఉపసర్గ యొక్క సాధనార్థాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: לָדַעַת
  choice: తెలుసుకోవడానికి
  rationale: పరీక్ష యొక్క ఉద్దేశాన్ని తెలిపే ידע యొక్క సహజమైన, నేర తెలుగు సమానార్థకం.
- source_word: הֲיִשְׁמְעוּ
  choice: వింటారో లేదో
  rationale: שׁמע లోని వినడం అనే రూపకాన్ని నిలుపుతూ, ఆజ్ఞల సందర్భంలో లక్ష్యపెట్టి పాటించడం అనే భావాన్ని పాదసూచిక వివరిస్తుంది.
- source_word: מִצְוֺת
  choice: ఆజ్ఞలను
  rationale: నిబంధన సంబంధమైన దేవుని ఆదేశాలను తెలిపే מצוה కు ఆధునిక తెలుగులో సహజమైన పదం.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, యహ్వే అనే వ్యక్తిగత నామానికి తెలుగు లిప్యంతరీకరణను ఉపయోగిస్తుంది.
- source_word: אֲשֶׁר צִוָּה
  choice: ఆయన ఆజ్ఞాపించిన
  rationale: ఆజ్ఞలు యాహ్వే ఆజ్ఞాపించినవని తెలిపే సంబంధ ఉపవాక్యాన్ని నిలుపుతుంది.
- source_word: אֲבוֹתָם
  choice: వారి పితరులకు
  rationale: హీబ్రూలోని ‘వారి తండ్రులు’ అనే పురుష బహువచన రూపాన్నీ, ఇక్కడి పూర్వీకుల భావాన్నీ సంక్షిప్తంగా నిలుపుతుంది.
- source_word: בְּיַד מֹשֶׁה
  choice: మోషే ద్వారా
  rationale: ‘మోషే చేతి ద్వారా’ అనే హీబ్రూ నుడికారంలోని మధ్యవర్తిత్వం లేదా సాధనార్థాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: పరీక్ష భాష యొక్క భావం
  choice: మిగిలిన జాతులు ఇశ్రాయేలు నిబంధన విధేయతను పరీక్షించే సాధనంగా ఉన్నాయని అనువదించడం
  alternative: దైవిక ఉద్దేశం లేని కేవలం చారిత్రక పరిశీలనగా చదవడం
  rationale: לְנַסּוֹת మరియు לָדַעַת అనే ఉద్దేశార్థక క్రియారూపాలు పరీక్షనూ తెలుసుకోవడాన్నీ స్పష్టంగా కలుపుతున్నాయి; అయితే పరీక్షను చెడుకు ప్రలోభపెట్టడమని విస్తరించలేదు.
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు లేదా యెహోవా
  rationale: మూలంలోని వ్యక్తిగత దైవనామాన్ని బిరుదుగా మార్చకుండా తెలుగు లిపిలో ప్రతిబింబిస్తుంది.
- issue: ‘వినడం’ మరియు విధేయత మధ్య సంబంధం
  choice: ప్రధాన పాఠ్యంలో ‘వింటారో’ ఉంచి, పాటించే భావాన్ని పాదసూచికలో వివరించడం
  alternative: ప్రధాన పాఠ్యంలోనే ‘పాటిస్తారో’ అని అర్థానువాదం చేయడం
  rationale: హీబ్రూ శ్రవణ రూపకాన్ని కాపాడుతూ, సందర్భంలో ఉన్న విధేయత భావం పాఠకునికి స్పష్టమయ్యేలా చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘పితరులు’ బైబిలు సందర్భానికి తగిన గంభీరతను కలిగించినప్పటికీ అతి ప్రాచీన వాక్యనిర్మాణాన్ని నివారించాం. హీబ్రూ వాక్యంలోని ఉద్దేశ సంబంధాన్ని ఒకే వాక్యంలో నిలిపాం.
