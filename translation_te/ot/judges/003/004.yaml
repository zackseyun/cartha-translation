  to: 'ఆ జాతులు అక్కడ ఉన్నాయి: వాటి ద్వారా ఇశ్రాయేలును పరీక్షించి, యాహ్వే మోషే ద్వారా వారి పితరులకు ఆజ్ఞాపించిన ఆజ్ఞలను వారు పాటిస్తారో లేదో తెలుసుకోవడానికి.[a][b]'
