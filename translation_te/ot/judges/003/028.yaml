id: JDG.3.28
reference: Judges 3:28
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֲלֵ/הֶם֙ רִדְפ֣וּ אַחֲרַ֔/י כִּֽי נָתַ֨ן יְהוָ֧ה אֶת אֹיְבֵי/כֶ֛ם אֶת מוֹאָ֖ב בְּ/יֶדְ/כֶ֑ם וַ/יֵּרְד֣וּ אַחֲרָ֗י/ו וַֽ/יִּלְכְּד֞וּ אֶת מַעְבְּר֤וֹת הַ/יַּרְדֵּן֙ לְ/מוֹאָ֔ב וְ/לֹֽא נָתְנ֥וּ אִ֖ישׁ לַ/עֲבֹֽר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/028.yaml
  text: And he said to them[a], “Follow after me, for Yahweh has given your enemies, Moab, into your hand.” So they went down after him and captured the fords of the Jordan against Moab[c][b], and they did not allow anyone to cross over.
translation:
  language: te
  text: అతడు వారితో, “నా వెంట తరుముకుంటూ రండి[a]. ఎందుకంటే యాహ్వే మీ శత్రువులైన మోయాబును మీ చేతికి అప్పగించాడు” అన్నాడు. అప్పుడు వారు అతని వెంట దిగివెళ్లి, మోయాబుకు వెళ్లే యొర్దాను దాటే ప్రదేశాలను[b] స్వాధీనం చేసుకున్నారు; ఎవరినీ దాటనివ్వలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నా వెంట వెంబడించండి.”
    reason: רדף సాధారణంగా ‘తరుము, వెంబడించు’ అని అర్థమిస్తుంది; ఇక్కడ ఏహూదు వెంట యుద్ధానికి రావాలనే భావమూ ఉంది.
  - marker: b
    text: లేదా, “మోయాబు వైపున్న యొర్దాను దాటే ప్రదేశాలను.”
    reason: לְמוֹאָב అనే పదబంధం ‘మోయాబు వైపు/మోయాబుకు’ అనే దిశను లేదా మోయాబుతో సంబంధాన్ని సూచించవచ్చు.
lexical_decisions:
- source_word: רִדְפוּ אַחֲרַי
  choice: నా వెంట తరుముకుంటూ రండి
  rationale: רדף అనే క్రియలోని ‘తరుము/వెంబడించు’ అనే సైనిక భావాన్నీ, నాయకుడైన ఏహూదు వెంట రావాలనే దిశాభావాన్నీ సహజమైన తెలుగులో ఉంచుతుంది.
- source_word: נָתַן ... בְּיֶדְכֶם
  choice: మీ చేతికి అప్పగించాడు
  rationale: ఎవరి అధికారంలోకైనా శత్రువును అప్పగించడాన్ని సూచించే హీబ్రూ నుడికారాన్ని తెలుగు నుడికారంతో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హీబ్రూ మూలంలో ఉన్న దేవుని వ్యక్తిగత నామాన్ని బిరుదుతో భర్తీ చేయకుండా లిప్యంతరీకరిస్తుంది.
- source_word: אֹיְבֵיכֶם אֶת מוֹאָב
  choice: మీ శత్రువులైన మోయాబును
  rationale: ‘మోయాబు’ అనే జాతి/దేశనామమే ‘మీ శత్రువులు’ అని వివరణాత్మక సంబంధంలో ఉన్న హీబ్రూ నిర్మాణాన్ని నిలుపుతుంది; మూలంలో లేని ‘మోయాబీయులు’ అనే జాతివాచకాన్ని చేర్చదు.
- source_word: וַיֵּרְדוּ אַחֲרָיו
  choice: వారు అతని వెంట దిగివెళ్లి
  rationale: యూదా కొండప్రాంతం నుంచి యొర్దాను లోయకు దిగడాన్ని సూచించే ירד యొక్క భౌగోళిక భావాన్ని కాపాడుతుంది.
- source_word: מַעְבְּרוֹת הַיַּרְדֵּן
  choice: యొర్దాను దాటే రేవులను
  rationale: నదిని దాటగలిగే అల్పలోతు ప్రదేశాలను ఆధునిక తెలుగులో అర్థమయ్యేలా ‘దాటే రేవులు’ అని అందిస్తుంది.
- source_word: לְמוֹאָב
  choice: మోయాబు వైపున్న
  rationale: לְ యొక్క దిశ/గమ్య సంబంధాన్ని వ్యక్తం చేస్తూ, అవి మోయాబుకు సంబంధించినవా లేక మోయాబు దిశగా ఉన్నవా అన్న స్వల్ప సందిగ్ధతను పూర్తిగా తొలగించదు.
- source_word: וְלֹא נָתְנוּ אִישׁ לַעֲבֹר
  choice: ఎవరినీ దాటనివ్వలేదు
  rationale: ‘ఒక మనిషిని దాటడానికి ఇవ్వలేదు’ అనే హీబ్రూ నుడికారాన్ని సంక్షిప్తమైన, సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా / ప్రభువు
  rationale: వచనంలో బిరుదు కాక నాలుగు హీబ్రూ అక్షరాల దైవనామమే ఉంది; అందువల్ల వ్యక్తిగత నామాన్ని ‘యాహ్వే’గా లిప్యంతరీకరించాం.
- issue: מוֹאָב అనే జాతీయ నామం యొక్క సమష్టి ప్రయోగం
  choice: మోయాబు
  alternative: మోయాబీయులు
  rationale: మూలపాఠం ప్రజల జాతివాచకాన్ని కాక దేశ/జాతి నామమైన ‘మోయాబు’నే ఉపయోగిస్తుంది; దాని సమష్టి వ్యక్తీకరణను నిలుపుతున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కథనానికి తగిన గంభీరతతో పాటు సాధారణ పాఠకులకు స్పష్టతను కాపాడాం. యుద్ధసందర్భంలోని క్రియాశీలతను ఉంచుతూ, హీబ్రూ భౌగోళిక వివరాలు మరియు జాతీయ నామపు సమష్టి ప్రయోగాన్ని నిలిపాం.
