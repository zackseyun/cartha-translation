  text: וַ/תְּהִ֨י עָלָ֥י/ו רֽוּחַ יְהוָה֮ וַ/יִּשְׁפֹּ֣ט אֶת יִשְׂרָאֵל֒ וַ/יֵּצֵא֙ לַ/מִּלְחָמָ֔ה וַ/יִּתֵּ֤ן יְהוָה֙ בְּ/יָד֔/וֹ אֶת כּוּשַׁ֥ן רִשְׁעָתַ֖יִם מֶ֣לֶךְ אֲרָ֑ם וַ/תָּ֣עָז יָד֔/וֹ עַ֖ל כּוּשַׁ֥ן רִשְׁעָתָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/010.yaml
  text: The Spirit of Yahweh came upon him[a], and he judged Israel. He went out to battle, and Yahweh gave Cushan-rishathaim king of Aram into his hand[b], and his hand prevailed over Cushan-rishathaim.
translation:
  language: te
  text: యాహ్వే ఆత్మ అతని మీదికి వచ్చింది[a]. అతడు ఇశ్రాయేలుకు న్యాయాధిపతిగా వ్యవహరించాడు. అతడు యుద్ధానికి బయలుదేరగా, యాహ్వే అరాము రాజైన కూషన్-రిషాతయిమును అతని చేతికి అప్పగించాడు[b]. అతని చెయ్యి కూషన్-రిషాతయిము మీద ప్రబలింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యాహ్వే ఆత్మ అతని మీద ఉంది.” హీబ్రూ ప్రయోగానికి ఈ స్థిత్యర్థం కూడా సాధ్యమే; అయితే కథన సందర్భం “మీదికి వచ్చింది” అనే అర్థానికి అనుకూలంగా ఉంది.
    reason: lexical_alternative
  - marker: b
    text: పాత అనువాదాల్లో హీబ్రూ స్థలనామమైన “అరాము”ను తరచుగా “సిరియా” అని అనువదించారు.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתְּהִי עָלָיו רוּחַ יְהוָה
  choice: యెహోవా ఆత్మ అతని మీదికి వచ్చింది
  rationale: היה על అనే హీబ్రూ ప్రయోగం ఆత్మ ఒక వ్యక్తి మీద ఉండడాన్ని లేదా కార్యసామర్థ్యం కోసం అతని మీదికి రావడాన్ని సూచించగలదు. కథనంలో కొత్త కార్యదశ మొదలవుతున్నందున చలనార్థకమైన ‘మీదికి వచ్చింది’ను ప్రధాన పాఠ్యంలో ఉంచి, స్థిత్యర్థాన్ని పాదసూచికలో నిలిపాం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో లిప్యంతరీకరించాం.
- source_word: וַיִּשְׁפֹּט אֶת־יִשְׂרָאֵל
  choice: అతడు ఇశ్రాయేలుకు న్యాయాధిపతిగా వ్యవహరించాడు
  rationale: שׁפט ఇక్కడ న్యాయం తీర్చడమే కాక న్యాయాధిపతిగా నాయకత్వం వహించడం, విడిపించడం వంటి న్యాయాధిపతుల గ్రంథానికి ప్రత్యేకమైన పాత్రను సూచిస్తుంది. ‘వ్యవహరించాడు’ అనే రూపం ఆ పాత్రను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וַיֵּצֵא לַמִּלְחָמָה
  choice: అతడు యుద్ధానికి బయలుదేరగా
  rationale: ఇది యుద్ధానికి వెళ్లడాన్ని సూచించే సాధారణ సైనిక ప్రయోగం. తరువాతి కార్యంతో కథన సంబంధాన్ని సహజంగా చూపడానికి ‘బయలుదేరగా’ అని అనువదించాం.
- source_word: וַיִּתֵּן יְהוָה בְּיָדוֹ
  choice: యెహోవా ... అతని చేతికి అప్పగించాడు
  rationale: ‘చేతిలో ఇవ్వడం’ అనే హీబ్రూ నుడికారం ఒకరిని మరొకరి అధికారానికి లేదా విజయానికి అప్పగించడాన్ని సూచిస్తుంది. తెలుగు ‘చేతికి అప్పగించాడు’ మూలంలోని చేతి రూపకాన్ని, అర్థాన్ని రెండింటినీ నిలుపుతుంది.
- source_word: כּוּשַׁן רִשְׁעָתַיִם
  choice: కూషన్-రిషాతయిము
  rationale: వ్యక్తినామాన్ని అనువదించకుండా తెలుగు ధ్వన్యనుసారంగా లిప్యంతరీకరించాం; సంయుక్త రూపం స్పష్టంగా ఉండేందుకు హైఫన్ ఉంచాం.
- source_word: מֶלֶךְ אֲרָם
  choice: అరాము రాజు
  rationale: אֲרָם అనే మూల భౌగోళిక నామాన్ని ‘సిరియా’గా సంప్రదాయానుసారం మార్చకుండా ‘అరాము’గా నిలిపాం.
- source_word: וַתָּעָז יָדוֹ עַל
  choice: అతని చెయ్యి ... మీద ప్రబలింది
  rationale: ఈ ప్రయోగం ప్రత్యర్థిపై బలం, ఆధిపత్యం లేదా విజయాన్ని సూచిస్తుంది. ‘చెయ్యి ప్రబలింది’ మూలంలోని రూపకాన్ని నిలుపుతూ ఫలితాన్ని స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: దైవాత్మను సూచించే పదబంధం
  choice: యెహోవా ఆత్మ అతని మీదికి వచ్చింది
  alternative: యెహోవా ఆత్మ అతని మీద ఉంది
  rationale: వచనం ఒత్నీయేలుకు కలిగిన దైవిక కార్యసామర్థ్యాన్ని తెలియజేస్తుంది. తరువాతి సిద్ధాంతపరమైన వివరాలను పాఠ్యంలోకి చేర్చకుండా, హీబ్రూ ప్రయోగంలోని చలనార్థాన్ని ప్రధాన పాఠ్యంలోనూ స్థిత్యర్థాన్ని పాదసూచికలోనూ నిలిపాం.
- issue: אֲרָם అనే భౌగోళిక నామం
  choice: అరాము
  alternative: సిరియా
  rationale: మూల భాషలోని ప్రాచీన స్థలనామాన్ని నేరుగా నిలపడం వల్ల తరువాతి కాలపు భౌగోళిక పేరును పాఠ్యంలోకి దిగుమతి చేయకుండా ఉంటాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా అనువదించాం. కథన వేగాన్ని నిలుపుతూ హీబ్రూ ‘చేతి’ రూపకాన్ని సాధ్యమైనంతవరకు కాపాడాం. వ్యక్తి, స్థలనామాలకు సాధారణ తెలుగు విభక్తి రూపాలను వాడాం.
