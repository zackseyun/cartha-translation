  yaml_path: translation/ot/judges/003/017.yaml
  text: He presented the tribute to Eglon king of Moab[a]. Now Eglon was a very fat man.
translation:
  language: te
  text: అతడు మోయాబు రాజైన ఎగ్లోనుకు కప్పం[a] సమర్పించాడు. ఎగ్లోను చాలా లావైన మనిషి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘కానుక,’ ‘బహుమతి.’ హీబ్రూ పదం మిన్హా అర్పణను లేదా కానుకను సూచించవచ్చు; అయితే ఇక్కడ అధీన ప్రజలు పాలకునికి చెల్లించే కప్పాన్ని సూచిస్తున్నట్లు సందర్భం తెలియజేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: సమర్పించాడు
  rationale: హిఫీల్ రూపం ఉన్నతాధికారికి ఏదైనా తీసుకువచ్చి సమర్పించడాన్ని సూచిస్తుంది; రాజసభ సందర్భంలో ఈ పదం సహజంగానూ మూలార్థానికి దగ్గరగానూ ఉంది.
- source_word: הַמִּנְחָה
  choice: కప్పం
  rationale: ఈ సందర్భంలో ఇశ్రాయేలు మోయాబు ఆధీనంలో ఉండి రాజుకు చెల్లించినదాన్ని సూచిస్తుంది. అందువల్ల సాధారణమైన ‘కానుక’ కంటే రాజకీయ బలవంతపు చెల్లింపు భావాన్ని ‘కప్పం’ స్పష్టంగా తెలియజేస్తుంది; ఇతర సాధ్యార్థాలను పాదసూచికలో ఉంచాం.
- source_word: לְעֶגְלוֹן מֶלֶךְ מוֹאָב
  choice: మోయాబు రాజైన ఎగ్లోనుకు
  rationale: తెలుగులో సహజమైన విశేషణ నిర్మాణంతో వ్యక్తి పేరును, రాజబిరుదును స్పష్టంగా అందిస్తుంది.
- source_word: וְעֶגְלוֹן
  choice: ఎగ్లోను
  rationale: హీబ్రూ వావ్ ఇక్కడ ఎగ్లోను గురించిన వివరణాత్మక వ్యాఖ్యను ప్రవేశపెడుతుంది. తెలుగులో ప్రత్యేక సంధానపదం లేకుండానే రెండో వాక్యం ఆ వ్యాఖ్యాత్మక మార్పును సహజంగా తెలియజేస్తుంది.
- source_word: אִישׁ
  choice: మనిషి
  rationale: ఇది ఎగ్లోను అనే నిర్దిష్ట పురుషుణ్ని సూచిస్తుంది. ‘మనిషి’ అనే సహజ తెలుగు పదం వ్యక్తిని సూచిస్తూ వాక్యాన్ని సులభంగా ఉంచుతుంది.
- source_word: בָּרִיא
  choice: లావైన
  rationale: ఈ విశేషణం ఇక్కడ శరీర లావును సూచిస్తుంది; తరువాతి కథనంలో అతని శరీరానికి ఉన్న ప్రాముఖ్యత దృష్ట్యా మృదువైన లేదా అస్పష్టమైన పదం కాకుండా ప్రత్యక్షమైన పదాన్ని ఎంచుకున్నాం.
- source_word: מְאֹד
  choice: చాలా
  rationale: హీబ్రూ తీవ్రతాసూచక క్రియావిశేషణాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
