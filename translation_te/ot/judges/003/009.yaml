- from: అప్పుడు ఇశ్రాయేలు కుమారులు[a] యాహ్వేకు మొరపెట్టారు. యాహ్వే ఇశ్రాయేలు కుమారుల కోసం ఒక విమోచకుణ్ణి[b] లేపాడు; అతడు వారిని విడిపించాడు.[c] అతడే కనజు కుమారుడైన ఒత్నీయేలు, కాలేబు తమ్ముడు.[d]
  to: అప్పుడు ఇశ్రాయేలు కుమారులు[a] యాహ్వేకు మొరపెట్టారు. యాహ్వే ఇశ్రాయేలు కుమారుల కోసం ఒక విడిపించువాణ్ణి[b] లేపాడు; అతడు వారిని విడిపించాడు—కెనజు కుమారుడైన ఒత్నీయేలు, కాలేబు తమ్ముడు.[c]
  rationale: విడిపించే క్రియతో ఒత్నీయేలు గుర్తింపును నేరుగా కలిపి, హీబ్రూ వాక్యంలోని ఉద్దేశిత మానవ విడిపించువాడిని తెలుగులో స్పష్టపరిచాం. “అతడే” వల్ల వచ్చిన అనవసర ఉద్ఘాటనను తొలగించాం. అనవసరమైన కర్త-సందిగ్ధత పాదటిప్పణిని తొలగించాం; కాలేబు సంబంధంపై వాస్తవంగా ఉన్న వాక్యనిర్మాణ ప్రత్యామ్నాయాన్ని మాత్రం నిలుపాం.
