id: JDG.3.9
reference: Judges 3:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּזְעֲק֤וּ בְנֵֽי יִשְׂרָאֵל֙ אֶל יְהוָ֔ה וַ/יָּ֨קֶם יְהוָ֥ה מוֹשִׁ֛יעַ לִ/בְנֵ֥י יִשְׂרָאֵ֖ל וַ/יּֽוֹשִׁיעֵ֑/ם אֵ֚ת עָתְנִיאֵ֣ל בֶּן קְנַ֔ז אֲחִ֥י כָלֵ֖ב הַ/קָּטֹ֥ן מִמֶּֽ/נּוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/009.yaml
  text: 'Then the sons of Israel cried out to Yahweh[a], and Yahweh raised up a deliverer for the sons of Israel, who delivered them: Othniel son of Kenaz[c][b], Caleb’s younger brother.'
translation:
  language: te
  text: అప్పుడు ఇశ్రాయేలు కుమారులు[a] యాహ్వేకు మొరపెట్టారు. యాహ్వే ఇశ్రాయేలు కుమారుల కోసం ఒక విడిపించువాణ్ణి[b] లేపాడు; అతడు వారిని విడిపించాడు—కెనజు కుమారుడైన ఒత్నీయేలు, కాలేబు తమ్ముడు.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఇశ్రాయేలీయులు.” అక్షరార్థంగా, “ఇశ్రాయేలు కుమారులు.”
    reason: lexical_alternative
  - marker: b
    text: “విడిపించువాడు” అనే పదాన్ని “రక్షకుడు” లేదా “విమోచకుడు” అని కూడా అనువదించవచ్చు. ఇక్కడ దేవుడు ఇశ్రాయేలును శత్రువుల అణచివేత నుండి విడిపించడానికి లేపిన మానవ నాయకుణ్ణి ఇది సూచిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: అక్షరార్థంగా, “కాలేబు సోదరుడు, అతనికంటే చిన్నవాడు.” సాధారణ పఠనంలో ఇది ఒత్నీయేలును కాలేబు తమ్ముడిగా గుర్తిస్తుంది. ఈ పదబంధాన్ని కెనజుతో కలిపి, కెనజే కాలేబు తమ్ముడు అని అర్థం చేసుకునే అవకాశం కూడా ఉంది.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּזְעֲקוּ
  choice: మొరపెట్టారు
  rationale: ఈ సందర్భంలో זעק తీవ్రమైన బాధలో సహాయం కోసం దేవునికి చేసే మొరను సూచిస్తుంది; ‘మొరపెట్టారు’ ఆధునిక తెలుగులో సహజంగా ఆ అత్యవసర భావాన్ని తెలియజేస్తుంది.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: హీబ్రూ కుటుంబసంబంధ రూపాన్ని నేరుగా నిలుపుతుంది; సాధారణ అర్థం ‘ఇశ్రాయేలీయులు’ అని పాదటిప్పణిలో తెలిపింది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో లిప్యంతరీకరించింది.
- source_word: וַיָּקֶם
  choice: లేపాడు
  rationale: హిఫీల్ రూపం ఒక ప్రత్యేక బాధ్యత కోసం వ్యక్తిని ముందుకు తెచ్చే భావాన్ని ఇస్తుంది; ‘లేపాడు’ మూలంలోని రూపకాన్ని నిలుపుతుంది.
- source_word: מוֹשִׁיעַ
  choice: విమోచకుడు
  rationale: ఇశ్రాయేలును అణచివేతనుంచి విడిపించడానికి దేవుడు నియమించిన మానవ నాయకుణ్ణి సూచిస్తుంది; ‘రక్షకుడు’ లేదా ‘విడిపించేవాడు’ కూడా సాధ్యమే.
- source_word: וַיּוֹשִׁיעֵם
  choice: అతడు వారిని విడిపించాడు
  rationale: ఇక్కడ ישׁע సైనిక-రాజకీయ అణచివేతనుంచి వాస్తవంగా విడిపించడాన్ని సూచిస్తుంది; సమీప సందర్భంలో విమోచకుడైన ఒత్నీయేలును కర్తగా చదవడం సహజం.
- source_word: עָתְנִיאֵל בֶּן קְנַז
  choice: కనజు కుమారుడైన ఒత్నీయేలు
  rationale: వ్యక్తినామాలను తెలుగు ధ్వన్యనుసారంగా ఇచ్చి, తండ్రి-కొడుకు సంబంధాన్ని సహజమైన తెలుగు నిర్మాణంలో వ్యక్తం చేసింది.
- source_word: אֲחִי כָלֵב הַקָּטֹן מִמֶּנּוּ
  choice: కాలేబు తమ్ముడు
  rationale: ప్రధాన పఠనంలో ఒత్నీయేలు కాలేబుకంటే చిన్నవాడైన సోదరుడు. అయితే హీబ్రూ పదబంధం అనుబంధం విషయంలో కొంత సందిగ్ధత కలిగివుండటంతో ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచింది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది. అందువల్ల బిరుదైన ‘ప్రభువు’తో భర్తీ చేయకుండా ‘యాహ్వే’గా లిప్యంతరీకరించింది.
- issue: מוֹשִׁיעַకు తగిన తెలుగు పదం
  choice: విమోచకుడు
  alternative: రక్షకుడు; విడిపించేవాడు
  rationale: న్యాయాధిపతుల సందర్భంలో ఇది దేవుడు ఇశ్రాయేలును శత్రువుల అణచివేతనుంచి విడిపించడానికి లేపిన మానవ ప్రతినిధిని సూచిస్తుంది; తరువాతి వేదాంతార్థాన్ని అనవసరంగా ముందుకు తేవకుండా సందర్భార్థాన్ని నిలుపుతుంది.
- issue: וַיּוֹשִׁיעֵםలో విడిపించే కర్త
  choice: విమోచకుడైన ఒత్నీయేలు
  alternative: యాహ్వే
  rationale: సమీపంలోని ‘విమోచకుడు’ మరియు తరువాత వచ్చే ఒత్నీయేలు పేరు కారణంగా ఒత్నీయేలే వ్యాకరణ కర్తగా చదవడం సహజం. అయినా కథనంలో అంతిమ విమోచకుడు యాహ్వే అనే భావం నిలిచేలా ప్రత్యామ్నాయ అవగాహనను పాదటిప్పణిలో నమోదు చేసింది.
- issue: אֲחִי כָלֵב הַקָּטֹן מִמֶּנּוּ యొక్క సంబంధం
  choice: ఒత్నీయేలు కాలేబు తమ్ముడు
  alternative: కనజు కాలేబు తమ్ముడు; అప్పుడు ఒత్నీయేలు కాలేబు సోదరుని కుమారుడు
  rationale: పదబంధానికి సాధారణమైన పఠనం ఒత్నీయేలును కాలేబుకంటే చిన్న సోదరునిగా గుర్తిస్తుంది. అయితే అనుబంధ నిర్మాణం మరో పఠనానికి అవకాశం ఇస్తుంది; దాన్ని పాదటిప్పణిలో స్పష్టంగా ఉంచింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే శైలి. కథన గమనాన్ని సహజంగా ఉంచుతూ హీబ్రూ కుటుంబసంబంధ పదజాలం, దైవనామం, ‘లేపాడు’ అనే రూపకం నిలుపబడ్డాయి. మూలంలోని సంభావ్య వ్యాకరణ సందిగ్ధతలు ప్రధాన వాక్యంలో బలవంతంగా విస్తరించకుండా పాదటిప్పణుల్లో నమోదు చేయబడ్డాయి.
