  text: And the sons of Israel served Eglon king of Moab for eighteen years[a].
translation:
  language: te
  text: ఇశ్రాయేలు కుమారులు మోయాబు రాజైన ఎగ్లోనుకు పద్దెనిమిది సంవత్సరాలు సేవ చేశారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, భావాన్ని మరింత స్పష్టంగా చెబితే, “ఇశ్రాయేలు కుమారులు మోయాబు రాజైన ఎగ్లోనుకు పద్దెనిమిది సంవత్సరాలు లోబడి ఉన్నారు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַבְדוּ
  choice: సేవచేశారు
  rationale: ఈ సందర్భంలో עבד అనేది ఆరాధనను కాకుండా విదేశీ రాజుకు రాజకీయంగా లోబడి సేవ చేయడాన్ని సూచిస్తుంది. ‘సేవచేశారు’ మూలంలోని రూపాన్ని నిలుపుతూ తెలుగులో సహజంగా ఉంది; సందర్భార్థాన్ని స్పష్టంచేసే ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: హెబ్రీయ సమూహవాచక నుడికారాన్ని సన్నిహితంగా ప్రతిబింబిస్తూ, మూలంలోని లింగరూపాన్ని నిలుపుతుంది.
- source_word: אֶת עֶגְלוֹן
  choice: ఎగ్లోనుకు
  rationale: אֶת ప్రత్యక్ష కర్మను సూచిస్తుంది. అయితే తెలుగు వాక్యనిర్మాణంలో ‘సేవచేశారు’ అనే క్రియతో వ్యక్తిని ‘ఎగ్లోనుకు’ అని చతుర్థీ విభక్తిలో వ్యక్తీకరించడం సహజం.
- source_word: מֶלֶךְ מוֹאָב
  choice: మోయాబు రాజైన
  rationale: హెబ్రీయ నిర్మాణాన్ని తెలుగులో సహజమైన విశేషణ సంబంధంగా వ్యక్తం చేస్తూ, ఎగ్లోను మోయాబు రాజని స్పష్టంగా తెలియజేస్తుంది.
- source_word: שְׁמוֹנֶה עֶשְׂרֵה שָׁנָה
  choice: పద్దెనిమిది సంవత్సరాలు
  rationale: హెబ్రీయ కాలవ్యవధి సూచక ద్వితీయను తెలుగులో సహజంగా కాలవ్యవధి పదబంధంతో వ్యక్తం చేస్తుంది.
