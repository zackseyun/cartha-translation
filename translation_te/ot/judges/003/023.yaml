translation:
  language: te
  text: అప్పుడు ఏహూదు బయటకు వెళ్లి ప్రవేశ మార్గంలోకి వెళ్లాడు; మేడగది తలుపులను తన వెనుక మూసి వాటికి గడియ వేశాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘వసారాలోకి,’ ‘ముందుగదిలోకి,’ లేదా ‘స్తంభాల మంటపంలోకి’; ఇక్కడి హీబ్రూ పదం అరుదైనది, పక్కనే ఉన్న నిర్మాణ స్థలాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: వెళ్లి
  rationale: יצא అనే సాధారణ నిష్క్రమణ క్రియను సందర్భానుసారంగా సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: הַמִּסְדְּרוֹנָה
  choice: ముంగిటిలోకి
  rationale: అరుదైన מִסְדְּרוֹן పక్కనే ఉన్న ప్రవేశ లేదా మధ్యంతర నిర్మాణ స్థలాన్ని సూచిస్తుంది; దిశార్థక ה కారణంగా ‘లోకి’ వాడబడింది. ఖచ్చిత నిర్మాణ స్వరూపం అనిశ్చితమైనందున ప్రత్యామ్నాయాలు పాదటిప్పణిలో ఇవ్వబడ్డాయి.
- source_word: וַיִּסְגֹּר
  choice: మూసి
  rationale: తలుపులను మూయడాన్ని సూచించే סגר కు సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: דַּלְתוֹת
  choice: తలుపులు
  rationale: మూలంలో బహువచనం ఉంది; అది రెండు తలుపులు లేదా తలుపు రెక్కలను సూచించవచ్చు. సాధారణ తెలుగులో ‘తలుపులు’ సహజం.
- source_word: הָעֲלִיָּה
  choice: మేడగది
  rationale: עֲלִיָּה పై అంతస్తులోని గదిని సూచిస్తుంది; ‘మేడగది’ సంక్షిప్తంగా, సహజంగా నిర్మాణ భావాన్ని నిలుపుతుంది.
- source_word: בַּעֲדוֹ
  choice: తన వెనుక
  rationale: మూయడం అనే క్రియతో בעד ఇక్కడ ఏహూదు బయటకు వచ్చిన తర్వాత అతని వెనుక తలుపులు మూయబడిన స్థల సంబంధాన్ని సూచిస్తుంది.
- source_word: וְנָעָל
  choice: వాటికి గడియ వేశాడు
  rationale: נעל తలుపులను బిగించడం లేదా తాళం వేయడం అనే భావం ఇస్తుంది. పురాతన తలుపుల సందర్భంలో ఆధునిక తాళపు చెవిని ఊహింపజేయకుండా ‘గడియ వేశాడు’ అనడం తగినది.
