id: JDG.17.13
reference: Judges 17:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר מִיכָ֔ה עַתָּ֣ה יָדַ֔עְתִּי כִּֽי יֵיטִ֥יב יְהוָ֖ה לִ֑/י כִּ֧י הָיָה לִ֛/י הַ/לֵּוִ֖י לְ/כֹהֵֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/017/013.yaml
  text: Then Micah said[a], “Now I know that Yahweh will do good to me, because I have a Levite as priest.”
translation:
  language: te
  text: 'అప్పుడు మీకా ఇలా అన్నాడు: “ఇప్పుడు యాహ్వే నాకు మేలు చేస్తాడని నాకు తెలుసు, ఎందుకంటే నాకు యాజకుడిగా ఒక లేవీయుడు[a] ఉన్నాడు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నాకు యాజకుడిగా ఆ లేవీయుడు ఉన్నాడు.” హీబ్రూలో “లేవీయుడు” అనే పదానికి నిర్దిష్టార్థక ఉపపదం ఉంది. అది ఇప్పటికే పరిచయమైన ప్రత్యేక లేవీయుణ్ణి సూచించవచ్చు; అయితే ఇక్కడ అతడు లేవీయుడనే హోదాపై మీకా దృష్టి పెట్టినందున “ఒక లేవీయుడు” అని కూడా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... అన్నాడు
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది; ఆధునిక తెలుగు కథన శైలిలో ‘అప్పుడు ... అన్నాడు’ సహజంగా క్రమాన్ని తెలియజేస్తుంది.
- source_word: מִיכָה
  choice: మీకా
  rationale: హీబ్రూ వ్యక్తినామాన్ని ప్రామాణిక తెలుగు లిప్యంతరీకరణలో ఇచ్చాం.
- source_word: עַתָּה
  choice: ఇప్పుడు
  rationale: మీకా ఈ దశలో చేరుకున్న ప్రస్తుత నిర్ణయాన్ని సూచించే కాలవాచకం.
- source_word: יָדַעְתִּי
  choice: నాకు తెలుసు
  rationale: పూర్తయిన గ్రహింపు వల్ల ఏర్పడిన ప్రస్తుత జ్ఞానస్థితిని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: כִּי
  choice: —
  rationale: మొదటి כִּי తెలిసిన విషయాన్ని పరిచయం చేస్తుంది. తెలుగులో ‘అని’ అని వాక్యాంతంలో పెట్టడం కంటే, ప్రత్యక్ష వాక్యంలోని భావప్రవాహానికి డాష్ సహజంగా సరిపోతుంది.
- source_word: יֵיטִיב
  choice: మేలు చేస్తాడు
  rationale: יטב హిఫీల్ రూపంలోని ‘మేలు చేయు/మంచిగా వ్యవహరించు’ అనే క్రియాభావాన్ని నిలుపుతుంది; కేవలం ఆర్థిక సమృద్ధిగా అతిగా నిర్దిష్టం చేయదు.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన టెట్రాగ్రామాటన్‌ను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తింపుపొందిన వ్యక్తినామ రూపంలో అందించాం.
- source_word: לִי
  choice: నాకు
  rationale: మేలు పొందే లబ్ధిదారుని సహజమైన తెలుగు విభక్తితో సూచిస్తుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: రెండవ כִּי మీకా నమ్మకానికి కారణాన్ని పరిచయం చేస్తుంది.
- source_word: הָיָה לִי
  choice: నాకు ... ఉన్నాడు
  rationale: అక్షరార్థంగా ‘నాకు అయ్యాడు/ఉన్నాడు’ అనే స్వాధీన-స్థితి ప్రయోగాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: הַלֵּוִי
  choice: ఒక లేవీయుడు
  rationale: హీబ్రూలో నిర్దిష్ట ఉపపదం ఉన్నప్పటికీ, మీకా ప్రాధాన్యమిచ్చేది ఆ వ్యక్తి లేవీయుడనే వర్గస్థితికి; తెలుగులో ‘ఒక లేవీయుడు’ ఈ భావాన్ని సహజంగా ఇస్తుంది. ‘ఆ లేవీయుడు’ అనే సాధ్యమైన నిర్దిష్ట అర్థాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: לְכֹהֵן
  choice: యాజకుడిగా
  rationale: లామెద్ ఇక్కడ పాత్ర లేదా విధిని సూచిస్తుంది; ‘యాజకుడిగా’ తెలుగులో సహజంగా ఆ నియామక పాత్రను తెలియజేస్తుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో వ్యక్తిగత దైవనామమే ఉంది; దానిని ‘ప్రభువు’ అనే బిరుదుతో మార్చలేదు. ఆధునిక ప్రామాణిక తెలుగు బైబిలు వాడుకలో విస్తృతంగా గుర్తింపుపొందిన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం; ‘యాహ్వే’ మూల ఉచ్చారణను పునర్నిర్మించేందుకు మరింత సమీపమైన ప్రత్యామ్నాయం.
- issue: మీకా చెప్పిన నమ్మకానికి కథనం మద్దతు ఇస్తుందా?
  choice: అతని మాటను వ్యాఖ్యానించకుండా యథాతథంగా ఉంచడం
  alternative: అతని నిర్ణయాన్ని సరైన విశ్వాసంగా లేదా వ్యంగ్యంగా స్పష్టీకరించడం
  rationale: వచనం మీకా అభిప్రాయాన్ని మాత్రమే నివేదిస్తుంది. లేవీయుణ్ణి యాజకునిగా కలిగి ఉండటం వల్ల దేవుడు తప్పక మేలు చేస్తాడనే అతని భావనను అనువాదం సమర్థించకూడదు, ఖండించకూడదు; కథనంలోని ధార్మిక ఉద్వేగాన్ని పాఠకుడికి అలాగే వదిలాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా, అయితే గౌరవభరితమైన బైబిలు కథన శైలిని నిలిపాం. హీబ్రూ వాక్యంలోని కారణ సంబంధాన్ని స్పష్టంగా ఉంచి, మీకా మాటపై అదనపు ధార్మిక వ్యాఖ్యానాన్ని చేర్చలేదు. పాదటిప్పణి సూచిక [a] ప్రధాన పాఠ్యంలో ఉంది.
