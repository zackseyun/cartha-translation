translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన సంభాషణ శైలిని, కథనానికి తగిన గౌరవప్రదమైన సరళతను పాటించాం. హెబ్రీలో అంతర్లీనంగా ఉన్న ‘చోటు’ను తెలుగులో స్పష్టత కోసం చేర్చాం; גור పదంలోని తాత్కాలిక లేదా పరదేశి నివాస భావాన్ని ప్రధాన పాఠ్యంలో అతిగా నిర్దిష్టం చేయకుండా పాదసూచికలో సంరక్షించాం.
