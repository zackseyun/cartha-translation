source:
  edition: WLC
  text: וַ/יֹּאמֶר ל֥/וֹ מִיכָ֖ה מֵ/אַ֣יִן תָּב֑וֹא וַ/יֹּ֨אמֶר אֵלָ֜י/ו לֵוִ֣י אָנֹ֗כִי מִ/בֵּ֥ית לֶ֨חֶם֙ יְהוּדָ֔ה וְ/אָנֹכִ֣י הֹלֵ֔ךְ לָ/ג֖וּר בַּ/אֲשֶׁ֥ר אֶמְצָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/017/009.yaml
  text: Micah said to him[a], “Where do you come from?” And he said to him, “I am a Levite from Bethlehem in Judah, and I am going to sojourn wherever I may find a place.”
translation:
  language: te
  text: మీకా అతనితో, “నువ్వు ఎక్కడి నుంచి వస్తున్నావు?” అని అడిగాడు. అతడు, “నేను యూదాలోని బేత్లెహేముకు చెందిన లేవీయుణ్ణి. నాకు ఎక్కడ చోటు దొరికితే అక్కడ నివసించడానికి[a] వెళ్తున్నాను” అని అతనితో చెప్పాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘పరదేశిగా ఉండడానికి’ లేదా ‘తాత్కాలికంగా నివసించడానికి’ అని కూడా అనువదించవచ్చు. ఈ క్రియ తరచుగా ఒకచోట శాశ్వత హక్కుగలవానిగా కాకుండా, బయటి వ్యక్తిగా లేదా ఇతరులపై ఆధారపడిన నివాసిగా ఉండే భావాన్ని కలిగి ఉంటుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵאַיִן
  choice: ఎక్కడి నుంచి వస్తున్నావు?
  rationale: ఇది వచ్చిన స్థలాన్ని లేదా మూలాన్ని ప్రశ్నిస్తుంది. ఆధునిక తెలుగులో సహజంగా ఉండే ఈ రూపం హెబ్రీ ప్రశ్న భావాన్ని నిలుపుతుంది.
- source_word: לֵוִי
  choice: లేవీయుణ్ణి
  rationale: లేవి గోత్రానికి చెందిన వ్యక్తి అనే గుర్తింపును తెలుగులో సహజమైన స్వీయపరిచయ రూపంలో వ్యక్తపరుస్తుంది.
- source_word: מִבֵּית לֶחֶם יְהוּדָה
  choice: యూదాలోని బేత్లెహేముకు చెందిన
  rationale: ఇది యూదా ప్రాంతంలోని బేత్లెహేమును సూచిస్తుంది. ఇతర బేత్లెహేము నుండి భౌగోళికంగా వేరుచేసే భావం స్పష్టంగా ఉంటుంది.
- source_word: הֹלֵךְ
  choice: వెళ్తున్నాను
  rationale: కొనసాగుతున్న లేదా ఉద్దేశించిన ప్రయాణాన్ని తెలిపే హెబ్రీ కృదంత భావాన్ని సహజంగా ప్రతిబింబిస్తుంది.
- source_word: לָגוּר
  choice: నివసించడానికి
  rationale: גור అనే క్రియ ఒకచోట, తరచుగా పరదేశిగా లేదా ఆధారిత నివాసిగా, ఉండే భావాన్ని కలిగి ఉంది. ప్రధాన పాఠ్యంలో సరళమైన ఆధునిక పదాన్ని ఉపయోగించి, దాని విశాల భావాన్ని పాదసూచికలో తెలిపాం.
- source_word: בַּאֲשֶׁר אֶמְצָא
  choice: నాకు ఎక్కడ చోటు దొరికితే అక్కడ
  rationale: హెబ్రీలో కర్మ ప్రత్యక్షంగా చెప్పబడలేదు. తెలుగులో వాక్యం సహజంగా, స్పష్టంగా ఉండేందుకు సందర్భం సూచించే ‘చోటు’ను చేర్చాం; అనిశ్చితమైన, అవకాశాధారిత భావాన్ని ‘ఎక్కడ ... దొరికితే అక్కడ’ నిలుపుతుంది.
