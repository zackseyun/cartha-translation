  yaml_path: translation/ot/judges/017/004.yaml
  text: So he returned the silver to his mother[a], and his mother took two hundred pieces of silver and gave it to the silversmith, and he made it into a carved image and a cast image[c][b], and it was in the house of Micah.
translation:
  language: te
  text: అప్పుడు అతడు ఆ వెండిని తన తల్లికి తిరిగి ఇచ్చాడు. అతని తల్లి రెండువందల వెండిని[a] తీసుకొని వెండి పనివానికి ఇచ్చింది. అతడు దానితో ఒక చెక్కిన ప్రతిమను, ఒక పోతపోసిన ప్రతిమను[b] చేశాడు. అది[c] మీకా ఇంట్లో ఉండింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘రెండువందల వెండి షెకెలులను.’ ఈ వచనంలోని హీబ్రూ పాఠం కొలమానపు పేరును చెప్పకుండా అక్షరార్థంగా ‘రెండువందల వెండి’ అని మాత్రమే అంటుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘ఒక చెక్కిన విగ్రహాన్ని, ఒక పోతవిగ్రహాన్ని.’
    reason: lexical_alternative
  - marker: c
    text: ‘చెక్కిన ప్రతిమను, పోతపోసిన ప్రతిమను’ అన్న తరువాత హీబ్రూ పాఠం ‘అది ఉండింది’ అని ఏకవచన క్రియను ఉపయోగిస్తుంది; తయారైన వస్తువును లేదా జతను ఒక ఏకకంగా పరిగణించి ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׁב
  choice: తిరిగి ఇచ్చాడు
  rationale: హిఫిల్ రూపంలోని שׁוב వెండిని మునుపటి యజమానికి తిరిగి చేర్చడాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘తిరిగి ఇచ్చాడు’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: הַכֶּסֶף
  choice: ఆ వెండి
  rationale: כֶּסֶף ‘వెండి’ లేదా ‘డబ్బు’ అని అర్థమవుతుంది. తరువాత దానితో ప్రతిమ చేయబడినందున ఇక్కడ లోహార్థమైన ‘వెండి’ సముచితం.
- source_word: מָאתַיִם כֶּסֶף
  choice: రెండువందల వెండి నాణాలు
  rationale: హీబ్రూలో కొలమానపు పేరు స్పష్టంగా లేదు. సహజమైన తెలుగుకోసం ‘నాణాలు’ వాడి, ‘షెకెలులు’ అనే సాధ్యమైన అర్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: לַצּוֹרֵף
  choice: కంసాలికి
  rationale: צֹרֵף లోహాన్ని శుద్ధిచేసే లేదా మలిచే పనివాడిని సూచిస్తుంది. తెలుగు సాధారణ వాడుకలో ‘కంసాలి’ ఈ సందర్భానికి సహజమైన వృత్తిపదం.
- source_word: וַיַּעֲשֵׂהוּ
  choice: అతడు దానితో ... చేశాడు
  rationale: పుంలింగ ఏకవచన క్రియకు సమీప కర్త కంసాలి; వెండిని ఆయా రూపాలుగా మలిచాడనే భావాన్ని ‘దానితో’ తెలియజేస్తుంది.
- source_word: פֶּסֶל
  choice: ఒక చెక్కిన ప్రతిమ
  rationale: פֶּסֶל సాధారణంగా చెక్కి రూపొందించిన ఆరాధనా ప్రతిమను సూచిస్తుంది. ‘విగ్రహం’కన్నా మూలపదంలోని తయారీ విధానాన్ని ‘చెక్కిన ప్రతిమ’ నేరుగా నిలుపుతుంది.
- source_word: וּמַסֵּכָה
  choice: ఒక పోతపోసిన ప్రతిమ
  rationale: מַסֵּכָה కరిగించిన లోహాన్ని అచ్చులో పోసి చేసిన ప్రతిమను సూచిస్తుంది; ‘పోతపోసిన’ ఆధునిక తెలుగులో ఆ విధానాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: וַיְהִי בְּבֵית מִיכָיְהוּ
  choice: అది మీకా ఇంట్లో ఉండింది
  rationale: రెండు ప్రతిమపదాల తరువాత కూడా హీబ్రూ క్రియ ఏకవచనంలో ఉంది. తయారైన వస్తువును లేదా సముదాయాన్ని ఒక ఏకకంగా సూచించే ఈ నిర్మాణాన్ని ‘అది’తో నిలిపాం.
- source_word: מִיכָיְהוּ
  choice: మీకా
  rationale: న్యాయాధిపతులు గ్రంథంలోని ఈ వ్యక్తికి తెలుగులో సహజమైన, ప్రాచుర్యంలో ఉన్న రూపం ‘మీకా’.
theological_decisions:
- issue: פֶּסֶל וּמַסֵּכָהను ప్రత్యక్షంగా ఖండనాత్మక పదాలతో అనువదించాలా?
  choice: చెక్కిన ప్రతిమను, పోతపోసిన ప్రతిమను
  alternative: విగ్రహాన్ని, పోతవిగ్రహాన్ని
  rationale: విస్తృత సందర్భంలో ఇవి అక్రమ ఆరాధనకు సంబంధించినవైనా, ఈ వచనంలోని నామపదాలు ప్రధానంగా వస్తువుల స్వరూపం, తయారీ విధానాన్ని తెలుపుతాయి. అందువల్ల అదనపు ఖండనను చేర్చకుండా మూలంలోని పదార్థాన్ని నిలిపాం.
- issue: రెండు ప్రతిమపదాల తరువాత ఉన్న ఏకవచన క్రియను ఎలా నిలపాలి?
  choice: అది ... ఉండింది
  alternative: అవి ... ఉండేవి
  rationale: మూలంలోని ఏకవచనాన్ని కాపాడి, తయారైన వస్తువును లేదా జతను ఒక సమగ్ర ఏకకంగా చూడగల అస్పష్టతను పరిష్కరించకుండా ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. మూలంలోని ‘తల్లి’ పునరుక్తిని నిలిపి, రెండు తయారీ పదాల మధ్య భేదాన్ని స్పష్టంగా ఉంచాం. ‘అది’ అనే ఏకవచనం కొంత గుర్తించదగినదైనా హీబ్రూ వాక్యనిర్మాణాన్ని ఉద్దేశపూర్వకంగా కాపాడుతుంది.
