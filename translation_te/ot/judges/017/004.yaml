revisions:
- from: అప్పుడు అతడు ఆ వెండిని తన తల్లికి తిరిగి ఇచ్చాడు. అతని తల్లి రెండువందల వెండి నాణాలను[a] తీసుకొని కంసాలికి ఇచ్చింది. అతడు దానితో ఒక చెక్కిన ప్రతిమను, ఒక పోతపోసిన ప్రతిమను[b] చేశాడు. అది[c] మీకా ఇంట్లో ఉండింది.
