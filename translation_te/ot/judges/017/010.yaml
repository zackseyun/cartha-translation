revisions:
- from: మీకా అతనితో, “నాతో నివసించు; నాకు తండ్రిగా, యాజకుడిగా ఉండు. నేను నీకు సంవత్సరానికి పది వెండి నాణేలు[a], ఒక జత బట్టలు[b], నీ జీవనానికి కావలసినదంతా ఇస్తాను” అన్నాడు. అప్పుడు ఆ లేవీయుడు వెళ్లాడు[c].
  to: మీకా అతనితో, “నాతో నివసించు; నాకు తండ్రిగా, యాజకుడిగా ఉండు. నేను నీకు సంవత్సరానికి పది వెండి ముక్కలు[a], ఒక దుస్తుల సమకూర్పు[b], నీ జీవనాధారం ఇస్తాను” అన్నాడు. అప్పుడు ఆ లేవీయుడు వెళ్లాడు[c].
  rationale: సవరణలు మూల హీబ్రూలో ఉద్దేశపూర్వకంగా పేర్కొనబడని వెండి రూపం/కొలమానాన్ని మరియు జీవనపోషణకు సంబంధించిన విస్తృత భావాన్ని కాపాడతాయి. ‘తండ్రిగా’ అనే గౌరవార్థక రూపకం, ‘యాజకుడు,’ చివరి క్రియలోని సందర్భగత అస్పష్టత, అలాగే అన్ని పాదసూచిక గుర్తులు యథావిధిగా నిలిచాయి.
