source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ ל֨/וֹ מִיכָ֜ה שְׁבָ֣/ה עִמָּדִ֗/י וֶֽ/הְיֵה לִ/י֮ לְ/אָ֣ב וּ/לְ/כֹהֵן֒ וְ/אָנֹכִ֨י אֶֽתֶּן לְ/ךָ֜ עֲשֶׂ֤רֶת כֶּ֨סֶף֙ לַ/יָּמִ֔ים וְ/עֵ֥רֶךְ בְּגָדִ֖ים וּ/מִחְיָתֶ֑/ךָ וַ/יֵּ֖לֶךְ הַ/לֵּוִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/017/010.yaml
  text: Micah said to him[a], “Stay with me, and be a father and a priest to me, and I will give you ten pieces of silver a year, a set of clothes[c][b], and your living.” So the Levite went in.
translation:
  language: te
  text: మీకా అతనితో, “నాతో నివసించు; నాకు తండ్రిగా, యాజకుడిగా ఉండు. నేను నీకు సంవత్సరానికి పది వెండి ముక్కలు[a], ఒక దుస్తుల సమకూర్పు[b], నీ జీవనాధారం ఇస్తాను” అన్నాడు. అప్పుడు ఆ లేవీయుడు వెళ్లాడు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ మూలంలో అక్షరార్థంగా ‘పది వెండి’ అని ఉంది; కొలమానం పేర్కొనబడలేదు. ‘పది వెండి షెకెలులు’ అనేది సాధారణ వ్యాఖ్యానాత్మక అనువాదం.
    reason: lexical_alternative
  - marker: b
    text: లేదా “బట్టల భత్యం.”
    reason: lexical_alternative
  - marker: c
    text: లేదా సందర్భానుసారం “లోపలికి వెళ్లాడు.” హీబ్రూ క్రియ అక్షరార్థంగా “వెళ్లాడు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁבָה עִמָּדִי
  choice: నాతో నివసించు
  rationale: ישב ఆజ్ఞారూపం ఇక్కడ మీకాతో స్థిరంగా ఉండమనే ఆహ్వానం; ఆధునిక తెలుగులో ‘నివసించు’ ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: לְאָב וּלְכֹהֵן
  choice: తండ్రిగా, యాజకుడిగా
  rationale: ‘తండ్రి’ అనే మూలపాఠంలోని గౌరవసూచక కుటుంబ రూపకాన్ని అలాగే ఉంచుతూ, כֹהֵןను నేరుగా ‘యాజకుడు’గా అనువదించింది.
- source_word: עֲשֶׂרֶת כֶּסֶף
  choice: పది వెండి నాణేలు
  rationale: హీబ్రూలో వెండి పరిమాణ ప్రమాణం పేర్కొనబడలేదు. ‘షెకెలులు’ అని చేర్చకుండా, సాధారణ పాఠకునికి అర్థమయ్యేలా ‘వెండి నాణేలు’ అని ఇచ్చింది; అస్పష్టతను పాదసూచికలో తెలిపింది.
- source_word: לַיָּמִים
  choice: సంవత్సరానికి
  rationale: ఈ హీబ్రూ ప్రయోగం వార్షిక చెల్లింపును సూచిస్తుంది; ‘సంవత్సరానికి’ సహజమైన తెలుగు.
- source_word: וְעֵרֶךְ בְּגָדִים
  choice: ఒక జత బట్టలు
  rationale: ఈ క్లిష్ట పదబంధం బట్టల సమకూర్పు లేదా బట్టల భత్యాన్ని సూచించవచ్చు. ప్రధాన పాఠంలో స్పష్టమైన సాధారణ అర్థాన్ని ఇచ్చి, ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచింది.
- source_word: וּמִחְיָתֶךָ
  choice: నీ జీవనానికి కావలసినదంతా
  rationale: מִחְיָה ఆహారానికే పరిమితం కాకుండా పోషణ లేదా జీవనాధారాన్ని సూచిస్తుంది; తెలుగు వాక్యంలో విస్తృత భావాన్ని సహజంగా వ్యక్తం చేసింది.
- source_word: וַיֵּלֶךְ הַלֵּוִי
  choice: ఆ లేవీయుడు వెళ్లాడు
  rationale: మూల క్రియ యొక్క ప్రాథమిక అర్థమైన ‘వెళ్లాడు’నే నిలిపింది. సందర్భంలో ఇంటిలోకి వెళ్లాడనే భావం ఉండవచ్చును గాని దానిని ప్రధాన పాఠంలో నిర్బంధించలేదు.
theological_decisions:
- issue: అనధికార ఆరాధనా స్థల సందర్భంలో ‘తండ్రి’ అనే గౌరవపదం
  choice: ‘తండ్రిగా’ అనే రూపకాన్ని యథాతథంగా ఉంచడం
  alternative: సలహాదారుగా / ఆధ్యాత్మిక తండ్రిగా
  rationale: మూలపాఠం కుటుంబ సంబంధ రూపకాన్నే స్పష్టంగా వాడుతుంది. దానిని నిలుపుకోవడం వల్ల తరువాతి మతపరమైన పదజాలాన్ని దిగుమతి చేయకుండా సామాజిక-మతపరమైన పాత్ర కనిపిస్తుంది.
- issue: వెండి కొలమానం పేర్కొనబడకపోవడం
  choice: ప్రధాన పాఠంలో ‘షెకెలులు’ అని పేర్కొనకపోవడం
  alternative: పది వెండి షెకెలులు
  rationale: మూల హీబ్రూ కొలమానాన్ని చెప్పదు; కాబట్టి సంప్రదాయంగా ఊహించిన ప్రమాణాన్ని పాఠంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘తండ్రి’ అనే ఉద్దేశపూర్వక రూపకాన్ని నిలిపి, వెండి కొలమానం మరియు చివరి క్రియలోని అస్పష్టతలను పాదసూచికల్లో సంరక్షించింది.
