source:
  edition: WLC
  text: בַּ/יָּמִ֣ים הָ/הֵ֔ם אֵ֥ין מֶ֖לֶךְ בְּ/יִשְׂרָאֵ֑ל אִ֛ישׁ הַ/יָּשָׁ֥ר בְּ/עֵינָ֖י/ו יַעֲשֶֽׂה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/017/006.yaml
  text: In those days there was no king in Israel[a]; each man did what was right in his own eyes.
translation:
  language: te
  text: ఆ రోజుల్లో ఇశ్రాయేలులో రాజు లేడు; ప్రతి ఒక్కరూ తమ దృష్టిలో ఏది సరైనదో అదే చేసేవారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “ప్రతి మనిషి తన కళ్లలో సరైనదాన్ని చేసేవాడు.” హెబ్రీలోని ఏకవచన పుంలింగ పదమైన “మనిషి” ఇక్కడ ప్రతినిధి భావంలో వాడబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיָּמִים הָהֵם
  choice: ఆ రోజుల్లో
  rationale: కథనంలోని గతకాల నేపథ్యాన్ని సూచించే సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: אֵין מֶלֶךְ בְּיִשְׂרָאֵל
  choice: ఇశ్రాయేలులో రాజు లేడు
  rationale: రాజు లేకపోవడాన్ని మూలంలోని అస్తిత్వనిరాకరణకు అనుగుణంగా సరళంగా తెలియజేస్తుంది.
- source_word: אִישׁ
  choice: ప్రతి ఒక్కరూ
  rationale: ఏకవచన పుంలింగ పదం ఇక్కడ ప్రతినిధి, పంపిణీ భావంలో ‘ఒక్కొక్కరు/ప్రతి ఒక్కరూ’ అని సూచిస్తుంది; తెలుగులో సహజంగా సమస్త ప్రజలను కలుపుతుంది.
- source_word: הַיָּשָׁר
  choice: ఏది సరైనదో
  rationale: יָשָׁר లోని ‘సరి/న్యాయం/నిటారుతనం’ అనే మూల భావాన్ని ఈ సందర్భంలో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בְּעֵינָיו
  choice: తమ దృష్టికి
  rationale: వ్యక్తిగత నిర్ణయ ప్రమాణాన్ని సూచించే ‘తన కళ్లలో’ అనే హెబ్రీయ నుడికారానికి సహజ తెలుగు సమానార్థకం; ‘ప్రతి ఒక్కరూ’తో తెలుగు సంఖ్యాన్వయం కోసం గౌరవ/సామాన్య బహువచనం వాడబడింది.
- source_word: יַעֲשֶׂה
  choice: చేసేవారు
  rationale: అసంపూర్ణ క్రియారూపం ఈ కథన సారాంశంలో అలవాటుగా కొనసాగిన గత చర్యను సూచిస్తుంది; తెలుగు అలవాటు భూతకాల రూపం దానిని స్పష్టంగా అందిస్తుంది.
theological_decisions:
- issue: ఇశ్రాయేలు పరిస్థితిపై కథకుని మూల్యాంకనం—రాజరికాన్ని సంపూర్ణ పరిష్కారంగా ప్రకటించకపోవడం
  choice: రాజు లేకపోవడాన్ని, ప్రజలు తమ సొంత దృష్టినే ప్రమాణంగా చేసుకోవడాన్ని నేరుగా వర్ణించడం
  alternative: దీనిని కేవలం తటస్థ చారిత్రక గమనికగా చేయడం, లేదా రాజరికమే దేవశాస్త్రీయంగా తప్పనిసరి పరిష్కారం అని విస్తరించడం
  rationale: న్యాయాధిపతుల గ్రంథంలో పునరావృతమయ్యే ఈ మాట సామాజిక, ఆధ్యాత్మిక అవ్యవస్థను విమర్శాత్మకంగా సూచిస్తుంది. అయితే రాజరికం గురించిన సంపూర్ణ సిద్ధాంతాన్ని ఈ వాక్యం స్వయంగా ప్రకటించదు; అందువల్ల మూలంలోని ఉద్వేగం అలాగే ఉంచబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయితే వాక్యపు గంభీరమైన కథన ధోరణి మరియు నైతిక ఉద్వేగం నిలిచేలా రూపొందించబడింది.
