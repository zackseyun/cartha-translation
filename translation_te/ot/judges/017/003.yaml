  yaml_path: translation/ot/judges/017/003.yaml
  text: So he returned the eleven hundred pieces of silver to his mother[a], and his mother said, “I had solemnly dedicated the silver to Yahweh from my hand for my son, to make a carved image and a cast image[b]; so now I return it to you.”
translation:
  language: te
  text: 'అతడు ఆ వెయ్యి నూరు వెండి నాణేలను తన తల్లికి తిరిగి ఇచ్చాడు. అప్పుడు అతని తల్లి ఇలా చెప్పింది: “నా కుమారుని కోసం చెక్కిన విగ్రహాన్నీ పోసిన విగ్రహాన్నీ చేయించడానికి, నేను ఈ వెండిని నా చేతిలోనుండి యెహోవాకు నిజంగా ప్రతిష్ఠించాను. ఇప్పుడు దీనిని నీకు తిరిగి ఇస్తున్నాను.”'
