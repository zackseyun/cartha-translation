  yaml_path: translation/ot/judges/017/011.yaml
  text: So the Levite agreed to stay with the man[b][a], and the young man became like one of his sons to him.
translation:
  language: te
  text: కాబట్టి ఆ లేవీయుడు ఆ మనిషితో నివసించడానికి ఒప్పుకున్నాడు[a]. ఆ యువకుడు అతనికి అతని కుమారుల్లో ఒకడిలా అయ్యాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆ మనిషితో నివసించడానికి సుముఖుడయ్యాడు.’
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ వాక్యనిర్మాణం అక్షరార్థంగా, ‘ఆ యువకుడు అతనికి అతని కుమారుల్లో ఒకడిలా అయ్యాడు.’ అంటే మీకా ఆ లేవీయుణ్ణి తన ఇంటివారిలో ఒకడిగా చూసుకున్నాడని భావం.
    reason: cultural_note
lexical_decisions:
- source_word: וַיּוֹאֶל
  choice: ఒప్పుకున్నాడు
  rationale: యאל్ హిఫిల్ రూపం ఇక్కడ సమ్మతి లేదా సుముఖతను సూచిస్తుంది. సందర్భంలో మీకా చేసిన ప్రతిపాదనను అంగీకరించడాన్ని ‘ఒప్పుకున్నాడు’ సహజంగా తెలియజేస్తుంది.
- source_word: הַלֵּוִי
  choice: ఆ లేవీయుడు
  rationale: ఇప్పటికే పరిచయమైన వ్యక్తిని సూచించే నిర్దిష్ట నామవాచకం. ‘లేవీయుడు’ మూలంలోని గోత్ర/వర్గ గుర్తింపును ఖచ్చితంగా నిలుపుతుంది.
- source_word: לָשֶׁבֶת
  choice: నివసించడానికి
  rationale: ישׁב అనే క్రియకు కూర్చోవడం, ఉండడం, నివసించడం అనే భావాలు ఉన్నాయి. ఇక్కడ మీకా ఇంటిలో స్థిరంగా ఉండే సందర్భం కావడంతో ‘నివసించడానికి’ స్పష్టంగా సరిపోతుంది.
- source_word: אֶת הָאִישׁ
  choice: ఆ మనిషితో
  rationale: ישׁבతో కూడిన אֶת ఇక్కడ సహవాసాన్ని సూచిస్తుంది. తెలుగులో ‘తో’ అనే విభక్తి ఆ అనుబంధాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וַיְהִי
  choice: అయ్యాడు
  rationale: היה ఇక్కడ ఏర్పడిన స్థితిని సూచిస్తుంది. ‘అయ్యాడు’ ఆ పరిణామాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది; కేవలం ‘ఉన్నాడు’ అని చెప్పడం కంటే మూలానికి దగ్గరగా ఉంటుంది.
- source_word: הַנַּעַר
  choice: ఆ యువకుడు
  rationale: נַעַר పదం బాలుడు, యువకుడు లేదా సేవకుడు అనే పరిధి కలిగి ఉంటుంది. స్వతంత్రంగా వ్యవహరిస్తున్న ఈ లేవీయునికి ‘యువకుడు’ సందర్భోచితం.
- source_word: כְּאַחַד מִבָּנָיו
  choice: తన కుమారుల్లో ఒకడిలా
  rationale: כְּ అనే ఉపమాన సూచకాన్ని ‘లా’ స్పష్టంగా నిలుపుతుంది. ‘కుమారుల్లో ఒకడు’ అనే నిర్మాణం מִבָּנָיו యొక్క భాగసూచక భావాన్ని సహజ తెలుగులో అందిస్తుంది.
