translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. మూలంలోని ఉపమానం, వ్యక్తుల మధ్య సంబంధాన్ని తెలిపే ‘అతనికి’, అలాగే సమ్మతి/సుముఖతలోని స్వల్ప అర్థభేదం నిలుపబడ్డాయి.
