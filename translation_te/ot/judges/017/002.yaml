  text: וַ/יֹּ֣אמֶר לְ/אִמּ֡/וֹ אֶלֶף֩ וּ/מֵאָ֨ה הַ/כֶּ֜סֶף אֲשֶׁ֣ר לֻֽקַּֽח לָ֗/ךְ ו/אתי אָלִית֙ וְ/גַם֙ אָמַ֣רְתְּ בְּ/אָזְנַ֔/י הִנֵּֽה הַ/כֶּ֥סֶף אִתִּ֖/י אֲנִ֣י לְקַחְתִּ֑י/ו וַ/תֹּ֣אמֶר אִמּ֔/וֹ בָּר֥וּךְ בְּנִ֖/י לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/017/002.yaml
  text: And he said to his mother[a], “The eleven hundred pieces of silver that were taken from you, about which you uttered a curse and also spoke in my hearing—look, the silver is with me; I took it.” And his mother said[b], “Blessed be my son by Yahweh.”
translation:
  language: te
  text: 'అతడు తన తల్లితో ఇలా అన్నాడు: “నీ దగ్గర నుంచి తీసుకోబడిన ఆ పదకొండు వందల వెండి ముక్కల విషయమై నువ్వు శాపం పలికావు[a], నా వినికిడిలో కూడా దాని గురించి చెప్పావు. ఇదిగో, ఆ వెండి నా దగ్గరే ఉంది; దాన్ని తీసుకున్నది నేనే.” అప్పుడు అతని తల్లి, “యాహ్వే చేత నా కుమారుడు ఆశీర్వదించబడుగాక” అంది.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నువ్వు ప్రమాణం చేశావు.” ఇక్కడి హెబ్రీ క్రియ ప్రమాణాన్ని లేదా శాపాన్ని సూచించగలదు; ఈ సందర్భంలో “శాపం పలికావు” అనే భావం ఎక్కువగా సరిపోతుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థానికి దగ్గరగా, “నా కుమారుడు యాహ్వేకు/యాహ్వే చేత ఆశీర్వదించబడినవాడు.” ఇది సంక్షిప్తమైన హెబ్రీ ఆశీర్వాద సూత్రం.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶלֶף וּמֵאָה הַכֶּסֶף
  choice: వెయ్యినూటి వెండి ముక్కలు
  rationale: హెబ్రీ పాఠంలో వెండి పరిమాణం ఉంది గాని ‘షెకెలులు’ అనే ప్రమాణం స్పష్టంగా లేదు. అందువల్ల ప్రమాణాన్ని చేర్చకుండా, సాధారణ పాఠకునికి అర్థమయ్యేలా ‘వెండి ముక్కలు’ అని అనువదించాం.
- source_word: לֻקַּח לָךְ
  choice: నీ దగ్గర నుంచి తీసుకోబడిన
  rationale: לקח క్రియ యొక్క కర్మణి రూపాన్ని అనుసరించి ‘తీసుకోబడిన’ అని ఉంచాం. సందర్భంలో దొంగతనం భావం ఉన్నప్పటికీ, మూలపాఠంలో లేని ‘దొంగిలించబడిన’ అనే నిర్దిష్టతను చేర్చలేదు.
- source_word: וְאַתִּי אָלִית
  choice: నువ్వు శాపం పలికావు
  rationale: אלה అనే క్రియ ప్రమాణాన్ని లేదా శాపాన్ని సూచించగలదు. పోయిన వెండి గురించిన ఈ సందర్భంలో శాపం అనే భావమే బలంగా కనిపిస్తుంది; అయినా ప్రత్యామ్నాయ భావాన్ని పాదసూచికలో నిలిపాం.
- source_word: וְגַם אָמַרְתְּ בְּאָזְנַי
  choice: అది నా చెవిన పడేలా కూడా మాట్లాడావు
  rationale: ‘నా చెవుల్లో చెప్పావు’ అనే హెబ్రీ నుడికారాన్ని సహజమైన ఆధునిక తెలుగులో, అతడు స్వయంగా విన్నాడనే భావంతో అందించాం.
- source_word: הִנֵּה
  choice: ఇదిగో
  rationale: శ్రోత దృష్టిని వెంటనే ఆకర్షించే మూలపాఠంలోని సూచనాత్మక బలాన్ని సహజమైన తెలుగు మాట ‘ఇదిగో’ నిలుపుతుంది.
- source_word: הַכֶּסֶף אִתִּי
  choice: ఆ వెండి నా దగ్గరే ఉంది
  rationale: ‘వెండి నాతో ఉంది’ అనే మూల నిర్మాణాన్ని సహజ తెలుగులో వ్యక్తపరుస్తూ, ‘ఏ’ ద్వారా ఒప్పుకోలులోని ఉద్ఘాటనను చూపించాం.
- source_word: אֲנִי לְקַחְתִּיו
  choice: దాన్ని తీసుకున్నది నేనే
  rationale: హెబ్రీలోని ప్రత్యేక కర్తృసర్వనామం אֲנִי ఇచ్చే ఉద్ఘాటనను ‘నేనే’ స్పష్టంగా నిలుపుతుంది.
- source_word: בָּרוּךְ בְּנִי לַיהוָה
  choice: యెహోవా చేత నా కుమారుడు ఆశీర్వదించబడుగాక
  rationale: సంక్షిప్త హెబ్రీ ఆశీర్వాద సూత్రాన్ని తెలుగులో సహజమైన కోరికార్థక రూపంలో ఇచ్చాం. לַיהוָה సంబంధం లేదా కర్తృత్వాన్ని సూచించే సంక్షిప్తత కలిగి ఉన్నందున దాని అస్పష్టతను పాదసూచికలో తెలిపాం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన నాలుగు అక్షరాల పేరును బిరుదుతో మార్చకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో లిప్యంతరీకరించాం.
theological_decisions:
- issue: 'אלה అనే పదం: శాపమా, ప్రమాణమా'
  choice: శాపం పలికావు
  alternative: ప్రమాణం చేశావు
  rationale: తప్పిపోయిన వెండి, కుమారుని ఒప్పుకోలు, తల్లి వెంటనే పలికిన ఆశీర్వాదం అనే కథాసందర్భం శాప భావానికి ప్రాధాన్యం ఇస్తుంది; అయితే పదానికి ఉన్న ప్రమాణ భావాన్ని పూర్తిగా తొలగించకుండా పాదసూచికలో ఇచ్చాం.
- issue: בָּרוּךְ בְּנִי לַיהוָה అనే ఆశీర్వాద సూత్రం
  choice: యెహోవా చేత నా కుమారుడు ఆశీర్వదించబడుగాక
  alternative: నా కుమారుడు యెహోవాకు ఆశీర్వదించబడినవాడు
  rationale: לַיהוָה యొక్క సంక్షిప్త సంబంధాన్ని కర్తృత్వంగా చదవడం సందర్భంలో సహజం. అయినా హెబ్రీ సూత్రంలోని ‘యెహోవాకు/యెహోవా చేత’ అనే వ్యాకరణ సంక్షిప్తతను పాదసూచికలో స్పష్టంచేశాం.
- issue: יְהוָה దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠం సాధారణ బిరుదును కాక దైవనామాన్ని ఉపయోగిస్తుంది. కాబట్టి పేరును బిరుదుగా మార్చకుండా తెలుగులో స్థిరపడిన లిప్యంతరీకరణను వాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, కుటుంబ సంభాషణకు తగిన సహజత్వంతో పాటు వాక్యానికి గంభీరతను నిలిపాం. ‘ఇదిగో,’ ‘నేనే’ వంటి రూపాలు ఒప్పుకోలులోని నాటకీయ ఉద్ఘాటనను చూపుతాయి. మూలంలో లేని ‘దొంగిలించు,’ ‘షెకెలు’ వంటి నిర్దిష్ట పదాలను ప్రధాన పాఠంలో చేర్చలేదు.
