- from: అతడు తన తల్లితో, “నీ దగ్గర నుంచి తీసుకోబడిన వెయ్యినూటి వెండి ముక్కల గురించి నువ్వు శాపం పలికావు[a]; అది నా చెవిన పడేలా కూడా మాట్లాడావు. ఇదిగో, ఆ వెండి నా దగ్గరే ఉంది; దాన్ని తీసుకున్నది నేనే” అన్నాడు. అప్పుడు అతని తల్లి, “యెహోవా చేత నా కుమారుడు ఆశీర్వదించబడుగాక” అంది.[b]
  to: 'అతడు తన తల్లితో ఇలా అన్నాడు: “నీ దగ్గర నుంచి తీసుకోబడిన ఆ పదకొండు వందల వెండి ముక్కల విషయమై నువ్వు శాపం పలికావు[a], నా వినికిడిలో కూడా దాని గురించి చెప్పావు. ఇదిగో, ఆ వెండి నా దగ్గరే ఉంది; దాన్ని తీసుకున్నది నేనే.” అప్పుడు అతని తల్లి, “యాహ్వే చేత నా కుమారుడు ఆశీర్వదించబడుగాక” అంది.[b]'
  rationale: The revision aligns the divine name with the required Yahweh policy, improves the expression of the number and the hearing idiom in modern standard Telugu, and preserves the lexical and grammatical ambiguities through the existing footnotes.
