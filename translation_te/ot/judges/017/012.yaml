  to: అప్పుడు మీకా ఆ లేవీయుని యాజకునిగా నియమించాడు[a]. ఆ యువకుడు మీకాకు యాజకుడయ్యాడు, మరియు అతడు మీకా ఇంట్లో ఉన్నాడు.
