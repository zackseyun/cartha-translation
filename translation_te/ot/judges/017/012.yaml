id: JDG.17.12
reference: Judges 17:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְמַלֵּ֤א מִיכָה֙ אֶת יַ֣ד הַ/לֵּוִ֔י וַ/יְהִי ל֥/וֹ הַ/נַּ֖עַר לְ/כֹהֵ֑ן וַ/יְהִ֖י בְּ/בֵ֥ית מִיכָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/017/012.yaml
  text: So Micah ordained the Levite[a], and the young man became his priest and was in Micah’s house.
translation:
  language: te
  text: అప్పుడు మీకా ఆ లేవీయుని యాజకునిగా నియమించాడు[a]. ఆ యువకుడు మీకాకు యాజకుడయ్యాడు, మరియు అతడు మీకా ఇంట్లో ఉన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరాలా, “లేవీయుని చేతిని నింపాడు”; ఇది ఒకరిని యాజక సేవలో నియమించడాన్ని లేదా ప్రతిష్ఠించడాన్ని సూచించే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמַלֵּא אֶת־יַד
  choice: యాజకునిగా నియమించాడు
  rationale: ‘చేతిని నింపాడు’ అనే హీబ్రూ నుడికారం యాజక సేవలో ఒకరిని ప్రతిష్ఠించడం లేదా నియమించడం అనే భావాన్ని ఇస్తుంది. తెలుగులో అక్షరార్థం అస్పష్టంగా ఉంటుంది కాబట్టి సందర్భానుసారంగా ‘యాజకునిగా నియమించాడు’ అని అనువదించాం; అక్షరార్థాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: הַלֵּוִי
  choice: ఆ లేవీయుని
  rationale: ఇది ఆ యువకుణ్ణి అతని గోత్ర సంబంధమైన గుర్తింపుతో సూచిస్తుంది. మునుపటి సందర్భంలో పరిచయమైన వ్యక్తి కావడంతో ‘ఆ లేవీయుని’ సహజంగా ఉంది.
- source_word: הַנַּעַר
  choice: ఆ యువకుడు
  rationale: נַעַר అనే పదానికి బాలుడు, యువకుడు, సేవకుడు వంటి అర్థాలు ఉండవచ్చు. ఇక్కడ అతడు యాజక బాధ్యత చేపడుతున్నందున ‘యువకుడు’ సందర్భానికి సరిపోతుంది.
- source_word: וַיְהִי לוֹ ... לְכֹהֵן
  choice: అతనికి యాజకుడై
  rationale: ఈ నిర్మాణం ఆ యువకుడు మీకాకు యాజకుని పాత్రలోకి వచ్చాడని సూచిస్తుంది. ‘అతనికి యాజకుడై’ మూలంలోని సంబంధాన్ని, పాత్రను రెండింటినీ సంక్షిప్తంగా నిలుపుతుంది.
- source_word: בְּבֵית מִיכָה
  choice: మీకా ఇంట్లో
  rationale: ఇది ప్రధానంగా స్థలాన్ని సూచించే సరళమైన పదబంధం. ‘మీకా ఇంట్లో’ ఆధునిక తెలుగులో సహజంగా, మూలానికి సమీపంగా ఉంది.
theological_decisions:
- issue: వ్యక్తిగత ఆరాధనా వ్యవస్థలో జరిగిన యాజక నియామకాన్ని దైవికంగా చెల్లుబాటైనదిగా సూచించకుండా అనువదించడం
  choice: మీకా ఆ లేవీయుని యాజకునిగా నియమించాడు
  alternative: మీకా ఆ లేవీయుని ప్రతిష్ఠించాడు / మీకా ఆ లేవీయుని చేతిని నింపాడు
  rationale: వాక్యం మీకా చేసిన నియామక చర్యను వర్ణిస్తుంది; దానికి దేవుని ఆమోదం ఉందని చెప్పదు. ‘నియమించాడు’ కార్యాన్ని స్పష్టంగా తెలియజేస్తూ దాని చెల్లుబాటుపై అదనపు తీర్పును చొప్పించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని వాడాం. ‘లేవీయుడు,’ ‘యాజకుడు’ వంటి స్థిరమైన బైబిల్ పదజాలాన్ని నిలిపి, మూలంలోని వరుస క్రియలను రెండు వాక్యాలుగా స్పష్టంగా అందించాం.
