    rationale: ‘తన ప్రయాణాన్ని సాగిస్తూ’ presents the phrase chiefly as contemporaneous action, whereas the Hebrew infinitive with לְ is more directly represented here as ‘to continue his journey.’ The note may preserve the possible circumstantial sense.
