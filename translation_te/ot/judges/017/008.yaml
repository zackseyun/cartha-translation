translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సహజంగా ఉండే కథన శైలి. ‘తాత్కాలికంగా నివసించడానికి’ ద్వారా גור యొక్క తాత్కాలిక/పరదేశ నివాస భావం నిలుపబడింది. పాదటిప్పణి గుర్తు సంబంధిత ప్రయాణ నుడికారం వెంటనే ఉంచబడింది.
