source:
  edition: WLC
  text: וַ/יֵּ֨לֶךְ הָ/אִ֜ישׁ מֵ/הָ/עִ֗יר מִ/בֵּ֥ית לֶ֨חֶם֙ יְהוּדָ֔ה לָ/ג֖וּר בַּ/אֲשֶׁ֣ר יִמְצָ֑א וַ/יָּבֹ֧א הַר אֶפְרַ֛יִם עַד בֵּ֥ית מִיכָ֖ה לַ/עֲשׂ֥וֹת דַּרְכּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/017/008.yaml
  text: And the man went from the city[a], from Bethlehem of Judah, to sojourn wherever he might find a place. And he came to the hill country of Ephraim, as far as the house of Micah, to continue his journey.
translation:
  language: te
  text: ఆ మనిషి యూదాలోని బేత్లెహేము పట్టణం నుండి, తనకు చోటు ఎక్కడ దొరికితే అక్కడ తాత్కాలికంగా నివసించడానికి, వెళ్లాడు. అతడు తన ప్రయాణాన్ని కొనసాగించడానికి[a] ఎఫ్రాయిము కొండ ప్రాంతంలోని మీకా ఇంటి వరకు వచ్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తన దారిన వెళ్తూ” లేదా “తన ప్రయాణాన్ని సాగిస్తూ.” హీబ్రూ నుడికారానికి అక్షరార్థం “తన దారిని చేయడానికి.”
    reason: లַעֲשׂוֹת דַּרְכּוֹ అనే హీబ్రూ నుడికారం ప్రయాణాన్ని కొనసాగించడాన్ని సూచిస్తుంది; సందర్భానుసారంగా ప్రయాణిస్తూ అనే భావాన్నీ ఇవ్వవచ్చు.
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: బయలుదేరి … వెళ్లాడు
  rationale: הלך అనే సాధారణ గమన క్రియను కథన సందర్భానికి సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది; పట్టణం నుండి ప్రయాణం మొదలుపెట్టిన భావాన్ని ‘బయలుదేరి’ స్పష్టం చేస్తుంది.
- source_word: הָאִישׁ
  choice: ఆ మనిషి
  rationale: మూలంలో ఉన్న ‘మనిషి’ అనే పదాన్నే నిలుపుతుంది; ముందరి వచనం ఆధారంగా ‘యువకుడు’ అని మార్చదు.
- source_word: מֵהָעִיר מִבֵּית לֶחֶם יְהוּדָה
  choice: యూదాలోని బేత్లెహేము పట్టణం నుండి
  rationale: עירకు సందర్భోచితంగా ‘పట్టణం’ అని అనువదించి, బేత్లెహేము యూదా ప్రాంతంలో ఉందనే భౌగోళిక సంబంధాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: לָגוּר
  choice: తాత్కాలికంగా నివసించడానికి
  rationale: גורలో ఉన్న పరదేశిగా లేదా కొంతకాలం నివసించే భావాన్ని సాధారణ పాఠకునికి అర్థమయ్యేలా తెలియజేస్తుంది.
- source_word: בַּאֲשֶׁר יִמְצָא
  choice: తనకు చోటు ఎక్కడ దొరికితే అక్కడ
  rationale: మూలంలో కర్మ స్పష్టంగా లేకపోయినా సందర్భంలో నివాసస్థలం సూచితమవుతుంది; తెలుగులో అవసరమైన ‘చోటు’ను చేర్చి అనిశ్చిత గమ్యాన్ని నిలుపుతుంది.
- source_word: הַר אֶפְרַיִם
  choice: ఎఫ్రాయిము కొండ ప్రాంతం
  rationale: ఇది ఒకే కొండను కాక భౌగోళిక పర్వత ప్రాంతాన్ని సూచిస్తుంది.
- source_word: עַד בֵּית מִיכָה
  choice: మీకా ఇంటి వరకు
  rationale: עַד సూచించే చేరుకున్న హద్దు లేదా అంతిమ బిందువును ‘వరకు’ సూటిగా నిలుపుతుంది.
- source_word: לַעֲשׂוֹת דַּרְכּוֹ
  choice: తన ప్రయాణాన్ని సాగిస్తూ
  rationale: అక్షరార్థంగా ‘తన దారిని చేయడం’ అనే హీబ్రూ నుడికారాన్ని సహజ తెలుగులో ప్రయాణాన్ని కొనసాగించే భావంగా ఇస్తుంది; నిర్మాణంలోని ప్రత్యామ్నాయ అవగాహనలను పాదటిప్పణిలో ఉంచుతుంది.
