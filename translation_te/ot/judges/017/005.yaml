source:
  edition: WLC
  text: וְ/הָ/אִ֣ישׁ מִיכָ֔ה ל֖/וֹ בֵּ֣ית אֱלֹהִ֑ים וַ/יַּ֤עַשׂ אֵפוֹד֙ וּ/תְרָפִ֔ים וַ/יְמַלֵּ֗א אֶת יַ֤ד אַחַד֙ מִ/בָּנָ֔י/ו וַ/יְהִי ל֖/וֹ לְ/כֹהֵֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/017/005.yaml
  text: The man Micah had a house of God[a], and he made an ephod and household idols, and he ordained one of his sons[b], and he became his priest.
translation:
  language: te
  text: మీకా అనే ఆ వ్యక్తికి ఒక దేవమందిరం[a] ఉండేది. అతడు ఒక ఏఫోదును, గృహవిగ్రహాలను తయారుచేశాడు. తన కుమారుల్లో ఒకణ్ణి యాజకునిగా ప్రతిష్ఠించాడు[b]. అతడు మీకాకు యాజకుడయ్యాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఒక పూజామందిరం.’ హీబ్రూ పదబంధాన్ని ‘దేవుని మందిరం’ లేదా ‘దేవతల మందిరం’ అని కూడా అర్థం చేసుకోవచ్చు; ఇక్కడ అది మీకా ఏర్పాటు చేసుకున్న వ్యక్తిగత ఆరాధనా స్థలాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా, ‘అతని చేతిని నింపాడు’; ఇది ఒకరిని యాజక సేవలో నియమించడం లేదా ప్రతిష్ఠించడం అనే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּית אֱלֹהִים
  choice: ఒక దేవమందిరం
  rationale: ఈ పదబంధం దేవుని మందిరం, దేవతల మందిరం, లేదా వ్యక్తిగత పూజాస్థలం అనే భావాలను సందర్భానుసారం సూచించగలదు. ఇక్కడ ఏఫోదు, తెరాఫీము, కుటుంబ యాజకుడు ఉన్నందున ‘దేవమందిరం’ అనేది వ్యక్తిగత ఆరాధనా స్థలాన్ని సహజంగా తెలియజేస్తూ మూలంలోని సంఖ్యాపరమైన సందిగ్ధతను అతిగా పరిష్కరించదు.
- source_word: אֵפוֹד
  choice: ఏఫోదు
  rationale: ఈ ప్రాచీన ఆరాధనా వస్తువు లేదా వస్త్రానికి సరళమైన తెలుగు సమానార్థకం లేదు; అందువల్ల నిర్దిష్ట పదాన్ని లిప్యంతరీకరించాం.
- source_word: תְרָפִים
  choice: గృహవిగ్రహాలు
  rationale: ఇవి ఇంటి ఆరాధనకు సంబంధించిన విగ్రహాలు. ‘గృహవిగ్రహాలు’ ఆధునిక పాఠకుడికి వాటి స్వభావాన్ని సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: וַיְמַלֵּא אֶת־יַד
  choice: యాజకునిగా ప్రతిష్ఠించాడు
  rationale: అక్షరార్థంగా ‘చేతిని నింపాడు’ అనే ఈ హీబ్రూ నుడికారం యాజక సేవలో నియమించడం లేదా ప్రతిష్ఠించడాన్ని సూచిస్తుంది. పాత్రను స్పష్టంచేయడానికి ‘యాజకునిగా’ చేర్చాం.
- source_word: אַחַד מִבָּנָיו
  choice: తన కుమారుల్లో ఒకణ్ణి
  rationale: మూలంలోని పుంలింగ బహువచనాన్ని, భాగార్థక నిర్మాణాన్ని నేరుగా నిలిపాం.
- source_word: וַיְהִי לוֹ לְכֹהֵן
  choice: అతడు మీకాకు యాజకుడయ్యాడు
  rationale: ప్రతిష్ఠాపన ఫలితంగా ఆ కుమారుడు మీకాకు యాజకుడయ్యాడనే భావాన్ని నిలిపాం; తెలుగు వాక్యంలో సర్వనామ సందిగ్ధత రాకుండా ‘మీకాకు’ అని పేరును పునరుక్తి చేశాం.
- source_word: וְהָאִישׁ מִיכָה
  choice: మీకా అనే ఆ వ్యక్తికి
  rationale: నిర్దిష్ట ఉపపదంతో ఉన్న ‘ఆ మనిషి మీకా’ అనే అంశ పునఃప్రవేశాన్ని సహజమైన ఆధునిక తెలుగులో తెలిపాం; మూలంలో లేని కాలసూచక ‘ఇప్పుడు’ను చేర్చలేదు.
theological_decisions:
- issue: בֵּית אֱלֹהִים అనే పదబంధం నిజ దేవుని అధికారిక మందిరాన్ని సూచిస్తున్నట్లు అనిపించే ప్రమాదం
  choice: దేవమందిరం
  alternative: దేవుని మందిరం / దేవతల మందిరం / పూజామందిరం
  rationale: సందర్భం మీకా ఏర్పరచుకున్న అనధికారిక వ్యక్తిగత ఆరాధనా వ్యవస్థను చూపుతుంది. ‘దేవమందిరం’ ఆరాధనా స్థల భావాన్ని ఇస్తుంది; అయితే ఏకవచన ‘దేవుడు’ లేదా బహువచన ‘దేవతలు’ అని మూలంలోని నిజమైన సందిగ్ధతను నిర్ణయించదు. పాదసూచిక ప్రత్యామ్నాయాలను వెల్లడిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని వాడాం. ‘ఏఫోదు’ను సాంకేతిక ప్రాచీన పదంగా నిలిపి, ‘తెరాఫీము’ను పాఠకులకు అర్థమయ్యే ‘గృహవిగ్రహాలు’గా భావానువదించాం. చిన్న చిన్న వాక్యాలతో సంఘటనల క్రమాన్ని స్పష్టంగా ఉంచాం.
