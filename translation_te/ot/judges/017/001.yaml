  yaml_path: translation/ot/judges/017/001.yaml
  text: There was a man from the hill country of Ephraim[a], and his name was Mikayhu.
translation:
  language: te
  text: ఎఫ్రాయిము కొండప్రాంతానికి చెందిన ఒక మనిషి ఉండేవాడు. అతని పేరు మీకాయెహూ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: సంప్రదాయంగా ఈ పేరును ‘మీకా’ అని వాడుతారు. ఇక్కడి హీబ్రూ రూపం ‘మీకాయెహూ’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: ఉండేవాడు
  rationale: కొత్త కథన ఘట్టాన్ని పరిచయం చేసే וַיְהִי భావాన్ని తెలుగులో సహజమైన అస్తిత్వ వాక్యంగా అందిస్తుంది; మూలంలో స్పష్టమైన ‘ఇప్పుడు’ లేకపోవడంతో అలాంటి కాలసూచక పదాన్ని చేర్చలేదు.
- source_word: אִישׁ
  choice: ఒక మనిషి
  rationale: ఇక్కడ ఒక పురుష వ్యక్తిని సూటిగా సూచిస్తుంది; మూలంలో లేని ప్రత్యేకతను జోడించే ‘ఒకానొక’ వంటి రూపాన్ని నివారించాం.
- source_word: מֵהַר אֶפְרָיִם
  choice: ఎఫ్రాయిము కొండప్రాంతానికి చెందిన
  rationale: ఈ పదబంధం ఒకే కొండను కాకుండా ఎఫ్రాయిముతో అనుబంధమున్న ఎత్తైన భూభాగాన్ని సూచిస్తుంది. తెలుగులో వ్యక్తి ప్రాంతీయ మూలాన్ని సహజంగా తెలిపేందుకు ‘చెందిన’ వాడాం.
- source_word: וּשְׁמוֹ
  choice: అతని పేరు
  rationale: హీబ్రూ సమన్వయాన్ని రెండవ సహజ తెలుగు వాక్యంగా కొనసాగిస్తుంది.
- source_word: מִיכָיְהוּ
  choice: మీకాయెహూ
  rationale: ఈ వచనంలోని మִיכָיְהוּ రూపాన్ని తెలుగు లిపిలో సాధ్యమైనంత దగ్గరగా లిప్యంతరీకరించాం; సంప్రదాయ సంక్షిప్త నామమైన ‘మీకా’ను ప్రధాన పాఠంలో పెట్టలేదు.
