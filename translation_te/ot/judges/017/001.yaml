translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. భౌగోళిక భావాన్ని స్పష్టంగా ఉంచుతూ వ్యక్తినామపు హీబ్రూ రూపాన్ని పరిరక్షించాం.
