source:
  edition: WLC
  text: וַ/יְהִי נַ֗עַר מִ/בֵּ֥ית לֶ֨חֶם֙ יְהוּדָ֔ה מִ/מִּשְׁפַּ֖חַת יְהוּדָ֑ה וְ/ה֥וּא לֵוִ֖י וְ/ה֥וּא גָֽר שָֽׁם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/017/007.yaml
  text: There was a young man from Bethlehem in Judah[a], from the clan of Judah; and he was a Levite[b], and he was sojourning there.
translation:
  language: te
  text: యూదాలోని బేత్లెహేముకు చెందిన ఒక యువకుడు ఉండేవాడు. అతడు యూదా వంశశాఖకు చెందినవాడు[a]; అతడు లేవీయుడు, అక్కడ పరదేశ నివాసిగా ఉండేవాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పదం కుటుంబం లేదా వంశశాఖను సూచించవచ్చు; ‘యూదా కుటుంబం’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ క్రియ పరదేశంలో లేదా తన సొంత స్థలానికి బయట నివసించడాన్ని సూచించవచ్చు; ‘అక్కడ నివసిస్తున్నాడు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: ఒక యువకుడు ఉన్నాడు
  rationale: కథనంలో కొత్త వ్యక్తిని పరిచయం చేసే హీబ్రూ నిర్మాణాన్ని సహజమైన తెలుగు దృశ్యపరిచయ వాక్యంగా అనువదించింది; మూలంలో లేని స్పష్టమైన కాలసూచక పదాన్ని చేర్చలేదు.
- source_word: נַעַר
  choice: యువకుడు
  rationale: ఈ సందర్భంలో సేవకత్వం కాక వయస్సు సూచించబడుతున్నందున ‘యువకుడు’ సహజమైన, తటస్థమైన ఎంపిక.
- source_word: מִבֵּית לֶחֶם יְהוּדָה
  choice: యూదా ప్రాంతంలోని బేత్లెహేముకు చెందిన
  rationale: ఇది బేత్లెహేమును యూదా ప్రాంతంతో నిర్దిష్టం చేస్తుంది; ఇతర బేత్లెహేముల నుంచి దానిని వేరు చేసే భౌగోళిక భావాన్ని తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: מִמִּשְׁפַּחַת יְהוּדָה
  choice: యూదా వంశానికి చెందినవాడు
  rationale: מִשְׁפָּחָה కుటుంబం కంటే విస్తృతమైన వంశ/గోత్రశాఖ సమూహాన్ని సూచించగలదు. ఆధునిక తెలుగులో ‘వంశం’ ఆ భావాన్ని సహజంగా మోస్తుంది.
- source_word: לֵוִי
  choice: లేవీయుడు
  rationale: అతని లేవీయ గుర్తింపును సంక్షిప్తంగా, సాంప్రదాయిక బైబిలు పదంతో తెలియజేస్తుంది.
- source_word: גָר שָׁם
  choice: అక్కడ పరదేశిగా నివసిస్తున్నాడు
  rationale: גור కేవలం ‘ఉండడం’ మాత్రమే కాక, తన స్వస్థలం కాని చోట తాత్కాలిక లేదా పరదేశ నివాసిగా ఉండే భావాన్ని కలిగి ఉంది; ఈ అనువాదం ఆ భావాన్ని అతిగా న్యాయపరమైన పదజాలం లేకుండా నిలుపుతుంది.
theological_decisions:
- issue: యూదా వంశానికి చెందినవాడని చెప్పడం మరియు లేవీయుడని చెప్పడం మధ్య కనిపించే గుర్తింపు ఉద్రిక్తత
  choice: రెండు వాక్యాలనూ ప్రధాన పాఠ్యంలో యథాతథంగా నిలిపి, సమన్వయ వివరణను పాదటిప్పణిలో మాత్రమే సూచించడం
  alternative: ‘యూదా వంశం’ను కేవలం నివాస లేదా సామాజిక అనుబంధంగా ప్రధాన పాఠ్యంలోనే వివరణాత్మకంగా మార్చడం
  rationale: హీబ్రూ పాఠ్యం ఈ రెండు గుర్తింపులను పక్కపక్కనే ఉంచుతుంది. అనువాదం ఆ అస్పష్టతను తొలగించకుండా సంరక్షించాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘లేవీయుడు’ వంటి స్థిర బైబిలు పదాన్ని ఉంచి, అరుదైన ‘ప్రవాసం చేయు’ వంటి కృత్రిమ ప్రయోగాన్ని నివారించింది. ప్రధాన పాఠ్యంలో [a], [b] గుర్తులు సంబంధిత పదబంధాల వద్ద ఉంచబడ్డాయి.
