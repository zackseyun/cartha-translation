translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనదిగానూ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేదిగానూ ఉంచబడింది. హెబ్రీ వాక్యంలోని అసహజ అక్షరార్థ రూపాన్ని ప్రధాన పాఠ్యంలో సహజీకరించి, దాని రూపాత్మక అస్పష్టతను పాదసూచికలో నిలుపుకున్నాం.
