- from: 'యెఫ్తా వారితో ఇలా అన్నాడు: “నేనూ నా ప్రజలూ అమ్మోనీయులతో తీవ్రమైన పోరాటంలో ఉన్నాం.[a] అప్పుడు నేను సహాయం కోసం మిమ్మల్ని పిలిచాను; కానీ మీరు వారి చేతిలోనుండి నన్ను రక్షించలేదు.”'
  to: 'యెఫ్తా వారితో ఇలా అన్నాడు: “నేనూ నా ప్రజలూ అమ్మోనీయులతో తీవ్రమైన సంఘర్షణలో ఉన్నాం.[a] నేను సహాయం కోసం మిమ్మల్ని పిలిచాను, కానీ మీరు వారి చేతిలోనుండి నన్ను రక్షించలేదు.”'
  rationale: ప్రధాన పాఠ్యంలో రִיב యొక్క విస్తృతమైన ‘strife/conflict’ భావాన్ని ‘తీవ్రమైన సంఘర్షణ’తో వ్యక్తం చేశాను; అవసరం లేని కాలసూచకమైన ‘అప్పుడు’ తొలగించాను. పాదసూచికను సహజమైన, అర్థవంతమైన తెలుగు రూపంలో మళ్లీ వ్రాసి, అసాధారణమైన అక్షరార్థ హెబ్రీ నిర్మాణాన్ని మరియు తీవ్రతను సూచించే మְאֹדను నిలిపాను.
