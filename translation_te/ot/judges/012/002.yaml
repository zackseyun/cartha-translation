source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יִפְתָּח֙ אֲלֵי/הֶ֔ם אִ֣ישׁ רִ֗יב הָיִ֛יתִי אֲנִ֛י וְ/עַמִּ֥/י וּ/בְנֵֽי עַמּ֖וֹן מְאֹ֑ד וָ/אֶזְעַ֣ק אֶתְ/כֶ֔ם וְ/לֹֽא הוֹשַׁעְתֶּ֥ם אוֹתִ֖/י מִ/יָּדָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/012/002.yaml
  text: Jephthah said to them[a], “I and my people were in a bitter conflict with the Ammonites, and I called out to you, but you did not save me from their hand.”
translation:
  language: te
  text: 'యెఫ్తా వారితో ఇలా అన్నాడు: “నేనూ నా ప్రజలూ అమ్మోనీయులతో తీవ్రమైన సంఘర్షణలో ఉన్నాం.[a] నేను సహాయం కోసం మిమ్మల్ని పిలిచాను, కానీ మీరు వారి చేతిలోనుండి నన్ను రక్షించలేదు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత అక్షరార్థంగా: “నేను కలహపు మనిషిని; నేనూ నా ప్రజలూ అమ్మోనీయులతో చాలా కలహంలో ఉన్నాము.”'
    reason: హెబ్రీ אִישׁ רִיב (‘కలహపు మనిషి’) అనే అసాధారణ నిర్మాణాన్ని, అలాగే మְאֹד (‘చాలా/ఎంతో’) కలహాన్ని తీవ్రపరచడాన్ని చూపడానికి.
lexical_decisions:
- source_word: אִישׁ רִיב ... מְאֹד
  choice: తీవ్రమైన పోరాటంలో ఉన్నాం
  rationale: అక్షరార్థంగా ఉన్న ‘కలహపు మనిషిని ... ఎంతో’ అనే హెబ్రీ నిర్మాణం ఇక్కడ యెఫ్తా స్వభావాన్ని కాక, అతడూ అతని ప్రజలూ ఎదుర్కొన్న తీవ్రమైన ఘర్షణ పరిస్థితిని సూచిస్తుంది. ‘తీవ్రమైన పోరాటం’ సహజమైన ఆధునిక తెలుగు రూపంలో ఆ బలాన్ని నిలుపుతుంది.
- source_word: וְעַמִּי
  choice: నా ప్రజలూ
  rationale: עַם యొక్క సాధారణ అర్థం ‘ప్రజలు’. సందర్భం అనుమతించినా దీనిని ‘సైన్యం’గా కుదించడం అవసరం లేదు.
- source_word: וּבְנֵי עַמּוֹן
  choice: అమ్మోనీయులతో
  rationale: ‘అమ్మోను కుమారులు’ అనే జాతినామానికి సహజమైన ప్రామాణిక తెలుగు రూపం ‘అమ్మోనీయులు’.
- source_word: וָאֶזְעַק אֶתְכֶם
  choice: సహాయం కోసం మిమ్మల్ని పిలిచాను
  rationale: זעק ఆపదలో సహాయం కోరుతూ మొరపెట్టడం లేదా పిలవడం అనే భావాన్ని ఇస్తుంది. సందర్భంలో సైనిక సహాయం కోసం చేసిన విజ్ఞప్తి స్పష్టంగా ఉండేలా ఈ రూపం ఎంచుకోబడింది.
- source_word: וְלֹא הוֹשַׁעְתֶּם אוֹתִי
  choice: మీరు ... నన్ను రక్షించలేదు
  rationale: ישׁע యొక్క హిఫీల్ రూపం ‘రక్షించడం/విడిపించడం’ అని అర్థం. యుద్ధ సందర్భానికి సహజంగా సరిపోయే ‘రక్షించలేదు’ ఎంచుకోబడింది.
- source_word: מִיָּדָם
  choice: వారి చేతిలోనుండి
  rationale: అధికారం లేదా పట్టు అనే భావాన్ని తెలిపే హెబ్రీ ‘చేతి’ రూపకాన్ని తెలుగులోనూ అర్థమయ్యే విధంగా నిలుపుకుంది.
