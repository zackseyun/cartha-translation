translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కథనానికి గంభీరతను, ప్రత్యక్ష సంభాషణలోని ఆగ్రహాన్ని నిలిపే సహజమైన వాక్యనిర్మాణం. ‘సాఫోను’ స్థలనామ పఠనాన్ని ప్రధాన పాఠ్యంలో ఉంచి ప్రత్యామ్నాయ దిశాసూచక పఠనాన్ని పాదటిప్పణిలో ఇచ్చాం. సమూహవాచక ఏకవచనానికి ప్రత్యేక పాదటిప్పణి అవసరం లేకుండా తెలుగులో సహజమైన బహువచన జాతివాచక రూపాన్ని వాడాం.
