source:
  edition: WLC
  text: וַ/יִּצָּעֵק֙ אִ֣ישׁ אֶפְרַ֔יִם וַֽ/יַּעֲבֹ֖ר צָפ֑וֹנָ/ה וַ/יֹּאמְר֨וּ לְ/יִפְתָּ֜ח מַדּ֣וּעַ עָבַ֣רְתָּ לְ/הִלָּחֵ֣ם בִּ/בְנֵי עַמּ֗וֹן וְ/לָ֨/נוּ֙ לֹ֤א קָרָ֨אתָ֙ לָ/לֶ֣כֶת עִמָּ֔/ךְ בֵּיתְ/ךָ֕ נִשְׂרֹ֥ף עָלֶ֖י/ךָ בָּ/אֵֽשׁ׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/012/001.yaml
  text: Then the men of Ephraim were called together[a], and they crossed over to Zaphon and said to Jephthah[c][b], “Why did you cross over to fight against the Ammonites and not call us to go with you? We will burn your house down over you with fire.”
translation:
  language: te
  text: 'అప్పుడు ఎఫ్రాయిమీయులు సమకూడి, సాఫోనుకు[a] దాటి వెళ్లి యెఫ్తాతో ఇలా అన్నారు: “అమ్మోనీయులతో యుద్ధం చేయడానికి నువ్వు దాటి వెళ్లినప్పుడు, నీతో రావడానికి మమ్మల్ని ఎందుకు పిలవలేదు? నీ ఇంటిని నీ మీదనే[b] అగ్నితో కాల్చివేస్తాం!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఉత్తర దిశగా.” צָפוֹנָה అనే హీబ్రూ పదాన్ని సాఫోను అనే స్థలనామంగా కాక దిశను తెలిపే పదంగా కూడా అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
  - marker: b
    text: ఈ బెదిరింపు బహుశా, “నువ్వు లోపల ఉండగానే నీ ఇంటిని తగలబెడతాం” అని అర్థం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּצָּעֵק אִישׁ אֶפְרַיִם
  choice: ఎఫ్రాయిమీయులు సమకూడి
  rationale: אִישׁ రూపపరంగా ఏకవచనమైనా, తరువాతి బహువచన క్రియ וַיֹּאמְרוּ ఈ పదబంధం ఎఫ్రాయిమీయుల సమూహాన్ని సూచిస్తుందని చూపుతుంది. וַיִּצָּעֵק ఇక్కడ యుద్ధానికి సమీకరించబడటం లేదా కూడడం అనే భావాన్ని ఇస్తుంది.
- source_word: וַיַּעֲבֹר
  choice: దాటి వెళ్లి
  rationale: హీబ్రూలో క్రియ ఏకవచన రూపంలో ఉన్నప్పటికీ, సమూహవాచక కర్త మరియు తరువాతి బహువచన క్రియను బట్టి తెలుగులో ఎఫ్రాయిమీయుల సమూహ చర్యగా సహజంగా అనుసంధానించబడింది.
- source_word: צָפוֹנָה
  choice: సాఫోనుకు
  rationale: సందర్భంలో దీనిని దిశాసూచకమైన ‘ఉత్తర దిశగా’ కంటే సాఫోను అనే స్థలనామంగా తీసుకోవడం సముచితం; నిజమైన పాఠ్య సందిగ్ధతను పాదటిప్పణిలో ఉంచాం.
- source_word: לְהִלָּחֵם בִּבְנֵי עַמּוֹן
  choice: అమ్మోనీయులతో యుద్ధం చేయడానికి
  rationale: ‘అమ్మోను కుమారులు’ అనే జాతివాచక హీబ్రూ ప్రయోగానికి ఆధునిక తెలుగులో సహజమైన రూపం ‘అమ్మోనీయులు’; בְּ ఇక్కడ ప్రతిపక్ష పోరాట భావాన్ని ఇస్తుంది.
- source_word: וְלָנוּ לֹא קָרָאתָ לָלֶכֶת עִמָּךְ
  choice: నీతో రావడానికి మమ్మల్ని ఎందుకు పిలవలేదు?
  rationale: קרא ఇక్కడ యుద్ధంలో పాలుపంచుకోవడానికి పిలవడం అనే భావంలో ఉంది. తెలుగు ప్రశ్న నిర్మాణం సహజంగా ఉండేందుకు ప్రతికూల వాక్యభాగాన్ని ప్రధాన ప్రశ్నతో కలిపాం.
- source_word: בֵּיתְךָ נִשְׂרֹף עָלֶיךָ בָּאֵשׁ
  choice: నీ ఇంటిని నీ మీదనే అగ్నితో కాల్చివేస్తాం
  rationale: עָלֶיךָ యొక్క ‘నీ మీద’ అనే చిత్రణను నిలుపుతూ, అతడు ఇంటిలో ఉండగానే దహనం చేస్తామనే బెదిరింపు సూచనను పాఠ్యంలో అతిగా విప్పకుండా కాపాడాం.
