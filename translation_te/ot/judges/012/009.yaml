  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. వివాహ సంబంధమైన సందర్భార్థం సంభావ్యమైనదైనా, ప్రధాన పాఠ్యంలో దాన్ని నిర్బంధ అర్థంగా చేర్చకుండా పాదసూచికలో వివరించబడింది. పాదసూచిక సూచిక [a] ప్రధాన పాఠ్యంలో ఉంచబడింది.
