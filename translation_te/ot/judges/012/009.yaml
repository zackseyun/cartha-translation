base_translation:
  language: en
  yaml_path: translation/ot/judges/012/009.yaml
  text: He had thirty sons[a], and thirty daughters he sent away, and he brought in thirty daughters from outside for his sons. And he judged Israel seven years.
translation:
  language: te
  text: అతనికి ముప్పై మంది కుమారులు, ముప్పై మంది కుమార్తెలు ఉన్నారు. అతడు తన ముప్పై మంది కుమార్తెలను బయటికి పంపాడు; తన కుమారుల కోసం బయటి నుంచి ముప్పై మంది కుమార్తెలను తీసుకొచ్చాడు.[a] అతడు ఇశ్రాయేలుకు ఏడు సంవత్సరాలు న్యాయాధిపతిగా ఉన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, మరింత స్పష్టంగా: “అతడు తన ముప్పై మంది కుమార్తెలకు తన వంశం లేదా ఇంటివర్గం బయట వివాహాలు చేసి పంపించాడు; తన కుమారుల కోసం బయటి నుంచి ముప్పై మంది స్త్రీలను తీసుకొచ్చాడు.” హీబ్రూ మూలంలో రెండు చోట్లా అక్షరార్థంగా “కుమార్తెలు” అనే పదమే ఉంది.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי לוֹ
  choice: అతనికి ... ఉన్నారు
  rationale: హయా + ల్ అనే హీబ్రూ ప్రయోగం స్వాధీనాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘అతనికి ... ఉన్నారు’ సహజమైన సమానార్థక నిర్మాణం.
- source_word: שְׁלֹשִׁים בָּנִים וּשְׁלֹשִׁים בָּנוֹת
  choice: ముప్పై మంది కుమారులు, ముప్పై మంది కుమార్తెలు
  rationale: సంఖ్యలనూ, లింగనిర్దిష్ట బంధుత్వ పదాలనూ యథాతథంగా నిలుపుతుంది.
- source_word: שִׁלַּח הַחוּצָה
  choice: బయటికి పంపించి
  rationale: ‘బయటికి పంపాడు’ అనే మూలార్థాన్ని నిలుపుతూ, వివాహం చేసి పంపాడనే సంభావ్య సందర్భార్థాన్ని ప్రధాన పాఠ్యంలో ఖచ్చితీకరించదు.
- source_word: וּשְׁלֹשִׁים בָּנוֹת הֵבִיא לְבָנָיו מִן הַחוּץ
  choice: తన కుమారుల కోసం బయటి నుంచి ముప్పై మంది కుమార్తెలను తీసుకొచ్చాడు
  rationale: మూలంలో రెండోసారి కూడా ఉన్న ‘కుమార్తెలు’ అనే పదాన్ని నిలుపుతుంది; ‘తన కుమారుల కోసం’ అనేది సంబంధాన్ని మూలపాఠ్యం చెప్పినంతవరకే తెలియజేస్తుంది.
- source_word: מִן הַחוּץ
  choice: బయటి నుంచి
  rationale: అక్షరార్థమైన ‘బయట నుంచి’ అనే భావాన్ని సహజమైన తెలుగులో ఇస్తుంది; దూరదేశం నుంచి అనే అధిక నిర్దిష్టతను చేర్చదు.
- source_word: וַיִּשְׁפֹּט אֶת יִשְׂרָאֵל
  choice: ఇశ్రాయేలుకు ... న్యాయాధిపతిగా ఉన్నాడు
  rationale: న్యాయాధిపతులు గ్రంథంలోని పునరావృత పదవీభావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; కేవలం న్యాయవిచారణ చేశాడనే సంకుచిత భావాన్ని నివారిస్తుంది.
- source_word: שֶׁבַע שָׁנִים
  choice: ఏడు సంవత్సరాలు
  rationale: కాలవ్యవధిని సూటిగా అనువదిస్తుంది.
