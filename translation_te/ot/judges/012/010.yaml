translation:
  language: te
  text: తర్వాత ఇబ్జాను చనిపోయాడు; అతనిని బేత్లెహేములో పాతిపెట్టారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּמָת
  choice: తర్వాత ... చనిపోయాడు
  rationale: వావ్-వరుస కథనాన్ని ముందుకు నడిపిస్తుంది; ఆధునిక తెలుగులో ‘తర్వాత’ సహజమైన క్రమాన్ని తెలియజేస్తుంది. מוּת క్రియకు ఇక్కడ ‘చనిపోయాడు’ అనే అర్థం.
- source_word: אִבְצָן
  choice: ఇబ్జాను
  rationale: వ్యక్తి పేరును తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: וַיִּקָּבֵר
  choice: అతణ్ణి ... పాతిపెట్టారు
  rationale: నిఫాల్ రూపంలోని కర్మణి భావాన్ని సహజమైన తెలుగు అనిర్దిష్ట కర్త నిర్మాణంతో వ్యక్తం చేశాం; ఎవరు పాతిపెట్టారో మూలపాఠం చెప్పదు.
- source_word: בְּבֵית לָחֶם
  choice: బేత్లెహేములో
  rationale: בְּ స్థలాన్ని సూచిస్తుంది; బేత్లెహేము అనే స్థలనామాన్ని సాధారణ తెలుగు రూపంలో ఇచ్చాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. హెబ్రీ మూలంలోని రెండు వరుస చర్యలను తెలుగులో రెండు చిన్న వాక్యాలుగా సహజంగా వ్యక్తం చేశాం.
