source:
  edition: WLC
  text: וַ/יִּשְׁפֹּ֥ט אַחֲרָ֖י/ו אֶת יִשְׂרָאֵ֑ל עַבְדּ֥וֹן בֶּן הִלֵּ֖ל הַ/פִּרְעָתוֹנִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/012/013.yaml
  text: After him, Abdon son of Hillel the Pirathonite judged Israel.
translation:
  language: te
  text: అతని తరువాత హిల్లేలు కుమారుడైన అబ్దోను పిరాతోనీయుడు ఇశ్రాయేలుకు న్యాయం తీర్చాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁפֹּט
  choice: న్యాయం తీర్చాడు
  rationale: న్యాయాధిపతుల గ్రంథంలో שׁפט పదం ఇశ్రాయేలు న్యాయాధిపతుల కార్యాన్ని సూచించే పునరావృత పదం. ‘న్యాయం తీర్చాడు’ అనే అనువాదం ఆ న్యాయపరమైన భావాన్ని నిలుపుతూ, పరిపాలించడం లేదా నాయకత్వం వహించడం అనే విస్తృత భావాన్ని అనవసరంగా నిర్దిష్టం చేయదు.
- source_word: אַחֲרָיו
  choice: అతని తరువాత
  rationale: ఈ పదబంధం ముందుగా పేర్కొన్న న్యాయాధిపతి తరువాతి వారసత్వ క్రమాన్ని నేరుగా సూచిస్తుంది.
- source_word: אֶת יִשְׂרָאֵל
  choice: ఇశ్రాయేలుకు
  rationale: ఎవరికి న్యాయం తీర్చాడో సహజమైన తెలుగులో తెలిపేందుకు ‘ఇశ్రాయేలుకు’ అని ఇచ్చాం; ఇక్కడ ఇశ్రాయేలు ప్రజాసమూహాన్ని సూచిస్తుంది.
- source_word: עַבְדּוֹן
  choice: అబ్దోను
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: בֶּן הִלֵּל
  choice: హిల్లేలు కుమారుడు
  rationale: హీబ్రూ సంయుక్త పదబంధం అబ్దోను వంశసంబంధాన్ని సూటిగా తెలియజేస్తుంది.
- source_word: הַפִּרְעָתוֹנִי
  choice: పిరాతోనీయుడు
  rationale: ఈ నివాససూచక విశేషణం పిరాతోను ప్రాంతానికి చెందిన వ్యక్తిని సూచిస్తుంది; తెలుగు జాతి/స్థలనామ విశేషణ రూపాన్ని నిలిపాం.
theological_decisions:
- issue: שׁפט అనే క్రియ యొక్క పరిధి
  choice: న్యాయం తీర్చాడు
  alternative: పాలించాడు / నాయకత్వం వహించాడు
  rationale: ఈ సందర్భంలో అతని కార్యాల వివరాలు ఇవ్వబడలేదు. కాబట్టి న్యాయాధిపతిగా తీర్పు చెప్పడం, పరిపాలించడం, నాయకత్వం వహించడం వంటి భావాల్లో ఒక్కదానినే పరిమితంగా ఎంచుకోకుండా, గ్రంథంలోని ప్రధాన పదసంబంధాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం ఉపయోగించాం. వ్యక్తి పరిచయాన్ని తెలుగులో సహజంగా ఉండే క్రమంలో—స్థలసంబంధం, తండ్రి పేరు, వ్యక్తి పేరు—అమర్చాం.
