  text: וַ/יָּ֛מָת עַבְדּ֥וֹן בֶּן הִלֵּ֖ל הַ/פִּרְעָתוֹנִ֑י וַ/יִּקָּבֵ֤ר בְּ/פִרְעָתוֹן֙ בְּ/אֶ֣רֶץ אֶפְרַ֔יִם בְּ/הַ֖ר הָ/עֲמָלֵקִֽי־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/012/015.yaml
  text: And Abdon son of Hillel the Pirathonite died[a], and he was buried in Pirathon, in the land of Ephraim, in the hill country of the Amalekites.
translation:
  language: te
  text: పిరాతోనీయుడైన హిల్లేలు కుమారుడు అబ్దోను చనిపోయాడు. అతణ్ణి ఎఫ్రాయిము దేశంలోని పిరాతోనులో, అమాలేకీయుల కొండప్రాంతంలో[a] పాతిపెట్టారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత పదశః: ‘అమాలేకీయుని కొండలో.’ హీబ్రూలో జాతివాచకం ఏకవచనంలో ఉంది; అది సమూహాన్ని లేదా ఆ జాతితో సంబంధమున్న ప్రాంతాన్ని సూచిస్తుండవచ్చు.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: చనిపోయాడు
  rationale: מות అనే క్రియ మరణాన్ని సూటిగా సూచిస్తుంది. తెలుగు సాధారణ వాడుకలోని ‘చనిపోయాడు’ భావాన్ని అతిశయోక్తి లేదా సభ్యోక్తి లేకుండా స్పష్టంగా తెలియజేస్తుంది.
- source_word: עַבְדּוֹן
  choice: అబ్దోను
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: בֶּן הִלֵּל
  choice: హిల్లేలు కుమారుడు
  rationale: నిర్మాణ సంబంధాన్ని సహజమైన తెలుగులో తండ్రి పేరు ముందు వచ్చే విధంగా అందించాం.
- source_word: הַפִּרְעָתוֹנִי
  choice: పిరాతోనీయుడైన
  rationale: నిర్దిష్ట ఉపజాతి/స్థలనామ విశేషణం అబ్దోను పిరాతోనుకు చెందినవాడని సూచిస్తుంది; తెలుగు వ్యక్తివాచక రూపం ఆ భావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: וַיִּקָּבֵר
  choice: అతణ్ణి ... పాతిపెట్టారు
  rationale: קבר క్రియ నిఫ్అల్ రూపంలోని కర్మణి భావాన్ని సహజ తెలుగు అనిర్దిష్ట కర్త నిర్మాణంతో వ్యక్తం చేశాం.
- source_word: בְּפִרְעָתוֹן
  choice: పిరాతోనులో
  rationale: స్థలనామాన్ని లిప్యంతరీకరించి, בְּ ఉపసర్గలోని స్థానార్థాన్ని ‘లో’తో తెలిపాం.
- source_word: בְּאֶרֶץ אֶפְרַיִם
  choice: ఎఫ్రాయిము దేశంలోని
  rationale: హీబ్రూలో స్పష్టంగా ఉన్న אֶרֶץ (‘దేశం/ప్రాంతం’) పదాన్ని విడిచిపెట్టకుండా, పిరాతోను ఉన్న విస్తృత ప్రాంతాన్ని సహజ తెలుగులో తెలిపాం.
- source_word: בְּהַר הָעֲמָלֵקִי
  choice: అమాలేకీయుల కొండప్రాంతంలో
  rationale: ప్రాంతీయ భౌగోళిక వర్ణనలో הַר ఒకే కొండకన్నా కొండప్రాంతాన్ని సూచించగలదు. ఏకవచన జాతివాచకం ఇక్కడ సమూహ లేదా ప్రాదేశిక భావంలో ఉండే అవకాశాన్ని సహజ తెలుగులో బహువచనంతో వ్యక్తం చేశాం.
