translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన కథన శైలిని వాడాం. హీబ్రూ వాక్యంలోని రెండు సంఘటనలను తెలుగులో సహజంగా రెండు వాక్యాలుగా అందించాం. భౌగోళిక పదబంధంలోని నిజమైన ఏకవచన–సమూహార్థ సందిగ్ధతను పాదటిప్పణిలో నిలిపాం.
