source:
  edition: WLC
  text: וַ/יִּשְׁפֹּ֤ט אַֽחֲרָי/ו֙ אֶת יִשְׂרָאֵ֔ל אִבְצָ֖ן מִ/בֵּ֥ית לָֽחֶם־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/012/008.yaml
  text: After him[a], Ibzan from Bethlehem judged Israel.
translation:
  language: te
  text: అతని తరువాత, బేత్లెహేముకు చెందిన[a] ఇబ్జాను ఇశ్రాయేలుకు తీర్పు తీర్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “బేత్లెహేము నుండి.” హీబ్రూ పదం మూలస్థానాన్ని లేదా అనుబంధాన్ని సూచించవచ్చు.
    reason: The Hebrew preposition מִן can indicate either origin (‘from’) or association (‘of/belonging to’).
lexical_decisions:
- source_word: וַיִּשְׁפֹּט
  choice: న్యాయాధిపతిగా వ్యవహరించాడు
  rationale: న్యాయాధిపతుల గ్రంథంలో שׁפט అనేది ఇశ్రాయేలుపై న్యాయాధిపతిగా పరిపాలించడం, నాయకత్వం వహించడం అనే విస్తృత బాధ్యతను సూచిస్తుంది. తెలుగు సహజత్వంతో పాటు గ్రంథంలోని పదప్రయోగాన్ని నిలుపుతుంది.
- source_word: אַחֲרָיו
  choice: అతని తరువాత
  rationale: మునుపటి న్యాయాధిపతి తరువాత వచ్చిన వారసత్వ క్రమాన్ని నేరుగా తెలియజేస్తుంది; సందర్భంలో పూర్వపదం స్పష్టంగా ఉన్నందున పేరును చేర్చలేదు.
- source_word: אֶת יִשְׂרָאֵל
  choice: ఇశ్రాయేలుకు
  rationale: హీబ్రూ ప్రత్యక్ష కర్మ సూచికను తెలుగులో విడిగా అనువదించాల్సిన అవసరం లేదు. ఎవరికి న్యాయాధిపతిగా వ్యవహరించాడో సహజమైన తెలుగు వాక్యనిర్మాణంలో తెలియజేస్తుంది.
- source_word: אִבְצָן
  choice: ఇబ్జాను
  rationale: వ్యక్తి పేరును ఆధునిక ప్రామాణిక తెలుగు బైబిలు నామరూపానికి అనుగుణంగా లిప్యంతరీకరించింది.
- source_word: מִבֵּית לָחֶם
  choice: బేత్లెహేముకు చెందిన
  rationale: מִן ఇక్కడ మూలస్థానం లేదా అనుబంధాన్ని సూచించగలదు. ‘బేత్లెహేముకు చెందిన’ అనే రూపం ఆ సహజ ద్వంద్వార్థాన్ని తెలుగులో సంక్షిప్తంగా కాపాడుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. ‘తీర్పు తీర్చాడు’ కంటే ‘న్యాయాధిపతిగా వ్యవహరించాడు’ అనే పదబంధం שׁפט యొక్క పరిపాలనా-నాయకత్వ భావాన్ని మెరుగ్గా అందిస్తుంది.
