- from: అతని తరువాత బేత్లెహేముకు చెందిన ఇబ్జాను ఇశ్రాయేలుకు న్యాయాధిపతిగా వ్యవహరించాడు.
  to: అతని తరువాత, బేత్లెహేముకు చెందిన[a] ఇబ్జాను ఇశ్రాయేలుకు తీర్పు తీర్చాడు.
