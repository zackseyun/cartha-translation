id: JDG.12.7
reference: Judges 12:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּשְׁפֹּ֥ט יִפְתָּ֛ח אֶת יִשְׂרָאֵ֖ל שֵׁ֣שׁ שָׁנִ֑ים וַ/יָּ֗מָת יִפְתָּח֙ הַ/גִּלְעָדִ֔י וַ/יִּקָּבֵ֖ר בְּ/עָרֵ֥י גִלְעָֽד־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/012/007.yaml
  text: Jephthah judged Israel six years[a]. Then Jephthah the Gileadite died and was buried in the cities of Gilead.
translation:
  language: te
  text: యెఫ్తా ఇశ్రాయేలుకు ఆరు సంవత్సరాలు న్యాయాధిపతిగా ఉన్నాడు. తరువాత గిలాదీయుడైన యెఫ్తా చనిపోయాడు; అతన్ని గిలాదు పట్టణాల్లో సమాధి చేశారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'అక్షరార్థంగా: ‘గిలాదు పట్టణాల్లో.’ ఇక్కడ బహువచనం ఆ ప్రాంతంలోని పేర్కొనబడని ఒక పట్టణాన్ని సూచించే నుడికారంగా ఉండవచ్చు.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁפֹּט
  choice: న్యాయాధిపతిగా ఉన్నాడు
  rationale: న్యాయాధిపతులు గ్రంథంలో שׁפט ఒక న్యాయాధిపతి-విమోచకుని సేవను సూచిస్తుంది. ‘న్యాయాధిపతిగా ఉన్నాడు’ అనే ప్రయోగం గ్రంథంలోని ప్రధాన పదబంధాన్ని నిలుపుతూ, అతని పాత్రను కేవలం పరిపాలనగా లేదా సైనిక నాయకత్వంగా పరిమితం చేయదు.
- source_word: שֵׁשׁ שָׁנִים
  choice: ఆరు సంవత్సరాలు
  rationale: కాలవ్యవధిని తెలిపే సరళమైన పదబంధం; నేరుగా అనువదించబడింది.
- source_word: הַגִּלְעָדִי
  choice: గిలాదీయుడైన
  rationale: ఈ ప్రాంతసూచక విశేషణం యెఫ్తాను గిలాదుకు చెందినవాడిగా గుర్తిస్తుంది. తెలుగు వాక్యంలో ‘గిలాదీయుడైన’ సహజంగా, సంక్షిప్తంగా ఉంది.
- source_word: וַיִּקָּבֵר
  choice: అతన్ని ... సమాధి చేశారు
  rationale: హీబ్రూ క్రియ కర్మణి రూపంలో ఉంది. తెలుగులో వ్యక్తిని సమాధి చేసినట్లు తెలిపే ఈ నిర్మాణం సహజంగా ఉండి, కర్మణి భావాన్ని కాపాడుతుంది.
- source_word: בְּעָרֵי גִלְעָד
  choice: గిలాదు పట్టణాల్లో
  rationale: హీబ్రూ పాఠంలోని ‘గిలాదు పట్టణాల్లో’ అనే బహువచనాన్ని వ్యాఖ్యానాత్మకంగా ఏకవచనం చేయకుండా ప్రధాన పాఠంలో నిలిపాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన శైలిని వాడాం. ‘న్యాయాధిపతి’ అనే గ్రంథపరమైన ప్రధాన పదాన్ని నిలిపాం. హీబ్రూలోని అసాధారణ బహువచనాన్ని ప్రధాన పాఠంలో ఉంచి, దాని సాధ్యమైన నుడికార అర్థాన్ని పాదసూచికలో తెలిపాం.
