source:
  edition: WLC
  text: וַ/יִּקְבֹּ֤ץ יִפְתָּח֙ אֶת כָּל אַנְשֵׁ֣י גִלְעָ֔ד וַ/יִּלָּ֖חֶם אֶת אֶפְרָ֑יִם וַ/יַּכּוּ֩ אַנְשֵׁ֨י גִלְעָ֜ד אֶת אֶפְרַ֗יִם כִּ֤י אָמְרוּ֙ פְּלִיטֵ֤י אֶפְרַ֨יִם֙ אַתֶּ֔ם גִּלְעָ֕ד בְּ/ת֥וֹךְ אֶפְרַ֖יִם בְּ/ת֥וֹךְ מְנַשֶּֽׁה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/012/004.yaml
  text: Then Jephthah gathered all the men of Gilead and fought with Ephraim. And the men of Gilead struck Ephraim down[a], because they had said, “You Gileadites are fugitives of Ephraim, in the midst of Ephraim and in the midst of Manasseh.”
translation:
  language: te
  text: అప్పుడు యెఫ్తా గిలాదులోని పురుషులందరినీ సమకూర్చి ఎఫ్రాయిముతో యుద్ధం చేశాడు. గిలాదు పురుషులు ఎఫ్రాయిమును కొట్టారు[a]. ఎందుకంటే వారు, “గిలాదీయులైన మీరు ఎఫ్రాయిముకు చెందిన పారిపోయినవారు, ఎఫ్రాయిము మధ్యలో, మనష్షే మధ్యలో ఉన్నవారు” అని అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'చివరి నింద వాక్యంలోని హీబ్రూ వాక్యనిర్మాణం కఠినంగా ఉంది. ప్రత్యామ్నాయంగా: “ఎఫ్రాయిము పారిపోయినవారే మీరు, ఓ గిలాదా, ఎఫ్రాయిము మధ్యలోను మనష్షే మధ్యలోను ఉన్నవారు.” ‘కొట్టారు’ అనే క్రియను సందర్భానుసారం “ఓడించారు” అని కూడా అర్థం చేసుకోవచ్చు.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקְבֹּץ
  choice: సమకూర్చి
  rationale: קבץ అంటే కూడగట్టడం లేదా సమీకరించడం. యుద్ధ సందర్భంలోని సమీకరణ భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: כָּל אַנְשֵׁי גִלְעָד
  choice: గిలాదులోని పురుషులందరినీ
  rationale: హీబ్రూ పదబంధంలోని ‘గిలాదు పురుషులందరు’ అనే లింగస్పష్టమైన భావాన్ని నిలుపుతుంది; ‘యోధులు’ అని మూలంలో లేని నిర్దిష్టతను చేర్చదు.
- source_word: וַיִּלָּחֶם אֶת אֶפְרָיִם
  choice: ఎఫ్రాయిముతో యుద్ధం చేశాడు
  rationale: לחם నిఫాల్ రూపం యుద్ధం చేయడాన్ని సూచిస్తుంది. ‘తో’ ప్రత్యక్ష పోరాటాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וַיַּכּוּ
  choice: హతమార్చారు
  rationale: נכה యుద్ధ సందర్భంలో కొట్టడం, పడగొట్టడం లేదా సంహరించడం అనే పరిధిని కలిగి ఉంది. ఇక్కడ ‘హతమార్చారు’ హింసాత్మక సైనిక చర్యను స్పష్టంగా తెలియజేస్తుంది; అయితే క్రియ యొక్క పరిధి కారణంగా పాదటీపులో ప్రత్యామ్నాయాన్ని సూచించాం.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి చర్యకు కారణాన్ని పరిచయం చేసే సాధారణ ఆధునిక తెలుగు అనుసంధాన పదం.
- source_word: פְּלִיטֵי אֶפְרַיִם
  choice: ఎఫ్రాయిము నుండి పారిపోయినవారు
  rationale: פְּלִיטִים తప్పించుకున్న లేదా పారిపోయిన వారిని సూచిస్తుంది. తెలుగులో సహజంగా ఉండటంతో పాటు అవమానకరమైన నింద భావాన్ని నిలుపుతుంది.
- source_word: אַתֶּם גִּלְעָד
  choice: గిలాదీయులైన మీరు
  rationale: స్థల నామమైన ‘గిలాదు’ను ఆ ప్రాంత ప్రజలకు సమూహ సంబోధనగా వాడిన హీబ్రూ ప్రయోగాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בְּתוֹךְ אֶפְרַיִם בְּתוֹךְ מְנַשֶּׁה
  choice: ఎఫ్రాయిము మధ్యలో, మనష్షే మధ్యలో
  rationale: בְּתוֹךְ యొక్క ‘మధ్యలో/లోపల’ భావాన్ని, మూలంలోని పునరుక్తితో సహా నిలుపుతుంది; ‘మధ్య’ అంటే ‘రెండింటి నడుమ’ అని అతిగా వ్యాఖ్యానించదు.
theological_decisions:
- issue: చివరి నింద వాక్యంలోని కఠినమైన వాక్యనిర్మాణం
  choice: “గిలాదీయులైన మీరు ఎఫ్రాయిము నుండి పారిపోయినవారు; ఎఫ్రాయిము మధ్యలో, మనష్షే మధ్యలో ఉన్నవారు”
  alternative: “గిలాదా, మీరు ఎఫ్రాయిము పారిపోయినవారు; ఎఫ్రాయిము వారిలోను మనష్షే వారిలోను ఉన్నారు”
  rationale: హీబ్రూ నింద వాక్యం సంక్షిప్తంగా, వాక్యనిర్మాణపరంగా అస్పష్టంగా ఉంది. ప్రధాన పాఠం నేరుగా పలికిన అవమానాన్ని, פְּלִיטֵי యొక్క పారిపోయినవారు అనే భావాన్ని నిలుపుతూ చదవదగిన తెలుగును ఇస్తుంది; ప్రత్యామ్నాయ నిర్మాణాన్ని పాదటీపు ద్వారా చూపి అస్పష్టతను దాచదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన కథన శైలి. ప్రదేశ/గోత్ర నామాలకు యెఫ్తా, గిలాదు, ఎఫ్రాయిము, మనష్షే రూపాలు వాడబడ్డాయి. మూలంలోని పునరుక్తి, ప్రత్యక్ష నింద, వాక్యనిర్మాణ అస్పష్టత సాధ్యమైనంతవరకు నిలుపబడ్డాయి.
