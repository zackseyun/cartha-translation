  to: అప్పుడు యెఫ్తా గిలాదులోని పురుషులందరినీ సమకూర్చి ఎఫ్రాయిముతో యుద్ధం చేశాడు. గిలాదు పురుషులు ఎఫ్రాయిమును కొట్టారు[a]. ఎందుకంటే వారు, “గిలాదీయులైన మీరు ఎఫ్రాయిముకు చెందిన పారిపోయినవారు, ఎఫ్రాయిము మధ్యలో, మనష్షే మధ్యలో ఉన్నవారు” అని అన్నారు.
