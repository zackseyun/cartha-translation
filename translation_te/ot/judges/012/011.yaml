source:
  edition: WLC
  text: וַ/יִּשְׁפֹּ֤ט אַֽחֲרָי/ו֙ אֶת יִשְׂרָאֵ֔ל אֵיל֖וֹן הַ/זְּבֽוּלֹנִ֑י וַ/יִּשְׁפֹּ֥ט אֶת יִשְׂרָאֵ֖ל עֶ֥שֶׂר שָׁנִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/012/011.yaml
  text: After him, Elon the Zebulunite judged Israel ten years.
translation:
  language: te
  text: అతని తరువాత జెబూలూనీయుడైన ఏలోను ఇశ్రాయేలుకు న్యాయాధిపతిగా వ్యవహరించాడు. అతడు ఇశ్రాయేలుకు పది సంవత్సరాలు న్యాయాధిపతిగా వ్యవహరించాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁפֹּט
  choice: న్యాయం తీర్చాడు
  rationale: న్యాయాధిపతుల గ్రంథంలో שׁפט అనే పునరావృత మూలపదం న్యాయాధిపతి చేసిన కార్యాన్ని సూచిస్తుంది. ‘న్యాయం తీర్చాడు’ అనే రూపం కేవలం సైనిక నాయకత్వం లేదా పరిపాలనగా అర్థాన్ని పరిమితం చేయకుండా, గ్రంథంలోని న్యాయాధిపతి పరిభాషను నిలుపుతుంది.
- source_word: אַחֲרָיו
  choice: అతని తరువాత
  rationale: హీబ్రూ సర్వనామ రూపాన్ని యథాతథంగా ఉంచి, ముందటి సందర్భంలోని ఇబ్జానును వివరణాత్మకంగా పేరుపెట్టి చేర్చలేదు.
- source_word: אֵילוֹן
  choice: ఏలోను
  rationale: వ్యక్తి పేరును తెలుగు బైబిలు నామరూపాలకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: הַזְּבוּלֹנִי
  choice: జెబూలూనీయుడైన
  rationale: ఈ జాతి/గోత్ర విశేషణం ఏలోను జెబూలూను గోత్రానికి చెందినవాడని సూచిస్తుంది; తెలుగు వాక్యంలో సహజమైన విశేషణ రూపాన్ని వాడాం.
- source_word: עֶשֶׂר שָׁנִים
  choice: పది సంవత్సరాలు
  rationale: కాలవ్యవధిని తెలిపే హీబ్రూ పదబంధానికి సహజమైన తెలుగు రూపం.
- source_word: וַיִּשְׁפֹּט אֶת יִשְׂרָאֵל ... וַיִּשְׁפֹּט אֶת יִשְׂרָאֵל
  choice: ఇశ్రాయేలుకు న్యాయం తీర్చాడు; అతడు ఇశ్రాయేలుకు ... న్యాయం తీర్చాడు
  rationale: మూలపాఠంలో క్రియతో పాటు ‘ఇశ్రాయేలు’ కూడా రెండుసార్లు రావడాన్ని నిలిపాం. తెలుగు పఠనంలో రెండు వాక్యభాగాల సంబంధం స్పష్టంగా ఉండేందుకు అర్ధవిరామ చిహ్నం వాడాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. హీబ్రూ పునరుక్తిని తొలగించకుండా ఉంచాం; అయినా వాక్యాన్ని సహజంగా చదవగలిగేలా నిర్మించాం.
