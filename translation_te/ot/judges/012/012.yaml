source:
  edition: WLC
  text: וַ/יָּ֖מָת אֵל֣וֹן הַ/זְּבֽוּלֹנִ֑י וַ/יִּקָּבֵ֥ר בְּ/אַיָּל֖וֹן בְּ/אֶ֥רֶץ זְבוּלֻֽן׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/012/012.yaml
  text: Then Elon the Zebulunite died[a], and he was buried in Aijalon, in the land of Zebulun.
translation:
  language: te
  text: తరువాత జెబూలూనీయుడైన ఏలోను చనిపోయాడు; అతడు జెబూలూను దేశంలో[a] ఉన్న అయ్యాలోనులో పాతిపెట్టబడ్డాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “జెబూలూను భూభాగంలో.”
    reason: బְּאֶרֶץ זְבוּלֻן లో אֶרֶץ కు “దేశం”తో పాటు “భూభాగం/ప్రాంతం” అనే అర్థం కూడా సాధ్యమే; పాదసూచికను సంబంధిత భౌగోళిక పదబంధానికే జతచేశారు.
lexical_decisions:
- source_word: וַיָּמָת
  choice: తరువాత ... చనిపోయాడు
  rationale: వయ్యిక్తోల్ రూపం కథనంలోని తదుపరి సంఘటనను సూచిస్తుంది. ‘తరువాత’ సహజమైన తెలుగు కథన క్రమాన్ని తెలియజేస్తూ, ‘చనిపోయాడు’ అనే మూల అర్థాన్ని నిలుపుతుంది.
- source_word: אֵלוֹן
  choice: ఏలోను
  rationale: వ్యక్తి పేరును ఆధునిక ప్రామాణిక తెలుగు ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: הַזְּבוּלֹנִי
  choice: జెబూలూనీయుడైన
  rationale: నిర్దిష్ట ఆర్టికల్‌తో ఉన్న జాతి/గోత్ర విశేషణం ఏలోను జెబూలూను గోత్రానికి చెందినవాడని తెలియజేస్తుంది.
- source_word: וַיִּקָּבֵר
  choice: అతణ్ణి ... పాతిపెట్టారు
  rationale: కבר నిఫాల్ రూపంలోని కర్మణి భావాన్ని సహజమైన తెలుగు అనిర్దిష్ట కర్త నిర్మాణంతో వ్యక్తం చేశాం.
- source_word: בְּאַיָּלוֹן
  choice: అయ్యాలోనులో
  rationale: స్థల నామాన్ని లిప్యంతరీకరించి, בְּ సూచించే స్థలార్థాన్ని ‘లో’తో తెలిపాం.
- source_word: בְּאֶרֶץ זְבוּלֻן
  choice: జెబూలూను దేశంలోని
  rationale: אֶרֶץ ఇక్కడ ఒక గోత్రానికి చెందిన భూభాగాన్ని సూచిస్తుంది. ‘దేశం’ మూలానికి సమీపంగా ఉండి భౌగోళిక సూచనగా సహజంగా ఉంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. హీబ్రూ వాక్య క్రమాన్ని యాంత్రికంగా అనుసరించకుండా, సంఘటనల క్రమం మరియు భౌగోళిక సంబంధాన్ని స్పష్టంగా ఉంచాం. అందించిన ఆంగ్ల పాఠంలోని [a] సూచిక మూల వాక్యంలో ‘చనిపోయాడు’ తర్వాత పెట్టబడినప్పటికీ, దాని పాదసూచిక ‘జెబూలూను దేశం/భూభాగం’ అనే చివరి పదబంధానికి సంబంధించినదిగా కనిపిస్తుంది; ‘దేశం’ మరియు ‘భూభాగం’ మధ్య తేడా ఈ సందర్భంలో ప్రచురణాత్మక పాదసూచిక అవసరమయ్యేంత ప్రాముఖ్యమైనది కానందున పాదసూచిక ఇవ్వలేదు.
