id: JDG.12.3
reference: Judges 12:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וָֽ/אֶרְאֶ֞ה כִּֽי אֵינְ/ךָ֣ מוֹשִׁ֗יע וָ/אָשִׂ֨ימָ/ה נַפְשִׁ֤/י בְ/כַפִּ/י֙ וָֽ/אֶעְבְּרָ/ה֙ אֶל בְּנֵ֣י עַמּ֔וֹן וַ/יִּתְּנֵ֥/ם יְהוָ֖ה בְּ/יָדִ֑/י וְ/לָ/מָ֞ה עֲלִיתֶ֥ם אֵלַ֛/י הַ/יּ֥וֹם הַ/זֶּ֖ה לְ/הִלָּ֥חֶם בִּֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/012/003.yaml
  text: When I saw that you were not delivering us[a], I put my life in my hand and crossed over against the Ammonites, and Yahweh gave them into my hand. So why have you come up against me today to fight against me?
translation:
  language: te
  text: నువ్వు మమ్మల్ని కాపాడడం లేదని నేను గ్రహించినప్పుడు, నా ప్రాణాన్ని అరచేతిలో పెట్టుకొని[a] అమ్మోనీయుల మీదికి దాటివెళ్లాను. యాహ్వే వారిని నా చేతికి అప్పగించాడు. అలాంటప్పుడు, నాకు వ్యతిరేకంగా యుద్ధం చేయడానికి మీరు ఈ రోజు నా మీదికి ఎందుకు వచ్చారు?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “నా ప్రాణాన్ని నా అరచేతిలో పెట్టుకున్నాను”; అంటే, “నా ప్రాణాన్ని ప్రమాదంలో పెట్టాను.”
    reason: cultural_note
lexical_decisions:
- source_word: וָאֶרְאֶה
  choice: నేను గ్రహించినప్పుడు
  rationale: ראה యొక్క ప్రత్యక్ష అర్థం ‘చూశాను’; ఇక్కడ యెఫ్తా పరిస్థితిని గుర్తించి తదనుగుణంగా చర్య తీసుకున్న భావం ఉన్నందున ఆధునిక తెలుగులో ‘గ్రహించినప్పుడు’ సహజంగా ఆ కాల-కారణ సంబంధాన్ని తెలియజేస్తుంది.
- source_word: כִּי אֵינְךָ מוֹשִׁיעַ
  choice: నువ్వు మమ్మల్ని కాపాడడం లేదని
  rationale: מוֹשִׁיעַ ఇక్కడ సైనిక ప్రమాదం నుంచి విడిపించడం లేదా కాపాడడం అనే భావం ఇస్తుంది. హీబ్రూలో సంబోధన ఏకవచనంలో ఉంది; కర్మ స్పష్టంగా లేకపోయినా సందర్భం ప్రకారం ‘మమ్మల్ని’ అని తెలుగులో వ్యక్తం చేయడం వాక్యాన్ని సహజంగా చేస్తుంది.
- source_word: וָאָשִׂימָה נַפְשִׁי בְכַפִּי
  choice: నా ప్రాణాన్ని అరచేతిలో పెట్టుకొని
  rationale: ప్రాణాన్ని ప్రమాదంలో పెట్టడం అనే హీబ్రూ నుడికారంలోని స్పష్టమైన రూపకాన్ని నిలుపుతుంది; తెలుగులోనూ ఇది అర్థమయ్యే ప్రయోగం. భావాన్ని పాదసూచిక వివరిస్తుంది.
- source_word: וָאֶעְבְּרָה אֶל בְּנֵי עַמּוֹן
  choice: అమ్మోనీయుల మీదికి దాటివెళ్లాను
  rationale: עבר కదలిక లేదా దాటివెళ్లడాన్ని, אֶל యుద్ధ సందర్భంలో శత్రువువైపు కదలడాన్ని సూచిస్తాయి. ‘మీదికి’ శత్రుత్వ దిశను తెలియజేస్తూ ‘దాటివెళ్లాను’ మూలంలోని కదలికను నిలుపుతుంది.
- source_word: בְּנֵי עַמּוֹן
  choice: అమ్మోనీయులు
  rationale: ‘అమ్మోను కుమారులు’ అనే అక్షరార్థం కన్నా ప్రజాజాతిని సూచించే సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: וַיִּתְּנֵם יְהוָה בְּיָדִי
  choice: యాహ్వే వారిని నా చేతికి అప్పగించాడు
  rationale: విజయాన్ని సూచించే హీబ్రూ సూత్రప్రయోగంలోని ‘చేతికి ఇవ్వడం’ అనే రూపకాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: וְלָמָה עֲלִיתֶם אֵלַי
  choice: అలాంటప్పుడు ... మీరు ... నా మీదికి ఎందుకు వచ్చారు?
  rationale: עלה యుద్ధ సందర్భంలో దాడికి పైకి రావడం అనే భావం ఇస్తుంది. హీబ్రూలో ఇక్కడ బహువచన సంబోధన ఉన్నందున ‘మీరు’ వాడబడింది; ‘అలాంటప్పుడు’ ముందటి కారణాన్ని ప్రశ్నతో అనుసంధానిస్తుంది.
- source_word: הַיּוֹם הַזֶּה
  choice: ఈ రోజు
  rationale: హీబ్రూ కాలసూచక పదబంధానికి సహజమైన ఆధునిక తెలుగు సమానం.
- source_word: לְהִלָּחֶם בִּי
  choice: నాతో యుద్ధం చేయడానికి
  rationale: לחם మరియు ב కలయిక ప్రత్యర్థిపై పోరాడడాన్ని సూచిస్తుంది. ‘నాతో యుద్ధం చేయడానికి’ తెలుగులో స్పష్టంగా, గౌరవప్రదంగా ఉంది.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో నాలుగు అక్షరాల దైవనామం ప్రత్యక్షంగా ఉంది. దానిని బిరుదుతో భర్తీ చేయకుండా ‘యాహ్వే’గా లిప్యంతరీకరించడం నామాన్ని నిలుపుతుంది.
- issue: కాపాడేవాడు ఎవరు అనే వాక్యంలోని ఉద్రిక్తత
  choice: ఎఫ్రాయిమీయుల సహాయం లేకపోవడాన్ని ‘నువ్వు మమ్మల్ని కాపాడడం లేదని’ అని వ్యక్తం చేసి, విజయాన్ని యాహ్వే ఇచ్చాడని తదుపరి వాక్యంలో నిలిపివేయడం
  alternative: ‘రక్షకుడు ఎవరూ లేడని’ అని సాధారణీకరించడం
  rationale: אֵינְךָ ఏకవచన ప్రత్యక్ష సంబోధనను నిలుపుతూ, మానవ సహాయం విఫలమైనదీ యాహ్వే విజయమిచ్చినదీ అనే మూలపాఠంలోని ఉద్రిక్తతను చెరపదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. మొదటి సంబోధనలోని హీబ్రూ ఏకవచనాన్ని ‘నువ్వు’గా, తరువాతి బహువచనాన్ని ‘మీరు’గా ఉద్దేశపూర్వకంగా నిలిపాం. [a] సూచిక సంబంధిత నుడికారం వెంటనే ఉంచబడింది.
