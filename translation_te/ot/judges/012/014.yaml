  text: He had forty sons and thirty grandsons, riding on seventy donkeys, and he judged Israel eight years.
translation:
  language: te
  text: అతనికి నలభై మంది కుమారులు, ముప్పై మంది మనుమలు ఉన్నారు. వారు డెబ్బై గాడిదల మీద స్వారీ చేసేవారు. అతడు ఇశ్రాయేలుకు ఎనిమిది సంవత్సరాలు న్యాయం తీర్చాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי בָנִים
  choice: మనుమలు
  rationale: అక్షరార్థంగా ‘కుమారుల కుమారులు’; ఆధునిక తెలుగులో సహజంగా ‘మనుమలు’ అని చెప్పడం సరైనది.
- source_word: עֲיָרִם
  choice: గాడిదలు
  rationale: ఇక్కడి హీబ్రూ పదం మగ గాడిదలను సూచిస్తుంది; సందర్భంలో సాధారణ తెలుగు పదమైన ‘గాడిదలు’ స్పష్టంగా, సహజంగా ఉంది.
- source_word: וַיִּשְׁפֹּט אֶת־יִשְׂרָאֵל
  choice: ఇశ్రాయేలుకు న్యాయం తీర్చాడు
  rationale: שפט క్రియ న్యాయాధిపతిగా పరిపాలించడం/న్యాయం తీర్చడం అనే విస్తృత భావాన్ని కలిగి ఉంది; న్యాయాధిపతుల గ్రంథ సందర్భానికి అనుగుణంగా ఈ సంప్రదాయబద్ధమైన, అర్థవంతమైన రూపాన్ని ఎంచుకున్నాం.
