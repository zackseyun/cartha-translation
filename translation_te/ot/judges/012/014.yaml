  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన శైలి. హీబ్రూలోని participial phrase ‘డెబ్బై గాడిదల మీద స్వారీ చేసేవారు’ అనేది కుమారులు, మనుమలు కలిపిన డెబ్బై మందిని సూచించేలా సహజమైన వాక్యంగా విడదీయబడింది.
