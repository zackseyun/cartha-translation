source:
  edition: WLC
  text: וַ/יֹּ֣אמְרוּ ל/וֹ֩ אֱמָר נָ֨א שִׁבֹּ֜לֶת וַ/יֹּ֣אמֶר סִבֹּ֗לֶת וְ/לֹ֤א יָכִין֙ לְ/דַבֵּ֣ר כֵּ֔ן וַ/יֹּאחֲז֣וּ אוֹת֔/וֹ וַ/יִּשְׁחָט֖וּ/הוּ אֶל מַעְבְּר֣וֹת הַ/יַּרְדֵּ֑ן וַ/יִּפֹּ֞ל בָּ/עֵ֤ת הַ/הִיא֙ מֵֽ/אֶפְרַ֔יִם אַרְבָּעִ֥ים וּ/שְׁנַ֖יִם אָֽלֶף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/012/006.yaml
  text: Then they said to him[a], “Please say ‘Shibboleth.’” But he said, “Sibboleth,” because he could not say it that way. So they seized him and slaughtered him at the fords of the Jordan. At that time forty-two thousand from Ephraim fell.
translation:
  language: te
  text: అప్పుడు వారు అతనితో, “దయచేసి ‘షిబ్బోలెత్’[a] అని పలుకు” అన్నారు. అయితే అతడు దానిని ఆ విధంగా పలకలేక, “సిబ్బోలెత్” అన్నాడు. దాంతో వారు అతన్ని పట్టుకొని యొర్దాను నది దాటే చోట్ల వధించారు. ఆ సమయంలో ఎఫ్రాయిమువారిలో నలభై రెండు వేలమంది చనిపోయారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “షిబ్బోలెత్” అనే హీబ్రూ పదానికి బహుశా “ధాన్యపు కంకి” లేదా “ప్రవాహం” అనే అర్థం ఉండవచ్చు. అయితే ఇక్కడ దాన్ని ఉచ్చారణను పరీక్షించే పదంగా ఉపయోగించారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱמָר נָא
  choice: దయచేసి … అని పలుకు
  rationale: ఆజ్ఞార్థక క్రియతో ఉన్న נָא వినయపూర్వక అభ్యర్థనను సూచిస్తుంది; ఉచ్చారణ పరీక్ష సందర్భంలో ‘పలుకు’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: שִׁבֹּלֶת
  choice: షిబ్బోలెత్
  rationale: ఇక్కడ పదార్థం కన్నా ఉచ్చారణ పరీక్షే కథనానికి కీలకం; అందువల్ల ధ్వని భేదాన్ని నిలుపుకునే లిప్యంతరీకరణను వాడాం.
- source_word: סִבֹּלֶת
  choice: సిబ్బోలెత్
  rationale: మొదటి ధ్వనిలోని ‘షి/సి’ తేడా సంఘటనకు కేంద్రబిందువు; తెలుగు లిపిలో ఆ తేడాను స్పష్టంగా చూపించాం.
- source_word: וְלֹא יָכִין לְדַבֵּר כֵּן
  choice: దానిని ఆ విధంగా పలకలేక
  rationale: అక్షరార్థంగా ‘ఆ విధంగా మాట్లాడటానికి తనను సిద్ధం/నడిపించుకోలేకపోయాడు’; సందర్భంలో కోరిన ఉచ్చారణను చేయలేకపోవడమే భావం.
- source_word: וַיֹּאחֲזוּ אֹתוֹ
  choice: వారు అతన్ని పట్టుకొని
  rationale: אחז అంటే గట్టిగా పట్టుకోవడం లేదా అదుపులోకి తీసుకోవడం; ఈ సందర్భంలో ‘పట్టుకొని’ సహజమైన తెలుగు.
- source_word: וַיִּשְׁחָטוּהוּ
  choice: వధించారు
  rationale: שׁחט సాధారణ ‘చంపడం’ కంటే బలమైన, వధను సూచించే క్రియ; ‘వధించారు’ దాని తీవ్రతను గౌరవప్రదమైన ఆధునిక శైలిలో నిలుపుతుంది.
- source_word: אֶל מַעְבְּרוֹת הַיַּרְדֵּן
  choice: యొర్దాను రేవుల దగ్గర
  rationale: מַעְבְּרוֹת నదిని దాటగల అల్పలోతు ప్రదేశాలను సూచిస్తుంది; తెలుగులో ‘రేవులు’ సంక్షిప్తంగా, సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: וַיִּפֹּל ... מֵאֶפְרַיִם
  choice: ఎఫ్రాయిమువారిలో … చనిపోయారు
  rationale: యుద్ధ సందర్భంలో נפל అంటే మరణించడం; ‘ఎఫ్రాయిమువారిలో’ గోత్రానికి చెందినవారిని సహజంగా సూచిస్తుంది.
- source_word: אַרְבָּעִים וּשְׁנַיִם אָלֶף
  choice: నలభై రెండు వేలమంది
  rationale: హీబ్రూ సంఖ్యను యథాతథంగా, సహజమైన తెలుగు రూపంలో అందించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలిని అనుసరించాం. షిబ్బోలెత్/సిబ్బోలెత్ ధ్వని వ్యత్యాసాన్ని తెలుగు లిపిలో స్పష్టంగా నిలిపాం; హింసాత్మక క్రియ యొక్క బలాన్ని ‘వధించారు’తో కాపాడాం.
