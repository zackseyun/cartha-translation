translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథన శైలి వాడబడింది. హీబ్రూ వాక్యంలోని పునరావృత చర్యను ‘అప్పుడల్లా’ మరియు ‘అడిగేవారు’ ద్వారా నిలిపి ఉంచాం. వచనం తరువాతి వాక్యంతో కొనసాగుతున్నందున చివర కామా ఉంచబడింది.
