  text: וַ/יִּלְכֹּ֥ד גִּלְעָ֛ד אֶֽת מַעְבְּר֥וֹת הַ/יַּרְדֵּ֖ן לְ/אֶפְרָ֑יִם וְֽ֠/הָיָה כִּ֣י יֹאמְר֞וּ פְּלִיטֵ֤י אֶפְרַ֨יִם֙ אֶעֱבֹ֔רָה וַ/יֹּ֨אמְרוּ ל֧/וֹ אַנְשֵֽׁי גִלְעָ֛ד הַֽ/אֶפְרָתִ֥י אַ֖תָּה וַ/יֹּ֥אמֶֽר לֹֽא־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/012/005.yaml
  text: And Gilead captured the fords of the Jordan against Ephraim. And whenever the fugitives of Ephraim said[a], “Let me cross over,” the men of Gilead would say to him, “Are you an Ephraimite?” If he said, “No,”
translation:
  language: te
  text: గిలాదువారు ఎఫ్రాయిమీయులను అడ్డుకోవడానికి యొర్దాను నది రేవులను[a] తమ అధీనంలోకి తీసుకున్నారు. ఎఫ్రాయిమీయులలో పారిపోయి తప్పించుకున్నవారెవరైనా, “నన్ను దాటనివ్వండి” అని అడిగినప్పుడల్లా, గిలాదువారు అతనితో, “నువ్వు ఎఫ్రాయిమీయుడివా?” అని అడిగేవారు. అతడు, “కాదు” అని చెబితే,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “దాటే ప్రదేశాలను.” ఇక్కడి హీబ్రూ పదం యొర్దాను నదిని దాటడానికి ఉపయోగించే అల్పలోతు ప్రదేశాలను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלְכֹּד
  choice: తమ అధీనంలోకి తీసుకున్నారు
  rationale: లכד అనే పదం పట్టుకోవడం లేదా స్వాధీనం చేసుకోవడం అనే అర్థాన్ని ఇస్తుంది. ఇక్కడ వ్యూహాత్మకమైన నది దాటే ప్రదేశాలపై నియంత్రణ సాధించడాన్ని ఈ ప్రయోగం సహజంగా తెలియజేస్తుంది.
- source_word: מַעְבְּרוֹת
  choice: దాటే రేవులు
  rationale: ఈ పదం నదిని నడిచి దాటగల అల్పలోతు ప్రదేశాలను సూచిస్తుంది. ఆధునిక తెలుగులో ‘దాటే రేవులు’ స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: לְאֶפְרָיִם
  choice: ఎఫ్రాయిమీయులను అడ్డుకోవడానికి
  rationale: సందర్భంలో ל శత్రుత్వ లేదా నిరోధక సంబంధాన్ని సూచిస్తుంది; గిలాదువారు ఎఫ్రాయిమీయులు నది దాటకుండా ఆ ప్రదేశాలను స్వాధీనం చేసుకున్నారు.
- source_word: וְהָיָה כִּי
  choice: అడిగినప్పుడల్లా
  rationale: ఈ కథన ప్రయోగం పదేపదే జరిగిన పరిస్థితిని పరిచయం చేస్తుంది. ‘అప్పుడల్లా’ ఆ పునరావృత భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: פְּלִיטֵי אֶפְרַיִם
  choice: ఎఫ్రాయిము నుండి పారిపోయినవారు
  rationale: פּליט యుద్ధం నుండి తప్పించుకొని పారిపోయిన వ్యక్తిని సూచిస్తుంది. ‘పారిపోయినవారు’ ఈ సందర్భానికి స్పష్టమైన సాధారణ తెలుగు.
- source_word: אֶעֱבֹרָה
  choice: నన్ను దాటనివ్వండి
  rationale: మొదటి పురుష cohortative ఇక్కడ కోరిక లేదా అనుమతి అభ్యర్థనను వ్యక్తం చేస్తుంది.
- source_word: הַאֶפְרָתִי
  choice: ఎఫ్రాయిమీయుడు
  rationale: ఇది గోత్ర సంబంధిత గుర్తింపును సూచించే gentilic రూపం; తెలుగులో ‘ఎఫ్రాయిమీయుడు’ సహజమైన సమానార్థకం.
- source_word: וַיֹּאמֶר לֹא
  choice: అతడు ‘కాదు’ అని చెబితే
  rationale: రూపపరంగా ఇది వరుస కథన క్రియ అయినప్పటికీ, పునరావృత తనిఖీ విధానంలో షరతును సూచిస్తుంది; తరువాతి వచనంలో వచ్చే చర్యకు ఈ అనువాదం సహజంగా అనుసంధానమవుతుంది.
