    issue: The divine name is rendered “యెహోవా.”
    rationale: The supplied POB audit trail explicitly adopts “Yahweh” for יהוה. “యాహ్వే” should therefore be used for project-wide name consistency and closer correspondence to the stated rendering policy.
  - severity: low
    issue: The alternative footnote wording implies separate swords for Yahweh and Gideon.
    rationale: Hebrew has one singular חֶרֶב, followed by both names. The footnote should preserve the traditional genitival alternative without duplicating the noun.
