id: JDG.7.20
reference: Judges 7:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַֽ֠/יִּתְקְעוּ שְׁלֹ֨שֶׁת הָ/רָאשִׁ֥ים בַּ/שּֽׁוֹפָרוֹת֮ וַ/יִּשְׁבְּר֣וּ הַ/כַּדִּים֒ וַ/יַּחֲזִ֤יקוּ בְ/יַד שְׂמאוֹלָ/ם֙ בַּ/לַּפִּדִ֔ים וּ/בְ/יַ֨ד יְמִינָ֔/ם הַ/שּׁוֹפָר֖וֹת לִ/תְק֑וֹעַ וַֽ/יִּקְרְא֔וּ חֶ֥רֶב לַֽ/יהוָ֖ה וּ/לְ/גִדְעֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/020.yaml
  text: Then the three companies blew the trumpets and shattered the jars. They held the torches in their left hands and the trumpets in their right hands to blow[a], and they cried out, “A sword for Yahweh and for Gideon!”
translation:
  language: te
  text: అప్పుడు ఆ మూడు దళాలు కొమ్ము బూరలు ఊది, కుండలను పగలగొట్టాయి. వారు ఎడమ చేతుల్లో కాగడాలను, కుడి చేతుల్లో ఊదడానికి కొమ్ము బూరలను పట్టుకుని, “యాహ్వే కొరకు, గిద్యోను కొరకు ఖడ్గం!”[a] అని కేక వేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యాహ్వే యొక్కను గిద్యోను యొక్కను ఖడ్గం!”
    reason: హీబ్రూ యుద్ధనినాదం క్రియలేని సంక్షిప్త వాక్యం; לְ విభక్తిని ‘కొరకు’ అని గానీ, సంబంధార్థంగా గానీ అర్థం చేసుకోవచ్చు.
lexical_decisions:
- source_word: שְׁלֹשֶׁת הָרָאשִׁים
  choice: ఆ మూడు దళాలవారు
  rationale: సైనిక సందర్భంలో רָאשִׁים అనేది గిద్యోను ఏర్పాటు చేసిన మూడు విభాగాలను సూచిస్తుంది; తెలుగులో ‘దళాలవారు’ సహజంగా ఉండి, బూరలు ఊదినవారు ఆ దళాల్లోని మనుషులేనని స్పష్టం చేస్తుంది.
- source_word: שׁוֹפָרוֹת
  choice: కొమ్ము బూరలు
  rationale: שׁוֹפָר అనేది సంకేతాల కోసం ఊదే కొమ్ముతో చేసిన వాద్యం. ‘కొమ్ము బూరలు’ మూలార్థాన్ని తెలియజేస్తూ ఆధునిక తెలుగు పాఠకులకు అర్థమయ్యేలా ఉంది.
- source_word: הַכַּדִּים
  choice: కుండలను
  rationale: כַּד నీరు లేదా ఇతర పదార్థాలు ఉంచే పాత్రను సూచిస్తుంది; ఈ సందర్భంలో ‘కుండలు’ సహజమైన, స్పష్టమైన తెలుగు పదం.
- source_word: וַיַּחֲזִיקוּ
  choice: పట్టుకొని
  rationale: ఇక్కడ חזק హిఫీల్ రూపం చేతుల్లో గట్టిగా పట్టుకోవడాన్ని సూచిస్తుంది; ‘పట్టుకొని’ చర్యల క్రమాన్ని తెలుగులో సహజంగా కలుపుతుంది.
- source_word: בְיַד שְׂמאוֹלָם ... וּבְיַד יְמִינָם
  choice: ఎడమ చేతుల్లో ... కుడి చేతుల్లో
  rationale: హీబ్రూలో ఏకవచన ‘చేయి’ బహువచన సమూహంలోని ప్రతి వ్యక్తికి పంపిణీ భావంలో వాడబడింది; తెలుగులో బహువచనం సహజం.
- source_word: לַפִּדִים
  choice: కాగడాలను
  rationale: לַפִּיד మండుతున్న వెలుగు సాధనాన్ని సూచిస్తుంది; యుద్ధసన్నివేశంలో ‘కాగడాలు’ స్పష్టమైన, గౌరవప్రదమైన ఆధునిక తెలుగు పదం.
- source_word: לִתְקֹעַ
  choice: ఊదడానికి
  rationale: ఈ క్రియారూపం ఉద్దేశాన్ని తెలియజేస్తుంది; బూరలను పట్టుకున్న ఉద్దేశాన్ని ‘ఊదడానికి’ నేరుగా వ్యక్తపరుస్తుంది.
- source_word: וַיִּקְרְאוּ
  choice: కేక వేశారు
  rationale: קרא ఇక్కడ బిగ్గరగా పలికిన యుద్ధనినాదం; ‘కేక వేశారు’ దాని బలాన్ని, అత్యవసరతను సహజ తెలుగులో అందిస్తుంది.
- source_word: חֶרֶב לַיהוָה וּלְגִדְעוֹן
  choice: యెహోవా కోసం, గిద్యోను కోసం ఖడ్గం!
  rationale: హీబ్రూ వాక్యం క్రియలేని సంక్షిప్త యుద్ధనినాదం. לְ యొక్క ‘కోసం’ భావాన్ని నిలుపుతూ, మూలంలోని ఆకస్మికతను ఈ రూపం కాపాడుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించదగిన ‘యెహోవా’ రూపంలో వ్యక్తిగత నామంగా అందిస్తుంది.
theological_decisions:
- issue: חֶרֶב לַיהוָה וּלְגִדְעוֹן అనే యుద్ధనినాదం యొక్క సంక్షిప్త నిర్మాణం
  choice: యెహోవా కోసం, గిద్యోను కోసం ఖడ్గం!
  alternative: యెహోవా ఖడ్గం, గిద్యోను ఖడ్గం!
  rationale: మూలంలో క్రియ లేదు; לְ అనేది ‘కోసం/కు’ లేదా సంబంధార్థ విస్తరణకు వీలు ఇస్తుంది. ప్రధాన పాఠం విభక్తిని నేరుగా నిలుపుతుంది; సాంప్రదాయ సంబంధార్థ పఠనాన్ని అడుగుసూచనలో ఉంచడం ద్వారా నిజమైన సందిగ్ధతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండే సహజ వాక్యనిర్మాణంతో పాటు యుద్ధనినాదంలోని సంక్షిప్తత, ఉద్ధృతి నిలుపబడ్డాయి. దైవనామం వ్యక్తిగత నామంగా ‘యెహోవా’ అని ఇవ్వబడింది.
