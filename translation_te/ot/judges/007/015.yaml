id: JDG.7.15
reference: Judges 7:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְהִי֩ כִ/שְׁמֹ֨עַ גִּדְע֜וֹן אֶת מִסְפַּ֧ר הַ/חֲל֛וֹם וְ/אֶת שִׁבְר֖/וֹ וַ/יִּשְׁתָּ֑חוּ וַ/יָּ֨שָׁב֙ אֶל מַחֲנֵ֣ה יִשְׂרָאֵ֔ל וַ/יֹּ֣אמֶר ק֔וּמוּ כִּֽי נָתַ֧ן יְהוָ֛ה בְּ/יֶדְ/כֶ֖ם אֶת מַחֲנֵ֥ה מִדְיָֽן־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/015.yaml
  text: And when Gideon heard the telling of the dream and its interpretation, he bowed down in worship. Then he returned to the camp of Israel and said, “Get up, for the LORD has given the camp of Midian into your hand.”
translation:
  language: te
  text: గిద్యోను ఆ కల చెప్పబడడాన్ని, దాని వివరణను విన్నప్పుడు, సాగిలపడ్డాడు. తరువాత అతడు ఇశ్రాయేలు శిబిరానికి తిరిగి వచ్చి, “లేవండి! యెహోవా మిద్యానీయుల శిబిరాన్ని మీ చేతికి అప్పగించాడు” అన్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִסְפַּר הַחֲלוֹם
  choice: ఆ కలను వివరించడం
  rationale: מִסְפָּר ఇక్కడ కలను చెప్పడం లేదా వివరించడం అనే భావాన్ని సూచిస్తుంది; సహజమైన ఆధునిక తెలుగులో సందర్భానుగుణంగా అందించబడింది.
- source_word: שִׁבְרוֹ
  choice: దాని అర్థం చెప్పడం
  rationale: שֵׁבֶר అనే అరుదైన పదం ఈ సందర్భంలో కల యొక్క వివరణ లేదా అర్థవ్యాఖ్యను సూచిస్తుంది.
- source_word: וַיִּשְׁתָּחוּ
  choice: సాగిలపడ్డాడు
  rationale: క్రియ శరీరాన్ని వంచి నమస్కరించడాన్ని సూచిస్తుంది. దేవుని కార్యాన్ని గుర్తించిన సందర్భం ఆరాధనా భావాన్ని సూచించినా, మూలంలో లేని కర్మను స్పష్టంగా చేర్చకుండా నిజమైన స్వల్ప అస్పష్టతను నిలిపింది.
- source_word: קוּמוּ
  choice: లేవండి!
  rationale: బహువచన ఆజ్ఞను సూటిగా, సహజంగా అనువదిస్తుంది.
- source_word: נָתַן ... בְּיֶדְכֶם
  choice: మీ చేతికి అప్పగించాడు
  rationale: విజయార్థక హీబ్రూ నుడికారాన్ని తెలుగులో సహజంగా ఉంచింది; సంపూర్ణ క్రియ ద్వారా విజయ నిశ్చయాన్ని నిలిపింది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని సాధారణ తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన రూపంలో ప్రతిలిపి చేసింది.
theological_decisions:
- issue: וַיִּשְׁתָּחוּ అనే క్రియలో ఆరాధన భావం
  choice: సాగిలపడ్డాడు
  alternative: ఆరాధిస్తూ సాగిలపడ్డాడు
  rationale: సందర్భంలో దేవుని పట్ల ఆరాధన ఉద్దేశించబడినట్లు బలంగా కనిపించినా, మూలక్రియ స్వయంగా నమస్కరించడం/సాగిలపడడం అని మాత్రమే చెబుతుంది. అందువల్ల భావాన్ని అతిగా స్పష్టీకరించలేదు.
- issue: దేవుని భవిష్య విజయ ప్రకటనలో సంపూర్ణ క్రియ
  choice: అప్పగించాడు
  alternative: అప్పగించబోతున్నాడు
  rationale: హీబ్రూ נָתַן సంపూర్ణ రూపాన్ని గత/సంపూర్ణ భావంతో ఉంచడం ద్వారా దేవుడు విజయాన్ని ఇప్పటికే నిర్ధారించినట్టున్న వాక్యబలాన్ని కాపాడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కథనానికి తగిన గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. మూలంలోని పునరుక్త నిర్మాణాన్ని కొంత సహజీకరించినా, కల చెప్పబడటం మరియు దాని అర్థం వివరించబడటం అనే రెండు అంశాలు నిలిపివేయబడ్డాయి.
