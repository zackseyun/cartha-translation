  to: 'అప్పుడు అతడు జనాన్ని నీటి దగ్గరికి దింపాడు. యాహ్వే గిద్యోనుతో ఇలా అన్నాడు: “కుక్క నాకినట్టు తన నాలుకతో నీటిని నాకి తాగే ప్రతి ఒక్కణ్ణి విడిగా ఒకవైపు నిలబెట్టు[a]. అలాగే నీళ్లు తాగడానికి మోకాళ్ల మీద వంగే ప్రతి ఒక్కణ్ణి కూడా విడిగా నిలబెట్టు.”'
