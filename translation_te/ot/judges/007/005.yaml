source:
  edition: WLC
  text: וַ/יּ֥וֹרֶד אֶת הָ/עָ֖ם אֶל הַ/מָּ֑יִם וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל גִּדְע֗וֹן כֹּ֣ל אֲשֶׁר יָלֹק֩ בִּ/לְשׁוֹנ֨/וֹ מִן הַ/מַּ֜יִם כַּ/אֲשֶׁ֧ר יָלֹ֣ק הַ/כֶּ֗לֶב תַּצִּ֤יג אוֹת/וֹ֙ לְ/בָ֔ד וְ/כֹ֛ל אֲשֶׁר יִכְרַ֥ע עַל בִּרְכָּ֖י/ו לִ/שְׁתּֽוֹת־־ס־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/005.yaml
  text: So he brought the people down to the water[a], and Yahweh said to Gideon, “Everyone who laps the water with his tongue, as a dog laps, you shall set apart by himself; likewise everyone who kneels on his knees to drink.”
translation:
  language: te
  text: 'అప్పుడు అతడు జనాన్ని నీటి దగ్గరికి దింపాడు. యాహ్వే గిద్యోనుతో ఇలా అన్నాడు: “కుక్క నాకినట్టు తన నాలుకతో నీటిని నాకి తాగే ప్రతి ఒక్కణ్ణి విడిగా ఒకవైపు నిలబెట్టు[a]. అలాగే నీళ్లు తాగడానికి మోకాళ్ల మీద వంగే ప్రతి ఒక్కణ్ణి కూడా విడిగా నిలబెట్టు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతణ్ణి ఒంటరిగా ఒకచోట ఉంచు.” ఈ క్రియకు ఒకరిని వేరుగా ఉంచడం లేదా ఒక స్థానంలో నిలబెట్టడం అనే అర్థాలు రావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹרֶד
  choice: దింపాడు
  rationale: 'ירד హిఫీల్ రూపంలోని కారణార్థాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది: అతడు జనాన్ని నీటి దగ్గరికి దిగేలా చేశాడు.'
- source_word: הָעָם
  choice: జనాన్ని
  rationale: సైనిక సందర్భం ఉన్నప్పటికీ עם అనే సాధారణ సమూహవాచక పదాన్ని ‘సైనికులు’గా కుదించకుండా ఉంచుతుంది.
- source_word: אֶל הַמָּיִם
  choice: నీటి దగ్గరికి
  rationale: నీరు ఉన్న ప్రదేశం వైపు జనాన్ని దింపాడనే భావాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగు లిపిలో ధ్వన్యంతరీకరిస్తుంది.
- source_word: כֹּל אֲשֶׁר יָלֹק בִּלְשׁוֹנוֹ מִן הַמַּיִם
  choice: తన నాలుకతో నీటిని నాకుతూ తాగే ప్రతి ఒక్కణ్ణి
  rationale: ప్రతి వ్యక్తిని విడివిడిగా సూచించే నిర్మాణాన్ని, నాలుకతో నీటిని నాకే స్పష్టమైన దృశ్యాన్ని నిలుపుతుంది; తెలుగులో అర్థం సులభం కావడానికి ‘తాగే’ అని సందర్భార్థాన్ని స్పష్టం చేస్తుంది.
- source_word: כַּאֲשֶׁר יָלֹק הַכֶּלֶב
  choice: కుక్క నాకుతూ తాగినట్టు
  rationale: మూలంలోని స్పష్టమైన ఉపమానాన్ని సహజమైన తెలుగు వాక్యరూపంలో నిలుపుతుంది.
- source_word: תַּצִּיג אוֹתוֹ לְבָד
  choice: విడిగా ఒకవైపు నిలబెట్టు
  rationale: יצג హిఫీల్‌లోని నిలబెట్టడం లేదా ఒక స్థానంలో ఉంచడం అనే భావాన్నీ, לבד లోని వేరుచేయడం అనే భావాన్నీ కలిపి తెలియజేస్తుంది.
- source_word: וְכֹל אֲשֶׁר יִכְרַע עַל בִּרְכָּיו לִשְׁתּוֹת
  choice: అలాగే నీళ్లు తాగడానికి మోకాళ్ల మీద వంగే ప్రతి ఒక్కణ్ణి కూడా విడిగా నిలబెట్టు
  rationale: మోకాళ్ల మీద వంగడాన్ని స్పష్టంగా ఉంచి, హీబ్రూ రెండో భాగంలో అధ్యాహారంగా ఉన్న వేరుగా నిలబెట్టే ఆజ్ఞను తెలుగులో పునరుక్తి చేసి వాక్యాన్ని సంపూర్ణం చేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలంలో ఉన్న వ్యక్తిగత దైవనామాన్ని బిరుదుగా మార్చకుండా, ఆధునిక పండితుల సాధారణ పునర్నిర్మిత ఉచ్చారణకు అనుగుణంగా ధ్వన్యంతరీకరించింది.
- issue: రెండో గుంపుకు ఆజ్ఞను పునరుక్తి చేయడం
  choice: ‘విడిగా నిలబెట్టు’ అని తెలుగులో మళ్లీ స్పష్టం చేయడం
  alternative: ‘అలాగే నీళ్లు తాగడానికి మోకాళ్ల మీద వంగే ప్రతి ఒక్కణ్ణి’ అని అసంపూర్ణ నిర్మాణాన్ని అలాగే ఉంచడం
  rationale: హీబ్రూలో రెండో విభాగానికి మొదటి ఆజ్ఞ అధ్యాహారంగా వర్తిస్తుంది. దాని భావాన్ని మార్చకుండా తెలుగులో వ్యాకరణపరంగా సంపూర్ణం చేయబడింది; ఏ గుంపు ఎంపిక చేయబడిందనే తదుపరి వచనంలోని సమాచారాన్ని ఇక్కడ చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. మూలంలోని కుక్కతో పోలికను యథాతథంగా ఉంచి, సైనిక సందర్భం కారణంగా ‘జనం’ అనే విస్తృత పదాన్ని ‘సైనికులు’గా ప్రత్యేకీకరించలేదు. పాదసూచిక గుర్తును దానికి సంబంధించిన ‘విడిగా ఒకవైపు నిలబెట్టు’ అన్న పదబంధం వద్ద ఉంచాం.
