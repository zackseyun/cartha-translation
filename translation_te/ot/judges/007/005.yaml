  source_fidelity: 'మూల హీబ్రూ భావం మొత్తం సరిగానే ఉంది: గిద్యోను జనాన్ని నీటి వద్దకు దింపడం, యాహ్వే ఆజ్ఞ, నాలుకతో నీటిని నాకే వారిని కుక్కతో పోల్చడం, మోకాళ్లపై వంగి తాగే రెండో గుంపు అన్నీ నిలిచాయి. అయితే ‘కుక్క నాకుతూ తాగినట్టు’ అనే రూపం కుక్క చేసే చర్యను కొంచెం అస్పష్టంగా ఉంచుతుంది; ‘కుక్క నాకినట్టు’ అని చేయడం మూలంలోని ఉపమానానికి మరింత సూటిగా ఉంటుంది.'
