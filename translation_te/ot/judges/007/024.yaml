  rationale: The revision restores the lexical breadth of הַמַּיִם by translating it as ‘జలాలు’ and moving the contextual possibilities to the existing footnote. It also uses a directionally neutral Telugu imperative for ‘go down.’ The disputed force of וַיִּצָּעֵק remains represented as ‘పిలిపించబడ్డారు,’ with the alternative retained in the footnote. Footnote anchors remain attached to their relevant words or clause.
