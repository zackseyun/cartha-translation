  text: וּ/מַלְאָכִ֡ים שָׁלַ֣ח גִּדְעוֹן֩ בְּ/כָל הַ֨ר אֶפְרַ֜יִם לֵ/אמֹ֗ר רְד֞וּ לִ/קְרַ֤את מִדְיָן֙ וְ/לִכְד֤וּ לָ/הֶם֙ אֶת הַ/מַּ֔יִם עַ֛ד בֵּ֥ית בָּרָ֖ה וְ/אֶת הַ/יַּרְדֵּ֑ן וַ/יִּצָּעֵ֞ק כָּל אִ֤ישׁ אֶפְרַ֨יִם֙ וַ/יִּלְכְּד֣וּ אֶת הַ/מַּ֔יִם עַ֛ד בֵּ֥ית בָּרָ֖ה וְ/אֶת הַ/יַּרְדֵּֽן־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/024.yaml
  text: And Gideon sent messengers throughout all the hill country of Ephraim[a], saying, “Come down against Midian, and seize the waters as far as Beth-barah, and the Jordan.” So every man of Ephraim was called out, and they seized the waters as far as Beth-barah[c][b], and the Jordan.
translation:
  language: te
  text: గిద్యోను ఎఫ్రాయిము కొండప్రాంతమంతటా సందేశకులను పంపి, “మిద్యానును ఎదుర్కొనేందుకు దిగి వెళ్లి, బేత్బారా వరకు జలాలను[a], యొర్దానును స్వాధీనం చేసుకోండి” అని చెప్పాడు. అప్పుడు ఎఫ్రాయిము పురుషులందరూ[c] పిలిపించబడ్డారు[b]. వారు బేత్బారా వరకు జలాలను, యొర్దానును స్వాధీనం చేసుకున్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా ‘జలాలు’ లేదా ‘నీళ్లు.’ ఇక్కడ నీటి ప్రవాహాలు, దాటే రేవులు, లేదా వ్యూహాత్మక దాటువులు ఉద్దేశించబడి ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ఈ క్రియారూపం క్లిష్టమైనది. కొందరు దీన్ని మరింత అక్షరార్థంగా ‘కేకవేశారు’ అని అర్థం చేసుకుంటారు; అయితే సందర్భం వారిని పిలిపించి యుద్ధానికి సమీకరించారని సూచిస్తుంది.
    reason: alternative_reading
  - marker: c
    text: హీబ్రూలో అక్షరార్థంగా ‘ఎఫ్రాయిముకు చెందిన ప్రతి పురుషుడు.’ ఇది సమూహంగా పిలిపించబడిన ఎఫ్రాయిమీయుల యుద్ధపురుషులను సూచించే అవకాశం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמַלְאָכִים
  choice: సందేశకులను
  rationale: ఈ కథనంలో మానవ దూతలను సూచిస్తుంది. ‘సందేశకులు’ అనే పదం దేవదూతలనే సూచిస్తున్నారనే అపార్థాన్ని నివారిస్తూ వారి పనిని సహజంగా తెలియజేస్తుంది.
- source_word: בְּכָל הַר אֶפְרַיִם
  choice: ఎఫ్రాయిము కొండప్రాంతమంతటా
  rationale: הַר ఇక్కడ ఒకే పర్వతశిఖరాన్ని కాకుండా ఎఫ్రాయిము పర్వతభూమి ప్రాంతాన్ని సూచిస్తుంది.
- source_word: רְדוּ לִקְרַאת מִדְיָן
  choice: మిద్యానును ఎదుర్కొనేందుకు దిగివచ్చి
  rationale: రְדוּ భౌగోళికంగా ఎత్తైన ప్రాంతం నుంచి దిగడాన్ని సూచిస్తుంది; לִקְרַאת సైనిక సందర్భంలో ఎదుర్కోవడం లేదా అడ్డగించడం అనే భావం ఇస్తుంది.
- source_word: וְלִכְדוּ
  choice: స్వాధీనం చేసుకోండి
  rationale: లכד వ్యూహాత్మక ప్రదేశాలను పట్టుకొని తమ అదుపులో ఉంచడాన్ని సూచిస్తుంది; అదే మూలపదం రెండోసారి వచ్చినప్పుడు కూడా పదసామ్యాన్ని నిలిపాం.
- source_word: אֶת הַמַּיִם
  choice: నీటి మార్గాలను
  rationale: అక్షరార్థం ‘నీళ్లు/జలాలు.’ సందర్భంలో నదీప్రవాహాలు, దాటే రేవులు లేదా నీటికి సంబంధించిన వ్యూహాత్మక మార్గాలు ఉద్దేశించబడి ఉండవచ్చు. సహజమైన ప్రధాన పాఠ్యానికి ‘నీటి మార్గాలు’ ఎంచుకొని, అసలు పదంలోని విస్తృతతను పాదసూచికలో ఉంచాం.
- source_word: עַד בֵּית בָּרָה
  choice: బేత్బారా వరకు
  rationale: עַד విస్తృతి యొక్క చివరి హద్దును సూచిస్తుంది; స్థలనామాన్ని లిప్యంతరీకరించాం.
- source_word: וְאֶת הַיַּרְדֵּן
  choice: యొర్దానును
  rationale: హీబ్రూ స్థలనామాన్ని తెలుగులో ప్రాచుర్యంలో ఉన్న రూపంలో ఇచ్చాం; ‘నది’ అనే వివరణ అసలు పాఠ్యంలో లేదు.
- source_word: וַיִּצָּעֵק כָּל אִישׁ אֶפְרַיִם
  choice: ఎఫ్రాయిము పురుషులందరూ సమీకరించబడ్డారు
  rationale: క్రియారూపం క్లిష్టమైనది; అక్షరార్థానికి దగ్గరగా ‘కేకవేయబడింది’ అనడం ఈ సందర్భంలో అసహజం. సందేశకుల పిలుపు ఫలితంగా యుద్ధానికి సమీకరించబడిన భావం సందర్భానికి సరిపోతుంది. כָּל אִישׁ అనే ఏకవచన సమూహవ్యక్తీకరణను సహజ తెలుగులో బహువచనంగా ఇచ్చాం.
theological_decisions:
- issue: మిద్యానును ‘కలుసుకోవడం’ లేదా ‘ఎదుర్కోవడం’
  choice: ఎదుర్కొనేందుకు
  alternative: కలుసుకునేందుకు / మిద్యానుకు ఎదురుగా
  rationale: לִקְרַאת స్వతహాగా ఎదురుగా వెళ్లడం లేదా కలుసుకోవడం అనే విస్తృత భావాన్ని కలిగి ఉన్నా, ఈ సైనిక సందర్భంలో శత్రువును అడ్డుకొని ఎదుర్కోవడమే ఉద్దేశం. ఇందులో అదనపు మతసిద్ధాంత భావం చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి వాడాం. భౌగోళిక పేర్లకు తెలుగు బైబిలు వాడుకలో పరిచితమైన రూపాలు తీసుకున్నాం. అసలు హీబ్రూలోని ‘నీళ్లు’ మరియు క్లిష్టమైన సమీకరణ క్రియలో ఉన్న సందిగ్ధతలను పాదసూచికల్లో నిలిపాం.
