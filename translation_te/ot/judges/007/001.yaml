  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּשְׁכֵּ֨ם יְרֻבַּ֜עַל ה֣וּא גִדְע֗וֹן וְ/כָל הָ/עָם֙ אֲשֶׁ֣ר אִתּ֔/וֹ וַֽ/יַּחֲנ֖וּ עַל עֵ֣ין חֲרֹ֑ד וּ/מַחֲנֵ֤ה מִדְיָן֙ הָיָה ל֣/וֹ מִ/צָּפ֔וֹן מִ/גִּבְעַ֥ת הַ/מּוֹרֶ֖ה בָּ/עֵֽמֶק־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/001.yaml
  text: Then Jerubbaal (that is[a], Gideon) and all the people who were with him rose early and camped by the spring of Harod. The camp of Midian was north of him, by the hill of Moreh in the valley.
translation:
  language: te
  text: అప్పుడు యెరుబ్బయలు—అంటే గిద్యోను—అతనితో ఉన్న ప్రజలందరూ తెల్లవారుజామునే లేచి, హరోదు ఊట[a] వద్ద శిబిరం వేశారు. మిద్యాను శిబిరం అతనికి ఉత్తరంగా, లోయలోని మోరె కొండ దగ్గర ఉంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఏన్-హరోదు వద్ద.” ఈ హెబ్రీ స్థలనామంలో “ఊట” అనే అర్థమున్న పదం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכֵּם
  choice: తెల్లవారుజామునే లేచి
  rationale: שׁכם హిఫీల్ రూపం పొద్దున్నే లేవడాన్ని సూచిస్తుంది; ఈ తెలుగు ప్రయోగం కాలసూచనను సహజంగా నిలుపుతుంది.
- source_word: יְרֻבַּעַל הוּא גִדְעוֹן
  choice: యెరుబ్బయలు—అంటే గిద్యోను—
  rationale: הוּא ఇక్కడ రెండు పేర్లు ఒకే వ్యక్తిని సూచిస్తున్నాయని వివరిస్తుంది; రెండు పేర్లనూ ఉంచి వివరణాత్మక సంబంధాన్ని సహజంగా తెలిపింది.
- source_word: וְכָל הָעָם אֲשֶׁר אִתּוֹ
  choice: అతనితో ఉన్న ప్రజలందరూ
  rationale: సందర్భం సైనికమైనదైనా עָם అనే సాధారణ పదాన్ని ప్రత్యేకంగా ‘సైనికులు’ అని మార్చకుండా ‘ప్రజలు’గా నిలిపింది.
- source_word: וַיַּחֲנוּ
  choice: దిగారు
  rationale: חנה అంటే శిబిరం వేయడం. ప్రయాణం లేదా యుద్ధ సందర్భంలో ‘దిగారు’ సహజమైన తెలుగు; ఇక్కడ స్థిరపడి శిబిరం వేసిన భావాన్ని ఇస్తుంది.
- source_word: עַל עֵין חֲרֹד
  choice: హరోదు ఊట దగ్గర
  rationale: עֵין స్థలనామంలో భాగమైనప్పటికీ ‘ఊట’ అనే అర్థం కలిగి ఉంది; అర్థాన్ని అనువదిస్తూ హరోదు పేరును నిలిపింది.
- source_word: וּמַחֲנֵה מִדְיָן
  choice: మిద్యాను శిబిరం
  rationale: నిర్మాణబంధాన్ని నేరుగా, సహజమైన తెలుగులో వ్యక్తం చేసింది; హెబ్రీలో లేని జాతివాచక విశేషణాన్ని చేర్చలేదు.
- source_word: הָיָה לוֹ מִצָּפוֹן
  choice: అతనికి ఉత్తరంగా ... ఉంది
  rationale: לוֹ ఏకవచనాన్ని గిద్యోనును సూచించే ‘అతనికి’గా నిలిపింది; సమూహాన్ని ఉద్దేశించి బహువచనంగా సవరించలేదు.
- source_word: מִגִּבְעַת הַמּוֹרֶה
  choice: మోరె కొండ దగ్గర
  rationale: ఈ భౌగోళిక వర్ణనలో מן సామీప్యాన్ని సూచించగలదు; ‘దగ్గర’ సహజమైన స్థానసూచన.
- source_word: בָּעֵמֶק
  choice: లోయలోని
  rationale: עֵמֶק సాధారణంగా లోయను సూచిస్తుంది; ‘లోయలోని మోరె కొండ’ అని స్థల సంబంధాన్ని స్పష్టంగా, సంక్షిప్తంగా తెలిపింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. వ్యక్తి పేర్లు తెలుగు బైబిలు పఠనానికి అనుకూలంగా లిప్యంతరీకరించబడ్డాయి. హెబ్రీ ఏకవచన సంబంధసూచకాన్ని ‘అతనికి’గా కాపాడింది.
