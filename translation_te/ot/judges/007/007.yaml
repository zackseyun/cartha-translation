id: JDG.7.7
reference: Judges 7:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל גִּדְע֗וֹן בִּ/שְׁלֹשׁ֩ מֵא֨וֹת הָ/אִ֤ישׁ הַֽ/מֲלַקְקִים֙ אוֹשִׁ֣יעַ אֶתְ/כֶ֔ם וְ/נָתַתִּ֥י אֶת מִדְיָ֖ן בְּ/יָדֶ֑/ךָ וְ/כָל הָ/עָ֔ם יֵלְכ֖וּ אִ֥ישׁ לִ/מְקֹמֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/007.yaml
  text: And Yahweh said to Gideon[a], “With the three hundred men who lapped, I will save you and give Midian into your hand. And let all the people go, each man to his place.”
translation:
  language: te
  text: 'యాహ్వే గిద్యోనుతో ఇలా అన్నాడు: “నాకిన ఈ మూడు వందల మందితో[a] నేను మిమ్మల్ని రక్షించి, మిద్యానును నీ చేతికి అప్పగిస్తాను. ప్రజలందరూ, ప్రతి ఒక్కరూ తన స్థలానికి వెళ్లనివ్వు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నాకిన ఈ మూడు వందల మంది ద్వారా.”
    reason: బְּ అనే ఉపసర్గ ఇక్కడ సాధనం లేదా మాధ్యమాన్ని సూచించగలదు; “మందితో” మరియు “మంది ద్వారా” రెండూ సాధ్యమైన తెలుగు రూపాలు.
lexical_decisions:
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగులో దాని సాధారణ ధ్వన్యంతరీకరణగా ఉంచింది.
- source_word: בִּשְׁלֹשׁ מֵאוֹת הָאִישׁ
  choice: ఈ మూడు వందల మందితో
  rationale: בְּ యొక్క సాధనార్థాన్ని తెలుగులో సహజమైన ‘తో’ ద్వారా తెలిపింది; ‘ఈ’ సందర్భంలో ముందే వేరుచేయబడిన సమూహాన్ని స్పష్టం చేస్తుంది.
- source_word: הַמֲלַקְקִים
  choice: నీటిని నాలుకతో నాకిన
  rationale: ముందటి సందర్భంలోని గుర్తింపు చర్యను సాధారణ పాఠకునికి స్పష్టంగా తెలిపింది. మూలవచనంలో కర్మ పునరుక్తం కాకపోయినా, తెలుగులో ఒంటరిగా ‘నాకిన’ అనడం అసహజంగా ఉండటంతో సందర్భసిద్ధమైన ‘నీటిని’ చేర్చింది.
- source_word: אוֹשִׁיעַ אֶתְכֶם
  choice: నేను మిమ్మల్ని రక్షించి
  rationale: హిఫీల్ రూపంలోని రక్షణ/విడిపింపు భావాన్ని నిలుపుతుంది. ‘మిమ్మల్ని’ బహువచన రూపాన్ని కాపాడి, గిద్యోనుతోపాటు ఇశ్రాయేలు సమూహాన్ని సూచించగల మూలంలోని విస్తృతిని ఉంచుతుంది.
- source_word: וְנָתַתִּי אֶת מִדְיָן בְּיָדֶךָ
  choice: మిద్యానును నీ చేతికి అప్పగిస్తాను
  rationale: విజయాన్ని లేదా ఆధీనాన్ని ఇవ్వడం అనే హెబ్రీయ నుడికారాన్ని తెలుగులో అర్థవంతమైన సమాన నుడికారంతో అందించింది; ‘నీ’ ఏకవచనాన్ని నిలిపింది.
- source_word: וְכָל הָעָם
  choice: మిగిలిన ప్రజలందరిలో
  rationale: మూలంలోని ‘ప్రజలందరూ’ అనే పదాన్ని నిలుపుతూ, ఎంపికైన మూడు వందల మందికి భిన్నంగా తిరిగి వెళ్లవలసిన మిగిలిన సమూహమే ఉద్దేశమని సందర్భం స్పష్టం చేస్తుంది.
- source_word: יֵלְכוּ
  choice: వెళ్లాలి
  rationale: ఇక్కడి అసంపూర్ణ క్రియకు ఉన్న ఆజ్ఞాత్మక/అనుమతిపూర్వక భావాన్ని సహజమైన తెలుగు విధ్యర్థక రూపంతో తెలిపింది.
- source_word: אִישׁ לִמְקֹמוֹ
  choice: ప్రతి ఒక్కడూ తన స్థలానికి
  rationale: విభాజక ఏకవచన భావాన్ని కాపాడి, ‘ఇంటికి’ అని మూలంలో లేని నిర్దిష్టతను చేర్చకుండా ‘స్థలానికి’ అని ఉంచింది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠంలో దైవనామం ప్రత్యక్షంగా ఉంది. దానిని బిరుదుగా మార్చకుండా ధ్వన్యంతరీకరించడం నిబంధనాత్మక నామాన్ని కనిపించేలా ఉంచుతుంది.
- issue: אוֹשִׁיעַ లోని రక్షణ భావం
  choice: రక్షించి
  alternative: విడిపించి; విజయం కలిగించి
  rationale: ‘రక్షించు’ సైనిక విమోచనతోపాటు విస్తృత రక్షణార్థాన్ని నిలుపుతుంది; కేవలం ‘విజయం’గా పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే కథనశైలి వాడబడింది. దేవుని ప్రత్యక్ష వాక్యంలో గిద్యోనుకు ఏకవచన ‘నీ’, సమూహానికి బహువచన ‘మిమ్మల్ని’ అనే మూలభేదం నిలుపబడింది.
