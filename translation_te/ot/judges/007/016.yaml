id: JDG.7.16
reference: Judges 7:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּ֛חַץ אֶת שְׁלֹשׁ מֵא֥וֹת הָ/אִ֖ישׁ שְׁלֹשָׁ֣ה רָאשִׁ֑ים וַ/יִּתֵּ֨ן שׁוֹפָר֤וֹת בְּ/יַד כֻּלָּ/ם֙ וְ/כַדִּ֣ים רֵקִ֔ים וְ/לַפִּדִ֖ים בְּ/ת֥וֹךְ הַ/כַּדִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/016.yaml
  text: Then he divided the three hundred men into three companies[a], and put trumpets into the hands of all of them, and empty jars[c][b], with torches inside the jars.
translation:
  language: te
  text: అప్పుడు అతడు ఆ మూడు వందల మందిని మూడు దళాలుగా[a] విభజించాడు. వారందరి చేతుల్లో బూరలూ[b], ఖాళీ కుండలూ[c], ఆ కుండల లోపల కాగడాలూ పెట్టాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా ‘మూడు తలలుగా’; ఇది మూడు గుంపులు లేదా దళాలు అనే నుడికారం.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘కొమ్ము బూరలు’; హీబ్రూ పదం షోఫారోత్.
    reason: lexical_alternative
  - marker: c
    text: లేదా ‘ఖాళీ పాత్రలు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחַץ
  choice: విభజించాడు
  rationale: חצה ఇక్కడ సైన్యాన్ని వేర్వేరు దళాలుగా విభజించడాన్ని సూచిస్తుంది; ‘విభజించాడు’ సహజంగా, స్పష్టంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: שְׁלֹשׁ מֵאוֹת הָאִישׁ
  choice: ఆ మూడు వందల మంది పురుషులను
  rationale: אִישׁ యొక్క ప్రత్యక్ష అర్థమైన ‘పురుషులు’ను నిలుపుతూ, వారిని ‘సైనికులు’ అని మూలానికి మించి నిర్దిష్టం చేయలేదు.
- source_word: שְׁלֹשָׁה רָאשִׁים
  choice: మూడు దళాలుగా
  rationale: అక్షరార్థంగా ‘మూడు తలలు’; ఈ సందర్భంలో అది మూడు విభాగాలు లేదా దళాలు అనే హీబ్రూ నుడికారం. సైనిక సందర్భంలో ‘దళాలు’ సహజమైన ఎంపిక.
- source_word: וַיִּתֵּן
  choice: ఇచ్చాడు; ... ఉంచాడు
  rationale: נתן ప్రధానంగా ‘ఇచ్చాడు’ అని అర్థం. చేతుల్లో వస్తువులను పంపిణీ చేయడానికి ‘ఇచ్చాడు’ సహజం; కుండల్లో కాగడాల స్థానాన్ని తెలుగులో స్పష్టంగా చెప్పడానికి రెండవ భాగంలో ‘ఉంచాడు’ వాడబడింది.
- source_word: שׁוֹפָרוֹת
  choice: బూరలు
  rationale: שׁוֹפָר అనేది ఊది సంకేతమిచ్చే కొమ్ము వాద్యం. ఆధునిక తెలుగులో ‘బూరలు’ ఈ సందర్భానికి స్పష్టమైన, సహజమైన పదం; కొమ్ములతో చేసినవన్న ప్రత్యేకతను పాదసూచికలో ఉంచాం.
- source_word: בְּיַד כֻּלָּם
  choice: వారందరి చేతుల్లో
  rationale: హీబ్రూ పదబంధంలోని స్పష్టమైన చేతి చిత్రణను, ప్రతి ఒక్కరికీ పంపిణీ చేశాడనే భావాన్ని నిలుపుతుంది.
- source_word: כַדִּים רֵקִים
  choice: ఖాళీ కుండలు
  rationale: כַּד అనేది కుండ లేదా నీటి పాత్ర. ‘ఖాళీ కుండలు’ సాధారణ ఆధునిక తెలుగులో స్పష్టంగా ఉండి רֵקִיםను ప్రత్యక్షంగా నిలుపుతుంది.
- source_word: לַפִּדִים
  choice: కాగడాలు
  rationale: לַפִּיד మండే కాగడా లేదా అగ్ని దివిటీని సూచిస్తుంది. ‘కాగడాలు’ సందర్భంలోని వెలిగే, మోసుకెళ్లగల అగ్ని సాధనాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: בְּתוֹךְ הַכַּדִּים
  choice: ఆ కుండల్లో
  rationale: కాగడాలు పాత్రల లోపల ఉన్న స్థానాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది; తద్వారా వాటి కప్పివేత కూడా సందర్భానుసారంగా అర్థమవుతుంది.
