base_translation:
  language: en
  yaml_path: translation/ot/judges/007/023.yaml
  text: And the men of Israel were called out from Naphtali[a], from Asher, and from all Manasseh[c][b], and they pursued Midian.
translation:
  language: te
  text: ఇశ్రాయేలు పురుషులు[b] నఫ్తాలి నుండి, ఆషేరు నుండి, మనష్షే అంతటి నుండి పిలువబడ్డారు[a]. వారు మిద్యానును[c] వెంబడించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కూడగట్టబడ్డారు” లేదా “యుద్ధానికి సమీకరించబడ్డారు.” హీబ్రూ క్రియ ఇక్కడ అర్థనిర్ణయానికి కష్టమైనది; అక్షరార్థానికి దగ్గరగా “కేక వేశారు” అని కూడా తీసుకోవచ్చు. అయితే సందర్భంలో మిద్యానీయులను వెంబడించడానికి ఇశ్రాయేలీయులు పిలువబడి కూడగట్టబడడాన్ని ఇది సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ అక్షరార్థం “ఇశ్రాయేలు పురుషుడు.” ఇది “ఇశ్రాయేలు పురుషులు” లేదా “ఇశ్రాయేలీయులు” అనే సమష్టివాచక ప్రయోగం.
    reason: lexical_alternative
  - marker: c
    text: ఇక్కడ “మిద్యాను” అనే పేరు మిద్యానీయుల సైన్యాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּצָּעֵק
  choice: సమీకరించబడ్డారు
  rationale: నిఫ్అల్ రూపం, సందర్భం కలిపి చూస్తే ఇశ్రాయేలీయులు మిద్యానీయులను వెంబడించడానికి పిలువబడి సమకూర్చబడ్డారనే భావం వస్తుంది. ‘సమీకరించబడ్డారు’ ఆధునిక తెలుగులో ఈ సైనిక సమాహరణ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది; మూల ధాతువులోని ‘కేక వేయడం’ అనే సాధారణ భావాన్ని పాదసూచికలో నిలిపాం.
- source_word: אִישׁ יִשְׂרָאֵל
  choice: ఇశ్రాయేలు పురుషులు
  rationale: హీబ్రూలో ఏకవచన రూపం ఉన్నా ఇది సమష్టివాచక ప్రయోగం; తరువాతి క్రియ బహువచనంలో ఉండడం దీనిని నిర్ధారిస్తుంది. పురుషులను సూచించే మూలభాష భావాన్ని కూడా అనువాదం నిలుపుతుంది.
- source_word: מִנַּפְתָּלִי
  choice: నఫ్తాలి నుండీ
  rationale: מִן వారు వచ్చిన గోత్రపు మూలాన్ని సూచిస్తుంది; ‘నుండీ’ తెలుగులో సహజమైన సమానార్థకం.
- source_word: וּמִן אָשֵׁר
  choice: ఆషేరు నుండీ
  rationale: గోత్రాల జాబితాను కొనసాగిస్తూ వారి మూలాన్ని స్పష్టంగా తెలుపుతుంది.
- source_word: וּמִן כָּל מְנַשֶּׁה
  choice: మనష్షే గోత్రమంతటి నుండీ
  rationale: כָּל తెలిపే సమగ్రతను ‘గోత్రమంతటి’ నిలుపుతుంది. ‘గోత్రం’ అనేది స్పష్టత కోసం సందర్భానుగుణంగా చేర్చబడింది.
- source_word: וַיִּרְדְּפוּ
  choice: వెంబడించారు
  rationale: సైనిక కథనంలో רדף శత్రువును తరుముతూ వెంబడించడాన్ని సూచిస్తుంది; ‘వెంబడించారు’ గౌరవప్రదమైన ఆధునిక తెలుగు కథనశైలికి సరిపోతుంది.
- source_word: אַחֲרֵי מִדְיָן
  choice: మిద్యానును
  rationale: רדף ... אַחֲרֵי అనే హీబ్రూ ప్రయోగం తెలుగులో సకర్మకంగా ‘మిద్యానును వెంబడించారు’ అని సహజంగా వస్తుంది. ఇక్కడ ‘మిద్యాను’ మిద్యానీయుల సైన్యానికి ప్రతినిధిగా నిలుస్తుంది.
