  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి ఉపయోగించబడింది. మూలంలోని సమష్టివాచక ఏకవచనం, సమీకరణ క్రియలోని సందిగ్ధత, ‘మిద్యాను’ అనే నామంలోని లక్షణార్థ ప్రయోగం పాదసూచికలలో భద్రపరచబడ్డాయి.
