  rationale: సరఫరాలకు సంబంధించిన మూలపదం యొక్క విస్తృత అర్థాన్ని కాపాడేందుకు ‘ఆహారసామగ్రి’ని ‘సరఫరాలు’గా మార్చాం. చేతుల్లో ఉన్నాయనే మూలవాక్య నిర్మాణాన్ని నిలపడానికి ‘చేతుల్లోకి’ని ‘చేతుల్లో’గా సవరించాం. ప్రతి వ్యక్తి తన గుడారానికి వెళ్లాడనే పంపిణీ భావాన్ని ఆధునిక సహజ తెలుగులో చూపేందుకు ‘తమ తమ గుడారాలకు’ వాడాం. పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో సరైన పదానికి జతచేయబడింది.
