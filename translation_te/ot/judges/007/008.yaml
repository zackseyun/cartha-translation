source:
  edition: WLC
  text: וַ/יִּקְח֣וּ אֶת צֵדָה֩ הָ/עָ֨ם בְּ/יָדָ֜/ם וְ/אֵ֣ת שׁוֹפְרֹֽתֵי/הֶ֗ם וְ/אֵ֨ת כָּל אִ֤ישׁ יִשְׂרָאֵל֙ שִׁלַּח֙ אִ֣ישׁ לְ/אֹֽהָלָ֔י/ו וּ/בִ/שְׁלֹשׁ מֵא֥וֹת הָ/אִ֖ישׁ הֶֽחֱזִ֑יק וּ/מַחֲנֵ֣ה מִדְיָ֔ן הָ֥יָה ל֖/וֹ מִ/תַּ֥חַת בָּ/עֵֽמֶק־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/008.yaml
  text: So they took the provisions of the people in their hands[a], along with their trumpets. And he sent every man of Israel, each to his tent, but retained the three hundred men. And the camp of Midian was below him in the valley.
translation:
  language: te
  text: అప్పుడు వారు ప్రజల సరఫరాలను తమ చేతుల్లో తీసుకున్నారు, అలాగే వారి బూరలను[a] కూడా తీసుకున్నారు. గిద్యోను ఇశ్రాయేలు పురుషులందరినీ తమ తమ గుడారాలకు పంపివేసి, ఆ మూడు వందల మందిని తనతో ఉంచుకున్నాడు. మిద్యాను శిబిరం అతనికి దిగువన లోయలో ఉంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “కొమ్ము బూరలను,” లేక “పొట్టేలు కొమ్ములతో చేసిన బూరలను”; హీబ్రూ పదం సంకేతాల కోసం ఊదే కొమ్ము వాద్యాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: వారు తీసుకున్నారు
  rationale: לקח యొక్క సాధారణ కథన రూపాన్ని సహజమైన భూతకాలంతో అనువదించాం; బహువచన కర్త ఎంపికైన సైనికులను సూచిస్తుంది.
- source_word: צֵדָה הָעָם
  choice: ప్రజల ఆహారసామగ్రి
  rationale: צֵדָה కేవలం ఆహారానికే పరిమితం కాక ప్రయాణం లేదా యుద్ధానికి అవసరమైన సరఫరాలను సూచిస్తుంది; ‘ఆహారసామగ్రి’ ఆధునిక తెలుగులో విస్తృత భావాన్ని ఇస్తుంది.
- source_word: בְּיָדָם
  choice: తమ చేతుల్లోకి
  rationale: వస్తువులను స్వాధీనపరచుకొని మోసుకెళ్లడాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది; ‘చేతుల్లో’ అనే మూలంలోని దృశ్యరూపాన్ని నిలుపుతుంది.
- source_word: שׁוֹפְרֹתֵיהֶם
  choice: వారి బూరలు
  rationale: שׁוֹפָר సంకేతాల కోసం ఊదే కొమ్ము వాద్యాన్ని సూచిస్తుంది. ‘బూర’ తెలుగు బైబిలు సందర్భంలో సహజమైన వాద్యపదం; దాని నిర్మాణంపై ఉన్న అనిశ్చితిని పాదసూచికలో ఉంచాం.
- source_word: שִׁלַּח
  choice: పంపివేశాడు
  rationale: ఏకవచన క్రియకు గిద్యోను కర్త. సందర్భంలో ఇది సైనికులను వారి గుడారాలకు తిరిగి పంపడాన్ని సూచిస్తుంది.
- source_word: כָּל אִישׁ יִשְׂרָאֵל ... אִישׁ לְאֹהָלָיו
  choice: ఇశ్రాయేలు పురుషులందరినీ, ఒక్కొక్కరిని అతని గుడారానికి
  rationale: మూలంలోని పురుష ఏకవచన పంపిణీ భావాన్ని నిలిపాం; ఇక్కడ సూచించబడినవారు పురుష సైనికులు.
- source_word: וּבִשְׁלֹשׁ מֵאוֹת הָאִישׁ הֶחֱזִיק
  choice: ఆ మూడు వందల మందిని తనతో ఉంచుకున్నాడు
  rationale: הֶחֱזִיק ఇక్కడ మిగిలినవారిని పంపి ఈ చిన్న దళాన్ని తన వద్ద నిలుపుకోవడం అనే భావం ఇస్తుంది. ‘తనతో’ సందర్భార్థాన్ని సహజంగా స్పష్టం చేస్తుంది.
- source_word: מַחֲנֵה מִדְיָן
  choice: మిద్యాను శిబిరం
  rationale: హీబ్రూ నిర్మాణ సంబంధాన్ని తెలుగులో సహజమైన నామవాచక సమాసంగా ఇచ్చాం.
- source_word: מִתַּחַת בָּעֵמֶק
  choice: దిగువన లోయలో
  rationale: ఎత్తైన స్థలంలో ఉన్న గిద్యోనుతో పోలిస్తే శిబిరం తక్కువ ఎత్తులో, లోయలో ఉందనే భౌగోళిక సంబంధాన్ని కాపాడుతుంది.
