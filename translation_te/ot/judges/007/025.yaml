source:
  edition: WLC
  text: וַֽ/יִּלְכְּד֡וּ שְׁנֵֽי שָׂרֵ֨י מִדְיָ֜ן אֶת עֹרֵ֣ב וְ/אֶת זְאֵ֗ב וַ/יַּהַרְג֨וּ אֶת עוֹרֵ֤ב בְּ/צוּר עוֹרֵב֙ וְ/אֶת זְאֵב֙ הָרְג֣וּ בְ/יֶֽקֶב זְאֵ֔ב וַֽ/יִּרְדְּפ֖וּ אֶל מִדְיָ֑ן וְ/רֹאשׁ עֹרֵ֣ב וּ/זְאֵ֔ב הֵבִ֨יאוּ֙ אֶל גִּדְע֔וֹן מֵ/עֵ֖בֶר לַ/יַּרְדֵּֽן־־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/025.yaml
  text: And they captured the two princes of Midian[a], Oreb and Zeeb. They killed Oreb at the rock of Oreb, and they killed Zeeb at the winepress of Zeeb. Then they pursued Midian[b], and they brought the heads of Oreb and Zeeb to Gideon from across the Jordan.
translation:
  language: te
  text: వారు మిద్యానీయుల ఇద్దరు అధిపతులైన ఓరేబును, జెయేబును పట్టుకున్నారు.[a] ఓరేబును ఓరేబు బండ దగ్గర చంపారు; జెయేబును జెయేబు ద్రాక్షతొట్టి దగ్గర చంపారు. తరువాత వారు మిద్యానీయులను వెంబడించారు. ఓరేబు, జెయేబుల తలలను యొర్దాను అవతలి వైపు నుండి గిద్యోను వద్దకు తీసుకొచ్చారు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఓరేబు అనే పేరు ‘కాకి’ అనే హీబ్రూ పదంతో, జెయేబు అనే పేరు ‘తోడేలు’ అనే హీబ్రూ పదంతో సంబంధం కలిగి ఉన్నాయి. అయితే ప్రధాన పాఠ్యంలో రెండింటినీ వ్యక్తిపేర్లుగానే ఇచ్చాం.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘యొర్దాను అవతల నుండి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרֵי
  choice: అధిపతులు
  rationale: ఈ సందర్భంలో שַׂר ఉన్నత స్థాయి రాజకీయ-సైనిక నాయకులను సూచిస్తుంది. ‘అధిపతులు’ అనే పదం వారి హోదాను సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: וַיִּלְכְּדוּ
  choice: పట్టుకున్నారు
  rationale: לָכַד సైనిక సందర్భంలో పట్టుకోవడం లేదా బంధించడం అనే భావాన్ని ఇస్తుంది; తరువాత వారిని చంపినట్లు చెప్పబడటంతో ‘పట్టుకున్నారు’ స్పష్టంగా సరిపోతుంది.
- source_word: עֹרֵב
  choice: ఓరేబు
  rationale: ఇది వ్యక్తిపేరు కాబట్టి, ‘కాకి’ అనే మూలార్థాన్ని ప్రధాన పాఠ్యంలో అనువదించకుండా లిప్యంతరీకరించబడింది.
- source_word: זְאֵב
  choice: జెయేబు
  rationale: ఇది వ్యక్తిపేరు కాబట్టి, ‘తోడేలు’ అనే పదార్థాన్ని ప్రధాన పాఠ్యంలో అనువదించకుండా లిప్యంతరీకరించబడింది.
- source_word: בְּצוּר עוֹרֵב
  choice: ఓరేబు బండ దగ్గర
  rationale: צוּר అంటే బండ లేదా శిల. בְ స్థానసూచక భావాన్ని ‘దగ్గర’ సహజంగా తెలియజేస్తూ, హీబ్రూ స్థలనామ నిర్మాణాన్ని నిలుపుతుంది.
- source_word: בְיֶקֶב זְאֵב
  choice: జెయేబు ద్రాక్షతొట్టి దగ్గర
  rationale: יֶקֶב ద్రాక్షరసం తొక్కే తొట్టి లేదా గానుగను సూచిస్తుంది. ‘ద్రాక్షతొట్టి’ సాధారణ పాఠకునికి స్పష్టంగా ఉండి, స్థలాన్ని సూచించే בְ ను ‘దగ్గర’గా తటస్థంగా అందిస్తుంది.
- source_word: וַיִּרְדְּפוּ אֶל מִדְיָן
  choice: తరువాత వారు మిద్యానీయులను వెంబడించారు
  rationale: רָדַף + אֶל ఇక్కడ మిద్యానీయులపై కొనసాగిన వెంబడింపును సూచిస్తుంది. ‘తరువాత’ కథన క్రమాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וְרֹאשׁ עֹרֵב וּזְאֵב
  choice: ఓరేబు, జెయేబుల తలలను
  rationale: רֹאשׁ రూపంలో ఏకవచనమైనా, రెండు పేర్లతో కలిసినప్పుడు పంపిణీ భావం ఉంది; తెలుగులో భావస్పష్టత కోసం బహువచనమైన ‘తలలను’ వాడబడింది.
- source_word: מֵעֵבֶר לַיַּרְדֵּן
  choice: యొర్దాను అవతలి వైపు నుండి
  rationale: ఈ పదబంధం ‘యొర్దాను అవతల/ఆవలి వైపు నుండి’ అనే స్థల సంబంధాన్ని సూచిస్తుంది. దృష్టికోణం సందర్భానుసారంగా ఉండే అస్పష్టతను ఈ అనువాదం నిలుపుతుంది.
