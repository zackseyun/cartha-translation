translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, కథనానికి తగిన గంభీరతతో పాటు సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే పదజాలం వాడబడింది. వ్యక్తిపేర్లు సంప్రదాయ తెలుగు బైబిలు రూపాలకు దగ్గరగా లిప్యంతరీకరించబడ్డాయి; హీబ్రూలోని స్థల, దిశ సంబంధమైన స్వల్ప అస్పష్టతలను అతిగా నిర్ధారించకుండా నిలుపుకున్నాం.
