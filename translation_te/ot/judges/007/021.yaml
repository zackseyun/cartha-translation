  terminology: “శిబిరం,” “నిలబడ్డారు,” “కేకలు వేసి,” and “పారిపోయారు” are accurate, accessible choices. The footnote preserves the possible battle-cry/panic-cry nuance of וַיָּרִיעוּ without deciding it.
