  source_fidelity: 'The Telugu accurately represents the Hebrew sequence and participants: Gideon’s men stand individually in their assigned positions around the camp, while the camp’s people run, cry out, and flee. “శిబిరంలోని వారంతా” appropriately makes the collective “all the camp” natural in Telugu without adding interpretation.'
