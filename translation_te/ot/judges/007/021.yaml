source:
  edition: WLC
  text: וַ/יַּֽעַמְדוּ֙ אִ֣ישׁ תַּחְתָּ֔י/ו סָבִ֖יב לַֽ/מַּחֲנֶ֑ה וַ/יָּ֧רָץ כָּל הַֽ/מַּחֲנֶ֛ה וַ/יָּרִ֖יעוּ ו/יניסו־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/021.yaml
  text: And each man stood in his place around the camp[a], and the whole camp ran, and they shouted and fled.
translation:
  language: te
  text: ప్రతి ఒక్కరూ శిబిరం చుట్టూ తమతమ స్థానాల్లో నిలబడ్డారు. అప్పుడు శిబిరంలోని వారంతా పరుగెత్తుతూ కేకలు వేసి పారిపోయారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “కేకలు వేసి” అనే మాటకు “యుద్ధకేకలు వేసి” అని కూడా అర్థం కావచ్చు. ఇక్కడి హీబ్రూ క్రియ యుద్ధంలో వేసే పెద్ద కేకను గానీ, భయాందోళనలో వేసే కేకను గానీ సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַמְדוּ
  choice: నిలబడ్డారు
  rationale: עמד అనే క్రియ నిలబడడం లేదా తన స్థానంలో నిలవడం అనే భావాన్ని ఇస్తుంది; సందర్భంలో ఇది సహజమైన, నేరమైన అనువాదం.
- source_word: אִישׁ תַּחְתָּיו
  choice: ప్రతి ఒక్కరూ తమతమ స్థానాల్లో
  rationale: అక్షరార్థంగా ‘ఒక్కొక్కడు తన కింద’ అనే ఈ హీబ్రూ నుడికారం ప్రతి వ్యక్తి తన స్థానంలో ఉన్నాడనే భావాన్ని సూచిస్తుంది; ‘తమతమ’ పంపిణీ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: סָבִיב לַמַּחֲנֶה
  choice: శిబిరం చుట్టూ
  rationale: סביב తో ל కలసి శిబిరం చుట్టూ ఉన్న స్థానాన్ని సూచిస్తాయి; ఈ తెలుగు రూపం సంక్షిప్తంగా, సహజంగా ఉంది.
- source_word: וַיָּרָץ כָּל הַמַּחֲנֶה
  choice: శిబిరంలోని వారంతా పరుగెత్తుతూ
  rationale: רץ యొక్క ప్రాథమిక అర్థం ‘పరుగెత్తడం.’ כָּל הַמַּחֲנֶה అనే సమూహవాచకాన్ని తెలుగులో మనుషులను సూచించే సహజ రూపమైన ‘శిబిరంలోని వారంతా’గా ఇచ్చాం; గందరగోళాన్ని అతిగా వివరించలేదు.
- source_word: וַיָּרִיעוּ
  choice: కేకలు వేసి
  rationale: רוע/ריע యుద్ధకేకను గానీ భయాందోళనలోని పెద్ద కేకను గానీ సూచించవచ్చు. ‘కేకలు వేసి’ ఈ రెండు అవకాశాలను ముందుగానే తేల్చకుండా ఉంచుతుంది.
- source_word: ויניסו
  choice: పారిపోయారు
  rationale: నికుద్ లేని ఈ రూపం సందర్భానుసారం נוס ‘పారిపోవు’ అనే క్రియగా అర్థమవుతుంది; ‘పారిపోయారు’ ఆధునిక తెలుగులో స్పష్టమైన సమానార్థకం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని వాడాం. హీబ్రూలోని వరుస కార్యాలను సహజ తెలుగు వాక్యప్రవాహంలో ఉంచుతూ, కేక స్వభావంలోని అస్పష్టతను పాదటిప్పణిలో నిలిపాం.
