  source_fidelity: The draft accurately preserves Yahweh’s speech, Gideon, Midian, the collective singular ‘Israel,’ the singular idiomatic ‘hand,’ and the warning that Israel might claim its own deliverance. The negative-result force of פֶּן is suitably conveyed by ‘లేకపోతే.’
