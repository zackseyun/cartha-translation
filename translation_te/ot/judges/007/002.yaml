source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל גִּדְע֔וֹן רַ֗ב הָ/עָם֙ אֲשֶׁ֣ר אִתָּ֔/ךְ מִ/תִּתִּ֥/י אֶת מִדְיָ֖ן בְּ/יָדָ֑/ם פֶּן יִתְפָּאֵ֨ר עָלַ֤/י יִשְׂרָאֵל֙ לֵ/אמֹ֔ר יָדִ֖/י הוֹשִׁ֥יעָה לִּֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/002.yaml
  text: And Yahweh said to Gideon[a], “The people who are with you are too many for me to give Midian into their hand, lest Israel boast against me, saying[b], ‘My own hand has saved me.’”
translation:
  language: te
  text: 'యహ్వే గిద్యోనుతో ఇలా అన్నాడు: “మిద్యానును వారి చేతికి[a] అప్పగించడానికి నీతో ఉన్న ప్రజలు మరీ ఎక్కువమంది. లేకపోతే ఇశ్రాయేలు, ‘నా సొంత చేతే నన్ను రక్షించింది[b]’ అని చెబుతూ నా మీద గొప్పలు చెప్పుకుంటుంది.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “వారి చేతుల్లోకి.” హీబ్రూ నుడికారంలో ఏకవచన ‘చేతి’ తరచుగా అధికారం లేదా నియంత్రణను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా “నన్ను విడిపించింది.” హీబ్రూ క్రియకు ‘రక్షించు’ లేదా ‘విడిపించు’ అనే అర్థాలు రావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవనామమైన యహ్వేను బిరుదుతో భర్తీ చేయకుండా, హీబ్రూ చతురక్షర నామానికి ఆధునిక తెలుగు లిప్యంతరీకరణగా ఉంచింది.
- source_word: רַב הָעָם אֲשֶׁר אִתָּךְ
  choice: నీతో ఉన్న ప్రజలు మరీ ఎక్కువమంది
  rationale: רַב అనే పదానికి ఇక్కడ కేవలం ‘ఎక్కువమంది’ అనే అర్థం కాక, తరువాతి కారణాన్ని బట్టి ‘అవసరానికి మించినంత మంది’ అనే భావం ఉంది; ‘మరీ ఎక్కువమంది’ దాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: מִתִּתִּי אֶת־מִדְיָן בְּיָדָם
  choice: మిద్యానును వారి చేతికి అప్పగించడానికి
  rationale: ‘చేతికి అప్పగించడం’ అనే తెలుగు ప్రయోగం, హీబ్రూలోని ‘చేతి’ అనే అధికార/నియంత్రణ సూచక నుడికారాన్ని కాపాడుతుంది. మూలంలోని ఏకవచన ‘చేతి’ కూడా నిలిచింది.
- source_word: פֶּן
  choice: లేకపోతే ... గొప్పలు చెప్పుకుంటుంది
  rationale: ఈ సందర్భంలో ప్రతికూల ఉద్దేశం లేదా సంభావ్య ఫలితాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: יִתְפָּאֵר עָלַי
  choice: నా మీద గొప్పలు చెప్పుకుంటుంది
  rationale: హిత్పయేల్ రూపంలోని స్వీయ అతిశయ భావాన్నీ, עַל వల్ల వచ్చే దేవునికి విరుద్ధంగా/ఆయన ఎదుట గొప్పపడే భావాన్నీ కాపాడుతుంది.
- source_word: יָדִי
  choice: నా సొంత చెయ్యే
  rationale: ‘సొంత’ మరియు ‘ఏ’ అనే ఉద్ఘాటనలతో ఇశ్రాయేలు తన స్వశక్తికే రక్షణ ఘనతను ఆపాదించుకునే భావం స్పష్టమవుతుంది.
- source_word: הוֹשִׁיעָה לִּי
  choice: నన్ను రక్షించింది
  rationale: ישע క్రియకు సాధారణమైన ‘రక్షించు’ భావాన్ని నిలుపుతూ, ఇశ్రాయేలు తననే రక్షణకర్తగా చెప్పుకునే వాక్యంలోని ఉద్దేశపూర్వక ఉద్రిక్తతను కాపాడుతుంది.
theological_decisions:
- issue: దైవనామం అనువాదం
  choice: యహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలంలోని వ్యక్తిగత దైవనామాన్ని బిరుదుతో మార్చకుండా లిప్యంతరీకరించింది.
- issue: ఇశ్రాయేలు అనే సమష్టి నామానికి ఏకవచన ప్రయోగం
  choice: ఇశ్రాయేలు ... గొప్పలు చెప్పుకుంటుంది; ‘నా ... నన్ను’
  alternative: ఇశ్రాయేలీయులు ... గొప్పలు చెప్పుకుంటారు; ‘మా ... మమ్మల్ని’
  rationale: హీబ్రూ మూలం ఇశ్రాయేలును ఒక సమష్టి వ్యక్తిగా ఏకవచనంలో చూపుతుంది. ఆ దృక్కోణాన్ని వివరణాత్మకంగా బహువచనంలోకి మార్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్యనిర్మాణం. ‘చేతికి అప్పగించు’ వంటి సహజ తెలుగు నుడికారంతో మూలంలోని రూపకాన్ని నిలిపింది. పాదసూచిక గుర్తులను అవి వివరిస్తున్న పదబంధాల దగ్గరే ఉంచింది.
