  text: וַ/יְהִ֗י מִסְפַּ֞ר הַֽ/מֲלַקְקִ֤ים בְּ/יָדָ/ם֙ אֶל פִּי/הֶ֔ם שְׁלֹ֥שׁ מֵא֖וֹת אִ֑ישׁ וְ/כֹל֙ יֶ֣תֶר הָ/עָ֔ם כָּרְע֥וּ עַל בִּרְכֵי/הֶ֖ם לִ/שְׁתּ֥וֹת מָֽיִם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/006.yaml
  text: And the number of those lapping with their hand to their mouth was three hundred men[a], but all the rest of the people knelt on their knees to drink water.
translation:
  language: te
  text: తమ చేతితో నీటిని నోటికి చేర్చుకొని నాకినవారి సంఖ్య మూడు వందల మంది[a]; అయితే మిగిలిన ప్రజలందరూ నీళ్లు తాగడానికి తమ మోకాళ్లపై మోకరిల్లారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తమ చేతి నుండి నోటికి.” వారు నేరుగా వంగి తాగకుండా, చేతితో నీటిని నోటివరకు ఎత్తి తాగారని హీబ్రూ పదబంధం నొక్కిచెబుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִסְפַּר
  choice: సంఖ్య
  rationale: ఉపగుంపు మొత్తాన్ని తెలిపే పరిమాణవాచక నామవాచకానికి సహజమైన, సూటియైన తెలుగు పదం.
- source_word: הַמֲלַקְקִים
  choice: నాకుతూ తాగినవారు
  rationale: לקק అనే క్రియలోని స్పష్టమైన ‘నాకు’ దృశ్యాన్ని నిలుపుతూ, నీరు తాగే సందర్భంలో తెలుగు పాఠకులకు అర్థమయ్యేలా ‘తాగినవారు’ను జతచేసింది.
- source_word: בְּיָדָם אֶל־פִּיהֶם
  choice: తమ చేతితో నీళ్లు తీసుకొని నోటికి చేర్చి
  rationale: హీబ్రూ పదబంధంలోని చేతి-నుంచి-నోటి వైపు కదలికను సహజమైన తెలుగులో వ్యక్తం చేసి, నేరుగా వంగి తాగిన రెండవ గుంపుతో ఉన్న వ్యత్యాసాన్ని కాపాడుతుంది.
- source_word: שְׁלֹשׁ מֵאוֹת אִישׁ
  choice: మూడు వందల మంది
  rationale: సైనిక సందర్భంలో אִישׁ సూచించే పురుషుల సంఖ్యను తెలుగులో సహజంగా తెలిపే రూపం.
- source_word: וְכֹל יֶתֶר הָעָם
  choice: మిగిలిన ప్రజలంతా
  rationale: మొదటి గుంపుకు భిన్నమైన మిగతా సమూహాన్ని సంక్షిప్తంగా, స్పష్టంగా తెలియజేస్తుంది; తెలుగు వాక్యక్రమమే వ్యత్యాసాన్ని చూపుతుంది.
- source_word: כָּרְעוּ עַל בִּרְכֵיהֶם
  choice: మోకాళ్ల మీద వంగారు
  rationale: క్రియతో పాటు శరీర భంగిమను తెలిపే పదబంధాన్నీ నిలుపుతూ, నీటి దగ్గర మోకరిల్లి వంగిన చర్యను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לִשְׁתּוֹת מָיִם
  choice: నీళ్లు తాగడానికి
  rationale: ఉద్దేశాన్ని తెలిపే infinitive నిర్మాణాన్ని, హీబ్రూలో స్పష్టంగా ఉన్న ‘నీరు’ అనే పదంతో సహా సహజమైన తెలుగులో అందిస్తుంది.
