id: JDG.7.4
reference: Judges 7:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל גִּדְע֗וֹן עוֹד֮ הָ/עָ֣ם רָב֒ הוֹרֵ֤ד אוֹתָ/ם֙ אֶל הַ/מַּ֔יִם וְ/אֶצְרְפֶ֥/נּוּ לְ/ךָ֖ שָׁ֑ם וְ/הָיָ֡ה אֲשֶׁר֩ אֹמַ֨ר אֵלֶ֜י/ךָ זֶ֣ה יֵלֵ֣ךְ אִתָּ֗/ךְ ה֚וּא יֵלֵ֣ךְ אִתָּ֔/ךְ וְ/כֹ֨ל אֲשֶׁר אֹמַ֜ר אֵלֶ֗י/ךָ זֶ֚ה לֹא יֵלֵ֣ךְ עִמָּ֔/ךְ ה֖וּא לֹ֥א יֵלֵֽךְ־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/004.yaml
  text: 'Then the LORD said to Gideon, “The people are still too many. Bring them down to the water, and there I will test them for you. And this is what will happen: anyone of whom I say to you, ‘This one shall go with you,’ he shall go with you; but anyone of whom I say to you, ‘This one shall not go with you,’ he shall not go.”'
translation:
  language: te
  text: 'అప్పుడు యెహోవా గిద్యోనుతో ఇలా అన్నాడు: “ప్రజలు ఇంకా చాలా మంది ఉన్నారు. వారిని నీళ్ల దగ్గరికి దింపి తీసుకురా. అక్కడ నేను నీ కోసం వారిని పరీక్షిస్తాను. అప్పుడు ఇలా జరుగుతుంది: ‘ఇతడు నీతో వెళ్లాలి’ అని నేను నీతో ఎవరి గురించి చెబుతానో, అతడు నీతో వెళ్లాలి; ‘ఇతడు నీతో వెళ్లకూడదు’ అని నేను నీతో ఎవరి గురించి చెబుతానో, అతడు నీతో వెళ్లకూడదు.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన టెట్రాగ్రామాటన్‌ను బిరుదుగా మార్చకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే రూపంలో ఉంచాం.
- source_word: הוֹרֵד אוֹתָם אֶל־הַמַּיִם
  choice: వారిని నీళ్ల దగ్గరికి దింపుకొని రా
  rationale: హిఫిల్ ఆజ్ఞలోని కిందికి తీసుకువెళ్లే భావాన్ని సహజమైన తెలుగు ప్రయోగంతో వ్యక్తం చేస్తుంది.
- source_word: וְאֶצְרְפֶנּוּ לְךָ
  choice: నేను నీ కోసం వారిని పరీక్షిస్తాను
  rationale: צרף అనే క్రియకు శుద్ధిచేయడం/పరీక్షించడం అనే అర్థవ్యాప్తి ఉంది; ఈ సందర్భంలో ఎంపిక కోసం పరిశీలించడాన్ని ‘పరీక్షిస్తాను’ స్పష్టంగా తెలియజేస్తుంది. ఏకవచన ప్రత్యయాన్ని సమూహవాచకమైన ‘ప్రజలు’కు అనుగుణంగా తెలుగులో బహువచనంగా ఇచ్చాం.
- source_word: זֶה יֵלֵךְ אִתָּךְ
  choice: ఇతడు నీతో వెళ్లాలి
  rationale: హీబ్రూ నిర్దేశక ‘ఇతడు’ భావాన్ని, సందర్భంలోని ఎంపికను తెలిపే విధంగా సహజ తెలుగులో నిలిపాం.
- source_word: עִמָּךְ / אִתָּךְ
  choice: నీతో
  rationale: హీబ్రూలో వేర్వేరు ఉపసర్గ రూపాలు ఉన్నా, రెండూ ఇక్కడ సహవాసాన్ని సూచిస్తాయి; తెలుగులో ఒకే సహజ రూపం సరిపోతుంది.
theological_decisions:
- issue: దైవనామం יְהוָה యొక్క అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలంలో వ్యక్తిగత దైవనామం ఉన్నందున దానిని సాధారణ బిరుదైన ‘ప్రభువు’గా మార్చకుండా లిప్యంతరీకృత సంప్రదాయ రూపాన్ని వాడాం.
- issue: וְאֶצְרְפֶנּוּ యొక్క భావం
  choice: వారిని పరీక్షిస్తాను
  alternative: వారిని శుద్ధిచేస్తాను / వారిని వడపోస్తాను
  rationale: ఈ వాక్యసందర్భం సైనికులను ఎంపిక చేయడానికి చేసే పరీక్షను వివరిస్తుంది. ‘పరీక్షిస్తాను’ మూలక్రియ యొక్క పరిశీలన భావాన్ని నిలుపుతూ, అనవసరమైన ఆధ్యాత్మిక శుద్ధి భావాన్ని రుద్దదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా అనువదించాం. హీబ్రూ వాక్యంలోని పునరుక్తి మరియు ఎంపికకు సంబంధించిన షరతు నిర్మాణాన్ని సాధ్యమైనంతవరకు నిలిపాం; వివరణాత్మక పదాలను చేర్చలేదు.
