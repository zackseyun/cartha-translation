translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే కథన శైలి వాడబడింది. మూలంలోని עַתָּה ను ‘ఇప్పుడు’గా స్పష్టంగా నిలిపాం. వివాదాస్పద క్రియకూ భౌగోళిక సూచనకూ ప్రధాన పాఠంలో అతిగా నిర్దిష్టత ఇవ్వకుండా పాదసూచికల్లో ప్రత్యామ్నాయాలను నమోదు చేశాం.
