source:
  edition: WLC
  text: וְ/עַתָּ֗ה קְרָ֨א נָ֜א בְּ/אָזְנֵ֤י הָ/עָם֙ לֵ/אמֹ֔ר מִֽי יָרֵ֣א וְ/חָרֵ֔ד יָשֹׁ֥ב וְ/יִצְפֹּ֖ר מֵ/הַ֣ר הַ/גִּלְעָ֑ד וַ/יָּ֣שָׁב מִן הָ/עָ֗ם עֶשְׂרִ֤ים וּ/שְׁנַ֨יִם֙ אֶ֔לֶף וַ/עֲשֶׂ֥רֶת אֲלָפִ֖ים נִשְׁאָֽרוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/003.yaml
  text: Please proclaim in the hearing of the people[a], saying, ‘Whoever is fearful and trembling, let him return and depart from Mount Gilead.’ Then twenty-two thousand of the people returned[b], and ten thousand remained.
translation:
  language: te
  text: 'ఇప్పుడు ప్రజలకు వినిపించేలా ఇలా ప్రకటించు: “భయపడి వణికేవాడు తిరిగి, గిలాదు కొండ[b] నుంచి వెళ్లిపోవాలి[a].” అప్పుడు ప్రజల్లో ఇరవై రెండు వేలమంది తిరిగి వెళ్లిపోయారు; పదివేలమంది మిగిలారు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “వెళ్లిపోవాలి” అని అనువదించిన హీబ్రూ క్రియ (וְיִצְפֹּר) అరుదైనది; దాని అర్థం వివాదాస్పదం. అది “త్వరగా వెళ్లిపోవాలి” లేదా “రహస్యంగా జారిపోవాలి” అనే భావాన్ని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ పాఠానికి సూటి అనువాదం “గిలాదు కొండ.” అయితే ఈ సందర్భంలో దాని భౌగోళిక సూచన స్పష్టంగా లేదు; కొందరు దీన్ని విస్తృతమైన గిలాదు కొండ ప్రాంతంగా అర్థం చేసుకుంటారు.
    reason: cultural_note
lexical_decisions:
- source_word: וְעַתָּה
  choice: కాబట్టి ఇప్పుడు
  rationale: וְ అనేది సందర్భంతో అనుసంధానించే పదం; עַתָּה స్పష్టంగా ‘ఇప్పుడు’ అని సూచిస్తుంది. సహజమైన తెలుగు కథన ప్రవాహం కోసం ‘కాబట్టి ఇప్పుడు’ అని అనువదించబడింది.
- source_word: קְרָא נָא בְּאָזְנֵי הָעָם
  choice: ప్రజలందరికీ వినబడేలా ఇలా ప్రకటించు
  rationale: క్రియతో ఉన్న נָא ఆజ్ఞను వినయపూర్వకంగా లేదా ప్రేరేపణాత్మకంగా చేస్తుంది; בְּאָזְנֵי అనే ‘చెవుల్లో’ అన్న హీబ్రూ నుడికారాన్ని సహజమైన తెలుగులో బహిరంగంగా వినిపించే ప్రకటనగా వ్యక్తం చేశాం.
- source_word: מִי יָרֵא וְחָרֵד
  choice: భయపడి వణికేవాడు
  rationale: יָרֵא భయాన్ని, חָרֵד వణుకును సూచిస్తాయి. రెండు పదాల తీవ్రతను సహజంగా నిలుపుతుంది.
- source_word: יָשֹׁב
  choice: తిరిగి
  rationale: ప్రకటనలో ఇది అనుమతి లేదా ఆదేశ భావమున్న జస్సివ్ రూపం. తరువాతి క్రియతో కలిపి తెలుగులో ‘తిరిగి ... వెళ్లిపోవాలి’ అని సహజంగా వ్యక్తం చేశాం.
- source_word: וְיִצְפֹּר
  choice: వెళ్లిపోవాలి
  rationale: ఈ అరుదైన క్రియ అర్థం వివాదాస్పదం; త్వరగా బయలుదేరడం లేదా జారుకోవడం వంటి భావాలు ప్రతిపాదించబడ్డాయి. ప్రధాన పాఠంలో సందర్భానికి అవసరమైన వెనుదిరిగి వెళ్లే భావాన్ని మాత్రమే ఇచ్చి, ప్రత్యేక నుడికారాన్ని పాదసూచికలో ఉంచాం.
- source_word: מֵהַר הַגִּלְעָד
  choice: గిలాదు కొండ నుంచి
  rationale: הַר కు ‘కొండ,’ ‘పర్వతం,’ లేదా విస్తృతంగా ‘కొండ ప్రాంతం’ అనే అర్థాలు ఉండవచ్చు. ఏకవచన స్థలనామ రూపాన్ని అనుసరించి ‘గిలాదు కొండ’ అని ఇచ్చాం; భౌగోళిక సమస్యను పాదసూచికలో తెలిపాం.
- source_word: וַיָּשָׁב מִן הָעָם עֶשְׂרִים וּשְׁנַיִם אֶלֶף
  choice: అప్పుడు ప్రజల్లో ఇరవై రెండు వేలమంది తిరిగి వెళ్లిపోయారు
  rationale: సంఖ్యతో వచ్చిన హీబ్రూ ఏకవచన క్రియ సమూహాన్ని సూచిస్తుంది. తెలుగులో సంఖ్యాబహువచనానికి తగిన సహజ నిర్మాణం వాడాం.
- source_word: וַעֲשֶׂרֶת אֲלָפִים נִשְׁאָרוּ
  choice: పదివేలమంది మిగిలారు
  rationale: נשאר అనే క్రియ ‘మిగిలి ఉండడం’ను సూచిస్తుంది; కథన సందర్భంలో ‘మిగిలారు’ సంక్షిప్తంగా, సహజంగా ఉంది.
