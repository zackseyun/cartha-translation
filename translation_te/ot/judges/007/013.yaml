  to: 'గిద్యోను వచ్చినప్పుడు, ఇదిగో, ఒక మనిషి తన సహచరునికి ఒక కలను చెబుతున్నాడు. అతడు ఇలా అన్నాడు: “చూడు, నేను ఒక కల కనాను. ఇదిగో, ఒక గుండ్రని యవ రొట్టె[a] మిద్యాను శిబిరంలో దొర్లుకుంటూ ఆ గుడారం దగ్గరకు వచ్చి దానిని కొట్టింది; గుడారం పడిపోయింది. ఆ రొట్టె దానిని తలకిందులుగా తిప్పివేసింది, గుడారం పడిపోయింది.”'
  rationale: The revision removes an unstated destination, reflects the definite tent, clarifies the loaf–tent action sequence, and preserves both the vivid discourse markers and the Hebrew’s repeated statement that the tent fell. The rare bread term remains qualified by the existing lexical-alternative footnote.
