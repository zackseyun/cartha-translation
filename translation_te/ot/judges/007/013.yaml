source:
  edition: WLC
  text: וַ/יָּבֹ֣א גִדְע֔וֹן וְ/הִ֨נֵּה אִ֔ישׁ מְסַפֵּ֥ר לְ/רֵעֵ֖/הוּ חֲל֑וֹם וַ/יֹּ֜אמֶר הִנֵּ֧ה חֲל֣וֹם חָלַ֗מְתִּי וְ/הִנֵּ֨ה צלול לֶ֤חֶם שְׂעֹרִים֙ מִתְהַפֵּךְ֙ בְּ/מַחֲנֵ֣ה מִדְיָ֔ן וַ/יָּבֹ֣א עַד הָ֠/אֹהֶל וַ/יַּכֵּ֧/הוּ וַ/יִּפֹּ֛ל וַ/יַּהַפְכֵ֥/הוּ לְ/מַ֖עְלָ/ה וְ/נָפַ֥ל הָ/אֹֽהֶל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/013.yaml
  text: 'When Gideon came[a], behold, a man was telling a dream to his companion. He said, “Look, I dreamed a dream: behold, a round loaf of barley bread was rolling around in the camp of Midian, and it came up to the tent and struck it so that it fell, He turned it upside down, and the tent collapsed.”'
translation:
  language: te
  text: 'గిద్యోను వచ్చినప్పుడు, ఇదిగో, ఒక మనిషి తన సహచరునికి ఒక కలను చెబుతున్నాడు. అతడు ఇలా అన్నాడు: “చూడు, నేను ఒక కల కనాను. ఇదిగో, ఒక గుండ్రని యవ రొట్టె[a] మిద్యాను శిబిరంలో దొర్లుకుంటూ ఆ గుడారం దగ్గరకు వచ్చి దానిని కొట్టింది; గుడారం పడిపోయింది. ఆ రొట్టె దానిని తలకిందులుగా తిప్పివేసింది, గుడారం పడిపోయింది.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “యవ రొట్టె ముద్ద,” లేదా “యవ రొట్టె.” ఇక్కడున్న హీబ్రూ పదం చాలా అరుదైనది; అది గుండ్రని రొట్టెను లేదా రొట్టె ముద్దను సూచించి ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: అక్కడికి వచ్చినప్పుడు
  rationale: వావ్-కన్సిక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది; సందర్భంలోని స్థలానికి గిద్యోను చేరుకున్న సమయాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: అకస్మాత్తుగా దృష్టిని ఆకర్షించే హీబ్రూ అవ్యయపు సజీవ కథన బలాన్ని నిలుపుతుంది.
- source_word: מְסַפֵּר לְרֵעֵהוּ
  choice: తన తోటి వ్యక్తికి ఒక కలను వివరిస్తున్నాడు
  rationale: వర్తమాన కృదంతం కొనసాగుతున్న చర్యను సూచిస్తుంది; సైనిక సందర్భంలో רֵעַను అతిగా స్నేహార్థంతో నిర్దిష్టం చేయకుండా అనువదిస్తుంది.
- source_word: הִנֵּה חֲלוֹם חָלַמְתִּי
  choice: చూడు, నాకు ఒక కల వచ్చింది
  rationale: తెలుగులో సహజమైన సంభాషణను ఇస్తూ, కలను ప్రత్యేకంగా ముందుకు తెచ్చే మూలంలోని ఉద్ఘాటనను నిలుపుతుంది.
- source_word: צלול לֶחֶם שְׂעֹרִים
  choice: ఒక గుండ్రని యవ రొట్టె
  rationale: צלול అరుదైన పదం; అది గుండ్రని రొట్టె లేదా రొట్టె ముద్దను సూచించే అవకాశముంది. ప్రధాన పాఠంలో సంభావ్య ఆకారాన్ని తెలిపి, అనిశ్చితిని పాదసూచికలో ఉంచాం.
- source_word: מִתְהַפֵּךְ
  choice: దొర్లుతూ వచ్చి
  rationale: హిత్పయేల్ రూపం తనమీద తాను తిరుగుతూ కదలడాన్ని సూచిస్తుంది; తెలుగు సందర్భంలో ‘దొర్లుతూ’ ఆ కదలికను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בְּמַחֲנֵה מִדְיָן
  choice: మిద్యాను శిబిరంలో
  rationale: בְּ యొక్క సాధారణ స్థానార్థమైన ‘లో’ను కాపాడుతుంది; శిబిరంలో జరిగిన కదలికను సూచిస్తుంది.
- source_word: עַד הָאֹהֶל
  choice: ఒక గుడారం వరకు చేరింది
  rationale: עַד ఒక హద్దు లేదా గమ్యబిందువు వరకు చేరడాన్ని సూచిస్తుంది; నిర్దిష్ట గుడారం కాక ఏదో ఒక గుడారం అనే సందర్భార్థాన్ని తెలుగులో సహజంగా ఇస్తుంది.
- source_word: וַיַּכֵּהוּ
  choice: ఆ గుడారాన్ని ఢీకొట్టగా
  rationale: రొట్టె గుడారాన్ని బలంగా తాకిన చర్యను ఆధునిక తెలుగులో స్పష్టంగా, శక్తివంతంగా వ్యక్తం చేస్తుంది.
- source_word: וַיַּהַפְכֵהוּ לְמַעְלָה
  choice: అది దానిని తలకిందులు చేయడంతో
  rationale: హీబ్రూలోని పుంలింగ ఏకవచన కర్తను రొట్టెగానే కొనసాగిస్తూ, గుడారాన్ని తిరగదోసిన భావాన్ని తెలుపుతుంది; సర్వనామ సూచనలో మూలంలోని స్వల్ప అస్పష్టతను పూర్తిగా తొలగించదు.
- source_word: וְנָפַל הָאֹהֶל
  choice: గుడారం కూలిపోయింది
  rationale: చివరి ఫలితంగా గుడారం పూర్తిగా పడిపోవడాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; మునుపటి וַיִּפֹּלతో ఉన్న పునరుక్తిని సందర్భానుగుణంగా వైవిధ్యపరుస్తుంది.
