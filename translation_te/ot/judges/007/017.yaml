source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֲלֵי/הֶ֔ם מִמֶּ֥/נִּי תִרְא֖וּ וְ/כֵ֣ן תַּעֲשׂ֑וּ וְ/הִנֵּ֨ה אָנֹכִ֥י בָא֙ בִּ/קְצֵ֣ה הַֽ/מַּחֲנֶ֔ה וְ/הָיָ֥ה כַ/אֲשֶׁר אֶעֱשֶׂ֖ה כֵּ֥ן תַּעֲשֽׂוּ/ן־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/017.yaml
  text: And he said to them[a], “Watch me, and do likewise. Behold, when I come to the edge of the camp, then as I do, so you shall do.”
translation:
  language: te
  text: అతడు వారితో, “నన్ను గమనించండి; అలాగే చేయండి.[a] ఇదిగో, నేను శిబిరం అంచుకు వచ్చినప్పుడు, నేను ఎలా చేస్తానో మీరూ అలాగే చేయండి” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నన్ను చూసి, అలాగే చేయండి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִמֶּנִּי תִרְאוּ
  choice: నన్ను గమనించి
  rationale: ראה తో מן కలిసిన ఈ ఆదేశాత్మక సందర్భంలో, గిద్యోనును చర్యకు నమూనాగా జాగ్రత్తగా చూడడం భావం. ‘గమనించి’ అనేది ఆధునిక తెలుగులో సహజంగా ఆ భావాన్ని ఇస్తుంది.
- source_word: וְכֵן תַּעֲשׂוּ
  choice: నేను చేసినట్టే చేయండి
  rationale: כֵן విధానాన్ని, అంటే ‘అలాగే/ఆ విధంగా’ అనే భావాన్ని సూచిస్తుంది. ముందున్న గిద్యోనును గమనించాలనే ఆదేశంతో కలిపి తెలుగులో అనుకరణ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: తరువాత చెప్పబోయే చర్యపై శ్రద్ధ నిలిపే హీబ్రూ సూచక అవ్యయపు ఉద్ఘాటనను ‘ఇదిగో’ నిలుపుతుంది.
- source_word: אָנֹכִי בָא
  choice: నేను … చేరినప్పుడు
  rationale: వర్తమాన కృదంతం సమీపంలో జరగబోయే కదలికను సూచిస్తుంది. గమ్యస్థానంతో కూడిన తెలుగు వాక్యంలో ‘చేరినప్పుడు’ సహజంగా ఉండి, సందర్భంలోని కాలసంబంధ భావాన్ని అందిస్తుంది.
- source_word: בִּקְצֵה הַמַּחֲנֶה
  choice: శిబిరం అంచుకు
  rationale: קצה శిబిరపు చివరి హద్దు లేదా అంచును సూచిస్తుంది; ‘శిబిరం అంచు’ సంక్షిప్తమైన, స్పష్టమైన తెలుగు రూపం.
- source_word: וְהָיָה כַאֲשֶׁר
  choice: అప్పుడు … ఎలా
  rationale: ఈ నిర్మాణం తదుపరి ఆదేశానికి సందర్భం మరియు క్రమాన్ని ఏర్పరుస్తుంది. తెలుగులో ‘చేరినప్పుడు … ఎలా’ అనే నిర్మాణం ఆ సంబంధాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אֶעֱשֶׂה כֵּן תַּעֲשׂוּן
  choice: నేను ఎలా చేస్తానో మీరూ అలాగే చేయాలి
  rationale: మూలంలోని ‘నేను చేసిన విధంగానే మీరు చేయాలి’ అనే అనుకరణ సూత్రాన్ని, చివరి క్రియలోని బలమైన ఆదేశ భావంతో సహా నిలుపుతుంది.
