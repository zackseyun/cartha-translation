- from: అతడు వారితో, “నన్ను గమనించి, నేను చేసినట్టే చేయండి.[a] ఇదిగో, నేను శిబిరం అంచుకు చేరినప్పుడు, నేను ఎలా చేస్తానో మీరూ అలాగే చేయాలి” అన్నాడు.
  to: అతడు వారితో, “నన్ను గమనించండి; అలాగే చేయండి.[a] ఇదిగో, నేను శిబిరం అంచుకు వచ్చినప్పుడు, నేను ఎలా చేస్తానో మీరూ అలాగే చేయండి” అన్నాడు.
