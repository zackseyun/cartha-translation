translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ఆదేశ శైలి వాడబడింది. ‘ఇదిగో’ ద్వారా హీబ్రూ וְהִנֵּה యొక్క శ్రద్ధాకర్షక ఉద్ఘాటన నిలుపబడింది. బహువచన గౌరవ/ఆదేశ రూపాలు సందర్భానికి అనుగుణంగా ఉన్నాయి.
