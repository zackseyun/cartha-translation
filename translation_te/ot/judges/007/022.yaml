id: JDG.7.22
reference: Judges 7:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַֽ/יִּתְקְעוּ֮ שְׁלֹשׁ מֵא֣וֹת הַ/שּׁוֹפָרוֹת֒ וַ/יָּ֣שֶׂם יְהוָ֗ה אֵ֣ת חֶ֥רֶב אִ֛ישׁ בְּ/רֵעֵ֖/הוּ וּ/בְ/כָל הַֽ/מַּחֲנֶ֑ה וַ/יָּ֨נָס הַֽ/מַּחֲנֶ֜ה עַד בֵּ֤ית הַשִּׁטָּה֙ צְֽרֵרָ֔תָ/ה עַ֛ד שְׂפַת אָבֵ֥ל מְחוֹלָ֖ה עַל טַבָּֽת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/022.yaml
  text: When the three hundred trumpets were blown[a], Yahweh set every man's sword against his companion and against the whole camp, and the camp fled as far as Beth-shittah toward Zererah, as far as the edge of Abel-meholah[d][c][b], by Tabbath.
translation:
  language: te
  text: ఆ మూడు వందల కొమ్ము బూరలను ఊదినప్పుడు[a], యాహ్వే శిబిరమంతటా ఒక్కొక్కడి కత్తిని అతని తోటివానికి ఎదురు మళ్లించాడు[b]. అప్పుడు ఆ సైన్యం బేత్-షిత్తా వరకు, సెరేరా వైపుగా, తబ్బాతు దగ్గరనున్న ఆబేల్-మెహోలా అంచు వరకు పారిపోయింది[c][d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆ మూడు వందల పొట్టేలు కొమ్ము బూరలను ఊదినప్పుడు.” హీబ్రూ షోఫారోత్ అనే పదం కొమ్ముతో చేసిన బూరలను, తరచుగా పొట్టేలు కొమ్ములతో చేసినవాటిని, సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ప్రతి ఒక్కరి కత్తిని అతని తోటివానికీ శిబిరమంతటికీ ఎదురు మళ్లించాడు.” హీబ్రూ వాక్యం కత్తులు శిబిరంలోని ఇతరులపైకి తిరిగాయని లేదా ఆ గందరగోళం శిబిరమంతా వ్యాపించిందని సూచించవచ్చు.
    reason: alternative_reading
  - marker: c
    text: బేత్-షిత్తా, సెరేరా, ఆబేల్-మెహోలా, తబ్బాతు పారిపోతున్న సైన్యం మార్గంలోని స్థలాల పేర్లు.
    reason: cultural_note
  - marker: d
    text: “ఆబేల్-మెహోలా అంచు”కు బదులుగా “ఆబేల్-మెహోలా ఒడ్డు” లేదా “ఆబేల్-మెహోలా సరిహద్దు” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְקְעוּ ... הַשּׁוֹפָרוֹת
  choice: ఆ మూడు వందల కొమ్ము బూరలు మోగించగానే
  rationale: שׁוֹפָר అనేది జంతు కొమ్ముతో చేసిన బూరను సూచిస్తుంది. హీబ్రూ క్రియ బహువచన కర్తను సూచించినా, సందర్భంలో ఆ మూడు వందల మంది స్పష్టంగా ఉన్నందున సహజమైన తెలుగులో సంఘటనపై దృష్టి నిలిపే నిర్మాణాన్ని వాడాం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించదగిన వ్యక్తినామ రూపంలో ఇచ్చాం.
- source_word: וַיָּשֶׂם ... אֵת חֶרֶב אִישׁ בְּרֵעֵהוּ
  choice: ప్రతి ఒక్కరి కత్తిని అతని సహచరునికి విరోధంగా తిప్పాడు
  rationale: కత్తిని మరొకరికి విరోధంగా ఉంచడం అనే హీబ్రూ చిత్రాన్ని సహజమైన తెలుగు ప్రయోగంతో నిలిపి, אִישׁ యొక్క పంపిణీ భావాన్ని ‘ప్రతి ఒక్కరి’గా తెలిపాం.
- source_word: וּבְכָל הַמַּחֲנֶה
  choice: శిబిరమంతటా
  rationale: בְּ ఉపసర్గ ఇక్కడ చర్య శిబిరమంతా వ్యాపించిందనే భావాన్ని ఇవ్వగలదు. ‘శిబిరమంతటా’ ఆ స్థలవ్యాప్తిని సహజంగా తెలియజేస్తుంది; విరోధార్థక అన్వయాన్ని పాదసూచికలో ఉంచాం.
- source_word: וַיָּנָס הַמַּחֲנֶה
  choice: ఆ సైన్యం ... పారిపోయింది
  rationale: మకాం స్వయంగా కదలదు కాబట్టి, ఇక్కడ מַחֲנֶה శిబిరంలో ఉన్న సైన్యాన్ని సూచించే సమూహార్థక పదంగా గ్రహించాం.
- source_word: צְרֵרָתָה
  choice: సెరేరా వైపుగా
  rationale: దిశాసూచక ה ముగింపు ఆ స్థలంవైపు కదలికను సూచిస్తుంది.
- source_word: שְׂפַת אָבֵל מְחוֹלָה
  choice: ఆబేల్-మెహోలా అంచు
  rationale: שָׂפָה అక్షరార్థంగా పెదవి; భౌగోళిక వాడుకలో అంచు, ఒడ్డు, సరిహద్దు కావచ్చు. నీటి ప్రస్తావన స్పష్టంగా లేనందున విస్తృతమైన ‘అంచు’ ఎంచుకున్నాం.
- source_word: עַל טַבָּת
  choice: తబ్బాతు దగ్గర ఉన్న
  rationale: עַל ఇక్కడ తబ్బాతుతో స్థలసంబంధం లేదా సామీప్యాన్ని సూచిస్తుంది. ‘దగ్గర’ అనవసరంగా ఖచ్చితమైన దిశను నిర్ణయించదు.
theological_decisions:
- issue: יְהוָה అనే దైవనామ అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో వ్యక్తిగత దైవనామమే ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుతో మార్చకుండా తెలుగులో సుపరిచితమైన లిప్యంతరీకరణను వాడాం; ప్రాచీన ఉచ్చారణను ‘యాహ్వే’గా ఇవ్వడం కూడా సాధ్యమే.
- issue: శిబిరంలో కత్తులు తిరిగిన విధానం
  choice: శిబిరమంతటా ప్రతి ఒక్కరి కత్తిని అతని సహచరునికి విరోధంగా తిప్పాడు
  alternative: ప్రతి ఒక్కరి కత్తిని అతని సహచరునికీ శిబిరమంతటికీ విరోధంగా తిప్పాడు
  rationale: హీబ్రూ בְּכָל הַמַּחֲנֶה చర్య జరిగిన పరిధిని లేదా అదనపు లక్ష్యాన్ని సూచించవచ్చు. ప్రధాన పాఠంలో సహజమైన పరిధి భావాన్ని తీసుకొని, ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకుడికి స్పష్టంగా ఉండే శైలి. స్థలనామాలను తెలుగు ధ్వన్యనుసారంగా లిప్యంతరీకరించాం. యుద్ధసందర్భంలో מַחֲנֶהకు మొదట ‘శిబిరం’, పారిపోయే సమూహానికి ‘సైన్యం’ వాడి సహజత్వాన్ని కాపాడాం.
