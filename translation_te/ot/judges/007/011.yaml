source:
  edition: WLC
  text: וְ/שָֽׁמַעְתָּ֙ מַה יְדַבֵּ֔רוּ וְ/אַחַר֙ תֶּחֱזַ֣קְנָה יָדֶ֔י/ךָ וְ/יָרַדְתָּ֖ בַּֽ/מַּחֲנֶ֑ה וַ/יֵּ֤רֶד הוּא֙ וּ/פֻרָ֣ה נַעֲר֔/וֹ אֶל קְצֵ֥ה הַ/חֲמֻשִׁ֖ים אֲשֶׁ֥ר בַּֽ/מַּחֲנֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/011.yaml
  text: and you will hear what they are saying[a], and afterward your hands will be strengthened[b], and you will go down into the camp.” So he went down with Purah his servant to the edge of the armed men who were in the camp.
translation:
  language: te
  text: “వారు ఏమి మాట్లాడుతున్నారో నీవు వింటావు; ఆ తరువాత నీ చేతులు బలపడతాయి. అప్పుడు నీవు శిబిరంలోకి దిగివెళ్తావు.” కాబట్టి అతడు తన సేవకుడైన పూరాతో[a] కలిసి, శిబిరంలో ఉన్న సాయుధ సైనికుల[b] అంచువరకు దిగివెళ్లాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “తన యువ సహాయకుడైన పూరాతో”; నַעַר అనే హీబ్రూ పదానికి ‘యువకుడు,’ ‘సేవకుడు,’ లేదా ‘సహాయకుడు’ అనే అర్థాలు ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా “యుద్ధానికి సన్నద్ధమైనవారి”; హీబ్రూ పదం ఆయుధాలు ధరించి యుద్ధానికి సిద్ధంగా ఉన్నవారిని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַעְתָּ מַה יְדַבֵּרוּ
  choice: వారు ఏమి మాట్లాడుతున్నారో నీవు వింటావు
  rationale: ప్రత్యక్ష సంభాషణలోని భవిష్యత్ భావాన్ని, ఇతరులు మాట్లాడుతున్న మాటలను వినడం అనే సందర్భార్థాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וְאַחַר
  choice: ఆ తరువాత
  rationale: వినడం తరువాత ధైర్యం బలపడే క్రమాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: תֶּחֱזַקְנָה יָדֶיךָ
  choice: నీ చేతులు బలపడతాయి
  rationale: ధైర్యం, కార్యసంకల్పం బలపడడాన్ని సూచించే హీబ్రూ రూపకంలోని ‘చేతులు’ అనే చిత్రాన్ని పరిష్కరించకుండా నిలుపుతుంది.
- source_word: וְיָרַדְתָּ בַּמַּחֲנֶה
  choice: నీవు శిబిరంలోకి దిగివెళ్తావు
  rationale: ירד యొక్క ‘దిగివెళ్లు’ అనే ప్రాథమిక భావాన్ని, בְּ సూచించే శిబిరంలోకి కదలికను నిలుపుతుంది.
- source_word: וַיֵּרֶד הוּא וּפֻרָה
  choice: కాబట్టి అతడు ... పూరాతో కలిసి ... దిగివెళ్లాడు
  rationale: కథనంలోని తదుపరి చర్యను సహజంగా కలుపుతూ, గిద్యోను పూరాతో కలిసి వెళ్లాడనే సంబంధాన్ని స్పష్టం చేస్తుంది.
- source_word: נַעֲרוֹ
  choice: తన సేవకుడైన
  rationale: נַעַר అనే పదానికి ‘యువకుడు’, ‘సేవకుడు’, ‘సహాయకుడు’ అనే భావాలు ఉండగలవు; ఇక్కడ గిద్యోనుతో వచ్చిన వ్యక్తి పాత్రకు ‘సేవకుడు’ సహజంగా సరిపోతుంది, ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: אֶל קְצֵה
  choice: అంచువరకు
  rationale: קצה యొక్క ‘అంచు/చివర’ భావాన్ని యుద్ధశిబిర సందర్భంలో సంక్షిప్తంగా నిలుపుతుంది.
- source_word: הַחֲמֻשִׁים
  choice: సాయుధ సైనికులు
  rationale: యుద్ధానికి ఆయుధాలు ధరించి సిద్ధంగా ఉన్నవారిని సూచించే పదార్థాన్ని స్పష్టమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: אֲשֶׁר בַּמַּחֲנֶה
  choice: శిబిరంలో ఉన్న
  rationale: సాయుధ సైనికులు శిబిరంలో ఉన్నారని గుర్తించే సంబంధ వాక్యాన్ని నేరుగా ప్రతిబింబిస్తుంది.
theological_decisions:
- issue: ‘చేతులు బలపడతాయి’ అనే రూపకం
  choice: రూపకాన్ని యథాతథంగా నిలుపడం
  alternative: ‘నీకు ధైర్యం కలుగుతుంది’ అని భావార్థంగా అనువదించడం
  rationale: మూలంలోని శరీరరూపకాన్ని తొలగించకుండా, ధైర్యం మరియు కార్యసామర్థ్యం రెండింటినీ సూచించే దాని విస్తృత భావాన్ని పాఠకుడికి తెరిచి ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. ‘నీ చేతులు బలపడతాయి’ అనే మూలభాషా రూపకం ఉద్దేశపూర్వకంగా నిలుపబడింది; ‘సేవకుడు’ మరియు ‘సాయుధ సైనికులు’ వద్ద ఉన్న పదార్థ వైవిధ్యాన్ని పాదటిప్పణులు తెలియజేస్తాయి.
