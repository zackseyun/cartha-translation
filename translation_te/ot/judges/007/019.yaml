  text: וַ/יָּבֹ֣א גִ֠דְעוֹן וּ/מֵאָה אִ֨ישׁ אֲשֶׁר אִתּ֜/וֹ בִּ/קְצֵ֣ה הַֽ/מַּחֲנֶ֗ה רֹ֚אשׁ הָ/אַשְׁמֹ֣רֶת הַ/תִּֽיכוֹנָ֔ה אַ֛ךְ הָקֵ֥ם הֵקִ֖ימוּ אֶת הַ/שֹּֽׁמְרִ֑ים וַֽ/יִּתְקְעוּ֙ בַּ/שּׁ֣וֹפָר֔וֹת וְ/נָפ֥וֹץ הַ/כַּדִּ֖ים אֲשֶׁ֥ר בְּ/יָדָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/019.yaml
  text: So Gideon and the hundred men who were with him came to the edge of the camp at the beginning of the middle watch[a], just as they had posted the watchmen[c][b]; and they blew the trumpets and smashed the jars that were in their hands.
translation:
  language: te
  text: గిద్యోను, అతనితో ఉన్న వందమంది, మధ్య కాపలా జాము[a] ఆరంభంలో, కాపలాదారులను అప్పుడే నిలబెట్టిన సమయానికి, శిబిరం అంచుకు వచ్చారు. వారు కొమ్ముబూరలు[c] ఊదారు, తమ చేతుల్లో ఉన్న కుండలను పగలగొట్టారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మధ్య రాత్రి కాపలా జాము’ లేదా ‘రెండవ జాము.’ హీబ్రూ పదబంధం రాత్రిని విభజించిన కాపలా సమయాల్లో ఒకదాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: 'హీబ్రూ: షోఫారోత్; సంకేతాలు ఇవ్వడానికి ఉపయోగించే కొమ్ముబూరలు. సంప్రదాయంగా వీటిని ‘బాకాలు’ అని కూడా అనువదిస్తారు.'
    reason: cultural_note
lexical_decisions:
- source_word: בִּקְצֵה הַמַּחֲנֶה
  choice: శిబిరం అంచుకు
  rationale: קָצֶה స్థలపు చివర లేదా అంచును సూచిస్తుంది; గమనాన్ని సూచించే וַיָּבֹאతో కలిసి ‘అంచుకు వచ్చారు’ సహజమైన తెలుగు.
- source_word: רֹאשׁ הָאַשְׁמֹרֶת הַתִּיכוֹנָה
  choice: మధ్య రాత్రి జాము ఆరంభంలో
  rationale: רֹאשׁ ఇక్కడ కాలవిభాగపు ఆరంభాన్ని, אַשְׁמֹרֶת రాత్రి కాపలా జామును సూచిస్తాయి. ‘మధ్య రాత్రి జాము’ సాధారణ పాఠకునికి భావాన్ని స్పష్టం చేస్తుంది.
- source_word: אַךְ הָקֵם הֵקִימוּ אֶת־הַשֹּׁמְרִים
  choice: అప్పుడే కాపలాదారులను నియమించారు
  rationale: אַךְ ఇక్కడ తక్షణ సమయాన్ని సూచిస్తుంది. Hiphil infinitive absoluteతో కూడిన finite verb కాపలాదారులను నిలబెట్టే/నియమించే చర్యను బలపరుస్తుంది; తెలుగు వాక్యంలో ‘అప్పుడే’ ఆ సమయ సమీపతను సహజంగా తెలియజేస్తుంది.
- source_word: וַיִּתְקְעוּ בַּשּׁוֹפָרוֹת
  choice: వారు కొమ్ముబూరలు ఊది
  rationale: שׁוֹפָר సాధారణ లోహపు బాకా కాకుండా సంకేతాల కోసం ఉపయోగించే జంతుకొమ్ము బూర. ‘కొమ్ముబూరలు’ మూలపదపు భౌతిక, సాంస్కృతిక భావాన్ని నిలుపుతుంది.
- source_word: וְנָפוֹץ הַכַּדִּים
  choice: కుండలను పగలగొట్టారు
  rationale: נפץ బలంగా పగులగొట్టడాన్ని సూచిస్తుంది; ‘పగలగొట్టారు’ ఆధునిక తెలుగులో స్పష్టంగా, సహజంగా ఉంది. כַּדִּיםకు ‘కుండలు’ సరైన సాధారణ సమానార్థకం.
- source_word: אֲשֶׁר בְּיָדָם
  choice: తమ చేతుల్లో ఉన్న
  rationale: మూలంలోని సంబంధవాచక నిర్మాణాన్ని స్పష్టంగా నిలుపుతూ, తెలుగు వాడుకలో సహజంగా ఉంటుంది.
