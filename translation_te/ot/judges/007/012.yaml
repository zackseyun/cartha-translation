translation_notes:
  register: సాధారణ ఆధునిక తెలుగు పాఠకులకు అర్థమయ్యేలా సహజమైన, గౌరవప్రదమైన కథన శైలిని వాడాం. మూలంలోని రెండు విస్తారతా సూచనలను ‘అసంఖ్యాకంగా’ మరియు ‘లెక్కకు అందనంత విస్తారంగా’ అంటూ నిలిపాం; ప్రారంభ ו అనేది కథన అనుసంధాన సూచికగా ఉండటంతో ప్రత్యేకంగా ‘ఇప్పుడు/అప్పుడు’ అని చేర్చలేదు.
