  source_fidelity: 'మొదటి వాక్యం మూలహీబ్రూ భావాన్ని సరిగ్గా ఇస్తుంది: మిద్యాను, అమాలేకు, తూర్పు ప్రజలు లోయలో మిడతల్లా అపార సంఖ్యలో శిబిరమై ఉన్నారు. అయితే రెండవ వాక్యంలోని ‘లెక్కకు అందనంత విస్తారంగా ఉన్నాయి’ ఒంటెల సంఖ్యకన్నా వాటి భౌతిక వ్యాప్తినే ప్రధానంగా సూచించే అవకాశం ఉంది. אֵין מִסְפָּר (‘లెక్కలేదు’)ను స్పష్టంగా వ్యక్తం చేయడం మంచిది.'
