source:
  edition: WLC
  text: וּ/מִדְיָ֨ן וַ/עֲמָלֵ֤ק וְ/כָל בְּנֵי קֶ֨דֶם֙ נֹפְלִ֣ים בָּ/עֵ֔מֶק כָּ/אַרְבֶּ֖ה לָ/רֹ֑ב וְ/לִ/גְמַלֵּי/הֶם֙ אֵ֣ין מִסְפָּ֔ר כַּ/ח֛וֹל שֶׁ/עַל שְׂפַ֥ת הַ/יָּ֖ם לָ/רֹֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/012.yaml
  text: Midian and Amalek and all the people of the East were lying in the valley as numerous as locusts[a], and their camels were without number[b], as the sand on the seashore in abundance.
translation:
  language: te
  text: మిద్యానీయులు, అమాలేకీయులు, తూర్పు ప్రాంత ప్రజలందరూ[a] మిడతల్లా అసంఖ్యాకంగా లోయలో మకాం వేసి ఉన్నారు[b]. వారి ఒంటెలు కూడా సముద్రతీరంలోని ఇసుకవలె లెక్కలేనన్ని ఉన్నాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'అక్షరార్థం: ‘తూర్పు కుమారులు.’'
    reason: lexical_alternative
  - marker: b
    text: ‘మకాం వేసి ఉన్నారు’ అని అనువదించిన హీబ్రూ పదానికి అక్షరార్థంగా ‘పడుతూ ఉన్నారు’ లేదా ‘పడి ఉన్నారు’ అనే భావం ఉంది; ఇక్కడ అది లోయలో శిబిరంగా విస్తరించి ఉన్న సైన్యాన్ని వర్ణిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי קֶדֶם
  choice: తూర్పు ప్రాంత ప్రజలు
  rationale: అక్షరార్థంగా ‘తూర్పు కుమారులు.’ ఇది తూర్పున నివసించే ప్రజలను సూచించే సామూహిక భౌగోళిక నామం కాబట్టి ఆధునిక తెలుగులో సహజంగా ‘తూర్పు ప్రాంత ప్రజలు’ అని అనువదించాం.
- source_word: נֹפְלִים
  choice: మకాం వేసి ఉన్నారు
  rationale: ఈ కృదంతానికి అక్షరార్థంగా ‘పడుతూ/పడి ఉన్నవారు’ అనే భావం ఉన్నా, ఇక్కడ సైన్యం లోయలో దిగి శిబిరంగా విస్తరించి ఉండడాన్ని సూచిస్తుంది. సందర్భార్థాన్ని సహజంగా అందిస్తూ మూలంలోని రూపాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: בָּעֵמֶק
  choice: లోయలో
  rationale: עֵמֶק సాధారణంగా లోయను సూచిస్తుంది; ఇక్కడ ఇదే నేరమైన, సహజమైన అనువాదం.
- source_word: כָּאַרְבֶּה לָרֹב
  choice: మిడతల్లా అసంఖ్యాకంగా
  rationale: సైనికుల అపారమైన సంఖ్యను మిడతలతో పోల్చే ఉపమానాన్ని స్పష్టమైన ఆధునిక తెలుగులో నిలిపాం.
- source_word: לִגְמַלֵּיהֶם אֵין מִסְפָּר
  choice: వారి ఒంటెలు ... లెక్కకు అందనంత
  rationale: ‘వాటి సంఖ్య లేదు’ అనే హీబ్రూ అతిశయోక్తిని తెలుగులో సహజంగా, దాని బలాన్ని కాపాడుతూ వ్యక్తం చేస్తుంది.
- source_word: כַּחוֹל שֶׁעַל שְׂפַת הַיָּם לָרֹב
  choice: సముద్రతీరంలోని ఇసుకలా లెక్కకు అందనంత విస్తారంగా
  rationale: లెక్కలేనంత సంఖ్యను సూచించే మూల ఉపమానాన్ని కాపాడి, చివరి לָרֹב ఇచ్చే విస్తార భావాన్ని ‘విస్తారంగా’ ద్వారా నిలిపాం.
