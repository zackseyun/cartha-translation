  text: וַ/יַּ֨עַן רֵעֵ֤/הוּ וַ/יֹּ֨אמֶר֙ אֵ֣ין זֹ֔את בִּלְתִּ֗י אִם חֶ֛רֶב גִּדְע֥וֹן בֶּן יוֹאָ֖שׁ אִ֣ישׁ יִשְׂרָאֵ֑ל נָתַ֤ן הָֽ/אֱלֹהִים֙ בְּ/יָד֔/וֹ אֶת מִדְיָ֖ן וְ/אֶת כָּל הַֽ/מַּחֲנֶֽה־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/014.yaml
  text: His companion answered and said[a], “This is nothing other than the sword of Gideon son of Joash, a man of Israel[b]. God has given Midian and the whole camp into his hand.”
translation:
  language: te
  text: 'అతని సహచరుడు జవాబుగా ఇలా అన్నాడు: “ఇది ఇశ్రాయేలీయుడైన యోవాషు కుమారుడు గిద్యోను ఖడ్గమే తప్ప మరొకటి కాదు.[a] దేవుడు మిద్యానును, శిబిరమంతటినీ అతని చేతికి అప్పగించాడు.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఇది ఇశ్రాయేలీయుడైన యోవాషు కుమారుడు గిద్యోను ఖడ్గం తప్ప మరేమీ కాదు.”
    reason: lexical_alternative
  - marker: b
    text: 'హీబ్రూ: “అతని చేతిలో ఇచ్చాడు”; అంటే అతని అధికారం లేదా నియంత్రణకు అప్పగించాడు.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַן רֵעֵהוּ וַיֹּאמֶר
  choice: అతని సహచరుడు జవాబుగా ఇలా అన్నాడు
  rationale: హీబ్రూ కథన సూత్రంలోని ‘జవాబిచ్చి చెప్పాడు’ అనే రెండు క్రియల భావాన్ని సహజమైన ఆధునిక తెలుగులో పునరుక్తి లేకుండా వ్యక్తం చేస్తుంది; רֵעֵהוּను సందర్భానికి తగిన ‘సహచరుడు’గా అనువదిస్తుంది.
- source_word: אֵין זֹאת בִּלְתִּי אִם
  choice: ఇది ... తప్ప మరొకటి కాదు
  rationale: కల యొక్క అర్థాన్ని నిశ్చయంగా ఇదేనని గుర్తించే హీబ్రూ నిషేధాత్మక నుడికారంలోని బలాన్ని కాపాడుతుంది.
- source_word: חֶרֶב גִּדְעוֹן
  choice: గిద్యోను ఖడ్గం
  rationale: ఖడ్గం గిద్యోనును లేదా అతని విజయశక్తిని సూచించే స్వప్నప్రతీకగా ఉన్నప్పటికీ, మూలంలోని ప్రత్యక్ష రూపకాన్ని అలాగే ఉంచుతుంది.
- source_word: גִּדְעוֹן בֶּן יוֹאָשׁ אִישׁ יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయుడైన యోవాషు కుమారుడు గిద్యోను
  rationale: తండ్రి పేరు ద్వారా గుర్తింపును, אִישׁ יִשְׂרָאֵלలోని పురుష ఏకవచన ఇశ్రాయేలు గుర్తింపును సహజమైన తెలుగు పదక్రమంలో నిలుపుతుంది.
- source_word: נָתַן הָאֱלֹהִים
  choice: దేవుడు ... అప్పగించాడు
  rationale: హీబ్రూ సంపూర్ణ క్రియను, స్వప్నవ్యాఖ్యాత దృష్టిలో ఇప్పటికే నిశ్చయమైన అప్పగింతగా తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: בְּיָדוֹ
  choice: అతని చేతికి
  rationale: ఎవరినైనా మరొకరి అధికారం లేదా నియంత్రణకు అప్పగించడాన్ని సూచించే హీబ్రూ నుడికారాన్ని తెలుగులోనూ అర్థమయ్యే సన్నిహిత రూపంలో కాపాడుతుంది.
- source_word: אֶת מִדְיָן וְאֶת כָּל הַמַּחֲנֶה
  choice: మిద్యానును, శిబిరమంతటినీ
  rationale: మిద్యాను అనే సమూహనామాన్నీ, כָּל సూచించే సంపూర్ణతనూ నిలుపుతుంది; సందర్భంలో ‘శిబిరం’ అక్కడి సైనిక సమూహాన్నీ సూచించగలదు.
theological_decisions:
- issue: אִישׁ יִשְׂרָאֵל యొక్క లింగం మరియు జాతీయ గుర్తింపు
  choice: ఇశ్రాయేలీయుడైన
  alternative: ఇశ్రాయేలుకు చెందిన వ్యక్తియైన
  rationale: మూలంలోని పురుష ఏకవచనాన్ని తెలుగు పురుషరూపంతో నిలుపుతూ, అసహజమైన పదబంధాన్ని నివారిస్తుంది.
- issue: నిశ్చయ ప్రకటనలో נָתַן యొక్క కాలాంశం
  choice: అప్పగించాడు
  alternative: అప్పగించేశాడు / అప్పగిస్తాడు
  rationale: స్వప్నంలో సూచించబడిన విజయం వక్తకు నిశ్చయమైనదిగా కనిపిస్తున్నప్పటికీ, తెలుగు భూతకాలం మూలంలోని సంపూర్ణ క్రియను మితంగా ప్రతిబింబిస్తుంది; భవిష్యత్తుగా మార్చదు, అదనపు దైవశాస్త్రీయ నిర్ణయవాదాన్నీ చేర్చదు.
- issue: ‘గిద్యోను ఖడ్గం’ అనే స్వప్నప్రతీక
  choice: రూపకాన్ని ప్రత్యక్షంగానే నిలుపడం
  alternative: ఇది గిద్యోను సాధించబోయే విజయమే
  rationale: మూలపాఠంలోని ఖడ్గరూపకాన్ని వ్యాఖ్యానాత్మకంగా విప్పకుండా ఉంచి, దాని ప్రతీకాత్మక ఉద్రిక్తతను సంరక్షిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన కథనశైలి వాడబడింది. ‘సహచరుడు’, ‘ఖడ్గం’, ‘శిబిరమంతటినీ’ వంటి పదాలు సందర్భ గంభీరతను నిలుపుతాయి. రెండు పాదటిప్పణి సూచికలూ అవి వివరించే వాక్యభాగాల వెంట ప్రధాన పాఠ్యంలో ఉంచబడ్డాయి.
