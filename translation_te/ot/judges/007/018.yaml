source:
  edition: WLC
  text: וְ/תָקַעְתִּי֙ בַּ/שּׁוֹפָ֔ר אָנֹכִ֖י וְ/כָל אֲשֶׁ֣ר אִתִּ֑/י וּ/תְקַעְתֶּ֨ם בַּ/שּׁוֹפָר֜וֹת גַּם אַתֶּ֗ם סְבִיבוֹת֙ כָּל הַֽ/מַּחֲנֶ֔ה וַ/אֲמַרְתֶּ֖ם לַ/יהוָ֥ה וּ/לְ/גִדְעֽוֹן־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/018.yaml
  text: When I and all who are with me blow the ram’s horn[a], then you also must blow the horns all around the whole camp, and say[b], ‘For Yahweh and for Gideon!’
translation:
  language: te
  text: నేనూ నాతో ఉన్నవారందరూ కొమ్ముబూరను ఊదినప్పుడు, మీరు కూడా మొత్తం శిబిరం చుట్టూ కొమ్ముబూరలను ఊది, ‘యహ్వే కొరకు, గిద్యోను కొరకు!’ అని చెప్పండి.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీలోని שׁוֹפָר సాధారణంగా పొట్టేలు కొమ్ముతో చేసిన బూరను సూచిస్తుంది; ఇది లోహపు బాకా కాదు.
    reason: cultural_note
  - marker: b
    text: కొన్ని సంప్రదాయ అనువాదాలు న్యాయాధిపతులు 7:20లోని పదాల ప్రభావంతో, ‘యహ్వే ఖడ్గం, గిద్యోను ఖడ్గం’ అని ఇక్కడ కూడా ఇస్తాయి. అయితే ఈ వచనంలోని హెబ్రీ పాఠ్యం కేవలం, ‘యహ్వే కొరకు, గిద్యోను కొరకు’ అని ఉంది.
    reason: alternative_reading
lexical_decisions:
- source_word: תָקַעְתִּי / תְקַעְתֶּם
  choice: ఊదినప్పుడు / ఊది
  rationale: שׁוֹפָר‌తో వాడిన תקע కొమ్మును ఊదడాన్ని సూచిస్తుంది. తెలుగులో ‘ఊదు’ సహజమైనదీ, చర్యను స్పష్టంగా తెలిపేదీ.
- source_word: שׁוֹפָר / שׁוֹפָרוֹת
  choice: కొమ్ముబూర / కొమ్ముబూరలు
  rationale: ఇది లోహపు బాకా కాదు; సాధారణంగా పొట్టేలు కొమ్ముతో చేసిన బూర. ‘కొమ్ముబూర’ మూలపదంలోని వస్తుగత భావాన్ని సాధారణ పాఠకునికి స్పష్టంగా అందిస్తుంది.
- source_word: אָנֹכִי וְכָל אֲשֶׁר אִתִּי
  choice: నేనూ నాతో ఉన్నవారందరూ
  rationale: గిద్యోనును, అతనితో ఉన్న మనుష్యులను సహజమైన ఆధునిక తెలుగులో సూచిస్తుంది.
- source_word: גַּם אַתֶּם
  choice: మీరు కూడా
  rationale: גַּם తెలిపే చేర్పు భావాన్ని, ఆదేశ స్వరాన్ని అతిశయింపకుండా నిలుపుతుంది.
- source_word: סְבִיבוֹת כָּל הַמַּחֲנֶה
  choice: శిబిరమంతటి చుట్టూ
  rationale: సైనిక శిబిరం మొత్తాన్ని చుట్టుముట్టిన ప్రదేశమంతటా అనే సమగ్ర స్థలార్థాన్ని సంక్షిప్తంగా అందిస్తుంది.
- source_word: וַאֲמַרְתֶּם
  choice: అని చెప్పాలి
  rationale: మూలంలోని సాధారణ ‘చెప్పు’ అనే క్రియనే అనుసరిస్తుంది; సందర్భం బిగ్గరగా పలకడాన్ని సూచించినా, మూలంలో లేని ‘కేక వేయండి’ అనే తీవ్రతను చేర్చదు.
- source_word: לַיהוָה וּלְגִדְעוֹן
  choice: యహ్వే కొరకు, గిద్యోను కొరకు
  rationale: రెండుసార్లు వచ్చిన לְ ఉపసర్గను ‘కొరకు’ అని ప్రతిబింబించి, యుద్ధ నినాదంలోని సమాంతర నిర్మాణాన్ని నిలుపుతుంది. יהוה అనే నామాన్ని ‘యహ్వే’గా లిప్యంతరీకరించింది.
theological_decisions:
- issue: లַיהוָה וּלְגִדְעוֹן అనే యుద్ధ నినాదం
  choice: యహ్వే కొరకు, గిద్యోను కొరకు!
  alternative: యహ్వే ఖడ్గం కొరకు, గిద్యోను ఖడ్గం కొరకు!
  rationale: ఈ వచనంలోని హెబ్రీ పాఠ్యంలో ‘ఖడ్గం’ అనే పదం లేదు; అది 7:20లో కనిపిస్తుంది. కాబట్టి దానిని ఇక్కడ చేర్చకుండా, రెండు לְ ఉపసర్గల ‘కొరకు’ భావాన్ని నిలిపాం.
- issue: దైవనామం יהוה
  choice: యహ్వే
  alternative: ప్రభువు
  rationale: మూలంలో ఉన్న ఒడంబడిక నామాన్ని సాధారణ బిరుదుతో భర్తీ చేయకుండా పేరుగా అందిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గంభీరంగా రూపొందించబడింది. ఆదేశ భావానికి ‘చెప్పాలి’ వాడబడింది. ‘కొమ్ముబూర’కు సాంస్కృతిక వివరణను పాదసూచికలో ఇచ్చి, ప్రధాన వాక్యాన్ని సులభంగా ఉంచాం.
