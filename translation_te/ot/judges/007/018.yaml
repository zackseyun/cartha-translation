  source_fidelity: 'The draft accurately preserves the sequence and content of the Hebrew: Gideon and those with him blow the shofar, the others blow around the entire camp, and they say the slogan. It correctly does not import “sword” from 7:20. The revised wording makes the imperative force of the Hebrew forms more direct in Telugu.'
