id: JDG.7.9
reference: Judges 7:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַֽ/יְהִי֙ בַּ/לַּ֣יְלָה הַ/ה֔וּא וַ/יֹּ֤אמֶר אֵלָי/ו֙ יְהוָ֔ה ק֖וּם רֵ֣ד בַּֽ/מַּחֲנֶ֑ה כִּ֥י נְתַתִּ֖י/ו בְּ/יָדֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/009.yaml
  text: And it happened that night that Yahweh said to him[a], “Arise, go down into the camp, for I have given it into your hand.”
translation:
  language: te
  text: 'ఆ రాత్రి యాహ్వే అతనితో ఇలా అన్నాడు: “లేచి, శిబిరంలోకి దిగిపో; ఎందుకంటే దాన్ని నీ చేతికి[a] అప్పగించాను.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “నీ చేతిలో.” ఇది నీ అధికారానికి లేదా నియంత్రణకు అప్పగించడం అనే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַּלַּיְלָה הַהוּא
  choice: ఆ రాత్రి
  rationale: וַיְהִי కథనంలో కొత్త ఘట్టాన్ని పరిచయం చేస్తుంది; తెలుగులో సహజమైన కథనశైలికి అనుగుణంగా కాలసూచనతోనే వాక్యాన్ని ప్రారంభించడం దాని సంభాషణాత్మక కార్యాన్ని వ్యక్తం చేస్తుంది.
- source_word: וַיֹּאמֶר אֵלָיו
  choice: అతనితో … అని చెప్పాడు
  rationale: אמר అనే సాధారణ మాటలాడే క్రియకు ఇది సహజమైన ఆధునిక తెలుగు సమానం.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగు లిపిలో లిప్యంతరీకరించింది.
- source_word: קוּם
  choice: లేచి
  rationale: వెంటనే చర్యకు పిలిచే ఆజ్ఞను సహజమైన, గౌరవప్రదమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: רֵד בַּמַּחֲנֶה
  choice: శిబిరంలోకి దిగిపో
  rationale: ירד యొక్క దిగువకు కదలికను, בַּמַּחֲנֶה యొక్క లోపలికి వెళ్లే భావాన్ని రెండింటినీ నిలుపుతుంది; ‘శిబిరానికి వ్యతిరేకంగా’ అని యుద్ధార్థాన్ని అదనంగా చేర్చదు.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందున్న ఆజ్ఞకు కారణాన్ని స్పష్టంగా పరిచయం చేస్తుంది.
- source_word: נְתַתִּיו
  choice: దాన్ని … అప్పగించాను
  rationale: పుంలింగ ఏకవచన ప్రత్యయం శిబిరాన్ని, విస్తృతార్థంలో శత్రుసేనను సూచిస్తుంది. సంపూర్ణమైన దైవ నిర్ణయానికి వర్తమాన ప్రాసంగికత ఉండే భావాన్ని ‘అప్పగించాను’ తెలియజేస్తుంది.
- source_word: בְּיָדֶךָ
  choice: నీ చేతికి
  rationale: అధికారం లేదా నియంత్రణలోకి అప్పగించడాన్ని సూచించే హీబ్రూ రూపకాన్ని తెలుగులోనూ అర్థమయ్యే విధంగా నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుతో మార్చకుండా, సాధారణంగా పునర్నిర్మించబడిన ఉచ్చారణకు అనుగుణంగా ‘యాహ్వే’ అని లిప్యంతరీకరించబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన కథన నిర్మాణం, గౌరవప్రదమైన దైవవాక్య శైలి ఉపయోగించబడ్డాయి. మూలంలోని ‘చేతిలో’ నుడికారాన్ని ప్రధాన పాఠంలో ‘చేతికి అప్పగించాను’గా నిలిపి, దాని అర్థాన్ని పాదటిప్పణిలో వివరించాం.
