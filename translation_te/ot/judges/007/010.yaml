translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. గిద్యోనును ఉద్దేశించిన ఏకవచన సంభాషణకు ‘నువ్వు/నీ’ వాడబడింది. మూలంలోని క్రియ పునరుక్తి మరియు אֶל లోని దిశాసంబంధ అస్పష్టత నిలుపబడ్డాయి.
