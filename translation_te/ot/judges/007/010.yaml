  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אִם יָרֵ֥א אַתָּ֖ה לָ/רֶ֑דֶת רֵ֥ד אַתָּ֛ה וּ/פֻרָ֥ה נַעַרְ/ךָ֖ אֶל הַֽ/מַּחֲנֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/010.yaml
  text: But if you are afraid to go down[a], go down to the camp with Purah your servant.
translation:
  language: te
  text: అయితే నువ్వు దిగడానికి భయపడితే, నీ పరిచారకుడైన పూరాతో కలిసి శిబిరానికి దిగిపో.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “నీ యువకుడైన పూరాతో” లేదా “నీ సేవకుడైన పూరాతో” అని కూడా అనువదించవచ్చు. హీబ్రూ נַעַר (నఅర్) అనే పదం సందర్భాన్ని బట్టి యువకుడు, సేవకుడు, లేదా పరిచారకుడు అని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: అయితే …ట్లయితే
  rationale: ముందటి ఆజ్ఞకు షరతుతో కూడిన ప్రత్యామ్నాయాన్ని జతచేస్తుంది; ఆధునిక తెలుగులో స్వల్ప వ్యత్యాసాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: יָרֵא אַתָּה
  choice: నువ్వు … భయపడుతున్నట్లయితే
  rationale: గిద్యోను ఉన్న భయస్థితిని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: לָרֶדֶת … רֵד
  choice: దిగడానికి … దిగిపో
  rationale: మూలంలోని ירד క్రియ పునరుక్తిని నిలుపుతూ, మొదటిది క్రియార్థక రూపంగా, రెండవది ఆజ్ఞగా అనువదించబడింది.
- source_word: וּפֻרָה
  choice: పూరాతో కలిసి
  rationale: וְ ఇక్కడ పూరా గిద్యోనుతో పాటు వెళ్లే సహచరుడని సందర్భానుసారంగా సూచిస్తుంది.
- source_word: נַעַרְךָ
  choice: నీ సహాయకుడు
  rationale: נַעַר అనే పదానికి యువకుడు, సేవకుడు, పరిచారకుడు అనే అర్థాలు ఉండవచ్చు; ఈ సందర్భంలో గిద్యోనుకు తోడుగా ఉండే అధీన సహాయకుడనే భావాన్ని సహజంగా అందిస్తుంది.
- source_word: אֶל הַמַּחֲנֶה
  choice: శిబిరం దగ్గరికి
  rationale: אֶל యొక్క దిశార్థాన్ని నిలుపుతుంది; శిబిరంలోకి ప్రవేశించాలని మూలం స్పష్టంగా చెప్పనందున ‘శిబిరంలోకి’ అని అతిగా నిర్దిష్టం చేయలేదు.
