  text: וְ/גַם֙ כָּל הַ/דּ֣וֹר הַ/ה֔וּא נֶאֶסְפ֖וּ אֶל אֲבוֹתָ֑י/ו וַ/יָּקָם֩ דּ֨וֹר אַחֵ֜ר אַחֲרֵי/הֶ֗ם אֲשֶׁ֤ר לֹא יָֽדְעוּ֙ אֶת יְהוָ֔ה וְ/גַם֙ אֶת הַֽ/מַּעֲשֶׂ֔ה אֲשֶׁ֥ר עָשָׂ֖ה לְ/יִשְׂרָאֵֽל־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/010.yaml
  text: And all that generation also were gathered to their fathers[a], and another generation arose after them who did not know Yahweh[b], or even the work that he had done for Israel.
translation:
  language: te
  text: ఆ తరంవారందరూ కూడా తమ పితరుల దగ్గరికి చేర్చబడ్డారు[a], వారి తర్వాత యాహ్వేను[b] గానీ, ఆయన ఇశ్రాయేలు కోసం చేసిన కార్యాన్ని గానీ ఎరుగని మరో తరం వచ్చింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘తమ పితరుల దగ్గరికి చేర్చబడ్డారు’ అనేది మరణించి తమ పూర్వీకులతో చేరడాన్ని సూచించే హీబ్రూ నానుడి.
    reason: cultural_note
  - marker: b
    text: లేదా ‘యాహ్వేను గుర్తించనివారు.’ ఇక్కడి హీబ్రూ పదం కేవలం సమాచారం తెలియకపోవడమే కాకుండా, సంబంధపూర్వకమైన లేదా నిబంధన సంబంధమైన పరిచయం లేకపోవడాన్ని కూడా సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם כָּל הַדּוֹר הַהוּא
  choice: ఆ తరం వారందరూ కూడా
  rationale: וְגַם లోని అనుసంధాన, అదనపు భావాలను ‘కూడా’ సహజంగా తెలియజేస్తుంది; כָּל వల్ల తరమంతా ఉద్దేశించబడిందని ‘వారందరూ’ స్పష్టం చేస్తుంది.
- source_word: נֶאֶסְפוּ אֶל אֲבוֹתָיו
  choice: తమ పితరుల దగ్గరికి చేర్చబడ్డారు
  rationale: మరణించి పూర్వీకులతో చేరడాన్ని సూచించే హీబ్రూ నానుడి రూపాన్ని ప్రధాన పాఠ్యంలో నిలుపుతుంది.
- source_word: וַיָּקָם דּוֹר אַחֵר אַחֲרֵיהֶם
  choice: వారి తర్వాత మరో తరం పుట్టుకొచ్చింది
  rationale: కొత్త తరపు ఆవిర్భావాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తూ కాలక్రమ సంబంధాన్ని నిలుపుతుంది.
- source_word: לֹא יָדְעוּ אֶת יְהוָה
  choice: యెహోవాను ఎరుగనివారు
  rationale: יָדַע లో ఉండగల వాస్తవిక, అనుభవాత్మక, సంబంధపూర్వక భావాల విస్తృతిని ‘ఎరుగుట’ కాపాడుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుగా మార్చకుండా, తెలుగులో విస్తృతంగా గుర్తించదగిన సంప్రదాయ లిప్యంతరీకరణను ఉపయోగిస్తుంది.
- source_word: וְגַם אֶת הַמַּעֲשֶׂה
  choice: కార్యాన్ని కూడా
  rationale: రెండవ וְגַם తెలియజేసే అదనపు అంశాన్ని ‘కూడా’తో చూపుతుంది; מַעֲשֶׂה ఇక్కడ దేవుడు చేసిన కార్యాన్ని సూచిస్తుంది.
- source_word: אֲשֶׁר עָשָׂה לְיִשְׂרָאֵל
  choice: ఆయన ఇశ్రాయేలు కోసం చేసిన
  rationale: לְ ను సందర్భానుసారంగా ప్రయోజనార్థకంగా తీసుకొని, ఇశ్రాయేలు పక్షాన చేసిన కార్యాన్ని తెలియజేస్తుంది.
theological_decisions:
- issue: ‘యెహోవాను ఎరుగనివారు’ అనే మాట యొక్క పరిధి
  choice: వాస్తవిక జ్ఞానం, అనుభవపూర్వక పరిచయం, నిబంధనాత్మక గుర్తింపు మధ్యనున్న విస్తృతిని ప్రధాన పాఠ్యంలో నిలిపింది.
  alternative: ‘యెహోవాను అంగీకరించనివారు’ లేదా ‘యెహోవా గురించి తెలియనివారు’
  rationale: హీబ్రూ יָדַע కేవలం సమాచారం తెలియడానికంటే విస్తృతమైన భావాన్ని కలిగి ఉండగలదు. ఏ ఒక్క అర్థానికీ పరిమితం చేయకుండా వచనంలోని ధార్మిక ఉద్వేగాన్ని కాపాడటం సముచితం.
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: మూలంలోని వ్యక్తిగత దైవనామాన్ని ప్రధాన పాఠ్యంలో దైవబిరుదుతో భర్తీ చేయకుండా, సాధారణ తెలుగు పాఠకులకు సుపరిచితమైన రూపాన్ని ఎంచుకుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యేలా సహజమైన వాక్యనిర్మాణం, అయితే హీబ్రూ నానుడి మరియు ‘ఎరుగుట’లోని ఉద్దేశపూర్వక అర్థవిస్తృతి నిలుపబడ్డాయి.
