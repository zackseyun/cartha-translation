- from: ఆ తరం వారందరూ కూడా తమ పితరుల దగ్గరికి చేర్చబడ్డారు[a]. వారి తర్వాత మరో తరం పుట్టుకొచ్చింది. వారు యెహోవాను[b], ఆయన ఇశ్రాయేలు కోసం చేసిన కార్యాన్ని కూడా ఎరుగనివారు.
  to: ఆ తరంవారందరూ కూడా తమ పితరుల దగ్గరికి చేర్చబడ్డారు[a], వారి తర్వాత యాహ్వేను[b] గానీ, ఆయన ఇశ్రాయేలు కోసం చేసిన కార్యాన్ని గానీ ఎరుగని మరో తరం వచ్చింది.
  rationale: The revision conforms the divine name to the stated project decision, improves the modern Telugu flow, and explicitly coordinates Yahweh and his work as the two objects of ‘did not know.’ It retains the Hebrew death idiom in the text, explains it in the footnote, and does not narrow the potentially relational sense of ‘know.’
