id: JDG.2.1
reference: Judges 2:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּ֧עַל מַלְאַךְ יְהוָ֛ה מִן הַ/גִּלְגָּ֖ל אֶל הַ/בֹּכִ֑ים וַ/יֹּאמֶר֩ אַעֲלֶ֨ה אֶתְ/כֶ֜ם מִ/מִּצְרַ֗יִם וָ/אָבִ֤יא אֶתְ/כֶם֙ אֶל הָ/אָ֗רֶץ אֲשֶׁ֤ר נִשְׁבַּ֨עְתִּי֙ לַ/אֲבֹ֣תֵי/כֶ֔ם וָ/אֹמַ֕ר לֹֽא אָפֵ֧ר בְּרִיתִ֛/י אִתְּ/כֶ֖ם לְ/עוֹלָֽם־־־פ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/001.yaml
  text: Then the angel of Yahweh went up from Gilgal to Bochim and said[a], “I brought you up from Egypt and brought you into the land that I swore to your fathers, and I said[b], ‘I will never break my covenant with you.’”
translation:
  language: te
  text: 'యాహ్వే దూత[a] గిల్గాలు నుండి బోకీముకు[b] పైకి వెళ్లి ఇలా అన్నాడు: “నేను మిమ్మల్ని ఐగుప్తు నుండి పైకి రప్పించి, మీ పితరులకు ఇస్తానని ప్రమాణం చేసిన దేశానికి తీసుకొచ్చాను. ‘మీతో చేసిన నా నిబంధనను ఎన్నటికీ భంగం చేయను’ అని చెప్పాను.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘దూత’ అనే పదం వార్తాహరుడిని లేదా దేవదూతను సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘బోకీము’ అనే పేరు ‘ఏడ్చేవారు’ లేదా ‘ఏడుపు స్థలం’ అనే భావాన్ని సూచించవచ్చు.
    reason: cultural_note
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: యాహ్వే దూత
  rationale: מַלְאַךְ అనే పదానికి ‘దూత/వార్తాహరుడు’ లేదా ‘దేవదూత’ అనే అర్థాలు రావచ్చు. తెలుగులో ‘దూత’ ఈ ఉద్దేశపూర్వక అస్పష్టతను సహజంగా నిలుపుతుంది; యెహోవా అనే బిరుదు-ప్రత్యామ్నాయం కాకుండా దైవనామాన్ని ‘యాహ్వే’గా ఉంచాం.
- source_word: וַיַּעַל
  choice: వెళ్లి
  rationale: עלה లోని పైకి వెళ్లే దిశాభావం సందర్భంలో ఉన్నప్పటికీ, తెలుగులో స్థలాల మధ్య ప్రయాణాన్ని సహజంగా చెప్పడానికి ‘వెళ్లి’ వాడాం; వెంటనే వచ్చే ‘పైకి రప్పించి’తో అనవసర పునరుక్తిని నివారించాం.
- source_word: הַגִּלְגָּל
  choice: గిల్గాలు
  rationale: స్థలనామాన్ని తెలుగు ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: הַבֹּכִים
  choice: బోకీము
  rationale: ఇది స్థలనామంగా ఉన్నందున ప్రధాన పాఠ్యంలో లిప్యంతరీకరించి, దాని పదార్థాన్ని పాదటిప్పణిలో ఇచ్చాం.
- source_word: אַעֲלֶה אֶתְכֶם מִמִּצְרַיִם
  choice: నేను మిమ్మల్ని ఐగుప్తు నుండి పైకి రప్పించి
  rationale: రూపం అపూర్ణకాలంగా కనిపించినా, వెంట వచ్చే గత కార్యంతో కలిసి ఇక్కడ గత విమోచన కార్యాన్ని జ్ఞాపకం చేస్తోంది. ‘పైకి రప్పించి’ అనే ప్రయోగం עלה యొక్క దిశాభావాన్ని నిలుపుతుంది.
- source_word: וָאָבִיא אֶתְכֶם
  choice: తీసుకొచ్చాను
  rationale: హిఫిల్ రూపంలోని ‘లోనికి తీసుకురావడం’ భావాన్ని గమ్యస్థానంతో సహజమైన తెలుగులో వ్యక్తం చేశాం.
- source_word: הָאָרֶץ אֲשֶׁר נִשְׁבַּעְתִּי לַאֲבֹתֵיכֶם
  choice: మీ పితరులకు ఇస్తానని ప్రమాణం చేసిన దేశం
  rationale: హీబ్రూ వాక్యంలో ప్రమాణ విషయమైన భూమి సంక్షిప్తంగా సూచించబడింది. తెలుగులో సంబంధం స్పష్టంగా, సహజంగా ఉండేందుకు సందర్భంలో అంతర్లీనమైన ‘ఇస్తానని’ చేర్చాం; אָבוֹת యొక్క పురుష బహువచనాన్ని ‘పితరులు’గా నిలిపాం.
- source_word: לֹא אָפֵר בְּרִיתִי אִתְּכֶם לְעוֹלָם
  choice: మీతో చేసిన నా నిబంధనను ఎన్నటికీ భంగం చేయను
  rationale: הפר యొక్క నిబంధనా సందర్భార్థాన్ని ‘భంగం చేయడం’గా, לְעוֹלָםతో కూడిన నిరాకరణను ‘ఎన్నటికీ ... చేయను’గా సహజంగా వ్యక్తం చేశాం.
theological_decisions:
- issue: מַלְאַךְ יְהוָה యొక్క గుర్తింపు
  choice: ‘యాహ్వే దూత’ అని అనువదించి, అతడు సృష్టించబడిన దేవదూతనా లేక యాహ్వే ప్రత్యక్షతనా అనేది నిర్ణయించలేదు.
  alternative: ‘యాహ్వే దేవదూత’ అని నిర్దిష్టంగా చెప్పడం, లేదా యాహ్వే స్వయంగా ప్రత్యక్షమయ్యాడని వివరణాత్మకంగా అనువదించడం.
  rationale: దూతగా పరిచయమైన వ్యక్తి వెంటనే దేవుని ప్రథమ పురుషంలో మాట్లాడటం వచనంలోని నిజమైన ధార్మిక ఉద్వేగం. అనువాదం దానిని పరిష్కరించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు స్పష్టమైన శైలి. ‘నిబంధన,’ ‘పితరులు,’ ‘ప్రమాణం’ వంటి బైబిలు భావపదాలను నిలుపుతూ, వాక్య నిర్మాణాన్ని సహజంగా ఉంచాం. అన్ని పాదటిప్పణి సూచికలు సంబంధిత పదాల వెంట ప్రధాన పాఠ్యంలో ఉంచబడ్డాయి.
