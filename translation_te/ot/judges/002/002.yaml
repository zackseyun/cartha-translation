source:
  edition: WLC
  text: וְ/אַתֶּ֗ם לֹֽא תִכְרְת֤וּ בְרִית֙ לְ/יֽוֹשְׁבֵי֙ הָ/אָ֣רֶץ הַ/זֹּ֔את מִזְבְּחוֹתֵי/הֶ֖ם תִּתֹּצ֑וּ/ן וְ/לֹֽא שְׁמַעְתֶּ֥ם בְּ/קֹלִ֖/י מַה זֹּ֥את עֲשִׂיתֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/002.yaml
  text: And you were not to make a covenant with the inhabitants of this land; you were to tear down their altars[a]. But you have not listened to my voice. What is this you have done?
translation:
  language: te
  text: మీరు ఈ దేశంలోని నివాసులతో నిబంధన చేసుకోకూడదని, వారి బలిపీఠాలను మీరు కూలగొట్టాలని చెప్పాను.[a] కాని మీరు నా మాట వినలేదు. మీరు చేసిన ఈ పని ఏమిటి?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, ‘నిబంధన కోయడం.’
    reason: lexical_alternative
lexical_decisions:
- source_word: תִכְרְתוּ בְרִית
  choice: నిబంధన చేసుకోకూడదు
  rationale: హీబ్రూ నుడికారం అక్షరార్థంగా ‘నిబంధన కోయడం’ అని ఉన్నా, ఆధునిక తెలుగులో ‘నిబంధన చేసుకోవడం’ సహజంగా ఉండి בְּרִית యొక్క ఒడంబడిక భావాన్ని నిలుపుతుంది.
- source_word: לְיֹשְׁבֵי הָאָרֶץ הַזֹּאת
  choice: ఈ దేశ నివాసులతో
  rationale: ‘నివాసులు’ అనేది יֹשְׁבֵי అనే కృదంత నామవాచకానికి సంక్షిప్తమైన సహజ సమానం; ‘ఈ దేశ’ అనేది నిర్దేశక భావాన్ని నిలుపుతుంది.
- source_word: מִזְבְּחוֹתֵיהֶם תִּתֹּצוּן
  choice: వారి బలిపీఠాలను కూలగొట్టాలి
  rationale: נתץ బలిపీఠాలు లేదా నిర్మాణాలను పడగొట్టడం, ధ్వంసం చేయడం అనే భావాన్ని ఇస్తుంది. ‘కూలగొట్టాలి’ స్పష్టంగా, సహజంగా ఉంది; సందర్భంలో ఇది ముందుగా ఇచ్చిన ఆజ్ఞను గుర్తుచేస్తుంది.
- source_word: וְלֹא שְׁמַעְתֶּם בְּקֹלִי
  choice: కాని మీరు నా మాట వినలేదు
  rationale: שמע בְּקוֹל వినడంతోపాటు విధేయతను సూచించగలదు. ‘నా మాట వినలేదు’ హీబ్రూ రూపకాన్ని సహజ తెలుగులో నిలుపుతూ అవిధేయత భావాన్ని సందర్భానికి వదిలిపెడుతుంది.
- source_word: מַה זֹּאת עֲשִׂיתֶם
  choice: మీరు చేసిన ఈ పని ఏమిటి?
  rationale: ఈ రూపం ‘ఇదేమి పని చేశారు?’ అనే గద్దింపు, ఆశ్చర్య భావాలను నిలుపుతుంది; దానిని ‘ఎందుకు చేశారు?’గా మార్చి ఉద్దేశాన్ని ప్రశ్నించినట్లు చేయదు.
- source_word: וְאַתֶּם לֹא ... תִּכְרְתוּ ... תִּתֹּצוּן
  choice: చేసుకోకూడదు ... కూలగొట్టాలి
  rationale: ఈ అసంపూర్ణ క్రియారూపాలు గతంలో ఇచ్చిన దైవాజ్ఞలను గద్దింపు సందర్భంలో గుర్తుచేస్తున్నాయి. తెలుగు విధ్యర్థక రూపాలు ఆ ముందస్తు బాధ్యతను సహజంగా తెలియజేస్తాయి.
theological_decisions:
- issue: దేశ నివాసులతో ఇశ్రాయేలు నిషేధిత సంబంధానికి సంబంధించిన בְּרִית పదం
  choice: నిబంధన
  alternative: ఒప్పందం
  rationale: ‘నిబంధన’ బైబిలు సందర్భంలోని గంభీరమైన ఒడంబడిక సంబంధాన్ని నిలుపుతుంది; ‘ఒప్పందం’ దానిని కేవలం రాజకీయ లేదా సాధారణ వ్యవహారానికి పరిమితం చేసే అవకాశం ఉంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గంభీరమైన ప్రత్యక్ష గద్దింపు శైలిని ఉపయోగించాం. మూలంలోని ‘నా స్వరం’ అనే అక్షరరూపానికి బదులు సహజమైన ‘నా మాట’ వాడినా, వినడం-విధేయత మధ్యనున్న భావ ఉద్రిక్తతను పరిష్కరించకుండా నిలిపాం.
