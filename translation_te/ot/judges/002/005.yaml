id: JDG.2.5
reference: Judges 2:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַֽ/יִּקְרְא֛וּ שֵֽׁם הַ/מָּק֥וֹם הַ/ה֖וּא בֹּכִ֑ים וַ/יִּזְבְּחוּ שָׁ֖ם לַֽ/יהוָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/005.yaml
  text: So they called the name of that place Bochim[a], and they sacrificed there to Yahweh.
translation:
  language: te
  text: కాబట్టి వారు ఆ స్థలానికి బోకీము[a] అని పేరు పెట్టి, అక్కడ యాహ్వేకు బలులు అర్పించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘బోకీము’ అనే పేరు ‘ఏడ్చేవారు’ లేదా ‘విలపించేవారు’ అనే అర్థమున్న హీబ్రూ పదంలా ధ్వనిస్తుంది.
    reason: స్థలనామంలోని హీబ్రూ పదప్రయోగం ప్రధాన పాఠంలోని లిప్యంతరీకరణలో స్పష్టంగా కనిపించదు.
lexical_decisions:
- source_word: וַיִּקְרְאוּ שֵׁם
  choice: పేరు పెట్టి
  rationale: హీబ్రూ ‘పేరు పిలిచారు’ అనే నుడికారానికి ఆధునిక తెలుగులో సహజమైన సమానార్థక ప్రయోగం ‘పేరు పెట్టారు.’ వరుస క్రియల అనుసంధానాన్ని ‘పెట్టి’ నిలుపుతుంది.
- source_word: הַמָּקוֹם הַהוּא
  choice: ఆ స్థలానికి
  rationale: הַהוּא లోని సూచనార్థాన్ని ‘ఆ’ స్పష్టంగా ప్రతిబింబిస్తుంది; పేరు పెట్టడం అనే తెలుగు క్రియతో ‘స్థలానికి’ సహజంగా సరిపోతుంది.
- source_word: בֹּכִים
  choice: బోకీము
  rationale: ఇది స్థలనామంగా వాడబడినందున అనువదించకుండా లిప్యంతరీకరించబడింది; దాని ‘ఏడ్చేవారు’ అనే పదసంబంధం పాదటిప్పణిలో ఇవ్వబడింది.
- source_word: וַיִּזְבְּחוּ
  choice: బలులు అర్పించారు
  rationale: זבח అంటే బలి అర్పించడం. ‘బలులు అర్పించారు’ అనేది ఆధునిక తెలుగులో సహజంగా, ఆరాధన సందర్భాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: שָׁם
  choice: అక్కడ
  rationale: ఇప్పుడే పేర్కొన్న స్థలాన్ని సూచించే సహజమైన స్థానవాచక క్రియావిశేషణం.
- source_word: לַיהוָה
  choice: యాహ్వేకు
  rationale: లామెద్‌లోని దిశ/గ్రహీత భావాన్ని ‘కు’ తెలియజేస్తుంది; יהוה అనే దైవనామాన్ని ‘యాహ్వే’గా లిప్యంతరీకరించింది.
theological_decisions:
- issue: יהוה అనే దైవనామాన్ని ఎలా అందించాలి
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో ఒడంబడిక దైవనామం ప్రత్యక్షంగా ఉంది. దానిని సాధారణ బిరుదుతో భర్తీ చేయకుండా ‘యాహ్వే’గా లిప్యంతరీకరించడం మూలంలోని ప్రత్యేక నామాన్ని నిలుపుతుంది.
- issue: בֹּכִים ను అనువదించాలా, లిప్యంతరీకరించాలా
  choice: బోకీము
  alternative: ఏడ్చేవారు; విలపించేవారు
  rationale: ఈ పదం ఇక్కడ స్థలనామంగా పనిచేస్తుంది. కాబట్టి ప్రధాన పాఠంలో నామాన్ని ఉంచి, దాని అర్థసంబంధాన్ని పాదటిప్పణిలో తెలియజేయడం సముచితం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సరళమైనప్పటికీ గౌరవప్రదమైన వాక్యనిర్మాణం. హీబ్రూ వరుస కథనాన్ని తెలుగులో సహజంగా ‘పెట్టి ... అర్పించారు’ రూపంలో అందించింది. పాదటిప్పణి సూచిక [a] ప్రధాన పాఠంలో చేర్చబడింది.
