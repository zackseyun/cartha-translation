base_translation:
  language: en
  yaml_path: translation/ot/judges/002/014.yaml
  text: Then the anger of Yahweh burned against Israel[a], and he gave them into the hand of plunderers, who plundered them. He sold them into the hand of their enemies all around[c][b], so that they could no longer stand before their enemies.
translation:
  language: te
  text: అప్పుడు యెహోవా కోపం ఇశ్రాయేలుపై రగులుకుంది[a]. ఆయన వారిని దోచుకునేవారి చేతికి అప్పగించాడు; వారు వారిని దోచుకున్నారు. ఆయన వారిని వారి చుట్టూ ఉన్న శత్రువుల చేతికి అమ్మివేశాడు[b]. కాబట్టి వారు ఇక తమ శత్రువుల ఎదుట నిలబడలేకపోయారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘యెహోవా కోపం ఇశ్రాయేలుపై మండింది.’
    reason: lexical_alternative
  - marker: b
    text: ‘చేతికి’ అనేది ఒకరి అధికారానికి లేదా వశానికి అప్పగించడాన్ని సూచించే హెబ్రీ నుడికారం.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: కోపం రగులుకుంది
  rationale: హెబ్రీలోని ‘కోపం మండడం’ అనే సజీవ రూపకాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవ నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే లిప్యంతరీకరణతో అందిస్తుంది.
- source_word: וַיִּתְּנֵם בְּיַד
  choice: వారిని ... చేతికి అప్పగించాడు
  rationale: ‘చేతిలో ఇవ్వడం’ అంటే మరొకరి అధికారానికి అప్పగించడం అనే హెబ్రీ నుడికారాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: שֹׁסִים / וַיָּשֹׁסּוּ
  choice: దోచుకునేవారు / దోచుకున్నారు
  rationale: నామవాచకం-క్రియ మధ్య ఉన్న మూలపద సంబంధాన్ని తెలుగులోనూ నిలుపుతుంది.
- source_word: וַיִּמְכְּרֵם
  choice: వారిని ... చేతికి అమ్మివేశాడు
  rationale: ‘అమ్మడం’ అనే మూలంలోని బలమైన, స్పష్టమైన చిత్రణను మృదువుగా మార్చకుండా కాపాడుతుంది.
- source_word: אֹיְבֵיהֶם מִסָּבִיב
  choice: చుట్టూ ఉన్న శత్రువులు
  rationale: వారిని అన్ని వైపులా చుట్టుముట్టిన శత్రువుల భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וְלֹא יָכְלוּ עוֹד לַעֲמֹד לִפְנֵי
  choice: ఇక ... ఎదుట నిలువలేకపోయారు
  rationale: ప్రతిఘటించి నిలబడలేకపోవడం అనే భావాన్ని మూలానికి దగ్గరగా, తెలుగులో స్పష్టంగా అందిస్తుంది.
theological_decisions:
- issue: దైవ కోపానికి సంబంధించిన మానవరూప భాష
  choice: యెహోవా కోపం రగులుకుంది
  alternative: యెహోవా ఇశ్రాయేలుపై కోపగించాడు
  rationale: మూలంలోని సజీవమైన ‘కోపం మండడం’ అనే రూపకాన్ని నిలుపుతూ, దాని వెనుక సిద్ధాంతపరమైన వివరణను అనవసరంగా చేర్చదు.
- issue: దైవ తీర్పులో ‘అమ్మివేయడం’ అనే రూపకం
  choice: ఆయన వారిని ... చేతికి అమ్మివేశాడు
  alternative: ఆయన వారిని ... అధికారానికి అప్పగించాడు
  rationale: מכר అనే క్రియ యొక్క స్పష్టమైన అర్థాన్ని నిలుపుతుంది; తీర్పు తీవ్రతను తగ్గించి వ్యాఖ్యానించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన శైలి. మూలంలోని కోపం రగులుకోవడం, చేతికి అప్పగించడం, అమ్మివేయడం, శత్రువుల ఎదుట నిలవడం వంటి చిత్రణలను సాధ్యమైనంతవరకు నిలిపాం.
