id: JDG.2.17
reference: Judges 2:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/גַ֤ם אֶל שֹֽׁפְטֵי/הֶם֙ לֹ֣א שָׁמֵ֔עוּ כִּ֣י זָנ֗וּ אַֽחֲרֵי֙ אֱלֹהִ֣ים אֲחֵרִ֔ים וַ/יִּֽשְׁתַּחֲו֖וּ לָ/הֶ֑ם סָ֣רוּ מַהֵ֗ר מִן הַ/דֶּ֜רֶךְ אֲשֶׁ֨ר הָלְכ֧וּ אֲבוֹתָ֛/ם לִ/שְׁמֹ֥עַ מִצְוֺת יְהוָ֖ה לֹא עָ֥שׂוּ כֵֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/017.yaml
  text: Yet they did not listen even to their judges[a], for they prostituted themselves after other gods and bowed down to them. They quickly turned aside from the way in which their fathers had walked in obeying the commandments of Yahweh; they did not do so.
translation:
  language: te
  text: అయినా వారు తమ న్యాయాధిపతుల మాట కూడా వినలేదు; ఎందుకంటే వారు ఇతర దేవుళ్ల వెంట వ్యభిచరించి[a], వాటికి సాష్టాంగ నమస్కారం చేశారు. యాహ్వే ఆజ్ఞలకు లోబడుతూ తమ పితరులు నడిచిన మార్గం నుండి వారు త్వరగా తొలగిపోయారు; వారు అలా చేయలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థానికి దగ్గరగా, “ఇతర దేవుళ్ల వెంట వ్యభిచరించారు.” విగ్రహారాధనను, నిబంధన పట్ల అవిశ్వాసాన్ని వర్ణించడానికి హెబ్రీ పాఠ్యం లైంగిక అవిశ్వాస రూపకాన్ని ఉపయోగిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם אֶל שֹׁפְטֵיהֶם לֹא שָׁמֵעוּ
  choice: అయినా వారు తమ న్యాయాధిపతుల మాట కూడా వినలేదు
  rationale: וְגַם లోని కొనసాగింపు, స్వల్ప వ్యతిరేకత, ఉద్ఘాటనలను ‘అయినా... కూడా’ తెలియజేస్తాయి. שׁמע אֶל అనేది మాట వినడం ద్వారా లోబడడాన్ని సూచిస్తుంది; ‘మాట వినలేదు’ అనే సహజ తెలుగు ప్రయోగం రెండింటినీ నిలుపుతుంది.
- source_word: שֹׁפְטֵיהֶם
  choice: తమ న్యాయాధిపతులు
  rationale: ఇది ఈ కాలంలో దేవుడు లేపిన ‘న్యాయాధిపతులు’ అనే ప్రత్యేక చారిత్రక పదవి; సాధారణమైన ‘నాయకులు’గా మార్చలేదు.
- source_word: כִּי זָנוּ אַחֲרֵי אֱלֹהִים אֲחֵרִים
  choice: వారు ఇతర దేవుళ్లను వెంబడిస్తూ వ్యభిచారుల్లా ప్రవర్తించి
  rationale: זנה లోని లైంగిక అవిశ్వాస రూపకాన్ని నిలుపుతూ, ఇక్కడ విగ్రహారాధన మరియు నిబంధనా ద్రోహం ఉద్దేశించబడ్డాయని తెలుగులో అర్థమయ్యేలా ‘వ్యభిచారుల్లా ప్రవర్తించి’ అని ఇచ్చాం. אַחֲרֵי లోని వెంబడింపు భావాన్ని కూడా ఉంచాం.
- source_word: וַיִּשְׁתַּחֲווּ לָהֶם
  choice: వాటికి సాష్టాంగపడ్డారు
  rationale: క్రియలోని నేలవంగి ఆరాధించే భౌతిక చిత్రాన్ని ‘ఆరాధించారు’ అని చదును చేయకుండా నిలుపుతుంది. దేవతా విగ్రహాలను ఉద్దేశించే సహజ తెలుగు సర్వనామంగా ‘వాటికి’ వాడాం.
- source_word: סָרוּ מַהֵר מִן הַדֶּרֶךְ
  choice: మార్గం నుండి వారు త్వరగా తొలగిపోయారు
  rationale: సరైన ప్రవర్తనను మార్గంగా చూపే మూల రూపకాన్నీ, מַהֵר లోని వేగాన్నీ నిలుపుతుంది.
- source_word: אֲשֶׁר הָלְכוּ אֲבוֹתָם לִשְׁמֹעַ מִצְוֺת יְהוָה
  choice: యెహోవా ఆజ్ఞలకు లోబడుతూ తమ పితరులు నడిచిన
  rationale: లక్ష్యార్థక לִשְׁמֹעַ ను సందర్భానుసారంగా ‘లోబడుతూ’ అని ఇచ్చి, అది పితరులు నడిచిన మార్గం యొక్క స్వభావాన్ని తెలియజేసేలా వాక్య నిర్మాణం చేశాం. ‘నడిచిన మార్గం’ మూల రూపకాన్ని నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవ నామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన రూపంలో లిప్యంతరీకరించాం.
- source_word: לֹא עָשׂוּ כֵן
  choice: తమ పితరులు చేసినట్లు వారు చేయలేదు
  rationale: ‘అలా చేయలేదు’ అనే మూలంలోని సంక్షిప్తతను కాపాడుతూనే, తెలుగులో ‘అలా’ దేనిని సూచిస్తుందో స్పష్టంగా ఉండేందుకు పితరుల విధేయ ప్రవర్తనను సంక్షిప్తంగా పునరుద్ఘాటించాం.
theological_decisions:
- issue: זָנוּ లోని నిబంధనా అవిశ్వాస రూపకం
  choice: ‘వ్యభిచారుల్లా ప్రవర్తించి’ అనే లైంగిక అవిశ్వాస రూపకాన్ని ప్రధాన పాఠ్యంలో నిలుపడం
  alternative: ‘ద్రోహం చేసి’ లేదా ‘నమ్మకద్రోహులై’ అని రూపకాన్ని సూటి భావంగా మార్చడం
  rationale: హెబ్రీ పాఠ్యం విగ్రహారాధనను ఉద్దేశపూర్వకంగా లైంగిక/వైవాహిక అవిశ్వాసంతో పోలుస్తుంది. దాని నైతిక, నిబంధనా తీవ్రతను చదును చేయకుండా, ఇది రూపకమని తెలుగులో స్పష్టమయ్యే ‘వ్యభిచారుల్లా’ రూపాన్ని ఎంచుకున్నాం.
- issue: יְהוָה అనే దైవనామం
  choice: యెహోవా
  alternative: ప్రభువు; యాహ్వే
  rationale: వ్యక్తిగత దైవనామాన్ని బిరుదుగా మార్చకుండా ఉంచాం. ‘యెహోవా’ ఆధునిక తెలుగు క్రైస్తవ పాఠక వర్గంలో విస్తృతంగా గుర్తించదగిన లిప్యంతరీకరణ; ఇది ఏ ప్రత్యేక వ్యాఖ్యాన సంప్రదాయాన్నీ వాక్యంలో చేర్చదు.
- issue: ‘తమ పితరులు చేసినట్లు వారు చేయలేదు’ అనే చివరి వాక్యభాగం యొక్క సూచన
  choice: పితరుల విధేయ నడవడికను సూచించేలా అనువదించడం
  alternative: ‘వారు అలా చేయలేదు’ అని అస్పష్ట సూచనను యథాతథంగా ఉంచడం
  rationale: כֵן పూర్వవాక్యంలోని యెహోవా ఆజ్ఞలకు లోబడిన పితరుల నడవడికను సూచిస్తుంది. తెలుగు పాఠ్యంలో సూచన స్పష్టత కోసం దాన్ని వ్యక్తం చేశాం; కొత్త దైవశాస్త్ర భావాన్ని జోడించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి. ‘న్యాయాధిపతులు,’ ‘పితరులు,’ ‘ఆజ్ఞలు’ వంటి బైబిలు సందర్భానికి అవసరమైన పదాలను నిలుపుతూ, వాక్య నిర్మాణాన్ని సాధారణ పాఠకులకు సహజంగా ఉంచాం. ప్రధాన పాఠ్యంలోని [a] గుర్తు సంబంధిత పాదటిప్పణితో సరిపోలుతుంది.
