source:
  edition: WLC
  text: וְ/כִֽי הֵקִ֨ים יְהוָ֥ה לָ/הֶם֮ שֹֽׁפְטִים֒ וְ/הָיָ֤ה יְהוָה֙ עִם הַ/שֹּׁפֵ֔ט וְ/הֽוֹשִׁיעָ/ם֙ מִ/יַּ֣ד אֹֽיְבֵי/הֶ֔ם כֹּ֖ל יְמֵ֣י הַ/שּׁוֹפֵ֑ט כִּֽי יִנָּחֵ֤ם יְהוָה֙ מִ/נַּֽאֲקָתָ֔/ם מִ/פְּנֵ֥י לֹחֲצֵי/הֶ֖ם וְ/דֹחֲקֵי/הֶֽם־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/018.yaml
  text: Whenever Yahweh raised up judges for them[a], Yahweh was with the judge and saved them from the hand of their enemies all the days of the judge, for Yahweh was moved to pity by their groaning because of those who oppressed and afflicted them.
translation:
  language: te
  text: యెహోవా వారి కోసం న్యాయాధిపతులను లేపినప్పుడల్లా, యెహోవా ఆ న్యాయాధిపతికి తోడుగా ఉండి, ఆ న్యాయాధిపతి ఉన్న రోజులన్నిటిలో వారిని వారి శత్రువుల చేతిలోనుండి రక్షించేవాడు. ఎందుకంటే, వారిని అణచివేసి బాధించేవారి వలన వారు మూలుగుతున్నందుకు యెహోవా కనికరించేవాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యెహోవా మనస్సు మార్చుకున్నాడు” లేదా “యెహోవా కరుణ చూపాడు.” హెబ్రీయ క్రియ వైఖరిలో మార్పునుగానీ, కనికరంతో స్పందించడాన్నిగానీ సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: లేపినప్పుడల్లా
  rationale: ఈ కథన సారాంశంలో పదేపదే జరిగే చర్యను సూచిస్తుంది; అందువల్ల ‘ఎప్పుడల్లా’ అనే కాలార్థక ప్రయోగం సహజంగా ఉంది.
- source_word: הֵקִים
  choice: లేపిన
  rationale: నాయకులను దేవుడు ‘లేపడం’ అనే హెబ్రీయ రూపకాన్ని, ఆయన చొరవను నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో స్థిరపడిన ‘యెహోవా’ రూపంలో అందిస్తుంది.
- source_word: שֹׁפְטִים
  choice: న్యాయాధిపతులను
  rationale: న్యాయాధిపతుల గ్రంథంలోని ఈ నాయకులకు సంప్రదాయబద్ధమైన, సందర్భోచితమైన పదం; వారి రక్షక పాత్రను తరువాతి క్రియ తెలియజేస్తుంది.
- source_word: וְהָיָה יְהוָה עִם הַשֹּׁפֵט
  choice: యెహోవా ఆ న్యాయాధిపతికి తోడుగా ఉండి
  rationale: దైవ సన్నిధి, సహాయాన్ని అదనపు వ్యాఖ్యానం లేకుండా సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: וְהוֹשִׁיעָם
  choice: వారిని ... రక్షించేవాడు
  rationale: హిఫిల్ రూపం శత్రువుల అధికారంనుండి విడిపించడం లేదా రక్షించడాన్ని సూచిస్తుంది; పునరావృత చర్యను తెలుగు క్రియారూపం చూపిస్తుంది.
- source_word: מִיַּד אֹיְבֵיהֶם
  choice: వారి శత్రువుల చేతిలోనుండి
  rationale: అధికారం లేదా నియంత్రణను సూచించే హెబ్రీయ ‘చేతి’ నుడికారాన్ని తెలుగులో అర్థమయ్యే విధంగా నిలుపుతుంది.
- source_word: כֹּל יְמֵי הַשּׁוֹפֵט
  choice: అతని రోజులన్నిటిలో
  rationale: ఆ న్యాయాధిపతి జీవించిన లేదా సేవచేసిన కాలమంతటినీ సూచించే మూలపాఠ రూపాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: יִנָּחֵם
  choice: కనికరించేవాడు
  rationale: ఇక్కడ నిఫల్ క్రియ ఇశ్రాయేలీయుల వేదనకు యెహోవా చూపిన కరుణామయ స్పందనను సూచిస్తుంది; ‘మనస్సు మార్చుకున్నాడు’ అనే ఒక్క అర్థానికి పరిమితం చేయకుండా ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: מִנַּאֲקָתָם
  choice: వారు పెట్టిన మూలుగులను విని
  rationale: మూలపాఠంలోని కారణ లేదా సందర్భ సంబంధాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది; ‘విని’ అనేది మూలుగులకు స్పందించడాన్ని సూచించే సహజీకరణ.
- source_word: מִפְּנֵי לֹחֲצֵיהֶם וְדֹחֲקֵיהֶם
  choice: వారిని అణచివేసి బాధించేవారి కారణంగా
  rationale: రెండు క్రియాత్మక కృదంతాలైన అణచివేసేవారు, తీవ్రంగా బాధించేవారు అనే భావాలను సహజమైన సమాంతర తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: వ్యక్తిగత దైవనామాన్ని ‘ప్రభువు’ అనే బిరుదుతో మార్చకుండా ఉంచుతూ, సాధారణ తెలుగు బైబిలు పాఠకులకు విస్తృతంగా పరిచయమైన లిప్యంతరీకరణను ఎంచుకున్నాం.
- issue: יִנָּחֵם లోని దేవుని స్పందనను తెలిపే భాష
  choice: కనికరించేవాడు
  alternative: మనస్సు మార్చుకునేవాడు / వెనక్కి తగ్గేవాడు
  rationale: సందర్భంలో ప్రజల మూలుగులకు దేవుని కరుణామయ స్పందనే ముందుంటుంది. అయినా ఈ హెబ్రీయ క్రియలో వైఖరి మార్పు లేదా వెనక్కి తగ్గడం అనే భావసాధ్యత ఉన్నందున దానిని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనా సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్యనిర్మాణం. పునరావృత కథన స్వభావాన్ని ‘అప్పుడల్లా’ మరియు ‘-ేవాడు’ రూపాలతో చూపించాం. మూలపాఠంలోని దైవనామాన్ని వ్యక్తినామంగా నిలిపాం.
