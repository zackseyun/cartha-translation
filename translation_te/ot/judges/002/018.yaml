  to: యెహోవా వారి కోసం న్యాయాధిపతులను లేపినప్పుడల్లా, యెహోవా ఆ న్యాయాధిపతికి తోడుగా ఉండి, ఆ న్యాయాధిపతి ఉన్న రోజులన్నిటిలో వారిని వారి శత్రువుల చేతిలోనుండి రక్షించేవాడు. ఎందుకంటే, వారిని అణచివేసి బాధించేవారి వలన వారు మూలుగుతున్నందుకు యెహోవా కనికరించేవాడు.[a]
