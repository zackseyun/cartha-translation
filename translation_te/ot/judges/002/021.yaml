source:
  edition: WLC
  text: גַּם אֲנִי֙ לֹ֣א אוֹסִ֔יף לְ/הוֹרִ֥ישׁ אִ֖ישׁ מִ/פְּנֵי/הֶ֑ם מִן הַ/גּוֹיִ֛ם אֲשֶׁר עָזַ֥ב יְהוֹשֻׁ֖עַ וַ/יָּמֹֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/021.yaml
  text: I also will no longer continue to drive out before them any of the nations that Joshua left when he died[a].
translation:
  language: te
  text: యెహోషువ చనిపోయినప్పుడు అతడు విడిచిపెట్టిన ఆ జాతులలో ఏ ఒక్కదానినీ కూడా వారి ఎదుటనుండి నేను కూడా ఇకపై వెళ్లగొట్టను[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యెహోషువ విడిచిపెట్టిన ఆ జాతులలో ఏ ఒక్కదానినీ కూడా వారి ఎదుటనుండి నేను కూడా ఇకపై వెళ్లగొట్టను—అతడు చనిపోయాడు.” హెబ్రీలో అక్షరార్థంగా, “యెహోషువ విడిచిపెట్టాడు, మరియు అతడు చనిపోయాడు” అని ఉంది; సందర్భంలో దీనిని “యెహోషువ చనిపోయినప్పుడు అతడు విడిచిపెట్టిన” అని కాలార్థంలో అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם אֲנִי
  choice: కాబట్టి ... నేను
  rationale: గత వచనంలోని దైవిక తీర్పుకు కొనసాగింపుగా గַּם పనిచేస్తుంది. తెలుగులో ‘కాబట్టి’ సందర్భ సంబంధాన్ని సహజంగా చూపుతుంది; స్వతంత్ర సర్వనామమైన אֲנִי యొక్క ఉద్ఘాటనను ‘నేను’ నిలుపుతుంది.
- source_word: לֹא אוֹסִיף
  choice: ఇకపై ... వెళ్లగొట్టను
  rationale: నిషేధ వాక్యంలో יסף + క్రియార్థక రూపం గతంలో జరుగుతున్న చర్య ఇక కొనసాగదనే భావాన్ని ఇస్తుంది. ‘ఇకపై ... చేయను’ ఆధునిక తెలుగులో సహజంగా ఆ భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: לְהוֹרִישׁ
  choice: వెళ్లగొట్టను
  rationale: ఆక్రమణ సందర్భంలో హిఫిల్ రూపమైన הורישׁ దేశపు పూర్వ నివాసులను అక్కడి నుండి తొలగించడాన్ని సూచిస్తుంది. ‘వెళ్లగొట్టు’ సాధారణ పాఠకులకు స్పష్టంగా ఉంటుంది.
- source_word: אִישׁ מִן הַגּוֹיִם
  choice: జనాల్లో ఒక్కరినైనా
  rationale: אִישׁ ఇక్కడ ‘ఒక్కరిని కూడా’ అనే పంపిణీ/ఉద్ఘాటన భావంలో ఉంది; מִן భాగసూచక సంబంధాన్ని తెలుపుతుంది. ఈ తెలుగు రూపం రెండింటినీ నిలుపుతుంది.
- source_word: מִפְּנֵיהֶם
  choice: వారి ఎదుటనుండి
  rationale: మూలంలోని ‘వారి ముఖము/సన్నిధి నుండి’ అనే దృశ్యరూపాన్ని తెలుగులో సహజమైన ‘వారి ఎదుటనుండి’గా నిలిపాం.
- source_word: אֲשֶׁר עָזַב יְהוֹשֻׁעַ
  choice: యెహోషువ విడిచిపెట్టిన
  rationale: עזב యొక్క ప్రాథమిక భావమైన ‘విడిచిపెట్టు/మిగిల్చిపెట్టు’ను సంక్షిప్తంగా, సహజంగా అందిస్తుంది; సందర్భంలో మిగిలిపోయిన జనాలను సూచిస్తుంది.
- source_word: וַיָּמֹת
  choice: అతడు చనిపోయాడు
  rationale: మసొరెటిక్ పాఠంలో ఉన్న స్వతంత్ర ‘మరియు అతడు చనిపోయాడు’ అనే వాక్య క్రమాన్ని ప్రధాన పాఠంలో నిలిపాం; కాలార్థక అనుసంధానం సాధ్యమని పాదటీపులో తెలిపాం.
theological_decisions:
- issue: దైవిక వక్తను పాఠంలో గుర్తించడం
  choice: మొదటి పురుష ఏకవచనమైన ‘నేను’నే ఉంచడం
  alternative: స్పష్టత కోసం ‘యెహోవా’ అని చేర్చడం
  rationale: ఈ వచనంలోని హెబ్రీ పాఠం దైవనామాన్ని మళ్లీ పేర్కొనకుండా אֲנִי (‘నేను’) మాత్రమే ఉపయోగిస్తుంది. సందర్భం వక్తను ఇప్పటికే నిర్ధారిస్తుంది కాబట్టి మూలంలో లేని దైవనామాన్ని చేర్చలేదు.
- issue: וַיָּמֹת యొక్క వాక్య సంబంధం
  choice: ‘అతడు చనిపోయాడు’ అనే సమన్వయ వాక్యంగా ప్రధాన పాఠంలో ఉంచడం
  alternative: ‘అతడు చనిపోయినప్పుడు’ అనే కాలార్థక ఉపవాక్యంగా అనువదించడం
  rationale: మూలపాఠం అక్షరార్థంగా ‘మరియు అతడు చనిపోయాడు’ అని ఉంటుంది. కాలార్థక సంబంధం సందర్భానుకూలంగా సాధ్యమైనప్పటికీ దాన్ని మాత్రమే నిర్ణయించకుండా అసలు అస్పష్టతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనా సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘ఇకపై’ ద్వారా చర్య నిలిచిపోవడాన్ని సహజంగా తెలిపాం. וַיָּמֹת విషయంలో హెబ్రీ వాక్య నిర్మాణాన్ని ప్రధాన పాఠంలో నిలిపి, సహజమైన కాలార్థక ప్రత్యామ్నాయాన్ని పాదటీపులో ఇచ్చాం.
