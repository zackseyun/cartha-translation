source:
  edition: WLC
  text: וַ/יַּנַּ֤ח יְהוָה֙ אֶת הַ/גּוֹיִ֣ם הָ/אֵ֔לֶּה לְ/בִלְתִּ֥י הוֹרִישָׁ֖/ם מַהֵ֑ר וְ/לֹ֥א נְתָנָ֖/ם בְּ/יַד יְהוֹשֻֽׁעַ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/023.yaml
  text: So Yahweh left these nations[a], not driving them out quickly, and he did not give them into the hand of Joshua.
translation:
  language: te
  text: అలా యహ్వే ఈ జనాలను[a] త్వరగా వెళ్లగొట్టకుండా వదిలివేశాడు; వారిని యెహోషువ చేతికి అప్పగించలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఈ ప్రజలను’; హీబ్రూ క్రియకు ‘ఉండనివ్వడం’ లేదా ‘వదిలివేయడం’ అనే అర్థాలు రావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּנַּח
  choice: అలాగే ఉండనిచ్చాడు
  rationale: హిఫీల్ రూపంలో ‘ఉండనివ్వడం, అలాగే వదిలివేయడం’ అనే భావం ఉంది. సందర్భంలో ఆ జనాలు దేశంలో కొనసాగి ఉండేందుకు అనుమతించబడ్డారనే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా వ్యక్తిగత నామంగా లిప్యంతరీకరించాం.
- source_word: הַגּוֹיִם הָאֵלֶּה
  choice: ఈ జనాలను
  rationale: గּוֹיִם అంటే ‘జనాలు’ లేదా ‘దేశాలు.’ ఇక్కడ కనానులో మిగిలిన ప్రజాసమూహాలను సూచిస్తున్నందున ‘జనాలు’ సహజంగా ఉంది.
- source_word: לְבִלְתִּי הוֹרִישָׁם
  choice: వారిని ... వెళ్లగొట్టకుండా
  rationale: ప్రతికూల క్రియార్థక నిర్మాణాన్ని తెలుగులో సహజంగా తెలిపింది; హోరిష్ ఇక్కడ నివాసులను దేశం నుంచి వెళ్లగొట్టడం లేదా స్వాధీనాన్ని తొలగించడం అనే భావంలో ఉంది.
- source_word: מַהֵר
  choice: త్వరగా
  rationale: ‘వేగంగా, త్వరగా’ అనే క్రియావిశేషణ భావాన్ని నేరుగా, ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: וְלֹא נְתָנָם
  choice: వారిని ... అప్పగించలేదు
  rationale: נתן + ‘చేతిలో’ అనే హీబ్రూ ప్రయోగం యుద్ధంలో ఒకరి అధికారానికి లేదా విజయానికి అప్పగించడాన్ని సూచిస్తుంది.
- source_word: בְּיַד יְהוֹשֻׁעַ
  choice: యెహోషువ చేతికి
  rationale: మూలంలోని ‘చేతిలో/చేతికి’ అనే అధికార-నియంత్రణ రూపకాన్ని తెలుగులో అర్థమయ్యే సహజ ప్రయోగంగా నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యహ్వే
  alternative: యెహోవా / ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దాన్ని బిరుదుతో భర్తీ చేయకుండా ‘యహ్వే’గా అందించడం మూలరూపాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన కథనశైలి. ‘చేతికి అప్పగించడం’ అనే హీబ్రూ రూపకాన్ని తెలుగులో సహజంగా నిలిపాం; వాక్యంలోని కారణ-ఫలిత సంబంధాన్ని ‘కాబట్టి’తో తెలిపాం.
