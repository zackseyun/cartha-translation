id: JDG.2.3
reference: Judges 2:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/גַ֣ם אָמַ֔רְתִּי לֹֽא אֲגָרֵ֥שׁ אוֹתָ֖/ם מִ/פְּנֵי/כֶ֑ם וְ/הָי֤וּ לָ/כֶם֙ לְ/צִדִּ֔ים וֵ/אלֹ֣הֵי/הֶ֔ם יִהְי֥וּ לָ/כֶ֖ם לְ/מוֹקֵֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/003.yaml
  text: So I also said[a], ‘I will not drive them out from before you; they will become adversaries to you, and their gods will become a snare to you.’
translation:
  language: te
  text: '‘నేను కూడా ఇలా అన్నాను: నేను వారిని మీ ఎదుటనుండి వెళ్లగొట్టను. వారు మీకు శత్రువులవుతారు[a]; వారి దేవుళ్లు మీకు ఉచ్చుగా ఉంటారు.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ మూలంలో అక్షరార్థంగా ‘పక్కలు’ అని ఉంది. కొన్ని ప్రాచీన అనువాదాలు, అలాగే సమాంతర వాక్యభాగాలు, దీనిని ‘మీ పక్కల్లో ముళ్లు’ అనే భావంలో చదువుతాయి లేదా వ్యాఖ్యానిస్తాయి.
    reason: alternative_reading
lexical_decisions:
- source_word: וְגַם אָמַרְתִּי
  choice: కాబట్టి నేను కూడా ఇలా అన్నాను
  rationale: וְגַם ముందటి గద్దింపుతో ఈ మాటను అనుసంధానిస్తూ అదనపు, సందర్భానుసారంగా పరిణామార్థక భావాన్ని ఇస్తుంది. ఆధునిక తెలుగులో ‘కాబట్టి నేను కూడా’ ఆ సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: לֹא אֲגָרֵשׁ אוֹתָם
  choice: నేను వారిని ... వెళ్లగొట్టను
  rationale: גרש అంటే తరిమివేయడం లేదా వెళ్లగొట్టడం. దేశం నుండి ప్రజలను తొలగించే సందర్భంలో ‘వెళ్లగొట్టను’ స్పష్టంగా, సహజంగా ఉంది.
- source_word: מִפְּנֵיכֶם
  choice: మీ ఎదుటనుండి
  rationale: హీబ్రూ స్థలసంబంధ నుడికారంలోని ‘మీ ముందునుండి’ అనే భావాన్ని తెలుగులో సహజంగా నిలుపుతుంది.
- source_word: לְצִדִּים
  choice: మీకు శత్రువులవుతారు[a]
  rationale: మసొరెటిక్ పాఠంలో అక్షరార్థంగా ‘పక్కలు’ ఉంది; అది ఈ సందర్భంలో క్లిష్టమైన ప్రయోగం. శత్రుత్వపూర్వకంగా ఇశ్రాయేలు పక్కనే నిలిచి బాధ కలిగించే భావాన్ని ‘శత్రువులు’ సహజ తెలుగులో తెలియజేస్తుంది; పాఠ్య క్లిష్టతను పాదటిప్పణి సంరక్షిస్తుంది.
- source_word: וֵאלֹהֵיהֶם
  choice: వారి దేవుళ్లు
  rationale: విగ్రహారాధన సందర్భంలోని אלהים బహువచనానికి ఇది సాధారణమైన, స్పష్టమైన తెలుగు రూపం.
- source_word: יִהְיוּ לָכֶם לְמוֹקֵשׁ
  choice: మీకు ఉచ్చుగా ఉంటారు
  rationale: מוקש వేట ఉచ్చు లేదా చిక్కును సూచించి, ఇక్కడ పాపంలో పడేసే ప్రమాదానికి రూపకంగా వాడబడింది. ‘ఉచ్చు’ ఆ రూపకాన్ని సహజంగా నిలుపుతుంది.
theological_decisions:
- issue: క్లిష్టమైన మసొరెటిక్ పాఠం לְצִדִּים ను ఎలా ప్రతిబింబించాలి
  choice: ప్రధాన పాఠంలో ‘శత్రువులు,’ పాదటిప్పణిలో అక్షరార్థమైన ‘పక్కలు’
  alternative: ‘మీ పక్కల్లో ముళ్లుగా’ లేదా అక్షరార్థంగా ‘పక్కలుగా’
  rationale: ఇచ్చిన హీబ్రూ పాఠం ‘ముళ్లు’ అని చెప్పదు; అక్షరార్థంగా ‘పక్కలు’ అని ఉంది. తెలుగులో అర్థరహితమైన పదబంధాన్ని బలవంతంగా ఉంచకుండా, సందర్భసిద్ధమైన శత్రుత్వ భావాన్ని ప్రధాన పాఠంలో ఇచ్చి, మూలపాఠంలోని క్లిష్టతను మరియు ప్రాచీన అనువాదాల ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో స్పష్టంగా ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే దైవవాక్యానికి తగిన గంభీరతతో అనువదించబడింది. వాక్య నిర్మాణం సహజంగా ఉంచబడింది; క్లిష్టమైన హీబ్రూ పాఠం పాదటిప్పణిలో పారదర్శకంగా సూచించబడింది.
