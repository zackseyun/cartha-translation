- from: 'కాబట్టి నేను కూడా ఇలా అన్నాను: ‘నేను వారిని మీ ఎదుటనుండి వెళ్లగొట్టను. వారు మీకు శత్రువులవుతారు[a]; వారి దేవుళ్లు మీకు ఉచ్చుగా ఉంటారు.’'
  to: '‘నేను కూడా ఇలా అన్నాను: నేను వారిని మీ ఎదుటనుండి వెళ్లగొట్టను. వారు మీకు శత్రువులవుతారు[a]; వారి దేవుళ్లు మీకు ఉచ్చుగా ఉంటారు.’'
