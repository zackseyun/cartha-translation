id: JDG.2.13
reference: Judges 2:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּעַזְב֖וּ אֶת יְהוָ֑ה וַ/יַּעַבְד֥וּ לַ/בַּ֖עַל וְ/לָ/עַשְׁתָּרֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/013.yaml
  text: They abandoned Yahweh and served Baal and the Ashtoreths[a][b][c].
translation:
  language: te
  text: వారు యహ్వేను విడిచిపెట్టి, బయలునూ అష్తారోతులనూ సేవించారు.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ‘అష్తారోతులు’ బహువచన రూపం. ఇది అష్తోరెత్/అష్తార్తే అనే దేవతకు సంబంధించిన అనేక స్థానిక రూపాలను లేదా ప్రతిమలను సూచించవచ్చు.
    reason: alternative_reading
  - marker: b
    text: లేదా, ‘బయలునూ అష్తారోతులనూ పూజించారు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַזְבוּ
  choice: విడిచిపెట్టి
  rationale: עזב అనే క్రియకు ‘విడిచిపెట్టు, త్యజించు’ అనే అర్థాలు ఉన్నాయి. ‘విడిచిపెట్టి’ అనేది ఆధునిక తెలుగులో సహజంగా ఉండి, సందర్భంలోని నిబంధనా అవిశ్వాసాన్ని తగినంత స్పష్టంగా తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో లిప్యంతరీకరించాం.
- source_word: וַיַּעַבְדוּ
  choice: సేవించారు
  rationale: עבד అనే క్రియ సేవ చేయడాన్నీ, దేవతారాధన సందర్భంలో పూజించడాన్నీ సూచించగలదు. ‘సేవించారు’ మూలపదపు విస్తృత భావాన్ని కాపాడుతుంది; ఇక్కడ మతపరమైన భావం కర్మల వల్ల స్పష్టమవుతుంది.
- source_word: לַבַּעַל
  choice: బయలును
  rationale: నిర్దిష్ట ఉపపదం ఉన్నప్పటికీ, తెలుగులో దేవతా నామాన్ని సహజంగా ‘బయలు’ అని ఇచ్చాం.
- source_word: וְלָעַשְׁתָּרוֹת
  choice: అష్తారోతులను
  rationale: עַשְׁתָּרוֹת రూపం వ్యాకరణపరంగా బహువచనం. అందువల్ల దానిని ఏకవచన దేవతా నామంగా మార్చకుండా తెలుగులో బహువచన కర్మరూపంగా ఇచ్చాం.
theological_decisions:
- issue: עשתרות అనే బహువచన రూపం
  choice: అష్తారోతులను
  alternative: అష్తోరెతును / అష్తార్తేను
  rationale: మూలంలోని బహువచనాన్ని ఏక దేవతగా నిశ్చయించి చదవకుండా అలాగే నిలిపాం. ఇది ఆ దేవతకు సంబంధించిన అనేక స్థానిక రూపాలు, ప్రతిమలు, లేదా దేవతావర్గాన్ని సూచించవచ్చు.
- issue: అన్యదేవతల సందర్భంలో עבד యొక్క ఆరాధనా భావం
  choice: సేవించారు
  alternative: పూజించారు
  rationale: మూలక్రియలోని విస్తృత ‘సేవించు’ భావాన్ని ప్రధాన పాఠ్యంలో ఉంచి, ‘పూజించారు’ అనే సందర్భానుగుణ ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సరళమైనప్పటికీ గౌరవప్రదమైన శైలి. దైవనామాన్ని ‘యెహోవా’గా ఉంచి, עשתרות యొక్క నిజమైన బహువచన అస్పష్టతను ప్రధాన పాఠ్యంలో కాపాడాం.
