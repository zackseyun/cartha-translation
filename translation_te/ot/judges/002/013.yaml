revisions:
- from: వారు యెహోవాను విడిచిపెట్టి, బయలును అష్తారోతులను[a] సేవించారు.[b]
  to: వారు యహ్వేను విడిచిపెట్టి, బయలునూ అష్తారోతులనూ సేవించారు.[a][b]
  rationale: The revision preserves the Hebrew sequence and cultic sense of ‘served,’ explicitly represents the conjunction between Baal and the plural Ashtaroth, and aligns the rendering of יהוה with the supplied POB audit trail. The footnote continues to preserve, rather than resolve, the referential ambiguity of the Hebrew plural.
