  text: Then Joshua sent the people away[a], and the sons of Israel went, each man to his inheritance, to take possession of the land.
translation:
  language: te
  text: అప్పుడు యెహోషువ ప్రజలను పంపివేశాడు; ఇశ్రాయేలు కుమారుల్లో ప్రతివాడూ దేశాన్ని స్వాధీనం చేసుకోవడానికి తన వారసత్వ భాగానికి వెళ్లాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְשַׁלַּח
  choice: పంపివేశాడు
  rationale: ఈ సందర్భంలో שׁלח ప్రజలను వెళ్లనివ్వడం లేదా పంపివేయడం అనే భావాన్ని ఇస్తుంది. ‘పంపివేశాడు’ కారణార్థక భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: הָעָם
  choice: ప్రజలను
  rationale: హీబ్రూ పాఠంలో ఉన్న ‘ప్రజలు’ అనే సాధారణ నామాన్నే, ‘ఇశ్రాయేలు ప్రజలు’ అని విస్తరించకుండా ఉంచింది.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: హీబ్రూ పదబంధంలోని పుంలింగ రూపాన్ని, దాని ఒడంబడిక సంబంధిత సంప్రదాయ భావాన్ని నిలుపుతుంది; సహజ ప్రత్యామ్నాయం పాదసూచికలో ఇచ్చబడింది.
- source_word: אִישׁ
  choice: ఒక్కొక్క పురుషుడు
  rationale: אִישׁ ఇక్కడ వ్యక్తిగత పంపిణీని సూచిస్తుంది. ఈ అనువాదం ‘ఒక్కొక్కరు’ అనే భావంతో పాటు మూలంలోని పుంలింగ ఏకవచనాన్నీ నిలుపుతుంది.
- source_word: לְנַחֲלָתוֹ
  choice: తన స్వాస్థ్యానికి
  rationale: נחלה ఇక్కడ ప్రతి వ్యక్తి లేదా వంశానికి కేటాయించబడిన వారసత్వ భూభాగాన్ని సూచిస్తుంది. ‘స్వాస్థ్యం’ ఆ భూభాగపు వారసత్వ భావాన్ని సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: לָרֶשֶׁת
  choice: స్వాధీనం చేసుకోవడానికి
  rationale: ירשׁ యొక్క క్రియారూపం ఇక్కడ దేశాన్ని ఆక్రమించి అధీనంలోకి తెచ్చుకునే ఉద్దేశాన్ని తెలియజేస్తుంది.
- source_word: הָאָרֶץ
  choice: దేశాన్ని
  rationale: ఈ స్థిరనివాస సందర్భంలో אֶרֶץ సాధారణ భూమిని కాక ఇశ్రాయేలుకు కేటాయించబడిన కనాను దేశాన్ని సూచిస్తుంది.
theological_decisions:
- issue: ఇశ్రాయేలు సమాజానికి పుంలింగ ఒడంబడిక సంబంధిత సంబోధన
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలీయులు
  rationale: మూలంలోని בְנֵי అనే పుంలింగ బహువచన రూపాన్ని ప్రధాన పాఠంలో నిలిపి, అది సమష్టిగా ఇశ్రాయేలు ప్రజలను సూచిస్తుందనే సహజ రూపాన్ని పాదసూచికలో అందించింది.
- issue: వాగ్దాన దేశపు కేటాయింపు పదజాలం
  choice: స్వాస్థ్యం
  alternative: కేటాయించబడిన భాగం
  rationale: ‘స్వాస్థ్యం’ భూమిని కేవలం ఆస్తిగా కాక, వారసత్వంగా పొందిన కేటాయింపుగా సూచించే ఒడంబడిక సంబంధిత ప్రతిధ్వనిని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. ‘ఇశ్రాయేలు కుమారులు’ మరియు ‘ఒక్కొక్క పురుషుడు’ మూలంలోని పుంలింగ రూపాలను ఉద్దేశపూర్వకంగా నిలుపుతాయి; ‘స్వాస్థ్యం’ భూకేటాయింపులోని వారసత్వ భావాన్ని కాపాడుతుంది.
