  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּעַבְד֤וּ הָ/עָם֙ אֶת יְהוָ֔ה כֹּ֖ל יְמֵ֣י יְהוֹשֻׁ֑עַ וְ/כֹ֣ל יְמֵ֣י הַ/זְּקֵנִ֗ים אֲשֶׁ֨ר הֶאֱרִ֤יכוּ יָמִים֙ אַחֲרֵ֣י יְהוֹשׁ֔וּעַ אֲשֶׁ֣ר רָא֗וּ אֵ֣ת כָּל מַעֲשֵׂ֤ה יְהוָה֙ הַ/גָּד֔וֹל אֲשֶׁ֥ר עָשָׂ֖ה לְ/יִשְׂרָאֵֽל־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/007.yaml
  text: And the people served Yahweh all the days of Joshua[a], and all the days of the elders who lived on after Joshua, who had seen all the great work of Yahweh that he had done for Israel.
translation:
  language: te
  text: యెహోషువ జీవించిన రోజులన్నిటిలోనూ, యెహోషువ తరువాత కూడా జీవించిన పెద్దల రోజులన్నిటిలోనూ ప్రజలు యహ్వేను సేవించారు. ఆ పెద్దలు యహ్వే ఇశ్రాయేలు కోసం చేసిన గొప్ప కార్యమంతటినీ[a] చూసినవారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పదాన్ని “గొప్ప పని” లేదా “గొప్ప క్రియ” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַבְדוּ
  choice: సేవించారు
  rationale: עבד అనే క్రియ యహ్వే పట్ల నిబంధనాధారిత విధేయతను సూచిస్తుంది; ఇందులో ఆరాధన ఉన్నప్పటికీ భావం దానికంటే విస్తృతమైనది.
- source_word: הָעָם
  choice: ప్రజలు
  rationale: ఇక్కడ עם ఇశ్రాయేలు సమాజాన్ని సమష్టిగా సూచిస్తుంది; ఆధునిక తెలుగులో ‘ప్రజలు’ సహజమైన రూపం.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పునర్నిర్మిత ఉచ్చారణకు దగ్గరగా తెలుగులో లిప్యంతరీకరించబడింది.
- source_word: כֹּל יְמֵי
  choice: జీవించిన రోజులన్నిటిలోనూ
  rationale: ఈ పదబంధం ఆయా వ్యక్తులు జీవించి ఉన్న పూర్తి కాలాన్ని సూచిస్తుంది; తెలుగులో కాలవ్యాప్తిని స్పష్టంగా తెలియజేస్తుంది.
- source_word: הַזְּקֵנִים
  choice: పెద్దలు
  rationale: ఈ పదం కేవలం వృద్ధులను కాక సమాజంలో గుర్తింపు పొందిన సీనియర్ నాయకులను సూచించగలదు; ‘పెద్దలు’ రెండు భావాలను నిలుపుతుంది.
- source_word: הֶאֱרִיכוּ יָמִים אַחֲרֵי
  choice: తరువాత కూడా జీవించిన
  rationale: అక్షరార్థంగా ‘తరువాత తమ రోజులను పొడిగించుకున్న’ అనే హీబ్రూ నుడికారాన్ని సహజమైన ఆధునిక తెలుగులో తెలిపింది.
- source_word: רָאוּ
  choice: చూసినవారు
  rationale: వారి సేవకు నేపథ్యమైన ప్రత్యక్ష అనుభవాన్ని సంబంధవాచక భావంతో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: כָּל מַעֲשֵׂה ... הַגָּדוֹל
  choice: గొప్ప కార్యమంతటినీ
  rationale: ఏకవచన సమష్టి భావాన్ని నిలుపుతూ, యహ్వే చేసిన కార్యం యొక్క సంపూర్ణతను ‘మంతటినీ’ తెలియజేస్తుంది.
- source_word: עָשָׂה לְיִשְׂרָאֵל
  choice: ఇశ్రాయేలు కోసం చేసిన
  rationale: לְ అనే విభక్తి ఇక్కడ ఇశ్రాయేలు మేలు కోసం జరిగిన కార్యాన్ని సూచిస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది. దానిని బిరుదుగా మార్చకుండా, ‘Yahweh’ ఉచ్చారణకు దగ్గరైన తెలుగు రూపం ఉపయోగించబడింది.
- issue: עבד యొక్క భావపరిధి
  choice: సేవించారు
  alternative: ఆరాధించారు
  rationale: ఈ సందర్భంలో క్రియ ఆరాధనను కలిగి ఉండవచ్చు గాని, యహ్వే పట్ల విస్తృతమైన నిబంధన విధేయతను కూడా సూచిస్తుంది; అందువల్ల ‘సేవించారు’ ఆ విస్తృతిని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా రూపొందించబడింది. హీబ్రూ వాక్యంలోని పునరుక్తిని సాధ్యమైనంతవరకు నిలుపుతూ, రెండవ వాక్యంతో సంబంధవాచక భాగాన్ని స్పష్టంచేయబడింది. పాదసూచిక గుర్తు సంబంధిత ‘గొప్ప కార్యమంతటినీ’ అన్న పదబంధం వద్ద ఉంచబడింది.
