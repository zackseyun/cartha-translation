lexical_decisions:
- source_word: וַיָּמָת
  choice: చనిపోయాడు
  rationale: מות ధాతువు యొక్క Qal wayyiqtol రూపం కథనంలోని తదుపరి సంఘటనను తెలియజేస్తుంది. తెలుగు వాక్యప్రవాహంలో ప్రత్యేకంగా ‘మరియు’ చేర్చకుండానే క్రమం సహజంగా వ్యక్తమవుతుంది.
- source_word: יְהוֹשֻׁעַ
  choice: యెహోషువ
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగు బైబిలు వాడుకలో స్థిరపడిన లిప్యంతరీకరణ.
- source_word: בִּן נוּן
  choice: నూను కుమారుడు
  rationale: ఈ construct chain తండ్రి–కుమార సంబంధాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘నూను కుమారుడు’ సహజమైన రూపం.
- source_word: עֶבֶד יְהוָה
  choice: యెహోవా సేవకుడు
  rationale: עֶבֶד అనే పదం ‘సేవకుడు’ లేదా ‘దాసుడు’ అని అర్థమివ్వగలదు. ఇక్కడ అది యెహోషువకు గౌరవప్రదమైన బిరుదుగా పనిచేస్తున్నందున ‘సేవకుడు’ సందర్భానికి తగినది; ప్రత్యామ్నాయ భావాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన יהוהను ఒక బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగు క్రైస్తవ వాడుకలో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో అందించాం.
- source_word: בֶּן מֵאָה וָעֶשֶׂר שָׁנִים
  choice: నూట పది సంవత్సరాల వయసులో
  rationale: హీబ్రూ వయస్సు ప్రయోగం అక్షరార్థంగా ‘నూట పది సంవత్సరాల కుమారుడు’ అని ఉన్నా, దాని అర్థాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామాన్ని ఎలా అనువదించాలి
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలపాఠం దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది. తెలుగులో దానిని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా వ్యక్తినామంగా నిలిపి, సాధారణ పాఠకులకు విస్తృతంగా పరిచయమైన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం.
- issue: యెహోషువ బిరుదులో עֶבֶד పదాన్ని ఎలా ఇవ్వాలి
  choice: సేవకుడు
  alternative: దాసుడు
  rationale: ఈ సందర్భంలో పదం బానిస స్థితిని ప్రధానంగా చూపడం కంటే, దేవునితో యెహోషువకు ఉన్న గౌరవప్రదమైన సంబంధాన్ని సూచించే బిరుదుగా ఉంది. అందువల్ల ‘సేవకుడు’ ప్రధాన పాఠంలో సహజం; ‘దాసుడు’ అనే నిజమైన పదార్థ ప్రత్యామ్నాయం పాదటిప్పణిలో భద్రపరచబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలిని ఉపయోగించాం. హీబ్రూ వాక్యక్రమాన్ని యాంత్రికంగా అనుసరించకుండా, ‘యెహోవా సేవకుడైన’ అనే విశేషణ నిర్మాణంతో తెలుగు పఠనసౌలభ్యాన్ని కాపాడాం; దైవనామాన్ని వ్యక్తినామంగానే నిలిపాం.
