  text: And Joshua son of Nun[a], the servant of Yahweh, died at the age of one hundred and ten years.
translation:
  language: te
  text: యాహ్వే సేవకుడైన నూను కుమారుడు యెహోషువ నూట పది సంవత్సరాల వయసులో మరణించాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘యాహ్వే దాసుడు’ అని కూడా అనువదించవచ్చు. హీబ్రూ పదానికి ‘సేవకుడు,’ ‘దాసుడు’ అనే రెండు భావాలూ ఉండగలవు; ఇక్కడ అది యెహోషువకు గౌరవప్రదమైన బిరుదుగా వాడబడింది.
