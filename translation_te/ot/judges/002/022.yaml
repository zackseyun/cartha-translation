  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: לְמַ֛עַן נַסּ֥וֹת בָּ֖/ם אֶת יִשְׂרָאֵ֑ל הֲ/שֹׁמְרִ֣ים הֵם֩ אֶת דֶּ֨רֶךְ יְהוָ֜ה לָ/לֶ֣כֶת בָּ֗/ם כַּ/אֲשֶׁ֛ר שָׁמְר֥וּ אֲבוֹתָ֖/ם אִם לֹֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/022.yaml
  text: in order to test Israel by them[a], whether they would keep the way of Yahweh by walking in it, as their fathers kept it, or not.
translation:
  language: te
  text: వారి ద్వారా[a] ఇశ్రాయేలును పరీక్షించడానికి—వారి పితరులు పాటించినట్లే, వారు యాహ్వే మార్గాన్ని పాటిస్తూ దానిలో నడుస్తారో లేదో.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘వారిచేత’ అని కూడా అనువదించవచ్చు. హీబ్రూ సర్వనామం ముందు సందర్భంలో దేశంలో మిగిలి ఉన్న జనాలను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן נַסּוֹת
  choice: పరీక్షించడానికి
  rationale: לְמַעַן ఉద్దేశాన్ని సూచిస్తుంది; נסה ఇక్కడ మిగిలి ఉన్న జనాల ద్వారా ఇశ్రాయేలును పరీక్షించడాన్ని సూచిస్తుంది. తెలుగు వాక్యనిర్మాణంలో రెండింటినీ సహజంగా కలిపింది.
- source_word: בָּם
  choice: వారి ద్వారా
  rationale: సర్వనామం ముందు సందర్భంలోని దేశంలో మిగిలి ఉన్న జనాలను సూచిస్తుంది. సాధనార్థక భావాన్ని ‘వారి ద్వారా’ స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: הֲשֹׁמְרִים הֵם
  choice: వీరు కూడా ... పాటిస్తారో లేదో
  rationale: ప్రశ్నార్థక הֲ మరియు కృదంతం పరీక్ష యొక్క విషయాన్ని—ఇశ్రాయేలు పాటిస్తుందా లేదా అన్నదాన్ని—తెలియజేస్తాయి. ‘వీరు’ ఇశ్రాయేలీయులను సూచిస్తుంది; ‘కూడా’ పితరులతో ఉన్న పోలికను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: דֶּרֶךְ יְהוָה
  choice: యెహోవా మార్గం
  rationale: దేవుడు ఆదేశించిన జీవన విధానాన్ని సూచించే బైబిలీయ రూపకాన్ని అలాగే నిలుపుతుంది; יהוה అనే వ్యక్తిగత నామాన్ని ‘యెహోవా’గా లిప్యంతరీకరించింది.
- source_word: לָלֶכֶת בָּם
  choice: దానిలో నడుస్తూ
  rationale: ‘మార్గం’ను అనుసరించి సర్వనామాన్ని తెలుగులో ఏకవచనంగా ఇచ్చింది. ‘నడుచుట’ అనే మూల రూపకాన్ని కాపాడుతూ, మార్గాన్ని పాటించడం అంటే ఏమిటో వివరిస్తుంది.
- source_word: כַּאֲשֶׁר שָׁמְרוּ אֲבוֹתָם
  choice: తమ పితరులు ... పాటించినట్లే
  rationale: כַּאֲשֶׁר లోని పోలికను ‘అట్లే’ తెలియజేస్తుంది. אֲבוֹתָם లోని పురుషలింగ వంశపారంపర్య పదాన్ని ‘తమ పితరులు’గా కాపాడింది; שמר పునరావృతాన్ని ‘పాటించు’తో నిలిపింది.
- source_word: אִם לֹא
  choice: లేదో
  rationale: ఈ ప్రశ్నార్థక నిర్మాణంలో షరతు భావం కాకుండా ‘అవునా కాదా’ అనే పరీక్షను సూచిస్తుంది; తెలుగులో ‘-తారో లేదో’ సహజమైన సమానార్థకం.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో బిరుదు కాకుండా టెట్రాగ్రామటన్ అనే వ్యక్తిగత దైవనామం ఉంది. అందువల్ల దాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించదగిన ‘యెహోవా’ రూపంలో ఇచ్చింది.
- issue: אֲבוֹתָם అనే లింగసూచక పూర్వీకుల పదం
  choice: తమ పితరులు
  alternative: తమ పూర్వీకులు
  rationale: హీబ్రూ పదం పురుషలింగ బహువచనంలో ఉండి ఇశ్రాయేలు పితరులను సూచిస్తుంది. అందుచేత మూలంలోని లింగసూచనను ‘పితరులు’గా నిలిపింది.
- issue: పరీక్ష ఉద్దేశంలో జ్ఞానార్థక భావం
  choice: తెలుసుకోవడానికి
  alternative: ‘తెలుసుకోవడానికి’ అనే పదాలు లేకుండా నేరుగా ‘పాటిస్తారో లేదో’
  rationale: హీబ్రూలో ‘తెలుసుకోవడానికి’ అనే ప్రత్యేక క్రియ లేదు; అయితే పరీక్ష యొక్క విషయాన్ని తెలిపే పరోక్ష ప్రశ్నను తెలుగులో సహజంగా అనుసంధానించడానికి ఈ పదాన్ని ఉపయోగించింది. ఇది దేవుని జ్ఞాన స్వభావంపై అదనపు సిద్ధాంత నిర్ణయం చేయకుండా పరీక్ష లక్ష్యాన్ని మాత్రమే తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘మార్గం’, ‘దానిలో నడవడం’ అనే మూల రూపకాలు నిలుపబడ్డాయి. వచనం ముందున్న వాక్యానికి ఉద్దేశార్థక కొనసాగింపుగా ఉన్నందున తెలుగు ముసాయిదా కూడా ఆ అనుసంధాన స్వభావాన్ని కాపాడుతుంది.
