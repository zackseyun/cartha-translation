base_translation:
  language: en
  yaml_path: translation/ot/judges/002/015.yaml
  text: Wherever they went out[a], the hand of Yahweh was against them for harm, just as Yahweh had spoken and just as Yahweh had sworn to them[b], and they were greatly distressed.
translation:
  language: te
  text: వారు బయలుదేరిన ప్రతిసారీ[a], యెహోవా చెప్పినట్లుగాను, యెహోవా వారికి ప్రమాణం చేసినట్లుగాను, యెహోవా హస్తం వారికి విరోధంగా హాని కలిగించేది[b]. వారు ఎంతో సంకటపడ్డారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వారు ఎక్కడికి బయలుదేరినా’; సందర్భంలో యుద్ధానికి లేదా సైనిక దండయాత్రకు బయలుదేరడం అనే భావం ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘హాని’ అంటే ఇక్కడ కీడు లేదా విపత్తు; నైతిక దుష్టత్వం అని తప్పనిసరిగా అర్థం కాదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּכֹל אֲשֶׁר יָצְאוּ
  choice: వారు బయలుదేరిన ప్రతిసారీ
  rationale: ఈ హీబ్రూ పదబంధం వారి ప్రతి బయలుదేరడాన్ని లేదా యత్నాన్ని సూచిస్తుంది. సందర్భంలో యుద్ధానికి బయలుదేరడం భావించవచ్చుగానీ, మూలంలో లేని సైనిక ప్రత్యేకతను ప్రధాన పాఠంలో చేర్చకుండా విస్తృత భావాన్ని నిలిపింది.
- source_word: יַד יְהוָה
  choice: యెహోవా హస్తం
  rationale: దేవుని క్రియాశీల శక్తి లేదా జోక్యాన్ని సూచించే హీబ్రూ రూపకాన్ని నిలిపేందుకు ‘హస్తం’ అని అనువదించబడింది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవ నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో సాధారణంగా గుర్తించదగిన ‘యెహోవా’ రూపంలో ఇచ్చింది.
- source_word: הָיְתָה בָם לְרָעָה
  choice: వారికి కీడు కలిగించేలా వారికి విరోధంగా ఉండేది
  rationale: ఈ పదబంధం దేవుని ప్రతికూల చర్య వల్ల కలిగే హాని లేదా విపత్తును సూచిస్తుంది. ‘కీడు’ ఇక్కడ నైతిక దుష్టత్వం అని తప్పనిసరిగా అర్థం కాకుండా, కలిగిన హానిని వ్యక్తపరుస్తుంది; ‘విరోధంగా’ సందర్భంలోని సంబంధార్థాన్ని స్పష్టం చేస్తుంది.
- source_word: כַּאֲשֶׁר דִּבֶּר יְהוָה
  choice: యెహోవా వారితో చెప్పినట్లుగాను
  rationale: ముందుగా పలికిన దైవ హెచ్చరికను వెనుకకు సూచించే భావాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: וְכַאֲשֶׁר נִשְׁבַּע יְהוָה לָהֶם
  choice: వారికి ప్రమాణం చేసినట్లుగాను
  rationale: נשבע + ל నిర్మాణం వారికి ఉద్దేశించి చేసిన ప్రమాణాన్ని సూచిస్తుంది; మూలంలో ప్రమాణ విషయాన్ని మళ్లీ చెప్పనందున అనువాదమూ దానిని చేర్చదు.
- source_word: וַיֵּצֶר לָהֶם מְאֹד
  choice: దాంతో వారు తీవ్రమైన ఇబ్బందిలో పడ్డారు
  rationale: వారు అనుభవించిన గొప్ప సంకటాన్ని సహజ ఆధునిక తెలుగులో తెలియజేస్తుంది; ‘తీవ్రమైన’ అనే పదం מְאֹד యొక్క బలాన్ని నిలుపుతుంది.
theological_decisions:
- issue: నిబంధనాత్మక తీర్పులో దేవుని ప్రతికూల చర్య
  choice: యెహోవా హస్తం వారికి కీడు కలిగించేలా వారికి విరోధంగా ఉండేది
  alternative: యెహోవా హస్తం వారికి విపత్తు కలిగించింది
  rationale: వాక్యం యెహోవాను తీర్పులో క్రియాశీలుడిగా చూపుతుంది. ‘కీడు కలిగించేలా’ అనే రూపం רָעָה యొక్క హాని/విపత్తు భావాన్ని నిలుపుతూ, దేవుడు నైతిక దుష్టత్వం చేశాడనే అదనపు వాదనను చేర్చదు; అదే సమయంలో దైవ తీర్పు యొక్క కఠినతను తగ్గించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘హస్తం’ అనే బైబిలీయ రూపకం నిలుపబడింది; మిగతా వాక్య నిర్మాణం సహజ తెలుగు ప్రవాహానికి అనుగుణంగా ఉంది. ప్రధాన పాఠంలోని [a], [b] సూచికలు సంబంధిత పాదటిప్పణులతో సరిపోతాయి.
