    issue: The divine name is rendered ‘యెహోవా’ rather than ‘యాహ్వే.’
    rationale: The supplied English POB audit trail explicitly chooses ‘Yahweh’ for יְהוָה. ‘యాహ్వే’ is the corresponding Telugu transliteration and preserves the specified rendering decision.
  - severity: low
    issue: ‘ఇశ్రాయేలు కుమారులు’ is overly literal in modern Telugu.
    rationale: Although it reflects the Hebrew construct literally, it may imply only male Israelites. ‘ఇశ్రాయేలు ప్రజలు’ conveys the collective referent naturally, while a footnote preserves the literal expression.
