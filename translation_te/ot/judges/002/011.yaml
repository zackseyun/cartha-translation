source:
  edition: WLC
  text: וַ/יַּעֲשׂ֧וּ בְנֵֽי יִשְׂרָאֵ֛ל אֶת הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה וַ/יַּעַבְד֖וּ אֶת הַ/בְּעָלִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/011.yaml
  text: And the sons of Israel did what was evil in the sight of Yahweh[b][a], and they served the Baals.
translation:
  language: te
  text: ఇశ్రాయేలు ప్రజలు[a] యాహ్వే దృష్టిలో చెడ్డదాన్ని చేసి, బయలులను సేవించారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఇశ్రాయేలీయులు.’ అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులు.’
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘ఆరాధించారు.’ హెబ్రీ క్రియ ఆరాధనలో చేసే సేవను కూడా సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: చేసి
  rationale: עשה అనే సాధారణ క్రియకు ‘చేయు’ సహజమైన సమానార్థకం; తరువాతి క్రియతో హెబ్రీ కథన క్రమాన్ని తెలుగులో సాఫీగా కలుపుతుంది.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: మూలంలోని కుటుంబసంబంధ రూపకాన్ని యథాతథంగా నిలుపుతుంది; సహజమైన ప్రత్యామ్నాయం ‘ఇశ్రాయేలీయులు’ అని పాదటిప్పణిలో ఇచ్చాం.
- source_word: אֶת הָרַע
  choice: చెడ్డదాన్ని
  rationale: ‘ఆ చెడును చేయడం’ అనే హెబ్రీ నుడికారాన్ని అర్థవంతమైన, సంక్షిప్త ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בְעֵינֵי יְהוָה
  choice: యెహోవా దృష్టిలో
  rationale: దేవుని మదింపు అనే భావాన్ని సహజ తెలుగులో తెలియజేస్తూ, ‘కళ్లలో’ అనే మూల రూపకపు భావాన్ని కాపాడుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: చతురక్షర దైవనామాన్ని బిరుదుతో మార్చకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో అందిస్తుంది.
- source_word: וַיַּעַבְדוּ
  choice: సేవించారు
  rationale: עבד క్రియలోని సేవ మరియు ఆరాధన అనే అర్థవిస్తృతిని కాపాడుతుంది; విగ్రహారాధన సందర్భంలో ‘ఆరాధించారు’ కూడా సాధ్యమే.
- source_word: הַבְּעָלִים
  choice: బయలులను
  rationale: హెబ్రీ బహువచనాన్ని నిలుపుతూ, వివిధ స్థానిక బయలు దేవతారూపాలను సూచిస్తుంది.
theological_decisions:
- issue: యెహోవా అనే నిబంధన నామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: వ్యక్తిగత దైవనామాన్ని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా నిలుపుతుంది. తెలుగులో ‘యెహోవా’ సుపరిచిత రూపం; ‘యాహ్వే’ మూల ఉచ్చారణకు దగ్గరగా భావించే ప్రత్యామ్నాయం.
- issue: ఈ సందర్భంలో עבדను ‘సేవించారు’గా లేదా ‘ఆరాధించారు’గా అనువదించడం
  choice: సేవించారు
  alternative: ఆరాధించారు
  rationale: ‘సేవించారు’ మూలక్రియ యొక్క విస్తృత భావాన్ని, యెహోవాను సేవించడానికి విరుద్ధంగా ఇతర దేవతలను సేవించారనే నిబంధనాత్మక ఉద్వేగాన్ని నిలుపుతుంది; సందర్భం ఆరాధనను సూచిస్తున్నందున ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో పేర్కొన్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన శైలి. మూలంలోని ‘ఇశ్రాయేలు కుమారులు,’ ‘సేవించారు,’ ‘బయలులు’ అనే రూపాలను నిలుపుతూ అవసరమైన సహజ ప్రత్యామ్నాయాలను పాదటిప్పణుల్లో ఇచ్చాం.
