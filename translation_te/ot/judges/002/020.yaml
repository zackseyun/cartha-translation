  text: וַ/יִּֽחַר אַ֥ף יְהוָ֖ה בְּ/יִשְׂרָאֵ֑ל וַ/יֹּ֗אמֶר יַעַן֩ אֲשֶׁ֨ר עָבְר֜וּ הַ/גּ֣וֹי הַ/זֶּ֗ה אֶת בְּרִיתִ/י֙ אֲשֶׁ֣ר צִוִּ֣יתִי אֶת אֲבוֹתָ֔/ם וְ/לֹ֥א שָׁמְע֖וּ לְ/קוֹלִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/020.yaml
  text: So the anger of Yahweh burned against Israel[a], and he said, “Because this nation has transgressed my covenant that I commanded their fathers[b], and they have not listened to my voice,”
translation:
  language: te
  text: 'అప్పుడు ఇశ్రాయేలుమీద యహ్వే కోపం రగులుకుంది. ఆయన ఇలా అన్నాడు: “ఈ జనము నేను వారి పితరులకు ఆజ్ఞాపించిన నా నిబంధనను ఉల్లంఘించి[a], వారు నా మాట వినలేదు[b] కాబట్టి—”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నా నిబంధనను భంగపరచి.” హీబ్రూ క్రియకు అక్షరార్థంగా “దాటి వెళ్లడం” అని అర్థం; నిబంధన సందర్భంలో అది అతిక్రమించడం లేదా ఉల్లంఘించడం అనే భావాన్ని ఇస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “నా మాటకు లోబడలేదు.” “నా స్వరం వినడం” అనే హీబ్రూ నుడికారంలో విధేయత భావం కూడా ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: కోపం రగులుకుంది
  rationale: హీబ్రూ నుడికారం కోపాన్ని మండే అగ్నిగా చిత్రిస్తుంది; ‘రగులుకుంది’ ఆ రూపకాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవనామమైన టెట్రాగ్రామటన్‌ను బిరుదుతో భర్తీ చేయకుండా వ్యక్తిగత నామంగా లిప్యంతరీకరించాం.
- source_word: בְּיִשְׂרָאֵל
  choice: ఇశ్రాయేలుమీద
  rationale: కోపాన్ని సూచించే క్రియతో వచ్చిన בְּ కోపానికి గురైనవారిని సూచిస్తుంది; తెలుగులో ‘మీద’ సహజంగా ఆ భావాన్ని వ్యక్తపరుస్తుంది.
- source_word: יַעַן אֲשֶׁר
  choice: కాబట్టి
  rationale: దేవుని ప్రకటనకు కారణాన్ని సూచిస్తుంది. హీబ్రూ వాక్యం తరువాతి వచనంలో కొనసాగుతున్నందున తెలుగులో కారణవాక్యాన్ని చివర ఉంచడం సహజం.
- source_word: עָבְרוּ
  choice: ఉల్లంఘించి
  rationale: మూలార్థం ‘దాటి వెళ్లడం’; నిబంధన సందర్భంలో హద్దు మీరడం లేదా నిబంధనను అతిక్రమించడం అనే భావం వస్తుంది.
- source_word: הַגּוֹי הַזֶּה
  choice: ఈ జనము
  rationale: גוי ఇక్కడ ఇశ్రాయేలును ఒక సమష్టి జనంగా సూచిస్తుంది. ‘ఈ జనము’ మూలంలోని గుర్తింపుతో కూడిన, కొంత న్యాయవిచారణాత్మకమైన సంబోధనను నిలుపుతుంది.
- source_word: בְּרִיתִי
  choice: నా నిబంధనను
  rationale: దేవుడు ఇశ్రాయేలుతో ఏర్పరచిన బంధపూర్వక ఒడంబడికకు తెలుగులో స్థిరమైన బైబిలు పదం ‘నిబంధన’.
- source_word: צִוִּיתִי אֶת אֲבוֹתָם
  choice: నేను వారి పితరులకు ఆజ్ఞాపించిన
  rationale: హీబ్రూ నిర్మాణం సంక్షిప్తంగా ఉన్నా, నిబంధననే పితరులకు ఆజ్ఞాపించాడనే సంబంధాన్ని ఈ రూపం స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: שָׁמְעוּ לְקוֹלִי
  choice: నా మాట వినలేదు
  rationale: మూల నుడికారం అక్షరార్థంగా ‘నా స్వరం వినలేదు’; సందర్భంలో వినడం విధేయతను కూడా కలిగివుంది. ‘నా మాట వినలేదు’ శ్రవణ రూపకాన్నీ విధేయత భావాన్నీ సహజంగా కలుపుతుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమే ఉంది. దానిని బిరుదుగా మార్చకుండా ‘యహ్వే’గా నిలుపడం మూలానికి దగ్గరగా ఉంటుంది.
- issue: నిబంధన ఉల్లంఘనకు వాడిన עבר భావం
  choice: నిబంధనను ఉల్లంఘించి
  alternative: నిబంధనను భంగపరచి
  rationale: ఇది కేవలం సాధారణ అవిధేయత కాదు; నిబంధన విధించిన హద్దును అతిక్రమించడం. ‘ఉల్లంఘించి’ ఆ న్యాయ-నిబంధన భావాన్ని నిలుపుతుంది.
- issue: שמע בקול లో వినడం మరియు విధేయత మధ్య ఉద్వేగం
  choice: నా మాట వినలేదు
  alternative: నా మాటకు లోబడలేదు
  rationale: ‘వినడం’ అనే మూల రూపకాన్ని నిలుపుతూ దానిలో అంతర్లీనమైన విధేయత భావాన్ని పాదటిప్పణిలో తెలియజేశాం; తద్వారా భావాన్ని ఒక్క అర్థానికి పరిమితం చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కానీ సులభంగా అర్థమయ్యే శైలి వాడబడింది. ‘పితరులు,’ ‘నిబంధన’ వంటి స్థిరమైన బైబిలు పదజాలాన్ని ఉంచి, వాక్య నిర్మాణాన్ని సహజ తెలుగు క్రమానికి అనుగుణంగా మార్చాం. మూలవాక్యం 21వ వచనంలో కొనసాగుతుందని సూచించేందుకు చివర దీర్ఘ విరామచిహ్నం ఉంచాం.
