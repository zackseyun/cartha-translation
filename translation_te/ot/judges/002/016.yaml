id: JDG.2.16
reference: Judges 2:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּ֥קֶם יְהוָ֖ה שֹֽׁפְטִ֑ים וַ/יּ֣וֹשִׁיע֔וּ/ם מִ/יַּ֖ד שֹׁסֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/016.yaml
  text: Then Yahweh raised up judges[a], and they saved them from the hand of those who plundered them.
translation:
  language: te
  text: అప్పుడు యాహ్వే న్యాయాధిపతులను లేవనెత్తాడు; వారు ఇశ్రాయేలీయులను వారి దోపిడీదారుల చేతిలోనుండి రక్షించారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “విడిపించారు.”
    reason: ישע క్రియకు ఈ చారిత్రక సందర్భంలో ‘రక్షించారు,’ ‘విడిపించారు’ అనే రెండు సహజమైన తెలుగు భావవ్యక్తీకరణలు సాధ్యమైనందున ప్రత్యామ్నాయాన్ని నిలుపుతుంది.
lexical_decisions:
- source_word: וַיָּקֶם
  choice: లేపాడు
  rationale: קום హిఫీల్ రూపం నాయకులను ఉనికిలోకి తెచ్చి నియమించడాన్ని సూచిస్తుంది. ‘లేపాడు’ దేవుని చొరవను, చారిత్రక కార్యాన్ని నిలుపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగులో దాని ఉచ్చారణకు సమీపమైన రూపంలో అందించాం.
- source_word: שֹׁפְטִים
  choice: న్యాయాధిపతులను
  rationale: ఈ వ్యక్తుల కార్యం కేవలం న్యాయవిచారణకే పరిమితం కాకపోయినా, గ్రంథంలోని ప్రధాన పదప్రయోగాన్ని నిలుపుతూ ‘న్యాయాధిపతులు’ అని అనువదించాం; వారి విమోచక కార్యం తరువాతి క్రియలో వ్యక్తమవుతుంది.
- source_word: וַיּוֹשִׁיעוּם
  choice: వారు ఇశ్రాయేలీయులను రక్షించారు
  rationale: ישע ఇక్కడ ప్రమాదం లేదా శత్రువుల ఆధీనంనుండి కాపాడటం, విడిపించటం అనే అర్థాన్ని ఇస్తుంది. తెలుగు వాక్యంలో సర్వనామాల అస్పష్టతను నివారించేందుకు సందర్భంలో స్పష్టమైన ‘ఇశ్రాయేలీయులను’ వాడాం.
- source_word: מִיַּד
  choice: చేతిలోనుండి
  rationale: అధికారం లేదా అదుపును సూచించే హీబ్రూ రూపకాన్ని తెలుగులో సహజంగా అర్థమయ్యే విధంగా నిలుపుతుంది.
- source_word: שֹׁסֵיהֶם
  choice: వారి దోపిడీదారుల
  rationale: ఈ పదం హింసాత్మకంగా కొల్లగొట్టేవారిని సూచిస్తుంది. ‘దోపిడీదారులు’ ఆ ప్రత్యేక భావాన్ని ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామాన్ని ఎలా అందించాలి
  choice: యాహ్వే
  alternative: యెహోవా లేదా ప్రభువు
  rationale: మూలపాఠం దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది. ‘యాహ్వే’ వ్యక్తిగత నామాన్ని బిరుదుగా మార్చకుండా నిలుపుతుంది.
- issue: שֹׁפְטִים పదంలో పదవి లేదా విమోచక కార్యం—దేనిని ముందుకు తేవాలి
  choice: ప్రధాన పాఠంలో ‘న్యాయాధిపతులు’ అని ఉంచి, వారి రక్షక కార్యాన్ని తరువాతి క్రియతో తెలియజేయడం
  alternative: ‘విమోచకులు’ అని అనువదించడం
  rationale: హీబ్రూ పాఠం వారిని న్యాయాధిపతులని పిలిచి, వారు ప్రజలను రక్షించారని చెబుతుంది. పదవినీ కార్యాన్నీ రెండింటినీ నిలుపడం వ్యాఖ్యానాత్మక సంకుచితతను నివారిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే, గౌరవప్రదమైన శైలి. హీబ్రూ ‘చేతి’ రూపకాన్ని నిలిపి, వరుస సర్వనామాల వల్ల కలిగే అయోమయాన్ని నివారించేందుకు సందర్భంలోని ఇశ్రాయేలు ప్రజలను స్పష్టంగా పేర్కొన్నాం.
