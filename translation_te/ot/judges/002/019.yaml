  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הָיָ֣ה בְּ/מ֣וֹת הַ/שּׁוֹפֵ֗ט יָשֻׁ֨בוּ֙ וְ/הִשְׁחִ֣יתוּ מֵֽ/אֲבוֹתָ֔/ם לָ/לֶ֗כֶת אַֽחֲרֵי֙ אֱלֹהִ֣ים אֲחֵרִ֔ים לְ/עָבְדָ֖/ם וּ/לְ/הִשְׁתַּחֲוֺ֣ת לָ/הֶ֑ם לֹ֤א הִפִּ֨ילוּ֙ מִ/מַּ֣עַלְלֵי/הֶ֔ם וּ/מִ/דַּרְכָּ֖/ם הַ/קָּשָֽׁה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/019.yaml
  text: And when the judge died[a], they turned back and acted more corruptly than their fathers, going after other gods to serve them and to bow down to them. They did not drop any of their deeds or their stubborn way.
translation:
  language: te
  text: న్యాయాధిపతి చనిపోయినప్పుడు, వారు మళ్లీ వెనుదిరిగి తమ పితరులకంటే మరింత భ్రష్టంగా ప్రవర్తించారు. ఇతర దేవుళ్లను అనుసరించి, వారిని సేవించి వారికి సాగిలపడ్డారు. వారు తమ క్రియలలో దేనినీ, తమ మొండి మార్గాన్నీ విడిచిపెట్టలేదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారు తమ క్రియల నుండి గానీ, తమ మొండి మార్గం నుండి గానీ మానుకోలేదు.” హెబ్రీలో ‘విడిచిపెట్టలేదు’ అనే భావం అక్షరార్థంగా వాటిని ‘పడనివ్వలేదు’ అనే చిత్రంతో చెప్పబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה בְּמוֹת הַשּׁוֹפֵט
  choice: న్యాయాధిపతి చనిపోయినప్పుడు
  rationale: హెబ్రీ కాలసూచక కథన సూత్రాన్ని సహజమైన తెలుగు ఉపవాక్యంగా ఇచ్చి, న్యాయాధిపతులు గ్రంథానికి ప్రత్యేకమైన שֹׁפֵט పదాన్ని నిలిపింది.
- source_word: יָשֻׁבוּ וְהִשְׁחִיתוּ מֵאֲבוֹתָם
  choice: వారు మళ్లీ వెనుదిరిగి తమ పితరులకంటే మరింత భ్రష్టంగా ప్రవర్తించారు
  rationale: שׁוּב సూచించే పూర్వపు దుష్ప్రవర్తనకు తిరిగిపోవడాన్ని, מן సూచించే తులనాత్మక భావాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: לָלֶכֶת אַחֲרֵי אֱלֹהִים אֲחֵרִים
  choice: ఇతర దేవుళ్లను అనుసరించి
  rationale: దేవునికి బదులుగా ఇతర దేవతల పట్ల విధేయతను సూచించే ‘వెనుక వెళ్లడం’ అనే హెబ్రీ రూపకాన్ని సహజమైన తెలుగులో నిలిపింది.
- source_word: לְעָבְדָם וּלְהִשְׁתַּחֲוֹת לָהֶם
  choice: వాటిని సేవిస్తూ, వాటికి సాగిలపడ్డారు
  rationale: עבד లోని సేవ భావాన్నీ, השתחוה లోని శరీరంతో వంగి ఆరాధించే ప్రత్యేక భావాన్నీ వేర్వేరుగా నిలిపింది.
- source_word: לֹא הִפִּילוּ מִמַּעַלְלֵיהֶם
  choice: వారు తమ పనుల్లో దేనినీ ... వదులుకోలేదు
  rationale: נפל హిఫీల్ రూపంలోని ‘జారవిడచడం/వదలడం’ చిత్రాన్ని సహజమైన తెలుగు నిషేధ వాక్యంగా తెలియజేస్తుంది; ‘దేనినీ’ అనేది హెబ్రీ నిషేధ ప్రయోగ భావాన్ని స్పష్టం చేస్తుంది.
- source_word: וּמִדַּרְכָּם הַקָּשָׁה
  choice: తమ మొండి మార్గాన్నీ
  rationale: דֶּרֶךְ ను జీవన ప్రవర్తనకు రూపకంగా ‘మార్గం’ అని ఉంచి, קָשֶׁה లోని నైతిక కాఠిన్యాన్ని ‘మొండి’ అని సహజంగా వ్యక్తం చేసింది.
theological_decisions:
- issue: אֱלֹהִים אֲחֵרִים అనే పదబంధం
  choice: ఇతర దేవుళ్లు
  alternative: అన్య దేవతలు
  rationale: యెహోవాకు బదులుగా ఇతర దేవతలను అనుసరించడమే వచనంలోని నిబంధనాత్మక వ్యత్యాసం; ‘అన్య’ వల్ల కలగగల జాతిపరమైన అదనపు భావాన్ని చేర్చకుండా మూలంలోని ‘ఇతర’ భావాన్ని నిలిపింది.
- issue: השׁתחוה లోని ఆరాధనా చర్య
  choice: సాగిలపడ్డారు
  alternative: ఆరాధించారు
  rationale: సాధారణ ఆరాధన భావంతో పరిమితం చేయకుండా, మూలంలోని వంగి నమస్కరించే శారీరక మరియు ఆరాధనా భావాలు రెండింటినీ నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కథన శైలి వాడబడింది. ‘న్యాయాధిపతి,’ ‘పితరులు,’ ‘సాగిలపడడం’ వంటి బైబిలు సందర్భానికి తగిన పదాలను ఉంచుతూ, వాక్య నిర్మాణాన్ని సాధారణ పాఠకులకు స్పష్టంగా తీర్చిదిద్దాం.
