  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. భౌగోళిక పదబంధాలు సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా అనువదించబడ్డాయి; స్థలనామాలు మూల హీబ్రూ రూపాలకు దగ్గరగా లిప్యంతరీకరించబడ్డాయి.
