source:
  edition: WLC
  text: וַ/יִּקְבְּר֤וּ אוֹת/וֹ֙ בִּ/גְב֣וּל נַחֲלָת֔/וֹ בְּ/תִמְנַת חֶ֖רֶס בְּ/הַ֣ר אֶפְרָ֑יִם מִ/צְּפ֖וֹן לְ/הַר גָּֽעַשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/009.yaml
  text: And they buried him within the territory of his inheritance[a], in Timnath-heres, in the hill country of Ephraim, north of Mount Gaash.
translation:
  language: te
  text: వారు అతణ్ణి అతని స్వాస్థ్య భూభాగంలో, ఎఫ్రాయిము కొండప్రాంతంలోని తిమ్నత్-హెరెసులో[a], గాయషు కొండకు ఉత్తరాన పాతిపెట్టారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: యెహోషువ 24:30లో ఇక్కడి ‘తిమ్నత్-హెరెసు’కు బదులుగా ‘తిమ్నత్-సెరహు’ అని ఉంది. సమాంతర సమాధి వృత్తాంతాల్లో కనిపించే స్థలనామ భేదంగా దీనిని ఇక్కడ యథాతథంగా ఉంచాం.
    reason: textual_variant
lexical_decisions:
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: వారు అతణ్ణి పాతిపెట్టారు
  rationale: వావ్-వరుసలోని క్రియ కథనాన్ని ముందుకు తీసుకెళ్లే గత సంఘటనను సూచిస్తుంది; אֹתוֹ లోని పుంలింగ ఏకవచన ప్రత్యయం సందర్భంలోని యెహోషువను సూచిస్తుంది. తెలుగు కథనశైలిలో వాక్యారంభ ‘మరియు’ అవసరం లేకుండా సహజంగా అనువదించబడింది.
- source_word: בִּגְבוּל נַחֲלָתוֹ
  choice: అతని స్వాస్థ్య భూభాగంలో
  rationale: גְּבוּל ఇక్కడ కేవలం సరిహద్దు రేఖకన్నా పరిధి లేదా భూభాగాన్ని సూచిస్తుంది; נַחֲלָה దేవుడు పంచి ఇచ్చిన స్వాస్థ్య భావాన్ని నిలుపుతుంది.
- source_word: בְּתִמְנַת חֶרֶס
  choice: తిమ్నత్-హెరెసులో
  rationale: స్థలనామాన్ని మూలరూపానికి దగ్గరగా లిప్యంతరీకరించి, בְּ అనే స్థానార్థక సంబంధాన్ని తెలుగు ‘లో’తో తెలిపాం.
- source_word: בְּהַר אֶפְרָיִם
  choice: ఎఫ్రాయిము కొండప్రాంతంలోని
  rationale: ఈ భౌగోళిక ప్రయోగంలో הַר ఒకే కొండను కాక ఎఫ్రాయిము పర్వతమయ ప్రాంతాన్ని సూచిస్తుంది; అందువల్ల ‘కొండప్రాంతం’ సహజమైనది, ఖచ్చితమైనది.
- source_word: מִצְּפוֹן לְהַר גָּעַשׁ
  choice: గాయషు కొండకు ఉత్తరాన
  rationale: ఈ నిర్మాణం గాయషు కొండతో పోల్చిన స్థానం—దానికి ఉత్తరంగా—తెలియజేస్తుంది. הַר అనే సాధారణ నామాన్ని తెలుగులో సహజంగా ‘కొండ’గా ఉంచాం.
