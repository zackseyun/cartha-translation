  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְהִ֗י כְּ/דַבֵּ֞ר מַלְאַ֤ךְ יְהוָה֙ אֶת הַ/דְּבָרִ֣ים הָ/אֵ֔לֶּה אֶֽל כָּל בְּנֵ֖י יִשְׂרָאֵ֑ל וַ/יִּשְׂא֥וּ הָ/עָ֛ם אֶת קוֹלָ֖/ם וַ/יִּבְכּֽוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/004.yaml
  text: And when the angel of Yahweh spoke these words to all the sons of Israel[b][a], the people raised their voices and wept.
translation:
  language: te
  text: యాహ్వే దూత[a] ఇశ్రాయేలు కుమారులందరికీ[b] ఈ మాటలు చెప్పినప్పుడు, ప్రజలు గొంతెత్తి ఏడ్చారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘యాహ్వే దేవదూత.’ ‘దూత’ అనే మూలపదానికి ‘సందేశవాహకుడు’ అనే అర్థం కూడా ఉంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘ఇశ్రాయేలీయులందరికీ’; అక్షరార్థంగా, ‘ఇశ్రాయేలు కుమారులందరికీ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּדַבֵּר
  choice: చెప్పినప్పుడు
  rationale: היה తో కూడిన דבר infinitive construct ఇక్కడ కాలసూచక ఉపవాక్యాన్ని పరిచయం చేస్తుంది. ఆధునిక తెలుగులో ‘చెప్పినప్పుడు’ సహజంగా కథన క్రమాన్ని తెలియజేస్తుంది.
- source_word: מַלְאַךְ יְהוָה
  choice: యెహోవా దూత
  rationale: מַלְאַךְ అనే పదానికి ‘దూత’ లేదా సందర్భానుసారం ‘దేవదూత’ అనే అర్థాలు ఉండవచ్చు. ‘దూత’ మూలపదంలోని సందేశవాహక భావాన్ని, వ్యక్తి స్వరూపానికి సంబంధించిన అస్పష్టతను కాపాడుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో స్థిరపడిన ‘యెహోవా’ రూపంలో వ్యక్తిగత నామంగా ఇచ్చాం.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: ఈ మాటలు
  rationale: ఇది దూత పలికిన ప్రసంగాన్ని సూచిస్తున్నందున דְּבָרִים కు ‘మాటలు’ అనేది సూటి, సహజమైన అనువాదం.
- source_word: אֶל כָּל בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులందరికీ
  rationale: בְּנֵי יִשְׂרָאֵל యొక్క రూపకల్పనను ‘ఇశ్రాయేలు కుమారులు’గా కాపాడాం; సహజమైన సమూహార్థం ‘ఇశ్రాయేలీయులందరికీ’ అని పాదటిప్పణిలో ఇచ్చాం.
- source_word: וַיִּשְׂאוּ הָעָם אֶת קוֹלָם
  choice: ప్రజలు గొంతెత్తి
  rationale: ‘తమ స్వరాన్ని ఎత్తారు’ అనే హీబ్రూ నుడికారానికి ఆధునిక తెలుగులో సహజమైన సమానార్థకం ‘గొంతెత్తి’; తరువాతి ‘ఏడ్చారు’తో కలిసి బిగ్గరగా విలపించిన చర్యను తెలియజేస్తుంది.
- source_word: וַיִּבְכּוּ
  choice: ఏడ్చారు
  rationale: בכה యొక్క సాధారణ అర్థమైన ‘ఏడ్చుట/రోదించుట’లో, సాధారణ పాఠకులకు సహజంగా ఉండే ‘ఏడ్చారు’ను ఎంచుకున్నాం.
theological_decisions:
- issue: יְהוָה దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు; యాహ్వే
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం ప్రత్యక్షంగా ఉంది. దానిని బిరుదుగా మార్చకుండా తెలుగులో పరిచితమైన లిప్యంతరీకరణతో నిలిపాం.
- issue: מַלְאַךְ יְהוָה యొక్క స్వరూపం
  choice: యెహోవా దూత
  alternative: యెహోవా దేవదూత
  rationale: מַלְאַךְ మానవ లేదా పరలోక సందేశవాహకుణ్ణి సూచించగలదు. ‘దూత’ అని అనువదించడం వల్ల ఈ వాక్యం స్వయంగా స్పష్టపరచని స్వరూపాన్ని ముందే నిర్ణయించకుండా ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్యనిర్మాణం. మూలంలోని కాలసంబంధ నిర్మాణం, సమూహపదం, ఏడుపు చర్యను సహజమైన తెలుగు నుడికారంతో నిలిపాం.
