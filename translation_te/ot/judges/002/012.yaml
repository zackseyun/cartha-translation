  text: וַ/יַּעַזְב֞וּ אֶת יְהוָ֣ה אֱלֹהֵ֣י אֲבוֹתָ֗/ם הַ/מּוֹצִ֣יא אוֹתָ/ם֮ מֵ/אֶ֣רֶץ מִצְרַיִם֒ וַ/יֵּלְכ֞וּ אַחֲרֵ֣י אֱלֹהִ֣ים אֲחֵרִ֗ים מֵ/אֱלֹהֵ֤י הָֽ/עַמִּים֙ אֲשֶׁר֙ סְבִיב֣וֹתֵי/הֶ֔ם וַ/יִּֽשְׁתַּחֲו֖וּ לָ/הֶ֑ם וַ/יַּכְעִ֖סוּ אֶת יְהוָֽה־׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/012.yaml
  text: And they abandoned Yahweh[a], the God of their fathers, who had brought them out from the land of Egypt, and went after other gods from among the gods of the peoples who were around them, and they bowed down to them and provoked Yahweh to anger.
translation:
  language: te
  text: వారు తమ పితరుల దేవుడైన యాహ్వేను విడిచిపెట్టారు—ఆయనే వారిని ఐగుప్తు దేశం నుండి బయటకు తీసుకొచ్చాడు. వారు తమ చుట్టూ ఉన్న ప్రజల దేవుళ్లలో కొందరైన ఇతర దేవుళ్లను[a] అనుసరించి, వాటి ముందు వంగి నమస్కరించి, యాహ్వేకు కోపం పుట్టించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తమ చుట్టూ ఉన్న ప్రజల దేవుళ్ల నుండి ఇతర దేవుళ్లను.” ఈ హెబ్రీయ పదబంధం ఇశ్రాయేలు చుట్టుపక్కల నివసించిన ప్రజలు ఆరాధించిన దేవుళ్లను సాధారణంగా సూచించేదిగా కూడా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַזְבוּ
  choice: విడిచిపెట్టారు
  rationale: עזב ఇక్కడ కేవలం ఒక చోటు విడిచి వెళ్లడాన్ని కాక, తమ దేవునితో ఉన్న నిబద్ధతను త్యజించడాన్ని సూచిస్తుంది. ‘విడిచిపెట్టారు’ ఆధునిక తెలుగులో ఈ సంబంధపరమైన బలాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పునర్నిర్మిత ఉచ్చారణకు దగ్గరగా తెలుగులో లిప్యంతరీకరించబడింది.
- source_word: אֱלֹהֵי אֲבוֹתָם
  choice: తమ పితరుల దేవుడు
  rationale: మూలంలోని పురుష బహువచనమైన ‘పితరులు’ అనే నిబంధనాత్మక ప్రయోగాన్ని నిలుపుతూ, సహజమైన తెలుగు సంబంధ నిర్మాణాన్ని ఉపయోగిస్తుంది.
- source_word: הַמּוֹצִיא אוֹתָם מֵאֶרֶץ מִצְרַיִם
  choice: వారిని ఐగుప్తు దేశం నుండి బయటకు తీసుకొచ్చాడు
  rationale: నిర్దిష్ట ఆర్టికల్‌తో ఉన్న కృదంతం యాహ్వేను నిర్గమన కార్యం ద్వారా గుర్తిస్తోంది. తెలుగులో సంపూర్ణ క్రియారూపం కథన ప్రవాహానికి సహజంగా ఉంటుంది.
- source_word: וַיֵּלְכוּ אַחֲרֵי
  choice: అనుసరించి
  rationale: ఈ హెబ్రీయ ఇడియమ్ విధేయతతో వెంబడించడాన్ని సూచిస్తుంది. ‘అనుసరించి’ ఆ భావాన్ని ఆధునిక తెలుగులో సహజంగా అందిస్తుంది.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: ఇతర దేవుళ్లు
  rationale: אֲחֵרִים యొక్క ప్రత్యక్ష అర్థమైన ‘ఇతర’ను నిలుపుతుంది; ‘అన్య’ లేదా ‘విదేశీ’ అని అనువదిస్తే మూలంలో లేని అదనపు భావం చేరవచ్చు.
- source_word: מֵאֱלֹהֵי הָעַמִּים אֲשֶׁר סְבִיבוֹתֵיהֶם
  choice: తమ చుట్టూ ఉన్న ప్రజల దేవుళ్లలోని
  rationale: מִן‌ను భాగార్థకంగా తీసుకుని, వారు అనుసరించిన ఇతర దేవుళ్లు చుట్టుపక్కల ప్రజల దేవుళ్ల సమూహంలోనివారని తెలియజేస్తుంది. ఈ నిర్మాణానికి ఉన్న సాధారణ ప్రత్యామ్నాయ అవగాహనను పాదసూచికలో ఉంచాం.
- source_word: וַיִּשְׁתַּחֲווּ לָהֶם
  choice: వాటి ముందు సాష్టాంగపడి
  rationale: క్రియ సూచించే శరీరపూర్వకంగా వంగి నమస్కరించే చర్యను స్పష్టంగా నిలుపుతుంది; సందర్భం దాని ఆరాధనా భావాన్ని తెలియజేస్తుంది.
- source_word: וַיַּכְעִסוּ אֶת יְהוָה
  choice: యాహ్వేకు కోపం పుట్టించారు
  rationale: כעס యొక్క హిఫీల్ రూపంలోని కారణార్థక బలాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠం బిరుదును కాక వ్యక్తిగత దైవనామాన్ని ఉపయోగిస్తుంది. అందువల్ల దానిని ‘ప్రభువు’గా మార్చకుండా, ‘Yahweh’ ఉచ్చారణకు దగ్గరగా ‘యాహ్వే’ అని లిప్యంతరీకరించాం.
- issue: ఇశ్రాయేలు మతభ్రష్టతలోని నిబంధనాత్మక భావం
  choice: మూలంలోని చర్యల ద్వారానే ఆ తీవ్రతను నిలుపడం
  alternative: ఇది ‘నిబంధనను ఉల్లంఘించడం’ అని వాక్యంలోనే వివరణాత్మకంగా చేర్చడం
  rationale: విడిచిపెట్టడం, ఇతర దేవుళ్లను అనుసరించడం, వాటి ముందు సాష్టాంగపడడం, యాహ్వేకు కోపం పుట్టించడం అనే మూలపాఠంలోని వరుస చర్యలు మతభ్రష్టత తీవ్రతను స్పష్టంగా చూపుతాయి. మూలంలో లేని సిద్ధాంతపరమైన వివరణను చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలిని ఉపయోగించాం. ‘సాష్టాంగపడి’ అనే పదం మూలంలోని శరీరపూర్వక నమస్కారాన్ని సంక్షిప్తంగా, స్పష్టంగా తెలియజేస్తుంది. దీర్ఘమైన హెబ్రీయ వాక్యాన్ని తెలుగు పఠనసౌలభ్యం కోసం రెండు వాక్యాలుగా విభజించినప్పటికీ, చర్యల క్రమం మరియు కారణసంబంధం నిలుపబడ్డాయి.
