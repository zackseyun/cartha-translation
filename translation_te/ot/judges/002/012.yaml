  to: వారు తమ పితరుల దేవుడైన యాహ్వేను విడిచిపెట్టారు—ఆయనే వారిని ఐగుప్తు దేశం నుండి బయటకు తీసుకొచ్చాడు. వారు తమ చుట్టూ ఉన్న ప్రజల దేవుళ్లలో కొందరైన ఇతర దేవుళ్లను[a] అనుసరించి, వాటి ముందు వంగి నమస్కరించి, యాహ్వేకు కోపం పుట్టించారు.
