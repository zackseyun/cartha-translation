- from: అప్పుడు యూదా కుమారులు యెరూషలేముకు వ్యతిరేకంగా యుద్ధం చేసి, దాన్ని స్వాధీనం చేసుకున్నారు. దాన్ని కత్తివాత హతమార్చి, నగరానికి నిప్పు పెట్టారు.
  to: అప్పుడు యూదా కుమారులు యెరూషలేముపై యుద్ధం చేసి[b], దానిని స్వాధీనం చేసుకున్నారు. దానిని కత్తి ధారతో కొట్టి, నగరానికి నిప్పు పెట్టారు.
