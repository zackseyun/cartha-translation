  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కథన శైలి. మూలంలోని గోత్రసంబంధ ‘యూదా కుమారులు’ను నిలిపి, యుద్ధ వర్ణనను అనవసరంగా మృదువుచేయలేదు.
