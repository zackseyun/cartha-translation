id: JDG.1.8
reference: Judges 1:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּלָּחֲמ֤וּ בְנֵֽי יְהוּדָה֙ בִּ/יר֣וּשָׁלִַ֔ם וַ/יִּלְכְּד֣וּ אוֹתָ֔/הּ וַ/יַּכּ֖וּ/הָ לְ/פִי חָ֑רֶב וְ/אֶת הָ/עִ֖יר שִׁלְּח֥וּ בָ/אֵֽשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/008.yaml
  text: Then the sons of Judah fought against Jerusalem and captured it[a], and struck it with the edge of the sword[b], and they set the city on fire.
translation:
  language: te
  text: అప్పుడు యూదా కుమారులు యెరూషలేముపై యుద్ధం చేసి[b], దానిని స్వాధీనం చేసుకున్నారు. దానిని కత్తి ధారతో కొట్టి, నగరానికి నిప్పు పెట్టారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: లేదా, “యెరూషలేములో యుద్ధం చేసి.” అయితే సందర్భాన్ని బట్టి “యెరూషలేముపై యుద్ధం చేసి” అనే అర్థమే బలంగా ఉంది.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּלָּחֲמוּ בִירוּשָׁלִַם
  choice: యెరూషలేముకు వ్యతిరేకంగా యుద్ధం చేసి
  rationale: לחם తరువాత ב యుద్ధ సందర్భంలో దాడికి గురయ్యే లక్ష్యాన్ని సూచించగలదు. తరువాత నగరాన్ని స్వాధీనం చేసుకున్నారని చెప్పడం వల్ల ఇక్కడ ‘యెరూషలేములో’ కంటే ‘యెరూషలేముకు వ్యతిరేకంగా’ అనే అర్థం సందర్భోచితం.
- source_word: בְנֵי יְהוּדָה
  choice: యూదా కుమారులు
  rationale: మూలంలోని ‘యూదా కుమారులు’ అనే వంశపరమైన సమూహపదాన్ని నిలుపుతుంది; సందర్భంలో ఇది యూదా గోత్ర ప్రజలను సూచిస్తుంది.
- source_word: וַיִּלְכְּדוּ אוֹתָהּ
  choice: దాన్ని స్వాధీనం చేసుకున్నారు
  rationale: לכד నగరాన్ని సైనికంగా పట్టుకోవడం లేదా స్వాధీనం చేసుకోవడం అనే భావాన్ని ఇస్తుంది; ఆధునిక తెలుగులో ఈ రూపం సహజంగా ఉంది.
- source_word: וַיַּכּוּהָ לְפִי חָרֶב
  choice: దాన్ని కత్తివాత హతమార్చి
  rationale: నగరాన్ని కొట్టడం అనే వ్యాకరణ రూపం వాస్తవానికి దాని నివాసులను కత్తితో సంహరించడాన్ని సూచించే సైనిక ప్రయోగం. ‘కత్తివాత’ మూలంలోని ‘కత్తి నోరు/అంచు’ అనే ఇడియమాటిక్ చిత్రాన్ని సంక్షిప్తంగా ప్రతిబింబిస్తుంది.
- source_word: וְאֶת הָעִיר שִׁלְּחוּ בָאֵשׁ
  choice: నగరానికి నిప్పు పెట్టారు
  rationale: שלח באש అనేది అగ్నికి అప్పగించడం, అంటే తగలబెట్టడం అనే హీబ్రూ ప్రయోగం; ‘నిప్పు పెట్టారు’ సహజమైన ఆధునిక తెలుగు.
