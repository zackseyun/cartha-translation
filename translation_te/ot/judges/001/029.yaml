  yaml_path: translation/ot/judges/001/029.yaml
  text: And Ephraim did not drive out the Canaanites who lived in Gezer[a], and the Canaanites lived among them in Gezer.
translation:
  language: te
  text: ఎఫ్రాయిము గెజెరులో నివసిస్తున్న కనానీయులను వెళ్లగొట్టలేదు; కనానీయులు గెజెరులో ఎఫ్రాయిము గోత్రం మధ్యలో నివసించారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הוֹרִישׁ
  choice: వెళ్లగొట్టలేదు
  rationale: హిఫిల్ రూపంలో ఉన్న ఈ క్రియ, ముందుగా నివసిస్తున్నవారిని వారి స్థలం నుంచి తొలగించడం లేదా స్వాధీనాన్ని కోల్పోయేలా చేయడం అనే భావాన్ని ఇస్తుంది. ఆధునిక తెలుగులో ‘వెళ్లగొట్టు’ ఈ సందర్భానికి సహజంగా సరిపోతుంది.
- source_word: הַכְּנַעֲנִי
  choice: కనానీయులను / కనానీయులు
  rationale: హీబ్రూలో వ్యాకరణపరంగా ఏకవచనమైనా, ఇక్కడ ఒక జనసమూహాన్ని సమష్టిగా సూచిస్తుంది; అందువల్ల తెలుగులో బహువచనం సహజం.
- source_word: הַיּוֹשֵׁב
  choice: నివసిస్తున్న
  rationale: పార్టిసిపిల్ రూపం కొనసాగుతున్న స్థిర నివాసాన్ని సూచిస్తుంది; ‘నివసిస్తున్న’ ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: בְּגָזֶר
  choice: గెజెరులో
  rationale: בְּ ఉపసర్గ స్థలాన్ని సూచిస్తుంది; పట్టణంలో నివాసాన్ని తెలుగులో ‘గెజెరులో’ అని సహజంగా వ్యక్తపరచవచ్చు.
- source_word: וַיֵּשֶׁב
  choice: నివసించారు
  rationale: ఈ కథన క్రియ కనానీయుల నివాసం కొనసాగిన విషయాన్ని తెలుపుతుంది. గౌరవార్థకంకాని మానవ బహువచనానికి ‘నివసించారు’ ప్రామాణిక ఆధునిక తెలుగు వాడుక.
- source_word: בְּקִרְבּוֹ
  choice: వారి మధ్యనే
  rationale: అక్షరార్థంగా ‘అతని మధ్యలో’; ఏకవచన ప్రత్యయం ఒక గోత్ర సమష్టిగా ఎఫ్రాయిమును సూచిస్తుంది. తెలుగులో ఆ సమష్టి భావాన్ని ‘వారి మధ్య’ సహజంగా అందిస్తుంది; ‘నే’ నివాసం తొలగింపబడక అక్కడే కొనసాగిందనే వాక్యబలాన్ని వ్యక్తపరుస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన కథన శైలి. హీబ్రూ וַ అనుసంధానాన్ని కారణార్థకంగా మార్చకుండా, తెలుగులో సహజమైన అర్ధవిరామంతో సమన్వయ సంబంధంగా ఉంచాం. ప్రత్యేక వ్యాఖ్యాన లేదా సంప్రదాయపరమైన భావాలను చేర్చలేదు.
