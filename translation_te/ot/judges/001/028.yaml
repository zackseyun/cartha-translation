source:
  edition: WLC
  text: וַֽ/יְהִי֙ כִּֽי חָזַ֣ק יִשְׂרָאֵ֔ל וַ/יָּ֥שֶׂם אֶת הַֽ/כְּנַעֲנִ֖י לָ/מַ֑ס וְ/הוֹרֵ֖ישׁ לֹ֥א הוֹרִישֽׁ/וֹ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/028.yaml
  text: And when Israel became strong[a], they put the Canaanites to forced labor[b], but they did not drive them out completely.
translation:
  language: te
  text: ఇశ్రాయేలు బలపడినప్పుడు, కనానీయులతో బలవంతపు శ్రమ చేయించారు[a]; అయితే వారిని పూర్తిగా వెళ్లగొట్టలేదు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘కనానీయులపై నిర్బంధ శ్రమ విధించారు.’ హెబ్రీ పదం పాలక శక్తి బలవంతంగా విధించే శ్రమసేవను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: హెబ్రీలో అక్షరార్థంగా, ‘అతణ్ణి వెళ్లగొట్టలేదు’; ఏకవచన సర్వనామం కనానీయ జనసమూహాన్ని సమష్టిగా సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּי
  choice: అప్పుడు
  rationale: హెబ్రీ కథన సూత్రం ఇక్కడ కాలసంబంధ ఉపవాక్యాన్ని పరిచయం చేస్తుంది. తెలుగులో ‘బలపడినప్పుడు’తో కలిపి సహజమైన కథన క్రమాన్ని తెలియజేస్తుంది.
- source_word: חָזַק
  choice: బలపడినప్పుడు
  rationale: క్రియ ఇశ్రాయేలు బలం లేదా ఆధిపత్యం పెరిగిన స్థితిని సూచిస్తుంది; కేవలం ‘బలంగా ఉన్నప్పుడు’కన్నా ఈ భావం స్పష్టంగా ఉంటుంది.
- source_word: הַכְּנַעֲנִי
  choice: కనానీయుల
  rationale: హెబ్రీలో రూపపరంగా ఏకవచనమైనా, సందర్భంలో ఇది కనానీయ జనసమూహాన్ని సూచించే సమూహవాచక ఏకవచనం; తెలుగులో బహువచనం సహజం.
- source_word: וַיָּשֶׂם ... לָמַס
  choice: కనానీయులచేత బలవంతపు చాకిరి చేయించారు
  rationale: ఈ పదబంధం పాలక శక్తి విధించే నిర్బంధ శ్రమను సూచిస్తుంది. ‘చాకిరి’ ఇక్కడ శ్రమసేవ భావాన్ని, ‘బలవంతపు’ దాని నిర్బంధ స్వభావాన్ని స్పష్టం చేస్తాయి.
- source_word: וְהוֹרֵישׁ לֹא הוֹרִישׁוֹ
  choice: అయితే వారిని పూర్తిగా వెళ్లగొట్టలేదు
  rationale: అనంతక్రియతో కూడిన సమాన మూలక్రియ నిషేధిత చర్యపై బలాన్ని ఉంచుతుంది; ‘పూర్తిగా’ ఆ ఉద్ఘాటనను ప్రతిబింబిస్తుంది. ఏకవచన సర్వనామం సమూహవాచకమైన కనానీయులను సూచిస్తున్నందున తెలుగులో ‘వారిని’ వాడబడింది.
theological_decisions:
- issue: కనానీయులపై ఇశ్రాయేలు విధించిన చర్య స్వరూపం
  choice: కనానీయులచేత బలవంతపు చాకిరి చేయించారు
  alternative: వారిపై కప్పం విధించారు
  rationale: לָמַס అనే హెబ్రీ పదం ఈ సందర్భంలో తటస్థమైన పన్నుకన్నా పాలక శక్తి విధించిన నిర్బంధ శ్రమను సూచిస్తుంది; వాక్యంలోని బలవంతపు స్వభావాన్ని తగ్గించకూడదు.
- issue: కనానీయులను వెళ్లగొట్టడంలోని అసంపూర్ణత
  choice: పూర్తిగా వెళ్లగొట్టలేదు
  alternative: స్వాధీనభ్రష్టులను చేయలేదు
  rationale: హెబ్రీ ఉద్ఘాటనను ‘పూర్తిగా’ నిలుపుతుంది; ‘వెళ్లగొట్టలేదు’ విజయాధికరణ సందర్భంలో సహజంగా, సామాన్య పాఠకులకు స్పష్టంగా ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘బలవంతపు చాకిరి’ నిర్బంధ శ్రమ భావాన్ని స్పష్టంగా తెలియజేస్తుంది; ‘పూర్తిగా’ హెబ్రీ ఉద్ఘాటనను నిలుపుతుంది.
