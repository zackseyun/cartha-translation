  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֵּ֤לֶךְ יְהוּדָה֙ אֶת שִׁמְע֣וֹן אָחִ֔י/ו וַ/יַּכּ֕וּ אֶת הַֽ/כְּנַעֲנִ֖י יוֹשֵׁ֣ב צְפַ֑ת וַ/יַּחֲרִ֣ימוּ אוֹתָ֔/הּ וַ/יִּקְרָ֥א אֶת שֵׁם הָ/עִ֖יר חָרְמָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/017.yaml
  text: Then Judah went with Simeon his brother[a], and they struck down the Canaanites living in Zephath and devoted it to destruction[c][b]; so they called the name of the city Hormah.
translation:
  language: te
  text: అప్పుడు యూదా తన సహోదరుడైన షిమ్యోనుతో కలిసి వెళ్లాడు. వారు సెఫాతులో నివసిస్తున్న కనానీయులను హతమార్చి, ఆ పట్టణాన్ని నాశనానికి అంకితం చేశారు.[a] అతడు ఆ పట్టణానికి హోర్మా అని పేరు పెట్టాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “నాశనానికి అంకితం చేశారు” అని అనువదించిన హీబ్రూ క్రియ, దేనినైనా తిరుగులేని విధంగా అంకితం చేయడాన్ని సూచిస్తుంది; యుద్ధ సందర్భంలో ఇది సాధారణంగా దానిని పూర్తిగా నాశనం చేయడాన్ని కలిగి ఉంటుంది.
    reason: alternative_reading
  - marker: b
    text: “హోర్మా” అనే పేరు, “నాశనానికి అంకితం చేయడం” అనే అర్థమున్న హీబ్రూ పదాన్ని ధ్వనింపజేస్తుంది. “పేరు పెట్టాడు” అనే క్రియ హీబ్రూలో ఏకవచనంలో ఉంది; అది సమూహంగా భావించిన యూదాను సూచించి ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ יְהוּדָה אֶת שִׁמְעוֹן אָחִיו
  choice: యూదా తన సహోదరుడైన షిమ్యోనుతో కలిసి వెళ్లాడు
  rationale: הלך సాధారణంగా ‘వెళ్లాడు’ అని అర్థం; ఇక్కడ אֶת సహవాసాన్ని సూచిస్తుంది. అందువల్ల ‘కలిసి వెళ్లాడు’ మూల వాక్య నిర్మాణాన్నీ సహచర్య భావాన్నీ సహజమైన తెలుగులో అందిస్తుంది.
- source_word: וַיַּכּוּ אֶת הַכְּנַעֲנִי
  choice: వారు ... కనానీయులను హతమార్చి
  rationale: נכה యుద్ధ సందర్భంలో కొట్టి పడగొట్టడం లేదా సంహరించడం అనే బలమైన భావం కలిగి ఉంది. ఏకవచన రూపంలోని ‘కనానీయుడు’ ఇక్కడ సమూహార్థకం; బహువచన క్రియకు అనుగుణంగా ‘కనానీయులను’ అని ఇచ్చాం.
- source_word: יוֹשֵׁב צְפַת
  choice: సెఫాతులో నివసిస్తున్న
  rationale: ישב అనే కృదంతం అక్కడ నివసించే ప్రజలను సూచిస్తుంది; ఆధునిక తెలుగులో ‘నివసిస్తున్న’ స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: וַיַּחֲרִימוּ אוֹתָהּ
  choice: ఆ పట్టణాన్ని నాశనానికి అంకితం చేశారు
  rationale: חרם క్రియలో తిరుగులేని అంకితం మరియు దాని ఫలితమైన నాశనం రెండూ ఉన్నాయి. ‘నాశనానికి అంకితం చేశారు’ ఈ ఆరాధనాత్మక-యుద్ధ సంబంధ ఉద్రిక్తతను కేవలం ‘నాశనం చేశారు’గా కుదించకుండా నిలుపుతుంది. స్త్రీలింగ ప్రత్యయం సందర్భానుసారంగా పట్టణాన్ని సూచిస్తుంది.
- source_word: וַיִּקְרָא אֶת שֵׁם הָעִיר
  choice: అతడు ఆ పట్టణానికి ... అని పేరు పెట్టాడు
  rationale: క్రియ రూపం ఏకవచనం. యూదాను సమూహంగా లేదా ప్రతినిధి కర్తగా ఉద్దేశించినప్పటికీ, మూలంలోని వ్యాకరణ ఏకవచనాన్ని ‘అతడు’తో నిలిపాం.
- source_word: חָרְמָה
  choice: హోర్మా
  rationale: స్థలనామాన్ని ధ్వన్యనుసారంగా ఇచ్చాం. ఇది חרם (‘నాశనానికి అంకితం చేయడం’) అనే పదంతో ఉన్న శబ్దసామ్యాన్ని పాదటిప్పణిలో వివరించాం.
theological_decisions:
- issue: חרם అనే పవిత్ర-యుద్ధ పదబంధం అనువాదం
  choice: నాశనానికి అంకితం చేశారు
  alternative: పూర్తిగా నాశనం చేశారు / శాపనిషేధం కింద ఉంచారు
  rationale: హీబ్రూ పదం అంకితం చేయడం, తిరిగి వినియోగించలేని విధంగా వేరుచేయడం, తరచుగా నాశనం చేయడం అనే భావాలను కలిపి ఉంచుతుంది. ఎంపిక చేసిన అనువాదం ఈ భావసంక్లిష్టతను నిలుపుతుంది.
- issue: וַיִּקְרָא లోని ఏకవచన కర్త
  choice: అతడు ... పేరు పెట్టాడు
  alternative: వారు ... పేరు పెట్టారు
  rationale: ముందున్న క్రియలు బహువచనమైనా, ఈ క్రియ స్పష్టంగా వ్యాకరణ ఏకవచనంలో ఉంది. యూదా గోత్రాన్ని సమూహ ఏకవచనంగా సూచించి ఉండవచ్చనే అస్పష్టతను సవరించకుండా మూలరూపాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైన కానీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి వాడాం. ‘షిమ్యోను,’ ‘సెఫాతు,’ ‘హోర్మా’ అనే పేర్లను హీబ్రూ ధ్వనులకు దగ్గరగా లిప్యంతరీకరించాం. మూలంలోని ఏకవచన-బహువచన మార్పును సవరించకుండా నిలిపాం.
