id: JDG.1.12
reference: Judges 1:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר כָּלֵ֔ב אֲשֶׁר יַכֶּ֥ה אֶת קִרְיַת סֵ֖פֶר וּ/לְכָדָ֑/הּ וְ/נָתַ֥תִּי ל֛/וֹ אֶת עַכְסָ֥ה בִתִּ֖/י לְ/אִשָּֽׁה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/012.yaml
  text: And Caleb said[a], “Whoever strikes Kiriath-sepher and captures it, I will give him my daughter Achsah as a wife.”
translation:
  language: te
  text: 'కాలేబు ఇలా అన్నాడు: “ఎవరైతే కిర్యత్-సేఫెరుపై దాడి చేసి దానిని స్వాధీనం చేసుకుంటారో, వారికి నా కుమార్తె అక్సాను భార్యగా ఇస్తాను.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: ఇలా అన్నాడు
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది. తెలుగులో సహజమైన కథన ప్రవాహం కోసం ‘ఇలా అన్నాడు’ అని అనువదించాం.
- source_word: כָּלֵב
  choice: కాలేబు
  rationale: వ్యక్తి పేరును తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: אֲשֶׁר
  choice: చేసుకునేవాడికి
  rationale: ఇది నిర్దిష్ట వ్యక్తిని సూచించని సంబంధవాచక నిర్మాణం. సవాలును స్వీకరించే ఎవరైనా అనే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: יַכֶּה
  choice: జయించి
  rationale: נכה హిఫిల్ రూపం ఇక్కడ పట్టణంపై సైనిక దాడిని సూచిస్తుంది. తరువాత వచ్చే ‘స్వాధీనం చేసుకోవడం’తో కలిసి సహజంగా ఉండేందుకు ‘జయించి’ ఎంచుకున్నాం.
- source_word: קִרְיַת סֵפֶר
  choice: కిర్యత్-సేఫెరు
  rationale: స్థలపేరును దాని హీబ్రూ రూపానికి దగ్గరగా తెలుగులో లిప్యంతరీకరించాం; పేరులోని నిర్మాణాన్ని చూపడానికి హైఫన్ ఉంచాం.
- source_word: וּלְכָדָהּ
  choice: దాన్ని స్వాధీనం చేసుకునే
  rationale: לכד సైనిక సందర్భంలో పట్టుకోవడం లేదా స్వాధీనం చేసుకోవడం అనే అర్థం ఇస్తుంది. పట్టణాన్ని విజయవంతంగా చేజిక్కించుకోవడాన్ని ఇది స్పష్టంగా తెలియజేస్తుంది.
- source_word: וְנָתַתִּי לוֹ
  choice: వాడికి ... ఇస్తాను
  rationale: విజయం సాధించే వ్యక్తికి కాలేబు చేసిన షరతుతో కూడిన వాగ్దానాన్ని తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: עַכְסָה
  choice: అక్సా
  rationale: వ్యక్తి పేరును హీబ్రూ ఉచ్చారణకు దగ్గరగా తెలుగులో లిప్యంతరీకరించాం.
- source_word: בִתִּי
  choice: నా కుమార్తె
  rationale: మూలంలోని ప్రథమ పురుష స్వామ్య సంబంధాన్ని స్పష్టంగా నిలిపాం.
- source_word: לְאִשָּׁה
  choice: భార్యగా
  rationale: ఈ హీబ్రూ ప్రయోగం వివాహంలో భార్యగా ఇవ్వడాన్ని సూచిస్తుంది; ‘భార్యగా’ సంక్షిప్తమైన, సహజమైన తెలుగు.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. మూలంలోని సైనిక చర్యల క్రమాన్ని ‘జయించి ... స్వాధీనం చేసుకునే’ అని నిలిపాం.
