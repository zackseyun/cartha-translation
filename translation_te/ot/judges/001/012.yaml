revisions:
- from: 'కాలేబు ఇలా అన్నాడు: “కిర్యత్-సేఫెరును జయించి దాన్ని స్వాధీనం చేసుకునేవాడికి[a] నా కుమార్తె అక్సాను భార్యగా ఇస్తాను.”'
  to: 'కాలేబు ఇలా అన్నాడు: “ఎవరైతే కిర్యత్-సేఫెరుపై దాడి చేసి దానిని స్వాధీనం చేసుకుంటారో, వారికి నా కుమార్తె అక్సాను భార్యగా ఇస్తాను.”'
  rationale: The translation replaces ‘జయించి’ with ‘దాడి చేసి’ to distinguish the Hebrew verb for striking/attacking from the subsequent verb for capturing. The revised wording retains the indefinite challenge, the capture of the city, Caleb’s promise, and the marriage idiom. The audit-trail alternative is retained as a syntactic alternative, but no footnote marker is needed in the revised Telugu text because it does not represent a substantive lexical uncertainty.
