  text: And the man went to the land of the Hittites and built a city and called its name Luz[a]; that is its name to this day.
translation:
  language: te
  text: ఆ మనిషి హిత్తీయుల దేశానికి వెళ్లి, ఒక పట్టణాన్ని కట్టి, దానికి లూజు[a] అని పేరు పెట్టాడు; ఈనాటి వరకు దాని పేరు లూజే.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “దాని పేరును లూజు అని పిలిచాడు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: వెళ్లి
  rationale: הלך అనే క్రియ యొక్క సాధారణ కథన రూపం; వరుస చర్యలను సహజమైన తెలుగు కథన శైలిలో కలుపుతుంది.
- source_word: הָאִישׁ
  choice: ఆ మనిషి
  rationale: ముందటి వచనంలో ప్రస్తావించిన నిర్దిష్ట పురుషుణ్ణి సూచిస్తుంది; తెలుగు అనాఫరిక ప్రయోగంలో ‘ఆ మనిషి’ సహజం.
- source_word: אֶרֶץ הַחִתִּים
  choice: హిత్తీయుల దేశానికి
  rationale: ‘హిత్తీయుల దేశం’ అనే నిర్మాణాన్ని నేరుగా నిలుపుతూ, ఆ ప్రాంతపు రాజకీయ హోదాను అనవసరంగా నిర్ధారించదు.
- source_word: וַיִּבֶן עִיר
  choice: ఒక పట్టణాన్ని కట్టి
  rationale: בנה అంటే ‘కట్టు’; עִיר సందర్భానుసారంగా గోడలుగల పట్టణం లేదా నగరాన్ని సూచించగలదు. ఆధునిక తెలుగులో ‘పట్టణం’ అతిశయార్థం లేకుండా సహజంగా ఉంది.
- source_word: וַיִּקְרָא שְׁמָהּ לוּז
  choice: దానికి లూజు అని పేరు పెట్టాడు
  rationale: హీబ్రూ పదబంధం అక్షరార్థంగా ‘దాని పేరును లూజు అని పిలిచాడు’; తెలుగులో దాని భావాన్ని సహజంగా తెలిపే ప్రయోగం ‘పేరు పెట్టాడు’.
- source_word: לוּז
  choice: లూజు
  rationale: స్థలనామాన్ని అనువదించకుండా హీబ్రూ ఉచ్చారణకు సమీపంగా లిప్యంతరీకరించింది.
- source_word: הוּא שְׁמָהּ
  choice: దాని పేరు అదే
  rationale: క్రియలేని హీబ్రూ వాక్యంలో הוּא నిర్దేశక/ఉద్ఘాటకంగా పనిచేస్తుంది; ‘అదే’ ఆ బలాన్ని తెలుగులో సహజంగా అందిస్తుంది.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: నేటి వరకు
  rationale: హీబ్రూ కాలసూచక పదబంధానికి ఆధునిక, గౌరవప్రదమైన తెలుగు సమానార్థకం.
