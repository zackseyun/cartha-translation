id: JDG.1.3
reference: Judges 1:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוּדָה֩ לְ/שִׁמְע֨וֹן אָחִ֜י/ו עֲלֵ֧ה אִתִּ֣/י בְ/גוֹרָלִ֗/י וְ/נִֽלָּחֲמָה֙ בַּֽ/כְּנַעֲנִ֔י וְ/הָלַכְתִּ֧י גַם אֲנִ֛י אִתְּ/ךָ֖ בְּ/גוֹרָלֶ֑/ךָ וַ/יֵּ֥לֶךְ אִתּ֖/וֹ שִׁמְעֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/003.yaml
  text: And Judah said to Simeon his brother[a], “Come up with me into my allotted territory, and let us fight against the Canaanites; and I too will go with you into your allotted territory.” So Simeon went with him.
translation:
  language: te
  text: యూదా తన సహోదరుడైన సిమ్యోనుతో, “నాతో కలిసి, చీటి ద్వారా నాకు కేటాయించబడిన ప్రాంతానికి[a] పైకి రా; మనం కనానీయులపై యుద్ధం చేద్దాం. చీటి ద్వారా నీకు కేటాయించబడిన ప్రాంతానికి నేను కూడా నీతో వస్తాను” అన్నాడు. అప్పుడు సిమ్యోను అతనితో వెళ్లాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా ‘నా చీటి/వంతు,’ అలాగే తరువాత ‘నీ చీటి/వంతు’; అంటే చీటి ద్వారా కేటాయించబడిన భూభాగం.
    reason: ‘గోరాల్’ అనే మూలపదపు అక్షరార్థాన్నీ, ఈ సందర్భంలోని భూభాగార్థాన్నీ పాఠకునికి తెలియజేయడం.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అన్నాడు
  rationale: హీబ్రూ కథన క్రమాన్ని సహజమైన ఆధునిక తెలుగు వాక్యనిర్మాణంలో తెలియజేస్తుంది; ప్రత్యేక కాలసూచనను అనవసరంగా జోడించదు.
- source_word: יְהוּדָה
  choice: యూదా
  rationale: ఇక్కడ వ్యక్తీకరించబడిన గోత్రాన్ని సూచించే స్థిరమైన తెలుగు లిప్యంతరీకరణ.
- source_word: לְשִׁמְעוֹן אָחִיו
  choice: తన సహోదరుడైన సిమ్యోనుతో
  rationale: ‘సహోదరుడు’ అనే మూలంలోని బంధుత్వ భాషను అలాగే నిలుపుతూ, గోత్రాల మధ్య సోదర సంబంధాన్నీ ప్రతిబింబిస్తుంది.
- source_word: עֲלֵה אִתִּי
  choice: నాతో కలిసి రా
  rationale: ప్రత్యక్ష ఆహ్వానంలో వక్త దృష్టికోణాన్ని సహజంగా వ్యక్తం చేస్తుంది. עלה లోని ‘పైకి వెళ్లు/దండెత్తు’ ఛాయను తెలుగులో ‘పైకి రా’ అని యాంత్రికంగా ఇవ్వడం సందర్భంలో అసహజంగా ఉంటుంది.
- source_word: בְּגוֹרָלִי
  choice: చీటి ద్వారా నాకు కేటాయించబడిన ప్రాంతానికి
  rationale: גוֹרָל అక్షరార్థంగా ‘చీటి/వంతు’; ఇక్కడ అది చీటి ద్వారా కేటాయించబడిన గోత్ర భూభాగాన్ని సూచిస్తుంది. ఈ రూపం కేటాయింపు విధానాన్నీ సందర్భార్థాన్నీ స్పష్టంగా ఉంచుతుంది.
- source_word: וְנִלָּחֲמָה
  choice: మనం ... యుద్ధం చేద్దాం
  rationale: మొదటి పురుష బహువచన cohortative లోని ఉమ్మడి ఆహ్వానం, సంకల్పం రెండింటినీ సహజంగా తెలియజేస్తుంది.
- source_word: בַּכְּנַעֲנִי
  choice: కనానీయులతో
  rationale: రూపపరంగా ఏకవచనమైనా, ఇక్కడ జనసమూహాన్ని సమష్టిగా సూచిస్తుంది; ‘యుద్ధం’తో కలిసినప్పుడు తెలుగు ప్రయోగంలో ప్రత్యర్థి భావం స్పష్టంగా ఉంటుంది.
- source_word: וְהָלַכְתִּי גַם אֲנִי אִתְּךָ
  choice: నేను కూడా నీతో వస్తాను
  rationale: పరస్పర సహాయ వాగ్దానాన్ని, גַם אֲנִי లోని ‘నేను కూడా’ అనే ఉద్ఘాటనను కాపాడుతుంది.
- source_word: בְּגוֹרָלֶךָ
  choice: చీటి ద్వారా నీకు కేటాయించబడిన ప్రాంతానికి
  rationale: మొదటి గోరాల్‌కు చేసిన అనువాదంతో ఏకరూపతను ఉంచి, కేటాయించబడిన భూభాగమనే సందర్భార్థాన్ని తెలియజేస్తుంది.
- source_word: וַיֵּלֶךְ אִתּוֹ שִׁמְעוֹן
  choice: అప్పుడు సిమ్యోను అతనితో వెళ్లాడు
  rationale: సిమ్యోను ఆ ఆహ్వానాన్ని అంగీకరించి వెంట వెళ్లిన తదుపరి కథన సంఘటనను సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: אָחִיו అనే బంధుత్వ పదం
  choice: తన సహోదరుడైన
  alternative: తన బంధువైన
  rationale: మూలపాఠం స్పష్టంగా ‘సహోదరుడు’ అనే భాషనే వాడుతుంది. యూదా, సిమ్యోను గోత్రాల పితృసంబంధ నేపథ్యాన్ని సాధారణీకరించకుండా దానినే నిలుపుతుంది.
- issue: ఆక్రమణ-కేటాయింపు సందర్భంలో גוֹרָל
  choice: చీటి ద్వారా కేటాయించబడిన ప్రాంతం
  alternative: నా వంతు / నీ వంతు
  rationale: ఇక్కడ పదం కేవలం చీటినే కాక, ఆ చీటి ద్వారా లభించిన గోత్ర భూభాగాన్ని సూచిస్తుంది. అనువాదం ఈ metonymic అర్థాన్ని స్పష్టం చేస్తూనే చీటి ద్వారా జరిగిన కేటాయింపును దాచదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన కథన శైలి. గోత్రాల వ్యక్తీకరణ, సహోదర భాష, పరస్పర సైనిక సహకారం నిలుపబడ్డాయి. [a] గుర్తు అది వివరిస్తున్న మొదటి ‘కేటాయించబడిన ప్రాంతం’ తరువాత ఉంచబడింది.
