translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గంభీర కథన శైలి ఉపయోగించబడింది. వరుస హెబ్రీ క్రియలను తెలుగులో సహజమైన సంయుక్త క్రియా నిర్మాణంగా మలిచినా, సంఘటనల క్రమం యథాతథంగా నిలుపబడింది.
