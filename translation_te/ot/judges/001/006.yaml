source:
  edition: WLC
  text: וַ/יָּ֨נָס֙ אֲדֹ֣נִי בֶ֔זֶק וַֽ/יִּרְדְּפ֖וּ אַחֲרָ֑י/ו וַ/יֹּאחֲז֣וּ אֹת֔/וֹ וַֽ/יְקַצְּצ֔וּ אֶת בְּהֹנ֥וֹת יָדָ֖י/ו וְ/רַגְלָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/006.yaml
  text: But Adoni-bezek fled[a], and they pursued him, seized him, and cut off his thumbs and big toes.
translation:
  language: te
  text: అయితే అదోనీ-బెజెకు పారిపోయాడు. వారు అతణ్ణి వెంబడించి పట్టుకొని, అతని చేతుల బొటనవేళ్లనూ కాళ్ల బొటనవేళ్లనూ[a] నరికివేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీలో అక్షరార్థంగా, “అతని చేతుల బొటనవేళ్లనూ అతని కాళ్ల బొటనవేళ్లనూ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּנָס
  choice: పారిపోయాడు
  rationale: נוּס అనే క్రియ ఇక్కడ ప్రమాదం నుంచి పారిపోవడాన్ని సూచిస్తుంది. తరువాత అతడు పట్టుబడ్డాడు కాబట్టి ‘తప్పించుకున్నాడు’ అనే భావం తగదు.
- source_word: אֲדֹנִי בֶזֶק
  choice: అదోనీ-బెజెకు
  rationale: సందర్భంలో ఇది వ్యక్తిని సూచించే పేరు లేదా బిరుదుతో కూడిన పేరుగా పనిచేస్తుంది; అందువల్ల దాని అర్థాన్ని అనువదించకుండా తెలుగులో లిప్యంతరీకరించబడింది.
- source_word: וַיִּרְדְּפוּ אַחֲרָיו
  choice: వారు అతణ్ణి వెంబడించి
  rationale: רדף + אַחַר అంటే ఒకరి వెంటబడి వెంబడించడం. ‘వెంబడించి’ సహజమైన, గంభీరమైన కథన రూపం.
- source_word: וַיֹּאחֲזוּ אֹתוֹ
  choice: పట్టుకొని
  rationale: אחז బలంగా పట్టుకోవడం లేదా స్వాధీనం చేసుకోవడం అనే భావాన్ని ఇస్తుంది; ఈ సందర్భంలో ‘పట్టుకొని’ అతడిని బంధించిన భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וַיְקַצְּצוּ
  choice: నరికివేశారు
  rationale: קצץ ఇక్కడ శరీర భాగాలను పూర్తిగా కోసివేయడాన్ని సూచిస్తుంది. ‘నరికివేశారు’ ఆ చర్య తీవ్రతను స్పష్టంగా తెలియజేస్తుంది.
- source_word: בְּהֹנוֹת יָדָיו וְרַגְלָיו
  choice: అతని చేతి బొటనవేళ్లనూ కాలి బొటనవేళ్లనూ
  rationale: בֹּהֶן చేతికి సంబంధించినప్పుడు బొటనవేలును, కాలికి సంబంధించినప్పుడు కాలి బొటనవేలును సూచిస్తుంది. హెబ్రీ వాక్య నిర్మాణాన్ని తెలుగులో సహజంగా విప్పి చెప్పబడింది.
