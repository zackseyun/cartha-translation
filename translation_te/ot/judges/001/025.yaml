  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּרְאֵ/ם֙ אֶת מְב֣וֹא הָ/עִ֔יר וַ/יַּכּ֥וּ אֶת הָ/עִ֖יר לְ/פִי חָ֑רֶב וְ/אֶת הָ/אִ֥ישׁ וְ/אֶת כָּל מִשְׁפַּחְתּ֖/וֹ שִׁלֵּֽחוּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/025.yaml
  text: So he showed them the entrance to the city[a], and they struck the city with the edge of the sword[b]; but they let the man and all his family go.
translation:
  language: te
  text: అప్పుడు అతడు వారికి పట్టణంలోకి ప్రవేశించే మార్గాన్ని చూపించాడు. వారు ఆ పట్టణాన్ని కత్తి ధారతో[a] కొట్టారు; అయితే ఆ మనిషినీ అతని కుటుంబమంతటినీ[b] వెళ్లనిచ్చారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “కత్తి నోటితో”; “కత్తి ధారతో” అనే అర్థంలో వాడిన హీబ్రూ నుడికారం.
    reason: lexical_alternative
  - marker: b
    text: లేదా “అతని ఇంటివారందరినీ” లేదా “అతని వంశంవారందరినీ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְאֵם
  choice: అతడు వారికి ... చూపించాడు
  rationale: ראה యొక్క ఈ రూపం సందర్భంలో చూపించడం లేదా తెలియజేయడం అనే causative భావాన్ని ఇస్తుంది.
- source_word: מְבוֹא הָעִיר
  choice: పట్టణంలోకి వెళ్లే దారి
  rationale: మָבוֹא అనేది ప్రవేశద్వారం, లోపలికి వెళ్లే మార్గం లేదా చేరువను సూచిస్తుంది; దాడి సందర్భంలో సహజమైన తెలుగుగా ఈ రూపం ఎంపికైంది.
- source_word: וַיַּכּוּ
  choice: హతమార్చారు
  rationale: נכה విస్తృతంగా కొట్టడం లేదా సంహరించడం అనే అర్థాలు కలిగి ఉంది; కత్తి ప్రయోగంతో కూడిన ఈ సందర్భంలో ‘హతమార్చారు’ ఫలితాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: לְפִי חָרֶב
  choice: కత్తివాత
  rationale: అక్షరార్థంగా ‘కత్తి నోటితో’ అనే హీబ్రూ నుడికారం; ‘కత్తివాత’ ఆయుధంతో సంహరించిన భావాన్ని సహజంగా అందిస్తుంది.
- source_word: שִׁלֵּחוּ
  choice: వెళ్లనిచ్చారు
  rationale: ఈ సందర్భంలో పంపివేయడం కంటే ప్రాణాలతో విడిచిపెట్టి వెళ్లనివ్వడం అనే భావం ప్రధానమైనది.
- source_word: כָּל מִשְׁפַּחְתּוֹ
  choice: అతని కుటుంబమంతటినీ
  rationale: מִשְׁפָּחָה కుటుంబం, ఇంటివారు లేదా విస్తృత వంశగుంపును సూచించగలదు; ప్రధాన పాఠ్యంలో సహజమైన విస్తృత పదంగా ‘కుటుంబం’ వాడబడింది.
- source_word: הָאִישׁ
  choice: ఆ మనిషిని
  rationale: మునుపటి వచనంలో పేర్కొన్న వ్యక్తిని తిరిగి సూచిస్తున్నందున తెలుగు కథనంలో ‘ఆ మనిషి’ స్పష్టంగా ఉంటుంది.
