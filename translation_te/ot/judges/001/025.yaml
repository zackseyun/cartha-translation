translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కథన శైలి. హీబ్రూ నుడికారాన్ని ప్రధాన పాఠ్యంలో అర్థస్పష్టంగా ఇచ్చి, దాని అక్షరార్థాన్ని పాదసూచికలో నిలిపాం; מִשְׁפָּחָה పదంలోని కుటుంబం/ఇంటివారు/వంశం అనే పరిధిని కూడా పాదసూచికలో సంరక్షించాం.
