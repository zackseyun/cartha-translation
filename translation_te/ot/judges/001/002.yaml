source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוָ֖ה יְהוּדָ֣ה יַעֲלֶ֑ה הִנֵּ֛ה נָתַ֥תִּי אֶת הָ/אָ֖רֶץ בְּ/יָדֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/002.yaml
  text: And the LORD said, “Judah shall go up. Look, I have given the land into his hand.”
translation:
  language: te
  text: 'యెహోవా ఇలా అన్నాడు: “యూదా పైకి వెళ్లాలి. ఇదిగో, దేశాన్ని అతని చేతికి ఇచ్చాను.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన రూపంలో వ్యక్తిగత నామంగా నిలిపింది.
- source_word: יְהוּדָה
  choice: యూదా గోత్రం
  rationale: ఈ సందర్భంలో వ్యక్తి కాక గోత్రం ఉద్దేశించబడింది; సాధారణ పాఠకుడికి సూచన స్పష్టంగా ఉండేందుకు ‘గోత్రం’ చేర్చబడింది.
- source_word: יַעֲלֶה
  choice: ముందుకు వెళ్లాలి
  rationale: సైనిక కార్యానికి బయలుదేరడం అనే సందర్భార్థాన్ని సహజమైన ఆధునిక తెలుగులో తెలిపింది; పదశః ‘పైకి వెళ్లాలి’ ఇక్కడ అపార్థానికి దారితీయవచ్చు.
- source_word: הִנֵּה
  choice: ఇదిగో
  rationale: శ్రద్ధను ఆకర్షించి, తరువాతి ప్రకటనకు బలం ఇచ్చే హీబ్రూ ఉద్ఘాటనను నిలిపింది.
- source_word: נָתַתִּי אֶת־הָאָרֶץ בְּיָדוֹ
  choice: ఆ దేశాన్ని అతని చేతికి అప్పగించాను
  rationale: హీబ్రూ సంపూర్ణ క్రియలోని నిశ్చయతను, ‘చేతిలో ఇవ్వడం’ అనే ఆధిపత్య/విజయ భావాన్ని తెలుగు ప్రయోగంతో సంరక్షించింది.
theological_decisions:
- issue: దేవుడు దేశాన్ని అప్పగించినట్లు సంపూర్ణ కాలంలో చెప్పడం
  choice: అప్పగించాను
  alternative: అప్పగిస్తాను
  rationale: సైనిక స్వాధీనం ఇంకా పూర్తికాకపోయినా, మూలంలోని נָתַתִּי సంపూర్ణ రూపం దేవుని నిర్ణయ నిశ్చయతను ఉద్దేశపూర్వకంగా వ్యక్తం చేస్తుంది; దాన్ని భవిష్యత్ కాలంగా మార్చలేదు.
- issue: యూదాకు ఏకవచన సర్వనామ సూచన
  choice: అతని చేతికి
  alternative: వారి చేతికి
  rationale: గోత్రాన్ని సమష్టి వ్యక్తిగా చూపే మూలంలోని ఏకవచన וֹను నిలిపి, దాని భావతీవ్రతను బహువచనంగా సవరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్య నిర్మాణం. మూలంలోని దైవనామం, ఉద్ఘాటన, ఏకవచన సమష్టి సూచన, ప్రవచనాత్మక సంపూర్ణ కాలం నిలుపబడ్డాయి.
