  text: The house of Joseph also went up against Bethel[a], and Yahweh was with them.
translation:
  language: te
  text: యోసేపు వంశస్థులు కూడా బేతేలు మీదికి దండెత్తి వెళ్లారు[a]. యెహోవా వారికి తోడుగా ఉన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “బేతేలుకు వెళ్లారు.” హీబ్రూ క్రియ అక్షరార్థంగా “పైకి వెళ్లారు” అని చెబుతుంది; ఈ సైనిక సందర్భంలో అది పట్టణం మీదికి దండెత్తి వెళ్లడాన్ని సూచించే అవకాశం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: ఎదురుగా దండెత్తి వెళ్లారు
  rationale: עלה అనే క్రియకు అక్షరార్థంగా ‘పైకి వెళ్లడం’ అని అర్థం. అయితే ఇక్కడ సైనిక సందర్భంలో ఒక పట్టణాన్ని లక్ష్యంగా చేసుకొని ముందుకు సాగడాన్ని సూచిస్తోంది. ‘ఎదురుగా దండెత్తి వెళ్లారు’ అనే అనువాదం ఆ శత్రుత్వ సందర్భాన్ని సహజమైన తెలుగులో స్పష్టం చేస్తుంది.
- source_word: בֵית יוֹסֵף
  choice: యోసేపు వంశస్థులు
  rationale: అక్షరార్థం ‘యోసేపు ఇల్లు.’ ఇక్కడ అది యోసేపు సంతతికి చెందిన గోత్రీయ సమూహాన్ని సూచిస్తుంది. ఆధునిక తెలుగు పాఠకులకు ‘యోసేపు వంశస్థులు’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: גַּם הֵם
  choice: కూడా
  rationale: ముందు చెప్పబడిన గోత్రాల యుద్ధ చర్యలకు ఈ చర్యను జోడిస్తుంది. తెలుగులో ‘కూడా’ ఈ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: בֵּית אֵל
  choice: బేతేలు
  rationale: స్థలనామానికి తెలుగులో ప్రాచుర్యంలో ఉన్న లిప్యంతరీకరణను ఉపయోగించాం.
- source_word: וַיהוָה
  choice: యెహోవా
  rationale: మూలపాఠంలోని దేవుని ప్రత్యేక నామం יהוהను సాధారణ బిరుదుతో భర్తీ చేయకుండా, తెలుగులో సుపరిచితమైన ‘యెహోవా’ రూపంలో అందించాం.
- source_word: עִמָּם
  choice: వారికి తోడుగా ఉన్నాడు
  rationale: עם అనే పదబంధం ఇక్కడ దేవుని సన్నిధి, సహాయం రెండింటినీ సూచించగలదు. ‘తోడుగా ఉన్నాడు’ ఆ భావాలను అతిగా వివరించకుండా సహజంగా నిలుపుతుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: హీబ్రూ మూలంలో ప్రత్యేక దైవనామం ప్రత్యక్షంగా ఉంది. తెలుగు బైబిలు వాడుకలో విస్తృతంగా తెలిసిన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం; ‘యాహ్వే’ మూల ఉచ్చారణను ప్రతిబింబించే సాధ్యమైన ప్రత్యామ్నాయం.
- issue: దేవుడు ‘వారితో ఉన్నాడు’ అనే మాటలోని భావం
  choice: వారికి తోడుగా ఉన్నాడు
  alternative: వారితో ఉన్నాడు
  rationale: సైనిక సందర్భంలో ఈ మాట దైవసన్నిధితో పాటు సహకారాన్ని కూడా సూచిస్తుంది. అయినా విజయానికి సంబంధించిన అదనపు ప్రకటనను చేర్చకుండా మూలంలోని సంక్షిప్తతను కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని ఉపయోగించాం. గోత్రీయ పదబంధాన్ని అక్షరానువాదమైన ‘యోసేపు ఇల్లు’గా కాకుండా అర్థస్పష్టమైన ‘యోసేపు వంశస్థులు’గా ఇచ్చాం. సైనిక భావాన్ని ప్రధాన పాఠంలో స్పష్టం చేస్తూనే, మూలంలోని సాధారణ గమనార్థాన్ని పాదసూచికలో నిలిపాం.
