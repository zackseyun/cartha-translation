  text: And the house of Joseph spied out Bethel[a]; formerly the name of the city was Luz.
translation:
  language: te
  text: యోసేపు ఇంటివారు బేతేలును వేగుచూశారు[a]; ఆ పట్టణం పేరు పూర్వం లూజు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘బేతేలును నిఘా వేశారు’ లేదా ‘బేతేలును పరిశీలించారు.’ ఇక్కడి హీబ్రూ క్రియ సందర్భానుసారం ఒక ప్రాంతాన్ని గూఢంగా పరిశీలించడం లేదా దానిపై నిఘా వేయడం అనే భావాన్ని ఇస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּתִירוּ
  choice: వేగుచూశారు
  rationale: ఈ సందర్భంలో ఈ క్రియ సైనిక చర్యకు ముందుగా ఒక ప్రాంతాన్ని గూఢంగా పరిశీలించడం లేదా దాని వివరాలు తెలుసుకోవడం అనే భావాన్ని ఇస్తుంది. ఆధునిక తెలుగులో ‘వేగుచూశారు’ సంక్షిప్తంగా, సహజంగా ఆ భావాన్ని వ్యక్తపరుస్తుంది.
- source_word: בֵית יוֹסֵף
  choice: యోసేపు వంశస్థులు
  rationale: అక్షరార్థంగా ‘యోసేపు ఇంటివారు/గృహం’ అయినా, ఇక్కడ అది యోసేపు సంతతికి చెందిన సామూహిక గోత్ర సముదాయాన్ని సూచిస్తుంది. ‘వంశస్థులు’ సాధారణ పాఠకులకు సహజంగా ఉండి, దాని సామూహిక భావాన్ని నిలుపుతుంది.
- source_word: בְּבֵית אֵל
  choice: బేతేలును
  rationale: ముందున్న క్రియతో కలిసిన בְ ఉపసర్గ వేగుచూడబడిన స్థలాన్ని సూచిస్తుంది. తెలుగులో కర్మవిభక్తితో ‘బేతేలును వేగుచూశారు’ సహజంగా ఉంటుంది.
- source_word: וְשֵׁם הָעִיר
  choice: ఆ పట్టణం పేరు
  rationale: హీబ్రూ నిర్మాణంలోని భావాన్ని సహజమైన ఆధునిక తెలుగు పదక్రమంలో అందిస్తుంది.
- source_word: לְפָנִים
  choice: పూర్వం
  rationale: గతంలో ఉన్న పరిస్థితిని సూచించే సరళమైన, గౌరవప్రదమైన ఆధునిక తెలుగు పదం.
- source_word: לוּז
  choice: లూజు
  rationale: స్థలనామాన్ని తెలుగు ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించింది.
