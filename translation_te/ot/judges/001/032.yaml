source:
  edition: WLC
  text: וַ/יֵּ֨שֶׁב֙ הָ/אָ֣שֵׁרִ֔י בְּ/קֶ֥רֶב הַֽ/כְּנַעֲנִ֖י יֹשְׁבֵ֣י הָ/אָ֑רֶץ כִּ֖י לֹ֥א הוֹרִישֽׁ/וֹ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/032.yaml
  text: So the Asherites lived among the Canaanites[a], the inhabitants of the land, because they did not drive them out.
translation:
  language: te
  text: కాబట్టి ఆషేరు గోత్రస్థులు దేశ నివాసులైన కనానీయుల మధ్య నివసించారు; ఎందుకంటే వారు కనానీయులను వెళ్లగొట్టలేదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూలో అక్షరార్థంగా సమష్టి ఏకవచన రూపాలు ఉన్నాయి: ‘ఆషేరీయుడు ... కనానీయుడు ... అతడు అతణ్ణి వెళ్లగొట్టలేదు.’ ఇక్కడ ఉద్దేశించిన సమష్టి భావాన్ని తెలుగులో బహువచనంగా ఇచ్చాం.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: నివసించారు
  rationale: ישׁב ఇక్కడ ఒక ప్రజాసమూహం మరొక ప్రజాసమూహం మధ్య ఉండడాన్ని సూచిస్తుంది. ఆధునిక ప్రామాణిక తెలుగులో ‘నివసించారు’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: הָאָשֵׁרִי
  choice: ఆషేరు గోత్రస్థులు
  rationale: వ్యాకరణపరంగా ఏకవచన జాతివాచక రూపమైనా, సందర్భంలో ఇది ఆషేరు గోత్రాన్ని సమష్టిగా సూచిస్తుంది. వ్యక్తి ఆషేరుతో గందరగోళం రాకుండా ‘గోత్రస్థులు’ అని వ్యక్తీకరించబడింది.
- source_word: בְּקֶרֶב
  choice: మధ్య
  rationale: ఈ పదబంధం ఒక సమూహం నడుమ నివసించడాన్ని సూచిస్తుంది; ‘మధ్య’ సంక్షిప్తమైన, సహజమైన తెలుగు రూపం.
- source_word: הַכְּנַעֲנִי
  choice: కనానీయులు
  rationale: రూపపరంగా ఏకవచనమైనప్పటికీ ఇది సమష్టివాచకం; వెంట వచ్చే బహువచన కృదంతం కూడా దేశంలో నివసించే కనానీయుల సమూహాన్నే సూచిస్తుంది.
- source_word: יֹשְׁבֵי הָאָרֶץ
  choice: దేశ నివాసులైన
  rationale: ఈ కృదంత పదబంధం కనానీయులను మరింతగా గుర్తిస్తుంది. తెలుగులో విశేషణాత్మకంగా ‘దేశ నివాసులైన’ అని ఉంచడం సహజంగా ఉంటుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ఇక్కడ כִּי ముందటి ప్రకటనకు కారణాన్ని పరిచయం చేస్తుంది; ‘ఎందుకంటే’ ఆ కారణ సంబంధాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: לֹא הוֹרִישׁוֹ
  choice: వారు కనానీయులను వెళ్లగొట్టలేదు
  rationale: న్యాయాధిపతులు గ్రంథంలోని ఈ సందర్భంలో ירשׁ హిఫీల్ రూపం దేశ నివాసులను తొలగించడం లేదా వెళ్లగొట్టడం అనే భావాన్ని ఇస్తుంది. ‘వెళ్లగొట్టలేదు’ సాధారణ పాఠకులకు సహజంగా ఉంటుంది; అస్పష్టత రాకుండా సమష్టి కర్మను మళ్లీ పేర్కొనబడింది.
theological_decisions:
- issue: గోత్రం మరియు ప్రజాసమూహానికి వాడిన సమష్టి ఏకవచనాలు
  choice: ఆషేరు గోత్రస్థులు, కనానీయులు, వారు అనే సహజమైన బహువచన సమష్టి రూపాల్లో అనువదించడం
  alternative: ‘ఆషేరీయుడు కనానీయుని మధ్య నివసించాడు; అతడు అతణ్ణి వెళ్లగొట్టలేదు’ అని రూపపరమైన ఏకవచనాలను నిలుపుకోవడం
  rationale: హీబ్రూలో గోత్రాలు, జాతులను సమష్టిగా సూచించేందుకు ఏకవచనం సాధారణం. తెలుగులో దాన్ని అక్షరార్థ ఏకవచనంగా ఉంచితే ఇద్దరు వ్యక్తుల గురించిన వాక్యంలా తప్పుదారి పట్టించవచ్చు. సందర్భం గోత్రం దేశ నివాసులను వెళ్లగొట్టకపోవడాన్ని చెబుతోంది; అందువల్ల బహువచనం మూల భావాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే గంభీరతను నిలుపుతూ అనువదించబడింది. మూలంలోని కారణ సంబంధం, కనానీయులను గుర్తించే అనుబంధ పదబంధం, సమష్టి భావం కాపాడబడ్డాయి.
