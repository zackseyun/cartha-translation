  text: וַ/יְהִ֤י יְהוָה֙ אֶתּ יְהוּדָ֔ה וַ/יֹּ֖רֶשׁ אֶת הָ/הָ֑ר כִּ֣י לֹ֤א לְ/הוֹרִישׁ֙ אֶת יֹשְׁבֵ֣י הָ/עֵ֔מֶק כִּי רֶ֥כֶב בַּרְזֶ֖ל לָ/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/019.yaml
  text: And Yahweh was with Judah[a], and he took possession of the hill country; but he could not drive out the inhabitants of the valley, because they had iron chariots.
translation:
  language: te
  text: యహ్వే యూదాతో ఉన్నాడు. యూదా కొండ ప్రాంతాన్ని స్వాధీనం చేసుకున్నాడు. అయితే లోయలో నివసించేవారికి ఇనుప రథాలు ఉండడం వల్ల వారిని వెళ్లగొట్టలేకపోయాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘లోయ’కు బదులు ‘మైదాన ప్రాంతం’ లేదా ‘పల్లపు ప్రాంతం’ అని కూడా అనువదించవచ్చు; హీబ్రూ పదం విశాలమైన పల్లపు భూభాగాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన YHWHను తెలుగులో సుపరిచితమైన ‘యెహోవా’గా లిప్యంతరీకరించాం.
- source_word: אֶת־יְהוּדָה
  choice: యూదాతో
  rationale: ఇక్కడ אֵת ప్రత్యక్ష కర్మ సూచిక కాదు; సహవాసాన్ని సూచిస్తుంది. ‘యూదా’ అనే పేరు గోత్రానికి సంకేతంగా నిలుస్తుంది.
- source_word: וַיֹּרֶשׁ אֶת־הָהָר
  choice: యూదా కొండ ప్రాంతాన్ని స్వాధీనం చేసుకున్నాడు
  rationale: హిఫిల్ రూపంలోని ירש ఇక్కడ ఒకే కొండను కాక భౌగోళిక ఎత్తైన ప్రాంతాన్ని స్వాధీనం చేసుకోవడాన్ని సూచిస్తుంది. తెలుగు వాక్యంలో కర్త స్పష్టత కోసం ‘యూదా’ను పునరుక్తం చేశాం.
- source_word: כִּי לֹא לְהוֹרִישׁ
  choice: అయితే ... వెళ్లగొట్టలేకపోయాడు
  rationale: హీబ్రూ వాక్యభాగం సంక్షిప్తంగా ఉన్నా, తరువాత చెప్పిన ఇనుప రథాల కారణం అసమర్థతను సూచిస్తుంది. ముందటి విజయంతో ఉన్న వ్యత్యాసాన్ని ‘అయితే’ సహజంగా తెలియజేస్తుంది.
- source_word: יֹשְׁבֵי הָעֵמֶק
  choice: లోయలో నివసించేవారిని
  rationale: కృదంత నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరిచాం; עֵמֶק యొక్క సాధారణ అర్థం ‘లోయ’ను ప్రధాన పాఠంలో ఉంచాం.
- source_word: רֶכֶב בַּרְזֶל לָהֶם
  choice: వారికి ఇనుప రథాలు ఉండడం వల్ల
  rationale: לָהֶם తెలిపే స్వామ్య భావాన్ని సహజమైన తెలుగులో ఉంచి, ఈ మాట ముందున్న వైఫల్యానికి కారణమని స్పష్టం చేశాం.
theological_decisions:
- issue: యెహోవా యూదాతో ఉన్నప్పటికీ లోయవాసులను వెళ్లగొట్టలేకపోవడం
  choice: వెళ్లగొట్టలేకపోయిన కర్త యూదా అని స్పష్టంగా అనువదించి, వచనంలోని ఉద్రిక్తతను అలాగే ఉంచడం
  alternative: ‘వెళ్లగొట్టలేదు’ అని మాత్రమే చెప్పడం లేదా యెహోవా సమక్షంలో అసమర్థత కనిపించకుండా భావాన్ని సవరించడం
  rationale: సందర్భం ఇనుప రథాల సైనిక ఆధిక్యం వల్ల యూదా విజయం సాధించలేదని సహజంగా సూచిస్తుంది. యెహోవా అతనితో ఉన్నాడనే మొదటి ప్రకటనతో ఏర్పడే ధార్మిక ఉద్రిక్తతను అనువాదం పరిష్కరించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన శైలి. హీబ్రూ ఏకవచన క్రియకు అనుగుణంగా ‘యూదా’ను సమూహవాచకంగా తీసుకుని ఏకవచన క్రియలను వాడాం; రెండో వాక్యంలో కర్తను పునరుక్తం చేసి అస్పష్టతను తగ్గించాం.
