source:
  edition: WLC
  text: וַ/יִּלְחֲצ֧וּ הָ/אֱמֹרִ֛י אֶת בְּנֵי דָ֖ן הָ/הָ֑רָ/ה כִּי לֹ֥א נְתָנ֖/וֹ לָ/רֶ֥דֶת לָ/עֵֽמֶק־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/034.yaml
  text: And the Amorites pressed the sons of Dan back into the hill country[a], because they did not allow them to go down into the valley.
translation:
  language: te
  text: అమోరీయులు దాను కుమారులను కొండప్రాంతంలోకి నెట్టివేశారు[a]; ఎందుకంటే వారు లోయలోకి దిగడానికి వారిని అనుమతించలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “అమోరీయుడు దాను కుమారులను కొండప్రాంతం వైపు నెట్టాడు; ఎందుకంటే అతడు అతన్ని లోయలోకి దిగనివ్వలేదు.” హీబ్రూలో ‘అమోరీయుడు’ మరియు చివరి సర్వనామం సమష్టి ఏకవచన రూపాల్లో ఉన్నాయి; సందర్భంలోని భావం మాత్రం బహువచనం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלְחֲצוּ
  choice: నెట్టివేశారు
  rationale: לָחַץ అనే క్రియ ఒత్తిడి చేయడం, అణచివేయడం లేదా ఇరుకైన స్థితిలోకి బలవంతంగా నెట్టడం అనే భావాలను ఇస్తుంది. దిశను సూచించే తరువాతి పదబంధంతో కలిసి, శత్రుత్వపూర్వకంగా వెనక్కి నెట్టిన భావాన్ని ఇది సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: הָאֱמֹרִי
  choice: అమోరీయులు
  rationale: హీబ్రూలో రూపం ఏకవచనమైనా, ఇక్కడ అది ఒక జనసమూహాన్ని సూచించే సమష్టి ఏకవచనం. తెలుగులో సందర్భానుగుణమైన బహువచనం సహజంగా ఉంటుంది.
- source_word: בְּנֵי דָן
  choice: దాను కుమారులను
  rationale: హీబ్రూ గోత్రసంబంధమైన కుటుంబ అభివ్యక్తిని నిలుపుతూ, ఆధునిక తెలుగులో అర్థమయ్యే విధంగా అనువదించబడింది.
- source_word: הָהָרָה
  choice: కొండప్రాంతంలోకే
  rationale: దిశార్థక ప్రత్యయం కొండప్రాంతం వైపు లేదా అందులోకి కదలికను సూచిస్తుంది. తరువాతి ‘లోయ’తో ఉన్న భౌగోళిక వ్యత్యాసాన్ని ‘కొండప్రాంతం’ స్పష్టంగా చూపిస్తుంది; ‘కే’ వారు అక్కడికే పరిమితం చేయబడిన సందర్భార్థాన్ని తెలియజేస్తుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ఇక్కడ כִּי ముందటి చర్యకు కారణాన్ని పరిచయం చేస్తుంది.
- source_word: לֹא נְתָנוֹ
  choice: వారు ... వారిని అనుమతించలేదు
  rationale: హీబ్రూ వ్యాకరణ రూపం సమష్టి ఏకవచన కర్తను, ఏకవచన సర్వనామ ప్రత్యయాన్ని వాడుతుంది. సందర్భంలో అమోరీయుల సమూహం దాను వంశీయుల సమూహాన్ని అడ్డుకున్నందున, తెలుగులో బహువచన భావం సహజంగా వ్యక్తీకరించబడింది.
- source_word: לָרֶדֶת
  choice: దిగడానికి
  rationale: కొండప్రాంతం నుండి లోయకు జరిగే భౌగోళిక కదలికను సహజంగా సూచిస్తుంది.
- source_word: לָעֵמֶק
  choice: లోయలోకి
  rationale: עֵמֶק లోయను లేదా దిగువ భూభాగాన్ని సూచిస్తుంది. కొండప్రాంతానికి వ్యతిరేకంగా ఇక్కడ ‘లోయ’ ప్రత్యక్షమైన, సందర్భోచితమైన పదం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ‘దాను కుమారులు’ అనే మూలంలోని గోత్రపరమైన అభివ్యక్తి నిలుపబడింది. సమష్టి ఏకవచన రూపాల మూలభాషా లక్షణం పాదటిప్పణిలో వెల్లడించబడింది.
