source:
  edition: WLC
  text: זְבוּלֻ֗ן לֹ֤א הוֹרִישׁ֙ אֶת יוֹשְׁבֵ֣י קִטְר֔וֹן וְ/אֶת יוֹשְׁבֵ֖י נַהֲלֹ֑ל וַ/יֵּ֤שֶׁב הַֽ/כְּנַעֲנִי֙ בְּ/קִרְבּ֔/וֹ וַ/יִּֽהְי֖וּ לָ/מַֽס־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/030.yaml
  text: Zebulun did not drive out the inhabitants of Kitron or the inhabitants of Nahalol[b][a], so the Canaanites lived among them and became forced laborers.
translation:
  language: te
  text: జెబులూను కిత్రోను నివాసులను, నహలోలు[a] నివాసులను వెళ్లగొట్టలేదు. కనానీయులు వారి మధ్య[b] నివసిస్తూ వెట్టిచాకిరికి గురయ్యారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నహలాలు’ అని కూడా ఉండవచ్చు; ఇతర సంబంధిత వచనాల్లోనూ, అనువాద సంప్రదాయాల్లోనూ ఆ స్థలనామ రూపం కనిపిస్తుంది.
    reason: alternative_reading
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా, ‘కనానీయుడు అతని/దాని మధ్య నివసించాడు’ అని ఉంది. ఇక్కడ ‘కనానీయుడు’ ఆ ప్రజలను సమష్టిగా, ఏకవచన ప్రత్యయం జెబులూను గోత్రాన్ని సమష్టిగా సూచిస్తున్నాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹרִישׁ
  choice: వెళ్లగొట్టలేదు
  rationale: న్యాయాధిపతులు 1లో హిఫీల్ రూపం ఆ ప్రాంతపు పూర్వ నివాసులను తొలగించడాన్ని సూచిస్తుంది. ‘వెళ్లగొట్టు’ ఆధునిక తెలుగులో సహజంగా ఉండి, సైనిక-స్థిరనివాస సందర్భానికి సరిపోతుంది.
- source_word: יוֹשְׁבֵי
  choice: నివాసులు
  rationale: ישב క్రియ యొక్క కృదంత రూపం ఒక స్థలంలో నివసించేవారిని సూచిస్తుంది; ‘నివాసులు’ సంక్షిప్తమైన, సహజమైన తెలుగు పదం.
- source_word: קִטְרוֹן
  choice: కిత్రోను
  rationale: స్థలనామాన్ని హీబ్రూ ఉచ్చారణకు సమీపంగా లిప్యంతరీకరించాం.
- source_word: נַהֲלֹל
  choice: నహలోలు
  rationale: ఈ వచనంలోని మసొరా స్వరచిహ్నాలు సూచించే Nahalol రూపానికి సమీపంగా లిప్యంతరీకరించాం.
- source_word: וַיֵּשֶׁב הַכְּנַעֲנִי בְּקִרְבּוֹ
  choice: కనానీయులు అతని మధ్యనే నివసించి
  rationale: הַכְּנַעֲנִי వ్యాకరణపరంగా ఏకవచనమైనా ఒక ప్రజాసమూహాన్ని సూచిస్తుంది; అందువల్ల తెలుగులో ‘కనానీయులు’ అని బహువచనంగా ఇచ్చాం. בְּקִרְבּוֹ లోని ఏకవచన ప్రత్యయం గోత్రంగా జెబులూనును సమష్టిగా సూచించే రూపం; మూలంలోని ఆ రూపాన్ని ప్రధాన పాఠంలో నిలిపి, పాదసూచికలో వివరించాం.
- source_word: לָמַס
  choice: వెట్టిచాకిరి
  rationale: מַס ఇక్కడ కేవలం ధనరూప కప్పాన్ని కాక, ఆధీన జనులపై మోపిన నిర్బంధ శ్రమను సూచిస్తుంది. ‘వెట్టిచాకిరి’ ఆ బలవంతపు శ్రమ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: וַיִּהְיוּ לָמַס
  choice: వెట్టిచాకిరి చేసేవారయ్యారు
  rationale: ఈ వాక్యభాగం కనానీయులకు ఏర్పడిన నిర్బంధ శ్రమ స్థితిని సూచిస్తుంది. తెలుగులో వ్యక్తులనే శ్రమగా పేర్కొనకుండా, ‘చేసేవారయ్యారు’ అని సహజంగా వ్యక్తీకరించాం.
theological_decisions:
- issue: הַכְּנַעֲנִי అనే సమష్టి ఏకవచనం మరియు בְּקִרְבּוֹ లోని ఏకవచన ప్రత్యయం
  choice: ‘కనానీయులు అతని మధ్యనే నివసించి’ అని అనువదించడం
  alternative: ‘కనానీయుడు అతని/దాని మధ్య నివసించి’ లేదా ‘కనానీయులు వారి మధ్య నివసించి’
  rationale: హీబ్రూలో ప్రజలను సమష్టి ఏకవచనంతోను, ఒక గోత్రాన్ని వ్యక్తివలె ఏకవచనంతోను సూచించడం సాధారణం. కనానీయులను తెలుగులో సహజమైన బహువచనంగా ఇచ్చి, జెబులూను గోత్రాన్ని సూచించే మూల ఏకవచనాన్ని ‘అతని’ ద్వారా నిలిపాం; దాని భావాన్ని పాదసూచిక స్పష్టం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన శైలిని అనుసరించాం. స్థలనామాలను లిప్యంతరీకరించాం. ‘వెట్టిచాకిరి’ ద్వారా నిర్బంధ శ్రమ భావాన్ని సామాన్య పాఠకులకు స్పష్టంగా ఉంచాం; హీబ్రూ సమష్టి ఏకవచనంలోని ఉద్వేగాన్ని పూర్తిగా తొలగించకుండా పాదసూచికతో సంరక్షించాం.
