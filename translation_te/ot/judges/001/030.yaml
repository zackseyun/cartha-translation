revisions:
- from: జెబులూను కిత్రోను నివాసులను, నహలోలు[a] నివాసులను వెళ్లగొట్టలేదు. కనానీయులు అతని మధ్యనే[b] నివసించి, వెట్టిచాకిరి చేసేవారయ్యారు.
  to: జెబులూను కిత్రోను నివాసులను, నహలోలు[a] నివాసులను వెళ్లగొట్టలేదు. కనానీయులు వారి మధ్య[b] నివసిస్తూ వెట్టిచాకిరికి గురయ్యారు.
  rationale: The revision replaces a mechanically literal singular pronoun with idiomatic Telugu while retaining the source-language feature in a footnote. It also changes the final expression to state explicitly that the Canaanites were subjected to forced labor, which is the contextual force of לָמַס. No disputed reading is resolved beyond the documented place-name variant.
