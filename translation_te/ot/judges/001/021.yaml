id: JDG.1.21
reference: Judges 1:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אֶת הַ/יְבוּסִי֙ יֹשֵׁ֣ב יְרֽוּשָׁלִַ֔ם לֹ֥א הוֹרִ֖ישׁוּ בְּנֵ֣י בִנְיָמִ֑ן וַ/יֵּ֨שֶׁב הַ/יְבוּסִ֜י אֶת בְּנֵ֤י בִנְיָמִן֙ בִּ/יר֣וּשָׁלִַ֔ם עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/021.yaml
  text: But the sons of Benjamin did not drive out the Jebusites who were living in Jerusalem[a], so the Jebusites have lived with the sons of Benjamin in Jerusalem to this day.
translation:
  language: te
  text: అయితే యెరూషలేములో నివసిస్తున్న యెబూసీయులను బెన్యామీను గోత్రస్థులు తరిమివేయలేదు. యెబూసీయులు బెన్యామీను గోత్రస్థులతో కలిసి యెరూషలేములో ఈ దినం వరకు నివసిస్తూ వచ్చారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַיְבוּסִי
  choice: యెబూసీయులు
  rationale: హీబ్రూ రూపం ఏకవచనంలో ఉన్నా, అది యెబూసీయుల ప్రజాసమూహాన్ని సమష్టిగా సూచిస్తోంది. ఆధునిక తెలుగులో బహువచనం సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: יֹשֵׁב יְרוּשָׁלַם
  choice: యెరూషలేములో నివసిస్తున్న
  rationale: వర్తమాన కృదంతం అక్కడ కొనసాగుతున్న నివాసాన్ని సూచిస్తుంది; ‘నివసిస్తున్న’ ఆ స్థితిని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: הוֹרִישׁוּ
  choice: వెళ్లగొట్టలేదు
  rationale: ఈ స్వాధీన-స్థిరనివాస సందర్భంలో క్రియ అక్కడి నివాసులను బయటకు పంపడం లేదా తొలగించడం అనే భావాన్ని ఇస్తుంది. ‘వెళ్లగొట్టలేదు’ సాధారణ పాఠకులకు స్పష్టంగా ఉంటుంది.
- source_word: בְּנֵי בִנְיָמִן
  choice: బెన్యామీను వంశస్థులు
  rationale: అక్షరార్థంగా ‘బెన్యామీను కుమారులు’ అయినా, ఇక్కడ బెన్యామీను గోత్ర ప్రజలను సూచిస్తుంది. ‘వంశస్థులు’ గోత్రసంబంధ భావాన్ని కాపాడుతూ తెలుగులో అపార్థాన్ని నివారిస్తుంది.
- source_word: וַיֵּשֶׁב
  choice: నివసిస్తున్నారు
  rationale: క్రియకు వెంట ‘నేటివరకు’ అనే కాలవ్యక్తీకరణ ఉండడం వల్ల, కథకుని కాలం వరకు కొనసాగిన నివాసస్థితిని తెలుగులో వర్తమాన రూపం సహజంగా వ్యక్తపరుస్తుంది.
- source_word: אֶת בְּנֵי בִנְיָמִן
  choice: బెన్యామీను వంశస్థులతో కలిసి
  rationale: ఇక్కడ אֶת ప్రత్యక్ష కర్మ సూచికగా కాక సహవాసాన్ని సూచించే పదంగా పనిచేస్తుంది. ‘తో కలిసి’ ఇరువర్గాల సహనివాసాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: నేటివరకు
  rationale: కథకుని వర్తమాన కాలం వరకు ఆ పరిస్థితి కొనసాగిందని తెలిపే హీబ్రూ కాలసూత్రానికి ఇది సహజమైన తెలుగు సమానం.
- source_word: וְ
  choice: అయితే
  rationale: సందర్భంలో ముందున్న జయవివరణలకు భిన్నంగా, బెన్యామీను వంశస్థులు వారిని వెళ్లగొట్టలేదనే వ్యత్యాసాన్ని ఈ అనుసంధానం చూపిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలిని ఉపయోగించాం. గోత్రసూచకమైన ‘బెన్యామీను కుమారులు’ అనే అక్షరార్థం తెలుగులో వ్యక్తిగత సంతానమనే అపార్థం కలిగించవచ్చు కాబట్టి ‘బెన్యామీను వంశస్థులు’ అని అనువదించాం.
