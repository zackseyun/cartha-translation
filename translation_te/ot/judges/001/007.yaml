source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֲדֹֽנִי בֶ֗זֶק שִׁבְעִ֣ים מְלָכִ֡ים בְּֽהֹנוֹת֩ יְדֵי/הֶ֨ם וְ/רַגְלֵי/הֶ֜ם מְקֻצָּצִ֗ים הָי֤וּ מְלַקְּטִים֙ תַּ֣חַת שֻׁלְחָנִ֔/י כַּ/אֲשֶׁ֣ר עָשִׂ֔יתִי כֵּ֥ן שִׁלַּם לִ֖/י אֱלֹהִ֑ים וַ/יְבִיאֻ֥/הוּ יְרוּשָׁלִַ֖ם וַ/יָּ֥מָת שָֽׁם־׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/007.yaml
  text: And Adoni-bezek said[a], “Seventy kings, with the thumbs of their hands and their feet cut off, used to gather scraps under my table. As I have done, so God has repaid me.” And they brought him to Jerusalem[b], and he died there.
translation:
  language: te
  text: 'అదోనీ-బెజెకు ఇలా అన్నాడు: “చేతుల బొటనవేళ్లూ, కాళ్ల బొటనవేళ్లూ నరికివేయబడిన[a] డెబ్బై మంది రాజులు నా బల్ల కింద తునకలను ఏరుకునేవారు. నేను ఎలా చేశానో, దేవుడు[b] నాకు అలాగే ప్రతిగా చెల్లించాడు.” తరువాత వారు అతణ్ణి యెరూషలేముకు తీసుకువచ్చారు; అతడు అక్కడ చనిపోయాడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పదం చేతికి సంబంధించినప్పుడు చేతి బొటనవేలును, కాలికి సంబంధించినప్పుడు కాలి బొటనవేలును సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ ‘దేవుడు’గా అనువదించిన హీబ్రూ పదం రూపపరంగా బహువచనమైనా, దానితో వచ్చిన క్రియ ఏకవచనంలో ఉంది; అందువల్ల ‘దేవతలు’ అని కాక ‘దేవుడు’ అని అనువదించబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנִי בֶזֶק
  choice: అదోనీ-బెజెకు
  rationale: సందర్భంలో ఇది వక్తను సూచించే పేరుగా పనిచేస్తోంది; అందువల్ల ‘బెజెకు ప్రభువు’ అని అర్థానువాదం చేయకుండా పేరుగా లిప్యంతరీకరించబడింది.
- source_word: בְּהֹנוֹת יְדֵיהֶם וְרַגְלֵיהֶם
  choice: చేతుల బొటనవేళ్లూ, కాళ్ల బొటనవేళ్లూ
  rationale: בֹּהֶן అనే పదం చేతికి సంబంధించినప్పుడు బొటనవేలును, కాలికి సంబంధించినప్పుడు కాలి బొటనవేలును సూచిస్తుంది. మూలంలోని రెండు అవయవాలనూ స్పష్టంగా, సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: מְקֻצָּצִים
  choice: నరికివేయబడిన
  rationale: קצץ పదంలోని పూర్తిగా వేరు చేయడం అనే భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: הָיוּ מְלַקְּטִים
  choice: ఏరుకునేవారు
  rationale: ఈ నిర్మాణం గతంలో అలవాటుగా, పదేపదే జరిగిన క్రియను సూచిస్తుంది; అందుకే సాధారణ భూతకాలం కంటే ‘ఏరుకునేవారు’ అనేది తగినది.
- source_word: תַּחַת שֻׁלְחָנִי
  choice: నా బల్ల కింద పడిన ముక్కలను
  rationale: ‘నా బల్ల కింద’ అనే స్థలార్థాన్ని నిలుపుతూ, לקט క్రియకు ఈ సందర్భంలో సహజంగా అర్థమయ్యే ఆహారపు ముక్కలను అంతర్భావంగా వ్యక్తం చేసింది.
- source_word: כַּאֲשֶׁר עָשִׂיתִי כֵּן שִׁלַּם לִי אֱלֹהִים
  choice: నేను ఎలా చేశానో, దేవుడు నాకు అలాగే తిరిగి చేశాడు
  rationale: చేసిన కార్యానికి సరితూగే దైవిక ప్రతిఫలం అనే తులనాత్మక నిర్మాణాన్ని, అదనపు సిద్ధాంత వివరణ లేకుండా, సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: וַיְבִיאֻהוּ יְרוּשָׁלִַם וַיָּמָת שָׁם
  choice: తరువాత వారు అతణ్ణి యెరూషలేముకు తీసుకువచ్చారు; అతడు అక్కడ చనిపోయాడు
  rationale: మూడవ పురుష బహువచన కర్తను, ఏకవచన కర్మను మరియు తరువాతి మరణాన్ని కథన క్రమంలో స్పష్టంగా ఉంచుతుంది.
theological_decisions:
- issue: అదోనీ-బెజెకు మాటలో אֱלֹהִים పదం ఎవరిని సూచిస్తుంది?
  choice: దేవుడు
  alternative: దేవతలు
  rationale: אֱלֹהִים రూపపరంగా బహువచనమైనా, దానితో వచ్చిన שִׁלַּם క్రియ ఏకవచనంలో ఉంది. కాబట్టి ఇక్కడ ‘దేవుడు’ అనేదే వ్యాకరణపరంగా బలమైన పఠనం; అయితే వక్తకు ఉన్న విశ్వాసం గురించి వాక్యం చెప్పేదానికంటే ఎక్కువగా నిర్ధారించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథనశైలి ఉపయోగించబడింది. ‘బల్ల’, ‘ఏరుకునేవారు’, ‘తిరిగి చేశాడు’ వంటి సహజ పదబంధాలతో మూలంలోని అవమానం, అలవాటైన గతక్రియ, చేసినదానికి తగిన ప్రతిఫలం అనే భావాలు నిలుపబడ్డాయి.
