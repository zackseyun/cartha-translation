  yaml_path: translation/ot/judges/001/011.yaml
  text: From there he went against the inhabitants of Debir[b][a]. (The former name of Debir was Kiriath-sepher.)
translation:
  language: te
  text: అక్కడి నుండి అతడు దెబీరు నివాసుల మీదికి[a] వెళ్లాడు. దెబీరు పూర్వనామం కిర్యత్-సేఫెరు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దెబీరు నివాసుల దగ్గరికి.” హీబ్రూ విభక్తి పదానికి అక్షరార్థంగా “వైపుకు/దగ్గరికి” అని అర్థం రావచ్చు; అయితే జయయాత్ర సందర్భంలో ఇది శత్రువుల మీదికి వెళ్లడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: కిర్యత్-సేఫెరు అనేది దెబీరు పూర్వనామం. ఈ పేరుకు “గ్రంథపు పట్టణం” లేదా “లేఖకుల పట్టణం” అనే అర్థం ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: అతడు వెళ్లాడు
  rationale: הלך క్రియ యొక్క సాధారణ కథన రూపం. సందర్భం సైనికమైనదైనా, మూలక్రియ స్వయంగా ‘దండెత్తాడు’ అనే నిర్దిష్ట భావాన్ని చెప్పదు.
- source_word: מִשָּׁם
  choice: అక్కడి నుండి
  rationale: ముందు ప్రస్తావించిన స్థలం నుండి కదలికను సూచించే సహజమైన తెలుగు ప్రయోగం.
- source_word: אֶל
  choice: మీదికి
  rationale: మూలంలో అక్షరార్థంగా ‘వైపుకు/దగ్గరకు’ అని ఉన్నా, ఇది జయయాత్ర సందర్భంలోని ప్రతికూల కదలిక. ‘మీదికి’ ఆ భావాన్ని సహజంగా తెలియజేస్తూ, క్రియను అతిగా నిర్దిష్టం చేయదు.
- source_word: יוֹשְׁבֵי
  choice: నివాసులు
  rationale: ישב యొక్క కృదంత రూపం ఇక్కడ ఒక ప్రాంతంలో నివసించేవారిని నామవాచకంగా సూచిస్తుంది.
- source_word: דְּבִיר
  choice: దెబీరు
  rationale: స్థలనామాన్ని ఆధునిక తెలుగు లిప్యంతరీకరణలో ఉంచాం.
- source_word: וְשֵׁם דְּבִיר לְפָנִים
  choice: దెబీరుకు పూర్వం ... అని పేరు
  rationale: లְפָנִים తెలిపే పూర్వకాల భావాన్ని సహజమైన ఆధునిక తెలుగు వాక్యనిర్మాణంలో వ్యక్తం చేస్తుంది.
- source_word: קִרְיַת סֵפֶר
  choice: కిర్యత్‌-సేఫెరు
  rationale: ఇది స్థలనామం కాబట్టి అర్థానువాదం చేయకుండా లిప్యంతరీకరించాం; దాని సాధ్యమైన వ్యుత్పత్తి అర్థాలను పాదసూచికలో ఇచ్చాం.
