revisions:
- from: నఫ్తాలి బేత్‌షెమెషు నివాసులను గానీ, బేత్‌అనాతు నివాసులను గానీ వెళ్లగొట్టలేదు. అతడు ఆ దేశ నివాసులైన కనానీయుల మధ్య నివసించాడు. అయితే బేత్‌షెమెషు, బేత్‌అనాతు నివాసులు వారికి నిర్బంధంగా పనిచేసేవారయ్యారు.[a]
  to: నఫ్తాలి బేత్‌షెమెష్ నివాసులను గానీ, బేత్‌అనాత్ నివాసులను గానీ వెళ్లగొట్టలేదు. కాబట్టి అతడు ఆ దేశ నివాసులైన కనానీయుల మధ్య నివసించాడు. మరియు బేత్‌షెమెష్, బేత్‌అనాత్ నివాసులు వారికి నిర్బంధ శ్రమికులయ్యారు.[a]
  rationale: The revision removes the unsupported adversative connector, makes the compulsory-labor sense explicit in natural modern Telugu, and regularizes the transliteration of the two place names. It preserves the Hebrew's collective singular reference to Naphtali, the appositional identification of the Canaanites as inhabitants of the land, and the plural reference in “వారికి.”
