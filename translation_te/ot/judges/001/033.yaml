source:
  edition: WLC
  text: נַפְתָּלִ֗י לֹֽא הוֹרִ֞ישׁ אֶת יֹשְׁבֵ֤י בֵֽית שֶׁ֨מֶשׁ֙ וְ/אֶת יֹשְׁבֵ֣י בֵית עֲנָ֔ת וַ/יֵּ֕שֶׁב בְּ/קֶ֥רֶב הַֽ/כְּנַעֲנִ֖י יֹשְׁבֵ֣י הָ/אָ֑רֶץ וְ/יֹשְׁבֵ֤י בֵֽית שֶׁ֨מֶשׁ֙ וּ/בֵ֣ית עֲנָ֔ת הָי֥וּ לָ/הֶ֖ם לָ/מַֽס־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/033.yaml
  text: Naphtali did not drive out the inhabitants of Beth-shemesh or the inhabitants of Beth-anath[a], so he lived among the Canaanites, the inhabitants of the land. And the inhabitants of Beth-shemesh and Beth-anath became forced labor for them.
translation:
  language: te
  text: నఫ్తాలి బేత్‌షెమెష్ నివాసులను గానీ, బేత్‌అనాత్ నివాసులను గానీ వెళ్లగొట్టలేదు. కాబట్టి అతడు ఆ దేశ నివాసులైన కనానీయుల మధ్య నివసించాడు. మరియు బేత్‌షెమెష్, బేత్‌అనాత్ నివాసులు వారికి నిర్బంధ శ్రమికులయ్యారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారికి వెట్టిచాకిరి చేసేవారయ్యారు.” హీబ్రూ పదం מַס కేవలం కప్పం చెల్లించడాన్ని కాక, నిర్బంధ శ్రమసేవను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹרִישׁ
  choice: వెళ్లగొట్టలేదు
  rationale: న్యాయాధిపతులు గ్రంథంలోని ఈ సందర్భంలో హిఫీల్ రూపం ముందుగా నివసిస్తున్న ప్రజలను దేశం నుండి తొలగించడాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘వెళ్లగొట్టు’ సహజంగా ఉండి ఆ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: יֹשְׁבֵי
  choice: నివాసులు
  rationale: ישב క్రియలోని కృదంత రూపం ఒక ప్రాంతంలో నివసించేవారిని సూచిస్తుంది; పునరావృత సూత్రప్రాయ వాక్యానికి ‘నివాసులు’ సంక్షిప్తమైన, సహజమైన ఎంపిక.
- source_word: בֵית שֶׁמֶשׁ
  choice: బేత్‌షెమెషు
  rationale: స్థలనామాన్ని అర్థానువాదం చేయకుండా తెలుగులో లిప్యంతరీకరించాం.
- source_word: בֵית עֲנָת
  choice: బేత్‌అనాతు
  rationale: స్థలనామాన్ని అర్థానువాదం చేయకుండా తెలుగులో లిప్యంతరీకరించాం.
- source_word: וַיֵּשֶׁב בְּקֶרֶב
  choice: మధ్య నివసించాడు
  rationale: నఫ్తాలి అనే గోత్ర సముదాయాన్ని హీబ్రూ ఏకవచన కర్తగా చూపుతుంది; దానిని తెలుగులోనూ సామూహిక ఏకవచనంగా ఉంచి, בְּקֶרֶבను సహజంగా ‘మధ్య’ అని అనువదించాం.
- source_word: הַכְּנַעֲנִי
  choice: కనానీయులు
  rationale: రూపపరంగా ఏకవచనమైనప్పటికీ ఇది జాతిని సూచించే సామూహిక నామం; తెలుగులో బహువచనం సహజం.
- source_word: יֹשְׁבֵי הָאָרֶץ
  choice: ఆ దేశ నివాసులైన
  rationale: ఈ పదబంధం కనానీయులను వివరిస్తున్న సమానాధికార విశేషణం; మూలంలోని సమాచారాన్ని వదలకుండా తెలుగులో సహజంగా కలిపాం.
- source_word: הָיוּ לָהֶם לָמַס
  choice: వారికి నిర్బంధంగా పనిచేసేవారయ్యారు
  rationale: מַס సాధారణ పన్నుకన్నా బలవంతపు శ్రమసేవను సూచిస్తుంది. ‘నిర్బంధంగా పనిచేసేవారు’ ఆధునిక పాఠకులకు అర్థమయ్యేలా ఆ సేవా భావాన్ని తెలియజేస్తుంది; היה + ל నిర్మాణంలోని ‘అయ్యారు’ భావాన్నీ నిలుపుతుంది.
- source_word: לָהֶם
  choice: వారికి
  rationale: బహువచన సర్వనామం నఫ్తాలి గోత్ర సభ్యులను సూచించే అవకాశముంది; మూలంలోని బహువచనాన్ని నిలిపాం.
