  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు స్పష్టమైన శైలిని ఉపయోగించాం. స్థలనామాలను లిప్యంతరీకరించాం; గోత్రనామమైన ‘నఫ్తాలి’ని హీబ్రూ సామూహిక ఏకవచనానికి అనుగుణంగా ఏకవచన క్రియతో ఉంచాం. ప్రధాన పాఠంలోని [a] సూచిక సంబంధిత వాక్యాంతంలో ఉంచబడింది.
