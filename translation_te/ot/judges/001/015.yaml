translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. తండ్రితో కుమార్తె మాట్లాడే సందర్భానికి అనుగుణంగా ఏకవచన సంబోధనను సహజంగా ఉంచాం. మూలంలోని భౌగోళిక, జలవనరుల పదాల అర్థవిస్తృతిని పాదసూచికల్లో నిలిపాం.
