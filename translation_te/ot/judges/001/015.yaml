source:
  edition: WLC
  text: וַ/תֹּ֨אמֶר ל֜/וֹ הָֽבָ/ה לִּ֣/י בְרָכָ֗ה כִּ֣י אֶ֤רֶץ הַ/נֶּ֨גֶב֙ נְתַתָּ֔/נִי וְ/נָתַתָּ֥ה לִ֖/י גֻּלֹּ֣ת מָ֑יִם וַ/יִּתֶּן לָ֣/הּ כָּלֵ֗ב אֵ֚ת גֻּלֹּ֣ת עִלִּ֔ית וְ/אֵ֖ת גֻּלֹּ֥ת תַּחְתִּֽית־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/015.yaml
  text: She said to him[a], “Please give me a blessing, because you have given me the land of the Negev[b]; give me also springs of water.” So Caleb gave her the upper springs and the lower springs.
translation:
  language: te
  text: ఆమె అతనితో, “దయచేసి నాకు ఒక ఆశీర్వాదం ఇవ్వండి. మీరు నాకు నెగెవు భూమిని[a] ఇచ్చారు కాబట్టి, నీటి ఊటలను[b] కూడా నాకు ఇవ్వండి” అంది. అప్పుడు కాలేబు ఆమెకు ఎగువ ఊటలను, దిగువ ఊటలను ఇచ్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘దక్షిణ దేశపు భూమి’ అని కూడా అనువదించవచ్చు. హీబ్రూ ‘నెగెవు’ అనే పదం ప్రాంతపు పేరుగానూ, దక్షిణాన ఉన్న శుష్క భూభాగాన్ని సూచించే పదంగానూ వాడవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ఈ హీబ్రూ పదబంధం ఊటలను, నీటి కుంటలను లేదా ఇతర నీటి వనరులను సూచించవచ్చు. పొడి ప్రాంతపు సందర్భానికి ‘ఊటలు’ బాగా సరిపోతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָבָה
  choice: దయచేసి ... ఇవ్వు
  rationale: అభ్యర్థనగా వాడిన ఈ రూపాన్ని ఆధునిక తెలుగులో సహజమైన మర్యాదపూర్వక విన్నపంగా వ్యక్తపరుస్తుంది.
- source_word: בְרָכָה
  choice: ఒక ఆశీర్వాదం
  rationale: ఈ సందర్భంలో ప్రయోజనకరమైన కానుక లేదా అనుగ్రహం భావం ఉన్నప్పటికీ, మూలంలోని ‘ఆశీర్వాదం’ అనే కుటుంబ సంబంధిత భాషను నిలుపుతుంది.
- source_word: אֶרֶץ הַנֶּגֶב
  choice: నెగెవు ప్రాంతంలోని భూమి
  rationale: נֶגֶב ఇక్కడ దక్షిణాన ఉన్న శుష్క ప్రాంతానికి భౌగోళిక పేరుగా ఉండవచ్చు; ‘ప్రాంతంలోని భూమి’ అనేది తెలుగులో స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: גֻּלֹּת מָיִם
  choice: నీటి ఊటలు
  rationale: ఈ పదబంధం నీటి వనరులను సూచిస్తుంది; పొడి ప్రాంతపు సందర్భంలో ‘ఊటలు’ అనేది అత్యంత సముచితమైన అర్థం, అయితే ఇతర రకాల నీటి వనరుల అవకాశాన్ని పాదసూచిక తెలియజేస్తుంది.
- source_word: גֻּלֹּת עִלִּית
  choice: ఎగువ ఊటలు
  rationale: עִלִּית అంటే ‘ఎగువ’; ముందున్న ‘ఊటలు’తో పదసామ్యాన్ని, స్థలాకృతి వ్యత్యాసాన్ని నిలుపుతుంది.
- source_word: גֻּלֹּת תַּחְתִּית
  choice: దిగువ ఊటలు
  rationale: תַּחְתִּית అంటే ‘దిగువ’; ‘ఎగువ ఊటలు’కు సహజమైన జతగా ఉంటుంది.
- source_word: וַיִּתֶּן לָהּ
  choice: అప్పుడు కాలేబు ఆమెకు ... ఇచ్చాడు
  rationale: విన్నపం తరువాత కథనం ముందుకు సాగడాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
