  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַֽ֠/יִּמְצְאוּ אֶת אֲדֹנִ֥י בֶ֨זֶק֙ בְּ/בֶ֔זֶק וַ/יִּֽלָּחֲמ֖וּ בּ֑/וֹ וַ/יַּכּ֕וּ אֶת הַֽ/כְּנַעֲנִ֖י וְ/אֶת הַ/פְּרִזִּֽי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/005.yaml
  text: They found Adoni-bezek in Bezek[a], and they fought against him and struck down the Canaanites and the Perizzites.
translation:
  language: te
  text: వారు బెజెకులో అదోనీ-బెజెకును[a] కనుగొని, అతనితో యుద్ధం చేసి, కనానీయులను, పెరిజ్జీయులను కొట్టారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “అదోనీ-బెజెకు” అనే పేరును పదవ్యుత్పత్తి ప్రకారం “బెజెకు ప్రభువు” అని కూడా అర్థం చేసుకోవచ్చు; ఇక్కడ దాన్ని వ్యక్తి పేరుగా లిప్యంతరీకరించాం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְצְאוּ
  choice: కనుగొని
  rationale: מצא అనే క్రియ కథన సందర్భంలో ‘కనుగొను’ లేదా ‘ఎదుర్కొను’ అనే అర్థం ఇస్తుంది. ఇక్కడ ‘కనుగొని’ మూలానికి నేరుగా సరిపోతూ సహజమైన తెలుగు కథన ప్రవాహాన్ని ఇస్తుంది.
- source_word: אֲדֹנִי בֶזֶק
  choice: అదోనీ-బెజెకు
  rationale: సందర్భంలో దీనిని వ్యక్తి పేరుగా లిప్యంతరీకరించడం సముచితం. దాని పదవ్యుత్పత్తి అర్థం ‘బెజెకు ప్రభువు’ కావచ్చనే అవకాశాన్ని పాదసూచికలో నిలుపుతున్నాం.
- source_word: בְּבֶזֶק
  choice: బెజెకులో
  rationale: ב అనే ఉపసర్గ ఇక్కడ స్థలాన్ని సూచిస్తుంది; అందువల్ల ‘బెజెకులో’ సహజమైన స్థానార్థక అనువాదం.
- source_word: וַיִּלָּחֲמוּ בּוֹ
  choice: అతనితో యుద్ధం చేసి
  rationale: לחם నిఫాల్ రూపం ב తో వచ్చినప్పుడు ప్రత్యర్థితో యుద్ధం చేయడాన్ని సూచిస్తుంది. తెలుగులో ‘అతనితో యుద్ధం చేసి’ విరోధార్థాన్ని సందర్భానుసారంగా స్పష్టంగా తెలియజేస్తుంది.
- source_word: וַיַּכּוּ
  choice: హతమార్చారు
  rationale: נכה యుద్ధ సందర్భంలో కొట్టడం, పడగొట్టడం, సంహరించడం లేదా ఓడించడం అనే పరిధి కలిగి ఉంది. ‘హతమార్చారు’ క్రియ యొక్క బలాన్ని నిలుపుతుంది; అయితే ప్రతి వ్యక్తి తప్పనిసరిగా చంపబడ్డాడని విడిగా నిర్దేశించదు.
- source_word: הַכְּנַעֲנִי
  choice: కనానీయులను
  rationale: హీబ్రూలో ఏకవచన రూపంలో ఉన్నప్పటికీ, ఇది సమూహవాచక జాతినామం. తెలుగులో బహువచనం యుద్ధ సందర్భంలోని ప్రజాసమూహాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: הַפְּרִזִּי
  choice: పెరిజ్జీయులను
  rationale: ఇదీ రూపరీత్యా ఏకవచనమైన సమూహవాచక జాతినామం; తెలుగులో బహువచన రూపం సహజంగా ఉంటుంది.
