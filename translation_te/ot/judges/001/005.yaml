  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. వ్యక్తి, స్థల పేర్లను తెలుగులో లిప్యంతరీకరించాం; సమూహవాచక జాతినామాలను తెలుగు బహువచనంలో ఇచ్చాం. పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో చేర్చబడింది.
