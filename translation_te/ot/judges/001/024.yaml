id: JDG.1.24
reference: Judges 1:24
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּרְאוּ֙ הַ/שֹּׁ֣מְרִ֔ים אִ֖ישׁ יוֹצֵ֣א מִן הָ/עִ֑יר וַ/יֹּ֣אמְרוּ ל֗/וֹ הַרְאֵ֤/נוּ נָא֙ אֶת מְב֣וֹא הָ/עִ֔יר וְ/עָשִׂ֥ינוּ עִמְּ/ךָ֖ חָֽסֶד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/024.yaml
  text: The watchers saw a man coming out of the city[a], and they said to him, “Please show us the entrance to the city[b], and we will deal kindly with you.”
translation:
  language: te
  text: కావలి కాస్తున్నవారు పట్టణం నుండి బయటకు వస్తున్న ఒక మనిషిని చూశారు. వారు అతనితో, “దయచేసి పట్టణంలోకి ప్రవేశించే మార్గాన్ని మాకు చూపించు[a]. అప్పుడు మేము నీ పట్ల దయగా వ్యవహరిస్తాం[b]” అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పట్టణ ప్రవేశద్వారాన్ని మాకు చూపించు.”
    reason: lexical_alternative
  - marker: b
    text: 'హీబ్రూ: హెసెద్; సందర్భాన్ని బట్టి ఈ పదాన్ని “దయ,” “నిబద్ధత,” లేదా “స్థిరమైన ప్రేమ” అని కూడా అనువదిస్తారు.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשֹּׁמְרִים
  choice: కావలి కాస్తున్నవారు
  rationale: שמר క్రియ యొక్క కర్తృవాచక రూపం ఇక్కడ పట్టణం వెలుపల ఉండి గమనిస్తున్నవారిని సూచిస్తుంది. అధికారిక సైనిక హోదాను అనవసరంగా సూచించకుండా, మూలంలోని ‘కాపలా/గమనింపు’ భావాన్ని ఈ సహజమైన తెలుగు పదబంధం నిలుపుతుంది.
- source_word: אִישׁ
  choice: ఒక మనిషి
  rationale: ఏకవచన నామవాచకం ఇక్కడ ఒక పురుష వ్యక్తిని సూటిగా సూచిస్తుంది.
- source_word: יוֹצֵא
  choice: బయటకు వస్తున్న
  rationale: יצא కర్తృవాచక రూపం పట్టణం లోపలి నుండి వెలుపలికి జరుగుతున్న కదలికను సూచిస్తుంది; గమనిస్తున్నవారి దృష్టికోణానికి ‘బయటకు వస్తున్న’ సహజంగా సరిపోతుంది.
- source_word: מְבוֹא
  choice: ప్రవేశించే మార్గం
  rationale: מְבוֹא అనేది ప్రవేశద్వారం లేదా లోపలికి చేరే మార్గాన్ని సూచించవచ్చు. ఈ సైనిక సందర్భంలో కేవలం కనిపించే ద్వారం కంటే పట్టణంలోకి వెళ్లగల ప్రవేశమార్గమే ఉద్దేశమై ఉండవచ్చు; అందువల్ల అస్పష్టతను కొంతవరకు నిలుపుతూ సహజంగా అనువదించబడింది.
- source_word: נָא
  choice: దయచేసి
  rationale: ఆజ్ఞను మృదువుగా చేసే వినయసూచక అవ్యయానికి ఆధునిక తెలుగులో సహజ సమానార్థకం.
- source_word: וְעָשִׂינוּ עִמְּךָ חָסֶד
  choice: అప్పుడు మేము నీ పట్ల దయగా వ్యవహరిస్తాం
  rationale: ఈ బేరసారపు సందర్భంలో חֶסֶד అనేది అతనికి అనుకూలంగా, కనికరంతో వ్యవహరిస్తామనే వాగ్దానాన్ని సూచిస్తుంది. ‘నిబంధన విశ్వసనీయత’ వంటి సందర్భానికి మించిన వేదాంతభారాన్ని చేర్చకుండా సంబంధాత్మక భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: חֶסֶד పదం యొక్క భావం
  choice: దయగా వ్యవహరించడం
  alternative: నిబంధన నిబద్ధత చూపించడం / స్థిరమైన ప్రేమ చూపించడం
  rationale: חֶסֶד కొన్నిసందర్భాల్లో నిబంధన నిబద్ధత లేదా స్థిరమైన ప్రేమ అనే సమృద్ధమైన భావాన్ని కలిగి ఉన్నప్పటికీ, ఇక్కడ సమాచారం ఇచ్చిన మనిషిని కరుణతో విడిచిపెడతామనే అనుకూల వ్యవహారమే ప్రధాన భావం. మరింత వేదాంతభరితమైన పదజాలం ఈ సందర్భాన్ని అతిశయింపజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన కథనశైలి ఉపయోగించబడింది. ‘కావలి కాస్తున్నవారు’ అనే రూపం అధికారిక సైనిక హోదాను మోపకుండా మూలంలోని గమనింపు భావాన్ని నిలుపుతుంది. పాదసూచిక గుర్తులు సంబంధిత పదబంధాల వెంట ఉంచబడ్డాయి.
