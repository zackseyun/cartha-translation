translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడాం. హీబ్రూ జాబితా నిర్మాణాన్ని తెలుగులో సహజంగా మార్చుతూ, ‘వెళ్లగొట్టలేదు’ అనే నిరాకరణ అన్ని స్థలాల నివాసులకు వర్తించేలా ఉంచాం. మూలంలో మొదటి రెండు పేర్లతో మాత్రమే יֹשְׁבֵי స్పష్టంగా ఉన్నప్పటికీ, మిగిలిన స్థలనామాలు కూడా వెళ్లగొట్టని ప్రజలను/నివాసులను సూచిస్తాయని తెలుగులో చివర ‘నివాసులను’ ఉంచి జాబితా మొత్తానికి వర్తింపజేశాం.
