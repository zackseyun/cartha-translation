source:
  edition: WLC
  text: אָשֵׁ֗ר לֹ֤א הוֹרִישׁ֙ אֶת יֹשְׁבֵ֣י עַכּ֔וֹ וְ/אֶת יוֹשְׁבֵ֖י צִיד֑וֹן וְ/אֶת אַחְלָ֤ב וְ/אֶת אַכְזִיב֙ וְ/אֶת חֶלְבָּ֔ה וְ/אֶת אֲפִ֖יק וְ/אֶת רְחֹֽב־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/031.yaml
  text: Asher did not drive out the inhabitants of Acco[a], or the inhabitants of Sidon, or Ahlab, or Achzib, or Helbah, or Aphek[b], or Rehob.
translation:
  language: te
  text: ఆషేరు అక్కో నివాసులను[a][b], సీదోను నివాసులను, అహ్లాబు నివాసులను, అక్జీబు నివాసులను, హెల్బా నివాసులను, అఫీకు నివాసులను, రెహోబు నివాసులను తరిమివేయలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘తరిమివేయలేదు’ అనే మాటకు, వారి స్వాధీనంలో ఉన్న భూమిని కోల్పోయేలా వారిని తొలగించలేదు అనే భావం కూడా ఉంది.
    reason: lexical_alternative
  - marker: b
    text: అక్కో ప్రాచీన తీరప్రాంత నగరం; తరువాతి కాలంలో అది ఏకర్ అనే పేరుతో ప్రసిద్ధి చెందింది.
    reason: cultural_note
lexical_decisions:
- source_word: הוֹרִישׁ
  choice: వెళ్లగొట్టలేదు
  rationale: యָרַשׁ ధాతువు హిఫీల్ రూపం భూస్వాధీన సందర్భంలో అక్కడి నివాసులు తమ స్థలాన్ని కోల్పోయేలా తొలగించడాన్ని సూచిస్తుంది. ‘వెళ్లగొట్టు’ ఆధునిక తెలుగులో సహజంగా ఉండి న్యాయాధిపతులు 1లో పునరావృతమయ్యే భావానికి సరిపోతుంది.
- source_word: יֹשְׁבֵי
  choice: నివాసులను
  rationale: יָשַׁב కృదంత రూపం ఒక ప్రాంతంలో నివసించేవారిని సమూహంగా సూచిస్తుంది; ‘నివాసులు’ సంక్షిప్తమైన, సహజమైన తెలుగు పదం.
- source_word: עַכּוֹ
  choice: అక్కో
  rationale: ప్రాచీన స్థలనామాన్ని హీబ్రూ ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించాం; తరువాతి కాలపు ‘ఏకర్’ అనే పేరును వాడలేదు.
- source_word: צִידוֹן
  choice: సీదోను
  rationale: హీబ్రూ స్థలనామానికి దగ్గరగా, తెలుగులో సులభంగా పలికే సంప్రదాయబద్ధ రూపం.
- source_word: אַחְלָב
  choice: అహ్లాబు
  rationale: అర్థానువాదం చేయకుండా స్థలనామాన్ని హీబ్రూ రూపానికి దగ్గరగా లిప్యంతరీకరించాం.
- source_word: אַכְזִיב
  choice: అక్జీబు
  rationale: స్థలనామాన్ని మూలంలోని హల్లులు, దీర్ఘ స్వరానికి దగ్గరగా లిప్యంతరీకరించాం.
- source_word: חֶלְבָּה
  choice: హెల్బా
  rationale: ఈ వచనంలోని మసొరా పాఠ రూపాన్ని అనుసరించి స్థలనామాన్ని లిప్యంతరీకరించాం.
- source_word: אֲפִיק
  choice: అఫీకు
  rationale: స్థలనామాన్ని హీబ్రూ రూపానికి దగ్గరగా లిప్యంతరీకరించాం.
- source_word: רְחֹב
  choice: రెహోబు
  rationale: స్థలనామాన్ని హీబ్రూ రూపానికి దగ్గరగా, తెలుగులో పలకడానికి అనువుగా లిప్యంతరీకరించాం.
- source_word: וְ/אֶת ... וְ/אֶת
  choice: జాబితాలో వరుస కర్మలుగా విరామచిహ్నాలతో అనుసంధానం
  rationale: నిరాకరణ క్రియకు లోబడిన అనేక కర్మలను హీబ్రూ వావ్ వరుసగా కలుపుతోంది. తెలుగులో ప్రతి అంశానికి ‘లేదా’ అనడం కృత్రిమంగా ఉండేందున, ఒకే నిరాకరణ క్రియ కింద సహజమైన జాబితాగా ఇచ్చాం.
