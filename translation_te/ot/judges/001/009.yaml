- from: ఆ తరువాత యూదా కుమారులు పర్వత ప్రాంతంలో, నెగెబులో, దిగువ ప్రాంతంలో[a] నివసిస్తున్న కనానీయులతో యుద్ధం చేయడానికి దిగివెళ్లారు.
  to: ఆ తరువాత యూదా వంశస్థులు పర్వత ప్రాంతంలో, నెగెబులో, లోతట్టు ప్రాంతంలో[a] నివసిస్తున్న కనానీయులపై యుద్ధం చేయడానికి దిగివెళ్లారు.
