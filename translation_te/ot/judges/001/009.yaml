id: JDG.1.9
reference: Judges 1:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אַחַ֗ר יָֽרְדוּ֙ בְּנֵ֣י יְהוּדָ֔ה לְ/הִלָּחֵ֖ם בַּֽ/כְּנַעֲנִ֑י יוֹשֵׁ֣ב הָ/הָ֔ר וְ/הַ/נֶּ֖גֶב וְ/הַ/שְּׁפֵלָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/009.yaml
  text: Afterward[a], the sons of Judah went down to fight against the Canaanites living in the hill country, the Negev, and the lowland.
translation:
  language: te
  text: ఆ తరువాత యూదా వంశస్థులు పర్వత ప్రాంతంలో, నెగెబులో, లోతట్టు ప్రాంతంలో[a] నివసిస్తున్న కనానీయులపై యుద్ధం చేయడానికి దిగివెళ్లారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘షెఫేలా’; ఇది యూదా పర్వత ప్రాంతానికి, తీర మైదానానికి మధ్యనున్న కొండపాద ప్రాంతం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחַר
  choice: ఆ తరువాత
  rationale: తదుపరి జరిగిన చర్యను సూచించే కాలసంబంధ అర్థాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; మధ్యలో ఎంత కాలం గడిచిందో నిర్దిష్టంగా చెప్పదు.
- source_word: יָרְדוּ
  choice: దిగివెళ్లారు
  rationale: ירד లోని కిందికి వెళ్లే దిశా, భౌగోళిక భావాన్ని నిలుపుతుంది; కేవలం ‘వెళ్లారు’ అని సరళీకరించదు.
- source_word: בְּנֵי יְהוּדָה
  choice: యూదా కుమారులు
  rationale: హీబ్రూ పదబంధంలోని అక్షరార్థాన్ని నిలుపుతూ, యూదా గోత్ర సభ్యులను సమష్టిగా సూచిస్తుంది.
- source_word: לְהִלָּחֵם
  choice: యుద్ధం చేయడానికి
  rationale: לחם నిఫాల్ రూపం తెలిపే పోరాడడం లేదా యుద్ధం చేయడం అనే భావాన్ని స్పష్టంగా, సహజంగా అందిస్తుంది.
- source_word: בַּכְּנַעֲנִי
  choice: కనానీయులతో
  rationale: ‘కనానీయుడు’ అనే ఏకవచన రూపం ఇక్కడ జనసమూహాన్ని సమష్టిగా సూచిస్తుంది. పోరాట సందర్భంలో తెలుగు సహజ ప్రయోగం ప్రకారం ‘తో’ విభక్తి విరోధ సంబంధాన్ని తెలియజేస్తుంది.
- source_word: יוֹשֵׁב
  choice: నివసిస్తున్న
  rationale: ישב కృదంత రూపంలోని కొనసాగుతున్న నివాస భావాన్ని గౌరవప్రదమైన, సాధారణ ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: הָהָר
  choice: పర్వత ప్రాంతం
  rationale: ఇక్కడ ఒకే పర్వతాన్ని కాక, నెగెబు మరియు దిగువ ప్రాంతంతో పాటు పేర్కొన్న ఎత్తైన భౌగోళిక మండలాన్ని సూచిస్తుంది.
- source_word: הַנֶּגֶב
  choice: నెగెబు
  rationale: భౌగోళిక ప్రాంతాల జాబితాలో ఉన్నందున ‘దక్షిణ ప్రాంతం’ అని సాధారణీకరించకుండా ప్రాంతనామాన్ని నిలుపుతుంది.
- source_word: הַשְּׁפֵלָה
  choice: దిగువ ప్రాంతం
  rationale: యూదా పర్వత ప్రాంతానికి, తీర మైదానానికి మధ్యనున్న తక్కువ ఎత్తుగల ప్రాంతాన్ని పాఠకులకు అర్థమయ్యేలా అనువదిస్తుంది; సాంకేతిక లిప్యంతరీకరణను పాదటీకలో ఇస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. హీబ్రూ వాక్యంలోని కాలక్రమాన్ని, ‘దిగివెళ్లారు’ అనే భౌగోళిక దిశను, మూడు ప్రాంతాల జాబితాను నిలుపుతూ, ‘షెఫేలా’ అనే సాంకేతిక ప్రాంతనామాన్ని పాదటీకలో వివరించాం.
