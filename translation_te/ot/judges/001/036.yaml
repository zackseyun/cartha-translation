  yaml_path: translation/ot/judges/001/036.yaml
  text: And the border of the Amorites was from the Ascent of Akrabbim[b][a], from Sela and upward.
translation:
  language: te
  text: అమోరీయుల సరిహద్దు అక్రబ్బీము ఎక్కుదారి[a] నుండి, సెలా[b] నుండి పైకి కొనసాగేది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘అక్రబ్బీము’ అంటే ‘తేళ్లు’; దీనిని ‘తేళ్ల ఎక్కుదారి’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘ఆ బండ నుండి’; హీబ్రూ పదాన్ని సెలా అనే స్థలనామంగా కాక సాధారణ నామవాచకంగా తీసుకుంటే ఈ అర్థం వస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: גְבוּל
  choice: సరిహద్దు
  rationale: ఈ భౌగోళిక సందర్భంలో ఈ పదం మొత్తం ప్రాంతాన్ని కాక సరిహద్దు రేఖను సూచిస్తుంది.
- source_word: הָאֱמֹרִי
  choice: అమోరీయుల
  rationale: హీబ్రూలో ఏకవచన రూపంలో ఉన్నా, ఇక్కడ జాతిని సమష్టిగా సూచిస్తుంది; తెలుగులో బహువచన సంబంధరూపం సహజం.
- source_word: מִמַּעֲלֵה עַקְרַבִּים
  choice: అక్రబ్బీము కనుమ మొదలుకొని
  rationale: מַעֲלֵה ఎత్తైన దారిని లేదా కనుమను సూచిస్తుంది; עַקְרַבִּים స్థలనామంలో భాగం కాబట్టి ప్రధాన పాఠ్యంలో లిప్యంతరీకరించి, దాని అక్షరార్థాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: מֵהַסֶּלַע
  choice: సెలా నుండి
  rationale: ఈ భౌగోళిక ప్రకటనలో దీనిని సెలా అనే స్థలనామంగా గ్రహించవచ్చు; అయితే హీబ్రూ రూపానికి ‘బండ నుండి’ అనే సాధారణ నామార్థమూ సాధ్యమే కాబట్టి దానిని పాదసూచికలో నిలిపాం.
- source_word: וָמָעְלָה
  choice: పైదాకా
  rationale: ఆ స్థానం నుండి ఎగువ దిశగా సరిహద్దు కొనసాగిన భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: וּ
  choice: (వాక్య అనుసంధానంలో అంతర్భూతం)
  rationale: హీబ్రూ సంధికారకం ముందరి వాక్యంతో అనుసంధానిస్తుంది; తెలుగులో సందర్భానుసారంగా ప్రత్యేకంగా ‘మరియు’ అనడం కంటే నేరుగా ప్రారంభించడం సహజం.
