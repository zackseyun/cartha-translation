revisions:
- from: ఆమె వచ్చినప్పుడు, పొలాన్ని తన తండ్రిని అడగమని అతనిని ప్రేరేపించింది.[a] తరువాత ఆమె గాడిద మీదనుండి దిగింది.[b] కాలేబు ఆమెను, “నీకు ఏమి కావాలి?” అని అడిగాడు.[c]
  to: ఆమె వచ్చినప్పుడు, ఆమె అతనిని తన తండ్రి దగ్గర ఆ పొలాన్ని అడగమని పురికొల్పింది.[a] తరువాత ఆమె గాడిద మీదనుండి దిగింది.[b] కాలేబు ఆమెతో, “నీకు ఏమి కావాలి?” అన్నాడు.[c]
