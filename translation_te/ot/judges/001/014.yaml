translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. మూలంలోని సర్వనామ సంబంధాలు అలాగే ఉంచబడ్డాయి; సందర్భం వాటి వ్యక్తులను స్పష్టం చేస్తుంది. ప్రతి పాదటిప్పణి సూచిక సంబంధిత వాక్యభాగం వెంట ఉంచబడింది.
