  text: וַ/יְהִ֣י בְּ/בוֹאָ֗/הּ וַ/תְּסִיתֵ֨/הוּ֙ לִ/שְׁא֤וֹל מֵֽ/אֵת אָבִ֨י/הָ֙ הַ/שָּׂדֶ֔ה וַ/תִּצְנַ֖ח מֵ/עַ֣ל הַ/חֲמ֑וֹר וַ/יֹּֽאמֶר לָ֥/הּ כָּלֵ֖ב מַה לָּֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/014.yaml
  text: And when she came[a], she urged him to ask her father for the field. Then she dismounted from the donkey, and Caleb said to her[c][b], “What do you want?”
translation:
  language: te
  text: ఆమె వచ్చినప్పుడు, ఆమె అతనిని తన తండ్రి దగ్గర ఆ పొలాన్ని అడగమని పురికొల్పింది.[a] తరువాత ఆమె గాడిద మీదనుండి దిగింది.[b] కాలేబు ఆమెతో, “నీకు ఏమి కావాలి?” అన్నాడు.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతనిని ఒప్పించింది,” “అతనిని ప్రేరేపించింది.” హీబ్రూ క్రియకు పురికొల్పడం, ఒప్పించడం, ప్రేరేపించడం వంటి అర్థపరిధి ఉంది; ఇక్కడి సందర్భంలో తటస్థమైన ‘పురికొల్పింది’ అనే భావం సరిపోతుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ఆమె గాడిద మీదనుండి కిందికి వాలింది” లేదా “దూకింది.” హీబ్రూ క్రియ దిగడాన్ని లేదా కిందికి పడిపోవడాన్ని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: హీబ్రూ నుడికారం అక్షరార్థంగా, “నీకు ఏమిటి?” అని ఉంది. దీనికి “నీకు ఏమి కావాలి?” లేదా “నీకు ఏమైంది?” అనే అర్థం రావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּבוֹאָהּ
  choice: ఆమె వచ్చినప్పుడు
  rationale: ב prefixed infinitive construct with the 3fs suffix expresses contemporaneous time, naturally rendered as a temporal clause in Telugu.
- source_word: וַתְּסִיתֵהוּ
  choice: అతనిని ప్రేరేపించింది
  rationale: סות has a range including urge, persuade, entice, or incite. In this request context, ప్రేరేపించింది preserves the causative prompting without necessarily assigning a negative moral sense.
- source_word: לִשְׁאוֹל מֵאֵת אָבִיהָ הַשָּׂדֶה
  choice: పొలాన్ని తన తండ్రిని అడగమని
  rationale: The clause denotes asking her father for the specific field. This Telugu construction is natural and retains both the requested object and the person petitioned.
- source_word: וַתִּצְנַח מֵעַל הַחֲמוֹר
  choice: ఆమె గాడిద మీదనుండి దిగింది
  rationale: צנח can suggest dropping or descending; in the setting of riding a donkey, దిగింది clearly conveys dismounting while the footnote preserves the more vivid lexical possibility.
- source_word: מַה לָּךְ
  choice: నీకు ఏమి కావాలి?
  rationale: Literally, 'what is to you?' The immediate petition context supports the idiomatic Telugu question 'What do you want?' while a footnote notes the alternate pragmatic sense.
- source_word: כָּלֵב
  choice: కాలేబు
  rationale: The personal name is represented in its established Telugu biblical form.
