  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּ֣עַל יְהוּדָ֔ה וַ/יִּתֵּ֧ן יְהוָ֛ה אֶת הַ/כְּנַעֲנִ֥י וְ/הַ/פְּרִזִּ֖י בְּ/יָדָ֑/ם וַ/יַּכּ֣וּ/ם בְּ/בֶ֔זֶק עֲשֶׂ֥רֶת אֲלָפִ֖ים אִֽישׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/004.yaml
  text: Then Judah went up[a], and Yahweh gave the Canaanites and the Perizzites into their hand[b], and they struck down ten thousand men at Bezek.
translation:
  language: te
  text: అప్పుడు యూదా పైకి వెళ్లాడు. యాహ్వే కనానీయులను, పెరిజ్జీయులను[a] వారి చేతికి అప్పగించాడు[b]. వారు బెజెకులో పదివేల మంది పురుషులను కొట్టి పడగొట్టారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ‘కనానీయుడు, పెరిజ్జీయుడు’ అని ఏకవచన రూపాలు ఉన్నాయి; అవి ఇక్కడ ఆయా ప్రజలను సమష్టిగా సూచిస్తున్నాయి.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా ‘వారి చేతిలోకి’; అంటే వారి అధికారానికి లేదా వశానికి.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: పైకి వెళ్లాడు
  rationale: עלה అనే క్రియ యొక్క ప్రాథమిక ‘పైకి వెళ్లు’ భావాన్ని నిలుపుతుంది; ఈ సందర్భంలో అది యుద్ధానికి ముందుకు సాగడాన్ని కూడా సూచించవచ్చు, అయితే అనువాదంలో ఆ భావాన్ని అతిగా నిర్దిష్టం చేయలేదు.
- source_word: יְהוּדָה
  choice: యూదా
  rationale: ఇక్కడ గోత్రాన్ని సమష్టిగా సూచించే పేరును తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించాం. మొదటి క్రియ ఏకవచనంలో ఉన్నా, తరువాతి సర్వనామాలు గోత్రపు దళాలను సూచిస్తూ బహువచనంలో ఉన్నాయి.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవ నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో అందించాం.
- source_word: הַכְּנַעֲנִי וְהַפְּרִזִּי
  choice: కనానీయులను, పెరిజ్జీయులను
  rationale: హీబ్రూలో రూపాలు ఏకవచనమైనా, జనసమూహాలను సమష్టిగా సూచిస్తున్నందున సహజమైన తెలుగు బహువచనం వాడాం.
- source_word: בְּיָדָם
  choice: వారి చేతికి
  rationale: ‘చేతికి అప్పగించు’ అనే హీబ్రూ నుడికారంలోని ప్రతిమను తెలుగులోనూ సహజంగా నిలుపుతూ, వారి అధికారానికి లేదా వశానికి అప్పగించాడనే భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: וַיַּכּוּם
  choice: హతమార్చారు
  rationale: נכה యుద్ధసందర్భంలో కొట్టడం, పడగొట్టడం లేదా సంహరించడం అనే పరిధిని కలిగి ఉంది. పదివేల మంది పురుషుల లెక్కతో కూడిన ఈ సందర్భంలో ‘హతమార్చారు’ హింసాత్మక ఫలితాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: בְּבֶזֶק
  choice: బెజెకులో
  rationale: ב అనే ఉపసర్గ ఇక్కడ యుద్ధం జరిగిన స్థలాన్ని సూచిస్తుంది; తెలుగు స్థలవాచక రూపం సహజంగా ఉంటుంది.
- source_word: עֲשֶׂרֶת אֲלָפִים אִישׁ
  choice: పదివేల మంది పురుషులను
  rationale: సంఖ్యను, אִישׁ యొక్క పురుషవాచక భావాన్ని నేరుగా ప్రతిబింబిస్తుంది; ‘సైనికులు’ అని చేర్చి మూలంలో లేని నిర్దిష్టతను ప్రవేశపెట్టలేదు.
theological_decisions:
- issue: יְהוָה అనే దైవ నామం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలంలోని వ్యక్తిగత దైవ నామాన్ని బిరుదుతో భర్తీ చేయకుండా స్పష్టంగా ఉంచాం.
- issue: దైవ కార్యం మరియు మానవ కార్యం
  choice: యెహోవా అప్పగించాడు; వారు హతమార్చారు
  alternative: యూదా ఒక్కడే చేసినట్లు వాక్యమంతా ఏకవచనంలో సవరించడం
  rationale: విజయాన్ని అనుగ్రహించినవాడిగా యెహోవాను, యుద్ధాన్ని నిర్వహించినవారిగా యూదా గోత్రపు దళాలను చూపే మూలంలోని ఉద్దేశపూర్వక కర్తృత్వ భేదాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన కథనశైలిని వాడాం. ‘యూదా’ అనే సమష్టి కర్తతో మొదట ఏకవచనం, తరువాత గోత్రపు దళాలను సూచిస్తూ బహువచనం రావడాన్ని మూలానికి అనుగుణంగా నిలిపాం.
