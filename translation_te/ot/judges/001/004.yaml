revisions:
- from: అప్పుడు యూదా పైకి వెళ్లాడు. యెహోవా కనానీయులను, పెరిజ్జీయులను[a] వారి చేతికి అప్పగించాడు[b]. వారు బెజెకులో పదివేల మంది పురుషులను హతమార్చారు.
  to: అప్పుడు యూదా పైకి వెళ్లాడు. యాహ్వే కనానీయులను, పెరిజ్జీయులను[a] వారి చేతికి అప్పగించాడు[b]. వారు బెజెకులో పదివేల మంది పురుషులను కొట్టి పడగొట్టారు.
  rationale: The revision retains the draft’s sound handling of the collective gentilic forms, the Hebrew hand idiom, and the singular-to-plural shift from Judah to its forces. It changes only the divine-name form to conform to the POB audit trail and broadens the battle verb so that it does not overstate the Hebrew as an explicit killing claim. Footnote markers remain attached to the relevant expressions and the footnote content remains accurate.
  reviewer_model: gpt-5.6-terra
