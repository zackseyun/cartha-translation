  naturalness: ‘హెబ్రోనులో నివసిస్తున్న కనానీయుల మీదికి వెళ్లాడు’ మరియు పూర్వనామ వివరణ ఆధునిక ప్రామాణిక తెలుగులో సహజంగా ఉన్నాయి. ‘వారిని కొట్టి పడగొట్టారు’ యుద్ధకథనానికి తగినది; ఇది ‘హతమార్చారు’ కంటే మూలంలోని విస్తృత అర్థపరిధిని మెరుగ్గా నిలుపుతుంది.
