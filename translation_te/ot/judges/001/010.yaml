translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథన శైలి వాడబడింది. యూదా అనే ఏకవచన సమష్టి నామం తరువాత ‘వారు’ అనే బహువచనంతో సహజంగా కొనసాగించబడింది. మూలంలోని మూడు వివరణాత్మక ప్రత్యామ్నాయాలు [a], [b], [c] గుర్తులతో ప్రధాన పాఠ్యంలో సరిగ్గా అనుసంధానించబడ్డాయి.
