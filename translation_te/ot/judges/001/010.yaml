source:
  edition: WLC
  text: וַ/יֵּ֣לֶךְ יְהוּדָ֗ה אֶל הַֽ/כְּנַעֲנִי֙ הַ/יּוֹשֵׁ֣ב בְּ/חֶבְר֔וֹן וְ/שֵׁם חֶבְר֥וֹן לְ/פָנִ֖ים קִרְיַ֣ת אַרְבַּ֑ע וַ/יַּכּ֛וּ אֶת שֵׁשַׁ֥י וְ/אֶת אֲחִימַ֖ן וְ/אֶת תַּלְמָֽי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/010.yaml
  text: Then Judah went against the Canaanites living in Hebron (Hebron’s former name was Kiriath-arba)[a], and they struck down Sheshai, Ahiman[c][b], and Talmai.
translation:
  language: te
  text: అప్పుడు యూదా హెబ్రోనులో నివసిస్తున్న కనానీయుల మీదికి వెళ్లాడు[a]. హెబ్రోను పూర్వపు పేరు కిర్యత్-అర్బా[b]. వారు షేషైని, అహీమానును, తల్మైని కొట్టి పడగొట్టారు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ‘కనానీయుని దగ్గరికి వెళ్లాడు’ అనే ఏకవచన రూపం ఉంది; ఇక్కడ అది కనానీయుల ప్రజాసమూహాన్ని సూచిస్తున్నట్లు ఉంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “హెబ్రోనును పూర్వం కిర్యత్-అర్బా అని పిలిచేవారు.”
    reason: lexical_alternative
  - marker: c
    text: “కొట్టి పడగొట్టారు” అనే మాటను ఈ యుద్ధ సందర్భంలో “ఓడించారు” లేదా “హతమార్చారు” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: మీదికి వెళ్లాడు
  rationale: הלך అనే క్రియకు అక్షరార్థంగా ‘వెళ్లాడు’ అని అర్థం; శత్రువును సూచించే אֶל తో సైనిక సందర్భంలో రావడం వల్ల దాడికి వెళ్లిన భావాన్ని ‘మీదికి వెళ్లాడు’ సహజంగా తెలియజేస్తుంది.
- source_word: יְהוּדָה
  choice: యూదా
  rationale: ఏకవచన నామం ఇక్కడ యూదా గోత్రాన్ని సమష్టిగా సూచిస్తుంది. మూలంలోని రూపాన్ని నిలిపి ఉంచుతూ ‘యూదా’ అని ఇవ్వడం సహజం; తరువాతి బహువచన క్రియ సమష్టి భావాన్ని స్పష్టం చేస్తుంది.
- source_word: הַכְּנַעֲנִי
  choice: కనానీయులు
  rationale: రూపరీత్యా ఏకవచనమైనా, ఇక్కడ ఒక ప్రజాసమూహాన్ని సమష్టిగా సూచిస్తుంది; అందువల్ల తెలుగు సహజ ప్రయోగంలో బహువచనం వాడబడింది.
- source_word: הַיּוֹשֵׁב בְּחֶבְרוֹן
  choice: హెబ్రోనులో నివసిస్తున్న
  rationale: వర్తమాన కృదంతం అక్కడ స్థిరంగా నివసిస్తున్న భావాన్ని ఇస్తుంది; ‘నివసిస్తున్న’ ఆధునిక, స్పష్టమైన తెలుగు.
- source_word: וְשֵׁם חֶבְרוֹן לְפָנִים
  choice: హెబ్రోను పూర్వపు పేరు
  rationale: לְפָנִים ఇక్కడ ‘పూర్వం/మునుపు’ అనే కాలార్థాన్ని ఇస్తుంది. తెలుగు వాక్య నిర్మాణంలో ‘పూర్వపు పేరు’ సంక్షిప్తంగా, సహజంగా ఉంది.
- source_word: קִרְיַת אַרְבַּע
  choice: కిర్యత్-అర్బా
  rationale: ఇది స్థలనామం కాబట్టి అనువదించకుండా తెలుగు లిపిలో లిప్యంతరీకరించబడింది.
- source_word: וַיַּכּוּ
  choice: హతమార్చారు
  rationale: נכה యుద్ధ సందర్భంలో ఘోరంగా కొట్టడం, ఓడించడం లేదా చంపడం అనే పరిధి కలిగి ఉంది. పేరుపేరున పేర్కొన్న ప్రత్యర్థులపై నిర్ణాయక దెబ్బను ‘హతమార్చారు’ సహజంగా తెలియజేస్తుంది; ఇతర సాధ్యార్థాలు పాదటిప్పణిలో ఉంచబడ్డాయి.
- source_word: שֵׁשַׁי וְאֶת אֲחִימַן וְאֶת תַּלְמָי
  choice: షేషయిని, అహీమానును, తల్మయిని
  rationale: వ్యక్తి నామాలను తెలుగు లిపిలో లిప్యంతరీకరించి, క్రియకు తగిన ద్వితీయావిభక్తి ప్రత్యయాలు జోడించబడ్డాయి.
