revisions:
- from: కానీ మనష్షే బేత్-షెయానును, దాని అనుబంధ పట్టణాలను[a], తానాకును, దాని అనుబంధ పట్టణాలను, దోరు నివాసులను, దాని అనుబంధ పట్టణాలను, ఇబ్లెయాము నివాసులను, దాని అనుబంధ పట్టణాలను, మెగిద్దో నివాసులను, దాని అనుబంధ పట్టణాలను స్వాధీనం నుంచి తొలగించలేదు. కనానీయులు ఈ దేశంలోనే నివసించాలని పట్టుబట్టారు.[b]
  to: కానీ మనష్షే బేత్-షెయానుపై, దాని అనుబంధ పట్టణాలపై[a], తానాకుపై, దాని అనుబంధ పట్టణాలపై, దోరు నివాసులపై, దాని అనుబంధ పట్టణాలపై, ఇబ్లెయాము నివాసులపై, దాని అనుబంధ పట్టణాలపై, మెగిద్దో నివాసులపై, దాని అనుబంధ పట్టణాలపై ఉన్న వారి ఆధిపత్యాన్ని తొలగించలేదు. కనానీయులు ఈ దేశంలో నివసించాలని పట్టుబట్టారు.[b]
  rationale: ప్రధాన సవరణ మొదటి క్రియను నగరాల జాబితా మరియు నివాసుల జాబితా రెండింటికీ వ్యాకరణపరంగా, అర్థపరంగా సరిపోయేలా చేసింది. ‘వారి ఆధిపత్యం’ అనేది మూలంలోని dispossess/drive out భావాన్ని సందర్భోచితంగా వ్యక్తం చేస్తుంది; అది కేవలం నగరాలను స్వాధీనం చేసుకోవడం అనే ప్రత్యామ్నాయంపై ఆధారపడదు. పాదసూచిక గుర్తులు, వాటి పరిధి, మరియు ప్రత్యామ్నాయ పఠనం నిలుపబడ్డాయి.
