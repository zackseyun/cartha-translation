source:
  edition: WLC
  text: וְ/לֹא הוֹרִ֣ישׁ מְנַשֶּׁ֗ה אֶת בֵּית שְׁאָ֣ן וְ/אֶת בְּנוֹתֶי/הָ֮ וְ/אֶת תַּעְנַ֣ךְ וְ/אֶת בְּנֹתֶי/הָ֒ וְ/אֶת ישב ד֜וֹר וְ/אֶת בְּנוֹתֶ֗י/הָ וְ/אֶת יוֹשְׁבֵ֤י יִבְלְעָם֙ וְ/אֶת בְּנֹתֶ֔י/הָ וְ/אֶת יוֹשְׁבֵ֥י מְגִדּ֖וֹ וְ/אֶת בְּנוֹתֶ֑י/הָ וַ/יּ֨וֹאֶל֙ הַֽ/כְּנַעֲנִ֔י לָ/שֶׁ֖בֶת בָּ/אָ֥רֶץ הַ/זֹּֽאת־־־־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/027.yaml
  text: But Manasseh did not dispossess Beth-shean and its daughter towns[a], or Taanach and its daughter towns, or the inhabitants of Dor and its daughter towns, or the inhabitants of Ibleam and its daughter towns, or the inhabitants of Megiddo and its daughter towns[b]; and the Canaanites persisted in dwelling in this land.
translation:
  language: te
  text: కానీ మనష్షే బేత్-షెయానుపై, దాని అనుబంధ పట్టణాలపై[a], తానాకుపై, దాని అనుబంధ పట్టణాలపై, దోరు నివాసులపై, దాని అనుబంధ పట్టణాలపై, ఇబ్లెయాము నివాసులపై, దాని అనుబంధ పట్టణాలపై, మెగిద్దో నివాసులపై, దాని అనుబంధ పట్టణాలపై ఉన్న వారి ఆధిపత్యాన్ని తొలగించలేదు. కనానీయులు ఈ దేశంలో నివసించాలని పట్టుబట్టారు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ మూలంలో అక్షరార్థంగా ‘దాని కుమార్తెలు’; అంటే ప్రధాన పట్టణంపై ఆధారపడిన చిన్న పట్టణాలు లేదా నివాసాలు.
    reason: cultural_note
  - marker: b
    text: లేదా, ‘కనానీయులు ఈ దేశంలో నివసించాలని దృఢంగా నిర్ణయించుకున్నారు.’ హీబ్రూ క్రియ సుముఖతను లేదా దృఢసంకల్పాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹרִישׁ
  choice: స్వాధీనం నుంచి తొలగించలేదు
  rationale: హిఫిల్ రూపం ఆ ప్రజలు తమ భూస్వాధీనాన్ని కోల్పోయేలా చేయడం అనే కారణార్థక భావాన్ని ఇస్తుంది. ఇది కేవలం సైనికంగా తరిమివేయడానికన్నా విస్తృతమైన భావాన్ని నిలుపుతుంది.
- source_word: בְּנוֹתֶיהָ
  choice: దాని అనుబంధ పట్టణాలు
  rationale: అక్షరార్థంగా ‘దాని కుమార్తెలు’; ప్రధాన పట్టణంపై ఆధారపడిన చిన్న పట్టణాలు లేదా నివాసాలను సూచించే హీబ్రూ నుడికారం. ఆధునిక తెలుగులో అర్థవంతంగా ఉండేందుకు రూపకాన్ని ప్రధాన పాఠంలో వివరణాత్మకంగా ఇచ్చాం.
- source_word: ישב דּוֹר / יוֹשְׁבֵי יִבְלְעָם / יוֹשְׁבֵי מְגִדּוֹ
  choice: దోరు నివాసులు ... ఇబ్లెయాము నివాసులు ... మెగిద్దో నివాసులు
  rationale: ישׁב నుంచి వచ్చిన కృదంత రూపాలు ఆయా స్థలాల్లో నివసించేవారిని సామూహికంగా సూచిస్తున్నాయి.
- source_word: וַיּוֹאֶל
  choice: నివసించాలని పట్టుబట్టారు
  rationale: יאל ఇక్కడ సుముఖత, దృఢసంకల్పం లేదా పట్టుదలను సూచించవచ్చు. సందర్భంలో కనానీయులు అక్కడే ఉండిపోవాలనే పట్టుదలను సహజ తెలుగులో వ్యక్తం చేస్తుంది; ప్రత్యామ్నాయ భావాన్ని పాదసూచికలో నిలిపాం.
- source_word: הַכְּנַעֲנִי
  choice: కనానీయులు
  rationale: రూపరీత్యా ఏకవచనమైనా, ఇక్కడ జనసమూహాన్ని సూచించే సమష్టివాచకంగా ఉంది; తెలుగులో సహజంగా బహువచనం వాడాం.
- source_word: לָשֶׁבֶת בָּאָרֶץ הַזֹּאת
  choice: ఈ దేశంలోనే నివసించాలని
  rationale: ל తో కూడిన క్రియానామం వారు దృఢంగా కోరుకున్న కార్యాన్ని తెలియజేస్తుంది. ‘ఈ’ అనేది హీబ్రూ నిర్దేశక పదబలాన్ని, ‘నే’ సందర్భంలోని కొనసాగింపు భావాన్ని సహజంగా వ్యక్తం చేస్తాయి.
- source_word: בֵּית שְׁאָן / תַּעְנַךְ / דּוֹר / יִבְלְעָם / מְגִדּוֹ
  choice: బేత్-షెయాను / తానాకు / దోరు / ఇబ్లెయాము / మెగిద్దో
  rationale: హీబ్రూ స్థలనామాల ఉచ్చారణను ఆధారంగా చేసుకొని, తెలుగు విభక్తులు సహజంగా చేరేలా లిప్యంతరీకరించాం.
