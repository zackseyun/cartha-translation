id: JDG.1.18
reference: Judges 1:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּלְכֹּ֤ד יְהוּדָה֙ אֶת עַזָּ֣ה וְ/אֶת גְּבוּלָ֔/הּ וְ/אֶֽת אַשְׁקְל֖וֹן וְ/אֶת גְּבוּלָ֑/הּ וְ/אֶת עֶקְר֖וֹן וְ/אֶת גְּבוּלָֽ/הּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/018.yaml
  text: Judah captured Gaza and its territory[a], Ashkelon and its territory, and Ekron and its territory.
translation:
  language: te
  text: యూదా గాజాను, దాని ప్రాంతాన్ని[a], అష్కెలోనును, దాని ప్రాంతాన్ని, ఎక్రోనును, దాని ప్రాంతాన్ని స్వాధీనం చేసుకున్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘దాని ప్రాంతం’ అని వచ్చిన ప్రతి చోటా ‘దాని సరిహద్దు’ అని కూడా అనువదించవచ్చు; హీబ్రూ పదం సరిహద్దును గానీ, ఆ సరిహద్దుల్లోని ప్రాంతాన్ని గానీ సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלְכֹּד
  choice: స్వాధీనం చేసుకున్నాడు
  rationale: לכד అనే క్రియ యుద్ధ సందర్భంలో ఒక పట్టణాన్ని లేదా స్థలాన్ని పట్టుకోవడం, వశం చేసుకోవడం అనే అర్థం ఇస్తుంది. ఆధునిక తెలుగులో ‘స్వాధీనం చేసుకున్నాడు’ సహజంగా ఉండి సైనిక సందర్భాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: יְהוּדָה
  choice: యూదా
  rationale: ఇక్కడ యూదా అనే పేరు సమష్టిగా గోత్రాన్ని సూచిస్తుంది. మూలంలో లేని ‘గోత్రం’ అనే వివరణను ప్రధాన పాఠ్యంలో చేర్చకుండా పేరునే ఉంచాం.
- source_word: גְּבוּלָהּ
  choice: దాని ప్రాంతం
  rationale: גְּבוּל అనే పదం సరిహద్దు లేదా ఆ సరిహద్దుల్లోని ప్రాంతం అనే రెండు అర్థాలు ఇవ్వగలదు. పట్టణాల జాబితా మరియు విజయ సందర్భంలో వాటి ఆధీన ప్రాంతం అనే భావాన్ని ‘ప్రాంతం’ సహజంగా తెలియజేస్తుంది; ‘సరిహద్దు’ అనే ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలిపాం.
- source_word: עַזָּה
  choice: గాజా
  rationale: ఈ స్థలనామానికి తెలుగులో ప్రాచుర్యంలో ఉన్న రూపం.
- source_word: אַשְׁקְלוֹן
  choice: అష్కెలోను
  rationale: హీబ్రూ స్థలనామ ధ్వనికి దగ్గరగా ఉండే, తెలుగు బైబిలు శైలికి సహజమైన లిప్యంతరీకరణ.
- source_word: עֶקְרוֹן
  choice: ఎక్రోను
  rationale: హీబ్రూ స్థలనామ ధ్వనికి దగ్గరగా ఉండే తెలుగు లిప్యంతరీకరణ.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడబడింది. యూదాను సమష్టి ఏకవచనంగా పరిగణించి క్రియను పుంలింగ ఏకవచనంలో ఉంచాం. పునరుక్తిని మూలపాఠ్య జాబితా నిర్మాణానికి అనుగుణంగా నిలిపాం.
