  yaml_path: translation/ot/judges/001/020.yaml
  text: They gave Hebron to Caleb[a], as Moses had said, and he drove out from there the three sons of Anak.
translation:
  language: te
  text: మోషే చెప్పినట్లుగా వారు హెబ్రోనును కాలేబుకు ఇచ్చారు. అతడు అక్కడి నుండి అనాకు ముగ్గురు కుమారులను[a] వెళ్లగొట్టాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “అనాకు చెందిన ముగ్గురు వంశస్థులను” లేదా “ముగ్గురు అనాకీయులను.” హీబ్రూ మూలంలో “అనాకు కుమారులు” అని ఉంది; ఇది అతని సొంత కుమారులనే కాక, అతని వంశానికి చెందినవారిని కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ לְכָלֵב אֶת־חֶבְרוֹן
  choice: వారు హెబ్రోనును కాలేబుకు ఇచ్చారు
  rationale: נתן యొక్క కథన భూతకాల భావాన్ని సహజమైన తెలుగు వాక్యక్రమంలో వ్యక్తం చేస్తుంది; לְ సూచించే పరోక్ష కర్మను ‘కాలేబుకు’గా నిలుపుతుంది.
- source_word: כַּאֲשֶׁר דִּבֶּר מֹשֶׁה
  choice: మోషే చెప్పినట్లుగా
  rationale: כַּאֲשֶׁר యొక్క ‘చెప్పిన ప్రకారం/చెప్పినట్లుగా’ భావాన్ని, דִּבֶּרలో లేని ‘వాగ్దానం చేశాడు’ అనే అదనపు భావాన్ని చేర్చకుండా అందిస్తుంది.
- source_word: וַיּוֹרֶשׁ
  choice: వెళ్లగొట్టాడు
  rationale: ఇది ירש హిఫిల్ రూపం; ఇక్కడ వ్యక్తులు కర్మగా ఉన్నందున ‘స్వాధీనం చేసుకున్నాడు’ కంటే వారిని అక్కడి నుంచి తొలగించిన చర్యను ‘వెళ్లగొట్టాడు’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: מִשָּׁם
  choice: అక్కడి నుండి
  rationale: ముందు ప్రస్తావించిన హెబ్రోనును సూచించే మూలంలోని స్థానవాచక ప్రయోగాన్ని నిలుపుతుంది.
- source_word: אֶת־שְׁלֹשָׁה בְּנֵי הָעֲנָק
  choice: అనాకు చెందిన ముగ్గురు కుమారులను
  rationale: בְּנֵי యొక్క ప్రాథమిక ‘కుమారులు’ అర్థాన్ని ప్రధాన పాఠ్యంలో ఉంచుతుంది; ఇది తక్షణ కుమారులనే కాక వంశస్థులు లేదా వంశగణ సభ్యులను కూడా సూచించగల అస్పష్టతను పాదసూచికలో తెలుపుతుంది.
