translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన కథన శైలిని వాడుతూ, వ్యక్తి మరియు స్థలనామాలకు సాధారణ తెలుగు బైబిలు రూపాలైన మోషే, హెబ్రోను, కాలేబు, అనాకు అనే రూపాలను ఉపయోగించాం. హీబ్రూ వాక్యంలోని వరుస చర్యలను రెండు చిన్న వాక్యాలుగా ఇచ్చి పఠన సౌలభ్యాన్ని పెంచాం. పాదసూచిక గుర్తును అది వివరిస్తున్న ‘ముగ్గురు కుమారులను’ అన్న పదబంధం వద్ద ఉంచాం.
