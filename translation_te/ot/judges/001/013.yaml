source:
  edition: WLC
  text: וַֽ/יִּלְכְּדָ/הּ֙ עָתְנִיאֵ֣ל בֶּן קְנַ֔ז אֲחִ֥י כָלֵ֖ב הַ/קָּטֹ֣ן מִמֶּ֑/נּוּ וַ/יִּתֶּן ל֛/וֹ אֶת עַכְסָ֥ה בִתּ֖/וֹ לְ/אִשָּֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/013.yaml
  text: Othniel son of Kenaz[a], Caleb’s younger brother, captured it, and he gave him his daughter Achsah as a wife.
translation:
  language: te
  text: కెనజు కుమారుడైన, కాలేబు తమ్ముడైన ఒత్నీయేలు[a] దాన్ని స్వాధీనం చేసుకున్నాడు. అప్పుడు కాలేబు తన కుమార్తె అక్సాను అతనికి భార్యగా ఇచ్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కెనజు కుమారుడైన ఒత్నీయేలు, కాలేబుకంటే చిన్నవాడు,” లేదా “కాలేబు యువ బంధువు.” హీబ్రూ పాఠ్యం అత్యంత సహజంగా “కాలేబు సోదరుడు, అతనికంటే చిన్నవాడు” అని చదవబడుతుంది; అయితే బంధుత్వ పదాన్ని కొందరు విస్తృతార్థంలో గ్రహిస్తారు.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּלְכְּדָהּ
  choice: దాన్ని స్వాధీనం చేసుకున్నాడు
  rationale: לכד అనే క్రియ పట్టణాన్ని యుద్ధంలో పట్టుకోవడం లేదా వశపరచుకోవడం అనే భావాన్ని ఇస్తుంది. స్త్రీలింగ ఏకవచన ప్రత్యయం మునుపటి వచనంలోని పట్టణాన్ని సూచిస్తుంది.
- source_word: עָתְנִיאֵל
  choice: ఒత్నీయేలు
  rationale: హీబ్రూ వ్యక్తిపేరును తెలుగు ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: בֶּן קְנַז
  choice: కెనజు కుమారుడు
  rationale: సాధారణ వంశసంబంధ నిర్మాణాన్ని నేరుగా నిలిపాం.
- source_word: אֲחִי כָלֵב הַקָּטֹן מִמֶּנּוּ
  choice: కాలేబు తమ్ముడు
  rationale: పదబంధం సహజంగా ‘కాలేబు సోదరుడు, అతనికంటే చిన్నవాడు’ అని అర్థమవుతుంది; తెలుగులో ‘తమ్ముడు’ ఈ రెండు అంశాలనూ సంక్షిప్తంగా తెలియజేస్తుంది. బంధుత్వ పదాన్ని విస్తృతార్థంలో తీసుకునే అవకాశాన్ని పాదసూచికలో ఉంచాం.
- source_word: וַיִּתֶּן לוֹ
  choice: అప్పుడు కాలేబు ... అతనికి ఇచ్చాడు
  rationale: హీబ్రూలో కర్త సర్వనామ రూపంలో సందర్భం ద్వారా తెలిసినా, తెలుగులో ఇద్దరు పురుషులు ప్రస్తావించబడుతున్నందున సందిగ్ధత నివారించడానికి సందర్భానుసారంగా ‘కాలేబు’ అని స్పష్టం చేశాం.
- source_word: עַכְסָה
  choice: అక్సా
  rationale: హీబ్రూ వ్యక్తిపేరును తెలుగు ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: בִתּוֹ לְאִשָּׁה
  choice: తన కుమార్తె అక్సాను అతనికి భార్యగా ఇచ్చాడు
  rationale: స్త్రీని వివాహంలో ఇవ్వడాన్ని తెలిపే హీబ్రూ ప్రయోగాన్ని సహజమైన, గౌరవప్రదమైన ఆధునిక తెలుగులో వ్యక్తం చేశాం.
theological_decisions:
- issue: ఒత్నీయేలుకు కాలేబుతో ఉన్న బంధుత్వం
  choice: ప్రధాన పాఠ్యంలో ఒత్నీయేలును కాలేబు తమ్ముడిగా అనువదించాం.
  alternative: ‘కాలేబుకంటే చిన్నవాడైన కెనజు కుమారుడు ఒత్నీయేలు’ లేదా ‘కాలేబు వంశానికి చెందిన చిన్నవాడు’ అని కూడా అర్థం చేసుకునే అవకాశం ఉంది.
  rationale: హీబ్రూ వాక్యనిర్మాణం అత్యంత సహజంగా ‘కాలేబు సోదరుడు, అతనికంటే చిన్నవాడు’ అని చదవబడుతుంది. అయితే אֲחִי అనే బంధుత్వ పదాన్ని కొందరు విస్తృత వంశబంధార్థంలో గ్రహిస్తారు. అందువల్ల సరళమైన పఠనాన్ని ప్రధాన పాఠ్యంలో ఉంచి, నిజమైన వ్యాఖ్యాన భేదాన్ని పాదసూచికలో కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. ‘స్వాధీనం చేసుకున్నాడు’ యుద్ధసందర్భంలోని పట్టణ ఆక్రమణ భావాన్ని నిలుపుతుంది. సర్వనామాల సందిగ్ధతను నివారించేందుకు రెండో వాక్యంలో ‘కాలేబు’ అనే పేరును పునరుక్తి చేశాం.
