translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వచనం. గోత్ర సంబంధానికి ‘వంశస్థులు’, భౌగోళిక מִדְבָּרకు ‘అరణ్యం’ వాడాం. హీబ్రూలోని బహువచనం నుంచి ఏకవచనానికి మార్పును సరిచేయకుండా నిలిపాం; ‘ఆ ప్రజలు’ ఎవరనే అస్పష్టతను కూడా ప్రధాన పాఠ్యంలో కాపాడాం. ప్రతి పాదటిప్పణి గుర్తు ప్రధాన పాఠ్యంలో ఉంది.
