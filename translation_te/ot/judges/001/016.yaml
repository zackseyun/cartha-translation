id: JDG.1.16
reference: Judges 1:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/בְנֵ֣י קֵינִי֩ חֹתֵ֨ן מֹשֶׁ֜ה עָל֨וּ מֵ/עִ֤יר הַ/תְּמָרִים֙ אֶת בְּנֵ֣י יְהוּדָ֔ה מִדְבַּ֣ר יְהוּדָ֔ה אֲשֶׁ֖ר בְּ/נֶ֣גֶב עֲרָ֑ד וַ/יֵּ֖לֶךְ וַ/יֵּ֥שֶׁב אֶת הָ/עָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/016.yaml
  text: And the descendants of the Kenite[a], Moses’ father-in-law, went up from the City of Palms with the descendants of Judah into the wilderness of Judah, which is in the Negev of Arad[d][c][b]; then he went and settled with the people.
translation:
  language: te
  text: మోషే మామగారైన కేనీయుని వంశస్థులు[a] ఖర్జూర చెట్ల పట్టణం[b] నుండి యూదా వంశస్థులతో కలిసి అరాదు నెగెబులో ఉన్న యూదా అరణ్యానికి పైకి వెళ్లారు; తరువాత అతడు[c] వెళ్లి ప్రజలతో[d] నివసించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘మోషే మామగారు’ అనే మాటను ‘మోషేకు వివాహ బంధువు’ అని కూడా అర్థం చేసుకోవచ్చు; హీబ్రూ పదం సాధారణంగా మామను సూచించినా, విస్తృతమైన వివాహ బంధాన్ని కూడా సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: ‘ఖర్జూర చెట్ల పట్టణం’ సాధారణంగా యెరికోను సూచిస్తుందని భావిస్తారు.
    reason: cross_reference
  - marker: c
    text: ఇక్కడ హీబ్రూ పాఠం బహువచనం నుండి ఏకవచనానికి మారి, ‘అతడు వెళ్లి నివసించాడు’ అని చెబుతుంది. ఇది కేనీయుల వంశాన్ని సమష్టిగా సూచించవచ్చు; కొందరు దీనిని బహువచన భావంలో అర్థం చేసుకుంటారు.
    reason: grammatical_ambiguity
  - marker: d
    text: ‘ప్రజల మధ్య’ అని కూడా అనువదించవచ్చు. కొన్ని ప్రాచీన సాక్ష్యాల్లో ‘ప్రజలతో’ అనే చోట ‘అమాలేకీయులతో’ అనే పాఠం కనిపిస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: וּבְנֵי קֵינִי
  choice: కేనీయుని వంశస్థులు
  rationale: בְּנֵי అనే పదం ఇక్కడ తక్షణ కుమారులను మాత్రమే కాకుండా ఒక వంశం లేదా గోత్రానికి చెందిన వారిని సూచిస్తుంది; అందువల్ల సహజమైన ఆధునిక తెలుగులో ‘వంశస్థులు’ అని అనువదించాం.
- source_word: חֹתֵן מֹשֶׁה
  choice: మోషే మామగారు
  rationale: חֹתֵן సాధారణంగా వివాహ బంధంలోని మామను, ముఖ్యంగా భార్య తండ్రిని సూచిస్తుంది. తెలుగులో ‘మామగారు’ సహజంగా ఉండగా, పదానికి ఉండగల విస్తృత వివాహ బంధార్థాన్ని పాదటిప్పణిలో నిలిపాం.
- source_word: עָלוּ
  choice: వెళ్లారు
  rationale: עלה అక్షరార్థంగా ‘పైకి వెళ్లారు’; అయితే తెలుగులో ఈ భౌగోళిక ప్రయాణ సందర్భంలో ‘వెళ్లారు’ సహజంగా ఉంటుంది. గమ్యస్థానానికి జరిగిన ప్రయాణ భావం నిలుస్తుంది.
- source_word: מֵעִיר הַתְּמָרִים
  choice: ఖర్జూర చెట్ల పట్టణం నుండి
  rationale: హీబ్రూ వచనం స్థలనామాన్ని ప్రత్యక్షంగా చెప్పకుండా ‘ఖర్జూర చెట్ల పట్టణం’ అనే వర్ణనను ఉపయోగిస్తుంది; అదే రూపాన్ని ప్రధాన పాఠ్యంలో ఉంచాం.
- source_word: אֶת בְּנֵי יְהוּדָה
  choice: యూదా వంశస్థులతో కలిసి
  rationale: ఇక్కడ אֶת సహచర్యార్థకంగా ‘తో’ అని అర్థం; בְּנֵי గోత్ర సభ్యులను సూచిస్తున్నందున ‘వంశస్థులు’ సరిపోతుంది.
- source_word: מִדְבַּר יְהוּדָה
  choice: యూదా అరణ్యానికి
  rationale: מִדְבָּר జనావాసం తక్కువైన అరణ్య/ఎడారి ప్రాంతాన్ని సూచిస్తుంది. ‘అరణ్యం’ బైబిలు భౌగోళిక సందర్భానికి తగిన, గౌరవప్రదమైన తెలుగు పదం.
- source_word: אֲשֶׁר בְּנֶגֶב עֲרָד
  choice: అరాదు నెగెబులో ఉన్న
  rationale: נֶגֶב ప్రాంతనామంగా లేదా దక్షిణ ప్రాంతంగా అర్థమవుతుంది. భౌగోళిక అస్పష్టతను ముందే పరిష్కరించకుండా ‘అరాదు నెగెబు’గా నిలిపాం.
- source_word: וַיֵּלֶךְ וַיֵּשֶׁב
  choice: తరువాత అతడు వెళ్లి ... నివసించాడు
  rationale: ముందున్న బహువచనం తరువాత హీబ్రూలో క్రియలు ఏకవచనానికి మారుతాయి. ఆ గమనించదగిన మార్పును ‘అతడు’తో యథాతథంగా నిలిపాం; అది కేనీయుల వంశాన్ని సమష్టి ఏకవచనంగా సూచించవచ్చు.
- source_word: אֶת הָעָם
  choice: ఆ ప్రజలతో
  rationale: మసొరెటిక్ పాఠం అక్షరార్థంగా ‘ఆ ప్రజలతో’ అని ఉంది; వారు ఎవరో పాఠ్యం స్పష్టంగా చెప్పదు. అందువల్ల సంభావ్య సూచ్యాన్ని ప్రధాన పాఠ్యంలో నిర్ధారించలేదు.
