  text: וַ/יּ֤וֹאֶל הָֽ/אֱמֹרִי֙ לָ/שֶׁ֣בֶת בְּ/הַר חֶ֔רֶס בְּ/אַיָּל֖וֹן וּ/בְ/שַֽׁעַלְבִ֑ים וַ/תִּכְבַּד֙ יַ֣ד בֵּית יוֹסֵ֔ף וַ/יִּהְי֖וּ לָ/מַֽס־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/035.yaml
  text: But the Amorites persisted in dwelling in Mount Heres[a], in Aijalon, and in Shaalbim; then the hand of the house of Joseph grew heavy[b], and they became subject to forced labor.
translation:
  language: te
  text: అయితే అమోరీయులు హెరెసు పర్వతంలో, అయాలోనులో, షయల్బీములో నివసించాలని పట్టుదలతో ఉన్నారు. తరువాత యోసేపు వంశపు చేయి బరువెక్కింది[a]; వారు బలవంతపు శ్రమకు గురయ్యారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘యోసేపు వంశం పైచేయి సాధించింది.’ అక్షరార్థంగా, ‘చేయి బరువెక్కింది.’ ఈ హీబ్రూ నుడికారం పెరుగుతున్న బలాన్ని లేదా అణచివేసే అధికారాన్ని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘వారితో బలవంతంగా పని చేయించారు’ లేదా ‘వారు నిర్బంధ శ్రమికులయ్యారు.’ హీబ్రూ పదం తప్పనిసరిగా చేయించే శ్రమసేవను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹאֶל
  choice: నివసించాలనే పట్టుదలతో ఉన్నారు
  rationale: యאל్ అనే క్రియ ఇక్కడ ఇష్టపడడం, సంకల్పించడం, పట్టుదల చూపడం అనే భావాలను కలిగిస్తుంది. అమోరీయులు అక్కడే ఉండిపోవడానికి గట్టిగా నిర్ణయించుకున్నారనే సందర్భార్థాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: הָאֱמֹרִי
  choice: అమోరీయులు
  rationale: హీబ్రూలో ఏకవచన రూపంలో ఉన్నప్పటికీ ఇది ప్రజాసమూహాన్ని సూచిస్తుంది; తరువాతి బహువచన క్రియ కూడా దీన్ని బలపరుస్తుంది.
- source_word: בְּהַר חֶרֶס
  choice: హెరెసు కొండలో
  rationale: הַר అనే పదానికి కొండ లేదా పర్వతప్రాంతం అనే అర్థం ఉండవచ్చు. స్థలనామాన్ని అనువదించకుండా ఉంచి, తెలుగులో సహజంగా ‘హెరెసు కొండ’ అని ఇచ్చాం.
- source_word: בְּאַיָּלוֹן
  choice: అయాలోనులో
  rationale: స్థలనామాన్ని తెలుగు లిపిలో హీబ్రూ ఉచ్చారణకు సమీపంగా లిప్యంతరీకరించాం.
- source_word: וּבְשַׁעַלְבִים
  choice: షయల్బీములో
  rationale: స్థలనామాన్ని తెలుగు లిపిలో హీబ్రూ రూపానికి సమీపంగా లిప్యంతరీకరించాం.
- source_word: וַתִּכְבַּד יַד
  choice: చెయ్యి వారిమీద బరువైంది
  rationale: మూలంలోని ‘చెయ్యి బరువైంది’ అనే స్పష్టమైన రూపకాన్ని నిలిపి, అది అమోరీయులపై పెరిగిన ఆధిపత్యాన్ని సూచిస్తుందని సందర్భం ద్వారా గ్రహించగలిగేలా ‘వారిమీద’ అని చేర్చాం.
- source_word: בֵּית יוֹסֵף
  choice: యోసేపు వంశం
  rationale: ‘యోసేపు ఇల్లు’ అనే అక్షరార్థం ఇక్కడ యోసేపుతో సంబంధమున్న గోత్రసమూహాన్ని సూచిస్తుంది. ‘యోసేపు వంశం’ ఆధునిక తెలుగులో స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: וַיִּהְיוּ לָמַס
  choice: వారు వెట్టిచాకిరికి లోనయ్యారు
  rationale: מַס ఇక్కడ కేవలం ధనరూప కప్పాన్ని కాక, బలవంతంగా చేయించే శ్రమసేవను సూచిస్తుంది. ‘వెట్టిచాకిరి’ ఆ భావాన్ని సంక్షిప్తంగా, స్పష్టంగా తెలియజేస్తుంది.
