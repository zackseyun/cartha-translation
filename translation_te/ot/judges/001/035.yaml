review_pass:
  verdict: revise
  source_fidelity: The draft correctly takes the Amorite as a collective, renders וַיּוֹאֶל as determined/persistent residence, retains the three place names, and identifies the Amorites as those assigned to compulsory labor. However, ‘వారిమీద’ (“upon them”) is not explicit in the Hebrew clause about the hand of the house of Joseph; the context supports it, but the main text can preserve the Hebrew’s compact ambiguity more closely.
  naturalness: ‘యోసేపు వంశం చెయ్యి’ is not idiomatic Telugu possessive phrasing, and ‘బరువైంది’ is less natural here than ‘బరువెక్కింది.’ ‘బలవంతపు శ్రమకు గురయ్యారు’ is clearer in modern standard Telugu than ‘వెట్టిచాకిరికి లోనయ్యారు,’ while retaining the compulsory-labor sense.
  terminology: ‘యోసేపు వంశం’ appropriately represents ‘the house of Joseph’ in clear modern Telugu. ‘అమోరీయులు’ and the transliterated place names are suitable. The footnote markers are placed beside the expressions they explain, unlike the misaligned anchors in the supplied English audit trail.
  issues:
  - severity: medium
    issue: The main text adds ‘వారిమీద’ to the idiom about Joseph’s hand.
    rationale: The Hebrew says literally that the hand of the house of Joseph became heavy; it does not explicitly state ‘upon them.’ The implied object is clear from context, but it need not be supplied in this formally oriented rendering.
  - severity: low
    issue: Possessive wording and idiom need smoothing.
    rationale: ‘యోసేపు వంశపు చేయి బరువెక్కింది’ is grammatically natural Telugu and preserves the Hebrew image better than ‘యోసేపు వంశం చెయ్యి వారిమీద బరువైంది.’
  - severity: low
    issue: The compulsory-labor expression can be made more broadly transparent.
    rationale: ‘బలవంతపు శ్రమకు గురయ్యారు’ is current standard Telugu and directly communicates the meaning of למס without relying on the somewhat regionally or historically colored term ‘వెట్టిచాకిరి.’
  revised_text: అయితే అమోరీయులు హెరెసు పర్వతంలో, అయాలోనులో, షయల్బీములో నివసించాలని పట్టుదలతో ఉన్నారు. తరువాత యోసేపు వంశపు చేయి బరువెక్కింది[a]; వారు బలవంతపు శ్రమకు గురయ్యారు[b].
