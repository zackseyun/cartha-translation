id: JDG.1.1
reference: Judges 1:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְהִ֗י אַחֲרֵי֙ מ֣וֹת יְהוֹשֻׁ֔עַ וַֽ/יִּשְׁאֲלוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל בַּ/יהוָ֖ה לֵ/אמֹ֑ר מִ֣י יַעֲלֶה לָּ֧/נוּ אֶל הַֽ/כְּנַעֲנִ֛י בַּ/תְּחִלָּ֖ה לְ/הִלָּ֥חֶם בּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/001.yaml
  text: And it happened after the death of Joshua that the sons of Israel asked Yahweh[a], saying[b], “Who will go up for us first against the Canaanites to fight against them?”
translation:
  language: te
  text: 'యెహోషువ మరణించిన తరువాత, ఇశ్రాయేలు కుమారులు యాహ్వేను ఇలా అడిగారు: “కనానీయుల మీదికి వారితో యుద్ధం చేయడానికి మా కొరకు మొదట ఎవరు వెళ్లాలి?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ‘కనానీయుడు’ మరియు దానిని సూచించే సర్వనామం ఏకవచన రూపాల్లో ఉన్నాయి; ఇక్కడ అవి కనానీయుల ప్రజాసమూహాన్ని సూచిస్తున్నాయి.
    reason: మూలంలోని వ్యాకరణ ఏకవచన రూపం, అనువాదంలో వ్యక్తపరిచిన సమూహార్థక బహువచనాన్ని వివరిస్తుంది.
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי מוֹת יְהוֹשֻׁעַ
  choice: యెహోషువ మరణించిన తరువాత
  rationale: హీబ్రూ వాక్యారంభ కథన సూత్రాన్ని తెలుగులో కృత్రిమంగా ‘అది సంభవించింది’ అని కాకుండా సహజమైన కాలసూచక ఉపవాక్యంగా వ్యక్తపరుస్తుంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: మూలంలోని ‘ఇశ్రాయేలు కుమారులు’ అనే పురుష బహువచన రూపాన్ని పారదర్శకంగా నిలుపుతుంది; ఇది సమూహపరంగా ఇశ్రాయేలు ప్రజలను సూచిస్తుంది.
- source_word: וַיִּשְׁאֲלוּ בַּיהוָה
  choice: యెహోవాను ఇలా అడిగారు
  rationale: שׁאל అనేది ఇక్కడ దేవుని మార్గదర్శకత కోరడాన్ని సూచిస్తుంది. తెలుగులో ‘అడిగారు’ ప్రత్యక్షంగా, సహజంగా ఉంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవ నామమైన చతురక్షర నామాన్ని సాధారణ బిరుదుతో భర్తీ చేయకుండా తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో ఉంచింది.
- source_word: מִי יַעֲלֶה לָּנוּ
  choice: మా పక్షంగా మొదట ఎవరు బయలుదేరాలి
  rationale: עלה యొక్క సైనిక ముందడుగు భావాన్ని ‘బయలుదేరాలి’ సహజంగా అందిస్తుంది; לָנוּ యొక్క ప్రయోజనార్థక భావాన్ని ‘మా పక్షంగా’ స్పష్టం చేస్తుంది.
- source_word: אֶל הַכְּנַעֲנִי
  choice: కనానీయులతో
  rationale: హీబ్రూలో ఏకవచన రూపం ఉన్నా అది కనానీయుల సమూహాన్ని సూచిస్తుంది. యుద్ధ సందర్భంలో తెలుగు సహజ ప్రయోగం ‘కనానీయులతో’.
- source_word: בַּתְּחִלָּה
  choice: మొదట
  rationale: గోత్రాల యుద్ధ క్రమాన్ని నిర్ణయించే సందర్భంలో సరళమైన, సహజమైన సమానార్థకం.
- source_word: לְהִלָּחֶם בּוֹ
  choice: యుద్ధం చేయడానికి
  rationale: לחם యొక్క పోరాట భావాన్ని ప్రస్తుత సందర్భంలో గౌరవప్రదమైన సాధారణ తెలుగులో వ్యక్తపరుస్తుంది; ప్రత్యర్థి ఇప్పటికే ‘కనానీయులతో’ అన్న పదంలో సూచించబడింది.
theological_decisions:
- issue: దైవ నామం יְהוָה యొక్క అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలపాఠం దైవ నామాన్ని ప్రత్యక్షంగా వాడుతుంది. దానిని ‘ప్రభువు’ అనే బిరుదుగా మార్చకుండా వ్యక్తినామంగా నిలిపి, ఆధునిక తెలుగు బైబిలు పాఠకులకు విస్తృతంగా తెలిసిన రూపాన్ని ఎంచుకుంది; అసలు ఉచ్చారణపై అనిశ్చితిని పాదసూచిక తెలియజేస్తుంది.
- issue: הַכְּנַעֲנִי మరియు בּוֹ లోని వ్యాకరణ ఏకవచనం
  choice: సమూహార్థక బహువచనంగా కనానీయులు
  alternative: కనానీయుడు / అతనితో
  rationale: రూపపరంగా ఏకవచనమైనా సందర్భంలో కనాను ప్రజాసమూహాన్ని సూచిస్తుంది. తెలుగులో వ్యక్తిగత కనానీయుడిని సూచించినట్లు అపార్థం కాకుండా సమూహార్థం వ్యక్తం చేయబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘ఇశ్రాయేలు కుమారులు’ మూల రూపాన్ని నిలుపుతుండగా, మిగతా వాక్య నిర్మాణం సాధారణ పాఠకులకు సులభంగా ఉండేలా రూపొందించబడింది. అన్ని పాదసూచిక సూచికలు ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
