- from: 'యెహోషువ మరణించిన తరువాత, ఇశ్రాయేలు కుమారులు యెహోవాను[a] ఇలా అడిగారు: “కనానీయులతో యుద్ధం చేయడానికి మా పక్షంగా మొదట ఎవరు బయలుదేరాలి?”[b]'
  to: 'యెహోషువ మరణించిన తరువాత, ఇశ్రాయేలు కుమారులు యాహ్వేను ఇలా అడిగారు: “కనానీయుల మీదికి వారితో యుద్ధం చేయడానికి మా కొరకు మొదట ఎవరు వెళ్లాలి?”[a]'
  rationale: The revision uses the project’s current rendering of the divine name, replaces an unnatural expression for ‘for us’ with ‘మా కొరకు,’ and makes the military advance and the object of fighting explicit. It retains the source’s collective reference to the Canaanites and documents the singular Hebrew forms in a footnote.
