  text: וַ/תֵּצֵ֣א יָעֵל֮ לִ/קְרַ֣את סִֽיסְרָא֒ וַ/תֹּ֣אמֶר אֵלָ֗י/ו סוּרָ֧/ה אֲדֹנִ֛/י סוּרָ֥/ה אֵלַ֖/י אַל תִּירָ֑א וַ/יָּ֤סַר אֵלֶ֨י/הָ֙ הָ/אֹ֔הֱלָ/ה וַ/תְּכַסֵּ֖/הוּ בַּ/שְּׂמִיכָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/018.yaml
  text: Jael went out to meet Sisera and said to him[a], “Turn aside, my lord, turn aside to me; do not be afraid.” So he turned aside to her into the tent[b], and she covered him with a blanket.
translation:
  language: te
  text: యాయేలు సీసెరాను కలుసుకోవడానికి బయటికి వెళ్లి అతనితో, “నా ప్రభూ, ఇటు మళ్లండి; నా దగ్గరికి మళ్లండి[a]. భయపడకండి” అంది. అతడు ఆమె వైపుకు మళ్లి గుడారంలోకి వెళ్లాడు. అప్పుడు ఆమె అతనిని ఒక దుప్పటితో[b] కప్పింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “లోపలికి రండి.” హెబ్రీ క్రియకు అక్షరార్థంగా “దారి మళ్లండి” లేదా “పక్కకు తిరగండి” అని అర్థం; తన దారిని విడిచి ఆశ్రయం కోసం రావడమనే చిత్రం ఇందులో ఉంది.
    reason: lexical_alternative
  - marker: b
    text: ఈ హెబ్రీ పదం పరుపు, తివాచీ లేదా మరొక కప్పే వస్త్రాన్ని కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּצֵא
  choice: బయటికి వెళ్లి
  rationale: יצא అనే క్రియలోని బయటికి కదలడమనే ప్రాథమిక భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: לִקְרַאת
  choice: కలుసుకోవడానికి
  rationale: ఎదురుగా వెళ్లి ఒకరిని కలుసుకోవాలనే ఉద్దేశపూర్వక కదలికను సందర్భానుగుణంగా తెలియజేస్తుంది.
- source_word: סוּרָה
  choice: ఇటు తిరగండి
  rationale: సీసెరా తన దారిని విడిచి యాయేలు వైపు రావాలనే మూలభాషలోని చిత్రాన్ని, అలాగే రెండుసార్లు వచ్చిన క్రియను నిలుపుతుంది.
- source_word: אֲדֹנִי
  choice: నా ప్రభూ
  rationale: ఇక్కడ ఇది దైవనామం కాదు; ఉన్నత స్థితిలోని పురుషునికి చెప్పే గౌరవపూర్వక సంబోధన. ఆధునిక గౌరవభావాన్ని నిలుపుతూ యాజమాన్యార్థాన్ని బలవంతంగా చేర్చదు.
- source_word: אַל תִּירָא
  choice: భయపడకండి
  rationale: భయపడవద్దనే నిషేధార్థక భరోసాను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וַיָּסַר
  choice: తిరిగి
  rationale: యాయేలు ఉపయోగించిన סור క్రియతో పదసంబంధాన్ని నిలుపుతూ, సీసెరా ఆమె ఆహ్వానానికి స్పందించాడని చూపుతుంది.
- source_word: הָאֹהֱלָה
  choice: గుడారంలోకి వెళ్లాడు
  rationale: దిశను సూచించే ప్రత్యయం గుడారం వైపు కదలికను తెలియజేస్తుంది; సందర్భంలో లోపలికి ప్రవేశించడం స్పష్టంగా ఉన్నందున ‘గుడారంలోకి’ అని అనువదించబడింది.
- source_word: וַתְּכַסֵּהוּ
  choice: అతనిని ... కప్పింది
  rationale: כסה యొక్క ప్రాథమికమైన ‘కప్పు’ అనే అర్థాన్ని నిలుపుతుంది; ‘దాచింది’ అనే సందర్భ సూచనను పదార్థంలోకి చేర్చదు.
- source_word: בַּשְּׂמִיכָה
  choice: ఒక దుప్పటితో
  rationale: శరీరాన్ని కప్పే వస్త్రం అనే భావాన్ని సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే పదంతో తెలియజేస్తుంది; వస్తువు ఖచ్చిత స్వరూపంపై ఉన్న అనిశ్చితిని పాదసూచికలో నిలుపుతుంది.
