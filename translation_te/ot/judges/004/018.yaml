translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి ఉపయోగించబడింది. యాయేలు సీసెరాను సంబోధించినప్పుడు గౌరవ బహువచనం వాడబడింది. మూలంలోని סור క్రియ పునరుక్తిని సాధ్యమైనంతవరకు ‘ఇటు తిరగండి’ అని రెండుసార్లు నిలిపి, దాని మరింత సహజమైన సందర్భార్థాన్ని పాదసూచికలో ఇచ్చాం.
