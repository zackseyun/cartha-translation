- from: యాయేలు సీసెరాను కలుసుకోవడానికి బయటికి వెళ్లి అతనితో, “నా ప్రభూ, ఇటు తిరగండి; నా దగ్గరికి ఇటు తిరగండి[a]. భయపడకండి” అంది. అతడు ఆమె దగ్గరికి తిరిగి గుడారంలోకి వెళ్లాడు. అప్పుడు ఆమె అతనిని ఒక దుప్పటితో[b] కప్పింది.
