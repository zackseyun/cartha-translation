id: JDG.4.20
reference: Judges 4:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֵלֶ֔י/הָ עֲמֹ֖ד פֶּ֣תַח הָ/אֹ֑הֶל וְ/הָיָה֩ אִם אִ֨ישׁ יָב֜וֹא וּ/שְׁאֵלֵ֗/ךְ וְ/אָמַ֛ר הֲ/יֵֽשׁ פֹּ֥ה אִ֖ישׁ וְ/אָמַ֥רְתְּ אָֽיִן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/020.yaml
  text: And he said to her[a], “Stand at the entrance of the tent, and if anyone comes and asks you, saying, ‘Is there a man here?’ you shall say, ‘No.’”
translation:
  language: te
  text: అతడు ఆమెతో, “నీవు గుడారం ప్రవేశద్వారం దగ్గర నిలబడు. ఒక పురుషుడు వచ్చి నిన్ను, ‘ఇక్కడ ఏ పురుషుడైనా ఉన్నాడా?’ అని అడిగితే, ‘లేడు’ అని చెప్పు” అన్నాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ మూలంలో ‘పురుషుడు’ (אִישׁ) అనే పదం షరతు వాక్యంలోను ప్రశ్నలోను పునరావృతమవుతుంది. సందర్భానుసారం దీనిని ‘ఎవరైనా’ అని కూడా అనువదించవచ్చు, అయితే ప్రధాన పాఠం మూలంలోని పురుషలింగ పదాన్ని నిలుపుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲמֹד
  choice: నిలబడు
  rationale: עמד అనే క్రియ యొక్క ఆజ్ఞార్థక రూపం; నిర్దిష్ట స్థలంలో నిలిచి ఉండమనే ప్రత్యక్ష ఆజ్ఞను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: פֶּתַח הָאֹהֶל
  choice: గుడారం ప్రవేశద్వారం దగ్గర
  rationale: פֶּתַח అనేది తెరువు లేదా ప్రవేశస్థలాన్ని సూచిస్తుంది. గుడారం సందర్భంలో ‘ప్రవేశద్వారం దగ్గర’ సహజంగా ఉండి, స్థానం అనే భావాన్ని స్పష్టంగా ఇస్తుంది.
- source_word: וְהָיָה אִם
  choice: ఎవరైనా ... అయితే
  rationale: హీబ్రూ నిబంధనాత్మక నిర్మాణాన్ని అనవసరమైన పదశః భారంలేకుండా తెలుగులో సహజమైన షరతు వాక్యంగా వ్యక్తపరుస్తుంది.
- source_word: אִישׁ
  choice: ఎవరైనా / పురుషుడు
  rationale: మొదటి సందర్భంలో వచ్చేవాడిని అనిర్దిష్టంగా సూచిస్తున్నందున ‘ఎవరైనా’ సహజం; ప్రత్యక్ష ప్రశ్నలో అదే పదానికి ఉన్న పురుష లింగార్థాన్ని ‘పురుషుడు’గా నిలిపి, హీబ్రూలోని భావాన్ని కాపాడింది.
- source_word: יָבוֹא
  choice: వచ్చి
  rationale: בוא యొక్క సాధారణ అర్థమైన ‘రావడం’ను సందర్భానుకూలమైన తెలుగు క్రియారూపంలో అందిస్తుంది.
- source_word: וּשְׁאֵלֵךְ
  choice: నిన్ను అడిగితే
  rationale: שׁאל ఇక్కడ ప్రశ్నించడం అనే సాధారణ భావంలో ఉంది; ‘నిన్ను అడిగితే’ స్పష్టమైన, సహజమైన తెలుగు.
- source_word: הֲיֵשׁ פֹּה אִישׁ
  choice: ఇక్కడ ఎవరైనా పురుషుడు ఉన్నాడా?
  rationale: ఉనికి గురించి అడిగే ప్రశ్నను స్పష్టంగా అందిస్తూ, אִישׁ యొక్క పురుషార్థాన్ని కూడా నిలుపుతుంది.
- source_word: אָיִן
  choice: లేడు
  rationale: హీబ్రూలోని సంక్షిప్త నిరాకరణకు, ‘పురుషుడు’ అనే ప్రశ్నకు లింగ-వచన అన్వయంతో కూడిన సహజమైన సంక్షిప్త తెలుగు సమాధానం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని ప్రత్యక్ష ఆజ్ఞ, షరతు, సంక్షిప్త నిరాకరణను కాపాడుతూ, హీబ్రూ వాక్యనిర్మాణాన్ని యాంత్రికంగా అనుకరించకుండా సహజ తెలుగు పదక్రమం ఉపయోగించబడింది.
