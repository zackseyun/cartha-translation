  text: దెబోరా అనే ఒక స్త్రీ, ప్రవక్త, లప్పీదోతు భార్య; ఆమె ఆ కాలంలో ఇశ్రాయేలుకు తీర్పులు తీర్చేది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִשָּׁה נְבִיאָה
  choice: స్త్రీయైన దెబోరా ఒక ప్రవక్త
  rationale: אִשָּׁה అనే స్పష్టమైన ‘స్త్రీ’ సూచనను వదలకుండా, ఆధునిక తెలుగులో సహజంగా ప్రవక్తగా ఆమె పాత్రను తెలిపింది.
- source_word: אֵשֶׁת לַפִּידוֹת
  choice: ఆమె లప్పీదోతు భార్య
  rationale: సాధారణంగా అంగీకరించిన వ్యక్తినామ పఠనాన్ని అనుసరించి సంబంధాన్ని స్పష్టమైన తెలుగులో తెలిపింది.
- source_word: שֹׁפְטָה אֶת־יִשְׂרָאֵל
  choice: ఆమె ఇశ్రాయేలుకు న్యాయం తీరుస్తూ ఉండేది
  rationale: స్త్రీలింగ క్రియాత్మక కృదంతం సూచించే కొనసాగుతున్న న్యాయనిర్ణయ కార్యాన్ని వ్యక్తపరుస్తుంది; కేవలం పదవీబిరుదుగా మార్చలేదు.
- source_word: בָּעֵת הַהִיא
  choice: ఆ కాలంలో
  rationale: కాలసూచనను సంక్షిప్తమైన, సహజమైన ఆధునిక తెలుగులో ఇచ్చింది.
