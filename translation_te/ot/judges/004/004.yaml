  terminology: “ప్రవక్త” is appropriate for נְבִיאָה in modern standard Telugu. “లప్పీదోతు” appropriately represents the personal name Lappidoth. “తీర్పులు తీర్చేది” conveys the participial judicial function without reducing it merely to an office title.
