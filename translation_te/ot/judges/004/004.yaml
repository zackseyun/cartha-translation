  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడబడింది. మూలంలోని ‘స్త్రీ’ అనే స్పష్ట సూచనను నిలిపి, דבורה నిర్వహించిన కార్యాన్ని కొనసాగుతున్న చర్యగా అనువదించాం.
