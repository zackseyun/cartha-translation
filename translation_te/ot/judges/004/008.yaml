  yaml_path: translation/ot/judges/004/008.yaml
  text: Barak said to her[a], “If you will go with me, I will go; but if you will not go with me, I will not go.”
translation:
  language: te
  text: 'బారాకు ఆమెతో ఇలా అన్నాడు: “నువ్వు నాతో వస్తే, నేను వెళ్తాను; కానీ నువ్వు నాతో రాకపోతే, నేను వెళ్లను.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלֶיהָ בָּרָק
  choice: బారాకు ఆమెతో ... అన్నాడు
  rationale: హీబ్రూ కథనంలోని సాధారణ wayyiqtol వాక్యాన్ని సహజమైన తెలుగు ప్రత్యక్ష సంభాషణ క్రమంలో ఇచ్చాం; אֵלֶיהָ దెబోరాను సూచిస్తూ ‘ఆమెతో’ అని అనువదించబడింది.
- source_word: בָּרָק
  choice: బారాకు
  rationale: వ్యక్తి పేరును తెలుగులో సాధారణంగా వినియోగించే రూపంలో లిప్యంతరీకరించాం.
- source_word: אִם תֵּלְכִי עִמִּי
  choice: నువ్వు నాతో వస్తే
  rationale: הלך మూలార్థం ‘వెళ్లు’ అయినప్పటికీ, మాట్లాడుతున్న వ్యక్తితో కలిసి ప్రయాణించడాన్ని తెలుగులో సహజంగా ‘నాతో వస్తే’ అంటారు; స్త్రీ ఏకవచన సంబోధనను ‘నువ్వు’ స్పష్టంగా చూపుతుంది.
- source_word: וְהָלָכְתִּי
  choice: నేను వెళ్తాను
  rationale: షరతుకు ఫలితంగా ఉన్న మొదటి పురుష వాక్యాన్ని సహజమైన తెలుగు భవిష్యదర్థ రూపంలో ఇచ్చాం.
- source_word: וְאִם לֹא תֵלְכִי עִמִּי
  choice: కానీ నువ్వు నాతో రాకపోతే
  rationale: וְ రెండో, విరుద్ధమైన షరతును ప్రవేశపెడుతుంది; తెలుగులో ‘కానీ’ ఆ వ్యత్యాసాన్ని సహజంగా తెలియజేస్తుంది. పునరుక్తిని నిలుపుతూ ప్రతికూల రూపాన్ని వాడాం.
- source_word: לֹא אֵלֵךְ
  choice: నేను వెళ్లను
  rationale: ప్రతికూల షరతులో బారాకు ప్రకటించిన నిరాకరణను నేరుగా, స్పష్టంగా అనువదించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే ప్రత్యక్ష సంభాషణ. దెబోరాతో ఏకవచన సంభాషణ కావడంతో సహజమైన ‘నువ్వు’ రూపం వాడబడింది. మూలంలోని రెండు సమాంతర షరతుల నిర్మాణం నిలుపబడింది.
