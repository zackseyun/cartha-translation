source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֵלֶ֨י/הָ֙ בָּרָ֔ק אִם תֵּלְכִ֥י עִמִּ֖/י וְ/הָלָ֑כְתִּי וְ/אִם לֹ֥א תֵלְכִ֛י עִמִּ֖/י לֹ֥א אֵלֵֽךְ־־׃
