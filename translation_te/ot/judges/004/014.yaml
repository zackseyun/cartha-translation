id: JDG.4.14
reference: Judges 4:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/תֹּאמֶר֩ דְּבֹרָ֨ה אֶל בָּרָ֜ק ק֗וּם כִּ֣י זֶ֤ה הַ/יּוֹם֙ אֲשֶׁר֩ נָתַ֨ן יְהוָ֤ה אֶת סִֽיסְרָא֙ בְּ/יָדֶ֔/ךָ הֲ/לֹ֥א יְהוָ֖ה יָצָ֣א לְ/פָנֶ֑י/ךָ וַ/יֵּ֤רֶד בָּרָק֙ מֵ/הַ֣ר תָּב֔וֹר וַ/עֲשֶׂ֧רֶת אֲלָפִ֛ים אִ֖ישׁ אַחֲרָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/014.yaml
  text: Then Deborah said to Barak[a], “Arise, for this is the day on which Yahweh has given Sisera into your hand. Has not Yahweh gone out before you?” So Barak went down from Mount Tabor[b], with ten thousand men following him.
translation:
  language: te
  text: 'అప్పుడు దెబోరా బారాకుతో ఇలా అంది: “లేచి నిలబడు! ఎందుకంటే యాహ్వే సీసెరాను నీ చేతికి అప్పగించిన రోజు ఇదే.[a] యాహ్వే నీ ముందర బయలుదేరి వెళ్లలేదా?[b]” అప్పుడు బారాకు తాబోరు పర్వతం నుంచి దిగివచ్చాడు; పదివేల మంది అతని వెనుక దిగివచ్చారు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూలభాష నుడికారాన్ని మరింత అక్షరార్థంగా అనువదిస్తే, “యాహ్వే సీసెరాను నీ చేతికి ఇచ్చాడు” అని కూడా చెప్పవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా “యాహ్వే నీకు ముందుగా వెళ్లలేదా?”
    reason: lexical_alternative
lexical_decisions:
- source_word: קוּם
  choice: లేచి బయలుదేరు
  rationale: బారాకును వెంటనే కార్యాచరణకు పిలిచే ఆజ్ఞ. తెలుగులో సహజంగా ఉండేలా, సందర్భంలోని సైనిక కదలికను స్పష్టపరుస్తూ మూలంలోని బలాన్ని నిలుపుతుంది.
- source_word: כִּי זֶה הַיּוֹם אֲשֶׁר
  choice: ఎందుకంటే ... రోజు ఇదే
  rationale: ‘ఈ రోజే’ అనే సూచనాత్మక ఉద్ఘాటనను, ఆ ఆజ్ఞకు కారణాన్ని తెలిపే כִּי భావాన్ని నిలుపుతుంది.
- source_word: נָתַן ... בְּיָדֶךָ
  choice: నీ చేతికి అప్పగించిన
  rationale: ఎవరినైనా మరొకరి అధికారంలోకి ఇవ్వడం అనే హీబ్రూ నుడికార భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది. పూర్తయిన క్రియారూపం విజయంపై ప్రవచనాత్మక నిశ్చయాన్ని నిలుపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: మూలంలో ఉన్న దేవుని వ్యక్తిగత నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా లిప్యంతరీకరిస్తుంది.
- source_word: הֲלֹא
  choice: వెళ్లలేదా?
  rationale: అంగీకార సమాధానాన్ని ఆశించే మూలంలోని అలంకారిక ప్రశ్న రూపాన్ని నిలుపుతుంది.
- source_word: יָצָא לְפָנֶיךָ
  choice: నీ ముందర బయలుదేరి వెళ్లాడు
  rationale: సైనిక సందర్భం ఉన్నప్పటికీ మూలంలోని ‘బయలుదేరు/వెళ్లు’ మరియు ‘నీ ముందర’ అనే దృశ్యభాషను అతిగా వివరణ చేయకుండా నిలుపుతుంది.
- source_word: וַיֵּרֶד מֵהַר תָּבוֹר
  choice: తాబోరు కొండ మీదనుంచి దిగాడు
  rationale: కొండపై నుంచి కిందికి జరిగిన కదలికను సహజమైన తెలుగు కథనశైలిలో తెలియజేస్తుంది.
- source_word: וַעֲשֶׂרֶת אֲלָפִים אִישׁ אַחֲרָיו
  choice: అతని వెనుక పదివేల మంది వచ్చారు
  rationale: బారాకును అనుసరించిన పదివేల మంది యోధుల కదలికను సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: ఈ వచనం బిరుదును కాకుండా చతురక్షర దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది; అందువల్ల వ్యక్తిగత నామాన్ని లిప్యంతరీకరించడం మూలానికి దగ్గరగా ఉంటుంది.
- issue: נָתַן అనే పూర్తయిన క్రియ మరియు ఇంకా జరగబోయే విజయం
  choice: అప్పగించిన
  alternative: అప్పగిస్తాడు
  rationale: యుద్ధఫలితం ఇంకా కథనంలో నెరవేరకపోయినా, మూలం దానిని ఇప్పటికే నిశ్చయమైన కార్యంగా ప్రకటిస్తుంది. ఆ ప్రవచనాత్మక నిశ్చయాన్ని గత/పూర్తయిన రూపంతో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే, గౌరవప్రదమైన కథనశైలి. ప్రత్యక్ష ప్రసంగంలోని అత్యవసరతను ఆశ్చర్యార్థక చిహ్నంతో చూపించాం. మూలంలోని అలంకారిక ప్రశ్నను ప్రశ్నగానే ఉంచాం; దైవ కార్యం మరియు బారాకు చర్య మధ్య ఉన్న ఉద్వేగాన్ని వివరణతో సర్దుబాటు చేయలేదు.
