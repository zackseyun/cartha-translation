source:
  edition: WLC
  text: וַ/יֹּסִ֨פוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל לַ/עֲשׂ֥וֹת הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה וְ/אֵה֖וּד מֵֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/001.yaml
  text: And the sons of Israel again did what was evil in the eyes of Yahweh after Ehud died[a].
translation:
  language: te
  text: ఏహూదు చనిపోయిన తరువాత ఇశ్రాయేలు ప్రజలు[a] యాహ్వే దృష్టిలో మళ్లీ చెడు చేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: పదశః, “ఇశ్రాయేలు కుమారులు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּסִפוּ
  choice: మళ్లీ చేశారు
  rationale: יסף అనే క్రియకు క్రియార్థక నామరూపం జతైనప్పుడు చర్య పునరావృతమైందనే భావం వస్తుంది. న్యాయాధిపతులు గ్రంథంలోని పునరావృత పతన ధోరణిని సహజమైన తెలుగులో తెలియజేయడానికి ‘మళ్లీ చేశారు’ అని అనువదించాం.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు ప్రజలు
  rationale: పదశః ‘ఇశ్రాయేలు కుమారులు’; అయితే ఇక్కడ అది మొత్తం ఇశ్రాయేలు సమాజాన్ని సూచించే స్థిరమైన సామూహిక పదబంధం. ఆధునిక తెలుగులో సహజంగా, ఉద్దేశించిన సమూహార్థం స్పష్టంగా ఉండేందుకు ‘ఇశ్రాయేలు ప్రజలు’ అని ఇచ్చి, పదశః రూపాన్ని పాదసూచికలో ఉంచాం.
- source_word: לַעֲשׂוֹת
  choice: చేశారు
  rationale: יסףతో కలిసిన క్రియార్థక నామరూపాన్ని తెలుగులో విడిగా ‘చేయడానికి’ అని కాకుండా ‘మళ్లీ చేశారు’ అనే సమగ్ర క్రియాపదబంధంగా సహజంగా వ్యక్తపరిచాం.
- source_word: הָרַע
  choice: చెడ్డదైనదాన్ని
  rationale: నిర్దిష్ట ఉపపదంతో నామవాచకంగా వాడిన విశేషణం ‘చెడ్డది/చెడ్డదైనది’ అనే భావాన్ని ఇస్తుంది. మూలంలోని నైతిక మూల్యాంకనాన్ని నిలుపుతూ ‘చెడ్డదైనదాన్ని’ అని అనువదించాం.
- source_word: בְּעֵינֵי יְהוָה
  choice: యెహోవా దృష్టిలో
  rationale: పదశః ‘యెహోవా కళ్లలో.’ తెలుగులో ‘దృష్టిలో’ అనే పదబంధం మూల రూపక భావాన్ని మరియు దేవుని మూల్యాంకనాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో స్థిరంగా ప్రాచుర్యంలో ఉన్న ‘యెహోవా’ రూపంలో ఇచ్చాం.
- source_word: וְאֵהוּד מֵת
  choice: ఏహూదు చనిపోయిన తరువాత
  rationale: రూపపరంగా ‘మరియు ఏహూదు చనిపోయాడు’ అయినప్పటికీ, సందర్భంలో ఈ ఉపవాక్యం ఇశ్రాయేలు మళ్లీ చెడు చేయడానికి కాలపరమైన నేపథ్యాన్ని తెలుపుతుంది. అందువల్ల సంబంధాన్ని సహజమైన తెలుగులో ‘చనిపోయిన తరువాత’ అని వ్యక్తపరిచాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమే ఉంది; దానిని బిరుదైన ‘ప్రభువు’తో భర్తీ చేయకుండా పేరుగా నిలిపాం.
- issue: בְּנֵי יִשְׂרָאֵל అనే సామూహిక designation
  choice: ఇశ్రాయేలు ప్రజలు
  alternative: ఇశ్రాయేలు కుమారులు
  rationale: హీబ్రూ రూపం వ్యాకరణపరంగా పుంలింగ బహువచనమైనప్పటికీ, ఇక్కడ మొత్తం ఇశ్రాయేలు సమాజాన్ని సూచిస్తుంది. తెలుగులో ‘ఇశ్రాయేలు కుమారులు’ అనడం జీవశాస్త్రీయ పురుషులను మాత్రమే సూచిస్తున్నట్లు అపార్థం కలిగించవచ్చు; అందుకే ప్రధాన పాఠంలో సమూహార్థాన్ని ఇచ్చి, పదశః రూపాన్ని పాదసూచికలో భద్రపరిచాం.
- issue: וְאֵהוּד מֵת ఉపవాక్యపు సంబంధం
  choice: ఏహూదు చనిపోయిన తరువాత
  alternative: మరియు ఏహూదు చనిపోయాడు
  rationale: హీబ్రూ వావ్‌తో కూడిన నామవాచక ఉపవాక్యం సందర్భానుసారంగా కాలపరమైన నేపథ్యాన్ని సూచించగలదు. ఇక్కడ న్యాయాధిపతి మరణానంతరం ప్రజలు తిరిగి చెడు చేసిన క్రమం ఉద్దేశించబడింది; అందువల్ల కాలార్థాన్ని స్పష్టంగా తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన కథనశైలిని ఉపయోగించాం. ‘దృష్టిలో’ ద్వారా హీబ్రూ నుడికారాన్ని సహజంగా నిలిపాం; ‘ఇశ్రాయేలు ప్రజలు’ ద్వారా సామూహిక ఉద్దేశాన్ని స్పష్టం చేశాం.
