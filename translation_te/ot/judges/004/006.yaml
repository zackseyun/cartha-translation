  text: וַ/תִּשְׁלַ֗ח וַ/תִּקְרָא֙ לְ/בָרָ֣ק בֶּן אֲבִינֹ֔עַם מִ/קֶּ֖דֶשׁ נַפְתָּלִ֑י וַ/תֹּ֨אמֶר אֵלָ֜י/ו הֲ/לֹ֥א צִוָּ֣ה יְהוָ֣ה אֱלֹהֵֽי יִשְׂרָאֵ֗ל לֵ֤ךְ וּ/מָֽשַׁכְתָּ֙ בְּ/הַ֣ר תָּב֔וֹר וְ/לָקַחְתָּ֣ עִמְּ/ךָ֗ עֲשֶׂ֤רֶת אֲלָפִים֙ אִ֔ישׁ מִ/בְּנֵ֥י נַפְתָּלִ֖י וּ/מִ/בְּנֵ֥י זְבֻלֽוּן־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/006.yaml
  text: 'She sent and summoned Barak son of Abinoam from Kedesh-naphtali, and said to him, “Has not the LORD, the God of Israel, commanded: ‘Go, draw up to Mount Tabor, and take with you ten thousand men from the sons of Naphtali and from the sons of Zebulun’?”'
translation:
  language: te
  text: 'ఆమె నఫ్తాలిలోని కెదెషు నుండి అబీనోయము కుమారుడైన బారాకుకు కబురు పంపి పిలిపించింది. ఆమె అతనితో ఇలా చెప్పింది: “ఇశ్రాయేలు దేవుడైన యెహోవా ఇలా ఆజ్ఞాపించలేదా? ‘వెళ్లి తాబోరు పర్వతం మీద దళాలను సమీకరించు; నఫ్తాలి వంశస్థులలోనుండి, జెబూలూను వంశస్థులలోనుండి పదివేల మందిని నీతో తీసుకెళ్లు.’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּשְׁלַח וַתִּקְרָא
  choice: పిలిపించి
  rationale: రెండు క్రియల సమిష్టి భావం—ఆమె కబురు పంపి తన దగ్గరకు రప్పించడం—సహజమైన ఆధునిక తెలుగులో ‘పిలిపించి’తో వ్యక్తమవుతుంది.
- source_word: מִקֶּדֶשׁ נַפְתָּלִי
  choice: నఫ్తాలి ప్రాంతంలోని కెదెషు నుండి
  rationale: ఇది నఫ్తాలి గోత్రప్రాంతంలో ఉన్న కెదెషును సూచిస్తుంది; మరో కెదెషుతో గందరగోళం రాకుండా సంబంధాన్ని స్పష్టం చేస్తుంది.
- source_word: הֲלֹא צִוָּה
  choice: ఆజ్ఞాపించలేదా?
  rationale: హీబ్రూ ప్రశ్నకు ఆశించబడే సానుకూల సమాధానాన్ని, దాని వాక్చాతుర్య బలాన్ని నిలుపుతుంది.
- source_word: מָשַׁכְתָּ בְּהַר תָּבוֹר
  choice: తాబోరు కొండ దగ్గరికి సైన్యాన్ని సమీకరించు
  rationale: מָשַׁךְ యొక్క మూలభావం ‘లాగు/తీసుకురా’; ఈ సైనిక సందర్భంలో దళాలను నిర్దిష్ట ప్రదేశానికి సమీకరించడాన్ని సూచిస్తుంది. క్రియలో అంతర్లీనంగా ఉన్న సైనిక భావాన్ని తెలుగులో స్పష్టం చేసింది.
- source_word: עֲשֶׂרֶת אֲלָפִים אִישׁ
  choice: పదివేలమంది పురుషులను
  rationale: సంఖ్యను మరియు సైనిక సమీకరణలో పాల్గొనే పురుషులను నేరుగా ప్రతిబింబిస్తుంది.
- source_word: מִבְּנֵי נַפְתָּלִי וּמִבְּנֵי זְבֻלוּן
  choice: నఫ్తాలి వంశస్థులలోనుండి, జెబూలూను వంశస్థులలోనుండి
  rationale: בְּנֵי అనే గోత్రసంబంధ పదాన్ని సహజ తెలుగులో ‘వంశస్థులు’గా అందించింది.
theological_decisions:
- issue: దైవనామం יהוה
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలంలోని వ్యక్తిగత దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన రూపంలో నిలిపింది.
- issue: దెబోరా ప్రశ్నలో ఆజ్ఞ యొక్క మూలం
  choice: ‘ఇశ్రాయేలు దేవుడైన యెహోవా నీకు ఇలా ఆజ్ఞాపించలేదా?’
  alternative: ‘ఇశ్రాయేలు దేవుడైన యెహోవా ఇలా ఆజ్ఞాపించాడు’
  rationale: మూలంలోని ప్రశ్నారూపాన్ని నిలుపుతూ, బారాకు ఇప్పటికే తెలిసిన దైవాజ్ఞను దెబోరా గుర్తుచేస్తున్న భావాన్ని కాపాడింది.
translation_notes:
  register: ఆధునిక ప్రమాణ తెలుగు; గౌరవప్రదమైన కథన శైలి. స్థలనామాలు, వ్యక్తినామాలు సాధారణ తెలుగు బైబిలు రూపాలకు సమీపంగా ఉంచబడ్డాయి. అవసరం లేని పాదటిప్పణులు చేర్చలేదు.
