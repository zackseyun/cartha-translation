source:
  edition: WLC
  text: וְ/הִנֵּ֣ה בָרָק֮ רֹדֵ֣ף אֶת סִֽיסְרָא֒ וַ/תֵּצֵ֤א יָעֵל֙ לִ/קְרָאת֔/וֹ וַ/תֹּ֣אמֶר ל֔/וֹ לֵ֣ךְ וְ/אַרְאֶ֔/ךָּ אֶת הָ/אִ֖ישׁ אֲשֶׁר אַתָּ֣ה מְבַקֵּ֑שׁ וַ/יָּבֹ֣א אֵלֶ֔י/הָ וְ/הִנֵּ֤ה סִֽיסְרָא֙ נֹפֵ֣ל מֵ֔ת וְ/הַ/יָּתֵ֖ד בְּ/רַקָּתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/022.yaml
  text: And look, Barak was pursuing Sisera. Jael went out to meet him and said to him, “Come, and I will show you the man whom you are seeking.” So he went in to her, and look, Sisera was lying there dead, with the tent peg in his temple.
translation:
  language: te
  text: ఇదిగో, బారాకు సీసెరాను వెంబడిస్తున్నాడు. యాయేలు అతనిని ఎదుర్కోవడానికి బయటికి వెళ్లి, “రండి, మీరు వెదుకుతున్న మనిషిని మీకు చూపిస్తాను” అని అతనితో చెప్పింది. అతడు ఆమెతో లోపలికి వెళ్లాడు. ఇదిగో, సీసెరా చనిపోయి పడి ఉన్నాడు; గుడారపు మేకు అతని కణతలో ఉంది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: కథనంలో అకస్మాత్తుగా దృష్టిని ఆకర్షించే హీబ్రూ సూచకాన్ని రెండు సందర్భాల్లోనూ సహజమైన తెలుగు కథనశైలిలో నిలుపుతుంది.
- source_word: רֹדֵף
  choice: వెంబడిస్తూ వచ్చాడు
  rationale: వర్తమాన కృదంతం సూచించే కొనసాగుతున్న వెంబడింపును, సందర్భానికి తగిన గతకాల తెలుగు నిర్మాణంలో వ్యక్తపరుస్తుంది.
- source_word: לֵךְ
  choice: రండి
  rationale: పదశః ‘వెళ్లు/రా’ అనే ఆజ్ఞ ఇక్కడ యాయేలు తనతో లోపలికి రావాలని ఆహ్వానించడాన్ని సూచిస్తుంది; గౌరవసూచక బహువచనం సహజ తెలుగు సంభాషణకు సరిపోతుంది.
- source_word: נֹפֵל מֵת
  choice: చనిపోయి పడి ఉన్నాడు
  rationale: పదశః ‘పడిపోయి, చనిపోయినవాడిగా’ ఉన్న స్థితిని సహజంగా తెలుపుతూ, శవం అక్కడ పడి ఉండటాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: הַיָּתֵד
  choice: గుడారపు మేకు
  rationale: మునుపటి సందర్భంలో ఉపయోగించిన వస్తువు గుడారపు మేకు అని స్పష్టపరుస్తుంది.
- source_word: בְּרַקָּתוֹ
  choice: అతని కణతలో
  rationale: רַקָּה శిరస్సు పక్కభాగమైన కణతను సూచిస్తుంది; בְּ దాని లోపల మేకు ఉన్నదని తెలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన, గౌరవప్రదమైన కథనశైలి. మూలంలోని రెండు וְהִנֵּה ప్రయోగాలనూ ‘ఇదిగో’గా నిలుపుతూ దృశ్యమార్పు మరియు ఆశ్చర్యభావాన్ని సంరక్షించాం.
