  text: וַ/תֹּ֜אמֶר הָלֹ֧ךְ אֵלֵ֣ךְ עִמָּ֗/ךְ אֶ֚פֶס כִּי֩ לֹ֨א תִֽהְיֶ֜ה תִּֽפְאַרְתְּ/ךָ֗ עַל הַ/דֶּ֨רֶךְ֙ אֲשֶׁ֣ר אַתָּ֣ה הוֹלֵ֔ךְ כִּ֣י בְֽ/יַד אִשָּׁ֔ה יִמְכֹּ֥ר יְהוָ֖ה אֶת סִֽיסְרָ֑א וַ/תָּ֧קָם דְּבוֹרָ֛ה וַ/תֵּ֥לֶך עִם בָּרָ֖ק קֶֽדְשָׁ/ה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/009.yaml
  text: And she said[a], “I will surely go with you. Nevertheless, the honor will not be yours on the way that you are going, for Yahweh will sell Sisera into the hand of a woman.” Then Deborah arose and went with Barak to Kedesh.
translation:
  language: te
  text: 'ఆమె ఇలా చెప్పింది: “నేను తప్పకుండా నీతో వస్తాను. అయితే నీవు వెళ్తున్న మార్గంలో ఘనత నీకు దక్కదు; ఎందుకంటే యాహ్వే సీసెరాను ఒక స్త్రీ చేతికి అమ్ముతాడు[a].” తరువాత దెబోరా లేచి బారాకుతో కలిసి కెదెషుకు వెళ్లింది.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, భావానువాదంగా, “యాహ్వే సీసెరాను ఒక స్త్రీకి అప్పగిస్తాడు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הָלֹךְ אֵלֵךְ
  choice: నేను తప్పకుండా ... వస్తాను
  rationale: క్రియార్థక నామరూపం మరియు అసంపూర్ణ క్రియ కలయికలోని నిశ్చయార్థక బలాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది. బారాకు దృష్టికోణంలో సహవాసాన్ని సూచించేందుకు ‘వస్తాను’ సహజంగా ఉంది.
- source_word: אֶפֶס
  choice: అయితే
  rationale: దెబోరా అంగీకారానికి పరిమితిని జోడించే వ్యతిరేక భావాన్ని సరళంగా తెలియజేస్తుంది.
- source_word: תִּפְאַרְתְּךָ
  choice: ఘనత నీకు దక్కదు
  rationale: యుద్ధ విజయంతో వచ్చే గౌరవం లేదా కీర్తి అనే సందర్భార్థాన్ని తెలియజేస్తూ, మూలంలోని స్వామ్యభావాన్ని సహజ తెలుగులో నిలుపుతుంది.
- source_word: עַל הַדֶּרֶךְ אֲשֶׁר אַתָּה הוֹלֵךְ
  choice: నీవు వెళ్తున్న ఈ మార్గంలో
  rationale: మూలంలోని ‘మార్గం’ రూపకాన్ని అతిగా వ్యాఖ్యానించకుండా నిలుపుతుంది; తెలుగు సందర్భంలో నిర్దిష్టత కోసం ‘ఈ’ వాడబడింది.
- source_word: בְיַד אִשָּׁה
  choice: ఒక స్త్రీ చేతికి
  rationale: ఎవరినైనా మరొకరి అధికారానికి అప్పగించడం అనే హెబ్రీయ రూపకంలోని ‘చేయి’ చిత్రాన్ని తెలుగులో కాపాడుతుంది.
- source_word: יִמְכֹּר
  choice: అమ్మివేస్తాడు
  rationale: మూల క్రియ యొక్క ప్రత్యక్షమైన ‘అమ్ము’ అర్థాన్ని నిలుపుతుంది; సందర్భోచితమైన ‘అప్పగిస్తాడు’ అనే భావాన్ని పాదసూచికలో ఇస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: చతురక్షర దైవనామాన్ని తెలుగు బైబిలు వాడుకలో సుపరిచితమైన వ్యక్తినామ రూపంలో అందిస్తుంది; బిరుదుతో భర్తీ చేయదు.
- source_word: וַתָּקָם
  choice: లేచి
  rationale: కథన క్రమాన్ని సహజమైన తెలుగు సంయుక్త క్రియ నిర్మాణంలో తెలియజేస్తుంది.
- source_word: קֶדְשָׁה
  choice: కెదెషుకు
  rationale: స్థలనామాన్ని లిప్యంతరీకరించి, దిశను సూచించే తెలుగు విభక్తిని జోడిస్తుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో వ్యక్తిగత దైవనామమే ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుగా మార్చకుండా, ఆధునిక తెలుగు క్రైస్తవ పాఠకులకు విస్తృతంగా పరిచయమైన ‘యెహోవా’ రూపంలో ఉంచబడింది.
- issue: సీసెరాను స్త్రీ చేతికి ‘అమ్మడం’
  choice: ప్రధాన పాఠ్యంలో ‘అమ్మివేస్తాడు’
  alternative: ‘అప్పగిస్తాడు’
  rationale: మూలంలోని מכר క్రియకు ప్రత్యక్ష సమానార్థాన్ని నిలుపుతూ, అది యుద్ధంలో శత్రువును మరొకరి అధికారానికి అప్పగించడాన్ని సూచిస్తుందనే సందర్భార్థాన్ని పాదసూచికలో స్పష్టం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. మూలంలోని మార్గం, చేయి, అమ్మడం అనే చిత్రాలను సాధ్యమైనంతవరకు నిలుపుతూ, అర్థస్పష్టత కోసం ఒక పాదసూచిక ఇవ్వబడింది.
