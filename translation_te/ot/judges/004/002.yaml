  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּמְכְּרֵ֣/ם יְהוָ֗ה בְּ/יַד֙ יָבִ֣ין מֶֽלֶךְ כְּנַ֔עַן אֲשֶׁ֥ר מָלַ֖ךְ בְּ/חָצ֑וֹר וְ/שַׂר צְבָא/וֹ֙ סִֽיסְרָ֔א וְ/ה֥וּא יוֹשֵׁ֖ב בַּ/חֲרֹ֥שֶׁת הַגּוֹיִֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/002.yaml
  text: So Yahweh sold them into the hand of Jabin king of Canaan[a], who reigned in Hazor; and the commander of his army was Sisera[b], who lived in Harosheth-haggoyim.
translation:
  language: te
  text: కాబట్టి యాహ్వే వారిని హాసోరులో రాజ్యమేలిన కనాను రాజు యాబీను చేతికి అమ్మివేశాడు.[a] అతని సైన్యాధిపతి సీసెరా; అతడు హరోషెత్-హగ్గోయిములో నివసించేవాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “చేతికి అమ్మివేశాడు” అనేది హీబ్రూ నుడికారం; యాహ్వే వారిని యాబీను అధికారానికి అప్పగించాడని దాని భావం.
    reason: lexical_alternative
  - marker: b
    text: “హరోషెత్-హగ్గోయిము” అనే పేరుకు బహుశా “జనముల హరోషెత్” అని అర్థం.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּמְכְּרֵם
  choice: వారిని ... చేతికి అమ్మివేశాడు
  rationale: מָכַר అనే క్రియకు అక్షరార్థం ‘అమ్ము.’ న్యాయాధిపతులు గ్రంథంలో ఇది ఇశ్రాయేలును శత్రువుల అధికారానికి అప్పగించే నిబంధనాత్మక తీర్పును సూచించే పునరావృత రూపకం; అందువల్ల రూపకంలోని తీవ్రతను నిలిపాం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన నాలుగు హల్లుల పేరును బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో ఇచ్చాం.
- source_word: בְּיַד
  choice: చేతికి
  rationale: ‘చేతిలో/చేతికి’ అనే హీబ్రూ నుడికారం ఒకరి అధికారానికి అప్పగించడాన్ని సూచిస్తుంది. తెలుగులో ‘చేతికి అమ్మివేశాడు’ మూలంలోని చేతి రూపకాన్ని సహజంగా నిలుపుతుంది.
- source_word: יָבִין מֶלֶךְ כְּנַעַן
  choice: కనాను రాజైన యాబీను
  rationale: పేరు, రాజబిరుదు మధ్య సంబంధాన్ని సహజమైన తెలుగు పదక్రమంలో స్పష్టంగా తెలిపింది.
- source_word: אֲשֶׁר מָלַךְ בְּחָצוֹר
  choice: హాసోరులో పరిపాలించిన
  rationale: מָלַךְ అంటే రాజుగా ఉండడం లేదా పరిపాలించడం. సందర్భంలో సహజంగా ఉండేందుకు ‘పరిపాలించిన’ అని అనువదించాం.
- source_word: וְשַׂר צְבָאוֹ
  choice: అతని సైన్యాధిపతి
  rationale: שַׂר צָבָא సైన్యానికి నాయకత్వం వహించే అధికారిని సూచిస్తుంది; ‘సైన్యాధిపతి’ ఆధునిక, గౌరవప్రదమైన స్పష్టమైన పదం.
- source_word: סִיסְרָא
  choice: సీసెరా
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగు లిప్యంతరీకరణ.
- source_word: וְהוּא יוֹשֵׁב
  choice: అతడు ... నివసించేవాడు
  rationale: పుంలింగ ఏకవచన సర్వనామం సహజంగా సమీపంలోని సీసెరాను సూచిస్తుంది; భాగధాతు నిర్మాణాన్ని కొనసాగుతున్న నివాసస్థితిగా తెలిపాం.
- source_word: בַּחֲרֹשֶׁת הַגּוֹיִם
  choice: హరోషెత్-హగ్గోయిములో
  rationale: ఇది స్థలనామం కావడంతో ప్రధాన పాఠ్యంలో భావానువాదం చేయకుండా లిప్యంతరీకరించాం; పేరులోని రెండవ భాగం అర్థాన్ని పాదసూచికలో తెలిపాం.
theological_decisions:
- issue: ఇశ్రాయేలు అణచివేతలో దేవుని క్రియాశీల పాత్ర
  choice: యెహోవా వారిని యాబీను చేతికి అమ్మివేశాడని నేరుగా చెప్పడం
  alternative: యెహోవా వారు యాబీను అధికారంలో పడటానికి అనుమతించాడు
  rationale: హీబ్రూ క్రియ యెహోవాకే ప్రత్యక్ష కర్తృత్వాన్ని ఆపాదిస్తుంది. దాన్ని కేవలం అనుమతిగా మృదువుపరచకుండా నిబంధనాత్మక తీర్పులోని ఉద్రిక్తతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కథనానికి తగిన గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. మూలంలోని ‘అమ్మివేశాడు’ మరియు ‘చేతికి’ రూపకాలను నిలిపి, అసహజమైన పదక్రమాన్ని మాత్రం సహజ తెలుగు వాక్యనిర్మాణంగా మార్చాం. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
