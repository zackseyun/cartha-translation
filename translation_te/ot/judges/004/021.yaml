source:
  edition: WLC
  text: וַ/תִּקַּ֣ח יָעֵ֣ל אֵֽשֶׁת חֶ֠בֶר אֶת יְתַ֨ד הָ/אֹ֜הֶל וַ/תָּ֧שֶׂם אֶת הַ/מַּקֶּ֣בֶת בְּ/יָדָ֗/הּ וַ/תָּב֤וֹא אֵלָי/ו֙ בַּ/לָּ֔אט וַ/תִּתְקַ֤ע אֶת הַ/יָּתֵד֙ בְּ/רַקָּת֔/וֹ וַ/תִּצְנַ֖ח בָּ/אָ֑רֶץ וְ/הֽוּא נִרְדָּ֥ם וַ/יָּ֖עַף וַ/יָּמֹֽת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/021.yaml
  text: Then Jael[a], the wife of Heber, took a tent peg and put a hammer in her hand, and she went to him quietly and drove the peg into his temple, and it went down into the ground. Now he was fast asleep and exhausted[b], and he died.
translation:
  language: te
  text: అప్పుడు హెబెరు భార్య యాయేలు గుడారపు మేకును తీసుకొని, సుత్తిని చేతిలో పట్టుకుని, అతని దగ్గరికి నిశ్శబ్దంగా[a] వెళ్లింది. ఆ మేకును అతని కణతలోకి దిగగొట్టింది; అది నేలలోకి దిగిపోయింది[b]. అతడు గాఢనిద్రలో ఉండి అలసిపోయి ఉన్నాడు; అతడు చనిపోయాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “చప్పుడు కాకుండా.” హీబ్రూ పదం ఆమె నిశ్శబ్దంగా, ఎవరి దృష్టినీ ఆకర్షించకుండా దగ్గరకు వెళ్లడాన్ని నొక్కి చెబుతుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “అది నేలలోకి దిగిపోయింది.” స్త్రీలింగ క్రియ సహజంగా స్త్రీలింగమైన ‘మేకు’ను సూచిస్తుంది.
    reason: grammatical_clarification
lexical_decisions:
- source_word: יְתַד / הַיָּתֵד
  choice: గుడారపు మేకు / ఆ మేకు
  rationale: గుడారాన్ని బిగించడానికి ఉపయోగించే మేకును సూచిస్తుంది. ఆధునిక తెలుగులో ‘గుడారపు మేకు’ స్పష్టంగా, సహజంగా ఉంది.
- source_word: הַמַּקֶּבֶת
  choice: సుత్తి
  rationale: మేకును కొట్టడానికి ఉపయోగించే పనిముట్టును సూచించే సహజమైన సాధారణ తెలుగు పదం.
- source_word: בְּיָדָהּ
  choice: చేతిలో పట్టుకుని
  rationale: సుత్తి ఆమె చేతిలో ఉందనే భావాన్ని తెలుగులో సహజమైన క్రియారూపంతో వ్యక్తపరుస్తుంది.
- source_word: בַּלָּאט
  choice: నిశ్శబ్దంగా
  rationale: ఆమె చప్పుడు చేయకుండా, ఎవరి దృష్టినీ ఆకర్షించకుండా దగ్గరకు వెళ్లిన తీరును తెలియజేస్తుంది; ఉద్దేశాన్ని అనవసరంగా నిర్ధారించదు.
- source_word: וַתִּתְקַע
  choice: దిగగొట్టింది
  rationale: మేకు, సుత్తి సందర్భంలో బలంగా కొట్టి లోపలికి దింపిన చర్యను స్పష్టంగా తెలియజేస్తుంది.
- source_word: בְּרַקָּתוֹ
  choice: అతని కణతలోకి
  rationale: רַקָּה తల పక్కభాగమైన కణతను సూచిస్తుంది. ‘లోకి’ అనే రూపం మేకు ప్రవేశించిందని చెబుతుంది గాని అది పూర్తిగా దాటి వెళ్లిందని అదనంగా నిర్ధారించదు.
- source_word: וַתִּצְנַח בָּאָרֶץ
  choice: అది నేలలోకి దిగిపోయింది
  rationale: స్త్రీలింగ క్రియకు సహజమైన పూర్వపదం స్త్రీలింగమైన ‘మేకు’; హీబ్రూ కథనంలోని వరుస చర్యను ఉద్దేశం లేదా కాలపరిమితిగా మార్చకుండా నిలుపుతుంది.
- source_word: נִרְדָּם
  choice: గాఢనిద్రలో ఉండి
  rationale: అతడు అప్పటికే బాగా నిద్రపోతున్న స్థితిని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: וַיָּעַף
  choice: అలసిపోయి ఉన్నాడు
  rationale: సీసెరా తీవ్రమైన అలసటలో ఉన్నాడనే సందర్భానుకూల భావాన్ని తెలియజేస్తుంది.
- source_word: וַיָּמֹת
  choice: అతడు చనిపోయాడు
  rationale: హీబ్రూ కథనంలోని సూటియైన, ఆకస్మిక ముగింపును అలంకరణ లేకుండా నిలుపుతుంది.
- source_word: אֵשֶׁת חֶבֶר
  choice: హెబెరు భార్య
  rationale: హీబ్రూ సంబంధాన్ని సంక్షిప్తంగా, సహజమైన తెలుగు పదక్రమంలో వ్యక్తపరుస్తుంది.
