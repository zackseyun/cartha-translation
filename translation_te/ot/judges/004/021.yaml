translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సూటియైన, గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. హింసాత్మక చర్యను మూలపాఠం చెప్పినంత స్పష్టంగా ఉంచి, అదనపు శారీరక వివరాలు చేర్చలేదు. అన్ని పాదసూచిక గుర్తులు సంబంధిత పదబంధాల వెంట ఉంచబడ్డాయి.
