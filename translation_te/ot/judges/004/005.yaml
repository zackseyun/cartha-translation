source:
  edition: WLC
  text: וְ֠/הִיא יוֹשֶׁ֨בֶת תַּֽחַת תֹּ֜מֶר דְּבוֹרָ֗ה בֵּ֧ין הָ/רָמָ֛ה וּ/בֵ֥ין בֵּֽית אֵ֖ל בְּ/הַ֣ר אֶפְרָ֑יִם וַ/יַּעֲל֥וּ אֵלֶ֛י/הָ בְּנֵ֥י יִשְׂרָאֵ֖ל לַ/מִּשְׁפָּֽט־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/005.yaml
  text: She used to sit under the palm of Deborah[a], between Ramah and Bethel in the hill country of Ephraim[b], and the sons of Israel went up to her for judgment.
translation:
  language: te
  text: ఆమె ఎఫ్రాయిము కొండప్రాంతంలో, రామా, బేతేలు మధ్య ఉన్న దెబోరా ఖర్జూరచెట్టు కింద కూర్చుండేది. తీర్పు[b] కోసం ఇశ్రాయేలు కుమారులు[a] ఆమె దగ్గరికి ఎక్కివచ్చేవారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఇశ్రాయేలు ప్రజలు.” హీబ్రూలో అక్షరార్థంగా “ఇశ్రాయేలు కుమారులు” అని ఉంది; ఇది ఇశ్రాయేలు ప్రజలను సమష్టిగా సూచించే సాంప్రదాయిక ఒడంబడిక ప్రయోగం.
    reason: lexical_alternative
  - marker: b
    text: లేదా “న్యాయం కోసం,” “న్యాయపరమైన నిర్ణయం కోసం.” హీబ్రూ పదం న్యాయనిర్ణయం చేయడాన్ని లేదా న్యాయం నిర్వహించడాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹשֶׁבֶת
  choice: కూర్చుండేది
  rationale: ఈ సందర్భంలో హీబ్రూ కృదంతం దెబోరా న్యాయం తీర్చే అలవాటైన స్థలాన్ని సూచిస్తుంది; తెలుగు అసమాపక భూతకాల రూపం ఆ నిరంతర ఆచారాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: תֹּמֶר דְּבוֹרָה
  choice: దెబోరా ఖర్జూరచెట్టు
  rationale: నిర్మాణ సంబంధాన్ని సహజమైన తెలుగులో నిలుపుతూ, ఇది దెబోరాతో గుర్తింపుపొందిన ఖర్జూరచెట్టని తెలియజేస్తుంది; మూలంలో ఇది తప్పనిసరిగా అధికారిక స్థలనామం కాదు.
- source_word: בְּהַר אֶפְרָיִם
  choice: ఎఫ్రాయిము కొండప్రాంతంలో
  rationale: ఇక్కడ ఏకవచన ‘కొండ’ ఒక ప్రత్యేక శిఖరాన్ని కాక కొండల ప్రాంతాన్ని సూచిస్తుంది.
- source_word: וַיַּעֲלוּ אֵלֶיהָ
  choice: ఆమె దగ్గరికి ఎక్కివచ్చేవారు
  rationale: עלה లోని పైకి వెళ్లే భౌగోళిక భావాన్ని నిలుపుతూ, దెబోరా ఉన్న కొండప్రాంతానికి ప్రజలు రావడాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: మూలంలోని పుంలింగ బహువచన సమూహపదాన్ని రూపపరంగా నిలుపుతుంది; సందర్భంలో ఇది ఇశ్రాయేలు ప్రజలను సమష్టిగా సూచిస్తుందని పాదసూచిక వివరిస్తుంది.
- source_word: לַמִּשְׁפָּט
  choice: తీర్పు కోసం
  rationale: న్యాయపరమైన నిర్ణయం లేదా న్యాయనిర్వహణ అనే సందర్భోచిత భావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל అనే లింగసూచక సమూహప్రయోగం
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలు ప్రజలు
  rationale: మూలంలోని సాంప్రదాయిక ఒడంబడిక సమూహప్రయోగాన్ని తటస్థీకరించకుండా నిలిపాం; అయితే అది కేవలం పురుషులను మాత్రమే సూచించదని పాదసూచికలో స్పష్టం చేశాం.
- issue: מִשְׁפָּט యొక్క న్యాయపరమైన పరిధి
  choice: తీర్పు
  alternative: న్యాయం; న్యాయపరమైన నిర్ణయం
  rationale: ఒక నిర్దిష్ట న్యాయపదంగా అనవసరంగా కుదించకుండా, తీర్పు చెప్పడం మరియు న్యాయం నిర్వహించడం రెండింటికీ వీలున్న విస్తృత పదాన్ని ఎంచుకున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే వాక్యనిర్మాణం వాడబడింది. ‘కూర్చుండేది,’ ‘ఎక్కివచ్చేవారు’ అనే రూపాలు ఈ చర్యలు అలవాటుగా జరిగేవని తెలియజేస్తాయి. పాదసూచిక గుర్తులు అవి వివరిస్తున్న పదాలకే నేరుగా జతచేయబడ్డాయి.
