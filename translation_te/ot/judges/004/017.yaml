source:
  edition: WLC
  text: וְ/סִֽיסְרָא֙ נָ֣ס בְּ/רַגְלָ֔י/ו אֶל אֹ֣הֶל יָעֵ֔ל אֵ֖שֶּׁת חֶ֣בֶר הַ/קֵּינִ֑י כִּ֣י שָׁל֗וֹם בֵּ֚ין יָבִ֣ין מֶֽלֶךְ חָצ֔וֹר וּ/בֵ֕ין בֵּ֖ית חֶ֥בֶר הַ/קֵּינִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/017.yaml
  text: But Sisera fled on foot to the tent of Jael[a], the wife of Heber the Kenite[b], because there was peace between Jabin king of Hazor and the house of Heber the Kenite.
translation:
  language: te
  text: అయితే[a] సీసెరా కాలినడకన కేనీయుడైన హెబెరు భార్య యాయేలు గుడారానికి పారిపోయాడు. ఎందుకంటే హాసోరు రాజైన యాబీనుకు, కేనీయుడైన హెబెరు ఇంటివారికి[b] మధ్య శాంతి ఉండేది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మరియు సీసెరా కాలినడకన పారిపోయాడు.” హీబ్రూ సంధిపదాన్ని ‘మరియు’ అని కూడా అనువదించవచ్చు; ‘అయితే’ అనేది సందర్భంలోని కథన వ్యత్యాసాన్ని తెలియజేస్తుంది.
    reason: alternative_reading
  - marker: b
    text: “హెబెరు ఇంటివారు” అంటే హెబెరు కుటుంబం లేదా వంశసమూహం.
    reason: cultural_note
lexical_decisions:
- source_word: וְ/סִֽיסְרָא֙
  choice: అయితే సీసెరా
  rationale: ו సాధారణంగా ‘మరియు’ అని అనువదించవచ్చు; ఇక్కడ ముందటి వృత్తాంతానికి భిన్నంగా సీసెరా తప్పించుకొని పారిపోవడాన్ని చూపే కథన మలుపు ఉన్నందున ‘అయితే’ సహజంగా ఉంది. ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: נָ֣ס
  choice: పారిపోయాడు
  rationale: Qal రూపంలోని נסకు ‘పారిపోవు’ అనే ప్రత్యక్ష అర్థం ఉంది; సందర్భంలో సీసెరా యుద్ధభూమి నుంచి తప్పించుకుంటున్నాడు.
- source_word: בְּ/רַגְלָ֔י/ו
  choice: కాలినడకన
  rationale: అక్షరార్థంగా ‘తన పాదాలతో’; రథం లేకుండా నడిచి లేదా పరుగెత్తి వెళ్లాడనే భావాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: אֶל אֹ֣הֶל יָעֵ֔ל
  choice: యాయేలు గుడారానికి
  rationale: ‘యాయేలు గుడారం వైపు/దగ్గరకు’ అనే నిర్మాణాన్ని సంక్షిప్తంగా, సహజమైన తెలుగు స్వామ్య నిర్మాణంలో అందిస్తుంది.
- source_word: אֵ֖שֶּׁת חֶ֣בֶר הַ/קֵּינִ֑י
  choice: కేనీయుడైన హెబెరు భార్య
  rationale: యాయేలు ఎవరనేది తెలిపే హీబ్రూ వివరణను స్పష్టంగా నిలుపుతుంది.
- source_word: כִּ֣י
  choice: ఎందుకంటే
  rationale: సీసెరా ఆ గుడారానికి వెళ్లడానికి కారణాన్ని పరిచయం చేస్తుంది.
- source_word: שָׁל֗וֹם
  choice: శాంతి
  rationale: שָׁלוֹם ఇక్కడ పరస్పర శాంతియుత సంబంధాన్ని సూచిస్తుంది. ‘ఒప్పందం’ లేదా ‘మైత్రి’ అని ప్రత్యేకీకరించకుండా మూలంలోని విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: בֵּ֚ין יָבִ֣ין מֶֽלֶךְ חָצ֔וֹר וּ/בֵ֕ין
  choice: హాసోరు రాజైన యాబీనుకు ... మధ్య
  rationale: రాజు పేరు, అతని పాలనా స్థలం, రెండు పక్షాల మధ్య సంబంధం అన్నింటినీ సహజమైన తెలుగు వాక్యక్రమంలో అందిస్తుంది.
- source_word: בֵּ֖ית חֶ֥בֶר הַ/קֵּינִֽי
  choice: కేనీయుడైన హెబెరు ఇంటివారికి
  rationale: בֵּית ఇక్కడ భవనాన్ని కాక హెబెరు కుటుంబం లేదా గృహసమూహాన్ని సూచిస్తుంది; ‘ఇంటివారు’ ఆధునిక పాఠకునికి ఆ సామాజిక భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
