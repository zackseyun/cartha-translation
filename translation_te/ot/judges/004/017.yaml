translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. వ్యక్తి, స్థలనామాలు సాధారణ తెలుగు బైబిల్ రూపాలకు దగ్గరగా లిప్యంతరీకరించబడ్డాయి. మూలంలోని ‘శాంతి’ అనే విస్తృత పదాన్ని ఒప్పందం లేదా మైత్రిగా సంకుచితం చేయలేదు. ప్రతి పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో చేర్చబడింది.
