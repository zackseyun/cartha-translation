source:
  edition: WLC
  text: וּ/בָרָ֗ק רָדַ֞ף אַחֲרֵ֤י הָ/רֶ֨כֶב֙ וְ/אַחֲרֵ֣י הַֽ/מַּחֲנֶ֔ה עַ֖ד חֲרֹ֣שֶׁת הַגּוֹיִ֑ם וַ/יִּפֹּ֞ל כָּל מַחֲנֵ֤ה סִֽיסְרָא֙ לְ/פִי חֶ֔רֶב לֹ֥א נִשְׁאַ֖ר עַד אֶחָֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/016.yaml
  text: And Barak pursued the chariots and the army as far as Harosheth of the nations[a], and all Sisera’s army fell by the edge of the sword[b]; not even one was left.
translation:
  language: te
  text: బారాకు రథాలను, సైన్యాన్ని జాతుల హరోషెతు వరకు వెంబడించాడు. సీసెరా సైన్యమంతా కత్తి ధారకు పడిపోయింది; ఒక్కడు కూడా మిగలలేదు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רָדַף אַחֲרֵי
  choice: వెంబడించాడు
  rationale: యుద్ధ సందర్భంలోని చురుకైన తరుమడాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: הָרֶכֶב
  choice: రథాలను
  rationale: ఏకవచన రూపంలో ఉన్నప్పటికీ ఇది సమూహార్థక సైనిక పదం; సందర్భంలో రథాల సమూహాన్ని సూచిస్తుంది.
- source_word: הַמַּחֲנֶה
  choice: సైన్యాన్ని
  rationale: ఇక్కడ పదం శిబిర స్థలాన్ని కాక యుద్ధ దళాన్ని సూచిస్తుంది.
- source_word: עַד חֲרֹשֶׁת הַגּוֹיִם
  choice: జాతుల హరోషెతు వరకు
  rationale: עַד వెంబడింపు ఎంత దూరం సాగిందో సూచిస్తుంది; గోయీమ్ అనే భాగానికి ప్రాథమికమైన ‘జాతులు’ అనే అర్థాన్ని నిలుపుతూ స్థలనామాన్ని సహజంగా అందిస్తుంది.
- source_word: וַיִּפֹּל כָּל מַחֲנֵה סִיסְרָא
  choice: సీసెరా సైన్యమంతా ... పడింది
  rationale: సమూహవాచక కర్తతో ఉన్న ఏకవచన క్రియను నిలుపుతూ మొత్తం దళం యుద్ధంలో హతమైందనే భావాన్ని తెలుపుతుంది.
- source_word: לְפִי חֶרֶב
  choice: కత్తివాత పడింది
  rationale: హీబ్రూ ‘కత్తి నోటికి/అంచుకు’ అనే యుద్ధప్రయోగాన్ని అక్షరానువాదం చేయకుండా, దాని దృశ్యభావాన్నీ హతమవడమనే అర్థాన్నీ సహజమైన తెలుగు నుడికారంలో అందిస్తుంది.
- source_word: לֹא נִשְׁאַר עַד אֶחָד
  choice: ఒక్కడు కూడా మిగలలేదు
  rationale: ఒక్క వ్యక్తి సైతం తప్పించుకోలేదనే మూలపాఠంలోని ఉద్ఘాటిత సంపూర్ణతను సహజంగా వ్యక్తం చేస్తుంది.
