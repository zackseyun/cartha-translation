  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. యుద్ధసందర్భానికి తగిన ‘వెంబడించాడు,’ ‘సైన్యం,’ ‘కత్తివాత పడింది’ వంటి సాధారణంగా అర్థమయ్యే పదాలను ఎంచుకున్నాం; స్థలనామంలోని హీబ్రూ భావాన్ని ప్రధాన పాఠంలో నిలిపి, సంప్రదాయ రూపాన్ని పాదటిప్పణిలో ఇచ్చాం.
