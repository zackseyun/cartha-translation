- from: అప్పుడు బారాకు జెబులూను, నఫ్తాలి గోత్రాలవారిని కెదెషుకు సమకూర్చాడు. అతని వెంట పదివేల మంది బయలుదేరి వెళ్లారు[a]. దెబోరా కూడా అతనితో వెళ్లింది.
  to: అప్పుడు బారాకు జెబూలూను, నఫ్తాలి గోత్రాలను కెదెషుకు పిలిచాడు. అతని వెంట పదివేల మంది పైకి వెళ్లారు[a]. దెబోరా అతనితో పాటు పైకి వెళ్లింది.
  rationale: 'The revision corrects two source-fidelity matters: it renders Barak’s action as summoning rather than gathering, and it retains the repeated Hebrew verb ‘went up’ in both clauses. It also expresses Zebulun and Naphtali directly as tribes, while retaining the idiomatic sense of ‘at his feet’ in the footnote.'
