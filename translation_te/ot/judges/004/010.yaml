  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే గౌరవప్రదమైన కథనశైలి ఉపయోగించబడింది. హీబ్రూ నుడికారాన్ని ప్రధాన వాక్యంలో సహజంగా అనువదించి, దాని అక్షరరూపాన్ని పాదసూచికలో నిలిపాం.
