  text: וַ/יַּזְעֵ֨ק בָּרָ֜ק אֶת זְבוּלֻ֤ן וְ/אֶת נַפְתָּלִי֙ קֶ֔דְשָׁ/ה וַ/יַּ֣עַל בְּ/רַגְלָ֔י/ו עֲשֶׂ֥רֶת אַלְפֵ֖י אִ֑ישׁ וַ/תַּ֥עַל עִמּ֖/וֹ דְּבוֹרָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/010.yaml
  text: Then Barak summoned Zebulun and Naphtali to Kedesh[a], and ten thousand men went up following him, and Deborah went up with him.
translation:
  language: te
  text: అప్పుడు బారాకు జెబూలూను, నఫ్తాలి గోత్రాలను కెదెషుకు పిలిచాడు. అతని వెంట పదివేల మంది పైకి వెళ్లారు[a]. దెబోరా అతనితో పాటు పైకి వెళ్లింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “అతని పాదాల వద్ద పదివేల మంది పైకి వెళ్లారు.” ఇది వారు అతని వెంట, అతని నాయకత్వంలో వెళ్లారని తెలిపే హీబ్రూ ప్రయోగం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּזְעֵק
  choice: సమకూర్చాడు
  rationale: హిఫిల్ రూపంలోని זעק ఇక్కడ యుద్ధానికి ప్రజలను పిలిచి సమీకరించడాన్ని సూచిస్తుంది. ‘సమకూర్చాడు’ అనేది బలవంతపు నియామకం అనే అదనపు భావాన్ని చేర్చకుండా సైనిక సందర్భాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: אֶת זְבוּלֻן וְאֶת נַפְתָּלִי
  choice: జెబులూను, నఫ్తాలి గోత్రాలవారిని
  rationale: మూలంలో గోత్రాల పేర్లే కర్మలుగా ఉన్నాయి. తెలుగులో వ్యక్తులను సమకూర్చాడనే అర్థం స్పష్టంగా ఉండేందుకు ‘గోత్రాలవారిని’ అని వ్యక్తీకరించబడింది.
- source_word: קֶדְשָׁה
  choice: కెదెషుకు
  rationale: స్థలనామానికి జోడించిన దిశాసూచక ה, కెదెషు వైపు కదలికను సూచిస్తుంది; అందువల్ల ‘కెదెషుకు’ సరైన సహజ అనువాదం.
- source_word: וַיַּעַל
  choice: బయలుదేరి వెళ్లారు
  rationale: עלה ప్రాథమికంగా ‘పైకి వెళ్లడం’ అని అర్థమైనా, ఇక్కడ సైనిక దళం బారాకు నాయకత్వంలో కదలడాన్ని సహజ తెలుగులో తెలియజేయడానికి ‘బయలుదేరి వెళ్లారు’ అని అనువదించబడింది. మూలంలోని ఎత్తుకు వెళ్లడం లేదా సైనికంగా ముందుకు కదలడం అనే ఛాయను పాదసూచికలో సూచించాం.
- source_word: בְּרַגְלָיו
  choice: అతని వెంట
  rationale: అక్షరార్థంగా ‘అతని పాదాల దగ్గర/వద్ద’ అనే ఈ హీబ్రూ ప్రయోగం సందర్భంలో బారాకును అనుసరించి, అతని నాయకత్వంలో వెళ్లడాన్ని సూచిస్తుంది. ‘అతని వెంట’ ఆధునిక తెలుగులో ఆ భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: עֲשֶׂרֶת אַלְפֵי אִישׁ
  choice: పదివేల మంది
  rationale: ఇది పదివేలమంది పురుషులతో కూడిన సైనిక బలగాన్ని సూచించే సాధారణ హీబ్రూ సంఖ్యాప్రయోగం. సందర్భం వల్ల వారు యోధులని స్పష్టంగా ఉన్నందున సహజ తెలుగులో ‘పదివేల మంది’ అని ఇచ్చాం.
- source_word: וַתַּעַל עִמּוֹ דְּבוֹרָה
  choice: దెబోరా కూడా అతనితో వెళ్లింది
  rationale: దెబోరా బారాకుతో కలిసి వెళ్లిందనే వాక్యార్థాన్ని నేరుగా, సహజంగా తెలియజేస్తుంది. ‘కూడా’ ఆమె పదివేల మందితో పాటు అతనితో వెళ్లిందనే కథన సంబంధాన్ని ప్రతిబింబిస్తుంది.
