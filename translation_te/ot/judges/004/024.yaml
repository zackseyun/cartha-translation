  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కథన శైలి. హెబ్రీయ భాషలోని ‘చేయి’ అనే రూపకాన్ని అక్షరానువాదం చేస్తే తెలుగులో అసహజంగా ఉండేందున దాని భావమైన ‘బలం’ను ప్రధాన పాఠ్యంలో ఇచ్చాం. పెరుగుతున్న ఒత్తిడి అనే మూలభావాన్ని ‘అంతకంతకూ’ ద్వారా నిలిపాం.
