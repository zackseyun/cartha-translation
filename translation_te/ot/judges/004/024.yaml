  to: ఇశ్రాయేలు కుమారుల పైచేయి కనాను రాజైన యాబీనుకు వ్యతిరేకంగా అంతకంతకూ బలపడుతూ వచ్చింది; చివరికి వారు కనాను రాజైన యాబీనును నిర్మూలించారు.[a]
