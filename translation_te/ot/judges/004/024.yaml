base_translation:
  language: en
  yaml_path: translation/ot/judges/004/024.yaml
  text: And the hand of the sons of Israel went on[a], growing stronger against Jabin king of Canaan[c][b], until they cut off Jabin king of Canaan.
translation:
  language: te
  text: ఇశ్రాయేలు కుమారుల పైచేయి కనాను రాజైన యాబీనుకు వ్యతిరేకంగా అంతకంతకూ బలపడుతూ వచ్చింది; చివరికి వారు కనాను రాజైన యాబీనును నిర్మూలించారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నిర్మూలించారు’ అనే మాటకు ‘తొలగించివేశారు’ లేదా ‘నాశనం చేశారు’ అని కూడా అనువదించవచ్చు. హెబ్రీ క్రియకు అక్షరార్థంగా ‘నరికివేయడం’ అనే భావం ఉన్నా, ఇక్కడ అది నిర్ణయాత్మకంగా తొలగించడం లేదా నాశనం చేయడం అనే అర్థంలో ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּלֶךְ יַד
  choice: బలం ... అంతకంతకూ పెరుగుతూ వచ్చింది
  rationale: అక్షరార్థంగా ‘చేయి సాగింది’ అయినా, ఇక్కడ ‘చేయి’ అధికారం లేదా శక్తికి రూపకం. తరువాతి הָלוֹךְ וְקָשָׁהతో కలిసి క్రమంగా పెరుగుతున్న ఆధిపత్యాన్ని సూచిస్తుంది; సహజమైన ఆధునిక తెలుగులో ఆ భావాన్ని తెలిపాం.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: మూలంలోని ‘ఇశ్రాయేలు కుమారులు’ అనే జాతిపరమైన సంజ్ఞను నిలిపి, దాని సంబంధరూపాన్ని ‘ఇశ్రాయేలు కుమారుల’గా ఇచ్చాం.
- source_word: הָלוֹךְ וְקָשָׁה
  choice: అంతకంతకూ పెరుగుతూ వచ్చింది
  rationale: ఈ నిర్మాణం నిరంతరమైన, తీవ్రమవుతున్న ఒత్తిడిని తెలియజేస్తుంది. ‘బలపడింది’ అనే భావాన్ని సందర్భంలోని ‘బలం’తో కలిపి సహజంగా వ్యక్తపరుస్తుంది.
- source_word: עַל
  choice: వ్యతిరేకంగా
  rationale: శత్రుత్వపూర్వక సందర్భంలో యాబీనుపై ప్రయోగించబడిన శక్తిని స్పష్టంగా తెలియజేస్తుంది.
- source_word: הִכְרִיתוּ
  choice: నిర్మూలించారు
  rationale: כרת హిఫీల్ రూపానికి ‘తొలగించివేయడం, నాశనం చేయడం’ అనే నిర్ణాయక భావం ఉంది. తెలుగులో ‘నరికివేశారు’ వ్యక్తిగత హత్యను అనవసరంగా ముందుకు తెచ్చే అవకాశం ఉన్నందున సందర్భానుకూలంగా ‘నిర్మూలించారు’ ఎంచుకున్నాం.
