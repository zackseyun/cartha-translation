id: JDG.4.13
reference: Judges 4:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּזְעֵ֨ק סִֽיסְרָ֜א אֶת כָּל רִכְבּ֗/וֹ תְּשַׁ֤ע מֵאוֹת֙ רֶ֣כֶב בַּרְזֶ֔ל וְ/אֶת כָּל הָ/עָ֖ם אֲשֶׁ֣ר אִתּ֑/וֹ מֵ/חֲרֹ֥שֶׁת הַגּוֹיִ֖ם אֶל נַ֥חַל קִישֽׁוֹן־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/013.yaml
  text: Then Sisera called together all his chariots[a], nine hundred iron chariots, and all the people who were with him, from Harosheth-haggoyim to the Wadi Kishon.
translation:
  language: te
  text: అప్పుడు సీసెరా తన రథాలన్నిటినీ—తొమ్మిది వందల ఇనుప రథాలను—తనతో ఉన్న ప్రజలందరినీ హరోషెత్-హగ్గోయీము నుండి కీషోను వాగు[a] వద్దకు సమకూర్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘కీషోను నది’ లేదా ‘కీషోను ప్రవాహం.’ హీబ్రూ పదం వాగును, ప్రవాహపాత్రను లేదా కాలానుగుణంగా ఉప్పొంగే నీటిప్రవాహపు లోయను సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּזְעֵק
  choice: సమకూర్చాడు
  rationale: זעק అనే క్రియకు సాధారణంగా ‘కేకవేయడం’ అనే అర్థం ఉన్నా, సైనిక బలగాలను ప్రత్యక్ష కర్మగా తీసుకున్న ఈ సందర్భంలో వారిని పిలిపించి ఒకచోట చేర్చడం అనే భావం ఉంది. ‘సమకూర్చాడు’ ఆ సైనిక సందర్భాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: רִכְבּוֹ
  choice: తన రథాలన్నిటినీ
  rationale: רכב సమష్టిగా రథబలాన్ని సూచించగలదు; వెంటనే వచ్చే ‘తొమ్మిది వందల ఇనుప రథాలు’ అనే వివరణ కారణంగా స్పష్టమైన బహువచన రూపం తెలుగులో సహజంగా ఉంటుంది.
- source_word: תְּשַׁע מֵאוֹת רֶכֶב בַּרְזֶל
  choice: తొమ్మిది వందల ఇనుప రథాలను
  rationale: సంఖ్యను, ‘ఇనుప రథాలు’ అనే మూలంలోని సంక్షిప్త నిర్మాణాన్ని నేరుగా నిలుపుతుంది; రథాలు పూర్తిగా ఇనుముతో చేసినవా లేక ఇనుప భాగాలు అమర్చినవా అన్నదాన్ని అదనంగా నిర్ణయించదు.
- source_word: כָּל הָעָם אֲשֶׁר אִתּוֹ
  choice: తనతో ఉన్న ప్రజలందరినీ
  rationale: עָם యొక్క ప్రాథమిక అర్థమైన ‘ప్రజలు’ను నిలుపుతూ, సందర్భమే వారిని సైనిక బలగంగా అర్థం చేసుకునేలా చేస్తుంది; ‘సైనికులు’ అని స్పష్టీకరించి మూలంలోని విస్తృత పదాన్ని కుదించలేదు.
- source_word: מֵחֲרֹשֶׁת הַגּוֹיִם
  choice: హరోషెత్-హగ్గోయీము నుండి
  rationale: స్థలనామాన్ని అర్థానువాదం చేయకుండా తెలుగు లిపిలో ధ్వన్యనుకరణగా ఇచ్చి, מִן ఉపసర్గను ‘నుండి’గా అనువదించింది.
- source_word: נַחַל קִישׁוֹן
  choice: కీషోను వాగు
  rationale: נַחַל అనేది వాగు, నీటిప్రవాహం, కాలానుగుణంగా నీరు పారే ప్రవాహపాత్ర లేదా లోయను సూచించగలదు. ‘వాగు’ ఆధునిక తెలుగులో సహజంగా ఉండి, పెద్ద శాశ్వత నది అనే భావాన్ని అనవసరంగా విధించదు.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. రథాల సంఖ్యను వివరణాత్మక విరామచిహ్నాలతో చూపించి మూలంలోని apposition‌ను స్పష్టంగా నిలిపింది. స్థలనామాలు ధ్వన్యనుకరణగా ఇవ్వబడ్డాయి; సైనిక సందర్భాన్ని తెలియజేయడానికి అవసరానికి మించిన వివరణను ప్రధాన పాఠ్యంలో చేర్చలేదు.
