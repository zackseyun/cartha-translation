source:
  edition: WLC
  text: וַ/יַּגִּ֖דוּ לְ/סִֽיסְרָ֑א כִּ֥י עָלָ֛ה בָּרָ֥ק בֶּן אֲבִינֹ֖עַם הַר תָּבֽוֹר־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/012.yaml
  text: And they told Sisera that Barak son of Abinoam had gone up to Mount Tabor.
translation:
  language: te
  text: అబీనోయము కుమారుడైన బారాకు తాబోరు కొండపైకి ఎక్కాడని వారు సీసెరాకు తెలియజేశారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּגִּדוּ
  choice: వారు ... తెలియజేశారు
  rationale: נגד హిఫీల్ రూపం ‘తెలియజేయడం, నివేదించడం’ అనే అర్థమిస్తుంది. కర్త ఎవరో మూలపాఠంలో నిర్దిష్టంగా చెప్పలేదు; అందువల్ల ‘వారు’ అని ఉంచడం ఆ అనిర్దిష్ట బహువచనాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: לְסִיסְרָא
  choice: సీసెరాకు
  rationale: לְ పరోక్ష కర్మను సూచిస్తుంది; తెలుగులో చతుర్థీ విభక్తి ‘-కు’ సహజంగా అదే సంబంధాన్ని వ్యక్తం చేస్తుంది.
- source_word: כִּי
  choice: అని
  rationale: చెప్పడం/తెలియజేయడం అనే క్రియ తరువాత כִּי ఇక్కడ నివేదిత విషయాన్ని పరిచయం చేస్తుంది; తెలుగులో ‘అని’ సరైన సమానార్థక నిర్మాణం.
- source_word: עָלָה
  choice: పైకి వెళ్లాడు
  rationale: עלה అంటే ‘ఎక్కడం, పైకి వెళ్లడం.’ కొండను గమ్యంగా సూచించే సందర్భంలో ‘పైకి వెళ్లాడు’ దిశాత్మక, భౌగోళిక భావాన్ని సహజంగా అందిస్తుంది; హెబ్రీ పరిపూర్ణ క్రియను తెలుగులో సాధారణ భూతకాలంతో అనవసర కాలవ్యాఖ్య లేకుండా అనువదించాం.
- source_word: בָּרָק
  choice: బారాకు
  rationale: హెబ్రీ వ్యక్తిపేరు בָּרָק యొక్క తెలుగు లిప్యంతరీకరణ; చివరి వ్యంజనాన్ని స్పష్టంగా పలికేలా ‘బారాకు’ రూపం వాడబడింది.
- source_word: בֶּן אֲבִינֹעַם
  choice: అబీనోయము కుమారుడైన
  rationale: హెబ్రీ వంశసూచక నిర్మాణాన్ని సహజమైన తెలుగు విశేషణ నిర్మాణంగా అందిస్తుంది.
- source_word: הַר תָּבוֹר
  choice: తాబోరు కొండ
  rationale: הַר ఇక్కడ పేరుగల నిర్దిష్ట పర్వతాన్ని సూచిస్తుంది. సాధారణ పాఠకులకు సహజంగా అర్థమయ్యే ‘కొండ’ను, స్థలనామం ‘తాబోరు’తో కలిపి వాడాం.
