translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన వాక్య నిర్మాణం. మూలంలోని అనిర్దిష్ట బహువచన కర్తను ‘వారు’గా నిలిపి, నివేదిత వాక్యాన్ని ‘అని’తో సహజంగా నిర్మించాం.
