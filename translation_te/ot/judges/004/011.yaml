    issue: '[a] పాదసూచిక తప్పు పదబంధానికి జతచేయబడింది మరియు అనుచితమైన ప్రత్యామ్నాయాన్ని ఇస్తోంది.'
    rationale: మూలంలోని కయీను/కేనీయులు రూపాలు ఈ సందర్భంలో కేనీయుల వంశసమూహాన్నే సూచిస్తాయి; “కయీను వంశం” అనే ప్రత్యామ్నాయం పాఠకుడిని వ్యక్తి కయీను వైపుకు తప్పుదోవ పట్టించవచ్చు. నిజమైన అనిశ్చితి חֹתֵן అనే మోషేతో వివాహబంధ పదంలో ఉంది.
