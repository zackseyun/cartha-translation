- from: కేనీయుడైన హెబెరు కేనీయుల నుండి[a], అంటే మోషే మామయైన హోబాబు కుమారుల నుండి, విడిపోయి, కెదెషు దగ్గర ఉన్న జయనన్నీములోని సిందూర వృక్షం[b] వరకు వెళ్లి తన గుడారం వేసుకున్నాడు.
  to: కేనీయుడైన హెబెరు, మోషే మామయైన[a] హోబాబు కుమారులైన కేనీయుల నుండి విడిపోయి, కెదెషు సమీపంలోని జయనన్నీములోని ఓక్ చెట్టు[b] వరకు తన గుడారం వేసుకున్నాడు.
