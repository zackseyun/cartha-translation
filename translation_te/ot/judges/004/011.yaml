source:
  edition: WLC
  text: וְ/חֶ֤בֶר הַ/קֵּינִי֙ נִפְרָ֣ד מִ/קַּ֔יִן מִ/בְּנֵ֥י חֹבָ֖ב חֹתֵ֣ן מֹשֶׁ֑ה וַ/יֵּ֣ט אָהֳל֔/וֹ עַד אֵל֥וֹן ב/צענים אֲשֶׁ֥ר אֶת קֶֽדֶשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/011.yaml
  text: Heber the Kenite had separated from the Kenites[a], from the sons of Hobab, the father-in-law of Moses, and had pitched his tent as far as the oak in Zaannannim[b], which is near Kedesh.
translation:
  language: te
  text: కేనీయుడైన హెబెరు, మోషే మామయైన[a] హోబాబు కుమారులైన కేనీయుల నుండి విడిపోయి, కెదెషు సమీపంలోని జయనన్నీములోని ఓక్ చెట్టు[b] వరకు తన గుడారం వేసుకున్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మోషేకు వివాహబంధువు.” హెబ్రీ పదం ప్రత్యేకంగా మామను సూచించవచ్చు; అయితే విస్తృతంగా వివాహ సంబంధ బంధువును కూడా సూచించగలదు.
    reason: alternative_reading
  - marker: b
    text: లేదా, “టెరెబింత్ చెట్టు.” హెబ్రీ పదం ఓక్ లేదా టెరెబింత్ వంటి పెద్ద వృక్షాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִפְרָד
  choice: విడిపోయి
  rationale: నిఫాల్ రూపం ఒక సమూహం నుండి వేరుపడడాన్ని సూచిస్తుంది; కథా నేపథ్యాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: מִקַּיִן / הַקֵּינִי
  choice: కేనీయుల నుండి / కేనీయుడైన
  rationale: ఇక్కడ ఇవి కయీను అనే వ్యక్తిని కాక కేనీయుల వంశసమూహాన్ని సూచిస్తున్నాయి.
- source_word: מִבְּנֵי חֹבָב
  choice: హోబాబు కుమారుల నుండి
  rationale: בני అనే మూలభాషా రూపాన్ని నిలుపుతూ, సందర్భంలో హోబాబు వంశీయులను సూచిస్తుంది.
- source_word: חֹתֵן מֹשֶׁה
  choice: మోషే మామయైన
  rationale: తెలుగులో 'మామ' వివాహబంధంలోని పెద్ద పురుష బంధువుకు సహజమైన పదం; హెబ్రీ పదం ప్రత్యేకంగా మామను సూచించవచ్చినా, విస్తృత వివాహ బంధువనే భావమూ కలిగి ఉండగలదని పాదసూచికలో తెలిపాం.
- source_word: וַיֵּט אָהֳלוֹ
  choice: తన గుడారం వేసుకున్నాడు
  rationale: נטה אהל అనే నుడికారం గుడారం వేయడం లేదా నిలపడం అని అర్థం.
- source_word: עַד
  choice: వరకు వెళ్లి
  rationale: ఒక ప్రదేశం దాకా సాగిన గమనాన్ని తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: אֵלוֹן
  choice: సిందూర వృక్షం
  rationale: אֵלוֹן పెద్ద వృక్షాన్ని, తరచుగా ఓక్ లేదా టెరెబింత్ చెట్టును సూచించవచ్చు; తెలుగు పాఠ్యంలో టెరెబింత్‌కు సాధారణంగా వాడే 'సిందూర వృక్షం'ను ఎంచుకుని ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: בצענים
  choice: జయనన్నీములోని
  rationale: అనిశ్చిత వ్యుత్పత్తిగల స్థలనామాన్ని అనువదించకుండా ధ్వన్యనువాదం చేశాం.
- source_word: אֲשֶׁר אֶת קֶדֶשׁ
  choice: కెదెషు దగ్గర ఉన్న
  rationale: ఈ నిర్మాణం కెదెషుకు సమీపంలోని స్థలాన్ని సూచిస్తుంది.
theological_decisions:
- issue: మోషేతో חֹתֵן సూచించే బంధం
  choice: మోషే మామ
  alternative: మోషేకు వివాహ బంధువు
  rationale: హోబాబు-మోషే సంప్రదాయంలో 'మామ' సాధారణమైన, సంభావ్యమైన అర్థం; అయితే హెబ్రీ పదం విస్తృత వివాహ బంధాన్ని కూడా సూచించగలదు కాబట్టి ఆ అనిశ్చితిని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని నేపథ్య సమాచారాన్ని తెలుగులో క్రమబద్ధంగా ఇచ్చి, బంధపదం మరియు వృక్షజాతి విషయంలోని నిజమైన అనిశ్చితిని పాదసూచికల్లో నిలిపాం.
