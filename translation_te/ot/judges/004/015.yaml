source:
  edition: WLC
  text: וַ/יָּ֣הָם יְ֠הוָה אֶת סִֽיסְרָ֨א וְ/אֶת כָּל הָ/רֶ֧כֶב וְ/אֶת כָּל הַֽ/מַּחֲנֶ֛ה לְ/פִי חֶ֖רֶב לִ/פְנֵ֣י בָרָ֑ק וַ/יֵּ֧רֶד סִֽיסְרָ֛א מֵ/עַ֥ל הַ/מֶּרְכָּבָ֖ה וַ/יָּ֥נָס בְּ/רַגְלָֽי/ו־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/015.yaml
  text: And Yahweh threw Sisera[a], all his chariots, and all his army into confusion before Barak by the sword[c][b]. Then Sisera got down from his chariot and fled on foot.
translation:
  language: te
  text: యాహ్వే సీసెరాను, అతని రథాలన్నిటినీ, సైన్యమంతటినీ[a] బారాకు ఎదుట కత్తిచేత[b] కలవరపరిచాడు[c]. అప్పుడు సీసెరా తన రథం నుండి దిగి కాలినడకన పారిపోయాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘సైన్యం’ అని అనువదించిన హీబ్రూ పదానికి అక్షరార్థంగా ‘శిబిరం’ లేదా ‘దండు’ అని కూడా అర్థం రావచ్చు; ఇక్కడ అది మొత్తం పోరాట దళాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘కత్తి నోటితో’ లేదా ‘కత్తి అంచుతో.’
    reason: lexical_alternative
  - marker: c
    text: లేదా ‘భయాందోళనకు గురిచేశాడు’; ఈ హీబ్రూ క్రియ యుద్ధంలో గందరగోళం లేదా భయాన్ని కలిగించడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּהָם
  choice: కలవరపరిచాడు
  rationale: హీబ్రూ క్రియ యుద్ధంలో భయాందోళన, గందరగోళం కలిగించడాన్ని సూచిస్తుంది. ‘కలవరపరిచాడు’ దాని కారణార్థక భావాన్ని నిలుపుతూ, సంపూర్ణ ఓటమి అనే భావాన్ని అనవసరంగా చేర్చదు.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగులో దాని సాధారణ లిప్యంతరీకరణగా ఇచ్చాం.
- source_word: הָרֶכֶב
  choice: అతని రథాలన్నిటినీ
  rationale: ఈ పదం రథాలను సమూహంగా లేదా రథదళాన్ని సూచించగలదు. సందర్భంలో సీసెరా ఆధీనంలోని రథాలు అని సహజంగా అర్థమయ్యేలా స్వామ్యరూపం వాడాం.
- source_word: הַמַּחֲנֶה
  choice: సైన్యమంతటినీ
  rationale: పదానికి అక్షరార్థంగా ‘శిబిరం’ అనే భావం ఉన్నా, ఈ యుద్ధ సందర్భంలో అది మొత్తం పోరాట దళాన్ని సూచిస్తుంది.
- source_word: לְפִי חֶרֶב
  choice: కత్తిచేత
  rationale: ‘కత్తి నోరు/అంచు’ అనే హీబ్రూ నుడికారం కత్తి ద్వారా సంభవించిన యుద్ధదెబ్బ లేదా సంహారాన్ని సూచిస్తుంది. సహజమైన తెలుగులో ‘కత్తిచేత’ అని ఇచ్చాం.
- source_word: לִפְנֵי בָרָק
  choice: బారాకు ఎదుట
  rationale: బారాకు ముందర, అతని దాడి సమక్షంలో ఈ సంఘటన జరిగిందనే స్థలసంబంధ భావాన్ని నిలుపుతుంది.
- source_word: וַיֵּרֶד ... מֵעַל הַמֶּרְכָּבָה
  choice: తన రథం దిగి
  rationale: వాహనం నుంచి దిగడాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; సందర్భానుసారంగా రథం సీసెరాదని స్వామ్యరూపం స్పష్టం చేస్తుంది.
- source_word: וַיָּנָס בְּרַגְלָיו
  choice: కాలినడకన పారిపోయాడు
  rationale: రథాన్ని వదిలి తన కాళ్లతో పారిపోయాడనే వ్యత్యాసాన్ని సహజమైన తెలుగు నుడికారంతో తెలియజేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం ప్రత్యక్షంగా ఉంది. దానిని ‘ప్రభువు’ వంటి బిరుదుగా మార్చకుండా లిప్యంతరీకరించాం; ‘యాహ్వే’ మూలనామానికి దగ్గరగా ఉన్న ఆధునిక రూపం.
- issue: యుద్ధంలో యాహ్వే చర్య యొక్క స్వరూపం
  choice: కలవరపరిచాడు
  alternative: చిత్తుగా ఓడించాడు
  rationale: హీబ్రూ క్రియ భయాందోళన లేదా గందరగోళాన్ని కలిగించడాన్ని సూచిస్తుంది. ఫలితాన్ని ముందుగానే ‘పూర్తిగా ఓడించాడు’ అని నిర్దిష్టం చేయకుండా మూలంలోని భావపరిధిని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, కథనానికి తగిన గంభీరమైన కాని సులభంగా అర్థమయ్యే శైలిని వాడాం. మూలంలోని ప్రత్యక్ష కర్మల వరుసను సాధ్యమైనంతవరకు నిలిపి, తెలుగు సహజత్వం కోసం సందర్భోచిత స్వామ్యరూపాలు ఉపయోగించాం.
