  to: యాబీను సైన్యాధిపతియైన సీసెరాను, అతని రథాలను, అతని జనసమూహాన్ని కీషోను వాగు[a] వద్ద నీ దగ్గరకు రప్పిస్తాను; అతణ్ణి నీ చేతికి అప్పగిస్తాను.[b]
