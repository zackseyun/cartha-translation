source:
  edition: WLC
  text: וּ/מָשַׁכְתִּ֨י אֵלֶ֜י/ךָ אֶל נַ֣חַל קִישׁ֗וֹן אֶת סִֽיסְרָא֙ שַׂר צְבָ֣א יָבִ֔ין וְ/אֶת רִכְבּ֖/וֹ וְ/אֶת הֲמוֹנ֑/וֹ וּ/נְתַתִּ֖י/הוּ בְּ/יָדֶֽ/ךָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/007.yaml
  text: And I will draw Sisera[a], the commander of Jabin’s army, along with his chariots and his multitude, to you at the Wadi Kishon[b], and I will give him into your hand.
translation:
  language: te
  text: యాబీను సైన్యాధిపతియైన సీసెరాను, అతని రథాలను, అతని జనసమూహాన్ని కీషోను వాగు[a] వద్ద నీ దగ్గరకు రప్పిస్తాను; అతణ్ణి నీ చేతికి అప్పగిస్తాను.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “కీషోను ప్రవాహలోయ/వరదకాల ప్రవాహపాత్ర.” హీబ్రూ నַחַל ఒక వాగును, ప్రవాహపాత్రను, లేదా వరదనీటి లోయను సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “జనసమూహం”కు సందర్భానుసారంగా “దళాలు” లేదా “సైన్యం” అని కూడా అనువదించవచ్చు; హీబ్రూ పదం అక్షరార్థంగా పెద్ద సమూహం లేదా జనరాశి.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָשַׁכְתִּי
  choice: రప్పిస్తాను
  rationale: మָשַׁךְ ఇక్కడ సీసెరాను నిర్ణీత ప్రదేశం వైపుకు వచ్చేలా చేయడాన్ని సూచిస్తుంది. ‘రప్పిస్తాను’ సహజమైన తెలుగులో ఆ కారణార్థాన్ని తెలియజేస్తుంది; ‘ఎర వేసి రప్పిస్తాను’ అనడం మూలంలో స్పష్టంగా లేని ఉద్దేశాన్ని చేర్చుతుంది.
- source_word: אֵלֶיךָ
  choice: నీ వైపుకు
  rationale: రెండవ పురుష ఏకవచన ప్రత్యయంతో ఉన్న ఉపసర్గ బారాకు వైపు కదలికను సూచిస్తుంది. ‘నీ వైపుకు’ దిశార్థాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: אֶל נַחַל קִישׁוֹן
  choice: కీషోను వాగు దగ్గర
  rationale: נַחַל శాశ్వత నదితో పాటు వాగు, ప్రవాహపాత్ర లేదా వరదనీటి లోయను కూడా సూచించవచ్చు. తెలుగు భూభాగ పదజాలంలో ‘వాగు’ సహజంగా ఉండి, మూలంలోని విస్తృత భావాన్ని చాలావరకు నిలుపుతుంది.
- source_word: סִיסְרָא
  choice: సీసెరా
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగులో సాధారణంగా వాడే లిప్యంతరీకరణ.
- source_word: שַׂר צְבָא יָבִין
  choice: యాబీను సైన్యాధిపతి
  rationale: שַׂר צָבָא సైనిక దళానికి నాయకుడిని సూచిస్తుంది. ‘సైన్యాధిపతి’ ఆధునిక, గౌరవప్రదమైన తెలుగు పదం.
- source_word: רִכְבּוֹ
  choice: అతని రథాలు
  rationale: רֶכֶב సమూహార్థంగా రథదళాన్ని సూచించగలదు. ‘రథాలు’ సూటిగా, సహజంగా ఉండి సైనిక సందర్భాన్ని నిలుపుతుంది.
- source_word: הֲמוֹנוֹ
  choice: అతని జనసమూహం
  rationale: הָמוֹן అనేది పెద్ద సమూహం లేదా జనరాశి అనే విస్తృత పదం. సైనిక సందర్భం ఉన్నప్పటికీ ‘సైన్యం’ అని సాంకేతికంగా కుదించకుండా మూలంలోని విస్తృతతను నిలుపుతుంది.
- source_word: וּנְתַתִּיהוּ
  choice: అతణ్ణి ... అప్పగిస్తాను
  rationale: ‘చేతిలో ఇవ్వడం’ అనే హీబ్రూ నుడికారం అధికారానికి లేదా ఆధీనానికి అప్పగించడాన్ని సూచిస్తుంది. తెలుగులో ‘అప్పగిస్తాను’ ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: בְּיָדֶךָ
  choice: నీ చేతికి
  rationale: ఇది ఒకరి అధికారానికి లేదా అదుపుకు అప్పగించడాన్ని తెలిపే హీబ్రూ నుడికారం. ‘నీ చేతికి’ మూల రూపకాన్ని కూడా నిలుపుతుంది.
