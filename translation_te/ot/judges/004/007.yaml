translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడబడింది. హీబ్రూ పదక్రమాన్ని యథాతథంగా అనుసరించకుండా తెలుగు ప్రవాహానికి తగినట్లు సైన్యాధిపతి అనే సమాసాన్ని ముందుంచాం. ‘నీ చేతికి’ అనే రూపకం మూల నుడికారాన్ని నిలుపుతుంది. అందించిన English POBలో పాదసూచిక గుర్తులు వాటి వివరణలతో తారుమారైనట్లు కనిపించినందున, హీబ్రూ ఆధారంగా అవసరమైన చోట మాత్రమే [a] చేర్చబడింది.
