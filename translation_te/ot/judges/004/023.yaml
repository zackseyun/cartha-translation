  text: So on that day God subdued Jabin king of Canaan before the sons of Israel[a].
translation:
  language: te
  text: ఆ రోజున దేవుడు కనాను రాజైన యాబీనును ఇశ్రాయేలు కుమారుల ఎదుట అణచివేశాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఇశ్రాయేలీయుల ఎదుట” లేదా “ఇశ్రాయేలు సంతానం ఎదుట.” హీబ్రూలో అక్షరార్థంగా “ఇశ్రాయేలు కుమారుల ఎదుట” అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכְנַע
  choice: అణచివేశాడు
  rationale: כנע హిఫిల్ రూపం శత్రువును లొంగదీయడం లేదా అతని బలాన్ని అణచడం అనే భావాన్ని ఇస్తుంది. యుద్ధ-రాజకీయ సందర్భంలో ‘అణచివేశాడు’ సహజంగాను బలంగాను ఉంది.
- source_word: אֱלֹהִים
  choice: దేవుడు
  rationale: ఇక్కడ ఇశ్రాయేలు దేవుడే చరిత్రలో కార్యం చేసే ఏకవచన కర్తగా స్పష్టంగా సూచించబడ్డాడు.
- source_word: בַּיּוֹם הַהוּא
  choice: ఆ రోజున
  rationale: హీబ్రూ కాలసూచక పదబంధాన్ని సహజమైన ఆధునిక తెలుగులో నేరుగా వ్యక్తపరుస్తుంది.
- source_word: יָבִין מֶלֶךְ כְּנָעַן
  choice: కనాను రాజైన యాబీనును
  rationale: హీబ్రూ పదక్రమంలోని ‘యాబీను, కనాను రాజు’ అనే సంబంధాన్ని తెలుగులో సహజమైన విశేషణ నిర్మాణంతో చూపిస్తుంది; אֵת సూచించే ప్రత్యక్ష కర్మను ‘ను’తో గుర్తిస్తుంది.
- source_word: לִפְנֵי
  choice: ఎదుట
  rationale: ‘ముందు/సమక్షంలో’ అనే సంబంధాన్ని సంక్షిప్తంగా నిలుపుతుంది; ఇశ్రాయేలీయుల సమక్షంలో లేదా వారి ఎదుట యాబీను అణచబడ్డాడనే మూలంలోని విస్తృత భావాన్ని అనవసరంగా కుదించదు.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: మూలంలోని ‘ఇశ్రాయేలు కుమారులు’ అనే లింగసూచక వంశపారంపర్య వ్యక్తీకరణను ప్రధాన పాఠ్యంలో నిలుపుతుంది; సాధారణ సమూహార్థం పాదసూచికలో ఇవ్వబడింది.
theological_decisions:
- issue: ఇశ్రాయేలు విజయంలోని దైవిక కార్యసాధకత్వం
  choice: యాబీనును అణచివేసిన ప్రత్యక్ష కర్తగా దేవుడిని పేర్కొనడం
  alternative: ఇశ్రాయేలు సైనిక విజయాన్ని మాత్రమే ముందుకు తెచ్చే నిరపేక్ష నిర్మాణం
  rationale: హీబ్రూ వాక్యంలో אֱלֹהִים క్రియకు స్పష్టమైన కర్త. కాబట్టి మానవ విజయంగా మాత్రమే మార్చకుండా దైవిక కార్యసాధకత్వాన్ని నిలుపాలి.
- issue: నిబంధన ప్రజలను సూచించే లింగసూచక వ్యక్తీకరణ
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలీయులు / ఇశ్రాయేలు సంతానం
  rationale: మూలం בְּנֵי יִשְׂרָאֵל అని అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులు’ అంటుంది. ప్రధాన పాఠ్యంలో ఆ రూపాన్ని నిలిపి, సహజమైన సమూహార్థ ప్రత్యామ్నాయాలను పాదసూచికలో తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి ఉపయోగించబడింది. ‘అణచివేశాడు’ సైనిక-రాజకీయ లొంగదీత భావాన్ని తెలియజేస్తుంది. మూలంలోని దైవిక కర్తృత్వం, ‘ఎదుట’ అనే సంబంధపదంలోని కొంత భావవిస్తృతి, మరియు ‘ఇశ్రాయేలు కుమారులు’ అనే మూల వ్యక్తీకరణ సంరక్షించబడ్డాయి.
