id: JDG.4.3
reference: Judges 4:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּצְעֲק֥וּ בְנֵֽי יִשְׂרָאֵ֖ל אֶל יְהוָ֑ה כִּ֠י תְּשַׁ֨ע מֵא֤וֹת רֶֽכֶב בַּרְזֶל֙ ל֔/וֹ וְ֠/הוּא לָחַ֞ץ אֶת בְּנֵ֧י יִשְׂרָאֵ֛ל בְּ/חָזְקָ֖ה עֶשְׂרִ֥ים שָׁנָֽה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/003.yaml
  text: Then the sons of Israel cried out to the LORD, because he had nine hundred iron chariots, and he oppressed the sons of Israel harshly for twenty years.
translation:
  language: te
  text: అప్పుడు ఇశ్రాయేలు ప్రజలు యెహోవాకు మొరపెట్టుకున్నారు, ఎందుకంటే అతనికి తొమ్మిది వందల ఇనుప రథాలు ఉన్నాయి; అతడు ఇశ్రాయేలు ప్రజలను ఇరవై సంవత్సరాలు కఠినంగా అణచివేశాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు ప్రజలు
  rationale: అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులు’ అయినా, ఈ సందర్భంలో మొత్తం ఇశ్రాయేలు సమాజాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘ప్రజలు’ సహజంగా, సమగ్రంగా అర్థాన్ని అందిస్తుంది.
- source_word: וַיִּצְעֲקוּ ... אֶל־יְהוָה
  choice: యెహోవాకు మొరపెట్టుకున్నారు
  rationale: צעק אל అనేది ఆపదలో సహాయం కోసం బిగ్గరగా మొరపెట్టుకోవడాన్ని సూచిస్తుంది; ‘మొరపెట్టుకున్నారు’ ఆ భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: רֶכֶב בַּרְזֶל
  choice: ఇనుప రథాలు
  rationale: హీబ్రూ పదబంధానికి సూటి అనువాదం; రథాలు పూర్తిగా ఇనుముతో చేసినవా లేక ఇనుప అమరికలుగలవా అన్నది మూలంలో స్పష్టంగా లేదు కాబట్టి వివరణను జోడించలేదు.
- source_word: לָחַץ
  choice: అణచివేశాడు
  rationale: ఈ క్రియ ఒత్తిడి చేయడం, పీడించడం, అణచివేయడం అనే భావాన్ని కలిగిస్తుంది; రాజకీయ-సైనిక పీడన సందర్భానికి ‘అణచివేశాడు’ సరిపోతుంది.
- source_word: בְחָזְקָה
  choice: క్రూరంగా
  rationale: బలప్రయోగంతో, కఠినంగా పీడించిన తీవ్రతను ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: దైవనామం יהוה యొక్క ప్రతిపాదన
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలోని ప్రత్యేక దైవనామాన్ని సాధారణ బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే రూపమైన ‘యెహోవా’తో ప్రతిపాదించాం.
- issue: ‘అతనికి’ మరియు ‘అతడు’ అనే సర్వనామాల సూచన
  choice: మూలంలోని పురుష ఏకవచన సర్వనామాలను అలాగే ఉంచడం
  alternative: యాబీను పేరును పునరుక్తి చేయడం
  rationale: మునుపటి వచనంలో యాబీను ప్రస్తావించబడినందున సూచన సందర్భం ద్వారా తెలుస్తుంది; ఈ వచనంలో లేని పేరును చేర్చకుండా మూలంలోని నిర్మాణం, స్వల్ప సూచనాత్మకత నిలుపబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనా సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్య నిర్మాణం. ‘అప్పుడు’ కథన ప్రవాహాన్ని, అర్ధవిరామం రెండు సంబంధిత కారణాత్మక వివరాల అనుసంధానాన్ని స్పష్టపరుస్తాయి.
