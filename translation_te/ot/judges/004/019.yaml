  text: וַ/יֹּ֧אמֶר אֵלֶ֛י/הָ הַשְׁקִי/נִי נָ֥א מְעַט מַ֖יִם כִּ֣י צָמֵ֑אתִי וַ/תִּפְתַּ֞ח אֶת נֹ֧אוד הֶ/חָלָ֛ב וַ/תַּשְׁקֵ֖/הוּ וַ/תְּכַסֵּֽ/הוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/019.yaml
  text: And he said to her[a], “Please give me a little water to drink, for I am thirsty.” So she opened the skin of milk and gave him a drink and covered him.
translation:
  language: te
  text: అతడు ఆమెతో, “దయచేసి నాకు తాగడానికి కొంచెం నీళ్లు ఇవ్వు; నాకు దాహంగా ఉంది” అన్నాడు. అప్పుడు ఆమె పాలున్న తోలుతిత్తిని[a] తెరిచి, అతనికి తాగడానికి ఇచ్చి, అతన్ని కప్పింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అంటే, పాలు ఉంచే జంతుచర్మంతో చేసిన సంచి వంటి పాత్ర. హీబ్రూ పదం ఆధునిక సీసాను సూచించదు.
    reason: cultural_note
lexical_decisions:
- source_word: הַשְׁקִי/נִי
  choice: నాకు తాగడానికి ... ఇవ్వు
  rationale: שׁקה అనే క్రియ యొక్క హిఫీల్ ఆజ్ఞారూపం, ప్రథమ పురుష ఏకవచన ప్రత్యయంతో, ‘నాకు తాగడానికి ఇవ్వు’ అనే భావాన్ని ఇస్తుంది. ఈ రూపం కారణార్థక భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: נָא
  choice: దయచేసి
  rationale: ఆజ్ఞను మర్యాదపూర్వక అభ్యర్థనగా మృదువుచేసే కణానికి ఆధునిక తెలుగులో సహజమైన సమానం.
- source_word: מְעַט מַיִם
  choice: కొంచెం నీళ్లు
  rationale: מְעַט స్వల్ప పరిమాణాన్ని సూచిస్తుంది. ‘కొంచెం నీళ్లు’ సాధారణ ఆధునిక తెలుగు వాడుకకు అనుగుణంగా ఉంది.
- source_word: כִּי צָמֵאתִי
  choice: నాకు దాహంగా ఉంది
  rationale: అభ్యర్థనకు కారణాన్ని తెలిపే వాక్యం. తెలుగు వాక్యప్రవాహంలో ‘నాకు దాహంగా ఉంది’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: נֹאוד הֶחָלָב
  choice: పాలున్న తోలుతిత్తి
  rationale: נֹאוד జంతుచర్మంతో చేసిన ద్రవపాత్రను సూచిస్తుంది; ఆధునిక సీసా కాదు. నిర్మాణ సంబంధం అది పాలు ఉన్న పాత్ర అని తెలియజేస్తుంది. ‘పాలున్న తోలుతిత్తి’ నీళ్లకు బదులుగా పాలు ఇచ్చిన కథన వ్యత్యాసాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: וַתַּשְׁקֵהוּ
  choice: అతనికి తాగడానికి ఇచ్చి
  rationale: ఇది కూడా שׁקה యొక్క కారణార్థక రూపమే. ముందరి వాక్యభాగంలో పాలు ఉన్న పాత్ర ప్రస్తావించబడినందున, ‘పాలు’ అని మళ్లీ చేర్చకుండానే అర్థం స్పష్టంగా ఉంటుంది; బలవంతంగా తాగించిందనే భావాన్నీ రుద్దదు.
- source_word: וַתְּכַסֵּהוּ
  choice: అతన్ని కప్పింది
  rationale: כסה ఇక్కడ కప్పడం లేదా మరుగుచేయడం అనే అర్థం ఇస్తుంది. దేనితో కప్పిందో హీబ్రూ చెప్పనందున తెలుగులోనూ దాన్ని నిర్దిష్టంగా చేర్చలేదు.
