translation_notes:
  register: సహజమైన, ఆధునిక ప్రామాణిక తెలుగును ఉపయోగించాం. కథనశైలి గౌరవప్రదంగా ఉండేలా చూసి, మూలంలోని సంక్షిప్తతను మరియు క్రియల వరుసను సాధ్యమైనంతవరకు నిలిపాం. పాదసూచిక గుర్తును అది వివరిస్తున్న ‘తోలుతిత్తి’ పదం దగ్గరే ఉంచాం.
