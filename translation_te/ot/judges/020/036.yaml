source:
  edition: WLC
  text: וַ/יִּרְא֥וּ בְנֵֽי בִנְיָמִ֖ן כִּ֣י נִגָּ֑פוּ וַ/יִּתְּנ֨וּ אִֽישׁ יִשְׂרָאֵ֤ל מָקוֹם֙ לְ/בִנְיָמִ֔ן כִּ֤י בָֽטְחוּ֙ אֶל הָ֣/אֹרֵ֔ב אֲשֶׁר שָׂ֖מוּ אֶל הַ/גִּבְעָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/036.yaml
  text: So the sons of Benjamin saw that they were defeated[a]. Now the men of Israel had given place to Benjamin[b], because they trusted in the ambush that they had set against Gibeah.
translation:
  language: te
  text: బెన్యామీనీయులు తాము ఓడిపోయామని గ్రహించారు. ఇశ్రాయేలు పురుషులు బెన్యామీనీయులకు ఉద్దేశపూర్వకంగా చోటు ఇచ్చారు[a]; ఎందుకంటే వారు గిబియాకు ఎదురుగా ఉంచిన మాటువేసిన దళంపై[b] నమ్మకం ఉంచారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా ‘బెన్యామీనీయులకు స్థలం ఇచ్చారు.’ ఇక్కడ ఈ హీబ్రూ నుడికారం వారిని బయటికి రప్పించేందుకు ఇశ్రాయేలీయులు వ్యూహాత్మకంగా వెనక్కి తగ్గారని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘మాటుపై.’ హీబ్రూ పదం మాటునే గానీ మాటువేసి ఉన్న దళాన్నే గానీ సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְאוּ
  choice: గ్రహించారు
  rationale: ראה యొక్క ప్రాథమిక అర్థం ‘చూశారు’; అయితే ఇక్కడ యుద్ధ ఫలితాన్ని గుర్తించడాన్ని సూచిస్తున్నందున ఆధునిక తెలుగులో ‘గ్రహించారు’ సహజంగా భావాన్ని తెలియజేస్తుంది.
- source_word: בְנֵי בִנְיָמִן
  choice: బెన్యామీనీయులు
  rationale: హీబ్రూ బంధుత్వ నుడికారాన్ని తెలుగులో అక్షరార్థంగా ‘బెన్యామీను కుమారులు’ అని అనడం అపార్థానికి దారితీయవచ్చు; గోత్ర సభ్యులను సూచించే ‘బెన్యామీనీయులు’ స్పష్టంగా, సహజంగా ఉంది.
- source_word: כִּי נִגָּפוּ
  choice: తాము ఓడిపోయామని
  rationale: నిఫాల్ రూపంలోని נגף యుద్ధ సందర్భంలో ఓటమిపాలవడాన్ని సూచిస్తుంది; ‘ఓడిపోయామని’ సహజమైన సైనిక సందర్భపు అనువాదం.
- source_word: וַיִּתְּנוּ ... מָקוֹם
  choice: కావాలనే చోటిచ్చారు
  rationale: అక్షరార్థంగా ‘స్థలం ఇచ్చారు’ అనే ఈ నుడికారం ఇక్కడ శత్రువును బయటికి రప్పించేందుకు వ్యూహాత్మకంగా వెనక్కి తగ్గడాన్ని సూచిస్తుంది. ‘కావాలనే’ అనేది సందర్భంలో ఉన్న ఉద్దేశపూర్వకతను స్పష్టం చేస్తుంది; ప్రత్యామ్నాయం పాదసూచికలో ఉంది.
- source_word: אִישׁ יִשְׂרָאֵל
  choice: ఇశ్రాయేలు మనుషులు
  rationale: ఏకవచన రూపం సమూహార్థకంగా వాడబడింది; మూలంలోని సామూహిక భావాన్ని ‘ఇశ్రాయేలు మనుషులు’ నిలుపుతుంది.
- source_word: כִּי בָטְחוּ
  choice: ఎందుకంటే ... నమ్మకం ఉంచారు
  rationale: בטח నమ్మడం లేదా ఆధారపడడాన్ని సూచిస్తుంది; కారణ సంబంధాన్ని తెలుగులో స్పష్టంగా ఉంచింది.
- source_word: אֶל הָאֹרֵב
  choice: మాటుదాడి దళంపై
  rationale: אֹרֵב మాటుదాడినే గానీ మాటువేసిన వారినే గానీ సూచించవచ్చు. ఈ సందర్భంలో వ్యక్తులు ఉంచబడినట్లు వచ్చే భావానికి ‘మాటుదాడి దళం’ సహజంగా ఉంది; అసలు ద్వంద్వార్థం పాదసూచికలో భద్రపరచబడింది.
- source_word: אֲשֶׁר שָׂמוּ
  choice: తాము ఉంచిన
  rationale: שׂים యొక్క సాధారణ ‘ఉంచు/నిలుపు’ భావాన్ని మాటుదాడి దళాన్ని నియమించిన సందర్భానికి తగిన రీతిలో అందిస్తుంది.
- source_word: אֶל הַגִּבְעָה
  choice: గిబియాకు ఎదురుగా
  rationale: אֶל ఇక్కడ గిబియా వైపు లేదా గిబియాకు వ్యతిరేకంగా ఉన్న వ్యూహాత్మక దిశను సూచించవచ్చు; ‘ఎదురుగా’ స్థానం, లక్ష్యం రెండింటినీ అతిగా నిర్ధారించకుండా నిలుపుతుంది.
