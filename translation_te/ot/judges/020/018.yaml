  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּקֻ֜מוּ וַ/יַּעֲל֣וּ בֵֽית אֵל֮ וַ/יִּשְׁאֲל֣וּ בֵ/אלֹהִים֒ וַ/יֹּֽאמְרוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל מִ֚י יַעֲלֶה לָּ֣/נוּ בַ/תְּחִלָּ֔ה לַ/מִּלְחָמָ֖ה עִם בְּנֵ֣י בִנְיָמִ֑ן וַ/יֹּ֥אמֶר יְהוָ֖ה יְהוּדָ֥ה בַ/תְּחִלָּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/018.yaml
  text: Then they arose and went up to Bethel[a], and they inquired of God. The sons of Israel said, “Who will go up first for us to the battle against the sons of Benjamin?” And Yahweh said[c][b], “Judah first.”
translation:
  language: te
  text: అప్పుడు వారు లేచి బేతేలుకు పైకి వెళ్లి దేవునిని సంప్రదించారు. ఇశ్రాయేలు కుమారులు, “బెన్యామీను కుమారులతో యుద్ధం చేయడానికి మా తరఫున మొదట ఎవరు వెళ్లాలి?” అని అడిగారు. యెహోవా, “యూదా మొదట,” అని చెప్పాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקֻמוּ וַיַּעֲלוּ
  choice: వారు లేచి ... వెళ్లి
  rationale: קום యొక్క కథన క్రమాన్ని ‘లేచి’ నిలుపుతూ, עלהను తెలుగులో సహజమైన ‘వెళ్లి’గా ఇచ్చాం; బేతేలుకు వెళ్లడంలో ఉన్న ఎక్కి వెళ్లే భావాన్ని సందర్భం బలవంతం చేయనందున అసహజమైన ‘పైకి వెళ్లి’ని నివారించాం.
- source_word: בֵית אֵל
  choice: బేతేలు
  rationale: స్థలనామాన్ని ఆధునిక ప్రామాణిక తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: וַיִּשְׁאֲלוּ בֵאלֹהִים
  choice: దేవుని దగ్గర విచారణ చేశారు
  rationale: שׁאל ב ఇక్కడ కేవలం ప్రశ్న అడగడం కాక దైవ మార్గదర్శకత్వాన్ని కోరడాన్ని సూచిస్తుంది; ‘విచారణ చేశారు’ ఆ భావాన్ని గౌరవప్రదంగా తెలియజేస్తుంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: మూలంలోని బంధుత్వ రూపాన్ని నిలిపి, సమూహంగా ఇశ్రాయేలు ప్రజలను సూచించే పదబంధాన్ని పారదర్శకంగా అనువదించాం.
- source_word: מִי יַעֲלֶה לָּנוּ בַתְּחִלָּה
  choice: మా తరఫున మొదట ఎవరు వెళ్లాలి?
  rationale: לנוను ‘మా తరఫున’గా, ప్రాధాన్య క్రమాన్ని తెలిపే בתחלהను ‘మొదట’గా ఇచ్చాం; ప్రశ్నలో ఆశించబడిన ఆదేశ భావానికి తెలుగులో ‘వెళ్లాలి’ సహజం.
- source_word: לַמִּלְחָמָה עִם בְּנֵי בִנְיָמִן
  choice: బెన్యామీను కుమారులతో యుద్ధం చేయడానికి
  rationale: עם యొక్క ప్రాథమిక ‘తో’ భావాన్ని నిలిపినా, ‘యుద్ధం చేయడానికి’ అనే సందర్భం వారిపై పోరాటమనే విరోధార్థాన్ని స్పష్టం చేస్తుంది.
- source_word: וַיֹּאמֶר יְהוָה
  choice: యెహోవా ... చెప్పాడు
  rationale: దైవనామం יהוהను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించదగిన ‘యెహోవా’ రూపంలో ఇచ్చాం.
- source_word: יְהוּדָה בַתְּחִלָּה
  choice: మొదట యూదా
  rationale: మూలంలోని సంక్షిప్త, క్రియలేని జవాబును విస్తరించకుండా తెలుగులో సహజంగా నిలిపాం.
theological_decisions:
- issue: దైవనామం יהוה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: మూలంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుగా మార్చకుండా పేరు రూపంలో ఉంచాం; ఆధునిక తెలుగు పాఠకులకు సుపరిచితమైన ‘యెహోవా’ను ఎంచుకున్నాం.
- issue: בְּנֵי יִשְׂרָאֵל అనే సమూహ సూచన
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలీయులు
  rationale: మూలంలోని పురుషలింగ బంధుత్వ వ్యక్తీకరణను నిలిపి, దాని సామూహిక సూచనను సిద్ధాంతపరంగా మార్చకుండా ఉంచాం.
- issue: עם యొక్క యుద్ధ సందర్భార్థం
  choice: బెన్యామీను కుమారులతో యుద్ధం చేయడానికి
  alternative: బెన్యామీను కుమారులకు వ్యతిరేకంగా యుద్ధం చేయడానికి
  rationale: עם అక్షరార్థంగా ‘తో’ అయినప్పటికీ ఇక్కడ యుద్ధ ప్రత్యర్థిత్వం ఉద్దేశం. తెలుగు వాక్యంలో ‘తో యుద్ధం’ రెండింటినీ సహజంగా మోస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని సంక్షిప్త దైవజవాబును అలాగే ఉంచి, అనవసర సిద్ధాంత విస్తరణను నివారించాం.
