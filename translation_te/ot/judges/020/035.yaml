revisions:
- from: యెహోవా ఇశ్రాయేలు ఎదుట బెన్యామీనీయులను ఓడించాడు[a]. ఆ రోజు ఇశ్రాయేలు కుమారులు బెన్యామీనీయులలో ఖడ్గం దూసేవారైన ఇరవై ఐదు వేల నూరుమందిని నాశనం చేశారు.
  to: యహ్వే ఇశ్రాయేలు ఎదుట బెన్యామీనును కొట్టి పడగొట్టాడు. ఆ రోజున ఇశ్రాయేలు కుమారులు బెన్యామీనుకు చెందిన ఇరవై ఐదు వేల నూటమంది పురుషులను నాశనం చేశారు; వీరందరూ ఖడ్గం దూయువారే.
  rationale: The revision restores the omitted ‘all these,’ corrects the sword idiom, retains both divine and human agency, and uses a direct Telugu equivalent for the POB’s rendering of the divine name. No footnote is necessary because the translation itself now gives a source-faithful rendering without unresolved textual ambiguity.
