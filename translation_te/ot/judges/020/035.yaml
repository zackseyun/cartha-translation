id: JDG.20.35
reference: Judges 20:35
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּגֹּ֨ף יְהוָ֥ה אֶֽת בִּנְיָמִן֮ לִ/פְנֵ֣י יִשְׂרָאֵל֒ וַ/יַּשְׁחִיתוּ֩ בְנֵ֨י יִשְׂרָאֵ֤ל בְּ/בִנְיָמִן֙ בַּ/יּ֣וֹם הַ/ה֔וּא עֶשְׂרִ֨ים וַ/חֲמִשָּׁ֥ה אֶ֛לֶף וּ/מֵאָ֖ה אִ֑ישׁ כָּל אֵ֖לֶּה שֹׁ֥לֵף חָֽרֶב׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/035.yaml
  text: And Yahweh struck Benjamin down before Israel[a], and the sons of Israel destroyed twenty-five thousand one hundred men of Benjamin that day[b], all these drawing the sword.
translation:
  language: te
  text: యహ్వే ఇశ్రాయేలు ఎదుట బెన్యామీనును కొట్టి పడగొట్టాడు. ఆ రోజున ఇశ్రాయేలు కుమారులు బెన్యామీనుకు చెందిన ఇరవై ఐదు వేల నూటమంది పురుషులను నాశనం చేశారు; వీరందరూ ఖడ్గం దూయువారే.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּגֹּף
  choice: ఓడించాడు
  rationale: యుద్ధ సందర్భంలో נָגַף కొట్టి పడగొట్టడం లేదా ఓడించడం అనే భావాన్ని ఇస్తుంది. తెలుగులో ‘ఓడించాడు’ సహజంగా ఉండి సైనిక పరాజయాన్ని స్పష్టంగా తెలియజేస్తుంది; మరింత అక్షరార్థమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో వ్యక్తిగత నామంగా ఉంచాం.
- source_word: לִפְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు ఎదుట
  rationale: హీబ్రూ ప్రయోగంలోని ‘ఎదుట/సమక్షంలో’ అనే దృశ్యాన్ని నిలుపుతూ, ఇశ్రాయేలుతో జరిగిన యుద్ధంలో అనే సందర్భార్థాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וַיַּשְׁחִיתוּ
  choice: నాశనం చేశారు
  rationale: హిఫిల్ రూపంలోని తీవ్రతను నిలుపుతుంది. ఇక్కడ అది యుద్ధంలో ప్రాణనాశనాన్ని సూచించినప్పటికీ, ‘చంపారు’ కంటే మూలపదానికి దగ్గరగా ఉంది.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: ‘ఇశ్రాయేలు కుమారులు’ అనే రూపం హీబ్రూ పదబంధాన్ని, ఈ సైనిక సందర్భంలోని పురుష యోధుల సూచనను నిలుపుతుంది.
- source_word: בְּבִנְיָמִן
  choice: బెన్యామీనీయులలో
  rationale: ఇక్కడ בְּ అనేది బెన్యామీను సమూహం నుండి లెక్కించబడిన హతులను సూచిస్తుంది. తెలుగులో ‘బెన్యామీనీయులలో’ సహజంగా ఆ పరిధిని తెలుపుతుంది.
- source_word: עֶשְׂרִים וַחֲמִשָּׁה אֶלֶף וּמֵאָה אִישׁ
  choice: ఇరవై ఐదు వేల నూరుమందిని
  rationale: హీబ్రూ సంఖ్యను నేరుగా, సహజమైన తెలుగు సంఖ్యా నిర్మాణంలో అందిస్తుంది.
- source_word: כָּל אֵלֶּה שֹׁלֵף חָרֶב
  choice: ఖడ్గం దూసేవారైన
  rationale: ‘ఖడ్గం దూయువారు’ అనే హీబ్రూ సైనిక నుడికారాన్ని సంక్షిప్తంగా నిలుపుతుంది; వీరంతా ఆయుధధారులైన యోధులని సందర్భం స్పష్టం చేస్తుంది.
theological_decisions:
- issue: యుద్ధ ఫలితంలో దైవిక మరియు మానవ కార్యసాధకత్వం
  choice: యెహోవా బెన్యామీనీయులను ఓడించాడని, ఇశ్రాయేలు కుమారులు వారిని నాశనం చేశారని రెండు చర్యలనూ వేర్వేరుగా స్పష్టంగా ఉంచాం.
  alternative: ఫలితాన్ని పూర్తిగా దైవిక కార్యంగా లేదా పూర్తిగా మానవ సైనిక విజయంగా మాత్రమే వివరించడం.
  rationale: హీబ్రూ వాక్యం దైవిక కార్యాన్నీ మానవ కార్యాన్నీ వరుసగా పేర్కొంటుంది; వాటిలో ఒకదానిని మరొకదానిలో కలపకుండా వచనంలోని వేదాంత ఉద్వేగాన్ని కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన యుద్ధవివరణ. ‘ఇశ్రాయేలు కుమారులు’ అనే మూలరూపాన్ని నిలిపి, సంఖ్యను తెలుగు వాక్యనిర్మాణానికి అనుగుణంగా ఇచ్చాం. ప్రధాన వాక్యంలోని [a] గుర్తు సంబంధిత పాదసూచికతో సరిపోతుంది.
