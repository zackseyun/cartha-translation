- from: అప్పుడు ఇశ్రాయేలు సైనికులు వెనుదిరిగి ఎదురుదాడి చేశారు[a]. బెన్యామీను సైనికులు తమ మీదికి విపత్తు వచ్చిందని గ్రహించి భయభ్రాంతులయ్యారు.
  to: అప్పుడు ఇశ్రాయేలు సైనికులు తిరిగారు[a]. తమ మీదికి విపత్తు వచ్చిందని చూసిన బెన్యామీను సైనికులు భయభ్రాంతులయ్యారు.
  rationale: The revision removes the interpretive addition “ఎదురుదాడి చేశారు” and renders הָפַךְ simply as “తిరిగారు.” It also replaces “గ్రహించి” with “చూసి” to follow the Hebrew verb more closely. The collective plural rendering and footnote are retained, with the note phrased specifically in terms of the military forces.
