source:
  edition: WLC
  text: וְ/אִ֤ישׁ יִשְׂרָאֵל֙ הָפַ֔ךְ וַ/יִּבָּהֵ֖ל אִ֣ישׁ בִּנְיָמִ֑ן כִּ֣י רָאָ֔ה כִּֽי נָגְעָ֥ה עָלָ֖י/ו הָ/רָעָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/041.yaml
  text: Then the men of Israel turned[a], and the men of Benjamin were terrified, because they saw that disaster had come upon them.
translation:
  language: te
  text: అప్పుడు ఇశ్రాయేలు సైనికులు తిరిగారు[a]. తమ మీదికి విపత్తు వచ్చిందని చూసిన బెన్యామీను సైనికులు భయభ్రాంతులయ్యారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పాఠంలో ‘ఇశ్రాయేలు మనిషి,’ ‘బెన్యామీను మనిషి,’ ‘అతడు చూశాడు,’ ‘అతని మీదికి’ అనే ఏకవచన రూపాలు ఉన్నాయి. అవి ఇక్కడ యుద్ధదళాలను సమష్టిగా సూచిస్తున్నందున తెలుగులో బహువచనంగా అనువదించబడ్డాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אִישׁ יִשְׂרָאֵל
  choice: అప్పుడు ఇశ్రాయేలు సైనికులు
  rationale: אִישׁ ఏకవచన రూపంలో ఉన్నప్పటికీ, ఇక్కడ ఇశ్రాయేలు యుద్ధదళాన్ని సమష్టిగా సూచిస్తుంది. ఆధునిక తెలుగులో ‘సైనికులు’ సందర్భాన్ని సహజంగా తెలియజేస్తుంది; וְ కథన క్రమాన్ని సూచించే ‘అప్పుడు’గా అనువదించబడింది.
- source_word: הָפַךְ
  choice: వెనుదిరిగి ఎదురుదాడి చేశారు
  rationale: యుద్ధ సందర్భంలో הפך కేవలం దిశ మార్చుకోవడం కాక, పారిపోతున్నట్లు నటించిన ఇశ్రాయేలీయులు తిరిగి బెన్యామీనీయులను ఎదుర్కొనడాన్ని సూచిస్తుంది. ‘వెనుదిరిగి ఎదురుదాడి చేశారు’ భావాన్ని స్పష్టంగా, సహజంగా అందిస్తుంది.
- source_word: וַ/יִּבָּהֵל
  choice: భయభ్రాంతులయ్యారు
  rationale: בהל అకస్మాత్తుగా కలిగే తీవ్ర భయం, దిగ్భ్రాంతిని సూచిస్తుంది. ‘భయభ్రాంతులయ్యారు’ గౌరవప్రదమైన ఆధునిక తెలుగులో ఆ తీవ్రతను నిలుపుతుంది.
- source_word: אִישׁ בִּנְיָמִן
  choice: బెన్యామీను సైనికులు
  rationale: ఏకవచన אִישׁ ఇక్కడ బెన్యామీను యుద్ధదళాన్ని సమష్టిగా సూచిస్తుంది; అందుచేత తెలుగులో బహువచనం సహజమైనది.
- source_word: כִּי רָאָה כִּי
  choice: …అని గ్రహించి
  rationale: మొదటి כִּי కారణాన్ని, రెండవది వారు చూసిన లేదా గ్రహించిన విషయాన్ని పరిచయం చేస్తుంది. తెలుగులో ‘అని గ్రహించి’ కారణ-ఫల సంబంధాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: נָגְעָה עָלָיו
  choice: తమ మీదికి … వచ్చింది
  rationale: నిజార్థంగా ‘అతనిని/దానిని తాకింది’ అనే నిర్మాణం ఇక్కడ విపత్తు వారి మీదికి వచ్చిందనే ప్రయోగార్థాన్ని కలిగి ఉంది. సమష్టి విషయానికి అనుగుణంగా ‘తమ మీదికి’ వాడబడింది.
- source_word: הָרָעָה
  choice: విపత్తు
  rationale: ఇక్కడ רָעָה నైతిక చెడును కాక యుద్ధంలో సంభవించిన వినాశకరమైన దుర్గతిని సూచిస్తుంది. ‘విపత్తు’ ఈ సందర్భార్థాన్ని స్పష్టంగా అందిస్తుంది.
