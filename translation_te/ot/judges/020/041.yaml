translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన కథన శైలి. యుద్ధ సందర్భాన్ని తెలియజేయడానికి సమష్టి ఏకవచనాలను సహజమైన బహువచనంగా, הפךను సందర్భానుసారంగా ‘వెనుదిరిగి ఎదురుదాడి చేశారు’గా అందించాం.
