  text: וְ/עַתָּ֡ה תְּנוּ֩ אֶת הָ/אֲנָשִׁ֨ים בְּנֵֽי בְלִיַּ֜עַל אֲשֶׁ֤ר בַּ/גִּבְעָה֙ וּ/נְמִיתֵ֔/ם וּ/נְבַעֲרָ֥ה רָעָ֖ה מִ/יִּשְׂרָאֵ֑ל וְ/לֹ֤א אָבוּ֙ בִּנְיָמִ֔ן לִ/שְׁמֹ֕עַ בְּ/ק֖וֹל אֲחֵי/הֶ֥ם בְּנֵֽי יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/013.yaml
  text: Hand over the men[a], the sons of worthlessness, who are in Gibeah, so that we may put them to death and purge evil from Israel. But Benjamin was not willing to listen to the voice of their brothers[c][b], the sons of Israel.
translation:
  language: te
  text: “ఇప్పుడు గిబియాలో ఉన్న ఆ మనుష్యులను—ఆ నీచులను[a]—అప్పగించండి. మేము వారిని చంపి, ఇశ్రాయేలులోనుండి చెడును తొలగిద్దాం.” అయితే బెన్యామీను గోత్రస్థులు తమ సహోదరులైన[b] ఇశ్రాయేలు కుమారుల మాట వినడానికి[c] ఇష్టపడలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ నుడికారం అక్షరార్థంగా ‘పనికిమాలినతనపు కుమారులు’; సంప్రదాయంగా ‘బెలియాలు కుమారులు.’
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘తమ బంధువులైన’; ఇక్కడ సహోదరత్వం ఇశ్రాయేలు గోత్రాల మధ్య బంధాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: హీబ్రూలో అక్షరార్థంగా ‘వారి స్వరం వినడానికి’; ఈ నుడికారం ‘వారి మాటకు లోబడడానికి’ లేదా ‘వారి మాటను లెక్కచేయడానికి’ అని కూడా అర్థమివ్వవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: కాబట్టి ఇప్పుడు
  rationale: וְעַתָּהలోని స్పష్టమైన కాలసూచకమైన ‘ఇప్పుడు’ను నిలుపుతూ, సందర్భంలోని నిర్ధారణాత్మక అనుసంధానాన్ని ‘కాబట్టి’ తెలియజేస్తుంది.
- source_word: תְּנוּ
  choice: అప్పగించండి
  rationale: సాధారణంగా ‘ఇవ్వండి’ అని కాకుండా, శిక్ష అమలు కోసం నిందితులను సభకు అప్పగించాలనే న్యాయపరమైన సందర్భాన్ని తెలియజేస్తుంది.
- source_word: בְּנֵי בְלִיַּעַל
  choice: నీచులు
  rationale: ఈ హీబ్రూ నుడికారం నైతికంగా దుర్మార్గులైన మనుష్యులను సూచిస్తుంది; ‘బెలియాలు కుమారులు’ అని వ్యక్తినామ భావాన్ని అనవసరంగా దిగుమతి చేయకుండా సహజమైన ఆధునిక తెలుగు వాడబడింది.
- source_word: וּנְמִיתֵם
  choice: మేము వారిని చంపి
  rationale: వారికి మరణం కలిగించాలనే ఉద్దేశాన్ని నేరుగా తెలియజేస్తుంది; సందర్భం దీనికి సామూహిక శిక్షాత్మక స్వరూపాన్ని ఇస్తుంది.
- source_word: וּנְבַעֲרָה רָעָה מִיִּשְׂרָאֵל
  choice: ఇశ్రాయేలులోనుండి చెడును తొలగిద్దాం
  rationale: בער అనే నిబంధనాత్మక-న్యాయపరమైన సూత్రప్రయోగం సమాజం మధ్యనుండి చెడును నిర్మూలించడాన్ని సూచిస్తుంది.
- source_word: בִּנְיָמִן
  choice: బెన్యామీను గోత్రస్థులు
  rationale: ఏకవచన గోత్రనామం సమూహాన్ని సూచిస్తున్నందున తెలుగులో సహజంగా బహువచన సమూహార్థంతో వ్యక్తం చేయబడింది.
- source_word: לִשְׁמֹעַ בְּקוֹל
  choice: మాట వినడానికి
  rationale: అక్షరార్థంలోని ‘స్వరాన్ని వినడం’ అనే రూపాన్ని తెలుగులో సహజమైన నుడికారంగా ఇస్తూ, ‘విధేయత చూపడం’ లేదా ‘లెక్కచేయడం’ అనే భావాలకు ఉన్న విస్తృతిని నిలుపుతుంది.
- source_word: אֲחֵיהֶם בְּנֵי יִשְׂרָאֵל
  choice: తమ సహోదరులైన ఇశ్రాయేలు కుమారులు
  rationale: గోత్రాల మధ్య బంధుత్వ భాషను, అలాగే ‘ఇశ్రాయేలు కుమారులు’ అనే అధికారిక సమూహ సూచనను నిలుపుతుంది.
theological_decisions:
- issue: בְּנֵי בְלִיַּעַל యొక్క అర్థం
  choice: నీచులు
  alternative: పనికిమాలినతనపు కుమారులు; బెలియాలు కుమారులు
  rationale: ఇక్కడ ఇది నైతిక దుష్టత్వాన్ని సూచించే హీబ్రూ నుడికారం. తరువాతి కాలంలో ‘బెలియాలు’ అనే వ్యక్తిగత దుష్టశక్తితో ఏర్పడిన అనుబంధాన్ని వచనంలోకి దిగుమతి చేయలేదు; అక్షరరూపాన్ని పాదటిప్పణిలో ఉంచారు.
- issue: సమూహ శిక్ష మరియు చెడు తొలగింపు
  choice: మేము వారిని చంపి, ఇశ్రాయేలులోనుండి చెడును తొలగిద్దాం
  alternative: మేము వారికి మరణశిక్ష విధించి, ఇశ్రాయేలును శుద్ధి చేద్దాం
  rationale: హీబ్రూ సహచోదక రూపాల ఉద్దేశపూర్వక బలాన్ని నిలుపుతూ, మూలంలో లేని అదనపు ఆచారపరమైన ‘శుద్ధి’ భావాన్ని చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కానీ సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే శైలి. హీబ్రూ వాక్యారంభంలోని וְעַתָּהను విస్మరించకుండా ‘కాబట్టి ఇప్పుడు’గా అనువదించాం. గోత్రనామమైన ‘బెన్యామీను’కు సమూహార్థం స్పష్టమయ్యేలా ‘గోత్రస్థులు’ చేర్చాం; ప్రధాన పాఠ్యంలో సహజత్వం కోసం బְּנֵי בְלִיַּעַלను ‘నీచులు’గా ఇచ్చి మూల నుడికారాన్ని పాదటిప్పణిలో భద్రపరిచాం.
