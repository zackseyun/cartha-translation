- from: ఈ ప్రజలందరిలో ఎంపికైన ఏడువందల మంది పురుషులు ఎడమచేతివారు[a]. వారిలో ప్రతి ఒక్కరూ వెంట్రుకను గురిపెట్టి వడిసెలతో రాయి విసిరినా గురి తప్పేవారు కాదు.
