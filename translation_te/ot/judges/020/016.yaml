  text: מִ/כֹּ֣ל הָ/עָ֣ם הַ/זֶּ֗ה שְׁבַ֤ע מֵאוֹת֙ אִ֣ישׁ בָּח֔וּר אִטֵּ֖ר יַד יְמִינ֑/וֹ כָּל זֶ֗ה קֹלֵ֧עַ בָּ/אֶ֛בֶן אֶל הַֽ/שַּׂעֲרָ֖ה וְ/לֹ֥א יַחֲטִֽא׀־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/016.yaml
  text: From all this people[a], seven hundred chosen men were left-handed; every one of these could sling a stone at a hair and not miss.
translation:
  language: te
  text: ఈ ప్రజలందరిలో ఎంపికైన ఏడువందల మంది పురుషులు ఎడమచేతివారు[a]. వారిలో ప్రతి ఒక్కరూ వెంట్రుకను గురిచేసి వడిసెలతో రాయి విసిరేవారు; గురి తప్పేవారు కాదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పదబంధం మరింత అక్షరార్థంగా ‘కుడిచేతి వాడుకలో పరిమితి ఉన్నవారు’ అని చెబుతుంది; ఈ యుద్ధ సందర్భంలో వారు ఎడమచేతితో పోరాడేవారని అది సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִכֹּל הָעָם הַזֶּה
  choice: ఈ ప్రజలందరిలో
  rationale: ఈ పదబంధం సమూహంలోనుండి కొందరిని సూచించే భాగార్థక నిర్మాణం. సందర్భం సైనికమైనదైనా, עָם అనే పదానికి ‘ప్రజలు’ అని ఇవ్వడం మూలంలోని విస్తృత పదప్రయోగాన్ని కాపాడుతుంది.
- source_word: שְׁבַע מֵאוֹת אִישׁ בָּחוּר
  choice: ఎంపికైన ఏడువందల మంది పురుషులు
  rationale: אִישׁ లెక్కింపులో వయోజన పురుషులను సూచిస్తుంది; בָּחוּר ఇక్కడ ఎంపిక చేయబడిన లేదా శ్రేష్ఠమైన వారనే భావాన్ని ఇస్తుంది.
- source_word: אִטֵּר יַד יְמִינוֹ
  choice: ఎడమచేతివారు[a]
  rationale: హీబ్రూ నుడికారం అక్షరార్థంగా కుడిచేతి నిరోధించబడిన స్థితిని చెబుతుంది. యుద్ధ సందర్భంలో సహజమైన తెలుగు భావం ‘ఎడమచేతివారు’; మూలరూపంలోని అస్పష్టతను పాదసూచికలో నిలిపాం.
- source_word: כָּל זֶה
  choice: వారిలో ప్రతి ఒక్కరూ
  rationale: ఇది ఆ ఏడువందల మందిలో ఒక్కొక్కరి నైపుణ్యాన్ని విడివిడిగా నొక్కిచెప్పే పంపిణీ భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: קֹלֵעַ בָּאֶבֶן
  choice: వడిసెలతో రాయి విసిరినా
  rationale: క్రియారూపం వారి సాధారణ నైపుణ్యాన్ని సూచిస్తుంది. ‘వడిసెలతో రాయి విసరడం’ ఆధునిక తెలుగులో ఆయుధం మరియు చర్య రెండింటినీ స్పష్టంగా తెలియజేస్తుంది.
- source_word: אֶל הַשַּׂעֲרָה
  choice: వెంట్రుకను గురిపెట్టి
  rationale: ఏకవచనంలోని ‘వెంట్రుక’ అత్యంత సూక్ష్మమైన లక్ష్యాన్ని సూచించే మూలచిత్రాన్ని కాపాడుతుంది.
- source_word: וְלֹא יַחֲטִא
  choice: గురి తప్పేవారు కాదు
  rationale: חטא ఇక్కడ నైతిక భావంలోని ‘పాపం చేయడం’ కాకుండా లక్ష్యాన్ని తప్పడం అనే స్పష్టమైన భావంలో ఉంది.
