translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా అనువదించబడింది. సైనిక సందర్భాన్ని స్పష్టం చేయడానికి ‘వడిసెల’ వాడబడింది; హీబ్రూ నుడికారంలోని అక్షరార్థం పాదసూచికలో భద్రపరచబడింది.
