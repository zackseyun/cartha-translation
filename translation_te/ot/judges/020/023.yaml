source:
  edition: WLC
  text: וַ/יַּעֲל֣וּ בְנֵֽי יִשְׂרָאֵ֗ל וַ/יִּבְכּ֣וּ לִ/פְנֵֽי יְהוָה֮ עַד הָ/עֶרֶב֒ וַ/יִּשְׁאֲל֤וּ בַֽ/יהוָה֙ לֵ/אמֹ֔ר הַ/אוֹסִ֗יף לָ/גֶ֨שֶׁת֙ לַ/מִּלְחָמָ֔ה עִם בְּנֵ֥י בִנְיָמִ֖ן אָחִ֑/י וַ/יֹּ֥אמֶר יְהוָ֖ה עֲל֥וּ אֵלָֽי/ו־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/023.yaml
  text: Then the sons of Israel went up and wept before Yahweh until evening[a], and they inquired of Yahweh, saying, “Shall I continue to go near for battle with the sons of Benjamin, my brother?” And Yahweh said, “Go up against him.”
translation:
  language: te
  text: అప్పుడు ఇశ్రాయేలు కుమారులు పైకి వెళ్లి, సాయంకాలం వరకు యాహ్వే సన్నిధిలో ఏడ్చారు. వారు యాహ్వేను అడిగి, “నా సహోదరుడైన బెన్యామీను కుమారులపై యుద్ధానికి నేను మళ్లీ ముందుకు సాగాలా?[a]” అని అన్నారు. యాహ్వే, “అతనిపైకి వెళ్లండి” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నేను ఇంకా ముందుకు సాగాలా?’ అని కూడా అనువదించవచ్చు. హీబ్రూ క్రియ దాడిని మళ్లీ చేయడాన్ని లేదా కొనసాగించడాన్ని సూచించవచ్చు. ‘బెన్యామీను కుమారులతో’ అనే హీబ్రూ పదబంధం అక్షరార్థంగా ‘బెన్యామీను కుమారులతో’ అయినప్పటికీ, ఈ యుద్ధ సందర్భంలో వారిపై చర్య తీసుకోవడం అనే భావాన్ని ఇస్తుంది.
    reason: హీబ్రూ הַאוֹסִיף యొక్క పునరావృత్తి/కొనసాగింపు సందిగ్ధతను, అలాగే עִם యొక్క అక్షరార్థమైన ‘తో’ మరియు యుద్ధసందర్భంలోని ప్రతికూల భావాన్ని తెలియజేయడం.
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: పైకి వెళ్లి
  rationale: עלה అనే క్రియలోని పైదిశ కదలికను నిలుపుతూ, గమ్యస్థానాన్ని అనవసరంగా నిర్దిష్టం చేయదు.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: హీబ్రూ కుటుంబసంబంధమైన సమూహ నుడికారాన్ని రూపపరంగా దగ్గరగా నిలుపుతుంది.
- source_word: לִפְנֵי יְהוָה
  choice: యాహ్వే సన్నిధిలో
  rationale: లִפְנֵי యొక్క ‘ఎదుట/సన్నిధిలో’ భావాన్ని సహజమైన తెలుగు మతపరమైన భాషలో వ్యక్తం చేస్తూ, దైవనామాన్ని యాహ్వేగా లిప్యంతరీకరిస్తుంది.
- source_word: וַיִּשְׁאֲלוּ בַיהוָה
  choice: యాహ్వేను విచారిస్తూ ... అడిగారు
  rationale: ఇది సాధారణ ప్రశ్నకంటే దేవుని వద్ద నిర్ణయం కోరే సంప్రదింపును సూచిస్తుంది; తెలుగు వాక్యంలో ‘విచారిస్తూ’ ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: הַאוֹסִיף לָגֶשֶׁת
  choice: నేను మళ్లీ సమీపించాలా
  rationale: יסף ఇక్కడ చర్యను మళ్లీ చేయడం లేదా కొనసాగించడం అనే భావాన్ని ఇవ్వగలదు; ప్రధాన పాఠంలో సందర్భానుకూలంగా ‘మళ్లీ’ ఎంచుకొని, נגשׁ లోని సమీపించే చిత్రాన్ని నిలిపాం.
- source_word: עִם בְּנֵי בִנְיָמִן
  choice: బెన్యామీను కుమారులతో యుద్ధానికి
  rationale: עִם యొక్క ప్రాథమిక ‘తో’ భావాన్ని ఉంచుతూనే, ‘యుద్ధానికి’ అనే పదబంధం శత్రుత్వ సందర్భాన్ని స్పష్టం చేస్తుంది.
- source_word: אָחִי
  choice: నా సహోదరుడైన
  rationale: హీబ్రూలోని ఏకవచన ప్రథమ పురుష సంబంధాన్ని నిలుపుతూ, బెన్యామీనుతో ఇశ్రాయేలుకు ఉన్న కుటుంబ బంధాన్ని వ్యక్తం చేస్తుంది.
- source_word: עֲלוּ אֵלָיו
  choice: అతనికి ఎదురుగా పైకి వెళ్లండి
  rationale: עלה లోని పైకి వెళ్లే భావాన్ని కాపాడుతూ, యుద్ధ సందర్భంలో אֶל సూచించే ప్రతికూల దిశను ‘ఎదురుగా’ స్పష్టం చేస్తుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో ఉన్న ఒడంబడిక నామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగు లిపిలో నేరుగా లిప్యంతరీకరించాం.
- issue: సమూహం పలికిన ప్రశ్నలో ఏకవచనం
  choice: నేను ... నా సహోదరుడైన
  alternative: మేము ... మా సహోదరులైన
  rationale: మాట్లాడుతున్నవారు బహువచన సమూహమైనప్పటికీ, హీబ్రూ ప్రశ్నలోని మొదటి పురుష ఏకవచన రూపాన్నీ אָחִי లోని ‘నా సహోదరుడు’ రూపాన్నీ ఉద్దేశపూర్వకంగా నిలిపాం; సమూహమైన ఇశ్రాయేలు ఒక వ్యక్తిగా మాట్లాడే ఉద్రిక్తతను సవరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలిని వాడాం. ‘సన్నిధిలో’, ‘విచారిస్తూ’ వంటి పదాలు సాధారణ పాఠకులకు అర్థమయ్యే బైబిలీయ గంభీరతను ఇస్తాయి. మూలంలోని ఏకవచన–బహువచన ఉద్రిక్తతను సరిచేయకుండా అలాగే ఉంచాం.
