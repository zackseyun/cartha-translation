source:
  edition: WLC
  text: וַ/יִּפְנ֞וּ וַ/יָּנֻ֤סוּ הַ/מִּדְבָּ֨רָ/ה֙ אֶל סֶ֣לַע הָֽ/רִמּ֔וֹן שֵׁ֥שׁ מֵא֖וֹת אִ֑ישׁ וַ/יֵּֽשְׁבוּ֙ בְּ/סֶ֣לַע רִמּ֔וֹן אַרְבָּעָ֖ה חֳדָשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/047.yaml
  text: But six hundred men turned and fled toward the wilderness[a], to the rock of Rimmon[b], and stayed at the rock of Rimmon four months.
translation:
  language: te
  text: అయితే ఆరువందల మంది పురుషులు వెనుదిరిగి అరణ్యం వైపు[a], రిమ్మోను బండ వద్దకు[b] పారిపోయారు. వారు రిమ్మోను బండ వద్ద నాలుగు నెలలు ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అరణ్యంలోకి.’ హెబ్రీలోని దిశాసూచక రూపం అరణ్య ప్రాంతం వైపుకు లేదా దానిలోనికి కదలికను సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: హెబ్రీలో ‘రిమ్మోను బండ’; ‘రిమ్మోను శిల’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְנוּ
  choice: వెనుదిరిగి
  rationale: ఈ క్రియ దిశ మార్చుకోవడాన్ని సూచిస్తుంది. యుద్ధం నుంచి తప్పించుకునే సందర్భంలో ‘వెనుదిరిగి’ అనేది సహజంగా, స్పష్టంగా ఉంది.
- source_word: וַיָּנֻסוּ
  choice: పారిపోయారు
  rationale: נוּס సాధారణంగా ప్రమాదం లేదా యుద్ధం నుంచి పారిపోవడాన్ని సూచిస్తుంది; ఇక్కడి సైనిక సందర్భంలోని ఆవశ్యకతను ఈ పదం నిలుపుతుంది.
- source_word: הַמִּדְבָּרָה
  choice: అరణ్యం వైపు
  rationale: దిశాసూచక ప్రత్యయం అరణ్య ప్రాంతం వైపుకు లేదా దానిలోనికి కదలికను సూచించగలదు. ‘వైపు’ అనే రూపం స్థలసంబంధమైన అస్పష్టతను నిలుపుతుంది.
- source_word: אֶל סֶלַע הָרִמּוֹן
  choice: రిమ్మోను బండ దగ్గరికి
  rationale: סֶלַע ఇక్కడ ఒక పేరుగల రాతి స్థలాన్ని సూచిస్తుంది. తెలుగు వాక్యప్రవాహంలో ‘బండ దగ్గరికి’ సహజంగా ఉండి, హెబ్రీ నిర్మాణాన్ని అర్థవంతంగా నిలుపుతుంది.
- source_word: שֵׁשׁ מֵאוֹת אִישׁ
  choice: ఆరువందల మంది
  rationale: సంఖ్య తరువాత אִישׁ ఇక్కడ యుద్ధంలో పాల్గొన్న పురుషులను లెక్కిస్తుంది. తెలుగులో సందర్భం స్పష్టంగా ఉన్నందున ‘మంది’ సహజమైన వ్యక్తివాచక రూపం.
- source_word: וַיֵּשְׁבוּ
  choice: ఉన్నారు
  rationale: ישׁב కూర్చోవడం, నివసించడం లేదా ఒకచోట ఉండడం అనే అర్థాలు కలిగి ఉంటుంది. నాలుగు నెలల తాత్కాలిక ఆశ్రయాన్ని ‘ఉన్నారు’ అతిశయించకుండా వ్యక్తం చేస్తుంది.
- source_word: בְּסֶלַע רִמּוֹן
  choice: రిమ్మోను బండ దగ్గర
  rationale: בְּ అనే ఉపసర్గ ఇక్కడ స్థలాన్ని సూచిస్తుంది. పేరుగల రాతి ఆశ్రయం వద్ద వారు ఉన్నారనే భావాన్ని ‘దగ్గర’ సహజంగా తెలియజేస్తుంది; ‘లోపల’ అని అనవసరంగా నిర్దిష్టం చేయదు.
- source_word: אַרְבָּעָה חֳדָשִׁים
  choice: నాలుగు నెలలు
  rationale: వారు అక్కడ ఉన్న కాలవ్యవధిని నేరుగా, సహజంగా తెలియజేసే అనువాదం.
- source_word: וַ
  choice: అయితే
  rationale: హెబ్రీ కథన వావ్‌ను ముందటి సంహారానికి విరుద్ధంగా మిగిలిన ఆరువందల మందిని పరిచయం చేసే సందర్భానుసారమైన సంబంధపదంగా అనువదించింది.
