translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘వెనుదిరిగి… పారిపోయారు’ అనే క్రమం మూలంలోని రెండు క్రియలను నిలుపుతుంది. స్థలసంబంధ ఉపసర్గలలోని నిజమైన అస్పష్టతను పాదటిప్పణుల్లో సంరక్షించింది.
