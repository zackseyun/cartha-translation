- from: అయితే ఆరువందల మంది వెనుదిరిగి అరణ్యం వైపు[a], రిమ్మోను బండ దగ్గరికి[b] పారిపోయారు. వారు రిమ్మోను బండ దగ్గర నాలుగు నెలలు ఉన్నారు.
  to: అయితే ఆరువందల మంది పురుషులు వెనుదిరిగి అరణ్యం వైపు[a], రిమ్మోను బండ వద్దకు[b] పారిపోయారు. వారు రిమ్మోను బండ వద్ద నాలుగు నెలలు ఉన్నారు.
