source:
  edition: WLC
  text: וַ/יִּֽתְיַצְּב֞וּ פִּנּ֣וֹת כָּל הָ/עָ֗ם כֹּ֚ל שִׁבְטֵ֣י יִשְׂרָאֵ֔ל בִּ/קְהַ֖ל עַ֣ם הָ/אֱלֹהִ֑ים אַרְבַּ֨ע מֵא֥וֹת אֶ֛לֶף אִ֥ישׁ רַגְלִ֖י שֹׁ֥לֵֽף חָֽרֶב־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/002.yaml
  text: And the chiefs of all the people[a], of all the tribes of Israel, took their stand in the assembly of the people of God—four hundred thousand foot soldiers drawing the sword.
translation:
  language: te
  text: ప్రజలందరి నాయకులు[a]—అంటే ఇశ్రాయేలు గోత్రాలన్నిటివారు—దేవుని ప్రజల సభలో స్థానం తీసుకొని నిలబడ్డారు. కత్తులు దూసిన కాల్బల సైనికులు నాలుగు లక్షల మంది ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థం ‘ప్రజలందరి మూలలు’; ఇది నాయకులను లేదా ప్రముఖులను సూచించే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְיַצְּבוּ
  choice: తమ స్థానాల్లో నిలబడ్డారు
  rationale: హిత్‌పయేల్ రూపం ఉద్దేశపూర్వకంగా స్థానం చేపట్టి నిలబడడాన్ని సూచిస్తుంది; తెలుగు వాక్యం సందర్భంలోని సమరసన్నద్ధతను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: פִּנּוֹת כָּל הָעָם
  choice: ప్రజలందరి నాయకులు
  rationale: פִּנּוֹת అక్షరార్థంగా ‘మూలలు’; ఇక్కడ సమాజాన్ని నిలబెట్టే ప్రముఖులు లేదా నాయకులు అనే రూపక ప్రయోగం.
- source_word: כֹּל שִׁבְטֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు గోత్రాలన్నిటి నాయకులు
  rationale: ముందున్న ‘ప్రజలందరి నాయకులు’ ఎవరనే అన్వయార్థాన్ని తెలుగులో స్పష్టంగా ఉంచేందుకు ‘నాయకులు’ను పునరుక్తం చేశాం.
- source_word: בִּקְהַל עַם הָאֱלֹהִים
  choice: దేవుని ప్రజల సమాజంలో
  rationale: קהל అనేది కూడివచ్చిన సభ లేదా సమాజాన్ని సూచిస్తుంది; ‘సమాజం’ ఆధునిక తెలుగులో సహజంగా ఉండి అనవసరమైన సంఘపరమైన భావాన్ని రుద్దదు.
- source_word: אַרְבַּע מֵאוֹת אֶלֶף אִישׁ רַגְלִי
  choice: కాల్బలం నాలుగు లక్షల మంది
  rationale: אִישׁ רַגְלִי అంటే కాలినడకన పోరాడే సైనికులు; ‘కాల్బలం’ సంక్షిప్తమైన, సహజమైన సైనిక సమానార్థకం.
- source_word: שֹׁלֵף חָרֶב
  choice: కత్తి దూసిన
  rationale: ఈ ఏకవచన కృదంతం పెద్ద సంఖ్యతో పంపిణీయ భావంలో వాడబడింది. ‘కత్తి దూసిన’ ఆయుధాన్ని ఒరనుంచి తీసి సిద్ధంగా ఉంచిన సజీవ సమరచిత్రాన్ని కాపాడుతుంది.
theological_decisions:
- issue: עַם הָאֱלֹהִים అనువాదం
  choice: దేవుని ప్రజలు
  alternative: దేవునికి చెందిన ప్రజలు
  rationale: హీబ్రూ నిర్మాణాన్ని నేరుగా, గంభీరంగా నిలుపుతూ ఇశ్రాయేలుకు దేవునితో ఉన్న సంబంధాన్ని తెలియజేస్తుంది; అంతకుమించిన సిద్ధాంతార్థాన్ని జోడించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కథన శైలి. హీబ్రూ రూపకానికి ప్రధాన పాఠ్యంలో సహజమైన అర్థాన్ని ఇచ్చి, అక్షరార్థాన్ని పాదసూచికలో భద్రపరిచాం. సంఖ్యను అంకెలలో కాక పదాలతో ఇచ్చాం.
