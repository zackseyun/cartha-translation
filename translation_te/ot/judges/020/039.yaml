source:
  edition: WLC
  text: וַ/יַּהֲפֹ֥ךְ אִֽישׁ יִשְׂרָאֵ֖ל בַּ/מִּלְחָמָ֑ה וּ/בִנְיָמִ֡ן הֵחֵל֩ לְ/הַכּ֨וֹת חֲלָלִ֤ים בְּ/אִֽישׁ יִשְׂרָאֵל֙ כִּ/שְׁלֹשִׁ֣ים אִ֔ישׁ כִּ֣י אָמְר֔וּ אַךְ֩ נִגּ֨וֹף נִגָּ֥ף הוּא֙ לְ/פָנֵ֔י/נוּ כַּ/מִּלְחָמָ֖ה הָ/רִאשֹׁנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/039.yaml
  text: Then the men of Israel turned in the battle[a], and Benjamin began to strike down the slain among the men of Israel, about thirty men, for they said, “Surely he is utterly defeated before us[b], as in the first battle.”
translation:
  language: te
  text: 'అప్పుడు ఇశ్రాయేలు సైనికులు యుద్ధంలో తిరిగి ఎదురుతిరిగారు. బెన్యామీనీయులు ఇశ్రాయేలు సైనికుల్లో దాదాపు ముప్పై మందిని హతమార్చడం మొదలుపెట్టారు[a]. ఎందుకంటే వారు ఇలా అన్నారు: “మొదటి యుద్ధంలోలాగే ఇశ్రాయేలు మన ఎదుట నిశ్చయంగా ఓడిపోయింది[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ వాక్యభాగం సంక్షిప్తమైన యుద్ధప్రయోగంలో అక్షరార్థంగా, “ఇశ్రాయేలు మనుషుల్లో హతులను కొట్టడం మొదలుపెట్టారు—దాదాపు ముప్పై మందిని” అని ఉంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో “అతడు నిశ్చయంగా ఓడిపోయాడు” అని ఏకవచనం ఉంది; ఇది ఇశ్రాయేలును సమష్టిగా సూచిస్తున్నట్లు కనిపిస్తుంది. “వారు నిశ్చయంగా ఓడిపోయారు” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּהֲפֹךְ אִישׁ יִשְׂרָאֵל בַּמִּלְחָמָה
  choice: ఇశ్రాయేలు సైనికులు యుద్ధంలో వెనక్కి తిరిగారు
  rationale: הפך అనే క్రియ యుద్ధంలో తిరగడాన్ని సూచిస్తుంది. దానిని ‘పారిపోయారు’ లేదా ‘ఎదురుదాడి చేశారు’ అని మరింత నిర్దిష్టంగా చేయకుండా, సందర్భానికి సహజమైన ‘వెనక్కి తిరిగారు’ అని అనువదించాం. אִישׁ יִשְׂרָאֵל ఇక్కడ సమూహార్థకం.
- source_word: וּבִנְיָמִן
  choice: బెన్యామీనీయులు
  rationale: గోత్రనామం యుద్ధంలో పాల్గొన్న ఆ గోత్రపు సైనికులకు ప్రతినిధిగా ఉంది; ఆధునిక తెలుగులో బహువచన రూపం భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: הֵחֵל לְהַכּוֹת חֲלָלִים בְּאִישׁ יִשְׂרָאֵל
  choice: ఇశ్రాయేలు సైనికుల్లో ... మందిని హతమార్చడం మొదలుపెట్టారు
  rationale: హీబ్రూ పదబంధం అక్షరార్థంగా ‘ఇశ్రాయేలు మనుషుల్లో హతులను కొట్టడం’ అనే సంక్షిప్త యుద్ధప్రయోగం. అప్పటికే చనిపోయినవారిని కొట్టారనే అపార్థం రాకుండా, యుద్ధంలో వారిని హతమార్చారనే భావాన్ని సహజంగా ఇచ్చాం; మూలంలోని నిర్మాణాన్ని పాదసూచికలో ఉంచాం.
- source_word: כִּשְׁלֹשִׁים אִישׁ
  choice: దాదాపు ముప్పై మందిని
  rationale: כְּ ఉపసర్గ సుమారు అనే భావాన్ని ఇస్తుంది; ‘దాదాపు’ ఆధునిక ప్రామాణిక తెలుగులో సహజం.
- source_word: אַךְ נִגּוֹף נִגָּף הוּא
  choice: ఇశ్రాయేలు ... నిశ్చయంగా ఓడిపోయింది
  rationale: క్రియ యొక్క సంపూర్ణ రూపంతో కూడిన అదే ధాతువు తీవ్ర నిశ్చయాన్ని తెలియజేస్తుంది. ‘నిశ్చయంగా’ ఆ ఉద్ఘాటనను అందిస్తుంది. ఏకవచనం ఇశ్రాయేలును సమష్టిగా సూచించేలా నిలుపబడింది.
- source_word: לְפָנֵינוּ
  choice: మన ఎదుట
  rationale: మూలంలోని స్థల/పోరాట సంబంధాన్ని నేరుగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: כַּמִּלְחָמָה הָרִאשֹׁנָה
  choice: మొదటి యుద్ధంలోలాగే
  rationale: మునుపటి పోరాటంతో చేసిన పోలికను స్పష్టంగా, సంక్షిప్తంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ఇశ్రాయేలును సూచించే ఏకవచనం
  choice: ‘ఇశ్రాయేలు ... ఓడిపోయింది’ అనే సమష్టి ఏకవచనాన్ని నిలుపడం
  alternative: ‘ఇశ్రాయేలీయులు ... ఓడిపోయారు’
  rationale: హీబ్రూలో הוּא మరియు ఏకవచన క్రియ ఇశ్రాయేలును ఒక సమష్టిగా సూచిస్తున్నాయి. తెలుగులో గోత్ర/జాతి పేరును ఏకవచన సమష్టిగా వాడటం సాధ్యమే; బహువచన ప్రత్యామ్నాయాన్ని పాదసూచికలో తెలిపాం. దీనిలో ప్రత్యేక సిద్ధాంత నిర్ణయం లేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే కథనశైలి. యుద్ధసందర్భంలో ‘మనుషులు’ కంటే ‘సైనికులు’ సహజంగా ఉండటంతో దాన్ని ఎంచుకున్నాం. మూలంలోని సంక్షిప్తత వల్ల కలిగే అర్థసందిగ్ధతలను ప్రధాన వాక్యాన్ని అసహజం చేయకుండా పాదసూచికల్లో భద్రపరిచాం.
