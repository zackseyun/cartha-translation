  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా అనువదించబడింది. మూలంలోని గోత్ర సంబంధమైన ‘కుమారులు’ అనే సమాంతర పదప్రయోగం నిలుపబడింది; యుద్ధ సందర్భం ఉన్నప్పటికీ క్రియలో దాడి భావాన్ని అనవసరంగా చేర్చలేదు.
