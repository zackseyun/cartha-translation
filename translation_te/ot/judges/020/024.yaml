source:
  edition: WLC
  text: וַ/יִּקְרְב֧וּ בְנֵֽי יִשְׂרָאֵ֛ל אֶל בְּנֵ֥י בִנְיָמִ֖ן בַּ/יּ֥וֹם הַ/שֵּׁנִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/024.yaml
  text: And the sons of Israel came near to the sons of Benjamin on the second day[a][b].
translation:
  language: te
  text: రెండవ రోజున ఇశ్రాయేలు కుమారులు బెన్యామీను కుమారుల దగ్గరికి వచ్చారు[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘సమీపించారు’; యుద్ధ సందర్భంలో ‘వారిమీదికి దండెత్తారు’ అని కూడా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో ‘ఇశ్రాయేలు కుమారులు,’ ‘బెన్యామీను కుమారులు’; ‘ఇశ్రాయేలీయులు,’ ‘బెన్యామీనీయులు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְבוּ
  choice: దగ్గరికి వచ్చారు
  rationale: కాల్ రూపంలోని קרב సాధారణంగా ‘దగ్గరికి రావడం, సమీపించడం’ అని అర్థం. యుద్ధ సందర్భంలో ‘వారిమీదికి దండెత్తారు’ అనే భావం సాధ్యమైనా, మూలపాఠం దాడిని స్పష్టంగా చెప్పకుండా సమీపించడాన్నే తెలియజేస్తుంది.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులు’; ఇక్కడ ఇది ఇశ్రాయేలు గోత్రాల యోధులను సమష్టిగా సూచిస్తుంది. మూలంలోని కుటుంబ-గోత్ర అభివ్యక్తిని, బెన్యామీను పదబంధంతో ఉన్న సమాంతరతను నిలుపుతుంది.
- source_word: אֶל
  choice: దగ్గరికి
  rationale: ఈ విభక్త్యర్థకం సాధారణంగా ‘వైపు, దగ్గరికి’ అని సూచిస్తుంది. యుద్ధ సందర్భం శత్రుత్వాన్ని తెలియజేసినా, ‘మీదికి’ అని అనువదించి మూలంలో స్పష్టంగా లేని దాడి భావాన్ని బలపరచలేదు.
- source_word: בְנֵי בִנְיָמִן
  choice: బెన్యామీను కుమారులు
  rationale: అక్షరార్థంగా ‘బెన్యామీను కుమారులు.’ మూలంలోని గోత్ర-కుటుంబ సంజ్ఞను, ‘ఇశ్రాయేలు కుమారులు’తో ఉన్న సమాంతర నిర్మాణాన్ని నిలుపుతుంది.
- source_word: בַּיּוֹם הַשֵּׁנִי
  choice: రెండవ రోజున
  rationale: మూలంలోని క్రమసంఖ్యను నేరుగా ప్రతిబింబిస్తుంది; కథనంలో ‘మరుసటి రోజున’ సహజమైన ప్రత్యామ్నాయమైనా, హీబ్రూ స్పష్టంగా ‘రెండవ రోజు’ అంటుంది.
