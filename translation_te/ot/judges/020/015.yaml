translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయినా గంభీరమైన బైబిలు శైలి. ‘బెన్యామీను కుమారులు’ ద్వారా మూలంలోని గోత్ర-కుటుంబ నుడికారాన్ని నిలిపి, ‘సైనిక లెక్కలో నమోదయ్యారు’ ద్వారా פקד యొక్క సైనిక సందర్భాన్ని స్పష్టం చేశాం. ప్రతి పాదసూచిక సూచిక ప్రధాన పాఠ్యంలో ఉంచబడింది.
