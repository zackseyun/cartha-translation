- from: 'ఆ రోజున పట్టణాల నుండి బెన్యామీను కుమారులు సైనిక లెక్కలో నమోదయ్యారు: కత్తి దూసే ఇరవై ఆరు వేల మంది[a]. వీరితోపాటు గిబియా నివాసుల్లో లెక్కించబడిన ఎంపికైన ఏడు వందల మంది[b] ఉన్నారు.'
  to: ఆ రోజున పట్టణాల నుండి బెన్యామీను కుమారులు కత్తి దూసే ఇరవై ఆరు వేల మంది సైనిక సేవ కోసం లెక్కించబడ్డారు[a]. వీరికి అదనంగా, గిబియా నివాసులలో నుండి ఎంపికైన ఏడు వందల మందిని విడిగా లెక్కించారు[b].
