  text: וַ/יִּתְפָּֽקְדוּ֩ בְנֵ֨י בִנְיָמִ֜ן בַּ/יּ֤וֹם הַ/הוּא֙ מֵ/הֶ֣/עָרִ֔ים עֶשְׂרִ֨ים וְ/שִׁשָּׁ֥ה אֶ֛לֶף אִ֖ישׁ שֹׁ֣לֵֽף חָ֑רֶב לְ֠/בַד מִ/יֹּשְׁבֵ֤י הַ/גִּבְעָה֙ הִתְפָּ֣קְד֔וּ שְׁבַ֥ע מֵא֖וֹת אִ֥ישׁ בָּחֽוּר׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/015.yaml
  text: 'And on that day the sons of Benjamin were mustered from the cities: twenty-six thousand men drawing the sword[a], besides the inhabitants of Gibeah[b], who were mustered as seven hundred chosen men.'
translation:
  language: te
  text: ఆ రోజున పట్టణాల నుండి బెన్యామీను కుమారులు కత్తి దూసే ఇరవై ఆరు వేల మంది సైనిక సేవ కోసం లెక్కించబడ్డారు[a]. వీరికి అదనంగా, గిబియా నివాసులలో నుండి ఎంపికైన ఏడు వందల మందిని విడిగా లెక్కించారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కత్తి ధరించిన ఇరవై ఆరు వేల మంది.” ఇక్కడి హీబ్రూ క్రియ యుద్ధసేవ కోసం లెక్కించి నమోదు చేయడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ఎంపిక చేసిన ఏడు వందల మంది”; హీబ్రూ పదం “యువకులు” అని కూడా అర్థం ఇవ్వగలదు, అయితే ఇక్కడ ఎంపికైన యోధులను సూచించే అవకాశం ఎక్కువ.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְפָּקְדוּ / הִתְפָּקְדוּ
  choice: సైనిక లెక్కలో నమోదయ్యారు / లెక్కించబడిన
  rationale: హిత్పయేల్ రూపం ఇక్కడ కేవలం కూడుకోవడాన్ని కాక, యుద్ధసేవ కోసం లెక్కించి నమోదు చేయడాన్ని సూచిస్తుంది. సహజమైన తెలుగులో సైనిక సందర్భాన్ని స్పష్టం చేస్తూ, రెండు ప్రయోగాల్లోనూ ‘లెక్క’ భావాన్ని నిలిపాం.
- source_word: בְנֵי בִנְיָמִן
  choice: బెన్యామీను కుమారులు
  rationale: హీబ్రూ గోత్ర-కుటుంబ నుడికారాన్ని సమీపంగా నిలుపుతుంది; ‘బెన్యామీనీయులు’ కూడా సాధ్యమే అయినా మూలంలోని వంశ సంబంధిత రూపాన్ని ఇది కాపాడుతుంది.
- source_word: בַּיּוֹם הַהוּא
  choice: ఆ రోజున
  rationale: కాల సూచనలోని నిర్దేశక బలాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: מֵהֶעָרִים
  choice: పట్టణాల నుండి
  rationale: సైనికులు లెక్కించబడిన ప్రాంతీయ మూలాన్ని నేరుగా తెలియజేస్తుంది; మూలంలో లేని ‘వారి’ అనే పదాన్ని చేర్చలేదు.
- source_word: עֶשְׂרִים וְשִׁשָּׁה אֶלֶף אִישׁ
  choice: ఇరవై ఆరు వేల మంది
  rationale: సంఖ్యను, אִישׁ యొక్క సాధారణ ‘మంది’ భావాన్ని నేరుగా అందిస్తుంది; తరువాతి కత్తి నుడికారం సైనిక భావాన్ని ఇప్పటికే తెలియజేస్తుంది.
- source_word: שֹׁלֵף חָרֶב
  choice: కత్తి దూసే
  rationale: ఆయుధధారులైన యోధులను సూచించే హీబ్రూ నుడికారంలోని స్పష్టమైన కత్తి చిత్రణను సంక్షిప్తంగా కాపాడుతుంది.
- source_word: לְבַד
  choice: వీరితోపాటు
  rationale: గిబియా దళం ముందటి సంఖ్యకు అదనంగా, విడిగా లెక్కించబడిందని స్పష్టం చేస్తుంది.
- source_word: מִיֹּשְׁבֵי הַגִּבְעָה
  choice: గిబియా నివాసుల్లో
  rationale: పట్టణ నివాసులను సూచించే భాగార్థక నిర్మాణాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: שְׁבַע מֵאוֹת אִישׁ
  choice: ఏడు వందల మంది
  rationale: సంఖ్యను నేరుగా, సహజంగా అనువదిస్తుంది.
- source_word: בָּחוּר
  choice: ఎంపికైన
  rationale: ఈ సైనిక సందర్భంలో పదం యువకులు అనే వయస్సు భావంతోపాటు ఎంపిక చేసిన శ్రేష్ఠ యోధులను సూచించగలదు; తరువాతి వచన సందర్భానికి అనుగుణంగా ‘ఎంపికైన’ను ప్రధాన పాఠ్యంలో ఉంచి ప్రత్యామ్నాయాన్ని పాదసూచికలో తెలిపాం.
