  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַֽ/יִּשְׁלְח֞וּ שִׁבְטֵ֤י יִשְׂרָאֵל֙ אֲנָשִׁ֔ים בְּ/כָל שִׁבְטֵ֥י בִנְיָמִ֖ן לֵ/אמֹ֑ר מָ֚ה הָ/רָעָ֣ה הַ/זֹּ֔את אֲשֶׁ֥ר נִהְיְתָ֖ה בָּ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/012.yaml
  text: So the tribes of Israel sent men through all the tribes of Benjamin[a], saying[b], “What is this evil that has happened among you?”
translation:
  language: te
  text: అప్పుడు ఇశ్రాయేలు గోత్రాలు బెన్యామీనుకు చెందిన అన్ని వంశాలకు[a] మనుషులను పంపి, “మీ మధ్య జరిగిన ఈ దుష్టకార్యం[b] ఏమిటి?” అని అడిగాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “బెన్యామీనుకు చెందిన అన్ని వంశాల మధ్యకు.” హీబ్రూ ఉపసర్గను వితరణ భావంలో కూడా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ఈ చెడు” లేదా “ఈ అక్రమం.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלְחוּ
  choice: పంపి
  rationale: שלח క్రియ యొక్క సాధారణ అర్థమైన ‘పంపడం’ను సహజమైన తెలుగు కథనశైలిలో తెలిపింది.
- source_word: שִׁבְטֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు గోత్రాలవారు
  rationale: బహువచన సమూహాలు కార్యనిర్వాహకులుగా ఉన్నాయని తెలుగులో స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אֲנָשִׁים
  choice: మనుషులను
  rationale: వారు దూతలుగా పనిచేసినా మూలపాఠం వారిని ప్రత్యేకంగా దూతలు అని పిలవదు; అందువల్ల సాధారణ పదాన్నే నిలిపింది.
- source_word: בְּכָל שִׁבְטֵי בִנְיָמִן
  choice: బెన్యామీను గోత్రంలోని అన్ని వంశాలవారి దగ్గరికి
  rationale: బెన్యామీను స్వయంగా ఒక గోత్రం కావడంతో, ఇక్కడి బహువచన שִׁבְטֵי దాని అంతర్గత వంశ విభాగాలను సూచిస్తున్నదని సహజ తెలుగులో తెలిపింది; ב ఉపసర్గలోని గమ్య/వితరణ భావాన్ని పాదటిప్పణిలో సంరక్షించింది.
- source_word: לֵאמֹר
  choice: అని అడిగారు
  rationale: ప్రత్యక్ష ప్రశ్నను పరిచయం చేసే హీబ్రూ సూత్రప్రయోగాన్ని పదేపదే ‘చెబుతూ’ అని కాకుండా సహజ తెలుగు సంభాషణగా ఇచ్చింది.
- source_word: מָה
  choice: ఏమిటి
  rationale: కారణాన్ని అడిగే ‘ఎందుకు’ కంటే, జరిగిన కార్యం ఏమిటో ప్రశ్నించే మూలార్థాన్ని నిలిపింది.
- source_word: הָרָעָה הַזֹּאת
  choice: ఈ దుష్టకార్యం
  rationale: רָעָה యొక్క నైతిక చెడును, ఇక్కడ ఒక జరిగిన కార్యాన్ని సూచించే సందర్భార్థాన్ని రెండింటినీ స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: אֲשֶׁר נִהְיְתָה
  choice: జరిగిన
  rationale: היה నిఫ్అల్ రూపంలోని ‘సంభవించడం/జరగడం’ భావానికి సంక్షిప్తమైన సహజ తెలుగు సమానం.
- source_word: בָּכֶם
  choice: మీ మధ్య
  rationale: ఈ దుష్టకార్యం బెన్యామీనీయుల సమాజంలో జరిగిందనే సామూహిక స్థానభావాన్ని తెలియజేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథనశైలిని ఉపయోగించాం. ‘గోత్రాలవారు,’ ‘వంశాలవారు’ అనే రూపాలు సాధారణ పాఠకులకు ఇశ్రాయేలు గోత్రాలు మరియు బెన్యామీనులోని అంతర్గత విభాగాల మధ్య తేడాను సహజంగా తెలియజేస్తాయి. అన్ని పాదటిప్పణి సూచికలు ప్రధాన పాఠ్యంలో ఉన్నాయి.
