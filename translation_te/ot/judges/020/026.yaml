id: JDG.20.26
reference: Judges 20:26
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּעֲל֣וּ כָל בְּנֵי֩ יִשְׂרָאֵ֨ל וְ/כָל הָ/עָ֜ם וַ/יָּבֹ֣אוּ בֵֽית אֵ֗ל וַ/יִּבְכּוּ֙ וַ/יֵּ֤שְׁבוּ שָׁם֙ לִ/פְנֵ֣י יְהוָ֔ה וַ/יָּצ֥וּמוּ בַ/יּוֹם הַ/ה֖וּא עַד הָ/עָ֑רֶב וַֽ/יַּעֲל֛וּ עֹל֥וֹת וּ/שְׁלָמִ֖ים לִ/פְנֵ֥י יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/026.yaml
  text: Then all the sons of Israel and all the people went up and came to Bethel[a], and they wept and sat there before Yahweh and fasted that day until evening[b]. Then they offered up burnt offerings and peace offerings before Yahweh.
translation:
  language: te
  text: అప్పుడు ఇశ్రాయేలు కుమారులందరూ[a], ప్రజలందరూ పైకి వెళ్లి బేతేలుకు వచ్చారు. వారు ఏడ్చారు; అక్కడ యాహ్వే సన్నిధిలో కూర్చున్నారు. ఆ రోజు సాయంత్రం వరకు ఉపవాసం ఉండి, యాహ్వే సన్నిధిలో దహనబలులను, సమాధాన బలులను[b] అర్పించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఇశ్రాయేలీయులందరూ.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘సహవాస బలులను.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: పైకి వెళ్లి
  rationale: עלה అనే క్రియలోని ఎత్తైన ప్రదేశానికి వెళ్లే దిశాభావాన్ని నిలుపుతూ, ప్రయాణ వర్ణనలో సహజమైన తెలుగు రూపాన్ని వాడింది.
- source_word: כָל בְּנֵי יִשְׂרָאֵל וְכָל הָעָם
  choice: ఇశ్రాయేలు కుమారులందరూ, ప్రజలందరూ
  rationale: బני ישראל అనే కుటుంబ-జాతీయ వ్యక్తీకరణను రూపపరంగా నిలిపి, దాని వెంట ఉన్న ‘ప్రజలందరూ’ అనే బలపరిచే పదబంధాన్ని తొలగించలేదు.
- source_word: בֵית אֵל
  choice: బేతేలు
  rationale: స్థల నామాన్ని ‘దేవుని ఇల్లు’ అని అనువదించకుండా, తెలుగులో ప్రాచుర్యంలో ఉన్న లిప్యంతరీకరణగా ఇచ్చింది.
- source_word: וַיִּבְכּוּ
  choice: వారు ఏడుస్తూ
  rationale: యుద్ధపరాజయం, ఉపవాసం, ఆరాధనల సందర్భంలోని దుఃఖాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וַיֵּשְׁבוּ שָׁם לִפְנֵי יְהוָה
  choice: అక్కడ యాహ్వే సన్నిధిలో కూర్చున్నారు
  rationale: ישב లోని స్పష్టమైన శారీరక భంగిమను ‘ఉన్నారు’ అని సాధారణీకరించకుండా నిలిపింది; לפני יהוה ను సహజమైన ఆరాధనా భాషలో ‘యాహ్వే సన్నిధిలో’గా ఇచ్చింది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో లిప్యంతరీకరించింది.
- source_word: וַיָּצוּמוּ
  choice: ఉపవాసం ఉండి
  rationale: ఆహారాన్ని మానుకొని దుఃఖం లేదా భక్తిని వ్యక్తం చేయడాన్ని సూచించే క్రియకు ఆధునిక తెలుగులో సహజమైన రూపం.
- source_word: בַיּוֹם הַהוּא עַד הָעָרֶב
  choice: ఆ రోజు సాయంత్రం వరకు
  rationale: హీబ్రూ వాక్యంలోని కాలపరిమితిని సంక్షిప్తంగా, స్పష్టంగా నిలిపింది.
- source_word: וַיַּעֲלוּ עֹלוֹת
  choice: దహనబలులను ... అర్పించారు
  rationale: బలుల సందర్భంలో హిఫిల్ రూపంలోని עלה కు ‘అర్పించు’ అనే యాజ్ఞిక అర్థాన్ని ఇచ్చింది; עֹלוֹת ను పూర్తిగా దహించబడే బలులుగా వ్యక్తం చేసింది.
- source_word: שְׁלָמִים
  choice: సమాధాన బలులు
  rationale: שלמים కు విస్తృతంగా తెలిసిన, మూలపదంలోని సంపూర్ణత/శాంతి సంబంధాన్ని నిలిపే అనువాదం; ‘సహవాస బలులు’ దాని భాగస్వామ్య భోజనాంశాన్ని మరింత స్పష్టపరిచే ప్రత్యామ్నాయం.
theological_decisions:
- issue: యְהוָה అనే నిబంధన నామాన్ని ఎలా ఇవ్వాలి
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమే ఉంది. అందువల్ల దానిని బిరుదుగా మార్చకుండా లిప్యంతరీకరించడం పాఠ్యభేదాన్ని, నామ స్వభావాన్ని కాపాడుతుంది.
- issue: בְּנֵי יִשְׂרָאֵל అనే పురుషలింగ జాతీయ పదబంధం
  choice: ఇశ్రాయేలు కుమారులందరూ
  alternative: ఇశ్రాయేలీయులందరూ
  rationale: ప్రధాన పాఠం హీబ్రూ కుటుంబ-వంశ రూపకాన్ని నిలుపుతుంది; సహజమైన సమూహనామాన్ని పాదటిప్పణిలో ప్రత్యామ్నాయంగా ఇచ్చింది.
- issue: שְׁלָמִים బలుల స్వభావం
  choice: సమాధాన బలులు
  alternative: సహవాస బలులు
  rationale: మూలపదం శాంతి, సంపూర్ణత, క్షేమం మరియు బలిలో భాగస్వామ్యం వంటి పరస్పర సంబంధిత భావాలను మోస్తుంది. ప్రధాన పదం సంప్రదాయ అర్థాన్ని నిలుపుతుండగా, ప్రత్యామ్నాయం సహవాస కోణాన్ని చూపుతుంది; ఏకైక సిద్ధాంతార్థాన్ని బలవంతంగా నిర్ణయించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథనశైలి వాడబడింది. ‘యాహ్వే సన్నిధిలో,’ ‘దహనబలులు,’ ‘సమాధాన బలులు’ వంటి ఆరాధనా పదాలు సాధారణ పాఠకులకు అర్థమయ్యేలా ఉండగా, మూలంలోని యాజ్ఞిక ప్రత్యేకతను నిలుపుతున్నాయి. సంయుక్త క్రియల క్రమం తెలుగు ప్రవాహానికి అనుగుణంగా అమర్చబడింది; మూలంలోని ఏడుపు, కూర్చోవడం, ఉపవాసం, బలులర్పణ అనే చర్యలన్నీ సంరక్షించబడ్డాయి.
