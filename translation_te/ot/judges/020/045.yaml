- from: 'అప్పుడు వారు దిశ మార్చుకొని అరణ్యంలో ఉన్న రిమ్మోను బండ వైపు పారిపోయారు. దారుల మీద వారిలో ఐదువేల మందిని హతమార్చారు[a]. గిదోము వరకు వారిని తరుముకొని వెళ్లి[b], వారిలో రెండువేల మందిని హతమార్చారు.


