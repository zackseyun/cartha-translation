translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్య నిర్మాణం వాడబడింది. మొదటి రెండు క్రియల కర్త పారిపోతున్న బెన్యామీనీయులు; తరువాతి హత్య, వెంబడింపు క్రియల కర్త సందర్భం ద్వారా తెలిసే ఇశ్రాయేలు పక్షం. మూలంలో లేని కర్త నామాన్ని ప్రధాన పాఠంలో చేర్చకుండా తెలుగు క్రియారూపాలతో ఈ మార్పును నిర్వహించాం. మూలంలోని సమూహార్థక ఏకవచనాన్ని ప్రధాన పాఠంలో సహజమైన బహువచనంగా ఇచ్చి పాదసూచికలో వివరించాం.
