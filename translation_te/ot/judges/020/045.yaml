  to: 'అప్పుడు వారు దిశ మార్చుకొని అరణ్యం వైపునకు, రిమ్మోను బండ దగ్గరకు పారిపోయారు. వారిలో ఐదువేల మందిని దారుల్లో హతమార్చారు[a]. గిదోము వరకు వారిని తరుముకొని వెళ్లి[b], వారిలో రెండువేల మందిని హతమార్చారు.


