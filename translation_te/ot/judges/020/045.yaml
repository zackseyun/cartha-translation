base_translation:
  language: en
  yaml_path: translation/ot/judges/020/045.yaml
  text: Then they turned and fled toward the wilderness[a], to the rock of Rimmon. And they cut down five thousand men of them on the highways, and pursued them as far as Gidom[b], and struck down two thousand men of them.
translation:
  language: te
  text: 'అప్పుడు వారు దిశ మార్చుకొని అరణ్యం వైపునకు, రిమ్మోను బండ దగ్గరకు పారిపోయారు. వారిలో ఐదువేల మందిని దారుల్లో హతమార్చారు[a]. గిదోము వరకు వారిని తరుముకొని వెళ్లి[b], వారిలో రెండువేల మందిని హతమార్చారు.


    [a] హెబ్రీలో అక్షరార్థంగా, “అతన్ని ఏరుకున్నారు.” పంట కోత తర్వాత మిగిలినదాన్ని ఏరుకునే చిత్రాన్ని ఉపయోగించిన ఈ మాట, ఇక్కడ పారిపోతున్న వారిని హతమార్చడాన్ని సూచిస్తుంది.


    [b] హెబ్రీలో “అతని వెనుక,” “అతని నుండి” అనే ఏకవచన ప్రత్యయాలు ఉన్నాయి. అవి పారిపోతున్న బెన్యామీనీయులను ఒక సమూహంగా సూచిస్తున్నాయి.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీలో అక్షరార్థంగా, “అతన్ని ఏరుకున్నారు.” పంట కోత తర్వాత మిగిలినదాన్ని ఏరుకునే చిత్రాన్ని ఉపయోగించిన ఈ మాట, ఇక్కడ పారిపోతున్న వారిని హతమార్చడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: హెబ్రీలో “అతని వెనుక,” “అతని నుండి” అనే ఏకవచన ప్రత్యయాలు ఉన్నాయి. అవి పారిపోతున్న బెన్యామీనీయులను ఒక సమూహంగా సూచిస్తున్నాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְנוּ
  choice: దిశ మార్చుకొని
  rationale: פנה ఇక్కడ పారిపోతున్నవారు తమ ప్రయాణ దిశను మార్చుకున్నారని సూచిస్తుంది. ‘వెనుదిరిగి’ అనడం వారు వచ్చిన దారిలోనే తిరిగారని అవసరానికి మించి నిర్దిష్టం చేస్తుంది.
- source_word: וַיָּנֻסוּ הַמִּדְבָּרָה
  choice: అరణ్యం వైపు పారిపోయారు
  rationale: נוס సైనిక ఓటమిలో పారిపోవడాన్ని సూచిస్తుంది; దిశాసూచక అంత్యం అరణ్యం వైపు కదలికను తెలియజేస్తుంది.
- source_word: אֶל סֶלַע הָרִמּוֹן
  choice: అరణ్యంలో ఉన్న రిమ్మోను బండ వైపు
  rationale: סֶלַע అంటే బండ లేదా శిలాదుర్గం. సాధారణ నామాన్ని అనువదించి, స్థల నామమైన రిమ్మోనును లిప్యంతరీకరించడం జరిగింది; ముందున్న అరణ్య గమ్యంతో సహజ తెలుగులో అనుసంధానించబడింది.
- source_word: וַיְעֹלְלֻהוּ
  choice: హతమార్చారు
  rationale: עלל ఇక్కడ మిగిలినవారిని పంట తర్వాత ఏరినట్లు ఒక్కొక్కరిని నిర్మూలించే రూపక ప్రయోగం. ప్రధాన పాఠంలో యుద్ధ సందర్భార్థాన్ని స్పష్టంగా ఇచ్చి, మూల రూపకాన్ని పాదసూచికలో నిలిపాము.
- source_word: בַּמְסִלּוֹת
  choice: దారుల మీద
  rationale: מְסִלּוֹת నిర్మిత లేదా ప్రధాన మార్గాలను సూచించగలదు. ఆధునిక తెలుగులో ‘దారుల మీద’ సహజంగా ఉండి, సందర్భానికి అవసరం లేని ఆధునిక రహదారి భావాన్ని రుద్దదు.
- source_word: חֲמֵשֶׁת אֲלָפִים אִישׁ
  choice: ఐదువేల మందిని
  rationale: మూలంలోని సంఖ్యను, పురుషుల సమూహ సూచనను సహజ తెలుగు సంఖ్యావ్యవహారంతో అందిస్తుంది; ‘సైనికులు’ అని మూలంలో లేని వివరణను చేర్చలేదు.
- source_word: וַיַּדְבִּיקוּ אַחֲרָיו
  choice: వారిని తరుముకొని వెళ్లి
  rationale: דבק హిఫీల్ రూపం వెంటబడి చేరువగా తరుమడాన్ని సూచిస్తుంది. ‘తరుముకొని వెళ్లి’ ఆ కదలికను సహజంగా తెలియజేస్తుంది; మూలంలో లేని తీవ్రతాసూచక పదం చేర్చలేదు.
- source_word: עַד גִּדְעֹם
  choice: గిదోము వరకు
  rationale: עַד వెంబడింపు చేరిన హద్దును సూచిస్తుంది; గిదోము స్థల నామాన్ని తెలుగులో లిప్యంతరీకరించాం.
- source_word: וַיַּכּוּ מִמֶּנּוּ אַלְפַּיִם אִישׁ
  choice: వారిలో రెండువేల మందిని హతమార్చారు
  rationale: נכה యుద్ధ సందర్భంలో హతమార్చడాన్ని సూచిస్తుంది. ఏకవచన מִמֶּנּוּ సమూహార్థకంగా ఉండటంతో తెలుగులో ‘వారిలో’ అని ఇచ్చాం. ‘మరో’ అనేది సందర్భంలో అర్థమైనా మూలంలో స్పష్టంగా లేనందున చేర్చలేదు.
