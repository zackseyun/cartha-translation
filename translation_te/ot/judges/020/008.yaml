revisions:
- from: అప్పుడు ప్రజలందరూ ఒక్క మనిషిలా లేచి నిలబడి, “మనలో ఎవడూ తన గుడారానికి వెళ్లడు; మనలో ఎవడూ తన ఇంటివైపు మళ్లడు” అని అన్నారు.
  to: అప్పుడు ప్రజలందరూ ఒక్క మనిషిలా లేచి నిలబడి, “మనలో ఎవరూ తన గుడారానికి వెళ్లరు; మనలో ఎవరూ తన ఇంటివైపు మళ్లరు” అని అన్నారు.
  rationale: The only change is from generic masculine singular negative forms to inclusive plural-negative forms ('ఎవడూ...వెళ్లడు/మళ్లడు' → 'ఎవరూ...వెళ్లరు/మళ్లరు'). This better suits modern standard Telugu and the collective first-person declaration, without altering the source meaning or its tent/house parallelism.
