review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately reflects the collective rising, the idiom of unanimous action (''as one man''), and the two parallel refusals: going to one''s tent and turning aside to one''s house. ''తన ఇంటివైపు మళ్లడు'' preserves the directional nuance of סוּר without overinterpreting it as simply ''return home.'''
  naturalness: The sentence is clear and suitably formal for modern standard Telugu. Replacing the generic masculine 'ఎవడూ' with inclusive 'ఎవరూ' is more natural in contemporary public-facing Telugu while retaining the distributive force of אִישׁ.
  terminology: '''గుడారం'' and ''ఇల్లు'' properly preserve the deliberate Hebrew distinction between tent and house. No theological terminology or footnotes are involved.'
  issues:
  - severity: low
    issue: 'Generic masculine wording: ''మనలో ఎవడూ'''
    rationale: Although understandable, 'ఎవడూ' is explicitly masculine in modern Telugu. The Hebrew אִישׁ functions distributively here within a statement made by the whole assembly; 'మనలో ఎవరూ' is inclusive and equally faithful.
  revised_text: అప్పుడు ప్రజలందరూ ఒక్క మనిషిలా లేచి నిలబడి, “మనలో ఎవరూ తన గుడారానికి వెళ్లరు; మనలో ఎవరూ తన ఇంటివైపు మళ్లరు” అని అన్నారు.
  revised_footnotes: []
  revision_rationale: The only change is from generic masculine singular negative forms to inclusive plural-negative forms ('ఎవడూ...వెళ్లడు/మళ్లడు' → 'ఎవరూ...వెళ్లరు/మళ్లరు'). This better suits modern standard Telugu and the collective first-person declaration, without altering the source meaning or its tent/house parallelism.
