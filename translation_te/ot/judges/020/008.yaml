  text: וַ/יָּ֨קָם֙ כָּל הָ/עָ֔ם כְּ/אִ֥ישׁ אֶחָ֖ד לֵ/אמֹ֑ר לֹ֤א נֵלֵךְ֙ אִ֣ישׁ לְ/אָהֳל֔/וֹ וְ/לֹ֥א נָס֖וּר אִ֥ישׁ לְ/בֵיתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/008.yaml
  text: Then all the people rose up as one man, saying, “Not one of us will go to his tent, and not one of us will turn aside to his house.”
translation:
  language: te
  text: అప్పుడు ప్రజలందరూ ఒక్క మనిషిలా లేచి నిలబడి, “మనలో ఎవరూ తన గుడారానికి వెళ్లరు; మనలో ఎవరూ తన ఇంటివైపు మళ్లరు” అని అన్నారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקָם
  choice: లేచి నిలబడి
  rationale: సమూహం ఏకమై కార్యానికి సిద్ధపడిన భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: כְּאִישׁ אֶחָד
  choice: ఒక్క మనిషిలా
  rationale: హీబ్రూ ఉపమానాన్ని నిలుపుతూ ప్రజల సంపూర్ణ ఐక్యతను తెలియజేస్తుంది.
- source_word: לֹא נֵלֵךְ אִישׁ
  choice: మనలో ఎవడూ ... వెళ్లడు
  rationale: ప్రతి వ్యక్తినీ నిరాకరణ పరిధిలోకి తెచ్చే హీబ్రూ నిర్మాణాన్ని సహజమైన తెలుగు వాక్యంగా అందిస్తుంది.
- source_word: וְלֹא נָסוּר אִישׁ
  choice: మనలో ఎవడూ ... మళ్లడు
  rationale: סור అనే ‘దారి మళ్లడం/వైపు తిరగడం’ భావాన్ని, ఇంటికి చెదరిపోరనే సందర్భార్థంతో కాపాడుతుంది.
- source_word: לְאָהֳלוֹ / לְבֵיתוֹ
  choice: తన గుడారానికి / తన ఇంటివైపు
  rationale: మూలంలోని సమాంతర పదజాలాన్ని వేర్వేరు పదాలతో యథాతథంగా నిలుపుతుంది.
theological_decisions: []
