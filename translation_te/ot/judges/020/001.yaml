source:
  edition: WLC
  text: וַ/יֵּצְאוּ֮ כָּל בְּנֵ֣י יִשְׂרָאֵל֒ וַ/תִּקָּהֵ֨ל הָ/עֵדָ֜ה כְּ/אִ֣ישׁ אֶחָ֗ד לְ/מִ/דָּן֙ וְ/עַד בְּאֵ֣ר שֶׁ֔בַע וְ/אֶ֖רֶץ הַ/גִּלְעָ֑ד אֶל יְהוָ֖ה הַ/מִּצְפָּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/001.yaml
  text: Then all the sons of Israel came out[a], and the congregation assembled as one man, from Dan to Beer-sheba, and from the land of Gilead[c][b], to Yahweh at Mizpah.
translation:
  language: te
  text: అప్పుడు ఇశ్రాయేలు కుమారులందరూ బయలుదేరారు[a]; దాను మొదలుకొని బెయేర్షెబా వరకు, గిలాదు దేశం నుండీ వచ్చిన సభ అంతా ఒక్క మనిషిలా[b] మిస్పాలో యాహ్వే సన్నిధికి[c] సమకూడింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ఇశ్రాయేలు కుమారులు’ అనేది హీబ్రూ పదబంధానికి అక్షరార్థ అనువాదం; ఇక్కడ అది కేవలం పురుషులను మాత్రమే కాక, ఇశ్రాయేలు గోత్రాల ప్రజలను సమష్టిగా సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ మూలంలో ‘ఒక్క మనిషిలా’; అంటే ఏకాభిప్రాయంతో, ఐక్యంగా.
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘మిస్పాలో యాహ్వే ఎదుట.’ హీబ్రూ పదక్రమం, సభ మిస్పాలో యాహ్వే సమక్షంలో కూడిందని అర్థం చేసుకోవడానికి వీలిస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּצְאוּ
  choice: బయలుదేరారు
  rationale: יצא అనే క్రియకు ‘బయలుదేరు/వెలుపలికి వెళ్లు’ అనే సాధారణ అర్థం ఉంది. గోత్రాల ప్రజలు సభకు రావడానికి తమ ప్రాంతాలనుంచి బయలుదేరిన సందర్భంలో ఇది సహజంగా ఉంది; దిశను అనవసరంగా నిర్ధారించదు.
- source_word: כָּל בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులందరూ
  rationale: హీబ్రూ పదబంధంలోని ‘కుమారులు’ అనే రూపాన్ని నిలుపుతూ, ఇది ఇశ్రాయేలు ప్రజలను సమష్టిగా సూచిస్తుందని పాదసూచికలో స్పష్టం చేయబడింది.
- source_word: וַתִּקָּהֵל הָעֵדָה
  choice: సమాజమంతా ... సమకూడింది
  rationale: קהל క్రియ సమకూడడాన్ని, עֵדָה సమష్టిగా కూడిన ప్రజాసమాజాన్ని సూచిస్తాయి. ‘సమాజం’ ప్రస్తుత తెలుగులో సహజంగా ఉండి, అనవసరమైన ఆరాధనా-సాంకేతిక భావాన్ని రుద్దదు.
- source_word: כְּאִישׁ אֶחָד
  choice: ఒక్క మనిషిలా
  rationale: ఏకాభిప్రాయంతో లేదా ఏకచిత్తంగా కలిసి కార్యాచరణ చేయడాన్ని తెలిపే హీబ్రూ నుడికారాన్ని రూపసామ్యంతో నిలిపింది.
- source_word: לְמִדָּן וְעַד בְּאֵר שֶׁבַע
  choice: దాను మొదలుకొని బెయేర్షెబా వరకు
  rationale: ఇశ్రాయేలు భూభాగపు విస్తృతిని సూచించే భౌగోళిక ద్వంద్వసూచనను సహజమైన తెలుగు నిర్మాణంలో అందించింది.
- source_word: וְאֶרֶץ הַגִּלְעָד
  choice: గిలాదు దేశం నుండి కూడా వచ్చిన
  rationale: యొర్దాను అవతలి గిలాదు ప్రాంతం కూడా సభలో ప్రాతినిధ్యం వహించిందనే భావాన్ని తెలుగులో స్పష్టంగా కలుపుతుంది; మూలంలోని వావ్‌ను ‘కూడా’గా సహజీకరించింది.
- source_word: אֶל יְהוָה
  choice: యెహోవా సన్నిధికి
  rationale: אֶל యొక్క దిశార్థాన్ని ‘సన్నిధికి’ నిలుపుతుంది; సభ యెహోవా సమక్షంలో కూడిందనే సందర్భార్థాన్ని వ్యక్తం చేస్తుంది. దేవుని వ్యక్తిగత నామాన్ని తెలుగులో ప్రాచుర్యమున్న ‘యెహోవా’గా లిప్యంతరీకరించింది.
- source_word: הַמִּצְפָּה
  choice: మిస్పాలో
  rationale: స్థలనామాన్ని లిప్యంతరీకరించి, సభ కూడిన ప్రదేశాన్ని తెలుగులో సహజమైన స్థానవిభక్తితో తెలిపింది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు; యాహ్వే
  rationale: మూలంలో ఉన్న ఒడంబడిక నామాన్ని బిరుదుతో భర్తీ చేయకుండా వ్యక్తిగత నామంగానే నిలిపింది. ‘యెహోవా’ ఆధునిక తెలుగు బైబిలు వినియోగంలో సులభంగా గుర్తించబడే రూపం; మూల ఉచ్చారణను ‘యాహ్వే’గా ఇవ్వడం కూడా సాధ్యమైన ప్రత్యామ్నాయం.
- issue: בְּנֵי יִשְׂרָאֵל మరియు כְּאִישׁ אֶחָד లోని పుంలింగ సమష్టి భాష
  choice: ‘ఇశ్రాయేలు కుమారులు’, ‘ఒక్క మనిషిలా’ అనే మూలరూపాలను నిలుపుట
  alternative: ఇశ్రాయేలీయులందరూ; ఒక్కటిగా/ఏకమనసుతో
  rationale: మూలంలోని పుంలింగ రూపాన్నీ నుడికారాన్నీ ప్రధాన పాఠ్యంలో నిలుపుతూ, వాటి సమష్టి మరియు ఐక్యతార్థాలను పాదసూచికల్లో వివరిస్తుంది; అవి కేవలం పురుష వ్యక్తులనే సూచిస్తున్నాయని నిర్ణయించదు.
- issue: אֶל יְהוָה הַמִּצְפָּה అనే వాక్యనిర్మాణ సంబంధం
  choice: మిస్పాలో యెహోవా సన్నిధికి
  alternative: మిస్పాలో యెహోవా ఎదుట; యెహోవా దగ్గరకు, మిస్పాకు
  rationale: హీబ్రూ నిర్మాణం సభ యెహోవా వైపు/సన్నిధికి, మిస్పాలో కూడిందని అర్థం చేసుకోవడానికి వీలిస్తుంది. ప్రధాన పాఠ్యం స్థలాన్నీ దైవసన్నిధినీ సహజంగా అనుసంధానిస్తుంది; ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచి అస్పష్టతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనా సామాన్య పాఠకులకు అర్థమయ్యే శైలి. మూలంలోని సమష్టి పుంలింగ పదబంధాలు, ఐక్యతను తెలిపే నుడికారం, దైవసన్నిధికి సంబంధించిన నిర్మాణ అస్పష్టత పాదసూచికలతో నిలుపబడ్డాయి.
