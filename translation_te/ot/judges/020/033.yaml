translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. సైనిక సందర్భాన్ని ‘యుద్ధానికి బారులు తీరి’ మరియు ‘మాటుదళం’ వంటి సాధారణంగా అర్థమయ్యే పదాలతో వ్యక్తం చేశాం. పాదసూచిక గుర్తును అది వివరిస్తున్న ‘మయరే-గెబా’ తరువాత ఉంచాం.
