source:
  edition: WLC
  text: וְ/כֹ֣ל אִ֣ישׁ יִשְׂרָאֵ֗ל קָ֚מוּ מִ/מְּקוֹמ֔/וֹ וַ/יַּעַרְכ֖וּ בְּ/בַ֣עַל תָּמָ֑ר וְ/אֹרֵ֧ב יִשְׂרָאֵ֛ל מֵגִ֥יחַ מִ/מְּקֹמ֖/וֹ מִ/מַּֽעֲרֵה גָֽבַע׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/033.yaml
  text: Then all the men of Israel rose from their place and drew up in battle formation at Baal-tamar[a], while the men lying in ambush of Israel rushed out from their place, from Maareh-geba.
translation:
  language: te
  text: అప్పుడు ఇశ్రాయేలు పురుషులందరూ తమ స్థలం నుండి లేచి, బయల్-తామారు వద్ద యుద్ధానికి బారులు తీరి నిలబడ్డారు. ఇశ్రాయేలు మాటువేసిన దళం తమ స్థలం నుండి, మారెహ్-గెబా[a] నుండి, వెలుపలికి దూసుకొచ్చింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలోని ‘మారెహ్-గెబా’ను ఇక్కడ స్థలనామంగా అర్థం చేసుకోవచ్చు. దాన్ని ‘గెబా బహిరంగ ప్రదేశం’ లేదా ‘గెబా పచ్చికబయలు’ అని కూడా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹל אִישׁ יִשְׂרָאֵל
  choice: ఇశ్రాయేలు పురుషులందరూ
  rationale: אִישׁ ఏకవచన రూపంలో ఉన్నా כֹל తో కలిసి సమూహార్థాన్ని ఇస్తుంది; సైనిక సందర్భంలో ‘పురుషులందరూ’ సహజంగా, మూలంలోని లింగార్థాన్ని నిలుపుతుంది.
- source_word: קָמוּ מִמְּקוֹמוֹ
  choice: తమ స్థలం నుండి లేచి
  rationale: బహువచన క్రియకు అనుగుణంగా సమూహాన్ని సూచించే సహజ తెలుగు వాడబడింది; ఏకవచన ప్రత్యయం పంపిణీ భావంలో ఉంది.
- source_word: וַיַּעַרְכוּ
  choice: యుద్ధానికి బారులు తీరి నిలబడ్డారు
  rationale: ערך సైనిక సందర్భంలో దళాలను యుద్ధ క్రమంలో అమర్చడాన్ని సూచిస్తుంది; తెలుగు ప్రయోగం ఆ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: בְּבַעַל תָּמָר
  choice: బయల్-తామారు దగ్గర
  rationale: ఇది స్థలనామం కాబట్టి అనువదించకుండా తెలుగు లిపిలో లిప్యంతరీకరించబడింది; בְּ యొక్క స్థానార్థానికి ‘దగ్గర’ సహజంగా సరిపోతుంది.
- source_word: אֹרֵב יִשְׂרָאֵל
  choice: ఇశ్రాయేలు మాటుదళం
  rationale: ఈ సంక్షిప్త హీబ్రూ పదబంధం ఇశ్రాయేలుకు చెందిన మాటువేసిన దళాన్ని సూచిస్తుంది; ‘మాటుదళం’ మాటులో ఉన్న వారనే సైనిక భావాన్ని సహజంగా అందిస్తుంది.
- source_word: מֵגִיחַ
  choice: దూసుకొచ్చింది
  rationale: దాగిన స్థలం నుండి అకస్మాత్తుగా బయటికి రావడం లేదా ముందుకు ఉరకడం అనే భావాన్ని, మాటుదాడి సందర్భంలోని వేగంతో సహా తెలియజేస్తుంది.
- source_word: מִמְּקוֹמוֹ
  choice: తమ స్థలం నుండి
  rationale: సమూహవాచకమైన మాటుదళాన్ని దృష్టిలో ఉంచుకొని, మూలంలోని ఏకవచన ప్రత్యయాన్ని తెలుగులో సహజమైన సమూహ సంబంధక రూపంతో అందిస్తుంది.
- source_word: מִמַּעֲרֵה גָבַע
  choice: మయరే-గెబా
  rationale: పదబంధం క్లిష్టమైనది, బహుశా స్థలనామం కావచ్చు. అనిశ్చితిని ప్రధాన పాఠ్యంలో పరిష్కరించకుండా లిప్యంతరీకరించి, వర్ణనాత్మక ప్రత్యామ్నాయాలను పాదసూచికలో ఉంచాం.
