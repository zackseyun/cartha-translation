- from: బెన్యామీనీయులు, “మొదటిసారిలాగే[a] ఇప్పుడు కూడా వారు మన ఎదుట ఓడిపోతున్నారు” అన్నారు. అయితే ఇశ్రాయేలీయులు, “మనం పారిపోదాం; వారిని[b] నగరం నుండి ప్రధాన రహదారుల[c] వైపుకు బయటికి లాగుదాం” అనుకున్నారు.
