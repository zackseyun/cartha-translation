  text: וַ/יֹּֽאמְרוּ֙ בְּנֵ֣י בִנְיָמִ֔ן נִגָּפִ֥ים הֵ֛ם לְ/פָנֵ֖י/נוּ כְּ/בָ/רִאשֹׁנָ֑ה וּ/בְנֵ֧י יִשְׂרָאֵ֣ל אָמְר֗וּ נָנ֨וּסָה֙ וּֽ/נְתַקְּנֻ֔/הוּ מִן הָ/עִ֖יר אֶל הַֽ/מְסִלּֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/032.yaml
  text: And the sons of Benjamin said[a], “They are being struck down before us as at the first.” But the sons of Israel said[c][b], “Let us flee and draw them away from the city to the highways.”
translation:
  language: te
  text: బెన్యామీనీయులు, “మొదటిసారిలాగే[a] వారు మన ఎదుట ఓడిపోతున్నారు” అన్నారు. అయితే ఇశ్రాయేలీయులు, “మనం పారిపోదాం; వారిని[b] నగరం నుండి ప్రధాన రహదారుల[c] వైపుకు లాగి తీసుకుపోదాం” అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా ‘మొదటిసారిలాగే’; ఇది ఈ అధ్యాయంలో ఇంతకుముందు జరిగిన యుద్ధాలను సూచిస్తుంది. ‘మునుపటిలాగే’ అని కూడా అనువదించవచ్చు.
    reason: cross_reference
  - marker: b
    text: హీబ్రూ పాఠ్యంలో ‘అతణ్ణి’ అనే ఏకవచన కర్మప్రత్యయం ఉంది. అది బెన్యామీను ప్రజలను లేదా వారి పోరాట దళాన్ని సమష్టిగా సూచిస్తున్నట్లు కనిపిస్తుంది; అందుకే ఇక్కడ ‘వారిని’ అని అనువదించబడింది.
    reason: lexical_alternative
  - marker: c
    text: ‘రహదారులు’ లేదా ‘రాజమార్గాలు’ అని కూడా అనువదించవచ్చు. హీబ్రూ పదం నిర్మించిన ముఖ్య రహదారులను సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִגָּפִים
  choice: ఓడిపోతున్నారు
  rationale: యుద్ధ సందర్భంలో ఈ నిష్క్రియ కృదంతం దెబ్బతిని ఓటమి చెందడాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘ఓడిపోతున్నారు’ సహజంగా ఉండి సైనిక సందర్భాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: לְפָנֵינוּ
  choice: మన ఎదుట
  rationale: యుద్ధంలో తమ ముందే లేదా తమ చేతిలో ప్రత్యర్థి ఓడిపోతున్నాడనే భావాన్ని ఇచ్చే సాధారణ సమానార్థకం.
- source_word: כְּבָרִאשֹׁנָה
  choice: మొదటిసారిలాగే
  rationale: ఈ అధ్యాయంలోని ముందటి యుద్ధాన్ని వెనక్కి చూపే పోలికను నిలుపుతుంది; ‘యుద్ధం’ అనే పదాన్ని మూలంలో లేనందున ప్రధాన పాఠ్యంలో చేర్చలేదు.
- source_word: נָנוּסָה
  choice: మనం పారిపోదాం
  rationale: మొదటి పురుష బహువచన సంకల్పార్థక రూపంలోని ‘మనము చేద్దాం’ అనే భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וּנְתַקְּנֻהוּ
  choice: వారిని ... బయటికి లాగుదాం
  rationale: נתק క్రియలోని లాగి దూరం చేసే భావాన్ని నిలుపుతుంది. సందర్భంలో బెన్యామీను సైన్యాన్ని నగరం నుండి బయటికి తీసుకురావడమే వ్యూహం.
- source_word: הוּא suffix in וּנְתַקְּנֻהוּ
  choice: వారిని
  rationale: హీబ్రూలో కర్మప్రత్యయం ఏకవచనమైనా, అది బెన్యామీను ప్రజలను లేదా వారి సైన్యాన్ని సమష్టిగా సూచిస్తుంది. తెలుగులో సందర్భానుగుణమైన బహువచనం సహజంగా ఉంటుంది; మూలరూపం పాదసూచికలో తెలుపబడింది.
- source_word: הָעִיר
  choice: నగరం
  rationale: עִירకు సాధారణ సమానార్థకం; సందర్భంలో ఇది గిబియా పట్టణ కేంద్రాన్ని సూచిస్తుంది.
- source_word: הַמְסִלּוֹת
  choice: ప్రధాన రహదారులు
  rationale: מְסִלָּה నిర్మితమైన లేదా ఎత్తుగా వేసిన ముఖ్య రహదారిని సూచించగలదు. బహువచనాన్ని, సాధారణ పాఠకులకు అర్థమయ్యే ఆధునిక వాడుకను రెండింటినీ ఇది నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి ఉపయోగించబడింది. జాతిపేర్లకు ‘బెన్యామీనీయులు’, ‘ఇశ్రాయేలీయులు’ అనే సాధారణ రూపాలు వాడబడ్డాయి. మూలంలోని సమష్టి ఏకవచనం ప్రధాన పాఠ్యంలో సహజమైన బహువచనంగా ఇచ్చి, భాషా భేదాన్ని పాదసూచికలో సంరక్షించాం.
