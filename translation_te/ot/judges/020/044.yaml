  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַֽ/יִּפְּלוּ֙ מִ/בִּנְיָמִ֔ן שְׁמֹנָֽה עָשָׂ֥ר אֶ֖לֶף אִ֑ישׁ אֶת כָּל אֵ֖לֶּה אַנְשֵׁי חָֽיִל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/044.yaml
  text: And eighteen thousand men from Benjamin fell[a]; all these were valiant warriors.
translation:
  language: te
  text: బెన్యామీనీయుల్లో పద్దెనిమిది వేల మంది నేలకొరిగారు; వీరంతా పరాక్రమవంతులైన యోధులు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּפְּלוּ
  choice: నేలకొరిగారు
  rationale: యుద్ధ సందర్భంలో נפל మరణాన్ని సూచించే ‘పడిపోవడం’ అనే హీబ్రూ సైనిక నుడికారాన్ని తెలుగులో సహజంగా, గంభీరంగా వ్యక్తపరుస్తుంది.
- source_word: מִבִּנְיָמִן
  choice: బెన్యామీనీయుల్లో
  rationale: ఇక్కడ מִן ఆ గోత్రానికి చెందినవారిలోని సంఖ్యను సూచిస్తుంది; ‘బెన్యామీనీయుల్లో’ అనేది తెలుగులో సహజంగా గోత్ర సంబంధాన్ని తెలియజేస్తుంది.
- source_word: שְׁמֹנָה עָשָׂר אֶלֶף אִישׁ
  choice: పద్దెనిమిది వేల మంది
  rationale: సంఖ్యతో పాటు ఉన్న אִישׁ భావాన్ని ‘మంది’ ద్వారా స్పష్టంగా నిలుపుతుంది; ‘సైనికులు’ అని అనువదించడం మూలంలో లేని వివరణను చేర్చుతుంది.
- source_word: אֶת כָּל אֵלֶּה
  choice: వీరంతా
  rationale: ముందు చెప్పిన పడిపోయిన వారందరినీ సమష్టిగా సూచించే అనుబంధ వాక్యభాగాన్ని సంక్షిప్తమైన సహజ తెలుగులో అందిస్తుంది.
- source_word: אַנְשֵׁי חָיִל
  choice: పరాక్రమవంతులైన యోధులు
  rationale: యుద్ధ సందర్భంలో ఈ పదబంధం ధైర్యం, సామర్థ్యం గల పోరాట వీరులను సూచిస్తుంది; ఈ ఎంపిక ఆ రెండు భావాలనూ ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన యుద్ధ వర్ణనను వాడాం. సెమికోలన్ చివరి పదబంధం ముందటి సమూహాన్నే వివరిస్తున్న అనుబంధ సంబంధాన్ని నిలుపుతుంది.
