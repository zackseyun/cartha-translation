  text: Then the men in ambush quickly rushed against Gibeah[a], and the ambush advanced and struck the whole city with the edge of the sword.
translation:
  language: te
  text: అప్పుడు మాటువేసినవారు త్వరగా గిబియాపై దాడికి దూసుకెళ్లారు; మాటువేసిన దళం ముందుకు సాగి పట్టణమంతటినీ కత్తి ధారతో కొట్టివేసింది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “మాటువేసిన దళం చాచింది/ముందుకు లాగింది” అని ఉంది; ఇది దళం ముందుకు విస్తరించి సాగడాన్ని లేదా పట్టణంలోకి చొచ్చుకుపోవడాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֹרֵב
  choice: మాటువేసి ఉన్నవారు / మాటుదళం
  rationale: ఏకవచన రూపంలో ఉన్నప్పటికీ, సందర్భంలో ఇది మాటువేసి ఉన్న సైనిక బృందాన్ని సమష్టిగా సూచిస్తుంది. మొదటి సందర్భంలో వ్యక్తులను, తరువాతి సందర్భంలో దళాన్ని సహజంగా వ్యక్తపరచాం.
- source_word: הֵחִישׁוּ
  choice: త్వరపడి
  rationale: వేగంగా, ఆలస్యం చేయకుండా చర్యకు దిగిన భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: וַיִּפְשְׁטוּ אֶל
  choice: పైకి దూసుకెళ్లారు
  rationale: యుద్ధ సందర్భంలో ఈ క్రియ వేగంగా దాడికి సాగడాన్ని సూచిస్తుంది; గిబియా వైపు కదలికతో పాటు దాడి భావాన్నీ అందిస్తుంది.
- source_word: הַגִּבְעָה
  choice: గిబియా
  rationale: స్థలనామాన్ని ప్రామాణిక తెలుగు లిప్యంతరీకరణలో ఇచ్చాం.
- source_word: וַיִּמְשֹׁךְ
  choice: ముందుకు సాగి
  rationale: మూల క్రియకు ‘లాగు/పొడిగించు’ అనే ప్రాథమిక భావం ఉన్నా, ఇక్కడ మాటుదళం ముందుకు విస్తరించి సాగడాన్ని సూచించే అవకాశముంది. ప్రధాన పాఠ్యంలో సహజమైన సైనిక భావాన్ని ఇచ్చి, అస్పష్టతను పాదసూచికలో నిలిపాం.
- source_word: וַיַּךְ
  choice: చంపింది
  rationale: ‘కత్తివాత’ అనే అనుబంధ పదబంధం వల్ల ఇక్కడ కొట్టడం ప్రాణాంతక సంహారాన్ని సూచిస్తుంది; తెలుగులో ‘చంపింది’ సందర్భార్థాన్ని స్పష్టంగా ఇస్తుంది.
- source_word: כָּל הָעִיר
  choice: పట్టణమంతటినీ
  rationale: అక్షరార్థంగా ‘పట్టణమంతటినీ’; ఇది పట్టణాన్ని దాని ప్రజలతో కూడిన సమగ్ర రూపంగా సూచించే హీబ్రూ ప్రయోగాన్ని అతిగా వివరించకుండా నిలుపుతుంది.
- source_word: לְפִי חָרֶב
  choice: కత్తివాత
  rationale: అక్షరార్థంగా ‘కత్తి నోటికి’ అనే హీబ్రూ నుడికారం. ‘కత్తివాత’ తెలుగులో కత్తితో సంహరించడాన్ని సంక్షిప్తంగా, గంభీరంగా వ్యక్తపరుస్తుంది.
