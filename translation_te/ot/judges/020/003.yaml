source:
  edition: WLC
  text: וַֽ/יִּשְׁמְעוּ֙ בְּנֵ֣י בִנְיָמִ֔ן כִּֽי עָל֥וּ בְנֵֽי יִשְׂרָאֵ֖ל הַ/מִּצְפָּ֑ה וַ/יֹּֽאמְרוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל דַּבְּר֕וּ אֵיכָ֥ה נִהְיְתָ֖ה הָ/רָעָ֥ה הַ/זֹּֽאת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/003.yaml
  text: The sons of Benjamin heard that the sons of Israel had gone up to Mizpah[a]. And the sons of Israel said, “Tell us[b], how did this evil happen?”
translation:
  language: te
  text: బెన్యామీను వంశస్థులు, ఇశ్రాయేలీయులు మిస్పాకు వెళ్లారని విన్నారు.[a] ఇశ్రాయేలీయులు, “చెప్పండి, ఈ దుష్కార్యం ఎలా జరిగింది?”[b] అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ భాషలో అక్షరార్థంగా ‘బెన్యామీను కుమారులు’ మరియు ‘ఇశ్రాయేలు కుమారులు’ అని ఉంది.
    reason: lexical_alternative
  - marker: b
    text: ‘ఈ దుష్కార్యం’ అనే మాటను ‘ఈ చెడు’ లేదా ‘ఈ దుర్మార్గం’ అని కూడా అనువదించవచ్చు. హీబ్రూ పదానికి బలమైన నైతిక భావం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמְעוּ
  choice: విన్నారు
  rationale: ఈ కథన సందర్భంలో שׁמע అనేది ఒక వార్త లేదా సమాచారం వినడాన్ని సూచిస్తుంది. ‘విన్నారు’ సహజమైనదిగా ఉండి మూలంలోని సాధారణ భావాన్ని నిలుపుతుంది.
- source_word: בְּנֵי בִנְיָמִן
  choice: బెన్యామీను వంశస్థులు
  rationale: అక్షరార్థంగా ‘బెన్యామీను కుమారులు.’ ఇక్కడ మొత్తం గోత్ర ప్రజలను సూచిస్తున్నందున ఆధునిక తెలుగులో ‘వంశస్థులు’ సహజంగా, స్పష్టంగా ఉంటుంది; అక్షరార్థ రూపాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: כִּי עָלוּ
  choice: వెళ్లారని
  rationale: עלה అక్షరార్థంగా ‘పైకి వెళ్లడం.’ మిస్పాకు ప్రయాణించిన సందర్భంలో తెలుగులో ‘వెళ్లారని’ సహజం; ‘సమకూడారని’ అనడం మూల క్రియకన్నా ఎక్కువ వ్యాఖ్యానాత్మకం అవుతుంది.
- source_word: הַמִּצְפָּה
  choice: మిస్పాకు
  rationale: ఇది స్థలనామం. హీబ్రూ నిర్దేశక ఉపపదాన్ని తెలుగులో ప్రత్యేకంగా చూపకుండా, గమ్యార్థక ‘కు’తో సహజంగా అందించాం.
- source_word: וַיֹּאמְרוּ
  choice: అన్నారు
  rationale: మూల క్రియ సాధారణంగా ‘చెప్పారు/అన్నారు’ అనే అర్థం ఇస్తుంది. తరువాతి ఆజ్ఞార్థక వాక్యం ప్రశ్నలా పనిచేసినా, ‘అడిగారు’ అని మార్చకుండా మూలంలోని సాధారణ వాక్కు క్రియను నిలిపాం.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులు
  rationale: అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులు.’ ఇక్కడ ఇశ్రాయేలు ప్రజలను సూచిస్తున్నందున ‘ఇశ్రాయేలీయులు’ ఆధునిక తెలుగులో సహజంగా, సంక్షిప్తంగా ఉంటుంది.
- source_word: דַּבְּרוּ
  choice: చెప్పండి
  rationale: అక్షరార్థంగా ‘మాట్లాడండి.’ జరిగిన విషయాన్ని వివరించమనే సందర్భంలో ‘చెప్పండి’ సహజమైన తెలుగు ఆజ్ఞారూపం; మూలంలో స్పష్టంగా లేని ‘మాకు’ అనే కర్మను చేర్చలేదు.
- source_word: אֵיכָה נִהְיְתָה
  choice: ఎలా జరిగింది
  rationale: ఈ ప్రశ్నార్థక నిర్మాణం ఆ సంఘటన ఏ విధంగా సంభవించిందో అడుగుతుంది. ‘ఎలా జరిగింది’ తెలుగులో నేరుగా, సహజంగా ఉంటుంది.
- source_word: הָרָעָה הַזֹּאת
  choice: ఈ దుష్కార్యం
  rationale: רָעָה చెడు, దుర్మార్గం లేదా విపత్తును సూచించగలదు. గిబియాలో జరిగిన నైతిక ఘోరాన్ని దృష్టిలో ఉంచుకొని ‘దుష్కార్యం’ నైతిక బలాన్ని నిలుపుతూ, కేవలం విపత్తు అనే భావానికి పరిమితం చేయదు.
