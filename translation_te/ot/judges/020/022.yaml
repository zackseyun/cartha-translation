  text: וַ/יִּתְחַזֵּ֥ק הָ/עָ֖ם אִ֣ישׁ יִשְׂרָאֵ֑ל וַ/יֹּסִ֨פוּ֙ לַ/עֲרֹ֣ךְ מִלְחָמָ֔ה בַּ/מָּק֕וֹם אֲשֶׁר עָ֥רְכוּ שָׁ֖ם בַּ/יּ֥וֹם הָ/רִאשֽׁוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/022.yaml
  text: But the people[a], the men of Israel, strengthened themselves and again drew up for battle in the place where they had drawn up on the first day.
translation:
  language: te
  text: అయితే ఇశ్రాయేలు పురుషులైన ప్రజలు ధైర్యం తెచ్చుకొని[a], మొదటి రోజున తాము యుద్ధానికి మోహరించిన చోటే మళ్లీ మోహరించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘తమను తాము బలపరచుకొని.’ పరాజయం తర్వాత తిరిగి స్థైర్యం పొందడాన్ని హీబ్రూ పదం సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְחַזֵּק
  choice: ధైర్యం తెచ్చుకొని
  rationale: హిత్పయేల్ రూపం పరాజయం తర్వాత వారు తమను తాము బలపరచుకొని తిరిగి స్థైర్యం పొందిన భావాన్ని తెలియజేస్తుంది. సహజమైన ఆధునిక తెలుగులో సందర్భానుగుణంగా ‘ధైర్యం తెచ్చుకొని’ అని అనువదించబడింది; ‘తమను తాము బలపరచుకొని’ అనే మరింత రూపసామ్యమైన అర్థాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: הָעָם אִישׁ יִשְׂרָאֵל
  choice: ఇశ్రాయేలు పురుషులైన ప్రజలు
  rationale: ‘ప్రజలు’ అనే సమూహపదాన్నీ, యుద్ధంలో పాల్గొన్న ‘ఇశ్రాయేలు పురుషులు’ అనే వివరణనూ నిలుపుతుంది; ‘సైన్యం’ అని చెప్పడం మూలంలో లేని సైనిక నామవాచకాన్ని చేర్చినట్లవుతుంది.
- source_word: וַיֹּסִפוּ
  choice: మళ్లీ
  rationale: తదనంతర క్రియతో కలిసి ఇది చర్యను పునరావృతం చేయడం లేదా తిరిగి చేపట్టడం అనే భావాన్ని ఇస్తుంది.
- source_word: לַעֲרֹךְ מִלְחָמָה
  choice: యుద్ధానికి మోహరించారు
  rationale: ערך మరియు מלחמה కలయిక యుద్ధ పంక్తులను క్రమపరచుకొని పోరాటానికి నిలవడాన్ని సూచిస్తుంది. ‘మోహరించారు’ ఈ సైనిక భావాన్ని సహజంగా, సంక్షిప్తంగా అందిస్తుంది.
- source_word: בַּמָּקוֹם אֲשֶׁר עָרְכוּ שָׁם
  choice: తాము ... మోహరించిన చోటే
  rationale: మునుపటి యుద్ధస్థానానికే వారు తిరిగి వెళ్లి మోహరించారనే స్థానిక సంబంధాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; ‘చోటే’ అదే ప్రదేశమనే ఉద్ఘాటనను ఇస్తుంది.
- source_word: בַּיּוֹם הָרִאשׁוֹן
  choice: మొదటి రోజున
  rationale: మునుపటి యుద్ధ మోహరింపును సూచించే సరళమైన, ఖచ్చితమైన కాలవాచక అనువాదం.
