translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలిని అనుసరించాం. ‘మోహరించారు’ యుద్ధ పంక్తులు ఏర్పరచుకోవడం అనే మూలభావాన్ని సాధారణ పాఠకుడికి స్పష్టంగా తెలియజేస్తుంది; మూలంలోని పునరుక్తిని సాధ్యమైనంతవరకు నిలిపాం.
