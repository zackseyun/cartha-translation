  yaml_path: translation/ot/judges/020/027.yaml
  text: And the sons of Israel inquired of Yahweh—for the ark of the covenant of God was there in those days—[a][b]
translation:
  language: te
  text: ఇశ్రాయేలు కుమారులు యహ్వేను సంప్రదించారు (ఆ రోజుల్లో దేవుని నిబంధన మందసం అక్కడ ఉండేది).[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఇశ్రాయేలీయులు యహ్వేను సంప్రదించారు.” హీబ్రూలో అక్షరార్థంగా “ఇశ్రాయేలు కుమారులు” అని ఉంది.
    reason: lexical_alternative
  - marker: b
    text: “ఆ రోజుల్లో దేవుని నిబంధన మందసం అక్కడ ఉండేది” అనే మాట, వారు యహ్వేను సంప్రదించిన సందర్భాన్ని వివరిస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁאֲלוּ
  choice: సంప్రదించారు
  rationale: שׁאל అనే క్రియ ב ఉపసర్గతో దైవనామం ముందు వచ్చినప్పుడు, సాధారణంగా ప్రశ్నించడం మాత్రమే కాక దేవుని నిర్ణయం లేదా మార్గదర్శకం కోరడాన్ని సూచిస్తుంది. ‘సంప్రదించారు’ ఈ ఆధ్యాత్మిక-ఆచార సంబంధమైన భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: హీబ్రూ పదబంధానికి ఇది సన్నిహితమైన రూపం; కథన సందర్భంలో ఇది ఇశ్రాయేలు ప్రజలను సమష్టిగా సూచిస్తుంది. ‘ఇశ్రాయేలీయులు’ అనేది సహజమైన ప్రత్యామ్నాయం.
- source_word: בַּיהוָה
  choice: యహ్వేను
  rationale: שׁאל ב అనే హీబ్రూ ప్రయోగం ఇక్కడ ‘యహ్వేను సంప్రదించడం’ అనే అర్థాన్నిస్తుంది; తెలుగు కర్మవిభక్తి ఈ సంబంధాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా వ్యక్తినామంగా లిప్యంతరీకరించాం.
- source_word: וְשָׁם
  choice: అక్కడే ఉండేది
  rationale: וְשָׁם తరువాతి వాక్యభాగాన్ని సందర్భాన్ని వివరించే గమనికగా పరిచయం చేస్తుంది. ప్రత్యేక వాక్యంగా ఇవ్వడం తెలుగులో స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: אֲרוֹן בְּרִית הָאֱלֹהִים
  choice: దేవుని నిబంధన మందసం
  rationale: మొత్తం హీబ్రూ సంబంధపదబంధాన్ని సహజమైన తెలుగు క్రమంలో ఉంచి, ‘దేవుని నిబంధనకు చెందిన మందసం’ అనే భావాన్ని కాపాడుతుంది.
- source_word: בַּיָּמִים הָהֵם
  choice: ఆ రోజుల్లో
  rationale: హీబ్రూ కాలసూచక నుడికారానికి సహజమైన, సన్నిహిత తెలుగు రూపం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యహ్వే
  alternative: యెహోవా / ప్రభువు
  rationale: మూలపాఠంలో దైవనామమే ప్రత్యక్షంగా ఉంది. దానిని బిరుదుగా మార్చకుండా ‘యహ్వే’ అని లిప్యంతరీకరించడం మూలంలోని వ్యక్తినామాన్ని నిలుపుతుంది.
- issue: మందసం అక్కడ ఉండడం మరియు సంప్రదింపుకు మధ్య సంబంధం
  choice: రెండవ వాక్యాన్ని సందర్భ వివరణగా చూపించడం
  alternative: ‘ఎందుకంటే’ అని స్పష్టమైన కారణసంబంధం చేర్చడం
  rationale: హీబ్రూలో וְ (‘మరియు/ఇక’) మాత్రమే ఉంది; ఈ వాక్యభాగం సందర్భాన్ని వివరిస్తున్నప్పటికీ కారణసంబంధాన్ని వ్యాకరణపరంగా ఖచ్చితంగా నిర్దేశించదు. అందువల్ల మూలంలోని స్వల్ప అస్పష్టతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథనశైలిని అనుసరించాం. ‘మందసం’ అనే స్థిరమైన బైబిలు పదాన్ని నిలిపి, వాక్యనిర్మాణాన్ని సాధారణ పాఠకులకు స్పష్టంగా ఉంచాం. మూలంలోని וְ ను బలమైన కారణార్థక పదంగా మార్చకుండా రెండు వాక్యాలుగా ఇచ్చాం.
