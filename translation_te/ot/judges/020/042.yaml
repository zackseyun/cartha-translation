  text: So they turned before the men of Israel toward the way of the wilderness[a], but the battle overtook them[c][b]; and those from the cities were destroying them in their midst.
translation:
  language: te
  text: వారు ఇశ్రాయేలు యోధుల ఎదుటనుండి[a] అరణ్యమార్గం వైపు తిరిగారు. అయితే యుద్ధం వారిని అందుకుంది[b]. పట్టణాలనుండి వచ్చినవారు వారి మధ్యలోనే వారిని సంహరిస్తూ ఉన్నారు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీలో అక్షరార్థంగా ‘ఇశ్రాయేలు పురుషుల ఎదుట.’ సందర్భంలో ఈ మాట ‘ఇశ్రాయేలు యోధుల ఎదుటనుండి,’ అంటే వారినుండి వెనుదిరిగారని అర్థం కావచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘యుద్ధం వారిని వెంబడించి పట్టుకుంది.’
    reason: lexical_alternative
  - marker: c
    text: చివరి వాక్యభాగంలోని హెబ్రీ పాఠం సంక్షిప్తంగా, క్లిష్టంగా ఉంది. పట్టణాలనుండి బయటకు వచ్చిన ఇశ్రాయేలు బలగాలు బెన్యామీనీయుల దళం మధ్యలో వారిని సంహరించాయని ఇది సూచిస్తుండవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּפְנוּ
  choice: తిరిగారు
  rationale: פנה అనే క్రియకు ప్రాథమిక అర్థం ‘తిరుగు’. యుద్ధ సందర్భంలో ఇది వెనుదిరగడాన్ని సూచించినా, ‘తిరిగారు’ హెబ్రీయ చిత్రాన్ని నిలుపుతుంది.
- source_word: לִפְנֵי אִישׁ יִשְׂרָאֵל
  choice: ఇశ్రాయేలు యోధుల ఎదుటనుండి
  rationale: అక్షరార్థంగా ‘ఇశ్రాయేలు పురుషుల ఎదుట’. సందర్భంలో సైనిక బలగాన్ని సూచిస్తున్నందున ‘యోధులు’ సహజంగా ఉంటుంది; ‘ఎదుటనుండి’ వారు ఆ బలగాలనుండి వెనుదిరిగారని తెలియజేస్తుంది.
- source_word: אֶל דֶּרֶךְ הַמִּדְבָּר
  choice: అరణ్యమార్గం వైపు
  rationale: דֶּרֶךְ అంటే ‘దారి/మార్గం’; ఈ సంక్షిప్త సమాసం ‘అరణ్యానికి వెళ్లే మార్గం’ అనే భావాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: וְהַמִּלְחָמָה הִדְבִּיקָתְהוּ
  choice: అయితే యుద్ధం వారిని వెంబడించి పట్టుకుంది
  rationale: דבק హిఫీల్ రూపం వెంబడించి చేరుకోవడం లేదా పట్టుకోవడం అనే భావాన్ని ఇస్తుంది. ‘యుద్ధం’ కర్తగా ఉన్న హెబ్రీయ వ్యక్తీకరణను నిలిపి, సమూహవాచక ఏకవచన సర్వనామాన్ని తెలుగులో సహజమైన బహువచనంగా ఇచ్చాం.
- source_word: וַאֲשֶׁר מֵהֶעָרִים
  choice: పట్టణాలనుండి వచ్చినవారు
  rationale: హెబ్రీయ నిర్మాణం సంక్షిప్తమూ క్లిష్టమూ. అది పట్టణాలనుండి లేదా అక్కడి మాటు స్థానాలనుండి వచ్చిన బలగాలను సూచించవచ్చు; మూలంలోని అస్పష్టతను కొంతవరకు నిలుపుతూ కర్తను తెలుగులో పూర్తి చేశాం.
- source_word: מַשְׁחִיתִים
  choice: నాశనం చేస్తూ ఉన్నారు
  rationale: שׁחת సైనిక సందర్భంలో ప్రాణనాశక విధ్వంసాన్ని సూచిస్తుంది. ‘నాశనం చేస్తూ’ దాని మూలార్థానికి దగ్గరగా ఉంది.
- source_word: אוֹתוֹ
  choice: వారిని
  rationale: మూలంలో ఏకవచన సర్వనామం ఉన్నా అది బెన్యామీను సైన్యాన్ని సమూహంగా సూచిస్తుంది; తెలుగులో బహువచనం అపార్థాన్ని నివారిస్తుంది.
- source_word: בְּתוֹכוֹ
  choice: వారి మధ్యలోనే
  rationale: ఏకవచన ప్రత్యయం సమూహవాచకంగా ఉంది. దాడిచేసేవారు వారి నడుమనే విధ్వంసం చేశారనే వ్యూహాత్మక భావాన్ని ఈ రూపం అందిస్తుంది.
