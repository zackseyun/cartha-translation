  text: Then the sons of Israel rose in the morning and camped against Gibeah[a].
translation:
  language: te
  text: అప్పుడు ఇశ్రాయేలు ప్రజలు ఉదయాన్నే లేచి, గిబియాకు ఎదురుగా మకాం వేశారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקֻמוּ
  choice: లేచి
  rationale: קום ధాతువు వయ్యిక్తోల్ రూపంలో కథనంలోని తదుపరి చర్యను సూచిస్తుంది. ‘లేచి’ అనేది బయలుదేరడం అనే భావాన్ని అనవసరంగా చేర్చకుండా సాధారణ కథనార్థాన్ని నిలుపుతుంది.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు ప్రజలు
  rationale: అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులు’; అయితే ఈ సందర్భంలో అది సమష్టిగా ఇశ్రాయేలీయులను సూచించే హీబ్రూ నుడికారం. ఆధునిక తెలుగులో ‘ఇశ్రాయేలు ప్రజలు’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: בַּבֹּקֶר
  choice: ఉదయాన్నే
  rationale: నిర్దిష్ట కాలసూచక నామంతో ఉన్న విభక్తి ఉదయకాలాన్ని సూచిస్తుంది. కథన క్రమంలో ‘ఉదయాన్నే’ సహజమైన తెలుగు రూపం.
- source_word: וַיַּחֲנוּ
  choice: మకాం వేశారు
  rationale: חנה ఇక్కడ సైన్యం శిబిరం ఏర్పాటు చేసుకోవడాన్ని సూచిస్తుంది. ‘మకాం వేశారు’ ఆధునిక తెలుగులో సహజంగా ఉండి ఆ అర్థాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: עַל
  choice: ఎదురుగా
  rationale: యుద్ధ సందర్భంలో עַל కేవలం స్థలసామీప్యాన్ని కాక, పట్టణానికి వ్యతిరేకంగా సైనిక స్థానం ఏర్పరచుకోవడాన్ని సూచిస్తుంది. ‘ఎదురుగా’ ఆ భావాన్ని అతిశయింపకుండా అందిస్తుంది.
- source_word: הַגִּבְעָה
  choice: గిబియా
  rationale: ఇది గిబియా అనే స్థలనామం. హీబ్రూలోని నిర్దిష్ట ఉపపదాన్ని తెలుగులో వేరుగా అనువదించాల్సిన అవసరం లేదు.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘ఇశ్రాయేలు కుమారులు’ అనే హీబ్రూ నుడికారాన్ని లక్ష్యభాషలో సాధారణ పాఠకులకు స్పష్టంగా ఉండే ‘ఇశ్రాయేలు ప్రజలు’గా అనువదించాం; అవసరం లేని పాదటిప్పణి చేర్చలేదు.
