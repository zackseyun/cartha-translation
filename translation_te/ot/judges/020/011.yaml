  text: וַ/יֵּֽאָסֵ֞ף כָּל אִ֤ישׁ יִשְׂרָאֵל֙ אֶל הָ/עִ֔יר כְּ/אִ֥ישׁ אֶחָ֖ד חֲבֵרִֽים־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/011.yaml
  text: So all the men of Israel gathered to the city[a], united as one man.
translation:
  language: te
  text: అప్పుడు ఇశ్రాయేలు పురుషులందరూ ఒక్క మనిషిలా, కలిసికట్టుగా ఆ పట్టణానికి సమకూడారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూలో: “ఒక్క మనిషిలా, కలిసికట్టుగా”—పూర్తి ఐక్యంతో చర్య తీసుకోవడాన్ని సూచించే నుడికారం.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּאָסֵף
  choice: సమకూడారు
  rationale: నిఫల్ రూపం ఇక్కడ సమూహంగా కూడడాన్ని సూచిస్తుంది. తెలుగు సహజ వాక్యనిర్మాణంలో బహువచన కర్తతో ‘సమకూడారు’ స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: כָּל אִישׁ יִשְׂרָאֵל
  choice: ఇశ్రాయేలు పురుషులందరూ
  rationale: ఏకవచన రూపంలోని אִישׁ, כָּל తో కలిసి సమష్టిగా ఇశ్రాయేలు యుద్ధపురుషులను సూచిస్తుంది; సందర్భానుసారంగా లింగనిర్దిష్టతను నిలుపుతుంది.
- source_word: אֶל הָעִיר
  choice: ఆ పట్టణం దగ్గర
  rationale: אֶל సాధారణంగా ‘వైపు/దగ్గరకు’ అనే దిశార్థాన్ని ఇస్తుంది. ఈ వాక్యంలో శత్రుత్వార్థం స్పష్టంగా పదబద్ధం కాలేదు; ‘దగ్గర’ అనేది పట్టణం వద్ద కూడడాన్ని సహజ తెలుగులో తెలియజేస్తూ మూలంలోని కొంత స్థానిక అస్పష్టతను నిలుపుతుంది.
- source_word: כְּאִישׁ אֶחָד
  choice: ఒక్క మనిషిలా
  rationale: ఏకచిత్తంగా, ఏకరీతిగా చర్య తీసుకోవడాన్ని తెలిపే హీబ్రూ నుడికారాన్ని దాని మానవ రూపకంతో సహా నిలుపుతుంది.
- source_word: חֲבֵרִים
  choice: ఐక్యంగా
  rationale: חבר మూలం నుంచి వచ్చిన ఈ పదం కలిసికట్టుగా ఉండడం లేదా అనుసంధానమై ఉండడం అనే భావాన్ని జోడిస్తుంది; తెలుగులో ‘ఐక్యంగా’ దాని క్రియావిశేషణ బలాన్ని సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘ఒక్క మనిషిలా ఐక్యంగా’ అనే పదబంధం మూలంలోని כְּאִישׁ אֶחָד חֲבֵרִים అనే ఐక్యతను నొక్కిచెప్పే భావాన్ని నిలుపుతుంది. పాదటిప్పణి గుర్తు ప్రధాన పాఠ్యంలో చేర్చబడింది.
