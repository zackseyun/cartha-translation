revisions:
- from: అప్పుడు ఇశ్రాయేలు పురుషులందరూ ఒక్క మనిషిలా ఐక్యంగా ఆ పట్టణం దగ్గర సమకూడారు.[a]
  to: అప్పుడు ఇశ్రాయేలు పురుషులందరూ ఒక్క మనిషిలా, కలిసికట్టుగా ఆ పట్టణానికి సమకూడారు.[a]
  rationale: “దగ్గర” స్థానంలో “పట్టణానికి” ఉంచి אֶל యొక్క దిశార్థాన్ని కాపాడాం. כְּאִישׁ אֶחָד మరియు חֲבֵרִים రెండింటి బలాన్ని “ఒక్క మనిషిలా, కలిసికట్టుగా” ద్వారా స్పష్టంగా నిలుపుతూ, పాదటిప్పణిని ఆ ఐక్య-నుడికారానికే సరియైన విధంగా అనుసంధానించాం.
