revisions:
- from: ఇశ్రాయేలు గోత్రాలన్నిటిలో ప్రతి వంద మందికి పదిమందిని, ప్రతి వెయ్యి మందికి వందమందిని, ప్రతి పదివేల మందికి వెయ్యిమందిని మనం నియమించుకుందాం. వారు ప్రజల కోసం ఆహార సామగ్రిని సమకూర్చాలి. అప్పుడు ప్రజలు బెన్యామీనులోని గిబియాకు చేరుకున్నప్పుడు, అక్కడ ఇశ్రాయేలులో జరిగిన ఆ ఘోరమైన నీచకార్యానికి తగినట్లు చర్య తీసుకోగలరు.[a]
  to: ఇశ్రాయేలు గోత్రాలన్నిటినుండి ప్రతి వంద మందిలో పదిమందిని, ప్రతి వెయ్యి మందిలో వందమందిని, ప్రతి పదివేల మందిలో వెయ్యిమందిని మనం తీసుకుందాం. వారు ప్రజలకు కావలసిన సరఫరాలు సమకూర్చాలి. సమకూరిన ప్రజలు బెన్యామీనులోని గిబియాకు వచ్చినప్పుడు, ఇశ్రాయేలులో జరిగిన ఆ ఘోరమైన నీచకార్యానికి తగినట్లు వారు చర్య తీసుకునేలా ఇది ఉండాలి.[a]
  rationale: The revision retains the one-in-ten numerical pattern, makes the selected group’s supply function explicit, and renders the final infinitive chain as a purpose. It also retains a noncommittal passive expression for the actor of the outrage, reflecting the Hebrew’s syntactic ambiguity.
