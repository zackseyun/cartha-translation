source:
  edition: WLC
  text: וְ/לָקַ֣חְנוּ עֲשָׂרָה֩ אֲנָשִׁ֨ים לַ/מֵּאָ֜ה לְ/כֹ֣ל שִׁבְטֵ֣י יִשְׂרָאֵ֗ל וּ/מֵאָ֤ה לָ/אֶ֨לֶף֙ וְ/אֶ֣לֶף לָ/רְבָבָ֔ה לָ/קַ֥חַת צֵדָ֖ה לָ/עָ֑ם לַ/עֲשׂ֗וֹת לְ/בוֹאָ/ם֙ לְ/גֶ֣בַע בִּנְיָמִ֔ן כְּ/כָל הַ֨/נְּבָלָ֔ה אֲשֶׁ֥ר עָשָׂ֖ה בְּ/יִשְׂרָאֵֽל׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/010.yaml
  text: And we will take ten men out of a hundred from all the tribes of Israel[a], and a hundred out of a thousand, and a thousand out of ten thousand, to get provisions for the people, so that when they come to Gibeah of Benjamin[b], they may do according to all the outrage that it committed in Israel.
translation:
  language: te
  text: ఇశ్రాయేలు గోత్రాలన్నిటినుండి ప్రతి వంద మందిలో పదిమందిని, ప్రతి వెయ్యి మందిలో వందమందిని, ప్రతి పదివేల మందిలో వెయ్యిమందిని మనం తీసుకుందాం. వారు ప్రజలకు కావలసిన సరఫరాలు సమకూర్చాలి. సమకూరిన ప్రజలు బెన్యామీనులోని గిబియాకు వచ్చినప్పుడు, ఇశ్రాయేలులో జరిగిన ఆ ఘోరమైన నీచకార్యానికి తగినట్లు వారు చర్య తీసుకునేలా ఇది ఉండాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, ‘బెన్యామీను గిబియాకు వారు వచ్చినప్పుడు చేయడానికి’ అని సంక్షిప్తంగా ఉంది. భావం ఏమిటంటే, వారు అక్కడికి చేరినప్పుడు ఇశ్రాయేలులో జరిగిన ఆ నీచకార్యానికి తగినట్లుగా చర్య తీసుకోవడం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַחְנוּ
  choice: మనం నియమించుకుందాం
  rationale: సభ చేస్తున్న కార్యప్రణాళికలో ఈ సంయుక్త పరిపూర్ణ క్రియ భవిష్య/సంకల్ప భావాన్ని కలిగిస్తుంది. తెలుగు సందర్భంలో ‘నియమించుకుందాం’ ఎంపిక చేసి బాధ్యత అప్పగించే భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: עֲשָׂרָה אֲנָשִׁים לַמֵּאָה ... וּמֵאָה לָאֶלֶף וְאֶלֶף לָרְבָבָה
  choice: ప్రతి వంద మందికి పదిమందిని, ప్రతి వెయ్యి మందికి వందమందిని, ప్రతి పదివేల మందికి వెయ్యిమందిని
  rationale: మూలంలోని అనుపాత ఎంపికను, సంఖ్యాక్రమాన్ని స్పష్టంగా మరియు సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: לְכֹל שִׁבְטֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు గోత్రాలన్నిటిలో
  rationale: ఎంపిక గోత్ర సమాఖ్య అంతటినుంచి జరుగుతుందని సందర్భం సూచిస్తుంది; ‘అన్నిటిలో’ ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: לָקַחַת צֵדָה
  choice: ఆహార సామగ్రిని సమకూర్చాలి
  rationale: צֵדָה ప్రయాణం లేదా సైనిక యాత్రకు కావలసిన సరఫరాలను, ప్రధానంగా ఆహారాన్ని సూచిస్తుంది. ‘ఆహార సామగ్రి’ సాధారణ పాఠకునికి స్పష్టంగా ఉంటుంది.
- source_word: לָעָם
  choice: ప్రజల కోసం
  rationale: సైనిక సందర్భంలో సమకూడిన దళాన్ని సూచించినప్పటికీ, మూలంలోని సాధారణ ‘ప్రజలు’ అనే పదాన్ని అనవసరంగా సంకుచితం చేయలేదు.
- source_word: לַעֲשׂוֹת לְבוֹאָם
  choice: చేరుకున్నప్పుడు ... చర్య తీసుకోగలరు
  rationale: మూలంలోని సంక్షిప్త క్రియారూప శ్రేణిని తెలుగులో ఉద్దేశం/ఫలితంగా సహజంగా విప్పి చెప్పింది.
- source_word: לְגֶבַע בִּנְיָמִן
  choice: బెన్యామీనులోని గిబియాకు
  rationale: దిశను సూచించే ఉపసర్గను ‘గిబియాకు’గా ఉంచి, ప్రాంతీయ సంబంధాన్ని సహజ తెలుగులో ‘బెన్యామీనులోని’గా వ్యక్తం చేసింది.
- source_word: כְּכָל הַנְּבָלָה
  choice: ఆ ఘోరమైన నీచకార్యానికి తగినట్లు
  rationale: נְבָלָה ఇక్కడ దిగ్భ్రాంతికరమైన, అవమానకరమైన నైతిక దుష్కార్యాన్ని సూచిస్తుంది. ‘ఘోరమైన నీచకార్యం’ దాని బలాన్ని ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: אֲשֶׁר עָשָׂה בְּיִשְׂרָאֵל
  choice: అక్కడ ఇశ్రాయేలులో జరిగిన
  rationale: హీబ్రూ క్రియ వ్యాకరణపరంగా ఏకవచనమైనా, కర్త నగరమా, సమూహ అపరాధియా, లేక కార్యానికి సంబంధించిన నిర్మాణమా అన్నది పూర్తిగా స్పష్టం కాదు. తెలుగు భావవాచక నిర్మాణం ఈ అస్పష్టతను కాపాడుతుంది.
theological_decisions:
- issue: נְבָלָה పదంలోని నైతిక తీవ్రతను తరువాతి సిద్ధాంతపరమైన వర్గాలతో విస్తరించకుండా అనువదించడం
  choice: ఘోరమైన నీచకార్యం
  alternative: అవమానకరమైన పని; ఘోర దుష్కార్యం; మూర్ఖపు పని
  rationale: ఈ సందర్భంలో పదం కేవలం అవివేకాన్ని కాక, సమాజాన్ని దిగ్భ్రాంతికి గురిచేసే నీచమైన నైతిక దుష్కార్యాన్ని సూచిస్తుంది. ఎటువంటి సాంకేతిక మతపరమైన పదజాలాన్ని జోడించకుండా ఆ తీవ్రతను తెలియజేస్తుంది.
- issue: అపరాధ చర్యకు కర్త ఎవరో నిర్ణయించడం
  choice: ఇశ్రాయేలులో జరిగిన
  alternative: గిబియా చేసిన; అతడు చేసిన
  rationale: మూలంలోని పురుష ఏకవచన క్రియ నగరాన్ని సమూహ కర్తగా సూచించవచ్చు, కాని కర్తను స్పష్టంగా నిర్ధారించడం కష్టం. భావవాచక తెలుగు నిర్మాణం మూలంలోని నిజమైన అస్పష్టతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్య నిర్మాణం. సంఖ్యల అనుపాత క్రమం నిలుపబడింది. హీబ్రూ సంక్షిప్త వాక్యనిర్మాణం సహజ తెలుగులో పరిమితంగా విప్పబడింది. ప్రధాన పాఠంలోని [a] గుర్తు సంబంధిత పాదటిప్పణితో సరిపోతుంది.
