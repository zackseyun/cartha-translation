  text: וַ/יַּעֲל֧וּ בְנֵֽי יִשְׂרָאֵ֛ל אֶל בְּנֵ֥י בִנְיָמִ֖ן בַּ/יּ֣וֹם הַ/שְּׁלִישִׁ֑י וַ/יַּעַרְכ֥וּ אֶל הַ/גִּבְעָ֖ה כְּ/פַ֥עַם בְּ/פָֽעַם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/030.yaml
  text: Then the sons of Israel went up against the sons of Benjamin on the third day[a], and they drew up against Gibeah as before.
translation:
  language: te
  text: మూడవ రోజున ఇశ్రాయేలు కుమారులు బెన్యామీను కుమారుల మీదికి వెళ్లి[a], మునుపటిలాగే గిబియా ఎదుట యుద్ధానికి బారులు తీరి నిలిచారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఇశ్రాయేలీయులు బెన్యామీనీయుల మీదికి వెళ్లి.” హెబ్రీ భాషలో అక్షరార్థంగా “ఇశ్రాయేలు కుమారులు,” “బెన్యామీను కుమారులు” అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: మీదికి వెళ్లి
  rationale: עלה యొక్క ప్రాథమిక భావమైన ‘పైకి వెళ్లడం’ను సహజమైన తెలుగు యుద్ధ సందర్భంలో ‘మీదికి వెళ్లి’గా అందించింది; ‘దండెత్తి’ అని పెట్టి భావాన్ని అతిగా నిర్దిష్టం చేయలేదు.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: ఇరు పక్షాలకూ వాడిన బంధుత్వ పదబంధ సమాంతరతను నిలుపుతూ హెబ్రీయ మూలానికి సన్నిహితంగా అనువదించింది.
- source_word: אֶל בְּנֵי בִנְיָמִן
  choice: బెన్యామీను కుమారుల మీదికి
  rationale: אֶל ప్రాథమికంగా ‘వైపు/దగ్గరకు’ అయినా, ఈ యుద్ధ సందర్భంలో శత్రుత్వ దిశను తెలుగులో సహజంగా ‘మీదికి’ తెలియజేస్తుంది.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: మూడవ రోజున
  rationale: కాలసూచక పదబంధానికి సరళమైన, ప్రామాణిక తెలుగు రూపం.
- source_word: וַיַּעַרְכוּ
  choice: యుద్ధానికి బారులు తీరి నిలిచారు
  rationale: ערך యొక్క సైనిక సందర్భార్థమైన దళాలను యుద్ధ క్రమంలో అమర్చుకోవడాన్ని స్పష్టమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אֶל הַגִּבְעָה
  choice: గిబియా ఎదుట
  rationale: నగరానికి సంబంధించి సైన్యం యుద్ధ స్థితిలో నిలిచిన దిశ/స్థానాన్ని తెలియజేస్తుంది; నగరంపైనే నేరుగా దాడి చేశారనే భావాన్ని అనవసరంగా బలపరచదు.
- source_word: כְּפַעַם בְּפָעַם
  choice: మునుపటిలాగే
  rationale: ‘ప్రతి మునుపటి సందర్భంలోలాగా’ అనే హెబ్రీయ నుడికారాన్ని సంక్షిప్తంగా, సహజంగా అందిస్తుంది.
