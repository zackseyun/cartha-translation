  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరతను నిలుపుతూ సాధారణ పాఠకులకు అర్థమయ్యే వాక్య నిర్మాణం. మూలంలోని ‘కుమారులు’ అనే సమాంతర బంధుత్వ భాషను ప్రధాన పాఠ్యంలో ఉంచి, సహజమైన జాతినామ రూపాలను పాదటిప్పణిలో ఇచ్చింది.
