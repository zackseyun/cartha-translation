  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కథన శైలి వాడబడింది. ‘ఇదిగో’ మూలంలోని ఆకస్మిక దృశ్యబలాన్ని నిలుపుతుంది. పట్టణం ‘ఎగసిపోవడం’ అనే మూల చిత్రణను ప్రధాన పాఠ్యంలో నిలిపి, దాని సందర్భార్థాన్ని పాదసూచికలో వివరించాం.
