source:
  edition: WLC
  text: וְ/הַ/מַּשְׂאֵ֗ת הֵחֵ֛לָּה לַ/עֲל֥וֹת מִן הָ/עִ֖יר עַמּ֣וּד עָשָׁ֑ן וַ/יִּ֤פֶן בִּנְיָמִן֙ אַחֲרָ֔י/ו וְ/הִנֵּ֛ה עָלָ֥ה כְלִיל הָ/עִ֖יר הַ/שָּׁמָֽיְמָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/040.yaml
  text: But the signal began to rise from the city as a pillar of smoke[a], and Benjamin turned behind him, and behold[c][b], the whole city was going up to the heavens.
translation:
  language: te
  text: కాని పట్టణం నుండి సంకేతం పొగ స్తంభంలా పైకి లేవడం మొదలైంది.[a] బెన్యామీనీయులు వెనక్కి తిరిగారు.[b] ఇదిగో, పట్టణమంతా ఆకాశానికి ఎగసిపోతోంది.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పట్టణం నుండి సంకేత దీపం పొగ స్తంభంలా పైకి లేవడం మొదలైంది.” హీబ్రూ పదం పైకి ఎత్తబడిన దానిని సూచించగలదు; ఇక్కడ అది ముందుగా నిర్ణయించిన యుద్ధ సంకేతాన్ని సూచిస్తున్నట్లు కనిపిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా, “బెన్యామీను తన వెనుకకు తిరిగాడు.” ‘బెన్యామీను’ ఇక్కడ గోత్ర ప్రజలను సమష్టిగా సూచిస్తుంది. వారు వెనక్కి తిరిగారని లేదా వెనుకకు చూడడానికి తిరిగారని దీని భావం కావచ్చు.
    reason: lexical_alternative
  - marker: c
    text: లేదా, “పట్టణమంతా ఆకాశం వరకు ఎగసిపోయింది,” అంటే మంటలు, పొగ పైకి ఎగసిపోయాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּשְׂאֵת
  choice: సంకేతం
  rationale: యుద్ధ సందర్భంలో ఇది మాటువేసినవారు ముందుగా నిర్ణయించిన సూచనను సూచిస్తుంది. ‘సంకేతం’ దాని సమాచార విధిని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; ‘జ్యోతి సంకేతం’ కూడా సాధ్యమే.
- source_word: הֵחֵלָּה לַעֲלוֹת
  choice: పైకి లేవడం మొదలైంది
  rationale: ఈ క్రియా నిర్మాణం చర్య ఆరంభాన్నీ పైకి కదలడాన్నీ తెలియజేస్తుంది; పొగ సందర్భంలో ఈ తెలుగు ప్రయోగం సహజంగా ఉంటుంది.
- source_word: עַמּוּד עָשָׁן
  choice: పొగ స్తంభంలా
  rationale: నిలువుగా పైకి ఎగసే పొగను సూచించే హీబ్రూ పదబంధానికి ఇది స్పష్టమైన, సుపరిచితమైన తెలుగు రూపం.
- source_word: וַיִּפֶן בִּנְיָמִן אַחֲרָיו
  choice: బెన్యామీనీయులు వెనక్కి తిరిగారు
  rationale: మూలంలో ‘బెన్యామీను’ గోత్రాన్ని ఏకవచన సమష్టిగా సూచిస్తుంది. తెలుగులో గోత్ర సైన్యాన్ని స్పష్టంగా సూచించేందుకు బహువచనం వాడబడింది; ‘చూశారు’ అని జోడించకుండా ‘తిరిగారు’ అనే క్రియా భావం నిలుపబడింది.
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: అకస్మాత్తుగా గ్రహించిన దృశ్యానికి ఉన్న నాటకీయ బలాన్ని ‘ఇదిగో’ సహజంగా తెలియజేస్తుంది.
- source_word: עָלָה
  choice: ఎగసిపోతోంది
  rationale: బెన్యామీనీయుల కళ్లముందు కొనసాగుతున్న దృశ్యాన్ని ఇది వ్యక్తపరుస్తుంది; నగరం పైకి వెళ్తున్నదనే మూలంలోని గాఢమైన చిత్రణను వెంటనే వివరణాత్మకంగా మార్చదు.
- source_word: כְלִיל הָעִיר
  choice: పట్టణమంతా
  rationale: పట్టణం సంపూర్ణంగా ప్రభావితమైందనే సమగ్రతను సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: הַשָּׁמָיְמָה
  choice: ఆకాశం వైపు
  rationale: దిశను సూచించే హీబ్రూ రూపాన్ని సహజమైన తెలుగులో నిలుపుతుంది; సందర్భంలో మంటలూ పొగా పైకి ఎగసిపోవడం ఉద్దేశించబడింది.
