  yaml_path: translation/ot/judges/020/021.yaml
  text: Then the sons of Benjamin came out from Gibeah and struck down twenty-two thousand men of Israel that day[a].
translation:
  language: te
  text: అప్పుడు బెన్యామీను గోత్రస్థులు గిబియా నుండి బయటికి వచ్చి, ఆ రోజున ఇశ్రాయేలీయులలో ఇరవై రెండు వేల మందిని నేలకూల్చారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “గిబియా నుండి బయటికి వచ్చి, ఆ రోజున ఇశ్రాయేలీయులలో ఇరవై రెండు వేల మందిని నేలకు పడగొట్టి చంపారు.”
    reason: וַיַּשְׁחִיתוּ యుద్ధసందర్భంలో ‘చంపారు’ అనే స్పష్టమైన భావాన్ని కలిగించవచ్చు; אָרְצָה యొక్క నేలకు పడగొట్టే చిత్రణను ప్రత్యామ్నాయంలో నిలిపాం.
lexical_decisions:
- source_word: וַיֵּצְאוּ
  choice: బయలుదేరి వచ్చి
  rationale: יצא అనే క్రియ ఇక్కడ గిబియా పట్టణం నుండి యుద్ధానికి వెలుపలికి రావడాన్ని సూచిస్తుంది. తెలుగు కథన ప్రవాహంలో ‘బయలుదేరి వచ్చి’ సహజంగా ఉండి, సైనిక దాడి సందర్భాన్ని నిలుపుతుంది.
- source_word: בְנֵי בִנְיָמִן
  choice: బెన్యామీను వంశస్థులు
  rationale: అక్షరార్థంగా ‘బెన్యామీను కుమారులు’ అయినప్పటికీ, ఇక్కడ గోత్రానికి చెందిన యోధులు/ప్రజలు ఉద్దేశం. ‘వంశస్థులు’ ఆధునిక తెలుగులో స్పష్టంగా ఉండి గోత్ర సంబంధాన్ని కాపాడుతుంది.
- source_word: מִן הַגִּבְעָה
  choice: గిబియా నుండి
  rationale: מן మూలస్థానాన్ని సూచిస్తుంది; స్థలనామాన్ని ‘గిబియా’గా లిప్యంతరీకరించాం.
- source_word: וַיַּשְׁחִיתוּ
  choice: నేలకూల్చారు
  rationale: שׁחת హిఫీల్ రూపం నాశనం చేయడం లేదా చంపడం అనే భావాన్ని ఇస్తుంది. యుద్ధంలో మరణించిన వారి సంఖ్యతో పాటు אָרְצָה (‘నేలవైపు/నేలకు’) ఉండటంతో ‘నేలకూల్చారు’ ప్రాణాంతక దెబ్బను, మూలంలోని దృశ్యాన్ని రెండింటినీ సహజంగా తెలియజేస్తుంది.
- source_word: בְיִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులలో
  rationale: ఇక్కడ ב ఇశ్రాయేలు పక్షంలో సంభవించిన నష్టాన్ని సూచిస్తుంది. ‘ఇశ్రాయేలీయులలో ... మందిని’ తెలుగు వాక్యనిర్మాణంలో సహజంగా ఉంది.
- source_word: בַּיּוֹם הַהוּא
  choice: ఆ రోజు
  rationale: కాల సూచనను సంక్షిప్తమైన, సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: שְׁנַיִם וְעֶשְׂרִים אֶלֶף אִישׁ
  choice: ఇరవై రెండు వేల మందిని
  rationale: హెబ్రీ సంఖ్యను సాధారణ తెలుగు సంఖ్యా క్రమంలో ఇచ్చాం; אישׁ సంఖ్యానంతరం ఏకవచనంలో ఉన్నా, తెలుగులో ‘మంది’ సహజమైన వ్యక్తి-సంఖ్యావాచకం.
- source_word: אָרְצָה
  choice: నేలకూల్చారు
  rationale: దిశార్థక రూపం ‘నేలకు/నేలవైపు’ అనే చిత్రాన్ని ఇస్తుంది. దాన్ని ప్రధాన క్రియతో కలిపి ‘నేలకూల్చారు’గా అందించడం ద్వారా మూలంలోని దృశ్యాన్ని అతిశయోక్తి లేకుండా నిలిపాం.
