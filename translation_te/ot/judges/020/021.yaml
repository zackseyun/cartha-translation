translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘బెన్యామీను కుమారులు’ అనే అక్షరానువాదం కంటే సాధారణ పాఠకులకు గోత్రార్థం స్పష్టమయ్యేలా ‘బెన్యామీను వంశస్థులు’ ఎంచుకున్నాం. మూలంలోని אָרְצָה చిత్రాన్ని ప్రధాన పాఠ్యంలో ‘నేలకూల్చారు’ ద్వారా నిలిపి, మరింత ప్రత్యక్షమైన ‘చంపారు’ను పాదటిప్పణిలో ఇచ్చాం.
