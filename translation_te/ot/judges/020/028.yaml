- from: ఆ రోజుల్లో అహరోను కుమారుడైన ఎలియాజరు కుమారుడు ఫీనెహాసు దాని ఎదుట నిలబడి[a], “నా సహోదరుడైన బెన్యామీను సంతతివారితో యుద్ధం చేయడానికి నేను మళ్లీ బయలుదేరాలా, లేక మానుకోవాలా?” అని అడిగాడు. యెహోవా, “వెళ్లండి; రేపు అతణ్ణి మీ చేతికి అప్పగిస్తాను[b]” అని చెప్పాడు.
  to: ఆ రోజుల్లో అహరోను కుమారుడైన ఎలియాజరు కుమారుడు ఫీనెహాసు దాని ఎదుట నిలబడి[a], “నా సహోదరుడైన బెన్యామీను వంశస్థులతో యుద్ధం చేయడానికి నేను మళ్లీ బయలుదేరాలా, లేక మానుకోవాలా?” అని అడిగాడు. యెహోవా, “మీరు వెళ్లండి; రేపు అతనిని నీ చేతికి అప్పగిస్తాను[b]” అని చెప్పాడు.
  rationale: సురక్షితమైన, అవసరమైన సవరణలు మాత్రమే చేశాను. యెహోవా సమాధానంలో మూల హీబ్రూ సంఖ్యా మార్పు—బహువచన ఆజ్ఞతో ఏకవచన స్వత్వప్రత్యయం—తెలుగులో నిలిపాను. బెన్యామీను గోత్రసూచనను స్పష్టపరిచాను; పాదటిప్పణి (b)ని సమష్టి ఏకవచనం మరియు సంఖ్యా మార్పుకు పరిమితం చేశాను. మందసం/యెహోవా అనే సర్వనామ అస్పష్టతను పాదటిప్పణి (a)లో యథాతథంగా కాపాడాను.
