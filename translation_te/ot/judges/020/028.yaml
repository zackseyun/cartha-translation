source:
  edition: WLC
  text: וּ֠/פִינְחָס בֶּן אֶלְעָזָ֨ר בֶּֽן אַהֲרֹ֜ן עֹמֵ֣ד לְ/פָנָ֗י/ו בַּ/יָּמִ֣ים הָ/הֵם֮ לֵ/אמֹר֒ הַ/אוֹסִ֨ף ע֜וֹד לָ/צֵ֧את לַ/מִּלְחָמָ֛ה עִם בְּנֵֽי בִנְיָמִ֥ן אָחִ֖/י אִם אֶחְדָּ֑ל וַ/יֹּ֤אמֶר יְהוָה֙ עֲל֔וּ כִּ֥י מָחָ֖ר אֶתְּנֶ֥/נּוּ בְ/יָדֶֽ/ךָ־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/028.yaml
  text: And Phinehas the son of Eleazar[a], son of Aaron, stood before him in those days, saying, “Shall I yet again go out to battle against the sons of Benjamin my brother, or shall I stop?” And Yahweh said, “Go up[c][b], for tomorrow I will give him into your hand.”
translation:
  language: te
  text: ఆ రోజుల్లో అహరోను కుమారుడైన ఎలియాజరు కుమారుడు ఫీనెహాసు దాని ఎదుట నిలబడి[a], “నా సహోదరుడైన బెన్యామీను వంశస్థులతో యుద్ధం చేయడానికి నేను మళ్లీ బయలుదేరాలా, లేక మానుకోవాలా?” అని అడిగాడు. యెహోవా, “మీరు వెళ్లండి; రేపు అతనిని నీ చేతికి అప్పగిస్తాను[b]” అని చెప్పాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆయన ఎదుట నిలబడి.” ఇక్కడి సర్వనామం మునుపటి వచనంలోని మందసాన్ని గానీ యెహోవాను గానీ సూచించవచ్చు.
    reason: alternative_reading
  - marker: b
    text: “అతనిని” అనేది బెన్యామీను గోత్రాన్ని సమష్టిగా సూచించే ఏకవచనం. హీబ్రూలో “మీరు వెళ్లండి” బహువచనంగా, “నీ చేతికి” ఏకవచనంగా ఉన్నాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפִינְחָס בֶּן אֶלְעָזָר בֶּן אַהֲרֹן
  choice: అహరోను కుమారుడైన ఎలియాజరు కుమారుడు ఫీనెహాసు
  rationale: యాజక వంశావళిలోని రెండు తరాలనూ నిలుపుతూ, తెలుగులో సహజమైన సంబంధక్రమాన్ని ఉపయోగించాం.
- source_word: עֹמֵד לְפָנָיו
  choice: దాని ఎదుట నిలబడి
  rationale: మునుపటి వచనంలో ప్రస్తావించిన ఒడంబడిక మందసాన్ని సర్వనామ సూచనగా తీసుకున్నాం. అయితే యెహోవాను సూచించే అవకాశాన్ని పాదటిప్పణిలో నిలిపాం.
- source_word: הַאוֹסִף עוֹד לָצֵאת לַמִּלְחָמָה
  choice: యుద్ధం చేయడానికి నేను మళ్లీ బయలుదేరాలా
  rationale: יסף + עוד పునరావృత చర్యను సూచిస్తుంది; సైనిక సందర్భంలోని 'బయలుదేరు' భావాన్ని కూడా నిలిపాం.
- source_word: עִם בְּנֵי בִנְיָמִן אָחִי
  choice: నా సహోదరుడైన బెన్యామీను సంతతివారితో
  rationale: యుద్ధ సందర్భంలో עִם ప్రతిపక్ష సంబంధాన్ని సూచించినా, తెలుగులో 'వారితో యుద్ధం' సహజంగా ప్రతిఘటన భావాన్ని ఇస్తుంది. אָחִי లోని అంతర్యుద్ధపు బంధుత్వ ఉద్వేగాన్ని 'నా సహోదరుడైన' అని నిలిపాం.
- source_word: אִם אֶחְדָּל
  choice: లేక మానుకోవాలా?
  rationale: חדל యొక్క ఆపడం/విరమించడం అనే భావాన్ని సాధారణ ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: וַיֹּאמֶר יְהוָה
  choice: యెహోవా ... అని చెప్పాడు
  rationale: దైవనామాన్ని 'యెహోవా'గా లిప్యంతరీకరించి, తెలుగు ప్రత్యక్ష వాక్య నిర్మాణానికి అనుగుణంగా వాక్యాంతంలో క్రియను ఉంచాం.
- source_word: עֲלוּ
  choice: వెళ్లండి
  rationale: బహువచన ఆజ్ఞను నిలిపాం. עלה అక్షరార్థంగా 'పైకి వెళ్లండి' అయినా, ఇక్కడ యుద్ధానికి ముందుకు వెళ్లే భావంలో సహజ తెలుగు కోసం 'వెళ్లండి' ఎంచుకున్నాం.
- source_word: אֶתְּנֶנּוּ בְיָדֶךָ
  choice: అతణ్ణి మీ చేతికి అప్పగిస్తాను
  rationale: ఏకవచన ప్రత్యయాన్ని నిలిపి, బెన్యామీనును సమూహ ఏకవచనంగా సూచించే మూలపాఠపు రూపాన్ని కాపాడాం; 'చేతికి అప్పగించు' విజయాధీనతను తెలిపే సహజ తెలుగు నుడికారం.
theological_decisions:
- issue: לְפָנָיו లోని సర్వనామానికి పూర్వపదం
  choice: మునుపటి వచనంలోని ఒడంబడిక మందసం—'దాని ఎదుట'
  alternative: యెహోవా—'ఆయన ఎదుట'
  rationale: సమీప సందర్భంలో మందసం ప్రత్యక్ష పూర్వపదంగా ఉంది; అయినా దేవుని సన్నిధిలో యాజక సేవ అనే భావంతో యెహోవాను సూచించే పఠనం కూడా సాధ్యమే. ఈ అస్పష్టతను పాదటిప్పణిలో కాపాడాం.
- issue: יְהוָה దైవనామం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: హీబ్రూ వ్యక్తిగత దైవనామాన్ని బిరుదుగా మార్చకుండా తెలుగులో ప్రాచుర్యమున్న లిప్యంతరీకరణతో ఇచ్చాం.
- issue: אֶתְּנֶנּוּ లోని ఏకవచన సూచన
  choice: అతణ్ణి
  alternative: వారిని
  rationale: మూలంలోని వ్యాకరణ ఏకవచనాన్ని నిలిపి, బెన్యామీను గోత్రాన్ని సమష్టిగా వ్యక్తీకరించే ఉద్వేగాన్ని సంరక్షించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి. వంశావళి, అంతర్యుద్ధంలోని బంధుత్వ భాష, సమూహ ఏకవచనం, సర్వనామ సూచనలోని అస్పష్టతలను సాధ్యమైనంతవరకు నిలిపాం.
