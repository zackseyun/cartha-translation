source:
  edition: WLC
  text: וְ/אִ֨ישׁ יִשְׂרָאֵ֜ל שָׁ֣בוּ אֶל בְּנֵ֤י בִנְיָמִן֙ וַ/יַּכּ֣וּ/ם לְ/פִי חֶ֔רֶב מֵ/עִ֤יר מְתֹם֙ עַד בְּהֵמָ֔ה עַ֖ד כָּל הַ/נִּמְצָ֑א גַּ֛ם כָּל הֶ/עָרִ֥ים הַ/נִּמְצָא֖וֹת שִׁלְּח֥וּ בָ/אֵֽשׁ־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/048.yaml
  text: And the men of Israel turned back against the sons of Benjamin and struck them with the edge of the sword[a], from each city, men to livestock, even all that was found[c][b]. Also all the cities that were found they set on fire.
translation:
  language: te
  text: ఇశ్రాయేలు పురుషులు తిరిగి బెన్యామీనీయుల మీదికి వెళ్లి, కత్తి ధారతో పట్టణంలోని వారినంతటిని మొదలుకొని పశువుల వరకు, అక్కడ కనిపించిన సమస్తాన్నీ కొట్టారు.[a][b] అంతేకాక, వారు కనుగొన్న పట్టణాలన్నిటికీ నిప్పు పెట్టారు.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ మూలంలో అక్షరార్థంగా ‘బెన్యామీను కుమారులు’; అంటే బెన్యామీను గోత్రస్థులు.
    reason: lexical_alternative
  - marker: b
    text: ‘పట్టణంలోని వారినంతటిని’ అని అనువదించిన హీబ్రూ పదబంధం క్లిష్టమైనది. బహుశా పట్టణ నివాసులందరినీ, పశువులను, అక్కడ దొరికిన మిగతా సమస్తాన్ని వారు కొట్టారని భావం.
    reason: source_ambiguity
  - marker: c
    text: హీబ్రూ జాతీయం అక్షరార్థంగా ‘అగ్నిలోకి పంపారు’; భావం ‘తగులబెట్టారు’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ יִשְׂרָאֵל
  choice: ఇశ్రాయేలు పురుషులు
  rationale: ఏకవచన రూపంలోని אִישׁ ఇక్కడ బహువచన క్రియతో సమూహార్థంలో ఉంది; యుద్ధంలో పాల్గొన్న పురుషులను సందర్భానుసారంగా స్పష్టంగా సూచిస్తుంది.
- source_word: שָׁבוּ אֶל בְּנֵי בִנְיָמִן
  choice: తిరిగి బెన్యామీనీయుల మీదికి వెళ్లి
  rationale: שׁוב కదలిక వెనక్కి మళ్లడాన్ని సూచిస్తుంది; తరువాతి దాడి క్రియ కారణంగా אֶל‌కు తెలుగులో సహజమైన ప్రతికూల దిశార్థం ‘మీదికి’ ఇచ్చాం.
- source_word: וַיַּכּוּם לְפִי חֶרֶב
  choice: కత్తివాత హతమార్చారు
  rationale: נכה విస్తృతార్థకమైనా, ఈ సందర్భంలో కత్తితో జరిగిన ప్రాణాంతక సంహారాన్ని సూచిస్తుంది. ‘కత్తివాత’ అనే తెలుగు ప్రయోగం ‘కత్తి నోరు/అంచు’ అనే హీబ్రూ జాతీయాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: מֵעִיר מְתֹם
  choice: పట్టణంలోని వారినంతటిని మొదలుకొని
  rationale: ఈ హీబ్రూ పదబంధం క్లిష్టమైనది. מְתֹם సంపూర్ణతను సూచించే అవకాశముంది; తరువాత పశువులు, కనిపించిన సమస్తం అని పరిధి విస్తరించడంతో, పట్టణంలోని మానవ నివాసుల సంపూర్ణ సంహారం అనే సందర్భార్థాన్ని పాఠ్యంలో సహజంగా తెలిపాం, అనిశ్చితిని పాదసూచికలో నిలిపాం.
- source_word: עַד בְּהֵמָה עַד כָּל הַנִּמְצָא
  choice: పశువుల వరకు, అక్కడ కనిపించిన సమస్తాన్నీ
  rationale: రెండుసార్లు వచ్చిన עַד సంహార పరిధి మనుషుల నుంచి పశువులకు, అక్కడ దొరికిన సమస్తానికి విస్తరించిందని తెలియజేస్తుంది.
- source_word: גַּם כָּל הֶעָרִים הַנִּמְצָאוֹת
  choice: అంతేకాక, వారు కనుగొన్న పట్టణాలన్నిటికీ
  rationale: מצא రూపం ఇశ్రాయేలీయులు ఎదుర్కొన్న లేదా కనుగొన్న పట్టణాలను సూచిస్తుంది; తెలుగు వాక్యనిర్మాణంలో కర్తను స్పష్టంచేయడానికి ‘వారు’ చేర్చాం.
- source_word: שִׁלְּחוּ בָאֵשׁ
  choice: నిప్పు పెట్టారు
  rationale: అక్షరార్థంగా ‘అగ్నిలోకి పంపారు’ అనే జాతీయం; ఆధునిక తెలుగులో అదే చర్యను సహజంగా, స్పష్టంగా ‘నిప్పు పెట్టారు’ అంటారు.
