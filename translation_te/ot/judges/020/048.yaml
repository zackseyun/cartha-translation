  register: ఆధునిక ప్రామాణిక తెలుగు; కథనానికి తగిన గంభీరతను ఉంచుతూ సాధారణ పాఠకులకు అర్థమయ్యే పదజాలం వాడాం. క్లిష్టమైన מֵעִיר מְתֹם పదబంధాన్ని అతిగా నిశ్చయించకుండా పాదసూచికలో దాని అనిశ్చితిని తెలియజేశాం.
