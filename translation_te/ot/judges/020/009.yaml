translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సభలో ప్రకటించే నిర్ణయానికి తగిన గంభీరతను ఉంచుతూ సాధారణ పాఠకునికి అర్థమయ్యే భాష వాడబడింది. మూలంలోని సంక్షిప్తతను పాదసూచికలో సంరక్షించి, ప్రధాన వాక్యంలో అవసరమైనంత మాత్రమే స్పష్టీకరించబడింది.
