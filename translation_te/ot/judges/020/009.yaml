source:
  edition: WLC
  text: וְ/עַתָּ֕ה זֶ֣ה הַ/דָּבָ֔ר אֲשֶׁ֥ר נַעֲשֶׂ֖ה לַ/גִּבְעָ֑ה עָלֶ֖י/הָ בְּ/גוֹרָֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/009.yaml
  text: 'But now this is what we will do to Gibeah: against it by lot[a].'
translation:
  language: te
  text: 'అయితే, ఇప్పుడు గిబియాకు మనం చేయబోయేది ఇదే: చీట్ల ద్వారా దానికి వ్యతిరేకంగా చర్య తీసుకుంటాం[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “చీట్లు వేసి దానికి వ్యతిరేకంగా చర్య తీసుకుంటాం.” హీబ్రూ వాక్యం సంక్షిప్తంగా ఉంది; గిబియాకు వ్యతిరేకంగా చేపట్టే చర్యను చీట్లు వేసి నిర్ణయించడం లేదా కేటాయించడం దీని భావం కావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: అయితే ఇప్పుడు
  rationale: తదుపరి కార్యాచరణకు మార్పును సూచించే కాలార్థంతో కూడిన స్వల్ప వ్యతిరేక భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: זֶה הַדָּבָר אֲשֶׁר נַעֲשֶׂה
  choice: మనం చేయబోయేది ఇదే
  rationale: హీబ్రూ సూచక–నామవాచక–సంబంధ వాక్య నిర్మాణాన్ని సహజమైన తెలుగులో అందిస్తూ, ఉద్దేశించిన భవిష్యత్ కార్యాన్ని నిలుపుతుంది.
- source_word: לַגִּבְעָה
  choice: గిబియాకు
  rationale: ל ఉపసర్గ సూచించే కార్యలక్ష్యాన్ని సాధ్యమైనంత సమీపంగా ఉంచుతుంది; తరువాతి పదబంధం శత్రుత్వ దిశను స్పష్టం చేస్తుంది.
- source_word: עָלֶיהָ
  choice: దానికి వ్యతిరేకంగా
  rationale: పట్టణాన్ని లక్ష్యంగా చేసుకున్న సైనిక సందర్భంలో על కలిగిన శత్రుత్వ భావాన్ని తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: בְּגוֹרָל
  choice: చీట్లు వేసి
  rationale: గోరాల్ ద్వారా నిర్ణయించడం లేదా బాధ్యతలను కేటాయించడం అనే భావాన్ని సాధారణ పాఠకునికి స్పష్టమైన తెలుగు ప్రయోగంతో అందిస్తుంది.
- source_word: עָלֶיהָ בְּגוֹרָל
  choice: చీట్లు వేసి దానికి వ్యతిరేకంగా చర్య తీసుకుందాం
  rationale: హీబ్రూ సంక్షిప్త, క్రియారహిత పదబంధంలోని భావాన్ని తెలుగులో అర్థవంతం చేయడానికి కనిష్ఠ పూరణ చేస్తుంది; 'దాడి చేద్దాం' అని మరీ నిర్దిష్టంగా వ్యాఖ్యానించదు.
