translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా, అయితే వచన గాంభీర్యం నిలిచేలా అనువదించబడింది. మూలంలోని యుద్ధ తీవ్రతనూ, బెన్యామీనీయులకు తెలియకుండానే విపత్తు చేరువవుతున్న ఉద్వేగాన్నీ కాపాడింది.
