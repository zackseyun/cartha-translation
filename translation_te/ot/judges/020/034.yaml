  text: וַ/יָּבֹאוּ֩ מִ/נֶּ֨גֶד לַ/גִּבְעָ֜ה עֲשֶׂרֶת֩ אֲלָפִ֨ים אִ֤ישׁ בָּחוּר֙ מִ/כָּל יִשְׂרָאֵ֔ל וְ/הַ/מִּלְחָמָ֖ה כָּבֵ֑דָה וְ/הֵם֙ לֹ֣א יָדְע֔וּ כִּֽי נֹגַ֥עַת עֲלֵי/הֶ֖ם הָ/רָעָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/034.yaml
  text: Then ten thousand chosen men from all Israel came against Gibeah[a], and the battle was fierce; but they did not know that disaster was closing in on them.
translation:
  language: te
  text: అప్పుడు ఇశ్రాయేలీయులందరిలో నుంచి పదివేలమంది ఎంపికైన యోధులు గిబియాకు ఎదురుగా వచ్చారు. యుద్ధం తీవ్రంగా సాగింది; అయితే విపత్తు తమ మీదికి చేరువవుతోందని బెన్యామీనీయులకు తెలియలేదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “విపత్తు తమ మీదికి వచ్చి చేరుతోందని.” హీబ్రూ వాక్యం అక్షరార్థంగా “విపత్తు వారిని తాకుతోంది/చేరుతోంది” అని చెబుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנֶּגֶד לַגִּבְעָה
  choice: గిబియా మీదికి
  rationale: מִנֶּגֶד ప్రాథమికంగా ‘ఎదురుగా/ముందుగా’ అనే స్థానార్థాన్ని కలిగించినా, ఇక్కడ యుద్ధ సందర్భంలో గిబియాపై దాడికి రావడాన్ని సూచిస్తుంది. ‘మీదికి’ ఆధునిక తెలుగులో ఆ ప్రతికూల సైనిక భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: עֲשֶׂרֶת אֲלָפִים אִישׁ בָּחוּר
  choice: ఎంపిక చేయబడిన పదివేల మంది
  rationale: בָּחוּר ఇక్కడ కేవలం యువకులను కాక, యుద్ధానికి ఎంపిక చేసిన శ్రేష్ఠ సైనికులను సూచిస్తుంది. ‘ఎంపిక చేయబడిన’ మూలంలోని సైనిక ఎంపిక భావాన్ని కాపాడుతుంది.
- source_word: מִכָּל יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులందరిలో నుంచి
  rationale: ఈ దళం ఇశ్రాయేలు సమస్త ప్రజలలో నుంచి సమకూర్చబడిందనే భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וְהַמִּלְחָמָה כָּבֵדָה
  choice: యుద్ధం తీవ్రంగా సాగింది
  rationale: כָּבֵדָה ఇక్కడ భౌతికమైన ‘బరువు’ను కాక యుద్ధ తీవ్రతను సూచిస్తుంది. ‘తీవ్రంగా సాగింది’ ప్రస్తుత తెలుగు వాడుకలో స్పష్టంగా, సహజంగా ఉంది.
- source_word: וְהֵם לֹא יָדְעוּ
  choice: అయితే ... వారికి తెలియలేదు
  rationale: వావ్‌ను సందర్భానుసారమైన వ్యతిరేక సంబంధంతో ‘అయితే’గా అనువదించడం, తీవ్రమైన పోరాటానికి మరియు బెన్యామీనీయుల అజ్ఞానానికి మధ్య ఉన్న వ్యత్యాసాన్ని స్పష్టం చేస్తుంది.
- source_word: כִּי נֹגַעַת עֲלֵיהֶם הָרָעָה
  choice: విపత్తు తమను సమీపిస్తోందని
  rationale: נגע యొక్క మౌలిక భావం ‘తాకడం/చేరడం’; הָרָעָה ఇక్కడ నైతిక దుష్టత్వం కాక సంభవించబోయే విపత్తు. ‘సమీపిస్తోంది’ దాని క్రమంగా చేరుకొస్తున్న భావాన్ని సహజంగా అందిస్తుంది.
