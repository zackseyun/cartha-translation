  register: ఆధునిక ప్రామాణిక తెలుగు; కథనానికి తగిన గంభీరతతో సాధారణ పాఠకులకు సహజంగా ఉండే పదక్రమం. హీబ్రూలోని సమూహ ఏకవచన ‘బెన్యామీను’ను తెలుగులో సందర్భానుసారంగా బహువచన ప్రజానామంగా ఇచ్చాం.
