base_translation:
  language: en
  yaml_path: translation/ot/judges/020/025.yaml
  text: Benjamin came out from Gibeah to meet them on the second day[a], and they struck down another eighteen thousand men of Israel to the ground[b]; all these were drawing the sword.
translation:
  language: te
  text: రెండవ రోజున బెన్యామీనీయులు గిబియా నుండి వారిని ఎదుర్కోవడానికి[a] బయటికి వచ్చారు. వారు ఇశ్రాయేలీయుల్లో మరో పద్దెనిమిది వేలమందిని నేలకూల్చారు; వారందరూ కత్తిని ఒరనుండి తీసినవారే.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారిని కలుసుకోవడానికి.” హీబ్రూ పదబంధం యుద్ధ సందర్భంలో శత్రువును ఎదుర్కోవడాన్ని కూడా సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא בִנְיָמִן
  choice: బెన్యామీనీయులు ... బయలుదేరి వచ్చారు
  rationale: ‘బెన్యామీను’ ఇక్కడ సమూహంగా క్రియకు కర్త; తెలుగులో ప్రజలను సూచించే ‘బెన్యామీనీయులు’ సహజంగా ఉంటుంది. יצא యొక్క బయలుదేరడం/బయటికి రావడం భావాన్ని నిలుపుతుంది.
- source_word: לִקְרָאתָם
  choice: వారిని ఎదుర్కోవడానికి
  rationale: לקראת అనేది కలుసుకోవడం లేదా ఎదుర్కోవడం రెండింటినీ సూచించగలదు. యుద్ధ సందర్భంలో ‘ఎదుర్కోవడానికి’ సహజం; ప్రత్యామ్నాయ భావాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: מִן הַגִּבְעָה
  choice: గిబియా నుండి
  rationale: స్థలమునుండి బయలుదేరిన భావాన్ని నేరుగా తెలియజేస్తుంది; స్థలనామాన్ని లిప్యంతరీకరించాం.
- source_word: בַּיּוֹם הַשֵּׁנִי
  choice: రెండవ రోజున
  rationale: హీబ్రూ క్రమసంఖ్యా వ్యక్తీకరణకు నేరమైన, సహజమైన తెలుగు రూపం.
- source_word: וַיַּשְׁחִיתוּ
  choice: నేలకూల్చారు
  rationale: שׁחת హిఫీల్ యుద్ధ సందర్భంలో నాశనం చేయడం/చంపడం అనే భావం ఇస్తుంది. తరువాతి אָרְצָהతో కలిసి ‘నేలకూల్చారు’ మరణకరమైన యుద్ధ చర్యను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בִבְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయుల్లో
  rationale: ప్రభావిత సమూహంలోనుండి నష్టపోయినవారిని సూచించే ב భావాన్ని తెలుగులో సహజంగా అందిస్తుంది. בני־ישראל అనే జాతీయ-వంశీయ పదబంధాన్ని ‘ఇశ్రాయేలీయులు’గా వ్యక్తం చేస్తుంది.
- source_word: עוֹד שְׁמֹנַת עָשָׂר אֶלֶף אִישׁ
  choice: మరో పద్దెనిమిది వేలమందిని
  rationale: עוֹד యొక్క అదనపు సంఖ్య భావాన్ని ‘మరో’ స్పష్టంగా చూపుతుంది; איש సంఖ్యతో కలిసి వ్యక్తుల లెక్కను సూచిస్తుంది.
- source_word: אָרְצָה
  choice: నేలకూల్చారు
  rationale: దిశాసూచక రూపం ‘నేలవైపు/నేలకు’ అనే భావం ఇస్తుంది; తెలుగులో క్రియలో సమ్మిళితం చేయడం సహజం.
- source_word: כָּל אֵלֶּה שֹׁלְפֵי חָרֶב
  choice: వారందరూ కత్తి దూసేవారే
  rationale: ‘కత్తిని ఒరనుండి తీయువారు’ అనే భాగధాతు భావాన్ని సంక్షిప్తంగా, సజీవంగా నిలుపుతుంది; వీరు యుద్ధానికి సిద్ధమైన కత్తిధారులని సూచిస్తుంది.
