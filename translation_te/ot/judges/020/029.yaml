  text: So Israel set men in ambush around Gibeah[a].
translation:
  language: te
  text: ఇశ్రాయేలు గిబియా చుట్టూ మాటుకాచినవారిని ఉంచింది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ: ‘గిబియా వైపు/చుట్టూ మాటుకాచినవారిని ఉంచింది.’ ఈ వ్యక్తీకరణ నగరం చుట్టుపక్కల మాటుదాడి దళాన్ని స్థానాల్లో ఉంచడాన్ని సూచిస్తుంది.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: నియమించింది
  rationale: שׂוּם అనే క్రియకు ‘పెట్టు, ఉంచు, నియమించు’ అనే అర్థాలున్నాయి. ఇక్కడ సైనికులను నిర్దిష్ట స్థానాల్లో ఉంచడాన్ని సహజమైన ఆధునిక తెలుగులో ‘నియమించింది’ తెలియజేస్తుంది.
- source_word: יִשְׂרָאֵל
  choice: ఇశ్రాయేలు
  rationale: ఇక్కడ ఇశ్రాయేలు సైన్యాన్ని సమష్టిగా సూచించే స్థలనామం; వాక్యంలోని క్రియకు అనుగుణంగా సమష్టి ఏకవచనంగా ఉంచబడింది.
- source_word: אֹרְבִים
  choice: మాటువేసి ఉన్నవారిని
  rationale: ארב ధాతువునుండి వచ్చిన ఈ కర్తరి కృదంతం దాగి వేచివున్న వ్యక్తులను సూచిస్తుంది. ‘మాటు’ అనే అమూర్త పదం కంటే వ్యక్తులను స్పష్టంగా నిలుపుతుంది.
- source_word: אֶל ... סָבִיב
  choice: చుట్టూ
  rationale: אֶל సాధారణంగా ‘వైపు’ అని అర్థమిచ్చినా, סָבִיבతో కలిసి ఇక్కడ గిబియాకు సంబంధించి చుట్టుపక్కల స్థానాలను సూచిస్తుంది. సహజ తెలుగులో ‘చుట్టూ’ ఈ సంయుక్త భావాన్ని అందిస్తుంది.
- source_word: הַגִּבְעָה
  choice: గిబియా
  rationale: ఇది గిబియా అనే స్థలనామం. హీబ్రూలో ఉన్న నిర్దిష్ట ఉపపదాన్ని తెలుగు స్థలనామంలో విడిగా వ్యక్తం చేయాల్సిన అవసరం లేదు.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన సైనిక వర్ణన. ‘మాటువేసి ఉన్నవారు’ అని అనువదించడం ద్వారా హీబ్రూ కర్తరి కృదంతంలోని వ్యక్తిగత భావం నిలుపబడింది; అֶל మరియు סָבִיב కలయికలోని ‘వైపు/చుట్టూ’ సూక్ష్మతను పాదటిప్పణిలో సంరక్షించాం.
