translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యేలా సహజమైన వాక్యనిర్మాణం ఉపయోగించబడింది. ‘బెన్యామీను కుమారులు,’ ‘ఇశ్రాయేలు కుమారులు’ అనే మూలభాషా గోత్ర నుడికారాలు ఉద్దేశపూర్వకంగా నిలుపబడ్డాయి. עִם లోని రూపార్థం మరియు యుద్ధసందర్భపు విరోధార్థం మధ్య ఉన్న ఉద్రిక్తతను ప్రధాన పాఠ్యం–పాదసూచిక కలయికలో సంరక్షించాం.
