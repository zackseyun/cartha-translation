source:
  edition: WLC
  text: וַ/יֵּאָסְפ֧וּ בְנֵֽי בִנְיָמִ֛ן מִן הֶ/עָרִ֖ים הַ/גִּבְעָ֑תָ/ה לָ/צֵ֥את לַ/מִּלְחָמָ֖ה עִם בְּנֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/014.yaml
  text: And the sons of Benjamin gathered from the cities to Gibeah to go out to battle against the sons of Israel[a][b].
translation:
  language: te
  text: బెన్యామీను కుమారులు పట్టణాల నుంచి గిబియాకు సమకూడి, ఇశ్రాయేలు కుమారులకు వ్యతిరేకంగా[a] యుద్ధం చేయడానికి బయలుదేరారు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, ‘ఇశ్రాయేలు కుమారులతో.’ అయితే యుద్ధ సందర్భంలో దీనికి ‘ఇశ్రాయేలు కుమారులకు వ్యతిరేకంగా’ అనే అర్థం ఉంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘బెన్యామీనీయులు ... ఇశ్రాయేలీయులకు వ్యతిరేకంగా యుద్ధం చేయడానికి బయలుదేరారు.’ ప్రధాన పాఠ్యం హీబ్రూలోని గోత్ర-కుటుంబ నుడికారం ‘కుమారులు’ను నిలుపుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּאָסְפוּ
  choice: సమకూడి
  rationale: నిఫాల్ రూపం ఒకచోట చేరడం లేదా సమకూడడాన్ని సూచిస్తుంది. తెలుగు వాక్యప్రవాహంలో తరువాతి క్రియతో అనుసంధానించడానికి ‘సమకూడి’ సహజంగా ఉంది.
- source_word: בְנֵי בִנְיָמִן
  choice: బెన్యామీను కుమారులు
  rationale: హీబ్రూ గోత్ర-కుటుంబ నుడికారాన్ని నిలుపుతుంది; ఆధునిక పాఠకునికి ‘బెన్యామీనీయులు’ అనే అర్థం కూడా పాదసూచికలో ఇవ్వబడింది.
- source_word: מִן הֶעָרִים
  choice: పట్టణాల నుంచి
  rationale: מִן మూలస్థానాన్ని సూచిస్తుంది. עָרִיםకు సందర్భానుకూలమైన సహజ తెలుగు పదం ‘పట్టణాలు’.
- source_word: הַגִּבְעָתָה
  choice: గిబియాకు
  rationale: స్థలనామానికి జోడించిన దిశాసూచక ה, గిబియా వైపు కదలికను సూచిస్తుంది; తెలుగులో ‘గిబియాకు’ దాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: לָצֵאת לַמִּלְחָמָה
  choice: యుద్ధం చేయడానికి బయలుదేరారు
  rationale: ‘యుద్ధానికి బయటికి వెళ్లడం’ అనే హీబ్రూ సైనిక నుడికారాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: עִם בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులతో
  rationale: עִם యొక్క ప్రాథమిక రూపార్థమైన ‘తో’ను ప్రధాన పాఠ్యంలో నిలిపి, యుద్ధ సందర్భంలో ఉన్న విరోధార్థాన్ని పాదసూచికలో స్పష్టం చేయడం ద్వారా మూలంలోని పదార్థం మరియు సందర్భార్థం రెండింటినీ కాపాడుతుంది.
