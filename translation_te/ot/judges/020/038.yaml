translation:
  language: te
  text: ఇశ్రాయేలు మనుషులకూ మాటువేసిన దళానికీ మధ్య ముందుగా నిర్ణయించిన సంకేతం ఏమిటంటే, వారు పట్టణం నుండి పెద్ద పొగస్తంభం పైకి లేచేలా చేయాలి[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ముందుగా నిర్ణయించిన ఏర్పాటు’ లేదా ‘ఒప్పుకున్న సంకేతం.’ హెబ్రీ పదం מוֹעֵד సాధారణంగా నిర్ణయించిన సమయాన్ని సూచిస్తుంది; ఇక్కడ అది యుద్ధంలో ముందే ఏర్పరచుకున్న సంకేతాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘ఇశ్రాయేలు మనుషుల కొరకు, మాటువేసిన వారితో.’ భావం ఈ రెండు పక్షాల మధ్య జరిగిన ఏర్పాటే.
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘పెద్ద పొగరాశి.’ హెబ్రీ పదబంధం పట్టణం నుండి స్పష్టంగా పైకి లేచే పొగ సంకేతాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַמּוֹעֵד
  choice: ముందుగా నిర్ణయించిన సంకేతం
  rationale: מוֹעֵד సాధారణంగా నిర్ణయించిన సమయం లేదా సమావేశాన్ని సూచిస్తుంది; ఇక్కడ యుద్ధ సందర్భంలో ముందే ఏర్పరచుకున్న సంకేతాన్ని సూచిస్తుంది.
- source_word: לְאִישׁ יִשְׂרָאֵל עִם הָאֹרֵב
  choice: ఇశ్రాయేలు మనుషులకూ మాటువేసిన దళానికీ మధ్య
  rationale: లְ...עִם నిర్మాణం ఈ ఏర్పాటు జరిగిన రెండు పక్షాలను సూచిస్తుంది. אֹרֵב ఇక్కడ మాటువేసిన వారిని సమష్టిగా సూచిస్తున్నందున ‘మాటువేసిన దళం’ సహజంగా ఉంటుంది.
- source_word: הֶרֶב
  choice: పెద్ద
  rationale: רבה మూలానికి చెందిన ఈ తీవ్రతను తెలిపే రూపం తరువాతి క్రియను బలపరుస్తుంది; తెలుగులో పొగస్తంభ పరిమాణాన్ని ‘పెద్ద’ అని చెప్పడం సహజం.
- source_word: לְהַעֲלוֹתָם
  choice: వారు ... పైకి లేపాలి
  rationale: עלה హిఫీల్ రూపం ‘పైకి వచ్చేలా చేయడం/లేపడం’ అనే భావాన్నిస్తుంది; 3mp ప్రత్యయం సంకేతాన్ని అమలు చేసే వారిని సూచిస్తుంది.
- source_word: מַשְׂאַת הֶעָשָׁן
  choice: పొగస్తంభం
  rationale: ఈ పదబంధం పైకి లేచే, స్పష్టంగా కనిపించే పొగరాశి లేదా పొగస్తంభాన్ని సూచిస్తుంది; సందర్భంలో అది సంకేతంగా పనిచేస్తుంది.
- source_word: מִן הָעִיר
  choice: పట్టణం నుండి
  rationale: పొగ పైకి లేచే ప్రదేశ మూలాన్ని నేరుగా సూచిస్తుంది.
