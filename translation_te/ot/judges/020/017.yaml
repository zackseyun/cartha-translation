source:
  edition: WLC
  text: וְ/אִ֨ישׁ יִשְׂרָאֵ֜ל הִתְפָּֽקְד֗וּ לְ/בַד֙ מִ/בִּנְיָמִ֔ן אַרְבַּ֨ע מֵא֥וֹת אֶ֛לֶף אִ֖ישׁ שֹׁ֣לֵֽף חָ֑רֶב כָּל זֶ֖ה אִ֥ישׁ מִלְחָמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/017.yaml
  text: And the men of Israel[a], apart from Benjamin, were mustered at four hundred thousand men drawing the sword[c][b]; all these were men of war.
translation:
  language: te
  text: బెన్యామీనీయులను మినహాయించి[a], ఇశ్రాయేలు పురుషులు సైనిక సేవ కోసం లెక్కించబడ్డారు[b]—కత్తిని ఒరనుండి తీసే నాలుగు లక్షల మంది[c]; వీరందరూ యోధులు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘బెన్యామీనుకు వేరుగా.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘సైనిక సేవ కోసం సమీకరించబడ్డారు’; హెబ్రీ క్రియ లెక్కించబడడం లేదా సైనిక సేవ కోసం నమోదు చేయబడడం అనే భావాలను సూచించగలదు.
    reason: lexical_alternative
  - marker: c
    text: అక్షరార్థంగా, ‘కత్తిని ఒరనుండి తీసేవారు’; ఇది ఆయుధాలు ధరించిన పోరాట పురుషులను సూచించే హెబ్రీ నుడికారం.
    reason: cultural_note
lexical_decisions:
- source_word: וְאִישׁ יִשְׂרָאֵל
  choice: ఇశ్రాయేలు పురుషులు
  rationale: ఏకవచన రూపంలోని אִישׁ ఇక్కడ బహువచన క్రియతో సమూహార్థంలో వచ్చి, ఇశ్రాయేలు యుద్ధయోగ్య పురుషులను సూచిస్తుంది.
- source_word: הִתְפָּקְדוּ
  choice: లెక్కించబడగా
  rationale: פקד హిత్పయేల్ రూపం సైనిక సందర్భంలో నమోదు చేయడం, లెక్కించడం లేదా సమీకరించడం అనే భావాలను కలిగి ఉంది; తెలుగు వాక్యంలో ‘లెక్కించబడగా’ జనగణన భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: לְבַד מִבִּנְיָמִן
  choice: బెన్యామీనీయులను మినహాయించి
  rationale: ఈ పదబంధం చెప్పబడిన మొత్తం సంఖ్యలో బెన్యామీను గోత్రం చేర్చబడలేదని సూచిస్తుంది; ప్రజలను ఉద్దేశించిన సందర్భానికి ‘బెన్యామీనీయులను’ స్పష్టంగా ఉంటుంది.
- source_word: אַרְבַּע מֵאוֹת אֶלֶף אִישׁ
  choice: నాలుగు లక్షల మంది
  rationale: హెబ్రీ సంఖ్య నాలుగు వందల వేలని సూచిస్తుంది; ఆధునిక తెలుగులో దానికి సహజమైన సమానం ‘నాలుగు లక్షలు’, אִישׁ భావాన్ని ‘మంది’ వ్యక్తపరుస్తుంది.
- source_word: שֹׁלֵף חָרֶב
  choice: కత్తి దూసేవారు
  rationale: అక్షరార్థంగా ‘కత్తిని ఒరనుండి తీసేవారు’; ఇది ఆయుధధారులైన పోరాట పురుషులను సూచించే సైనిక నుడికారం. ‘కత్తి దూసేవారు’ దాని సజీవ రూపకాన్ని నిలుపుతుంది.
- source_word: כָּל זֶה
  choice: వీరందరూ
  rationale: అక్షరార్థంగా ఏకవచన సూచన ఉన్నప్పటికీ, ముందున్న మొత్తం సమూహాన్ని సూచిస్తుంది; తెలుగులో ‘వీరందరూ’ సహజంగా ఆ సమూహార్థాన్ని తెలియజేస్తుంది.
- source_word: אִישׁ מִלְחָמָה
  choice: యుద్ధవీరులు
  rationale: ఇది యుద్ధానికి సిద్ధమైన, అనుభవమున్న పోరాట పురుషులను సూచించే స్థిర సైనిక పదబంధం; ‘యుద్ధవీరులు’ గౌరవప్రదంగా, సంక్షిప్తంగా ఆ భావాన్ని అందిస్తుంది.
