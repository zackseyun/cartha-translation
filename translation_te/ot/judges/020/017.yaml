translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన సైనిక వర్ణన. మూలంలోని సామూహిక పురుషార్థం, సంఖ్య, కత్తి దూయడం అనే నుడికారం నిలుపబడ్డాయి; పాదసూచిక గుర్తులన్నీ ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
