source:
  edition: WLC
  text: וַ/יֵּצֵא֙ אִ֣ישׁ יִשְׂרָאֵ֔ל לַ/מִּלְחָמָ֖ה עִם בִּנְיָמִ֑ן וַ/יַּעַרְכ֨וּ אִתָּ֧/ם אִֽישׁ יִשְׂרָאֵ֛ל מִלְחָמָ֖ה אֶל הַ/גִּבְעָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/020.yaml
  text: The men of Israel went out to battle against Benjamin[a], and the men of Israel drew up for battle against them at Gibeah.
translation:
  language: te
  text: ఇశ్రాయేలు పురుషులు బెన్యామీనుతో యుద్ధం చేయడానికి బయలుదేరారు. ఇశ్రాయేలు పురుషులు గిబియా వద్ద వారికి ఎదురుగా[a] యుద్ధానికి బారులు తీశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూలభాషలో అక్షరార్థంగా ‘వారితో’; యుద్ధ సందర్భంలో ‘వారికి ఎదురుగా’ అనే భావం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: బయలుదేరారు
  rationale: సైనిక చర్య కోసం వెళ్లడాన్ని సూచించే יצא క్రియకు సహజమైన ఆధునిక తెలుగు రూపం; ‘దండెత్తారు’ వంటి అధిక వివరణను చేర్చదు.
- source_word: אִישׁ יִשְׂרָאֵל
  choice: ఇశ్రాయేలు పురుషులు
  rationale: ఏకవచన రూపంలో ఉన్న אִישׁ ఇక్కడ ఇశ్రాయేలు యోధులను సమూహంగా సూచిస్తుంది; యుద్ధ సందర్భంలోని పురుష సూచనను నిలుపుతుంది.
- source_word: לַמִּלְחָמָה
  choice: యుద్ధం చేయడానికి
  rationale: ఈ ఉపసర్గ పదబంధం యుద్ధానికి బయలుదేరిన ఉద్దేశాన్ని తెలియజేస్తుంది; తెలుగులో సహజంగా క్రియాత్మకంగా వ్యక్తీకరించబడింది.
- source_word: עִם בִּנְיָמִן
  choice: బెన్యామీనుతో
  rationale: עִם సాధారణంగా ‘తో’ అని అర్థం; యుద్ధ సందర్భం ఈ సంబంధం ప్రతిపక్షమైనదని స్పష్టం చేస్తుంది. తెలుగు ‘తో యుద్ధం’ ఆ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: וַיַּעַרְכוּ
  choice: బారులు తీశారు
  rationale: ערך సైనిక సందర్భంలో దళాలను యుద్ధ క్రమంలో అమర్చడాన్ని సూచిస్తుంది; ‘బారులు తీశారు’ సూటిగా, సహజంగా ఆ వ్యూహాత్మక భావాన్ని ఇస్తుంది.
- source_word: אִתָּם
  choice: వారికి ఎదురుగా
  rationale: పదం మూలంగా ‘వారితో’ అనే సంబంధాన్ని సూచించినా, ఇక్కడ బెన్యామీనీయులు ప్రత్యర్థులు. ‘ఎదురుగా’ యుద్ధ అమరికను స్పష్టం చేస్తుంది; మూలంలోని రూపభేదం పాదసూచికలో ఉంచబడింది.
- source_word: מִלְחָמָה
  choice: యుద్ధానికి
  rationale: యుద్ధ క్రమంలో అమరిన ఉద్దేశం లేదా స్థితిని సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: אֶל הַגִּבְעָה
  choice: గిబియా దగ్గర
  rationale: אֶל సాధారణంగా దిశను సూచించగలిగినా, ఇక్కడ దళాల అమరిక జరిగిన ప్రదేశ సంబంధాన్ని తెలియజేస్తుంది; ‘గిబియా దగ్గర’ స్థల భావాన్ని అతిగా నిర్దిష్టం చేయకుండా అందిస్తుంది.
theological_decisions:
- issue: אִישׁ יִשְׂרָאֵל లోని లింగసూచక సమూహ భాష
  choice: ఇశ్రాయేలు పురుషులు
  alternative: ఇశ్రాయేలు సైన్యం
  rationale: మూలంలోని పురుషవాచక సమూహ సూచన యుద్ధానికి వెళ్లిన పురుషులను ఉద్దేశిస్తుంది; లింగనిరపేక్ష సైనిక పదంతో దానిని మరుగుపరచలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన కథన శైలి. ‘బారులు తీశారు’ అనే పరిచిత సైనిక ప్రయోగం ద్వారా దళాల అమరికను తెలిపింది; మూలంలోని ఉపసర్గ సందిగ్ధతను పాదసూచికలో నిలిపింది.
