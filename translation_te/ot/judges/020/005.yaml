translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన కథన శైలి. హింసను మరుగుపరచకుండా, అనవసరంగా సంచలనాత్మకంగా చేయకుండా అనువదించబడింది. హీబ్రూ వాక్యంలోని సంఘటనల క్రమం మరియు చివరి ‘ఆమె చనిపోయింది’ అనే సమన్వయ నిర్మాణం నిలుపబడ్డాయి.
