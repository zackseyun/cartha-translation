source:
  edition: WLC
  text: וַ/יָּקֻ֤מוּ עָלַ/י֙ בַּעֲלֵ֣י הַ/גִּבְעָ֔ה וַ/יָּסֹ֧בּוּ עָלַ֛/י אֶת הַ/בַּ֖יִת לָ֑יְלָה אוֹתִ/י֙ דִּמּ֣וּ לַ/הֲרֹ֔ג וְ/אֶת פִּילַגְשִׁ֥/י עִנּ֖וּ וַ/תָּמֹֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/005.yaml
  text: Then the men of Gibeah rose up against me and surrounded the house at night[a]. They intended to kill me, and they violated my concubine[b], and she died.
translation:
  language: te
  text: అప్పుడు గిబియా పురుషులు నా మీదికి లేచి, రాత్రివేళ నేను ఉన్న ఇంటిని చుట్టుముట్టారు. నన్ను చంపాలని ఉద్దేశించారు; నా ఉపపత్నిని బలాత్కరించారు[a], ఆమె చనిపోయింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నా ఉపపత్నిని తీవ్రంగా అవమానించి హింసించారు.” ఇక్కడి హీబ్రూ క్రియకు అవమానించడం లేదా తీవ్రంగా హింసించడం అనే విస్తృత అర్థం ఉండవచ్చు; ఈ సందర్భం లైంగిక దాడిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּעֲלֵי הַגִּבְעָה
  choice: గిబియా పురుషులు
  rationale: ఈ నిర్మాణం పట్టణంలోని పురుష నివాసులను సూచించే జాతీయంగా వాడిన ప్రయోగం; ‘యజమానులు’ లేదా ‘ప్రభువులు’ అని అనువదిస్తే ఇక్కడ లేని అధికారిక హోదా భావం కలగవచ్చు.
- source_word: וַיָּקֻמוּ עָלַי
  choice: నా మీదికి లేచి
  rationale: హీబ్రూ ప్రయోగంలోని విరోధపూర్వకంగా లేచిన భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: וַיָּסֹבּוּ עָלַי אֶת־הַבַּיִת
  choice: నేను ఉన్న ఇంటిని చుట్టుముట్టారు
  rationale: వారు వక్తను లక్ష్యంగా చేసుకొని ఇంటిని చుట్టుముట్టారనే భావాన్ని తెలుగులో స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: לָיְלָה
  choice: రాత్రివేళ
  rationale: చర్య జరిగిన సమయాన్ని సూచించే సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: דִּמּוּ לַהֲרֹג
  choice: చంపాలని ఉద్దేశించారు
  rationale: ఈ సందర్భంలో క్రియ యోచన లేదా ఉద్దేశాన్ని తెలియజేస్తుంది; ‘ఉద్దేశించారు’ ఆ భావాన్ని అతిశయింపకుండా వ్యక్తపరుస్తుంది.
- source_word: פִּילַגְשִׁי
  choice: నా ఉపపత్నిని
  rationale: ఫిలెగెష్ సూచించే చారిత్రక సామాజిక సంబంధానికి ‘ఉపపత్ని’ సంక్షిప్తమైన, గౌరవప్రదమైన ప్రామాణిక తెలుగు పదం.
- source_word: עִנּוּ
  choice: బలాత్కరించారు
  rationale: పీయేల్ రూపం అవమానించడం లేదా తీవ్రంగా హింసించడం అనే విస్తృత భావాన్ని కలిగినా, న్యాయాధిపతులు 19–20 అధ్యాయాల సందర్భం ఇక్కడ లైంగిక దాడిని స్పష్టంగా సూచిస్తుంది; అందువల్ల అస్పష్టమైన ‘హింసించారు’ కంటే ఇది సందర్భార్థాన్ని నేరుగా అందిస్తుంది.
- source_word: וַתָּמֹת
  choice: ఆమె చనిపోయింది
  rationale: వావ్-క్రమరూపం సంఘటనల వరుసను ముందుకు నడిపిస్తుంది; కారణార్థాన్ని అదనంగా చేర్చకుండా ‘ఆమె చనిపోయింది’ అని ఇవ్వడం హీబ్రూ క్రమాన్ని కాపాడుతుంది.
