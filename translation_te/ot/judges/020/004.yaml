source:
  edition: WLC
  text: וַ/יַּ֜עַן הָ/אִ֣ישׁ הַ/לֵּוִ֗י אִ֛ישׁ הָ/אִשָּׁ֥ה הַ/נִּרְצָחָ֖ה וַ/יֹּאמַ֑ר הַ/גִּבְעָ֨תָ/ה֙ אֲשֶׁ֣ר לְ/בִנְיָמִ֔ן בָּ֛אתִי אֲנִ֥י וּ/פִֽילַגְשִׁ֖/י לָ/לֽוּן׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/004.yaml
  text: Then the Levite[a], the husband of the woman who had been murdered, answered and said, “I came to Gibeah, which belongs to Benjamin, I and my concubine, to spend the night.
translation:
  language: te
  text: 'అప్పుడు హత్యకు గురైన ఆ స్త్రీకి భర్త అయిన లేవీయుడు ఇలా జవాబిచ్చాడు: “నేను నా ఉపపత్నితో కలిసి రాత్రి బస చేయడానికి బెన్యామీనుకు చెందిన[a] గిబియాకు వచ్చాను.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “బెన్యామీను ప్రాంతంలో ఉన్న.”
    reason: אֲשֶׁר לְבִנְיָמִן అనే పదబంధం గోత్రానికి చెందినదనే భావాన్నో, దాని ప్రాంతంలో ఉన్నదనే భావాన్నో ఇవ్వగలదు.
lexical_decisions:
- source_word: וַיַּעַן
  choice: జవాబిచ్చాడు
  rationale: ప్రత్యక్ష ప్రశ్న ప్రస్తావించబడకపోయినా, కథనంలో మాటను ప్రారంభించే ענה అనే హెబ్రీయ క్రియకు సహజమైన తెలుగు సమానార్థకం.
- source_word: הָאִישׁ הַלֵּוִי
  choice: లేవీయుడు
  rationale: మాట్లాడుతున్న వ్యక్తి లేవీ వంశానికి చెందినవాడని సహజంగా, సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: אִישׁ הָאִשָּׁה
  choice: ఆ స్త్రీ భర్తయైన
  rationale: అక్షరార్థంగా ‘ఆ స్త్రీ పురుషుడు’ అనే నిర్మాణం సందర్భంలో ఆమె భర్త లేదా పురుష సహచరుణ్ని సూచిస్తుంది; తెలుగులో ‘భర్త’ సహజమైన సంబంధపదం.
- source_word: הַנִּרְצָחָה
  choice: హత్యకు గురైన
  rationale: רצח లోని అక్రమంగా ప్రాణం తీయబడిన భావాన్ని ‘చంపబడిన’ కంటే స్పష్టంగా నిలుపుతుంది.
- source_word: וַיֹּאמַר
  choice: ఇలా ... చెప్పాడు
  rationale: ప్రత్యక్ష వాక్యాన్ని పరిచయం చేసే אמר యొక్క సాధారణ కథన ప్రయోగాన్ని తెలుగులో సహజంగా వ్యక్తపరుస్తుంది; ముందున్న ‘జవాబిచ్చాడు’తో కలిపి ‘ఇలా జవాబిచ్చాడు’గా సంక్షిప్తీకరించబడింది.
- source_word: הַגִּבְעָתָה
  choice: గిబియాకు
  rationale: స్థలపేరు చివరనున్న దిశార్థక ה గిబియా వైపు ప్రయాణాన్ని సూచిస్తుంది; తెలుగు దత్తివిభక్తి ఆ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: אֲשֶׁר לְבִנְיָמִן
  choice: బెన్యామీనుకు చెందిన
  rationale: గిబియాకు బెన్యామీను గోత్రంతో లేదా దాని ప్రదేశంతో ఉన్న అనుబంధాన్ని స్పష్టంగా చూపుతుంది; ‘బెన్యామీను ప్రాంతంలో ఉన్న’ అనే స్థానార్థమూ సాధ్యమే.
- source_word: בָּאתִי אֲנִי וּפִילַגְשִׁי
  choice: నేనూ నా ఉపపత్నీ ... వచ్చాము
  rationale: ప్రత్యేక సర్వనామమైన אֲנִי మరియు అనుసంధానమైన ‘నా ఉపపత్ని’ రెండింటినీ నిలుపుతూ, సంయుక్త కర్తకు సరిపోయే సహజ తెలుగు బహువచన క్రియను వాడుతుంది.
- source_word: וּפִילַגְשִׁי
  choice: నా ఉపపత్ని
  rationale: פילגש సూచించే, ప్రధాన భార్యతో సమాన హోదా లేని స్త్రీ సహచరి అనే ప్రాచీన సామాజిక సంబంధానికి స్థిరమైన తెలుగు సమానార్థకం.
- source_word: לָלוּן
  choice: రాత్రి బస చేయడానికి
  rationale: לון సూచించే రాత్రిపూట నిలిచి ఉండే భావాన్ని ఆధునిక పాఠకులకు స్పష్టంగా అందిస్తుంది.
theological_decisions:
- issue: స్త్రీతో లేవీయుని సంబంధాన్ని ‘భర్త’గానూ ‘ఉపపత్ని’గానూ వచనం పేర్కొనడం
  choice: రెండు వర్ణనలనూ యథాతథంగా నిలిపివేయడం
  alternative: రెండు చోట్లా ఒకే సంబంధపదాన్ని వాడడం
  rationale: హెబ్రీయ పాఠంలోని אִישׁ הָאִשָּׁה మరియు פִילַגְשִׁי మధ్య ఉన్న సామాజిక-సంబంధ ఉద్రిక్తతను అనువాదం కృత్రిమంగా తొలగించకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కథనశైలి వాడబడింది. హింసను మృదువుచేయకుండా ‘హత్యకు గురైన’ అని, ప్రాచీన సంబంధపదాన్ని వివరణాత్మకంగా మార్చకుండా ‘ఉపపత్ని’ అని ఉంచబడింది. ప్రత్యామ్నాయ స్థానార్థాన్ని సూచించే [a] గుర్తు సంబంధిత పదబంధం వద్దనే ఉంచబడింది.
