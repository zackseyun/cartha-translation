  text: הִנֵּ֥ה כֻלְּ/כֶ֖ם בְּנֵ֣י יִשְׂרָאֵ֑ל הָב֥וּ לָ/כֶ֛ם דָּבָ֥ר וְ/עֵצָ֖ה הֲלֹֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/007.yaml
  text: Look, all of you sons of Israel, give your word and counsel here.
translation:
  language: te
  text: ఇదిగో, ఇశ్రాయేలీయులారా, మీరందరూ, మీ మాటను, సలహాను ఇక్కడ చెప్పండి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: ఇదిగో
  rationale: శ్రోతల దృష్టిని వెంటనే విషయంపై నిలిపే హీబ్రూ సూచక పదానికి సహజమైన, గంభీరమైన తెలుగు సమానం.
- source_word: כֻלְּכֶם בְּנֵי יִשְׂרָאֵל
  choice: మీరందరూ ఇశ్రాయేలీయులే
  rationale: అక్షరార్థమైన ‘ఇశ్రాయేలు కుమారులు’ కంటే మొత్తం ఇశ్రాయేలు సమాజాన్ని ఉద్దేశించే భావాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; ‘అందరూ’ అనే సమగ్రతను నిలుపుతుంది.
- source_word: הָבוּ לָכֶם דָּבָר וְעֵצָה
  choice: మీ అభిప్రాయాన్ని, ఆలోచనను తెలియజేయండి
  rationale: ఇక్కడ דָּבָר అనేది కేవలం ‘మాట’ కాక, సభ ముందుంచే అభిప్రాయం లేదా నిర్ణయ ప్రతిపాదనను సూచిస్తుంది; עֵצָה ఆలోచన/సలహాను సూచిస్తుంది. ‘తెలియజేయండి’ అనే క్రియ తెలుగులో సహజంగా రెండింటికీ వర్తిస్తుంది.
- source_word: הֲלֹם
  choice: ఇక్కడే
  rationale: సభాస్థలంలో ఇప్పుడే అభిప్రాయం వెల్లడించాలనే స్థానిక-సందర్భ బలాన్ని ‘ఇక్కడే’ నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ప్రజాసభను ఉద్దేశించిన ప్రత్యక్షమైనప్పటికీ గౌరవప్రదమైన శైలి. మూలంలోని రెండు సమీపార్థక పదాలను ‘అభిప్రాయం, ఆలోచన’గా వేరు చేసి ఉంచుతూ అసహజమైన పదక్షర అనువాదాన్ని నివారించింది.
