source:
  edition: WLC
  text: וַ/יְהִי֩ כָל הַ/נֹּ֨פְלִ֜ים מִ/בִּנְיָמִ֗ן עֶשְׂרִים֩ וַ/חֲמִשָּׁ֨ה אֶ֥לֶף אִ֛ישׁ שֹׁ֥לֵֽף חֶ֖רֶב בַּ/יּ֣וֹם הַ/ה֑וּא אֶֽת כָּל אֵ֖לֶּה אַנְשֵׁי חָֽיִל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/046.yaml
  text: So all who fell from Benjamin that day were twenty-five thousand men who drew the sword[a]; all these were men of valor.
translation:
  language: te
  text: ఆ రోజున బెన్యామీను వారిలో పడిపోయినవారు ఖడ్గం ధరించిన ఇరవై ఐదు వేల మంది; వీరందరూ పరాక్రమవంతులు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כָל הַנֹּפְלִים
  choice: పడిపోయినవారందరూ ... ఉన్నారు
  rationale: నారేటివ్ సారాంశాన్ని తెలుగులో సహజంగా తెలియజేస్తూ, נפל యుద్ధంలో హతమైనవారిని సూచించే రూపక ప్రయోగంలోని ‘పడిపోవడం’ అనే చిత్రాన్ని నిలుపుతుంది.
- source_word: מִבִּנְיָמִן
  choice: బెన్యామీనీయులలో
  rationale: מן ఇక్కడ బెన్యామీను గోత్రానికి చెందినవారిలోనుంచి వచ్చిన నష్టాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘బెన్యామీనీయులలో’ సహజంగా ఉంటుంది.
- source_word: עֶשְׂרִים וַחֲמִשָּׁה אֶלֶף אִישׁ
  choice: ఇరవై ఐదు వేల మంది
  rationale: సంఖ్యను, איש యొక్క సాధారణ వ్యక్తి సూచనను ఎలాంటి అదనపు సైనిక పదజాలం లేకుండా నేరుగా అందిస్తుంది.
- source_word: שֹׁלֵף חֶרֶב
  choice: ఖడ్గం దూసేవారు
  rationale: ఇది యుద్ధానికి ఆయుధం ధరించిన పోరాట యోధులను సూచించే హీబ్రూ నుడికారం; ‘ఖడ్గం దూసేవారు’ మూలంలోని క్రియాత్మక చిత్రాన్ని నిలుపుతుంది.
- source_word: בַּיּוֹם הַהוּא
  choice: ఆ రోజున
  rationale: కాలసూచనను సహజమైన, స్పష్టమైన తెలుగులో అందిస్తుంది.
- source_word: אֶת כָּל אֵלֶּה
  choice: వీరందరూ
  rationale: ఇప్పుడే లెక్కించిన వారినందరినీ తిరిగి నొక్కిచెప్పే హీబ్రూ నిర్మాణాన్ని సంక్షిప్తంగా ప్రతిబింబిస్తుంది.
- source_word: אַנְשֵׁי חָיִל
  choice: పరాక్రమవంతులు
  rationale: חַיִל ఇక్కడ యుద్ధసామర్థ్యం, శౌర్యం గల మనుషులను సూచిస్తుంది; ‘పరాక్రమవంతులు’ ఆధునిక, గౌరవప్రదమైన తెలుగు ప్రయోగం.
