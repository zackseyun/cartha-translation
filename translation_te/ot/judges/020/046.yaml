- from: ఆ రోజున బెన్యామీనీయులలో పడిపోయినవారందరూ ఖడ్గం దూసేవారు ఇరవై ఐదు వేల మంది; వీరందరూ పరాక్రమవంతులు.
  to: ఆ రోజున బెన్యామీను వారిలో పడిపోయినవారు ఖడ్గం ధరించిన ఇరవై ఐదు వేల మంది; వీరందరూ పరాక్రమవంతులు.
  rationale: The revision resolves the Telugu syntactic ambiguity by making “ఖడ్గం ధరించిన ఇరవై ఐదు వేల మంది” the clear appositional identification of those who fell. It retains the source’s casualty count, tribal reference, martial qualification, and concluding assessment. No footnote is required in Telugu for this rendering, since “పరాక్రమవంతులు” adequately conveys the lexical range relevant here.
