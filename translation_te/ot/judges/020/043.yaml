translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కథనశైలిని ఉపయోగించాం. బెన్యామీనును సమష్టి ఏకవచనంగా నిలిపాం. క్లిష్టమైన מְנוּחָה, הִדְרִיכֻהוּ పదాలకు ప్రధాన పఠనాన్ని వచనంలో ఇచ్చి, నిజమైన భాషాత్మక అనిశ్చితిని పాదసూచికల్లో సంరక్షించాం. అన్ని పాదసూచిక గుర్తులు ప్రధాన వచనంలో ఉన్నాయి.
