  text: כִּתְּר֤וּ אֶת בִּנְיָמִן֙ הִרְדִיפֻ֔/הוּ מְנוּחָ֖ה הִדְרִיכֻ֑/הוּ עַ֛ד נֹ֥כַח הַ/גִּבְעָ֖ה מִ/מִּזְרַח שָֽׁמֶשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/043.yaml
  text: They surrounded Benjamin[a], pursued him relentlessly, and trampled him down as far as opposite Gibeah[c][b], toward the east of the sun.
translation:
  language: te
  text: వారు బెన్యామీనును చుట్టుముట్టి, అతన్ని విశ్రాంతి లేకుండా[a] తరిమి, తూర్పు వైపున గిబియాకు ఎదురుగా ఉన్న చోటివరకు అతన్ని తొక్కివేశారు.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, מְנוּחָהను క్రియావిశేషణంగా కాక స్థలనామంగా తీసుకుంటే, ‘మెనూహా నుండి అతన్ని తరిమి’ అని అనువదించవచ్చు.
    reason: alternative_reading
  - marker: b
    text: ‘అతన్ని తొక్కివేశారు’ అనే మాటకు బదులుగా ‘అతన్ని బలవంతంగా నడిపించారు’ అని కూడా అనువదించవచ్చు; ఇక్కడి హీబ్రూ క్రియ తొక్కడం లేదా బలవంతంగా కదిలించడం అనే భావాల్లో ఏదో ఒకటి ఇవ్వగలదు.
    reason: lexical_alternative
  - marker: c
    text: హీబ్రూ పదబంధం అక్షరార్థంగా ‘సూర్యుని తూర్పు నుండి’; భావం ‘తూర్పున’ లేదా ‘తూర్పు వైపున.’
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּתְּרוּ
  choice: చుట్టుముట్టి
  rationale: ఈ క్రియ చుట్టూ ఆవరించి తప్పించుకోనివ్వకుండా చేయడాన్ని సూచిస్తుంది; యుద్ధ సందర్భంలో ‘చుట్టుముట్టి’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: אֶת בִּנְיָמִן
  choice: బెన్యామీనును
  rationale: వ్యక్తినామం ఇక్కడ గోత్రాన్ని లేదా దాని సైన్యాన్ని సమష్టిగా సూచిస్తుంది. తరువాతి ఏకవచన ప్రత్యయాలకు అనుగుణంగా హీబ్రూ రూపాన్ని నిలిపింది.
- source_word: הִרְדִיפֻהוּ
  choice: అతనికి ... తరిమి
  rationale: רדף యుద్ధ సందర్భంలో వెంబడించడం లేదా తరిమివెళ్లడాన్ని సూచిస్తుంది; ఏకవచన సమష్టి కర్మను ‘అతనికి/అతన్ని’గా నిలిపాం.
- source_word: מְנוּחָה
  choice: విశ్రాంతి లేకుండా
  rationale: పదానికి ప్రాథమికంగా ‘విశ్రాంతి/విశ్రాంతి స్థలం’ అనే అర్థం ఉంది. క్లిష్టమైన ఈ వాక్యంలో క్రియావిశేషణ భావంగా తీసుకొని, మూలపద చిత్రాన్ని నిలిపేలా ‘విశ్రాంతి లేకుండా’ అని అనువదించాం.
- source_word: הִדְרִיכֻהוּ
  choice: అతన్ని తొక్కివేశారు
  rationale: דרך హిఫీల్ రూపం తొక్కడం లేదా బలవంతంగా నడిపించడం అనే భావాలను ఇవ్వగలదు. యుద్ధక్రియల వరుసలో బలమైన ‘తొక్కివేశారు’ భావం సందర్భోచితం; ప్రత్యామ్నాయం పాదసూచికలో ఉంది.
- source_word: עַד נֹכַח הַגִּבְעָה
  choice: గిబియా ఎదురుగా ... ఉన్న ప్రాంతం వరకు
  rationale: נֹכַח ఎదురుగా, ఎదుట లేదా అభిముఖంగా ఉన్న స్థానాన్ని సూచిస్తుంది. తెలుగులో స్థల సంబంధం స్పష్టంగా ఉండేందుకు ‘ఎదురుగా ... ఉన్న ప్రాంతం వరకు’ అని ఇచ్చాం.
- source_word: מִמִּזְרַח שָׁמֶשׁ
  choice: సూర్యోదయ దిక్కున
  rationale: అక్షరార్థంగా ‘సూర్యుని తూర్పు వైపు/సూర్యోదయ వైపు’ అనే హీబ్రూ దిక్సూచక ప్రయోగం. సహజమైన తెలుగులో దాని చిత్రాన్ని కొంత నిలిపే ‘సూర్యోదయ దిక్కున’ ఎంచుకున్నాం.
