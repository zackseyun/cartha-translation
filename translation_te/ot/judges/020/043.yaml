revisions:
- from: వారు బెన్యామీనును చుట్టుముట్టి, అతనికి విశ్రాంతి లేకుండా తరిమి, గిబియా ఎదురుగా సూర్యోదయ దిక్కున ఉన్న ప్రాంతం వరకు అతన్ని తొక్కివేశారు.[a][b][c]
  to: వారు బెన్యామీనును చుట్టుముట్టి, అతన్ని విశ్రాంతి లేకుండా[a] తరిమి, తూర్పు వైపున గిబియాకు ఎదురుగా ఉన్న చోటివరకు అతన్ని తొక్కివేశారు.[b][c]
