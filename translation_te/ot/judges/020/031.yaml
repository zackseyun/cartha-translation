revisions:
- from: బెన్యామీను కుమారులు[a] ఆ ప్రజలను ఎదుర్కోవడానికి బయలుదేరి, పట్టణం నుండి దూరంగా లాగబడ్డారు[b]. మునుపటిలాగే[c] వారు ఆ ప్రజల్లో కొందరిని చంపడం మొదలుపెట్టారు. బేతేలుకు ఎక్కిపోయే ఒక రాజమార్గం మీద, గిబియాకు వెళ్లే మరో రాజమార్గం మీద—బయట మైదానంలో[d]—ఇశ్రాయేలీయుల్లో దాదాపు ముప్పై మందిని చంపారు.
  to: 'బెన్యామీను కుమారులు[a] ఆ ప్రజలను ఎదుర్కోవడానికి బయటికి వచ్చి, పట్టణం నుండి దూరంగా లాగబడిపోయారు[b]. మునుపటిలాగే[c], వారు రాజమార్గాల మీద ఆ ప్రజల్లో కొందరిని చంపడం మొదలుపెట్టారు: ఒక మార్గం బేతేలుకు ఎక్కిపోయేది, మరొకటి మైదానంలో గిబియాకు వెళ్లేది[d]; ఇశ్రాయేలీయుల్లో దాదాపు ముప్పై మందిని చంపారు.'
  rationale: 'హీబ్రూ వాక్యక్రమంలోని భౌగోళిక వివరాన్ని స్పష్టంగా చేశాం: రాజమార్గాలు బహువచనమని చూపి, బేతేలుకు ఎక్కే ఒక మార్గం మరియు మైదానంలో గిబియాకు వెళ్లే మరొక మార్గం అని సహజంగా మలిచాం. పట్టణం నుంచి వ్యూహాత్మకంగా దూరం చేయబడిన భావాన్ని నిలుపుతూ, హతుల సంఖ్యను వాక్యాంతంలో హీబ్రూ భావానికి అనుగుణంగా ఉంచాం.'
