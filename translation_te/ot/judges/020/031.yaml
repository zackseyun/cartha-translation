translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కథనశైలి వాడబడింది. హీబ్రూ వాక్యంలోని దీర్ఘ నిర్మాణాన్ని చదవడానికి సులభంగా రెండు వాక్యాలుగా విభజించాం; గోత్రపు బంధుత్వ ప్రయోగం, యుద్ధపు ప్రాణాంతక ఫలితం, మార్గాల భౌగోళిక వివరణ నిలుపబడ్డాయి.
