  text: וַ/יֵּצְא֤וּ בְנֵֽי בִנְיָמִן֙ לִ/קְרַ֣את הָ/עָ֔ם הָנְתְּק֖וּ מִן הָ/עִ֑יר וַ/יָּחֵ֡לּוּ לְ/הַכּוֹת֩ מֵ/הָ/עָ֨ם חֲלָלִ֜ים כְּ/פַ֣עַם בְּ/פַ֗עַם בַּֽ/מְסִלּוֹת֙ אֲשֶׁ֨ר אַחַ֜ת עֹלָ֣ה בֵֽית אֵ֗ל וְ/אַחַ֤ת גִּבְעָ֨תָ/ה֙ בַּ/שָּׂדֶ֔ה כִּ/שְׁלֹשִׁ֥ים אִ֖ישׁ בְּ/יִשְׂרָאֵֽל־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/031.yaml
  text: And the sons of Benjamin came out to meet the people[a], and were drawn away from the city; and they began to strike down some of the people, as at other times, on the highways, one of which goes up to Bethel and one to Gibeah in the open country[d][c][b], about thirty men of Israel.
translation:
  language: te
  text: 'బెన్యామీను కుమారులు[a] ఆ ప్రజలను ఎదుర్కోవడానికి బయటికి వచ్చి, పట్టణం నుండి దూరంగా లాగబడిపోయారు[b]. మునుపటిలాగే[c], వారు రాజమార్గాల మీద ఆ ప్రజల్లో కొందరిని చంపడం మొదలుపెట్టారు: ఒక మార్గం బేతేలుకు ఎక్కిపోయేది, మరొకటి మైదానంలో గిబియాకు వెళ్లేది[d]; ఇశ్రాయేలీయుల్లో దాదాపు ముప్పై మందిని చంపారు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “బెన్యామీనీయులు.” హీబ్రూలో అక్షరార్థంగా “బెన్యామీను కుమారులు.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “పట్టణం నుండి వేరుచేయబడ్డారు”; సందర్భం ప్రకారం, “పట్టణం నుండి బయటకు రప్పించబడ్డారు.”
    reason: lexical_alternative
  - marker: c
    text: లేదా, “ఇంతకుముందు చేసినట్లే.” ఈ హీబ్రూ నుడికారం ముందటి యుద్ధాలతో ఈ దాడిని పోలుస్తుంది.
    reason: lexical_alternative
  - marker: d
    text: లేదా, “పొలంలో.” ఈ మాట బహిరంగ ప్రదేశం గుండా వెళ్లే మార్గాన్ని వర్ణిస్తుండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצְאוּ
  choice: బయలుదేరి
  rationale: పట్టణం నుంచి యుద్ధానికి వెలుపలికి రావడాన్ని సహజమైన తెలుగు కథనశైలిలో తెలియజేస్తుంది.
- source_word: בְנֵי בִנְיָמִן
  choice: బెన్యామీను కుమారులు
  rationale: హీబ్రూ బంధుత్వ ప్రయోగాన్ని నిలుపుతుంది; సందర్భంలో ఇది బెన్యామీను గోత్రస్థులను సూచిస్తుంది.
- source_word: לִקְרַאת הָעָם
  choice: ఆ ప్రజలను ఎదుర్కోవడానికి
  rationale: לקראת లోని ఎదురుగా వెళ్లే భావాన్ని, ఇక్కడి యుద్ధ సందర్భాన్ని స్పష్టంగా తెలియజేస్తుంది; העם ను ‘ప్రజలు’గానే నిలుపుతుంది.
- source_word: הָנְתְּקוּ מִן הָעִיר
  choice: పట్టణం నుండి దూరంగా లాగబడ్డారు
  rationale: వారు పట్టణ రక్షణ నుంచి వ్యూహాత్మకంగా దూరం చేయబడ్డారనే సందర్భార్థాన్ని ఇస్తూ, రూపంలోని అస్పష్టతను పాదటిప్పణిలో ఉంచుతుంది.
- source_word: וַיָּחֵלּוּ לְהַכּוֹת מֵהָעָם חֲלָלִים
  choice: వారు ఆ ప్రజల్లో కొందరిని చంపడం మొదలుపెట్టారు
  rationale: חללים మరణించినవారిని సూచిస్తున్నందున, తెలుగులో అసహజమైన పునరుక్తి లేకుండా ప్రాణాంతక ఫలితాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: כְּפַעַם בְּפַעַם
  choice: మునుపటిలాగే
  rationale: ఈ అధ్యాయంలోని గత యుద్ధాలతో పోల్చే హీబ్రూ నుడికారానికి సహజమైన తెలుగు సమానం.
- source_word: בַּמְסִלּוֹת
  choice: రాజమార్గం మీద
  rationale: מסלה ఎత్తుగా నిర్మించిన ప్రధాన రహదారి లేదా రాజమార్గాన్ని సూచిస్తుంది; ద్వివచన భావం తరువాతి రెండు మార్గాల ద్వారా వెల్లడవుతుంది.
- source_word: אַחַת עֹלָה בֵית אֵל
  choice: బేతేలుకు ఎక్కిపోయే ఒక రాజమార్గం
  rationale: עלה లోని భౌగోళికంగా పైకి వెళ్లే భావాన్ని నిలుపుతుంది.
- source_word: וְאַחַת גִּבְעָתָה בַּשָּׂדֶה
  choice: గిబియాకు వెళ్లే మరో రాజమార్గం మీద—బయట మైదానంలో
  rationale: గిబియా దిశను స్పష్టంగా ఇస్తుంది; בשדה మార్గం బహిరంగ ప్రదేశంలో ఉందని సూచించే అవకాశాన్ని నిలుపుతుంది.
- source_word: כִּשְׁלֹשִׁים אִישׁ בְּיִשְׂרָאֵל
  choice: ఇశ్రాయేలీయుల్లో దాదాపు ముప్పై మందిని
  rationale: כי యొక్క అంచనా భావాన్ని ‘దాదాపు’తో, ב యొక్క సమూహంలోనిది అనే భావాన్ని ‘ఇశ్రాయేలీయుల్లో’తో వ్యక్తం చేస్తుంది.
