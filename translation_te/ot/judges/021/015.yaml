translation:
  language: te
  text: బెన్యామీను విషయంలో ప్రజలు దుఃఖించారు; ఎందుకంటే యెహోవా ఇశ్రాయేలు గోత్రాల మధ్య చీలిక కలిగించాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נִחָם לְבִנְיָמִן
  choice: బెన్యామీను విషయంలో దుఃఖించారు
  rationale: ఈ సందర్భంలో నిఫాల్ రూపం బెన్యామీను గోత్రానికి సంభవించిన నష్టాన్ని బట్టి ప్రజలు దుఃఖించారనే భావాన్ని ఇస్తుంది; 'కనికరించారు' కంటే మూలంలోని విచారభావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: פֶּרֶץ
  choice: చీలిక
  rationale: ఈ పదం విరుగు, అంతరం లేదా తెగిపోవడాన్ని సూచిస్తుంది. ఒక గోత్రం దాదాపు నశించినందువల్ల ఇశ్రాయేలు గోత్ర సమాఖ్యలో ఏర్పడిన విభేదాన్ని 'చీలిక' సహజంగా వ్యక్తం చేస్తుంది.
- source_word: עָשָׂה
  choice: కలిగించాడు
  rationale: మూలపాఠం యెహోవానే ఈ చీలికను చేశాడని నేరుగా చెబుతుంది. తెలుగులో సహజంగా ఉండేలా, అదే కారణకర్తృత్వాన్ని నిలుపుతూ 'కలిగించాడు' అని అనువదించబడింది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవ నామాన్ని సాధారణ బిరుదుతో భర్తీ చేయకుండా, హీబ్రూ వ్యక్తినామాన్ని తెలుగులో ప్రాచుర్యంలో ఉన్న రూపంతో సూచిస్తుంది.
theological_decisions:
- issue: ఇశ్రాయేలు గోత్రాల మధ్య చీలికకు యెహోవా కారణమని చెప్పడం
  choice: యెహోవా ... చీలిక కలిగించాడు
  alternative: ఇశ్రాయేలు గోత్రాల మధ్య చీలిక ఏర్పడింది
  rationale: మూలంలోని స్పష్టమైన దైవ కర్తృత్వాన్ని మృదూకరించకుండా, దానిలోని theological tension‌ను అలాగే ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన వాక్య నిర్మాణం. హీబ్రూ కారణవాచక సంబంధాన్ని స్పష్టంగా ఉంచుతూ, అసలు పాఠంలోని దైవ కర్తృత్వాన్ని మరియు గోత్ర సమాఖ్యలో ఏర్పడిన విరుగుడనే రూపకాన్ని కాపాడింది.
