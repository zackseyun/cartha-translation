  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֣אמְר֔וּ מִ֗י אֶחָד֙ מִ/שִּׁבְטֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁ֛ר לֹֽא עָלָ֥ה אֶל יְהוָ֖ה הַ/מִּצְפָּ֑ה וְ֠/הִנֵּה לֹ֣א בָא אִ֧ישׁ אֶל הַֽ/מַּחֲנֶ֛ה מִ/יָּבֵ֥ישׁ גִּלְעָ֖ד אֶל הַ/קָּהָֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/008.yaml
  text: And they said[a], “Which one of the tribes of Israel did not go up to Yahweh at Mizpah?” And behold, not a man from Jabesh-gilead had come to the camp[b], to the assembly.
translation:
  language: te
  text: 'అప్పుడు వారు ఇలా అన్నారు: “ఇశ్రాయేలు గోత్రాల్లో ఏ గోత్రం మిస్పాలో యాహ్వే సన్నిధికి వెళ్లలేదు?”[a] ఇదిగో, యాబేష్గిలాదు నుండి ఒక్క మనిషి కూడా శిబిరానికి, సమాజసభకు రాలేదు.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యాహ్వే దగ్గరకు, మిస్పాకు వెళ్లలేదు?” హీబ్రూ పదబంధాన్ని మిస్పాలో యాహ్వే సన్నిధికి హాజరవడాన్ని సూచించేదిగా కూడా అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా, “ఒక్క పురుషుడు కూడా రాలేదు”; ఏకవచన పురుషలింగ రూపం యాబేష్గిలాదు నుండి ఏ ఒక్క వ్యక్తీ హాజరు కాలేదని నొక్కిచెబుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: అప్పుడు వారు ... అని అడిగారు
  rationale: వయ్యిక్తోల్ కథనాన్ని ముందుకు నడిపిస్తుంది; ప్రత్యక్ష ప్రశ్న ఉన్నందున తెలుగులో ‘అడిగారు’ సహజంగా ఉంటుంది.
- source_word: מִי אֶחָד מִשִּׁבְטֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు గోత్రాల్లో ఏ ఒక్కటి
  rationale: మొత్తం గోత్ర సమూహం నుంచి ఒక గోత్రాన్ని గుర్తించాలనే ప్రశ్నను, ఏకవచన ప్రాధాన్యంతో సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: לֹא עָלָה
  choice: రాలేదు
  rationale: సభాస్థలానికి వెళ్లడం అనే עלה భావాన్ని సందర్భానుసారంగా సహజ తెలుగులో వ్యక్తం చేస్తుంది; ‘పైకి వెళ్లలేదు’ ఇక్కడ కృత్రిమంగా వినిపిస్తుంది.
- source_word: אֶל יְהוָה הַמִּצְפָּה
  choice: మిస్పాలో యెహోవా దగ్గరికి
  rationale: אֶל యొక్క ప్రత్యక్ష దిశాభావాన్ని నిలుపుతూ, మిస్పాను సభాస్థలంగా చూపిస్తుంది; వాక్యానికి ఉన్న సాధ్యమైన ‘యెహోవా సన్నిధిలో’ భావాన్ని పాదసూచికలో ఉంచింది.
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: కథనంలో గమనార్హమైన విషయాన్ని కనుగొన్న భావాన్ని నిలుపుతుంది.
- source_word: לֹא בָא אִישׁ
  choice: ఒక్క పురుషుడు కూడా ... రాలేదు
  rationale: నిషేధంతో వచ్చిన ఏకవచన אִישׁ ఏ వ్యక్తీ లేడనే బలమైన భావాన్ని ఇస్తుంది; పురుష ఏకవచన రూపాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: מִיָּבֵישׁ גִּלְעָד
  choice: యాబేష్గిలాదు నుండి
  rationale: מִן మూలస్థానాన్ని సూచిస్తుంది; స్థలనామాన్ని తెలుగు లిప్యంతరీకరణలో ఉంచింది.
- source_word: אֶל הַמַּחֲנֶה ... אֶל הַקָּהָל
  choice: శిబిరానికి, అంటే సమాజం దగ్గరికి
  rationale: రెండు אֶל పదబంధాలను నిలుపుతూ, రెండవది మొదటిదాన్ని సమాజ సమావేశంగా వివరిస్తున్న అనుబంధ భావాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలోని ప్రత్యేక దైవనామాన్ని సాధారణ బిరుదుతో భర్తీ చేయకుండా తెలుగు పాఠకులకు విస్తృతంగా పరిచయమైన రూపంలో లిప్యంతరీకరించింది.
- issue: אֶל יְהוָה యొక్క సంబంధ భావం
  choice: యెహోవా దగ్గరికి
  alternative: యెహోవా సన్నిధిలో
  rationale: మూలంలోని אֶל దిశాభావాన్ని ప్రధాన పాఠంలో నిలిపి, సభలో దేవుని సన్నిధికి హాజరవడం అనే సాధ్యమైన భావాన్ని పాదసూచికలో ఇచ్చింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే కథన శైలి. స్థలనామాలు ‘మిస్పా’, ‘యాబేష్గిలాదు’గా లిప్యంతరీకరించబడ్డాయి. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠంలో ఉంచబడ్డాయి.
