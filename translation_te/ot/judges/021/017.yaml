id: JDG.21.17
reference: Judges 21:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֣אמְר֔וּ יְרֻשַּׁ֥ת פְּלֵיטָ֖ה לְ/בִנְיָמִ֑ן וְ/לֹֽא יִמָּחֶ֥ה שֵׁ֖בֶט מִ/יִּשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/017.yaml
  text: And they said[a], “There must be an inheritance for the survivors of Benjamin, so that a tribe may not be blotted out from Israel.”
translation:
  language: te
  text: 'వారు ఇలా అన్నారు: “బెన్యామీనుకు చెందిన మిగిలినవారికి స్వాస్థ్యం ఉండాలి[a], ఇశ్రాయేలులోనుండి ఒక గోత్రం తుడిచివేయబడకుండా ఉండేందుకు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “బెన్యామీనుకు ఒక శేషం ఉండాలి” లేదా “బెన్యామీనుకు చెందిన మిగిలినవారికి స్వాస్థ్యం.” హీబ్రూలో “స్వాస్థ్యం” మరియు “తప్పించుకొని మిగిలినవారు/శేషం” అనే నామపదాలు సంక్షిప్తంగా పక్కపక్కనే ఉన్నాయి; వాటి మధ్య ఖచ్చితమైన సంబంధాన్ని ఒకటి కంటే ఎక్కువ సహజమైన విధాలుగా వ్యక్తపరచవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: వారు ఇలా అన్నారు
  rationale: אמר అనే క్రియ యొక్క సాధారణ కథన రూపాన్ని సహజమైన ఆధునిక తెలుగు కథన శైలిలో వ్యక్తపరుస్తుంది.
- source_word: יְרֻשַּׁת
  choice: స్వాస్థ్యం
  rationale: వంశపారంపర్యంగా లభించే భూభాగం లేదా ఆస్తి అనే భావాన్ని సందర్భానుకూలంగా తెలియజేస్తుంది.
- source_word: פְּלֵיטָה לְבִנְיָמִן
  choice: బెన్యామీనీయుల్లో మిగిలినవారికి
  rationale: యుద్ధనాశనం నుండి తప్పించుకొని మిగిలిన బెన్యామీను గోత్రస్థులను సూచించే సమూహార్థక పదాన్ని స్పష్టమైన ఆధునిక తెలుగులో అందిస్తుంది; మూలంలోని సంక్షిప్త నామపద సంబంధాన్ని పాదసూచికలో నిలుపుతుంది.
- source_word: וְלֹא יִמָּחֶה
  choice: అప్పుడు ... తుడిచివేయబడదు
  rationale: מחה నిఫాల్ రూపంలోని నిర్మూలించబడడం లేదా చెరిపివేయబడడం అనే బలమైన భావాన్ని నిలుపుతుంది. సందర్భంలో ముందటి ఏర్పాటుకు కలిగే ఫలితాన్ని ‘అప్పుడు’ సహజంగా సూచిస్తుంది; మూలంలోని וְ సంబంధాన్ని స్పష్టమైన ఉద్దేశార్థంగా అతిగా నిర్ణయించదు.
- source_word: שֵׁבֶט
  choice: ఒక గోత్రం
  rationale: ఇశ్రాయేలు గోత్రాల్లో ఏ ఒక్క గోత్రమూ అంతరించకూడదనే అనిర్దిష్ట భావాన్ని ప్రతిబింబిస్తుంది.
- source_word: מִיִּשְׂרָאֵל
  choice: ఇశ్రాయేలులోనుండి
  rationale: מן యొక్క వియోగార్థాన్ని నేరుగా నిలుపుతూ, ఇశ్రాయేలు ప్రజల మధ్యనుండి ఒక గోత్రం కనుమరుగవడం అనే భావాన్ని తెలియజేస్తుంది.
