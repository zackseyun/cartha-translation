  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండే, గంభీరమైన కథన శైలి. మూలంలోని నామవాక్యాన్ని తెలుగులో అవసరమైన ‘ఉండాలి’తో సహజీకరించాం; నామపదాల మధ్య ఉన్న నిజమైన అస్పష్టతను పాదసూచికలో భద్రపరిచాం.
