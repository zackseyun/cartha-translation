  text: וַ/יָּבֹ֤א הָ/עָם֙ בֵּֽית אֵ֔ל וַ/יֵּ֤שְׁבוּ שָׁם֙ עַד הָ/עֶ֔רֶב לִ/פְנֵ֖י הָ/אֱלֹהִ֑ים וַ/יִּשְׂא֣וּ קוֹלָ֔/ם וַ/יִּבְכּ֖וּ בְּכִ֥י גָדֽוֹל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/002.yaml
  text: Then the people came to Bethel and sat there before God until evening[a], and they raised their voices and wept with great weeping.
translation:
  language: te
  text: అప్పుడు ప్రజలు బేతేలుకు వచ్చి, సాయంకాలం వరకు అక్కడ దేవుని సన్నిధిలో కూర్చున్నారు. వారు గొంతెత్తి ఎంతోగా ఏడ్చారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా ‘గొప్ప ఏడుపు ఏడ్చారు’; ఒకే మూలానికి చెందిన పదాల వాడకం వారి తీవ్ర విలాపాన్ని నొక్కిచెబుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: వచ్చి
  rationale: בוא ఇక్కడ ఒక స్థలానికి చేరుకోవడాన్ని తెలిపే కథన క్రియ. తెలుగు కథనశైలిలో ‘వచ్చి’ సహజంగా ఆ చేరికను వ్యక్తపరుస్తుంది.
- source_word: הָעָם
  choice: ప్రజలు
  rationale: עם ఇక్కడ సమిష్టిగా కూడిన ఇశ్రాయేలీయులను సూచిస్తుంది; కేవలం సైన్యాన్ని కాదు.
- source_word: בֵּית אֵל
  choice: బేతేలు
  rationale: ఇది ఈ వాక్యంలో సాధారణ నామవాచక పదబంధం కాక స్థలనామం; అందుచేత ప్రామాణిక తెలుగు లిప్యంతరీకరణ వాడబడింది.
- source_word: וַיֵּשְׁבוּ שָׁם
  choice: అక్కడ ... కూర్చున్నారు
  rationale: ישב పదంలోని ప్రత్యక్షమైన ‘కూర్చోవడం’ అనే భావాన్ని, సాయంకాలం వరకు కొనసాగిన స్థితితో సహా, స్పష్టంగా నిలుపుతుంది.
- source_word: עַד הָעֶרֶב
  choice: సాయంకాలం వరకు
  rationale: కాలపరిమితిని తెలిపే ఈ పదబంధానికి ఇది సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: לִפְנֵי הָאֱלֹהִים
  choice: దేవుని సన్నిధిలో
  rationale: లִפְנֵי అనే సన్నిధి సూత్రాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తూ, האלהים ను ‘దేవుడు’గానే నిలుపుతుంది.
- source_word: וַיִּשְׂאוּ קוֹלָם
  choice: గొంతెత్తి
  rationale: అక్షరార్థంగా ‘తమ స్వరాన్ని ఎత్తారు’ అనే హీబ్రూ నుడికారానికి ‘గొంతెత్తి’ సహజమైన, సంక్షిప్తమైన తెలుగు సమానం.
- source_word: וַיִּבְכּוּ בְּכִי גָדוֹל
  choice: ఎంతోగా ఏడ్చారు
  rationale: క్రియతో అదే మూలానికి చెందిన నామవాచకాన్ని జతచేసిన హీబ్రూ నిర్మాణం తీవ్రమైన ఏడుపును సూచిస్తుంది. తెలుగులో అసహజమైన పునరుక్తిని నివారిస్తూ ‘ఎంతోగా’ ఆ తీవ్రతను తెలియజేస్తుంది; మూల నిర్మాణం పాదటిప్పణిలో నమోదు చేయబడింది.
theological_decisions:
- issue: ఆరాధనా సందర్భంలో הָאֱלֹהִים అనువాదం
  choice: దేవుడు
  alternative: యెహోవా
  rationale: మూలపాఠంలో దైవనామమైన יהוה కాక האלהים ఉంది. కాబట్టి సందర్భం ఆరాధనకు సంబంధించినదైనా ‘యెహోవా’ అని సమన్వయపరచకుండా ‘దేవుడు’ అని అనువదించబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. హీబ్రూ వాక్యక్రమాన్ని యాంత్రికంగా అనుసరించకుండా భావక్రమాన్ని నిలిపి, దైవపదం మరియు తీవ్ర విలాపానికి సంబంధించిన మూలభాషా లక్షణాలను సంరక్షించాం.
