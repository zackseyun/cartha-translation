source:
  edition: WLC
  text: מַה נַּעֲשֶׂ֥ה לָ/הֶ֛ם לַ/נּוֹתָרִ֖ים לְ/נָשִׁ֑ים וַ/אֲנַ֨חְנוּ֙ נִשְׁבַּ֣עְנוּ בַֽ/יהוָ֔ה לְ/בִלְתִּ֛י תֵּת לָ/הֶ֥ם מִ/בְּנוֹתֵ֖י/נוּ לְ/נָשִֽׁים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/007.yaml
  text: What shall we do for them—for those who remain—to get wives? For we have sworn by Yahweh not to give them any of our daughters as wives.
translation:
  language: te
  text: మిగిలినవారికి భార్యలు దొరికేలా[a] మనం ఏమి చేయాలి? ఎందుకంటే, మన కుమార్తెల్లో ఎవరినీ వారికి భార్యగా ఇవ్వబోమని మనం యాహ్వే పేరున ప్రమాణం చేశాం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “భార్యల కోసం”; భార్యలు దొరికేలా చేయడం అనే భావం సందర్భంలో అంతర్లీనంగా ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה נַּעֲשֶׂה
  choice: మనం ఏమి చేయాలి?
  rationale: מַה తో కూడిన ప్రథమ పురుష బహువచన అసంపూర్ణ క్రియ ఇక్కడ చేయవలసిన కార్యం గురించి ఆలోచనాత్మక ప్రశ్నను వ్యక్తం చేస్తుంది.
- source_word: לָהֶם לַנּוֹתָרִים
  choice: మిగిలినవారికి
  rationale: రెండు ל ప్రయోగాలు లబ్ధిదారుని, ఆ తరువాత అతని గుర్తింపును సూచిస్తున్నాయి. సందర్భంలో వీరు బెన్యామీనీయుల్లో మిగిలిన పురుషులు; అయితే మూలంలోని participial భావాన్ని నిలుపుతూ ‘మిగిలినవారు’ అని అనువదించాం.
- source_word: לְנָשִׁים
  choice: భార్యలు దొరికేలా
  rationale: మొదటి ప్రయోగం అక్షరార్థంగా ‘భార్యల కోసం/భార్యలుగా’ అనే సంక్షిప్త, అసంపూర్ణ పదబంధం. భార్యలను సమకూర్చడం గురించిన సందర్భసూచిత భావాన్ని సహజమైన తెలుగులో ‘భార్యలు దొరికేలా’ అని వ్యక్తం చేశాం; దీనిని పాదసూచికలో వెల్లడించాం.
- source_word: וַאֲנַחְנוּ נִשְׁבַּעְנוּ
  choice: మనం … ప్రమాణం చేశాం
  rationale: పూర్తయిన ప్రమాణానికి ఇప్పటికీ బంధించే ప్రభావం ఉందని perfect రూపం సూచిస్తుంది. తెలుగులో తదుపరి వాక్యం ముందటి సందిగ్ధస్థితికి కారణంగా సహజంగానే వినిపిస్తుంది; అందువల్ల ו కు ప్రత్యేక సంధానపదం చేర్చలేదు.
- source_word: בַיהוָה
  choice: యాహ్వే పేరట
  rationale: ב ఇక్కడ ప్రమాణ సూత్రంలో ప్రమాణం ఎవరిపేరట చేయబడిందో సూచిస్తుంది. యాహ్వే అనే వ్యక్తిగత దైవనామాన్ని అనువాదంలో నిలిపాం.
- source_word: לְבִלְתִּי תֵּת
  choice: ఇవ్వబోమని
  rationale: ఈ నిర్మాణం ప్రమాణపు విషయాన్ని—ఇవ్వకూడదనే నిబద్ధతను—తెలుపుతుంది. ‘ఇవ్వబోమని’ ఆధునిక తెలుగులో ప్రమాణాన్ని సహజంగా నివేదిస్తుంది.
- source_word: מִבְּנוֹתֵינוּ
  choice: మన కుమార్తెల్లో ఎవరినీ
  rationale: מן ఇక్కడ సమూహంలో నుంచి ఒక్కరినైనా ఇవ్వకూడదనే partitive భావాన్ని కలిగి ఉంది; ‘కుమార్తెల్లో ఎవరినీ’ దాన్ని స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לְנָשִׁים
  choice: భార్యగా
  rationale: రెండవ ప్రయోగం కుమార్తెలను వివాహంలో ఇవ్వడాన్ని సూచిస్తుంది. ప్రతి కుమార్తె ఒక్క పురుషునికి భార్య అవుతుందనే పంపిణీ భావానికి తెలుగు ఏకవచన ‘భార్యగా’ సహజంగా సరిపోతుంది.
theological_decisions:
- issue: יהוה దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు
  rationale: మూలపాఠంలో చతురక్షర దైవనామం ప్రత్యక్షంగా ఉంది. బిరుదుతో భర్తీ చేయకుండా ఒడంబడిక నామాన్ని ‘యాహ్వే’గా లిప్యంతరీకరించడం మూలంలోని ప్రత్యేక నామాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ప్రశ్న-వాక్య నిర్మాణం వాడబడింది. ‘దొరికేలా’ సందర్భంలో అంతర్లీనమైన భావాన్ని స్పష్టం చేస్తుంది గాని, చర్య ఏ రూపంలో ఉండాలో అదనంగా నిర్ణయించదు. దైవనామం ‘యాహ్వే’గా నిలుపబడింది.
