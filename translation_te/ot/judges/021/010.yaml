    issue: “కత్తివాత చంపండి” is malformed Telugu.
    rationale: It does not clearly communicate the Hebrew idiom לְפִי חֶרֶב, literally “by/with the edge of the sword.” “కత్తి ధారతో చంపండి” is clear, natural, and source-faithful.
  revised_text: 'కాబట్టి సమాజం పరాక్రమవంతులలోనుండి పన్నెండువేల మందిని అక్కడికి పంపింది. వారికి ఇలా ఆజ్ఞాపించింది: “మీరు వెళ్లి యాబేషు-గిలాదులో నివసించేవారిని, స్త్రీలను, చిన్నపిల్లలను కూడా కత్తి ధారతో చంపండి.”'
