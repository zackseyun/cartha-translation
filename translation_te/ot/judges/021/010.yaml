id: JDG.21.10
reference: Judges 21:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּשְׁלְחוּ שָׁ֣ם הָ/עֵדָ֗ה שְׁנֵים עָשָׂ֥ר אֶ֛לֶף אִ֖ישׁ מִ/בְּנֵ֣י הֶ/חָ֑יִל וַ/יְצַוּ֨וּ אוֹתָ֜/ם לֵ/אמֹ֗ר לְ֠כוּ וְ/הִכִּיתֶ֞ם אֶת יוֹשְׁבֵ֨י יָבֵ֤שׁ גִּלְעָד֙ לְ/פִי חֶ֔רֶב וְ/הַ/נָּשִׁ֖ים וְ/הַ/טָּֽף־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/010.yaml
  text: So the assembly sent there twelve thousand men from the sons of valor, and they commanded them, saying, “Go and strike the inhabitants of Jabesh-gilead with the edge of the sword, including the women and the little ones.”
translation:
  language: te
  text: 'కాబట్టి సమాజం పరాక్రమవంతులలోనుండి పన్నెండువేల మందిని అక్కడికి పంపింది. వారికి ఇలా ఆజ్ఞాపించింది: “మీరు వెళ్లి యాబేషు-గిలాదులో నివసించేవారిని, స్త్రీలను, చిన్నపిల్లలను కూడా కత్తి ధారతో చంపండి.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָעֵדָה
  choice: సమాజం
  rationale: ఇక్కడ ఇశ్రాయేలీయుల సమకూడిన సమూహాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో సహజంగా, సందర్భానికి తగినట్లుగా ఉంది.
- source_word: מִבְּנֵי הֶחָיִל
  choice: పరాక్రమవంతులలోనుండి
  rationale: బలం, యుద్ధసామర్థ్యం గల పురుషులను సూచించే హీబ్రూ ప్రయోగ భావాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: לְפִי חֶרֶב
  choice: కత్తివాత చంపండి
  rationale: అక్షరార్థంగా ‘కత్తి అంచుతో’; యుద్ధసందర్భంలో కత్తితో సంహరించడాన్ని సూచించే స్థిరమైన హీబ్రూ ప్రయోగాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: הַטָּף
  choice: చిన్నపిల్లలు
  rationale: ఆధారపడిన చిన్నారులు లేదా పసిపిల్లలను సూచిస్తుంది; ఈ సందర్భంలో ‘చిన్నపిల్లలు’ సహజమైన, పరిధిని అనవసరంగా కుదించని అనువాదం.
theological_decisions:
- issue: సమాజం ఇచ్చిన హింసాత్మక ఆజ్ఞను వర్ణించడం
  choice: మూలంలోని ఆజ్ఞను తగ్గించకుండా నేరుగా అనువదించడం
  alternative: హింసను మృదువుగా లేదా సమర్థనాత్మకంగా వ్యాఖ్యానించడం
  rationale: వచనం మానవ సమాజం ఇచ్చిన ఆజ్ఞను కథనంగా నమోదు చేస్తుంది; అది దేవుని ఆజ్ఞ అని మూలం చెప్పదు. అనువాదం ఈ ఉద్రిక్తతను అలాగే ఉంచాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైన కథన శైలి. హీబ్రూ వాక్యనిర్మాణాన్ని యాంత్రికంగా అనుకరించకుండా, రెండు సహజ తెలుగు వాక్యాలుగా విభజించబడింది. హింసాత్మక విషయాన్ని మృదువుపరచలేదు; మూలంలో లేని ధార్మిక వివరణను చేర్చలేదు.
