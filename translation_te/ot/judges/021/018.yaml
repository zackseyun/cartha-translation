id: JDG.21.18
reference: Judges 21:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/אֲנַ֗חְנוּ לֹ֥א נוּכַ֛ל לָ/תֵת לָ/הֶ֥ם נָשִׁ֖ים מִ/בְּנוֹתֵ֑י/נוּ כִּֽי נִשְׁבְּע֤וּ בְנֵֽי יִשְׂרָאֵל֙ לֵ/אמֹ֔ר אָר֕וּר נֹתֵ֥ן אִשָּׁ֖ה לְ/בִנְיָמִֽן־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/018.yaml
  text: But we cannot give them wives from our daughters[a], because the sons of Israel have sworn, saying, ‘Cursed is the one who gives a wife to Benjamin.’
translation:
  language: te
  text: అయితే మన కుమార్తెలలోనుండి వారికి భార్యలుగా ఇవ్వలేం. ఎందుకంటే ఇశ్రాయేలు కుమారులు, “బెన్యామీనుకు[a] భార్యను ఇచ్చేవాడు శాపగ్రస్తుడు” అని ప్రమాణం చేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, మరింత స్పష్టంగా, “బెన్యామీను గోత్రానికి” లేదా “బెన్యామీనీయునికి”; హీబ్రూ పాఠం “బెన్యామీను” అనే గోత్రనామాన్నే నేరుగా ఉపయోగిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנַחְנוּ
  choice: అయితే మనం
  rationale: సంయోజక అవ్యయం, స్వతంత్ర సర్వనామం కలిసి వక్తల తర్కంలో వ్యతిరేక మలుపును, కర్తపై ఉద్ఘాటనను చూపుతున్నాయి.
- source_word: לֹא נוּכַל
  choice: ఇవ్వలేం
  rationale: יכל సామర్థ్యం లేదా సాధ్యతను సూచిస్తుంది. సందర్భంలో ప్రమాణం వల్ల ఏర్పడిన అసాధ్యత ఉన్నా, మూలపాఠం ‘ధర్మబద్ధంగా ఇవ్వకూడదు’ అని అదనంగా చెప్పదు.
- source_word: נָשִׁים
  choice: భార్యలను
  rationale: ఈ వివాహ సందర్భంలో నామవాచకానికి ‘స్త్రీలు’ కంటే ‘భార్యలు’ అనే అర్థమే ఉద్దేశితం.
- source_word: מִבְּנוֹתֵינוּ
  choice: మన కుమార్తెలలోనుండి
  rationale: מן మూలాన్ని లేదా సమూహం నుండి ఎంపికను సూచిస్తుంది; ఈ రూపం ఆ భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: נִשְׁבְּעוּ
  choice: ప్రమాణం చేశారు
  rationale: שׁבע నిఫాల్ రూపం ప్రమాణం చేయడాన్ని సూచిస్తుంది; గతంలో చేసిన ప్రమాణం ప్రస్తుత చర్చపై ఇంకా బంధకంగా ఉన్నదని సందర్భం తెలియజేస్తుంది.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: మూలంలోని స్పష్టంగా పుంలింగ రూపమైన ‘ఇశ్రాయేలు కుమారులు’ అనే వ్యక్తీకరణను కాపాడుతుంది.
- source_word: אָרוּר
  choice: శాపగ్రస్తుడు
  rationale: నిబంధనాత్మక లేదా న్యాయపరమైన శాపానికి లోనైన స్థితిని ఆధునిక, గంభీరమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: נֹתֵן אִשָּׁה
  choice: భార్యను ఇచ్చేవాడు
  rationale: వర్తమాన కృదంతం సాధారణంగా అటువంటి పని చేసే ఏ వ్యక్తినైనా సూచిస్తుంది; వివాహ సందర్భం వల్ల אִשָּׁהను ‘భార్య’గా అనువదించాం.
- source_word: לְבִנְיָמִן
  choice: బెన్యామీనుకు
  rationale: హీబ్రూ గోత్రనామాన్ని నేరుగా ఉపయోగిస్తుంది; సందర్భంలో అది బెన్యామీను గోత్రాన్ని లేదా ఆ గోత్రస్థుణ్ణి సూచించవచ్చు కాబట్టి మూలంలోని సంక్షిప్తతను ప్రధాన పాఠంలో నిలిపాం.
