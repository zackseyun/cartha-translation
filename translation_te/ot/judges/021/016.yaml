source:
  edition: WLC
  text: וַ/יֹּֽאמְר֨וּ זִקְנֵ֣י הָ/עֵדָ֔ה מַה נַּעֲשֶׂ֥ה לַ/נּוֹתָרִ֖ים לְ/נָשִׁ֑ים כִּֽי נִשְׁמְדָ֥ה מִ/בִּנְיָמִ֖ן אִשָּֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/016.yaml
  text: Then the elders of the congregation said[a], “What shall we do for wives for those who remain, since the women of Benjamin have been destroyed?”
translation:
  language: te
  text: అప్పుడు సమాజపు పెద్దలు, “బెన్యామీనీయుల స్త్రీలు నాశనమయ్యారు[a] కాబట్టి, మిగిలినవారికి భార్యలను సమకూర్చడానికి మనం ఏమి చేయాలి?” అని అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ మూలంలో అక్షరార్థంగా, “బెన్యామీనులోనుండి ఒక స్త్రీ నాశనమైంది” అని ఉంది; ఇక్కడ “స్త్రీ” అనే ఏకవచనం బెన్యామీనీయుల స్త్రీలందరినీ సమష్టిగా సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: זִקְנֵי הָעֵדָה
  choice: సమాజపు పెద్దలు
  rationale: నిర్మాణబద్ధమైన ‘సమాజపు పెద్దలు’ అనే రూపం זִקְנֵי యొక్క సంబంధార్థాన్నీ, הָעֵדָה యొక్క సమష్టి భావాన్నీ సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: מַה נַּעֲשֶׂה
  choice: మనం ఏమి చేయాలి?
  rationale: ప్రశ్నార్థక పదంతో కూడిన ప్రథమ పురుష బహువచన అసంపూర్ణ క్రియ భవిష్య కార్యంపై సమూహపరమైన ఆలోచనను వ్యక్తం చేస్తుంది; ‘ఏమి చేయాలి?’ తెలుగులో సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: לַנּוֹתָרִים
  choice: మిగిలినవారికి
  rationale: హతకాండ తరువాత మిగిలిన పురుషులను సూచించే participial భావాన్ని అనవసర వివరణ లేకుండా దగ్గరగా నిలుపుతుంది.
- source_word: לְנָשִׁים
  choice: భార్యలు దొరికేలా
  rationale: సందర్భంలో נָשִׁים సాధారణంగా స్త్రీలను కాక వివాహ భాగస్వాములను సూచిస్తుంది. ‘భార్యలు దొరికేలా’ లక్ష్యార్థక లְ భావాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: כִּי
  choice: కాబట్టి
  rationale: ఇక్కడ כִּי పెద్దల ప్రశ్నకు కారణాన్ని ఇస్తుంది. తెలుగు వాక్య నిర్మాణంలో కారణ వాక్యాన్ని ముందుంచి ‘కాబట్టి’ అనడం స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: נִשְׁמְדָה
  choice: నాశనమయ్యారు
  rationale: שׁמד యొక్క నిఫాల్ రూపం నిర్మూలించబడడం లేదా నాశనమవడం అనే తీవ్ర భావాన్ని కలిగిస్తుంది; ‘నాశనమయ్యారు’ ఆ తీవ్రతను గౌరవప్రదమైన ప్రామాణిక తెలుగులో నిలుపుతుంది.
- source_word: מִבִּנְיָמִן אִשָּׁה
  choice: బెన్యామీనీయుల స్త్రీలు
  rationale: మూలంలో ‘బెన్యామీనులోనుండి ఒక స్త్రీ’ అని ఏకవచన సమష్టి ప్రయోగం ఉంది. తెలుగులో భావాన్ని స్పష్టంగా అందించేందుకు బహువచనం వాడి, మూలరూపాన్ని పాదటిప్పణిలో పేర్కొనడం సముచితం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక, గౌరవప్రదమైన తెలుగు వాడబడింది. ‘సమాజం,’ ‘పెద్దలు,’ ‘మిగిలినవారు’ వంటి సాధారణంగా అర్థమయ్యే పదాలతో మూలంలోని సమష్టి మరియు deliberative భావాలు నిలుపబడ్డాయి; హీబ్రూ ఏకవచన సమష్టి ప్రయోగం పాదటిప్పణిలో సంరక్షించబడింది.
