id: JDG.21.6
reference: Judges 21:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּנָּֽחֲמוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל אֶל בִּנְיָמִ֖ן אָחִ֑י/ו וַ/יֹּ֣אמְר֔וּ נִגְדַּ֥ע הַ/יּ֛וֹם שֵׁ֥בֶט אֶחָ֖ד מִ/יִּשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/006.yaml
  text: And the sons of Israel grieved over Benjamin their brother[a], and they said, “Today one tribe has been cut off from Israel.”
translation:
  language: te
  text: ఇశ్రాయేలు ప్రజలు తమ సహోదరుడైన బెన్యామీను గురించి దుఃఖపడి[a], “ఈ రోజు ఇశ్రాయేలులోనుండి ఒక గోత్రం నరికివేయబడింది” అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “తమ సహోదరుడైన బెన్యామీను మీద జాలిపడి,” లేదా “తమ సహోదరుడైన బెన్యామీను విషయంలో విచారపడి.” సందర్భాన్ని బట్టి ఈ హీబ్రూ క్రియ దుఃఖించడం, జాలిపడడం లేదా మనసు మార్చుకోవడం అనే భావాలను వ్యక్తం చేయగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּנָּחֲמוּ
  choice: దుఃఖపడి
  rationale: నחם అనే క్రియ యొక్క నిఫాల్ రూపం ఈ సందర్భంలో బెన్యామీను దాదాపు నాశనమైనందుకు కలిగిన దుఃఖం, జాలి లేదా సంతాపాన్ని సూచిస్తుంది. ప్రధాన పాఠ్యంలో ‘దుఃఖపడి’ సహజంగా ఉంది; ఇతర సాధ్యమైన భావాలను పాదటిప్పణి నిలుపుతుంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు ప్రజలు
  rationale: అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులు’ అయినా, ఆధునిక ప్రామాణిక తెలుగులో సమూహాన్ని సహజంగా, స్పష్టంగా సూచించడానికి ‘ఇశ్రాయేలు ప్రజలు’ అనుకూలం.
- source_word: אֶל
  choice: గురించి
  rationale: నחם క్రియతో కలిసి ఇది దుఃఖం లేదా జాలి ఎవరిపట్ల ఉందో సూచిస్తుంది. తెలుగులో ‘గురించి దుఃఖపడి’ సందర్భానుకూలంగా సహజంగా ఉంటుంది.
- source_word: בִּנְיָמִן אָחִיו
  choice: తమ సహోదరుడైన బెన్యామీను
  rationale: ‘అతని సహోదరుడు’ అనే ఏకవచన ప్రత్యయం సమూహవాచక కర్తతో సంబంధించి బెన్యామీనును ఇశ్రాయేలు ప్రజల సహోదర గోత్రంగా చూపుతుంది. ‘తమ సహోదరుడైన’ ఆ సామూహిక బంధుత్వాన్ని తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: נִגְדַּע
  choice: నరికివేయబడింది
  rationale: גדע క్రియలోని నరకడం అనే రూపకాన్ని నిలుపుతూ, గోత్రం ఇశ్రాయేలు సమూహం నుండి తొలగిపోయే స్థితిని తీవ్రంగా తెలియజేస్తుంది; ‘నాశనమైంది’ అని చెప్పి రూపకాన్ని లేదా సంపూర్ణ నిర్మూలన భావాన్ని ముందే నిర్ణయించదు.
- source_word: הַיּוֹם
  choice: ఈ రోజు
  rationale: కాలసంబంధమైన తక్షణతను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: שֵׁבֶט אֶחָד
  choice: ఒక గోత్రం
  rationale: ఇశ్రాయేలులోని ఒక గోత్ర విభాగాన్ని నేరుగా, సాధారణ తెలుగు బైబిలు పదజాలంలో వ్యక్తం చేస్తుంది.
- source_word: מִיִּשְׂרָאֵל
  choice: ఇశ్రాయేలులోనుండి
  rationale: వియోగార్థక מִן ఉపసర్గను నిలుపుతూ, జాతీయ సమూహం నుండి ఒక గోత్రం తొలగించబడిన భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘ఇశ్రాయేలు కుమారులు’ అనే అక్షరానువాదానికి బదులుగా సహజమైన ‘ఇశ్రాయేలు ప్రజలు’ వాడబడింది; ‘సహోదరుడు’ ద్వారా మూలంలోని కుటుంబ/సామూహిక బంధం నిలుపబడింది.
