  terminology: ‘గోత్రం’ is the established and appropriate rendering for שֵׁבֶט. ‘సహోదరుడు’ accurately retains the corporate kinship idiom. The footnote properly records the contextual semantic range of נחם without forcing a doctrinal interpretation.
