  yaml_path: translation/ot/judges/021/009.yaml
  text: And the people were mustered[a], and behold, there was not a man there from the inhabitants of Jabesh-gilead.
translation:
  language: te
  text: ప్రజల హాజరును పరిశీలించగా[a], యాబేషు-గిలాదు నివాసులలో ఒక్క మనిషీ అక్కడ లేడని తెలిసింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ప్రజలను లెక్కించినప్పుడు.” ఇక్కడి హీబ్రూ క్రియ సమకూడిన ప్రజల హాజరును పరిశీలించడం లేదా మస్టరు చేయడం అనే భావాన్ని ఇస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְפָּקֵד
  choice: లెక్కించినప్పుడు
  rationale: פקד క్రియ యొక్క ఈ రూపం ఇక్కడ సమకూడిన ప్రజల హాజరును లెక్కించి నిర్ధారించడాన్ని సూచిస్తుంది. సహజమైన తెలుగులో కాలసంబంధ ఉపవాక్యంగా అనువదించడం తరువాతి కనుగొనికతో సంబంధాన్ని స్పష్టంగా చూపుతుంది.
- source_word: הָעָם
  choice: ప్రజలను
  rationale: עָם అనేది సమకూడిన ఇశ్రాయేలీయ సమూహాన్ని సూచిస్తుంది; యుద్ధ నేపథ్యం ఉన్నప్పటికీ ‘సైన్యం’ అని అతిగా నిర్దిష్టం చేయకుండా ‘ప్రజలు’ అనే విస్తృత అర్థాన్ని నిలుపుతుంది.
- source_word: וְהִנֵּה
  choice: తెలిసింది
  rationale: הִנֵּה ఇక్కడ లెక్కింపు వల్ల బయటపడిన ఆశ్చర్యకరమైన విషయంపై దృష్టి నిలుపుతుంది. ఆధునిక సహజ తెలుగులో ‘తెలిసింది’ ఆ ఆవిష్కరణాత్మక కథన బలాన్ని అందిస్తుంది.
- source_word: אֵין שָׁם אִישׁ
  choice: ఒక్క పురుషుడు కూడా అక్కడ లేడు
  rationale: హీబ్రూలోని పురుషలింగ ఏకవచన אִישׁ ను ‘పురుషుడు’గా నిలిపి, ‘ఒక్క ... కూడా లేడు’ ద్వారా సంపూర్ణ గైర్హాజరును సహజంగా వ్యక్తం చేసింది.
- source_word: מִיּוֹשְׁבֵי
  choice: నివాసులలో
  rationale: ישב యొక్క కృదంత రూపం ఒక ప్రదేశంలో నివసించేవారిని సూచిస్తుంది; ‘నివాసులు’ ఆధునిక ప్రామాణిక తెలుగులో సహజమైన పదం.
- source_word: יָבֵשׁ גִּלְעָד
  choice: గిలాదు యాబేషు
  rationale: స్థలనామాన్ని తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించి, యాబేషును గిలాదు ప్రాంతంతో అనుసంధానించే రూపంలో ఇచ్చింది.
