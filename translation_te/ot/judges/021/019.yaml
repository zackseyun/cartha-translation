source:
  edition: WLC
  text: וַ/יֹּאמְר֡וּ הִנֵּה֩ חַג יְהוָ֨ה בְּ/שִׁל֜וֹ מִ/יָּמִ֣ים יָמִ֗ימָ/ה אֲשֶׁ֞ר מִ/צְּפ֤וֹנָ/ה לְ/בֵֽית אֵל֙ מִזְרְחָ֣/ה הַ/שֶּׁ֔מֶשׁ לִ/מְסִלָּ֔ה הָ/עֹלָ֥ה מִ/בֵּֽית אֵ֖ל שְׁכֶ֑מָ/ה וּ/מִ/נֶּ֖גֶב לִ/לְבוֹנָֽה־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/019.yaml
  text: And they said[a], "Look, there is a feast of Yahweh in Shiloh from year to year, which is north of Bethel, east of the highway that goes up from Bethel to Shechem[b], and south of Lebonah."
translation:
  language: te
  text: 'వారు ఇలా అన్నారు: “చూడండి, బేతేలుకు ఉత్తరంగా, బేతేలు నుండి షెకెము వైపు వెళ్లే ప్రధాన మార్గానికి తూర్పుగా, లెబోనాకు దక్షిణంగా ఉన్న షిలోహులో యాహ్వే పండుగ[a] ఏటేటా[b] జరుగుతుంది.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యాహ్వేకు జరిగే ఉత్సవం.”
    reason: חַג יְהוָה అనే హీబ్రూ సమాసంలోని సంబంధాన్ని మరో సహజ విధంగా వ్యక్తం చేస్తుంది.
  - marker: b
    text: 'హీబ్రూ నానుడి అక్షరార్థం: “దినాల నుండి దినాలకు”; అంటే, “సంవత్సరం నుండి సంవత్సరానికి.”'
    reason: మూలభాష నానుడి రూపాన్ని, దాని వార్షిక పునరావృత భావాన్ని పాఠకునికి తెలియజేస్తుంది.
lexical_decisions:
- source_word: הִנֵּה
  choice: చూడండి
  rationale: తరువాత చెప్పబోయే విషయంపై శ్రోతల దృష్టిని నిలిపే హీబ్రూ సూచనాత్మక పదబలాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: חַג יְהוָה
  choice: యాహ్వే పండుగ
  rationale: חַג అనేది మతపరమైన పండుగను, కొన్నిసార్లు యాత్రా పండుగను సూచిస్తుంది; ఈ సంక్షిప్త రూపం మూలంలోని సంబంధాన్ని అనవసరంగా విప్పి చెప్పకుండా ఉంచుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవ నామాన్ని బిరుదుతో భర్తీ చేయకుండా, హీబ్రూ చతురక్షర నామానికి సాధారణంగా అంగీకరించిన ఉచ్చారణను తెలుగులో లిప్యంతరీకరించింది.
- source_word: בְּשִׁלֹה
  choice: షిలోహులో
  rationale: స్థానవాచక ఉపసర్గను సహజ తెలుగు విభక్తితో, స్థలనామాన్ని లిప్యంతరీకరణతో అందిస్తుంది.
- source_word: מִיָּמִים יָמִימָה
  choice: ఏటేటా
  rationale: అక్షరార్థంగా ‘దినాల నుండి దినాలకు’ అన్న హీబ్రూ నానుడి క్రమంగా ప్రతి సంవత్సరం జరిగే విషయాన్ని సూచిస్తుంది; ‘ఏటేటా’ ఆ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: מִצְּפוֹנָה לְבֵית אֵל
  choice: బేతేలుకు ఉత్తరంగా
  rationale: షిలోహు స్థానాన్ని బేతేలుతో పోల్చి తెలిపే దిశా సంబంధాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: מִזְרְחָה הַשֶּׁמֶשׁ
  choice: తూర్పుగా
  rationale: అక్షరార్థంగా ‘సూర్యోదయం వైపుగా’; భౌగోళిక సందర్భంలో సహజమైన దిశా పదాన్ని వాడింది.
- source_word: לִמְסִלָּה
  choice: ప్రధాన మార్గానికి
  rationale: מְסִלָּה సాధారణంగా గుర్తింపుగల నిర్మిత లేదా ప్రధాన రహదారిని సూచిస్తుంది; ‘ప్రధాన మార్గం’ ఆధునిక పాఠకునికి సహజంగా ఉంటుంది.
- source_word: הָעֹלָה מִבֵּית אֵל שְׁכֶמָה
  choice: బేతేలు నుండి షెకెము వైపు వెళ్లే
  rationale: ‘పైకి వెళ్లే’ అనే హీబ్రూ భౌగోళిక వాడుకను తెలుగులో మార్గ గమ్యాన్ని స్పష్టంగా తెలిపే విధంగా అందిస్తుంది; షెకెము పేరులోని దిశార్థక ప్రత్యయం వల్ల ‘వైపు’ అని అనువదించింది.
- source_word: וּמִנֶּגֶב לִלְבוֹנָה
  choice: లెబోనాకు దక్షిణంగా
  rationale: షిలోహు స్థానాన్ని నిర్ధారించే చివరి దిశా సంబంధాన్ని సంక్షిప్తంగా, స్పష్టంగా అందిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవ నామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: ఇది వివాదాస్పద పాఠభేదం లేని కథన సందర్భం. వ్యక్తిగత దైవ నామాన్ని బిరుదుగా మార్చకుండా, ‘Yahweh’ ఉచ్చారణకు సమీపమైన తెలుగు లిప్యంతరీకరణను వాడింది.
- issue: חַג יְהוָה లోని సంబంధం
  choice: యాహ్వే పండుగ
  alternative: యాహ్వేకు జరిగే పండుగ
  rationale: హీబ్రూ నిర్మాణం ‘యాహ్వేకు’ లేదా ‘యాహ్వేకు చెందిన’ అనే సంబంధ ఛాయలను కలిగి ఉండగలదు. ప్రధాన పాఠంలో సంక్షిప్త సమాసాన్ని ఉంచి, ఒకే వివరణను బలవంతంగా నిర్ణయించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలిని వాడింది. స్థలవివరణను మూలంలోని భౌగోళిక క్రమానికి దగ్గరగా ఉంచుతూ, తెలుగులో సులభంగా గ్రహించగల వాక్య నిర్మాణంగా మార్చింది. ‘చూడండి’ అనే పదం הִנֵּה యొక్క దృష్టి ఆకర్షణ బలాన్ని నిలుపుతుంది; స్థలనామాలు షిలోహు, బేతేలు, షెకెము, లెబోనా అని స్థిరంగా లిప్యంతరీకరించబడ్డాయి.
