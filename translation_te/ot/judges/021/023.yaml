  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּֽעֲשׂוּ כֵן֙ בְּנֵ֣י בִנְיָמִ֔ן וַ/יִּשְׂא֤וּ נָשִׁים֙ לְ/מִסְפָּרָ֔/ם מִן הַ/מְּחֹלְל֖וֹת אֲשֶׁ֣ר גָּזָ֑לוּ וַ/יֵּלְכ֗וּ וַ/יָּשׁ֨וּבוּ֙ אֶל נַ֣חֲלָתָ֔/ם וַ/יִּבְנוּ֙ אֶת הֶ֣/עָרִ֔ים וַ/יֵּשְׁב֖וּ בָּ/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/023.yaml
  text: So the sons of Benjamin did so[a], and took wives according to their number from the dancers whom they had seized. Then they went and returned to their inheritance, rebuilt the cities[c][b], and lived in them.
translation:
  language: te
  text: బెన్యామీను కుమారులు అలాగే చేశారు. వారు నాట్యం చేస్తున్న స్త్రీలలో తమ సంఖ్యకు అనుగుణంగా బలవంతంగా పట్టుకుపోయిన వారిని[a] భార్యలుగా తీసుకున్నారు. తరువాత వారు బయలుదేరి తమ స్వాస్థ్యానికి తిరిగి వెళ్లి, పట్టణాలను తిరిగి కట్టారు[b] మరియు వాటిలో నివసించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “లాక్కుపోయిన వారిని,” “అపహరించిన వారిని.” హీబ్రూ క్రియ బలవంతంగా తీసుకెళ్లడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ అక్షరార్థం “పట్టణాలను కట్టారు.” అంతకు ముందు బెన్యామీను పట్టణాలు నాశనం చేయబడిన సందర్భాన్ని బట్టి ఇక్కడ “తిరిగి కట్టారు” అని అనువదించబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ כֵן
  choice: అలాగే చేశారు
  rationale: ముందు చెప్పిన పథకాన్ని వారు అమలు చేశారనే హీబ్రూ కథన సూత్రాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: בְּנֵי בִנְיָמִן
  choice: బెన్యామీను కుమారులు
  rationale: హీబ్రూలోని కుటుంబ-గోత్ర సంబంధమైన వ్యక్తీకరణను నిలుపుతుంది; ఈ సందర్భంలో చర్య చేసిన గోత్రపు పురుషులను సూచిస్తుంది.
- source_word: וַיִּשְׂאוּ נָשִׁים
  choice: భార్యలుగా తీసుకున్నారు
  rationale: వివాహార్థకమైన హీబ్రూ నుడికారాన్ని తెలుగులో స్పష్టంగా, మూలానికి దగ్గరగా వ్యక్తపరుస్తుంది.
- source_word: לְמִסְפָּרָם
  choice: తమ సంఖ్యకు తగినంతమందిని
  rationale: బెన్యామీను పురుషుల అవసరమైన సంఖ్యకు సరిపడేంత మంది స్త్రీలను తీసుకున్నారనే భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: מִן הַמְּחֹלְלוֹת
  choice: నాట్యం చేస్తున్న స్త్రీలలో
  rationale: హీబ్రూ పదం స్త్రీలింగ బహువచన క్రియావిశేషణ రూపంలో ఉండి, నాట్యం చేస్తున్న స్త్రీలను సూచిస్తుంది.
- source_word: אֲשֶׁר גָּזָלוּ
  choice: బలవంతంగా పట్టుకుపోయి
  rationale: גזל పదంలోని బలప్రయోగం, అపహరణ భావాలను సున్నితం చేయకుండా స్పష్టంగా నిలుపుతుంది.
- source_word: וַיֵּלְכוּ וַיָּשׁוּבוּ
  choice: వారు బయలుదేరి ... తిరిగి వెళ్లి
  rationale: పండుగ స్థలం నుంచి వెళ్లడం, తమ భూభాగానికి తిరిగి చేరడం అనే రెండు హీబ్రూ క్రియలనూ నిలుపుతుంది.
- source_word: אֶל נַחֲלָתָם
  choice: తమ స్వాస్థ్యానికి
  rationale: గోత్రానికి సంక్రమించిన భూవాటా అనే נחלה పదపు వారసత్వ భావాన్ని కాపాడుతుంది.
- source_word: וַיִּבְנוּ אֶת הֶעָרִים
  choice: పట్టణాలను తిరిగి కట్టుకొని
  rationale: క్రియ అక్షరార్థంగా ‘కట్టారు’ అయినా, అంతర్యుద్ధంలో ధ్వంసమైన బెన్యామీను పట్టణాల పునర్నిర్మాణమే సందర్భార్థం; పాదసూచికలో అక్షరార్థాన్ని అందించింది.
- source_word: וַיֵּשְׁבוּ בָּהֶם
  choice: వాటిలో నివసించారు
  rationale: పట్టణాల్లో స్థిరంగా ఉండడం అనే భావాన్ని సరళమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: స్త్రీలను తీసుకెళ్లిన విధానాన్ని తెలిపే גָּזָלוּ పదంలోని నైతిక బలం
  choice: బలవంతంగా పట్టుకుపోయి
  alternative: తీసుకుపోయి
  rationale: మూలపదం బలప్రయోగంతో లాక్కోవడం లేదా అపహరించడం అనే అర్థం ఇస్తుంది. కథనం ఈ చర్యను వివరించినంత మాత్రాన అనుమోదిస్తున్నట్లు చూపకుండా, దాని నైతికంగా కలవరపరిచే స్వభావాన్ని అనువాదం నిలుపుతుంది.
- issue: గోత్రం మరియు వాగ్దాన భూమికి సంబంధించిన పదజాలం
  choice: బెన్యామీను కుమారులు; స్వాస్థ్యం
  alternative: బెన్యామీనీయులు; భూభాగం
  rationale: ఇవి హీబ్రూ కథనంలోని కుటుంబ-గోత్ర నిర్మాణాన్ని, సంక్రమించిన భూవాటా భావాన్ని అనవసరంగా సాధారణీకరించకుండా నిలుపుతాయి.
- issue: ‘కట్టారు’ అనే మూలక్రియను సందర్భానుసారంగా పునర్నిర్మాణంగా వ్యక్తపరచడం
  choice: తిరిగి కట్టుకొని
  alternative: కట్టుకొని
  rationale: ముందటి కథనంలో బెన్యామీను పట్టణాలు నాశనం చేయబడ్డాయి; కాబట్టి ఇక్కడ పునర్నిర్మాణం ఉద్దేశించబడింది. అయినా మూలంలోని సాధారణ క్రియను పాదసూచికలో వెల్లడించడం ద్వారా భాషా వివరాన్ని దాచలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సరళంగా ఉన్నప్పటికీ గౌరవప్రదమైన కథన శైలి పాటించబడింది. మూలంలోని బలప్రయోగ భావం సున్నితం చేయబడలేదు; గోత్ర, స్వాస్థ్య పదజాలం నిలుపబడింది.
