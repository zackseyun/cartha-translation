revisions:
- from: అప్పుడు సమాజమంతా రిమ్మోను బండ దగ్గర ఉన్న బెన్యామీను కుమారులకు కబురు పంపి, వారితో మాట్లాడి, వారికి శాంతిని ప్రకటించింది.[a]
  to: అప్పుడు సమాజమంతా రిమ్మోను శిల వద్ద ఉన్న బెన్యామీను కుమారులకు సందేశం పంపి, వారితో మాట్లాడి, వారికి శాంతిని ప్రకటించింది.[a]
  rationale: The revision tightens the locative rendering from ‘near’ to ‘at,’ retains the source’s ambiguity over whether the expression is descriptive or a fixed place-name, and standardizes the transliteration in the footnote. No theological interpretation has been added.
