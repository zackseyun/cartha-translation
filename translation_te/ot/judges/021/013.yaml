  variant: modern standard Telugu
source:
  edition: WLC
  text: וַֽ/יִּשְׁלְחוּ֙ כָּל הָ֣/עֵדָ֔ה וַֽ/יְדַבְּרוּ֙ אֶל בְּנֵ֣י בִנְיָמִ֔ן אֲשֶׁ֖ר בְּ/סֶ֣לַע רִמּ֑וֹן וַ/יִּקְרְא֥וּ לָ/הֶ֖ם שָׁלֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/013.yaml
  text: Then the whole congregation sent word and spoke to the sons of Benjamin who were at the rock of Rimmon[a], and proclaimed peace to them.
translation:
  language: te
  text: అప్పుడు సమాజమంతా రిమ్మోను శిల వద్ద ఉన్న బెన్యామీను కుమారులకు సందేశం పంపి, వారితో మాట్లాడి, వారికి శాంతిని ప్రకటించింది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సెలా-రిమ్మోనులో ఉన్న”; హీబ్రూ పదబంధాన్ని “రిమ్మోను శిల” అనే వర్ణనగా గానీ, స్థిరమైన స్థలనామంగా గానీ అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁלְחוּ
  choice: కబురు పంపి
  rationale: శׁלח అనే క్రియ ప్రాథమికంగా ‘పంపు’ అని అర్థం. వెంటనే ‘వారితో మాట్లాడి’ అని రావడం వల్ల ఇది సమాచారాన్ని చేరవేయడానికి చేసిన పంపకమని సందర్భం సూచిస్తుంది; అయితే మూలంలో లేని ‘దూతలను’ అని స్పష్టంగా చేర్చలేదు.
- source_word: כָּל הָעֵדָה
  choice: సమాజమంతా
  rationale: עֵדָה ఇశ్రాయేలు ప్రజాసమూహాన్ని సూచిస్తుంది; כָּל‌ను సహజమైన ఆధునిక తెలుగులో ‘అంతా’గా వ్యక్తం చేశాం.
- source_word: וַיְדַבְּרוּ אֶל
  choice: వారితో మాట్లాడి
  rationale: דבר אל సాధారణంగా ఒకరిని ఉద్దేశించి మాట్లాడడాన్ని సూచిస్తుంది. తెలుగులో ‘వారితో మాట్లాడి’ సహజంగా ఉండి పరస్పర సంభాషణను అతిగా నిర్ధారించదు.
- source_word: בְּנֵי בִנְיָמִן
  choice: బెన్యామీను కుమారులు
  rationale: హీబ్రూ గోత్రసంబంధమైన ‘బెన్యామీను కుమారులు’ అనే రూపాన్ని నిలిపి, సాధారణీకరించిన ‘బెన్యామీనీయులు’ అనే ప్రత్యామ్నాయాన్ని ఎంచుకోలేదు.
- source_word: אֲשֶׁר בְּסֶלַע רִמּוֹן
  choice: రిమ్మోను బండ దగ్గర ఉన్న
  rationale: סֶלַע అంటే ‘బండ/శిలాబండ’. בְּ ఇక్కడ స్థలసంబంధాన్ని సూచిస్తుంది; తెలుగులో సహజంగా ‘దగ్గర’ అని ఇచ్చాం. మొత్తం పదబంధాన్ని స్థిర స్థలనామంగా కూడా గ్రహించవచ్చనే సందిగ్ధతను పాదటిప్పణిలో ఉంచాం.
- source_word: וַיִּקְרְאוּ לָהֶם שָׁלוֹם
  choice: వారికి శాంతిని ప్రకటించింది
  rationale: קרא + పరోక్ష కర్మ + שׁלום ఇక్కడ శాంతియుత సంబంధాన్ని బహిరంగంగా ప్రకటించడం లేదా అందించడం సూచిస్తుంది. ‘ప్రకటించింది’ దాని ప్రకటనాత్మక బలాన్ని నిలుపుతుంది.
- source_word: שָׁלוֹם
  choice: శాంతి
  rationale: ఈ సందర్భంలో שׁלום వ్యక్తిగత క్షేమం కంటే శత్రుత్వానికి ముగింపు, శాంతియుత సంబంధం అనే భావాన్ని సూచిస్తుంది; ‘శాంతి’ ఆ విస్తృత భావాన్ని నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలిని ఉపయోగించాం. మూలంలోని వరుస క్రియలను తెలుగు వాక్యప్రవాహానికి అనుగుణంగా అసమాపక క్రియలతో కలిపాం. ఏకవచన క్రియారూపమైన ‘ప్రకటించింది’ సమూహవాచకమైన ‘సమాజమంతా’తో అన్వయిస్తుంది.
