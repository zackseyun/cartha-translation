source:
  edition: WLC
  text: וְ/הָיָ֡ה כִּֽי יָבֹ֣אוּ אֲבוֹתָ/ם֩ א֨וֹ אֲחֵי/הֶ֜ם ל/רוב אֵלֵ֗י/נוּ וְ/אָמַ֤רְנוּ אֲלֵי/הֶם֙ חָנּ֣וּ/נוּ אוֹתָ֔/ם כִּ֣י לֹ֥א לָקַ֛חְנוּ אִ֥ישׁ אִשְׁתּ֖/וֹ בַּ/מִּלְחָמָ֑ה כִּ֣י לֹ֥א אַתֶּ֛ם נְתַתֶּ֥ם לָ/הֶ֖ם כָּ/עֵ֥ת תֶּאְשָֽׁמוּ־׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/022.yaml
  text: And it shall be[a], when their fathers or their brothers come to contend with us, that we will say to them, ‘Show us favor concerning them, because we did not take for each man his wife in the battle; for you did not give them to them[e][d][c][b], at this time, so that you should incur guilt.’
translation:
  language: te
  text: 'వారి తండ్రులుగానీ సోదరులుగానీ మాతో వాదించడానికి[a] వచ్చినప్పుడు, మేము వారితో ఇలా అంటాం: “వారి విషయంలో మాపట్ల దయ చూపండి[b]. యుద్ధంలో ప్రతి ఒక్కరికీ భార్యను మేము తీసుకోలేదు[c]. ఎందుకంటే, మీరు ఇప్పుడు వారిని వీరికి ఇచ్చి ఉంటే, మీరు దోషులయ్యేవారు[d].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “మాపై ఫిర్యాదు చేయడానికి,” “మాతో తగవుపడడానికి.”
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “వారి విషయంలో మాపై దయ చూపండి.” ఈ విజ్ఞప్తి స్త్రీల విషయమై మాట్లాడుతున్నవారి పట్ల దయ చూపాలని కోరుతోంది; సందర్భంలో వారిని తమ వద్ద ఉండనివ్వమనే భావమూ ఉండవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: 'హీబ్రూ వాక్యం సంక్షిప్తంగా, “యుద్ధంలో ప్రతి ఒక్కరి భార్యను మేము తీసుకోలేదు” అన్నట్టు ఉంది. సందర్భంలో భావం: యుద్ధంలో బెన్యామీను పురుషులందరికీ సరిపడా భార్యలు లభించలేదు.'
    reason: cultural_note
  - marker: d
    text: చివరి ఉపవాక్యంలోని హీబ్రూ క్లిష్టంగా ఉంది. “వారిని” స్త్రీలను, “వీరికి” బెన్యామీను పురుషులను సూచిస్తుంది. సందర్భంలో, కుటుంబాలు ఇప్పుడు స్త్రీలను అధికారికంగా ఇచ్చినట్లయితే తమ ప్రమాణాన్ని ఉల్లంఘించిన దోషం వారికి వచ్చేదనే భావం కనిపిస్తుంది.
    reason: textual_or_grammatical_difficulty
lexical_decisions:
- source_word: לָרִיב
  choice: మాతో వాదించడానికి
  rationale: ריב అనే పదంలోని ప్రతికూల వివాద భావాన్ని నిలుపుతుంది; దానిని తప్పనిసరిగా న్యాయస్థాన వ్యాజ్యంగా పరిమితం చేయదు.
- source_word: חָנּוּנוּ אוֹתָם
  choice: వారి విషయంలో మమ్మల్ని కనికరించండి
  rationale: חנן క్రియలోని కృప లేదా కనికరం చూపాలనే విజ్ఞప్తినీ, తరువాతి స్త్రీలింగ బహువచన సర్వనామంతో స్త్రీలకు ఉన్న సంబంధాన్నీ నిలుపుతుంది.
- source_word: לֹא לָקַחְנוּ אִישׁ אִשְׁתּוֹ בַּמִּלְחָמָה
  choice: యుద్ధంలో ప్రతి ఒక్కరికీ ఒక భార్యను మేము తీసుకురాలేదు
  rationale: హీబ్రూ వాక్యంలోని సంక్షిప్తమైన, కొంత అస్పష్టమైన నిర్మాణాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తూ, ప్రతి బెన్యామీనీయునికీ భార్య లభించలేదనే సందర్భార్థాన్ని తెలియజేస్తుంది.
- source_word: לֹא אַתֶּם נְתַתֶּם לָהֶם
  choice: వారిని వీరికి ఇచ్చింది మీరు కాదు
  rationale: స్త్రీలను సూచించే ‘వారిని,’ బెన్యామీనీయులను సూచించే ‘వీరికి’ అనే రెండు భిన్న సర్వనామ సంబంధాలను స్పష్టంగా ఉంచుతుంది; కుటుంబాలు స్త్రీలను అధికారికంగా ఇచ్చి వివాహం చేయలేదనే వ్యత్యాసాన్ని నిలుపుతుంది.
- source_word: כָּעֵת תֶּאְשָׁמוּ
  choice: అలా ఇచ్చి ఉంటే ఇప్పుడు మీరు దోషులయ్యేవారు
  rationale: కష్టమైన హీబ్రూ అంత్యవాక్యాన్ని సందర్భానికి అనుగుణమైన షరతు-ఫలిత భావంతో అందిస్తుంది; ‘ఇప్పుడు’ ద్వారా כָּעֵת లోని కాలసూచనను నిలుపుతుంది.
theological_decisions:
- issue: కుటుంబాల దోషం గురించి చివరి ఉపవాక్యంలోని సంబంధం
  choice: స్త్రీలను కుటుంబాలే ఇచ్చి ఉంటే వారు దోషులయ్యేవారని షరతు భావంతో అనువదించడం
  alternative: ‘ఇప్పుడు మీరు దోషులు కారు’ అని నేరుగా చెప్పడం
  rationale: మూలంలోని תֶּאְשָׁמוּ (‘మీరు దోషులవుతారు/దోషం మోస్తారు’) అనే సానుకూల క్రియారూపాన్ని నిలుపుతూ, సందర్భం సూచించే అవాస్తవ షరతును తెలుగులో స్పష్టం చేస్తుంది; కథకుడు చర్యను నైతికంగా ఆమోదిస్తున్నాడని అదనంగా ప్రకటించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. ‘తండ్రులుగానీ సోదరులుగానీ,’ ‘వారిని వీరికి’ వంటి రూపాలు మూలంలోని సంబంధాలను స్పష్టంగా ఉంచుతాయి. మూలంలోని నైతిక ఉద్రిక్తతను సర్దిచెప్పకుండా, వక్తల వాదనగానే వాక్యం అందించబడింది.
