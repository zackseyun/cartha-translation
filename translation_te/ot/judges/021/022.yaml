  source_fidelity: ముసాయిదా మొత్తం మీద మూలార్థాన్ని బాగా అనుసరిస్తుంది. అయితే చివరి వాక్యంలో “వారిని వీరికి ఇచ్చింది మీరు కాదు” అనే భూతకాల నిర్ధారణ, హీబ్రూ క్లిష్టమైన నిర్మాణంలో సందర్భం సూచించే ఊహాత్మక/పరిణామ భావాన్ని తగినంతగా ప్రతిబింబించదు. అలాగే “తీసుకురాలేదు” కంటే “తీసుకోలేదు” మూల క్రియకు మరింత సమీపం.
