  terminology: “వాదించడానికి,” “దయ,” “యుద్ధం,” “దోషులు” సందర్భానుకూలమైన పదాలు. స్త్రీలను, బెన్యామీనీయులను వేర్వేరుగా సూచించే సర్వనామాలను ప్రధాన పాఠంలో నిలిపి ఉంచడం అవసరం.
