    rationale: లָקַחְנוּకు “తీసుకోలేదు” ప్రత్యక్షమైన సమానం; “తీసుకురాలేదు”లో ‘తరలించి తీసుకురావడం’ అనే అదనపు సూచన వస్తుంది.
  - severity: low
