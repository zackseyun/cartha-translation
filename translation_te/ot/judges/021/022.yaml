revisions:
- from: 'వారి తండ్రులుగానీ సోదరులుగానీ మాతో వాదించడానికి[a] వచ్చినప్పుడు, మేము వారితో ఇలా అంటాం: “వారి విషయంలో మమ్మల్ని కనికరించండి[b]. యుద్ధంలో ప్రతి ఒక్కరికీ ఒక భార్యను మేము తీసుకురాలేదు[c]. వారిని వీరికి ఇచ్చింది మీరు కాదు; అలా ఇచ్చి ఉంటే ఇప్పుడు మీరు దోషులయ్యేవారు[d].”'
  to: 'వారి తండ్రులుగానీ సోదరులుగానీ మాతో వాదించడానికి[a] వచ్చినప్పుడు, మేము వారితో ఇలా అంటాం: “వారి విషయంలో మాపట్ల దయ చూపండి[b]. యుద్ధంలో ప్రతి ఒక్కరికీ భార్యను మేము తీసుకోలేదు[c]. ఎందుకంటే, మీరు ఇప్పుడు వారిని వీరికి ఇచ్చి ఉంటే, మీరు దోషులయ్యేవారు[d].”'
  rationale: సవరణ చివరి క్లిష్టమైన హీబ్రూ ఉపవాక్యంలోని సందర్భసూచిత ఊహాత్మక పరిణామాన్ని ప్రతిబింబిస్తుంది; కానీ దానిని సిద్ధాంతపరమైన లేదా నైతిక తీర్పుగా విస్తరించదు. విజ్ఞప్తి మరియు యుద్ధసంబంధ పదబంధాలను మరింత సహజమైన, మూలానికి సమీపమైన తెలుగులో మలిచింది. అన్ని ఫుట్‌నోట్ గుర్తులు వాటి సంబంధిత కష్టమైన స్థలాల వద్దనే ఉంచబడ్డాయి.
