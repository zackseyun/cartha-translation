source:
  edition: WLC
  text: וַ/יֹּֽאמְרוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל מִ֠י אֲשֶׁ֨ר לֹא עָלָ֧ה בַ/קָּהָ֛ל מִ/כָּל שִׁבְטֵ֥י יִשְׂרָאֵ֖ל אֶל יְהוָ֑ה כִּי֩ הַ/שְּׁבוּעָ֨ה הַ/גְּדוֹלָ֜ה הָיְתָ֗ה לַ֠/אֲשֶׁר לֹא עָלָ֨ה אֶל יְהוָ֧ה הַ/מִּצְפָּ֛ה לֵ/אמֹ֖ר מ֥וֹת יוּמָֽת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/005.yaml
  text: And the sons of Israel said[a], “Who is there from all the tribes of Israel who did not come up to Yahweh in the assembly?” For the great oath had been made concerning whoever did not come up to Yahweh at Mizpah, saying[b], “He shall surely be put to death.”
translation:
  language: te
  text: 'ఇశ్రాయేలు కుమారులు[a] ఇలా అన్నారు: “ఇశ్రాయేలు గోత్రాలన్నిటిలోనుండి సభలో యాహ్వే[b] వద్దకు రాని వాడు ఎవరు?” ఎందుకంటే, మిస్పాలో యాహ్వే వద్దకు రాని వానిని గూర్చి, “అతడు తప్పకుండా చంపబడతాడు” అని గొప్ప ప్రమాణం చేయబడింది.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఇశ్రాయేలీయులు.”
    reason: lexical_alternative
  - marker: b
    text: “యాహ్వే” అనేది హీబ్రూ దైవనామమైన YHWHను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: హీబ్రూ భాషలోని లింగసూచక సామూహిక నుడికారాన్ని నిలుపుతుంది; సహజమైన ప్రత్యామ్నాయం ‘ఇశ్రాయేలీయులు’ను పాదసూచికలో ఇచ్చాం.
- source_word: מִי אֲשֶׁר
  choice: రానివాడు ఎవరు?
  rationale: ప్రశ్నార్థక–సంబంధ వాక్య నిర్మాణాన్ని సహజమైన తెలుగు ప్రశ్నగా వ్యక్తపరుస్తుంది.
- source_word: לֹא עָלָה
  choice: రానివాడు
  rationale: עלהలోని ‘పైకి రావడం’ భావాన్ని ఈ సందర్భంలో తెలుగు సహజత్వం కోసం ‘రావడం’గా అనువదించాం; సమకూడే స్థలానికి రావడమే ప్రధాన భావం.
- source_word: בַקָּהָל
  choice: సభలో
  rationale: קהל అంటే కూడిన సమాజం లేదా సభ; ב ఉపసర్గను ‘లో’గా నేరుగా ప్రతిబింబిస్తుంది.
- source_word: אֶל יְהוָה
  choice: యెహోవా దగ్గరికి
  rationale: אֶל యొక్క దిశాసూచక భావాన్ని నిలుపుతూ తెలుగులో సహజంగా ఉంది.
- source_word: הַשְּׁבוּעָה הַגְּדוֹלָה
  choice: గొప్ప ప్రమాణం
  rationale: నామవాచకం, విశేషణం రెండింటినీ నేరుగా నిలుపుతుంది; ‘గంభీరమైన ప్రమాణం’ అని అర్థాన్ని ముందే నిర్ణయించదు.
- source_word: הָיְתָה לַאֲשֶׁר
  choice: రానివాడి గురించి ... ప్రమాణం చేశారు
  rationale: ఆ ప్రమాణం ఎవరికి వర్తించిందో తెలుగులో స్పష్టంగా, సహజంగా తెలియజేస్తుంది; హీబ్రూ భావాన్ని అనవసరంగా మరింత నిర్దిష్టం చేయదు.
- source_word: הַמִּצְפָּה
  choice: మిస్పాలో
  rationale: స్థలనామాన్ని తెలుగు ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించి, సందర్భంలోని స్థలార్థాన్ని ‘లో’తో తెలిపాం.
- source_word: לֵאמֹר
  choice: అని
  rationale: ప్రమాణంలోని మాటలను పరిచయం చేసే సహజమైన తెలుగు రూపం.
- source_word: מוֹת יוּמָת
  choice: అతడు తప్పకుండా చంపబడతాడు
  rationale: హీబ్రూ infinitive absolute ఇచ్చే నిశ్చయార్థాన్ని ‘తప్పకుండా’తోనూ, క్రియలోని passive భావాన్ని ‘చంపబడతాడు’తోనూ నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలంలో ఉన్న వ్యక్తిగత దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో స్థిరపడిన ‘యెహోవా’ రూపంలో ఇచ్చాం; పాదసూచికలో ఇది YHWH అని స్పష్టం చేశాం.
- issue: בְּנֵי יִשְׂרָאֵל అనే లింగసూచక సామూహిక పదబంధం
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలీయులు
  rationale: మూలంలోని పుంలింగ సామూహిక నుడికారాన్ని ప్రధాన పాఠంలో నిలిపి, సహజమైన సామూహిక రూపాన్ని పాదసూచికలో అందించాం.
- issue: מוֹת יוּמָתలోని శిక్షాత్మక భావం
  choice: అతడు తప్పకుండా చంపబడతాడు
  alternative: అతడు తప్పకుండా చనిపోతాడు
  rationale: సందర్భంలోని సామూహిక ప్రమాణం మరియు హీబ్రూ passive క్రియ చంపివేయబడే శిక్షను సూచిస్తాయి; కేవలం సహజ మరణంలా వినిపించే ప్రత్యామ్నాయాన్ని ఎంచుకోలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని ఉపయోగించాం. హీబ్రూ వాక్య నిర్మాణాన్ని సాధ్యమైనంతవరకు నిలిపినా, తెలుగు సహజత్వం కోసం క్రియాక్రమాన్ని సవరించాం. రెండు పాదసూచిక గుర్తులూ ప్రధాన పాఠంలో సంబంధిత పదాల వెంట ఉంచబడ్డాయి.
