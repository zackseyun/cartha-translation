translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి. హీబ్రూ వాక్యంలోని రెండు బయలుదేరే క్రియలను నిలిపి ఉంచుతూ, తెలుగులో అనవసరమైన కఠినతను తగ్గించాం. מִשְׁפָּחָה యొక్క విస్తృత బంధుత్వ భావాన్ని ‘వంశం’తో వ్యక్తపరిచాం.
