base_translation:
  language: en
  yaml_path: translation/ot/judges/021/024.yaml
  text: Then the sons of Israel departed from there at that time[a], each man to his tribe and to his family, and they went out from there[b], each man to his inheritance.
translation:
  language: te
  text: ఆ సమయంలో ఇశ్రాయేలీయులు అక్కడి నుండి బయలుదేరారు; ప్రతి ఒక్కరూ తమ తమ గోత్రాలకు, కుటుంబాలకు[a] వెళ్లారు. వారు అక్కడి నుండి, ప్రతి ఒక్కరూ తమ స్వాస్థ్యానికి[b] వెళ్లారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, «తమ వంశాలకు»; ఇక్కడి హీబ్రూ పదం సమీప కుటుంబం కంటే విస్తృతమైన బంధుత్వ సమూహాన్ని కూడా సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అంటే, తమకు వారసత్వంగా కేటాయించబడిన భూభాగానికి.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְהַלְּכוּ
  choice: బయలుదేరి ... వెళ్లారు
  rationale: హిత్పయేల్ రూపం ఇక్కడ నడక విధానాన్ని కాక, ఆ స్థలం నుంచి చెదరిపోయి బయలుదేరడాన్ని సూచిస్తుంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు ప్రజలు
  rationale: అక్షరార్థమైన ‘ఇశ్రాయేలు కుమారులు’ కంటే, సమూహాన్ని సూచించే ఈ హీబ్రూ నానుడికి ఆధునిక తెలుగులో సహజమైన రూపం.
- source_word: בָּעֵת הַהִיא
  choice: ఆ సమయంలో
  rationale: హీబ్రూ కాలసూచక పదబంధాన్ని నేరుగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: אִישׁ
  choice: ప్రతి ఒక్కరూ
  rationale: ఇక్కడ אִישׁ పంపిణీ భావంలో సమూహంలోని ఒక్కొక్కరిని సూచిస్తుంది; తెలుగు వాక్యనిర్మాణంలో ‘ప్రతి ఒక్కరూ’ సహజంగా ఉంటుంది.
- source_word: לְשִׁבְטוֹ
  choice: తమ గోత్రం దగ్గరికి
  rationale: שֵׁבֶטకు ఇశ్రాయేలు సామాజిక నిర్మాణంలో స్థిరమైన తెలుగు పదం ‘గోత్రం’; לְ దిశ లేదా చేరికను సూచిస్తుంది.
- source_word: וּלְמִשְׁפַּחְתּוֹ
  choice: తమ వంశం దగ్గరికి
  rationale: מִשְׁפָּחָה ఇక్కడ ఆధునిక అణుకుటుంబం కంటే విస్తృతమైన బంధుత్వ సమూహాన్ని సూచించవచ్చు; ‘వంశం’ ఆ పరిధిని సహజంగా తెలియజేస్తుంది.
- source_word: וַיֵּצְאוּ
  choice: వెళ్లిపోయారు
  rationale: יצא యొక్క బయలుదేరే భావాన్ని తెలుగులో సహజంగా అందిస్తుంది; సందర్భంలో ‘తిరిగి వెళ్లారు’ అని మూలంలో లేని భావాన్ని చేర్చదు.
- source_word: לְנַחֲלָתוֹ
  choice: తమ స్వాస్థ్యానికి
  rationale: נַחֲלָה వారసత్వంగా లభించిన భూభాగం లేదా హక్కుగల స్వాధీనాన్ని సూచిస్తుంది; ‘స్వాస్థ్యం’ దాని న్యాయపరమైన, భూసంబంధమైన భావాలను నిలుపుతుంది.
