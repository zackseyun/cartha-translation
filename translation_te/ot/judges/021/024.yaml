- from: ఆ సమయంలో ఇశ్రాయేలు ప్రజలు అక్కడి నుంచి బయలుదేరి, ప్రతి ఒక్కరూ తమ గోత్రం దగ్గరికి, తమ వంశం దగ్గరికి వెళ్లారు; అక్కడి నుంచి ప్రతి ఒక్కరూ తమ స్వాస్థ్యానికి[a] వెళ్లిపోయారు.
  to: ఆ సమయంలో ఇశ్రాయేలీయులు అక్కడి నుండి బయలుదేరారు; ప్రతి ఒక్కరూ తమ తమ గోత్రాలకు, కుటుంబాలకు[a] వెళ్లారు. వారు అక్కడి నుండి, ప్రతి ఒక్కరూ తమ స్వాస్థ్యానికి[b] వెళ్లారు.
