id: JDG.21.3
reference: Judges 21:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֣אמְר֔וּ לָ/מָ֗ה יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל הָ֥יְתָה זֹּ֖את בְּ/יִשְׂרָאֵ֑ל לְ/הִפָּקֵ֥ד הַ/יּ֛וֹם מִ/יִּשְׂרָאֵ֖ל שֵׁ֥בֶט אֶחָֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/003.yaml
  text: And they said[a], “Why, O Yahweh, God of Israel, has this happened in Israel[b], that today one tribe should be lacking from Israel?”
translation:
  language: te
  text: అప్పుడు వారు, “ఇశ్రాయేలు దేవుడవైన యాహ్వే, నేడు ఇశ్రాయేలు నుండి ఒక గోత్రం లేకపోయేలా ఇశ్రాయేలులో ఇది ఎందుకు జరిగింది?” అని అన్నారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: అప్పుడు వారు … అని అన్నారు
  rationale: వావ్-క్రమ కథన ప్రవాహాన్ని సహజమైన ఆధునిక తెలుగులో ముందుకు నడిపిస్తుంది.
- source_word: לָמָה
  choice: ఎందుకు
  rationale: విలాపంతో కూడిన ప్రత్యక్ష ప్రశ్నకు సహజమైన తెలుగు సమానం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే లిప్యంతరీకరణతో వ్యక్తిగత నామంగా ఉంచుతుంది.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు దేవుడవైన
  rationale: సంబోధనలో సహజంగా ఉండే రీతిలో ‘ఇశ్రాయేలు దేవుడు’ అనే సంబంధాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: הָיְתָה זֹּאת
  choice: ఇది … జరిగింది
  rationale: అక్షరార్థంగా ‘ఇది అయింది/ఉంది’ అయినప్పటికీ, సందర్భంలో జరిగిన పరిణామాన్ని సూచించే హెబ్రీయ నుడికారాన్ని సహజంగా అందిస్తుంది.
- source_word: בְּיִשְׂרָאֵל
  choice: ఇశ్రాయేలులో
  rationale: స్థానిక మరియు సమూహార్థాలను రెండింటినీ నిలుపగల సరళమైన రూపం.
- source_word: לְהִפָּקֵד
  choice: లేకుండా పోవలసి వచ్చిందేంటి
  rationale: నిఫాల్ రూపంలోని ‘లెక్కలో లేకపోవడం/లోటవడం’ అనే ఫలితార్థాన్ని, ప్రశ్నలోని విషాదభరిత భావంతో సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: הַיּוֹם
  choice: నేడు
  rationale: కాల ప్రాధాన్యాన్ని గౌరవప్రదమైన ఆధునిక రూపంలో నిలుపుతుంది.
- source_word: מִיִּשְׂרָאֵל
  choice: ఇశ్రాయేలులో
  rationale: తెలుగులో ‘ఇశ్రాయేలు నుండి ఒక గోత్రం లేకపోవడం’ కంటే సహజంగా, జాతీయ సమూహంలో గోత్రం ఇక లేకపోవడాన్ని తెలియజేస్తుంది.
- source_word: שֵׁבֶט אֶחָד
  choice: ఒక గోత్రం
  rationale: ఇశ్రాయేలు తెగలలోని ఒక గోత్ర సమూహాన్ని నేరుగా సూచిస్తుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలోని వ్యక్తిగత దైవనామాన్ని ‘ప్రభువు’ అనే బిరుదుగా మార్చకుండా ఉంచింది; ‘యెహోవా’ ఆధునిక తెలుగు బైబిలు పాఠకులకు విస్తృతంగా పరిచితమైన రూపం. ఖచ్చిత ఉచ్చారణపై ఉన్న అనిశ్చితిని సిద్ధాంతపరంగా పరిష్కరించినట్టు ప్రకటించదు.
- issue: לְהִפָּקֵד యొక్క భావం
  choice: లేకుండా పోవలసి వచ్చిందేంటి
  alternative: లోటుగా ఉండడం ఎందుకు జరిగింది
  rationale: ఇక్కడ పదం కేవలం జనగణనను కాక, ఇశ్రాయేలు సమూహం నుండి ఒక గోత్రం గైర్హాజరవడం లేదా నశించిపోవడం అనే భావాన్ని సూచిస్తుంది. సహజ తెలుగు కోసం ఫలితార్థాన్ని ముందుకు తెచ్చింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యేలా సహజంగా, అయితే విలాపం మరియు ప్రార్థనా సంబోధనకు తగిన గౌరవభరిత ధోరణితో రూపొందించబడింది. మూలంలో స్పష్టంగా లేని కారణాన్ని అదనంగా చేర్చలేదు.
