revisions:
- from: అప్పుడు వారు, “ఇశ్రాయేలు దేవుడవైన యెహోవా, ఇశ్రాయేలులో ఇది ఎందుకు జరిగింది? నేడు ఇశ్రాయేలులో ఒక గోత్రం లేకుండా పోవలసి వచ్చిందేంటి?” అని అన్నారు.
  to: అప్పుడు వారు, “ఇశ్రాయేలు దేవుడవైన యాహ్వే, నేడు ఇశ్రాయేలు నుండి ఒక గోత్రం లేకపోయేలా ఇశ్రాయేలులో ఇది ఎందుకు జరిగింది?” అని అన్నారు.
  rationale: The revision removes the unwarranted necessity implication in the final question and expresses the Hebrew result/purpose construction directly. It also aligns the rendering of the divine name with the supplied POB audit trail. The verse’s lamenting question and ambiguity concerning the precise manner of the tribe’s absence are preserved.
  reviewer_model: gpt-5.6-terra
