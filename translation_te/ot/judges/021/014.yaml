translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి పాటించబడింది. హింసాత్మక నేపథ్యాన్ని మెత్తబరచకుండా ‘ప్రాణాలతో ఉంచిన’ అని మూల భావం నిలుపబడింది. వివరణాత్మక పాదసూచిక గుర్తు [a] సంబంధిత చివరి వాక్యానికే జోడించబడింది.
