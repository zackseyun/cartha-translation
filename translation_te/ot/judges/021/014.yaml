source:
  edition: WLC
  text: וַ/יָּ֤שָׁב בִּנְיָמִן֙ בָּ/עֵ֣ת הַ/הִ֔יא וַ/יִּתְּנ֤וּ לָ/הֶם֙ הַ/נָּשִׁ֔ים אֲשֶׁ֣ר חִיּ֔וּ מִ/נְּשֵׁ֖י יָבֵ֣שׁ גִּלְעָ֑ד וְ/לֹֽא מָצְא֥וּ לָ/הֶ֖ם כֵּֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/014.yaml
  text: So Benjamin returned at that time[a], and they gave them the women whom they had kept alive from the women of Jabesh-gilead; but they did not find enough for them that way.
translation:
  language: te
  text: ఆ సమయంలో బెన్యామీనీయులు తిరిగి వచ్చారు. అప్పుడు వారు యాబేష్గిలాదులోని స్త్రీలలో తాము ప్రాణాలతో ఉంచినవారిని వారికి ఇచ్చారు. అయితే ఆ విధంగా వారికి సరిపడినంతమంది దొరకలేదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “అయితే వారికి అలా దొరకలేదు.” ఈ హీబ్రూ వాక్యం అధ్యాహారంగా ఉంది; ఈ విధానం ద్వారా వారికి సరిపడినంతమంది స్త్రీలు లభించలేదని సందర్భం సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: తిరిగి వచ్చారు
  rationale: שׁוב అనే క్రియ ఇక్కడ కథన క్రమంలో ‘తిరిగి వచ్చారు’ అనే భావాన్ని ఇస్తుంది. హీబ్రూలో ఏకవచన క్రియ ఉన్నా, కర్తగా ఉన్న బెన్యామీను పేరు గోత్రాన్ని సమష్టిగా సూచిస్తుంది కాబట్టి తెలుగులో గౌరవార్థం కాకుండా సహజమైన సమూహ బహువచనం వాడబడింది.
- source_word: בִּנְיָמִן
  choice: బెన్యామీనీయులు
  rationale: మూలంలో ‘బెన్యామీను’ అనే పేరు ఏకవచన రూపంలో ఉన్నప్పటికీ సందర్భంలో అది ఆ గోత్రానికి చెందిన మిగిలిన ప్రజలను సమష్టిగా సూచిస్తుంది. ఆధునిక తెలుగు పాఠకులకు ఈ భావం స్పష్టంగా ఉండేందుకు ‘బెన్యామీనీయులు’ అని అనువదించబడింది.
- source_word: בָּעֵת הַהִיא
  choice: ఆ సమయంలో
  rationale: ఇది కాలాన్ని సూచించే సాధారణ హీబ్రూ పదబంధం; ‘ఆ సమయంలో’ దాని కథన సంబంధాన్ని సహజంగా నిలుపుతుంది.
- source_word: וַיִּתְּנוּ לָהֶם
  choice: వారు ... వారికి ఇచ్చారు
  rationale: נתן ఇక్కడ ప్రత్యక్షంగా ‘ఇచ్చారు’ అని అర్థం. ఇచ్చినవారి కర్తను హీబ్రూ సందర్భానికే వదిలినందున తెలుగులోనూ ‘వారు’ అని మాత్రమే ఉంచబడింది.
- source_word: הַנָּשִׁים
  choice: స్త్రీలు / వారిని
  rationale: హీబ్రూ నామవాచకం నేరుగా ‘స్త్రీలు’ అని అర్థం; సందర్భంలో వారు భార్యలుగా ఇవ్వబడుతున్నప్పటికీ మూలంలో లేని ‘భార్యలు’ అనే నిర్దిష్టతను చేర్చలేదు. పునరుక్తిని తగ్గించేందుకు సంబంధ ఉపవాక్యంలో ‘వారిని’ వాడబడింది.
- source_word: אֲשֶׁר חִיּוּ
  choice: తాము ప్రాణాలతో ఉంచినవారు
  rationale: חיה పియేల్ రూపం వారు ఆ స్త్రీలను చంపకుండా బతికించారని సూచిస్తుంది. ‘ప్రాణాలతో ఉంచిన’ ఈ కారణార్థ భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: מִנְּשֵׁי יָבֵשׁ גִּלְעָד
  choice: యాబేష్గిలాదులోని స్త్రీలలో
  rationale: מן ఇక్కడ ఒక సమూహం నుంచి ఎంపిక లేదా మూలాన్ని సూచిస్తుంది. ‘స్త్రీలలో’ అనే రూపం ఆ స్త్రీలు యాబేష్గిలాదు స్త్రీల సమూహంలోనివారని తెలియజేస్తుంది.
- source_word: וְלֹא מָצְאוּ לָהֶם כֵּן
  choice: అయితే ఆ విధంగా వారికి సరిపడినంతమంది దొరకలేదు
  rationale: మూల హీబ్రూ ‘వారికి అలా దొరకలేదు’ అన్నట్లుగా సంక్షిప్తంగా, అధ్యాహారంగా ఉంది. సందర్భంలో అందరు బెన్యామీనీయులకు సరిపడా స్త్రీలు లభించలేదనే భావాన్ని ‘సరిపడినంతమంది’ స్పష్టం చేస్తుంది; ‘ఆ విధంగా’ כֵּן యొక్క భావాన్ని నిలుపుతుంది.
