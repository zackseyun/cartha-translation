id: JDG.21.11
reference: Judges 21:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/זֶ֥ה הַ/דָּבָ֖ר אֲשֶׁ֣ר תַּעֲשׂ֑וּ כָּל זָכָ֗ר וְ/כָל אִשָּׁ֛ה יֹדַ֥עַת מִשְׁכַּב זָכָ֖ר תַּחֲרִֽימוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/011.yaml
  text: 'And this is what you shall do: every male[a], and every woman who has known the bed of a male[b], you shall devote to destruction.'
translation:
  language: te
  text: 'మీరు చేయవలసింది ఇదే: మగవారందరినీ, పురుషునితో శయనించిన ప్రతి స్త్రీనీ[a] నిర్మూలనకు అంకితం చేయాలి[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత స్పష్టంగా: ‘పురుషునితో లైంగిక సంబంధం కలిగిన ప్రతి స్త్రీనీ.’'
    reason: lexical_alternative
  - marker: b
    text: ‘నిర్మూలనకు అంకితం చేయాలి’ అనే హీబ్రూ పదం సాధారణంగా చంపడాన్ని మాత్రమే కాక, ఒకరిని నిషేధం కింద నిర్మూలనకు అప్పగించడాన్ని సూచిస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: וְ/זֶה
  choice: ఇదే
  rationale: తదుపరి ఆదేశాన్ని పరిచయం చేస్తుంది. తెలుగు వాక్యప్రవాహంలో ప్రత్యేకంగా ‘మరియు’ చేర్చకుండానే హీబ్రూ సంధాన భావం సహజంగా వ్యక్తమవుతుంది.
- source_word: הַ/דָּבָר אֲשֶׁר תַּעֲשׂוּ
  choice: మీరు చేయవలసింది
  rationale: ‘మీరు చేయవలసిన విషయం’ అనే హీబ్రూ నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగులో, దాని ఆదేశ బలాన్ని నిలుపుతూ వ్యక్తం చేస్తుంది.
- source_word: כָּל זָכָר
  choice: మగవారందరినీ
  rationale: זָכָר వయోజన పురుషులను మాత్రమే కాక పురుష లింగానికి చెందిన వారందరినీ సూచించగలదు. ‘పురుషులందరినీ’ కంటే ‘మగవారందరినీ’ ఈ విస్తృతిని మెరుగ్గా నిలుపుతుంది.
- source_word: וְ/כָל אִשָּׁה
  choice: ప్రతి స్త్రీనీ
  rationale: אִשָּׁה ఇక్కడ ‘భార్య’ అని కాక, లైంగిక అనుభవం అనే విశేషణంతో పరిమితమయ్యే ‘స్త్రీ’ని సూచిస్తుంది.
- source_word: יֹדַעַת מִשְׁכַּב זָכָר
  choice: పురుషునితో శయనించిన
  rationale: లైంగిక సంబంధాన్ని సూచించే హీబ్రూ సభ్యోక్తిని సహజమైన, గౌరవప్రదమైన తెలుగులో నిలుపుతుంది; మరింత స్పష్టమైన అర్థాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: תַּחֲרִימוּ
  choice: నిర్మూలనకు అంకితం చేయాలి
  rationale: חרם యొక్క హిఫిల్ రూపం సాధారణంగా చంపడం మాత్రమే కాక, నిషేధం కింద నిర్మూలనకు అప్పగించడాన్ని సూచిస్తుంది. ఈ అనువాదం ఆ సాంకేతిక-మతపరమైన భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: యుద్ధం/తీర్పు సందర్భంలో חרם పదం అనువాదం
  choice: నిర్మూలనకు అంకితం చేయాలి
  alternative: పూర్తిగా నిర్మూలించాలి; నిషేధం కింద ఉంచాలి
  rationale: హీబ్రూ పదం సాధారణ హత్యకన్నా ఎక్కువ భావాన్ని కలిగి, నిషేధం కింద నిర్మూలనకు అప్పగించడాన్ని సూచిస్తుంది. ఎంపిక చేసిన రూపం ఆ న్యాయ-మతపరమైన ఉద్రిక్తతను తగ్గించకుండా తెలుగులో గ్రాహ్యంగా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనప్పటికీ గంభీరమైన శైలి. లైంగిక సంబంధానికి సంబంధించిన మూలంలోని సభ్యోక్తిని ప్రధాన పాఠ్యంలో నిలిపి, స్పష్టీకరణను పాదసూచికలో ఇచ్చాం. ప్రతి పాదసూచిక గుర్తు సంబంధిత పదబంధానికే జోడించబడింది.
