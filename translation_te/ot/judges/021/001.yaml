id: JDG.21.1
reference: Judges 21:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אִ֣ישׁ יִשְׂרָאֵ֔ל נִשְׁבַּ֥ע בַּ/מִּצְפָּ֖ה לֵ/אמֹ֑ר אִ֣ישׁ מִמֶּ֔/נּוּ לֹא יִתֵּ֥ן בִּתּ֛/וֹ לְ/בִנְיָמִ֖ן לְ/אִשָּֽׁה־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/001.yaml
  text: The men of Israel had sworn at Mizpah[a], saying, “No man among us shall give his daughter to Benjamin as a wife.”
translation:
  language: te
  text: 'ఇశ్రాయేలు పురుషులు మిస్పాలో ఇలా ప్రమాణం చేశారు: “మనలో ఏ పురుషుడూ తన కుమార్తెను బెన్యామీనుకు[a] భార్యగా ఇవ్వకూడదు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ‘బెన్యామీనుకు’ అనేది బెన్యామీను గోత్రాన్నిగానీ, ఆ గోత్రానికి చెందిన వ్యక్తినిగానీ సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ יִשְׂרָאֵל
  choice: ఇశ్రాయేలు పురుషులు
  rationale: אִישׁ రూపరీత్యా ఏకవచనమైనా, ఇక్కడ ఇశ్రాయేలు సమూహంలోని పురుషులను సూచించే సమష్టి ప్రయోగం. తెలుగు సహజత్వం కోసం బహువచనంగా అనువదించాం. ఆరంభ waw‌కు ప్రత్యేక కాలార్థం లేకపోవడంతో విడిగా ‘ఇప్పుడు’ లేదా ‘మరియు’ చేర్చలేదు.
- source_word: נִשְׁבַּע
  choice: ప్రమాణం చేసి
  rationale: שׁבע నిఫాల్ రూపం ‘ప్రమాణం చేయడం’ అనే అర్థం ఇస్తుంది. తరువాతి לֵאמֹר‌తో కలిసి తెలుగులో సహజంగా ‘ప్రమాణం చేసి ఇలా అన్నారు’ అని ఇచ్చాం; సందర్భం ఆ ప్రమాణం ముందే జరిగిందని తెలియజేస్తుంది.
- source_word: בַּמִּצְפָּה
  choice: మిస్పాలో
  rationale: స్థల నామంతో కూడిన בְּను తెలుగులో స్థానార్థక ‘లో’ విభక్తితో సహజంగా వ్యక్తీకరించాం.
- source_word: לֵאמֹר
  choice: ఇలా అన్నారు
  rationale: ప్రత్యక్ష ఉల్లేఖనాన్ని పరిచయం చేసే సాధారణ హీబ్రూ ప్రయోగాన్ని సహజమైన తెలుగు ఉల్లేఖన సూత్రంగా ఇచ్చాం.
- source_word: אִישׁ מִמֶּנּוּ
  choice: మనలో ఎవడూ
  rationale: అక్షరార్థంగా ‘మనలో ఒక పురుషుడు’; నిషేధ వాక్యంలో ప్రతి ఇశ్రాయేలీయ పురుషునికీ వర్తించే భావాన్ని ‘మనలో ఎవడూ’ స్పష్టంగా ఉంచుతుంది.
- source_word: לֹא יִתֵּן
  choice: ఇవ్వకూడదు
  rationale: ప్రమాణంలోని బద్ధమైన భవిష్యత్ నిషేధాన్ని ఆధునిక తెలుగులో ‘ఇవ్వకూడదు’ సహజంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: בִּתּוֹ
  choice: తన కుమార్తెను
  rationale: మూడవ పురుష ఏకవచన స్వామ్యార్థాన్ని తెలుగు ప్రతిబింబక సర్వనామం ‘తన’తో సహజంగా వ్యక్తీకరించాం.
- source_word: לְבִנְיָמִן
  choice: బెన్యామీనీయునికి
  rationale: ‘బెన్యామీను’ అనే ఏకవచన గోత్రనామం ఇక్కడ ఆ గోత్రానికి చెందిన వ్యక్తిని సూచిస్తుంది. వివాహ సందర్భంలో తెలుగు పాఠకుడికి ఉద్దేశిత వ్యక్తి స్పష్టంగా ఉండేందుకు ‘బెన్యామీనీయునికి’ అని ఇచ్చాం.
- source_word: לְאִשָּׁה
  choice: భార్యగా
  rationale: ఈ నిర్మాణం ఒక స్త్రీని వివాహంలో ఇచ్చి భార్యగా చేయడాన్ని సూచిస్తుంది; ‘భార్యగా’ సంక్షిప్తంగా, సహజంగా మూలభావాన్ని అందిస్తుంది.
