translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, ప్రమాణపు గంభీరతను నిలుపుతూ అనువదించాం. మూలంలోని సమష్టి ఏకవచనాన్ని సహజ తెలుగు బహువచనంగా ఇచ్చాం; కథన సంబంధక waw‌ను అనవసరమైన ‘ఇప్పుడు’తో విస్తరించలేదు.
