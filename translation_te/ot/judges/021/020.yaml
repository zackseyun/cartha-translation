  text: And they commanded the sons of Benjamin[a], saying[b], “Go and lie in wait in the vineyards.”
translation:
  language: te
  text: 'వారు బెన్యామీను కుమారులకు ఇలా ఆజ్ఞాపించారు: “మీరు వెళ్లి ద్రాక్షతోటల్లో మాటువేయండి.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְצַו
  choice: వారు ... ఆజ్ఞాపించారు
  rationale: צוה అంటే ‘ఆజ్ఞాపించు, నిర్దేశించు.’ ఇచ్చిన రూపం బహువచన కర్తను సూచిస్తున్నందున ‘వారు’ అని అనువదించాం; సందర్భం ఆధారంగా ఏకవచనంగా మార్చలేదు.
- source_word: אֶת בְּנֵי בִנְיָמִן
  choice: బెన్యామీను కుమారులకు
  rationale: హీబ్రూ బంధుత్వ వ్యక్తీకరణ ‘బెన్యామీను కుమారులు’ను నిలుపుతూ, తెలుగు విభక్తి ప్రకారం సహజంగా ‘కుమారులకు’ అని ఇచ్చాం.
- source_word: לֵאמֹר
  choice: ఇలా
  rationale: ప్రత్యక్ష వాక్యాన్ని పరిచయం చేసే హీబ్రూ ప్రయోగం. తెలుగులో ‘ఇలా’ అనేది సహజమైన, పారదర్శకమైన ఉల్లేఖన సూచకం.
- source_word: לְכוּ
  choice: మీరు వెళ్లి
  rationale: הלך క్రియ యొక్క బహువచన ఆజ్ఞారూపం. సంబోధితుల బహువచనాన్ని స్పష్టంగా ఉంచేందుకు ‘మీరు వెళ్లి’ అని ఇచ్చాం.
- source_word: וַאֲרַבְתֶּם
  choice: మాటువేయండి
  rationale: ארב అంటే దాక్కొని ఎదురుచూడడం లేదా మాటువేయడం. ఆజ్ఞారూప పరంపరను తెలుగులో సహజంగా కొనసాగించేందుకు ‘మాటువేయండి’ అని అనువదించాం.
- source_word: בַּכְּרָמִים
  choice: ద్రాక్షతోటల్లో
  rationale: כרמים అంటే ద్రాక్షతోటలు; ב preposition‌ను సందర్భానుసారంగా ‘లో’ అర్థంలో అనువదించాం.
