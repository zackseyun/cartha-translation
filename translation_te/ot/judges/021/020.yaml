translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన కథన శైలి. మూలంలోని బహువచన కర్తను, ‘బెన్యామీను కుమారులు’ అనే బంధుత్వ రూపాన్ని నిలిపి, ఆజ్ఞను సహజమైన తెలుగులో వ్యక్తం చేశాం.
