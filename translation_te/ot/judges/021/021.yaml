  to: 'గమనించండి: షిలో కుమార్తెలు నృత్యాలలో నాట్యం చేయడానికి బయటికి వచ్చినప్పుడు, మీరు ద్రాక్షతోటల నుండి బయటికి వచ్చి, షిలో కుమార్తెలలో నుండి మీలో ప్రతి ఒక్కరూ తనకోసం ఒక భార్యను లాక్కొని[a], బెన్యామీను దేశానికి వెళ్లండి.'
