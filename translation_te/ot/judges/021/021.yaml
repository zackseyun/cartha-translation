id: JDG.21.21
reference: Judges 21:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/רְאִיתֶ֗ם וְ֠/הִנֵּה אִם יֵ֨צְא֥וּ בְנוֹת שִׁילוֹ֮ לָ/ח֣וּל בַּ/מְּחֹלוֹת֒ וִֽ/יצָאתֶם֙ מִן הַ/כְּרָמִ֔ים וַ/חֲטַפְתֶּ֥ם לָ/כֶ֛ם אִ֥ישׁ אִשְׁתּ֖/וֹ מִ/בְּנ֣וֹת שִׁיל֑וֹ וַ/הֲלַכְתֶּ֖ם אֶ֥רֶץ בִּנְיָמִֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/021.yaml
  text: Watch[a], and behold, when the daughters of Shiloh come out to dance in the dances, then come out from the vineyards and seize for yourselves, each man his wife from the daughters of Shiloh, and go to the land of Benjamin.
translation:
  language: te
  text: 'గమనించండి: షిలో కుమార్తెలు నృత్యాలలో నాట్యం చేయడానికి బయటికి వచ్చినప్పుడు, మీరు ద్రాక్షతోటల నుండి బయటికి వచ్చి, షిలో కుమార్తెలలో నుండి మీలో ప్రతి ఒక్కరూ తనకోసం ఒక భార్యను లాక్కొని[a], బెన్యామీను దేశానికి వెళ్లండి.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “బలవంతంగా పట్టుకోండి” లేదా “అపహరించండి”; హెబ్రీ క్రియ హఠాత్తుగా, బలవంతంగా తీసుకోవడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּרְאִיתֶם
  choice: మీరు జాగ్రత్తగా గమనించండి
  rationale: రూపపరంగా ‘మీరు చూస్తారు’ అయినా, ఈ ఆదేశాల వరుసలో అప్రమత్తంగా వేచి గమనించాలనే ఆజ్ఞార్థక భావం ఉంది.
- source_word: וְהִנֵּה אִם
  choice: '...వచ్చినప్పుడు'
  rationale: הִנֵּה దృష్టిని రాబోయే దృశ్యంపై కేంద్రీకరిస్తుంది; אִם రూపరీత్యా షరతును సూచించినా, పథకం అమలయ్యే సందర్భంలో సహజమైన తెలుగు కాలార్థక నిర్మాణం ‘వచ్చినప్పుడు’.
- source_word: בְנוֹת שִׁילוֹ
  choice: షిలో కుమార్తెలు
  rationale: హెబ్రీ సామాజిక-కుటుంబ పదప్రయోగాన్ని నిలుపుతుంది; వయస్సును ‘యువతులు’ అని అదనంగా నిర్ధారించదు.
- source_word: לָחוּל בַּמְּחֹלוֹת
  choice: నృత్యాలలో నాట్యం చేయడానికి
  rationale: క్రియ, బహువచన నామవాచకం రెండింటి పదపునరుక్తిని సాధ్యమైనంతగా నిలుపుతూ అర్థాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: וַחֲטַפְתֶּם
  choice: బలవంతంగా పట్టుకొని
  rationale: חטף లోని హఠాత్తుగా, బలవంతంగా తీసుకుపోయే భావాన్ని మృదువుచేయకుండా తెలియజేస్తుంది; ఆధునిక న్యాయపరమైన వర్గీకరణను ప్రధాన పాఠ్యంలో జోడించదు.
- source_word: לָכֶם אִישׁ אִשְׁתּוֹ
  choice: ఒక్కొక్కరూ తమ కోసం ఒక్కో భార్యను
  rationale: వ్యక్తికి ఒకరు చొప్పున అనే విభజనార్థాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: אֶרֶץ בִּנְיָמִן
  choice: బెన్యామీను దేశానికి
  rationale: ‘బెన్యామీను భూభాగం’ అనే అర్థాన్ని సంప్రదాయ భౌగోళిక పదబంధంతో అందిస్తుంది.
theological_decisions:
- issue: స్త్రీలను బలవంతంగా తీసుకుపోవడాన్ని వర్ణించే భాష
  choice: బలవంతంగా పట్టుకొని
  alternative: అపహరించుకొని / లాక్కొని వెళ్లి
  rationale: వాక్యం హింసాత్మక చర్యకు ఆదేశిస్తున్న అసౌకర్యకరమైన భావాన్ని దాచదు. అయితే మూలక్రియకన్నా నిర్దిష్టమైన ఆధునిక న్యాయపదాన్ని ప్రధాన పాఠ్యంలో పెట్టకుండా, బలప్రయోగ భావాన్ని స్పష్టంగా ఉంచుతుంది.
- issue: אִם యొక్క షరతు-కాల సంబంధం
  choice: వచ్చినప్పుడు
  alternative: వస్తే
  rationale: హెబ్రీలో షరతు రూపం ఉన్నప్పటికీ, సందర్భంలో ముందుగా ఊహించిన సంఘటన సంభవించే వేళను సూచిస్తోంది. ‘వచ్చినప్పుడు’ సహజంగా ఉండి సందర్భార్థాన్ని అందిస్తుంది; అనిశ్చితిని పూర్తిగా సిద్ధాంతపరంగా పరిష్కరించదు.
- issue: אִישׁ אִשְׁתּוֹ లోని లింగసూచక, విభజనార్థక నిర్మాణం
  choice: ఒక్కొక్కరూ తమ కోసం ఒక్కో భార్యను
  alternative: ప్రతి పురుషుడు తన భార్యను
  rationale: సంభోదితులు పురుషులేనని, ఒక్కొక్కరికి ఒక భార్య అనే అర్థమని నిలుపుతూ, తెలుగులో అపార్థం కలిగించే ‘తన భార్యను’—అంటే ఇప్పటికే భార్యగా ఉన్న వ్యక్తిని—అనే భావాన్ని నివారిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే వాక్యనిర్మాణం. మూలంలోని హింసను మృదువుచేయలేదు; అలాగే ప్రధాన పాఠ్యంలో అదనపు న్యాయ లేదా మతపరమైన తీర్పును చేర్చలేదు. [a] గుర్తు ప్రధాన పాఠ్యంలో సంబంధిత క్రియ వద్ద ఉంచబడింది.
