source:
  edition: WLC
  text: וַֽ/יְהִי֙ מִֽ/מָּחֳרָ֔ת וַ/יַּשְׁכִּ֣ימוּ הָ/עָ֔ם וַ/יִּבְנוּ שָׁ֖ם מִזְבֵּ֑חַ וַ/יַּעֲל֥וּ עֹל֖וֹת וּ/שְׁלָמִֽים־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/004.yaml
  text: And the next day the people rose early[a], built an altar there, and offered burnt offerings and peace offerings.
translation:
  language: te
  text: మరుసటి రోజు ప్రజలు తెల్లవారుజామునే లేచి, అక్కడ ఒక బలిపీఠాన్ని కట్టి, దహనబలులనూ సమాధాన బలులనూ[a] అర్పించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “సహవాస బలులు” లేదా “క్షేమ బలులు” అని కూడా అనువదించవచ్చు. హీబ్రూ పదం శాంతి, సంపూర్ణ క్షేమం, పంచుకునే సహవాసంతో సంబంధమున్న ఒక బలి రకాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי מִמָּחֳרָת
  choice: మరుసటి రోజు
  rationale: హీబ్రూ కథన సూత్రంలోని ‘జరిగింది’ అనే భాగాన్ని సహజమైన తెలుగు కథనశైలిలో అంతర్లీనంగా ఉంచి, కాలసూచనను స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: וַיַּשְׁכִּימוּ
  choice: తెల్లవారుజామునే లేచి
  rationale: క్రియలోని పొద్దున్నే లేవడం అనే కాలప్రాధాన్యాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: הָעָם
  choice: ప్రజలు
  rationale: మూలంలోని సాధారణ సమూహవాచకాన్ని అనుసరిస్తుంది; సందర్భాన్ని బట్టి ‘ఇశ్రాయేలీయులు’ అని స్పష్టీకరించదు.
- source_word: וַיִּבְנוּ שָׁם מִזְבֵּחַ
  choice: అక్కడ ఒక బలిపీఠాన్ని కట్టి
  rationale: שָׁם అనే స్థలసూచనను నిలుపుతూ, తెలుగు వాక్యక్రమంలో సహజంగా ఉంటుంది.
- source_word: וַיַּעֲלוּ
  choice: అర్పించారు
  rationale: బలుల సందర్భంలో ‘పైకి ఎక్కించడం’ అనే హీబ్రూ ప్రయోగానికి తెలుగులో స్పష్టమైన ఆరాధనా-సందర్భ సమానార్థకం.
- source_word: עֹלוֹת
  choice: దహనబలులు
  rationale: పూర్తిగా దహనం చేసే ఈ బలి రకానికి స్థిరమైన, సంక్షిప్త తెలుగు పదం.
- source_word: וּשְׁלָמִים
  choice: సమాధాన బలులు
  rationale: శాంతి, సంపూర్ణ క్షేమం, దేవునితో సహవాసం వంటి భావవిస్తారమున్న బలి పదానికి స్థిరమైన తెలుగు రూపం; ప్రత్యామ్నాయ భావాలను పాదటిప్పణిలో సూచిస్తుంది.
theological_decisions:
- issue: שְׁלָמִים అనే బలి పదం అనువాదం
  choice: సమాధాన బలులు
  alternative: సహవాస బలులు; క్షేమ బలులు
  rationale: మూలం ఒక నిర్దిష్ట ఇశ్రాయేలీయ బలి రకాన్ని మాత్రమే పేర్కొంటుంది. ఏకైక సిద్ధాంతార్థాన్ని బలవంతంగా నిర్ధారించకుండా, స్థిరమైన పదాన్ని ప్రధాన పాఠ్యంలో ఉంచి దాని విస్తృత భావాన్ని పాదటిప్పణిలో కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన వాక్యనిర్మాణం, అయితే బలుల సాంకేతిక పదజాలంలో గౌరవప్రదమైన బైబిల్ శైలిని నిలుపుకుంది.
