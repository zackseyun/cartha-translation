source:
  edition: WLC
  text: וַֽ/יִּמְצְא֞וּ מִ/יּוֹשְׁבֵ֣י יָבֵ֣ישׁ גִּלְעָ֗ד אַרְבַּ֤ע מֵאוֹת֙ נַעֲרָ֣ה בְתוּלָ֔ה אֲשֶׁ֧ר לֹֽא יָדְעָ֛ה אִ֖ישׁ לְ/מִשְׁכַּ֣ב זָכָ֑ר וַ/יָּבִ֨יאוּ אוֹתָ֤/ם אֶל הַֽ/מַּחֲנֶה֙ שִׁלֹ֔ה אֲשֶׁ֖ר בְּ/אֶ֥רֶץ כְּנָֽעַן׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/012.yaml
  text: And from the inhabitants of Jabesh-gilead they found four hundred young women, virgins, who had not known a man by lying with a male; and they brought them to the camp at Shiloh, which is in the land of Canaan.
translation:
  language: te
  text: యాబేషు-గిలాదులో నివసించేవారిలో పురుషునితో శయనం ఎరుగని యువతులైన కన్యలు నాలుగు వందల మందిని వారు కనుగొన్నారు. వారిని కనాను దేశంలోని షిలోహు శిబిరానికి తీసుకొచ్చారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִיּוֹשְׁבֵי יָבֵישׁ גִּלְעָד
  choice: యాబేషు-గిలాదులో నివసించేవారిలో
  rationale: מִן యొక్క ‘లోనుండి/వారిలో’ భావాన్ని, יֹשְׁבֵי యొక్క నివాసుల అర్థాన్ని సహజమైన ఆధునిక తెలుగులో నిలిపింది.
- source_word: נַעֲרָה בְתוּלָה
  choice: కన్యలైన ... యువతులను
  rationale: נַעֲרָה (‘యువతి’) మరియు בְתוּלָה (‘కన్య’) అనే రెండు అంశాలనూ విడిచిపెట్టకుండా తెలుగులో సహజమైన క్రమంలో అందించింది.
- source_word: לֹא יָדְעָה אִישׁ לְמִשְׁכַּב זָכָר
  choice: పురుషునితో శయనించడం ద్వారా పురుషుణ్ణి ఎరుగని
  rationale: ידע అనే సన్నిహిత సంబంధాన్ని సూచించే ప్రయోగాన్నీ, לְמִשְׁכַּב זָכָר అనే స్పష్టీకరణనూ మూలంలోని అసౌకర్యకరమైన పునరుక్తితో సహా సాధ్యమైనంత దగ్గరగా నిలిపింది.
- source_word: הַמַּחֲנֶה שִׁלֹה
  choice: షిలోహు శిబిరానికి
  rationale: గమ్యాన్ని సూచించే אֶל భావాన్ని దత్తివిభక్తితో సహజంగా తెలిపి, స్థలనామాన్ని ఆధునిక తెలుగు లిప్యంతరీకరణలో ఉంచింది.
- source_word: אֶרֶץ כְּנָעַן
  choice: కనాను దేశంలోని
  rationale: షిలోహు ఉన్న ప్రాంతాన్ని తెలిపే సంబంధాన్ని తెలుగులో సహజంగా ముందుంచింది.
theological_decisions:
- issue: లైంగిక అనుభవాన్ని తెలిపే హెబ్రీయ ఇడియం
  choice: ‘పురుషునితో శయనించడం ద్వారా పురుషుణ్ణి ఎరుగని’ అని సాపేక్షంగా రూపాత్మకంగా అనువదించడం
  alternative: ‘పురుషునితో లైంగిక సంబంధం పెట్టుకోని’
  rationale: మూలంలోని ידע (‘ఎరుగుట’) మరియు משכב זכר (‘పురుషునితో శయనం’) రెండింటినీ నిలిపి, కథనంలోని కఠినమైన భాషను మృదువుగా మార్చకుండా ఉంచుతుంది.
- issue: ఈ యువతుల గుర్తింపు
  choice: ‘కన్యలైన ... యువతులు’
  alternative: ‘యువ కన్యలు’
  rationale: హెబ్రీయ పాఠంలోని నామవాచకం మరియు విశేషణం రెండింటినీ స్పష్టంగా ప్రతిబింబిస్తుంది; వయస్సు లేదా సామాజిక స్థితి గురించి అదనపు ఊహను చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైన కథనశైలి. మూలంలోని లైంగిక ఇడియాన్ని ఉద్దేశపూర్వకంగా కొంత రూపాత్మకంగా నిలిపినందున వాక్యం సాధారణ సంభాషణకన్నా గంభీరంగా ఉంది. పాఠంలో పాదటిప్పణి గుర్తులు లేవు; అందువల్ల పాదటిప్పణులు జోడించలేదు.
