source:
  edition: WLC
  text: בַּ/יָּמִ֣ים הָ/הֵ֔ם אֵ֥ין מֶ֖לֶךְ בְּ/יִשְׂרָאֵ֑ל אִ֛ישׁ הַ/יָּשָׁ֥ר בְּ/עֵינָ֖י/ו יַעֲשֶֽׂה׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/025.yaml
  text: In those days there was no king in Israel[a]; each man did what was right in his own eyes.
translation:
  language: te
  text: ఆ రోజుల్లో ఇశ్రాయేలులో రాజు లేడు; ప్రతివాడూ తన దృష్టికి సరైనదనిపించినదే చేసేవాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּיָּמִים הָהֵם
  choice: ఆ రోజుల్లో
  rationale: కథనంలోని గతకాల నేపథ్యాన్ని సూచించే సాధారణ హీబ్రూ కాలవాచక సూత్రానికి సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: אֵין מֶלֶךְ בְּיִשְׂרָאֵל
  choice: ఇశ్రాయేలులో రాజు లేడు
  rationale: אֵין అనే అస్తిత్వనిషేధాన్ని సరళంగా వ్యక్తపరుస్తూ, జాతీయ పరిధిని యథాతథంగా నిలుపుతుంది.
- source_word: אִישׁ
  choice: ప్రతివాడూ
  rationale: ఇక్కడ పుంలింగ ఏకవచనం పంపిణీయ భావంలో ఉంది. ‘ప్రతివాడూ’ ఆ రూపాన్ని, ఒక్కొక్కరిని సూచించే భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: הַיָּשָׁר
  choice: సరైనదనిపించినది
  rationale: నామవాచకంగా వాడిన విశేషణం ‘సరైనది’ అనే నైతిక/విలువ నిర్ణయ భావాన్ని ఇస్తుంది; בְּעֵינָיוతో కలిపి వ్యక్తిగత దృష్టిలో అలా అనిపించడాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: בְּעֵינָיו
  choice: తన దృష్టికి
  rationale: అక్షరార్థమైన ‘తన కళ్లలో’ కంటే, వ్యక్తిగత అంచనా లేదా తీర్పును సూచించే హీబ్రూ నుడికారాన్ని ఆధునిక తెలుగులో స్పష్టంగా అందిస్తుంది.
- source_word: יַעֲשֶׂה
  choice: చేసేవాడు
  rationale: అసంపూర్ణ క్రియారూపం ఈ సారాంశ వాక్యంలో గతకాలపు అలవాటు లేదా పునరావృత చర్యను సూచిస్తుంది; తెలుగు అలవాటుకాల రూపం దానిని సహజంగా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: אִישׁ లోని పుంలింగ పంపిణీయ భాష
  choice: ప్రతివాడూ
  alternative: ప్రతి ఒక్కరూ
  rationale: మూలంలోని పుంలింగ ఏకవచన రూపాన్ని సాధ్యమైనంతవరకు నిలుపుతూ, అది ఒక్కొక్క వ్యక్తిని పంపిణీయంగా సూచిస్తున్నదని తెలుగులో సహజంగా తెలియజేస్తుంది.
- issue: ఈ పునరుక్తిలో అంతర్లీనమైన నైతిక మూల్యాంకనం
  choice: మూలవాక్యాన్ని వ్యాఖ్యాత్మక తీవ్రత చేర్చకుండా అనువదించడం
  alternative: ప్రతివాడూ తన ఇష్టమొచ్చినట్లు చేసేవాడు
  rationale: ‘ఇష్టమొచ్చినట్లు’ అనేది అస్తవ్యస్తత లేదా స్వేచ్ఛాచారాన్ని మూలపాఠం కంటే బలంగా వ్యాఖ్యానిస్తుంది. హీబ్రూ చెప్పిన ‘తన దృష్టికి సరైనది’ అనే ఉద్రిక్తతను అనువాదం నిలుపుతుంది.
translation_notes:
  register: సహజమైన, గౌరవప్రదమైన ఆధునిక ప్రామాణిక తెలుగు. ‘తన దృష్టికి సరైనదనిపించినదే’ అనే రూపం హీబ్రూ నుడికారంలోని వ్యక్తిగత తీర్పును తెలుగులో స్పష్టంగా ఇస్తుంది; ‘చేసేవాడు’ గతకాలపు అలవాటు భావాన్ని నిలుపుతుంది.
