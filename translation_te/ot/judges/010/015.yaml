id: JDG.10.15
reference: Judges 10:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּאמְר֨וּ בְנֵי יִשְׂרָאֵ֤ל אֶל יְהוָה֙ חָטָ֔אנוּ עֲשֵׂה אַתָּ֣ה לָ֔/נוּ כְּ/כָל הַ/טּ֖וֹב בְּ/עֵינֶ֑י/ךָ אַ֛ךְ הַצִּילֵ֥/נוּ נָ֖א הַ/יּ֥וֹם הַ/זֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/010/015.yaml
  text: And the sons of Israel said to Yahweh[a], “We have sinned. Do to us according to all that is good in your eyes[c][b]. Only please deliver us this day.”
translation:
  language: te
  text: ఇశ్రాయేలు ప్రజలు యహ్వేతో, “మేము పాపం చేశాము. నీ దృష్టికి ఏది మంచిదో దాని ప్రకారం మాకు చేయి. అయితే, ఈ రోజున మాత్రం దయచేసి మమ్మల్ని విడిపించు” అన్నారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: అన్నారు
  rationale: హీబ్రూ కథన క్రమాన్ని తెలుగులో సహజంగా కొనసాగించే భూతకాల క్రియ.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు ప్రజలు
  rationale: అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులు’ అయినా, ఇక్కడ సమూహజాతిని సూచిస్తుంది; ఆధునిక తెలుగులో ‘ఇశ్రాయేలు ప్రజలు’ సహజమూ సందర్భసరిగ్గా ఉంటుంది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవ నామమైన టెట్రాగ్రామటన్‌ను బిరుదుతో భర్తీ చేయకుండా వ్యక్తిగత నామంగా లిప్యంతరీకరించింది.
- source_word: חָטָאנוּ
  choice: మేము పాపం చేశాము
  rationale: పూర్తయిన చర్యను ఒప్పుకునే మొదటి పురుష బహువచన రూపాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: עֲשֵׂה אַתָּה לָנוּ
  choice: మాకు చేయి
  rationale: వారి పట్ల దేవుడు తనకు తగినట్లు వ్యవహరించవచ్చనే నిర్మొహమాటమైన సమర్పణను మూల నిర్మాణానికి దగ్గరగా ఉంచుతుంది.
- source_word: כְּכָל הַטּוֹב בְּעֵינֶיךָ
  choice: నీ దృష్టికి ఏది మంచిదో దాని ప్రకారం
  rationale: ‘నీ కళ్లలో మంచిది’ అనే హీబ్రూ నుడికార భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తూ, నిర్ణయాధికారం దేవునిదేనని నిలుపుతుంది.
- source_word: אַךְ
  choice: అయితే
  rationale: సమర్పణ తరువాత వచ్చే పరిమితమైన, ఆర్తితో కూడిన విజ్ఞప్తికి తెలుగులో సహజమైన మలుపును ఇస్తుంది.
- source_word: הַצִּילֵנוּ
  choice: మమ్మల్ని విడిపించు
  rationale: ప్రమాదం లేదా అణచివేత నుంచి రక్షించి బయటకు తేవడం అనే హిఫిల్ క్రియ భావాన్ని సందర్భానుసారంగా తెలియజేస్తుంది.
- source_word: נָא
  choice: దయచేసి
  rationale: ఆజ్ఞారూపానికి జతైన వినయపూర్వక విన్నప భావాన్ని ఆధునిక తెలుగులో సహజంగా అందిస్తుంది.
- source_word: הַיּוֹם הַזֶּה
  choice: ఈ రోజే
  rationale: ‘ఈ రోజు’ అనే కాలసూచనతో పాటు విజ్ఞప్తిలోని తక్షణ ఆవశ్యకతను ‘ఏ’ నొక్కుతో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవ నామం అనువాదం
  choice: యహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠం వ్యక్తిగత దైవ నామాన్ని వాడుతుంది; అందువల్ల బిరుదుతో భర్తీ చేయకుండా ‘యహ్వే’గా లిప్యంతరీకరించడం మూలానికి నిష్ఠగా ఉంటుంది.
- issue: בְנֵי יִשְׂרָאֵל సమూహపదం ప్రతినిధానం
  choice: ఇశ్రాయేలు ప్రజలు
  alternative: ఇశ్రాయేలు కుమారులు
  rationale: ఈ సందర్భంలో పదబంధం ఇశ్రాయేలు సమాజాన్ని సమష్టిగా సూచిస్తుంది. ‘ఇశ్రాయేలు ప్రజలు’ సాధారణ పాఠకులకు సహజంగా ఉండి ఆ సమూహార్థాన్ని కాపాడుతుంది.
- issue: దేవుని తీర్పుకు సమర్పణ మరియు విమోచన విజ్ఞప్తి మధ్య ఉద్వేగం
  choice: రెండు అంశాలనూ వాక్యంలో యథాతథంగా నిలుపడం
  alternative: వారి సమర్పణను షరతుగా లేదా విమోచనకు హామీగా వివరణాత్మకంగా మార్చడం
  rationale: వారు దేవునికి తమపై తన దృష్టికి మంచిదైనది చేయమని చెబుతూనే, వెంటనే విడిపించమని వేడుకుంటారు. మూలంలోని ఈ ఉద్వేగాన్ని పరిష్కరించకుండా నిలుపబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టమైనప్పటికీ ప్రార్థనాత్మక గంభీరతను నిలిపే శైలి. మూలంలోని ప్రత్యక్ష ఒప్పుకోలు, సమర్పణ, అత్యవసర విజ్ఞప్తి క్రమం కాపాడబడింది.
