id: JDG.10.18
reference: Judges 10:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּאמְר֨וּ הָ/עָ֜ם שָׂרֵ֤י גִלְעָד֙ אִ֣ישׁ אֶל רֵעֵ֔/הוּ מִ֣י הָ/אִ֔ישׁ אֲשֶׁ֣ר יָחֵ֔ל לְ/הִלָּחֵ֖ם בִּ/בְנֵ֣י עַמּ֑וֹן יִֽהְיֶ֣ה לְ/רֹ֔אשׁ לְ/כֹ֖ל יֹשְׁבֵ֥י גִלְעָֽד־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/010/018.yaml
  text: And the people[a], the leaders of Gilead, said to one another, “Who is the man who will begin to fight against the sons of Ammon? He shall become head over all the inhabitants of Gilead.”
translation:
  language: te
  text: 'గిలాదు నాయకులైన ప్రజలు ఒకరితో ఒకరు ఇలా చెప్పుకున్నారు: “అమ్మోనీయులపై పోరాడటం మొదలుపెట్టే మనిషి ఎవరు? అతడే గిలాదు నివాసులందరికీ అధిపతి అవుతాడు.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָעָם שָׂרֵי גִלְעָד
  choice: గిలాదు నాయకులైన ప్రజలు
  rationale: హీబ్రూలో సంధాయకం లేకుండా పక్కపక్కనే ఉన్న ‘ప్రజలు’ మరియు ‘గిలాదు నాయకులు’ అనే పదాలను సమానాధికరణంగా గ్రహించి, రెండు అంశాలనూ సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: אִישׁ אֶל־רֵעֵהוּ
  choice: ఒకరితో ఒకరు
  rationale: అక్షరార్థంగా ‘ఒక్కొక్క మనిషి తన సహచరునితో’; ఇక్కడ పరస్పర సంభాషణ భావాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: מִי הָאִישׁ
  choice: మనిషి ఎవరు?
  rationale: మూలంలోని స్పష్టమైన పుంలింగ పదమైన אִישׁను నిలిపి, సైనిక నాయకుని ఎంపిక సందర్భానికి తగిన సహజ తెలుగు ప్రశ్నగా అనువదించబడింది.
- source_word: יָחֵל לְהִלָּחֵם
  choice: యుద్ధం చేయడం మొదలుపెట్టే
  rationale: חלל హిఫీల్ రూపంలోని ‘మొదలుపెట్టు’ భావాన్నీ, לחם యొక్క సైనిక పోరాట భావాన్నీ రెండింటినీ స్పష్టంగా నిలుపుతుంది.
- source_word: בִּבְנֵי עַמּוֹן
  choice: అమ్మోనీయులతో
  rationale: అక్షరార్థంగా ‘అమ్మోను కుమారులతో’; ఇది జనసమూహానికి సంబంధించిన సాంప్రదాయ జాతినామం కాబట్టి సహజ తెలుగులో ‘అమ్మోనీయులు’ అని ఇవ్వబడింది. పోరాట సందర్భంలో ‘తో’ విభక్తి ప్రతికూల సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: יִהְיֶה לְרֹאשׁ
  choice: అధిపతి అవుతాడు
  rationale: ‘తలగా ఉంటాడు/అవుతాడు’ అనే హీబ్రూ రూపకంలోని నాయకత్వార్థాన్ని ఆధునిక తెలుగులో స్పష్టంగా, గౌరవప్రదంగా తెలియజేస్తుంది; సందర్భంలోని ఫలిత భావాన్ని ‘అవుతాడు’ నిలుపుతుంది.
- source_word: לְכֹל יֹשְׁבֵי גִלְעָד
  choice: గిలాదు నివాసులందరికీ
  rationale: గిలాదులో నివసించే మొత్తం జనాభాపై నాయకత్వ పరిధిని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: నాయకుని ఎంపిక సందర్భంలో స్పష్టమైన పుంలింగ పదం
  choice: ‘మనిషి’ని ప్రధాన పాఠ్యంలో నిలుపడం
  alternative: ‘వ్యక్తి’ లేదా కేవలం ‘ఎవరు’
  rationale: మూలంలో אִישׁ స్పష్టంగా ఉంది; ప్రాచీన ఇశ్రాయేలు సైనిక నాయకత్వ ఎంపిక సందర్భంలో దానిని లింగతటస్థంగా మార్చకుండా నిలుపడం మూలానికి నిష్ఠగా ఉంటుంది.
- issue: יִהְיֶה לְרֹאשׁ లోని నాయకత్వ రూపకం
  choice: అధిపతి అవుతాడు
  alternative: తలగా ఉంటాడు
  rationale: తెలుగులో అక్షరార్థమైన ‘తల’ ఈ రాజకీయ నాయకత్వ భావాన్ని అసహజంగా లేదా అస్పష్టంగా చేయవచ్చు. ‘అధిపతి’ మూలంలోని అధికార భావాన్ని మతపరమైన అదనపు అర్థం చేర్చకుండా తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన వాక్యనిర్మాణం, అయితే కథనానికి తగిన గౌరవప్రదమైన శైలి. మూలంలోని పుంలింగ సూచనను, యుద్ధాన్ని ప్రారంభించే భావాన్ని, నాయకత్వ ఫలితాన్ని నిలుపుకుంది.
