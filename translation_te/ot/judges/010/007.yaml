source:
  edition: WLC
  text: וַ/יִּֽחַר אַ֥ף יְהוָ֖ה בְּ/יִשְׂרָאֵ֑ל וַֽ/יִּמְכְּרֵ/ם֙ בְּ/יַד פְּלִשְׁתִּ֔ים וּ/בְ/יַ֖ד בְּנֵ֥י עַמּֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/010/007.yaml
  text: So Yahweh’s anger burned against Israel[c][b][a], and he sold them into the hand of the Philistines and into the hand of the Ammonites.
translation:
  language: te
  text: అప్పుడు ఇశ్రాయేలుపై యహ్వే కోపం రగిలింది[a]. ఆయన వారిని ఫిలిష్తీయుల చేతికీ, అమ్మోనీయుల చేతికీ[c] అమ్మివేశాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఇశ్రాయేలుపై ఆయన కోపం మండింది.”
    reason: lexical_alternative
  - marker: b
    text: “అమ్మివేశాడు” అనేది, తీర్పుగా యహ్వే ఇశ్రాయేలును శత్రువుల ఆధీనానికి ఇవ్వడాన్ని సూచిస్తూ న్యాయాధిపతులు గ్రంథంలో మళ్లీ మళ్లీ వచ్చే ప్రయోగం.
    reason: cross_reference
  - marker: c
    text: అక్షరార్థంగా, “ఫిలిష్తీయుల చేతికీ, అమ్మోను కుమారుల చేతికీ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: కోపం రగులుకుంది
  rationale: హీబ్రూ నుడికారంలోని కోపం మండడం లేదా రగులుకోవడం అనే రూపకాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: యెహోవా అనే సాంప్రదాయ ప్రత్యామ్నాయ రూపానికి బదులుగా, మూలంలోని దైవనామం יהוהను ‘యహ్వే’ అని లిప్యంతరీకరించింది.
- source_word: בְּיִשְׂרָאֵל
  choice: ఇశ్రాయేలుపై
  rationale: కోపాన్ని సూచించే నుడికారంలో ב అనే విభక్తి ఇక్కడ ‘పై/వ్యతిరేకంగా’ అనే భావాన్ని ఇస్తుంది.
- source_word: וַיִּמְכְּרֵם
  choice: వారిని ... అమ్మివేశాడు
  rationale: మూలంలోని מכר (‘అమ్ము’) అనే బలమైన రూపకాన్ని మృదువుచేయకుండా, న్యాయాధిపతులు గ్రంథంలో పునరావృతమయ్యే తీర్పు భావాన్ని నిలుపుతుంది.
- source_word: בְּיַד
  choice: చేతికీ
  rationale: ‘చేతిలో/చేతికి’ అనే హీబ్రూ అధికార నుడికారాన్ని తెలుగులో అర్థమయ్యే రీతిలో నిలుపుతుంది; ఇది శత్రువుల ఆధీనంలోకి ఇవ్వడాన్ని సూచిస్తుంది.
- source_word: פְּלִשְׁתִּים
  choice: ఫిలిష్తీయులు
  rationale: ఈ ప్రజావర్గానికి తెలుగులో ప్రామాణికంగా వాడే పేరు.
- source_word: בְּנֵי עַמּוֹן
  choice: అమ్మోనీయులు
  rationale: అక్షరార్థంగా ‘అమ్మోను కుమారులు’; సందర్భంలో ప్రజావర్గాన్ని సూచిస్తున్నందున సహజమైన తెలుగు జాతినామం వాడబడింది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠం బిరుదును కాకుండా చతురక్షర దైవనామాన్ని నేరుగా వాడుతుంది. కాబట్టి వ్యక్తిగత దైవనామాన్ని లిప్యంతరీకరించి నిలుపబడింది.
- issue: וַיִּמְכְּרֵםలో దేవుని తీర్పు కార్యసాధకత్వం
  choice: ఆయన వారిని ... అమ్మివేశాడు
  alternative: ఆయన వారిని అప్పగించాడు
  rationale: ఇశ్రాయేలును శత్రువుల ఆధీనానికి ఇచ్చిన కార్యాన్ని వచనం యహ్వే చేసిన తీర్పుగా స్పష్టంగా చెబుతుంది. ‘అమ్మివేశాడు’ అనే మూలరూపకం ఆ తీవ్రతను, న్యాయాధిపతులు గ్రంథంలోని పునరావృత ధోరణిని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అదే సమయంలో హీబ్రూ కోప-రూపకం, ‘చేతికి’ అనే అధికార నుడికారం, ‘అమ్మివేశాడు’ అనే తీర్పు రూపకం నిలుపబడ్డాయి. వాక్య నిర్మాణం గంభీరంగా ఉన్నప్పటికీ సహజమైన తెలుగు క్రమాన్ని అనుసరిస్తుంది.
