  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אַתֶּם֙ עֲזַבְתֶּ֣ם אוֹתִ֔/י וַ/תַּעַבְד֖וּ אֱלֹהִ֣ים אֲחֵרִ֑ים לָ/כֵ֥ן לֹֽא אוֹסִ֖יף לְ/הוֹשִׁ֥יעַ אֶתְ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/010/013.yaml
  text: But you have forsaken me and served other gods[a]; therefore I will no longer save you.
translation:
  language: te
  text: అయితే మీరు నన్ను విడిచిపెట్టారు, ఇతర దేవుళ్లను సేవించారు. కాబట్టి ఇకపై నేను మిమ్మల్ని రక్షించను.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “విడిపించను” లేదా “కాపాడను.” హెబ్రీ క్రియ శత్రువుల నుండి విడిపించడాన్ని, అలాగే మరింత విస్తృత అర్థంలో రక్షించడాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַתֶּם
  choice: అయితే మీరు
  rationale: స్పష్టమైన సర్వనామంతో కూడిన וְ సందర్భంలో వ్యత్యాసాన్ని, నొక్కిచెప్పడాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘అయితే మీరు’ సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: עֲזַבְתֶּם אוֹתִי
  choice: నన్ను విడిచిపెట్టి
  rationale: עזב అంటే విడిచిపెట్టడం లేదా పరిత్యజించడం. ‘విడిచిపెట్టి’ సంబంధపరమైన గంభీరతను నిలుపుతూ సాధారణ పాఠకులకు సహజంగా ఉంటుంది.
- source_word: וַ/תַּעַבְדוּ
  choice: సేవించారు
  rationale: దేవుళ్లకు సంబంధించి עבד ఆరాధనతో కూడిన సేవను, విధేయతను సూచిస్తుంది. ‘సేవించారు’ మూలపద పరిధిని ‘ఆరాధించారు’ కంటే విస్తృతంగా నిలుపుతుంది.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: ఇతర దేవుళ్లను
  rationale: ఈ స్థిర పదబంధం యెహోవాకు బదులుగా ఇతర దేవతలను సూచిస్తుంది; ‘ఇతర దేవుళ్లు’ నేరుగా, స్పష్టంగా ఉంది.
- source_word: לָכֵן
  choice: కాబట్టి
  rationale: మునుపటి చర్యకు అనుసరించే తీర్పును సూచించే కారణ-ఫలిత సంబంధాన్ని సహజ తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: לֹא אוֹסִיף
  choice: ఇకపై ... రక్షించను
  rationale: నిరాకరణతో వచ్చిన יסף కొనసాగింపును నిలిపివేయడాన్ని సూచిస్తుంది. ‘ఇకపై ... చేయను’ అనే నిర్మాణం తెలుగులో ఆ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לְ/הוֹשִׁיעַ אֶתְכֶם
  choice: మిమ్మల్ని రక్షించను
  rationale: ישע రక్షించడం, విడిపించడం, కాపాడడం అనే పరిధిని కలిగి ఉంది. ‘రక్షించను’ విస్తృతమైన అర్థాన్ని నిలుపుతుంది; న్యాయాధిపతులు గ్రంథంలోని శత్రువుల నుండి విడిపించే తక్షణ భావాన్ని పాదసూచిక వివరిస్తుంది.
theological_decisions:
- issue: న్యాయాధిపతుల సందర్భంలో ישע అనే దైవిక రక్షణ పదం
  choice: రక్షించను
  alternative: విడిపించను; కాపాడను
  rationale: ఈ సందర్భంలో అణచివేసే శత్రువుల నుండి విడిపించడం ప్రధాన భావమైనప్పటికీ, హెబ్రీ క్రియకు మరింత విస్తృతమైన రక్షణ భావం కూడా ఉంది. ‘రక్షించను’ ఆ విస్తృతిని నిలుపుతుంది; సందర్భోచిత ప్రత్యామ్నాయాలను పాదసూచికలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. దేవుని ప్రత్యక్ష సంభాషణలో బహువచన ‘మీరు/మిమ్మల్ని’ నిలుపబడింది. మూలంలోని వ్యత్యాసం, కారణ-ఫలిత సంబంధం స్పష్టంగా ఉంచబడ్డాయి.
