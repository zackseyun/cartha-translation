source:
  edition: WLC
  text: וַֽ/יִּזְעֲקוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל אֶל יְהוָ֖ה לֵ/אמֹ֑ר חָטָ֣אנוּ לָ֔/ךְ וְ/כִ֤י עָזַ֨בְנוּ֙ אֶת אֱלֹהֵ֔י/נוּ וַֽ/נַּעֲבֹ֖ד אֶת הַ/בְּעָלִֽים־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/010/010.yaml
  text: Then the sons of Israel cried out to the LORD, saying, “We have sinned against you, because we have forsaken our God and have served the Baals.”
translation:
  language: te
  text: 'అప్పుడు ఇశ్రాయేలు ప్రజలు యెహోవాకు మొరపెట్టి ఇలా అన్నారు: “మేము నీకు విరోధంగా పాపం చేశాము; ఎందుకంటే మా దేవుణ్ణి విడిచిపెట్టి బయలులను పూజించాము.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు ప్రజలు
  rationale: అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులు’; ఆధునిక తెలుగులో సమస్త ఇశ్రాయేలు సమాజాన్ని సహజంగా సూచించేందుకు ‘ప్రజలు’ అని అనువదించాం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన టెట్రాగ్రామటన్‌ను సాధారణ తెలుగు బైబిలు వాడుకలో గుర్తించదగిన వ్యక్తినామ రూపంలో ఉంచాం.
- source_word: חָטָאנוּ לָךְ
  choice: మేము నీకు విరోధంగా పాపం చేశాము
  rationale: לָךְ ఇక్కడ పాపం ఎవరికి విరోధంగా జరిగిందో సూచిస్తుంది; ‘నీకు విరోధంగా’ మూలభావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: וְכִי
  choice: '[కొత్త వాక్యంగా కొనసాగింపు]'
  rationale: ఇక్కడ כִּי ఒప్పుకోలులోని పాపాన్ని వివరించే భావాన్ని ఇస్తుంది. తెలుగులో ప్రత్యేక కారణసంధిని చేర్చకుండా తదుపరి వాక్యంగా చెప్పడం సహజంగా ఉండి అదే వివరణాత్మక సంబంధాన్ని నిలుపుతుంది.
- source_word: עָזַבְנוּ אֶת אֱלֹהֵינוּ
  choice: మా దేవుణ్ణి విడిచిపెట్టి
  rationale: మూలంలోని ‘మా దేవుణ్ణి విడిచాము’ అనే భావాన్ని తరువాతి క్రియతో సహజ తెలుగు నిర్మాణంలో కలిపాం.
- source_word: וַנַּעֲבֹד אֶת הַבְּעָלִים
  choice: బయలులను పూజించాము
  rationale: עבד దేవతలను కర్మగా తీసుకున్నప్పుడు సేవించడం/ఆరాధించడం అనే భావం కలిగి ఉంటుంది; ఆధునిక పాఠకులకు ‘పూజించాము’ స్పష్టంగా ఉంటుంది. బహువచన הַבְּעָלִיםను ‘బయలులు’గా నిలిపాం.
theological_decisions:
- issue: దైవనామం יהוה యొక్క అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలంలో సాధారణ బిరుదు కాక ప్రత్యేక ఒడంబడిక నామం ఉంది. దానిని వ్యక్తినామంగా చూపడం మూలంలోని భేదాన్ని కాపాడుతుంది; ప్రత్యేక మతశాఖ వ్యాఖ్యానాన్ని చేర్చదు.
- issue: ఇశ్రాయేలీయుల పాపపు ఒప్పుకోలు—కారణమా లేక వివరణా
  choice: రెండవ వాక్యంగా పాపం యొక్క స్వరూపాన్ని వివరించడం
  alternative: ‘ఎందుకంటే’ అని స్పష్టమైన కారణసంధిని చేర్చడం
  rationale: כִּי కారణార్థం లేదా వివరణార్థం ఇవ్వగలదు. తెలుగు వాక్య విభజన రెండింటినీ బలవంతంగా నిర్ణయించకుండా, దేవుణ్ణి విడిచి బయలులను పూజించడమే ఒప్పుకున్న పాపమని చూపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామూహిక ఒప్పుకోలుకు తగిన గంభీరతను ఉంచుతూ సాధారణ పాఠకులకు సహజంగా వినిపించే పదప్రయోగం. మూలంలోని బహువచన ‘బయలులు’ను నిలిపాం.
