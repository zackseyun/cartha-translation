id: JDG.10.14
reference: Judges 10:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: לְכ֗וּ וְ/זַֽעֲקוּ֙ אֶל הָ֣/אֱלֹהִ֔ים אֲשֶׁ֥ר בְּחַרְתֶּ֖ם בָּ֑/ם הֵ֛מָּה יוֹשִׁ֥יעוּ לָ/כֶ֖ם בְּ/עֵ֥ת צָרַתְ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/010/014.yaml
  text: Go and cry out to the gods whom you have chosen[a]; let them save you in the time of your distress.
translation:
  language: te
  text: వెళ్లి, మీరు ఎంచుకున్న దేవుళ్లకు మొరపెట్టుకోండి; మీ కష్టకాలంలో వారే మిమ్మల్ని రక్షించుగాక.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారే మిమ్మల్ని రక్షిస్తారు.” హీబ్రూ క్రియారూపాన్ని సాధారణ భవిష్యదర్థంలో అనువదించవచ్చు; అయితే ఈ సందర్భంలో అది వ్యంగ్యభరితమైన సవాలుగా పనిచేస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: לְכוּ
  choice: వెళ్లి
  rationale: הלך యొక్క బహువచన ఆజ్ఞారూపం. సందర్భంలో ఇది కఠినమైన పంపివేత; సహజమైన ఆధునిక తెలుగులో ‘వెళ్లి’ దానిని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: וְזַעֲקוּ
  choice: మొరపెట్టుకోండి
  rationale: זעק ఆపదలో సహాయం కోసం బిగ్గరగా వేడుకోవడాన్ని సూచిస్తుంది. ‘మొరపెట్టుకోండి’ అత్యవసరతను, ప్రార్థనలాంటి విన్నపాన్ని రెండింటినీ నిలుపుతుంది.
- source_word: אֶל הָאֱלֹהִים
  choice: దేవుళ్లకు
  rationale: אֱלֹהִים రూపపరంగా సందిగ్ధమైనా, ఇశ్రాయేలు ఎంచుకున్న అన్యదేవతల సందర్భం, తరువాతి బహువచన సర్వనామం మరియు క్రియ దీని బహువచనార్థాన్ని నిర్ధారిస్తున్నాయి.
- source_word: אֲשֶׁר בְּחַרְתֶּם בָּם
  choice: మీరు ఎంచుకున్న
  rationale: בחר ב అనే నిర్మాణం ‘ఎంచుకొను’ అనే అర్థాన్నిస్తుంది. తెలుగులో విభక్తిని ‘దేవుళ్లకు’తో సహజంగా వ్యక్తం చేసినందున ఈ ఉపవాక్యం సంక్షిప్తంగా, స్పష్టంగా ఉంది.
- source_word: הֵמָּה
  choice: వారే
  rationale: స్వతంత్ర బహువచన సర్వనామం ఇచ్చే ఉద్ఘాటనను ‘వారే’ నిలుపుతుంది; దేవతలను వ్యక్తులుగా సూచించే సందర్భంలో ఇది సహజంగా ఉంటుంది.
- source_word: יוֹשִׁיעוּ
  choice: మిమ్మల్ని రక్షించనివ్వండి
  rationale: ישׁע హిఫీల్ రూపానికి ‘రక్షించు’ అనే అర్థం. సందర్భంలో ఇది భవిష్యద్వాక్యం కాక వ్యంగ్యభరితమైన సవాలు; ‘రక్షించనివ్వండి’ ఆ వాక్యబలాన్ని నిలుపుతుంది.
- source_word: בְּעֵת צָרַתְכֶם
  choice: మీ కష్టకాలంలో
  rationale: ‘మీ ఆపద సమయములో’ అనే నామవాచక నిర్మాణాన్ని ఆధునిక, గౌరవప్రదమైన తెలుగులో సహజంగా ‘మీ కష్టకాలంలో’ అని వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: יוֹשִׁיעוּ అనే చివరి క్రియ యొక్క సందర్భానుసార వాక్యబలం
  choice: వ్యంగ్యభరితమైన ఆజ్ఞాత్మక/అనుమతిరూప సవాలుగా ‘వారే మిమ్మల్ని రక్షించనివ్వండి’
  alternative: సాధారణ భవిష్యదర్థంగా ‘వారే మిమ్మల్ని రక్షిస్తారు’
  rationale: ఇతర దేవుళ్లవైపు తిరిగిన ఇశ్రాయేలును యెహోవా గద్దిస్తున్న సందర్భం ఇది. కాబట్టి ఈ మాట రక్షణ జరుగుతుందనే ప్రకటనకన్నా, వారు ఎంచుకున్న దేవుళ్లనే ఆశ్రయించమనే వ్యంగ్య సవాలు. అయితే హీబ్రూ రూపానికి సాధారణ భవిష్యదర్థం కూడా వ్యాకరణపరంగా సాధ్యమని పాదటిప్పణి తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘మొరపెట్టుకోండి’ ఆపదలో సహాయం కోరే తీవ్రతను, ‘వారే’ మూలంలోని ఉద్ఘాటనను, ‘రక్షించనివ్వండి’ సందర్భంలోని వ్యంగ్య సవాలును నిలుపుతున్నాయి.
