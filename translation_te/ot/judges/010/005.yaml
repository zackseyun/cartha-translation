translation:
  language: te
  text: యాయీరు చనిపోయి, కామోనులో పాతిపెట్టబడ్డాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּמָת
  choice: చనిపోయి
  rationale: מות అనే సాధారణ మరణవాచక క్రియకు ఇది సహజమైన, సూటియైన ఆధునిక తెలుగు రూపం. తరువాతి సమానకర్తృక క్రియతో వాక్యాన్ని సహజంగా కలుపుతుంది.
- source_word: יָאִיר
  choice: యాయీరు
  rationale: హీబ్రూ వ్యక్తిపేరు יָאִיר‌ను దాని ధ్వనిరూపానికి దగ్గరగా తెలుగులో లిప్యంతరీకరించాం.
- source_word: וַיִּקָּבֵר
  choice: పాతిపెట్టబడ్డాడు
  rationale: קבר క్రియ యొక్క నిఫాల్ రూపంలోని కర్మణి భావాన్ని స్పష్టంగా నిలుపుతూ, సమాధి చేయబడటాన్ని సాధారణ ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: בְּקָמוֹן
  choice: కామోనులో
  rationale: בְּ సూచించే స్థలార్థాన్ని ‘లో’తో సహజంగా వ్యక్తం చేసి, קָמוֹן అనే స్థలనామాన్ని హీబ్రూ ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించాం.
