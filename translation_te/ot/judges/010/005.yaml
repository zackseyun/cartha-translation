  register: సంక్షిప్తమైన హీబ్రూ మరణ-సమాధి వృత్తాంత శైలిని కాపాడుతూ, సాధారణ ఆధునిక తెలుగు పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది.
