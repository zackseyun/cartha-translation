  source_fidelity: హీబ్రూ వచనంలోని వరుస సంఘటనలను—యాయీరు మరణించడం, తరువాత కామోనులో పాతిపెట్టబడడం—అనువాదం నమ్మకంగా తెలియజేస్తుంది. నిఫాల్ కర్మణి రూపమైన וַיִּקָּבֵר‌కు “పాతిపెట్టబడ్డాడు” సరైన కర్మణి సమానార్థక రూపం.
