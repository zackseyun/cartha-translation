  terminology: వ్యక్తిపేరు “యాయీరు” మరియు స్థలనామం “కామోను/కామోనులో” లిప్యంతరీకరణలు సమంజసంగా ఉన్నాయి. “చనిపోయి” అనేది מותకు సూటిగా సరిపోతుంది; “పాతిపెట్టబడ్డాడు” కర్మణి భావాన్ని నిలుపుతుంది.
