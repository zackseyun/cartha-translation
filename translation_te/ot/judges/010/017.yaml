revisions:
- from: అప్పుడు అమ్మోనీయులు యుద్ధానికి సమకూడి[a] గిలాదులో శిబిరం వేశారు. ఇశ్రాయేలీయులు కూడా సమకూడి మిస్పాలో శిబిరం వేశారు.
  to: అప్పుడు అమ్మోనీయులు సమీకరించబడి[a] గిలాదులో శిబిరం వేశారు. ఇశ్రాయేలీయులు సమకూడి మిజ్పాలో శిబిరం వేశారు.
  rationale: The revision removes the unstated phrase “for war,” preserves the contextual mustering sense of the disputed Hebrew verb in a non-overstated passive form, retains its lexical alternative in the footnote, removes an added connective, and standardizes Mizpah as “మిజ్పా.”
