source:
  edition: WLC
  text: וַ/יִּצָּֽעֲקוּ֙ בְּנֵ֣י עַמּ֔וֹן וַֽ/יַּחֲנ֖וּ בַּ/גִּלְעָ֑ד וַ/יֵּאָֽסְפוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וַֽ/יַּחֲנ֖וּ בַּ/מִּצְפָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/010/017.yaml
  text: Then the Ammonites were summoned and camped in Gilead[a], and the sons of Israel gathered together and camped at Mizpah.
translation:
  language: te
  text: అప్పుడు అమ్మోనీయులు సమీకరించబడి[a] గిలాదులో శిబిరం వేశారు. ఇశ్రాయేలీయులు సమకూడి మిజ్పాలో శిబిరం వేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అమ్మోనీయులు కేకలు వేశారు.” ఇక్కడి హీబ్రూ క్రియకు “కేకలు వేయడం” అనే అర్థమూ ఉండవచ్చు; ఈ సైనిక సందర్భంలో అది సమీకరించబడడం లేదా పిలువబడడం అనే భావాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּצָּעֲקוּ
  choice: యుద్ధానికి సమకూడి
  rationale: צעק సాధారణంగా ‘కేక వేయడం/మొరపెట్టడం’ అని అర్థమిస్తుంది; అయితే శిబిరం వేయడం వెంటనే ప్రస్తావించబడిన ఈ సైనిక సందర్భంలో, యుద్ధానికి సమీకరించబడడాన్ని సూచించే అవకాశం ఎక్కువ. తెలుగు సహజత్వం కోసం ‘యుద్ధానికి సమకూడి’ అని అనువదించి, మూలంలోని నిజమైన పదార్థ ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: בְּנֵי עַמּוֹן
  choice: అమ్మోనీయులు
  rationale: అక్షరార్థంగా ‘అమ్మోను కుమారులు’; ఇక్కడ ప్రజాజాతిని సూచిస్తున్నందున ఆధునిక తెలుగులో సహజమైన ‘అమ్మోనీయులు’ ఎంచుకున్నాం.
- source_word: וַיַּחֲנוּ
  choice: శిబిరం వేశారు
  rationale: חנה అంటే శిబిరం వేయడం లేదా విడిది చేయడం. సైనిక సందర్భాన్ని స్పష్టంగా, సహజంగా తెలిపే రూపం ఇది.
- source_word: בַּגִּלְעָד
  choice: గిలాదులో
  rationale: గిలాదు ఒక ప్రాంతం; ב ఉపసర్గ ఇక్కడ ‘లో’ అనే స్థానార్థాన్ని ఇస్తుంది.
- source_word: וַיֵּאָסְפוּ
  choice: సమకూడి
  rationale: אסף యొక్క నిఫాల్ రూపం కూడడం లేదా సమీకరించబడడం అనే భావం ఇస్తుంది. సందర్భంలో ఇశ్రాయేలీయుల సమీకరణను సహజంగా తెలుపుతుంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులు
  rationale: అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులు’; ఇక్కడ మొత్తం ప్రజాజాతిని సూచిస్తున్నందున లింగపరంగా అనవసరంగా పరిమితం చేయకుండా సహజమైన ప్రజానామాన్ని వాడాం.
- source_word: בַּמִּצְפָּה
  choice: మిస్పాలో
  rationale: మిస్పా అనే స్థలంలో వారు శిబిరం వేసినట్లు ב ఉపసర్గ సూచిస్తుంది; తెలుగులో ‘మిస్పాలో’ సహజం.
