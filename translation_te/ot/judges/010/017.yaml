translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన కథనశైలి. రెండు పక్షాల సమీకరణ, శిబిరస్థాపనల సమాంతర నిర్మాణాన్ని నిలిపి ఉంచాం; צעק లోని సందిగ్ధతను పాదటిప్పణిలో సంరక్షించాం.
