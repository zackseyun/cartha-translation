id: JDG.10.1
reference: Judges 10:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּקָם֩ אַחֲרֵ֨י אֲבִימֶ֜לֶךְ לְ/הוֹשִׁ֣יעַ אֶת יִשְׂרָאֵ֗ל תּוֹלָ֧ע בֶּן פּוּאָ֛ה בֶּן דּוֹד֖וֹ אִ֣ישׁ יִשָּׂשכָ֑ר וְ/הֽוּא יֹשֵׁ֥ב בְּ/שָׁמִ֖יר בְּ/הַ֥ר אֶפְרָֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/010/001.yaml
  text: After Abimelech[a], Tola son of Puah, son of Dodo, a man of Issachar, arose to save Israel; and he lived in Shamir in the hill country of Ephraim.
translation:
  language: te
  text: అబీమెలెకు తరువాత, ఇశ్రాయేలును రక్షించడానికి పూవా కుమారుడు, దోదో కుమారుడు[a] అయిన ఇశ్శాఖారు వంశస్థుడు తోలా లేచాడు. అతడు ఎఫ్రాయిము కొండ ప్రాంతంలోని షామీరులో నివసించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తన మామ కుమారుడు.” హీబ్రూ בֶּן־דּוֹדוֹ అనే పదబంధంలో ‘దోదో’ను వ్యక్తి పేరుగా చదవవచ్చు; లేదా ‘తన మామ’ అనే సాధారణ నామార్థంలో అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּקָם
  choice: లేచాడు
  rationale: ఈ కథన సందర్భంలో קום ఒక నాయకుడు ముందుకు రావడాన్ని సూచిస్తుంది. ‘లేచాడు’ మూలంలోని కథన రూపాన్ని నిలుపుతూ, అధికారిక నియామకం జరిగిందని అదనంగా అర్థం చేర్చదు.
- source_word: אַחֲרֵי אֲבִימֶלֶךְ
  choice: అబీమెలెకు తరువాత
  rationale: కథన క్రమంలో కాలానుగత అనుసరణను సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: לְהוֹשִׁיעַ אֶת־יִשְׂרָאֵל
  choice: ఇశ్రాయేలును రక్షించడానికి
  rationale: ישׁע హిఫీల్ రూపంలోని ‘రక్షించు/విడిపించు’ భావాన్ని ‘రక్షించడానికి’ విస్తృతంగానే ఉంచుతుంది; దానిని కేవలం సైనిక విమోచనకు పరిమితం చేయదు.
- source_word: תּוֹלָע
  choice: తోలా
  rationale: వ్యక్తి పేరును ఆధునిక ప్రామాణిక తెలుగు లిపిలో ధ్వన్యనుకరణ చేశాం.
- source_word: בֶּן־פּוּאָה
  choice: పూవా కుమారుడు
  rationale: సాధారణ వంశావళి సంబంధాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: בֶּן־דּוֹדוֹ
  choice: దోదో కుమారుడు
  rationale: మసొరేటిక్ స్వరచిహ్నాలు דּוֹדוֹను వ్యక్తి పేరుగా సూచిస్తున్నాయి; వంశావళి సందర్భానికీ ఇది సరిపోతుంది. హీబ్రూ వ్యంజనాల ఆధారంగా సాధ్యమైన మరో పఠనాన్ని పాదసూచికలో ఉంచాం.
- source_word: אִישׁ יִשָּׂשכָר
  choice: ఇశ్శాఖారు వంశస్థుడు
  rationale: గోత్ర అనుబంధాన్ని ఆధునిక తెలుగులో స్పష్టంగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: וְהוּא יֹשֵׁב
  choice: అతడు ... నివసించాడు
  rationale: హీబ్రూ కృదంత నిర్మాణం అతని నివాసస్థలాన్ని వివరిస్తుంది; ‘నివసించాడు’ గౌరవప్రదమైన, సహజ ఆధునిక తెలుగు.
- source_word: בְּשָׁמִיר
  choice: షామీరులో
  rationale: స్థల పేరును తెలుగు లిపిలో ధ్వన్యనుకరణ చేశాం.
- source_word: בְּהַר אֶפְרָיִם
  choice: ఎఫ్రాయిము కొండ ప్రాంతంలోని
  rationale: הַר అనే పదం ఇక్కడ ఒక్క కొండను కాక భౌగోళిక ప్రాంతాన్ని సూచిస్తుంది; ‘కొండ ప్రాంతం’ ఆ భావాన్ని స్పష్టంగా అందిస్తుంది.
theological_decisions:
- issue: לְהוֹשִׁיעַలోని రక్షణ స్వరూపం
  choice: రక్షించడానికి
  alternative: విడిపించడానికి
  rationale: మూలపదం సైనిక విమోచనను కలిగి ఉండగలిగినా దానికే పరిమితం కాదు. ‘రక్షించడానికి’ దాని విస్తృత కథన, ధార్మిక బలాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. వంశావళిని తెలుగు పఠన క్రమానికి అనుగుణంగా ‘దోదో కుమారుడు పూవా కుమారుడు తోలా’గా అమర్చి, మూలంలోని సంబంధాలను యథాతథంగా ఉంచాం. పాదసూచిక గుర్తు [a] సందిగ్ధమైన వంశావళి పదబంధం వెంటనే ఉంచబడింది.
