source:
  edition: WLC
  text: וַ/יֹּסִ֣פוּ בְּנֵ֣י יִשְׂרָאֵ֗ל לַ/עֲשׂ֣וֹת הָ/רַע֮ בְּ/עֵינֵ֣י יְהוָה֒ וַ/יַּעַבְד֣וּ אֶת הַ/בְּעָלִ֣ים וְ/אֶת הָ/עַשְׁתָּר֡וֹת וְ/אֶת אֱלֹהֵ֣י אֲרָם֩ וְ/אֶת אֱלֹהֵ֨י צִיד֜וֹן וְ/אֵ֣ת אֱלֹהֵ֣י מוֹאָ֗ב וְ/אֵת֙ אֱלֹהֵ֣י בְנֵי עַמּ֔וֹן וְ/אֵ֖ת אֱלֹהֵ֣י פְלִשְׁתִּ֑ים וַ/יַּעַזְב֥וּ אֶת יְהוָ֖ה וְ/לֹ֥א עֲבָדֽוּ/הוּ׀־־־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/010/006.yaml
  text: And the sons of Israel again did what was evil in the eyes of Yahweh[a], and they served the Baals and the Ashtoreths, and the gods of Aram, the gods of Sidon, the gods of Moab, the gods of the sons of Ammon, and the gods of the Philistines[b]. They forsook Yahweh and did not serve him.
translation:
  language: te
  text: ఇశ్రాయేలీయులు మళ్లీ యాహ్వే దృష్టిలో చెడు చేశారు.[a] వారు బయలులను, అష్టారోతులను, అరాము దేవుళ్లను, సీదోను దేవుళ్లను, మోయాబు దేవుళ్లను, అమ్మోనీయుల దేవుళ్లను,[b] ఫిలిష్తీయుల దేవుళ్లను సేవించారు. వారు యాహ్వేను విడిచిపెట్టి, ఆయనను సేవించలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యాహ్వే దృష్టిలో చెడు చేస్తూనే ఉన్నారు.” హీబ్రూ క్రియ పునరావృతాన్ని లేదా కొనసాగింపును సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ మూలంలో అక్షరార్థంగా, “అమ్మోను కుమారుల దేవుళ్లు”; అంటే అమ్మోనీయులు సేవించిన దేవుళ్లు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּסִפוּ
  choice: మళ్లీ ... చేశారు
  rationale: יסף + క్రియార్థక రూపం పునరావృతం లేదా కొనసాగింపును సూచించగలదు. న్యాయాధిపతులు గ్రంథంలోని పునరావృత చక్రాన్ని సహజమైన తెలుగులో చూపేందుకు ‘మళ్లీ ... చేశారు’ ఎంచుకున్నాం; కొనసాగింపు భావాన్ని పాదసూచికలో ఉంచాం.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులు
  rationale: అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులు’; అయితే సమస్త ఇశ్రాయేలు ప్రజలను సూచించే ఈ హీబ్రూ జాతీయ నామానికి ఆధునిక తెలుగులో ‘ఇశ్రాయేలీయులు’ సహజంగా, సమగ్రంగా ఉంటుంది.
- source_word: לַעֲשׂוֹת הָרַע בְּעֵינֵי יְהוָה
  choice: యెహోవా దృష్టిలో చెడుగా ఉన్నదాన్ని చేశారు
  rationale: ‘కళ్లలో’ అనే హీబ్రూ మూలరూపాన్ని తెలుగులో సహజమైన ‘దృష్టిలో’తో వ్యక్తం చేసి, కార్యంపై యెహోవా చేసే నైతిక మూల్యాంకనాన్ని నిలిపాం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించదగిన ‘యెహోవా’ రూపంలో లిప్యంతరీకరించాం.
- source_word: וַיַּעַבְדוּ / עֲבָדוּהוּ
  choice: సేవించారు / సేవించలేదు
  rationale: עבד యొక్క మూలార్థం ‘సేవించు’. విగ్రహారాధనను సూచించే సందర్భమైనప్పటికీ, వాక్యంలోని రెండు భాగాల్లో ఒకే పదాన్ని వాడటం ద్వారా విగ్రహాలకు చేసిన సేవకు, యెహోవాకు చేయని సేవకు మధ్య ఉన్న ఉద్దేశపూర్వక వ్యతిరేకతను కాపాడాం.
- source_word: הַבְּעָלִים
  choice: బయలులను
  rationale: వివిధ స్థానిక బయలు ఆరాధనా రూపాలను సూచించే హీబ్రూ బహువచనాన్ని తెలుగులో బహువచనంగానే ఉంచాం.
- source_word: הָעַשְׁתָּרוֹת
  choice: అష్తారోతులను
  rationale: ఆరాధనా దేవతల పేరుకు సంబంధించిన హీబ్రూ బహువచన రూపాన్ని లిప్యంతరీకరించి నిలిపాం.
- source_word: אֱלֹהֵי אֲרָם
  choice: అరాము దేవుళ్లను
  rationale: చారిత్రక ప్రాంతనామమైన ‘అరాము’ను తరువాతి కాలపు ‘సిరియా’తో భర్తీ చేయకుండా మూలంలోని పేరును నిలిపాం.
- source_word: אֱלֹהֵי בְנֵי עַמּוֹן
  choice: అమ్మోనీయుల దేవుళ్లను
  rationale: అక్షరార్థంగా ‘అమ్మోను కుమారుల దేవుళ్లు’; ఆధునిక తెలుగులో జాతిని స్పష్టంగా సూచించే ‘అమ్మోనీయులు’ సహజమైన సమానార్థకం. మూలరూపాన్ని పాదసూచికలో తెలిపాం.
theological_decisions:
- issue: יְהוָה దైవనామాన్ని ఎలా అందించాలి
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: మూలంలో వ్యక్తిగత దైవనామం ప్రత్యక్షంగా ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా లిప్యంతరీకరించాం. ‘యెహోవా’ ఆధునిక తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన రూపం; ఉచ్చారణ పునర్నిర్మాణంపై ఉన్న భేదాన్ని వాక్యంలో పరిష్కరించినట్లు చూపలేదు.
- issue: עבד ను విగ్రహారాధన సందర్భంలో ‘సేవించు’గా లేదా ‘ఆరాధించు’గా అనువదించడం
  choice: సేవించారు
  alternative: ఆరాధించారు
  rationale: ఒకే హీబ్రూ క్రియ విగ్రహాల విషయంలోనూ, యెహోవా విషయంలోనూ వస్తుంది. ‘సేవించు’ అని రెండుచోట్లా అనువదించడం ఆరాధనతో పాటు విధేయత, నిబద్ధత అనే విస్తృత భావాన్నీ, వాక్యంలోని వ్యతిరేక సమాంతరతనూ కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథనశైలిని వాడాం. జాతి పేర్లను సహజమైన తెలుగు రూపాల్లో ఇచ్చాం; బయలు, అష్తారోతు వంటి ఆరాధనా పేర్ల బహువచనాన్ని నిలిపాం. మూలంలోని వరుస జాబితా, చివరి వ్యతిరేక వాక్య నిర్మాణం కాపాడబడ్డాయి.
