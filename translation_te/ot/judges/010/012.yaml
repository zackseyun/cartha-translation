translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన వాక్యనిర్మాణం ఉపయోగించాం. హీబ్రూ పాఠంలోని స్వనామాలను ప్రధాన పాఠంలో నిలిపి, అవి ప్రజాసమూహాలను సూచిస్తాయనే సాధ్యమైన వివరణలను పాదటిప్పణుల్లో ఇచ్చాం. మూలంలోని వరుస వావ్ నిర్మాణాన్ని తెలుగులో రెండు వాక్యాలుగా, ‘అప్పుడు’ అనే సహజ అనుసంధానంతో వ్యక్తం చేశాం.
