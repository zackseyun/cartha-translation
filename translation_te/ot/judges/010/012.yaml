source:
  edition: WLC
  text: וְ/צִידוֹנִ֤ים וַֽ/עֲמָלֵק֙ וּ/מָע֔וֹן לָחֲצ֖וּ אֶתְ/כֶ֑ם וַ/תִּצְעֲק֣וּ אֵלַ֔/י וָ/אוֹשִׁ֥יעָ/ה אֶתְ/כֶ֖ם מִ/יָּדָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/010/012.yaml
  text: The Sidonians[a], Amalek, and Maon oppressed you, and you cried out to me[b], and I saved you from their hand.
translation:
  language: te
  text: సీదోనీయులు, అమాలేక్[a], మావోను[b] మిమ్మల్ని అణచివేశారు. అప్పుడు మీరు నాకు మొరపెట్టారు; నేను మిమ్మల్ని వారి చేతిలోనుండి రక్షించాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘అమాలేకీయులు.’ హీబ్రూ పాఠంలో ‘అమాలేక్’ అని ఉంది; అది మొత్తం ప్రజాసమూహాన్ని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘మావోనీయులు.’ హీబ్రూ పాఠంలో ‘మావోను’ అని ఉంది; ఇక్కడ అది మావోనుతో సంబంధమున్న ప్రజాసమూహాన్ని సూచించే అవకాశం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: צִידוֹנִים
  choice: సీదోనీయులు
  rationale: ఇది సీదోను ప్రజలను సూచించే బహువచన జాతినామం; తెలుగులో సహజమైన జాతివాచక రూపాన్ని ఉపయోగించాం.
- source_word: עֲמָלֵק
  choice: అమాలేకు
  rationale: హీబ్రూ పాఠంలో జాతినామ రూపం కాకుండా ‘అమాలేకు’ అనే స్వనామమే ఉంది; అది ఇక్కడ సమూహాన్నంతటినీ సూచించగలదు. మూలరూపాన్ని ప్రధాన పాఠంలో నిలిపి, స్పష్టీకరణను పాదటిప్పణిలో ఇచ్చాం.
- source_word: מָעוֹן
  choice: మాయోను
  rationale: హీబ్రూ పాఠం ‘మాయోను’ అనే స్వనామాన్ని ఇస్తుంది; సందర్భంలో అది ఒక ప్రజాసమూహాన్ని సూచించే అవకాశం ఉన్నా, ప్రధాన పాఠంలో మూలంలోని అస్పష్టతను నిలిపాం.
- source_word: לָחֲצוּ
  choice: అణచివేశారు
  rationale: ఈ క్రియ శత్రుత్వంతో తీవ్రమైన ఒత్తిడికి, పీడనకు గురిచేయడాన్ని సూచిస్తుంది; ‘అణచివేశారు’ ఆధునిక తెలుగులో సహజంగా విదేశీ ఆధిపత్య భావాన్ని తెలియజేస్తుంది.
- source_word: וַתִּצְעֲקוּ אֵלַי
  choice: మీరు నాకు మొరపెట్టారు
  rationale: సహాయం కోసం దేవునివైపు చేసిన ఆర్తితో కూడిన విజ్ఞప్తిని ‘మొరపెట్టారు’ సహజంగా, గంభీరంగా వ్యక్తం చేస్తుంది.
- source_word: וָאוֹשִׁיעָה
  choice: నేను ... రక్షించాను
  rationale: ישׁע క్రియలోని రక్షించడం లేదా విడిపించడం అనే ప్రధాన భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: מִיָּדָם
  choice: వారి చేతిలోనుండి
  rationale: ‘చేతిలోనుండి’ అనే హీబ్రూ నుడికారాన్ని నిలుపుతూ, వారి అధికారం లేదా నియంత్రణ నుండి విడిపించడమనే భావాన్ని తెలుగులో అర్థమయ్యేలా ఉంచుతుంది.
