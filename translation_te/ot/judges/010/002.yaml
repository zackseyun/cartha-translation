- from: అతడు ఇరవై మూడు సంవత్సరాలు ఇశ్రాయేలుకు న్యాయం తీర్చాడు. తరువాత అతడు చనిపోయి, షామీరులో పాతిపెట్టబడ్డాడు.
  to: అతడు ఇశ్రాయేలుకు ఇరవై మూడు సంవత్సరాలు న్యాయం తీర్చాడు. తరువాత అతడు చనిపోయాడు; షామీరులో పాతిపెట్టబడ్డాడు.
