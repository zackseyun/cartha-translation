translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని రెండు వాక్యక్రమ సంఘటనలను తెలుగులో స్పష్టంగా అనుసంధానించింది; వివరణాత్మక లేదా మతపరమైన అదనపు భావాలను చేర్చలేదు.
