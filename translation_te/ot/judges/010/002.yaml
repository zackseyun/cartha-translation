  yaml_path: translation/ot/judges/010/002.yaml
  text: He judged Israel twenty-three years. Then he died and was buried in Shamir.
translation:
  language: te
  text: అతడు ఇశ్రాయేలుకు ఇరవై మూడు సంవత్సరాలు న్యాయం తీర్చాడు. తరువాత అతడు చనిపోయాడు; షామీరులో పాతిపెట్టబడ్డాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁפֹּט
  choice: న్యాయం తీర్చాడు
  rationale: న్యాయాధిపతుల గ్రంథంలో שׁפט న్యాయాధిపతిగా ఇశ్రాయేలుపై నాయకత్వం వహించడాన్ని సూచిస్తుంది. ‘న్యాయం తీర్చాడు’ అనే పదబంధం గ్రంథంలోని న్యాయాధిపతి పదజాలంతో సంబంధాన్ని నిలుపుతూ సహజమైన తెలుగులో భావాన్ని తెలియజేస్తుంది.
- source_word: אֶת יִשְׂרָאֵל
  choice: ఇశ్రాయేలుకు
  rationale: మూలంలో ఇశ్రాయేలు ప్రత్యక్ష కర్మగా ఉన్నప్పటికీ, ‘న్యాయం తీర్చు’ అనే సహజ తెలుగు ప్రయోగంలో లబ్ధిదారు/సంబంధ సూచనగా ‘ఇశ్రాయేలుకు’ ఉపయోగించడం సముచితం; ఇది ఇశ్రాయేలు ప్రజలను సూచిస్తుంది.
- source_word: עֶשְׂרִים וְשָׁלֹשׁ שָׁנָה
  choice: ఇరవై మూడు సంవత్సరాలు
  rationale: కాలవ్యవధిని యథాతథంగా, ఆధునిక తెలుగు సంఖ్యా క్రమంలో అందిస్తుంది.
- source_word: וַיָּמָת
  choice: తరువాత అతడు చనిపోయి
  rationale: వావ్-కన్సెక్యూటివ్ కథన క్రమాన్ని ముందుకు తీసుకెళ్తుంది. ‘తరువాత’ సంఘటనల వరుసను సహజంగా తెలియజేస్తుంది; ‘చనిపోయి’ తదుపరి క్రియతో అనుసంధానమవుతుంది.
- source_word: וַיִּקָּבֵר
  choice: పాతిపెట్టబడ్డాడు
  rationale: నిఫాల్ రూపంలోని కర్మణి భావాన్ని నిలుపుతుంది; అతన్ని ఎవరు పాతిపెట్టారో అనవసరంగా చేర్చదు.
- source_word: בְּשָׁמִיר
  choice: షామీరులో
  rationale: בְּ అనే స్థానార్థక ఉపసర్గను ‘లో’తో అందించి, స్థలనామాన్ని ‘షామీరు’గా లిప్యంతరీకరించింది.
