  text: וַֽ/יְהִי ל֞/וֹ שְׁלֹשִׁ֣ים בָּנִ֗ים רֹֽכְבִים֙ עַל שְׁלֹשִׁ֣ים עֲיָרִ֔ים וּ/שְׁלֹשִׁ֥ים עֲיָרִ֖ים לָ/הֶ֑ם לָ/הֶ֞ם יִקְרְא֣וּ חַוֺּ֣ת יָאִ֗יר עַ֚ד הַ/יּ֣וֹם הַ/זֶּ֔ה אֲשֶׁ֖ר בְּ/אֶ֥רֶץ הַ/גִּלְעָֽד־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/010/004.yaml
  text: He had thirty sons, riding on thirty donkeys, and they had thirty towns. To this day they are called Havvoth-jair, which are in the land of Gilead.
translation:
  language: te
  text: అతనికి ముప్పై మంది కుమారులు ఉండేవారు. వారు ముప్పై గాడిదపిల్లల మీద స్వారీ చేసేవారు; వారికి ముప్పై పట్టణాలు ఉండేవి. గిలాదు దేశంలో ఉన్న ఆ పట్టణాలను ఈ రోజు వరకు హవ్వోత్‌-యాయీరు అని పిలుస్తారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֲיָרִים
  choice: గాడిదపిల్లలు
  rationale: హీబ్రూ పదం మగ గాడిదపిల్లలను సూచిస్తుంది; పట్టణాలు అనే సమధ్వని పదంతో ఉన్న పదప్రయోగాన్ని తెలుగులో పూర్తిగా నిలుపలేకపోయినా, జంతువు అర్థాన్ని ఖచ్చితంగా అందిస్తుంది.
- source_word: עֲיָרִים
  choice: పట్టణాలు
  rationale: రెండవ సమధ్వని హీబ్రూ రూపం నివాస పట్టణాలను సూచిస్తుంది; సందర్భానుసారంగా సహజమైన తెలుగు పదం.
- source_word: חַוֺּת יָאִיר
  choice: హవ్వోత్‌-యాయీరు
  rationale: స్థలనామాన్ని అనువదించకుండా హీబ్రూ ఉచ్చారణకు సమీపంగా లిప్యంతరీకరించింది.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: ఈ రోజు వరకు
  rationale: కథకుని కాలం వరకు ఆ పేరు కొనసాగిందనే మూలంలోని కాలసూచనను నేరుగా నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా రూపొందించబడింది. మొదటి వాక్యంలోని ఏకవచన స్వామ్యాన్ని, తరువాతి క్రియల బహువచన కర్త అయిన కుమారులతో స్పష్టంగా అనుసంధానించేందుకు ‘వారు’ వాడబడింది. గిలాదు దేశం అనే స్థలవివరణను చివర ఉంచి మూల భావసంబంధాన్ని కాపాడింది.
