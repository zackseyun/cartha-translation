source:
  edition: WLC
  text: וַ/יָּסִ֜ירוּ אֶת אֱלֹהֵ֤י הַ/נֵּכָר֙ מִ/קִּרְבָּ֔/ם וַ/יַּעַבְד֖וּ אֶת יְהוָ֑ה וַ/תִּקְצַ֥ר נַפְשׁ֖/וֹ בַּ/עֲמַ֥ל יִשְׂרָאֵֽל־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/010/016.yaml
  text: So they removed the foreign gods from among them and served Yahweh[a], and he became impatient over the misery of Israel.
translation:
  language: te
  text: వారు తమ మధ్యలో ఉన్న అన్యదేవతలను తొలగించి యహ్వేను సేవించారు. ఇశ్రాయేలు కష్టాన్ని ఆయన ఇక సహించలేకపోయాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరాలా, “ఇశ్రాయేలు కష్టం విషయంలో ఆయన ప్రాణం కుదించబడింది.” ఇది ‘ఇశ్రాయేలు కష్టాన్ని ఆయన ఇక భరించలేకపోయాడు’ అనే జాతీయం; “ఇశ్రాయేలు కష్టం విషయంలో ఆయన అసహనానికి గురయ్యాడు” అని కూడా అనువదించవచ్చు.
    reason: హీబ్రూ జాతీయ రూపాన్ని, అలాగే ‘ఇక భరించలేకపోవడం’ మరియు ‘అసహనం’ అనే సాధ్యమైన భావవ్యక్తీకరణలను వివరిస్తుంది.
lexical_decisions:
- source_word: וַיָּסִירוּ
  choice: తొలగించి
  rationale: హిఫిల్ రూపం ‘తొలగించడం, దూరం చేయడం’ అనే కార్యార్థాన్ని ఇస్తుంది; విగ్రహాలను తమ సమాజం నుంచి తీసివేసిన చర్యను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: אֱלֹהֵי הַנֵּכָר
  choice: అన్యదేవుళ్లను
  rationale: ఇది ఇశ్రాయేలీయేతర దేవతలను సూచించే స్థిరమైన భావవ్యక్తీకరణ; ‘అన్యదేవుళ్లు’ సంక్షిప్తంగా, స్పష్టంగా ఉంది.
- source_word: מִקִּרְבָּם
  choice: తమ మధ్యనుండి
  rationale: అక్షరార్థంగా ‘వారి మధ్యనుండి’; సమాజంలో ఉన్న వాటిని తొలగించారనే భావాన్ని కాపాడుతుంది.
- source_word: וַיַּעַבְדוּ אֶת יְהוָה
  choice: యెహోవాను సేవించారు
  rationale: עבד దేవునితో వాడినప్పుడు సేవ, ఆరాధన రెండింటినీ సూచించగలదు; ‘సేవించారు’ నిబద్ధత, విధేయతలతో కూడిన విస్తృత నిబంధనార్థాన్ని నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుగా మార్చకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో ప్రతిబింబిస్తుంది.
- source_word: וַתִּקְצַר נַפְשׁוֹ
  choice: ఇక సహించలేక ఆయన మనస్సు తల్లడిల్లింది
  rationale: అక్షరార్థంగా ‘ఆయన ప్రాణం/మనస్సు కుదించబడింది’ అనే హీబ్రూ జాతీయాన్ని యాంత్రికంగా కాకుండా, ఇక భరించలేని అంతరంగ స్పందనగా సహజ తెలుగులో వ్యక్తం చేస్తుంది; ‘తల్లడిల్లింది’ దయతో కూడిన వ్యక్తిగత స్పందనను నిలుపుతుంది.
- source_word: בַּעֲמַל יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కష్టాన్ని
  rationale: עָמָל ఇక్కడ శ్రమకన్నా బాధ, దురవస్థ, కష్టం అనే భావంలో ఉంది; ‘కష్టం’ సాధారణ పాఠకులకు సహజంగా ఉండి సందర్భంలోని పీడను తెలియజేస్తుంది.
theological_decisions:
- issue: וַתִּקְצַר נַפְשׁוֹ లో యెహోవా గురించిన మానవరూప అంతరంగ వర్ణన
  choice: ఇక సహించలేక ఆయన మనస్సు తల్లడిల్లింది
  alternative: ఇశ్రాయేలు కష్టం విషయంలో ఆయన అసహనానికి గురయ్యాడు
  rationale: ‘అసహనం’ తెలుగులో కోపం లేదా చిరాకు అనే అపార్థాన్ని కలిగించవచ్చు. మూలంలోని נֶפֶשׁ మరియు ‘కుదించబడింది’ అనే జాతీయాన్ని పూర్తిగా తొలగించకుండా, ఇశ్రాయేలు దురవస్థను ఇక భరించలేని యెహోవా వ్యక్తిగత స్పందనగా అనువదించాం. ఇది దేవుని భావోద్వేగ స్వభావంపై సిద్ధాంత నిర్ణయం చేయకుండా మూలపాఠంలోని ఉద్వేగాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనా సాధారణ పాఠకులకు సులభమైన శైలి. ‘అన్యదేవుళ్లు,’ ‘సేవించారు’ నిబంధనాత్మక భావాన్ని కాపాడుతాయి. ప్రధాన పాఠంలోని [a] సూచిక దానికి సంబంధించిన పాదటిప్పణితో సరిపోలుతుంది.
