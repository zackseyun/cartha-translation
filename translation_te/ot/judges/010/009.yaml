  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּעַבְר֤וּ בְנֵֽי עַמּוֹן֙ אֶת הַ/יַּרְדֵּ֔ן לְ/הִלָּחֵ֛ם גַּם בִּ/יהוּדָ֥ה וּ/בְ/בִנְיָמִ֖ין וּ/בְ/בֵ֣ית אֶפְרָ֑יִם וַ/תֵּ֥צֶר לְ/יִשְׂרָאֵ֖ל מְאֹֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/010/009.yaml
  text: Then the Ammonites crossed the Jordan to fight also against Judah[a], Benjamin, and the house of Ephraim, and Israel was greatly distressed.
translation:
  language: te
  text: అప్పుడు అమ్మోనీయులు యూదా, బెన్యామీను, ఎఫ్రాయిము వంశం మీద కూడా యుద్ధం చేయడానికి యొర్దాను నదిని దాటారు. దాంతో ఇశ్రాయేలు తీవ్రమైన ఇబ్బందిలో పడింది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַבְרוּ
  choice: దాటారు
  rationale: עבר క్రియకు యొర్దాను నది ప్రత్యక్ష కర్మగా ఉన్నందున, ఒక ఒడ్డు నుంచి మరొక ఒడ్డుకు దాటడాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: בְנֵי עַמּוֹן
  choice: అమ్మోనీయులు
  rationale: జాతి పేరును ఆధునిక తెలుగు కథనంలో సహజంగా వ్యక్తపరుస్తుంది; అక్షరార్థమైన ‘అమ్మోను కుమారులు’ ఇక్కడ అనవసరంగా కృత్రిమంగా ఉంటుంది.
- source_word: אֶת הַיַּרְדֵּן
  choice: యొర్దాను నదిని
  rationale: తెలుగు సాధారణ పాఠకులకు భౌగోళిక సూచన స్పష్టంగా ఉండేందుకు ‘నది’ని వ్యక్తపరిచాం.
- source_word: לְהִלָּחֵם
  choice: యుద్ధం చేయడానికి
  rationale: לחם రూపం సైనిక పోరాటంలో పాల్గొనడాన్ని సూచిస్తుంది; ఈ సందర్భంలో ‘యుద్ధం చేయడానికి’ సహజమైన, గౌరవప్రదమైన సమానార్థకం.
- source_word: גַּם
  choice: కూడా
  rationale: యొర్దానుకు తూర్పున జరిగిన పీడనతో పాటు పడమటి ప్రాంతాలపైకి కూడా దాడి విస్తరించిందనే సంకలన భావాన్ని నిలుపుతుంది.
- source_word: בִּיהוּדָה וּבְבִנְיָמִין וּבְבֵית אֶפְרָיִם
  choice: యూదా, బెన్యామీను, ఎఫ్రాయిము వంశం మీద
  rationale: בְּ అక్షరార్థంగా ‘లో’ అయినా, לְהִלָּחֵםతో కలిసి యుద్ధ లక్ష్యాన్ని సూచిస్తోంది; అందువల్ల ‘మీద’ సహజం. בֵּית‌ను విడిచిపెట్టకుండా ‘వంశం’గా ఉంచాం.
- source_word: וַתֵּצֶר לְיִשְׂרָאֵל מְאֹד
  choice: ఇశ్రాయేలు తీవ్రమైన ఇబ్బందిలో పడింది
  rationale: స్త్రీలింగ ఏకవచన క్రియ ఇక్కడ వ్యక్తిరహితంగా ఇశ్రాయేలుకు కలిగిన తీవ్రమైన సంకటస్థితిని సూచిస్తుంది. ‘ఇబ్బందిలో పడింది’ ఫలిత స్థితిని సహజ తెలుగులో తెలియజేస్తుంది; מְאֹד బలాన్ని ‘తీవ్రమైన’ నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సరళమైనప్పటికీ గౌరవప్రదమైన కథన శైలి. మూలంలోని ‘ఎఫ్రాయిము ఇల్లు/గృహం’ అనే సామూహిక భావాన్ని ‘ఎఫ్రాయిము వంశం’గా నిలిపాం. ఈ వచనానికి పాదసూచిక అవసరం లేదు; అందువల్ల ప్రధాన పాఠ్యంలో పాదసూచిక గుర్తులు లేవు.
