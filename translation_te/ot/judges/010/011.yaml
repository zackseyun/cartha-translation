  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ֥/יֹּאמֶר יְהוָ֖ה אֶל בְּנֵ֣י יִשְׂרָאֵ֑ל הֲ/לֹ֤א מִ/מִּצְרַ֨יִם֙ וּ/מִן הָ֣/אֱמֹרִ֔י וּ/מִן בְּנֵ֥י עַמּ֖וֹן וּ/מִן פְּלִשְׁתִּֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/010/011.yaml
  text: And Yahweh said to the sons of Israel[a], “Was it not from Egypt, and from the Amorites, and from the Ammonites, and from the Philistines[b], that I delivered you?"
translation:
  language: te
  text: 'యాహ్వే ఇశ్రాయేలు కుమారులతో[a] ఇలా అన్నాడు: “ఐగుప్తు నుండీ, అమోరీయుల నుండీ, అమ్మోనీయుల నుండీ, ఫిలిష్తీయుల నుండీ నేను మిమ్మల్ని విడిపించలేదా?[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, ‘ఇశ్రాయేలు కుమారులు’; ఇది ఇశ్రాయేలు ప్రజలను సూచించే నుడికారం.
    reason: lexical_alternative
  - marker: b
    text: ఈ వచనంలోని హీబ్రూ వాక్యం అధ్యాహారంగా ఉంది. సందర్భం ఆధారంగా ‘నేను మిమ్మల్ని విడిపించలేదా?’ అనే మాటలు స్పష్టత కోసం చేర్చబడ్డాయి.
    reason: source_ellipsis
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: ఇలా అన్నాడు
  rationale: ప్రత్యక్ష సంభాషణను పరిచయం చేసే సాధారణ హీబ్రూ కథన రూపానికి సహజమైన తెలుగు సమానం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో స్థిరంగా వాడుకలో ఉన్న లిప్యంతరీకరణను ఉపయోగించాం.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: హీబ్రూ కుటుంబసంబంధ పదబంధాన్ని నిలుపుతూ తెలుగులో సహజమైన రూపాన్ని ఎంచుకున్నాం; ఇది ఇశ్రాయేలు ప్రజలను సమష్టిగా సూచిస్తుంది.
- source_word: הֲלֹא
  choice: నేను ... విడిపించలేదా?
  rationale: ప్రతికూల ప్రశ్నార్థక రూపాన్ని తెలుగు అలంకారప్రశ్నగా సహజంగా వ్యక్తం చేస్తుంది.
- source_word: מִמִּצְרַיִם
  choice: ఐగుప్తీయుల నుండి
  rationale: సందర్భంలో దేశం కంటే అణచివేసిన ప్రజల వరుసతో సమాంతరతను స్పష్టంగా చూపుతుంది; హీబ్రూ పదం అక్షరార్థంగా ‘ఐగుప్తు నుండి’ అని కూడా అనువదించవచ్చు.
- source_word: הָאֱמֹרִי
  choice: అమోరీయులు
  rationale: హీబ్రూలో ఏకవచన సమష్టి రూపం ఉన్నా, ప్రజావర్గాన్ని తెలుగులో బహువచనంగా చెప్పడం సహజం.
- source_word: בְּנֵי עַמּוֹן
  choice: అమ్మోనీయులు
  rationale: ‘అమ్మోను కుమారులు’ అనే హీబ్రూ జాతినామానికి తెలుగులో ప్రాచుర్యమైన ప్రజావర్గ రూపం.
- source_word: פְּלִשְׁתִּים
  choice: ఫిలిష్తీయులు
  rationale: హీబ్రూ జాతినామానికి ప్రామాణిక తెలుగు రూపం.
- source_word: '[సందర్భం నుండి అంతర్నిహిత క్రియ]'
  choice: నేను మిమ్మల్ని విడిపించలేదా
  rationale: ఈ వచనంలోని హీబ్రూ వాక్యం అధ్యాహారంగా ఉంది. తదుపరి సందర్భం సూచించే రక్షణక్రియను తెలుగులో వాక్యపూర్ణత కోసం చేర్చాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామాన్ని ఎలా అనువదించాలి
  choice: యెహోవా
  alternative: యాహ్వే / ప్రభువు
  rationale: వ్యక్తిగత దైవనామాన్ని బిరుదుగా మార్చకుండా ఉంచాం; తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం.
- issue: בְּנֵי יִשְׂרָאֵל అనే హీబ్రూ నుడికారాన్ని నిలుపాలా
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలీయులు
  rationale: మూలంలోని కుటుంబసంబంధ రూపాన్ని నిలిపాం; పాదసూచికలో దాని సమష్టి భావాన్ని వివరించాం.
- issue: అధ్యాహారంగా ఉన్న రక్షణక్రియను సరఫరా చేయాలా
  choice: ‘నేను మిమ్మల్ని విడిపించలేదా?’ అని చేర్చడం
  alternative: జాబితాతోనే అసంపూర్ణ ప్రశ్నను ముగించడం
  rationale: హీబ్రూ అసంపూర్ణతను గుర్తిస్తూ, సందర్భం స్పష్టంగా సూచించే క్రియను సహజమైన తెలుగు కోసం సరఫరా చేశాం; ఆ చేర్పును పాదసూచికలో వెల్లడించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే కథనశైలి. జాతినామాలలో తెలుగు బైబిలు వాడుకకు పరిచితమైన రూపాలు ఉపయోగించబడ్డాయి.
