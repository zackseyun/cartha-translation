- from: 'యెహోవా ఇశ్రాయేలు కుమారులతో[a] ఇలా అన్నాడు: “ఐగుప్తీయుల నుండీ, అమోరీయుల నుండీ, అమ్మోనీయుల నుండీ, ఫిలిష్తీయుల నుండీ నేను మిమ్మల్ని విడిపించలేదా?[b]”'
