  rationale: మూలంలోని ఐగుప్తు అనే స్థలనామాన్ని “ఐగుప్తు”గా సరిచేసి, దైవనామాన్ని POB నిర్ణయానికి అనుగుణంగా “యాహ్వే”గా మార్చాం. మిగతా జాతినామాలు, అలంకారప్రశ్న, మరియు సందర్భం వల్ల అవసరమైన అధ్యాహార క్రియను అలాగే నిలిపాం.
