  text: וַֽ/יִּרְעֲצ֤וּ וַ/יְרֹֽצְצוּ֙ אֶת בְּנֵ֣י יִשְׂרָאֵ֔ל בַּ/שָּׁנָ֖ה הַ/הִ֑יא שְׁמֹנֶ֨ה עֶשְׂרֵ֜ה שָׁנָ֗ה אֶֽת כָּל בְּנֵ֤י יִשְׂרָאֵל֙ אֲשֶׁר֙ בְּ/עֵ֣בֶר הַ/יַּרְדֵּ֔ן בְּ/אֶ֥רֶץ הָ/אֱמֹרִ֖י אֲשֶׁ֥ר בַּ/גִּלְעָֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/010/008.yaml
  text: And they shattered and crushed the sons of Israel in that year[a]; for eighteen years they oppressed all the sons of Israel who were beyond the Jordan in the land of the Amorites[b], which is in Gilead.
translation:
  language: te
  text: ఆ సంవత్సరంలో వారు ఇశ్రాయేలు కుమారులను చితకగొట్టి నలగగొట్టారు[a]. యొర్దాను అవతల, గిలాదులోని అమోరీయుల దేశంలో ఉన్న ఇశ్రాయేలు కుమారులందరినీ వారు పద్దెనిమిది సంవత్సరాలు పీడించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “విరగదీసి నలిపివేశారు.” హీబ్రూలో బాధ తీవ్రతను బలపరచడానికి రెండు బలమైన, సమీపార్థక క్రియలు వాడబడ్డాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְעֲצוּ וַיְרֹצְצוּ
  choice: చితకగొట్టి అణచివేశారు
  rationale: రెండు బలమైన, సమీపార్థక క్రియల తీవ్రతను తెలుగులో సహజంగా నిలుపుతుంది; మొదటిది ఛిన్నాభిన్నం చేసే బలాన్ని, రెండవది నిరంతర పీడన భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: ఈ వచనంలో రెండుసార్లు వచ్చే హీబ్రూ పదబంధాన్ని రూపపరంగా నిలుపుతూ దాని పునరుక్తిని కాపాడుతుంది.
- source_word: בַּשָּׁנָה הַהִיא
  choice: ఆ సంవత్సరంలో
  rationale: హీబ్రూ కాలసూచనను సహజమైన ఆధునిక తెలుగులో నేరుగా అందిస్తుంది.
- source_word: שְׁמֹנֶה עֶשְׂרֵה שָׁנָה
  choice: పద్దెనిమిది సంవత్సరాలు
  rationale: పీడన కొనసాగిన కాలవ్యవధిని స్పష్టంగా తెలియజేస్తుంది.
- source_word: אֶת כָּל בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులందరినీ
  rationale: כָּל సూచించే సమగ్రతను, అలాగే ముందున్న పదబంధపు పునరుక్తిని నిలుపుతుంది.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: యొర్దాను అవతల
  rationale: దిశను అనవసరంగా నిర్దిష్టం చేయకుండా హీబ్రూ భౌగోళిక నుడికారాన్ని కాపాడుతుంది.
- source_word: בְּאֶרֶץ הָאֱמֹרִי אֲשֶׁר בַּגִּלְעָד
  choice: గిలాదులో ఉన్న అమోరీయుల దేశంలో
  rationale: గిలాదు అనే ప్రాంతంతో అమోరీయుల దేశానికి ఉన్న సంబంధాన్ని సహజంగా, స్పష్టంగా తెలియజేస్తుంది.
