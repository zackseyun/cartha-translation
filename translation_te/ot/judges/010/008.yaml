translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కానీ సులభంగా అర్థమయ్యే శైలి. హీబ్రూలోని పునరుక్తి కోసం ‘ఇశ్రాయేలు కుమారులు’ నిలుపబడింది. మూలపాఠంలోని కాలవ్యవధి సంబంధం కొంత అసమతుల్యంగా ఉండటంతో, మొదటి వాక్యాన్ని ‘ఆ సంవత్సరంలో’ అని ఉంచి, తరువాత పద్దెనిమిది సంవత్సరాల నిరంతర పీడనను ప్రత్యేక వాక్యంగా స్పష్టం చేశాం.
