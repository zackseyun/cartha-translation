  yaml_path: translation/ot/judges/010/003.yaml
  text: After him arose Jair the Gileadite[a], and he judged Israel twenty-two years.
translation:
  language: te
  text: అతని తరువాత గిలాదీయుడైన యాయీరు వచ్చాడు; అతడు ఇశ్రాయేలుకు ఇరవై రెండు సంవత్సరాలు న్యాయాధిపతిగా ఉన్నాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “లేచాడు”; మునుపటి న్యాయాధిపతి తరువాత వచ్చినవాడని సూచించే వారసత్వ సూత్రం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם אַחֲרָיו
  choice: అతని తరువాత ... లేచి
  rationale: קום అనే క్రియతో కూడిన ఈ కథన వారసత్వ సూత్రాన్ని సహజమైన తెలుగులో ఉంచుతూ, మునుపటి న్యాయాధిపతి తరువాత యాయీరు రంగప్రవేశం చేశాడనే భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: יָאִיר
  choice: యాయీరు
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగులో సాధారణ బైబిలు లిప్యంతరీకరణకు అనుగుణంగా ఇచ్చాం.
- source_word: הַגִּלְעָדִי
  choice: గిలాదీయుడైన
  rationale: ఈ ప్రాంతసూచక విశేషణం యాయీరు గిలాదుకు చెందినవాడని లేదా దానితో అనుబంధమున్నవాడని తెలియజేస్తుంది; విశేషణ స్వరూపాన్ని తెలుగు సహజ వాక్యనిర్మాణంలో నిలిపింది.
- source_word: וַיִּשְׁפֹּט אֶת־יִשְׂרָאֵל
  choice: ఇశ్రాయేలుకు ... న్యాయాధిపతిగా ఉన్నాడు
  rationale: న్యాయాధిపతులు గ్రంథంలో שפט కేవలం న్యాయవిచారణకే పరిమితం కాక పాలనా-నాయకత్వ బాధ్యతను కూడా సూచిస్తుంది. ఆధునిక పాఠకునికి ఆ విస్తృత భావం స్పష్టమయ్యేలా, గ్రంథంలోని న్యాయాధిపతి పదసంబంధాన్ని నిలిపాం.
- source_word: עֶשְׂרִים וּשְׁתַּיִם שָׁנָה
  choice: ఇరవై రెండు సంవత్సరాలు
  rationale: హీబ్రూ సంఖ్యా ప్రయోగాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేసింది.
theological_decisions:
- issue: שפט అనే క్రియ యొక్క పరిధి
  choice: న్యాయాధిపతిగా ఉన్నాడు
  alternative: తీర్పు తీర్చాడు / పరిపాలించాడు
  rationale: ఇక్కడి పదం ఆధునిక న్యాయస్థాన కార్యానికి మాత్రమే పరిమితం కాదు; అలాగే ‘పరిపాలించాడు’ అని మాత్రమే అనడం న్యాయాధిపతులు గ్రంథంలోని పునరావృత పదబంధాన్ని కోల్పోయేలా చేస్తుంది. ఎంపిక చేసిన రూపం ఆ గ్రంథపరమైన నాయకత్వ పదవిని తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సంక్షిప్తమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని వారసత్వ సూత్రం మరియు న్యాయాధిపతి గ్రంథానికి ప్రత్యేకమైన పదజాలం సహజంగా నిలుపబడ్డాయి.
