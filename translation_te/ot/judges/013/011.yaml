id: JDG.13.11
reference: Judges 13:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּ֛קָם וַ/יֵּ֥לֶךְ מָנ֖וֹחַ אַחֲרֵ֣י אִשְׁתּ֑/וֹ וַ/יָּבֹא֙ אֶל הָ/אִ֔ישׁ וַ/יֹּ֣אמֶר ל֗/וֹ הַ/אַתָּ֥ה הָ/אִ֛ישׁ אֲשֶׁר דִּבַּ֥רְתָּ אֶל הָ/אִשָּׁ֖ה וַ/יֹּ֥אמֶר אָֽנִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/011.yaml
  text: So Manoah arose and went after his wife[a], and came to the man and said to him, “Are you the man who spoke to the woman?” And he said[c][b], “I am.”
translation:
  language: te
  text: అప్పుడు మనోహ లేచి తన భార్యను అనుసరించి[a] వెళ్లాడు. అతడు ఆ మనిషి దగ్గరకు వచ్చి, “ఆ స్త్రీతో[b] మాట్లాడిన మనిషివి నువ్వేనా?” అని అడిగాడు. అతడు, “నేనే[c]” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తన భార్య వెనుక.” హీబ్రూలో అక్షరార్థంగా “తన భార్య వెనుక/తర్వాత” అని ఉంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో “నా భార్య” అని కాకుండా “ఆ స్త్రీ” అని ఉంది.
    reason: lexical_alternative
  - marker: c
    text: లేదా, “నేను.” హీబ్రూ సమాధానంలో క్రియ లేకుండా కేవలం “నేను” అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם וַיֵּלֶךְ
  choice: లేచి … వెళ్లాడు
  rationale: హీబ్రూ కథనంలోని వరుస క్రియలను సహజమైన ఆధునిక తెలుగు కథన శైలిలో వ్యక్తపరుస్తుంది; నడిచిన విధానాన్ని అనవసరంగా నిర్దిష్టం చేయదు.
- source_word: אַחֲרֵי אִשְׁתּוֹ
  choice: తన భార్య వెంట
  rationale: אַחֲרֵי అనే పదంలోని ‘వెనుక/తర్వాత’ భావాన్ని సందర్భానుసారంగా సహజమైన తెలుగులో ‘వెంట’ అని అందిస్తుంది; ఆమెను అనుసరించి వెళ్లాడనే భావం నిలుస్తుంది.
- source_word: וַיָּבֹא אֶל הָאִישׁ
  choice: ఆ మనిషి దగ్గరకు వచ్చి
  rationale: בוא אֶל నిర్మాణంలోని ‘దగ్గరకు వచ్చాడు’ అనే దిశార్థాన్ని కాపాడుతుంది; ఈ దశలో వచనం అతణ్ణి ‘మనిషి’గానే పేర్కొంటుంది.
- source_word: הַאַתָּה הָאִישׁ
  choice: మనిషివి నువ్వేనా?
  rationale: ప్రశ్నార్థక ఉపసర్గతో కూడిన సర్వనామానికి ఉన్న గుర్తింపు-ప్రాధాన్యాన్ని సహజమైన తెలుగు ప్రశ్నగా వ్యక్తపరుస్తుంది.
- source_word: אֲשֶׁר דִּבַּרְתָּ אֶל הָאִשָּׁה
  choice: ఆ స్త్రీతో మాట్లాడిన
  rationale: సంబంధ వాక్యాన్ని నేరుగా అందిస్తూ, మూలంలోని ‘ఆ స్త్రీ’ అనే పదప్రయోగాన్ని ‘నా భార్య’గా మార్చకుండా ఉంచుతుంది.
- source_word: אָנִי
  choice: నేనే
  rationale: క్రియలేని హీబ్రూ సమాధానం అక్షరార్థంగా ‘నేను’; ప్రశ్నకు ధృవీకరణగా ఆధునిక తెలుగులో ‘నేనే’ సహజంగా, సంక్షిప్తంగా ఉంటుంది.
theological_decisions:
- issue: సందర్శకుని గుర్తింపు
  choice: הָאִישׁ ను ‘ఆ మనిషి’గా అనువదించడం
  alternative: ‘దూత’ లేదా ‘యెహోవా దూత’
  rationale: విస్తృత సందర్భంలో అతడు యెహోవా దూతగా వెల్లడైనా, ఈ వచనం సాధారణ నామవాచకమైన אִישׁ (‘మనిషి’)నే వాడుతుంది. ‘ఆ మనిషి’ అనే అనువాదం కథనంలో గుర్తింపు క్రమంగా వెల్లడయ్యే విధానాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘ఆ మనిషి,’ ‘ఆ స్త్రీ’ అనే మూలపాఠపు సూచనలను నిలిపి, సందర్శకుని గుర్తింపును ముందుగానే వివరించలేదు. ప్రతి పాదటిప్పణి సూచిక ప్రధాన పాఠ్యంలో సంబంధిత పదబంధం వెంట ఉంచబడింది.
