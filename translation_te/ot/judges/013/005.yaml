  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּי֩ הִנָּ֨/ךְ הָרָ֜ה וְ/יֹלַ֣דְתְּ בֵּ֗ן וּ/מוֹרָה֙ לֹא יַעֲלֶ֣ה עַל רֹאשׁ֔/וֹ כִּֽי נְזִ֧יר אֱלֹהִ֛ים יִהְיֶ֥ה הַ/נַּ֖עַר מִן הַ/בָּ֑טֶן וְ/ה֗וּא יָחֵ֛ל לְ/הוֹשִׁ֥יעַ אֶת יִשְׂרָאֵ֖ל מִ/יַּ֥ד פְּלִשְׁתִּֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/005.yaml
  text: For behold[a], you are pregnant and will bear a son. No razor shall come upon his head, for the boy shall be a Nazirite of God from the womb, and he will begin to save Israel from the hand of the Philistines.
translation:
  language: te
  text: ఎందుకంటే ఇదిగో, నీవు గర్భవతివై ఉన్నావు; ఒక కుమారుణ్ణి కంటావు. అతని తలమీదికి క్షౌరకత్తి రాకూడదు. ఆ బాలుడు తల్లి గర్భం నుంచే దేవుని నాజీరుగా ఉంటాడు; అతడు ఫిలిష్తీయుల చేతిలోనుండి ఇశ్రాయేలును రక్షించడం[a] మొదలుపెడతాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘విడిపించడం.’ హీబ్రూ క్రియ సందర్భాన్ని బట్టి ‘రక్షించు’ లేదా ‘విడిపించు’ అని అర్థం ఇవ్వగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנָּךְ
  choice: ఇదిగో
  rationale: గంభీరమైన ప్రకటనవైపు శ్రద్ధను మళ్లించే సూచనార్థక పదబలాన్ని సహజమైన తెలుగు బైబిలు శైలిలో నిలుపుతుంది.
- source_word: הָרָה
  choice: నీవు గర్భవతివై ఉన్నావు
  rationale: ఇది భవిష్యత్తులో గర్భం ధరించడాన్ని తెలిపే క్రియ కాదు; ప్రస్తుతం ఉన్న స్థితిని తెలిపే విధేయ విశేషణం.
- source_word: וְיֹלַדְתְּ בֵּן
  choice: ఒక కుమారుణ్ణి కంటావు
  rationale: ప్రకటన సందర్భంలోని భవిష్యత్ భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: מוֹרָה
  choice: క్షౌరకత్తి
  rationale: నాజీరు నియమ సందర్భంలో జుట్టు కత్తిరించడానికి వాడే కత్తిని స్పష్టంగా సూచిస్తుంది.
- source_word: לֹא יַעֲלֶה עַל רֹאשׁוֹ
  choice: అతని తలమీదికి ... రాకూడదు
  rationale: ‘తలమీదికి రాదు/రాకూడదు’ అనే హీబ్రూ రూపకాన్ని అర్థవంతమైన తెలుగులో నిలుపుతూ నిషేధ భావాన్ని తెలియజేస్తుంది.
- source_word: נְזִיר אֱלֹהִים
  choice: దేవుని నాజీరుగా
  rationale: సాధారణంగా ‘ప్రతిష్ఠించబడినవాడు’ అని విస్తరించకుండా, ప్రత్యేకమైన నాజీరు స్థితిని సూచించే సాంకేతిక పదాన్ని నిలుపుతుంది.
- source_word: הַנַּעַר
  choice: ఆ బాలుడు
  rationale: వాగ్దానం చేయబడిన మగ శిశువును సందర్భానుకూలంగా సూచిస్తుంది.
- source_word: מִן הַבָּטֶן
  choice: గర్భంలో నుండే
  rationale: అతని ప్రతిష్ఠ పుట్టిన తరువాత మొదలవుతుందని కాకుండా గర్భస్థితి నుండే ఉందనే స్పష్టమైన భావాన్ని కాపాడుతుంది.
- source_word: יָחֵל
  choice: మొదలుపెడతాడు
  rationale: సమ్సోను ఇశ్రాయేలు విమోచనను పూర్తిచేస్తాడని కాకుండా దానిని ఆరంభిస్తాడనే కథనపరమైన పరిమితిని నిలుపుతుంది.
- source_word: לְהוֹשִׁיעַ
  choice: రక్షించడం
  rationale: ‘రక్షించు’ లేదా ‘విడిపించు’ అనే రెండూ సందర్భానుకూల అర్థాలు; ప్రధాన పాఠ్యంలో సహజమైన ‘రక్షించడం’ ఎంచుకుని ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: מִיַּד פְּלִשְׁתִּים
  choice: ఫిలిష్తీయుల చేతిలోనుండి
  rationale: వారి అధికారం లేదా అణచివేతను సూచించే ‘చేతిలోనుండి’ అనే హీబ్రూ దృశ్యరూపాన్ని నిలుపుతుంది.
theological_decisions:
- issue: సమ్సోను ప్రతిష్ఠ స్వభావం
  choice: గర్భంలో నుండే దేవుని నాజీరుగా
  alternative: పుట్టినప్పటి నుండే దేవునికి ప్రతిష్ఠించబడినవాడుగా
  rationale: మూలంలో ప్రత్యేకమైన נְזִיר అనే పదం ఉంది. అందువల్ల దానిని సాధారణ ప్రతిష్ఠగా మార్చకుండా, గర్భస్థితి నుండే ఉన్న నాజీరు స్థితిగా అనువదించాం.
- issue: ఇశ్రాయేలు రక్షణలో సమ్సోను పాత్ర పరిధి
  choice: రక్షించడం మొదలుపెడతాడు
  alternative: ఇశ్రాయేలును రక్షిస్తాడు
  rationale: יָחֵל ఆరంభాన్ని స్పష్టంగా సూచిస్తుంది. ‘రక్షిస్తాడు’ అని మాత్రమే అనడం సమ్సోను పాత్రను మూలపాఠం కంటే ఎక్కువగా చూపి, అతడు విమోచనను ప్రారంభిస్తాడనే కథన ఉద్వేగాన్ని తొలగిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే సహజమైన, గౌరవప్రదమైన శైలి. ‘నాజీరు’ వంటి మూలంలోని సాంకేతిక ధార్మిక పదాన్ని వివరణాత్మక సాధారణీకరణ లేకుండా నిలిపాం.
