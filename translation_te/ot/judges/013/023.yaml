id: JDG.13.23
reference: Judges 13:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/תֹּ֧אמֶר ל֣/וֹ אִשְׁתּ֗/וֹ לוּ֩ חָפֵ֨ץ יְהוָ֤ה לַ/הֲמִיתֵ֨/נוּ֙ לֹֽא לָקַ֤ח מִ/יָּדֵ֨/נוּ֙ עֹלָ֣ה וּ/מִנְחָ֔ה וְ/לֹ֥א הֶרְאָ֖/נוּ אֶת כָּל אֵ֑לֶּה וְ/כָ/עֵ֕ת לֹ֥א הִשְׁמִיעָ֖/נוּ כָּ/זֹֽאת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/023.yaml
  text: But his wife said to him, “If the LORD had intended to kill us, he would not have accepted from our hand a burnt offering and a grain offering, or shown us all these things, or now announced to us such a thing as this.”
translation:
  language: te
  text: 'అయితే అతని భార్య అతనితో ఇలా అంది: “యెహోవా మనలను చంపాలని కోరుకుని ఉంటే, మన చేతిలోనుండి దహనబలినీ నైవేద్యాన్నీ స్వీకరించేవాడు కాదు; ఈ సంగతులన్నిటినీ మనకు చూపించేవాడు కాదు; ఇప్పుడు ఇలాంటి సంగతి మనకు తెలియజేసేవాడు కూడా కాదు.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חָפֵץ
  choice: కోరుకుని ఉంటే
  rationale: ఈ క్రియ ‘ఇష్టపడు, కోరుకొను, సంకల్పించు’ అనే భావాన్ని ఇస్తుంది. సందర్భంలో ఉద్దేశపూర్వక సంకల్పాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: לָקַח מִיָּדֵנוּ
  choice: మన చేతిలోనుండి ... స్వీకరించేవాడు
  rationale: మూలంలోని ‘మన చేతినుండి తీసుకొను’ అనే రూపకాన్ని నిలుపుతూ, బలిని దేవుడు అంగీకరించాడనే సందర్భార్థాన్ని ‘స్వీకరించు’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: עֹלָה וּמִנְחָה
  choice: దహనబలినీ నైవేద్యాన్నీ
  rationale: עֹלָה పూర్తిగా దహించబడే బలి; מִנְחָה ఈ సందర్భంలో అర్పణ/నైవేద్యం. సాధారణ బైబిలు తెలుగు పదజాలాన్ని ఉపయోగించాం.
- source_word: הִשְׁמִיעָנוּ
  choice: మనకు తెలియజేసేవాడు
  rationale: హిఫిల్ రూపం అక్షరార్థంగా ‘వినిపించు’; ఇక్కడ దేవదూత ద్వారా సమాచారం ప్రకటించబడినందున సహజ తెలుగులో ‘తెలియజేయు’ సరిపోతుంది.
- source_word: כָּזֹאת
  choice: ఇలాంటి సంగతి
  rationale: ఏకవచన సూచనాత్మక రూపాన్ని నిలుపుతుంది; ముందుగా ప్రకటించబడిన కుమారుని జననం మరియు సంబంధిత సూచనలను సమగ్రంగా సూచిస్తుంది.
theological_decisions:
- issue: దైవనామం יהוה అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: హెబ్రీ వ్యక్తినామాన్ని తెలుగులో ప్రత్యక్షంగా సూచించడం ద్వారా יהוה మరియు సాధారణ ‘ప్రభువు’ అనే బిరుదు మధ్య తేడాను నిలుపుతుంది.
- issue: బలి స్వీకరణ యొక్క భావం
  choice: స్వీకరించేవాడు కాదు
  alternative: తీసుకునేవాడు కాదు
  rationale: దేవుడు బలిని అంగీకరించాడనే మనోవా భార్య తర్కాన్ని స్పష్టపరుస్తుంది; అయితే ఆమె మాటను నిరపేక్ష సిద్ధాంత ప్రకటనగా విస్తరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన కథనశైలి. హెబ్రీ వాక్యంలోని మూడు సమాంతర నిరాకరణలను ‘...కాదు’ రూపంలో నిలిపి, భార్య చేసిన తర్కబద్ధమైన ధైర్యపరచడాన్ని స్పష్టంగా వ్యక్తం చేశాం.
