source:
  edition: WLC
  text: וַ/יֹּסִ֨פוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל לַ/עֲשׂ֥וֹת הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה וַ/יִּתְּנֵ֧/ם יְהוָ֛ה בְּ/יַד פְּלִשְׁתִּ֖ים אַרְבָּעִ֥ים שָׁנָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/001.yaml
  text: And the sons of Israel again did what was evil in the eyes of Yahweh[b][a], and Yahweh gave them into the hand of the Philistines for forty years.
translation:
  language: te
  text: ఇశ్రాయేలీయులు[a] మళ్లీ యాహ్వే దృష్టిలో చెడు చేశారు. యాహ్వే వారిని నలభై సంవత్సరాలపాటు ఫిలిష్తీయుల చేతికి[b] అప్పగించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులు’; ఇది ఇశ్రాయేలు ప్రజలందరినీ సూచించే సామూహిక నామం.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా ‘ఫిలిష్తీయుల చేతిలోకి’; అంటే వారి అధికారానికి లేదా ఆధీనానికి.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּסִפוּ
  choice: మళ్లీ ... చేశారు
  rationale: יסף అనే క్రియ అనంతర క్రియారూపంతో కలిసి గతంలో చేసిన కార్యాన్ని తిరిగి చేయడాన్ని లేదా కొనసాగించడాన్ని సూచిస్తుంది. న్యాయాధిపతులు గ్రంథంలోని పునరావృత చక్రానికి ఇక్కడ ‘మళ్లీ’ సహజంగా సరిపోతుంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులు
  rationale: హీబ్రూ పదబంధం అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులు’; అయితే ఇది పురుషులను మాత్రమే కాక ఇశ్రాయేలు ప్రజలందరినీ సూచించే సామూహిక నామం. ఆధునిక తెలుగులో ‘ఇశ్రాయేలీయులు’ ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: לַעֲשׂוֹת הָרַע
  choice: చెడ్డది చేశారు
  rationale: న్యాయాధిపతులు గ్రంథంలో తరచుగా వచ్చే ఈ ప్రయోగం నైతికంగా చెడ్డదైన కార్యాన్ని చేయడాన్ని సూచిస్తుంది. ‘చెడ్డది చేశారు’ సంక్షిప్తంగా, సహజంగా ఉంది.
- source_word: בְּעֵינֵי יְהוָה
  choice: యాహ్వే దృష్టిలో
  rationale: అక్షరార్థమైన ‘యాహ్వే కళ్లలో’ అనే హీబ్రూ రూపకానికి తెలుగులో సహజ సమానార్థక ప్రయోగం ‘యాహ్వే దృష్టిలో’; ఇది యాహ్వే చేసిన నైతిక మదింపును తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవిక నామమైన చతురక్షర నామం YHWHను బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పండితీయ ఉచ్చారణ ‘Yahweh’కు తెలుగు లిప్యంతరీకరణగా ‘యాహ్వే’ వాడబడింది.
- source_word: וַיִּתְּנֵם
  choice: వారిని ... అప్పగించాడు
  rationale: נתן + ‘చేతిలో/చేతికి’ అనే నిర్మాణం మరొకరి అధికారానికి అప్పగించడాన్ని సూచిస్తుంది. ‘అప్పగించాడు’ తెలుగులో ఆ భావాన్ని స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בְּיַד פְּלִשְׁתִּים
  choice: ఫిలిష్తీయుల చేతికి
  rationale: హీబ్రూ ‘చేతిలోకి’ అనే అధికార రూపకాన్ని తెలుగు ‘చేతికి అప్పగించాడు’ సహజంగా నిలుపుతుంది; ఇక్కడ ‘చేతి’ వారి అధికారం లేదా ఆధీనాన్ని సూచిస్తుంది.
- source_word: פְּלִשְׁתִּים
  choice: ఫిలిష్తీయులు
  rationale: ఈ ప్రజావర్గానికి తెలుగులో స్థిరపడ్డ రూపం.
- source_word: אַרְבָּעִים שָׁנָה
  choice: నలభై సంవత్సరాలపాటు
  rationale: హీబ్రూలోని కాలవ్యవధిని తెలుగులో ‘-పాటు’ సహజంగా స్పష్టం చేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే నిబంధన నామాన్ని అనువదించడం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠం బిరుదును కాక దేవుని ప్రత్యేక నామమైన יהוהను వాడుతోంది. అందువల్ల వ్యక్తిగత నామాన్ని నిలుపుతూ ‘యాహ్వే’ అని లిప్యంతరీకరించబడింది.
- issue: בְּנֵי יִשְׂרָאֵל అనే సామూహిక సంబోధన
  choice: ఇశ్రాయేలీయులు
  alternative: ఇశ్రాయేలు కుమారులు; ఇశ్రాయేలు ప్రజలు
  rationale: అక్షరార్థ రూపం పుంలింగ బహువచనమైనా, సందర్భంలో అది దేశ ప్రజలందరినీ సూచించే సామూహిక నామం. ‘ఇశ్రాయేలీయులు’ లింగాన్ని అనవసరంగా పరిమితం చేయకుండా మూలార్థాన్ని అందిస్తుంది; అక్షరార్థ రూపం పాదసూచికలో ఇవ్వబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘మళ్లీ’ న్యాయాధిపతులు గ్రంథంలోని పునరావృత అపరాధ చక్రాన్ని తెలియజేస్తుంది. ‘చేతికి అప్పగించాడు’ అనే తెలుగు ప్రయోగం హీబ్రూ అధికార రూపకాన్ని సహజంగా నిలుపుతుంది.
