  terminology: “యాహ్వే,” “ఇశ్రాయేలీయులు,” and “ఫిలిష్తీయులు” are suitable and consistent. The footnotes appropriately preserve the corporate force of “sons of Israel” and explain the hand/power idiom.
  issues:
