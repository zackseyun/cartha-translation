    issue: “అందువల్ల” adds a causal inference.
    rationale: 'The Hebrew waw-consecutive simply advances the narrative: ‘and Yahweh gave them…’; it does not explicitly say ‘therefore.’ Telugu should retain coordination without adding this discourse relation.'
  - severity: low
    issue: “చెడ్డది చేశారు” is less idiomatic than “చెడు చేశారు.”
    rationale: The latter is more natural modern Telugu for the recurring Judges formula and faithfully conveys ‘did evil.’
