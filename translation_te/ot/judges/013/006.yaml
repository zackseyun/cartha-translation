source:
  edition: WLC
  text: וַ/תָּבֹ֣א הָ/אִשָּׁ֗ה וַ/תֹּ֣אמֶר לְ/אִישָׁ/הּ֮ לֵ/אמֹר֒ אִ֤ישׁ הָ/אֱלֹהִים֙ בָּ֣א אֵלַ֔/י וּ/מַרְאֵ֕/הוּ כְּ/מַרְאֵ֛ה מַלְאַ֥ךְ הָ/אֱלֹהִ֖ים נוֹרָ֣א מְאֹ֑ד וְ/לֹ֤א שְׁאִלְתִּ֨י/הוּ֙ אֵֽי מִ/זֶּ֣ה ה֔וּא וְ/אֶת שְׁמ֖/וֹ לֹֽא הִגִּ֥יד לִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/006.yaml
  text: Then the woman came and said to her husband[a], “A man of God came to me, and his appearance was like the appearance of an angel of God, very fearsome. I did not ask him where he was from[b], and he did not tell me his name.”
translation:
  language: te
  text: 'అప్పుడు ఆ స్త్రీ వచ్చి తన భర్తతో ఇలా చెప్పింది: “దేవుని మనిషి ఒకడు నా దగ్గరికి వచ్చాడు. అతని రూపం దేవుని దూత రూపంలా, ఎంతో భయానకంగా ఉంది.[a] అతడు ఎక్కడివాడో నేను అతనిని అడగలేదు; అతడు తన పేరు నాకు చెప్పలేదు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఎంతో విస్మయం కలిగించేదిగా” లేదా “చాలా భయంకరంగా.” హీబ్రూ పదం తీవ్రమైన భయాన్ని, విస్మయాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאִשָּׁה
  choice: ఆ స్త్రీ
  rationale: నిర్దిష్ట ఉపపదంతో ఉన్న ఈ పదం కథలో ఇప్పటికే ప్రస్తావనలో ఉన్న మనోహ భార్యను సూచిస్తుంది; హీబ్రూ వ్యక్తీకరణను సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: לְאִישָׁהּ
  choice: తన భర్తతో
  rationale: వివాహ సందర్భంలో אִישָׁהּ సహజంగా ‘ఆమె భర్త’ అని అర్థమవుతుంది; తెలుగులో కర్తను అనుసరించి ‘తన భర్తతో’ సహజం.
- source_word: אִישׁ הָאֱלֹהִים
  choice: దేవుని మనిషి ఒకడు
  rationale: ‘దేవుని మనిషి’ అనే హీబ్రూ బిరుదును నిలుపుతూ, אִישׁ‌కు నిర్దిష్ట ఉపపదం లేకపోవడాన్ని ‘ఒకడు’ ద్వారా తెలియజేస్తుంది.
- source_word: וּמַרְאֵהוּ כְּמַרְאֵה מַלְאַךְ הָאֱלֹהִים
  choice: అతని రూపం దేవుని దూత రూపంలా ఉంది
  rationale: మַרְאֶה పద పునరుక్తిని ‘రూపం…రూపంలా’ అని నిలుపుతుంది. מַלְאַךְ הָאֱלֹהִיםలో మַלְאַךְ‌కు ఉపపదం లేకపోవడంతో పోలికను అతిగా నిర్దిష్టం చేయకుండా ‘దేవుని దూత’గా అనువదించింది.
- source_word: נוֹרָא מְאֹד
  choice: ఎంతో భయభక్తులు పుట్టించేదిగా
  rationale: נוֹרָאలోని తీవ్రమైన భయం మరియు విస్మయం రెండింటినీ ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; కేవలం భయంకరమైనదని పరిమితం చేయదు.
- source_word: אֵי מִזֶּה הוּא
  choice: అతడు ఎక్కడివాడో
  rationale: వ్యక్తి మూలస్థానాన్ని అడిగే హీబ్రూ నుడికారానికి సహజమైన తెలుగు సమానం.
- source_word: וְאֶת שְׁמוֹ לֹא הִגִּיד לִי
  choice: అతడు తన పేరు నాకు చెప్పలేదు
  rationale: సంభాషణాత్మక నివేదికలో הִגִּיד భావాన్ని సరళంగా, స్పష్టంగా అందిస్తుంది.
theological_decisions:
- issue: מַלְאַךְ הָאֱלֹהִיםను తరువాతి కథనం దృష్ట్యా నిర్దిష్ట దైవదూతగా గుర్తించాలా
  choice: దేవుని దూత
  alternative: ఆ దేవుని దూత; దేవుని సందేశవాహకుడు
  rationale: ఈ వాక్యంలో మַלְאַךְ‌కు నిర్దిష్ట ఉపపదం లేదు. అందువల్ల తరువాతి కథనంలోని గుర్తింపును ముందుగానే బలవంతంగా చేర్చకుండా, ‘దూత’ అనే పదంలో ఉన్న దైవిక సందేశవాహకుని భావాన్ని నిలుపుతుంది.
- issue: נוֹרָא מְאֹדలో భయం మరియు విస్మయం మధ్య ఉద్వేగం
  choice: ఎంతో భయభక్తులు పుట్టించేదిగా
  alternative: చాలా భయంకరంగా; అత్యంత విస్మయం కలిగించేదిగా
  rationale: మూలపదం భయాన్నీ గాఢమైన విస్మయాన్నీ సూచించగలదు. ఎంపిక చేసిన పదబంధం రెండింటినీ నిలుపుతూ రూపాన్ని కేవలం హానికరమైనదిగా చిత్రించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సరళమైనప్పటికీ గౌరవప్రదమైన కథన శైలి. మూలంలోని పునరుక్తి, అనిర్దిష్టత, భయం–విస్మయం భావ ఉద్వేగం సాధ్యమైనంతవరకు నిలుపబడ్డాయి.
