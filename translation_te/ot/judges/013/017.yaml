revisions:
- from: అప్పుడు మానోహ యెహోవా దూతతో[a], “నీ పేరు ఏమిటి? నీవు చెప్పిన మాటలు నెరవేరినప్పుడు మేము నిన్ను ఘనపరచడానికి మాకు తెలియజేయి” అని అన్నాడు.
  to: అప్పుడు మానోహ యెహోవా దూతతో[a], “నీ మాటలు నెరవేరినప్పుడు మేము నిన్ను గౌరవించేలా నీ పేరు ఏమిటి?” అని అడిగాడు.
  rationale: The revision removes the unsupported imperative, restores the source’s single question and its purpose/result relationship, and uses idiomatic modern Telugu. ‘దూత’ preserves the lexical and narrative ambiguity; the footnote supplies the ordinary alternative ‘సందేశవాహకుడు.’
