  revision_rationale: The revision removes the unsupported imperative, restores the source’s single question and its purpose/result relationship, and uses idiomatic modern Telugu. ‘దూత’ preserves the lexical and narrative ambiguity; the footnote supplies the ordinary alternative ‘సందేశవాహకుడు.’
