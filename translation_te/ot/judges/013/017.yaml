id: JDG.13.17
reference: Judges 13:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֧אמֶר מָנ֛וֹחַ אֶל מַלְאַ֥ךְ יְהוָ֖ה מִ֣י שְׁמֶ֑/ךָ כִּֽי יָבֹ֥א דברי/ך וְ/כִבַּדְנֽוּ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/017.yaml
  text: Then Manoah said to the angel of Yahweh[a], “What is your name, so that when your words come to pass, we may honor you?”
translation:
  language: te
  text: అప్పుడు మానోహ యెహోవా దూతతో[a], “నీ మాటలు నెరవేరినప్పుడు మేము నిన్ను గౌరవించేలా నీ పేరు ఏమిటి?” అని అడిగాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘యెహోవా సందేశవాహకుడు.’
    reason: מַלְאָךְ అనే హీబ్రూ పదానికి ‘దూత’తో పాటు సాధారణంగా ‘సందేశవాహకుడు’ అనే అర్థం కూడా ఉంటుంది.
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: యెహోవా దూత
  rationale: מַלְאַךְ అనే పదానికి ‘దూత’ లేదా సందర్భానుసారంగా ‘దేవదూత’ అనే అర్థాలు ఉండవచ్చు. ఈ కథనంలో అతడు అతీంద్రియ వ్యక్తిగా కనిపించినా, మూలపదంలోని ‘సందేశవాహకుడు’ అనే విస్తృత భావాన్ని తెలుగు ‘దూత’ సహజంగా నిలుపుతుంది. יְהוָהను వ్యక్తిగత దైవనామంగా ‘యెహోవా’ అని లిప్యంతరీకరించాం.
- source_word: מִי שְׁמֶךָ
  choice: నీ పేరు ఏమిటి?
  rationale: హీబ్రూ వాక్యనిర్మాణం అక్షరార్థంగా ‘నీ పేరు ఎవరు?’ అన్నట్లున్నా, పేరును అడిగే సహజమైన ఆధునిక తెలుగు రూపం ‘నీ పేరు ఏమిటి?’
- source_word: כִּי
  choice: '...నప్పుడు ...డానికి'
  rationale: ఇక్కడ כִּי తరువాతి నెరవేర్పును దృష్టిలో ఉంచుకొని పేరు అడగడానికి గల ఉద్దేశాన్ని తెలియజేస్తుంది. తెలుగులో కాలార్థక ‘నప్పుడు’తో పాటు ఉద్దేశార్థక ‘డానికి’ వాడటం సంబంధాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: יָבֹא דבריך
  choice: నీవు చెప్పిన మాటలు నెరవేరినప్పుడు
  rationale: దְבָרֶיךָ రూపం బహువచనం; ‘మాటలు’ దానిని నిలుపుతుంది. ‘వచ్చినప్పుడు’ అనే అక్షరార్థం కంటే ప్రవచించిన విషయం నిజమవడాన్ని సూచించే ‘నెరవేరినప్పుడు’ తెలుగులో స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: וְכִבַּדְנוּךָ
  choice: మేము నిన్ను ఘనపరచడానికి
  rationale: పియేల్ כבד ఇక్కడ గౌరవించడం, ఘనపరచడం అనే భావం ఇస్తుంది. ‘మహిమపరచడం’ అనవసరమైన బలమైన దైవశాస్త్రీయ భావాన్ని కలిగించవచ్చు; ‘ఘనపరచడం’ తగిన గౌరవాన్ని సూచిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో చతురక్షర దైవనామం ప్రత్యక్షంగా ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుతో మార్చకుండా పేరుగానే ఉంచాం; ఆధునిక తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం.
- issue: מַלְאַךְను ‘దూత’గా లేదా ‘దేవదూత’గా అనువదించడం
  choice: దూత
  alternative: దేవదూత
  rationale: కథన సందర్భం అతీంద్రియ స్వరూపాన్ని సూచించినప్పటికీ, ‘దూత’ మూలపదంలోని సందేశవాహకుని భావాన్ని కాపాడి, గుర్తింపుపై కథనంలో ఉన్న ఉద్వేగాన్ని ముందుగానే పూర్తిగా పరిష్కరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన కథన శైలిని వాడాం. మూలంలోని బహువచన ‘మాటలు’ను నిలిపి, నెరవేర్పు మరియు తదనంతర గౌరవం మధ్య సంబంధాన్ని సహజమైన తెలుగు వాక్యనిర్మాణంతో తెలిపాం.
