id: JDG.13.4
reference: Judges 13:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/עַתָּה֙ הִשָּׁ֣מְרִי נָ֔א וְ/אַל תִּשְׁתִּ֖י יַ֣יִן וְ/שֵׁכָ֑ר וְ/אַל תֹּאכְלִ֖י כָּל טָמֵֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/004.yaml
  text: Now please be careful[a], and do not drink wine or strong drink[c][b], and do not eat anything unclean.
translation:
  language: te
  text: ఇప్పుడు దయచేసి జాగ్రత్తగా ఉండు[a]; ద్రాక్షామద్యం గానీ మత్తుపానీయం గానీ[b] తాగకు, అపవిత్రమైనదేదీ తినకు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఇప్పుడు నిన్ను నీవు కాపాడుకో’ లేదా ‘ఇప్పుడు అప్రమత్తంగా ఉండు.’
    reason: lexical_alternative
  - marker: b
    text: ‘మత్తుపానీయం’ అంటే ద్రాక్షామద్యం కాకుండా మత్తు కలిగించే ఇతర పానీయాలు.
    reason: cultural_note
lexical_decisions:
- source_word: וְעַתָּה
  choice: ఇప్పుడు
  rationale: తదుపరి ఆదేశాన్ని పరిచయం చేసే కాల/ప్రసంగ సూచకం. తెలుగు వాక్యశైలిలో ‘ఇప్పుడు’ సహజంగా ఉంది; ఆరంభంలోని וְ ను ప్రత్యేకంగా ‘మరియు’ అని అనువదించాల్సిన అవసరం లేదు.
- source_word: הִשָּׁמְרִי נָא
  choice: దయచేసి జాగ్రత్తగా ఉండు
  rationale: నిఫల్ ఆజ్ఞారూపం తనను తాను కాపాడుకుంటూ అప్రమత్తంగా ఉండడాన్ని సూచిస్తుంది; נָא లోని వినయపూర్వక అభ్యర్థన భావాన్ని ‘దయచేసి’ వ్యక్తం చేస్తుంది.
- source_word: וְאַל תִּשְׁתִּי
  choice: తాగకు
  rationale: స్త్రీని నేరుగా ఉద్దేశించిన నిషేధార్థక ఆజ్ఞ. ఆధునిక తెలుగులో ఏకవచన స్త్రీలింగాన్ని సందర్భం తెలియజేస్తుంది.
- source_word: יַיִן
  choice: ద్రాక్షారసం
  rationale: ద్రాక్షతో చేసిన మద్యాన్ని సూచించే పదం; సందర్భంలోని మత్తుపానీయ నిషేధాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: וְשֵׁכָר
  choice: మత్తుపానీయం
  rationale: ద్రాక్షారసం కాక ఇతర మత్తు కలిగించే పానీయాలకు విస్తృత పదం. ‘బీరు’ అనడం అనవసరంగా అర్థాన్ని కుదిస్తుంది.
- source_word: וְאַל תֹּאכְלִי
  choice: తినకు
  rationale: మొదటి నిషేధంతో సమన్వయించబడిన రెండవ నిషేధార్థక ఆజ్ఞ.
- source_word: כָּל טָמֵא
  choice: అపవిత్రమైనదేదీ
  rationale: כָּל తో నామవాచకంగా వాడిన విశేషణం ‘అపవిత్రమైన ఏదైనా’ అనే భావం ఇస్తుంది. ఇది కేవలం పరిశుభ్రతకు సంబంధించినది కాక ఆచారపరమైన వర్గాన్ని నిలుపుతుంది.
theological_decisions:
- issue: ఈ సందర్భంలో טָמֵא స్వభావం
  choice: అపవిత్రమైనది
  alternative: అశుద్ధమైనది
  rationale: ఈ ఆదేశం నాజీరు సంబంధిత సందర్భంలో ఉంది. ‘అపవిత్రమైనది’ తోరాలోని ఆచార/నిబంధన వర్గాన్ని నిలుపుతుంది; దాన్ని కేవలం ఆరోగ్య లేదా నైతిక అశుభ్రతగా పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన నేర సంబోధన వాడబడింది. హీబ్రూలో స్త్రీని ఉద్దేశించిన ఏకవచన ఆజ్ఞారూపం తెలుగులో సందర్భం ద్వారా స్పష్టమవుతుంది. సమన్వయాన్ని సహజంగా చూపేందుకు చిన్న వాక్య విరామం మరియు అర్ధవిరామం వాడబడ్డాయి.
