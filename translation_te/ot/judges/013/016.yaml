  text: וַ/יֹּאמֶר֩ מַלְאַ֨ךְ יְהוָ֜ה אֶל מָנ֗וֹחַ אִם תַּעְצְרֵ֨/נִי֙ לֹא אֹכַ֣ל בְּ/לַחְמֶ֔/ךָ וְ/אִם תַּעֲשֶׂ֣ה עֹלָ֔ה לַ/יהוָ֖ה תַּעֲלֶ֑/נָּה כִּ֚י לֹא יָדַ֣ע מָנ֔וֹחַ כִּֽי מַלְאַ֥ךְ יְהוָ֖ה הֽוּא־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/016.yaml
  text: And the angel of Yahweh said to Manoah[a], “If you detain me, I will not eat your food. But if you prepare a burnt offering[b], offer it up to Yahweh.” For Manoah did not know that he was the angel of Yahweh.
translation:
  language: te
  text: 'యాహ్వే దూత మనోహతో ఇలా అన్నాడు: “నీవు నన్ను నిలిపి ఉంచినా, నేను నీ ఆహారం[a] తినను. అయితే నీవు దహనబలిని సిద్ధం చేస్తే[b], దాన్ని యాహ్వేకు అర్పించు.” ఎందుకంటే అతడు యాహ్వే దూత అని మనోహకు తెలియదు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “నీ రొట్టె.” ఇక్కడ “రొట్టె” సాధారణంగా ఆహారం లేదా భోజనం మొత్తాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “నీవు దహనబలిని చేస్తే, దాన్ని యాహ్వేకు అర్పించు.” హీబ్రూ పాఠం బలిని చేయడం లేదా సిద్ధం చేయడానికి ఒక క్రియను, దాన్ని అర్పించడానికి మరో క్రియను ఉపయోగిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: యాహ్వే దూత
  rationale: מַלְאַךְ అనే పదానికి ‘సందేశకుడు’ లేదా ‘దూత’ అనే అర్థాలు ఉండవచ్చు; ఈ కథనంలో అతడు మానవాతీత దైవదూతగా చిత్రించబడుతున్నందున ‘యాహ్వే దూత’ సహజంగా, సందర్భానికి తగినట్లుగా ఉంది.
- source_word: תַּעְצְרֵנִי
  choice: నన్ను ఇక్కడే ఉండమని ఆపినా
  rationale: עצר ఇక్కడ నిలిపి ఉంచడం లేదా వెళ్లకుండా ఆపడం అనే భావాన్ని ఇస్తుంది. మనోహ ఆహారం సిద్ధం చేసేంతవరకు అతిథిని ఉండమని కోరిన సందర్భాన్ని ఈ రూపం సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: לֹא אֹכַל בְּלַחְמֶךָ
  choice: నేను నీ ఆహారం తినను
  rationale: לֶחֶם అక్షరార్థంగా ‘రొట్టె’ అయినా, ఇక్కడ సాధారణంగా భోజనం లేదా ఆహారాన్ని సూచిస్తుంది. అందువల్ల ‘ఆహారం’ సందర్భార్థాన్ని స్పష్టంగా అందిస్తుంది; అక్షరార్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: תַּעֲשֶׂה עֹלָה
  choice: దహనబలిని సిద్ధం చేస్తే
  rationale: బలి సందర్భంలో עשה సిద్ధం చేయడం అనే భావాన్ని ఇవ్వగలదు. తరువాతి תַּעֲלֶנָּה బలిని అర్పించే చర్యను ప్రత్యేకంగా పేర్కొంటుంది కాబట్టి, రెండు క్రియల భేదాన్ని నిలిపేందుకు ‘సిద్ధం చేస్తే’ ఎంచుకున్నాం.
- source_word: עֹלָה
  choice: దహనబలి
  rationale: పూర్తిగా అగ్నిలో దహనం చేసి పైకి పొగగా ఎగసే బలిని సూచించే స్థిరమైన బైబిలు పదంగా ‘దహనబలి’ ఉపయోగించాం.
- source_word: לַיהוָה תַּעֲלֶנָּה
  choice: దాన్ని యాహ్వేకు అర్పించు
  rationale: עלה యొక్క హిఫీల్ రూపం దహనబలితో కలిసి వచ్చినప్పుడు బలిగా పైకి అర్పించడం అనే భావాన్ని ఇస్తుంది. సహజమైన తెలుగులో ‘అర్పించు’ ఆ బలిసంబంధ భావాన్ని కాపాడుతుంది.
- source_word: כִּי לֹא יָדַע מָנוֹחַ
  choice: ఎందుకంటే ... మనోహకు తెలియదు
  rationale: כִּי ఇక్కడ ముందున్న సంభాషణకు కథకుడు ఇచ్చే వివరణను పరిచయం చేస్తుంది. ‘ఎందుకంటే’ ఆ వివరణాత్మక సంబంధాన్ని తెలుగులో స్పష్టంగా చూపుతుంది.
- source_word: כִּי מַלְאַךְ יְהוָה הוּא
  choice: అతడు యాహ్వే దూత అని
  rationale: హీబ్రూ వాక్యం ఆ సందర్శకుని అసలు గుర్తింపును మనోహ ఇంకా గ్రహించలేదని చెబుతుంది. ‘అతడు ... అని’ మూలంలోని הוּא సర్వనామాన్ని సహజంగా ప్రతిబింబిస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన నాలుగు అక్షరాల పేరును బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ లిప్యంతరీకరణను తెలుగులో ‘యాహ్వే’గా ఇచ్చాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దానిని బిరుదుగా మార్చకుండా ‘యాహ్వే’ అని లిప్యంతరీకరించడం మూలంలోని పేరును నిలుపుతుంది.
- issue: מַלְאַךְ స్వరూపాన్ని సూచించే పదం
  choice: దూత
  alternative: సందేశకుడు
  rationale: מַלְאַךְ పదానికి రెండూ సాధ్యమైనప్పటికీ, ఈ కథనంలో ఆ వ్యక్తి యాహ్వేకు చెందిన మానవాతీత దూతగా వెల్లడవుతున్నాడు. ‘దూత’ ఈ సందర్భాన్ని వ్యక్తపరుస్తుంది; అతని స్వరూపం గురించి వచనం చెప్పేదానికంటే అదనంగా నిర్వచించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన కథనశైలిని ఉపయోగించాం. ‘యాహ్వే దూత,’ ‘దహనబలి’ వంటి ముఖ్య బైబిలు పదాలను స్థిరంగా ఉంచి, హీబ్రూలోని ‘సిద్ధం చేయడం/అర్పించడం’ అనే రెండు చర్యల భేదాన్ని కాపాడాం. పాదసూచిక గుర్తులు [a], [b] ప్రధాన పాఠంలో సంబంధిత పదాల వద్ద ఉన్నాయి.
