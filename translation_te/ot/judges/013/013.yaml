id: JDG.13.13
reference: Judges 13:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֛אמֶר מַלְאַ֥ךְ יְהוָ֖ה אֶל מָנ֑וֹחַ מִ/כֹּ֛ל אֲשֶׁר אָמַ֥רְתִּי אֶל הָ/אִשָּׁ֖ה תִּשָּׁמֵֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/013.yaml
  text: And the angel of Yahweh said to Manoah[a], “The woman must be careful to do everything that I said to her.”
translation:
  language: te
  text: 'యెహోవా దూత[a] మనోహతో ఇలా అన్నాడు: “నేను ఆ స్త్రీకి చెప్పిన ప్రతిదానిని ఆమె జాగ్రత్తగా పాటించాలి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యెహోవా దేవదూత.” హీబ్రూ పదానికి “దూత,” “దేవదూత” అనే రెండు అర్థాలూ రావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: ఇలా అన్నాడు
  rationale: హీబ్రూ కథన క్రమాన్ని సహజమైన ఆధునిక తెలుగు సంభాషణా పరిచయంతో వ్యక్తపరుస్తుంది.
- source_word: מַלְאַךְ יְהוָה
  choice: యెహోవా దూత
  rationale: מַלְאַךְ అనే పదానికి ‘దూత’ లేదా ‘దేవదూత’ అనే అర్థాలు రావచ్చు. ‘దూత’ మూలపదంలోని విస్తృతార్థాన్ని, వ్యక్తి స్వరూపం గురించిన ఉద్వేగాన్ని నిలుపుతుంది; యెహోవా అనే దైవనామాన్ని పేరుగానే ఉంచుతుంది.
- source_word: אֶל מָנוֹחַ
  choice: మనోహతో
  rationale: ‘మనోహతో అన్నాడు’ అనేది ‘మనోహకు/మనోహతో చెప్పాడు’ అనే దిశార్థాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: מִכֹּל אֲשֶׁר אָמַרְתִּי אֶל הָאִשָּׁה
  choice: నేను ఆ స్త్రీతో చెప్పినవన్నీ
  rationale: మూలంలోని ‘ఆ స్త్రీతో నేను చెప్పిన సమస్తం’ అనే సంపూర్ణ పరిధిని సంక్షిప్తంగా, సహజంగా నిలుపుతుంది; ‘ఆ స్త్రీ’ అనే స్పష్ట నామవాచకాన్ని తొలగించదు.
- source_word: תִּשָּׁמֵר
  choice: ఆమె జాగ్రత్తగా పాటించాలి
  rationale: నిఫాల్ రూపంలోని తనను తాను కాచుకోవడం/జాగ్రత్త వహించడం అనే భావాన్ని, ముందుగా ఇచ్చిన ఆదేశాలను ఆచరించాల్సిన సందర్భార్థంతో కలిపి తెలుగులో స్పష్టంగా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలంలో ఉన్న వ్యక్తిగత దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో స్థిరపడిన లిప్యంతరీకరణతో అందిస్తుంది.
- issue: מַלְאַךְ יְהוָה యొక్క స్వరూపార్థం
  choice: యెహోవా దూత
  alternative: యెహోవా దేవదూత
  rationale: ‘దూత’ అనే ఎంపిక మానవ దూత/పరలోక దూత అనే పదార్థ విస్తృతిని నిలుపుతుంది; ఈ సందర్భంలో పరలోక దూత భావం బలంగా ఉన్నప్పటికీ, అనువాదమే దానిని అవసరానికి మించి నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన కథన శైలి. ‘జాగ్రత్తగా పాటించాలి’ అనే ప్రయోగం కేవలం అప్రమత్తతనే కాక, ముందటి ఆదేశాలకు విధేయతను కూడా సహజంగా తెలియజేస్తుంది.
