source:
  edition: WLC
  text: מִ/כֹּ֣ל אֲשֶׁר יֵצֵא֩ מִ/גֶּ֨פֶן הַ/יַּ֜יִן לֹ֣א תֹאכַ֗ל וְ/יַ֤יִן וְ/שֵׁכָר֙ אַל תֵּ֔שְׁתְּ וְ/כָל טֻמְאָ֖ה אַל תֹּאכַ֑ל כֹּ֥ל אֲשֶׁר צִוִּיתִ֖י/הָ תִּשְׁמֹֽר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/014.yaml
  text: She must not eat anything that comes from the grapevine[a], and she must not drink wine or strong drink, and she must not eat anything unclean. She must keep all that I commanded her.
translation:
  language: te
  text: ద్రాక్షావల్లి నుంచి వచ్చేదేదీ ఆమె తినకూడదు[a]. ద్రాక్షమద్యంగానీ మత్తుపానీయంగానీ ఆమె తాగకూడదు; అపవిత్రమైనదేదీ తినకూడదు. నేను ఆమెకు ఆజ్ఞాపించినదంతా ఆమె పాటించాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ అక్షరార్థం: “ద్రాక్షమద్యపు తీగ నుంచి వచ్చేదంతా”; అంటే ద్రాక్షావల్లి నుంచి లభించే ఏ పదార్థమైనా.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִכֹּל אֲשֶׁר יֵצֵא מִגֶּפֶן הַיַּיִן
  choice: ద్రాక్షావల్లి నుంచి వచ్చేదేదీ
  rationale: యֵצֵא అనే క్రియలోని ‘నుంచి వచ్చేది’ అనే భావాన్ని, అలాగే ద్రాక్షావల్లి నుంచి లభించే సమస్త ఉత్పత్తులను కలుపుకొనే విస్తృత నిషేధాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: לֹא תֹאכַל
  choice: ఆమె తినకూడదు
  rationale: స్త్రీలింగ ఏకవచన కర్తను స్పష్టంగా ఉంచుతూ, నిషేధార్థాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: יַיִן
  choice: ద్రాక్షమద్యం
  rationale: ద్రాక్షతో చేసిన మద్యాన్ని స్పష్టంగా సూచిస్తుంది; సాధారణ ద్రాక్షరసం అనే అర్థంతో కలిగే అయోమయాన్ని నివారిస్తుంది.
- source_word: שֵׁכָר
  choice: మత్తుపానీయం
  rationale: ద్రాక్షమద్యానికి భిన్నమైన మత్తు కలిగించే పానీయాలను సూచించే విస్తృత పదంగా ఉంది; ఒక నిర్దిష్ట పానీయానికి పరిమితం చేయదు.
- source_word: אַל תֵּשְׁתְּ
  choice: ఆమె తాగకూడదు
  rationale: אַל తో ఉన్న నిషేధాన్ని ఆధునిక తెలుగులో సహజంగా అందిస్తుంది.
- source_word: כָל טֻמְאָה
  choice: అపవిత్రమైనదేదీ
  rationale: విస్తృతమైన అనిర్దిష్ట భావాన్ని నిలుపుతూ, తోరాలోని ఆచారపరమైన అపవిత్రత వర్గంతో ఉన్న సంబంధాన్ని కాపాడుతుంది.
- source_word: כֹּל אֲשֶׁר צִוִּיתִיהָ
  choice: నేను ఆమెకు ఆజ్ఞాపించినదంతా
  rationale: ముందుగా ఆమెకు ఇచ్చిన ఆజ్ఞలన్నిటినీ సమగ్రంగా సూచిస్తుంది.
- source_word: תִּשְׁמֹר
  choice: ఆమె పాటించాలి
  rationale: ఆజ్ఞలను జాగ్రత్తగా ఆచరించాలి అనే שׁמר భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: ద్రాక్షావల్లి ఉత్పత్తులపై నిషేధం ఎంత విస్తృతమైనది
  choice: ద్రాక్షావల్లి నుంచి వచ్చేదేదీ అని సమగ్రంగా అనువదించడం
  alternative: తినదగిన ద్రాక్షపండ్లు లేదా కొన్ని ద్రాక్ష ఉత్పత్తులకు మాత్రమే పరిమితం చేయడం
  rationale: ‘ద్రాక్షమద్యపు తీగ నుంచి వచ్చేదంతా’ అనే హీబ్రూ నిర్మాణం ఉద్దేశపూర్వకంగా విస్తృతంగా ఉంది. సందర్భంలోని ప్రతిష్ఠాపన నియమాలను గౌరవిస్తూ, తరువాతి సాంకేతిక పరిభాషను ప్రధాన పాఠ్యంలో చేర్చకుండా ఈ విస్తృతతను నిలిపింది.
- issue: טֻמְאָה యొక్క ఆచారపరమైన భావం
  choice: అపవిత్రమైనది
  alternative: అశుద్ధమైనది
  rationale: ‘అపవిత్రమైనది’ అనేది పరిశుద్ధత–అపవిత్రత అనే బైబిలీయ వర్గాన్ని నిలుపుతుంది; కేవలం భౌతిక మురికి లేదా పరిశుభ్రతలేమి అనే భావానికి పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు స్పష్టమైన శైలి. స్త్రీలింగ కర్తను ప్రతి ప్రధాన నిషేధంలో అవసరమైనంత స్పష్టంగా ఉంచి, పునరుక్తి భారాన్ని తగ్గించాం. ‘ద్రాక్షమద్యం’ మరియు ‘మత్తుపానీయం’ మధ్య మూలంలోని భేదాన్ని నిలిపాం.
