id: JDG.13.24
reference: Judges 13:24
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/תֵּ֤לֶד הָֽ/אִשָּׁה֙ בֵּ֔ן וַ/תִּקְרָ֥א אֶת שְׁמ֖/וֹ שִׁמְשׁ֑וֹן וַ/יִּגְדַּ֣ל הַ/נַּ֔עַר וַֽ/יְבָרְכֵ֖/הוּ יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/024.yaml
  text: And the woman bore a son and called his name Samson. And the boy grew, and Yahweh blessed him.
translation:
  language: te
  text: ఆ స్త్రీ ఒక కుమారుణ్ణి కని, అతనికి సమ్సోను అని పేరు పెట్టింది. ఆ బాలుడు పెరిగాడు; యాహ్వే అతన్ని ఆశీర్వదించాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֵּלֶד
  choice: కని
  rationale: ילד క్రియ ప్రసవాన్ని సూచిస్తుంది. తెలుగు కథనశైలిలో ‘ఒక కుమారుణ్ణి కని’ సహజంగా, సంక్షిప్తంగా ఉంది.
- source_word: הָאִשָּׁה
  choice: ఆ స్త్రీ
  rationale: హీబ్రూ వచనంలోని నిర్దిష్టమైన ‘ఆ స్త్రీ’ని నిలుపుతుంది; ఈ వచనంలో లేని ‘మనోహ భార్య’ అనే వివరణను చేర్చదు.
- source_word: בֵּן
  choice: ఒక కుమారుణ్ణి
  rationale: జనన సందర్భంలో בן అనేది మగబిడ్డను సూచిస్తుంది; ‘కుమారుడు’ ఆధునిక ప్రామాణిక తెలుగులో సహజమైన సమానార్థకం.
- source_word: וַתִּקְרָא אֶת־שְׁמוֹ
  choice: అతనికి ... అని పేరు పెట్టింది
  rationale: హీబ్రూ నామకరణ సూత్రంలోని భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: שִׁמְשׁוֹן
  choice: సమ్సోను
  rationale: హీబ్రూ వ్యక్తినామానికి సమీపమైన తెలుగు లిప్యంతరీకరణ; తెలుగు బైబిలు పాఠకులకు కూడా గుర్తుపట్టదగిన రూపం.
- source_word: וַיִּגְדַּל
  choice: పెరిగాడు
  rationale: ఈ సందర్భంలో גדל బాలుని ఎదుగుదలను సూచిస్తుంది; ‘గొప్పవాడయ్యాడు’ అనే అవసరానికి మించిన భావాన్ని నివారిస్తుంది.
- source_word: הַנַּעַר
  choice: ఆ బాలుడు
  rationale: נערకు వయస్సు పరంగా విస్తృత అర్థపరిధి ఉన్నప్పటికీ, జననానంతర ఎదుగుదల సందర్భంలో ‘బాలుడు’ తగినది.
- source_word: וַיְבָרְכֵהוּ
  choice: అతన్ని ఆశీర్వదించాడు
  rationale: ברך యొక్క ప్రత్యక్ష ధార్మిక అర్థమైన ‘ఆశీర్వదించు’ను నిలుపుతుంది; ‘అనుగ్రహించాడు’ వంటి బలహీనమైన ప్రత్యామ్నాయాన్ని నివారిస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన టెట్రాగ్రామటన్‌ను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తింపుపొందిన ‘యెహోవా’ రూపంలో అందిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. బిరుదైన ‘ప్రభువు’తో దాన్ని భర్తీ చేయకుండా వ్యక్తినామంగా ఉంచాం; ఆధునిక తెలుగు పాఠకులకు విస్తృతంగా పరిచితమైన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టమైన, గౌరవప్రదమైన కథనశైలి. హీబ్రూ వాక్యక్రమాన్ని యాంత్రికంగా అనుకరించకుండా, దాని వరుస చర్యలను రెండు సహజ తెలుగు వాక్యాల్లో నిలిపాం.
