source:
  edition: WLC
  text: וְ/לֹא יָ֤סַף עוֹד֙ מַלְאַ֣ךְ יְהוָ֔ה לְ/הֵרָאֹ֖ה אֶל מָנ֣וֹחַ וְ/אֶל אִשְׁתּ֑/וֹ אָ֚ז יָדַ֣ע מָנ֔וֹחַ כִּֽי מַלְאַ֥ךְ יְהוָ֖ה הֽוּא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/021.yaml
  text: And the angel of Yahweh did not appear again to Manoah and to his wife[a]. Then Manoah knew that he was the angel of Yahweh.
translation:
  language: te
  text: యాహ్వే దూత మనోహుకు, అతని భార్యకు మళ్లీ ప్రత్యక్షం కాలేదు.[a] అప్పుడు అతడు యాహ్వే దూత అని మనోహు తెలుసుకున్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘యాహ్వే దేవదూత.’ హీబ్రూ పదానికి ‘దూత’ లేదా ‘దేవదూత’ అనే అర్థాలు రావచ్చు; ఈ సందర్భంలో అది అతీంద్రియ వ్యక్తిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָסַף עוֹד
  choice: మళ్లీ ... కాలేదు
  rationale: יָסַף + עוֹד అనే ప్రయోగం ఇకపై లేదా మరొకసారి ఆ కార్యం జరగలేదనే భావాన్ని ఇస్తుంది; ఆధునిక తెలుగులో ‘మళ్లీ ... కాలేదు’ సహజంగా ఉంది.
- source_word: מַלְאַךְ יְהוָה
  choice: యెహోవా దూత
  rationale: מַלְאַךְ అంటే ‘దూత’ లేదా సందర్భానుసారంగా ‘దేవదూత’; ఇక్కడ అతీంద్రియ వ్యక్తి ఉద్దేశించబడినా, ‘దూత’ మూలపదంలోని విస్తృతార్థాన్ని నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా తెలుగులో ప్రాచుర్యంలో ఉన్న ‘యెహోవా’ రూపంలో ఉంచాం.
- source_word: לְהֵרָאֹה
  choice: ప్రత్యక్షం కావడం
  rationale: ראה యొక్క నిఫాల్ రూపం ఇక్కడ ‘కనిపించడం/ప్రత్యక్షం కావడం’ అనే భావాన్ని ఇస్తుంది; ఈ దైవదర్శన సందర్భంలో ‘ప్రత్యక్షం కావడం’ సహజమైన గౌరవభరిత పదప్రయోగం.
- source_word: אֶל מָנוֹחַ וְאֶל אִשְׁתּוֹ
  choice: మనోహుకు, అతని భార్యకు
  rationale: రెండుసార్లు వచ్చిన אֶל సంబంధాన్ని రెండు దత్తివిభక్తి రూపాలతో సంక్షిప్తంగా, సహజంగా వ్యక్తం చేశాం.
- source_word: אָז
  choice: అప్పుడు
  rationale: కథనంలోని తదనంతర గ్రహింపును సూచించే సహజమైన తెలుగు అనుసంధానం.
- source_word: יָדַע
  choice: తెలుసుకున్నాడు
  rationale: ఇక్కడ క్రియ ముందుగా తెలియని గుర్తింపుకు చేరుకోవడాన్ని సూచిస్తుంది; ‘తెలుసుకున్నాడు’ మూలార్థాన్ని సహజంగా అందిస్తుంది.
- source_word: כִּי מַלְאַךְ יְהוָה הוּא
  choice: అతడు యెహోవా దూత అని
  rationale: הוּא ముందుగా ప్రత్యక్షమైన వ్యక్తిని సూచిస్తుంది; ‘అతడు’ వ్యక్తిగత సూచనను నిలుపుతుంది, ఆయన స్వరూపంపై అదనపు వ్యాఖ్యానాన్ని చేర్చదు.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు / యాహ్వే
  rationale: పాఠ్యంలో ఉన్న ప్రత్యేక దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, సాధారణ తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన రూపంలో నిలిపాం.
- issue: מַלְאַךְ יְהוָה యొక్క గుర్తింపు
  choice: యెహోవా దూత
  alternative: యెహోవా దేవదూత
  rationale: సందర్భం ఈ వ్యక్తి అతీంద్రియుడని సూచించినప్పటికీ, ‘దూత’ అనే పదం హీబ్రూ పదంలోని ‘సందేశవాహకుడు/దూత’ అర్థవిస్తారాన్ని కాపాడుతుంది; ఆ వ్యక్తి యొక్క మరింత ఖచ్చితమైన దైవశాస్త్రీయ గుర్తింపును పాఠ్యానికి మించి నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవభరిత కథనశైలి. ‘ప్రత్యక్షం కాలేదు’ దైవదర్శన సందర్భానికి తగినది. మూలంలోని వ్యక్తిగత సర్వనామాన్ని ‘అతడు’గా నిలిపి, గుర్తింపు విషయంలోని దైవశాస్త్రీయ ఉద్వేగాన్ని పరిష్కరించకుండా ఉంచాం.
