id: JDG.13.15
reference: Judges 13:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר מָנ֖וֹחַ אֶל מַלְאַ֣ךְ יְהוָ֑ה נַעְצְרָה נָּ֣א אוֹתָ֔/ךְ וְ/נַעֲשֶׂ֥ה לְ/פָנֶ֖י/ךָ גְּדִ֥י עִזִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/015.yaml
  text: Then Manoah said to the angel of the LORD, “Please let us detain you, and we will prepare a young goat for you.”
translation:
  language: te
  text: అప్పుడు మానోహ యెహోవా దూతతో, “దయచేసి కొంతసేపు ఇక్కడే ఉండండి; మేము మీ కోసం ఒక మేకపిల్లను సిద్ధం చేస్తాం” అన్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נַעְצְרָה נָּא אוֹתָךְ
  choice: దయచేసి ... ఇక్కడే ఉండండి
  rationale: ‘మిమ్మల్ని ఆపి ఉంచనివ్వండి’ అనే అక్షరార్థం తెలుగులో బలవంతపు నిర్బంధాన్ని సూచించవచ్చు. సందర్భంలో అతిథిని కొంతసేపు ఉండమని మర్యాదగా కోరడమే భావం.
- source_word: וְנַעֲשֶׂה לְפָנֶיךָ
  choice: మేము ... సిద్ధం చేసేంతవరకు
  rationale: לְפָנֶיךָ అక్షరార్థంగా ‘మీ సమక్షంలో/మీ ముందు’; సందర్భంలో అతిథి కోసం భోజనం సిద్ధం చేయడాన్ని సూచిస్తుంది. ‘చేసేంతవరకు’ అనేది ఉండమనే అభ్యర్థనతో సహజంగా అనుసంధానిస్తుంది.
- source_word: גְּדִי עִזִּים
  choice: మేకపిల్లను
  rationale: ఈ పదబంధం మేకలలోని చిన్నపిల్లను, అంటే young goatను సూచిస్తుంది; ఆధునిక తెలుగులో ‘మేకపిల్ల’ సహజం.
- source_word: מַלְאַךְ יְהוָה
  choice: యెహోవా దూతతో
  rationale: దైవనామాన్ని వ్యక్తినామంగా ప్రతిబింబిస్తూ, ‘messenger/angel’కు సందర్భానుకూలమైన సంప్రదాయ తెలుగు పదం ‘దూత’ను ఉపయోగించాం.
theological_decisions:
- issue: యెహోవా దూత యొక్క గుర్తింపు
  choice: యెహోవా దూత
  alternative: ప్రభువు దూత
  rationale: హీబ్రూ పాఠంలోని మַלְאַךְ יְהוָהను నేరుగా అనువదించాం; ఈ వచనంలో దూత యొక్క తాత్త్విక గుర్తింపును అదనంగా నిర్ణయించలేదు.
translation_notes:
  register: సంభాషణను ఆధునిక, మర్యాదపూర్వక, సాధారణ తెలుగులో ఉంచాం. మానోహ అతిథిని బలవంతంగా నిర్బంధించాలనుకున్నట్టు వినిపించకుండా, కొంతసేపు ఉండమనే ఆహ్వాన భావాన్ని వ్యక్తం చేశాం.
