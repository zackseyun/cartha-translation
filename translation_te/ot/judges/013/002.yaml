source:
  edition: WLC
  text: וַ/יְהִי֩ אִ֨ישׁ אֶחָ֧ד מִ/צָּרְעָ֛ה מִ/מִּשְׁפַּ֥חַת הַ/דָּנִ֖י וּ/שְׁמ֣/וֹ מָנ֑וֹחַ וְ/אִשְׁתּ֥/וֹ עֲקָרָ֖ה וְ/לֹ֥א יָלָֽדָה׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/002.yaml
  text: There was a certain man from Zorah[a], from the clan of the Danites, and his name was Manoah. His wife was barren and had not borne children.
translation:
  language: te
  text: జొరాకు చెందిన ఒక వ్యక్తి ఉండేవాడు. అతడు దానీయుల వంశానికి చెందినవాడు; అతని పేరు మానోహ. అతని భార్య వంధ్యురాలు; ఆమె పిల్లలను కనలేదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “ఆమె కనలేదు.” హీబ్రూలో కర్మపదం లేదు.
    reason: మూలంలోని వాక్య నిర్మాణాన్ని, ప్రధాన పాఠ్యంలో సహజ తెలుగు కోసం చేర్చిన ‘పిల్లలను’ అనే పదాన్ని తెలియజేయడం.
lexical_decisions:
- source_word: וַיְהִי אִישׁ אֶחָד
  choice: ఒక వ్యక్తి ఉండేవాడు
  rationale: కొత్త కథా దృశ్యంలో ఇంకా పేరు చెప్పని ఒక నిర్దిష్ట వ్యక్తిని పరిచయం చేసే హీబ్రూ ప్రయోగాన్ని సహజమైన తెలుగు కథనశైలిలో అందిస్తుంది.
- source_word: מִצָּרְעָה
  choice: జొర్యాకు చెందిన
  rationale: מִן సూచించే స్థలసంబంధ మూలాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది; స్థలనామాన్ని లిప్యంతరీకరించాం.
- source_word: מִמִּשְׁפַּחַת הַדָּנִי
  choice: దానీయుల వంశానికి చెందినవాడు
  rationale: מִשְׁפָּחָה ఇక్కడ విస్తృత గోత్రంలోని బంధుత్వ సమూహాన్ని సూచిస్తుంది. ‘వంశం’ సాధారణ పాఠకులకు సహజంగా ఉండి, దాను గోత్రమంతటితో దీనిని పూర్తిగా సమానం చేయదు.
- source_word: וּשְׁמוֹ מָנוֹחַ
  choice: అతని పేరు మానోహ
  rationale: హీబ్రూ నామపరిచయ సూత్రాన్ని స్పష్టంగా, సహజంగా నిలుపుతుంది.
- source_word: עֲקָרָה
  choice: గొడ్రాలు
  rationale: సంతానాన్ని కనలేని స్త్రీని సూచించే మూలపదానికి సంక్షిప్తమైన, సాంప్రదాయిక తెలుగు సమానార్థకం; జనన ప్రకటన కథనంలోని సాహిత్య ప్రతిధ్వనిని నిలుపుతుంది.
- source_word: וְלֹא יָלָדָה
  choice: ఆమె పిల్లలను కనలేదు
  rationale: స్త్రీ కర్తతో ילד అంటే కనడం లేదా ప్రసవించడం. హీబ్రూలో కర్మపదం లేకపోయినా, తెలుగులో భావాన్ని సహజంగా పూర్తి చేయడానికి ‘పిల్లలను’ వాడాం; ఏకవచన బిడ్డను మూలంలో లేనట్లుగా నిర్దిష్టం చేయలేదు.
