source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר לּ/וֹ֙ מַלְאַ֣ךְ יְהוָ֔ה לָ֥/מָּה זֶּ֖ה תִּשְׁאַ֣ל לִ/שְׁמִ֑/י וְ/הוּא פֶ֛לִאי־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/018.yaml
  text: And the angel of Yahweh said to him[a], “Why do you ask my name, seeing it is wonderful?”
translation:
  language: te
  text: యెహోవా దూత అతనితో, “నా పేరు ఎందుకు అడుగుతున్నావు? అది అద్భుతమైనది కాబట్టి” అన్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: యెహోవా దూత
  rationale: מַלְאַךְ అనే పదానికి ‘దూత’ లేదా ‘దేవదూత’ అనే అర్థాలు రావచ్చు. ఈ సందర్భంలో అతడు అతీంద్రియ సందేశవాహకుడైనా, ‘దూత’ అనే పదం మూలంలోని విస్తృత భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది; యెహోవా అనే వ్యక్తిగత నామాన్ని అలాగే ఉంచుతుంది.
- source_word: לָמָּה זֶּה
  choice: ఎందుకు
  rationale: ఇది అలంకారిక ప్రశ్నను ప్రవేశపెట్టే హీబ్రూ నుడికారం; ఆధునిక తెలుగులో ‘ఎందుకు’ దాని భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: תִּשְׁאַל לִשְׁמִי
  choice: నా పేరు ఎందుకు అడుగుతున్నావు?
  rationale: שׁאל + לִשְׁמִי అంటే ఒకరి పేరును అడగడం. ప్రత్యక్షతను, సహజ తెలుగు వాక్యనిర్మాణాన్ని కాపాడేందుకు ఇలా అనువదించబడింది.
- source_word: וְהוּא
  choice: అది
  rationale: సర్వనామం ‘నా పేరు’ను సూచిస్తుంది. హీబ్రూలోని సంధికారకానికి వివరణాత్మక భావం ఉండవచ్చు; తెలుగులో రెండు ప్రశ్న/ప్రకటన వాక్యాల క్రమమే ఆ సంబంధాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: פֶלִאי
  choice: అద్భుతమైనది
  rationale: ఈ విశేషణం అసాధారణమైనది, ఆశ్చర్యకరమైనది, లేదా మానవ అవగాహనకు మించినది అనే భావపరిధిని కలిగి ఉంది. ప్రధాన పాఠంలో ‘అద్భుతమైనది’ నేరుగా ఉండి, విస్తృత భావాన్ని పాదసూచికలో నిలుపుతుంది.
theological_decisions:
- issue: פֶלִאי పదానికి ఉండగల దైవదర్శన లేదా క్రీస్తుసంబంధ సూచన
  choice: ‘అద్భుతమైనది’ అని పదార్థానుసారంగా అనువదించి, దూత యొక్క గుర్తింపును అనువాదంలోనే తేల్చకపోవడం
  alternative: ‘అవగాహనకు మించినది’ అని వివరణాత్మకంగా అనువదించడం లేదా దీనిని బిరుదుగా చూపడం
  rationale: ఈ వచనం యెహోవా దూత యొక్క గుర్తింపు గురించి ధార్మిక ఆలోచనకు అవకాశం ఇస్తుంది. అయితే హీబ్రూ పాఠం స్పష్టంగా చెప్పనిదాన్ని అనువాదం నిర్ణయించకూడదు; అందువల్ల దాని ధార్మిక ఉద్విగ్నతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ప్రత్యక్ష సంభాషణను ఉపయోగించాం. దైవనామాన్ని ‘యెహోవా’గా లిప్యంతరీకరించాం. మూలంలోని פֶלִאי పదానికి గల భావవిస్తృతిని ప్రధాన పాఠం మరియు పాదసూచిక కలిపి సంరక్షించాయి.
