source:
  edition: WLC
  text: וַ/תְּמַהֵר֙ הָֽ/אִשָּׁ֔ה וַ/תָּ֖רָץ וַ/תַּגֵּ֣ד לְ/אִישָׁ֑/הּ וַ/תֹּ֣אמֶר אֵלָ֔י/ו הִנֵּ֨ה נִרְאָ֤ה אֵלַ/י֙ הָ/אִ֔ישׁ אֲשֶׁר בָּ֥א בַ/יּ֖וֹם אֵלָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/010.yaml
  text: So the woman hurried and ran and told her husband[a], and said to him, “Look, the man who came to me that day has appeared to me.”
translation:
  language: te
  text: అప్పుడు ఆ స్త్రీ త్వరపడి పరుగెత్తి తన భర్తకు విషయం చెప్పింది. ఆమె అతనితో, “ఇదిగో, ఆ రోజు[a] నా దగ్గరికి వచ్చిన ఆ మనిషి నాకు ప్రత్యక్షమయ్యాడు” అంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మునుపొక రోజు.” హెబ్రీలో ఈ మాట పదశః “ఆ రోజున” అని ఉండి, అతడు ఇంతకు ముందు వచ్చిన సందర్భాన్ని సూచిస్తుంది.
    reason: మూలంలోని בַיּוֹם అనే అసాధారణ కాలవ్యక్తీకరణకు సహజమైన ప్రత్యామ్నాయాన్ని తెలియజేసి, దాని పదశః రూపాన్ని కూడా నమోదు చేయడం.
lexical_decisions:
- source_word: וַתְּמַהֵר
  choice: త్వరపడి
  rationale: מהר అనే ధాతువు తొందరను సూచిస్తుంది. ఆధునిక తెలుగులో ‘త్వరపడి’ సహజంగా ఉండి, తరువాతి ‘పరుగెత్తి’ అనే క్రియతో కలిసిపోకుండా దాని ప్రత్యేక భావాన్ని నిలుపుతుంది.
- source_word: וַתָּרָץ
  choice: పరుగెత్తి
  rationale: רוץ యొక్క సూటి అర్థం శారీరకంగా పరుగెత్తడం. మూలంలోని తొందరను తెలిపే రెండు వేర్వేరు క్రియలనూ అనువాదం నిలుపుతుంది.
- source_word: וַתַּגֵּד
  choice: విషయం చెప్పింది
  rationale: נגד యొక్క హిఫిల్ రూపం ‘తెలియజేయడం/చెప్పడం’ అనే భావాన్ని ఇస్తుంది. తెలుగులో కర్మను పూర్తిగా వదిలేస్తే వాక్యం అసహజంగా ఉండవచ్చు కాబట్టి సందర్భానుసారంగా ‘విషయం చెప్పింది’ అని అనువదించబడింది.
- source_word: לְאִישָׁהּ
  choice: తన భర్తకు
  rationale: אִישׁ సాధారణంగా ‘మనిషి/పురుషుడు’ అని అర్థమైనా, ఈ గృహసంబంధ సందర్భంలో స్త్రీలింగ ఏకవచన ప్రత్యయంతో ‘ఆమె భర్త’ అని సహజంగా అర్థమవుతుంది. తెలుగు ప్రతిబింబక వాడుకకు అనుగుణంగా ‘తన భర్తకు’ అని ఇచ్చాం.
- source_word: הִנֵּה
  choice: ఇదిగో
  rationale: శ్రోత దృష్టిని ఆకర్షించే הִנֵּה యొక్క తక్షణతను ‘ఇదిగో’ సహజమైన, గౌరవప్రదమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: נִרְאָה אֵלַי
  choice: నాకు ప్రత్యక్షమయ్యాడు
  rationale: ראה యొక్క నిఫాల్ రూపం ఇక్కడ ‘కనిపించాడు/ప్రత్యక్షమయ్యాడు’ అనే భావం ఇస్తుంది. ‘ప్రత్యక్షమయ్యాడు’ ఆ వ్యక్తి ఆమె ఎదుట కనబడిన సంఘటనను స్పష్టంగా తెలియజేస్తుంది; ఆమె కేవలం అతన్ని చూసిందనే విధంగా భావాన్ని మార్చదు.
- source_word: הָאִישׁ
  choice: ఆ మనిషి
  rationale: నిర్దిష్ట నామవాచకం ముందు కలిసిన వ్యక్తిని తిరిగి సూచిస్తుంది. ‘ఆ మనిషి’ స్త్రీ మాటల్లోని గుర్తింపునే నిలుపుతూ, విస్తృత సందర్భంలోని ‘యెహోవా దూత’ అనే గుర్తింపును ఈ వాక్యంలోకి ముందుగానే చేర్చదు.
- source_word: אֲשֶׁר בָּא בַיּוֹם אֵלַי
  choice: ఆ రోజు నా దగ్గరికి వచ్చిన
  rationale: పదశః ‘ఆ రోజున నా దగ్గరికి వచ్చిన’ అనే హెబ్రీ వ్యక్తీకరణ ముందటి సందర్శనను సూచిస్తుంది. ‘ఆ రోజు’ ఆధునిక తెలుగులో సహజంగా ఉండి ఆ పూర్వ సందర్భంతో సంబంధాన్ని నిలుపుతుంది.
theological_decisions:
- issue: స్త్రీ మాటల్లో הָאִישׁ అనే వ్యక్తి గుర్తింపు
  choice: ఆ మనిషి
  alternative: దూత / దేవుని దూత / యెహోవా దూత
  rationale: విస్తృత సందర్భం ఆ వ్యక్తిని యెహోవా దూతగా గుర్తించినప్పటికీ, ఈ వాక్యంలో స్త్రీ అతన్ని ‘ఆ మనిషి’ అని మాత్రమే పిలుస్తుంది. అనువాదం ఆమె తక్షణ దృక్కోణాన్ని నిలుపుతూ, ఈ వాక్యంలో లేని మరింత స్పష్టమైన దైవశాస్త్ర గుర్తింపును చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కథనానికి తగిన సరళమైన, గౌరవప్రదమైన శైలి. ‘త్వరపడి పరుగెత్తి’ ద్వారా మూలంలోని రెండు క్రియలు నిలుపబడ్డాయి. ‘ఇదిగో’ సంభాషణలోని తక్షణతను, ‘ప్రత్యక్షమయ్యాడు’ నిఫాల్ క్రియాభావాన్ని వ్యక్తం చేస్తాయి. పాదసూచిక గుర్తు సంబంధిత ‘ఆ రోజు’ తరువాతే ఉంచబడింది.
