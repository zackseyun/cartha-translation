  source_fidelity: 'ప్రధాన అనువాదం హీబ్రూ భావాన్ని నమ్మకంగా తెలియజేస్తుంది: మానోహుని ఆకాంక్షాత్మక/కాలార్థకంగా వినిపించగల మాటను, బాలునికి సంబంధించిన מִשְׁפָּט‌ను, అతని מַעֲשֶׂהను విడివిడిగా స్పష్టంగా ఇస్తుంది. అయితే מִשְׁפָּט‌కు సంబంధించిన ముఖ్యమైన పదార్థ-పరిధి పాదసూచికలో లేకపోవడం వల్ల ఆ మూల-అస్పష్టత పూర్తిగా నిలవలేదు.'
  naturalness: “ఆ బాలునికి వర్తించే నియమం ఏమిటి? అతని పని ఏమిటి?” ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, స్పష్టంగా ఉంది. రెండు చిన్న ప్రశ్నలుగా విభజించడం మూలభావాన్ని మార్చదు.
