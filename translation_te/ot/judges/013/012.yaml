id: JDG.13.12
reference: Judges 13:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר מָנ֔וֹחַ עַתָּ֖ה יָבֹ֣א דְבָרֶ֑י/ךָ מַה יִּֽהְיֶ֥ה מִשְׁפַּט הַ/נַּ֖עַר וּ/מַעֲשֵֽׂ/הוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/012.yaml
  text: Then Manoah said[a], “Now let your words come true[c][b]. What will be the rule for the boy and for his work?”
translation:
  language: te
  text: 'అప్పుడు మానోహ ఇలా అన్నాడు: “ఇప్పుడు నీ మాటలు నెరవేరుగాక.[a] ఆ బాలునికి వర్తించే నియమం ఏమిటి?[b] అతని పని ఏమిటి?[c]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీ మాటలు నెరవేరినప్పుడు.” హీబ్రూ వాక్యాన్ని ఆకాంక్షగా (“నెరవేరుగాక”) లేదా కాలాన్ని సూచించే భావంలో (“నెరవేరినప్పుడు”) అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
  - marker: b
    text: “నియమం” అనే పదాన్ని “ఆచారం,” “నిర్దేశం,” లేదా “జీవనవిధానం” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: “అతని పని” అంటే “అతడు చేయవలసినది” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... ఇలా అన్నాడు
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది; ఆధునిక తెలుగులో ‘అప్పుడు’ ఆ క్రమార్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: מָנוֹחַ
  choice: మానోహ
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగులో ధ్వన్యనుసారంగా లిప్యంతరీకరించాం.
- source_word: עַתָּה
  choice: ఇప్పుడు
  rationale: మానోహ తక్షణ స్పందనను, ప్రకటించినది నెరవేరాలనే నిరీక్షణను సూచిస్తుంది.
- source_word: יָבֹא דְבָרֶיךָ
  choice: నీ మాటలు నెరవేరుగాక
  rationale: అక్షరార్థంగా ‘నీ మాటలు రావాలి/చేరాలి’; సందర్భంలో ప్రకటించిన సంగతులు నిజమవ్వాలనే ఆకాంక్ష. హీబ్రూలో ఇది ఆకాంక్షగా గానీ, ‘నీ మాటలు నెరవేరినప్పుడు’ అనే కాలార్థంగా గానీ వినిపించగలదు; ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: מַה יִּהְיֶה
  choice: ఏమిటి?
  rationale: రాబోయే బాలునికి సంబంధించిన విధి, కార్యం ఏమై ఉండబోతున్నాయో అడిగే ప్రశ్నను తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: מִשְׁפַּט הַנַּעַר
  choice: ఆ బాలునికి వర్తించే నియమం
  rationale: מִשְׁפַּט ఇక్కడ తీర్పు కంటే నిర్దేశిత నియమం, ఆచారం లేదా జీవనవిధానాన్ని సూచిస్తుంది. ‘వర్తించే’ అని చేర్చడం సంబంధాన్ని సహజ తెలుగులో స్పష్టం చేస్తుంది.
- source_word: הַנַּעַר
  choice: ఆ బాలుడు
  rationale: ఇంకా పుట్టని మగబిడ్డను సూచించే హీబ్రూ పదంలోని లింగసూచనను నిలిపింది.
- source_word: וּמַעֲשֵׂהוּ
  choice: అతని పని
  rationale: మూలంలోని ‘అతని పని/కార్యం’ అనే విస్తృత భావాన్ని వ్యాఖ్యానాత్మకంగా ‘పిలుపు’ లేదా ‘పరిచర్య’గా కుదించకుండా నిలిపింది.
