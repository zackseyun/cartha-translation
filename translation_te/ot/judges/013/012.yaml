translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా ఉండే శైలి. మూలంలోని రెండు ప్రశ్నార్థక అంశాలను తెలుగులో సహజత కోసం రెండు చిన్న ప్రశ్నలుగా ఇచ్చాం. మִשְׁפַּט యొక్క ‘నియమం/ఆచారం/జీవనవిధానం’ పరిధిని ‘వర్తించే నియమం’ ద్వారా నిలిపాం.
