source:
  edition: WLC
  text: וַ/תָּ֨חֶל֙ ר֣וּחַ יְהוָ֔ה לְ/פַעֲמ֖/וֹ בְּ/מַחֲנֵה דָ֑ן בֵּ֥ין צָרְעָ֖ה וּ/בֵ֥ין אֶשְׁתָּאֹֽל־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/025.yaml
  text: And the Spirit of Yahweh began to stir him in Mahaneh-dan[b][a], between Zorah and Eshtaol.
translation:
  language: te
  text: యెహోవా ఆత్మ అతనిని మహనే-దాను[a]లో, సొరా మరియు ఎష్టాయోల్ మధ్య, ప్రేరేపించడం[b] ప్రారంభించింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘మహనే-దాను’ అంటే ‘దాను శిబిరం’; ఇక్కడ అది ఒక స్థలనామంగా వాడబడింది.
    reason: cultural_note
  - marker: b
    text: లేదా, ‘అతనిని పురికొల్పడం’ / ‘అతనిని కదిలించడం.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּחֶל
  choice: మొదలుపెట్టాడు
  rationale: హిఫిల్ వయిక్తోల్ రూపంలోని ఆరంభ భావాన్ని సహజమైన తెలుగు కథన శైలిలో తెలియజేస్తుంది; వ్యాకరణపరంగా కర్త అయిన ‘యెహోవా ఆత్మ’కు అనుగుణంగా పుంలింగ ఏకవచనం వాడబడింది.
- source_word: רוּחַ יְהוָה
  choice: యెహోవా ఆత్మ
  rationale: న్యాయాధిపతుల గ్రంథంలోని సందర్భంలో ఇది యెహోవా శక్తినిచ్చే దైవిక సన్నిధిని సూచిస్తుంది; ‘ఆత్మ’ ఈ భావానికి సహజమైన తెలుగు పదం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో స్థిరపడిన ‘యెహోవా’ రూపంలో అందిస్తుంది.
- source_word: לְפַעֲמוֹ
  choice: అతన్ని ప్రేరేపించడం
  rationale: פעם క్రియలోని కదిలించడం, పురికొల్పడం, ప్రేరేపించడం అనే భావాన్ని సందర్భానుగుణంగా వ్యక్తం చేస్తుంది; దాని ఖచ్చిత ఛాయకు ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచింది.
- source_word: בְּמַחֲנֵה דָן
  choice: మహనె-దానులో
  rationale: ఇక్కడ ఇది ‘దాను శిబిరం’ అనే సాధారణ పదబంధం కంటే స్థలనామంగా పనిచేస్తున్నందున లిప్యంతరీకరించబడింది.
- source_word: בֵּין צָרְעָה וּבֵין אֶשְׁתָּאֹל
  choice: జొర్యా ఎష్టాయోలు మధ్య
  rationale: భౌగోళిక సంబంధాన్ని నేరుగా తెలియజేస్తూ స్థలనామాలను తెలుగు లిపిలో అందిస్తుంది.
theological_decisions:
- issue: ఈ సందర్భంలో רוּחַ יְהוָה స్వభావం
  choice: శక్తినిచ్చి కార్యానికి పురికొల్పే యెహోవా ఆత్మ
  alternative: యెహోవా గాలి / ఊపిరి
  rationale: సంసోను కథలో ఈ పదబంధం సాధారణ గాలిని కాక అతనిలో కార్యం చేసే యెహోవా దైవిక శక్తిని సూచిస్తుంది; తరువాతి సిద్ధాంత వివరాలను వాక్యంలోకి దిగుమతి చేయలేదు.
- issue: יְהוָה దైవనామ అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలోని ప్రత్యేక దైవనామాన్ని బిరుదుగా మార్చకుండా తెలుగులో సుపరిచితమైన రూపంలో నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కథన శైలి. స్థలనామాలను లిప్యంతరీకరించి, వాటి భావాన్ని పాదటిప్పణిలో తెలిపింది. రెండు పాదటిప్పణి గుర్తులూ ప్రధాన వాక్యంలో ఉన్నాయి.
