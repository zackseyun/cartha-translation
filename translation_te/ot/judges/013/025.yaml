revisions:
- from: యెహోవా ఆత్మ అతన్ని మహనె-దాను[a]లో, జొర్యా ఎష్టాయోలు మధ్య, ప్రేరేపించడం[b] మొదలుపెట్టాడు.
  to: యెహోవా ఆత్మ అతనిని మహనే-దాను[a]లో, సొరా మరియు ఎష్టాయోల్ మధ్య, ప్రేరేపించడం[b] ప్రారంభించింది.
  rationale: The revision corrects the two geographical names directly from the Hebrew, improves Telugu grammatical naturalness, and retains the draft’s faithful rendering of Yahweh’s Spirit and the deliberate lexical flexibility of לפעמו. Footnote markers remain anchored to the relevant words and retain their original purposes.
