source:
  edition: WLC
  text: וַ/יִּקַּ֨ח מָנ֜וֹחַ אֶת גְּדִ֤י הָ/עִזִּים֙ וְ/אֶת הַ/מִּנְחָ֔ה וַ/יַּ֥עַל עַל הַ/צּ֖וּר לַֽ/יהוָ֑ה וּ/מַפְלִ֣א לַ/עֲשׂ֔וֹת וּ/מָנ֥וֹחַ וְ/אִשְׁתּ֖/וֹ רֹאִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/019.yaml
  text: So Manoah took the young goat and the grain offering[a], and offered them on the rock to Yahweh, and he did a wondrous thing while Manoah and his wife were watching.
translation:
  language: te
  text: అప్పుడు మానోహ ఒక మేకపిల్లను, ధాన్యార్పణను తీసుకొని, బండమీద యెహోవాకు అర్పించాడు. మానోహ, అతని భార్య చూస్తుండగా అతడు ఒక అద్భుత కార్యం చేశాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యెహోవా దూత ఒక అద్భుత కార్యం చేశాడు.” హీబ్రూ వాక్యం సంక్షిప్తంగా ఉండి, కర్తను మళ్లీ స్పష్టంగా పేర్కొనదు; అయితే సందర్భం యెహోవా దూతనే సూచిస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: גְּדִי הָעִזִּים
  choice: ఒక మేకపిల్లను
  rationale: యువ మేకను సూచించే సహజమైన ఆధునిక తెలుగు పదబంధం; బలికి సంబంధించిన జంతువు అనే భావాన్ని నిలుపుతుంది.
- source_word: הַמִּנְחָה
  choice: ధాన్యార్పణను
  rationale: ఈ బలి సందర్భంలో מִנְחָה ధాన్యంతో చేసే అర్పణను సూచిస్తుంది; సాధారణ ‘అర్పణ’ కంటే ఇది మరింత నిర్దిష్టం.
- source_word: וַיַּעַל עַל הַצּוּר לַיהוָה
  choice: బండమీద యెహోవాకు అర్పించాడు
  rationale: బలి సందర్భంలో עלה ‘అర్పించడం’ అనే భావాన్ని ఇస్తుంది. క్రియ ఏకవచనంలో ఉన్నా, మేకపిల్లను మరియు ధాన్యార్పణను కలిపి అర్పించిన భావం తెలుగులో సహజంగా వ్యక్తమవుతుంది.
- source_word: לַיהוָה
  choice: యెహోవాకు
  rationale: దైవనామమైన יהוהను తెలుగు పాఠకులకు సుపరిచితమైన ‘యెహోవా’గా లిప్యంతరీకరించింది.
- source_word: וּמַפְלִא לַעֲשׂוֹת
  choice: అతడు ఒక అద్భుత కార్యం చేశాడు
  rationale: పదబంధంలోని ‘అద్భుతంగా చేయడం’ అనే క్రియాత్మక భావాన్ని సహజమైన తెలుగులో అందిస్తుంది; అంతర్లీన కర్తను పేరుపెట్టి నిర్ధారించకుండా ‘అతడు’ అని ఉంచుతుంది.
- source_word: רֹאִים
  choice: చూస్తుండగా
  rationale: హీబ్రూ కృదంతంలోని కొనసాగుతున్న చర్య భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: וּמַפְלִא לַעֲשׂוֹת అనే పదబంధంలోని అంతర్లీన కర్త
  choice: ప్రధాన పాఠంలో కర్తను ‘అతడు’ అని మాత్రమే పేర్కొనడం
  alternative: ‘యెహోవా దూత ఒక అద్భుత కార్యం చేశాడు’ అని కర్తను స్పష్టంగా పేర్కొనడం; లేదా ‘ఒక అద్భుతం జరిగింది’ అని కర్తలేని విధంగా అనువదించడం
  rationale: హీబ్రూ వాక్యం కర్తను మళ్లీ స్పష్టంగా చెప్పదు. సందర్భం యెహోవా దూతనే సూచించినా, ప్రధాన పాఠంలో అతని పేరును చేర్చకుండా మూలంలోని సంక్షిప్తతను, స్వల్ప అస్పష్టతను కాపాడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. ‘ధాన్యార్పణ’, ‘అర్పించాడు’ వంటి బలి సంబంధ పదాలు సాధారణ పాఠకులకు అర్థమయ్యేలా ఉండి, మూలంలోని ఆచారపరమైన భావాన్ని నిలుపుతాయి. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠంలో ఉంచబడ్డాయి.
