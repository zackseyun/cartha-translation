source:
  edition: WLC
  text: וַ/יְהִי֩ בַ/עֲל֨וֹת הַ/לַּ֜הַב מֵ/עַ֤ל הַ/מִּזְבֵּ֨חַ֙ הַ/שָּׁמַ֔יְמָ/ה וַ/יַּ֥עַל מַלְאַךְ יְהוָ֖ה בְּ/לַ֣הַב הַ/מִּזְבֵּ֑חַ וּ/מָנ֤וֹחַ וְ/אִשְׁתּ/וֹ֙ רֹאִ֔ים וַ/יִּפְּל֥וּ עַל פְּנֵי/הֶ֖ם אָֽרְצָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/020.yaml
  text: And when the flame went up from the altar toward heaven[a], the angel of Yahweh went up in the flame of the altar, while Manoah and his wife were watching[b]; and they fell on their faces to the ground.
translation:
  language: te
  text: బలిపీఠం మీదనుండి మంట ఆకాశంవైపు లేచినప్పుడు, యెహోవా దూత[a] బలిపీఠపు మంటలో పైకి వెళ్లాడు; మనోహ, అతని భార్య చూస్తుండగా, వారు ముఖాలు నేలవైపు ఉంచి పడ్డారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘యెహోవా దేవదూత.’ హీబ్రూ పదానికి ‘సందేశవాహకుడు’ లేదా ‘దేవదూత’ అనే అర్థాలు రావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַעֲלוֹת הַלַּהַב
  choice: మంట ... పైకి లేచినప్పుడు
  rationale: హీబ్రూ కాలసూచక నిర్మాణాన్ని సహజమైన తెలుగు కథనశైలిలో వ్యక్తం చేస్తుంది; ‘జరిగిందేమంటే’ అనే కృత్రిమ పదబద్ధతను నివారిస్తుంది.
- source_word: מֵעַל הַמִּזְבֵּחַ הַשָּׁמַיְמָה
  choice: బలిపీఠం మీదనుండి ... ఆకాశంవైపు
  rationale: מֵעַל లోని ‘మీదనుండి’ భావాన్ని, దిశాసూచక ה־ను ‘ఆకాశంవైపు’గా స్పష్టంగా నిలుపుతుంది.
- source_word: מַלְאַךְ יְהוָה
  choice: యెహోవా దూత
  rationale: מַלְאָךְ యొక్క ప్రాథమిక ‘దూత/సందేశవాహకుడు’ భావాన్ని నిలుపుతూ, యెహోవా అనే దైవనామాన్ని లిప్యంతరీకరిస్తుంది; ఆ వ్యక్తి యొక్క ఖచ్చితమైన తాత్త్విక స్వరూపాన్ని అనువాదంలో నిర్ణయించదు.
- source_word: בְּלַהַב הַמִּזְבֵּחַ
  choice: బలిపీఠపు మంటలో
  rationale: בְּ ను ఇక్కడ స్థలార్థకంగా తీసుకుని దృశ్యాన్ని సహజంగా, అతివ్యాఖ్యానం లేకుండా అందిస్తుంది.
- source_word: וּמָנוֹחַ וְאִשְׁתּוֹ רֹאִים
  choice: మనోహా, అతని భార్య చూస్తుండగా
  rationale: వర్తమాన కృదంతం సూచించే సమకాలీనంగా కొనసాగుతున్న చర్యను ‘చూస్తుండగా’ సహజంగా తెలియజేస్తుంది.
- source_word: וַיִּפְּלוּ עַל־פְּנֵיהֶם אָרְצָה
  choice: వారు సాష్టాంగంగా నేలమీద పడ్డారు
  rationale: ముఖం నేలకు ఆనేటట్లు పడే భంగిమను ఆధునిక తెలుగులో సంక్షిప్తంగా, గౌరవప్రదంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: מַלְאַךְ יְהוָה అనే వ్యక్తి గుర్తింపు
  choice: ‘యెహోవా దూత’ అని అనువదించి, అతని తాత్త్విక స్వరూపాన్ని నిర్ణయించకుండా ఉంచడం
  alternative: ‘యెహోవా దేవదూత’ అని అనువదించడం లేదా ఇది దేవుని ప్రత్యక్షత అని స్పష్టీకరించడం
  rationale: హీబ్రూ పదబంధం యెహోవాకు చెందిన దూత/సందేశవాహకుడని పేర్కొంటుంది; అతడు సాధారణ దేవదూతా, దైవ ప్రత్యక్షతా అనే ప్రశ్నను వచనం ఇక్కడ స్వయంగా తేల్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజ కథన ప్రవాహాన్ని, మూలంలోని పైకి కదలికను మరియు గంభీరతను నిలిపింది. ‘సాష్టాంగంగా’ అనే పదం ముఖం నేలవైపు పడే భంగిమను సహజంగా సూచిస్తుంది.
