revisions:
- from: బలిపీఠం మీదనుండి మంట ఆకాశంవైపు పైకి లేచినప్పుడు, యెహోవా దూత[a] బలిపీఠపు మంటలో పైకి వెళ్లాడు. మనోహా, అతని భార్య చూస్తుండగా, వారు సాష్టాంగంగా నేలమీద పడ్డారు.
  to: బలిపీఠం మీదనుండి మంట ఆకాశంవైపు లేచినప్పుడు, యెహోవా దూత[a] బలిపీఠపు మంటలో పైకి వెళ్లాడు; మనోహ, అతని భార్య చూస్తుండగా, వారు ముఖాలు నేలవైపు ఉంచి పడ్డారు.
  rationale: The revision corrects the rendering of Manoah’s name, avoids an unnecessary directional redundancy, and replaces the more interpretively specific “సాష్టాంగంగా” with wording that directly represents the Hebrew ‘fell on their faces.’ The designation “యెహోవా దూత” and its lexical alternative retain the source’s theological ambiguity.
