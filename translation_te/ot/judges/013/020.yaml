    reason: lexical_alternative
  revision_rationale: The revision corrects the rendering of Manoah’s name, avoids an unnecessary directional redundancy, and replaces the more interpretively specific “సాష్టాంగంగా” with wording that directly represents the Hebrew ‘fell on their faces.’ The designation “యెహోవా దూత” and its lexical alternative retain the source’s theological ambiguity.
