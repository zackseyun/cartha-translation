    issue: ద్రాక్షారసం for יַיִן
    rationale: In modern Telugu, ద్రాక్షారసం generally means grape juice rather than fermented wine. The Hebrew יַיִן specifically denotes wine; ద్రాక్షామద్యం is clearer and preserves the contrast with שֵׁכָר, “strong/intoxicating drink.”
