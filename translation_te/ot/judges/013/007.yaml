source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר לִ֔/י הִנָּ֥/ךְ הָרָ֖ה וְ/יֹלַ֣דְתְּ בֵּ֑ן וְ/עַתָּ֞ה אַל תִּשְׁתִּ֣י יַ֣יִן וְ/שֵׁכָ֗ר וְ/אַל תֹּֽאכְלִי֙ כָּל טֻמְאָ֔ה כִּֽי נְזִ֤יר אֱלֹהִים֙ יִהְיֶ֣ה הַ/נַּ֔עַר מִן הַ/בֶּ֖טֶן עַד י֥וֹם מוֹתֽ/וֹ־׀־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/007.yaml
  text: For he said to me[a], ‘Look, you will conceive and bear a son. So now, do not drink wine or strong drink, and do not eat anything unclean[b], for the boy will be a Nazirite of God from the womb until the day of his death.’
translation:
  language: te
  text: 'ఆయన నాతో ఇలా అన్నాడు: ‘ఇదిగో, నీవు గర్భం ధరించి కుమారుణ్ణి కంటావు.[a] కాబట్టి ఇప్పుడు ద్రాక్షామద్యం గానీ మత్తు పానీయం గానీ తాగవద్దు; అపవిత్రమైనదేదీ తినవద్దు. ఎందుకంటే ఆ బాలుడు గర్భం నుండే తన మరణదినం వరకు దేవుని నాజీరు[b]గా ఉంటాడు.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “ఇదిగో, నీవు గర్భవతివి, కుమారుణ్ణి కంటావు” అని కూడా అనువదించవచ్చు; సందర్భం భావి అర్థమైన “నీవు గర్భం ధరించి కుమారుణ్ణి కంటావు” అనే అనువాదాన్ని సమర్థిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: “నాజీరు” అనేది దేవునికి ప్రత్యేకంగా ప్రతిష్ఠించబడిన వ్యక్తిని సూచించే హీబ్రూ సాంకేతిక పదం.
    reason: technical_term
lexical_decisions:
- source_word: וַיֹּאמֶר לִי
  choice: ఆయన నాతో ఇలా అన్నాడు
  rationale: మునుపటి సందర్భంలో మనోహ భార్య దేవదూత పలికిన మాటలను తెలియజేస్తోంది. హీబ్రూ సంధికారకాన్ని తెలుగులో సహజమైన నివేదనగా వ్యక్తం చేశాం.
- source_word: הִנָּךְ הָרָה
  choice: ఇదిగో, నీవు గర్భం ధరించి
  rationale: హీబ్రూ రూపం అక్షరార్థంగా ‘ఇదిగో, నీవు గర్భవతివి’ అని అర్థమయ్యే అవకాశం ఉన్నా, ప్రకటన సందర్భంలో భావి గర్భధారణను సూచించవచ్చు. ప్రధాన పాఠంలో సహజమైన భావి అర్థాన్ని ఇచ్చి, అక్షరార్థ అవకాశాన్ని పాదసూచికలో నిలిపాం.
- source_word: וְיֹלַדְתְּ בֵּן
  choice: కుమారుణ్ణి కంటావు
  rationale: పుట్టించడం అనే క్రియను, శిశువు పురుషుడని తెలిపే ‘కుమారుడు’తో సహజమైన ఆధునిక తెలుగులో అనువదించాం.
- source_word: וְעַתָּה
  choice: కాబట్టి ఇప్పుడు
  rationale: ప్రకటన నుంచి దాని ఆధారంగా ఇచ్చే ఆదేశానికి మార్పును స్పష్టంగా తెలియజేస్తుంది.
- source_word: יַיִן וְשֵׁכָר
  choice: ద్రాక్షారసం గానీ మత్తు పానీయం గానీ
  rationale: יַיִן ద్రాక్షతో చేసిన పానీయాన్ని, שֵׁכָר ద్రాక్షారసం కాని ఇతర మత్తు పానీయాన్ని విస్తృతంగా సూచిస్తుంది; ఆధునిక పానీయ రకాన్ని అనవసరంగా నిర్దిష్టం చేయలేదు.
- source_word: כָּל טֻמְאָה
  choice: అపవిత్రమైనదేదీ
  rationale: ఆహార సంబంధమైన అపవిత్రతను సహజంగా వ్యక్తం చేస్తూ, ‘ఏ అపవిత్ర వస్తువూ’ అనే అసహజ నిర్మాణాన్ని నివారిస్తుంది.
- source_word: נְזִיר אֱלֹהִים
  choice: దేవుని నాజీరు
  rationale: נָזִיר ఒక ప్రత్యేక ప్రతిష్ఠిత స్థితికి సంబంధించిన సాంకేతిక పదం. దాని నేపథ్యాన్ని చెరపకుండా లిప్యంతరీకరించి, దేవునితో సంబంధాన్ని హీబ్రూ జనిటివ్‌కు సమీపంగా ఉంచాం.
- source_word: הַנַּעַר
  choice: ఆ బాలుడు
  rationale: జనన ప్రకటన సందర్భంలో పురుష శిశువును సూచించే సహజమైన పదం.
- source_word: מִן הַבֶּטֶן
  choice: గర్భం నుండే
  rationale: హీబ్రూ చిత్రణనూ, ఆ ప్రతిష్ఠ గర్భస్థ దశ నుంచే మొదలవుతుందనే కాలార్థాన్నీ నిలుపుతుంది.
- source_word: עַד יוֹם מוֹתוֹ
  choice: తన మరణదినం వరకు
  rationale: మూలంలోని కాలపరిమితిని నేరుగా, గంభీరమైన తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: నాజీరు అనే ప్రతిష్ఠిత స్థితి
  choice: దేవుని నాజీరు
  alternative: దేవునికి ప్రతిష్ఠించబడినవాడు
  rationale: సాధారణ పవిత్రతగా మాత్రమే అర్థం కుదించకుండా, హీబ్రూ న్యాయ-ఒడంబడిక నేపథ్యం గల సాంకేతిక పదాన్ని నిలిపాం. ‘దేవుని’ అనే సంబంధరూపం మూలంలోని అర్థసంబంధాన్ని కావాలనే అతిగా నిర్ధారించదు.
- issue: గర్భధారణ ప్రకటన యొక్క కాలార్థం
  choice: నీవు గర్భం ధరించి కుమారుణ్ణి కంటావు
  alternative: నీవు గర్భవతివి, కుమారుణ్ణి కంటావు
  rationale: వ్యాకరణ రూపం వర్తమాన గర్భస్థితిగా చదవదగినదైనా, కథాసందర్భం భావి ప్రకటనను సమర్థిస్తుంది. ప్రధాన పాఠం సహజమైన భావి అర్థాన్ని ఇస్తుంది; నిజమైన భాషా సందిగ్ధతను పాదసూచికలో కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం ఉపయోగించబడింది. ఆదేశాల్లో స్త్రీని ఉద్దేశించిన భావం సందర్భం ద్వారా స్పష్టంగా ఉంటుంది. సాంకేతికమైన ‘నాజీరు’ పదాన్ని వివరణాత్మకంగా మార్చకుండా పాఠంలో నిలిపి, పాదసూచికలో సంక్షిప్తంగా వివరించాం.
