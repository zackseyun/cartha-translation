id: JDG.13.3
reference: Judges 13:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֵּרָ֥א מַלְאַךְ יְהוָ֖ה אֶל הָ/אִשָּׁ֑ה וַ/יֹּ֣אמֶר אֵלֶ֗י/הָ הִנֵּה נָ֤א אַתְּ עֲקָרָה֙ וְ/לֹ֣א יָלַ֔דְתְּ וְ/הָרִ֖ית וְ/יָלַ֥דְתְּ בֵּֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/003.yaml
  text: And the angel of the LORD appeared to the woman and said to her, “Look, please—you are barren and have not borne children, but you will conceive and bear a son.”
translation:
  language: te
  text: 'యెహోవా దూత ఆ స్త్రీకి ప్రత్యక్షమై ఆమెతో ఇలా అన్నాడు: “ఇదిగో, నీవు వంధ్యురాలివి, పిల్లలను కనలేదు; అయినా నీవు గర్భం దాల్చి ఒక కుమారుణ్ణి కంటావు.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: యెహోవా దూత
  rationale: దైవ నామాన్ని వ్యక్తినామంగానే ఉంచుతూ, ‘మల్ఆఖ్’ అనే పదానికి సహజమైన తెలుగు ‘దూత’ను వాడాం.
- source_word: הִנֵּה נָא
  choice: చూడు
  rationale: హిన్నే దృష్టిని ఆకర్షించే సూచన; נא ఇక్కడ మాటను మృదువుచేసే కణం. తెలుగులో అసహజమైన ‘దయచేసి చూడు’కు బదులు సందర్భానుకూలంగా ‘చూడు’లో రెండింటి సంభాషణాత్మక భావం ప్రతిఫలిస్తుంది.
- source_word: עֲקָרָה
  choice: గొడ్రాలివి
  rationale: గర్భం ధరించలేని స్త్రీని సూచించే మూలపద భావాన్ని సంక్షిప్తంగా, సాధారణ బైబిలు తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: וְלֹא יָלַדְתְּ
  choice: ఇప్పటివరకు పిల్లలను కనలేదు
  rationale: మూలంలోని స్త్రీలింగ క్రియను సహజ తెలుగులో తెలిపి, కుమారుని గురించిన తదుపరి వాక్యంతో భేదాన్ని నిలుపుతుంది.
- source_word: וְהָרִית וְיָלַדְתְּ בֵּן
  choice: అయితే నీవు గర్భవతివై ఒక కుమారుణ్ణి కంటావు
  rationale: వావ్ ఇక్కడ పరిస్థితికి విరుద్ధంగా వచ్చే వాగ్దానాన్ని కలుపుతుంది; గర్భం ధరించడం, కుమారుణ్ణి కనడం అనే రెండు దశలనూ నిలుపుకున్నాం.
theological_decisions:
- issue: దైవ నామం יהוה యొక్క అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: హీబ్రూ మూలంలో ఉన్న వ్యక్తిగత దైవ నామాన్ని బిరుదుతో భర్తీ చేయకుండా పారదర్శకంగా చూపిస్తుంది; ప్రత్యేక సిద్ధాంతార్థాన్ని జోడించదు.
- issue: ‘యెహోవా దూత’ యొక్క గుర్తింపు
  choice: యెహోవా దూత
  alternative: యెహోవాయే దూతగా
  rationale: మూలపాఠం వాడిన నిర్మాణాన్నే ఉంచి, దూత యొక్క ఖచ్చితమైన దైవశాస్త్రీయ గుర్తింపును అనువాదంలో ముందుగానే నిర్ణయించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరతను కాపాడుతూ సాధారణ పాఠకులకు సహజంగా ఉండే ప్రత్యక్ష సంభాషణ. ‘గొడ్రాలు’ కొంత సంప్రదాయ బైబిలు పదమైనప్పటికీ విస్తృతంగా అర్థమయ్యే సంక్షిప్త పదంగా ఎంపికైంది.
