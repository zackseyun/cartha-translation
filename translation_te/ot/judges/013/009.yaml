id: JDG.13.9
reference: Judges 13:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּשְׁמַ֥ע הָ/אֱלֹהִ֖ים בְּ/ק֣וֹל מָנ֑וֹחַ וַ/יָּבֹ֣א מַלְאַךְ֩ הָ/אֱלֹהִ֨ים ע֜וֹד אֶל הָ/אִשָּׁ֗ה וְ/הִיא֙ יוֹשֶׁ֣בֶת בַּ/שָּׂדֶ֔ה וּ/מָנ֥וֹחַ אִישָׁ֖/הּ אֵ֥ין עִמָּֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/009.yaml
  text: And God listened to the voice of Manoah, and the angel of God came again to the woman while she was sitting in the field, and Manoah her husband was not with her.
translation:
  language: te
  text: దేవుడు మానోహు స్వరాన్ని ఆలకించాడు. దేవుని దూత మళ్లీ ఆ స్త్రీ దగ్గరికి వచ్చాడు. ఆమె పొలంలో కూర్చొని ఉంది; ఆమె భర్త మానోహు ఆమెతో లేడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁמַע ... בְּקוֹל
  choice: మొర ఆలకించాడు
  rationale: שׁמע בקול అనే ప్రయోగం కేవలం శబ్దం వినడాన్ని కాక, మనోహు చేసిన ప్రార్థనను శ్రద్ధగా విని అనుకూలంగా స్పందించడాన్ని ఇక్కడ సూచిస్తుంది. సహజమైన తెలుగులో ‘మొర ఆలకించాడు’ ఆ భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: מָנוֹחַ
  choice: మానోహు
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగులో సుపరిచితమైన బైబిలు రూపానికి దగ్గరగా లిప్యంతరీకరించాం.
- source_word: מַלְאַךְ הָאֱלֹהִים
  choice: దేవుని దూత
  rationale: מַלְאָךְ అంటే ‘దూత/సందేశవాహకుడు’; ఈ కథనంలో దైవిక సందేశవాహకుడిని సూచిస్తుంది. ‘దేవుని దూత’ సహజంగా ఉండి మూలంలోని నిర్మాణాన్ని నిలుపుతుంది.
- source_word: עוֹד
  choice: మళ్లీ
  rationale: ఇది ఇంతకు ముందు జరిగిన రాక మరొకసారి జరిగిందని సూచిస్తుంది.
- source_word: הָאִשָּׁה
  choice: ఆ స్త్రీ
  rationale: మూలపాఠం ‘స్త్రీ’ అనే పదాన్నే వాడుతుంది; ‘భార్య’గా మార్చకుండా కథనంలోని సూచనను కాపాడాం.
- source_word: וְהִיא יוֹשֶׁבֶת בַּשָּׂדֶה
  choice: అప్పుడు ఆమె పొలంలో కూర్చొని ఉంది
  rationale: హీబ్రూ క్రియావిశేషణ రూపం దూత వచ్చిన సమయంలో కొనసాగుతున్న నేపథ్య చర్యను తెలియజేస్తుంది.
- source_word: אִישָׁהּ
  choice: ఆమె భర్త
  rationale: אִישׁ అక్షరార్థంగా ‘పురుషుడు’ అయినా, స్త్రీలింగ ఏకవచన స్వామ్యప్రత్యయంతో ఈ సందర్భంలో సహజంగా ‘ఆమె భర్త’ అని అర్థం.
- source_word: אֵין עִמָּהּ
  choice: ఆమెతో లేడు
  rationale: ప్రతికూల అస్తిత్వ పదం మరియు עִם కలయిక సమీపంలో లేదా తోడుగా లేకపోవడాన్ని నేరుగా తెలియజేస్తుంది.
theological_decisions:
- issue: הָאֱלֹהִים పదం యొక్క అనువాదం
  choice: దేవుడు
  alternative: దేవుళ్లు
  rationale: אֱלֹהִים రూపపరంగా బహువచనమైనా, ఇక్కడ ఏకవచన క్రియతో వచ్చి ఇశ్రాయేలు దేవుణ్ణి సూచిస్తుంది. అందువల్ల ‘దేవుడు’ అనేది తక్షణ వ్యాకరణం, సందర్భం కోరే అనువాదం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా గౌరవప్రదమైన కథన శైలిని వాడాం. పొడవైన హీబ్రూ సమన్వయ వాక్యాన్ని సహజ తెలుగు ప్రవాహం కోసం మూడు వాక్యాలుగా విభజించాం; భావ సంబంధాన్ని యథాతథంగా ఉంచాం.
