    rationale: וַיֹּאמֶר ప్రధానంగా కథన ముందడుగును సూచిస్తుంది; తెలుగు వాక్యంలో ‘మానోహ తన భార్యతో ఇలా అన్నాడు’ అని నేరుగా అనువదిస్తే మూలానికి సమానంగా, ప్రవాహంగా ఉంటుంది.
