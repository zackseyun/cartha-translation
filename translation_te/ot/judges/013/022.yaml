source:
  edition: WLC
  text: וַ/יֹּ֧אמֶר מָנ֛וֹחַ אֶל אִשְׁתּ֖/וֹ מ֣וֹת נָמ֑וּת כִּ֥י אֱלֹהִ֖ים רָאִֽינוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/022.yaml
  text: And Manoah said to his wife[a], “We will surely die, because we have seen God.”
translation:
  language: te
  text: 'మానోహ తన భార్యతో ఇలా అన్నాడు: “మనం తప్పకుండా చనిపోతాం, ఎందుకంటే మనం దేవుణ్ణి చూశాం[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఒక దేవుణ్ణి” లేదా “ఒక దివ్యమైన వ్యక్తిని.” హీబ్రూ אֱלֹהִים అనే పదం కొన్ని సందర్భాల్లో విస్తృతార్థంలో ఒక దివ్యమైన వ్యక్తిని సూచించవచ్చు; అయితే ఇక్కడి సందర్భంలో “దేవుణ్ణి” అనే అర్థమే ఎక్కువగా అనుకూలిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... అన్నాడు
  rationale: వావ్-వరుస కథన క్రియను ఆధునిక తెలుగు కథన ప్రవాహానికి సహజంగా ‘అప్పుడు ... అన్నాడు’ అని అందించాం.
- source_word: מָנוֹחַ
  choice: మానోహ
  rationale: వ్యక్తి పేరును హీబ్రూ ఉచ్చారణకు సమీపంగా లిప్యంతరీకరించాం.
- source_word: אֶל אִשְׁתּוֹ
  choice: తన భార్యతో
  rationale: సంబంధాన్ని సూచించే హీబ్రూ ప్రయోగానికి సహజమైన తెలుగు రూపం.
- source_word: מוֹת נָמוּת
  choice: మనం తప్పకుండా చనిపోతాం
  rationale: క్రియార్థక నామం మరియు అసంపూర్ణ క్రియ కలయిక ఇచ్చే బలమైన నిశ్చయార్థాన్ని ‘తప్పకుండా’ ద్వారా నిలిపాం.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: మానోహ భయానికి కారణాన్ని పరిచయం చేసే స్పష్టమైన కారణార్థక అనుసంధానం.
- source_word: אֱלֹהִים
  choice: దేవుణ్ణి
  rationale: ఈ సందర్భంలో దేవునితో జరిగిన సాక్షాత్కారమే ప్రధాన భావం; అయినప్పటికీ హీబ్రూ పదానికి ఉన్న విస్తృత అర్థసాధ్యతను పాదటీపులో ఉంచాం.
- source_word: רָאִינוּ
  choice: మనం ... చూశాం
  rationale: మొదటి పురుష బహువచన సంపూర్ణ క్రియను సహజమైన తెలుగు భూతకాలంగా అందించాం; దాని తక్షణ ఫలితం తరువాతి సందర్భంలో స్పష్టంగా ఉంది.
theological_decisions:
- issue: యెహోవా దూత ప్రత్యక్షమైన తరువాత మానోహ పలికిన మాటలో אֱלֹהִים పదం
  choice: దేవుడు
  alternative: ఒక దేవుడు; ఒక దివ్య జీవి
  rationale: న్యాయాధిపతులు 13లోని సమీప సందర్భం యెహోవా దూత ప్రత్యక్షతను దేవునితో సాక్షాత్కారమనే రీతిలో చూపుతుంది; దేవుణ్ణి చూస్తే మరణిస్తామనే మానోహ భయానికీ ‘దేవుడు’ సరిపోతుంది. అయితే దూత గుర్తింపులోని కథనపరమైన రహస్యాన్ని పూర్తిగా పరిష్కరించకుండా ప్రత్యామ్నాయ అర్థాలను పాదటీపులో పేర్కొన్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన వాక్య నిర్మాణం వాడాం. ‘మనం’ సాధారణ పాఠకులకు సహజంగా ఉండగా, ‘తప్పకుండా’ మూలంలోని గాఢ నిశ్చయాన్ని స్పష్టంగా తెలియజేస్తుంది. పాదటీపు సూచిక [a] ప్రధాన పాఠ్యంలో చేర్చబడింది.
