  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֶּעְתַּ֥ר מָנ֛וֹחַ אֶל יְהוָ֖ה וַ/יֹּאמַ֑ר בִּ֣י אֲדוֹנָ֔/י אִ֣ישׁ הָ/אֱלֹהִ֞ים אֲשֶׁ֣ר שָׁלַ֗חְתָּ יָבוֹא נָ֥א עוֹד֙ אֵלֵ֔י/נוּ וְ/יוֹרֵ֕/נוּ מַֽה נַּעֲשֶׂ֖ה לַ/נַּ֥עַר הַ/יּוּלָּֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/008.yaml
  text: Then Manoah entreated Yahweh and said[a], “Please, Lord[c][b], let the man of God whom you sent come again to us and teach us what we should do for the boy who is to be born.”
translation:
  language: te
  text: 'అప్పుడు మనోహ యహ్వేను వేడుకొని[a] ఇలా అన్నాడు: “ప్రభువా, దయచేసి, నీవు పంపిన ఆ దైవజనుడు[b] మళ్లీ మా దగ్గరకు రానిమ్ము; పుట్టబోయే బాలుని కొరకు మేము ఏమి చేయాలో ఆయన మాకు బోధించనిమ్ము.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “హృదయపూర్వకంగా ప్రార్థించి.” హీబ్రూ క్రియ తీవ్రమైన వేడుకోలును సూచిస్తుంది.'
    reason: lexical_alternative
  - marker: b
    text: 'అక్షరార్థంగా: “దేవుని మనిషి.” మనోహకు అప్పటివరకు ఉన్న అవగాహన ప్రకారమే అతడు ఆ వ్యక్తిని ఇలా పేర్కొన్నాడు; అతని గుర్తింపును ఇక్కడ మరింత నిర్దిష్టంగా చెప్పలేదు.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֶּעְתַּר
  choice: వేడుకొని
  rationale: ఈ క్రియ సాధారణంగా అడగడం కంటే ఎంతో earnest అయిన విన్నపాన్ని, దేవునికి చేసే ప్రార్థనాత్మక వేడుకోలును సూచిస్తుంది. ‘వేడుకొని’ ఆ తీవ్రతను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: హీబ్రూ దైవనామమైన నాలుగు అక్షరాల నామాన్ని బిరుదుతో మార్చకుండా, దాని సాధారణ పండిత లిప్యంతరీకరణకు అనుగుణంగా తెలుగులో ‘యహ్వే’ అని ఇచ్చాం.
- source_word: בִּי אֲדֹנָי
  choice: ప్రభువా, దయచేసి
  rationale: בִּי ఇక్కడ వినయపూర్వక విన్నప సూచకం; אֲדֹנָי దేవునికి గౌరవపూర్వక సంబోధన. తెలుగు వాక్యప్రవాహానికి అనుగుణంగా ‘ప్రభువా, దయచేసి’ అని అనువదించాం.
- source_word: אִישׁ הָאֱלֹהִים
  choice: దైవజనుడు
  rationale: అక్షరార్థంగా ‘దేవుని మనిషి.’ తెలుగులో స్థిరపడి, సహజంగా వినిపించే ‘దైవజనుడు’ అనే పదం దేవునిచేత నియమించబడిన మనిషి అనే భావాన్ని నిలుపుతుంది; సందేశకుడు లేదా దేవదూత అని ముందుగానే నిర్ధారించదు.
- source_word: יָבוֹא נָא עוֹד אֵלֵינוּ
  choice: మళ్లీ మా దగ్గరికి వచ్చి … బోధించనివ్వు
  rationale: అసంపూర్ణ క్రియారూపం మరియు נָא కలిసి వినయపూర్వక అభ్యర్థనను తెలియజేస్తాయి; עוֹד ‘మళ్లీ’ అనే అర్థాన్ని ఇస్తుంది. తెలుగులో మొత్తం సంయుక్త విన్నపాన్ని సహజంగా ‘వచ్చి … బోధించనివ్వు’ అని నిర్మించాం.
- source_word: וְיוֹרֵנוּ
  choice: మాకు బోధించనివ్వు
  rationale: ירה హిఫిల్ రూపం బోధించడం లేదా ఉపదేశించడం అనే అర్థం ఇస్తుంది. ‘మాకు బోధించు’ కంటే, దైవజనుడు రావాలని దేవునికి చేస్తున్న అభ్యర్థనలో ‘బోధించనివ్వు’ సంబంధాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: מַה נַּעֲשֶׂה
  choice: మేము ఏమి చేయాలో
  rationale: ఇది ఆచరణాత్మక మార్గదర్శకత్వం కోసం అడిగే deliberative ప్రశ్న. ‘మేము ఏమి చేయాలో’ ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: לַנַּעַר הַיּוּלָּד
  choice: పుట్టబోయే బాలుని విషయంలో
  rationale: נַעַר పురుష శిశువును సూచిస్తుంది; passive participle הַיּוּלָּד భవిష్యత్తులో పుట్టబోయే వాడిని సూచిస్తుంది. לְ సంబంధాన్ని తెలుగులో సహజంగా ‘విషయంలో’ అని వ్యక్తం చేశాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామాన్ని ఎలా అనువదించాలి
  choice: యహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్నే ఉపయోగిస్తుంది. దానిని బిరుదుతో భర్తీ చేయకుండా ‘యహ్వే’గా లిప్యంతరీకరించడం మూలంలోని ప్రత్యేకతను కాపాడుతుంది.
- issue: אִישׁ הָאֱלֹהִים ను దేవదూతగా ముందుగానే గుర్తించాలా
  choice: దైవజనుడు
  alternative: దేవుని సందేశకుడు; దేవదూత
  rationale: ఈ దశలో మనోహ అతణ్ణి ‘దేవుని మనిషి’ అని మాత్రమే పేర్కొంటున్నాడు. కథలో తరువాత తెలిసే గుర్తింపును ఇక్కడికి తీసుకురాకుండా కథన ఉత్కంఠను నిలిపాం.
- issue: לַנַּעַר లోని లింగ సూచన
  choice: బాలుని
  alternative: బిడ్డను; శిశువును
  rationale: హీబ్రూ నామవాచకం పురుషలింగంలో ఉండి, సందర్భంలో పుట్టబోయే మగబిడ్డను సూచిస్తుంది. అందువల్ల లింగాన్ని తటస్థీకరించకుండా ‘బాలుడు’ను వాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని అనుసరించాం. ‘దైవజనుడు’ వంటి స్థిరమైన తెలుగు పదాన్ని వాడుతూ మూలంలోని కథన దృక్కోణాన్ని కాపాడాం. సంభాషణను సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా ఉంచి, దైవనామాన్ని ‘యహ్వే’గా ప్రత్యక్షంగా ఇచ్చాం.
