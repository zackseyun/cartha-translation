  text: בַּ/יָּמִ֣ים הָ/הֵ֔ם אֵ֥ין מֶ֖לֶךְ בְּ/יִשְׂרָאֵ֑ל וּ/בַ/יָּמִ֣ים הָ/הֵ֗ם שֵׁ֣בֶט הַ/דָּנִ֞י מְבַקֶּשׁ ל֤/וֹ נַֽחֲלָה֙ לָ/שֶׁ֔בֶת כִּי֩ לֹֽא נָ֨פְלָה לּ֜/וֹ עַד הַ/יּ֥וֹם הַ/ה֛וּא בְּ/תוֹךְ שִׁבְטֵ֥י יִשְׂרָאֵ֖ל בְּ/נַחֲלָֽה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/001.yaml
  text: In those days there was no king in Israel[a]. And in those days the tribe of the Danites was seeking for itself an inheritance to dwell in[b], because up to that day no inheritance had fallen to it among the tribes of Israel.
translation:
  language: te
  text: ఆ రోజుల్లో ఇశ్రాయేలులో రాజు లేడు. ఆ రోజుల్లో దాను గోత్రం నివసించడానికి తనకోసం ఒక స్వాస్థ్యాన్ని వెదుకుతూ ఉంది; ఎందుకంటే ఆ దినం వరకు ఇశ్రాయేలు గోత్రాల మధ్య స్వాస్థ్యంగా దానికి భూమి కేటాయించబడలేదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “దానికి స్వాస్థ్యం పడలేదు.” ఇది చీటి ద్వారా గోత్ర భూభాగం కేటాయించబడడాన్ని సూచించే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין מֶלֶךְ בְּיִשְׂרָאֵל
  choice: ఇశ్రాయేలులో రాజు లేడు
  rationale: హీబ్రూ అస్తిత్వ-నిషేధ వాక్యాన్ని సహజమైన ఆధునిక తెలుగులో నేరుగా అందిస్తుంది; అదనపు రాజకీయ లేదా ధార్మిక వ్యాఖ్యానాన్ని చేర్చదు.
- source_word: שֵׁבֶט הַדָּנִי
  choice: దానీయుల గోత్రం
  rationale: దాను వంశానికి చెందిన సమూహాన్ని సూచించే విశేషణాత్మక నిర్మాణాన్ని తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: מְבַקֶּשׁ לוֹ
  choice: తనకోసం ... వెదుకుతూ ఉంది
  rationale: వర్తమాన కృదంతంలోని కొనసాగుతున్న చర్య భావాన్ని, ఏకవచన సమూహనామమైన గోత్రాన్ని సూచించే ప్రతిఫలార్థక భావంతో నిలుపుతుంది.
- source_word: נַחֲלָה
  choice: స్వాస్థ్యం
  rationale: ఇక్కడ పూర్విక లేదా నిబంధన సంబంధమైన భూభాగపు వాటాను సూచిస్తుంది; సాధారణ ‘ఆస్తి’ కంటే గోత్రానికి కేటాయించబడిన భూమి భావాన్ని మెరుగ్గా నిలుపుతుంది.
- source_word: לָשֶׁבֶת
  choice: నివసించడానికి
  rationale: భూభాగంలో స్థిరపడి నివసించే ఉద్దేశాన్ని సహజమైన ఆధునిక తెలుగులో తెలుపుతుంది.
- source_word: כִּי לֹא נָפְלָה לוֹ ... בְּנַחֲלָה
  choice: ఎందుకంటే ... వారికి స్వాస్థ్యంగా భూమి దక్కలేదు
  rationale: ‘పడలేదు’ అనే హీబ్రూ చీటి-కేటాయింపు నుడికారాన్ని తెలుగులో అర్థవంతంగా ‘దక్కలేదు’ అని అందిస్తూ, సందర్భం భూస్వాస్థ్యమని స్పష్టం చేస్తుంది.
- source_word: עַד הַיּוֹם הַהוּא
  choice: ఆ రోజు వరకు
  rationale: కథకుని గతకాల దృష్టికోణాన్ని యథాతథంగా నిలుపే సహజ కాలవాచకం.
- source_word: בְּתוֹךְ שִׁבְטֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు గోత్రాల మధ్య
  rationale: గోత్రాల సమూహంలో దానుకు కేటాయింపు జరగలేదనే పంపిణీ సంబంధాన్ని స్పష్టంగా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: ‘ఇశ్రాయేలులో రాజు లేడు’ అనే కథన వాక్యం
  choice: చారిత్రక-రాజకీయ పరిశీలనగా నేరుగా ఉంచడం
  alternative: రాజరికాన్ని సమర్థించే స్పష్టమైన వ్యాఖ్యగా లేదా న్యాయాధిపతుల కాలంపై బలమైన ధార్మిక తీర్పుగా విస్తరించడం
  rationale: హీబ్రూ పాఠ్యం రాజు లేడని మాత్రమే చెబుతుంది. న్యాయాధిపతుల గ్రంథంలో ఈ సూత్రవాక్యానికి కథనపరమైన బరువు ఉన్నప్పటికీ, అనువాదం దానిలో లేని రాజకీయ లేదా సిద్ధాంతపరమైన తీర్పును చేర్చకూడదు.
- issue: దాను గోత్రానికి స్వాస్థ్యం ‘దక్కలేదు’ అనే వాక్యానికి యెహోషువ గ్రంథంలోని ముందరి కేటాయింపుతో కనిపించే ఉద్రిక్తత
  choice: ఈ వచనంలోని వాదనను యథాతథంగా నిలిపి, ఆ ఉద్రిక్తతను పరిష్కరించకుండా ఉంచడం
  alternative: ‘వారు తమకు ఇచ్చిన స్వాస్థ్యాన్ని పూర్తిగా స్వాధీనం చేసుకోలేదు’ అని వివరణాత్మకంగా మార్చడం
  rationale: మూల వచనం నేరుగా స్వాస్థ్యం వారికి పడలేదని చెబుతుంది. చారిత్రక సమన్వయాన్ని ప్రధాన పాఠ్యంలో చేర్చడం మూలంలోని భావాన్ని మించిపోతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవభరితమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ‘స్వాస్థ్యం’ అనే బైబిలు-భూభాగ పదాన్ని సందర్భ స్పష్టత కోసం ‘భూమి’తో కలిపి ఉపయోగించాం. సమూహనామమైన ‘గోత్రం’తో మొదలై, దానీయులను ఉద్దేశించిన తరువాతి వాక్యంలో సహజ తెలుగు ప్రకారం ‘వారికి’ అనే బహువచన సూచనను వాడాం.
