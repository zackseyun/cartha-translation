revisions:
- from: ఆ రోజుల్లో ఇశ్రాయేలులో రాజు లేడు. ఆ రోజుల్లో దానీయుల గోత్రం నివసించడానికి తనకోసం ఒక స్వాస్థ్యాన్ని వెదుకుతూ ఉంది; ఎందుకంటే ఆ రోజు వరకు ఇశ్రాయేలు గోత్రాల మధ్య వారికి స్వాస్థ్యంగా భూమి దక్కలేదు.[a]
  to: ఆ రోజుల్లో ఇశ్రాయేలులో రాజు లేడు. ఆ రోజుల్లో దాను గోత్రం నివసించడానికి తనకోసం ఒక స్వాస్థ్యాన్ని వెదుకుతూ ఉంది; ఎందుకంటే ఆ దినం వరకు ఇశ్రాయేలు గోత్రాల మధ్య స్వాస్థ్యంగా దానికి భూమి కేటాయించబడలేదు.[a]
  rationale: The revision uses the conventional tribal designation ‘దాను గోత్రం,’ keeps the collective noun grammatically singular throughout, and states the territorial-allotment sense naturally. The note preserves the source-language idiom of an inheritance ‘falling’ to the tribe. The repeated temporal phrase and the noninterpretive statement that Israel had no king are retained.
