id: JDG.18.10
reference: Judges 18:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כְּ/בֹאֲ/כֶ֞ם תָּבֹ֣אוּ אֶל עַ֣ם בֹּטֵ֗חַ וְ/הָ/אָ֨רֶץ֙ רַחֲבַ֣ת יָדַ֔יִם כִּֽי נְתָנָ֥/הּ אֱלֹהִ֖ים בְּ/יֶדְ/כֶ֑ם מָקוֹם֙ אֲשֶׁ֣ר אֵֽין שָׁ֣ם מַחְס֔וֹר כָּל דָּבָ֖ר אֲשֶׁ֥ר בָּ/אָֽרֶץ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/010.yaml
  text: When you go[a], you will come to a secure people, and the land is broad; for God has given it into your hand[b], a place where there is no lack of anything that is in the land.
translation:
  language: te
  text: మీరు అక్కడికి చేరినప్పుడు, భద్రంగా నివసిస్తున్న ప్రజల వద్దకు చేరుకుంటారు[a]. ఆ దేశం విశాలంగా ఉంది[b]; ఎందుకంటే దేవుడు దానిని మీ చేతికి అప్పగించాడు—అది ఆ దేశంలో ఉన్న దేనికీ కొదువలేని స్థలం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “క్షేమంగా నివసిస్తున్న ప్రజలు,” లేదా “అనుమానం లేని ప్రజలు.” హెబ్రీ పదబంధం తాము సురక్షితంగా ఉన్నామనే భావంతో జీవిస్తున్న ప్రజలను వర్ణిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “చేతులు విశాలంగా ఉన్నది”; ఇది విస్తారమైన దేశాన్ని సూచించే హెబ్రీ నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּ/בֹאֲ/כֶם ... תָּבֹאוּ
  choice: మీరు అక్కడికి చేరినప్పుడు ... వస్తారు
  rationale: హెబ్రీలోని క్రియానామ రూపం, సమాపక క్రియ కలిపి రాకను బలంగా వ్యక్తం చేస్తున్నాయి. తెలుగులో సహజంగా ఉండేలా ‘చేరినప్పుడు ... వస్తారు’ అని అనువదించాం.
- source_word: עַם בֹּטֵחַ
  choice: భద్రంగా నివసిస్తున్న ప్రజలు
  rationale: ఈ పదబంధం తమకు భద్రత ఉందనే భావంతో జీవిస్తున్న ప్రజలను సూచిస్తుంది. సందర్భంలో వారు అప్రమత్తంగా లేరనే భావం ఉండవచ్చు గాని, దాన్నే ప్రధాన పాఠ్యంలో ఖచ్చితార్థంగా నిర్ధారించలేదు.
- source_word: וְהָאָרֶץ רַחֲבַת יָדַיִם
  choice: ఆ దేశం విశాలంగా ఉంది
  rationale: ‘చేతులు విశాలంగా ఉన్నది’ అనే హెబ్రీ నుడికారం విస్తారమైన ప్రదేశాన్ని సూచిస్తుంది. సహజమైన తెలుగులో దాని భావాన్ని ‘విశాలంగా ఉంది’ అని ఇచ్చాం.
- source_word: כִּי נְתָנָהּ אֱלֹהִים בְּיֶדְכֶם
  choice: ఎందుకంటే దేవుడు దాన్ని మీ చేతికి అప్పగించాడు
  rationale: సమాపక క్రియ ఆ కార్యాన్ని నిశ్చయంగా జరిగిపోయినదిగా వక్తలు చెబుతున్న భావాన్ని నిలుపుతుంది. ‘మీ చేతికి’ అనే ఏకవచన నుడికారం సమూహాన్ని ఉద్దేశించిన హెబ్రీ రూపాన్ని ప్రతిబింబిస్తుంది.
- source_word: מָקוֹם אֲשֶׁר אֵין שָׁם מַחְסוֹר כָּל דָּבָר אֲשֶׁר בָּאָרֶץ
  choice: ఆ దేశంలో ఉండే దేనికీ కొదువలేని స్థలం
  rationale: מַחְסוֹר అంటే కొరత లేదా కొదువ. ఇక్కడ הָאָרֶץ ముందుగా ప్రస్తావించిన నిర్దిష్ట దేశాన్నే సూచిస్తున్నందున ‘భూమి మీద’ కాక ‘ఆ దేశంలో’ అని అనువదించాం.
theological_decisions:
- issue: אֱלֹהִים పదాన్ని అనువదించడం
  choice: దేవుడు
  alternative: దేవతలు / ఒక దేవుడు
  rationale: ఇక్కడ אֱלֹהִים ఏకవచన క్రియతో వచ్చింది; గూఢచారుల మాటల్లో కార్యం చేస్తున్న ఏకవచన దేవుణ్ణి సూచిస్తుంది. అందువల్ల ‘దేవుడు’ అనేది మూలపాఠానికి తగిన సహజ అనువాదం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే గౌరవప్రదమైన శైలిని వాడాం. మూలంలోని భద్రత–అప్రమత్తత లేమి అనే భావపరిధిని పాదసూచికలో నిలిపి, ప్రధాన పాఠ్యంలో అతివ్యాఖ్యానం చేయలేదు.
