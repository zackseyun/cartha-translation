id: JDG.18.16
reference: Judges 18:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/שֵׁשׁ מֵא֣וֹת אִ֗ישׁ חֲגוּרִים֙ כְּלֵ֣י מִלְחַמְתָּ֔/ם נִצָּבִ֖ים פֶּ֣תַח הַ/שָּׁ֑עַר אֲשֶׁ֖ר מִ/בְּנֵי דָֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/016.yaml
  text: And six hundred men[a], armed with their weapons of war, were standing at the entrance of the gate; these were from the sons of Dan.
translation:
  language: te
  text: మరియు తమ యుద్ధాయుధాలను ధరించిన ఆరువందల మంది పురుషులు ద్వార ప్రవేశం వద్ద నిలబడి ఉన్నారు; వారు దాను కుమారులలోనివారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వారు దాను వంశస్థులు.’ అక్షరార్థంగా, ‘వారు దాను కుమారులలోనివారు.’
    reason: ‘దాను కుమారులు’ అనేది వంశీయ గుర్తింపును తెలిపే హీబ్రూ వ్యక్తీకరణ; దాని సహజ తెలుగు అర్థాన్ని ప్రత్యామ్నాయంగా అందిస్తుంది.
lexical_decisions:
- source_word: וְ/שֵׁשׁ מֵאוֹת אִישׁ
  choice: ఆరువందల మంది పురుషులు
  rationale: సంఖ్య తర్వాత ఏకవచన రూపంలో ఉన్న אִישׁ సమూహార్థకంగా వాడబడింది; అందువల్ల తెలుగులో సహజమైన బహువచన భావాన్ని వ్యక్తం చేశాం. వాక్యసంధిలోని וְ భావం ముందరి సందర్భంతో సహజంగా కలిసిపోతుంది కాబట్టి ప్రత్యేకంగా ‘మరియు’ అని పెట్టలేదు.
- source_word: חֲגוּרִים
  choice: ధరించిన
  rationale: ఈ కృదంతానికి అక్షరార్థంగా ‘నడుముకు కట్టుకున్న’ అనే భావం ఉన్నా, ఇక్కడ యుద్ధాయుధాలతో సిద్ధంగా ఉండడాన్ని సూచిస్తుంది. ‘ధరించిన’ అనే పదం ఆ దృశ్యాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: כְּלֵי מִלְחַמְתָּם
  choice: తమ యుద్ధాయుధాలను
  rationale: כְּלִי అనే పదం సామగ్రి లేదా పనిముట్టు అనే విస్తృత అర్థం కలిగినా, యుద్ధ సందర్భంలో ఆయుధాలను సూచిస్తుంది. ‘తమ’ అనే పదం హీబ్రూ స్వామ్య ప్రత్యయాన్ని నిలుపుతుంది.
- source_word: נִצָּבִים
  choice: నిలబడి ఉన్నారు
  rationale: కృదంత రూపంలోని దృశ్యవర్ణనను, వారు అక్కడ నిలిచి ఉన్న స్థితిని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: פֶּתַח הַשָּׁעַר
  choice: గుమ్మపు ప్రవేశం దగ్గర
  rationale: פֶּתַח అంటే తెరువు లేదా ప్రవేశం; הַשָּׁעַר అంటే గుమ్మం. రెండు పదాల భావాన్నీ అనవసర పునరుక్తి లేకుండా కాపాడే సహజ తెలుగు ప్రయోగం ఇది.
- source_word: אֲשֶׁר מִבְּנֵי דָן
  choice: వీరు దాను కుమారులలోనివారు
  rationale: సంబంధ వాక్యం ఆ ఆరువందల మందిని గుర్తిస్తుంది. ‘దాను కుమారులు’ అనే హీబ్రూ వంశపారంపర్య వ్యక్తీకరణను ప్రధాన పాఠ్యంలో నిలుపుతూ, తెలుగులో అర్థమయ్యేలా ‘వీరు’ అని స్పష్టం చేశాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీర కథనశైలిని ఉపయోగించాం. మూలంలోని దృశ్యవర్ణనను, వంశీయ గుర్తింపును నిలిపాం.
