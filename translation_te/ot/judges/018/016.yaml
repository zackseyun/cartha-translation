  terminology: “దాను కుమారులు” appropriately preserves the Hebrew kinship/tribal expression, while the footnote supplies “దాను వంశస్థులు” as a natural alternative. “యుద్ధాయుధాలు” suitably represents the military equipment/weapons without over-specifying it.
