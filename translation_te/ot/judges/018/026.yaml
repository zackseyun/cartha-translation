  yaml_path: translation/ot/judges/018/026.yaml
  text: Then the sons of Dan went on their way, and Micah saw that they were stronger than he was, so he turned and went back to his house.
translation:
  language: te
  text: దాను వంశీయులు తమ దారిన వెళ్లిపోయారు. మీకా వారు తనకంటే బలవంతులని చూసి, వెనుదిరిగి తన ఇంటికి వెళ్లిపోయాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְנֵי דָן
  choice: దాను వంశీయులు
  rationale: హీబ్రూ పదబంధం అక్షరార్థంగా ‘దాను కుమారులు’ అయినా, ఇక్కడ అది దాను గోత్రానికి చెందినవారిని జాతి/గోత్రార్థంలో సూచిస్తుంది. ఆధునిక తెలుగులో ‘దాను వంశీయులు’ సహజంగా, స్పష్టంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: לְדַרְכָּם
  choice: తమ దారిన వెళ్లిపోయారు
  rationale: ప్రయాణాన్ని కొనసాగించి వెళ్లిపోవడాన్ని సూచించే హీబ్రూ ప్రయోగానికి ఇది సహజమైన తెలుగు రూపం.
- source_word: חֲזָקִים הֵמָּה מִמֶּנּוּ
  choice: వారు తనకంటే బలవంతులని
  rationale: חזק తో מן ఉన్న తులనాత్మక నిర్మాణాన్ని ‘తనకంటే బలవంతులు’ అని నేరుగా ఉంచింది; ‘తన వల్ల వారిని ఎదుర్కోలేడు’ వంటి అదనపు వ్యాఖ్యానాన్ని చేర్చలేదు.
- source_word: וַיִּפֶן
  choice: వెనుదిరిగి
  rationale: తిరగడాన్ని సూచించే క్రియను, వెంటనే వచ్చే తిరిగి వెళ్లడమనే చర్యతో సహజమైన తెలుగు క్రమంలో కలిపింది.
- source_word: וַיָּשָׁב אֶל בֵּיתוֹ
  choice: తన ఇంటికి వెళ్లిపోయాడు
  rationale: שׁוב యొక్క తిరిగి వెళ్లే భావాన్ని సందర్భంలో సహజంగా వ్యక్తం చేస్తూ, אֶל בֵּיתוֹ లోని దిశను ‘తన ఇంటికి’ అని నిలుపుతుంది.
- source_word: בֵּיתוֹ
  choice: తన ఇల్లు
  rationale: בית కు ప్రత్యక్ష సమానార్థమైన ‘ఇల్లు’ను సందర్భానుసార విభక్తితో ‘తన ఇంటికి’గా ఉపయోగించింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు స్పష్టంగా, గౌరవప్రదమైన కథన శైలిలో అనువదించబడింది. మూలంలోని వరుస చర్యలు—దాను వంశీయులు వెళ్లిపోవడం, మీకా వారి బలాన్ని గ్రహించడం, వెనుదిరిగి ఇంటికి వెళ్లడం—సంక్షిప్తంగా నిలుపబడ్డాయి.
