id: JDG.18.8
reference: Judges 18:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּבֹ֨אוּ֙ אֶל אֲחֵי/הֶ֔ם צָרְעָ֖ה וְ/אֶשְׁתָּאֹ֑ל וַ/יֹּאמְר֥וּ לָ/הֶ֛ם אֲחֵי/הֶ֖ם מָ֥ה אַתֶּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/008.yaml
  text: Then they came to their brothers at Zorah and Eshtaol[a], and their brothers said to them[b], “What is with you?”
translation:
  language: te
  text: ఆ తరువాత వారు జోరాలోను ఎష్టాయోలులోను ఉన్న తమ సహోదరుల[a] దగ్గరకు వచ్చారు. వారి సహోదరులు వారితో, “మీ సంగతి ఏమిటి?”[b] అని అడిగారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తమ బంధువుల”; హీబ్రూ పదం సొంత సహోదరులనే కాక ఒకే వంశం లేదా గోత్రానికి చెందిన బంధువులను కూడా సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ ప్రశ్న చాలా క్లుప్తంగా, అధ్యాహారార్థకంగా ఉంది; అక్షరార్థంగా, “ఏమి, మీరు?” వారు తెచ్చిన సమాచారం లేదా వారి పరిస్థితి గురించి అడుగుతున్న ప్రశ్న కావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: ఆ తరువాత వారు ... వచ్చారు
  rationale: వయ్యిక్తోల్ రూపం కథనాన్ని ముందుకు నడిపిస్తుంది; ‘ఆ తరువాత’ సహజమైన తెలుగు కథన క్రమాన్ని తెలియజేస్తుంది.
- source_word: אֶל אֲחֵיהֶם
  choice: తమ సహోదరుల దగ్గరికి
  rationale: אָח అనే పదం సొంత అన్నదమ్ములనే కాక వంశ లేదా గోత్ర బంధువులను కూడా సూచించవచ్చు. ప్రధాన పాఠంలో మూలంలోని బంధుత్వ పదాన్ని నిలిపి, విస్తృత అర్థాన్ని పాదసూచికలో తెలిపాం.
- source_word: צָרְעָה וְאֶשְׁתָּאֹל
  choice: జొర్యాలోను ఎష్తాయోలులోను
  rationale: ఇవి స్థలనామాలు కాబట్టి తెలుగులో ధ్వన్యనుసారంగా రాశాం; ప్రదేశాల్లో ఉన్న సహోదరుల దగ్గరికి వెళ్లారనే వాక్య సంబంధాన్ని సహజంగా వ్యక్తం చేశాం.
- source_word: וַיֹּאמְרוּ לָהֶם אֲחֵיהֶם
  choice: వారి సహోదరులు వారిని ... అని అడిగారు
  rationale: హీబ్రూ వాక్యంలో ఉన్న స్పష్టమైన కర్తను నిలిపాం. ప్రశ్న సందర్భంలో తెలుగు సహజత్వం కోసం ‘చెప్పారు’కు బదులు ‘అడిగారు’ వాడాం.
- source_word: מָה אַתֶּם
  choice: మీ సంగతి ఏమిటి?
  rationale: మూలంలోని ప్రశ్న చాలా క్లుప్తమైనది, అధ్యాహారార్థకమైనది—అక్షరార్థంగా ‘ఏమి, మీరు?’ అనే రూపం. నివేదికను అడుగుతున్నదనే భావాన్ని అతిగా నిర్దిష్టం చేయకుండా, తెలుగులో సహజమైన క్లుప్త ప్రశ్నగా అనువదించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కథన శైలి సహజంగా, గౌరవప్రదంగా ఉంచబడింది. మూలంలోని పునరుక్తి మరియు చివరి ప్రశ్నలోని ఉద్దేశపూర్వక అస్పష్టత నిలిపివేయబడ్డాయి.
