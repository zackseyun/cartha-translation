source:
  edition: WLC
  text: וַ/יִּיטַב֙ לֵ֣ב הַ/כֹּהֵ֔ן וַ/יִּקַּח֙ אֶת הָ֣/אֵפ֔וֹד וְ/אֶת הַ/תְּרָפִ֖ים וְ/אֶת הַ/פָּ֑סֶל וַ/יָּבֹ֖א בְּ/קֶ֥רֶב הָ/עָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/020.yaml
  text: And the priest’s heart was glad[a], and he took the ephod, the household idols, and the carved image[b], and went into the midst of the people.
translation:
  language: te
  text: అప్పుడు యాజకుని హృదయం సంతోషించింది. అతడు ఏఫోదును, గృహదేవతల విగ్రహాలను[a], చెక్కిన ప్రతిమను[b] తీసుకొని ప్రజల మధ్యకు వెళ్లాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘తెరాఫీములను.’ ఈ హీబ్రూ పదం ఇంటికి సంబంధించిన ఆరాధనా వస్తువులను లేదా గృహదేవతలను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘విగ్రహాన్ని.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּיטַב לֵב הַכֹּהֵן
  choice: యాజకుని హృదయం సంతోషించింది
  rationale: హీబ్రూ నుడికారంలోని ‘హృదయం’ అనే రూపకాన్ని నిలుపుతూ, యాజకుడు సంతోషించాడనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: הָאֵפוֹד
  choice: ఏఫోదు
  rationale: ఇది ఆరాధనకు సంబంధించిన ప్రత్యేక వస్తువును సూచించే సాంకేతిక పదం. సంక్షిప్తమైన ఖచ్చిత తెలుగు సమానపదం లేనందున లిప్యంతరీకరించబడింది.
- source_word: הַתְּרָפִים
  choice: గృహదేవతల విగ్రహాలు
  rationale: ఈ బహువచన పదం ఇంటికి సంబంధించిన ఆరాధనా వస్తువులను లేదా దేవతా ప్రతిరూపాలను సూచిస్తుంది. ఎంపిక చేసిన పదబంధం అర్థాన్ని సాధారణ పాఠకునికి స్పష్టంగా తెలియజేస్తుంది.
- source_word: הַפָּסֶל
  choice: చెక్కిన ప్రతిమ
  rationale: చెక్కడం ద్వారా తయారైన ఆరాధనా ప్రతిమ అనే పదంలోని స్పష్టమైన భావాన్ని నిలుపుతుంది; కేవలం ‘విగ్రహం’ అనడం కంటే దాని తయారీ రూపాన్ని కూడా తెలియజేస్తుంది.
- source_word: בְּקֶרֶב הָעָם
  choice: ప్రజల మధ్యకు
  rationale: ప్రజల మధ్యలోనికి కదలికను సూచించే హీబ్రూ స్థలార్థాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి వాడబడింది. హీబ్రూ నుడికారంలోని ‘యాజకుని హృదయం’ నిలుపబడింది; ఆరాధనా సాంకేతిక పదమైన ‘ఏఫోదు’ లిప్యంతరీకరించబడింది. ఆంగ్ల సంప్రదింపు పాఠంలో [a] గుర్తు తప్పుగా ‘glad’ తరువాత కనిపించినప్పటికీ, దాని గమనిక తెరాఫీముకు సంబంధించినది కాబట్టి తెలుగు ప్రధాన పాఠంలో సంబంధిత పదం తరువాత ఉంచబడింది.
