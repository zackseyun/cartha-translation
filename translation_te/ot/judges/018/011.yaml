revisions:
- from: అప్పుడు దానీయుల వంశం నుండి ఆరువందల మంది యుద్ధాయుధాలు ధరించుకొని, అక్కడి నుండి—సొర్యా నుండీ ఎష్తాయోలు నుండీ—బయలుదేరారు.[a]
  to: అప్పుడు దాను గోత్రపు వంశం నుండి ఆరు వందల మంది పురుషులు యుద్ధాయుధాలు ధరించుకొని, అక్కడి నుండి సొరయా నుండీ ఎష్టావోలు నుండీ బయలుదేరారు.[a]
