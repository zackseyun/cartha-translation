translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. హీబ్రూ వాక్యంలోని బయలుదేరినవారు, వారి మూలస్థలాలు, వారి యుద్ధసన్నద్ధత అన్న అంశాలను స్పష్టంగా ఉంచాం. స్థలనామాలకు సాధారణ తెలుగు బైబిలు లిప్యంతరీకరణకు సమీపమైన రూపాలు వాడాం.
