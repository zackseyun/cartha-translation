id: JDG.18.11
reference: Judges 18:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּסְע֤וּ מִ/שָּׁם֙ מִ/מִּשְׁפַּ֣חַת הַ/דָּנִ֔י מִ/צָּרְעָ֖ה וּ/מֵ/אֶשְׁתָּאֹ֑ל שֵֽׁשׁ מֵא֣וֹת אִ֔ישׁ חָג֖וּר כְּלֵ֥י מִלְחָמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/011.yaml
  text: So six hundred men from the clan of the Danites set out from there[a], from Zorah and from Eshtaol[b], armed with weapons of war.
translation:
  language: te
  text: అప్పుడు దాను గోత్రపు వంశం నుండి ఆరు వందల మంది పురుషులు యుద్ధాయుధాలు ధరించుకొని, అక్కడి నుండి సొరయా నుండీ ఎష్టావోలు నుండీ బయలుదేరారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, ‘యుద్ధ సామగ్రిని నడుముకు కట్టుకున్నవారు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: బయలుదేరారు
  rationale: נסע అనే క్రియ ఇక్కడ శిబిరాన్ని విడిచి ప్రయాణం ప్రారంభించడాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘బయలుదేరారు’ సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: מִשָּׁם
  choice: అక్కడి నుండి
  rationale: స్థలాన్ని సూచించే ఈ అవ్యయానికి సూటియైన, సహజమైన తెలుగు రూపం.
- source_word: מִמִּשְׁפַּחַת הַדָּנִי
  choice: దానీయుల వంశం నుండి
  rationale: מִשְׁפָּחָה మొత్తం గోత్రం కంటే చిన్నదైన బంధుత్వ విభాగాన్ని సూచిస్తుంది. ‘వంశం’ తెలుగు పాఠకులకు సహజంగా ఉండి, ‘దాను గోత్రం’ అని విస్తరించి చెప్పకుండా మూలంలోని స్థాయిని నిలుపుతుంది.
- source_word: מִצָּרְעָה וּמֵאֶשְׁתָּאֹל
  choice: సొర్యా నుండీ ఎష్తాయోలు నుండీ
  rationale: స్థలనామాలను లిప్యంతరీకరించి, రెండు పేర్ల ముందున్న హీబ్రూ విభక్తి సూచనను పునరుక్త ‘నుండీ’తో ప్రతిబింబించాం.
- source_word: שֵׁשׁ מֵאוֹת אִישׁ
  choice: ఆరువందల మంది
  rationale: సంఖ్యతో వచ్చిన אִישׁ ఇక్కడ యుద్ధానికి సిద్ధమైన వయోజన పురుషులను సూచిస్తుంది; సందర్భం దానిని స్పష్టం చేస్తున్నందున సహజ తెలుగులో ‘మంది’ సరిపోతుంది.
- source_word: חָגוּר
  choice: ధరించుకొని
  rationale: ఈ పదానికి అక్షరార్థం ‘నడుముకు కట్టుకొని/ధరించి’; ఆయుధ సామగ్రితో సిద్ధంగా ఉన్న భావాన్ని నిలుపుతూ, కేవలం ‘సాయుధులై’ అని భావానువాదం చేయకుండా మూల రూపకాన్ని కొంత కాపాడుతుంది.
- source_word: כְּלֵי מִלְחָמָה
  choice: యుద్ధాయుధాలు
  rationale: כְּלֵי అనే పదం సాధనాలు లేదా సామగ్రి అనే విస్తృత అర్థం కలిగినా, ఈ సైనిక సందర్భంలో ఆయుధాలను సూచిస్తుంది; ‘యుద్ధాయుధాలు’ మూలంలోని మִלְחָמָה బలాన్ని నిలుపుతుంది.
