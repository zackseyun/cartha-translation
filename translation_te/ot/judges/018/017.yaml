source:
  edition: WLC
  text: וַֽ/יַּעֲל֞וּ חֲמֵ֣שֶׁת הָ/אֲנָשִׁ֗ים הַ/הֹלְכִים֮ לְ/רַגֵּ֣ל אֶת הָ/אָרֶץ֒ בָּ֣אוּ שָׁ֔מָּ/ה לָקְח֗וּ אֶת הַ/פֶּ֨סֶל֙ וְ/אֶת הָ֣/אֵפ֔וֹד וְ/אֶת הַ/תְּרָפִ֖ים וְ/אֶת הַ/מַּסֵּכָ֑ה וְ/הַ/כֹּהֵ֗ן נִצָּב֙ פֶּ֣תַח הַ/שַּׁ֔עַר וְ/שֵׁשׁ מֵא֣וֹת הָ/אִ֔ישׁ הֶ/חָג֖וּר כְּלֵ֥י הַ/מִּלְחָמָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/017.yaml
  text: Then the five men who had gone to spy out the land went up[a], came there, and took the carved image, the ephod, the household gods, and the cast image[b], while the priest was standing at the entrance of the gate with the six hundred men armed with weapons of war.
translation:
  language: te
  text: దేశాన్ని రహస్యంగా పరిశీలించడానికి వెళ్లిన ఆ ఐదుగురు మనుషులు పైకి వెళ్లి, అక్కడికి వచ్చి, చెక్కిన ప్రతిమను, ఏఫోదును, ఇంటి దేవతలను[a], పోతపోసిన ప్రతిమను[b] తీసుకున్నారు. యాజకుడు యుద్ధాయుధాలతో సన్నద్ధమైన ఆరువందల మంది పురుషులతో కలిసి ద్వారప్రవేశం వద్ద నిలబడి ఉన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘తెరాఫీము.’ ఈ హీబ్రూ పదం ఇంటి ఆరాధనలో ఉపయోగించే వస్తువులను లేదా ఇంటి దేవతలను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: 'సాంప్రదాయ అనువాదం: ‘కరిగించి చేసిన ప్రతిమ.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: పైకి వెళ్లి
  rationale: עלה అనే క్రియలోని ‘పైకి వెళ్లడం’ అనే దిశాసూచక భావాన్ని నిలుపుతుంది; కేవలం ‘వెళ్లి’ అని సరళీకరించలేదు.
- source_word: הַהֹלְכִים לְרַגֵּל אֶת־הָאָרֶץ
  choice: దేశాన్ని గూఢచర్యం చేయడానికి వెళ్లిన
  rationale: రాజకీయ-సైనిక నేపథ్యంలోని רגל క్రియకు తగిన గూఢపరిశీలన భావాన్ని వ్యక్తం చేస్తుంది; వారి ముందరి కార్యాన్ని తెలుగులో సహజంగా సూచిస్తుంది.
- source_word: בָּאוּ שָׁמָּה
  choice: అక్కడికి వచ్చి
  rationale: హీబ్రూ వాక్యంలో స్పష్టంగా లేని ‘లోపలికి ప్రవేశించారు’ అనే భావాన్ని చేర్చకుండా, కదలికను నేరుగా అనువదిస్తుంది.
- source_word: לָקְחוּ
  choice: తీసుకున్నారు
  rationale: לקח యొక్క సాధారణ అర్థాన్ని నిలుపుతుంది; ఇది దొంగతనమని సందర్భమే తెలియజేస్తుంది కాబట్టి ‘దోచుకున్నారు’ అని ముందుగానే వ్యాఖ్యానించలేదు.
- source_word: הַפֶּסֶל
  choice: చెక్కిన ప్రతిమ
  rationale: פסל సూచించే చెక్కి తయారుచేసిన రూపాన్ని స్పష్టంగా తెలియజేస్తుంది; ‘విగ్రహం’ అనే మూల్యనిర్ణయాత్మక పదాన్ని తప్పిస్తుంది.
- source_word: הָאֵפוֹד
  choice: ఏఫోదు
  rationale: సులభమైన సమానార్థక పదం లేని ప్రత్యేక ఆచార సంబంధ పదం కావడంతో లిప్యంతరీకరణను ఉపయోగించింది; మూలంలో లేని అదనపు వివరణను ప్రధాన పాఠ్యంలో చేర్చలేదు.
- source_word: הַתְּרָפִים
  choice: ఇంటి దేవతలు
  rationale: ఇంటి ఆరాధనకు సంబంధించిన దేవతలు లేదా ఆరాధనా వస్తువులు అనే భావాన్ని సాధారణ పాఠకునికి అందిస్తుంది; వస్తువుల స్వరూపంలోని కొంత అనిశ్చితిని పాదసూచికలో తెలిపింది.
- source_word: הַמַּסֵּכָה
  choice: పోతపోసిన ప్రతిమ
  rationale: కరిగించిన పదార్థాన్ని అచ్చులో పోసి చేసిన రూపం అనే מסכה భావాన్ని ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: וְהַכֹּהֵן נִצָּב
  choice: ఆ సమయంలో యాజకుడు ... నిలబడి ఉన్నాడు
  rationale: వస్తువులను తీసుకోవడం జరుగుతున్నప్పటి సమాంతర పరిస్థితిని తెలుగులో స్పష్టంగా చూపుతుంది.
- source_word: פֶּתַח הַשַּׁעַר
  choice: ద్వారపు ప్రవేశం దగ్గర
  rationale: פתח మరియు שער అనే రెండు నామాల భావాన్ని నిలుపుతూ సహజమైన తెలుగును ఉపయోగిస్తుంది.
- source_word: וְשֵׁשׁ מֵאוֹת הָאִישׁ
  choice: ఆరువందల మంది పురుషులతో కలిసి
  rationale: యాజకుడు ఆ ఆరువందల మందితో ద్వారం దగ్గర ఉన్నాడనే సందర్భ సంబంధాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: הֶחָגוּר כְּלֵי הַמִּלְחָמָה
  choice: యుద్ధాయుధాలు ధరించిన
  rationale: అక్షరార్థమైన ‘నడుముకు కట్టుకున్న’ భావాన్ని కఠినంగా అనుసరించకుండా, యుద్ధానికి ఆయుధసన్నద్ధులై ఉన్నారనే అర్థాన్ని సహజంగా అందిస్తుంది.
