revisions:
- from: దేశాన్ని గూఢచర్యం చేయడానికి వెళ్లిన ఆ ఐదుగురు మనుషులు పైకి వెళ్లి, అక్కడికి వచ్చి, చెక్కిన ప్రతిమను, ఏఫోదును, ఇంటి దేవతలను[a], పోతపోసిన ప్రతిమను[b] తీసుకున్నారు. ఆ సమయంలో యాజకుడు యుద్ధాయుధాలు ధరించిన ఆరువందల మంది పురుషులతో కలిసి ద్వారపు ప్రవేశం దగ్గర నిలబడి ఉన్నాడు.
  to: దేశాన్ని రహస్యంగా పరిశీలించడానికి వెళ్లిన ఆ ఐదుగురు మనుషులు పైకి వెళ్లి, అక్కడికి వచ్చి, చెక్కిన ప్రతిమను, ఏఫోదును, ఇంటి దేవతలను[a], పోతపోసిన ప్రతిమను[b] తీసుకున్నారు. యాజకుడు యుద్ధాయుధాలతో సన్నద్ధమైన ఆరువందల మంది పురుషులతో కలిసి ద్వారప్రవేశం వద్ద నిలబడి ఉన్నాడు.
  rationale: సవరణలు అర్థాన్ని మార్చకుండా ఆధునిక ప్రామాణిక తెలుగు సహజత్వాన్ని మెరుగుపరుస్తాయి. రహస్య సైనిక పరిశీలన భావం, పైకి వెళ్లడం, వస్తువుల నాలుగు భాగాల జాబితా, అలాగే యాజకుడు ఆరువందల సాయుధులతో ద్వారప్రవేశం వద్ద ఉన్న సమకాలీన దృశ్యం అన్నీ నిలుపబడ్డాయి. పాదసూచిక సూచికలు సంబంధిత పదాల వెంటనే ఉంచబడ్డాయి.
