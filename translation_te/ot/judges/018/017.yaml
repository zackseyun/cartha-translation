translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలిని ఉపయోగించింది. హీబ్రూ వాక్యంలోని వరుస కదలికలను, ఆరాధనా వస్తువుల ప్రత్యేక పదజాలాన్ని, అలాగే ‘తెరాఫీము’ స్వరూపంలోని అనిశ్చితిని నిలుపుకుంది. ఆంగ్ల సంప్రదింపుపాఠ్యంలో [a] సూచిక తప్పు స్థానంలో ఉన్నట్లు కనిపించినందున, దాని పాదసూచిక విషయానికి అనుగుణంగా ‘ఇంటి దేవతలు’ తర్వాత ఉంచబడింది.
