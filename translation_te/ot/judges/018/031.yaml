source:
  edition: WLC
  text: וַ/יָּשִׂ֣ימוּ לָ/הֶ֔ם אֶת פֶּ֥סֶל מִיכָ֖ה אֲשֶׁ֣ר עָשָׂ֑ה כָּל יְמֵ֛י הֱי֥וֹת בֵּית הָ/אֱלֹהִ֖ים בְּ/שִׁלֹֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/031.yaml
  text: So they set up for themselves Micah’s carved image that he had made[a], all the days that the house of God was in Shiloh.
translation:
  language: te
  text: దేవుని మందిరం షిలోహులో ఉన్న రోజులన్నీ వారు మీకా చేసిన చెక్కిన ప్రతిమను[a] తమ కోసం నిలబెట్టుకున్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “విగ్రహాన్ని.” హీబ్రూ పదం ఆరాధనలో ఉపయోగించే చెక్కిన ప్రతిమను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשִׂימוּ לָהֶם
  choice: తమ కోసం నిలబెట్టుకున్నారు
  rationale: שׂים యొక్క ‘పెట్టు/నిలబెట్టు’ అనే భావాన్ని, ఆరాధన కోసం ప్రతిమను ప్రతిష్ఠించిన సందర్భాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; לָהֶם లోని ‘తమ కోసం’ అనే భావాన్నీ నిలుపుతుంది.
- source_word: פֶּסֶל
  choice: చెక్కిన ప్రతిమ
  rationale: ఆరాధన కోసం తయారుచేసిన చెక్కిన రూపం అనే స్పష్టమైన అర్థాన్ని నిలుపుతుంది. ‘విగ్రహం’ దాని కార్యాన్ని మరింత స్పష్టపరిచే సాధ్యమైన ప్రత్యామ్నాయం.
- source_word: מִיכָה
  choice: మీకా
  rationale: వ్యక్తి పేరును ప్రామాణిక తెలుగు బైబిలు రూపానికి అనుగుణంగా లిప్యంతరీకరించింది.
- source_word: אֲשֶׁר עָשָׂה
  choice: చేయించిన
  rationale: మీకా ఆ ప్రతిమను తయారు చేయించినట్టు న్యాయాధిపతులు 17:3–4లోని సందర్భం సూచిస్తుంది. హీబ్రూ క్రియ సాధారణంగా ‘చేశాడు’ అని ఉన్నప్పటికీ, తెలుగులో కారక నిర్మాణం సందర్భానుసారంగా సహజంగా ఉంటుంది.
- source_word: כָּל יְמֵי הֱיוֹת
  choice: ఉన్న కాలమంతా
  rationale: ‘ఉన్న రోజులన్నీ’ అనే హీబ్రూ కాలవ్యాప్తి భావాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: בֵּית הָאֱלֹהִים
  choice: దేవుని మందిరం
  rationale: దేవుని ఆరాధనా స్థలాన్ని సూచించే పదబంధాన్ని సహజంగా అందిస్తుంది; ‘దేవుని గృహం’ మరింత పదశః ప్రత్యామ్నాయం.
- source_word: בְּשִׁלֹה
  choice: షిలోహులో
  rationale: స్థల నామాన్ని ప్రామాణిక తెలుగు రూపంలో లిప్యంతరీకరించి, స్థానార్థక విభక్తిని జోడించింది.
theological_decisions:
- issue: దాను వంశీయుల అనధికార ఆరాధనకు, షిలోహులోని దేవుని ఆరాధనా కేంద్రానికి మధ్య ఉన్న వ్యత్యాసంలో בֵּית הָאֱלֹהִים అనువాదం
  choice: దేవుని మందిరం
  alternative: దేవుని గృహం; దేవుని పరిశుద్ధ స్థలం
  rationale: మూలంలోని పదబంధానికి వ్యాఖ్యాత్మకమైన ‘నిజమైన’ లేదా ‘చట్టబద్ధమైన’ వంటి విశేషణాలను జోడించకుండా, కథనంలోని ధార్మిక ఉద్రిక్తతను అలాగే ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన వాక్యనిర్మాణం. దీర్ఘమైన హీబ్రూ వాక్యాన్ని స్పష్టత కోసం రెండు తెలుగు వాక్యాలుగా ఇచ్చినా, కాలవ్యాప్తి మరియు కథన సంబంధం నిలుపబడ్డాయి.
