source:
  edition: WLC
  text: וַ/יֹּאמְרוּ֩ ל֨/וֹ הַחֲרֵ֜שׁ שִֽׂים יָדְ/ךָ֤ עַל פִּ֨י/ךָ֙ וְ/לֵ֣ךְ עִמָּ֔/נוּ וֶֽ/הְיֵה לָ֖/נוּ לְ/אָ֣ב וּ/לְ/כֹהֵ֑ן הֲ/ט֣וֹב הֱיוֹתְ/ךָ֣ כֹהֵ֗ן לְ/בֵית֙ אִ֣ישׁ אֶחָ֔ד א֚וֹ הֱיוֹתְ/ךָ֣ כֹהֵ֔ן לְ/שֵׁ֥בֶט וּ/לְ/מִשְׁפָּחָ֖ה בְּ/יִשְׂרָאֵֽל־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/019.yaml
  text: They said to him[a], “Be quiet; put your hand over your mouth, and come with us, and be to us a father and a priest. Is it better for you to be priest to the house of one man[c][b], or to be priest to a tribe and a clan in Israel?”
translation:
  language: te
  text: 'వారు అతనితో ఇలా అన్నారు: “నిశ్శబ్దంగా ఉండు; నీ నోటిమీద చెయ్యి ఉంచు; మాతో రా. మాకు తండ్రిగా, యాజకుడిగా ఉండు. నువ్వు ఒక్క మనిషి ఇంటివారికి యాజకుడిగా ఉండడం మంచిదా, లేక ఇశ్రాయేలులో ఒక గోత్రానికి, వంశానికి యాజకుడిగా ఉండడం మంచిదా?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַחֲרֵשׁ
  choice: నిశ్శబ్దంగా ఉండు
  rationale: חרשׁ ధాతువు ఆజ్ఞారూపంలో మాట్లాడకుండా ఉండమనే భావాన్ని ఇస్తుంది. ఆధునిక ప్రామాణిక తెలుగులో ఇది సహజంగా, స్పష్టంగా ఉంది.
- source_word: שִׂים יָדְךָ עַל־פִּיךָ
  choice: నీ నోటిమీద చెయ్యి పెట్టుకుని
  rationale: మౌనంగా ఉండమనే సంకేతాన్ని తెలిపే భౌతిక చిత్రాన్ని నిలుపుతుంది; తరువాతి ‘మాతో రా’తో సహజంగా అనుసంధానించబడింది.
- source_word: וְהְיֵה לָנוּ לְאָב וּלְכֹהֵן
  choice: మాకు తండ్రిగా, యాజకుడిగా ఉండు
  rationale: సామాజిక-మతపరమైన ‘తండ్రి’ అనే బిరుదును వ్యాఖ్యానాత్మక పదంతో భర్తీ చేయకుండా, రెండు పాత్రలనూ యథాతథంగా నిలుపుతుంది.
- source_word: כֹהֵן
  choice: యాజకుడు
  rationale: כהןకు ప్రామాణికమైన తెలుగు సమానార్థకం; సందర్భంలో స్పష్టంగా సరిపోతుంది.
- source_word: הֲטוֹב
  choice: మంచిదా
  rationale: ప్రశ్నలోని రెండు ప్రత్యామ్నాయాల మధ్య తులనను తెలుగు వాక్య నిర్మాణమే స్పష్టపరుస్తుంది; మూలంలోని ‘మంచిది’ అనే పదరూపానికి దగ్గరగా ఉంటుంది.
- source_word: לְבֵית אִישׁ אֶחָד
  choice: ఒక్క మనిషి ఇంటివారికి
  rationale: בֵּית యొక్క గృహం/కుటుంబ సమూహం అనే భావాన్ని ‘ఇంటివారు’ సహజమైన తెలుగులో తెలియజేస్తుంది; కేవలం భవనం అనే అపార్థాన్ని నివారిస్తుంది.
- source_word: לְשֵׁבֶט וּלְמִשְׁפָּחָה בְּיִשְׂרָאֵל
  choice: ఇశ్రాయేలులో ఒక గోత్రానికి, వంశానికి
  rationale: שבטను ‘గోత్రం’గా, משפחהను గోత్రంలోని బంధుత్వ సమూహాన్ని సూచించే ‘వంశం’గా వేరు చేస్తుంది.
theological_decisions:
- issue: ‘తండ్రి’ అనే పదం యొక్క బిరుదాత్మక భావం
  choice: మూలంలోని ‘తండ్రి’ అనే పదాన్నే నిలుపుతూ పాదసూచికలో దాని సామాజిక-మతపరమైన భావాన్ని వివరించడం
  alternative: సలహాదారు / నాయకుడు / పోషకుడు
  rationale: వ్యాఖ్యానాత్మక ప్రత్యామ్నాయాలు పదం యొక్క భావపరిధిని అనవసరంగా కుదిస్తాయి. మూలంలోని సాంస్కృతికంగా ప్రాధాన్యమైన బిరుదును నిలుపడం పారదర్శకంగా ఉంటుంది.
- issue: מִשְׁפָּחָה అనే బంధుత్వ పదం
  choice: వంశం
  alternative: కుటుంబం
  rationale: ఇక్కడ ఒక్క మనిషి ఇంటివారికి విరుద్ధంగా, గోత్రంతో కలిపి ఒక పెద్ద బంధుత్వ సమూహం ఉద్దేశించబడింది. ‘వంశం’ ఆ స్థాయి భేదాన్ని మెరుగ్గా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. సంభాషణలోని కఠిన ఆజ్ఞ, నోటిమీద చెయ్యి పెట్టుకునే మూలచిత్రం, ‘తండ్రి’ అనే సాంస్కృతిక బిరుదు, గోత్రం–వంశం మధ్య సామాజిక భేదం నిలుపబడ్డాయి.
