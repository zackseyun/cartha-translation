  source_fidelity: 'మూల హీబ్రూ భావం మొత్తంగా సరిగానే ఉంది: మీకా ఇంటి సమీపం, యువ లేవీయుని స్వరాన్ని గుర్తించడం, మార్గం విడిచి అక్కడికి వెళ్లడం, మరియు మూడు ప్రశ్నలూ కాపాడబడ్డాయి. అయితే וַיֹּאמְרוּ (‘అన్నారు’)ను ‘అడిగారు’గా చేయకుండా మూలానికి దగ్గరగా ఉంచడం మంచిది; ప్రశ్నల రూపం సందర్భంలోనే స్పష్టంగా ఉంటుంది.'
