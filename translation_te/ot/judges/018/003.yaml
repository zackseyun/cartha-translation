translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా అనువదించబడింది. ప్రశ్నల నేరత్వాన్ని నిలిపి, అస్పష్టమైన హీబ్రూ ప్రయోగాలకు ప్రధాన పాఠ్యంలో స్పష్టమైన స్థలార్థాన్ని ఇచ్చి, నిజమైన ప్రత్యామ్నాయాలను పాదసూచికల్లో భద్రపరిచాం.
