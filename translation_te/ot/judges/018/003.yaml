source:
  edition: WLC
  text: הֵ֚מָּה עִם בֵּ֣ית מִיכָ֔ה וְ/הֵ֣מָּה הִכִּ֔ירוּ אֶת ק֥וֹל הַ/נַּ֖עַר הַ/לֵּוִ֑י וַ/יָּס֣וּרוּ שָׁ֗ם וַ/יֹּ֤אמְרוּ ל/וֹ֙ מִֽי הֱבִיאֲ/ךָ֣ הֲלֹ֔ם וּ/מָֽה אַתָּ֥ה עֹשֶׂ֛ה בָּ/זֶ֖ה וּ/מַה לְּ/ךָ֥ פֹֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/003.yaml
  text: While they were near Micah’s house[a], they recognized the voice of the young Levite. So they turned aside there and said to him[b], “Who brought you here? What are you doing in this place? And what do you have here?”
translation:
  language: te
  text: వారు మీకా ఇంటి దగ్గర ఉన్నప్పుడు, ఆ యువ లేవీయుని స్వరాన్ని గుర్తుపట్టారు. కాబట్టి వారు అక్కడికి దారిమళ్లి అతనితో, “నిన్ను ఇక్కడికి ఎవరు తీసుకొచ్చారు? ఈ స్థలంలో నువ్వు ఏమి చేస్తున్నావు?[a] ఇక్కడ నీకేముంది?[b]” అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “దీనిలో నువ్వు ఏమి చేస్తున్నావు?” దీనిని “ఇక్కడ నువ్వు ఏమి చేస్తున్నావు?” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ఇక్కడ నీ పని ఏమిటి?”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵמָּה עִם בֵּית מִיכָה
  choice: వారు మీకా ఇంటి దగ్గర ఉన్నప్పుడు
  rationale: עִם ఇక్కడ సహవాసం కంటే స్థలసమీపాన్ని సూచిస్తుంది. తెలుగు వాక్యప్రవాహంలో సందర్భార్థకంగా ‘ఉన్నప్పుడు’ చేర్చడం సహజంగా ఉంది.
- source_word: הִכִּירוּ אֶת קוֹל הַנַּעַר הַלֵּוִי
  choice: ఆ యువ లేవీయుని స్వరాన్ని గుర్తుపట్టారు
  rationale: הִכִּירוּ అంటే గుర్తించడం; קוֹל ఇక్కడ మాట్లాడే స్వరం. נַעַר వయస్సు/స్థితిని సూచిస్తున్నందున ‘యువ’ అని అనువదించబడింది.
- source_word: וַיָּסוּרוּ שָׁם
  choice: వారు అక్కడికి పక్కకు తిరిగి
  rationale: סור ప్రయాణమార్గం నుంచి పక్కకు తిరిగి ఒక స్థలానికి వెళ్లడాన్ని సూచిస్తుంది; మూలంలోని కదలికను ఈ రూపం నిలుపుతుంది.
- source_word: מִי הֱבִיאֲךָ הֲלֹם
  choice: నిన్ను ఇక్కడికి ఎవరు తీసుకొచ్చారు?
  rationale: Hiphil రూపంలోని בוא causative అర్థం ‘తీసుకురావడం’; הֲלֹם అంటే ‘ఇక్కడికి’.
- source_word: וּמָה אַתָּה עֹשֶׂה בָּזֶה
  choice: ఈ చోటులో నువ్వు ఏమి చేస్తున్నావు?
  rationale: בָּזֶה అక్షరార్థంగా ‘దీనిలో’ అయినా ఇక్కడ స్థలాన్ని సూచించే సంక్షిప్త ప్రయోగంగా అర్థమవుతుంది. ‘ఈ చోటులో’ సహజమైన తెలుగులో ఆ భావాన్ని వెల్లడిస్తుంది; అక్షరార్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: וּמַה לְּךָ פֹה
  choice: ఇక్కడ నీకేముంది?
  rationale: ఈ హీబ్రూ ప్రయోగం ఒక వ్యక్తికి ఆ స్థలంలో ఉన్న సంబంధం, ఆసక్తి, పని లేదా ఆధారాన్ని ప్రశ్నించవచ్చు. ‘ఇక్కడ నీకేముంది?’ మూలంలోని నిర్మాణాన్ని, దాని ఉద్దేశపూర్వక విస్తృతిని నిలుపుతుంది.
