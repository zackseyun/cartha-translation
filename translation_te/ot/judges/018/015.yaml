source:
  edition: WLC
  text: וַ/יָּס֣וּרוּ שָׁ֔מָּ/ה וַ/יָּבֹ֛אוּ אֶל בֵּֽית הַ/נַּ֥עַר הַ/לֵּוִ֖י בֵּ֣ית מִיכָ֑ה וַ/יִּשְׁאֲלוּ ל֖/וֹ לְ/שָׁלֽוֹם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/015.yaml
  text: They turned aside there and came to the house of the young Levite[a], to the house of Micah, and asked him about his welfare.
translation:
  language: te
  text: వారు అక్కడికి దారి మళ్లించి, యువ లేవీయుని ఇంటికి—అంటే మీకా ఇంటికి—వచ్చి, అతని క్షేమం గురించి అడిగారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతనిని పలకరించారు,” లేదా “అతను క్షేమంగా ఉన్నాడా అని అడిగారు.” హెబ్రీ నుడికారం అక్షరార్థంగా శాంతి లేదా క్షేమం గురించి విచారించడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּסוּרוּ שָׁמָּה
  choice: వారు అక్కడికి పక్కకు తిరిగి
  rationale: סוּר మార్గం నుంచి పక్కకు తిరగడాన్ని, שָׁמָּה ఆ స్థలం వైపు కదలికను సూచిస్తాయి. ఈ అనువాదం రెండింటినీ సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: וַיָּבֹאוּ אֶל
  choice: వచ్చి
  rationale: בוא + אֶל ఇక్కడ ఒక స్థలానికి చేరడాన్ని సూచిస్తుంది; లోపలికి ప్రవేశించారని మూలంలో స్పష్టంగా లేనందున ‘ప్రవేశించి’ అని అతిగా అనువదించలేదు.
- source_word: בֵּית הַנַּעַר הַלֵּוִי
  choice: యువ లేవీయుడు ఉన్న ఇంటికి
  rationale: నిర్దిష్ట యువ లేవీయునితో సంబంధమున్న ఇంటిని సూచించే హెబ్రీ నిర్మాణాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; נַעַר లోని యౌవన భావం నిలిచింది.
- source_word: בֵּית מִיכָה
  choice: అంటే మీకా ఇంటికి
  rationale: రెండో గృహపదబంధం మొదటి ఇంటినే మరింత స్పష్టంగా మీకా ఇల్లుగా గుర్తిస్తుంది. ‘అంటే’ ఆ వివరణాత్మక సంబంధాన్ని తెలుగులో స్పష్టం చేస్తుంది.
- source_word: וַיִּשְׁאֲלוּ לוֹ לְשָׁלוֹם
  choice: అతని క్షేమం గురించి అడిగారు
  rationale: శాంతి లేదా క్షేమం గురించి విచారించే హెబ్రీ నుడికారాన్ని కేవలం పలకరింపుగా కుదించకుండా, సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కథనానికి తగిన సరళమైన, గౌరవప్రదమైన శైలి. హెబ్రీలోని పునరుక్త గృహపదబంధాన్ని అసహజంగా కాకుండా ‘అంటే’ ద్వారా నిలిపింది. పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో చేర్చబడింది.
