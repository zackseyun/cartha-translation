id: JDG.18.5
reference: Judges 18:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֥אמְרוּ ל֖/וֹ שְׁאַל נָ֣א בֵ/אלֹהִ֑ים וְ/נֵ֣דְעָ֔ה הֲ/תַצְלִ֣יחַ דַּרְכֵּ֔/נוּ אֲשֶׁ֥ר אֲנַ֖חְנוּ הֹלְכִ֥ים עָלֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/005.yaml
  text: And they said to him[a], “Please inquire of God, so that we may know whether the journey on which we are going will succeed.”
translation:
  language: te
  text: వారు అతనితో, “దయచేసి దేవుని దగ్గర విచారించు. మేము సాగుతున్న మా ప్రయాణం[a] విజయవంతమవుతుందో లేదో మాకు తెలియడానికి” అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “మేము వెళ్తున్న మా మార్గం వర్ధిల్లుతుందో లేదో.”
    reason: ‘ప్రయాణం’ సందర్భార్థాన్ని సహజంగా తెలుపుతుంది; ‘మార్గం’ మూల హీబ్రూలోని రూపకచిత్రాన్ని మరింత నేరుగా నిలుపుతుంది.
lexical_decisions:
- source_word: וַיֹּאמְרוּ לוֹ
  choice: వారు అతనితో … అన్నారు
  rationale: హీబ్రూ కథన ప్రవాహాన్ని సహజమైన ఆధునిక తెలుగు వాక్యనిర్మాణంలో అందిస్తుంది.
- source_word: שְׁאַל נָא
  choice: దయచేసి … విచారించు
  rationale: נָא ఆజ్ఞను మృదువుగా, మర్యాదపూర్వకంగా చేస్తుంది; దేవుని మార్గదర్శకత్వం కోరే సందర్భానికి ‘విచారించు’ సరిపోతుంది.
- source_word: בֵאלֹהִים
  choice: దేవుని దగ్గర
  rationale: שׁאל ב అనే హీబ్రూ ప్రయోగానికి ‘దేవుని దగ్గర విచారించు’ సహజమైన తెలుగు; సందర్భంలో אֱלֹהִים ఏకవచనార్థంలో ఉంది.
- source_word: וְנֵדְעָה
  choice: తెలుసుకోవాలి
  rationale: కోరికతో కూడిన ఉద్దేశాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; ముందున్న అభ్యర్థనకు దీని ఉద్దేశ సంబంధం స్పష్టంగా ఉంటుంది.
- source_word: הֲתַצְלִיחַ
  choice: సఫలమవుతుందో లేదో
  rationale: צלח హిఫిల్ రూపంలోని విజయవంతం కావడం లేదా అనుకూలంగా సాగడం అనే భావాన్ని ప్రశ్నార్థక నిర్మాణంతో స్పష్టంగా అందిస్తుంది.
- source_word: דַּרְכֵּנוּ
  choice: మేము సాగుతున్న ప్రయాణం
  rationale: మూలంలోని ‘మా మార్గం’ అనే చిత్రాన్ని సందర్భానుసారంగా యాత్ర లేదా దండయాత్ర భావంలో సహజంగా వ్యక్తపరుస్తుంది; అక్షరార్థ ప్రత్యామ్నాయం పాదసూచికలో ఉంచబడింది.
- source_word: אֲשֶׁר אֲנַחְנוּ הֹלְכִים עָלֶיהָ
  choice: మేము సాగుతున్న
  rationale: ‘దానిమీద మేము వెళ్తున్న’ అనే హీబ్రూ సంబంధవాక్యాన్ని తెలుగు పునరుక్తి లేకుండా సహజంగా సంక్షిప్తం చేస్తుంది.
theological_decisions:
- issue: אֱלֹהִים పదం యొక్క సంఖ్యార్థం
  choice: దేవుడు—ఏకవచనం
  alternative: దేవుళ్లు—బహువచనం
  rationale: రూపపరంగా బహువచనంగా ఉండగలిగినా, యాజకుని ద్వారా దైవ మార్గదర్శకత్వం కోరుతున్న తక్షణ కథన సందర్భంలో ఏకవచనార్థమే అత్యంత సహజం; ఇది సిద్ధాంతపరమైన విస్తరణ కాదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయితే దైవవిచారణ సందర్భానికి తగిన గౌరవప్రదమైన శైలి. సంభాషణ సహజత్వం కోసం ఒకే హీబ్రూ వాక్యాన్ని తెలుగులో రెండు వాక్యాలుగా ఇచ్చాం.
