revisions:
- from: వారు అతనితో, “దయచేసి దేవుని దగ్గర విచారించు. మేము సాగుతున్న ప్రయాణం[a] సఫలమవుతుందో లేదో తెలుసుకోవాలి” అన్నారు.
  to: వారు అతనితో, “దయచేసి దేవుని దగ్గర విచారించు. మేము సాగుతున్న మా ప్రయాణం[a] విజయవంతమవుతుందో లేదో మాకు తెలియడానికి” అన్నారు.
  rationale: The revision restores the explicit “our” in the Hebrew and changes the final clause from a statement of necessity to a purpose clause. It otherwise preserves the draft’s faithful singular rendering of “God,” its natural modern Telugu register, and its lexical footnote.
