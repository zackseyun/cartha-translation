translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరమైన కథన శైలిని అనుసరించాం. ‘యాజకుడు,’ ‘అగ్ని,’ ‘హతమార్చి’ వంటి పదాలు బైబిలు కథనానికి తగిన గౌరవప్రద శైలిని ఇస్తాయి. మూలంలోని పునరుక్త ‘మీదికి’ నిర్మాణాన్ని డాష్ ద్వారా స్పష్టంగా నిలిపాం.
