source:
  edition: WLC
  text: וְ/הֵ֨מָּה לָקְח֜וּ אֵ֧ת אֲשֶׁר עָשָׂ֣ה מִיכָ֗ה וְֽ/אֶת הַ/כֹּהֵן֮ אֲשֶׁ֣ר הָיָה ל/וֹ֒ וַ/יָּבֹ֣אוּ עַל לַ֗יִשׁ עַל עַם֙ שֹׁקֵ֣ט וּ/בֹטֵ֔חַ וַ/יַּכּ֥וּ אוֹתָ֖/ם לְ/פִי חָ֑רֶב וְ/אֶת הָ/עִ֖יר שָׂרְפ֥וּ בָ/אֵֽשׁ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/027.yaml
  text: So they took what Micah had made[a], along with the priest who belonged to him, and came against Laish, against a people quiet and secure. They struck them with the edge of the sword and burned the city with fire.
translation:
  language: te
  text: అప్పుడు వారు మీకా చేసిన వాటిని, అతనికి ఉన్న యాజకుణ్ణి తీసుకొని లాయిషుపైకి వచ్చారు; అక్కడి ప్రజలు ప్రశాంతంగా, భద్రంగా ఉన్నారు. వారు కత్తి ధారతో[a] వారిని కొట్టారు; ఆ పట్టణాన్ని అగ్నితో కాల్చివేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “కత్తి నోటితో”; ఇది “కత్తి ధారతో” అనే అర్థంలోని నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵמָּה לָקְחוּ
  choice: అప్పుడు వారు ... తీసుకొని
  rationale: స్వతంత్ర సర్వనామంలోని కర్త ప్రాధాన్యాన్ని ఉంచుతూ, తెలుగు కథన ప్రవాహానికి సహజంగా ‘అప్పుడు వారు’ అని అనువదించాం. לקח యొక్క విస్తృత భావాన్ని ‘తీసుకొని’ నిలుపుతుంది.
- source_word: אֵת אֲשֶׁר עָשָׂה מִיכָה
  choice: మీకా చేయించిన వాటిని
  rationale: మునుపటి సందర్భంలో మీకా స్వయంగా చెక్కడం కంటే ఆ ఆరాధనా వస్తువులను చేయించినవాడిగా కనిపిస్తాడు; తెలుగు వాడుకలో ‘చేయించిన’ ఈ సందర్భార్థాన్ని సహజంగా తెలియజేస్తుంది. బహువచన ‘వాటిని’ సందర్భంలోని వస్తువులను సూచిస్తుంది.
- source_word: וְאֶת הַכֹּהֵן אֲשֶׁר הָיָה לוֹ
  choice: అతనికి ఉన్న యాజకుణ్ణి
  rationale: హీబ్రూ היה לוֹ అక్షరార్థంగా ‘అతనికి ఉన్న’ అనే సంబంధాన్ని సూచిస్తుంది. యాజకుడు అతని సొత్తు అన్న భావాన్ని అనవసరంగా బలపరచకుండా ఆ అనుబంధాన్ని నిలుపుతుంది.
- source_word: וַיָּבֹאוּ עַל לַיִשׁ
  choice: లాయిషు మీదికి వచ్చారు
  rationale: సైనిక సందర్భంలోని בוא על శత్రుత్వంతో రావడాన్ని సూచిస్తుంది. ‘మీదికి వచ్చారు’ దాడి భావాన్ని నిలుపుతూ, తరువాతి క్రియలోని దాడిని ముందుగానే పూర్తిగా కలిపివేయదు.
- source_word: עַל עַם שֹׁקֵט וּבֹטֵחַ
  choice: ప్రశాంతంగా, భద్రంగా ఉన్న ప్రజల మీదికి
  rationale: שׁקט లోని ప్రశాంతతను, בטח లోని భద్రత లేదా నిశ్చింతను నేరుగా ఉంచుతుంది; ‘అప్రమత్తత లేని’ వంటి వ్యాఖ్యానాత్మక భావాన్ని చేర్చదు.
- source_word: וַיַּכּוּ אוֹתָם לְפִי חָרֶב
  choice: వారిని కత్తివాత హతమార్చి
  rationale: נכה సందర్భానుసారంగా కొట్టడం, ఓడించడం, చంపడం అనే భావాలు కలిగి ఉంటుంది. ‘కత్తివాత’తో కూడిన ఈ యుద్ధ సందర్భంలో ‘హతమార్చి’ ఫలితాన్ని సహజంగా తెలియజేస్తుంది; ‘కత్తివాత’ హీబ్రూ ‘కత్తి నోరు’ అనే నుడికారానికి తెలుగు సమానార్థక ప్రయోగం.
- source_word: וְאֶת הָעִיר שָׂרְפוּ בָאֵשׁ
  choice: పట్టణాన్ని అగ్నితో కాల్చివేశారు
  rationale: ‘అగ్నితో’ అని మూలంలో స్పష్టంగా ఉన్న సాధనాన్ని నిలుపుతూ, שׂרפוּ యొక్క సంపూర్ణ విధ్వంస భావాన్ని సహజ తెలుగు ‘కాల్చివేశారు’గా అందిస్తుంది.
