source:
  edition: WLC
  text: וַֽ/יַּעֲל֗וּ וַֽ/יַּחֲנ֛וּ בְּ/קִרְיַ֥ת יְעָרִ֖ים בִּֽ/יהוּדָ֑ה עַל כֵּ֡ן קָרְאוּ֩ לַ/מָּק֨וֹם הַ/ה֜וּא מַחֲנֵה דָ֗ן עַ֚ד הַ/יּ֣וֹם הַ/זֶּ֔ה הִנֵּ֕ה אַחֲרֵ֖י קִרְיַ֥ת יְעָרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/012.yaml
  text: They went up and camped at Kiriath-jearim in Judah. Therefore that place has been called Mahaneh-dan to this day; behold, it is west of Kiriath-jearim.
translation:
  language: te
  text: వారు పైకి వెళ్లి యూదా ప్రాంతంలోని కిర్యత్‌-యెయారీములో మకాం వేశారు. అందుచేత ఆ స్థలానికి నేటి వరకూ మహనే-దాను అని పేరు. ఇదిగో, అది కిర్యత్‌-యెయారీముకు పడమట ఉంది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అది కిర్యత్‌-యెయారీము వెనుక ఉంది.”
    reason: హెబ్రీ אַחֲרֵי పదానికి అక్షరార్థంగా ‘వెనుక’ అని అర్థం; దిశను సూచించే వాడుకలో ‘పడమట’ అని కూడా అర్థం కావచ్చు.
lexical_decisions:
- source_word: קִרְיַת יְעָרִים
  choice: కిర్యత్‌-యెయారీము
  rationale: హెబ్రీ స్థలనామాన్ని తెలుగు ధ్వన్యనుకరణలో నిలిపి, పాఠకులకు సహజంగా చదవదగిన రూపాన్ని ఉపయోగించాం.
- source_word: מַחֲנֵה דָן
  choice: మహనే-దాను
  rationale: ‘దాను శిబిరం’ అనే అర్థం ఉన్నప్పటికీ, ఇది స్థలానికి పెట్టిన పేరుగా వాడబడినందున ధ్వన్యనుకరణను ప్రధాన పాఠంలో నిలిపాం.
- source_word: אַחֲרֵי
  choice: పడమట
  rationale: మూలార్థం ‘వెనుక’; ప్రాచీన దిశాభిముఖ వాడుకలో ఇది పడమరను సూచించగలదు. సందర్భానికి అనుగుణంగా ‘పడమట’ను పాఠంలో ఉంచి, నిజమైన పదార్థ సందిగ్ధతను పాదసూచికలో తెలిపాం.
- source_word: הִנֵּה
  choice: ఇదిగో
  rationale: స్థలాన్ని ప్రత్యేకంగా చూపించే హెబ్రీ సూచనార్థక అవ్యయ బలాన్ని నిలిపాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కథనశైలి. స్థలనామాలను ధ్వన్యనుకరణగా ఉంచి, ‘మకాం వేశారు’, ‘నేటి వరకూ’ వంటి సాధారణంగా అర్థమయ్యే ప్రయోగాలను వాడాం. పాదసూచిక గుర్తు ప్రధాన పాఠంలో చేర్చబడింది.
