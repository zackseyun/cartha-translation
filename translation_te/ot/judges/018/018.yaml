    issue: The rendering ‘గృహదేవతా విగ్రహాలు’ is stylistically heavy.
    rationale: It is intelligible, but ‘ఇంట్లో ఉంచుకునే విగ్రహాలు’ is more idiomatic modern Telugu and still conveys that the teraphim were household cult objects.
  - severity: low
    issue: The existing footnote’s formulation of the grammatical alternative is overly categorical.
    rationale: The Hebrew juxtaposition permits an alternative relation between ‘carved image’ and ‘ephod,’ but the note should present ‘ఏఫోదుకు చెందిన చెక్కిన ప్రతిమ’ as a possible reading, rather than label it simply the literal reading.
