source:
  edition: WLC
  text: וְ/אֵ֗לֶּה בָּ֚אוּ בֵּ֣ית מִיכָ֔ה וַ/יִּקְחוּ֙ אֶת פֶּ֣סֶל הָ/אֵפ֔וֹד וְ/אֶת הַ/תְּרָפִ֖ים וְ/אֶת הַ/מַּסֵּכָ֑ה וַ/יֹּ֤אמֶר אֲלֵי/הֶם֙ הַ/כֹּהֵ֔ן מָ֥ה אַתֶּ֖ם עֹשִֽׂים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/018.yaml
  text: These men went into Micah’s house and took the carved image[a], the ephod, the household idols, and the cast image. Then the priest said to them, “What are you doing?”
translation:
  language: te
  text: వీరు మీకా ఇంట్లోకి వెళ్లి, చెక్కిన ప్రతిమను, ఏఫోదును[a], ఇంట్లో ఉంచుకునే విగ్రహాలను[b], పోతపోసిన ప్రతిమను తీసుకున్నారు. అప్పుడు యాజకుడు వారిని, “మీరు ఏమి చేస్తున్నారు?” అని అడిగాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మసొరా హీబ్రూ పాఠంలో ‘చెక్కిన ప్రతిమ’కు, ‘ఏఫోదు’కు మధ్య ‘మరియు’ లేదు. కాబట్టి దీనిని “ఏఫోదుకు చెందిన చెక్కిన ప్రతిమను” అని కూడా చదవవచ్చు. అయితే సమీప సందర్భం (18:17) వీటిని వేర్వేరు వస్తువులుగా జాబితా చేస్తుంది; కొన్ని ప్రాచీన అనువాదాలు కూడా వాటి మధ్య ‘మరియు’ని కలిగివున్నాయి.
    reason: textual_and_grammatical_ambiguity
  - marker: b
    text: హీబ్రూలో తెరాఫీమ్; ఇంటిలో ఉంచుకునే ఆరాధనా వస్తువులు లేదా విగ్రహాలు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: వీరు
  rationale: ఈ సూచన పదం ముందరి సందర్భంలోని ఐదుగురిని సూచిస్తుంది. ఆధునిక తెలుగులో సహజంగా, సంక్షిప్తంగా వారి సూచనను వ్యక్తం చేస్తుంది.
- source_word: בָּאוּ בֵּית מִיכָה
  choice: మీకా ఇంట్లోకి వెళ్లి
  rationale: בוא అనే క్రియకు ‘వచ్చు/వెళ్లు/ప్రవేశించు’ అనే సందర్భానుసార భావం ఉంది. ముందరి వచనంలోని కథన గమనానికి అనుగుణంగా ‘ఇంట్లోకి వెళ్లి’ సహజంగా ఉంది.
- source_word: וַיִּקְחוּ
  choice: తీసుకున్నారు
  rationale: సాధారణ కథన క్రియ యొక్క ప్రాథమిక భావాన్ని ఉంచుతుంది; ‘దోచుకున్నారు’ వంటి మరింత వ్యాఖ్యాత్మక పదాన్ని చేర్చదు.
- source_word: פֶּסֶל
  choice: చెక్కిన ప్రతిమ
  rationale: చెక్కి చేసిన ఆరాధనా ప్రతిమ అనే భౌతిక భావాన్ని తెలియజేస్తుంది; అన్ని వస్తువులనూ ఒకే సాధారణ ‘విగ్రహం’ అనే పదంలో కలిపివేయదు.
- source_word: הָאֵפוֹד
  choice: ఏఫోదు
  rationale: ఇది ప్రత్యేక సాంస్కృతిక, ఆరాధనా వస్తువు; సరళమైన సమానార్థక తెలుగు పదం లేనందున లిప్యంతరీకరణ చేయబడింది. ఇక్కడ ‘యాజక వస్త్రం’ అని నిర్దిష్టం చేయడం దాని స్వరూపం లేదా వినియోగాన్ని అతిగా నిర్ణయించవచ్చు.
- source_word: הַתְּרָפִים
  choice: గృహదేవతా విగ్రహాలు
  rationale: తెరాఫీమ్ అనే గృహ ఆరాధనా వస్తువుల భావాన్ని సాధారణ పాఠకులకు అర్థమయ్యేలా తెలుపుతుంది; వాటిని నిజమైన దేవతలుగా నిర్ధారించకుండా విగ్రహాలుగా వ్యక్తం చేస్తుంది.
- source_word: הַמַּסֵּכָה
  choice: పోతపోసిన ప్రతిమ
  rationale: లోహాన్ని కరిగించి అచ్చులో పోసి చేసిన ప్రతిమ అనే మూలపద భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: וַיֹּאמֶר אֲלֵיהֶם הַכֹּהֵן
  choice: అప్పుడు యాజకుడు వారితో … అని అడిగాడు
  rationale: కథన క్రమాన్ని ‘అప్పుడు’ తెలియజేస్తుంది. ప్రశ్నను పలికినందున తెలుగులో ‘అడిగాడు’ సహజంగా ఉంది.
- source_word: מָה אַתֶּם עֹשִׂים
  choice: మీరు ఏమి చేస్తున్నారు?
  rationale: మూలంలోని సూటి ప్రశ్నను ‘ఇక్కడ’ వంటి అదనపు స్థల సూచన లేకుండా కాపాడుతుంది.
theological_decisions:
- issue: విగ్రహారాధనకు సంబంధించిన నాలుగు వస్తువుల ప్రత్యేకత
  choice: ‘చెక్కిన ప్రతిమ,’ ‘ఏఫోదు,’ ‘గృహదేవతా విగ్రహాలు,’ ‘పోతపోసిన ప్రతిమ’ అని వేర్వేరుగా అనువదించడం
  alternative: అన్నిటినీ సాధారణంగా ‘విగ్రహాలు’ అని అనువదించడం
  rationale: మూలపాఠం వేర్వేరు ఆరాధనా వస్తువులను పేర్కొంటుంది. వాటి మధ్య ఉన్న పదార్థపరమైన, విధిపరమైన తేడాలను అనువాదం కాపాడుతుంది; అదనపు మతశాస్త్రీయ వ్యాఖ్యను చేర్చదు.
- issue: פֶּסֶל הָאֵפוֹד పదబంధంలోని పాఠ్య/వ్యాకరణ అస్పష్టత
  choice: సందర్భం మరియు ప్రాచీన అనువాదాల ఆధారంగా ‘చెక్కిన ప్రతిమను, ఏఫోదును’ అనే రెండు వస్తువులుగా ప్రధాన పాఠంలో ఇవ్వడం, అస్పష్టతను పాదటిప్పణిలో నమోదు చేయడం
  alternative: ‘ఏఫోదు యొక్క చెక్కిన ప్రతిమను’ అని ఒకే పదబంధంగా చదవడం
  rationale: మసొరా పాఠంలో ఈ రెండు నామవాచకాల మధ్య సంధికారక పదం లేదు; అయితే సమీప సందర్భం (న్యాయాధిపతులు 18:17) వాటిని వేర్వేరు వస్తువులుగా జాబితా చేస్తుంది, కొన్ని ప్రాచీన అనువాదాలు కూడా సంధికారకంతో చదువుతాయి. ప్రధాన పాఠంలో సందర్భోచిత పఠనాన్ని ఉంచి, నిజమైన అస్పష్టతను దాచకుండా పాదటిప్పణిలో చూపించబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. ‘ఏఫోదు’ వంటి సాంస్కృతిక పదం లిప్యంతరీకరించబడగా, మిగతా ఆరాధనా వస్తువులు సాధారణ పాఠకులకు అర్థమయ్యే స్పష్టమైన పదాలతో వేరు చేయబడ్డాయి.
