  terminology: ‘చెక్కిన ప్రతిమ,’ ‘ఏఫోదు,’ and ‘పోతపోసిన ప్రతిమ’ appropriately preserve the distinct Hebrew terms. ‘ఏఫోదు’ should remain transliterated. A footnote for ‘ఇంట్లో ఉంచుకునే విగ్రహాలు’ appropriately identifies the term as teraphim and preserves its culturally specific reference.
  issues:
