  rationale: The revision removes an added degree of distance, sharpens the isolation idiom to ‘no dealings,’ corrects the grammatical description in the footnote, and retains the source’s ambiguity concerning the relation of the valley to Beth-rehob. The footnote marker remains anchored to the disputed phrase.
