id: JDG.18.28
reference: Judges 18:28
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אֵ֨ין מַצִּ֜יל כִּ֧י רְֽחוֹקָה הִ֣יא מִ/צִּיד֗וֹן וְ/דָבָ֤ר אֵין לָ/הֶם֙ עִם אָדָ֔ם וְ/הִ֕יא בָּ/עֵ֖מֶק אֲשֶׁ֣ר לְ/בֵית רְח֑וֹב וַ/יִּבְנ֥וּ אֶת הָ/עִ֖יר וַ/יֵּ֥שְׁבוּ בָֽ/הּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/028.yaml
  text: And there was no one to deliver them[a], because it was far from Sidon, and they had no dealings with anyone; and it was in the valley that belongs to Beth-rehob. Then they rebuilt the city and lived in it.
translation:
  language: te
  text: వారిని రక్షించే వారు ఎవరూ లేరు. ఎందుకంటే ఆ పట్టణం సీదోనుకు దూరంగా ఉంది; అక్కడివారికి ఎవరితోనూ వ్యవహారాలు లేవు. అది బేత్-రెహోబుకు చెందిన లోయలో[a] ఉంది. ఆ తర్వాత వారు పట్టణాన్ని పునర్నిర్మించి, అందులో నివసించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘బేత్-రెహోబు సమీపంలోని లోయలో.’ హీబ్రూ పదబంధం సంక్షిప్తంగా ఉంది; ఇక్కడి ఉపసర్గ అధీనాన్ని కాక సమీపాన్ని కూడా సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: מַצִּיל
  choice: రక్షించేవారు
  rationale: హిఫీల్ కృదంతం ఆపదనుంచి విడిపించే లేదా కాపాడే వ్యక్తిని సూచిస్తుంది. సైనిక దాడి సందర్భంలో ‘రక్షించేవారు’ సహజంగా ఉండి, అనవసరమైన ప్రత్యేక మతపరమైన భావాన్ని దిగుమతి చేయదు.
- source_word: רְחוֹקָה הִיא מִצִּידוֹן
  choice: ఆ పట్టణం సీదోనుకు చాలా దూరంలో ఉంది
  rationale: స్త్రీలింగ సర్వనామం పట్టణాన్ని సూచిస్తుంది. తెలుగులో సూచ్యార్థాన్ని స్పష్టంగా తెలియజేయడానికి ‘ఆ పట్టణం’ అని ఇచ్చాం.
- source_word: וְדָבָר אֵין לָהֶם עִם אָדָם
  choice: అక్కడివారికి ఎవరితోనూ సంబంధాలు లేవు
  rationale: అక్షరార్థంగా ‘వారికి మనిషితో మాట/విషయం లేదు.’ సందర్భంలో ఇది సామాజిక లేదా రాజకీయ ఒంటరితనాన్ని సూచిస్తుంది; సాధారణ మానవ సంబంధమే లేదని అతిశయంగా చెప్పకుండా ‘సంబంధాలు లేవు’ అని అనువదించాం.
- source_word: אָדָם
  choice: ఎవరితోనూ
  rationale: ఏకవచన రూపమైనప్పటికీ ఇక్కడ సాధారణార్థంలో వాడబడింది; తెలుగులో ‘ఎవరితోనూ’ సందర్భార్థాన్ని సహజంగా అందిస్తుంది.
- source_word: בָּעֵמֶק
  choice: లోయలో
  rationale: עֵמֶק సాధారణంగా లోయ లేదా పల్లపు ప్రాంతాన్ని సూచిస్తుంది; ఇక్కడ ‘లోయ’ సూటిగా సరిపోతుంది.
- source_word: אֲשֶׁר לְבֵית רְחוֹב
  choice: బేత్-రెహోబుకు చెందిన
  rationale: ఈ సంక్షిప్త హీబ్రూ ప్రయోగంలోని לְ సంబంధం లేదా అధీనాన్ని సూచించవచ్చు. ప్రధాన పాఠంలో భూభాగ సంబంధమైన భావాన్ని ఇచ్చి, సమీపార్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: וַיִּבְנוּ אֶת הָעִיר
  choice: వారు పట్టణాన్ని తిరిగి కట్టి
  rationale: మునుపటి వచనంలో పట్టణం కాల్చివేయబడింది కాబట్టి, సాధారణంగా ‘కట్టారు’ అనే హీబ్రూ క్రియ ఇక్కడ పునర్నిర్మాణాన్ని సూచిస్తుంది. ‘తిరిగి కట్టి’ సందర్భసిద్ధమైన భావాన్ని స్పష్టం చేస్తుంది.
- source_word: וַיֵּשְׁבוּ בָהּ
  choice: అందులో నివసించారు
  rationale: יָשַׁב ఇక్కడ ఒక చోట నివసించడం లేదా స్థిరపడడాన్ని సూచిస్తుంది; ‘నివసించారు’ ఆధునిక ప్రామాణిక తెలుగులో సహజమైనది.
- source_word: בֵית רְחוֹב
  choice: బేత్-రెహోబు
  rationale: ఇది స్థలనామం కాబట్టి అర్థానువాదం చేయకుండా తెలుగు లిపిలో లిప్యంతరీకరించాం.
