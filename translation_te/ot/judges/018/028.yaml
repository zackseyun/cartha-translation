translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. భౌగోళిక నామాలను తెలుగు లిపిలో లిప్యంతరీకరించాం. మూలంలోని అస్పష్టమైన బేత్-రెహోబు సంబంధాన్ని ప్రధాన పాఠం మరియు పాదసూచిక ద్వారా నిలిపాం; పాదసూచిక గుర్తును అది వివరిస్తున్న పదబంధం దగ్గర ఉంచాం.
