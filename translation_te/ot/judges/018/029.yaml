id: JDG.18.29
reference: Judges 18:29
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּקְרְא֤וּ שֵׁם הָ/עִיר֙ דָּ֔ן בְּ/שֵׁם֙ דָּ֣ן אֲבִי/הֶ֔ם אֲשֶׁ֥ר יוּלַּ֖ד לְ/יִשְׂרָאֵ֑ל וְ/אוּלָ֛ם לַ֥יִשׁ שֵׁם הָ/עִ֖יר לָ/רִאשֹׁנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/029.yaml
  text: And they called the name of the city Dan[a], after the name of Dan their father, who was born to Israel; however, the name of the city formerly was Laish.
translation:
  language: te
  text: వారు ఆ పట్టణానికి, ఇశ్రాయేలుకు పుట్టిన తమ తండ్రి[a] దాను పేరును బట్టి, దాను అని పేరు పెట్టారు; అయితే ఆ పట్టణం పేరు పూర్వం లాయిషు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తమ పూర్వీకుడు.” హీబ్రూలో “తండ్రి” అనే పదం ప్రత్యక్ష తండ్రినే కాకుండా వంశపూర్వీకుణ్ణి కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְאוּ שֵׁם הָעִיר
  choice: వారు ఆ పట్టణానికి ... పేరు పెట్టారు
  rationale: హీబ్రూ పదబంధాన్ని తెలుగులో సహజమైన నామకరణ ప్రయోగంతో వ్యక్తపరుస్తుంది; ‘పట్టణం పేరును పిలిచారు’ అనే అసహజ పదానువాదాన్ని నివారిస్తుంది.
- source_word: דָּן
  choice: దాను
  rationale: వ్యక్తి పేరుగానూ పట్టణం పేరుగానూ ఒకే రూపాన్ని ఉంచి, నామకరణ సంబంధాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: בְּשֵׁם דָּן אֲבִיהֶם
  choice: తమ తండ్రి అయిన దాను పేరును బట్టి
  rationale: בְּשֵׁם ఇక్కడ ఎవరి పేరును ఆధారంగా చేసుకొని పేరు పెట్టారో సూచిస్తుంది. אֲבִיהֶם యొక్క ప్రత్యక్ష కుటుంబపదమైన ‘తండ్రి’ని ప్రధాన పాఠ్యంలో నిలుపుతుంది.
- source_word: אֲשֶׁר יוּלַּד לְיִשְׂרָאֵל
  choice: దాను ఇశ్రాయేలుకు పుట్టాడు
  rationale: మూలంలోని కర్మణి భావాన్ని సహజమైన తెలుగులో అందిస్తూ ‘ఇశ్రాయేలు’ అనే పేరును యథాతథంగా ఉంచుతుంది.
- source_word: וְאוּלָם
  choice: అయితే
  rationale: కొత్త పేరుకు, పూర్వపు పేరుకు మధ్యనున్న వ్యత్యాసాన్ని ఆధునిక తెలుగులో సహజంగా సూచిస్తుంది.
- source_word: לַיִשׁ
  choice: లాయిషు
  rationale: స్థలనామాన్ని తెలుగులో సులభంగా ఉచ్చరించగల లిప్యంతరీకరణగా అందిస్తుంది.
- source_word: לָרִאשֹׁנָה
  choice: పూర్వం
  rationale: పేరు మార్చకముందున్న స్థితిని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: వంశసంబంధ సూచన אֲבִיהֶם
  choice: తమ తండ్రి
  alternative: తమ పూర్వీకుడు
  rationale: אָב అనే హీబ్రూ పదం ప్రత్యక్ష తండ్రితో పాటు వంశపూర్వీకుని కూడా సూచించగలదు. ప్రధాన పాఠ్యం ప్రత్యక్ష పదార్థాన్ని నిలుపుతుంది; సందర్భానుసారమైన విస్తృత అర్థాన్ని పాదసూచికలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని ఉపయోగించాం. హీబ్రూ నామకరణ ప్రయోగాన్ని అర్థసహజంగా మార్చినా, వ్యక్తి పేరు–పట్టణం పేరు మధ్య సంబంధాన్ని మరియు ‘తండ్రి’ అనే మూలపదంలోని వంశపరమైన విస్తృతార్థాన్ని సంరక్షించాం.
