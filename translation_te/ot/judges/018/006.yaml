base_translation:
  language: en
  yaml_path: translation/ot/judges/018/006.yaml
  text: And the priest said to them[a], “Go in peace. The journey on which you are going is before Yahweh.”
translation:
  language: te
  text: అప్పుడు యాజకుడు వారితో, “క్షేమంగా వెళ్లండి. మీరు వెళ్లే మార్గం యెహోవా ఎదుట ఉంది[a],” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీ మార్గం యెహోవా ఎదుట ఉంది,” అంటే మీ ప్రయాణం ఆయన దృష్టిలో ఉంది. ఈ మాట తప్పనిసరిగా దేవుని స్పష్టమైన ఆమోదాన్ని సూచించదు.
    reason: నֹכַח అనే పదబంధంలోని ‘ఎదుట/దృష్టిలో’ భావాన్ని మరియు దైవిక ఆమోదం గురించి వచనంలో ఉన్న అనిశ్చితిని స్పష్టం చేయడం.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... అన్నాడు
  rationale: హీబ్రూ కథనంలోని వరుస చర్యను ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది; అవసరానికి మించిన కాలార్థాన్ని జోడించదు.
- source_word: הַכֹּהֵן
  choice: యాజకుడు
  rationale: సందర్భంలో ఇప్పటికే ప్రస్తావించబడిన నిర్దిష్ట యాజకుణ్ణి సూచిస్తుంది.
- source_word: לְכוּ לְשָׁלוֹם
  choice: క్షేమంగా వెళ్లండి
  rationale: బయలుదేరే వారికి పలికే ఆశీర్వాదసదృశ హీబ్రూ నుడికారాన్ని సహజమైన, గౌరవప్రదమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: נֹכַח
  choice: సన్నిధిలో
  rationale: ఎదుట లేదా దృష్టిలో ఉండటం అనే మూలభావాన్ని కాపాడుతుంది; దైవిక ఆమోదం లేదా విజయహామీని అదనంగా చేర్చదు.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో సుపరిచితమైన లిప్యంతరీకరణతో అందిస్తుంది.
- source_word: דַּרְכְּכֶם אֲשֶׁר תֵּלְכוּ בָהּ
  choice: మీరు వెళ్లే మార్గం
  rationale: ‘మీ మార్గం, దానిలో మీరు వెళ్తారు’ అనే హీబ్రూ భావాన్ని పునరుక్తి లేకుండా సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: దానీయుల ప్రయాణం గురించి యాజకుడు పలికిన మాటలోని భావబలం
  choice: “మీరు వెళ్లే మార్గం యెహోవా సన్నిధిలో ఉంది” అని, ఆ ప్రయాణం దేవుని దృష్టికి ప్రత్యక్షంగా ఉందనే భావంతో అనువదించబడింది.
  alternative: “యెహోవా మీ ప్రయాణాన్ని ఆమోదిస్తున్నాడు” లేదా “యెహోవా మీ ప్రయాణాన్ని సఫలం చేస్తాడు” అని స్పష్టమైన దైవిక ఆమోదం లేదా విజయహామీగా అనువదించడం.
  rationale: נֹכַח יְהוָה అనే పదబంధం నేరుగా మార్గం యెహోవా ఎదుట లేదా సన్నిధిలో ఉందని చెబుతుంది. ఆయన దానిని ఆమోదించాడని, ఆశీర్వదించాడని, లేదా విజయాన్ని హామీ ఇచ్చాడని స్పష్టంగా చెప్పదు; అందువల్ల వచనంలోని ఉద్దేశపూర్వక అనిశ్చితి, theological tension కాపాడబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. “క్షేమంగా వెళ్లండి” సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే ఆశీర్వాదసదృశ ప్రయోగం. దైవిక ఆమోదాన్ని వచనంలో లేనంత బలంగా చెప్పకుండా “సన్నిధిలో ఉంది” అనే నిర్మాణం నిలుపబడింది.
