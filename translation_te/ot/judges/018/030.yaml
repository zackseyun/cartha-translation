id: JDG.18.30
reference: Judges 18:30
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּקִ֧ימוּ לָ/הֶ֛ם בְּנֵי דָ֖ן אֶת הַ/פָּ֑סֶל וִ֠/יהוֹנָתָן בֶּן גֵּרְשֹׁ֨ם בֶּן מְ ה֣וּא וּ/בָנָ֗י/ו הָי֤וּ כֹהֲנִים֙ לְ/שֵׁ֣בֶט הַ/דָּנִ֔י עַד י֖וֹם גְּל֥וֹת הָ/אָֽרֶץ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/030.yaml
  text: Then the sons of Dan set up for themselves the carved image, and Jonathan the son of Gershom, son of Moses,[a] he and his sons were priests for the tribe of the Danites until the day of the exile of the land.
translation:
  language: te
  text: అప్పుడు దాను కుమారులు తమ కోసం ఆ చెక్కిన ప్రతిమను నిలబెట్టారు. మోషే కుమారుడైన గేర్షోము కుమారుడైన యోనాతానూ అతని కుమారులూ దాను గోత్రానికి యాజకులుగా ఉన్నారు—దేశం చెరలోకి వెళ్లిన దినం వరకు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקִימוּ
  choice: నిలబెట్టుకున్నారు
  rationale: קום హిఫీల్ రూపం ఇక్కడ ప్రతిమను నిలబెట్టడం లేదా ప్రతిష్ఠించడం అనే భావాన్ని ఇస్తుంది. తెలుగు సందర్భంలో ‘నిలబెట్టుకున్నారు’ సహజంగా ఉండి, తమ ఉపయోగార్థం చేసిన చర్యనూ సూచిస్తుంది.
- source_word: לָהֶם
  choice: తమ కోసం
  rationale: దాతృక సర్వనామం దానీయులు తమ ప్రయోజనం కోసం చేసిన కార్యాన్ని సూచిస్తుంది.
- source_word: בְּנֵי דָן
  choice: దాను కుమారులు
  rationale: హీబ్రూ బంధుత్వ ప్రయోగాన్ని సన్నిహితంగా నిలుపుతూ ఆధునిక తెలుగులో అర్థమయ్యే రూపం.
- source_word: הַפָּסֶל
  choice: ఆ చెక్కిన ప్రతిమ
  rationale: פֶּסֶל చెక్కి చేసిన రూపాన్ని సూచిస్తుంది; ‘విగ్రహం’ అనే వ్యాఖ్యాత్మక పదం కంటే ‘చెక్కిన ప్రతిమ’ మూలంలోని స్పష్టమైన భౌతిక భావాన్ని కాపాడుతుంది.
- source_word: וִיהוֹנָתָן
  choice: యోనాతాను
  rationale: హీబ్రూ వ్యక్తినామానికి ప్రామాణిక తెలుగు లిప్యంతరీకరణ.
- source_word: בֶּן גֵּרְשֹׁם בֶּן מְהוּא
  choice: మోషే కుమారుడైన గేర్షోము కుమారుడు
  rationale: తెలుగులో వంశక్రమం స్పష్టంగా ఉండేలా నిర్మాణాన్ని అమర్చింది. మూల పాఠపు ప్రాథమిక పఠనం ‘మోషే’; మసొరెతీయ సంప్రదాయంలోని ప్రత్యామ్నాయ పఠనం పాదసూచికలో ఉంచబడింది.
- source_word: וּבָנָיו
  choice: అతని కుమారులు
  rationale: యోనాతానుతో పాటు అతని కుమారులూ ‘యాజకులుగా ఉన్నారు’ అనే క్రియకు కర్తలని తెలుగులో స్పష్టపరుస్తుంది.
- source_word: כֹהֲנִים
  choice: యాజకులు
  rationale: ఆరాధనా సేవ సందర్భంలో כהנים కు సాధారణమైన, గౌరవప్రదమైన తెలుగు పదం.
- source_word: לְשֵׁבֶט הַדָּנִי
  choice: దాను గోత్రానికి
  rationale: దానీయుల గోత్రానికి సేవ చేసినట్లు సహజ తెలుగులో తెలియజేస్తుంది; ‘గోత్రం’ שבט యొక్క ఇక్కడి సామాజిక భావానికి సరిపోతుంది.
- source_word: עַד יוֹם גְּלוֹת הָאָרֶץ
  choice: దేశం చెరలోకి వెళ్లిన దినం వరకు
  rationale: హీబ్రూ ప్రయోగంలోని అసాధారణమైన ‘దేశం చెరపోవడం’ అనే నిర్మాణాన్ని నిర్దిష్ట చారిత్రక చెరగా వ్యాఖ్యానించకుండా సహజ తెలుగులో కాపాడుతుంది.
theological_decisions:
- issue: యోనాతాను పూర్వికుని వంశావళి గుర్తింపు
  choice: మోషే కుమారుడు
  alternative: మనష్షే కుమారుడు
  rationale: మసొరెతీయ పాఠంలోని మూల వ్యంజనాలు ‘మోషే’ పఠనాన్ని సూచిస్తాయి; పైకి ఎత్తి రాసిన నూన్ అక్షరంతో సంప్రదాయంగా ‘మనష్షే’ అని చదువుతారు. పాఠసంప్రదాయం ఉంచిన ఉద్రిక్తతను తొలగించకుండా ప్రధాన పాఠంలో ‘మోషే’ను, ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. వంశావళి సంబంధం స్పష్టంగా చేయబడింది; అయితే పాఠాంతరాన్ని గానీ, ‘దేశం చెరలోకి వెళ్లడం’ ఏ చారిత్రక సంఘటనను సూచిస్తుందనే అనిశ్చితిని గానీ వ్యాఖ్యానంతో పరిష్కరించలేదు.
