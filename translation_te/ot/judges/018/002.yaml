  text: וַ/יִּשְׁלְח֣וּ בְנֵי דָ֣ן מִֽ/מִּשְׁפַּחְתָּ֡/ם חֲמִשָּׁ֣ה אֲנָשִׁ֣ים מִ/קְצוֹתָ/ם֩ אֲנָשִׁ֨ים בְּנֵי חַ֜יִל מִ/צָּרְעָ֣ה וּ/מֵֽ/אֶשְׁתָּאֹ֗ל לְ/רַגֵּ֤ל אֶת הָ/אָ֨רֶץ֙ וּ/לְ/חָקְרָ֔/הּ וַ/יֹּאמְר֣וּ אֲלֵ/הֶ֔ם לְכ֖וּ חִקְר֣וּ אֶת הָ/אָ֑רֶץ וַ/יָּבֹ֤אוּ הַר אֶפְרַ֨יִם֙ עַד בֵּ֣ית מִיכָ֔ה וַ/יָּלִ֖ינוּ שָֽׁם־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/002.yaml
  text: So the sons of Dan sent five men from their clan[a], from among their whole number, valiant men from Zorah and from Eshtaol, to spy out the land and to explore it. And they said to them, “Go, explore the land.” So they came to the hill country of Ephraim, as far as the house of Micah[c][b], and spent the night there.
translation:
  language: te
  text: 'అప్పుడు దాను కుమారులు తమ వంశంలో నుండి, తమలో నుండి ఐదుగురు సమర్థులైన మనుష్యులను[a]—జొరా, ఎష్టాయోలు పట్టణాలకు చెందినవారిని—ఆ దేశాన్ని వేగుచూడటానికి, దానిని క్షుణ్ణంగా పరిశీలించడానికి పంపారు. వారితో ఇలా అన్నారు: “వెళ్లి, ఆ దేశాన్ని క్షుణ్ణంగా పరిశీలించండి.” వారు ఎఫ్రాయిము కొండప్రాంతానికి, మీకా ఇంటి వరకు[b] చేరి, అక్కడ రాత్రి గడిపారు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “శౌర్యవంతులైన మనుష్యులను.” హీబ్రూ పదబంధం బలం, సామర్థ్యం లేదా శౌర్యం గల మనుష్యులను సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “మీకా ఇల్లు” అనేది అతని నివాసగృహాన్ని లేదా అతని కుటుంబ నివాస సముదాయాన్ని సూచించవచ్చు.
    reason: cultural_note
lexical_decisions:
- source_word: בְנֵי דָן
  choice: దాను కుమారులు
  rationale: హీబ్రూ గోత్రసంబంధ కుటుంబ రూపకాన్ని నేరుగా నిలుపుతూ, తెలుగులో అర్థమయ్యే సంప్రదాయబద్ధమైన పదబంధం.
- source_word: מִמִּשְׁפַּחְתָּם ... מִקְצוֹתָם
  choice: తమ వంశస్థులలో నుండి
  rationale: מִשְׁפָּחָה సూచించే వంశ/కుల స్థాయి బంధుత్వ సమూహాన్నీ, מִקְצוֹתָם యొక్క ‘వారిలోనుండి ఎంపికచేసి’ అనే భాగార్థాన్నీ సహజంగా కలిపి తెలియజేస్తుంది; ‘మొత్తం’ అనే మూలంలో లేని భావాన్ని చేర్చదు.
- source_word: אֲנָשִׁים בְּנֵי חַיִל
  choice: సమర్థులైన మనుష్యులు
  rationale: గూఢచర్యం, పరిశీలన పనికి తగిన బలం, సామర్థ్యం, నైపుణ్యం గలవారనే సందర్భార్థాన్ని ఇస్తుంది; ఈ పదబంధంలో సాధ్యమైన శౌర్య భావాన్ని పాదటిప్పణిలో ఉంచింది.
- source_word: מִצָּרְעָה וּמֵאֶשְׁתָּאֹל
  choice: జొర్యా, ఎష్తాయోలు పట్టణాలకు చెందినవారు
  rationale: స్థలనామాలను లిప్యంతరీకరించి, מן ఉపసర్గ సూచించే Herkunft/స్థానసంబంధాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: לְרַגֵּל אֶת־הָאָרֶץ
  choice: ఆ దేశాన్ని వేగుచూడడానికి
  rationale: רגל యొక్క రహస్య పరిశీలన లేదా గూఢచర్య భావాన్ని ‘వేగుచూడు’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: וּלְחָקְרָהּ / חִקְרוּ
  choice: దాన్ని క్షుణ్ణంగా పరిశీలించడానికి / ఆ దేశాన్ని క్షుణ్ణంగా పరిశీలించండి
  rationale: חקר లోని జాగ్రత్తగా శోధించి తెలుసుకునే భావాన్ని నిలుపుతుంది; ముందున్న רגל తో ఉన్న అర్థభేదాన్ని కూడా కాపాడుతుంది.
- source_word: הַר אֶפְרַיִם
  choice: ఎఫ్రాయిము కొండప్రాంతం
  rationale: ఒకే కొండను కాక ఎఫ్రాయిము ఉన్నతభూములను సూచించే భౌగోళిక అర్థం.
- source_word: עַד בֵּית מִיכָה
  choice: మీకా ఇంటి వరకు
  rationale: עַד యొక్క గమ్యపరిమితి భావాన్నీ, בֵּית מִיכָה యొక్క నేర అర్థాన్నీ నిలుపుతుంది.
- source_word: וַיָּלִינוּ שָׁם
  choice: అక్కడ రాత్రి గడిపారు
  rationale: లון క్రియ సూచించే రాత్రిపూట బసను ఆధునిక, సహజ తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
