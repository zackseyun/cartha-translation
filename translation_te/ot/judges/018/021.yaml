    issue: ‘వెళ్లిపోయారు’ is slightly over-specific for וַיֵּלֵכוּ.
    rationale: הלך simply continues the movement; ‘వెళ్లారు’ preserves the source without adding a nuance of leaving permanently or going away.
  - severity: medium
    issue: ‘సామగ్రి’ is less precise for הַכְּבוּדָּה and does not align well with its footnote.
    rationale: In this travel context the term denotes goods, baggage, or valued possessions. ‘విలువైన వస్తువులు’ is clearer and the footnote can retain alternatives.
  - severity: low
    issue: ‘తమకు ముందుగా’ is somewhat awkward.
    rationale: ‘తమ ముందు’ naturally expresses the reflexive sense of לִפְנֵיהֶם.
  revised_text: అప్పుడు వారు వెనుదిరిగి వెళ్లారు; చిన్నపిల్లలను, పశువులను, తమ విలువైన వస్తువులను[a] తమ ముందు[b] ఉంచారు.
