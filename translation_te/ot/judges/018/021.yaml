source:
  edition: WLC
  text: וַ/יִּפְנ֖וּ וַ/יֵּלֵ֑כוּ וַ/יָּשִׂ֨ימוּ אֶת הַ/טַּ֧ף וְ/אֶת הַ/מִּקְנֶ֛ה וְ/אֶת הַ/כְּבוּדָּ֖ה לִ/פְנֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/021.yaml
  text: So they turned and went on[a], and put the little children, the livestock[b], and the valuables before them.
translation:
  language: te
  text: అప్పుడు వారు వెనుదిరిగి వెళ్లారు; చిన్నపిల్లలను, పశువులను, తమ విలువైన వస్తువులను[a] తమ ముందు[b] ఉంచారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “తమ సామానును,” “తమ ఆస్తిని,” లేదా “తమ సరుకులను.” ఇక్కడి హీబ్రూ పదం “మహిమ”ను కాక, వెంట తీసుకెళ్లగల వస్తుసంపదను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: పదశః “వారి ముందు” లేదా “వారికంటే ముందుగా.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְנוּ
  choice: వెనుదిరిగి
  rationale: פנה అనే క్రియకు ఇక్కడ ‘తిరుగు/వెనుదిరుగు’ అనే ప్రాథమిక భావం ఉంది; సందర్భానికి మించిన దిశను నిర్దేశించకుండా ప్రయాణ గమనాన్ని తెలియజేస్తుంది.
- source_word: וַיֵּלֵכוּ
  choice: వెళ్లిపోయారు
  rationale: הלך కథన వరుసలో వారి ప్రయాణం కొనసాగినట్లు సూచిస్తుంది; ఆధునిక తెలుగులో ‘వెళ్లిపోయారు’ సహజంగా ఉంటుంది.
- source_word: וַיָּשִׂימוּ
  choice: ఉంచారు
  rationale: שׂים కు సాధారణంగా ‘ఉంచు/పెట్టు’ అనే అర్థం; ఈ అమరిక సందర్భంలో ‘ఉంచారు’ సహజమైన ఎంపిక.
- source_word: הַטַּף
  choice: చిన్నపిల్లలను
  rationale: טף సమూహంలోని చిన్నవారిని, ముఖ్యంగా రక్షణ అవసరమైన పిల్లలను సూచిస్తుంది; ‘చిన్నపిల్లలు’ దాని భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: הַמִּקְנֶה
  choice: పశువులను
  rationale: מקנה వివిధ రకాల పెంపుడు మందలను విస్తృతంగా సూచిస్తుంది; ‘పశువులు’ ఒకే జాతికి పరిమితం చేయదు.
- source_word: הַכְּבוּדָּה
  choice: తమ సామగ్రిని
  rationale: כבודה ఇక్కడ ప్రయాణంలో వెంట తీసుకెళ్లే ఆస్తి, సామాను లేదా విలువైన వస్తువులను సూచిస్తుంది; ‘సామగ్రి’ ఈ విస్తృత సందర్భార్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: לִפְנֵיהֶם
  choice: తమకు ముందుగా
  rationale: పదశః ‘వారి ముందు’; విషయకర్తలే వాటిని తమ ముందుభాగంలో ఉంచారనే ప్రతిబింబ భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
