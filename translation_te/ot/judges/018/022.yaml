revisions:
- from: వారు మీకా ఇంటి నుంచి కొంత దూరం వెళ్లినప్పుడు, మీకా ఇంటి సమీపంలోని ఇళ్లలో ఉన్న పురుషులు కూడగట్టబడ్డారు[a]. వారు దాను కుమారులను వెంబడించి చేరుకున్నారు.
  to: వారు మీకా ఇంటి నుంచి కొంత దూరం వెళ్లిపోయిన తరువాత, మీకా ఇంటి సమీపంలోని ఇళ్లలో ఉన్న పురుషులు పిలిపించబడి సమకూడారు[a]. వారు దాను కుమారులను చేరుకున్నారు.
  rationale: The revision retains the source’s narrative sequence and the audited ambiguity of נִזְעֲקוּ. It improves modern Telugu idiom for the mustering of the neighboring men and renders וַיַּדְבִּיקוּ as catching up with the Danites, without adding pursuit or capture as an explicit action.
