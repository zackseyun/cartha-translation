  text: הֵ֥מָּה הִרְחִ֖יקוּ מִ/בֵּ֣ית מִיכָ֑ה וְ/הָ/אֲנָשִׁ֗ים אֲשֶׁ֤ר בַּ/בָּתִּים֙ אֲשֶׁר֙ עִם בֵּ֣ית מִיכָ֔ה נִֽזְעֲק֔וּ וַ/יַּדְבִּ֖יקוּ אֶת בְּנֵי דָֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/022.yaml
  text: When they had gone some distance from Micah’s house[a], the men who were in the houses near Micah’s house were called together, and they overtook the sons of Dan.
translation:
  language: te
  text: వారు మీకా ఇంటి నుంచి కొంత దూరం వెళ్లిపోయిన తరువాత, మీకా ఇంటి సమీపంలోని ఇళ్లలో ఉన్న పురుషులు పిలిపించబడి సమకూడారు[a]. వారు దాను కుమారులను చేరుకున్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘కేకలు వేశారు.’ హీబ్రూ క్రియ హెచ్చరికగా కేకలు వేయడాన్ని గానీ, దాని ఫలితంగా సమకూడడాన్ని గానీ సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִרְחִיקוּ מִבֵּית מִיכָה
  choice: మీకా ఇంటి నుంచి కొంత దూరం వెళ్లినప్పుడు
  rationale: హిఫీల్ రూపం ఇక్కడ దూరమవడం లేదా కొంత దూరం వెళ్లడం అనే భావాన్ని ఇస్తుంది. తెలుగు కథన శైలిలో ఈ రూపం సహజంగా ఉంటుంది.
- source_word: הָאֲנָשִׁים
  choice: పురుషులు
  rationale: మూలంలోని పదం సాధారణంగా ‘ప్రజలు’ అని కాకుండా ప్రత్యేకంగా పురుషులను సూచిస్తుంది.
- source_word: אֲשֶׁר בַּבָּתִּים אֲשֶׁר עִם בֵּית מִיכָה
  choice: మీకా ఇంటి సమీపంలోని ఇళ్లలో ఉన్న
  rationale: అక్షరార్థంగా కొంత అసహజంగా ఉండే ఈ పదబంధంలో עִם అనుబంధం లేదా సామీప్యాన్ని సూచిస్తుంది; ‘సమీపంలోని’ అనేది స్పష్టమైన, సహజమైన తెలుగు.
- source_word: נִזְעֲקוּ
  choice: కూడగట్టబడ్డారు
  rationale: ఈ నిఫాల్ రూపం అత్యవసరంగా పిలిపించబడి సమకూడడాన్ని సూచించవచ్చు. తరువాత జరిగే వెంబడింపుతో ఈ అర్థం చక్కగా సరిపోతుంది; హెచ్చరిక కేక వేయడం అనే ప్రత్యామ్నాయ భావాన్ని పాదసూచికలో ఉంచాం.
- source_word: וַיַּדְבִּיקוּ
  choice: వెంబడించి చేరుకున్నారు
  rationale: ఈ క్రియ వెంటపడి దగ్గరకు చేరడం లేదా పట్టుకోవడం అనే భావాన్ని ఇస్తుంది. ‘పట్టుకున్నారు’ అనేది బంధించారనే అదనపు భావాన్ని కలిగించవచ్చు కాబట్టి, కథన సందర్భానికి తగిన ఈ ప్రయోగాన్ని ఎంచుకున్నాం.
- source_word: אֶת בְּנֵי דָן
  choice: దాను కుమారులను
  rationale: మూలంలోని వంశసంబంధ పదబంధాన్ని నిలుపుతూ, ‘దానీయులను’ అనే సంక్షిప్త జాతినామం బదులు పారదర్శకమైన రూపాన్ని వాడాం.
