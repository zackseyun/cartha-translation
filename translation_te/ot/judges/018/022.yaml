translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. మూలంలోని వంశపరమైన ‘దాను కుమారులు’ అనే రూపాన్ని నిలిపి, సందిగ్ధమైన נִזְעֲקוּ క్రియకు ప్రత్యామ్నాయ అర్థాన్ని పాదసూచికలో భద్రపరిచాం.
