id: JDG.18.24
reference: Judges 18:24
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֡אמֶר אֶת אֱלֹהַ/י֩ אֲשֶׁר עָשִׂ֨יתִי לְקַחְתֶּ֧ם וְֽ/אֶת הַ/כֹּהֵ֛ן וַ/תֵּלְכ֖וּ וּ/מַה לִּ֣/י ע֑וֹד וּ/מַה זֶּ֛ה תֹּאמְר֥וּ אֵלַ֖/י מַה לָּֽ/ךְ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/024.yaml
  text: He said[a], “You have taken my gods that I made, and the priest, and you have gone away. What do I have left now? So how can you say to me, ‘What is the matter with you?’”
translation:
  language: te
  text: 'అతడు ఇలా అన్నాడు: “నేను చేసిన నా దేవుళ్లనూ[a] యాజకుణ్ణీ మీరు తీసుకొని వెళ్లిపోయారు. ఇక నాకు మిగిలిందేమిటి? అలాంటప్పుడు, ‘నీకు ఏమైంది?’ అని నన్ను ఎలా అడుగుతున్నారు?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నా దేవుడు/దేవుళ్లు,” లేదా “నా దైవ ప్రతిమలు.” హీబ్రూ పదం కొన్ని సందర్భాల్లో ఏకవచనాన్నీ బహువచనాన్నీ సూచించగలదు; అయితే ఇక్కడి విస్తృత సందర్భం “నా దేవుళ్లు” అనే అర్థాన్ని సమర్థిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהַי
  choice: నా దేవుళ్లను
  rationale: ఈ పదానికి కొన్ని సందర్భాల్లో ఏకవచన లేదా బహువచన అర్థం ఉండవచ్చు. అయితే మీకా ఇంటిలోని చెక్కిన, పోతపోసిన ఆరాధనా వస్తువుల గురించిన విస్తృత సందర్భం ఇక్కడ బహువచనాన్ని సమర్థిస్తుంది. ‘దేవుళ్లు’ అనే పదం మూలంలోని భావాన్నీ, మనిషి చేసిన దేవతలనే కథన వ్యంగ్యాన్నీ నిలుపుతుంది.
- source_word: אֲשֶׁר עָשִׂיתִי
  choice: నేను చేసిన
  rationale: עשה అనే క్రియకు ఉన్న సాధారణ అర్థాన్ని నేరుగా అందిస్తుంది; ఈ దేవుళ్లు మీకా చేత చేయబడినవి లేదా చేయించబడినవి అనే వాక్యబలాన్ని వ్యాఖ్యానంతో తగ్గించదు.
- source_word: לְקַחְתֶּם ... וַתֵּלְכוּ
  choice: మీరు తీసుకొని వెళ్లిపోయారు
  rationale: రెండవ పురుష బహువచనాన్ని స్పష్టంగా ఉంచుతూ, తీసుకోవడం వల్ల కలిగిన ప్రస్తుత నష్టాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: הַכֹּהֵן
  choice: యాజకుణ్ణి
  rationale: నిర్దిష్టంగా మీకాకు చెందిన యాజకుడినే సూచించే సందర్భాన్ని నిలుపుతుంది.
- source_word: וּמַה לִּי עוֹד
  choice: ఇక నాకు మిగిలిందేమిటి?
  rationale: కేవలం స్వాధీనాన్ని కాక, అన్నీ కోల్పోయాననే మీకా విలాపాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וּמַה זֶּה תֹּאמְרוּ אֵלַי
  choice: అలాంటప్పుడు ... అని నన్ను ఎలా అడుగుతున్నారు?
  rationale: మూలంలోని ప్రశ్నార్థక, ఆగ్రహపూరిత సవాలును సహజ తెలుగులో నిలుపుతుంది; ముందటి వాక్యం నుంచి వచ్చే తార్కిక సంబంధాన్ని ‘అలాంటప్పుడు’ తెలియజేస్తుంది.
- source_word: מַה לָּךְ
  choice: నీకు ఏమైంది?
  rationale: ఒక వ్యక్తిని ఉద్దేశించి ‘నీ సమస్య ఏమిటి?’ లేదా ‘నీకు ఏమైంది?’ అని అడిగే సాధారణ హీబ్రూ నుడికారానికి సహజమైన తెలుగు సమానం.
theological_decisions:
- issue: ఇంటి ఆరాధనా వస్తువుల సందర్భంలో אֱלֹהַי పదం అనువాదం
  choice: నా దేవుళ్లు
  alternative: నా దేవుడు/దేవుళ్లు; నా దైవ ప్రతిమలు; నా విగ్రహాలు
  rationale: ఈ పదానికి మూలార్థం ‘దేవుడు/దేవుళ్లు’; సందర్భం భౌతిక ఆరాధనా వస్తువులను సూచిస్తుంది. ప్రధాన పాఠంలో ‘దేవుళ్లు’ అని ఉంచడం హీబ్రూ పదప్రయోగాన్నీ, మనిషి చేసిన దేవతలనే వేదాంతపరమైన కథన ఉద్రిక్తతనూ నిలుపుతుంది; ‘విగ్రహాలు’ అని వ్యాఖ్యానాత్మకంగా సరళీకరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. దానీయుల సమూహానికి ‘మీరు/అడుగుతున్నారు’ అనే బహువచనం, వారు మీకాను ఉద్దేశించి అన్న మాటలో ‘నీకు’ అనే ఏకవచనం ఉంచబడ్డాయి. మూలంలోని ఆగ్రహం, నష్టం, వ్యంగ్యం అతిశయ వ్యాఖ్యానం లేకుండా నిలుపబడ్డాయి.
