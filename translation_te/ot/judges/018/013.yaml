  yaml_path: translation/ot/judges/018/013.yaml
  text: From there they passed through the hill country of Ephraim and came as far as Micah’s house[a][b].
translation:
  language: te
  text: అక్కడి నుండి వారు ఎఫ్రాయిము కొండప్రాంతం గుండా వెళ్లి, మీకా ఇంటి వరకు వచ్చారు.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీకా గృహం.”
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో “ఎఫ్రాయిము కొండప్రాంతం”; సంప్రదాయంగా “ఎఫ్రాయిము పర్వతం” అని కూడా అనువదిస్తారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַבְרוּ
  choice: గుండా వెళ్లి
  rationale: עבר అనే క్రియకు దాటడం లేదా గుండా వెళ్లడం అనే భావం ఉంది. ఒక ప్రాంతంలో ప్రయాణాన్ని సూచిస్తున్న ఈ సందర్భంలో ‘గుండా వెళ్లి’ సహజంగా ఉండి, ప్రాంతాన్ని దాటుకుంటూ సాగిన భావాన్ని నిలుపుతుంది.
- source_word: מִשָּׁם
  choice: అక్కడి నుండి
  rationale: మునుపటి ప్రదేశం నుండి బయలుదేరడాన్ని సూచించే సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: הַר אֶפְרָיִם
  choice: ఎఫ్రాయిము కొండప్రాంతం
  rationale: ఈ పదబంధం ఒకే పర్వత శిఖరాన్ని కాక, ఎఫ్రాయిముకు చెందిన భౌగోళిక కొండప్రాంతాన్ని సూచిస్తుంది.
- source_word: וַיָּבֹאוּ
  choice: వచ్చారు
  rationale: בוא అనే సాధారణ గమనక్రియ ఇక్కడ ప్రయాణ గమ్యానికి చేరడాన్ని సూచిస్తుంది; ‘వచ్చారు’ కథన ప్రవాహానికి సరిపోతుంది.
- source_word: עַד
  choice: వరకు
  rationale: ప్రయాణం చేరిన హద్దు లేదా గమ్యస్థానాన్ని సూచించే עַד భావాన్ని ‘వరకు’ నేరుగా వ్యక్తపరుస్తుంది.
- source_word: בֵּית מִיכָה
  choice: మీకా ఇంటి
  rationale: హీబ్రూ నిర్మాణం అక్షరార్థంగా ‘మీకా ఇల్లు’; ‘మీకా ఇంటి వరకు’ ఆధునిక తెలుగులో సహజమైన సంబంధరూపం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. భౌగోళిక ప్రాంతాన్ని ఒకే శిఖరంగా అపార్థం చేసుకోకుండా ‘కొండప్రాంతం’ వాడబడింది. అన్ని పాదసూచిక గుర్తులు ప్రధాన వచనంలో చేర్చబడ్డాయి.
