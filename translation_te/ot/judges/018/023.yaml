source:
  edition: WLC
  text: וַֽ/יִּקְרְאוּ֙ אֶל בְּנֵי דָ֔ן וַ/יַּסֵּ֖בּוּ פְּנֵי/הֶ֑ם וַ/יֹּאמְר֣וּ לְ/מִיכָ֔ה מַה לְּ/ךָ֖ כִּ֥י נִזְעָֽקְתָּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/023.yaml
  text: They called out to the sons of Dan[a], and they turned around and said to Micah, “What is the matter with you[b], that you have called out?”
translation:
  language: te
  text: వారు దాను వంశస్థులను పిలిచారు; వారు వెనుతిరిగి మీకాతో, “నీకేమైంది? ఎందుకు కేకలు వేశావు?” అన్నారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఎందుకు మొరపెట్టుకున్నావు?” లేదా “ఎందుకు బిగ్గరగా పిలిచావు?”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְאוּ
  choice: పిలిచారు
  rationale: קרא ఇక్కడ వినిపించేలా పిలవడం అనే సాధారణ భావాన్ని ఇస్తుంది; అతిగా ఆర్తనాద భావాన్ని చేర్చదు.
- source_word: אֶל־בְּנֵי דָן
  choice: దాను వంశస్థులను
  rationale: అక్షరార్థంగా ‘దాను కుమారులు’; ఆధునిక తెలుగులో గోత్రసంబంధాన్ని సహజంగా, స్పష్టంగా తెలిపేందుకు ‘దాను వంశస్థులు’ అని అనువదించబడింది.
- source_word: וַיַּסֵּבּוּ פְּנֵיהֶם
  choice: వెనక్కి తిరిగి
  rationale: అక్షరార్థంగా ‘తమ ముఖాలను తిప్పారు’; సందర్భంలోని శారీరక చర్యను సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: לְמִיכָה
  choice: మీకాతో
  rationale: వ్యక్తిపేరుతో కూడిన לְ ఇక్కడ సంభాషణ ఉద్దేశ్యాన్ని సూచిస్తుంది; తెలుగులో ‘మీకాతో ... అన్నారు’ సహజ నిర్మాణం.
- source_word: מַה־לְּךָ
  choice: నీకేమైంది?
  rationale: ఈ హీబ్రూ నుడికారం వ్యక్తికి ఏమి సమస్య లేదా ఆందోళన ఉందని అడుగుతుంది.
- source_word: כִּי
  choice: ఎందుకు
  rationale: తదుపరి క్రియకు కారణాన్ని ప్రశ్నించే సంబంధాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: נִזְעָקְתָּ
  choice: ఇంతమందిని పోగుచేసుకొని వచ్చావు
  rationale: זעק నిఫాల్ రూపం ఇక్కడ కేకవేయడం లేదా జనాన్ని సమీకరించడం అనే భావాలకు వీలిస్తుంది; కథా సందర్భంలో మీకా తన వారిని కూడగట్టుకొని వెంబడించిన చర్యను ఈ ఎంపిక స్పష్టంగా తెలియజేస్తుంది, అయితే ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచింది.
