translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కథనానికి తగిన సరళమైన, గౌరవప్రదమైన వాడుక. ‘దాను కుమారులు’ అనే అక్షరానువాదానికి బదులుగా సాధారణ పాఠకులకు స్పష్టమైన ‘దాను వంశస్థులు’ వాడబడింది. נִזְעָקְתָּ లోని నిజమైన పదార్థ సందిగ్ధతను పాదటిప్పణిలో నిలిపాం.
