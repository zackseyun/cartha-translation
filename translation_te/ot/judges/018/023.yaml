- from: వారు దాను వంశస్థులను పిలిచారు. వారు వెనక్కి తిరిగి మీకాతో, “నీకేమైంది? ఎందుకు ఇంతమందిని పోగుచేసుకొని వచ్చావు?[a]” అని అడిగారు.
  to: వారు దాను వంశస్థులను పిలిచారు; వారు వెనుతిరిగి మీకాతో, “నీకేమైంది? ఎందుకు కేకలు వేశావు?” అన్నారు.[a]
  rationale: The revision replaces the unsupported expansion “ఇంతమందిని పోగుచేసుకొని వచ్చావు” with a direct rendering of נִזְעָקְתָּ. It retains the draft’s sound renderings of the Danite designation, the turning action, Micah’s name, and the Hebrew idiom of complaint/questioning.
