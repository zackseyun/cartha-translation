    rationale: The primary text should render the Hebrew lexical sense; alternatives may clarify nuances such as “మొరపెట్టుకున్నావు” or “బిగ్గరగా పిలిచావు.”
  revised_text: వారు దాను వంశస్థులను పిలిచారు; వారు వెనుతిరిగి మీకాతో, “నీకేమైంది? ఎందుకు కేకలు వేశావు?” అన్నారు.[a]
