id: JDG.18.25
reference: Judges 18:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּאמְר֤וּ אֵלָי/ו֙ בְּנֵי דָ֔ן אַל תַּשְׁמַ֥ע קוֹלְ/ךָ֖ עִמָּ֑/נוּ פֶּֽן יִפְגְּע֣וּ בָ/כֶ֗ם אֲנָשִׁים֙ מָ֣רֵי נֶ֔פֶשׁ וְ/אָסַפְתָּ֥ה נַפְשְׁ/ךָ֖ וְ/נֶ֥פֶשׁ בֵּיתֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/025.yaml
  text: And the sons of Dan said to him[a], “Do not let your voice be heard among us, lest men bitter of soul fall upon you[b], and you lose your life and the lives of your household.”
translation:
  language: te
  text: దాను వంశస్థులు అతనితో, “మా మధ్య నీ స్వరం వినిపించనివ్వకు; లేకపోతే మనసు చేదెక్కిన మనుషులు మీ మీద దాడి చేస్తారు, అప్పుడు నువ్వు నీ ప్రాణాన్నీ నీ ఇంటివారి ప్రాణాలనూ పోగొట్టుకుంటావు” అన్నారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי דָן
  choice: దాను వంశస్థులు
  rationale: హెబ్రీయుల బంధుత్వ ప్రయోగాన్ని తెలుగులో సహజంగా గోత్ర/వంశ గుర్తింపుగా తెలియజేస్తుంది; ‘దాను కుమారులు’ అనే అక్షరార్థం ఈ సందర్భంలో జీవపుత్రులను సూచిస్తున్నట్టు అపార్థం కలిగించవచ్చు.
- source_word: אַל תַּשְׁמַע קוֹלְךָ עִמָּנוּ
  choice: నీ మాట మా మధ్య వినబడనివ్వకు
  rationale: ‘నీ స్వరం వినబడకూడదు’ అనే హెబ్రీయు చిత్రాన్ని నిలుపుతూ, ఇక మాట్లాడవద్దనే బెదిరింపు భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: פֶּן
  choice: లేకపోతే
  rationale: హెచ్చరికతో కూడిన ప్రతికూల పరిణామాన్ని ఆధునిక తెలుగులో స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: יִפְגְּעוּ בָכֶם
  choice: మీ మీద దాడి చేస్తారు
  rationale: ఈ సందర్భంలో క్రియ శత్రుత్వపూర్వకంగా ఎదురుపడటం లేదా దాడి చేయడాన్ని సూచిస్తుంది; ‘దాడి చేస్తారు’ బెదిరింపును నేరుగా తెలియజేస్తుంది.
- source_word: אֲנָשִׁים מָרֵי נֶפֶשׁ
  choice: మనసు రగిలిన మనుషులు
  rationale: ‘ప్రాణం/మనస్సు చేదెక్కినవారు’ అనే మూలప్రయోగంలోని తీవ్ర అంతర్గత ఆగ్రహం, ప్రమాదకర స్వభావం రెండింటినీ అతిగా వ్యాఖ్యానించకుండా తెలుగులో అందిస్తుంది.
- source_word: וְאָסַפְתָּה נַפְשְׁךָ
  choice: నువ్వు నీ ప్రాణాన్ని పోగొట్టుకుంటావు
  rationale: ఇక్కడ אסף + נפש అక్షరార్థంగా ‘ప్రాణాన్ని సమకూర్చుకోవడం’ కాదు; ప్రాణనష్టాన్ని సూచించే సందర్భోచిత నుడికారం.
- source_word: וְנֶפֶשׁ בֵּיתֶךָ
  choice: నీ ఇంటివారి ప్రాణాలను
  rationale: ఏకవచన రూపంలోని נפשను గృహంలోని సభ్యులందరినీ సూచించే సమష్టి భావంగా సహజ తెలుగులో బహువచనంతో వ్యక్తం చేస్తుంది.
