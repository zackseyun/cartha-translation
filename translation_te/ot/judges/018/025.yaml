    issue: “మనసు రగిలిన మనుషులు” is overly specific for אֲנָשִׁים מָרֵי נֶפֶשׁ.
    rationale: The expression can include embittered, fierce, or reckless people, not only people whose anger is aroused. “మనసు చేదెక్కిన” better preserves the idiom, with a note supplying natural alternatives.
  revised_text: దాను వంశస్థులు అతనితో, “మా మధ్య నీ స్వరం వినిపించనివ్వకు; లేకపోతే మనసు చేదెక్కిన మనుషులు మీ మీద దాడి చేస్తారు, అప్పుడు నువ్వు నీ ప్రాణాన్నీ నీ ఇంటివారి ప్రాణాలనూ పోగొట్టుకుంటావు” అన్నారు.
