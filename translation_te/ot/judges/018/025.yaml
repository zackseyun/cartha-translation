translation_notes:
  register: 'ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైన బెదిరింపు ధోరణిని నిలిపి, సాధారణ పాఠకులకు అర్థమయ్యే సహజ వాక్యనిర్మాణం వాడబడింది. మూలంలోని ఏకవచన సంబోధన (‘నీ’) మరియు బహువచన కర్మ (‘మీ మీద’) ఉద్దేశపూర్వకంగా నిలుపబడ్డాయి: మాట మీకాతోనైనా, ప్రమాదం అతనితో ఉన్నవారికీ వర్తిస్తుంది.'
