  terminology: “మీకా” అనే పేరు స్థిరమైన తెలుగు బైబిలు లిప్యంతరీకరణకు సరిపోతుంది. “యాజకుడు” అనేది כֹהֵן కు సరైన పదం; “అతనికి యాజకుడనయ్యాను” అనే ప్రయోగం ఈ వ్యక్తిగత సేవా సంబంధాన్ని తెలుపుతూ ఆ ఆరాధనా ఏర్పాటుపై అదనపు ధార్మిక తీర్పును రుద్దదు. పాదటిప్పణి గుర్తు సరైన చోట ఉంది మరియు ప్రత్యామ్నాయ నుడికారాన్ని సముచితంగా వివరిస్తుంది.
