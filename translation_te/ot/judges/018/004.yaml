source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֲלֵ/הֶ֔ם כָּ/זֹ֣ה וְ/כָ/זֶ֔ה עָ֥שָׂה לִ֖/י מִיכָ֑ה וַ/יִּשְׂכְּרֵ֕/נִי וָ/אֱהִי ל֖/וֹ לְ/כֹהֵֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/004.yaml
  text: He said to them[a], “Thus and so Micah did for me, and he hired me, and I became his priest.”
translation:
  language: te
  text: అతడు వారితో, “మీకా నాకు ఇదీ అదీ చేశాడు[a]; అతడు నన్ను కూలికి పెట్టుకున్నాడు, నేను అతనికి యాజకుడనయ్యాను” అని చెప్పాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఇలాగూ అలాగూ”; ఈ హీబ్రూ నుడికారం ముందే చెప్పబడిన కార్యాలను మళ్లీ వివరించకుండా సంక్షిప్తంగా సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵהֶם
  choice: అతడు వారితో ... అని చెప్పాడు
  rationale: సంభాషణలో యాజకుని జవాబును సహజమైన ఆధునిక తెలుగు ప్రత్యక్ష వాక్య నిర్మాణంలో అందిస్తుంది; ప్రారంభ సంధికార్థం కథన క్రమంలో అంతర్భూతంగా ఉంది.
- source_word: כָּזֹה וְכָזֶה
  choice: ఇదీ అదీ
  rationale: ముందే జరిగిన విషయాలను మళ్లీ వివరించకుండా సంక్షిప్తంగా సూచించే హీబ్రూ నుడికారానికి సహజమైన తెలుగు సమానం.
- source_word: עָשָׂה לִי
  choice: నాకు ... చేశాడు
  rationale: మీకా ఆ లేవీయుని విషయంగా లేదా అతని కోసం చేసిన ఏర్పాట్లను మూలంలోని עשה + לి నిర్మాణానికి దగ్గరగా తెలియజేస్తుంది.
- source_word: מִיכָה
  choice: మీకా
  rationale: వ్యక్తి పేరును తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించింది.
- source_word: וַיִּשְׂכְּרֵנִי
  choice: అతడు నన్ను కూలికి పెట్టుకున్నాడు
  rationale: שׂכר అనే క్రియలోని వేతనానికి నియమించుకోవడం అనే భావాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: וָאֱהִי לוֹ לְכֹהֵן
  choice: నేను అతనికి యాజకుడనయ్యాను
  rationale: היה యొక్క సందర్భోచితమైన ‘అవడం’ భావాన్ని, అలాగే לוֹ לְכֹהֵן లోని అతనికి యాజకునిగా సేవచేసే సంబంధాన్ని నిలుపుతుంది.
theological_decisions:
- issue: అక్రమమైన ఆరాధనా వ్యవస్థలో యాజకుని పాత్ర స్వరూపం
  choice: అతనికి యాజకుడనయ్యాను
  alternative: అతని యాజకుడనయ్యాను
  rationale: హీబ్రూలోని לוֹ לְכֹהֵן ను సన్నిహితంగా ప్రతిబింబిస్తూ, మీకాకు యాజకునిగా సేవ చేసిన విషయాన్ని చెబుతుంది; ఆ ఏర్పాటుకు ధార్మిక చెల్లుబాటు ఉందని గాని లేదని గాని అనువాదం అదనంగా తీర్పు చెప్పదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘ఇదీ అదీ’ అనే సాధారణ నుడికారాన్ని ఉపయోగించి మూలంలోని సంక్షిప్త సూచనను నిలిపి, పాదటిప్పణిలో మరింత రూపసామ్యమైన ప్రత్యామ్నాయాన్ని ఇచ్చాం.
