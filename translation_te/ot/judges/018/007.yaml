  text: וַ/יֵּלְכוּ֙ חֲמֵ֣שֶׁת הָ/אֲנָשִׁ֔ים וַ/יָּבֹ֖אוּ לָ֑יְשָׁ/ה וַ/יִּרְא֣וּ אֶת הָ/עָ֣ם אֲשֶׁר בְּ/קִרְבָּ֣/הּ יוֹשֶֽׁבֶת לָ֠/בֶטַח כְּ/מִשְׁפַּ֨ט צִדֹנִ֜ים שֹׁקֵ֣ט וּ/בֹטֵ֗חַ וְ/אֵין מַכְלִ֨ים דָּבָ֤ר בָּ/אָ֨רֶץ֙ יוֹרֵ֣שׁ עֶ֔צֶר וּ/רְחֹקִ֥ים הֵ֨מָּה֙ מִ/צִּ֣דֹנִ֔ים וְ/דָבָ֥ר אֵין לָ/הֶ֖ם עִם אָדָֽם־־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/007.yaml
  text: Then the five men went and came to Laish[a], and they saw the people who were in it, dwelling securely, according to the custom of the Sidonians, quiet and secure. And there was no one in the land to humiliate them in anything, possessing authority; and they were far from the Sidonians[c][b], and they had no dealings with anyone.
translation:
  language: te
  text: ఆ ఐదుగురు మనుషులు బయలుదేరి లయీషుకు వచ్చారు. లయీషులో నివసిస్తున్న ప్రజలు సీదోనీయుల ఆచారం ప్రకారం నిర్భయంగా నివసిస్తూ, ప్రశాంతంగా, సురక్షితంగా ఉన్నారని వారు చూశారు. వారిని ఏ విషయంలోనైనా అవమానపరచే అధికారం కలిగినవాడు ఆ దేశంలో ఎవరూ లేరు.[a] వారు సీదోనీయులకు దూరంగా ఉన్నారు; మరెవరితోనూ వారికి సంబంధాలు లేవు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఈ వాక్యంలోని హీబ్రూ క్లిష్టంగా ఉంది. అక్షరార్థానికి దగ్గరగా, “దేశంలో ఏ విషయములోనైనా అవమానపరచేవాడు, అధికారాన్ని కలిగినవాడు ఎవరూ లేరు.” బహుశా వారిని అవమానించే లేదా అణచివేసే పాలకుడు ఎవరూ లేడని భావం.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ఎవరితోనూ వారికి వ్యవహారాలు లేదా ఒప్పందాలు లేవు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לָיְשָׁה
  choice: లయీషుకు
  rationale: ఇది స్థలనామం; ఈ సందర్భంలోని హీబ్రూ రూపాన్ని తెలుగులో లిప్యంతరీకరించాం.
- source_word: יוֹשֶׁבֶת לָבֶטַח
  choice: సురక్షితంగా నివసిస్తున్నారని
  rationale: తాత్కాలిక క్షేమం కంటే స్థిరంగా భద్రతతో జీవిస్తున్న భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: כְּמִשְׁפַּט צִדֹנִים
  choice: సీదోనీయుల ఆచారం ప్రకారం
  rationale: ఇక్కడ מִשְׁפָּט న్యాయతీర్పు కంటే ఆచారపద్ధతి లేదా జీవనరీతిని సూచిస్తుంది.
- source_word: שֹׁקֵט וּבֹטֵחַ
  choice: ప్రశాంతంగా, సురక్షితంగా
  rationale: హీబ్రూలోని జంట వర్ణనను నిలుపుతూ, కలతలేని భద్రమైన జీవనాన్ని సూచిస్తుంది.
- source_word: מַכְלִים דָּבָר
  choice: ఏ విషయంలోనైనా అవమానపరచే
  rationale: כלם హిఫీల్ రూపంలోని సిగ్గుపరచడం లేదా అవమానించడం అనే ప్రాథమిక భావాన్ని కాపాడుతుంది.
- source_word: יוֹרֵשׁ עֶצֶר
  choice: అధికారంగలవాడు
  rationale: ఇది క్లిష్టమైన హీబ్రూ పదబంధం. సందర్భంలో ఆధిపత్యం చెలాయించగల పాలకుడు లేదా అధికారధారి అనే సాధ్యమైన కార్యార్థాన్ని తెలియజేస్తుంది; అనిశ్చితిని పాదసూచికలో ఉంచాం.
- source_word: וּרְחֹקִים הֵמָּה מִצִּדֹנִים
  choice: వారు సీదోనీయులకు దూరంగా ఉన్నారు
  rationale: వారి భౌగోళిక ఒంటరితనాన్ని నేరుగా వ్యక్తం చేస్తుంది.
- source_word: וְדָבָר אֵין לָהֶם עִם אָדָם
  choice: మరెవరితోనూ వారికి సంబంధాలు లేవు
  rationale: ఎవరితోనూ వ్యవహారాలు, ఒప్పందాలు లేదా సంబంధాలు లేకపోవడాన్ని సూచించే హీబ్రూ నుడికారాన్ని సహజ తెలుగులో అందిస్తుంది.
- source_word: אָדָם
  choice: మరెవరితోనూ
  rationale: ఏ వ్యక్తి లేదా ఇతర సమూహంతోనూ అనే సాధారణార్థానికి తెలుగు నిషేధ వాక్యంలో ఈ రూపం సహజంగా సరిపోతుంది.
theological_decisions:
- issue: מַכְלִים דָּבָר ... יוֹרֵשׁ עֶצֶר అనే క్లిష్టమైన వాక్యభాగం
  choice: వారిని ఏ విషయంలోనైనా అవమానపరచే అధికారంగలవాడు ఆ దేశంలో ఎవరూ లేరు
  alternative: వారిని అణచివేసే పాలకుడు ఆ దేశంలో ఎవరూ లేరు
  rationale: మూలంలోని ‘అవమానపరచు’ భావాన్ని నిలుపుతూ, יוֹרֵשׁ עֶצֶר సూచించే అధికార భావాన్ని అతిగా నిర్దిష్టం చేయకుండా అందించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని వాడాం. మూలంలోని పునరుక్త భద్రతాభావాన్ని ‘ప్రశాంతంగా, సురక్షితంగా’ అని నిలిపాం. క్లిష్టమైన హీబ్రూ వాక్యభాగాన్ని ప్రధాన పాఠ్యంలో చదవదగిన విధంగా ఇచ్చి, దాని నిజమైన అనిశ్చితిని [a] పాదసూచికలో స్పష్టపరిచాం.
