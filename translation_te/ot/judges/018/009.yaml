- from: 'వారు ఇలా అన్నారు: “లేవండి, వారి మీదికి వెళ్దాం. మేము ఆ దేశాన్ని చూశాం; ఇదిగో, అది చాలా మంచిది. మీరేమో మౌనంగా ఉన్నారు! వెళ్లి, ఆ దేశంలో ప్రవేశించి, దాన్ని స్వాధీనం చేసుకోవడానికి ఆలస్యం చేయకండి.”'
  to: 'వారు ఇలా అన్నారు: “లేవండి, వారి మీదికి వెళ్దాం. మేము ఆ దేశాన్ని చూశాం; ఇదిగో, అది చాలా మంచిది. మీరు మౌనంగా ఉన్నారు—వెళ్లి, ఆ దేశంలోకి ప్రవేశించి, దాన్ని స్వాధీనం చేసుకోవడానికి వెనుకాడకండి.”'
