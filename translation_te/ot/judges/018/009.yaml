id: JDG.18.9
reference: Judges 18:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּאמְר֗וּ ק֚וּמָ/ה וְ/נַעֲלֶ֣ה עֲלֵי/הֶ֔ם כִּ֤י רָאִ֨ינוּ֙ אֶת הָ/אָ֔רֶץ וְ/הִנֵּ֥ה טוֹבָ֖ה מְאֹ֑ד וְ/אַתֶּ֣ם מַחְשִׁ֔ים אַל תֵּעָ֣צְל֔וּ לָ/לֶ֥כֶת לָ/בֹ֖א לָ/רֶ֥שֶׁת אֶת הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/009.yaml
  text: And they said, “Rise up, and let us go up against them, for we have seen the land, and behold, it is very good. And you are keeping silent—do not be sluggish to go, to enter, to take possession of the land.”
translation:
  language: te
  text: 'వారు ఇలా అన్నారు: “లేవండి, వారి మీదికి వెళ్దాం. మేము ఆ దేశాన్ని చూశాం; ఇదిగో, అది చాలా మంచిది. మీరు మౌనంగా ఉన్నారు—వెళ్లి, ఆ దేశంలోకి ప్రవేశించి, దాన్ని స్వాధీనం చేసుకోవడానికి వెనుకాడకండి.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קוּמָה
  choice: లేవండి
  rationale: సమూహాన్ని కార్యాచరణకు పిలిచే హీబ్రూ ఆజ్ఞార్థక రూపాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וְנַעֲלֶה עֲלֵיהֶם
  choice: వారి మీదికి వెళ్దాం
  rationale: ‘పైకి వెళ్దాం’ అనే మూల రూపంలోని దాడి/ఎదుర్కొనే భావాన్ని ‘వారి మీదికి’ నిలుపుతూ, తెలుగులో సహజంగా అందిస్తుంది.
- source_word: מַחְשִׁים
  choice: మౌనంగా ఉన్నారు
  rationale: ఈ రూపానికి ప్రాథమికంగా ఉన్న ‘నిశ్శబ్దంగా ఉండడం’ భావాన్ని కాపాడుతుంది; సందర్భం సూచించే నిష్క్రియతను పదంలోనే అతిగా వ్యాఖ్యానించదు.
- source_word: אַל תֵּעָצְלוּ
  choice: ఆలస్యం చేయకండి
  rationale: ‘మందకొడిగా ఉండకండి/వెనుకాడకండి’ అనే హెచ్చరికను సాధారణ పాఠకులకు సహజంగా అర్థమయ్యే కార్యోన్ముఖ తెలుగులో ఇస్తుంది.
- source_word: לָלֶכֶת לָבֹא לָרֶשֶׁת
  choice: వెళ్లి, ఆ దేశంలో ప్రవేశించి, దాన్ని స్వాధీనం చేసుకోవడానికి
  rationale: వెళ్లడం, ప్రవేశించడం, స్వాధీనం చేసుకోవడం అనే మూడు మూల క్రియల క్రమాన్ని స్పష్టంగా నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కథనానికి తగిన గౌరవప్రదమైన, నేరుగా మాట్లాడే శైలి. హీబ్రూ వాక్యంలోని ఆజ్ఞ, ఉద్ఘాటన, వరుస క్రియలు నిలుపబడ్డాయి; అనవసర మతపరమైన వ్యాఖ్యానం చేర్చలేదు.
