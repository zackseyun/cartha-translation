revisions:
- from: 'లాయిషు దేశాన్ని వేగుచూడడానికి వెళ్లిన ఆ ఐదుగురు మనుషులు తమ సోదరులతో ఇలా అన్నారు: “ఈ ఇళ్లలో ఏఫోదు, తెరాఫీము[a], చెక్కిన ప్రతిమ, పోతపోసిన ప్రతిమ ఉన్నాయని మీకు తెలుసా? కాబట్టి ఇప్పుడు మీరు ఏమి చేయాలో ఆలోచించుకోండి.”'
  to: 'లాయిషు ప్రాంతాన్ని గూఢచర్యంగా పరిశీలించడానికి వెళ్లిన ఆ ఐదుగురు మనుషులు తమ సోదరులకు ఇలా చెప్పారు: “ఈ ఇళ్లలో ఏఫోదు, తెరాఫీము[a], చెక్కిన ప్రతిమ, పోతపోసిన ప్రతిమ ఉన్నాయని మీకు తెలుసా? ఇప్పుడు మీరు ఏమి చేయాలో తెలుసుకోండి.”'
  rationale: The revision updates the reconnaissance expression for modern Telugu, clarifies that the men addressed their brothers, and restores the final imperative’s direct yet intentionally unspecified force. It leaves the cultic terminology and its explanatory footnote intact.
  reviewer_model: gpt-5.6-terra
