source:
  edition: WLC
  text: וַֽ/יַּעֲנ֞וּ חֲמֵ֣שֶׁת הָ/אֲנָשִׁ֗ים הַ/הֹלְכִים֮ לְ/רַגֵּל֮ אֶת הָ/אָ֣רֶץ לַיִשׁ֒ וַ/יֹּֽאמְרוּ֙ אֶל אֲחֵי/הֶ֔ם הַ/יְדַעְתֶּ֗ם כִּ֠י יֵ֣שׁ בַּ/בָּתִּ֤ים הָ/אֵ֨לֶּה֙ אֵפ֣וֹד וּ/תְרָפִ֔ים וּ/פֶ֖סֶל וּ/מַסֵּכָ֑ה וְ/עַתָּ֖ה דְּע֥וּ מַֽה תַּעֲשֽׂוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/014.yaml
  text: Then the five men who had gone to spy out the land of Laish answered and said to their brothers[a], “Do you know that in these houses there are an ephod, teraphim, a carved image, and a cast image? So now[b], know what you will do.”
translation:
  language: te
  text: 'లాయిషు ప్రాంతాన్ని గూఢచర్యంగా పరిశీలించడానికి వెళ్లిన ఆ ఐదుగురు మనుషులు తమ సోదరులకు ఇలా చెప్పారు: “ఈ ఇళ్లలో ఏఫోదు, తెరాఫీము[a], చెక్కిన ప్రతిమ, పోతపోసిన ప్రతిమ ఉన్నాయని మీకు తెలుసా? ఇప్పుడు మీరు ఏమి చేయాలో తెలుసుకోండి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘తెరాఫీము’ అనేది గృహ ఆరాధనలో ఉపయోగించిన ప్రతిమలు లేదా గృహదేవతలను సూచించే హీబ్రూ పదం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲנוּ ... וַיֹּאמְרוּ
  choice: ఇలా అన్నారు
  rationale: హీబ్రూ కథనంలోని ‘జవాబిచ్చి చెప్పారు’ అనే జంట సూత్రాన్ని తెలుగులో యాంత్రికంగా పునరావృతం చేయకుండా, సహజమైన సంభాషణారంభంగా అందిస్తుంది; ఇక్కడ ముందటి ప్రత్యక్ష ప్రశ్న లేనందున ‘జవాబిచ్చారు’ అసహజంగా ఉంటుంది.
- source_word: הַהֹלְכִים לְרַגֵּל
  choice: వేగుచూడడానికి వెళ్లిన
  rationale: వారు ఇప్పటికే నిర్వర్తించిన గూఢచర్యపు పనిని సూచిస్తుంది; ‘వేగుచూడు’ బైబిలు సందర్భంలో గూఢంగా పరిశీలించడాన్ని సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: אֶת הָאָרֶץ לַיִשׁ
  choice: లాయిషు దేశాన్ని
  rationale: లాయిషుతో సంబంధమున్న భూభాగాన్ని సూచిస్తుంది; తెలుగు విభక్తి నిర్మాణంలో సహజంగా ఉంది.
- source_word: אֶל אֲחֵיהֶם
  choice: తమ సోదరులతో
  rationale: మూలంలోని లింగనిర్దిష్ట బంధుత్వ పదాన్ని నిలుపుతూ, సందర్భంలోని తోటి దాను పురుషులను సూచిస్తుంది.
- source_word: בַּבָּתִּים הָאֵלֶּה
  choice: ఈ ఇళ్లలో
  rationale: ‘ఇళ్లు’ అనే మూలార్థాన్ని అనవసరంగా దేవాలయ సముదాయం లేదా గృహస్థానంగా నిర్దిష్టీకరించకుండా నిలుపుతుంది.
- source_word: אֵפוֹד
  choice: ఏఫోదు
  rationale: సులభమైన సమానార్థకం లేని ప్రత్యేక ఆరాధనా వస్తువు కావడంతో లిప్యంతరీకరణ సముచితం.
- source_word: תְרָפִים
  choice: తెరాఫీము
  rationale: ఈ పదం గృహదేవతల ప్రతిమలను సూచించే అవకాశం ఉన్నా, దాని ఖచ్చిత స్వరూపంపై ఉన్న అనిశ్చితిని లిప్యంతరీకరణ కాపాడుతుంది.
- source_word: פֶסֶל
  choice: చెక్కిన ప్రతిమ
  rationale: చెక్కడం ద్వారా రూపొందించిన బొమ్మ అనే ప్రత్యేక భావాన్ని తెలియజేస్తుంది; సాధారణ ‘విగ్రహం’ కంటే రూపకల్పన విధానాన్ని నిలుపుతుంది.
- source_word: מַסֵּכָה
  choice: పోతపోసిన ప్రతిమ
  rationale: కరిగించిన పదార్థాన్ని అచ్చులో పోసి చేసిన ప్రతిమ అనే తయారీ విధానాన్ని ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: דְּעוּ מַה תַּעֲשׂוּן
  choice: మీరు ఏమి చేయాలో ఆలోచించుకోండి
  rationale: అక్షరార్థంగా ‘మీరు ఏమి చేయాలో తెలుసుకోండి’ అయినా, సందర్భంలో ఇది చర్యను నిర్ణయించుకోమనే ఉద్దేశ్యపూర్వక ఆదేశం; తెలుగు సహజ ప్రయోగం ఆ భావాన్ని అందిస్తుంది.
theological_decisions:
- issue: మీకా ఆరాధనా స్థలంలోని వస్తువుల పేర్లు
  choice: ఏఫోదు, తెరాఫీము, చెక్కిన ప్రతిమ, పోతపోసిన ప్రతిమ అని వేర్వేరు పదాలతో అనువదించడం
  alternative: అన్నిటినీ సాధారణంగా ‘విగ్రహాలు’ లేదా ‘దేవతలు’ అని చెప్పడం
  rationale: మూలపాఠం నాలుగు వేర్వేరు పదాలను ఉపయోగిస్తుంది. వాటిని ఒకే వర్గంగా కలపకుండా ఉంచడం పాఠంలోని భేదాలను, అలాగే తెరాఫీము స్వరూపంలోని అనిశ్చితిని కాపాడుతుంది.
- issue: אַחֵיהֶם అనే బంధుత్వ పదం
  choice: తమ సోదరులతో
  alternative: తమ బంధువులతో / తోటి దానీయులతో
  rationale: ఇక్కడ సంబోధింపబడినవారు పురుషులైన దాను గోత్రస్థులు; అందువల్ల మూలంలోని పురుషలింగ బంధుత్వ పదాన్ని నేరుగా నిలుపడం సందర్భానుకూలం.
- issue: చివరి ఆదేశంలోని ఉద్దేశ్యపూర్వక అస్పష్టత
  choice: మీరు ఏమి చేయాలో ఆలోచించుకోండి
  alternative: వాటిని స్వాధీనం చేసుకోండి
  rationale: మాటల వెనుక ఉద్దేశం దోపిడీకి ప్రేరేపించడం కావచ్చుగానీ, మూలపాఠం చర్యను బహిరంగంగా పేరు పెట్టదు. అనువాదం ఆ సూచనాత్మక ఉద్రిక్తతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి. ఆరాధనా వస్తువులకు సంబంధించిన ప్రత్యేక మూలపదాల మధ్య తేడాలను నిలిపి, అవసరమైన చోట మాత్రమే లిప్యంతరీకరణ మరియు పాదటిప్పణి ఉపయోగించబడింది.
