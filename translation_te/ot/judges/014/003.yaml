  text: וַ/יֹּ֨אמֶר ל֜/וֹ אָבִ֣י/ו וְ/אִמּ֗/וֹ הַ/אֵין֩ בִּ/בְנ֨וֹת אַחֶ֤י/ךָ וּ/בְ/כָל עַמִּ/י֙ אִשָּׁ֔ה כִּֽי אַתָּ֤ה הוֹלֵךְ֙ לָ/קַ֣חַת אִשָּׁ֔ה מִ/פְּלִשְׁתִּ֖ים הָ/עֲרֵלִ֑ים וַ/יֹּ֨אמֶר שִׁמְשׁ֤וֹן אֶל אָבִי/ו֙ אוֹתָ֣/הּ קַֽח לִ֔/י כִּֽי הִ֖יא יָשְׁרָ֥ה בְ/עֵינָֽ/י־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/014/003.yaml
  text: But his father and his mother said to him[a], “Is there not a woman among the daughters of your brothers or among all my people, that you are going to take a wife from the uncircumcised Philistines?” But Samson said to his father, “Get her for me[b], for she is right in my eyes.”
translation:
  language: te
  text: 'అయితే అతని తండ్రియు తల్లియు అతనితో ఇలా అన్నారు: “నీ సహోదరుల కుమార్తెలలోగానీ[b], నా ప్రజలందరిలోగానీ ఒక స్త్రీ లేదా? సున్నతి పొందని ఫిలిష్తీయులలోనుండి భార్యను తీసుకోవడానికి వెళ్తున్నావేమిటి?” అందుకు సమ్సోను తన తండ్రితో, “ఆమెనే నాకు తీసుకురండి; ఎందుకంటే ఆమె నా దృష్టికి సరైనది[a]” అన్నాడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆమె నాకు నచ్చింది,” “ఆమె నా కంటికి ఇంపుగా ఉంది.” హీబ్రూ నుడికారం వ్యక్తిగత ఆమోదాన్ని లేదా ఆకర్షణను సూచించగలదు; ప్రధాన పాఠం న్యాయాధిపతులు గ్రంథంలో మళ్లీ వినిపించే “తన దృష్టికి సరైనది” అనే భావప్రతిధ్వనిని నిలుపుతుంది.
    reason: lexical_alternative
  - marker: b
    text: “నీ సహోదరుల కుమార్తెలు” అనేది సమ్సోను తక్షణ సహోదరుల కుమార్తెలను మాత్రమే కాక, అతని బంధువర్గం లేదా ప్రజలలోని స్త్రీలను విస్తృతంగా సూచించవచ్చు.
    reason: cultural_note
lexical_decisions:
- source_word: הַאֵין
  choice: ఒక స్త్రీ లేదా?
  rationale: నిరాకరణతో కూడిన హీబ్రూ ప్రశ్నను సహజమైన తెలుగు అలంకారిక ప్రశ్నగా అందిస్తుంది.
- source_word: בִּבְנוֹת אַחֶיךָ
  choice: నీ సహోదరుల కుమార్తెలలో
  rationale: హీబ్రూలోని కుటుంబ సంబంధ పదజాలాన్ని ప్రధాన పాఠంలో నిలుపుతుంది; ఇది విస్తృత బంధువర్గాన్ని సూచించవచ్చనే విషయాన్ని పాదటిప్పణిలో వివరిస్తుంది.
- source_word: וּבְכָל עַמִּי
  choice: నా ప్రజలందరిలో
  rationale: హీబ్రూలో ఉన్న ప్రథమ పురుష ఏకవచన ప్రత్యయాన్ని ‘నా’ అని యథాతథంగా నిలుపుతుంది.
- source_word: הוֹלֵךְ לָקַחַת אִשָּׁה
  choice: భార్యను తెచ్చుకోవడానికి వెళ్తున్నావు
  rationale: వివాహ సందర్భాన్ని తెలుగులో స్పష్టంగా, సహజంగా తెలుపుతూ ‘వెళ్లి తీసుకోవడం’ అనే మూల నిర్మాణాన్ని సాధ్యమైనంతగా నిలుపుతుంది.
- source_word: מִפְּלִשְׁתִּים הָעֲרֵלִים
  choice: సున్నతి పొందని ఫిలిష్తీయులలోనుంచి
  rationale: జాతి పేరుతో పాటు ఇశ్రాయేలీయుల ఒడంబడిక నేపథ్యం గల ‘సున్నతి పొందని’ అనే విశేషణాన్ని మృదువుచేయకుండా నిలుపుతుంది.
- source_word: אוֹתָהּ קַח לִי
  choice: ఆమెనే నాకు తీసుకురండి
  rationale: నిర్దిష్టమైన ఆ స్త్రీనే కోరుతున్న బలాన్ని ‘ఆమెనే’ ద్వారా, వివాహ ఏర్పాటులో తండ్రి పాత్రను ‘తీసుకురండి’ ద్వారా సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: יָשְׁרָה בְעֵינַי
  choice: నా దృష్టికి ఆమె సరైనది
  rationale: ‘నా కళ్లలో’ అనే హీబ్రూ నుడికారానికి సహజ తెలుగు సమానార్థకమైన ‘నా దృష్టికి’ వాడి, న్యాయాధిపతులు గ్రంథంలోని ‘తన దృష్టికి సరైనది’ అనే పునరావృత భావప్రతిధ్వనిని నిలుపుతుంది.
theological_decisions:
- issue: న్యాయాధిపతులు గ్రంథంలో יָשְׁרָה בְעֵינַי పదబంధపు కథనాత్మక ప్రతిధ్వని
  choice: నా దృష్టికి ఆమె సరైనది
  alternative: ఆమె నాకు నచ్చింది / ఆమె నా కంటికి ఇంపుగా ఉంది
  rationale: ఈ పదబంధం ఆకర్షణను లేదా వ్యక్తిగత ఆమోదాన్ని సూచించగలదు. అయితే ‘నా దృష్టికి సరైనది’ అనే అనువాదం హీబ్రూ అస్పష్టతను, గ్రంథమంతటా కనిపించే ‘తన దృష్టికి సరైనది’ అనే నైతిక సూత్రపు ప్రతిధ్వనిని వ్యాఖ్యానంతో పరిష్కరించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. హీబ్రూ మూలంలోని ‘నా ప్రజలు,’ ‘సున్నతి పొందని,’ ‘నా దృష్టికి సరైనది’ వంటి ఉద్దేశపూర్వక పదరూపాలు నిలుపబడ్డాయి. పాదటిప్పణి [b]కి సంబంధించిన గుర్తు ప్రధాన పాఠంలో ఉండాలి; అందువల్ల ప్రచురణ పాఠంలో ‘నీ సహోదరుల కుమార్తెలలోగానీ[b]’గా అమర్చాలి.
