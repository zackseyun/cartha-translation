revisions:
- from: అయితే అతని తండ్రి, తల్లి అతనితో, “నీ సహోదరుల కుమార్తెలలోగానీ, నా ప్రజలందరిలోగానీ ఒక స్త్రీ లేదా? సున్నతి పొందని ఫిలిష్తీయులలోనుంచి భార్యను తెచ్చుకోవడానికి వెళ్తున్నావేమిటి?” అన్నారు. అందుకు సమ్సోను తన తండ్రితో, “ఆమెనే నాకు తీసుకురండి; ఎందుకంటే నా దృష్టికి ఆమె సరైనది[a]” అన్నాడు.
  to: 'అయితే అతని తండ్రియు తల్లియు అతనితో ఇలా అన్నారు: “నీ సహోదరుల కుమార్తెలలోగానీ[b], నా ప్రజలందరిలోగానీ ఒక స్త్రీ లేదా? సున్నతి పొందని ఫిలిష్తీయులలోనుండి భార్యను తీసుకోవడానికి వెళ్తున్నావేమిటి?” అందుకు సమ్సోను తన తండ్రితో, “ఆమెనే నాకు తీసుకురండి; ఎందుకంటే ఆమె నా దృష్టికి సరైనది[a]” అన్నాడు.'
  rationale: అవసరమైన [b] ఆంకర్ మరియు దానికి సంబంధించిన పాదటిప్పణి చేర్చబడ్డాయి. వాక్యాన్ని మరింత సహజమైన తెలుగు కథనశైలిలో స్వల్పంగా సవరించాం; అర్థంలో మార్పు లేదు. ‘నా దృష్టికి సరైనది’ వద్ద [a] ఆంకర్ ఉంచి హీబ్రూ నుడికారం యొక్క ఆకర్షణ/ఆమోద భావాన్ని, అలాగే న్యాయాధిపతులు గ్రంథంలోని పదప్రతిధ్వనిని సంరక్షించాం.
