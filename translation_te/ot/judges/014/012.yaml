source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר לָ/הֶם֙ שִׁמְשׁ֔וֹן אָחֽוּדָה נָּ֥א לָ/כֶ֖ם חִידָ֑ה אִם הַגֵּ֣ד תַּגִּידוּ֩ אוֹתָ֨/הּ לִ֜/י שִׁבְעַ֨ת יְמֵ֤י הַ/מִּשְׁתֶּה֙ וּ/מְצָאתֶ֔ם וְ/נָתַתִּ֤י לָ/כֶם֙ שְׁלֹשִׁ֣ים סְדִינִ֔ים וּ/שְׁלֹשִׁ֖ים חֲלִפֹ֥ת בְּגָדִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/014/012.yaml
  text: And Samson said to them[a], “Please let me put a riddle to you. If you indeed tell it to me within the seven days of the feast and solve it[c][b], then I will give you thirty linen garments and thirty changes of clothes.”
translation:
  language: te
  text: 'సమ్సోను వారితో ఇలా అన్నాడు: “నేను మీకు ఒక పొడుపుకథ వేయనా? ఈ విందు ఏడు రోజులలోగా మీరు దాని జవాబును నాకు తప్పకుండా చెప్పి, దాన్ని పరిష్కరిస్తే[a], నేను మీకు ముప్పై నార వస్త్రాలు, మార్చుకొని ధరించే ముప్పై దుస్తుల సముదాయాలు ఇస్తాను[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “పరిష్కరిస్తే” అని అనువదించిన హీబ్రూ పదానికి అక్షరార్థం “కనుగొంటే.” ఇక్కడ భావం పొడుపుకథ జవాబును కనుగొనడం.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ పేర్కొన్న వస్త్రాల ఖచ్చితమైన రకాలు అనిశ్చితం. హీబ్రూ పాఠం నార వస్త్రాలను, మార్చుకొని ధరించే వస్త్ర సముదాయాలను సూచిస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: אָחֽוּדָה נָּא
  choice: నేను మీకు ఒక పొడుపుకథ వేస్తాను
  rationale: חוד యొక్క సంకల్పార్థక రూపం నָאతో కలిసి మర్యాదపూర్వక ప్రతిపాదనను సూచిస్తుంది. తెలుగులో ‘పొడుపుకథ వేస్తాను’ అనేది సందర్భానికి సహజమైన ప్రయోగం.
- source_word: חִידָה
  choice: పొడుపుకథ
  rationale: ఈ నామవాచకం చిక్కైన ప్రశ్నను లేదా గూఢమైన మాటను సూచిస్తుంది; కథన సందర్భంలో ‘పొడుపుకథ’ స్పష్టమైన సహజ సమానం.
- source_word: אִם הַגֵּד תַּגִּידוּ
  choice: మీరు ... తప్పకుండా చెప్పి
  rationale: ధాతువు యొక్క infinitive absolute మరియు finite రూపం కలయిక క్రియకు బలాన్ని ఇస్తుంది. సామర్థ్యాన్ని జోడించకుండా ‘తప్పకుండా’ ఆ ఉద్ఘాటనను తెలుగులో తెలియజేస్తుంది.
- source_word: אוֹתָהּ לִי
  choice: దాని జవాబును నాకు
  rationale: హీబ్రూలో ‘దానిని నాకు’ అని ఉన్నా, పొడుపుకథ సందర్భంలో చెప్పవలసింది దాని జవాబు అని తెలుగులో సహజంగా వ్యక్తం చేయబడింది.
- source_word: שִׁבְעַת יְמֵי הַמִּשְׁתֶּה
  choice: ఈ విందు జరిగే ఏడు రోజులలోగా
  rationale: מִשְׁתֶּה విందు లేదా భోజనోత్సవాన్ని సూచిస్తుంది. సవాలు పూర్తిచేయవలసిన కాలపరిమితిని ‘ఏడు రోజులలోగా’ స్పష్టం చేస్తుంది.
- source_word: וּמְצָאתֶם
  choice: దాన్ని ఛేదిస్తే
  rationale: అక్షరార్థం ‘కనుగొంటే’; పొడుపుకథ సందర్భంలో దాని పరిష్కారాన్ని కనుగొనడం అనే భావాన్ని ‘ఛేదిస్తే’ సహజంగా అందిస్తుంది.
- source_word: שְׁלֹשִׁים סְדִינִים
  choice: ముప్పై నార వస్త్రాలు
  rationale: סְדִינִים నారతో చేసిన వస్త్రాలను సూచిస్తుంది; వాటి ఖచ్చితమైన రకం అనిశ్చితమైనందున మరీ నిర్దిష్టంగా చెప్పకుండా అనువదించబడింది.
- source_word: שְׁלֹשִׁים חֲלִפֹת בְּגָדִים
  choice: ముప్పై జతల బట్టలు
  rationale: ఈ పదబంధం మార్చుకొని ధరించగల వస్త్ర సముదాయాలను సూచిస్తుంది. ‘జతల బట్టలు’ ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: וְנָתַתִּי לָכֶם
  choice: నేను మీకు ... ఇస్తాను
  rationale: షరతు నెరవేరితే తాను ఇచ్చే బహుమతిని సూచించే ఫలిత వాక్యంగా తెలుగులో సహజంగా అందించబడింది.
