  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֵּ֧רֶד שִׁמְשׁ֛וֹן וְ/אָבִ֥י/ו וְ/אִמּ֖/וֹ תִּמְנָ֑תָ/ה וַ/יָּבֹ֨אוּ֙ עַד כַּרְמֵ֣י תִמְנָ֔תָ/ה וְ/הִנֵּה֙ כְּפִ֣יר אֲרָי֔וֹת שֹׁאֵ֖ג לִ/קְרָאתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/014/005.yaml
  text: Then Samson went down with his father and his mother to Timnah[a], and they came as far as the vineyards of Timnah. And behold[c][b], a young lion was roaring as it came toward him.
translation:
  language: te
  text: అప్పుడు సమ్సోను తన తండ్రితో, తల్లితో కలిసి తిమ్నాకు దిగివెళ్లాడు. వారు తిమ్నా ద్రాక్షతోటల వరకు వచ్చారు. ఇదిగో, ఒక యువ సింహం[a] అతని వైపుకు వస్తూ గర్జిస్తోంది[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హిబ్రూలో అక్షరార్థంగా, “సింహాల యువ సింహం”; ఇది “యువ సింహం” అనే భావాన్నిచ్చే పదబంధం.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “అతనిని ఎదుర్కొనేందుకు గర్జిస్తోంది.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: దిగివెళ్లాడు
  rationale: יָרַד అనే క్రియలోని ‘కిందికి వెళ్లడం’ అనే దిశాభావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: תִּמְנָתָה
  choice: తిమ్నాకు
  rationale: దిశను సూచించే చివరి ה, తిమ్నా వైపు ప్రయాణాన్ని తెలియజేస్తుంది; తెలుగులో గమ్యాన్ని సహజంగా ‘తిమ్నాకు’ అని చెప్పవచ్చు.
- source_word: וַיָּבֹאוּ עַד
  choice: వరకు వచ్చారు
  rationale: בוא తో కూడిన עַד ప్రయాణంలో ఒక నిర్దిష్ట స్థానం వరకు చేరడాన్ని సూచిస్తుంది.
- source_word: כַּרְמֵי תִמְנָתָה
  choice: తిమ్నా ద్రాక్షతోటలు
  rationale: నిర్మాణ సంబంధాన్ని నేరుగా, సహజంగా తెలియజేస్తుంది.
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: అనూహ్యమైన, స్పష్టంగా కళ్లముందు నిలిచే సంఘటనవైపు పాఠకుని దృష్టిని మళ్లించే హిబ్రూ సంభాషణ సూచికను నిలుపుతుంది.
- source_word: כְּפִיר אֲרָיוֹת
  choice: ఒక యువ సింహం
  rationale: כְּפִיר చిన్న పిల్లసింహం కంటే యువ సింహాన్ని సూచిస్తుంది; మొత్తం హిబ్రూ పదబంధం సహజ తెలుగు భావంలో ‘యువ సింహం’ అవుతుంది.
- source_word: שֹׁאֵג
  choice: గర్జిస్తోంది
  rationale: వర్తమాన కృదంతం దృశ్యంలో కొనసాగుతున్న చర్యను సజీవంగా చూపుతుంది.
- source_word: לִקְרָאתוֹ
  choice: అతనికి ఎదురుగా వచ్చి
  rationale: ఈ పదం ‘అతని వైపు/అతన్ని ఎదుర్కొనేందుకు’ అనే భావాలను కలిగి ఉంది. సందర్భంలోని సమీపిస్తున్న సింహాన్ని సహజ తెలుగులో వ్యక్తం చేస్తూ మూలంలోని శత్రుత్వ సంభావ్యతను అతిగా విస్తరించదు.
