revisions:
- from: అప్పుడు సమ్సోను తన తండ్రితో, తల్లితో కలిసి తిమ్నాకు దిగివెళ్లాడు. వారు తిమ్నా ద్రాక్షతోటల వరకు వచ్చారు. ఇదిగో, ఒక యువ సింహం[a] అతనికి ఎదురుగా వచ్చి గర్జిస్తోంది[b].
  to: అప్పుడు సమ్సోను తన తండ్రితో, తల్లితో కలిసి తిమ్నాకు దిగివెళ్లాడు. వారు తిమ్నా ద్రాక్షతోటల వరకు వచ్చారు. ఇదిగో, ఒక యువ సింహం[a] అతని వైపుకు వస్తూ గర్జిస్తోంది[b].
  rationale: A small revision makes the lion's approach and roaring simultaneous, matching the Hebrew participial scene and לִקְרָאתוֹ, while preserving the source’s ambiguity between approaching and meeting/confronting. No theological or doctrinal interpretation is added.
