translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. ‘ఇదిగో’ ద్వారా הִנֵּה యొక్క ఆకస్మిక దృశ్య ప్రభావం నిలుపబడింది; לִקְרָאתוֹ లోని ‘వైపు రావడం/ఎదుర్కోవడం’ అనే భావసంభావ్యతను పాదటిప్పణిలో ఉంచారు.
