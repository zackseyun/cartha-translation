translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. భార్య ఆరోపణలోని భావోద్వేగ తీవ్రతను నిలిపి, ‘తెలియజేయలేదు’ అనే పదంతో పొడుపుకథనా లేక దాని పరిష్కారమా అన్న మూలపాఠంలోని స్వల్ప అనిశ్చితిని అనవసరంగా పరిష్కరించలేదు.
