  text: וַ/תֵּבְךְּ֩ אֵ֨שֶׁת שִׁמְשׁ֜וֹן עָלָ֗י/ו וַ/תֹּ֨אמֶר֙ רַק שְׂנֵאתַ֨/נִי֙ וְ/לֹ֣א אֲהַבְתָּ֔/נִי הַֽ/חִידָ֥ה חַ֨דְתָּ֙ לִ/בְנֵ֣י עַמִּ֔/י וְ/לִ֖/י לֹ֣א הִגַּ֑דְתָּה וַ/יֹּ֣אמֶר לָ֗/הּ הִנֵּ֨ה לְ/אָבִ֧/י וּ/לְ/אִמִּ֛/י לֹ֥א הִגַּ֖דְתִּי וְ/לָ֥/ךְ אַגִּֽיד־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/014/016.yaml
  text: Then Samson’s wife wept before him and said[a], “You only hate me; you do not love me. You have posed the riddle to the sons of my people, but you have not told me.” And he said to her, “Look, I have not told my father or my mother, so should I tell you?”
translation:
  language: te
  text: అప్పుడు సంసోను భార్య అతని ఎదుట ఏడ్చి, “నువ్వు నన్ను ద్వేషిస్తున్నావే తప్ప నన్ను ప్రేమించడం లేదు. నా ప్రజల మగవారికి[a] పొడుపుకథ వేశావు, కానీ నాకు దాన్ని తెలియజేయలేదు” అంది. అతడు ఆమెతో, “చూడు, నా తండ్రికిగానీ నా తల్లికిగానీ నేను దాన్ని తెలియజేయలేదు; నీకు తెలియజేస్తానా?” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “నా ప్రజల కుమారులకు.” ఇక్కడి హీబ్రూ పదబంధం పుంలింగంలో ఉంది; ఈ సందర్భంలో అది ఆమె ప్రజలలోని మగవారిని, బహుశా వివాహ విందులోని పురుష సహచరులను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּבְךְּ ... עָלָיו
  choice: అతని ఎదుట ఏడుస్తూ
  rationale: בכה అంటే ‘ఏడవడం.’ వ్యక్తిని సూచించే עַל ఇక్కడ అతని సమక్షంలో ఏడుస్తూ అతనిపై భావోద్వేగ ఒత్తిడి తెచ్చిన సందర్భాన్ని సూచిస్తుంది. ‘అతని ఎదుట’ ఆధునిక తెలుగులో సహజంగా ఉండి, అతడు చనిపోయినట్లు అపార్థం కలిగించే ‘అతని మీద/కోసం’ అనే రూపాలను నివారిస్తుంది.
- source_word: אֵשֶׁת שִׁמְשׁוֹן
  choice: సమ్సోను భార్య
  rationale: నిర్మాణ సంబంధాన్ని సహజమైన ఆధునిక తెలుగు స్వామ్య పదబంధంగా అనువదించింది.
- source_word: רַק שְׂנֵאתַנִי וְלֹא אֲהַבְתָּנִי
  choice: నువ్వు నన్ను ద్వేషిస్తున్నావే తప్ప నన్ను ప్రేమించడం లేదు
  rationale: רַק ఇచ్చే తీవ్ర ఆరోపణను ‘…ఏ తప్ప’తో, ద్వేషం–ప్రేమ వ్యతిరేకతను నేరుగా నిలిపింది.
- source_word: הַחִידָה חַדְתָּ
  choice: పొడుపుకథ వేశావు
  rationale: חִידָהకు ‘పొడుపుకథ’ సాధారణ తెలుగు పదం; חוד క్రియతో కలిసినప్పుడు ‘పొడుపుకథ వేయడం’ సహజమైన ప్రయోగం.
- source_word: לִבְנֵי עַמִּי
  choice: నా ప్రజల మగవారికి[a]
  rationale: పదబంధం అక్షరార్థంగా ‘నా ప్రజల కుమారులకు.’ వివాహ విందులోని పురుష సహచరులను సూచించే ఈ సందర్భంలో ‘మగవారికి’ లింగ సూచనను నిలుపుతూ సహజంగా ఉంది; అక్షరార్థాన్ని పాదసూచికలో ఇచ్చింది.
- source_word: וְלִי לֹא הִגַּדְתָּה
  choice: కానీ నాకు దాన్ని తెలియజేయలేదు
  rationale: נגד హిఫిల్ రూపానికి ‘తెలియజేయడం’ సరిపోతుంది. ‘దాన్ని’ అనే సర్వనామం పొడుపుకథకు సంబంధించిన విషయాన్ని సూచిస్తుంది; మూలంలో లేని ‘జవాబు’ అనే స్పష్టీకరణను చేర్చలేదు.
- source_word: הִנֵּה
  choice: చూడు
  rationale: హెచ్చరిక లేదా దృష్టి ఆకర్షణ కలిగించే సంభాషణాత్మక బలాన్ని ఆధునిక తెలుగులో సహజంగా అందిస్తుంది.
- source_word: לְאָבִי וּלְאִמִּי לֹא הִגַּדְתִּי
  choice: నా తండ్రికిగానీ నా తల్లికిగానీ నేను దాన్ని తెలియజేయలేదు
  rationale: నిషేధ వాక్యంలో ఇద్దరు తల్లిదండ్రులనూ స్పష్టంగా పేర్కొంటూ తెలుగు ‘గానీ…గానీ’ నిర్మాణాన్ని వాడింది.
- source_word: וְלָךְ אַגִּיד
  choice: నీకు తెలియజేస్తానా?
  rationale: హీబ్రూ అసంపూర్ణ క్రియ యొక్క ప్రశ్నార్థక, అలంకారిక బలాన్ని నిలిపి, సమ్సోను చెప్పడానికి నిరాకరిస్తున్న భావాన్ని అదనపు వివరణ లేకుండా అందిస్తుంది.
