translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కథనానికి తగిన గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. మూలంలోని పదునైన వ్యవసాయ రూపకాన్ని ప్రధాన పాఠ్యంలో నిలిపి, దాని ఉద్దేశాన్ని పాదటిప్పణిలో వివరించింది.
