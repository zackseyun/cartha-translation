source:
  edition: WLC
  text: וַ/יֹּ֣אמְרוּ ל/וֹ֩ אַנְשֵׁ֨י הָ/עִ֜יר בַּ/יּ֣וֹם הַ/שְּׁבִיעִ֗י בְּ/טֶ֨רֶם֙ יָבֹ֣א הַ/חַ֔רְסָ/ה מַה מָּת֣וֹק מִ/דְּבַ֔שׁ וּ/מֶ֥ה עַ֖ז מֵ/אֲרִ֑י וַ/יֹּ֣אמֶר לָ/הֶ֔ם לוּלֵא֙ חֲרַשְׁתֶּ֣ם בְּ/עֶגְלָתִ֔/י לֹ֥א מְצָאתֶ֖ם חִידָתִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/014/018.yaml
  text: And the men of the city said to him on the seventh day[a], before the sun went down, “What is sweeter than honey, and what is stronger than a lion?” And he said to them, “If you had not plowed with my heifer[b], you would not have found out my riddle.”
translation:
  language: te
  text: ఏడవ రోజున[a], సూర్యాస్తమయానికి ముందు, పట్టణంలోని పురుషులు అతనితో, “తేనెకంటే తియ్యనిది ఏది? సింహంకంటే బలమైనది ఏది?” అన్నారు. అతడు వారితో, “మీరు నా పెయ్యతో దున్నకపోయి ఉంటే[b], నా పొడుపుకథకు జవాబు కనిపెట్టేవారు కాదు” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “సూర్యాస్తమయానికి ముందు” అని అనువదించిన మాటకు అక్షరార్థం “సూర్యుడు లోపలికి రాకముందు.” ఇది సూర్యుడు అస్తమించడాన్ని సూచించే నుడికారం.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “మీరు నా పెయ్యతో దున్నకపోయి ఉంటే.” సమ్సోను తన భార్యను ఉద్దేశించి ఈ రూపకాన్ని వాడుతూ, పొడుపుకథ జవాబు తెలుసుకోవడానికి వారు ఆమెను ఉపయోగించుకున్నారని ఆరోపిస్తున్నాడు.
    reason: cultural_note
lexical_decisions:
- source_word: אַנְשֵׁי הָעִיר
  choice: పట్టణంలోని పురుషులు
  rationale: మూలంలోని పుంలింగ బహువచనాన్ని నిలుపుతూ, ఆధునిక తెలుగులో స్పష్టంగా ఉంటుంది.
- source_word: בְּטֶרֶם יָבֹא הַחַרְסָה
  choice: సూర్యాస్తమయానికి ముందు
  rationale: అక్షరార్థంగా ‘సూర్యుడు లోపలికి రాకముందు’; సందర్భంలో ఇది సూర్యాస్తమయానికి ముందని తెలిపే హీబ్రూ నుడికారం.
- source_word: מַה מָּתוֹק מִדְּבַשׁ
  choice: తేనెకంటే తియ్యనిది ఏది?
  rationale: מִן‌ను తులనార్థకంగా తీసుకొని పొడుపుకథలోని సహజమైన ప్రశ్నారూపాన్ని నిలిపింది.
- source_word: וּמֶה עַז מֵאֲרִי
  choice: సింహంకంటే బలమైనది ఏది?
  rationale: עַז‌కు బలమైన, ఉగ్రమైన అనే భావాలు ఉన్నా, సమాంతర తులనలో ‘బలమైనది’ సహజంగా సరిపోతుంది.
- source_word: חֲרַשְׁתֶּם בְּעֶגְלָתִי
  choice: నా పెయ్యతో దున్నకపోయి ఉంటే
  rationale: సమ్సోను చేసిన వ్యవసాయ రూపకాన్ని సూటిగా నిలుపుతుంది; ‘పెయ్య’ అంటే చిన్న ఆడ పశువు, ఇక్కడ అతని భార్యను సూచించే అవమానకర రూపకం.
- source_word: מְצָאתֶם חִידָתִי
  choice: నా పొడుపుకథకు జవాబు కనిపెట్టేవారు కాదు
  rationale: ‘నా పొడుపుకథను కనుగొనేవారు కాదు’ అనే అక్షరరూపం తెలుగులో అసహజం; సందర్భానుసారంగా పరిష్కారాన్ని కనిపెట్టడమనే భావాన్ని స్పష్టం చేస్తుంది.
