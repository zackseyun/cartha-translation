  text: And Samson’s wife became the wife of his companion[a], who had been his friend.
translation:
  language: te
  text: శిమ్షోను భార్య, అతనితో స్నేహంగా మెలిగిన అతని సహచరుని భార్య అయింది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతని స్నేహితుని భార్య … అతనితో సహవాసం చేసినవాడు.” హీబ్రూలో సామాజిక అనుబంధాన్ని సూచించే רעה పదవర్గానికి చెందిన సంబంధిత పదాలు వాడబడ్డాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּהִי
  choice: అయింది
  rationale: కథనంలో స్థితి మార్పు లేదా ఫలితాన్ని సూచిస్తుంది; స్థిరార్థకమైన ‘ఉండింది’ కంటే ‘అయింది’ తగినది.
- source_word: אֵשֶׁת שִׁמְשׁוֹן
  choice: శిమ్షోను భార్య
  rationale: హీబ్రూ సమాస నిర్మాణంలోని వైవాహిక సంబంధాన్ని సహజమైన ఆధునిక తెలుగు స్వామ్య నిర్మాణంతో తెలియజేస్తుంది.
- source_word: לְמֵרֵעֵהוּ
  choice: అతని సహచరునికి … భార్య
  rationale: היה తో కూడిన לְ బదిలీ లేదా కొత్త సంబంధాన్ని సూచిస్తుంది. רעה పదవర్గంలోని నామవాచకం ఇక్కడ తోడు లేదా సహచరుణ్ణి సూచిస్తుంది.
- source_word: אֲשֶׁר רֵעָה לוֹ
  choice: అతడు శిమ్షోనుకు స్నేహితుడిగా ఉన్నవాడు
  rationale: ఇక్కడ క్రియ పశువులను మేపడం అనే అర్థంలో కాక, సాంఘిక సహవాసం లేదా స్నేహాన్ని సూచిస్తుంది. సర్వనామ సూచనలో సందిగ్ధత రాకుండా ‘శిమ్షోనుకు’ అని స్పష్టం చేయబడింది.
