revisions:
- from: అప్పుడు అతని తండ్రి ఆ స్త్రీ దగ్గరికి దిగివెళ్లాడు. అక్కడ సమ్సోను ఒక విందు[a] ఏర్పాటు చేశాడు; ఎందుకంటే యువకులు అలా చేయడం ఆనవాయితీ.
  to: అతని తండ్రి ఆ స్త్రీ వద్దకు దిగివెళ్లాడు. అక్కడ సమ్సోను ఒక విందు[a] ఏర్పాటు చేశాడు; ఎందుకంటే యువకులు అలా చేసేవారు.
  rationale: The revision replaces the somewhat abstract ‘ఆనవాయితీ’ construction with a direct habitual verbal expression that better reflects the Hebrew imperfect. ‘వద్దకు’ is a slightly more natural rendering of movement to a person than ‘దగ్గరికి.’ The footnote is retained, with only punctuation adjusted for Telugu readability.
