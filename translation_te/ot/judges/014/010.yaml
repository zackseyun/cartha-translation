translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. మూలంలోని దిశాసూచక భావాన్ని ‘దిగివెళ్లాడు’ ద్వారా, ఆచార భావాన్ని ‘ఆనవాయితీ’ ద్వారా నిలుపుకున్నాం. పాదసూచిక గుర్తును దాని సంబంధిత పదమైన ‘విందు’ తరువాత ఉంచాం.
