  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֵּ֥רֶד אָבִ֖י/הוּ אֶל הָ/אִשָּׁ֑ה וַ/יַּ֨עַשׂ שָׁ֤ם שִׁמְשׁוֹן֙ מִשְׁתֶּ֔ה כִּ֛י כֵּ֥ן יַעֲשׂ֖וּ הַ/בַּחוּרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/014/010.yaml
  text: So his father went down to the woman[a], and Samson made a feast there, for that is what the young men did.
translation:
  language: te
  text: అతని తండ్రి ఆ స్త్రీ వద్దకు దిగివెళ్లాడు. అక్కడ సమ్సోను ఒక విందు[a] ఏర్పాటు చేశాడు; ఎందుకంటే యువకులు అలా చేసేవారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘విందుభోజనం’ లేదా ‘మద్యపానంతో కూడిన విందు.’ హీబ్రూ పదమైన מִשְׁתֶּה సాధారణంగా పానీయాలు కూడా ఉండే వేడుక భోజనాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: దిగివెళ్లాడు
  rationale: יָרַד అనే క్రియలోని ‘కిందికి వెళ్లడం’ అనే దిశాసూచక భావాన్ని సహజమైన తెలుగు కథన శైలిలో నిలుపుతుంది.
- source_word: אָבִיהוּ
  choice: అతని తండ్రి
  rationale: మూడవ పురుష ఏకవచన పుంలింగ ప్రత్యయం సందర్భంలో సమ్సోనును సూచిస్తుంది.
- source_word: אֶל הָאִשָּׁה
  choice: ఆ స్త్రీ దగ్గరికి
  rationale: హీబ్రూ పాఠం ఆమెను కేవలం ‘ఆ స్త్రీ’ అని పేర్కొంటుంది; సందర్భం ఆధారంగా ‘భార్య’ లేదా ‘వధువు’ అని స్పష్టీకరించలేదు.
- source_word: וַיַּעַשׂ
  choice: ఏర్పాటు చేశాడు
  rationale: עָשָׂה సాధారణంగా ‘చేయు/తయారుచేయు’ అని అర్థమిచ్చినా, విందుతో కలిసి వచ్చినప్పుడు ‘ఏర్పాటు చేశాడు’ అనేది సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: שָׁם
  choice: అక్కడ
  rationale: స్థలాన్ని సూచించే సరళమైన క్రియావిశేషణానికి సహజమైన తెలుగు సమానం.
- source_word: מִשְׁתֶּה
  choice: విందు
  rationale: సంబర సందర్భంలోని భోజనాన్ని, సాధారణంగా పానీయాలు కూడా ఉండే విందును సూచిస్తుంది; ‘విందు’ మూలపదాన్ని అతిగా నిర్దిష్టం చేయకుండా భావాన్ని అందిస్తుంది.
- source_word: כִּי כֵּן יַעֲשׂוּ
  choice: ఎందుకంటే ... అలా చేయడం ఆనవాయితీ
  rationale: అసంపూర్ణ క్రియారూపం ఇక్కడ అప్పటి సాధారణ ఆచారాన్ని సూచిస్తుంది; తెలుగు వాక్యంలో అలవాటైన ఆచార భావాన్ని స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: הַבַּחוּרִים
  choice: యువకులు
  rationale: בָּחוּר యౌవన ప్రాయంలోని పురుషుణ్ణి సూచిస్తుంది; వివాహ సందర్భంలో ‘యువకులు’ సహజమైన, తగినంత విస్తృతమైన పదం.
