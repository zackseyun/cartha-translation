- source_word: מִבְּנוֹת פְּלִשְׁתִּים
  choice: ఫిలిష్తీయుల కుమార్తెలలో
  rationale: ‘ఫిలిష్తీయుల కుమార్తెలలోనుండి/వారిలో ఒకరు’ అనే హీబ్రూ కుటుంబ-జాతి పదప్రయోగాన్ని ప్రధాన పాఠ్యంలో సాధ్యమైనంత దగ్గరగా నిలిపాం.
