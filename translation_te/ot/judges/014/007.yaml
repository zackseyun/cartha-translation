source:
  edition: WLC
  text: וַ/יֵּ֖רֶד וַ/יְדַבֵּ֣ר לָ/אִשָּׁ֑ה וַ/תִּישַׁ֖ר בְּ/עֵינֵ֥י שִׁמְשֽׁוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/014/007.yaml
  text: Then he went down and spoke to the woman[a], and she was pleasing in Samson’s eyes.
translation:
  language: te
  text: అప్పుడు అతడు కిందికి వెళ్లి ఆ స్త్రీతో మాట్లాడాడు. ఆమె షిమ్షోను దృష్టికి సరైనదిగా అనిపించింది[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, సామెతార్థంగా: ‘ఆమె షిమ్షోనుకు నచ్చింది.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: అప్పుడు అతడు కిందికి వెళ్లి
  rationale: יָרַד భౌగోళికంగా తిమ్నాకు దిగివెళ్లడాన్ని సూచిస్తుంది. కథనంలోని వావ్-క్రమాన్ని సహజమైన ఆధునిక తెలుగులో ‘అప్పుడు’తో వ్యక్తం చేశాం.
- source_word: וַיְדַבֵּר לָאִשָּׁה
  choice: ఆ స్త్రీతో మాట్లాడాడు
  rationale: דבר + ל ఎవరితోనో మాట్లాడడాన్ని సూచిస్తుంది. తెలుగు వాడుకలో ‘స్త్రీతో మాట్లాడాడు’ సహజంగా ఉండి, పరస్పర సంభాషణ జరిగిందని అవసరానికి మించి నిర్ధారించదు.
- source_word: לָאִשָּׁה
  choice: ఆ స్త్రీ
  rationale: אִשָּׁה సందర్భానుసారం ‘స్త్రీ’ లేదా ‘భార్య’ కావచ్చు. ఇక్కడ ఇంకా వివాహం జరగలేదు కాబట్టి ‘స్త్రీ’ సందర్భోచితం; నిర్దిష్టతను ‘ఆ’ తెలియజేస్తుంది.
- source_word: וַתִּישַׁר
  choice: నచ్చింది
  rationale: יָשַׁר ఇక్కడ షిమ్షోను అంచనాలో ఆమె అనుకూలంగా లేదా సరైనదిగా కనిపించిందనే భావం ఇస్తుంది. ‘నచ్చింది’ ఆధునిక తెలుగులో సహజంగా ఆ మూల్యాంకన భావాన్ని అందిస్తుంది.
- source_word: בְּעֵינֵי שִׁמְשׁוֹן
  choice: షిమ్షోను దృష్టికి
  rationale: ‘కళ్లలో’ అనే యథాతథ రూపం తెలుగులో అసహజంగా ఉండవచ్చు. ‘దృష్టికి’ హెబ్రీ మూలంలోని చూడటం/మూల్యాంకనం రూపకాన్ని కొంత నిలుపుతూ, న్యాయాధిపతులు గ్రంథంలోని ‘తన దృష్టికి సరైనది’ అనే ఇతివృత్త ప్రతిధ్వనిని కాపాడుతుంది.
theological_decisions:
- issue: న్యాయాధిపతులు గ్రంథంలో ‘తన దృష్టికి సరైనది’ అనే ఇతివృత్తంతో ఉండగల సాహిత్య ప్రతిధ్వని
  choice: ‘షిమ్షోను దృష్టికి’ అనే దృష్టి-రూపకాన్ని ప్రధాన పాఠ్యంలో నిలుపడం
  alternative: ‘ఆమె షిమ్షోనుకు నచ్చింది’ అని పూర్తిగా సామెతార్థంగా అనువదించడం
  rationale: హెబ్రీ పదబంధం షిమ్షోను వ్యక్తిగత మూల్యాంకనాన్ని ముందుకు తెస్తూ గ్రంథంలోని విస్తృత ఇతివృత్తాన్ని ప్రతిధ్వనింపజేయవచ్చు. ఆ సంబంధాన్ని బలవంతంగా నిర్ధారించకుండా రూపకాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సహజంగా, గౌరవప్రదంగా ఉండే కథన శైలి. ‘షిమ్షోను దృష్టికి’ అనే రూపం మూలంలోని సాహిత్య ప్రతిధ్వనిని నిలుపుతుంది; పాదసూచికలో సహజమైన ప్రత్యామ్నాయాలు ఇవ్వబడ్డాయి.
