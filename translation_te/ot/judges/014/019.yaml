base_translation:
  language: en
  yaml_path: translation/ot/judges/014/019.yaml
  text: And the Spirit of Yahweh rushed upon him[a], and he went down to Ashkelon and struck down thirty men from among them, and took their spoil garments and gave the changes of clothes to those who had explained the riddle. And his anger burned, and he went up to his father's house.
translation:
  language: te
  text: యాహ్వే ఆత్మ అతనిమీద బలంగా దిగింది. అతడు అష్కెలోనుకు దిగివెళ్లి, వారిలో ముప్పై మందిని చంపి, వారి వస్త్రాలను[a] తీసుకున్నాడు. ఆ మారుబట్టలను పొడుపుకథ జవాబు చెప్పినవారికి ఇచ్చాడు. అతని కోపం రగిలింది; అతడు తన తండ్రి ఇంటికి వెళ్లాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “చంపబడినవారి ఒంటినుంచి విప్పి తీసుకున్న దుస్తులను.” ఈ హీబ్రూ పదం సాధారణంగా “వస్త్రాలు” అని అర్థం కావచ్చు; సందర్భంలో వాటిని దోపుడు సొత్తుగా తీసుకున్నారనే భావాన్ని కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּצְלַח עָלָיו רוּחַ יְהוָה
  choice: యాహ్వే ఆత్మ అతనిమీద బలంగా దిగివచ్చింది
  rationale: צלח అనే క్రియ యాహ్వే ఆత్మతో వచ్చినప్పుడు అకస్మాత్తుగా, శక్తివంతంగా కలిగిన దైవిక ప్రేరణను సూచిస్తుంది. తెలుగులో ‘బలంగా దిగివచ్చింది’ ఆ తీవ్రతను సహజంగా తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, హీబ్రూ వ్యక్తినామానికి దగ్గరైన ఆధునిక తెలుగు లిప్యంతరీకరణను ఉపయోగించాం.
- source_word: וַיֵּרֶד אַשְׁקְלוֹן
  choice: అష్కెలోనుకు వెళ్లి
  rationale: ירד లోని దిగువకు వెళ్లడమనే భావం తెలుగులో ఇక్కడ అక్షరార్థంగా పలికితే అసహజంగా ఉంటుంది; గమ్యస్థానాన్ని స్పష్టంగా ఉంచుతూ సహజ కథనశైలిని ఎంచుకున్నాం.
- source_word: וַיַּךְ מֵהֶם שְׁלֹשִׁים אִישׁ
  choice: అక్కడివారిలో ముప్పై మందిని చంపి
  rationale: ఈ సందర్భంలో נכה ప్రాణాంతకంగా కొట్టడాన్ని సూచిస్తుంది; ‘చంపి’ ఫలితాన్ని స్పష్టంగా చెబుతుంది. מֵהֶם లోని విభాజక భావాన్ని ‘అక్కడివారిలో’ నిలిపాం.
- source_word: חֲלִיצוֹתָם
  choice: వారి ఒంటిమీది వస్త్రాలను
  rationale: ఈ పదం చంపబడినవారి నుంచి విప్పి తీసుకున్న దుస్తులను సూచించగలదు. ‘ఒంటిమీది వస్త్రాలు’ ఆ సందర్భార్థాన్ని తెలుగులో సంక్షిప్తంగా తెలియజేస్తుంది; సాధారణ ‘వస్త్రాలు’ అనే అర్థాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: הַחֲלִיפוֹת
  choice: ఆ మారుబట్టలను
  rationale: חליפות అనేది మార్చుకొని ధరించే బట్టల జతలను సూచిస్తుంది. ‘మారుబట్టలు’ ఆధునిక తెలుగులో సహజమైన, సందర్భానికి తగిన పదం.
- source_word: לְמַגִּידֵי הַחִידָה
  choice: పొడుపుకథ జవాబు చెప్పినవారికి
  rationale: נגד ఇక్కడ పొడుపుకథ పరిష్కారాన్ని వెల్లడించడాన్ని సూచిస్తుంది. ‘జవాబు చెప్పినవారు’ సాధారణ పాఠకులకు స్పష్టంగా ఉంటుంది.
- source_word: וַיִּחַר אַפּוֹ
  choice: అతని కోపం రగిలింది
  rationale: కోపం మండడమనే హీబ్రూ రూపకాన్ని సహజమైన తెలుగు రూపకం ‘రగిలింది’తో నిలిపాం.
- source_word: וַיַּעַל בֵּית אָבִיהוּ
  choice: అతడు తన తండ్రి ఇంటికి వెళ్లిపోయాడు
  rationale: עלה అక్షరార్థంగా ‘పైకి వెళ్లాడు’; ఈ సందర్భంలో తెలుగులో దిశను అక్షరార్థంగా ఉంచడం అసహజం. తిరుగు ప్రయాణ భావాన్ని అతిగా చేర్చకుండా గమ్యాన్ని సహజంగా తెలిపాం.
theological_decisions:
- issue: దైవిక శక్తినిచ్చే కార్యం మరియు సమ్సోను చేసిన హింస మధ్య సంబంధం
  choice: యాహ్వే ఆత్మ అతనిమీద బలంగా దిగివచ్చింది
  alternative: యాహ్వే ఆత్మ అతనికి బలాన్నిచ్చింది
  rationale: మూలపాఠం దైవాత్మ యొక్క శక్తివంతమైన రాకను నేరుగా చెబుతుంది; అయితే తరువాత జరిగిన ప్రతి చర్యకు నైతిక ఆమోదం ఉందని ప్రత్యేకంగా చెప్పదు. అనువాదం ఆ ఉద్రిక్తతను వివరణతో పరిష్కరించకుండా అలాగే ఉంచుతుంది.
- issue: దైవనామం יְהוָה యొక్క అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు
  rationale: మూలంలోని వ్యక్తిగత దైవనామాన్ని పాఠ్యంలో ప్రత్యక్షంగా నిలిపి, దానిని ఒక బిరుదుతో భర్తీ చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కథనశైలి ఉపయోగించబడింది. హింసను మూలపాఠం చెప్పినంత స్పష్టంగా చెప్పాం; దానిని మృదూకరించలేదు లేదా నైతిక వ్యాఖ్యను చేర్చలేదు. పాదసూచిక గుర్తు [a] అది వివరిస్తున్న ‘వస్త్రాలను’ అన్న పదబంధం వెంట ఉంచబడింది.
