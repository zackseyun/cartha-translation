id: JDG.14.6
reference: Judges 14:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/תִּצְלַ֨ח עָלָ֜י/ו ר֣וּחַ יְהוָ֗ה וַֽ/יְשַׁסְּעֵ֨/הוּ֙ כְּ/שַׁסַּ֣ע הַ/גְּדִ֔י וּ/מְא֖וּמָה אֵ֣ין בְּ/יָד֑/וֹ וְ/לֹ֤א הִגִּיד֙ לְ/אָבִ֣י/ו וּ/לְ/אִמּ֔/וֹ אֵ֖ת אֲשֶׁ֥ר עָשָֽׂה׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/014/006.yaml
  text: Then the Spirit of Yahweh rushed upon him[a], and he tore it apart as one tears apart a young goat, though he had nothing in his hand[b]. But he did not tell his father or his mother what he had done.
translation:
  language: te
  text: అప్పుడు యాహ్వే ఆత్మ అతనిమీదికి బలంగా వచ్చింది[a]. అతని చేతిలో ఏమీ లేకపోయినా, ఎవరో మేకపిల్లను చీల్చినట్లుగా అతడు ఆ సింహాన్ని చీల్చివేశాడు[b]. అయితే తాను చేసినది తన తండ్రికిగానీ తల్లికిగానీ చెప్పలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అతనిమీదికి శక్తితో వచ్చింది’; ఈ హీబ్రూ పదబంధం అకస్మాత్తుగా శక్తినిచ్చే రాకను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: 'హీబ్రూ: ‘మేకపిల్లను చీల్చినట్లుగా.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּצְלַח עָלָיו
  choice: అతని మీదికి శక్తితో వచ్చాడు
  rationale: צלח על అనే పదబంధం ఇక్కడ యాహ్వే ఆత్మ అకస్మాత్తుగా, బలంగా వచ్చి సామ్సోనును కార్యానికి శక్తిమంతునిగా చేయడాన్ని సూచిస్తుంది. సహజమైన తెలుగులో ఈ బలమైన రాకను వ్యక్తం చేస్తూ, మూలంలోని రూపకాన్ని అతిగా విస్తరించదు.
- source_word: רוּחַ יְהוָה
  choice: యాహ్వే ఆత్మ
  rationale: ఇక్కడ רוּחַ గాలి లేదా మనోవైఖరి కాదు; దేవుని నుండి కార్యశక్తినిచ్చే ఆత్మను సూచిస్తుంది. יְהוָה అనే దైవనామాన్ని యాహ్వే అని లిప్యంతరీకరించాం.
- source_word: וַיְשַׁסְּעֵהוּ
  choice: ఆ సింహాన్ని చీల్చివేశాడు
  rationale: שׁסע బలంగా చీల్చడం లేదా చింపివేయడం అనే అర్థం ఇస్తుంది. పూర్వసందర్భంలోని సింహమే కర్మ అని తెలుగులో స్పష్టంగా చూపించాం.
- source_word: כְּשַׁסַּע הַגְּדִי
  choice: మేకపిల్లను చీల్చినట్లు
  rationale: גְּדִי అంటే మేకపిల్ల. పోలికలోని సంక్షిప్తతను, చర్య సులభంగా జరిగిన భావాన్ని నిలిపాం; ఎవరు మేకపిల్లను చీల్చుతారో మూలం చెప్పనందున తెలుగులోనూ నిర్దిష్ట కర్తను చేర్చలేదు.
- source_word: וּמְאוּמָה אֵין בְּיָדוֹ
  choice: అతని చేతిలో ఏమీ లేకపోయినా
  rationale: అతను ఆయుధమేదీ ఉపయోగించలేదనే విరుద్ధార్థక ప్రాధాన్యాన్ని సహజమైన తెలుగు concessive నిర్మాణంతో వ్యక్తం చేశాం.
- source_word: וְלֹא הִגִּיד לְאָבִיו וּלְאִמּוֹ
  choice: అయితే ... తన తండ్రికిగానీ తల్లికిగానీ చెప్పలేదు
  rationale: నిరాకరణ పరిధి తల్లిదండ్రులిద్దరిపైనా వర్తిస్తుందని తెలుగు ‘గానీ ... గానీ’ నిర్మాణం స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: אֵת אֲשֶׁר עָשָׂה
  choice: తాను చేసినది
  rationale: ముందే జరిగిన చర్యను సూచించే సంబంధవాక్యాన్ని సంక్షిప్తమైన, సహజమైన తెలుగులో అందించాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: హీబ్రూ పాఠంలో ఉన్న ఒడంబడిక నామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునికంగా ఆమోదించబడిన ఉచ్చారణకు దగ్గరగా ‘యాహ్వే’ అని లిప్యంతరీకరించాం.
- issue: רוּחַ యొక్క భావం
  choice: ఆత్మ
  alternative: గాలి / శక్తి
  rationale: యాహ్వేతో కూడిన ఈ నిర్మాణం న్యాయాధిపతులు గ్రంథంలో దేవుని నుండి వ్యక్తిపైకి వచ్చి కార్యసామర్థ్యాన్ని ఇచ్చే ఆత్మను సూచిస్తుంది; దాన్ని కేవలం నిర్జీవ శక్తిగా మార్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే కథన గాంభీర్యం నిలిచేలా రూపొందించబడింది. ‘చీల్చివేశాడు’ చర్య తీవ్రతను వ్యక్తం చేస్తుంది. మూలంలో పోలికకు నిర్దిష్ట కర్త లేకపోవడం నిలిపివేయబడింది; ‘ఆ సింహాన్ని’ అనేది ముందటి సందర్భంలోని సూచ్యాన్ని తెలుగులో సహజంగా స్పష్టం చేస్తుంది.
