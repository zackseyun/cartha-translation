translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. ‘ఏడుస్తూనే ఉంది’తో చర్య కొనసాగిన భావాన్ని, ‘తీవ్రంగా ఒత్తిడి చేసింది’తో మూలంలోని బలమైన ఒత్తిడిని నిలిపాము. ‘తన ప్రజల కుమారులు’ కొద్దిగా మూలానుసారమైన పదబంధమైనప్పటికీ, లింగసూచనను కాపాడేందుకు ప్రధాన పాఠ్యంలో ఉంచి సందర్భార్థాన్ని పాదసూచికలో వివరించాము.
