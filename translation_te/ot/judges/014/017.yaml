base_translation:
  language: en
  yaml_path: translation/ot/judges/014/017.yaml
  text: She wept before him the seven days that they had the feast[a]. And on the seventh day he told her, because she pressed him hard[b]; then she told the riddle to the sons of her people.
translation:
  language: te
  text: విందు సాగిన ఆ ఏడు రోజులంతా ఆమె అతనిపై ఏడుస్తూనే ఉంది.[a] ఏడవ రోజున ఆమె అతన్ని తీవ్రంగా ఒత్తిడి చేసినందువల్ల అతడు ఆమెకు చెప్పాడు. అప్పుడు ఆమె ఆ పొడుపుకథను తన ప్రజల పురుషులకు తెలిపింది.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీలో అక్షరార్థంగా ‘అతనిపై ఏడ్చింది’ అని ఉంది. ఈ ప్రయోగం ఆమె ఏడుపు అతనిని ఉద్దేశించి, అతనిపై నిరంతర భావోద్వేగ ఒత్తిడిగా సాగిందనే భావాన్ని ఇస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘తన ప్రజల పురుషులు’ అంటే ఈ సందర్భంలో ఆమె సొంత ప్రజలకు చెందిన పురుషులు, బహుశా అక్కడున్న ఫిలిష్తీయ సహచరులు కావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּבְךְּ עָלָיו
  choice: ఆమె అతని ఎదుట ఏడుస్తూనే ఉంది
  rationale: בכה అంటే ‘ఏడవడం’; עַל‌తో కూడిన ప్రయోగం ఆమె ఏడుపు అతనిని ఉద్దేశించి, అతనిపై భావోద్వేగ ఒత్తిడిగా కొనసాగిందని సూచిస్తుంది. సహజమైన తెలుగులో ‘అతని ఎదుట ఏడుస్తూనే ఉంది’ అని ఇచ్చి, కొనసాగిన చర్యను నిలిపాము.
- source_word: שִׁבְעַת הַיָּמִים אֲשֶׁר הָיָה לָהֶם הַמִּשְׁתֶּה
  choice: విందు జరిగిన ఆ ఏడు రోజులూ
  rationale: ‘ఆ ఏడు రోజులు’ అనే నిర్దిష్ట కాలవ్యవధినీ, מִשְׁתֶּה అనే విందు/విందుభోజన సందర్భాన్నీ సహజంగా వ్యక్తం చేస్తుంది; మద్యవిందు లేదా పెళ్లివిందు అని మూలం కంటే ఎక్కువగా నిర్దిష్టం చేయలేదు.
- source_word: וַיְהִי בַּיּוֹם הַשְּׁבִיעִי
  choice: ఏడవ రోజున
  rationale: కథనంలోని కాలమార్పును సంక్షిప్తంగా, సహజంగా తెలుపుతుంది.
- source_word: וַיַּגֶּד לָהּ
  choice: అతడు ఆమెకు చెప్పాడు
  rationale: נגד యొక్క సాధారణ భావమైన ‘చెప్పడం/తెలియజేయడం’ను కాపాడుతుంది; మూలంలో స్పష్టంగా లేని కర్మను చేర్చలేదు.
- source_word: כִּי הֱצִיקַתְהוּ
  choice: ఆమె అతన్ని తీవ్రంగా ఒత్తిడి చేసినందువల్ల
  rationale: צוק హిఫీల్ రూపం తెలిపే తీవ్రమైన, పట్టువిడవని ఒత్తిడిని వ్యక్తం చేస్తుంది; ‘వేధించింది’ కంటే భావోద్వేగ బలవంతపు స్వరాన్ని నిష్పాక్షికంగా ఉంచుతుంది.
- source_word: וַתַּגֵּד הַחִידָה
  choice: ఆమె ఆ పొడుపుకథను తెలిపింది
  rationale: నిర్దిష్టమైన חִידָהను ‘ఆ పొడుపుకథ’గా ఇచ్చి, పునరావృతమైన נגדను సహజ తెలుగులో ‘తెలిపింది’గా వ్యక్తం చేశాము.
- source_word: לִבְנֵי עַמָּהּ
  choice: తన ప్రజల కుమారులకు
  rationale: ‘తన ప్రజల కుమారులు’ అనే హెబ్రీ పదబంధంలోని పురుష సూచనను నిలిపింది; సందర్భంలో ఇది ఆమె జాతికి చెందిన పురుషులను, ముఖ్యంగా ఫిలిష్తీయ సహచరులను సూచించవచ్చు.
