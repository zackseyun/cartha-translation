translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. హెబ్రీ వాక్యంలోని కాలసంబంధ నిర్మాణం, వ్యక్తుల సంఖ్య, సహచరుల పాత్రలోని అనిశ్చితి నిలుపబడ్డాయి.
