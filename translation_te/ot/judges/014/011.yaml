  yaml_path: translation/ot/judges/014/011.yaml
  text: And when they saw him[a], they took thirty companions, and they were with him.
translation:
  language: te
  text: వారు అతన్ని చూసినప్పుడు, ముప్పై మంది సహచరులను[a] తీసుకున్నారు; ఆ సహచరులు అతనితో ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “స్నేహితులను”; ఇక్కడ వివాహ సందర్భంలో వరుని వెంట ఉండే సహచరులు అని ప్రత్యేకంగా ఉద్దేశించి ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּרְאוֹתָם
  choice: వారు … చూసినప్పుడు
  rationale: היה యొక్క కథన పరిచయ రూపాన్ని తెలుగులో విడిగా అనువదిస్తే కృత్రిమంగా ఉంటుంది; כ + ראה క్రియానామ రూపం ఇక్కడ కాలసూచకంగా ‘చూసినప్పుడు’ అనే భావాన్ని ఇస్తుంది.
- source_word: אֹתוֹ
  choice: అతన్ని
  rationale: ఈ ప్రత్యక్ష కర్మ సర్వనామం సందర్భంలో సమ్సోనును సూచిస్తుంది.
- source_word: וַיִּקְחוּ
  choice: తీసుకున్నారు
  rationale: לקח యొక్క ప్రాథమిక అర్థమైన ‘తీసుకొను’ను నిలుపుతూ, సహచరులను అతనితో ఉండేందుకు తీసుకున్నారనే సందర్భార్థాన్ని అతిగా నిర్దిష్టం చేయకుండా ఉంచుతుంది.
- source_word: שְׁלֹשִׁים מֵרֵעִים
  choice: ముప్పై మంది సహచరులను
  rationale: מֵרֵעִים అనేది సహవాసులు లేదా సహచరులను సూచిస్తుంది. వివాహంలో ప్రత్యేక అధికారిక పాత్రను మూలపదం స్పష్టంగా పేర్కొననందున ‘తోడిపెళ్లికొడుకులు’ వంటి అధిక నిర్దిష్ట పదాన్ని ప్రధాన పాఠ్యంలో వాడలేదు.
- source_word: וַיִּהְיוּ אִתּוֹ
  choice: ఆ సహచరులు అతనితో ఉన్నారు
  rationale: హెబ్రీలోని సరళమైన ‘వారు అతనితో ఉన్నారు’ అనే నిర్మాణాన్ని నిలుపుతూ, తెలుగులో ‘వారు’ ఎవరిని సూచిస్తుందో కలిగే అనవసర అస్పష్టతను నివారించడానికి ‘ఆ సహచరులు’ అని స్పష్టం చేయబడింది.
