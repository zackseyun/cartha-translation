  text: וַ/יְהִ֣י בַּ/יּ֣וֹם הַ/שְּׁבִיעִ֗י וַ/יֹּאמְר֤וּ לְ/אֵֽשֶׁת שִׁמְשׁוֹן֙ פַּתִּ֣י אֶת אִישֵׁ֗/ךְ וְ/יַגֶּד לָ֨/נוּ֙ אֶת הַ֣/חִידָ֔ה פֶּן נִשְׂרֹ֥ף אוֹתָ֛/ךְ וְ/אֶת בֵּ֥ית אָבִ֖י/ךְ בָּ/אֵ֑שׁ הַ/לְ/יָרְשֵׁ֕/נוּ קְרָאתֶ֥ם לָ֖/נוּ הֲ/לֹֽא׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/014/015.yaml
  text: And on the seventh day they said to Samson’s wife[a], “Entice your husband so that he may tell us the riddle, lest we burn you and your father’s household with fire[b]. Did you invite us to dispossess us? Is that not so?”
translation:
  language: te
  text: ఏడవ రోజున వారు సమ్సోను భార్యతో, “మాయమాటలతో నీ భర్తను ఒప్పించి, ఆ పొడుపుకథను మాకు చెప్పేలా చేయి. లేకపోతే నిన్నూ నీ తండ్రి ఇంటివారినీ[a] అగ్నితో కాల్చివేస్తాం. మా సొత్తును స్వాధీనం చేసుకోవడానికే[b] మీరు మమ్మల్ని పిలిచారా? అంతే కదా?” అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నీ తండ్రి ఇంటినీ.” హీబ్రూ పదబంధం భౌతికమైన ఇంటిని లేదా విస్తృతంగా తండ్రి కుటుంబాన్ని/ఇంటివారిని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా “మమ్మల్ని నిర్ధనుల్ని చేయడానికే” / “మమ్మల్ని మా సొత్తు నుంచి తొలగించడానికే.” హీబ్రూ క్రియకు ఇతరుల ఆస్తిని స్వాధీనం చేసుకోవడం లేదా వారిని దాని నుంచి తొలగించడం అనే భావాలు ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּתִּי
  choice: మాయచేసి
  rationale: ఈ పీయేల్ ఆజ్ఞారూపంలో ఒప్పించడంతోపాటు మోసపూరితంగా ప్రభావితం చేసే భావం ఉంది; ‘మాయచేసి’ ఆ ప్రతికూల, కుట్రపూరిత ఛాయను సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: אִישֵׁךְ
  choice: నీ భర్తను
  rationale: వివాహిత స్త్రీ సందర్భంలో אִישׁ అంటే సహజంగా ‘భర్త’.
- source_word: וְיַגֶּד לָנוּ
  choice: మాకు చెప్పేలా చేయి
  rationale: 'ఆజ్ఞ తరువాత వచ్చిన సంధి సహిత అసంపూర్ణ క్రియ ఉద్దేశాన్ని సూచిస్తుంది: ఆమె అతనిని మాయచేసి, అతడు వారికి చెప్పేలా చేయాలి.'
- source_word: הַחִידָה
  choice: ఆ పొడుపుకథను
  rationale: חִידָהకు ఈ సందర్భంలో స్పష్టమైన, సాధారణ తెలుగు సమానం ‘పొడుపుకథ’.
- source_word: פֶּן נִשְׂרֹף אֹתָךְ וְאֶת־בֵּית אָבִיךְ בָּאֵשׁ
  choice: లేకపోతే నిన్నూ నీ తండ్రి ఇంటివారినీ నిప్పుతో కాల్చేస్తాం
  rationale: פֶּן ఇక్కడ బెదిరింపుతో కూడిన ప్రతికూల పరిణామాన్ని తెలియజేస్తుంది; తెలుగులో ‘లేకపోతే’ సహజం. అగ్నితో కాల్చే స్పష్టమైన హింసాత్మక చిత్రణను నిలిపాం.
- source_word: בֵּית אָבִיךְ
  choice: నీ తండ్రి ఇంటివారిని
  rationale: హీబ్రూ ‘ఇల్లు’ భవనాన్ని గానీ కుటుంబం/ఇంటివారిని గానీ సూచించగలదు. వ్యక్తులను కాల్చేస్తామనే సందర్భంలో ‘ఇంటివారు’ సహజంగా ఉంది; ప్రత్యామ్నాయం పాదసూచికలో ఉంచాం.
- source_word: הֲלְיָרְשֵׁנוּ
  choice: మాకున్నదాన్ని కాజేయడానికే
  rationale: ירשׁ ఇక్కడ ఇతరుల ఆస్తిని స్వాధీనం చేసుకోవడం లేదా వారిని దాని నుంచి తొలగించడం అనే భావాన్ని ఇస్తుంది. ‘కాజేయడం’ ఆ ఆరోపణాత్మక భావాన్ని సాధారణ తెలుగులో తెలియజేస్తుంది.
- source_word: קְרָאתֶם לָנוּ
  choice: మీరు మమ్మల్ని పిలిచారా
  rationale: קרא ל־ విందు సందర్భంలో ‘పిలవడం/ఆహ్వానించడం’ అని అర్థం. హీబ్రూలోని బహువచన కర్తను ‘మీరు’గా నిలిపాం.
- source_word: הֲלֹא
  choice: అంతే కదా?
  rationale: అంగీకారాన్ని ఆశించే ఆరోపణాత్మక అలంకార ప్రశ్నను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: ఏడవ రోజున
  rationale: కాలసూచక పదబంధానికి సూటిగా, సహజంగా ఉన్న తెలుగు అనువాదం.
