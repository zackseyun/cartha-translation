translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన కథన శైలిని వాడాం. బెదిరింపులోని తీవ్రతను తగ్గించలేదు. ‘మీరు’ అనే బహువచనాన్ని మూలంలోని קְרָאתֶם ప్రకారం నిలిపాం; ‘మాయచేసి’ అనే పదం పתה క్రియలోని మోసపూరిత ప్రభావాన్ని సంరక్షిస్తుంది.
