- from: కొన్ని రోజుల తర్వాత అతడు ఆమెను పెళ్లి చేసుకొని తీసుకువెళ్లడానికి తిరిగి వచ్చాడు. దారిలో సింహం కళేబరాన్ని చూడటానికి పక్కకు వెళ్లాడు. ఇదిగో, సింహం దేహంలో తేనెటీగల గుంపు, తేనె ఉన్నాయి.
  to: కొన్ని రోజుల తర్వాత అతడు ఆమెను వివాహం చేసుకోవడానికి తిరిగి వచ్చాడు. అతడు సింహం కళేబరాన్ని చూడటానికి పక్కకు తిరిగాడు. ఇదిగో, సింహం దేహంలో తేనెటీగల గుంపూ తేనె కూడా ఉన్నాయి.
