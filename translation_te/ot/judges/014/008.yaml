id: JDG.14.8
reference: Judges 14:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּ֤שָׁב מִ/יָּמִים֙ לְ/קַחְתָּ֔/הּ וַ/יָּ֣סַר לִ/רְא֔וֹת אֵ֖ת מַפֶּ֣לֶת הָ/אַרְיֵ֑ה וְ/הִנֵּ֨ה עֲדַ֧ת דְּבוֹרִ֛ים בִּ/גְוִיַּ֥ת הָ/אַרְיֵ֖ה וּ/דְבָֽשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/014/008.yaml
  text: After some days he returned to take her, and he turned aside to see the carcass of the lion, and behold, a swarm of bees was in the body of the lion, and honey.
translation:
  language: te
  text: కొన్ని రోజుల తర్వాత అతడు ఆమెను వివాహం చేసుకోవడానికి తిరిగి వచ్చాడు. అతడు సింహం కళేబరాన్ని చూడటానికి పక్కకు తిరిగాడు. ఇదిగో, సింహం దేహంలో తేనెటీగల గుంపూ తేనె కూడా ఉన్నాయి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִיָּמִים
  choice: కొన్ని రోజుల తర్వాత
  rationale: కాలవ్యవధి నిర్దిష్టంగా చెప్పబడలేదు; సహజమైన ఆధునిక తెలుగులో మూలంలోని అనిర్దిష్టతను నిలుపుతుంది.
- source_word: לְקַחְתָּהּ
  choice: ఆమెను పెళ్లి చేసుకొని తీసుకువెళ్లడానికి
  rationale: ఈ సందర్భంలో ఇది కేవలం ‘తీసుకోవడం’ కాదు, వివాహాన్ని పూర్తిచేసి వధువును తీసుకువెళ్లడాన్ని సూచిస్తుంది; సందర్భార్థాన్ని స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: מַפֶּלֶת הָאַרְיֵה
  choice: సింహం కళేబరం
  rationale: పడివున్న మృతదేహాన్ని సూచించే సందర్భార్థానికి ‘కళేబరం’ గౌరవప్రదమైన, స్పష్టమైన తెలుగు పదం.
- source_word: עֲדַת דְּבוֹרִים
  choice: తేనెటీగల గుంపు
  rationale: ‘సమూహం/గుంపు’ అనే భావాన్ని సహజంగా ఇస్తుంది; తేనెటీగల సందర్భంలో అర్థం స్పష్టం.
- source_word: בִּגְוִיַּת הָאַרְיֵה
  choice: సింహం దేహంలో
  rationale: మూలంలోని ‘దేహంలో’ అనే స్థానార్థాన్ని నేరుగా నిలుపుతుంది.
- source_word: וּדְבָשׁ
  choice: తేనె ఉన్నాయి
  rationale: హీబ్రూ మూలంలోని సంక్షిప్త ‘మరియు తేనె’ నిర్మాణాన్ని తెలుగులో అర్థస్పష్టతతో, జాబితా భావాన్ని నిలుపుతూ అందిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘ఇదిగో’ ద్వారా וְהִנֵּה యొక్క ఆకస్మిక దర్శనభావం నిలుపబడింది; అనవసరమైన సిద్ధాంత వివరణలు జోడించలేదు.
