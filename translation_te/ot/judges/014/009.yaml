  source_fidelity: హెబ్రీ వాక్యక్రమం మరియు భావం నమ్మకంగా ప్రతిబింబించబడ్డాయి. רדה యొక్క సందర్భానుగుణమైన ‘తీసుకోవడం/వెలికితీయడం’ భావాన్ని ప్రధాన పాఠ్యం సహజంగా ఇస్తుంది; పాదటిప్పణి చేతితో కళేబరం లోపలి నుంచి తీసే మరింత నిర్దిష్ట భావాన్ని సూచిస్తుంది. కొనసాగుతున్న చర్య (‘తింటూ వెళ్లాడు’), తల్లిదండ్రులకు కొంత ఇవ్వడం, మరియు మూలాన్ని వారికి చెప్పకపోవడం అన్నీ సరిగా ఉన్నాయి.
