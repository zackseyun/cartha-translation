  terminology: ‘కళేబరం’ జంతువు చనిపోయిన దేహాన్ని సూచిస్తూ גְּוִיָּה యొక్క స్పష్టమైన భావాన్ని కాపాడుతుంది. ‘తేనె,’ ‘అరచేతులు,’ మరియు బంధుత్వపదాలు సరైనవే. పాదటిప్పణి గుర్తు [a] పాఠ్యంలో సక్రమంగా అమర్చబడింది మరియు దాని వివరణ మూలక్రియకు తగినది.
