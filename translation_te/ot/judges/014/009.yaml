source:
  edition: WLC
  text: וַ/יִּרְדֵּ֣/הוּ אֶל כַּפָּ֗י/ו וַ/יֵּ֤לֶךְ הָלוֹךְ֙ וְ/אָכֹ֔ל וַ/יֵּ֨לֶךְ֙ אֶל אָבִ֣י/ו וְ/אֶל אִמּ֔/וֹ וַ/יִּתֵּ֥ן לָ/הֶ֖ם וַ/יֹּאכֵ֑לוּ וְ/לֹֽא הִגִּ֣יד לָ/הֶ֔ם כִּ֛י מִ/גְּוִיַּ֥ת הָ/אַרְיֵ֖ה רָדָ֥ה הַ/דְּבָֽשׁ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/014/009.yaml
  text: He scraped it into his hands and went on[a], eating as he went. Then he went to his father and mother and gave some to them, and they ate. But he did not tell them that he had scraped the honey from the carcass of the lion.
translation:
  language: te
  text: అతడు దాన్ని తన అరచేతుల్లోకి తీసుకొని[a], దారిలో తింటూ వెళ్లాడు. తరువాత తన తండ్రి దగ్గరికీ తల్లి దగ్గరికీ వెళ్లి, వారికి కొంత ఇచ్చాడు; వారు కూడా తిన్నారు. అయితే తాను ఆ తేనెను సింహం కళేబరం నుంచి తీసిన సంగతి వారికి చెప్పలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దాన్ని తన అరచేతుల్లోకి వెలికితీసుకొని.” ఇక్కడి హెబ్రీ క్రియ కళేబరం లోపలి నుంచి తేనెను చేతితో తీయడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְדֵּהוּ
  choice: దాన్ని ... తీసుకొని
  rationale: רדה ఇక్కడ సింహం కళేబరం లోపలి నుంచి తేనెను చేతితో వెలికితీయడాన్ని సూచిస్తుంది. తెలుగు ప్రధాన పాఠ్యంలో సహజమైన ‘తీసుకొని’ని ఉంచి, చర్యలోని మరింత నిర్దిష్ట భావాన్ని పాదటిప్పణిలో తెలిపాం.
- source_word: אֶל כַּפָּיו
  choice: తన అరచేతుల్లోకి
  rationale: כַּף యొక్క నిర్దిష్ట అర్థం ‘అరచేయి’; బహువచనాన్ని నిలుపుతూ తేనెను చేతుల్లోకి తీసుకున్న దృశ్యాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: וַיֵּלֶךְ הָלוֹךְ וְאָכֹל
  choice: దారిలో తింటూ వెళ్లాడు
  rationale: సమాపక క్రియతో కూడిన infinitive absolute కొనసాగుతున్న చర్యను సూచిస్తుంది; ఈ తెలుగు రూపం నడుస్తూనే తినడాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: וַיֵּלֶךְ אֶל אָבִיו וְאֶל אִמּוֹ
  choice: తన తండ్రి దగ్గరికీ తల్లి దగ్గరికీ వెళ్లి
  rationale: הלך యొక్క సాధారణ అర్థమైన ‘వెళ్లాడు’ను నిలిపి, రెండు గమ్యపదాలతో ఉన్న హెబ్రీ నిర్మాణాన్ని సహజ తెలుగులో ప్రతిబింబిస్తుంది.
- source_word: וַיִּתֵּן לָהֶם
  choice: వారికి కొంత ఇచ్చాడు
  rationale: సందర్భంలో కర్మ తేనె అని స్పష్టంగా ఉంది; ‘కొంత’ అనేది అతడు చేతిలో ఉన్న తేనెలో భాగాన్ని ఇచ్చాడనే అంతర్లీన భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וַיֹּאכֵלוּ
  choice: వారు కూడా తిన్నారు
  rationale: సాధారణ కథన క్రియను నేరుగా అనువదించాం; ‘కూడా’ అతడు ముందుగా తిన్న తరువాత వారు తిన్నారనే కథన సంబంధాన్ని తెలుగులో సహజంగా చూపుతుంది.
- source_word: וְלֹא הִגִּיד לָהֶם
  choice: అయితే ... వారికి చెప్పలేదు
  rationale: הגיד కు ‘చెప్పు’ సహజమైన సమానం; ‘అయితే’ సందర్భంలోని వ్యత్యాసాన్ని స్పష్టం చేస్తుంది.
- source_word: מִגְּוִיַּת הָאַרְיֵה
  choice: సింహం కళేబరం నుంచి
  rationale: גְּוִיָּה చనిపోయిన దేహాన్ని సూచిస్తుంది. జంతువు విషయంలో ‘కళేబరం’ హెబ్రీలోని అసహ్యకరమైన స్పష్టతను గౌరవప్రదంగా, ఖచ్చితంగా నిలుపుతుంది.
- source_word: רָדָה הַדְּבָשׁ
  choice: ఆ తేనెను ... తీసిన
  rationale: మొదటి רדה తో పదసామ్యాన్ని నిలుపుతూ, כִּי ప్రవేశపెట్టే గత చర్యను తెలుగు సంబంధక్రియా రూపంలో సహజంగా తెలిపాం.
