translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘పైకి వెళ్లి’ మూలంలోని దిశాభావాన్ని నిలుపుతుంది. వివాహ ఏర్పాటుకు సంబంధించిన ఆజ్ఞలో మూల క్రియకు దగ్గరగా ఉండేందుకు ‘తీసుకురండి’ ఎంచుకోబడింది; వ్యాఖ్యాత్మకంగా ‘పెళ్లి జరిపించండి’ అని విస్తరించలేదు.
