  yaml_path: translation/ot/judges/014/002.yaml
  text: Then he went up and told his father and mother[a], and he said, “I saw a woman in Timnah from the daughters of the Philistines. So now, get her for me as a wife.”
translation:
  language: te
  text: 'అప్పుడు అతడు పైకి వెళ్లి తన తండ్రికీ తల్లికీ చెప్పాడు: “తిమ్నాలో ఫిలిష్తీయుల కుమార్తెలలో ఒక స్త్రీని చూశాను[a]. ఇప్పుడు ఆమెను నాకు భార్యగా తీసుకురండి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “ఫిలిష్తీయుల కుమార్తెలలోనుండి ఒక స్త్రీని.”
    reason: హెబ్రీలోని מִן (‘నుండి/లోనుండి’) మరియు ‘కుమార్తెలు’ అనే సామూహిక నుడికారాన్ని సూచించడానికి.
lexical_decisions:
- source_word: וַיַּעַל
  choice: పైకి వెళ్లి
  rationale: עלה అనే క్రియలోని ‘పైకి వెళ్లడం’ అనే భావాన్ని నిలుపుతూ, భౌగోళిక వివరాన్ని అదనంగా ఊహించకుండా అనువదించబడింది.
- source_word: וַיַּגֵּד
  choice: చెప్పాడు
  rationale: Hiphil రూపంలోని ‘తెలియజేయడం/చెప్పడం’ అనే సాధారణ కథనార్థానికి సహజమైన ఆధునిక తెలుగు పదం.
- source_word: לְאָבִיו וּלְאִמּוֹ
  choice: తన తండ్రితో, తల్లితో
  rationale: రెండు తల్లిదండ్రులకూ చెప్పాడనే అర్థాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אִשָּׁה
  choice: ఒక స్త్రీని
  rationale: ఇక్కడ ఇంకా వివాహం జరగలేదు కాబట్టి ‘భార్య’ కంటే ‘స్త్రీ’ అనేది సందర్భానికి సరిపోతుంది; హెబ్రీ పదానికి ఈ రెండు అర్థాలూ ఉండగలవు.
- source_word: רָאִיתִי
  choice: చూశాను
  rationale: ప్రత్యక్ష సంభాషణలో పూర్తయిన గత చర్యను సహజంగా తెలియజేస్తుంది.
- source_word: בְתִמְנָתָה
  choice: తిమ్నాలో
  rationale: స్థల సూచనను ఆధునిక తెలుగులో సహజంగా అందిస్తుంది.
- source_word: מִבְּנוֹת פְּלִשְׁתִּים
  choice: ఫిలిష్తీయుల కుమార్తెలలో ఒక స్త్రీని
  rationale: מן లోని విభాగార్థాన్ని ‘లో ఒక’ ద్వారా స్పష్టంగా ఉంచి, ‘కుమార్తెలు’ అనే హెబ్రీ కుటుంబసంబంధ నుడికారాన్ని కాపాడుతుంది.
- source_word: וְעַתָּה
  choice: ఇప్పుడు
  rationale: చూసిన విషయాన్ని చెప్పడం నుంచి తన అభ్యర్థనకు మారుతున్న సంధిని సహజంగా సూచిస్తుంది.
- source_word: קְחוּ
  choice: తీసుకురండి
  rationale: לקח అనే క్రియ యొక్క ‘తీసుకొను/సంపాదించు’ భావాన్ని, తల్లిదండ్రులు వివాహాన్ని ఏర్పాటు చేసే సందర్భంలో తెలుగులో అర్థమయ్యే విధంగా వ్యక్తం చేస్తుంది; బహువచన ఆజ్ఞను గౌరవ బహువచన రూపం నిలుపుతుంది.
- source_word: אוֹתָהּ לִּי לְאִשָּׁה
  choice: ఆమెను నాకు భార్యగా
  rationale: ‘నాకు’ అనే వ్యక్తిగత ప్రయోజనాన్నీ, ‘భార్యగా’ అనే వివాహ ఉద్దేశాన్నీ రెండింటినీ నిలుపుతుంది.
