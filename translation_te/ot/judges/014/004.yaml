id: JDG.14.4
reference: Judges 14:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אָבִ֨י/ו וְ/אִמּ֜/וֹ לֹ֣א יָדְע֗וּ כִּ֤י מֵ/יְהוָה֙ הִ֔יא כִּי תֹאֲנָ֥ה הֽוּא מְבַקֵּ֖שׁ מִ/פְּלִשְׁתִּ֑ים וּ/בָ/עֵ֣ת הַ/הִ֔יא פְּלִשְׁתִּ֖ים מֹשְׁלִ֥ים בְּ/יִשְׂרָאֵֽל־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/014/004.yaml
  text: But his father and mother did not know that it was from Yahweh[a], for he was seeking an occasion from the Philistines[b]. At that time the Philistines were ruling over Israel.
translation:
  language: te
  text: అతని తండ్రికీ తల్లికీ అది యెహోవా నుండే వచ్చిందని తెలియదు. ఎందుకంటే అతడు ఫిలిష్తీయులకు వ్యతిరేకంగా ఒక అవకాశం వెదుకుతున్నాడు[a][b]. ఆ సమయంలో ఫిలిష్తీయులు ఇశ్రాయేలుపై పరిపాలిస్తూ ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఎందుకంటే యెహోవా ఫిలిష్తీయులకు వ్యతిరేకంగా ఒక అవకాశం వెదుకుతున్నాడు.” హీబ్రూ వాక్యాన్ని ఇలా కూడా అర్థం చేసుకోవచ్చు; అయితే సందర్భంలో ‘అతడు’ సమ్సోనును సూచించడం ఎక్కువ సంభావ్యం.
    reason: alternative_reading
  - marker: b
    text: “అవకాశం” అనే పదాన్ని “సాకు” లేదా “చర్య తీసుకోవడానికి తగిన సందర్భం” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵיְהוָה
  choice: యెహోవా వల్ల
  rationale: మూలంలోని దైవ నామాన్ని పేరుగానే ఉంచి, מִן సూచించే మూలం లేదా కారణాన్ని సహజమైన తెలుగు ‘వల్ల’తో వ్యక్తం చేస్తుంది.
- source_word: הִיא
  choice: అది ... జరిగిందని
  rationale: స్త్రీలింగ సర్వనామం ముందున్న వివాహ వ్యవహారాన్ని లేదా పరిస్థితిని సూచిస్తుంది; తెలుగులో ‘అది’ సహజంగా ఆ విషయాన్ని సూచిస్తుంది.
- source_word: תֹאֲנָה
  choice: ఒక అవకాశం
  rationale: చర్యకు దొరికే సందర్భం లేదా ఆధారమనే భావాన్ని ఇస్తూ, ‘సాకు’లో ఉండగల కపట ఉద్దేశాన్ని అనవసరంగా బలపరచదు.
- source_word: מְבַקֵּשׁ
  choice: కోసం చూస్తున్నాడు
  rationale: హీబ్రూ కృదంతంలోని కొనసాగుతున్న చర్యను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: מִפְּלִשְׁתִּים
  choice: ఫిలిష్తీయులకు వ్యతిరేకంగా
  rationale: అక్షరార్థంగా ‘ఫిలిష్తీయుల నుండి’ అయినా, సందర్భంలో వారిపై చర్యకు అవకాశం వెదకడమే ఉద్దేశం; లక్ష్యంగా ఉన్న విరోధ భావాన్ని ఈ రూపం స్పష్టం చేస్తుంది.
- source_word: וּבָעֵת הַהִיא
  choice: ఆ సమయంలో
  rationale: కథనంలోని కాల నేపథ్యాన్ని సరళంగా, సహజంగా అందిస్తుంది.
- source_word: מֹשְׁלִים בְּיִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులపై పరిపాలన చేస్తున్నారు
  rationale: కృదంతం సూచించే కొనసాగుతున్న ఆధిపత్యాన్ని తెలుగులో వర్తమాన-కొనసాగింపు రూపంతో వ్యక్తం చేస్తుంది.
- source_word: וְאָבִיו וְאִמּוֹ לֹא יָדְעוּ
  choice: అతని తండ్రికీ తల్లికీ తెలియదు
  rationale: మూలార్థాన్ని సహజమైన తెలుగు అనుభవకర్త నిర్మాణంలో నేరుగా అందిస్తుంది.
theological_decisions:
- issue: సమ్సోను చర్యలో దైవ ప్రమేయం మరియు మానవ చర్య
  choice: ఈ వ్యవహారం యెహోవా వల్ల జరిగిందని చెబుతూనే, అవకాశం కోసం చూస్తున్న వ్యక్తిగా సమ్సోనును చూపించడం
  alternative: యెహోవాయే నేరుగా అవకాశం కోసం చూస్తున్నాడని అర్థం చేసుకోవడం
  rationale: మూలపాఠం దైవ మూలాన్నీ మానవ చర్యనూ పక్కపక్కనే ఉంచుతుంది. అనువాదం ఆ ఉద్రిక్తతను ఒక సిద్ధాంతపరమైన వ్యవస్థతో పరిష్కరించకుండా అలాగే నిలుపుతుంది.
- issue: מְבַקֵּשׁ అనే ‘చూస్తున్నాడు’ క్రియకు కర్త ఎవరు?
  choice: ప్రధాన పాఠంలో కర్త సమ్సోను అని సూచించడం
  alternative: కర్త యెహోవా అని గ్రహించడం
  rationale: విస్తృత కథన సందర్భంలో ఫిలిష్తీయులకు వ్యతిరేకంగా అవకాశం వెదుకుతున్నవాడు సమ్సోను కావడం సహజం. అయితే హీబ్రూ వ్యాకరణం యెహోవాను కర్తగా గ్రహించే అవకాశాన్ని పూర్తిగా తొలగించదు కాబట్టి దాన్ని పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సరళంగా, అయితే గ్రంథపఠనానికి తగిన గౌరవప్రదమైన శైలిలో ఉంది. ‘యెహోవా’ అనే దైవ నామాన్ని అనువదించకుండా లిప్యంతరీకరించాం; అసలు పాఠంలోని కర్త సందిగ్ధతను పాదసూచికలో నిలిపాం.
