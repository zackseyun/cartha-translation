  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు స్పష్టంగా, అయితే గౌరవప్రదమైన కథన శైలిలో అనువదించబడింది. పందెంలోని షరతు, బద్ధత, వస్త్రపదంలోని భావవిస్తృతి నిలుపబడ్డాయి.
