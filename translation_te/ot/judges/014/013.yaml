  text: וְ/אִם לֹ֣א תוּכְלוּ֮ לְ/הַגִּ֣יד לִ/י֒ וּ/נְתַתֶּ֨ם אַתֶּ֥ם לִ/י֙ שְׁלֹשִׁ֣ים סְדִינִ֔ים וּ/שְׁלֹשִׁ֖ים חֲלִיפ֣וֹת בְּגָדִ֑ים וַ/יֹּ֣אמְרוּ ל֔/וֹ ח֥וּדָ/ה חִידָתְ/ךָ֖ וְ/נִשְׁמָעֶֽ/נָּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/014/013.yaml
  text: But if you cannot tell me[a], then you must give me thirty linen garments and thirty changes of clothes.” And they said to him, “Tell your riddle, and let us hear it.”
translation:
  language: te
  text: కాని మీరు దాని జవాబు నాకు చెప్పలేకపోతే, మీరు నాకు ముప్పై సన్నని నార వస్త్రాలు[a], ముప్పై జతల బట్టలు ఇవ్వాలి.” వారు అతనితో, “నీ పొడుపుకథ చెప్పు; మేము విందాం” అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ముప్పై సన్నని నార దుస్తులు.’ హీబ్రూ పదం సన్నని నారతో చేసిన వస్త్రాలను లేదా ధరించే దుస్తులను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: תוּכְלוּ
  choice: చెప్పలేకపోతే
  rationale: יכל సామర్థ్యాన్ని సూచిస్తుంది. షరతుతో కూడిన ఈ సందర్భంలో ‘చెప్పలేకపోతే’ అనేది ఇష్టంలేకపోవడాన్ని కాక అసమర్థతను సహజంగా తెలియజేస్తుంది.
- source_word: לְהַגִּיד לִי
  choice: దాని జవాబు నాకు చెప్పలేకపోతే
  rationale: נגד హిఫిల్ రూపానికి ‘చెప్పు, తెలియజేయు’ అనే అర్థం. ముందరి వచనంలోని పొడుపుకథ సందర్భాన్ని బట్టి తెలుగులో సహజంగా ఉండేందుకు సూచిత కర్మను ‘దాని జవాబు’గా వ్యక్తం చేశాం; ఇది కేవలం కథను తిరిగి చెప్పడం కాదని స్పష్టం చేస్తుంది.
- source_word: וּנְתַתֶּם אַתֶּם לִי
  choice: మీరు నాకు ... ఇవ్వాలి
  rationale: పందెంలోని షరతు ఫలితంగా వచ్చే బద్ధతను ఈ నిర్మాణం సూచిస్తుంది. ‘ఇవ్వాలి’ దాని విధిబలాన్ని ఆధునిక తెలుగులో సహజంగా అందిస్తుంది.
- source_word: סְדִינִים
  choice: సన్నని నార వస్త్రాలు
  rationale: ఈ పదం సన్నని నారతో చేసిన వస్త్రం లేదా దుస్తును సూచించవచ్చు. దుస్తుల పందెం సందర్భంలో ‘సన్నని నార వస్త్రాలు’ అర్థపరిధిని అనవసరంగా కుదించకుండా నిలుపుతుంది.
- source_word: חֲלִיפוֹת בְּגָדִים
  choice: జతల బట్టలు
  rationale: ఈ పదబంధం మార్చుకొని ధరించేందుకు సిద్ధంగా ఉన్న దుస్తుల సముదాయాలను సూచిస్తుంది. ‘జతల బట్టలు’ సాధారణ ఆధునిక తెలుగులో స్పష్టంగా ఉంటుంది.
- source_word: חוּדָה חִידָתְךָ
  choice: నీ పొడుపుకథ చెప్పు
  rationale: חוד ఆజ్ఞారూపం పొడుపుకథను ప్రతిపాదించమని చెప్పడాన్ని, חידה పొడుపుకథను సూచిస్తాయి. ‘నీ పొడుపుకథ చెప్పు’ సంభాషణాత్మకంగా, సహజంగా ఉంది.
- source_word: וְנִשְׁמָעֶנָּה
  choice: మేము వింటాం
  rationale: మొదటి పురుష బహువచన సంకల్పార్థక రూపం, స్త్రీలింగ ఏకవచన ప్రత్యయం పొడుపుకథను సూచిస్తుంది. ‘మేము వింటాం’ వారి సిద్ధతను సహజ తెలుగులో తెలియజేస్తుంది.
