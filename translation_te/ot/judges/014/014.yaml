  to: 'అతడు వారితో ఇలా అన్నాడు:


    “తినేవానిలోనుండి ఆహారం వెలువడింది;

    బలవంతునిలోనుండి తీపి వెలువడింది.”[a]


    అయితే మూడు రోజులపాటు వారు ఆ పొడుపుకథను చెప్పలేకపోయారు.[b]'
  rationale: The revision keeps the riddle's compact parallelism and unresolved imagery, uses personified Telugu substantives corresponding to the Hebrew forms, and renders the final idiom more closely without denying its contextual implication of failing to solve the riddle. Footnote anchors and reasons are retained and the second note is aligned with the revised wording.
