  text: וַ/יֹּ֣אמֶר לָ/הֶ֗ם מֵ/הָֽ/אֹכֵל֙ יָצָ֣א מַאֲכָ֔ל וּ/מֵ/עַ֖ז יָצָ֣א מָת֑וֹק וְ/לֹ֥א יָכְל֛וּ לְ/הַגִּ֥יד הַ/חִידָ֖ה שְׁלֹ֥שֶׁת יָמִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/014/014.yaml
  text: And he said to them[a], “Out of the eater came food[b], and out of the strong came sweetness.” But they could not tell the riddle for three days.
translation:
  language: te
  text: 'అతడు వారితో ఇలా అన్నాడు:


    “తినేవానిలోనుండి ఆహారం వెలువడింది;

    బలవంతునిలోనుండి తీపి వెలువడింది.”[a]


    అయితే మూడు రోజులపాటు వారు ఆ పొడుపుకథను చెప్పలేకపోయారు.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “బలవంతునిలోనుండి” అనే మాటను “ఉగ్రమైనవానిలోనుండి” అని కూడా అనువదించవచ్చు. హీబ్రూ పదానికి “బలమైన,” “శక్తిమంతమైన,” లేదా “ఉగ్రమైన” అనే అర్థాలు రావచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా “ఆ పొడుపుకథను వివరించలేకపోయారు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר לָהֶם
  choice: అతడు వారితో ఇలా అన్నాడు
  rationale: హీబ్రూ కథన ప్రవాహాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; ‘ఇలా’ తరువాత వచ్చే పొడుపుకథను పరిచయం చేస్తుంది.
- source_word: מֵהָאֹכֵל
  choice: తినేదానిలోనుండి
  rationale: אכל అనే క్రియ యొక్క కర్తృవాచక రూపం ఇక్కడ నామవాచకంగా వాడబడింది. లింగాన్ని అనవసరంగా నిర్దిష్టం చేయకుండా ‘తినేది’ అనే భావాన్ని నిలుపుతుంది.
- source_word: יָצָא
  choice: వచ్చింది
  rationale: ఏదో ఒక దానిలోనుండి వెలువడిన భావాన్ని ‘లోనుండి ... వచ్చింది’ అనే సహజ తెలుగు నిర్మాణం అందిస్తుంది.
- source_word: מַאֲכָל
  choice: ఆహారం
  rationale: ఈ నామవాచకం తినదగిన పదార్థాన్ని సూచిస్తుంది; సంక్షిప్తతను, పొడుపుకథ సమాంతర నిర్మాణాన్ని కాపాడుతుంది.
- source_word: וּמֵעַז
  choice: బలమైనదానిలోనుండి
  rationale: עַז అనే పదానికి ‘బలమైనది,’ ‘శక్తిమంతమైనది,’ ‘ఉగ్రమైనది’ అనే భావాలు ఉన్నాయి. సందర్భంలోని సింహాన్ని ముందుగానే బహిర్గతం చేయకుండా మూలంలోని సంక్షిప్త అస్పష్టతను నిలుపుతుంది.
- source_word: מָתוֹק
  choice: తీపి
  rationale: విశేషణం ఇక్కడ నామవాచకంగా పనిచేస్తోంది. ‘తీపి’ సహజమైన తెలుగు రూపం; తేనె అని ముందుగానే వ్యాఖ్యానించదు.
- source_word: לְהַגִּיד הַחִידָה
  choice: ఆ పొడుపుకథకు జవాబు చెప్పడం
  rationale: పదశః ‘పొడుపుకథను చెప్పడం/వివరించడం’ అని ఉండవచ్చు; ఈ సందర్భంలో దాని పరిష్కారాన్ని చెప్పడం ఉద్దేశం. తెలుగు వాడుకలో ‘పొడుపుకథకు జవాబు చెప్పడం’ స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: שְׁלֹשֶׁת יָמִים
  choice: మూడు రోజులపాటు
  rationale: కాలవ్యవధిని సహజంగా తెలుపుతుంది; మూలంలో లేని మరింత ఖచ్చితమైన కాలహద్దును చేర్చదు.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన కథన శైలి. పొడుపుకథను రెండు సమాంతర పాదాలుగా ఉంచి మూలంలోని సంక్షిప్తతను, పదప్రయోగ అస్పష్టతను కాపాడింది. అన్ని పాదటిప్పణి గుర్తులు ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
