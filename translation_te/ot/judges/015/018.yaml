  rationale: కేవలం వ్యాకరణపరమైన అసమ్మతిని సరిచేసి, హీబ్రూ వాక్యంలోని ప్రత్యక్ష ఉద్ఘాటనను “కలిగించావు నీవే” ద్వారా నిలిపాం. అర్థం, శైలి, దైవనామం, ప్రధాన పదజాలం, మరియు పాదటిప్పణి విషయాలను మార్చలేదు.
