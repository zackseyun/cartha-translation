  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּצְמָא֮ מְאֹד֒ וַ/יִּקְרָ֤א אֶל יְהוָה֙ וַ/יֹּאמַ֔ר אַתָּה֙ נָתַ֣תָּ בְ/יַֽד עַבְדְּ/ךָ֔ אֶת הַ/תְּשׁוּעָ֥ה הַ/גְּדֹלָ֖ה הַ/זֹּ֑את וְ/עַתָּה֙ אָמ֣וּת בַּ/צָּמָ֔א וְ/נָפַלְתִּ֖י בְּ/יַ֥ד הָ/עֲרֵלִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/015/018.yaml
  text: And he became very thirsty[a], and he called to Yahweh and said, “You have given this great deliverance by the hand of your servant[c][b], and now shall I die from thirst and fall into the hand of the uncircumcised?”
translation:
  language: te
  text: అతనికి చాలా దాహం వేసింది. అప్పుడు అతడు యాహ్వేకు మొరపెట్టి, “నీ సేవకుని ద్వారా ఈ గొప్ప విమోచనను[a] కలిగించావు నీవే. ఇప్పుడు నేను దాహంతో చనిపోయి, సున్నతి లేనివారి[b] చేతిలో పడాలా?” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “విమోచనం” అనే పదాన్ని సందర్భానుసారంగా “విజయం” లేదా “రక్షణ” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “సున్నతి లేనివారు” అని ఇక్కడ చెప్పబడినవారు ఇశ్రాయేలు శత్రువులు, ముఖ్యంగా ఫిలిష్తీయులు. మూలపాఠం జాతిపేరుకు బదులు నిబంధన గుర్తుతో ముడిపడిన పదాన్ని ఉపయోగిస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּצְמָא מְאֹד
  choice: అతనికి చాలా దాహం వేసింది
  rationale: హీబ్రూ క్రియ తీవ్రమైన దాహం కలగడాన్ని సూచిస్తుంది. ఈ రూపం ఆధునిక తెలుగులో సహజంగా ఉండి, מְאֹד యొక్క తీవ్రతను నిలుపుతుంది.
- source_word: וַיִּקְרָא אֶל יְהוָה
  choice: అతడు యాహ్వేకు మొరపెట్టి
  rationale: קרא אל ఇక్కడ ప్రార్థనలో సహాయం కోరుతూ పిలవడాన్ని సూచిస్తుంది. ‘మొరపెట్టి’ సందర్భంలోని విజ్ఞాపన భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పునర్నిర్మిత ఉచ్చారణను తెలుగులో లిప్యంతరీకరించాం.
- source_word: בְיַד עַבְדְּךָ
  choice: నీ సేవకుని ద్వారా
  rationale: ביד ఇక్కడ సాధనం లేదా ప్రతినిధిత్వాన్ని సూచిస్తుంది. ‘ద్వారా’ అనేది హీబ్రూ భావాన్ని స్పష్టమైన ఆధునిక తెలుగులో అందిస్తుంది; ‘నీ సేవకుడు’ అనేది సమ్సోను దేవుని ఎదుట తనను తాను వినయంగా పేర్కొనడం.
- source_word: הַתְּשׁוּעָה הַגְּדֹלָה הַזֹּאת
  choice: ఈ గొప్ప విమోచనను
  rationale: תשועה సైనిక విజయంతో పాటు దేవుడు కలిగించిన రక్షణను కూడా సూచించగలదు. ‘విమోచనం’ ఈ రెండు కోణాలనూ నిలుపుతుంది.
- source_word: אָמ֣וּת בַּצָּמָא
  choice: నేను దాహంతో చనిపోయి
  rationale: בַּצָּמָא ఇక్కడ మరణానికి కారణమైన దాహాన్ని సూచిస్తుంది. తరువాతి క్రియతో కలిసి ఉన్న అలంకారప్రశ్నను తెలుగులో సహజంగా కొనసాగించాం.
- source_word: וְנָפַלְתִּי בְּיַד
  choice: చేతిలో పడాలా
  rationale: ఈ హీబ్రూ జాతీయం మరొకరి అధికారానికి చిక్కడాన్ని సూచిస్తుంది. తెలుగు ‘చేతిలో పడడం’ అదే రూపకాన్ని సహజంగా నిలుపుతుంది.
- source_word: הָעֲרֵלִים
  choice: సున్నతి లేనివారు
  rationale: మూలపాఠం ఫిలిష్తీయులు అని నేరుగా చెప్పకుండా, నిబంధనకు సంబంధించిన గుర్తును ఆధారంగా చేసుకున్న పదాన్ని వాడుతుంది. దాని వాక్చాతుర్య మరియు నిబంధనాత్మక బలాన్ని అనువాదంలో నిలుపాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలోని వ్యక్తిగత నిబంధన నామాన్ని బిరుదుగా మార్చకుండా తెలుగులో లిప్యంతరీకరించడం ద్వారా దాని ప్రత్యేకతను నిలుపాం.
- issue: תשועה యొక్క భావవ్యాప్తి
  choice: విమోచనం
  alternative: విజయం / రక్షణ
  rationale: సందర్భం సైనిక విజయమే అయినా, సమ్సోను దానిని దేవుడు ప్రసాదించిన విడుదలగా ఒప్పుకుంటున్నాడు. ‘విమోచనం’ ఈ రెండింటి మధ్య ఉన్న భావ ఉద్రిక్తతను అతిగా పరిమితం చేయదు.
- issue: הָעֲרֵלִים యొక్క నిబంధనాత్మక భావం
  choice: సున్నతి లేనివారు
  alternative: ఫిలిష్తీయులు
  rationale: ఇక్కడ ఉద్దేశించబడినవారు ముఖ్యంగా ఫిలిష్తీయులే అయినప్పటికీ, మూలపాఠం జాతిపేరుకు బదులు నిబంధనాత్మకంగా బలమైన పదాన్ని ఎంచుకుంది. ప్రధాన పాఠంలో దానిని నిలిపి, పాదటిప్పణిలో సందర్భాన్ని స్పష్టం చేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని ఉపయోగించాం. సమ్సోను ప్రార్థనలోని ప్రత్యక్షతను, విజయానంతర ప్రాణాపాయంపై ఉన్న వ్యంగ్యభరిత ఉద్రిక్తతను నిలుపాం. హీబ్రూ రూపకాన్ని అవసరమైన చోట (‘చేతిలో పడడం’) తెలుగులో సహజంగా సంరక్షించాం.
