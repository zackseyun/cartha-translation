- from: అతనికి చాలా దాహం వేసింది. అప్పుడు అతడు యాహ్వేకు మొరపెట్టి, “నీ సేవకుని ద్వారా ఈ గొప్ప విమోచనను[a] అనుగ్రహించింది నీవే. ఇప్పుడు నేను దాహంతో చనిపోయి, సున్నతి లేనివారి[b] చేతిలో పడాలా?” అన్నాడు.
