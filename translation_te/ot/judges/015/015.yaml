  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కథన శైలి. హీబ్రూ వాక్యంలోని వరుస చర్యలను రెండు తెలుగు వాక్యాలుగా అమర్చి పఠన సౌలభ్యాన్ని పెంచాం; పాదటిప్పణి గుర్తు [a] ప్రధాన పాఠ్యంలో ఉంచాం.
