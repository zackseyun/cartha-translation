language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּמְצָ֥א לְחִֽי חֲמ֖וֹר טְרִיָּ֑ה וַ/יִּשְׁלַ֤ח יָד/וֹ֙ וַ/יִּקָּחֶ֔/הָ וַ/יַּךְ בָּ֖/הּ אֶ֥לֶף אִֽישׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/015/015.yaml
  text: And he found a fresh jawbone of a donkey[a], and he reached out his hand and took it, and with it he struck down a thousand men.
translation:
  language: te
  text: అతడు తాజాగా ఉన్న గాడిద దవడ ఎముకను[a] కనుగొని, చేయి చాపి దాన్ని తీసుకొని, దానితో వెయ్యి మందిని హతమార్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘కొత్త గాడిద దవడ ఎముకను.’ హీబ్రూ విశేషణం తాజాగా ఉన్నదానిని లేదా కొత్తగా లభించినదానిని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְצָא
  choice: కనుగొన్నాడు
  rationale: מצא యొక్క సాధారణ కథన భూతకాల భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: לְחִי חֲמוֹר
  choice: గాడిద దవడ ఎముక
  rationale: לְחִי ఇక్కడ ఆయుధంగా ఉపయోగించగల దవడ ఎముకను సూచిస్తుంది; חֲמוֹר తోని సమాస సంబంధాన్ని ‘గాడిద దవడ ఎముక’ సహజంగా తెలియజేస్తుంది.
- source_word: טְרִיָּה
  choice: తాజా
  rationale: ఈ విశేషణం ఎండిపోయి పెళుసైనది కాకుండా తాజాగా ఉన్నదనే ప్రధాన భావాన్ని నిలుపుతుంది; ‘కొత్త’ అనే సాధ్యమైన భావాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: וַיִּשְׁלַח יָדוֹ
  choice: చెయ్యి చాపి
  rationale: హీబ్రూ నుడికారంలోని స్పష్టమైన శారీరక చర్యను సహజమైన తెలుగులో సంక్షిప్తంగా వ్యక్తపరుస్తుంది.
- source_word: וַיִּקָּחֶהָ
  choice: దాన్ని తీసుకొని
  rationale: స్త్రీలింగ ప్రత్యయం ముందున్న దవడ ఎముకను సూచిస్తుంది; לקח యొక్క సూటి కథన భావం ‘తీసుకొని’.
- source_word: וַיַּךְ בָּהּ
  choice: దానితో ... హతమార్చాడు
  rationale: נכה అంటే కొట్టడం లేదా దెబ్బతీయడం; ఈ యుద్ధ సందర్భంలో ప్రాణాంతక ఫలితం స్పష్టంగా ఉన్నందున ‘హతమార్చాడు’ సహజంగా ఆ భావాన్ని అందిస్తుంది, కాగా בָּהּ యొక్క సాధనార్థం ‘దానితో’గా నిలుస్తుంది.
- source_word: אֶלֶף אִישׁ
  choice: వెయ్యి మందిని
  rationale: యుద్ధ సందర్భంలో אִישׁ పురుష యోధులను సూచిస్తుంది; తెలుగులో సంఖ్యతో ‘మంది’ వాడటం సహజం, లింగాన్ని అనవసరంగా పునరుక్తి చేయదు.
