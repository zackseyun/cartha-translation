source:
  edition: WLC
  text: וַ/יֹּֽאמְרוּ֙ אִ֣ישׁ יְהוּדָ֔ה לָ/מָ֖ה עֲלִיתֶ֣ם עָלֵ֑י/נוּ וַ/יֹּאמְר֗וּ לֶ/אֱס֤וֹר אֶת שִׁמְשׁוֹן֙ עָלִ֔ינוּ לַ/עֲשׂ֣וֹת ל֔/וֹ כַּ/אֲשֶׁ֖ר עָ֥שָׂה לָֽ/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/015/010.yaml
  text: And the men of Judah said, “Why have you come up against us?” And they said, “We have come up to bind Samson, to do to him just as he did to us.”
translation:
  language: te
  text: యూదా ప్రజలు, “మీరు మా మీదికి ఎందుకు వచ్చారు?” అని అన్నారు. అందుకు వారు, “సంసోనును బంధించడానికి, అతడు మాకు చేసినట్టే అతనికి చేయడానికి వచ్చాం” అన్నారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִישׁ יְהוּדָה
  choice: యూదా మనుషులు
  rationale: אִישׁ రూపపరంగా ఏకవచనమైనా, ఇక్కడ బహువచన క్రియతో సమూహార్థంలో ఉంది. ‘యూదా మనుషులు’ ఆ సమూహార్థాన్నీ, మూలంలోని లింగసూచననూ సహజంగా నిలుపుతుంది.
- source_word: לָמָה
  choice: ఎందుకు
  rationale: కారణాన్ని ప్రశ్నించే సాధారణ హీబ్రూ పదానికి సహజమైన ఆధునిక తెలుగు సమానార్థకం.
- source_word: עֲלִיתֶם עָלֵינוּ
  choice: మా మీదికి వచ్చారు
  rationale: עלה + עַל ఇక్కడ శత్రుభావంతో ఎదిరిగా రావడాన్ని సూచిస్తుంది. ‘మా మీదికి వచ్చారు’ దిశాసూచననూ ప్రతికూల భావాన్నీ కాపాడుతుంది; ‘దాడి చేశారు’ అని మూలం కంటే స్పష్టీకరించదు.
- source_word: לֶאֱסוֹר
  choice: బంధించి
  rationale: אָסַר అంటే కట్టడం లేదా బంధించడం. సంసోనును పట్టుకునే ఈ సందర్భంలో ‘బంధించి’ నేరుగా, గౌరవప్రదంగా సరిపోతుంది.
- source_word: עָלִינוּ
  choice: వచ్చాం
  rationale: ముందటి ప్రశ్నలోని עלה క్రియనే జవాబులోనూ పునరావృతం చేశారు. తెలుగులో సహజ సంభాషణ కోసం ‘వచ్చాం’ వాడుతూ ఆ భావసంబంధాన్ని నిలిపాం.
- source_word: לַעֲשׂוֹת לוֹ
  choice: అతనికి చేయడానికి
  rationale: עשה + ל సందర్భానుసారం ‘ఒకరికి చేయడం’ లేదా ‘ఒకరిపట్ల చేయడం’ అనే భావం ఇస్తుంది. ప్రతీకార సందర్భం వల్ల ‘అతనికి చేయడానికి’ సరిపోతుంది; చర్య ఏమిటో మూలంలాగే నిర్దిష్టం చేయదు.
- source_word: כַּאֲשֶׁר עָשָׂה לָנוּ
  choice: అతడు మాకు చేసినట్టే
  rationale: כַּאֲשֶׁר పోలికను సూచిస్తుంది. ఈ రూపం ప్రతీకారంలోని సమానత్వాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: שִׁמְשׁוֹן
  choice: సంసోను
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగులో స్థిరపడిన బైబిలు రూపానికి అనుగుణంగా లిప్యంతరీకరించాం.
