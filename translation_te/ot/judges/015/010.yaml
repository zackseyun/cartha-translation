translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన సంభాషణ శైలి వాడబడింది. హీబ్రూలో పునరావృతమయ్యే ‘పైకి రావడం’ అనే దిశాత్మక నుడికారాన్ని తెలుగులో అసహజంగా చేయకుండా ‘మీదికి రావడం’గా అందించాం. మూలంలో లేని ‘దాడి’ లేదా నిర్దిష్ట శిక్ష వంటి వివరాలను చేర్చలేదు.
