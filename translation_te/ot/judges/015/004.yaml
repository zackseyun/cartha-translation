id: JDG.15.4
reference: Judges 15:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֵּ֣לֶךְ שִׁמְשׁ֔וֹן וַ/יִּלְכֹּ֖ד שְׁלֹשׁ מֵא֣וֹת שׁוּעָלִ֑ים וַ/יִּקַּ֣ח לַפִּדִ֗ים וַ/יֶּ֤פֶן זָנָב֙ אֶל זָנָ֔ב וַ/יָּ֨שֶׂם לַפִּ֥יד אֶחָ֛ד בֵּין שְׁנֵ֥י הַ/זְּנָב֖וֹת בַּ/תָּֽוֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/015/004.yaml
  text: So Shimshon went and caught three hundred foxes[a], and he took torches and turned them tail to tail, and put one torch between each pair of tails, in the middle.
translation:
  language: te
  text: షిమ్షోను వెళ్లి మూడు వందల గుంటనక్కలను[a] పట్టుకున్నాడు. తరువాత కాగడాలను తీసుకొని, వాటి తోకలను ఒకదానికొకటి ఎదురుగా తిప్పి, ప్రతి రెండు తోకల మధ్యలో ఒక్క కాగడాను పెట్టాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘నక్కలను.’ హెబ్రీ పదం שׁוּעָלִים గుంటనక్కలను, నక్కలను, లేదా వాటిని పోలిన ఇతర కుక్కజాతి జంతువులను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: వెళ్లి
  rationale: హెబ్రీ కథనంలో వరుసగా జరిగే చర్యను సహజమైన ఆధునిక తెలుగు శైలిలో తెలియజేస్తుంది.
- source_word: שִׁמְשׁוֹן
  choice: షిమ్షోను
  rationale: హెబ్రీ పేరైన Shimshon ఉచ్చారణను తెలుగు లిపిలో సాధ్యమైనంత దగ్గరగా ప్రతిలిపి చేస్తుంది.
- source_word: וַיִּלְכֹּד
  choice: పట్టుకున్నాడు
  rationale: ఈ సందర్భంలో జీవంగా ఉన్న జంతువులను పట్టుకోవడాన్ని సూచించే సహజమైన తెలుగు పదబంధం.
- source_word: שְׁלֹשׁ מֵאוֹת
  choice: మూడు వందల
  rationale: హెబ్రీ సంఖ్యా నిర్మాణానికి నేరమైన తెలుగు అనువాదం.
- source_word: שׁוּעָלִים
  choice: గుంటనక్కలను
  rationale: ఈ హెబ్రీ పదానికి సాధారణంగా ‘foxes’ అనే అర్థం వస్తుంది; ‘గుంటనక్కలు’ దానికి స్పష్టమైన తెలుగు సమానం. నక్కజాతికి చెందిన ఇతర జంతువులను, ముఖ్యంగా jackals‌ను, సూచించే అవకాశం పాదసూచికలో ఉంచబడింది.
- source_word: לַפִּדִים / לַפִּיד
  choice: కాగడాలను / కాగడాను
  rationale: మండే దివిటీలను లేదా అగ్నికొరవులను సూచించే ఈ పదానికి ‘కాగడాలు’ స్పష్టమైన, ప్రస్తుత తెలుగు ప్రయోగం.
- source_word: וַיֶּפֶן זָנָב אֶל זָנָב
  choice: వాటిని తోకకు తోక ఎదురుగా ఉండేలా తిప్పి
  rationale: פנה అనే క్రియలోని ‘తిప్పు’ భావాన్ని నిలుపుతుంది. మూలపాఠం స్పష్టంగా చెప్పని ‘కట్టాడు’ అనే చర్యను చేర్చదు.
- source_word: וַיָּשֶׂם לַפִּיד אֶחָד
  choice: ఒక్క కాగడాను పెట్టాడు
  rationale: שׂים అనే సాధారణ క్రియను సహజంగా అనువదిస్తూ, ప్రతి జతకు ఒక కాగడా అనే భావాన్ని తెలియజేస్తుంది.
- source_word: בֵּין שְׁנֵי הַזְּנָבוֹת בַּתָּוֶךְ
  choice: ప్రతి రెండు తోకల మధ్యలో
  rationale: అక్షరార్థమైన ‘ఆ రెండు తోకల మధ్యలో’ అనే భావాన్ని, ప్రతి జంతు జత విషయంలో చర్య పునరావృతమైందని స్పష్టమయ్యే సహజ తెలుగు రూపంలో వ్యక్తం చేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన కథన శైలి వాడబడింది. మూలపాఠంలో లేని ‘తోకలను కట్టాడు’ అనే వివరాన్ని చేర్చకుండా, ‘తోకకు తోక ఎదురుగా ఉండేలా తిప్పి’ అని అనువదించబడింది.
