translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కథన శైలి. అరుదైన హీబ్రూ నుడికారంలోని శరీర భాగాల దృశ్యాన్ని ప్రధాన పాఠ్యంలో నిలిపి, దాని అనిశ్చిత సందర్భార్థాన్ని పాదసూచికలో తెలిపాం.
