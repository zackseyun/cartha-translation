id: JDG.15.8
reference: Judges 15:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּ֨ךְ אוֹתָ֥/ם שׁ֛וֹק עַל יָרֵ֖ךְ מַכָּ֣ה גְדוֹלָ֑ה וַ/יֵּ֣רֶד וַ/יֵּ֔שֶׁב בִּ/סְעִ֖יף סֶ֥לַע עֵיטָֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/015/008.yaml
  text: And he struck them hip and thigh with a great slaughter[a], and he went down and stayed in the cleft of the rock of Etam.
translation:
  language: te
  text: అతడు వారిని “కాలుపై తొడ” అని చెప్పబడిన విధంగా భారీ దెబ్బతో కొట్టాడు[a]. తరువాత అతడు దిగి, ఏతాము బండ చీలికలో ఉండిపోయాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా “కాలుపై తొడ.” ఈ కఠినమైన నుడికారం బహుశా సంపూర్ణమైన లేదా ఘోరమైన ఓటమిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּךְ
  choice: చితకబాది
  rationale: נכה అంటే ‘కొట్టు/దెబ్బతీయు.’ ఇక్కడి హింసాత్మక సందర్భంలో ‘చితకబాది’ తీవ్రమైన దాడిని సహజమైన తెలుగులో తెలియజేస్తుంది; ప్రతి వ్యక్తి చంపబడ్డాడని క్రియ ఒక్కటే నిర్దిష్టంగా చెప్పదు.
- source_word: שׁוֹק עַל יָרֵךְ
  choice: తొడమీద కాలు అన్నట్లుగా
  rationale: ఇది అర్థం పూర్తిగా నిర్ధారించలేని హీబ్రూ నుడికారం. శరీర భాగాల దృశ్యాన్ని ప్రధాన వాక్యంలో నిలిపి, దాని సంభావ్య భావాన్ని పాదసూచికలో వివరించాం.
- source_word: מַכָּה גְדוֹלָה
  choice: ఘోరంగా ఓడించాడు
  rationale: అక్షరార్థంగా ‘గొప్ప దెబ్బ’; యుద్ధ సందర్భంలో తీవ్రమైన సంహారం లేదా ఘోర పరాజయాన్ని సూచించవచ్చు. తెలుగు వాక్యంలో పునరుక్తి లేకుండా సందర్భార్థాన్ని సహజంగా అందిస్తుంది.
- source_word: וַיֵּרֶד
  choice: దిగి
  rationale: దిగువకు వెళ్లడమనే దిశార్థాన్ని నేరుగా నిలుపుతుంది.
- source_word: וַיֵּשֶׁב
  choice: నివసించాడు
  rationale: ישב కు కూర్చోవడం, ఉండడం, నివసించడం అనే అర్థాలు ఉన్నాయి. ఇక్కడ ఆశ్రయస్థలంలో ఉండటాన్ని ‘నివసించాడు’ సహజంగా వ్యక్తం చేస్తుంది; ఎంతకాలమో నిర్దిష్టం చేయదు.
- source_word: בִּסְעִיף סֶלַע
  choice: బండ చీలికలోకి
  rationale: סעיף రాతిలోని చీలిక లేదా పగులును సూచిస్తుంది; סלע బండ/రాతి నిర్మాణం. ‘బండ చీలిక’ రెండింటినీ సంక్షిప్తంగా, స్పష్టంగా అందిస్తుంది.
- source_word: עֵיטָם
  choice: ఏతాము
  rationale: స్థలనామాన్ని ఆధునిక తెలుగు ధ్వన్యనుసారంగా లిప్యంతరీకరించాం.
