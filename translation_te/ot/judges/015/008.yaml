    text: హీబ్రూలో అక్షరార్థంగా “కాలుపై తొడ.” ఈ కఠినమైన నుడికారం బహుశా సంపూర్ణమైన లేదా ఘోరమైన ఓటమిని సూచిస్తుంది.
    reason: lexical_alternative
  revision_rationale: The revision retains the Hebrew idiom in a deliberately literal form without turning it into a Telugu simile, distinguishes it from the following ‘great blow,’ and explains its probable force only in the footnote. It also uses a more restrained narrative verb and a natural term for remaining in the rock cleft.
