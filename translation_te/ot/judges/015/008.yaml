revisions:
- from: అతడు వారిని తొడమీద కాలు అన్నట్లుగా చితకబాది, ఘోరంగా ఓడించాడు[a]. తరువాత అతడు ఏతాము బండ చీలికలోకి దిగి అక్కడ నివసించాడు.
  to: అతడు వారిని “కాలుపై తొడ” అని చెప్పబడిన విధంగా భారీ దెబ్బతో కొట్టాడు[a]. తరువాత అతడు దిగి, ఏతాము బండ చీలికలో ఉండిపోయాడు.
  rationale: The revision retains the Hebrew idiom in a deliberately literal form without turning it into a Telugu simile, distinguishes it from the following ‘great blow,’ and explains its probable force only in the footnote. It also uses a more restrained narrative verb and a natural term for remaining in the rock cleft.
