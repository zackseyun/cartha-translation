- from: అప్పుడు ఫిలిష్తీయులు పైకి వచ్చి యూదా ప్రాంతంలో మకాం వేసి, లెహీ దగ్గర సైన్యంగా విస్తరించారు.
  to: అప్పుడు ఫిలిష్తీయులు పైకి వెళ్లి యూదాలో మకాం వేసి, లెహీ వద్ద విస్తరించారు[a].
  rationale: The revision removes the non-source-based and awkward ‘సైన్యంగా,’ retains the sequential military actions in the Hebrew, and uses a footnote to represent the plausible military-deployment nuance of the final verb. ‘యూదాలో’ is a direct, idiomatic rendering of the locative phrase.
