source:
  edition: WLC
  text: וַ/יַּעֲל֣וּ פְלִשְׁתִּ֔ים וַֽ/יַּחֲנ֖וּ בִּ/יהוּדָ֑ה וַ/יִּנָּטְשׁ֖וּ בַּ/לֶּֽחִי׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/015/009.yaml
  text: Then the Philistines went up and camped in Judah[a], and spread out at Lehi.
translation:
  language: te
  text: అప్పుడు ఫిలిష్తీయులు పైకి వెళ్లి యూదాలో మకాం వేసి, లెహీ వద్ద విస్తరించారు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “లెహీ వద్ద మోహరించారు.” హెబ్రీ క్రియ సైనిక సందర్భంలో విస్తరించి నిలవడాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: పైకి వచ్చి
  rationale: עלה అనే క్రియలోని దిశాభావాన్ని నిలుపుతూ, కథకుని దృష్టికోణంలో సైనిక కదలికను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: פְלִשְׁתִּים
  choice: ఫిలిష్తీయులు
  rationale: ఈ ప్రజావర్గానికి ప్రామాణిక తెలుగు పేరు.
- source_word: וַיַּחֲנוּ
  choice: మకాం వేసి
  rationale: חנה సూచించే శిబిరం ఏర్పరచుకోవడం అనే అర్థాన్ని ఆధునిక, సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: בִּיהוּדָה
  choice: యూదా ప్రాంతంలో
  rationale: ב ఇక్కడ ప్రధానంగా స్థలాన్ని సూచిస్తుంది; 'ప్రాంతంలో' అనడం యూదా అనే భూభాగ భావాన్ని స్పష్టం చేస్తుంది, వ్యతిరేకతను అనవసరంగా పదంలో చేర్చదు.
- source_word: וַיִּנָּטְשׁוּ
  choice: సైన్యంగా విస్తరించారు
  rationale: ఈ సందర్భంలో נטשׁ సైనిక బలగాలు ఒక ప్రదేశంలో విస్తరించి మోహరించడాన్ని సూచిస్తుంది; మూలంలోని విస్తరణ భావాన్నీ సైనిక సందర్భాన్నీ రెండింటినీ నిలుపుతుంది.
- source_word: בַּלֶּחִי
  choice: లెహీ దగ్గర
  rationale: లెహీ ఇక్కడ స్థలనామం; ב ఉపసర్గను సైనిక స్థానం సూచించే సహజ తెలుగు ప్రయోగంతో అనువదించింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కథన శైలికి తగిన సరళమైన, గౌరవప్రదమైన వాక్య నిర్మాణం. మూలంలోని వరుస సైనిక చర్యలను స్పష్టంగా ఉంచి, అవసరానికి మించిన వ్యాఖ్యానాన్ని నివారించింది.
