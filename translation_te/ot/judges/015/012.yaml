  text: וַ/יֹּ֤אמְרוּ ל/וֹ֙ לֶ/אֱסָרְ/ךָ֣ יָרַ֔דְנוּ לְ/תִתְּ/ךָ֖ בְּ/יַד פְּלִשְׁתִּ֑ים וַ/יֹּ֤אמֶר לָ/הֶם֙ שִׁמְשׁ֔וֹן הִשָּׁבְע֣וּ לִ֔/י פֶּֽן תִּפְגְּע֥וּ/ן בִּ֖/י אַתֶּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/015/012.yaml
  text: They said to him, “We have come down to bind you, to hand you over into the hand of the Philistines.” Samson said to them, “Swear to me that you yourselves will not attack me.”
translation:
  language: te
  text: వారు అతనితో, “నిన్ను బంధించి ఫిలిష్తీయుల చేతికి అప్పగించడానికి మేము దిగివచ్చాం” అన్నారు. అప్పుడు సంసోను వారితో, “మీరే నాపై దాడి చేయబోమని నాకు ప్రమాణం చేయండి” అన్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֶאֱסָרְךָ
  choice: నిన్ను బంధించి
  rationale: నిఫాల్ క్రియారూపం సందర్భంలో ‘నిన్ను కట్టివేయడం/బంధించడం’ అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: לְתִתְּךָ בְּיַד פְּלִשְׁתִּים
  choice: ఫిలిష్తీయుల చేతికి అప్పగించడానికి
  rationale: ‘చేతిలో ఇవ్వడం’ అనే హీబ్రూ నుడికారంలోని అధికారానికి లేదా అదుపుకు అప్పగించే భావాన్ని నిలుపుతూ తెలుగులో సహజంగా ఉంది.
- source_word: פֶּן תִּפְגְּעוּן בִּי אַתֶּם
  choice: మీరే నాపై దాడి చేయబోమని
  rationale: פגע ఇక్కడ హాని చేయడానికి ఎదురుపడటం లేదా దాడి చేయడం అనే సందర్భార్థం కలిగి ఉంది; אַתֶּם ఇచ్చే వ్యత్యాస ఉద్ఘాటనను ‘మీరే’ నిలుపుతుంది.
theological_decisions:
- issue: సమ్సోను కోరిన ప్రమాణం యొక్క పరిధి
  choice: మీరే నాపై దాడి చేయబోమని
  alternative: మీరు నన్ను చంపబోమని
  rationale: మూలంలోని פגע సాధారణంగా ‘దాడి చేయు/హాని చేయు’ అనే విస్తృత భావాన్ని అనుమతిస్తుంది; దానిని కేవలం చంపడానికే పరిమితం చేయలేదు. అలాగే אַתֶּם లోని ‘మీరే’ అనే ఉద్ఘాటనను నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కథనానికి తగిన గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. హీబ్రూ నుడికారాన్ని పదేపదే అనుకరించకుండా దాని భావాన్ని ‘చేతికి అప్పగించడం’ ద్వారా నిలిపాం.
