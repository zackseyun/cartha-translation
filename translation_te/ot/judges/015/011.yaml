source:
  edition: WLC
  text: וַ/יֵּרְד֡וּ שְׁלֹשֶׁת֩ אֲלָפִ֨ים אִ֜ישׁ מִֽ/יהוּדָ֗ה אֶל סְעִיף֮ סֶ֣לַע עֵיטָם֒ וַ/יֹּאמְר֣וּ לְ/שִׁמְשׁ֗וֹן הֲ/לֹ֤א יָדַ֨עְתָּ֙ כִּֽי מֹשְׁלִ֥ים בָּ֨/נוּ֙ פְּלִשְׁתִּ֔ים וּ/מַה זֹּ֖את עָשִׂ֣יתָ לָּ֑/נוּ וַ/יֹּ֣אמֶר לָ/הֶ֔ם כַּ/אֲשֶׁר֙ עָ֣שׂוּ לִ֔/י כֵּ֖ן עָשִׂ֥יתִי לָ/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/015/011.yaml
  text: Then three thousand men of Judah went down to the cleft of the rock of Etam and said to Samson[a], “Do you not know that the Philistines are ruling over us? What then is this that you have done to us?” And he said to them, “As they did to me, so I have done to them.”
translation:
  language: te
  text: అప్పుడు యూదా వారిలో మూడువేల మంది పురుషులు ఏతాము రాతిబండలోని చీలికకు దిగివెళ్లి సమ్సోనుతో, “ఫిలిష్తీయులు మన మీద పరిపాలిస్తున్నారని నీకు తెలియదా? నువ్వు మాకు చేసిన ఈ పని ఏమిటి?” అన్నారు. అతడు వారితో, “వారు నాకు ఎలా చేశారో, నేనూ వారికి అలాగే చేశాను” అన్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּרְדוּ
  choice: దిగివచ్చి
  rationale: ירד అనే క్రియలోని కిందికి కదలికను నిలుపుతూ, సందర్భానికి సహజమైన తెలుగు కథన రూపాన్ని ఉపయోగించింది.
- source_word: שְׁלֹשֶׁת אֲלָפִים אִישׁ מִיהוּדָה
  choice: యూదా వంశస్థులలో మూడువేల మంది
  rationale: లెక్కించబడిన పురుషుల సమూహాన్ని సూచించే మూలార్థాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది; ‘యూదా’ ఇక్కడ ప్రాంతం లేదా గోత్రం అనే స్వల్ప సందిగ్ధత ఉన్నా, సందర్భంలో గోత్రసంబంధాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: אֶל סְעִיף סֶלַע עֵיטָם
  choice: ఏతాము బండ చీలిక దగ్గరికి
  rationale: סְעִיף యొక్క భౌగోళిక అర్థమైన చీలిక లేదా పగులును ‘బండ చీలిక’గా, עֵיטָם అనే స్థలనామాన్ని ‘ఏతాము’గా అందించింది.
- source_word: הֲלֹא יָדַעְתָּ
  choice: నీకు తెలియదా?
  rationale: ప్రతికూల ప్రశ్నలోని అలంకారిక, మందలింపు ధోరణిని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: כִּי מֹשְׁלִים בָּנוּ פְּלִשְׁתִּים
  choice: ఫిలిష్తీయులు మన మీద పరిపాలిస్తున్నారని
  rationale: మూలంలోని వర్తమాన కృదంతం తెలిపే కొనసాగుతున్న ఆధిపత్యాన్ని ‘పరిపాలిస్తున్నారు’ అనే రూపం కాపాడుతుంది.
- source_word: וּמַה זֹּאת עָשִׂיתָ לָּנוּ
  choice: నువ్వు మాకు చేసిన ఈ పని ఏమిటి?
  rationale: ‘మాకు’ అనే దత్తివాన్ని నిలిపి, సమ్సోను చర్యవల్ల తమపై పరిణామాలు వచ్చాయని యూదావారి ఫిర్యాదును వ్యాఖ్యానించకుండా తెలియజేస్తుంది.
- source_word: כַּאֲשֶׁר עָשׂוּ לִי כֵּן עָשִׂיתִי לָהֶם
  choice: వారు నాకు ఎలా చేశారో, నేనూ వారికి అలాగే చేశాను
  rationale: మూలంలోని ‘ఎలా—అలాగే’ పరస్పర నిర్మాణాన్ని, ప్రతీకారానికి సంబంధించిన సమ్సోను సంక్షిప్త వివరణను నిలుపుతుంది.
theological_decisions:
- issue: సమ్సోను సమాధానంలో ప్రతీకార పరస్పరత్వపు ధోరణి
  choice: “వారు నాకు ఎలా చేశారో, నేనూ వారికి అలాగే చేశాను” అని నైతిక వ్యాఖ్య లేకుండా సూటిగా అందించడం
  alternative: దీనిని న్యాయసమ్మతమైన ప్రతీకారంగా లేదా తప్పైన వ్యక్తిగత పగగా స్పష్టంగా వ్యాఖ్యానించడం
  rationale: ఈ వాక్యం సమ్సోను చెప్పిన కారణాన్ని నివేదిస్తుంది గాని దానిపై ప్రత్యక్ష నైతిక తీర్పు ఇవ్వదు. అందువల్ల మూలంలోని వేదాంతపరమైన ఉద్రిక్తతను అలాగే ఉంచింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన కథన శైలి పాటించబడింది. సంభాషణలో సహజత్వం కోసం ‘నీకు/నువ్వు’ వాడినా, భాషను మరీ వ్యావహారికంగా చేయలేదు. ఈ ముసాయిదాలో పాదటిప్పణులు అవసరం కాలేదు.
