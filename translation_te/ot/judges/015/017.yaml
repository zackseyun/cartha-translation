  text: And when he had finished speaking[a], he threw the jawbone from his hand, and he called that place Ramath-lehi.
translation:
  language: te
  text: అతడు మాట్లాడడం ముగించినప్పుడు, తన చేతినుండి దవడ ఎముకను విసిరేశాడు; ఆ ప్రదేశానికి రామత్-లెహీ[a] అని పేరు పెట్టాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “రామత్-లెహీ” అంటే “దవడ ఎముక ఎత్తు” లేదా “దవడ ఎముక కొండ” అని అర్థం. హీబ్రూలో లెహీ అంటే “దవడ ఎముక”; ఈ పేరు ఆ పదంతో పదప్రయోగం చేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּכַלֹּתוֹ לְדַבֵּר
  choice: మాట్లాడడం ముగించినప్పుడు
  rationale: כְּ అనే కాలసూచక ఉపసర్గతో కూడిన כלה క్రియారూపం, దానికి అనుసంధానమైన לְדַבֵּר కలిసి ‘మాట్లాడడం ముగించినప్పుడు’ అనే సహజమైన కాలార్థాన్ని ఇస్తాయి.
- source_word: וַיַּשְׁלֵךְ
  choice: విసిరివేసి
  rationale: చేతిలో ఉన్న వస్తువును పారవేయడాన్ని సూచించే క్రియను ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది; మూలంలో లేని అతిశయమైన బలప్రయోగాన్ని చేర్చదు.
- source_word: הַלְּחִי
  choice: దవడ ఎముకను
  rationale: ముందటి సందర్భంలో ఇది సమ్సోను ఆయుధంగా ఉపయోగించిన గాడిద దవడ ఎముకను సూచిస్తుంది; ‘దవడ’ కంటే ‘దవడ ఎముక’ సందర్భాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: מִיָּדוֹ
  choice: తన చేతిలోని
  rationale: ‘అతని చేతిలోనుండి’ అనే మూలభావాన్ని సహజమైన తెలుగు వాక్యనిర్మాణంలో వ్యక్తం చేస్తుంది.
- source_word: וַיִּקְרָא לַמָּקוֹם הַהוּא
  choice: ఆ ప్రదేశానికి … అని పేరు పెట్టాడు
  rationale: స్థలానికి పేరు పెట్టే సందర్భంలో קרא క్రియకు ఇది సహజమైన తెలుగు సమానార్థకం; పదక్షరంగా ‘పిలిచాడు’ అనడం తెలుగులో అసహజంగా ఉంటుంది.
- source_word: רָמַת לֶחִי
  choice: రామత్-లెహీ
  rationale: స్థలనామాన్ని ప్రధాన పాఠ్యంలో లిప్యంతరీకరించి, ‘లెహీ’ అనే పదం ‘దవడ ఎముక’తో చేసే పదప్రయోగాన్ని పాదసూచికలో నిలుపుతుంది.
