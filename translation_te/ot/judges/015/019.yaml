  to: అప్పుడు దేవుడు లేహీలో ఉన్న పల్లాన్ని[a] చీల్చాడు; దానిలోనుంచి నీరు వెలువడింది. అతడు తాగినప్పుడు అతని ప్రాణశక్తి తిరిగివచ్చి, అతడు తేరుకున్నాడు. అందుచేత అతడు దానికి ఏన్-హక్కోరే[b] అని పేరు పెట్టాడు. అది నేటివరకు లేహీలో ఉంది.
