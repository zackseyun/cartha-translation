  source_fidelity: 'ప్రధాన భావం హీబ్రూ మూలానికి నమ్మకంగా ఉంది: దేవుడు లేహీలోని గుంటను చీల్చడం, నీరు వెలువడడం, సమ్సోను శక్తి పునరుద్ధరించబడడం, ఊటకు ఏన్-హక్కోరే అని పేరు పెట్టడం, అది లేహీలో ఉండడం అన్నీ సరిగా ప్రతిఫలించాయి. అయితే הַמַּכְתֵּשׁకు ‘పల్లపు స్థలం’ కంటే ‘పల్లం’ మరింత నిర్దిష్టం; నీరు ‘బయలుదేరాయి’ కంటే ‘వెలువడింది’ సహజం. ప్రత్యామ్నాయ పాదసూచికను పాఠభేదంగా కాక సందర్భానికి సంబంధించిన మరో వ్యాఖ్యానంగా పేర్కొనాలి.'
