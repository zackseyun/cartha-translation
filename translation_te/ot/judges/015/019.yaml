  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּבְקַ֨ע אֱלֹהִ֜ים אֶת הַ/מַּכְתֵּ֣שׁ אֲשֶׁר בַּ/לֶּ֗חִי וַ/יֵּצְא֨וּ מִמֶּ֤/נּוּ מַ֨יִם֙ וַ/יֵּ֔שְׁתְּ וַ/תָּ֥שָׁב רוּח֖/וֹ וַ/יֶּ֑חִי עַל כֵּ֣ן קָרָ֣א שְׁמָ֗/הּ עֵ֤ין הַקּוֹרֵא֙ אֲשֶׁ֣ר בַּ/לֶּ֔חִי עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/015/019.yaml
  text: Then God split open the hollow place that is at Lehi[a], and water came out from it. When he drank, his spirit returned and he revived. Therefore he called its name En-hakkore[b], which is at Lehi to this day.
translation:
  language: te
  text: అప్పుడు దేవుడు లేహీలో ఉన్న పల్లాన్ని[a] చీల్చాడు; దానిలోనుంచి నీరు వెలువడింది. అతడు తాగినప్పుడు అతని ప్రాణశక్తి తిరిగివచ్చి, అతడు తేరుకున్నాడు. అందుచేత అతడు దానికి ఏన్-హక్కోరే[b] అని పేరు పెట్టాడు. అది నేటివరకు లేహీలో ఉంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఈ సందర్భాన్ని మరో విధంగా అర్థం చేసుకుంటే, “దేవుడు దవడ ఎముకలోని పల్లాన్ని చీల్చాడు; దానిలోనుంచి నీరు వెలువడింది” అని కూడా అనవచ్చు.
    reason: alternative_reading
  - marker: b
    text: “ఏన్-హక్కోరే” అంటే బహుశా “పిలిచినవాని ఊట” లేదా “మొరపెట్టినవాని ఊట.” ఇది సమ్సోను దేవునికి మొరపెట్టడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבְקַע
  choice: చీల్చాడు
  rationale: బలంగా చీల్చి తెరవడాన్ని సూచించే క్రియకు సహజమైన, స్పష్టమైన తెలుగు రూపం.
- source_word: אֱלֹהִים
  choice: దేవుడు
  rationale: ఈ కథనంలో నేరుగా కార్యం చేస్తున్న ఇశ్రాయేలు దేవుణ్ణి సూచిస్తుంది; ఆధునిక ప్రామాణిక తెలుగులో సహజమైన అనువాదం.
- source_word: הַמַּכְתֵּשׁ
  choice: పల్లపు స్థలం
  rationale: సాధారణంగా ‘రోలు/మోర్టారు’ అనే అర్థం ఉన్నా, ఇక్కడ నీరు వెలువడే గుంటలాంటి భౌగోళిక పల్లాన్ని సూచించడం సందర్భానికి తగినది.
- source_word: בַּלֶּחִי
  choice: లేహీలో
  rationale: కథనంలో ‘లేహీ’ ప్రదేశనామంగా పనిచేస్తుంది. మూలపదానికి ‘దవడ ఎముక’ అనే అర్థమున్నప్పటికీ, చివరి వాక్యభాగం భౌగోళిక అర్థానికి బలమిస్తుంది.
- source_word: וַיֵּצְאוּ מִמֶּנּוּ מַיִם
  choice: దానిలోనుంచి నీళ్లు బయలుదేరాయి
  rationale: హీబ్రూ క్రియాక్రమాన్ని కాపాడుతూ తెలుగులో సహజంగా నీరు వెలువడిన కార్యాన్ని తెలియజేస్తుంది.
- source_word: וַיֵּשְׁתְּ
  choice: అతడు తాగినప్పుడు
  rationale: తాగడం, తిరిగి ప్రాణశక్తి పొందడం మధ్యనున్న కాలసంబంధాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וַתָּשָׁב רוּחוֹ
  choice: అతని ప్రాణశక్తి తిరిగివచ్చి
  rationale: רוּחַ ఇక్కడ ఊపిరి, ఆత్మ, జీవశక్తి అనే భావపరిధిని కలిగి ఉంది. ‘ప్రాణశక్తి’ పునరుజ్జీవాన్ని తెలియజేస్తూ, కేవలం శారీరక ఊపిరికే లేదా ప్రత్యేకమైన ఆత్మసంబంధ సిద్ధాంతానికే అర్థాన్ని పరిమితం చేయదు.
- source_word: וַיֶּחִי
  choice: అతడు తేరుకున్నాడు
  rationale: మరణం నుంచి పునరుత్థానం కాకుండా, కుప్పకూలే స్థితి నుంచి మళ్లీ సజీవ బలాన్ని పొందడాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: קָרָא שְׁמָהּ
  choice: దానికి ... అని పేరు పెట్టాడు
  rationale: హీబ్రూ నామకరణ సూత్రాన్ని సహజమైన తెలుగు వాక్యనిర్మాణంలో అందిస్తుంది.
- source_word: עֵין הַקּוֹרֵא
  choice: ఏన్-హక్కోరే
  rationale: ప్రదేశనామాన్ని ప్రధాన పాఠ్యంలో లిప్యంతరీకరించి, కథనానికి ముఖ్యమైన దాని అర్థాన్ని పాదసూచికలో ఇస్తుంది.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: నేటివరకు
  rationale: హీబ్రూ కాలసూత్రానికి సంక్షిప్తమైన, సహజమైన తెలుగు సమానార్థకం.
theological_decisions:
- issue: בַּלֶּחִי సూచించే స్థలం మరియు నీటి మూలం
  choice: ప్రధాన పాఠ్యంలో ‘లేహీ’ని ప్రదేశనామంగా తీసుకొని, దేవుడు అక్కడి పల్లపు స్థలాన్ని చీల్చాడని అనువదించడం.
  alternative: దేవుడు దవడ ఎముకలోని పల్లాన్ని చీల్చగా దానిలోనుంచి నీరు వచ్చిందని అర్థం చేసుకోవడం.
  rationale: ఈ కథనంలో ‘లేహీ’ పదం పదేపదే ప్రదేశనామంగా వస్తుంది; ‘నేటివరకు లేహీలో ఉంది’ అనే ముగింపు కూడా భౌగోళిక పఠనానికి బలమిస్తుంది. అయినా ‘లేహీ’కి ‘దవడ ఎముక’ అనే పదార్థం ఉన్నందున ప్రత్యామ్నాయ దృశ్యీకరణను పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనా సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే శైలి వాడబడింది. కథన క్రమం సంక్షిప్తంగా ఉంచబడింది; స్థలపేరు లిప్యంతరీకరించబడింది; మూలంలోని భౌగోళిక/దవడ ఎముక సందిగ్ధత పాదసూచికలో భద్రపరచబడింది.
