  terminology: ‘లేహీ,’ ‘ఏన్-హక్కోరే,’ ‘దేవుడు’ సరైన రూపాలు. ‘ప్రాణశక్తి తిరిగివచ్చి’ רוּחוֹ యొక్క జీవశక్తి/ప్రాణవాయువు భావపరిధిని సిద్ధాంతపరంగా కుదించకుండా తగినంతగా తెలియజేస్తుంది; దాన్ని ఉంచవచ్చు. పేరుకు అర్థం తెలిపే పాదసూచిక సరైన స్థానంలో ఉంది.
