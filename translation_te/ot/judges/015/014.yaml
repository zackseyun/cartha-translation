id: JDG.15.14
reference: Judges 15:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: הוּא בָ֣א עַד לֶ֔חִי וּ/פִלְשִׁתִּ֖ים הֵרִ֣יעוּ לִ/קְרָאת֑/וֹ וַ/תִּצְלַ֨ח עָלָ֜י/ו ר֣וּחַ יְהוָ֗ה וַ/תִּהְיֶ֨ינָה הָ/עֲבֹתִ֜ים אֲשֶׁ֣ר עַל זְרוֹעוֹתָ֗י/ו כַּ/פִּשְׁתִּים֙ אֲשֶׁ֣ר בָּעֲר֣וּ בָ/אֵ֔שׁ וַ/יִּמַּ֥סּוּ אֱסוּרָ֖י/ו מֵ/עַ֥ל יָדָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/015/014.yaml
  text: When he came as far as Lehi[a], the Philistines shouted as they came to meet him. Then the Spirit of Yahweh rushed upon him, and the ropes that were on his arms became like flax that has been burned in the fire, and his bonds melted off his hands.
translation:
  language: te
  text: అతడు లెహీ[a] దగ్గరికి రాగానే, ఫిలిష్తీయులు అతనిని ఎదుర్కొనేందుకు కేకలు వేస్తూ వచ్చారు. అప్పుడు యాహ్వే ఆత్మ అతనిపై బలంగా దూసుకొచ్చింది. అతని బాహువులపై ఉన్న తాళ్లు అగ్నిలో కాలిన అవిసె నారలా అయ్యాయి; అతని బంధాలు అతని చేతుల మీదనుండి కరిగిపోయాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లెహీ ఒక స్థల నామం. ఈ హీబ్రూ పదానికి ‘దవడ ఎముక’ అనే అర్థంతోనూ సంబంధం ఉంది; పరిసర కథనంలో ఆ భావం ముఖ్యమైనది.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶחִי
  choice: లెహీ
  rationale: సందర్భంలో ఇది స్థల నామంగా పనిచేస్తుంది. ‘దవడ ఎముక’ అనే మూలార్థం పరిసర కథనంలో ప్రాధాన్యమైనందున పాదసూచికలో తెలిపాం.
- source_word: הֵרִיעוּ לִקְרָאתוֹ
  choice: అతనిని ఎదుర్కొనేందుకు కేకలు వేస్తూ వచ్చారు
  rationale: క్రియలోని పెద్ద కేక లేదా సమర ఘోష భావాన్ని, అలాగే అతనిని ఎదుర్కొనే కదలికను సహజమైన తెలుగులో నిలుపుతుంది; ‘యుద్ధ నినాదం’ అని అతిగా నిర్దిష్టం చేయదు.
- source_word: וַתִּצְלַח עָלָיו רוּחַ יְהוָה
  choice: యెహోవా ఆత్మ అతనిపై బలంగా దూసుకొచ్చింది
  rationale: צלח అనే క్రియ సూచించే ఆకస్మికమైన, శక్తిమంతమైన ఆవరింపును ‘బలంగా దూసుకొచ్చింది’ స్పష్టంగా, సజీవంగా వ్యక్తం చేస్తుంది.
- source_word: הָעֲבֹתִים
  choice: తాళ్లు
  rationale: ఇక్కడ బంధించడానికి ఉపయోగించిన దృఢమైన తాళ్లను సూచిస్తుంది; ఆధునిక తెలుగులో సహజమైన పదం.
- source_word: זְרוֹעוֹתָיו
  choice: చేతులు
  rationale: זְרוֹעַ చేయి లేదా బాహువును సూచించగలదు. శరీర భాగాన్ని అనవసరంగా మరింత నిర్దిష్టం చేయకుండా సందర్భానికి సహజంగా ‘చేతులు’ అని అనువదించాం.
- source_word: כַּפִּשְׁתִּים
  choice: అవిసె నారలా
  rationale: פִשְׁתִּים అనేది flax మొక్క లేదా దాని నారను సూచిస్తుంది. తాళ్లు అగ్నిలో బలహీనపడే పోలికను తెలుగులో స్పష్టంచేయడానికి ‘అవిసె నార’ ఎంచుకున్నాం.
- source_word: אֲשֶׁר בָּעֲרוּ בָאֵשׁ
  choice: అగ్నిలో కాలిన
  rationale: అగ్ని ప్రభావంతో నార పూర్తిగా బలహీనపడిన స్థితిని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: וַיִּמַּסּוּ
  choice: కరిగిపోయాయి
  rationale: מסס లోని కరగడం లేదా విచ్ఛిన్నమవడం అనే రూపక బలాన్ని నిలుపుతుంది; కేవలం జారిపోయాయని అర్థాన్ని తగ్గించదు.
- source_word: אֱסוּרָיו
  choice: అతని బంధాలు
  rationale: అతనిని కట్టివేసిన వాటిని విస్తృతంగా సూచిస్తుంది; లోహ సంకెళ్లు అని అనవసరంగా భావింపజేయదు.
- source_word: מֵעַל יָדָיו
  choice: అతని చేతుల మీద నుంచి
  rationale: హీబ్రూ పదబంధంలోని ‘చేతులపై నుంచి’ అనే స్థానిక భావాన్ని సహజమైన తెలుగులో కాపాడుతుంది; ‘మణికట్టులు’ అని పాఠానికి మించిన నిర్దిష్టతను చేర్చదు.
theological_decisions:
- issue: దైవ నామమైన יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: హీబ్రూ పాఠంలో ఉన్న ప్రత్యేక దైవ నామాన్ని బిరుదుతో భర్తీ చేయకుండా పేరుగానే ఉంచాం. ఆధునిక తెలుగు బైబిల్ వాడుకలో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం; మూల ఉచ్చారణను సూచించేందుకు ‘యాహ్వే’ కూడా సాధ్యమైన రూపం.
- issue: సమ్సోనుపై దైవిక శక్తి ఆవరించడం
  choice: యెహోవా ఆత్మ అతనిపై బలంగా దూసుకొచ్చింది
  alternative: యెహోవా ఆత్మ అతనిపై మహా బలంతో వచ్చింది
  rationale: కథనంలో కనిపించే ఆకస్మికమైన దైవిక శక్తినివ్వడాన్ని నిలుపుతూ, తరువాతి కాలపు ప్రత్యేక సిద్ధాంత భావనలను పాఠంలోకి చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. మూలంలోని కేక, ఆత్మ ఆకస్మికంగా బలంతో రావడం, తాళ్లు నారలా బలహీనపడడం, బంధాలు కరిగిపోవడం అనే సజీవ చిత్రాలను నిలిపాం.
