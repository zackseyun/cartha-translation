source:
  edition: WLC
  text: וַ/יְהִ֨י מִ/יָּמִ֜ים בִּ/ימֵ֣י קְצִיר חִטִּ֗ים וַ/יִּפְקֹ֨ד שִׁמְשׁ֤וֹן אֶת אִשְׁתּ/וֹ֙ בִּ/גְדִ֣י עִזִּ֔ים וַ/יֹּ֕אמֶר אָבֹ֥אָה אֶל אִשְׁתִּ֖/י הֶ/חָ֑דְרָ/ה וְ/לֹֽא נְתָנ֥/וֹ אָבִ֖י/הָ לָ/בֽוֹא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/015/001.yaml
  text: And after some days[a], in the days of the wheat harvest, Samson visited his wife with a young goat. He said, “Let me go in to my wife, into the inner room.” But her father would not allow him to go in.
translation:
  language: te
  text: కొన్ని రోజుల తర్వాత, గోధుమ కోతకాలంలో, సమ్సోను ఒక మేకపిల్లను తీసుకొని తన భార్యను చూడడానికి వెళ్లాడు. అతడు, “నా భార్య దగ్గరకు, లోపలి గదిలోకి నన్ను వెళ్లనివ్వండి[a]” అన్నాడు. అయితే ఆమె తండ్రి అతణ్ణి లోపలికి వెళ్లనివ్వలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నా భార్య దగ్గరకు, గదిలోకి నన్ను వెళ్లనివ్వండి.” ఇక్కడి హీబ్రూ పదం గదిని, బహుశా లోపలి గదిని సూచిస్తుంది; సందర్భంలో ఇది దంపతుల వ్యక్తిగత గదిని సూచిస్తున్నట్లు ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי מִיָּמִים
  choice: కొన్ని రోజుల తర్వాత
  rationale: ఈ హీబ్రూ నుడికారం కథలో కొంత కాలం గడిచిందని సూచిస్తుంది. ఆధునిక తెలుగులో సహజంగా ఉండేలా కాలసూచనను స్పష్టంగా ఉంచింది.
- source_word: בִּימֵי קְצִיר חִטִּים
  choice: గోధుమ కోతకాలంలో
  rationale: గోధుమల కోత అనే నిర్దిష్ట ఋతుసూచనను సంక్షిప్తమైన, సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: וַיִּפְקֹד
  choice: చూడడానికి వెళ్లాడు
  rationale: ఈ సందర్భంలో פקד అంటే సమకూర్చడం లేదా శిక్షించడం కాదు, ఒకరిని సందర్శించడం. తెలుగులో ‘చూడడానికి వెళ్లాడు’ సాధారణ పాఠకులకు సహజంగా ఉంటుంది.
- source_word: אֶת אִשְׁתּוֹ
  choice: తన భార్యను
  rationale: సంబంధంలో ఉద్రిక్తత ఉన్నప్పటికీ మూలపాఠం ఆమెను అతని భార్యగానే పేర్కొంటుంది.
- source_word: בִּגְדִי עִזִּים
  choice: ఒక మేకపిల్లను తీసుకొని
  rationale: సమ్సోను తీసుకువచ్చిన వస్తువును స్పష్టంగా చూపిస్తుంది; ‘మేకపిల్ల’ ఆధునిక తెలుగులో సులభంగా అర్థమవుతుంది.
- source_word: אָבֹאָה אֶל אִשְׁתִּי
  choice: నా భార్య దగ్గరికి ... వెళ్లనివ్వండి
  rationale: కోహోర్టేటివ్ భావాన్ని అభ్యర్థనగా వ్యక్తం చేస్తూ, భార్య వద్దకు ప్రవేశించాలనే మాటలోని దాంపత్య అంతరార్థాన్ని అతిగా విప్పకుండా నిలుపుతుంది.
- source_word: הֶחָדְרָה
  choice: లోపలి గదిలోకి
  rationale: దిశాసూచక రూపంతో ఉన్న חֶדֶר గది లేదా అంతర్గది వైపు ప్రవేశాన్ని సూచిస్తుంది. ‘పడకగది’ అని మూలం కంటే ఎక్కువగా నిర్దిష్టం చేయకుండా స్థలార్థాన్ని కాపాడుతుంది.
- source_word: וְלֹא נְתָנוֹ אָבִיהָ לָבוֹא
  choice: అయితే ఆమె తండ్రి అతణ్ణి లోపలికి వెళ్లనివ్వలేదు
  rationale: తండ్రి ప్రవేశాన్ని చురుకుగా నిరాకరించిన భావాన్ని, సమ్సోను పలికిన ‘వెళ్లనివ్వండి’ అనే పదబంధంతో అనుసంధానించి తెలుపుతుంది.
theological_decisions:
- issue: ‘భార్య దగ్గరికి వెళ్లడం’లోని దాంపత్య/లైంగిక అంతరార్థం
  choice: నుడికారాన్ని పాఠ్యంలో పరోక్షంగానే ఉంచి, పాదసూచికలో సందర్భార్థాన్ని తెలిపింది
  alternative: ‘ఆమెతో దాంపత్య సంబంధం పెట్టుకోవడానికి’ అని స్పష్టీకరించడం
  rationale: హీబ్రూ పాఠ్యం గదిలోకి భార్య వద్దకు వెళ్లడమని చెబుతూ అంతరార్థాన్ని పరోక్షంగా ఉంచుతుంది. అనువాదం ఆ ఉద్రిక్తతను అతిగా వ్యాఖ్యానించకుండా కాపాడాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన కథనశైలిని ఉపయోగించాం. ‘సమ్సోను,’ ‘గోధుమ కోతకాలం,’ ‘మేకపిల్ల’ వంటి సాధారణ పదాలతో గౌరవప్రదమైన బైబిలు శైలిని నిలిపాం; మూలంలోని పరోక్ష దాంపత్య భావాన్ని బహిరంగంగా మార్చలేదు.
