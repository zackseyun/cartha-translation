  terminology: ‘సహచరుడు’ appropriately retains the broad sense of מֵרֵעַ without deciding that the man held a formal wedding role. ‘చెల్లెలు’ naturally expresses ‘younger sister,’ and ‘మంచిది’ properly preserves the broad comparison of טוֹבָה.
