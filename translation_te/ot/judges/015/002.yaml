  text: וַ/יֹּ֣אמֶר אָבִ֗י/הָ אָמֹ֤ר אָמַ֨רְתִּי֙ כִּי שָׂנֹ֣א שְׂנֵאתָ֔/הּ וָ/אֶתְּנֶ֖/נָּה לְ/מֵרֵעֶ֑/ךָ הֲ/לֹ֨א אֲחֹתָ֤/הּ הַ/קְּטַנָּה֙ טוֹבָ֣ה מִמֶּ֔/נָּה תְּהִי נָ֥א לְ/ךָ֖ תַּחְתֶּֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/015/002.yaml
  text: And her father said[a], “I really thought that you utterly hated her, so I gave her to your companion. Is not her younger sister better than she? Please let her be yours instead of her.”
translation:
  language: te
  text: అప్పుడు ఆమె తండ్రి, “నువ్వు ఆమెను పూర్తిగా ద్వేషించావని నేను నిజంగానే అనుకున్నాను. అందుకే ఆమెను నీ సహచరునికి ఇచ్చాను.[a] ఆమె చెల్లెలు ఆమెకంటే మంచిది కాదా? దయచేసి ఆమెకు బదులుగా ఆమె చెల్లెలు నీదానిగా ఉండనివ్వు” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నీ స్నేహితునికి.” హీబ్రూ పదం సాధారణంగా స్నేహితుడు, సహచరుడు లేదా పరిచయస్థుణ్ణి సూచించవచ్చు. ఈ వివాహ సందర్భంలో కొందరు దీనిని పెళ్లిలో సమ్సోనుకు తోడుగా ఉన్న వ్యక్తిగా అర్థం చేసుకుంటారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָבִיהָ
  choice: ఆమె తండ్రి
  rationale: మూడవ పురుష ఏకవచన స్త్రీలింగ ప్రత్యయం సందర్భంలోని స్త్రీని సూచిస్తుంది; తెలుగులో స్వామ్యాన్ని స్పష్టంగా చెప్పడం సహజం.
- source_word: אָמֹר אָמַרְתִּי
  choice: నేను నిజంగానే అనుకున్నాను
  rationale: క్రియానామ అవ్యయం మరియు సంపూర్ణ క్రియ కలయిక ఉద్ఘాటనను ఇస్తుంది; ఈ పదబంధం ఆ బలాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: שָׂנֹא שְׂנֵאתָהּ
  choice: నువ్వు ఆమెను పూర్తిగా ద్వేషించావని
  rationale: హీబ్రూ ఉద్ఘాటనాత్మక నిర్మాణాన్ని ‘పూర్తిగా’ ద్వారా వ్యక్తం చేసి, సాధారణ ‘ద్వేషించావు’ కంటే దాని తీవ్రతను నిలిపింది.
- source_word: וָאֶתְּנֶנָּה
  choice: అందుకే ఆమెను ... ఇచ్చాను
  rationale: ఇక్కడ వావ్ కథనాన్ని ముందుకు నడిపిస్తూ తండ్రి ఊహకు పర్యవసానాన్ని తెలియజేస్తుంది; ‘అందుకే’ ఆ సంబంధాన్ని స్పష్టం చేస్తుంది.
- source_word: לְמֵרֵעֶךָ
  choice: నీ సహచరునికి
  rationale: మֵרֵעַ స్నేహితుడు, సహచరుడు లేదా సహవాసి అనే విస్తృత అర్థాన్ని కలిగి ఉంది; వివాహ సందర్భంలోని నిర్దిష్ట పాత్రను అనవసరంగా నిర్ణయించకుండా ‘సహచరుడు’ ఆ విస్తృతిని కాపాడుతుంది.
- source_word: הֲלֹא
  choice: కాదా?
  rationale: సమ్మతిని ఆశించే అలంకార ప్రశ్నను ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אֲחֹתָהּ הַקְּטַנָּה
  choice: ఆమె చెల్లెలు
  rationale: తోబుట్టువుల సందర్భంలో ‘చిన్నది’ అనే భావాన్ని తెలుగు సహజంగా ‘చెల్లెలు’తో వ్యక్తం చేస్తుంది.
- source_word: טוֹבָה מִמֶּנָּה
  choice: ఆమెకంటే మంచిది
  rationale: טוֹבָה సాధారణమైన శ్రేష్ఠతను సూచిస్తుంది; ‘అందమైనది’ అని పరిమితం చేయకుండా మూలంలోని విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: תְּהִי נָא לְךָ
  choice: దయచేసి ... ఈమెను నీదానిగా చేసుకో
  rationale: జస్సివ్ రూపం మరియు נָא కలిపి వినయపూర్వక అభ్యర్థనను వ్యక్తం చేస్తాయి; మూలంలో ప్రత్యక్షంగా లేని వివాహపదాన్ని చేర్చకుండా తెలుగులో సహజంగా చెప్పబడింది.
- source_word: תַּחְתֶּיהָ
  choice: ఆమెకు బదులుగా
  rationale: תַּחַת ఇక్కడ ప్రత్యామ్నాయాన్ని సూచిస్తుంది; ‘బదులుగా’ స్పష్టమైన సహజ సమానార్థకం.
