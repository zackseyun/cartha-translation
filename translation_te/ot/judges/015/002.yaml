translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన సంభాషణ శైలిని ఉపయోగించాం. హీబ్రూలోని రెండు ఉద్ఘాటనాత్మక నిర్మాణాలను ‘నిజంగానే,’ ‘పూర్తిగా’ ద్వారా నిలిపాం. ‘మంచిది’ అనే విస్తృత పోలికను కాపాడి, శారీరక ఆకర్షణ అనే నిర్దిష్ట భావాన్ని చేర్చలేదు.
