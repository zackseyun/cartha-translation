source:
  edition: WLC
  text: וַ/יֹּאמְר֣וּ פְלִשְׁתִּים֮ מִ֣י עָ֣שָׂה זֹאת֒ וַ/יֹּאמְר֗וּ שִׁמְשׁוֹן֙ חֲתַ֣ן הַ/תִּמְנִ֔י כִּ֚י לָקַ֣ח אֶת אִשְׁתּ֔/וֹ וַֽ/יִּתְּנָ֖/הּ לְ/מֵרֵעֵ֑/הוּ וַ/יַּעֲל֣וּ פְלִשְׁתִּ֔ים וַ/יִּשְׂרְפ֥וּ אוֹתָ֛/הּ וְ/אֶת אָבִ֖י/הָ בָּ/אֵֽשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/015/006.yaml
  text: Then the Philistines said[a], “Who did this?” And they said, “Samson, the Timnite’s son-in-law[b], because he took his wife and gave her to his companion.” So the Philistines went up and burned her and her father with fire.
translation:
  language: te
  text: అప్పుడు ఫిలిష్తీయులు, “ఇది చేసింది ఎవరు?” అన్నారు. వారు, “తిమ్నావాసి అల్లుడైన సమ్సోను. ఎందుకంటే ఆ తిమ్నావాసి సమ్సోను భార్యను తీసుకొని సమ్సోను సహచరునికి ఇచ్చాడు” అన్నారు. కాబట్టి ఫిలిష్తీయులు పైకి వెళ్లి ఆమెను, ఆమె తండ్రిని అగ్నితో కాల్చివేశారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פְלִשְׁתִּים
  choice: ఫిలిష్తీయులు
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన ప్రజానామం; సందర్భంలో తెలిసిన జనసమూహాన్ని సహజంగా సూచిస్తుంది.
- source_word: מִי עָשָׂה זֹאת
  choice: ఇది చేసింది ఎవరు?
  rationale: హీబ్రూ ప్రత్యక్ష ప్రశ్నను సరళమైన, సహజమైన ఆధునిక తెలుగు రూపంలో అందిస్తుంది.
- source_word: חֲתַן הַתִּמְנִי
  choice: తిమ్నావాసి అల్లుడైన సమ్సోను
  rationale: חָתָן పెళ్లికుమారుడు లేదా అల్లుడు అనే వివాహ బంధాన్ని సూచించగలదు. ఇక్కడ తిమ్నావాసి కుమార్తెతో సమ్సోనుకు ఉన్న సంబంధాన్ని బట్టి ‘అల్లుడు’ సందర్భానికి స్పష్టంగా సరిపోతుంది; ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: సమ్సోనే ఈ పని చేయడానికి గల కారణాన్ని పరిచయం చేస్తుంది; ఆధునిక తెలుగులో కారణ సంబంధాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: לָקַח אֶת אִשְׁתּוֹ
  choice: ఆ తిమ్నావాసి సమ్సోను భార్యను తీసుకొని
  rationale: హీబ్రూలో కర్త అంతర్లీనంగా, సర్వనామ సంబంధం సందర్భాధారంగా ఉంది. తెలుగులో ఎవరు ఎవరిని తీసుకున్నారో అయోమయం కలగకుండా సందర్భం సూచించే వ్యక్తులను స్పష్టంగా పేర్కొన్నాం.
- source_word: וַיִּתְּנָהּ לְמֵרֵעֵהוּ
  choice: అతని సహచరునికి ఇచ్చాడు
  rationale: מֵרֵעַ సాధారణంగా సహచరుడు లేదా స్నేహితుడు అని అర్థం; వివాహ సందర్భంలో ప్రత్యేక పాత్రను నిర్బంధంగా చేర్చకుండా ‘సహచరుడు’ మూలంలోని విస్తృతతను కాపాడుతుంది.
- source_word: וַיַּעֲלוּ
  choice: వెళ్లి
  rationale: హీబ్రూ కదలిక క్రియకు అక్షరార్థంగా ‘పైకి వెళ్లారు’ అనవచ్చు; తెలుగులో భౌగోళిక దిశ స్పష్టంగా లేని ఈ సందర్భంలో ‘వెళ్లి’ సహజమైన కథన రూపం.
- source_word: וַיִּשְׂרְפוּ אוֹתָהּ וְאֶת אָבִיהָ בָּאֵשׁ
  choice: ఆమెను, ఆమె తండ్రిని అగ్నితో కాల్చేశారు
  rationale: ‘అగ్నితో కాల్చారు’ అనే హీబ్రూ ఉద్ఘాటనను నిలుపుతుంది; మూలంలో ప్రత్యక్షంగా లేని ‘చంపారు’ అనే పదాన్ని చేర్చదు.
theological_decisions:
- issue: חָתָן అనే వివాహ సంబంధ పదంలోని అర్థ విస్తృతి
  choice: ప్రధాన వచనంలో ‘అల్లుడు’
  alternative: ‘పెళ్లికుమారుడు’
  rationale: సమ్సోను తిమ్నావాసి కుమార్తెకు భర్తగా ఉన్నందున తండ్రితో అతని సంబంధాన్ని ‘అల్లుడు’ స్పష్టంగా తెలియజేస్తుంది; అయినా మూలపదానికి ఉన్న మరో సాధ్యమైన భావాన్ని పాదటిప్పణిలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనా గౌరవప్రదమైన కథన శైలి వాడబడింది. అంతర్లీన హీబ్రూ కర్తలు, సర్వనామాల వల్ల తెలుగులో కలిగే అయోమయాన్ని నివారించేందుకు ‘ఆ తిమ్నావాసి’, ‘సమ్సోను భార్య’ అని సందర్భానుసారంగా స్పష్టం చేశాం. మూలంలోని వివాహపదం, ‘సహచరుడు/స్నేహితుడు’ అనే పదం కలిగిన నిజమైన అర్థ విస్తృతిని పాదటిప్పణుల్లో నిలిపాం.
