source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר שִׁמְשׁ֔וֹן בִּ/לְחִ֣י הַ/חֲמ֔וֹר חֲמ֖וֹר חֲמֹרָתָ֑יִם בִּ/לְחִ֣י הַ/חֲמ֔וֹר הִכֵּ֖יתִי אֶ֥לֶף אִֽישׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/015/016.yaml
  text: Then Samson said[a], “With the jawbone of a donkey, a heap, two heaps; with the jawbone of a donkey I have struck down a thousand men.”
translation:
  language: te
  text: 'అప్పుడు సమ్సోను ఇలా అన్నాడు[a]:


    “గాడిద దవడ ఎముకతో,


    కుప్ప, రెండు కుప్పలు!


    గాడిద దవడ ఎముకతో


    వెయ్యిమంది పురుషులను హతమార్చాను.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూలో పదచమత్కారం ఉంది: “గాడిద” అనే పదం, “కుప్పలు”గా అనువదించిన పదంతో ధ్వనిసామ్యం కలిగి ఉంది. “కుప్ప, రెండు కుప్పలు” అనే అనువాదం ఆ పదచమత్కారాన్ని సాధ్యమైనంత దగ్గరగా నిలుపుతుంది.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... ఇలా అన్నాడు
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది. ‘అప్పుడు’ సంఘటనల క్రమాన్ని సహజమైన తెలుగు కథనశైలిలో చూపుతుంది; తరువాతి కవితాత్మక పలుకును ‘ఇలా’ పరిచయం చేస్తుంది.
- source_word: שִׁמְשׁוֹן
  choice: సమ్సోను
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగులో స్థిరపడిన రూపాన్ని ఉపయోగించాం.
- source_word: בִּלְחִי הַחֲמוֹר
  choice: గాడిద దవడ ఎముకతో
  rationale: לְחִי ఇక్కడ ఆయుధంగా వాడిన దవడ ఎముకను సూచిస్తుంది; ב సాధనార్థకంగా ఉండటంతో ‘తో’ అని అనువదించాం.
- source_word: חֲמוֹר חֲמֹרָתָיִם
  choice: కుప్ప, రెండు కుప్పలు
  rationale: హీబ్రూ పదబంధంలోని ఏకవచన–ద్వివచన స్వరూపాన్ని దగ్గరగా నిలుపుతూ, ‘గాడిద’తో ఉన్న ధ్వన్యాత్మక పదచమత్కారాన్ని పాదసూచికలో వివరించాం. అర్థాన్ని పూర్తిగా ‘కుప్పల మీద కుప్పలు’గా సరిచేయకుండా మూలంలోని అసాధారణ కవితా రూపాన్ని కాపాడాం.
- source_word: הִכֵּיתִי
  choice: హతమార్చాను
  rationale: נכה ప్రాథమికంగా ‘కొట్టు’ అని అర్థమైనా, ఈ యుద్ధసందర్భంలో మరణానికి దారితీసిన దెబ్బను సూచిస్తుంది. ‘హతమార్చాను’ ఫలితాన్ని స్పష్టంగా, గంభీరంగా తెలియజేస్తుంది.
- source_word: אֶלֶף אִישׁ
  choice: వెయ్యిమంది పురుషులను
  rationale: אִישׁ ఇక్కడ సమూహార్థక ఏకవచనంగా యుద్ధంలో ఉన్న పురుషులను సూచిస్తుంది; అందువల్ల లింగసూచనను నిలిపాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలిని వాడాం. సమ్సోను పలికిన మాటల కవితాత్మక పాదవిభజనను నిలిపాం; మూలంలోని ఉద్దేశపూర్వక పదచమత్కారం తెలుగులో నేరుగా పునరుత్పత్తి కానందున పాదసూచిక ఇచ్చాం.
