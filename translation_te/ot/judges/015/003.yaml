id: JDG.15.3
reference: Judges 15:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר לָ/הֶם֙ שִׁמְשׁ֔וֹן נִקֵּ֥יתִי הַ/פַּ֖עַם מִ/פְּלִשְׁתִּ֑ים כִּֽי עֹשֶׂ֥ה אֲנִ֛י עִמָּ֖/ם רָעָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/015/003.yaml
  text: And Samson said to them[b][a], “This time I am blameless with respect to the Philistines when I do them harm.”
translation:
  language: te
  text: 'అప్పుడు సమ్సోను వారితో ఇలా అన్నాడు: “ఈసారి నేను ఫిలిష్తీయుల విషయంలో నిర్దోషిని; నేను వారికి కీడు చేసినప్పుడు.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... అన్నాడు
  rationale: హీబ్రూ వయ్యిక్టోల్ కథనాన్ని ముందుకు నడిపిస్తుంది; ఆధునిక తెలుగు కథనంలో ‘అప్పుడు’ సహజంగా ఆ ప్రవాహాన్ని తెలియజేస్తుంది.
- source_word: לָהֶם
  choice: వారితో
  rationale: లְ ఉపసర్గతో కూడిన మూడవ పురుష బహువచన ప్రత్యయం మాట చెప్పబడిన శ్రోతలను సూచిస్తుంది; తెలుగులో ‘వారితో ... అన్నాడు’ సహజమైన నిర్మాణం.
- source_word: שִׁמְשׁוֹן
  choice: సమ్సోను
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: נִקֵּיתִי
  choice: నిర్దోషిని
  rationale: నקה ఇక్కడ అపరాధం లేదా బాధ్యత నుంచి విముక్తుడననే సమ్సోను వాదనను సూచిస్తుంది; స్థితి/ఫలిత భావాన్ని ‘నిర్దోషిని’ సంక్షిప్తంగా అందిస్తుంది.
- source_word: הַפַּעַם
  choice: ఈసారి
  rationale: సంఘర్షణలో కొత్త దశను సూచించే కాలవాచక ప్రయోగానికి సహజమైన తెలుగు సమానం.
- source_word: מִפְּלִשְׁתִּים
  choice: ఫిలిష్తీయులకు సంబంధించి
  rationale: נקה తరువాత מִן వారినుంచి భౌతికంగా వేరుపడటాన్ని కాక, వారి విషయంలో అపరాధ బాధ్యత లేకపోవడాన్ని సూచిస్తుంది; ఈ సంబంధ భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: సమ్సోను తనను నిర్దోషిగా భావించడానికి తరువాతి మాటను ఆధారంగా లేదా వివరణగా చెబుతున్నాడు. హీబ్రూ כִּי యొక్క కారణార్థాన్ని ఇది నేరుగా నిలుపుతుంది; కాలార్థక పఠనం సాధ్యమైనందున పాదటిప్పణిలో సూచించబడింది.
- source_word: עֹשֶׂה אֲנִי
  choice: నేను ... చేయబోతున్నాను
  rationale: కృదంతంతో స్పష్టమైన సర్వనామం కొనసాగుతున్న లేదా సమీప భవిష్యత్ చర్యను సూచించగలదు; సందర్భంలో సమ్సోను తాను చేయనున్న ప్రతీకార చర్యను ప్రకటిస్తున్నాడు.
- source_word: עִמָּם
  choice: వారికి
  rationale: עשה עם అనే నిర్మాణం ఇక్కడ ‘వారికి/వారిపట్ల చేయడం’ అనే భావంలో ఉంది; తెలుగులో ‘వారికి కీడు చేయడం’ సహజం.
- source_word: רָעָה
  choice: కీడు
  rationale: రָעָה యొక్క ‘చెడు/హాని’ భావాలను నిలుపుతూ, ఈ సందర్భంలోని ఉద్దేశపూర్వక ప్రతికూల చర్యను ‘కీడు’ సహజంగా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: సమ్సోను నిర్దోషిత్వ వాదనను కథకుని నైతిక తీర్పుగా చూపాలా
  choice: దానిని సమ్సోను స్వయంగా చేసిన వాదనగానే ఉంచడం
  alternative: సమ్సోను చర్యను కథకుడు న్యాయమైనదిగా ధృవీకరించినట్లు అనువదించడం
  rationale: మూల వాక్యం ప్రత్యక్ష సంభాషణలో సమ్సోను మాటలను మాత్రమే ఇస్తుంది; అతని ప్రతీకారానికి దైవిక లేదా కథకుని నైతిక ఆమోదాన్ని జోడించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన కథన శైలి పాటించబడింది. ‘నిర్దోషిని’ న్యాయబాధ్యత భావాన్ని, ‘కీడు’ హీబ్రూ రָעָה లోని ప్రతికూలతను నిలుపుతాయి. మూలంలోని కారణార్థం/కాలార్థం మరియు కృదంతపు కాలసూచనలోని నిజమైన సందిగ్ధత పాదటిప్పణిలో భద్రపరచబడింది.
