  text: And he judged Israel in the days of the Philistines twenty years[a].
translation:
  language: te
  text: అతడు ఫిలిష్తీయుల కాలంలో ఇశ్రాయేలుకు ఇరవై సంవత్సరాలు న్యాయాధిపతిగా ఉన్నాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఇశ్రాయేలును ఇరవై సంవత్సరాలు నడిపించాడు’; హీబ్రూ క్రియ కేవలం న్యాయతీర్పులు చెప్పడమే కాకుండా, విస్తృతమైన నాయకత్వాన్ని కూడా సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁפֹּט
  choice: న్యాయాధిపతిగా ఉన్నాడు
  rationale: న్యాయాధిపతుల గ్రంథంలో שׁפט న్యాయతీర్పులు చెప్పడానికే పరిమితం కాకుండా, న్యాయాధిపతిగా నాయకత్వం వహించడాన్ని సూచిస్తుంది. ఈ అనువాదం గ్రంథంలోని పదప్రయోగ సంబంధాన్ని నిలుపుతూ ఆధునిక తెలుగులో సహజంగా ఉంటుంది.
- source_word: אֶת יִשְׂרָאֵל
  choice: ఇశ్రాయేలుకు
  rationale: మూలంలో ‘ఇశ్రాయేలు’ అనే సమూహనామమే ఉంది. ‘న్యాయాధిపతిగా ఉన్నాడు’ అనే తెలుగు నిర్మాణంతో చతుర్థీ విభక్తి సహజంగా సరిపోతుంది.
- source_word: בִּימֵי
  choice: కాలంలో
  rationale: అక్షరార్థమైన ‘దినాల్లో’ కన్నా, ఒక చారిత్రక కాలవ్యవధిని సూచించే సందర్భంలో ‘కాలంలో’ ఆధునిక తెలుగులో సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: פְלִשְׁתִּים
  choice: ఫిలిష్తీయుల
  rationale: ప్రజాసమూహ నామానికి ప్రామాణిక తెలుగు రూపాన్ని ఉపయోగించి, בִּימֵי తో ఉన్న సంబంధాన్ని షష్ఠీ విభక్తితో తెలిపింది.
- source_word: עֶשְׂרִים שָׁנָה
  choice: ఇరవై సంవత్సరాలు
  rationale: మూలంలోని కాలవ్యవధిని నేరుగా, సహజమైన తెలుగు సంఖ్యా రూపంలో అందిస్తుంది.
theological_decisions:
- issue: שׁפט అనే క్రియలో సమ్సోను పాత్ర భావం
  choice: ‘న్యాయాధిపతిగా ఉన్నాడు’ అని ఉంచడం
  alternative: ‘ఇశ్రాయేలును నడిపించాడు’ లేదా ‘పాలించాడు’
  rationale: ఈ పదం న్యాయాధిపతుల గ్రంథంలోని పునరావృతమైన పాత్రపదాన్ని సూచిస్తుంది. ‘పాలించాడు’ అనడం మూలంలో స్పష్టంగా లేని రాజకీయ అధికారాన్ని చేర్చవచ్చు; ‘నడిపించాడు’ అనడం గ్రంథంలోని న్యాయాధిపతి భావాన్ని మరుగుపరచవచ్చు. ప్రధాన పాఠం ఆ సంబంధాన్ని నిలుపుతుంది; పాదసూచిక విస్తృత నాయకత్వ భావాన్ని తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన వాక్యనిర్మాణం, అయితే న్యాయాధిపతుల గ్రంథంలోని కీలక పాత్రపదంతో సంబంధం నిలుపబడింది.
