source:
  edition: WLC
  text: וַ/יֹּ֧אמְרוּ ל֣/וֹ לֵ/אמֹ֗ר לֹ֚א כִּֽי אָסֹ֤ר נֶֽאֱסָרְ/ךָ֙ וּ/נְתַנּ֣וּ/ךָ בְ/יָדָ֔/ם וְ/הָמֵ֖ת לֹ֣א נְמִיתֶ֑/ךָ וַ/יַּאַסְרֻ֗/הוּ בִּ/שְׁנַ֨יִם֙ עֲבֹתִ֣ים חֲדָשִׁ֔ים וַֽ/יַּעֲל֖וּ/הוּ מִן הַ/סָּֽלַע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/015/013.yaml
  text: They said to him[a], “No, but we will surely bind you and hand you over into their hand[b]; yet we will certainly not put you to death.” So they bound him with two new ropes and brought him up from the rock.
translation:
  language: te
  text: వారు అతనితో, “లేదు, మేము నిన్ను గట్టిగా బంధించి వారి చేతికి[a] అప్పగిస్తాము; అయితే మేము నిన్ను చంపనే చంపము” అన్నారు. తరువాత వారు అతన్ని రెండు కొత్త తాళ్లతో బంధించి, ఆ బండచరియ[b] నుండి పైకి తీసుకొచ్చారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “వారి అధికారానికి.” హీబ్రూ నుడికారం అక్షరార్థంగా “నిన్ను వారి చేతిలోకి ఇవ్వడం.”
    reason: lexical_alternative
  - marker: b
    text: లేదా “బండ నుండి” లేదా “రాతి ఎత్తు నుండి.” హీబ్రూ పదం סלע ఒకే బండను మాత్రమే కాకుండా బండచరియను లేదా రాతి ఎత్తును కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא כִּי
  choice: లేదు, ... అయితే
  rationale: ముందుగా నిరాకరించి, తరువాత తాము చేయబోయేదాన్ని స్పష్టం చేసే హీబ్రూ నిర్మాణంలోని వ్యత్యాసాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: אָסֹר נֶאֱסָרְךָ
  choice: మేము నిన్ను గట్టిగా బంధించి
  rationale: క్రియతో కూడిన infinitive absolute ఇచ్చే బలాన్ని ‘గట్టిగా’ ద్వారా తెలియజేస్తూ, తెలుగులో సహజంగా ఉంచింది.
- source_word: וּנְתַנּוּךָ בְיָדָם
  choice: వారి చేతికి అప్పగిస్తాము
  rationale: ‘వారి చేతిలోకి ఇవ్వడం’ అనే హీబ్రూ అధికార-సూచక నుడికారాన్ని, తెలుగు నుడికారమైన ‘వారి చేతికి అప్పగించడం’తో నిలుపుతుంది.
- source_word: וְהָמֵת לֹא נְמִיתֶךָ
  choice: మేము నిన్ను చంపనే చంపము
  rationale: infinitive absolute మరియు నిషేధ క్రియ కలిగించే దృఢమైన హామీని తెలుగు పునరుక్తి సహజంగా వ్యక్తపరుస్తుంది.
- source_word: וַיַּאַסְרֻהוּ
  choice: వారు అతన్ని ... బంధించి
  rationale: ముందటి אסר మూలపదంతో పదసామ్యాన్ని కొనసాగిస్తుంది.
- source_word: בִּשְׁנַיִם עֲבֹתִים חֲדָשִׁים
  choice: రెండు కొత్త తాళ్లతో
  rationale: עֲבֹתִים సూచించే బలమైన తాళ్లు/మందమైన తాడులకు ‘తాళ్లు’ సాధారణ ఆధునిక తెలుగు పదం; కథనపరంగా ముఖ్యమైన ‘కొత్త’ను నిలుపుతుంది.
- source_word: וַיַּעֲלֻהוּ מִן הַסָּלַע
  choice: ఆ బండచరియ దగ్గరనుండి పైకి తీసుకొచ్చారు
  rationale: העלה యొక్క పైకి తీసుకురావడం అనే భావాన్ని నిలుపుతూ, סלעకు సందర్భానుకూలమైన రాతి ఎత్తు లేదా చరియ భావాన్ని వ్యక్తపరుస్తుంది; ‘దగ్గరనుండి’ తెలుగు స్థలవాచక ప్రయోగంలో సహజంగా ఉంటుంది.
