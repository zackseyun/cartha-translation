  source_fidelity: 'మొదటి వాక్యంలో హీబ్రూ భావం మొత్తంగా సరిగానే ఉంది: వారు సంసోనును బంధించి ఫిలిష్తీయులకు అప్పగిస్తామని, తాము అతనిని చంపబోమని గట్టిగా హామీ ఇస్తున్నారు. అయితే וַיַּעֲלֻהוּ מִן־הַסָּלַע అంటే ‘బండచరియ/రాతి ఎత్తు నుండి అతన్ని పైకి తీసుకువచ్చారు’; ముసాయిదాలోని ‘బండచరియ దగ్గరనుండి’ స్థలసంబంధాన్ని మారుస్తుంది.'
