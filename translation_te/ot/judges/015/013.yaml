translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. హీబ్రూలోని రెండు బలప్రయోగాలను వరుసగా ‘గట్టిగా’ మరియు ‘చంపనే చంపము’తో స్పష్టంగా చూపించాం. పాదసూచిక గుర్తులు ప్రధాన వచనంలో [a], [b]గా ఉంచబడ్డాయి.
