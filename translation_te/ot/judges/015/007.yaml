source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר לָ/הֶם֙ שִׁמְשׁ֔וֹן אִֽם תַּעֲשׂ֖וּ/ן כָּ/זֹ֑את כִּ֛י אִם נִקַּ֥מְתִּי בָ/כֶ֖ם וְ/אַחַ֥ר אֶחְדָּֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/015/007.yaml
  text: And Samson said to them, “If this is what you do, then I swear I will take vengeance on you, and after that I will stop.”
translation:
  language: te
  text: అప్పుడు సమ్సోను వారితో, “మీరు ఇలా చేస్తే, నేను తప్పకుండా మీపై ప్రతీకారం తీర్చుకుంటాను; ఆ తర్వాత ఆగుతాను” అన్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי אִם
  choice: తర్వాతే
  rationale: ఈ సందర్భంలో ఇది సమ్సోను ప్రతీకారం తీర్చుకునే వరకు ఆగనని బలంగా చెప్పే పరిమితి/నిశ్చయ భావాన్ని తెలియజేస్తుంది; తెలుగులో ‘తర్వాతే’ ఆ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: נִקַּמְתִּי בָכֶם
  choice: మీ మీద ప్రతీకారం తీర్చుకున్న
  rationale: נקם యొక్క ప్రతీకారార్థాన్ని, בכם సూచించే లక్ష్యాన్ని నేరుగా నిలుపుతుంది.
- source_word: וְאַחַר אֶחְדָּל
  choice: తర్వాతే నేను ఊరుకుంటాను
  rationale: חדל అంటే చేయడం మానడం/విరమించడం. ఈ బెదిరింపు సందర్భంలో ‘ఊరుకుంటాను’ సహజమైన ఆధునిక తెలుగు; ప్రతీకారం తర్వాత చర్యను ఆపుతాననే భావం నిలుస్తుంది.
theological_decisions:
- issue: כִּי אִם ను ప్రమాణ వాక్యంగా చూపాలా
  choice: ప్రత్యేకంగా ‘ఒట్టు’ లేదా ‘ప్రమాణం’ అనే పదాన్ని చేర్చలేదు; నిశ్చయాన్ని ‘తర్వాతే’ ద్వారా తెలిపాం.
  alternative: ‘నేను ప్రమాణం చేసి చెబుతున్నాను’ లేదా ‘నిశ్చయంగా’
  rationale: హీబ్రూ పాఠ్యంలో స్పష్టమైన ప్రమాణ క్రియ లేదు. כִּי אִם బలమైన నిశ్చయం లేదా ‘తప్ప/వరకు’ అనే పరిమితి భావాన్ని ఇవ్వగలదు; అందువల్ల ప్రమాణాన్ని స్పష్టీకరించి దిగుమతి చేయకుండా మూలంలోని ఉద్వేగాన్ని కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కథనానికి తగిన గంభీరతతో, సాధారణ పాఠకులకు సహజంగా ఉండే సంభాషణ. ‘సమ్సోను’ అనే తెలుగు బైబిలు సంప్రదాయ నామరూపాన్ని వాడాం.
