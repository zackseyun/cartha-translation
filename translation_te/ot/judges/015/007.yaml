revisions:
- from: అప్పుడు సమ్సోను వారితో, “మీరు ఇలా చేస్తే, మీ మీద ప్రతీకారం తీర్చుకున్న తర్వాతే నేను ఊరుకుంటాను” అన్నాడు.
  to: అప్పుడు సమ్సోను వారితో, “మీరు ఇలా చేస్తే, నేను తప్పకుండా మీపై ప్రతీకారం తీర్చుకుంటాను; ఆ తర్వాత ఆగుతాను” అన్నాడు.
