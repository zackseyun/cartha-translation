review_pass:
  verdict: revise
  source_fidelity: The draft correctly retains Samson, the addressed group, retaliation, and his ceasing afterward. However, rendering כִּי אִם solely as “తర్వాతే” obscures the clause’s emphatic assurance (“surely/indeed”) and makes the force chiefly temporal. The Hebrew presents both the assured vengeance and the subsequent cessation.
  naturalness: The draft is generally clear and idiomatic, but separating the vengeance and subsequent cessation into two clauses is more direct and natural than attaching “తర్వాతే” to the participial phrase.
  terminology: “ప్రతీకారం తీర్చుకోవడం” accurately conveys נִקַּמְתִּי בָכֶם. “ఆగుతాను” is a natural modern-standard rendering of אֶחְדָּל in this context. The established name form “సమ్సోను” is retained.
  issues:
  - severity: medium
    issue: The emphatic force of כִּי אִם is not represented clearly.
    rationale: In this idiom, כִּי אִם reinforces Samson’s determination to avenge himself; “తర్వాతే” chiefly expresses the later temporal clause and can imply that the source’s main emphasis is merely ‘not until.’ Adding “తప్పకుండా” preserves the assurance without importing an explicit oath.
  revised_text: అప్పుడు సమ్సోను వారితో, “మీరు ఇలా చేస్తే, నేను తప్పకుండా మీపై ప్రతీకారం తీర్చుకుంటాను; ఆ తర్వాత ఆగుతాను” అన్నాడు.
  revised_footnotes: []
  revision_rationale: The revision preserves the conditional wording, explicitly conveys the source’s emphatic determination without adding ‘I swear,’ and retains the sequence that Samson will cease only after taking vengeance.
