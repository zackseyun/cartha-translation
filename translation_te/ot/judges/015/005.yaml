  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథన శైలి. ‘నిలువ పంట,’ ‘ధాన్యపు కుప్పలు’ వంటి స్పష్టమైన వ్యవసాయ పదాలను వాడాం. ప్రధాన పాఠంలోని [a], [b] గుర్తులు సంబంధిత పాదటిప్పణులతో సరిపోలుతున్నాయి.
