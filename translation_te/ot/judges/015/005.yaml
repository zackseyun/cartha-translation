source:
  edition: WLC
  text: וַ/יַּבְעֶר אֵשׁ֙ בַּ/לַּפִּידִ֔ים וַ/יְשַׁלַּ֖ח בְּ/קָמ֣וֹת פְּלִשְׁתִּ֑ים וַ/יַּבְעֵ֛ר מִ/גָּדִ֥ישׁ וְ/עַד קָמָ֖ה וְ/עַד כֶּ֥רֶם זָֽיִת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/015/005.yaml
  text: He set fire to the torches and let them go into the standing grain of the Philistines[a], and burned up the shocks and the standing grain[b], and even the olive groves.
translation:
  language: te
  text: అతడు దివిటీలకు నిప్పంటించి, ఆ జంతువులను ఫిలిష్తీయుల నిలువ పంటలోకి వదిలాడు.[a] అతడు ధాన్యపు కుప్ప నుంచి నిలువ పంట వరకు, ఒలీవ తోట వరకు అన్నిటినీ తగులబెట్టాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కాగడాలు.”
    reason: lexical_alternative
  - marker: b
    text: 'హీబ్రూ: “ధాన్యపు కుప్ప నుంచి నిలువ పంట వరకు, ఒలీవ తోట వరకు.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּבְעֶר אֵשׁ בַּלַּפִּידִים
  choice: దివిటీలకు నిప్పంటించి
  rationale: హిఫిల్ రూపంలోని בער ఇక్కడ మంట పెట్టడాన్ని సూచిస్తుంది; אֵשׁ‌ను తెలుగులో సహజమైన ‘నిప్పంటించి’ అనే క్రియలో వ్యక్తం చేశాం. לַפִּידִים‌కు స్పష్టమైన ఆధునిక పదంగా ‘దివిటీలు’ ఎంచుకున్నాం.
- source_word: וַיְשַׁלַּח
  choice: వాటిని ... వదిలాడు
  rationale: ఈ క్రియకు ‘పంపాడు/వదిలిపెట్టాడు’ అనే భావం ఉంది. ముందు వచనంలోని జంతువులను సూచించే కర్మ హీబ్రూలో ఇక్కడ స్పష్టంగా లేకపోవడం వల్ల, ఈ వచనంలోని స్త్రీలింగ బహువచన సూచనకు సహజంగా ‘వాటిని’ వాడాం; అదనపు వివరాలు చేర్చలేదు.
- source_word: בְּקָמוֹת פְּלִשְׁתִּים
  choice: ఫిలిష్తీయుల నిలువ పంటలోకి
  rationale: קָמָה అంటే ఇంకా కోయని, పొలంలో నిలిచి ఉన్న ధాన్యపు పంట. ‘నిలువ పంట’ ఆ వ్యవసాయ ప్రత్యేకతను సంక్షిప్తంగా కాపాడుతుంది.
- source_word: וַיַּבְעֵר
  choice: కాలిపోయాయి
  rationale: రెండవ בער అగ్ని వ్యాపించి పంటను దహనం చేసిన ఫలితాన్ని తెలుపుతుంది. హీబ్రూ క్రియ సకర్మకంగా అర్థం కావచ్చినా, తెలుగులో ‘దాంతో ... కాలిపోయాయి’ అనే నిర్మాణం సహజంగా ఉండి విధ్వంస ఫలితాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: מִגָּדִישׁ
  choice: ధాన్యపు కుప్పలు
  rationale: גָּדִישׁ కోసి పోగుచేసిన ధాన్యపు కుప్ప లేదా పేర్చిన పంటను సూచిస్తుంది. సాధారణ పాఠకుడికి ‘ధాన్యపు కుప్పలు’ స్పష్టంగా అర్థమవుతుంది.
- source_word: מִגָּדִישׁ וְעַד קָמָה וְעַד כֶּרֶם זָיִת
  choice: ధాన్యపు కుప్పల మొదలు నిలువ పంట వరకు, ఒలీవ తోటల వరకు
  rationale: מִן...וְעַד...וְעַד అనే విస్తృతి నిర్మాణాన్ని జాబితాగా మార్చకుండా ‘మొదలు...వరకు...వరకు’గా నిలిపి, మూలపాఠంలోని వ్యాప్తి భావాన్ని కాపాడాం.
- source_word: כֶּרֶם זָיִת
  choice: ఒలీవ తోటలు
  rationale: כֶּרֶם సాగుచేసిన మొక్కల తోటను, זַיִת ఒలీవను సూచిస్తాయి. తెలుగులో సహజమైన వ్యవసాయ పదబంధం ‘ఒలీవ తోటలు’.
