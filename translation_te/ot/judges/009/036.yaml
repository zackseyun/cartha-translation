translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన కథన శైలిని వాడాం. ‘సైనికులు’ లేదా ‘దళాలు’ అని సందర్భాన్ని మించి నిర్దిష్టం చేయకుండా, మూలంలోని ‘జనం’ అనే విస్తృత భావాన్ని నిలిపాం. పేర్లను హీబ్రూ రూపాలకు సమీపంగా ‘గయాలు,’ ‘జెబులు’గా లిప్యంతరీకరించాం.
