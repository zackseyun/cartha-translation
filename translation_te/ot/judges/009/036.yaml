  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּרְא גַּעַל֮ אֶת הָ/עָם֒ וַ/יֹּ֣אמֶר אֶל זְבֻ֔ל הִנֵּה עָ֣ם יוֹרֵ֔ד מֵ/רָאשֵׁ֖י הֶ/הָרִ֑ים וַ/יֹּ֤אמֶר אֵלָי/ו֙ זְבֻ֔ל אֵ֣ת צֵ֧ל הֶ/הָרִ֛ים אַתָּ֥ה רֹאֶ֖ה כָּ/אֲנָשִֽׁים־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/036.yaml
  text: When Gaal saw the people[a], he said to Zebul, “Look, people are coming down from the tops of the mountains.” But Zebul said to him, “You are seeing the shadow of the mountains as men.”
translation:
  language: te
  text: 'గయాలు ఆ జనాన్ని చూసి జెబూలుతో ఇలా అన్నాడు: “చూడు, కొండల శిఖరాల నుంచి జనం దిగివస్తున్నారు.” అందుకు జెబూలు అతనితో, “నువ్వు కొండల నీడను మనుషులుగా చూస్తున్నావు[a]” అన్నాడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కొండల నీడ మనుషుల్లా కనిపిస్తున్నట్లు నువ్వు చూస్తున్నావు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: చూసి
  rationale: ראה అనే క్రియ సాధారణ కథన సందర్భంలో ప్రత్యక్షంగా చూడడాన్ని సూచిస్తుంది; ‘చూసి’ సహజమైన తెలుగు కథన రూపం.
- source_word: הָעָם / עָם
  choice: ఆ జనం / జనం
  rationale: עָם ప్రాథమికంగా ‘ప్రజలు, జనం’ అని అర్థం. సందర్భంలో వారు యోధులైనా, మూలపాఠం సైన్యం లేదా దళాలు అని స్పష్టంగా చెప్పదు; అందువల్ల ‘జనం’ అనే విస్తృత పదాన్ని ఉంచాం.
- source_word: הִנֵּה
  choice: చూడు
  rationale: ప్రత్యక్ష సంభాషణలో ఎదుటివారి దృష్టిని ఆకర్షించే సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: יוֹרֵד
  choice: దిగివస్తున్నారు
  rationale: క్రియ ఏకవచనంలో ఉన్నా עָם సమూహవాచకం. తెలుగులో ‘జనం’తో బహువచన క్రియ సహజం; పై ప్రదేశం నుంచి మాట్లాడేవారి వైపు కదలికను ‘దిగివస్తున్నారు’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: מֵרָאשֵׁי הֶהָרִים
  choice: కొండల శిఖరాల నుంచి
  rationale: רֹאשׁ ఇక్కడ కొండల పైభాగాలు లేదా శిఖరాలను సూచిస్తుంది; ఈ అనువాదం సంక్షిప్తంగా, స్పష్టంగా ఉంది.
- source_word: צֵל הֶהָרִים
  choice: కొండల నీడ
  rationale: צֵל అంటే నీడ లేదా ఛాయ. దృశ్యాన్ని తప్పుగా గ్రహించాడని జెబులు చెప్పే సందర్భంలో ‘నీడ’ అత్యంత సహజం.
- source_word: אַתָּה רֹאֶה כָּאֲנָשִׁים
  choice: నువ్వు మనుషులుగా చూస్తున్నావు
  rationale: ఈ నిర్మాణం కొండల నీడను మనుషులుగా భావించి చూస్తున్నాడనే జెబులు చేసిన వాదనను, పోలికలోని స్వల్ప అస్పష్టతను తొలగించకుండా నిలుపుతుంది.
- source_word: אֲנָשִׁים
  choice: మనుషులు
  rationale: పదం వ్యాకరణపరంగా పుంలింగ బహువచనం; ఇక్కడ కనిపిస్తున్న మానవ ఆకృతులను సూచిస్తుంది. తెలుగులో ‘మనుషులు’ సహజంగా ఉండి మూలార్థాన్ని కాపాడుతుంది.
