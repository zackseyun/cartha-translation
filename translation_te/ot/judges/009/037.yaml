    issue: “సింధూర వృక్షం” for אֵלוֹן
    rationale: The Hebrew term refers to a large tree, usually rendered ‘oak’ or ‘terebinth’; it does not support ‘sindoor/annatto tree.’ This changes the identified landmark.
  - severity: medium
    issue: “వైపు నుంచి” for מִדֶּרֶךְ
    rationale: The Hebrew specifies approach by way of/from the road of the named tree or landmark. “దారి గుండా” better preserves that route sense.
  - severity: low
    issue: Personal name form “గాలు”
    rationale: “గయాలు” more closely represents Gaʿal and is the conventional Telugu biblical transliteration.
