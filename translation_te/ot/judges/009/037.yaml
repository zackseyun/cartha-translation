  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֨סֶף ע֣וֹד גַּעַל֮ לְ/דַבֵּר֒ וַ/יֹּ֕אמֶר הִנֵּה עָם֙ יֽוֹרְדִ֔ים מֵ/עִ֖ם טַבּ֣וּר הָ/אָ֑רֶץ וְ/רֹאשׁ אֶחָ֣ד בָּ֔א מִ/דֶּ֖רֶךְ אֵל֥וֹן מְעוֹנְנִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/037.yaml
  text: Gaal spoke again and said[a], “Look, people are coming down from the center of the land[b], and one company is coming by the way of the Oak of the Soothsayers.”
translation:
  language: te
  text: 'గయాలు మళ్లీ ఇలా అన్నాడు: “ఇదిగో, జనాలు దేశం మధ్యభాగం[a] నుండి దిగివస్తున్నారు. ఒక గుంపు శకునజ్ఞుల ఓక్ చెట్టు[b] దారి గుండా వస్తోంది.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా ‘దేశం నాభి’; ఇది దేశంలోని మధ్యప్రాంతాన్ని సూచించే ప్రయోగం.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘శకునజ్ఞుల టెరెబింతు చెట్టు’ లేదా ‘మెయోనెనీము చెట్టు.’ హీబ్రూ పదం ఏ వృక్షజాతిని సూచిస్తుందో నిర్దిష్టం కాదు; చివరి భాగం శకునజ్ఞులను సూచించవచ్చు లేదా స్థలనామంలోని భాగం కావచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּסֶף עוֹד גַּעַל לְדַבֵּר
  choice: గాలు మళ్లీ మాట్లాడుతూ ... అన్నాడు
  rationale: ‘మరల జోడించి మాట్లాడాడు’ అనే హీబ్రూ ప్రయోగాన్ని సహజమైన ఆధునిక తెలుగు కథనశైలిలో ‘మళ్లీ మాట్లాడుతూ’ అని వ్యక్తం చేసింది.
- source_word: הִנֵּה
  choice: చూడండి!
  rationale: కనిపిస్తున్న దృశ్యంపై వెంటనే దృష్టి నిలిపే ఉద్బోధక పదం; ప్రాచీన శైలికన్నా సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: עָם יֹרְדִים
  choice: జనాలు ... దిగివస్తున్నారు
  rationale: עָם అనే విస్తృతార్థక పదాన్ని సైనికులని అతిగా నిర్దిష్టం చేయకుండా ‘జనాలు’గా అనువదించింది; బహువచన క్రియతో కొనసాగుతున్న కదలికను తెలిపింది.
- source_word: מֵעִם טַבּוּר הָאָרֶץ
  choice: దేశం మధ్యభాగం నుంచి
  rationale: טַבּוּר అక్షరార్థంగా ‘నాభి’; ఇక్కడ భౌగోళికంగా మధ్యప్రాంతాన్ని సూచించే రూపక ప్రయోగం. ప్రధాన పాఠంలో భావాన్ని స్పష్టంగా ఇచ్చి, రూపకాన్ని పాదసూచికలో ఉంచింది.
- source_word: וְרֹאשׁ אֶחָד
  choice: ఒక గుంపు
  rationale: רֹאשׁ అక్షరార్థం ‘తల’; ఇక్కడ వస్తున్న జనాల్లోని ఒక ప్రత్యేక విభాగం లేదా దళాన్ని సూచిస్తుంది. ‘గుంపు’ మూలపదం కంటే సైనిక స్వభావాన్ని ఎక్కువగా నిర్దిష్టం చేయదు.
- source_word: מִדֶּרֶךְ
  choice: వైపు నుంచి
  rationale: దారి లేదా దిశను సూచించే పదబంధాన్ని గాలు చూస్తున్న కోణానికి సరిపోయే సహజమైన తెలుగులో వ్యక్తం చేసింది.
- source_word: אֵלוֹן
  choice: సింధూర వృక్షం
  rationale: אֵלוֹן సూచించే వృక్షజాతి విషయంలో ‘ఓక్’ లేదా ‘టెరెబింతు’ అనే అనిశ్చితి ఉంది. తెలుగు పాఠకునికి వృక్షంగా స్పష్టంగా ఉండేందుకు ఈ రూపాన్ని ఎంచుకొని ప్రత్యామ్నాయాన్ని పాదసూచికలో తెలిపింది.
- source_word: מְעוֹנְנִים
  choice: శకునాలు చెప్పేవారి
  rationale: ఈ పదం శకున నిర్ధారణ లేదా భవిష్యద్వాణితో సంబంధమున్నదిగా సాధారణంగా అర్థం చేసుకుంటారు; అయితే ఇది స్థలనామంలోని భాగం కావచ్చనే అనిశ్చితిని పాదసూచికలో నిలిపింది.
