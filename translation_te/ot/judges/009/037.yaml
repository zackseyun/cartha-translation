- from: గాలు మళ్లీ మాట్లాడుతూ, “చూడండి! జనాలు దేశం మధ్యభాగం[a] నుంచి దిగివస్తున్నారు. ఒక గుంపు శకునాలు చెప్పేవారి సింధూర వృక్షం[b] వైపు నుంచి వస్తోంది” అన్నాడు.
