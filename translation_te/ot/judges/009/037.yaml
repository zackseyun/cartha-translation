translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, దృశ్యాన్ని వెంటనే తెలియజేసే ఉత్కంఠభరిత కథనశైలి పాటించబడింది. వృక్షజాతి మరియు స్థలనామానికి సంబంధించిన మూలభాషా అనిశ్చితి ప్రధాన పాఠంలో బలవంతంగా పరిష్కరించకుండా పాదసూచికలో స్పష్టంగా నిలిపబడింది.
