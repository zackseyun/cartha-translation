source:
  edition: WLC
  text: וַ/יִּתְּנוּ ל/וֹ֙ שִׁבְעִ֣ים כֶּ֔סֶף מִ/בֵּ֖יתּ בַ֣עַל בְּרִ֑ית וַ/יִּשְׂכֹּ֨ר בָּ/הֶ֜ם אֲבִימֶ֗לֶךְ אֲנָשִׁ֤ים רֵיקִים֙ וּ/פֹ֣חֲזִ֔ים וַ/יֵּלְכ֖וּ אַחֲרָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/004.yaml
  text: And they gave him seventy pieces of silver from the house of Baal-berith[a], and with them Abimelek hired worthless and reckless men[c][b], and they followed him.
translation:
  language: te
  text: వారు బయల్-బెరీతు మందిరం[a] నుండి డెబ్బై వెండి[b] అతనికి ఇచ్చారు. అబీమెలెకు ఆ వెండితో పనికిమాలిన, దుందుడుకు మనుషులను[c] కూలికి నియమించుకున్నాడు; వారు అతని వెంట వెళ్లారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా ‘బయల్-బెరీతు ఇంటి నుండి.’ ఆరాధనా సందర్భంలో ‘ఇల్లు’ అనే హీబ్రూ పదం దేవాలయాన్ని లేదా పూజాస్థలాన్ని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘డెబ్బై వెండి షెకెలులు.’ హీబ్రూలో అక్షరార్థంగా ‘డెబ్బై వెండి’ అని ఉంది; ఇది తూకం ప్రకారం తెలిపిన ధనమొత్తం.
    reason: lexical_alternative
  - marker: c
    text: అక్షరార్థంగా ‘ఖాళీగా ఉన్న, దుందుడుకు మనుషులు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁבְעִים כֶּסֶף
  choice: డెబ్బై వెండి నాణాలు
  rationale: హీబ్రూలో అక్షరార్థంగా ‘డెబ్బై వెండి’ అని ఉంది; అది తూకం ఆధారంగా చెప్పిన ధనమొత్తం. సహజమైన తెలుగులో ద్రవ్యార్థాన్ని తెలియజేయడానికి ‘వెండి నాణాలు’ అని అనువదించాం; ‘షెకెలులు’ మూలంలో స్పష్టంగా లేదు కాబట్టి పాదసూచికలో ప్రత్యామ్నాయంగా ఇచ్చాం.
- source_word: מִבֵּית בַּעַל בְּרִית
  choice: బయల్-బెరీతు మందిరం నుండి
  rationale: בַּיִת అంటే ‘ఇల్లు’; ఆరాధనా సందర్భంలో అది దేవాలయం లేదా మందిరాన్ని సూచించగలదు. ఆధునిక తెలుగులో సందర్భార్థం స్పష్టంగా ఉండేందుకు ‘మందిరం’ ఎంచుకున్నాం; అక్షరార్థాన్ని పాదసూచికలో ఉంచాం. దైవనామాన్ని అనువదించకుండా ‘బయల్-బెరీతు’గా లిప్యంతరీకరించాం.
- source_word: וַיִּשְׂכֹּר בָּהֶם
  choice: ఆ వెండితో ... కూలికి పెట్టుకున్నాడు
  rationale: בָּהֶם ముందున్న వెండిని సాధనంగా సూచిస్తుంది. మనుషులను డబ్బిచ్చి తన సేవకు నియమించుకున్న భావాన్ని సహజమైన తెలుగులో ‘కూలికి పెట్టుకున్నాడు’ తెలియజేస్తుంది.
- source_word: אֲנָשִׁים רֵיקִים
  choice: పనికిమాలిన ... మనుషులు
  rationale: רֵיקִים అక్షరార్థం ‘ఖాళీగా ఉన్నవారు’; ఇక్కడ సామాజికంగా, నైతికంగా విలువలేని వారనే ప్రతికూల చిత్రణ. ‘పనికిమాలిన’ ఆ భావాన్ని సాధారణ ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: וּפֹחֲזִים
  choice: దుందుడుకు
  rationale: ఈ పదం అదుపులేని, తొందరపాటు గల, విశ్వసనీయతలేని ప్రవర్తనను సూచిస్తుంది. ‘దుందుడుకు’ సందర్భంలోని ప్రమాదకరమైన నిర్లక్ష్యాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וַיֵּלְכוּ אַחֲרָיו
  choice: వారు అతని వెంట వెళ్లారు
  rationale: హీబ్రూ రూపకాన్ని దగ్గరగా నిలుపుతూ, వారు అబీమెలెకుతో చేరి అతని అనుచరులయ్యారనే సందర్భార్థాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గంభీరమైన కథనశైలి. ‘బయల్-బెరీతు,’ ‘అబీమెలెకు’ పేర్లు లిప్యంతరీకరించబడ్డాయి. మూలంలోని వరుస క్రియలను తెలుగులో సహజమైన రెండు వాక్యాలుగా అమర్చాం; అర్థసంబంధం, ప్రతికూల వ్యక్తిచిత్రణ నిలుపుకున్నాం.
