  variant: modern standard Telugu
source:
  edition: WLC
  text: דַּבְּרוּ נָ֞א בְּ/אָזְנֵ֨י כָל בַּעֲלֵ֣י שְׁכֶם֮ מַה טּ֣וֹב לָ/כֶם֒ הַ/מְשֹׁ֨ל בָּ/כֶ֜ם שִׁבְעִ֣ים אִ֗ישׁ כֹּ֚ל בְּנֵ֣י יְרֻבַּ֔עַל אִם מְשֹׁ֥ל בָּ/כֶ֖ם אִ֣ישׁ אֶחָ֑ד וּ/זְכַרְתֶּ֕ם כִּֽי עַצְמֵ/כֶם וּ/בְשַׂרְ/כֶ֖ם אָנִֽי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/002.yaml
  text: 'Please speak in the hearing of all the leaders of Shechem: Which is better for you—that seventy men[a], all the sons of Jerubbaal, rule over you, or that one man rule over you? And remember that I am your bone and your flesh.'
translation:
  language: te
  text: '“షెకెము నాయకులందరూ వినేలా దయచేసి ఇలా చెప్పండి: యెరుబ్బయలు కుమారులందరైన డెబ్బై మంది పురుషులు మిమ్మల్ని పరిపాలించడం మీకు మేలా, లేక ఒక్క పురుషుడు మిమ్మల్ని పరిపాలించడం మేలా? నేను మీ ఎముకను, మీ మాంసమై ఉన్నానని గుర్తుంచుకోండి.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘మీ ఎముకను, మీ మాంసం’ అనేది సన్నిహిత రక్తసంబంధాన్ని, అంటే ‘మీ సొంత రక్తమాంసాలు’ లేదా ‘మీ దగ్గరి బంధువు’ అనే భావాన్ని తెలిపే హీబ్రూ నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבְּרוּ נָא בְּאָזְנֵי
  choice: వినేలా దయచేసి ఇలా చెప్పండి
  rationale: బహువచన ఆజ్ఞతో పాటు נָא తెలిపే వినయపూర్వక అభ్యర్థనను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; ‘చెవుల్లో’ అనే కృత్రిమ పదానువాదాన్ని నివారిస్తూ బహిరంగంగా వినిపించే భావాన్ని నిలుపుతుంది.
- source_word: בַּעֲלֵי שְׁכֶם
  choice: షెకెము పెద్దలు
  rationale: בַּעֲלֵי అనే పదం యజమానులు, పట్టణంలోని హక్కుగల ప్రముఖులు లేదా పాలకవర్గపు వ్యక్తులను సూచించగలదు. సందర్భంలోని పౌర-రాజకీయ భావాన్ని ‘పెద్దలు’ సహజంగా తెలియజేస్తుంది; అయితే పదంలోని ఖచ్చిత సామాజిక హోదా కొంత అనిశ్చితంగానే ఉంటుంది.
- source_word: מַה טּוֹב לָכֶם
  choice: మీకు మేలా?
  rationale: తరువాత వచ్చే రెండు ప్రత్యామ్నాయాల మధ్య తులనను తెలుగులో ప్రశ్నారూపంగా స్పష్టంగా, సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: הַמְשֹׁל בָּכֶם ... מְשֹׁל בָּכֶם
  choice: మిమ్మల్ని పరిపాలించడం ... మిమ్మల్ని పరిపాలించడం
  rationale: రాజకీయ అధికారాన్ని సూచించే משל భావాన్ని అందిస్తూ, మూలంలోని పునరుక్తిని రెండుచోట్లా నిలుపుతుంది.
- source_word: שִׁבְעִים אִישׁ כֹּל בְּנֵי יְרֻבַּעַל
  choice: యెరుబ్బయలు కుమారులందరూ, అంటే డెబ్బై మంది పురుషులు
  rationale: ఇక్కడ אִישׁ పురుషులను లెక్కించే పదం; సందర్భం యెరుబ్బయలు కుమారుల గురించినది కాబట్టి లింగస్పష్టతను నిలుపుతుంది. ‘అంటే’ పదం రెండు వర్ణనలు ఒకే గుంపును సూచిస్తున్నాయని సహజంగా చూపుతుంది.
- source_word: אִישׁ אֶחָד
  choice: ఒక్క పురుషుడు
  rationale: డెబ్బై మంది పురుషులకు వ్యతిరేకంగా ఒకే పురుషుడు అనే వాక్చాతుర్యపూర్వక వ్యత్యాసాన్ని నిలుపుతుంది.
- source_word: וּזְכַרְתֶּם
  choice: జ్ఞాపకం ఉంచుకోండి
  rationale: రూపపరంగా wawతో కూడిన పరిపూర్ణ క్రియ అయినా, సందర్భంలో ఇచ్చే బలమైన ప్రేరణను తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: עַצְמֵכֶם וּבְשַׂרְכֶם אָנִי
  choice: నేను మీ ఎముకను, మీ మాంసాన్ని
  rationale: రక్తసంబంధాన్ని తెలిపే మూర్తమైన హీబ్రూ బంధుత్వ నుడికారాన్ని ప్రధాన పాఠ్యంలో నిలుపుతుంది; అర్థాన్ని పాదటిప్పణి వివరిస్తుంది.
theological_decisions:
- issue: బంధుత్వ నుడికారాన్ని అర్థానువాదం చేయాలా, మూర్తరూపంలో ఉంచాలా
  choice: ‘నేను మీ ఎముకను, మీ మాంసాన్ని’ అనే మూర్తమైన నుడికారాన్ని ప్రధాన పాఠ్యంలో ఉంచడం
  alternative: ‘నేను మీ రక్తసంబంధిని’ లేదా ‘నేను మీ సొంత బంధువును’
  rationale: మూలంలోని శారీరక-బంధుత్వ రూపకాన్ని చెరపకుండా ఉంచడం వల్ల కుటుంబ ఐక్యతపై అబీమెలెకు చేస్తున్న విజ్ఞప్తి బలం నిలుస్తుంది. పాదటిప్పణి దాని భావాన్ని స్పష్టం చేస్తుంది.
- issue: యెరుబ్బయలు సంతానం మరియు అబీమెలెకు విషయంలో లింగస్పష్టత
  choice: ‘డెబ్బై మంది పురుషులు’ మరియు ‘ఒక్క పురుషుడు’
  alternative: ‘డెబ్బై మంది’ మరియు ‘ఒక్క వ్యక్తి’
  rationale: మూలంలోని אִישׁ మరియు ‘కుమారులు’ ఈ సందర్భంలో పురుషులనే స్పష్టంగా సూచిస్తున్నాయి; లింగతటస్థీకరణ మూలంలోని నిర్దిష్టతను తగ్గిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. ‘షెకెము పెద్దలు’ పౌర-రాజకీయ ప్రముఖులను సూచిస్తుంది; మూలపదం వారి ఖచ్చిత హోదాను పూర్తిగా నిర్దేశించనందున మరింత సాంకేతిక పదాన్ని వాడలేదు. పాదటిప్పణి సూచిక [a] సంబంధిత బంధుత్వ నుడికారం వెంటనే ఉంచబడింది.
