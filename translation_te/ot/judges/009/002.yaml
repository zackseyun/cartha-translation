- from: '“షెకెము పెద్దలందరూ వినేలా దయచేసి ఇలా చెప్పండి: ‘యెరుబ్బయలు కుమారులందరూ, అంటే డెబ్బై మంది పురుషులు, మిమ్మల్ని పరిపాలించడం మీకు మేలా? లేక ఒక్క పురుషుడు మిమ్మల్ని పరిపాలించడం మేలా? నేను మీ ఎముకను, మీ మాంసాన్ని[a] అని జ్ఞాపకం ఉంచుకోండి.’”'
  to: '“షెకెము నాయకులందరూ వినేలా దయచేసి ఇలా చెప్పండి: యెరుబ్బయలు కుమారులందరైన డెబ్బై మంది పురుషులు మిమ్మల్ని పరిపాలించడం మీకు మేలా, లేక ఒక్క పురుషుడు మిమ్మల్ని పరిపాలించడం మేలా? నేను మీ ఎముకను, మీ మాంసమై ఉన్నానని గుర్తుంచుకోండి.[a]”'
