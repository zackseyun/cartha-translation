revisions:
- from: అప్పుడు చెట్లు ద్రాక్షతీగతో, “నువ్వు వచ్చి మమ్మల్ని పరిపాలించు” అన్నాయి.[a]
  to: అప్పుడు చెట్లు ద్రాక్షతీగతో, “రా, మాపై రాజ్యమేలు” అన్నాయి.[a]
  rationale: The revision preserves the narrative sequence and fable-like personification while rendering ‘reign over us’ with Telugu wording that reflects the Hebrew royal verb and preposition. The lexical ambiguity of the summons verb is retained in the footnote.
