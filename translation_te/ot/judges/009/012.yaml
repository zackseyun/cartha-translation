source:
  edition: WLC
  text: וַ/יֹּאמְר֥וּ הָ/עֵצִ֖ים לַ/גָּ֑פֶן לְכִי אַ֖תְּ מלוכי עָלֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/012.yaml
  text: Then the trees said to the vine[a], ‘Come, reign over us.’
translation:
  language: te
  text: అప్పుడు చెట్లు ద్రాక్షతీగతో, “రా, మాపై రాజ్యమేలు” అన్నాయి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, మరింత రూపానుగతంగా, “వెళ్లి మాపై రాజ్యమేలు.” హీబ్రూలోని పిలుపు ప్రయోగాన్ని తెలుగులో సహజంగా “రా” అని అనువదించారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: అప్పుడు ... అన్నాయి
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది; ఆధునిక తెలుగు కథన ప్రవాహంలో ‘అప్పుడు’ సహజంగా క్రమాన్ని తెలియజేస్తుంది.
- source_word: הָעֵצִים
  choice: చెట్లు
  rationale: యోతాము చెప్పిన ఉపమానకథ సందర్భంలో עֵצִים అనేది కలపను కాక చెట్లను సూచిస్తుంది.
- source_word: לַגָּפֶן
  choice: ద్రాక్షతీగతో
  rationale: גֶּפֶן అంటే ద్రాక్షతీగ. చెప్పడం అనే క్రియతో తెలుగు వాక్య నిర్మాణంలో ‘ద్రాక్షతీగతో’ సహజంగా ఉంటుంది.
- source_word: לְכִי
  choice: వచ్చి
  rationale: הלך యొక్క ప్రాథమిక అర్థం ‘వెళ్లు/నడువు’ అయినా, తరువాతి ఆజ్ఞతో కూడిన ఈ పిలుపు సందర్భంలో తెలుగులో ‘వచ్చి’ సహజమైన ఆహ్వాన భావాన్ని ఇస్తుంది.
- source_word: אַתְּ
  choice: నువ్వు
  rationale: హీబ్రూలో ఇది రెండవ పురుష ఏకవచన స్త్రీలింగ సర్వనామం; ద్రాక్షతీగను వ్యక్తిగా సంబోధిస్తున్న భావాన్ని తెలుగులో ‘నువ్వు’ స్పష్టంగా నిలుపుతుంది.
- source_word: מְלֹכִי
  choice: పరిపాలించు
  rationale: מלך ఇక్కడ స్త్రీలింగ ఏకవచన ఆజ్ఞారూపం; రాజుగా పాలించే భావాన్ని ఆధునిక తెలుగులో ‘పరిపాలించు’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: עָלֵינוּ
  choice: మమ్మల్ని
  rationale: מלך తో వచ్చిన עַל పాలనకు లోబడినవారిని సూచిస్తుంది; తెలుగులో ‘మమ్మల్ని పరిపాలించు’ సహజమైన ప్రయోగం.
