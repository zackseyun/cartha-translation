    text: లేదా, మరింత రూపానుగతంగా, “వెళ్లి మాపై రాజ్యమేలు.” హీబ్రూలోని పిలుపు ప్రయోగాన్ని తెలుగులో సహజంగా “రా” అని అనువదించారు.
    reason: lexical_alternative
  revision_rationale: The revision preserves the narrative sequence and fable-like personification while rendering ‘reign over us’ with Telugu wording that reflects the Hebrew royal verb and preposition. The lexical ambiguity of the summons verb is retained in the footnote.
