translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ఉపమానకథకు తగిన సరళమైన, గౌరవప్రదమైన కథన శైలి. ప్రధాన పాఠంలో సహజమైన తెలుగు వాక్య నిర్మాణాన్ని ఉపయోగిస్తూ, ‘వెళ్లు’ మరియు ‘రాజుగా పాలించు’ అనే మరింత రూపానుగత ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలిపాం.
