source:
  edition: WLC
  text: וַ/יָּ֧קָם אֲבִימֶ֛לֶךְ וְ/כָל הָ/עָ֥ם אֲשֶׁר עִמּ֖/וֹ לָ֑יְלָה וַ/יֶּאֶרְב֣וּ עַל שְׁכֶ֔ם אַרְבָּעָ֖ה רָאשִֽׁים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/034.yaml
  text: So Abimelech and all the people who were with him got up by night[a], and they lay in ambush against Shechem in four companies.
translation:
  language: te
  text: అబీమెలెకు, అతనితో ఉన్న ప్రజలందరూ రాత్రివేళ లేచి, నాలుగు దళాలుగా[a] షెకెముపై మాటువేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా “నాలుగు తలలు”; సందర్భంలో నాలుగు బృందాలు లేదా విభాగాలు అనే భావం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: లేచి
  rationale: קום క్రియ ఇక్కడ కథన క్రమంలో లేచి కార్యానికి సిద్ధపడడాన్ని సూచిస్తుంది; ‘లేచి’ సహజంగా ఉండి, బయలుదేరారనే భావాన్ని అనవసరంగా చేర్చదు.
- source_word: לָיְלָה
  choice: రాత్రివేళ
  rationale: ఇది కాలాన్ని సూచించే క్రియావిశేషణ ప్రయోగం; ‘రాత్రివేళ’ చర్య రాత్రిలో జరిగిందని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: וַיֶּאֶרְבוּ
  choice: మాటువేశారు
  rationale: ארב శత్రువుపై రహస్యంగా దాడి చేయడానికి పొంచి ఉండడాన్ని సూచిస్తుంది; ‘మాటువేశారు’ సైనిక సందర్భాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: עַל שְׁכֶם
  choice: షెకెముకు వ్యతిరేకంగా
  rationale: ארבతో వచ్చిన עַל కేవలం స్థలాన్ని మాత్రమే కాక శత్రుత్వ లక్ష్యాన్ని కూడా సూచించగలదు; ఈ సందర్భంలో ‘వ్యతిరేకంగా’ ఆ దిశను నిలుపుతుంది.
- source_word: אַרְבָּעָה רָאשִׁים
  choice: నాలుగు దళాలుగా
  rationale: అక్షరార్థంగా ‘నాలుగు తలలు’; సందర్భంలో ఇది నాలుగు వేర్వేరు బృందాలు లేదా విభాగాలను సూచించే ప్రయోగం. సైనిక సందర్భానికి ‘దళాలు’ స్పష్టంగా సరిపోతుంది.
- source_word: הָעָם אֲשֶׁר עִמּוֹ
  choice: అతనితో ఉన్న ప్రజలందరూ
  rationale: עָם అనే విస్తృత పదాన్ని ‘సైనికులు’ లేదా ‘పురుషులు’గా ప్రత్యేకీకరించకుండా ‘ప్రజలు’గా ఉంచి మూలంలోని సాధారణతను కాపాడింది.
