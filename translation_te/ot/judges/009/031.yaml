translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. మూలంలోని ‘ఇదిగో’ అనే ద్విగుణ ఉద్ఘాటన నిలుపబడింది. అరుదైన בְּתָרְמָה పదంలోని పాఠార్థ అనిశ్చితినీ, צָרִים క్రియలోని సందర్భార్థ–అక్షరార్థ ఉద్రిక్తతనూ పాదసూచికల్లో స్పష్టంగా సంరక్షించాం.
