source:
  edition: WLC
  text: וַ/יִּשְׁלַ֧ח מַלְאָכִ֛ים אֶל אֲבִימֶ֖לֶךְ בְּ/תָרְמָ֣ה לֵ/אמֹ֑ר הִנֵּה֩ גַ֨עַל בֶּן עֶ֤בֶד וְ/אֶחָי/ו֙ בָּאִ֣ים שְׁכֶ֔מָ/ה וְ/הִנָּ֛/ם צָרִ֥ים אֶת הָ/עִ֖יר עָלֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/031.yaml
  text: And he sent messengers to Abimelek secretly[a], saying, “Look, Gaal son of Ebed and his brothers have come to Shechem, and look, they are besieging the city against you.”
translation:
  language: te
  text: 'అతడు అబీమెలెకుకు రహస్యంగా[a] దూతలను పంపి ఇలా చెప్పించాడు: “ఇదిగో, ఏబెదు కుమారుడు గయాలు, అతని సోదరులు షెకెముకు వచ్చారు. ఇదిగో, వారు నీకు వ్యతిరేకంగా పట్టణాన్ని రెచ్చగొడుతున్నారు[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “మోసపూర్వకంగా.” ఈ అరుదైన హీబ్రూ పదాన్ని కొందరు స్థలనామంగా తీసుకొని “తొర్మాలోనుండి” అని కూడా అనువదిస్తారు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ క్రియ అర్థం ఇక్కడ అనిశ్చితం. మరింత అక్షరార్థంగా, “వారు నీకు వ్యతిరేకంగా పట్టణాన్ని ముట్టడిస్తున్నారు” లేదా “వారు పట్టణాన్ని నీకు విరోధంగా చేస్తున్నారు” అని అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח מַלְאָכִים
  choice: అతడు ... దూతలను పంపి
  rationale: కథనంలోని సాధారణ భూతకాల ప్రవాహాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; ఈ సందర్భంలో מַלְאָכִים మానవ సందేశవాహకులను సూచిస్తుంది.
- source_word: אֶל אֲבִימֶלֶךְ
  choice: అబీమెలెకుకు
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు ధ్వన్యనుకరణలో ఉంచి, గమ్యార్థక విభక్తితో అనువదించబడింది.
- source_word: בְּתָרְמָה
  choice: రహస్యంగా[a]
  rationale: సందేశం గోప్యంగా పంపబడిందనే సందర్భోచిత భావాన్ని సహజంగా తెలియజేస్తుంది; పదరూపం అరుదైనదీ, పాఠార్థం అనిశ్చితమైనదీ కావడంతో ప్రత్యామ్నాయం పాదసూచికలో నిలుపబడింది.
- source_word: לֵאמֹר
  choice: ఇలా చెప్పించాడు
  rationale: దూతల ద్వారా పంపిన ప్రత్యక్ష సందేశాన్ని తెలుగులో సహజంగా పరిచయం చేస్తుంది.
- source_word: הִנֵּה ... וְהִנָּם
  choice: ఇదిగో ... ఇదిగో
  rationale: వార్తలోని రెండు దృష్ట్యాకర్షక, ఉద్ఘాటనాత్మక ప్రయోగాలను నిలుపుతుంది.
- source_word: גַעַל בֶּן עֶבֶד וְאֶחָיו
  choice: ఏబెదు కుమారుడు గయాలు, అతని సోదరులు
  rationale: కుమార సంబంధాన్ని, అలాగే ‘సోదరులు’ అనే మూలపదాన్ని సాధ్యమైనంత నేరుగా నిలుపుతుంది.
- source_word: בָּאִים שְׁכֶמָה
  choice: షెకెముకు వచ్చారు
  rationale: వారు అక్కడికి చేరి ఇప్పుడు చర్యలో ఉన్నారనే వర్తమాన సంబంధిత ఫలితాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: צָרִים אֶת הָעִיר עָלֶיךָ
  choice: నీకు వ్యతిరేకంగా పట్టణాన్ని రెచ్చగొడుతున్నారు[b]
  rationale: ఈ సందర్భంలో గయాలు వర్గం షెకెము ప్రజలను అబీమెలెకుకు వ్యతిరేకంగా తిరుగుబాటుకు ప్రేరేపిస్తున్న రాజకీయ భావాన్ని తెలియజేస్తుంది; అయితే క్రియకు ‘ముట్టడిస్తున్నారు’ అనే మరింత అక్షరార్థ పఠనం కూడా సాధ్యమైనందున పాదసూచికలో నిలుపబడింది.
