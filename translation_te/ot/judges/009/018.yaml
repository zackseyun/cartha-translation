review_pass:
  verdict: revise
  source_fidelity: The draft conveys the principal clauses and preserves the causal accusation. However, “అతని కుమారులు డెబ్బై మందిని ... చంపారు” grammatically makes the sons the killers, whereas the Hebrew says that the addressees killed his seventy sons. The scope of ‘king’ should also be expressed as rule over Shechem’s leaders.
  naturalness: The proposed revision uses clear modern standard Telugu while retaining Jotham’s accusatory tone. “నా తండ్రి కుటుంబానికి వ్యతిరేకంగా” naturally conveys ‘against my father’s house’ in its familial/dynastic sense.
  terminology: “దాసి కుమారుడు” appropriately renders the polemical social-status term without prematurely equating it with ‘concubine.’ “షెకెము నాయకులు” suitably renders the political sense of בעלי שכם. The footnote retains the relevant lexical alternatives.
  issues:
  - severity: high
    issue: The Telugu syntax reverses the agent and patient in the killing clause.
    rationale: “అతని కుమారులు డెబ్బై మందిని ... చంపారు” means ‘his sons killed seventy people.’ The Hebrew says ‘you killed his sons—seventy men.’
  - severity: medium
    issue: The relation expressed by ‘king over the leaders of Shechem’ is not fully explicit.
    rationale: “షెకెము నాయకులపై రాజుగా నియమించారు” is understandable, but “వారిని ఏలుటకు రాజుగా” more clearly expresses the causative enthronement and the governing relation conveyed by על.
  revised_text: కాని మీరు ఈ రోజున నా తండ్రి కుటుంబానికి వ్యతిరేకంగా లేచి, అతని కుమారులైన డెబ్బై మందిని ఒకే రాతిమీద చంపారు. అతని దాసి కుమారుడైన అబీమెలెకు[a] మీ సహోదరుడు కాబట్టి, అతణ్ణి షెకెము నాయకులను ఏలుటకు రాజుగా నియమించారు.
