  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אַתֶּ֞ם קַמְתֶּ֨ם עַל בֵּ֤ית אָבִ/י֙ הַ/יּ֔וֹם וַ/תַּהַרְג֧וּ אֶת בָּנָ֛י/ו שִׁבְעִ֥ים אִ֖ישׁ עַל אֶ֣בֶן אֶחָ֑ת וַ/תַּמְלִ֜יכוּ אֶת אֲבִימֶ֤לֶךְ בֶּן אֲמָת/וֹ֙ עַל בַּעֲלֵ֣י שְׁכֶ֔ם כִּ֥י אֲחִי/כֶ֖ם הֽוּא־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/018.yaml
  text: But you have risen up against my father's house today[a], and you killed his sons, seventy men, on one stone, and you made Abimelek, the son of his female servant, king over the leaders of Shechem, because he is your brother.
translation:
  language: te
  text: కాని మీరు ఈ రోజున నా తండ్రి కుటుంబానికి వ్యతిరేకంగా లేచి, అతని కుమారులైన డెబ్బై మందిని ఒకే రాతిమీద చంపారు. అతని దాసి కుమారుడైన అబీమెలెకు[a] మీ సహోదరుడు కాబట్టి, అతణ్ణి షెకెము నాయకులను ఏలుటకు రాజుగా నియమించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అతని బానిస స్త్రీ కుమారుడు.’ సందర్భాన్ని బట్టి కొందరు ‘అతని ఉంపుడుగత్తె కుమారుడు’ అని అర్థం చేసుకుంటారు. హీబ్రూ పదం స్త్రీ సేవకురాలు లేదా బానిస స్త్రీని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: קַמְתֶּם עַל
  choice: విరోధంగా లేచి
  rationale: హీబ్రూ నుడికారంలోని విరోధపూర్వక చర్యను, అలాగే ‘లేవడం’ అనే రూపకాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: בֵּית אָבִי
  choice: నా తండ్రి ఇంటివారు
  rationale: ఇక్కడ ‘ఇల్లు’ భవనాన్ని కాక కుటుంబాన్ని లేదా వంశగృహాన్ని సూచిస్తుంది; ‘ఇంటివారు’ ఆధునిక తెలుగులో ఆ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: וַתַּהַרְגוּ
  choice: చంపారు
  rationale: మూల క్రియ చంపడాన్ని పేర్కొంటుంది. ‘హత్య చేశారు’ అని అనువదిస్తే మూలపదంలో ప్రత్యక్షంగా లేని న్యాయపరమైన తీర్పు చేరవచ్చు.
- source_word: שִׁבְעִים אִישׁ
  choice: డెబ్బై మంది
  rationale: సంఖ్యతో వచ్చిన אִישׁ ఇక్కడ గిద్యోను కుమారులైన పురుషులను లెక్కిస్తుంది; తెలుగులో ‘మంది’ సహజమైన వ్యక్తి-గణన రూపం.
- source_word: עַל אֶבֶן אֶחָת
  choice: ఒకే రాతిమీద
  rationale: సామూహిక వధ జరిగిన భయానక స్థలాన్ని మూలానికి దగ్గరగా, సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וַתַּמְלִיכוּ
  choice: రాజుగా నియమించారు
  rationale: హిఫీల్ రూపంలోని ‘రాజుగా చేయడం’ అనే కారణార్థాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: בֶּן אֲמָתוֹ
  choice: అతని దాసి కుమారుడు
  rationale: אָמָה స్త్రీ సేవకురాలు లేదా బానిస స్త్రీని సూచిస్తుంది. ‘దాసి’ సంక్షిప్తంగా, గౌరవప్రదంగా ఉండి మూలంలోని సామాజిక హోదా భావాన్ని నిలుపుతుంది; ‘ఉంపుడుగత్తె’ అనే సందర్భానుగత వ్యాఖ్యానాన్ని ప్రధాన పాఠ్యంలోకి తేవదు.
- source_word: בַּעֲלֵי שְׁכֶם
  choice: షెకెము నాయకులు
  rationale: ఈ రాజకీయ సందర్భంలో בַּעֲלֵי నగరంలోని అధికార లేదా ప్రముఖ హోదా గలవారిని సూచిస్తుంది; ‘నాయకులు’ సాధారణ ఆధునిక పాఠకులకు స్పష్టంగా ఉంటుంది.
- source_word: כִּי אֲחִיכֶם הוּא
  choice: మీ సహోదరుడు కాబట్టి
  rationale: כִּי ఇక్కడ కారణాన్ని తెలియజేస్తుంది; యోతాము ఆరోపణలోని వ్యంగ్యభావాన్ని కూడా ఈ రూపం నిలుపుతుంది.
theological_decisions:
- issue: అబీమెలెకు తల్లి హోదాను తెలిపే אֲמָתוֹ పదంలోని సామాజిక భావం
  choice: ప్రధాన పాఠ్యంలో ‘దాసి’
  alternative: ‘బానిస స్త్రీ’; సందర్భానుగతంగా ‘ఉంపుడుగత్తె’
  rationale: మూల నామవాచకం స్త్రీ సేవకురాలు లేదా బానిస స్త్రీని సూచిస్తుంది. ‘ఉంపుడుగత్తె’ అనేది విస్తృత కథన సందర్భం నుంచి సాధ్యమైన వ్యాఖ్యానం అయినా, ఈ పదానికి నేరుగా ఉన్న అర్థం కాదు. అందువల్ల ప్రధాన పాఠ్యం మూలపదానికి దగ్గరగా ఉండి, ప్రత్యామ్నాయాలను పాదసూచికలో ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ఆరోపణాత్మక ధోరణిని నిలుపుతూ గంభీరంగా మరియు సాధారణ పాఠకులకు అర్థమయ్యేలా అనువదించబడింది. పొడవైన హీబ్రూ వాక్యాన్ని తెలుగులో స్పష్టత కోసం రెండు వాక్యాలుగా విభజించాం; కారణ సంబంధం మాత్రం యథాతథంగా ఉంచాం.
