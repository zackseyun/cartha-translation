id: JDG.9.46
reference: Judges 9:46
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַֽ/יִּשְׁמְע֔וּ כָּֽל בַּעֲלֵ֖י מִֽגְדַּל שְׁכֶ֑ם וַ/יָּבֹ֣אוּ אֶל צְרִ֔יחַ בֵּ֖ית אֵ֥ל בְּרִֽית־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/046.yaml
  text: When all the leaders of the tower of Shechem heard it[c][b][a], they went into the inner chamber of the house of El-berith.
translation:
  language: te
  text: షెకెము గోపురపు నాయకులందరూ[a] అది విని, ఏల్-బెరీత్ మందిరంలోని రక్షిత అంతర్గదిలోకి[b] వెళ్లారు.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘మిగ్దల్-షెకెము నాయకులు’; ఈ పదబంధాన్ని ‘షెకెము గోపురం’ అనే వివరణగా కాక స్థలనామంగా తీసుకోవచ్చు.
    reason: alternative_reading
  - marker: b
    text: ‘రక్షిత అంతర్గది’కి ఉపయోగించిన హీబ్రూ పదాన్ని ‘కోటగది,’ ‘భద్రగది,’ లేదా ‘లోపలి గది’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: ‘ఏల్-బెరీత్’ అంటే ‘నిబంధన దేవుడు’ కావచ్చు. ఈ అధ్యాయంలోని సంబంధిత పేరు ‘బయల్-బెరీత్’ను పోల్చండి.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁמְעוּ
  choice: అది విని
  rationale: మూలంలోని క్రియ సాధారణంగా ‘విన్నారు’ అని అర్థం. మునుపటి సంఘటనల వార్తను సూచించే కర్మను తెలుగు సహజ ప్రయోగం కోసం ‘అది’ అని స్పష్టంచేశాం.
- source_word: בַּעֲלֵי
  choice: నాయకులు
  rationale: అక్షరార్థంగా ‘యజమానులు/ప్రభువులు’; ఇక్కడ పౌర-సైనిక సందర్భంలో ఆ ప్రాంతపు ప్రముఖులను సూచిస్తుంది కాబట్టి ‘నాయకులు’ సహజంగా ఉంది.
- source_word: מִגְדַּל שְׁכֶם
  choice: షెకెము గోపురం
  rationale: מִגְדַּל అంటే ‘గోపురం’. ఇది వివరణాత్మక పదబంధమా లేక స్థలనామమా అనే సందిగ్ధతను ప్రధాన పాఠంలో పారదర్శక అర్థంతో, పాదసూచికలో స్థలనామ ప్రత్యామ్నాయంతో ఉంచాం.
- source_word: וַיָּבֹאוּ אֶל
  choice: లోకి వెళ్లారు
  rationale: తరువాత పేర్కొన్న ఆశ్రయస్థలంలోకి కదలికను సందర్భం సూచిస్తుంది; ‘లోకి వెళ్లారు’ దిశార్థాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: צְרִיחַ
  choice: రక్షిత అంతర్గది
  rationale: ఈ అరుదైన పదం లోపలి గది, భద్రమైన గది, కోటగది వంటి అర్థాలను కలిగి ఉండవచ్చు. ఆశ్రయం పొందే సందర్భాన్ని చూపుతూ నిర్మాణాన్ని అతిగా నిర్దిష్టం చేయకుండా ‘రక్షిత అంతర్గది’ ఎంచుకున్నాం.
- source_word: בֵּית אֵל בְּרִית
  choice: ఎల్‌-బెరీత్ మందిరం
  rationale: בֵּית అక్షరార్థంగా ‘ఇల్లు’ అయినా దేవతారాధనా స్థలానికి ‘మందిరం’ సహజం. אֵל בְּרִית‌ను సమీపంలోని ‘బయల్‌-బెరీత్’తో సమన్వయపరచకుండా పేరుగా లిప్యంతరీకరించాం.
theological_decisions:
- issue: אֵל בְּרִית అనే ఆరాధ్య నామం/బిరుదు అనువాదం
  choice: ఎల్‌-బెరీత్
  alternative: ‘నిబంధన దేవుడు’; లేదా సమీప సందర్భంతో సమన్వయపరచి ‘బయల్‌-బెరీత్’
  rationale: మూలపాఠం ఇక్కడ אֵל בְּרִית అని ఉంది. అది స్వనామమా, ‘నిబంధన దేవుడు’ అనే బిరుదా అన్న సందిగ్ధతను లిప్యంతరీకరణ కాపాడుతుంది; సమీప వచనాల ఆధారంగా మూలాన్ని మార్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘షెకెము’ వంటి స్థలనామాల్లో తెలుగు బైబిల్ సంప్రదాయానికి దగ్గరైన రూపం ఉపయోగించాం. పాదసూచిక గుర్తులన్నీ సంబంధిత పదబంధాల తరువాత ప్రధాన పాఠ్యంలో ఉంచాం.
