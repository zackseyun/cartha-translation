  terminology: “నాయకులు” suitably renders the civic sense of בַּעֲלֵי. “ఏల్-బెరీత్” preserves the Hebrew name/title without resolving whether it means ‘God of the covenant.’ Footnote anchors are placed directly after the terms they qualify.
