translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకునికి అర్థమయ్యే శైలి. ఈ వాక్యం తరువాతి వచనంలో కొనసాగుతున్న షరతుల పరంపరలో భాగం కాబట్టి చివర దీర్ఘవిరామ చిహ్నం ఉంచబడింది.
