  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/עַתָּ֗ה אִם בֶּ/אֱמֶ֤ת וּ/בְ/תָמִים֙ עֲשִׂיתֶ֔ם וַ/תַּמְלִ֖יכוּ אֶת אֲבִימֶ֑לֶךְ וְ/אִם טוֹבָ֤ה עֲשִׂיתֶם֙ עִם יְרֻבַּ֣עַל וְ/עִם בֵּית֔/וֹ וְ/אִם כִּ/גְמ֥וּל יָדָ֖י/ו עֲשִׂ֥יתֶם לֽ/וֹ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/016.yaml
  text: Now therefore[a], if you have acted in truth and integrity when you made Abimelech king, and if you have dealt well with Jerubbaal and with his house, and if you have dealt with him according to the recompense of his hands,
translation:
  language: te
  text: కాబట్టి ఇప్పుడు, మీరు అబీమెలెకును రాజుగా నియమించడంలో నిజాయితీతోను యథార్థతతోను ప్రవర్తించి ఉంటే, యెరుబ్బయలుకు, అతని ఇంటివారికి మేలు చేసి ఉంటే, అతని చేతులు చేసిన దానికి తగినట్లుగా అతనితో వ్యవహరించి ఉంటే[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతని చేతుల ప్రతిఫలానికి తగినట్లుగా అతనితో వ్యవహరించి ఉంటే.” ఈ హీబ్రూ ప్రయోగం ఒక వ్యక్తి చేసిన పనులకు అనుగుణంగా అతనితో వ్యవహరించడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: కాబట్టి ఇప్పుడు
  rationale: సందర్భంలోని కాలసూచనను, ముందటి మాటల నుంచి వచ్చే నిర్ధారణాత్మక మలుపును రెండింటినీ తెలియజేస్తుంది.
- source_word: בֶּאֱמֶת וּבְתָמִים
  choice: సత్యంతోను యథార్థతతోను
  rationale: నడవడిలోని నిజాయితీ, సమగ్ర నిష్కపటత అనే జత నైతిక భావాలను సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: וַתַּמְלִיכוּ אֶת אֲבִימֶלֶךְ
  choice: అబీమెలెకును రాజుగా నియమించడంలో
  rationale: హిఫిల్ రూపంలోని ‘రాజుగా చేయడం’ అనే కారణార్థాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది; షరతు వాక్యంతో సహజంగా కలుస్తుంది.
- source_word: טוֹבָה עֲשִׂיתֶם עִם
  choice: మేలు చేసి ఉంటే
  rationale: ‘ఒకరిపట్ల మంచి చేయడం’ అనే హీబ్రూ ప్రయోగాన్ని సహజంగా తెలుగులో అందిస్తుంది.
- source_word: יְרֻבַּעַל
  choice: యెరుబ్బయలు
  rationale: మూలపాఠంలో ఉన్న పేరునే గిద్యోను అని మార్చకుండా లిప్యంతరీకరించింది.
- source_word: בֵּיתוֹ
  choice: అతని ఇంటివారు
  rationale: ఇక్కడ בַּיִת సూచించే కుటుంబ/వంశ సంబంధిత సమూహాన్ని సాధారణ తెలుగు పాఠకునికి స్పష్టంగా తెలియజేస్తుంది.
- source_word: כִּגְמוּל יָדָיו
  choice: అతని చేతుల ప్రతిఫలానికి తగినట్లుగా
  rationale: చేతులు చేసిన కార్యాలకు తగిన ప్రతిఫలం అనే హీబ్రూ రూపకాన్ని నిలుపుతూ అర్థాన్ని గ్రహించగలిగేలా చేస్తుంది.
- source_word: עֲשִׂיתֶם לוֹ
  choice: అతనితో వ్యవహరించి ఉంటే
  rationale: నైతిక పరిశీలన సందర్భంలో ‘అతనికి చేసినది’ అనే భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
