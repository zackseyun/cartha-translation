  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר לָ/הֶם֙ הַ/זַּ֔יִת הֶ/חֳדַ֨לְתִּי֙ אֶת דִּשְׁנִ֔/י אֲשֶׁר בִּ֛/י יְכַבְּד֥וּ אֱלֹהִ֖ים וַ/אֲנָשִׁ֑ים וְ/הָ֣לַכְתִּ֔י לָ/נ֖וּעַ עַל הָ/עֵצִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/009.yaml
  text: But the olive tree said to them[a], ‘Should I stop producing my oil, by which gods and men are honored[b], and go to sway over the trees?’
translation:
  language: te
  text: 'అయితే ఒలీవ చెట్టు వాటితో ఇలా అంది: “దేవుళ్లనూ[b] మనుషులనూ ఘనపరచే నా సమృద్ధిని[a] నేను విడిచిపెట్టి, చెట్లపై ఊగడానికి వెళ్లాలా?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “నా కొవ్వును” లేదా “నా సమృద్ధిని”; ఇది ఒలీవ చెట్టు ఇచ్చే పుష్కలమైన నూనెను సూచించే రూపకం.
    reason: lexical_alternative
  - marker: b
    text: “దేవుళ్లను” అనే చోట “దేవుణ్ణి” అని కూడా అనువదించవచ్చు. హీబ్రూ పదరూపమూ దానితో ఉన్న క్రియయూ బహువచనంలో ఉన్నాయి; అయితే ఆరాధనలో ఒలీవ నూనె వాడబడినందున అనేక అనువాదాలు ఇక్కడ నిజ దేవుణ్ణి సూచిస్తున్నట్లు తీసుకుంటాయి.
    reason: alternative_reading
lexical_decisions:
- source_word: הַזַּיִת
  choice: ఒలీవ చెట్టు
  rationale: కథలో మాట్లాడే పాత్ర చెట్టే కాబట్టి, కేవలం ఫలాన్ని సూచించే ‘ఒలీవ’ కంటే ‘ఒలీవ చెట్టు’ స్పష్టంగా, సహజంగా ఉంది.
- source_word: הֶחֳדַלְתִּי
  choice: నేను విడిచిపెట్టి ... వెళ్లాలా?
  rationale: పూర్తయిన క్రియారూపం సందర్భంలో అలంకారప్రశ్నగా పనిచేస్తోంది; తెలుగు ప్రశ్నార్థక నిర్మాణం ఆ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: דִּשְׁנִי
  choice: నా పుష్టిని
  rationale: మూలపదానికి అక్షరార్థంగా ‘నా కొవ్వు/సమృద్ధి’ అనే భావం ఉంది; ఒలీవ చెట్టు సందర్భంలో నూనెతో కూడిన సారవంతమైన దిగుబడిని సూచిస్తుంది. ‘పుష్టి’ రూపకాన్ని నిలుపుతూ తెలుగులో అర్థమయ్యేలా ఉంది.
- source_word: אֲשֶׁר בִּי
  choice: ఉపయోగపడే
  rationale: ‘దాని ద్వారా/దానితో’ అనే సాధనార్థాన్ని సహజమైన తెలుగు సంబంధవాక్యంగా అందిస్తుంది.
- source_word: יְכַבְּדוּ
  choice: ఘనపరచడానికి
  rationale: హీబ్రూలో క్రియ కర్తరి బహువచనంలో ఉన్నా కర్త చెప్పబడలేదు. ప్రయోజనార్థక తెలుగు నిర్మాణం అనిర్దిష్ట కర్తను జోడించకుండా గౌరవించడం/ఘనపరచడం అనే భావాన్ని నిలుపుతుంది.
- source_word: אֱלֹהִים
  choice: దేవుళ్లను
  rationale: పదరూపం బహువచనం; దానితో ఉన్న క్రియ కూడా బహువచనం. అందువల్ల ప్రధాన పాఠ్యంలో బహువచనాన్ని నిలిపాం; ‘దేవుణ్ణి’ అనే సాంప్రదాయ పఠనాన్ని పాదటిప్పణిలో ఇచ్చాం.
- source_word: וַאֲנָשִׁים
  choice: మనుషులను
  rationale: ఇక్కడ సమష్టిగా మానవులను సూచించే సహజమైన ఆధునిక తెలుగు పదం.
- source_word: לָנוּעַ עַל הָעֵצִים
  choice: చెట్లపై ఊగుతూ ఏలడానికి
  rationale: נוּעַ యొక్క ఊగడం/అటుఇటు కదలడం అనే చెట్టు-రూపకాన్ని, ఈ కథలో సూచితమైన రాజ్యాధికార భావంతో కలిపి వ్యక్తం చేస్తుంది. ‘ఏలడానికి’ సందర్భార్థాన్ని స్పష్టం చేసినప్పటికీ రూపకమైన ‘ఊగుతూ’ను తొలగించదు.
theological_decisions:
- issue: אֱלֹהִים అనే పదం ఇక్కడ ఎవరిని సూచిస్తుంది?
  choice: దేవుళ్లు
  alternative: దేవుడు
  rationale: బహువచన నామరూపం, బహువచన క్రియ ప్రధాన పాఠ్యంలో ‘దేవుళ్లు’ను సమర్థిస్తాయి. అయితే ఆరాధనలో ఒలీవ నూనె వాడుకను దృష్టిలో ఉంచుకొని దీనిని నిజ దేవునికి వర్తింపజేసే పురాతన అనువాద సంప్రదాయం ఉంది; అందుకే ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో భద్రపరిచాం.
- issue: לָנוּעַ లో పాలన భావం ప్రత్యక్షమా లేక సందర్భసిద్ధమా?
  choice: ఊగుతూ ఏలడానికి
  alternative: చెట్లపై ఊగడానికి
  rationale: క్రియ ప్రత్యక్షంగా ఊగడం లేదా అటుఇటు కదలడాన్ని సూచిస్తుంది; చుట్టుపక్కల రాజును నియమించుకునే కథన సందర్భం పాలన భావాన్ని ఇస్తుంది. రెండు స్థరాలనూ కలిపి ఉంచడం ద్వారా పదచిత్రాన్నీ సందర్భాన్నీ కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి. చెట్టు మాట్లాడే నీతికథ స్వభావాన్ని స్త్రీలింగ క్రియ ‘అంది’తో సహజంగా వ్యక్తం చేశాం. మూలంలోని ‘పుష్టి/కొవ్వు’ రూపకాన్ని ప్రధాన పాఠ్యంలో ఉంచి, నూనె అనే సందర్భార్థాన్ని పాదటిప్పణిలో వివరించాం. అన్ని పాదటిప్పణి సూచికలు ప్రధాన పాఠ్యంలో ఉన్నాయి.
