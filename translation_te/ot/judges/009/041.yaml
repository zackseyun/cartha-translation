source:
  edition: WLC
  text: וַ/יֵּ֥שֶׁב אֲבִימֶ֖לֶךְ בָּ/ארוּמָ֑ה וַ/יְגָ֧רֶשׁ זְבֻ֛ל אֶת גַּ֥עַל וְ/אֶת אֶחָ֖י/ו מִ/שֶּׁ֥בֶת בִּ/שְׁכֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/041.yaml
  text: And Abimelech stayed in Arumah[a], and Zebul drove Gaal and his brothers out from dwelling in Shechem.
translation:
  language: te
  text: అబీమెలెకు అరూమాలో ఉండిపోయాడు, జెబూలు గయాలును అతని సహోదరులనూ షెకెములో నివసించకుండా వెళ్లగొట్టాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: ఉండిపోయాడు
  rationale: ישׁב ఇక్కడ కూర్చోవడం కంటే ఒక చోట ఉండడం లేదా అక్కడే నిలిచిపోవడం అనే భావాన్ని ఇస్తుంది. యుద్ధకథన సందర్భంలో ‘ఉండిపోయాడు’ సహజంగా ఉంది; దీర్ఘకాల నివాసాన్ని తప్పనిసరిగా సూచించదు.
- source_word: בָּארוּמָה
  choice: అరూమాలో
  rationale: అరూమా స్థలనామం; హీబ్రూ ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించి, בְּ ఉపసర్గను తెలుగు స్థానవాచక విభక్తితో వ్యక్తపరిచాం.
- source_word: וַיְגָרֶשׁ
  choice: వెళ్లగొట్టాడు
  rationale: גרשׁ బలవంతంగా బయటకు పంపడం లేదా తరిమివేయడం అనే భావాన్ని ఇస్తుంది. ‘వెళ్లగొట్టాడు’ ఆధునిక తెలుగులో సహజంగా ఉండి ఆ బలమైన తొలగింపు భావాన్ని నిలుపుతుంది.
- source_word: זְבֻל
  choice: జెబులు
  rationale: వ్యక్తి పేరును హీబ్రూ రూపానికి దగ్గరగా తెలుగులో లిప్యంతరీకరించాం.
- source_word: גַּעַל
  choice: గాలు
  rationale: వ్యక్తి పేరును హీబ్రూ రూపానికి దగ్గరగా తెలుగులో లిప్యంతరీకరించాం; చివరి ע ధ్వనిని ప్రత్యేక చిహ్నంతో భారంగా చూపకుండా సహజ తెలుగు రూపాన్ని ఎంచుకున్నాం.
- source_word: אֶחָיו
  choice: అతని సహోదరులను
  rationale: אָח సాధారణంగా ‘సోదరుడు’ అని అర్థం. బంధువులు లేదా అనుచరులు అనే విస్తృత అర్థం ఇక్కడ నిర్బంధంగా అవసరం లేదు; గౌరవప్రద కథనశైలికి ‘సహోదరులు’ అనుకూలం.
- source_word: מִשֶּׁבֶת
  choice: నివసించకుండా
  rationale: מן తో కూడిన ישׁב ధాతువు infinitive construct వారిని అక్కడ నివసించనీయకుండా తొలగించాడనే నిరోధక భావాన్ని ఇస్తుంది. తెలుగు వాక్యనిర్మాణంలో ‘నివసించకుండా వెళ్లగొట్టాడు’ ఆ సంబంధాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: בִּשְׁכֶם
  choice: షెకెములో
  rationale: షెకెము స్థలనామం; בְּ లోని స్థానార్థాన్ని తెలుగు ‘లో’ ద్వారా వ్యక్తపరిచాం.
