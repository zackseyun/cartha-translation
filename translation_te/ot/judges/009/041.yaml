- from: అబీమెలెకు అరూమాలో ఉండిపోయాడు; జెబులు గాలును, అతని సహోదరులను షెకెములో నివసించకుండా వెళ్లగొట్టాడు.
  to: అబీమెలెకు అరూమాలో ఉండిపోయాడు, జెబూలు గయాలును అతని సహోదరులనూ షెకెములో నివసించకుండా వెళ్లగొట్టాడు.
