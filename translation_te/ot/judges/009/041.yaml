translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు, గంభీరమైన కథనశైలి. ‘నివసించకుండా వెళ్లగొట్టాడు’ అనే నిర్మాణం హీబ్రూలోని నిరోధం/బహిష్కరణ భావాన్ని సహజ తెలుగులో నేరుగా తెలియజేస్తుంది. పాఠ్యంలో పాదటిప్పణి అవసరం లేదు.
