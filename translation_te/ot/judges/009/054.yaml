id: JDG.9.54
reference: Judges 9:54
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּקְרָ֨א מְהֵרָ֜ה אֶל הַ/נַּ֣עַר נֹשֵׂ֣א כֵלָ֗י/ו וַ/יֹּ֤אמֶר ל/וֹ֙ שְׁלֹ֤ף חַרְבְּ/ךָ֙ וּ/מ֣וֹתְתֵ֔/נִי פֶּן יֹ֥אמְרוּ לִ֖/י אִשָּׁ֣ה הֲרָגָ֑תְ/הוּ וַ/יִּדְקְרֵ֥/הוּ נַעֲר֖/וֹ וַ/יָּמֹֽת־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/054.yaml
  text: Then he quickly called to the young man who carried his weapons and said to him[a], “Draw your sword and kill me, lest they say of me, ‘A woman killed him.’” So his young man pierced him through, and he died.
translation:
  language: te
  text: అప్పుడు అతడు తన ఆయుధాలు మోసే యువకుణ్ణి[a] త్వరగా పిలిచి, “నీ కత్తిని బయటకు తీసి నన్ను చంపు. లేకపోతే, ‘ఒక స్త్రీ అతణ్ణి చంపింది’ అని నా గురించి అంటారు” అన్నాడు. అప్పుడు అతని యువకుడు అతణ్ణి పొడిచాడు, అతడు చనిపోయాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, మరింత సహజంగా, “తన ఆయుధవాహకుణ్ణి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא מְהֵרָה
  choice: త్వరగా పిలిచి
  rationale: కథన క్రమాన్ని సహజమైన తెలుగులో కొనసాగిస్తూ, מְהֵרָה సూచించే తొందరను స్పష్టంగా తెలియజేస్తుంది.
- source_word: הַנַּעַר נֹשֵׂא כֵלָיו
  choice: తన ఆయుధాలు మోసే యువకుణ్ణి
  rationale: నַעַר యొక్క ప్రాథమిక భావమైన ‘యువకుడు’ను, כֵּלִים యొక్క సందర్భానుగుణ భావమైన ఆయుధ సామగ్రిని పారదర్శకంగా నిలుపుతుంది; ‘ఆయుధవాహకుడు’ అనే పదం పాదసూచికలో ప్రత్యామ్నాయంగా ఇవ్వబడింది.
- source_word: שְׁלֹף חַרְבְּךָ
  choice: నీ కత్తి దూసి
  rationale: ఒరలోనుంచి కత్తిని బయటకు తీయడాన్ని సూచించే ఆజ్ఞను సహజమైన తెలుగు ప్రయోగంతో అందిస్తుంది.
- source_word: וּמוֹתְתֵנִי
  choice: నన్ను చంపు
  rationale: సందర్భంలో తన మరణాన్ని కలిగించమనే ప్రత్యక్ష ఆజ్ఞను సంక్షిప్తంగా, స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: פֶּן יֹאמְרוּ לִי
  choice: లేకపోతే ... అని నా గురించి చెప్పుకుంటారు
  rationale: פֶּן యొక్క ప్రతికూల ఫలిత/నివారణ భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; לִי ఇక్కడ తన గురించి ప్రజలు చెప్పే మాటను సూచిస్తుంది.
- source_word: אִשָּׁה הֲרָגָתְהוּ
  choice: ‘ఒక స్త్రీ అతణ్ణి చంపింది’
  rationale: హీబ్రూ వాక్యంలో ‘స్త్రీ’కి ఉన్న ముందస్తు ప్రాధాన్యాన్ని, ప్రత్యక్ష వాక్యాన్ని నిలుపుతుంది.
- source_word: וַיִּדְקְרֵהוּ
  choice: అతణ్ణి కత్తితో పొడిచాడు
  rationale: ఆయుధంతో పొడవడం అనే క్రియ యొక్క స్పష్టమైన భావాన్ని తెలుగులో అందిస్తుంది; కత్తి మునుపటి ఆజ్ఞనుంచి సందర్భపరంగా స్పష్టమవుతుంది.
- source_word: נַעֲרוֹ
  choice: అతని యువకుడు
  rationale: వచనంలోని ముందటి נַעַר పదంతో పదసామ్యాన్ని నిలుపుతుంది; సంబంధిత పాత్ర ఆయుధాలు మోసే యువకుడే.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైన కథన శైలి. మూలంలోని ‘యువకుడు/అతని యువకుడు’ పదసామ్యాన్ని నిలిపి, పాత్ర యొక్క విధిని పాదసూచికలో ‘ఆయుధవాహకుడు’గా సూచించాం.
