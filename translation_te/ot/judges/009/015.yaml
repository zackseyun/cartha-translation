source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר הָ/אָטָד֮ אֶל הָ/עֵצִים֒ אִ֡ם בֶּ/אֱמֶ֣ת אַתֶּם֩ מֹשְׁחִ֨ים אֹתִ֤/י לְ/מֶ֨לֶךְ֙ עֲלֵי/כֶ֔ם בֹּ֖אוּ חֲס֣וּ בְ/צִלִּ֑/י וְ/אִם אַ֕יִן תֵּ֤צֵא אֵשׁ֙ מִן הָ֣/אָטָ֔ד וְ/תֹאכַ֖ל אֶת אַרְזֵ֥י הַ/לְּבָנֽוֹן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/015.yaml
  text: Then the bramble said to the trees[a], ‘If you are truly anointing me as king over you, come, take refuge in my shade; but if not[c][b], let fire come out from the bramble and consume the cedars of Lebanon.’
translation:
  language: te
  text: 'అప్పుడు ముళ్లపొద చెట్లతో ఇలా అంది: “మీరు నిజంగానే నన్ను మీ మీద రాజుగా అభిషేకిస్తున్నట్లయితే, వచ్చి నా నీడలో ఆశ్రయం పొందండి.[a] లేకపోతే, ముళ్లపొదలోనుండి అగ్ని బయలుదేరి లెబానోను దేవదారు చెట్లను దహించుగాక.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ఆశ్రయం పొందండి’ అనే మాటకు ‘రక్షణ కోసం నా నీడను ఆశ్రయించండి’ అని కూడా అనువదించవచ్చు. చాలా తక్కువ నీడనిచ్చే ముళ్లపొద ఈ మాట చెప్పడంలో వ్యంగ్యం ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ముళ్లపొదలోనుండి అగ్ని బయలుదేరి లెబానోను దేవదారు చెట్లను దహిస్తుంది.” హెబ్రీ క్రియారూపం శాపోక్తిని గానీ, జరగబోయేదాని ప్రకటనను గానీ సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאָטָד
  choice: ముళ్లపొద
  rationale: ఈ హెబ్రీ పదం ముళ్లు గల పొదను సూచిస్తుంది. కథలోని చెట్లతో వ్యత్యాసాన్ని స్పష్టంగా చూపుతూ సాధారణ తెలుగు పాఠకులకు సహజంగా అర్థమయ్యే పదం.
- source_word: אִם בֶּאֱמֶת
  choice: మీరు నిజంగానే
  rationale: చెట్లు తనను రాజుగా చేయడంలోని యథార్థతను ప్రశ్నించే షరతును సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: מֹשְׁחִים אֹתִי לְמֶלֶךְ
  choice: నన్ను ... రాజుగా అభిషేకిస్తున్నట్లయితే
  rationale: משׁח పదంలోని రాజాభిషేక భావచిత్రాన్ని ‘రాజుగా చేస్తున్నారు’ అని సరళీకరించకుండా నిలుపుతుంది.
- source_word: בֹּאוּ חֲסוּ בְצִלִּי
  choice: వచ్చి నా నీడలో ఆశ్రయం పొందండి
  rationale: చేరువకు రావడం, రక్షణ కోసం ఆశ్రయించడం అనే రెండు ఆజ్ఞల భావాన్ని కాపాడుతుంది; ముళ్లపొద ఇచ్చే నీడ స్వల్పమనే వ్యంగ్యార్థాన్నీ అలాగే ఉంచుతుంది.
- source_word: וְאִם אַיִן
  choice: లేకపోతే
  rationale: ముందున్న షరతుకు విరుద్ధమైన పరిణామాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: תֵּצֵא אֵשׁ מִן הָאָטָד
  choice: ముళ్లపొదలోనుండి అగ్ని బయలుదేరి
  rationale: హెబ్రీ అసంపూర్ణ క్రియకు ఇక్కడ శాపోక్తి లేదా భవిష్యద్వచనం అనే రెండు సాధ్య భావాలు ఉన్నాయి; ప్రధాన పాఠంలోని ‘దహించుగాక’ శాపోక్తి బలాన్ని వ్యక్తం చేస్తుంది, ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇస్తుంది.
- source_word: וְתֹאכַל
  choice: దహించుగాక
  rationale: అగ్ని విషయంగా אכל అంటే కాల్చి నాశనం చేయడం. ‘దహించుగాక’ జస్సివ్‌లాంటి శాపోక్తి స్వరాన్ని తెలుగులో నిలుపుతుంది.
- source_word: אַרְזֵי הַלְּבָנוֹן
  choice: లెబానోను దేవదారు చెట్లు
  rationale: వైభవానికి పేరుగాంచిన లెబానోను దేవదారులను సూచించే మూలభాషా పదబంధాన్ని స్పష్టంగా అందిస్తుంది.
theological_decisions:
- issue: అగ్ని బయలుదేరడం శాపోక్తా లేక భవిష్యద్వచనమా
  choice: ‘దహించుగాక’ అనే శాపోక్తి రూపం
  alternative: ‘అగ్ని బయలుదేరి ... దహిస్తుంది’ అనే భవిష్యద్వచనం
  rationale: ఈ సందర్భంలోని హెబ్రీ అసంపూర్ణ క్రియను జస్సివ్‌లాంటి శాపోక్తిగా లేదా ముందస్తు ప్రకటనగా గ్రహించవచ్చు. కథలోని బెదిరింపు స్వరానికి శాపోక్తి బాగా సరిపోతుంది; అయినా నిజమైన వ్యాకరణ సందిగ్ధతను పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు సులభంగా అర్థమయ్యేలా, అయితే నీతికథలోని గంభీరత, వ్యంగ్యం, బెదిరింపు స్వరం నిలిచేలా రూపొందించబడింది. ‘అభిషేకిస్తున్నారు,’ ‘ఆశ్రయం,’ ‘దహించుగాక’ వంటి పదాలు మూలంలోని రాజసంబంధ, రక్షణసంబంధ, శాపోక్తి భావాలను కాపాడుతాయి.
