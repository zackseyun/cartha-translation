source:
  edition: WLC
  text: לָ/ב֕וֹא חֲמַ֖ס שִׁבְעִ֣ים בְּנֵֽי יְרֻבָּ֑עַל וְ/דָמָ֗/ם לָ/שׂ֞וּם עַל אֲבִימֶ֤לֶךְ אֲחִי/הֶם֙ אֲשֶׁ֣ר הָרַ֣ג אוֹתָ֔/ם וְ/עַל֙ בַּעֲלֵ֣י שְׁכֶ֔ם אֲשֶׁר חִזְּק֥וּ אֶת יָדָ֖י/ו לַ/הֲרֹ֥ג אֶת אֶחָֽי/ו־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/024.yaml
  text: so that the violence done to the seventy sons of Jerubbaal might come[a], and their blood be laid on Abimelech their brother, who killed them, and on the leaders of Shechem[c][b], who strengthened his hands to kill his brothers.
translation:
  language: te
  text: యెరుబ్బయలు డెబ్బై మంది కుమారులకు జరిగిన హింస వచ్చునట్లుగాను, వారి రక్తం వారిని చంపిన వారి సహోదరుడైన అబీమెలెకు మీదను, అబీమెలెకు తన సహోదరులను చంపుటకు అతని చేతులను బలపరచిన షెకెము నాయకుల[c][b] మీదను మోపబడునట్లుగాను[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘వారి రక్తం ... మీద మోపబడడం’ అంటే వారి హత్యకు సంబంధించిన అపరాధం లేదా బాధ్యత వారిపై ఉంచబడడం.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘షెకెము అధిపతులు’; హీబ్రూ పదం నగరంలోని ప్రముఖులను లేదా అధికారవంతులను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: ‘అతని చేతులను బలపరచడం’ అంటే అతనికి మద్దతిచ్చి, అతనిని ప్రోత్సహించడం.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָבוֹא חֲמַס
  choice: జరిగిన హింస తిరిగి వచ్చేలాగునూ
  rationale: ల־తో కూడిన క్రియారూపం సందర్భంలో ఉద్దేశం లేదా ఫలితాన్ని సూచిస్తుంది. חמס అన్యాయపూరిత హింసను సూచిస్తుంది; ‘తిరిగి వచ్చు’ అనే ప్రయోగం ఆ హింస చేసినవారిపై దాని పరిణామం రావడాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: שִׁבְעִים בְּנֵי יְרֻבָּעַל
  choice: యెరుబ్బయలు డెబ్బై మంది కుమారులు
  rationale: హీబ్రూ సంఖ్యా-సంబంధ నిర్మాణాన్ని స్పష్టమైన ఆధునిక తెలుగులో అందిస్తుంది; వ్యక్తినామాన్ని లిప్యంతరీకరించింది.
- source_word: וְדָמָם לָשׂוּם עַל
  choice: వారి రక్తం ... మీద మోపబడేలాగునూ
  rationale: చిందించిన రక్తానికి బాధ్యతను నిందితులపై ఉంచే హీబ్రూ న్యాయ-నైతిక రూపకాన్ని పరిష్కరించకుండా నిలుపుతుంది.
- source_word: אֲבִימֶלֶךְ אֲחִיהֶם
  choice: వారి సహోదరుడైన అబీమెలెకు
  rationale: అబీమెలెకు హతుల సహోదరుడనే వ్యంగ్యభరిత సంబంధాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: בַּעֲלֵי שְׁכֶם
  choice: షెకెము నాయకులు
  rationale: ఇక్కడ בעלי నగరంలోని అధికారవంతులు లేదా ప్రముఖులను సూచిస్తుంది; ‘నాయకులు’ సాధారణ పాఠకులకు సహజంగా ఆ సామాజిక-రాజకీయ భావాన్ని అందిస్తుంది.
- source_word: חִזְּקוּ אֶת יָדָיו
  choice: అతని చేతులను బలపరచిన
  rationale: మద్దతు ఇచ్చారనే భావమున్న హీబ్రూ నుడికారపు శరీరరూపకాన్ని ప్రధాన పాఠ్యంలో నిలుపుతుంది.
- source_word: לַהֲרֹג אֶת אֶחָיו
  choice: తన సహోదరులను చంపడానికి
  rationale: ఉద్దేశాన్ని తెలిపే infinitive నిర్మాణాన్ని నేరుగా, సహజంగా అనువదిస్తుంది; אֶחָיו ఇక్కడ పురుష సహోదరులను సూచిస్తుంది.
theological_decisions:
- issue: చిందించిన రక్తానికి బాధ్యతను తెలిపే రూపకం
  choice: ‘వారి రక్తం ... మీద మోపబడేలాగునూ’ అనే రూపకాన్ని నిలుపడం
  alternative: ‘వారి హత్యాపరాధం వారిపై మోపబడేలాగునూ’
  rationale: మూలంలోని ‘రక్తం’ అనే నిబంధనాత్మక-న్యాయ రూపకం హత్యకు సంబంధించిన బాధ్యతను సూచిస్తుంది. దాన్ని ‘హత్యాపరాధం’గా పూర్తిగా వివరిస్తే మూలంలోని రూపకమూ దాని భావ ఉద్రిక్తతా తగ్గిపోతాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన కథన శైలి. హీబ్రూ రక్తబాధ్యత రూపకాన్నీ ‘చేతులను బలపరచడం’ అనే నుడికారాన్నీ ప్రధాన పాఠ్యంలో నిలిపి, పాదసూచికల్లో అర్థాన్ని స్పష్టం చేసింది. ‘ఇది జరిగింది’ అనేది ముందరి వచనంతో ఉన్న ఉద్దేశ/ఫలిత సంబంధాన్ని స్వతంత్ర వచనంగా చదివేటప్పుడు చూపడానికి చేర్చబడింది.
