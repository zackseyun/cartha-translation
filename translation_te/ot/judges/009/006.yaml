source:
  edition: WLC
  text: וַ/יֵּאָ֨סְפ֜וּ כָּל בַּעֲלֵ֤י שְׁכֶם֙ וְ/כָל בֵּ֣ית מִלּ֔וֹא וַ/יֵּ֣לְכ֔וּ וַ/יַּמְלִ֥יכוּ אֶת אֲבִימֶ֖לֶךְ לְ/מֶ֑לֶךְ עִם אֵל֥וֹן מֻצָּ֖ב אֲשֶׁ֥ר בִּ/שְׁכֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/006.yaml
  text: Then all the leaders of Shechem and all Beth-millo gathered together[b][a], and they went and made Abimelech king beside the oak pillar that was in Shechem.
translation:
  language: te
  text: అప్పుడు షెకెము నాయకులందరూ, బేత్‌-మిల్లో వారందరూ[a] కూడారు. వారు షెకెములో ఉన్న నిలువురాయిగల ఓక్ చెట్టు దగ్గర అబీమెలెకును రాజుగా నియమించారు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “బేత్‌-మిల్లో” అంటే “మిల్లో గృహం” కావచ్చు; అయితే ఇక్కడ అది ఒక స్థలం లేదా వర్గం పేరుగా వాడబడినట్లు కనిపిస్తుంది.
    reason: cultural_note
  - marker: b
    text: మూలభాషలోని పదబంధం క్లిష్టమైనది. దీనిని “నిలువురాయితో సంబంధమున్న ఓక్ చెట్టు దగ్గర” లేదా “నిలువురాయి/స్తంభం దగ్గర ఉన్న ఓక్ చెట్టు వద్ద” అని అర్థం చేసుకోవచ్చు. “నిలువురాయి” అనే పదానికి స్తంభం లేదా నిలబెట్టిన గుర్తు అనే అర్థం కూడా ఉండవచ్చు; వృక్షం ఓక్ లేదా టెరెబింతు జాతికి చెందినదై ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּעֲלֵי שְׁכֶם
  choice: షెకెము నాయకులు
  rationale: పదానికి అక్షరార్థంగా ‘యజమానులు/ప్రభువులు’ అనే భావం ఉన్నా, ఇక్కడ నగరంలోని అధికారంగల ప్రముఖులను సూచిస్తుంది; ‘నాయకులు’ ఆధునిక తెలుగులో సహజంగా ఆ రాజకీయ భావాన్ని అందిస్తుంది.
- source_word: בֵּית מִלּוֹא
  choice: బేత్‌-మిల్లో వారు
  rationale: ఇది స్థలాన్నో వర్గాన్నో సూచించే నామంలా పనిచేస్తోంది. ‘వారందరూ’ అనే ప్రయోగం అక్కడి సమూహాన్ని సూచిస్తూ, అనిశ్చిత నామాన్ని అనువదించి అతిగా నిర్ధారించదు.
- source_word: וַיַּמְלִיכוּ ... לְמֶלֶךְ
  choice: అబీమెలెకును రాజుగా నియమించారు
  rationale: హిఫిల్ రూపం ఒకరిని రాజుగా చేయడాన్ని సూచిస్తుంది. ‘నియమించారు’ ఆ చర్యను సహజంగా తెలుపుతుంది; మూలంలో లేని కిరీటధారణ ఆచారాన్ని చేర్చదు.
- source_word: עִם
  choice: పక్కన
  rationale: ఈ సందర్భంలో గుర్తించదగిన స్థలానికి సమీపాన్ని సూచిస్తుంది.
- source_word: אֵלוֹן
  choice: సింధూర వృక్షం
  rationale: אֵלוֹן ఒక పెద్ద ఓక్ లేదా టెరెబింతు జాతి వృక్షాన్ని సూచించవచ్చు. తెలుగు బైబిలు వాడుకలో తెలిసిన ‘సింధూర వృక్షం’ను ఎంచుకున్నప్పటికీ, జాతి అనిశ్చితిని పాదటిప్పణిలో నిలిపాం.
- source_word: מֻצָּב
  choice: నిలువురాయి
  rationale: నిలబెట్టబడిన వస్తువు లేదా స్తంభం అనే ప్రాథమిక భావాన్ని అందిస్తుంది. సందర్భంలో ఇది గుర్తుగా నిలిపిన రాయై ఉండవచ్చు; ఖచ్చిత భావం అనిశ్చితం.
- source_word: וַיֵּאָסְפוּ
  choice: సమావేశమయ్యారు
  rationale: సమూహంగా కూడడాన్ని ఆధునిక, గౌరవప్రదమైన తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
