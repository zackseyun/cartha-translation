  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. స్థలనామాలను లిప్యంతరీకరించాం; మూలంలోని రెండు ముఖ్య అనిశ్చితులను పాదటిప్పణుల్లో స్పష్టంగా ఉంచాం.
