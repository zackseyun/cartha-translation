revisions:
- from: అప్పుడు ఏబెదు కుమారుడైన గయాలు తన సహోదరులతో[a] వచ్చి, వారు షెకెములోకి ప్రవేశించారు.[b] షెకెము పెద్దలు[c] అతనిపై నమ్మకం ఉంచారు.
  to: అప్పుడు ఏబెదు కుమారుడైన గయాలు మరియు అతని సహోదరులు వచ్చి షెకెములోకి దాటి వెళ్లారు.[a] షెకెము నాయకులు[b] అతనిమీద నమ్మకం ఉంచారు.
  rationale: The revision retains the Hebrew plural subject explicitly, avoids restricting עבר to mere entry, uses a clearer designation for Shechem’s power-holders, and keeps the relevant lexical ambiguity in anchored footnotes. The former note on “with his brothers” is unnecessary after rendering the Hebrew coordination directly.
