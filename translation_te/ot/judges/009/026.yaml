source:
  edition: WLC
  text: וַ/יָּבֹ֞א גַּ֤עַל בֶּן עֶ֨בֶד֙ וְ/אֶחָ֔י/ו וַ/יַּעַבְר֖וּ בִּ/שְׁכֶ֑ם וַ/יִּבְטְחוּ ב֖/וֹ בַּעֲלֵ֥י שְׁכֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/026.yaml
  text: Then Gaal son of Ebed came with his brothers and crossed into Shechem[c][b][a], and the leaders of Shechem put their trust in him.
translation:
  language: te
  text: అప్పుడు ఏబెదు కుమారుడైన గయాలు మరియు అతని సహోదరులు వచ్చి షెకెములోకి దాటి వెళ్లారు.[a] షెకెము నాయకులు[b] అతనిమీద నమ్మకం ఉంచారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘షెకెము గుండా వెళ్లారు’ లేదా ‘షెకెములోకి వెళ్లారు’; హీబ్రూ క్రియకు దాటడం లేదా గుండా వెళ్లడం అనే భావాలు ఉన్నాయి. ఈ సందర్భంలో కదలిక యొక్క ఖచ్చితమైన ఛాయ స్పష్టంగా లేదు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా ‘షెకెము యజమానులు’; ఈ హీబ్రూ పదబంధం నగరంలోని అధికారమున్న ప్రముఖులను లేదా పాలకవర్గాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: అప్పుడు ... వచ్చి
  rationale: వావ్-వరుస కథనాన్ని ముందుకు నడిపిస్తుంది. ‘అప్పుడు’ సహజమైన తెలుగు కథన క్రమాన్ని తెలియజేస్తుంది; ‘వచ్చి’ తరువాతి క్రియతో వాక్యాన్ని సులభంగా కలుపుతుంది.
- source_word: גַּעַל
  choice: గయాలు
  rationale: వ్యక్తి పేరును తెలుగు ధ్వని సంప్రదాయానికి అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: בֶּן עֶבֶד
  choice: ఏబెదు కుమారుడైన
  rationale: హీబ్రూ పితృనామ నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగు రూపంలో వ్యక్తపరుస్తుంది.
- source_word: וְאֶחָיו
  choice: తన సహోదరులతో
  rationale: హీబ్రూలో అక్షరార్థంగా ‘మరియు అతని సహోదరులు’ ఉన్నా, రావడంలో తోడును సూచించే సహజమైన తెలుగు ప్రయోగం ‘సహోదరులతో’.
- source_word: וַיַּעַבְרוּ בִּשְׁכֶם
  choice: వారు షెకెములోకి ప్రవేశించారు
  rationale: עבר కదలికను, దాటడం లేదా వెళ్లడాన్ని సూచిస్తుంది. ఇక్కడ స్థలపేరుతో వచ్చిన בְּ కారణంగా నగరంలోకి కదలివెళ్లిన భావాన్ని ‘ప్రవేశించారు’ స్పష్టంగా, సహజంగా అందిస్తుంది; ‘వారు’ అనేది బహువచన క్రియను నిలుపుతుంది.
- source_word: וַיִּבְטְחוּ בוֹ
  choice: అతనిపై నమ్మకం ఉంచారు
  rationale: בטח + בְּ ఒక వ్యక్తిపై విశ్వాసం లేదా ఆధారం ఉంచడాన్ని సూచిస్తుంది. ఈ తెలుగు ప్రయోగం ఆ సంబంధాత్మక నమ్మకాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: בַּעֲלֵי שְׁכֶם
  choice: షెకెము పెద్దలు
  rationale: ఇక్కడ בעלי అనేది నగరంలోని అధికారమున్న ప్రముఖులను సూచిస్తుంది; యజమానులనే అక్షరార్థం కంటే ‘పెద్దలు’ ఆధునిక పాఠకులకు సామాజిక-రాజకీయ భావాన్ని సులభంగా తెలియజేస్తుంది.
