translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథన శైలిని వాడాం. పేర్లకు సాధారణ బైబిలు తెలుగు లిప్యంతరీకరణను అనుసరించాం. עבר మరియు בעלי పదాల్లోని నిజమైన అర్థ వైవిధ్యాన్ని పాదటిప్పణుల్లో నిలిపాం.
