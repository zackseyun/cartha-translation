  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְדַבְּר֨וּ אֲחֵֽי אִמּ֜/וֹ עָלָ֗י/ו בְּ/אָזְנֵי֙ כָּל בַּעֲלֵ֣י שְׁכֶ֔ם אֵ֥ת כָּל הַ/דְּבָרִ֖ים הָ/אֵ֑לֶּה וַ/יֵּ֤ט לִבָּ/ם֙ אַחֲרֵ֣י אֲבִימֶ֔לֶךְ כִּ֥י אָמְר֖וּ אָחִ֥י/נוּ הֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/003.yaml
  text: And his mother’s brothers spoke all these words about him in the hearing of all the leaders of Shechem[a], and their hearts turned after Abimelech, for they said[b], “He is our brother.”
translation:
  language: te
  text: అతని తల్లి సోదరులు అతని గురించి ఈ మాటలన్నిటినీ షెకెము నాయకులందరికీ[a] చెప్పారు. అప్పుడు వారి మనసు అబీమెలెకు వైపు మొగ్గింది; ఎందుకంటే, “అతడు మన సోదరుడు” అని వారు అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “షెకెము అధిపతులందరికీ,” లేదా “షెకెములోని ప్రముఖులందరికీ.” హీబ్రూ పదబంధం పట్టణంలోని ప్రభావశీల పురుషులను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבְּרוּ
  choice: వినిపించారు
  rationale: ఇక్కడ పియేల్ క్రియతో పాటు ‘వారి చెవుల్లో’ అనే ప్రయోగం ఉంది. ప్రతిపాదనను నాయకులకు తెలియజేసిన భావాన్ని సహజమైన తెలుగులో ఇది వ్యక్తం చేస్తుంది.
- source_word: אֲחֵי אִמּוֹ
  choice: అతని తల్లి సోదరులు
  rationale: ఈ నిర్మాణం అతని తల్లి యొక్క మగ సహోదరులను నిర్దిష్టంగా సూచిస్తుంది; విస్తృత బంధువర్గాన్ని కాదు.
- source_word: עָלָיו
  choice: అతని గురించి
  rationale: అబీమెలెకు విషయమై మాట్లాడారనే ప్రత్యక్ష భావాన్ని నిలుపుతుంది; ‘అతని తరఫున’ అని అనువదిస్తే ఉద్దేశాన్ని మరీ స్పష్టీకరించినట్లవుతుంది.
- source_word: בְּאָזְנֵי
  choice: వినిపించారు
  rationale: అక్షరార్థంగా ‘చెవుల్లో’ అయిన ఈ జాతీయం, శ్రోతలకు వినిపించేలా చెప్పడాన్ని సూచిస్తుంది. తెలుగులో క్రియలోనే ఆ భావాన్ని సహజంగా చేర్చాం.
- source_word: כָּל בַּעֲלֵי שְׁכֶם
  choice: షెకెము నాయకులందరికీ
  rationale: בעלי అనే పదం యజమానులు, అధిపతులు లేదా పట్టణంలోని ప్రభావశీల పురుషులను సూచించగలదు. ఈ రాజకీయ సందర్భంలో ‘నాయకులు’ వారి పౌర-సామాజిక పాత్రను స్పష్టంగా తెలియజేస్తుంది.
- source_word: אֵת כָּל הַדְּבָרִים הָאֵלֶּה
  choice: ఈ మాటలన్నిటినీ
  rationale: דברים అనేది మాటలు లేదా విషయాలు అని అర్థమివ్వగలదు. ఇక్కడ ముందటి వచనంలో చెప్పిన ప్రతిపాదనను తిరిగి తెలియజేయడం ప్రధాన భావం కాబట్టి ‘మాటలు’ ఎంచుకున్నాం.
- source_word: וַיֵּט לִבָּם
  choice: వారి మనసు ... మొగ్గింది
  rationale: హృదయం లేదా అంతరంగ వైఖరి ఒక పక్షానికి అనుకూలంగా మళ్లడాన్ని ఈ హీబ్రూ జాతీయం సూచిస్తుంది. ఏకవచన సామూహిక రూపాన్ని తెలుగులో సహజంగా ‘వారి మనసు’గా ఉంచాం.
- source_word: אַחֲרֵי אֲבִימֶלֶךְ
  choice: అబీమెలెకు వైపు
  rationale: అక్షరార్థంగా ‘అబీమెలెకు వెనుక’ అయినా, సందర్భంలో అతనిపట్ల అనుకూలత లేదా విధేయతను సూచిస్తుంది. ‘వైపు మొగ్గింది’ తెలుగు జాతీయానికి సహజం.
- source_word: כִּי אָמְרוּ
  choice: ఎందుకంటే ... అని వారు అనుకున్నారు
  rationale: כִּי వారి అనుకూలతకు కారణాన్ని పరిచయం చేస్తుంది. אָמְרוּ అక్షరార్థంగా ‘చెప్పారు’; అయితే కారణంగా వారి సామూహిక అభిప్రాయం సూచించబడుతున్నందున తెలుగులో ‘అనుకున్నారు’ సహజంగా ఉంది.
- source_word: אָחִינוּ הוּא
  choice: అతడు మన సహోదరుడు
  rationale: అబీమెలెకు షెకెము స్త్రీ కుమారుడనే బంధుత్వ విజ్ఞప్తిని నేరుగా నిలుపుతుంది. విస్తృతమైన ‘బంధువు’ కంటే ‘సహోదరుడు’ మూలపదానికి దగ్గరగా ఉంది.
