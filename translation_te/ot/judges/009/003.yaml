translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథనశైలిని ఉపయోగించాం. ‘షెకెము,’ ‘అబీమెలెకు’ రూపాలు హీబ్రూ పేర్లను సమీపంగా ప్రతిబింబిస్తాయి. మూలంలోని ‘హృదయం మొగ్గడం’ అనే రూపకాన్ని తెలుగులో సహజమైన ‘మనసు ... వైపు మొగ్గింది’గా అందించాం.
