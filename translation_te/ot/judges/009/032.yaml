  yaml_path: translation/ot/judges/009/032.yaml
  text: Now then[a], arise by night, you and the people who are with you[b], and lie in wait in the field.
translation:
  language: te
  text: ఇప్పుడు అయితే నువ్వూ, నీతో ఉన్న ప్రజలూ రాత్రివేళ లేచి, పొలంలో మాటువేయండి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: కాబట్టి ఇప్పుడు
  rationale: ముందటి మాట నుంచి తక్షణ ఆదేశానికి మారే సంధానార్థాన్ని, సందర్భంలోని సూచనాత్మక భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: קוּם
  choice: లేచి
  rationale: קום ఆజ్ఞారూపం ఏకవచనంలో గాలును నేరుగా ఉద్దేశిస్తుంది; తరువాతి సమూహ కార్యంతో సహజంగా కలపడానికి తెలుగు సంయుక్త క్రియారూపం వాడబడింది.
- source_word: לַיְלָה
  choice: రాత్రివేళ
  rationale: ఇది రాత్రిలో చర్యను సూచించే కాలవాచక ప్రయోగం; హెబ్రీలో స్పష్టంగా లేని ‘ఈ రాత్రే’ అనే భావాన్ని చేర్చదు.
- source_word: אַתָּה וְהָעָם אֲשֶׁר אִתָּךְ
  choice: నువ్వూ, నీతో ఉన్న ప్రజలూ
  rationale: స్పష్టమైన ‘నువ్వు’ అనే సర్వనామపు ఉద్ఘాటనను నిలుపుతూ, עָם అనే విస్తృత పదాన్ని ‘సైనికులు’ లేదా ‘మనుషులు’గా సంకుచితం చేయకుండా ‘ప్రజలు’గా అనువదిస్తుంది.
- source_word: וֶאֱרֹב
  choice: మాటువేయండి
  rationale: ארב అంటే దాడి చేయడానికి దాగి వేచివుండడం లేదా మాటువేయడం; ‘మాటువేయండి’ తెలుగు సైనిక సందర్భంలో ఆ చర్యను సహజంగా వ్యక్తపరుస్తుంది.
- source_word: בַּשָּׂדֶה
  choice: పొలంలో
  rationale: שָׂדֶה యొక్క ప్రాథమిక అర్థమైన ‘పొలం’ను నిలుపుతుంది; సందర్భానుసారం బహిరంగ ప్రదేశం అనే భావం కూడా ఉండవచ్చు.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో నేరుగా వినిపించే సైనిక ఆదేశ శైలి. ‘నువ్వూ ... ప్రజలూ’ అనే నిర్మాణం హెబ్రీలోని స్పష్ట సర్వనామ ఉద్ఘాటనను నిలుపుతుంది. మూలంలో ఉన్న ఏకవచన ‘లేచి’ తరువాత సమూహాన్ని ఉద్దేశించే ‘మాటువేయండి’తో తెలుగు వ్యాకరణానుసారం సహజంగా సమన్వయించబడింది.
