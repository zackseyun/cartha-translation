- from: కాబట్టి ఇప్పుడు నువ్వూ, నీతో ఉన్న ప్రజలూ రాత్రివేళ లేచి, పొలంలో మాటువేయండి.
  to: ఇప్పుడు అయితే నువ్వూ, నీతో ఉన్న ప్రజలూ రాత్రివేళ లేచి, పొలంలో మాటువేయండి.
