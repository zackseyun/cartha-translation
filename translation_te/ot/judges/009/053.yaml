translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘తిరుగలి పైరాయి’ గ్రామీణ చేతి తిరుగలి సందర్భాన్ని సాధారణ పాఠకునికి అర్థమయ్యేలా తెలుపుతుంది. హీబ్రూ పదబంధంలోని ‘ముక్క/భాగం’ అనిశ్చితిని ప్రధాన పాఠం మరియు పాదసూచికలో భద్రపరిచాం.
