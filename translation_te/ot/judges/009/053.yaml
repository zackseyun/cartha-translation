source:
  edition: WLC
  text: וַ/תַּשְׁלֵ֞ךְ אִשָּׁ֥ה אַחַ֛ת פֶּ֥לַח רֶ֖כֶב עַל רֹ֣אשׁ אֲבִימֶ֑לֶךְ וַ/תָּ֖רִץ אֶת גֻּלְגָּלְתּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/053.yaml
  text: But a certain woman threw an upper millstone on Abimelech’s head and crushed his skull[a].
translation:
  language: te
  text: అయితే ఒక స్త్రీ తిరుగలి పైరాయి ముక్కను అబీమెలెకు తలపై విసిరింది, అతని కపాలాన్ని నలిపివేసింది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తిరుగలి పైరాయి”; హీబ్రూ పదబంధం తిరుగలి పైరాయినే లేదా దానిలోని ఒక భాగం/ముక్కను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּשְׁלֵךְ
  choice: విసిరి
  rationale: שׁלך క్రియ ఇక్కడ ఉద్దేశపూర్వకంగా విసరడాన్ని సూచిస్తుంది; ‘విసిరి’ సహజమైన ఆధునిక తెలుగు పదం, క్రియాశీల భావాన్ని నిలుపుతుంది.
- source_word: אִשָּׁה אַחַת
  choice: ఒక స్త్రీ
  rationale: అక్షరార్థంగా ‘ఒక స్త్రీ’; కథనంలో పేరు తెలియని ఒక వ్యక్తిని పరిచయం చేస్తూనే ఆమె ఒక్కరే ఈ నిర్ణాయక చర్య చేసినట్లు చూపుతుంది.
- source_word: פֶּלַח רֶכֶב
  choice: తిరుగలి పైరాతి ముక్కను
  rationale: רֶכֶב తిరుగలి పైరాతిని సూచిస్తుంది; פֶּלַח దాని భాగం లేదా ముక్క అనే భావాన్ని ఇస్తుంది. ఈ రెండు అంశాలనూ ప్రధాన పాఠంలో స్పష్టంగా ఉంచాం.
- source_word: עַל רֹאשׁ אֲבִימֶלֶךְ
  choice: అబీమెలెకు తలపై
  rationale: స్థానార్థక పదబంధాన్ని సహజమైన తెలుగు క్రమంలో నేరుగా అనువదించాం; పేరును తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: וַתָּרִץ
  choice: పగులగొట్టింది
  rationale: רצץ నలగగొట్టడం, పగులగొట్టడం అనే బలమైన భావాన్ని ఇస్తుంది; కపాలానికి సంబంధించి ‘పగులగొట్టింది’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: גֻּלְגָּלְתּוֹ
  choice: అతని కపాలాన్ని
  rationale: ఈ నామవాచకం సాధారణ ‘తల’ కంటే నిర్దిష్టంగా కపాలాన్ని సూచిస్తుంది; శరీర నిర్మాణ సంబంధమైన ఖచ్చితత్వాన్ని నిలుపుతుంది.
