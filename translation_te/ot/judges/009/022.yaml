  text: అబీమెలెకు ఇశ్రాయేలుపై మూడు సంవత్సరాలు పరిపాలించాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשַׂר
  choice: పరిపాలించాడు
  rationale: שׂרר అనే క్రియ ఇక్కడ అధికారం చెలాయించి పాలించడాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘పరిపాలించాడు’ సహజంగా ఉండి రాజకీయ అధికార భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: אֲבִימֶלֶךְ
  choice: అబీమెలెకు
  rationale: హీబ్రూ వ్యక్తి పేరును తెలుగులో ప్రామాణిక బైబిల్ రూపానికి అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: עַל
  choice: ఇశ్రాయేలును … పరిపాలించాడు
  rationale: పాలనను తెలిపే క్రియతో עַל అధికారానికి లోబడిన ప్రజలను సూచిస్తుంది. తెలుగులో కర్మవిభక్తితో ఈ సంబంధాన్ని సహజంగా వ్యక్తం చేశాం.
- source_word: יִשְׂרָאֵל
  choice: ఇశ్రాయేలు
  rationale: జాతి/ప్రజల పేరుకు తెలుగులో స్థిరపడిన లిప్యంతరీకరణను వాడాం.
- source_word: שָׁלֹשׁ שָׁנִים
  choice: మూడు సంవత్సరాలు
  rationale: కాలవ్యవధిని తెలిపే ఈ పదబంధాన్ని సహజమైన తెలుగు రూపంలో నేరుగా అనువదించాం.
