source:
  edition: WLC
  text: וַ/תֹּ֤אמֶר לָ/הֶם֙ הַ/גֶּ֔פֶן הֶ/חֳדַ֨לְתִּי֙ אֶת תִּ֣ירוֹשִׁ֔/י הַֽ/מְשַׂמֵּ֥חַ אֱלֹהִ֖ים וַ/אֲנָשִׁ֑ים וְ/הָ֣לַכְתִּ֔י לָ/נ֖וּעַ עַל הָ/עֵצִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/013.yaml
  text: But the vine said to them[a], ‘Should I stop producing my new wine, which gladdens gods and men, and go to sway over the trees?’
translation:
  language: te
  text: అయితే ద్రాక్షతీగ వాటితో, “దేవుళ్లను, మనుషులను సంతోషపరిచే నా కొత్త ద్రాక్షారసాన్ని ఇవ్వడం మానేసి, చెట్లపై ఊగులాడుతూ ఏలడానికి వెళ్లాలా?” అని అంది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దేవుణ్ణి, మనుషులను సంతోషపరిచే.”
    reason: אֱלֹהִים అనే హీబ్రూ పదాన్ని ఇక్కడ ఏకవచనంగా ‘దేవుడు’ అని కూడా అర్థం చేసుకోవచ్చు.
lexical_decisions:
- source_word: הַגֶּפֶן
  choice: ద్రాక్షతీగ
  rationale: యోతాము చెప్పిన ఉపమానకథలో మాట్లాడుతున్న మొక్కను సహజమైన ఆధునిక తెలుగులో స్పష్టంగా సూచిస్తుంది.
- source_word: הֶחֳדַלְתִּי
  choice: ఉత్పత్తి చేయడం మానేసి ... వెళ్లాలా?
  rationale: సందర్భంలో ఇది ఆలోచనాత్మక అలంకారప్రశ్న. తరువాత వచ్చే ‘నా కొత్త ద్రాక్షారసం’తో సంబంధాన్ని తెలుగులో సహజంగా చూపడానికి ‘ఉత్పత్తి చేయడం’ స్పష్టీకరించబడింది.
- source_word: תִּירוֹשִׁי
  choice: నా కొత్త ద్రాక్షారసం
  rationale: תִּירוֹשׁ సాధారణంగా తాజా లేదా కొత్త ద్రాక్షారసాన్ని సూచిస్తుంది; ‘ద్రాక్షారసం’ వ్యవసాయ రూపకాన్ని కాపాడుతుంది, ‘కొత్త’ అనే పదం దాని ప్రత్యేక భావాన్ని నిలుపుతుంది.
- source_word: הַמְשַׂמֵּחַ
  choice: సంతోషపరిచే
  rationale: హిఫిల్ రూపంలోని కారణార్థాన్ని సహజంగా వ్యక్తం చేసే వర్తమాన విశేషణ రూపం.
- source_word: אֱלֹהִים וַאֲנָשִׁים
  choice: దేవుళ్లను, మనుషులను
  rationale: אֱלֹהִים రూపరీత్యా బహువచనం; ఈ ఉపమానకథా సందర్భంలో దైవికులు మరియు మానవులు అనే విస్తృత భావాన్ని ప్రధాన పాఠ్యంలో నిలుపుతుంది.
- source_word: לָנוּעַ עַל הָעֵצִים
  choice: చెట్లపై ఊగుతూ ఏలడానికి
  rationale: נוּעַ లోని భౌతికంగా ఊగే చిత్రాన్నీ, చెట్లపై రాజ్యాధికారాన్ని చేపట్టే సందర్భార్థాన్నీ కలిపి నిలుపుతుంది.
theological_decisions:
- issue: אֱלֹהִים అనే పదం ఇక్కడ బహువచనమా, ఏకవచనమా?
  choice: ప్రధాన పాఠ్యంలో ‘దేవుళ్లు’
  alternative: ‘దేవుడు’
  rationale: హీబ్రూ రూపం బహువచనంగా ఉంది; ఉపమానకథా సందర్భం కూడా బహువచన పఠనానికి అనుకూలంగా ఉండవచ్చు. అయితే ఇశ్రాయేలు దేవుణ్ణి సూచించే ఏకవచన పఠనం ప్రాచీనమైన, సాధ్యమైన ప్రత్యామ్నాయం కాబట్టి పాదసూచికలో ఉంచబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యేలా, అయితే ఉపమానకథకు తగిన గౌరవప్రదమైన సాహిత్య ధోరణితో రూపొందించబడింది. పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో చేర్చబడింది.
