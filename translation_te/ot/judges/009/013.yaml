- from: అప్పుడు ద్రాక్షతీగ వాటితో, “దేవుళ్లను, మనుషులను సంతోషపరిచే నా కొత్త ద్రాక్షారసాన్ని ఉత్పత్తి చేయడం మానేసి, చెట్లపై ఊగుతూ ఏలడానికి వెళ్లాలా?” అని అంది.[a]
