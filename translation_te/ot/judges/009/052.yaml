  yaml_path: translation/ot/judges/009/052.yaml
  text: Abimelech came up to the tower and fought against it, and he came near to the entrance of the tower to burn it with fire.
translation:
  language: te
  text: అబీమెలెకు ఆ గోపురం వరకు వచ్చి, దానితో యుద్ధం చేశాడు; దానిని అగ్నితో కాల్చివేయడానికి ఆ గోపురం ప్రవేశద్వారం వరకు చేరుకున్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַד הַמִּגְדָּל
  choice: ఆ గోపురం దగ్గరికి
  rationale: עַד ఇక్కడ గమ్యస్థానానికి చేరువను సూచిస్తుంది; సందర్భంలోని నిర్దిష్ట గోపురాన్ని הַ సూచిస్తుంది.
- source_word: וַיִּלָּחֶם בּוֹ
  choice: దానితో యుద్ధం చేశాడు
  rationale: בּוֹ యొక్క సాధారణ ప్రత్యర్థి భావాన్ని నిలుపుతూ, గోపురంలో ఆశ్రయం పొందిన వారిపై జరిగిన దాడిని పాఠకుడే సందర్భం ద్వారా గ్రహించేలా మూలంలోని రూపకల్పనను కాపాడుతుంది.
- source_word: פֶּתַח הַמִּגְדָּל
  choice: ఆ గోపురం ప్రవేశద్వారం
  rationale: פֶּתַח అనేది కేవలం తలుపు పలకను కాక ప్రవేశస్థానాన్ని సూచించగలదు; అందుకే 'ప్రవేశద్వారం' సహజంగా, స్పష్టంగా ఉంది.
- source_word: לְשָׂרְפוֹ בָאֵשׁ
  choice: నిప్పుతో కాల్చివేయడానికి
  rationale: ఉద్దేశార్థక לְను '-డానికి'తో, בָאֵשׁ యొక్క సాధనార్థాన్ని 'నిప్పుతో'గా వ్యక్తం చేసి, సంపూర్ణ దహన భావానికి 'కాల్చివేయు'ను వాడింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. మూలంలోని పునరుక్త సంధి నిర్మాణాన్ని తెలుగులో రెండు వాక్యాలుగా విభజించి చదవడానికి సులభం చేశాం; భావాన్ని జోడించలేదు. 'వచ్చి' అనే అనువాదం וַיָּבֹאను నేరుగా ప్రతిబింబిస్తుంది; ఇక్కడ భౌగోళిక ఎత్తుదలను తప్పనిసరిగా తెలిపే ప్రత్యేక క్రియ మూలంలో లేదు.
