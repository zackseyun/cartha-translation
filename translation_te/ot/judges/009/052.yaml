  text: וַ/יָּבֹ֤א אֲבִימֶ֨לֶךְ֙ עַד הַ/מִּגְדָּ֔ל וַ/יִּלָּ֖חֶם בּ֑/וֹ וַ/יִּגַּ֛שׁ עַד פֶּ֥תַח הַ/מִּגְדָּ֖ל לְ/שָׂרְפ֥/וֹ בָ/אֵֽשׁ־־׃
base_translation:
