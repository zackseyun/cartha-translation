source:
  edition: WLC
  text: וַ/יָּ֣נָס יוֹתָ֔ם וַ/יִּבְרַ֖ח וַ/יֵּ֣לֶךְ בְּאֵ֑רָ/ה וַ/יֵּ֣שֶׁב שָׁ֔ם מִ/פְּנֵ֖י אֲבִימֶ֥לֶךְ אָחִֽי/ו׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/021.yaml
  text: Then Jotham fled and escaped and went to Beer[a], and he lived there away from Abimelech his brother.
translation:
  language: te
  text: అప్పుడు యోతాము పారిపోయి తప్పించుకొని బేరు[a]కు వెళ్లాడు. తన సోదరుడైన అబీమెలెకు నుండి దూరంగా అక్కడ నివసించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘బేరా.’ హీబ్రూ స్థలనామం בְּאֵרָהను ‘బేరు’ లేదా ‘బేరా’ అని లిప్యంతరీకరించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּנָס
  choice: పారిపోయి
  rationale: נוס ప్రమాదం నుంచి పారిపోవడాన్ని సూచిస్తుంది; కథనశైలిలో ‘పారిపోయి’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: וַיִּבְרַח
  choice: తప్పించుకొని
  rationale: ברח కూడా పారిపోవడాన్ని సూచిస్తుంది. మూలంలోని సమీపార్థక క్రియల ద్విత్వాన్ని తెలుగులో అసహజ పునరుక్తి లేకుండా ‘పారిపోయి తప్పించుకొని’ అని నిలిపాం.
- source_word: בְּאֵרָה
  choice: బేయేరు
  rationale: ఇది స్థలనామం. హీబ్రూ בְּאֵר (బావి) ధ్వనిని తెలుగు లిపిలో స్పష్టంగా ప్రతిబింబించేందుకు ‘బేయేరు’ అని లిప్యంతరీకరించాం; చివరి ה దిశాసూచక ప్రత్యయంగా కూడా అర్థమవుతుంది.
- source_word: וַיֵּשֶׁב שָׁם
  choice: అక్కడ నివసించాడు
  rationale: ישב ఇక్కడ కొంతకాలం ఉండటం లేదా నివసించటాన్ని సూచిస్తుంది; ‘అక్కడ నివసించాడు’ ఆధునిక గౌరవప్రదమైన తెలుగులో సహజంగా ఉంది.
- source_word: מִפְּנֵי
  choice: దూరంగా
  rationale: అక్షరార్థంగా ‘ముఖం/సన్నిధి నుంచి’; ఈ సందర్భంలో అబీమెలెకు నుంచి దూరంగా ఉండటాన్ని తెలియజేస్తుంది. భయాన్ని మూలపాఠం స్పష్టంగా చెప్పనందున దానిని చేర్చలేదు.
- source_word: אָחִיו
  choice: తన సహోదరుడైన
  rationale: 3వ పురుష ఏకవచన సంబంధప్రత్యయంతో కూడిన స్పష్టమైన బంధుత్వ పదం. కుటుంబ సంబంధం వల్ల కలిగే కథన ఉద్రిక్తతను నిలిపేందుకు ప్రత్యక్షంగా అనువదించాం.
