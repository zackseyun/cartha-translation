translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సరళమైన, గౌరవప్రదమైన కథనశైలి. మూలంలోని వరుస సమీపార్థక క్రియలను ‘పారిపోయి తప్పించుకొని’ అని నిలిపాం. ‘సహోదరుడు’ అనే పదం సాధారణ ‘సోదరుడు’ కంటే కొద్దిగా గ్రంథశైలిలో ఉన్నా, గంభీరతను మరియు బంధుత్వ సూచనను స్పష్టంగా ఉంచుతుంది.
