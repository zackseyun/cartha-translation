source:
  edition: WLC
  text: וַ/יָּ֣שֶׁב אֱלֹהִ֔ים אֵ֖ת רָעַ֣ת אֲבִימֶ֑לֶךְ אֲשֶׁ֤ר עָשָׂה֙ לְ/אָבִ֔י/ו לַ/הֲרֹ֖ג אֶת שִׁבְעִ֥ים אֶחָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/056.yaml
  text: Thus God repaid Abimelech for the evil that he had done to his father by killing his seventy brothers[a].
translation:
  language: te
  text: ఈ విధంగా దేవుడు అబీమెలెకు తన తండ్రికి చేసిన కీడును—అంటే, అతడు తన డెబ్బై మంది సహోదరులను చంపిన కీడును—అతనిమీదికే తిరిగి రప్పించాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దేవుడు అబీమెలెకు చేసిన కీడును అతనిమీదికి తిరిగి రప్పించాడు.” హెబ్రీ నుడికారం అతడు చేసిన కీడు అతనిమీదికే తిరిగి రావడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׁב
  choice: తిరిగి రప్పించాడు
  rationale: హిఫీల్ రూపం కీడును చేసినవాని మీదికే తిరిగి వచ్చేలా చేయడం అనే కారణార్థక భావాన్ని కలిగిస్తుంది. తెలుగు వాక్యం హెబ్రీయుల నుడికారాన్ని సహజంగా నిలుపుతుంది.
- source_word: אֱלֹהִים
  choice: దేవుడు
  rationale: క్రియ ఏకవచనంలో ఉంది; సందర్భంలో ఇశ్రాయేలు దేవుడే తీర్పు తీర్చే కర్తగా స్పష్టంగా సూచించబడ్డాడు.
- source_word: רָעַת
  choice: కీడును
  rationale: ఇక్కడ పదం కేవలం హానిని కాక అబీమెలెకు చేసిన నైతిక దుష్కార్యాన్ని సూచిస్తుంది. ‘కీడు’ నైతిక భావాన్నీ దాని దుష్ఫలితాన్నీ నిలుపుతుంది.
- source_word: אֲבִימֶלֶךְ
  choice: అబీమెలెకు
  rationale: వ్యక్తి పేరును ఆధునిక ప్రామాణిక తెలుగు బైబిలు ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: אֲשֶׁר עָשָׂה
  choice: చేసిన
  rationale: ముందు జరిగిన కార్యాన్ని తెలిపే సంబంధార్థక నిర్మాణాన్ని తెలుగులో సహజమైన అసమాపక క్రియతో వ్యక్తం చేశాం.
- source_word: לְאָבִיו
  choice: తన తండ్రికి
  rationale: ל ఉపసర్గ ఇక్కడ ఆ కీడు ఎవరికి చేయబడిందో సూచిస్తుంది. ప్రతిబింబార్థక ‘తన’ వల్ల తండ్రి అబీమెలెకుదేనని స్పష్టమవుతుంది.
- source_word: לַהֲרֹג
  choice: చంపిన
  rationale: ఈ క్రియారూపం తండ్రికి చేసిన కీడు ఏమిటో వివరిస్తుంది. తెలుగులో పునరుక్త సంబంధ నిర్మాణం ఆ వివరణాత్మక సంబంధాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: שִׁבְעִים אֶחָיו
  choice: తన డెబ్బై మంది సహోదరులను
  rationale: సంఖ్యను, కుటుంబ సంబంధాన్ని యథాతథంగా నిలిపి, వ్యక్తులను లెక్కించే సహజ తెలుగు రూపమైన ‘మంది’ని ఉపయోగించాం.
- source_word: וַ
  choice: ఈ విధంగా
  rationale: సాధారణ సంధానార్థంతో పాటు ఈ వచనం కథనానికి తీర్పుసంబంధమైన ముగింపును సంగ్రహిస్తుండటాన్ని తెలియజేస్తుంది.
theological_decisions:
- issue: తీర్పులో దేవుని ప్రత్యక్ష కార్యసాధకత్వం
  choice: దేవుడే అబీమెలెకు చేసిన కీడును అతని మీదికి తిరిగి రప్పించాడు.
  alternative: అబీమెలెకు చేసిన కీడు అతని మీదికి తిరిగి రావడానికి దేవుడు అనుమతించాడు.
  rationale: హెబ్రీ వాక్యంలో దేవుడు స్పష్టమైన కర్త; కారణార్థక క్రియ ఆయన చర్యను ప్రత్యక్షంగా తెలియజేస్తుంది. అందువల్ల దైవ కార్యసాధకత్వాన్ని ‘అనుమతించాడు’ అని మృదువుపరచలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. ‘తిరిగి రప్పించాడు’ అనే రూపం మూలంలోని కారణార్థక నుడికారాన్ని నిలుపుతుంది; ప్రధాన వాక్యంలో కీడు యొక్క వివరణను గీతల మధ్య ఉంచడం వల్ల ‘తండ్రికి చేసిన కీడు’ మరియు ‘సహోదరులను చంపడం’ మధ్య సంబంధం స్పష్టమవుతుంది.
