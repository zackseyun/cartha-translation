source:
  edition: WLC
  text: וּ/מִ֨י יִתֵּ֜ן אֶת הָ/עָ֤ם הַ/זֶּה֙ בְּ/יָדִ֔/י וְ/אָסִ֖ירָה אֶת אֲבִימֶ֑לֶךְ וַ/יֹּ֨אמֶר֙ לַ/אֲבִימֶ֔לֶךְ רַבֶּ֥ה צְבָאֲ/ךָ֖ וָ/צֵֽאָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/029.yaml
  text: If only this people were in my hand[a], then I would remove Abimelek. And he said to Abimelek[b], “Increase your army and come out!”
translation:
  language: te
  text: “ఈ ప్రజలు నా చేతిలో ఉంటే ఎంత బాగుండును![a] అప్పుడు నేను అబీమెలెకును తొలగించేవాడిని.” అతడు అబీమెలెకుతో[b], “నీ సైన్యాన్ని పెంచి బయటకు రా!” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత పదశః: “ఈ ప్రజలను నా చేతిలో ఎవరు ఇస్తారు? అప్పుడు నేను అబీమెలెకును తొలగించేవాడిని.” హీబ్రూలో “ఎవరు ఇస్తారు...?” అనే నానుడి ఒక కోరికను వ్యక్తపరుస్తుంది.'
    reason: lexical_alternative
  - marker: b
    text: “నీ సైన్యాన్ని పెంచి బయటకు రా” అనే సవాలు అబీమెలెకును ఉద్దేశించిన ఎగతాళిగా ఉండవచ్చు; అది అతనితో నేరుగా పలికిందా లేక వాక్చాతుర్యంగా విసిరిన సవాలా అన్నది స్పష్టంగా లేదు.
    reason: cultural_note
lexical_decisions:
- source_word: וּמִי יִתֵּן
  choice: చిక్కితే ఎంత బాగుండును!
  rationale: హీబ్రూ ‘ఎవరు ఇస్తారు?’ అనే రూపంలో ఉన్నప్పటికీ, ఇది బలమైన కోరికను వ్యక్తపరిచే నానుడి. సహజమైన ఆధునిక తెలుగులో ఆ ఆకాంక్షను వ్యక్తం చేస్తుంది.
- source_word: הָעָם הַזֶּה
  choice: ఈ ప్రజలు
  rationale: עָם ఇక్కడ సమూహార్థక ఏకవచనం; తెలుగులో సహజంగా ‘ఈ ప్రజలు’ అని చెప్పడం ద్వారా ఆ ప్రజాసమూహాన్ని సూచించవచ్చు.
- source_word: בְּיָדִי
  choice: నా చేతికి
  rationale: అధికారం లేదా నియంత్రణను సూచించే ‘చేతిలో’ అనే హీబ్రూ రూపకాన్ని సహజ తెలుగు నానుడిగా నిలుపుతుంది.
- source_word: וְאָסִירָה
  choice: నేను ... తొలగిస్తాను
  rationale: హిఫిల్ రూపం ‘తొలగించడం’ అనే విస్తృత అర్థాన్ని ఇస్తుంది; చంపడం, వెళ్లగొట్టడం లేదా పదవి నుంచి దించడం అని అనవసరంగా నిర్దిష్టం చేయదు.
- source_word: וַיֹּאמֶר לַאֲבִימֶלֶךְ
  choice: అతడు అబీమెలెకుతో ... అన్నాడు
  rationale: לְ ను సాధారణ దత్తార్థక ప్రయోగంగా తీసుకొని సవాలు అబీమెలెకును ఉద్దేశించినదిగా అనువదించాం; అది ప్రత్యక్షంగా పలికిందా, వాక్చాతుర్యంతో విసిరిన సవాలా అన్నది పాదసూచికలో తెరిచి ఉంచాం.
- source_word: רַבֶּה צְבָאֲךָ
  choice: నీ సైన్యాన్ని పెంచుకొని
  rationale: רבה ఆజ్ఞారూపం సంఖ్య లేదా బలాన్ని పెంచమని చెబుతుంది; ‘సైన్యాన్ని పెంచుకొని’ తెలుగులో సహజమైన సైనిక సవాలు.
- source_word: וָצֵאָה
  choice: బయలుదేరి రా
  rationale: יצא ఆజ్ఞారూపం బయటకు రావడం లేదా యుద్ధానికి బయలుదేరడాన్ని సూచిస్తుంది; ప్రత్యర్థికి విసిరిన సవాలులో ‘బయలుదేరి రా’ సహజంగా ఉంటుంది.
theological_decisions:
- issue: అబీమెలెకును ‘తొలగించడం’ యొక్క ఖచ్చిత స్వభావం
  choice: తొలగిస్తాను
  alternative: వెళ్లగొడతాను / పదవి నుంచి దించుతాను / చంపుతాను
  rationale: మూలంలోని סוּר హిఫిల్ ఇక్కడ ఫలితాన్ని ఖచ్చితంగా పరిమితం చేయదు; అందువల్ల విస్తృత పదాన్ని ఉంచి మూలంలోని అనిశ్చితిని కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సహజంగా, గౌరవప్రదంగా ఉండే శైలి. ‘నా చేతికి’ అనే రూపకం నిలుపబడింది; ‘చిక్కితే’ నియంత్రణలోకి రావడం అనే భావాన్ని సహజంగా తెలియజేస్తుంది. అబీమెలెకును ఉద్దేశించిన మాట ప్రత్యక్షమా, వాక్చాతుర్యమా అనే సందర్భసంబంధ అనిశ్చితిని పాదసూచికలో కాపాడాం.
