source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אֵלָ֜י/ו זְבֻ֗ל אַיֵּ֨ה אֵפ֥וֹא פִ֨י/ךָ֙ אֲשֶׁ֣ר תֹּאמַ֔ר מִ֥י אֲבִימֶ֖לֶךְ כִּ֣י נַעַבְדֶ֑/נּוּ הֲ/לֹ֨א זֶ֤ה הָ/עָם֙ אֲשֶׁ֣ר מָאַ֣סְתָּה בּ֔/וֹ צֵא נָ֥א עַתָּ֖ה וְ/הִלָּ֥חֶם בּֽ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/038.yaml
  text: Then Zebul said to him[a], “Where is your mouth now, you who said, ‘Who is Abimelech, that we should serve him?’ Is this not the people whom you despised? Go out now and fight against them.”
translation:
  language: te
  text: 'అప్పుడు జెబూలు అతనితో ఇలా అన్నాడు: “ఇప్పుడు నీ నోరు ఎక్కడుంది?[a] ‘అబీమెలెకు ఎవడు, మనం అతనికి సేవ చేయాలా?’ అని అన్నావు కదా! నువ్వు తృణీకరించిన ఈ ప్రజలే కాదా? ఇప్పుడే బయలుదేరి వారితో యుద్ధం చేయి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “ఇప్పుడు నీ నోరు ఎక్కడుంది?”—ఇది అతడు ఇంతకు ముందు గొప్పగా మాట్లాడిన మాటలను ఎగతాళి చేసే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַיֵּה אֵפוֹא פִיךָ
  choice: ఇప్పుడు నీ నోరు ఎక్కడుంది?
  rationale: హీబ్రూ వాక్యంలోని సజీవమైన ‘నీ నోరు ఎక్కడ?’ అనే ఎగతాళి రూపకాన్ని నిలుపుతూ, గాలు ఇంతకు ముందు పలికిన గొప్ప మాటలను సవాలు చేసే భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אֲשֶׁר תֹּאמַר
  choice: అని అన్నావు కదా
  rationale: సంబంధ వాక్యాన్ని తెలుగు ప్రత్యక్ష సంభాషణలో సహజంగా మార్చి, గతంలో గాలు పలికిన మాటలను జెబులు ఎత్తిచూపుతున్న నిందాత్మక స్వరాన్ని నిలుపుతుంది.
- source_word: מִי אֲבִימֶלֶךְ כִּי נַעַבְדֶנּוּ
  choice: అబీమెలెకు ఎవడు, మనం అతనికి సేవ చేయడానికి?
  rationale: అబీమెలెకును తక్కువచేసే అలంకార ప్రశ్నను, అలాగే ‘సేవ చేయడం’ అనే మూలపద భావాన్ని సమీపంగా నిలుపుతుంది.
- source_word: הֲלֹא זֶה הָעָם
  choice: ప్రజలు వీరే కాదా?
  rationale: హֲלֹא సూచించే ప్రతివాద ప్రశ్నను అలాగే ఉంచి, సమీపంలో కనిపిస్తున్న సమూహాన్ని సూచించడానికి తెలుగులో సహజమైన బహువచన ప్రయోగాన్ని వాడుతుంది.
- source_word: מָאַסְתָּה בּוֹ
  choice: నువ్వు తృణీకరించిన
  rationale: מָאַסְתָּ అనే పదంలోని తిరస్కారం, హేళన రెండింటినీ ‘తృణీకరించిన’ స్పష్టంగా అందిస్తుంది.
- source_word: צֵא נָא עַתָּה
  choice: ఇప్పుడే బయలుదేరి
  rationale: צֵא అనే ఆజ్ఞను, נָא עַתָּה లోని సవాలుతో కూడిన తక్షణ ఒత్తిడిని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; మర్యాదపూర్వకమైన ‘దయచేసి’ భావాన్ని అనవసరంగా చేర్చదు.
- source_word: וְהִלָּחֶם בּוֹ
  choice: వారితో యుద్ధం చేయి
  rationale: వ్యాకరణపరంగా בּוֹ ఏకవచనమైనా అది సమూహవాచకమైన הָעָם (‘ప్రజలు’)ను తిరిగి సూచిస్తుంది. అందువల్ల తెలుగులో అర్థసహజత కోసం బహువచన సర్వనామం వాడబడింది; ‘వారిపై’ కంటే ‘వారితో యుద్ధం చేయి’ యుద్ధంలో తలపడే భావాన్ని సహజంగా అందిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గంభీరమైనప్పటికీ సాధారణ పాఠకులకు స్పష్టంగా ఉండే శైలి. జెబులు పలికిన ఎగతాళి, సవాలు, తక్షణ ఆజ్ఞల స్వరాన్ని నిలుపుకుంది. ప్రధాన పాఠంలోని [a] గుర్తు సంబంధిత పాదటిప్పణితో సరిపోలుతుంది.
