translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలిని వాడాం. మూలంలోని వరుస చర్యలను స్పష్టంగా ఉంచాం; సైనిక సందర్భాన్ని మించి వివరణాత్మక పదాలను చేర్చలేదు. ప్రతి పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో పొందుపరచబడింది.
