source:
  edition: WLC
  text: וַ/יֵּצֵא֙ גַּ֣עַל בֶּן עֶ֔בֶד וַ/יַּעֲמֹ֕ד פֶּ֖תַח שַׁ֣עַר הָ/עִ֑יר וַ/יָּ֧קָם אֲבִימֶ֛לֶךְ וְ/הָ/עָ֥ם אֲשֶׁר אִתּ֖/וֹ מִן הַ/מַּאְרָֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/035.yaml
  text: Then Gaal son of Ebed went out and stood at the entrance of the city gate[b][a], and Abimelech and the people who were with him rose from the ambush.
translation:
  language: te
  text: అప్పుడు ఏబెదు కుమారుడైన గయాలు బయటికి వెళ్లి పట్టణ ద్వారపు ప్రవేశం దగ్గర నిలబడ్డాడు. అబీమెలెకు, అతనితో ఉన్న ప్రజలు మాటువేసిన చోటు నుండి లేచారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘మాటు నుండి.’ హీబ్రూ పదం మాటును గానీ, మాటువేసిన స్థానాన్ని గానీ సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: బయటికి వెళ్లి
  rationale: יצא బయటికి కదలడాన్ని సూచిస్తుంది. కథన సందర్భంలో ‘బయటికి వెళ్లి’ సహజంగా ఉండి, బయలుదేరిన దిశకు మించిన భావాన్ని చేర్చదు.
- source_word: גַּעַל בֶּן עֶבֶד
  choice: ఏబెదు కుమారుడైన గయాలు
  rationale: హీబ్రూ పితృనామ నిర్మాణాన్ని సహజమైన తెలుగు పదక్రమంలో నిలిపి, పేర్లను తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: וַיַּעֲמֹד
  choice: నిలబడ్డాడు
  rationale: עמד యొక్క సాధారణ అర్థమైన ‘నిలబడు’ను తీసుకున్నాం; మూలంలో స్పష్టంగా లేని సైనిక భావాన్ని జోడించలేదు.
- source_word: פֶּתַח שַׁעַר הָעִיר
  choice: పట్టణ ద్వారపు ప్రవేశం దగ్గర
  rationale: פתח అంటే ప్రవేశం లేదా తెరువు; שער העיר అంటే పట్టణ ద్వారం. ఈ సంబంధాన్ని స్పష్టంగా, సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וַיָּקָם
  choice: లేచారు
  rationale: ఏకవచన క్రియకు అబీమెలెకుతో పాటు అతనితో ఉన్నవారు సంయుక్త కర్తలుగా వస్తారు. తెలుగులో సహజంగా బహువచన గౌరవరహిత రూపాన్ని వాడాం; చర్యకు సిద్ధపడిన భావాన్ని సందర్భమే తెలియజేస్తుంది.
- source_word: וְהָעָם אֲשֶׁר אִתּוֹ
  choice: అతనితో ఉన్న ప్రజలు
  rationale: עם అనే మూలపదానికి దగ్గరగా ‘ప్రజలు’ అని అనువదించాం. సైనిక సందర్భం ఉన్నప్పటికీ, ‘సైనికులు’ అని మూలం కంటే నిర్దిష్టం చేయలేదు.
- source_word: מִן הַמַּאְרָב
  choice: మాటువేసిన చోటు నుండి
  rationale: מארב మాటు లేదా మాటువేసిన స్థానాన్ని సూచించగలదు. తెలుగులో ‘మాటు నుండి’ కంటే ‘మాటువేసిన చోటు నుండి’ సహజంగా, స్థలార్థాన్ని స్పష్టంగా అందిస్తుంది; ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
