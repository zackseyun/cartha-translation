revisions:
- from: అబీమెలెకు అతన్ని వెంబడించాడు; అతడు అతని ఎదుటనుండి పారిపోయాడు. చంపబడినవారు అనేకులు ద్వారపు ప్రవేశం వరకు పడిపోయారు.[a]
  to: అబీమెలెకు అతన్ని వెంబడించాడు; అతడు అతని ముందునుండి పారిపోయాడు. అనేకమంది హతులు ద్వార ప్రవేశం వరకు పడిపోయారు.[a]
  rationale: The revision retains the Hebrew’s compact battle idiom—literally, “many slain fell”—but uses a more idiomatic Telugu ordering. It also improves the expression for fleeing before a pursuer and updates the footnote so that it corresponds to the revised main text without resolving any contextual ambiguity beyond the source.
