translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా రూపొందించబడింది. ‘చంపబడినవారు ... పడిపోయారు’ అనే నిర్మాణం తెలుగులో కొంత గట్టిగా వినిపించినా, మూలంలోని חֲלָלִים + נפל యుద్ధ చిత్రణను ఉద్దేశపూర్వకంగా నిలుపుతుంది. సర్వనామాల అస్పష్టతను సందర్భానికి మించి పేర్లతో పరిష్కరించలేదు.
