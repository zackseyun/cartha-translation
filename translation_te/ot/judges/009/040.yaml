source:
  edition: WLC
  text: וַ/יִּרְדְּפֵ֣/הוּ אֲבִימֶ֔לֶךְ וַ/יָּ֖נָס מִ/פָּנָ֑י/ו וַֽ/יִּפְּל֛וּ חֲלָלִ֥ים רַבִּ֖ים עַד פֶּ֥תַח הַ/שָּֽׁעַר־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/040.yaml
  text: Abimelech pursued him[a], and he fled before him; and many slain fell as far as the entrance of the gate.
translation:
  language: te
  text: అబీమెలెకు అతన్ని వెంబడించాడు; అతడు అతని ముందునుండి పారిపోయాడు. అనేకమంది హతులు ద్వార ప్రవేశం వరకు పడిపోయారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: ‘అనేకమంది హతులై ద్వార ప్రవేశం వరకు పడిపోయారు.’ హీబ్రూలో ‘హతులు’ మరియు ‘పడిపోయారు’ అనే సజీవ యుద్ధ నుడికారం ఉంది.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְדְּפֵהוּ
  choice: అతన్ని వెంబడించాడు
  rationale: רדף శత్రువును తరుమడం లేదా వెంబడించడం అనే సైనిక భావాన్ని ఇక్కడ ఇస్తుంది; ‘వెంబడించాడు’ సహజమైన ఆధునిక తెలుగు.
- source_word: וַיָּנָס
  choice: అతడు ... పారిపోయాడు
  rationale: נוס అంటే పారిపోవడం; ఏకవచన కర్త మునుపటి వచనంలోని గాలును సూచిస్తుంది.
- source_word: מִפָּנָיו
  choice: అతని ఎదుటనుండి
  rationale: అక్షరార్థంగా ‘అతని ముఖం/సన్నిధి నుండి’; వెంటాడబడుతున్న వ్యక్తి ఎదుటనుండి పారిపోవడాన్ని తెలిపే హీబ్రూ నుడికారాన్ని సమీపంగా నిలుపుతుంది.
- source_word: וַיִּפְּלוּ
  choice: పడిపోయారు
  rationale: נפל యొక్క ప్రాథమిక అర్థం ‘పడిపోవడం’; యుద్ధ సందర్భంలోని సజీవ చిత్రణను నిలుపుతుంది.
- source_word: חֲלָלִים
  choice: చంపబడినవారు
  rationale: חללים యుద్ధంలో పొడవబడి లేదా కొట్టబడి హతమైనవారిని సూచిస్తుంది; ‘చంపబడినవారు’ అర్థాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: רַבִּים
  choice: అనేకులు
  rationale: רבים కు నేరమైన అర్థం ‘అనేకులు’; వ్యక్తులను సూచించే సందర్భానికి తగిన రూపం.
- source_word: עַד פֶּתַח הַשָּׁעַר
  choice: ద్వారపు ప్రవేశం వరకు
  rationale: פתח ‘ప్రవేశం/తెరువు’, שער ‘ద్వారం’; రెండు పదాల నిర్మాణాన్ని స్పష్టంగా ప్రతిబింబిస్తుంది.
