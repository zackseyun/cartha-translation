id: JDG.9.20
reference: Judges 9:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אִם אַ֕יִן תֵּ֤צֵא אֵשׁ֙ מֵ/אֲבִימֶ֔לֶךְ וְ/תֹאכַ֛ל אֶת בַּעֲלֵ֥י שְׁכֶ֖ם וְ/אֶת בֵּ֣ית מִלּ֑וֹא וְ/תֵצֵ֨א אֵ֜שׁ מִ/בַּעֲלֵ֤י שְׁכֶם֙ וּ/מִ/בֵּ֣ית מִלּ֔וֹא וְ/תֹאכַ֖ל אֶת אֲבִימֶֽלֶךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/020.yaml
  text: But if not[a], let fire come out from Abimelech and consume the leaders of Shechem and Beth-millo[b]; and let fire come out from the leaders of Shechem and from Beth-millo and consume Abimelech.
translation:
  language: te
  text: కాని అలా కాకపోతే, అబీమెలెకు నుండి అగ్ని బయలుదేరి షెకెము అధిపతులను[a], బేత్-మిల్లోను[b] దహించివేయుగాక; అలాగే షెకెము అధిపతుల నుండి, బేత్-మిల్లో నుండి అగ్ని బయలుదేరి అబీమెలెకును దహించివేయుగాక.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘షెకెము అధిపతులు’ అని అనువదించిన హెబ్రీ పదబంధాన్ని ‘షెకెము ప్రభువులు’ అని కూడా అనువదించవచ్చు. అది నగరంలోని పాలకులను లేదా ప్రముఖులను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘బేత్-మిల్లో’ను ‘మిల్లో గృహం’ అని కూడా అనువదించవచ్చు. ఇది బహుశా షెకెముతో సంబంధమున్న ఒక స్థలాన్ని లేదా పాలకవర్గాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם אַיִן
  choice: కాని అలా కాకపోతే
  rationale: మునుపటి వాక్యంలోని షరతుకు వ్యతిరేకమైన పరిణామాన్ని సూచించే సహజమైన తెలుగు ప్రయోగం; וְ యొక్క వ్యతిరేక భావాన్నీ אַיִן యొక్క నిరాకరణ షరతునూ నిలుపుతుంది.
- source_word: תֵּצֵא אֵשׁ
  choice: అగ్ని బయలుదేరి ... దహించివేయుగాక
  rationale: ఇక్కడ yiqtol శాపవాక్యంలోని ఆకాంక్షార్థక/ఆజ్ఞార్థక బలాన్ని కలిగి ఉంది. ‘-గాక’ దానిని కేవలం భవిష్యద్వాణిగా మార్చకుండా శాపం లేదా అభిలాషగా వ్యక్తం చేస్తుంది.
- source_word: מֵאֲבִימֶלֶךְ
  choice: అబీమెలెకు నుండి
  rationale: విధ్వంసకరమైన అగ్ని అతని నుండి బయలుదేరుతుందనే మూలపాఠంలోని రూపక చిత్రాన్ని నేరుగా నిలుపుతుంది.
- source_word: וְתֹאכַל
  choice: దహించివేయుగాక
  rationale: అగ్ని కర్తగా ఉన్నప్పుడు אכל అంటే కాల్చివేయడం లేదా పూర్తిగా మింగివేయడం. ‘దహించివేయు’ అగ్ని చిత్రాన్ని సహజమైన తెలుగులో స్పష్టంగా నిలుపుతుంది.
- source_word: בַּעֲלֵי שְׁכֶם
  choice: షెకెము అధిపతులు
  rationale: ఈ సందర్భంలో בעלים నగరపు పాలకులు, అధికారవంతులు లేదా ప్రముఖులను సూచిస్తుంది. ‘అధిపతులు’ సామాజిక-రాజకీయ అధికార భావాన్ని నిలుపుతూ ఆధునిక పాఠకులకు అర్థమయ్యే పదం.
- source_word: בֵּית מִלּוֹא
  choice: బేత్-మిల్లో
  rationale: ఇది స్థలం లేదా దానితో అనుబంధమైన సమూహానికి స్థిరనామంగా పనిచేసే అవకాశం ఉన్నందున పేరుగా లిప్యంతరీకరించబడింది; పదశః నిర్మాణాన్ని పాదసూచికలో ఉంచాం.
- source_word: וְתֵצֵא אֵשׁ מִבַּעֲלֵי שְׁכֶם וּמִבֵּית מִלּוֹא
  choice: అలాగే షెకెము అధిపతుల నుండి, బేత్-మిల్లో నుండి అగ్ని బయలుదేరి
  rationale: మొదటి భాగానికి సమాంతరంగా పునరావృతం చేసి, పరస్పర వినాశాన్ని ప్రకటించే శాప నిర్మాణాన్ని కాపాడుతుంది.
- source_word: אֶת אֲבִימֶלֶךְ
  choice: అబీమెలెకును
  rationale: చివరి క్రియకు ప్రత్యక్ష కర్మగా సహజమైన తెలుగు విభక్తితో ఇచ్చి, పరస్పర వినాశ నిర్మాణాన్ని అబీమెలెకుతో ముగిస్తుంది.
theological_decisions:
- issue: ‘అగ్ని’ చిత్ర స్వభావం
  choice: శాపవాక్యంలోని ‘అగ్ని’ అనే మూల చిత్రాన్ని యథాతథంగా ఉంచడం
  alternative: దాన్ని హింసాత్మక ఘర్షణకు రూపకమని లేదా ప్రత్యక్ష దైవిక అగ్నితీర్పని ప్రధాన పాఠంలో వివరించడం
  rationale: హెబ్రీ పాఠం స్పష్టంగా ‘అగ్ని’ అనే దృశ్యాన్ని ఉపయోగిస్తుంది. సందర్భంలో అది పరస్పర వినాశాన్ని ముందుగా సూచించినా, అది అక్షరార్థమా, రూపకమా, లేక రెండూ కలిసినదా అన్న ఉద్రిక్తతను అనువాదం పరిష్కరించకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన వాక్యనిర్మాణాన్ని వాడుతూ, శాపవాక్యానికి తగిన గంభీరత కోసం ‘దహించివేయుగాక’ అనే ఆకాంక్షార్థక రూపం ఎంచుకోబడింది. రెండు అర్ధవాక్యాల సమాంతర నిర్మాణం ఉద్దేశపూర్వకంగా నిలుపబడింది.
