reference: Judges 9:28
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר גַּ֣עַל בֶּן עֶ֗בֶד מִֽי אֲבִימֶ֤לֶךְ וּ/מִֽי שְׁכֶם֙ כִּ֣י נַעַבְדֶ֔/נּוּ הֲ/לֹ֥א בֶן יְרֻבַּ֖עַל וּ/זְבֻ֣ל פְּקִיד֑/וֹ עִבְד֗וּ אֶת אַנְשֵׁ֤י חֲמוֹר֙ אֲבִ֣י שְׁכֶ֔ם וּ/מַדּ֖וּעַ נַעַבְדֶ֥/נּוּ אֲנָֽחְנוּ׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/028.yaml
  text: And Gaal son of Ebed said[a], “Who is Abimelek, and who is Shechem, that we should serve him? Is he not the son of Jerubbaal, and Zebul his officer? Serve the men of Hamor[c][b], the father of Shechem! But why should we serve him?”
translation:
  language: te
  text: 'ఎబెదు కుమారుడైన గాలు ఇలా అన్నాడు: “అబీమెలెకు ఎవడు? షెకెము ఎవడు[a], మనం అతనికి సేవ చేయడానికి? అతడు యెరుబ్బయలు కుమారుడు కాడా? జెబూలు అతని నియమిత అధికారి కాడా[b]? షెకెము తండ్రియైన హమోరుకు చెందిన ప్రజలకు సేవ చేయండి[c]! మనం మాత్రం అతనికి ఎందుకు సేవ చేయాలి?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అబీమెలెకు ఎవడు? షెకెము ఏమిటి...?” హీబ్రూ పాఠం ‘షెకెము’ అనే పేరునే నేరుగా పేర్కొంటుంది; అది నగరాన్ని లేదా దాని పాలక సమాజాన్ని లక్షణార్థంగా సూచిస్తుండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “అతని నియమిత అధికారి” అనే మాటను “అతని ప్రతినిధి” లేదా “అతని పరిపాలకుడు” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: అంటే, హమోరు వంశస్థులు లేదా అతనితో అనుబంధమైన ప్రజలు. హమోరు షెకెము తండ్రిగా పేర్కొనబడుతున్నాడు; ఆదికాండము 34 చూడండి.
    reason: cross_reference
lexical_decisions:
- source_word: מִי אֲבִימֶלֶךְ וּמִי שְׁכֶם
  choice: అబీమెలెకు ఎవడు? షెకెము ఎవడు?
  rationale: מִי అనే ప్రశ్నార్థకం ఇక్కడ హోదా, చట్టబద్ధతలను ధిక్కారంగా సవాలు చేస్తుంది. షెకెము అనే పేరును మూలంలో ఉన్నట్టే ఉంచడం వల్ల నగరం లేదా దాని పాలక సమాజాన్ని సూచించే లక్షణార్థక అస్పష్టత నిలుస్తుంది.
- source_word: כִּי נַעַבְדֶנּוּ
  choice: మనం అతనికి ఎందుకు సేవ చేయాలి?
  rationale: עבד ఇక్కడ సాధారణ పనికంటే రాజకీయ విధేయతను సూచిస్తుంది. తెలుగులో సందర్భానికి సహజంగా ఉండేందుకు ప్రశ్నలోని ఉద్దేశాన్ని ‘ఎందుకు’తో వ్యక్తం చేశాం.
- source_word: הֲלֹא בֶן יְרֻבַּעַל
  choice: అతడు యెరుబ్బయలు కుమారుడు కాడా?
  rationale: הֲלֹא సమ్మతిని ఆశించే అలంకార ప్రశ్న. వంశాన్ని నొక్కిచెప్పే పూర్తి బంధసూచనను నిలిపాం.
- source_word: וּזְבֻל פְּקִידוֹ
  choice: జెబులు అతడు నియమించిన అధికారి కాడా?
  rationale: פָּקִיד అనేది నియమిత పరిపాలకుడు లేదా అధీన అధికారిని సూచిస్తుంది. ‘నియమించిన అధికారి’ పాత్రను అతిగా నిర్దిష్టం చేయకుండా అర్థాన్ని తెలియజేస్తుంది.
- source_word: עִבְדוּ
  choice: సేవ చేయండి
  rationale: పుంలింగ బహువచన ఆజ్ఞారూపంలోని పదునైన పిలుపును ప్రత్యక్ష ఆజ్ఞగా ఉంచాం.
- source_word: אַנְשֵׁי חֲמוֹר אֲבִי שְׁכֶם
  choice: షెకెము తండ్రియైన హమోరుకు చెందిన ప్రజలు
  rationale: אַנְשֵׁי అక్షరార్థంగా ‘మనుషులు/ప్రజలు’ అని, హమోరుతో వంశపరంగా లేదా సామాజికంగా అనుబంధమైనవారిని సూచించవచ్చు. సహజమైన తెలుగులో ఆ అనుబంధాన్ని నిలిపాం.
- source_word: וּמַדּוּעַ נַעַבְדֶנּוּ אֲנָחְנוּ
  choice: మనం మాత్రం అతనికి ఎందుకు సేవ చేయాలి?
  rationale: చివర ఉన్న స్వతంత్ర సర్వనామం אֲנָחְנוּ ఇచ్చే ఉద్ఘాటనను ‘మనం మాత్రం’ ద్వారా తెలిపాం; వాక్యంలోని పరాకాష్ఠ సవాలు నిలుస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవభరితమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలిని అనుసరించాం. గాలు పలికిన ధిక్కారభరిత రాజకీయ సవాలును అలంకార ప్రశ్నలతో నిలిపాం. వ్యక్తి పేరు ‘షెకెము’ నగరం/సమాజాన్ని సూచించే మూలపాఠ అస్పష్టతను పాదటిప్పణిలో వివరించాం.
