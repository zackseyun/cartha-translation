  - severity: low
    issue: The reflexive idiom can be phrased more idiomatically.
    rationale: Changing 'వారి సొంత తలల మీదికి' to 'వారి తలల మీదికే' retains the Hebrew image and reflexive emphasis while reading more smoothly in modern standard Telugu.
