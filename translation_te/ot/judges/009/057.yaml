id: JDG.9.57
reference: Judges 9:57
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אֵ֗ת כָּל רָעַת֙ אַנְשֵׁ֣י שְׁכֶ֔ם הֵשִׁ֥יב אֱלֹהִ֖ים בְּ/רֹאשָׁ֑/ם וַ/תָּבֹ֣א אֲלֵי/הֶ֔ם קִֽלֲלַ֖ת יוֹתָ֥ם בֶּן יְרֻבָּֽעַל־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/057.yaml
  text: And God repaid all the evil of the men of Shechem on their own heads, and the curse of Jotham son of Jerubbaal came upon them.
translation:
  language: te
  text: షెకెము మనుష్యులు చేసిన చెడు అంతటినీ దేవుడు వారి తలల మీదికే తిరిగి రప్పించాడు. యెరుబ్బయలు కుమారుడైన యోతాము శాపం వారి మీదికి వచ్చింది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֵשִׁיב
  choice: తిరిగి రప్పించాడు
  rationale: హిఫిల్ రూపం దేవుడు వారి చెడును వారిపైనే తిరిగి వచ్చేలా చేసిన క్రియాశీల ప్రతిఫలాన్ని సూచిస్తుంది; ఈ ఎంపిక మూలంలోని ‘తిరిగి’ అనే భావచిత్రాన్ని నిలుపుతుంది.
- source_word: רָעַת
  choice: చెడు
  rationale: ఇక్కడ పదం కేవలం అపాయం లేదా దురదృష్టం కాక, షెకెము మనుష్యులు చేసిన నైతిక దుష్కార్యాన్ని సూచిస్తుంది.
- source_word: בְּרֹאשָׁם
  choice: వారి సొంత తలల మీదికి
  rationale: చేసిన దాని పరిణామం చేసినవారిపైనే పడిందనే హీబ్రూ నుడికారాన్ని సహజమైన తెలుగులో, దాని దృశ్యరూపాన్ని కాపాడుతూ వ్యక్తం చేస్తుంది.
- source_word: קִלֲלַת
  choice: శాపం
  rationale: ఇది అధ్యాయంలో ముందుగా యోతాము పలికిన శాపవాక్యాన్ని సూచించే సహజమైన, సందర్భోచితమైన పదం.
- source_word: וַתָּבֹא אֲלֵיהֶם
  choice: వారి మీదికి వచ్చింది
  rationale: శాపం వారిని చేరి అమలైనదనే తీర్పు భావాన్ని, మూలంలోని గమన రూపకాన్ని నిలుపుతూ తెలుపుతుంది.
- source_word: אַנְשֵׁי שְׁכֶם
  choice: షెకెము మనుష్యులు
  rationale: మూలంలోని పురుషవాచక సమూహపదాన్ని నిర్దిష్టంగా అనువదిస్తుంది; ‘ప్రజలు’ లేదా ‘నాయకులు’ అని విస్తరించదు.
- source_word: אֱלֹהִים
  choice: దేవుడు
  rationale: ఏకవచన క్రియతో ఉన్న ఈ పదం ఇక్కడ తీర్పు తీర్చే ఇశ్రాయేలు దేవుణ్ణి సూచిస్తుంది.
- source_word: יוֹתָם בֶּן יְרֻבָּעַל
  choice: యెరుబ్బయలు కుమారుడైన యోతాము
  rationale: వ్యక్తిపేర్లను తెలుగులో లిప్యంతరీకరించి, తండ్రి-కుమార సంబంధాన్ని సహజంగా నిలుపుతుంది.
theological_decisions:
- issue: దైవిక ప్రతిఫల భాష
  choice: దేవుడు వారి చెడును వారి సొంత తలల మీదికి తిరిగి రప్పించాడు
  alternative: దేవుడు వారి చెడు వారిపైనికి తిరిగి రావడానికి అనుమతించాడు
  rationale: הֵשִׁיב అనే క్రియకు దేవుడే వ్యాకరణ కర్త. కాబట్టి కథనం దేవుని క్రియాశీల తీర్పుగా చెప్పే భావాన్ని ‘అనుమతించాడు’ అని మృదువుచేయకుండా నిలుపబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకునికి స్పష్టంగా ఉండే శైలి. ‘సొంత తలల మీదికి’ అనే నుడికారం హీబ్రూ చిత్రాన్ని కాపాడుతుంది. వివరణాత్మకంగా ‘పలికిన’ అనే పదం చేర్చి ‘యోతాము శాపం’ అంటే యోతాము పలికిన శాపమని సహజ తెలుగులో స్పష్టం చేయబడింది; భావానికి కొత్త అంశం జోడించలేదు.
