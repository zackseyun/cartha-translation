  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/תֹּ֤אמֶר לָ/הֶם֙ הַ/תְּאֵנָ֔ה הֶ/חֳדַ֨לְתִּי֙ אֶת מָתְקִ֔/י וְ/אֶת תְּנוּבָתִ֖/י הַ/טּוֹבָ֑ה וְ/הָ֣לַכְתִּ֔י לָ/נ֖וּעַ עַל הָ/עֵצִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/011.yaml
  text: But the fig tree said to them[a], ‘Should I stop producing my sweetness and my good fruit, and go to sway over the trees?’
translation:
  language: te
  text: అయితే అంజూరపు చెట్టు వాటితో, “నేను నా తీపినీ, నా మంచి ఫలాన్నీ ఇవ్వడం మాని, చెట్లమీద ఊగుతూ తిరగడానికి వెళ్లాలా?[a]” అంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “చెట్లను పరిపాలించడానికి వెళ్లాలా?” హీబ్రూ క్రియకు అక్షరార్థంగా ‘ఊగడం’ లేదా ‘కదలడం’ అని అర్థం; ఈ నీతికథలో అది చెట్టు-చిత్రణను నిలుపుతూనే పరిపాలనను కూడా సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: అయితే ... అంది
  rationale: వావ్ వరుస కథనాన్ని ముందుకు నడిపినా, ముందటి నిరాకరణకు సమాంతరంగా వచ్చే వ్యత్యాసాన్ని సహజమైన తెలుగులో ‘అయితే’ తెలియజేస్తుంది.
- source_word: הַתְּאֵנָה
  choice: అంజూరపు చెట్టు
  rationale: మాట్లాడే పాత్రగా ఉన్న fig treeను ఆధునిక ప్రామాణిక తెలుగులో స్పష్టంగా సూచిస్తుంది.
- source_word: הֶחֳדַלְתִּי
  choice: ఇవ్వడం మానేసి ... వెళ్లాలా?
  rationale: పూర్తిక్రియా రూపం ఇక్కడ ఆలోచనాత్మక ప్రశ్న భావాన్ని కలిగిస్తుంది; ‘మానేసి ... వెళ్లాలా?’ ఆ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: מָתְקִי
  choice: నా తీపి
  rationale: మూలంలోని ‘నా తీపి’ అనే వ్యక్తీకరణను నిలుపుతుంది; దాన్ని కేవలం ‘తీపి ఫలం’గా సమతలీకరించదు.
- source_word: תְּנוּבָתִי הַטּוֹבָה
  choice: నా మంచి ఫలం
  rationale: అంజూరపు చెట్టు సందర్భంలో תְּנוּבָהకు ‘ఫలం’ సహజమైన సమానార్థకం; విశేషణాన్ని నేరుగా నిలుపుతుంది.
- source_word: לָנוּעַ
  choice: ఊగడానికి
  rationale: נוע యొక్క ప్రాథమికమైన కదలడం/ఊగడం భావాన్ని, చెట్టు రూపకాన్ని నిలుపుతూ అనువదిస్తుంది; కథలోని పరిపాలన సూచనను పాదసూచికలో తెలియజేస్తుంది.
- source_word: עַל הָעֵצִים
  choice: చెట్లపై
  rationale: స్థానార్థం మరియు అధికార సూచన రెండింటినీ సందర్భంలో మోయగల సంక్షిప్త రూపం.
theological_decisions:
- issue: נוע అనే క్రియలో చెట్టు ఊగడం మరియు పరిపాలించడం మధ్య ఉన్న ద్వంద్వార్థం
  choice: ప్రధాన పాఠంలో ‘ఊగడానికి’
  alternative: ‘పరిపాలించడానికి’
  rationale: మూలంలోని చెట్టు-చిత్రణను ప్రధాన పాఠంలో కాపాడుతూ, నీతికథలోని రాజ్యాధికార సూచనను పాదసూచిక ద్వారా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. వ్యక్తీకరించబడిన చెట్టు రూపకాన్ని, ప్రశ్నలోని వ్యంగ్యాన్ని నిలుపుకుంది.
