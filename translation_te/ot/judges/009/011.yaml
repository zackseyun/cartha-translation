revisions:
- from: అయితే అంజూరపు చెట్టు వాటితో, “నేను నా తీపిని, నా మంచి ఫలాన్ని ఇవ్వడం మానేసి, చెట్లపై ఊగడానికి వెళ్లాలా?[a]” అంది.
  to: అయితే అంజూరపు చెట్టు వాటితో, “నేను నా తీపినీ, నా మంచి ఫలాన్నీ ఇవ్వడం మాని, చెట్లమీద ఊగుతూ తిరగడానికి వెళ్లాలా?[a]” అంది.
  rationale: The revision removes the potentially misleading sense of physically swinging on the trees, while retaining the Hebrew verb’s literal arboreal imagery in the main text. The footnote continues to identify ‘rule over’ as a contextual alternative, preserving the fable’s wordplay without over-interpreting it.
