id: JDG.9.44
reference: Judges 9:44
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/אֲבִימֶ֗לֶךְ וְ/הָ/רָאשִׁים֙ אֲשֶׁ֣ר עִמּ֔/וֹ פָּשְׁט֕וּ וַ/יַּ֣עַמְד֔וּ פֶּ֖תַח שַׁ֣עַר הָ/עִ֑יר וּ/שְׁנֵ֣י הָֽ/רָאשִׁ֗ים פָּֽשְׁט֛וּ עַֽל כָּל אֲשֶׁ֥ר בַּ/שָּׂדֶ֖ה וַ/יַּכּֽוּ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/044.yaml
  text: And Abimelech and the leaders who were with him rushed forward and took their stand at the entrance of the city gate[a], while the two other companies rushed against everyone who was in the field and struck them down.
translation:
  language: te
  text: అబీమెలెకు, అతనితో ఉన్న నాయకులు వేగంగా ముందుకు దూసుకెళ్లి పట్టణ ద్వారపు ప్రవేశం వద్ద స్థానం తీసుకున్నారు. మిగిలిన రెండు దళాలు[a] పొలంలో ఉన్న వారందరిపైకి దూసుకెళ్లి వారిని కొట్టివేశాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ అక్షరార్థంగా, “ఆ ఇద్దరు నాయకులు.” ముందటి వచనంలో సైన్యం మూడు దళాలుగా విభజించబడిన సందర్భాన్ని బట్టి, ఇక్కడ మిగిలిన రెండు దళాలు లేదా విభాగాలు ఉద్దేశించబడి ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּשְׁטוּ
  choice: వేగంగా ముందుకు దూసుకెళ్లి / మీదికి దూసుకెళ్లి
  rationale: ఈ సైనిక సందర్భంలో క్రియ వేగంగా ముందుకు సాగి దాడి చేయడాన్ని సూచిస్తుంది; రెండు చోట్ల సందర్భానుగుణంగా సహజమైన తెలుగు రూపాలు వాడబడ్డాయి.
- source_word: הָרָאשִׁים
  choice: నాయకులు
  rationale: అక్షరార్థంగా ‘తలలు’; ఇక్కడ అబీమెలెకుతో ఉన్న సైనిక నాయకులను సూచిస్తుంది.
- source_word: וַיַּעַמְדוּ
  choice: తమ స్థానాల్లో నిలిచారు
  rationale: సాధారణంగా నిలబడటం మాత్రమే కాక, యుద్ధ వ్యూహంలో ఉద్దేశపూర్వకంగా ఒక చోట స్థానం చేపట్టడాన్ని వ్యక్తం చేస్తుంది.
- source_word: פֶּתַח שַׁעַר הָעִיר
  choice: పట్టణ ద్వార ప్రవేశం దగ్గర
  rationale: ద్వారం యొక్క ప్రవేశస్థలాన్ని స్పష్టంగా, సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: וּשְׁנֵי הָרָאשִׁים
  choice: మిగిలిన రెండు దళాలు[a]
  rationale: హీబ్రూ అక్షరార్థంగా ‘రెండు నాయకులు’ అని ఉన్నప్పటికీ, ముందటి వచనంలోని మూడు దళాల సందర్భంలో ఇక్కడ మిగిలిన రెండు సైనిక విభాగాలనే సూచించే అవకాశం బలంగా ఉంది; మూలంలోని రూపాన్ని పాదటిప్పణిలో నిలిపాం.
- source_word: עַל כָּל אֲשֶׁר בַּשָּׂדֶה
  choice: పొలంలో ఉన్న వారందరి మీదికి
  rationale: తరువాతి బహువచన కర్మప్రత్యయం దృష్ట్యా పొలంలో ఉన్న మనుషులే ఉద్దేశించబడ్డారని స్పష్టమవుతుంది.
- source_word: וַיַּכּוּם
  choice: వారిని హతమార్చాయి
  rationale: నכה అనే క్రియ ఇక్కడ దాడిలో కొట్టి సంహరించడాన్ని సూచిస్తుంది; తెలుగు కథనశైలిలో ‘హతమార్చాయి’ ఆ హింసాత్మక ఫలితాన్ని సంక్షిప్తంగా తెలియజేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కథనశైలి. సైనిక కదలికను స్పష్టంగా చూపుతూ, וּשְׁנֵי הָרָאשִׁים లోని నిజమైన పదార్థ–సందర్భ ఉద్రిక్తతను పాదటిప్పణిలో సంరక్షించాం.
