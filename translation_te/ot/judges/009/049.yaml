  register: ఆధునిక ప్రామాణిక తెలుగులో, కథనానికి తగిన గంభీరమైన కాని సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి వాడబడింది. ‘అబీమెలెకు,’ ‘షెకెము’ అనే రూపాలు తెలుగు బైబిలు నామరూపాలకు అనుగుణంగా ఉంచబడ్డాయి.
