- from: 'అప్పుడు ప్రజలందరూ కూడా ఒక్కొక్కరు ఒక్కో కొమ్మను నరికి, అబీమెలెకు వెంట వెళ్లారు. వారు ఆ కొమ్మలను లోపలి ఆశ్రయగదికి[a] ఆనించి కుప్పగా వేసి, అక్కడున్న వారిమీద ఆ గదికి నిప్పంటించారు. అలా షెకెము గోపురానికి చెందిన వారందరూ కూడా చనిపోయారు; పురుషులు, స్త్రీలు కలిపి దాదాపు వెయ్యిమంది.


    [a] లేదా, “కోటకు.” ఇక్కడి హీబ్రూ పదం గోపురంలో ప్రజలు ఆశ్రయం పొందిన రక్షిత లోపలి భాగాన్ని సూచిస్తుండవచ్చు.'
  to: అప్పుడు ప్రజలందరూ కూడా ఒక్కొక్కరు ఒక్కో కొమ్మను నరికి, అబీమెలెకు వెంట వెళ్లారు. వారు ఆ కొమ్మలను లోపలి ఆశ్రయగదికి[a] ఆనించి కుప్పగా వేసి, వారి మీద ఉన్న ఆ ఆశ్రయగదికి నిప్పంటించారు. అలా షెకెము గోపురానికి చెందిన వారందరూ కూడా చనిపోయారు; పురుషులు, స్త్రీలు కలిపి దాదాపు వెయ్యిమంది.
  rationale: నిర్మాణానికి నిప్పంటించడం మరియు అది ప్రజలపై/వారిమీద ఉండడం అనే మూల వాక్యంలోని సంబంధాన్ని తెలుగులో స్పష్టీకరించాం. పాదటిప్పణి ప్రత్యామ్నాయాన్ని వ్యాకరణపరంగా సరైన నామరూపంలోకి మార్చాం. ఇతరచోట్ల మూలంలోని అనిశ్చితి, సంఖ్యలోని సుమారు భావం, మరియు కథన రిజిస్టర్ యథాతథంగా ఉంచబడ్డాయి.
