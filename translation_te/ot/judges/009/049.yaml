source:
  edition: WLC
  text: וַ/יִּכְרְת֨וּ גַם כָּל הָ/עָ֜ם אִ֣ישׁ שׂוֹכֹ֗/ה וַ/יֵּ֨לְכ֜וּ אַחֲרֵ֤י אֲבִימֶ֨לֶךְ֙ וַ/יָּשִׂ֣ימוּ עַֽל הַ/צְּרִ֔יחַ וַ/יַּצִּ֧יתוּ עֲלֵי/הֶ֛ם אֶֽת הַ/צְּרִ֖יחַ בָּ/אֵ֑שׁ וַ/יָּמֻ֜תוּ גַּ֣ם כָּל אַנְשֵׁ֧י מִֽגְדַּל שְׁכֶ֛ם כְּ/אֶ֖לֶף אִ֥ישׁ וְ/אִשָּֽׁה־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/049.yaml
  text: So all the people also cut down a branch each[a], and they went after Abimelech and piled them against the inner chamber, and set the inner chamber on fire over them, so that all the people of the tower of Shechem also died[b], about a thousand men and women.
translation:
  language: te
  text: అప్పుడు ప్రజలందరూ కూడా ఒక్కొక్కరు ఒక్కో కొమ్మను నరికి, అబీమెలెకు వెంట వెళ్లారు. వారు ఆ కొమ్మలను లోపలి ఆశ్రయగదికి[a] ఆనించి కుప్పగా వేసి, వారి మీద ఉన్న ఆ ఆశ్రయగదికి నిప్పంటించారు. అలా షెకెము గోపురానికి చెందిన వారందరూ కూడా చనిపోయారు; పురుషులు, స్త్రీలు కలిపి దాదాపు వెయ్యిమంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అంతర్గత కోట.” ఇక్కడి హీబ్రూ పదం గోపురంలో ప్రజలు ఆశ్రయం పొందిన రక్షిత లోపలి భాగాన్ని సూచిస్తుండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְרְתוּ ... אִישׁ שׂוֹכֹה
  choice: ఒక్కొక్కరు ఒక్కో కొమ్మను నరికి
  rationale: హీబ్రూలోని ‘ఒక్కొక్క వ్యక్తి తన కొమ్మను’ అనే పంపిణీ భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది; שׂוֹכֹה ను సందర్భానుసారం ‘కొమ్మ’గా అనువదించింది.
- source_word: וַיֵּלְכוּ אַחֲרֵי אֲבִימֶלֶךְ
  choice: అబీమెలెకు వెంట వెళ్లారు
  rationale: ‘అతని వెనుక వెళ్లారు’ అనే మూలార్థాన్నీ, అతని నాయకత్వాన్ని అనుసరించారనే సైనిక కథన భావాన్నీ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: הַצְּרִיחַ
  choice: లోపలి ఆశ్రయగది
  rationale: తరువాత వచ్చే מִגְדַּל (‘గోపురం’)తో దీనిని వేరు చేస్తూ, ప్రజలు తలదాచుకున్న రక్షిత లోపలి భాగమనే సంభావ్య అర్థాన్ని తెలియజేస్తుంది; పదార్థంలోని అనిశ్చితిని పాదటిప్పణిలో ఉంచింది.
- source_word: וַיָּשִׂימוּ עַל הַצְּרִיחַ
  choice: ఆ కొమ్మలను లోపలి ఆశ్రయగదికి ఆనించి కుప్పగా వేసి
  rationale: עַל యొక్క ‘మీద/వద్ద/ఆనించి’ అనే స్థలసంబంధ భావాన్ని అగ్ని పెట్టే సందర్భంలో సహజంగా తెలుపుతుంది. ‘కుప్పగా’ అనేది అనేక మంది తెచ్చిన కొమ్మల సమిష్టి చర్యను స్పష్టం చేస్తుంది.
- source_word: וַיַּצִּיתוּ עֲלֵיהֶם אֶת הַצְּרִיחַ בָּאֵשׁ
  choice: అక్కడున్న వారిమీద ఆ గదికి నిప్పంటించారు
  rationale: עֲלֵיהֶם లోని ‘వారిమీద’ అనే స్థల భావాన్ని నిలుపుతూ, ఆశ్రయగదిలో లేదా దాని కింద చిక్కుకున్నవారిపై నిర్మాణాన్ని తగలబెట్టారనే దృశ్యాన్ని అతిగా నిర్దిష్టం చేయకుండా అందిస్తుంది.
- source_word: אַנְשֵׁי מִגְדַּל שְׁכֶם
  choice: షెకెము గోపురానికి చెందిన వారందరూ
  rationale: אַנְשֵׁי రూపపరంగా పురుష బహువచనమైనా, వెంటనే ‘పురుషులు, స్త్రీలు’ అని స్పష్టీకరించబడినందున ఇక్కడ గోపురంతో సంబంధమున్న మొత్తం జనసమూహాన్ని సూచించే ‘వారు’ సహజంగా సరిపోతుంది.
- source_word: כְּאֶלֶף אִישׁ וְאִשָּׁה
  choice: పురుషులు, స్త్రీలు కలిపి దాదాపు వెయ్యిమంది
  rationale: כְּ ఉపసర్గలోని సుమారు అనే భావాన్ని ‘దాదాపు’గా, రెండు లింగాలనూ లెక్కలో చేర్చిన విషయాన్ని స్పష్టమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
