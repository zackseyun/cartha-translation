id: JDG.9.23
reference: Judges 9:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֤ח אֱלֹהִים֙ ר֣וּחַ רָעָ֔ה בֵּ֣ין אֲבִימֶ֔לֶךְ וּ/בֵ֖ין בַּעֲלֵ֣י שְׁכֶ֑ם וַ/יִּבְגְּד֥וּ בַעֲלֵי שְׁכֶ֖ם בַּ/אֲבִימֶֽלֶךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/023.yaml
  text: Then God sent an evil spirit between Abimelech and the leaders of Shechem[c][b][a], and the leaders of Shechem dealt treacherously with Abimelech.
translation:
  language: te
  text: అప్పుడు దేవుడు అబీమెలెకుకూ షెకెము నాయకులకూ మధ్య ఒక దుష్టాత్మను[a] పంపాడు. షెకెము నాయకులు అబీమెలెకుకు ద్రోహం చేశారు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘హానికరమైన ఆత్మను.’ హీబ్రూ పదబంధం నైతిక చెడును గానీ, హాని కలిగించే ప్రభావాన్ని గానీ నొక్కి చెప్పవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: లేదా ‘అబీమెలెకుకు వ్యతిరేకంగా విశ్వాసఘాతుకంగా ప్రవర్తించారు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: పంపాడు
  rationale: שׁלח అనే క్రియను నేరుగా, సహజంగా అనువదిస్తూ దేవుని క్రియాశీల పాత్రను యథాతథంగా నిలుపుతుంది.
- source_word: אֱלֹהִים
  choice: దేవుడు
  rationale: ఈ కథన సందర్భంలో ఇది ఇశ్రాయేలు దేవుణ్ణి సూచిస్తుంది; ఆధునిక ప్రామాణిక తెలుగులో సహజమైన సమానార్థకం ‘దేవుడు’.
- source_word: רוּחַ רָעָה
  choice: ఒక దుష్టాత్మను
  rationale: רוּחַ רָעָהలోని నైతిక చెడును నేరుగా వ్యక్తం చేస్తుంది. హానికరమైన ప్రభావం అనే భావం కూడా సాధ్యమైనందున దానిని పాదటిప్పణిలో ఉంచాం.
- source_word: בֵּין ... וּבֵין
  choice: …కు, …కు మధ్య
  rationale: రెండు పక్షాల మధ్య కలిగిన విభేదాన్ని సూచించే హీబ్రూ జంట ప్రయోగాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: בַּעֲלֵי שְׁכֶם
  choice: షెకెము నాయకులు
  rationale: బַּעֲלֵי అనే పదానికి అక్షరార్థంగా ‘యజమానులు/ప్రభువులు’ అనే భావం ఉన్నా, ఇక్కడ నగరంలోని అధికారమున్న ప్రముఖులను సూచిస్తుంది; ‘నాయకులు’ ఆ పౌర-రాజకీయ భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: וַיִּבְגְּדוּ
  choice: ద్రోహం చేశారు
  rationale: בגד సూచించే అవిశ్వాసపూరితమైన, విశ్వాసఘాతుకమైన ప్రవర్తనను సంక్షిప్తమైన సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: בַּאֲבִימֶלֶךְ
  choice: అబీమెలెకుకు
  rationale: בגדతో వచ్చిన ב ఇక్కడ ద్రోహం ఎవరిపట్ల జరిగిందో సూచిస్తుంది; ‘అబీమెలెకుకు ద్రోహం చేశారు’ అనేది సహజమైన తెలుగు ప్రయోగం.
theological_decisions:
- issue: దుష్టాత్మను పంపడంలో దేవుని ప్రత్యక్ష పాత్ర
  choice: ‘దేవుడు … ఒక దుష్టాత్మను పంపాడు’ అని ప్రత్యక్ష దైవకర్తృత్వంతో అనువదించడం
  alternative: ‘దేవుడు ఒక దుష్టాత్మను అనుమతించాడు’ లేదా ‘వైరం కలిగించే ఆత్మను రానిచ్చాడు’
  rationale: హీబ్రూ క్రియ, వాక్యనిర్మాణం పంపడాన్ని దేవునికే నేరుగా ఆపాదిస్తున్నాయి. దానిని కేవలం అనుమతిగా మార్చడం మూలపాఠంలోని ధార్మిక ఉద్రిక్తతను వ్యాఖ్యానంతో తగ్గించినట్లవుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘దుష్టాత్మ’ అనే ప్రత్యక్ష పదప్రయోగంతో మూలంలోని ధార్మిక ఉద్రిక్తత నిలుపబడింది; ‘నాయకులు’ ద్వారా నగరంలోని అధికార వర్గాన్ని సాధారణ పాఠకులకు స్పష్టంగా తెలియజేశారు.
