  text: וַ/יִּשְׁמַ֗ע זְבֻל֙ שַׂר הָ/עִ֔יר אֶת דִּבְרֵ֖י גַּ֣עַל בֶּן עָ֑בֶד וַ/יִּ֖חַר אַפּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/030.yaml
  text: When Zebul[a], the ruler of the city, heard the words of Gaal son of Ebed, his anger burned.
translation:
  language: te
  text: పట్టణానికి అధిపతియైన జెబులు, ఏబెదు కుమారుడైన గయాలు మాటలు విన్నప్పుడు జెబులుకు కోపం రగిలింది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “అతని ముక్కు మండింది”; ఇది “అతడు కోపగించుకున్నాడు” లేదా “అతని కోపం రగిలింది” అనే అర్థమిచ్చే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: విన్నప్పుడు
  rationale: కథనాన్ని ముందుకు నడిపించే వావ్-కన్సిక్యూటివ్ రూపాన్ని తెలుగులో సహజమైన కాలసంబంధ ఉపవాక్యంగా ఇచ్చాం; ఇక్కడ שׁמע అనేది విధేయతతో వినడం కంటే గాలు పలికిన మాటలు వినడాన్ని సూచిస్తుంది.
- source_word: זְבֻל
  choice: జెబులు
  rationale: వ్యక్తి పేరును హీబ్రూ ఉచ్చారణకు సమీపంగా తెలుగు లిపిలో లిప్యంతరీకరించాం.
- source_word: שַׂר הָעִיר
  choice: పట్టణ అధిపతి
  rationale: שַׂר నాయకుడు, అధిపతి లేదా ఉన్నతాధికారిని సూచించగలదు. నిర్దిష్టమైన ఆధునిక పరిపాలనా పదవిని ఆపాదించకుండా జెబులు అధికారాన్ని తెలియజేయడానికి ‘అధిపతి’ని ఎంచుకున్నాం.
- source_word: אֶת דִּבְרֵי
  choice: మాటలు
  rationale: దִּבְרֵי అనే స్పష్టమైన ‘మాటలు’ భావాన్ని నిలుపుతూ తెలుగులో సహజంగా ఉంది.
- source_word: גַּעַל בֶּן עָבֶד
  choice: ఏబెదు కుమారుడైన గాలు
  rationale: పేర్లను లిప్యంతరీకరించి, హీబ్రూ పితృనామ సంబంధాన్ని తెలుగులో సహజంగా వ్యక్తం చేశాం.
- source_word: וַיִּחַר אַפּוֹ
  choice: అతని కోపం రగులుకుంది
  rationale: అక్షరార్థంగా ముక్కు మండడాన్ని సూచించే హీబ్రూ నుడికారంలోని వేడి రూపకాన్ని నిలుపుతూ, దాని ఉద్దేశమైన తీవ్రమైన కోపాన్ని ఆధునిక తెలుగులో స్పష్టంగా తెలిపే రూపం.
