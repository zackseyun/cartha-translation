  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֵּ֨לֶךְ אֲבִימֶ֤לֶךְ בֶּן יְרֻבַּ֨עַל֙ שְׁכֶ֔מָ/ה אֶל אֲחֵ֖י אִמּ֑/וֹ וַ/יְדַבֵּ֣ר אֲלֵי/הֶ֔ם וְ/אֶל כָּל מִשְׁפַּ֛חַת בֵּית אֲבִ֥י אִמּ֖/וֹ לֵ/אמֹֽר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/001.yaml
  text: Abimelech son of Jerubbaal went to Shechem[a], to his mother's brothers, and spoke to them and to the whole clan of his mother's father's house, saying,
translation:
  language: te
  text: 'యెరుబ్బయలు కుమారుడైన అబీమెలెకు షెకెముకు, తన తల్లి సోదరుల దగ్గరికి వెళ్లాడు. అతడు వారితోనూ, తన తల్లి యొక్క తండ్రి ఇంటి కుటుంబవర్గమంతటితోనూ[a] ఇలా మాట్లాడాడు:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “తన తల్లి యొక్క తండ్రి ఇల్లు” అనేది అతని తల్లివైపు కుటుంబ గృహవర్గాన్ని లేదా వంశశాఖను సూచిస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: వెళ్లాడు
  rationale: వావ్-క్రమబద్ధ క్రియ కథనాన్ని ముందుకు నడిపిస్తుంది. తెలుగులో ప్రత్యేకంగా ‘అప్పుడు’ అని చేర్చకుండా సాధారణ భూతకాల క్రియ సహజంగా ఆ క్రమాన్ని తెలియజేస్తుంది.
- source_word: אֲבִימֶלֶךְ
  choice: అబీమెలెకు
  rationale: వ్యక్తి పేరును ఆధునిక ప్రామాణిక తెలుగు ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: בֶּן יְרֻבַּעַל
  choice: యెరుబ్బయలు కుమారుడైన
  rationale: తండ్రీకొడుకుల సంబంధాన్ని మూలంలోని గుర్తింపు నిర్మాణానికి దగ్గరగా, తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: שְׁכֶמָה
  choice: షెకెముకు
  rationale: స్థలనామానికి జోడించిన దిశార్థక ה, ఆ పట్టణం వైపు వెళ్లడాన్ని సూచిస్తుంది; ‘షెకెముకు’ దాన్ని సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: אֶל אֲחֵי אִמּוֹ
  choice: తన తల్లి సోదరుల దగ్గరికి
  rationale: אֲחֵי అనే పదానికి అక్షరార్థం ‘సోదరులు.’ సందర్భంలో వారు మేనమామలు అయినా, మూలంలోని బంధుత్వ వ్యక్తీకరణను నిలిపి ఉంచాం.
- source_word: וַיְדַבֵּר אֲלֵיהֶם
  choice: అతడు వారితోనూ ... మాట్లాడాడు
  rationale: דבר యొక్క ‘మాట్లాడు’ భావాన్ని కాపాడుతూ, తరువాత వచ్చే לֵאמֹר ప్రవేశపెట్టే ప్రత్యక్ష ప్రసంగంతో తెలుగులో సహజంగా కలిపాం.
- source_word: וְאֶל כָּל מִשְׁפַּחַת
  choice: వంశమంతటితోనూ
  rationale: מִשְׁפָּחָה ఇక్కడ చిన్న కుటుంబం కంటే విస్తృతమైన బంధువర్గాన్ని సూచిస్తుంది; ‘వంశం’ ఆ సామాజిక పరిధిని తెలియజేస్తుంది, ‘అంతటితో’ כָּל భావాన్ని అందిస్తుంది.
- source_word: בֵּית אֲבִי אִמּוֹ
  choice: తన తల్లి తండ్రి ఇంటివారైన
  rationale: ‘తన తల్లి తండ్రి ఇల్లు’ అనే హెబ్రీ నిర్మాణాన్ని కనిపించేలా ఉంచి, ‘ఇంటివారు’ ద్వారా అది భవనం కాక కుటుంబ గృహవర్గం లేదా వంశశాఖ అని సహజంగా సూచించాం.
- source_word: לֵאמֹר
  choice: 'ఇలా మాట్లాడాడు:'
  rationale: తరువాతి వచనంలో వచ్చే మాటలను పరిచయం చేసే మూలపదపు పనిని ‘ఇలా’ మరియు ద్విబిందువు స్పష్టంగా నిర్వహిస్తాయి.
