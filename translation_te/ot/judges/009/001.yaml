translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని వాడాం. మూలంలోని తల్లివైపు బంధుత్వ నిర్మాణాన్ని సరళీకరించి ‘మేనమామలు’ అని మాత్రమే మార్చకుండా నిలిపి ఉంచాం; ‘ఇల్లు’ అనే హెబ్రీ సామాజిక భావాన్ని పాదసూచికలో వివరించాం.
