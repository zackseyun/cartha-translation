revisions:
- from: 'యెరుబ్బయలు కుమారుడైన అబీమెలెకు షెకెముకు, తన తల్లి సోదరుల దగ్గరికి వెళ్లాడు. అతడు వారితోనూ, తన తల్లి తండ్రి ఇంటివారైన వంశమంతటితోనూ[a] ఇలా మాట్లాడాడు:'
  to: 'యెరుబ్బయలు కుమారుడైన అబీమెలెకు షెకెముకు, తన తల్లి సోదరుల దగ్గరికి వెళ్లాడు. అతడు వారితోనూ, తన తల్లి యొక్క తండ్రి ఇంటి కుటుంబవర్గమంతటితోనూ[a] ఇలా మాట్లాడాడు:'
  rationale: The revision explicitly marks “his mother’s father,” preventing a modern Telugu reading of “mother and father.” It also renders the Hebrew “whole clan of the house of his mother’s father” as a coherent wider family group while retaining the household/lineage sense in the footnote.
  reviewer_model: gpt-5.6-terra
