  source_fidelity: 'మొదటి వాక్యంలో హీబ్రూ క్రియ వచనం ఏకవచనం: అబీమెలెకు ఎక్కాడు; అతనితో ఉన్న ప్రజలు అతనికి అనుబంధంగా పేర్కొనబడ్డారు. ముసాయిదాలోని “ఎక్కారు” వారందరినీ వ్యాకరణ కర్తగా చేస్తుంది. దానిని సరిచేశాం. మిగిలిన చర్యల క్రమం, గొడ్డళ్ల బహువచనం, కొమ్మల సమూహం, మరియు అనుకరించమనే అత్యవసర ఆజ్ఞ మూలానికి నమ్మకంగా ఉన్నాయి.'
