  yaml_path: translation/ot/judges/009/048.yaml
  text: Then Abimelek went up Mount Zalmon[a], he and all the people who were with him. Abimelek took the axes in his hand, cut down a bundle of branches, lifted it, and put it on his shoulder. Then he said to the people who were with him, “What you have seen me do, hurry and do as I have done.”
translation:
  language: te
  text: అప్పుడు అబీమెలెకు, అతనితో ఉన్న ప్రజలందరితో కలిసి, సల్మోను కొండ ఎక్కాడు. అబీమెలెకు తన చేతిలో గొడ్డళ్లను తీసుకొని, చెట్ల కొమ్మల గుత్తిని[a] నరికి, దాన్ని ఎత్తి తన భుజం మీద పెట్టుకున్నాడు. తరువాత అతను తనతో ఉన్న ప్రజలతో, “నేను చేసినది మీరు చూశారు కదా; త్వరపడి నాలాగే చేయండి” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “చెట్ల కొమ్మ” లేదా “పొదల/చెట్ల కొమ్మల దట్టమైన సమూహం.” హీబ్రూ పదం అరుదైనది; ఇది కొమ్మలు లేదా పొదల సమూహాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: ఎక్కారు
  rationale: עלה ఇక్కడ పైకి వెళ్లడాన్ని సూచిస్తుంది. సంయుక్త కర్తకు అనుగుణంగా తెలుగు బహువచన క్రియ సహజంగా ఉంటుంది.
- source_word: הַר צַלְמוֹן
  choice: సల్మోను కొండ
  rationale: స్థలనామాన్ని అనువదించకుండా తెలుగు లిప్యంతరీకరణతో, הַר‌ను సహజమైన ‘కొండ’గా ఇచ్చాం.
- source_word: הוּא וְכָל הָעָם אֲשֶׁר אִתּוֹ
  choice: అతనితో ఉన్న ప్రజలందరూ
  rationale: עָם‌ను యోధులు లేదా పురుషులు అని సంకుచితం చేయకుండా ‘ప్రజలు’గా ఉంచాం; అబీమెలెకు కూడా సంయుక్త కర్తలో నిలిచాడు.
- source_word: הַקַּרְדֻּמּוֹת בְּיָדוֹ
  choice: గొడ్డళ్లను చేతిలోకి తీసుకొని
  rationale: మూలంలోని బహువచనాన్ని ‘గొడ్డళ్లు’గా నిలిపి, తీసుకునే చర్యను సహజ తెలుగు ప్రయోగంలో వ్యక్తం చేశాం.
- source_word: וַיִּכְרֹת שׂוֹכַת עֵצִים
  choice: చెట్ల కొమ్మల గుత్తిని నరికి
  rationale: అరుదైన שׂוֹכָה ఇక్కడ మోయగలిగే కొమ్మల సమూహాన్ని సూచిస్తుంది; ‘గుత్తి’ దాని సమూహ భావాన్ని, ‘కొమ్మలు’ సందర్భాన్ని తెలియజేస్తాయి.
- source_word: וַיִּשָּׂאֶהָ וַיָּשֶׂם עַל שִׁכְמוֹ
  choice: దాన్ని ఎత్తి తన భుజం మీద పెట్టుకున్నాడు
  rationale: ఎత్తడం, భుజంపై పెట్టుకోవడం అనే వరుస చర్యలను స్పష్టంగా నిలిపాం.
- source_word: מָה רְאִיתֶם עָשִׂיתִי
  choice: నేను చేసినది మీరు చూశారు కదా
  rationale: హీబ్రూ సంక్షిప్త నిర్మాణాన్ని సహజ తెలుగులో అనుకరణకు ఆధారమైన గమనింపుగా వ్యక్తం చేశాం; ‘కదా’ సందర్భంలోని ఆదేశాత్మక అనుసంధానాన్ని చూపుతుంది.
- source_word: מַהֲרוּ עֲשׂוּ כָמוֹנִי
  choice: త్వరపడి నాలాగే చేయండి
  rationale: బహువచన ఆజ్ఞలోని అత్యవసరతను, ‘నాలాగే’ అనే ప్రత్యక్ష పోలికను నిలిపాం.
