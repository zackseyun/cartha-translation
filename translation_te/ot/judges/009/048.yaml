  terminology: అబీమెలెకు, సల్మోను కొండ, గొడ్డళ్లు వంటి పేర్లు/పదాలు తగినవే. అరుదైన שׂוֹכָה పదానికి “కొమ్మల గుత్తి” సందర్భానుకూలమైన ప్రధాన అనువాదం; దాని విస్తృత పదార్థ పరిధిని సూచించేందుకు పాదటిప్పణి చేర్చడం సముచితం.
