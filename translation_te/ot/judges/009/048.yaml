translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కథనానికి తగిన గంభీరమైనా సాధారణ పాఠకులకు సులభమైన శైలి. మూలంలోని అరుదైన కొమ్మల సమూహ పదానికి ప్రధాన పాఠ్యంలో సహజమైన ‘కొమ్మల గుత్తి’ వాడబడింది; వచనంలో పాదటిప్పణి అవసరం లేదని నిర్ణయించాం.
