id: JDG.9.27
reference: Judges 9:27
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֵּצְא֨וּ הַ/שָּׂדֶ֜ה וַֽ/יִּבְצְר֤וּ אֶת כַּרְמֵי/הֶם֙ וַֽ/יִּדְרְכ֔וּ וַֽ/יַּעֲשׂ֖וּ הִלּוּלִ֑ים וַ/יָּבֹ֨אוּ֙ בֵּ֣ית אֱֽלֹֽהֵי/הֶ֔ם וַ/יֹּֽאכְלוּ֙ וַ/יִּשְׁתּ֔וּ וַֽ/יְקַלְל֖וּ אֶת אֲבִימֶֽלֶךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/027.yaml
  text: And they went out into the field and gathered the grapes from their vineyards and trod them[a], and they held a festival[b]. Then they went into the house of their god and ate and drank and cursed Abimelek.
translation:
  language: te
  text: వారు పొలాల్లోకి వెళ్లి, తమ ద్రాక్షతోటల్లోని ద్రాక్షపండ్లను కోసి, వాటిని తొక్కి, ద్రాక్షపంట పండుగ జరుపుకున్నారు.[a] తరువాత వారు తమ దేవుని మందిరంలోకి[b] వెళ్లి, తిని తాగి, అబీమెలెకును శపించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ద్రాక్షపంట సంబరాలు చేసుకున్నారు,” లేక “ఆనందోత్సవం చేసుకున్నారు.” హీబ్రూ పదం బహుశా ద్రాక్ష కోతతో ముడిపడిన పండుగ సంబరాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “తమ దేవుళ్ల మందిరంలోకి.” హీబ్రూ రూపాన్ని బహువచనంగా కూడా చదవవచ్చు; అయితే ఇక్కడ ఆ మందిరంలో ఆరాధించబడిన దేవతను ఏకవచనంలో సూచించి ఉండవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּצְאוּ הַשָּׂדֶה
  choice: వారు పొలాల్లోకి వెళ్లి
  rationale: దిశను సూచించే రూపాన్ని నిలుపుతూ, పట్టణం వెలుపలున్న సాగుభూముల వైపు వెళ్లారనే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: וַיִּבְצְרוּ אֶת כַּרְמֵיהֶם
  choice: తమ ద్రాక్షతోటల్లోని ద్రాక్షపండ్లను కోసి
  rationale: בצר ద్రాక్షతోట సందర్భంలో ద్రాక్షపండ్లను ఏరడం లేదా కోయడాన్ని ప్రత్యేకంగా సూచిస్తుంది; తెలుగులో కర్తవ్యాన్ని స్పష్టంగా చెప్పేందుకు ద్రాక్షపండ్లను పేర్కొనడం అవసరం.
- source_word: וַיִּדְרְכוּ
  choice: వాటిని తొక్కి
  rationale: ఇక్కడ క్రియ ద్రాక్షపండ్లను కాళ్లతో తొక్కి రసం తీయడాన్ని సూచిస్తుంది. మూలంలోని స్పష్టమైన దృశ్యాన్ని కాపాడుతుంది.
- source_word: וַיַּעֲשׂוּ הִלּוּלִים
  choice: పంటపండుగ చేసుకున్నారు
  rationale: הִלּוּלִים ద్రాక్ష కోతతో ముడిపడిన ఉత్సవ సంబరాలను సూచిస్తుంది. సందర్భాన్ని తెలుపుతూ, ఆచార స్వరూపాన్ని అతిగా నిర్దిష్టం చేయని సహజమైన తెలుగు రూపం.
- source_word: בֵּית אֱלֹהֵיהֶם
  choice: తమ దేవుని మందిరంలోకి
  rationale: בֵּית అక్షరార్థంగా ‘ఇల్లు’ అయినా, దేవతారాధన సందర్భంలో ‘మందిరం’ సహజమైన తెలుగు. אֱלֹהֵיהֶם రూపం బహువచనంగా కూడా చదవదగినందున ప్రత్యామ్నాయాన్ని పాదటీకలో ఉంచాం.
- source_word: וַיֹּאכְלוּ וַיִּשְׁתּוּ
  choice: తిని తాగి
  rationale: మూలంలోని సరళమైన క్రియాక్రమాన్ని అదనపు అర్థం చేర్చకుండా నిలుపుతుంది.
- source_word: וַיְקַלְלוּ אֶת אֲבִימֶלֶךְ
  choice: అబీమెలెకును శపించారు
  rationale: קלל పియేల్ రూపం కేవలం దూషించడం కంటే బలంగా ‘శపించడం’ అని అర్థమిస్తుంది.
theological_decisions:
- issue: అన్యదేవత సందర్భంలో אֱלֹהֵיהֶם అనువాదం
  choice: తమ దేవుని
  alternative: తమ దేవుళ్ల
  rationale: రూపం వ్యాకరణపరంగా బహువచనంగా చదవదగినప్పటికీ, ఈ కథన సందర్భం వారు ఆరాధించిన నిర్దిష్ట దేవత మందిరాన్ని సూచించే అవకాశం ఎక్కువ. అసలులోని సాధ్యమైన బహువచనాన్ని పాదటీకలో సంరక్షించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. వరుస హీబ్రూ క్రియల వేగాన్ని తెలుగు సంయుక్త క్రియలతో నిలిపాం; పాఠ్యంలో ఉన్న నిజమైన పదార్థ సందిగ్ధతలను పాదటీకల్లో సంరక్షించాం.
