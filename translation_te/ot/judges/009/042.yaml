translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని అనిర్దిష్ట నివేదకులను నిర్దిష్ట వ్యక్తులుగా మార్చలేదు.
