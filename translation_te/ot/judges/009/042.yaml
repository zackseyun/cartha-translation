  text: And it happened on the next day that the people went out into the field[a], and it was reported to Abimelek.
translation:
  language: te
  text: మరుసటి రోజు ప్రజలు పొలంలోకి వెళ్లారు అని అబీమెలెకుకు సమాచారం అందింది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי מִמָּחֳרָת
  choice: మరుసటి రోజు
  rationale: హీబ్రూ కథన క్రమాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది; וַיְהִיని విడిగా అనువదించి అసహజమైన ప్రయోగం చేయకుండా తదుపరి సంఘటనను పరిచయం చేస్తుంది.
- source_word: וַיֵּצֵא הָעָם
  choice: ప్రజలు ... వెళ్లారు
  rationale: עם సమూహంగా ప్రజలను సూచిస్తుంది; יצא యొక్క సాధారణ గమనార్థాన్ని సందర్భానుసారంగా ‘వెళ్లారు’ తెలియజేస్తుంది.
- source_word: הַשָּׂדֶה
  choice: పొలంలోకి
  rationale: పట్టణం వెలుపలి బహిరంగ లేదా సాగుభూమిని సూచించే ఏకవచన నామవాచకాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וַיַּגִּידוּ לַאֲבִימֶלֶךְ
  choice: ఆ సంగతి అబీమెలెకుకు తెలియజేశారు
  rationale: మూలంలోని అనిర్దిష్ట బహువచన కర్తను తెలుగులోనూ పేర్కొనకుండా ఉంచి, నివేదిక అబీమెలెకుకు చేరిందనే భావాన్ని సహజంగా అందిస్తుంది.
