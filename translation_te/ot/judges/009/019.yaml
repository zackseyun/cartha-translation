id: JDG.9.19
reference: Judges 9:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אִם בֶּ/אֱמֶ֨ת וּ/בְ/תָמִ֧ים עֲשִׂיתֶ֛ם עִם יְרֻבַּ֥עַל וְ/עִם בֵּית֖/וֹ הַ/יּ֣וֹם הַ/זֶּ֑ה שִׂמְחוּ֙ בַּ/אֲבִימֶ֔לֶךְ וְ/יִשְׂמַ֥ח גַּם ה֖וּא בָּ/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/019.yaml
  text: And if today you have acted in truth and integrity toward Jerubbaal and toward his house[a], rejoice in Abimelech[c][b], and let him also rejoice in you.
translation:
  language: te
  text: ఈ రోజు మీరు యెరుబ్బయలు పట్ల, అతని ఇంటివారి పట్ల సత్యంతో, యథార్థతతో ప్రవర్తించి ఉంటే, అబీమెలెకును బట్టి సంతోషించండి; అతడు కూడా మిమ్మల్ని బట్టి సంతోషించుగాక.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם
  choice: అయితే/ఉంటే అనే షరతును సందర్భానుసారంగా ‘ఉంటే’తో వ్యక్తీకరించడం
  rationale: యోతాము ప్రసంగంలోని ముందటి షరతుతో అనుసంధానాన్ని నిలుపుతూ, తెలుగులో సహజమైన షరతు వాక్య నిర్మాణాన్ని ఇస్తుంది.
- source_word: בֶּאֱמֶת וּבְתָמִים
  choice: సత్యంతో, యథార్థతతో
  rationale: אֱמֶת లోని సత్యం/నమ్మకత్వం భావాన్నీ, תָמִים లోని నైతిక సమగ్రత మరియు నిష్కపటత భావాన్నీ వేర్వేరుగా నిలుపుతుంది.
- source_word: עֲשִׂיתֶם עִם
  choice: పట్ల ... ప్రవర్తించి
  rationale: ఈ హీబ్రూ ప్రయోగానికి ఉన్న ‘ఎవరితోనైనా వ్యవహరించు/వారి పట్ల ప్రవర్తించు’ అనే సంబంధార్థాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: יְרֻבַּעַל
  choice: యెరుబ్బయలు
  rationale: వ్యక్తి పేరును హీబ్రూ ఉచ్చారణకు సమీపంగా లిప్యంతరీకరించింది.
- source_word: בֵּיתוֹ
  choice: అతని ఇంటివారు
  rationale: ఇక్కడ בַּיִת కేవలం భవనాన్ని కాక కుటుంబం, వంశగృహం అనే సామూహిక భావాన్ని సూచిస్తుంది; కథా సందర్భంలో ‘ఇంటివారు’ స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: הַיּוֹם הַזֶּה
  choice: ఈ రోజు
  rationale: ‘ఈ దినమున’ అనే అక్షరార్థాన్ని ఆధునిక తెలుగులో సహజంగా అందిస్తుంది.
- source_word: שִׂמְחוּ בַּאֲבִימֶלֶךְ
  choice: అబీమెలెకును బట్టి సంతోషించండి
  rationale: שׂמח בְּ ప్రయోగంలోని ఒకరిని బట్టి/విషయంగా సంతోషించడం అనే భావాన్ని నిలుపుతూ, అసహజమైన ‘అతనిలో’ అనే నిర్మాణాన్ని నివారిస్తుంది.
- source_word: וְיִשְׂמַח גַּם הוּא בָּכֶם
  choice: అతడు కూడా మిమ్మల్ని బట్టి సంతోషించుగాక
  rationale: ఆజ్ఞార్థకం తరువాత వచ్చే ఈ imperfect రూపంలోని జస్సివ్ భావాన్ని ‘సంతోషించుగాక’తో, పరస్పర సమాంతరతను ‘మిమ్మల్ని బట్టి’తో నిలుపుతుంది.
