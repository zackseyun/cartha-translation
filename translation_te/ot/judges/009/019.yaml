translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన వాక్చాతుర్యాన్ని ఉంచాం. మూలంలోని షరతుతో కూడిన వ్యంగ్యాత్మక ఉద్వేగాన్ని వివరణ జోడించకుండా అలాగే నిలిపాం. ‘ఇంటివారు’ కుటుంబం/వంశగృహం పరిధిని సూచిస్తుంది; ‘సంతోషించుగాక’ మూలంలోని జస్సివ్ స్వరాన్ని కాపాడుతుంది.
