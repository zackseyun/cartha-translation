source:
  edition: WLC
  text: וַ/יֹּאמְר֥וּ הָ/עֵצִ֖ים לַ/תְּאֵנָ֑ה לְכִי אַ֖תְּ מָלְכִ֥י עָלֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/010.yaml
  text: Then the trees said to the fig tree, ‘You come, reign over us.’
translation:
  language: te
  text: అప్పుడు చెట్లు అంజూరపు చెట్టుతో, “నువ్వు వచ్చి మాపై రాజుగా పాలించు” అన్నాయి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: అప్పుడు ... అన్నాయి
  rationale: వావ్-క్రమరూపం కథనాన్ని ముందుకు నడిపిస్తుంది; ‘అప్పుడు’ ఆ క్రమాన్ని సహజమైన తెలుగులో చూపుతుంది. చెట్లు బహువచనం కావడంతో ‘అన్నాయి’ వాడబడింది.
- source_word: הָעֵצִים
  choice: చెట్లు
  rationale: ఈ ఉపమానకథలో עֵצִים మాట్లాడే చెట్లనే స్పష్టంగా సూచిస్తుంది.
- source_word: לַתְּאֵנָה
  choice: అంజూరపు చెట్టుతో
  rationale: תְּאֵנָה ఇక్కడ పండును కాక అంజూరపు చెట్టును సూచిస్తుంది; לְ సంభాషణకు ఉద్దేశితమైన పరోక్ష కర్మను సూచిస్తుంది.
- source_word: לְכִי אַתְּ
  choice: నువ్వు వచ్చి
  rationale: స్త్రీలింగ ఏకవచన ఆజ్ఞారూపం మరియు స్పష్టమైన אַתְּ సర్వనామంలోని ప్రత్యక్ష సంబోధన, ఉద్ఘాటనను ‘నువ్వు’ నిలుపుతుంది. తెలుగు వాక్యప్రవాహంలో ‘వచ్చి ... పాలించు’ సహజంగా ఉంది.
- source_word: מָלְכִי
  choice: రాజుగా పాలించు
  rationale: מלך క్రియకు కేవలం సాధారణ పరిపాలనకన్నా రాజాధికారంతో పాలించడం అనే భావం ఉంది; ‘రాజుగా పాలించు’ దానిని స్పష్టంగా, సహజంగా అందిస్తుంది.
- source_word: עָלֵינוּ
  choice: మా మీద
  rationale: מלך తో వచ్చిన עַל ప్రజల మీద రాజ్యాధికారాన్ని సూచిస్తుంది; ‘మా మీద’ తెలుగులో నేరమైన సమానార్థకం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. చెట్టు వ్యాకరణ లింగాన్ని తెలుగులో కృత్రిమంగా చూపకుండా, హెబ్రీలోని ఉద్ఘాటిత సర్వనామాన్ని ‘నువ్వు’ ద్వారా నిలిపింది.
