review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the narrative progression, the trees as speakers, the fig tree as addressee, the two imperatives, and the explicit second-person pronoun. “రాజుగా పాలించు” appropriately conveys the royal sense of מָלְכִי.
  naturalness: The sentence is clear and modern. However, with royal rule, “మాపై” is more idiomatic and less physically/hostile suggestive than “మా మీద.”
  terminology: “అంజూరపు చెట్టు” is a suitable modern Telugu term for the fig tree. “రాజుగా పాలించు” retains the specifically royal force rather than reducing it to generic governance.
  issues:
  - severity: low
    issue: “మా మీద” is slightly less idiomatic for the object of royal rule.
    rationale: Although understandable, “మా మీద” can suggest physical placement or domination against someone. “మాపై రాజుగా పాలించు” is the more natural modern Telugu expression for reigning over subjects and preserves the Hebrew עָלֵינוּ in context.
  revised_text: అప్పుడు చెట్లు అంజూరపు చెట్టుతో, “నువ్వు వచ్చి మాపై రాజుగా పాలించు” అన్నాయి.
