  register: సరళమైన, గౌరవప్రదమైన ఆధునిక ప్రామాణిక తెలుగు వాడబడింది. వరుస హీబ్రూ కథన క్రియలను తెలుగులో సహజమైన సంయుక్త క్రియా క్రమంగా ఇచ్చాం. పాదసూచిక సూచిక [a] ప్రధాన వాక్యంలో ఉంచబడింది.
