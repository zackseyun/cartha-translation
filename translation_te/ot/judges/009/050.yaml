  text: וַ/יֵּ֥לֶךְ אֲבִימֶ֖לֶךְ אֶל תֵּבֵ֑ץ וַ/יִּ֥חַן בְּ/תֵבֵ֖ץ וַֽ/יִּלְכְּדָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/050.yaml
  text: Then Abimelech went to Thebez[a], camped against Thebez, and captured it.
translation:
  language: te
  text: తర్వాత అబీమెలెకు తేబెజుకు వెళ్లి, తేబెజుకు ఎదురుగా మకాం వేసి[a], దాన్ని స్వాధీనం చేసుకున్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తేబెజులో మకాం వేసి.” హీబ్రూ విభక్తిని అక్షరార్థంగా అలా అనువదించవచ్చు; అయితే ఈ సైనిక సందర్భంలో పట్టణానికి ఎదురుగా మకాం వేసినట్లు భావించడం సహజం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: వెళ్లి
  rationale: הלך అనే సాధారణ గమన క్రియను కథన క్రమంలో సహజమైన ఆధునిక తెలుగు ‘వెళ్లి’గా అనువదించాం; ‘దండెత్తి వెళ్లి’ అంటే మూలంలో స్పష్టంగా లేని సైనిక భావాన్ని క్రియలోనే చేర్చినట్లవుతుంది.
- source_word: אֲבִימֶלֶךְ
  choice: అబీమెలెకు
  rationale: వ్యక్తి పేరును తెలుగులో ప్రాచుర్యంలో ఉన్న బైబిలు రూపానికి అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: אֶל תֵּבֵץ
  choice: తేబేసుకు
  rationale: אֶל ఇక్కడ ఒక స్థలం వైపు గమనాన్ని సూచిస్తుంది; అందువల్ల ‘తేబేసుకు’ మూలార్థాన్ని నేరుగా తెలియజేస్తుంది.
- source_word: וַיִּחַן בְּתֵבֵץ
  choice: తేబేసుకు ఎదురుగా మకాం వేసి
  rationale: חנה అంటే మకాం వేయడం. పట్టణాన్ని వెంటనే స్వాధీనం చేసుకున్న సైనిక సందర్భంలో בְּను ‘ఎదురుగా’గా ఇవ్వడం ముట్టడి భంగిమను సహజంగా తెలియజేస్తుంది; అయితే ‘తేబేసులో’ అనే అక్షరార్థ సాధ్యతను పాదసూచికలో నిలిపాం.
- source_word: וַיִּלְכְּדָהּ
  choice: దాన్ని స్వాధీనం చేసుకున్నాడు
  rationale: לכד పట్టణాన్ని పట్టుకోవడం లేదా వశపరచుకోవడం అనే సైనిక భావం కలిగి ఉంది. స్త్రీలింగ ప్రత్యయం తేబేసు పట్టణాన్ని సూచిస్తుంది; ‘స్వాధీనం చేసుకున్నాడు’ ఆధునిక తెలుగులో ఆ భావాన్ని స్పష్టంగా ఇస్తుంది.
