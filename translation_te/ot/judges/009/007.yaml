  text: וַ/יַּגִּ֣דוּ לְ/יוֹתָ֗ם וַ/יֵּ֨לֶךְ֙ וַֽ/יַּעֲמֹד֙ בְּ/רֹ֣אשׁ הַר גְּרִזִ֔ים וַ/יִּשָּׂ֥א קוֹל֖/וֹ וַ/יִּקְרָ֑א וַ/יֹּ֣אמֶר לָ/הֶ֗ם שִׁמְע֤וּ אֵלַ/י֙ בַּעֲלֵ֣י שְׁכֶ֔ם וְ/יִשְׁמַ֥ע אֲלֵי/כֶ֖ם אֱלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/007.yaml
  text: And they told Jotham[a], and he went and stood on the top of Mount Gerizim, and he lifted up his voice and called out and said to them, “Listen to me, leaders of Shechem[b], that God may listen to you.”
translation:
  language: te
  text: 'ఈ సంగతి యోతాముకు తెలియజేశారు. అతడు వెళ్లి గెరిజీము కొండ శిఖరంపై నిలబడి, బిగ్గరగా వారిని పిలిచి ఇలా అన్నాడు: “షెకెము నాయకులారా,[a] నా మాట వినండి; అప్పుడు దేవుడు మీ మాట వినవచ్చు.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “షెకెము యజమానులారా” లేదా “షెకెము ప్రభువులారా.” ఇక్కడ ఈ మాట పట్టణంలోని అధికారవర్గాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “దేవుడు మీ మాట వినుగాక.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּגִּדוּ לְיוֹתָם
  choice: ఈ సంగతి యోతాముకు తెలియజేశారు
  rationale: נגד హిఫిల్ రూపం ‘తెలియజేయడం/చెప్పడం’ అనే అర్థాన్నిస్తుంది. మునుపటి సందర్భాన్ని సూచించేందుకు తెలుగులో సహజమైన ‘ఈ సంగతి’ చేర్చబడింది; కొత్త సమాచారాన్ని జోడించదు.
- source_word: וַיֵּלֶךְ וַיַּעֲמֹד בְּרֹאשׁ הַר גְּרִזִים
  choice: అతడు వెళ్లి గెరిజీము కొండ శిఖరంపై నిలబడి
  rationale: వరుస కథన క్రియలను సహజమైన తెలుగు వాక్యనిర్మాణంలో కలిపి, רֹאשׁ యొక్క భౌగోళిక భావాన్ని ‘శిఖరం’గా అందించింది.
- source_word: וַיִּשָּׂא קוֹלוֹ וַיִּקְרָא
  choice: బిగ్గరగా వారిని పిలిచి
  rationale: ‘తన స్వరాన్ని ఎత్తి పిలిచాడు’ అనే హెబ్రీయ నుడికారాన్ని ఆధునిక తెలుగులో సహజంగా ‘బిగ్గరగా పిలిచి’ అని అనువదించింది.
- source_word: שִׁמְעוּ אֵלַי
  choice: నా మాట వినండి
  rationale: శ్రద్ధగా ఆలకించమనే ఆజ్ఞను తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בַּעֲלֵי שְׁכֶם
  choice: షెకెము నాయకులారా
  rationale: בַּעֲלֵי పదానికి అక్షరార్థంగా ‘యజమానులు/ప్రభువులు’ ఉన్నా, న్యాయాధిపతుల గ్రంథంలోని ఈ సందర్భంలో పట్టణ అధికారవర్గాన్ని సూచిస్తుంది. ‘నాయకులు’ ఆధునిక పాఠకులకు స్పష్టంగా ఉంటుంది; అక్షరార్థ ప్రత్యామ్నాయం పాదటిప్పణిలో ఉంచబడింది.
- source_word: וְיִשְׁמַע אֲלֵיכֶם אֱלֹהִים
  choice: అప్పుడు దేవుడు మీ మాట వినవచ్చు
  rationale: ముందున్న ఆజ్ఞకు అనుసంధానమైన ఉద్దేశం/ఫలిత భావాన్ని ‘అప్పుడు’ తెలియజేస్తుంది. imperfect రూపంలోని అనిశ్చిత ప్రార్థనాత్మక ఛాయను ‘వినవచ్చు’ నిలుపుతుంది; సమన్వయ ఆశీర్వచన పఠనాన్ని పాదటిప్పణిలో సూచించింది.
theological_decisions:
- issue: యోతాము చివరి మాటలోని וְיִשְׁמַע బలం
  choice: ‘అప్పుడు దేవుడు మీ మాట వినవచ్చు’—ఆజ్ఞకు అనుసంధానమైన ఫలితం/ఉద్దేశంగా అనువాదం
  alternative: ‘దేవుడు కూడా మీ మాట వినుగాక’—సమన్వయమైన ఆశీర్వచనం లేదా ఆకాంక్ష
  rationale: וְ తో వచ్చిన imperfect రూపం ఉద్దేశం/ఫలితాన్ని గానీ, ఆకాంక్షాత్మక jussive భావాన్ని గానీ మోయగలదు. ప్రధాన పాఠం వాక్చాతుర్యంలోని పరస్పర సంబంధాన్ని చూపుతుంది; పాదటిప్పణి నిజమైన వ్యాకరణ సందిగ్ధతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన కథన శైలి. హెబ్రీయ వరుస క్రియలను తెలుగు సహజత్వం కోసం కృదంత నిర్మాణంలో కలిపినా, చర్యల క్రమం నిలుపబడింది. దైవనామం אֱלֹהִים ఏకవచన క్రియతో ఉన్నందున ‘దేవుడు’గా ఇచ్చబడింది.
