translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. హీబ్రూ לִפְנֵי లోని స్థానం/నాయకత్వం అనే ద్వంద్వసాధ్యతను ప్రధాన పాఠం మరియు పాదసూచిక ద్వారా నిలుపుకుంది.
