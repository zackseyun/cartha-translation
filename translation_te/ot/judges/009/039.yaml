source:
  edition: WLC
  text: וַ/יֵּ֣צֵא גַ֔עַל לִ/פְנֵ֖י בַּעֲלֵ֣י שְׁכֶ֑ם וַ/יִּלָּ֖חֶם בַּ/אֲבִימֶֽלֶךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/039.yaml
  text: So Gaal went out before the leaders of Shechem and fought against Abimelech[a].
translation:
  language: te
  text: అప్పుడు గయాలు షెకెము నాయకుల ముందుండి బయలుదేరి, అబీమెలెకుకు వ్యతిరేకంగా పోరాడాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘షెకెము నాయకుల ముందు బయలుదేరి.’ ఇక్కడ ‘ముందు’ అనే మాట వారి ముందుభాగంలో ఉండడాన్ని, సందర్భానుసారం వారికి నాయకత్వం వహించడాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: బయలుదేరి
  rationale: יצא అనే సాధారణ కథన క్రియ ఇక్కడ ఒక స్థలం నుంచి యుద్ధానికి బయలుదేరడాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘బయలుదేరి’ సహజంగా ఉంది.
- source_word: גַעַל
  choice: గాలుడు
  rationale: వ్యక్తి పేరును తెలుగులో ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించి, వాక్యంలో సహజమైన పురుషవాచక రూపం వాడబడింది.
- source_word: לִפְנֵי
  choice: ముందుగా
  rationale: పదానికి ప్రాథమికంగా ‘ముందు/ఎదుట’ అనే అర్థం ఉంది. ఈ సైనిక సందర్భంలో షెకెము నాయకుల ముందుభాగంలో లేదా వారికి నాయకత్వం వహిస్తూ వెళ్లాడనే భావం ఉండవచ్చు; ‘ముందుగా’ ఆ స్థలార్థాన్ని నిలుపుతూ అస్పష్టతను పూర్తిగా తొలగించదు.
- source_word: בַּעֲלֵי שְׁכֶם
  choice: షెకెము నాయకులు
  rationale: בעלים ఇక్కడ నగరంలోని అధికారమున్న ప్రముఖులను సూచిస్తుంది. ‘నాయకులు’ ఆధునిక పాఠకులకు పౌర-రాజకీయ భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: וַיִּלָּחֶם
  choice: యుద్ధం చేశాడు
  rationale: לחם నిఫాల్ రూపం ‘పోరాడు/యుద్ధం చేశాడు’ అనే అర్థం ఇస్తుంది; సైనిక సందర్భానికి ‘యుద్ధం చేశాడు’ గంభీరంగా, సహజంగా ఉంది.
- source_word: בַּאֲבִימֶלֶךְ
  choice: అబీమెలెకుతో
  rationale: לחםతో వచ్చిన ב ప్రత్యర్థిని సూచిస్తుంది. తెలుగులో ‘అబీమెలెకుతో యుద్ధం చేశాడు’ అన్న ప్రయోగం అతనికి వ్యతిరేకంగా పోరాడాడనే అర్థాన్ని సహజంగా తెలియజేస్తుంది.
