revisions:
- from: అప్పుడు గాలుడు షెకెము నాయకులకు ముందుగా బయలుదేరి, అబీమెలెకుతో యుద్ధం చేశాడు.[a]
  to: అప్పుడు గయాలు షెకెము నాయకుల ముందుండి బయలుదేరి, అబీమెలెకుకు వ్యతిరేకంగా పోరాడాడు.[a]
  rationale: The revision replaces the temporally misleading ‘ముందుగా’ with a spatial/contextual rendering of לִפְנֵי, clarifies that Abimelech is the opponent, and removes the added suffix from Gaal’s name. The footnote preserves the Hebrew expression’s possible nuance of position at the front and leadership without treating that nuance as certain.
  reviewer_model: gpt-5.6-terra
