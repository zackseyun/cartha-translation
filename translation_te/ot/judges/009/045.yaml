- from: అబీమెలెకు ఆ రోజంతా ఆ పట్టణానికి ఎదురుగా యుద్ధం చేసి[a], దాన్ని స్వాధీనం చేసుకున్నాడు. దానిలో ఉన్న ప్రజలను చంపి, ఆ పట్టణాన్ని కూలదోసి, దానిలో ఉప్పు చల్లాడు[b].
  to: అబీమెలెకు ఆ రోజంతా ఆ పట్టణంపై యుద్ధం చేశాడు[a]. అతడు ఆ పట్టణాన్ని స్వాధీనం చేసుకొని, దానిలో ఉన్న ప్రజలను చంపాడు. తరువాత ఆ పట్టణాన్ని కూలదోసి, దానిపై ఉప్పు విత్తాడు[b].
