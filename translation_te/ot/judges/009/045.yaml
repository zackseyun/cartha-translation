  text: וַ/אֲבִימֶ֜לֶךְ נִלְחָ֣ם בָּ/עִ֗יר כֹּ֚ל הַ/יּ֣וֹם הַ/ה֔וּא וַ/יִּלְכֹּד֙ אֶת הָ/עִ֔יר וְ/אֶת הָ/עָ֥ם אֲשֶׁר בָּ֖/הּ הָרָ֑ג וַ/יִּתֹּץ֙ אֶת הָ/עִ֔יר וַ/יִּזְרָעֶ֖/הָ מֶֽלַח־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/045.yaml
  text: And Abimelech fought against the city all that day[a], and he captured the city and killed the people who were in it[b]. Then he tore down the city and sowed it with salt.
translation:
  language: te
  text: అబీమెలెకు ఆ రోజంతా ఆ పట్టణంపై యుద్ధం చేశాడు[a]. అతడు ఆ పట్టణాన్ని స్వాధీనం చేసుకొని, దానిలో ఉన్న ప్రజలను చంపాడు. తరువాత ఆ పట్టణాన్ని కూలదోసి, దానిపై ఉప్పు విత్తాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆ పట్టణంపై దాడి చేశాడు.’ హీబ్రూ క్రియకు అక్షరార్థంగా ‘యుద్ధం చేశాడు’ అని అర్థం; ఇక్కడ వాడిన ఉపసర్గతో అది పట్టణానికి వ్యతిరేకంగా చేసిన సైనిక చర్యను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా, ‘దానిని ఉప్పుతో విత్తాడు.’ ఇది ఆ పట్టణపు నాశనాన్నీ శాపాన్నీ సూచించే ప్రతీకాత్మక చర్య.
    reason: cultural_note
lexical_decisions:
- source_word: נִלְחָם בָּעִיר
  choice: ఆ పట్టణానికి ఎదురుగా యుద్ధం చేసి
  rationale: לחם అనే క్రియకు ב ఉపసర్గ చేరిన ఈ యుద్ధ సందర్భంలో పట్టణానికి వ్యతిరేకంగా పోరాడడం అనే భావం ఉంది. తెలుగు సహజత్వం కోసం ‘ఎదురుగా యుద్ధం చేసి’ అని ఇచ్చి, ‘దాడి చేసి’ అనే కొంత వ్యాఖ్యానాత్మక ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: כֹּל הַיּוֹם הַהוּא
  choice: ఆ రోజంతా
  rationale: ఆ నిర్దిష్ట దినమంతా చర్య కొనసాగిందనే కాలవ్యాప్తిని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: וַיִּלְכֹּד
  choice: దాన్ని స్వాధీనం చేసుకున్నాడు
  rationale: పట్టణానికి సంబంధించిన సైనిక సందర్భంలో לכד అంటే పట్టుకోవడం లేదా వశపరచుకోవడం. ‘స్వాధీనం చేసుకున్నాడు’ ఆ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: הָעָם אֲשֶׁר בָּהּ
  choice: దానిలో ఉన్న ప్రజలను
  rationale: పట్టణంలో ఉన్న జనాన్ని సూచించే సంబంధ వాక్య నిర్మాణాన్ని అతిగా నిర్దిష్టం చేయకుండా నిలుపుతుంది.
- source_word: הָרָג
  choice: చంపి
  rationale: הרג యొక్క సూటి అర్థమైన చంపడాన్ని సరళమైన ఆధునిక పదంతో వ్యక్తం చేస్తుంది.
- source_word: וַיִּתֹּץ
  choice: కూలదోసి
  rationale: נתץ పట్టణ నిర్మాణాలను పడగొట్టడం లేదా ధ్వంసం చేయడం అనే భావాన్ని ఇక్కడ ఇస్తుంది; ‘కూలదోసి’ సహజంగానూ స్పష్టంగానూ ఉంది.
- source_word: וַיִּזְרָעֶהָ מֶלַח
  choice: దానిలో ఉప్పు చల్లాడు
  rationale: హీబ్రూలో అక్షరార్థంగా ‘దానిని ఉప్పుతో విత్తాడు’ అని ఉంది. తెలుగులో ‘ఉప్పు విత్తాడు’ అసహజంగా లేదా అపార్థకంగా వినిపించవచ్చు కాబట్టి చర్యను సహజంగా ‘ఉప్పు చల్లాడు’ అని ఇచ్చి, మూలభాష రూపకాన్ని పాదసూచికలో తెలిపాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. వరుస యుద్ధ చర్యల వేగాన్ని నిలుపుతూ, తెలుగు వాక్య సహజత్వం కోసం రెండు వాక్యాలుగా విభజించబడింది. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
