translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. మూలంలోని నిష్క్రియ నిర్మాణం మరియు తెలియజేసిన వ్యక్తి గురించిన అనిర్దిష్టత నిలుపబడ్డాయి.
