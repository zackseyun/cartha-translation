source:
  edition: WLC
  text: וַ/יָּשִׂ֣ימוּ ל/וֹ֩ בַעֲלֵ֨י שְׁכֶ֜ם מְאָרְבִ֗ים עַ֚ל רָאשֵׁ֣י הֶ/הָרִ֔ים וַ/יִּגְזְל֗וּ אֵ֛ת כָּל אֲשֶׁר יַעֲבֹ֥ר עֲלֵי/הֶ֖ם בַּ/דָּ֑רֶךְ וַ/יֻּגַּ֖ד לַ/אֲבִימֶֽלֶךְ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/025.yaml
  text: Then the leaders of Shechem set men in ambush for him on the tops of the mountains[a], and they robbed everyone who passed by them on the road; and it was reported to Abimelech.
translation:
  language: te
  text: అప్పుడు షెకెము నాయకులు[a] అతనికి వ్యతిరేకంగా కొండల శిఖరాలపై మాటువేసేవారిని ఉంచారు. వారు దారిలో వారి దగ్గరగా వెళ్లిన ప్రతి ఒక్కరినీ దోచుకున్నారు. ఈ సంగతి అబీమెలెకుకు తెలియజేయబడింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘షెకెము పౌరులు,’ ‘షెకెము అధిపతులు.’ హీబ్రూ పదబంధానికి అక్షరార్థం ‘షెకెము యజమానులు’; సందర్భంలో ఇది పట్టణంలోని ప్రముఖులను లేదా అధికారంగలవారిని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַעֲלֵי שְׁכֶם
  choice: షెకెము నాయకులు
  rationale: బַעֲלֵי అనే పదానికి అక్షరార్థంగా ‘యజమానులు/అధిపతులు’ అనే భావం ఉన్నా, ఇక్కడ అది పట్టణంలోని అధికారంగల ప్రముఖులను సూచిస్తుంది. ‘నాయకులు’ ఆధునిక తెలుగులో సహజంగా ఈ పౌర-రాజకీయ భావాన్ని తెలియజేస్తుంది.
- source_word: וַיָּשִׂימוּ לוֹ מְאָרְבִים
  choice: అతనికి వ్యతిరేకంగా ... మాటువేసి ఉండడానికి మనుషులను నియమించారు
  rationale: שׂים, పరోక్ష కర్మ మరియు מְאָרְבִים కలసి ఒకరికి వ్యతిరేకంగా మాటువేసేవారిని ఉంచడమనే భావాన్నిస్తాయి. బహువచన కర్తృవాచక రూపాన్ని స్పష్టం చేయడానికి ‘మనుషులను’ చేర్చబడింది.
- source_word: עַל רָאשֵׁי הֶהָרִים
  choice: కొండ శిఖరాల మీద
  rationale: అక్షరార్థం ‘కొండల/పర్వతాల తలల మీద.’ స్థానిక భూభాగంలోని ఎత్తైన మాటు స్థలాలను సహజంగా, మూలానికి దగ్గరగా తెలియజేస్తుంది.
- source_word: וַיִּגְזְלוּ
  choice: దోచుకున్నారు
  rationale: גזל బలవంతంగా లాక్కోవడం లేదా దోపిడీ చేయడాన్ని సూచిస్తుంది; దారిన వెళ్లేవారికి జరిగిన చర్యకు ‘దోచుకున్నారు’ సహజమైన తెలుగు.
- source_word: אֵת כָּל אֲשֶׁר יַעֲבֹר עֲלֵיהֶם בַּדָּרֶךְ
  choice: దారిలో తమ దగ్గరగా వెళ్లిన ప్రతి ఒక్కరినీ
  rationale: כָּל తరువాతి ఏకవచన క్రియ ఒక్కొక్క ప్రయాణికునికీ వర్తించే పంపిణీ భావాన్ని ఇస్తుంది. ‘ప్రతి ఒక్కరినీ’ దానిని స్పష్టంగా తెలియజేస్తుంది; ‘తమ దగ్గరగా’ మాటువేసిన వారి స్థానాన్ని దాటి వెళ్లడాన్ని సూచిస్తుంది.
- source_word: וַיֻּגַּד לַאֲבִימֶלֶךְ
  choice: ఈ సంగతి అబీమెలెకుకు తెలియజేయబడింది
  rationale: నిఫాల్ కాని హోఫల్ నిష్క్రియ రూపం సమాచారాన్ని చెప్పిన వ్యక్తిని పేర్కొనదు. తెలుగు నిష్క్రియ నిర్మాణం ఆ అనిర్దిష్టతను నిలుపుతుంది.
