source:
  edition: WLC
  text: וְ/הָיָ֤ה בַ/בֹּ֨קֶר֙ כִּ/זְרֹ֣חַ הַ/שֶּׁ֔מֶשׁ תַּשְׁכִּ֖ים וּ/פָשַׁטְתָּ֣ עַל הָ/עִ֑יר וְ/הִנֵּה ה֞וּא וְ/הָ/עָ֤ם אֲשֶׁר אִתּ/וֹ֙ יֹצְאִ֣ים אֵלֶ֔י/ךָ וְ/עָשִׂ֣יתָ לּ֔/וֹ כַּ/אֲשֶׁ֖ר תִּמְצָ֥א יָדֶֽ/ךָ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/033.yaml
  text: Then in the morning[a], as soon as the sun rises, you must get up early and spread out against the city. And look, when he and the people who are with him come out to you, you shall do to him as your hand finds.
translation:
  language: te
  text: ఉదయం, సూర్యుడు ఉదయించగానే, నువ్వు త్వరగా లేచి పట్టణంపై దాడికి దిగాలి. ఇదిగో, అతడూ అతనితో ఉన్న ప్రజలూ నీ వైపుకు బయలుదేరి వచ్చినప్పుడు, నీ చేతనైనట్లు అతనికి చేయి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ నుడికారం అక్షరార్థంగా, “నీ చెయ్యి కనుగొన్నట్లుగా”; అంటే నీకు సాధ్యమైనంతగా లేదా దొరికిన అవకాశాన్ని బట్టి.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה בַבֹּקֶר
  choice: ఉదయం
  rationale: וְהָיָה ఇక్కడ ఆదేశాల క్రమాన్ని ముందుకు నడిపే నిర్మాణం; తెలుగులో ప్రత్యేకంగా అనువదించకుండా కాలసూచకమైన ‘ఉదయం’తో ప్రారంభించడం సహజం.
- source_word: כִזְרֹחַ הַשֶּׁמֶשׁ
  choice: సూర్యుడు ఉదయించగానే
  rationale: כ + క్రియానామ నిర్మాణం కాలాన్ని సూచిస్తుంది; యుద్ధ ప్రణాళికలోని తక్షణత్వాన్ని ‘ఉదయించగానే’ తెలియజేస్తుంది.
- source_word: תַּשְׁכִּים
  choice: పెందలకడనే లేచి
  rationale: שׁכם హిఫీల్ రూపం తెల్లవారుజామునే లేవడం లేదా ముందుగానే ప్రారంభించడాన్ని సూచిస్తుంది; ఆధునిక గౌరవప్రద తెలుగులో ఈ భావాన్ని స్పష్టంగా ఉంచింది.
- source_word: וּפָשַׁטְתָּ עַל הָעִיר
  choice: పట్టణం మీదికి విస్తరించి దాడి చేయాలి
  rationale: సైనిక సందర్భంలో פשׁט విస్తరించి మోహరించడం, దాడికి దిగడం అనే భావవ్యాప్తి కలిగి ఉంది. కేవలం ‘దాడి చేయి’ అనడం మూలంలోని విస్తరించే కదలికను కోల్పోతుంది; ఈ రూపం రెండు భావాలనూ సహజంగా కలుపుతుంది.
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: తరువాతి పరిణామంపై దృష్టి నిలిపే హీబ్రూ సంభాషణ సూచికను సహజమైన తెలుగు పదంతో నిలిపింది.
- source_word: הוּא וְהָעָם אֲשֶׁר אִתּוֹ
  choice: అతడూ అతనితో ఉన్న ప్రజలూ
  rationale: עָם ను ‘సైన్యం’ అని కుదించకుండా విస్తృతమైన మూలార్థమైన ‘ప్రజలు’గా ఉంచి, సందర్భంలోని సైనిక భావాన్ని పాఠకుడికి వదిలింది.
- source_word: יֹצְאִים אֵלֶיךָ
  choice: నీ వైపుకు బయలుదేరి వచ్చినప్పుడు
  rationale: אֵלֶיךָ యొక్క ప్రాథమిక దిశార్థమైన ‘నీ వైపుకు’ను నిలిపి, సందర్భం వల్ల కలిగే శత్రుత్వాన్ని పదంలోనే అధికంగా చేర్చలేదు.
- source_word: וְעָשִׂיתָ לּוֹ
  choice: అతనికి చేయి
  rationale: ఏకవచన ప్రత్యయం ప్రధానంగా నాయకుణ్ణి సూచిస్తుంది. అస్పష్టమైన కార్యాన్ని మూలంలాగే సాధారణంగా ఉంచింది.
- source_word: כַאֲשֶׁר תִּמְצָא יָדֶךָ
  choice: నీ చేతికి సాధ్యమైనట్లు
  rationale: ‘నీ చెయ్యి కనుగొన్నట్లు’ అనే హీబ్రూ నుడికారానికి శక్తి లేదా అవకాశం మేరకు చేయడం అనే అర్థం ఉంది; తెలుగులో అర్థవంతమైన నుడికార సమానార్థాన్ని ఉపయోగించింది.
