  source_fidelity: మూలంలోని కాలసూచన, త్వరగా లేవమనే ఆజ్ఞ, పట్టణంపై సైనిక చర్య, ఎదుటివారి బయలుదేరి రావడం, అలాగే ‘నీ చేతికి దొరికినట్లు’ అనే నుడికార భావం మొత్తంగా ముసాయిదాలో ఉన్నాయి. అయితే ‘విస్తరించి దాడి చేయాలి’ అనే కలయిక తెలుగులో సహజంగా లేదు; మూలంలోని సైనిక కదలికను అనవసరంగా రెండు వేరు చర్యలుగా కూడా చూపుతుంది.
