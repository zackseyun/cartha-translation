translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. అబీమెలెకు గాలుతో నేరుగా మాట్లాడుతున్నందున ఏకవచన అనౌపచారిక సంబోధనను ఉపయోగించాం. ‘ఇదిగో’ ద్వారా మూలంలోని దృష్టి ఆకర్షణను, ‘నీ వైపుకు’ ద్వారా אֵלֶיךָ లోని నిజమైన దిశార్థ అస్పష్టతను నిలిపాం.
