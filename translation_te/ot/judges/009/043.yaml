translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. హీబ్రూ సైనిక సందర్భాన్ని స్పష్టంగా తెలియజేస్తూనే, עָם ను ‘సైన్యం’ లేదా ‘సైనికులు’గా అతిగా నిర్దిష్టం చేయలేదు. పాదసూచిక గుర్తును అది వివరించే ‘మూడు దళాలుగా’ అన్న పదబంధం వెంట ఉంచాం.
