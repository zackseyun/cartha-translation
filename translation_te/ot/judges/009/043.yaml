source:
  edition: WLC
  text: וַ/יִּקַּ֣ח אֶת הָ/עָ֗ם וַֽ/יֶּחֱצֵ/ם֙ לִ/שְׁלֹשָׁ֣ה רָאשִׁ֔ים וַ/יֶּאֱרֹ֖ב בַּ/שָּׂדֶ֑ה וַ/יַּ֗רְא וְ/הִנֵּ֤ה הָ/עָם֙ יֹצֵ֣א מִן הָ/עִ֔יר וַ/יָּ֥קָם עֲלֵי/הֶ֖ם וַ/יַּכֵּֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/043.yaml
  text: He took the people[a], divided them into three companies, and lay in wait in the field. When he saw that the people were coming out of the city, he rose up against them and struck them down.
translation:
  language: te
  text: అతడు ప్రజలను తీసుకొని, వారిని మూడు దళాలుగా[a] విభజించి, పొలంలో మాటువేశాడు. పట్టణం నుంచి ప్రజలు బయటికి వస్తుండగా అతడు చూసి, వారికి ఎదిరిగా లేచి వారిని కొట్టాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘మూడు గుంపులుగా/బృందాలుగా’; అక్షరార్థంగా ‘మూడు తలలుగా.’ ఇది విభాగాలు లేదా దళాలను సూచించే హీబ్రూ నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח אֶת־הָעָם
  choice: అతడు ప్రజలను తీసుకొని
  rationale: עָם అనే పదానికి ప్రాథమిక అర్థం ‘ప్రజలు/జనం.’ ఇక్కడ అది అబీమెలెకు ఆధీనంలోని యుద్ధబలగాన్ని సూచిస్తున్నప్పటికీ, మూలపాఠం చెప్పినదానికంటే ఎక్కువగా నిర్దిష్టం చేయకుండా ‘ప్రజలు’ అని ఉంచబడింది.
- source_word: וַיֶּחֱצֵם לִשְׁלֹשָׁה רָאשִׁים
  choice: వారిని మూడు దళాలుగా విభజించి
  rationale: חצה అంటే ‘విభజించు.’ అక్షరార్థంగా ‘తలలు’ అనే רָאשִׁים ఇక్కడ విభాగాలు లేదా దళాలు అనే హీబ్రూ నుడికారార్థంలో ఉంది. సైనిక సందర్భంలో ‘మూడు దళాలు’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: וַיֶּאֱרֹב בַּשָּׂדֶה
  choice: పొలంలో మాటువేశాడు
  rationale: ארב మాటువేసి వేచియుండడాన్ని లేదా ఆకస్మిక దాడికి పొంచియుండడాన్ని సూచిస్తుంది. ‘మాటువేశాడు’ ఈ భావాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది; בַּשָּׂדֶה ను ‘పొలంలో’గా నేరుగా అనువదించాం.
- source_word: וַיַּרְא וְהִנֵּה
  choice: అతడు చూసి
  rationale: హీబ్రూ కథనంలో הִנֵּה దృశ్యానికి సజీవతను ఇస్తుంది. తెలుగులో కృత్రిమంగా ‘ఇదిగో’ అని చేర్చకుండా, తరువాతి కొనసాగుతున్న చర్యతో కలిపిన ‘చూసి’ ఆ కథన ప్రవాహాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: הָעָם יֹצֵא מִן־הָעִיר
  choice: పట్టణం నుంచి ప్రజలు బయటికి వస్తుండడం
  rationale: יֹצֵא అనే కృదంత రూపం అతడు గమనించినప్పుడు కొనసాగుతున్న చర్యను సూచిస్తుంది. అందువల్ల ‘బయటికి వస్తుండడం’ అని అనువదించబడింది.
- source_word: וַיָּקָם עֲלֵיהֶם
  choice: వారిమీదికి లేచి
  rationale: קום על అంటే సందర్భానుసారం ‘ఎదిరిగా లేచు’ లేదా ‘దాడి చేయు.’ ‘వారిమీదికి లేచి’ మూలంలోని రూపకాన్ని నిలిపి ఉంచుతూ దాడి భావాన్ని తెలియజేస్తుంది.
- source_word: וַיַּכֵּם
  choice: వారిని చిత్తుచేశాడు
  rationale: נכה అంటే కొట్టు, దెబ్బతీయు, ఓడించు వంటి విస్తృత అర్థాలు ఉన్నాయి; అది స్వయంగా ప్రతి ఒక్కరినీ చంపాడని తప్పనిసరిగా చెప్పదు. ‘చిత్తుచేశాడు’ నిర్ణాయకమైన హింసాత్మక దాడిని తెలియజేస్తూ, ‘చంపాడు’ అని అతిగా నిర్దిష్టం చేయదు.
