  text: הָל֤וֹךְ הָֽלְכוּ֙ הָ/עֵצִ֔ים לִ/מְשֹׁ֥חַ עֲלֵי/הֶ֖ם מֶ֑לֶךְ וַ/יֹּאמְר֥וּ לַ/זַּ֖יִת מלוכ/ה עָלֵֽי/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/008.yaml
  text: The trees once went to anoint a king over themselves[a], and they said to the olive tree, ‘Reign over us.’
translation:
  language: te
  text: 'తమపై పరిపాలించడానికి ఒక రాజును అభిషేకించడానికి చెట్లు బయలుదేరాయి[a]. అవి ఒలీవ చెట్టుతో ఇలా అన్నాయి: “మా మీద రాజుగా ఏలు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీలో “వెళ్లుచు వెళ్లాయి” అనే బలవాచక నిర్మాణం ఉంది. దీనిని “చెట్లు నిశ్చయంగా వెళ్లాయి” లేదా “చెట్లు బయలుదేరాయి” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָלוֹךְ הָלְכוּ
  choice: బయలుదేరాయి
  rationale: הלך యొక్క infinitive absolute మరియు finite verb కలయిక చర్యను బలంగా చూపుతుంది. ఆధునిక తెలుగులో సహజంగా ఉండే ‘బయలుదేరాయి’ ఆ ఉద్దేశపూర్వక ఆరంభాన్ని తెలియజేస్తుంది; హెబ్రీ బలప్రయోగాన్ని పాదటిప్పణి వివరిస్తుంది.
- source_word: הָעֵצִים
  choice: చెట్లు
  rationale: యోతాము చెప్పిన ఉపమానకథలో ఈ బహువచన నామవాచకం చెట్లనే సూచిస్తుంది.
- source_word: לִמְשֹׁחַ
  choice: అభిషేకించుకోవడానికి
  rationale: משׁח రాజపదవిలో ప్రతిష్ఠించేందుకు నూనెతో అభిషేకించే క్రియను సూచిస్తుంది. ‘నియమించుకోవడానికి’ అని సామాన్యీకరించకుండా మూలంలోని రాజకీయ-ఆచార చిత్రాన్ని నిలుపుతుంది; సందర్భానుసారమైన ఆత్మనేపద భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: עֲלֵיהֶם
  choice: తమ మీద
  rationale: מלךతో కూడిన על పాలనకు లోబడినవారిపై అధికారాన్ని సూచిస్తుంది; కర్త అయిన చెట్లను తిరిగి సూచించే భావం ‘తమ మీద’లో నిలుస్తుంది.
- source_word: מֶלֶךְ
  choice: ఒక రాజును
  rationale: ఇక్కడ నిర్దిష్టమైన రాజు కాక, తమను పాలించే ఒక రాజును వెదుకుతున్నందున ‘ఒక రాజు’ సహజమైన అనువాదం.
- source_word: וַיֹּאמְרוּ
  choice: అవి ... అన్నాయి
  rationale: אמר యొక్క సాధారణ కథన రూపాన్ని తెలుగులో సహజమైన ప్రత్యక్ష వాక్య పరిచయంగా అనువదించింది.
- source_word: לַזַּיִת
  choice: ఒలీవ చెట్టుతో
  rationale: זית ఒలీవను లేదా ఒలీవ చెట్టును సూచించగలదు; వ్యక్తీకరించబడిన సంబోధ్యాన్ని స్పష్టంగా చూపేందుకు ‘ఒలీవ చెట్టు’ ఎంచుకుంది.
- source_word: מלוכָה
  choice: రాజుగా ఏలు
  rationale: מלך యొక్క స్త్రీలింగ ఏకవచన ఆజ్ఞారూపం. తెలుగులో ‘ఏలు’ పాలించడాన్ని తెలుపుతుంది; ‘రాజుగా’ చేర్చడం రాజత్వ భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: עָלֵינוּ
  choice: మా మీద
  rationale: מלךతో ఉన్న על ప్రజలపై రాజాధికారాన్ని సూచిస్తుంది; ‘మా మీద’ ఆ సంబంధాన్ని నేరుగా వ్యక్తం చేస్తుంది.
