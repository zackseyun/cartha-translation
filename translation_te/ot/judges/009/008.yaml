translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, కథనానికి తగిన సరళమైనా గౌరవప్రదమైన శైలిని వాడింది. ‘అభిషేకించుకోవడానికి’ మూలంలోని రాజప్రతిష్ఠాపన చిత్రాన్ని నిలుపుతుంది; ‘రాజుగా ఏలు’ సాధారణ పాఠకులకు అర్థమయ్యేలా రాజత్వం మరియు పాలన రెండింటినీ తెలియజేస్తుంది. పాదటిప్పణి గుర్తు [a] ప్రధాన పాఠ్యంలో చేర్చబడింది.
