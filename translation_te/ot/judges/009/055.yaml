translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. ‘ఎవరి స్థలానికి వారు’ అనే పంపిణీ ప్రయోగం హీబ్రూ ఏకవచన నిర్మాణ భావాన్ని సాధారణ పాఠకులకు స్పష్టంగా అందిస్తుంది.
