base_translation:
  language: en
  yaml_path: translation/ot/judges/009/055.yaml
  text: When the men of Israel saw that Abimelech was dead[a], each went to his own place.
translation:
  language: te
  text: అబీమెలెకు చనిపోయాడని ఇశ్రాయేలు పురుషులు చూసినప్పుడు, ఎవరి స్థలానికి వారు వెళ్లిపోయారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “ఇశ్రాయేలు పురుషుడు ... ఒక్కొక్క పురుషుడు తన స్థలానికి.” ఏకవచనంలోని “పురుషుడు” సమూహంలోని ప్రతి వ్యక్తికీ ఈ చర్య వర్తిస్తుందని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְאוּ
  choice: చూసినప్పుడు
  rationale: ראה అనే క్రియకు ఇక్కడ ప్రాథమికంగా ‘చూచుట’ అనే అర్థమే ఉంది; దాని ద్వారా వారు అబీమెలెకు చనిపోయాడని గ్రహించారు. తెలుగు కథన ప్రవాహంలో ‘చూసినప్పుడు’ సహజంగా ఉంటుంది.
- source_word: אִישׁ יִשְׂרָאֵל
  choice: ఇశ్రాయేలు పురుషులు
  rationale: אִישׁ ఏకవచన రూపంలో ఉన్నా, బహువచన క్రియతో కలిసి సమూహార్థాన్ని ఇస్తుంది. యుద్ధ సందర్భంలోని పురుషులను స్పష్టంగా సూచిస్తూ మూలంలోని లింగార్థాన్ని నిలుపుతుంది.
- source_word: כִּי
  choice: అని
  rationale: వారు చూసి గ్రహించిన విషయాన్ని పరిచయం చేసే content marker‌గా כִּי పనిచేస్తోంది.
- source_word: מֵת
  choice: చనిపోయాడని
  rationale: మూలంలో అబీమెలెకు మృతస్థితిలో ఉన్నాడనే భావం ఉంది. తెలుగులో ‘చనిపోయాడని’ ఆ స్థితిని సహజంగా తెలియజేస్తుంది.
- source_word: אֲבִימֶלֶךְ
  choice: అబీమెలెకు
  rationale: వ్యక్తి పేరును తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: וַיֵּלְכוּ
  choice: వెళ్లిపోయారు
  rationale: הלך యొక్క సాధారణ కథనార్థం ‘వెళ్లడం.’ ‘తిరిగి వెళ్లారు’ అని అనడం మూలంలో లేని తిరుగు భావాన్ని స్పష్టంగా చేర్చుతుంది.
- source_word: אִישׁ לִמְקֹמוֹ
  choice: ఎవరి స్థలానికి వారు
  rationale: బహువచన సమూహంలోని ప్రతి వ్యక్తికి చర్యను పంపిణీ చేసే אִישׁ భావాన్ని సహజమైన తెలుగు ప్రయోగంతో వ్యక్తం చేస్తుంది. מָקוֹםను ‘ఇల్లు’గా కాక ‘స్థలం’గా అనువదించడం మూలానికి దగ్గరగా ఉంటుంది.
