  text: because my father fought for you[a], cast his life in front of him[b], and delivered you from the hand of Midian.
translation:
  language: te
  text: ఎందుకంటే నా తండ్రి మీ కోసం పోరాడి, తన ప్రాణాన్ని పణంగా పెట్టి[a], మిద్యాను చేతినుండి మిమ్మల్ని విడిపించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “తన ప్రాణాన్ని ముందుకు విసిరివేశాడు”; అంటే తనను తాను ప్రాణాపాయానికి గురిచేసుకున్నాడు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: ఎందుకంటే
  rationale: ముందటి వాక్యంలో యోతాము చేసిన ఆరోపణకు ఈ మాట కారణాన్ని తెలియజేస్తోంది; అందువల్ల సందర్భానుసారంగా కారణార్థకంగా అనువదించబడింది.
- source_word: נִלְחַם אָבִי עֲלֵיכֶם
  choice: నా తండ్రి మీ కోసం పోరాడి
  rationale: נִלְחַם అంటే ‘పోరాడాడు’; ఇక్కడ עֲלֵיכֶם ప్రజలకు వ్యతిరేకంగా కాక, వారి పక్షాన లేదా మేలు కోసం పోరాడిన భావాన్ని ఇస్తోంది.
- source_word: וַיַּשְׁלֵךְ אֶת־נַפְשׁוֹ מִנֶּגֶד
  choice: తన ప్రాణాన్ని పణంగా పెట్టి
  rationale: ఈ హెబ్రీయ ఇడియమ్ తనను తాను ప్రాణాపాయానికి గురిచేసుకోవడాన్ని సూచిస్తుంది. ‘ప్రాణాన్ని పణంగా పెట్టి’ అనేది ఆ భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: וַיַּצֵּל
  choice: విడిపించాడు
  rationale: నצל యొక్క హిఫీల్ రూపం ప్రమాదం లేదా శత్రువు అధికారం నుంచి రక్షించడం, విడిపించడం అనే అర్థం ఇస్తుంది; సైనిక సందర్భంలో ‘విడిపించాడు’ సముచితం.
- source_word: מִיַּד מִדְיָן
  choice: మిద్యాను చేతిలోనుండి
  rationale: ‘చేతిలోనుండి’ అనే మూలభాషా రూపకం అధికారం లేదా అదుపును సూచిస్తుంది; ఇది తెలుగులోనూ అర్థమయ్యే బైబిలీయ ప్రయోగం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గంభీరంగా అనువదించబడింది. మూలంలోని కారణ సంబంధం, ప్రాణాపాయాన్ని సూచించే ఇడియమ్, ‘చేతిలోనుండి’ అనే అధికార రూపకం నిలుపబడ్డాయి.
