source:
  edition: WLC
  text: וַ/יָּבֹ֤א בֵית אָבִי/ו֙ עָפְרָ֔תָ/ה וַֽ/יַּהֲרֹ֞ג אֶת אֶחָ֧י/ו בְּנֵֽי יְרֻבַּ֛עַל שִׁבְּעִ֥ים אִ֖ישׁ עַל אֶ֣בֶן אֶחָ֑ת וַ/יִּוָּתֵ֞ר יוֹתָ֧ם בֶּן יְרֻבַּ֛עַל הַ/קָּטֹ֖ן כִּ֥י נֶחְבָּֽא־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/005.yaml
  text: Then he went to his father’s house at Ophrah and killed his brothers[a], the sons of Jerubbaal—seventy men—on one stone. But Jotham, the youngest son of Jerubbaal, was left[c][b], because he hid himself.
translation:
  language: te
  text: తర్వాత అతడు ఒఫ్రాలోని తన తండ్రి ఇంటికి వెళ్లి, యెరుబ్బయలు కుమారులైన తన సహోదరులను—డెబ్బై మందిని—ఒకే రాతిమీద[a] చంపాడు. అయితే యెరుబ్బయలు అందరిలో చిన్నవాడైన కుమారుడు యోతాము దాక్కున్నందున మిగిలాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ఒకే రాతిమీద’ అన్నది, డెబ్బై మందినీ ఒకే చోట ఒక రాయి వద్ద వధించారని సూచించవచ్చు.
    reason: cultural_note
  - marker: b
    text: లేదా, ‘ప్రాణాలతో మిగిలాడు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא בֵית אָבִיו עָפְרָתָה
  choice: తర్వాత అతడు ఒఫ్రాలోని తన తండ్రి ఇంటికి వెళ్లి
  rationale: దిశను సూచించే עָפְרָתָהతో కూడిన గమనాన్ని సహజమైన ఆధునిక తెలుగులో తెలిపేందుకు ‘వెళ్లి’ అని అనువదించాం; בֵית אָבִיוను స్థలసూచక సందర్భానికి అనుగుణంగా ‘తన తండ్రి ఇంటికి’గా ఉంచాం.
- source_word: וַיַּהֲרֹג
  choice: చంపాడు
  rationale: మూల క్రియలోని ప్రాథమిక హత్యార్థాన్ని అదనపు న్యాయపరమైన వ్యాఖ్యానం లేకుండా సూటిగా తెలియజేస్తుంది.
- source_word: אֶת אֶחָיו בְּנֵי יְרֻבַּעַל
  choice: యెరుబ్బయలు కుమారులైన తన సహోదరులను
  rationale: ‘తన సహోదరులు’ మరియు వారిని గుర్తించే ‘యెరుబ్బయలు కుమారులు’ అనే రెండు అంశాలనూ సహజమైన తెలుగు సంబంధవాచక నిర్మాణంలో నిలిపాం.
- source_word: שִׁבְעִים אִישׁ
  choice: డెబ్బై మందిని
  rationale: తెలుగులో మనుషుల సంఖ్యను సహజంగా సూచించే ‘మంది’ను వాడి, వాక్యంలోని కర్మవిభక్తిని కొనసాగించాం.
- source_word: עַל אֶבֶן אֶחָת
  choice: ఒకే రాతిమీద
  rationale: ఒకే రాయి వద్ద లేదా దానిమీద సమూహంగా వధించిన ఘోర దృశ్యాన్ని మూలంలోని సంక్షిప్తతతోనే నిలుపుతుంది; స్థల స్వరూపాన్ని మరింత నిర్దిష్టంగా నిర్ణయించదు.
- source_word: וַיִּוָּתֵר
  choice: మిగిలాడు
  rationale: నిఫాల్ రూపంలోని ‘మిగిలిపోవడం/వదిలివేయబడడం’ భావాన్ని సహజంగా తెలుపుతుంది; సందర్భం అతడు ప్రాణాలతో మిగిలాడని సూచించినా, దాన్ని ప్రధాన పాఠ్యంలో విస్తరించలేదు.
- source_word: הַקָּטֹן
  choice: చిన్న కుమారుడు
  rationale: కుటుంబ సందర్భంలో ‘చిన్నవాడు’ అంటే వయస్సులో చిన్న కుమారుడు అనే సహజ భావాన్ని ఇస్తుంది; ‘అందరికంటే చిన్నవాడు’ అని మూలం కంటే మరింత నిర్దిష్టం చేయలేదు.
- source_word: כִּי נֶחְבָּא
  choice: దాక్కున్నందున
  rationale: యోతాము మిగిలిపోవడానికి కారణాన్ని సంక్షిప్తంగా, సహజమైన తెలుగు కారణార్థక నిర్మాణంలో వ్యక్తం చేస్తుంది.
