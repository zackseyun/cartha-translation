translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే కథన శైలి. హీబ్రూ పాఠ్యంలోని వరుస చర్యలు, బంధుత్వ గుర్తింపు, ‘ఒకే రాయి’ అనే కఠిన దృశ్యరూపం, וַיִּוָּתֵרలోని స్వల్ప అస్పష్టత నిలుపబడ్డాయి. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
