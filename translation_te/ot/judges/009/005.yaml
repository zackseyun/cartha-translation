  terminology: Names are consistently and recognizably transliterated as ఒఫ్రా, యెరుబ్బయలు, and యోతాము. ‘సహోదరులు,’ ‘చంపాడు,’ and ‘మిగిలాడు’ fit the narrative register and preserve the source’s wording without doctrinal expansion.
