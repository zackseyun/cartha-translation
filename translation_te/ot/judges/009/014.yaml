base_translation:
  language: en
  yaml_path: translation/ot/judges/009/014.yaml
  text: Then all the trees said to the bramble[a], ‘You come, reign over us.’
translation:
  language: te
  text: 'అప్పుడు చెట్లన్నీ ముళ్లపొదతో[a] ఇలా అన్నాయి: “నువ్వు వచ్చి మాకు రాజువై పాలించు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ముళ్లచెట్టు.’ హీబ్రూ పదం ముళ్లుగల పొదను సూచిస్తుంది; నిర్దిష్ట వృక్షజాతి స్పష్టంగా తెలియదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: అప్పుడు ... అన్నాయి
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది. ఆధునిక తెలుగు కథనశైలిలో ‘అప్పుడు’ వరుసను సహజంగా తెలియజేస్తుంది.
- source_word: כָל הָעֵצִים
  choice: చెట్లన్నీ
  rationale: మూలంలోని సమష్టి భావాన్నీ, నిర్దిష్టతనూ సహజమైన తెలుగు రూపంలో తెలియజేస్తుంది.
- source_word: אֶל הָאָטָד
  choice: ముళ్లపొదతో[a]
  rationale: אָטָד అనేది ముళ్లుగల పొదను సూచిస్తుంది; ఖచ్చితమైన వృక్షజాతిని అనవసరంగా నిర్ణయించకుండా ‘ముళ్లపొద’ దాని స్వభావాన్ని స్పష్టంగా తెలియజేస్తుంది. మాట చెప్పే సందర్భంలో אֶל‌ను తెలుగులో సహజంగా ‘తో’ అని అనువదించాం.
- source_word: לֵךְ אַתָּה
  choice: నువ్వు వచ్చి
  rationale: మరో ఆజ్ఞకు ముందు వచ్చే הלך ఇక్కడ ముందుకు రావాలని పిలిచే ప్రయోగం. ప్రత్యేక సర్వనామమైన אַתָּה ఇచ్చే ఉద్ఘాటనను ‘నువ్వు’ నిలుపుతుంది.
- source_word: מְלָךְ עָלֵינוּ
  choice: మమ్మల్ని పాలించు
  rationale: మూలంలోని రాజుగా పరిపాలించే భావాన్ని తెలుగులో సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది; సందర్భంలోని రాజత్వ భావం కొనసాగుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి ఉపయోగించబడింది. చెట్లు వ్యక్తుల్లా మాట్లాడే ఉపమానకథ స్వభావం అలాగే నిలుపబడింది.
