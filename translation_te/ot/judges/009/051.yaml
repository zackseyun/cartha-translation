  terminology: ‘బలమైన గోపురం,’ ‘పట్టణ ప్రముఖులు,’ and ‘గోపురపు పైకప్పు’ are appropriate, understandable renderings. The footnotes accurately explain the relevant lexical and idiomatic alternatives and retain their anchors.
