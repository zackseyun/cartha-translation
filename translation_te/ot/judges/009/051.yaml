  text: וּ/מִגְדַּל עֹז֮ הָיָ֣ה בְ/תוֹךְ הָ/עִיר֒ וַ/יָּנֻ֨סוּ שָׁ֜מָּ/ה כָּל הָ/אֲנָשִׁ֣ים וְ/הַ/נָּשִׁ֗ים וְ/כֹל֙ בַּעֲלֵ֣י הָ/עִ֔יר וַֽ/יִּסְגְּר֖וּ בַּעֲדָ֑/ם וַֽ/יַּעֲל֖וּ עַל גַּ֥ג הַ/מִּגְדָּֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/051.yaml
  text: But there was a strong tower in the middle of the city[a], and all the men and women and all the leaders of the city fled there and shut themselves in[b], and they went up onto the roof of the tower.
translation:
  language: te
  text: పట్టణం మధ్యలో ఒక బలమైన గోపురం[a] ఉండేది. పట్టణంలోని పురుషులందరూ, స్త్రీలందరూ, పట్టణ ప్రముఖులందరూ[b] అక్కడికి పారిపోయి, తమను తాము లోపలే మూసుకొని, గోపురపు పైకప్పు మీదికి ఎక్కారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘కోటలాంటి గోపురం.’ హీబ్రూ పదబంధం అక్షరార్థంగా ‘గోపురం’ అనే పదంతో ‘బలం’ అనే పదాన్ని కలిపి, దాని రక్షణాత్మక స్వభావాన్ని నొక్కిచెబుతుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘పట్టణంలోని ప్రధాన వ్యక్తులందరూ.’ హీబ్రూలో అక్షరార్థంగా ‘పట్టణపు యజమానులు/అధిపతులు’ అని ఉంది; ఇది పట్టణంలోని ప్రతి నివాసిని కాకుండా, దాని ప్రముఖులను సూచించే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִגְדַּל עֹז
  choice: బలమైన గోపురం
  rationale: מִגְדַּל అంటే ‘గోపురం’; עֹז దాని బలాన్ని, రక్షణాత్మక స్వభావాన్ని సూచిస్తుంది. ‘బలమైన గోపురం’ సహజమైన తెలుగులో ఈ రెండు భావాలనూ నిలుపుతుంది.
- source_word: בְּתוֹךְ הָעִיר
  choice: పట్టణం మధ్యలో
  rationale: בְּתוֹךְ యొక్క ‘మధ్యలో/నడుమ’ అనే స్థలార్థాన్ని నేరుగా వ్యక్తపరుస్తుంది.
- source_word: וַיָּנֻסוּ שָׁמָּה
  choice: అక్కడికి పారిపోయి
  rationale: נוּס యొక్క ప్రాథమిక అర్థం ‘పారిపోవడం’; ఆశ్రయం పొందాలనే ఉద్దేశాన్ని క్రియలోకి అదనంగా చేర్చలేదు.
- source_word: כָּל הָאֲנָשִׁים וְהַנָּשִׁים
  choice: పురుషులందరూ, స్త్రీలందరూ
  rationale: హీబ్రూ పాఠంలో పురుషులు, స్త్రీలు విడిగా పేర్కొనబడినందున ఆ భేదాన్ని నిలిపింది.
- source_word: וְכֹל בַּעֲלֵי הָעִיר
  choice: పట్టణ ప్రముఖులందరూ
  rationale: בַּעֲלֵי యొక్క అక్షరార్థం ‘యజమానులు/అధిపతులు’; ఈ పౌర సందర్భంలో అది పట్టణంలోని ప్రధాన వ్యక్తులను సూచిస్తుంది. ‘ప్రముఖులు’ ఈ సామాజిక భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וַיִּסְגְּרוּ בַעֲדָם
  choice: తమను తాము లోపల బంధించుకొని
  rationale: పదబంధం ‘తమ వెనుక/తమ కోసం మూసుకున్నారు’ అనే భావాన్ని ఇస్తుంది; హీబ్రూలో లేని ‘తలుపు’ అనే కర్మను చేర్చకుండా, వారు లోపల సురక్షితంగా మూసుకున్నారని తెలుపుతుంది.
- source_word: וַיַּעֲלוּ עַל גַּג הַמִּגְדָּל
  choice: గోపురపు పైకప్పు మీదికి ఎక్కారు
  rationale: עָלָה పైకి వెళ్లడాన్ని, גַּג ప్రత్యేకంగా పైకప్పును సూచిస్తాయి. తెలుగులో ‘ఎక్కారు’ కదలికను సహజంగా వ్యక్తపరుస్తుంది.
