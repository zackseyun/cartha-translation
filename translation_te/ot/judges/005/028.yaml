  terminology: ‘సీసెరా,’ ‘రథం,’ ‘జాలకం,’ and ‘విలపించింది’ are suitable. ‘అడుగుల చప్పుళ్లు’ retains the deliberately unusual source expression without deciding whether the sound is from horses, wheels, or the approaching chariots as a whole.
