source:
  edition: WLC
  text: בְּעַד֩ הַ/חַלּ֨וֹן נִשְׁקְפָ֧ה וַ/תְּיַבֵּ֛ב אֵ֥ם סִֽיסְרָ֖א בְּעַ֣ד הָֽ/אֶשְׁנָ֑ב מַדּ֗וּעַ בֹּשֵׁ֤שׁ רִכְבּ/וֹ֙ לָ/ב֔וֹא מַדּ֣וּעַ אֶֽחֱר֔וּ פַּעֲמֵ֖י מַרְכְּבוֹתָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/028.yaml
  text: 'Through the window Sisera’s mother looked out and wailed through the lattice: “Why is his chariot so late in coming? Why do the hoofbeats of his chariots delay?”[a][b]'
translation:
  language: te
  text: 'కిటికీ గుండా సీసెరా తల్లి బయటికి చూసి, జాలకం గుండా విలపించింది:[a]


    “అతని రథం రావడానికి ఎందుకింత ఆలస్యం?


    అతని రథాల అడుగుల చప్పుళ్లు ఎందుకు ఆలస్యమవుతున్నాయి?”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కేక వేసింది.” ఇక్కడ వాడిన హీబ్రూ క్రియ అరుదైనది; అది విలాపాన్ని లేదా ఆందోళనతో వేసిన కేకను సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా, “అతని రథాల అడుగులు/పాదధ్వనులు.” రథాలను లాగే గుర్రాల గిట్టల చప్పుడు లేదా సమీపిస్తున్న రథాల మోత ఉద్దేశించి ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעַד הַחַלּוֹן
  choice: కిటికీ గుండా
  rationale: కిటికీ అనే తెరువు గుండా చూడడాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: נִשְׁקְפָה
  choice: బయటికి చూసింది
  rationale: కిటికీ లేదా ఎత్తైన స్థలం నుంచి వెలుపలికి చూడడం అనే క్రియార్థాన్ని సరళంగా నిలుపుతుంది.
- source_word: וַתְּיַבֵּב
  choice: విలపించింది
  rationale: అరుదైన ఈ క్రియ ఆందోళనతో కూడిన రోదన లేదా కేకను సూచించవచ్చు; ‘విలపించింది’ భావతీవ్రతను తెలియజేస్తూనే ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచుతుంది.
- source_word: אֵם סִיסְרָא
  choice: సీసెరా తల్లి
  rationale: హీబ్రూ సంబంధ నిర్మాణానికి సహజమైన తెలుగు రూపం.
- source_word: הָאֶשְׁנָב
  choice: జాలకం
  rationale: జాలకంతో మూయబడిన కిటికీ తెరువును సూచించే సంక్షిప్తమైన, గౌరవప్రదమైన పదం.
- source_word: בֹּשֵׁשׁ רִכְבּוֹ לָבוֹא
  choice: అతని రథం రావడానికి ఎందుకింత ఆలస్యం?
  rationale: రథం రావడం ఆలస్యమవుతోందనే తల్లి ఆందోళనను సహజమైన ప్రశ్నగా వ్యక్తం చేస్తుంది; ఏకవచన ‘రథం’ను నిలుపుతుంది.
- source_word: אֶחֱרוּ פַּעֲמֵי מַרְכְּבוֹתָיו
  choice: అతని రథాల అడుగుల చప్పుడు ఎందుకు ఆలస్యమవుతోంది?
  rationale: פַּעֲמֵי లోని ‘అడుగులు/పాదధ్వనులు’ అనే రూపకాన్ని నిలుపుతూ, వినిపించాల్సిన రథాల రాకధ్వనిని తెలుగులో అర్థమయ్యేలా ‘చప్పుడు’తో వ్యక్తం చేస్తుంది; గుర్రాల గిట్టలని మూలంలో స్పష్టంగా లేని వివరాన్ని ప్రధాన పాఠ్యంలో చేర్చదు.
