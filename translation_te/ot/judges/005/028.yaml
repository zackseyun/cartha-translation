translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కవితాత్మక దృశ్యాన్ని, తల్లి ఆందోళనతో వేసిన రెండు ప్రశ్నలను గౌరవప్రదమైన కానీ సాధారణ పాఠకులకు సులభమైన భాషలో నిలుపుకుంది. అరుదైన క్రియలోని సందిగ్ధతను, ‘రథాల అడుగులు’ అనే అసాధారణ హీబ్రూ రూపకాన్ని పాదసూచికలతో సంరక్షించింది.
