  naturalness: “నాయకులతో నా హృదయం ఉంది” is understandable but somewhat calqued and less idiomatic in modern Telugu. “నాయకులవైపే నా హృదయం ఉంది” naturally retains the Hebrew heart idiom and conveys the speaker’s allegiance/admiration. “ప్రజలలో” is smoother than “ప్రజల మధ్య” for the participial phrase.
  terminology: “నాయకులు” is a sound contextual rendering of לְחוֹקְקֵי, while the footnote preserves “శాసనకర్తలు” as a lexical alternative. Use “యాహ్వే” consistently for יְהוָה in accordance with the project’s stated naming policy.
