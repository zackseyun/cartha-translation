source:
  edition: WLC
  text: לִבִּ/י֙ לְ/חוֹקְקֵ֣י יִשְׂרָאֵ֔ל הַ/מִּֽתְנַדְּבִ֖ים בָּ/עָ֑ם בָּרֲכ֖וּ יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/009.yaml
  text: My heart is with the leaders of Israel[a], who volunteered among the people. Bless Yahweh!
translation:
  language: te
  text: 'ప్రజలలో స్వచ్ఛందంగా ముందుకు వచ్చిన ఇశ్రాయేలు నాయకులవైపే నా హృదయం ఉంది.[a]


    యాహ్వేను స్తుతించండి!'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ప్రజలలో తమను తాము స్వచ్ఛందంగా అర్పించుకున్న ఇశ్రాయేలు శాసనకర్తలవైపే నా హృదయం ఉంది.”
    reason: לְחוֹקְקֵיకి ‘నాయకులు’తో పాటు ‘శాసనకర్తలు’ అనే అర్థసంభావ్యత ఉంది; הַמִּתְנַדְּבִים స్వచ్ఛంద స్వీయార్పణ భావాన్ని కూడా సూచించవచ్చు.
lexical_decisions:
- source_word: לִבִּי
  choice: నా హృదయం
  rationale: మూలంలోని ‘నా హృదయం’ అనే రూపకాన్ని నిలుపుతూ, నాయకులపట్ల దెబోరా చూపుతున్న హృదయపూర్వక మద్దతు, అభిమానాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: לְחוֹקְקֵי
  choice: నాయకులతో ... ఉంది
  rationale: חקק మూలానికి శాసించడం లేదా నిర్ణయించడం అనే భావం ఉన్నా, ఇక్కడ బాధ్యత వహించి ముందుండే ఇశ్రాయేలు నాయకులను సూచిస్తుంది. ‘నాయకులు’ ఆధునిక పాఠకులకు స్పష్టంగా ఉండగా, ‘శాసనకర్తలు’ అనే మూలార్థసంభవాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: יִשְׂרָאֵל
  choice: ఇశ్రాయేలు
  rationale: నాయకులు ఇశ్రాయేలుకు చెందినవారని తెలిపే సంబంధాన్ని సహజమైన తెలుగు నామరూపంతో వ్యక్తం చేస్తుంది.
- source_word: הַמִּתְנַדְּבִים
  choice: స్వచ్ఛందంగా ముందుకు వచ్చిన
  rationale: Hitpael రూపం స్వచ్ఛందంగా తనను తాను అర్పించుకోవడం లేదా బాధ్యతకు ముందుకు రావడం అనే భావాన్ని ఇస్తుంది. ఈ సందర్భంలో ‘స్వచ్ఛందంగా ముందుకు వచ్చిన’ అనేది సహజంగా, పూర్తి భావంతో ఉంటుంది.
- source_word: בָּעָם
  choice: ప్రజల మధ్య
  rationale: עם అనే విస్తృత పదాన్ని ‘ప్రజలు’గా ఉంచి, సందర్భం కోరనంతగా ‘సైనికులు’ అని సంకుచితం చేయలేదు.
- source_word: בָּרֲכוּ
  choice: స్తుతించండి
  rationale: ברך యొక్క అక్షరార్థం ‘ఆశీర్వదించండి’ అయినప్పటికీ, దేవునిని ఉద్దేశించిన ఈ గీత సందర్భంలో అది స్తుతించమనే పిలుపు. ఆధునిక తెలుగులో ‘యెహోవాను ఆశీర్వదించండి’ కంటే ‘స్తుతించండి’ ఉద్దేశిత భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే వ్యక్తినామ రూపం ‘యెహోవా’గా ఇచ్చాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో వ్యక్తిగత దైవనామమే ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుతో మార్చకుండా నిలిపాం; ఆధునిక తెలుగు బైబిలు వాడుకలో సులభంగా గుర్తించబడే ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం.
- issue: בָּרֲכוּ అనే దేవునికి ఉద్దేశించిన ఆజ్ఞ
  choice: స్తుతించండి
  alternative: ఆశీర్వదించండి
  rationale: అక్షరార్థ ప్రత్యామ్నాయాన్ని గుర్తించినప్పటికీ, దేవుని విషయంగా ברך కృతజ్ఞతతో ఘనపరచడం, స్తుతించడం అనే కార్యార్థాన్ని కలిగి ఉంది. తెలుగు పాఠకునికి అపార్థం రాకుండా సందర్భార్థాన్ని ప్రధాన పాఠ్యంలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన గీత శైలిని నిలుపుతూ, సాధారణ పాఠకులకు అర్థమయ్యే పదాలను వాడాం. ‘నా హృదయం ... ఉంది’ అనే హెబ్రీ రూపకాన్ని తొలగించలేదు. మూలంలోని రెండు పంక్తుల కవితాత్మక నిర్మాణాన్ని తెలుగు పంక్తి విభజనతో ప్రతిబింబించాం.
