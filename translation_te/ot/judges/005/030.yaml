id: JDG.5.30
reference: Judges 5:30
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: הֲ/לֹ֨א יִמְצְא֜וּ יְחַלְּק֣וּ שָׁלָ֗ל רַ֤חַם רַחֲמָתַ֨יִם֙ לְ/רֹ֣אשׁ גֶּ֔בֶר שְׁלַ֤ל צְבָעִים֙ לְ/סִ֣יסְרָ֔א שְׁלַ֥ל צְבָעִ֖ים רִקְמָ֑ה צֶ֥בַע רִקְמָתַ֖יִם לְ/צַוְּארֵ֥י שָׁלָֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/030.yaml
  text: ‘Are they not finding and dividing the spoil? A womb[a], two wombs for each man; spoil of dyed cloths for Sisera, spoil of dyed cloths, embroidered cloth, dyed cloth[b], two embroideries for the necks of the spoil.’
translation:
  language: te
  text: '“వారు దోపుడు సొమ్మును కనుగొని పంచుకుంటూ ఉండరా?


    ఒక్కొక్క మగవానికి ఒక గర్భం[a], రెండు గర్భాలు;


    సీసెరాకు రంగు అద్దిన వస్త్రాల దోపుడు సొమ్ము,


    రంగు అద్దిన వస్త్రాల దోపుడు సొమ్ము, కుట్టుపని చేసిన వస్త్రం;


    రంగు అద్దిన వస్త్రం, రెండు కుట్టుపని అల్లికలు—


    దోపుడు సొమ్ము మెడల కోసం[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “ఒక గర్భం, రెండు గర్భాలు.” యుద్ధంలో లైంగిక దోపుడు సొమ్ముగా పట్టుకొనే స్త్రీలను సూచించే క్రూరమైన లాక్షణిక ప్రయోగం ఇది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “బందీల మెడల కోసం” / “దోపుడు సొమ్ముగా పట్టుబడినవారి మెడల కోసం.” చివరి హీబ్రూ పదబంధం క్లిష్టమైనది; బందీలైన స్త్రీలు ధరించే కుట్టుపని వస్త్రాలను ఇది సూచిస్తుండవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: הֲלֹא יִמְצְאוּ יְחַלְּקוּ שָׁלָל
  choice: వారు దోపుడు సొమ్మును కనుగొని పంచుకుంటూ ఉండరా?
  rationale: హֲלֹא సూచించే అలంకార ప్రశ్నను, యుద్ధానంతర దోపిడీ ఇంకా జరుగుతోందనే సజీవ నిరీక్షణను తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: רַחַם רַחֲמָתַיִם
  choice: ఒక గర్భం, రెండు గర్భాలు
  rationale: మూలంలోని ఏకవచన-ద్వివచన క్రమాన్నీ, బందీ స్త్రీలను లైంగిక దోపుడు వస్తువులుగా కించపరిచే ఉద్దేశపూర్వకమైన కఠిన రూపకాలంకారాన్నీ మెత్తబరచకుండా నిలుపుతుంది.
- source_word: לְרֹאשׁ גֶּבֶר
  choice: ఒక్కొక్క మగవానికి
  rationale: అక్షరార్థంగా ‘ఒక మగవాని తలకు’ అయినా, ఇక్కడ వ్యక్తివారీ పంపకాన్ని సూచించే హీబ్రూ ప్రయోగం. సహజమైన తెలుగులో పంపిణీ భావాన్ని స్పష్టం చేస్తూ లింగసూచనను కాపాడుతుంది.
- source_word: שָׁלָל
  choice: దోపుడు సొమ్ము
  rationale: యుద్ధంలో స్వాధీనం చేసుకున్న మనుషులు లేదా వస్తువులను సూచించే సైనిక పదానికి ఆధునిక తెలుగులో స్పష్టమైన సమానార్థకం.
- source_word: צְבָעִים
  choice: రంగు అద్దిన వస్త్రాలు
  rationale: రంగు వేసిన విలువైన వస్త్రాల భావాన్ని, కేవలం సాధారణ రంగురంగుల బట్టలుగా తగ్గించకుండా తెలియజేస్తుంది.
- source_word: רִקְמָה
  choice: కుట్టుపని చేసిన వస్త్రం
  rationale: అలంకార కుట్టుపని లేదా ఎంబ్రాయిడరీ గల వస్త్రాన్ని సాధారణ ఆధునిక తెలుగు పాఠకునికి అర్థమయ్యేలా వ్యక్తం చేస్తుంది.
- source_word: צֶבַע רִקְמָתַיִם
  choice: రంగు వస్త్రం, రెండు కుట్టుపనులు
  rationale: మూలంలోని సంక్షిప్తమైన, క్లిష్టమైన పదక్రమాన్నీ ద్వివచనాన్నీ అతిగా వ్యాఖ్యానించకుండా నిలుపుతుంది.
- source_word: לְצַוְּארֵי שָׁלָל
  choice: దోపుడు సొమ్ము మెడల కోసం
  rationale: క్లిష్టమైన హీబ్రూ పదబంధానికి సన్నిహిత అనువాదం; ‘బందీల మెడల కోసం’ అనే భావాన్ని పాదటిప్పణిలో ఉంచి అస్పష్టతను కాపాడుతుంది.
theological_decisions:
- issue: రַחַם רַחֲמָתַיִם అనే లైంగికీకరించిన యుద్ధదోపిడీ ప్రయోగాన్ని మెత్తబరచాలా?
  choice: ‘ఒక గర్భం, రెండు గర్భాలు’ అనే కఠిన రూపకాన్ని నిలుపుట
  alternative: ‘ఒక స్త్రీ, ఇద్దరు స్త్రీలు’ లేదా ‘ఒక యువతి, ఇద్దరు యువతులు’
  rationale: ఇది సీసెరా ఇంటివారి క్రూరమైన నిరీక్షణను చిత్రిస్తుంది; కథకుని సమ్మతిని కాదు. మూలంలోని మానవత్వహీనమైన భాషను నిలపడం గీతంలోని నైతిక తీవ్రతను కాపాడుతుంది.
- issue: లְצַוְּארֵי שָׁלָל అనే క్లిష్టమైన చివరి పదబంధాన్ని ఎలా అనువదించాలి?
  choice: ప్రధాన పాఠ్యంలో సన్నిహిత, ఉద్దేశపూర్వకంగా అస్పష్టమైన అనువాదం; పాదటిప్పణిలో సాధ్యమైన అర్థం
  alternative: ‘బందీల మెడల కోసం’ అని ప్రధాన పాఠ్యంలో స్పష్టీకరించడం
  rationale: హీబ్రూ వాక్యనిర్మాణం సంక్షిప్తంగా ఉండి వివాదాస్పదం. ఒక వ్యాఖ్యానాన్ని నిర్ధారించకుండా నిజమైన పాఠ్య అస్పష్టతను సంరక్షిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గీతాత్మక పాద విభజనతో గంభీరమైనా సాధారణ పాఠకునికి అర్థమయ్యే శైలి. మూలంలోని పునరుక్తి, క్రూరమైన రూపకం, చివరి పదబంధపు అస్పష్టత ఉద్దేశపూర్వకంగా నిలుపబడ్డాయి.
