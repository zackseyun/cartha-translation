revisions:
- from: '“వారు దోపుడు సొమ్మును కనుగొని పంచుకుంటూ ఉండరా?

    ఒక్కొక్క మగవానికి ఒక గర్భం[a], రెండు గర్భాలు;

    సీసెరాకు రంగు అద్దిన వస్త్రాలు దోపుడు సొమ్ముగా,

    రంగు అద్దిన వస్త్రాలు, కుట్టుపని చేసిన వస్త్రం దోపుడు సొమ్ముగా;

    రంగు వస్త్రం, రెండు కుట్టుపనులు—

