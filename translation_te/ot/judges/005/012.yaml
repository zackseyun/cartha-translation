id: JDG.5.12
reference: Judges 5:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: עוּרִ֤י עוּרִי֙ דְּבוֹרָ֔ה ע֥וּרִי ע֖וּרִי דַּבְּרִי שִׁ֑יר ק֥וּם בָּרָ֛ק וּֽ/שֲׁבֵ֥ה שֶׁבְיְ/ךָ֖ בֶּן אֲבִינֹֽעַם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/012.yaml
  text: Awake[a], awake, Deborah! Awake, awake, sing a song! Rise up, Barak, and take captive your captives[b], son of Abinoam.
translation:
  language: te
  text: 'మేలుకో, మేలుకో, దెబోరా!

    మేలుకో, మేలుకో, గీతం పలుకు[a]!

    లేవు, బారాకూ!

    నీ బందీలను చెరపట్టుకో[b],

    అబీనోయము కుమారుడా!'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “గీతం పలుకు.” దీనిని “గీతం పాడు” అని కూడా భావించవచ్చు; అయితే హీబ్రూ మూలంలో సాధారణంగా ‘పాడు’ అనే క్రియకు బదులు ‘పలుకు’ అనే క్రియ ఉంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “నీ బందీలను చెరపట్టుకో.” శత్రువులను బందీలుగా పట్టుకొని సాధించిన విజయాన్ని తెలిపే హీబ్రూ పదప్రయోగం ఇది.
    reason: lexical_alternative
lexical_decisions:
- source_word: עוּרִי
  choice: మేలుకో
  rationale: స్త్రీలింగ ఏకవచన ఆజ్ఞారూపం నాలుగుసార్లు పునరుక్తమై కవితాత్మక అత్యవసరతను వ్యక్తం చేస్తుంది. ‘మేలుకో’ ఆ పిలుపును సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: דְּבוֹרָה
  choice: దెబోరా
  rationale: వ్యక్తి పేరును తెలుగులో సుపరిచితమైన రూపంలో లిప్యంతరీకరించాం.
- source_word: דַּבְּרִי שִׁיר
  choice: గీతం పలుకు
  rationale: మూలంలోని క్రియ అక్షరార్థంగా ‘మాట్లాడు/పలుకు’; సాధారణంగా ఊహించే ‘పాడు’ కాదు. ‘గీతం పలుకు’ కవితాత్మక ప్రత్యేకతను, ఉద్దేశపూర్వకమైన పదప్రయోగాన్ని నిలుపుతుంది.
- source_word: קוּם
  choice: లేవు
  rationale: బారాకుకు ఉద్దేశించిన పుంలింగ ఏకవచన ఆజ్ఞ. యుద్ధసంబంధమైన కార్యానికి లేవమనే సంక్షిప్త పిలుపును తెలుగులో సహజంగా అందిస్తుంది.
- source_word: בָּרָק
  choice: బారాకు
  rationale: వ్యక్తి పేరును తెలుగులో సుపరిచితమైన రూపంలో లిప్యంతరీకరించాం; సంబోధనలో ‘బారాకూ’ అయింది.
- source_word: וּשֲׁבֵה
  choice: చెరపట్టుకో
  rationale: శత్రువులను బందీలుగా స్వాధీనం చేసుకోవడాన్ని సూచించే ఆజ్ఞారూపం. సైనిక విజయ భావాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: שֶׁבְיְךָ
  choice: నీ బందీలను
  rationale: ఈ నామవాచకం సమూహంగా బందీలను లేదా చెరను సూచించగలదు. విజయగీత సందర్భంలో ‘నీ బందీలను’ అనేది వ్యక్తులను సూచిస్తూ, మూలంలోని పదపునరుక్తిని తదుపరి క్రియతో కలిసి నిలుపుతుంది.
- source_word: בֶּן אֲבִינֹעַם
  choice: అబీనోయము కుమారుడా
  rationale: వంశపరమైన గుర్తింపును సంబోధన రూపంలో యథాతథంగా నిలిపాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవభరితమైన గీతాత్మక శైలిని అనుసరించాం. నాలుగు ఆజ్ఞల పునరుక్తిని, చిన్న పాదాల లయను, మూలంలోని ‘గీతం పలుకు’ మరియు ‘బందీలను చెరపట్టు’ అనే ఉద్దేశపూర్వక పదప్రయోగాలను నిలిపాం. సాధారణ పాఠకుడికి అర్థం కావడానికి ప్రత్యామ్నాయ భావాలను పాదటిప్పణుల్లో వివరించాం.
