revisions:
- from: పర్వతాలు యాహ్వే[a] సన్నిధిలో ప్రవహించాయి[b]; ఈ సీనాయి యాహ్వే సన్నిధిలో, ఇశ్రాయేలు దేవుని సన్నిధిలో.
  to: ఆ పర్వతాలు యాహ్వే సన్నిధి ఎదుట[a] కారిపోయాయి[b]; ఈ సీనాయి యాహ్వే, ఇశ్రాయేలు దేవుని సన్నిధి ఎదుట.
  rationale: 'The revision restores the Hebrew apposition: “Yahweh, the God of Israel,” rather than treating “God of Israel” as a separate presence phrase. It uses “సన్నిధి ఎదుట” for מִפְּנֵי and retains the poetic ellipsis after “ఈ సీనాయి.” “కారిపోయాయి” preserves the verb’s flowing/dripping imagery without imposing the interpretive rendering “trembled.”'
