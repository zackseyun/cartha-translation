  text: The mountains quaked before Yahweh[a], this Sinai before Yahweh[b], the God of Israel.
translation:
  language: te
  text: ఆ పర్వతాలు యాహ్వే సన్నిధి ఎదుట[a] కారిపోయాయి[b]; ఈ సీనాయి యాహ్వే, ఇశ్రాయేలు దేవుని సన్నిధి ఎదుట.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘యాహ్వే ముఖము/సన్నిధి ఎదుటనుండి.’
    reason: lexical_alternative
  - marker: b
    text: ‘కారిపోయాయి’ అనేది ప్రవహించడం, ధారగా పారడం అనే భావమున్న హీబ్రూ క్రియను అందిస్తుంది; అనేక అనువాదాలు ఈ కావ్యచిత్రాన్ని ‘కరిగిపోయాయి’ అని అర్థం చేసుకుంటాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרִים
  choice: పర్వతాలు
  rationale: నిర్దిష్ట బహువచన రూపాన్ని సహజమైన తెలుగు పదంతో వ్యక్తం చేస్తుంది; సీనాయి దైవప్రత్యక్షత సందర్భానికి ‘పర్వతాలు’ సరిపోతుంది.
- source_word: נָזְלוּ
  choice: ప్రవహించాయి
  rationale: נזל అనే క్రియకు ప్రాథమికంగా కారడం, పారడం, ప్రవహించడం అనే భావం ఉంది. పర్వతాలు ప్రవహించాయనే కావ్యాత్మక చిత్రాన్ని వ్యాఖ్యానాత్మకంగా ‘కరిగిపోయాయి’ లేదా ‘కంపించాయి’ అని మార్చకుండా నిలుపుతుంది.
- source_word: מִפְּנֵי
  choice: సన్నిధిలో
  rationale: అక్షరార్థంగా ‘ముఖము/సన్నిధి ఎదుటనుండి’ అనే హీబ్రూ ప్రయోగాన్ని సహజమైన, గంభీరమైన తెలుగులో ‘సన్నిధిలో’ అని అందిస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగు లిపిలో లిప్యంతరీకరిస్తుంది.
- source_word: זֶה סִינַי
  choice: ఈ సీనాయి
  rationale: హీబ్రూలోని ఆకస్మికమైన కావ్య సూచనను ‘సీనాయి పర్వతం’ అని విస్తరించకుండా యథాతథంగా నిలుపుతుంది.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు దేవుడు
  rationale: యాహ్వేను ఇశ్రాయేలు దేవునిగా గుర్తించే సంబంధాన్ని స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది; వాక్యంలో విభక్తి కారణంగా ‘ఇశ్రాయేలు దేవుని సన్నిధిలో’ అవుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దానిని బిరుదుగా మార్చకుండా ‘యాహ్వే’ అని లిప్యంతరీకరించడం నామ స్వరూపాన్ని కాపాడుతుంది.
- issue: నָזְלוּలోని దైవప్రత్యక్షత కావ్యచిత్రం
  choice: పర్వతాలు ప్రవహించాయి
  alternative: పర్వతాలు కరిగిపోయాయి / కంపించాయి
  rationale: మూల క్రియలోని ప్రవాహ చిత్రాన్ని నిలుపుతూ, అది కరగడమా కంపించడమా అనే వ్యాఖ్యానాన్ని ప్రధాన పాఠ్యంలో బలవంతంగా నిర్ణయించదు.
- issue: ‘ఈ సీనాయి’ అనే కావ్య నిర్మాణం
  choice: క్రియను మళ్లీ చేర్చకుండా అసంపూర్ణ కావ్య నిర్మాణాన్ని నిలుపడం
  alternative: ఈ సీనాయి కూడా ప్రవహించింది
  rationale: మూలంలో זֶה סִינַי తరువాత క్రియ పునరుక్తం కాలేదు. తెలుగు పాఠ్యంలో ఉద్దేశపూర్వక కావ్య విరామంగా ఉంచడం ద్వారా ‘కూడా’ వంటి అదనపు సంబంధపదాన్ని చేర్చకుండా మూలంలోని ఆకస్మికతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కావ్యశైలిని ఉపయోగించాం. ‘ఈ సీనాయి’ తరువాతి సంక్షిప్త, క్రియలేని నిర్మాణం మూల హీబ్రూ కవిత్వంలోని ఆకస్మికతను ఉద్దేశపూర్వకంగా నిలుపుతుంది; అర్థస్పష్టత కోసం అర్ధవిరామం వాడబడింది.
