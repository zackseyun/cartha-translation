translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కవితా ధోరణిని ఉంచి, సామాన్య పాఠకులకు అర్థమయ్యే పదాలు వాడబడ్డాయి. హెబ్రీ కవితలోని సమాంతర పాదాలు, వరుస హింసాత్మక క్రియలు సాధ్యమైనంతవరకు నిలుపబడ్డాయి. ‘మేకు కోసం/సుత్తి కోసం’ అనే నిర్మాణం మూలంలోని לְ ఉపసర్గను ప్రతిబింబిస్తుంది.
