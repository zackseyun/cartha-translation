base_translation:
  language: en
  yaml_path: translation/ot/judges/005/026.yaml
  text: She reached out her hand for the tent peg[a], her right hand for the workmen’s hammer; then she struck Sisera, she shattered his head[c][b], she smashed and pierced his temple.
translation:
  language: te
  text: 'ఆమె తన చేతిని గుడారపు మేకు కోసం చాపింది,

    తన కుడిచేతిని పనివారి సుత్తి కోసం చాపింది[a];

    ఆమె సీసెరాను కొట్టింది,

    అతని తలను పగులగొట్టింది[b];

    అతని కణతను నలిపి ఛేదించింది[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘పనివారి సమ్మెట కోసం.’ హెబ్రీ పదబంధం అరుదైనది; కొట్టే ఈ పనిముట్టును ‘సుత్తి’ లేదా ‘సమ్మెట’ అని అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘అతని తలను నలగగొట్టింది.’ ఇక్కడ హెబ్రీలో వరుసగా వాడిన బలమైన క్రియలు హింసాత్మక చర్యను కవితాత్మకంగా తీవ్రం చేస్తాయి.
    reason: lexical_alternative
  - marker: c
    text: లేదా ‘అతని కణత గుండా దూసుకుపోయింది.’ చివరి హెబ్రీ క్రియ దానిని ఛేదించి గుండా పోవడం అనే భావాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָדָהּ ... וִימִינָהּ
  choice: తన చేతిని ... తన కుడిచేతిని
  rationale: ‘చేయి’ అనే సాధారణ అర్థాన్ని, ‘కుడిచేయి’తో ఉన్న కవితాత్మక సమాంతరతను నిలుపుతుంది.
- source_word: לַיָּתֵד
  choice: గుడారపు మేకు కోసం
  rationale: యాయేలు కథా సందర్భంలో ఇది గుడారాన్ని బిగించే మేకు; ‘గుడారపు’ అని స్పష్టం చేయడం సహజమైన తెలుగులో సూచితార్థాన్ని తెలియజేస్తుంది.
- source_word: תִּשְׁלַחְנָה
  choice: చాపింది
  rationale: చేతిని ముందుకు చాపడం అనే క్రియను సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לְהַלְמוּת עֲמֵלִים
  choice: పనివారి సుత్తి కోసం
  rationale: అరుదైన హెబ్రీ పదబంధంలోని కొట్టే పనిముట్టు అనే భావాన్ని, పనివారితో ఉన్న సంబంధాన్ని నిలుపుతుంది.
- source_word: וְהָלְמָה
  choice: బలంగా కొట్టింది
  rationale: కొట్టడం లేదా మోదడం అనే బలమైన క్రియార్థాన్ని తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: מָחֲקָה רֹאשׁוֹ
  choice: అతని తలను చితకగొట్టింది
  rationale: తలను బలంగా నలిపివేయడం లేదా ధ్వంసం చేయడం అనే హింసాత్మక కవితా చిత్రాన్ని నిలుపుతుంది.
- source_word: וּמָחֲצָה
  choice: పగులగొట్టి
  rationale: వరుసగా వచ్చిన బలమైన క్రియల వైవిధ్యాన్ని నిలుపుతూ, మునుపటి ‘చితకగొట్టింది’తో పూర్తిగా ఒకే పదాన్ని పునరావృతం చేయదు.
- source_word: וְחָלְפָה רַקָּתוֹ
  choice: అతని కణతను ... చీల్చింది
  rationale: కణత గుండా దూసుకుపోవడం లేదా దానిని ఛేదించడం అనే సందర్భార్థాన్ని సహజమైన తెలుగులో అందిస్తుంది; ‘కణత’ తల పక్కభాగాన్ని ఖచ్చితంగా సూచిస్తుంది.
