source:
  edition: WLC
  text: יְהוָ֗ה בְּ/צֵאתְ/ךָ֤ מִ/שֵּׂעִיר֙ בְּ/צַעְדְּ/ךָ֙ מִ/שְּׂדֵ֣ה אֱד֔וֹם אֶ֣רֶץ רָעָ֔שָׁה גַּם שָׁמַ֖יִם נָטָ֑פוּ גַּם עָבִ֖ים נָ֥טְפוּ מָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/004.yaml
  text: O Yahweh[a], when you went out from Seir, when you marched from the field of Edom, the earth trembled; the heavens also dripped[b], the clouds also dripped water.
translation:
  language: te
  text: 'యాహ్వే, నీవు శేయీరు నుండి బయలుదేరినప్పుడు,

    ఎదోము పొలప్రాంతం[a] నుండి అడుగులు వేస్తూ సాగినప్పుడు,

    భూమి కంపించింది[b];

    ఆకాశాలు సైతం చినుకులు రాల్చాయి,

    మేఘాలు సైతం నీటిని రాల్చాయి.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఎదోము దేశం.” హీబ్రూ వాచ్యంగా, “ఎదోము పొలం.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “దేశం వణికింది.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హీబ్రూ దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగులో దాని ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించాం.
- source_word: בְּצֵאתְךָ
  choice: నీవు … బయలుదేరినప్పుడు
  rationale: בְּ + క్రియానామ రూపం ఇక్కడ కాలార్థాన్ని ఇస్తుంది; ద్వితీయ పురుష ఏకవచన సంబోధనను స్పష్టంగా నిలిపాం.
- source_word: מִשֵּׂעִיר
  choice: శేయీరు నుండి
  rationale: స్థలనామాన్ని తెలుగులో లిప్యంతరీకరించి, מן ఉపసర్గను ‘నుండి’గా అనువదించాం.
- source_word: בְּצַעְדְּךָ
  choice: అడుగులు వేస్తూ వచ్చినప్పుడు
  rationale: צעד లోని అడుగులు వేస్తూ ఉద్దేశపూర్వకంగా ముందుకు సాగడం అనే కవితాత్మక చిత్రాన్ని నిలిపి, తెలుగులో సహజంగా వ్యక్తం చేశాం.
- source_word: מִשְּׂדֵה אֱדוֹם
  choice: ఎదోము పొలప్రాంతం నుండి
  rationale: שׂדה యొక్క ‘పొలం/బహిరంగ ప్రాంతం’ అనే మూలచిత్రాన్ని కాపాడుతూ, ఇది ఒక్క సాగుభూమిని మాత్రమే సూచిస్తున్నట్టు కాకుండా ‘పొలప్రాంతం’ అని ఇచ్చాం.
- source_word: אֶרֶץ רָעָשָׁה
  choice: భూమి కంపించింది
  rationale: ఆకాశాలు, మేఘాలతో ఉన్న సమాంతర నిర్మాణంలో אֶרֶץ‌కు విశ్వవ్యాప్త ‘భూమి’ భావం తగినది; רעש సూచించే బలమైన కదలికను ‘కంపించింది’గా ఇచ్చాం.
- source_word: גַּם שָׁמַיִם נָטָפוּ
  choice: ఆకాశాలు సైతం చినుకులు రాల్చాయి
  rationale: గם పునరుక్తిని ‘సైతం’తో, שׁמים బహువచనాన్ని ‘ఆకాశాలు’తో నిలిపాం. נטף లోని బిందువులుగా రాలే చిత్రాన్ని తెలుగులో సహజమైన ‘చినుకులు రాల్చాయి’గా వ్యక్తం చేశాం.
- source_word: גַּם עָבִים נָטְפוּ מָיִם
  choice: మేఘాలు సైతం నీటిని రాల్చాయి
  rationale: మునుపటి పాదంలోని נטף పునరుక్తిని ‘రాల్చాయి’తో కాపాడి, מַיִם అనే స్పష్టమైన కర్మను ‘నీటిని’గా ఉంచాం.
theological_decisions:
- issue: יְהוָה దైవనామాన్ని ఎలా అనువదించాలి
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో ప్రత్యక్షంగా ఉన్న ఒడంబడిక దైవనామాన్ని సాధారణ బిరుదుగా మార్చకుండా, దాని హీబ్రూ ఉచ్చారణకు దగ్గరైన రూపాన్ని వాడాం.
- issue: దైవ ప్రత్యక్షతలో భూమి స్పందన యొక్క పరిధి
  choice: భూమి కంపించింది
  alternative: దేశం వణికింది
  rationale: אֶרֶץ‌కు ‘భూమి’ లేదా ‘దేశం/నేల’ అనే అర్థాలు సాధ్యమే. ఆకాశాలు, మేఘాలతో ఉన్న కవితాత్మక సమాంతరత వల్ల ప్రధాన పాఠంలో ‘భూమి’ని ఎంచుకుని, స్థానిక అర్థసాధ్యతను పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైన కవితా శైలిని వాడాం. హీబ్రూ సమాంతరతను, ‘సైతం’ మరియు ‘రాల్చాయి’ అనే పునరుక్తులను సాధ్యమైనంతగా నిలిపాం; అయితే అర్థం సాధారణ పాఠకులకు వెంటనే గ్రాహ్యమయ్యేలా వాక్యనిర్మాణాన్ని సహజంగా ఉంచాం.
