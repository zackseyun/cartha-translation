  text: מַ֥יִם שָׁאַ֖ל חָלָ֣ב נָתָ֑נָה בְּ/סֵ֥פֶל אַדִּירִ֖ים הִקְרִ֥יבָה חֶמְאָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/025.yaml
  text: He asked for water[a]; she gave milk[b]. In a bowl fit for nobles she brought him curds.
translation:
  language: te
  text: అతడు నీళ్లు అడిగాడు; ఆమె పాలు ఇచ్చింది. ప్రభువుల పాత్రలో అతనికి మీగడ[a] అందించింది.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “పెరుగు గడ్డలు,” “వెన్న,” లేదా “క్రీము”; హీబ్రూ పదం సమృద్ధమైన పాల ఉత్పత్తిని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: “ప్రభువుల పాత్రలో” అని అక్షరార్థం; “ప్రభువుకు తగిన పాత్రలో” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַיִם
  choice: నీళ్లు
  rationale: ఇక్కడ పదానికి సాధారణ అర్థమైన నీరు ఉద్దేశించబడింది; అతడు అడిగినదానికీ యాయేలు ఇచ్చినదానికీ మధ్య వ్యత్యాసం నిలుస్తుంది.
- source_word: שָׁאַל
  choice: అడిగాడు
  rationale: Qal perfect 3ms రూపంలోని ‘అడిగాడు/కోరాడు’ అనే అర్థాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: חָלָב
  choice: పాలు
  rationale: పదం యొక్క సాధారణ అర్థం ‘పాలు’; ఆతిథ్య సందర్భంలోని వ్యత్యాసాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: נָתָנָה
  choice: ఆమె పాలు ఇచ్చింది
  rationale: Qal perfect 3fs యాయేలును సూచిస్తుంది. ఎవరికి ఇచ్చిందో సందర్భంలో స్పష్టంగా ఉన్నందున మొదటి వాక్యంలో పరోక్ష కర్మను చేర్చలేదు.
- source_word: בְּסֵפֶל
  choice: పాత్రలో
  rationale: סֵפֶל గిన్నె లేదా వెడల్పైన పాత్రను సూచిస్తుంది; నిర్దిష్ట ఆకారాన్ని అతిగా నిర్ణయించకుండా ‘పాత్ర’ సహజంగా ఉంటుంది.
- source_word: אַדִּירִים
  choice: ప్రభువుల
  rationale: అక్షరార్థమైన ‘ప్రభువుల/గొప్పవారి’ అనే బహువచన సంబంధాన్ని నిలుపుతుంది; దానిని ‘ప్రభువులకు తగిన’ అని అర్థవిస్తరణ చేయకుండా అసలు భాషలోని సంక్షిప్తతను కాపాడుతుంది.
- source_word: הִקְרִיבָה
  choice: అందించింది
  rationale: Hiphil రూపం ‘దగ్గరకు తెచ్చింది’ అనే మూలభావాన్ని కలిగి ఉంది; ఆతిథ్య సందర్భంలో ‘అందించింది’ సహజంగా ఉండి, బలియర్పణ సంబంధమైన అపార్థాన్ని నివారిస్తుంది.
- source_word: חֶמְאָה
  choice: మీగడ
  rationale: ఈ పదం పెరుగు గడ్డలు, వెన్న, లేదా చిక్కని పాల ఉత్పత్తిని సూచించవచ్చు. తెలుగులో ‘మీగడ’ దాని సమృద్ధమైన పాల పదార్థ భావాన్ని సహజంగా అందిస్తుంది; ఇతర సాధ్యార్థాలు పాదసూచికలో నిలుపబడ్డాయి.
