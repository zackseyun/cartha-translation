source:
  edition: WLC
  text: שִׁמְע֣וּ מְלָכִ֔ים הַאֲזִ֖ינוּ רֹֽזְנִ֑ים אָֽנֹכִ֗י לַֽ/יהוָה֙ אָנֹכִ֣י אָשִׁ֔ירָה אֲזַמֵּ֕ר לַֽ/יהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/003.yaml
  text: Hear[a], O kings; give ear, O rulers. I, to Yahweh[b], I will sing; I will make music to Yahweh, the God of Israel.
translation:
  language: te
  text: రాజులారా, వినండి[a]; పాలకులారా, చెవియొగ్గండి. నేను యెహోవాకు పాడుతాను; ఇశ్రాయేలు దేవుడైన యెహోవాకు సంగీతం చేస్తాను[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో “వినండి,” “చెవియొగ్గండి” అనే సమీపార్థక ఆజ్ఞలు కవితాత్మక ఉద్ఘాటన కోసం సమాంతరంగా వాడబడ్డాయి.
    reason: lexical_alternative
  - marker: b
    text: “యెహోవాకు స్తుతిగానం చేస్తాను” అని కూడా అనువదించవచ్చు. హీబ్రూలో “పాడుతాను,” “సంగీతం చేస్తాను” అనే సంబంధితమైనా భిన్నమైన రెండు క్రియలు ఉన్నాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ
  choice: వినండి
  rationale: శׁמע క్రియ యొక్క బహువచన ఆజ్ఞారూపం; రాజులకు చేసిన గంభీరమైన కవితాత్మక పిలుపును సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: מְלָכִים
  choice: రాజులారా
  rationale: రాజకీయ రాజులను సూచించే ప్రత్యక్ష బహువచన సంబోధన.
- source_word: הַאֲזִינוּ
  choice: చెవియొగ్గండి
  rationale: שׁמעకు సమీపార్థకమైనా శ్రద్ధగా ఆలకించమనే మరింత సజీవమైన భావాన్ని కలిగిస్తుంది; కవితాత్మక సమాంతరతను నిలుపుతుంది.
- source_word: רֹזְנִים
  choice: పాలకులారా
  rationale: ఉన్నత అధికారులను లేదా పరిపాలకులను సూచిస్తుంది; ఆధునిక పాఠకులకు స్పష్టమైన పదం.
- source_word: אָנֹכִי ... אָנֹכִי
  choice: నేను—యెహోవాకే నేను
  rationale: స్వతంత్ర సర్వనామం రెండుసార్లు రావడం వల్ల కలిగే వ్యక్తిగత నిశ్చయాన్నీ కవితాత్మక ఉద్ఘాటననూ పునరుక్తితో కాపాడుతుంది.
- source_word: לַיהוָה
  choice: యెహోవాకే / యెహోవాకు
  rationale: ל ఉపసర్గ గానం ఎవరిని ఉద్దేశించిందో, ఎవరికి అంకితమైందో తెలియజేస్తుంది; మొదటి సందర్భంలోని ‘కే’ మూలంలోని ఉద్ఘాటనను సహజ తెలుగులో బలపరుస్తుంది.
- source_word: יהוה
  choice: యెహోవా
  rationale: దైవనామమైన יהוהను సాధారణ బిరుదుగా మార్చకుండా వ్యక్తినామంగా తెలుగులో సుపరిచితమైన రూపంలో ప్రతిబింబిస్తుంది.
- source_word: אָשִׁירָה
  choice: పాడుతాను
  rationale: సందర్భంలో ఉన్న సంకల్పాత్మక భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: אֲזַמֵּר
  choice: సంగీతం చేస్తాను
  rationale: ముందున్న ‘పాడుతాను’తో పూర్తిగా కలిపివేయకుండా, זמרలోని సంగీతం చేయడం లేదా స్తుతిగానం చేయడం అనే భావాన్ని నిలుపుతుంది.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు దేవుడు
  rationale: యెహోవాను ఇశ్రాయేలు దేవునిగా గుర్తించే నిర్మాణాన్ని పారదర్శకంగా అందిస్తుంది.
theological_decisions:
- issue: దైవనామం יהוה అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు / యాహ్వే
  rationale: మూలపాఠం దైవనామాన్ని ప్రత్యక్షంగా ఉపయోగిస్తుంది. దానిని బిరుదుతో భర్తీ చేయకుండా నామరూపంగా ఉంచాం; ‘యెహోవా’ ఆధునిక తెలుగు బైబిలు వాడుకలో విస్తృతంగా గుర్తించదగిన రూపం.
- issue: אָנֹכִי ... אָנֹכִי అనే పునరుక్తి
  choice: నేను—యెహోవాకే నేను పాడుతాను
  alternative: నేను యెహోవాకు పాడుతాను
  rationale: పునరుక్తిని తొలగిస్తే దెబోరా స్వయంఘోషణలోని ఉద్ఘాటన తగ్గుతుంది; అందువల్ల తెలుగులో కొద్దిగా గుర్తించదగిన కవితాత్మక నిర్మాణంతో దానిని నిలిపాం.
- issue: זמר యొక్క భావపరిధి
  choice: సంగీతం చేస్తాను
  alternative: స్తుతిగానం చేస్తాను
  rationale: ఈ క్రియ సంగీతం చేయడం, పాడడం, స్తుతించడం అనే పరస్పర సంబంధిత భావాలను కలిగి ఉంటుంది. ‘స్తుతిగానం’ అని పెడితే ప్రశంస భావాన్ని స్పష్టీకరిస్తుంది గాని మూలంలోని విస్తృతతను కుదిస్తుంది; ‘సంగీతం చేస్తాను’ రెండు క్రియల భేదాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కవితాత్మక సంబోధనను ఉంచాం. ‘చెవియొగ్గండి’ కొద్దిగా ఉన్నత శైలిలో ఉన్నప్పటికీ సులభంగా అర్థమవుతుంది; మూలంలోని సమాంతరతను కాపాడుతుంది. ‘నేను’ పునరుక్తిని ఉద్దేశపూర్వకంగా నిలిపాం.
