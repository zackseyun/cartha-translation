id: JDG.5.22
reference: Judges 5:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אָ֥ז הָלְמ֖וּ עִקְּבֵי ס֑וּס מִֽ/דַּהֲר֖וֹת דַּהֲר֥וֹת אַבִּירָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/022.yaml
  text: Then the horses’ hoofs pounded from the galloping[a], the galloping of his mighty steeds.
translation:
  language: te
  text: అప్పుడు అతని బలవంతుల దౌడు, దౌడు వల్ల గుర్రాల డెక్కలు బలంగా మోగాయి[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతని బలమైన గుర్రాల దౌడు”; లేదా, “అతని శక్తిమంతులైన యోధుల దౌడు.” హీబ్రూ పదబంధం బలమైన గుర్రాలనో, వాటితో సంబంధమున్న యోధులనో సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: אָז
  choice: అప్పుడు
  rationale: గీతంలోని తదుపరి ఉత్కంఠభరిత దృశ్యాన్ని సూచించే సహజమైన కాలసూచక పదం.
- source_word: הָלְמוּ
  choice: దద్దరిల్లాయి
  rationale: బలంగా తాకే డెక్కల శబ్దాన్నీ, కదలిక తీవ్రతనూ ఆధునిక తెలుగు కవితాత్మకంగా వ్యక్తం చేస్తుంది.
- source_word: עִקְּבֵי סוּס
  choice: గుర్రాల డెక్కలు
  rationale: עִקְּבֵי అక్షరార్థంగా మడమలు కావచ్చుగాని, గుర్రాల సందర్భంలో డెక్కలను సూచిస్తుంది; ఏకవచన סוּס ఇక్కడ సమూహార్థకం.
- source_word: מִדַּהֲרוֹת דַּהֲרוֹת
  choice: దౌడు, దౌడు వల్ల
  rationale: מִן కారణాన్ని సూచిస్తుంది; ఒకే పదం పునరుక్తిని నిలుపుతూ వేగం, తీవ్రతలను వ్యక్తం చేస్తుంది.
- source_word: אַבִּירָיו
  choice: వారి బలవంతులు
  rationale: ఈ పదం బలమైన గుర్రాలనో వాటితో సంబంధమున్న యోధులనో సూచించవచ్చు. 'బలవంతులు' మూలంలోని ఉద్దేశపూర్వక అస్పష్టతను నిలుపుతుంది; తెలుగు సహజత్వం కోసం సందర్భంలోని శత్రు దళాన్ని సూచించే బహువచన సంబంధరూపం వాడబడింది.
theological_decisions:
- issue: אַבִּירָיו లోని బలవంతులు ఎవరు?
  choice: గుర్రాలా యోధులా అని నిర్ధారించకుండా 'బలవంతులు' అని ఉంచడం
  alternative: బలమైన గుర్రాలు / మగ గుర్రాలు; శక్తిమంతులైన యోధులు
  rationale: కవితాత్మక సందర్భం రెండు భావాలనూ అనుమతిస్తుంది. అనువాదం వాటిలో ఒకదాన్ని సిద్ధాంతపూర్వకంగా నిర్ణయించకూడదు.
- issue: మూడవ పురుష ఏకవచన స్వామ్యప్రత్యయ అనువాదం
  choice: వారి
  alternative: అతని
  rationale: హీబ్రూలో అక్షరార్థంగా 'అతని' ఉన్నప్పటికీ, తెలుగులో గుర్రాలు లేదా యోధులు అనే ద్వంద్వసూచనను నిలుపుతూ సందర్భంలోని శత్రు దళానికి సహజంగా అన్వయించేందుకు 'వారి' వాడబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గీతానికి తగిన శబ్దాత్మక ఉత్సాహంతో అనువదించబడింది. హీబ్రూ పునరుక్తి నిలుపబడింది; సందిగ్ధమైన సూచనను ప్రధాన పాఠంలో పరిష్కరించకుండా పాదటిప్పణిలో వివరించాం.
