id: JDG.5.23
reference: Judges 5:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: א֣וֹרוּ מֵר֗וֹז אָמַר֙ מַלְאַ֣ךְ יְהוָ֔ה אֹ֥רוּ אָר֖וֹר יֹשְׁבֶ֑י/הָ כִּ֤י לֹֽא בָ֨אוּ֙ לְ/עֶזְרַ֣ת יְהוָ֔ה לְ/עֶזְרַ֥ת יְהוָ֖ה בַּ/גִּבּוֹרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/023.yaml
  text: Curse Meroz[a], said the angel of Yahweh; curse, utterly curse its inhabitants, because they did not come to the help of Yahweh[b], to the help of Yahweh against the mighty.
translation:
  language: te
  text: “మేరోజును శపించండి!” అని యెహోవా దూత[a] అన్నాడు. “దాని నివాసులను తీవ్రంగా శపించండి! ఎందుకంటే వారు యెహోవాకు సహాయం చేయడానికి రాలేదు; పరాక్రమవంతులకు ఎదురుగా యెహోవాకు సహాయం చేయడానికి రాలేదు.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యెహోవా సందేశవాహకుడు.”
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ చివరి మాటలను “పరాక్రమవంతుల మధ్య” లేదా “పరాక్రమవంతులతో కలిసి” అని కూడా అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: א֣וֹרוּ / אֹ֥רוּ אָר֖וֹר
  choice: శపించండి / తీవ్రంగా శపించండి
  rationale: ארר యొక్క ఆజ్ఞార్థక రూపం బలమైన శాపోక్తిని సూచిస్తుంది. రెండో చోట ఆజ్ఞార్థక క్రియతో కూడిన infinitive absolute తీవ్రతను పెంచుతుంది; అందుకే సహజమైన ఆధునిక తెలుగులో ‘తీవ్రంగా శపించండి’ అని అనువదించాం.
- source_word: מֵר֗וֹז
  choice: మేరోజు
  rationale: ఇది బహుశా ఒక స్థల నామం; మూలపాఠం ఇచ్చిన పేరునే తెలుగు లిప్యంతరీకరణలో ఉంచాం.
- source_word: מַלְאַ֣ךְ יְהוָ֔ה
  choice: యెహోవా దూత
  rationale: מַלְאָךְ అనే పదానికి ‘దూత’ లేదా ‘దేవదూత’ అనే భావాలు ఉండవచ్చు. ‘దూత’ అనే పదం ఆ వ్యక్తి స్వరూపాన్ని ముందుగానే నిర్ణయించకుండా మూలంలోని సందిగ్ధతను కాపాడుతుంది.
- source_word: יֹשְׁבֶ֑יהָ
  choice: దాని నివాసులు
  rationale: స్త్రీలింగ ఏకవచన ప్రత్యయం మేరోజును సూచిస్తుంది; ఈ సమూహార్థక భావాన్ని సహజంగా ‘దాని నివాసులు’ అని ఇచ్చాం.
- source_word: כִּ֤י לֹֽא בָ֨אוּ֙
  choice: ఎందుకంటే వారు ... రాలేదు
  rationale: כִּי ఇక్కడ శాపానికి కారణాన్ని పరిచయం చేస్తుంది; ‘ఎందుకంటే’ దాని కారణార్థాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: לְעֶזְרַ֣ת יְהוָ֔ה
  choice: యెహోవాకు సహాయం చేయడానికి
  rationale: హీబ్రూ నామవాచక నిర్మాణాన్ని తెలుగులో యథాతథంగా అనుకరించడం అసహజంగా ఉంటుంది. ఈ ఎంపిక గమనార్థక לְ మరియు ‘సహాయం’ అనే భావాన్ని సహజంగా వ్యక్తం చేస్తూ పునరుక్తిని నిలుపుతుంది.
- source_word: בַּגִּבּוֹרִֽים
  choice: పరాక్రమవంతులకు ఎదురుగా
  rationale: בְּ + גִּבּוֹרִים నిర్మాణం సందర్భంలో క్లిష్టమైనది. యుద్ధ సందర్భంలో ‘ఎదురుగా’ అనేది సముచితమైన పఠనం; అయితే ‘పరాక్రమవంతుల మధ్య’ లేదా ‘పరాక్రమవంతులతో కలిసి’ అనే అర్థాలూ సాధ్యమని పాదటిప్పణిలో నిలిపాం.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో ఒడంబడిక నామం నేరుగా ఉంది. తెలుగులో విస్తృతంగా గుర్తించదగిన ‘యెహోవా’ రూపాన్ని వాడి, దానిని ‘ప్రభువు’గా ప్రత్యామ్నాయపరచలేదు.
- issue: מַלְאַךְ יְהוָה యొక్క స్వరూపం
  choice: యెహోవా దూత
  alternative: యెహోవా దేవదూత
  rationale: ‘దూత’ అనేది సందేశవాహకుడు లేదా దేవదూత అనే రెండు అవకాశాలనూ తెరిచి ఉంచుతుంది; ఈ వ్యక్తి స్వరూపంపై విస్తృతమైన వేదాంత వివాదాన్ని అనువాదం పరిష్కరించదు.
- issue: בַּגִּבּוֹרִים యొక్క సంబంధార్థం
  choice: పరాక్రమవంతులకు ఎదురుగా
  alternative: పరాక్రమవంతుల మధ్య / పరాక్రమవంతులతో కలిసి
  rationale: పాటలోని యుద్ధ సందర్భం ప్రతిపక్షార్థాన్ని బలపరుస్తుంది. అయినప్పటికీ హీబ్రూ ఉపసర్గకు ఉన్న నిజమైన వ్యాకరణ సందిగ్ధతను పాదటిప్పణిలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కావ్యంలోని గంభీరమైన శాపోక్తి, సమాంతర పునరుక్తి నిలిపాం. సాధారణ పాఠకులకు సహజంగా ఉండేందుకు హీబ్రూ నామవాచక పదబంధాన్ని క్రియాత్మక తెలుగులో ఇచ్చాం. పాదటిప్పణి సూచిక [a] ప్రధాన పాఠ్యంలో ఉంది.
