  text: When leaders took the lead in Israel, when the people volunteered, bless the LORD!
translation:
  language: te
  text: ఇశ్రాయేలులో నాయకులు ముందుండి నడిపించినప్పుడు[a], ప్రజలు స్వచ్ఛందంగా ముందుకు వచ్చినప్పుడు, యెహోవాను స్తుతించండి!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఈ హీబ్రూ పదబంధం అర్థం అనిశ్చితం. దీనిని “ఇశ్రాయేలులో జుట్టు విప్పబడినప్పుడు” అని కూడా అనువదించవచ్చు; అది యుద్ధానికి అంకితమైన యోధులను సూచించి ఉండవచ్చు.
    reason: అరుదైన בִּפְרֹעַ פְּרָעוֹת పదబంధంలోని భాషాపరమైన సందిగ్ధతను పాఠకునికి తెలియజేయడానికి.
lexical_decisions:
- source_word: בִּפְרֹעַ פְּרָעוֹת
  choice: నాయకులు నాయకత్వం వహించినప్పుడు
  rationale: ఈ అరుదైన హీబ్రూ పదబంధానికి అర్థం వివాదాస్పదమైనప్పటికీ, పాట సందర్భంలో ప్రజలను నడిపించిన నాయకులను సూచించే సాంప్రదాయిక భావం సహజంగా సరిపోతుంది; మూలంలోని పదపునరుక్తి ఛాయను తెలుగు పదబంధంలో కొంత నిలిపాం.
- source_word: בְּהִתְנַדֵּב עָם
  choice: ప్రజలు స్వచ్ఛందంగా ముందుకు వచ్చినప్పుడు
  rationale: התנדב అనే క్రియ స్వచ్ఛందంగా తనను తాను అర్పించుకోవడం లేదా సేవకు ముందుకు రావడం అనే భావాన్ని ఇస్తుంది.
- source_word: בָּרֲכוּ
  choice: స్తుతించండి
  rationale: దేవుని ఉద్దేశించి వాడిన ברך ఇక్కడ ‘దీవించండి’ అనే అక్షరార్థం కంటే ‘స్తుతించండి’ అనే సహజ తెలుగు భావాన్ని కలిగిస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: మూలపాఠంలోని వ్యక్తిగత దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో ప్రసిద్ధమైన రూపంలో ఉంచాం.
theological_decisions:
- issue: దైవనామం יהוה యొక్క అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: ఇక్కడ మూల హీబ్రూ పాఠం సాధారణ బిరుదు కాకుండా దేవుని ప్రత్యేక నామాన్ని వాడుతుంది; అందువల్ల ఆ భేదాన్ని పాఠ్యంలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గీతాత్మక గంభీరతను కాపాడుతూ సాధారణ పాఠకులకు స్పష్టంగా రూపొందించాం. రెండు ‘when’ ఉపవాక్యాల సమాంతర నిర్మాణాన్ని నిలిపి, చివరి స్తుతి పిలుపుకు ఉత్సాహభరిత స్వరం ఇచ్చాం.
