  text: כֵּ֠ן יֹאבְד֤וּ כָל אוֹיְבֶ֨י/ךָ֙ יְהוָ֔ה וְ/אֹ֣הֲבָ֔י/ו כְּ/צֵ֥את הַ/שֶּׁ֖מֶשׁ בִּ/גְבֻרָת֑/וֹ וַ/תִּשְׁקֹ֥ט הָ/אָ֖רֶץ אַרְבָּעִ֥ים שָׁנָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/031.yaml
  text: So may all your enemies perish[a], O Yahweh, but may those who love him be like the rising of the sun in its strength[b]. And the land had rest forty years.
translation:
  language: te
  text: '“యాహ్వే, నీ శత్రువులందరూ ఇలాగే నశించిపోవాలి!

    అయితే ఆయనను ప్రేమించేవారు సూర్యుడు తన బలంతో ఉదయించినట్లు ఉండాలి.[a]”


    దేశంలో నలభై సంవత్సరాలు శాంతి నెలకొంది.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “ఆయనను ప్రేమించేవారు సూర్యుడు తన బలంతో బయలుదేరినట్లు [ఉండాలి].”
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా “దేశం ప్రశాంతంగా ఉంది”; న్యాయాధిపతులు గ్రంథంలో ఈ మాట యుద్ధం తర్వాత వచ్చిన శాంతి లేదా విశ్రాంతి కాలాన్ని సాధారణంగా సూచిస్తుంది.
    reason: cross_reference
lexical_decisions:
- source_word: כֵּן
  choice: ఇలాగే
  rationale: ముందటి గీతంలో వర్ణించిన పరాజయాన్ని ఆధారంగా చేసుకొని వచ్చే ముగింపు ఆకాంక్షను సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: יֹאבְדוּ
  choice: నశించిపోవాలి
  rationale: ఇక్కడి అసంపూర్ణ క్రియకు ఆకాంక్ష లేదా శాపవాక్య బలం ఉంది; ‘నశించిపోవాలి’ ఆ భావాన్ని విధానాన్ని అతిగా నిర్దిష్టం చేయకుండా వ్యక్తం చేస్తుంది.
- source_word: כָל אוֹיְבֶיךָ
  choice: నీ శత్రువులందరూ
  rationale: ద్వితీయ పురుష ఏకవచన ప్రత్యయాన్ని, సమగ్రతను నేరుగా నిలుపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హీబ్రూ దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో ధ్వన్యంతరీకరించింది.
- source_word: וְאֹהֲבָיו
  choice: అయితే ఆయనను ప్రేమించేవారు
  rationale: శత్రువులతో ఉన్న వ్యత్యాసాన్ని చూపుతూ, హీబ్రూలో ప్రత్యక్ష సంబోధన నుంచి మూడవ పురుష సూచనకు జరిగే మార్పును నిలుపుతుంది.
- source_word: כְּצֵאת הַשֶּׁמֶשׁ
  choice: సూర్యుడు ... ఉదయించినట్లు
  rationale: సూర్యుడు బయటికి రావడం అనే హీబ్రూ చిత్రాన్ని సహజమైన ఆధునిక తెలుగులో ‘ఉదయించడం’గా వ్యక్తం చేస్తుంది.
- source_word: בִּגְבֻרָתוֹ
  choice: తన బలంతో
  rationale: సూర్యుని శక్తిమంతమైన ప్రకాశాన్ని సూచించే రూపకాన్ని నిలుపుతుంది; ప్రత్యయం సూర్యునికే చెందుతుందని తెలుగులో స్పష్టంగా ఉంటుంది.
- source_word: וַתִּשְׁקֹט הָאָרֶץ
  choice: ఆ దేశం ... విశ్రాంతి పొందింది
  rationale: న్యాయాధిపతులు గ్రంథంలో యుద్ధం తర్వాత ఏర్పడిన శాంతికాలాన్ని సూచించే సూత్రప్రాయ ప్రయోగాన్ని సహజంగా అందిస్తుంది.
- source_word: אַרְבָּעִים שָׁנָה
  choice: నలభై సంవత్సరాలు
  rationale: కాలవ్యవధిని నేరుగా అనువదిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమే ఉన్నందున దాన్ని బిరుదుగా మార్చకుండా ధ్వన్యంతరీకరించడం జరిగింది.
- issue: וְאֹהֲבָיו లోని మూడవ పురుష ప్రత్యయ సూచన
  choice: ఆయనను ప్రేమించేవారు
  alternative: నిన్ను ప్రేమించేవారు
  rationale: హీబ్రూ వాక్యం ‘నీ శత్రువులు’ అనే ప్రత్యక్ష సంబోధన నుంచి ‘ఆయనను ప్రేమించేవారు’ అనే మూడవ పురుష రూపానికి మారుతుంది; ఆ నిజమైన వ్యాకరణ ఉద్వేగాన్ని సవరించకుండా నిలిపింది.
- issue: రెండవ పాదంలోని ఆకాంక్షార్థం
  choice: ఉండాలి
  alternative: ఉంటారు
  rationale: మొదటి పాదంలోని ఆకాంక్షార్థ క్రియ రెండవ పాదానికీ భావపరంగా వర్తిస్తుందని తీసుకొని సమాంతరతను తెలుగులో స్పష్టం చేసింది; హీబ్రూలో రెండవ పాదానికి ప్రత్యేక క్రియ లేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గీత ముగింపులోని కవితాత్మక ఆకాంక్షను మొదటి భాగంలో పాద విభజనతో ఉంచి, చివరి కథన వాక్యాన్ని వేరుగా ఇచ్చింది. భాష గంభీరంగా ఉన్నప్పటికీ సాధారణ పాఠకులకు సులభంగా ఉండేలా రూపొందించబడింది.
