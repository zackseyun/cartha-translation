  edition: WLC
  text: וַ/תָּ֣שַׁר דְּבוֹרָ֔ה וּ/בָרָ֖ק בֶּן אֲבִינֹ֑עַם בַּ/יּ֥וֹם הַ/ה֖וּא לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/001.yaml
  text: 'Then Deborah and Barak son of Abinoam sang on that day[a], saying:'
translation:
  language: te
  text: ఆ రోజున దెబోరా, అబీనోయాము కుమారుడైన బారాకు ఇలా పాడారు:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూలో క్రియ ఏకవచనంలో ఉంది: ‘దెబోరా పాడింది’; దాని తరువాత ‘మరియు బారాకు’ చేర్చబడ్డాడు. సందర్భం ప్రకారం దెబోరా, బారాకు కలిసి పాడారు.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּשַׁר
  choice: పాడారు
  rationale: שׁיר అంటే ‘పాడుట’. హీబ్రూలో స్త్రీలింగ ఏకవచన క్రియ మొదట పేర్కొన్న దెబోరాతో సరిపోతుంది; తరువాత బారాకు కూడా కర్తగా చేర్చబడ్డాడు. ఆధునిక తెలుగులో ఉమ్మడి కర్తకు బహువచన గౌరవార్థక రూపమైన ‘పాడారు’ సహజంగా ఉంటుంది.
- source_word: דְּבוֹרָה
  choice: దెబోరా
  rationale: వ్యక్తి పేరుకు తెలుగులో సాధారణంగా ఉపయోగించే లిప్యంతరీకరణ.
- source_word: וּבָרָק
  choice: బారాకు
  rationale: సంయోజకార్థం తెలుగులో విరామచిహ్నం మరియు ఉమ్మడి కర్త నిర్మాణం ద్వారా వ్యక్తమవుతుంది; పేరును సాధారణ తెలుగు రూపంలో ఇచ్చాం.
- source_word: בֶּן אֲבִינֹעַם
  choice: అబీనోయము కుమారుడైన
  rationale: హీబ్రూ వంశసూచక నిర్మాణాన్ని సహజమైన తెలుగు విశేషణబంధంగా అనువదించాం.
- source_word: בַּיּוֹם הַהוּא
  choice: ఆ రోజున
  rationale: నిర్దిష్టమైన విజయదినాన్ని సూచించే కాలబంధం; హీబ్రూ ఉపసర్గ భావాన్ని ‘రోజున’ నిలుపుతుంది.
- source_word: לֵאמֹר
  choice: ఇలా
  rationale: తరువాత వచ్చే గీతాన్ని పరిచయం చేసే హీబ్రూ ఉక్తిసూచక పదానికి సహజమైన తెలుగు రూపం; ద్విబిందువుతో ఆ పరిచయార్థం స్పష్టమవుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని కాలసూచనను ముందుంచి, గీతం ప్రారంభమవుతుందని ద్విబిందువుతో తెలిపాం. పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో ఉంచబడింది.
