translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కవితా శైలిని ఉపయోగించాం. రెండు పాదాల్లోని ఆశీర్వాద ప్రకటన పునరుక్తిని నిలిపాం; హీబ్రూ పోలికలోని ‘లో/కంటే’ సందిగ్ధతను పాదటిప్పణిలో సంరక్షించాం.
