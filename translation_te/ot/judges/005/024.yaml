source:
  edition: WLC
  text: תְּבֹרַךְ֙ מִ/נָּשִׁ֔ים יָעֵ֕ל אֵ֖שֶׁת חֶ֣בֶר הַ/קֵּינִ֑י מִ/נָּשִׁ֥ים בָּ/אֹ֖הֶל תְּבֹרָֽךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/024.yaml
  text: Most blessed among women is Jael[a], the wife of Heber the Kenite; among women in the tent[b], most blessed is she.
translation:
  language: te
  text: స్త్రీలలో యాయేలు[a] అత్యంత ధన్యురాలు—కేనీయుడైన హెబెరు భార్య; గుడారంలోని స్త్రీలలో[b] ఆమె అత్యంత ధన్యురాలు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘స్త్రీలకంటే యాయేలు ధన్యురాలు … గుడారంలోని స్త్రీలకంటే ఆమె ధన్యురాలు.’ హీబ్రూలోని పోలిక నిర్మాణాన్ని ‘స్త్రీలలో’ లేదా ‘స్త్రీలకంటే’ అని అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: పదశః, ‘గుడారంలో.’ ఇది గుడార జీవనంతో సంబంధమున్న స్త్రీలను సూచించవచ్చు; అయితే హీబ్రూలో ‘గుడారం’ ఏకవచనంలో ఉంది.
    reason: cultural_note
lexical_decisions:
- source_word: תְּבֹרַךְ
  choice: అత్యంత ధన్యురాలు
  rationale: ברך ధాతువు యొక్క పుయల్ రూపం ఆశీర్వదించబడిన లేదా ప్రశంసించబడిన స్థితిని సూచిస్తుంది. מִן‌తో కూడిన పోలిక నిర్మాణంలో ఇది శ్రేష్ఠతను వ్యక్తం చేస్తుంది; అందువల్ల కవితాత్మక బలాన్ని నిలుపుతూ ‘అత్యంత ధన్యురాలు’ అని అనువదించాం.
- source_word: מִנָּשִׁים
  choice: స్త్రీలందరిలో
  rationale: מִן ఇక్కడ పోలికను సూచించి ‘స్త్రీలలో’ లేదా ‘స్త్రీలకంటే’ అనే రెండు భావాలకు అవకాశం ఇస్తుంది. సహజమైన తెలుగులో శ్రేష్ఠత భావాన్ని తెలిపేందుకు ‘స్త్రీలందరిలో’ ఎంచుకున్నాం; ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: יָעֵל
  choice: యాయేలు
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగులో ప్రాచుర్యంలో ఉన్న బైబిలు రూపానికి దగ్గరగా లిప్యంతరీకరించాం.
- source_word: אֵשֶׁת חֶבֶר הַקֵּינִי
  choice: కేనీయుడైన హెబెరు భార్య
  rationale: యాయేలును ఆమె భర్తతోను అతని వంశసంబంధ గుర్తింపుతోను పరిచయం చేసే హీబ్రూ సమాస నిర్మాణాన్ని స్పష్టమైన ఆధునిక తెలుగులో నిలిపాం.
- source_word: בָּאֹהֶל
  choice: గుడారంలో ఉండే స్త్రీలలో
  rationale: పదశః ‘గుడారంలో’ అనే ఏకవచన రూపమే ఉన్నా, వాక్యంలో ‘స్త్రీలు’తో దాని సంబంధాన్ని తెలుగులో సహజంగా తెలియజేయడానికి ‘గుడారంలో ఉండే స్త్రీలలో’ అని ఇచ్చాం. పదశః రూపాన్ని పాదటిప్పణిలో తెలియజేశాం.
- source_word: תְּבֹרָךְ
  choice: ఆమె అత్యంత ధన్యురాలు
  rationale: మొదటి క్రియను పునరావృతం చేసే హీబ్రూ కవితా సమాంతరతను, చివరలో యాయేలుపై పడే ఉద్ఘాటనను నిలిపేందుకు ఇదే భావాన్ని మళ్లీ వ్యక్తం చేశాం.
