  register: ఆధునిక ప్రామాణిక తెలుగులో, కవితాత్మక గద్దింపు ధోరణిని మరియు హృదయ పరిశీలన అనే మూల రూపకాన్ని నిలిపిన అనువాదం. పశుపోషణ నేపథ్యం సాధారణ పాఠకుడికి స్పష్టంగా ఉండేలా ‘ఈల పిలుపులు’ అని వాడబడింది.
