revisions:
- from: మందల కోసం చేసే ఈల పిలుపులను వినడానికి, నీవెందుకు గొర్రెల దొడ్ల మధ్య కూర్చున్నావు? రూబేను విభాగాలవారి మధ్య గొప్ప హృదయ పరిశీలనలు జరిగాయి.[a]
  to: మందల కోసం ఊదే ఈలలను వినడానికి, నీవెందుకు గొర్రెల దొడ్ల మధ్య కూర్చున్నావు? రూబేను విభాగాల్లో[a] హృదయాల్లో గొప్ప పరిశీలనలు జరిగాయి.
  rationale: The revision removes the unsupported “వారి” (“people of”) and anchors the lexical-alternative note directly to “విభాగాల్లో.” It also smooths the pastoral expression and word order in modern standard Telugu while preserving the Hebrew’s poetic image and its inward-deliberation metaphor. The footnote retains the disputed watercourse sense without presenting it as certain.
  reviewer_model: gpt-5.6-terra
