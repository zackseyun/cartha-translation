  yaml_path: translation/ot/judges/005/016.yaml
  text: Why did you sit among the sheepfolds[a], to hear the whistling for the flocks? For the divisions of Reuben there were great searchings of heart.
translation:
  language: te
  text: మందల కోసం ఊదే ఈలలను వినడానికి, నీవెందుకు గొర్రెల దొడ్ల మధ్య కూర్చున్నావు? రూబేను విభాగాల్లో[a] హృదయాల్లో గొప్ప పరిశీలనలు జరిగాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “రూబేను ప్రవాహాల వద్ద హృదయాల్లో గొప్ప పరిశీలనలు జరిగాయి.” ఇక్కడి హీబ్రూ పదానికి “విభాగాలు” లేదా “కాలువలు/ప్రవాహాలు” అనే అర్థాలు ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָּה
  choice: ఎందుకు
  rationale: రూబేను యుద్ధంలో పాల్గొనకుండా ఉండిపోయిన కారణాన్ని ప్రశ్నించే ప్రత్యక్ష ప్రశ్నను సహజంగా తెలియజేస్తుంది.
- source_word: יָשַׁבְתָּ
  choice: కూర్చున్నావు
  rationale: మూలంలోని కూర్చోవడం/నిలిచిపోవడం అనే స్పష్టమైన దృశ్యాన్ని, గద్దింపు ధోరణిని నిలుపుతుంది.
- source_word: בֵּין הַמִּשְׁפְּתַיִם
  choice: గొర్రెల దొడ్ల మధ్య
  rationale: తరువాత వచ్చే మందల ప్రస్తావనకు సరిపోయే సంప్రదాయ పశుపోషణార్థాన్ని తీసుకుంటూ, בֵּין అనే ‘మధ్య’ భావాన్ని కాపాడుతుంది.
- source_word: לִשְׁמֹעַ
  choice: వినడానికి
  rationale: ఉద్దేశాన్ని సూచించే హీబ్రూ క్రియారూపాన్ని నేరుగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: שְׁרִקוֹת עֲדָרִים
  choice: మందల కోసం చేసే ఈల పిలుపులు
  rationale: ఇది మందలను పిలిచే కాపరుల ఈలలని సందర్భానుసారంగా స్పష్టం చేస్తూనే శబ్దచిత్రాన్ని నిలుపుతుంది.
- source_word: לִפְלַגּוֹת רְאוּבֵן
  choice: రూబేను విభాగాలవారి మధ్య
  rationale: పదానికి ఉన్న ‘విభాగాలు’ అనే సాధ్యమైన అర్థాన్ని తీసుకొని, రూబేను గోత్రంలోని సమూహాలను సహజ తెలుగులో సూచిస్తుంది; ‘కాలువలు/ప్రవాహాలు’ అనే నిజమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచింది.
- source_word: גְּדוֹלִים חִקְרֵי לֵב
  choice: గొప్ప హృదయ పరిశీలనలు
  rationale: అంతరంగపు లోతైన తర్జనభర్జన లేదా ఆత్మపరిశీలనను తెలిపే కవితాత్మక రూపకాన్ని అతిగా వివరణాత్మకం చేయకుండా నిలుపుతుంది.
