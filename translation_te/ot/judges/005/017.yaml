source:
  edition: WLC
  text: גִּלְעָ֗ד בְּ/עֵ֤בֶר הַ/יַּרְדֵּן֙ שָׁכֵ֔ן וְ/דָ֕ן לָ֥/מָּה יָג֖וּר אֳנִיּ֑וֹת אָשֵׁ֗ר יָשַׁב֙ לְ/ח֣וֹף יַמִּ֔ים וְ/עַ֥ל מִפְרָצָ֖י/ו יִשְׁכּֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/017.yaml
  text: Gilead stayed beyond the Jordan[b][a]; and Dan—why did he sojourn by the ships? Asher sat by the seashore and stayed by his harbors.
translation:
  language: te
  text: 'గిలాదు యొర్దాను అవతల ఉండిపోయింది;


    దాను ఓడల దగ్గర ఎందుకు నివసించాడు?[a]


    ఆషేరు సముద్రతీరాన కూర్చున్నాడు;


    తన రేవుల దగ్గర నివసించాడు.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దాను ఓడల దగ్గర ఎందుకు పరదేశిగా నివసించాడు?” హీబ్రూ క్రియకు ‘నివసించు,’ ‘పరదేశిగా నివసించు’ అనే అర్థాలు ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “తన అఖాతాల దగ్గర.” హీబ్రూ పదం చీలికలు లేదా తెరుచుకున్న ప్రదేశాలను సూచిస్తుంది; ఈ తీరప్రాంత సందర్భంలో అది రేవులు లేదా అఖాతాలు కావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: גִּלְעָד
  choice: గిలాదు
  rationale: హీబ్రూ భూభాగం/గోత్ర సమూహాన్ని నేరుగా పేరుతో సూచిస్తుంది; ‘గిలాదీయులు’ అని విస్తరించకుండా పేరునే ఉంచాం.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: యొర్దాను అవతలే
  rationale: వక్త దృష్టికోణం నుంచి యొర్దాను నదికి ఆవలి వైపును సూచించే సహజమైన తెలుగు భౌగోళిక ప్రయోగం; ‘ఏ’ వల్ల అక్కడే నిలిచిపోయిన భావానికి కవితాత్మక ఉద్ఘాటన వస్తుంది.
- source_word: שָׁכֵן
  choice: ఉండిపోయింది
  rationale: నివసించడం, అక్కడే ఉండడం అనే అర్థాలను కలిపి, యుద్ధంలో చేరకుండా మిగిలిపోయినట్లు పాటలోని మందలింపు స్వరాన్ని వ్యక్తం చేస్తుంది.
- source_word: וְדָן
  choice: దాను
  rationale: గోత్రనామాన్ని ప్రామాణిక తెలుగు రూపంలో ఇచ్చాం.
- source_word: לָמָּה
  choice: ఎందుకు
  rationale: మందలింపుతో కూడిన ప్రత్యక్ష అలంకారప్రశ్నను యథాతథంగా నిలిపాం.
- source_word: יָגוּר
  choice: ఉండిపోయాడు
  rationale: גור అనే క్రియకు నివసించడం లేదా పరదేశిగా/తాత్కాలికంగా ఉండడం అనే పరిధి ఉంది. సందర్భంలోని నిందార్థాన్ని సహజంగా చూపుతూ, ప్రత్యేక నుడికారాన్ని పాదటిప్పణిలో నిలిపాం.
- source_word: אֳנִיּוֹת
  choice: ఓడలు
  rationale: సముద్రయాన నౌకలను సూచించే బహువచనానికి సాధారణ ఆధునిక తెలుగు పదం.
- source_word: אָשֵׁר
  choice: ఆషేరు
  rationale: గోత్రనామాన్ని ప్రామాణిక తెలుగు రూపంలో ఇచ్చాం.
- source_word: יָשַׁב
  choice: కూర్చున్నాడు
  rationale: కూర్చోవడం/నివసించడం అనే క్రియలోని స్పష్టమైన కవితా చిత్రాన్ని, నిర్వ్యాపారతపై ఉన్న మందలింపును నిలిపింది.
- source_word: לְחוֹף יַמִּים
  choice: సముద్రతీరాన
  rationale: అక్షరార్థంలోని ‘సముద్రాల తీరం’ అనే భావాన్ని సందర్భానుసారంగా సహజమైన ఏకవచన తెలుగు రూపంలో తెలిపాం.
- source_word: מִפְרָצָיו
  choice: తన రేవులు
  rationale: మూలపదం చీలికలు, ప్రవేశమార్గాలు లేదా అఖాతాలను సూచించగలదు; తీరప్రాంత సందర్భంలో ‘రేవులు’ సహజమైన ప్రధాన అనువాదం.
- source_word: יִשְׁכּוֹן
  choice: నివసించాడు
  rationale: స్థిరంగా ఉండడం/నివసించడం అనే అర్థాన్ని ఇస్తూ, మొదటి పాదంలోని సమాన క్రియతో భావసామ్యాన్ని కాపాడుతుంది.
