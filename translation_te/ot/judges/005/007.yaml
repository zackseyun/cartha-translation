source:
  edition: WLC
  text: חָדְל֧וּ פְרָז֛וֹן בְּ/יִשְׂרָאֵ֖ל חָדֵ֑לּוּ עַ֤ד שַׁ/קַּ֨מְתִּי֙ דְּבוֹרָ֔ה שַׁ/קַּ֥מְתִּי אֵ֖ם בְּ/יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/007.yaml
  text: Village life ceased in Israel; it ceased until I[a], Deborah, arose—until I arose as a mother in Israel.
translation:
  language: te
  text: ఇశ్రాయేలులో పల్లె జీవనం నిలిచిపోయింది; నేను, దెబోరా, లేచే వరకు అది నిలిచిపోయింది—ఇశ్రాయేలులో ఒక తల్లిగా నేను లేచే వరకు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఇశ్రాయేలులో పల్లెవాసులు అంతరించిపోయారు,” లేదా “ఇశ్రాయేలులో గ్రామీణ జనాభా లేకపోయింది.” ఇక్కడి హీబ్రూ నామవాచకానికి అర్థనిర్ణయం కష్టం; అది గ్రామవాసులను గానీ, సాధారణ పల్లె జీవనాన్ని గానీ సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָדְלוּ / חָדֵלּוּ
  choice: నిలిచిపోయింది
  rationale: חדל క్రియ యొక్క పునరుక్తి ఏదో కొనసాగకుండా ఆగిపోయిన స్థితిని సూచిస్తుంది. ‘నిలిచిపోయింది’ ఆధునిక తెలుగులో సహజంగా ఉండి, గీతంలోని పునరుక్తిని నిలుపుతుంది.
- source_word: פְרָזוֹן
  choice: పల్లె జీవనం
  rationale: అర్థనిర్ణయం కష్టమైన ఈ నామవాచకం గోడలు లేని గ్రామాల్లో నివసించే ప్రజలను గానీ, అక్కడి సాధారణ జీవనాన్ని గానీ సూచించవచ్చు. ప్రధాన పాఠంలో ‘పల్లె జీవనం’ సామాజిక వ్యవస్థ కూలిపోయిన భావాన్ని సహజంగా వ్యక్తం చేస్తుంది; ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: בְּיִשְׂרָאֵל
  choice: ఇశ్రాయేలులో
  rationale: ב ఇక్కడ స్థలార్థకంగా ఉంది. ‘ఇశ్రాయేలులో’ దేశసమాజపు సందర్భానికి సహజమైన రూపం.
- source_word: עַד
  choice: వరకు
  rationale: ముందున్న సంక్షోభ స్థితి దెబోరా లేచిన దాకా కొనసాగిందనే మలుపును సూచిస్తుంది.
- source_word: שַׁקַּמְתִּי
  choice: నేను లేచే వరకు
  rationale: קום ఇక్కడ చర్యకు ముందుకు రావడాన్ని సూచిస్తుంది. ‘లేచే వరకు’ కవితాత్మక గంభీరతను, ప్రథమ పురుష ఉద్ఘాటనను నిలుపుతుంది.
- source_word: דְּבוֹרָה
  choice: దెబోరా
  rationale: తెలుగులో ప్రాచుర్యంలో ఉన్న బైబిలు నామరూపాన్ని ఉపయోగించాం.
- source_word: אֵם
  choice: ఒక తల్లిగా
  rationale: ఈ పదం దెబోరా ఇశ్రాయేలు మధ్య పోషణాత్మకమైన, రక్షణాత్మకమైన నాయకత్వంతో ముందుకు రావడాన్ని రూపకంగా సూచిస్తుంది. ‘ఒక తల్లిగా’ అనే రూపం ‘ఇశ్రాయేలుకు తల్లి’ అని మూలాన్ని మించి బలపరచదు.
theological_decisions:
- issue: దెబోరా తనను אֵם בְּיִשְׂרָאֵל అని వర్ణించుకోవడంలోని రూపకార్థం
  choice: ‘ఇశ్రాయేలులో ఒక తల్లిగా’ అని అనువదించి, ఇశ్రాయేలు సమాజంలో ఆమె రక్షణాత్మకమైన, పోషణాత్మకమైన నాయకత్వాన్ని సూచించే రూపకాన్ని నిలిపాం.
  alternative: ‘ఇశ్రాయేలుకు తల్లిగా’ లేదా ఎలాంటి రూపకసూచన లేకుండా అక్షరార్థ మాతృత్వంగా చదవడం.
  rationale: హీబ్రూ పాఠంలో ‘ఇశ్రాయేలులో తల్లి’ అని ఉంది, ‘ఇశ్రాయేలుకు తల్లి’ అని కాదు. అందువల్ల సంబంధాన్ని అతిగా బిరుదుగా మార్చకుండా, మూలంలోని భావవిస్తృతిని నిలుపుతున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కవితా శైలిని ఉపయోగించాం. మూలంలోని ‘నిలిచిపోయింది’ మరియు ‘నేను లేచే వరకు’ అనే పునరుక్తులను నిలిపాం. פְרָזוֹן లోని నిజమైన పదార్థ అనిశ్చితిని పాదటిప్పణిలో స్పష్టంగా ఉంచాం.
