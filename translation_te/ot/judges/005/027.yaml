translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కవితా శైలిని వాడుతూ, హీబ్రూలోని చిన్న క్రియల పునరుక్తి, క్రమం, స్థలచిత్రం నిలుపబడ్డాయి. విరామచిహ్నాలు మూడు కవితా భాగాల తీవ్రతను స్పష్టపరుస్తాయి.
