base_translation:
  language: en
  yaml_path: translation/ot/judges/005/027.yaml
  text: Between her feet he sank[a], he fell, he lay; between her feet he sank, he fell; where he sank[c][b], there he fell—destroyed.
translation:
  language: te
  text: ఆమె పాదాల మధ్య అతడు కూలాడు[a], పడిపోయాడు, పడి ఉన్నాడు; ఆమె పాదాల మధ్య అతడు కూలాడు, పడిపోయాడు; ఎక్కడ కూలాడో, అక్కడే పడిపోయాడు—నాశనమై.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆమె పాదాల దగ్గర అతడు కూలాడు.’ అక్షరార్థంగా, ‘ఆమె పాదాల మధ్య.’
    reason: lexical_alternative
  - marker: b
    text: ‘నాశనమై’ అనే మాటను ‘హతుడై’ లేదా ‘పూర్తిగా ఓడిపోయినవాడై’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּין רַגְלֶיהָ
  choice: ఆమె పాదాల మధ్య
  rationale: హీబ్రూ పదబంధంలోని స్పష్టమైన స్థలచిత్రాన్నీ, పద్యంలోని పునరుక్తినీ నిలుపుతుంది. సహజ తెలుగు ప్రయోగంగా ‘ఆమె పాదాల దగ్గర’ అనవచ్చు, కాని అది మూలంలోని ‘మధ్య’ అనే భావాన్ని బలహీనపరుస్తుంది.
- source_word: כָּרַע
  choice: కూలాడు
  rationale: ఈ మరణదృశ్యంలో మోకాళ్లు వంగి కిందికి కూలిపోవడాన్ని సహజంగా తెలియజేస్తుంది; ‘వంగాడు’ స్వచ్ఛంద చర్యగా, ‘మోకరించాడు’ ఉద్దేశపూర్వక భంగిమగా వినిపించవచ్చు.
- source_word: נָפַל
  choice: పడిపోయాడు
  rationale: נפל‌కు సాధారణ సమానార్థకం. పద్యలయాన్నీ తీవ్రతనూ నిలుపడానికి రెండుసార్లూ మార్పు లేకుండా వాడబడింది.
- source_word: שָׁכָב
  choice: పడి ఉన్నాడు
  rationale: చిన్న క్రియల వరుసలో అతడు నేలపై నిశ్చలంగా ఉన్న స్థితిని సహజ ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: בַּאֲשֶׁר
  choice: ఎక్కడ ... ఓ
  rationale: స్థలాన్ని సూచించే సంబంధార్థాన్ని తెలుగులో సంక్షిప్తంగా, సహజంగా అందిస్తుంది.
- source_word: שָׁם
  choice: అక్కడే
  rationale: చివరి పాదంలోని స్థల ఉద్ఘాటనను ‘ఏ’ ద్వారా బలంగా నిలుపుతుంది.
- source_word: שָׁדוּד
  choice: హతుడై
  rationale: దోచబడిన, నాశనమైన, పూర్తిగా కూల్చివేయబడిన స్థితిని సూచించే ఈ రూపం, సీసెరా మరణ సందర్భంలో హింసాత్మకంగా సంహరించబడిన ఫలితాన్ని సహజంగా తెలియజేస్తుంది; మూలపదంలోని విస్తృత ‘నాశనమైన’ భావానికి ప్రత్యామ్నాయం పాదటిప్పణిలో ఉంచబడింది.
