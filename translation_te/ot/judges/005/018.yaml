  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: זְבֻל֗וּן עַ֣ם חֵרֵ֥ף נַפְשׁ֛/וֹ לָ/מ֖וּת וְ/נַפְתָּלִ֑י עַ֖ל מְרוֹמֵ֥י שָׂדֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/018.yaml
  text: Zebulun was a people that risked its life to the death[a], and Naphtali also[b], on the heights of the field.
translation:
  language: te
  text: జెబూలూను మరణం వరకు తన ప్రాణాన్ని తృణీకరించిన ప్రజ; నఫ్తాలి కూడా బహిరంగ మైదానపు[a] ఎత్తైన ప్రదేశాలపై అలాగే చేసింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “బహిరంగ మైదానం” అనే హీబ్రూ పదానికి “పొలం” లేదా “పల్లెప్రాంతం” అనే అర్థాలు కూడా ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: זְבֻלוּן
  choice: జెబూలూను
  rationale: గోత్రనామాన్ని ఆధునిక తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: עַם
  choice: ప్రజ
  rationale: జెబూలూను గోత్రాన్ని సమష్టిగా సూచించే ఏకవచన నామవాచక భావాన్ని నిలుపుతుంది.
- source_word: חֵרֵף נַפְשׁוֹ
  choice: తన ప్రాణాన్ని లెక్కచేయని
  rationale: חרףలోని తృణీకరణ లేదా పట్టించుకోకపోవడం అనే భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; యుద్ధంలో ప్రాణాన్ని పణంగా పెట్టడం సందర్భార్థం.
- source_word: לָמוּת
  choice: మరణం వరకు
  rationale: స్వప్రాణాన్ని లెక్కచేయకపోవడం ఎంతవరకు సాగిందో, అంటే మరణం దాకా అనే హీబ్రూ విస్తృతి భావాన్ని కాపాడుతుంది.
- source_word: וְנַפְתָּלִי
  choice: నఫ్తాలి కూడా ... అలాగే చేశాడు
  rationale: క్రియను పునరుక్తి చేయని హీబ్రూ సమాంతర నిర్మాణాన్ని తెలుగులో స్పష్టంగా, సహజంగా పూర్తిచేస్తుంది.
- source_word: עַל מְרוֹמֵי שָׂדֶה
  choice: పొలంలోని ఎత్తైన ప్రదేశాల్లో
  rationale: ఎత్తైన బహిరంగ భూభాగం అనే స్థలచిత్రాన్ని నిలుపుతుంది; దీనిని ప్రత్యేకంగా ‘యుద్ధభూమి’గా వ్యాఖ్యానించదు.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గీతాత్మక సమాంతరతను కాపాడుతూ సాధారణ పాఠకులకు సహజంగా ఉండేలా రూపొందించబడింది. ‘తన ప్రాణాన్ని లెక్కచేయని’ అనే ప్రయోగం మూలంలోని తృణీకరణ భావాన్నీ, సందర్భంలోని ప్రాణసాహసాన్నీ కలిపి వ్యక్తం చేస్తుంది.
