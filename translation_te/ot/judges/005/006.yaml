source:
  edition: WLC
  text: בִּ/ימֵ֞י שַׁמְגַּ֤ר בֶּן עֲנָת֙ בִּ/ימֵ֣י יָעֵ֔ל חָדְל֖וּ אֳרָח֑וֹת וְ/הֹלְכֵ֣י נְתִיב֔וֹת יֵלְכ֕וּ אֳרָח֖וֹת עֲקַלְקַלּֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/006.yaml
  text: In the days of Shamgar son of Anath[a], in the days of Jael, the highways were deserted[b], and travelers went by roundabout paths.
translation:
  language: te
  text: అనాతు కుమారుడైన షమ్గరు కాలంలో, యాయేలు కాలంలో, ప్రధాన మార్గాలు నిర్జనమయ్యాయి[a]; బాటసారులు మెలికలు తిరిగిన దారుల్లో వెళ్లేవారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: పదశః, “మార్గాలు నిలిచిపోయాయి”—అంటే ప్రధాన మార్గాల్లో సాధారణ రాకపోకలు ఆగిపోయాయి.
    reason: lexical_alternative
  - marker: b
    text: “మెలికలు తిరిగిన దారులు” అనేది నైతిక వక్రతను కాదు; భద్రత కోసం ఎంచుకున్న పరోక్షమైన పక్కదారులను సూచిస్తుండవచ్చు.
    reason: cultural_note
lexical_decisions:
- source_word: בִּימֵי
  choice: కాలంలో
  rationale: పేరుల ద్వారా సూచించబడిన కాలాన్ని తెలిపే హీబ్రూ కాలవాచక నుడికారానికి సహజమైన ఆధునిక తెలుగు సమానం.
- source_word: שַׁמְגַּר בֶּן־עֲנָת
  choice: అనాతు కుమారుడైన షమ్గరు
  rationale: వ్యక్తి పేర్లను తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించి, בֶּן అనే బంధసూచక పదాన్ని స్పష్టంగా ‘కుమారుడైన’ అని అనువదించింది.
- source_word: יָעֵל
  choice: యాయేలు
  rationale: హీబ్రూ వ్యక్తి పేరుకు స్థిరపడిన తెలుగు లిప్యంతరీకరణను ఉపయోగించింది.
- source_word: חָדְלוּ אֳרָחוֹת
  choice: ప్రధాన మార్గాలు నిర్జనమయ్యాయి
  rationale: పదశః ‘మార్గాలు నిలిచిపోయాయి’ అనే భావం సాధారణ రాకపోకలు ఆగి మార్గాలు వాడుకలో లేకపోవడాన్ని సూచిస్తుంది; తెలుగు ప్రధాన వాక్యంలో దాని ఫలితాన్ని సహజంగా వ్యక్తం చేసింది, పదశః రూపాన్ని పాదసూచికలో నిలిపింది.
- source_word: הֹלְכֵי נְתִיבוֹת
  choice: బాటసారులు
  rationale: పదశః ‘బాటల్లో నడిచేవారు’; సందర్భంలో ప్రయాణించే వారిని సూచించేందువల్ల ‘బాటసారులు’ సంక్షిప్తంగా, సహజంగా ఉంది.
- source_word: יֵלְכוּ
  choice: వెళ్లేవారు
  rationale: గీతాత్మక గతకాల సందర్భంలో ఈ అసంపూర్ణ క్రియ అలవాటుగా లేదా పదేపదే జరిగిన చర్యను సూచిస్తుంది; ‘వెళ్లేవారు’ ఆ భావాన్ని తెలుగులో నిలుపుతుంది.
- source_word: אֳרָחוֹת עֲקַלְקַלּוֹת
  choice: మెలికలు తిరిగిన దారుల్లో
  rationale: עֲקַלְקַלּוֹת అంటే వంకరగా, మెలికలు తిరిగినది; ప్రధాన మార్గాలను తప్పించుకొని పరోక్ష దారుల్లో ప్రయాణించిన దృశ్యాన్ని ఈ రూపం సహజంగా నిలుపుతుంది.
