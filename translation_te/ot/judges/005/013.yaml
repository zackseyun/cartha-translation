source:
  edition: WLC
  text: אָ֚ז יְרַ֣ד שָׂרִ֔יד לְ/אַדִּירִ֖ים עָ֑ם יְהוָ֕ה יְרַד לִ֖/י בַּ/גִּבּוֹרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/013.yaml
  text: Then the remnant came down against the nobles[b][a]; the people of Yahweh came down for me against the mighty.
translation:
  language: te
  text: 'అప్పుడు మిగిలినవారు శక్తిమంతులపైకి దిగివచ్చారు[a];

    యాహ్వే ప్రజలు నా కోసం[b] పరాక్రమవంతులపైకి దిగివచ్చారు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అప్పుడు బతికి మిగిలిన ఒకడు శక్తిమంతుల దగ్గరికి దిగివచ్చాడు.” ఈ హెబ్రీ కవితా పాదం అర్థం చేసుకోవడం కష్టం; ఇక్కడి ఉపసర్గలను విరోధార్థంలో కాకుండా “దగ్గరికి,” “కొరకు,” లేదా “తో” అనే అర్థాల్లో కూడా చదవవచ్చు.
    reason: alternative_reading
  - marker: b
    text: హెబ్రీలో “నా కోసం.” ఇది బహుశా దెబోరా తనను తాను కవితాత్మకంగా సూచించుకోవడం.
    reason: cultural_note
lexical_decisions:
- source_word: אָז
  choice: అప్పుడు
  rationale: గీతంలోని తదుపరి పరిణామాన్ని సూచించే కాలవాచక అవ్యయానికి సహజమైన, సంక్షిప్తమైన అనువాదం.
- source_word: יְרַד / יְרַד
  choice: దిగివచ్చారు / దిగివచ్చారు
  rationale: ירד అనే క్రియకు ఉన్న ‘దిగడం’ అనే ప్రాథమిక భావాన్ని, రెండు పాదాల్లోని పునరుక్తిని నిలిపి ఉంచుతుంది. సమూహాలను సూచిస్తున్నందున తెలుగులో బహువచన క్రియ సహజంగా ఉంది.
- source_word: שָׂרִיד
  choice: మిగిలినవారు
  rationale: యుద్ధం నుంచి మిగిలిన వ్యక్తిని లేదా మిగిలిన సమూహాన్ని ఈ పదం సూచించగలదు. ఇక్కడ సమూహార్థాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; ఏకవచన పఠనాన్ని పాదసూచికలో ఉంచాం.
- source_word: לְאַדִּירִים
  choice: ప్రముఖుల మీదికి
  rationale: אַדִּירִים శక్తిమంతులు, ఘనులు లేదా ప్రముఖులను సూచిస్తుంది. యుద్ధ సందర్భంలో לְకు విరోధార్థం తీసుకున్నాం; అయితే ఇతర సంబంధార్థాలు సాధ్యమని పాదసూచిక తెలియజేస్తుంది.
- source_word: עָם יְהוָה
  choice: యాహ్వే ప్రజలు
  rationale: ప్రజలు యాహ్వేకు చెందినవారనే నిబంధనాత్మక సంబంధాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగు లిపిలో ధ్వన్యంతరీకరించింది.
- source_word: לִי
  choice: నా కోసం
  rationale: మొదటి పురుష ఏకవచన ప్రత్యయాన్ని నేరుగా నిలిపి ఉంచుతుంది; ఇది బహుశా దెబోరా తనను తాను కవితాత్మకంగా సూచించుకోవడం.
- source_word: בַּגִּבּוֹרִים
  choice: పరాక్రమవంతుల మీదికి
  rationale: גִּבּוֹרִים బలశాలులు లేదా యోధులను సూచిస్తుంది. యుద్ధ సందర్భం వల్ల בְּకు విరోధార్థాన్ని తీసుకున్నాం; ‘పరాక్రమవంతులు’ అనే పదం విస్తృత భావపరిధిని కాపాడుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమే ఉంది. అందువల్ల దానిని బిరుదుగా మార్చకుండా తెలుగు లిపిలో ధ్వన్యంతరీకరించాం.
- issue: రెండు పాదాల్లోని ఉపసర్గల వాక్యనిర్మాణ బలం
  choice: 'విరోధార్థం: ‘ప్రముఖుల మీదికి’ / ‘పరాక్రమవంతుల మీదికి’'
  alternative: ‘ప్రముఖుల దగ్గరికి/కొరకు’; ‘పరాక్రమవంతులతో/మధ్య’
  rationale: విజయగీతపు యుద్ధ సందర్భం విరోధార్థానికి మద్దతిస్తుంది. అయినా హెబ్రీ కవితా పాదం క్లిష్టమైనది; ఉపసర్గలకు విరోధేతర అర్థాలూ సాధ్యమేనని పాదసూచికలో స్పష్టంగా ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన గీతశైలిని ఉంచాం. మూలంలోని రెండు పాదాల సమాంతర నిర్మాణాన్ని, ‘దిగివచ్చారు’ అనే క్రియ పునరుక్తిని కాపాడాం. క్లిష్టమైన హెబ్రీ వాక్యనిర్మాణాన్ని ప్రధాన పాఠంలో ఒక సాధ్యమైన యుద్ధార్థంతో ఇచ్చి, నిజమైన సందిగ్ధతను పాదసూచికలో నిలిపాం.
