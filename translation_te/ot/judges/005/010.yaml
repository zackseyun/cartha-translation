  rationale: The revision removes an unstated object from the imperative, adopts “తివాచీలు” as the most natural main-text equivalent for the uncertain seating/covering term, and refines the footnote on שִׂיחוּ to reflect the immediate poetic summons. The vocative parallelism, female-donkey detail, and formal poetic register are retained.
