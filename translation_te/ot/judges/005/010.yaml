source:
  edition: WLC
  text: רֹכְבֵי֩ אֲתֹנ֨וֹת צְחֹר֜וֹת יֹשְׁבֵ֧י עַל מִדִּ֛ין וְ/הֹלְכֵ֥י עַל דֶּ֖רֶךְ שִֽׂיחוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/010.yaml
  text: You who ride on white donkeys[a], you who sit on carpets[b], and you who walk on the road—speak!
translation:
  language: te
  text: 'తెల్లని ఆడగాడిదలపై స్వారీ చేసేవారలారా,


    తివాచీలపై కూర్చునేవారలారా,[a]


    దారిలో నడిచేవారలారా—


    మాట్లాడండి![b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “జీనుపరుపులపై” లేదా “పరుపులపై” అని కూడా అనువదించవచ్చు; ఇక్కడి హీబ్రూ పదం అరుదైనది, దాని అర్థం అనిశ్చితం.
    reason: lexical_alternative
  - marker: b
    text: “చెప్పండి” లేదా “వివరంగా చెప్పండి” అని కూడా అనువదించవచ్చు; హీబ్రూ క్రియకు మాట్లాడడం లేదా వివరించి చెప్పడం అనే భావాలు ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹכְבֵי
  choice: స్వారీ చేసేవారలారా
  rationale: కర్తరి వర్తమాన క్రియార్థక రూపం ఇక్కడ సంబోధనగా పనిచేస్తోంది; తెలుగు కవితా సందర్భంలో ప్రత్యక్ష పిలుపును సహజంగా నిలుపుతుంది.
- source_word: אֲתֹנוֹת
  choice: ఆడగాడిదలు
  rationale: హీబ్రూ నామవాచకం ప్రత్యేకంగా ఆడ గాడిదలను సూచిస్తుంది; మూలంలోని స్పష్టతను తెలుగులో సహజంగా నిలిపాము.
- source_word: צְחֹרוֹת
  choice: తెల్లని
  rationale: ఈ విశేషణానికి తెలుపు లేదా ప్రకాశవంతమైన రంగు ప్రధాన భావం; ఇక్కడ ‘తెల్లని’ అత్యంత సూటి అర్థం.
- source_word: יֹשְׁבֵי
  choice: కూర్చునేవారలారా
  rationale: సమాంతర సంబోధనాత్మక క్రియార్థక రూపం; తరువాతి పదం కూర్చునే వస్తువును సూచించే అవకాశమున్నందున ‘కూర్చునేవారు’ అనుకూలం.
- source_word: מִדִּין
  choice: పరుపులు
  rationale: అరుదైన, అర్థం అనిశ్చితమైన పదం. ప్రయాణం మరియు గౌరవస్థానపు చిత్రణలో పరచే వస్త్రాలు, జీనుపరుపులు లేదా తివాచీలు అనే భావం సంభావ్యం; ప్రధాన పాఠ్యంలో విస్తృతమైన ‘పరుపులు’ వాడి అనిశ్చితిని పాదటిప్పణిలో తెలిపాము.
- source_word: וְהֹלְכֵי
  choice: నడిచేవారలారా
  rationale: మూడవ సంబోధనాత్మక క్రియార్థక రూపం; ప్రయాణికుల concrete చిత్రాన్ని ‘నడిచేవారు’ నిలుపుతుంది.
- source_word: דֶּרֶךְ
  choice: దారి
  rationale: ప్రయాణ సందర్భంలో సాధారణమైన, సహజమైన ఆధునిక తెలుగు పదం.
- source_word: שִׂיחוּ
  choice: దీనిని గూర్చి చెప్పండి
  rationale: ఈ బహువచన ఆజ్ఞారూపానికి మాట్లాడడం, వివరించడం, జ్ఞాపకం చేసుకోవడం వంటి భావవిస్తృతి ఉంది. విజయగీత సందర్భంలో కార్యాలను ప్రకటించడం లేదా వివరించడం ఉద్దేశమై ఉండవచ్చు; ‘చెప్పండి’ సహజంగా ఉండగా, ‘దీనిని గూర్చి’ సందర్భసూచనను స్పష్టం చేస్తుంది. ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాము.
