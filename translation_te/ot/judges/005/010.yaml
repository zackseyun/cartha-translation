translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కవితా సంబోధనను నిలిపేందుకు ‘వారలారా’ రూపాన్ని ఉపయోగించాము. మూడు సమాంతర సంబోధనలను పాదాలుగా అమర్చి హీబ్రూ కవితా నిర్మాణాన్ని ప్రతిబింబించాము. అరుదైన מִדִּין పదానికి అతిగా నిర్దిష్టత ఇవ్వకుండా ప్రధాన పాఠ్యంలో ‘పరుపులు’ అని, ప్రత్యామ్నాయాలను పాదటిప్పణిలో ఇచ్చాము.
