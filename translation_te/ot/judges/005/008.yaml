  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: יִבְחַר֙ אֱלֹהִ֣ים חֲדָשִׁ֔ים אָ֖ז לָחֶ֣ם שְׁעָרִ֑ים מָגֵ֤ן אִם יֵֽרָאֶה֙ וָ/רֹ֔מַח בְּ/אַרְבָּעִ֥ים אֶ֖לֶף בְּ/יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/008.yaml
  text: They chose new gods[a]; then war was at the gates[b]. Was a shield or spear to be seen among forty thousand in Israel?
translation:
  language: te
  text: వారు కొత్త దేవుళ్లను ఎంచుకున్నారు[a]; అప్పుడు ద్వారాల వద్ద యుద్ధం చెలరేగింది[b]. ఇశ్రాయేలులో నలభై వేల మందిలో ఒక డాలుగానీ ఈటెగానీ కనిపించిందా?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, ‘అతడు/ఒకడు కొత్త దేవుళ్లను ఎంచుకున్నాడు.’ హీబ్రూ క్రియ ఏకవచనంలో ఉంది; అయితే సందర్భంలో సాధారణంగా ఇది ఇశ్రాయేలు ప్రజలను సమష్టిగా సూచిస్తుందని గ్రహిస్తారు.
    reason: alternative_reading
  - marker: b
    text: ఈ పాదంలోని హీబ్రూ భావం నిర్ధారించడం కష్టం. ‘అప్పుడు ద్వారాల వద్ద పోరాటం జరిగింది’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִבְחַר
  choice: వారు ఎంచుకున్నారు
  rationale: క్రియ రూపం ఏకవచనంలో ఉన్నప్పటికీ, సందర్భంలో కర్తను ఇశ్రాయేలు ప్రజల సమష్టిగా లేదా అనిర్దిష్ట మానవ కర్తగా గ్రహించడం సహజం. రూప సంబంధమైన అస్పష్టతను పాదటిప్పణిలో నిలిపాం.
- source_word: אֱלֹהִים חֲדָשִׁים
  choice: కొత్త దేవుళ్లను
  rationale: ఇక్కడ ఇది ఇశ్రాయేలు దేవుని గురించి కాక, కొత్తగా స్వీకరించిన అన్య దేవతలను సూచిస్తుంది.
- source_word: אָז
  choice: అప్పుడు
  rationale: ముందున్న చర్యకు తరువాత వచ్చిన సంక్షోభాన్ని కలిపే కాలసూచక అవ్యయం.
- source_word: לָחֶם שְׁעָרִים
  choice: పట్టణ ద్వారాల దగ్గర యుద్ధం చెలరేగింది
  rationale: హీబ్రూ పదబంధం సంక్షిప్తంగాను కఠినంగాను ఉంది. לָחֶם ను ‘యుద్ధం/పోరాటం’ అనే నామవాచక భావంలో తీసుకొని, שְׁעָרִים ను పట్టణ ద్వారాలుగా స్పష్టం చేశాం.
- source_word: מָגֵן
  choice: డాలు
  rationale: సాధారణ రక్షణాయుధాన్ని సూచించే సహజమైన ఆధునిక తెలుగు పదం.
- source_word: אִם יֵרָאֶה
  choice: కనిపించిందా?
  rationale: ఆయుధాలు లేవనే భావాన్ని వ్యక్తం చేసే అలంకారిక ప్రశ్నగా సహజమైన తెలుగులో అనువదించాం.
- source_word: וָרֹמַח
  choice: ఈటెగానీ
  rationale: רֹמַח కు స్పష్టమైన, సాధారణ తెలుగు సమానార్థకం ‘ఈటె’; ‘గానీ...గానీ’ నిర్మాణం ప్రశ్నలోని ప్రత్యామ్నాయ ఆయుధాలను సహజంగా కలుపుతుంది.
- source_word: בְּאַרְבָּעִים אֶלֶף
  choice: నలభై వేల మందిలో
  rationale: בְּ ఇక్కడ ఆ జనసమూహం మధ్య అనే భావాన్ని ఇస్తుంది.
- source_word: בְּיִשְׂרָאֵל
  choice: ఇశ్రాయేలులోని
  rationale: నలభై వేల మంది ఇశ్రాయేలు సమాజానికి చెందినవారని సహజ తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: ప్రారంభ క్రియకు కర్త
  choice: ఇశ్రాయేలు ప్రజలను సమష్టిగా సూచిస్తూ ‘వారు కొత్త దేవుళ్లను ఎంచుకున్నారు’
  alternative: ‘అతడు/ఒకడు కొత్త దేవుళ్లను ఎంచుకున్నాడు’; లేదా ‘దేవుడు కొత్తవాటిని ఎంచుకున్నాడు’
  rationale: సందర్భం ఇశ్రాయేలు విశ్వాసభ్రష్టతను, దాని తరువాతి అణచివేతను వర్ణిస్తుంది. ‘దేవుడు కొత్త దేవుళ్లను ఎంచుకున్నాడు’ అనే పఠనం సందర్భానికీ వాక్యంలోని బహువచన కర్మకూ అసహజం. అయితే హీబ్రూ క్రియ ఏకవచన రూపాన్ని పాదటిప్పణిలో వెల్లడించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గీతాత్మక గంభీరతను నిలుపుతూ సామాన్య పాఠకులకు స్పష్టంగా అనువదించాం. ‘పట్టణ’ అనే పదం మూలంలో ప్రత్యక్షంగా లేకపోయినా, ‘ద్వారాలు’ నగర/పట్టణ ద్వారాలని సందర్భానుసారంగా స్పష్టం చేస్తుంది. మూలంలోని వ్యాకరణ, పదబంధ అస్పష్టతలను [a], [b] పాదటిప్పణులతో సంరక్షించాం.
