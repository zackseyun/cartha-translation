source:
  edition: WLC
  text: מִ/קּ֣וֹל מְחַֽצְצִ֗ים בֵּ֚ין מַשְׁאַבִּ֔ים שָׁ֤ם יְתַנּוּ֙ צִדְק֣וֹת יְהוָ֔ה צִדְקֹ֥ת פִּרְזֹנ֖/וֹ בְּ/יִשְׂרָאֵ֑ל אָ֛ז יָרְד֥וּ לַ/שְּׁעָרִ֖ים עַם יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/011.yaml
  text: From the sound of archers among the watering places[a], there they recount the righteous acts of Yahweh, the righteous acts of his villagers in Israel[c][b]. Then the people of Yahweh went down to the gates.
translation:
  language: te
  text: నీళ్లు తోడే చోట్ల మధ్య బాణాలు వేసేవారి శబ్దం నుండి[a], అక్కడ వారు యాహ్వే నీతికార్యాలను, ఇశ్రాయేలులో ఆయన గ్రామజనుల నీతికార్యాలను[b] వివరించి చెబుతారు. అప్పుడు యాహ్వే ప్రజలు ద్వారాలవద్దకు[c] దిగివచ్చారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీళ్లు తోడే చోట్ల దగ్గర బాణాలు వేసేవారి శబ్దం వినిపిస్తుండగా.” ఈ ఆరంభ పదబంధం అర్థం కష్టం; కొందరు దీనిని శబ్దం నుండి వేరుపడటంగా కాక, ఈ మాటలు వినిపించే పరిస్థితిని లేదా ప్రదేశాన్ని తెలిపేదిగా అర్థం చేసుకుంటారు.
    reason: alternative_reading
  - marker: b
    text: “గ్రామజనులు” అని అనువదించిన హెబ్రీ పదం అర్థం వివాదాస్పదం. దీనిని “గోడలు లేని గ్రామాలు,” “గ్రామీణ ప్రజలు,” లేదా—తక్కువ సాధ్యతతో—“పాలకులు” అని కూడా అర్థం చేసుకున్నారు. ఈ పదబంధాన్ని “ఆయన గ్రామజనుల పట్ల చేసిన నీతికార్యాలు” అని కూడా గ్రహించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: పురాతన ఇశ్రాయేలు పట్టణాల్లో ద్వారాలు ప్రజలు సమావేశమయ్యే, న్యాయం తీర్చే, పౌర వ్యవహారాలు నిర్వహించే ప్రదేశాలుగా ఉండేవి; అవి భద్రతతోనూ సంబంధం కలిగి ఉండేవి.
    reason: cultural_note
lexical_decisions:
- source_word: מִקּוֹל מְחַצְצִים
  choice: విలుకాండ్ర శబ్దం నుండి
  rationale: מִן యొక్క మూలం/వేరుపాటు భావాన్ని ‘నుండి’తో నిలిపి, సందర్భానుసారంగా కష్టమైన מְחַצְצִים పదాన్ని విలుకాండ్రుగా అనువదించాం. ఆరంభ పదబంధంలోని అనిశ్చితిని పాదటిప్పణిలో ఉంచాం.
- source_word: בֵּין מַשְׁאַבִּים
  choice: నీళ్లు తోడే స్థలాల మధ్య
  rationale: בֵּין యొక్క ‘మధ్య’ భావాన్నీ, מַשְׁאַבִּים సూచించే బావులు లేదా నీరు తోడే ప్రదేశాల సామాన్య భావాన్నీ సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: יְתַנּוּ
  choice: వివరించి చెబుతారు
  rationale: ఇక్కడ పియేల్ రూపం కార్యాలను బిగ్గరగా తిరిగి చెప్పడం లేదా వర్ణించడం అనే భావాన్ని ఇస్తుంది; తప్పనిసరిగా పాట పాడడమని నిర్ణయించదు.
- source_word: צִדְקוֹת יְהוָה
  choice: యెహోవా నీతికార్యాలను
  rationale: צִדְקוֹת అనేది అమూర్తమైన నీతి మాత్రమే కాక, దేవుని నీతి ప్రత్యక్షమైన కార్యాలను సూచిస్తుంది. ‘రక్షణ కార్యాలు’ లేదా ‘విజయాలు’ అని మరింత సంకుచితం చేయకుండా మూలపదాన్ని ప్రతిబింబిస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో సుపరిచితమైన లిప్యంతరీకరణతో వ్యక్తిగత నామంగా ఉంచాం.
- source_word: צִדְקֹת פִּרְזֹנוֹ
  choice: ఆయన గ్రామజనుల నీతికార్యాలను
  rationale: సంబంధిత రూపం న్యాయాధిపతులు 5:7లో గ్రామజీవితం లేదా గ్రామీణ ప్రజలను సూచిస్తుంది. హెబ్రీ జనిటివ్ సంబంధాన్ని పరిష్కరించకుండా ‘ఆయన గ్రామజనుల’గా నిలిపి, ఇతర సాధ్యార్థాలను పాదటిప్పణిలో ఇచ్చాం.
- source_word: אָז יָרְדוּ לַשְּׁעָרִים
  choice: అప్పుడు ... ద్వారాలవద్దకు దిగివచ్చారు
  rationale: אָז యొక్క కాలానుక్రమ భావాన్నీ, ירד యొక్క కిందికి రావడం అనే సాధారణ భావాన్నీ నిలుపుతుంది. ద్వారాల సామాజిక ప్రాముఖ్యతను పాదటిప్పణిలో వివరిస్తాం.
- source_word: עַם יְהוָה
  choice: యెహోవా ప్రజలు
  rationale: హెబ్రీ నిర్మాణంలోని ఒడంబడిక సంబంధాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం ప్రత్యక్షంగా ఉంది; దానిని బిరుదుగా మార్చకుండా తెలుగులో స్థిరపడిన ‘యెహోవా’ రూపంలో ఉంచాం.
- issue: విజయగీత సందర్భంలో צִדְקוֹת అర్థం
  choice: నీతికార్యాలు
  alternative: రక్షణ కార్యాలు; విజయాలు
  rationale: ఈ పదం యెహోవా నీతి కార్యరూపంలో వెల్లడవడాన్ని సూచిస్తుంది. సందర్భంలో రక్షణ, విజయం ఉన్నప్పటికీ, వాటిలో ఒక్కదానికే అర్థాన్ని పరిమితం చేయకుండా మూలంలోని విస్తృత భావాన్ని నిలిపాం.
- issue: צִדְקֹת פִּרְזֹנוֹ లోని సంబంధం
  choice: ఆయన గ్రామజనుల నీతికార్యాలు
  alternative: ఆయన గ్రామజనుల పట్ల చేసిన నీతికార్యాలు
  rationale: హెబ్రీ నిర్మాణం ఆ కార్యాలు గ్రామజనులు చేసినవా, వారి పట్ల జరిగినవా అనే సంబంధాన్ని స్పష్టంగా పరిష్కరించదు. ప్రధాన పాఠంలో జనిటివ్ అస్పష్టతను నిలిపి, ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కవితా ధోరణిని ఉంచాం. అరుదైన సంస్కృత పదజాలాన్ని తగ్గించి, ‘నీళ్లు తోడే స్థలాలు,’ ‘వివరించి చెబుతారు,’ ‘ద్వారాలవద్దకు’ వంటి సాధారణంగా అర్థమయ్యే రూపాలను వాడాం. మూలంలోని కఠినమైన ఆరంభ పదబంధం మరియు గ్రామజనులకు సంబంధించిన వ్యాకరణ అస్పష్టతను పాదటిప్పణులతో సంరక్షించాం.
