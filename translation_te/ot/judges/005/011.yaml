  source_fidelity: మూలంలోని מִקּוֹל (‘శబ్దం నుండి/వద్ద’)తో మొదలయ్యే కఠినమైన కవితా నిర్మాణం, מְחַצְצִיםకు సందర్భానుసారమైన ‘బాణాలు వేసేవారు,’ మరియు צִדְקוֹת యొక్క ‘నీతికార్యాలు’ భావం సరిగా కాపాడబడ్డాయి. అయితే దైవనామాన్ని ఆంగ్ల POB నిర్ణయం మరియు మూలపాఠంలోని వ్యక్తినామానికి అనుగుణంగా ‘యాహ్వే’గా లిప్యంతరీకరించడం అవసరం. పిర్జోనోకు సంబంధించిన సంబంధార్థం వివాదాస్పదంగానే ఉంచబడింది.
