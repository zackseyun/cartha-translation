translation:
  language: te
  text: 'ఆకాశం నుండి నక్షత్రాలు యుద్ధం చేశాయి;

    వాటి మార్గాల నుండి అవి సీసెరాకు విరోధంగా[b] యుద్ధం చేశాయి.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా ‘సీసెరాతో’ ఉంది; యుద్ధ సందర్భంలో దీని భావం ‘సీసెరాకు విరోధంగా’.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן שָׁמַיִם
  choice: ఆకాశం నుండి
  rationale: మִן దిశ లేదా మూలాన్ని సూచిస్తుంది; שָׁמַיִםకు ఆధునిక ప్రామాణిక తెలుగులో సహజమైన రూపం ‘ఆకాశం’. ఇది కవితాత్మక దృశ్యాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: נִלְחָמוּ
  choice: యుద్ధం చేశాయి
  rationale: לחם నిఫాల్ రూపం ఇక్కడ యుద్ధంలో పాల్గొనడాన్ని సూచిస్తుంది. రెండు పాదాల్లోని క్రియా పునరుక్తిని అలాగే నిలుపుతుంది.
- source_word: הַכּוֹכָבִים
  choice: నక్షత్రాలు
  rationale: ఈ పదానికి నేరమైన అర్థం ‘నక్షత్రాలు’. ఖగోళ వస్తువులు లేదా దేవదూతలు అని వివరణాత్మకంగా విస్తరించకుండా కవితా చిత్రాన్ని కాపాడుతుంది.
- source_word: מִמְּסִלּוֹתָם
  choice: తమ మార్గాల నుండి
  rationale: מְסִלּוֹת ఎత్తైన రహదారులు, దారులు లేదా పథాలను సూచించగలదు. నక్షత్రాల సందర్భంలో ‘మార్గాలు’ సహజంగా ఉండి, నిర్దిష్టమైన ఆధునిక ఖగోళ భావమైన ‘కక్ష్యలు’ను అనవసరంగా రుద్దదు.
- source_word: עִם סִיסְרָא
  choice: సీసెరాతో
  rationale: హీబ్రూ עִם యొక్క ప్రాథమిక రూపార్థం ‘తో’. యుద్ధ సందర్భంలో ఇది ప్రత్యర్థిని సూచించి ‘సీసెరాకు విరోధంగా’ అనే భావాన్ని ఇస్తుంది; ప్రధాన పాఠంలో రూపాన్ని నిలిపి, పాదసూచికలో సందర్భార్థాన్ని తెలియజేశాం.
theological_decisions:
- issue: యుద్ధంలో నక్షత్రాల పాత్ర స్వరూపం
  choice: నక్షత్రాలు యుద్ధం చేశాయని కవితాత్మక వాక్యాన్ని వివరణ జోడించకుండా నిలుపడం
  alternative: దీనిని అక్షరార్థ ఖగోళ జోక్యం, దేవదూతల సైన్యం, లేదా దైవ నిర్వహణలోని ప్రకృతి శక్తుల రూపకం అని ప్రత్యేకంగా నిర్ధారించడం
  rationale: దెబోరా గీతం నక్షత్రాల పోరాటాన్ని చిత్రిస్తుంది గాని అది ఎలా జరిగిందో చెప్పదు. అనువాదం ఆ ఉద్దేశపూర్వక అనిశ్చితిని, దైవశాస్త్ర సంబంధమైన ఉద్వేగాన్ని అలాగే ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కవితా శైలిని ఉపయోగించాం. హీబ్రూ పాదాల సమాంతరతను, ‘యుద్ధం చేశాయి’ అనే పునరుక్తిని నిలిపాం. ‘కక్ష్యలు’ కంటే విస్తృతమైన, మూలంలోని రూపకాన్ని కాపాడే ‘మార్గాలు’ను ఎంచుకున్నాం.
