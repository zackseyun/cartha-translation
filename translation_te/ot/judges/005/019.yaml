source:
  edition: WLC
  text: בָּ֤אוּ מְלָכִים֙ נִלְחָ֔מוּ אָ֤ז נִלְחֲמוּ֙ מַלְכֵ֣י כְנַ֔עַן בְּ/תַעְנַ֖ךְ עַל מֵ֣י מְגִדּ֑וֹ בֶּ֥צַע כֶּ֖סֶף לֹ֥א לָקָֽחוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/019.yaml
  text: Kings came; they fought. Then the kings of Canaan fought at Taanach[a], by the waters of Megiddo; they took no plunder of silver.
translation:
  language: te
  text: 'రాజులు వచ్చారు; వారు యుద్ధం చేశారు.


    అప్పుడు కనాను రాజులు

    తానాకులో, మెగిద్దో జలాల దగ్గర యుద్ధం చేశారు;

    వారు వెండి లాభం ఏదీ పొందలేదు.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వెండి కొల్లసొమ్ము’ లేదా ‘వెండి సంపాదన.’ హీబ్రూ పదబంధం సాధారణంగా భౌతిక లాభాన్ని సూచించవచ్చు; ఈ యుద్ధ సందర్భంలో కొల్లసొమ్ము అనే అర్థం కూడా సాధ్యమే.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּאוּ
  choice: వచ్చారు
  rationale: בוא క్రియ యొక్క ప్రాథమిక భావమైన దృశ్యంలోకి రావడాన్ని సంక్షిప్తంగా, కవితాత్మకంగా తెలియజేస్తుంది.
- source_word: מְלָכִים
  choice: రాజులు
  rationale: నిర్దేశకత లేని బహువచనాన్ని అలాగే ఉంచి, హీబ్రూ కవితలోని ఆకస్మిక ఆరంభాన్ని నిలుపుతుంది.
- source_word: נִלְחָמוּ
  choice: యుద్ధం చేశారు
  rationale: לחם నిఫాల్ రూపానికి సాధారణ భావం ‘పోరాడడం/యుద్ధం చేయడం’; ఆధునిక ప్రామాణిక తెలుగులో ఇది సహజంగా, గంభీరంగా ఉంటుంది.
- source_word: אָז
  choice: అప్పుడు
  rationale: కవితలో తదుపరి సంఘటనను సూచించే కాలక్రమ సంబంధాన్ని అదనపు వివరణ లేకుండా కాపాడుతుంది.
- source_word: מַלְכֵי כְנַעַן
  choice: కనాను రాజులు
  rationale: హీబ్రూ సమాస సంబంధాన్ని తెలుగులో సహజమైన రూపంతో తెలియజేస్తుంది.
- source_word: בְּתַעְנַךְ
  choice: తానాకులో
  rationale: ב ఇక్కడ యుద్ధం జరిగిన ప్రాంతాన్ని సూచిస్తుంది; స్థల నామంతో ‘లో’ సహజమైన తెలుగు ప్రయోగం.
- source_word: עַל מֵי מְגִדּוֹ
  choice: మెగిద్దో జలాల దగ్గర
  rationale: עַל ఇక్కడ భౌగోళిక సమీపాన్ని సూచిస్తుంది; ‘దగ్గర’ ఆ భావాన్ని స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בֶּצַע כֶּסֶף
  choice: వెండి దోపుడుసొమ్ము
  rationale: בצע లాభం లేదా సంపాదనను సూచించగలిగినా, యుద్ధ సందర్భంలో కొల్లసొమ్ము/దోపుడుసొమ్ము భావం బాగా సరిపోతుంది; ‘వెండి దోపుడుసొమ్ము’ మూలంలోని రెండు పదాల సంబంధాన్ని నిలుపుతుంది.
- source_word: לֹא לָקָחוּ
  choice: ఏమీ తీసుకోలేదు
  rationale: నిరాకరణను సహజమైన తెలుగులో బలంగా వ్యక్తం చేస్తూ, దోపుడుసొమ్ము లభించలేదనే భావాన్ని నిలుపుతుంది.
