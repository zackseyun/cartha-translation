translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గీతంలోని సంక్షిప్త సమాంతర పాదాలను ప్రతిబింబించేలా పాద విభజన చేయబడింది. స్థల నామాలు ‘తానాకు,’ ‘మెగిద్దో’గా లిప్యంతరీకరించబడ్డాయి. భాష సామాన్య పాఠకులకు అర్థమయ్యేలా ఉండగా కవితాత్మక గాంభీర్యం నిలుపబడింది.
