  text: וְ/שָׂרַ֤/י בְּ/יִשָּׂשכָר֙ עִם דְּבֹרָ֔ה וְ/יִשָּׂשכָר֙ כֵּ֣ן בָּרָ֔ק בָּ/עֵ֖מֶק שֻׁלַּ֣ח בְּ/רַגְלָ֑י/ו בִּ/פְלַגּ֣וֹת רְאוּבֵ֔ן גְּדֹלִ֖ים חִקְקֵי לֵֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/015.yaml
  text: And the princes of Issachar were with Deborah[a]; and Issachar was likewise with Barak; into the valley they were sent at his feet[c][b]. Among the divisions of Reuben there were great searchings of heart.
translation:
  language: te
  text: 'ఇశ్శాఖారు అధిపతులు[a] దెబోరాతో ఉన్నారు;

    ఇశ్శాఖారు కూడా బారాకుతో ఉన్నాడు;

    వారు లోయలోకి అతని పాదాల చెంతనే[b] పంపబడ్డారు.

    రూబేను విభాగాల మధ్య

    గొప్ప మనోమథనాలు[c] ఉన్నాయి.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ఇశ్శాఖారు ప్రధానులు’ లేదా ‘ఇశ్శాఖారు నాయకులు’ అని కూడా అనువదించవచ్చు. హీబ్రూ వ్యక్తీకరణ కవితాత్మకమైనది; దాన్ని అక్షరార్థ స్వామ్యరూపంగా కూడా గ్రహించే అవకాశం ఉంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా ‘అతని పాదాల దగ్గర’; అంటే, అతని వెనకే అతి దగ్గరగా అనుసరిస్తూ.
    reason: lexical_alternative
  - marker: c
    text: ‘గొప్ప హృదయ నిర్ణయాలు,’ ‘గొప్ప హృదయాలోచనలు,’ లేదా ‘గొప్ప అంతరంగ పరిశీలనలు’ అని కూడా అనువదించవచ్చు. హీబ్రూ పదబంధం క్లిష్టమైనది; సందర్భంలో అది చర్యకు బదులుగా లోపల సాగిన ఆలోచనను లేదా తర్జనభర్జనను సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: שָׂרַי בְּיִשָּׂשכָר
  choice: ఇశ్శాఖారు అధిపతులు
  rationale: שָׂרַי రూపం అక్షరార్థంగా స్వామ్యార్థాన్ని సూచించగలిగినా, ఈ కవితా సందర్భంలో ఇశ్శాఖారు గోత్రపు ప్రధానులను సూచించే నుడికారంగా తీసుకోవడం సహజం. ‘అధిపతులు’ పాటలోని ఉన్నత శైలిని నిలుపుతుంది.
- source_word: עִם דְּבֹרָה
  choice: దెబోరాతో ఉన్నారు
  rationale: עִם ఇక్కడ సహవాసం లేదా పక్షాన నిలవడాన్ని సూటిగా తెలియజేస్తుంది.
- source_word: וְיִשָּׂשכָר כֵּן בָּרָק
  choice: ఇశ్శాఖారు కూడా బారాకుతో అలాగే ఉన్నాడు
  rationale: హీబ్రూ వాక్యం క్రియ లేకుండా సంక్షిప్తంగా ఉంది; כֵּן సమాంతర అనురూపతను సూచిస్తుంది. తెలుగులో సహజత కోసం ‘ఉన్నాడు’ చేర్చినా మూలంలోని సంక్షిప్త సంబంధాన్ని పరిష్కరించి విస్తరించలేదు.
- source_word: בָּעֵמֶק
  choice: లోయలోకి
  rationale: యుద్ధానికి పంపబడే కదలిక సందర్భంలో గమ్యదిశను సూచించే ‘లోయలోకి’ అనేది కేవలం స్థలార్థమైన ‘లోయలో’ కంటే సరిపోతుంది.
- source_word: שֻׁלַּח
  choice: పంపబడ్డాడు
  rationale: క్రియ హీబ్రూలో ఏకవచన నిష్క్రియారూపంలో ఉంది. గోత్రనామమైన ‘ఇశ్శాఖారు’ను సమష్టి ఏకవచనంగా ఉంచి ఆ రూపాన్ని తెలుగులో నిలిపాం.
- source_word: בְּרַגְלָיו
  choice: అతని పాదాల చెంతనే
  rationale: అక్షరార్థమైన ‘అతని పాదాల దగ్గర’ అనే చిత్రాన్ని కవితాత్మకంగా నిలిపి, అది బారాకును అతి దగ్గరగా అనుసరించడాన్ని సూచిస్తుందని పాదటిప్పణిలో వివరించాం.
- source_word: בִּפְלַגּוֹת רְאוּבֵן
  choice: రూబేను విభాగాల మధ్య
  rationale: פְּלַגּוֹת అనేది విభాగాలు, వర్గాలు లేదా గోత్రంలోని అంతర్గత గుంపులను సూచించవచ్చు. ‘విభాగాలు’ మూలపద విస్తృతిని నిలుపుతుంది.
- source_word: חִקְקֵי לֵב
  choice: మనోనిర్ణయాలు
  rationale: ఈ అరుదైన కవితా పదబంధం హృదయంలో ఏర్పడిన నిర్ణయాలు లేదా నిశ్చయాలను సూచించవచ్చు. ‘మనోనిర్ణయాలు’ ఆధునిక తెలుగులో సహజంగా ఉండి, రూబేను ఆలోచనలోనే నిలిచిపోయాడనే సందర్భపు ఉద్వేగాన్ని అతిగా వ్యాఖ్యానించదు.
