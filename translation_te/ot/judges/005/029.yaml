  to: 'ఆమె జ్ఞానవంతులైన గొప్ప స్త్రీలు ఆమెకు సమాధానం ఇస్తారు; అంతేకాదు, ఆమె తన మాటలను తనకే మళ్లీ చెప్పుకుంటుంది[a]:'
