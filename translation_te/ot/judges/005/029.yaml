source:
  edition: WLC
  text: חַכְמ֥וֹת שָׂרוֹתֶ֖י/הָ תַּעֲנֶ֑ינָּה אַף הִ֕יא תָּשִׁ֥יב אֲמָרֶ֖י/הָ לָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/029.yaml
  text: 'Her wisest princesses answer her; indeed, she herself repeats her words to herself:'
translation:
  language: te
  text: 'ఆమె జ్ఞానవంతులైన గొప్ప స్త్రీలు ఆమెకు సమాధానం ఇస్తారు; అంతేకాదు, ఆమె తన మాటలను తనకే మళ్లీ చెప్పుకుంటుంది[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆమె తన మాటలకు తానే సమాధానం చెప్పుకుంటుంది.”
    reason: తָּשִׁיב అనే క్రియకు ‘తిరిగి చెప్పడం’ లేదా ‘సమాధానం ఇవ్వడం’ అనే భావాలు ఉండవచ్చు; אֲמָרֶיהָ לָהּ అనే నిర్మాణం రెండవ భావవ్యాఖ్యకు కూడా వీలు కల్పిస్తుంది.
lexical_decisions:
- source_word: חַכְמוֹת שָׂרוֹתֶיהָ
  choice: ఆమె ఆస్థానంలోని జ్ఞానవంతులైన స్త్రీలు
  rationale: חַכְמוֹת అంటే ‘జ్ఞానవంతులైన స్త్రీలు’; שָׂרוֹתֶיהָ రాజసభకు చెందిన గొప్ప స్త్రీలను లేదా రాజకుమార్తెలను సూచించవచ్చు. సందర్భానికి సహజంగా ఉండేలా, వారిని తప్పనిసరిగా రాజుల కుమార్తెలుగా నిర్ధారించకుండా ‘ఆస్థానంలోని ... స్త్రీలు’ అని ఇచ్చాం.
- source_word: תַּעֲנֶינָּה
  choice: జవాబిస్తారు
  rationale: స్త్రీలింగ బహువచన క్రియను, కావ్యంలోని సజీవ వర్తమాన చిత్రణకు అనుగుణంగా వర్తమాన కాలంలో అనువదించాం.
- source_word: אַף
  choice: అంతేకాదు
  rationale: ఇక్కడ బలపరిచే లేదా మరొక విషయాన్ని జోడించే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: תָּשִׁיב אֲמָרֶיהָ לָהּ
  choice: ఆమె తన మాటలను తనకే మళ్లీ చెప్పుకుంటుంది
  rationale: పదబంధంలోని ‘తిరిగి చెప్పడం/జవాబివ్వడం’ అనే భావాన్ని, ఆమె తనలో తాను అదే మాటలను పలుకుతున్న దృశ్యంగా అందించాం; ప్రత్యామ్నాయ అర్థాన్ని పాదసూచికలో ఉంచాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, దెబోరా గీతంలోని కవితాత్మక వర్తమానాన్ని నిలుపుతూ గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలిని ఉపయోగించాం.
