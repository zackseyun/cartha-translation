  terminology: ‘వేరు,’ ‘అధికారులు,’ ‘లేఖకుని దండం’ అనే పదాలు అర్థాన్ని అనవసరంగా నిర్ణయించకుండా మూలంలోని అనిశ్చితిని కాపాడుతున్నాయి. అయితే పాదటీకా bలో ‘తన వంశాలవారితో’ అనడం రెండవ పురుష ప్రత్యయమైన ‘నీ ...’ను మూడవ పురుషంగా మార్చుతుంది; దానిని సరిచేయాలి.
