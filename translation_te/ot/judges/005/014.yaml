source:
  edition: WLC
  text: מִנִּ֣י אֶפְרַ֗יִם שָׁרְשָׁ/ם֙ בַּ/עֲמָלֵ֔ק אַחֲרֶ֥י/ךָ בִנְיָמִ֖ין בַּֽ/עֲמָמֶ֑י/ךָ מִנִּ֣י מָכִ֗יר יָֽרְדוּ֙ מְחֹ֣קְקִ֔ים וּ/מִ֨/זְּבוּלֻ֔ן מֹשְׁכִ֖ים בְּ/שֵׁ֥בֶט סֹפֵֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/014.yaml
  text: From Ephraim those whose root was in Amalek[a]; after you, Benjamin, among your peoples. From Machir commanders came down[e][d][c][b], and from Zebulun those who wield the staff of the scribe.
translation:
  language: te
  text: ఎఫ్రాయిము నుండి—అమాలేకులో వేరు ఉన్నవారు[a]; నీ వెనుక బెన్యామీను, నీ జనసమూహాల మధ్య[b]. మాకీరు నుండి అధికారులు దిగివచ్చారు[c][d]; జెబూలూను నుండి లేఖకుని దండాన్ని పట్టుకున్నవారు[e].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అమాలేకుకు విరోధంగా వారి వేరు ఉండింది,’ లేదా ‘అమాలేకు కొండప్రాంతంలో వారి వేరు ఉండింది.’ ఈ హీబ్రూ పాదం అర్థం కఠినమైనది; ఇది బహుశా కవితాత్మక భౌగోళిక సూచన.
    reason: alternative_reading
  - marker: b
    text: లేదా, ‘బెన్యామీను నీ వెనుక, నీ వంశాలవారి మధ్య వచ్చాడు.’ ‘నీ జనసమూహాల మధ్య’ అనేది అసాధారణమైన హీబ్రూ వ్యక్తీకరణకు దగ్గరి అనువాదం.
    reason: lexical_alternative
  - marker: c
    text: ‘మాకీరు’ మనష్షే గోత్రంలోని ప్రధాన వంశం; కొన్ని అనువాదాలు విస్తృత గోత్రార్థంతో ‘మనష్షే’ అని ఇస్తాయి.
    reason: cultural_note
  - marker: d
    text: ‘అధికారులు’కు బదులు ‘పాలకులు’ లేదా ‘శాసనకర్తలు’ అని కూడా అనువదించవచ్చు. హీబ్రూ పదం పరిపాలించేవారిని లేదా ఆజ్ఞలు నిర్ణయించేవారిని సూచించగలదు.
    reason: lexical_alternative
  - marker: e
    text: లేదా, ‘లేఖకుని దండంతో సమీకరించేవారు,’ లేదా ‘సైన్యాధికారి దండాన్ని మోసేవారు.’ ఈ హీబ్రూ వ్యక్తీకరణ అరుదైనది; ఇది సైనికులను సమీకరించడాన్ని లేదా పేర్లు నమోదు చేయడాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנִּי אֶפְרַיִם
  choice: ఎఫ్రాయిము నుండి
  rationale: మִנִּי మూలాన్ని లేదా బయలుదేరిన వర్గాన్ని సూచిస్తుంది. ‘నుండి’ సహజమైన తెలుగులో కవితాత్మక గోత్రాల జాబితాను నిలుపుతుంది.
- source_word: שָׁרְשָׁם
  choice: వేరు ఉన్నవారు
  rationale: శబ్దార్థమైన ‘వేరు’ రూపకాన్ని నిలిపి, బహువచన సమూహాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; దీనిని కేవలం ‘సంతానం’గా నిర్ణయించదు.
- source_word: בַּעֲמָלֵק
  choice: అమాలేకులో
  rationale: בְ ఉపసర్గకు ఇక్కడ స్థానార్థం సహజమైనది. పాఠంలోని కఠినతను నిలుపుతూ అనవసరంగా యుద్ధార్థమైన ‘అమాలేకుకు విరోధంగా’ అని నిర్ణయించలేదు.
- source_word: אַחֲרֶיךָ בִנְיָמִין
  choice: నీ వెనుక బెన్యామీను
  rationale: హీబ్రూ పాదం సంక్షిప్తంగా, క్రియ లేకుండా ఉంది. అదే కవితాత్మక సంక్షిప్తతను ఉంచి ‘బెన్యామీను నిన్ను అనుసరించాడు’ అనే వివరణాత్మక క్రియను ప్రధాన పాఠంలో చేర్చలేదు.
- source_word: בַּעֲמָמֶיךָ
  choice: నీ జనసమూహాల మధ్య
  rationale: ‘ప్రజలు/జనాలు’ అనే పదం యొక్క అసాధారణ బహువచనాన్ని పారదర్శకంగా ఉంచుతుంది; అది వంశాలు, బంధువర్గాలు లేదా దళాలను సూచించవచ్చనే అనిశ్చితిని పాదటీకలో తెలుపుతుంది.
- source_word: מִנִּי מָכִיר
  choice: మాకీరు నుండి
  rationale: హీబ్రూ నేరుగా మాకీరు పేరునే వాడుతున్నందున విస్తృత గోత్రనామమైన మనష్షేతో దానిని భర్తీ చేయలేదు.
- source_word: יָרְדוּ
  choice: దిగివచ్చారు
  rationale: క్రియ యొక్క ప్రాథమిక ‘దిగివచ్చుట’ భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: מְחֹקְקִים
  choice: అధికారులు
  rationale: ఈ పదం ఆజ్ఞలు జారీచేసే పాలకులను లేదా నాయకులను సూచించగలదు. సైనిక సమీకరణ సందర్భానికి ‘అధికారులు’ సరిపోతూ, ‘శాసనకర్తలు’ అనే అతి నిర్దిష్ట అర్థాన్ని ప్రధాన పాఠంపై రుద్దదు.
- source_word: וּמִזְּבוּלֻן
  choice: జెబులూను నుండి
  rationale: గోత్రాల జాబితాలో మూలాన్ని సూచించే నిర్మాణాన్ని కొనసాగిస్తుంది.
- source_word: מֹשְׁכִים
  choice: పట్టుకున్నవారు
  rationale: మూల క్రియ ‘లాగుట/చేతబట్టుట’ భావాన్ని కలిగి ఉంది. దండంతో కలిపి ‘పట్టుకున్నవారు’ తెలుగులో సహజంగా ఉండి, దాని ఖచ్చిత కార్యాన్ని ముందుగానే నిర్ణయించదు.
- source_word: בְּשֵׁבֶט סֹפֵר
  choice: లేఖకుని దండాన్ని
  rationale: ‘దండం’ మరియు ‘లేఖకుడు’ అనే హీబ్రూ చిత్రణను నిలుపుతుంది. ఇది సైనిక సమీకరణ దండమా, అధికార చిహ్నమా, లేక లేఖనానికి సంబంధించిన అరుదైన ప్రయోగమా అన్న అనిశ్చితిని సంరక్షిస్తుంది.
