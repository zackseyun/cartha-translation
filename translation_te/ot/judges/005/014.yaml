  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కవితాత్మక శైలిని వాడాం. హీబ్రూ పాదంలోని క్రియారహిత సంక్షిప్తతను మొదటి భాగంలో డాష్, విరామాలతో కొంతవరకు నిలిపాం. అరుదైన భౌగోళిక, పరిపాలనా పదబంధాలను ప్రధాన పాఠంలో అతిగా స్పష్టీకరించకుండా, ప్రత్యామ్నాయాలను పాదటీకల్లో ఇచ్చాం.
