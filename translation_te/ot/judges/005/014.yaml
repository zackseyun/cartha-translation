- from: ఎఫ్రాయిము నుండి—అమాలేకులో వేరు ఉన్నవారు[a]; నీ వెనుక బెన్యామీను, నీ జనసమూహాల మధ్య[b]. మాకీరు నుండి అధికారులు దిగివచ్చారు[c][d]; జెబులూను నుండి లేఖకుని దండాన్ని పట్టుకున్నవారు[e].
  to: ఎఫ్రాయిము నుండి—అమాలేకులో వేరు ఉన్నవారు[a]; నీ వెనుక బెన్యామీను, నీ జనసమూహాల మధ్య[b]. మాకీరు నుండి అధికారులు దిగివచ్చారు[c][d]; జెబూలూను నుండి లేఖకుని దండాన్ని పట్టుకున్నవారు[e].
  rationale: పాదటీకా bలో మూలపాఠంలోని రెండవ పురుష సంబంధాన్ని పునరుద్ధరించాం. అలాగే జెబులూను గోత్రనామాన్ని సాధారణ తెలుగు బైబిలు రూపమైన ‘జెబూలూను’గా సరిచేశాం. ఇతర పదబంధాలు మూల హీబ్రూ యొక్క కవితాత్మక సంక్షిప్తతను, పాఠసంబంధ అనిశ్చితిని సముచితంగా నిలుపుతున్నందున మార్చలేదు.
