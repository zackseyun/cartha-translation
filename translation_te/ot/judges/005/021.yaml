id: JDG.5.21
reference: Judges 5:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: נַ֤חַל קִישׁוֹן֙ גְּרָפָ֔/ם נַ֥חַל קְדוּמִ֖ים נַ֣חַל קִישׁ֑וֹן תִּדְרְכִ֥י נַפְשִׁ֖/י עֹֽז׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/021.yaml
  text: The torrent of Kishon swept them away— the ancient torrent[a], the torrent of Kishon. March on, my soul[b], with strength!
translation:
  language: te
  text: 'కీషోను వాగు వారిని కొట్టుకుపోయింది—

    ఆ పురాతన వాగు[a], కీషోను వాగు.

    నా ప్రాణమా, బలంతో ముందుకు సాగు![b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘పూర్వకాలపు వాగు,’ ‘అనాదికాలపు వాగు.’ హీబ్రూ קְדוּמִים ప్రాచీన కాలాన్ని సూచించగలదు; ఇది కేవలం కాలసూచక విశేషణం కాక, తీవ్రతను పెంచే కవితాత్మక వర్ణనగా కూడా వినిపించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘నా ప్రాణమా, బలంతో అడుగువేయి!’ లేదా ‘నా ప్రాణమా, పరాక్రమంతో త్రొక్కు!’ హీబ్రూ వాక్యం సంక్షిప్తంగా, కవితాత్మకంగా ఉంది; క్రియ ముందుకు సాగడంతోపాటు అడుగువేయడం లేదా త్రొక్కడం అనే భావాన్నీ సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַחַל
  choice: వాగు
  rationale: נַחַל అనేది వాగు, వాగుపడగ లేదా వరదప్రవాహాన్ని సూచించగలదు. తెలుగు సందర్భంలో ‘వాగు’ సహజంగా ఉండి, ‘కొట్టుకుపోయింది’ అనే క్రియతో దాని ఉద్ధృత ప్రవాహ భావం స్పష్టమవుతుంది.
- source_word: קִישׁוֹן
  choice: కీషోను
  rationale: నీటిప్రవాహపు స్వనామాన్ని తెలుగు ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: גְּרָפָם
  choice: వారిని కొట్టుకుపోయింది
  rationale: גרף అంటే ప్రవాహం చేత ఊడ్చివేయడం లేదా కొట్టుకుపోవడం. శత్రు సైన్యాన్ని వరద తీసుకుపోయిన బలమైన జలచిత్రాన్ని ఈ పదబంధం సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: נַחַל קְדוּמִים
  choice: ఆ పురాతన వాగు
  rationale: קְדוּמִים ఇక్కడ పూర్వకాలం లేదా ప్రాచీనత్వాన్ని సూచిస్తుంది. ‘పురాతన వాగు’ కవితాత్మక గంభీరతను నిలుపుతూ, మూలంలోని భావాన్ని అనవసరంగా పురాణాత్మకంగా మార్చదు.
- source_word: תִּדְרְכִי
  choice: ముందుకు సాగు
  rationale: דרך అంటే తొక్కడం, నడవడం లేదా ముందుకు సాగడం. తన ప్రాణాన్ని ఉద్దేశించిన విజయోత్సాహపూర్వక స్వీయప్రేరణగా ‘ముందుకు సాగు’ సహజంగా ఉంటుంది; తొక్కు/త్రొక్కు అనే సాధ్యమైన భావాన్ని పాదసూచికలో ఉంచాం.
- source_word: נַפְשִׁי
  choice: నా ప్రాణమా
  rationale: נֶפֶשׁ జీవం, ప్రాణం లేదా అంతరంగ స్వరూపాన్ని సూచిస్తుంది. ప్రత్యక్ష స్వీయసంబోధనలో ‘నా ప్రాణమా’ మూలంలోని కవితాత్మక, అలంకారిక బలాన్ని నిలుపుతుంది.
- source_word: עֹז
  choice: బలంతో
  rationale: עֹז అంటే బలం లేదా పరాక్రమం. సంక్షిప్తమైన హీబ్రూ నిర్మాణాన్ని తెలుగులో క్రియావిశేషణ భావంతో సహజంగా వ్యక్తపరుస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కవితా శైలిని ఉపయోగించాం. సమాంతర పాద నిర్మాణాన్ని నిలిపి, వరద ఉద్ధృతిని ‘కొట్టుకుపోయింది’తో వ్యక్తపరిచాం. ‘నా ప్రాణమా’ అనే స్వీయసంబోధనను సరళీకరించకుండా కాపాడాం.
