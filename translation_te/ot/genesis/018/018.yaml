id: GEN.18.18
reference: Genesis 18:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אַ֨בְרָהָ֔ם הָי֧וֹ יִֽהְיֶ֛ה לְ/ג֥וֹי גָּד֖וֹל וְ/עָצ֑וּם וְ/נִ֨בְרְכוּ ב֔/וֹ כֹּ֖ל גּוֹיֵ֥י הָ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/018.yaml
  text: Abraham will surely become a great and mighty nation[a], and all the nations of the earth will be blessed in him.
translation:
  language: te
  text: అబ్రాహాము తప్పకుండా గొప్ప, బలమైన జనాంగంగా అవుతాడు; భూమిమీద ఉన్న జనాంగాలన్నీ అతనిలో ఆశీర్వదించబడతాయి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “భూమిమీద ఉన్న జనాంగాలన్నీ అతనిని బట్టి తమను తాము ఆశీర్వదించుకుంటాయి.” హీబ్రూ క్రియారూపాన్ని ఇలా కూడా అర్థం చేసుకోవచ్చు; ప్రధాన పాఠం దాన్ని కర్మణి భావంలో, “అతనిలో ఆశీర్వదించబడతాయి” అని తీసుకుంటుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: הָיוֹ יִהְיֶה
  choice: తప్పకుండా ... అవుతాడు
  rationale: హీబ్రూలోని infinitive absolute + imperfect నిర్మాణం భవిష్యత్ క్రియకు బలమైన నిశ్చయాన్ని ఇస్తుంది. తెలుగు సహజ వాక్యనిర్మాణంలో ‘తప్పకుండా ... అవుతాడు’ ఆ నిశ్చయాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: לְגוֹי
  choice: జనంగా
  rationale: גוי ఒక సమష్టి ప్రజాసమూహాన్ని లేదా జనాన్ని సూచిస్తుంది. ఇదే వచనంలో వచ్చే బహువచన రూపంతో పదసంబంధాన్ని నిలుపుకోవడానికి ‘జనం’ మూలపదంగా ఉంచబడింది.
- source_word: גָּדוֹל
  choice: గొప్పదైన
  rationale: ఈ పదంలో పరిమాణం, ప్రాముఖ్యత రెండింటి భావం ఉండవచ్చు; ‘గొప్పదైన’ ఆ విస్తృతిని నిలుపుతుంది.
- source_word: וְעָצוּם
  choice: బలమైన
  rationale: עצום బలం, శక్తి, ప్రభావాన్ని సూచించగలదు. ‘బలమైన’ అనేది ‘గొప్పదైన’ అనే పదాన్ని కేవలం సంఖ్యాపరమైన భావానికి పరిమితం చేయకుండా సహజంగా జతచేస్తుంది.
- source_word: וְנִבְרְכוּ
  choice: ఆశీర్వదించబడతాయి
  rationale: ברך యొక్క నిఫాల్ రూపాన్ని ప్రధాన పాఠంలో కర్మణి భావంగా తీసుకొని, జనాలు ఆశీర్వాదాన్ని పొందేవారిగా చూపించబడింది. ఆత్మార్థకంగా అర్థం చేసుకునే అవకాశం పాదటిప్పణిలో నిలుపబడింది.
- source_word: בּוֹ
  choice: అతనిలో
  rationale: בּ ఉపసర్గను సాధ్యమైనంత సమీపంగా అనుసరించి, అబ్రాహాముతో సంబంధంలో ఆశీర్వాదం కలుగుతుందనే భావాన్ని ఉంచుతుంది; ‘అతని ద్వారా’ అని విస్తరించి వ్యాఖ్యానించలేదు.
- source_word: כֹּל גּוֹיֵי הָאָרֶץ
  choice: భూమిమీద ఉన్న జనాలన్నీ
  rationale: ఇది ఆదికాండంలోని విశ్వవ్యాప్త సూత్రప్రయోగం. ‘భూమిమీద ఉన్న’ విశ్వవ్యాప్త పరిధిని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; ‘జనాలు’ గוי పదంతో పదసామ్యాన్ని నిలుపుతుంది.
theological_decisions:
- issue: అబ్రాహామీయ ఆశీర్వాద సూత్రంలోని నిఫాల్ రూపం
  choice: జనాలన్నీ అతనిలో ఆశీర్వదించబడతాయి
  alternative: జనాలన్నీ అతనిని ఆదర్శంగా చేసుకొని తమను తాము ఆశీర్వదించుకుంటాయి
  rationale: హీబ్రూ నిఫాల్ రూపాన్ని కర్మణిగా చదవడం సందర్భానికి సహజంగా సరిపోతుంది; అయితే ఆత్మార్థక పఠనం కూడా భాషాపరంగా సాధ్యమైనందున దాన్ని తొలగించకుండా పాదటిప్పణిలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన బైబిలు శైలి పాటించబడింది. మూలంలోని నిశ్చయార్థక బలం, ‘జనం’ అనే పదసంబంధం, בּוֹ యొక్క సమీపార్థం, నిఫాల్ రూపంలోని నిజమైన సందిగ్ధత నిలుపబడ్డాయి.
