  yaml_path: translation/ot/genesis/018/006.yaml
  text: So Abraham hurried into the tent to Sarah and said[a], “Quickly[b], knead three seahs of fine flour and make cakes.”
translation:
  language: te
  text: అప్పుడు అబ్రాహాము త్వరగా గుడారంలోకి శారా దగ్గరకు వెళ్లి, “త్వరగా, మూడు సేయాల[a][b] మెత్తని పిండిని పిసికి రొట్టెలు చేయి” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: సేయా అనేది ప్రాచీన కాలంలోని పొడి పదార్థాల కొలమానం. మూడు సేయాలు సుమారు 20–22 లీటర్లు.
    reason: cultural_note
  - marker: b
    text: లేదా, “మూడు కొలతల మెత్తని పిండి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמַהֵר
  choice: త్వరగా వెళ్లి
  rationale: ఈ క్రియ వేగంగా చర్య తీసుకోవడాన్ని సూచిస్తుంది. కథనంలోని ఆతురతను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: הָאֹהֱלָה אֶל שָׂרָה
  choice: గుడారంలో ఉన్న శారా దగ్గరికి
  rationale: దిశను సూచించే రూపం గుడారం వైపు లేదా లోపలికి వెళ్లడాన్ని తెలియజేస్తుంది; సందర్భంలో శారా గుడారంలో ఉన్నందున ఈ అనువాదం గమ్యాన్ని సహజంగా స్పష్టం చేస్తుంది.
- source_word: מַהֲרִי
  choice: త్వరగా
  rationale: ఇది శారాను ఉద్దేశించిన స్త్రీలింగ ఏకవచన ఆజ్ఞ. తెలుగులో ‘త్వరగా’ ప్రత్యక్ష సంభాషణలోని అత్యవసరతను సహజంగా నిలుపుతుంది.
- source_word: שְׁלֹשׁ סְאִים
  choice: మూడు సేయాలు
  rationale: ‘సేయా’ ఒక నిర్దిష్ట ప్రాచీన పొడి కొలమానం. సాధారణమైన ‘కొలతలు’ అని మార్చకుండా మూలంలోని సాంస్కృతిక కొలమానాన్ని నిలిపింది.
- source_word: קֶמַח סֹלֶת
  choice: మెత్తని పిండి
  rationale: ఈ పదబంధం సన్నగా విసిరిన, మంచి నాణ్యతగల పిండిని సూచిస్తుంది. ‘మెత్తని పిండి’ సాధారణ పాఠకులకు స్పష్టంగా ఉంటుంది.
- source_word: לוּשִׁי
  choice: పిసికి
  rationale: ఈ క్రియ కేవలం కలపడాన్ని కాక పిండిని ముద్దగా పిసకడాన్ని సూచిస్తుంది.
- source_word: וַעֲשִׂי עֻגוֹת
  choice: రొట్టెలు చేయి
  rationale: עֻגוֹת ఇక్కడ త్వరగా తయారుచేసే గుండ్రని రొట్టెలను సూచిస్తుంది. ఆధునిక తెలుగులో ‘రొట్టెలు’ తీపి కేకులనే అపార్థాన్ని నివారిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. మూలంలోని వేగం ‘త్వరగా’ అనే పదం పునరావృతం ద్వారా నిలుపబడింది. తెలుగులో వాక్యం సహజంగా ఉండేందుకు మూలంలో భావింపబడిన ‘తీసుకుని’ చేర్చబడింది.
