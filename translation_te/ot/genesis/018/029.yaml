  text: וַ/יֹּ֨סֶף ע֜וֹד לְ/דַבֵּ֤ר אֵלָי/ו֙ וַ/יֹּאמַ֔ר אוּלַ֛י יִמָּצְא֥וּ/ן שָׁ֖ם אַרְבָּעִ֑ים וַ/יֹּ֨אמֶר֙ לֹ֣א אֶֽעֱשֶׂ֔ה בַּ/עֲב֖וּר הָ/אַרְבָּעִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/029.yaml
  text: He spoke to him again and said[a], “Perhaps forty will be found there.” And he said[b], “I will not do it for the sake of the forty.”
translation:
  language: te
  text: అతడు మళ్లీ ఆయనతో ఇలా అన్నాడు:[a] “ఒకవేళ అక్కడ నలభైమంది కనిపిస్తారేమో.” అందుకు ఆయన, “ఆ నలభైమంది నిమిత్తం నేను అలా చేయను” అన్నాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతడు ఇంకొకసారి ఆయనతో మాట్లాడుతూ ఇలా అన్నాడు.”
    reason: וַיֹּסֶף עוֹד לְדַבֵּר అనే హీబ్రూ పదబంధాన్ని మాటను మళ్లీ కొనసాగించాడనే భావంతో కూడా అనువదించవచ్చు.
  - marker: b
    text: లేదా, “ఆ నలభైమంది నిమిత్తం నేను దానిని నాశనం చేయను.” హీబ్రూలో అక్షరార్థంగా “నేను చేయను” అని మాత్రమే ఉంది; ఏ చర్య అనేది సందర్భం ద్వారా తెలుస్తుంది.
    reason: హీబ్రూ క్రియకు కర్మ అంతర్నిహితంగా ఉండడం వల్ల సాధ్యమైన స్పష్టీకరణను తెలియజేస్తుంది.
lexical_decisions:
- source_word: וַיֹּסֶף עוֹד לְדַבֵּר
  choice: మళ్లీ ... ఇలా అన్నాడు
  rationale: יסף + עוד + לדבר అనే పదబంధం మాటను కొనసాగించడం లేదా మళ్లీ మాట్లాడడం అనే భావాన్ని ఇస్తుంది. తెలుగులో సహజంగా ఉండేందుకు ‘మళ్లీ ... ఇలా అన్నాడు’ అని అనువదించబడింది.
- source_word: אֵלָיו
  choice: ఆయనతో
  rationale: אֶל ఇక్కడ సంభాషణ ఎవరిని ఉద్దేశించి జరుగుతోందో సూచిస్తుంది. సందర్భంలో దేవుని ఉద్దేశించిన గౌరవార్థక రూపంగా ‘ఆయనతో’ వాడబడింది.
- source_word: אוּלַי
  choice: ఒకవేళ ... ఏమో
  rationale: అబ్రాహాము వినయంగా ప్రతిపాదిస్తున్న అనిశ్చిత అవకాశాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: יִמָּצְאוּן
  choice: కనిపిస్తారేమో
  rationale: מצא నిఫాల్ రూపంలోని ‘కనిపించడం/దొరకడం’ అనే భావాన్ని, ఊహాత్మక అవకాశానికి తగిన తెలుగు క్రియారూపంతో వ్యక్తం చేస్తుంది.
- source_word: שָׁם
  choice: అక్కడ
  rationale: స్థలాన్ని సూచించే సాధారణ అవ్యయానికి నేరమైన, సహజమైన అనువాదం.
- source_word: אַרְבָּעִים
  choice: నలభైమంది
  rationale: సందర్భంలో లెక్కించబడుతున్నవారు నీతిమంతులైన వ్యక్తులు కాబట్టి తెలుగు వ్యక్తివాచక సంఖ్యారూపం వాడబడింది.
- source_word: לֹא אֶעֱשֶׂה
  choice: నేను అలా చేయను
  rationale: హీబ్రూలో కర్మ స్పష్టంగా చెప్పబడలేదు. ‘అలా’ అనేది ముందు సందర్భంలోని చర్యను సూచిస్తూనే దానిని ప్రధాన వాక్యంలో ‘నాశనం చేయడం’గా అతిగా నిర్దిష్టం చేయదు.
- source_word: בַּעֲבוּר הָאַרְבָּעִים
  choice: ఆ నలభైమందిని బట్టి
  rationale: בעבור ఇక్కడ ఆ నలభైమంది కారణంగా లేదా వారి నిమిత్తం చర్యను నిలిపివేయడాన్ని సూచిస్తుంది. ‘బట్టి’ సాధారణ ఆధునిక తెలుగులో ఈ సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: לֹא אֶעֱשֶׂה లో దైవిక చర్యకు కర్మ స్పష్టంగా లేకపోవడం
  choice: ‘నేను అలా చేయను’ అని కర్మను సందర్భసూచకంగానే ఉంచడం
  alternative: ‘నేను దానిని నాశనం చేయను’
  rationale: హీబ్రూ వాక్యం ఏ చర్యో నేరుగా పేర్కొనకుండా మునుపటి సంభాషణకు వదిలేస్తుంది. ‘అలా చేయను’ ఆ అంతర్నిహిత భావాన్ని తెలుగులో అర్థమయ్యేలా ఉంచి, మూలంలో లేని నిర్దిష్టతను చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన శైలి వాడబడింది. సంభాషణలో అబ్రాహాముకు ‘అతడు’, దేవునికి గౌరవార్థకంగా ‘ఆయన’ వాడి మాట్లాడేవారి భేదాన్ని సహజంగా చూపించబడింది; అయితే మూలవాక్యంలోని పేర్లను అనవసరంగా చేర్చలేదు.
