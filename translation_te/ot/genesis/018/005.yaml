- from: నేను కొంచెం రొట్టె తెస్తాను; మీరు తిని బలపడండి.[a] ఆ తర్వాత మీ ప్రయాణం కొనసాగించవచ్చు. ఇందుకే మీరు మీ సేవకుడి దగ్గరగా వచ్చారు కదా.” అందుకు వారు, “నీవు చెప్పినట్టే చేయి” అన్నారు.
