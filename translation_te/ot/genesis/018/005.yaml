  text: וְ/אֶקְחָ֨ה פַת לֶ֜חֶם וְ/סַעֲד֤וּ לִבְּ/כֶם֙ אַחַ֣ר תַּעֲבֹ֔רוּ כִּֽי עַל כֵּ֥ן עֲבַרְתֶּ֖ם עַֽל עַבְדְּ/כֶ֑ם וַ/יֹּ֣אמְר֔וּ כֵּ֥ן תַּעֲשֶׂ֖ה כַּ/אֲשֶׁ֥ר דִּבַּֽרְתָּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/005.yaml
  text: And let me bring a morsel of bread[a], so that you may refresh your hearts; after that you may pass on, since this is why you have passed by your servant. And they said, “Yes[b], do as you have said.”
translation:
  language: te
  text: “నేను కొంచెం రొట్టె తీసుకువస్తాను; మీరు తిని బలపడండి.[a] ఆ తర్వాత మీరు వెళ్లవచ్చు. మీరు మీ సేవకుని దగ్గరకు వచ్చారు కాబట్టే ఇలా చేస్తున్నాను.” అందుకు వారు, “అలాగే, నీవు చెప్పినట్టే చేయి” అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “మీ హృదయాలను బలపరచుకోండి.” ఇది ఆహారం తిని సేదదీరి, శక్తి పొందడాన్ని సూచించే హీబ్రూ నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶקְחָה
  choice: నేను ... తెస్తాను
  rationale: לקח అనే క్రియకు మూలంగా ‘తీసుకోవడం’ అనే భావం ఉన్నా, ఆతిథ్య సందర్భంలోని cohortative రూపం మర్యాదపూర్వక స్వచ్ఛంద ప్రతిపాదనను సూచిస్తుంది; తెలుగులో ‘తెస్తాను’ సహజంగా ఉంది.
- source_word: פַת לֶחֶם
  choice: కొంచెం రొట్టె
  rationale: చిన్న పరిమాణపు రొట్టెను సూచించే ఈ పదబంధం అబ్రాహాము వినయపూర్వకంగా చేసిన ఆతిథ్య ప్రతిపాదన. ‘కొంచెం రొట్టె’ ఆ అల్పోక్తిని సహజ ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: וְסַעֲדוּ לִבְּכֶם
  choice: మీరు తిని బలపడండి
  rationale: అక్షరార్థంగా ‘మీ హృదయాలను బలపరచుకోండి/ఆదుకోండి’ అనే హీబ్రూ నుడికారం ఆహారం ద్వారా శక్తి పొందడాన్ని సూచిస్తుంది. తెలుగులో ‘తిని బలపడండి’ అర్థాన్ని స్పష్టంగా, సహజంగా అందిస్తుంది.
- source_word: אַחַר תַּעֲבֹרוּ
  choice: ఆ తర్వాత మీ ప్రయాణం కొనసాగించవచ్చు
  rationale: ఇక్కడ עבר ప్రయాణాన్ని ముందుకు కొనసాగించడాన్ని సూచిస్తుంది; తెలుగు ప్రయాణ సందర్భంలో ఈ రూపం సహజం.
- source_word: כִּי עַל כֵּן
  choice: ఇందుకే ... కదా
  rationale: ఈ సంయుక్త పదబంధం అబ్రాహాము ఆతిథ్య ప్రతిపాదనకు కారణాన్ని తెలుపుతుంది. ‘ఇందుకే ... కదా’ మర్యాదపూర్వక ఆహ్వానంలోని భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: עֲבַרְתֶּם עַל עַבְדְּכֶם
  choice: మీ సేవకుడి దగ్గరగా వచ్చారు
  rationale: అక్షరార్థంలో ‘మీ సేవకుని మీదుగా/దగ్గరగా దాటివచ్చారు’; సందర్భంలో అబ్రాహాము ఉన్న చోటికి ప్రయాణికులు చేరడాన్ని సూచిస్తుంది. ‘దగ్గరగా వచ్చారు’ తెలుగు ఆతిథ్య సందర్భంలో స్పష్టంగా ఉంది.
- source_word: עַבְדְּכֶם
  choice: మీ సేవకుడు
  rationale: ఇది బానిసత్వ స్థితిని చెప్పడం కాక, అబ్రాహాము తనను తాను వినయంగా సంబోధించుకోవడం; ‘మీ సేవకుడు’ ఆ సామాజిక మర్యాదను నిలుపుతుంది.
- source_word: כֵּן תַּעֲשֶׂה כַּאֲשֶׁר דִּבַּרְתָּ
  choice: నీవు చెప్పినట్టే చేయి
  rationale: అతిథుల సంక్షిప్త సమ్మతిని సహజ తెలుగులో నేరుగా వ్యక్తం చేస్తుంది; כֵּן యొక్క అంగీకార భావం ‘చెప్పినట్టే’లో వ్యక్తమవుతుంది.
