  rationale: The revision repairs the unmatched quotation mark, makes the visitors’ coming to Abraham more precise, explicitly expresses their assent, and avoids the small interpretive expansion “మీ ప్రయాణం.” It preserves the Hebrew’s modest hospitality offer, food idiom, deferential “your servant,” and travel continuation.
