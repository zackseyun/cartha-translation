id: GEN.18.17
reference: Genesis 18:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַֽ/יהֹוָ֖ה אָמָ֑ר הַֽ/מְכַסֶּ֤ה אֲנִי֙ מֵֽ/אַבְרָהָ֔ם אֲשֶׁ֖ר אֲנִ֥י עֹשֶֽׂה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/017.yaml
  text: And Yahweh said[a], “Shall I hide from Abraham what I am doing?”
translation:
  language: te
  text: 'యాహ్వే ఇలా అన్నాడు[a]: “నేను చేస్తున్నది అబ్రాహాముకు తెలియకుండా దాచాలా?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, మరింత అక్షరార్థంగా: “నేను చేస్తున్నది అబ్రాహాము నుండి దాస్తున్నానా?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַֽ/יהֹוָה
  choice: యెహోవా
  rationale: హీబ్రూ ఒడంబడిక నామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో సుపరిచితమైన లిప్యంతరీకరణతో అందించాం.
- source_word: אָמָר
  choice: ఇలా అన్నాడు
  rationale: వయ్యిక్టోల్ రూపం కథనాన్ని ముందుకు నడిపే సాధారణ భూతకాలాన్ని సూచిస్తుంది; తెలుగు కథనశైలిలో ‘ఇలా అన్నాడు’ సహజంగా తదుపరి ప్రత్యక్ష వాక్యాన్ని పరిచయం చేస్తుంది.
- source_word: הַֽ/מְכַסֶּה אֲנִי
  choice: నేను ... దాచాలా?
  rationale: ప్రశ్నార్థక హేతో కూడిన కర్తరి కృదంతం స్వీయాలోచనాత్మక ప్రశ్నను వ్యక్తం చేస్తుంది; ‘దాచాలా?’ ఆ భావాన్ని సహజ తెలుగులో నిలుపుతుంది.
- source_word: מֵֽ/אַבְרָהָם
  choice: అబ్రాహాముకు తెలియకుండా
  rationale: ‘దాచు’తో వచ్చిన מִן విడిపాటు/దూరీకరణ భావాన్ని ఇస్తుంది. తెలుగులో వ్యక్తి నుండి విషయం దాచడాన్ని ‘అతనికి తెలియకుండా దాచడం’ అని సహజంగా వ్యక్తం చేస్తారు.
- source_word: אֲשֶׁר אֲנִי עֹשֶׂה
  choice: నేను చేయబోతున్నది
  rationale: עֹשֶׂה రూపం అక్షరార్థంగా కొనసాగుతున్న క్రియను సూచించగలిగినా, సందర్భంలో త్వరలో జరగనున్న కార్యాన్ని సూచిస్తుంది; ‘చేయబోతున్నది’ ఆ సందర్భార్థాన్ని స్పష్టంగా, సహజంగా అందిస్తుంది.
theological_decisions:
- issue: దైవనామం יהוה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమే ప్రత్యక్షంగా ఉంది. దాన్ని సాధారణ బిరుదుగా మార్చకుండా, తెలుగు బైబిలు పాఠకులకు విస్తృతంగా పరిచయమైన ‘యెహోవా’ రూపాన్ని ఉపయోగించాం.
- issue: దేవుని ప్రశ్నలోని స్వీయాలోచన భావం
  choice: దాచాలా?
  alternative: దాస్తున్నానా?
  rationale: ప్రశ్నార్థక కృదంతం వ్యాకరణపరంగా వర్తమాన భావాన్నీ అనుమతిస్తుంది; అయితే కథాసందర్భంలో ఇది దేవుడు చేయబోయే కార్యాన్ని అబ్రాహాముకు వెల్లడించాలా వద్దా అనే స్వీయాలోచనాత్మక ప్రశ్నగా సహజంగా అర్థమవుతుంది. ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన కథనశైలి. ప్రత్యక్ష దైవనామాన్ని నిలిపి, హీబ్రూ ప్రశ్నలోని నిజమైన వ్యాకరణ ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
