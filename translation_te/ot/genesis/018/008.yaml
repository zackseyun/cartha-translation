source:
  edition: WLC
  text: וַ/יִּקַּ֨ח חֶמְאָ֜ה וְ/חָלָ֗ב וּ/בֶן הַ/בָּקָר֙ אֲשֶׁ֣ר עָשָׂ֔ה וַ/יִּתֵּ֖ן לִ/פְנֵי/הֶ֑ם וְ/הֽוּא עֹמֵ֧ד עֲלֵי/הֶ֛ם תַּ֥חַת הָ/עֵ֖ץ וַ/יֹּאכֵֽלוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/008.yaml
  text: Then he took curds and milk and the calf that he had prepared[a], and set it before them[b]. He stood by them under the tree while they ate.
translation:
  language: te
  text: అప్పుడు అతడు పెరుగు[a], పాలు, సిద్ధం చేసిన దూడమాంసం తీసుకొని వారి ముందు పెట్టాడు. వారు తింటుండగా, అతడు చెట్టు కింద వారి దగ్గర నిలబడి ఉన్నాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘వెన్న’ లేదా ‘మీగడ’; హీబ్రూ పదం చిక్కని పాలపదార్థాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘వారిపై నిలబడి ఉన్నాడు.’ ఇక్కడ ఈ మాట అతిథులకు సేవ చేసేందుకు వారి సమీపంలో నిలబడటాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶמְאָה
  choice: పెరుగు
  rationale: ఈ పదం చిక్కని పాలపదార్థాన్ని సూచిస్తుంది; పశుపోషక నేపథ్యానికి సహజంగా సరిపడే సాధారణ తెలుగు పదంగా ‘పెరుగు’ ఎంచుకున్నాం. అయితే వెన్న లేదా మీగడ అనే అర్థాలూ సందర్భానుసారం సాధ్యమే.
- source_word: חָלָב
  choice: పాలు
  rationale: పాలకు వాడే సాధారణ హీబ్రూ నామవాచకానికి నేరమైన, సహజమైన అనువాదం.
- source_word: וּבֶן הַבָּקָר
  choice: దూడమాంసం
  rationale: అక్షరార్థంగా ‘పశువుల మందకు చెందిన పిల్ల’; ముందు వచనంలో సిద్ధం చేయించిన దూడను ఇక్కడ ఆహారంగా వడ్డిస్తున్నందున తెలుగులో ‘దూడమాంసం’ సందర్భాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: אֲשֶׁר עָשָׂה
  choice: సిద్ధం చేసిన
  rationale: עשה సాధారణంగా ‘చేయు’ అని అర్థమైనా, ఆహార సందర్భంలో ‘సిద్ధం చేసిన’ అనేది ఉద్దేశాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וַיִּתֵּן לִפְנֵיהֶם
  choice: వారి ముందు పెట్టాడు
  rationale: అక్షరార్థంగా ‘వారి ముందు ఇచ్చాడు’; అతిథులకు ఆహారం వడ్డించే సందర్భంలో ‘వారి ముందు పెట్టాడు’ సహజమైన తెలుగు.
- source_word: וְהוּא עֹמֵד עֲלֵיהֶם
  choice: అతడు వారి దగ్గర నిలబడి ఉన్నాడు
  rationale: అక్షరార్థంగా ‘వారిపై/వారి పైన నిలబడి ఉన్నాడు’; ఆతిథ్య సందర్భంలో అతడు వారికి సేవ చేయడానికి సమీపంలో నిలిచివున్నాడనే భావాన్ని ఇది సహజంగా అందిస్తుంది.
- source_word: תַּחַת הָעֵץ
  choice: చెట్టు కింద
  rationale: మూలంలోని స్థాన సూచనకు నేరమైన, సహజమైన అనువాదం.
- source_word: וַיֹּאכֵלוּ
  choice: వారు తింటుండగా
  rationale: హీబ్రూ కథనంలో ‘అప్పుడు వారు తిన్నారు’ అని కూడా అనువదించవచ్చు; అయితే అబ్రాహాము నిలబడి ఉండటం వారి భోజనం జరుగుతున్న సమయంలోనే అని తెలుగులో ఈ రూపం స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ఈ సందర్శకుల తరువాతి క్రైస్తవ తాత్త్విక గుర్తింపును వచనంలోనే ముందుకు తేవాలా
  choice: వచనం చెప్పే ఆతిథ్య సంఘటనను సాధారణ కథన భాషలో అనువదించడం
  alternative: సందర్శకుల దైవిక స్థితిని సూచించేలా సేవా భాషను మరింత మహిమాన్వితంగా అనువదించడం
  rationale: ఈ వచనం ప్రత్యక్షంగా అబ్రాహాము చేసిన ఆతిథ్యాన్ని వివరిస్తుంది. మూలంలో స్పష్టంగా లేని క్రీస్తుసంబంధమైన లేదా త్రిత్వసంబంధమైన నిర్ధారణను అనువాదంలో చేర్చకుండా తాత్త్విక ఉద్రిక్తతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే గౌరవప్రదమైన కథన శైలి. ‘వారు తింటుండగా’ అనే నిర్మాణం హీబ్రూ వాక్యాల కాలసంబంధాన్ని సహజంగా తెలియజేస్తుంది; [a], [b] సూచికలు ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
