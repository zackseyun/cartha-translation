  to: అప్పుడు వారు అతనితో, “నీ భార్య శారా ఎక్కడ ఉంది?” అని అడిగారు. అతడు, “ఇదిగో, ఆమె గుడారంలో ఉంది” అన్నాడు.
  rationale: The revision retains the narrative sequence and all source information, while rendering the concise Hebrew deictic answer in natural Telugu. The supplied ‘ఆమె ... ఉంది’ only expresses the subject and copula already understood from the Hebrew context; ‘ఇదిగో’ conveys הִנֵּה more closely than the merely distal ‘అక్కడ.’
