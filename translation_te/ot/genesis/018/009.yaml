id: GEN.18.9
reference: Genesis 18:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּאמְר֣וּ אֵׄלָׄ֔יׄ/וׄ אַיֵּ֖ה שָׂרָ֣ה אִשְׁתֶּ֑/ךָ וַ/יֹּ֖אמֶר הִנֵּ֥ה בָ/אֹֽהֶל׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/009.yaml
  text: Then they said to him[a], “Where is Sarah your wife?” And he said, “There, in the tent.”
translation:
  language: te
  text: అప్పుడు వారు అతనితో, “నీ భార్య శారా ఎక్కడ ఉంది?” అని అడిగారు. అతడు, “ఇదిగో, ఆమె గుడారంలో ఉంది” అన్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: అప్పుడు వారు … అడిగారు
  rationale: వావ్-కన్సెక్యూటివ్ కథనంలోని తదుపరి సంఘటనను సూచిస్తుంది. ప్రశ్న ఉన్నందున తెలుగులో ‘అడిగారు’ అనడం సహజంగా ఉంది; బహువచనాన్ని ‘వారు’ నిలుపుతుంది.
- source_word: אֵלָיו
  choice: అతనితో
  rationale: אֶל అనే ఉపసర్గతో కూడిన మూడవ పురుష ఏకవచన ప్రత్యయం మాట అబ్రాహాము వైపు ఉద్దేశించబడిందని సూచిస్తుంది; తెలుగులో ‘అతనితో’ సహజ ప్రయోగం.
- source_word: אַיֵּה
  choice: ఎక్కడ ఉంది
  rationale: ఇది స్థలాన్ని అడిగే ప్రశ్నార్థక క్రియావిశేషణం. తెలుగులో పూర్తి ప్రశ్నగా ‘ఎక్కడ ఉంది?’ సహజంగా ఉంటుంది.
- source_word: שָׂרָה
  choice: శారా
  rationale: హీబ్రూ వ్యక్తినామాన్ని ఆధునిక ప్రామాణిక తెలుగు లిప్యంతరీకరణలో ఇచ్చాం.
- source_word: אִשְׁתֶּךָ
  choice: నీ భార్య
  rationale: ‘భార్య’ అనే నామవాచకానికి రెండవ పురుష ఏకవచన ప్రత్యయం జతైన రూపం; అబ్రాహామును ఉద్దేశించిన ఏకవచన సంబోధనను ‘నీ’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: וַיֹּאמֶר
  choice: అతడు … అన్నాడు
  rationale: ఏకవచన క్రియారూపం అబ్రాహాము ఇచ్చిన జవాబును సూచిస్తుంది. ‘అన్నాడు’ సంక్షిప్త సమాధానానికి సహజమైన తెలుగు కథన రూపం.
- source_word: הִנֵּה
  choice: అక్కడ
  rationale: ఈ సందర్భంలో హిన్నే స్థలాన్ని చూపిస్తూ సమాధానాన్ని ముందుకు తెస్తుంది. ‘అక్కడ’ దాని స్థలసూచక భావాన్ని సహజంగా అందిస్తుంది; ‘ఇదిగో’ ఇక్కడ అనవసరంగా ప్రత్యక్షంగా కనిపిస్తున్న భావాన్ని కలిగించవచ్చు.
- source_word: בָאֹהֶל
  choice: గుడారంలో
  rationale: ב ఉపసర్గ మరియు నిర్దిష్ట אֹהֶל కలిపి ‘ఆ గుడారంలో/in the tent’ అనే అర్థాన్ని ఇస్తాయి. సందర్భంలో తెలుగులో ‘గుడారంలో’ సరిపోతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. హీబ్రూలోని చివరి సంక్షిప్త, క్రియారహిత సమాధానాన్ని ‘అక్కడ, గుడారంలో’గా అలాగే సంక్షిప్తంగా ఉంచి, ‘ఆమె ఉంది’ అని మూలంలో లేని పదాలను చేర్చలేదు.
