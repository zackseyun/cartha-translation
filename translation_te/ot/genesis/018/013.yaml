source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר יְהוָ֖ה אֶל אַבְרָהָ֑ם לָ֣/מָּה זֶּה֩ צָחֲקָ֨ה שָׂרָ֜ה לֵ/אמֹ֗ר הַ/אַ֥ף אֻמְנָ֛ם אֵלֵ֖ד וַ/אֲנִ֥י זָקַֽנְתִּי־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/013.yaml
  text: And the LORD said to Abraham, “Why did Sarah laugh, saying, ‘Will I really bear a child, now that I am old?’”
translation:
  language: te
  text: యెహోవా అబ్రాహాముతో, “నేను వృద్ధురాలినైన నేను నిజంగానే బిడ్డను కంటానా? అని శారా ఎందుకు నవ్వింది?” అన్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: యెహోవా
  rationale: మూలపాఠంలోని దేవుని వ్యక్తిగత నామాన్ని తెలుగు పాఠకులకు సుపరిచితమైన రూపంలో ప్రత్యక్షంగా నిలిపింది.
- source_word: הַאַף אֻמְנָם
  choice: నిజంగానే … కంటానా?
  rationale: ప్రశ్నలోని ఆశ్చర్యం, సందేహం మరియు ఉద్ఘాటనను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אֵלֵד
  choice: బిడ్డను కంటానా
  rationale: క్రియకు అక్షరార్థంగా ‘నేను కంటానా’ అనవచ్చు; తెలుగులో అర్థం సహజంగా, స్పష్టంగా ఉండేందుకు సందర్భంలో అంతర్లీనంగా ఉన్న ‘బిడ్డను’ చేర్చింది.
- source_word: וַאֲנִי זָקַנְתִּי
  choice: నేను ముసలిదానినయ్యాక
  rationale: ‘నేను ముసలిదానినయ్యాను’ అనే స్థితిని ప్రశ్నకు కారణమైన కాలసంబంధ నేపథ్యంగా సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: దైవనామం యొక్క అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: WLCలో יהוה స్పష్టంగా ఉన్నందున దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా నిలిపింది; దీనివల్ల ఏ ప్రత్యేక సంప్రదాయ వ్యాఖ్యానాన్నీ చేర్చడం లేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్యనిర్మాణం. శారా మాటలలోని సందేహం మరియు ఉద్ఘాటనను అతివ్యాఖ్యానం చేయకుండా నిలిపింది.
