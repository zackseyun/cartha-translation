  text: וַ/יִּגַּ֥שׁ אַבְרָהָ֖ם וַ/יֹּאמַ֑ר הַ/אַ֣ף תִּסְפֶּ֔ה צַדִּ֖יק עִם רָשָֽׁע־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/023.yaml
  text: Then Abraham came near and said[a], “Will you indeed sweep away the righteous with the wicked?”
translation:
  language: te
  text: 'అప్పుడు అబ్రాహాము సమీపించి ఇలా అన్నాడు: “నీతిమంతుణ్ణి దుష్టునితోపాటు నిజంగానే తుడిచిపెట్టేస్తావా?[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నాశనం చేస్తావా?” లేదా “నిర్మూలిస్తావా?”; హీబ్రూ క్రియ తీర్పులో తొలగించడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגַּשׁ
  choice: దగ్గరకు వచ్చి
  rationale: נגשׁ సమీపించడం లేదా దగ్గరకు రావడం అనే అర్థాన్ని ఇస్తుంది. అబ్రాహాము విజ్ఞాపన చేయడానికి ముందుకు వచ్చిన భౌతిక, వాక్చాతుర్యపూర్వక కదలికను ఈ ఎంపిక సహజంగా నిలుపుతుంది.
- source_word: אַבְרָהָם
  choice: అబ్రాహాము
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: וַיֹּאמַר
  choice: అని అడిగాడు
  rationale: אמר సాధారణంగా ‘అన్నాడు’ అని అర్థమైనా, ఇక్కడ అనుసరించే మాట ప్రశ్న కావడంతో ఆధునిక తెలుగులో ‘అని అడిగాడు’ సహజంగా ఉంటుంది.
- source_word: הַאַף
  choice: నిజంగానే
  rationale: ప్రశ్నార్థక కణంతో కూడిన אַף ప్రశ్నకు తీవ్రతను ఇస్తుంది. ‘నిజంగానే’ అబ్రాహాము ఆశ్చర్యంతో కూడిన విజ్ఞాపనను అతిగా వ్యాఖ్యానించకుండా వ్యక్తపరుస్తుంది.
- source_word: תִּסְפֶּה
  choice: తుడిచిపెట్టేస్తావా
  rationale: ספה తీర్పులో తొలగించడం, పూర్తిగా నాశనం చేయడం అనే భావాన్ని ఇస్తుంది. ‘తుడిచిపెట్టు’ హీబ్రూ క్రియలోని సజీవమైన రూపకాన్ని తెలుగులో నిలుపుతుంది.
- source_word: צַדִּיק
  choice: నీతిమంతుణ్ణి
  rationale: ఏకవచన రూపాన్ని నిలుపుతూ, న్యాయపరమైన మరియు నైతిక వర్గాన్ని సూచించే సహజ తెలుగు పదం.
- source_word: עִם
  choice: దుష్టునితోపాటు
  rationale: ‘తోపాటు’ తీర్పులో ఇద్దరికీ ఒకే గతి కలగడం అనే עִם భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: רָשָׁע
  choice: దుష్టుని
  rationale: ఏకవచన నైతిక వర్గంగా צַדִּיק కు సమాంతరంగా నిలిచే పారదర్శక తెలుగు ఎంపిక.
theological_decisions:
- issue: ఏకవచన నైతిక వర్గాలు
  choice: צַדִּיק, רָשָׁע రూపాలను ‘నీతిమంతుడు’, ‘దుష్టుడు’ అనే ఏకవచన వర్గపదాలుగా అనువదించడం.
  alternative: వాటిని బహువచనంగా ‘నీతిమంతులు’, ‘దుష్టులు’ అని అనువదించడం.
  rationale: హీబ్రూలో రెండూ ఏకవచనంలో ఉండి సాధారణ నైతిక వర్గాలను ప్రతినిధిగా సూచిస్తున్నాయి. తెలుగు ఏకవచనం ఆ రూపాన్ని, దైవన్యాయాన్ని గురించిన సూత్రప్రాయ ప్రశ్నను రెండింటినీ నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. ప్రశ్నలోని తీవ్రతను ‘నిజంగానే’ ద్వారా, హీబ్రూ ఏకవచన సమాంతరతను ‘నీతిమంతుణ్ణి—దుష్టునితోపాటు’ ద్వారా నిలిపాం.
