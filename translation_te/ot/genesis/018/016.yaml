source:
  edition: WLC
  text: וַ/יָּקֻ֤מוּ מִ/שָּׁם֙ הָֽ/אֲנָשִׁ֔ים וַ/יַּשְׁקִ֖פוּ עַל פְּנֵ֣י סְדֹ֑ם וְ/אַ֨בְרָהָ֔ם הֹלֵ֥ךְ עִמָּ֖/ם לְ/שַׁלְּחָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/016.yaml
  text: Then the men rose up from there and looked down toward Sodom[b][a], and Abraham was walking with them to send them on their way.
translation:
  language: te
  text: అప్పుడు ఆ మనుషులు అక్కడి నుండి లేచి, సొదొమ వైపు కిందికి చూశారు[a]. అబ్రాహాము వారిని సాగనంపడానికి[b] వారితో పాటు నడుస్తున్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సొదొమ వైపు చూశారు.” హీబ్రూ క్రియ ఎత్తైన ప్రదేశం నుండి బయటకు లేదా కిందికి చూడడాన్ని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “వారిని పంపించడానికి.” హీబ్రూ వ్యక్తీకరణ వెళ్లిపోతున్న అతిథులతో పాటు వెళ్లి వారిని ముందుకు పంపించడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֻמוּ
  choice: లేచి
  rationale: קום అనే క్రియకు ఇక్కడ ‘లేచారు’ అనే ప్రాథమిక భావం ఉంది; భోజనం, సంభాషణ జరిగిన స్థలం నుండి కథ ముందుకు కదలడాన్ని ఇది సహజంగా తెలియజేస్తుంది.
- source_word: מִשָּׁם
  choice: అక్కడి నుండి
  rationale: స్థలమార్పును తెలిపే సూటి, సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: הָאֲנָשִׁים
  choice: ఆ మనుషులు
  rationale: హీబ్రూ మూలంలో సాధారణంగా ‘మనుషులు/పురుషులు’ అనే పదమే ఉంది. వారిని ‘దూతలు’ అని ముందుగానే గుర్తించకుండా కథనంలోని ఉద్దేశపూర్వక ఉద్వేగాన్ని నిలుపుతుంది.
- source_word: וַיַּשְׁקִפוּ
  choice: కిందికి చూశారు
  rationale: שׁקף అనే క్రియ సాధారణంగా ఎత్తైన ప్రదేశం నుండి బయటకు లేదా కిందికి చూడడాన్ని సూచిస్తుంది; ‘కిందికి’ అనేది సంభావ్య భౌగోళిక భావాన్ని ప్రతిబింబిస్తుంది.
- source_word: עַל־פְּנֵי סְדֹם
  choice: సొదొమ వైపు
  rationale: ఈ హీబ్రూ నుడికారం సొదొమ దిశగా చూడడాన్ని సూచిస్తుంది; ‘వైపు’ ఆధునిక తెలుగులో సహజమైన దిశార్థక ప్రయోగం.
- source_word: הֹלֵךְ עִמָּם
  choice: వారితో పాటు నడుస్తున్నాడు
  rationale: వర్తమాన కృదంతం కొనసాగుతున్న సహచర్య చర్యను సూచిస్తుంది; అందువల్ల ‘నడుస్తున్నాడు’ అనే రూపం దాని కాలవ్యాప్తిని నిలుపుతుంది.
- source_word: לְשַׁלְּחָם
  choice: వారిని సాగనంపడానికి
  rationale: వెళ్లిపోతున్న అతిథులతో కొంతదూరం వెళ్లి వారిని పంపించే ఆతిథ్య ఆచారాన్ని ‘సాగనంపడం’ సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: הָאֲנָשִׁים అనే వారి గుర్తింపు
  choice: ప్రధాన పాఠ్యంలో ‘ఆ మనుషులు’
  alternative: ‘ఆ సందర్శకులు’ లేదా ‘ఆ దూతలు’
  rationale: ఈ వచనంలోని హీబ్రూ వారిని సాధారణ పదమైన ‘మనుషులు’ అని పిలుస్తుంది. ‘దూతలు’ అని అనువదించడం ఈ దశలో కథనం ఇంకా స్పష్టంగా చెప్పని గుర్తింపును ముందుగానే నిర్ణయిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘ఆ మనుషులు’ మూలపాఠ్యంలోని సాధారణ నామాన్ని, కథన ఉద్వేగాన్ని నిలుపుతుంది. ‘సాగనంపడానికి’ ఆతిథ్య సందర్భాన్ని సామాన్య పాఠకునికి సహజంగా అందిస్తుంది.
