id: GEN.18.19
reference: Genesis 18:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּ֣י יְדַעְתִּ֗י/ו לְמַעַן֩ אֲשֶׁ֨ר יְצַוֶּ֜ה אֶת בָּנָ֤י/ו וְ/אֶת בֵּית/וֹ֙ אַחֲרָ֔י/ו וְ/שָֽׁמְרוּ֙ דֶּ֣רֶךְ יְהוָ֔ה לַ/עֲשׂ֥וֹת צְדָקָ֖ה וּ/מִשְׁפָּ֑ט לְמַ֗עַן הָבִ֤יא יְהוָה֙ עַל אַבְרָהָ֔ם אֵ֥ת אֲשֶׁר דִּבֶּ֖ר עָלָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/019.yaml
  text: For I have known him[a], so that he may command his children and his household after him, and they may keep the way of Yahweh by doing righteousness and justice[d][c][b], so that Yahweh may bring upon Abraham what he has spoken concerning him.
translation:
  language: te
  text: ఎందుకంటే, అతడు తన కుమారులకూ తన తరువాతి ఇంటివారికీ ఆజ్ఞాపించి, వారు నీతినీ న్యాయాన్నీ ఆచరిస్తూ యాహ్వే మార్గాన్ని[c] పాటించేలా నేను అతణ్ణి ఎరిగాను[a]. తద్వారా యాహ్వే అబ్రాహాము గురించి తాను చెప్పినదాన్ని[d] అతనిమీదికి తీసుకురావడానికి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నేను అతణ్ణి ఎన్నుకున్నాను.” హీబ్రూ క్రియకు సాధారణంగా “ఎరుగుట” అని అర్థం; అయితే ఈ సందర్భంలో అది ప్రత్యేకంగా గుర్తించడం లేదా ఎన్నుకోవడం అనే భావాన్ని కూడా కలిగి ఉండవచ్చు.
    reason: alternative_reading
  - marker: c
    text: అంటే, యాహ్వే కోరే జీవన విధానం.
    reason: cultural_note
  - marker: d
    text: లేదా, “అతనికి వాగ్దానం చేసినదాన్ని.” హీబ్రూ వాక్యం మరింత అక్షరార్థంగా, “అతని గురించి తాను చెప్పినదాన్ని” అంటుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి వాక్యానికి కారణాన్ని పరిచయం చేసే వివరణాత్మక భావాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: יְדַעְתִּיו
  choice: నేను అతణ్ణి ఎరిగాను
  rationale: ידע అనే క్రియ యొక్క ప్రాథమిక భావమైన ‘ఎరుగుట/తెలుసుకొనుట’ను నిలుపుతుంది; సందర్భంలోని ప్రత్యేక అనుగ్రహం లేదా ఎంపిక భావాన్ని ప్రధాన పాఠ్యంలో బలవంతంగా నిర్ణయించదు.
- source_word: לְמַעַן אֲשֶׁר
  choice: అతడు … చేసేలా
  rationale: హీబ్రూ పదబంధంలోని ఉద్దేశం లేదా ఫలిత భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: יְצַוֶּה
  choice: ఆజ్ఞాపించేలా
  rationale: పియేల్ రూపంలోని బలమైన ‘ఆజ్ఞాపించు/నియోగించు’ భావాన్ని కాపాడుతుంది.
- source_word: בָּנָיו
  choice: తన కుమారులకు
  rationale: మూలంలోని పుంలింగ బహువచనాన్ని స్పష్టంగా నిలుపుతుంది; తరువాత వచ్చే ‘ఇంటివారు’ అనే మాట పరిధిని విస్తరిస్తుంది.
- source_word: בֵּיתוֹ
  choice: తన ఇంటివారికి
  rationale: ఇక్కడ భవనాన్ని కాక అబ్రాహాము కుటుంబ-గృహ పరిధిలోని ప్రజలను సూచిస్తుంది.
- source_word: וְשָׁמְרוּ
  choice: పాటించేలా
  rationale: ‘మార్గం’తో వాడినప్పుడు నమ్మకంగా అనుసరించడం లేదా ఆచరించడం అనే שׁמר భావాన్ని సహజంగా అందిస్తుంది.
- source_word: דֶּרֶךְ יְהוָה
  choice: యాహ్వే మార్గాన్ని
  rationale: యాహ్వే కోరే జీవన విధానాన్ని సూచించే నైతిక-ఒడంబడిక సంబంధమైన రూపకాన్ని నిలుపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో లిప్యంతరీకరిస్తుంది.
- source_word: לַעֲשׂוֹת צְדָקָה וּמִשְׁפָּט
  choice: నీతినీ న్యాయాన్నీ ఆచరిస్తూ
  rationale: యాహ్వే మార్గాన్ని ఎలా పాటిస్తారో తెలియజేసే సాధనార్థక భావాన్ని వ్యక్తపరుస్తూ, צְדָקָה మరియు מִשְׁפָּט అనే రెండు భావాలను వేరుగా నిలుపుతుంది.
- source_word: לְמַעַן
  choice: తద్వారా
  rationale: చివరి ఉద్దేశం లేదా ఫలితాన్ని సూచించే రెండవ ప్రయోజన వాక్యాన్ని మొదటి దానితో కలుపుతుంది.
- source_word: הָבִיא ... עַל
  choice: అతనికి కలుగజేస్తాడు
  rationale: ‘మీదికి తీసుకురావడం’ అనే హీబ్రూ రూపాన్ని అసహజంగా అనుకరించకుండా, చెప్పబడినది అబ్రాహాముకు సంభవించేలా చేయడం అనే భావాన్ని అందిస్తుంది.
- source_word: אֲשֶׁר דִּבֶּר עָלָיו
  choice: అబ్రాహాము గురించి తాను చెప్పినదాన్ని
  rationale: ‘వాగ్దానం చేసినది’ అని ముందుగానే వ్యాఖ్యానించకుండా, ‘అతని గురించి చెప్పినది’ అనే మూలంలోని విస్తృతమైన మాటను నిలుపుతుంది.
theological_decisions:
- issue: ידע అనే క్రియను ‘ఎరిగాను’గా అనువదించాలా, ‘ఎన్నుకున్నాను’గా అనువదించాలా
  choice: నేను అతణ్ణి ఎరిగాను
  alternative: నేను అతణ్ణి ఎన్నుకున్నాను
  rationale: సందర్భంలో ప్రత్యేక అనుగ్రహం, ఎంపిక అనే అంతర్భావం ఉండవచ్చు; అయినా క్రియ యొక్క ప్రత్యక్ష అర్థం ‘ఎరుగుట’. ప్రధాన పాఠ్యం ఆ అర్థాన్ని నిలుపుతూ, వ్యాఖ్యానాత్మక ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇస్తుంది.
- issue: יְהוָה అనే దైవనామాన్ని ఎలా అందించాలి
  choice: యాహ్వే
  alternative: ప్రభువు
  rationale: మూలపాఠ్యంలో వ్యక్తిగత దైవనామం ప్రత్యక్షంగా ఉంది; దానిని బిరుదుతో భర్తీ చేయకుండా లిప్యంతరీకరించడం మూలరూపాన్ని కాపాడుతుంది.
- issue: చివరి దైవకార్యాన్ని ‘నెరవేర్చడం’గా స్పష్టీకరించాలా
  choice: అతనికి కలుగజేస్తాడు
  alternative: అతనికి వాగ్దానం చేసినదాన్ని నెరవేరుస్తాడు
  rationale: ‘నెరవేర్చడం/వాగ్దానం’ సందర్భానుకూలమైనప్పటికీ, హీబ్రూ మరింత విస్తృతంగా ‘అతని గురించి చెప్పినదాన్ని అతని మీదికి తీసుకురావడం’ అంటుంది. ఎంపిక చేసిన రూపం ఆ కారణక భావాన్ని సహజమైన తెలుగులో ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలిని ఉపయోగించాం. ‘ఎరిగాను’ అనే కొద్దిగా సాహిత్యపూర్వకమైన రూపం సంబంధజ్ఞానాన్ని నిలుపుతుంది; మిగతా వాక్య నిర్మాణం సహజంగా ఉంది. ఉద్దేశాన్ని సూచించే రెండు לְמַעַן భాగాల మధ్య సంబంధాన్ని ‘చేసేలా … తద్వారా’తో స్పష్టంగా ఉంచాం.
