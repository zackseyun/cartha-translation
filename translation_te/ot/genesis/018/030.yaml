source:
  edition: WLC
  text: וַ֠/יֹּאמֶר אַל נָ֞א יִ֤חַר לַֽ/אדֹנָ/י֙ וַ/אֲדַבֵּ֔רָה אוּלַ֛י יִמָּצְא֥וּ/ן שָׁ֖ם שְׁלֹשִׁ֑ים וַ/יֹּ֨אמֶר֙ לֹ֣א אֶֽעֱשֶׂ֔ה אִם אֶמְצָ֥א שָׁ֖ם שְׁלֹשִֽׁים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/030.yaml
  text: Then he said[a], “Please, let not my Lord be angry, and I will speak. Perhaps thirty will be found there.” And he said, “I will not do it if I find thirty there.”
translation:
  language: te
  text: అప్పుడు అతడు, “నా ప్రభువా[a], దయచేసి కోపగించుకోకండి; నేను మాట్లాడనివ్వండి. ఒకవేళ అక్కడ ముప్పైమంది దొరికితే?” అన్నాడు. అందుకు ఆయన, “అక్కడ ముప్పైమంది నాకు దొరికితే, నేను అలా చేయను” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో “నా ప్రభువా” అనే మాటను గౌరవపూర్వకంగా “నా యజమానీ” అని కూడా అనువదించవచ్చు. సందర్భాన్ని బట్టి సంబోధితుడు ప్రభువేనని అర్థం చేసుకొని ప్రధాన పాఠంలో “నా ప్రభువా” అని ఇచ్చాం.
    reason: alternative_reading
lexical_decisions:
- source_word: אַל נָא יִחַר
  choice: కోపం రాకూడదు
  rationale: హీబ్రూ వాక్యప్రయోగంలో ‘మండడం’ కోపాన్ని సూచిస్తుంది; నָא లోని వినయపూర్వక వేడుకోలును సందర్భం, ‘నన్ను మాట్లాడనివ్వండి’ అనే గౌరవపూర్వక రూపం సహజంగా తెలియజేస్తాయి.
- source_word: לַאדֹנָי
  choice: నా ప్రభువుకు
  rationale: మొదటి పురుష ఏకవచన సంబంధార్థంతో కూడిన గౌరవ సంబోధనను నిలుపుతుంది. సందర్భంలో దైవిక సంభాషితుడిని సూచించినా, మూలంలోని బిరుదును దేవుని నామంగా మార్చదు.
- source_word: וַאֲדַבֵּרָה
  choice: నన్ను మాట్లాడనివ్వండి
  rationale: కోహోర్టేటివ్ రూపంలోని వినయపూర్వక అనుమతి/ఉద్దేశ భావాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אוּלַי
  choice: ఒకవేళ ... ఏమో
  rationale: అబ్రాహాము మాటలోని అనిశ్చితమైన, వినయపూర్వక ఊహను సహజ తెలుగులో నిలుపుతుంది.
- source_word: יִמָּצְאוּן
  choice: కనిపిస్తారేమో
  rationale: מצא నిఫాల్ రూపంలోని ‘కనబడడం/దొరకడం’ అనే భావాన్ని, వ్యక్తుల విషయంలో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: שָׁם
  choice: అక్కడ
  rationale: సరళమైన స్థలవాచక క్రియావిశేషణానికి నేరమైన సమానం.
- source_word: שְׁלֹשִׁים
  choice: ముప్పై మంది
  rationale: సంఖ్యను యథాతథంగా ఇస్తూ, సందర్భంలో నీతిమంతులైన వ్యక్తులు ఉద్దేశించబడ్డారని తెలుగు వ్యక్తివాచక ప్రత్యయం స్పష్టం చేస్తుంది.
- source_word: לֹא אֶעֱשֶׂה
  choice: నేను అలా చేయను
  rationale: కర్మ మూలంలో అవ్యక్తంగా ఉంది; మునుపటి సందర్భంలో చెప్పిన నగరనాశన చర్యను అవసరానికి మించి వివరించకుండా సూచిస్తుంది.
- source_word: אִם אֶמְצָא
  choice: నాకు కనిపిస్తే
  rationale: షరతును స్పష్టంగా నిలుపుతూ, దేవుడు వెదికి కనుగొనే భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: అబ్రాహాము సంబోధనలో אֲדֹנָי అనువాదం
  choice: నా ప్రభువు
  alternative: నా యజమాని
  rationale: ఈ దైవదర్శన సందర్భంలో సంభాషితుడు ప్రభువుగా అర్థమవుతున్నాడు. అయినా మూలంలో ఉన్నది బిరుదే గాని నిబంధన నామం కాదు; కాబట్టి ‘ప్రభువు’ అని అనువదించి ఆ భేదాన్ని నిలిపాం. హీబ్రూ రూపం గౌరవార్థక మానవ సంబోధనగానూ చదవదగినందున ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవపూర్వకమైన, సహజమైన సంభాషణ శైలిని వాడాం. అబ్రాహాము వినయాన్ని బహువచన గౌరవ క్రియారూపంతో, దేవుని ప్రత్యుత్తరాన్ని ప్రత్యక్షమైన ఏకవచన రూపంతో తెలిపాం. పాదటిప్పణి గుర్తు సంబంధిత సంబోధన ఉన్న వాక్యాంతంలో ఉంచబడింది.
