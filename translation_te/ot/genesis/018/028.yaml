id: GEN.18.28
reference: Genesis 18:28
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: א֠וּלַי יַחְסְר֞וּ/ן חֲמִשִּׁ֤ים הַ/צַּדִּיקִם֙ חֲמִשָּׁ֔ה הֲ/תַשְׁחִ֥ית בַּ/חֲמִשָּׁ֖ה אֶת כָּל הָ/עִ֑יר וַ/יֹּ֨אמֶר֙ לֹ֣א אַשְׁחִ֔ית אִם אֶמְצָ֣א שָׁ֔ם אַרְבָּעִ֖ים וַ/חֲמִשָּֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/028.yaml
  text: Suppose five of the fifty righteous are lacking—will you destroy the whole city for five? And he said[c][b][a], “I will not destroy it if I find forty-five there.”
translation:
  language: te
  text: ఒకవేళ యాభైమంది నీతిమంతులకు ఐదుగురు తక్కువైతే, ఆ ఐదుగురి కొరతవల్ల పట్టణమంతటినీ నాశనం చేస్తావా? అప్పుడు ఆయన, “అక్కడ నలభై ఐదుగురిని కనుగొంటే, దాన్ని నాశనం చేయను” అన్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אוּלַי
  choice: ఒకవేళ
  rationale: అబ్రాహాము ప్రతిపాదిస్తున్న ఊహాత్మక పరిస్థితిని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: יַחְסְרוּן חֲמִשִּׁים הַצַּדִּיקִם חֲמִשָּׁה
  choice: యాభైమంది నీతిమంతులలో ఐదుగురు తక్కువైతే
  rationale: అవసరమైన యాభై అనే సంఖ్యలో ఐదుగురి కొరత ఉందనే భావాన్ని స్పష్టంగా, సహజంగా అందిస్తుంది; ఐదుగురు నిర్దిష్ట వ్యక్తులు గైర్హాజరయ్యారనే ఉద్దేశాన్ని బలవంతంగా చేర్చదు.
- source_word: הַצַּדִּיקִם
  choice: నీతిమంతులు
  rationale: హీబ్రూ పదంలోని నైతిక, న్యాయపరమైన భావబరువును నిలుపుకునే ప్రామాణిక తెలుగు పదం.
- source_word: הֲתַשְׁחִית
  choice: నాశనం చేస్తావా
  rationale: హిఫిల్ రూపంలోని ‘నాశనం చేయు’ భావాన్ని నేరుగా అందిస్తూ, దేవుని జవాబులోని అదే క్రియతో అనుసంధానాన్ని కాపాడుతుంది.
- source_word: בַּחֲמִשָּׁה
  choice: ఆ ఐదుగురు తక్కువైనందుకు
  rationale: ב ఇక్కడ కారణం లేదా నిమిత్తాన్ని సూచిస్తుంది. తెలుగులో కేవలం ‘ఐదుగురి కోసం’ అనడం అస్పష్టంగా ఉండవచ్చు కాబట్టి, సంఖ్యలోని కొరతే ప్రశ్నకు కారణమని స్పష్టం చేస్తుంది.
- source_word: אֶת כָּל הָעִיר
  choice: పట్టణమంతటినీ
  rationale: మొత్తం పట్టణం అనే సంపూర్ణతను సహజమైన తెలుగు సమాసరూపంలో నిలుపుతుంది.
- source_word: לֹא אַשְׁחִית
  choice: దాన్ని నాశనం చేయను
  rationale: క్రియకు సూచిత కర్మగా పట్టణాన్ని ‘దాన్ని’తో స్పష్టం చేస్తూ, ముందటి ‘నాశనం చేస్తావా’తో పదపునరుక్తిని కాపాడుతుంది.
- source_word: אִם אֶמְצָא שָׁם אַרְבָּעִים וַחֲמִשָּׁה
  choice: అక్కడ నలభై ఐదుగురు నాకు కనిపిస్తే
  rationale: షరతు నిర్మాణం, ‘అక్కడ’ అనే స్థలసూచన, నలభై ఐదు అనే సంఖ్యను సహజ తెలుగు వాక్యక్రమంలో అందిస్తుంది.
theological_decisions:
- issue: צַדִּיקִים పదానికి అనువాదం
  choice: నీతిమంతులు
  alternative: న్యాయవంతులు
  rationale: ‘నీతిమంతులు’ అనే పదం ఈ విజ్ఞాపన సందర్భంలోని నైతిక మరియు న్యాయపరమైన విస్తృతిని నిలుపుతుంది; ‘న్యాయవంతులు’ ఆధునిక తెలుగులో న్యాయనిర్ణయం చేసే వ్యక్తులనే సూచించే అవకాశం ఉంది.
- issue: యాభైలో ఐదుగురి కొరత స్వరూపం
  choice: యాభైమంది నీతిమంతులలో ఐదుగురు తక్కువైతే
  alternative: యాభైమంది నీతిమంతులు ఐదుగురు తక్కువగా ఉంటే
  rationale: హీబ్రూ వాక్యం యాభై అనే అవసరమైన సంఖ్య ఐదుతో తగ్గిందని సూచిస్తుంది. ఎంపిక చేసిన రూపం ఆ సంఖ్యాత్మక కొరతను సహజంగా తెలుపుతుంది; నిర్దిష్ట ఐదుగురు ఎవరో అనే సిద్ధాంతపరమైన ఊహను చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకుడికి సులభంగా అర్థమయ్యే శైలి. దేవునికి అబ్రాహాము నేరుగా సంభోదించే ఏకవచన క్రియను మూలానికి అనుగుణంగా ఉంచి, కథనంలో ‘ఆయన’ వాడబడింది.
