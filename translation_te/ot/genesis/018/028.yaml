revisions:
- from: ఒకవేళ యాభైమంది నీతిమంతులలో ఐదుగురు తక్కువైతే, ఆ ఐదుగురు తక్కువైనందుకు పట్టణమంతటినీ నాశనం చేస్తావా? అప్పుడు ఆయన, “అక్కడ నలభై ఐదుగురు నాకు కనిపిస్తే, దాన్ని నాశనం చేయను” అన్నాడు.
  to: ఒకవేళ యాభైమంది నీతిమంతులకు ఐదుగురు తక్కువైతే, ఆ ఐదుగురి కొరతవల్ల పట్టణమంతటినీ నాశనం చేస్తావా? అప్పుడు ఆయన, “అక్కడ నలభై ఐదుగురిని కనుగొంటే, దాన్ని నాశనం చేయను” అన్నాడు.
  rationale: The revision corrects the rendering of ‘find’ and modestly refines the numerical-shortfall wording for clarity. It retains the original conditional, the repeated ‘five,’ the direct singular address, the total destruction of the city, and the repeated destruction terminology.
