id: GEN.18.1
reference: Genesis 18:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֵּרָ֤א אֵלָי/ו֙ יְהוָ֔ה בְּ/אֵלֹנֵ֖י מַמְרֵ֑א וְ/ה֛וּא יֹשֵׁ֥ב פֶּֽתַח הָ/אֹ֖הֶל כְּ/חֹ֥ם הַ/יּֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/001.yaml
  text: And Yahweh appeared to him by the oaks of Mamre[a], while he was sitting at the entrance of the tent in the heat of the day.
translation:
  language: te
  text: యహ్వే మమ్రే ఓక్ చెట్ల వద్ద[a] అతనికి ప్రత్యక్షమయ్యాడు; అతడు పగటి వేడిలో గుడారం ప్రవేశద్వారం వద్ద కూర్చుని ఉన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మమ్రే టెరెబింత్ చెట్ల వద్ద.” హీబ్రూ పదం ఓక్ చెట్లు లేదా టెరెబింత్ చెట్లు వంటి పెద్ద చెట్లను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרָא
  choice: ప్రత్యక్షమయ్యాడు
  rationale: నిఫాల్ రూపం ఇక్కడ కనబడే విధంగా ప్రత్యక్షం కావడాన్ని సూచిస్తుంది; తెలుగు కథనంలో ‘ప్రత్యక్షమయ్యాడు’ సహజంగాను మూలానికి దగ్గరగాను ఉంది.
- source_word: אֵלָיו
  choice: అతనికి
  rationale: మూడవ పురుష ఏకవచన ప్రత్యయాన్ని నేరుగా అనువదిస్తుంది; సందర్భంలో ఇది అబ్రాహామును సూచిస్తుంది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో లిప్యంతరీకరించింది.
- source_word: בְּאֵלֹנֵי מַמְרֵא
  choice: మమ్రే దగ్గరున్న సింధూర వృక్షాల వద్ద
  rationale: אֵלֹנֵי అనే పదం పెద్ద వృక్షాలను, ముఖ్యంగా సింధూర వృక్షాలు లేదా సిందూరజాతి చెట్లను సూచించవచ్చు. స్థలసంబంధమైన בְ భావాన్ని ‘వద్ద’ సహజంగా తెలియజేస్తుంది; వృక్షజాతి అనిశ్చితిని పాదసూచికలో ఉంచింది.
- source_word: וְהוּא יֹשֵׁב
  choice: అప్పుడు అతడు ... కూర్చుని ఉన్నాడు
  rationale: హీబ్రూ కృదంత ప్రయోగం దృశ్యానికి నేపథ్య పరిస్థితిని ఇస్తుంది. తెలుగు కథనంలో ఈ రూపం ఆ కొనసాగుతున్న స్థితిని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: פֶּתַח הָאֹהֶל
  choice: గుడారం ప్రవేశద్వారం దగ్గర
  rationale: פֶּתַח అంటే తెరువు లేదా ప్రవేశస్థానం; ‘ప్రవేశద్వారం’ స్పష్టమైన ఆధునిక తెలుగు.
- source_word: כְּחֹם הַיּוֹם
  choice: పగటి వేడిలో
  rationale: రోజులో వేడి ఎక్కువగా ఉండే సమయాన్ని సూచించే మూలభాషా ప్రయోగాన్ని, నిర్దిష్ట గంటను ఊహించకుండా సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: వచనంలో వ్యక్తిగత దైవనామమే ఉంది. అందువల్ల దానిని బిరుదుగా మార్చకుండా ‘యహ్వే’ అని లిప్యంతరీకరించడం మూలంలోని ప్రత్యేక నామాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన కథన శైలిని వాడింది. మూలంలోని రెండు ఉపవాక్యాలను తెలుగులో సహజంగా ఉండేందుకు రెండు వాక్యాలుగా ఇచ్చింది; వృక్షజాతి విషయంలో ఉన్న నిజమైన అనిశ్చితిని పాదసూచికలో నిలిపింది.
