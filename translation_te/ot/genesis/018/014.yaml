id: GEN.18.14
reference: Genesis 18:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: הֲ/יִפָּלֵ֥א מֵ/יְהוָ֖ה דָּבָ֑ר לַ/מּוֹעֵ֞ד אָשׁ֥וּב אֵלֶ֛י/ךָ כָּ/עֵ֥ת חַיָּ֖ה וּ/לְ/שָׂרָ֥ה בֵֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/014.yaml
  text: Is anything too difficult for Yahweh? At the appointed time I will return to you[a], about this time next year[b], and Sarah will have a son.
translation:
  language: te
  text: యాహ్వేకు ఏదైనా అసాధ్యమా?[a] నిర్ణయించిన సమయంలో నేను నీ దగ్గరకు తిరిగి వస్తాను—వచ్చే సంవత్సరం ఇదే సమయానికి[b] శారాకు కుమారుడు ఉంటాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యాహ్వేకు ఏదైనా మరీ అద్భుతమైనదా?” హీబ్రూ క్రియ అసాధారణమైనది, అద్భుతమైనది, లేదా ఒకరి సామర్థ్యానికి మించినది అనే భావాలను ఇవ్వగలదు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో క్లిష్టమైన నుడికారం, అక్షరార్థంగా సుమారు “జీవముగల కాలం వలె/ప్రకారం.” దీని ఖచ్చితమైన అర్థం వివాదాస్పదం; సందర్భంలో దీనిని సాధారణంగా వచ్చే సంవత్సరం ఇదే సమయం అని అర్థం చేసుకుంటారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיִפָּלֵא
  choice: అసాధ్యమైనది
  rationale: פלא నిఫాల్ రూపం ఆశ్చర్యకరమైనది లేదా ఒకరి సామర్థ్యానికి మించినది అనే భావాలను కలిగి ఉంటుంది. ఈ అలంకారప్రశ్నలో ‘అసాధ్యమైనది’ సహజమైన ఆధునిక తెలుగు; అయితే మూలంలోని ‘అద్భుతమైనది/సామర్థ్యానికి మించినది’ అనే విస్తృతిని సూచించేందుకు పాదసూచిక ఇచ్చాం.
- source_word: מֵיְהוָה
  choice: యెహోవాకు
  rationale: פלאతో מן పరిమితి లేదా సామర్థ్యానికి మించినదనే సంబంధాన్ని సూచిస్తుంది. తెలుగులో ‘యెహోవాకు అసాధ్యమైనది’ సహజంగా ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: דָּבָר
  choice: ఏదైనా
  rationale: దీనికి ‘విషయం, సంగతి, మాట’ అనే విస్తృత అర్థక్షేత్రం ఉంది. అలంకారప్రశ్నలో ‘ఏదైనా’ దాని సమగ్ర భావాన్ని సహజంగా అందిస్తుంది.
- source_word: לַמּוֹעֵד
  choice: నియమించిన సమయానికి
  rationale: מוֹעֵד నిర్ణయించబడిన లేదా నియమించబడిన సమయాన్ని సూచిస్తుంది; ఈ అనువాదం ఆ నిర్దిష్టతను నిలుపుతుంది.
- source_word: אָשׁוּב אֵלֶיךָ
  choice: నేను నీ దగ్గరకు తిరిగి వస్తాను
  rationale: שׁוב ఇక్కడ తిరిగి రావడాన్ని, אֵלֶיךָ అబ్రాహామును ఉద్దేశించిన ఏకవచన ‘నీ దగ్గరకు’ అనే భావాన్ని తెలియజేస్తాయి.
- source_word: כָּעֵת חַיָּה
  choice: వచ్చే సంవత్సరం ఇదే కాలానికి
  rationale: అక్షరార్థంగా క్లిష్టమైన ‘జీవకాలం ప్రకారం’ అనే హీబ్రూ నుడికారం సందర్భంలో తరువాతి సంవత్సరం ఇదే కాలాన్ని సూచిస్తుంది. పాదసూచికలో నుడికారపు స్వరూపం నిలుపబడింది.
- source_word: וּלְשָׂרָה בֵן
  choice: అప్పుడు శారాకు ఒక కుమారుడు ఉంటాడు
  rationale: హీబ్రూలో క్రియలేని ఈ వాక్యభాగం సందర్భానుసారంగా భవిష్యత్తు ఫలితాన్ని చెబుతుంది. ‘ఉంటాడు’ అనేది ‘పుడతాడు’ అని ప్రత్యేకంగా చేర్చకుండా నిర్మాణానికి దగ్గరగా ఉంటుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు; యాహ్వే
  rationale: మూలపాఠంలో ఒడంబడిక నామం ప్రత్యక్షంగా ఉంది. తెలుగులో విస్తృతంగా గుర్తింపుపొందిన వ్యక్తినామ రూపమైన ‘యెహోవా’ను వాడటం, సాధారణ బిరుదైన ‘ప్రభువు’తో దానిని భర్తీ చేయకుండా మూలంలోని నామాన్ని నిలుపుతుంది.
- issue: అలంకారప్రశ్నలో פלא భావబలం
  choice: యెహోవాకు అసాధ్యమైనది ఏదైనా ఉందా?
  alternative: యెహోవాకు మరీ అద్భుతమైనది ఏదైనా ఉందా?; యెహోవా శక్తికి మించినది ఏదైనా ఉందా?
  rationale: ప్రశ్న వాగ్దానాన్ని నెరవేర్చగల యెహోవా సామర్థ్యాన్ని నొక్కిచెబుతుంది. ప్రధాన పాఠంలో సహజమైన ‘అసాధ్యమైనది’ను వాడినా, ‘అద్భుతమైనది’ అనే నిజమైన పదార్థ ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచి భావ ఉద్రిక్తతను కాపాడాం.
- issue: כָּעֵת חַיָּה కాలనుడికారం
  choice: వచ్చే సంవత్సరం ఇదే కాలానికి
  alternative: జీవకాలం ప్రకారం; కాలం మళ్లీ జీవించినప్పుడు
  rationale: సందర్భం తరువాతి సంవత్సరంలోని అదే కాలాన్ని సూచిస్తుంది. అస్పష్టమైన అక్షరానువాదాన్ని ప్రధాన పాఠంలో పెట్టకుండా, మూల నుడికారాన్ని పాదసూచికలో వెల్లడించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన దైవవాక్య శైలి. ‘నియమించిన సమయం’ వాగ్దానంలోని నిర్దిష్టతను, ‘తిరిగి వస్తాను’ మూల క్రియను నిలుపుతాయి. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠంలో చేర్చబడ్డాయి.
