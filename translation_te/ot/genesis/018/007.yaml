translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. హీబ్రూ వాక్యంలోని వేగవంతమైన చర్యల క్రమాన్ని రెండు తెలుగు వాక్యాలుగా స్పష్టంగా అందించాం; చివరి క్రియకు కర్త యువకుడే అని తెలుగు సర్వనామంతో తెలిపాం.
