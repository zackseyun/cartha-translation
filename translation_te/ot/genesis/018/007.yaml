source:
  edition: WLC
  text: וְ/אֶל הַ/בָּקָ֖ר רָ֣ץ אַבְרָהָ֑ם וַ/יִּקַּ֨ח בֶּן בָּקָ֜ר רַ֤ךְ וָ/טוֹב֙ וַ/יִּתֵּ֣ן אֶל הַ/נַּ֔עַר וַ/יְמַהֵ֖ר לַ/עֲשׂ֥וֹת אֹתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/007.yaml
  text: And Abraham ran to the herd and took a tender and good calf and gave it to the young man[a], and he hurried to prepare it.
translation:
  language: te
  text: అబ్రాహాము పశువుల మంద దగ్గరికి పరుగెత్తి, లేతగా ఉన్న, మంచి దూడను తీసుకొని యువకునికి[a] ఇచ్చాడు. అతడు దానిని సిద్ధం చేయడానికి త్వరపడ్డాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘సేవకునికి’ లేదా ‘బాలునికి.’ హీబ్రూ పదం הַנַּעַר సందర్భానుసారం యువకుణ్ణి, సేవకుణ్ణి లేదా బాలుణ్ణి సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבָּקָר
  choice: పశువుల మంద
  rationale: ఈ సందర్భంలో ఈ పదం ఒక్క జంతువును కాక సమష్టిగా గోవులను సూచిస్తుంది; ‘పశువుల మంద’ సహజమైన తెలుగు.
- source_word: רָץ
  choice: పరుగెత్తి
  rationale: మూల క్రియ నేరుగా పరుగెత్తడాన్ని సూచిస్తుంది; అబ్రాహాము ఆతిథ్యంలోని చురుకుదనాన్ని నిలుపుతుంది.
- source_word: בֶּן־בָּקָר
  choice: దూడను
  rationale: అక్షరార్థంగా ‘గోవుల కుమారుడు’ అనే ఈ హీబ్రూ నుడికారం చిన్న వయసున్న గోవును సూచిస్తుంది; భోజన సందర్భంలో ‘దూడ’ స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: רַךְ וָטוֹב
  choice: లేతదైన మంచి
  rationale: רַךְ జంతువు లేతదని, טוֹב దాని మంచి నాణ్యతను సూచిస్తాయి; ఈ జంట మూలంలోని రెండు విశేషణాలను నిలుపుతుంది.
- source_word: הַנַּעַר
  choice: యువకునికి
  rationale: ఈ పదం సందర్భానుసారం బాలుడు, యువకుడు లేదా సేవకుడు అని అర్థమివ్వగలదు. ప్రధాన పాఠంలో ‘యువకుడు’ మూలంలోని అస్పష్టతను సాధ్యమైనంతవరకు కాపాడుతుంది.
- source_word: וַיְמַהֵר
  choice: త్వరపడ్డాడు
  rationale: క్రియ వేగంగా చర్య తీసుకోవడాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో సహజంగా ఉండి కథనంలోని ఆతురతను నిలుపుతుంది.
- source_word: לַעֲשׂוֹת אֹתוֹ
  choice: దానిని సిద్ధం చేయడానికి
  rationale: עשה సాధారణంగా ‘చేయు’ అయినప్పటికీ, ఆహార సందర్భంలో జంతువును భోజనానికి సిద్ధం చేయడాన్ని సూచిస్తుంది.
