  text: יֻקַּֽח נָ֣א מְעַט מַ֔יִם וְ/רַחֲצ֖וּ רַגְלֵי/כֶ֑ם וְ/הִֽשָּׁעֲנ֖וּ תַּ֥חַת הָ/עֵֽץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/004.yaml
  text: Please let a little water be brought[a], and wash your feet[b], and rest yourselves under the tree.
translation:
  language: te
  text: దయచేసి, కొంచెం నీళ్లు తీసుకురానివ్వండి. మీ కాళ్లు కడుక్కొని, ఆ చెట్టు కింద సేదతీరండి[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూలభాషలోని క్రియకు మరింత అక్షరార్థంగా ‘ఆనుకోండి’ లేదా ‘వాలండి’ అని అర్థం; ఇక్కడ చెట్టు నీడలో సేదతీరమనే ఆతిథ్యపూర్వక ఆహ్వానం.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֻקַּח נָא
  choice: దయచేసి … తెప్పించనివ్వండి
  rationale: לקח యొక్క హోఫల్ యుసివ్ రూపంలోని పరోక్ష ఆజ్ఞను, נָא తెలిపే మర్యాదపూర్వక అభ్యర్థనను సహజమైన ఆధునిక తెలుగులో కలిపి వ్యక్తం చేస్తుంది; నీళ్లు మరొకరి ద్వారా తీసుకురాబడతాయనే భావమూ నిలుస్తుంది.
- source_word: מְעַט מַיִם
  choice: కొంచెం నీళ్లు
  rationale: అబ్రాహాము వినయంగా ప్రతిపాదించిన చిన్న పరిమాణాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וְרַחֲצוּ רַגְלֵיכֶם
  choice: మీ కాళ్లు కడుక్కొని
  rationale: ఆతిథ్య సందర్భంలో పాదాలు కడుక్కోవడాన్ని నేరుగా, సహజంగా తెలుపుతుంది; అనుసంధాన క్రియారూపం తరువాతి ఆహ్వానంతో సాఫీగా కలుస్తుంది.
- source_word: וְהִשָּׁעֲנוּ
  choice: సేదతీరండి
  rationale: שען నిఫల్ రూపంలోని ‘ఆనుకోవడం/వాలడం’ భావం ఈ ఆతిథ్య సందర్భంలో నీడలో విశ్రాంతి తీసుకోవడాన్ని సూచిస్తుంది; ‘సేదతీరండి’ సాధారణ పాఠకులకు సహజంగా ఆ ఉద్దేశాన్ని అందిస్తుంది.
- source_word: תַּחַת הָעֵץ
  choice: ఆ చెట్టు కింద
  rationale: నిర్దిష్ట ఉపపదంతో సూచించిన సమీపంలోని ప్రత్యేక చెట్టును ‘ఆ చెట్టు’ అని నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో మర్యాదపూర్వక బహువచన ఆహ్వానం వాడబడింది. ‘తెప్పించనివ్వండి’ ద్వారా మూలంలోని పరోక్ష ఆజ్ఞాత్మక నిష్క్రియ భావాన్ని సాధ్యమైనంత సహజంగా నిలిపి, ‘సేదతీరండి’ ద్వారా సందర్భోచితమైన విశ్రాంతి భావాన్ని అందించాం.
