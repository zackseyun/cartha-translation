id: GEN.18.31
reference: Genesis 18:31
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר הִנֵּֽה נָ֤א הוֹאַ֨לְתִּי֙ לְ/דַבֵּ֣ר אֶל אֲדֹנָ֔/י אוּלַ֛י יִמָּצְא֥וּ/ן שָׁ֖ם עֶשְׂרִ֑ים וַ/יֹּ֨אמֶר֙ לֹ֣א אַשְׁחִ֔ית בַּ/עֲב֖וּר הָֽ/עֶשְׂרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/031.yaml
  text: Then he said[a], “See now, I have undertaken to speak to my Lord. Perhaps twenty will be found there.” And he said[b], “I will not destroy it for the sake of the twenty.”
translation:
  language: te
  text: అప్పుడు అతడు, “చూడండి, నా ప్రభువుతో మాట్లాడడానికి నేను సాహసించాను.[a] ఒకవేళ అక్కడ ఇరవై మంది దొరుకుతారేమో” అన్నాడు. అందుకు ఆయన, “ఆ ఇరవై మంది నిమిత్తం నేను దానిని నాశనం చేయను” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నా ప్రభువుతో మాట్లాడే చొరవ తీసుకున్నాను.”
    reason: הוֹאַלְתִּי అనే క్రియ సాహసించడం, చొరవ తీసుకోవడం లేదా మాట్లాడే స్వేచ్ఛ తీసుకోవడం అనే సమీప భావాలను కలిగి ఉంది.
lexical_decisions:
- source_word: הִנֵּה נָא
  choice: ఇదిగో
  rationale: ఈ రెండు అవ్యయాలు వినయపూర్వకంగా శ్రద్ధను ఆకర్షించే మాటగా పనిచేస్తాయి. ఆధునిక ప్రామాణిక తెలుగులో ‘ఇదిగో’ సహజంగా ఉండి ఆ సంభాషణ ధోరణిని నిలుపుతుంది.
- source_word: הוֹאַלְתִּי
  choice: నేను సాహసించాను
  rationale: అబ్రాహాము వినయంగా, తనకున్న హద్దును దాటి మాట్లాడే ధైర్యం చేశాననే భావాన్ని ఈ రూపం తెలియజేస్తుంది; కేవలం ‘మొదలుపెట్టాను’ కంటే సందర్భానికి తగినది.
- source_word: לְדַבֵּר אֶל אֲדֹנָי
  choice: నా ప్రభువుతో మాట్లాడడానికి
  rationale: אֲדֹנָי అనే దైవసంబోధనను దేవుని నామమైన యెహోవాతో కలపకుండా గౌరవబిరుదుగా ‘నా ప్రభువు’ అని అనువదించాం.
- source_word: אוּלַי
  choice: ఒకవేళ … ఏమో
  rationale: అబ్రాహాము మాటలోని సందేహం, వినయం రెండింటినీ సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: יִמָּצְאוּן שָׁם עֶשְׂרִים
  choice: అక్కడ ఇరవై మంది కనిపిస్తారేమో
  rationale: మూలంలోని నిఫాల్ క్రియకు ఉన్న కర్మణి భావాన్ని ‘కనిపిస్తారు’ నిలుపుతుంది; వ్యక్తులను సూచిస్తున్నందున ‘మంది’ చేర్చడం తెలుగులో అవసరం.
- source_word: לֹא אַשְׁחִית
  choice: నేను దానిని నాశనం చేయను
  rationale: మూలంలో కర్మ ప్రత్యక్షంగా లేకపోయినా సందర్భంలోని పట్టణం లేదా ప్రదేశాన్ని సూచించడానికి తెలుగులో ‘దానిని’ సహజంగా పూరించబడింది.
- source_word: בַּעֲבוּר הָעֶשְׂרִים
  choice: ఆ ఇరవై మంది నిమిత్తం
  rationale: నిర్దిష్టంగా చర్చలో ఉన్న ఆ ఇరవై మందివల్ల ప్రదేశం విడిచిపెట్టబడుతుందనే మధ్యవర్తిత్వ తర్కాన్ని ‘నిమిత్తం’ సంక్షిప్తంగా, గౌరవప్రదంగా తెలియజేస్తుంది.
theological_decisions:
- issue: అబ్రాహాము సంబోధనలో אֲדֹנָי అనువాదం
  choice: నా ప్రభువు
  alternative: నా యజమాని
  rationale: విస్తృత సందర్భంలో సంభాషణలో ఉన్నవాడు యెహోవాగా గుర్తించబడుతున్నాడు. అయినా ఈ వచనంలో దైవనామం కాక אֲדֹנָי అనే బిరుదే ఉంది; కాబట్టి దైవనామాన్ని దిగుమతి చేయకుండా ‘నా ప్రభువు’ అని ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కథనానికి తగిన గౌరవప్రదమైన, సాధారణ పాఠకులకు స్పష్టమైన శైలి. దైవ సంభాషణలో ‘అతడు’ మరియు ‘ఆయన’ ద్వారా వక్తల మార్పు స్పష్టీకరించబడింది. ప్రధాన పాఠంలోని [a] గుర్తు సంబంధిత ప్రత్యామ్నాయ అనువాదంతో సరిపోలుతుంది.
