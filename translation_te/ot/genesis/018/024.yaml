id: GEN.18.24
reference: Genesis 18:24
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אוּלַ֥י יֵ֛שׁ חֲמִשִּׁ֥ים צַדִּיקִ֖ם בְּ/ת֣וֹךְ הָ/עִ֑יר הַ/אַ֤ף תִּסְפֶּה֙ וְ/לֹא תִשָּׂ֣א לַ/מָּק֔וֹם לְמַ֛עַן חֲמִשִּׁ֥ים הַ/צַּדִּיקִ֖ם אֲשֶׁ֥ר בְּ/קִרְבָּֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/024.yaml
  text: Suppose there are fifty righteous people within the city[c][b][a]. Will you indeed sweep it away and not spare the place for the sake of the fifty righteous who are within it?
translation:
  language: te
  text: ఒకవేళ పట్టణంలో యాభైమంది నీతిమంతులు ఉంటే[a], నీవు నిజంగా దాన్ని తుడిచిపెట్టేస్తావా? దానిలో ఉన్న ఆ యాభైమంది నీతిమంతుల నిమిత్తం ఆ స్థలాన్ని నాశనం చేయకుండా విడిచిపెట్టవా[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “బహుశా పట్టణంలో యాభైమంది నీతిమంతులు ఉండవచ్చు.”'
    reason: אוּלַי అనే పదాన్ని షరతుగా కాక సంభావ్యతను తెలిపే క్రియావిశేషణంగా కూడా అనువదించవచ్చు.
  - marker: b
    text: 'లేదా: “ఆ స్థలాన్ని మన్నించవా?”'
    reason: נשא అనే క్రియకు ఈ సందర్భంలో ‘విడిచిపెట్టు’ అనే భావంతో పాటు ‘మన్నించు/క్షమించు’ అనే భావఛాయ కూడా ఉంది.
lexical_decisions:
- source_word: אוּלַי יֵשׁ
  choice: ఒకవేళ … ఉంటే
  rationale: అబ్రాహాము ప్రతిపాదిస్తున్న ఊహాత్మక పరిస్థితిని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; אוּלַי లోని అనిశ్చిత భావాన్ని షరతు రూపంలో నిలుపుతుంది.
- source_word: חֲמִשִּׁים צַדִּיקִם
  choice: యాభైమంది నీతిమంతులు
  rationale: צַדִּיקִם నీతిగల వ్యక్తులను సూచిస్తుంది; మూలంలో పురుషులకే పరిమితం చేసే సూచన లేనందున లింగాన్ని అదనంగా నిర్దేశించలేదు.
- source_word: בְּתוֹךְ הָעִיר
  choice: పట్టణం మధ్యలో
  rationale: పట్టణపు హద్దుల లోపల ఉన్నారనే స్థానార్థాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: הַאַף
  choice: నిజంగా
  rationale: ప్రశ్నలోని ఆశ్చర్యం, గట్టి విజ్ఞాపన అనే ఉద్ఘాటనను తెలుగులో స్పష్టంగా నిలుపుతుంది.
- source_word: תִּסְפֶּה
  choice: తుడిచిపెట్టేస్తావా
  rationale: తీర్పులో సమూలంగా తొలగించడం అనే ספָה క్రియ యొక్క బలమైన భావాన్ని చిత్రాత్మకంగా, సహజంగా తెలియజేస్తుంది.
- source_word: וְלֹא תִשָּׂא לַמָּקוֹם
  choice: ఆ స్థలాన్ని నాశనం చేయకుండా విడిచిపెట్టవా
  rationale: ఇక్కడ נשא పట్టణంపై రాబోయే నాశనాన్ని నిలిపి దాన్ని వదిలివేయడం అనే సందర్భార్థం కలిగివుంది. తెలుగు పాఠకునికి అస్పష్టత రాకుండా ‘spare’ భావాన్ని సందర్భానుగుణంగా విప్పి చెబుతుంది.
- source_word: לְמַעַן
  choice: నిమిత్తం
  rationale: నీతిమంతులు అక్కడ ఉండడమే ఆ స్థలాన్ని విడిచిపెట్టడానికి ఆధారం అనే భావాన్ని గౌరవప్రదమైన, సాధారణ తెలుగులో తెలియజేస్తుంది.
- source_word: אֲשֶׁר בְּקִרְבָּהּ
  choice: దానిలో ఉన్న
  rationale: నీతిమంతులు పట్టణంలోనే ఉన్నారనే మూలంలోని సంబంధవాచక స్థానార్థాన్ని స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: וְלֹא תִשָּׂא לַמָּקוֹם లో נשא అర్థం
  choice: తీర్పును అమలు చేయకుండా ఆ స్థలాన్ని విడిచిపెట్టడం
  alternative: ఆ స్థలాన్ని క్షమించడం / దాని అపరాధాన్ని భరించడం
  rationale: తక్షణ సందర్భంలో పట్టణాన్ని తుడిచిపెట్టేయడానికి విరుద్ధంగా, నీతిమంతుల నిమిత్తం దాని నాశనాన్ని నిలిపివేయడమే ప్రధాన భావం. అందువల్ల ఒక నిర్దిష్ట పాపక్షమాపణ సిద్ధాంతాన్ని వాక్యంలోకి చేర్చకుండా ‘spare’ అనే న్యాయతీర్పు-కథన భావాన్ని ఎంచుకున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే అబ్రాహాము దేవునితో చేసే గౌరవపూర్వకమైన మరియు ధైర్యమైన విజ్ఞాపన స్వరాన్ని నిలుపుతూ అనువదించబడింది. దేవునికి ఏకవచన గౌరవసూచకేతర ‘నీవు’ రూపం బైబిలు తెలుగు శైలికి అనుగుణంగా వాడబడింది.
