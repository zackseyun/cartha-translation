revisions:
- from: శారా తనలో తాను నవ్వుకొని, “నేను ఇలా క్షీణించిపోయిన తర్వాత నాకు సుఖం[a] కలుగుతుందా? నా యజమాని కూడా ముసలివాడే కదా!” అనుకుంది.
  to: 'శారా తనలో తాను నవ్వుకుంటూ ఇలా అనుకుంది: “నేను క్షీణించిపోయిన తర్వాత, నా స్వామి వృద్ధుడై ఉండగా, నాకు సుఖం[a] కలుగుతుందా?”'
  rationale: The revision replaces the modern employer/owner sense of “యజమాని” with the respectful biblical marital term “స్వామి,” removes added rhetorical coloring, and places Sarah’s and Abraham’s aged conditions together as the basis of her question. It retains “క్షీణించిపోయిన” for בְלֹתִי and broad “సుఖం” for the ambiguous עֶדְנָה, with the existing footnote preserving possible marital and bodily nuances.
