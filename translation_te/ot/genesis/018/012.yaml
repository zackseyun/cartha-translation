id: GEN.18.12
reference: Genesis 18:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/תִּצְחַ֥ק שָׂרָ֖ה בְּ/קִרְבָּ֣/הּ לֵ/אמֹ֑ר אַחֲרֵ֤י בְלֹתִ/י֙ הָֽיְתָה לִּ֣/י עֶדְנָ֔ה וַֽ/אדֹנִ֖/י זָקֵֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/012.yaml
  text: So Sarah laughed to herself[a], saying, “After I am worn out, shall I have pleasure, while my lord is old?”
translation:
  language: te
  text: 'శారా తనలో తాను నవ్వుకుంటూ ఇలా అనుకుంది: “నేను క్షీణించిపోయిన తర్వాత, నా స్వామి వృద్ధుడై ఉండగా, నాకు సుఖం[a] కలుగుతుందా?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఆనందం.” ఇక్కడ మళ్లీ కలిగే దాంపత్య సుఖం లేదా యౌవన చైతన్యం అనే భావం కూడా ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּצְחַק
  choice: నవ్వుకొని
  rationale: צחק అనే క్రియకు ఇక్కడ సహజమైన అర్థం ‘నవ్వడం.’ సందర్భం బహిరంగ అపహాస్యం కంటే శారా అంతరంగ ప్రతిస్పందనను సూచిస్తుంది.
- source_word: בְּקִרְבָּהּ
  choice: తనలో తాను
  rationale: అక్షరార్థంగా ‘ఆమె అంతరంగంలో.’ ఆధునిక తెలుగులో అంతరంగంగా నవ్వి మాట్లాడుకోవడాన్ని ‘తనలో తాను’ సహజంగా తెలియజేస్తుంది.
- source_word: לֵאמֹר
  choice: అనుకుంది
  rationale: ఇది తరువాతి ప్రత్యక్ష వాక్యాన్ని పరిచయం చేస్తుంది. నవ్వు అంతరంగంలో జరిగినందున తెలుగులో ‘అనుకుంది’ సందర్భానికి సహజంగా సరిపోతుంది.
- source_word: אַחֲרֵי בְלֹתִי
  choice: నేను ఇలా క్షీణించిపోయిన తర్వాత
  rationale: בלה వాడిపోవడం, జీర్ణించిపోవడం లేదా క్షీణించడం అనే శారీరక భావాన్ని కలిగిస్తుంది. అబ్రాహాము వృద్ధాప్యం విడిగా ప్రస్తావించబడినందున కేవలం ‘ముసలిదానినైన తర్వాత’ అని అనువదించలేదు.
- source_word: הָיְתָה לִּי עֶדְנָה
  choice: నాకు సుఖం కలుగుతుందా
  rationale: עֶדְנָה అరుదైన పదం; ఇక్కడ ఆనందం, దాంపత్య సుఖం లేదా తిరిగి లభించే శారీరక చైతన్యం వంటి భావాలకు అవకాశం ఉంది. ‘సుఖం’ ఆ విస్తృతిని అతిగా నిర్దిష్టం చేయకుండా నిలుపుతుంది.
- source_word: וַאדֹנִי
  choice: నా యజమాని
  rationale: ఇది శారా అబ్రాహామును గౌరవంగా సంబోధించే సామాజిక పదం; దేవునికి వాడే బిరుదు కాదు. ‘నా యజమాని’ ఆ గౌరవార్థాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: זָקֵן
  choice: ముసలివాడే
  rationale: ‘వృద్ధుడు/ముసలివాడు’ అనే సరళ విధేయార్థం. ప్రశ్నలోని ఆశ్చర్యం మరియు పరిస్థితుల వైరుధ్యాన్ని ‘కూడా… కదా’ సహజ తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: עֶדְנָה పదంలోని భావవ్యాప్తి
  choice: ప్రధాన పాఠంలో ‘సుఖం’ అనే విస్తృత పదాన్ని ఉంచడం
  alternative: ‘దాంపత్య సుఖం’ లేదా ‘యౌవన చైతన్యం’
  rationale: హీబ్రూ పదానికి శారీరక, దాంపత్య, సంతానోత్పత్తి సంబంధిత సూచనలు ఉండవచ్చు; అయితే పాఠం వాటిలో ఒక్కదానికే అర్థాన్ని పరిమితం చేయదు. అందువల్ల ప్రధాన పాఠం ఉద్దేశపూర్వకంగా విస్తృతంగా ఉంది; మరింత నిర్దిష్టమైన అవకాశాలు పాదటిప్పణిలో ఇవ్వబడ్డాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా రూపొందించబడింది. ‘తనలో తాను’ అంతరంగ నవ్వును స్పష్టం చేస్తుంది; ‘నా యజమాని’ కుటుంబ-సామాజిక గౌరవార్థాన్ని నిలుపుతుంది. చివరి ‘కదా’ హీబ్రూ వాక్యంలోని ఆశ్చర్యం మరియు అసంభవత భావాన్ని సహజమైన తెలుగులో అందిస్తుంది.
