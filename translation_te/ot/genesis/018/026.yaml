id: GEN.18.26
reference: Genesis 18:26
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוָ֔ה אִם אֶמְצָ֥א בִ/סְדֹ֛ם חֲמִשִּׁ֥ים צַדִּיקִ֖ם בְּ/ת֣וֹךְ הָ/עִ֑יר וְ/נָשָׂ֥אתִי לְ/כָל הַ/מָּק֖וֹם בַּ/עֲבוּרָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/026.yaml
  text: And Yahweh said[a], “If I find fifty righteous people within the city of Sodom, then I will spare the whole place for their sake.”
translation:
  language: te
  text: 'అప్పుడు యాహ్వే ఇలా అన్నాడు: “సొదొమ పట్టణంలో నేను యాభై మంది నీతిమంతులను కనుగొంటే, వారి నిమిత్తం ఆ ప్రదేశమంతటినీ క్షమిస్తాను.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారి నిమిత్తం ఆ ప్రదేశమంతటినీ కాపాడుతాను” లేదా “శిక్షను విధించకుండా ఉంటాను.” హీబ్రూ క్రియకు అపరాధాన్ని మోయడం లేదా తొలగించడం, క్షమించడం, తీర్పును నిలిపివేయడం అనే సంబంధిత భావాలు ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా పరిచయమైన ‘యెహోవా’ రూపంలో వ్యక్తిగత నామంగా అందించాం.
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... ఇలా అన్నాడు
  rationale: హీబ్రూ కథన క్రమాన్ని ఆధునిక తెలుగు కథనశైలిలో సహజంగా తెలియజేస్తుంది.
- source_word: אִם אֶמְצָא
  choice: నాకు కనిపిస్తే
  rationale: ‘నేను కనుగొంటే’ అనే మూలభావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తూ, షరతు భావాన్ని నిలుపుతుంది.
- source_word: בִסְדֹם ... בְּתוֹךְ הָעִיר
  choice: సొదొమ పట్టణంలో
  rationale: సొదొమలో, పట్టణం లోపల అనే రెండు స్థాన సూచనలను అనవసర పునరుక్తి లేకుండా సహజంగా సమన్వయపరుస్తుంది.
- source_word: חֲמִשִּׁים צַדִּיקִם
  choice: యాభైమంది నీతిమంతులు
  rationale: వ్యక్తులను సూచించే పుంలింగ బహువచన రూపాన్ని తెలుగులో లింగాన్ని అనవసరంగా నిర్దిష్టం చేయకుండా అందిస్తుంది.
- source_word: וְנָשָׂאתִי
  choice: శిక్షించకుండా విడిచిపెడతాను
  rationale: ఈ సందర్భంలో నాశనకర తీర్పును నిలిపివేయడం అనే క్రియ యొక్క ప్రయోగార్థాన్ని స్పష్టమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; ‘క్షమిస్తాను’ అనే ప్రత్యామ్నాయ భావాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: לְכָל הַמָּקוֹם
  choice: ఆ స్థలమంతటినీ
  rationale: తీర్పుకు గురికానున్న మొత్తం ప్రదేశాన్ని సూచించే సమగ్ర పరిధిని నిలుపుతుంది.
- source_word: בַּעֲבוּרָם
  choice: వారి నిమిత్తం
  rationale: నీతిమంతుల కారణంగా లేదా వారిని బట్టి ఆ ప్రదేశం కాపాడబడుతుందనే సంబంధాన్ని గౌరవప్రదంగా, సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో ఉన్న వ్యక్తిగత దైవనామాన్ని ‘ప్రభువు’ వంటి బిరుదుతో భర్తీ చేయలేదు. ఆధునిక తెలుగు బైబిలు పాఠకులకు విస్తృతంగా పరిచయమైన లిప్యంతరీకరణను ఎంచుకున్నాం.
- issue: וְנָשָׂאתִי యొక్క తీర్పు/క్షమాపణ భావం
  choice: శిక్షించకుండా విడిచిపెడతాను
  alternative: క్షమిస్తాను
  rationale: సందర్భం సొదొమను నాశనం చేయకుండా కాపాడడం గురించి కావడంతో తీర్పును నిలిపివేసే భావాన్ని ప్రధాన పాఠ్యంలో ఇచ్చాం; అయితే అపరాధాన్ని మోయడం లేదా క్షమించడం అనే క్రియలోని అర్థవిస్తృతిని పాదటిప్పణిలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథనశైలి. మూలంలోని షరతు, సమగ్ర పరిధి, తీర్పు-క్షమాపణ మధ్య ఉన్న భావవిస్తృతిని నిలుపుకుంది.
