id: GEN.18.3
reference: Genesis 18:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּאמַ֑ר אֲדֹנָ֗/י אִם נָ֨א מָצָ֤אתִי חֵן֙ בְּ/עֵינֶ֔י/ךָ אַל נָ֥א תַעֲבֹ֖ר מֵ/עַ֥ל עַבְדֶּֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/003.yaml
  text: And he said[a], “My lord, if I have found favor in your eyes, please do not pass by your servant.”
translation:
  language: te
  text: 'అతడు ఇలా అన్నాడు[a]: “నా ప్రభూ, నీ దృష్టిలో నాకు అనుగ్రహం లభించి ఉంటే, దయచేసి నీ సేవకుణ్ణి దాటి వెళ్లవద్దు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ప్రభువా.” అంటే, అబ్రాహాము సందర్శకునితో గౌరవంగా మాట్లాడడం కాకుండా ప్రత్యేకంగా దేవుణ్ణే సంబోధిస్తున్నాడని అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמַר
  choice: అతడు ఇలా అన్నాడు
  rationale: హీబ్రూ కథనంలోని wayyiqtol రూపం అబ్రాహాము మాటలను పరిచయం చేస్తుంది. తెలుగులో సహజమైన కథన ప్రవాహం కోసం ‘అతడు ఇలా అన్నాడు’ అని అనువదించాం.
- source_word: אֲדֹנָי
  choice: నా ప్రభూ
  rationale: తదుపరి పదాల్లో ఏకవచన సంబోధన ఉండగా, ఉన్నతునిపట్ల గౌరవాన్ని తెలిపే సంబోధన ఇది. ఇది దేవునికిచ్చిన బిరుదా లేక సందర్శకునికి చేసిన గౌరవ సంబోధనా అన్న సందిగ్ధతను ప్రధాన పాఠం పూర్తిగా పరిష్కరించదు.
- source_word: אִם נָא
  choice: …ఉంటే
  rationale: ఇది మర్యాదపూర్వక విన్నపాన్ని ప్రవేశపెట్టే షరతును సూచిస్తుంది. נָא లోని విన్నప భావాన్ని వాక్యంలో తరువాత వచ్చే ‘దయచేసి’ ద్వారా సహజంగా వ్యక్తం చేశాం.
- source_word: מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: నీ దృష్టిలో నాకు అనుగ్రహం లభించి ఉంటే
  rationale: మూలంలోని ‘నీ కళ్లలో’ అనే రూపకాన్ని తెలుగులో సహజంగా వినిపించే ‘నీ దృష్టిలో’తో నిలిపాం. חֵן ను ఈ సందర్భంలో అనుకూల ఆదరణను సూచించే ‘అనుగ్రహం’గా ఇచ్చాం; అనవసరమైన సిద్ధాంతార్థాన్ని బలవంతంగా చేర్చలేదు.
- source_word: אַל נָא
  choice: దయచేసి … వెళ్లవద్దు
  rationale: నిషేధంతో కూడిన మర్యాదపూర్వక, ఆతుర విన్నపాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: תַעֲבֹר מֵעַל
  choice: దాటి వెళ్లవద్దు
  rationale: ఎవరినైనా దాటుకొని ముందుకు వెళ్లిపోవడాన్ని సూచించే హీబ్రూ ప్రయోగానికి ఇది సంక్షిప్తమైన, సహజమైన తెలుగు సమానార్థకం.
- source_word: עַבְדֶּךָ
  choice: నీ సేవకుణ్ణి
  rationale: గౌరవనీయుడైన అతిథి లేదా ఉన్నతుని ఎదుట తనను తాను తగ్గించుకొని చెప్పుకునే సందర్భంలో ‘నీ సేవకుడు’ సహజమైన తెలుగు ప్రయోగం; ఇక్కడ బానిసత్వ స్థితి ప్రధానాంశం కాదు.
theological_decisions:
- issue: אֲדֹנָי అనే సంబోధనను దేవుని బిరుదుగా తీసుకోవాలా, సందర్శకునికి చేసిన గౌరవ సంబోధనగా తీసుకోవాలా
  choice: నా ప్రభూ
  alternative: ప్రభువా
  rationale: ఆదికాండము 18లో యెహోవా అబ్రాహాముకు ప్రత్యక్షమైనట్లు సందర్భం చెబుతున్నప్పటికీ, ఈ వచనంలో అబ్రాహాము సందర్శకులలో ఒకరిని ఏకవచనంలో సంబోధిస్తున్నాడు. దేవునికే నేరుగా చేసిన సంబోధనగా తీసుకునే పఠనం సాధ్యమే; అయినా వచనంలోని సంభాషణాత్మక సందిగ్ధతను ముందుగానే తొలగించకుండా ప్రధాన పాఠంలో గౌరవ సంబోధనను ఉంచి, ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలిని ఉపయోగించాం. ఏకవచన సంబోధనను నిలిపి, మూలంలోని మర్యాదపూర్వక విన్నప స్వరాన్ని సహజమైన తెలుగు పదక్రమంలో వ్యక్తం చేశాం.
