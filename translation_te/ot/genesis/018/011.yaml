translation:
  language: te
  text: అబ్రాహాము, శారా వృద్ధులు; వయసు బాగా మళ్లినవారు. శారాకు స్త్రీల సహజ క్రమం ఆగిపోయింది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా ‘స్త్రీల మార్గం’; శారాకు ఇక రుతుస్రావం కలగడం లేదని తెలిపే మర్యాదపూర్వక నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: זְקֵנִים
  choice: వృద్ధులు
  rationale: ఈ పదం ముసలితనాన్ని లేదా ముదిరిన వయసును సూచిస్తుంది. ‘వృద్ధులు’ ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన పదం.
- source_word: בָּאִים בַּיָּמִים
  choice: వయసు బాగా మళ్లినవారు
  rationale: అక్షరార్థంగా ‘దినాల్లో ప్రవేశించినవారు’ అనే హీబ్రూ నుడికారం ముదిరిన వయసును సూచిస్తుంది. తెలుగు నుడికారంలో సహజంగా ఉండేలా ‘వయసు బాగా మళ్లినవారు’ అని అనువదించబడింది.
- source_word: חָדַל לִהְיוֹת
  choice: ఆగిపోయింది
  rationale: חָדַל అంటే ‘ఆగిపోవడం, నిలిచిపోవడం.’ సందర్భంలో సహజమైన తెలుగు రూపంగా ‘ఆగిపోయింది’ ఎంచుకోబడింది.
- source_word: אֹרַח כַּנָּשִׁים
  choice: స్త్రీలకుండే ధర్మం
  rationale: అక్షరార్థంగా ‘స్త్రీల మార్గం’ అనే మర్యాదపూర్వక హీబ్రూ నుడికారం రుతుస్రావాన్ని సూచిస్తుంది. తెలుగులో కూడా మర్యాదను కాపాడుతూ అర్థమయ్యే ‘స్త్రీలకుండే ధర్మం’ వాడబడింది.
- source_word: לְשָׂרָה
  choice: శారాకు
  rationale: ఇక్కడ ל సంబంధాన్ని సూచిస్తుంది; తెలుగులో ‘శారాకు ... ఆగిపోయింది’ అనడం సహజం.
