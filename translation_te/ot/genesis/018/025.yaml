review_pass:
  verdict: revise
  source_fidelity: The draft conveys the principal contrasts of righteous/wicked and the final rhetorical appeal to the Judge of all the earth. However, the second occurrence of חָלִילָה לְּךָ is not retained as an independent emphatic repudiation, and “సమానంగా చూడడం” (‘regarding/viewing as equal’) changes the source’s result clause into a matter of perception.
  naturalness: The Telugu is generally modern and clear. Restoring the repeated repudiation as a separate sentence and using “సమానంగా చేయడం” makes the logical result of the proposed action clearer and more faithful without becoming unnatural.
  terminology: “నీతిమంతుడు,” “దుష్టుడు,” “న్యాయాధిపతి,” and “న్యాయం” are suitable modern-standard Telugu equivalents in this judicial and theological context. “సర్వభూమి” properly retains the universal scope of כָּל הָאָרֶץ.
  issues:
  - severity: medium
    issue: The second חָלִילָה לְּךָ is absorbed into the preceding construction rather than translated as a second emphatic repudiation.
    rationale: The Hebrew explicitly repeats “Far be it from you,” first before the infinitival proposal and again before the final rhetorical question. The repetition is rhetorically significant and should be preserved.
  - severity: medium
    issue: “నీతిమంతుణ్ణి దుష్టునితో సమానంగా చూడడం” renders the comparison as ‘viewing/regarding the righteous as equal to the wicked.’
    rationale: וְהָיָה כַצַּדִּיק כָּרָשָׁע describes the resulting treatment or status—the righteous becoming/being as the wicked—not a perception of them. “సమానంగా చేయడం” better preserves this.
