  text: חָלִ֨לָ/ה לְּ/ךָ֜ מֵ/עֲשֹׂ֣ת כַּ/דָּבָ֣ר הַ/זֶּ֗ה לְ/הָמִ֤ית צַדִּיק֙ עִם רָשָׁ֔ע וְ/הָיָ֥ה כַ/צַּדִּ֖יק כָּ/רָשָׁ֑ע חָלִ֣לָ/ה לָּ֔/ךְ הֲ/שֹׁפֵט֙ כָּל הָ/אָ֔רֶץ לֹ֥א יַעֲשֶׂ֖ה מִשְׁפָּֽט׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/025.yaml
  text: Far be it from you to do such a thing—to put the righteous to death with the wicked[a], so that the righteous would be like the wicked. Far be it from you! Shall not the Judge of all the earth do justice?
translation:
  language: te
  text: ఇలాంటి పని చేయడం నీకు ఎంతమాత్రమూ తగదు—దుష్టునితో పాటు నీతిమంతుణ్ణి చంపి, నీతిమంతుణ్ణి దుష్టునితో సమానంగా చేయడం. అది నీకు ఎంతమాత్రమూ తగదు! సర్వభూమికి న్యాయాధిపతి న్యాయం చేయకపోతాడా?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సర్వభూమికి న్యాయాధిపతి న్యాయమైనది చేయకపోతాడా?”
    reason: మִשְׁפָּטను ఇక్కడ ‘న్యాయం’ అనే నామవాచకంగా లేదా ‘న్యాయమైనది’ అనే భావంతో అనువదించవచ్చు.
lexical_decisions:
- source_word: חָלִילָה לְּךָ
  choice: నీకు తగదు
  rationale: బలమైన నిరాకరణను, నైతికంగా ఊహించలేని కార్యమనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; పునరుక్తిని కూడా నిలుపుతుంది.
- source_word: מֵעֲשֹׂת כַּדָּבָר הַזֶּה
  choice: ఇలాంటి పని చేయడం
  rationale: ‘ఈ విధమైన కార్యం చేయడం’ అనే భావాన్ని సహజంగా అందిస్తుంది.
- source_word: לְהָמִית
  choice: చంపి
  rationale: מות హిఫీల్ రూపంలోని మరణింపజేయడం అనే కారణార్థాన్ని సందర్భానుసారంగా స్పష్టంగా తెలియజేస్తుంది.
- source_word: צַדִּיק
  choice: నీతిమంతుడు
  rationale: న్యాయసంబంధమైన, నైతికమైన భావాన్ని కాపాడి רָשָׁע కు సరైన వ్యతిరేక పదంగా నిలుస్తుంది.
- source_word: רָשָׁע
  choice: దుష్టుడు
  rationale: న్యాయపరంగా దోషి/దుర్మార్గుడు అనే విస్తృత భావాన్ని తెలుగులో గౌరవప్రదంగా అందిస్తుంది.
- source_word: וְהָיָה כַצַּדִּיק כָּרָשָׁע
  choice: నీతిమంతుణ్ణి దుష్టునితో సమానంగా చూడడం
  rationale: హీబ్రూ పోలికలోని అసహ్యకరమైన ఫలితాన్ని తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది; ఇద్దరికీ ఒకే గతి కల్పించడం అనే సందర్భార్థాన్ని సూచిస్తుంది.
- source_word: הֲשֹׁפֵט כָּל הָאָרֶץ
  choice: సర్వభూమికి న్యాయాధిపతి
  rationale: దేవునికి శీర్షికగా ఉన్న కృదంత రూపాన్ని, כָּל הָאָרֶץ యొక్క విశ్వవ్యాప్త పరిధిని నిలుపుతుంది.
- source_word: מִשְׁפָּט
  choice: న్యాయం
  rationale: కేవలం తీర్పు ప్రకటించడం కాక న్యాయంగా ప్రవర్తించడం అనే నైతిక-న్యాయ భావాన్ని అందిస్తుంది.
theological_decisions:
- issue: దేవుని న్యాయస్వభావాన్ని ఉద్దేశించి అబ్రాహాము వేసిన అలంకారప్రశ్న
  choice: సర్వభూమికి న్యాయాధిపతి న్యాయం చేయకుండా ఉంటాడా?
  alternative: సర్వభూమికి న్యాయాధిపతి న్యాయమైనది చేయడా?
  rationale: హీబ్రూ ప్రశ్న ఆశించే సానుకూల సమాధానాన్ని, అలాగే అబ్రాహాము మాటల్లోని ధైర్యమైన విజ్ఞాపనను మెత్తబరచకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయితే అబ్రాహాము మాటల గంభీరతను మరియు పునరుక్తి బలాన్ని నిలుపుతూ రూపొందించబడింది.
