  yaml_path: translation/ot/genesis/018/022.yaml
  text: Then the men turned from there and went toward Sodom[a], but Abraham still stood before Yahweh.
translation:
  language: te
  text: అప్పుడు ఆ మనుషులు అక్కడి నుంచి సొదొమ వైపుకు తిరిగి వెళ్లారు.[a] అయితే అబ్రాహాము ఇంకా యాహ్వే ముందు నిలిచి ఉన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని ప్రాచీన పాఠసాక్ష్యాల్లో, “యాహ్వే ఇంకా అబ్రాహాము ఎదుట నిలిచి ఉన్నాడు” అని ఉంది. హీబ్రూ మసొరేటిక్ పాఠంలో, “అబ్రాహాము ఇంకా యాహ్వే ముందు నిలిచి ఉన్నాడు” అని ఉంది.
    reason: textual_variant
lexical_decisions:
- source_word: וַיִּפְנוּ מִשָּׁם
  choice: అక్కడి నుంచి తిరిగి
  rationale: פנה ఇక్కడ దిశ మార్చుకొని బయలుదేరడాన్ని సూచిస్తుంది; מִשָּׁם మూలస్థానాన్ని తెలియజేస్తుంది. ఈ తెలుగు పదబంధం కథన గమనాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: הָאֲנָשִׁים
  choice: ఆ మనుషులు
  rationale: హీబ్రూ మూలంలో సాధారణంగా ‘మనుషులు’ అనే పదమే ఉంది. సందర్భాన్ని బట్టి వారిని దూతలని ప్రధాన పాఠ్యంలో వివరణాత్మకంగా మార్చకుండా, మూలంలోని కథన రూపాన్ని నిలిపింది.
- source_word: וַיֵּלְכוּ סְדֹמָה
  choice: సొదొమ వైపు వెళ్లారు
  rationale: స్థలనామానికి జతైన దిశాసూచక ה సొదొమ దిశగా కదలికను సూచిస్తుంది; ‘వైపు వెళ్లారు’ ఆ సూక్ష్మార్థాన్ని స్పష్టంగా కాపాడుతుంది.
- source_word: עוֹדֶנּוּ עֹמֵד
  choice: ఇంకా ... నిలిచి ఉన్నాడు
  rationale: עוֹדֶנּוּ కొనసాగుతున్న స్థితిని, participle עֹמֵד నిలబడివుండడాన్ని తెలియజేస్తాయి. ‘ఇంకా నిలిచి ఉన్నాడు’ ఆధునిక తెలుగులో సహజంగా ఆ నిరంతర స్థితిని వ్యక్తం చేస్తుంది.
- source_word: לִפְנֵי
  choice: సన్నిధిలో
  rationale: ఈ పదానికి ‘ముందు’ అనే స్థలార్థంతో పాటు ‘సమక్షంలో/సన్నిధిలో’ అనే సంబంధార్థం ఉంది. దేవుని సమక్షంలో నిలబడిన భావాన్ని సహజ తెలుగులో ‘సన్నిధిలో’ వ్యక్తం చేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో వ్యక్తిగత నామంగా ఉంచింది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు / యాహ్వే
  rationale: మూలంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. తెలుగులో సాధారణంగా గుర్తించబడే లిప్యంతరీకరణను ఉపయోగించడం ద్వారా దానిని బిరుదుగా మార్చకుండా కాపాడింది.
- issue: చివరి ఉపవాక్యంలోని పాఠాంతరం
  choice: అబ్రాహాము ఇంకా యెహోవా సన్నిధిలో నిలిచి ఉన్నాడు
  alternative: యెహోవా ఇంకా అబ్రాహాము ఎదుట నిలిచి ఉన్నాడు
  rationale: అందించిన WLC మసొరేటిక్ పాఠం అబ్రాహామునే కర్తగా చూపుతుంది. కొన్ని ప్రాచీన సాక్ష్యాల్లో కనిపించే తిరగబడిన వాక్యరూపాన్ని ప్రధాన పాఠ్యంలో స్వీకరించకుండా, నిజమైన పాఠభేదంగా పాదసూచికలో భద్రపరిచింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని ‘మనుషులు’ అనే ఉపరితల వర్ణనను, సొదొమ వైపు దిశాసూచనను, చివరి ఉపవాక్యపు పాఠభేదాన్ని కాపాడింది.
