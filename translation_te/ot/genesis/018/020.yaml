id: GEN.18.20
reference: Genesis 18:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוָ֔ה זַעֲקַ֛ת סְדֹ֥ם וַ/עֲמֹרָ֖ה כִּי רָ֑בָּה וְ/חַ֨טָּאתָ֔/ם כִּ֥י כָבְדָ֖ה מְאֹֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/020.yaml
  text: Then Yahweh said[a], “The outcry against Sodom and Gomorrah is great[b], and their sin is very severe.”
translation:
  language: te
  text: 'అప్పుడు యాహ్వే ఇలా అన్నాడు: “సొదొమ, గొమొర్రాలకు వ్యతిరేకంగా లేచిన మొర చాలా పెద్దది[a]; వారి పాపం చాలా తీవ్రమైనది[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సొదొమ, గొమొర్రాల మొర చాలా పెద్దది.” హీబ్రూ పదబంధాన్ని మరింత అక్షరార్థంగా ఇలా అనువదించవచ్చు; ప్రధాన పాఠం ఆ మొర వారికి వ్యతిరేకంగా లేచిందనే సందర్భార్థాన్ని స్పష్టం చేస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “వారి పాపం చాలా భారమైనది.” హీబ్రూలో అక్షరార్థంగా అది “చాలా బరువైనది” అని ఉంది; ఇది పాపం అత్యంత గంభీరమైనదని తెలిపే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... ఇలా అన్నాడు
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది. ‘అప్పుడు’ దాని క్రమానుసార భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పునర్నిర్మిత ఉచ్చారణను తెలుగులో లిప్యంతరీకరించింది.
- source_word: זַעֲקַת
  choice: వ్యతిరేకంగా వినిపిస్తున్న మొర
  rationale: ఈ పదం తీవ్రమైన అన్యాయం లేదా బాధ కారణంగా లేచే మొరను సూచిస్తుంది. సందర్భంలో అది ఆ పట్టణాలకు సంబంధించిన ఫిర్యాదు మొర; ‘వ్యతిరేకంగా’ అనే పదం సందర్భంలో అంతర్లీనంగా ఉన్న దిశను సహజ తెలుగులో స్పష్టం చేస్తుంది, కాగా మూలంలోని నిర్మాణాత్మక అస్పష్టతను పాదసూచికలో ఉంచింది.
- source_word: סְדֹם וַעֲמֹרָה
  choice: సొదొమ, గొమొర్రా
  rationale: స్థల నామాలకు ఆధునిక తెలుగులో సులభంగా చదవగల లిప్యంతరీకరణలు.
- source_word: כִּי רָבָּה
  choice: ఎంతో గొప్పది
  rationale: స్త్రీలింగ ఏకవచన విశేషణం ‘మొర’ పరిమాణం లేదా తీవ్రత గొప్పదని చెబుతుంది; ఈ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: וְחַטָּאתָם
  choice: వారి పాపం
  rationale: חַטָּאת ఇక్కడ సమూహపు దుష్కార్యాన్ని ఏకవచన సమష్టి భావంలో సూచిస్తుంది; ‘వారి పాపం’ దాన్ని నేరుగా నిలుపుతుంది.
- source_word: כִּי כָבְדָה מְאֹד
  choice: చాలా తీవ్రమైనది
  rationale: כבד అక్షరార్థంగా ‘బరువుగా ఉండడం’; నైతిక లేదా న్యాయ సందర్భంలో పాపపు అత్యంత గంభీరతను సూచిస్తుంది. ‘చాలా తీవ్రమైనది’ ఆధునిక పాఠకులకు ఆ భావాన్ని స్పష్టంగా అందిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా
  rationale: హీబ్రూ పాఠంలో దైవనామం నేరుగా ఉంది. దానిని ‘ప్రభువు’ వంటి బిరుదుతో భర్తీ చేయకుండా వ్యక్తిగత నామంగా నిలిపి, సాధారణంగా పునర్నిర్మించిన ఉచ్చారణను ‘యాహ్వే’గా లిప్యంతరీకరించింది.
- issue: זַעֲקַת అనే నిర్మాణంలో మొర ఎవరిది లేదా ఎవరికి వ్యతిరేకమైనది అన్న భావం
  choice: సొదొమ, గొమొర్రాలకు వ్యతిరేకంగా వినిపిస్తున్న మొర
  alternative: సొదొమ, గొమొర్రాల మొర
  rationale: సందర్భం ఈ మొర ఆ పట్టణాల దుష్టత్వంపై లేచిన ఫిర్యాదని బలంగా సూచిస్తుంది. అయినా హీబ్రూ నిర్మాణాన్ని ‘వాటి మొర’ అని మరింత అక్షరార్థంగా కూడా అనువదించవచ్చు; అందువల్ల ఆ అస్పష్టతను పాదసూచికలో భద్రపరిచింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. పాతకాలపు క్రియారూపాలు, అనవసర సంస్కృతభారం నివారించబడ్డాయి. మూలంలోని రెండు כִּי పదాలు ఇక్కడ వాక్యనిర్మాణంలో సహజంగా predicate clausesగా అందించబడ్డాయి; ప్రత్యేకంగా ‘ఎందుకంటే’ అని అనువదించలేదు.
