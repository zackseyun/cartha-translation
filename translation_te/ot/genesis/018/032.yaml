source:
  edition: WLC
  text: וַ֠/יֹּאמֶר אַל נָ֞א יִ֤חַר לַֽ/אדֹנָ/י֙ וַ/אֲדַבְּרָ֣ה אַךְ הַ/פַּ֔עַם אוּלַ֛י יִמָּצְא֥וּ/ן שָׁ֖ם עֲשָׂרָ֑ה וַ/יֹּ֨אמֶר֙ לֹ֣א אַשְׁחִ֔ית בַּ/עֲב֖וּר הָ/עֲשָׂרָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/032.yaml
  text: Then he said[a], “Please, let not my lord be angry, and I will speak only this once more. Perhaps ten will be found there.” And he said[c][b], “I will not destroy it for the sake of the ten.”
translation:
  language: te
  text: అప్పుడు అతడు, “దయచేసి, నా ప్రభువా, కోపగించవద్దు; ఈ ఒక్కసారి మాత్రమే మాట్లాడనివ్వండి. బహుశా అక్కడ పదిమంది దొరుకుతారేమో” అన్నాడు. ఆయన, “ఆ పదిమంది నిమిత్తం నేను నాశనం చేయను” అన్నాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో, “ఆ పదిమంది నిమిత్తం నేను నాశనం చేయను” అని మాత్రమే ఉంది; నాశనం చేయబడేది సందర్భం ద్వారా అర్థమవుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל נָא יִחַר לַאדֹנָי
  choice: దయచేసి నా ప్రభువు కోపగించుకోకూడదు
  rationale: חרה అనే కోపం రగులుటను సూచించే ప్రయోగాన్ని సహజమైన గౌరవపూర్వక విన్నపంగా అనువదించింది; נא భావాన్ని ‘దయచేసి’ తెలియజేస్తుంది. לַאדֹנָיను దైవనామంగా కాక గౌరవసూచక ప్రత్యక్ష సంబోధనగా ‘నా ప్రభువు’ అని ఉంచింది.
- source_word: וַאֲדַבְּרָה אַךְ הַפַּעַם
  choice: నేను ఈ ఒక్కసారి మాత్రమే ఇంకా మాట్లాడతాను
  rationale: కోహోర్టేటివ్‌లోని విన్నపం/సంకల్ప భావాన్నీ, אַךְ הַפַּעַם సూచించే చివరి ఒక్క మాట అనే పరిమితినీ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אוּלַי יִמָּצְאוּן שָׁם עֲשָׂרָה
  choice: బహుశా అక్కడ పదిమంది కనిపిస్తారేమో
  rationale: אוּלַיలోని సంభావ్యతను ‘బహుశా… ఏమో’ తెలియజేస్తుంది; מצא నిఫాల్ రూపంలోని ‘కనిపించు/కనుగొనబడుట’ భావాన్ని నిలుపుతుంది.
- source_word: לֹא אַשְׁחִית
  choice: నేను దానిని నాశనం చేయను
  rationale: שׁחת హిఫీల్ రూపానికి ‘నాశనం చేయు’ సరిపోతుంది. హీబ్రూలో కర్మ ప్రత్యక్షంగా లేకున్నా, తెలుగు స్పష్టత కోసం సందర్భంలోని పట్టణాన్ని సూచించే ‘దానిని’ చేర్చబడింది.
- source_word: בַּעֲבוּר הָעֲשָׂרָה
  choice: ఆ పదిమంది నిమిత్తం
  rationale: בַּעֲבוּרలోని వారి కారణంగా/వారి నిమిత్తం చర్యను నిలిపివేసే భావాన్ని గౌరవప్రదమైన సహజ తెలుగులో తెలియజేస్తుంది; నిర్దిష్టతను ‘ఆ’ నిలుపుతుంది.
theological_decisions:
- issue: అబ్రాహాము సంబోధించిన אֲדֹנָי పదం యొక్క సూచన
  choice: నా ప్రభువు
  alternative: ప్రభువా / యెహోవా
  rationale: ఈ పదం యెహోవా అనే దైవనామం కాదు; అయితే విస్తృత సందర్భంలో సంభాషణకర్త దైవికుడే. ‘నా ప్రభువు’ అని అనువదించడం గౌరవసూచక సంబోధనను నిలుపుతూ, పదం ఒక్కటే నిర్ధారించని దైవనామ భావాన్ని బలవంతంగా చేర్చదు.
- issue: లֹא אַשְׁחִיתలో చెప్పని కర్మ
  choice: దానిని అని పాఠ్యంలో సరఫరా చేయడం
  alternative: నేను నాశనం చేయను
  rationale: సందర్భంలో నాశనం చేయబడబోయే స్థలం/పట్టణం స్పష్టంగా ఉన్నందున తెలుగు వాక్యసహజత కోసం కర్మను చేర్చింది; అది మూలంలో అంతర్లీనమై ఉందని పాదటిప్పణి తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవపూర్వకమైన, సామాన్య పాఠకులకు స్పష్టమైన శైలిని వాడింది. కథనంలోని మొదటి వక్తకు ‘అతడు’, ప్రత్యుత్తరం ఇచ్చే దైవిక సంభాషణకర్తకు గౌరవార్థకంగా ‘ఆయన’ వాడినా, אֲדֹנָיను దైవనామంగా అతిగా నిర్దిష్టం చేయలేదు. పాదటిప్పణి సూచిక [a] ప్రధాన పాఠ్యంలో ఉంది.
