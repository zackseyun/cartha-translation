  rationale: The revision makes Abraham’s plea idiomatic and directly addressed, represents the cohortative as a request, and retains the Hebrew’s unexpressed final object rather than supplying it. It preserves the source’s ambiguity and respectful register without over-specifying the addressee’s title.
