id: GEN.18.27
reference: Genesis 18:27
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּ֥עַן אַבְרָהָ֖ם וַ/יֹּאמַ֑ר הִנֵּה נָ֤א הוֹאַ֨לְתִּי֙ לְ/דַבֵּ֣ר אֶל אֲדֹנָ֔/י וְ/אָנֹכִ֖י עָפָ֥ר וָ/אֵֽפֶר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/027.yaml
  text: Then Abraham answered and said[a], “Behold, please, I have dared to speak to my Lord, though I am dust and ashes.”
translation:
  language: te
  text: 'అప్పుడు అబ్రాహాము జవాబిచ్చి ఇలా అన్నాడు: “దయచేసి, ఇదిగో, ధూళీ బూడిదనైన నేను నా ప్రభువుతో[a] మాట్లాడటానికి సాహసించాను.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నా యజమానితో.” హెబ్రీ రూపం గౌరవపూర్వక సంబోధనగా కూడా వాడబడగలదు; అయితే చుట్టుపక్కల సందర్భం అబ్రాహాము సంబోధిస్తున్న వ్యక్తిని యెహోవాతో గుర్తిస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמַר
  choice: జవాబిచ్చి ఇలా అన్నాడు
  rationale: హెబ్రీ కథనంలోని ‘జవాబిచ్చాడు ... అన్నాడు’ అనే రెండు క్రియలనూ సహజమైన ఆధునిక తెలుగు వాక్యనిర్మాణంలో నిలుపుతుంది.
- source_word: הִנֵּה נָא
  choice: ఇదిగో, దయచేసి
  rationale: הִנֵּה యొక్క శ్రద్ధాకర్షణ భావాన్ని ‘ఇదిగో’తో, נָא యొక్క వినయపూర్వక విన్నప భావాన్ని ‘దయచేసి’తో వ్యక్తం చేస్తుంది; మూలంలోని సంక్షిప్తతను కాపాడుతుంది.
- source_word: הוֹאַלְתִּי
  choice: సాహసించాను
  rationale: తన అల్పత్వాన్ని గుర్తిస్తూ కూడా మాట్లాడటానికి పూనుకున్న అబ్రాహాము వినయాన్నీ ధైర్యాన్నీ కలిపి తెలియజేస్తుంది; కేవలం ‘పూనుకున్నాను’ కంటే సందర్భంలోని తెగింపు భావాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: לְדַבֵּר
  choice: మాట్లాడటానికి
  rationale: דבר అనే క్రియ యొక్క సాధారణ ‘మాట్లాడు’ భావాన్ని సహజమైన తెలుగులో ఇస్తుంది.
- source_word: אֶל אֲדֹנָי
  choice: నా ప్రభువుతో
  rationale: మొదటి పురుష స్వామ్య ప్రత్యయాన్ని ‘నా’తో నిలుపుతూ గౌరవసంబోధనను ‘ప్రభువు’గా అందిస్తుంది. ఇది మానవ యజమానికి గౌరవసంబోధనగా కూడా అర్థమయ్యే వీలును పాదసూచికలో ఉంచింది.
- source_word: וְאָנֹכִי עָפָר וָאֵפֶר
  choice: నేను ధూళి, బూడిద అయినప్పటికీ
  rationale: మూలంలోని ‘మరి నేను ధూళి, బూడిద’ అనే వ్యత్యాసాన్ని తెలుగులో సహజమైన concessive నిర్మాణంతో వ్యక్తం చేస్తూ, మరణశీలత మరియు అల్పత్వాన్ని సూచించే జంట పదాలను యథాతథంగా నిలుపుతుంది.
theological_decisions:
- issue: אֲדֹנָי అనే సంబోధన ఎవరిని సూచిస్తుంది?
  choice: నా ప్రభువుతో
  alternative: నా యజమానితో
  rationale: ఈ రూపం స్వతహాగా గౌరవార్థక మానవ సంబోధనగానూ రావచ్చు. అయితే చుట్టుపక్కల కథనం అబ్రాహాము సంభాషిస్తున్న వ్యక్తిని యెహోవాతో అనుసంధానిస్తుంది. అందుచేత ప్రధాన పాఠంలో ‘ప్రభువు’ను ఉంచి, పదరూపంలోని నిజమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో సంరక్షించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన కథన శైలిని ఉపయోగించాం. ‘ఇదిగో, దయచేసి’ కొద్దిగా సాంద్రమైన సంబోధన అయినప్పటికీ, మూలంలోని రెండు discourse particles‌ను విడిచిపెట్టకుండా ఉంచుతుంది. ‘ధూళి, బూడిద’ అనే స్థిరమైన ప్రతీకాత్మక జంటను సరళంగా నిలిపాం.
