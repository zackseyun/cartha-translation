  to: 'అప్పుడు అబ్రాహాము జవాబిచ్చి ఇలా అన్నాడు: “దయచేసి, ఇదిగో, ధూళీ బూడిదనైన నేను నా ప్రభువుతో[a] మాట్లాడటానికి సాహసించాను.”'
