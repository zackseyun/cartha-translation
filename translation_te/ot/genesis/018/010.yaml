source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר שׁ֣וֹב אָשׁ֤וּב אֵלֶ֨י/ךָ֙ כָּ/עֵ֣ת חַיָּ֔ה וְ/הִנֵּה בֵ֖ן לְ/שָׂרָ֣ה אִשְׁתֶּ֑/ךָ וְ/שָׂרָ֥ה שֹׁמַ֛עַת פֶּ֥תַח הָ/אֹ֖הֶל וְ/ה֥וּא אַחֲרָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/010.yaml
  text: And he said[a], “I will surely return to you about this time next year, and behold[c][b], Sarah your wife will have a son.” And Sarah was listening at the entrance of the tent behind him.
translation:
  language: te
  text: 'ఆయన ఇలా అన్నాడు: “వచ్చే సంవత్సరం ఇదే సమయానికి[a] నేను తప్పకుండా నీ దగ్గరికి తిరిగి వస్తాను. ఇదిగో, నీ భార్య శారాకు ఒక కుమారుడు పుడతాడు.” ఆయన వెనుక ఉన్న గుడారపు ద్వారం దగ్గర శారా వింటూ ఉంది.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పదబంధాన్ని పదక్షరాలా అనువదిస్తే, ‘జీవించే కాలంలో’ లేదా ‘కాలం మళ్లీ జీవించే వేళలో’ అని చెప్పవచ్చు; సందర్భంలో ఇది వచ్చే సంవత్సరం ఇదే సమయాన్ని సూచించే నుడికారం.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ వాక్యం సంక్షిప్తంగా, ‘గుడారపు ద్వారం—అది ఆయన వెనుక ఉంది’ అని కూడా అనువదించవచ్చు. సర్వనామాల కారణంగా పదానువాదంలో కొంత అస్పష్టత ఉంది.
    reason: textual_ambiguity
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: ఆయన ఇలా అన్నాడు
  rationale: హీబ్రూ క్రియలో కర్త మూడవ పురుష ఏకవచనంగా మాత్రమే ఉంది. ఈ వచనంలో వక్త ఎవరో ప్రత్యేకంగా చేర్చకుండా కథన ప్రవాహాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: שׁוֹב אָשׁוּב
  choice: నేను తప్పకుండా ... తిరిగి వస్తాను
  rationale: క్రియతో పాటు వచ్చిన infinitive absolute దాని నిశ్చయార్థాన్ని బలపరుస్తుంది; ‘తప్పకుండా’ ఆ ఉద్ఘాటనను సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: כָּעֵת חַיָּה
  choice: వచ్చే సంవత్సరం ఇదే సమయానికి
  rationale: ఈ సందర్భంలో ఇది తదుపరి సంవత్సరంలో ఇదే కాలాన్ని సూచించే హీబ్రూ కాలసూచక నుడికారం; పదానువాదం తెలుగులో అర్థాన్ని మసకబారుస్తుంది.
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: శ్రద్ధను ఆకర్షిస్తూ రాబోయే విషయాన్ని గంభీరంగా ప్రకటించే హీబ్రూ అవ్యయ బలాన్ని నిలుపుతుంది.
- source_word: לְשָׂרָה אִשְׁתֶּךָ ... בֵן
  choice: నీ భార్య శారాకు ఒక కుమారుడు పుడతాడు
  rationale: హీబ్రూలోని ‘నీ భార్య శారాకు కుమారుడు’ అనే జనన వాగ్దానాన్ని స్పష్టమైన, సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: שָׂרָה שֹׁמַעַת
  choice: శారా వింటూ ఉంది
  rationale: వర్తమాన కృదంతం ఆ దృశ్యంలో కొనసాగుతున్న చర్యను సూచిస్తుంది; ‘వింటూ ఉంది’ ఆ కాలవ్యాప్తిని కాపాడుతుంది.
- source_word: פֶּתַח הָאֹהֶל וְהוּא אַחֲרָיו
  choice: ఆయన వెనుక ఉన్న గుడారపు ద్వారం దగ్గర
  rationale: గుడారపు ద్వారం వక్త వెనుక ఉందనే సాధ్యమైన వాక్యసంబంధాన్ని సహజంగా అందిస్తుంది; హీబ్రూ సర్వనామాల సంక్షిప్తత వల్ల మిగిలే ప్రత్యామ్నాయాన్ని పాదసూచికలో పేర్కొంటుంది.
theological_decisions:
- issue: వక్త గుర్తింపు
  choice: ‘ఆయన’ అని మాత్రమే అనువదించడం
  alternative: ‘యెహోవా’ లేదా ‘ఆ మనుషుల్లో ఒకడు’ అని పేర్కొనడం
  rationale: ఈ వచనంలోని హీబ్రూ క్రియ కర్తను మూడవ పురుష ఏకవచనంగా మాత్రమే చూపుతుంది. సమీప సందర్భం ఆధారంగా వక్త గుర్తింపును ఇక్కడే నిర్దిష్టం చేయకుండా మూలంలోని సంక్షిప్తతను, వ్యాఖ్యాన ఉద్రిక్తతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన, సామాన్య పాఠకులకు స్పష్టమైన శైలి వాడబడింది. ‘ఇదిగో’ ప్రకటన గంభీరతను నిలుపుతుంది; ‘గుడారపు ద్వారం’ గ్రామ్యంగా కాకుండా సహజంగా అర్థమయ్యే పదబంధం.
