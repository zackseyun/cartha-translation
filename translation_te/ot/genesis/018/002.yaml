  text: וַ/יִּשָּׂ֤א עֵינָי/ו֙ וַ/יַּ֔רְא וְ/הִנֵּה֙ שְׁלֹשָׁ֣ה אֲנָשִׁ֔ים נִצָּבִ֖ים עָלָ֑י/ו וַ/יַּ֗רְא וַ/יָּ֤רָץ לִ/קְרָאתָ/ם֙ מִ/פֶּ֣תַח הָ/אֹ֔הֶל וַ/יִּשְׁתַּ֖חוּ אָֽרְצָ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/002.yaml
  text: He lifted up his eyes and looked[a], and behold, three men were standing near him. When he saw them[b], he ran from the entrance of the tent to meet them and bowed down to the ground.
translation:
  language: te
  text: అతడు కన్నులెత్తి చూశాడు. ఇదిగో, ముగ్గురు మనుషులు అతనికి దగ్గరగా నిలబడి ఉన్నారు[a]. వారిని చూడగానే, అతడు గుడారం ద్వారం నుండి వారిని కలుసుకోవడానికి పరుగెత్తి, నేల వరకు వంగి నమస్కరించాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అతని పక్కనే నిలబడి ఉన్నారు.’ హీబ్రూ విభక్తి సూచకం దగ్గరగా ఉండటాన్ని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘నేలపై సాష్టాంగపడ్డాడు.’ ఈ క్రియ గాఢ గౌరవాన్ని తెలిపే శారీరక భంగిమను వర్ణిస్తుంది; దానికదే తప్పనిసరిగా ‘ఆరాధించాడు’ అని అర్థం కాదు.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשָּׂא עֵינָיו
  choice: అతడు కన్నులెత్తి చూశాడు
  rationale: హీబ్రూ నుడికారంలోని సజీవ చిత్రణను నిలుపుతూ, ఆధునిక తెలుగులో సహజంగా అర్థమయ్యే రూపం.
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: అకస్మాత్తుగా దృశ్యాన్ని పాఠకుని ముందుంచే హీబ్రూ కథన సూచిక బలాన్ని కాపాడుతుంది.
- source_word: שְׁלֹשָׁה אֲנָשִׁים
  choice: ముగ్గురు మనుషులు
  rationale: మూలంలోని లింగస్పష్టమైన ‘ముగ్గురు పురుషులు/మనుషులు’ అనే భావాన్ని నేరుగా తెలియజేస్తుంది; ‘మనుషులు’ సాధారణ పాఠకునికి సహజంగా ఉంటుంది.
- source_word: נִצָּבִים עָלָיו
  choice: అతనికి దగ్గరగా నిలబడి ఉన్నారు
  rationale: עַל అనే విభక్తి సూచించే సమీపాన్ని సహజంగా వ్యక్తం చేస్తూ, వారు అతనిపై నిలబడ్డారనే అనుచిత భౌతిక భావాన్ని నివారిస్తుంది; ‘అతని పక్కనే’ అనే సాధ్యార్థాన్ని పాదసూచికలో ఉంచింది.
- source_word: וַיַּרְא
  choice: వారిని చూడగానే
  rationale: రెండవసారి వచ్చిన క్రియను అబ్రాహాము వెంటనే చేసిన చర్యతో కాలసంబంధంగా సహజంగా కలుపుతుంది.
- source_word: וַיָּרָץ לִקְרָאתָם
  choice: వారిని కలుసుకోవడానికి పరుగెత్తి
  rationale: క్రియలోని నిజమైన ‘పరుగెత్తడం’ అనే బలాన్ని, అతిథులను ఎదుర్కొని ఆహ్వానించడానికి వెళ్లిన భావాన్ని నిలుపుతుంది.
- source_word: מִפֶּתַח הָאֹהֶל
  choice: గుడార ద్వారం నుండి
  rationale: గుడారం ప్రవేశస్థలాన్ని సంక్షిప్తంగా, సహజంగా సూచిస్తుంది.
- source_word: וַיִּשְׁתַּחוּ אָרְצָה
  choice: నేలమట్టం వరకు వంగి నమస్కరించాడు
  rationale: నేలవైపు లోతుగా వంగిన గౌరవసూచక శారీరక చర్యను తెలియజేస్తుంది; దానిని ముందుగానే ‘ఆరాధించాడు’ అని మతపరంగా నిర్ధారించదు.
theological_decisions:
- issue: అబ్రాహాము చేసిన చర్యను దైవారాధనగా అనువదించాలా, గాఢ గౌరవంతో వంగడంగా అనువదించాలా
  choice: నేలమట్టం వరకు వంగి నమస్కరించాడు
  alternative: ఆరాధించాడు
  rationale: השתחוה అనే హీబ్రూ క్రియ దేవుని ఎదుట ఆరాధనకూ, మనుషుల ఎదుట గౌరవపూర్వకంగా వంగడానికీ వాడవచ్చు. ఈ వచనం ఆ వ్యక్తులను మొదట ‘ముగ్గురు మనుషులు’గా చూపుతుంది. కాబట్టి ‘ఆరాధించాడు’ అనడం ద్వారా వచనం ఇంకా స్పష్టంగా తేల్చని దైవసంబంధ వ్యాఖ్యానాన్ని ముందుగానే నిర్ణయించకుండా, మూలంలోని వేదాంతపరమైన ఉద్రిక్తతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘కన్నులెత్తి’, ‘ఇదిగో’ వంటి రూపాలు మూలంలోని సాహిత్య సజీవతను నిలుపుతాయి; ‘వంగి నమస్కరించాడు’ సాధారణ పాఠకునికి స్పష్టంగా ఉండి మతపరమైన అర్థాన్ని అనవసరంగా రుద్దదు.
