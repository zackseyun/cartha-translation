id: GEN.18.21
reference: Genesis 18:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אֵֽרֲדָה נָּ֣א וְ/אֶרְאֶ֔ה הַ/כְּ/צַעֲקָתָ֛/הּ הַ/בָּ֥אָה אֵלַ֖/י עָשׂ֣וּ כָּלָ֑ה וְ/אִם לֹ֖א אֵדָֽעָה־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/021.yaml
  text: I will go down now and see whether they have done altogether according to its outcry that has come to me[a]; and if not[b], I will know.
translation:
  language: te
  text: నేను ఇప్పుడు దిగివెళ్లి, నా దగ్గరికి వచ్చిన ఆ మొరకు వారు చేసినది పూర్తిగా సరిపోతుందో లేదో చూస్తాను[a]; లేకపోతే, నేను తెలుసుకుంటాను[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నా దగ్గరికి వచ్చిన దాని మొర ప్రకారంగా వారు పూర్తిగా చేశారో లేదో చూస్తాను.” హీబ్రూలోని “చేశారు—పూర్తిగా” అనే క్లిష్ట ప్రయోగం, వారు చేసినది నివేదించబడిన మొరకు పూర్తిగా సరిపోతుందా అనే భావాన్ని తెలియజేస్తుంది. ‘దాని’ అనే ప్రత్యయం సందర్భంలో ఉన్న పట్టణం లేదా ప్రాంతాన్ని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా, “మరి లేకపోతే, నేను తెలుసుకుంటాను.”
    reason: literal_alternative
lexical_decisions:
- source_word: אֵרֲדָה נָּא
  choice: నేను ఇప్పుడు దిగివెళ్లి
  rationale: కోహోర్టేటివ్ రూపం వక్త సంకల్పాన్ని తెలియజేస్తుంది; נָא ఇక్కడ అభ్యర్థనకన్నా తక్షణతను సూచిస్తుంది. దేవుడు ‘దిగివెళ్లడం’ అనే మానవరూప వర్ణనను అలాగే నిలిపింది.
- source_word: וְאֶרְאֶה
  choice: చూస్తాను
  rationale: ఇక్కడ చూడడం అంటే పరిశీలించి నిజానిజాలు నిర్ధారించుకోవడం; అయినా మూలంలోని సాధారణ ‘చూడు’ క్రియను వ్యాఖ్యానాత్మకంగా విస్తరించలేదు.
- source_word: הַכְּצַעֲקָתָהּ
  choice: దాని మొర ప్రకారమే
  rationale: צְעָקָה ఘోర అన్యాయం కారణంగా లేచే మొరను సూచిస్తుంది. స్త్రీలింగ ఏకవచన ప్రత్యయం సందర్భంలోని నగరం లేదా ప్రాంతాన్ని సూచిస్తూ ‘దాని’గా నిలిపింది; ‘దానికి వ్యతిరేకంగా’ అనే భావాన్ని పాఠ్యంలోకి చేర్చలేదు.
- source_word: הַבָּאָה אֵלַי
  choice: నా దగ్గరికి వచ్చిన
  rationale: ‘మొర’ను విశేషించే కృదంత పదబంధాన్ని సహజమైన తెలుగు సంబంధార్థక నిర్మాణంగా ఇచ్చింది.
- source_word: עָשׂוּ כָּלָה
  choice: వారు పూర్తిగా చేశారో
  rationale: ఈ క్లిష్టమైన హీబ్రూ ప్రయోగం, వారి పనులు వచ్చిన మొరకు పూర్తిగా సరిపోతున్నాయా అనే భావాన్ని ఇస్తుంది. ‘చేశారు’ బహువచన కర్తను, ‘పూర్తిగా’ כָּלָה భావాన్ని నిలుపుతాయి.
- source_word: וְאִם לֹא
  choice: అలా చేయకపోతే
  rationale: ముందున్న క్రియకు సహజంగా తిరిగి సూచించే షరతుగా అనువదించింది; తెలుగులో కేవలం ‘కాకపోతే’ కంటే ఇది స్పష్టంగా ఉంటుంది.
- source_word: אֵדָעָה
  choice: నేను తెలుసుకుంటాను
  rationale: ידע యొక్క ‘తెలుసుకోవడం/నిర్ధారించుకోవడం’ భావాన్ని వ్యాఖ్యానాత్మకమైన ‘కనుక్కుంటాను’గా మార్చకుండా మూలానికి దగ్గరగా ఉంచింది.
theological_decisions:
- issue: దేవుడు మానవునిలా దిగివెళ్లి పరిశీలిస్తున్నట్లు వర్ణించడం
  choice: ‘నేను ఇప్పుడు దిగివెళ్లి ... చూస్తాను’ అనే భాషను యథాతథంగా నిలిపింది.
  alternative: ‘నేను పరిశీలించి తీర్పుతీరుస్తాను’ అని మానవరూప వర్ణనను సిద్ధాంతపరంగా వివరణాత్మకం చేయడం.
  rationale: హీబ్రూ కథనం దేవుణ్ణి మానవ అనుభవానికి అనుగుణమైన భాషలో వర్ణిస్తుంది. దేవుని సర్వజ్ఞతతో కనిపించే ఉద్రిక్తతను అనువాదం స్వయంగా పరిష్కరించకుండా మూలంలోని రూపాన్ని కాపాడాలి.
- issue: עָשׂוּ כָּלָה అనే అస్పష్ట ప్రయోగం
  choice: ‘దాని మొర ప్రకారమే వారు పూర్తిగా చేశారో లేదో’ అని, మొరకు వారి కార్యాలు పూర్తిగా సరిపోతున్నాయా అనే భావాన్ని ఇచ్చింది.
  alternative: ‘వారు దాన్ని పూర్తిగా నాశనం చేశారో’ లేదా ‘వారి పాపం సంపూర్ణమైందో’ అని నిర్దిష్టంగా అర్థనిర్ణయం చేయడం.
  rationale: మూలంలోని ప్రయోగం క్లిష్టమైనది. సందర్భబద్ధమైన పోలికను తెలియజేస్తూనే, నాశనం లేదా పాపపరిపూర్ణత వంటి అదనపు భావాలను దిగుమతి చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సామాన్య పాఠకులకు అర్థమయ్యే శైలిని వాడింది. ‘దిగివెళ్లి,’ ‘మొర,’ ‘తెలుసుకుంటాను’ వంటి పదాలు మూలరూపాన్ని నిలుపుతాయి; క్లిష్టమైన మధ్య ఖండాన్ని సహజ తెలుగు ప్రశ్నార్థక-షరతు నిర్మాణంలో అమర్చింది. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
