id: GEN.18.15
reference: Genesis 18:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/תְּכַחֵ֨שׁ שָׂרָ֧ה לֵ/אמֹ֛ר לֹ֥א צָחַ֖קְתִּי כִּ֣י יָרֵ֑אָה וַ/יֹּ֥אמֶר לֹ֖א כִּ֥י צָחָֽקְתְּ׀׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/015.yaml
  text: But Sarah denied it[a], saying, “I did not laugh,” because she was afraid. But he said, “No[b], but you did laugh.”
translation:
  language: te
  text: కానీ శారా భయపడినందున, “నేను నవ్వలేదు” అని చెబుతూ నిరాకరించింది.[a] కానీ ఆయన, “లేదు,[b] నువ్వు నవ్వావు” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అబద్ధమాడింది”; లేదా సరళంగా, “నిరాకరించింది.” హీబ్రూ క్రియ నిరాకరించడం లేదా అసత్యంగా వ్యవహరించడం అనే భావాలను ఇవ్వగలదు; ఇక్కడ శారా తాను నవ్విన విషయాన్ని కాదనడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ఈ ఉపవాక్యంలో మాటలాడిన వ్యక్తి పేరు స్పష్టంగా చెప్పబడలేదు; పరిసర కథనం ఆయనను యెహోవాతో గుర్తిస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתְּכַחֵשׁ
  choice: దాన్ని నిరాకరించింది
  rationale: పీయేల్ రూపంలోని כחשׁ ఇక్కడ తాను నవ్విన విషయాన్ని శారా కాదనడాన్ని సూచిస్తుంది. ‘అబద్ధమాడింది’ అనే నైతిక నిర్ధారణను ప్రధాన పాఠ్యంలో బలవంతంగా చేర్చకుండా, సందర్భానికి సహజమైన ‘నిరాకరించింది’ను ఎంచుకున్నాం.
- source_word: לֵאמֹר
  choice: అంటూ
  rationale: ప్రత్యక్ష మాటను పరిచయం చేసే సాధారణ ఉల్లేఖన రూపాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: לֹא צָחַקְתִּי
  choice: నేను నవ్వలేదు
  rationale: నిషేధంతో కూడిన ప్రథమ పురుష ఏకవచన క్రియను సూటిగా, సహజంగా అనువదిస్తుంది.
- source_word: כִּי יָרֵאָה
  choice: భయపడి
  rationale: శారా నిరాకరణకు భయమే కారణమని తెలిపే హేత్వర్థాన్ని తెలుగులో సహజమైన క్రియావిశేషణ రూపంలో వ్యక్తం చేస్తుంది.
- source_word: וַיֹּאמֶר
  choice: అందుకు ఆయన ... అన్నాడు
  rationale: కథన పురోగతితో పాటు శారా నిరాకరణకు వచ్చిన ప్రత్యుత్తరాన్ని సహజంగా చూపిస్తుంది; కర్త పేరును మూలపాఠ్యం ఈ ఉపవాక్యంలో మళ్లీ పేర్కొననందున ‘ఆయన’గా ఉంచాం.
- source_word: לֹא כִּי צָחָקְתְּ
  choice: లేదు, నువ్వు నవ్వావు
  rationale: మొదటి לֹא శారా మాటను తిరస్కరిస్తుంది; తరువాతి כִּי ప్రతివాదాన్ని బలపరుస్తుంది. తెలుగు సందర్భంలో ‘లేదు’ తరువాతి స్పష్టమైన ప్రకటన ఆ దృఢతను సహజంగా అందిస్తుంది.
theological_decisions:
- issue: וַיֹּאמֶר లో మాటలాడిన వ్యక్తి గుర్తింపు
  choice: పేరును చేర్చకుండా ‘ఆయన ... అన్నాడు’ అని అనువదించడం
  alternative: ‘యెహోవా అన్నాడు’ లేదా ‘ఆ మనుష్యుల్లో ఒకడు అన్నాడు’
  rationale: ఈ ఉపవాక్యంలో మూల హీబ్రూ పాఠ్యం కర్త పేరును మళ్లీ చెప్పకుండా పుంలింగ ఏకవచన క్రియను మాత్రమే వాడుతుంది. పరిసర సందర్భం ఆయనను యెహోవాతో గుర్తించినప్పటికీ, ఈ వాక్యంలో లేని నిర్దిష్టతను ప్రధాన పాఠ్యంలో చేర్చకుండా అస్పష్టతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. ‘శారా’ అనే సాధారణ తెలుగు బైబిలు నామరూపాన్ని ఉంచాం. మూలంలోని నిరాకరణ–ప్రతివాద నిర్మాణాన్ని స్పష్టంగా నిలిపి, మాటలాడిన వ్యక్తి విషయంలో ఉన్న వ్యాకరణాత్మక అస్పష్టతను పాదసూచికతో సంరక్షించాం.
