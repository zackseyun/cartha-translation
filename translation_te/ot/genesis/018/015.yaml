    rationale: ‘భయపడి’ సందర్భానుసారం కారణాన్ని తెలియజేయగలిగినా, హీబ్రూ כִּי స్పష్టంగా ‘ఎందుకంటే/ఎందువలనంటే’ అనే కారణాన్ని ఇస్తుంది. ‘భయపడినందున’ దానిని స్పష్టంగా కాపాడుతుంది.
