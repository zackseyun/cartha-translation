- from: అయితే శారా భయపడి, “నేను నవ్వలేదు” అంటూ దాన్ని నిరాకరించింది.[a] అందుకు ఆయన, “లేదు,[b] నువ్వు నవ్వావు” అన్నాడు.
  to: కానీ శారా భయపడినందున, “నేను నవ్వలేదు” అని చెబుతూ నిరాకరించింది.[a] కానీ ఆయన, “లేదు,[b] నువ్వు నవ్వావు” అన్నాడు.
  rationale: సవరణలు అర్థాన్ని మార్చవు. అవి హీబ్రూలోని కారణసంబంధాన్ని మరింత స్పష్టంగా చేశాయి, తెలుగు సర్వనామంలోని అస్పష్టతను తొలగించాయి, మరియు రెండవ కథనక్రియను మూలానికి దగ్గరగా ఉన్న సాధారణ విరోధసూచకంతో వ్యక్తం చేశాయి. పాదసూచిక గుర్తులు వరుసగా నిరాకరణక్రియకు, ‘లేదు’ అనే ఖండనకు సరిగ్గా జతచేయబడ్డాయి.
