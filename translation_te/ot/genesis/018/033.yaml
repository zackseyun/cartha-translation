- from: యహ్వే[a] అబ్రాహాముతో మాట్లాడడం ముగించినప్పుడు అక్కడి నుండి వెళ్లిపోయాడు. అబ్రాహాము తన స్థలానికి తిరిగి వెళ్లాడు.
  to: యహ్వే[a] అబ్రాహాముతో మాట్లాడడం ముగించినప్పుడు వెళ్లిపోయాడు. అబ్రాహాము తన స్థలానికి తిరిగి వెళ్లాడు.
