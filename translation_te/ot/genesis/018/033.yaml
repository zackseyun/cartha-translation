id: GEN.18.33
reference: Genesis 18:33
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֵּ֣לֶךְ יְהוָ֔ה כַּ/אֲשֶׁ֣ר כִּלָּ֔ה לְ/דַבֵּ֖ר אֶל אַבְרָהָ֑ם וְ/אַבְרָהָ֖ם שָׁ֥ב לִ/מְקֹמֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/033.yaml
  text: Then Yahweh went his way when he had finished speaking to Abraham[a], and Abraham returned to his place.
translation:
  language: te
  text: యహ్వే[a] అబ్రాహాముతో మాట్లాడడం ముగించినప్పుడు వెళ్లిపోయాడు. అబ్రాహాము తన స్థలానికి తిరిగి వెళ్లాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ: ‘YHWH.’ ‘యెహోవా’ అనేది ఈ దైవనామానికి మరో సాంప్రదాయిక రూపం.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: అక్కడి నుండి వెళ్లిపోయాడు
  rationale: הלך ఇక్కడ సంభాషణ ముగిసిన తరువాత బయలుదేరడాన్ని సూచిస్తుంది. తెలుగు కథనంలో ‘అక్కడి నుండి వెళ్లిపోయాడు’ సహజంగా ఉండి, సందర్భంలోని నిష్క్రమణ భావాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: హీబ్రూ చతురక్షర దైవనామం YHWHను బిరుదుతో భర్తీ చేయకుండా, వ్యక్తిగత నామంగా తెలుగులో ‘యహ్వే’ అని లిప్యంతరీకరించబడింది.
- source_word: כַּאֲשֶׁר
  choice: ముగించినప్పుడు
  rationale: ఈ పదం యహ్వే వెళ్లిపోవడానికి సంబంధించిన కాలసందర్భాన్ని తెలియజేస్తుంది; ‘అప్పుడు/ఎప్పుడు’ భావాన్ని తెలుగు ఉపవాక్యంలో సహజంగా కలుపుతుంది.
- source_word: כִּלָּה לְדַבֵּר
  choice: మాట్లాడడం ముగించినప్పుడు
  rationale: כלה + క్రియార్థక రూపం ఒక కార్యం పూర్తయిందనే భావాన్ని ఇస్తుంది. ‘మాట్లాడడం ముగించడం’ ఆ పూర్తి భావాన్ని నేరుగా నిలుపుతుంది.
- source_word: אֶל אַבְרָהָם
  choice: అబ్రాహాముతో
  rationale: אֶל అక్షరార్థంగా ‘అబ్రాహాము వైపు/అబ్రాహాముకు’ అయినప్పటికీ, మాట్లాడే సందర్భంలో ఆధునిక తెలుగులో ‘అబ్రాహాముతో మాట్లాడడం’ సహజమైన సమానార్థక నిర్మాణం.
- source_word: שָׁב
  choice: తిరిగి వెళ్లాడు
  rationale: שוב ఇక్కడ మునుపటి స్థలానికి తిరిగివెళ్లడాన్ని సూచిస్తుంది; ‘తిరిగి వెళ్లాడు’ సహజమైన తెలుగు కథన ప్రయోగం.
- source_word: לִמְקֹמוֹ
  choice: తన స్థలానికి
  rationale: מקום యొక్క సాధారణ అర్థం ‘స్థలం.’ హీబ్రూ స్పష్టంగా ‘ఇల్లు’ అననందున, మరింత నిర్దిష్టమైన భావాన్ని చేర్చకుండా ‘తన స్థలానికి’ అని అనువదించబడింది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠంలో బిరుదు కాకుండా YHWH అనే దైవనామమే ఉంది. అందువల్ల దానిని ‘ప్రభువు’గా ప్రత్యామ్నాయపరచకుండా ‘యహ్వే’ అని లిప్యంతరీకరించడం మూలరూపాన్ని కాపాడుతుంది; ఇతర ప్రాచుర్య రూపాన్ని పాదటిప్పణిలో సూచించబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే గౌరవప్రదమైన కథనశైలి ఉపయోగించబడింది. ‘తన స్థలం’ అనే కొద్దిగా అక్షరార్థమైన పదబంధం మూలంలోని అనిర్దిష్టతను కాపాడుతుంది.
