    text: 'మరింత పదశః: “ఆ బాలుడు లేడు; మరి నేను ఎక్కడికి వస్తాను?” ఈ హీబ్రూ ప్రయోగానికి “నేను ఎక్కడికి పోగలను?” లేదా “నేను ఏమి చేయాలి?” అనే భావం ఉంది.'
    reason: lexical_alternative
