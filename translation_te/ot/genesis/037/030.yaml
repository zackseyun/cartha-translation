translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కథన శైలి వాడబడింది. రూబేను కలతను చూపేందుకు వాక్య విరామం, సర్వనామ పునరుక్తి నిలుపబడ్డాయి; అర్థాన్ని మించి యోసేపు మరణించాడని సూచించలేదు.
