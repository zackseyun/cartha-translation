revisions:
- from: అతడు తన సోదరుల దగ్గరికి తిరిగి వచ్చి, “ఆ బాలుడు లేడు! ఇక నేను—నేను ఎక్కడికి పోవాలి?”[a] అన్నాడు.
  to: అతడు తన సోదరుల దగ్గరికి తిరిగి వచ్చి, “ఆ బాలుడు లేడు; మరి నేను ఎక్కడికి పోవాలి?”[a] అన్నాడు.
  rationale: The revision removes a minor added temporal nuance and an unnatural Telugu pronoun repetition while preserving the Hebrew's emphatic shift to Reuben's predicament and the rhetorical force of his question. The footnote continues to mark the literal ‘come’ wording and its idiomatic sense.
  reviewer_model: gpt-5.6-terra
