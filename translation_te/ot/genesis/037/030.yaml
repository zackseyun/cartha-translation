  yaml_path: translation/ot/genesis/037/030.yaml
  text: He returned to his brothers and said[a], “The boy is gone, and I—where shall I go?”
translation:
  language: te
  text: అతడు తన సోదరుల దగ్గరికి తిరిగి వచ్చి, “ఆ బాలుడు లేడు; మరి నేను ఎక్కడికి పోవాలి?”[a] అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత పదశః: “ఆ బాలుడు లేడు; మరి నేను ఎక్కడికి వస్తాను?” ఈ హీబ్రూ ప్రయోగానికి “నేను ఎక్కడికి పోగలను?” లేదా “నేను ఏమి చేయాలి?” అనే భావం ఉంది.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: తిరిగి వచ్చి
  rationale: שׁוב క్రియ కథన క్రమంలో తిరిగి రావడాన్ని సూచిస్తుంది; సందర్భంలో అతడు తన సోదరుల దగ్గరికి రావడం సహజంగా వ్యక్తమవుతుంది.
- source_word: אֶל אֶחָיו
  choice: తన సోదరుల దగ్గరికి
  rationale: אֶל దిశను సూచిస్తుంది; אֶחָיו అంటే ‘అతని సోదరులు.’ ఆధునిక తెలుగులో గమ్యాన్ని సహజంగా తెలిపే రూపం ఇది.
- source_word: הַיֶּלֶד
  choice: ఆ బాలుడు
  rationale: יֶלֶד అంటే ‘బాలుడు/పిల్లవాడు.’ ఇక్కడ యోసేపును సూచిస్తున్నందున ‘ఆ బాలుడు’ స్పష్టంగా, గౌరవప్రదంగా ఉంది.
- source_word: אֵינֶנּוּ
  choice: లేడు
  rationale: ఈ రూపం అతడు అక్కడ లేకపోవడాన్ని సూచిస్తుంది. ‘లేడు’ అనేది మరణాన్ని నిర్ధారించకుండా అతని గైర్హాజరును సహజంగా తెలియజేస్తుంది.
- source_word: וַאֲנִי
  choice: ఇక నేను—నేను
  rationale: సంధికారకం మరియు సర్వనామం రూబేను తన పరిస్థితివైపు అకస్మాత్తుగా, భావోద్వేగంతో మళ్లడాన్ని తెలియజేస్తాయి; పునరుక్తి ఆ ఒత్తిడిని తెలుగులో నిలుపుతుంది.
- source_word: אָנָה אֲנִי בָא
  choice: నేను ఎక్కడికి పోవాలి?
  rationale: పదశః ‘నేను ఎక్కడికి వస్తున్నాను?’ అనే నిర్మాణం ఇక్కడ గమ్యం లేదా తదుపరి చర్య గురించి కలతతో వేసిన ప్రశ్న. ‘ఎక్కడికి పోవాలి?’ ఆధునిక తెలుగులో ఆ భావాన్ని సహజంగా అందిస్తుంది.
