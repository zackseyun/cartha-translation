translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనదిగాను, కథన గౌరవాన్ని నిలుపుకునే విధంగాను ఉంది. ‘ప్రేమ’ మరియు ‘ద్వేషం’ అనే మూలపదాల బలాన్ని తగ్గించలేదు; לְשָׁלֹם నుడికారంలోని శాంతి/స్నేహ భావాన్ని పాదసూచికలో నిలిపింది.
