  text: וַ/יִּרְא֣וּ אֶחָ֗י/ו כִּֽי אֹת֞/וֹ אָהַ֤ב אֲבִי/הֶם֙ מִ/כָּל אֶחָ֔י/ו וַֽ/יִּשְׂנְא֖וּ אֹת֑/וֹ וְ/לֹ֥א יָכְל֖וּ דַּבְּר֥/וֹ לְ/שָׁלֹֽם־־׃
