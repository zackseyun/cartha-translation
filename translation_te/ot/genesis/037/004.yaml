  yaml_path: translation/ot/genesis/037/004.yaml
  text: When his brothers saw that their father loved him more than all his brothers[a], they hated him and could not speak peaceably to him.
translation:
  language: te
  text: వారి తండ్రి అతనిని అతని అన్నదమ్ములందరికంటే ఎక్కువగా ప్రేమిస్తున్నాడని అతని అన్నదమ్ములు చూసినప్పుడు, వారు అతన్ని ద్వేషించారు; అతనితో స్నేహపూర్వకంగా మాట్లాడలేకపోయారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతనితో శాంతిగా మాట్లాడలేకపోయారు”; అంటే, అతనితో స్నేహభావంతో మాట్లాడలేకపోయారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְאוּ
  choice: చూసినప్పుడు
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుండగా, సందర్భంలో వారి గ్రహింపుకు తరువాతి ద్వేషం ఫలితంగా రావడాన్ని కాలసంబంధ ఉపవాక్యంగా సహజంగా వ్యక్తపరుస్తుంది.
- source_word: אֶחָיו
  choice: అతని అన్నదమ్ములు
  rationale: 3 పురుష ఏకవచన ప్రత్యయం యోసేపు అన్నదమ్ములను సూచిస్తుంది; ఆధునిక తెలుగులో పురుష సహోదరులకు ఇది సహజమైన పదం.
- source_word: כִּי
  choice: అని
  rationale: వారు చూసిన విషయాన్ని పరిచయం చేస్తుంది; కారణార్థకంగా మార్చకుండా గ్రహింపులోని విషయాన్ని నిలుపుతుంది.
- source_word: אָהַב
  choice: ప్రేమిస్తున్నాడని
  rationale: మూల క్రియ సాధారణంగా ‘ప్రేమించు’ అనే అర్థమే ఇస్తుంది. పక్షపాతం భావం పోలిక ద్వారా వస్తుంది కాబట్టి ‘ఆదరించాడు’ అని మార్చలేదు.
- source_word: אֲבִיהֶם
  choice: తమ తండ్రి
  rationale: 3 పురుష బహువచన ప్రత్యయం అన్నదమ్ముల సమూహాన్ని సూచిస్తుంది; అనువర్తక కర్తతో తెలుగులో ‘తమ తండ్రి’ స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: מִכָּל אֶחָיו
  choice: తన కుమారులందరికంటే
  rationale: מן + כל లోని సమగ్ర పోలికను నిలుపుతుంది. అదే వాక్యంలో ‘అతని అన్నదమ్ములు’ అనే పునరుక్తి వల్ల కలిగే అసహజతను నివారిస్తూ, తండ్రి దృష్టిలోని సంబంధాన్ని సహజ తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: וַיִּשְׂנְאוּ
  choice: వారు అతన్ని ద్వేషించారు
  rationale: שׂנא యొక్క నేరమైన అర్థం ‘ద్వేషించు’; కథన భూతకాలాన్ని సరళంగా నిలుపుతుంది.
- source_word: וְלֹא יָכְלוּ
  choice: మాట్లాడలేకపోయారు
  rationale: వారి ద్వేషంతో ముడిపడిన అసమర్థతను సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: דַּבְּרוֹ
  choice: అతనితో ... మాట్లాడలేకపోయారు
  rationale: ప్రత్యయం యోసేపును సూచిస్తుంది; తెలుగు వాడుకలో సంభాషణకు ‘అతనితో మాట్లాడడం’ సహజం.
- source_word: לְשָׁלֹם
  choice: స్నేహపూర్వకంగా
  rationale: ఇక్కడ שָׁלוֹם శాంతియుతమైన, స్నేహపూర్వక సంబంధంలో మాట్లాడడాన్ని సూచిస్తుంది; తెలుగు ప్రధాన పాఠ్యంలో ఉద్దేశిత నుడికారాన్ని స్పష్టంగా అందిస్తుంది.
