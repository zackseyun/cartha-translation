  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּשְׁמַ֣ע רְאוּבֵ֔ן וַ/יַּצִּלֵ֖/הוּ מִ/יָּדָ֑/ם וַ/יֹּ֕אמֶר לֹ֥א נַכֶּ֖/נּוּ נָֽפֶשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/021.yaml
  text: But when Reuben heard it[a], he rescued him from their hand and said, “Let us not take his life.”
translation:
  language: te
  text: రూబేను అది విని, వారి చేతిలోనుండి అతన్ని కాపాడి, “మనం అతని ప్రాణం తీయకూడదు”[a] అని అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మనం అతన్ని చంపకూడదు.” హీబ్రూలో అక్షరార్థంగా, “మనం అతన్ని ప్రాణం పోయేలా కొట్టకూడదు” అని ఉంది; ఇది ప్రాణాంతకంగా కొట్టడాన్ని సూచించే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: అది విని
  rationale: שׁמע యొక్క ప్రాథమిక అర్థం ‘వినడం’. ముందటి వచనంలోని సహోదరుల మాటలను రూబేను విన్నాడనే సందర్భార్థాన్ని తెలుగులో సహజంగా తెలియజేయడానికి ‘అది’ చేర్చబడింది.
- source_word: רְאוּבֵן
  choice: రూబేను
  rationale: వ్యక్తి పేరును ప్రామాణిక తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: וַיַּצִּלֵהוּ
  choice: అతన్ని కాపాడి
  rationale: హిఫిల్ రూపంలోని נצל అంటే ప్రమాదం లేదా ఇతరుల ఆధీనంనుండి విడిపించడం, రక్షించడం. ఈ సందర్భంలో ‘కాపాడి’ సహజమైన ఆధునిక తెలుగు.
- source_word: מִיָּדָם
  choice: వారి చేతిలోనుండి
  rationale: హీబ్రూ నుడికారంలోని ‘చేతి’ అధికారాన్ని లేదా అదుపును సూచిస్తుంది; ఆ రూపకాన్ని తెలుగులోనూ నిలిపాం.
- source_word: וַיֹּאמֶר
  choice: అని అన్నాడు
  rationale: ప్రత్యక్ష వాక్యాన్ని పరిచయం చేసే సహజమైన తెలుగు కథన నిర్మాణం.
- source_word: לֹא נַכֶּנּוּ נָפֶשׁ
  choice: మనం అతని ప్రాణం తీయకూడదు
  rationale: అక్షరార్థంగా ‘ప్రాణానికి సంబంధించి అతన్ని కొట్టకూడదు’ అనే ఈ హీబ్రూ నుడికారం ప్రాణాంతక దెబ్బ కొట్టకూడదని, అంటే చంపకూడదని సూచిస్తుంది. ‘ప్రాణం తీయకూడదు’ మూలంలోని נֶפֶשׁ భావాన్ని స్పష్టంగా నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. ‘వారి చేతిలోనుండి’ అనే హీబ్రూ రూపకం నిలుపబడింది; చివరి నుడికారం అర్థస్పష్టత కోసం సహజమైన తెలుగులో ఇవ్వబడింది.
