  text: וַ/יִּרְא֥וּ אֹת֖/וֹ מֵ/רָחֹ֑ק וּ/בְ/טֶ֨רֶם֙ יִקְרַ֣ב אֲלֵי/הֶ֔ם וַ/יִּֽתְנַכְּל֥וּ אֹת֖/וֹ לַ/הֲמִיתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/018.yaml
  text: They saw him from a distance[a], and before he came near to them, they conspired against him to kill him.
translation:
  language: te
  text: వారు అతన్ని దూరం నుండి చూశారు; అతను తమ దగ్గరికి రాకముందు, అతన్ని చంపడానికి వారు అతనిపై కుట్ర పన్నారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారు అతనికి వ్యతిరేకంగా పన్నాగం పన్నారు.” హీబ్రూ క్రియ కుట్ర పన్నడం లేదా మోసపూరితంగా వ్యవహరించడం అనే భావాన్ని సూచించవచ్చు; ఇక్కడ సందర్భం వారి హత్యాపూర్వక పన్నాగాన్ని స్పష్టం చేస్తుంది.
    reason: వַיִּתְנַכְּלוּ అనే హీబ్రూ క్రియకు ఉన్న సందర్భానుకూలమైన పదార్థ ప్రత్యామ్నాయాన్ని సూచించడానికి.
lexical_decisions:
- source_word: וַיִּרְאוּ אֹתוֹ מֵרָחֹק
  choice: వారు అతన్ని దూరం నుంచే చూశారు
  rationale: ראה అనే క్రియను సహజమైన కథన భూతకాలంలో అనువదించాం. מֵרָחֹק లోని దూర భావాన్ని ‘దూరం నుంచి’ అని, తరువాతి చర్యకు ముందే వారు అతన్ని గమనించారనే సందర్భోచిత నొక్కును ‘-ఏ’తో వ్యక్తం చేశాం.
- source_word: וּבְטֶרֶם יִקְרַב אֲלֵיהֶם
  choice: అతను తమ దగ్గరికి రాకముందే
  rationale: בְטֶרֶם సూచించే ‘ఇంకా జరగకముందు’ అనే కాల సంబంధాన్ని సహజమైన ఆధునిక తెలుగులో నిలిపాం. אֲלֵיהֶם లోని వారి వైపు/వారి దగ్గరకు అనే భావాన్ని ‘తమ దగ్గరికి’ అని ఇచ్చాం.
- source_word: וַיִּתְנַכְּלוּ אֹתוֹ
  choice: అతనికి వ్యతిరేకంగా కుట్ర పన్నారు
  rationale: נכל Hitpael రూపం ఈ సందర్భంలో మోసపూరితమైన, శత్రుత్వపూర్వక పన్నాగాన్ని సూచిస్తుంది. తరువాత వచ్చే హత్య ఉద్దేశానికి సరిపోయేలా ‘కుట్ర పన్నారు’ అని అనువదించాం.
- source_word: לַהֲמִיתוֹ
  choice: అతన్ని చంపడానికి
  rationale: מות Hiphil infinitive construct వారి కుట్ర యొక్క ఉద్దేశాన్ని స్పష్టంగా తెలియజేస్తుంది; ‘చంపడానికి’ అనేది నేరుగా, సహజంగా ఆ ప్రయోజనార్థాన్ని వ్యక్తం చేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన కథన శైలి. హీబ్రూ వాక్య క్రమం, కాల సంబంధం, హత్య ఉద్దేశం స్పష్టంగా నిలుపబడ్డాయి.
