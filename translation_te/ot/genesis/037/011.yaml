    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְקַנְאוּ
  choice: అసూయపడ్డారు
  rationale: ఈ సందర్భంలో קנא యోసేపు పొందిన ప్రత్యేక ఆదరణను, అతని కలలను బట్టి కలిగిన అసూయను సూచిస్తుంది. ఆధునిక తెలుగులో ‘అసూయపడ్డారు’ సహజంగా, మూలార్థానికి సమీపంగా ఉంది.
- source_word: בּוֹ
  choice: అతనిపై
  rationale: קנאతో వచ్చిన ב అసూయకు గురైన వ్యక్తిని సూచిస్తుంది; తెలుగులో ‘అతనిపై అసూయపడ్డారు’ సహజమైన ప్రయోగం.
- source_word: אֶחָיו
  choice: అతని అన్నలు
  rationale: కథనంలో ఇది యోసేపు సహోదరులైన పురుషులను సూచిస్తుంది. వారందరూ అతనికంటే పెద్దవారు కాబట్టి ‘అన్నలు’ సందర్భానుకూలంగా ఉంది.
- source_word: וְאָבִיו
  choice: కానీ అతని తండ్రి
  rationale: וְ సాధారణంగా ‘మరియు’ అయినప్పటికీ, ఇక్కడ అన్నల అసూయకు తండ్రి ఆలోచనాత్మక స్పందన వ్యతిరేకంగా నిలుస్తుంది; ‘కానీ’ ఆ భావసంబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: שָׁמַר
  choice: మనసులో ఉంచుకున్నాడు
  rationale: שׁמר యొక్క ప్రాథమిక భావం ‘కాపాడు/ఉంచు’; ఇక్కడ చెప్పబడిన విషయాన్ని మరచిపోకుండా శ్రద్ధగా దాచుకొని ఆలోచిస్తూ ఉండటాన్ని సూచించే తెలుగు నుడికారాన్ని ఉపయోగించాం.
- source_word: אֶת־הַדָּבָר
  choice: ఆ సంగతి
  rationale: דבר కు ‘మాట,’ ‘విషయం,’ ‘సంగతి’ అనే భావాలు ఉన్నాయి. ఇక్కడ యోసేపు చెప్పిన కలలోని మాటతో పాటు దాని ప్రాముఖ్యతనూ సూచించగల సహజమైన విస్తృత పదం ‘సంగతి’.
