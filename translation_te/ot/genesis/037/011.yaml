  text: So his brothers were jealous of him[a], but his father kept the matter in mind.
translation:
  language: te
  text: అతని సోదరులు అతనిపై అసూయపడ్డారు; కానీ అతని తండ్రి ఆ సంగతి[a] మనసులో ఉంచుకున్నాడు.
  philosophy: optimal-equivalence
  footnotes:
