revisions:
- from: కాబట్టి ఇప్పుడు రండి, మనం అతన్ని చంపి, ఈ గోతుల్లో ఒకదానిలో పడవేద్దాం[a]. ‘ఒక క్రూరమృగం అతన్ని తినేసింది’ అని చెబుదాం[b]. అప్పుడు అతని కలలు ఏమవుతాయో చూద్దాం.”
  to: “ఇప్పుడు రండి, మనం అతనిని చంపి, గోతుల్లో[a] ఒకదానిలో విసిరి పడవేద్దాం. ‘ఒక క్రూరమైన అడవి జంతువు[b] అతనిని తినేసింది’ అని చెప్పుదాం. అప్పుడు అతని కలలు ఏమవుతాయో చూద్దాం.”
  rationale: The revision removes an unsupported demonstrative, restores the explicit throwing sense of the Hebrew verb, relocates both footnote anchors to their relevant terms, and uses consistent quotation punctuation. It retains the source’s ambiguity concerning what will become of Joseph’s dreams and does not import an interpretation about their fulfillment.
