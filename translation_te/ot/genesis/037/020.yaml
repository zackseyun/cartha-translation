id: GEN.37.20
reference: Genesis 37:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/עַתָּ֣ה לְכ֣וּ וְ/נַֽהַרְגֵ֗/הוּ וְ/נַשְׁלִכֵ֨/הוּ֙ בְּ/אַחַ֣ד הַ/בֹּר֔וֹת וְ/אָמַ֕רְנוּ חַיָּ֥ה רָעָ֖ה אֲכָלָ֑תְ/הוּ וְ/נִרְאֶ֕ה מַה יִּהְי֖וּ חֲלֹמֹתָֽי/ו׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/020.yaml
  text: So now[a], come, let us kill him and throw him into one of the pits, and we will say[b], ‘A wild animal has devoured him.’ Then we will see what becomes of his dreams.’
translation:
  language: te
  text: “ఇప్పుడు రండి, మనం అతనిని చంపి, గోతుల్లో[a] ఒకదానిలో విసిరి పడవేద్దాం. ‘ఒక క్రూరమైన అడవి జంతువు[b] అతనిని తినేసింది’ అని చెప్పుదాం. అప్పుడు అతని కలలు ఏమవుతాయో చూద్దాం.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘గోతులు’ అని అనువదించిన హీబ్రూ పదం నీటిని నిల్వచేసే తొట్టులను లేదా బావిలాంటి గోతులను కూడా సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “క్రూరమృగం.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: కాబట్టి ఇప్పుడు
  rationale: సంధాన భావాన్నీ, తక్షణ ప్రతిపాదననూ సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: לְכוּ
  choice: రండి
  rationale: ఇక్కడ వెళ్లమనే అక్షరార్థ ఆజ్ఞకన్నా, సమూహాన్ని చర్యకు ప్రేరేపించే ఉద్బోధన.
- source_word: וְנַהַרְגֵהוּ
  choice: మనం అతన్ని చంపి
  rationale: మొదటి పురుష బహువచన సంకల్పార్థాన్ని తరువాతి ‘పడవేద్దాం’తో కలిసి సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וְנַשְׁלִכֵהוּ
  choice: పడవేద్దాం
  rationale: సమష్టి ప్రతిపాదన భావాన్ని, విసిరి పడేయడం అనే క్రియార్థాన్ని తెలుగులో సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: בְּאַחַד הַבֹּרוֹת
  choice: ఈ గోతుల్లో ఒకదానిలో
  rationale: בּוֹר అనే పదానికి సందర్భంలో ‘గొయ్యి/నీటి తొట్టి’ రెండూ సాధ్యమైనా, సాధారణమైన ‘గోతిలో’ ప్రధాన పాఠానికి తగినది.
- source_word: חַיָּה רָעָה
  choice: ఒక క్రూరమృగం
  rationale: ప్రమాదకరమైన అడవి జంతువు అనే సంయుక్త భావాన్ని సహజమైన, గౌరవప్రదమైన తెలుగులో అందిస్తుంది.
- source_word: אֲכָלָתְהוּ
  choice: అతన్ని తినేసింది
  rationale: ‘తిన్నది’ అనే మూలార్థాన్ని, వ్యక్తిని పూర్తిగా భక్షించిందనే సందర్భబలంతో సహజంగా వ్యక్తం చేస్తుంది; ‘మింగివేసింది’ అని అధికంగా నిర్దిష్టం చేయదు.
- source_word: וְנִרְאֶה מַה יִּהְיוּ חֲלֹמֹתָיו
  choice: అప్పుడు అతని కలలు ఏమవుతాయో చూద్దాం
  rationale: సహోదరుల ఎగతాళితో కూడిన సవాలును, భవిష్య ఫలితాన్ని ఉద్దేశించే అసలు వాక్య నిర్మాణాన్ని నిలుపుతుంది.
theological_decisions:
- issue: యోసేపు కలల భవిష్య ఫలితం గురించి సహోదరుల ఎగతాళి
  choice: అతని కలలు ఏమవుతాయో చూద్దాం
  alternative: అతని కలలు ఎలా నెరవేరుతాయో చూద్దాం
  rationale: అసలు పాఠం కలలు ‘నెరవేరడం’ అని స్పష్టంగా చెప్పదు; ఆ అర్థాన్ని ముందుగానే నిర్ణయించకుండా దాని వ్యంగ్యభరిత అస్పష్టతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, సంభాషణలోని కుట్రపూరిత ఆవేశం మరియు ఎగతాళిని గౌరవప్రదమైన కథన శైలిలో నిలిపింది. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠంలో చేర్చబడ్డాయి.
