reference: Genesis 37:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר הָ/אִישׁ֙ נָסְע֣וּ מִ/זֶּ֔ה כִּ֤י שָׁמַ֨עְתִּי֙ אֹֽמְרִ֔ים נֵלְכָ֖ה דֹּתָ֑יְנָ/ה וַ/יֵּ֤לֶךְ יוֹסֵף֙ אַחַ֣ר אֶחָ֔י/ו וַ/יִּמְצָאֵ֖/ם בְּ/דֹתָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/017.yaml
  text: The man said[a], “They have moved on from here, because I heard them saying[b], ‘Let us go to Dothan.’” So Joseph went after his brothers and found them at Dothan.
translation:
  language: te
  text: ఆ మనిషి, “వాళ్లు ఇక్కడి నుంచి వెళ్లిపోయారు. ఎందుకంటే, ‘మనం దోతానుకు[a] వెళ్దాం’ అని వాళ్లు అనడం నేను విన్నాను[b]” అన్నాడు. కాబట్టి యోసేపు తన సోదరుల వెంట వెళ్లి, దోతానులో వారిని కనుగొన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ‘దోతాను’ అనే స్థలనామానికి దిశను సూచించే ప్రత్యయం ఉంది; అక్షరార్థంగా ‘దోతాను వైపుకు’ అని భావం.
    reason: cultural_note
  - marker: b
    text: లేదా, ‘వాళ్లు చెప్పడం నేను విన్నాను.’
    reason: lexical_alternative
lexical_decisions:
- source_word: נָסְעוּ מִזֶּה
  choice: ఇక్కడి నుంచి వెళ్లిపోయారు
  rationale: נסע అనే క్రియకు శిబిరాన్ని ఎత్తివేసి ముందుకు సాగడం అనే నేపథ్య భావం ఉండవచ్చు; అయితే ఇక్కడ సహజమైన ఆధునిక తెలుగులో స్థలాన్ని విడిచి వెళ్లిన భావాన్ని స్పష్టంగా చెప్పడానికి ఈ రూపం సరిపోతుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ఆ మనిషి చెప్పిన విషయానికి కారణాన్ని పరిచయం చేసే కారణార్థక ప్రయోగాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: שָׁמַעְתִּי אֹמְרִים
  choice: వాళ్లు అనడం నేను విన్నాను
  rationale: ‘విన్నాను’తో పాటు ఉన్న ‘అంటూ/అనుచున్న’ అనే కృదంత నిర్మాణ భావాన్ని సహజ తెలుగులో తెలియజేస్తుంది; సందర్భం వల్ల ‘వాళ్లు’ అనేది యోసేపు సోదరులను సూచిస్తుంది.
- source_word: נֵלְכָה
  choice: మనం ... వెళ్దాం
  rationale: మొదటి పురుష బహువచన cohortative భావమైన పరస్పర ప్రోత్సాహం లేదా నిర్ణయాన్ని ‘వెళ్దాం’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: דֹּתָיְנָה
  choice: దోతాను వైపు
  rationale: స్థలనామానికి జతచేసిన దిశాసూచక ప్రత్యయం దోతాను దిశగా కదలికను సూచిస్తుంది; ‘వైపు’ ఆ సూక్ష్మతను నిలుపుతుంది.
- source_word: אַחַר אֶחָיו
  choice: తన సోదరుల వెంట
  rationale: אַחַר ఇక్కడ మరొకరి వెనుకగా లేదా వారిని అనుసరిస్తూ వెళ్లడాన్ని సూచిస్తుంది; ‘వెంట’ సహజమైన, అతిశయింపులేని అనువాదం.
- source_word: וַיִּמְצָאֵם בְּדֹתָן
  choice: దోతానులో వారిని కనుగొన్నాడు
  rationale: מצא యొక్క సాధారణ కథనార్థమైన ‘కనుగొను’ను, בְ యొక్క స్థలార్థాన్ని నేరుగా తెలియజేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, కథన గౌరవాన్ని నిలుపుతూ అనువదించబడింది. సంభాషణలో సహజమైన ‘వాళ్లు’, కథనంలో గౌరవప్రదమైన ‘సోదరులు’ వాడబడ్డాయి.
