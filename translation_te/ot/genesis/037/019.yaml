  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సహజంగా ఉండేలా, అయితే కథన గౌరవాన్ని నిలుపుతూ అనువదించబడింది. ‘ఆ కలలవాడు’ అనే పదబంధం సహోదరుల తృణీకార, ఎగతాళి స్వరాన్ని సూచిస్తుంది.
