  yaml_path: translation/ot/genesis/037/019.yaml
  text: And they said to one another[a], “Look, this dreamer is coming.”
translation:
  language: te
  text: 'వారు ఒకరితో ఒకరు ఇలా అన్నారు: “అదిగో, ఈ కలలవాడు వస్తున్నాడు[a]!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “కలల యజమాని” లేదా “కలల అధిపతి.” సహోదరుల ఎగతాళి స్వరాన్ని తెలియజేయడానికి ఈ హీబ్రూ వ్యక్తీకరణను “కలలవాడు” అని అనువదించారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: అని చెప్పుకున్నారు
  rationale: హీబ్రూ కథన క్రమంలోని తదుపరి చర్యను సహజమైన తెలుగులో తెలియజేస్తుంది; పరస్పర సంభాషణ కావడంతో ‘చెప్పుకున్నారు’ సందర్భానికి సరిపోతుంది.
- source_word: אִישׁ אֶל־אָחִיו
  choice: ఒకరితో ఒకరు
  rationale: అక్షరార్థంగా ‘ఒకడు తన సహోదరునితో’ అయినా, ఇక్కడ ఇది పరస్పరార్థక ప్రయోగం; ఆధునిక తెలుగులో ‘ఒకరితో ఒకరు’ స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: הִנֵּה
  choice: అదిగో
  rationale: దగ్గరకు వస్తున్న యోసేపువైపు దృష్టిని ఆకర్షించే సూచనాత్మక ఉద్గారం; ‘అదిగో’ ఆధునిక తెలుగులో సహజంగా ఆ పని చేస్తుంది.
- source_word: בַּעַל הַחֲלֹמוֹת
  choice: ఆ కలలవాడు
  rationale: בעל ఇక్కడ కలలతో ప్రత్యేకంగా సంబంధం ఉన్న వ్యక్తిని సూచిస్తుంది. సందర్భంలోని ఎగతాళి స్వరాన్ని ‘కలలవాడు’ సహజంగా అందిస్తుంది; ‘కలల యజమాని’ అక్షరార్థానికి దగ్గరైనా తెలుగులో అసహజంగా ఉండి వేరొక అర్థాన్ని సూచించవచ్చు.
- source_word: הַלָּזֶה
  choice: ఆ
  rationale: యోసేపును చూపిస్తూ పలికిన తృణీకార ఛాయను తెలుగులో ‘ఆ కలలవాడు’ సహజంగా మోస్తుంది.
- source_word: בָּא
  choice: వస్తున్నాడు
  rationale: בוא క్రియారూపం కొనసాగుతున్న సమీపాగమనాన్ని సూచిస్తుంది; ‘వస్తున్నాడు’ దాని కాలాంశాన్ని సహజంగా ప్రతిబింబిస్తుంది.
