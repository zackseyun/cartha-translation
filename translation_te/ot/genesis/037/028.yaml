id: GEN.37.28
reference: Genesis 37:28
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּֽעַבְרוּ֩ אֲנָשִׁ֨ים מִדְיָנִ֜ים סֹֽחֲרִ֗ים וַֽ/יִּמְשְׁכוּ֙ וַ/יַּֽעֲל֤וּ אֶת יוֹסֵף֙ מִן הַ/בּ֔וֹר וַ/יִּמְכְּר֧וּ אֶת יוֹסֵ֛ף לַ/יִּשְׁמְעֵאלִ֖ים בְּ/עֶשְׂרִ֣ים כָּ֑סֶף וַ/יָּבִ֥יאוּ אֶת יוֹסֵ֖ף מִצְרָֽיְמָ/ה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/028.yaml
  text: Then Midianite men[a], traders, passed by; and they pulled Joseph up and lifted him out of the pit, and sold Joseph to the Ishmaelites for twenty pieces of silver[c][b]. Then they brought Joseph to Egypt.
translation:
  language: te
  text: అప్పుడు మిద్యానీయులైన వర్తకులు అటుగా వెళ్లారు. వారు యోసేపును గోతిలోనుండి లాగి పైకి తీశారు; యోసేపును ఇష్మాయేలీయులకు ఇరవై వెండి ముక్కలకు[a] అమ్మారు. తరువాత వారు యోసేపును ఐగుప్తుకు తీసుకువెళ్లారు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ మూలంలో అక్షరార్థంగా ‘ఇరవై వెండి’ అని ఉంది; ఏ కొలమానమో స్పష్టంగా చెప్పలేదు.
    reason: lexical_alternative
  - marker: b
    text: మిద్యానీయ వర్తకులు, ఇష్మాయేలీయులు ఇద్దరూ ఈ వాక్యంలో ప్రస్తావించబడ్డారు. తరువాతి క్రియలన్నీ బహువచనంలో ఉండటంతో ప్రతి చర్యను ఏ గుంపు చేసిందో హీబ్రూ పాఠం పూర్తిగా స్పష్టం చేయదు.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַבְרוּ
  choice: అటుగా వెళ్లారు
  rationale: עבר ఇక్కడ ఆ ప్రదేశం మీదుగా వెళ్లడాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘అటుగా వెళ్లారు’ సహజంగా ఈ భావాన్ని తెలియజేస్తుంది.
- source_word: אֲנָשִׁים מִדְיָנִים סֹחֲרִים
  choice: మిద్యానీయులైన వర్తకులు
  rationale: ‘మిద్యాను మనుషులు, వర్తకులు’ అనే మూలంలోని జాతి గుర్తింపును, వృత్తిని సహజమైన తెలుగులో నిలుపుతుంది; אֲנָשִׁים ను విడిగా ‘మనుషులు’ అని అనడం తెలుగులో అనవసరంగా బరువుగా ఉంటుంది.
- source_word: וַיִּמְשְׁכוּ וַיַּעֲלוּ
  choice: లాగి పైకి తీశారు
  rationale: రెండు హీబ్రూ క్రియలైన ‘లాగడం’, ‘పైకి తీసుకురావడం’ అనే వరుసను సహజమైన తెలుగు సంయుక్త క్రియతో నిలుపుతుంది.
- source_word: מִן הַבּוֹר
  choice: గోతిలోనుండి
  rationale: בּוֹר కు ‘గోతి’ లేదా ‘నీటి తొట్టి’ అనే భావాలు ఉండవచ్చు; కథా సందర్భంలో ‘గోతి’ స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: לַיִּשְׁמְעֵאלִים
  choice: ఇష్మాయేలీయులకు
  rationale: అమ్మకం ఎవరికి జరిగిందో మూలంలో ఉన్న విధంగానే జాతి పేరుతో సూచిస్తుంది.
- source_word: בְּעֶשְׂרִים כָּסֶף
  choice: ఇరవై వెండి నాణాలకు
  rationale: అక్షరార్థంగా ‘ఇరవై వెండి’; లెక్కింపు ఘటకం మూలంలో చెప్పబడలేదు. తెలుగులో ధరగా అర్థమయ్యేలా ‘నాణాలు’ చేర్చి, దాని గురించి పాదటిప్పణి ఇచ్చింది.
- source_word: וַיָּבִיאוּ אֶת־יוֹסֵף מִצְרָיְמָה
  choice: వారు యోసేపును ఐగుప్తుకు తీసుకువెళ్లారు
  rationale: בוא హిఫిల్ రూపంలోని ‘తీసుకురావడం/చేర్చడం’ భావాన్ని గమ్యస్థానానికి ప్రయాణించే కథన సందర్భంలో సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: మిద్యానీయులు, ఇష్మాయేలీయులు ప్రస్తావించబడిన తరువాత వచ్చే బహువచన క్రియల కర్త ఎవరు?
  choice: ‘వారు’ అనే సాధారణ బహువచన సర్వనామాన్ని ఉంచి కర్తను నిర్ధారించకుండా అనువదించడం
  alternative: అన్ని చర్యలనూ మిద్యానీయ వర్తకులకే ఆపాదించడం; లేదా అమ్మకం, ఐగుప్తుకు తీసుకువెళ్లడం ఇష్మాయేలీయుల చర్యలని స్పష్టీకరించడం
  rationale: హీబ్రూ వాక్యంలో బహువచన క్రియల కర్తను ప్రతి దశలో స్పష్టంగా మళ్లీ పేర్కొనలేదు. అందువల్ల పాఠంలోని నిజమైన అస్పష్టతను అనువాదం పరిష్కరించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యే, గౌరవప్రదమైన కథన శైలి. ‘మిద్యానీయులు,’ ‘ఇష్మాయేలీయులు,’ ‘ఐగుప్తు’ వంటి బైబిలు పేర్లకు సుపరిచిత తెలుగు రూపాలు ఉపయోగించబడ్డాయి.
