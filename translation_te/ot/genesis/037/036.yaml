translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. మూలంలోని జాతిపేరు భిన్నతను మరియు రెండు రాజాస్థాన పదవుల అర్థవిస్తృతిని పాదటిప్పణుల్లో భద్రపరిచాం. ప్రధాన వాక్యంలో ప్రతి పాదటిప్పణి సూచిక [a], [b], [c] సంబంధిత పదం వెంట ఉంచబడింది.
