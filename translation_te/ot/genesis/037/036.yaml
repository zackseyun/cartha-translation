source:
  edition: WLC
  text: וְ/הַ֨/מְּדָנִ֔ים מָכְר֥וּ אֹת֖/וֹ אֶל מִצְרָ֑יִם לְ/פֽוֹטִיפַר֙ סְרִ֣יס פַּרְעֹ֔ה שַׂ֖ר הַ/טַּבָּחִֽים־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/036.yaml
  text: Meanwhile[a], the Medanites sold him into Egypt to Potiphar, an officer of Pharaoh[c][b], the captain of the guard.
translation:
  language: te
  text: ఇంతలో మిద్యానీయులు[a] అతణ్ణి ఐగుప్తుకు తీసుకెళ్లి, ఫరో ఆస్థాన అధికారి[b], అంగరక్షక దళాధిపతి[c] అయిన పోతీఫరుకు అమ్మారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ మసొరా పాఠంలో ‘మెదానీయులు’ అని ఉంది; సమీప కథనం మరియు ప్రాచీన అనువాదాల దృష్ట్యా ఇక్కడ సంప్రదాయంగా ‘మిద్యానీయులు’ అని అర్థం చేసుకుంటారు.
    reason: alternative_reading
  - marker: b
    text: లేదా ‘ఫరోకు చెందిన నపుంసకుడు,’ లేదా ‘ఫరో రాజోద్యోగి.’ హీబ్రూ పదం నిజంగా నపుంసకుడైన వ్యక్తిని గానీ, రాజాస్థాన అధికారిని గానీ సూచించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: అక్షరార్థంగా ‘వధించేవారి అధిపతి.’ రాజాస్థాన సందర్భంలో ఇది అంగరక్షకుల లేదా శిక్ష అమలుదారుల అధిపతిని సూచించే అవకాశం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַמְּדָנִים
  choice: ఇంతలో మిద్యానీయులు[a]
  rationale: וְ కథనంలోని దృశ్యమార్పును సూచిస్తున్నందున సహజమైన తెలుగులో ‘ఇంతలో’ అని ఇచ్చాం. మసొరా పాఠంలో జాతిపేరు అక్షరరూపం ‘మెదానీయులు’; అయితే సమీప సందర్భం (ఆది 37:28) మరియు ప్రాచీన అనువాదాల ఆధారంగా ప్రధాన పాఠంలో ‘మిద్యానీయులు’ అని ఉంచి, భిన్నతను పాదటిప్పణిలో నిలిపాం.
- source_word: מָכְרוּ אֹתוֹ
  choice: అతణ్ణి ... అమ్మారు
  rationale: Qal perfect 3cp కథనంలోని సాధారణ భూతకాల చర్యను సూచిస్తుంది; אֹתוֹ యోసేపును సూచించే ప్రత్యక్ష కర్మ.
- source_word: אֶל מִצְרָיִם
  choice: ఐగుప్తుకు తీసుకెళ్లి
  rationale: אֶל దిశను సూచిస్తుంది. తెలుగులో ‘ఐగుప్తుకు అమ్మారు’ అనేది అసహజంగా లేదా దేశానికే అమ్మినట్లు వినిపించవచ్చు; అందువల్ల గమ్యదిశను స్పష్టంగా, సహజంగా వ్యక్తపరచడానికి ‘ఐగుప్తుకు తీసుకెళ్లి ... అమ్మారు’ అని ఇచ్చాం.
- source_word: לְפוֹטִיפַר
  choice: పోతీఫరుకు
  rationale: לְ కొనుగోలుదారుని సూచిస్తుంది; పేరును ప్రాచుర్యంలో ఉన్న తెలుగు రూపంలో లిప్యంతరీకరించాం.
- source_word: סְרִיס פַּרְעֹה
  choice: ఫరో ఆస్థాన అధికారి[b]
  rationale: סָרִיס అనే పదం నపుంసకుని గానీ రాజోద్యోగిని గానీ సూచించగలదు. సందర్భంలో పదవిని అతిగా నిర్ధారించకుండా ‘ఆస్థాన అధికారి’ అని ఇచ్చి, అసలు పదంలోని అర్థవిస్తృతిని పాదటిప్పణిలో తెలిపాం.
- source_word: שַׂר הַטַּבָּחִים
  choice: అంగరక్షక దళాధిపతి[c]
  rationale: అక్షరార్థంగా ‘వధించేవారి అధిపతి.’ రాజాస్థాన సందర్భంలో ఇది శిక్ష అమలుదారులు లేదా అంగరక్షకుల అధిపతిని సూచించే పదవిగా అర్థమవుతుంది; సహజమైన పదవీ నామంగా ‘అంగరక్షక దళాధిపతి’ ఎంచుకున్నాం.
