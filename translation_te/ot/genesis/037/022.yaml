  text: וַ/יֹּ֨אמֶר אֲלֵ/הֶ֣ם רְאוּבֵן֮ אַל תִּשְׁפְּכוּ דָם֒ הַשְׁלִ֣יכוּ אֹת֗/וֹ אֶל הַ/בּ֤וֹר הַ/זֶּה֙ אֲשֶׁ֣ר בַּ/מִּדְבָּ֔ר וְ/יָ֖ד אַל תִּשְׁלְחוּ ב֑/וֹ לְמַ֗עַן הַצִּ֤יל אֹת/וֹ֙ מִ/יָּדָ֔/ם לַ/הֲשִׁיב֖/וֹ אֶל אָבִֽי/ו׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/022.yaml
  text: And Reuben said to them[a], “Do not shed blood. Throw him into this pit that is in the wilderness, but do not lay a hand on him”—that he might rescue him from their hand[b], to return him to his father.
translation:
  language: te
  text: 'రూబేను వారితో, “రక్తం చిందించవద్దు. అరణ్యంలో ఉన్న ఈ గోతిలో[a] అతణ్ణి పడవేయండి; అతని మీద చెయ్యి వేయవద్దు” అని అన్నాడు—వారి చేతిలోనుండి అతణ్ణి విడిపించి అతని తండ్రి దగ్గరికి తిరిగి చేర్చాలనే ఉద్దేశంతో.


    [a] లేదా “నీటి తొట్టిలో.” హీబ్రూ בּוֹר పదం నీటి గోతిని లేదా నీటి తొట్టిని సూచించవచ్చు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నీటి తొట్టిలో.” హీబ్రూ בּוֹר పదం నీటి గోతిని లేదా నీటి తొట్టిని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּשְׁפְּכוּ דָם
  choice: రక్తం చిందించవద్దు
  rationale: హీబ్రూ నుడికారంలోని ‘రక్తం చిందించడం’ అనే రూపాన్ని నిలుపుతూ, హత్య లేదా రక్తాపరాధానికి దారితీసే హింసను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: הַשְׁלִיכוּ אֹתוֹ
  choice: అతణ్ణి పడవేయండి
  rationale: శరీరాన్ని గోతిలో వేయమనే భౌతిక చర్యను స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: הַבּוֹר
  choice: గోతి
  rationale: בּוֹר అనే పదానికి గోతి, నీటి గోతి, తొట్టి అనే అర్థాలు ఉండవచ్చు. ప్రధాన పాఠ్యంలో విస్తృతమైన ‘గోతి’ని వాడి, మరింత నిర్దిష్టమైన అర్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: אֲשֶׁר בַּמִּדְבָּר
  choice: అరణ్యంలో ఉన్న
  rationale: సంబంధవాచక నిర్మాణాన్ని స్పష్టంగా ప్రతిబింబిస్తుంది; מִדְבָּר ఇక్కడ తప్పనిసరిగా ఇసుక ఎడారిని కాక జనావాసం లేని అరణ్యప్రాంతాన్ని సూచిస్తుంది.
- source_word: וְיָד אַל תִּשְׁלְחוּ בוֹ
  choice: అతని మీద చెయ్యి వేయవద్దు
  rationale: వ్యక్తిగతంగా అతనికి హాని చేయవద్దనే హీబ్రూ నుడికార భావాన్ని తెలుగులో సుపరిచితమైన నుడికారంతో తెలియజేస్తుంది.
- source_word: הַצִּיל אֹתוֹ מִיָּדָם
  choice: వారి చేతిలోనుండి అతణ్ణి విడిపించి
  rationale: ‘చేతిలోనుండి’ అనే హీబ్రూ అధికార/నియంత్రణ నుడికారాన్ని నిలుపుతూ, נצל యొక్క రక్షించి విడిపించే భావాన్ని అందిస్తుంది.
- source_word: לַהֲשִׁיבוֹ אֶל אָבִיו
  choice: అతని తండ్రి దగ్గరికి తిరిగి చేర్చాలనే
  rationale: హిఫిల్ రూపంలోని ‘తిరిగి వెళ్లేలా చేయడం’ అనే భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: לְמַעַן తో ప్రారంభమయ్యే ఉద్దేశ్య వాక్యం ఎవరి మాటగా గ్రహించాలి
  choice: ప్రత్యక్ష సంభాషణ ముగిసిన తర్వాత రూబేను అంతరంగ ఉద్దేశాన్ని తెలిపే కథకుని వ్యాఖ్యగా చూపడం
  alternative: ఆ మాటలను రూబేను ప్రత్యక్ష సంభాషణలో భాగంగా చూపడం
  rationale: హీబ్రూ వాక్యనిర్మాణం ఈ భాగాన్ని రూబేను పలికిన మాటలకన్నా అతడు అలా చెప్పిన ఉద్దేశాన్ని వివరించే కథన వ్యాఖ్యగా బలంగా సూచిస్తుంది. డాష్ ఈ మార్పును స్పష్టం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ‘రక్తం చిందించవద్దు,’ ‘చెయ్యి వేయవద్దు,’ ‘వారి చేతిలోనుండి’ వంటి మూల నుడికారాలను తెలుగులో సహజంగా నిలిపాం. ప్రత్యక్ష సంభాషణ నుంచి కథకుని ఉద్దేశ్య వివరణకు మార్పును డాష్‌తో సూచించాం.
