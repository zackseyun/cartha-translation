base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/012.yaml
  text: His brothers went to pasture their father's flock at Shechem[a].
translation:
  language: te
  text: అతని అన్నదమ్ములు షెకెము వద్ద[a] తమ తండ్రి మందను మేపడానికి వెళ్లారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘షెకెములో.’ హీబ్రూ ఉపసర్గ ఆ స్థలంలో లేదా ఆ స్థలం వద్ద/దాని పరిసరాల్లో అనే అర్థాన్ని ఇవ్వగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: వెళ్లారు
  rationale: הלך క్రియ యొక్క వయ్యిక్తోల్ రూపం కథనంలోని తదుపరి సంఘటనను సూచిస్తుంది. తెలుగులో ‘వెళ్లారు’ సహజమైన, సూటి అనువాదం; మూలంలో లేని ‘అప్పుడు/ఇప్పుడు’ వంటి కాలసూచక పదాన్ని చేర్చలేదు.
- source_word: אֶחָיו
  choice: అతని అన్నదమ్ములు
  rationale: సందర్భంలో ఇది యోసేపు యొక్క పురుష సహోదరులను సూచిస్తుంది. ఆధునిక ప్రామాణిక తెలుగులో ‘అన్నదమ్ములు’ సహజంగా ఈ భావాన్ని అందిస్తుంది.
- source_word: לִרְעוֹת
  choice: మేపడానికి
  rationale: רעה ఇక్కడ మందను మేపడం, కాయడం అనే కార్యాన్ని సూచిస్తుంది. ఉద్దేశార్థక infinitive‌ను తెలుగులో ‘మేపడానికి’ అని సహజంగా వ్యక్తం చేశాం.
- source_word: אֶת
  choice: '[ప్రత్యక్ష కర్మ సూచిక; విడిగా అనువదించలేదు]'
  rationale: אֵת నిర్దిష్ట ప్రత్యక్ష కర్మను గుర్తించే వ్యాకరణ సూచిక; తెలుగులో దీనికి స్వతంత్ర పదం అవసరం లేదు.
- source_word: צֹאן
  choice: మందను
  rationale: צֹאן గొర్రెలు, మేకలు వంటి చిన్న పశువుల సమూహాన్ని సూచించే సమష్టి పదం. జాతిని అనవసరంగా పరిమితం చేయకుండా ‘మంద’ ఆ భావాన్ని సహజంగా ఇస్తుంది.
- source_word: אֲבִיהֶם
  choice: తమ తండ్రి
  rationale: ప్రత్యయంతో కూడిన నిర్మాణం ‘వారి తండ్రికి చెందిన’ అనే స్వామ్యాన్ని తెలియజేస్తుంది. కర్తతో అన్వయించే తెలుగులో ‘తమ తండ్రి’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: בִּשְׁכֶם
  choice: షెకెము దగ్గరికి
  rationale: స్థలనామాన్ని ‘షెకెము’గా లిప్యంతరీకరించాం. ב ఉపసర్గ ఇక్కడ పట్టణంలోనే లేదా దాని వద్ద/పరిసరాల్లో అనే స్థలార్థాన్ని ఇవ్వగలదు; మేత సందర్భంలో ప్రధాన పాఠ్యానికి ‘దగ్గరికి’ సహజంగా సరిపోతుంది.
