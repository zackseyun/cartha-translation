translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే, గౌరవప్రదమైన కథనశైలి. మూలంలోని క్రమసూచక వావ్ కోసం అదనంగా ‘అప్పుడు’ అనే పదాన్ని చేర్చలేదు. ‘దగ్గరికి’తో గమ్యార్థం తెలుగులో సహజంగా వ్యక్తమవుతుంది; స్థలార్థంలోని నిజమైన సందిగ్ధతను పాదటీపులో నిలిపాం.
