  text: Jacob lived in the land of his father's sojournings[a], in the land of Canaan.
translation:
  language: te
  text: యాకోబు తన తండ్రి పరదేశిగా నివసించిన దేశంలో, కనాను దేశంలో నివసించాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత అక్షరార్థంగా: “యాకోబు తన తండ్రి పరదేశ నివాసాల దేశంలో, కనాను దేశంలో నివసించాడు.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: నివసించాడు
  rationale: ישׁב ఇక్కడ ఒక ప్రాంతంలో నివసించడాన్ని సూచిస్తుంది. కథనాన్ని ముందుకు నడిపించే וַ־కు తెలుగులో ప్రత్యేక కాలసూచక పదాన్ని చేర్చకుండా సహజమైన వాక్యక్రమంతో భావాన్ని తెలిపాం.
- source_word: בְּאֶרֶץ
  choice: దేశంలో
  rationale: אֶרֶץ ఇక్కడ భౌగోళిక ప్రాంతాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘దేశం’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: מְגוּרֵי
  choice: పరదేశిగా నివసించిన
  rationale: מְגוּרִים కేవలం నివాసాన్ని మాత్రమే కాక, స్వదేశీయుడు కానివానిగా తాత్కాలికంగా నివసించే భావాన్నీ కలిగి ఉంది. ‘పరదేశిగా నివసించిన’ ఆ ముఖ్యమైన సూక్ష్మార్థాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: אָבִיו
  choice: తన తండ్రి
  rationale: సర్వనామ సంబంధాన్ని స్పష్టంగా తెలుపుతుంది; ఇక్కడ తండ్రి ఇస్సాకును సూచిస్తున్నాడు.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: కనాను దేశంలో
  rationale: మూలంలోని భౌగోళిక నిర్దిష్టీకరణను నిలుపుతుంది. ‘అంటే’ ద్వారా ఇది ముందున్న దేశానికే వివరణ అని తెలుగులో సహజంగా చూపించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన శైలి. ‘పరదేశిగా’ అనే పదం מגורי లోని విదేశీయ నివాస భావాన్ని కాపాడుతుంది; ‘అంటే’ మూలంలోని సమానాధికార భౌగోళిక వివరణను సహజంగా తెలియజేస్తుంది.
