translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథనశైలి వాడబడింది. హీబ్రూలో మూడుసార్లు వచ్చిన וְהִנֵּה ను ప్రతిసారీ ‘ఇదిగో’గా ఉంచి కల వర్ణనలోని జీవంతత్వం, పునరుక్తి కాపాడబడ్డాయి.
