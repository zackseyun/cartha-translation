source:
  edition: WLC
  text: וְ֠/הִנֵּה אֲנַ֜חְנוּ מְאַלְּמִ֤ים אֲלֻמִּים֙ בְּ/ת֣וֹךְ הַ/שָּׂדֶ֔ה וְ/הִנֵּ֛ה קָ֥מָה אֲלֻמָּתִ֖/י וְ/גַם נִצָּ֑בָה וְ/הִנֵּ֤ה תְסֻבֶּ֨ינָה֙ אֲלֻמֹּ֣תֵי/כֶ֔ם וַ/תִּֽשְׁתַּחֲוֶ֖יןָ לַ/אֲלֻמָּתִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/007.yaml
  text: And behold[a], we were binding sheaves in the midst of the field, and behold, my sheaf rose and also stood upright; and behold[c][b], your sheaves gathered around and bowed down to my sheaf.
translation:
  language: te
  text: “ఇదిగో, మనం పొలం నడుమ ధాన్యపు కట్టలు కడుతున్నాం; ఇదిగో, నా ధాన్యపు కట్ట లేచి, అంతేకాక నిటారుగా నిలబడింది; ఇదిగో, మీ ధాన్యపు కట్టలు నా ధాన్యపు కట్ట చుట్టూ చేరి[a] దానికి వంగి నమస్కరించాయి[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “చుట్టుముట్టి”; హీబ్రూ క్రియకు చుట్టూ తిరగడం లేదా చుట్టూ వెళ్లడం అనే భావం ఉంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “సాష్టాంగపడ్డాయి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: ఇదిగో ... ఇదిగో ... ఇదిగో
  rationale: కల వర్ణనలోని తక్షణత్వాన్ని, మూడు సార్లు వచ్చిన పునరుక్తిని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: מְאַלְּמִים אֲלֻמִּים
  choice: పనలు కడుతూ ఉన్నాం
  rationale: క్రియకూ దాని సహజాత నామవాచకానికీ ఉన్న వ్యవసాయ భావాన్ని సహజమైన తెలుగు ప్రయోగంతో తెలియజేస్తుంది.
- source_word: בְּתוֹךְ הַשָּׂדֶה
  choice: పొలం మధ్యలో
  rationale: సాధారణంగా ‘పొలంలో’ అనడం కంటే בְּתוֹךְ సూచించే మధ్య/లోపలి స్థల భావాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: קָמָה
  choice: లేచి
  rationale: పన పైకి లేచిన కదలికను తెలియజేసి, తరువాతి ‘నిలబడింది’ అనే స్థితికి దారితీస్తుంది.
- source_word: וְגַם נִצָּבָה
  choice: నిటారుగా నిలబడింది
  rationale: లేచిన తరువాత స్థిరంగా, నిటారుగా నిలిచిన భావాన్ని సహజంగా వ్యక్తం చేస్తుంది; גם యొక్క అదనపు బలాన్ని సందర్భంలో క్రమం ద్వారా తెలియజేస్తుంది.
- source_word: תְסֻבֶּינָה
  choice: చుట్టూ చేరి
  rationale: తిరగడం లేదా చుట్టుముట్టడం అనే మూలభావాన్ని, కలలో పనలు చుట్టూ కూడిన దృశ్యానికి సరిపోయే సహజమైన తెలుగులో అందిస్తుంది.
- source_word: וַתִּשְׁתַּחֲוֶיןָ
  choice: వంగి నమస్కరించాయి
  rationale: తమను తాము వంచుకొని నమస్కరించడం అనే క్రియ యొక్క సాధారణ భావాన్ని తెలియజేస్తుంది; రాజకీయ లేదా ఆరాధనా భావాన్ని అవసరానికి మించి నిర్దిష్టం చేయదు.
- source_word: אֲלֻמָּתִי / אֲלֻמֹּתֵיכֶם
  choice: నా పన / మీ పనలు
  rationale: వ్యవసాయ సందర్భానికి తగిన ‘పన’ అనే పదాన్ని ఏకరీతిగా వాడి కలలోని ప్రతీకాత్మక సరిపోలికను స్పష్టంగా ఉంచుతుంది.
