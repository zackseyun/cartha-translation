id: GEN.37.35
reference: Genesis 37:35
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּקֻמוּ֩ כָל בָּנָ֨י/ו וְ/כָל בְּנֹתָ֜י/ו לְ/נַחֲמ֗/וֹ וַ/יְמָאֵן֙ לְ/הִתְנַחֵ֔ם וַ/יֹּ֕אמֶר כִּֽי אֵרֵ֧ד אֶל בְּנִ֛/י אָבֵ֖ל שְׁאֹ֑לָ/ה וַ/יֵּ֥בְךְּ אֹת֖/וֹ אָבִֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/035.yaml
  text: Then all his sons and all his daughters rose up to comfort him[a], but he refused to be comforted and said, “For I will go down to Sheol to my son[b], mourning.” So his father wept for him.
translation:
  language: te
  text: అప్పుడు అతని కుమారులందరూ, కుమార్తెలందరూ అతన్ని ఓదార్చడానికి లేచారు. కానీ అతడు ఓదార్పు పొందడానికి నిరాకరించి, “నేను నా కుమారుని దగ్గరికి, దుఃఖిస్తూ, షెయోల్‌కు[a] దిగిపోతాను” అన్నాడు.[b] అతని తండ్రి అతని కోసం ఏడ్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ: “షెయోల్”; మృతుల లోకం అని అర్థం. దీనిని “సమాధి” అని కూడా అనువదించవచ్చు.'
    reason: lexical_alternative
  - marker: b
    text: లేదా, “నేను దుఃఖిస్తూ షెయోల్‌కు నా కుమారుని దగ్గరికి దిగిపోతాను.”
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: וַיָּקֻמוּ
  choice: లేచారు
  rationale: קום అనే సాధారణ కథన క్రియలోని చర్యను సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: כָל בָּנָיו וְכָל בְּנֹתָיו
  choice: అతని కుమారులందరూ, కుమార్తెలందరూ
  rationale: హీబ్రూ మూలంలో కుమారులు, కుమార్తెలు విడిగా పేర్కొనబడినందున ఆ భేదాన్ని నిలుపుతుంది.
- source_word: לְנַחֲמוֹ ... לְהִתְנַחֵם
  choice: అతన్ని ఓదార్చడానికి ... ఓదార్పు పొందడానికి
  rationale: మొదటిది ఇతరులు ఇచ్చే ఓదార్పును, రెండవది ఆ ఓదార్పును స్వీకరించడం లేదా పొందడాన్ని సూచించేలా సహజంగా అనువదించబడింది.
- source_word: וַיְמָאֵן
  choice: నిరాకరించి
  rationale: మאן క్రియలోని క్రియాశీల నిరాకరణ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: אֵרֵד
  choice: దిగిపోతాను
  rationale: ירד యొక్క ‘కిందికి దిగడం’ అనే దిశాత్మక భావాన్ని, పాతాళానికి వెళ్లడమనే సందర్భాన్ని నిలుపుతుంది.
- source_word: אֶל־בְּנִי
  choice: నా కుమారుని దగ్గరికి
  rationale: אֶל యొక్క ‘వైపు/దగ్గరికి’ భావాన్ని అదనపు వివరణ లేకుండా కాపాడుతుంది.
- source_word: אָבֵל
  choice: దుఃఖిస్తూనే
  rationale: యాకోబు దుఃఖస్థితిలోనే దిగిపోతానని చెప్పే భావాన్ని సహజమైన తెలుగు క్రియావిశేషణ రూపంలో ఇస్తుంది.
- source_word: שְׁאֹלָה
  choice: పాతాళానికి
  rationale: షెయోల్‌ను కేవలం సమాధిగా కుదించకుండా, మృతుల లోకాన్ని సూచించే సంప్రదాయబద్ధమైన విస్తృత తెలుగు పదాన్ని వాడుతుంది; లిప్యంతరీకరణను పాదసూచికలో ఇస్తుంది.
- source_word: וַיֵּבְךְּ אֹתוֹ אָבִיו
  choice: అతని తండ్రి అతని కోసం ఏడ్చాడు
  rationale: ‘అతని తండ్రి’ కర్తగా, ‘అతని కోసం’ కర్మసంబంధ భావంగా ఉన్న మూల వాక్య నిర్మాణాన్ని స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: שְׁאוֹל (షెయోల్) పదానికి అనువాదం
  choice: పాతాళం
  alternative: షెయోల్; మృతుల లోకం; సమాధి
  rationale: ఈ సందర్భంలో పదాన్ని కేవలం భౌతిక సమాధికి పరిమితం చేయకుండా మృతుల లోకమనే విస్తృత పాత నిబంధన భావాన్ని నిలుపుతుంది; తరువాతి కాలపు నరక సిద్ధాంతాన్ని దీనిలోకి బలవంతంగా చేర్చదు.
- issue: אֶל־בְּנִי אָבֵל שְׁאֹלָה పదబంధ అనుసంధానం
  choice: “నేను దుఃఖిస్తూనే నా కుమారుని దగ్గరికి పాతాళానికి దిగిపోతాను”
  alternative: “నా కుమారుని కోసం దుఃఖిస్తూ పాతాళానికి దిగిపోతాను”
  rationale: ‘నా కుమారుని దగ్గరికి’ అనే మూలంలోని אֶל సంబంధాన్ని ప్రధాన పాఠ్యంలో నిలుపుతూ, אָבֵל ఏ భాగంతో అనుసంధానమవుతుందో ఉన్న స్వల్ప సందిగ్ధతను పాదసూచికలో సంరక్షిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సామాన్య పాఠకులకు అర్థమయ్యే శైలి. ‘ఓదార్పు పొందడం’ సహజమైన తెలుగు ప్రయోగం; ‘పాతాళం’ అనే పదం ఇక్కడ తరువాతి కాలపు ‘నరకం’ భావంలో కాక, షెయోల్/మృతుల లోకం అనే అర్థంలో వాడబడింది. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
