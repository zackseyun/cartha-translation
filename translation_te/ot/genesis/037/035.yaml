  to: అప్పుడు అతని కుమారులందరూ, కుమార్తెలందరూ అతన్ని ఓదార్చడానికి లేచారు. కానీ అతడు ఓదార్పు పొందడానికి నిరాకరించి, “నేను నా కుమారుని దగ్గరికి, దుఃఖిస్తూ, షెయోల్‌కు[a] దిగిపోతాను” అన్నాడు.[b] అతని తండ్రి అతని కోసం ఏడ్చాడు.
  rationale: షెయోల్‌ను లిప్యంతరీకరించడం ద్వారా మూలంలోని మృతుల లోకానికి సంబంధించిన భావాన్ని ‘పాతాళం’/నరకం అనే మరింత నిర్దిష్ట భావానికి కుదించకుండా ఉంచాం. వాక్యంలోని పదక్రమాన్ని తెలుగుకు సహజంగా సవరించాం; అయినా ఎల్-బెని (‘నా కుమారుని దగ్గరికి’), అవేల్ (‘దుఃఖిస్తూ’), షెయోలాహ్ (‘షెయోల్‌కు’) అనే మూడు అంశాలన్నీ ప్రధాన పాఠ్యంలోనే ఉన్నాయి. ప్రత్యామ్నాయ పాదసూచిక పదబంధ-అనుసంధాన సందిగ్ధతను నిలుపుతుంది, కానీ ‘నా కుమారుని దగ్గరికి’ అనే మూల సంబంధాన్ని మార్చదు.
