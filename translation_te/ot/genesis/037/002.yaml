source:
  edition: WLC
  text: אֵ֣לֶּה תֹּלְד֣וֹת יַעֲקֹ֗ב יוֹסֵ֞ף בֶּן שְׁבַֽע עֶשְׂרֵ֤ה שָׁנָה֙ הָיָ֨ה רֹעֶ֤ה אֶת אֶחָי/ו֙ בַּ/צֹּ֔אן וְ/ה֣וּא נַ֗עַר אֶת בְּנֵ֥י בִלְהָ֛ה וְ/אֶת בְּנֵ֥י זִלְפָּ֖ה נְשֵׁ֣י אָבִ֑י/ו וַ/יָּבֵ֥א יוֹסֵ֛ף אֶת דִּבָּתָ֥/ם רָעָ֖ה אֶל אֲבִי/הֶֽם׀־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/002.yaml
  text: 'These are the generations of Jacob: Joseph[a], being seventeen years old, was shepherding the flock with his brothers. He was a youth with the sons of Bilhah and the sons of Zilpah, his father''s wives[c][b], and Joseph brought a bad report about them to their father.'
translation:
  language: te
  text: యాకోబు వంశచరిత్ర ఇదే:[a] యోసేపు పదిహేడేళ్ల వయసులో తన సహోదరులతో కలిసి మందను మేపుతూ ఉండేవాడు. అతడు యువకుడై, తన తండ్రి భార్యలైన బిల్హా, జిల్పాల కుమారులతో కలిసి ఉండేవాడు.[b] యోసేపు వారి గురించి చెడ్డ నివేదికను వారి తండ్రి వద్దకు తీసుకువచ్చాడు.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘యాకోబు గురించిన వృత్తాంతం ఇదే.’ హీబ్రూ తోలెదోత్ అనే పదం ఆదికాండంలో తరచుగా కొత్త విభాగాన్ని ప్రారంభిస్తుంది; అది కేవలం సంతాన జాబితానే కాక, ఒక వ్యక్తి నుంచి కొనసాగిన కుటుంబ వృత్తాంతాన్ని కూడా సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ వాక్యనిర్మాణం సంక్షిప్తంగా, కొంత క్లిష్టంగా ఉంది. దీన్ని ‘అతడు యువకుడై బిల్హా కుమారులతోను జిల్పా కుమారులతోను ఉండేవాడు’ అని కూడా అర్థం చేసుకోవచ్చు; ఈ మాటలు ముందున్న ‘తన సహోదరులతో’ అన్నదాన్ని మరింత స్పష్టం చేస్తాయి.
    reason: source_ambiguity
  - marker: c
    text: అక్షరార్థంగా, ‘వారి తండ్రి వద్దకు.’ హీబ్రూలోని బహువచన స్వామ్యరూపం యాకోబు యోసేపుకూ ఆ సహోదరులకూ తండ్రి అని స్పష్టపరుస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: תֹּלְדוֹת
  choice: వంశచరిత్ర
  rationale: ఆదికాండంలో ఈ పదం కొత్త విభాగాన్ని పరిచయం చేసే నిర్మాణాత్మక శీర్షికగా పనిచేస్తుంది; ఒక వ్యక్తి నుంచి కొనసాగిన వంశాన్నీ దాని చరిత్రనూ సూచించగలదు. ‘వంశచరిత్ర’ ఈ రెండు కోణాలను సహజమైన తెలుగులో కలుపుతుంది.
- source_word: הָיָה רֹעֶה
  choice: మేపుతూ ఉండేవాడు
  rationale: హీబ్రూ కృదంత నిర్మాణం కొనసాగుతున్న లేదా అలవాటైన కార్యాన్ని సూచిస్తుంది. ఈ రూపం ఆ నిరంతర భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: אֶת אֶחָיו בַּצֹּאן
  choice: తన సహోదరులతో కలిసి మందను మేపుతూ
  rationale: ఈ క్లిష్ట పదబంధం యోసేపు తన సహోదరులను మేపాడని కాక, వారితో కలిసి మంద పని చేశాడనే భావాన్ని సందర్భంలో ఇస్తుంది.
- source_word: נַעַר
  choice: ఇంకా యువకుడై
  rationale: యోసేపు వయసు పదిహేడేళ్లని స్పష్టంగా చెప్పబడినందున ‘యువకుడు’ సహజం; ‘ఇంకా’ అతని యౌవన స్థితిని తెలుగులో సులభంగా వ్యక్తం చేస్తుంది, అయితే సేవకుడు అనే సాధ్యార్థాన్ని అనవసరంగా చేర్చదు.
- source_word: אֶת בְּנֵי בִלְהָה וְאֶת בְּנֵי זִלְפָּה
  choice: బిల్హా కుమారులతోను జిల్పా కుమారులతోను కలిసి
  rationale: హీబ్రూ వాక్యనిర్మాణం క్లిష్టమైనప్పటికీ, ఇక్కడ వీరు యోసేపుతో ఉన్న సహోదరులని సూచించడం అత్యంత సహజం. ‘కలిసి’ అనేది తక్కువ వ్యాఖ్యానంతో ఆ సంబంధాన్ని తెలుపుతుంది.
- source_word: נְשֵׁי אָבִיו
  choice: తన తండ్రి భార్యలైన
  rationale: బిల్హా, జిల్పా ఎవరో గుర్తించే సరళమైన స్వామ్య పదబంధం; ‘భార్యలు’ సందర్భానుకూలమైన ఆధునిక తెలుగు సమానం.
- source_word: דִּבָּתָם רָעָה
  choice: వారి గురించి చెడ్డ వార్తను
  rationale: ఈ పదబంధం వారి గురించిన ప్రతికూల సమాచారాన్ని సూచిస్తుంది. అది నిజమా కాదా అని మూలపాఠం తేల్చనందున ‘అపవాదు’ వంటి నిర్ణయాత్మక పదాన్ని నివారించాం.
- source_word: אֶל אֲבִיהֶם
  choice: వారి తండ్రి దగ్గరికి
  rationale: హీబ్రూలో బహువచన స్వామ్యప్రత్యయం ఉంది—‘వారి తండ్రి’. యాకోబు యోసేపుకూ అతని సహోదరులకూ తండ్రి అనే భాగస్వామ్య సంబంధాన్ని ఇది నిలుపుతుంది.
theological_decisions:
- issue: యోసేపు తెచ్చిన చెడ్డ వార్త నిజమా లేక అపవాదా?
  choice: నైతిక తీర్పు ఇవ్వకుండా ‘చెడ్డ వార్త’గా అనువదించడం
  alternative: ‘అపవాదు’ లేదా ‘దుష్ప్రచారం’
  rationale: דִּבָּה רָעָה ప్రతికూల నివేదికను సూచిస్తుంది; ఈ వాక్యం దాని నిజానిజాలపై స్పష్టమైన తీర్పు ఇవ్వదు. అందువల్ల యోసేపును ముందుగానే దోషిగా లేదా నిర్దోషిగా చూపలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథనశైలి వాడబడింది. ‘వంశచరిత్ర’ ఆదికాండంలోని నిర్మాణాత్మక శీర్షిక భావాన్ని నిలుపుతుంది; క్లిష్టమైన హీబ్రూ వాక్యనిర్మాణాన్ని ప్రధాన పాఠ్యంలో సహజంగా చేసి, దాని అస్పష్టతను పాదటిప్పణిలో భద్రపరిచాం.
