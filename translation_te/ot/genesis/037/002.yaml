  to: యాకోబు వంశచరిత్ర ఇదే:[a] యోసేపు పదిహేడేళ్ల వయసులో తన సహోదరులతో కలిసి మందను మేపుతూ ఉండేవాడు. అతడు యువకుడై, తన తండ్రి భార్యలైన బిల్హా, జిల్పాల కుమారులతో కలిసి ఉండేవాడు.[b] యోసేపు వారి గురించి చెడ్డ నివేదికను వారి తండ్రి వద్దకు తీసుకువచ్చాడు.[c]
  rationale: 'సవరణలు అర్థాన్ని మార్చకుండా రెండు విషయాలను మెరుగుపరుస్తాయి: బిల్హా, జిల్పాలే యాకోబు భార్యలు అని వ్యాకరణపరంగా స్పష్టం చేయడం, మరియు యోసేపు తీసుకువచ్చిన దిబ్బాను వారి గురించిన ‘చెడ్డ నివేదిక’గా మరింత నిర్దిష్టంగా వ్యక్తీకరించడం. హీబ్రూ వాక్యనిర్మాణంలోని క్లిష్టతను పాదటిప్పణి bలో నిలుపుకున్నాం; బహువచనమైన ‘వారి తండ్రి’ని పాదటిప్పణి cలో వివరించాం.'
