- from: తర్వాత వారు భోజనం చేయడానికి కూర్చున్నారు. వారు తలెత్తి చూసినప్పుడు, గిలాదునుంచి వస్తున్న ఇష్మాయేలీయుల వర్తకబృందం కనిపించింది. వారి ఒంటెలు సుగంధ జిగురు, గుగ్గిలం, బోళం మోసుకుంటూ, వాటిని ఐగుప్తుకు తీసుకువెళ్తున్నాయి.
