  rationale: Commodity terms have been adjusted to reflect the Hebrew more carefully and to retain lexical uncertainty through anchored notes. The clause structure now distinguishes the camels’ carrying from the caravan’s journey to Egypt, while preserving the concise modern Telugu narrative register.
