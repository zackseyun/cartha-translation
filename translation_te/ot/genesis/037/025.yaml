source:
  edition: WLC
  text: וַ/יֵּשְׁבוּ֮ לֶֽ/אֱכָל לֶחֶם֒ וַ/יִּשְׂא֤וּ עֵֽינֵי/הֶם֙ וַ/יִּרְא֔וּ וְ/הִנֵּה֙ אֹרְחַ֣ת יִשְׁמְעֵאלִ֔ים בָּאָ֖ה מִ/גִּלְעָ֑ד וּ/גְמַלֵּי/הֶ֣ם נֹֽשְׂאִ֗ים נְכֹאת֙ וּ/צְרִ֣י וָ/לֹ֔ט הוֹלְכִ֖ים לְ/הוֹרִ֥יד מִצְרָֽיְמָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/025.yaml
  text: Then they sat down to eat bread, and they lifted up their eyes and looked, and behold, a caravan of Ishmaelites was coming from Gilead, with their camels carrying gum, balm, and myrrh, on their way to take it down to Egypt.
translation:
  language: te
  text: తర్వాత వారు భోజనం చేయడానికి కూర్చున్నారు. వారు తలెత్తి చూడగా, ఇదిగో, గిలాదునుంచి ఇష్మాయేలీయుల ఒక వర్తకబృందం వస్తోంది. వారి ఒంటెలు జిగురు, బాల్సము[a], లాదానము[b] మోస్తున్నాయి; ఆ బృందం వాటిని ఐగుప్తుకు తీసుకెళ్లడానికి వెళ్తోంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీయ పదం సుగంధభరితమైన ఔషధ జిగురు లేదా బాల్సమును సూచిస్తుంది; ఖచ్చితమైన వృక్షగుర్తింపు అనిశ్చితం.
    reason: צְרִי యొక్క విస్తృత అర్థాన్ని సూచించి, “బాల్సము”ను నిర్దిష్ట వృక్షజాతిగా చదవకుండా చేస్తుంది.
  - marker: b
    text: హెబ్రీయ పదార్థం యొక్క ఖచ్చిత గుర్తింపు వివాదాస్పదం; దీనిని తరచుగా లాదానముతో అనుసంధానిస్తారు.
    reason: לֹטను మిర్రా లేదా మరొక నిర్దిష్ట సుగంధద్రవ్యమని ఖచ్చితంగా నిర్ణయించకుండా మూలంలోని అనిశ్చితిని కాపాడుతుంది.
lexical_decisions:
- source_word: לֶאֱכָל לֶחֶם
  choice: భోజనం చేయడానికి
  rationale: అక్షరార్థంగా ‘రొట్టె తినడానికి’; ఇక్కడ సాధారణంగా భోజనం చేయడాన్ని సూచించే హెబ్రీయ నుడికారం కాబట్టి సహజమైన ఆధునిక తెలుగులో అనువదించబడింది.
- source_word: אֹרְחַת יִשְׁמְעֵאלִים
  choice: ఇష్మాయేలీయుల వర్తకబృందం
  rationale: אֹרְחָה అనేది ప్రయాణించే బృందాన్ని, ఈ సందర్భంలో సరుకులు మోసే కారవాన్‌ను సూచిస్తుంది; ‘వర్తకబృందం’ సందర్భాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: נְכֹאת
  choice: సుగంధ జిగురు
  rationale: ఖచ్చితమైన వృక్షపదార్థ గుర్తింపు అనిశ్చితం; ఇది సుగంధభరితమైన ఔషధ/రెసిన్ పదార్థమని సందర్భం సూచిస్తుంది. నిర్దిష్ట ఆధునిక వృక్షపేరును బలవంతంగా పెట్టకుండా విస్తృత పదబంధం ఎంచుకున్నాం.
- source_word: צְרִי
  choice: గుగ్గిలం
  rationale: సుగంధ ఔషధ రెసిన్ లేదా బామ్‌ను సూచిస్తుంది; తెలుగులో పరిచితమైన రెసిన్ పదార్థపదంగా ‘గుగ్గిలం’ వాడబడింది, అయితే ఖచ్చిత వృక్ష గుర్తింపు అనిశ్చితం.
- source_word: לֹט
  choice: బోళం
  rationale: సుగంధ రెసిన్ పదార్థానికి సంప్రదాయ తెలుగు బైబిల్ పదం; దీనిని ‘మిర్ర’గా గుర్తించడం సాధారణమైనా, హెబ్రీ పదార్థపు ఖచ్చిత గుర్తింపు చర్చనీయాంశమే.
- source_word: מִצְרָיְמָה
  choice: ఐగుప్తుకు
  rationale: దిశను సూచించే -ָה ప్రత్యయం ‘ఐగుప్తు వైపు/ఐగుప్తుకు’ అనే భావాన్ని ఇస్తుంది.
