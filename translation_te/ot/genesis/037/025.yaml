translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కథన ప్రవాహం సహజంగా ఉండేలా హెబ్రీ సమన్వయ వాక్య నిర్మాణాన్ని స్వల్పంగా విభజించాం. ‘ఇదిగో’ అనే ప్రత్యక్ష ఉద్ఘాటనకు బదులుగా ఆకస్మికంగా కనిపించిన భావాన్ని ‘కనిపించింది’లో సహజంగా వ్యక్తం చేశాం. పదార్థాల గుర్తింపులో ఉన్న భాషాశాస్త్రీయ అనిశ్చితిని అతిగా నిర్దిష్టీకరించలేదు.
