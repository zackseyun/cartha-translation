language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּכִּירָ֤/הּ וַ/יֹּ֨אמֶר֙ כְּתֹ֣נֶת בְּנִ֔/י חַיָּ֥ה רָעָ֖ה אֲכָלָ֑תְ/הוּ טָרֹ֥ף טֹרַ֖ף יוֹסֵֽף׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/033.yaml
  text: He recognized it and said[a], “It is my son’s tunic. A wild animal has devoured him[c][b]. Yosef has surely been torn to pieces.”
translation:
  language: te
  text: అతడు దానిని గుర్తుపట్టి, “ఇది నా కుమారుని అంగీ! ఒక క్రూరమృగం అతణ్ణి మింగివేసింది. యోసేపు తప్పకుండా చీల్చివేయబడ్డాడు” అన్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּכִּירָהּ
  choice: అతడు దానిని గుర్తుపట్టి
  rationale: హిఫిల్ రూపంలోని נכר అంటే గుర్తుపట్టడం లేదా గుర్తించడం. స్త్రీలింగ ప్రత్యయం అంగీని సూచిస్తుంది; తెలుగులో సహజంగా ‘దానిని’ అని అనువదించబడింది.
- source_word: כְּתֹנֶת בְּנִי
  choice: ఇది నా కుమారుని అంగీ
  rationale: כְּתֹנֶת పొడవైన దుస్తును సూచిస్తుంది. ‘అంగీ’ మూలార్థానికి దగ్గరగా ఉండి ఆధునిక తెలుగులో సులభంగా అర్థమవుతుంది.
- source_word: חַיָּה רָעָה
  choice: ఒక క్రూరమృగం
  rationale: ఈ సందర్భంలో חַיָּה అడవి మృగాన్ని, רָעָה హానికరమైన లేదా క్రూరమైన స్వభావాన్ని సూచిస్తాయి. ‘క్రూరమృగం’ ఈ భావాన్ని సంక్షిప్తంగా, సహజంగా అందిస్తుంది.
- source_word: אֲכָלָתְהוּ
  choice: అతణ్ణి మింగివేసింది
  rationale: జంతువు దాడి చేసిన సందర్భంలో ‘మింగివేసింది’ అనేది కేవలం ‘తిన్నది’ కంటే אכל యొక్క విధ్వంసక భావాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: טָרֹף טֹרַף
  choice: తప్పకుండా చీల్చివేయబడ్డాడు
  rationale: క్రియావిశేషక ధాతురూపం తరువాత వచ్చిన నిష్క్రియ క్రియను బలపరుస్తుంది. ‘తప్పకుండా’ ఆ నిశ్చయాత్మక ఉద్ఘాటనను, ‘చీల్చివేయబడ్డాడు’ నిష్క్రియ రూపాన్ని కాపాడుతాయి.
- source_word: יוֹסֵף
  choice: యోసేపు
  rationale: హీబ్రూ పేరుకు తెలుగు బైబిలు వాడుకలో స్థిరపడిన, సహజమైన లిప్యంతరీకరణ.
