id: GEN.37.10
reference: Genesis 37:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְסַפֵּ֣ר אֶל אָבִי/ו֮ וְ/אֶל אֶחָי/ו֒ וַ/יִּגְעַר בּ֣/וֹ אָבִ֔י/ו וַ/יֹּ֣אמֶר ל֔/וֹ מָ֛ה הַ/חֲל֥וֹם הַ/זֶּ֖ה אֲשֶׁ֣ר חָלָ֑מְתָּ הֲ/ב֣וֹא נָב֗וֹא אֲנִי֙ וְ/אִמְּ/ךָ֣ וְ/אַחֶ֔י/ךָ לְ/הִשְׁתַּחֲוֺ֥ת לְ/ךָ֖ אָֽרְצָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/010.yaml
  text: And he told it to his father and to his brothers[a], and his father rebuked him and said to him, “What is this dream that you have dreamed? Shall I and your mother and your brothers indeed come to bow down to the ground before you?”
translation:
  language: te
  text: అతడు ఆ కలను తన తండ్రికి, తన అన్నదమ్ములకు చెప్పాడు. అప్పుడు అతని తండ్రి అతణ్ణి గద్దించి, “నువ్వు కన్న ఈ కల ఏమిటి? నేనూ, నీ తల్లీ, నీ అన్నదమ్ములూ నిజంగా వచ్చి నీ ఎదుట నేలమీద సాష్టాంగపడాలా[a]?” అని అడిగాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీ ఎదుట నేలవరకు వంగాలా?” హీబ్రూ క్రియ గాఢమైన విధేయతను చూపేలా వంగడాన్ని లేదా సాష్టాంగపడడాన్ని సూచించగలదు; ఇక్కడ అది తప్పనిసరిగా ఆరాధనను సూచించదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְסַפֵּר
  choice: చెప్పాడు
  rationale: పియేల్ రూపంలోని ספר ఇక్కడ కలను వివరించి చెప్పడాన్ని సూచిస్తుంది. సందర్భం స్పష్టంగా ఉండేందుకు తెలుగులో ‘ఆ కలను ... చెప్పాడు’ అని వ్యక్తపరచడం సహజం.
- source_word: אָבִיו ... אֶחָיו
  choice: తన తండ్రికి, తన సహోదరులకు
  rationale: మూలంలోని బంధుత్వ పదాలను నేరుగా నిలుపుతూ, ఆధునిక గౌరవప్రద తెలుగు కోసం ‘సహోదరులు’ ఎంచుకున్నాం.
- source_word: וַיִּגְעַר בּוֹ
  choice: అతణ్ణి గద్దించి
  rationale: גער బలమైన మాటల మందలింపును సూచిస్తుంది. ‘గద్దించాడు’ దాని తీవ్రతను సహజ తెలుగులో నిలుపుతుంది.
- source_word: מָה הַחֲלוֹם הַזֶּה אֲשֶׁר חָלָמְתָּ
  choice: నువ్వు కన్న ఈ కల ఏమిటి?
  rationale: ‘కల’–‘కన్న’ అనే మూలంలోని పదపునరుక్తికి సమీపమైన తెలుగు నిర్మాణాన్ని ఉంచి, ప్రశ్న యొక్క మందలింపు ధోరణిని కాపాడుతుంది.
- source_word: הֲבוֹא נָבוֹא
  choice: నిజంగా వచ్చి ... వంగాలా?
  rationale: అనంతరూపం మరియు సమాపక క్రియ కలయికలోని ఉద్ఘాటనను ‘నిజంగా’ తెలియజేస్తుంది; ప్రశ్నార్థక భావాన్ని ‘వంగాలా?’ సహజంగా వ్యక్తపరుస్తుంది.
- source_word: אֲנִי וְאִמְּךָ וְאַחֶיךָ
  choice: నేనూ, నీ తల్లీ, నీ సహోదరులూ
  rationale: మూలంలోని కర్తల వరుసను నిలుపుతూ తెలుగు సముచ్చయ ప్రత్యయాలతో సహజంగా అందించబడింది.
- source_word: לְהִשְׁתַּחֲוֺת לְךָ
  choice: నీ ఎదుట ... వంగాలా
  rationale: ఈ కుటుంబ సంబంధ సందర్భంలో השתחוה ఆరాధనకన్నా లోబడిన గౌరవభంగిమను సూచిస్తుంది; ‘నీ ఎదుట వంగడం’ ఆ భావాన్ని అతిశయింపకుండా ఇస్తుంది.
- source_word: אָרְצָה
  choice: నేలవరకు
  rationale: దిశను తెలిపే రూపం భూమివైపు పూర్తిగా వంగడాన్ని సూచిస్తుంది. ‘నేలవరకు’ తెలుగులో ఆ శారీరక భంగిమను స్పష్టంగా తెలుపుతుంది.
theological_decisions:
- issue: కుల్ట్‌కు సంబంధించని సందర్భంలో השתחוה అర్థం
  choice: నీ ఎదుట నేలవరకు వంగడం
  alternative: నీకు సాష్టాంగపడడం; నిన్ను ఆరాధించడం
  rationale: ఈ సందర్భం యోసేపుకు కుటుంబ సభ్యులు లోబడడాన్ని చిత్రిస్తుంది. ‘ఆరాధించడం’ మూలం తప్పనిసరిగా చెప్పని మతపరమైన భావాన్ని చేర్చుతుంది; ‘వంగడం’ సామాజిక విధేయతను, భంగిమ తీవ్రతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. సంభాషణలో ‘నువ్వు’ కుటుంబ సందర్భానికి తగిన సహజ ఏకవచనం. మూలంలోని తీవ్ర ప్రశ్నను, ఉద్ఘాటనను నిలిపి, ఆరాధన అనే మతపరమైన భావాన్ని అనవసరంగా దిగుమతి చేయలేదు.
