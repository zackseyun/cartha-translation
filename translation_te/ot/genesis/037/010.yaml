review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the telling of the dream, the father's rebuke, the rhetorical question, the emphatic 'indeed come,' and the non-cultic obeisance. However, 'నేలవరకు వంగాలా' can mean only bending as far as the ground, rather than the Hebrew's bowing/prostrating earthward.
  naturalness: The narrative is natural modern Telugu. 'సహోదరులు' is intelligible but more formal/Sanskritic than needed in this family narrative; 'అన్నదమ్ములు' is more natural. 'నేలమీద సాష్టాంగపడాలా' directly and naturally expresses the complete groundward obeisance.
  terminology: '''గద్దించి'' appropriately renders the rebuke. ''కల'' / ''కన్న'' preserves the Hebrew cognate expression. ''సాష్టాంగపడడం'' is a lexical rendering of deep prostration here and, with the note, does not imply worship.'
  issues:
  - severity: low
    issue: '''నేలవరకు వంగాలా'' is less precise for אָרְצָה with השתחוה.'
    rationale: The source refers to bowing down/prostrating to the ground before Joseph; 'నేలమీద సాష్టాంగపడాలా' better preserves the bodily action without adding worship.
  - severity: low
    issue: '''సహోదరులు'' is overly formal in direct family narration.'
    rationale: '''అన్నదమ్ములు'' is idiomatic modern Telugu and retains the masculine plural sense of the Hebrew.'
