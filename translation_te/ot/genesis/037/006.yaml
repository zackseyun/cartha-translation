translation:
  language: te
  text: 'అప్పుడు అతడు వారితో ఇలా అన్నాడు: “దయచేసి, నేను కన్న ఈ కలను[a] వినండి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూలో ఒకే మూలానికి చెందిన నామవాచకం, క్రియ కలిసి ఉన్నాయి: “నేను కన్న ఈ కలను.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు … అన్నాడు
  rationale: వావ్-క్రమకథన రూపం కథను ముందుకు నడిపిస్తుంది; ఆధునిక తెలుగులో ‘అప్పుడు’ సహజమైన కథన అనుసంధానాన్ని ఇస్తుంది.
- source_word: אֲלֵיהֶם
  choice: వారితో
  rationale: యోసేపు తన సహోదరులను ఉద్దేశించి మాట్లాడుతున్నాడని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: שִׁמְעוּ נָא
  choice: దయచేసి వినండి
  rationale: బహువచన ఆజ్ఞారూపమైన ‘వినండి’తో పాటు נָא తెలిపే మర్యాదపూర్వక విజ్ఞప్తిని ‘దయచేసి’ వ్యక్తపరుస్తుంది.
- source_word: הַחֲלוֹם הַזֶּה
  choice: ఈ కలను
  rationale: నిర్దిష్ట నామవాచకం, సూచనార్థక పదం కలిసిన హీబ్రూ నిర్మాణానికి సహజమైన తెలుగు రూపం.
- source_word: אֲשֶׁר חָלָמְתִּי
  choice: నేను కన్న
  rationale: కల గురించి తెలుగులో ‘కల కను’ సహజమైన సమానమూల నిర్మాణం; సంబంధ వాక్యాన్ని సంక్షిప్తంగా, స్పష్టంగా వ్యక్తపరుస్తుంది.
