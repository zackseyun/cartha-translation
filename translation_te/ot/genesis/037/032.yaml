translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథన శైలి వాడబడింది. సోదరుల మాటల్లోని సంక్షిప్తత, దూరీకరణ, మోసపూరిత సూచన నిలుపబడ్డాయి. మూలంలోని అరుదైన వస్త్రపదం అనిశ్చితిని ప్రధాన పాఠ్యం మరియు పాదసూచిక కలిసి తెలియజేస్తాయి.
