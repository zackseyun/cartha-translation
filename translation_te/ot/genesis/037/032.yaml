id: GEN.37.32
reference: Genesis 37:32
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַֽ/יְשַׁלְּח֞וּ אֶת כְּתֹ֣נֶת הַ/פַּסִּ֗ים וַ/יָּבִ֨יאוּ֙ אֶל אֲבִי/הֶ֔ם וַ/יֹּאמְר֖וּ זֹ֣את מָצָ֑אנוּ הַכֶּר נָ֗א הַ/כְּתֹ֧נֶת בִּנְ/ךָ֛ הִ֖וא אִם לֹֽא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/032.yaml
  text: Then they sent the robe with long sleeves and brought it to their father[a], and said, “We found this[b]. Please identify whether it is your son's robe or not.”
translation:
  language: te
  text: అప్పుడు వారు పొడవాటి చేతులుగల ఆ అంగీని[a] పంపి, దాన్ని తమ తండ్రి వద్దకు తీసుకొచ్చారు. వారు, “ఇది మేము కనుగొన్నాం. ఇది నీ కుమారుడి అంగీయో కాదో దయచేసి గుర్తించు[b]” అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “అలంకరించిన అంగీ,” “విశేషంగా అలంకరించిన పైవస్త్రం”; సంప్రదాయంగా “అనేక రంగుల అంగీ.” ఈ హీబ్రూ పదబంధం అర్థం అనిశ్చితం.
    reason: lexical_alternative
  - marker: b
    text: లేదా “దయచేసి నిర్ధారించు.” ఈ కథనం అంతటా గుర్తుపట్టడం, తప్పుగా గుర్తుపట్టడం మళ్లీ మళ్లీ కనిపిస్తాయి కాబట్టి ఈ పదప్రయోగం ప్రాముఖ్యమైనది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְשַׁלְּחוּ
  choice: పంపించి
  rationale: పీయేల్ రూపంలోని שׁלח ఇక్కడ ‘పంపు’ అనే సహజ అర్థాన్నిస్తుంది; తరువాతి క్రియతో కథన క్రమాన్ని తెలుగులో సంయుక్త క్రియగా చూపిస్తుంది.
- source_word: כְּתֹנֶת הַפַּסִּים
  choice: పొడవాటి చేతులున్న ఆ అంగీ
  rationale: כְּתֹנֶת అనేది అంగీ లేదా పొడవైన పైవస్త్రం. פַּסִּים అర్థం అనిశ్చితం; అరచేతులు లేదా పాదాల వరకు చేరే వస్త్రాన్ని సూచించే అవకాశం ఉంది. సంప్రదాయ ‘అనేక రంగుల అంగీ’ అనే నిర్ధారణను ప్రధాన పాఠ్యంలో చేర్చకుండా, సాధ్యమైన అర్థాన్ని సహజ తెలుగులో ఇస్తుంది.
- source_word: וַיָּבִיאוּ אֶל אֲבִיהֶם
  choice: దాన్ని తమ తండ్రి దగ్గరికి తీసుకొచ్చారు
  rationale: హీబ్రూలో కర్మ ముందే చెప్పిన అంగీ; తెలుగులో స్పష్టత కోసం ‘దాన్ని’ చేర్చబడింది. ‘తమ తండ్రి’ అనే మూలపాఠ్యపు సంబంధపదం అలాగే నిలుపబడింది.
- source_word: זֹאת מָצָאנוּ
  choice: ఇది మాకు దొరికింది
  rationale: సోదరుల మోసపూరితమైనా పైకి సరళంగా వినిపించే మాటను సహజ తెలుగులో నిలుపుతుంది. מצאנוּ సందర్భానుసారం ‘మేము దీన్ని కనుగొన్నాం’ అని కూడా అనవచ్చు; ‘మాకు దొరికింది’ సాధారణ సంభాషణలో సహజం.
- source_word: הַכֶּר נָא
  choice: దయచేసి నిర్ధారించు
  rationale: నכר హిఫీల్ రూపం ‘గుర్తించు/గుర్తుపట్టు/నిర్ధారించు’ అనే భావాన్ని ఇస్తుంది. ఇక్కడ వస్త్రం ఎవరిదో తేల్చమనే అభ్యర్థనకు ‘నిర్ధారించు’ సహజంగా సరిపోతుంది; కథనంలోని ‘గుర్తుపట్టడం’ ప్రతిధ్వనిని పాదసూచికలో నిలుపుతుంది.
- source_word: הַכְּתֹנֶת בִּנְךָ הִוא אִם לֹא
  choice: ఇది నీ కుమారుడి అంగీయో కాదో
  rationale: אִם לֹא లోని ‘అవునో కాదో’ అనే పరోక్ష ప్రశ్నను సహజ తెలుగు నిర్మాణంలో ఇస్తుంది. ‘నీ కుమారుడు’ అని చెప్పడం ద్వారా యోసేపు పట్ల సోదరుల దూరీకరణ భాషను నిలుపుతుంది.
