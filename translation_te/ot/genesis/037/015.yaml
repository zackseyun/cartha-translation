  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּמְצָאֵ֣/הוּ אִ֔ישׁ וְ/הִנֵּ֥ה תֹעֶ֖ה בַּ/שָּׂדֶ֑ה וַ/יִּשְׁאָלֵ֧/הוּ הָ/אִ֛ישׁ לֵ/אמֹ֖ר מַה תְּבַקֵּֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/015.yaml
  text: A man found him[a], and behold, he was wandering in the field. The man asked him, saying, “What are you seeking?”
translation:
  language: te
  text: 'ఒక మనిషి అతనిని కనుగొన్నాడు. ఇదిగో, అతను పొలంలో అటూ ఇటూ తిరుగుతున్నాడు. ఆ మనిషి అతనిని అడిగాడు: “నువ్వు ఏమి వెదుకుతున్నావు?[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నువ్వు దేని కోసం వెతుకుతున్నావు?”
    reason: బקש అనే క్రియకు సందర్భానుసారంగా ‘వెదుకు’ లేదా ‘దేని కోసం వెతుకు’ అనే అర్థం ఉండవచ్చు.
lexical_decisions:
- source_word: וַיִּמְצָאֵהוּ
  choice: ఒక మనిషి అతన్ని కనుగొన్నాడు
  rationale: מצא అనే క్రియకు ఇక్కడ ‘కనుగొను’ అనే సాధారణ అర్థమే సరిపోతుంది; కథనంలోని పురుష ఏకవచన వ్యక్తిని ‘ఒక మనిషి’ అని స్పష్టంగా ఉంచాం.
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: הנה కథనంలో దృష్టిని ఆకర్షించి దృశ్యాన్ని సజీవంగా చూపుతుంది; ‘ఇదిగో’ ఆ ప్రయోజనాన్ని నిలుపుతుంది.
- source_word: תֹעֶה
  choice: దారి తప్పి తిరుగుతున్నాడు
  rationale: תעה లక్ష్యం తెలియక లేదా దారి తప్పి తిరగడాన్ని సూచిస్తుంది. కేవలం ‘తప్పిపోయాడు’ అని స్థితిని అతిగా నిర్ధారించకుండా, కొనసాగుతున్న చర్యను ఈ పదబంధం తెలియజేస్తుంది.
- source_word: בַּשָּׂדֶה
  choice: పొలంలో
  rationale: שדה కు సందర్భానుగుణమైన నేరుగా అర్థం ‘పొలం’; తెలుగు కథనంలో ఇది సహజంగా ఉంది.
- source_word: וַיִּשְׁאָלֵהוּ ... לֵאמֹר
  choice: ఆ మనిషి అతన్ని ... అని అడిగాడు
  rationale: హీబ్రూ ప్రత్యక్ష సంభాషణ సూత్రాన్ని తెలుగులో సహజమైన ‘అని అడిగాడు’ నిర్మాణంతో వ్యక్తం చేశాం.
- source_word: מַה תְּבַקֵּשׁ
  choice: నువ్వు ఏమి వెదుకుతున్నావు?
  rationale: בקש యొక్క ‘వెదుకు/కోరు’ భావాన్ని, సందర్భంలోని కొనసాగుతున్న అన్వేషణను సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. ‘ఇదిగో’ ద్వారా మూలంలోని దృష్టి-ఆకర్షణ భావాన్ని నిలిపి, మిగతా వాక్య నిర్మాణాన్ని సాధారణ పాఠకులకు సహజంగా ఉంచాం.
