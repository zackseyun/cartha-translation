    text: లేదా, “నువ్వు దేని కోసం వెతుకుతున్నావు?”
    reason: బקש అనే క్రియకు సందర్భానుసారంగా ‘వెదుకు’ లేదా ‘దేని కోసం వెతుకు’ అనే అర్థం ఉండవచ్చు.
  revision_rationale: The revision preserves the Hebrew narrative sequence and the attention-directing force of וְהִנֵּה (“ఇదిగో”), while replacing an unnecessarily specific statement about being lost with a neutral expression for wandering. The footnote remains properly anchored and gives a natural lexical alternative.
