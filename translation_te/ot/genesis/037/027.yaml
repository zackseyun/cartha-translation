translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కుటుంబ సంభాషణకు సహజమైనప్పటికీ గౌరవప్రదమైన శైలి. హీబ్రూ చేతి-రూపకాన్ని ప్రధాన పాఠ్యంలో నిలిపి, దాని హింసాసంబంధ సందర్భార్థాన్ని పాదటిప్పణిలో వివరించాం. שמע లోని ‘విన్నారు/మన్నించారు’ అనే నిజమైన అర్థవిస్తృతిని పరిష్కరించకుండా ఉంచాం.
