base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/027.yaml
  text: Come[a], let us sell him to the Ishmaelites, and let not our hand be upon him, for he is our brother[c][b], our own flesh.” And his brothers listened.
translation:
  language: te
  text: రండి, అతణ్ణి ఇష్మాయేలీయులకు అమ్మేద్దాం; మన చేయి అతనిమీద పడకూడదు[a]. ఎందుకంటే అతడు మన సోదరుడు, మన సొంత రక్తమాంసాలవాడు[b].” అతని సోదరులు అతని మాట విన్నారు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “మన చేయి అతనిమీద ఉండకూడదు”; అంటే మనమే అతనికి ప్రత్యక్షంగా హాని చేయకూడదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా “మన సొంత బంధువు.” హీబ్రూలో అక్షరార్థంగా “మన మాంసం.”
    reason: lexical_alternative
  - marker: c
    text: “విన్నారు” అనే మాటను ఈ సందర్భంలో “అతని మాటను మన్నించారు” లేదా “అంగీకరించారు” అని కూడా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכוּ
  choice: రండి
  rationale: הלך యొక్క బహువచన ఆజ్ఞారూపం ఇక్కడ కార్యానికి ప్రేరేపించే సంభాషణాత్మక ప్రయోగం; ‘రండి’ సహజంగా ఆ బలాన్ని అందిస్తుంది.
- source_word: וְנִמְכְּרֶנּוּ
  choice: అతణ్ణి ... అమ్మేద్దాం
  rationale: మొదటి పురుష బహువచన సంకల్పార్థక రూపం ప్రతిపాదనను వ్యక్తం చేస్తుంది; ‘అమ్మేద్దాం’ దాని ప్రేరణాత్మక భావాన్ని స్పష్టంగా చూపుతుంది.
- source_word: לַיִּשְׁמְעֵאלִים
  choice: ఇష్మాయేలీయులకు
  rationale: ప్రజావర్గాన్ని సూచించే నామానికి తెలుగు ప్రామాణిక బహువచన రూపం.
- source_word: וְיָדֵנוּ אַל תְּהִי בוֹ
  choice: మన చెయ్యి అతని మీద పడనివ్వకండి
  rationale: ‘మన చెయ్యి అతని మీద ఉండకూడదు’ అనే హీబ్రూ చిత్రాన్ని నిలుపుతూ, ప్రత్యక్షంగా హాని చేయవద్దనే సందర్భార్థాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: యూదా ప్రతిపాదనకు కారణాన్ని పరిచయం చేస్తుంది.
- source_word: אָחִינוּ
  choice: మన సహోదరుడు
  rationale: మూలంలోని సూటి బంధుత్వ పదాన్ని గౌరవప్రదమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: בְשָׂרֵנוּ
  choice: మన సొంత రక్తమాంసం
  rationale: మూలంలోని ‘మన మాంసం’ అనే సన్నిహిత రక్తబంధ చిత్రాన్ని తెలుగులో సహజంగా, స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: וַיִּשְׁמְעוּ אֶחָיו
  choice: అతని సహోదరులు అతని మాట విన్నారు
  rationale: שמע పదంలోని ‘వినడం’ అనే ప్రాథమిక భావాన్ని నిలుపుతూ, సందర్భంలో అతని ప్రతిపాదనను ఆలకించారనే అర్థాన్ని తెలియజేస్తుంది; ‘అంగీకరించారు’ అని పూర్తిగా నిర్ధారించదు.
