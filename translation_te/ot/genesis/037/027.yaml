  to: రండి, అతణ్ణి ఇష్మాయేలీయులకు అమ్మేద్దాం; మన చేయి అతనిమీద పడకూడదు[a]. ఎందుకంటే అతడు మన సోదరుడు, మన సొంత రక్తమాంసాలవాడు[b].” అతని సోదరులు అతని మాట విన్నారు[c].
