  text: וַ/יֹּ֨אמֶר יִשְׂרָאֵ֜ל אֶל יוֹסֵ֗ף הֲ/ל֤וֹא אַחֶ֨י/ךָ֙ רֹעִ֣ים בִּ/שְׁכֶ֔ם לְכָ֖/ה וְ/אֶשְׁלָחֲ/ךָ֣ אֲלֵי/הֶ֑ם וַ/יֹּ֥אמֶר ל֖/וֹ הִנֵּֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/013.yaml
  text: Then Israel said to Joseph[a], “Are not your brothers shepherding at Shechem? Come, and I will send you to them.” And he said to him, “Here I am.”
translation:
  language: te
  text: అప్పుడు ఇశ్రాయేలు యోసేపుతో, “నీ సోదరులు షెకెములో మందలను మేపుతున్నారు[a] కదా? రా, నేను నిన్ను వారి దగ్గరికి పంపుతాను” అన్నాడు. యోసేపు అతనితో, “ఇదిగో, నేనున్నాను” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “మందలను కాస్తున్నారు” లేదా “మందలను చూసుకుంటున్నారు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׂרָאֵל
  choice: ఇశ్రాయేలు
  rationale: మూల హీబ్రూ పాఠంలో ‘యాకోబు’ కాకుండా ‘ఇశ్రాయేలు’ అనే పేరే ఉంది; అందువల్ల అదే పేరును లిప్యంతరీకరించాం.
- source_word: הֲלוֹא
  choice: కదా?
  rationale: సమ్మతిని ఆశించే హీబ్రూ అలంకారప్రశ్నను ఆధునిక సహజ తెలుగులో ప్రశ్నగానే నిలుపుతుంది.
- source_word: אַחֶיךָ
  choice: నీ సోదరులు
  rationale: రెండవ పురుష ఏకవచన స్వామ్యప్రత్యయంతో ఉన్న పురుష బహువచన నామవాచకానికి నేరమైన, వయస్సును అనవసరంగా నిర్దేశించని అనువాదం.
- source_word: רֹעִים
  choice: మందలను మేపుతున్నారు
  rationale: רעה క్రియారూపం మందల సంరక్షణ/మేపే పనిని సూచిస్తుంది. తెలుగులో క్రియకు అవసరమైన సహజ కర్మను సందర్భం నుంచి స్పష్టంగా వ్యక్తం చేశాం; ప్రత్యామ్నాయాలను పాదసూచికలో ఇచ్చాం.
- source_word: בִּשְׁכֶם
  choice: షెకెములో
  rationale: בְּ స్థానార్థాన్ని ‘లో’తో వ్యక్తం చేసి, స్థలనామాన్ని లిప్యంతరీకరించాం.
- source_word: לְכָה
  choice: రా
  rationale: ఇది ఆహ్వానం లేదా పిలుపుగా పనిచేసే ఆజ్ఞారూపం; ‘రా’ దాని ప్రత్యక్షతను సహజంగా నిలుపుతుంది.
- source_word: וְאֶשְׁלָחֲךָ
  choice: నేను నిన్ను … పంపుతాను
  rationale: ఆహ్వానం తరువాత వచ్చే పంపే కార్యాన్ని తెలుగులో సహజమైన భవిష్యత్ క్రియతో వ్యక్తం చేశాం.
- source_word: אֲלֵיהֶם
  choice: వారి దగ్గరికి
  rationale: ముందు ప్రస్తావించిన సోదరులవైపు పంపడాన్ని సహజ తెలుగులో సూచిస్తుంది.
- source_word: הִנֵּנִי
  choice: ఇదిగో, నేనున్నాను
  rationale: తనను తాను సమర్పించుకుంటూ సిద్ధతను తెలిపే హీబ్రూ సూత్రప్రాయ స్పందనను దాని సాహిత్య ప్రతిధ్వనితో సహా నిలుపుతుంది.
