source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר ל֗/וֹ לֶךְ נָ֨א רְאֵ֜ה אֶת שְׁל֤וֹם אַחֶ֨י/ךָ֙ וְ/אֶת שְׁל֣וֹם הַ/צֹּ֔אן וַ/הֲשִׁבֵ֖/נִי דָּבָ֑ר וַ/יִּשְׁלָחֵ֨/הוּ֙ מֵ/עֵ֣מֶק חֶבְר֔וֹן וַ/יָּבֹ֖א שְׁכֶֽמָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/014.yaml
  text: He said to him[a], “Go now, see about the well-being of your brothers and the well-being of the flock, and bring me word.” So he sent him from the Valley of Hebron, and he came to Shechem.
translation:
  language: te
  text: అతడు అతనితో, “ఇప్పుడు వెళ్లి, నీ అన్నలు క్షేమంగా ఉన్నారో, మంద క్షేమంగా ఉందో చూసి, నాకు సమాచారం తీసుకురా” అన్నాడు. అప్పుడు అతడు హెబ్రోను లోయ నుండి అతన్ని పంపాడు; అతడు షెకెముకు వచ్చాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֶךְ נָא
  choice: ఇప్పుడు వెళ్లి
  rationale: לֶךְ ఆజ్ఞారూపమైన ‘వెళ్లు’; נָא ఆజ్ఞను మృదువుగా చేసే లేదా అభ్యర్థన భావాన్ని చేర్చే అవ్యయం. కథన సందర్భంలో ‘ఇప్పుడు వెళ్లి’ సహజంగా ఉండి ఆ భావాన్ని కొంత ప్రతిబింబిస్తుంది.
- source_word: רְאֵה אֶת שְׁלוֹם
  choice: క్షేమాన్ని చూసి
  rationale: ראה ప్రాథమికంగా ‘చూడు’; שׁלום ఇక్కడ శాంతి మాత్రమే కాక పరిస్థితి, క్షేమం అనే భావం కలిగిస్తుంది. ‘క్షేమాన్ని చూసి’ విచారించి తెలుసుకోవడం అనే సందర్భార్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: אַחֶיךָ
  choice: నీ అన్నలు
  rationale: ఈ సందర్భంలో యోసేపు కన్నా పెద్దవారైన అతని పురుష సహోదరులనే సూచిస్తుంది; అందువల్ల సాధారణ తెలుగు బంధుత్వ పదమైన ‘అన్నలు’ స్పష్టంగా సరిపోతుంది.
- source_word: הַצֹּאן
  choice: మంద
  rationale: צאן గొర్రెలు, మేకలు వంటి చిన్న పశువుల సమూహాన్ని సూచించగలదు. జాతిని అనవసరంగా నిర్దిష్టం చేయకుండా ‘మంద’ సమూహార్థాన్ని నిలుపుతుంది.
- source_word: וַהֲשִׁבֵנִי דָּבָר
  choice: నాకు సమాచారం తీసుకురా
  rationale: ఈ హిఫీల్ రూపం మరియు דָּבָר కలిసిన ప్రయోగం తిరిగి వచ్చి విషయం తెలియజేయడాన్ని సూచిస్తుంది. ‘సమాచారం తీసుకురా’ ఆధునిక తెలుగులో సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: מֵעֵמֶק חֶבְרוֹן
  choice: హెబ్రోను లోయ నుండి
  rationale: עֵמֶק అంటే ‘లోయ’; నిర్మాణ సంబంధాన్ని తెలుగులో సహజమైన ‘హెబ్రోను లోయ’గా వ్యక్తం చేసింది.
- source_word: שְׁכֶמָה
  choice: షెకెముకు
  rationale: స్థలనామానికి చేరిన దిశాసూచక ה షెకెము వైపు గమనాన్ని సూచిస్తుంది; తెలుగు విభక్తి ‘-కు’ దీనిని సహజంగా తెలియజేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. మూలంలోని సర్వనామ నిర్మాణాన్ని నిలుపుతూ ‘అతడు అతనితో’ అని అనువదించబడింది; సందర్భం వల్ల వ్యక్తులు స్పష్టమవుతారు. שְׁלוֹם పదం రెండుసార్లు రావడాన్ని ‘క్షేమం’ పునరావృతితో కాపాడింది.
