  source_fidelity: 'మూల హీబ్రూ భావం మొత్తంగా సరిగానే ప్రతిఫలించింది: నָא యొక్క మృదుత్వం, అన్నలూ మందా క్షేమంగా ఉన్నారో పరిశీలించడం, తిరిగి సమాచారం అందించడం, హెబ్రోను లోయ నుంచి పంపడం, షెకెముకు చేరడం అన్నీ నిలిచాయి. అయితే ‘క్షేమాన్ని చూసి’ కంటే స్థితిని విచారించే రְאֵה אֶת־שְׁלוֹם కు ‘క్షేమంగా ఉన్నారో/ఉందో చూసి’ మరింత సహజమైన, నిర్దిష్టమైన తెలుగు ప్రయోగం.'
