  terminology: ‘క్షేమం’ శָׁלוֹם కు సందర్భోచితమైన అనువాదం; అదే పదాన్ని రెండు చోట్ల నిలపడం సరైనది. ‘మంద,’ ‘హెబ్రోను,’ ‘షెకెము’ కూడా అనుకూలమైనవే. గమనిక శָׁלוֹם యొక్క విస్తృత అర్థపరిధిని, ఈ వచనంలోని పునరుక్తిని సరిగ్గా వివరిస్తుంది.
