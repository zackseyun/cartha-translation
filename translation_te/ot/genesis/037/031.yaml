  text: וַ/יִּקְח֖וּ אֶת כְּתֹ֣נֶת יוֹסֵ֑ף וַֽ/יִּשְׁחֲטוּ֙ שְׂעִ֣יר עִזִּ֔ים וַ/יִּטְבְּל֥וּ אֶת הַ/כֻּתֹּ֖נֶת בַּ/דָּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/031.yaml
  text: Then they took Joseph’s tunic[a], slaughtered a male goat, and dipped the tunic in the blood.
translation:
  language: te
  text: అప్పుడు వారు యోసేపు అంగీని[a] తీసుకొని, ఒక మగ మేకను వధించి, ఆ అంగీని రక్తంలో ముంచారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘వస్త్రం’; హీబ్రూ పదం అంగీ వంటి దుస్తును సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: అప్పుడు వారు తీసుకొని
  rationale: వయ్యిక్టోల్ రూపం కథన క్రమాన్ని ముందుకు నడిపిస్తుంది; ఆధునిక తెలుగు కథన ప్రవాహంలో ‘అప్పుడు’ ఆ వరుస భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: כְּתֹנֶת יוֹסֵף
  choice: యోసేపు అంగీని
  rationale: כְּתֹנֶת శరీరంపై ధరించే పొడవైన అంగీ వంటి వస్త్రాన్ని సూచిస్తుంది. ‘అంగీ’ ఆధునిక తెలుగులో సహజంగా ఉండి, ఆధునిక కోటు అనే తప్పు భావాన్ని నివారిస్తుంది.
- source_word: וַיִּשְׁחֲטוּ
  choice: వధించి
  rationale: ఈ క్రియ జంతువును గొంతు కోసి చంపడాన్ని, సాధారణంగా బలి లేదా ఆహార సందర్భాల్లో, సూచిస్తుంది; ‘వధించి’ దాని నిర్దిష్ట భావాన్ని గౌరవప్రదంగా అందిస్తుంది.
- source_word: שְׂעִיר עִזִּים
  choice: ఒక మగ మేకను
  rationale: ఈ పదబంధం మగ మేకను స్పష్టంగా సూచిస్తుంది; కేవలం ‘మేక’ అనడం కంటే లింగ భేదాన్ని నిలుపుతుంది.
- source_word: וַיִּטְבְּלוּ
  choice: ముంచారు
  rationale: ఈ క్రియకు ముంచడం లేదా ద్రవంలో అదమడం అనే భావం ఉంది; వస్త్రాన్ని రక్తంలో పెట్టిన చర్యకు ‘ముంచారు’ సహజమైన తెలుగు.
- source_word: הַכֻּתֹּנֶת
  choice: ఆ అంగీని
  rationale: ముందు ప్రస్తావించిన నిర్దిష్ట వస్త్రాన్నే తిరిగి సూచిస్తున్నందున ‘ఆ’ సహజ తెలుగు నిర్దేశకంగా పనిచేస్తుంది; ‘అంగీ’ని స్థిరంగా కొనసాగించాం.
- source_word: בַּדָּם
  choice: దాని రక్తంలో
  rationale: నిర్దిష్ట ఉపపదం ఇప్పుడే వధించిన మేక రక్తాన్ని సూచిస్తుంది. తెలుగులో ‘దాని రక్తంలో’ ఆ సూచనను స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
