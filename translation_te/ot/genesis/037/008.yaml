source:
  edition: WLC
  text: וַ/יֹּ֤אמְרוּ ל/וֹ֙ אֶחָ֔י/ו הֲ/מָלֹ֤ךְ תִּמְלֹךְ֙ עָלֵ֔י/נוּ אִם מָשׁ֥וֹל תִּמְשֹׁ֖ל בָּ֑/נוּ וַ/יּוֹסִ֤פוּ עוֹד֙ שְׂנֹ֣א אֹת֔/וֹ עַל חֲלֹמֹתָ֖י/ו וְ/עַל דְּבָרָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/008.yaml
  text: His brothers said to him, “Will you really reign over us? Will you really rule over us?” So they hated him even more because of his dreams and because of his words.
translation:
  language: te
  text: 'అతని అన్నలు అతనితో ఇలా అన్నారు: “నువ్వు నిజంగా మమ్మల్ని ఏలుతావా? నువ్వు నిజంగా మాపై అధికారం చెలాయిస్తావా?” అతని కలల వల్ల, అతని మాటల వల్ల వారు అతన్ని మరింత ద్వేషించారు.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֲמָלֹךְ תִּמְלֹךְ
  choice: నువ్వు నిజంగా మమ్మల్ని ఏలుతావా?
  rationale: ఒకే ధాతువు కలిగిన infinitive absolute + finite verb నిర్మాణంలోని బలాన్ని ‘నిజంగా’తో సహజమైన తెలుగులో వ్యక్తం చేశాం; ప్రశ్నలోని ఎగతాళి/అవిశ్వాస స్వరం నిలిచింది.
- source_word: אִם מָשׁוֹל תִּמְשֹׁל בָּנוּ
  choice: నువ్వు నిజంగా మాపై అధికారం చెలాయిస్తావా?
  rationale: מָשַׁל యొక్క పాలన/ఆధిపత్య భావాన్ని ‘అధికారం చెలాయించు’గా ఇచ్చి, మొదటి క్రియతో ఉన్న ఉద్దేశపూర్వక సమాంతరతను మరియు స్వల్ప పదభేదాన్ని కాపాడాం.
- source_word: וַיּוֹסִפוּ עוֹד שְׂנֹא אֹתוֹ
  choice: వారు అతన్ని ఇంకా ఎక్కువగా ద్వేషించారు
  rationale: హీబ్రూ నిర్మాణం ద్వేషం మరింత పెరిగిందనే భావాన్ని ఇస్తుంది; ఆధునిక తెలుగులో సహజంగా ‘ఇంకా ఎక్కువగా’ అని అనువదించాం.
- source_word: עַל חֲלֹמֹתָיו וְעַל דְּבָרָיו
  choice: అతని కలలనుబట్టి, అతని మాటలనుబట్టి
  rationale: עַל ఇక్కడ కారణాన్ని సూచిస్తుంది. రెండు పదబంధాల పునరావృతాన్ని తెలుగులోనూ నిలిపి, కలలు మరియు మాటలు రెండూ వారి ద్వేషానికి కారణాలని స్పష్టం చేశాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కథనానికి తగిన గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన శైలి. ‘ఏలు’ మరియు ‘అధికారం చెలాయించు’ ద్వారా రెండు సమాంతర హీబ్రూ క్రియల మధ్య భావసామ్యాన్నీ పదభేదాన్నీ నిలిపాం.
