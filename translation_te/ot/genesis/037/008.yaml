  - severity: low
    issue: కలలనుబట్టి and మాటలనుబట్టి are less natural as fused forms in this context.
    rationale: కలల వల్ల and మాటల వల్ల are idiomatic modern causal expressions and preserve the Hebrew repetition of על ('because of').
