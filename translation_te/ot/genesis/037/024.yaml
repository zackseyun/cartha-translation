source:
  edition: WLC
  text: וַ/יִּ֨קָּחֻ֔/הוּ וַ/יַּשְׁלִ֥כוּ אֹת֖/וֹ הַ/בֹּ֑רָ/ה וְ/הַ/בּ֣וֹר רֵ֔ק אֵ֥ין בּ֖/וֹ מָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/024.yaml
  text: Then they took him and threw him into the pit[a]. Now the pit was empty; there was no water in it.
translation:
  language: te
  text: అప్పుడు వారు అతన్ని పట్టుకొని, ఆ గోతిలో[a] పడవేశారు. ఆ గోతి ఖాళీగా ఉంది; దానిలో నీళ్లు లేవు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నీటి తొట్టిలో.’ హీబ్రూ పదం బోర్ నీటిని నిల్వచేసే గోతిని లేదా తొట్టిని కూడా సూచించవచ్చు; దానిలో నీళ్లు లేవని తరువాత చెప్పడం ఈ అర్థానికి సరిపోతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקָּחֻהוּ
  choice: అప్పుడు వారు అతన్ని పట్టుకొని
  rationale: వావ్-క్రమరూపం కథనాన్ని ముందుకు నడిపిస్తుంది; לקח ఇక్కడ సాధారణంగా ‘తీసుకోవడం/పట్టుకోవడం’ అనే భావం ఇస్తుంది. సందర్భానికి తగిన సహజమైన తెలుగులో ‘పట్టుకొని’ అని అనువదించాం; ‘బలవంతంగా పట్టుకున్నారు’ అని తీవ్రతను అదనంగా చేర్చలేదు.
- source_word: וַיַּשְׁלִכוּ אֹתוֹ
  choice: పడవేశారు
  rationale: השליך అంటే ‘విసరడం/పడవేయడం.’ గోతిలోకి ఒక వ్యక్తిని వేయడాన్ని ఆధునిక తెలుగులో సహజంగా తెలిపేందుకు ‘పడవేశారు’ ఎంచుకున్నాం; మూలంలో లేని అదనపు తీవ్రతను చేర్చలేదు.
- source_word: הַבֹּרָה
  choice: ఆ గోతిలో[a]
  rationale: בּוֹר అనే పదం గోతి, నీటి తొట్టి లేదా బావి వంటి లోతైన స్థలాన్ని సూచించగలదు. తరువాత నీళ్లు లేవని చెప్పడం వల్ల నీటిని నిల్వచేసే తొట్టి భావం సాధ్యమైనప్పటికీ, విస్తృతమైన మూలార్థాన్ని నిలుపుతూ ప్రధాన పాఠ్యంలో ‘గోతి’ వాడాం; ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: וְהַבּוֹר רֵק
  choice: ఆ గోతి ఖాళీగా ఉంది
  rationale: ఈ వాక్యభాగం గోతి స్థితిని వివరిస్తుంది. רֵק ను నేరుగా, సహజంగా ‘ఖాళీగా’ అని అనువదించాం.
- source_word: אֵין בּוֹ מָיִם
  choice: దానిలో నీళ్లు లేవు
  rationale: గోతి ఏ అర్థంలో ఖాళీగా ఉందో ఈ భాగం స్పష్టపరుస్తుంది. ‘దానిలో నీళ్లు లేవు’ అనేది మూలంలోని నీటి ప్రస్తావనను పూర్తిగా నిలిపే సహజమైన ఆధునిక తెలుగు.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని వాడాం. ‘నీళ్లు’ సాధారణ పాఠకులకు సహజంగా ఉండటంతో దానిని ఎంచుకున్నాం. ప్రధాన పాఠ్యంలో ‘గోతి’ ద్వారా హీబ్రూ పదంలోని విస్తృత భావాన్ని నిలిపి, మరింత నిర్దిష్టమైన అర్థాన్ని పాదటిప్పణిలో ఇచ్చాం.
