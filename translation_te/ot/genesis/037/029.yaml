  yaml_path: translation/ot/genesis/037/029.yaml
  text: When Reuben returned to the pit[a], behold, Joseph was not in the pit[b], and he tore his clothes.
translation:
  language: te
  text: రూబేను ఆ గుంటకు తిరిగి వచ్చాడు.[a] ఇదిగో, యోసేపు గుంటలో లేడు. అప్పుడు అతడు తన బట్టలు చింపుకున్నాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '‘గుంట’ను ‘నీటి నిల్వ గుంట’ అని కూడా అనువదించవచ్చు (హీబ్రూ: బోర్).'
    reason: lexical_alternative
  - marker: b
    text: బట్టలు చింపుకోవడం దుఃఖం, దిగ్భ్రాంతి లేదా తీవ్ర వేదనను వ్యక్తం చేసే నాటి ఆచారం.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: తిరిగి వచ్చినప్పుడు
  rationale: שׁוב్ ధాతువు ఇక్కడ రూబేను మునుపటి స్థలానికి తిరిగి రావడాన్ని సూచిస్తుంది. తెలుగు కథన ప్రవాహంలో కాలసంబంధ ఉపవాక్యంగా అనువదించడం సహజంగా ఉంది.
- source_word: הַבּוֹר / בַּבּוֹר
  choice: ఆ గోతివద్ద / గోతిలో
  rationale: בּוֹר అంటే గోతు లేదా నీటిని నిల్వచేసే తొట్టి కావచ్చు. ఈ సందర్భంలో ‘గోతు’ సాధారణ పాఠకులకు స్పష్టంగా ఉండి, యోసేపును పడవేసిన స్థలాన్ని సహజంగా సూచిస్తుంది; ‘నీటి తొట్టి’ అనే సాధ్యమైన అర్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: הִנֵּה తరువాతి ఆకస్మిక దృశ్యంపై దృష్టి నిలిపే కథన సూచకం. ‘ఇదిగో’ దాని ఆశ్చర్యాన్ని, హఠాత్తుతనాన్ని నిలుపుతుంది.
- source_word: אֵין יוֹסֵף בַּבּוֹר
  choice: యోసేపు గోతిలో లేడు
  rationale: אֵין ఇక్కడ యోసేపు అక్కడ లేకపోవడాన్ని తెలియజేస్తుంది. ‘వెళ్లిపోయాడు’ వంటి అదనపు భావాన్ని చేర్చకుండా మూలంలోని సమాచారాన్నే ఇస్తుంది.
- source_word: וַיִּקְרַע אֶת בְּגָדָיו
  choice: అతడు తన బట్టలు చింపుకున్నాడు
  rationale: ఇది దుఃఖం, దిగ్భ్రాంతి లేదా తీవ్ర వేదనను వ్యక్తం చేసే సాంప్రదాయ చర్య. ‘బట్టలు చింపుకున్నాడు’ ఆధునిక తెలుగులో స్పష్టంగా, సహజంగా ఉంది.
