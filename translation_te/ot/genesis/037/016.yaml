  yaml_path: translation/ot/genesis/037/016.yaml
  text: He said[a], “I am looking for my brothers. Please tell me where they are pasturing.”
translation:
  language: te
  text: అతడు, “నేను నా అన్నలను వెదుకుతున్నాను. వారు ఎక్కడ మేపుతున్నారో దయచేసి నాకు చెప్పండి” అన్నాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో మేపబడుతున్న పశువుల మందకు సంబంధించిన పదం ప్రత్యక్షంగా లేదు. “వారు ఎక్కడ మందను కాస్తున్నారో” అని కూడా అనువదించవచ్చు. ఇక్కడి కృదంతం పశువులను మేతలో చూసుకోవడం లేదా మేపడం అనే భావాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అతడు ... అన్నాడు
  rationale: హీబ్రూ కథనంలోని సాధారణ wayyiqtol రూపం. సహజమైన తెలుగు ప్రత్యక్ష సంభాషణ క్రమానికి అనుగుణంగా మాటల తరువాత ‘అన్నాడు’ ఉంచబడింది.
- source_word: אֶת אַחַי
  choice: నా అన్నలను
  rationale: సందర్భంలో యోసేపు తనకంటే పెద్దవారైన పురుష సహోదరులను సూచిస్తున్నాడు; ఆధునిక తెలుగులో ‘అన్నలు’ ఈ బంధాన్ని సహజంగా, ఖచ్చితంగా తెలియజేస్తుంది.
- source_word: אָנֹכִי מְבַקֵּשׁ
  choice: నేను ... వెదుకుతున్నాను
  rationale: స్వతంత్ర సర్వనామంతో కూడిన వర్తమాన కృదంతం కొనసాగుతున్న తక్షణ అన్వేషణను సూచిస్తుంది; ‘వెదుకుతున్నాను’ ఆ భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: הַגִּידָה נָּא לִי
  choice: దయచేసి నాకు చెప్పండి
  rationale: נגד యొక్క హిఫిల్ ఆజ్ఞారూపం మరియు נָא కలిసి మర్యాదపూర్వక అభ్యర్థనను వ్యక్తం చేస్తాయి.
- source_word: אֵיפֹה הֵם
  choice: వారు ఎక్కడ
  rationale: స్థలాన్ని ప్రశ్నించే క్రియావిశేషణం మరియు స్పష్టమైన బహువచన సర్వనామం రెండూ తెలుగులో నిలుపబడ్డాయి.
- source_word: רֹעִים
  choice: మందను మేపుతున్నారు
  rationale: רעה కృదంతం పశువులను మేతలో సంరక్షించడం లేదా మేపడం అనే భావం ఇస్తుంది. తెలుగులో ‘మేపుతున్నారు’ సహజమైనది; సందర్భం స్పష్టత కోసం ‘మందను’ చేర్చబడింది, కానీ అది హీబ్రూలో ప్రత్యక్షంగా లేదు.
