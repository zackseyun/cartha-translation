translation:
  language: te
  text: అప్పుడు యాకోబు తన బట్టలు చింపుకొని, గోనెపట్టను తన నడుముకు కట్టుకొని, తన కుమారుని గురించి చాలా రోజులు శోకించాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרַע
  choice: చింపుకొని
  rationale: క్రע్ అనే క్రియ శోకసందర్భంలో దుఃఖానికి సూచనగా వస్త్రాలను చింపుకోవడాన్ని సూచిస్తుంది; ‘చింపుకొని’ సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: שִׂמְלֹתָיו
  choice: తన బట్టలు
  rationale: שִׂמְלָה సాధారణంగా వస్త్రాలు లేదా దుస్తులను సూచిస్తుంది; ‘బట్టలు’ సాధారణ పాఠకులకు సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: שַׂק
  choice: గోనెపట్ట
  rationale: శోకచిహ్నంగా ధరించే ముతక వస్త్రాన్ని సూచిస్తుంది; ‘గోనెపట్ట’ ఆ సాంస్కృతిక భావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: בְּמָתְנָיו
  choice: తన నడుముకు
  rationale: מָתְנַיִם నడుము/నడుము దిగువ భాగాన్ని సూచిస్తుంది; సందర్భంలో ‘నడుముకు’ ఆధునిక తెలుగులో సహజమైన శరీరస్థాన సూచన.
- source_word: וַיִּתְאַבֵּל
  choice: దుఃఖించాడు
  rationale: אבל యొక్క హిత్పయేల్ రూపం ఆచారసహితమైన శోకస్థితిలో ఉండటాన్ని సూచిస్తుంది; తెలుగులో ‘దుఃఖించాడు’ సందర్భానుకూలంగా సహజంగా ఉంది.
- source_word: עַל־בְּנוֹ
  choice: తన కుమారుని కోసం
  rationale: శోకాన్ని తెలిపే క్రియతో עַל ‘కోసం’ లేదా ‘గురించి’ అనే భావాన్ని ఇస్తుంది; ‘కోసం’ తెలుగులో మరణశోక సందర్భానికి సహజం.
- source_word: יָמִים רַבִּים
  choice: చాలా రోజులు
  rationale: ఈ పదబంధం అక్షరార్థంగా ‘అనేక రోజులు’; ‘చాలా రోజులు’ కాలవ్యవధిని సహజమైన తెలుగులో తెలియజేస్తుంది.
