source:
  edition: WLC
  text: וְ/יִשְׂרָאֵ֗ל אָהַ֤ב אֶת יוֹסֵף֙ מִ/כָּל בָּנָ֔י/ו כִּֽי בֶן זְקֻנִ֥ים ה֖וּא ל֑/וֹ וְ/עָ֥שָׂה ל֖/וֹ כְּתֹ֥נֶת פַּסִּֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/003.yaml
  text: Israel loved Joseph more than all his sons[a], because he was the son of his old age; and he made for him a richly ornamented robe.
translation:
  language: te
  text: ఇశ్రాయేలు తన కుమారులందరికంటే యోసేపును ఎక్కువగా ప్రేమించాడు. ఎందుకంటే యోసేపు ఇశ్రాయేలు ముసలితనంలో కలిగిన కుమారుడు. అతనికోసం ఒక విశిష్టమైన అంగీని చేయించాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: సాంప్రదాయంగా, “అనేక రంగుల అంగీ.” ఈ హీబ్రూ పదబంధం యొక్క ఖచ్చితమైన అర్థం అనిశ్చితం. ఇది ప్రత్యేకంగా అలంకరించిన అంగీని గానీ, మణికట్టుల వరకు మరియు చీలమండల వరకు పొడవుగా ఉండే అంగీని గానీ సూచించవచ్చు; రంగులనే తప్పనిసరిగా సూచించదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִשְׂרָאֵל
  choice: ఇశ్రాయేలు
  rationale: హీబ్రూ పాఠంలో ఉన్న వ్యక్తిపేరునే ఉంచాం. ఆరంభ וְ కథన అనుసంధానాన్ని సూచిస్తుంది; తెలుగులో ప్రత్యేకమైన ‘మరియు/ఇప్పుడు’ లేకుండానే సహజంగా వ్యక్తమవుతుంది.
- source_word: אָהַב
  choice: ప్రేమించాడు
  rationale: మూల క్రియ యొక్క సాధారణ అర్థం ‘ప్రేమించు’; సందర్భంలోని పక్షపాతాన్ని ప్రధాన పాఠంలో ‘ఎక్కువగా’ అనే తులన స్పష్టం చేస్తుంది.
- source_word: מִכָּל בָּנָיו
  choice: తన కుమారులందరికంటే ఎక్కువగా
  rationale: מִן యొక్క తులనాత్మక భావాన్నీ, בָּנָיו అనే పురుష బహువచనాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ఇశ్రాయేలు యోసేపును ప్రత్యేకంగా ప్రేమించడానికి కారణాన్ని పరిచయం చేస్తుంది.
- source_word: בֶן זְקֻנִים הוּא לוֹ
  choice: అతడు తన ముసలితనంలో పుట్టిన కుమారుడు
  rationale: ‘ముసలితనపు కుమారుడు’ అనే హీబ్రూ నుడికారాన్ని సాధారణ తెలుగు పాఠకుడికి సహజంగా అర్థమయ్యేలా తెలిపాం; ‘తన’ ఇశ్రాయేలును సూచిస్తుంది.
- source_word: וְעָשָׂה לוֹ
  choice: అతని కోసం … చేయించాడు
  rationale: לוֹ లోని ‘అతని కోసం’ భావాన్ని నిలుపుతుంది. వస్త్రాన్ని స్వయంగా కుట్టాడని తప్పనిసరిగా సూచించకుండా తెలుగు వాడుకలో సహజమైన కారణార్థక రూపాన్ని ఎంచుకున్నాం.
- source_word: כְּתֹנֶת פַּסִּים
  choice: ప్రత్యేకంగా అలంకరించిన అంగీ
  rationale: כְּתֹנֶת కు ‘అంగీ’ సహజమైన వస్త్రపదం. פַּסִּים యొక్క ఖచ్చిత భావం అనిశ్చితం; రంగులనే నిర్దిష్టంగా చెప్పకుండా విశిష్ట వస్త్రం అనే సందర్భార్థాన్ని ప్రధాన పాఠంలో ఇచ్చి, ప్రత్యామ్నాయాలను పాదటిప్పణిలో ఉంచాం.
