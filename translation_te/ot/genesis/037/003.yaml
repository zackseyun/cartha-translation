translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథన శైలి. హీబ్రూ వస్త్రపదబంధంలోని నిజమైన అనిశ్చితిని పాదటిప్పణిలో సంరక్షించాం.
