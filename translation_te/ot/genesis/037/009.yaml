  text: וַ/יַּחֲלֹ֥ם עוֹד֙ חֲל֣וֹם אַחֵ֔ר וַ/יְסַפֵּ֥ר אֹת֖/וֹ לְ/אֶחָ֑י/ו וַ/יֹּ֗אמֶר הִנֵּ֨ה חָלַ֤מְתִּֽי חֲלוֹם֙ ע֔וֹד וְ/הִנֵּ֧ה הַ/שֶּׁ֣מֶשׁ וְ/הַ/יָּרֵ֗חַ וְ/אַחַ֤ד עָשָׂר֙ כּֽוֹכָבִ֔ים מִֽשְׁתַּחֲוִ֖ים לִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/009.yaml
  text: 'Then he dreamed another dream and told it to his brothers[a], and said, “Look, I have dreamed another dream: the sun, the moon, and eleven stars were bowing down to me.”'
translation:
  language: te
  text: 'ఆ తర్వాత అతడు మరో కల కని, దాన్ని తన అన్నదమ్ములకు చెప్పాడు. అతడు ఇలా అన్నాడు: “చూడండి, నేను ఇంకొక కల కన్నాను. ఇదిగో, సూర్యుడు, చంద్రుడు, పదకొండు నక్షత్రాలు నాకు వంగి నమస్కరిస్తున్నాయి[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నా ఎదుట సాష్టాంగపడుతున్నాయి.” హెబ్రీ క్రియ లోతుగా వంగి ఘనత చూపడాన్ని సూచించగలదు; ఇక్కడ భావం దైవారాధన కంటే విధేయతతో ఘనత చూపడం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחֲלֹם עוֹד חֲלוֹם אַחֵר
  choice: ఆ తర్వాత అతడు మరో కల కని
  rationale: కథనాన్ని ముందుకు నడిపే wayyiqtol రూపాన్ని ‘ఆ తర్వాత’ సహజంగా వ్యక్తం చేస్తుంది. עוֹד మరియు אַחֵר కలిసి సూచించే పునరావృత భావాన్ని ‘మరో కల’ అందిస్తుంది.
- source_word: וַיְסַפֵּר אֹתוֹ לְאֶחָיו
  choice: దాన్ని తన అన్నదమ్ములకు చెప్పాడు
  rationale: סִפֵּר యొక్క సాధారణ అర్థమైన చెప్పడం/వివరించడం అనే భావాన్ని సరళమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; אֶחָיו ను సందర్భానుసారంగా ‘తన అన్నదమ్ములు’ అని అనువదించాం.
- source_word: הִנֵּה ... וְהִנֵּה
  choice: చూడండి ... ఇదిగో
  rationale: శ్రోతల దృష్టిని ఆకర్షించే మొదటి הִנֵּה ను ‘చూడండి’ అని, కలలోని దృశ్యాన్ని పరిచయం చేసే రెండవదాన్ని ‘ఇదిగో’ అని అనువదించి హెబ్రీ పునరుక్తిని నిలిపాం.
- source_word: חָלַמְתִּי חֲלוֹם עוֹד
  choice: నేను ఇంకొక కల కన్నాను
  rationale: హెబ్రీలోని ‘కల కను’ cognate construction తెలుగులోనూ సహజంగా ఉంటుంది; עוֹד లోని మరొకసారి అనే భావం ‘ఇంకొక’లో నిలిచింది.
- source_word: הַשֶּׁמֶשׁ וְהַיָּרֵחַ וְאַחַד עָשָׂר כּוֹכָבִים
  choice: సూర్యుడు, చంద్రుడు, పదకొండు నక్షత్రాలు
  rationale: ఖగోళ వస్తువులను, సంఖ్యను నేరుగా మరియు సహజమైన తెలుగు జాబితా రూపంలో అనువదించాం.
- source_word: מִשְׁתַּחֲוִים לִי
  choice: నాకు వంగి నమస్కరిస్తున్నాయి
  rationale: హిత్పయేల్ participle కలలో కొనసాగుతున్న చర్యను సూచిస్తుంది. ‘వంగి నమస్కరించడం’ లోతైన విధేయత లేదా ఘనతను వ్యక్తం చేస్తుంది; సందర్భం నిర్బంధించని దైవారాధన భావాన్ని చేర్చదు.
theological_decisions:
- issue: యోసేపు కలలో מִשְׁתַּחֲוִים అనే క్రియ భావం
  choice: ‘నాకు వంగి నమస్కరిస్తున్నాయి’ అనే ఘనత/విధేయత భావం
  alternative: ‘నన్ను ఆరాధిస్తున్నాయి’
  rationale: తక్షణ కథన సందర్భం కుటుంబ సభ్యుల లోబడటాన్ని, తరువాత వారు చూపే ఘనతను సూచిస్తుంది; దైవారాధనను కాదు. ‘వంగి నమస్కరించడం’ మూలపదంలోని శారీరక భంగిమను, సామాజిక విధేయతను నిలుపుతూ అనవసరమైన సిద్ధాంతార్థాన్ని జోడించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. మూలంలోని రెండు הִנֵּה సూచనలను ‘చూడండి’, ‘ఇదిగో’గా నిలిపాం. ‘అన్నదమ్ములు’ సాధారణ పాఠకులకు సహజంగా ఉండి సందర్భంలోని సహోదరులను స్పష్టంగా సూచిస్తుంది.
