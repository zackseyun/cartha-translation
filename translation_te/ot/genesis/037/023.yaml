source:
  edition: WLC
  text: וַֽ/יְהִ֕י כַּֽ/אֲשֶׁר בָּ֥א יוֹסֵ֖ף אֶל אֶחָ֑י/ו וַ/יַּפְשִׁ֤יטוּ אֶת יוֹסֵף֙ אֶת כֻּתָּנְתּ֔/וֹ אֶת כְּתֹ֥נֶת הַ/פַּסִּ֖ים אֲשֶׁ֥ר עָלָֽי/ו־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/023.yaml
  text: And when Joseph came to his brothers[a], they stripped Joseph of his tunic, the tunic of many colors that was on him.
translation:
  language: te
  text: యోసేపు తన అన్నల దగ్గరకు వచ్చినప్పుడు, వారు యోసేపు అంగీని, అతడు వేసుకున్న ఆ ప్రత్యేకమైన అంగీని[a], తీసివేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “పొడవాటి చేతులున్న అంగీ,” లేదా “అందంగా అలంకరించిన అంగీ.” సాంప్రదాయికంగా “రకరకాల రంగుల అంగీ” అని కూడా అనువదిస్తారు, అయితే అది తక్కువ సంభావ్యమైన అర్థం కావచ్చు. כְּתֹנֶת הַפַּסִּים అనే హీబ్రూ పదబంధం యొక్క ఖచ్చితమైన అర్థం అనిశ్చితం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: వచ్చినప్పుడు
  rationale: హీబ్రూ కథన సూత్రంలోని కాలార్థాన్ని సహజమైన ఆధునిక తెలుగు ఉపవాక్యంతో వ్యక్తం చేస్తుంది; ‘జరిగిందేమిటంటే’ అనే పదశః రూపం అవసరం లేదు.
- source_word: בָּא ... אֶל אֶחָיו
  choice: తన అన్నల దగ్గరికి వచ్చినప్పుడు
  rationale: సందర్భంలో వీరు యోసేపు కంటే పెద్దవారైన మగ సహోదరులు; అందువల్ల సాధారణ ‘సోదరులు’ కంటే ‘అన్నలు’ సంబంధాన్ని సహజంగా, కచ్చితంగా తెలియజేస్తుంది.
- source_word: וַיַּפְשִׁיטוּ
  choice: అతని ఒంటిమీద నుంచి లాగి తీసేశారు
  rationale: ఇది కేవలం వస్త్రాన్ని తీసివేయడం కాక, మరొకరిని బలవంతంగా వస్త్రహీనుణ్ణి చేయడాన్ని సూచిస్తుంది. ఈ తెలుగు రూపం చర్యలోని బలవంతాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: כֻּתָּנְתּוֹ
  choice: అతడు వేసుకున్న అంగీని
  rationale: כֻּתֹּנֶת అనేది శరీరంపై ధరించే పొడవైన వస్త్రం. ‘అంగీ’ సాధారణ పాఠకుడికి అర్థమయ్యే, ‘వస్త్రం’ కంటే నిర్దిష్టమైన సమానార్థకం.
- source_word: כְּתֹנֶת הַפַּסִּים
  choice: ఆ ప్రత్యేకమైన అంగీని
  rationale: פַּסִּים యొక్క ఖచ్చితమైన భావం అనిశ్చితం. ‘ప్రత్యేకమైన’ అనేది రంగులు, పొడవైన చేతులు, లేదా అలంకరణ అనే ఏ ఒక్క వివాదాస్పద అర్థాన్నీ ప్రధాన పాఠ్యంలో స్థిరపరచకుండా దాని విశిష్టతను తెలియజేస్తుంది.
- source_word: אֲשֶׁר עָלָיו
  choice: అతడు వేసుకున్న ... అతని ఒంటిమీద నుంచి
  rationale: యోసేపు ఆ సమయంలో దానిని ధరించి ఉన్నాడనే భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; చివరి పదబంధం దాని తొలగింపును కూడా స్పష్టం చేస్తుంది.
