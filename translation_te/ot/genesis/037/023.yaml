  register: ఆధునిక ప్రామాణిక తెలుగు; కథనానికి తగిన గంభీరతతో పాటు సాధారణ పాఠకుడికి సహజంగా ఉండే వాక్యనిర్మాణం. మూలంలోని వస్త్రపదానికి గల అనిశ్చితిని ప్రధాన పాఠ్యంలో ‘ప్రత్యేకమైన’ అని ఉంచి, ప్రత్యామ్నాయాలను పాదటిప్పణిలో ఇచ్చాం.
