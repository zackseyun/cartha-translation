translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా, కథనానికి తగిన గౌరవప్రదమైన శైలి. హీబ్రూ సముచ్చయాలన్నిటినీ వరుసగా ‘మరియు’తో అనుకరించకుండా, సంబంధాన్ని సహజమైన తెలుగు ఉపవాక్యంతో తెలిపాం.
