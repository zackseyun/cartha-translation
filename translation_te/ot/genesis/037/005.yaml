  yaml_path: translation/ot/genesis/037/005.yaml
  text: Joseph dreamed a dream[a], and he told it to his brothers, and they hated him even more.
translation:
  language: te
  text: యోసేపు ఒక కల కన్నాడు[a]. అతను దానిని తన సోదరులకు చెప్పాడు; వారు అతన్ని ఇంకా ఎక్కువగా ద్వేషించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “యోసేపు ఒక కలను కలగన్నాడు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחֲלֹם יוֹסֵף חֲלוֹם
  choice: యోసేపు ఒక కల కన్నాడు
  rationale: హీబ్రూలో ఒకే మూలానికి చెందిన క్రియ, నామవాచకం కలిసి ఉన్న నిర్మాణం అక్షరార్థంగా ‘ఒక కలను కలగన్నాడు.’ ఆధునిక తెలుగులో ‘ఒక కల కన్నాడు’ సహజంగా ఉండి, ఆ నిర్మాణంలోని భావాన్ని కూడా కాపాడుతుంది.
- source_word: וַיַּגֵּד
  choice: చెప్పినప్పుడు
  rationale: נגד ఇక్కడ తెలియజేయడం లేదా చెప్పడం అనే అర్థం ఇస్తుంది. తెలుగు వాక్యప్రవాహం సహజంగా ఉండేందుకు తరువాతి క్రియతో కాలసంబంధ ఉపవాక్యంగా కలిపాం; కలను సూచించేందుకు ‘దాన్ని’ వాడాం.
- source_word: לְאֶחָיו
  choice: తన సోదరులకు
  rationale: పురుష బహువచన బంధుత్వ పదాన్ని లింగనిర్దిష్టంగానే నిలిపి, 3వ పురుష ఏకవచన ప్రత్యయాన్ని సహజమైన తెలుగు స్వవాచక రూపమైన ‘తన’తో తెలిపాం.
- source_word: וַיּוֹסִפוּ עוֹד שְׂנֹא אֹתוֹ
  choice: వారు అతన్ని ఇంకా ఎక్కువగా ద్వేషించారు
  rationale: יסף మరియు עוד కలయిక ద్వేషం మరింత పెరిగిందని సూచిస్తుంది. ‘ఇంకా ఎక్కువగా’ ఆ తీవ్రత పెరుగుదలను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: וַ
  choice: ప్రత్యేక ఆరంభ పదం లేకుండా కథన క్రమం
  rationale: ఆరంభ వావ్ కథనాన్ని ముందుకు నడిపిస్తుంది; మూలంలో స్పష్టమైన ‘ఇప్పుడు’ అనే కాలపదం లేదు. తెలుగులో వాక్యక్రమమే కథన కొనసాగింపును సహజంగా చూపుతుంది.
