translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన వాక్యనిర్మాణం, అయితే ‘రక్తం’ అనే హీబ్రూ మూలచిత్రాన్ని నిలుపుకుంది. సంభాషణలో గౌరవప్రదమైన కాని అతిగా గ్రాంథికం కాని శైలి వాడబడింది.
