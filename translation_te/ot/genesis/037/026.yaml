  to: 'అప్పుడు యూదా తన సోదరులతో ఇలా అన్నాడు: “మన సోదరుణ్ణి చంపి, అతని రక్తాన్ని కప్పిపుచ్చితే మనకు లాభమేమిటి?[a]”'
