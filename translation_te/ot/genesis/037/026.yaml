language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר יְהוּדָ֖ה אֶל אֶחָ֑י/ו מַה בֶּ֗צַע כִּ֤י נַהֲרֹג֙ אֶת אָחִ֔י/נוּ וְ/כִסִּ֖ינוּ אֶת דָּמֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/026.yaml
  text: Then Judah said to his brothers[a], “What profit is there if we kill our brother and cover up his blood?”
translation:
  language: te
  text: 'అప్పుడు యూదా తన సోదరులతో ఇలా అన్నాడు: “మన సోదరుణ్ణి చంపి, అతని రక్తాన్ని కప్పిపుచ్చితే మనకు లాభమేమిటి?[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మన సోదరుణ్ణి చంపి, అతని రక్తాన్ని దాచిపెడితే మనకు ప్రయోజనమేమిటి?” హీబ్రూలోని “అతని రక్తాన్ని కప్పడం” అనే ప్రయోగం రక్తపాతాన్ని లేదా ఆ రక్తపాతానికి సంబంధించిన దోషాన్ని దాచడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... అన్నాడు
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది; ఆధునిక తెలుగులో ‘అప్పుడు’ ఆ క్రమబద్ధతను సహజంగా తెలియజేస్తుంది.
- source_word: יְהוּדָה
  choice: యూదా
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగులో ప్రాచుర్యంలో ఉన్న రూపం.
- source_word: אֶל אֶחָיו
  choice: తన సోదరులతో
  rationale: సందర్భంలో యోసేపు యొక్క పురుష సహోదరులనే సూచిస్తుంది; ‘సోదరులతో’ సహజమైన, గౌరవప్రదమైన ఆధునిక తెలుగు.
- source_word: מַה בֶּצַע
  choice: మనకు లాభమేమిటి?
  rationale: בֶּצַע లాభం లేదా స్వప్రయోజనాన్ని సూచిస్తుంది. ఈ రూపం యూదా చేసిన ప్రయోజనాత్మక లెక్కింపును స్పష్టంగా నిలుపుతుంది.
- source_word: כִּי
  choice: '...తే'
  rationale: ఈ అలంకారప్రశ్నలో షరతు/విషయార్థాన్ని తెలుగులో ‘చంపి ... కప్పిపుచ్చితే’ అనే షరతార్థక నిర్మాణం సహజంగా వ్యక్తం చేస్తుంది.
- source_word: נַהֲרֹג
  choice: మన సోదరుణ్ణి చంపి
  rationale: మొదటి పురుష బహువచన క్రియను తెలుగులో కర్తసూచక ‘మన’తో కలిపి సహజంగా అందించింది.
- source_word: אָחִינוּ
  choice: మన సోదరుణ్ణి
  rationale: కుటుంబ బంధాన్ని నేరుగా నిలుపుతూ వాక్యంలోని నైతిక ఒత్తిడిని సంరక్షిస్తుంది.
- source_word: וְכִסִּינוּ אֶת דָּמוֹ
  choice: అతని రక్తాన్ని కప్పిపుచ్చితే
  rationale: అక్షరార్థమైన ‘అతని రక్తాన్ని కప్పడం’ వెనుక ఉన్న రక్తపాతాన్ని లేదా దోషాన్ని దాచే జాతీయార్థాన్ని ‘కప్పిపుచ్చు’ సహజంగా తెలియజేస్తూ రక్తం అనే మూలచిత్రాన్ని నిలుపుతుంది.
