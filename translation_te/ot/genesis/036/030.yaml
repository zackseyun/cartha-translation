id: GEN.36.30
reference: Genesis 36:30
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אַלּ֥וּף דִּשֹׁ֛ן אַלּ֥וּף אֵ֖צֶר אַלּ֣וּף דִּישָׁ֑ן אֵ֣לֶּה אַלּוּפֵ֧י הַ/חֹרִ֛י לְ/אַלֻּפֵי/הֶ֖ם בְּ/אֶ֥רֶץ שֵׂעִֽיר׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/030.yaml
  text: Chief Dishon[a], chief Ezer[b], chief Dishan—these were the chiefs of the Horites according to their chiefs in the land of Seir.
translation:
  language: te
  text: దీషోను నాయకుడు, ఏసెరు నాయకుడు, దీషాను నాయకుడు—వీరు శేయీరు దేశంలోని హోరీయుల నాయకులు, వారి వారి విభాగాల ప్రకారం.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వారి వారి నాయకుల ప్రకారం.’ ఇక్కడి హీబ్రూ పదబంధం నాయకుల ఆధారంగా చేసిన వర్గీకరణను లేదా వారు నడిపించిన విభాగాలను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַלּוּף
  choice: నాయకుడు
  rationale: ఆదికాండం 36లో ఈ పదం ఎదోమీయులు లేదా హోరీయుల గోత్ర/వంశ విభాగానికి నాయకుణ్ణి సూచిస్తుంది. ఆధునిక ప్రామాణిక తెలుగులో ‘నాయకుడు’ సహజంగా, స్పష్టంగా ఉంటుంది; హీబ్రూ జాబితాలోని పునరుక్తిని నిలుపుతుంది.
- source_word: דִּשֹׁן
  choice: దీషోను
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగులో లిప్యంతరీకరించాం; దీషాను అనే వేరొక పేరుతో తేడాను నిలిపాం.
- source_word: אֵצֶר
  choice: ఏసెరు
  rationale: వ్యక్తినామాన్ని అర్థానువాదం చేయకుండా హీబ్రూ ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించాం.
- source_word: דִּישָׁן
  choice: దీషాను
  rationale: హీబ్రూ వ్యక్తినామాన్ని లిప్యంతరీకరించి, דִּשֹׁן (దీషోను)తో ఉన్న భేదాన్ని కాపాడాం.
- source_word: אֵלֶּה
  choice: వీరు
  rationale: క్రియలేని హీబ్రూ సంగ్రహ వాక్యాన్ని తెలుగు జాబితా సందర్భంలో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אַלּוּפֵי הַחֹרִי
  choice: హోరీయుల నాయకులు
  rationale: הַחֹרִי ఇక్కడ హోరీయులనే ప్రజాసమూహాన్ని సూచిస్తుంది; బహువచన రూపం తెలుగులో సహజం.
- source_word: לְאַלֻּפֵיהֶם
  choice: వారి వారి నాయకత్వ విభాగాల ప్రకారం
  rationale: לְ వర్గీకరణ భావాన్ని, אַלֻּפֵיהֶם నాయకులతో అనుబంధమైన విభాగాలు/నాయకత్వాలను సూచించే సాధ్యతను వ్యక్తం చేస్తుంది. ‘నాయకుల ప్రకారం’ అనే అసహజ పునరుక్తిని నివారిస్తూ మూలంలోని అర్థసందిగ్ధతను పాదటిప్పణిలో నిలిపాం.
- source_word: בְּאֶרֶץ שֵׂעִיר
  choice: శేయీరు దేశంలోని
  rationale: భౌగోళిక పదబంధాన్ని సహజమైన తెలుగు విశేషణ నిర్మాణంలో ఇచ్చాం; ‘దేశం’ మూలంలోని אֶרֶץ భావాన్ని నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన జాబితా శైలిని వాడాం. పేర్ల మధ్య హీబ్రూ పునరుక్తిని నిలిపి, దీషోను–దీషాను మధ్య భేదాన్ని స్పష్టంగా ఉంచాం. మూలంలోని לְאַלֻּפֵיהֶם పదబంధపు నిజమైన సందిగ్ధతను ప్రధాన పాఠ్యం మరియు పాదటిప్పణి ద్వారా సంరక్షించాం.
