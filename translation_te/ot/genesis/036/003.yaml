  yaml_path: translation/ot/genesis/036/003.yaml
  text: and Basemath[a], the daughter of Ishmael, the sister of Nebaioth.
translation:
  language: te
  text: మరియు ఇష్మాయేలు కుమార్తె, నెబాయోతు సహోదరి అయిన బాసెమతును.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אֶת
  choice: మరియు …ను
  rationale: וְ జాబితాలో మరొక వ్యక్తిని చేరుస్తుంది కాబట్టి ‘మరియు’గా అనువదించాం. אֶת ప్రత్యక్ష కర్మను సూచించే అవ్యయం; తెలుగులో దాని పని ‘బాశెమతును’లోని ‘ను’ ద్వారా సహజంగా వ్యక్తమవుతుంది.
- source_word: בָּשְׂמַת
  choice: బాశెమతు
  rationale: వ్యక్తి పేరును హీబ్రూ ఉచ్చారణకు దగ్గరగా, తెలుగులో సహజంగా ఉండే విధంగా లిప్యంతరీకరించాం.
- source_word: בַּת
  choice: కుమార్తె
  rationale: ఇష్మాయేలుతో బాశెమతుకు ఉన్న తల్లిదండ్రి–సంతాన సంబంధాన్ని సూచించే construct రూపాన్ని నేరుగా అందిస్తుంది.
- source_word: יִשְׁמָעֵאל
  choice: ఇష్మాయేలు
  rationale: హీబ్రూ వ్యక్తి పేరుకు తెలుగులో స్థిరపడిన రూపాన్ని ఉపయోగించాం.
- source_word: אֲחוֹת
  choice: సహోదరి
  rationale: నెబాయోతుతో ఉన్న తోబుట్టువు సంబంధాన్ని గౌరవప్రదమైన ఆధునిక ప్రామాణిక తెలుగులో స్పష్టంగా తెలుపుతుంది.
- source_word: נְבָיוֹת
  choice: నెబాయోతు
  rationale: హీబ్రూ పేరును తెలుగులో పలకడానికి సహజమైన రూపంలో లిప్యంతరీకరించాం; చివరి వ్యంజనాన్ని మాత్రమే చూపే ‘నెబాయోత్’ రూపం ప్రత్యామ్నాయంగా పాదటిప్పణిలో ఇచ్చాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక, గౌరవప్రదమైన తెలుగు. మూలంలోని జాబితా నిర్మాణాన్ని నిలుపుతూ, సంబంధవాచక పదబంధాలను తెలుగులో సహజమైన క్రమంలో అమర్చాం.
