id: GEN.36.15
reference: Genesis 36:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אֵ֖לֶּה אַלּוּפֵ֣י בְנֵֽי עֵשָׂ֑ו בְּנֵ֤י אֱלִיפַז֙ בְּכ֣וֹר עֵשָׂ֔ו אַלּ֤וּף תֵּימָן֙ אַלּ֣וּף אוֹמָ֔ר אַלּ֥וּף צְפ֖וֹ אַלּ֥וּף קְנַֽז־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/015.yaml
  text: 'These are the chiefs of the sons of Esau: the sons of Eliphaz[a], Esau’s firstborn: Chief Teman, Chief Omar, Chief Zepho[b], Chief Kenaz.'
translation:
  language: te
  text: 'ఏశావు కుమారుల అధిపతులు వీరే: ఏశావు మొదటిపుట్టిన కుమారుడైన ఎలీఫజు కుమారులు—అధిపతి తేమాను, అధిపతి ఓమారు, అధిపతి సెఫో, అధిపతి కెనజు.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַלּוּפֵי / אַלּוּף
  choice: నాయకులు / నాయకుడు
  rationale: ఎదోమీయ వంశావళుల్లో ఈ పదం ఒక వంశం లేదా గోత్రానికి అధిపతిని సూచిస్తుంది. ఆధునిక తెలుగులో సహజంగా ఉండేందుకు ‘నాయకుడు’ అని అనువదించాం; ‘వంశాధిపతి’ అనే భావం సందర్భంలో అంతర్లీనంగా ఉంది.
- source_word: בְנֵי
  choice: కుమారులు
  rationale: మూలంలోని ‘కుమారులు’ అనే ప్రత్యక్ష వంశసంబంధ పదాన్ని నిలుపుతుంది; ఈ సందర్భంలో పురుష వంశావళి పేర్లు ఇవ్వబడ్డాయి.
- source_word: בְּכוֹר
  choice: మొదటిపుట్టినవాడు
  rationale: జననక్రమాన్ని, దానితో ముడిపడగల స్థానాన్ని అదనపు వ్యాఖ్యానం లేకుండా స్పష్టంగా తెలియజేస్తుంది.
- source_word: אֵלֶּה
  choice: వీరే
  rationale: జాబితాను పరిచయం చేసే హెబ్రీ నిర్దేశక సూత్రానికి సహజమైన తెలుగు రూపం.
- source_word: עֵשָׂו
  choice: ఏశావు
  rationale: తెలుగు బైబిలు నామరూప సంప్రదాయానికి అనుగుణమైన లిప్యంతరీకరణ.
- source_word: אֱלִיפַז
  choice: ఎలీఫజు
  rationale: హెబ్రీ వ్యక్తినామానికి తెలుగు లిప్యంతరీకరణ.
- source_word: תֵּימָן
  choice: తేమాను
  rationale: జాబితాలో నాయకుని పేరుగా ఉన్న హెబ్రీ నామానికి తెలుగు లిప్యంతరీకరణ.
- source_word: אוֹמָר
  choice: ఓమారు
  rationale: హెబ్రీ వ్యక్తినామానికి తెలుగు లిప్యంతరీకరణ.
- source_word: צְפוֹ
  choice: సెఫో
  rationale: హెబ్రీ צְפוֹ నామాన్ని దాని ధ్వనికి దగ్గరగా తెలుగులో లిప్యంతరీకరించింది.
- source_word: קְנַז
  choice: కెనజు
  rationale: హెబ్రీ వ్యక్తినామానికి తెలుగు లిప్యంతరీకరణ.
theological_decisions:
- issue: אַלּוּף అనే బిరుదు వ్యక్తిని సూచిస్తుందా, వంశాన్ని సూచిస్తుందా
  choice: వ్యక్తిగత బిరుదుగా ‘నాయకుడు’
  alternative: ‘వంశాధిపతి’ లేదా పేర్లను వంశాలుగా అర్థం చేసుకోవడం
  rationale: ప్రతి పేరుకు ముందు ఏకవచన బిరుదు పునరావృతమవుతున్నందున వ్యక్తిగత నాయకత్వ బిరుదును పాఠ్యంలో నిలిపాం; అది వంశ నాయకత్వాన్ని సూచించవచ్చనే సందర్భార్థాన్ని మరీ నిర్దిష్టం చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనా సులభంగా అర్థమయ్యే శైలి. హెబ్రీ వాక్య నిర్మాణంలోని ప్రధాన పరిచయం మరియు ఉపజాబితా సంబంధాన్ని ద్విబిందువు, దీర్ఘవిరామంతో స్పష్టంచేశాం. అవసరం లేని వివరణాత్మక పదాలను చేర్చలేదు.
