  source_fidelity: మూల హెబ్రీలోని ‘ఏశావు కుమారుల అధిపతులు’ అనే నిర్మాణం, ఎలీఫజు ఏశావు మొదటిపుట్టిన కుమారుడనే గుర్తింపు, అలాగే ఒక్కొక్క పేరుకు ముందు పునరావృతమయ్యే אַלּוּף బిరుదు అన్నీ నిలవాలి. ముసాయిదా ప్రధానార్థాన్ని సరిగానే ఇస్తుంది; అయితే ‘కుమారులలోని నాయకులు’ అనేది ‘కుమారులలో కొందరు నాయకులు’ అనే కొద్దిగా భిన్నమైన సంబంధాన్ని సూచించవచ్చు.
  naturalness: ‘ఏశావు కుమారుల అధిపతులు’ అనేది తెలుగులో మరింత సహజమైన, ప్రత్యక్షమైన స్వామ్య/వంశసంబంధ నిర్మాణం. ‘మొదటిపుట్టినవాడైన ఎలీఫజు’ కంటే ‘మొదటిపుట్టిన కుమారుడైన ఎలీఫజు’ స్పష్టంగా, ప్రవాహంగా ఉంటుంది.
