- from: 'అనాకు కుమార్తె, సిబ్యోనుకు కుమార్తె, ఏశావు భార్య అయిన అహొలీబామా కుమారులు వీరే: ఆమె ఏశావుకు యెయూషును, యాలామును, కోరహును కనింది.'
  to: 'మరియు, అనాకు కుమార్తె, సిబ్యోనుకు కుమార్తె, ఏశావు భార్యయైన ఓహొలీబామా కుమారులు వీరు: ఆమె ఏశావుకు యెయూషును, యాలామును, కోరహును కనింది.'
