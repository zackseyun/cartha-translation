language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אֵ֣לֶּה הָי֗וּ בְּנֵ֨י אָהֳלִיבָמָ֧ה בַת עֲנָ֛ה בַּת צִבְע֖וֹן אֵ֣שֶׁת עֵשָׂ֑ו וַ/תֵּ֣לֶד לְ/עֵשָׂ֔ו אֶת יעיש וְ/אֶת יַעְלָ֖ם וְ/אֶת קֹֽרַח־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/014.yaml
  text: 'And these were the sons of Oholibamah daughter of Anah, daughter of Zibeon, Esau''s wife: she bore to Esau Jeush, Jalam, and Korah.'
translation:
  language: te
  text: 'మరియు, అనాకు కుమార్తె, సిబ్యోనుకు కుమార్తె, ఏశావు భార్యయైన ఓహొలీబామా కుమారులు వీరు: ఆమె ఏశావుకు యెయూషును, యాలామును, కోరహును కనింది.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אֵלֶּה הָיוּ
  choice: వీరే
  rationale: వంశావళి పరిచయ సూత్రాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది; సందర్భంతో అనుసంధానం నిలుస్తుంది.
- source_word: בְּנֵי
  choice: కుమారులు
  rationale: పేర్లు చెప్పబడినవారు పురుషులు కాబట్టి విస్తృతార్థకమైన ‘పిల్లలు’ కంటే ఇది నిర్దిష్టం.
- source_word: אָהֳלִיבָמָה
  choice: అహొలీబామా
  rationale: హీబ్రూ వ్యక్తిపేరును తెలుగు లిపిలో ధ్వన్యనుసారంగా అందించింది.
- source_word: בַת עֲנָה בַּת צִבְעוֹן
  choice: అనాకు కుమార్తె, సిబ్యోనుకు కుమార్తె
  rationale: హీబ్రూలో ‘కుమార్తె’ రెండుసార్లు ఉండటాన్ని అలాగే ఉంచి, వంశసంబంధ నిర్మాణాన్ని ‘మనుమరాలు’ అని సవరించకుండా సంరక్షిస్తుంది.
- source_word: אֵשֶׁת עֵשָׂו
  choice: ఏశావు భార్య
  rationale: సంబంధాన్ని తెలుగులో సహజమైన షష్ఠీ నిర్మాణంతో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: וַ/תֵּלֶד לְ/עֵשָׂו
  choice: ఆమె ఏశావుకు ... కనింది
  rationale: לְ సూచించే సంబంధభావాన్ని ‘ఏశావుకు’ ద్వారా నిలుపుతూ, ילד క్రియను సహజమైన తెలుగు ప్రసవవ్యక్తీకరణతో అందిస్తుంది.
- source_word: יעיש
  choice: యెయూషు
  rationale: హీబ్రూ వ్యక్తిపేరుకు తెలుగు ధ్వన్యంతరీకరణ.
- source_word: יַעְלָם
  choice: యాలాము
  rationale: హీబ్రూ వ్యక్తిపేరుకు తెలుగు ధ్వన్యంతరీకరణ.
- source_word: קֹרַח
  choice: కోరహు
  rationale: హీబ్రూ వ్యక్తిపేరుకు తెలుగు ధ్వన్యంతరీకరణ.
