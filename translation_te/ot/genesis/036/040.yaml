id: GEN.36.40
reference: Genesis 36:40
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ֠/אֵלֶּה שְׁמ֞וֹת אַלּוּפֵ֤י עֵשָׂו֙ לְ/מִשְׁפְּחֹתָ֔/ם לִ/מְקֹמֹתָ֖/ם בִּ/שְׁמֹתָ֑/ם אַלּ֥וּף תִּמְנָ֛ע אַלּ֥וּף עַֽלְוָ֖ה אַלּ֥וּף יְתֵֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/040.yaml
  text: 'And these are the names of the chiefs of Esau[a], according to their clans, according to their places, by their names: Chief Timna, Chief Alvah[b], Chief Jetheth.'
translation:
  language: te
  text: 'ఏశావు గోత్రనాయకుల పేర్లు ఇవి—వారి వంశాల ప్రకారం, వారి స్థలాల ప్రకారం, వారి పేర్ల చొప్పున: గోత్రనాయకుడు తిమ్నా[a], గోత్రనాయకుడు అల్వా[b], గోత్రనాయకుడు యెతేతు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: తిమ్నా అనే పేరును ‘తిమ్నాహ్’ అని కూడా లిప్యంతరీకరించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో ‘అల్వా’; 1 దినవృత్తాంతాలు 1:51లోని సంబంధిత పేరు ‘అల్యా’తో పోల్చండి.
    reason: cross_reference
lexical_decisions:
- source_word: וְאֵלֶּה שְׁמוֹת
  choice: పేర్లు ఇవి
  rationale: జాబితాను పరిచయం చేసే హీబ్రూ పదబంధాన్ని సహజమైన ఆధునిక తెలుగు క్రమంలో అందిస్తుంది; וְ యొక్క అనుసంధాన భావం సందర్భంలో కొనసాగింపుగా నిలుస్తుంది.
- source_word: אַלּוּפֵי / אַלּוּף
  choice: గోత్రనాయకులు / గోత్రనాయకుడు
  rationale: ఆదికాండం 36లో ఈ పదం ఎదోము గోత్ర లేదా వంశ నాయకులను సూచిస్తుంది. ‘ప్రభువు’ లేదా ‘అధిపతి’ కంటే ‘గోత్రనాయకుడు’ సామాజిక సందర్భాన్ని స్పష్టంగా తెలియజేస్తుంది; తరువాతి ప్రతి పేరుకు బిరుదును పునరావృతం చేస్తుంది.
- source_word: עֵשָׂו
  choice: ఏశావు
  rationale: తెలుగులో స్థిరపడిన బైబిలు పేరు రూపం.
- source_word: לְמִשְׁפְּחֹתָם
  choice: వారి వంశాల ప్రకారం
  rationale: מִשְׁפָּחָה ఇక్కడ ఇంటి కుటుంబం కంటే విస్తృతమైన వంశ లేదా గోత్ర విభాగాన్ని సూచిస్తుంది; ‘వంశాలు’ సాధారణ పాఠకులకు సహజంగా ఉంటుంది.
- source_word: לִמְקֹמֹתָם
  choice: వారి స్థలాల ప్రకారం
  rationale: מָקוֹם అనే పదానికి ఉన్న ‘స్థలం’ అనే మౌలిక భావాన్ని కాపాడుతుంది; దాన్ని ‘నివాసాలు’ లేదా ‘ప్రాంతాలు’ అని అతిగా నిర్దిష్టం చేయదు.
- source_word: בִּשְׁמֹתָם
  choice: వారి పేర్ల చొప్పున
  rationale: నాయకులు పేరుపేరున జాబితా చేయబడుతున్నారనే వర్గీకరణ భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: תִּמְנָע
  choice: తిమ్నా
  rationale: హీబ్రూ పేరుకు సమీపమైన, తెలుగులో సులభంగా చదవగల లిప్యంతరీకరణ.
- source_word: עַלְוָה
  choice: అల్వా
  rationale: మసొరేటిక్ పాఠంలోని עַלְוָה రూపాన్నే అనుసరిస్తుంది; 1 దినవృత్తాంతాలు 1:51లోని సంబంధిత రూపంతో సమన్వయం చేయదు.
- source_word: יְתֵת
  choice: యతేతు
  rationale: ఈ వచనంలోని హీబ్రూ రూపాన్ని తెలుగులో పలకదగిన విధంగా లిప్యంతరీకరిస్తుంది; పోలికగల ఇతర పేర్లతో సమన్వయం చేయదు.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, జాబితా శైలికి తగిన గంభీరతతో రూపొందించబడింది. మూలంలోని పునరావృత నిర్మాణాన్ని నిలుపుతూ ప్రతి పేరుకు ‘గోత్రనాయకుడు’ అనే బిరుదును ఉంచింది. ఆంగ్ల సంప్రదింపు పాఠంలో [a] సూచిక ఏశావు తరువాత ఉన్నప్పటికీ, దాని పాదటిప్పణి తిమ్నా పేరుకు సంబంధించినందున సూచికను తిమ్నా తరువాత ఉంచాం.
