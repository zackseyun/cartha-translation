  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּמָת֮ בַּ֣עַל חָנָ֣ן בֶּן עַכְבּוֹר֒ וַ/יִּמְלֹ֤ךְ תַּחְתָּי/ו֙ הֲדַ֔ר וְ/שֵׁ֥ם עִיר֖/וֹ פָּ֑עוּ וְ/שֵׁ֨ם אִשְׁתּ֤/וֹ מְהֵֽיטַבְאֵל֙ בַּת מַטְרֵ֔ד בַּ֖ת מֵ֥י זָהָֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/039.yaml
  text: Baal-hanan son of Achbor died[a], and Hadar reigned in his place. The name of his city was Pau, and the name of his wife was Mehetabel daughter of Matred[c][b], daughter of Me-zahab.
translation:
  language: te
  text: అక్బోరు కుమారుడైన బయల్-హానాను చనిపోయాడు. అతని స్థానంలో హదరు[a] రాజుగా పరిపాలించాడు. అతని పట్టణం పేరు పావు[b]. అతని భార్య పేరు మెహేతబేలు; ఆమె మే-జాహాబు కుమార్తె అయిన మత్రేదు కుమార్తె.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పాఠంలో ‘హదరు’; కొన్ని పాఠ సంప్రదాయాల్లోనూ 1 దినవృత్తాంతాలు 1:50లోనూ ‘హదదు’ అని ఉంది.
    reason: textual_variant
  - marker: b
    text: హీబ్రూ పాఠంలో ‘పావు’; 1 దినవృత్తాంతాలు 1:50లో ‘పై’ అని ఉంది.
    reason: textual_variant
  - marker: c
    text: మూలంలోని వంశవివరణను మరింత అక్షరానుసారంగా, ‘మత్రేదు కుమార్తె, మే-జాహాబు కుమార్తె’ అని అనువదించవచ్చు.
    reason: genealogical_syntax
lexical_decisions:
- source_word: וַיָּמָת
  choice: చనిపోయాడు
  rationale: מות క్రియకు సందర్భానుసారమైన సూటి, సాధారణ తెలుగు సమానం; అనవసరమైన మర్యాదోక్తిని నివారిస్తుంది.
- source_word: בַּעַל חָנָן בֶּן עַכְבּוֹר
  choice: అక్బోరు కుమారుడైన బయల్-హానాను
  rationale: వ్యక్తిపేర్లను తెలుగు ధ్వన్యనుకరణలో ఉంచి, בֶּן అనే వంశసంబంధాన్ని సహజమైన తెలుగు నిర్మాణంతో వ్యక్తం చేసింది.
- source_word: וַיִּמְלֹךְ תַּחְתָּיו
  choice: అతని స్థానంలో ... రాజ్యపాలన చేశాడు
  rationale: מלך యొక్క ‘రాజుగా పాలించు’ భావాన్నీ, תחתיו యొక్క వారసత్వ స్థాన భావాన్నీ స్పష్టంగా అందిస్తుంది.
- source_word: הֲדַר
  choice: హదరు
  rationale: WLC మసొరేటిక్ పాఠంలోని హదర్ రూపాన్ని అనుసరిస్తుంది; హదద్ అనే పాఠాంతరాన్ని పాదసూచికలో ఉంచింది.
- source_word: פָּעוּ
  choice: పావు
  rationale: మసొరేటిక్ స్వరచిహ్నాల ప్రకారం స్థలనామాన్ని ధ్వన్యనుకరించింది; సమాంతర పాఠంలోని పై రూపాన్ని పాదసూచికలో తెలిపింది.
- source_word: מְהֵיטַבְאֵל בַּת מַטְרֵד בַּת מֵי זָהָב
  choice: మెహేతబేలు; ఆమె మత్రేదు కుమార్తె, మత్రేదు మే-జాహాబు కుమార్తె
  rationale: పునరుక్త בַּת నిర్మాణంలోని వంశక్రమాన్ని తెలుగులో అపార్థం రాకుండా వెల్లడిస్తూ, మూలంలోని రెండు ‘కుమార్తె’ సంబంధాలనూ నిలుపుతుంది.
