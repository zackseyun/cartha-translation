translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన చారిత్రక కథనశైలి. పేర్లకు తెలుగు ఉచ్చారణకు అనుకూలమైన రూపాలు వాడబడ్డాయి. వంశక్రమంలోని సంభావ్య వ్యాకరణ అస్పష్టతను ప్రధాన పాఠంలో సహజంగా స్పష్టం చేసి, అక్షరానుసార రూపాన్ని పాదసూచికలో భద్రపరిచింది.
