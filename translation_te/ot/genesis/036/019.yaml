id: GEN.36.19
reference: Genesis 36:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אֵ֧לֶּה בְנֵי עֵשָׂ֛ו וְ/אֵ֥לֶּה אַלּוּפֵי/הֶ֖ם ה֥וּא אֱדֽוֹם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/019.yaml
  text: These are the sons of Esau[a], and these are their chiefs. He is Edom.
translation:
  language: te
  text: వీరు ఏశావు కుమారులు; వీరు వారి వంశాధిపతులు.[a] అతడే ఎదోము.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారి గోత్ర నాయకులు.” ఇక్కడి హెబ్రీ పదం ఎదోములోని వంశాల లేదా గోత్రాల అధిపతులను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: వీరు
  rationale: క్రియలేని హెబ్రీ పరిచయ సూత్రాన్ని సహజమైన తెలుగు వర్తమాన రూపంలో వ్యక్తం చేస్తుంది; ఇక్కడ సూచించబడుతున్నవారు వ్యక్తులు.
- source_word: בְנֵי
  choice: కుమారులు
  rationale: ఈ వంశావళి సందర్భంలో పురుష సంతానాన్ని నిర్దిష్టంగా సూచిస్తుంది.
- source_word: עֵשָׂו
  choice: ఏశావు
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: וְאֵלֶּה
  choice: వీరు
  rationale: మొదటి గుర్తింపు వాక్యంతో ఉన్న హెబ్రీ సమాంతర నిర్మాణాన్ని తెలుగులో పునరావృతం చేస్తుంది; విరామచిహ్నం సంధాన భావాన్ని తెలియజేస్తుంది.
- source_word: אַלּוּפֵיהֶם
  choice: వారి వంశాధిపతులు
  rationale: ఎదోము సమాజంలోని వంశ లేదా గోత్ర సమూహాల అధిపతులను సూచించే సామాజిక-రాజకీయ భావాన్ని నిలుపుతుంది.
- source_word: הוּא
  choice: అతడే
  rationale: సర్వనామం ఏశావును తిరిగి సూచిస్తూ అతనిని ఎదోముతో నేరుగా గుర్తిస్తుంది; ‘-ఏ’ ఆ గుర్తింపును స్పష్టం చేస్తుంది.
- source_word: אֱדוֹם
  choice: ఎదోము
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన నామరూపం; సందర్భంలో ఏశావును ఎదోము ప్రజల మూలపురుషునిగా గుర్తిస్తుంది.
theological_decisions:
- issue: הוּא אֱדוֹם లో ఏశావు–ఎదోము గుర్తింపు
  choice: అతడే ఎదోము
  alternative: అంటే ఎదోము
  rationale: హెబ్రీ వాక్యంలోని వ్యక్తిగత, ప్రత్యక్ష గుర్తింపును వివరణాత్మక సమానార్థక వాక్యంగా మార్చకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన వంశావళి శైలిని అనుసరించాం. హెబ్రీ సమాంతర నిర్మాణాన్ని నిలుపుతూ, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన పదజాలాన్ని ఉపయోగించాం.
