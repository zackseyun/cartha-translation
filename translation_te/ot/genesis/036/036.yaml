  yaml_path: translation/ot/genesis/036/036.yaml
  text: And Hadad died[a], and Samlah from Masrekah reigned in his place.
translation:
  language: te
  text: హదదు చనిపోయాడు. అతని స్థానంలో మస్రేకాకు చెందిన[a] సమ్లా రాజయ్యాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మస్రేకా నుండి వచ్చిన.” హీబ్రూ ఉపసర్గ ఒక స్థల మూలాన్ని గానీ, ఆ స్థలంతో అనుబంధాన్ని గానీ సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: చనిపోయాడు
  rationale: מות క్రియ యొక్క వయ్యిక్తోల్ రూపం కథనంలోని తదుపరి సంఘటనను సూచిస్తుంది; ఆధునిక ప్రామాణిక తెలుగులో ‘చనిపోయాడు’ సహజమైన, స్పష్టమైన అనువాదం.
- source_word: הֲדָד
  choice: హదదు
  rationale: వ్యక్తి పేరును హీబ్రూ ఉచ్చారణకు సమీపంగా లిప్యంతరీకరించాం.
- source_word: וַיִּמְלֹךְ
  choice: రాజయ్యాడు
  rationale: ఈ రాజవంశ వారసత్వ సూత్రంలో מלך కొత్త వ్యక్తి రాజపదవిని చేపట్టడాన్ని తెలియజేస్తుంది; ‘రాజయ్యాడు’ సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: תַּחְתָּיו
  choice: అతని స్థానంలో
  rationale: תחתיו ఇక్కడ కేవలం కాలక్రమాన్ని కాక, మరొకరి స్థానాన్ని స్వీకరించిన వారసత్వ భావాన్ని సూచిస్తుంది.
- source_word: שַׂמְלָה
  choice: సమ్లా
  rationale: వ్యక్తి పేరును హీబ్రూ రూపానికి సమీపంగా లిప్యంతరీకరించాం.
- source_word: מִמַּשְׂרֵקָה
  choice: మశ్రేకాకు చెందిన
  rationale: מן ఉపసర్గ స్థల మూలాన్ని లేదా ఆ స్థలంతో అనుబంధాన్ని సూచించగలదు. తెలుగులో ‘చెందిన’ ఈ రెండవ, విస్తృత అనుబంధ భావాన్ని సహజంగా తెలియజేస్తుంది; ‘మశ్రేకా నుండి వచ్చిన’ అనేది సాధ్యమైన ప్రత్యామ్నాయం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన రాజవంశ వారసత్వ శైలిని ఉపయోగించాం. హీబ్రూ వాక్యంలోని వరుస ‘మరియు’ నిర్మాణాలను తెలుగు సహజ కథన శైలికి అనుగుణంగా రెండు వాక్యాలుగా ఇచ్చాం.
