translation_notes:
  register: సంక్షిప్తమైన వంశావళి శైలిని నిలుపుతూ, ఆధునిక ప్రామాణిక తెలుగులో సహజమైన నామవాచక వాక్య నిర్మాణాన్ని వాడాం. ‘లోటాను’ అనే రూపానికి విభక్తి ప్రత్యయాన్ని జోడించకుండా ‘లోటాను కుమారులు/సహోదరి’ అని ఉంచడం ద్వారా పేరును స్పష్టంగా నిలిపాం.
