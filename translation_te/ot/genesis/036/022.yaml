lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: కుమారులు ...
  rationale: వంశావళి సందర్భంలో היה రూపం సాధారణ సంబంధాన్ని తెలియజేస్తుంది. తెలుగులో నామవాచక వాక్యానికి ‘ఉన్నారు/అయ్యారు’ వంటి క్రియను చేర్చకుండా సహజంగా వ్యక్తపరచవచ్చు.
- source_word: בְנֵי
  choice: కుమారులు
  rationale: ఇక్కడ ఇద్దరు పురుషుల పేర్లు రావడం వల్ల విస్తృతార్థంలోని ‘సంతానం’ కంటే ‘కుమారులు’ ఖచ్చితమైనది.
- source_word: לוֹטָן
  choice: లోటాను
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగులో ఉచ్చారణకు అనుకూలంగా లిప్యంతరీకరించాం.
- source_word: חֹרִי
  choice: హోరీ
  rationale: వ్యక్తినామాన్ని అనువదించకుండా హీబ్రూ రూపానికి దగ్గరగా లిప్యంతరీకరించాం.
- source_word: הֵימָם
  choice: హేమాము
  rationale: ఈ వచనంలోని మసోరా స్వరచిహ్నాలతో కూడిన హీబ్రూ రూపాన్ని అనుసరించాం; సమాంతర వంశావళిలోని భిన్న రూపాన్ని పాదసూచికలో తెలిపాం.
- source_word: וַאֲחוֹת
  choice: సహోదరి
  rationale: ‘సోదరి’ అనే బంధాన్ని స్పష్టంగా, ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదంగా తెలిపే పదాన్ని ఎంచుకున్నాం.
- source_word: תִּמְנָע
  choice: తిమ్నా
  rationale: ఈ వ్యక్తినామాన్ని హీబ్రూ స్వరరూపానికి దగ్గరగా లిప్యంతరీకరించాం.
