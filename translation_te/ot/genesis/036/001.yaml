id: GEN.36.1
reference: Genesis 36:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אֵ֛לֶּה תֹּלְד֥וֹת עֵשָׂ֖ו ה֥וּא אֱדֽוֹם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/001.yaml
  text: These are the generations of Esau (that is[a], Edom).
translation:
  language: te
  text: ఏశావు వంశవృత్తాంతం ఇదే; అతడే ఎదోము.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఏశావు వంశవృత్తాంతం ఇదే (అంటే, ఎదోము).”
    reason: హెబ్రీ הוּא అనే సర్వనామాన్ని ప్రత్యక్షంగా ‘అతడే’ అని లేదా వివరణాత్మకంగా ‘అంటే’ అని అన్వయించవచ్చు.
lexical_decisions:
- source_word: וְ/אֵלֶּה
  choice: ఇదే
  rationale: వావ్‌తో కూడిన నిర్దేశక పదం కొత్త విభాగాన్ని పరిచయం చేస్తుంది. తెలుగులో సహజమైన శీర్షిక వాక్య నిర్మాణం కోసం చివరలో ‘ఇదే’ అని ఇచ్చాం; సందర్భంలో లేని కాలార్థక ‘ఇప్పుడు’ను చేర్చలేదు.
- source_word: תֹּלְדֹוֹת
  choice: వంశవృత్తాంతం
  rationale: ఈ పదం ఆదికాండంలోని పునరావృత నిర్మాణ సూత్రం. ‘వంశవృత్తాంతం’ అనేది సంతానాన్ని మాత్రమే గానీ కథనాన్ని మాత్రమే గానీ సూచించేలా అర్థాన్ని కుదించకుండా, వంశక్రమం మరియు దానికి సంబంధించిన వృత్తాంతం రెండింటినీ మోయగలదు.
- source_word: עֵשָׂו
  choice: ఏశావు
  rationale: తెలుగు బైబిలు వాడుకలో సుపరిచితమైన వ్యక్తినామ రూపాన్ని నిలిపాం.
- source_word: הוּא
  choice: ఇతడే
  rationale: మూలంలోని స్వతంత్ర సర్వనామం ఏశావును ఎదోముతో బలంగా గుర్తిస్తుంది. వివరణాత్మక ‘అంటే’గా మాత్రమే మార్చకుండా, ‘ఇతడే’ అని ప్రత్యక్ష గుర్తింపును నిలిపాం.
- source_word: אֱדוֹם
  choice: ఎదోము
  rationale: ఏశావుతో గుర్తింపబడే వ్యక్తి/జాతి నామాన్ని తెలుగు బైబిలు సంప్రదాయంలోని సుపరిచిత రూపంలో ఇచ్చాం.
theological_decisions:
- issue: ఆదికాండ నిర్మాణ పదమైన תֹּלְדֹוֹת అనువాదం
  choice: వంశవృత్తాంతం
  alternative: వంశావళి; సంతతి; వృత్తాంతం
  rationale: ఈ పదాన్ని కేవలం పేర్ల జాబితా, జీవసంబంధ సంతానం, లేదా కథనం అనే ఒక్క భావానికి పరిమితం చేయకుండా ఆదికాండంలోని విభాగ శీర్షికగా దాని విస్తృతార్థాన్ని నిలిపాం.
- issue: הוּא אֱדוֹם లోని గుర్తింపు సంబంధం
  choice: ఇతడే ఎదోము
  alternative: అంటే, ఎదోము
  rationale: మూల వాక్యం వివరణాత్మక అన్వయంగా అర్థం కావచ్చు; అయితే దాని అక్షరార్థమైన గుర్తింపు వాక్యాన్ని ప్రధాన పాఠ్యంలో ఉంచి, సహజమైన వివరణాత్మక రూపాన్ని పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ఆదికాండంలోని పునరావృత విభాగ సూత్రాన్ని గుర్తించగలిగేలా ‘వంశవృత్తాంతం’ను ఎంచుకున్నాం. పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో చేర్చబడింది.
