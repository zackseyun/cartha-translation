    reason: lexical_alternative
lexical_decisions:
- source_word: אַלּוּף
  choice: నాయకుడు
  rationale: ఆదికాండం 36లో ఈ పదం ఎదోము వంశం లేదా గోత్ర సమూహానికి అధిపతిని సూచిస్తుంది. పునరావృత జాబితి శైలిలో ‘నాయకుడు’ సహజంగా, సంక్షిప్తంగా ఉంటుంది; ‘వంశ నాయకుడు’ అనేది సందర్భాన్ని మరింత స్పష్టం చేసే సాధ్యమైన ప్రత్యామ్నాయం.
- source_word: קְנַז
  choice: కెనజు
  rationale: ఇది వ్యక్తి లేదా వంశనామంగా పనిచేస్తున్నందున అర్థానువాదం చేయకుండా హీబ్రూ ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించబడింది.
- source_word: תֵּימָן
  choice: తేమాను
  rationale: ఈ రూపానికి ‘దక్షిణం’ అనే పదసంబంధం ఉన్నప్పటికీ ఇక్కడ అది పేరుగా ఉంది; అందువల్ల లిప్యంతరీకరించబడింది.
- source_word: מִבְצָר
  choice: మిబ్సారు
  rationale: ఇది పేరుగా ఉన్నందున అనువదించకుండా, హీబ్రూ צ ధ్వనిని ‘త్స’కు సమీపంగా చూపిస్తూ లిప్యంతరీకరించబడింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళి జాబితికి తగిన సంక్షిప్తమైన, గౌరవప్రదమైన శైలి పాటించబడింది. మూలంలోని పదపునరావృతం నిలుపబడింది.
