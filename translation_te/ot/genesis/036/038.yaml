lexical_decisions:
- source_word: וַיָּמָת
  choice: చనిపోయాడు
  rationale: מות అనే క్రియ యొక్క సాధారణ కథనరూపానికి ఇది సూటిగా, సహజంగా ఉండే తెలుగు సమానార్థకం; మరణాన్ని మృదూకరించే పదప్రయోగాన్ని నివారిస్తుంది.
- source_word: שָׁאוּל
  choice: షావూలు
  rationale: హీబ్రూ పేరులోని ష ధ్వనిని, దీర్ఘ ఊ స్వరాన్ని ప్రతిబింబించే తెలుగు లిప్యంతరీకరణ.
- source_word: וַיִּמְלֹךְ
  choice: రాజయ్యాడు
  rationale: రాజవంశ వారసత్వ సందర్భంలో מלך అంటే రాజుగా అధికారంలోకి రావడం; ఆధునిక తెలుగులో ‘రాజయ్యాడు’ సంక్షిప్తంగా, సహజంగా ఉంది.
- source_word: תַּחְתָּיו
  choice: అతని స్థానంలో
  rationale: ముందున్న రాజు స్థానాన్ని మరొకరు చేపట్టిన వారసత్వ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: בַּעַל חָנָן
  choice: బయల్-హానాను
  rationale: రెండు భాగాల హీబ్రూ వ్యక్తినామాన్ని పాఠకులకు స్పష్టంగా ఉండేలా సంధిరేఖతో లిప్యంతరీకరించింది.
- source_word: בֶּן
  choice: కుమారుడు
  rationale: నిర్మాణ సంబంధంలో ప్రత్యక్ష పుత్రత్వాన్ని సూచించే సాధారణ తెలుగు పదం.
- source_word: עַכְבּוֹר
  choice: అక్బోరు
  rationale: హీబ్రూ పేరును తెలుగులో చదవదగిన విధంగా దగ్గరగా లిప్యంతరీకరించింది; సంప్రదాయ రూపాల్లో కనిపించే ‘ఖ్/చ’ ధ్వనిని మూలపాఠం నిర్బంధించదు.
