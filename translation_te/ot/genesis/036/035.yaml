  to: హూషాము మరణించాడు. అతని స్థానంలో బెదదు కుమారుడైన హదదు రాజుగా పరిపాలించాడు. ఇతడు మోయాబు ప్రాంతంలో[b] మిద్యానును దెబ్బతీశాడు[a]. అతని పట్టణం పేరు అవ్వీతు.
