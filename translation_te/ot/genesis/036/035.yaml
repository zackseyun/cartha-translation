translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన చారిత్రక వృత్తాంత శైలిని ఉపయోగించాం. హెబ్రీ వాక్యంలోని వరుస సంఘటనలను తెలుగులో స్పష్టత కోసం చిన్న వాక్యాలుగా విభజించాం. ‘దెబ్బతీశాడు’ అనే పదంతో మూలంలోని చర్యను ఉంచి, అది తప్పనిసరిగా సంపూర్ణ విజయాన్నే సూచిస్తుందని నిర్ణయించలేదు.
