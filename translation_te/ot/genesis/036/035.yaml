  text: וַ/יָּ֖מָת חֻשָׁ֑ם וַ/יִּמְלֹ֨ךְ תַּחְתָּ֜י/ו הֲדַ֣ד בֶּן בְּדַ֗ד הַ/מַּכֶּ֤ה אֶת מִדְיָן֙ בִּ/שְׂדֵ֣ה מוֹאָ֔ב וְ/שֵׁ֥ם עִיר֖/וֹ עֲוִֽית־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/035.yaml
  text: And Husham died[a], and Hadad son of Bedad reigned in his place, who struck Midian in the field of Moab[b]; and the name of his city was Avith.
translation:
  language: te
  text: హూషాము మరణించాడు. అతని స్థానంలో బెదదు కుమారుడైన హదదు రాజుగా పరిపాలించాడు. ఇతడు మోయాబు ప్రాంతంలో[b] మిద్యానును దెబ్బతీశాడు[a]. అతని పట్టణం పేరు అవ్వీతు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘దెబ్బతీశాడు’ అనే చోట ‘ఓడించాడు’ అని కూడా అనువదించవచ్చు. హెబ్రీలో అక్షరార్థంగా ‘మిద్యానును దెబ్బతీసినవాడు’ అని ఉంది.
    reason: lexical_alternative
  - marker: b
    text: ‘మోయాబు ప్రాంతం’ అనే హెబ్రీ మాటను అక్షరార్థంగా ‘మోయాబు పొలం’ అని అనువదించవచ్చు; అది మోయాబు దేశం లేదా భూభాగం అనే విస్తృత అర్థాన్నీ ఇవ్వగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: చనిపోయాడు
  rationale: מות అనే క్రియ మరణాన్ని సూటిగా సూచిస్తుంది. తెలుగు వాడుకలో సహజంగా, ఎలాంటి సభ్యోక్తి లేకుండా అర్థాన్ని తెలియజేయడానికి ‘చనిపోయాడు’ ఎంచుకోబడింది.
- source_word: וַיִּמְלֹךְ תַּחְתָּיו
  choice: అతని స్థానంలో … రాజయ్యాడు
  rationale: מלך రాజుగా ఉండడం లేదా పరిపాలించడం అనే భావాన్నీ, תחתיו రాజ్య వారసత్వంలో అతని స్థానాన్ని చేపట్టడం అనే భావాన్నీ సూచిస్తుంది. ఈ తెలుగు రూపం రెండింటినీ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: הֲדַד בֶּן בְּדַד
  choice: బెదదు కుమారుడైన హదదు
  rationale: వ్యక్తుల పేర్లు తెలుగు లిపిలో మూల ఉచ్చారణకు సమీపంగా లిప్యంతరీకరించబడ్డాయి; בן సంబంధాన్ని ‘కుమారుడైన’ అని వ్యక్తం చేశాం.
- source_word: הַמַּכֶּה
  choice: దెబ్బతీశాడు
  rationale: נכה హిఫిల్ రూపం కొట్టడం లేదా దెబ్బతీయడం అనే విస్తృత భావాన్ని కలిగి ఉంది. ‘ఓడించాడు’ అని ఫలితాన్ని మరీ నిర్దిష్టం చేయకుండా, మూలంలోని భావ విస్తృతిని ‘దెబ్బతీశాడు’ నిలుపుతుంది. హెబ్రీ భాగవాచకాన్ని సహజ తెలుగు వాక్య నిర్మాణం కోసం సమాపక క్రియగా మార్చాం.
- source_word: אֶת מִדְיָן
  choice: మిద్యానును
  rationale: మూలంలో ఉన్న మిద్యాను అనే సొంత పేరునే ఉంచాం. ‘మిద్యానీయులను’ అని విస్తరించడం సందర్భానుసారమైన వివరణ అవుతుంది.
- source_word: בִּשְׂדֵה מוֹאָב
  choice: మోయాబు ప్రాంతంలో
  rationale: שׂדה ప్రాథమికంగా పొలం లేదా బహిరంగ భూమిని సూచించినా, భౌగోళిక సందర్భంలో దేశం లేదా భూభాగం అనే విస్తృత అర్థం కలిగి ఉంటుంది. ఆధునిక తెలుగులో సహజంగా ఉండేందుకు ‘ప్రాంతంలో’ వాడి, అక్షరార్థాన్ని పాదసూచికలో తెలిపాం.
- source_word: וְשֵׁם עִירוֹ
  choice: అతని పట్టణం పేరు
  rationale: ఇది స్థలపేరును తెలిపే సాధారణ హెబ్రీ సూత్రప్రయోగం. ‘అతని పట్టణం పేరు’ తెలుగులో స్పష్టంగా, సహజంగా ఉంది.
- source_word: עֲוִית
  choice: అవీతు
  rationale: స్థలపేరును హెబ్రీ వ్యంజన, స్వర రూపానికి సమీపంగా తెలుగు లిపిలో లిప్యంతరీకరించాం.
