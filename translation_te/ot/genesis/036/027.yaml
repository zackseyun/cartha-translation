  yaml_path: translation/ot/genesis/036/027.yaml
  text: 'These are the sons of Etser: Bilhan, Zaavan, and Akan.'
translation:
  language: te
  text: 'ఏత్సెరు కుమారులు వీరే: బిల్హాను, జావాను, అకాను.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵצֶר
  choice: ఏచెరు
  rationale: హీబ్రూ పేరులోని צ ధ్వనిని ‘చ’తో సూచిస్తూ, పేర్లకు సహజమైన తెలుగు అంత్యస్వరాన్ని చేర్చాం.
- source_word: בִּלְהָן
  choice: బిల్హాను
  rationale: హీబ్రూ వ్యక్తిపేరును ధ్వన్యనుసారంగా తెలుగులో లిప్యంతరీకరించాం.
- source_word: זַעֲוָן
  choice: జవాను
  rationale: హీబ్రూ పేరులోని వ్యంజన క్రమాన్ని సాధ్యమైనంత దగ్గరగా ఉంచి, సులభంగా చదవగల తెలుగు రూపాన్ని ఎంచుకున్నాం.
- source_word: עֲקָן
  choice: అకాను
  rationale: ఆదిలోని עకు ప్రత్యేక తెలుగు సమానం లేనందున ‘అ’తో, మిగిలిన పేరును ధ్వన్యనుసారంగా ఇచ్చాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళి శైలికి తగిన సంక్షిప్తమైన గౌరవప్రద వాక్య నిర్మాణం. మూలంలోని ‘వీరే’ అనే సూచనాత్మక బలాన్ని నిలిపాం.
