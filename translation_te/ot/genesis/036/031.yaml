  text: These are the kings who reigned in the land of Edom before a king reigned over the sons of Israel[a].
translation:
  language: te
  text: ఇశ్రాయేలీయులపై ఒక రాజు పరిపాలించకముందు ఎదోము దేశంలో పరిపాలించిన రాజులు వీరే.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఇశ్రాయేలు కుమారులకు ఒక రాజు పరిపాలించకముందు.” హీబ్రూలో పదశఃగా “ఇశ్రాయేలు కుమారులకు” అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: వీరే
  rationale: కొత్త జాబితాను పరిచయం చేసే హీబ్రూ సమర్పణ భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; ప్రారంభ సంధాయకాన్ని ప్రత్యేకంగా అనువదించకపోయినా భావం నిలుస్తుంది.
- source_word: הַמְּלָכִים
  choice: రాజులు
  rationale: హీబ్రూలోని నిర్దిష్టతను ‘వీరే’ అనే సమర్పణ నిర్మాణం తెలుగులో తగినంతగా తెలియజేస్తుంది.
- source_word: אֲשֶׁר מָלְכוּ
  choice: పరిపాలించిన
  rationale: מלך అనే క్రియ ఇక్కడ రాజుగా పాలించడం అనే అర్థంలో ఉంది; ఆధునిక ప్రామాణిక తెలుగులో ‘పరిపాలించిన’ సహజమైన, గౌరవప్రదమైన పదం.
- source_word: בְּאֶרֶץ אֱדוֹם
  choice: ఎదోము దేశంలో
  rationale: హీబ్రూలో స్పష్టంగా ఉన్న ‘ఎదోము దేశం’ అనే ప్రాదేశిక భావాన్ని నిలుపుతుంది.
- source_word: לִפְנֵי
  choice: ముందు
  rationale: ఇక్కడ స్పష్టమైన కాలసంబంధమైన పూర్వత్వాన్ని సూచిస్తుంది.
- source_word: מְלָךְ מֶלֶךְ
  choice: ఒక రాజు పరిపాలించకముందు
  rationale: హీబ్రూ ఏకవచనమైన ‘రాజు’ను నేరుగా నిలుపుతూ, తెలుగులో కాలవాక్యంగా సహజంగా ఉంటుంది; ‘ఏ రాజైనా’ అనే అదనపు సాధారణీకరణను చేర్చదు.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులపై
  rationale: בני ישראל ఇక్కడ ఇశ్రాయేలు ప్రజలను సూచించే స్థిర జాతినామం. ‘ఇశ్రాయేలు కుమారులు’ అనే పదశః రూపం తెలుగులో పురుష సంతానానికే పరిమితమైన భావం కలిగించవచ్చు; ‘ఇశ్రాయేలీయులు’ మొత్తం ప్రజాసమూహాన్ని సహజంగా సూచిస్తుంది. ‘పై’ రాజపాలన సంబంధాన్ని తెలియజేస్తుంది.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל పదబంధం
  choice: ఇశ్రాయేలీయులు
  alternative: ఇశ్రాయేలు కుమారులు
  rationale: ఇది సందర్భంలో మొత్తం ఇశ్రాయేలు ప్రజలకు జాతినామంగా వాడబడింది. తెలుగులో ‘ఇశ్రాయేలీయులు’ ఆ భావాన్ని తప్పుదారి పట్టించకుండా అందిస్తుంది; ప్రత్యామ్నాయ పదశః రూపాన్ని పాదసూచికలో నమోదు చేశాం.
- issue: לִבְנֵי అనే సంబంధం
  choice: ఇశ్రాయేలీయులపై
  alternative: ఇశ్రాయేలీయుల కోసం / ఇశ్రాయేలు కుమారులకు
  rationale: రాజు ‘పరిపాలించడం’ అనే సందర్భంలో ‘పై’ పాలనా సంబంధాన్ని సహజంగా వ్యక్తం చేస్తుంది. అయితే హీబ్రూ לְ సంబంధంలోని స్వల్ప విస్తృతిని పాదసూచికలో పదశః రూపంతో సంరక్షించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. జాబితా పరిచయానికి ‘వీరే’ ఉపయోగించబడింది. ‘ఇశ్రాయేలీయులు’ అనే ప్రాచుర్యంలో ఉన్న జాతినామం ప్రధాన పాఠ్యంలో ఉంచి, హీబ్రూ పదశః రూపం మరియు לְ యొక్క సంబంధ విస్తృతిని పాదసూచికలో సంరక్షించాం.
