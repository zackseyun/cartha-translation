  text: 'And these were the sons of Anah: Dishon and Oholibamah daughter of Anah.'
translation:
  language: te
  text: 'అనా కుమారులు వీరు: దీషోను, అనా కుమార్తె ఒహొలీబామా.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְנֵי
  choice: కుమారులు
  rationale: హీబ్రూ పదానికి సాధారణ అర్థం ‘కుమారులు’. తరువాత స్త్రీ పేరు వచ్చినప్పటికీ, మూలపాఠంలోని రూపాన్ని అలాగే నిలిపి దాని ఉద్విగ్నతను సవరించలేదు.
- source_word: דִּשֹׁן
  choice: దీషోను
  rationale: హీబ్రూ వ్యక్తినామానికి దగ్గరగా ఉన్న తెలుగు లిప్యంతరీకరణ.
- source_word: אָהֳלִיבָמָה
  choice: అహొలీబామా
  rationale: హీబ్రూ వ్యక్తినామాన్ని సహజమైన తెలుగు అక్షరరూపంలో లిప్యంతరీకరించింది.
- source_word: בַּת עֲנָה
  choice: అనా కుమార్తె
  rationale: వంశావళి సంబంధాన్ని మూలపాఠం చెప్పిన విధంగానే స్పష్టంగా ఉంచింది.
theological_decisions:
- issue: ‘అనా కుమారులు’ అనే పరిచయంలో అహొలీబామా అనే కుమార్తెను చేర్చడం
  choice: మూలంలోని ‘కుమారులు’ అనే పదాన్ని నిలిపి, అహొలీబామాను ‘అనా కుమార్తె’గా పేర్కొనడం
  alternative: ‘అనా సంతానం’ అని లింగసమావేషకంగా అనువదించడం
  rationale: మూల హీబ్రూలోని బְנֵי (‘కుమారులు’) మరియు בַּת (‘కుమార్తె’) మధ్య ఉన్న నిజమైన పాఠ్య ఉద్విగ్నతను అనువాదంలో నిశ్శబ్దంగా తొలగించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; వంశావళికి తగిన సంక్షిప్త, గౌరవప్రదమైన వాక్యనిర్మాణం. పేర్లకు తెలుగు బైబిలు సంప్రదాయానికి అనుకూలమైన, హీబ్రూకు దగ్గర లిప్యంతరీకరణ వాడబడింది.
