  yaml_path: translation/ot/genesis/036/009.yaml
  text: And these are the generations of Esau[a], the father of Edom, in the hill country of Seir.
translation:
  language: te
  text: 'ఇక, సేయీరు పర్వత ప్రాంతంలో[a] ఉన్న ఎదోముకు తండ్రియైన ఏశావు వంశవివరాలు ఇవి:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “సేయీరు పర్వతం మీద”; లేదా “సేయీరు పర్వతాల్లో.”
    reason: హీబ్రూ בְּהַר అనే పదబంధం ఒక పర్వతాన్ని గానీ, పర్వతాల ప్రాంతాన్ని గానీ సూచించవచ్చు.
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: ఇక, … ఇవి
  rationale: వావ్ సూచించే ముందటి వచనంతోని అనుసంధానాన్ని ‘ఇక’ ద్వారా నిలిపి, పరిచయ సూత్రాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేసింది.
- source_word: תֹּלְדוֹת
  choice: వంశవివరాలు
  rationale: ఆదికాండంలో వంశం లేదా దాని చరిత్రను పరిచయం చేసే పునరావృత నిర్మాణ పదం. ‘తరాలు’ కంటే ‘వంశవివరాలు’ ఆధునిక తెలుగులో సహజంగా ఉండి, తరువాత వచ్చే వంశావళి విషయానికి సరిపోతుంది.
- source_word: עֵשָׂו
  choice: ఏశావు
  rationale: వ్యక్తి పేరును ప్రామాణిక తెలుగు బైబిలు రూపంలో లిప్యంతరీకరించింది.
- source_word: אֲבִי אֱדוֹם
  choice: ఎదోము మూలపురుషుడు
  rationale: ఇక్కడ ‘తండ్రి’ అనే పదం ప్రత్యక్ష పితృత్వం కంటే ఎదోము ప్రజల ఆదిపురుషుడనే భావాన్ని సూచిస్తుంది; అందువల్ల సాధారణ పాఠకునికి అపార్థం కలగకుండా ‘మూలపురుషుడు’ అని అనువదించింది.
- source_word: בְּהַר שֵׂעִיר
  choice: సేయీరు పర్వత ప్రాంతంలో
  rationale: הַר ఒకే శిఖరాన్నే కాక పర్వతమయ ప్రాంతాన్ని కూడా సూచించగలదు. భౌగోళిక సందర్భంలో ‘పర్వత ప్రాంతం’ సహజంగా ఉంది; ఇతర సాధ్యమైన అర్థాలను పాదసూచికలో ఉంచింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే వంశావళి పరిచయ శైలి. వచనం తరువాత జాబితాను పరిచయం చేస్తుంది కాబట్టి చివర ద్విబిందువు వాడబడింది.
