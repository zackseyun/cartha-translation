  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన శైలి. హీబ్రూ వాక్యంలో ప్రతి పేరుకు ముందు ఉన్న ‘నాయకుడు’ అనే పద పునరావృతిని పారదర్శకత కోసం నిలిపాం.
