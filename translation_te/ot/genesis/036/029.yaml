source:
  edition: WLC
  text: אֵ֖לֶּה אַלּוּפֵ֣י הַ/חֹרִ֑י אַלּ֤וּף לוֹטָן֙ אַלּ֣וּף שׁוֹבָ֔ל אַלּ֥וּף צִבְע֖וֹן אַלּ֥וּף עֲנָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/029.yaml
  text: 'These are the chiefs of the Horites: chief Lotan[a], chief Shobal, chief Zibeon, chief Anah.'
translation:
  language: te
  text: 'హోరీయుల నాయకులు వీరు: నాయకుడు లోటాను[a], నాయకుడు షోబాలు, నాయకుడు సిబ్యోను, నాయకుడు అనా.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘వంశాధిపతి’, ‘గోత్రాధిపతి’; హీబ్రూ పదం ఒక వంశానికి లేదా గోత్రానికి అధిపతిని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: వీరు
  rationale: జాబితాను పరిచయం చేసే బహువచన సూచన సర్వనామం; వ్యక్తులను సూచిస్తున్నందున ఆధునిక తెలుగులో ‘వీరు’ సహజంగా ఉంటుంది.
- source_word: אַלּוּפֵי / אַלּוּף
  choice: నాయకులు / నాయకుడు
  rationale: ఆదికాండము 36 సందర్భంలో వంశం లేదా గోత్రానికి అధిపతులైనవారిని సూచిస్తుంది. మూలంలో ప్రతి పేరుకు ముందు ఏకవచన పదం పునరావృతమైనందున తెలుగులోనూ దాన్ని నిలిపాం.
- source_word: הַחֹרִי
  choice: హోరీయులు
  rationale: రూపరీత్యా ఏకవచన జాతివాచకమైనా, సందర్భంలో ఒక ప్రజాసమూహాన్ని సమష్టిగా సూచిస్తుంది; తెలుగులో బహువచనం సహజం.
- source_word: לוֹטָן
  choice: లోటాను
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగు లిప్యంతరీకరణ.
- source_word: שׁוֹבָל
  choice: షోబాలు
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగు లిప్యంతరీకరణ.
- source_word: צִבְעוֹן
  choice: సిబ్యోను
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగు లిప్యంతరీకరణ; ప్రారంభ צ ధ్వనిని తెలుగు బైబిలు వాడుకకు అనుగుణంగా ‘సి’తో సూచించాం.
- source_word: עֲנָה
  choice: అనా
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగు లిప్యంతరీకరణ.
