id: GEN.36.6
reference: Genesis 36:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּקַּ֣ח עֵשָׂ֡ו אֶת נָ֠שָׁי/ו וְ/אֶת בָּנָ֣י/ו וְ/אֶת בְּנֹתָי/ו֮ וְ/אֶת כָּל נַפְשׁ֣וֹת בֵּית/וֹ֒ וְ/אֶת מִקְנֵ֣/הוּ וְ/אֶת כָּל בְּהֶמְתּ֗/וֹ וְ/אֵת֙ כָּל קִנְיָנ֔/וֹ אֲשֶׁ֥ר רָכַ֖שׁ בְּ/אֶ֣רֶץ כְּנָ֑עַן וַ/יֵּ֣לֶךְ אֶל אֶ֔רֶץ מִ/פְּנֵ֖י יַעֲקֹ֥ב אָחִֽי/ו־־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/006.yaml
  text: And Esau took his wives[a], his sons, his daughters, and all the persons of his household, along with his livestock, all his animals, and all his possessions that he had acquired in the land of Canaan, and went to a land because of his brother Jacob.
translation:
  language: te
  text: ఏశావు తన భార్యలను, కుమారులను, కుమార్తెలను, తన ఇంటివారందరినీ, తన పశుసంపదను, జంతువులన్నిటినీ, కనాను దేశంలో తాను సంపాదించిన ఆస్తి అంతటినీ తీసుకొని, తన సోదరుడైన యాకోబు కారణంగా[b] ఒక దేశానికి[a] వెళ్లిపోయాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పాఠంలో ‘ఒక దేశానికి’ అని ఉంది. కొన్ని ప్రాచీన ప్రతులు, అనువాదాలు ‘శేయీరు దేశానికి’ అనే పాఠానికి మద్దతిస్తాయి; అనేక అనువాదాలు సందర్భానుసారంగా ‘వేరొక దేశానికి’ అని అనువదిస్తాయి.
    reason: textual_variant
  - marker: b
    text: ఇక్కడి హీబ్రూ పదబంధాన్ని ‘తన సోదరుడైన యాకోబుకు దూరంగా’ లేదా ‘యాకోబు సమక్షం నుండి’ అని కూడా అర్థం చేసుకోవచ్చు.
    reason: source_ambiguity
lexical_decisions:
- source_word: וַיִּקַּח
  choice: తీసుకొని
  rationale: לקח అనే క్రియకు ప్రాథమిక అర్థం ‘తీసుకోవడం.’ ఇక్కడ ఏశావు తన కుటుంబాన్ని, పశువులను, ఆస్తిని తనతో తీసుకొని వలస వెళ్లిన భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: נָשָׁיו
  choice: తన భార్యలను
  rationale: ఈ సందర్భంలో אִשָּׁה బహువచనం సాధారణంగా స్త్రీలను కాక ఏశావు భార్యలను సూచిస్తుంది.
- source_word: בָּנָיו / בְּנֹתָיו
  choice: కుమారులను, కుమార్తెలను
  rationale: హీబ్రూ మూలం కుమారులను, కుమార్తెలను విడివిడిగా పేర్కొంటుంది; అందువల్ల రెండింటినీ అనువాదంలో నిలిపాం.
- source_word: כָּל נַפְשׁוֹת בֵּיתוֹ
  choice: తన ఇంటివారందరినీ
  rationale: ఈ ప్రయోగంలో נֶפֶשׁ ‘ఆత్మలు’ అనే తాత్త్విక భావంలో కాక, ఇంటికి చెందిన వ్యక్తులను సూచిస్తుంది. ‘ఇంటివారందరూ’ ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: מִקְנֵהוּ
  choice: తన పశుసంపదను
  rationale: מִקְנֶה మందలు సహా మనిషి అధీనంలోని పశుసంపదను సూచిస్తుంది. తరువాతి విస్తృత పదమైన בְּהֵמָהతో ఉన్న స్వల్ప భేదాన్ని కూడా ఇది నిలుపుతుంది.
- source_word: כָּל בְּהֶמְתּוֹ
  choice: జంతువులన్నిటినీ
  rationale: בְּהֵמָה విస్తృతంగా పెంపుడు జంతువులను లేదా పశువులను సూచిస్తుంది. ముందు వచ్చిన ‘పశుసంపద’ను యథాతథంగా పునరావృతం చేయకుండా మూలంలోని రెండు పదాలను వేరుగా ఉంచాం.
- source_word: כָּל קִנְיָנוֹ אֲשֶׁר רָכַשׁ
  choice: తాను సంపాదించిన ఆస్తి అంతటినీ
  rationale: קִנְיָן సంపాదించుకున్న సొత్తు లేదా ఆస్తిని, רכשׁ దానిని పొందడం లేదా సంపాదించడాన్ని సూచిస్తాయి. తెలుగు వాక్యంలో రెండింటి భావం స్పష్టంగా నిలుస్తుంది.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: కనాను దేశంలో
  rationale: హీబ్రూలోని భౌగోళిక పదబంధాన్ని స్పష్టంగా, సహజంగా ప్రతిబింబిస్తుంది.
- source_word: אֶל אֶרֶץ
  choice: ఒక దేశానికి
  rationale: మసొరా పాఠం నిర్దిష్టంగా పేరు చెప్పకుండా ‘ఒక దేశానికి’ అని ఉంది. సందర్భాన్ని బట్టి ‘వేరొక దేశానికి’ అని జోడించకుండా మూలంలోని అనిర్దిష్టతను నిలిపాం.
- source_word: מִפְּנֵי יַעֲקֹב אָחִיו
  choice: తన సోదరుడైన యాకోబు కారణంగా
  rationale: מִפְּנֵי కారణార్థకంగా ‘కారణంగా’ అనీ, స్థలార్థకంగా ‘సమక్షం నుండి/దూరంగా’ అనీ అర్థమివ్వగలదు. తదుపరి వచనం విడిపోవడానికి కారణాన్ని వివరిస్తున్నందున ప్రధాన పాఠంలో కారణార్థాన్ని ఎంచుకొని, ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలిపాం.
theological_decisions:
- issue: מִפְּנֵי అనే పదబంధంలోని కారణార్థక–స్థలార్థక సందిగ్ధత
  choice: ప్రధాన పాఠంలో ‘యాకోబు కారణంగా’
  alternative: ‘యాకోబుకు దూరంగా’ లేదా ‘యాకోబు సమక్షం నుండి’
  rationale: ఆదికాండం 36:7లో ఇద్దరి ఆస్తి విస్తారంగా ఉండటం వల్ల కలిసి నివసించలేకపోయారని చెప్పడం కారణార్థానికి మద్దతిస్తుంది. అయినా హీబ్రూ పదబంధానికి స్థలార్థం కూడా సాధ్యమే కాబట్టి దానిని పాదసూచికలో తెలిపాం; యాకోబుపై నైతిక నిందను మోపేలా అనువదించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి వాడాం. ‘ఇంటివారందరూ,’ ‘పశుసంపద,’ ‘ఆస్తి’ వంటి సాధారణంగా అర్థమయ్యే పదాలను ఎంచుకున్నాం. మూలంలోని జాబితా నిర్మాణాన్ని నిలుపుతూ తెలుగు విభక్తి, వాక్యప్రవాహానికి అనుగుణంగా అమర్చాం.
