  terminology: Names and geographic terms are appropriately rendered as ‘ఏశావు,’ ‘యాకోబు,’ and ‘కనాను.’ The distinction between livestock (מִקְנֶה) and animals (בְּהֵמָה) is retained without awkward literalism. The footnotes are correctly anchored to the relevant Telugu expressions and preserve the textual and semantic uncertainties.
