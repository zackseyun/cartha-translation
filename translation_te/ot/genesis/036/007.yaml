- from: వారు కలిసి నివసించలేనంతగా వారి ఆస్తి విస్తరించింది; వారి పశుసంపద కారణంగా వారు పరదేశులుగా నివసించిన దేశం[a] వారిని పోషించలేకపోయింది[b].
  to: వారి ఆస్తులు ఎక్కువగా ఉండడం వల్ల వారు కలిసి నివసించలేకపోయారు; వారి పశుసంపద కారణంగా వారు పరదేశులుగా నివసిస్తున్న దేశం[a] వారిని పోషించలేకపోయింది[b].
