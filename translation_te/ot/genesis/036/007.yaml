id: GEN.36.7
reference: Genesis 36:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּֽי הָיָ֧ה רְכוּשָׁ֛/ם רָ֖ב מִ/שֶּׁ֣בֶת יַחְדָּ֑ו וְ/לֹ֨א יָֽכְלָ֜ה אֶ֤רֶץ מְגֽוּרֵי/הֶם֙ לָ/שֵׂ֣את אֹתָ֔/ם מִ/פְּנֵ֖י מִקְנֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/007.yaml
  text: For their possessions were too great for them to dwell together[b][a], and the land of their sojourning could not support them because of their livestock.
translation:
  language: te
  text: వారి ఆస్తులు ఎక్కువగా ఉండడం వల్ల వారు కలిసి నివసించలేకపోయారు; వారి పశుసంపద కారణంగా వారు పరదేశులుగా నివసిస్తున్న దేశం[a] వారిని పోషించలేకపోయింది[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వారు తాత్కాలికంగా నివసిస్తున్న దేశం.’ హీబ్రూ పదబంధం వారు ఆ దేశంలో పరదేశ నివాసులుగా ఉన్నారనే భావాన్ని కలిగి ఉంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘వారిని మోయలేకపోయింది’ లేదా ‘భరించలేకపోయింది.’
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే అనే భావాన్ని సందర్భానుసారంగా కారణవాచక నిర్మాణంలో వ్యక్తపరచడం
  rationale: ముందటి వచనంలో ఏశావు యాకోబు నుండి వేరుగా వెళ్లడానికి గల కారణాన్ని పరిచయం చేస్తుంది; తెలుగులో వాక్యప్రవాహం సహజంగా ఉండేందుకు ప్రత్యేకంగా ‘ఎందుకంటే’ అనకుండా కారణ సంబంధాన్ని వాక్య నిర్మాణంలో నిలిపాం.
- source_word: רְכוּשָׁם
  choice: వారి ఆస్తి
  rationale: చరాస్తులు, సంపద, పశువులు మొదలైన సమకూర్చుకున్న సొత్తును సూచించే విస్తృతమైన సహజ తెలుగు పదం.
- source_word: רָב מִשֶּׁבֶת יַחְדָּו
  choice: వారు కలిసి నివసించలేనంతగా ... విస్తరించింది
  rationale: רב + מן నిర్మాణంలోని పరిమితిని మించిన సమృద్ధిని తెలుగులో సహజంగా తెలియజేస్తుంది; ఇద్దరూ ఒకేచోట కలిసి ఉండలేని ఆచరణాత్మక ఫలితాన్ని కాపాడుతుంది.
- source_word: אֶרֶץ מְגֻרֵיהֶם
  choice: వారు పరదేశులుగా నివసించిన దేశం
  rationale: מְגוּרִים లోని తాత్కాలిక నివాసం మరియు స్వదేశస్థులు కాని నివాసితుల భావాన్ని ‘పరదేశులుగా నివసించిన’ అనే పదబంధం నిలుపుతుంది.
- source_word: לָשֵׂאת אֹתָם
  choice: వారిని పోషించలేకపోయింది
  rationale: నשא యొక్క అక్షరార్థం ‘మోయడం/భరించడం’; దేశం కర్తగా ఉన్న ఈ సందర్భంలో దాని వనరులు వారిని నిలబెట్టలేకపోయాయనే ఆచరణాత్మక భావాన్ని ‘పోషించలేకపోయింది’ స్పష్టంగా ఇస్తుంది.
- source_word: מִפְּנֵי
  choice: కారణంగా
  rationale: ఇక్కడ వారి పశుసంపద పరిమాణమే దేశం వారిని పోషించలేకపోవడానికి కారణమని సూచిస్తుంది.
- source_word: מִקְנֵיהֶם
  choice: వారి పశుసంపద
  rationale: మేకలు, గొర్రెలు, పశువులు మొదలైన విభిన్న పెంపుడు జంతువులను కలుపుకునే విస్తృత పదం; ‘పశువులు’ కంటే ఆస్తి/సంపద భావాన్ని కూడా నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘పరదేశులుగా నివసించిన’ అనే రూపం పితరుల తాత్కాలిక నివాస భావాన్ని కాపాడుతుంది; ‘ఆస్తి విస్తరించింది’ మరియు ‘పోషించలేకపోయింది’ సాధారణ పాఠకులకు స్పష్టంగా ఉంటాయి. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉంచబడ్డాయి.
