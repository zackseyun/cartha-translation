    issue: The phrase ‘వారు పరదేశులుగా నివసించిన దేశం’ is past/completed in aspect.
    rationale: אֶרֶץ מְגֻרֵיהֶם means ‘the land of their sojourning,’ referring in context to their present residence. A present/ongoing Telugu form avoids suggesting that their sojourn there was already over.
  revised_text: వారి ఆస్తులు ఎక్కువగా ఉండడం వల్ల వారు కలిసి నివసించలేకపోయారు; వారి పశుసంపద కారణంగా వారు పరదేశులుగా నివసిస్తున్న దేశం[a] వారిని పోషించలేకపోయింది[b].
