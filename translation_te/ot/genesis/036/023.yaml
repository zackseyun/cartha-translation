lexical_decisions:
- source_word: וְ/אֵלֶּה
  choice: వీరు
  rationale: వంశావళిలో తదుపరి జాబితాను పరిచయం చేసే సహజమైన ఆధునిక తెలుగు రూపం; హీబ్రూ సంధికారకాన్ని ప్రత్యేకంగా ‘మరియు’ అని అనువదించాల్సిన అవసరం లేదు.
- source_word: בְּנֵי
  choice: కుమారులు
  rationale: ఇక్కడ ప్రత్యక్ష పురుష సంతానాన్ని పేర్లతో జాబితా చేస్తున్నందున ‘కుమారులు’ అత్యంత నిర్దిష్టమైన అనువాదం.
- source_word: שׁוֹבָל
  choice: షోబాలు
  rationale: హీబ్రూ వ్యక్తిపేరును తెలుగు ధ్వన్యనుసారంగా లిప్యంతరీకరించిన రూపం.
- source_word: עַלְוָן
  choice: అల్వాను
  rationale: ఈ వచనంలోని మసొరేటిక్ హీబ్రూ రూపాన్ని అనుసరించిన లిప్యంతరీకరణ; 1 దినవృత్తాంతాలు 1:40లోని భిన్న రూపాన్ని పాదసూచికలో ఉంచాం.
- source_word: וּ/מָנַחַת
  choice: మనహతు
  rationale: హీబ్రూ వ్యక్తిపేరును తెలుగు ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించాం; సంధికారకం జాబితా విరామచిహ్నాల్లో సహజంగా వ్యక్తమవుతుంది.
- source_word: וְ/עֵיבָל
  choice: ఏబాలు
  rationale: హీబ్రూ వ్యక్తిపేరును నేరుగా ధ్వన్యనుసారంగా లిప్యంతరీకరించిన రూపం.
- source_word: שְׁפוֹ
  choice: షెఫో
  rationale: ఈ వచనంలోని మసొరేటిక్ పాఠరూపాన్ని అనుసరించాం; సమాంతర వంశావళిలోని ‘షెఫీ’ రూపాన్ని పాదసూచికలో తెలిపాం.
- source_word: וְ/אוֹנָם
  choice: ఓనాము
  rationale: హీబ్రూ వ్యక్తిపేరును ధ్వన్యనుసారంగా లిప్యంతరీకరించాం; తెలుగులో జాబితా చివరి అంశానికి తప్పనిసరిగా ‘మరియు’ అవసరం లేనందున విరామచిహ్నాలతో సహజంగా ఇచ్చాం.
