  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אֵ֖לֶּה בְּנֵ֣י דִישָׁ֑ן חֶמְדָּ֥ן וְ/אֶשְׁבָּ֖ן וְ/יִתְרָ֥ן וּ/כְרָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/026.yaml
  text: 'And these were the sons of Dishan: Hemdan[a], Eshban, Ithran, and Keran.'
translation:
  language: te
  text: 'దీషాను కుమారులు వీరు: హెమ్దాను, ఎష్బాను, యిత్రాను, మరియు కెరాను.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אֵלֶּה
  choice: వీరు
  rationale: సమీప వంశావళి జాబితాను పరిచయం చేసే హీబ్రూ సంధి-సర్వనామ ప్రయోగం. తెలుగులో సందర్భానుసారంగా ‘వీరు’ సహజంగా ఉంటుంది; ప్రత్యేకంగా ‘మరియు’ చేర్చనవసరం లేదు.
- source_word: בְּנֵי
  choice: కుమారులు
  rationale: ఇక్కడ వెంటనే పేర్లతో పేర్కొన్న పురుష సంతానాన్ని సూచిస్తున్నందున, విస్తృతమైన ‘సంతతి’ కంటే మూలానికి దగ్గరైన ‘కుమారులు’ ఎంచుకున్నాం.
- source_word: דִישָׁן
  choice: దీషాను
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు ధ్వని, విభక్తి అవసరాలకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: חֶמְדָּן
  choice: హెమ్దాను
  rationale: మసొరేటిక్ పాఠంలోని వ్యక్తినామానికి సమీపమైన తెలుగు లిప్యంతరీకరణ.
- source_word: וְ/אֶשְׁבָּן
  choice: ఎష్బాను
  rationale: వ్యక్తినామాన్ని నేరుగా లిప్యంతరీకరించాం; జాబితాలోని సంధిని తెలుగు విరామచిహ్నాలు తెలియజేస్తాయి.
- source_word: וְ/יִתְרָן
  choice: ఇత్రాను
  rationale: హీబ్రూ יתרן లోని ఆరంభ యోడ్ ఈ పేరులో వ్యంజనాత్మక ‘య్’గా కాక స్వరారంభంగా వినిపించే మసొరేటిక్ రూపాన్ని అనుసరించి లిప్యంతరీకరించాం.
- source_word: וּ/כְרָן
  choice: కెరాను
  rationale: హీబ్రూ కాఫ్‌ను ‘క’తో ప్రతిబింబించి వ్యక్తినామాన్ని లిప్యంతరీకరించాం; చివరి జాబితా అంశానికి ముందు హీబ్రూ సంధిని తెలుగులో కామాతో సహజంగా సూచించాం.
