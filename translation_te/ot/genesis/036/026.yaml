translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన, గౌరవప్రదమైన వంశావళి శైలి. తెలుగు బైబిలు పేర్లలో సాధారణంగా కనిపించే చివరి ‘ు’ను ఉపయోగించి పేర్లను సహజంగా పలికేలా చేశాం.
