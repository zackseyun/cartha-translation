source:
  edition: WLC
  text: וְ/אָהֳלִֽיבָמָה֙ יָֽלְדָ֔ה אֶת יעיש וְ/אֶת יַעְלָ֖ם וְ/אֶת קֹ֑רַח אֵ֚לֶּה בְּנֵ֣י עֵשָׂ֔ו אֲשֶׁ֥ר יֻלְּדוּ ל֖/וֹ בְּ/אֶ֥רֶץ כְּנָֽעַן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/005.yaml
  text: And Oholibamah bore Jeush, Jalam, and Korah. These are the sons of Esau who were born to him in the land of Canaan.
translation:
  language: te
  text: ఒహొలీబామా యెయూషును, యాలామును, కోరహును కన్నది. కనాను దేశంలో ఏశావుకు పుట్టిన కుమారులు వీరే.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָהֳלִיבָמָה
  choice: ఒహొలీబామా
  rationale: హీబ్రూ వ్యక్తినామాన్ని దాని ధ్వనిరూపానికి దగ్గరగా ఆధునిక తెలుగు లిపిలో లిప్యంతరీకరించాం.
- source_word: יָלְדָה
  choice: కన్నది
  rationale: స్త్రీ కర్తను, వంశావళి సందర్భంలోని ప్రసవార్థాన్ని సంక్షిప్తంగా, సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: יעיש
  choice: యెయూషు
  rationale: మసొరెటిక్ పాఠంలోని వ్యక్తినామ ధ్వనిని తెలుగులో సాధ్యమైనంత సమీపంగా లిప్యంతరీకరించాం.
- source_word: יַעְלָם
  choice: యాలాము
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు ఉచ్చారణకు అనుకూలంగా లిప్యంతరీకరించాం.
- source_word: קֹרַח
  choice: కోరహు
  rationale: హీబ్రూ వ్యక్తినామాన్ని దాని ధ్వనిరూపానికి దగ్గరగా లిప్యంతరీకరించాం.
- source_word: בְּנֵי
  choice: కుమారులు
  rationale: ఇక్కడ పేర్కొన్నవారు పురుష సంతానం కాబట్టి లింగనిర్దిష్టమైన హీబ్రూ పదార్థాన్ని నిలిపాం.
- source_word: עֵשָׂו
  choice: ఏశావు
  rationale: హీబ్రూ వ్యక్తినామానికి ప్రాచుర్యంలో ఉన్న తెలుగు రూపాన్ని ఉపయోగించాం.
- source_word: אֲשֶׁר יֻלְּדוּ לוֹ
  choice: ఏశావుకు పుట్టిన
  rationale: హీబ్రూ నిష్క్రియ నిర్మాణాన్నీ, לוֹ ద్వారా వ్యక్తమైన సంబంధాన్నీ సహజ తెలుగులో నిలిపింది; ఈ ఉపవాక్యంలో తల్లిని మళ్లీ స్పష్టంగా చేర్చలేదు.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: కనాను దేశంలో
  rationale: אֶרֶץ అనే ‘దేశం/భూమి’ పదాన్ని విడిచిపెట్టకుండా సహజమైన తెలుగు స్థానవాచక నిర్మాణాన్ని వాడాం.
