  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ వంశావళికి తగిన సంక్షిప్త, గౌరవప్రద శైలిని పాటించాం. పేర్లను అనువదించకుండా హీబ్రూ ఆధారంగా లిప్యంతరీకరించాం.
