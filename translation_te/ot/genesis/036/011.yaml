  text: And the sons of Eliphaz were Teman[a], Omar, Zepho, Gatam, and Kenaz.
translation:
  language: te
  text: ఎలీఫజు కుమారులు తేమాను, ఓమారు, సెఫో[a], గాతాము, కెనజు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని ఆంగ్ల అనువాదాల్లో ఈ పేరు ‘సెపో’ అని ఉంటుంది. ఇక్కడి మసొరెటిక్ హీబ్రూ స్వరచిహ్నాలు ‘సెఫో’ అనే పఠనానికి అనుకూలంగా ఉన్నాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: (తెలుగులో ప్రత్యేక క్రియ లేకుండా వంశావళి జాబితాగా వ్యక్తీకరించబడింది)
  rationale: ఈ వంశావళి సందర్భంలో היה సాధారణంగా వారసుల పేర్లను పరిచయం చేసే సంధాన క్రియ. తెలుగులో ‘కుమారులు ...’ అనే నామవాక్యం సహజంగా అదే భావాన్ని తెలియజేస్తుంది; ‘అయ్యారు’ అంటే మార్పు జరిగినట్లు అనవసర భావం కలుగుతుంది.
- source_word: בְּנֵי
  choice: కుమారులు
  rationale: హీబ్రూ పదం పురుష బహువచనంలో ‘కుమారులు’ అని స్పష్టంగా చెబుతోంది; ఈ వంశావళిలో దానిని లింగతటస్థంగా మార్చాల్సిన సందర్భోచిత కారణం లేదు.
- source_word: אֱלִיפָז
  choice: ఎలీఫజు
  rationale: వ్యక్తి పేరును తెలుగు ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: תֵּימָן
  choice: తేమాను
  rationale: ఇక్కడ ఇది వ్యక్తి పేరు; స్థలనామానికి సంబంధించిన సాధ్యమైన అర్థాన్ని అనువదించకుండా లిప్యంతరీకరించాం.
- source_word: אוֹמָר
  choice: ఓమారు
  rationale: వ్యక్తి పేరును తెలుగు ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: צְפוֹ
  choice: సెఫో
  rationale: మసొరెటిక్ స్వరచిహ్నాల ప్రకారం పేరును ‘సెఫో’గా లిప్యంతరీకరించాం. צ ధ్వనిని సాధారణ తెలుగు పాఠకులకు సహజంగా ఉండే ‘స’తో సూచించాం; פ ఇక్కడ ఘర్షణ ధ్వనిగా ఉండటంతో ‘ఫ’ వాడాం.
- source_word: גַעְתָּם
  choice: గాతాము
  rationale: వ్యక్తి పేరును తెలుగు ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: קְנַז
  choice: కనజు
  rationale: వ్యక్తి పేరును తెలుగులో చదవడానికి సహజంగా లిప్యంతరీకరించాం.
