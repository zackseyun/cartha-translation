  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళికి తగిన సంక్షిప్తమైన గంభీర శైలిని ఉపయోగించాం. పేర్ల జాబితాను సహజమైన తెలుగు నామవాక్యంగా ఇచ్చాం; మూలంలోని ప్రారంభ וַ సంధిని విడిగా ‘మరియు’ అని అనువదించడం ఈ స్వతంత్ర వాక్యంలో అసహజంగా ఉండటంతో చేయలేదు.
