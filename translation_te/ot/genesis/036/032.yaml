base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/032.yaml
  text: Bela son of Beor reigned in Edom[a], and the name of his city was Dinhabah.
translation:
  language: te
  text: బెయోరు కుమారుడైన బెలా ఏదోములో రాజ్యమేలాడు[a]; అతని పట్టణం పేరు దిన్హాబా.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఏదోమును పరిపాలించాడు.’ హీబ్రూ పాఠంలో అక్షరార్థంగా ‘ఏదోములో రాజ్యమేలాడు’ అని ఉంది; సందర్భానుసారంగా ఇది ఏదోముపై రాజాధికారాన్ని కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְלֹךְ
  choice: రాజ్యమేలాడు
  rationale: రాజుల జాబితా సందర్భంలో מלך రాజుగా పరిపాలించడాన్ని సూచిస్తుంది; ‘రాజ్యమేలాడు’ సహజమైన, గౌరవప్రదమైన తెలుగు ప్రయోగం.
- source_word: בֶּאֱדוֹם
  choice: ఎ Edomులో
  rationale: ב అనే ఉపసర్గ ఇక్కడ ప్రాథమికంగా స్థలాన్ని సూచిస్తుంది; అందువల్ల ‘ఎ Edomులో’ మూలభాష రూపాన్ని నేరుగా నిలుపుతుంది.
- source_word: בֶּלַע
  choice: బెల
  rationale: వ్యక్తి పేరును తెలుగు ధ్వన్యంతరీకరణ పద్ధతిలో అందించాం.
- source_word: בֶּן בְּעוֹר
  choice: బెయోరు కుమారుడైన
  rationale: హీబ్రూ వంశసంబంధ నిర్మాణాన్ని సహజమైన తెలుగులో స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: וְשֵׁם עִירוֹ
  choice: అతని పట్టణం పేరు
  rationale: మూడవ పురుష ఏకవచన ప్రత్యయాన్ని ‘అతని’గా నిలుపుతూ, తెలుగు వాక్యనిర్మాణానికి సహజంగా మార్చాం.
- source_word: דִּנְהָבָה
  choice: దిన్హాబా
  rationale: స్థల నామాన్ని అనువదించకుండా తెలుగు లిపిలో ధ్వన్యంతరీకరించాం.
