translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలిని ఉపయోగించాం; మూలంలోని స్థలార్థక ఉపసర్గను ప్రధాన పాఠ్యంలో నిలిపి, అధికార పరిధి అనే ప్రత్యామ్నాయ భావాన్ని పాదటిప్పణిలో ఇచ్చాం.
