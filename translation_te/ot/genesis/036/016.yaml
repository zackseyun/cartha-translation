id: GEN.36.16
reference: Genesis 36:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אַלּֽוּף קֹ֛רַח אַלּ֥וּף גַּעְתָּ֖ם אַלּ֣וּף עֲמָלֵ֑ק אֵ֣לֶּה אַלּוּפֵ֤י אֱלִיפַז֙ בְּ/אֶ֣רֶץ אֱד֔וֹם אֵ֖לֶּה בְּנֵ֥י עָדָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/016.yaml
  text: Chief Korah, chief Gaatham, chief Amalek—these are the chiefs of Eliphaz in the land of Edom; these are the sons of Adah.
translation:
  language: te
  text: కోరహు నాయకుడు, గాతాము నాయకుడు, అమాలేకు నాయకుడు—ఎదోము దేశంలో ఎలీఫజు నాయకులు వీరే; ఆదా కుమారులు వీరే.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַלּוּף
  choice: నాయకుడు
  rationale: ఎదోమీయ వంశవ్యవస్థలోని గోత్ర లేదా వంశాధిపతిని సూచించే పదం; ఆధునిక తెలుగు పాఠకులకు సహజంగా అర్థమయ్యేలా ‘నాయకుడు’ అని అనువదించబడింది.
- source_word: גַּעְתָּם
  choice: గాతాము
  rationale: హీబ్రూ వ్యక్తినామాన్ని దాని వ్యంజన నిర్మాణం మరియు దీర్ఘ స్వరాన్ని అనుసరించి లిప్యంతరీకరించింది.
- source_word: בְּנֵי עָדָה
  choice: ఆదా కుమారులు
  rationale: హీబ్రూ సంబంధవాచక నిర్మాణాన్ని నేరుగా నిలుపుకుంది; ఇక్కడ విస్తృతంగా ‘వంశస్థులు’ అనే భావం సాధ్యమైనా మూలంలోని ‘కుమారులు’ను సంరక్షించింది.
theological_decisions:
- issue: ‘ఎలీఫజు నాయకులు’ మరియు ‘ఆదా కుమారులు’ అనే వంశ సంబంధం
  choice: ఎలీఫజు వంశపు నాయకులు; ఆదా కుమారులు
  alternative: ఎలీఫజు నాయకులు; ఆదా వంశస్థులు
  rationale: ఈ సంక్షిప్త వంశావళి భాషలోని తరాల సమీకరణాన్ని వివరణతో సరిచేయకుండా, మూలపాఠంలోని ఉద్రిక్తతను నిలిపింది; అయితే తెలుగులో సంబంధం స్పష్టంగా ఉండేందుకు ‘వంశపు’ వాడబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన వంశావళి శైలి. పేర్ల పునరావృత నిర్మాణం మరియు రెండు ముగింపు వాక్యాల సమాంతరత నిలుపబడ్డాయి.
