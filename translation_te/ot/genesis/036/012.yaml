id: GEN.36.12
reference: Genesis 36:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/תִמְנַ֣ע הָיְתָ֣ה פִילֶ֗גֶשׁ לֶֽ/אֱלִיפַז֙ בֶּן עֵשָׂ֔ו וַ/תֵּ֥לֶד לֶ/אֱלִיפַ֖ז אֶת עֲמָלֵ֑ק אֵ֕לֶּה בְּנֵ֥י עָדָ֖ה אֵ֥שֶׁת עֵשָֽׂו׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/012.yaml
  text: Timna was a concubine of Eliphaz[a], Esau’s son, and she bore Amalek to Eliphaz. These are the sons of Adah[b], Esau’s wife.
translation:
  language: te
  text: తిమ్నా ఏశావు కుమారుడైన ఎలీఫజుకు ఉపపత్నిగా ఉండి, ఎలీఫజుకు అమాలేకును కనింది. వీరు ఏశావు భార్య ఆదా కుమారులు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పదం అక్షరార్థంగా ‘కుమారులు’ అని ఉంది. అయితే ఈ వంశావళి సందర్భంలో వీరు ఆదా మనుమలు లేదా విస్తృతార్థంలో ఆమె సంతతివారు.
    reason: genealogical_ambiguity
lexical_decisions:
- source_word: וְתִמְנַע
  choice: తిమ్నా
  rationale: వ్యక్తి పేరును ఆధునిక ప్రామాణిక తెలుగు లిప్యంతరీకరణలో ఇచ్చాం; ముందున్న సంధాన అవ్యయాన్ని వాక్యప్రవాహంలో ప్రత్యేకంగా అనువదించాల్సిన అవసరం లేదు.
- source_word: הָיְתָה פִילֶגֶשׁ
  choice: ఉపపత్నిగా ఉండి
  rationale: פִילֶגֶשׁ గుర్తింపు పొందినప్పటికీ ప్రధాన భార్యకన్నా తక్కువ సామాజిక హోదా గల వైవాహిక సంబంధాన్ని సూచిస్తుంది; ‘ఉపపత్ని’ ఆ భేదాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: לֶאֱלִיפַז בֶּן עֵשָׂו
  choice: ఏశావు కుమారుడైన ఎలీఫజుకు
  rationale: లామెద్ సూచించే సంబంధాన్ని తెలుగులో ‘ఎలీఫజుకు’గా, నిర్మాణ సంబంధాన్ని సహజంగా ‘ఏశావు కుమారుడైన’గా ఇచ్చాం.
- source_word: וַתֵּלֶד לֶאֱלִיפַז אֶת עֲמָלֵק
  choice: ఎలీఫజుకు అమాలేకును కనింది
  rationale: ילד క్రియకు ‘కనింది’ సహజమైన వంశావళి ప్రయోగం; తండ్రిని సూచించే לְ నిర్మాణాన్ని ‘ఎలీఫజుకు’గా నిలిపాం.
- source_word: אֵלֶּה בְּנֵי עָדָה
  choice: వీరు … ఆదా కుమారులు
  rationale: בְּנֵי యొక్క ప్రత్యక్ష అర్థమైన ‘కుమారులు’ను ప్రధాన పాఠ్యంలో నిలిపి, సందర్భంలో విస్తృత వంశసంబంధ అర్థం ఉండగలదని పాదసూచికలో తెలియజేశాం.
- source_word: אֵשֶׁת עֵשָׂו
  choice: ఏశావు భార్య
  rationale: హీబ్రూ నిర్మాణ సంబంధాన్ని సహజమైన తెలుగు స్వామ్య నిర్మాణంతో అనువదించాం.
theological_decisions:
- issue: ఆదాతో పేర్కొన్న వారి వంశసంబంధం
  choice: ప్రధాన పాఠ్యంలో ‘కుమారులు’
  alternative: ‘మనుమలు’ లేదా ‘సంతతివారు’
  rationale: హీబ్రూ בְּנֵי ప్రత్యక్షంగా ‘కుమారులు’ అని ఉన్నప్పటికీ, సమీప వంశావళి ప్రకారం ఎలీఫజు కుమారులు ఆదాకు మనుమలు. మూలపాఠ్య రూపాన్ని మార్చకుండా ఈ వంశావళి ఉద్రిక్తతను పాదసూచికలో స్పష్టంచేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వంశావళి శైలిని అనుసరించాం. పేర్లను తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించాం; హీబ్రూ పాఠ్యంలో ఉన్న వంశసంబంధ పదప్రయోగాన్ని ప్రధాన పాఠ్యంలో నిలిపాం.
