id: GEN.36.13
reference: Genesis 36:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אֵ֨לֶּה֙ בְּנֵ֣י רְעוּאֵ֔ל נַ֥חַת וָ/זֶ֖רַח שַׁמָּ֣ה וּ/מִזָּ֑ה אֵ֣לֶּ֣ה הָי֔וּ בְּנֵ֥י בָשְׂמַ֖ת אֵ֥שֶׁת עֵשָֽׂו׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/013.yaml
  text: 'And these were the sons of Reuel: Nahath[a], Zerah, Shammah, and Mizzah. These were the sons of Basemath, Esau’s wife.'
translation:
  language: te
  text: 'రెయూయేలు కుమారులు వీరు: నహతు, జెరహు, షమ్మా, మిజ్జా. వీరు ఏశావు భార్య బాశెమతు కుమారులు.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ ‘కుమారులు’ అనే హీబ్రూ పదం విస్తృతంగా ‘సంతతివారు’ అనే అర్థంలో ఉంది; 36:10 ప్రకారం వీరు బాశెమతు మనుమలు.
    reason: మూలపాఠంలోని ‘కుమారులు’ అనే పదప్రయోగాన్ని నిలిపి ఉంచుతూ, సమీప సందర్భం ద్వారా స్పష్టమయ్యే వంశసంబంధాన్ని వివరిస్తుంది.
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: వీరు
  rationale: వంశావళిలో తదుపరి జాబితాను సహజమైన ఆధునిక తెలుగులో పరిచయం చేస్తుంది; వాక్యాల వరుస ద్వారా హీబ్రూ సంధాన భావం వ్యక్తమవుతుంది.
- source_word: בְּנֵי רְעוּאֵל
  choice: రెయూయేలు కుమారులు
  rationale: ఇక్కడ పేర్లు రెయూయేలు ప్రత్యక్ష పురుష సంతానాన్ని సూచిస్తున్నందున ‘కుమారులు’ నిర్దిష్టంగా సరిపోతుంది.
- source_word: נַחַת וָזֶרַח שַׁמָּה וּמִזָּה
  choice: నహతు, జెరహు, షమ్మా, మిజ్జా
  rationale: వ్యక్తుల పేర్లను తెలుగు బైబిలు నామరూపాలకు అనుగుణంగా లిప్యంతరీకరించాం; తెలుగు జాబితా నిర్మాణంలో విరామచిహ్నాలు సహజంగా ఉన్నాయి.
- source_word: אֵלֶּה הָיוּ
  choice: వీరే
  rationale: ముందు పేర్కొన్న వారినే తిరిగి గుర్తించే హీబ్రూ వంశావళి సూత్రాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בְּנֵי בָשְׂמַת
  choice: బాశెమతు కుమారులు
  rationale: మూలంలో పునరావృతమైన בְּנֵי అనే పదానికి ‘కుమారులు’నే ఉంచి, వంశావళి ప్రయోగంలోని విస్తృత భావాన్ని పాదసూచికలో వివరించాం.
- source_word: אֵשֶׁת עֵשָׂו
  choice: ఏశావు భార్యయైన
  rationale: సంబంధాన్ని స్పష్టంగా తెలిపే సహజమైన, గౌరవప్రదమైన తెలుగు నిర్మాణం.
theological_decisions:
- issue: బాశెమతుతో జాబితాలోని వారి వంశసంబంధం
  choice: మూలంలోని ‘కుమారులు’ అనే రూపాన్ని ప్రధాన పాఠ్యంలో నిలిపి ఉంచడం
  alternative: ‘మనుమలు’ లేదా ‘సంతతివారు’ అని అనువదించడం
  rationale: ఆదికాండము 36:10 ప్రకారం రెయూయేలు బాశెమతు కుమారుడు; కాబట్టి ఇక్కడ పేరుపొందినవారు ఆమె మనుమలు. అయినా హీబ్రూ పాఠం మళ్లీ בְּנֵי అని చెప్పి విస్తృత వంశార్థంలో వాడుతుంది. ‘మనుమలు’ సందర్భాన్ని స్పష్టం చేసినా మూలంలోని పదపునరావృతాన్ని తొలగిస్తుంది; అందువల్ల ఆ ఉద్రిక్తతను పాఠ్యంలో నిలిపి పాదసూచికలో వివరణ ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళికి తగిన సంక్షిప్తమైన గౌరవప్రద శైలి. పేర్లు తెలుగు పాఠకులకు సుపరిచితమైన బైబిలు లిప్యంతరీకరణకు దగ్గరగా ఉంచబడ్డాయి.
