  source_fidelity: 'హీబ్రూ שִׂמְלָהలోని שׂ ధ్వని /s/ మరియు మొదటి అచ్చు ప్రతిబింబించబడలేదు: ‘శమ్లా’ కంటే ‘సిమ్లా’ మూలపాఠానికి దగ్గరగా ఉంది. అలాగే מֵרְחֹבוֹת הַנָּהָרను ‘నది సమీపంలోని రెహోబోతు నుండి వచ్చిన’ అని ఇవ్వడం మూలంలోని స్థల-సంబంధాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది; నిర్దిష్ట నదిని గుర్తించదు.'
