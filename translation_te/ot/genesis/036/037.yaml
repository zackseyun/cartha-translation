translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలిని వాడాం. హీబ్రూ వాక్యక్రమాన్ని యాంత్రికంగా అనుసరించకుండా, సంఘటనల క్రమం మరియు రాజ్యవారసత్వ సూత్రాన్ని స్పష్టంగా ఉంచాం.
