  yaml_path: translation/ot/genesis/036/037.yaml
  text: Then Samlah died[c][b][a], and Shaul from Rehoboth on the River reigned in his place.
translation:
  language: te
  text: తరువాత సిమ్లా మరణించాడు. అతని స్థానంలో నది సమీపంలోని రెహోబోతు నుండి వచ్చిన షావూలు రాజ్యమేలాడు.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా ‘నది రెహోబోతు’; ఇది ఒక ప్రసిద్ధ నది సమీపంలో ఉన్న రెహోబోతును సూచించే అవకాశం ఉంది.
    reason: cultural_note
  - marker: b
    text: ఈ పేరుకు సంప్రదాయ రూపం ‘సౌలు’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: తరువాత ... చనిపోయాడు
  rationale: వయ్యిక్తోల్ రూపం కథనాన్ని తదుపరి సంఘటనకు నడిపిస్తుంది. ఆధునిక తెలుగులో ‘తరువాత’ సంఘటనల క్రమాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: שַׂמְלָה
  choice: శమ్లా
  rationale: హీబ్రూ వ్యక్తినామాన్ని దాని ధ్వనికి సమీపంగా లిప్యంతరీకరించాం.
- source_word: וַיִּמְלֹךְ
  choice: రాజ్యమేలాడు
  rationale: מלך అనే క్రియ రాజుల వారసత్వ ప్రకటనలో పాలించడాన్ని సూచిస్తుంది; ‘రాజ్యమేలాడు’ ఆ భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: תַּחְתָּיו
  choice: అతని స్థానంలో
  rationale: ఒక పాలకుని తరువాత మరొకడు అతని స్థానాన్ని చేపట్టే వారసత్వ భావాన్ని ఈ పదబంధం స్పష్టంగా తెలియజేస్తుంది.
- source_word: שָׁאוּל
  choice: షావూలు
  rationale: హీబ్రూ שָׁאוּל (షాʾూల్) రూపానికి దగ్గరగా ఉండే తెలుగు లిప్యంతరీకరణను ఎంచుకున్నాం.
- source_word: מֵרְחֹבוֹת הַנָּהָר
  choice: నది దగ్గరనున్న రెహోబోతుకు చెందిన
  rationale: מִן మూలం లేదా అనుబంధాన్ని సూచిస్తుంది. הַנָּהָר ఆ పట్టణాన్ని ఒక ప్రసిద్ధ నదితో గుర్తించే భౌగోళిక విశేషణంగా ఉంది; హీబ్రూ నిర్మాణంలోని సంక్షిప్తతను తెలుగులో సహజంగా విప్పి చెప్పాం.
