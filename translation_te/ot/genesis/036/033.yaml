  yaml_path: translation/ot/genesis/036/033.yaml
  text: Bela died[a], and Jobab son of Zerah from Bozrah reigned in his place.
translation:
  language: te
  text: బేలా చనిపోయాడు; అతని స్థానంలో బొస్రాకు చెందిన జెరహు కుమారుడైన యోబాబు రాజయ్యాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “బొస్రా నుండి వచ్చినవాడు.” హీబ్రూ ఉపసర్గ ఆ పట్టణం నుండి వచ్చినవాడనే అర్థాన్ని లేదా ఆ పట్టణంతో అనుబంధాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: చనిపోయాడు
  rationale: మూత్ క్రియ యొక్క వయ్యిక్తోల్ రూపం కథనంలోని తదుపరి సంఘటనను తెలియజేస్తుంది; తెలుగులో సహజంగా కర్తను పేరుతో పేర్కొన్నాం.
- source_word: בָּלַע
  choice: బెల
  rationale: హీబ్రూ వ్యక్తినామాన్ని ఆధునిక ప్రామాణిక తెలుగు లిప్యంతరీకరణలో అందించాం.
- source_word: וַיִּמְלֹךְ
  choice: రాజ్యపాలన చేశాడు
  rationale: రాజవంశ వారసత్వ సందర్భంలో మలక్ క్రియ రాజుగా పాలించడాన్ని సూచిస్తుంది; ఈ ప్రయోగం తెలుగులో సహజంగా ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: תַּחְתָּיו
  choice: అతని స్థానంలో
  rationale: మునుపటి రాజు స్థానంలో వారసుడు రావడం అనే భావాన్ని నేరుగా నిలుపుతుంది.
- source_word: יוֹבָב
  choice: యోబాబు
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు బైబిలు నామరూపాలకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: בֶּן זֶרַח
  choice: జెరహు కుమారుడు
  rationale: తండ్రి పేరుతో వ్యక్తిని గుర్తించే హీబ్రూ నిర్మాణాన్ని సహజమైన తెలుగు సంబంధపదబంధంగా అనువదించాం.
- source_word: מִבָּצְרָה
  choice: బొస్రాకు చెందిన
  rationale: מִן ఉపసర్గ ఇక్కడ పట్టణ మూలాన్ని లేదా అనుబంధాన్ని సూచించగలదు; 'చెందిన' అనే ప్రయోగం ఆ రెండింటినీ సహజంగా విస్తృతంగా నిలుపుతుంది.
