- from: బెల చనిపోయాడు. అతని స్థానంలో బొస్రాకు చెందిన జెరహు కుమారుడు యోబాబు రాజ్యపాలన చేశాడు.
  to: బేలా చనిపోయాడు; అతని స్థానంలో బొస్రాకు చెందిన జెరహు కుమారుడైన యోబాబు రాజయ్యాడు.[a]
