  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. రాజుల జాబితాకు తగిన సంక్షిప్తతను నిలిపి, స్థలనామ సంబంధంలోని హీబ్రూ విస్తృతార్థాన్ని ప్రధాన పాఠ్యంలో సహజంగా వ్యక్తం చేశాం.
