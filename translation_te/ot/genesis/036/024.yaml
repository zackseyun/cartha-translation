  text: וְ/אֵ֥לֶּה בְנֵֽי צִבְע֖וֹן וְ/אַיָּ֣ה וַ/עֲנָ֑ה ה֣וּא עֲנָ֗ה אֲשֶׁ֨ר מָצָ֤א אֶת הַ/יֵּמִם֙ בַּ/מִּדְבָּ֔ר בִּ/רְעֹת֥/וֹ אֶת הַ/חֲמֹרִ֖ים לְ/צִבְע֥וֹן אָבִֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/024.yaml
  text: 'These are the sons of Zibeon: Aiah and Anah[a]. This is the Anah who found the yemim in the wilderness while he was pasturing the donkeys for Zibeon his father.'
translation:
  language: te
  text: 'సిబ్యోను కుమారులు వీరు: అయ్యా, అనా. అరణ్యంలో యేమీమ్‌ను[a] కనుగొన్న అనా ఇతడే; అతడు తన తండ్రియైన సిబ్యోను కోసం గాడిదలను మేపుతున్నప్పుడు అది జరిగింది.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పదమైన ‘యేమీమ్’ అర్థం అనిశ్చితం. దాన్ని ‘వేడి నీటి ఊటలు’ అని కొందరు అర్థం చేసుకున్నారు; కొన్ని ప్రాచీన, తదనంతర వ్యాఖ్యానాల్లో ‘కంచర గాడిదలు’ అని కూడా అర్థం చేసుకున్నారు. పదసాక్ష్యం నిర్ణయాత్మకంగా లేనందున ప్రధాన పాఠ్యంలో హీబ్రూ పదాన్నే ఉంచాం.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְנֵי צִבְעוֹן
  choice: సిబ్యోను కుమారులు
  rationale: వంశావళి సందర్భంలో בְנֵי అనే నిర్మాణరూపం మగ సంతానాన్ని నేరుగా సూచిస్తుంది; ఆధునిక తెలుగులో ‘కుమారులు’ సహజమైన, స్పష్టమైన సమానార్థకం.
- source_word: צִבְעוֹן
  choice: సిబ్యోను
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు ధ్వనివ్యవస్థకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: אַיָּה
  choice: అయ్యా
  rationale: హీబ్రూ వ్యక్తినామ ధ్వనిని తెలుగులో సాధ్యమైనంత సమీపంగా లిప్యంతరీకరించాం.
- source_word: עֲנָה
  choice: అనా
  rationale: వంశావళి అంతటా స్థిరంగా వాడగల తెలుగు లిప్యంతరీకరణ.
- source_word: הוּא עֲנָה
  choice: అనా ఇతడే
  rationale: ఈ పదబంధంలోని గుర్తింపునిచ్చే బలాన్ని సహజమైన తెలుగు వాక్యక్రమంలో వ్యక్తం చేస్తుంది.
- source_word: מָצָא
  choice: కనుగొన్న
  rationale: సాధారణ క్రియార్థమైన ‘కనుగొను’ను నేరుగా, సందర్భోచితంగా అందిస్తుంది.
- source_word: הַיֵּמִם
  choice: యేమీమ్
  rationale: అత్యంత అరుదైన ఈ హీబ్రూ పదం అర్థం నిర్ధారణ కాలేదు. వివాదాస్పద అర్థాన్ని ప్రధాన పాఠ్యంలో బలవంతంగా పెట్టకుండా మూలపదాన్ని లిప్యంతరీకరించాం.
- source_word: בַּמִּדְבָּר
  choice: అరణ్యంలో
  rationale: מִדְבָּר సూచించే జనావాసం తక్కువైన బీడు ప్రాంతాన్ని ‘అరణ్యం’ అనే ప్రామాణిక బైబిలు తెలుగు పదం సహజంగా తెలియజేస్తుంది; ఇది కేవలం ఇసుక ఎడారి అనే సంకుచిత భావాన్ని విధించదు.
- source_word: בִּרְעֹתוֹ אֶת הַחֲמֹרִים
  choice: గాడిదలను మేపుతున్నప్పుడు
  rationale: בְּ + క్రియానామ నిర్మాణం సమకాలిక చర్యను సూచిస్తుంది. వస్తువు గాడిదలు కాబట్టి ‘మేపు’ సహజమైన తెలుగు ప్రయోగం.
- source_word: לְצִבְעוֹן אָבִיו
  choice: తన తండ్రి సిబ్యోను
  rationale: గాడిదలు తండ్రి సిబ్యోనుకు సంబంధించినవనే భావాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది; ‘తన’ అనేది అనా వైపు స్పష్టంగా సూచిస్తుంది.
theological_decisions:
- issue: הַיֵּמִם అనే అరుదైన పదం యొక్క అర్థం
  choice: ప్రధాన పాఠ్యంలో ‘యేమీమ్’ అని లిప్యంతరీకరించడం
  alternative: ‘వేడి నీటి ఊటలు’ లేదా ‘కంచర గాడిదలు’ అని అనువదించడం
  rationale: లభ్యమైన పదసాక్ష్యం నిర్ణాయకంగా లేదు; అందువల్ల ఏ వ్యాఖ్యానాన్నీ పాఠ్యార్థంగా ఖరారు చేయకుండా అస్పష్టతను నిలిపి, ప్రధాన ప్రతిపాదనలను పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన వంశావళి శైలి. పేర్లు మూల హీబ్రూ ధ్వనులకు దగ్గరగా లిప్యంతరీకరించబడ్డాయి. అరుదైన పదంలోని నిజమైన అనిశ్చితిని పాదసూచికతో పరిరక్షించాం.
