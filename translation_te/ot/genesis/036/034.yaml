  yaml_path: translation/ot/genesis/036/034.yaml
  text: And Jobab died[b][a], and Husham from the land of the Temanites reigned in his place.
translation:
  language: te
  text: యోబాబు చనిపోయాడు. అతని స్థానంలో తేమానీయుల దేశానికి చెందిన[a] హుషాము రాజయ్యాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తేమాను దేశానికి చెందిన”; లేదా “తేమానీయుని దేశానికి చెందిన.” హీబ్రూ రూపం తేమానుతో సంబంధమున్న ప్రాంతాన్నిగానీ, ప్రజలనుగానీ సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: చనిపోయాడు
  rationale: מות ధాతువు యొక్క wayyiqtol రూపం కథన క్రమంలో జరిగిన సాధారణ భూతకాల సంఘటనను సూచిస్తుంది; ఆధునిక తెలుగులో ‘చనిపోయాడు’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: יוֹבָב
  choice: యోబాబు
  rationale: వ్యక్తి పేరును తెలుగు ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: וַיִּמְלֹךְ
  choice: రాజయ్యాడు
  rationale: ఈ రాజవంశీయ సూత్రవాక్యంలో מלך ఒకరి స్థానంలో మరొకరు రాజ్యాధికారంలోకి రావడాన్ని సూచిస్తుంది; ‘రాజయ్యాడు’ ఆ అధికార స్వీకరణ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: תַּחְתָּיו
  choice: అతని స్థానంలో
  rationale: תחתיו ఇక్కడ పదవిలో వారసత్వం లేదా ప్రతిస్థాపనను సూచిస్తుంది; ‘అతని స్థానంలో’ ఆ భావాన్ని నేరుగా కాపాడుతుంది.
- source_word: חֻשָׁם
  choice: హుషాము
  rationale: వ్యక్తి పేరును తెలుగు ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: מֵאֶרֶץ
  choice: దేశానికి చెందిన
  rationale: מן + אֶרֶץ భౌగోళిక మూలం లేదా అనుబంధాన్ని సూచిస్తుంది. తెలుగులో ‘దేశానికి చెందిన’ అనేది కదలికను అనవసరంగా సూచించకుండా ఆ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: הַתֵּימָנִי
  choice: తేమానీయుల
  rationale: ఈ gentilic రూపం తేమానుతో సంబంధమున్న ప్రజలను లేదా ప్రాంతాన్ని సూచించగలదు. ప్రధాన పాఠంలో ‘తేమానీయుల’ అని ఇచ్చి, మూలంలోని ఇతర సాధ్యార్థాలను పాదటిప్పణిలో నిలిపాం.
