base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/021.yaml
  text: and Dishon[a], and Ezer, and Dishan. These are the chiefs of the Horites, the sons of Seir, in the land of Edom.
translation:
  language: te
  text: దీషోను, ఏత్సెరు, దీషాను. ఇవే ఏదోము దేశంలో శేయీరు కుమారులైన హోరీయుల నాయకులు[a].
  philosophy: optimal-equivalence
  footnotes:
