translation:
  language: te
  text: ఆదా ఏశావుకు ఎలీఫజును కనింది, మరియు బాశెమతు రెయూయేలును కనింది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֵּלֶד / יָלְדָה
  choice: కనింది
  rationale: ילד అనే రెండు క్రియారూపాలూ ‘కనడం, జన్మనివ్వడం’ అనే అర్థాన్ని ఇస్తాయి. వంశావళి సందర్భంలో ‘కనింది’ సంక్షిప్తంగా, సహజంగా ఉండి తల్లినే కర్తగా నిలుపుతుంది.
- source_word: לְעֵשָׂו
  choice: ఏశావుకు
  rationale: ילדతో వచ్చిన לְ తండ్రితో ఉన్న సంబంధాన్ని సూచిస్తుంది; తెలుగులో ‘ఏశావుకు’ ఆ భావాన్ని సహజంగా, అదనపు వ్యాఖ్యానం లేకుండా తెలియజేస్తుంది.
- source_word: אֶת
  choice: '[ప్రత్యేకంగా అనువదించలేదు]'
  rationale: ఇది ప్రత్యక్ష కర్మ సూచకం; తెలుగులో దీనికి స్వతంత్ర పదం అవసరం లేదు, వాక్య నిర్మాణమే దాని పనిని తెలియజేస్తుంది.
- source_word: אֱלִיפָז
  choice: ఎలీఫజు
  rationale: మసొరేటిక్ హీబ్రూ రూపాన్ని అనుసరించి వ్యక్తి పేరును తెలుగు ధ్వన్యనుకరణలో ఇచ్చాం.
- source_word: בָשְׂמַת
  choice: బాశెమతు
  rationale: హీబ్రూ పేరులోని వ్యంజన, స్వర రూపాలకు దగ్గరగా ఉండే తెలుగు ధ్వన్యనుకరణ.
- source_word: רְעוּאֵל
  choice: రెయూయేలు
  rationale: మసొరేటిక్ పాఠంలోని హీబ్రూ ఉచ్చారణ విభాగాలను సాధ్యమైనంత స్పష్టంగా ప్రతిబింబించే తెలుగు ధ్వన్యనుకరణ.
- source_word: וּ
  choice: ;
  rationale: హీబ్రూ సంధికారకం రెండు సమాంతర జనన ప్రకటనలను కలుపుతుంది. తెలుగులో అర్ధవిరామం ఆ సమన్వయాన్ని సహజంగా చూపిస్తుంది; ‘మరియు’ను ఉంచకపోయినా సంబంధం నిలుస్తుంది.
