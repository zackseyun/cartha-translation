id: GEN.36.2
reference: Genesis 36:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: עֵשָׂ֛ו לָקַ֥ח אֶת נָשָׁ֖י/ו מִ/בְּנ֣וֹת כְּנָ֑עַן אֶת עָדָ֗ה בַּת אֵילוֹן֙ הַֽ/חִתִּ֔י וְ/אֶת אָהֳלִֽיבָמָה֙ בַּת עֲנָ֔ה בַּת צִבְע֖וֹן הַֽ/חִוִּֽי־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/002.yaml
  text: 'Esau took his wives from the daughters of Canaan: Adah daughter of Elon the Hittite[a], and Oholibamah daughter of Anah, daughter of Zibeon the Hivite.'
translation:
  language: te
  text: 'ఏశావు కనాను కుమార్తెల నుండి తన భార్యలను తీసుకున్నాడు: హిత్తీయుడైన ఏలోను కుమార్తె ఆదాను, హివ్వీయుడైన[a] సిబ్యోను కుమార్తె అనా కుమార్తె ఒహోలీబామాను.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పాఠంలో ‘హివ్వీయుడు’ అని ఉంది. కొందరు వ్యాఖ్యాతలు సంబంధిత వంశావళులతో సమన్వయపరుస్తూ ఈ వంశ గుర్తింపును భిన్నంగా, ‘హోరీయుడు’ అని కూడా అర్థం చేసుకుంటారు.
    reason: alternative_reading
lexical_decisions:
- source_word: לָקַח
  choice: తీసుకున్నాడు
  rationale: హీబ్రూ క్రియకు ప్రాథమిక అర్థం ‘తీసుకున్నాడు.’ సందర్భంలో భార్యలుగా తీసుకోవడం స్పష్టమే; ‘పెళ్లి చేసుకున్నాడు’ అని విస్తరించకుండా మూలపదానికి దగ్గరగా ఉంచబడింది.
- source_word: נָשָׁיו
  choice: తన భార్యలను
  rationale: ఈ సందర్భంలో బహువచన నామవాచకం ఏశావు భార్యలను సూచిస్తుంది; స్వామ్యార్థక ప్రత్యయం ‘తన’తో సహజమైన తెలుగులో వ్యక్తమైంది.
- source_word: מִבְּנוֹת כְּנָעַן
  choice: కనాను కుమార్తెలలో నుండి
  rationale: ‘కనాను కుమార్తెలు’ అనే హీబ్రూ నుడికారాన్ని నిలుపుతూ, వారిలో నుండి భార్యలను తీసుకున్నాడనే భావాన్ని తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: בַּת
  choice: కుమార్తె
  rationale: వంశసంబంధాన్ని సూచించే నిర్మాణాన్ని రెండు చోట్లా ఒకే విధంగా అనువదించింది; అనా–సిబ్యోను సంబంధంలోని మూలపాఠ్య నిర్మాణం కూడా మార్చకుండా నిలిచింది.
- source_word: הַחִתִּי
  choice: హిత్తీయుడైన
  rationale: హిత్తీయ జాతి గుర్తింపును తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: אָהֳלִיבָמָה
  choice: ఒహోలీబామా
  rationale: హీబ్రూ పేరులోని ప్రారంభ ‘ఒహో’ ధ్వనిని ప్రతిబింబించే తెలుగు లిప్యంతరీకరణ.
- source_word: הַחִוִּי
  choice: హివ్వీయుడైన
  rationale: మసొరేటిక్ హీబ్రూ పాఠంలోని חִוִּי అనే జాతి పేరును ప్రధాన పాఠ్యంలో యథాతథంగా అనుసరిస్తుంది.
theological_decisions:
- issue: చివరి వాక్యభాగంలోని వంశ/జాతి గుర్తింపు
  choice: మసొరేటిక్ పాఠాన్ని అనుసరించి ‘హివ్వీయుడు’
  alternative: సంబంధిత వంశావళులతో సమన్వయపరుస్తూ ‘హోరీయుడు’ అని అర్థం చేసుకోవడం లేదా చదవడం
  rationale: మూల హీబ్రూ పాఠానికి ప్రాధాన్యమిస్తూ ‘హివ్వీయుడు’ను ప్రధాన పాఠ్యంలో ఉంచాం. సంబంధిత వంశావళుల్లో కనిపించే ఉద్రిక్తతను మౌనంగా సమన్వయపరచకుండా ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన వంశావళి శైలి వాడబడింది. ‘తీసుకున్నాడు’ అనే పదంతో మూలంలోని సంక్షిప్తతను నిలిపాం. పాదటిప్పణి గుర్తు అది వివరించే ‘హివ్వీయుడు’ వంశ గుర్తింపుకు అనుసంధానంగా ప్రధాన పాఠ్యంలో ఉంచబడింది.
