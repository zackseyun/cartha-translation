  rationale: మూలంలో స్పష్టంగా ఉన్న ‘దేశం/భూమి’ భావాన్ని కుదించకుండా నిలుపుతుంది.
- source_word: בָשְׂמַת אֵשֶׁת עֵשָׂו
  choice: ఏశావు భార్య బాశెమతు
  rationale: మాతృవంశాన్ని గుర్తించే అనుబంధ పదబంధాన్ని సహజమైన తెలుగు పదక్రమంలో అందిస్తుంది.
