  text: וְ/אֵ֗לֶּה בְּנֵ֤י רְעוּאֵל֙ בֶּן עֵשָׂ֔ו אַלּ֥וּף נַ֨חַת֙ אַלּ֣וּף זֶ֔רַח אַלּ֥וּף שַׁמָּ֖ה אַלּ֣וּף מִזָּ֑ה אֵ֣לֶּה אַלּוּפֵ֤י רְעוּאֵל֙ בְּ/אֶ֣רֶץ אֱד֔וֹם אֵ֕לֶּה בְּנֵ֥י בָשְׂמַ֖ת אֵ֥שֶׁת עֵשָֽׂו־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/017.yaml
  text: 'And these are the sons of Reuel[a], the son of Esau: chief Nahath, chief Zerah, chief Shammah, chief Mizzah. These are the chiefs of Reuel in the land of Edom. These are the sons of Basemath, Esau’s wife.'
translation:
  language: te
  text: 'మరియు వీరు ఏశావు కుమారుడైన రెయూయేలు కుమారులు: నాయకుడు[a] నహతు, నాయకుడు జెరహు, నాయకుడు షమ్మా, నాయకుడు మిజ్జా. వీరు ఎదోము దేశంలోని రెయూయేలు నాయకులు. వీరు ఏశావు భార్య బాశెమతు కుమారులు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘గోత్రనాయకుడు’ అని కూడా అనువదించవచ్చు. ఇక్కడ పదేపదే వాడిన హెబ్రీ పదం ఎదోమీయుల గోత్ర లేదా వంశ నాయకుణ్ణి సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: వీరు
  rationale: తెలుగులో వంశావళి జాబితాను సహజంగా పరిచయం చేస్తుంది; ముందున్న సందర్భంతో అనుసంధానం వాక్యక్రమంలోనే స్పష్టంగా ఉంది.
- source_word: בְּנֵי
  choice: కుమారులు
  rationale: పేర్లతో పేర్కొన్న పురుష సంతానాన్ని సూచిస్తున్నందున మూలంలోని లింగనిర్దిష్ట అర్థాన్ని నిలుపుతుంది.
- source_word: רְעוּאֵל בֶּן עֵשָׂו
  choice: ఏశావు కుమారుడైన రెయూయేలు
  rationale: హెబ్రీ వంశసంబంధ నిర్దేశాన్ని సహజమైన తెలుగు నిర్మాణంలో స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: אַלּוּף
  choice: నాయకుడు
  rationale: ఎదోమీయుల గోత్ర లేదా వంశ నాయకుణ్ణి సూచించే పదాన్ని ఆధునిక పాఠకులకు స్పష్టంగా, పాతబడిన బిరుదులు లేకుండా అందిస్తుంది; మరింత నిర్దిష్టమైన ప్రత్యామ్నాయం పాదసూచికలో ఇవ్వబడింది.
- source_word: נַחַת
  choice: నహతు
  rationale: హెబ్రీ వ్యక్తినామానికి తెలుగు లిప్యంతరీకరణ.
- source_word: זֶרַח
  choice: జెరహు
  rationale: హెబ్రీ వ్యక్తినామానికి తెలుగు లిప్యంతరీకరణ.
- source_word: שַׁמָּה
  choice: షమ్మా
  rationale: హెబ్రీ వ్యక్తినామంలోని ద్విత్వ వ్యంజనాన్ని ప్రతిబింబించే తెలుగు లిప్యంతరీకరణ.
- source_word: מִזָּה
  choice: మిజ్జా
  rationale: హెబ్రీ వ్యక్తినామంలోని ద్విత్వ వ్యంజనాన్ని ప్రతిబింబించే తెలుగు లిప్యంతరీకరణ.
- source_word: אֵלֶּה אַלּוּפֵי רְעוּאֵל
  choice: వీరు ... రెయూయేలు నాయకులు
  rationale: ముందు పేర్కొన్న జాబితాను సంగ్రహించే హెబ్రీ నిర్మాణాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
