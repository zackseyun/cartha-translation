  yaml_path: translation/ot/genesis/036/008.yaml
  text: So Esau settled in the hill country of Seir[a]; Esau is Edom.
translation:
  language: te
  text: అప్పుడు ఏశావు శేయీరు కొండప్రాంతంలో[a] నివసించాడు; ఏశావే ఎదోము.
  philosophy: optimal-equivalence
  footnotes:
