    text: లేదా, ‘శేయీరు పర్వతాల్లో’ లేదా ‘శేయీరు పర్వతంలో.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: నివసించాడు
  rationale: ישׁב అనే క్రియ ఇక్కడ కథనరూపంలో ఒక ప్రాంతంలో ఉండడాన్ని లేదా స్థిరంగా నివసించడాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘నివసించాడు’ సహజంగా ఉండి మూలార్థాన్ని కాపాడుతుంది.
- source_word: בְּהַר
  choice: కొండప్రాంతంలో
  rationale: הַר అనేది ఒకే కొండను గానీ కొండలతో కూడిన ప్రాంతాన్ని గానీ సూచించగలదు. శేయీరు ఇక్కడ భూభాగనామంగా ఉన్నందున ‘కొండప్రాంతంలో’ సందర్భానికి తగినది; ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: שֵׂעִיר
  choice: శేయీరు
  rationale: స్థలనామాన్ని తెలుగులో సుపరిచితమైన బైబిలు లిప్యంతరీకరణకు అనుగుణంగా ఇచ్చాం.
- source_word: עֵשָׂו
  choice: ఏశావు
  rationale: వ్యక్తినామాన్ని తెలుగులో సుపరిచితమైన బైబిలు లిప్యంతరీకరణకు అనుగుణంగా ఇచ్చాం.
- source_word: הוּא אֱדוֹם
  choice: ఏశావే ఎదోము
  rationale: క్రియలేని హీబ్రూ గుర్తింపు వాక్యాన్ని నేరుగా ప్రతిబింబిస్తుంది. ‘ఏశావే’ అనే రూపం అతడిని ఎదోముతో గుర్తించే బలాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: ఏశావు–ఎదోము గుర్తింపు
  choice: ఏశావే ఎదోము
  alternative: అంటే, ఏశావే ఎదోము / ఏశావు ఎదోము అనబడినవాడు
  rationale: మూలంలోని సంక్షిప్త గుర్తింపు వాక్యాన్ని వివరణాత్మక బిరుదుగా మార్చకుండా అలాగే ఉంచాం; ఇది వ్యక్తి మరియు అతని నుండి వచ్చిన ప్రజ/ప్రాంతం మధ్య ఉన్న ఉద్దేశపూర్వక గుర్తింపు ఉద్వేగాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సహజంగా, గౌరవప్రదంగా ఉండే శైలి. ‘కొండప్రాంతం’ ప్రాంతీయ భౌగోళిక భావాన్ని తెలియజేస్తుంది; మూలంలోని ప్రత్యామ్నాయ ఏకవచన/బహువచన పర్వత భావాలు పాదసూచికలో భద్రపరచబడ్డాయి.
