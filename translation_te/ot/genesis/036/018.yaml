id: GEN.36.18
reference: Genesis 36:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אֵ֗לֶּה בְּנֵ֤י אָהֳלִֽיבָמָה֙ אֵ֣שֶׁת עֵשָׂ֔ו אַלּ֥וּף יְע֛וּשׁ אַלּ֥וּף יַעְלָ֖ם אַלּ֣וּף קֹ֑רַח אֵ֣לֶּה אַלּוּפֵ֞י אָֽהֳלִיבָמָ֛ה בַּת עֲנָ֖ה אֵ֥שֶׁת עֵשָֽׂו־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/018.yaml
  text: 'And these were the sons of Oholibamah[a], Esau’s wife: chief Jeush, chief Jalam, chief Korah. These were the chiefs of Oholibamah daughter of Anah, Esau’s wife.'
translation:
  language: te
  text: 'ఏశావు భార్యయైన అహొలీబామా కుమారులు వీరు: నాయకుడు[a] యెయూషు, నాయకుడు యాలాము, నాయకుడు కోరహు. వీరు అనా కుమార్తెయూ ఏశావు భార్యయూ అయిన అహొలీబామాకు చెందిన నాయకులు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వంశ నాయకుడు.” ఇక్కడి హీబ్రూ పదం ఎదోమీయ సమూహాలు లేదా వంశాల నాయకులను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: కుమారులు
  rationale: ఇక్కడ పేర్లు చెప్పబడిన మగ సంతానాన్ని సూచించే హీబ్రూ పురుష బహువచనానికి నేరమైన, సహజమైన తెలుగు రూపం.
- source_word: אֵשֶׁת עֵשָׂו
  choice: ఏశావు భార్య
  rationale: హీబ్రూ సమాస సంబంధాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది; రెండు చోట్ల ఒకే విధంగా అనువదించబడింది.
- source_word: אַלּוּף
  choice: నాయకుడు
  rationale: ఆదికాండం 36లో ఎదోమీయ వంశ లేదా గోత్ర సమూహపు అధిపతిని సూచిస్తుంది. 'నాయకుడు' సామాన్య పాఠకులకు స్పష్టంగా ఉండి, హీబ్రూ పదం కంటే అధిక వివరణను ప్రధాన పాఠ్యంలో చేర్చదు.
- source_word: יְעוּשׁ
  choice: యెయూషు
  rationale: హీబ్రూ పేరుకు తెలుగు ధ్వన్యంతరీకరణ.
- source_word: יַעְלָם
  choice: యాలాము
  rationale: హీబ్రూ పేరుకు తెలుగు ధ్వన్యంతరీకరణ.
- source_word: קֹרַח
  choice: కోరహు
  rationale: హీబ్రూ పేరుకు తెలుగు ధ్వన్యంతరీకరణ.
- source_word: אֵלֶּה אַלּוּפֵי
  choice: వీరు ... చెందిన నాయకులు
  rationale: వాక్యంలో ముందుగా పేర్కొన్న కుమారులతో అహొలీబామాకు ఉన్న సంబంధాన్ని తెలుగులో సహజంగా తెలియజేస్తూనే, హీబ్రూలో లేని 'వంశస్థులు' అనే భావాన్ని స్పష్టంగా చేర్చకుండా ఉంటుంది.
- source_word: בַּת עֲנָה
  choice: అనా కుమార్తె
  rationale: హీబ్రూ సమాసానికి సూటియైన తెలుగు అనువాదం.
- source_word: וְאֵלֶּה ... אֵלֶּה
  choice: వీరు ... వీరు
  rationale: పునరుక్త నిర్దేశక పదాలతో ఏర్పడిన వంశావళి చట్రాన్ని నిలుపుతుంది; తెలుగులో మొదటి 'మరియు' అవసరం లేకుండా సహజ వాక్యారంభం ఎంచుకోబడింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన వంశావళి శైలి. వ్యక్తి పేర్లను హీబ్రూ ధ్వనులకు సమీపంగా ఇచ్చాం. ప్రధాన పాఠ్యంలో 'నాయకుడు' అనే సాధారణ పదాన్ని ఉంచి, మరింత నిర్దిష్టమైన వంశపరమైన అర్థాన్ని పాదసూచికలో తెలిపాం.
