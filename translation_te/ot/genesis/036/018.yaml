  to: 'ఏశావు భార్యయైన అహొలీబామా కుమారులు వీరు: నాయకుడు[a] యెయూషు, నాయకుడు యాలాము, నాయకుడు కోరహు. వీరు అనా కుమార్తెయూ ఏశావు భార్యయూ అయిన అహొలీబామాకు చెందిన నాయకులు.'
