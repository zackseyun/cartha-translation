source:
  edition: WLC
  text: אֵ֤לֶּה בְנֵֽי שֵׂעִיר֙ הַ/חֹרִ֔י יֹשְׁבֵ֖י הָ/אָ֑רֶץ לוֹטָ֥ן וְ/שׁוֹבָ֖ל וְ/צִבְע֥וֹן וַ/עֲנָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/020.yaml
  text: 'These are the sons of Seir the Horite[a], the inhabitants of the land: Lotan, Shobal, Zibeon, and Anah.'
translation:
  language: te
  text: 'దేశ నివాసులైన హోరీయుడైన సెయీరు కుమారులు వీరు: లోతాను, షోబాలు, సిబ్యోను, అనా.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దేశంలో నివసించినవారు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: వీరు
  rationale: వంశావళి జాబితాను పరిచయం చేసే హీబ్రూ సూచక సర్వనామానికి సహజమైన తెలుగు రూపం.
- source_word: בְנֵי
  choice: కుమారులు
  rationale: ఇక్కడ పేరుపేరునా పురుషులను పేర్కొంటున్నందున, వంశస్థులు అనే విస్తృత భావం కంటే మూలంలోని కుటుంబ సంబంధాన్ని నేరుగా నిలుపుతుంది.
- source_word: שֵׂעִיר
  choice: శేయీరు
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు ధ్వన్యంతరీకరణలో ఇచ్చాం.
- source_word: הַחֹרִי
  choice: హోరీయుడైన
  rationale: శేయీరు జాతి లేదా సమూహ గుర్తింపును తెలిపే హీబ్రూ నిస్బా రూపాన్ని వ్యక్తికి అన్వయించే సహజ తెలుగు రూపం.
- source_word: יֹשְׁבֵי הָאָרֶץ
  choice: ఆ దేశ నివాసులైన
  rationale: నివసించేవారు అనే క్రియాత్మక భావాన్ని, స్థిర నివాసులు అనే సందర్భార్థాన్ని సహజంగా వ్యక్తం చేస్తుంది; ఈ పదబంధం జాబితాలోని కుమారులను సూచించేలా మూల వాక్య క్రమానికి దగ్గరగా ఉంచబడింది.
- source_word: לוֹטָן
  choice: లోతాను
  rationale: హీబ్రూ వ్యక్తినామ ధ్వన్యంతరీకరణ.
- source_word: שׁוֹבָל
  choice: శోబాలు
  rationale: హీబ్రూ వ్యక్తినామ ధ్వన్యంతరీకరణ.
- source_word: צִבְעוֹן
  choice: సిబ్యోను
  rationale: హీబ్రూ వ్యక్తినామ ధ్వన్యంతరీకరణ.
- source_word: עֲנָה
  choice: అనా
  rationale: హీబ్రూ వ్యక్తినామ ధ్వన్యంతరీకరణ.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళికి తగిన గంభీరమైనప్పటికీ సులభంగా అర్థమయ్యే శైలి. పేర్లు హీబ్రూ ఉచ్చారణకు దగ్గరగా ధ్వన్యంతరీకరించబడ్డాయి. ప్రధాన పాఠంలో హీబ్రూ పదక్రమానికి దగ్గరగా ఉండి, తెలుగు సహజత్వం కోసం విశేషణ సముదాయాన్ని ముందుకు తెచ్చాం.
