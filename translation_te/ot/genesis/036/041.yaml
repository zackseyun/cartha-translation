lexical_decisions:
- source_word: אַלּוּף
  choice: అధిపతి
  rationale: ఆదికాండం 36లో ఈ పదం ఎదోమీయుల గోత్ర లేదా వంశ నాయకుణ్ణి సూచిస్తుంది. ‘అధిపతి’ సంక్షిప్తంగా, గౌరవప్రదంగా ఉండి, మూలంలోని జాబితా శైలిని నిలుపుతుంది.
- source_word: אָהֳלִיבָמָה
  choice: ఒహొలీబామా
  rationale: హీబ్రూ పేరులోని ధ్వనులకు దగ్గరగా ఉన్న తెలుగు లిప్యంతరీకరణ.
- source_word: אֵלָה
  choice: ఏలా
  rationale: ఇక్కడ ఇది బిరుదు లేదా వివరణాత్మక పదం కాక వ్యక్తినామం; హీబ్రూ ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించబడింది.
- source_word: פִּינֹן
  choice: పీనోను
  rationale: హీబ్రూ వ్యక్తినామానికి సహజమైన తెలుగు లిప్యంతరీకరణ; దీర్ఘ ‘ఈ’ మరియు చివరి నూన్ ధ్వనిని ప్రతిబింబిస్తుంది.
