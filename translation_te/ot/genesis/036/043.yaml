  text: אַלּ֥וּף מַגְדִּיאֵ֖ל אַלּ֣וּף עִירָ֑ם אֵ֣לֶּה אַלּוּפֵ֣י אֱד֗וֹם לְ/מֹֽשְׁבֹתָ/ם֙ בְּ/אֶ֣רֶץ אֲחֻזָּתָ֔/ם ה֥וּא עֵשָׂ֖ו אֲבִ֥י אֱדֽוֹם׀׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/043.yaml
  text: Chief Magdiel[a], chief Iram. These are the chiefs of Edom according to their settlements in the land of their possession. This is Esau[d][c][b], the father of Edom.
translation:
  language: te
  text: నాయకుడైన మగ్దీయేలు, నాయకుడైన ఈరాము. వీరే తమ స్వాధీనంలోని భూమిలోని తమ నివాసస్థలాల ప్రకారం ఉన్న ఎదోము నాయకులు.[a] ఇతడే ఏశావు, ఎదోముకు తండ్రి.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నాయకులు’ అనే హీబ్రూ పదానికి ‘గోత్ర నాయకులు’ లేదా ‘వంశ నాయకులు’ అని కూడా అర్థం కావచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘ఎదోముకు తండ్రి’; అంటే ఏశావు ఎదోమీయుల పూర్వికుడు. లేదా, ‘అతడే ఏశావు.’
    reason: cultural_note
lexical_decisions:
- source_word: אַלּוּף
  choice: నాయకుడు
  rationale: ఆదికాండం 36లో ఈ పదం ఎదోమీయుల గోత్ర లేదా వంశ నాయకులను సూచిస్తుంది. ‘నాయకుడు’ ఆధునిక తెలుగులో సహజంగా ఉండి, నాయకత్వ బిరుదును స్పష్టంగా తెలియజేస్తుంది.
- source_word: מַגְדִּיאֵל
  choice: మగ్దీయేలు
  rationale: వ్యక్తి పేరును హీబ్రూ ఉచ్చారణకు సమీపంగా లిప్యంతరీకరించాం.
- source_word: עִירָם
  choice: ఈరాము
  rationale: వ్యక్తి పేరును హీబ్రూ ఉచ్చారణకు సమీపంగా లిప్యంతరీకరించాం.
- source_word: לְמֹשְׁבֹתָם
  choice: తమ నివాస ప్రాంతాల ప్రకారం
  rationale: ఇక్కడ לְ వర్గీకరణ లేదా క్రమాన్ని సూచిస్తుంది; కాబట్టి నాయకులు వారి నివాస ప్రాంతాల ప్రకారం పేర్కొనబడ్డారనే భావాన్ని ఈ ప్రయోగం సహజంగా అందిస్తుంది.
- source_word: בְּאֶרֶץ אֲחֻזָּתָם
  choice: తమ స్వాధీన దేశంలోని
  rationale: אֲחֻזָּה స్వాధీన ఆస్తి లేదా భూభాగాన్ని సూచిస్తుంది. తెలుగు వాక్య నిర్మాణంలో ‘తమ స్వాధీన దేశంలోని’ మూలంలోని నామవాచక భావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: הוּא עֵשָׂו
  choice: ఇతడే ఏశావు
  rationale: הוּא ఇచ్చే గుర్తింపు మరియు ఉద్ఘాటనను ‘ఇతడే’ నిలుపుతుంది; చివరిగా పేర్కొన్న ఈరామును సూచిస్తున్నట్టు అపార్థం కాకుండా, మొత్తం జాబితాకు మూలమైన ఏశావును ముగింపు వాక్యం గుర్తిస్తుంది.
- source_word: אֲבִי אֱדֹם
  choice: ఎదోమీయుల మూలపితరుడు
  rationale: אָב ఇక్కడ తక్షణ తండ్రి కంటే జాతికి మూలపురుషుడనే వంశావళి భావంలో ఉంది. ‘ఎదోమీయుల మూలపితరుడు’ ఆధునిక పాఠకునికి ఆ ఉద్దేశాన్ని స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ఏశావును ఎదోము తండ్రిగా పేర్కొనే వంశావళి బిరుదు
  choice: ఎదోమీయుల మూలపితరుడు
  alternative: ఎదోము తండ్రి
  rationale: ఈ మాట ఏశావును ఎదోమీయుల పూర్వికునిగా గుర్తిస్తుంది; జీవశాస్త్రీయ తండ్రి అనే పరిమిత అర్థాన్ని నివారిస్తూ, అదనపు సిద్ధాంతార్థాన్ని చేర్చకుండా జాతి-వంశ సంబంధాన్ని స్పష్టం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన వంశావళి శైలిని పాటించాం. పేర్ల జాబితాలోని సంక్షిప్తతను నిలిపి, చివరి గుర్తింపు వాక్యం ఈరామును కాక ఏశావునే సూచిస్తుందని సహజంగా స్పష్టం చేశాం. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
