revisions:
- from: మగ్దీయేలు నాయకుడు, ఈరాము నాయకుడు. వీరు తమ స్వాధీన దేశంలోని తమ నివాస ప్రాంతాల ప్రకారం ఎదోము నాయకులు.[a] ఇతడే ఏశావు,[b] ఎదోమీయుల మూలపితరుడు.[c]
  to: నాయకుడైన మగ్దీయేలు, నాయకుడైన ఈరాము. వీరే తమ స్వాధీనంలోని భూమిలోని తమ నివాసస్థలాల ప్రకారం ఉన్న ఎదోము నాయకులు.[a] ఇతడే ఏశావు, ఎదోముకు తండ్రి.[b]
  rationale: The revision makes the two named individuals unmistakably the chiefs, renders the land-possession phrase without implying a modern nation-state, and preserves the Hebrew genealogical idiom ‘father of Edom’ in the text with an explanatory footnote. The identification ‘ఇతడే ఏశావు’ continues to mark Esau as the concluding referent of the genealogy.
