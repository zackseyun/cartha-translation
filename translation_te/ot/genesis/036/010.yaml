source:
  edition: WLC
  text: אֵ֖לֶּה שְׁמ֣וֹת בְּנֵֽי עֵשָׂ֑ו אֱלִיפַ֗ז בֶּן עָדָה֙ אֵ֣שֶׁת עֵשָׂ֔ו רְעוּאֵ֕ל בֶּן בָּשְׂמַ֖ת אֵ֥שֶׁת עֵשָֽׂו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/010.yaml
  text: 'These are the names of Esau’s sons: Eliphaz son of Adah[a], Esau’s wife; Reuel son of Basemath[b], Esau’s wife.'
translation:
  language: te
  text: 'ఏశావు కుమారుల పేర్లు ఇవి: ఏశావు భార్యయైన ఆదాకు పుట్టిన ఎలీఫజు; ఏశావు భార్యయైన బాసెమతుకు పుట్టిన రెయూయేలు.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה שְׁמוֹת בְּנֵי עֵשָׂו
  choice: ఏశావు కుమారుల పేర్లు ఇవి
  rationale: హీబ్రూ వంశావళి పరిచయ వాక్యాన్ని సహజమైన ఆధునిక తెలుగు పదక్రమంలో అందిస్తుంది; בְּנֵי ఇక్కడ స్పష్టంగా పురుష బహువచనమైన ‘కుమారులు’.
- source_word: אֱלִיפַז
  choice: ఎలీఫజు
  rationale: హీబ్రూ వ్యక్తినామానికి సమీపంగా, తెలుగులో సులభంగా ఉచ్చరించగల లిప్యంతరీకరణ.
- source_word: בֶּן עָדָה
  choice: ఆదాకు పుట్టిన
  rationale: బెన్ అనే ప్రత్యక్ష పుత్రసంబంధాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది; జాబితాలోని సంబంధాన్ని అస్పష్టంగా చేయదు.
- source_word: אֵשֶׁת עֵשָׂו
  choice: ఏశావు భార్య
  rationale: హీబ్రూ సమాస పదబంధానికి నేరమైన, సహజమైన తెలుగు సమానం; మూలంలోని రెండుసార్ల పునరుక్తి నిలుపబడింది.
- source_word: רְעוּאֵל
  choice: రెయూయేలు
  rationale: హీబ్రూ רְעוּאֵל ధ్వనిరూపాన్ని ప్రతిబింబించే తెలుగు లిప్యంతరీకరణ.
- source_word: בֶּן בָּשְׂמַת
  choice: బాశెమతుకు పుట్టిన
  rationale: మొదటి పుత్రసంబంధ నిర్మాణంతో సమానంగా అనువదించి వంశావళి సమాంతరతను నిలుపుతుంది.
- source_word: בָּשְׂמַת
  choice: బాశెమతు
  rationale: హీబ్రూ వ్యక్తినామం בָּשְׂמַת కు ధ్వన్యనుసారమైన తెలుగు రూపం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన వంశావళి శైలి. హీబ్రూ మూలంలో ‘ఏశావు భార్య’ రెండుసార్లు రావడం ఉద్దేశపూర్వకంగా అలాగే నిలుపబడింది. ఇంగ్లీషు సంప్రదింపుపాఠంలోని [a] గమనిక మూలపదానికి నిజమైన ప్రత్యామ్నాయార్థం కాక, అదే భావానికి ఇంగ్లీషు పదక్రమ భేదం మాత్రమే కనుక తెలుగు పాఠంలో చేర్చలేదు; [b] గమనిక వివరించే పునరుక్తి పాఠంలోనే స్పష్టంగా ఉంది కాబట్టి ప్రత్యేక పాదసూచిక అవసరం లేదు.
