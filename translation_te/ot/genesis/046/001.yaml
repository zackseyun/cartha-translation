source:
  edition: WLC
  text: וַ/יִּסַּ֤ע יִשְׂרָאֵל֙ וְ/כָל אֲשֶׁר ל֔/וֹ וַ/יָּבֹ֖א בְּאֵ֣רָ/ה שָּׁ֑בַע וַ/יִּזְבַּ֣ח זְבָחִ֔ים לֵ/אלֹהֵ֖י אָבִ֥י/ו יִצְחָֽק־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/001.yaml
  text: So Israel set out with all that belonged to him and came to Beersheba[a], and he offered sacrifices to the God of his father Isaac.
translation:
  language: te
  text: ఇశ్రాయేలు తనకు చెందిన సమస్తంతో[a] బయలుదేరి బేర్షెబాకు వచ్చాడు. అతడు తన తండ్రియైన ఇస్సాకు దేవునికి బలులు అర్పించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘తనకు కలిగినదంతటితో.’ హీబ్రూ పదబంధం అతనికి చెందిన సమస్తాన్ని విస్తృతంగా సూచిస్తుంది; ఇందులో ఇంటివారు, ఆస్తులు కూడా ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסַּע
  choice: బయలుదేరి
  rationale: נסע కథన సందర్భంలో మకాం ఎత్తి ప్రయాణం ప్రారంభించడాన్ని సూచిస్తుంది; ‘బయలుదేరి’ ఆధునిక తెలుగులో సహజంగా ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: יִשְׂרָאֵל
  choice: ఇశ్రాయేలు
  rationale: మూలపాఠం ‘యాకోబు’ కాకుండా ఒడంబడిక పేరైన ‘ఇశ్రాయేలు’ను వాడుతుంది; కథనంలోని ఈ ఎంపికను అలాగే నిలిపాం.
- source_word: וְכָל אֲשֶׁר לוֹ
  choice: తనకు చెందిన వారందరితోను, తనకు కలిగినదంతటితోను
  rationale: ఈ విస్తృత హీబ్రూ పదబంధం కుటుంబ/ఇంటి వారినీ ఆస్తిపాస్తులనూ కలుపుకొని ఉండవచ్చు. తెలుగులో కేవలం వస్తువులనే సూచిస్తున్నట్టు కాకుండా రెండు పరిధులనూ సహజంగా వ్యక్తం చేశాం.
- source_word: וַיָּבֹא
  choice: వచ్చాడు
  rationale: בוא అనే సాధారణ క్రియకు గమ్యస్థానంతో కూడిన సహజ తెలుగు రూపం ‘వచ్చాడు’.
- source_word: בְּאֵרָה שָּׁבַע
  choice: బేర్షెబాకు
  rationale: స్థలనామాన్ని ప్రామాణిక తెలుగు లిప్యంతరీకరణలో ఇచ్చి, దిశార్థక ప్రత్యయాన్ని ‘-కు’తో వ్యక్తం చేశాం.
- source_word: וַיִּזְבַּח זְבָחִים
  choice: బలులు అర్పించాడు
  rationale: హీబ్రూలోని సమానమూల క్రియా-నామ నిర్మాణాన్ని అక్షరార్థంగా పునరుక్తి చేయకుండా, బలిపూజ సందర్భానికి సహజమైన తెలుగు ప్రయోగంతో అందించాం.
- source_word: לֵאלֹהֵי
  choice: దేవునికి
  rationale: ఇక్కడ ל బలి ఎవరికి అర్పించబడిందో సూచిస్తుంది; తెలుగులో సంప్రదాన విభక్తి ‘-కి’ దీనిని స్పష్టంగా తెలియజేస్తుంది.
- source_word: אָבִיו יִצְחָק
  choice: తన తండ్రి ఇస్సాకు
  rationale: నిర్మాణం ఇస్సాకును ఇశ్రాయేలు తండ్రిగా నిర్దిష్టంగా గుర్తిస్తుంది; అదనపు వివరణ లేకుండా అదే సంబంధాన్ని నిలిపాం.
theological_decisions:
- issue: ‘తన తండ్రి ఇస్సాకు దేవుడు’ అనే నిర్దిష్ట పితృపురుష సంబంధం
  choice: తన తండ్రి ఇస్సాకు దేవునికి
  alternative: తన పితరుల దేవునికి
  rationale: హీబ్రూ పాఠం పితరులందరినీ సాధారణంగా పేర్కొనకుండా ఇస్సాకును మాత్రమే పేరుపెట్టి చెబుతుంది. బేర్షెబాతో ఇస్సాకుకు ఉన్న కథన సంబంధాన్ని, పితృపరంపర కొనసాగింపును వ్యాఖ్యానాత్మకంగా విస్తరించకుండా నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. וְכָל אֲשֶׁר לוֹ యొక్క వ్యక్తులు-ఆస్తులు రెండింటినీ కలుపుకొనే విస్తృతిని ప్రధాన పాఠంలోనే స్పష్టం చేసినందున పాదసూచిక అవసరం లేదు. ‘అక్కడ’ మూలంలో ప్రత్యేక పదంగా లేకపోయినా, వరుస క్రియల స్థల సంబంధాన్ని తెలుగులో సహజంగా చూపే స్వల్ప సందర్భసూచకం.
