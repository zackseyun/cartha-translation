revisions:
- from: యోసేపుకు ఐగుప్తు దేశంలో మనష్షే, ఎఫ్రాయిము పుట్టారు. వీరిని ఓను[a] యాజకుడైన పోతీఫెర కుమార్తె ఆసెనతు అతనికి కనింది.
  to: యోసేపుకు ఐగుప్తు దేశంలో మనష్షే, ఎఫ్రాయిము పుట్టారు; వీరిని ఓను[a] యాజకుడైన పోతీఫెరా కుమార్తె ఆసెనతు అతనికి కనింది.
  rationale: Only the transliteration of Potiphera has been corrected. The revised punctuation keeps the second clause explicitly linked to Manasseh and Ephraim, as in the Hebrew relative clause, without changing the meaning.
