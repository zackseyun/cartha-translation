  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּוָּלֵ֣ד לְ/יוֹסֵף֮ בְּ/אֶ֣רֶץ מִצְרַיִם֒ אֲשֶׁ֤ר יָֽלְדָה לּ/וֹ֙ אָֽסְנַ֔ת בַּת פּ֥וֹטִי פֶ֖רַע כֹּהֵ֣ן אֹ֑ן אֶת מְנַשֶּׁ֖ה וְ/אֶת אֶפְרָֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/020.yaml
  text: To Joseph were born in the land of Egypt Manasseh and Ephraim[a], whom Asenath daughter of Potiphera, priest of On[b], bore to him.
translation:
  language: te
  text: యోసేపుకు ఐగుప్తు దేశంలో మనష్షే, ఎఫ్రాయిము పుట్టారు; వీరిని ఓను[a] యాజకుడైన పోతీఫెరా కుమార్తె ఆసెనతు అతనికి కనింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఓను అనేది తరువాత గ్రీకులో హెలియోపొలిస్ అని పిలువబడిన ఐగుప్తు నగరం.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּוָּלֵד לְיוֹסֵף
  choice: యోసేపుకు … పుట్టారు
  rationale: ילד నిఫ్అల్ రూపం జననాన్ని కర్మణి భావంలో తెలియజేస్తుంది. క్రియారూపం ఏకవచనంగా ఉన్నా, తరువాత ఇద్దరు కుమారులు పేర్కొనబడినందున ఆధునిక తెలుగులో సహజమైన బహువచన క్రియను వాడాం.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: ఐగుప్తు దేశంలో
  rationale: אֶרֶץ అనే ‘దేశం/భూమి’ పదాన్ని స్పష్టంగా నిలుపుతూ, తెలుగులో స్థిరపడిన ‘ఐగుప్తు’ రూపాన్ని వాడాం.
- source_word: אֲשֶׁר יָלְדָה לּוֹ
  choice: వీరిని … అతనికి కనింది
  rationale: సాపేక్ష వాక్యం ఇద్దరు కుమారులనే సూచిస్తుందని స్పష్టంచేస్తూ, తల్లి ప్రసవించిన క్రియను మరియు לּוֹ లోని ‘అతనికి’ సంబంధాన్ని నిలిపాం.
- source_word: אָסְנַת
  choice: ఆసెనతు
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగులో సులభంగా పలికే లిప్యంతరీకరణతో ఇచ్చాం.
- source_word: בַּת פּוֹטִי פֶרַע
  choice: పోతీఫెర కుమార్తె
  rationale: నిర్మాణ సంబంధాన్ని సహజమైన తెలుగు బంధుత్వ పదబంధంగా అనువదించాం.
- source_word: כֹּהֵן אֹן
  choice: ఓను యాజకుడు
  rationale: כֹּהֵן ను ‘యాజకుడు’గా అనువదించి, אֹן స్థలనామాన్ని అనువదించకుండా లిప్యంతరీకరించాం.
- source_word: אֶת מְנַשֶּׁה וְאֶת אֶפְרָיִם
  choice: మనష్షే, ఎఫ్రాయిము
  rationale: కర్మసూచక אֶת పదాలను ప్రత్యేకంగా అనువదించకుండా, ఇద్దరి పేర్లను తెలుగు బైబిలు వాడుకకు తగిన రూపాల్లో లిప్యంతరీకరించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని వాడాం. మూలంలోని మొదటి జనన ప్రకటనను, దాని తరువాతి సాపేక్ష వాక్యాన్ని రెండు తెలుగు వాక్యాలుగా విభజించడం ద్వారా సహజత్వాన్ని మెరుగుపరుస్తూనే భావ సంబంధాన్ని నిలిపాం.
