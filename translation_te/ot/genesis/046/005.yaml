translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి. ‘లేచాడు’ అనే హెబ్రీ అక్షరార్థం కంటే ప్రయాణ సందర్భంలోని సహజ భావమైన ‘బయలుదేరాడు’ వాడాం. ‘ఇశ్రాయేలు కుమారులు’ అని ఉంచి, ఇది జాతిని సాధారణంగా కాక యాకోబు కుమారులను సూచిస్తుందనే సందర్భార్థాన్ని కాపాడాం.
