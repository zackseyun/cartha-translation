source:
  edition: WLC
  text: וַ/יָּ֥קָם יַעֲקֹ֖ב מִ/בְּאֵ֣ר שָׁ֑בַע וַ/יִּשְׂא֨וּ בְנֵֽי יִשְׂרָאֵ֜ל אֶת יַעֲקֹ֣ב אֲבִי/הֶ֗ם וְ/אֶת טַפָּ/ם֙ וְ/אֶת נְשֵׁי/הֶ֔ם בָּ/עֲגָל֕וֹת אֲשֶׁר שָׁלַ֥ח פַּרְעֹ֖ה לָ/שֵׂ֥את אֹתֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/005.yaml
  text: Then Jacob set out from Beersheba[a], and the sons of Israel carried Jacob their father, their little ones[b], and their wives in the wagons that Pharaoh had sent to carry him.
translation:
  language: te
  text: అప్పుడు యాకోబు బెయేర్షెబా నుండి బయలుదేరాడు.[a] ఇశ్రాయేలు కుమారులు తమ తండ్రియైన యాకోబును, తమ చిన్నపిల్లలను, తమ భార్యలను, యాకోబును తీసుకెళ్లడానికి ఫరో పంపించిన బండ్లలో తీసుకెళ్లారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “బెయేర్షెబా నుండి లేచాడు.” హెబ్రీ క్రియ అక్షరార్థంగా “లేచాడు”; అయితే ప్రయాణ సందర్భంలో అది అక్కడి నుండి బయలుదేరాడనే అర్థాన్ని ఇస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: బయలుదేరాడు
  rationale: మూల క్రియ అక్షరార్థంగా ‘లేచాడు’ అని ఉన్నా, מן + స్థలనామంతో కూడిన ప్రయాణ సందర్భంలో ఒక ప్రదేశం నుండి బయలుదేరడాన్ని సూచిస్తుంది.
- source_word: מִבְּאֵר שָׁבַע
  choice: బెయేర్షెబా నుండి
  rationale: స్థలనామాన్ని ఆధునిక తెలుగు లిప్యంతరీకరణలో ఇచ్చి, מִן ఉపసర్గను ‘నుండి’గా నేరుగా అనువదించాం.
- source_word: וַיִּשְׂאוּ
  choice: ఎక్కించుకొని తీసుకెళ్లారు
  rationale: נשׂא అంటే మోయడం లేదా తీసుకెళ్లడం. వ్యక్తులను బండ్లలో రవాణా చేస్తున్న సందర్భాన్ని సహజ తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: ఈ సందర్భంలో ఈ పదబంధం ఇశ్రాయేలు అనే యాకోబు యొక్క కుమారులనే ప్రత్యేకంగా సూచిస్తుంది; కాబట్టి సాధారణ జాతీయార్థమైన ‘ఇశ్రాయేలీయులు’ కంటే ఇది కచ్చితమైనది.
- source_word: אֲבִיהֶם
  choice: తమ తండ్రి
  rationale: యాకోబుతో కుమారుల సంబంధాన్ని తెలిపే సహజ తెలుగు స్వకీయ సర్వనామ రూపం.
- source_word: טַפָּם
  choice: తమ చిన్నపిల్లలను
  rationale: טַף ముఖ్యంగా చిన్నపిల్లలను, కొన్నిసార్లు ఆధారపడిన కుటుంబ సభ్యులను సూచిస్తుంది; ఇక్కడ ‘చిన్నపిల్లలు’ దాని ప్రధాన భావాన్ని నిలుపుతుంది.
- source_word: נְשֵׁיהֶם
  choice: తమ భార్యలను
  rationale: కుటుంబ ప్రయాణ సందర్భంలో נָשִׁים అనే పదానికి ‘భార్యలు’ అనే అర్థమే సహజమైనది.
- source_word: בָּעֲגָלוֹת
  choice: బండ్లలో
  rationale: עֲגָלוֹת అంటే సరుకు లేదా మనుషులను తరలించే చక్రాల బండ్లు; ‘బండ్లు’ సాధారణ ఆధునిక తెలుగులో సహజంగా ఉంటుంది.
- source_word: אֲשֶׁר שָׁלַח פַּרְעֹה
  choice: ఫరో పంపించిన
  rationale: బండ్లను ఫరో ముందే పంపించాడనే సంబంధాన్ని తెలుగు విశేషణ క్రియారూపం సహజంగా తెలియజేస్తుంది.
- source_word: לָשֵׂאת אֹתוֹ
  choice: తీసుకెళ్లడానికి
  rationale: ఇది ఉద్దేశార్థక క్రియారూపం; ఏకవచన ప్రత్యయం సహజంగా యాకోబును సూచిస్తుంది. తెలుగు వాక్యంలో ‘యాకోబును’ ముందే స్పష్టంగా ఉండటంతో ఉద్దేశాన్ని సహజంగా తెలిపాం.
