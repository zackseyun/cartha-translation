  yaml_path: translation/ot/genesis/046/022.yaml
  text: 'These were the sons of Rachel who were born to Jacob: fourteen persons in all[a].'
translation:
  language: te
  text: యాకోబుకు పుట్టిన రాహేలు కుమారులు వీరే—మొత్తం పద్నాలుగు మంది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీలో అక్షరార్థంగా, “మొత్తం ప్రాణం/వ్యక్తి—పద్నాలుగు”; ఇది మొత్తం వ్యక్తుల సంఖ్య పద్నాలుగు అని తెలిపే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: వీరే
  rationale: వంశావళి జాబితాను సంగ్రహిస్తూ చూపించే హెబ్రీ పదాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: בְּנֵי רָחֵל
  choice: రాహేలు కుమారులు
  rationale: మూలంలోని ‘రాహేలు కుమారులు’ అనే లింగసూచక రూపాన్ని నిలుపుతుంది; ఇక్కడ ముందున్న వంశావళి వరుసను సూచిస్తుంది.
- source_word: אֲשֶׁר יֻלַּד לְיַעֲקֹב
  choice: యాకోబుకు పుట్టిన
  rationale: ילד క్రియ యొక్క పరోక్ష కర్మణి భావాన్నీ, לְ ద్వారా తెలిపిన తల్లిదండ్రి సంబంధాన్నీ సహజమైన తెలుగు బంధక రూపంలో అందిస్తుంది.
- source_word: כָּל נֶפֶשׁ
  choice: మొత్తం ... మంది
  rationale: జనగణన, వంశావళి సందర్భంలో נֶפֶשׁ వ్యక్తులను లెక్కించే ప్రయోగం; ‘ఆత్మలు’ అని అనువదిస్తే ఇక్కడ లేని ప్రత్యేక వేదాంత భావం కలగవచ్చు.
- source_word: אַרְבָּעָה עָשָׂר
  choice: పద్నాలుగు
  rationale: సంఖ్యను సాధారణ ఆధునిక తెలుగు రూపంలో నేరుగా అనువదిస్తుంది.
