base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/013.yaml
  text: 'And the sons of Issachar: Tola[a], Puvah, Job[b], and Shimron.'
translation:
  language: te
  text: 'ఇశ్శాఖారు కుమారులు: తోలా, పువ్వా[a], యోబు[b], షిమ్రోను.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఈ పేరును కొన్ని సంప్రదాయాలలో “పూవా” అని కూడా రాస్తారు.
    reason: lexical_alternative
  - marker: b
    text: 1 దినవృత్తాంతములు 7:1లో “యాషూబు” అని ఉంది.
    reason: cross_reference
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: కుమారులు
  rationale: בְּנֵי అనేది ‘కుమారులు’ అనే అర్థమిచ్చే నిర్మాణ బహువచనం. వంశావళి జాబితాలో ఇది సహజమైన, నేరమైన అనువాదం. ముందున్న וּ ఈ కొనసాగుతున్న జాబితా నిర్మాణాన్ని సూచిస్తుంది; తెలుగులో వాక్యారంభంలో ‘మరియు’ చేర్చకుండా కూడా ఆ కొనసాగింపు సహజంగా వ్యక్తమవుతుంది.
- source_word: יִשָׂשכָר
  choice: ఇశ్శాఖారు
  rationale: వ్యక్తి పేరు; హీబ్రూ రూపాన్ని అనుసరించి, తెలుగులో ప్రాచుర్యంలో ఉన్న బైబిలు నామరూపానికి దగ్గరగా లిప్యంతరీకరించబడింది.
- source_word: תּוֹלָע
  choice: తోలా
  rationale: వంశావళిలోని వ్యక్తి పేరు; అర్థానువాదం చేయకుండా లిప్యంతరీకరించబడింది.
- source_word: וּ/פֻוָּה
  choice: పువ్వా
  rationale: పేరులోని మధ్య וּ వ్యంజన ధ్వనిని ప్రతిబింబించేలా ‘పువ్వా’ అని లిప్యంతరీకరించబడింది. ‘పూవా’ అనే ప్రత్యామ్నాయ రూపాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: וְ/יוֹב
  choice: యోబు
  rationale: మసొరేటిక్ పాఠంలోని יוֹב పేరును నేరుగా ప్రతిబింబించే తెలుగు నామరూపం. 1 దినవృత్తాంతములు 7:1లోని భిన్న నామరూపం పాదటిప్పణిలో ఇవ్వబడింది.
- source_word: וְ/שִׁמְרוֹן
  choice: షిమ్రోను
  rationale: వ్యక్తి పేరును హీబ్రూ ధ్వనికి దగ్గరగా తెలుగులో లిప్యంతరీకరించాం; జాబితా చివరి అంశంగా తెలుగులో అదనపు సముచ్చయం లేకుండానే సహజంగా ఉంది.
