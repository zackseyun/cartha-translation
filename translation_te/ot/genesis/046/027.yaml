  yaml_path: translation/ot/genesis/046/027.yaml
  text: And the sons of Joseph who were born to him in Egypt were two persons[b][a]. All the persons of the house of Jacob who came to Egypt were seventy.
translation:
  language: te
  text: ఈజిప్టులో యోసేపుకు పుట్టిన కుమారులు ఇద్దరు.[a] ఈజిప్టుకు వచ్చిన యాకోబు ఇంటివారందరూ మొత్తం డెబ్బై మంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీలో అక్షరార్థంగా ‘రెండు ప్రాణాలు’; ఇక్కడ ‘ప్రాణం’ అనే పదం కుటుంబ లెక్కలో ఒక్కొక్క వ్యక్తిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי יוֹסֵף
  choice: యోసేపుకు ... కుమారులు
  rationale: בְּנֵי ఇక్కడ ముందుగా పేర్కొన్న యోసేపు మగ సంతానాన్ని సూచిస్తుంది; అందువల్ల ‘కుమారులు’ సరైనది. సహజమైన తెలుగు వాక్యనిర్మాణం కోసం సంబంధాన్ని ‘యోసేపుకు’ అని తెలిపాం.
- source_word: אֲשֶׁר יֻלַּד לוֹ
  choice: పుట్టిన
  rationale: యోసేపుకు వారు పుట్టారనే హెబ్రీ నిష్క్రియ భావాన్ని తెలుగు సహజ సంబంధక క్రియారూపంతో నిలిపాం.
- source_word: בְמִצְרַיִם
  choice: ఈజిప్టులో
  rationale: స్థానార్థక בְּకు నేరమైన, సహజమైన తెలుగు సమానం.
- source_word: נֶפֶשׁ שְׁנָיִם
  choice: ఇద్దరు వ్యక్తులు
  rationale: వంశావళి లెక్కలో נֶפֶשׁ వ్యక్తులను సూచిస్తుంది. మూలంలోని లెక్కింపు పదాన్ని ప్రతిఫలింపజేస్తూ, ‘ఆత్మలు’ అనే అపార్థాన్ని నివారించాం.
- source_word: כָּל הַנֶּפֶשׁ
  choice: ఇంటివారందరూ
  rationale: ఈ సందర్భంలో ఏకవచన రూపంలోని נֶפֶשׁ సమూహంలోని వ్యక్తుల మొత్తం లెక్కను సూచిస్తుంది; తెలుగులో ‘వారందరూ’ సహజమైన సామూహిక ప్రయోగం.
- source_word: לְבֵית יַעֲקֹב
  choice: యాకోబు ఇంటివారు
  rationale: בֵּית ఇక్కడ భవనాన్ని కాక కుటుంబం/గృహసమూహాన్ని సూచిస్తుంది; ‘ఇంటివారు’ ఆ భావాన్ని ఆధునిక తెలుగులో స్పష్టంగా అందిస్తుంది.
- source_word: הַבָּאָה מִצְרַיְמָה
  choice: ఈజిప్టుకు వచ్చిన
  rationale: దిశాసూచక ה కలిగిన מִצְרַיְמָהను ‘ఈజిప్టుకు’ అని, సమూహాన్ని విశేషించే participleను ‘వచ్చిన’ అని సహజంగా అనువదించాం.
- source_word: שִׁבְעִים
  choice: మొత్తం డెబ్బై మంది
  rationale: క్రియలేని హెబ్రీ వాక్యం మొత్తం సంఖ్యను తెలుపుతుంది. తెలుగులో ‘మొత్తం ... మంది’ స్పష్టమైన, సహజమైన లెక్కింపు రూపం.
theological_decisions:
- issue: వంశావళి లెక్కలో נֶפֶשׁ అనువాదం
  choice: వ్యక్తులు / వారు / మంది
  alternative: ఆత్మలు
  rationale: ఈ వచనం మానవ స్వభావంలోని ‘ఆత్మ’ గురించి సిద్ధాంత ప్రకటన చేయడం లేదు; యాకోబు కుటుంబ సభ్యులను లెక్కిస్తోంది. అందువల్ల సందర్భానుసార వ్యక్తి-లెక్కింపు పదాలను వాడటం మూలార్థాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన, సామాన్య పాఠకులకు సులభమైన శైలి. ‘యాకోబు ఇల్లు’ అనే అక్షరానువాదం కంటే కుటుంబ/గృహసమూహ భావాన్ని స్పష్టంగా తెలిపే ‘యాకోబు ఇంటివారు’ ఎంచుకున్నాం. మొదటి వాక్యంలో అసలు పాఠంలోని נֶפֶשׁను కనిపించేలా ఉంచేందుకు ‘ఇద్దరు వ్యక్తులు’ వాడి, పునరుక్తి తగ్గించేందుకు రెండో వాక్యంలో ‘వారందరూ ... మంది’ అన్నాం.
