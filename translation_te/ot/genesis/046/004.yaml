  rationale: ‘తిరిగి’ని తొలగించి ‘కూడా’ను చేర్చడం ద్వారా גַם యొక్క అనుబంధ భావాన్ని నిలుపుతూ, యాకోబు వ్యక్తిగతంగా తిరిగి రావడం, అతని దేహాన్ని తీసుకురావడం, లేదా అతని సంతతిని సూచించడం వంటి సాధ్యమైన భావాలను నిర్దిష్టం చేయకుండా ఉంచింది. పాదటిప్పణి అర్థాన్ని నిర్ద్వంద్వంగా విధించకుండా నుడికార ప్రత్యామ్నాయంగా మలచబడింది.
