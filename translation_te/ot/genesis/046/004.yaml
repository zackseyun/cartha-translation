id: GEN.46.4
reference: Genesis 46:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אָנֹכִ֗י אֵרֵ֤ד עִמְּ/ךָ֙ מִצְרַ֔יְמָ/ה וְ/אָנֹכִ֖י אַֽעַלְ/ךָ֣ גַם עָלֹ֑ה וְ/יוֹסֵ֕ף יָשִׁ֥ית יָד֖/וֹ עַל עֵינֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/004.yaml
  text: I myself will go down with you to Egypt[a], and I myself will also surely bring you up; and Joseph will place his hand on your eyes.
translation:
  language: te
  text: నేనే నీతోపాటు ఐగుప్తుకు దిగివస్తాను; నేనే నిన్ను తప్పక పైకి తీసుకొస్తాను కూడా. యోసేపు నీ కళ్లపై తన చేతిని ఉంచుతాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, నుడికారంగా, “యోసేపు నీ కళ్లు మూస్తాడు.” ఇది యాకోబు మరణించే సమయంలో యోసేపు అక్కడ ఉండడాన్ని సూచిస్తుంది.
    reason: హీబ్రూ నుడికారానికి సాధ్యమైన భావాన్ని తెలియజేస్తుంది; ప్రధాన పాఠ్యం మాత్రం చేతిని కళ్లపై ఉంచే స్పష్టమైన చిత్రాన్ని నిలుపుతుంది.
lexical_decisions:
- source_word: אָנֹכִי ... וְאָנֹכִי
  choice: నేనే ... నేనే
  rationale: స్వతంత్ర సర్వనామం రెండుసార్లు స్పష్టంగా రావడం వల్ల ఉన్న నొక్కిచెప్పే భావాన్ని తెలుగులో ‘నేనే’ అనే పునరుక్తితో నిలిపింది.
- source_word: אֵרֵד עִמְּךָ מִצְרַיְמָה
  choice: నీతోపాటు ఐగుప్తుకు దిగివస్తాను
  rationale: ירד లోని ‘దిగు’ దిశాభావాన్ని నిలుపుతూ, దేవుడు యాకోబుతో కలిసి వెళ్లడాన్ని సహజమైన తెలుగులో ‘నీతోపాటు ... దిగివస్తాను’గా వ్యక్తం చేసింది.
- source_word: אַעַלְךָ גַם עָלֹה
  choice: నిన్ను తప్పకుండా తిరిగి పైకి తీసుకొస్తాను
  rationale: హిఫీల్ రూపంలోని కారణార్థాన్ని ‘తీసుకొస్తాను’ నిలుపుతుంది; క్రియావిశేష నామరూపం ఇచ్చే నిశ్చయాన్ని ‘తప్పకుండా’ తెలియజేస్తుంది. גַם యొక్క అనుబంధ భావం సందర్భంలో తిరుగు ప్రయాణాన్ని సూచించే ‘తిరిగి’తో సహజంగా వ్యక్తమవుతుంది.
- source_word: וְיוֹסֵף
  choice: యోసేపు
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: יָשִׁית יָדוֹ עַל עֵינֶיךָ
  choice: నీ కళ్ల మీద తన చెయ్యి ఉంచుతాడు
  rationale: మరణసమయంలో కళ్లు మూయించే భావాన్ని ప్రధాన పాఠ్యంలో విప్పి చెప్పకుండా, హీబ్రూ భాషలోని స్పష్టమైన శారీరక చిత్రాన్ని నిలిపింది.
theological_decisions:
- issue: ‘నిన్ను పైకి తీసుకొస్తాను’ అనే వాగ్దానం ఎవరిని లేదా ఏ సంఘటనను సూచిస్తుంది?
  choice: యాకోబును ఉద్దేశించిన విస్తృతమైన వాగ్దానంగానే ఉంచడం
  alternative: యాకోబు శరీరం కనానులో సమాధి చేయబడటానికే తీసుకురాబడుతుందని, లేదా అతని సంతతి నిర్గమంలో తిరిగి వస్తుందని ప్రత్యేకంగా చెప్పడం
  rationale: హీబ్రూ పాఠ్యం సంక్షిప్తంగా ఉండి యాకోబు దేహాన్ని తిరిగి తీసుకురావడం, అతని సంతతి తిరిగి రావడం వంటి భావస్థరాలకు అవకాశం ఇస్తుంది. అనువాదం వాటిలో ఒక్కదానికే అర్థాన్ని పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘దిగివస్తాను/పైకి తీసుకొస్తాను’ ద్వారా మూలంలోని భౌగోళిక దిశాభావం, ‘నేనే’ మరియు ‘తప్పకుండా’ ద్వారా నొక్కిచెప్పడం నిలుపబడ్డాయి.
