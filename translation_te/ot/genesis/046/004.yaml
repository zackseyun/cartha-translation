revisions:
- from: నేనే నీతోపాటు ఐగుప్తుకు దిగివస్తాను; నేనే నిన్ను తప్పకుండా తిరిగి పైకి తీసుకొస్తాను. యోసేపు నీ కళ్ల మీద తన చెయ్యి ఉంచుతాడు.[a]
