  text: וַ/יֶּאְסֹ֤ר יוֹסֵף֙ מֶרְכַּבְתּ֔/וֹ וַ/יַּ֛עַל לִ/קְרַֽאת יִשְׂרָאֵ֥ל אָבִ֖י/ו גֹּ֑שְׁנָ/ה וַ/יֵּרָ֣א אֵלָ֗י/ו וַ/יִּפֹּל֙ עַל צַוָּארָ֔י/ו וַ/יֵּ֥בְךְּ עַל צַוָּארָ֖י/ו עֽוֹד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/029.yaml
  text: Then Joseph harnessed his chariot and went up to meet Israel his father in Goshen[a]. He appeared before him, fell on his neck[b], and wept on his neck for a long time.
translation:
  language: te
  text: అప్పుడు యోసేపు తన రథానికి గుర్రాలను కట్టించి, తన తండ్రి ఇశ్రాయేలును కలుసుకోవడానికి గోషెనుకు వెళ్లాడు. అతడు తన తండ్రికి కనిపించి[a], అతని మెడపై వాలిపోయి, అతని మెడపై చాలాసేపు ఏడ్చాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తన తండ్రికి తనను చూపించుకున్నాడు.” హీబ్రూ క్రియను “అతనికి కనిపించాడు” అని మరింత అక్షరార్థంగా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ వాక్యం మరింత అక్షరార్థంగా, “అతని మెడపై ఇంకా ఏడ్చాడు” అని ఉంటుంది. ఇక్కడ “ఇంకా” అనే మాట ఏడుపు చాలాసేపు కొనసాగిందనే భావాన్ని ఇస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּאְסֹר ... מֶרְכַּבְתּוֹ
  choice: తన రథానికి గుర్రాలను కట్టించి
  rationale: אָסַר అనే క్రియకు ప్రాథమికంగా ‘కట్టు’ అనే అర్థం ఉంది; ‘రథం’తో వాడినప్పుడు ప్రయాణానికి రథాన్ని సిద్ధం చేయడానికి గుర్రాలను కట్టించడాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ఈ భావాన్ని స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וַיַּעַל
  choice: వెళ్లాడు
  rationale: עלה అక్షరార్థంగా ‘పైకి వెళ్లాడు’ అయినా, ఇక్కడ ప్రయాణాన్ని తెలిపే హీబ్రూ కథన వాడుక. భౌగోళికంగా ‘పైకి’ అన్న భావం స్పష్టంగా లేని చోట తెలుగులో ‘వెళ్లాడు’ సహజంగా ఉంటుంది.
- source_word: לִקְרַאת יִשְׂרָאֵל אָבִיו
  choice: తన తండ్రి ఇశ్రాయేలును కలుసుకోవడానికి
  rationale: లక్ష్యాన్ని తెలిపే לִקְרַאת‌ను ‘కలుసుకోవడానికి’గా అనువదించి, మూలంలోని ‘ఇశ్రాయేలు’ పేరును అలాగే ఉంచింది.
- source_word: גֹּשְׁנָה
  choice: గోషెనుకు
  rationale: దిశను సూచించే ־ָה ప్రత్యయాన్ని గౌరవిస్తూ, యోసేపు గోషెను వైపు వెళ్లాడనే భావాన్ని ‘గోషెనుకు’ తెలియజేస్తుంది.
- source_word: וַיֵּרָא אֵלָיו
  choice: తన తండ్రికి కనిపించి
  rationale: ראה నిఫాల్ రూపం యోసేపు తన తండ్రికి కనిపించడం లేదా తనను అతనికి చూపించుకోవడం అనే భావాన్ని ఇస్తుంది. ‘ప్రత్యక్షమయ్యాడు’ అనేది తెలుగులో అతీంద్రియ ఛాయను కలిగించవచ్చు కాబట్టి ‘కనిపించి’ ఎంచుకుంది.
- source_word: וַיִּפֹּל עַל צַוָּארָיו
  choice: అతని మెడపై వాలిపోయి
  rationale: అక్షరార్థమైన ‘మెడపై పడ్డాడు’ అనే హీబ్రూ చిత్రాన్ని పూర్తిగా చెరపకుండా, భావోద్వేగంతో ఆలింగనం చేసుకున్న సందర్భాన్ని సహజ తెలుగులో ‘వాలిపోయి’ వ్యక్తం చేస్తుంది.
- source_word: וַיֵּבְךְּ עַל צַוָּארָיו עוֹד
  choice: అతని మెడను కౌగిలించుకొని చాలాసేపు ఏడ్చాడు
  rationale: శారీరక సమీపతను నిలుపుతూ, עוֹד ఇక్కడ ఏడుపు కొనసాగిన కాలాన్ని సూచిస్తుందని సందర్భానుసారంగా ‘చాలాసేపు’గా ఇచ్చింది.
