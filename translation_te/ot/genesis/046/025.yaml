    issue: మొదటి భాగంలో సంబంధ వాక్యపు అనుబంధం సందిగ్ధంగా ఉంది.
    rationale: ‘లాబాను తన కుమార్తె రాహేలుకు ఇచ్చిన బిల్హా కుమారులు’ అనే నిర్మాణాన్ని బిల్హాను కాక ఆమె కుమారులనే లాబాను ఇచ్చినట్లుగా చదివే అవకాశం ఉంది. మూలంలో ‘ఎవరికైతే లాబాను ... ఇచ్చాడో ఆ బిల్హా కుమారులు’ అని స్పష్టంగా బిల్హానే సంబంధ వాక్యానికి పూర్వపదం.
