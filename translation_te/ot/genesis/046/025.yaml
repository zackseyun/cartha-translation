  text: אֵ֚לֶּה בְּנֵ֣י בִלְהָ֔ה אֲשֶׁר נָתַ֥ן לָבָ֖ן לְ/רָחֵ֣ל בִּתּ֑/וֹ וַ/תֵּ֧לֶד אֶת אֵ֛לֶּה לְ/יַעֲקֹ֖ב כָּל נֶ֥פֶשׁ שִׁבְעָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/025.yaml
  text: 'These are the sons of Bilhah[a], whom Laban gave to Rachel his daughter, and she bore these to Jacob: seven persons in all.'
translation:
  language: te
  text: లాబాను తన కుమార్తె రాహేలుకు ఇచ్చిన బిల్హా యొక్క కుమారులు వీరే. ఆమె యాకోబుకు ఈ కుమారులను కనింది—మొత్తం ఏడుగురు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీలో అక్షరార్థంగా, “మొత్తం ప్రాణం—ఏడు” అని ఉంది; ఇది మొత్తం ఏడుగురు వ్యక్తులు అనే అర్థమిచ్చే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה בְּנֵי בִלְהָה
  choice: బిల్హా కుమారులు వీరే
  rationale: గణన జాబితాను సమీక్షిస్తూ పరిచయం చేసే నిర్దేశక బహువచనాన్ని సహజమైన తెలుగు గుర్తింపు వాక్యంగా అందిస్తుంది; בְּנֵי ఇక్కడ పురుష సంతానాన్నే సూచిస్తుంది.
- source_word: אֲשֶׁר נָתַן לָבָן לְרָחֵל בִּתּוֹ
  choice: లాబాను తన కుమార్తె రాహేలుకు ఇచ్చిన
  rationale: సంబంధ వాక్యం బిల్హాను విశేషిస్తుంది; לְ పరోక్ష కర్మను, בִּתּוֹ లోని స్వామ్య ప్రత్యయాన్ని ‘తన కుమార్తె’గా స్పష్టంగా తెలియజేస్తుంది.
- source_word: וַתֵּלֶד אֶת אֵלֶּה לְיַעֲקֹב
  choice: ఆమె యాకోబుకు వీరిని కనింది
  rationale: ילד యొక్క వంశావళి సందర్భార్థాన్ని, బిల్హానే కర్త అనే విషయాన్ని, לְיַעֲקֹב లోని తండ్రి-సంబంధాన్ని సంక్షిప్తంగా కాపాడుతుంది.
- source_word: כָּל נֶפֶשׁ שִׁבְעָה
  choice: మొత్తం ఏడుగురు
  rationale: వ్యక్తులను లెక్కించే హెబ్రీయ నుడికారాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; నֶפֶשׁ ను ఈ జనగణన సందర్భంలో అక్షరార్థంగా ‘ఆత్మ’ అని అనువదించడం తప్పుదారి పట్టించవచ్చు.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వంశావళి శైలి. మూలంలోని రెండు సమన్వయ వాక్య భాగాలను స్పష్టత కోసం రెండు వాక్యాలుగా ఇచ్చి, చివరి గణనను డాష్‌తో ఉద్ఘాటించాం. పాదసూచిక గుర్తు [a] ప్రధాన పాఠ్యంలో ఉంచబడింది.
