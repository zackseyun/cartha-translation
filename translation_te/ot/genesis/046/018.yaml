source:
  edition: WLC
  text: אֵ֚לֶּה בְּנֵ֣י זִלְפָּ֔ה אֲשֶׁר נָתַ֥ן לָבָ֖ן לְ/לֵאָ֣ה בִתּ֑/וֹ וַ/תֵּ֤לֶד אֶת אֵ֨לֶּה֙ לְ/יַעֲקֹ֔ב שֵׁ֥שׁ עֶשְׂרֵ֖ה נָֽפֶשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/018.yaml
  text: 'These are the sons of Zilpah[a], whom Laban gave to Leah his daughter, and she bore these to Jacob: sixteen persons.'
translation:
  language: te
  text: లాబాను తన కుమార్తె లేయాకు ఇచ్చిన జిల్పా కుమారులు వీరే. జిల్పా యాకోబుకు వీరిని కన్నది—మొత్తం పదహారు మంది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “పదహారు ప్రాణాలు.” ఇక్కడ హీబ్రూ పదమైన నెఫెష్ వ్యక్తులను లెక్కించడానికి వాడిన ప్రయోగం.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה בְּנֵי זִלְפָּה
  choice: జిల్పా కుమారులు వీరే
  rationale: వంశావళి జాబితాను పరిచయం చేసే హీబ్రూ నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది; בְּנֵי యొక్క పురుషలింగ రూపాన్ని ‘కుమారులు’గా నిలుపుతుంది.
- source_word: אֲשֶׁר נָתַן לָבָן לְלֵאָה בִתּוֹ
  choice: లాబాను తన కుమార్తె లేయాకు ఇచ్చిన
  rationale: సంబంధ వాక్యం జిల్పాను విశేషిస్తున్నదనే భావం తెలుగులో స్పష్టంగా ఉండేలా క్రమాన్ని మార్చి, మూలంలోని కుటుంబ సంబంధాన్ని యథాతథంగా ఉంచింది.
- source_word: וַתֵּלֶד אֶת אֵלֶּה לְיַעֲקֹב
  choice: ఆమె యాకోబుకు వీరిని కన్నది
  rationale: ילד క్రియకు వంశావళి సందర్భంలో సహజమైన ‘కన్నది’ను ఎంచుకుని, לְיַעֲקֹב ను ‘యాకోబుకు’గా నేరుగా ప్రతిబింబిస్తుంది.
- source_word: שֵׁשׁ עֶשְׂרֵה נָפֶשׁ
  choice: మొత్తం పదహారు మంది
  rationale: నెఫెష్ ఇక్కడ జనులను లెక్కించే హీబ్రూ ప్రయోగం; ఆధునిక తెలుగులో ‘మంది’ సహజంగా వ్యక్తుల సంఖ్యను సూచిస్తుంది. ‘మొత్తం’ జాబితా సారాంశ భావాన్ని స్పష్టం చేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన వంశావళి శైలి. వ్యక్తుల పేర్లు సాధారణ తెలుగు బైబిల్ రూపాలకు అనుగుణంగా ‘లాబాను,’ ‘లేయా,’ ‘జిల్పా,’ ‘యాకోబు’గా ఇచ్చాం. పాదసూచిక గుర్తు ప్రధాన వాక్యంలో చేర్చబడింది.
