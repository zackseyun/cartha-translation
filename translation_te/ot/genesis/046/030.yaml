id: GEN.46.30
reference: Genesis 46:30
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֧אמֶר יִשְׂרָאֵ֛ל אֶל יוֹסֵ֖ף אָמ֣וּתָה הַ/פָּ֑עַם אַחֲרֵי֙ רְאוֹתִ֣/י אֶת פָּנֶ֔י/ךָ כִּ֥י עוֹדְ/ךָ֖ חָֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/030.yaml
  text: Then Israel said to Joseph[a], “Now I can die, since I have seen your face and know that you are still alive.”
translation:
  language: te
  text: అప్పుడు ఇశ్రాయేలు యోసేపుతో, “నీ ముఖాన్ని చూసిన తర్వాత, నీవు ఇంకా బ్రతికే ఉన్నావు కాబట్టి, ఇప్పుడు నేను చనిపోగలను” అన్నాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత రూపసమీపంగా: “ఇప్పుడు నేను చనిపోతాను; ఎందుకంటే నీ ముఖాన్ని చూశాను, నీవు ఇంకా బ్రతికే ఉన్నావు.” హీబ్రూ వాక్యం సంక్షిప్తమైనది, నుడికారపూర్వకమైనది.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... అన్నాడు
  rationale: వావ్-కన్సిక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది; ఆధునిక తెలుగులో ‘అప్పుడు’ దాని క్రమసూచక భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: יִשְׂרָאֵל
  choice: ఇశ్రాయేలు
  rationale: మూలపాఠం స్పష్టంగా ‘ఇశ్రాయేలు’ అనే పేరునే వాడుతుంది; అందువల్ల దాన్ని ‘యాకోబు’గా సమన్వయపరచలేదు.
- source_word: אָמ֣וּתָה הַפָּעַם
  choice: ఇప్పుడు నేను తృప్తిగా చనిపోగలను
  rationale: కోహోర్టేటివ్ రూపం భావోద్వేగపూర్వక సిద్ధతను లేదా సంకల్పాన్ని వ్యక్తం చేస్తుంది. ఇక్కడ మరణానికి అనుమతి కోరడం కాదు; యోసేపు బ్రతికున్నాడని చూసినందున ఇక తృప్తిగా చనిపోగలననే భావం. ‘తృప్తిగా’ అనేది సందర్భంలో అంతర్లీనమైన భావాన్ని సహజ తెలుగులో స్పష్టం చేస్తుంది.
- source_word: אַחֲרֵי רְאוֹתִי
  choice: చూసిన తర్వాత
  rationale: ఇన్ఫినిటివ్ కన్స్ట్రక్ట్‌కు ఉన్న కాలసంబంధమైన ‘నేను చూసిన తర్వాత’ అనే భావాన్ని నేరుగా, సహజంగా నిలుపుతుంది.
- source_word: אֶת פָּנֶיךָ
  choice: నీ ముఖాన్ని
  rationale: ‘నీ ముఖం’ అనే మూలంలోని సజీవమైన వ్యక్తిగత వ్యక్తీకరణను ‘నిన్ను’ అని సరళీకరించకుండా నిలుపుతుంది.
- source_word: כִּי עוֹדְךָ חָי
  choice: నీవు ఇంకా బ్రతికే ఉన్నావని
  rationale: כִּי ని ఇక్కడ విషయాన్ని తెలిపే ‘అని’గా, עוֹדְךָ חָי ని కొనసాగింపును బలపరిచే సహజ తెలుగు ‘ఇంకా బ్రతికే ఉన్నావు’గా అనువదించింది.
theological_decisions:
- issue: אָמ֣וּתָה అనే కోహోర్టేటివ్ యొక్క భావం
  choice: నేను తృప్తిగా చనిపోగలను
  alternative: నేను చనిపోనివ్వు / నేను చనిపోతాను
  rationale: ఇది మరణాన్ని కోరే ప్రార్థనగా గానీ, వెంటనే మరణిస్తాననే ప్రవచనంగా గానీ తప్పుగా వినిపించకుండా, యోసేపును సజీవంగా చూసిన తర్వాత ఇశ్రాయేలు పొందిన నెరవేర్పు మరియు మరణానికి సిద్ధతను తెలియజేస్తుంది. అయితే మూలంలోని సంక్షిప్తతను చూపేందుకు మరింత రూపసమీపమైన ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ‘ఇశ్రాయేలు,’ ‘యోసేపు’ వంటి స్థిరపడిన తెలుగు బైబిలు నామరూపాలను వాడింది. ప్రధాన వాక్యంలో మూలంలోని భావోద్వేగ సిద్ధతను సహజంగా అందిస్తూ, పాదటిప్పణిలో రూపసమీపమైన ప్రత్యామ్నాయాన్ని నిలిపింది.
