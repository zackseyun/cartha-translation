  to: ఫరో మిమ్మల్ని పిలిచి, ‘మీ పని ఏమిటి?’ అని చెప్పినప్పుడు,
  rationale: 'The revision retains the Hebrew temporal contingency and speech verb while using idiomatic modern Telugu. ‘పని’ is semantically broad enough for the source term and does not over-specify the brothers’ occupation. No target-language footnote is needed: the lexical breadth is represented directly by ‘పని,’ and no textual ambiguity requires annotation.'
