review_pass:
  verdict: revise
  source_fidelity: The draft preserves the future-contingency construction, Pharaoh's calling of the group, and the direct question. However, it renders וְאָמַר ('and says') as 'asks'; while contextually understandable, retaining a speech verb better reflects the Hebrew and the English POB audit trail.
  naturalness: The dependent-clause form and final comma are appropriate because the sentence continues into the next verse. ‘మీ పని ఏమిటి?’ is natural modern standard Telugu and is broader and closer to the Hebrew than ‘మీ వృత్తి ఏమిటి?’, which can suggest a formal profession.
  terminology: ‘ఫరో’ is standard. ‘పని’ appropriately represents מַעֲשֵׂיכֶם in this context without narrowing it to a profession or trade.
  issues:
  - severity: low
    issue: The speech verb is changed from ‘says’ to ‘asks’.
    rationale: Although the quoted words are interrogative, the Hebrew uses וְאָמַר, and the English audit deliberately preserves ‘says.’ Telugu can retain this with ‘అని చెప్పినప్పుడు.’
  - severity: low
    issue: ‘వృత్తి’ somewhat narrows the sense of מַעֲשֵׂיכֶם.
    rationale: The Hebrew can denote work, activity, or occupation. ‘పని’ preserves this breadth and corresponds to the English footnote’s lexical alternative ‘work.’
