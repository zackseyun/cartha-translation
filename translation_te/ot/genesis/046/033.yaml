  text: וְ/הָיָ֕ה כִּֽי יִקְרָ֥א לָ/כֶ֖ם פַּרְעֹ֑ה וְ/אָמַ֖ר מַה מַּעֲשֵׂי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/033.yaml
  text: And when Pharaoh calls you and says[a], ‘What is your occupation?’
translation:
  language: te
  text: ఫరో మిమ్మల్ని పిలిచి, ‘మీ పని ఏమిటి?’ అని చెప్పినప్పుడు,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: అడిగినప్పుడు
  rationale: ఈ హీబ్రూ పదబంధం భవిష్యత్తులో సంభవించే సందర్భాన్ని పరిచయం చేస్తుంది. తెలుగులో వాక్యాంతంలోని ‘అడిగినప్పుడు’ సహజంగా ఆ కాలార్థాన్ని తెలియజేస్తుంది.
- source_word: יִקְרָא לָכֶם
  choice: మిమ్మల్ని పిలిచి
  rationale: קרא + ל ఇక్కడ పిలవడం లేదా రమ్మని పిలిపించడం అనే భావాన్ని ఇస్తుంది. రాజసభ సందర్భాన్ని అతిగా విస్తరించకుండా ‘మిమ్మల్ని పిలిచి’ సహజంగా ఉంది.
- source_word: פַּרְעֹה
  choice: ఫరో
  rationale: ఈజిప్టు రాజుకు వాడే బిరుదుకు ప్రామాణిక తెలుగు రూపం.
- source_word: וְאָמַר
  choice: అని అడిగినప్పుడు
  rationale: మూలంలో అక్షరార్థంగా ‘అని చెప్పినప్పుడు’ ఉన్నా, వెంటనే ప్రత్యక్ష ప్రశ్న రావడం వల్ల తెలుగులో ‘అడిగినప్పుడు’ సహజం; ప్రశ్నార్థక స్వభావాన్ని మాత్రమే స్పష్టం చేస్తుంది.
- source_word: מַה מַּעֲשֵׂיכֶם
  choice: మీ వృత్తి ఏమిటి?
  rationale: מַעֲשֵׂיכֶם సాధారణంగా ‘మీ పని’ అని అర్థమవుతుంది; ఈ సందర్భంలో జీవనోపాధి లేదా చేసే పని గురించి అడుగుతున్నందున ‘వృత్తి’ స్పష్టమైన ఆధునిక తెలుగు పదం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ఇది తరువాతి వచనంతో కొనసాగే ఆధీన వాక్యం కాబట్టి చివరలో అల్పవిరామం ఉంచబడింది.
