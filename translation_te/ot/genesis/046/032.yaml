id: GEN.46.32
reference: Genesis 46:32
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הָ/אֲנָשִׁים֙ רֹ֣עֵי צֹ֔אן כִּֽי אַנְשֵׁ֥י מִקְנֶ֖ה הָי֑וּ וְ/צֹאנָ֧/ם וּ/בְקָרָ֛/ם וְ/כָל אֲשֶׁ֥ר לָ/הֶ֖ם הֵבִֽיאוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/032.yaml
  text: The men are shepherds[a], for they have been keepers of livestock, and they have brought their flocks and their herds and all that they have.
translation:
  language: te
  text: ఆ మనుషులు గొర్రెల కాపరులు; ఎందుకంటే వారు పశుపోషకులుగా ఉన్నారు. వారు తమ గొర్రెలు, మేకల మందలను, పశువులను, తమకు ఉన్నదంతటినీ తీసుకొచ్చారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָאֲנָשִׁים
  choice: ఆ మనుషులు
  rationale: సందర్భంలో యోసేపు తన సహోదరులను సూచిస్తున్నాడు. తెలుగు వాక్యప్రవాహంలో ఆరంభంలోని సంధికారకాన్ని విడిచిపెట్టి, నిర్దిష్ట సూచనను ‘ఆ’తో సహజంగా వ్యక్తం చేశాం.
- source_word: רֹעֵי צֹאן
  choice: గొర్రెల కాపరులు
  rationale: ఇది అక్షరార్థంగా చిన్న పశువుల మందలను మేపేవారిని సూచించే నిర్మాణం; సాధారణ ఆధునిక తెలుగులో ‘గొర్రెల కాపరులు’ స్పష్టంగా, సహజంగా ఉంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: వారు గొర్రెల కాపరులు అని చెప్పడానికి కారణాన్ని పరిచయం చేసే వివరణాత్మక అర్థాన్ని వ్యక్తం చేస్తుంది.
- source_word: אַנְשֵׁי מִקְנֶה
  choice: పశుపోషకులు
  rationale: ‘పశువులకు చెందిన మనుషులు’ అనే హీబ్రూ నుడికారానికి వృత్తిపరమైన భావం ఉంది. ‘పశుపోషకులు’ ఆ భావాన్ని పశువులకే పరిమితం చేయకుండా సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: הָיוּ
  choice: ఉన్నారు
  rationale: హీబ్రూ పరిపూర్ణ క్రియ వారి స్థిరమైన గత వృత్తిని సూచించవచ్చు; సందర్భంలో ఇప్పటివరకు కొనసాగిన స్థితిగా తెలుగులో ‘ఉన్నారు’ సహజం. సాధారణ భూతకాల అనువాదం కూడా సాధ్యమని పాదసూచికలో నిలిపాం.
- source_word: וְצֹאנָם
  choice: తమ మందలను
  rationale: צֹאן సాధారణంగా గొర్రెలు, మేకలు వంటి చిన్న పశువులను సమూహంగా సూచిస్తుంది. ‘మందలు’ ఆ సమూహార్థాన్ని సహజంగా నిలుపుతుంది.
- source_word: וּבְקָרָם
  choice: పశువులను
  rationale: בקר ప్రత్యేకంగా పెద్ద కొమ్ముల పశువులను, ముఖ్యంగా గోవులను సూచిస్తుంది. తెలుగు పఠనంలో ‘పశువులు’ సహజంగా ఉంది; ముందున్న ‘మందలు’తో వర్గభేదం సందర్భం ద్వారా నిలుస్తుంది.
- source_word: וְכָל אֲשֶׁר לָהֶם
  choice: తమకు ఉన్నదంతటినీ
  rationale: వారికి చెందిన సమస్త ఆస్తిని సమగ్రంగా సూచించే మూలభాషా భావాన్ని దగ్గరగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: הֵבִיאוּ
  choice: తీసుకొచ్చారు
  rationale: వారు తమతో వెంట తెచ్చిన పశువులు, ఆస్తి గురించి కావడంతో ‘తీసుకొచ్చారు’ తెలుగు సందర్భంలో ‘తెచ్చారు’ కంటే కొద్దిగా స్పష్టంగా ఉంది. హీబ్రూ పరిపూర్ణ క్రియ పూర్తయిన చర్యను సూచిస్తుంది.
