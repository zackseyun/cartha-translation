  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైనప్పటికీ సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ‘పశుపోషకులు’ వృత్తి భావాన్ని, ‘మందలు’ చిన్న పశువుల సమూహార్థాన్ని నిలుపుతున్నాయి. మూలంలోని క్రియాకాల అస్పష్టతను పాదసూచికలో భద్రపరిచాం.
