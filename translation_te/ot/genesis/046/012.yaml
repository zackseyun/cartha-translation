id: GEN.46.12
reference: Genesis 46:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/בְנֵ֣י יְהוּדָ֗ה עֵ֧ר וְ/אוֹנָ֛ן וְ/שֵׁלָ֖ה וָ/פֶ֣רֶץ וָ/זָ֑רַח וַ/יָּ֨מָת עֵ֤ר וְ/אוֹנָן֙ בְּ/אֶ֣רֶץ כְּנַ֔עַן וַ/יִּהְי֥וּ בְנֵי פֶ֖רֶץ חֶצְר֥וֹן וְ/חָמֽוּל־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/012.yaml
  text: And the sons of Judah were Er[a], Onan, Shelah, Perez, and Zerah. But Er and Onan died in the land of Canaan. And the sons of Perez were Hezron and Hamul.
translation:
  language: te
  text: యూదా కుమారులు ఏరు[a], ఓనాను, షేలా, పెరెసు, జెరహు. అయితే ఏరు, ఓనాను కనాను దేశంలో చనిపోయారు. పెరెసు కుమారులు హెస్రోను, హామూలు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '‘ఏరు, ఓనాను’ అనే సంయుక్త కర్తతో హీబ్రూ పాఠం ఏకవచన క్రియను ఉపయోగిస్తుంది. ఇది హీబ్రూలో సాధారణ నిర్మాణం; భావం మాత్రం బహువచనం: ‘ఏరు, ఓనాను చనిపోయారు.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי יְהוּדָה
  choice: యూదా కుమారులు
  rationale: సంబంధసూచక నిర్మాణాన్ని సహజమైన తెలుగు వంశావళి శైలిలో వ్యక్తం చేస్తుంది; ఆరంభంలోని וְ సందర్భానుసార అనుసంధానాన్ని ఇక్కడ ప్రత్యేకంగా ‘మరియు’ అని అనువదించనవసరం లేదు.
- source_word: עֵר וְאוֹנָן וְשֵׁלָה וָפֶרֶץ וָזָרַח
  choice: ఏరు, ఓనాను, షేలా, పెరెసు, జెరహు
  rationale: హీబ్రూ వ్యక్తినామాలను తెలుగు ధ్వని, లిపి సంప్రదాయాలకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: וַיָּמָת
  choice: చనిపోయారు
  rationale: క్రియ రూపం ఏకవచనమైనప్పటికీ, అది ‘ఏరు, ఓనాను’ అనే సంయుక్త కర్తకు ముందు రావడం హీబ్రూలో సాధారణం; తెలుగులో భావానుసార బహువచనం సహజం.
- source_word: בְּאֶרֶץ כְּנַעַן
  choice: కనాను దేశంలో
  rationale: మూలంలోని אֶרֶץ (‘దేశం/భూమి’) అనే పదాన్ని నిలుపుతూ సహజమైన తెలుగు రూపాన్ని ఉపయోగించాం.
- source_word: וַיִּהְיוּ בְנֵי פֶרֶץ
  choice: పెరెసు కుమారులు
  rationale: వంశావళి సందర్భంలో היה గుర్తింపును సూచిస్తుంది; తెలుగులో నామవాక్యంగా ఇవ్వడం సహజంగా ఉండి అర్థాన్ని పూర్తిగా అందిస్తుంది.
- source_word: חֶצְרוֹן וְחָמוּל
  choice: హెస్రోను, హామూలు
  rationale: హీబ్రూ వ్యక్తినామాలను ఆధునిక తెలుగు పఠనానికి అనుకూలంగా లిప్యంతరీకరించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళికి తగిన సంక్షిప్తమైన గంభీర శైలిని అనుసరించాం. వ్యక్తినామాలను అనువదించకుండా తెలుగు లిపిలో లిప్యంతరీకరించాం; హీబ్రూ సంయుక్త కర్తతో వచ్చిన ఏకవచన క్రియను తెలుగులో సహజమైన బహువచనంగా ఇచ్చి పాదటిప్పణిలో వివరించాం.
