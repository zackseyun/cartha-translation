source:
  edition: WLC
  text: וּ/בְנֵ֖י רְאוּבֵ֑ן חֲנ֥וֹךְ וּ/פַלּ֖וּא וְ/חֶצְר֥וֹן וְ/כַרְמִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/009.yaml
  text: 'And the sons of Reuben: Hanoch[a], Pallu, Hezron, and Carmi.'
translation:
  language: te
  text: 'రూబేను కుమారులు: హనోకు, పల్లు, హెస్రోను, కర్మీ.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/בְנֵי רְאוּבֵן
  choice: రూబేను కుమారులు
  rationale: בְנֵי అనేది ‘కుమారులు’ అనే పదానికి సంబంధరూప బహువచనం. వంశావళి జాబితా కొనసాగింపును సూచించే וను తెలుగులో సహజమైన జాబితా నిర్మాణం ద్వారా వ్యక్తం చేశాం; ప్రత్యేకంగా ‘మరియు’ చేర్చడం అవసరం లేదు.
- source_word: חֲנוֹךְ
  choice: హనోకు
  rationale: హీబ్రూ పేరును దాని ధ్వనిరూపానికి దగ్గరగా తెలుగులో లిప్యంతరీకరించాం.
- source_word: וּ/פַלּוּא
  choice: పల్లు
  rationale: పేరును హీబ్రూ ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించాం; ముందున్న సంధికారకాన్ని తెలుగు జాబితా విరామచిహ్నాల్లో సహజంగా గ్రహించాం.
- source_word: וְ/חֶצְרוֹן
  choice: హెస్రోను
  rationale: హీబ్రూ పేరులోని మొదటి వ్యంజనానికి దగ్గరగా, ఆధునిక తెలుగు పాఠకులకు పలకడానికి అనువుగా ‘హెస్రోను’ అని ఇచ్చాం.
- source_word: וְ/כַרְמִי
  choice: కర్మీ
  rationale: హీబ్రూ వ్యక్తినామాన్ని ధ్వనికి దగ్గరగా లిప్యంతరీకరించాం; చివరి సంధికారకాన్ని తెలుగు జాబితా నిర్మాణంలో ప్రత్యేక పదంగా చూపలేదు.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళి జాబితాకు తగిన సంక్షిప్తమైన మరియు గౌరవప్రదమైన శైలి. మూలంలోని పేర్లను సాధ్యమైనంత ధ్వనిసన్నిహితంగా ఇచ్చాం.
