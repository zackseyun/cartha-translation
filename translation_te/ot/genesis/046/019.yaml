translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన వంశావళి శైలిని నిలిపాం. మూలంలోని సమాచార క్రమాన్ని సహజ తెలుగు పదక్రమానికి అనుగుణంగా అమర్చాం; ఎలాంటి వివరణాత్మక విస్తరణను చేర్చలేదు.
