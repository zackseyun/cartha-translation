lexical_decisions:
- source_word: בְּנֵי
  choice: కుమారులు
  rationale: ఇది ‘కుమారులు’ అనే అర్థమిచ్చే నిర్మాణ బహువచన రూపం. ఇక్కడ రాహేలు కన్న ప్రత్యక్ష కుమారులనే పేర్లతో పేర్కొంటున్నందున ‘సంతానం’ లేదా ‘వంశస్థులు’ కంటే ‘కుమారులు’ ఖచ్చితమైనది.
- source_word: רָחֵל
  choice: రాహేలు
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగు బైబిలు వాడుకలో సుపరిచితమైన లిప్యంతరీకరణ.
- source_word: אֵשֶׁת יַעֲקֹב
  choice: యాకోబు భార్య
  rationale: నిర్మాణ సంబంధంలో אֵשֶׁת ఇక్కడ ‘భార్య’ అని స్పష్టంగా సూచిస్తుంది; తెలుగులో సహజమైన పదక్రమంతో అనువదించబడింది.
- source_word: יוֹסֵף
  choice: యోసేపు
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగు బైబిలు సంప్రదాయంలో స్థిరపడిన రూపం.
- source_word: וּבִנְיָמִן
  choice: బెన్యామీను
  rationale: జాబితాలో రెండవ వ్యక్తినామం. హీబ్రూ సంధికారకాన్ని తెలుగులో జాబితా విరామంతో సహజంగా వ్యక్తం చేశాం; పేరుకు సుపరిచితమైన తెలుగు రూపాన్ని వాడాం.
