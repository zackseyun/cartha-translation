lexical_decisions:
- source_word: וּבְנֵי גָד
  choice: గాదు కుమారులు
  rationale: בְנֵי అనేది ‘కుమారులు’ అనే నిర్మాణ బహువచనం. తెలుగు వంశావళి జాబితాలో సహజంగా ఉండేందుకు ముందున్న וּ సంధిని ప్రత్యేకంగా ‘మరియు’ అని అనువదించకుండా జాబితా కొనసాగింపుగా భావించాం.
- source_word: צִפְיוֹן
  choice: సిఫ్యోను
  rationale: ఈ వచనంలోని మసొరేటిక్ రూపం Ṣipyôn‌ను నేరుగా ప్రతిబింబించే తెలుగు లిప్యంతరీకరణ.
- source_word: וְחַגִּי
  choice: హగ్గీ
  rationale: హీబ్రూ వ్యక్తినామాన్ని ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించాం; పేరుకు ముందున్న సంధిని జాబితా విరామచిహ్నంతో వ్యక్తం చేశాం.
- source_word: שׁוּנִי
  choice: షూనీ
  rationale: హీబ్రూ వ్యక్తినామాన్ని ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించాం.
- source_word: וְאֶצְבֹּן
  choice: ఎస్బోను
  rationale: హీబ్రూ వ్యక్తినామంలోని వ్యంజన, స్వర రూపాన్ని తెలుగులో సహజంగా పలికేలా లిప్యంతరీకరించాం.
- source_word: עֵרִי
  choice: ఏరీ
  rationale: హీబ్రూ వ్యక్తినామాన్ని దీర్ఘ స్వరంతో లిప్యంతరీకరించాం.
- source_word: וַאֲרוֹדִי
  choice: అరోదీ
  rationale: హీబ్రూ వ్యక్తినామాన్ని ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించాం; ముందున్న సంధిని జాబితా విరామచిహ్నంతో వ్యక్తం చేశాం.
- source_word: וְאַרְאֵלִי
  choice: అరేలీ
  rationale: హీబ్రూ వ్యక్తినామాన్ని ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించాం.
