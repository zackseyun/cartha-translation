review_pass:
  verdict: revise
  source_fidelity: The draft conveys the directive, the livestock-keeping occupation extending from youth across generations, the intended residence in Goshen, and the Egyptians’ strong aversion. However, the final subject expression should more directly and naturally represent רֹעֵה צֹאן (“one who tends a flock”) without the awkward and semantically imprecise “మందల కాపరి ప్రతి ఒక్కడూ.”
  naturalness: Most of the Telugu is clear and modern. “మందల కాపరి ప్రతి ఒక్కడూ” is not idiomatic word order; “మందను కాసే ప్రతి వాడూ” is natural. Recasting the opening as a colon-introduced quotation also makes Joseph’s prescribed speech easier to follow.
  terminology: “మీ సేవకులమైన మేము” appropriately retains the deferential court language of עֲבָדֶיךָ. “పశువుల పెంపకందారులు” is an acceptable modern rendering of אַנְשֵׁי מִקְנֶה. “మందను కాసే” preserves the flock sense of צֹאן without unnecessarily restricting it to sheep alone. “అసహ్యమైనవాడు” adequately conveys the strong sense of תּוֹעֲבַת.
  issues:
  - severity: medium
    issue: Awkward and imprecise rendering of כָּל רֹעֵה צֹאן
    rationale: “మందల కాపరి ప్రతి ఒక్కడూ” is unnatural Telugu, and “మందల” is awkwardly plural. “మందను కాసే ప్రతి వాడూ” naturally expresses every person tending a flock and retains the source’s flock terminology.
  - severity: low
    issue: Purpose relation is better expressed directly
    rationale: “అలా చెబితే” can sound merely conditional. “దీనివల్ల” more clearly carries the intended-result relation of בַּעֲבוּר in this instruction.
  revised_text: 'అప్పుడు మీరు ఇలా చెప్పాలి: ‘మీ సేవకులమైన మేము మా చిన్ననాటి నుంచీ ఇప్పటివరకు పశువుల పెంపకందారులుగా ఉన్నాం; మేమే కాదు, మా పితరులు కూడా అలాగే ఉన్నారు.’ దీనివల్ల మీరు గోషెను దేశంలో నివసించగలరు. ఎందుకంటే మందను కాసే ప్రతి వాడూ[b] ఐగుప్తీయులకు అసహ్యమైనవాడు[a].'
