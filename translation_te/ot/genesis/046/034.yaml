  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/אֲמַרְתֶּ֗ם אַנְשֵׁ֨י מִקְנֶ֜ה הָי֤וּ עֲבָדֶ֨י/ךָ֙ מִ/נְּעוּרֵ֣י/נוּ וְ/עַד עַ֔תָּה גַּם אֲנַ֖חְנוּ גַּם אֲבֹתֵ֑י/נוּ בַּ/עֲב֗וּר תֵּשְׁבוּ֙ בְּ/אֶ֣רֶץ גֹּ֔שֶׁן כִּֽי תוֹעֲבַ֥ת מִצְרַ֖יִם כָּל רֹ֥עֵה צֹֽאן־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/034.yaml
  text: then you shall say[a], ‘Your servants have been men of livestock from our youth until now, both we and our fathers,’ so that you may live in the land of Goshen[b], for every shepherd is detestable to the Egyptians.
translation:
  language: te
  text: 'అప్పుడు మీరు ఇలా చెప్పాలి: ‘మీ సేవకులమైన మేము మా చిన్ననాటి నుంచీ ఇప్పటివరకు పశువుల పెంపకందారులుగా ఉన్నాం; మేమే కాదు, మా పితరులు కూడా అలాగే ఉన్నారు.’ దీనివల్ల మీరు గోషెను దేశంలో నివసించగలరు. ఎందుకంటే మందను కాసే ప్రతి వాడూ[b] ఐగుప్తీయులకు అసహ్యమైనవాడు[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, మరింత పదశఃగా: “ఐగుప్తీయులకు హేయమైనవాడు.” హీబ్రూ ప్రయోగాన్ని అక్షరార్థంగా తీసుకుంటే, “ఐగుప్తీయులకు హేయవస్తువు.”'
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో “మందను కాసేవాడు”; ఇక్కడ “మంద” అనేది గొర్రెలు లేదా మేకలు వంటి చిన్న పశువుల మందను సూచించవచ్చు.
    reason: source_clarification
lexical_decisions:
- source_word: וַאֲמַרְתֶּם
  choice: అప్పుడు మీరు … అని చెప్పాలి
  rationale: ముందటి ఆదేశాన్ని అనుసరించే క్రమాన్నీ, ఆదేశ భావాన్నీ సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: אַנְשֵׁי מִקְנֶה
  choice: పశువుల పెంపకందారులు
  rationale: మిక్నె అనే పదంలోని పశుసంపద భావాన్ని నిలుపుతూ, ఆ పశువులను చూసుకోవడం వీరి వృత్తి అని సహజంగా తెలియజేస్తుంది.
- source_word: עֲבָדֶיךָ
  choice: మీ సేవకులమైన మేము
  rationale: ఫరో ఎదుట వినయపూర్వకంగా తమను తాము సూచించే రాజసభా ప్రయోగం; ఇక్కడ బానిసత్వాన్ని ప్రధానంగా సూచించడం లేదు.
- source_word: מִנְּעוּרֵינוּ וְעַד עַתָּה
  choice: చిన్నప్పటి నుంచి ఇప్పటివరకు
  rationale: బాల్యం నుంచి ప్రస్తుతకాలం వరకు కొనసాగిన జీవనోపాధిని సాధారణ పాఠకులకు సహజంగా తెలియజేస్తుంది.
- source_word: גַּם אֲנַחְנוּ גַּם אֲבֹתֵינוּ
  choice: మేమే కాదు, మా పితరులు కూడా అలాగే ఉన్నారు
  rationale: రెండుసార్లు వచ్చిన గమ్ పదం సూచించే తరతరాల కొనసాగింపును స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בַּעֲבוּר
  choice: అలా చెబితే
  rationale: వారు చెప్పవలసిన మాటకూ గోషెనులో నివసించే ఫలితానికీ ఉన్న ఉద్దేశ్య సంబంధాన్ని తెలుగులో సహజంగా చూపుతుంది.
- source_word: תֵּשְׁבוּ
  choice: నివసించగలరు
  rationale: యాషవ్ పదానికి ఈ సందర్భంలో స్థిరంగా ఉండడం లేదా నివసించడం అనే భావం ఉంది; సామర్థ్యంకన్నా ఆశించిన ఫలితాన్ని ఇక్కడ తెలియజేస్తుంది.
- source_word: בְּאֶרֶץ גֹּשֶׁן
  choice: గోషెను దేశంలో
  rationale: హీబ్రూ పాఠంలోని ‘దేశం/ప్రాంతం’ అనే పదాన్ని నిలుపుతుంది.
- source_word: תוֹעֲבַת מִצְרַיִם
  choice: ఐగుప్తీయులకు అసహ్యమైనవాడు
  rationale: హీబ్రూ నిర్మాణంలోని తీవ్రమైన తిరస్కార భావాన్ని ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది; ‘హేయమైనవాడు’ అనే మరింత పదశః ప్రత్యామ్నాయం పాదసూచికలో ఇవ్వబడింది.
- source_word: כָּל רֹעֵה צֹאן
  choice: మందల కాపరి ప్రతి ఒక్కడూ
  rationale: צֹאן చిన్న పశువుల మందను, ముఖ్యంగా గొర్రెలు-మేకల మందను సూచించగలదు; కేవలం గొర్రెలకు పరిమితం చేయకుండా మూలంలోని విస్తృతిని కాపాడుతుంది.
