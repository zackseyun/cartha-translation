  rationale: The revision retains the draft’s sound lexical choices while correcting the awkward final noun phrase and making the purpose/result connection clearer. Footnote markers remain anchored to the relevant expressions, and the footnotes preserve both the strong lexical alternative for “detestable” and the breadth of the Hebrew word for flock.
