  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలిని వాడాం. ‘మీ సేవకులు’ అనే మూలంలోని బహువచన స్వీయసూచన తెలుగులో సహజంగా ఉండేందుకు ‘మీ సేవకులమైన మేము’గా ఇచ్చాం. కారణార్థక వాక్యాన్ని తెలుగులో స్పష్టత కోసం ప్రత్యేక వాక్యంగా తీర్చిదిద్దాం.
