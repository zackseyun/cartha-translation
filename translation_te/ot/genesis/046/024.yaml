lexical_decisions:
- source_word: וּבְנֵי
  choice: కుమారులు
  rationale: בְנֵי అనేది ‘కుమారులు’ అనే అర్థమిచ్చే నిర్మాణ బహువచనం. ఇది వంశావళి జాబితా కొనసాగింపు అయినప్పటికీ, తెలుగులో సహజమైన జాబితా శైలికోసం ఆరంభ ו ప్రత్యేకంగా ‘మరియు’ అని అనువదించలేదు.
- source_word: נַפְתָּלִי
  choice: నఫ్తాలి
  rationale: హీబ్రూ వ్యక్తినామాన్ని ఆధునిక ప్రామాణిక తెలుగు ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: יַחְצְאֵל
  choice: యహ్జయేలు
  rationale: హీబ్రూ పేరులోని యోద్, హేత్, సాదే ధ్వనులను తెలుగులో చదవదగిన రీతిలో సాధ్యమైనంత దగ్గరగా ప్రతిబింబించే లిప్యంతరీకరణ.
- source_word: וְגוּנִי
  choice: గూనీ
  rationale: వ్యక్తినామాన్ని హీబ్రూ స్వరరూపానికి దగ్గరగా లిప్యంతరీకరించాం; ముందున్న ו ను జాబితా విరామచిహ్నం ద్వారా వ్యక్తం చేశాం.
- source_word: וְיֵצֶר
  choice: యేసెరు
  rationale: హీబ్రూ יֵצֶר పేరును దాని ధ్వనిరూపానికి దగ్గరగా, తెలుగులో సహజంగా చదవగలిగేలా లిప్యంతరీకరించాం.
- source_word: וְשִׁלֵּם
  choice: షిల్లేము
  rationale: దాగేశ్ సూచించే ద్విత్వ ల ధ్వనిని నిలిపి, హీబ్రూ పేరును తెలుగు రూపంలో లిప్యంతరీకరించాం; చివరి ו ను తెలుగు జాబితా నిర్మాణం ద్వారా వ్యక్తం చేశాం.
