  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగు లిప్యంతరీకరణ.
- source_word: נַעֲמָן
  choice: నయమాను
  rationale: హీబ్రూ నామంలోని రెండు అక్షరభాగాల మధ్యనున్న స్వల్ప విరామాన్ని తెలుగులో సహజంగా సూచించే రూపం.
- source_word: אֵחִי
  choice: ఏహీ
  rationale: ఈ వచనంలోని మసొరెటిక్ పాఠాన్నే అనుసరించిన లిప్యంతరీకరణ; సమాంతర వంశావళిలోని వేరే పేరును ప్రధాన పాఠంలోకి తేలేదు.
- source_word: רֹאשׁ
  choice: రోషు
  rationale: ఇక్కడ సాధారణ నామవాచకమైన ‘తల’ లేదా ‘నాయకుడు’ అనే అర్థంలో కాక వ్యక్తినామంగా ఉన్నందున లిప్యంతరీకరించాం.
