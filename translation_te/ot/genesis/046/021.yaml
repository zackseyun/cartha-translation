- source_word: חֻפִּים
  choice: హుప్పీము
  rationale: మసొరెటిక్ పాఠంలోని వ్యక్తినామానికి తెలుగు లిప్యంతరీకరణ.
- source_word: אָרְדְּ
  choice: అర్దు
  rationale: ఈ వచనంలోని మసొరెటిక్ పాఠాన్ని అనుసరించిన నామరూపం; సమాంతర వంశావళిలోని సంబంధిత రూపాన్ని ప్రధాన పాఠంలోకి తేలేదు.
