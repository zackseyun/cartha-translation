  yaml_path: translation/ot/genesis/046/021.yaml
  text: 'And the sons of Benjamin: Bela[a], Beker, Ashbel, Gera, Naaman, Ehi, Rosh, Muppim, Huppim[d][c][b], and Ard.'
translation:
  language: te
  text: 'బెన్యామీను కుమారులు: బేలా, బెకెరు[a], అష్బేలు, గేరా, నయమాను, ఏహీ[b], రోషు, ముప్పీము[c], హుప్పీము, అర్దు[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: సంప్రదాయ ఇంగ్లీషు అనువాదాల్లో בֶּכֶר అనే పేరును తరచుగా “Becher” అని వర్ణిస్తారు.
    reason: lexical_alternative
  - marker: b
    text: సంఖ్యాకాండము 26:38లోని సమాంతర బెన్యామీనీయుల వంశావళిలో ఈ వచనంలోని “ఏహీ” స్థానంలో “అహీరాము” ఉంది.
    reason: cross_reference
  - marker: c
    text: కొన్ని సమాంతర వంశావళి సంప్రదాయాల్లో “ముప్పీము”కు బదులుగా “షుప్పీము” వంటి రూపం ఉంది; ఇక్కడ మసొరెటిక్ పాఠాన్నే అనుసరించాం.
    reason: textual_variant
  - marker: d
    text: 1 దినవృత్తాంతములు 8:3లో బెన్యామీనీయుల వంశావళిలో దీనికి సంబంధితమైన “అద్దారు” అనే నామరూపం ఉంది; ఈ వచనంలో “అర్దు” అని ఉంది.
    reason: cross_reference
lexical_decisions:
- source_word: וּבְנֵי בִנְיָמִן
  choice: బెన్యామీను కుమారులు
  rationale: ఇది వంశావళి జాబితాను కొనసాగించే నిర్మాణం. తెలుగులో సహజంగా ఉండేందుకు ప్రారంభ waw‌ను ప్రత్యేకంగా ‘మరియు’ అని అనువదించకుండా, జాబితా కొనసాగింపును సందర్భానికే వదిలాం.
- source_word: בֶּלַע
  choice: బేలా
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగు లిప్యంతరీకరణ.
- source_word: בֶּכֶר
  choice: బేకెరు
  rationale: మసొరెటిక్ పాఠంలోని హల్లులను దగ్గరగా ప్రతిబింబించే తెలుగు రూపం.
- source_word: אַשְׁבֵּל
  choice: అష్బేలు
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగు లిప్యంతరీకరణ.
- source_word: גֵּרָא
