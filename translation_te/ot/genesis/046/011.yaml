base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/011.yaml
  text: 'And the sons of Levi: Gershon, Kohath, and Merari.'
translation:
  language: te
  text: 'లేవి కుమారులు: గెర్షోను, కెహాతు, మెరారి.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/בְנֵי לֵוִי
  choice: లేవి కుమారులు
  rationale: వంశావళి జాబితాలోని కొనసాగింపును తెలుగు వాక్యనిర్మాణం సహజంగా తెలియజేస్తుంది; అందువల్ల ఆరంభ וను ప్రత్యేకంగా ‘మరియు’ అని అనువదించలేదు. בְנֵי అనే పుంలింగ బహువచన నిర్మాణానికి ‘కుమారులు’ సరియైన సమానం.
- source_word: גֵּרְשׁוֹן
  choice: గేర్షోను
  rationale: హీబ్రూ గేర్షోన్ రూపాన్ని అనుసరించిన తెలుగు లిప్యంతరీకరణ; ఇది గేర్షోము అనే వేరే పేరుతో కలవకుండా ఉంచుతుంది.
- source_word: קְהָת
  choice: కహాతు
  rationale: హీబ్రూ קְהָת పేరుకు దగ్గరగా ఉండే, తెలుగులో చదవడానికి సహజమైన లిప్యంతరీకరణ.
- source_word: וּ/מְרָרִי
  choice: మెరారి
  rationale: చివరి పేరును తెలుగు జాబితా విరామచిహ్నాలతో సహజంగా అనుసంధానించాం; హీబ్రూ పేరును ‘మెరారి’గా లిప్యంతరీకరించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన, గౌరవప్రదమైన వంశావళి శైలి. పేర్లను మూల హీబ్రూ రూపాలకు దగ్గరగా లిప్యంతరీకరించాం.
