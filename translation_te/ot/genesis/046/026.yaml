revisions:
- from: యాకోబుకు చెందినవారిగా ఐగుప్తుకు వచ్చినవారందరూ—యాకోబు కుమారుల భార్యలను మినహాయించి, అతని నడుమునుండి పుట్టినవారు[a]—మొత్తం అరవై ఆరుగురు[b].
  to: యాకోబుకు చెందినవారై, అతని వంశస్థులుగా ఐగుప్తుకు వచ్చినవారందరూ[a]—యాకోబు కుమారుల భార్యలను మినహాయించి—మొత్తం అరవై ఆరుగురు[b].
  rationale: The revision replaces an unnatural and potentially over-narrow rendering of the Hebrew genealogical idiom with natural Telugu “వంశస్థులు,” while preserving the literal wording and its biological-descendant sense in a footnote. It also smooths the opening clause and retains the explicit exclusion and total.
