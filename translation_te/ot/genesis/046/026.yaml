review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the total of sixty-six and the exclusion of Jacob’s sons’ wives. However, “అతని నడుమునుండి పుట్టినవారు” is not idiomatic modern Telugu and can suggest only those directly born from Jacob, whereas the Hebrew idiom denotes those descended from him in the genealogical count.
  naturalness: “యాకోబుకు చెందినవారిగా ఐగుప్తుకు వచ్చినవారందరూ” is understandable but slightly cumbersome. Recasting it as “యాకోబుకు చెందినవారై ... ఐగుప్తుకు వచ్చినవారందరూ” is smoother while retaining the relational force of לְיַעֲקֹב.
  terminology: Use “వంశస్థులు” in the main text for the Hebrew idiom יֹצְאֵי יְרֵכוֹ, with the literal bodily idiom retained and explained in the footnote. “మొత్తం అరవై ఆరుగురు” appropriately represents the census use of נֶפֶשׁ.
  issues:
  - severity: medium
    issue: అతని నడుమునుండి పుట్టినవారు
    rationale: This expression is awkward in modern Telugu and may over-specify immediate biological birth. The Hebrew idiom is genealogical and encompasses descendants counted in Jacob’s line.
  - severity: low
    issue: యాకోబుకు చెందినవారిగా ఐగుప్తుకు వచ్చినవారందరూ
    rationale: The construction is somewhat heavy. A minor recasting improves readability without changing the source relationship or implying that all physically travelled alongside Jacob.
  revised_text: యాకోబుకు చెందినవారై, అతని వంశస్థులుగా ఐగుప్తుకు వచ్చినవారందరూ[a]—యాకోబు కుమారుల భార్యలను మినహాయించి—మొత్తం అరవై ఆరుగురు[b].
