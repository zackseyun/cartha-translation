  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כָּל הַ֠/נֶּפֶשׁ הַ/בָּאָ֨ה לְ/יַעֲקֹ֤ב מִצְרַ֨יְמָ/ה֙ יֹצְאֵ֣י יְרֵכ֔/וֹ מִ/לְּ/בַ֖ד נְשֵׁ֣י בְנֵי יַעֲקֹ֑ב כָּל נֶ֖פֶשׁ שִׁשִּׁ֥ים וָ/שֵֽׁשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/026.yaml
  text: All the persons belonging to Jacob who came to Egypt[a], who came from his loins, besides the wives of Jacob’s sons[b], were sixty-six persons in all.
translation:
  language: te
  text: యాకోబుకు చెందినవారై, అతని వంశస్థులుగా ఐగుప్తుకు వచ్చినవారందరూ[a]—యాకోబు కుమారుల భార్యలను మినహాయించి—మొత్తం అరవై ఆరుగురు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “అతని తొడనుండి బయలుదేరినవారు”; ఇది అతని జీవసంబంధమైన సంతానాన్ని సూచించే నానుడి.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో “మొత్తం ప్రాణాలు అరవై ఆరు” అని ఉంది. ఇక్కడ “ప్రాణం” అనేది వ్యక్తులను లెక్కించే హీబ్రూ ప్రయోగం.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַנֶּפֶשׁ
  choice: వారందరూ
  rationale: వంశావళి లెక్కలో נֶפֶשׁ వ్యక్తులను సూచిస్తుంది. తెలుగులో ‘ప్రాణాలు’ అనడం అసహజంగా, తప్పుదారి పట్టించేలా ఉండవచ్చు; ‘వారందరూ’ వ్యక్తుల లెక్కను సహజంగా తెలియజేస్తుంది.
- source_word: הַבָּאָה לְיַעֲקֹב מִצְרַיְמָה
  choice: యాకోబుకు చెందినవారిగా ఐగుప్తుకు వచ్చినవారు
  rationale: לְיַעֲקֹב నిర్మాణంలోని సంబంధార్థాన్ని నిలుపుతూ, కేవలం యాకోబుతో భౌతికంగా ప్రయాణించినవారనే భావానికి పరిమితం చేయకుండా అతని కుటుంబానికి చెందినవారిని సూచిస్తుంది.
- source_word: יֹצְאֵי יְרֵכוֹ
  choice: అతని నడుమునుండి పుట్టినవారు
  rationale: హీబ్రూ శరీరాధారిత నానుడి జీవసంబంధమైన సంతానాన్ని సూచిస్తుంది. ‘నడుమునుండి పుట్టినవారు’ దాని దృశ్యరూపాన్ని నిలుపుతుంది; పాదటిప్పణి భావాన్ని వివరిస్తుంది.
- source_word: מִלְּבַד
  choice: మినహాయించి
  rationale: ఈ పదం లెక్కలో చేర్చని వర్గాన్ని స్పష్టంగా సూచిస్తుంది.
- source_word: נְשֵׁי בְנֵי יַעֲקֹב
  choice: యాకోబు కుమారుల భార్యలు
  rationale: మూలంలోని సంబంధాన్ని స్పష్టమైన, సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: כָּל נֶפֶשׁ שִׁשִּׁים וָשֵׁשׁ
  choice: మొత్తం అరవై ఆరుగురు
  rationale: మొత్తం వ్యక్తుల సంఖ్యను సహజమైన తెలుగు లెక్కింపు రూపంలో అందిస్తుంది; נֶפֶשׁ యొక్క వ్యక్తి-సూచక ప్రయోగాన్ని ‘గురు’ ద్వారా ప్రతిబింబిస్తుంది.
theological_decisions:
- issue: యాకోబుతో సంబంధాన్ని సూచించే לְיַעֲקֹב
  choice: యాకోబుకు చెందినవారిగా
  alternative: యాకోబుతో కలిసి
  rationale: మూల నిర్మాణంలోని సంబంధార్థాన్ని కాపాడి, తప్పనిసరిగా ఒకే సమయంలో అతనితో ప్రయాణించారనే అర్థాన్ని అనవసరంగా స్థిరపరచదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. మూలంలోని ‘నడుము/తొడ’ నానుడి పూర్తిగా సమతలీకరించకుండా ప్రధాన పాఠ్యంలో నిలిపి, అక్షరరూపం మరియు ఉద్దేశ్యాన్ని పాదటిప్పణిలో వివరించాం.
