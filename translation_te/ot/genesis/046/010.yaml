source:
  edition: WLC
  text: וּ/בְנֵ֣י שִׁמְע֗וֹן יְמוּאֵ֧ל וְ/יָמִ֛ין וְ/אֹ֖הַד וְ/יָכִ֣ין וְ/צֹ֑חַר וְ/שָׁא֖וּל בֶּן הַֽ/כְּנַעֲנִֽית־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/010.yaml
  text: 'And the sons of Simeon: Jemuel[a], Jamin, Ohad, Jachin, Zohar, and Shaul, the son of the Canaanite woman.'
translation:
  language: te
  text: 'షిమ్యోను కుమారులు: యెమూయేలు, యామీను, ఓహదు, యాకీను, జోహరు, కనానీయురాలి కుమారుడైన షౌలు.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי שִׁמְעוֹן
  choice: షిమ్యోను కుమారులు
  rationale: వంశావళిలో తదుపరి అంశాన్ని పరిచయం చేసే సమాస నిర్మాణం. తెలుగులో సహజమైన జాబితా శైలికోసం ఆరంభ వావ్‌ను ప్రత్యేకంగా ‘మరియు’ అని అనువదించలేదు.
- source_word: יְמוּאֵל
  choice: యెమూయేలు
  rationale: హీబ్రూ ఉచ్చారణను ప్రతిబింబించే తెలుగు లిప్యంతరీకరణ.
- source_word: יָמִין
  choice: యామీను
  rationale: హీబ్రూ పేరును తెలుగు ధ్వని వ్యవస్థకు అనుగుణంగా లిప్యంతరీకరించింది.
- source_word: אֹהַד
  choice: ఓహదు
  rationale: హీబ్రూ స్వర, వ్యంజన రూపాన్ని దగ్గరగా అనుసరించే లిప్యంతరీకరణ.
- source_word: יָכִין
  choice: యాకీను
  rationale: ఆదిలోని హీబ్రూ యోడ్‌ను ‘య’గా, ఖాఫ్‌ను ‘క’గా సహజంగా ప్రతిబింబించింది.
- source_word: צֹחַר
  choice: జోహరు
  rationale: హీబ్రూ צ ధ్వనికి తెలుగు బైబిలు పేర్లలో సులభంగా గ్రహించగల ‘జ’ రూపాన్ని ఎంచుకుంది; పేరును అర్థానువాదం చేయలేదు.
- source_word: שָׁאוּל
  choice: షావూలు
  rationale: సాంప్రదాయ రూపాన్ని రుద్దకుండా హీబ్రూ షిన్ మరియు స్వర క్రమాన్ని స్పష్టంగా ప్రతిబింబించే లిప్యంతరీకరణ.
- source_word: בֶּן הַכְּנַעֲנִית
  choice: కనానీయురాలి కుమారుడైన
  rationale: నిర్దిష్ట స్త్రీలింగ జాతివాచక రూపాన్ని తెలుగులో ‘కనానీయురాలు’గా స్పష్టంగా నిలిపి, షావూలుతో దాని సంబంధాన్ని సహజంగా తెలిపింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన, గౌరవప్రదమైన వంశావళి శైలి. వ్యక్తి పేర్లు మూల హీబ్రూకు దగ్గరగా లిప్యంతరీకరించబడ్డాయి. తెలుగు వాక్యప్రవాహంలో జాబితాకు ముందు ‘మరియు’ అవసరం లేకపోవడంతో మూలంలోని ప్రారంభ సంధికార్థం నిర్మాణాత్మకంగా వ్యక్తమైంది.
