  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ వాక్యం చాలా సంక్షిప్తంగా ఉంది; అక్షరార్థంగా, “దాను కుమారులు: హుషీము.” “కుమారులు” అనేది బహువచనమైనప్పటికీ, హుషీము ఒక వ్యక్తి పేరు; ఈ వంశావళిలో దాను సంతానంగా ఇతడు ఒక్కడే పేర్కొనబడ్డాడు.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: కుమారులు
  rationale: בְנֵי అనేది ‘కుమారుడు’ అనే పదానికి నిర్మాణ బహువచన రూపం; వంశావళి సందర్భంలో ‘కుమారులు’ సహజమైన, మూలానికి దగ్గరైన అనువాదం. వాక్యారంభంలోని וּ ఇక్కడ జాబితాలోని అనుసంధానాన్ని సూచిస్తుంది; తెలుగులో వరుస వంశావళి శైలిలో ప్రత్యేకంగా ‘మరియు’ చేర్చకపోయినా ఆ సంబంధం సహజంగా వ్యక్తమవుతుంది.
- source_word: דָן
  choice: దాను
  rationale: వ్యక్తి పేరును తెలుగులో స్థిరపడిన బైబిలు రూపమైన ‘దాను’గా లిప్యంతరీకరించాం.
- source_word: חֻשִׁים
  choice: హుషీము
  rationale: ఇది రూపానికి బహువచనంలా కనిపించినా, ఈ సందర్భంలో వ్యక్తి పేరు. మూలంలోని క్రియలేని సంక్షిప్త నామవాక్య శైలిని నిలుపుతూ ‘హుషీము అతని కుమారుడు’ అని విస్తరించలేదు.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళికి తగిన సంక్షిప్తమైన గంభీర శైలిని వాడాం. హీబ్రూ మూలంలోని బహువచన ‘కుమారులు’కూ ఏకైక వ్యక్తి పేరు ‘హుషీము’కూ మధ్య ఉన్న అసమతౌల్యాన్ని సరిచేయకుండా పాఠ్యంలో నిలిపి, పాదసూచికలో వివరించాం.
