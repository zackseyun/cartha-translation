    rationale: హీబ్రూ క్రియకు దిశానిర్దేశం చేయడం లేదా బోధించడం అనే విస్తృత భావం ఉంది; ఎవరు ఎవరిని నడిపించాలనే అదనపు చర్యను పాఠ్యం స్పష్టంగా చెప్పదు.
