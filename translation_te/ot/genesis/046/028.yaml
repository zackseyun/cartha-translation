source:
  edition: WLC
  text: וְ/אֶת יְהוּדָ֞ה שָׁלַ֤ח לְ/פָנָי/ו֙ אֶל יוֹסֵ֔ף לְ/הוֹרֹ֥ת לְ/פָנָ֖י/ו גֹּ֑שְׁנָ/ה וַ/יָּבֹ֖אוּ אַ֥רְצָ/ה גֹּֽשֶׁן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/028.yaml
  text: He sent Judah ahead of him to Joseph[a], to show the way before him to Goshen[c][b]; and they came into the land of Goshen.
translation:
  language: te
  text: యాకోబు తనకు ముందుగా యూదాను యోసేపు దగ్గరికి పంపించాడు, యాకోబు గోషెనుకు వెళ్లే విషయంలో ముందుగా మార్గనిర్దేశం చేయడానికి.[a] వారు గోషెను ప్రాంతానికి వచ్చారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యాకోబు గోషెనుకు వెళ్లేందుకు ముందుగా దారి చూపించడానికి”; లేదా, “యాకోబు గోషెనుకు చేరుకునే ముందు ఏర్పాట్లు చేయడానికి.” హీబ్రూ వాక్యం సంక్షిప్తంగా ఉంది. ఇక్కడి క్రియకు ‘దారి చూపించడం,’ ‘నిర్దేశించడం,’ లేదా ‘బోధించడం’ అనే భావాలు ఉండవచ్చు.
    reason: lexical_and_syntactic_ambiguity
lexical_decisions:
- source_word: שָׁלַח
  choice: పంపించాడు
  rationale: Qal క్రియ యొక్క సాధారణ అర్థమైన ‘పంపడం’ను సహజమైన ఆధునిక తెలుగు కథనశైలిలో వ్యక్తపరుస్తుంది.
- source_word: לְפָנָיו
  choice: తనకంటే ముందుగా
  rationale: యూదాను యాకోబు రాకకు ముందే పంపించాడనే కాలస్థల భావాన్ని తెలుగు నుడికారంలో స్పష్టంగా తెలియజేస్తుంది.
- source_word: לְהוֹרֹת
  choice: దారిని … చూపించడానికి
  rationale: ירה అనే క్రియ యొక్క Hiphil రూపానికి ‘నిర్దేశించడం, బోధించడం, చూపించడం’ అనే అర్థాలు ఉన్నాయి. ప్రయాణ సందర్భంలో ‘దారి చూపించడం’ సహజమైనది; అయితే కర్త లేదా ఖచ్చితమైన కార్యవిధానం సంక్షిప్త హీబ్రూ వాక్యంలో స్పష్టంగా లేదు కాబట్టి పాదసూచికలో ప్రత్యామ్నాయాలను ఉంచాం.
- source_word: גֹּשְׁנָה
  choice: గోషెనుకు
  rationale: స్థలనామానికి జోడించిన directional he గోషెను వైపు కదలికను సూచిస్తుంది; తెలుగులో చతుర్థీ విభక్తి దీనిని సహజంగా తెలియజేస్తుంది.
- source_word: וַיָּבֹאוּ
  choice: వారు … వచ్చారు
  rationale: בוא అనే సాధారణ కథన క్రియను సూటిగా ప్రతిబింబిస్తుంది.
- source_word: אַרְצָה גֹּשֶׁן
  choice: గోషెను ప్రాంతానికి
  rationale: אֶרֶץ ఇక్కడ గోషెను అనే భూభాగాన్ని సూచిస్తుంది. ‘ప్రాంతం’ ఆధునిక తెలుగులో సహజంగా ఉండి, కేవలం పట్టణాన్ని సూచిస్తున్నట్టుగా కాకుండా భూభాగ భావాన్ని నిలుపుతుంది.
- source_word: יְהוּדָה / יוֹסֵף / גֹּשֶׁן
  choice: యూదా / యోసేపు / గోషెను
  rationale: వ్యక్తి, స్థల నామాలను తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలిని ఉపయోగించాం. పొడవైన హీబ్రూ వాక్యాన్ని స్పష్టత కోసం రెండు వాక్యాలుగా విభజించాం. ‘లెహోరోత్’ ఉన్న సంక్షిప్త ఉపవాక్యంలోని నిజమైన కర్త-కర్మ అస్పష్టతను ప్రధాన పాఠ్యంలో అతిగా పరిష్కరించకుండా, ప్రత్యామ్నాయ అర్థాలను పాదసూచికలో నిలిపాం.
