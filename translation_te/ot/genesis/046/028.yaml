  rationale: సవరించిన పాఠం యూదాను యాకోబుకన్నా ముందుగా యోసేపు దగ్గరికి పంపిన విషయాన్ని, గోషెనుకు సంబంధించిన దిశానిర్దేశ ఉద్దేశాన్ని స్పష్టంగా వ్యక్తపరుస్తుంది. ‘ఎర్పాట్లు చేయడం’ అనే సందర్భానుగత వివరణను ప్రధాన పాఠ్యంలో చేర్చకుండా పాదసూచికలో ప్రత్యామ్నాయంగా ఉంచాం; అందువల్ల హీబ్రూ సంక్షిప్తతను, దాని అర్థపరిధిని కాపాడాం.
