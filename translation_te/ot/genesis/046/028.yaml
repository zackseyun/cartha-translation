    rationale: హీబ్రూలో לְפָנָיו యొక్క ముందస్తు/యాకోబుకు సంబంధించిన సంబంధం సంక్షిప్తంగా ఉన్నప్పటికీ, తెలుగులో ‘తనకు’ యూదానికా యాకోబుకా అన్నది క్షణికంగా సందిగ్ధంగా ఉంటుంది. యాకోబు పేరును పునరుక్తి చేయడం అర్థాన్ని స్పష్టం చేస్తుంది.
