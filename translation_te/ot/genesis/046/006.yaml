  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּקְח֣וּ אֶת מִקְנֵי/הֶ֗ם וְ/אֶת רְכוּשָׁ/ם֙ אֲשֶׁ֤ר רָֽכְשׁוּ֙ בְּ/אֶ֣רֶץ כְּנַ֔עַן וַ/יָּבֹ֖אוּ מִצְרָ֑יְמָ/ה יַעֲקֹ֖ב וְ/כָל זַרְע֥/וֹ אִתּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/006.yaml
  text: They took their livestock and their possessions that they had acquired in the land of Canaan[a], and they came to Egypt—Jacob and all his offspring with him.
translation:
  language: te
  text: వారు తమ పశువులను, కనాను దేశంలో తాము సంపాదించిన ఆస్తులన్నిటిని తీసుకొని ఐగుప్తుకు వచ్చారు—యాకోబు తన సంతానమంతటితో కలిసి వచ్చాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వంశస్థులంతా.’ హీబ్రూ పదం ‘విత్తనం,’ ‘సంతానం,’ లేదా ‘వంశస్థులు’ అనే అర్థాలను ఇవ్వగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: వారు … తీసుకొని
  rationale: לקח అనే క్రియకు ‘తీసుకొను’ అనేది సహజమైన సమానార్థకం. వరుస కథనంలోని చర్యను తెలుగులో సంయుక్త క్రియారూపంతో సహజంగా తెలిపింది.
- source_word: מִקְנֵיהֶם
  choice: తమ పశువులను
  rationale: מִקְנֶה సాధారణంగా మందలు సహా పెంచుకునే జంతువులన్నిటినీ సూచిస్తుంది; ‘పశువులు’ ఆధునిక తెలుగులో విస్తృతమైన, స్పష్టమైన పదం.
- source_word: רְכוּשָׁם
  choice: ఆస్తులన్నిటిని
  rationale: רְכוּשׁ చరాస్తి, సామగ్రి, సంపదను సూచిస్తుంది. ముందు పేర్కొన్న పశువుల నుండి దీనిని వేరుగా ఉంచుతూ ‘ఆస్తులు’ భావాన్ని సహజంగా అందిస్తుంది; ‘అన్నిటిని’ ప్రత్యయసంబంధమైన సంపూర్ణతను తెలుపుతుంది.
- source_word: אֲשֶׁר רָכְשׁוּ
  choice: తాము సంపాదించిన
  rationale: רכשׁ అంటే సంపాదించుట లేదా కూడబెట్టుట. ప్రయాణానికి ముందే కనానులో పొందిన ఆస్తులను సూచించేందుకు ఈ రూపం సహజంగా ఉంది.
- source_word: בְּאֶרֶץ כְּנַעַן
  choice: కనాను దేశంలో
  rationale: హీబ్రూలోని ‘కనాను దేశం’ అనే భౌగోళిక నిర్దిష్టతను నిలుపుతుంది.
- source_word: וַיָּבֹאוּ מִצְרָיְמָה
  choice: ఐగుప్తుకు వచ్చారు
  rationale: దిశాసూచక రూపం ఐగుప్తు వైపు ప్రయాణాన్ని తెలుపుతుంది. ‘వచ్చారు’ בוא యొక్క సాధారణ కథనార్థాన్ని కాపాడుతుంది; ‘ప్రవేశించారు’ అనడం మూలంలో లేని సరిహద్దు దాటడాన్ని అధికంగా నిర్దిష్టం చేస్తుంది.
- source_word: יַעֲקֹב וְכָל זַרְעוֹ אִתּוֹ
  choice: యాకోబు, అతనితోపాటు అతని సంతానమంతా
  rationale: זֶרַע ఇక్కడ యాకోబు కుటుంబ వంశాన్ని సూచిస్తుంది. ‘సంతానం’ తక్షణ కుటుంబ సభ్యులతో పాటు వంశస్థుల భావాన్ని కూడా మోయగల సహజ తెలుగు పదం; ‘అతనితోపాటు’ אִתּוֹ భావాన్ని స్పష్టంగా ఇస్తుంది.
theological_decisions:
- issue: זֶרַע పదంలోని పరిధి
  choice: సంతానం
  alternative: వంశస్థులు
  rationale: సందర్భంలో యాకోబుతో ప్రయాణించిన కుటుంబ వంశమంతటినీ సూచిస్తుంది. ‘సంతానం’ మూలపదంలోని సమూహార్థాన్ని, తక్షణ కుటుంబ సంబంధాన్ని కాపాడుతుంది; ‘వంశస్థులు’ కూడా సాధ్యమైన అర్థమని పాదటిప్పణిలో తెలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలిని ఉపయోగించాం. హీబ్రూ వాక్యాంతంలోని ‘యాకోబు, అతని సంతానమంతా’ అనే వివరణాత్మక పునరుద్ఘాటనను దీర్ఘవిరామంతో నిలిపి, తెలుగులో స్పష్టత కోసం ‘వచ్చారు’ను పునరుక్తం చేశాం. పాదటిప్పణి సూచిక [a] ప్రధాన పాఠ్యంలో సంబంధిత పదబంధం వెంట ఉంచబడింది.
