  text: 'And the sons of Zebulun: Sered[a], Elon, and Jahleel.'
translation:
  language: te
  text: 'జెబూలూను కుమారులు: సెరెదు, ఏలోను, యహలేలు.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: కుమారులు
  rationale: בְּנֵי అనేది ‘కుమారుడు’ అనే పదానికి నిర్మాణ బహువచన రూపం; వంశావళి జాబితాలో ‘కుమారులు’ సహజమైన అనువాదం. వాక్యారంభంలోని ו జాబితా కొనసాగింపును సూచిస్తుంది; తెలుగులో అది విరామచిహ్నం మరియు సందర్భం ద్వారా సహజంగా వ్యక్తమవుతుంది.
- source_word: זְבוּלֻן
  choice: జెబూలూను
  rationale: వ్యక్తి పేరు; హీబ్రూ ఉచ్చారణకు దగ్గరగా, తెలుగులో సహజంగా లిప్యంతరీకరించబడింది.
- source_word: סֶרֶד
  choice: సెరెదు
  rationale: వ్యక్తి పేరును హీబ్రూ రూపానికి దగ్గరగా తెలుగులో లిప్యంతరీకరించాం.
- source_word: וְ/אֵלוֹן
  choice: ఏలోను
  rationale: ఇక్కడ אֵלוֹן వ్యక్తి పేరు; సాధారణ నామవాచక అర్థాన్ని అనువదించకుండా పేరుగా లిప్యంతరీకరించాం. జాబితాలోని సంధిని తెలుగులో కామా ద్వారా సహజంగా తెలిపాం.
- source_word: וְ/יַחְלְאֵל
  choice: యహలేలు
  rationale: వ్యక్తి పేరును హీబ్రూ ప్రారంభ యోడ్ మరియు మధ్య హేత్ ధ్వనులకు దగ్గరగా ‘యహలేలు’గా లిప్యంతరీకరించాం; ఆంగ్ల సంప్రదాయంలోని ‘Jahleel’ రూపాన్ని ఆధారంగా చేసుకోలేదు.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్త వంశావళి శైలిని నిలబెట్టాం. మూలంలోని జాబితా నిర్మాణాన్ని సహజమైన తెలుగు విరామచిహ్నాలతో వ్యక్తం చేశాం; పేర్లను మూల హీబ్రూకు దగ్గరగా లిప్యంతరీకరించాం.
