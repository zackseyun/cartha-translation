  yaml_path: translation/ot/genesis/046/008.yaml
  text: 'These are the names of the sons of Israel who came to Egypt: Jacob and his sons[b][a]. Jacob’s firstborn was Reuben.'
translation:
  language: te
  text: 'ఐగుప్తుకు వచ్చిన ఇశ్రాయేలు కుమారుల పేర్లు ఇవి: యాకోబు, అతని కుమారులు.[a][b] యాకోబుకు తొలిపుట్టినవాడు రూబేను.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, మరింత రూపనిష్ఠగా: “ఐగుప్తులోకి వచ్చిన ఇశ్రాయేలు కుమారుల పేర్లు ఇవి.”'
    reason: lexical_alternative
  - marker: b
    text: ఈ భాగాన్ని “ఐగుప్తుకు వచ్చిన ఇశ్రాయేలు కుమారులు—యాకోబు, అతని కుమారులు” అని కూడా విరామచిహ్నాలతో అమర్చవచ్చు.
    reason: syntactic_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: ఇవి
  rationale: వంశావళి జాబితాను పరిచయం చేసే సహజమైన ఆధునిక తెలుగు రూపం. వావ్ సంధానార్థాన్ని తప్పనిసరిగా ‘మరియు’ అని అనువదించకుండా, తెలుగు వాక్యప్రవాహంలో వ్యక్తం చేశాం.
- source_word: שְׁמוֹת
  choice: పేర్లు
  rationale: బహువచన నిర్మాణానికి నేరమైన, సహజమైన తెలుగు సమానం.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: ఈ సందర్భంలో వెంటనే పురుష సంతానపు పేర్లు వస్తున్నందున విస్తృతార్థకమైన ‘సంతానం’ కంటే లింగాన్ని స్పష్టంగా తెలిపే ‘కుమారులు’ ఎంచుకున్నాం.
- source_word: הַבָּאִים
  choice: వచ్చిన
  rationale: నిర్దిష్ట ఆర్టికల్‌తో ఉన్న కృదంతం ఇక్కడ ఇప్పటికే జరిగిన ప్రయాణంలో పాల్గొన్నవారిని వివరిస్తుంది; తెలుగులో భూతకాల విశేషణ రూపం సహజంగా ఉంటుంది.
- source_word: מִצְרַיְמָה
  choice: ఐగుప్తుకు
  rationale: దిశను సూచించే హెబ్రీ ప్రత్యయం గమ్యాన్ని తెలియజేస్తుంది; ‘ఐగుప్తుకు’ ఆ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: יַעֲקֹב וּבָנָיו
  choice: యాకోబు, అతని కుమారులు
  rationale: హెబ్రీలోని సంక్షిప్త అనుబంధ వివరణను అలాగే ఉంచి, ముందున్న పరిచయ వాక్యానికి తరువాత జాబితా ప్రారంభమవుతున్న భావాన్ని కోలన్‌తో చూపించాం.
- source_word: בְּכֹר יַעֲקֹב
  choice: యాకోబు తొలిపుట్టినవాడు
  rationale: జనన క్రమాన్ని సూచించే నిర్మాణాన్ని సహజమైన తెలుగు బంధంతో అనువదించాం.
- source_word: רְאוּבֵן
  choice: రూబేను
  rationale: తెలుగు బైబిలు వాడుకలో సుపరిచితమైన పేరురూపాన్ని ఉపయోగించాం.
theological_decisions:
- issue: ‘ఇశ్రాయేలు కుమారులు’ తరువాత ‘యాకోబు, అతని కుమారులు’ అనే అనుబంధ పదబంధం యొక్క సంబంధం
  choice: కోలన్‌తో మూలంలోని సంక్షిప్తతను, కొంత అస్పష్టమైన అనుబంధాన్ని నిలుపుకున్నాం.
  alternative: ‘అంటే యాకోబు, అతని కుమారులు’ అని వివరణాత్మకంగా మార్చడం.
  rationale: ‘అంటే’ చేర్చితే సంబంధాన్ని అనువాదకుడు ముందుగానే నిర్ణయించినట్లవుతుంది. మూలంలోని వ్యాకరణ ఉద్రిక్తతను పాఠకునికి అందుబాటులో ఉంచడం సముచితం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయితే వంశావళి పరిచయానికి తగిన గంభీరతతో అనువదించాం. పేర్లకు సుపరిచిత తెలుగు బైబిలు రూపాలను వాడాం; మూలంలోని అనుబంధ నిర్మాణాన్ని అతిగా వివరణ చేయలేదు.
