  text: וַ/יֹּ֕אמֶר אָנֹכִ֥י הָ/אֵ֖ל אֱלֹהֵ֣י אָבִ֑י/ךָ אַל תִּירָא֙ מֵ/רְדָ֣ה מִצְרַ֔יְמָ/ה כִּֽי לְ/ג֥וֹי גָּד֖וֹל אֲשִֽׂימְ/ךָ֥ שָֽׁם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/003.yaml
  text: And he said[a], “I am God, the God of your father. Do not be afraid to go down to Egypt, for there I will make you into a great nation.”
translation:
  language: te
  text: 'ఆయన ఇలా అన్నాడు: “నేనే దేవుణ్ణి, నీ తండ్రి దేవుణ్ణి. ఐగుప్తుకు దిగివెళ్లడానికి భయపడకు; ఎందుకంటే అక్కడ నేను నిన్ను గొప్ప జనంగా చేస్తాను.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָאֵל
  choice: దేవుణ్ణి
  rationale: నిర్దిష్ట ఉపపదంతో ఉన్న ఈ దైవ బిరుదు వక్తను బలంగా గుర్తిస్తుంది. ‘నేనే దేవుణ్ణి’ అనేది ఆ ఉద్ఘాటనను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אֱלֹהֵי אָבִיךָ
  choice: నీ తండ్రి దేవుణ్ణి
  rationale: ఏకవచనంలోని ‘నీ తండ్రి’ని అలాగే ఉంచి, యాకోబు పితృసంబంధమైన గుర్తింపును కాపాడుతుంది.
- source_word: אַל תִּירָא מֵרְדָה
  choice: దిగివెళ్లడానికి భయపడకు
  rationale: ‘భయపడు’ అనే క్రియతో infinitive నిర్మాణం ఇక్కడ ఒక కార్యం చేయడానికి వెనుకాడే భయాన్ని సూచిస్తుంది. ఈ తెలుగు రూపం అర్థాన్నీ, ‘దిగడం’ అనే మూలభాషా దిశా చిత్రాన్నీ నిలుపుతుంది.
- source_word: מִצְרַיְמָה
  choice: ఐగుప్తుకు
  rationale: దిశను సూచించే ప్రత్యయం ఐగుప్తు వైపు కదలికను తెలుపుతుంది; తెలుగులో గమ్యార్థక చతుర్థీ సహజంగా దాన్ని వ్యక్తం చేస్తుంది.
- source_word: לְגוֹי גָּדוֹל אֲשִׂימְךָ
  choice: నిన్ను గొప్ప జనంగా చేస్తాను
  rationale: שׂים + לְ నిర్మాణం ఫలితాన్ని, అంటే యాకోబును గొప్ప జనంగా రూపొందించడాన్ని సూచిస్తుంది. ‘జనం’ ఇక్కడ కేవలం జనసమూహం కాక, వంశాధారిత ప్రజాసముదాయాన్ని సూచిస్తుంది.
- source_word: שָׁם
  choice: అక్కడ
  rationale: ఈ స్థలవాచక క్రియావిశేషణం వాగ్దానం నెరవేరే ప్రదేశంగా ఐగుప్తును స్పష్టంగా సూచిస్తుంది.
theological_decisions:
- issue: దైవ స్వపరిచయంలో పితృసంబంధ సూచన
  choice: నీ తండ్రి దేవుణ్ణి
  alternative: నీ పితరుల దేవుణ్ణి
  rationale: హీబ్రూ పాఠంలో ‘తండ్రి’ ఏకవచనంలో ఉంది. దాన్ని బహువచనంగా విస్తరించకుండా ఉంచడం తక్షణ పితృ/నిబంధన సంబంధాన్ని సంరక్షిస్తుంది.
- issue: గొప్ప జనంగా చేయబడే స్థలం
  choice: అక్కడ నేను నిన్ను గొప్ప జనంగా చేస్తాను
  alternative: నేను నిన్ను గొప్ప జనంగా చేసి అక్కడ ఉంచుతాను
  rationale: ‘అక్కడ’ అనేది ఐగుప్తులోనే గొప్ప జనంగా రూపుదిద్దుకునే వాగ్దానాన్ని సూచిస్తుంది; שׂים ను స్థాపించడం/ఉంచడం అని వేరుగా అర్థం చేసుకోవడం ఈ నిర్మాణంలో తక్కువ సంభావ్యం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనా గౌరవప్రదమైన ప్రత్యక్ష వాక్యశైలి. ‘నేనే’ ద్వారా אָנֹכִי הָאֵל లోని ఉద్ఘాటనను, ‘దిగివెళ్లడానికి’ ద్వారా మూలంలోని భౌగోళిక దిశాభావాన్ని నిలిపాం. ప్రధాన పాఠంలో అడుగు గమనిక సూచికలు లేవు, ఎందుకంటే ప్రచురణకు అవసరమైన నిజమైన పాఠాంతర లేదా ముఖ్యమైన అర్థసందిగ్ధత ఇక్కడ లేదు.
