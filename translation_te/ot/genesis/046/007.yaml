  yaml_path: translation/ot/genesis/046/007.yaml
  text: His sons and his grandsons with him[a], his daughters and his granddaughters[b], and all his offspring he brought with him to Egypt.
translation:
  language: te
  text: తనతో ఉన్న తన కుమారులను, మనవళ్లను, తన కుమార్తెలను, మనవరాళ్లను[a], తన సంతానమంతటినీ[b] అతడు తనతోపాటు ఐగుప్తుకు తీసుకువచ్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘తన కుమారుల కుమారులు,’ ‘తన కుమారుల కుమార్తెలు.’
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘తన వారసులందరినీ’; అక్షరార్థంగా, ‘తన విత్తనమంతటినీ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּנָיו
  choice: తన కుమారులను
  rationale: ఈ వాక్యంలో కుమార్తెలు వేరుగా ప్రస్తావించబడ్డారు కాబట్టి, పురుష సంతానాన్ని సూచించే నిర్దిష్ట పదమే తగినది.
- source_word: וּבְנֵי בָנָיו
  choice: మనవళ్లను
  rationale: మూలంలో అక్షరార్థంగా ‘తన కుమారుల కుమారులు’; ఆధునిక తెలుగులో ‘మనవళ్లు’ సహజంగా అదే వంశసంబంధాన్ని తెలియజేస్తుంది.
- source_word: אִתּוֹ
  choice: తనతోపాటు
  rationale: తోడుగా ప్రయాణించడాన్ని సహజమైన తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: בְּנֹתָיו
  choice: కుమార్తెలను
  rationale: మూలంలోని స్త్రీ సంతాన సూచనను నేరుగా, కుమారుల నుండి వేరుగా వ్యక్తం చేస్తుంది.
- source_word: וּבְנוֹת בָּנָיו
  choice: మనవరాళ్లను
  rationale: మూలంలో అక్షరార్థంగా ‘తన కుమారుల కుమార్తెలు’; తెలుగులో సహజమైన బంధుత్వ పదం వాడబడింది, పితృవంశ పరిమితిని పాదసూచిక తెలియజేస్తుంది.
- source_word: וְכָל זַרְעוֹ
  choice: తన సంతానమంతటినీ
  rationale: זֶרַע యొక్క సమూహార్థమైన ‘సంతానం/వారసులు’ భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: הֵבִיא
  choice: తీసుకువచ్చాడు
  rationale: בוא ధాతువు హిఫీల్ రూపంలోని ‘వచ్చేలా చేశాడు/తీసుకువచ్చాడు’ అనే కారణార్థాన్ని వ్యక్తం చేస్తుంది.
- source_word: מִצְרָיְמָה
  choice: ఐగుప్తుకు
  rationale: దిశను సూచించే ప్రత్యయం గమ్యస్థానమైన ఐగుప్తువైపు ప్రయాణాన్ని తెలియజేస్తుంది; తెలుగులో ‘ఐగుప్తుకు’ సహజం.
