translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన బంధుత్వ పదాలు వాడబడ్డాయి. మూలంలోని జాబితా నిర్మాణం, పురుష-స్త్రీ సంతాన భేదం, సమూహార్థం నిలుపబడ్డాయి; ‘ఐగుప్తు’ అనే గౌరవప్రదమైన సంప్రదాయ భౌగోళిక నామం కొనసాగించబడింది.
