- from: లేయా పద్దన్‌-అరాములో యాకోబుకు కనిన కుమారులు వీరే; అతని కుమార్తె దీనా కూడా వీరిలో ఉంది. అతని కుమారులు, కుమార్తెల మొత్తం సంఖ్య ముప్పై మూడు.[a]
  to: లేయా పద్దన్-అరాములో యాకోబుకు కనిన కుమారులు వీరే; వారితో పాటు అతని కుమార్తె దీనా కూడా ఉంది. అతని కుమారులు, కుమార్తెల మొత్తం సంఖ్య ముప్పై మూడు.[a]
  rationale: The revision preserves the Hebrew genealogical heading and the additive mention of Dinah, while removing an unintended implication that she belongs within the group called “sons.” The footnote is recast in clear Telugu to explain נֶפֶשׁ as a person-counting idiom.
