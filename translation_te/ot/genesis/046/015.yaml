source:
  edition: WLC
  text: אֵ֣לֶּה בְּנֵ֣י לֵאָ֗ה אֲשֶׁ֨ר יָֽלְדָ֤ה לְ/יַעֲקֹב֙ בְּ/פַדַּ֣ן אֲרָ֔ם וְ/אֵ֖ת דִּינָ֣ה בִתּ֑/וֹ כָּל נֶ֧פֶשׁ בָּנָ֛י/ו וּ/בְנוֹתָ֖י/ו שְׁלֹשִׁ֥ים וְ/שָׁלֹֽשׁ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/015.yaml
  text: These are the sons of Leah[a], whom she bore to Jacob in Paddan-aram, along with Dinah his daughter[b]. The total number of his sons and his daughters was thirty-three.
translation:
  language: te
  text: లేయా పద్దన్-అరాములో యాకోబుకు కనిన కుమారులు వీరే; వారితో పాటు అతని కుమార్తె దీనా కూడా ఉంది. అతని కుమారులు, కుమార్తెల మొత్తం సంఖ్య ముప్పై మూడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “అతని కుమారులు, కుమార్తెల ప్రతి వ్యక్తి”; ఇది వ్యక్తుల మొత్తం సంఖ్యను తెలిపే వంశావళి నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי לֵאָה
  choice: లేయా ... కనిన కుమారులు
  rationale: בְּנֵי అనే పుంలింగ బహువచనాన్ని వంశావళి శీర్షికలో ఉన్నట్లుగానే ‘కుమారులు’గా నిలిపాం; దీనా తరువాత ప్రత్యేకంగా చేర్చబడింది.
- source_word: אֲשֶׁר יָלְדָה לְיַעֲקֹב
  choice: యాకోబుకు కనిన
  rationale: స్త్రీ కర్తగా ఉన్న יָלַד యొక్క ‘కనడం/ప్రసవించడం’ అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בְּפַדַּן אֲרָם
  choice: పద్దన్‌-అరాములో
  rationale: ఇది స్థలనామం కాబట్టి అర్థానువాదం చేయకుండా హీబ్రూ ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించాం.
- source_word: וְאֵת דִּינָה בִתּוֹ
  choice: అతని కుమార్తె దీనా కూడా వీరిలో ఉంది
  rationale: ‘కుమారులు’ అనే శీర్షిక తరువాత దీనాను లెక్కలో చేర్చే సంకలిత భావాన్ని సహజంగా స్పష్టం చేస్తుంది.
- source_word: כָּל נֶפֶשׁ
  choice: మొత్తం సంఖ్య
  rationale: జనగణన/వంశావళి సందర్భంలో נֶפֶשׁ అంటే అమూర్తమైన ‘ఆత్మ’ కాదు, లెక్కించబడిన వ్యక్తి; తెలుగులో ‘మొత్తం సంఖ్య’ ఆ నుడికారాన్ని సహజంగా అందిస్తుంది.
- source_word: בָּנָיו וּבְנוֹתָיו
  choice: అతని కుమారులు, కుమార్తెలు
  rationale: మూలంలో కుమారులు, కుమార్తెలు వేర్వేరుగా పేర్కొనబడినందున రెండింటినీ నిలిపాం.
- source_word: שְׁלֹשִׁים וְשָׁלֹשׁ
  choice: ముప్పై మూడు
  rationale: హీబ్రూ సంఖ్యకు నేరమైన తెలుగు రూపం.
theological_decisions:
- issue: נֶפֶשׁ యొక్క భావం
  choice: వ్యక్తుల మొత్తం సంఖ్యను సూచించే నుడికారంగా అనువదించడం
  alternative: ‘ఆత్మలు’ అని పదశః అనువదించడం
  rationale: ఈ వంశావళి లెక్కలో పదం వ్యక్తులను సూచిస్తుంది; ‘ఆత్మలు’ అనడం సందర్భానికి లేని తాత్విక భావాన్ని దిగుమతి చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వంశావళి శైలి. ‘పద్దన్‌-అరాము’ను స్థలనామంగా లిప్యంతరీకరించాం. చివరి వాక్యంలో హీబ్రూ నుడికారాన్ని అర్థస్పష్టంగా ఇచ్చి, అక్షరార్థాన్ని పాదసూచికలో నిలిపాం.
