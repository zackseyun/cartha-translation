base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/017.yaml
  text: 'The sons of Asher: Imnah[a], Ishvah, Ishvi, and Beriah; and Serah their sister[b]. And the sons of Beriah: Heber and Malchiel.'
translation:
  language: te
  text: 'ఆషేరు కుమారులు: యిమ్నా[a], యిష్వా, యిష్వీ, బెరీయా; వారి సహోదరి సెరహు[b]. బెరీయా కుమారులు: హెబెరు, మల్కీయేలు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: యిమ్నా అనే పేరును కొన్ని అనువాద సంప్రదాయాల్లో ‘ఇమ్నా’ అని కూడా లిప్యంతరీకరిస్తారు.
    reason: lexical_alternative
  - marker: b
    text: సెరహు అనే పేరును ‘సెరాఖు’ అని కూడా లిప్యంతరీకరించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי אָשֵׁר
  choice: ఆషేరు కుమారులు
  rationale: వంశావళి సందర్భంలో בְּנֵי అనే నిర్మాణ బహువచనానికి ‘కుమారులు’ సహజమైన, మూలానికి దగ్గరైన అనువాదం. ఆరంభంలోని וּ సంధిని తెలుగు జాబితా శైలిలో ప్రత్యేకంగా చూపనవసరం లేదు.
- source_word: יִמְנָה
  choice: ఇమ్నా
  rationale: హీబ్రూ వ్యక్తినామాన్ని దాని యోద్‌ను ‘యి/జి’గా బలవంతంగా పలకకుండా ఆధునిక తెలుగు లిప్యంతరీకరణలో ఇచ్చాం.
- source_word: וְיִשְׁוָה
  choice: ఇష్వా
  rationale: హీబ్రూ వ్యక్తినామానికి సమీపమైన తెలుగు లిప్యంతరీకరణ; జాబితా నిర్మాణం వల్ల సంధిని విడిగా అనువదించలేదు.
- source_word: וְיִשְׁוִי
  choice: ఇష్వీ
  rationale: హీబ్రూ వ్యక్తినామాన్ని నేరుగా తెలుగు ధ్వన్యనుసారంగా లిప్యంతరీకరించాం.
- source_word: וּבְרִיעָה
  choice: బెరీయా
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు ఉచ్చారణకు అనుకూలంగా లిప్యంతరీకరించాం; జాబితాలో చివరి అంశానికి తప్పనిసరిగా ‘మరియు’ చేర్చకుండా సహజ తెలుగు విరామచిహ్న శైలిని అనుసరించాం.
- source_word: וְשֶׂרַח אֲחֹתָם
  choice: వారి సహోదరి శెరహు
  rationale: అక్షరార్థంగా ‘వారి సహోదరి శెరహు.’ హీబ్రూలో క్రియలేని అనుబంధ నిర్మాణాన్ని అలాగే సంక్షిప్తంగా ఉంచి, తెలుగులో సహజమైన పదక్రమాన్ని వాడాం.
- source_word: וּבְנֵי בְרִיעָה
  choice: బెరీయా కుమారులు
  rationale: కొత్త ఉపవంశ జాబితాను తెలుగులో స్వతంత్ర వాక్యంగా చూపాం; ఆరంభ సంధి భావం క్రమంలోనే స్పష్టంగా ఉన్నందున ‘మరియు’ను చేర్చలేదు.
- source_word: חֶבֶר
  choice: హెబెరు
  rationale: హీబ్రూ వ్యక్తినామాన్ని ప్రాచుర్యంలో ఉన్న తెలుగు బైబిలు నామరూపానికి దగ్గరగా లిప్యంతరీకరించాం.
- source_word: וּמַלְכִּיאֵל
  choice: మల్కీయేలు
  rationale: హీబ్రూ వ్యక్తినామాన్ని దాని భాగాలు, దీర్ఘస్వరాన్ని ప్రతిబింబించేలా తెలుగులో లిప్యంతరీకరించాం.
