  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళికి తగిన సంక్షిప్తమైన గౌరవప్రద శైలిని అనుసరించాం. హీబ్రూ క్రియలేని అనుబంధాన్ని ‘వారి సహోదరి శెరహు’గా నిలిపి, అవసరం లేని వివరణను చేర్చలేదు. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉంచబడ్డాయి.
