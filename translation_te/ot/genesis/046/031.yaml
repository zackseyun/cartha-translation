  to: 'అప్పుడు యోసేపు తన సోదరులకూ, తన తండ్రి ఇంటివారికీ[a] ఇలా అన్నాడు: “నేను పైకి వెళ్లి ఫరోకు తెలియజేస్తాను. అతనితో, ‘కనాను దేశంలో ఉన్న నా సోదరులూ, నా తండ్రి ఇంటివారూ నా దగ్గరికి వచ్చారు’ అని చెబుతాను.”'
