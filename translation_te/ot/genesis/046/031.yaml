  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יוֹסֵ֤ף אֶל אֶחָי/ו֙ וְ/אֶל בֵּ֣ית אָבִ֔י/ו אֶעֱלֶ֖ה וְ/אַגִּ֣ידָה לְ/פַרְעֹ֑ה וְ/אֹֽמְרָ֣ה אֵלָ֔י/ו אַחַ֧/י וּ/בֵית אָבִ֛/י אֲשֶׁ֥ר בְּ/אֶֽרֶץ כְּנַ֖עַן בָּ֥אוּ אֵלָֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/031.yaml
  text: Then Joseph said to his brothers and to his father’s household[a], “I will go up and report to Pharaoh, and I will say to him, ‘My brothers and my father’s household, who were in the land of Canaan, have come to me.’”
translation:
  language: te
  text: 'అప్పుడు యోసేపు తన సోదరులకూ, తన తండ్రి ఇంటివారికీ[a] ఇలా అన్నాడు: “నేను పైకి వెళ్లి ఫరోకు తెలియజేస్తాను. అతనితో, ‘కనాను దేశంలో ఉన్న నా సోదరులూ, నా తండ్రి ఇంటివారూ నా దగ్గరికి వచ్చారు’ అని చెబుతాను.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “తన తండ్రి ఇల్లు.” హీబ్రూ పదబంధం అక్షరార్థంగా “తన తండ్రి ఇల్లు”; ఇక్కడ అది భవనాన్ని కాకుండా కుటుంబ సముదాయాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... అన్నాడు
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది; ఆధునిక తెలుగు కథనశైలిలో ‘అప్పుడు’ సహజంగా క్రమాన్ని తెలియజేస్తుంది.
- source_word: אֶל אֶחָיו
  choice: తన సోదరులతో
  rationale: సందర్భంలో אַח అనేది యోసేపు మగ సహోదరులను సూచిస్తుంది; ‘సోదరులు’ ఖచ్చితమైన, గౌరవప్రదమైన ఆధునిక తెలుగు పదం.
- source_word: וְאֶל בֵּית אָבִיו
  choice: తన తండ్రి ఇంటివారితో
  rationale: ఇక్కడ בַּיִת భవనాన్ని కాకుండా కుటుంబ సముదాయాన్ని సూచిస్తుంది; ‘ఇంటివారు’ ఆ సామాజిక భావాన్ని సహజంగా అందిస్తుంది.
- source_word: אֶעֱלֶה
  choice: నేను వెళ్లి
  rationale: עלה యొక్క మూలార్థం ‘పైకి వెళ్లడం’; అయితే ఫరో వద్దకు వెళ్లడాన్ని తెలుగులో ‘పైకి వెళ్తాను’ అనడం అసహజంగా లేదా భౌగోళికంగా తప్పుదారి పట్టించవచ్చు. కదలికను ‘వెళ్లి’గా సహజీకరించాం.
- source_word: וְאַגִּידָה לְפַרְעֹה
  choice: ఫరోకు తెలియజేస్తాను
  rationale: Hiphil נגד ఏదో విషయాన్ని తెలియజేయడం లేదా నివేదించడం అనే భావం కలిగిస్తుంది; రాజసభ సందర్భంలో ‘తెలియజేస్తాను’ సహజంగా ఉంది.
- source_word: וְאֹמְרָה אֵלָיו
  choice: అతనితో ... అని చెబుతాను
  rationale: యోసేపు చేయబోయే తదుపరి కార్యాన్ని మొదటి పురుషంలో స్పష్టంగా ఉంచుతూ, తెలుగు ప్రత్యక్ష ఉక్తి నిర్మాణానికి అనుగుణంగా ఇచ్చాం.
- source_word: אַחַי
  choice: నా సోదరులు
  rationale: యోసేపు తన సహోదరులనే ఉద్దేశిస్తున్నాడు; ‘సోదరులు’ సందర్భానికి ఖచ్చితంగా సరిపోతుంది.
- source_word: וּבֵית אָבִי
  choice: నా తండ్రి ఇంటివారు
  rationale: בֵּית אָבִי ఇక్కడ తండ్రికి చెందిన కుటుంబ సముదాయాన్ని సూచిస్తుంది; ‘ఇంటివారు’ భౌతిక ఇంటికన్నా ఆ భావాన్ని స్పష్టం చేస్తుంది.
- source_word: אֲשֶׁר בְּאֶרֶץ כְּנַעַן
  choice: కనాను దేశంలో ఉన్న
  rationale: హీబ్రూలో స్పష్టమైన సమాపక క్రియ లేకపోయినా, తరువాతి ‘వచ్చారు’ అనే పూర్తయిన చర్యకు ముందు వారి నివాసస్థితిని తెలుగులో ‘ఉన్న’ సహజంగా తెలియజేస్తుంది.
- source_word: בָּאוּ אֵלַי
  choice: నా దగ్గరికి వచ్చారు
  rationale: పూర్తయిన రాకను, యోసేపుతో వారి ప్రస్తుత సమీప సంబంధాన్ని సహజ తెలుగు భూతకాల రూపం సందర్భానుసారంగా వ్యక్తం చేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. ‘తండ్రి ఇంటివారు’ ద్వారా కుటుంబ సముదాయ భావం వ్యక్తమైంది. మూలంలోని ప్రత్యక్ష ఉక్తి, కార్యాల క్రమం నిలుపబడ్డాయి.
