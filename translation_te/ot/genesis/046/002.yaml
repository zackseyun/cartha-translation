source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אֱלֹהִ֤ים לְ/יִשְׂרָאֵל֙ בְּ/מַרְאֹ֣ת הַ/לַּ֔יְלָה וַ/יֹּ֖אמֶר יַעֲקֹ֣ב יַעֲקֹ֑ב וַ/יֹּ֖אמֶר הִנֵּֽ/נִי׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/002.yaml
  text: And God spoke to Israel in visions of the night and said[a], “Jacob, Jacob.” And he said[b], “Here I am.”
translation:
  language: te
  text: 'దేవుడు రాత్రి దర్శనాలలో ఇశ్రాయేలుకు ఇలా అన్నాడు: “యాకోబూ, యాకోబూ!” అతడు, “ఇదిగో, నేనున్నాను” అన్నాడు.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: మాట్లాడి / అన్నాడు
  rationale: ఒకే హీబ్రూ క్రియ వరుసగా వచ్చిన నిర్మాణాన్ని తెలుగులో సహజంగా వ్యక్తం చేయడానికి మొదటి సందర్భంలో ‘మాట్లాడి,’ ప్రత్యక్ష సంభాషణను పరిచయం చేసే సందర్భాల్లో ‘అన్నాడు’ అని అనువదించాం.
- source_word: אֱלֹהִים
  choice: దేవుడు
  rationale: ఈ సందర్భంలో ఏకవచన భావంతో ఇశ్రాయేలు దేవుణ్ణి సూచిస్తోంది.
- source_word: לְיִשְׂרָאֵל
  choice: ఇశ్రాయేలుతో
  rationale: హీబ్రూ పాఠంలో కథన భాగంలో ఉన్న ‘ఇశ్రాయేలు’ అనే పేరును, తరువాతి పిలుపులోని ‘యాకోబు’తో సమన్వయపరచకుండా యథాతథంగా నిలిపాం.
- source_word: בְּמַרְאֹת הַלַּיְלָה
  choice: రాత్రి దర్శనాల్లో
  rationale: దర్శనాల బహువచనాన్ని, అవి రాత్రివేళ కలిగాయనే భావాన్ని సంక్షిప్తమైన సహజ తెలుగులో నిలిపింది.
- source_word: יַעֲקֹב יַעֲקֹב
  choice: యాకోబూ, యాకోబూ!
  rationale: దైవిక పిలుపులోని వ్యక్తిగతమైన, గాఢమైన సంబోధనను చూపేందుకు పేరు పునరుక్తిని, తెలుగు సంబోధన రూపాన్ని నిలిపాం.
- source_word: הִנֵּנִי
  choice: ఇదిగో, నేనున్నాను
  rationale: స్పందించడానికి సిద్ధంగా ఉన్నాననే భావాన్ని కలిగించే సంప్రదాయబద్ధమైనప్పటికీ నేటికీ స్పష్టమైన తెలుగు సమానార్థకం.
theological_decisions:
- issue: ఇశ్రాయేలు, యాకోబు అనే పేర్ల మధ్య మార్పు
  choice: కథనంలో ‘ఇశ్రాయేలు,’ దేవుని పిలుపులో ‘యాకోబు’ అని నిలిపాం
  alternative: ఏకరూపత కోసం రెండు చోట్లా ఒకే పేరును వాడడం
  rationale: మూలపాఠం ఉద్దేశపూర్వకంగా కనిపించే పేరు మార్పును వివరణతో పరిష్కరించకుండా అలాగే ఉంచడం దాని సాహిత్య, వేదాంత ఉద్వేగాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా, అయినా దైవిక సంభాషణకు తగిన గౌరవప్రదమైన శైలి. ‘మాట్లాడి … అన్నాడు’ అనే నిర్మాణం మూలంలోని రెండు וַיֹּאמֶר రూపాలను సహజ తెలుగులో ప్రతిబింబిస్తుంది.
