revisions:
- from: దేవుడు రాత్రి దర్శనాల్లో ఇశ్రాయేలుతో మాట్లాడి, “యాకోబూ, యాకోబూ!” అన్నాడు. అతడు, “ఇదిగో, నేనున్నాను” అన్నాడు.
  to: 'దేవుడు రాత్రి దర్శనాలలో ఇశ్రాయేలుకు ఇలా అన్నాడు: “యాకోబూ, యాకోబూ!” అతడు, “ఇదిగో, నేనున్నాను” అన్నాడు.'
  rationale: Changed the recipient construction from “ఇశ్రాయేలుతో” to “ఇశ్రాయేలుకు” for closer fidelity to the Hebrew dative, and used “ఇలా అన్నాడు” to introduce the quoted address naturally in Telugu. The plural ‘visions,’ the name alternation, repeated vocative, and responsive ‘Here I am’ are all preserved.
