  text: Then Abraham reached out his hand and took the knife to slaughter his son[a][b].
translation:
  language: te
  text: అప్పుడు అబ్రాహాము తన చేతిని చాపి[a], తన కుమారుణ్ణి వధించడానికి కత్తిని తీసుకున్నాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘తన చేతిని చాపి.’
    reason: lexical_alternative
  - marker: b
    text: ‘వధించు’ అని అనువదించిన హీబ్రూ క్రియ సాధారణంగా ‘చంపు’ అనే మాటకంటే నిర్దిష్టమైనది; అది బలి అర్పణ కోసం చేసే వధ భావాన్ని కూడా కలిగి ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: చాపి
  rationale: ఈ సందర్భంలో క్రియ చెయ్యిని ముందుకు చాపడాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: יָדוֹ
  choice: తన చెయ్యి
  rationale: ఏకవచన నామవాచకాన్నీ దాని సర్వనామ ప్రత్యయాన్నీ నేరుగా తెలియజేస్తుంది; తెలుగులో కర్తను తిరిగి సూచించడానికి ‘తన’ సహజం.
- source_word: וַיִּקַּח
  choice: తీసుకున్నాడు
  rationale: కథన క్రమంలో సాధారణమైన ‘తీసుకొను’ సరిపోతుంది; ‘పట్టుకున్నాడు’ అని విధానాన్ని అతిగా నిర్దిష్టం చేయదు.
- source_word: הַמַּאֲכֶלֶת
  choice: కత్తిని
  rationale: వధకు ఉపయోగించే కోసే పనిముట్టును సాధారణ పాఠకునికి స్పష్టంగా తెలియజేసే సహజ సమానార్థకం.
- source_word: לִשְׁחֹט
  choice: బలిగా వధించడానికి
  rationale: שׁחט సాధారణంగా ‘చంపు’ కంటే నిర్దిష్టమైన వధక్రియను, ఈ సందర్భంలో బలి సంబంధిత ఛాయను కలిగి ఉంది. ‘బలిగా వధించు’ ఆ ప్రత్యేకతను సహజ తెలుగులో నిలుపుతుంది.
- source_word: בְּנוֹ
  choice: తన కుమారుణ్ణి
  rationale: నామవాచకాన్నీ సర్వనామ ప్రత్యయాన్నీ నేరుగా అందిస్తుంది; ‘తన’ అబ్రాహామునే సూచిస్తుంది.
- source_word: וַ
  choice: అప్పుడు
  rationale: వావ్-కన్సిక్యూటివ్ కథనంలోని తదుపరి చర్యను ముందుకు నడిపిస్తుంది; ‘అప్పుడు’ ఆ వరుసను సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: שָׁחַט అనే క్రియలోని బలి సంబంధిత ఛాయను తెలుగులో ఎలా నిలుపాలి
  choice: బలిగా వధించడానికి
  alternative: చంపడానికి; వధించడానికి
  rationale: ఈ క్రియ సాధారణ ‘చంపు’ కంటే నిర్దిష్టమైనది; బలి జంతువుల వధకు తరచుగా వాడబడుతుంది. ఆదికాండము 22 సందర్భంలో ‘బలిగా వధించడానికి’ ఆ ఆచారపరమైన, భావోద్వేగపరమైన తీవ్రతను నిలుపుతుంది; తరువాతి సిద్ధాంతార్థాలను మాత్రం చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కథన శైలి. ‘చెయ్యి’ సాధారణ పాఠకునికి సహజం; ‘వధించు’ మూలంలోని తీవ్రతను నిలుపుతుంది. రెండు పాదసూచిక గుర్తులూ ప్రధాన వచనంలో ఉంచబడ్డాయి.
