    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: మూడవ రోజున
  rationale: నిర్దిష్ట ordinalతో ఉన్న కాలసూచక పదబంధానికి సహజమైన, నేరమైన తెలుగు రూపం. ‘ప్రయాణంలో’ వంటి వివరణ మూలంలో లేదు.
- source_word: וַיִּשָּׂא ... אֶת עֵינָיו
  choice: కన్నులెత్తి
  rationale: ‘తన కన్నులను ఎత్తాడు’ అనే హీబ్రూ నుడికారాన్ని సహజమైన తెలుగు కథనశైలిలో సంక్షిప్తంగా నిలుపుతుంది.
- source_word: וַיַּרְא
  choice: చూశాడు
  rationale: ראה క్రియను వరుస కథన భూతకాలంగా అనువదిస్తుంది; తెలుగు వాక్యనిర్మాణంలో కర్తను మళ్లీ చేర్చాల్సిన అవసరం లేదు.
- source_word: הַמָּקוֹם
  choice: ఆ స్థలాన్ని
  rationale: నిర్దిష్టమైన ‘స్థలం’ సందర్భంలో ముందుగా దేవుడు సూచించిన గమ్యాన్ని సూచిస్తుంది; తెలుగులో ‘ఆ’ వాడటం సహజమైన నిర్దిష్టతను తెలియజేస్తుంది.
- source_word: מֵרָחֹק
  choice: దూరం నుండి
  rationale: దూరాన్ని సూచించే పదబంధానికి ఆధునిక ప్రామాణిక తెలుగులో స్పష్టమైన రూపం; ‘దూరం నుంచే’ అనవసరమైన ఉద్ఘాటనను జోడించవచ్చు.
- source_word: אַבְרָהָם
  choice: అబ్రాహాము
  rationale: తెలుగు బైబిలు వినియోగంలో స్థిరపడిన వ్యక్తినామ రూపం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. హీబ్రూ నుడికారాన్ని ‘కన్నులెత్తి’గా నిలుపుతూ, పాఠకులకు సులభంగా అర్థమయ్యే పదక్రమం వాడబడింది.
