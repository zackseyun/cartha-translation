- from: అప్పుడు అబ్రాహాము తన యువకుల దగ్గరికి తిరిగి వచ్చాడు[a]. వారు లేచి, కలిసి బెయేర్షెబాకు వెళ్లారు. అబ్రాహాము బెయేర్షెబాలో నివసించాడు.
