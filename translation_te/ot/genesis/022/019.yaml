  text: וַ/יָּ֤שָׁב אַבְרָהָם֙ אֶל נְעָרָ֔י/ו וַ/יָּקֻ֛מוּ וַ/יֵּלְכ֥וּ יַחְדָּ֖ו אֶל בְּאֵ֣ר שָׁ֑בַע וַ/יֵּ֥שֶׁב אַבְרָהָ֖ם בִּ/בְאֵ֥ר שָֽׁבַע־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/019.yaml
  text: So Abraham returned to his young men[a], and they arose and went together to Beersheba, and Abraham stayed in Beersheba.
translation:
  language: te
  text: అప్పుడు అబ్రాహాము తన యువకుల వద్దకు తిరిగి వచ్చాడు[a]. వారందరూ లేచి, కలిసి బెయేర్షెబాకు వెళ్లారు. అబ్రాహాము బెయేర్షెబాలో నివసించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీలో, “అబ్రాహాము తన యువకుల వద్దకు తిరిగి వచ్చాడు.” ముందటి కథనంలో ఇస్సాకు ప్రస్తావించబడినప్పటికీ, ఈ వాక్యభాగంలో అతని పేరు ప్రస్తావించబడలేదు.
    reason: మూలపాఠ్యంలో యువకుల వద్దకు తిరిగి వచ్చినవాడిగా అబ్రాహాము మాత్రమే పేర్కొనబడటం వల్ల ఏర్పడే వ్యాఖ్యానాత్మక ప్రశ్నను పరిష్కరించకుండా పాఠకునికి తెలియజేయడం.
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: తిరిగి వచ్చాడు
  rationale: שׁוב్ అనే క్రియ కథన క్రమంలో ‘తిరిగి రావడం’ అనే సాధారణ అర్థాన్ని ఇస్తుంది; ఈ సందర్భంలో ‘తిరిగి వచ్చాడు’ సహజమైన ఆధునిక తెలుగు.
- source_word: נְעָרָיו
  choice: తన యువకులు
  rationale: נַעַר అనే పదం యువకుడు, సేవకుడు లేదా పరిచారకుడు అనే అర్థాలు ఇవ్వగలదు. సందర్భంలో వీరు అబ్రాహాముతో వచ్చిన సేవకులే అయినా, ‘యువకులు’ మూలపదపు విస్తృతిని కాపాడి వారి హోదాను అనవసరంగా నిర్దిష్టం చేయదు.
- source_word: וַיָּקֻמוּ
  choice: వారు లేచి
  rationale: קום కథనంలో తదుపరి చర్యకు ఉపక్రమించడాన్ని సూచిస్తుంది; ‘లేచి’ సంక్షిప్తంగా, సహజంగా ఆ క్రమాన్ని తెలియజేస్తుంది.
- source_word: וַיֵּלְכוּ יַחְדָּו
  choice: కలిసి ... వెళ్లారు
  rationale: הלך తో יחדו కలసి, వారు సమిష్టిగా ప్రయాణించారని చెబుతుంది. ‘కలిసి వెళ్లారు’ నడిచిన విధానాన్ని అదనంగా నిర్దేశించకుండా మూలార్థాన్ని అందిస్తుంది.
- source_word: בְּאֵר שָׁבַע
  choice: బెయేర్షెబా
  rationale: స్థలనామాన్ని అనువదించకుండా, ఆధునిక తెలుగు ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించబడింది.
- source_word: וַיֵּשֶׁב
  choice: నివసించాడు
  rationale: ישׁב కు కూర్చోవడం, ఉండడం, నివసించడం అనే అర్థాలు ఉన్నాయి. ఇక్కడ స్థలంతో కూడిన సందర్భంలో ‘నివసించాడు’ కొనసాగిన నివాసాన్ని సహజంగా తెలియజేస్తుంది; కొత్తగా స్థిరపడ్డాడనే అదనపు భావాన్ని చేర్చదు.
theological_decisions:
- issue: కొండనుంచి యువకుల దగ్గరికి తిరిగి వచ్చినవాడిగా అబ్రాహాము మాత్రమే పేర్కొనబడటం; ముందటి కథనంలో ఇస్సాకు ఉన్నప్పటికీ ఈ వాక్యభాగంలో అతని పేరు లేకపోవడం
  choice: ప్రధాన పాఠ్యంలో ఇస్సాకును చేర్చకుండా, హెబ్రీ పాఠ్యం పేర్కొన్నట్లే అబ్రాహాము తిరిగి వచ్చాడని అనువదించడం
  alternative: ఇస్సాకు కూడా తిరిగి వచ్చాడని ఊహించి అతని పేరును ప్రధాన పాఠ్యంలో చేర్చడం
  rationale: హెబ్రీ పాఠ్యం యువకుల దగ్గరికి తిరిగి వచ్చినవాడిగా అబ్రాహామును మాత్రమే స్పష్టంగా పేర్కొంటుంది. ఇస్సాకు కూడా వచ్చాడేమో అనే సహజమైన ఊహను అనువాదం నిర్ధారించకూడదు; పాఠ్యంలో ఉన్న ఉద్రిక్తతను అలాగే ఉంచాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘యువకులు’ మూలపదపు అర్థవిస్తృతిని నిలుపుతుంది; ‘సేవకులు’ అని సందర్భాన్ని అతిగా నిర్దిష్టం చేయలేదు. ఇస్సాకు గైర్హాజరు గురించి ప్రధాన పాఠ్యాన్ని సమన్వయపరచకుండా పాదటిప్పణిలో మాత్రమే వివరించబడింది.
