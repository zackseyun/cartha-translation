id: GEN.22.2
reference: Genesis 22:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֡אמֶר קַח נָ֠א אֶת בִּנְ/ךָ֨ אֶת יְחִֽידְ/ךָ֤ אֲשֶׁר אָהַ֨בְתָּ֙ אֶת יִצְחָ֔ק וְ/לֶךְ לְ/ךָ֔ אֶל אֶ֖רֶץ הַ/מֹּרִיָּ֑ה וְ/הַעֲלֵ֤/הוּ שָׁם֙ לְ/עֹלָ֔ה עַ֚ל אַחַ֣ד הֶֽ/הָרִ֔ים אֲשֶׁ֖ר אֹמַ֥ר אֵלֶֽי/ךָ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/002.yaml
  text: And he said[a], “Please take your son, your only one, whom you love—Isaac—and go to the land of Moriah, and offer him there as a burnt offering on one of the mountains that I will tell you.”
translation:
  language: te
  text: 'ఆయన ఇలా అన్నాడు: “దయచేసి నీ కుమారుణ్ణి—నీ ఏకైకుడైన, నీవు ప్రేమించే ఇస్సాకును—తీసుకొని మోరియా దేశానికి వెళ్లు. అక్కడ నేను నీకు చెప్పే పర్వతాల్లో ఒకదాని మీద అతణ్ణి దహనబలిగా అర్పించు.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נָא
  choice: దయచేసి
  rationale: ఈ కణం ఆజ్ఞకు అభ్యర్థన లేదా మర్యాదతో కూడిన స్వరాన్ని జోడిస్తుంది. ఆధునిక తెలుగులో ‘దయచేసి’ దాని భావాన్ని సహజంగా తెలియజేస్తుంది; కాలార్థకమైన ‘ఇప్పుడు’ను అనవసరంగా చేర్చదు.
- source_word: בִּנְךָ
  choice: నీ కుమారుణ్ణి
  rationale: בֵּן అనే పదానికి, రెండవ పురుష ఏకవచన ప్రత్యయంతో కూడిన ప్రత్యక్షమైన తెలుగు అనువాదం.
- source_word: יְחִידְךָ
  choice: నీ ఏకైకవాణ్ణి
  rationale: יָחִיד్ ఒకే ఒక్కడైన లేదా ప్రత్యేకమైన వ్యక్తిని సూచించగలదు. ఇష్మాయేలు ఉనికిని నిరాకరించినట్టు వినిపించకుండా, ఇస్సాకుకు ఈ ఆజ్ఞలో ఉన్న అసమానమైన స్థానాన్ని ఈ రూపం నిలుపుతుంది.
- source_word: אֲשֶׁר אָהַבְתָּ
  choice: నీవు ప్రేమించే
  rationale: హీబ్రూ సంపూర్ణ క్రియ ఇక్కడ అబ్రాహాముకు ఇస్సాకుపై ఉన్న స్థిరమైన ప్రేమను తెలియజేస్తుంది; తెలుగులో వర్తమాన సంబంధవాచక రూపం సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: וְלֶךְ לְךָ
  choice: వెళ్లు
  rationale: ఈ హీబ్రూ ప్రయోగంలో వ్యక్తిగత ప్రమేయం లేదా గట్టితనం ఉండవచ్చు; అయితే తెలుగులో సరళమైన ఆజ్ఞారూపం భావాన్ని సహజంగా అందిస్తుంది, అనవసరమైన అదనపు ఉద్ఘాటనను చేర్చదు.
- source_word: אֶרֶץ הַמֹּרִיָּה
  choice: మోరియా దేశం
  rationale: אֶרֶץ దేశం లేదా ప్రాంతం అనే అర్థాలు కలిగి ఉంటుంది. ‘మోరియా దేశం’ మూలానికి దగ్గరగా ఉండే, సుపరిచితమైన రూపం.
- source_word: וְהַעֲלֵהוּ
  choice: అతణ్ణి ... అర్పించు
  rationale: עֹלָה అనే బలి పదంతో వచ్చిన עלה హిఫీల్ రూపం ఇక్కడ బలిగా అర్పించడాన్ని సూచిస్తుంది; తెలుగు వాక్యనిర్మాణానికి అనుగుణంగా కర్మను విడదీసి ఉంచాం.
- source_word: לְעֹלָה
  choice: దహనబలిగా
  rationale: עֹלָה పూర్తిగా దహనం చేసే బలికి వాడే ప్రామాణిక బలిపదం; ‘దహనబలి’ దాని అర్థాన్ని సంక్షిప్తంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: עַל אַחַד הֶהָרִים
  choice: పర్వతాల్లో ఒకదాని మీద
  rationale: הַר సాధారణంగా పర్వతాన్ని సూచిస్తుంది; ఇంకా నిర్దేశించని అనేక పర్వతాల్లో ఒకదానిని ఈ పదబంధం సూచిస్తుంది.
- source_word: אֲשֶׁר אֹמַר אֵלֶיךָ
  choice: నేను నీకు చెప్పే
  rationale: אָמַר + పరోక్ష కర్మ యొక్క అక్షరార్థం ‘నీతో చెప్పు’; తెలుగులో ‘నీకు చెప్పే’ సహజమైన సమానార్థకం. ‘చూపించే’ అని అనడం మూలంలో లేని వేరే క్రియను ప్రవేశపెడుతుంది.
theological_decisions:
- issue: ఇష్మాయేలు ఉన్నప్పటికీ ఇస్సాకును יְחִידְךָ అని పేర్కొనడం
  choice: నీ ఏకైకవాణ్ణి
  alternative: నీ ఏకైక కుమారుణ్ణి; నీకు ప్రత్యేకమైన కుమారుణ్ణి
  rationale: ఈ పదం ఇస్సాకు వాగ్దానంలోను, ఈ ఆజ్ఞలో అబ్రాహాముతో అతని సంబంధంలోను కలిగిన అసమాన స్థానాన్ని బలపరుస్తుంది. అది జీవసంబంధమైన ఏకైకత్వమా, నిబంధనాపరమైన ప్రత్యేకతా, అనురాగపరమైన విశిష్టతా అనే ఉద్వేగాన్ని అనువాదం పూర్తిగా పరిష్కరించకుండా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలిని వాడాం. మూలంలోని వరుసగా పెరుగుతున్న సంబోధనాత్మక ఉద్ఘాటనను డాష్‌లతో నిలిపాం; బలి సంబంధిత సాంకేతిక పదానికి సుపరిచితమైన ‘దహనబలి’ని ఎంచుకున్నాం.
