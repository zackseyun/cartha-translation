review_pass:
  verdict: revise
  source_fidelity: 'The draft faithfully represents the Hebrew sequence and principal terms: the entreaty נא, the escalating identification of Isaac, the land of Moriah, the sacrificial force of העלהוּ לעלה, one mountain among several, and the future disclosure in אשר אמר אליך. “దహనబలిగా” accurately conveys עולה. The translation appropriately does not soften the difficult sacrificial command.'
  naturalness: The sentence is generally clear and modern. However, “నీ ఏకైకవాణ్ణి” is not idiomatic standard Telugu in this appositional construction; “వాణ్ణి” is colloquial and the expression sounds strained. “నీ ఏకైకుడైన” is natural literary-modern Telugu and retains the noun’s ellipsis and emphatic force.
  terminology: 'Names and sacrificial terminology are suitable: “ఇస్సాకు,” “మోరియా,” and “దహనబలి” are clear and appropriately registered. The revised footnote maintains the lexical range of יְחִידְךָ without deciding whether its singularity is biological, covenantal, or relational.'
  issues:
  - severity: medium
    issue: “నీ ఏకైకవాణ్ణి” is awkward and colloquial in modern standard Telugu.
    rationale: The Hebrew יְחִידְךָ is an emphatic apposition to “your son.” Telugu “నీ ఏకైకుడైన” provides a natural appositional equivalent while leaving the referent noun understood and preserving the source’s deliberate emphasis.
