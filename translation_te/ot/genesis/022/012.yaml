id: GEN.22.12
reference: Genesis 22:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר אַל תִּשְׁלַ֤ח יָֽדְ/ךָ֙ אֶל הַ/נַּ֔עַר וְ/אַל תַּ֥עַשׂ ל֖/וֹ מְא֑וּמָּה כִּ֣י עַתָּ֣ה יָדַ֗עְתִּי כִּֽי יְרֵ֤א אֱלֹהִים֙ אַ֔תָּה וְ/לֹ֥א חָשַׂ֛כְתָּ אֶת בִּנְ/ךָ֥ אֶת יְחִידְ/ךָ֖ מִמֶּֽ/נִּי־־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/012.yaml
  text: And he said[a], “Do not lay your hand on the boy, and do not do anything to him, for now I know that you fear God, since you have not withheld your son, your only son[b], from me.”
translation:
  language: te
  text: అప్పుడు ఆయన, “ఆ బాలుని మీద నీ చేయి వేయకు; అతనికి ఏమీ చేయకు. నువ్వు నీ కుమారుణ్ణి—నీ ఏకైక కుమారుణ్ణి[a]—నా నుండి నిలిపివేయలేదు[b] కాబట్టి, నువ్వు దేవునికి భయపడేవాడివని ఇప్పుడు నాకు తెలిసింది” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీలో అక్షరార్థంగా, ‘నీ కుమారుణ్ణి, నీ ఏకైకవాణ్ణి.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘నీ కుమారుణ్ణి నాకు దాచిపెట్టలేదు.’ మూలక్రియకు ‘నిలిపివేయడం,’ ‘వెనుకకు ఉంచడం,’ లేదా ‘విడిచిపెట్టకపోవడం’ అనే భావాలు ఉన్నాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּשְׁלַח יָדְךָ אֶל
  choice: మీద నీ చెయ్యి వేయకు
  rationale: హెబ్రీ జాతీయాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తూ, బాలునికి హాని చేయవద్దనే నిషేధాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: הַנַּעַר
  choice: ఆ బాలుడు
  rationale: נַעַרకు బాలుడు, యువకుడు అనే అర్థాలు ఉండవచ్చు; ఈ కథన సందర్భంలో ‘బాలుడు’ సహజంగా సరిపోతుంది.
- source_word: תַּעַשׂ לוֹ מְאוּמָּה
  choice: అతనికి ఏమీ చేయకు
  rationale: మూలంలోని సంపూర్ణ నిషేధాన్ని సంక్షిప్తంగా, సహజంగా నిలుపుతుంది; ‘హాని’ అనే పదాన్ని మూలంలో లేనందున చేర్చలేదు.
- source_word: עַתָּה יָדַעְתִּי
  choice: ఇప్పుడు నాకు తెలిసింది
  rationale: హెబ్రీ వాక్యాన్ని నేరుగా నిలుపుతూ, దైవజ్ఞానానికి సంబంధించిన వేదాంత ఉద్వేగాన్ని వివరణతో తొలగించదు.
- source_word: יְרֵא אֱלֹהִים
  choice: దేవునికి భయపడేవాడివి
  rationale: ‘దేవునికి భయపడటం’ అనే బైబిలు భావాన్ని నేరుగా ఉంచుతుంది; ‘భక్తి’ అని వ్యాఖ్యానాత్మకంగా మార్చదు.
- source_word: חָשַׂכְתָּ ... מִמֶּנִּי
  choice: నాకు ఇవ్వకుండా అట్టిపెట్టుకోలేదు
  rationale: ‘నా నుండి నిలిపివేయలేదు’ అనే మూలభావాన్ని సాధారణ ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: בִּנְךָ אֶת יְחִידְךָ
  choice: నీ కుమారుణ్ణి—నీ ఏకైక కుమారుణ్ణి
  rationale: పునరుక్తితో కూడిన హెబ్రీ వివరణాత్మక బలాన్ని తెలుగులో నిలుపుతుంది; ‘ప్రియమైన’ అనే సందర్భోచితమైనా పదార్థంలో లేని భావాన్ని చేర్చదు.
theological_decisions:
- issue: ‘ఇప్పుడు నాకు తెలిసింది’ అనే మాటలో వ్యక్తమయ్యే దైవజ్ఞానం
  choice: ‘ఇప్పుడు నాకు తెలిసింది’ అని నేరుగా అనువదించడం
  alternative: ‘ఇప్పుడు అది వెల్లడైంది’ లేదా ‘ఇప్పుడు నేను చూశాను’
  rationale: మూలం ‘ఇప్పుడు నాకు తెలిసింది’ అని స్పష్టంగా చెబుతుంది. దైవ సర్వజ్ఞతకు అనుగుణంగా వాక్యాన్ని మృదువుగా మార్చకుండా, మూలంలోని సంబంధాత్మక లేదా మానవరూప వర్ణనను అలాగే ఉంచాం.
- issue: יְחִידְךָ యొక్క భావం
  choice: నీ ఏకైక కుమారుడు
  alternative: నీ ఏకైకవాడు; నీ ప్రియ కుమారుడు
  rationale: ఈ సందర్భంలో ఇష్మాయేలు ఉనికివల్ల కలిగే ఉద్వేగాన్ని వ్యాఖ్యానంతో పరిష్కరించకుండా, ఒడంబడిక కథనంలో ఇస్సాకు యొక్క ప్రత్యేక స్థానాన్ని సూచించే మూలపదాన్ని నేరుగా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి. ‘చెయ్యి’ సాధారణ ఆధునిక రూపం; వాక్య నిర్మాణం సులభంగా వినిపించేలా ఉంచబడింది. మూలంలోని పునరుక్తి, నిషేధం, వేదాంత ఉద్వేగం సాధ్యమైనంతవరకు నిలుపబడ్డాయి.
