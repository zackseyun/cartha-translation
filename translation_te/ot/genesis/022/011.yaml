id: GEN.22.11
reference: Genesis 22:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּקְרָ֨א אֵלָ֜י/ו מַלְאַ֤ךְ יְהוָה֙ מִן הַ/שָּׁמַ֔יִם וַ/יֹּ֖אמֶר אַבְרָהָ֣ם אַבְרָהָ֑ם וַ/יֹּ֖אמֶר הִנֵּֽנִ/י־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/011.yaml
  text: But the angel of Yahweh called to him from heaven and said[a], “Abraham, Abraham!” And he said[b], “Here I am.”
translation:
  language: te
  text: కానీ యహ్వే దూత[a] ఆకాశం నుండి[b] అతనిని ఉద్దేశించి పిలిచి, “అబ్రాహామా, అబ్రాహామా!” అన్నాడు. అతడు, “ఇదిగో, నేనున్నాను” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “యహ్వే దేవదూత.” హీబ్రూ מַלְאָךְ అనే పదానికి “దూత,” “దేవదూత” అనే రెండు అర్థాలూ ఉండవచ్చు; ఇక్కడ ఆకాశం నుండి మాట్లాడుతున్న సందర్భం “దేవదూత” భావానికి అనుకూలంగా ఉంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా “ఆకాశాల నుండి”; తెలుగులో సహజమైన ప్రయోగంగా “ఆకాశం నుండి” అని అనువదించాం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: పిలిచి
  rationale: ఈ కథన సందర్భంలో קרא ఒక వ్యక్తిని ఉద్దేశించి స్వరంతో పిలవడాన్ని సూచిస్తుంది; ‘పిలిచి’ సహజమైన తెలుగు కథన ప్రయోగం.
- source_word: אֵלָיו
  choice: అతన్ని
  rationale: ఎబ్రాహామును ఉద్దేశించి పిలిచాడనే దిశార్థాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: מַלְאַךְ יְהוָה
  choice: యహ్వే దూత
  rationale: מַלְאָךְ అంటే ‘దూత’ లేదా ‘దేవదూత’; పరలోక సంబంధ సందర్భంలో దేవదూత భావం స్పష్టమైనా, ‘దూత’ మూలపదంలోని విస్తృత అర్థాన్ని నిలుపుతుంది. יְהוָהను వ్యక్తిగత దైవనామంగా ‘యహ్వే’ అని లిప్యంతరీకరించాం.
- source_word: מִן הַשָּׁמַיִם
  choice: ఆకాశం నుండి
  rationale: שָׁמַיִם రూపరీత్యా బహువచనమైనా, ఈ సందర్భంలో దేవుని లోకాన్ని సూచించే సహజ తెలుగు ఏకవచన ప్రయోగం ‘ఆకాశం నుండి’.
- source_word: וַיֹּאמֶר
  choice: అన్నాడు
  rationale: אָמַר సాధారణ మాటల క్రియ; తెలుగు కథన సంభాషణలో ‘అన్నాడు’ నేరుగా, సహజంగా ఉంటుంది.
- source_word: אַבְרָהָם אַבְרָהָם
  choice: అబ్రాహామా, అబ్రాహామా!
  rationale: పేరు పునరుక్తి అత్యవసరతను, వ్యక్తిగత సంబోధనను తెలియజేస్తుంది; సంబోధనార్థక ‘-ఆ’ తెలుగు వ్యాకరణానికి సహజం.
- source_word: הִנֵּנִי
  choice: ఇదిగో, నేనున్నాను
  rationale: הִנֵּנִי ఉనికితో పాటు స్పందించడానికి సిద్ధంగా ఉన్న భావాన్ని తెలిపే సంప్రదాయ ప్రత్యుత్తరం; ఈ తెలుగు రూపం ఆ రెండు భావాలను నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామాన్ని ఎలా అనువదించాలి
  choice: యహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో చతురక్షర దైవనామం నేరుగా ఉంది. దానిని బిరుదుతో భర్తీ చేయకుండా వ్యక్తిగత నామంగా లిప్యంతరీకరించడం మూలపాఠానికి దగ్గరగా ఉంటుంది.
- issue: מַלְאַךְ יְהוָהను యహ్వే స్వయంగా ప్రత్యక్షమైన రూపమని వ్యాఖ్యానించాలా
  choice: యహ్వే దూత
  alternative: యహ్వే ప్రత్యక్షరూపం; యహ్వే దేవదూత
  rationale: మూలపాఠం ‘దూత’ అనే పదాన్నే వాడుతుంది; ఆ దూత యొక్క అంతిమ స్వరూపాన్ని ఈ వాక్యంలోనే సిద్ధాంతపరంగా నిర్ణయించకుండా పదబంధాన్ని సూటిగా నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రద కథన శైలి. హీబ్రూ వాక్యక్రమాన్ని యాంత్రికంగా అనుసరించకుండా ‘పిలిచి … అన్నాడు’ అని సహజీకరించాం; పేరు పునరుక్తి, సంభాషణలోని అత్యవసరత, హిన్నేని ప్రత్యుత్తరంలోని సిద్ధత భావం నిలుపబడ్డాయి.
