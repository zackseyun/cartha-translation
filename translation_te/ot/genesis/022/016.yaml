source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר בִּ֥/י נִשְׁבַּ֖עְתִּי נְאֻם יְהוָ֑ה כִּ֗י יַ֚עַן אֲשֶׁ֤ר עָשִׂ֨יתָ֙ אֶת הַ/דָּבָ֣ר הַ/זֶּ֔ה וְ/לֹ֥א חָשַׂ֖כְתָּ אֶת בִּנְ/ךָ֥ אֶת יְחִידֶֽ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/016.yaml
  text: and said[a], “By myself I have sworn, declares Yahweh, because you have done this thing and have not withheld your son[b], your only son,”
translation:
  language: te
  text: 'ఆయన ఇలా అన్నాడు: “నా మీద నేనే ప్రమాణం చేశాను—యెహోవా ప్రకటన—ఎందుకంటే నువ్వు ఈ పని చేసి, నీ కుమారుణ్ణి, నీ ఏకైక కుమారుణ్ణి[a] ఇవ్వకుండా ఉంచలేదు[b] కాబట్టి,”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నీ ప్రత్యేకమైన కుమారుణ్ణి.” హీబ్రూ విశేషణం ‘ఏకైక’ లేదా ‘ప్రత్యేకమైన’ అనే భావాలను కలిగి ఉంటుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా “కాపాడలేదు.” హీబ్రూ క్రియకు ‘ఇవ్వకుండా ఉంచు,’ ‘వెనక్కి ఉంచు,’ లేదా ఈ సందర్భంలో ‘కాపాడు’ అనే అర్థాలు రావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: ఆయన ఇలా అన్నాడు
  rationale: వావ్-క్రమ క్రియ కథనాన్ని కొనసాగిస్తుంది. సందర్భంలో కర్త స్పష్టంగా ఉన్నందున ఆధునిక తెలుగులో సహజంగా ‘ఆయన’ అని వ్యక్తపరచబడింది.
- source_word: בִּי נִשְׁבַּעְתִּי
  choice: నా మీద నేనే ప్రమాణం చేశాను
  rationale: ఇది వక్త తన స్వనామంపైనే ఒట్టు పెట్టుకునే ప్రమాణ సూత్రం. సంపూర్ణ క్రియ యొక్క పూర్తయిన చర్యను, దాని ప్రస్తుత బలాన్ని ఈ రూపం నిలుపుతుంది.
- source_word: נְאֻם יְהוָה
  choice: ఇది యెహోవా ప్రకటన
  rationale: నְאֻם అనే గంభీరమైన దైవ ప్రకటన సూత్రాన్ని సహజమైన, గౌరవప్రదమైన తెలుగులో వ్యక్తం చేస్తుంది; యెహోవా అనే వ్యక్తిగత దైవనామాన్ని అలాగే ఉంచుతుంది.
- source_word: כִּי יַעַן אֲשֶׁר
  choice: కాబట్టి
  rationale: ఈ సంయుక్త పదబంధంలోని బలమైన కారణార్థాన్ని తెలుగు వాక్యాంత కారణ నిర్మాణం సహజంగా తెలియజేస్తుంది.
- source_word: עָשִׂיתָ אֶת־הַדָּבָר הַזֶּה
  choice: నువ్వు ఈ పని చేసి
  rationale: דָּבָר ఇక్కడ అబ్రాహాము చేసిన కార్యాన్ని సూచిస్తుంది; ‘ఈ పని’ స్పష్టమైన, సహజమైన సమానార్థకం.
- source_word: וְלֹא חָשַׂכְתָּ
  choice: వెనక్కి ఉంచుకోలేదు
  rationale: חָשַׂךְ యొక్క ‘withhold/hold back’ భావాన్ని నిలుపుతుంది; ‘కాపాడలేదు’ అనే మరింత వ్యాఖ్యానాత్మక భావాన్ని ప్రధాన పాఠ్యంలో బలవంతంగా చేర్చదు.
- source_word: בִּנְךָ אֶת־יְחִידְךָ
  choice: నీ కుమారుణ్ణి, నీ ఏకైక కుమారుణ్ణి
  rationale: రెండవ పదబంధం మొదటిదాన్ని విశేషించి బలపరుస్తుంది. యָחִיד యొక్క ‘ఏకైక/విశిష్టమైన’ భావంలో సందర్భానుకూలమైన ‘ఏకైక’ను ఎంచుకుని, తెలుగులో స్పష్టత కోసం ‘కుమారుణ్ణి’ పునరుక్తి చేయబడింది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠ్యంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దానిని బిరుదుతో భర్తీ చేయకుండా తెలుగులో స్థిరంగా పరిచితమైన లిప్యంతరీకరణతో ఉంచడం మూలంలోని భేదాన్ని కాపాడుతుంది.
- issue: יְחִידְךָ యొక్క భావం
  choice: నీ ఏకైక కుమారుణ్ణి
  alternative: నీ విశిష్ట కుమారుణ్ణి
  rationale: ఇక్కడ ఇస్సాకు అబ్రాహాముకు ప్రత్యేకమైన, ఏకైక కుమారుడని పదం నొక్కి చెబుతుంది. తరువాతి క్రైస్తవ ధార్మిక ప్రతిధ్వనులను పెంచకుండా మూలంలోని కుటుంబ సంబంధాన్ని మాత్రమే స్పష్టంగా వ్యక్తం చేస్తుంది.
- issue: חָשַׂךְలోని భావ ఛాయ
  choice: వెనక్కి ఉంచుకోలేదు
  alternative: కాపాడుకోలేదు
  rationale: ప్రధాన పాఠ్యం ‘వెనక్కి ఉంచడం/నిలిపివేయడం’ అనే ప్రాథమిక భావాన్ని ఉంచుతుంది; ‘spare’ అనే సాధ్యమైన సందర్భార్థాన్ని పాదటిప్పణిలో చూపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన దైవ ప్రమాణ శైలిని, సాధారణ పాఠకులకు అర్థమయ్యే వాక్య నిర్మాణంతో కలిపింది. సంభాషణలో గౌరవబహువచనం కాకుండా మూలంలోని ఏకవచన ప్రత్యక్ష సంబోధనకు సరిపడే ‘నువ్వు’ వాడబడింది.
