  text: וַ/יִּקְרָ֧א אַבְרָהָ֛ם שֵֽׁם הַ/מָּק֥וֹם הַ/ה֖וּא יְהוָ֣ה יִרְאֶ֑ה אֲשֶׁר֙ יֵאָמֵ֣ר הַ/יּ֔וֹם בְּ/הַ֥ר יְהוָ֖ה יֵרָאֶֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/014.yaml
  text: And Abraham called the name of that place, “The LORD will provide,” as it is said to this day, “On the mountain of the LORD it will be provided.”
translation:
  language: te
  text: అబ్రాహాము ఆ స్థలానికి “యెహోవా సమకూరుస్తాడు” అని పేరు పెట్టాడు. నేటికీ, “యెహోవా పర్వతంపై సమకూర్చబడుతుంది” అని అంటారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో “యెహోవా చూస్తాడు” అని అక్షరార్థం. చివరి మాటను “యెహోవా పర్వతంపై కనిపిస్తుంది” లేదా “చూడబడుతుంది” అని కూడా అనువదించవచ్చు; అక్కడ కర్తను హీబ్రూ పాఠం స్పష్టంగా చెప్పదు. ఈ సందర్భంలో ‘చూడడం’ అవసరాన్ని గమనించి సమకూర్చడాన్ని సూచించే భావాన్ని కూడా కలిగిస్తుంది.
    reason: יִרְאֶה / יֵרָאֶה పదక్రీడను, చివరి నిఫ్అల్ క్రియలోని కర్త-సంబంధిత అస్పష్టతను, మరియు సందర్భానుసారమైన ‘సమకూర్చు’ భావాన్ని సంరక్షించడానికి.
lexical_decisions:
- source_word: יְהוָה יִרְאֶה
  choice: యెహోవా సమకూరుస్తాడు
  rationale: יִרְאֶה అనే రూపానికి అక్షరార్థంగా ‘చూస్తాడు’ అని అర్థం; అయితే ఆదికాండం 22 సందర్భంలో చూడడం ద్వారా అవసరాన్ని గమనించి సమకూర్చడం అనే భావం ఉంది. సహజమైన తెలుగులో సందర్భార్థాన్ని వ్యక్తం చేయడానికి ‘సమకూరుస్తాడు’ ఎంచుకున్నాం; మూల పదప్రయోగాన్ని పాదటిప్పణిలో నిలిపాం.
- source_word: בְּהַר יְהוָה
  choice: యెహోవా పర్వతం మీద
  rationale: בְּ ఉపసర్గకు ఇక్కడ స్థలార్థాన్ని సహజంగా తెలుపుతూ ‘మీద’ అని అనువదించాం.
- source_word: יֵרָאֶה
  choice: సమకూర్చబడుతుంది
  rationale: ఈ నిఫ్అల్ రూపం ‘కనిపిస్తుంది/చూడబడుతుంది’ అనే అర్థాన్ని కలిగి ఉండవచ్చు; ముందున్న יִרְאֶהతోని పదక్రీడను, కథా సందర్భంలోని సమకూర్పు భావాన్ని దృష్టిలో ఉంచి కర్మణి రూపంలో ‘సమకూర్చబడుతుంది’ అని ఇచ్చాం. ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో తెలిపాం.
theological_decisions:
- issue: దైవనామం יהוה అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: హీబ్రూ పాఠంలో ఉన్న వ్యక్తిగత దైవనామాన్ని బిరుదుగా మార్చకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే రూపమైన ‘యెహోవా’తో ప్రతిబింబించాం.
- issue: ראה మూలపదంలోని ‘చూడడం’ మరియు ‘సమకూర్చడం’ మధ్య ఉద్దేశపూర్వక ద్వంద్వార్థం
  choice: ప్రధాన పాఠంలో ‘సమకూర్చు’; పాదటిప్పణిలో ‘చూడు/కనిపించు’ అర్థాలు
  alternative: ప్రధాన పాఠంలో ‘చూస్తాడు … కనిపిస్తుంది’
  rationale: కథా సందర్భంలో దేవుడు బలికి పొట్టేలును సమకూర్చడం ప్రధాన భావం. అయినా హీబ్రూ పదక్రీడను, నిజమైన భాషాత్మక అస్పష్టతను తొలగించకుండా పాదటిప్పణిలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడాం. ‘ఆ స్థలానికి … పేరు పెట్టాడు’ అనేది సహజ తెలుగు; ప్రత్యక్ష ఉక్తులను స్పష్టంగా ఉంచాం. ప్రధాన పాఠం సులభంగా చదవదగినదిగా ఉండగా, హీబ్రూ పదక్రీడ మరియు అస్పష్టత పాదటిప్పణిలో నిలిచాయి.
