  yaml_path: translation/ot/genesis/022/024.yaml
  text: And his concubine[a], whose name was Reumah, also bore Tebah, Gaham, Tahash[b], and Maacah.
translation:
  language: te
  text: అతని ఉపపత్ని పేరు రెయూమా; ఆమె కూడా తెబహు, గహము, తహషు, మయకాలను కనింది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּפִילַגְשׁוֹ
  choice: అతని ఉపపత్ని
  rationale: పִּילֶגֶשׁ ప్రధాన భార్యతో భిన్నమైన సామాజిక స్థితిగల స్త్రీని సూచిస్తుంది. ఆ భేదాన్ని సంక్షిప్తంగా నిలుపుకోవడానికి ‘ఉపపత్ని’ ఎంచుకున్నాం.
- source_word: וּשְׁמָהּ רְאוּמָה
  choice: పేరు రయూమా
  rationale: హీబ్రూలో ఇది సమన్వయ వాక్యనిర్మాణంలో ‘ఆమె పేరు రయూమా’ అని ఉంది; తెలుగులో సహజంగా ముందున్న ‘ఉపపత్ని’తో కలిపి చెప్పాం.
- source_word: וַתֵּלֶד
  choice: కనింది
  rationale: ילד ఇక్కడ పిల్లలను కనడం అనే అర్థంలో ఉంది; వంశావళి సందర్భంలో ‘కనింది’ సహజమైన, సంక్షిప్తమైన తెలుగు రూపం.
- source_word: גַּם הִוא
  choice: ఆమె కూడా
  rationale: గַּם‌తో పాటు స్పష్టమైన הִוא సర్వనామం ఉన్నందున, మిల్కాతో పోల్చే నొక్కును నిలుపుతూ ‘ఆమె కూడా’ అని అనువదించాం.
- source_word: טֶבַח וְגַּחַם וְתַּחַשׁ וְמַעֲכָה
  choice: తెబహు, గహము, తహషు, మయకా
  rationale: వ్యక్తుల పేర్లను మూల హీబ్రూ ఉచ్చారణకు దగ్గరగా తెలుగు లిపిలో లిప్యంతరీకరించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళి శైలికి తగిన సంక్షిప్తతతో అనువదించబడింది. హీబ్రూ గַּם הִואలోని స్పష్టమైన సర్వనామ నొక్కును ‘ఆమె కూడా’ ద్వారా నిలిపాం.
