  text: וַ/יַּשְׁכֵּ֨ם אַבְרָהָ֜ם בַּ/בֹּ֗קֶר וַֽ/יַּחֲבֹשׁ֙ אֶת חֲמֹר֔/וֹ וַ/יִּקַּ֞ח אֶת שְׁנֵ֤י נְעָרָי/ו֙ אִתּ֔/וֹ וְ/אֵ֖ת יִצְחָ֣ק בְּנ֑/וֹ וַ/יְבַקַּע֙ עֲצֵ֣י עֹלָ֔ה וַ/יָּ֣קָם וַ/יֵּ֔לֶךְ אֶל הַ/מָּק֖וֹם אֲשֶׁר אָֽמַר ל֥/וֹ הָ/אֱלֹהִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/003.yaml
  text: Abraham rose early in the morning[a], saddled his donkey, took two of his young men with him and Isaac his son, split the wood for a burnt offering, and arose and went to the place that God had told him.
translation:
  language: te
  text: అబ్రాహాము తెల్లవారగానే లేచి, తన గాడిదకు జీను కట్టి, తనతో పాటు తన యువకులలో ఇద్దరినీ[a], తన కుమారుడైన ఇస్సాకునూ తీసుకున్నాడు. దహనబలి కోసం కట్టెలు చీల్చి, దేవుడు తనకు చెప్పిన స్థలానికి బయలుదేరి వెళ్లాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “తన సేవకులలో ఇద్దరిని,” లేదా “తన పరిచారకులలో ఇద్దరిని”; హీబ్రూ పదం נְעָרִים సందర్భాన్ని బట్టి యువకులను లేదా పురుష సేవకులను/పరిచారకులను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכֵּם אַבְרָהָם בַּבֹּקֶר
  choice: అబ్రాహాము తెల్లవారగానే లేచి
  rationale: השׁכים అనే క్రియలో ఉదయాన్నే లేవడం అనే భావం ఉంది; బַּבֹּקֶרతో కలిపి తెలుగులో సహజంగా, పునరుక్తి లేకుండా ఈ విధంగా వ్యక్తమవుతుంది.
- source_word: וַיַּחֲבֹשׁ אֶת־חֲמֹרוֹ
  choice: తన గాడిదకు జీను కట్టి
  rationale: ఈ ప్రయాణ సందర్భంలో חבש అనేది గాడిదను ప్రయాణానికి సిద్ధం చేయడం, ముఖ్యంగా జీను లేదా సామగ్రి కట్టడం అని సూచిస్తుంది.
- source_word: שְׁנֵי נְעָרָיו
  choice: తన యువకుల్లో ఇద్దరిని
  rationale: נַעַרకు యువకుడు, సేవకుడు, పరిచారకుడు అనే అర్థాలు ఉండవచ్చు. ప్రధాన పాఠం వయస్సుకు సంబంధించిన విస్తృత అర్థాన్ని నిలుపుతుంది; సందర్భానుసార ప్రత్యామ్నాయాలు పాదసూచికలో ఇవ్వబడ్డాయి.
- source_word: יִצְחָק בְּנוֹ
  choice: తన కుమారుడైన ఇస్సాకును
  rationale: హీబ్రూ అపోసిషన్‌ను సహజమైన తెలుగులో వ్యక్తపరుస్తూ కుమార సంబంధాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: וַיְבַקַּע עֲצֵי עֹלָה
  choice: దహనబలి కోసం కట్టెలు చీల్చి
  rationale: בקע అంటే చీల్చడం; עֹלָה అనేది అగ్నిలో పూర్తిగా అర్పించే బలి వర్గాన్ని సూచించే స్థిరమైన బలిపదం.
- source_word: וַיָּקָם וַיֵּלֶךְ
  choice: బయలుదేరి వెళ్లాడు
  rationale: అక్షరార్థంగా రెండు వరుస క్రియలు ఉన్నప్పటికీ, ముందే లేచినట్లు చెప్పిన తెలుగులో మళ్లీ 'లేచి' అనడం అసహజం. 'బయలుదేరి వెళ్లాడు' ప్రయాణాన్ని ప్రారంభించి వెళ్లిన రెండు దశల భావాన్ని సహజంగా ఇస్తుంది.
- source_word: אֶל־הַמָּקוֹם אֲשֶׁר אָמַר־לוֹ הָאֱלֹהִים
  choice: దేవుడు తనకు చెప్పిన స్థలానికి
  rationale: ముందుగా దేవుడు సూచించిన స్థలాన్ని తెలుగులో సహజమైన సంబంధ వాక్య నిర్మాణంతో తెలియజేస్తుంది.
theological_decisions:
- issue: עֹלָה అనే బలిపదం అనువాదం
  choice: దహనబలి
  alternative: సర్వాంగ దహనబలి
  rationale: ‘దహనబలి’ తెలుగులో స్థిరమైన, స్పష్టమైన బైబిలు బలిపదం. ‘సర్వాంగ’ అని విస్తరించడం మూలపదంలోని ఆచార భావాన్ని వివరించినా, ఈ వచనంలో అవసరానికి మించిన వివరణ అవుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. హీబ్రూ కథన క్రమాన్ని నిలుపుతూ, తెలుగులో అసహజమైన క్రియా పునరుక్తిని నివారించేందుకు optimal equivalence అనుసరించబడింది.
