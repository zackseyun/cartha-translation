id: GEN.22.17
reference: Genesis 22:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּֽי בָרֵ֣ךְ אֲבָרֶכְ/ךָ֗ וְ/הַרְבָּ֨ה אַרְבֶּ֤ה אֶֽת זַרְעֲ/ךָ֙ כְּ/כוֹכְבֵ֣י הַ/שָּׁמַ֔יִם וְ/כַ/ח֕וֹל אֲשֶׁ֖ר עַל שְׂפַ֣ת הַ/יָּ֑ם וְ/יִרַ֣שׁ זַרְעֲ/ךָ֔ אֵ֖ת שַׁ֥עַר אֹיְבָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/017.yaml
  text: that I will surely bless you[a], and I will surely multiply your offspring like the stars of the heavens and like the sand that is on the seashore[c][b]; and your offspring will possess the gate of his enemies.
translation:
  language: te
  text: నేను నిన్ను తప్పక ఆశీర్వదిస్తాను; నీ సంతానాన్ని[a] ఆకాశ నక్షత్రాలవలె, సముద్రతీరాన ఉన్న ఇసుకవలె తప్పక విస్తరింపజేస్తాను. నీ సంతానం తన[b] శత్రువుల ద్వారాన్ని[c] స్వాధీనం చేసుకుంటుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘సంతానం’కు మూల హెబ్రీలో ‘విత్తనం’ అనే ప్రాథమిక అర్థమున్న సమూహ ఏకవచన పదం ఉంది; అది ఒక సంతతినీ లేదా వారసుల సమూహాన్నీ సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, భావబహువచనంగా, ‘నీ సంతతివారు తమ శత్రువుల ద్వారాన్ని స్వాధీనం చేసుకుంటారు’ అని అనువదించవచ్చు. హెబ్రీలో ‘సంతానం’ మరియు దానిని సూచించే ప్రత్యయం వ్యాకరణపరంగా ఏకవచనంలో ఉన్నాయి.
    reason: alternative_reading
  - marker: c
    text: ‘ద్వారం’ అనేది శత్రువుల పట్టణ ద్వారం లేదా వారి అధికారంపై నియంత్రణను సూచించే నుడికారం కావచ్చు.
    reason: idiom_explanation
lexical_decisions:
- source_word: כִּי
  choice: ప్రత్యేక పదంగా అనువదించకుండా, ‘తప్పక’ అనే నిశ్చయార్థంలో భావాన్ని వ్యక్తపరచడం
  rationale: ముందటి వచనంలో ప్రారంభమైన ప్రమాణ ప్రకటనకు ఇది కొనసాగింపు. ఇక్కడి నిశ్చయ భావం తరువాతి రెండు బలవచన నిర్మాణాల్లో సహజంగా వ్యక్తమవుతుంది.
- source_word: בָרֵךְ אֲבָרֶכְךָ
  choice: నిన్ను తప్పక ఆశీర్వదిస్తాను
  rationale: క్రియానామం–సమాపక క్రియ పునరుక్తి చర్యను బలపరుస్తుంది; ‘తప్పక’ ఆ ఉద్ఘాటనను సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: וְהַרְבָּה אַרְבֶּה
  choice: తప్పక విస్తరింపజేస్తాను
  rationale: ఇక్కడ కూడా హెబ్రీ పునరుక్తి బలాన్ని సూచిస్తుంది. సంతానం సంఖ్యాపరంగా అత్యధికంగా పెరగడాన్ని ‘విస్తరింపజేస్తాను’ సహజంగా తెలియజేస్తుంది.
- source_word: זַרְעֲךָ
  choice: నీ సంతానం
  rationale: זֶרַע రూపానికి ఏకవచన సమూహార్థం ఉంది. ‘సంతానం’ వ్యక్తినీ సంతతి సమూహాన్నీ సూచించగలదు; అందువల్ల మూలంలోని ఉద్దేశపూర్వక అనిశ్చితిని కాపాడుతుంది.
- source_word: כְּכוֹכְבֵי הַשָּׁמַיִם
  choice: ఆకాశ నక్షత్రాలవలె
  rationale: తెలుగులో సహజంగా ఉండే విధంగా పోలికను నిలుపుతూ, విస్తార సంఖ్య అనే ప్రతిమను కాపాడుతుంది.
- source_word: וְכַחוֹל אֲשֶׁר עַל שְׂפַת הַיָּם
  choice: సముద్రతీరాన ఉన్న ఇసుకవలె
  rationale: אֲשֶׁר עַל అనే సంబంధ వాక్యాన్ని ‘ఉన్న’తో ప్రతిబింబిస్తూ, שְׂפַת הַיָּם అనే ‘సముద్రపు అంచు/తీరం’ నుడికారాన్ని సహజ తెలుగులో అందిస్తుంది.
- source_word: וְיִרַשׁ
  choice: స్వాధీనం చేసుకుంటుంది
  rationale: יָרַשׁ ఇక్కడ కేవలం వారసత్వంగా పొందడం కంటే శత్రువుల అధికార కేంద్రంపై ఆధిపత్యం పొందడాన్ని సూచిస్తుంది.
- source_word: שַׁעַר
  choice: ద్వారం
  rationale: మూలంలోని ప్రత్యక్ష ప్రతిమను నిలుపుతుంది; సందర్భంలో అది శత్రు పట్టణం లేదా అధికారంపై నియంత్రణకు నుడికారంగా పనిచేయవచ్చు.
- source_word: אֹיְבָיו
  choice: తన శత్రువుల
  rationale: హెబ్రీ ప్రత్యయం వ్యాకరణపరంగా ఏకవచనం; ‘తన’ అనే రూపం ‘సంతానం’తో సరిపడి ఆ సమూహ-ఏకవచన ఉద్రిక్తతను నిలుపుతుంది.
theological_decisions:
- issue: זֶרַע అనే సమూహ ఏకవచనం మరియు אֹיְבָיו లోని ఏకవచన ప్రత్యయం
  choice: ‘నీ సంతానం తన శత్రువుల…’ అని సమూహ ఏకవచనంగా అనువదించడం
  alternative: ‘నీ సంతతివారు తమ శత్రువుల…’ అని స్పష్టమైన బహువచనంగా అనువదించడం
  rationale: మూలం సంతతిని సమూహంగా సూచిస్తూనే వ్యాకరణ ఏకవచనాన్ని కొనసాగిస్తుంది. తెలుగు ‘సంతానం… తన’ ఈ ఉద్రిక్తతను కాపాడి, దాన్ని కేవలం ఒక వ్యక్తికో లేదా కేవలం అనేక వారికో పరిమితం చేయదు.
- issue: ‘శత్రువుల ద్వారం’ అనే ప్రతిమ
  choice: ప్రతిమను ప్రధాన పాఠ్యంలో యథాతథంగా ఉంచడం
  alternative: ‘శత్రువుల పట్టణాలను/అధికారాన్ని స్వాధీనం చేసుకుంటుంది’ అని భావానువాదం చేయడం
  rationale: ‘ద్వారం’ పట్టణ నియంత్రణను సూచించవచ్చు; అయినా ప్రధాన పాఠ్యంలో మూల ప్రతిమను నిలిపి, దాని సాధ్యమైన నుడికారార్థాన్ని పాదసూచికలో తెలియజేయడం వ్యాఖ్యానాన్ని బలవంతంగా రుద్దకుండా ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనా సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. హెబ్రీ బలవచన పునరుక్తులను కృత్రిమ పదపునరుక్తిగా కాక ‘తప్పక’తో వ్యక్తపరిచాం. ‘సంతానం… తన’ ద్వారా మూలంలోని సమూహ ఏకవచనాన్ని ఉద్దేశపూర్వకంగా నిలిపాం.
