    rationale: ‘నీ సంతతివారు తమ శత్రువుల…’ అని మాత్రమే ఉండడం వల్ల ప్రత్యామ్నాయ అనువాదం ఏమిటో పాఠకునికి పూర్తిగా తెలియదు. హెబ్రీలోని ఏకవచన–బహువచన వ్యత్యాసాన్ని వివరిస్తూనే, పూర్తి ప్రత్యామ్నాయ వాక్యాన్ని ఇవ్వాలి.
