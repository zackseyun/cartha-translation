- from: నేను నిన్ను తప్పక ఆశీర్వదిస్తాను; నీ సంతానాన్ని[a] ఆకాశ నక్షత్రాలవలె, సముద్రతీరాన ఉన్న ఇసుకవలె తప్పక విస్తరింపజేస్తాను. నీ సంతానం తన[b] శత్రువుల ద్వారాన్ని[c] స్వాధీనం చేసుకుంటుంది.
  to: నేను నిన్ను తప్పక ఆశీర్వదిస్తాను; నీ సంతానాన్ని[a] ఆకాశ నక్షత్రాలవలె, సముద్రతీరాన ఉన్న ఇసుకవలె తప్పక విస్తరింపజేస్తాను. నీ సంతానం తన[b] శత్రువుల ద్వారాన్ని[c] స్వాధీనం చేసుకుంటుంది.
  rationale: ప్రధాన అనువాదం మూలానికి నమ్మకంగా, సహజంగా ఉన్నందున దానిలో మార్పు అవసరం లేదు. పాదసూచిక bలోని నిర్మాణపరంగా అసంపూర్ణమైన ప్రత్యామ్నాయ వాక్యాన్ని పూర్తి చేశాము; పాదసూచిక cలో పదప్రయోగాన్ని సహజీకరించాము. ఈ మార్పులు వచనం యొక్క అర్థాన్ని లేదా మూలంలోని ఉద్దేశపూర్వక సమూహ-ఏకవచన అనిశ్చితిని మార్చవు.
