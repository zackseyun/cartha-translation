    reason: హీబ్రూ వంశావళి సూత్రరూపంలోని ‘ఈ ఎనిమిది మంది’ అనే కర్తస్వరూప నిర్మాణాన్ని చూపే అక్షరార్థ ప్రత్యామ్నాయం.
lexical_decisions:
- source_word: וּבְתוּאֵל
  choice: బెతూయేలు
  rationale: ముందున్న వంశావళి జాబితాకు కొనసాగింపుగా ఉన్న ו ను తెలుగులో ప్రత్యేకంగా అనువదించకపోవడం సహజం; పేరును సాధారణ తెలుగు బైబిలు రూపానికి దగ్గరగా లిప్యంతరీకరించాం.
- source_word: יָלַד
  choice: రిబ్కాకు తండ్రి అయ్యాడు
  rationale: పురుష కర్తతో ఉన్న ילד క్రియను ఆధునిక, స్పష్టమైన తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; పాతకాలపు ‘కనెను’ అనే రూపాన్ని నివారిస్తుంది.
- source_word: אֶת רִבְקָה
  choice: రిబ్కాకు
  rationale: אֶת ప్రత్యేకంగా అనువదించబడదు; ‘తండ్రి అయ్యాడు’ అనే తెలుగు నిర్మాణానికి అనుగుణంగా పేరుకు చతుర్థీ విభక్తి వాడాం.
- source_word: שְׁמֹנָה אֵלֶּה
  choice: ఈ ఎనిమిది మంది
  rationale: హీబ్రూ నొక్కిచెప్పే క్రమాన్ని సాధ్యమైనంతగా నిలుపుతూ, వ్యక్తులను సూచిస్తున్నందున ‘మంది’ని సహజ తెలుగు కోసం చేర్చాం.
- source_word: יָלְדָה
  choice: కన్నవారు
  rationale: స్త్రీ కర్తయైన మిల్కా ప్రసవించిన సంతానాన్ని సంక్షిప్తంగా, సహజంగా సూచిస్తుంది; గౌరవార్థక బహువచనం కాకుండా ‘వారు’ ఇక్కడ ముందున్న ఎనిమిది మందిని సూచించే సంబంధ రూపంలో ఉంది.
- source_word: מִלְכָּה
  choice: మిల్కా
  rationale: హీబ్రూ పేరుకు సన్నిహితమైన, తెలుగులో సులభంగా చదవగల లిప్యంతరీకరణ.
- source_word: לְנָחוֹר
  choice: నాహోరుకు
  rationale: వంశావళి సందర్భంలోని ל ను ‘నాహోరుకు’ అని సహజంగా వ్యక్తం చేశాం; అతనికి పుట్టిన సంతానం అనే సంబంధాన్ని సూచిస్తుంది.
- source_word: אֲחִי אַבְרָהָם
  choice: అబ్రాహాము సోదరుడైన
  rationale: నాహోరును గుర్తించే సమాస సంబంధాన్ని ఆధునిక తెలుగులో స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
