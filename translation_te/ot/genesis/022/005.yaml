source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אַבְרָהָ֜ם אֶל נְעָרָ֗י/ו שְׁבוּ לָ/כֶ֥ם פֹּה֙ עִֽם הַ/חֲמ֔וֹר וַ/אֲנִ֣י וְ/הַ/נַּ֔עַר נֵלְכָ֖ה עַד כֹּ֑ה וְ/נִֽשְׁתַּחֲוֶ֖ה וְ/נָשׁ֥וּבָה אֲלֵי/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/005.yaml
  text: And Abraham said to his young men[a], “Stay here with the donkey. I and the boy will go over there[b], and we will worship and return to you.”
translation:
  language: te
  text: అబ్రాహాము తన యువకులతో, “మీరు గాడిదతో ఇక్కడే ఉండండి. నేనూ ఆ బాలుడూ అక్కడివరకు వెళ్లి, ఆరాధించి[a], మీ దగ్గరికి తిరిగి వస్తాము[b]” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘వంగి నమస్కరించి.’ హెబ్రీ క్రియ మరింత అక్షరార్థంగా ఆరాధనలో వంగి నమస్కరించడాన్ని సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: అబ్రాహాము అక్షరార్థంగా ‘మేము మీ దగ్గరికి తిరిగి వస్తాము’ అంటున్నాడు. ఇది తన ఉద్దేశాన్ని దాచడమా, నిరీక్షణా, లేక దేవుడు సమకూరుస్తాడనే నమ్మకమా అని వచనం వివరించదు.
    reason: alternative_reading
lexical_decisions:
- source_word: נְעָרָיו
  choice: తన యువకులతో
  rationale: נַעַר అనే పదం సందర్భానుసారం యువకుడు, సేవకుడు లేదా సహాయకుడు అనే అర్థాలు ఇవ్వగలదు. ఇక్కడ అబ్రాహాముతో వచ్చిన ఇద్దరిని సూచిస్తోంది; ‘యువకులు’ మూలపదపు సాధారణ అర్థాన్ని నిలుపుతుంది.
- source_word: שְׁבוּ לָכֶם פֹּה
  choice: మీరు ఇక్కడే ఉండండి
  rationale: יָשַׁב అక్షరార్థంగా కూర్చోవడం లేదా నివసించడం అయినా, ముందుకు రాకుండా అక్కడే నిలిచిపోవాలనే ఆజ్ఞను ఆధునిక తెలుగులో ‘ఇక్కడే ఉండండి’ సహజంగా తెలియజేస్తుంది.
- source_word: עִם הַחֲמוֹר
  choice: గాడిదతో
  rationale: חֲמוֹרకు సాధారణ ఆధునిక తెలుగు సమానార్థకం ‘గాడిద’.
- source_word: וַאֲנִי וְהַנַּעַר
  choice: నేనూ ఈ బాలుడూ
  rationale: ఇక్కడ נַעַר ఇస్సాకును సూచిస్తుంది. ‘బాలుడు’ అబ్రాహాము దృష్టికోణానికి, కథన స్వరానికి సరిపోతుంది; తెలుగు నిర్దేశకమైన ‘ఈ’ సందర్భంలో సహజంగా వ్యక్తిని సూచిస్తుంది.
- source_word: נֵלְכָה עַד כֹּה
  choice: అక్కడివరకు వెళ్లి
  rationale: עַד כֹּה వేరుగా కనిపించే ఒక స్థలం వరకు వెళ్లడాన్ని సూచిస్తుంది. ‘అక్కడివరకు’ దాని స్థలసూచక భావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: וְנִשְׁתַּחֲוֶה
  choice: ఆరాధించి
  rationale: שָׁחָה ప్రాథమికంగా వంగి నమస్కరించడాన్ని సూచించినా, ఈ బలి సందర్భంలో ఆరాధనా భావం ప్రధానమైనది. శారీరక భావాన్ని పాదసూచికలో ఉంచాం.
- source_word: וְנָשׁוּבָה אֲלֵיכֶם
  choice: మీ దగ్గరికి తిరిగి వస్తాము
  rationale: שׁוּב అంటే తిరిగి రావడం. హెబ్రీ రూపం ప్రథమ పురుష బహువచనం కాబట్టి ‘వస్తాము’ అని స్పష్టంగా బహువచనాన్ని నిలిపాం; మూలంలో లేని ‘తర్వాత’ వంటి క్రమసూచక పదాన్ని చేర్చలేదు.
theological_decisions:
- issue: తిరిగి రావడం గురించి అబ్రాహాము ఉపయోగించిన బహువచనం
  choice: ‘మీ దగ్గరికి తిరిగి వస్తాము’ అనే స్పష్టమైన బహువచనాన్ని నిలుపడం
  alternative: అబ్రాహాము ఉద్దేశాన్ని దాచాడని లేదా ఇస్సాకుతో కలిసి తిరిగి వస్తాననే విశ్వాసాన్ని ప్రకటించాడని అనువాదంలోనే వివరించడం
  rationale: ఆరాధించడం, తిరిగి రావడం అనే రెండు క్రియలకూ హెబ్రీలో ప్రథమ పురుష బహువచన రూపాలున్నాయి. ఇది దాచిపెట్టిన మాటా, దేవుని సమకూర్పుపై నిరీక్షణా, విశ్వాస ప్రకటననా అని వచనం వివరించదు; అందువల్ల ఆ ఉద్రిక్తతను అనువాదం పరిష్కరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘మీరు’ ఆజ్ఞలో సహజత్వాన్ని ఇస్తుంది; ‘నేనూ ఈ బాలుడూ’ మూలంలోని రెండు కర్తలను స్పష్టంగా ఉంచుతుంది. పాదసూచిక గుర్తులు సంబంధిత పదబంధాలైన ‘ఆరాధించి’ మరియు ‘తిరిగి వస్తాము’ వద్ద ఉంచబడ్డాయి.
