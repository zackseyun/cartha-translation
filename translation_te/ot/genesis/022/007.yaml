source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יִצְחָ֜ק אֶל אַבְרָהָ֤ם אָבִי/ו֙ וַ/יֹּ֣אמֶר אָבִ֔/י וַ/יֹּ֖אמֶר הִנֶּ֣נִּֽ/י בְנִ֑/י וַ/יֹּ֗אמֶר הִנֵּ֤ה הָ/אֵשׁ֙ וְ/הָ֣/עֵצִ֔ים וְ/אַיֵּ֥ה הַ/שֶּׂ֖ה לְ/עֹלָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/007.yaml
  text: And Isaac said to Abraham his father[a], “My father!” And he said, “Here I am, my son.” And he said, “Look, the fire and the wood—but where is the sheep for a burnt offering?”
translation:
  language: te
  text: ఇస్సాకు తన తండ్రి అబ్రాహాముతో, “నాన్నా!” అన్నాడు. అబ్రాహాము, “ఇదిగో, నేనున్నాను, నా కుమారుడా,” అన్నాడు. అప్పుడు ఇస్సాకు, “ఇదిగో, నిప్పు, కట్టెలు ఉన్నాయి; కానీ దహనబలికి మందలోని జంతువు[a] ఎక్కడ ఉంది?” అని అడిగాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పదం שֶׂה మందకు చెందిన గొర్రెను లేదా మేకను సూచించవచ్చు; దాని వయస్సును ఈ పదం నిర్దేశించదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అన్నాడు / అడిగాడు
  rationale: אמר అనే సాధారణ కథన క్రియకు సంభాషణలో ‘అన్నాడు’ సహజం; చివరి మాట ప్రశ్న కావడంతో తెలుగులో ‘అడిగాడు’ అని సందర్భానుగుణంగా వ్యక్తీకరించడం సహజమైనది.
- source_word: אָבִיו
  choice: తన తండ్రి
  rationale: మూలంలోని బంధుత్వ సంబంధాన్ని స్పష్టంగా, గంభీరతకు తగిన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: אָבִי
  choice: నాన్నా!
  rationale: మొదటి పురుష ఏకవచన ప్రత్యయం గల ఆప్యాయ ప్రత్యక్ష సంబోధనను సహజమైన ఆధునిక తెలుగు రూపంలో అందిస్తుంది.
- source_word: הִנֶּנִי
  choice: ఏమిటి
  rationale: ప్రత్యక్ష పిలుపుకు స్పందనగా వచ్చే హీబ్రూ సన్నద్ధతా సూత్రాన్ని తెలుగు సంభాషణలో సహజంగా వ్యక్తం చేస్తుంది; పదశః ‘ఇదిగో, నేను’ ఇక్కడ కృత్రిమంగా ఉంటుంది.
- source_word: בְּנִי
  choice: నా కుమారుడా
  rationale: స్వామ్య ప్రత్యయాన్నీ, ఆప్యాయ సంబోధననూ నిలుపుతూ దృశ్యపు గంభీర స్వరానికి సరిపోతుంది.
- source_word: הִנֵּה
  choice: ఇదిగో
  rationale: కనిపిస్తున్న వస్తువులవైపు దృష్టి మళ్లించే హీబ్రూ సూచక అవ్యయానికి సహజమైన తెలుగు సమానం.
- source_word: הָאֵשׁ
  choice: నిప్పు
  rationale: ప్రయాణంలో తీసుకువచ్చిన అగ్నిని సూచించే సందర్భంలో సాధారణ పాఠకునికి సహజమైన పదం.
- source_word: הָעֵצִים
  choice: కట్టెలు
  rationale: హీబ్రూ బహువచనాన్ని, బలి కోసం ఉపయోగించే ఇంధనార్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: אַיֵּה
  choice: ఎక్కడ?
  rationale: స్థానాన్ని ప్రశ్నించే పదానికి నేరమైన, సహజమైన తెలుగు రూపం.
- source_word: הַשֶּׂה
  choice: గొర్రెపిల్ల
  rationale: బలి సందర్భంలో సహజమైన తెలుగు ఎంపిక; అయితే హీబ్రూ שֶׂה గొర్రెపిల్లకే పరిమితం కాక మేకపిల్లను కూడా సూచించగలందున ఆ విస్తృతిని పాదటిప్పణిలో ఉంచాం.
- source_word: לְעֹלָה
  choice: దహనబలికి
  rationale: మొత్తం దహించబడే బలిని సూచించే עֹלָה అనే ఆచారపదానికి సంక్షిప్తమైన, స్థిరమైన తెలుగు సమానం.
theological_decisions:
- issue: הַשֶּׂה అనే బలి జంతువు పదం యొక్క పరిధి
  choice: గొర్రెపిల్ల
  alternative: మందలోని చిన్న జంతువు / మేకపిల్ల
  rationale: తెలుగు బలి సందర్భంలో ‘గొర్రెపిల్ల’ సహజంగా అర్థమవుతుంది; అయినా మూలపదం వయస్సు లేదా జాతిని అంత ఖచ్చితంగా నిర్దేశించదు. కాబట్టి మూలంలోని భావపరిధిని పాదటిప్పణిలో స్పష్టంగా నిలిపాం.
- issue: הִנֶּנִי అనే స్పందనా సూత్రం
  choice: ఏమిటి
  alternative: ఇదిగో, నేను ఇక్కడ ఉన్నాను
  rationale: ఇది కుమారుని పిలుపుకు తండ్రి ఇచ్చే సన్నద్ధ స్పందన. సహజ తెలుగు సంభాషణలో ‘ఏమిటి, నా కుమారుడా?’ ఆ కార్యాన్ని సూటిగా తెలియజేస్తుంది; ఇందులో ప్రత్యేక సిద్ధాంతార్థాన్ని చొప్పించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ దృశ్యపు గంభీరతను నిలిపే సంభాషణా శైలి వాడబడింది. ‘నాన్నా’ ఆప్యాయ ప్రత్యక్ష సంబోధనగా, ‘నా కుమారుడా’ గంభీరమైన ప్రేమపూర్వక ప్రత్యుత్తరంగా ఎంపికయ్యాయి. మూలంలోని పునరుక్త אמר రూపాలను తెలుగులో అవసరమైన చోట ‘అన్నాడు’, ప్రశ్న వద్ద ‘అడిగాడు’గా సహజీకరించాం.
