id: GEN.22.6
reference: Genesis 22:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּקַּ֨ח אַבְרָהָ֜ם אֶת עֲצֵ֣י הָ/עֹלָ֗ה וַ/יָּ֨שֶׂם֙ עַל יִצְחָ֣ק בְּנ֔/וֹ וַ/יִּקַּ֣ח בְּ/יָד֔/וֹ אֶת הָ/אֵ֖שׁ וְ/אֶת הַֽ/מַּאֲכֶ֑לֶת וַ/יֵּלְכ֥וּ שְׁנֵי/הֶ֖ם יַחְדָּֽו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/006.yaml
  text: So Abraham took the wood for the burnt offering and laid it on Isaac his son[a], and he took in his hand the fire and the knife[b], and the two of them walked on together.
translation:
  language: te
  text: అబ్రాహాము దహనబలికి కావలసిన కట్టెలను[a] తీసుకొని, తన కుమారుడైన ఇస్సాకు మీద పెట్టాడు. నిప్పును, కత్తిని తన చేతిలో తీసుకున్నాడు. వారిద్దరూ కలిసి నడిచివెళ్లారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా ‘దహనబలి కట్టెలను.’
    reason: హీబ్రూ నిర్మాణం ‘కట్టెలు’ మరియు ‘దహనబలి’ మధ్య ‘యొక్క’ సంబంధాన్ని చూపుతుంది; ప్రధాన వచనం తెలుగులో సహజంగా ఉండేందుకు ఉద్దేశార్థాన్ని స్పష్టం చేసింది.
lexical_decisions:
- source_word: עֲצֵי הָעֹלָה
  choice: దహనబలికి కావలసిన కట్టెలను
  rationale: హీబ్రూ పదబంధం అక్షరార్థంగా ‘దహనబలి కట్టెలు’ అని ఉన్నా, కట్టెలు ఆ బలి కోసం అని ఆధునిక తెలుగులో సహజంగా, స్పష్టంగా తెలియజేయడానికి ఈ రూపం ఎంచుకున్నాం.
- source_word: וַיָּשֶׂם עַל
  choice: మీద పెట్టాడు
  rationale: שׂים ... עַל అనే నిర్మాణం ఒక వస్తువును మరొకరి మీద ఉంచడాన్ని సూచిస్తుంది. ‘మీద పెట్టాడు’ సహజమైన తెలుగు; కట్టెల భారాన్ని ఇస్సాకు మోశాడనే దృశ్యాన్ని నిలుపుతుంది.
- source_word: יִצְחָק בְּנוֹ
  choice: తన కుమారుడైన ఇస్సాకు
  rationale: హీబ్రూలో ‘ఇస్సాకు, అతని కుమారుడు’ అనే క్రమం ఉంది. తెలుగులో సంబంధాన్ని స్పష్టంగా, సహజంగా తెలియజేయడానికి ‘తన కుమారుడైన ఇస్సాకు’ అని అనువదించాం.
- source_word: בְּיָדוֹ
  choice: తన చేతిలో
  rationale: మూలంలో ‘చేతి’ ఏకవచనంలోనే ఉంది; దానిని నేరుగా నిలుపుతూ, అతడే వాటిని పట్టుకున్నాడనే భావాన్ని తెలియజేస్తుంది.
- source_word: הָאֵשׁ
  choice: నిప్పును
  rationale: మూలపదం సాధారణంగా ‘నిప్పు/అగ్ని’ అని మాత్రమే చెబుతుంది; నిప్పును ఎలా తీసుకెళ్లాడో లేదా ఏ పాత్రలో ఉంచాడో వచనం పేర్కొనదు. అందువల్ల ‘నిప్పు’ అనే నిర్దిష్టతలేని రూపాన్ని ఉంచాం.
- source_word: הַמַּאֲכֶלֶת
  choice: కత్తిని
  rationale: ఈ నామవాచకం వధకు ఉపయోగించే కత్తిని సూచించగలదు. అయితే సందర్భం బలి సంబంధిత ఉపయోగాన్ని ఇప్పటికే తెలియజేస్తున్నందున, అదనపు వివరణను ప్రధాన వచనంలో చేర్చకుండా సాధారణమైన ‘కత్తి’ని ఎంచుకున్నాం.
- source_word: וַיֵּלְכוּ שְׁנֵיהֶם יַחְדָּו
  choice: వారిద్దరూ కలిసి నడిచివెళ్లారు
  rationale: ‘వారిద్దరూ’ మూలంలోని జంటపై ఉన్న స్పష్టమైన దృష్టిని నిలుపుతుంది; ‘కలిసి’ יַחְדָּו భావాన్ని వ్యక్తం చేస్తుంది; ‘నడిచివెళ్లారు’ కథనంలోని ప్రయాణాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: עֹלָה అనే బలి పదానికి అనువాదం
  choice: దహనబలి
  alternative: ఆరోహణ బలి
  rationale: ఈ సందర్భంలో עֹלָה పూర్తిగా అగ్నిలో దహించబడే స్థిరమైన బలి విధానాన్ని సూచిస్తుంది. ‘దహనబలి’ ఆ ఆచార సంబంధమైన అర్థాన్ని సాధారణ తెలుగు పాఠకునికి స్పష్టంగా అందిస్తుంది; మూలధాతువు ఆధారంగా ‘ఆరోహణ బలి’ అనడం ఈ సందర్భంలో అస్పష్టంగా ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకునికి స్పష్టంగా ఉండే గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. ‘నిప్పు’ ఎలా తీసుకెళ్లబడిందో మూలం చెప్పనందున పాత్ర లేదా నిప్పుకుండ వంటి వివరాలు చేర్చలేదు. వరుస క్రియలను చిన్న వాక్యాలుగా అమర్చి తెలుగు పఠనసౌలభ్యాన్ని పెంచినా, మూలంలోని చర్యల క్రమాన్ని అలాగే ఉంచాం.
