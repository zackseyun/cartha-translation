revisions:
- from: నీ సంతానంలో భూమి మీద ఉన్న సమస్త జనాలు ఆశీర్వదించబడతారు[a]. ఎందుకంటే నువ్వు నా మాటకు లోబడ్డావు.
  to: నీ సంతానంలో భూమిలోని అన్ని జనాంగాలు ఆశీర్వదించబడతాయి[a], ఎందుకంటే నీవు నా మాటకు లోబడ్డావు.
  rationale: The revision retains the source’s ambiguity concerning the Hitpael verb and its footnote anchor, improves fidelity for ‘all the nations of the earth,’ and adopts a more natural formal-register singular address. No doctrinal conclusion is added.
