id: GEN.22.18
reference: Genesis 22:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הִתְבָּרֲכ֣וּ בְ/זַרְעֲ/ךָ֔ כֹּ֖ל גּוֹיֵ֣י הָ/אָ֑רֶץ עֵ֕קֶב אֲשֶׁ֥ר שָׁמַ֖עְתָּ בְּ/קֹלִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/018.yaml
  text: And in your offspring all the nations of the earth will be blessed[a], because you have obeyed my voice.
translation:
  language: te
  text: నీ సంతానంలో భూమిలోని అన్ని జనాంగాలు ఆశీర్వదించబడతాయి[a], ఎందుకంటే నీవు నా మాటకు లోబడ్డావు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తమను తాము ఆశీర్వదించుకుంటారు.” ఇక్కడి హీబ్రూ క్రియను ఆత్మార్థకంగా కూడా అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִתְבָּרֲכוּ
  choice: ఆశీర్వదించబడతారు
  rationale: ברך అనే క్రియ యొక్క హిత్పయేల్ రూపం ఇక్కడ నిష్క్రియాత్మక లేదా ఆత్మార్థక భావాన్ని ఇవ్వగలదు. పితృపురుషులకు ఇచ్చిన వాగ్దాన సందర్భంలో ‘ఆశీర్వదించబడతారు’ సహజంగా సరిపోతుంది; ఆత్మార్థక అవకాశాన్ని పాదటిప్పణిలో నిలుపుతుంది.
- source_word: בְזַרְעֲךָ
  choice: నీ సంతానంలో
  rationale: זֶרַע సమూహార్థకంగా సంతానం లేదా వంశాన్ని సూచిస్తుంది. בְ అనే ఉపసర్గను ‘లో’ అని అనువదించడం మూలంలోని నిబంధనాత్మక వాగ్దాన సూత్రాన్ని నిలుపుతూ, సాధనార్థాన్ని అవసరానికి మించి నిర్దిష్టం చేయదు.
- source_word: כֹּל גּוֹיֵי הָאָרֶץ
  choice: భూమి మీద ఉన్న సమస్త జనాలు
  rationale: גּוֹיִם దేశాలు లేదా జనసమూహాలను సూచిస్తుంది. తెలుగులో ‘సమస్త జనాలు’ ప్రపంచవ్యాప్త మానవ సమూహాల భావాన్ని సహజంగా తెలియజేస్తుంది; הָאָרֶץ యొక్క విస్తృత పరిధిని ‘భూమి మీద ఉన్న’ నిలుపుతుంది.
- source_word: עֵקֶב אֲשֶׁר
  choice: ఎందుకంటే
  rationale: ఈ పదబంధం వాగ్దానం తిరిగి ధృవీకరించబడటానికి కారణాన్ని పరిచయం చేస్తుంది. ‘ఎందుకంటే’ దాని కారణార్థాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: שָׁמַעְתָּ בְּקֹלִי
  choice: నువ్వు నా మాటకు లోబడ్డావు
  rationale: שׁמע בקול అనే హీబ్రూ నుడికారం కేవలం వినడాన్ని కాక, విని విధేయత చూపడాన్ని సూచిస్తుంది. ‘నా మాటకు లోబడ్డావు’ ఆధునిక తెలుగులో ఆ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ברך హిత్పయేల్ రూపంలో ఉన్న అబ్రాహామీయ వాగ్దాన క్రియ యొక్క భావం
  choice: అబ్రాహాము సంతానంలో జనాలు ఆశీర్వాదం పొందుతారని తెలిపే ‘ఆశీర్వదించబడతారు’ అనే పఠనం.
  alternative: జనాలు అబ్రాహాము సంతానాన్ని తమకు తాము ఆశీర్వాదం కోరుకునే ఆదర్శంగా ఉపయోగించుకుంటారనే ‘తమను తాము ఆశీర్వదించుకుంటారు’ అనే పఠనం.
  rationale: వాగ్దాన సందర్భం నిష్క్రియాత్మక లేదా ఫలితార్థక భావానికి అనుకూలంగా ఉంది. అయితే హీబ్రూ క్రియారూపానికి ఆత్మార్థక అవగాహన కూడా సాధ్యమైనందున, దానిని తొలగించకుండా పాదటిప్పణిలో నిలుపుతున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. దేవుడు అబ్రాహాముతో నేరుగా మాట్లాడుతున్న సందర్భానికి అనుగుణంగా ఏకవచన ‘నువ్వు/నీ’ వాడబడింది. మూలంలోని అర్థసందిగ్ధతను ప్రధాన పాఠ్యం మరియు పాదటిప్పణి ద్వారా పరిరక్షించాం.
