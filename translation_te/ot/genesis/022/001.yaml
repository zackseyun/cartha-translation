id: GEN.22.1
reference: Genesis 22:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְהִ֗י אַחַר֙ הַ/דְּבָרִ֣ים הָ/אֵ֔לֶּה וְ/הָ֣/אֱלֹהִ֔ים נִסָּ֖ה אֶת אַבְרָהָ֑ם וַ/יֹּ֣אמֶר אֵלָ֔י/ו אַבְרָהָ֖ם וַ/יֹּ֥אמֶר הִנֵּֽנִ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/001.yaml
  text: After these things[a], God tested Abraham and said to him, “Abraham!” And he said[b], “Here I am.”
translation:
  language: te
  text: ఈ సంగతుల[a] తరువాత దేవుడు అబ్రాహామును పరీక్షించాడు. దేవుడు అతనితో, “అబ్రాహామా!” అన్నాడు. అందుకు అతడు, “ఇదిగో, నేనున్నాను” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఈ సంఘటనల తరువాత.”
    reason: דְּבָרִים అనే పదం సందర్భానుసారం ‘సంగతులు’ లేదా ‘సంఘటనలు’ అని అర్థమివ్వగలదు.
lexical_decisions:
- source_word: וַיְהִי אַחַר הַדְּבָרִים הָאֵלֶּה
  choice: ఈ సంగతుల తరువాత
  rationale: וַיְהִי ఇక్కడ కథనంలోని కొత్త దశకు మార్పును సూచిస్తుంది; తెలుగులో ప్రత్యేకంగా అనువదించకుండానే ‘ఈ సంగతుల తరువాత’ అనే సహజమైన కాలసూచక పదబంధం ఆ భావాన్ని అందిస్తుంది. דְּבָרִים విస్తృతార్థాన్ని ‘సంగతులు’ నిలుపుతుంది.
- source_word: הָאֱלֹהִים
  choice: దేవుడు
  rationale: కథన సందర్భంలో ఇది దేవుణ్ణే సూచిస్తుంది; ఇక్కడ יהוה అనే దైవనామం లేదు.
- source_word: נִסָּה
  choice: పరీక్షించాడు
  rationale: Piel రూపంలోని נסה ఇక్కడ ఒకరి స్వభావం లేదా నమ్మకత్వం వెల్లడయ్యేలా పరీక్షించడాన్ని సూచిస్తుంది. ‘పరీక్షించాడు’ ఆధునిక తెలుగులో స్పష్టమైన, సహజమైన సమానార్థకం.
- source_word: אֶת אַבְרָהָם
  choice: అబ్రాహామును
  rationale: אֶת కర్మసూచకం; తెలుగులో ద్వితీయావిభక్తి ప్రత్యయం ద్వారా వ్యక్తమవుతుంది.
- source_word: וַיֹּאמֶר אֵלָיו
  choice: దేవుడు అతనితో … అన్నాడు
  rationale: אמר సాధారణంగా ‘అన్నాడు’ అని అనువదించబడుతుంది. కర్త స్పష్టంగా ఉండేందుకు తెలుగులో ‘దేవుడు’ను పునరుక్తి చేశాం.
- source_word: אַבְרָהָם
  choice: అబ్రాహామా!
  rationale: సంబోధనను తెలుగు సంబోధన రూపం మరియు ఆశ్చర్యార్థక చిహ్నంతో వ్యక్తం చేశాం.
- source_word: הִנֵּנִי
  choice: ఇదిగో, నేనున్నాను
  rationale: ఈ హీబ్రూ నుడికారం కేవలం ఉన్న చోటును కాక, శ్రద్ధతో స్పందిస్తూ సిద్ధంగా ఉండటాన్ని కూడా తెలియజేస్తుంది; ‘ఇదిగో, నేనున్నాను’ ఆ స్వరాన్ని నిలుపుతుంది.
theological_decisions:
- issue: దేవుడు కర్తగా ఉన్నప్పుడు נסה అర్థం
  choice: దేవుడు అబ్రాహామును పరీక్షించాడు
  alternative: దేవుడు అబ్రాహామును ప్రలోభపెట్టాడు
  rationale: ఈ సందర్భంలో క్రియ పరీక్షించి రుజువు చేయడాన్ని సూచిస్తుంది; చెడు చేయడానికి ప్రలోభపెట్టడం అనే భావాన్ని పాఠ్యం తప్పనిసరిగా వ్యక్తం చేయదు. ‘పరీక్షించాడు’ కథనంలోని ఉద్రిక్తతను నిలుపుతూ అనవసరమైన సిద్ధాంతార్థాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. ‘ఇదిగో, నేనున్నాను’ అనే రూపం మూలంలోని శ్రద్ధతో కూడిన సిద్ధతను నిలుపుతుంది. సర్వనామ గందరగోళం రాకుండా రెండవ వాక్యంలో ‘దేవుడు’ను పునరుక్తి చేశాం.
