lexical_decisions:
- source_word: כֶּשֶׂד
  choice: కెసెదు
  rationale: వంశావళి జాబితాలోని వ్యక్తి పేరు; హీబ్రూ రూపాన్ని ఆధారంగా చేసుకొని తెలుగులో సహజంగా పలికేలా లిప్యంతరీకరించబడింది.
- source_word: חֲזוֹ
  choice: హజో
  rationale: వ్యక్తి పేరు; హీబ్రూ హల్లును తెలుగులో సాధారణంగా అర్థమయ్యే ‘హ’తో సూచించి లిప్యంతరీకరించబడింది.
- source_word: פִּלְדָּשׁ
  choice: పిల్దాషు
  rationale: వ్యక్తి పేరు; మూలంలోని ధ్వనిక్రమాన్ని నిలుపుతూ తెలుగు ఉచ్చారణకు అనువుగా చివర ‘ు’ చేర్చబడింది.
- source_word: יִדְלָף
  choice: యిద్లాఫు
  rationale: మూల హీబ్రూలోని ఆరంభ యోడ్ ధ్వనిని ‘యి’గా నేరుగా ప్రతిబింబించి, తెలుగు ఉచ్చారణకు అనువుగా రూపం ఇవ్వబడింది.
- source_word: בְּתוּאֵל
  choice: బెతూయేలు
  rationale: వ్యక్తి పేరు; హీబ్రూ ధ్వనిరూపాన్ని అనుసరించిన, తెలుగులో సులభంగా పలికే లిప్యంతరీకరణ.
- source_word: וְאֶת / וְאֵת
  choice: జాబితా విరామచిహ్నాలు
  rationale: పునరావృతమయ్యే వావ్‌తో కూడిన కర్మ సూచికను తెలుగులో విడిగా అనువదించాల్సిన అవసరం లేదు; పేర్ల జాబితాను కామాలతో సహజంగా చూపించాం.
