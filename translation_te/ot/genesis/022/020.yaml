base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/020.yaml
  text: After these things, it was reported to Abraham, saying, “Look, Milcah also has borne sons to your brother Nahor:”
translation:
  language: te
  text: 'ఈ సంగతులు జరిగిన తర్వాత, అబ్రాహాముకు ఈ సమాచారం అందింది: “ఇదిగో, మిల్కా కూడా నీ సోదరుడైన నాహోరుకు కుమారులను కనింది:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי הַדְּבָרִים הָאֵלֶּה
  choice: ఈ సంగతులు జరిగిన తర్వాత
  rationale: హీబ్రూ కథన సంధిని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తూ, ప్రత్యేకమైన ‘ఇప్పుడు’ అనే కాలార్థాన్ని చేర్చలేదు.
- source_word: וַיֻּגַּד לְאַבְרָהָם לֵאמֹר
  choice: అబ్రాహాముకు ఈ సమాచారం అందింది
  rationale: మూలంలోని కర్మణి భావాన్ని నిలుపుతూ, לֵאמֹר పరిచయం చేసే ప్రత్యక్ష సమాచారాన్ని తెలుగులో సహజంగా కోలన్‌తో సూచించింది.
- source_word: הִנֵּה
  choice: ఇదిగో
  rationale: కొత్తదైన, గమనించదగిన సమాచారంపై దృష్టి పెట్టే హీబ్రూ సూచక అవ్యయానికి సహజమైన తెలుగు సమానం.
- source_word: יָלְדָה ... בָּנִים
  choice: కుమారులను కనింది
  rationale: ‘sons’ అనే పుంలింగ బహువచనాన్ని స్పష్టంగా నిలిపింది.
- source_word: לְנָחוֹר אָחִיךָ
  choice: నీ సోదరుడైన నాహోరుకు
  rationale: నాహోరు అబ్రాహాము సోదరుడని తెలిపే సంబంధాన్ని అస్పష్టత లేకుండా సహజ తెలుగు క్రమంలో ఉంచింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కథన శైలి సరళంగా, గౌరవప్రదంగా ఉంది. వాక్యం తరువాతి వచనంలోని కుమారుల జాబితాకు దారితీస్తున్నందున చివర కోలన్ ఉంచబడింది.
