source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ אַבְרָהָ֔ם אֱלֹהִ֞ים יִרְאֶה לּ֥/וֹ הַ/שֶּׂ֛ה לְ/עֹלָ֖ה בְּנִ֑/י וַ/יֵּלְכ֥וּ שְׁנֵי/הֶ֖ם יַחְדָּֽו־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/008.yaml
  text: And Abraham said[a], “God will provide for himself the lamb for a burnt offering, my son.” So the two of them went on together.
translation:
  language: te
  text: 'అబ్రాహాము ఇలా అన్నాడు[a]: “దేవుడు తన కోసం దహనబలి కోసం గొర్రెపిల్లను సమకూర్చుకుంటాడు, నా కుమారుడా.” ఆ ఇద్దరూ కలిసి ముందుకు సాగారు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “దేవుడు తన కోసం దహనబలి కోసం గొర్రెపిల్లను చూస్తాడు.” ఇక్కడి హీబ్రూ క్రియకు “చూడు” అని అర్థం; ఈ సందర్భంలో నుడికారంగా “చూసుకో” లేదా “సమకూర్చు” అని కూడా అర్థమవుతుంది. “గొర్రెపిల్ల”కు వాడిన హీబ్రూ పదం గొర్రెను గానీ మేకను గానీ సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అబ్రాహాము ఇలా అన్నాడు
  rationale: వావ్-కన్సిక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది. తెలుగులో సహజమైన కథన ప్రవాహం కోసం ‘ఇలా అన్నాడు’ అని అనువదించాం.
- source_word: אֱלֹהִים
  choice: దేవుడు
  rationale: అబ్రాహాము మాటల్లో నిజ దేవుణ్ణి సూచించే సాధారణ హీబ్రూ పదానికి సహజమైన తెలుగు సమానం.
- source_word: יִרְאֶה לּוֹ
  choice: తన కోసం సమకూర్చుకుంటాడు
  rationale: ראה అనే క్రియ అక్షరార్థంగా ‘చూడు’ అని అర్థమిచ్చినా, ఇక్కడ ‘చూసుకుంటాడు/సమకూర్చుకుంటాడు’ అనే నుడికారార్థం ఉంది. לּוֹ లోని ‘తన కోసం’ అనే భావాన్ని ప్రధాన పాఠ్యంలో నిలిపాం.
- source_word: הַשֶּׂה
  choice: గొర్రెపిల్లను
  rationale: שֶׂה చిన్న పశువులలో గొర్రెను లేదా మేకను సూచించగలదు. ఇక్కడ బలి సందర్భంలోనూ, ముందటి ప్రశ్నకు అనుగుణంగానూ ‘గొర్రెపిల్ల’ సహజంగా ఉంది; విస్తృత పదార్థాన్ని పాదసూచికలో వివరించాం.
- source_word: לְעֹלָה
  choice: దహనబలి కోసం
  rationale: עֹלָה పూర్తిగా దహనం చేసే బలికి ప్రామాణిక పదం. ‘దహనబలి’ ఆధునిక తెలుగులో స్పష్టమైన బైబిలు సంబంధిత పదం.
- source_word: בְּנִי
  choice: నా కుమారుడా
  rationale: ఇది ప్రత్యక్షమైన, ఆప్యాయమైన సంబోధన; కుటుంబ బంధాన్నీ భావోద్వేగ స్వరాన్నీ నిలుపుతుంది.
- source_word: וַיֵּלְכוּ שְׁנֵיהֶם יַחְדָּו
  choice: ఆ ఇద్దరూ కలిసి ముందుకు సాగారు
  rationale: ఇద్దరూ కలిసే ప్రయాణించారనే హీబ్రూ ఉద్ఘాటనను నిలుపుతూ, కథనం కొనసాగుతున్న భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: దేవుని చర్య గురించి అబ్రాహాము మాటల అర్థం
  choice: దేవుడు తన కోసం గొర్రెపిల్లను సమకూర్చుకుంటాడు
  alternative: దేవుడు తన కోసం గొర్రెపిల్లను చూస్తాడు / చూసుకుంటాడు
  rationale: హీబ్రూ పదబంధం అక్షరార్థంగా ‘చూస్తాడు’ అని ఉండగలిగినా, సందర్భంలో ‘సమకూర్చుకుంటాడు’ అనే నుడికారార్థం ప్రధానంగా ఉంది. ‘తన కోసం’ అనే మాటను నిలిపి, అబ్రాహాము తప్పించుకునే సమాధానం చెప్పాడా, ప్రవచనాత్మకంగా చెప్పాడా, లేక రెండూ ఉన్నాయా అనే కథన ఉద్వేగాన్ని పరిష్కరించకుండా ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కథన శైలి. ‘నా కుమారుడా’ అనే సంబోధన భావోద్వేగ స్వరాన్ని నిలుపుతుంది. పాదసూచిక సూచిక [a] ప్రధాన పాఠ్యంలో ఉంచబడింది.
