id: GEN.22.21
reference: Genesis 22:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אֶת ע֥וּץ בְּכֹר֖/וֹ וְ/אֶת בּ֣וּז אָחִ֑י/ו וְ/אֶת קְמוּאֵ֖ל אֲבִ֥י אֲרָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/021.yaml
  text: Uz his firstborn[a], Buz his brother, and Kemuel the father of Aram.
translation:
  language: te
  text: నాహోరుకు జ్యేష్ఠ కుమారుడు ఊజు, నాహోరుకు సోదరుడు బూజు, అరాముకు తండ్రి[a] కెమూయేలు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అరాముకు పూర్వికుడు.” వంశావళుల్లో “తండ్రి” అనే మాట కొన్నిసార్లు ప్రత్యక్ష తండ్రిని కాకుండా పూర్వికుణ్ణి లేదా వంశ మూలపురుషుణ్ణి సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ע֥וּץ
  choice: ఊజు
  rationale: వ్యక్తి పేరును తెలుగులో సహజంగా ఉచ్చరించగల రూపంలో లిప్యంతరీకరించాం.
- source_word: בְּכֹר֖וֹ
  choice: అతని జ్యేష్ఠ కుమారుడు
  rationale: בכור జననక్రమంలో మొదట పుట్టిన కుమారుణ్ణి సూచిస్తుంది; ‘జ్యేష్ఠ కుమారుడు’ ఆ వంశావళి భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: בּ֣וּז
  choice: బూజు
  rationale: వ్యక్తి పేరును తెలుగు ధ్వన్యనుసారంగా లిప్యంతరీకరించాం.
- source_word: אָחִ֑יו
  choice: ఊజు సోదరుడు
  rationale: హీబ్రూ పదానికి అక్షరార్థం ‘అతని సోదరుడు’. తెలుగులో సర్వనామ సూచన అస్పష్టంగా ఉండకుండా సమీప పూర్వపదమైన ఊజు పేరును పునరుక్తి చేశాం; ‘తమ్ముడు’ అని వయోక్రమాన్ని అదనంగా నిర్ధారించలేదు.
- source_word: קְמוּאֵ֖ל
  choice: కెమూయేలు
  rationale: వ్యక్తి పేరును మూల ధ్వనులకు దగ్గరగా, తెలుగులో చదవదగిన రూపంలో లిప్యంతరీకరించాం.
- source_word: אֲבִ֥י
  choice: తండ్రి
  rationale: ప్రత్యక్షమైన అర్థం ‘తండ్రి’. వంశావళుల్లో ఇది పూర్వికుడు లేదా మూలపురుషుడు అనే విస్తృత అర్థాన్ని కూడా పొందవచ్చు; ఆ అవకాశాన్ని పాదసూచికలో ఉంచాం.
- source_word: אֲרָֽם
  choice: అరాము
  rationale: పాఠ్యంలో ఉన్న వ్యక్తి పేరును మాత్రమే లిప్యంతరీకరించాం; ప్రాంతం లేదా జాతిని సూచిస్తుందని ప్రధాన పాఠ్యంలో నిర్ణయించలేదు.
theological_decisions:
- issue: אֲבִי אֲרָם అనే వంశావళి పదబంధం
  choice: అరాముకు తండ్రి
  alternative: అరాముకు పూర్వికుడు / అరాము వంశానికి మూలపురుషుడు
  rationale: హీబ్రూ నిర్మాణానికి ప్రత్యక్ష అర్థం ‘అరాముకు తండ్రి’. అయితే వంశావళి సందర్భంలో ‘తండ్రి’ పూర్వికుణ్ణి లేదా వంశ స్థాపకుణ్ణి కూడా సూచించగలదు. ప్రధాన పాఠ్యం ప్రత్యక్ష అర్థాన్ని నిలుపుతూ, విస్తృత భావాన్ని పాదసూచికలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన వంశావళి శైలిని వాడాం. ‘మొదటి సంతానం’ కంటే పురుష సంతానాన్ని స్పష్టంగా చూపే ‘జ్యేష్ఠ కుమారుడు’ను ఎంచుకున్నాం. ‘సోదరుడు’ అనే తటస్థ పదంతో మూలంలో లేని అన్న/తమ్ముడు వయోభేదాన్ని చేర్చలేదు. పాదసూచిక గుర్తును అది వివరిస్తున్న ‘తండ్రి’ పదానికే జతచేశాం.
