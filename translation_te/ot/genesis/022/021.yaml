revisions:
- from: అతని జ్యేష్ఠ కుమారుడు ఊజు, ఊజు సోదరుడు బూజు, అరాముకు తండ్రి[a] కెమూయేలు.
  to: నాహోరుకు జ్యేష్ఠ కుమారుడు ఊజు, నాహోరుకు సోదరుడు బూజు, అరాముకు తండ్రి[a] కెమూయేలు.
  rationale: The only required change corrects the antecedent of ‘his brother.’ Explicitly repeating Nahor’s name is warranted in Telugu because placing Buz after Uz makes an unqualified possessive naturally attach to Uz. The footnote marker remains attached to ‘తండ్రి,’ the word it explains.
  reviewer_model: gpt-5.6-terra
