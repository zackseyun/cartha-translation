lexical_decisions:
- source_word: וַיִּקְרָא
  choice: పిలిచాడు
  rationale: వయ్యిక్తోల్ రూపం కథనాన్ని ముందుకు నడిపే సాధారణ భూతకాల క్రియను సూచిస్తుంది; ప్రత్యక్షంగా సంబోధించే ఈ సందర్భంలో ‘పిలిచాడు’ సహజమైన అనువాదం.
- source_word: מַלְאַךְ יְהוָה
  choice: యెహోవా దూత
  rationale: מַלְאָךְ అనే పదానికి ‘దూత’ లేదా సందర్భానుసారంగా ‘దేవదూత’ అనే అర్థం ఉండవచ్చు. తెలుగు ‘దూత’ మూలపదంలోని విస్తృతిని కాపాడుతూ, ఆ వ్యక్తి స్వరూపంపై ఉన్న వేదాంతపరమైన ప్రశ్నను తేల్చదు.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా పరిచయమైన ‘యెహోవా’ రూపంలో లిప్యంతరీకరించాం.
- source_word: אֶל אַבְרָהָם
  choice: అబ్రాహామును
  rationale: אֶל ఇక్కడ పిలుపు ఎవరిని ఉద్దేశించిందో సూచిస్తుంది; ‘అబ్రాహామును పిలిచాడు’ అనేది సహజమైన తెలుగు వాక్యనిర్మాణం.
- source_word: שֵׁנִית
  choice: రెండోసారి
  rationale: ‘మళ్లీ’ అనే సాధారణ భావం కంటే మూలంలోని స్పష్టమైన క్రమసంఖ్య భావాన్ని ‘రెండోసారి’ నేరుగా నిలుపుతుంది.
- source_word: מִן הַשָּׁמַיִם
  choice: పరలోకం నుండి
  rationale: שָׁמַיִם రూపపరంగా బహువచనమైనా, దైవిక పిలుపు వచ్చే స్థలాన్ని సూచించే ఈ సందర్భంలో ‘పరలోకం నుండి’ సహజమైన, గౌరవప్రదమైన తెలుగు ప్రయోగం.
theological_decisions:
- issue: מַלְאַךְ יְהוָה పదబంధం యొక్క అనువాదం
  choice: యెహోవా దూత
  alternative: యెహోవా దేవదూత
  rationale: ‘దూత’ అనే అనువాదం పదం యొక్క ప్రాథమిక అర్థాన్ని కాపాడి, ఇతడు సృష్టించబడిన దేవదూతనా లేక దేవుని ప్రత్యేక ప్రత్యక్షతనా అనే వేదాంత చర్చను పరిష్కరించదు. ప్రత్యామ్నాయాన్ని పాదసూచికలో అందించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, సంక్షిప్తమైన కథన శైలి. ‘యెహోవా’ దైవనామాన్ని నిలిపి, ‘దూత’ ద్వారా మూలంలోని పదార్థ విస్తృతిని సంరక్షించాం.
