id: GEN.22.13
reference: Genesis 22:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּשָּׂ֨א אַבְרָהָ֜ם אֶת עֵינָ֗י/ו וַ/יַּרְא֙ וְ/הִנֵּה אַ֔יִל אַחַ֕ר נֶאֱחַ֥ז בַּ/סְּבַ֖ךְ בְּ/קַרְנָ֑י/ו וַ/יֵּ֤לֶךְ אַבְרָהָם֙ וַ/יִּקַּ֣ח אֶת הָ/אַ֔יִל וַ/יַּעֲלֵ֥/הוּ לְ/עֹלָ֖ה תַּ֥חַת בְּנֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/013.yaml
  text: Then Abraham lifted up his eyes and looked[a], and behold, behind him was a ram caught in the thicket by its horns[b]. And Abraham went and took the ram and offered it up as a burnt offering instead of his son.
translation:
  language: te
  text: అప్పుడు అబ్రాహాము కళ్లు పైకెత్తి చూశాడు; ఇదిగో, అతని వెనుక[a] తన కొమ్ములతో పొదలో చిక్కుకొని ఉన్న ఒక పొట్టేలు కనిపించింది. అబ్రాహాము వెళ్లి ఆ పొట్టేలును తీసుకొని, తన కుమారునికి బదులుగా[b] దాన్ని దహనబలిగా అర్పించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “వెనుక”; ఇక్కడ హీబ్రూ אַחַר‌ను చాలామంది అనువాదకులు స్థలాన్ని సూచించే క్రియావిశేషణంగా అర్థం చేసుకుంటారు; మూలపాఠంలో “అతని” అనే సర్వనామం స్పష్టంగా లేదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా “తన కుమారుని స్థానంలో.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא ... אֶת עֵינָיו
  choice: కళ్లు పైకెత్తి
  rationale: చూపును పైకెత్తడం అనే హీబ్రూ నుడికారాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తూ, కథనంలోని దృశ్యాత్మకతను నిలుపుతుంది.
- source_word: וַיַּרְא
  choice: చూశాడు
  rationale: ముందున్న ‘కళ్లు పైకెత్తి’ అనే క్రియతో సహజంగా కలసి, అబ్రాహాము గమనించిన చర్యను స్పష్టంగా తెలియజేస్తుంది.
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: హీబ్రూ కథనంలో పాఠకుని దృష్టిని ఆకస్మికంగా దృశ్యంపై నిలిపే సూచనాత్మక బలాన్ని కాపాడుతుంది.
- source_word: אַיִל
  choice: పొట్టేలు
  rationale: బలి సందర్భంలో వయోజన మగ గొర్రెకు సాధారణమైన, ఖచ్చితమైన తెలుగు పదం.
- source_word: אַחַר
  choice: అతని వెనుక
  rationale: ఈ సందర్భంలో స్థలాన్ని సూచించే అర్థమే సహజం. హీబ్రూలో సర్వనామం స్పష్టంగా లేకపోయినా, తెలుగులో దృశ్యం సహజంగా అర్థమయ్యేందుకు ‘అతని’ చేర్చబడింది; ప్రత్యామ్నాయం పాదసూచికలో ఉంచబడింది.
- source_word: נֶאֱחַז
  choice: చిక్కుకొని ఉంది
  rationale: పొట్టేలు అప్పటికే పొదలో చిక్కుకున్న ఫలితస్థితిని హీబ్రూ నిష్క్రియ రూపానికి అనుగుణంగా తెలియజేస్తుంది.
- source_word: בַּסְּבַךְ
  choice: పొదలో
  rationale: జంతువు చిక్కుకునే దట్టమైన, అల్లుకున్న వృక్షసమూహాన్ని సాధారణ పాఠకునికి సహజంగా తెలియజేస్తుంది.
- source_word: בְּקַרְנָיו
  choice: తన కొమ్ములు పొదలో చిక్కుకొని
  rationale: పొట్టేలు ఏ భాగం వల్ల చిక్కుకుందో తెలుగులో స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וַיַּעֲלֵהוּ לְעֹלָה
  choice: దాన్ని దహనబలిగా అర్పించాడు
  rationale: బలి సందర్భంలో עלה మరియు עֹלָה కలిపి సూచించే సంపూర్ణ దహనార్పణను ఖచ్చితంగా, సహజంగా తెలియజేస్తుంది.
- source_word: תַּחַת בְּנוֹ
  choice: తన కుమారునికి బదులుగా
  rationale: ఈ కథన సందర్భంలో תַּחַת సూచించే ప్రత్యామ్నాయ లేదా ప్రతిస్థాపన భావాన్ని స్పష్టంగా తెలుపుతుంది.
theological_decisions:
- issue: תַּחַת בְּנוֹ లోని ప్రతిస్థాపన భావం
  choice: తన కుమారునికి బదులుగా
  alternative: తన కుమారుని స్థానంలో
  rationale: ఈ సందర్భంలో హీబ్రూ విభక్త్యర్థకం ఒకరి స్థానంలో మరొకరు ఉండే భావాన్ని స్పష్టంగా సూచిస్తుంది. వచనం చెప్పే ప్రతిస్థాపనను నిలుపుతూ, దాని మీద తరువాతి సిద్ధాంతార్థాలను అనువాదంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా ఉండి, కథన గాంభీర్యాన్ని నిలుపుతుంది. ‘ఇదిగో’ ద్వారా హీబ్రూ దృష్టి-ఆకర్షణ సూచికను, ‘దహనబలి’ ద్వారా బలి సంబంధిత సాంకేతిక భావాన్ని కాపాడింది.
