id: GEN.22.9
reference: Genesis 22:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּבֹ֗אוּ אֶֽל הַ/מָּקוֹם֮ אֲשֶׁ֣ר אָֽמַר ל֣/וֹ הָ/אֱלֹהִים֒ וַ/יִּ֨בֶן שָׁ֤ם אַבְרָהָם֙ אֶת הַ/מִּזְבֵּ֔חַ וַֽ/יַּעֲרֹ֖ךְ אֶת הָ/עֵצִ֑ים וַֽ/יַּעֲקֹד֙ אֶת יִצְחָ֣ק בְּנ֔/וֹ וַ/יָּ֤שֶׂם אֹת/וֹ֙ עַל הַ/מִּזְבֵּ֔חַ מִ/מַּ֖עַל לָ/עֵצִֽים־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/009.yaml
  text: Then they came to the place that God had told him[a], and Abraham built the altar there and arranged the wood. He bound Isaac his son and placed him on the altar[c][b], on top of the wood.
translation:
  language: te
  text: దేవుడు అబ్రాహాముకు చెప్పిన స్థలానికి వారు వచ్చారు.[a] అక్కడ అబ్రాహాము ఆ బలిపీఠాన్ని[b] కట్టి, కట్టెలను క్రమంగా అమర్చాడు. తన కుమారుడైన ఇస్సాకును బంధించి, బలిపీఠం మీద ఉన్న కట్టెలపై[c] ఉంచాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూలభాషలో అక్షరార్థంగా, ‘దేవుడు అతనికి చెప్పిన స్థలం.’
    reason: హీబ్రూ אָמַר לוֹ అనే పదబంధానికి మరింత అక్షరార్థమైన ప్రత్యామ్నాయాన్ని తెలియజేయడం.
  - marker: b
    text: ‘ఒక బలిపీఠాన్ని’ అని కూడా అనువదించవచ్చు. హీబ్రూలో ‘బలిపీఠం’ నిర్దిష్ట రూపంలో ఉంది; ఈ బలికోసం సిద్ధం చేస్తున్న ప్రత్యేక బలిపీఠాన్ని అది సూచించవచ్చు.
    reason: తెలుగులో మొదటిసారి ప్రస్తావించే వస్తువుకు ‘ఒక’ అనడం సహజమైనప్పటికీ, మూలంలోని నిర్దిష్టతను చూపించడం.
  - marker: c
    text: హీబ్రూలో అక్షరార్థంగా, ‘కట్టెలకు పైన’; అంటే పేర్చిన కట్టెల మీద.
    reason: మూలంలోని స్థానసంబంధ పదబంధాన్ని స్పష్టం చేయడం.
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: వారు వచ్చారు
  rationale: బహువచన కర్తను నిలుపుతూ, హీబ్రూ కథన క్రమాన్ని సహజమైన తెలుగు వాక్యరూపంలో వ్యక్తపరుస్తుంది.
- source_word: אֶל הַמָּקוֹם
  choice: స్థలానికి
  rationale: నిర్దిష్టమైన గమ్యస్థలాన్ని సూచించే సరళమైన, సహజమైన తెలుగు రూపం.
- source_word: אֲשֶׁר אָמַר לוֹ הָאֱלֹהִים
  choice: దేవుడు తనకు చెప్పిన
  rationale: אמר לוֹ యొక్క ప్రాథమిక భావాన్ని నిలుపుతూ, ముందుగా దేవుడు అబ్రాహాముకు తెలియజేసిన స్థలమని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: וַיִּבֶן שָׁם אַבְרָהָם אֶת הַמִּזְבֵּחַ
  choice: అక్కడ అబ్రాహాము ఆ బలిపీఠాన్ని కట్టి
  rationale: מִזְבֵּחַ మీదున్న నిర్దిష్ట ఉపపదాన్ని ‘ఆ’ ద్వారా ప్రతిబింబిస్తుంది; తెలుగు వాడుకలో బలిపీఠాన్ని ‘కట్టడం’ సహజంగా ఉంటుంది.
- source_word: וַיַּעֲרֹךְ אֶת הָעֵצִים
  choice: కట్టెలను క్రమంగా పేర్చాడు
  rationale: ערך లోని క్రమపరచడం లేదా అమర్చడం అనే బలిసంబంధ భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: וַיַּעֲקֹד
  choice: బంధించి
  rationale: עקד యొక్క ప్రత్యేకమైన ‘కట్టివేయడం/బంధించడం’ భావాన్ని తీవ్రత తగ్గించకుండా వ్యక్తపరుస్తుంది.
- source_word: יִצְחָק בְּנוֹ
  choice: తన కుమారుడైన ఇస్సాకును
  rationale: కుమార సంబంధాన్ని స్పష్టంగా ఉంచుతూ ఆధునిక తెలుగులో సహజమైన పదక్రమాన్ని వాడుతుంది.
- source_word: וַיָּשֶׂם אֹתוֹ עַל הַמִּזְבֵּחַ
  choice: బలిపీఠం మీద ... ఉంచాడు
  rationale: שׂים అనే సాధారణంగా ఉంచడాన్ని సూచించే క్రియను, చర్య విధానాన్ని అదనంగా ఊహించకుండా అనువదిస్తుంది.
- source_word: מִמַּעַל לָעֵצִים
  choice: కట్టెలపై
  rationale: పేర్చిన కట్టెలకు పైన లేదా వాటి మీద ఇస్సాకు ఉంచబడిన స్థాన సంబంధాన్ని సంక్షిప్తంగా, స్పష్టంగా తెలుపుతుంది.
theological_decisions:
- issue: బలి నిర్మాణం యొక్క నిర్దిష్టత
  choice: ఆ బలిపీఠాన్ని
  alternative: ఒక బలిపీఠాన్ని
  rationale: హీబ్రూలో מִזְבֵּחַ కు నిర్దిష్ట ఉపపదం ఉంది. ‘ఆ బలిపీఠం’ దానిని ప్రతిబింబిస్తుంది; ఇది తరువాతి సిద్ధాంతార్థాన్ని చేర్చకుండా ఈ బలికోసం సిద్ధం చేస్తున్న నిర్దిష్ట నిర్మాణాన్ని చూపుతుంది.
- issue: ఇస్సాకును కట్టిన చర్య
  choice: తన కుమారుడైన ఇస్సాకును బంధించి
  alternative: తన కుమారుడైన ఇస్సాకును కట్టివేసి
  rationale: ‘బంధించి’ అనేది עקד యొక్క అర్థాన్ని గంభీరంగా, నేరుగా నిలుపుతుంది; చర్యను మృదువుగా చేయదు, అలాగే అదనపు వ్యాఖ్యానాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన కథనశైలి, అయితే సంఘటన గాంభీర్యానికి తగిన మర్యాదపూర్వక భాష. హీబ్రూ వాక్యంలోని వరుస చర్యలను స్పష్టంగా నిలిపి, సిద్ధాంతపరమైన వివరణలను ప్రధాన వచనంలో చేర్చలేదు.
