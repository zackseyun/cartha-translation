  to: దేవుడు అబ్రాహాముకు చెప్పిన స్థలానికి వారు వచ్చారు.[a] అక్కడ అబ్రాహాము ఆ బలిపీఠాన్ని[b] కట్టి, కట్టెలను క్రమంగా అమర్చాడు. తన కుమారుడైన ఇస్సాకును బంధించి, బలిపీఠం మీద ఉన్న కట్టెలపై[c] ఉంచాడు.
