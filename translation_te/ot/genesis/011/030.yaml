review_pass:
  verdict: revise
  source_fidelity: 'The draft correctly conveys both Hebrew assertions: Sarai''s barrenness (עֲקָרָה) and her having no child (אֵין־לָהּ וָלָד). The revised wording retains the emphatic two-part formulation and renders וָלָד with the concrete singular ‘బిడ్డ’ rather than the broader collective ‘సంతానం.’'
  naturalness: ‘గొడ్రాలు’ is intelligible but is socially marked and can sound derogatory in modern standard Telugu. ‘వంధ్యురాలు’ is the more neutral, standard literary term appropriate to the concise biblical narrative register. ‘ఆమెకు బిడ్డ లేదు’ is direct and natural.
  terminology: The name ‘శారయి’ is appropriate. ‘వంధ్యురాలు’ accurately represents the feminine adjective עֲקָרָה without medicalizing it. The alternate footnote preserves the more explanatory ‘unable to bear children’ sense without altering the main text.
  issues:
  - severity: medium
    issue: The main-text term ‘గొడ్రాలు’ is socially marked and potentially derogatory in modern standard Telugu.
    rationale: Although it can denote barrenness, its contemporary connotations may distract from the narrative and are less suitable than the neutral standard term ‘వంధ్యురాలు.’
  - severity: low
    issue: The main text uses ‘సంతానం’ for singular וָלָד.
    rationale: ‘సంతానం’ can be idiomatic collectively, but ‘బిడ్డ’ more closely retains the source's concrete singular and avoids weakening the deliberate repetition of barrenness and no child.
  revised_text: శారయి వంధ్యురాలు[a]; ఆమెకు బిడ్డ లేదు.
