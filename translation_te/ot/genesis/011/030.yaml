  yaml_path: translation/ot/genesis/011/030.yaml
  text: Sarai was barren[a]; she had no child.
translation:
  language: te
  text: శారయి వంధ్యురాలు[a]; ఆమెకు బిడ్డ లేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘శారయి సంతానం కనలేని స్త్రీ; ఆమెకు బిడ్డ లేదు.’
    reason: మూలంలోని עֲקָרָהకు మరింత వివరణాత్మక ప్రత్యామ్నాయ అనువాదం; వంధ్యత్వ భావాన్ని స్పష్టపరుస్తుంది.
lexical_decisions:
- source_word: וַתְּהִי
  choice: ఉంది (తెలుగులో నామవాచక విధేయంతో అంతర్లీనంగా)
  rationale: హీబ్రూ రూపం కథనాన్ని కొనసాగిస్తూ స్థితిని తెలియజేస్తుంది. తెలుగులో ‘శారయి గొడ్రాలు’ అనే సహజ వాక్యంలో వర్తమాన/స్థితి సూచక క్రియ అంతర్లీనంగా ఉంటుంది; మూలంలో ప్రత్యేక కాలవాచకమైన ‘ఇప్పుడు’ లేనందున దాన్ని చేర్చలేదు.
- source_word: שָׂרַי
  choice: శారయి
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగులో ప్రామాణికంగా లిప్యంతరీకరించింది.
- source_word: עֲקָרָה
  choice: గొడ్రాలు
  rationale: ఈ స్త్రీలింగ విశేషణం సంతానం కనలేని స్థితిని సూచిస్తుంది. ‘గొడ్రాలు’ సంక్షిప్తంగా మూలార్థాన్ని నిలుపుతుంది; తరువాతి ‘సంతానం లేదు’ అనే వివరణతో దాని భావం స్పష్టమవుతుంది.
- source_word: אֵין לָהּ
  choice: ఆమెకు ... లేదు
  rationale: అస్తిత్వ నిరాకరణతో కూడిన సంబంధసూచక నిర్మాణాన్ని సహజమైన తెలుగు స్వామ్య నిర్మాణంగా అనువదించింది.
- source_word: וָלָד
  choice: సంతానం
  rationale: పుట్టిన బిడ్డ లేదా సంతతిని సూచించే ఈ ఏకవచన నామానికి సందర్భంలో ‘సంతానం’ సహజంగా ఉంటుంది; తెలుగు వాడుకలో ఇది సమూహార్థక ఏకవచనంగానూ పనిచేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన కథన శైలిని వాడింది. ‘గొడ్రాలు’ మూలంలోని వంధ్యత్వ భావాన్ని నేరుగా నిలుపుతుంది; పాదటిప్పణిలో తక్కువ సాంప్రదాయికమైన వివరణాత్మక ప్రత్యామ్నాయం ఇచ్చింది. ప్రధాన పాఠంలోని [a] గుర్తు పాదటిప్పణితో సరిపోతుంది.
