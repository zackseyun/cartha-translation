translation:
  language: te
  text: శెరూగు ముప్పై సంవత్సరాలు జీవించి, నాహోరుకు తండ్రి అయ్యాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: జీవించి
  rationale: חיה క్రియ యొక్క వయ్యిక్టోల్ రూపం వంశావళిలో వయస్సును తెలిపే సూత్రబద్ధ వాక్యాన్ని ప్రారంభిస్తుంది. తెలుగులో తరువాతి క్రియతో సహజంగా కలపడానికి ‘జీవించి’ అని అనువదించాం.
- source_word: שְׂרוּג
  choice: శెరూగు
  rationale: వ్యక్తి పేరును హీబ్రూ ఉచ్చారణకు దగ్గరగా, తెలుగులో సహజంగా లిప్యంతరీకరించాం.
- source_word: שְׁלֹשִׁים שָׁנָה
  choice: ముప్పై సంవత్సరాలు
  rationale: హీబ్రూలోని వయస్సు సూచించే ప్రయోగాన్ని తెలుగులో సంక్షిప్తంగా, సహజంగా అందిస్తుంది.
- source_word: וַיּוֹלֶד
  choice: తండ్రి అయ్యాడు
  rationale: ילד హిఫీల్ రూపం పురుష వంశక్రమంలో సంతాన సంబంధాన్ని సూచిస్తుంది. ‘కన్నాడు’ అనే మాట తల్లి ప్రసవాన్ని సూచించే అవకాశం ఉన్నందున, ఆధునిక తెలుగులో స్పష్టమైన ‘తండ్రి అయ్యాడు’ ఎంచుకున్నాం.
- source_word: אֶת
  choice: '[ప్రత్యేకంగా అనువదించలేదు]'
  rationale: ఇది ప్రత్యక్ష కర్మ సూచిక; తెలుగులో స్వతంత్ర పదంతో అనువదించాల్సిన అవసరం లేదు.
- source_word: נָחוֹר
  choice: నాహోరు
  rationale: వ్యక్తి పేరును హీబ్రూ రూపానికి దగ్గరగా తెలుగులో లిప్యంతరీకరించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన వంశావళి శైలి. మూలంలోని సంక్షిప్త సూత్రబద్ధ నిర్మాణాన్ని కాపాడుతూ సహజ తెలుగు వాక్యక్రమాన్ని వాడాం.
