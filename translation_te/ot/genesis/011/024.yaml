source:
  edition: WLC
  text: וַ/יְחִ֣י נָח֔וֹר תֵּ֥שַׁע וְ/עֶשְׂרִ֖ים שָׁנָ֑ה וַ/יּ֖וֹלֶד אֶת תָּֽרַח־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/024.yaml
  text: Nahor lived twenty-nine years and fathered Terah.
translation:
  language: te
  text: నాహోరు ఇరవై తొమ్మిది సంవత్సరాలు జీవించి తెరహుకు తండ్రి అయ్యాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: జీవించి
  rationale: వంశావళి సూత్రంలో חיה క్రియ ఒక నిర్దిష్ట వయస్సు వరకు జీవించడాన్ని సూచిస్తుంది; తరువాతి సమన్వయ క్రియతో సహజ తెలుగు వాక్యంగా కలిపేందుకు ‘జీవించి’ ఎంచుకున్నాం.
- source_word: נָחוֹר
  choice: నాహోరు
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగులో ప్రాచుర్యంలో ఉన్న రూపానికి అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: תֵּשַׁע וְעֶשְׂרִים שָׁנָה
  choice: ఇరవై తొమ్మిది సంవత్సరాలు
  rationale: హీబ్రూలో అక్షరార్థంగా ‘తొమ్మిది మరియు ఇరవై’ ఉన్నప్పటికీ, ఆధునిక తెలుగులో సహజమైన సంఖ్యాక్రమాన్ని వాడాం.
- source_word: וַיּוֹלֶד
  choice: కన్నాడు
  rationale: వంశావళుల్లో ילד హిఫిల్ రూపం ‘తండ్రి అయ్యాడు/కనెను’ అనే అర్థం ఇస్తుంది; పురుష కర్తకు సంబంధించి ‘కన్నాడు’ సంక్షిప్తంగా, సహజంగా వంశోత్పత్తిని తెలియజేస్తుంది.
- source_word: אֶת
  choice: '[ప్రత్యేకంగా అనువదించలేదు]'
  rationale: ఇది నిర్దిష్ట ప్రత్యక్ష కర్మ సూచిక; తెలుగులో దీనికి విడిగా పదం అవసరం లేదు.
- source_word: תָּרַח
  choice: తెరహు
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగులో ప్రాచుర్యంలో ఉన్న రూపానికి అనుగుణంగా లిప్యంతరీకరించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; వంశావళికి తగిన సంక్షిప్త, గౌరవప్రద శైలి. మూలంలోని వరుస సంఘటనలను సహజ తెలుగు సమన్వయ నిర్మాణంలో నిలిపాం.
