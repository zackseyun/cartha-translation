id: GEN.11.2
reference: Genesis 11:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַֽ/יְהִ֖י בְּ/נָסְעָ֣/ם מִ/קֶּ֑דֶם וַֽ/יִּמְצְא֥וּ בִקְעָ֛ה בְּ/אֶ֥רֶץ שִׁנְעָ֖ר וַ/יֵּ֥שְׁבוּ שָֽׁם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/002.yaml
  text: And as they journeyed from the east[a], they found a plain in the land of Shinar and settled there.
translation:
  language: te
  text: వారు తూర్పు నుండి[a] ప్రయాణిస్తూ ఉండగా, షినారు దేశంలో ఒక మైదానాన్ని కనుగొని అక్కడ స్థిరపడ్డారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘తూర్పు వైపుగా.’ מִקֶּדֶם అనే హీబ్రూ పదబంధం వారు బయలుదేరిన ప్రాంతాన్ని (‘తూర్పు నుండి’) లేదా వారు ప్రయాణించిన దిశను (‘తూర్పు వైపుగా’) సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי בְּנָסְעָם
  choice: వారు … ప్రయాణిస్తూ ఉండగా
  rationale: היה తో కూడిన ఈ నిర్మాణం తరువాతి చర్యకు కాలసంబంధ నేపథ్యాన్ని ఇస్తుంది. נסע శిబిరాన్ని ఎత్తి ముందుకు ప్రయాణించడాన్ని సూచించగలదు; ఆధునిక తెలుగులో ‘ప్రయాణిస్తూ ఉండగా’ సహజంగా ఉండి మూలార్థాన్ని కాపాడుతుంది.
- source_word: מִקֶּדֶם
  choice: తూర్పు నుండి
  rationale: מן సాధారణంగా ఆరంభస్థానాన్ని సూచిస్తుంది కాబట్టి ప్రధాన పాఠ్యంలో ‘తూర్పు నుండి’ అని అనువదించాం. అయితే ఈ పదబంధం ప్రయాణ దిశగా ‘తూర్పు వైపుగా’ అని కూడా అర్థమవగలదు; ఆ సందిగ్ధతను పాదసూచికలో నిలిపాం.
- source_word: וַיִּמְצְאוּ
  choice: కనుగొని
  rationale: מצא యొక్క సూటి అర్థం ‘కనుగొను’. తెలుగు వాక్యప్రవాహంలో తరువాతి క్రియతో కలపడానికి ‘కనుగొని’ సహజంగా ఉంది.
- source_word: בִקְעָה
  choice: ఒక మైదానాన్ని
  rationale: בִקְעָה విశాలమైన లోయ లేదా సమతల మైదానాన్ని సూచిస్తుంది. షినారు భౌగోళిక సందర్భంలో ‘మైదానం’ స్పష్టమైన, సాధారణ తెలుగు పదం.
- source_word: בְּאֶרֶץ שִׁנְעָר
  choice: షినారు దేశంలో
  rationale: אֶרֶץ కు భౌగోళిక ప్రాంతార్థంలో ‘దేశం’ సహజమైన తెలుగు సమానం; שִׁנְעָר ను స్థలనామంగా ‘షినారు’ అని లిప్యంతరీకరించాం.
- source_word: וַיֵּשְׁבוּ שָׁם
  choice: అక్కడ స్థిరపడ్డారు
  rationale: ישב నివసించడం లేదా స్థిరపడడం అనే అర్థాలను ఇస్తుంది. ప్రయాణం ముగించి ఆ ప్రాంతంలో ఉండిపోయిన సందర్భాన్ని ‘స్థిరపడ్డారు’ స్పష్టంగా తెలియజేస్తుంది.
