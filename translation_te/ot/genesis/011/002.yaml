  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. మూలంలోని భౌగోళిక సందిగ్ధతను ప్రధాన పాఠ్యం మరియు పాదసూచిక ద్వారా కాపాడాం.
