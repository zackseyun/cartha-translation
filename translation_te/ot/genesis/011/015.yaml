  text: וַֽ/יְחִי שֶׁ֗לַח אַחֲרֵי֙ הוֹלִיד֣/וֹ אֶת עֵ֔בֶר שָׁלֹ֣שׁ שָׁנִ֔ים וְ/אַרְבַּ֥ע מֵא֖וֹת שָׁנָ֑ה וַ/יּ֥וֹלֶד בָּנִ֖ים וּ/בָנֽוֹת־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/015.yaml
  text: And Shelah lived 403 years after he fathered Eber[a], and he fathered sons and daughters.
translation:
  language: te
  text: ఏబెరుకు తండ్రి అయిన తర్వాత షేలా 403 సంవత్సరాలు జీవించాడు; అతను కుమారులకూ కుమార్తెలకూ తండ్రి అయ్యాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: జీవించి
  rationale: వంశావళి సూత్రంలో חיה జీవించిన కాలాన్ని సూచిస్తుంది; తెలుగు వాక్యప్రవాహంలో తరువాతి సమాపక క్రియతో కలిపి ‘జీవించి’ సహజంగా ఉంటుంది.
- source_word: שֶׁלַח
  choice: షేలా
  rationale: హీబ్రూ పేరైన שֶׁלַח ఉచ్చారణను ఆధారంగా చేసుకున్న ఆధునిక తెలుగు లిప్యంతరీకరణ.
- source_word: אַחֲרֵי הוֹלִידוֹ אֶת עֵבֶר
  choice: ఏబెరును కన్న తర్వాత
  rationale: הוליד పురుష కర్తతో వంశావళి సందర్భంలో తండ్రిగా కనడాన్ని సూచిస్తుంది; ‘కన్న’ సాధారణ ఆధునిక తెలుగులో సంక్షిప్తంగా, సహజంగా ఉంటుంది.
- source_word: שָׁלֹשׁ שָׁנִים וְאַרְבַּע מֵאוֹת שָׁנָה
  choice: 403 సంవత్సరాలు
  rationale: హీబ్రూ సంఖ్యా పదబంధం అక్షరార్థంగా ‘మూడు సంవత్సరాలు మరియు నాలుగు వందల సంవత్సరం’ అయినా, దాని సహజ సంఖ్యార్థం 403.
- source_word: וַיּוֹלֶד בָּנִים וּבָנוֹת
  choice: కుమారులను కుమార్తెలను కన్నాడు
  rationale: మూలం కుమారులు, కుమార్తెలు అని రెండు వర్గాలనూ స్పష్టంగా పేర్కొంటుంది; సాధారణ ‘పిల్లలు’ కంటే ఈ రూపం ఆ వివరాన్ని నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన వంశావళి శైలి. మూలంలోని సంఘటనల క్రమం, 403 సంవత్సరాల వ్యవధి, కుమారులు–కుమార్తెల స్పష్టత నిలుపబడ్డాయి.
