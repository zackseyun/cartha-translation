  source_fidelity: 'ప్రధాన వచనం హెబ్రీ వంశావళి సూత్రాన్ని సరిగ్గా ప్రతిబింబిస్తుంది: అర్పక్షదు ముప్పై ఐదు సంవత్సరాలు జీవించిన తరువాత షేలహుకు తండ్రి అయ్యాడు. וַיּוֹלֶד‌కు ‘తండ్రి అయ్యాడు’ అనేది సందర్భానుకూలమైన, మూలానికి నమ్మకమైన రూపం. ప్రారంభ వావ్‌ను తెలుగులో విడిగా అనువదించకపోవడం ఈ సంక్షిప్త వంశావళి శైలిలో ఆమోదయోగ్యం.'
  naturalness: ‘అర్పక్షదు ముప్పై ఐదు సంవత్సరాలు జీవించి, షేలహుకు తండ్రి అయ్యాడు’ ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, స్పష్టంగా ఉంది. సంఖ్యాక్రమం కూడా సహజ తెలుగు వాడుకలో ఉంది.
  terminology: వ్యక్తినామాలైన ‘అర్పక్షదు,’ ‘షేలహు’ స్థిరంగా లిప్యంతరీకరించబడ్డాయి. అయితే పాదటీకలో ‘పలుకుతారు’ అనేది ఉచ్చారణ-భేదాన్ని సూచిస్తుంది; ఇచ్చిన ఆంగ్ల ఆధారం మాత్రం వేరొక సంప్రదాయ నామరూపం (‘Salah’) గురించే చెబుతోంది. కాబట్టి దానిని ‘ఇస్తారు/రాస్తారు’గా సవరించాలి.
