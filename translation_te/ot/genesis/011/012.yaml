  text: And Arpachshad lived thirty-five years and fathered Shelah[a][b][c].
translation:
  language: te
  text: అర్పక్షదు ముప్పై ఐదు సంవత్సరాలు జీవించి, షేలహుకు తండ్రి అయ్యాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని సంప్రదాయాల్లో ఈ పేరును ‘సాలహు’గా ఇస్తారు.
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/אַרְפַּכְשַׁד
  choice: అర్పక్షదు
  rationale: వంశావళి వరుసను తెలుగులో సహజంగా కొనసాగించేందుకు వావ్ సంధిని విడిగా అనువదించలేదు; హెబ్రీ వ్యక్తినామాన్ని తెలుగు ధ్వనులకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: חַי
  choice: జీవించి
  rationale: వంశావళిలో ఒక నిర్దిష్ట వయస్సువరకు జీవించడాన్ని తెలిపే హెబ్రీ ప్రయోగాన్ని సహజమైన తెలుగు క్రియారూపంతో వ్యక్తం చేస్తుంది.
- source_word: חָמֵשׁ וּ/שְׁלֹשִׁים שָׁנָה
  choice: ముప్పై ఐదు సంవత్సరాలు
  rationale: హెబ్రీలో అక్షరార్థంగా ‘ఐదు మరియు ముప్పై సంవత్సరాలు’; ఆధునిక తెలుగులో సహజ సంఖ్యాక్రమమైన ‘ముప్పై ఐదు’ను వాడాం.
- source_word: וַ/יּוֹלֶד
  choice: తండ్రి అయ్యాడు
  rationale: హిఫీల్ రూపం ఈ వంశావళి సందర్భంలో ‘ఒకరికి తండ్రి కావడం/కనడం’ అనే భావాన్ని ఇస్తుంది. ఆధునిక తెలుగులో గౌరవప్రదంగా, సహజంగా ఉండేందుకు ఈ ప్రయోగాన్ని ఎంచుకున్నాం.
- source_word: אֶת
  choice: '[విడిగా అనువదించలేదు]'
  rationale: ఇది నిర్దిష్ట ప్రత్యక్ష కర్మను సూచించే హెబ్రీ వ్యాకరణ చిహ్నం; తెలుగులో దీనికి విడి పదం అవసరం లేదు.
- source_word: שָׁלַח
  choice: షేలహు
  rationale: మసొరెటిక్ హెబ్రీ పఠనం שֶׁלַח/שָׁלַח‌కు దగ్గరగా వ్యక్తినామాన్ని లిప్యంతరీకరించాం; ఇతర సంప్రదాయాల్లోని ‘సాలహు’ రూపాన్ని పాదటీకలో సూచించాం.
theological_decisions:
- issue: וַיּוֹלֶד అనే వంశావళి క్రియ యొక్క సంబంధ విస్తృతి
  choice: తండ్రి అయ్యాడు
  alternative: కన్నాడు / జన్మనిచ్చాడు
  rationale: హెబ్రీ వంశావళుల్లో ఈ క్రియ జీవసంబంధ తండ్రితనాన్ని తెలియజేస్తుంది; అయితే ప్రతి సందర్భంలోనూ తక్షణ తరాన్ని మాత్రమే నిర్బంధంగా నిర్ధారించే అదనపు వివరణను అనువాదంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సంక్షిప్తమైన వంశావళి శైలిని కాపాడుతూ సహజమైన వాక్యనిర్మాణం వాడాం. మూలంలోని సంఖ్యాక్రమాన్ని తెలుగులో సాధారణ క్రమానికి మార్చాం. పాదటీక సూచిక ప్రధాన వచనంలో చేర్చబడింది.
