  text: ఏబెరు ముప్పై నాలుగు సంవత్సరాలు జీవించినప్పుడు, పెలెగుకు తండ్రియ్యాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: జీవించి
  rationale: వంశావళి సూత్రంలో חיה ఒక వ్యక్తి తదుపరి కుమారుణ్ని కనడానికి ముందు జీవించిన సంవత్సరాలను తెలియజేస్తుంది; తెలుగు వాక్యప్రవాహంలో ‘జీవించి’ సహజంగా తదుపరి క్రియతో అనుసంధానమవుతుంది.
- source_word: עֵבֶר
  choice: ఏబెరు
  rationale: హీబ్రూ వ్యక్తినామం עֵבֶר ను ఆధునిక ప్రామాణిక తెలుగు లిప్యంతరీకరణకు అనుగుణంగా ‘ఏబెరు’గా ఇచ్చాం.
- source_word: אַרְבַּע וּשְׁלֹשִׁים שָׁנָה
  choice: ముప్పై నాలుగు సంవత్సరాలు
  rationale: హీబ్రూలో అక్షరార్థంగా ‘నాలుగు మరియు ముప్పై’ అనే క్రమం ఉన్నా, అదే సంఖ్యను సహజమైన ఆధునిక తెలుగు సంఖ్యాక్రమంలో ఇచ్చాం.
- source_word: וַיּוֹלֶד
  choice: కన్నాడు
  rationale: వంశావళిలో పురుష కర్తతో వాడిన ילד సంతానాన్ని కనడం/కలగజేయడం అనే భావాన్ని సూచిస్తుంది. ‘కన్నాడు’ సంక్షిప్తంగా, సహజంగా ఉండి తండ్రి అయ్యాడనే అర్థాన్ని ఇస్తుంది.
- source_word: אֶת
  choice: '[ప్రత్యేకంగా అనువదించలేదు]'
  rationale: ఇది హీబ్రూ ప్రత్యక్ష కర్మ సూచిక; తెలుగులో దీనికి విడిగా పదం అవసరం లేదు.
- source_word: פָּלֶג
  choice: పెలెగు
  rationale: హీబ్రూ వ్యక్తినామం פָּלֶג ను తెలుగు ఉచ్చారణ, నామరూప సంప్రదాయానికి అనుగుణంగా లిప్యంతరీకరించాం.
