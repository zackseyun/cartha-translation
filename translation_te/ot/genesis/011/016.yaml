translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన వంశావళి శైలి. హీబ్రూ వాక్యంలోని సంఘటనల క్రమాన్ని కాపాడుతూ సహజ తెలుగు వాక్యనిర్మాణాన్ని ఉపయోగించాం.
