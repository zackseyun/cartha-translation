    rationale: హీబ్రూ సూత్రం నిర్దిష్ట సంవత్సరాలు పూర్తైన తరువాతి సంఘటనను తెలియజేస్తుంది. ‘జీవించినప్పుడు’ ఆ సంబంధాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
