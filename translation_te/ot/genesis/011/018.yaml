base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/018.yaml
  text: Peleg lived thirty years and fathered Reu.
translation:
  language: te
  text: పెలెగు ముప్పై సంవత్సరాలు జీవించిన తరువాత రెయూకు తండ్రి అయ్యాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: జీవించి
  rationale: వంశావళి సూత్రంలో חיה ఒక నిర్దిష్ట వయస్సు వరకు జీవించడాన్ని సూచిస్తుంది; తరువాతి సమాపక క్రియతో సహజంగా అనుసంధానించేందుకు ‘జీవించి’ అని అనువదించాం.
- source_word: פֶלֶג
  choice: పెలెగు
  rationale: హీబ్రూ వ్యక్తిపేరును తెలుగులో సులభంగా పలికే సంప్రదాయ రూపంలో లిప్యంతరీకరించాం.
- source_word: שְׁלֹשִׁים שָׁנָה
  choice: ముప్పై సంవత్సరాలు
  rationale: హీబ్రూలో ఇది వయస్సును సూచించే కాలవ్యవధి ప్రయోగం; ‘ముప్పై సంవత్సరాల వయస్సులో’ అని స్పష్టీకరించకుండా మూలంలోని సంక్షిప్తతను నిలిపాం.
- source_word: וַיּוֹלֶד
  choice: కన్నాడు
  rationale: వంశావళి సందర్భంలో ילד పురుషుని ద్వారా సంతానం కలగడాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘కన్నాడు’ సహజంగా, సంక్షిప్తంగా ఈ వంశసంబంధాన్ని తెలియజేస్తుంది.
- source_word: אֶת
  choice: '[ప్రత్యక్ష కర్మ సూచకం; అనువదించలేదు]'
  rationale: ఇది హీబ్రూలో నిర్దిష్ట ప్రత్యక్ష కర్మను గుర్తించే వ్యాకరణ కణం; తెలుగులో ప్రత్యేక పదం అవసరం లేదు.
- source_word: רְעוּ
  choice: రెయూ
  rationale: హీబ్రూ వ్యక్తిపేరు רְעוּ ను దాని ఉచ్చారణకు దగ్గరగా తెలుగులో లిప్యంతరీకరించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళికి తగిన సంక్షిప్తమైన మరియు గౌరవప్రదమైన శైలి. మూలంలోని వరుస క్రియల సంబంధాన్ని ‘జీవించి, ... కన్నాడు’ అనే సహజ తెలుగు నిర్మాణంతో నిలిపాం.
