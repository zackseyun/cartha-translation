- from: పెలెగు ముప్పై సంవత్సరాలు జీవించి, రెయూను కన్నాడు.
  to: పెలెగు ముప్పై సంవత్సరాలు జీవించిన తరువాత రెయూకు తండ్రి అయ్యాడు.
