  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַֽ/יְחִי עֵ֗בֶר אַחֲרֵי֙ הוֹלִיד֣/וֹ אֶת פֶּ֔לֶג שְׁלֹשִׁ֣ים שָׁנָ֔ה וְ/אַרְבַּ֥ע מֵא֖וֹת שָׁנָ֑ה וַ/יּ֥וֹלֶד בָּנִ֖ים וּ/בָנֽוֹת־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/017.yaml
  text: And Eber lived after he fathered Peleg four hundred and thirty years[a], and he fathered sons and daughters.
translation:
  language: te
  text: ఏబెరు పెలెగుకు తండ్రి అయిన తరువాత నాలుగువందల ముప్పై సంవత్సరాలు జీవించాడు; అతడు కుమారులకూ కుమార్తెలకూ తండ్రి అయ్యాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: జీవించి
  rationale: వంశావళి సూత్రంలో חיה జీవించిన కాలాన్ని సూచిస్తుంది; తెలుగు వాక్యప్రవాహంలో తరువాతి క్రియతో కలిపి ‘జీవించి’ సహజంగా ఉంటుంది.
- source_word: עֵבֶר
  choice: ఏబెరు
  rationale: హీబ్రూ వ్యక్తినామమైన עֵבֶר ను తెలుగు బైబిలు నామరూప సంప్రదాయానికి అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: אַחֲרֵי הוֹלִידוֹ אֶת־פֶּלֶג
  choice: పెలెగును కనిన తరువాత
  rationale: הוליד ఇక్కడ పురుష వంశావళిలో సంతానోత్పత్తిని సూచిస్తుంది. ‘కనిన’ సాధారణ తెలుగు బైబిలు వంశావళి శైలిలో సంక్షిప్తంగా, స్పష్టంగా ఉంటుంది.
- source_word: שְׁלֹשִׁים שָׁנָה וְאַרְבַּע מֵאוֹת שָׁנָה
  choice: నాలుగువందల ముప్పై సంవత్సరాలు
  rationale: హీబ్రూలో ‘ముప్పై సంవత్సరాలు మరియు నాలుగువందల సంవత్సరాలు’ అనే క్రమం ఉన్నా, మొత్తం కాలాన్ని ఆధునిక తెలుగులో సహజ సంఖ్యాక్రమంలో ఇచ్చాం.
- source_word: וַיּוֹלֶד
  choice: కనెను
  rationale: పునరావృతమైన ילד క్రియను వంశావళి సందర్భంలో ‘కనెను’గా అనువదించడం మూలంలోని పితృసంతాన భావాన్ని నిలుపుతుంది.
- source_word: בָּנִים וּבָנוֹת
  choice: కుమారులను కుమార్తెలను
  rationale: హీబ్రూ మగ, ఆడ సంతానాన్ని విడిగా పేర్కొంటుంది; సాధారణీకరించి ‘పిల్లలు’ అనకుండా రెండింటినీ స్పష్టంగా నిలిపాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక పాఠకులకు అర్థమయ్యేలా, అయితే ఆదికాండ వంశావళులకు తగిన గంభీరమైన సంక్షిప్త శైలిని ఉపయోగించాం. మూలంలోని సంఘటనల క్రమాన్ని నిలిపి, సంఖ్యను సహజ తెలుగు క్రమంలో ఇచ్చాం.
