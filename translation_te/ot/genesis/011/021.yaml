source:
  edition: WLC
  text: וַ/יְחִ֣י רְע֗וּ אַחֲרֵי֙ הוֹלִיד֣/וֹ אֶת שְׂר֔וּג שֶׁ֥בַע שָׁנִ֖ים וּ/מָאתַ֣יִם שָׁנָ֑ה וַ/יּ֥וֹלֶד בָּנִ֖ים וּ/בָנֽוֹת־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/021.yaml
  text: And Reu lived after he fathered Serug two hundred and seven years[a], and he fathered sons and daughters.
translation:
  language: te
  text: రెయూ సెరూగుకు తండ్రియైన తరువాత రెండువందల ఏడు సంవత్సరాలు జీవించాడు; అతడు కుమారులకూ కుమార్తెలకూ తండ్రయ్యాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: జీవించి
  rationale: వంశావళి సూత్రంలో חיה అంటే ‘జీవించు’; తరువాతి సమన్వయ క్రియతో సహజమైన తెలుగు వాక్యంగా ‘జీవించి’ అని ఇచ్చాం.
- source_word: רְעוּ
  choice: రెయూ
  rationale: హీబ్రూ వ్యక్తినామాన్ని ఆధునిక తెలుగు ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించాం.
- source_word: אַחֲרֵי הוֹלִידוֹ
  choice: కన్న తరువాత
  rationale: పురుష కర్తతో హిఫీల్ ילד సంతానానికి తండ్రి కావడాన్ని సూచిస్తుంది; తెలుగులో ‘కన్న’ అనేది వంశావళి సందర్భంలో సహజంగా, సంక్షిప్తంగా ఉంటుంది.
- source_word: אֶת שְׂרוּג
  choice: సెరూగును
  rationale: שְׂרוּג పేరును ‘సెరూగు’గా లిప్యంతరీకరించి, ప్రత్యక్ష కర్మను తెలుగు విభక్తితో తెలిపాం.
- source_word: שֶׁבַע שָׁנִים וּמָאתַיִם שָׁנָה
  choice: రెండువందల ఏడు సంవత్సరాలు
  rationale: హీబ్రూ సంఖ్యాక్రమాన్ని సహజమైన తెలుగు సంఖ్యాక్రమంలో వ్యక్తం చేశాం.
- source_word: וַיּוֹלֶד
  choice: కన్నాడు
  rationale: వంశావళిలో పురుష కర్తకు ילד యొక్క భావాన్ని ఆధునిక, సాధారణ తెలుగులో ‘కన్నాడు’గా తెలిపాం.
- source_word: בָּנִים וּבָנוֹת
  choice: కుమారులను, కుమార్తెలను
  rationale: మూలపాఠం మగ, ఆడ సంతానాన్ని విడిగా పేర్కొంటుంది; ఆ స్పష్టతను నిలిపాం.
