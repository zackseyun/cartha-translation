revisions:
- from: రెయూ సెరూగును కన్న తరువాత రెండువందల ఏడు సంవత్సరాలు జీవించి, కుమారులను, కుమార్తెలను కన్నాడు.
  to: రెయూ సెరూగుకు తండ్రియైన తరువాత రెండువందల ఏడు సంవత్సరాలు జీవించాడు; అతడు కుమారులకూ కుమార్తెలకూ తండ్రయ్యాడు.
  rationale: Replaced the two instances of ‘కన్నాడు/కన్న’ with natural modern Telugu paternal expressions. This preserves the Hebrew’s explicit male subject and its distinction between fathering Serug and fathering sons and daughters, while avoiding wording that commonly implies maternal childbirth.
