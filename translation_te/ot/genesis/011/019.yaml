  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַֽ/יְחִי פֶ֗לֶג אַחֲרֵי֙ הוֹלִיד֣/וֹ אֶת רְע֔וּ תֵּ֥שַׁע שָׁנִ֖ים וּ/מָאתַ֣יִם שָׁנָ֑ה וַ/יּ֥וֹלֶד בָּנִ֖ים וּ/בָנֽוֹת־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/019.yaml
  text: And Peleg lived two hundred and nine years after he fathered Reu, and he fathered sons and daughters.
translation:
  language: te
  text: రెయూకు తండ్రైన తరువాత పెలెగు రెండువందల తొమ్మిది సంవత్సరాలు జీవించాడు. అతడు కుమారులకూ కుమార్తెలకూ తండ్రయ్యాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: జీవించాడు
  rationale: వంశావళి సూత్రంలో חיה అనే క్రియ జీవించిన కాలవ్యవధిని సూచిస్తుంది; ఆధునిక ప్రామాణిక తెలుగులో ‘జీవించాడు’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: אַחֲרֵי
  choice: తరువాత
  rationale: రెయూ జననం అనంతర కాలాన్ని సూచించే సాధారణ కాలసంబంధ అవ్యయం.
- source_word: הוֹלִידוֹ
  choice: కన్న
  rationale: ילד హిఫీల్ రూపం వంశావళిలో తండ్రి సంతానాన్ని కనడం/కలగజేయడాన్ని సూచిస్తుంది. తెలుగులో పురుష కర్తతో ‘కన్న’ సహజంగా ఉండి పితృసంబంధ భావాన్ని నిలుపుతుంది.
- source_word: אֶת רְעוּ
  choice: రెయూను
  rationale: వ్యక్తి పేరును తెలుగు లిపిలో ధ్వన్యనుసారంగా ఇచ్చి, ప్రత్యక్ష కర్మను ‘ను’తో సూచించాం.
- source_word: תֵּשַׁע שָׁנִים וּמָאתַיִם שָׁנָה
  choice: రెండువందల తొమ్మిది సంవత్సరాలు
  rationale: హీబ్రూ సంఖ్యాక్రమాన్ని తెలుగులో సహజమైన సంఖ్యాక్రమంలో వ్యక్తం చేశాం.
- source_word: וַיּוֹלֶד
  choice: కన్నాడు
  rationale: ముందున్న ילד క్రియతో భావసామ్యాన్ని నిలుపుతూ, సంతానోత్పత్తిలో పురుష కర్తను స్పష్టంగా తెలిపే సహజ తెలుగు రూపం.
- source_word: בָּנִים וּבָנוֹת
  choice: కుమారులను, కుమార్తెలను
  rationale: మూలంలో మగ, ఆడ సంతానం రెండూ విడిగా పేర్కొనబడ్డాయి; సాధారణీకరించిన ‘పిల్లలు’ కన్నా ఈ అనువాదం ఖచ్చితమైనది.
