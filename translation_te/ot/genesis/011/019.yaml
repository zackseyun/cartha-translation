  register: ఆధునిక ప్రామాణిక తెలుగు; వంశావళికి తగిన గంభీరతను ఉంచుతూ పాతబడిన పదప్రయోగాలను నివారించాం. రెండు సమన్విత క్రియలను రెండు వాక్యాలుగా ఇచ్చి పఠనసౌలభ్యాన్ని పెంచాం.
