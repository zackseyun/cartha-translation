id: GEN.11.7
reference: Genesis 11:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: הָ֚בָ/ה נֵֽרְדָ֔ה וְ/נָבְלָ֥ה שָׁ֖ם שְׂפָתָ֑/ם אֲשֶׁר֙ לֹ֣א יִשְׁמְע֔וּ אִ֖ישׁ שְׂפַ֥ת רֵעֵֽ/הוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/007.yaml
  text: Come, let us go down there and confuse their language, so that one man will not understand the language of his neighbor.
translation:
  language: te
  text: రండి, మనం దిగిపోయి అక్కడ వారి భాషను తారుమారు చేద్దాం; అప్పుడు వారు ఒకరు మరొకరి భాషను అర్థం చేసుకోలేరు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָבָה
  choice: రండి
  rationale: సమూహాన్ని కార్యానికి ఆహ్వానించే హీబ్రూ ప్రేరణార్థక పదానికి సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: נֵרְדָה
  choice: మనం దిగిపోయి
  rationale: మొదటి పురుష బహువచన సంకల్పార్థాన్ని నిలుపుతూ, సందర్భంలోని కిందికి దిగడాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: נָבְלָה
  choice: తారుమారు చేద్దాం
  rationale: భాషా వ్యవస్థను కలగాపులగం చేసి పరస్పర అవగాహనను భంగపరచడం అనే సందర్భార్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: שְׂפָתָם
  choice: వారి భాషను
  rationale: అక్షరార్థంగా ‘వారి పెదవి’; ఇక్కడ ఉమ్మడి మాట లేదా భాషను సూచించే హీబ్రూ ప్రయోగం.
- source_word: אִישׁ שְׂפַת רֵעֵהוּ
  choice: ఒకడు తన పొరుగువాని భాషను
  rationale: హీబ్రూ ‘మనిషి—తన సహచరుని భాష’ అనే పరస్పర సంబంధ ప్రయోగాన్ని వ్యక్తిగత రూపంలో నిలుపుతుంది.
- source_word: יִשְׁמְעוּ
  choice: అర్థం చేసుకోలేడు
  rationale: మూల క్రియ ‘వినడం’ అయినప్పటికీ, భాషను వినిపించుకోలేకపోవడం కాక దానిని గ్రహించలేకపోవడమే సందర్భంలో ఉద్దేశం.
theological_decisions:
- issue: దైవీయ బహువచనం ‘మనం’
  choice: మనం
  alternative: నేను
  rationale: נֵרְדָה మరియు נָבְלָהలోని నిజమైన మొదటి పురుష బహువచనాన్ని యథాతథంగా నిలిపి, దాని వ్యాఖ్యానాన్ని పాఠ్యంలో నిర్ణయించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనదిగానూ సాధారణ పాఠకులకు సులభంగానూ ఉంది. మూలంలోని ఆహ్వానం, దైవీయ బహువచనం, ఉద్దేశ్య వాక్యం నిలుపబడ్డాయి.
