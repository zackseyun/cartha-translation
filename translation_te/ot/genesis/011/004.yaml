id: GEN.11.4
reference: Genesis 11:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּאמְר֞וּ הָ֣בָ/ה נִבְנֶה לָּ֣/נוּ עִ֗יר וּ/מִגְדָּל֙ וְ/רֹאשׁ֣/וֹ בַ/שָּׁמַ֔יִם וְ/נַֽעֲשֶׂה לָּ֖/נוּ שֵׁ֑ם פֶּן נָפ֖וּץ עַל פְּנֵ֥י כָל הָ/אָֽרֶץ׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/004.yaml
  text: And they said[a], “Come, let us build for ourselves a city and a tower with its top in the heavens, and let us make a name for ourselves[b], lest we be scattered over the face of the whole earth.”
translation:
  language: te
  text: 'వారు ఇలా అన్నారు: “రండి! మన కోసం ఒక నగరాన్ని, దాని శిఖరం ఆకాశంలో ఉండే ఒక గోపురాన్ని కట్టుకుందాం[a]. మనకంటూ ఒక పేరు తెచ్చుకుందాం; లేకపోతే భూమి అంతటా చెదరిపోతాం[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘దాని శిఖరం ఆకాశాన్ని చేరేలా ఉన్న’ అని కూడా అనువదించవచ్చు. హీబ్రూలో అక్షరార్థంగా, ‘దాని శిఖరం ఆకాశంలో’ అని ఉంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘భూమి అంతటా చెల్లాచెదరైపోతాం.’
    reason: lexical_alternative
lexical_decisions:
- source_word: הָבָה
  choice: రండి!
  rationale: కలిసి కార్యానికి పూనుకోవాలని ప్రోత్సహించే ఆహ్వానార్థక అవ్యయానికి సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: נִבְנֶה לָּנוּ
  choice: మన కోసం ... కట్టుకుందాం
  rationale: ప్రథమ పురుష బహువచన సంకల్పార్థక రూపాన్ని ‘కట్టుకుందాం’ తెలియజేస్తుంది; לָּנוּ లోని స్వప్రయోజన భావాన్ని ‘మన కోసం’ నిలుపుతుంది.
- source_word: עִיר וּמִגְדָּל
  choice: ఒక పట్టణాన్ని ... ఒక గోపురాన్ని
  rationale: రెండు పదాల ప్రాథమిక అర్థాలను అదనపు సైనిక లేదా నిర్మాణ వివరణ లేకుండా స్పష్టంగా అందిస్తుంది.
- source_word: וְרֹאשׁוֹ בַשָּׁמַיִם
  choice: దాని శిఖరం ఆకాశంలో ఉండే
  rationale: ‘దాని తల/శిఖరం ఆకాశంలో’ అనే హీబ్రూ స్థానవాచక చిత్రణను ‘ఆకాశాన్ని తాకే’ అని విస్తరించకుండా సహజ తెలుగులో నిలుపుతుంది.
- source_word: וְנַעֲשֶׂה לָּנוּ שֵׁם
  choice: మనకంటూ ఒక పేరు తెచ్చుకుందాం
  rationale: ప్రఖ్యాతి లేదా గుర్తింపు సంపాదించుకోవడం అనే నుడికార భావాన్ని సహజ తెలుగులో అందిస్తూ ‘పేరు’ అనే మూల చిత్రాన్ని కాపాడుతుంది.
- source_word: פֶּן נָפוּץ
  choice: లేకపోతే ... చెదరిపోతాం
  rationale: פֶּן సూచించే భయపడిన ప్రతికూల ఫలితాన్ని ఆధునిక తెలుగులో స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: עַל פְּנֵי כָל הָאָרֶץ
  choice: భూమి అంతటా
  rationale: ఆదికాండంలోని ఆదిమ మానవజాతి సందర్భంలో స్థానిక దేశాన్ని కాక సమస్త భూమిని సూచించే భావాన్ని సంక్షిప్తంగా అందిస్తుంది.
theological_decisions:
- issue: బాబేలు కథనంలో הָאָרֶץ పరిధి
  choice: భూమి
  alternative: దేశం
  rationale: ఆదికాండం 11లో మానవజాతి ప్రపంచమంతటా వ్యాపించడమే కథన నేపథ్యం; కాబట్టి స్థానిక ‘దేశం’ కంటే ‘భూమి’ సందర్భానికి సరిపోతుంది.
- issue: ‘పేరు చేసుకోవడం’లోని ఉద్దేశం
  choice: మనకంటూ ఒక పేరు తెచ్చుకుందాం
  alternative: మనకు కీర్తి సంపాదించుకుందాం
  rationale: ‘కీర్తి’ అని నిర్దిష్టంగా చెప్పడం కంటే హీబ్రూ ‘పేరు’ నుడికారాన్ని ఉంచడం ద్వారా దాని గుర్తింపు, ప్రఖ్యాతి, శాశ్వత స్మరణ వంటి సాధ్యమైన భావాలను అనవసరంగా కుదించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే గౌరవప్రదమైన కథన శైలి. ‘ఆకాశంలో’ అనే మూల చిత్రణను, ‘పేరు’ అనే నుడికారాన్ని నిలిపి, వాక్య నిర్మాణాన్ని సహజ తెలుగుకు అనుగుణంగా మార్చాం.
