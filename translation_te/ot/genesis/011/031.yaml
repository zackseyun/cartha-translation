  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּקַּ֨ח תֶּ֜רַח אֶת אַבְרָ֣ם בְּנ֗/וֹ וְ/אֶת ל֤וֹט בֶּן הָרָן֙ בֶּן בְּנ֔/וֹ וְ/אֵת֙ שָׂרַ֣י כַּלָּת֔/וֹ אֵ֖שֶׁת אַבְרָ֣ם בְּנ֑/וֹ וַ/יֵּצְא֨וּ אִתָּ֜/ם מֵ/א֣וּר כַּשְׂדִּ֗ים לָ/לֶ֨כֶת֙ אַ֣רְצָ/ה כְּנַ֔עַן וַ/יָּבֹ֥אוּ עַד חָרָ֖ן וַ/יֵּ֥שְׁבוּ שָֽׁם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/031.yaml
  text: Terah took Abram his son[a], Lot the son of Haran, his grandson, and Sarai his daughter-in-law, the wife of Abram his son, and they set out together from Ur of the Chaldeans to go to the land of Canaan[c][b]. But when they came as far as Haran, they settled there.
translation:
  language: te
  text: తెరహు తన కుమారుడైన అబ్రామును, తన కుమారుడైన హారాను కుమారుడూ తన మనుమడూ అయిన లోతును[a], తన కోడలు, తన కుమారుడైన అబ్రాము భార్య అయిన శారయిని వెంటబెట్టుకున్నాడు. కనాను దేశానికి వెళ్లడానికి వారు కల్దీయుల ఊరు నుండి వారితో కలిసి బయలుదేరారు[b]. వారు హారాను వరకు వచ్చి అక్కడ నివసించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “హారాను కుమారుడు, తన కుమారుని కుమారుడు”; అంటే లోతు తెరహు మనుమడు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ పాఠంలో అక్షరార్థంగా, “వారు వారితో బయలుదేరారు.” ఇక్కడ రెండు బహువచన సూచనలు ఎవరిని ఉద్దేశిస్తున్నాయో పూర్తిగా స్పష్టంగా లేదు. కొన్ని ప్రాచీన పాఠసాక్ష్యాలు ఏకవచన నిర్మాణాన్ని ప్రతిబింబిస్తాయి; భావానువాదంగా “వారందరూ కలిసి బయలుదేరారు” అని కూడా చెప్పవచ్చు.
    reason: textual_ambiguity
lexical_decisions:
- source_word: וַיִּקַּח
  choice: వెంటబెట్టుకున్నాడు
  rationale: לקח యొక్క ప్రాథమిక భావం ‘తీసుకున్నాడు’; ప్రయాణ సందర్భంలో కుటుంబ సభ్యులను తన వెంట తీసుకెళ్లడాన్ని సహజమైన ఆధునిక తెలుగులో ‘వెంటబెట్టుకున్నాడు’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: לוֹט בֶּן־הָרָן בֶּן־בְּנוֹ
  choice: తన కుమారుడైన హారాను కుమారుడు—అంటే తన మనుమడు—అయిన లోతు
  rationale: హీబ్రూ వంశసంబంధాన్ని ‘హారాను కుమారుడు’ అని నిలుపుతూ, ‘తన కుమారుని కుమారుడు’ అనే భావాన్ని సాధారణ పాఠకునికి ‘తన మనుమడు’గా స్పష్టం చేస్తుంది.
- source_word: כַּלָּתוֹ
  choice: తన కోడలు
  rationale: כלה ఇక్కడ తెరహు కుమారుని భార్యను సూచిస్తుంది; ‘కోడలు’ సహజమైన, ఖచ్చితమైన తెలుగు సమానం.
- source_word: וַיֵּצְאוּ אִתָּם
  choice: వారు వారితో కలిసి బయలుదేరారు
  rationale: మసొరేటిక్ పాఠంలో క్రియ బహువచనంలోనూ, అనుబంధ సర్వనామం కూడా ‘వారితో’ అనే బహువచనంలోనూ ఉంది. తెలుగులో కొంత అసాధారణంగా వినిపించినా మూలంలోని సూచనాస్పష్టతను చెరపకుండా నిలిపి, పాదటిప్పణిలో వివరిస్తుంది.
- source_word: מֵאוּר כַּשְׂדִּים
  choice: కల్దీయుల ఊరు నుండి
  rationale: אוּר అనే స్థలనామాన్ని తెలుగు బైబిలు వాడుకలో స్థిరపడిన ‘ఊరు’గా, כַּשְׂדִּיםను ‘కల్దీయులు’గా అందిస్తుంది.
- source_word: לָלֶכֶת אַרְצָה כְּנַעַן
  choice: కనాను దేశానికి వెళ్లడానికి
  rationale: దిశను సూచించే రూపం మరియు ఉద్దేశార్థక క్రియను సహజంగా, మూలానికి దగ్గరగా వ్యక్తం చేస్తుంది.
- source_word: וַיָּבֹאוּ עַד־חָרָן
  choice: వారు హారాను వరకు వచ్చి
  rationale: עַד యొక్క ‘వరకు’ భావాన్ని నిలుపుతుంది; కేవలం ‘హారానుకు వచ్చారు’ అని గమ్యస్థాన భావాన్ని బలపరచదు.
- source_word: וַיֵּשְׁבוּ שָׁם
  choice: అక్కడ నివసించారు
  rationale: ישב ఇక్కడ ఒక చోట ఉండిపోవడం లేదా నివాసం ఏర్పరచుకోవడం అనే భావాన్ని ఇస్తుంది; ‘నివసించారు’ తాత్కాలికతను అనవసరంగా చేర్చదు.
theological_decisions:
- issue: ప్రయాణ బృందాన్ని సూచించే ‘వారు వారితో’ అనే అసాధారణ నిర్మాణం
  choice: మసొరేటిక్ పాఠంలోని బహువచన క్రియను, బహువచన సర్వనామాన్ని రెండింటినీ పాఠ్యంలో నిలిపాం.
  alternative: ‘వారందరూ కలిసి బయలుదేరారు’ అని సాఫీగా అనువదించడం.
  rationale: మూలపాఠంలో ఎవరు ఎవరితో బయలుదేరారనే సూచన కొంత అస్పష్టంగా ఉంది. దాన్ని నిశ్శబ్దంగా పరిష్కరించకుండా పాఠ్యంలో నిలిపి పాదటిప్పణితో తెలియజేయడం పాఠ్యనిష్ఠకు అనుకూలం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే వాక్యనిర్మాణం. కుటుంబ సంబంధాలను స్పష్టంగా తెలిపి, మూలంలోని ప్రయాణ-సర్వనామ అస్పష్టతను పాదటిప్పణితో సహా ఉద్దేశపూర్వకంగా నిలిపాం.
