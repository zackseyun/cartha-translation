id: GEN.11.6
reference: Genesis 11:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוָ֗ה הֵ֣ן עַ֤ם אֶחָד֙ וְ/שָׂפָ֤ה אַחַת֙ לְ/כֻלָּ֔/ם וְ/זֶ֖ה הַחִלָּ֣/ם לַ/עֲשׂ֑וֹת וְ/עַתָּה֙ לֹֽא יִבָּצֵ֣ר מֵ/הֶ֔ם כֹּ֛ל אֲשֶׁ֥ר יָזְמ֖וּ לַֽ/עֲשֽׂוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/006.yaml
  text: And Yahweh said[a], "Behold, they are one people, and they all have one language, and this is what they have begun to do. And now nothing that they plan to do will be withheld from them."
translation:
  language: te
  text: 'యెహోవా ఇలా అన్నాడు: “ఇదిగో, వీరందరూ ఒకే ప్రజగా ఉన్నారు, వారందరికీ ఒకే భాష ఉంది. వారు చేయడం మొదలుపెట్టినది ఇదే. ఇక వారు చేయాలని పథకం వేసే ఏదీ వారికి అసాధ్యం కాదు[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారు చేయాలని పథకం వేసేది ఏదీ వారికి అందకుండా ఉండదు.”
    reason: בצר నిఫల్ రూపం ‘అసాధ్యంగా ఉండడం’ లేదా ‘నిరోధించబడడం/అందకుండా ఉండడం’ అనే రెండు భావాలకు వీలు ఇస్తుంది.
lexical_decisions:
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామంలోని నాలుగు హల్లుల పేరును సాధారణ ఆధునిక తెలుగు బైబిలు వాడుకకు అనుగుణంగా పేరుగానే ప్రతిబింబిస్తుంది; ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయదు.
- source_word: הֵן
  choice: ఇదిగో
  rationale: దైవ పరిశీలనను పరిచయం చేసే సూచనాత్మక బలాన్ని గౌరవప్రదమైన, సుపరిచితమైన తెలుగులో నిలుపుతుంది.
- source_word: עַם אֶחָד
  choice: ఒకే ప్రజ
  rationale: ఇక్కడ עַם రాజకీయ దేశం కంటే ఒక ప్రజాసమూహాన్ని సూచిస్తుంది; ‘ఒకే’ వారి ఐక్యతను స్పష్టంగా తెలుపుతుంది.
- source_word: וְשָׂפָה אַחַת לְכֻלָּם
  choice: వీరందరికీ ఒకే భాష
  rationale: שָׂפָה అక్షరార్థంగా ‘పెదవి’ అయినా ఇక్కడ భాషను సూచించే నుడికారం; לְכֻלָּם లోని సమష్టి ప్రాధాన్యాన్ని ‘వీరందరికీ’ నిలుపుతుంది.
- source_word: וְזֶה הַחִלָּם לַעֲשׂוֹת
  choice: వారు చేయడం మొదలుపెట్టినది ఇదే
  rationale: חלל హిఫిల్ రూపానికి ఉన్న ‘మొదలుపెట్టు’ అనే అర్థాన్ని నేరుగా నిలుపుతుంది; మూలంలో స్పష్టంగా లేని ‘ఇది కేవలం ఆరంభమే’ అనే భావాన్ని అదనంగా చేర్చదు.
- source_word: לֹא יִבָּצֵר מֵהֶם
  choice: ఏదీ వారికి అసాధ్యం కాదు
  rationale: בצר నిఫల్ రూపం సందర్భంలో ‘అందనిదిగా/సాధ్యం కానిదిగా ఉండడం’ అనే భావాన్ని ఇస్తుంది. ప్రధాన పాఠ్యంలో సహజమైన తెలుగు వాడి, ‘వారి నుండి నిరోధించబడదు’ అనే సాధ్యమైన అర్థాన్ని పాదటిప్పణిలో ఉంచింది.
- source_word: כֹּל אֲשֶׁר יָזְמוּ לַעֲשׂוֹת
  choice: వారు చేయాలని పథకం వేసే ఏదీ
  rationale: יזם లోని యోచించడం, పథకం వేయడం అనే ఉద్దేశపూర్వక భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ఐక్యమైన మానవుల సామర్థ్యాన్ని గురించిన వాక్యపు పరిధి
  choice: ఈ కథన సందర్భంలో వారు పథకం వేసిన కార్యం వారికి అసాధ్యం కాదనే బలమైన వాక్యాన్ని యథాతథంగా ఉంచడం
  alternative: వారు చేయాలని పథకం వేసేది వారి నుండి నిరోధించబడదు
  rationale: వాక్యం మానవులకు సంపూర్ణ సర్వశక్తి ఉందని చెప్పదు; వారి ఐక్యత, ఒకే భాష వల్ల కలిగిన సామర్థ్యాన్ని ఈ సందర్భంలో వివరిస్తుంది. అనువాదం దానిని అతిశయోక్తిగా తగ్గించదు, వారి కార్యాన్ని సమర్థించదు, దేవుని పరిమితం చేస్తున్నట్లు కూడా వివరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘ఇదిగో’ మూలంలోని గంభీర సూచనాత్మకతను నిలుపుతుంది; మిగతా వాక్యనిర్మాణం సాధారణ పాఠకులకు సులభంగా ఉండేలా ఉంచబడింది.
