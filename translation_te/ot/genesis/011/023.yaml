id: GEN.11.23
reference: Genesis 11:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְחִ֣י שְׂר֗וּג אַחֲרֵ֛י הוֹלִיד֥/וֹ אֶת נָח֖וֹר מָאתַ֣יִם שָׁנָ֑ה וַ/יּ֥וֹלֶד בָּנִ֖ים וּ/בָנֽוֹת־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/023.yaml
  text: And Serug lived two hundred years after he fathered Nahor, and he fathered sons and daughters.
translation:
  language: te
  text: నాహోరుకు తండ్రి అయిన తరువాత సెరూగు రెండు వందల సంవత్సరాలు జీవించాడు; కుమారులకూ కుమార్తెలకూ తండ్రి అయ్యాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: జీవించి
  rationale: వంశావళి సూత్రంలో חיה జీవించిన కాలాన్ని సూచిస్తుంది; తెలుగులో సహజంగా ‘జీవించి’ అని అనుసంధానించబడింది.
- source_word: שְׂרוּג
  choice: సెరూగు
  rationale: హీబ్రూ వ్యక్తినామాన్ని ఆధునిక తెలుగు ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: אַחֲרֵי
  choice: తరువాత
  rationale: తరువాతి కాలాన్ని సూచించే హీబ్రూ కాలసంబంధ అవ్యయానికి సహజమైన తెలుగు సమానం.
- source_word: הוֹלִידוֹ
  choice: కనిన
  rationale: హిఫీల్ రూపంలోని ילד వంశావళిలో పురుషుడు సంతానానికి తండ్రి కావడాన్ని సూచిస్తుంది; తెలుగు వంశావళి వాడుకలో ‘కను’ సహజంగా ఇద్దరు తల్లిదండ్రులకూ వర్తించగలదు.
- source_word: נָחוֹר
  choice: నాహోరు
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు రూపంలో లిప్యంతరీకరించాం; వాక్యంలో కర్మవిభక్తితో ‘నాహోరును’ అయింది.
- source_word: מָאתַיִם שָׁנָה
  choice: రెండు వందల సంవత్సరాలు
  rationale: హీబ్రూ సంఖ్యా నిర్మాణం సూచించే కాలవ్యవధిని సహజమైన తెలుగు బహువచన రూపంలో ఇచ్చాం.
- source_word: וַיּוֹלֶד
  choice: కన్నాడు
  rationale: వంశావళిలో తండ్రిగా సంతానాన్ని పొందడాన్ని సూచించే ילד క్రియను, పురుష కర్త స్పష్టంగా ఉండే సహజ తెలుగు రూపంతో అనువదించాం.
- source_word: בָּנִים וּבָנוֹת
  choice: కుమారులను కుమార్తెలను
  rationale: హీబ్రూ పాఠం మగ, ఆడ సంతానాన్ని విడిగా పేర్కొంటుంది; సాధారణ ‘పిల్లలు’ అని కుదించకుండా ఆ వివరాన్ని నిలిపాం.
