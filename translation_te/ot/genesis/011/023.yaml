translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళికి తగిన సంక్షిప్తమైన గంభీర శైలిని వాడాం. మూలంలోని రెండు సమాంతర క్రియలను సహజ తెలుగు వాక్యనిర్మాణంలో నిలిపాం.
