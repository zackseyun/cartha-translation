  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אֵ֨לֶּה֙ תּוֹלְדֹ֣ת תֶּ֔רַח תֶּ֚רַח הוֹלִ֣יד אֶת אַבְרָ֔ם אֶת נָח֖וֹר וְ/אֶת הָרָ֑ן וְ/הָרָ֖ן הוֹלִ֥יד אֶת לֽוֹט־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/027.yaml
  text: 'These are the generations of Terah: Terah fathered Abram, Nahor, and Haran; and Haran fathered Lot.'
translation:
  language: te
  text: 'తెరహు వంశవృత్తాంతం ఇది: తెరహు అబ్రాము, నాహోరు, హారానులకు తండ్రి అయ్యాడు; హారాను లోతుకు తండ్రి అయ్యాడు.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: ఇది
  rationale: ఈ పదబంధం కొత్త వంశవృత్తాంత విభాగాన్ని పరిచయం చేస్తుంది. తెలుగులో సహజమైన సూత్రరూప వాక్యనిర్మాణం కోసం ‘ఇది’ని వాక్యాంతంలో ఉంచాం; కాలార్థకమైన ‘ఇప్పుడు’ను చేర్చలేదు.
- source_word: תּוֹלְדֹת
  choice: వంశవృత్తాంతం
  rationale: ఆదికాండంలో పునరావృతమయ్యే ఈ నిర్మాణాత్మక పదం కేవలం సంతాన జాబితానే కాక, ఆ వంశం నుంచి కొనసాగే కథనాన్నీ సూచించగలదు. అందువల్ల ‘సంతానం’ కంటే ‘వంశవృత్తాంతం’ దాని విస్తృత భావాన్ని మెరుగ్గా నిలుపుతుంది.
- source_word: תֶּרַח
  choice: తెరహు
  rationale: వ్యక్తి పేరును తెలుగులో ప్రాచుర్యంలో ఉన్న రూపంలో లిప్యంతరీకరించాం.
- source_word: הוֹלִיד
  choice: తండ్రి అయ్యాడు
  rationale: వంశావళి సందర్భంలో హిఫిల్ రూపం ‘కన్నాడు/కనెను’ అనే భావాన్ని ఇస్తుంది. ఆధునిక పాఠకులకు సహజంగా, గౌరవప్రదంగా ఉండేందుకు ‘తండ్రి అయ్యాడు’ అని అనువదించాం; రెండు చోట్లా ఒకే విధంగా ఉంచాం.
- source_word: אַבְרָם אֶת נָחוֹר וְאֶת הָרָן
  choice: అబ్రాము, నాహోరు, హారాను
  rationale: ప్రత్యక్ష కర్మ సూచికలకు తెలుగులో ప్రత్యేక పదం అవసరం లేదు. పేర్లను ప్రాచుర్యంలో ఉన్న తెలుగు రూపాల్లో ఇచ్చి, బహువచన సంబంధం కోసం ‘లకు’ను జాబితా చివర చేర్చాం.
- source_word: לוֹט
  choice: లోతు
  rationale: వ్యక్తి పేరును తెలుగులో ప్రాచుర్యంలో ఉన్న రూపంలో లిప్యంతరీకరించాం.
