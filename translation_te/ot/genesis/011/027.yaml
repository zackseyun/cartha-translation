  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వంశవృత్తాంత శైలి వాడబడింది. మూలంలోని రెండు సమన్వయ వాక్యాలను అర్ధవిరామంతో అనుసంధానించి, అనవసరమైన వివరణను చేర్చలేదు.
