source:
  edition: WLC
  text: וַֽ/יְהִ֥י כָל הָ/אָ֖רֶץ שָׂפָ֣ה אֶחָ֑ת וּ/דְבָרִ֖ים אֲחָדִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/001.yaml
  text: The whole earth had one language and the same words[a].
translation:
  language: te
  text: భూమి అంతటికీ ఒకే భాషా, ఒకే మాటలూ ఉండేవి[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఒకే విధమైన మాటలు”; లేదా “ఒకే మాటతీరు.” హెబ్రీలో అక్షరార్థంగా “మరియు మాటలు, ఒకేవి” అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: ఉండేవి
  rationale: ఈ రూపం కథన నేపథ్యంలోని స్థితిని పరిచయం చేస్తుంది. సందర్భానికి తగిన సహజమైన ఆధునిక తెలుగులో గతకాల స్థితిని ‘ఉండేవి’ తెలియజేస్తుంది; మూలంలో లేని ‘ఇప్పుడు’ వంటి కాలసూచక పదాన్ని చేర్చదు.
- source_word: כָל הָאָרֶץ
  choice: భూమి అంతటికీ
  rationale: אָרֶץ అనే పదానికి ‘భూమి’ లేదా ‘దేశం’ అనే అర్థాలు ఉండగలవు. బాబెలు సందర్భంలో మానవ సమాజమంతటినీ సూచించే విస్తృత భావం సరిపోతుంది; כָל యొక్క సమగ్రతను ‘అంతటికీ’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: שָׂפָה אֶחָת
  choice: ఒకే భాష
  rationale: שָׂפָה అక్షరార్థంగా ‘పెదవి’ అయినా, ఈ ప్రయోగంలో భాష లేదా మాటను సూచిస్తుంది. ‘ఒకే భాష’ అర్థాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తూ אֶחָת సూచించే ఏకత్వాన్ని నిలుపుతుంది.
- source_word: וּדְבָרִים אֲחָדִים
  choice: ఒకే మాటలు
  rationale: דְּבָרִים సాధారణంగా ‘మాటలు’ లేదా ‘విషయాలు’ అని అర్థమిస్తుంది. ‘ఒకే మాటలు’ మూలపదానికి దగ్గరగా ఉండి, אֲחָדִים లోని ఏకరూపతను నిలుపుతుంది; దాని భావపరిధిని పాదసూచికలో చూపించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. ‘భూమి అంతటికీ ... ఉండేవి’ అనే నిర్మాణం తెలుగు సహజత్వాన్ని కాపాడుతూ హెబ్రీ వాక్యంలోని స్థితిని తెలియజేస్తుంది.
