translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన వంశావళి శైలి. పాతకాలపు ‘కనెను/జన్మింపజేసెను’ వంటి రూపాల బదులు సహజమైన ‘తండ్రి అయ్యాడు’ ఉపయోగించబడింది.
