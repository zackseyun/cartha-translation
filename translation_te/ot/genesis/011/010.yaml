  text: אֵ֚לֶּה תּוֹלְדֹ֣ת שֵׁ֔ם שֵׁ֚ם בֶּן מְאַ֣ת שָׁנָ֔ה וַ/יּ֖וֹלֶד אֶת אַרְפַּכְשָׁ֑ד שְׁנָתַ֖יִם אַחַ֥ר הַ/מַּבּֽוּל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/010.yaml
  text: These are the generations of Shem. Shem was one hundred years old[a], and he fathered Arpachshad two years after the flood.
translation:
  language: te
  text: 'షేము వంశావళి ఇది: షేము నూరేళ్లవాడై, జలప్రళయం తర్వాత రెండేళ్లకు అర్పక్షదుకు[a] తండ్రి అయ్యాడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని అనువాదాల్లో ఈ పేరు గ్రీకు రూపాన్ని అనుసరించి ‘అర్ఫక్సదు’ అని ఉంటుంది; ‘అర్పక్షదు’ హీబ్రూ రూపాన్ని అనుసరిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה תּוֹלְדֹת שֵׁם
  choice: షేము వంశావళి ఇది
  rationale: ఆదికాండంలోని వంశపరంపర విభాగాన్ని పరిచయం చేసే స్థిర సూత్రాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; షేము నుండి కొనసాగిన వంశరేఖ అనే భావాన్ని నిలుపుతుంది.
- source_word: שֵׁם בֶּן מְאַת שָׁנָה
  choice: షేము నూరేళ్లవాడై
  rationale: ‘నూరు సంవత్సరాల కుమారుడు’ అనే హీబ్రూ వయస్సు నుడికారాన్ని సహజమైన తెలుగు వయస్సు ప్రయోగంతో అందిస్తుంది.
- source_word: וַיּוֹלֶד
  choice: తండ్రి అయ్యాడు
  rationale: ילד అనే క్రియ యొక్క హిఫీల్ రూపం వంశావళిలో పురుషుడు సంతానాన్ని కనడం లేదా జన్మింపజేయడాన్ని సూచిస్తుంది. ‘తండ్రి అయ్యాడు’ ఆధునిక పాఠకులకు సహజంగా ఉండి పురుష వంశ సంబంధాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: אַרְפַּכְשָׁד
  choice: అర్పక్షదు
  rationale: గ్రీకు రూపాన్ని కాకుండా హీబ్రూ పేరుకు దగ్గరగా ఉన్న తెలుగు లిప్యంతరీకరణను ఉపయోగించింది.
- source_word: שְׁנָתַיִם אַחַר הַמַּבּוּל
  choice: జలప్రళయం తర్వాత రెండేళ్లకు
  rationale: ద్వివచనమైన ‘రెండు సంవత్సరాలు’ అనే కాలవ్యవధిని, నిర్దిష్టమైన నోవహు జలప్రళయానికి అనంతర కాలంగా సహజ తెలుగులో వ్యక్తం చేస్తుంది.
