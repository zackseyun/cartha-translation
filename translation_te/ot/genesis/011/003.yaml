translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. హీబ్రూ వాక్యంలోని పదార్థాల ప్రత్యామ్నాయ వినియోగాన్ని ‘రాయిగా’, ‘గారగా ఉపయోగపడ్డాయి’ అని సహజంగా వ్యక్తపరిచాం.
