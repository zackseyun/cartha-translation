source:
  edition: WLC
  text: וַ/יֹּאמְר֞וּ אִ֣ישׁ אֶל רֵעֵ֗/הוּ הָ֚בָ/ה נִלְבְּנָ֣ה לְבֵנִ֔ים וְ/נִשְׂרְפָ֖ה לִ/שְׂרֵפָ֑ה וַ/תְּהִ֨י לָ/הֶ֤ם הַ/לְּבֵנָה֙ לְ/אָ֔בֶן וְ/הַ֣/חֵמָ֔ר הָיָ֥ה לָ/הֶ֖ם לַ/חֹֽמֶר־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/003.yaml
  text: And each man said to his neighbor[a], “Come, let us make bricks and burn them thoroughly.” And the brick served them for stone[b], and the bitumen served them for mortar.
translation:
  language: te
  text: వారు ఒకరితో ఒకరు, “రండి, మనం ఇటుకలు తయారుచేసి వాటిని బాగా కాల్చుదాం” అని అన్నారు. ఇటుకలు వారికి రాళ్లుగా, తారు[a] వారికి గారగా ఉపయోగపడ్డాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ ‘తారు’ అనేది నిర్మాణంలో ఉపయోగించే సహజ బిటుమెన్ లేదా డాంబరు వంటి పదార్థాన్ని సూచిస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: אִישׁ אֶל רֵעֵהוּ
  choice: ఒకరితో ఒకరు
  rationale: హీబ్రూ ప్రయోగంలోని పరస్పర భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; సందర్భంలో సమూహంలోని వ్యక్తులు ఒకరితో మరొకరు మాట్లాడుకున్నారనే అర్థాన్ని నిలుపుతుంది.
- source_word: הָבָה
  choice: రండి
  rationale: కలిసి ఒక పని చేయాలని ప్రోత్సహించే ఆహ్వానార్థక అవ్యయానికి సహజమైన తెలుగు రూపం.
- source_word: נִלְבְּנָה לְבֵנִים
  choice: మనం ఇటుకలు తయారుచేసి
  rationale: ఇటుకలు చేయడం అనే denominative క్రియార్థాన్ని స్పష్టంగా, సహజంగా అందిస్తుంది.
- source_word: וְנִשְׂרְפָה לִשְׂרֵפָה
  choice: వాటిని బాగా కాల్చుదాం
  rationale: సజాతి పదపునరుక్తి కలిగించే తీవ్రతను ‘బాగా’ ద్వారా తెలిపి, ఇటుకలను కాల్చే ప్రక్రియను స్పష్టంచేస్తుంది.
- source_word: וַתְּהִי לָהֶם הַלְּבֵנָה לְאָבֶן
  choice: ఇటుక వారికి రాయిగా ... ఉపయోగపడ్డాయి
  rationale: ఇటుక రాయిగా మారిందని కాక, రాయికి బదులుగా నిర్మాణ సామగ్రిగా పనిచేసిందనే היה + ל ప్రయోగంలోని ప్రత్యామ్నాయ కార్యాన్ని తెలియజేస్తుంది.
- source_word: הַחֵמָר
  choice: తారు
  rationale: ఈ నిర్మాణ సందర్భంలో సహజంగా లభించే బిటుమెన్ లేదా డాంబరు వంటి అంటుకునే పదార్థాన్ని సాధారణ పాఠకులకు అర్థమయ్యే పదంతో సూచిస్తుంది.
- source_word: לַחֹמֶר
  choice: గారగా
  rationale: ఇటుకలను బంధించే నిర్మాణ పదార్థం అనే సందర్భార్థాన్ని ‘గార’ సహజంగా తెలియజేస్తుంది.
