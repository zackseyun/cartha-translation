  text: וַ/יָּ֣מָת הָרָ֔ן עַל פְּנֵ֖י תֶּ֣רַח אָבִ֑י/ו בְּ/אֶ֥רֶץ מוֹלַדְתּ֖/וֹ בְּ/א֥וּר כַּשְׂדִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/028.yaml
  text: And Haran died in the presence of Terah his father[a], in the land of his birth, in Ur of the Chaldeans.
translation:
  language: te
  text: హారాను తన తండ్రి తెరహు ఎదుట, తాను పుట్టిన దేశంలో, అనగా కల్దీయుల ఊరులో చనిపోయాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘తన తండ్రి తెరహుకు ముందే,’ అంటే తన తండ్రి ఇంకా జీవించి ఉండగానే. హెబ్రీ నుడికారం అక్షరార్థంగా ‘ముఖం మీద’ అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: చనిపోయాడు
  rationale: מות క్రియ యొక్క వయిక్టోల్ రూపం గతంలో జరిగిన సంఘటనను నేరుగా వర్ణిస్తుంది; ఆధునిక తెలుగు కథనంలో ‘చనిపోయాడు’ సహజమైన సమానం.
- source_word: עַל־פְּנֵי
  choice: సమక్షంలోనే
  rationale: ఈ హెబ్రీ నుడికారం అక్షరార్థంగా ‘ముఖం మీద/ఎదుట’ అని ఉంటుంది; ఇక్కడ తండ్రి ఎదుట లేదా తండ్రి ఇంకా జీవించి ఉండగానే హారాను చనిపోయాడనే భావసాధ్యతను కాపాడుతుంది.
- source_word: תֶּרַח אָבִיו
  choice: తన తండ్రి తెరహు
  rationale: సర్వనామ ప్రత్యయంతో కూడిన నిర్మాణం తెరహును హారాను తండ్రిగా గుర్తిస్తుంది; తెలుగు సహజ పదక్రమాన్ని అనుసరించాం.
- source_word: בְּאֶרֶץ מוֹלַדְתּוֹ
  choice: తాను పుట్టిన దేశమైన
  rationale: מוֹלֶדֶת జన్మస్థలం లేదా స్వదేశాన్ని సూచిస్తుంది; ‘తాను పుట్టిన దేశం’ సాధారణ పాఠకులకు స్పష్టంగా ఉంటుంది.
- source_word: בְּאוּר כַּשְׂדִּים
  choice: కల్దీయుల ఊరులో
  rationale: אוּר స్థలనామమైన ‘ఊరు’; כַּשְׂדִּים జాతినామమైన ‘కల్దీయులు’. తెలుగు విభక్తితో స్థల సూచనను సహజంగా వ్యక్తం చేశాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. ‘సమక్షంలోనే’ ద్వారా మూలంలోని స్థలార్థం/కాలార్థం మధ్య ఉన్న సందిగ్ధతను ప్రధాన పాఠ్యంలో కొంతవరకు నిలిపి, ప్రత్యామ్నాయ కాలార్థాన్ని పాదటిప్పణిలో ఇచ్చాం.
