  text: The days of Terah were two hundred and five years, and Terah died in Haran.
translation:
  language: te
  text: తెరహు జీవించిన కాలం రెండువందల ఐదు సంవత్సరాలు. తెరహు హారానులో చనిపోయాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ יְמֵי תֶרַח
  choice: తెరహు జీవించిన కాలం
  rationale: ‘తెరహు దినాలు’ అనే హీబ్రూ పదబంధం అతని మొత్తం జీవితకాలాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో అర్థం సహజంగా, స్పష్టంగా ఉండేందుకు ‘జీవించిన కాలం’ అని అనువదించాం.
- source_word: חָמֵשׁ שָׁנִים וּמָאתַיִם שָׁנָה
  choice: రెండువందల ఐదు సంవత్సరాలు
  rationale: హీబ్రూలోని సంఖ్యా క్రమాన్ని తెలుగులో సహజమైన సంఖ్యా క్రమంలో అందించాం; మొత్తం 205 సంవత్సరాలు.
- source_word: תֶרַח
  choice: తెరహు
  rationale: వ్యక్తి పేరును తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: וַיָּמָת
  choice: చనిపోయాడు
  rationale: మూత్ అనే క్రియకు నేరమైన అర్థం ‘చనిపోవడం’; మూలంలో లేని సభ్యోక్తిని చేర్చకుండా సాధారణ ఆధునిక తెలుగు రూపాన్ని వాడాం.
- source_word: בְּחָרָן
  choice: హారానులో
  rationale: בְּ ఉపసర్గ ఇక్కడ మరణం సంభవించిన ప్రదేశాన్ని సూచిస్తుంది; అందువల్ల ‘హారానులో’ అని అనువదించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే, గంభీరమైన వచనం. హీబ్రూ జీవితకాల సూత్రాన్ని పదశః కాకుండా స్పష్టమైన తెలుగు నుడికారంలో అందించింది; మరణాన్ని తెలిపే మాటను సభ్యోక్తిగా మార్చలేదు.
