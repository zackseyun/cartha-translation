translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళికి తగిన సంక్షిప్తమైన గౌరవప్రద శైలి. మూలంలోని రెండు జనకత్వ క్రియల భావాన్ని నిలిపి, తెలుగు వాక్యప్రవాహం సహజంగా ఉండేలా అసమాపక–సమాపక నిర్మాణం ఉపయోగించబడింది.
