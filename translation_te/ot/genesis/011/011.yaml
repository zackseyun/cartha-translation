id: GEN.11.11
reference: Genesis 11:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַֽ/יְחִי שֵׁ֗ם אַֽחֲרֵי֙ הוֹלִיד֣/וֹ אֶת אַרְפַּכְשָׁ֔ד חֲמֵ֥שׁ מֵא֖וֹת שָׁנָ֑ה וַ/יּ֥וֹלֶד בָּנִ֖ים וּ/בָנֽוֹת־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/011.yaml
  text: And Shem lived five hundred years after he fathered Arpachshad, and he fathered sons and daughters.
translation:
  language: te
  text: అర్పక్షదుకు తండ్రియైన తరువాత షేము ఐదువందల సంవత్సరాలు జీవించాడు; కుమారులకూ కుమార్తెలకూ తండ్రియయ్యాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: జీవించి
  rationale: వంశావళి సందర్భంలో חיה అనే క్రియ పేర్కొన్న కాలంపాటు జీవించడాన్ని సూచిస్తుంది; తెలుగు వాక్యనిర్మాణంలో తదుపరి క్రియతో సహజంగా కలిసేలా అసమాపక రూపం వాడబడింది.
- source_word: שֵׁם
  choice: షేము
  rationale: హీబ్రూ వ్యక్తినామాన్ని ఆధునిక తెలుగు లిపిలో మూల ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించాం.
- source_word: אַחֲרֵי
  choice: తరువాత
  rationale: అర్పక్షదు జననం తరువాతి కాలాన్ని సూచించే కాలసంబంధ అవ్యయం.
- source_word: הוֹלִידוֹ
  choice: కనిన
  rationale: యָלַד హిఫిల్ రూపం వంశావళిలో పురుషుడు సంతానానికి తండ్రి కావడాన్ని సూచిస్తుంది; 'కనిన' తెలుగు బైబిలు వంశావళి శైలిలో సహజంగా ఉండి జనకత్వాన్ని తెలియజేస్తుంది.
- source_word: אַרְפַּכְשָׁד
  choice: అర్పక్షదు
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు ధ్వని, విభక్తి ప్రయోగాలకు అనువుగా లిప్యంతరీకరించాం.
- source_word: חֲמֵשׁ מֵאוֹת שָׁנָה
  choice: ఐదువందల సంవత్సరాలు
  rationale: కాలవ్యవధిని తెలిపే హీబ్రూ సంఖ్యావాచక పదబంధానికి నేరమైన, సహజమైన తెలుగు రూపం.
- source_word: וַיּוֹלֶד
  choice: కన్నాడు
  rationale: మొదటి יָלַד క్రియతో భావసామ్యాన్ని నిలుపుతూ, కుమారులు కుమార్తెలకు తండ్రి అయ్యాడనే జనకార్థాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בָּנִים וּבָנוֹת
  choice: కుమారులను కుమార్తెలను
  rationale: హీబ్రూ మూలం మగ, ఆడ సంతానాన్ని విడిగా పేర్కొంటుంది; సాధారణమైన 'పిల్లలు' అన్న పదం కంటే ఈ రూపం మూలంలోని స్పష్టతను కాపాడుతుంది.
