translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వంశావళి శైలి. మూలంలోని రెండు ילד క్రియారూపాలకు తెలుగు సందర్భానుసారంగా ‘కనిన’, ‘కన్నాడు’ వాడి భావసామ్యాన్ని నిలిపింది; అనవసర పురాతన పదజాలాన్ని నివారించింది.
