  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְחִ֣י נָח֗וֹר אַחֲרֵי֙ הוֹלִיד֣/וֹ אֶת תֶּ֔רַח תְּשַֽׁע עֶשְׂרֵ֥ה שָׁנָ֖ה וּ/מְאַ֣ת שָׁנָ֑ה וַ/יּ֥וֹלֶד בָּנִ֖ים וּ/בָנֽוֹת־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/025.yaml
  text: Nahor lived one hundred nineteen years after he fathered Terah, and he fathered sons and daughters.
translation:
  language: te
  text: నాహోరు తెరహుకు తండ్రి అయిన తరువాత నూట పంతొమ్మిది సంవత్సరాలు జీవించాడు; అతడు కుమారులకూ కుమార్తెలకూ తండ్రి అయ్యాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: జీవించి
  rationale: వంశావళి సూత్రంలో חיה ఒక వ్యక్తి ఇంకా ఎంతకాలం జీవించాడో సూచిస్తుంది; తెలుగు వాక్య నిర్మాణంలో తరువాతి క్రియతో సహజంగా కలపడానికి ‘జీవించి’ అనువైనది.
- source_word: אַחֲרֵי הוֹלִידוֹ
  choice: కనిన తరువాత
  rationale: ఈ నిర్మాణం పేరుపొందిన కుమారుడు జన్మించిన తరువాతి కాలాన్ని సూచిస్తుంది. ‘కనిన’ అనేది ילד హిఫిల్ రూపంలోని తండ్రిగా సంతానాన్ని పొందిన భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: תֶּרַח
  choice: తెరహు
  rationale: హీబ్రూ వ్యక్తినామాన్ని ఆధునిక ప్రామాణిక తెలుగు బైబిలు శైలికి తగిన విధంగా లిప్యంతరీకరించింది.
- source_word: תְּשַׁע עֶשְׂרֵה שָׁנָה וּמְאַת שָׁנָה
  choice: నూట పంతొమ్మిది సంవత్సరాలు
  rationale: హీబ్రూలో 19 + 100 క్రమంలో ఉన్న సంఖ్యను సహజ తెలుగు సంఖ్యాక్రమంలో ‘నూట పంతొమ్మిది’గా ఇచ్చింది.
- source_word: וַיּוֹלֶד
  choice: కన్నాడు
  rationale: వంశావళి సందర్భంలో ילד హిఫిల్ రూపం అతడు సంతానానికి తండ్రి అయ్యాడని సూచిస్తుంది; ‘కన్నాడు’ సంక్షిప్తంగా, సాధారణ ఆధునిక తెలుగులో సహజంగా ఉంటుంది.
- source_word: בָּנִים וּבָנוֹת
  choice: కుమారులను కుమార్తెలను
  rationale: హీబ్రూ పాఠం మగ, ఆడ సంతానాన్ని విడిగా పేర్కొంటుంది; సాధారణీకరించిన ‘పిల్లలు’ కంటే ఈ రూపం మూలపాఠపు నిర్దిష్టతను కాపాడుతుంది.
