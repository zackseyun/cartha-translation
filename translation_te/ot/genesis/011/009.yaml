id: GEN.11.9
reference: Genesis 11:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: עַל כֵּ֞ן קָרָ֤א שְׁמָ/הּ֙ בָּבֶ֔ל כִּי שָׁ֛ם בָּלַ֥ל יְהוָ֖ה שְׂפַ֣ת כָּל הָ/אָ֑רֶץ וּ/מִ/שָּׁם֙ הֱפִיצָ֣/ם יְהוָ֔ה עַל פְּנֵ֖י כָּל הָ/אָֽרֶץ־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/009.yaml
  text: Therefore its name was called Babel[a], because there Yahweh confused the language of all the earth, and from there Yahweh scattered them over the face of all the earth.
translation:
  language: te
  text: కాబట్టి దానికి బాబెలు[a] అని పేరు పెట్టారు; ఎందుకంటే అక్కడ యాహ్వే భూమంతటి భాషను గందరగోళపరిచాడు. అక్కడి నుండి యాహ్వే వారిని భూమి అంతటా చెదరగొట్టాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “బాబెలు” అనే పేరు, “కలగలిపాడు” లేదా “గందరగోళపరిచాడు” అనే అర్థమిచ్చే హీబ్రూ క్రియ బలల్‌తో శబ్దసామ్యం కలిగి ఉంది; ఈ వచనం ఆ పేరును ఆ శబ్దక్రీడ ద్వారా వివరిస్తుంది.
    reason: హీబ్రూ మూలంలోని బాబెలు–బలల్ శబ్దక్రీడను తెలుగులో ప్రధాన వాక్యంలో పూర్తిగా పునరుత్పత్తి చేయలేము.
lexical_decisions:
- source_word: עַל כֵּן
  choice: కాబట్టి
  rationale: పేరుకు కారణాన్ని తెలిపే హీబ్రూ అన్వయపదబంధంలోని తార్కిక ఫలిత భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: קָרָא שְׁמָהּ
  choice: దానికి ... అని పేరు పెట్టారు
  rationale: హీబ్రూలో క్రియ ఏకవచనంగా ఉన్నా కర్త స్పష్టంగా చెప్పబడలేదు. తెలుగులో అనిర్దిష్ట కర్తను సహజంగా తెలిపే ఈ ప్రయోగం, దేవుడే పేరు పెట్టాడని పాఠంలో లేని నిర్ణయాన్ని చేర్చదు.
- source_word: בָּבֶל
  choice: బాబెలు
  rationale: స్థలనామాన్ని తెలుగు బైబిలు పఠనానికి సుపరిచితమైన రూపంలో లిప్యంతరీకరించింది; בָּלַל తోనున్న శబ్దక్రీడను పాదసూచిక వివరిస్తుంది.
- source_word: כִּי שָׁם
  choice: ఎందుకంటే అక్కడ
  rationale: పేరు పెట్టడానికి గల కారణాన్ని స్పష్టంగా, సహజంగా పరిచయం చేస్తుంది.
- source_word: בָּלַל
  choice: కలగలిపాడు
  rationale: ఈ సందర్భంలో భాషను కలిపి గందరగోళపరచడం అనే భావాన్ని వ్యక్తం చేస్తుంది; బాబెలు–బలల్ శబ్దసంబంధాన్ని పాదసూచికలో నిలుపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా లిప్యంతరీకరిస్తుంది.
- source_word: שְׂפַת כָּל הָאָרֶץ
  choice: భూమంతటి భాషను
  rationale: שׂפה అనే ‘పెదవి’ పదం ఇక్కడ భాష/మాట అనే నానుడి భావంలో ఉంది. ‘భూమంతటి’ సమస్తత్వాన్ని సంక్షిప్తంగా తెలుపుతుంది.
- source_word: וּמִשָּׁם
  choice: అక్కడి నుంచే
  rationale: ఇప్పుడే పేర్కొన్న స్థలాన్ని తిరిగి సూచిస్తూ, -שָּׁם లోని స్థల సంబంధాన్ని మరియు తెలుగు ఉద్ఘాటనను సహజంగా అందిస్తుంది.
- source_word: הֱפִיצָם
  choice: వారిని ... చెదరగొట్టాడు
  rationale: హిఫిల్ రూపంలోని కారణార్థాన్ని, ప్రజలను భౌగోళికంగా విస్తరింపజేసిన చర్యగా స్పష్టంగా తెలుపుతుంది.
- source_word: עַל פְּנֵי כָּל הָאָרֶץ
  choice: భూమి అంతటా
  rationale: ‘భూమి ముఖమంతటిపై’ అనే హీబ్రూ నానుడి ఉద్దేశాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది; కృత్రిమమైన అక్షరానువాదాన్ని నివారిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది. ‘యాహ్వే’ దానిని బిరుదుగా మార్చకుండా, సాధారణంగా అంగీకరించబడిన లిప్యంతరీకరణకు దగ్గరగా నిలుపుతుంది.
- issue: పేరు పెట్టిన కర్త ఎవరు?
  choice: అనిర్దిష్ట కర్తతో ‘పేరు పెట్టారు’
  alternative: ‘అతడు దానికి పేరు పెట్టాడు’ లేదా ‘యాహ్వే దానికి పేరు పెట్టాడు’
  rationale: קָרָא రూపం ఏకవచనమైనప్పటికీ కర్త వచనంలో పేర్కొనబడలేదు. యాహ్వేనే కర్త అని స్పష్టీకరించడం మూలంలోని అస్పష్టతను తొలగిస్తుంది; అందువల్ల తెలుగులో సహజమైన అనిర్దిష్ట నిర్మాణం వాడబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే శైలి. హీబ్రూ నానుడులను భావస్పష్టతతో అందిస్తూ, దైవనామం మరియు పేరులోని శబ్దక్రీడ వంటి మూలపాఠ లక్షణాలను నిలుపుకుంది.
