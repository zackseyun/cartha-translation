  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని వాడాం. చివరి వంశసంబంధ వాక్యభాగంలో హారాను మిల్కా, ఇస్కా ఇద్దరికీ తండ్రి అనే మూలపాఠ్య నిర్మాణాన్ని స్పష్టంగా నిలిపాం.
