id: GEN.11.29
reference: Genesis 11:29
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּקַּ֨ח אַבְרָ֧ם וְ/נָח֛וֹר לָ/הֶ֖ם נָשִׁ֑ים שֵׁ֤ם אֵֽשֶׁת אַבְרָם֙ שָׂרָ֔י וְ/שֵׁ֤ם אֵֽשֶׁת נָחוֹר֙ מִלְכָּ֔ה בַּת הָרָ֥ן אֲבִֽי מִלְכָּ֖ה וַֽ/אֲבִ֥י יִסְכָּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/029.yaml
  text: Abram and Nahor took wives for themselves. The name of Abram’s wife was Sarai[a], and the name of Nahor’s wife was Milcah, the daughter of Haran, the father of Milcah and of Iscah.
translation:
  language: te
  text: అబ్రాము, నాహోరు తమకు భార్యలను తీసుకున్నారు.[a] అబ్రాము భార్య పేరు శారయి; నాహోరు భార్య పేరు మిల్కా. మిల్కా హారాను కుమార్తె; హారాను మిల్కాకు, ఇస్కాకు తండ్రి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, మరింత సహజంగా, “అబ్రాము, నాహోరు వివాహం చేసుకున్నారు.” అక్షరార్థంగా, “తమకు భార్యలను తీసుకున్నారు.”
    reason: హీబ్రూ లָהֶם (“తమకు/తమ కొరకు”)తో కూడిన לָקַח (“తీసుకొను”) వివాహ ప్రయోగాన్ని ప్రధాన పాఠ్యంలో నిలిపి, సహజ తెలుగు ప్రత్యామ్నాయాన్ని సూచించడానికి.
lexical_decisions:
- source_word: וַיִּקַּח
  choice: చేసుకున్నారు
  rationale: לקח అనే క్రియకు మౌలిక అర్థం ‘తీసుకొను’; అయితే భార్యను స్వీకరించే సందర్భంలో తెలుగు వివాహ ప్రయోగమైన ‘భార్యలను చేసుకున్నారు’ సహజంగా అర్థాన్ని అందిస్తుంది. అక్షరార్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: לָהֶם
  choice: తమకోసం
  rationale: వ్యక్తిగత ప్రయోజనాన్ని లేదా ప్రతిఫలార్థాన్ని సూచించే ఈ రూపాన్ని ‘తమకోసం’గా అనువదించడం, ఇద్దరూ తమ తమ భార్యలను స్వీకరించారనే భావాన్ని నిలుపుతుంది.
- source_word: נָשִׁים
  choice: భార్యలను
  rationale: ఈ నామవాచకానికి ‘స్త్రీలు’ అనే అర్థం కూడా ఉన్నా, לקחతో కూడిన వివాహ సందర్భం ‘భార్యలు’ అనే అర్థాన్ని కోరుతుంది.
- source_word: שֵׁם
  choice: పేరు
  rationale: హీబ్రూ వాక్యంలో రెండుసార్లు కనిపించే ‘పేరు’ నిర్మాణాన్ని తెలుగులోనూ స్పష్టంగా నిలిపాం.
- source_word: אֵשֶׁת
  choice: భార్య
  rationale: భర్త పేరుతో నిర్మిత సంబంధంలో ఈ పదం స్పష్టంగా ‘భార్య’ను సూచిస్తుంది.
- source_word: שָׂרָי
  choice: శారయి
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు ధ్వన్యనుసారంగా లిప్యంతరీకరించాం.
- source_word: מִלְכָּה
  choice: మిల్కా
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు ధ్వన్యనుసారంగా లిప్యంతరీకరించాం.
- source_word: בַּת
  choice: కుమార్తె
  rationale: సాధారణ సంతాన సంబంధ పదాన్ని నేరుగా అనువదించాం.
- source_word: הָרָן
  choice: హారాను
  rationale: వ్యక్తినామాన్ని తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించాం; విభక్తి కోసం ‘హారాను’ రూపం వాడాం.
- source_word: אֲבִי
  choice: తండ్రియైన
  rationale: ఇక్కడ אב యొక్క సాధారణ, సమీప వంశసంబంధ అర్థమైన ‘తండ్రి’నే సందర్భం సమర్థిస్తుంది.
- source_word: יִסְכָּה
  choice: ఇస్కా
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు ధ్వన్యనుసారంగా లిప్యంతరీకరించాం.
