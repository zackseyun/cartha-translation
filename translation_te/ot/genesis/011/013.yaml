  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַֽ/יְחִ֣י אַרְפַּכְשַׁ֗ד אַֽחֲרֵי֙ הוֹלִיד֣/וֹ אֶת שֶׁ֔לַח שָׁלֹ֣שׁ שָׁנִ֔ים וְ/אַרְבַּ֥ע מֵא֖וֹת שָׁנָ֑ה וַ/יּ֥וֹלֶד בָּנִ֖ים וּ/בָנֽוֹת־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/013.yaml
  text: Arpachshad lived 403 years after he fathered Shelah[a], and he fathered sons and daughters.
translation:
  language: te
  text: అర్పక్షదు షెలహుకు తండ్రి అయిన తరువాత 403 సంవత్సరాలు జీవించాడు; కుమారులనూ కుమార్తెలనూ కన్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: జీవించి
  rationale: వంశావళి సూత్రంలో חיה ఒక వ్యక్తి ఆ తరువాత కొనసాగించి జీవించిన కాలాన్ని సూచిస్తుంది; తెలుగులో ‘జీవించి’ సహజంగా అదే భావాన్ని ఇస్తుంది.
- source_word: אַרְפַּכְשַׁד
  choice: అర్పక్షదు
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు ధ్వన్యనుకరణ సంప్రదాయానికి అనుగుణంగా అందించింది.
- source_word: אַחֲרֵי הוֹלִידוֹ אֶת שֶׁלַח
  choice: షెలహుకు తండ్రి అయిన తరువాత
  rationale: హిఫిల్ రూపంలోని పురుష-జనక భావాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా నిలుపుతుంది.
- source_word: שָׁלֹשׁ שָׁנִים וְאַרְבַּע מֵאוֹת שָׁנָה
  choice: 403 సంవత్సరాలు
  rationale: హీబ్రూలోని ‘మూడు మరియు నాలుగు వందలు’ అనే సంఖ్యాక్రమాన్ని తెలుగు వాడుకకు అనుగుణంగా మార్చి, ఖచ్చితమైన మొత్తాన్ని అంకెలలో ఇచ్చింది.
- source_word: וַיּוֹלֶד
  choice: కన్నాడు
  rationale: పురుష కర్తతో వంశావళి సందర్భంలో సంతానోత్పత్తిని సూచించే సహజమైన తెలుగు క్రియ.
- source_word: בָּנִים וּבָנוֹת
  choice: కుమారులను కుమార్తెలను
  rationale: మూలంలోని మగ, ఆడ సంతానం రెండింటి స్పష్ట ప్రస్తావనను నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన వంశావళి శైలి. మూలంలోని కాలసంబంధం, సంఖ్య, కుమారులు-కుమార్తెలు అనే వివరాలు యథాతథంగా నిలుపబడ్డాయి.
