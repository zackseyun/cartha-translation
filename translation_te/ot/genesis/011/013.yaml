  terminology: The names “అర్పక్షదు” and “షెలహు” appropriately reflect the supplied Hebrew-oriented naming convention. “కుమారులనూ కుమార్తెలనూ కన్నాడు” retains the explicit sons/daughters distinction and the male subject’s act of fathering in idiomatic Telugu.
