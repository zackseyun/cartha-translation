  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/שֶׁ֥לַח חַ֖י שְׁלֹשִׁ֣ים שָׁנָ֑ה וַ/יּ֖וֹלֶד אֶת עֵֽבֶר־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/014.yaml
  text: Shelah lived thirty years and fathered Eber[a][b].
translation:
  language: te
  text: షెలహు[a] ముప్పై సంవత్సరాలు జీవించి, ఏబెరుకు[b] తండ్రి అయ్యాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘షెలహు’కు బదులుగా ‘సాలహు’ అని కూడా ఉంటుంది; ఇక్కడి హీబ్రూ పాఠంలో ‘షెలహు’ అని ఉంది.
    reason: lexical_alternative
  - marker: b
    text: ‘ఏబెరు’కు బదులుగా ‘హెబెరు’ అని కూడా ఉంటుంది; ‘ఏబెరు’ హీబ్రూ పేరును మరింత నేరుగా ప్రతిబింబిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/שֶׁלַח
  choice: షెలహు
  rationale: హీబ్రూ שֶׁלַח పేరును నేరుగా ప్రతిబింబించే తెలుగు లిప్యంతరీకరణ; వాక్యారంభంలోని וְ ఈ వంశావళి వరుసను కొనసాగిస్తుంది, తెలుగులో ప్రత్యేకంగా అనువదించాల్సిన అవసరం లేదు.
- source_word: חַי
  choice: జీవించి
  rationale: వంశావళి సూత్రంలో వ్యక్తి తదుపరి సంఘటన వరకు జీవించిన కాలాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: שְׁלֹשִׁים שָׁנָה
  choice: ముప్పై సంవత్సరాలు
  rationale: హీబ్రూ కాలవ్యవధి/వయస్సు వ్యక్తీకరణను సంక్షిప్తంగా, సహజంగా అందిస్తుంది.
- source_word: וַ/יּוֹלֶד
  choice: తండ్రి అయ్యాడు
  rationale: ילד హిఫీల్ రూపం వంశావళుల్లో ‘కనెను/తండ్రి అయ్యాడు’ అనే భావాన్ని ఇస్తుంది. ‘తండ్రి అయ్యాడు’ ఆధునిక తెలుగులో సహజంగా ఉండి పురుష వంశావళి దృక్కోణాన్ని నిలుపుతుంది.
- source_word: אֶת
  choice: '[ప్రత్యేకంగా అనువదించలేదు]'
  rationale: ఇది ప్రత్యక్ష కర్మ సూచకం; తెలుగులో దీనికి స్వతంత్ర పదం అవసరం లేదు.
- source_word: עֵבֶר
  choice: ఏబెరు
  rationale: హీబ్రూ עֵבֶר పేరును నేరుగా ప్రతిబింబించే తెలుగు లిప్యంతరీకరణ.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; వంశావళికి తగిన సంక్షిప్తత, గౌరవప్రదమైన శైలి పాటించబడ్డాయి. సంప్రదాయమైన కానీ నేటి వాడుకలో కాస్త ప్రాచీనంగా వినిపించే ‘కనెను’కు బదులుగా సహజమైన ‘తండ్రి అయ్యాడు’ వాడబడింది.
