  yaml_path: translation/ot/genesis/011/005.yaml
  text: Then Yahweh came down to see the city and the tower that the sons of man had built[a].
translation:
  language: te
  text: అప్పుడు మనుష్యులు కట్టిన పట్టణాన్నీ గోపురాన్నీ చూడడానికి యెహోవా దిగివచ్చాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “మనిషి కుమారులు”; ఈ హీబ్రూ పదబంధం ఇక్కడ మానవులను సమష్టిగా సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: దిగివచ్చాడు
  rationale: ירד అనే క్రియలోని ‘దిగడం’ అనే స్పష్టమైన కదలికను సహజమైన తెలుగు కథనశైలిలో నిలుపుతుంది; మానవరూప వర్ణనను మృదువుచేయదు.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో అందిస్తుంది.
- source_word: לִרְאֹת
  choice: చూడడానికి
  rationale: ראה యొక్క సాధారణ అర్థమైన ‘చూడడం’ను నేరుగా నిలుపుతుంది; ‘పరిశీలించడానికి’ అని భావాన్ని అధికంగా నిర్దిష్టం చేయదు.
- source_word: הָעִיר
  choice: పట్టణాన్ని
  rationale: עִירకు సహజమైన ఆధునిక తెలుగు సమానార్థకం.
- source_word: הַמִּגְדָּל
  choice: గోపురాన్ని
  rationale: מִגְדָּלకు సందర్భానుకూలమైన సాధారణ తెలుగు పదం.
- source_word: בָּנוּ
  choice: కట్టిన
  rationale: సాపేక్ష ఉపవాక్యంలో పూర్తయిన లేదా అప్పటివరకు జరిగిన నిర్మాణాన్ని సహజంగా సూచిస్తుంది; హీబ్రూ వాక్య నిర్మాణానికి అనవసరమైన కాలభేదాన్ని జోడించదు.
- source_word: בְּנֵי הָאָדָם
  choice: మనుష్యులు
  rationale: హీబ్రూ నుడికారంలోని సమష్టి మానవార్థాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; అక్షరార్థ రూపం పాదటీపులో నిలుపబడింది.
theological_decisions:
- issue: యెహోవా దిగివచ్చాడనే మానవరూప వర్ణన
  choice: ‘దిగివచ్చాడు’ అనే స్పష్టమైన కదలికను యథాతథంగా నిలుపడం
  alternative: ‘కిందికి చూశాడు’ లేదా ‘దృష్టి సారించాడు’
  rationale: హీబ్రూ పాఠం దేవుని చర్యను మానవరూప కథన భాషలో వర్ణిస్తుంది. దానిని అమూర్తీకరించకుండా సాహిత్యపరమైన ఉద్వేగాన్ని కాపాడుతుంది.
- issue: בְּנֵי הָאָדָם యొక్క అనువాదం
  choice: ప్రధాన పాఠంలో ‘మనుష్యులు’
  alternative: ‘ఆదాము కుమారులు’ లేదా ‘మనుష్యకుమారులు’
  rationale: ఈ హీబ్రూ పదబంధం రూపంలో పుంలింగమైనప్పటికీ, ఇక్కడ మానవులను సమష్టిగా సూచించే నుడికారం. సహజమైన తెలుగు ప్రధాన పాఠంలో సమష్టి భావాన్ని ఇచ్చి, అక్షరార్థ రూపాన్ని పాదటీపులో పేర్కొనడం అర్థం మరియు మూలరూపం రెండింటినీ కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. ‘దిగివచ్చాడు’ ద్వారా మూలంలోని మానవరూప వర్ణన నిలుపబడింది. ‘మనుష్యులు’ ద్వారా హీబ్రూ నుడికారపు సమష్టి భావం స్పష్టమవుతుంది; అక్షరార్థ రూపం పాదటీపులో ఉంది.
