source:
  edition: WLC
  text: וַֽ/יְחִי תֶ֖רַח שִׁבְעִ֣ים שָׁנָ֑ה וַ/יּ֨וֹלֶד֙ אֶת אַבְרָ֔ם אֶת נָח֖וֹר וְ/אֶת הָרָֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/026.yaml
  text: Terah lived seventy years and fathered Abram[a], Nahor, and Haran.
translation:
  language: te
  text: తెరహు డెబ్బై సంవత్సరాలు జీవించి, అబ్రాముకు[a], నాహోరుకు, హారానుకు తండ్రి అయ్యాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరానుసారంగా, ‘అబ్రాము, నాహోరు, హారానులకు తండ్రి అయ్యాడు.’ హెబ్రీ వంశావళి క్రియ, కుమారులు ఇక్కడ ఇచ్చిన క్రమంలోనే పుట్టారని తప్పనిసరిగా సూచించదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחִי
  choice: జీవించి
  rationale: חיה క్రియ యొక్క వయ్యిక్టోల్ రూపం ఇక్కడ వంశావళి సందర్భంలో తెరహు పేర్కొన్న వయస్సుకు చేరినట్లు సూచిస్తుంది. ‘జీవించి’ సహజమైన తెలుగులో కాలసంబంధ భావాన్ని నిలుపుతుంది.
- source_word: שִׁבְעִים שָׁנָה
  choice: డెబ్బై సంవత్సరాలు
  rationale: హెబ్రీ వాక్యం అక్షరార్థంగా ‘డెబ్బై సంవత్సరాలు’ అంటుంది. తెలుగులో ‘డెబ్బై సంవత్సరాలు జీవించి’ అన్న నిర్మాణం వయస్సుకు చేరడాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וַיּוֹלֶד
  choice: తండ్రి అయ్యాడు
  rationale: ילד అనే క్రియ వంశావళుల్లో ప్రసవక్రియకన్నా ‘తండ్రి కావడం’ అనే అర్థాన్ని ఇస్తుంది. ‘తండ్రి అయ్యాడు’ ఆధునిక, గౌరవప్రదమైన తెలుగు; అయితే పేర్ల క్రమమే జననక్రమమని ఇది నిర్దేశించదు.
- source_word: אֶת ... אֶת ... וְאֶת
  choice: అబ్రాము, నాహోరు, హారానులకు
  rationale: పునరుక్త కర్మసూచక అవ్యయం ప్రతి పేరును విడివిడిగా గుర్తిస్తుంది. తెలుగులో జాబితాను కామాలతో ఇచ్చి, దత్తివిభక్తిని చివర సహజంగా అనుసంధానించడం అర్థాన్ని నిలుపుతుంది.
- source_word: אַבְרָם
  choice: అబ్రాము
  rationale: వ్యక్తినామాన్ని ప్రామాణిక తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: נָחוֹר
  choice: నాహోరు
  rationale: వ్యక్తినామాన్ని తెలుగులో సుపరిచితమైన రూపంలో లిప్యంతరీకరించాం.
- source_word: הָרָן
  choice: హారాను
  rationale: వ్యక్తినామాన్ని తెలుగులో సుపరిచితమైన రూపంలో లిప్యంతరీకరించాం; హెబ్రీ రూపంలోని ఆరంభ ה ఇక్కడ ప్రత్యేక నిర్దిష్ట ఉపపదంగా అనువదించబడదు.
theological_decisions:
- issue: వంశావళిలో పేర్ల క్రమం మరియు డెబ్బై ఏళ్ల వయస్సు సూచన
  choice: తెరహు డెబ్బై సంవత్సరాలు జీవించినప్పుడు అబ్రాము, నాహోరు, హారానులకు తండ్రి అయ్యాడని సూటిగా అనువదించాం; పేర్ల జాబితా జననక్రమాన్ని నిర్దేశించదు.
  alternative: తెరహు డెబ్బై ఏళ్ల వయస్సులో కుమారులను కనడం ప్రారంభించాడని, లేదా ముగ్గురూ ఒకేసారి పుట్టారని, లేదా జాబితా ఖచ్చితమైన జననక్రమాన్ని చూపుతుందని స్పష్టీకరించడం.
  rationale: హెబ్రీ వచనం ముగ్గురు కుమారులను పేర్కొంటుంది గాని, వారు ఒకేసారి పుట్టారా లేదా పేర్ల క్రమమే జననక్రమమా అన్నది తేల్చదు. తరువాతి వచనాలతో వచ్చే కాలక్రమ సంబంధ ప్రశ్నలను అనువాదంలో ముందుగానే పరిష్కరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన వంశావళి శైలి. ‘కన్నాడు’ అనే ప్రసవకేంద్రీకృత లేదా అపార్థసాధ్య రూపానికి బదులు ‘తండ్రి అయ్యాడు’ వాడాం. ప్రధాన పాఠంలోని [a] గుర్తు పాదటిప్పణితో సరిపోలుతుంది.
