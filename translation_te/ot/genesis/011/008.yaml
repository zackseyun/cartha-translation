id: GEN.11.8
reference: Genesis 11:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּ֨פֶץ יְהוָ֥ה אֹתָ֛/ם מִ/שָּׁ֖ם עַל פְּנֵ֣י כָל הָ/אָ֑רֶץ וַֽ/יַּחְדְּל֖וּ לִ/בְנֹ֥ת הָ/עִֽיר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/008.yaml
  text: So Yahweh scattered them from there over the face of all the earth[a], and they stopped building the city.
translation:
  language: te
  text: కాబట్టి యాహ్వే వారిని అక్కడి నుండి భూమి అంతటా[a] చెదరగొట్టాడు; వారు ఆ పట్టణాన్ని కట్టడం మానేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘భూమి నిండా.’ హీబ్రూలో అక్షరార్థంగా, ‘భూమి అంతటి ముఖం మీద.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּפֶץ
  choice: చెదరగొట్టాడు
  rationale: פוץ అనే క్రియ ఇక్కడ ప్రజలను వివిధ ప్రాంతాలకు చెదరగొట్టడాన్ని సూచిస్తుంది. తీర్పు సందర్భంలోని కారణార్థక భావాన్ని ఈ రూపం సహజంగా వ్యక్తపరుస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో దాని సాధారణ లిప్యంతరీకరణను ఉంచాం.
- source_word: מִשָּׁם
  choice: అక్కడి నుండి
  rationale: బాబెలులోని ఆ స్థలాన్ని వెనుకకు సూచించే సరళమైన స్థానవాచక ప్రయోగం.
- source_word: עַל־פְּנֵי כָל־הָאָרֶץ
  choice: భూమి అంతటా
  rationale: అక్షరార్థంగా ‘భూమి అంతటి ముఖం మీద’ అనే హీబ్రూ నుడికారం. ఆధునిక తెలుగులో సహజంగా ఉండేందుకు దాని విస్తృత వ్యాప్తి భావాన్ని ‘భూమి అంతటా’గా తెలిపాం; అక్షరార్థ చిత్రణను పాదసూచికలో ఉంచాం.
- source_word: וַיַּחְדְּלוּ
  choice: మానేశారు
  rationale: חדל క్రియకు ఆపివేయడం లేదా మానేయడం అనే భావం ఉంది. నిర్మాణ కార్యం కొనసాగించకపోవడాన్ని ‘మానేశారు’ సహజంగా తెలియజేస్తుంది.
- source_word: לִבְנֹת
  choice: కట్టడం
  rationale: హీబ్రూలోని infinitive construct భావాన్ని ‘మానేశారు’తో సహజంగా కలిసే తెలుగు క్రియానామ రూపంలో ఇచ్చాం.
- source_word: הָעִיר
  choice: ఆ పట్టణాన్ని
  rationale: సమీప సందర్భంలో వారు కడుతున్న నిర్దిష్ట పట్టణాన్ని సూచిస్తుంది. తెలుగు సందర్భసూచనకు ‘ఆ’ సహజంగా ఉంటుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా
  rationale: మూలపాఠంలో దైవనామం నేరుగా ఉంది. దానిని ‘ప్రభువు’ వంటి బిరుదుతో మార్చకుండా వ్యక్తిగత నామంగా లిప్యంతరీకరించాం; ప్రత్యామ్నాయ ఉచ్చారణను ప్రధాన పాఠంలోకి తేల్చి చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గంభీరమైన కథన శైలి. హీబ్రూ వాక్యక్రమాన్ని యాంత్రికంగా అనుసరించకుండా భావసంబంధాన్ని సహజంగా ఉంచాం; ‘కాబట్టి’ ముందరి చర్యకు ఫలితాన్ని సూచిస్తుంది.
