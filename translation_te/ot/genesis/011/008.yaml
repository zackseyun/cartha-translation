  naturalness: ‘యాహ్వే వారిని అక్కడి నుండి భూమి అంతటా చెదరగొట్టాడు; వారు ఆ పట్టణాన్ని కట్టడం మానేశారు’ ఆధునిక ప్రామాణిక తెలుగులో స్పష్టంగా, సహజంగా ఉంది. కథనానికి తగిన గంభీరత కూడా ఉంది.
