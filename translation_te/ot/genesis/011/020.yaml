translation:
  language: te
  text: రెయూ ముప్పై రెండు సంవత్సరాలు జీవించి సెరూగుకు తండ్రి అయ్యాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: జీవించిన తరువాత
  rationale: వంశావళి సూత్రంలో తెలిపిన వయస్సు వచ్చేవరకు జీవించాడనే భావాన్ని తదుపరి క్రియతో సహజమైన తెలుగులో అనుసంధానిస్తుంది.
- source_word: רְעוּ
  choice: రెయూ
  rationale: హీబ్రూ వ్యక్తినామాన్ని ఆధునిక తెలుగు ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించింది.
- source_word: שְׁתַּיִם וּשְׁלֹשִׁים שָׁנָה
  choice: ముప్పై రెండు సంవత్సరాలు
  rationale: హీబ్రూలోని ‘రెండు మరియు ముప్పై’ అనే సంఖ్యాక్రమాన్ని సహజ తెలుగు క్రమంలో ఉంచి, ఖచ్చితమైన సంఖ్యను నిలిపింది.
- source_word: וַיּוֹלֶד
  choice: కన్నాడు
  rationale: వంశావళిలో పురుష కర్తతో ילד హిఫీల్ రూపం ‘సంతానాన్ని పొందాడు/కన్నాడు’ అనే జననార్థాన్ని ఇస్తుంది; ‘కన్నాడు’ సంక్షిప్తంగా, సాధారణ తెలుగులో సహజంగా ఉంది.
- source_word: אֶת
  choice: '[ప్రత్యేకంగా అనువదించలేదు]'
  rationale: ఇది హీబ్రూ ప్రత్యక్ష కర్మ సూచకం; తెలుగులో ప్రత్యేక పదం అవసరం లేదు.
- source_word: שְׂרוּג
  choice: సెరూగు
  rationale: హీబ్రూ వ్యక్తినామాన్ని ఆధునిక తెలుగు ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన వంశావళి శైలి. మూలంలోని సంఘటనల క్రమాన్ని ‘జీవించిన తరువాత’తో స్పష్టంగా, సహజంగా తెలిపింది.
