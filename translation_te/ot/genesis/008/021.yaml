id: GEN.8.21
reference: Genesis 8:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּ֣רַח יְהוָה֮ אֶת רֵ֣יחַ הַ/נִּיחֹחַ֒ וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל לִבּ֗/וֹ לֹֽא אֹ֠סִף לְ/קַלֵּ֨ל ע֤וֹד אֶת הָֽ/אֲדָמָה֙ בַּ/עֲב֣וּר הָֽ/אָדָ֔ם כִּ֠י יֵ֣צֶר לֵ֧ב הָ/אָדָ֛ם רַ֖ע מִ/נְּעֻרָ֑י/ו וְ/לֹֽא אֹסִ֥ף ע֛וֹד לְ/הַכּ֥וֹת אֶת כָּל חַ֖י כַּֽ/אֲשֶׁ֥ר עָשִֽׂיתִי־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/021.yaml
  text: And the LORD smelled the pleasing aroma, and the LORD said to himself, “I will never again curse the ground because of man, for the intention of man’s heart is evil from his youth. And I will never again strike down every living thing as I have done.”
translation:
  language: te
  text: 'యెహోవా ఆ ఇంపైన సువాసనను ఆఘ్రాణించాడు. అప్పుడు యెహోవా తనలో తాను ఇలా అనుకున్నాడు: “మనిషిని బట్టి నేలను ఇక ఎన్నడూ శపించను. ఎందుకంటే మనిషి హృదయపు తలంపు అతని బాల్యం నుంచే చెడ్డది. నేను చేసినట్లు జీవులన్నిటినీ ఇక ఎన్నడూ హతమార్చను.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רֵיחַ הַנִּיחֹחַ
  choice: ఇంపైన సువాసన
  rationale: ‘శాంతింపజేసే/సంతోషపరచే వాసన’ అనే హీబ్రూ బలిసంబంధ పదబంధాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; దేవుడు వాసనను నిజంగా ఆఘ్రాణించాడనే వాక్యరూపాన్ని నిలుపుతుంది.
- source_word: אֶל־לִבּוֹ
  choice: తనలో తాను
  rationale: అక్షరార్థంగా ‘తన హృదయానికి’; సందర్భంలో అంతరంగంగా అనుకోవడం అనే భావాన్ని సహజ తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: בַּעֲבוּר הָאָדָם
  choice: మనిషిని బట్టి
  rationale: ‘మనిషి కారణంగా/నిమిత్తంగా’ అనే కారణార్థాన్ని నిలుపుతూ, הָאָדָם యొక్క సామూహిక మానవార్థాన్ని ‘మనిషి’గా ఉంచుతుంది.
- source_word: יֵצֶר לֵב הָאָדָם
  choice: మనిషి హృదయపు తలంపు
  rationale: יֵצֶר లోని రూపకల్పన, మొగ్గు, ఉద్దేశం అనే అర్థవ్యాప్తిని పూర్తిగా ఒక వైపుకు కుదించకుండా ‘తలంపు’తో ప్రతిబింబిస్తుంది.
- source_word: מִנְּעֻרָיו
  choice: అతని బాల్యం నుంచే
  rationale: యౌవనారంభం లేదా చిన్ననాటి దశను సూచించే పదాన్ని సాధారణ పాఠకులకు స్పష్టంగా అందిస్తుంది; పుట్టుక నుంచే అని అతిశయింపదు.
- source_word: לְהַכּוֹת אֶת־כָּל־חַי
  choice: జీవులన్నిటినీ హతమార్చను
  rationale: ‘కొట్టు’ అనే మూల క్రియకు ఈ ప్రళయ సందర్భంలో ఉన్న ప్రాణహరణ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: దేవుని అంతరంగ వాక్యాన్ని ఎలా వ్యక్తపరచాలి
  choice: తనలో తాను ఇలా అనుకున్నాడు
  alternative: తన హృదయంలో ఇలా అన్నాడు
  rationale: మానవాకార భాషను పూర్తిగా తొలగించకుండా, తెలుగు సహజ ప్రయోగంలో అంతరంగ నిర్ణయాన్ని తెలియజేస్తుంది.
- issue: మనిషి హృదయ స్థితి
  choice: మనిషి హృదయపు తలంపు అతని బాల్యం నుంచే చెడ్డది
  alternative: మనిషి హృదయ స్వభావం పుట్టుక నుంచే చెడ్డది
  rationale: మూలంలోని יֵצֶר మరియు מִנְּעֻרָיו కంటే బలమైన వారసపాపం లేదా పుట్టుకనాటి స్థితి అనే నిర్దిష్ట సిద్ధాంతాన్ని అనువాదంలోకి దిగుమతి చేయదు.
- issue: మళ్లీ శపించననే ప్రకటన పరిధి
  choice: నేలను ఇక ఎన్నడూ శపించను
  alternative: మనిషి కారణంగా నేలను మళ్లీ శపించను
  rationale: మూలంలోని పునరావృత నిరాకరణను బలంగా ఉంచుతుంది; ఈ వాక్యాన్ని ఇతర శాపాలన్నిటి రద్దుగా విస్తరించకుండా ‘నేలను’ అనే ప్రత్యక్ష కర్మను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్య నిర్మాణం. దైవనామాన్ని ‘యెహోవా’గా లిప్యంతరీకరించాం. మూలంలోని రెండు సమాంతర ‘ఇక ఎన్నడూ’ ప్రకటనలను నిలిపాం.
