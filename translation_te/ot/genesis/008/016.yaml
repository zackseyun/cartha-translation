source:
  edition: WLC
  text: צֵ֖א מִן הַ/תֵּבָ֑ה אַתָּ֕ה וְ/אִשְׁתְּ/ךָ֛ וּ/בָנֶ֥י/ךָ וּ/נְשֵֽׁי בָנֶ֖י/ךָ אִתָּֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/016.yaml
  text: Come out of the ark[a], you and your wife, and your sons and your sons' wives with you.
translation:
  language: te
  text: “నీవు, నీ భార్య, నీ కుమారులు, నీ కుమారుల భార్యలు నీతో కలిసి ఓడలోనుంచి బయటికి రా.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: צֵא
  choice: బయటికి రండి
  rationale: ఇది పురుష ఏకవచన ఆజ్ఞారూపమైనా, తెలుగులో దేవుడు నోవహుతో గౌరవప్రదంగా మాట్లాడే సహజ శైలికి ‘రండి’ సరిపోతుంది; తరువాత పేర్కొన్న కుటుంబ సభ్యులందరూ కలిసి బయటికి రావాలనే భావమూ సందర్భంలో స్పష్టమవుతుంది.
- source_word: מִן הַתֵּבָה
  choice: ఓడలోనుంచి
  rationale: מן బయటకు కదలికను సూచిస్తుంది. תֵּבָהకు ఈ సందర్భంలో సహజమైన, సామాన్య పాఠకులకు అర్థమయ్యే తెలుగు పదం ‘ఓడ’; ‘లోనుంచి’ మూలంలోని నిష్క్రమణ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: אַתָּה
  choice: నువ్వూ
  rationale: స్వతంత్ర సర్వనామం నోవహును కుటుంబ సభ్యుల జాబితాలో స్పష్టంగా చేర్చుతుంది. ‘నువ్వూ’ ఆ సమన్వయ భావాన్ని సహజ తెలుగులో నిలుపుతుంది.
- source_word: וְאִשְׁתְּךָ
  choice: నీ భార్యా
  rationale: స్వామ్య సందర్భంలో אִשָּׁה స్పష్టంగా ‘భార్య’ అనే అర్థాన్నిస్తుంది.
- source_word: וּבָנֶיךָ
  choice: నీ కుమారులూ
  rationale: בָּנִים ఇక్కడ కుమారులను ప్రత్యేకంగా సూచిస్తుంది; వారి భార్యల ప్రస్తావనతో ఈ అర్థం మరింత నిర్ధారితమవుతుంది.
- source_word: וּנְשֵׁי בָנֶיךָ
  choice: నీ కుమారుల భార్యలూ
  rationale: మూలంలోని ‘నీ కుమారుల భార్యలు’ అనే సంబంధాన్ని నేరుగా, సహజంగా నిలుపుతుంది; ‘కోడళ్లు’ కూడా సాధ్యమే కాని అది మూల నిర్మాణాన్ని కొంత సంక్షిప్తం చేస్తుంది.
- source_word: אִתָּךְ
  choice: నీతో పాటు
  rationale: తోడుగా రావడాన్ని సూచించే accompaniment భావాన్ని సహజ తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
