translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ప్రత్యక్ష ఆజ్ఞగా అనువదించబడింది. మూలంలో ఆజ్ఞ నోవహును ఉద్దేశించిన పురుష ఏకవచన రూపంలో ఉంది; తెలుగులో ‘రండి’ గౌరవ ఏకవచనంగా పనిచేస్తూనే, వెంట వచ్చే కుటుంబ జాబితాతో సమూహ నిష్క్రమణను సహజంగా తెలియజేస్తుంది. అనవసరమైన పాదటిప్పణి జోడించలేదు; ఆంగ్ల పాదటిప్పణిలోని ప్రత్యామ్నాయం తెలుగులో ప్రధాన పాఠ్యంతో భిన్నమైన అర్థాన్ని ఇవ్వదు.
