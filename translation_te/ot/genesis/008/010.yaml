source:
  edition: WLC
  text: וַ/יָּ֣חֶל ע֔וֹד שִׁבְעַ֥ת יָמִ֖ים אֲחֵרִ֑ים וַ/יֹּ֛סֶף שַׁלַּ֥ח אֶת הַ/יּוֹנָ֖ה מִן הַ/תֵּבָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/010.yaml
  text: Then he waited another seven days[a], and again sent out the dove from the ark.
translation:
  language: te
  text: తర్వాత అతడు మరో ఏడు రోజులు వేచి ఉండి[a], ఓడలోనుండి పావురాన్ని మళ్లీ బయటికి పంపాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మరో ఏడు రోజుల నిరీక్షణను మొదలుపెట్టి”; హీబ్రూ క్రియకు మరింత అక్షరార్థంగా “మొదలుపెట్టాడు” అనే భావం రావచ్చు, అయితే ఈ సందర్భంలో అది “వేచి ఉన్నాడు” అనే నుడికార భావంలో వాడబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּחֶל
  choice: వేచి ఉండి
  rationale: కాలవ్యవధిని సూచించే పదబంధంతో వచ్చిన ఈ క్రియ సందర్భానుసారంగా ‘వేచి ఉండడం’ అనే నుడికార భావాన్ని ఇస్తుంది; ‘మొదలుపెట్టాడు’ అనే మరింత అక్షరార్థాన్ని పాదసూచికలో నిలుపుకున్నాం.
- source_word: עוֹד שִׁבְעַת יָמִים אֲחֵרִים
  choice: మరో ఏడు రోజులు
  rationale: עוֹד మరియు אֲחֵרִים రెండూ ముందటి కాలానికి అదనంగా ఉన్న ఏడు రోజుల వ్యవధిని సూచిస్తున్నాయి; ఆధునిక తెలుగులో ‘మరో ఏడు రోజులు’ సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: וַיֹּסֶף שַׁלַּח
  choice: మళ్లీ బయటికి పంపాడు
  rationale: יסף తో కూడిన క్రియారూపం ఇక్కడ అదే చర్యను మరొకసారి చేసినట్టు సూచిస్తుంది; שׁלח మరియు מן־התבה కలిపి పావురాన్ని ఓడలోనుండి బయటికి పంపిన దిశను స్పష్టం చేస్తాయి.
- source_word: הַיּוֹנָה
  choice: పావురాన్ని
  rationale: కథలో ఇంతకుముందే ప్రస్తావించిన నిర్దిష్ట పావురాన్ని సూచించే సపద నామవాచకం.
- source_word: מִן הַתֵּבָה
  choice: ఓడలోనుండి
  rationale: నోవహు కథలో תֵּבָהను సంప్రదాయబద్ధంగాను స్పష్టంగాను ‘ఓడ’ అని అనువదించవచ్చు; מן ఉపసర్గ మూలస్థానాన్ని సూచిస్తుంది.
