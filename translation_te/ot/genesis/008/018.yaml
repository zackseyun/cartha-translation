  text: So Noah went out[b][a], and his sons and his wife and his sons’ wives with him.
translation:
  language: te
  text: 'అప్పుడు[a] నోవహు బయటికి వచ్చాడు; అతని కుమారులు, అతని భార్య, అతని కుమారుల భార్యలు[b] అతనితోపాటు వచ్చారు.


    [a] “అప్పుడు” అనే మాటకు బదులుగా “తర్వాత” లేదా “మరియు” అని కూడా అనువదించవచ్చు. ఇక్కడి హీబ్రూ కథన రూపం సంఘటనను ముందుకు నడిపిస్తుంది.


    [b] అక్షరార్థంగా, “అతని కుమారుల భార్యలు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “అప్పుడు” అనే మాటకు బదులుగా “తర్వాత” లేదా “మరియు” అని కూడా అనువదించవచ్చు. ఇక్కడి హీబ్రూ కథన రూపం సంఘటనను ముందుకు నడిపిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “అతని కుమారుల భార్యలు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: అప్పుడు నోవహు బయటికి వచ్చాడు
  rationale: וַ־ కలిసిన కథన క్రియ ముందటి ఆజ్ఞ తరువాత జరిగిన సంఘటనను ముందుకు నడిపిస్తుంది. יָצָאకు సందర్భానుసారంగా “బయటికి వచ్చాడు” సహజమైన తెలుగు రూపం; సంబంధాన్ని అతిగా నిర్దిష్టం చేయకుండా “అప్పుడు”తో చూపించాం.
- source_word: נֹחַ
  choice: నోవహు
  rationale: ఈ వ్యక్తి పేరుకు తెలుగులో స్థిరపడిన రూపాన్ని వాడాం.
- source_word: וּבָנָיו
  choice: అతని కుమారులు
  rationale: בָּנִים ఇక్కడ ప్రత్యేకంగా కుమారులను సూచిస్తుంది; సాధారణమైన “పిల్లలు” అని విస్తరించలేదు.
- source_word: וְאִשְׁתּוֹ
  choice: అతని భార్య
  rationale: ఏకవచన నామవాచకంతో ఉన్న మూడవ పురుష ఏకవచన ప్రత్యయం నేరుగా “అతని భార్య” అని అర్థమిస్తుంది.
- source_word: וּנְשֵׁי בָנָיו
  choice: అతని కుమారుల భార్యలు
  rationale: హీబ్రూ పదబంధపు కుటుంబ సంబంధాన్ని నేరుగా నిలిపి, సహజమైన ఆధునిక తెలుగులో ఇచ్చాం.
- source_word: אִתּוֹ
  choice: అతనితోపాటు
  rationale: ఈ ఉపసర్గ, ప్రత్యయం కలిపి “అతనితో” అని అర్థమిస్తాయి; జాబితాతో సహజంగా కలవడానికి “అతనితోపాటు” అని ఇచ్చాం.
