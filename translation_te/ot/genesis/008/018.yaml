translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. హీబ్రూలో క్రియ నోవహుతో ఏకవచనంగా వచ్చి, మిగిలిన కుటుంబ సభ్యులు “అతనితో” అని జతచేయబడిన నిర్మాణాన్ని తెలుగులో స్పష్టంగా ఉంచేందుకు అర్థవిరామంతో రెండు భాగాలుగా తీర్చిదిద్దాం.
