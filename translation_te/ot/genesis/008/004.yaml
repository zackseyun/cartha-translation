  text: And in the seventh month[a], on the seventeenth day of the month, the ark came to rest on the mountains of Ararat.
translation:
  language: te
  text: ఏడవ నెలలో, ఆ నెల పదిహేడవ రోజున, ఓడ అరారాతు పర్వతాలపై నిలిచింది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ‘అరారాతు పర్వతాలు’ అని బహువచనంలో ఉంది; ఇది అరారాతు అనే పర్వత ప్రాంతాన్ని సూచిస్తుంది, ప్రత్యేకంగా ‘అరారాతు పర్వతం’ అనే ఒకే శిఖరాన్ని కాదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּנַח
  choice: నిలిచింది
  rationale: נוּחַ ధాతువు ఇక్కడ ఓడ ఒక చోటికి చేరి అక్కడ నిలిచిన సంఘటనను సూచిస్తుంది. ‘నిలిచింది’ సహజమైన ఆధునిక తెలుగు ప్రయోగం; కేవలం కదలిక ఆగిందనే భావంతో పాటు స్థిరపడిన భావాన్నీ సందర్భంలో అందిస్తుంది.
- source_word: הַתֵּבָה
  choice: ఓడ
  rationale: నోవహు జలప్రళయ వృత్తాంతంలోని תֵּבָהకు తెలుగులో స్థిరపడిన, సాధారణ పాఠకులకు స్పష్టమైన సమానార్థకం.
- source_word: בַּחֹדֶשׁ הַשְּׁבִיעִי
  choice: ఏడవ నెలలో
  rationale: నెలను సూచించే కాలవాచక בְּను తెలుగులో సహజంగా ‘నెలలో’ అని వ్యక్తం చేస్తుంది.
- source_word: בְּשִׁבְעָה עָשָׂר יוֹם לַחֹדֶשׁ
  choice: ఆ నెల పదిహేడవ రోజున
  rationale: హీబ్రూ తేదీ సూత్రాన్ని స్పష్టమైన, సహజమైన తెలుగు క్రమంలో అందిస్తుంది; ‘ఆ’ పూర్వోక్త ఏడవ నెలనే సూచిస్తుంది.
- source_word: עַל
  choice: పై
  rationale: స్థానాన్ని సూచించే సాధారణ విభక్త్యర్థాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: הָרֵי אֲרָרָט
  choice: అరారాతు పర్వతాలు
  rationale: הָרֵי బహువచన రూపం కాబట్టి ‘పర్వతాలు’ అని ఉంచి, దానిని ఒకే పర్వత శిఖరంగా కుదించలేదు.
theological_decisions:
- issue: הָרֵי אֲרָרָט అనే భౌగోళిక పదబంధం
  choice: అరారాతు పర్వతాలు
  alternative: అరారాతు పర్వతం
  rationale: మూల హీబ్రూ పదం బహువచనంలో ఉంది. అందువల్ల సంప్రదాయంలో ప్రసిద్ధమైన ఒకే శిఖరాన్ని ప్రత్యేకంగా పేర్కొనకుండా, మూలపాఠంలోని భౌగోళిక విస్తృతిని అలాగే ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గంభీరమైన కథన శైలి. మూలంలోని తేదీ క్రమాన్ని కాపాడుతూ తెలుగు వాక్యనిర్మాణానికి అనుగుణంగా ‘ఆ నెల’ చేర్చబడింది. భౌగోళిక పదబంధంలోని బహువచనం స్పష్టంగా నిలుపబడింది.
