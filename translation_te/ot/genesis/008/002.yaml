  yaml_path: translation/ot/genesis/008/002.yaml
  text: The springs of the deep and the windows of the heavens were shut[b][a], and the rain from the heavens was restrained.
translation:
  language: te
  text: అగాధ జలాల ఊటలు, ఆకాశపు కిటికీలు[a] మూసివేయబడ్డాయి; ఆకాశం నుండి కురిసే వర్షం నిలువరించబడింది.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆకాశపు వరద ద్వారాలు.’ హీబ్రూ పదం అక్షరార్థంగా ఆకాశంలోని తెరువులు లేదా కిటికీలను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘ఆకాశం నుండి కురిసే వర్షం ఆగిపోయింది.’ హీబ్రూ క్రియ వర్షం నిలువరించబడడాన్ని, దాని ఫలితంగా అది ఆగిపోవడాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסָּכְרוּ
  choice: మూసివేయబడ్డాయి
  rationale: నిఫల్ రూపంలోని నిష్క్రియ భావాన్ని నిలుపుతుంది; ‘ఊటలు,’ ‘కిటికీలు’ అనే రెండు కర్తలకూ సహజంగా వర్తిస్తుంది.
- source_word: מַעְיְנֹת
  choice: ఊటలు
  rationale: నీరు వెలువడే సహజ మూలాలను సూచించే, ఆధునిక తెలుగులో స్పష్టమైన పదం.
- source_word: תְּהוֹם
  choice: అగాధ జలాలు
  rationale: ఆదికాండంలోని లోతైన ఆదిమ జలరాశి భావాన్ని సాధారణ పాఠకునికి అర్థమయ్యేలా తెలియజేస్తుంది.
- source_word: אֲרֻבֹּת
  choice: కిటికీలు
  rationale: ఆకాశంలోని తెరుచుకున్న రంధ్రాలు లేదా కిటికీలు అనే హీబ్రూ రూపకాన్ని వ్యాఖ్యానాత్మకంగా మార్చకుండా నిలుపుతుంది.
- source_word: הַשָּׁמַיִם
  choice: ఆకాశం
  rationale: ఈ వాతావరణ, విశ్వచిత్రణ సందర్భంలో సహజమైన ఆధునిక తెలుగు పదం; హీబ్రూలోని రెండు ప్రస్తావనల భావాన్ని పాఠ్యంలో నిలిపింది.
- source_word: וַיִּכָּלֵא
  choice: నిలువరించబడింది
  rationale: వర్షం కొనసాగకుండా అడ్డుకోబడిందనే నిష్క్రియ భావాన్ని వ్యక్తం చేస్తుంది; కేవలం ఫలితాన్ని తెలిపే ‘ఆగిపోయింది’ కంటే మూల క్రియ భావానికి దగ్గరగా ఉంటుంది.
- source_word: הַגֶּשֶׁם
  choice: వర్షం
  rationale: సందర్భానికి సరిపోయే సాధారణ, నేరమైన తెలుగు సమానార్థకం.
- source_word: מִן הַשָּׁמָיִם
  choice: ఆకాశం నుండి వచ్చే
  rationale: వర్షం ఎక్కడి నుండి వస్తుందో తెలిపే మూలపాఠ భావాన్ని సహజమైన తెలుగు వాక్యనిర్మాణంలో నిలుపుతుంది.
