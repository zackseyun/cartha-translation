  variant: modern standard Telugu
source:
  edition: WLC
  text: כָּל הַ/חַיָּ֨ה אֲשֶֽׁר אִתְּ/ךָ֜ מִ/כָּל בָּשָׂ֗ר בָּ/ע֧וֹף וּ/בַ/בְּהֵמָ֛ה וּ/בְ/כָל הָ/רֶ֛מֶשׂ הָ/רֹמֵ֥שׂ עַל הָ/אָ֖רֶץ הוצא אִתָּ֑/ךְ וְ/שָֽׁרְצ֣וּ בָ/אָ֔רֶץ וּ/פָר֥וּ וְ/רָב֖וּ עַל הָ/אָֽרֶץ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/017.yaml
  text: Bring out with you every living thing that is with you[a], from all flesh—birds and livestock and every creeping thing that creeps on the earth—so that they may swarm on the earth and be fruitful and multiply on the earth.
translation:
  language: te
  text: నీతో ఉన్న సకల జీవులను—సమస్త జీవరాశిలోని పక్షులను, పశువులను, భూమిమీద పాకే ప్రతి ప్రాణిని—నీతోపాటు బయటికి తీసుకురా. అవి భూమిమీద సమృద్ధిగా వృద్ధి చెంది[a], ఫలించి, భూమిమీద సంఖ్యలో పెరగాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘భూమిమీద సమృద్ధిగా విస్తరించాలి.’ ఇక్కడి హీబ్రూ క్రియ సమృద్ధిగా పుట్టిపెరిగి విస్తరించడం అనే భావాన్ని కలిగి ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַחַיָּה
  choice: సకల జీవులను
  rationale: ఈ సందర్భంలో חַיָּה అడవి జంతువులకు మాత్రమే పరిమితం కాకుండా, తరువాత పేర్కొన్న పక్షులు, పశువులు, పాకే ప్రాణులు అన్నిటినీ కలుపుతుంది.
- source_word: אֲשֶׁר אִתְּךָ
  choice: నీతో ఉన్న
  rationale: ‘సకల జీవులను’ విశేషించే సంబంధ వాక్యాన్ని సహజమైన ఆధునిక తెలుగులో నేరుగా వ్యక్తం చేస్తుంది.
- source_word: מִכָּל בָּשָׂר
  choice: సమస్త జీవరాశిలోని
  rationale: בָּשָׂר అక్షరార్థంగా ‘శరీరం/మాంసం’; ప్రళయ వృత్తాంతంలో ఇది ప్రాణుల సమష్టిని సూచిస్తుంది. ‘జీవరాశి’ ఆ సమష్టి భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: בָּעוֹף
  choice: పక్షులను
  rationale: ఈ మూడు వర్గాల జాబితాలో עוֹףకు ‘పక్షులు’ స్పష్టమైన, సహజమైన సమానార్థకం.
- source_word: וּבַבְּהֵמָה
  choice: పశువులను
  rationale: בְּהֵמָה ప్రధానంగా పెద్ద భూజంతువులను, ప్రత్యేకించి మానవ సంరక్షణలోని జంతువులను సూచించగలదు; ‘పశువులు’ ఆధునిక తెలుగులో సరైన విస్తృత పదం.
- source_word: וּבְכָל הָרֶמֶשׂ הָרֹמֵשׂ עַל הָאָרֶץ
  choice: నేలమీద పాకే ప్రతి ప్రాణిని
  rationale: నామవాచకం–క్రియ రూపాల పునరుక్త సంబంధాన్ని ‘పాకే...ప్రాణి’ సహజంగా తెలియజేస్తుంది; చిన్నగా నేలకు దగ్గరగా కదిలే జీవుల భావాన్ని నిలుపుతుంది.
- source_word: הוֹצֵא אִתָּךְ
  choice: నీతోపాటు బయటికి తీసుకురా
  rationale: יצא హిఫీల్ ఆజ్ఞారూపంలోని కారణార్థాన్ని ‘తీసుకురా’ నిలుపుతుంది; ‘నీతోపాటు’ సహచర్యాన్ని స్పష్టం చేస్తుంది.
- source_word: וְשָׁרְצוּ
  choice: విరివిగా పెరిగి
  rationale: שׁרץలోని సమృద్ధిగా ఉత్పత్తి కావడం, విస్తారంగా నిండిపోవడం అనే భావాన్ని అన్ని జంతువులకూ సహజంగా వర్తించే తెలుగులో తెలియజేస్తుంది.
- source_word: וּפָרוּ
  choice: ఫలించి
  rationale: ఆదికాండం సృష్టి-ఆశీర్వాద భాషలోని ‘ఫలించడం’ అనే ప్రతిధ్వనిని నిలుపుతుంది.
- source_word: וְרָבוּ
  choice: విస్తరించాలి
  rationale: సంఖ్యాపరంగా అధికమవడం అనే רבה భావాన్ని సహజంగా తెలుపుతూ, సృష్టి-ఆశీర్వాద సూత్రంతో అనుసంధానాన్ని కాపాడుతుంది.
- source_word: בָאָרֶץ / עַל הָאָרֶץ
  choice: భూమిమీద
  rationale: ప్రళయం అనంతర విశ్వవ్యాప్త సందర్భంలో אָרֶץను స్థానిక ‘దేశం’గా కాక ‘భూమి’గా గ్రహించడం సముచితం; మూలంలోని పునరుక్తిని అనువాదంలోనూ ఉంచింది.
theological_decisions:
- issue: ప్రళయం తరువాత సృష్టి-ఆశీర్వాద భాష ప్రతిధ్వని
  choice: ‘విరివిగా పెరిగి, ఫలించి, ... విస్తరించాలి’ అని మూడు వేర్వేరు క్రియాభావాలను నిలుపడం
  alternative: ‘బాగా అభివృద్ధి చెందాలి’ వంటి ఒకే సాధారణ పదబంధంతో సంక్షిప్తం చేయడం
  rationale: שׁרץ, פרה, רבה అనే వరుస క్రియలు ఆదికాండం 1లోని సమృద్ధి మరియు సృష్టి-ఆశీర్వాద భాషను ఉద్దేశపూర్వకంగా ప్రతిధ్వనింపజేస్తాయి. వాటిని వేరుగా ఉంచడం పాఠ్యంలోని పునఃసృష్టి ఉద్వేగాన్ని వ్యాఖ్యానంతో పెంచకుండా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే వచన గాంభీర్యం మరియు మూలంలోని జాబితా నిర్మాణం, భూమి అనే పద పునరుక్తి, సృష్టి-ఆశీర్వాద ప్రతిధ్వని నిలుపబడ్డాయి.
