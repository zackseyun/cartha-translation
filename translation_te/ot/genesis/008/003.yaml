source:
  edition: WLC
  text: וַ/יָּשֻׁ֧בוּ הַ/מַּ֛יִם מֵ/עַ֥ל הָ/אָ֖רֶץ הָל֣וֹךְ וָ/שׁ֑וֹב וַ/יַּחְסְר֣וּ הַ/מַּ֔יִם מִ/קְצֵ֕ה חֲמִשִּׁ֥ים וּ/מְאַ֖ת יֽוֹם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/003.yaml
  text: And the waters receded from upon the earth[a], going and returning[b], and the waters diminished at the end of a hundred and fifty days.
translation:
  language: te
  text: నీళ్లు భూమి మీద నుంచి క్రమక్రమంగా వెనక్కి తగ్గాయి[a]. నూట యాభై రోజుల ముగింపులో నీళ్లు తగ్గిపోయాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “వెళ్తూ తిరిగివస్తూ.” ఈ ప్రయోగం నీళ్లు నిరంతరంగా లేదా క్రమక్రమంగా వెనక్కి తగ్గడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֻׁבוּ
  choice: వెనక్కి తగ్గాయి
  rationale: שוב అనే క్రియకు ప్రాథమికంగా ‘తిరిగిపోవడం’ అనే భావం ఉంది. అయితే నీళ్లు భూమి మీద నుంచి తొలగిపోతున్న సందర్భంలో ‘వెనక్కి తగ్గాయి’ అనేది సహజమైన తెలుగు ప్రయోగం; జలాలు ఉపసంహరించుకున్న దృశ్యాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: מֵעַל הָאָרֶץ
  choice: భూమి మీద నుంచి
  rationale: מֵעַל లోని ‘మీద నుండి/పై నుండి’ అనే స్థలసంబంధ భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: הָלוֹךְ וָשׁוֹב
  choice: క్రమక్రమంగా
  rationale: అక్షరార్థంగా ‘వెళ్తూ తిరిగివస్తూ’ ఉన్న ఈ క్రియారూప సముదాయం ఇక్కడ కొనసాగుతూ, అంతకంతకూ జరిగే ఉపసంహరణను సూచిస్తుంది. ‘క్రమక్రమంగా’ అనడం నీళ్లు అటూ ఇటూ ఊగిసలాడినట్లు తప్పుగా అర్థం కాకుండా ఆ ప్రగతిశీల భావాన్ని అందిస్తుంది; అక్షరరూపాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: וַיַּחְסְרוּ
  choice: తగ్గిపోయాయి
  rationale: חסר ఇక్కడ నీళ్ల పరిమాణం తగ్గడాన్ని సూచిస్తుంది. మొదటి క్రియలోని స్థలసంబంధమైన ‘వెనక్కి తగ్గడం’ నుంచి స్వల్పంగా వేరు చేసి, నీళ్లు తక్కువైన భావాన్ని తెలియజేస్తుంది.
- source_word: מִקְצֵה
  choice: ముగింపులో
  rationale: కాలసంబంధ ప్రయోగంలో ‘ముగింపులో’ లేదా ‘పూర్తయిన తరువాత’ అనే భావం వస్తుంది. మూలంలోని నిర్మాణానికి దగ్గరగా ఉండేందుకు ‘ముగింపులో’ ఎంచుకున్నాం.
- source_word: חֲמִשִּׁים וּמְאַת יוֹם
  choice: నూట యాభై రోజులు
  rationale: హీబ్రూ సంఖ్యా వ్యక్తీకరణకు సూటిగా, సహజమైన తెలుగు రూపం.
