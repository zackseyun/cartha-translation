translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే గంభీరమైన శైలి. ఒకే హీబ్రూ వాక్యాన్ని తెలుగులో రెండు వాక్యాలుగా విభజించి పఠన సౌలభ్యాన్ని పెంచాం; రెండు వేర్వేరు హీబ్రూ క్రియల భావభేదాన్ని ‘వెనక్కి తగ్గాయి’ మరియు ‘తగ్గిపోయాయి’ ద్వారా నిలిపాం.
