  yaml_path: translation/ot/genesis/008/011.yaml
  text: And the dove came to him at evening time[a], and behold, a freshly plucked olive leaf was in her mouth[c][b]. So Noah knew that the waters had subsided from upon the earth.
translation:
  language: te
  text: పావురం సాయంకాలం వేళ అతని దగ్గరికి వచ్చింది[a]. ఇదిగో, దాని నోటిలో అప్పుడే తెంపిన ఒలీవ చెట్టు ఆకు ఉంది[b]. అప్పుడు భూమిమీద నుండి నీళ్లు తగ్గిపోయాయని[c] నోవహు తెలుసుకున్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అతని దగ్గరికి తిరిగి వచ్చింది.’ హీబ్రూ క్రియ స్వయంగా ‘వచ్చింది’ అని అర్థమిస్తుంది; అయితే సందర్భం అది తిరిగి వచ్చిందని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘అప్పుడే తెంపిన’ అని అనువదించిన హీబ్రూ పదం తెంపబడిన లేదా చింపబడినదాన్ని సూచిస్తుంది; అందువల్ల ఆ ఆకు జీవిస్తున్న ఒలీవ చెట్టునుండి కొత్తగా తెంపబడిందనే భావం వస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘నీళ్లు తగ్గాయని.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּבֹא אֵלָיו
  choice: అతని దగ్గరికి వచ్చింది
  rationale: בוא అనే క్రియకు మౌలిక అర్థం ‘వచ్చింది’; సందర్భం తిరిగి రావడాన్ని సూచించినా, ఆ భావాన్ని ప్రధాన పాఠ్యంలో అదనంగా చేర్చలేదు.
- source_word: לְעֵת עֶרֶב
  choice: సాయంకాలానికి
  rationale: సాయంకాల సమయాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: తర్వాత కనిపించిన విషయంపై దృష్టిని ఆకర్షించే హీబ్రూ ఉద్ఘాటనను నిలుపుతుంది.
- source_word: עֲלֵה זַיִת
  choice: ఒలీవ చెట్టు ఆకు
  rationale: ‘ఒలీవ ఆకు’ అనే భావాన్ని సాధారణ పాఠకుడికి స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: טָרָף
  choice: అప్పుడే తెంపిన
  rationale: ఈ పదం తెంపబడిన లేదా చింపబడినదనే భావాన్ని ఇస్తుంది; సందర్భంలో జీవిస్తున్న చెట్టునుండి కొత్తగా తెంపిన ఆకును సూచిస్తుంది.
- source_word: בְּפִיהָ
  choice: దాని నోటిలో
  rationale: తెలుగులో పక్షిని సహజంగా సూచించే సర్వనామాన్ని వాడుతూ, నోటిలో ఆకు ఉన్నదనే స్థానార్థాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: וַיֵּדַע
  choice: అప్పుడు ... తెలుసుకున్నాడు
  rationale: ఆకు కనిపించిన తర్వాత నోవహు చేసిన నిర్ధారణను సహజ కథన క్రమంలో తెలియజేస్తుంది.
- source_word: קַלּוּ הַמַּיִם
  choice: నీళ్లు తగ్గిపోయాయి
  rationale: קלל ఇక్కడ వరదనీళ్లు తగ్గడం లేదా తక్కువ కావడం అనే అర్థాన్ని ఇస్తుంది.
- source_word: מֵעַל הָאָרֶץ
  choice: భూమిమీద నుండి
  rationale: నీళ్లు భూమి ఉపరితలంపై నుండి తగ్గాయనే హీబ్రూ స్థాన సంబంధాన్ని నిలుపుతుంది.
