  naturalness: The main translation is natural modern standard Telugu and retains an appropriately restrained narrative register. The footnote’s alternative “కంటికి వచ్చాయి” is less idiomatic than “చూపుకు వచ్చాయి.”
  terminology: “నీళ్లు,” “తగ్గుతూనే ఉన్నాయి,” and “కనిపించాయి” are clear, modern, and contextually suitable. No theological terminology is involved.
