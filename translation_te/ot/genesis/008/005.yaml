source:
  edition: WLC
  text: וְ/הַ/מַּ֗יִם הָיוּ֙ הָל֣וֹךְ וְ/חָס֔וֹר עַ֖ד הַ/חֹ֣דֶשׁ הָֽ/עֲשִׂירִ֑י בָּֽ/עֲשִׂירִי֙ בְּ/אֶחָ֣ד לַ/חֹ֔דֶשׁ נִרְא֖וּ רָאשֵׁ֥י הֶֽ/הָרִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/005.yaml
  text: And the waters continued to recede until the tenth month. In the tenth month[a], on the first day of the month, the tops of the mountains became visible.
translation:
  language: te
  text: నీళ్లు పదో నెల వరకు క్రమంగా తగ్గుతూనే ఉన్నాయి. పదో నెల మొదటి రోజున పర్వతాల శిఖరాలు కనిపించాయి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘చూపుకు వచ్చాయి,’ ‘కనబడ్డాయి.’ హీబ్రూ క్రియను మరింత అక్షరార్థంగా ఇలా అనువదించవచ్చు; నీళ్లు తగ్గడంతో పర్వతాల శిఖరాలు చూపుకు వచ్చిన భావాన్ని ‘కనిపించాయి’ సహజంగా తెలియజేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּיִם
  choice: నీళ్లు
  rationale: జలప్రళయ సందర్భంలో సమూహార్థకమైన హీబ్రూ పదానికి ఆధునిక సాధారణ తెలుగులో సహజమైన సమానార్థకం.
- source_word: הָיוּ הָלוֹךְ וְחָסוֹר
  choice: క్రమంగా తగ్గుతూనే ఉన్నాయి
  rationale: היה తో కూడిన క్రియావిశేష రూపాలు సూచించే కొనసాగుతున్న, పురోగామి తగ్గుదలను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: עַד הַחֹדֶשׁ הָעֲשִׂירִי
  choice: పదో నెల వరకు
  rationale: కథనంలోని కాలసూచనను నేరుగా, స్పష్టంగా అందిస్తుంది.
- source_word: בָּעֲשִׂירִי בְּאֶחָד לַחֹדֶשׁ
  choice: పదో నెల మొదటి రోజున
  rationale: హీబ్రూ తేదీ నిర్మాణాన్ని తెలుగులో సహజంగా, సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: נִרְאוּ
  choice: కనిపించాయి
  rationale: నిఫల్ రూపంలోని ‘చూపుకు వచ్చాయి/కనబడినవి’ అనే భావాన్ని నిర్దిష్ట పరిశీలకుణ్ణి చేర్చకుండా సహజంగా వ్యక్తం చేస్తుంది.
- source_word: רָאשֵׁי הֶהָרִים
  choice: పర్వతాల శిఖరాలు
  rationale: భౌగోళిక సందర్భంలో רֹאשׁ సూచించే పర్వతాల పైభాగాలకు గౌరవప్రదమైన, సాధారణ తెలుగు పదప్రయోగం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, కథన గంభీరతను నిలుపుతూ మూలంలోని కొనసాగుతున్న చర్యను సంరక్షించింది.
