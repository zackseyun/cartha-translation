translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. హీబ్రూ జాబితా నిర్మాణం, సమగ్రతను తెలిపే పునరుక్తి, కుటుంబాల ప్రకారం అనే రూపకం నిలుపబడ్డాయి.
