source:
  edition: WLC
  text: כָּל הַֽ/חַיָּ֗ה כָּל הָ/רֶ֨מֶשׂ֙ וְ/כָל הָ/ע֔וֹף כֹּ֖ל רוֹמֵ֣שׂ עַל הָ/אָ֑רֶץ לְ/מִשְׁפְּחֹ֣תֵי/הֶ֔ם יָצְא֖וּ מִן הַ/תֵּבָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/019.yaml
  text: Every beast[a], every creeping thing, and every bird—everything that moves on the earth—went out from the ark by their families.
translation:
  language: te
  text: ప్రతి జంతువు, ప్రతి ప్రాకే జీవి, ప్రతి పక్షి—నేలపై కదిలే ప్రతిదీ—వాటి వాటి కుటుంబాల ప్రకారం[a] ఓడలోనుండి బయటికి వచ్చాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘వాటి వాటి కుటుంబాలవారీగా.’ హీబ్రూ పదబంధం జంతువులు వాటి వంశసంబంధ గుంపులు లేదా విభాగాలుగా బయటికి వచ్చాయనే భావాన్ని నిలుపుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַחַיָּה
  choice: ప్రతి జంతువు
  rationale: ఈ జాబితాలో חַיָּה అనేది ప్రాకే జీవులు, పక్షుల నుండి వేరుగా చెప్పబడిన జంతువుల వర్గాన్ని సూచిస్తుంది. ‘జంతువు’ అడవి లేదా పెంపుడు అనే భేదాన్ని అనవసరంగా చేర్చదు.
- source_word: כָּל הָרֶמֶשׂ
  choice: ప్రతి ప్రాకే జీవి
  rationale: רֶמֶשׂ నేలకు దగ్గరగా కదిలే చిన్న జీవులను సూచిస్తుంది. ఆధునిక తెలుగులో ‘ప్రాకే జీవి’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: וְכָל הָעוֹף
  choice: ప్రతి పక్షి
  rationale: עוֹף విస్తృతంగా ఎగిరే జీవులను సూచించగలిగినా, ఈ సందర్భంలో ‘పక్షి’ అత్యంత సహజమైన వర్గపదం.
- source_word: כֹּל רוֹמֵשׂ עַל הָאָרֶץ
  choice: నేలపై కదిలే ప్రతిదీ
  rationale: רוֹמֵשׂ అనే కృదంతానికి భూమిమీద కదలడం అనే విస్తృత భావం ఉంది. ‘ప్రాకే జీవి ... ప్రాకే ప్రతిదీ’ అనే అసహజ పునరుక్తిని నివారిస్తూ మూల భావాన్ని నిలుపుతుంది.
- source_word: לְמִשְׁפְּחֹתֵיהֶם
  choice: వాటి వాటి కుటుంబాల ప్రకారం
  rationale: מִשְׁפָּחָה సాధారణంగా కుటుంబం లేదా వంశగుంపును సూచిస్తుంది. జంతువుల సందర్భంలో వాటి సమూహ విభజన లేదా వంశసంబంధాన్ని తెలిపే హీబ్రూ రూపకాన్ని ‘రకాలు’ అని వివరణాత్మకంగా మార్చకుండా నిలుపుతుంది.
- source_word: יָצְאוּ מִן הַתֵּבָה
  choice: ఓడలోనుండి బయటికి వచ్చాయి
  rationale: יָצְאוּ సాధారణంగా బయటికి రావడాన్ని సూచిస్తుంది; תֵּבָהకు నోవహు కథనంలో స్థిరమైన, సులభమైన తెలుగు పదం ‘ఓడ’.
