id: GEN.8.12
reference: Genesis 8:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּיָּ֣חֶל ע֔וֹד שִׁבְעַ֥ת יָמִ֖ים אֲחֵרִ֑ים וַ/יְשַׁלַּח֙ אֶת הַ/יּוֹנָ֔ה וְ/לֹֽא יָסְפָ֥ה שׁוּב אֵלָ֖י/ו עֽוֹד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/012.yaml
  text: Then he waited another seven days[a], and sent out the dove, and it did not return to him again.
translation:
  language: te
  text: తరువాత అతడు మరో ఏడు రోజులు వేచి ఉండి, ఆ పావురాన్ని బయటికి పంపాడు. అది మళ్లీ అతని దగ్గరికి తిరిగి రాలేదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అది ఇక అతని దగ్గరికి తిరిగి రాలేదు.” నిషేధంతో కూడిన హీబ్రూ יָסְפָה + שׁוּב పదబంధాన్ని “మళ్లీ తిరిగి రాలేదు” అని గానీ, “ఇక తిరిగి రాలేదు” అని గానీ అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּיָּחֶל
  choice: తరువాత అతడు ... వేచి ఉండి
  rationale: ఈ సందర్భంలో יחל అంటే ‘వేచి ఉండు’. వావ్-క్రమకథనాన్ని సహజమైన తెలుగు కథన అనుసంధానమైన ‘తరువాత’తో తెలిపాం.
- source_word: עוֹד שִׁבְעַת יָמִים אֲחֵרִים
  choice: మరో ఏడు రోజులు
  rationale: అదనంగా గడిచిన ఏడు రోజుల కాలాన్ని తెలుగులో సహజంగా, పునరుక్తి లేకుండా ‘మరో ఏడు రోజులు’ అని వ్యక్తం చేస్తుంది.
- source_word: וַיְשַׁלַּח אֶת־הַיּוֹנָה
  choice: ఆ పావురాన్ని బయటికి పంపాడు
  rationale: שׁלח యొక్క సాధారణ అర్థం ‘పంపు’; ఓడలోనుంచి పక్షిని పంపిన సందర్భాన్ని ‘బయటికి’ స్పష్టం చేస్తుంది, అయితే ‘విడిచిపెట్టాడు’ అనే అధిక వ్యాఖ్యానాన్ని నివారిస్తుంది.
- source_word: וְלֹא יָסְפָה שׁוּב
  choice: మళ్లీ ... తిరిగి రాలేదు
  rationale: నిషేధంతో వచ్చిన יסף + שׁוּב నిర్మాణం ‘మళ్లీ తిరిగి రాలేదు’ లేదా ‘ఇక తిరిగి రాలేదు’ అనే రెండు భావాలకు అవకాశం ఇస్తుంది. ప్రధాన పాఠ్యంలో సంఘటనాత్మక భావాన్ని ఎంచుకున్నాం; ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: אֵלָיו
  choice: అతని దగ్గరికి
  rationale: నోవహు వైపు తిరిగి రావడాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: עוֹד
  choice: మళ్లీ
  rationale: చివరి עוֹד ను నిషేధిత క్రియా నిర్మాణంలో ‘మళ్లీ’గా అనువదించడం సహజం; ‘ఇక’ అనే కాలవ్యాప్తి భావం కూడా సాధ్యం.
