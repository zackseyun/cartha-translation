id: GEN.8.1
reference: Genesis 8:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּזְכֹּ֤ר אֱלֹהִים֙ אֶת נֹ֔חַ וְ/אֵ֤ת כָּל הַֽ/חַיָּה֙ וְ/אֶת כָּל הַ/בְּהֵמָ֔ה אֲשֶׁ֥ר אִתּ֖/וֹ בַּ/תֵּבָ֑ה וַ/יַּעֲבֵ֨ר אֱלֹהִ֥ים ר֨וּחַ֙ עַל הָ/אָ֔רֶץ וַ/יָּשֹׁ֖כּוּ הַ/מָּֽיִם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/001.yaml
  text: But God remembered Noah[a], and all the wild animals, and all the livestock that were with him in the ark. And God caused a wind to pass over the earth[b], and the waters subsided.
translation:
  language: te
  text: అయితే దేవుడు నోవహును[a], ఓడలో అతనితో ఉన్న సమస్త అడవి జంతువులను, సమస్త పశువులను జ్ఞాపకం చేసుకున్నాడు. దేవుడు భూమిమీదుగా గాలి[b] వీచేలా చేశాడు; అప్పుడు నీళ్లు తగ్గిపోయాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేక, ‘దేవుడు నోవహు పట్ల శ్రద్ధ చూపాడు.’ హీబ్రూలో ‘జ్ఞాపకం చేసుకున్నాడు’ అనేది తరచుగా కేవలం గుర్తుతెచ్చుకోవడమే కాక, నమ్మకంగా శ్రద్ధ చూపి కార్యం చేయడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ పదానికి ‘గాలి,’ ‘ఊపిరి,’ లేదా ‘ఆత్మ’ అనే అర్థాలు రావచ్చు. ఇక్కడ ‘గాలి’ సందర్భానికి బాగా సరిపోతుంది; అయినా ఆదికాండము 1:2లో నీళ్లపై ఉన్న ఆత్మ/గాలి చిత్రణకు ఇది ప్రతిధ్వని అని కొందరు భావిస్తారు.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּזְכֹּר
  choice: జ్ఞాపకం చేసుకున్నాడు
  rationale: హీబ్రూ ‘జ్ఞాపకం చేసుకోవడం’ అనే భావాన్ని యథాతథంగా నిలుపుతుంది. ఇక్కడ ఇది కేవలం మళ్లీ గుర్తుతెచ్చుకోవడాన్ని కాక, నోవహు పట్ల శ్రద్ధతో కార్యం చేయడాన్ని సూచిస్తుంది.
- source_word: כָּל הַחַיָּה
  choice: సమస్త అడవి జంతువులను
  rationale: తరువాత వచ్చే בְּהֵמָהతో ఉన్న వ్యత్యాసాన్ని నిలుపుతూ, חַיָּהను అడవి జంతువులుగా అనువదించడం సందర్భానికి తగినది.
- source_word: כָּל הַבְּהֵמָה
  choice: సమస్త పశువులను
  rationale: ఇక్కడ ఈ పదం అడవి జంతువులకు భిన్నంగా, మనుషుల సంరక్షణలో ఉండే జంతువులను సూచిస్తుంది; ‘పశువులు’ సహజమైన ఆధునిక తెలుగు పదం.
- source_word: בַּתֵּבָה
  choice: ఓడలో
  rationale: నోవహు కథా సందర్భంలో תֵּבָהకు తెలుగు బైబిలు వాడుకలో స్థిరపడి, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే పదం ‘ఓడ’.
- source_word: וַיַּעֲבֵר ... רוּחַ
  choice: గాలి వీచేలా చేశాడు
  rationale: רוּחַకు ‘గాలి,’ ‘ఊపిరి,’ ‘ఆత్మ’ అనే అర్థాలు ఉండగలవు. నీళ్లు తగ్గిపోవడానికి దారితీసే ఈ సందర్భంలో ‘గాలి’ ప్రధాన భావం; హిఫీల్ క్రియలోని కారణార్థాన్ని ‘వీచేలా చేశాడు’ తెలియజేస్తుంది.
- source_word: עַל הָאָרֶץ
  choice: భూమిమీదుగా
  rationale: ప్రళయ కథనం యొక్క విస్తృత సందర్భంలో אֶרֶץను ‘భూమి’గా తీసుకోవడం సముచితం; ‘మీదుగా’ గాలి దానిపై ప్రయాణించిన భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וַיָּשֹׁכּוּ הַמָּיִם
  choice: నీళ్లు తగ్గిపోయాయి
  rationale: క్రియలోని శాంతించడం, అణగడం, తగ్గడం అనే భావాన్ని సాధారణ ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: וַ
  choice: అయితే
  rationale: ముందటి తీర్పు కథనం నుంచి దేవుని అనుకూల కార్యం వైపు వచ్చే కథన మలుపును సహజంగా సూచిస్తుంది; హీబ్రూ సంధాయక అవ్యయానికి సందర్భానుగుణ రూపం.
theological_decisions:
- issue: ‘దేవుడు నోవహును జ్ఞాపకం చేసుకున్నాడు’ అనే మానవరూప వర్ణన
  choice: జ్ఞాపకం చేసుకున్నాడు అనే హీబ్రూ నుడికారాన్ని ప్రధాన పాఠ్యంలో నిలుపడం
  alternative: నోవహు పట్ల శ్రద్ధ చూపాడు
  rationale: ఈ పదబంధం దేవుడు ముందుగా మరచిపోయాడని తప్పనిసరిగా చెప్పదు; నోవహు పట్ల నమ్మకంగా శ్రద్ధ చూపి కార్యం చేయడాన్ని సూచిస్తుంది. నుడికారాన్ని నిలపడం మూలపాఠ్యంలోని సాహిత్య, theological ఉద్వేగాన్ని కాపాడుతుంది.
- issue: רוּחַ అనే పదానికి ఇక్కడి అర్థం
  choice: గాలి
  alternative: ఆత్మ
  rationale: నీళ్లు తగ్గిపోవడానికి కారణమయ్యే వాతావరణ సంబంధ కార్యమే తక్షణ సందర్భానికి సరిపోతుంది. అయినా ఆదికాండము 1:2లోని నీళ్లపై దేవుని ఆత్మ/గాలి చిత్రణతో ఉండగల ప్రతిధ్వనిని పాదసూచికలో తెలియజేయడం ద్వారా పదంలోని అస్పష్టతను కాపాడాం.
translation_notes:
  register: సాధారణ ఆధునిక తెలుగు పాఠకులకు అర్థమయ్యేలా, గంభీరమైన కథన శైలిని ఉపయోగించాం. ‘జ్ఞాపకం చేసుకున్నాడు’ అనే మూల నుడికారాన్ని నిలిపి, దాని క్రియాశీల భావాన్ని పాదసూచికలో వివరించాం. ‘అడవి జంతువులు’ మరియు ‘పశువులు’ అనే జంటతో హీబ్రూ పదాల మధ్య వ్యత్యాసాన్ని కాపాడాం.
