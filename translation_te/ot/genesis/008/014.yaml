base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/014.yaml
  text: And in the second month[a], on the twenty-seventh day of the month, the earth was dry.
translation:
  language: te
  text: మరియు రెండవ నెలలో, ఆ నెల ఇరవై ఏడవ రోజున, భూమి ఎండిపోయింది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నేల ఎండిపోయింది.” హీబ్రూ אֶרֶץ అనే పదానికి “భూమి,” “దేశం,” లేదా “నేల” అనే అర్థాలు ఉండవచ్చు. జలప్రళయ కథనం ఎండిపోవడాన్ని విస్తృత స్థాయిలో వర్ణిస్తున్నందున ఇక్కడ “భూమి” అని అనువదించాం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַחֹדֶשׁ הַשֵּׁנִי
  choice: రెండో నెలలో
  rationale: వావ్ కథన క్రమాన్ని కొనసాగిస్తుంది; తెలుగులో వాక్యారంభంలోని కాలసూచనే ఆ అనుసంధానాన్ని సహజంగా తెలియజేస్తుంది. ‘రెండో నెలలో’ అనేది ఆధునిక, స్పష్టమైన రూపం.
- source_word: בְּשִׁבְעָה וְעֶשְׂרִים יוֹם לַחֹדֶשׁ
  choice: ఆ నెల ఇరవై ఏడో రోజున
  rationale: హీబ్రూ తేదీ సూత్రాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; ‘ఆ నెల’ పునరుక్తిని తగ్గించకుండా మూలంలోని నిర్దిష్టతను నిలుపుతుంది.
- source_word: יָבְשָׁה
  choice: ఎండిపోయింది
  rationale: Qal perfect 3fs ఇక్కడ ఎండిన ఫలితస్థితిని సూచిస్తుంది. ‘ఎండిపోయింది’ తెలుగు కథనంలో సహజంగా ఉండి, ఎండే ప్రక్రియ పూర్తయిన స్థితిని తెలియజేస్తుంది.
- source_word: הָאָרֶץ
  choice: భూమి
  rationale: אֶרֶץకు ‘భూమి,’ ‘దేశం/నేల’ అనే అర్థాలు సాధ్యం. జలప్రళయ కథనంలోని విస్తృత పరిధికి ‘భూమి’ సరిపోతుంది; నిజమైన పదార్థ ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
theological_decisions:
- issue: జలప్రళయ వర్ణనలో הָאָרֶץ పరిధి
  choice: భూమి
  alternative: నేల
  rationale: మూలపదం పరిధిని స్వయంగా ఖచ్చితంగా నిర్ణయించదు. కథనంలోని విస్తృత దృక్కోణం కారణంగా ప్రధాన పాఠ్యంలో ‘భూమి’ ఎంచుకున్నాం; ‘నేల’ అనే సాధ్యమైన అర్థాన్ని పాదటిప్పణిలో స్పష్టంగా నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. తేదీని సహజ తెలుగు క్రమంలో ఉంచి, మూలంలోని పునరుక్తి మరియు అర్థసందిగ్ధతను అవసరమైనంతవరకు నిలిపాం.
