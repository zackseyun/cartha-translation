id: GEN.8.22
reference: Genesis 8:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: עֹ֖ד כָּל יְמֵ֣י הָ/אָ֑רֶץ זֶ֡רַע וְ֠/קָצִיר וְ/קֹ֨ר וָ/חֹ֜ם וְ/קַ֧יִץ וָ/חֹ֛רֶף וְ/י֥וֹם וָ/לַ֖יְלָה לֹ֥א יִשְׁבֹּֽתוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/022.yaml
  text: For as long as the earth endures[a], seedtime and harvest, cold and heat, summer and winter[b], and day and night shall not cease.
translation:
  language: te
  text: భూమి ఉన్నంతకాలం[a], విత్తే కాలం, కోతకాలం, చలి, వేడి, వేసవి, చలికాలం, పగలు, రాత్రి—ఇవి నిలిచిపోవు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “భూమి దినాలన్నిటిలో.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹד כָּל יְמֵי הָאָרֶץ
  choice: భూమి ఉన్నంతకాలం
  rationale: అక్షరార్థంగా ‘భూమి దినాలన్నిటిలో’; భూమి ఉనికి కొనసాగినంత వ్యవధిని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: זֶרַע
  choice: విత్తే కాలం
  rationale: קָצִירతో జతగా ఇది విత్తనాన్ని కాక, విత్తే వ్యవసాయ కాలం లేదా కార్యాన్ని సూచిస్తుంది.
- source_word: קָצִיר
  choice: కోతకాలం
  rationale: విత్తే కాలానికి సహజమైన వ్యవసాయ ప్రతిపదం; పంట కోసే కాలాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: קֹר וָחֹם
  choice: చలి, వేడి
  rationale: మూలంలోని పరస్పర విరుద్ధ వాతావరణ పదాలను సూటిగా నిలుపుతుంది.
- source_word: קַיִץ וָחֹרֶף
  choice: వేసవి, చలికాలం
  rationale: కాలచక్రంలోని విరుద్ధ ఋతువులకు సాధారణ ఆధునిక తెలుగు పదాలు; ప్రాచీన లెవాంతు సందర్భంలో ‘ఎండాకాలం, వానాకాలం’ అనే భావఛాయ ఉండవచ్చు.
- source_word: יוֹם וָלַיְלָה
  choice: పగలు, రాత్రి
  rationale: నిరంతర కాలచక్రాన్ని సూచించే స్థిర జంటకు సహజమైన తెలుగు రూపం.
- source_word: לֹא יִשְׁבֹּתוּ
  choice: ఇవి నిలిచిపోవు
  rationale: שׁבת ఇక్కడ ‘ఆగిపోవు, కొనసాగడం మానవు’ అనే అర్థంలో ఉంది; ముందు పేర్కొన్న చక్రాలన్నింటినీ ‘ఇవి’ స్పష్టంగా సూచిస్తుంది.
theological_decisions:
- issue: సృష్టి సాధారణ చక్రాలు కొనసాగే వాగ్దానం యొక్క పరిధి, వ్యవధి
  choice: భూమి ఉన్నంతకాలం ఈ చక్రాలు నిలిచిపోవని వాక్యం చెబుతుంది.
  alternative: ఈ చక్రాలు ఎలాంటి పరిమితీ లేకుండా శాశ్వతంగా కొనసాగుతాయనే అర్థం.
  rationale: כָּל יְמֵי הָאָרֶץ అనే పదబంధం ఈ ప్రకటనను ‘భూమి దినాల’ వ్యవధికి పరిమితం చేస్తుంది; అనువాదం దానిని సంపూర్ణ నిత్యత్వ ప్రకటనగా విస్తరించదు.
translation_notes:
  register: సహజమైన, గౌరవప్రదమైన ఆధునిక ప్రామాణిక తెలుగు. మూలంలోని లయబద్ధమైన జంటలను నిలిపి, వాక్యాంతంలో వాటన్నింటికీ వర్తించే క్రియను ఉంచింది.
