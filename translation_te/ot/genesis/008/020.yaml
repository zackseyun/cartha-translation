id: GEN.8.20
reference: Genesis 8:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּ֥בֶן נֹ֛חַ מִזְבֵּ֖חַ לַֽ/יהוָ֑ה וַ/יִּקַּ֞ח מִ/כֹּ֣ל הַ/בְּהֵמָ֣ה הַ/טְּהוֹרָ֗ה וּ/מִ/כֹּל֙ הָ/ע֣וֹף הַ/טָּהֹ֔ר וַ/יַּ֥עַל עֹלֹ֖ת בַּ/מִּזְבֵּֽחַ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/020.yaml
  text: Then Noah built an altar to Yahweh[a], and took some of every clean animal and of every clean bird[b], and offered burnt offerings on the altar.
translation:
  language: te
  text: అప్పుడు నోవహు యాహ్వేకు[a] ఒక బలిపీఠం కట్టాడు. ప్రతి శుద్ధమైన జంతువులోనుండి, ప్రతి శుద్ధమైన పక్షిలోనుండి కొన్నిటిని తీసుకొని[b], ఆ బలిపీఠం మీద దహనబలులు అర్పించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పాఠంలో దేవుని వ్యక్తిగత నామం YHWH ఉంది; దీనిని “యెహోవా” అని కూడా లిప్యంతరీకరిస్తారు.
    reason: divine_name_transliteration
  - marker: b
    text: 'మరింత అక్షరార్థంగా: “ప్రతి శుద్ధమైన జంతువులోనుండి, ప్రతి శుద్ధమైన పక్షిలోనుండి తీసుకొని.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  choice: కట్టాడు
  rationale: בנה అనే క్రియకు సహజమైన ఆధునిక తెలుగు సమానార్థకం; బలిపీఠ నిర్మాణాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: מִזְבֵּחַ
  choice: బలిపీఠం
  rationale: బలి అర్పించే స్థలాన్ని సూచించే מזבחకు స్థిరమైన, స్పష్టమైన తెలుగు పదం.
- source_word: לַיהוָה
  choice: యెహోవాకు
  rationale: హీబ్రూ దైవనామం יהוהను బిరుదుతో భర్తీ చేయకుండా తెలుగులో సుపరిచితమైన రూపంలో లిప్యంతరీకరించింది.
- source_word: מִכֹּל
  choice: ప్రతి రకమైన ... లోనుండి కొన్నిటిని
  rationale: హీబ్రూ పదబంధంలోని విభక్త్యర్థాన్ని నిలుపుతూ, ప్రతి జీవినీ బలి ఇచ్చాడనే అపార్థం రాకుండా సందర్భసిద్ధమైన భాగార్థాన్ని స్పష్టం చేస్తుంది; 'రకమైన' అనేది సందర్భంలోని వర్గార్థాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: הַבְּהֵמָה
  choice: జంతువు
  rationale: בהמה సూచించే భూజంతువుల విస్తృత వర్గానికి సాధారణ పాఠకులకు అర్థమయ్యే సహజ పదం.
- source_word: הַטְּהוֹרָה / הַטָּהֹר
  choice: పవిత్రమైన
  rationale: ఈ సందర్భంలో బలికి ఆమోదయోగ్యమైనదనే ఆచార సంబంధిత טהור భావాన్ని తెలియజేస్తుంది; 'శుభ్రమైన' అనే సాధారణ పరిశుభ్రతార్థపు అపార్థాన్ని నివారిస్తుంది.
- source_word: הָעוֹף
  choice: పక్షి
  rationale: עוףకు ఈ బలి సందర్భంలో సహజమైన, సరిపడా నిర్దిష్టమైన తెలుగు పదం.
- source_word: וַיַּעַל עֹלֹת
  choice: దహనబలులు అర్పించాడు
  rationale: עלה హిఫీల్ రూపం మరియు עֹלֹת కలిపి సూచించే బలియర్పణ చర్యను సహజమైన తెలుగు ఆరాధనా భాషలో వ్యక్తపరుస్తుంది.
- source_word: בַּמִּזְבֵּחַ
  choice: బలిపీఠం మీద
  rationale: హీబ్రూ స్థలార్థాన్ని సహజ తెలుగులో నేరుగా నిలుపుతుంది.
theological_decisions:
- issue: יהוה అనే దైవనామాన్ని అనువదించడం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: మూలపాఠంలోని వ్యక్తిగత దైవనామాన్ని బిరుదుగా మార్చకుండా ఉంచింది. 'యెహోవా' ఆధునిక తెలుగు బైబిలు పాఠకులకు విస్తృతంగా గుర్తుపట్టదగిన లిప్యంతరీకరణ; ప్రత్యామ్నాయ ఉచ్చారణను పాదసూచికలో తెలిపింది.
- issue: నోవహు బలి కోసం తీసుకున్న వాటి భాగార్థం
  choice: ప్రతి రకమైన ... లోనుండి కొన్నిటిని
  alternative: ప్రతి పవిత్రమైన జంతువులోనుండి, ప్రతి పవిత్రమైన పక్షిలోనుండి
  rationale: మూలంలోని מִכֹּל అక్షరార్థాన్ని గమనిస్తూ, సందర్భం సూచించే భాగార్థాన్ని ప్రధాన పాఠంలో స్పష్టం చేసింది. దీనివల్ల అన్ని పవిత్ర జీవులనూ బలి ఇచ్చాడనే అపార్థం నివారించబడుతుంది; అక్షరానువాదాన్ని పాదసూచికలో భద్రపరిచింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా గౌరవప్రదమైన కథన శైలి వాడబడింది. 'అప్పుడు' వావ్-వరుసలోని కథన కొనసాగింపును సహజంగా తెలియజేస్తుంది. ప్రధాన పాఠంలోని రెండు పాదసూచిక గుర్తులు [a], [b] సంబంధిత స్థానాల్లోనే ఉంచబడ్డాయి.
