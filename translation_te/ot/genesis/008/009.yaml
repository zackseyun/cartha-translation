source:
  edition: WLC
  text: וְ/לֹֽא מָצְאָה֩ הַ/יּוֹנָ֨ה מָנ֜וֹחַ לְ/כַף רַגְלָ֗/הּ וַ/תָּ֤שָׁב אֵלָי/ו֙ אֶל הַ/תֵּבָ֔ה כִּי מַ֖יִם עַל פְּנֵ֣י כָל הָ/אָ֑רֶץ וַ/יִּשְׁלַ֤ח יָד/וֹ֙ וַ/יִּקָּחֶ֔/הָ וַ/יָּבֵ֥א אֹתָ֛/הּ אֵלָ֖י/ו אֶל הַ/תֵּבָֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/009.yaml
  text: But the dove found no resting place for the sole of her foot[a], so she returned to him, to the ark, because the waters were on the surface of all the earth[d][c][b]. Then he stretched out his hand and took her and brought her to himself into the ark.
translation:
  language: te
  text: కానీ పావురానికి తన కాలి అరికాలు మోపడానికి విశ్రాంతి స్థలం దొరకలేదు. భూమి అంతటి ఉపరితలంపై నీళ్లు ఉండడంతో అది అతని దగ్గరికి, ఓడ దగ్గరకు తిరిగి వచ్చింది. అప్పుడు అతడు తన చెయ్యి చాచి దాన్ని తీసుకొని తన దగ్గరకు, ఓడలోకి తీసుకువచ్చాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מָנוֹחַ
  choice: విశ్రమించడానికి చోటు
  rationale: ఈ నామవాచకం విశ్రాంతి లేదా విశ్రాంతి పొందే స్థలాన్ని సూచిస్తుంది. సందర్భంలో పావురం వాలగల స్థలం ఉద్దేశించబడింది; అందువల్ల ఆధునిక తెలుగులో సహజంగా ఈ విధంగా వ్యక్తీకరించబడింది.
- source_word: לְכַף רַגְלָהּ
  choice: తన అరికాలు మోపి
  rationale: כַּף רֶגֶל అంటే పాదం అడుగుభాగం, అంటే అరికాలు. మూలంలోని స్పష్టమైన శరీరచిత్రాన్ని నిలుపుతూ తెలుగులో సహజంగా ఉండేలా అనువదించబడింది.
- source_word: וַתָּשָׁב אֵלָיו אֶל־הַתֵּבָה
  choice: అది అతని దగ్గరికి, ఓడ వద్దకు తిరిగి వచ్చింది
  rationale: אֵלָיו మరియు אֶל־הַתֵּבָה అనే రెండు దిశాసూచక భాగాలనూ నిలుపుతుంది. ఈ దశలో పావురం ఓడ వద్దకు తిరిగి రావడం మాత్రమే చెప్పబడుతుంది; లోపలికి తీసుకోవడం తరువాతి వాక్యంలో ఉంది.
- source_word: מַיִם עַל־פְּנֵי כָל־הָאָרֶץ
  choice: భూమి అంతటి ఉపరితలంపై నీళ్లు
  rationale: פְּנֵי లోని ‘ముఖం/ఉపరితలం’ అనే చిత్రాన్ని ‘ఉపరితలంపై’ అని కాపాడింది; ‘కప్పివేశాయి’ అని వ్యాఖ్యానాత్మకంగా విస్తరించలేదు.
- source_word: וַיִּשְׁלַח יָדוֹ
  choice: తన చెయ్యి చాపి
  rationale: చెయ్యితో కలిసి వచ్చిన שׁלח ఇక్కడ చెయ్యి ముందుకు చాపడాన్ని సూచించే సహజ ప్రయోగం.
- source_word: וַיִּקָּחֶהָ
  choice: దాన్ని పట్టుకొని
  rationale: לקח యొక్క ప్రాథమిక భావం ‘తీసుకోవడం’; ఎగిరివచ్చిన పావురాన్ని చేతితో అందుకున్న సందర్భంలో ‘పట్టుకొని’ సహజంగా ఆ చర్యను తెలియజేస్తుంది.
- source_word: וַיָּבֵא אֹתָהּ אֵלָיו אֶל־הַתֵּבָה
  choice: ఓడలో తన దగ్గరికి తీసుకున్నాడు
  rationale: ‘తన దగ్గరికి’ మరియు ‘ఓడలోకి’ అనే మూలంలోని రెండు అంశాలనూ తెలుగులో సహజమైన క్రమంలో నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే సహజమైన, గౌరవప్రదమైన కథన శైలి. పావురాన్ని తెలుగులో సహజంగా నపుంసక సర్వనామమైన ‘అది/దాన్ని’తో సూచించాం; ఇది హీబ్రూ వ్యాకరణ లింగాన్ని సిద్ధాంతపరంగా వ్యాఖ్యానించదు.
