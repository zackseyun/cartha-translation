revisions:
- from: కానీ పావురానికి తన అరికాలు మోపి విశ్రమించడానికి చోటు దొరకలేదు. భూమి అంతటి ఉపరితలంపై నీళ్లు ఉండడంతో అది అతని దగ్గరికి, ఓడ వద్దకు తిరిగి వచ్చింది. అప్పుడు అతడు తన చెయ్యి చాపి దాన్ని పట్టుకొని, ఓడలో తన దగ్గరికి తీసుకున్నాడు.
  to: కానీ పావురానికి తన కాలి అరికాలు మోపడానికి విశ్రాంతి స్థలం దొరకలేదు. భూమి అంతటి ఉపరితలంపై నీళ్లు ఉండడంతో అది అతని దగ్గరికి, ఓడ దగ్గరకు తిరిగి వచ్చింది. అప్పుడు అతడు తన చెయ్యి చాచి దాన్ని తీసుకొని తన దగ్గరకు, ఓడలోకి తీసుకువచ్చాడు.
