  text: 'అప్పుడు దేవుడు నోవహుతో ఇలా చెప్పాడు:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: అప్పుడు ... మాట్లాడాడు
  rationale: వావ్-క్రమనిర్దేశక రూపం కథనాన్ని తదుపరి సంఘటనకు తీసుకెళ్తుంది; ‘అప్పుడు’ ఆ క్రమాన్ని సహజంగా తెలియజేస్తుంది, ‘మాట్లాడాడు’ דבר క్రియ యొక్క భావాన్ని నిలుపుతుంది.
- source_word: אֱלֹהִים
  choice: దేవుడు
  rationale: ఈ సందర్భంలో ఈ పదం ఏకైక దేవుణ్ణి సూచిస్తుంది; ఆధునిక ప్రామాణిక తెలుగులో ‘దేవుడు’ సహజమైన అనువాదం.
- source_word: אֶל־נֹחַ
  choice: నోవహుతో
  rationale: మాట్లాడే క్రియతో కలిసి אֶל సంభాషణ ఎవరిని ఉద్దేశించిందో సూచిస్తుంది; తెలుగులో ‘నోవహుతో మాట్లాడాడు’ సహజమైన నిర్మాణం.
- source_word: נֹחַ
  choice: నోవహు
  rationale: హీబ్రూ పేరుకు తెలుగు బైబిలు వాడుకలో గుర్తించదగిన లిప్యంతరీకరణ.
- source_word: לֵאמֹר
  choice: ఇలా
  rationale: తరువాత వచ్చే ప్రత్యక్ష వాక్యాన్ని పరిచయం చేసే హీబ్రూ సూత్రాన్ని తెలుగులో ‘ఇలా మాట్లాడాడు:’ సహజంగా, సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
theological_decisions: []
translation_notes:
  register: సాధారణ ఆధునిక పాఠకులకు అర్థమయ్యే, గౌరవప్రదమైన ప్రామాణిక తెలుగు. హీబ్రూ కథన క్రమాన్ని ‘అప్పుడు’తో నిలిపి, తదుపరి ప్రత్యక్ష వాక్యానికి ద్విబిందువుతో మార్గం కల్పించబడింది.
