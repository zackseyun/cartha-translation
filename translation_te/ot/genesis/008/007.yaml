  yaml_path: translation/ot/genesis/008/007.yaml
  text: Then he sent out the raven[a], and it went out, going out and returning[b], until the waters had dried up from upon the earth.
translation:
  language: te
  text: తర్వాత అతడు కాకిని బయటికి పంపాడు. భూమిమీద నుండి నీళ్లు ఎండిపోయే వరకు అది బయటికి వెళ్తూ, తిరిగి వస్తూ ఉండింది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అది అటూ ఇటూ తిరుగుతూ ఉండింది.” హీబ్రూ పదబంధం పునరావృతమైన లేదా కొనసాగిన కదలికను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְשַׁלַּח
  choice: తర్వాత అతడు ... బయటికి పంపాడు
  rationale: కథనాన్ని ముందుకు నడిపించే wayyiqtol రూపాన్ని సహజమైన తెలుగు కథన క్రమంతో వ్యక్తం చేస్తుంది; పక్షిని పంపివేయడాన్ని ‘బయటికి పంపాడు’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: הָעֹרֵב
  choice: కాకిని
  rationale: עֹרֵב అనే నిర్దిష్ట పక్షికి ఆధునిక ప్రామాణిక తెలుగులో సహజమైన సమానార్థకం ‘కాకి’.
- source_word: וַיֵּצֵא יָצוֹא וָשׁוֹב
  choice: అది బయటికి వెళ్తూ, తిరిగి వస్తూ ఉండింది
  rationale: పరిమిత క్రియతో పాటు వచ్చిన infinitive absolute రూపాలు పునరావృతమైన లేదా కొనసాగిన కదలికను సూచిస్తాయి. ఈ అనువాదం ‘బయటికి వెళ్లడం—తిరిగి రావడం’ అనే మూలపాఠంలోని రెండు దిశలనూ నిలుపుతుంది.
- source_word: עַד יְבֹשֶׁת
  choice: ఎండిపోయే వరకు
  rationale: עַד తెలిపే కాలపరమైన అంత్యబిందువును, יבשׁ తెలిపే ఎండిపోవడాన్ని సహజమైన తెలుగు నిర్మాణంలో వ్యక్తం చేస్తుంది.
- source_word: הַמַּיִם
  choice: నీళ్లు
  rationale: మַיִם రూపానికి, జలప్రళయ సందర్భానికి సాధారణ ఆధునిక తెలుగులో ‘నీళ్లు’ సహజంగా సరిపోతుంది.
- source_word: מֵעַל הָאָרֶץ
  choice: భూమిమీద ఉన్న
  rationale: ‘భూమి మీదనుండి/భూమిమీద’ అనే స్థల సంబంధాన్ని తెలుగులో సహజంగా తెలియజేస్తూ, నీళ్లు భూమిని కప్పి ఉన్న దృశ్యాన్ని కాపాడుతుంది.
