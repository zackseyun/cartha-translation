translation:
  language: te
  text: నలభై రోజులు ముగిసిన తరువాత[a], నోవహు తాను చేసిన ఓడ యొక్క కిటికీని తెరిచాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నలభై రోజుల ముగింపులో.’ హీబ్రూ పదబంధం ఆ కాలవ్యవధి ముగిసిన బిందువును సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: 'మరింత రూపానుసారంగా: ‘నలభై రోజులు ముగిసినప్పుడు ఇలా జరిగింది: నోవహు తాను చేసిన ఓడ యొక్క కిటికీని తెరిచాడు.’'
    reason: previous_rendering
lexical_decisions:
- source_word: וַיְהִי
  choice: ప్రత్యేక పదబంధంగా అనువదించకుండా కాలసూచక ఉపవాక్యంలో కలిపాం
  rationale: హీబ్రూ కథన క్రమాన్ని తెలిపే ఈ సూత్రపదం ఇక్కడ తదుపరి సంఘటనను పరిచయం చేస్తుంది. ఆధునిక తెలుగులో ‘అప్పుడు ఇలా జరిగింది’ అని విడిగా పెట్టడం కంటే కాలసూచక నిర్మాణంలో భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: מִקֵּץ
  choice: ముగిసిన తరువాత
  rationale: ఒక కాలవ్యవధి పూర్తయిన బిందువును సూచిస్తుంది. ‘ముగిసిన తరువాత’ సహజమైన తెలుగు; ‘ముగింపులో’ అనే ప్రత్యామ్నాయ భావాన్ని పాదసూచికలో ఉంచాం.
- source_word: אַרְבָּעִים יוֹם
  choice: నలభై రోజులు
  rationale: సంఖ్యతో కూడిన ‘రోజు’ అనే సాధారణ కాలవ్యవధిని నేరుగా, సహజంగా అనువదిస్తుంది.
- source_word: וַיִּפְתַּח
  choice: తెరిచాడు
  rationale: פתח క్రియకు ఈ సందర్భంలో సరళమైన, సందర్భోచితమైన అర్థం ‘తెరవడం’.
- source_word: חַלּוֹן
  choice: కిటికీ
  rationale: ఈ నామవాచకం సాధారణంగా కిటికీ లేదా కిటికీలాంటి తెరువును సూచిస్తుంది; ఓడ సందర్భంలో ‘కిటికీ’ స్థిరమైన, స్పష్టమైన పదం.
- source_word: הַתֵּבָה
  choice: ఓడ
  rationale: ఆదికాండము 6–9లో תֵּבָה నోవహు నిర్మించిన జలవాహనాన్ని సూచిస్తుంది. ఆధునిక తెలుగు బైబిలు వాడుకలో ‘ఓడ’ సహజంగా అర్థమవుతుంది.
- source_word: אֲשֶׁר עָשָׂה
  choice: తాను చేసిన
  rationale: సంబంధ ఉపవాక్యం ‘ఓడ’ను విశేషిస్తుంది. కర్త నోవహేనని ‘తాను’ స్పష్టం చేస్తూ, నిర్మాణం తెరవడానికి ముందే జరిగిందనే క్రమాన్ని సహజంగా తెలియజేస్తుంది.
