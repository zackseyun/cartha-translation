base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/008.yaml
  text: Then he sent out the dove from him to see whether the waters had subsided from the surface of the ground[a][b].
translation:
  language: te
  text: తర్వాత అతడు, నేల ఉపరితలం మీద నుంచి నీళ్లు తగ్గాయేమో చూడడానికి, తన దగ్గర నుంచి పావురాన్ని బయటికి పంపాడు[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘తగ్గుముఖం పట్టాయేమో.’ ఇక్కడి హీబ్రూ క్రియ వరదనీళ్లు తగ్గాయని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘నేల ముఖం మీద నుంచి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְשַׁלַּח
  choice: తర్వాత ... బయటికి పంపాడు
  rationale: వయ్యిక్తోల్ కథన క్రమాన్ని ముందుకు నడిపిస్తుంది. పక్షిని ఓడలోనుంచి విడిచిపెట్టే సందర్భంలో ‘బయటికి పంపాడు’ సహజంగా ఉంది.
- source_word: הַיּוֹנָה
  choice: పావురాన్ని
  rationale: יוֹנָה పావురం/గువ్వను సూచించగలదు; జలప్రళయ కథనంలో ‘పావురం’ స్థిరమైన, సందర్భోచితమైన తెలుగు పదం.
- source_word: מֵאִתּוֹ
  choice: తన దగ్గర నుంచి
  rationale: నోవహు సన్నిధి నుంచి దూరంగా పంపడమనే భావాన్ని నిలుపుతుంది; మూలంలో లేని ‘ఓడలో నుంచి’ అనే వివరణను చేర్చదు.
- source_word: לִרְאוֹת
  choice: చూడడానికి
  rationale: ראה క్రియారూపం ఉద్దేశాన్ని తెలియజేస్తుంది; ‘చూడడానికి’ నేరుగా, సహజంగా ఉంది.
- source_word: הֲקַלּוּ
  choice: తగ్గాయేమో
  rationale: ఇక్కడ קלל జలాలు తగ్గడం లేదా క్షీణించడం అనే అర్థం ఇస్తుంది. ప్రశ్నార్థక הֲ భావాన్ని తెలుగు పరోక్ష ప్రశ్నలో ‘ఏమో’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: הַמַּיִם
  choice: నీళ్లు
  rationale: ఆధునిక సాధారణ తెలుగులో వరదనీటిని సూచించడానికి ‘నీళ్లు’ సహజమైన బహువచన రూపం.
- source_word: מֵעַל פְּנֵי הָאֲדָמָה
  choice: నేల ఉపరితలం మీద నుంచి
  rationale: ‘నేల ముఖం మీద నుంచి’ అనే హీబ్రూ స్థలరూపకాన్ని స్పష్టమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; אֲדָמָהకు ఇక్కడ ‘భూమి’ కంటే ‘నేల’ సందర్భోచితం.
