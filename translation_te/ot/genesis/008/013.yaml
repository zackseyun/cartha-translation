id: GEN.8.13
reference: Genesis 8:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַֽ֠/יְהִי בְּ/אַחַ֨ת וְ/שֵׁשׁ מֵא֜וֹת שָׁנָ֗ה בָּֽ/רִאשׁוֹן֙ בְּ/אֶחָ֣ד לַ/חֹ֔דֶשׁ חָֽרְב֥וּ הַ/מַּ֖יִם מֵ/עַ֣ל הָ/אָ֑רֶץ וַ/יָּ֤סַר נֹ֨חַ֙ אֶת מִכְסֵ֣ה הַ/תֵּבָ֔ה וַ/יַּ֕רְא וְ/הִנֵּ֥ה חָֽרְב֖וּ פְּנֵ֥י הָֽ/אֲדָמָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/013.yaml
  text: And it came about in the six hundred and first year[a], in the first month, on the first day of the month, that the waters had dried up from upon the earth. Then Noah removed the covering of the ark and looked, and behold[c][b], the surface of the ground was dry.
translation:
  language: te
  text: ఆరు వందల ఒకటవ సంవత్సరంలో[a], మొదటి నెల మొదటి రోజున, భూమి మీదున్న నీళ్లు ఎండిపోయాయి. అప్పుడు నోవహు ఓడ కప్పును[b] తొలగించి చూడగా, ఇదిగో, నేల ఉపరితలం ఎండిపోయి ఉంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: సందర్భం ప్రకారం ఇది నోవహు జీవితంలోని 601వ సంవత్సరాన్ని సూచిస్తుంది; అయితే ఈ వచనంలో అది స్పష్టంగా చెప్పబడలేదు.
    reason: contextual_ambiguity
  - marker: b
    text: లేదా, ‘ఓడ పైకప్పును.’ హీబ్రూ పదం సాధారణంగా ‘కప్పు’ అని అర్థమిస్తుంది; అది ఓడ నిర్మాణంలో ఏ భాగమో మరింత నిర్దిష్టంగా చెప్పదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: '[కాల సూచనతో నేరుగా వాక్యారంభం]'
  rationale: ఇది కాలవివరాన్ని పరిచయం చేసే హీబ్రూ కథన రూపం. తెలుగులో ప్రత్యేకంగా ‘అలా జరిగింది’ అని చేర్చకుండా కాలవాచకంతో ప్రారంభించడం సహజంగా కథన కొనసాగింపును తెలియజేస్తుంది.
- source_word: בְּאַחַת וְשֵׁשׁ מֵאוֹת שָׁנָה
  choice: ఆరు వందల ఒకటవ సంవత్సరంలో
  rationale: హీబ్రూ అక్షరార్థంగా ‘ఒకటి మరియు ఆరు వందల సంవత్సరం’ అని ఉన్నా, అది 601వ సంవత్సరాన్ని సూచించే సంఖ్యా ప్రయోగం. తెలుగు క్రమసంఖ్యా రూపం సహజంగా ఉంది; అది ఎవరి సంవత్సరమో మూలవాక్యం స్పష్టంగా చెప్పదు.
- source_word: בָּרִאשׁוֹן בְּאֶחָד לַחֹדֶשׁ
  choice: మొదటి నెల మొదటి రోజున
  rationale: హీబ్రూ కాలదర్శక ప్రయోగాన్ని స్పష్టమైన, సహజమైన తెలుగు తేదీ రూపంలో వ్యక్తం చేస్తుంది.
- source_word: חָרְבוּ הַמַּיִם מֵעַל הָאָרֶץ
  choice: భూమి మీదున్న నీళ్లు ఎండిపోయాయి
  rationale: חרב ఇక్కడ ఎండిపోవడాన్ని సూచిస్తుంది; מֵעַל భావాన్ని ‘భూమి మీదున్న’ అని సహజంగా నిలుపుతుంది.
- source_word: וַיָּסַר
  choice: తొలగించి
  rationale: హిఫీల్ రూపం ‘తీసివేయడం/తొలగించడం’ అనే కారణార్థక భావాన్ని ఇస్తుంది; సందర్భంలో ‘తొలగించి’ సంక్షిప్తంగా, సహజంగా ఉంది.
- source_word: מִכְסֵה הַתֵּבָה
  choice: ఓడ కప్పును
  rationale: מִכְסֵה సాధారణంగా కప్పే వస్తువును సూచిస్తుంది. ‘పైకప్పు’ అని నిర్మాణాన్ని మరీ నిర్దిష్టం చేయకుండా ‘కప్పు’ మూలంలోని విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: וַיַּרְא וְהִנֵּה
  choice: చూడగా, ఇదిగో
  rationale: ‘చూడగా’ నోవహు చేసిన పరిశీలనను, ‘ఇదిగో’ וְהִנֵּה యొక్క దృష్టిని ఆకర్షించే కథన బలాన్ని తెలుగులో సహజంగా అందిస్తాయి.
- source_word: חָרְבוּ פְּנֵי הָאֲדָמָה
  choice: నేల ఉపరితలం ఎండిపోయి ఉంది
  rationale: פְּנֵי యొక్క ‘ముఖం/ఉపరితలం’ భావాన్ని సందర్భానుసారంగా ‘ఉపరితలం’గా, אֲדָמָהను ముందున్న אֶרֶץతో భేదిస్తూ ‘నేల’గా అనువదిస్తుంది.
theological_decisions:
- issue: ఆరు వందల ఒకటవ సంవత్సరం దేనికి సంబంధించినదో
  choice: ప్రధాన పాఠ్యంలో సంబంధాన్ని పేర్కొనకుండా ఉంచడం
  alternative: ‘నోవహు జీవితంలోని ఆరు వందల ఒకటవ సంవత్సరంలో’
  rationale: సందర్భం అది నోవహు వయస్సు లెక్క అని బలంగా సూచించినా, ఈ వచనం స్వయంగా ‘నోవహు జీవితంలోని’ అని చెప్పదు. అందువల్ల మూలంలోని అంతర్లీనతను ప్రధాన పాఠ్యం కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘ఇదిగో’ అనే పదం మూలంలోని దృష్టి ఆకర్షించే బలాన్ని నిలుపుతూ కొద్దిగా ఉన్నతమైన బైబిలు కథన స్వరాన్ని ఇస్తుంది.
