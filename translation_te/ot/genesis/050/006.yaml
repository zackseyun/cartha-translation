review_pass:
  verdict: revise
  source_fidelity: The draft accurately identifies Pharaoh, the causative force of הִשְׁבִּיעֶךָ (‘made you swear’), and the burial command. However, it omits the directional nuance of עֲלֵה (‘go up’), and its wording ‘నీ తండ్రి నీ చేత ప్రమాణం చేయించిన ప్రకారం’ is syntactically awkward in Telugu.
  naturalness: The present sentence is broadly understandable, but ‘నీ చేత ప్రమాణం చేయించిన ప్రకారం’ sounds compressed and can momentarily obscure who caused whom to swear. ‘నీ తండ్రి నీతో ప్రమాణం చేయించినట్లుగా’ is clear, idiomatic modern Telugu. Retaining ‘పైకి’ naturally preserves the Hebrew directional expression in this travel context.
  terminology: ‘ఫరో’ and ‘పాతిపెట్టు’ are suitable in modern standard Telugu. ‘ప్రమాణం చేయించిన’ appropriately renders the Hiphil causative. ‘నీ తండ్రిని’ avoids an unnecessary pronoun shift while retaining the Hebrew object clearly.
  issues:
  - severity: medium
    issue: The directional element in עֲלֵה is not represented.
    rationale: The Hebrew explicitly says ‘go up.’ In this context, ‘పైకి వెళ్లి’ is natural Telugu and preserves the source nuance without forcing an unnatural geographic explanation.
  - severity: medium
    issue: The oath clause is awkwardly phrased and lacks a clear comparative connection.
    rationale: ‘నీ తండ్రి నీ చేత ప్రమాణం చేయించిన ప్రకారం’ is less idiomatic and can be parsed awkwardly. ‘నీ తండ్రి నీతో ప్రమాణం చేయించినట్లుగా’ clearly expresses that the father caused Joseph to swear, matching the Hiphil and כַּאֲשֶׁר.
  - severity: low
    issue: The lexical alternative reflected in the English audit trail has no Telugu footnote anchor.
    rationale: Adding a restrained alternative for the oath expression preserves the audit-trail option and supplies a matching anchor without altering the main text.
