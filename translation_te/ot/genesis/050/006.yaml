reference: Genesis 50:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֖אמֶר פַּרְעֹ֑ה עֲלֵ֛ה וּ/קְבֹ֥ר אֶת אָבִ֖י/ךָ כַּ/אֲשֶׁ֥ר הִשְׁבִּיעֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/006.yaml
  text: And Pharaoh said[a], “Go up and bury your father, as he made you swear.”
translation:
  language: te
  text: అప్పుడు ఫరో, “నీ తండ్రి నీతో ప్రమాణం చేయించినట్లుగా[a] పైకి వెళ్లి, నీ తండ్రిని పాతిపెట్టు” అని చెప్పాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీపై ప్రమాణం పెట్టినట్లుగా.”
    reason: హెబ్రీ హిఫిల్ క్రియకు ‘ప్రమాణం చేయించాడు’తో పాటు ‘ప్రమాణబద్ధునిగా చేశాడు/ప్రమాణం పెట్టాడు’ అనే భావాన్ని సూచించే సహజ ప్రత్యామ్నాయం.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... చెప్పాడు
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది; ఆధునిక తెలుగులో ‘అప్పుడు’ సహజంగా ఆ ప్రవాహాన్ని తెలియజేస్తుంది.
- source_word: פַּרְעֹה
  choice: ఫరో
  rationale: ఈజిప్టు పాలకునికి తెలుగులో స్థిరపడిన బిరుదు/లిప్యంతరీకరణ.
- source_word: עֲלֵה
  choice: వెళ్లి
  rationale: పదశః ‘పైకి వెళ్లు’ అయినప్పటికీ, ఈ సందర్భంలో ఈజిప్టు నుండి కనానుకు ప్రయాణించడాన్ని సూచిస్తుంది; తెలుగులో ‘పైకి వెళ్లి’ అసహజంగా లేదా భౌగోళిక ఎత్తును మాత్రమే సూచించినట్లు ఉండవచ్చు కాబట్టి సహజమైన దిశార్థక రూపం ఎంచుకోబడింది.
- source_word: וּקְבֹר
  choice: పాతిపెట్టు
  rationale: మృతదేహాన్ని సమాధి చేయడాన్ని సాధారణ ఆధునిక తెలుగులో స్పష్టంగా తెలిపే క్రియ.
- source_word: אֶת אָבִיךָ
  choice: నీ తండ్రిని / అతన్ని
  rationale: ప్రత్యక్ష కర్మను మొదట ‘నీ తండ్రి’గా తెలిపి, తెలుగు వాక్యనిర్మాణంలో ప్రమాణపు ఉపవాక్యం తరువాత ‘అతన్ని’తో తిరిగి సూచించడం స్పష్టతను ఇస్తుంది.
- source_word: כַּאֲשֶׁר
  choice: '... ప్రకారం'
  rationale: ఫరో ఇచ్చిన అనుమతి యాకోబు చేయించిన ప్రమాణానికి అనుగుణంగా ఉందనే భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: הִשְׁבִּיעֶךָ
  choice: నీ చేత ప్రమాణం చేయించిన
  rationale: హిఫిల్ రూపంలోని కారణార్థాన్ని—అతడు యోసేపుతో ప్రమాణం చేయించాడు—స్పష్టంగా నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. హెబ్రీ కారణార్థాన్ని స్పష్టంగా ఉంచుతూ, తెలుగులో అసహజమైన పదశః దిశా ప్రయోగాన్ని నివారించింది.
