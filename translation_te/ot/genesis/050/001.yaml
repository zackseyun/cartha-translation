  text: וַ/יִּפֹּ֥ל יוֹסֵ֖ף עַל פְּנֵ֣י אָבִ֑י/ו וַ/יֵּ֥בְךְּ עָלָ֖י/ו וַ/יִּשַּׁק לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/001.yaml
  text: Then Joseph fell on his father's face and wept over him and kissed him[a].
translation:
  language: te
  text: అప్పుడు యోసేపు తన తండ్రి ముఖం మీద పడి, ఆయన మీద ఏడ్చి, ఆయనను ముద్దుపెట్టుకున్నాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తన తండ్రి ముఖం మీద వాలిపడి”; హీబ్రూ మాటలలోని సజీవమైన శారీరక దృశ్యాన్ని ఇది మరింత స్పష్టంగా తెలియజేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפֹּל
  choice: పడి
  rationale: נפל క్రియ యొక్క ప్రత్యక్ష అర్థాన్ని నిలుపుతూ, కథనంలోని పూర్తయిన గత చర్యను సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: עַל פְּנֵי אָבִיו
  choice: తన తండ్రి ముఖం మీద
  rationale: హీబ్రూలోని స్పష్టమైన శారీరక దృశ్యాన్ని, ముఖ్యంగా ‘ముఖం’ అనే పదాన్ని, వ్యాఖ్యానంతో మసకబార్చకుండా నిలుపుతుంది.
- source_word: וַיֵּבְךְּ עָלָיו
  choice: ఆయన మీద ఏడ్చి
  rationale: בכה అంటే ఏడవడం/రోదించడం. עַל తో ఉన్న నిర్మాణాన్ని సాధ్యమైనంత దగ్గరగా నిలుపుతూ, మరణించిన తండ్రి దేహం మీద వాలి ఏడ్చిన సందర్భాన్ని తెలియజేస్తుంది.
- source_word: וַיִּשַּׁק לוֹ
  choice: ఆయనను ముద్దుపెట్టుకున్నాడు
  rationale: נשק క్రియకు సహజమైన ఆధునిక తెలుగు సమానార్థకం; హీబ్రూ ל־ సూచించిన వ్యక్తిని తెలుగులో ప్రత్యక్ష కర్మగా వ్యక్తపరుస్తుంది.
- source_word: יוֹסֵף
  choice: యోసేపు
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
