id: GEN.50.17
reference: Genesis 50:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כֹּֽה תֹאמְר֣וּ לְ/יוֹסֵ֗ף אָ֣נָּ֡א שָׂ֣א נָ֠א פֶּ֣שַׁע אַחֶ֤י/ךָ וְ/חַטָּאתָ/ם֙ כִּי רָעָ֣ה גְמָל֔וּ/ךָ וְ/עַתָּה֙ שָׂ֣א נָ֔א לְ/פֶ֥שַׁע עַבְדֵ֖י אֱלֹהֵ֣י אָבִ֑י/ךָ וַ/יֵּ֥בְךְּ יוֹסֵ֖ף בְּ/דַבְּרָ֥/ם אֵלָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/017.yaml
  text: 'This is what you shall say to Yosef: ‘Please forgive the transgression of your brothers and their sin, because they repaid you with evil. And now, please forgive the transgression of the servants of the God of your father.’ And Yosef wept when they spoke to him.'
translation:
  language: te
  text: '“మీరు యోసేపుతో ఇలా చెప్పాలి: ‘దయచేసి నీ సహోదరుల అపరాధాన్నీ, వారి పాపాన్నీ క్షమించు; ఎందుకంటే వారు నీకు కీడు చేశారు. ఇప్పుడు దయచేసి నీ తండ్రి దేవుని సేవకుల అపరాధాన్ని క్షమించు.’” వారు యోసేపుతో ఈ మాటలు చెప్పినప్పుడు యోసేపు ఏడ్చాడు.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׂא נָא
  choice: దయచేసి ... క్షమించు
  rationale: ‘ఎత్తివేయు/భరించు’ అనే మూల చిత్రణ ఈ సందర్భంలో అపరాధాన్ని క్షమించమనే విన్నపాన్ని సూచిస్తుంది; נָא లోని వేడుకోలును ‘దయచేసి’ నిలుపుతుంది.
- source_word: פֶּשַׁע
  choice: అపరాధం
  rationale: తెలిసీ చేసిన తిరుగుబాటు లేదా ద్రోహ స్వభావమున్న తప్పును సూచించే పదం; సాధారణ ‘తప్పు’ కంటే ‘అపరాధం’ తగిన బరువును కలిగి ఉంది.
- source_word: חַטָּאת
  choice: పాపం
  rationale: నైతిక దోషాన్ని సూచించే సాధారణ బైబిలీయ పదానికి సహజమైన తెలుగు సమానం.
- source_word: רָעָה גְמָלוּךָ
  choice: వారు నీకు కీడు చేశారు
  rationale: గమల్ పదానికి ‘ప్రతిఫలంగా చేశారు/తిరిగి చేశారు’ అనే ఛాయ ఉన్నా, మొత్తం నుడికారం యోసేపుపట్ల వారు చేసిన కీడును సహజ తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: אֱלֹהֵי אָבִיךָ
  choice: నీ తండ్రి దేవుడు
  rationale: ఏకవచన సంబంధాన్ని, యాకోబుతో దేవుని అనుబంధాన్ని నేరుగా నిలుపుతుంది.
- source_word: בְּדַבְּרָם אֵלָיו
  choice: వారు తనతో ఈ మాటలు చెప్పినప్పుడు
  rationale: బహువచన కర్తను నిలుపుతూ, సందర్భానికి సహజమైన తెలుగును అందిస్తుంది; సందేశం నేరుగా పలికారా, చేరవేశారా అన్న విషయాన్ని మించి నిర్ధారించదు.
theological_decisions:
- issue: సహోదరుల గుర్తింపు మరియు దేవుని సేవకుల గుర్తింపు
  choice: రెండు వర్ణనలనూ మూలంలోని విధంగానే విడిగా ఉంచడం
  alternative: ‘నీ సహోదరులమైన, నీ తండ్రి దేవుని సేవకులమైన మా అపరాధాన్ని’ అని వాటిని స్పష్టంగా ఒకే సమూహంగా కలపడం
  rationale: సందర్భంలో అవి ఒకే వ్యక్తులను సూచించినా, హీబ్రూ వాక్యం రెండు వరుస విన్నపాలుగా ఉన్న నిర్మాణాన్ని కాపాడడం వ్యాఖ్యానాత్మక సమీకరణను నివారిస్తుంది.
- issue: כִּי యొక్క భావం
  choice: ఎందుకంటే
  alternative: అయినప్పటికీ / వారు నీకు కీడు చేసినందుకు
  rationale: మూలంలోని సాధారణ కారణార్థక సంబంధాన్ని నిలుపుతుంది; వారి కీడు క్షమాపణ విన్నపానికి నేపథ్య కారణంగా చెప్పబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనదైనా సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ‘సహోదరులు’, ‘అపరాధం’, ‘పాపం’ వంటి బైబిలీయ పదాలను సహజ వాక్యనిర్మాణంతో ఉపయోగించాం. మూలంలో లేని వివరణలను చేర్చలేదు.
