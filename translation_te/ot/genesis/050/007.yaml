- from: కాబట్టి యోసేపు తన తండ్రిని పాతిపెట్టడానికి పైకి వెళ్లాడు[a]. అతనితోపాటు ఫరో సేవకులందరూ, అతని రాజగృహంలోని పెద్దలు, ఐగుప్తు దేశపు పెద్దలందరూ పైకి వెళ్లారు.
  to: యోసేపు తన తండ్రిని పాతిపెట్టడానికి పైకి వెళ్లాడు[a]. అతనితో పాటు ఫరో సేవకులందరూ, ఫరో రాజగృహంలోని పెద్దలు, ఐగుప్తు దేశపు పెద్దలందరూ పైకి వెళ్లారు.
