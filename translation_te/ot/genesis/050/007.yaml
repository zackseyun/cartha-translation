  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּ֥עַל יוֹסֵ֖ף לִ/קְבֹּ֣ר אֶת אָבִ֑י/ו וַ/יַּֽעֲל֨וּ אִתּ֜/וֹ כָּל עַבְדֵ֤י פַרְעֹה֙ זִקְנֵ֣י בֵית֔/וֹ וְ/כֹ֖ל זִקְנֵ֥י אֶֽרֶץ מִצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/007.yaml
  text: So Joseph went up to bury his father[a], and with him went up all Pharaoh’s servants, the elders of his household, and all the elders of the land of Egypt.
translation:
  language: te
  text: యోసేపు తన తండ్రిని పాతిపెట్టడానికి పైకి వెళ్లాడు[a]. అతనితో పాటు ఫరో సేవకులందరూ, ఫరో రాజగృహంలోని పెద్దలు, ఐగుప్తు దేశపు పెద్దలందరూ పైకి వెళ్లారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “పైకి వెళ్లాడు” అనేది ఐగుప్తు నుండి కనాను దేశానికి చేసే ప్రయాణాన్ని వర్ణించే హీబ్రూ నుడికారం.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַל
  choice: పైకి వెళ్లాడు
  rationale: עָלָה అనే క్రియలోని ‘పైకి వెళ్లడం’ అనే భౌగోళిక నుడికారాన్ని నిలుపుతుంది; ఇక్కడ ప్రయాణం ఐగుప్తు నుండి కనానుకు సాగుతుంది.
- source_word: לִקְבֹּר
  choice: పాతిపెట్టడానికి
  rationale: קָבַר అనే క్రియకు సందర్భానుసారమైన సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: אָבִיו
  choice: తన తండ్రిని
  rationale: హీబ్రూ స్వామ్య ప్రత్యయాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; మూలంలో లేని అదనపు ఉద్ఘాటనను చేర్చదు.
- source_word: וַיַּעֲלוּ אִתּוֹ
  choice: అతనితోపాటు ... పైకి వెళ్లారు
  rationale: మూలంలోని עָלָה పునరావృతిని, కథన లయను, భౌగోళిక నుడికారాన్ని కాపాడుతుంది.
- source_word: כָּל עַבְדֵי פַרְעֹה
  choice: ఫరో సేవకులందరూ
  rationale: עֶבֶד యొక్క విస్తృత అర్థాన్ని ‘సేవకులు’ నిలుపుతుంది; వారిని కేవలం అధికారులుగా లేదా బానిసలుగా అతిగా నిర్దిష్టీకరించదు.
- source_word: זִקְנֵי בֵיתוֹ
  choice: అతని రాజగృహంలోని పెద్దలు
  rationale: זָקֵן ను ‘పెద్దలు’గా నిలుపుతూ, בַּיִת ఇక్కడ ఫరో రాజగృహం లేదా రాజపరివార వ్యవస్థను సూచిస్తుందని సహజంగా తెలియజేస్తుంది.
- source_word: וְכֹל זִקְנֵי אֶרֶץ מִצְרָיִם
  choice: ఐగుప్తు దేశపు పెద్దలందరూ
  rationale: ‘పెద్దలు’ మరియు ‘దేశం’ అనే రెండు మూల అంశాలనూ సంక్షిప్తమైన సహజ తెలుగులో కాపాడుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘పైకి వెళ్లాడు/వెళ్లారు’ అనే పునరావృతిని మూల హీబ్రూ భౌగోళిక నుడికారం మరియు లయ కోసం ఉద్దేశపూర్వకంగా నిలిపాం; ‘రాజగృహం’ సాధారణ నివాసగృహం కంటే ఫరోకు చెందిన రాజపరివార వ్యవస్థను స్పష్టంగా సూచిస్తుంది.
