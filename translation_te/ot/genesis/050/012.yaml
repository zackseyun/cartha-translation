id: GEN.50.12
reference: Genesis 50:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּעֲשׂ֥וּ בָנָ֖י/ו ל֑/וֹ כֵּ֖ן כַּ/אֲשֶׁ֥ר צִוָּֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/012.yaml
  text: So his sons did for him as he had commanded them.
translation:
  language: te
  text: అతని కుమారులు అతడు తమకు ఆజ్ఞాపించినట్టే అతని కోసం చేశారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: చేశారు
  rationale: עשה అనే క్రియకు ‘చేయు/నెరవేర్చు’ అనే విస్తృత అర్థం ఉంది. ఇక్కడ యాకోబు ఇచ్చిన ఆదేశాలను అమలు చేయడాన్ని సహజంగా తెలియజేయడానికి ‘చేశారు’ సరిపోతుంది.
- source_word: בָנָיו
  choice: అతని కుమారులు
  rationale: హీబ్రూ పదం ప్రత్యేకంగా ‘అతని కుమారులు’ అని చెబుతోంది; అందువల్ల లింగనిర్దిష్టతను నిలుపుకున్నాం.
- source_word: לוֹ
  choice: అతని కోసం
  rationale: לֹו ఇక్కడ యాకోబు తరఫున, అతని విషయంగా అంత్యక్రియల ఏర్పాట్లు చేయడాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘అతని కోసం’ సహజంగా ఉంటుంది.
- source_word: כֵּן כַּאֲשֶׁר
  choice: ఆజ్ఞాపించినట్టే
  rationale: כֵּן మరియు כַּאֲשֶׁר కలిసి కుమారుల చర్య యాకోబు ఆజ్ఞకు సరిగ్గా అనుగుణంగా జరిగిందని సూచిస్తున్నాయి. ‘-ట్టే’ ఆ భావాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: צִוָּם
  choice: అతడు తమకు ఆజ్ఞాపించిన
  rationale: צוה అంటే ‘ఆజ్ఞాపించు.’ కుమారుల దృష్టికోణాన్ని ప్రతిబింబించేలా తెలుగులో ‘తమకు’ వాడటం సహజం; సందర్భం ఆ ఆజ్ఞ చర్యకు ముందే ఇవ్వబడిందని స్పష్టం చేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని సంక్షిప్తతను నిలుపుతూ, ‘అతని కోసం’ మరియు ‘ఆజ్ఞాపించినట్టే’ ద్వారా సంబంధాలను స్పష్టంగా వ్యక్తం చేశాం.
