- from: అతని కోసం ఏడ్చే రోజులు ముగిసినప్పుడు[a], యోసేపు ఫరో ఇంటివారితో, “మీ దృష్టిలో నాకు దయ దొరికితే, దయచేసి ఫరో చెవిన ఈ మాట వేయండి[b]:” అని అన్నాడు.
  to: 'అతని కోసం విలపించిన రోజులు గడిచిన తర్వాత[a], యోసేపు ఫరో ఇంటివారితో ఇలా చెప్పాడు: “మీ దృష్టిలో నాకు అనుగ్రహం లభించి ఉంటే, దయచేసి ఫరో వినేలా ఇలా చెప్పండి[b]:”'
  rationale: సవరణ మూలంలోని సంభాషణ దిశను (‘ఫరో ఇంటివారిని ఉద్దేశించి’) స్పష్టపరుస్తుంది మరియు రెండవ ‘చెప్పుటకు’ పదం ద్వారా మొదలై తదుపరి వచనంలో కొనసాగుతున్న సందేశాన్ని తెరిచి ఉంచుతుంది. విలాపానికి సంబంధించిన హెబ్రీయ పదార్థాన్ని ప్రధాన పాఠంలో సహజంగా, పాదటిప్పణిలో మరింత అక్షరానుసారంగా అందించింది.
