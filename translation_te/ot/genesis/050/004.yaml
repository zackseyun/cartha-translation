  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే కథన శైలి. వాక్యం తదుపరి వచనంలో కొనసాగుతుందని చివర ద్విబిందువు సూచిస్తుంది; మూలంలోని వినయపూర్వక రాజసభా సంభాషణను నిలిపింది.
