source:
  edition: WLC
  text: וַ/יַּֽעַבְרוּ֙ יְמֵ֣י בְכִית֔/וֹ וַ/יְדַבֵּ֣ר יוֹסֵ֔ף אֶל בֵּ֥ית פַּרְעֹ֖ה לֵ/אמֹ֑ר אִם נָ֨א מָצָ֤אתִי חֵן֙ בְּ/עֵ֣ינֵי/כֶ֔ם דַּבְּרוּ נָ֕א בְּ/אָזְנֵ֥י פַרְעֹ֖ה לֵ/אמֹֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/004.yaml
  text: When the days of his mourning had passed[a], Joseph spoke to Pharaoh’s household, saying, “If I have now found favor in your eyes, please speak in Pharaoh’s hearing[b], saying,”
translation:
  language: te
  text: 'అతని కోసం విలపించిన రోజులు గడిచిన తర్వాత[a], యోసేపు ఫరో ఇంటివారితో ఇలా చెప్పాడు: “మీ దృష్టిలో నాకు అనుగ్రహం లభించి ఉంటే, దయచేసి ఫరో వినేలా ఇలా చెప్పండి[b]:”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “అతని ఏడుపు రోజులు”; సందర్భానుసారం, అతని కోసం చేసిన విలాప దినాలు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “ఫరో చెవుల్లో మాట్లాడండి”; అంటే ఫరో వినేలా చెప్పండి.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַבְרוּ
  choice: ముగిసినప్పుడు
  rationale: కాలదినాలు గడిచిపోవడం లేదా పూర్తికావడం అనే עבר భావాన్ని సహజమైన తెలుగు కథన క్రమంలో వ్యక్తపరుస్తుంది.
- source_word: יְמֵי בְכִיתוֹ
  choice: అతని కోసం ఏడ్చే రోజులు
  rationale: בכי యొక్క ప్రాథమిక అర్థమైన ‘ఏడుపు’ను, ־וֹ ను మరణించిన యాకోబును సూచించే కర్మార్థక భావంగా నిలుపుతుంది; ‘దుఃఖదినాలు’ కూడా సందర్భానుకూల ప్రత్యామ్నాయం.
- source_word: אֶל־בֵּית פַּרְעֹה
  choice: ఫరో ఇంటివారితో
  rationale: בית ఇక్కడ భవనాన్ని కాక రాజగృహానికి చెందిన పరివారాన్ని సూచిస్తుంది; ‘ఇంటివారు’ హెబ్రీయ రూపకాన్ని సహజ తెలుగులో నిలుపుతుంది.
- source_word: אִם־נָא מָצָאתִי חֵן בְּעֵינֵיכֶם
  choice: మీ దృష్టిలో నాకు దయ దొరికితే
  rationale: ‘కళ్లలో కృప దొరకడం’ అనే హెబ్రీయ మర్యాదపూర్వక విజ్ఞాపనను తెలుగులో పారదర్శకమైన సమానార్థక నుడికారంతో అందిస్తుంది.
- source_word: דַּבְּרוּ־נָא
  choice: దయచేసి … ఈ మాట వేయండి
  rationale: బహువచన ఆజ్ఞతో కూడిన נָא యొక్క వినయపూర్వక విజ్ఞాపనను ‘దయచేసి’ ద్వారా స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: בְּאָזְנֵי פַרְעֹה
  choice: ఫరో చెవిన
  rationale: అక్షరార్థంగా ‘ఫరో చెవుల్లో’; అతడు వినేలా తెలియజేయడం అనే నుడికారాన్ని తెలుగు ‘చెవిన వేయడం’ సహజంగా నిలుపుతుంది.
- source_word: לֵאמֹר
  choice: అని అన్నాడు / ఈ మాట
  rationale: మొదటి quotative infinitive ను తెలుగు ప్రత్యక్ష వాక్య నిర్మాణంలో ‘అని అన్నాడు’గా, రెండవదాన్ని తదుపరి వచనంలో కొనసాగే సందేశానికి ‘ఈ మాట’గా వ్యక్తపరుస్తుంది.
