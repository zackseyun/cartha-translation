source:
  edition: WLC
  text: וַ/יַּשְׁבַּ֣ע יוֹסֵ֔ף אֶת בְּנֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר פָּקֹ֨ד יִפְקֹ֤ד אֱלֹהִים֙ אֶתְ/כֶ֔ם וְ/הַעֲלִתֶ֥ם אֶת עַצְמֹתַ֖/י מִ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/025.yaml
  text: Then Joseph made the sons of Israel swear, saying, “God will surely attend to you, and you must bring up my bones from here.”
translation:
  language: te
  text: అప్పుడు యోసేపు ఇశ్రాయేలు కుమారుల చేత ప్రమాణం చేయించి, “దేవుడు తప్పకుండా మిమ్మల్ని సందర్శిస్తాడు; మీరు నా ఎముకలను ఇక్కడినుండి పైకి తీసుకెళ్లాలి” అని చెప్పాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּשְׁבַּע ... אֶת־בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులతో ప్రమాణం చేయిస్తూ
  rationale: హిఫీల్ రూపం యోసేపు వారిచేత ప్రమాణం చేయించిన భావాన్ని ఇస్తుంది; తెలుగులో సహజంగా వ్యక్తపరచబడింది.
- source_word: פָּקֹד יִפְקֹד
  choice: తప్పకుండా ... పట్టించుకుంటాడు
  rationale: ఇన్ఫినిటివ్ అబ్సల్యూట్‌తో కూడిన క్రియ నిశ్చయాన్ని బలపరుస్తుంది. פקד ఇక్కడ దేవుడు తన ప్రజల పరిస్థితిని గమనించి వారి పక్షంగా కార్యం చేయడాన్ని సూచిస్తుంది; 'పట్టించుకుంటాడు' ఈ సందర్భంలో సహజంగా ఆ భావాన్ని నిలుపుతుంది.
- source_word: וְהַעֲלִתֶם
  choice: అప్పుడు మీరు ... తీసుకెళ్లాలి
  rationale: సంయోజక వావ్ సందర్భానుసార ఫలిత/కాల సంబంధాన్ని సూచిస్తుంది; హిఫీల్ రూపంలోని పైకి తీసుకెళ్లే భావాన్ని గమ్యం పేర్కొనని తెలుగులో సహజంగా 'తీసుకెళ్లాలి'గా ఇచ్చాం.
- source_word: עַצְמֹתַי
  choice: నా ఎముకలను
  rationale: మూలంలోని ప్రత్యక్ష శారీరక పదప్రయోగాన్ని యథాతథంగా నిలుపుతుంది.
theological_decisions:
- issue: פקד అనే క్రియలోని దైవిక చర్య
  choice: పట్టించుకుంటాడు
  alternative: సందర్శిస్తాడు / జ్ఞాపకం చేసుకుంటాడు
  rationale: ఇది కేవలం వచ్చి చూడటం లేదా మానసికంగా గుర్తుచేసుకోవడం కాదు; దేవుడు ఇశ్రాయేలీయుల అవసరాన్ని గమనించి వారి విమోచన కోసం కార్యం చేస్తాడనే విస్తృత భావాన్ని కలిగి ఉంది. అయినా విమోచనను నేరుగా చేర్చి మూలాన్ని అధికంగా వివరణ చేయలేదు.
- issue: וְהַעֲלִתֶם యొక్క బలార్థం
  choice: తీసుకెళ్లాలి
  alternative: తీసుకెళ్తారు
  rationale: ప్రమాణం చేయించిన సందర్భంలో ఇది సాధారణ భవిష్యవాణికంటే బద్ధతను సూచిస్తుంది; అందువల్ల తెలుగులో విధిబోధక రూపం సముచితం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సులభంగా అర్థమయ్యే శైలి. 'ఇశ్రాయేలు కుమారులు' అనే మూలానికి సమీపమైన సామూహిక సంబోధనను నిలిపాం; వాక్య ప్రవాహం కోసం ప్రత్యక్ష వాక్యాన్ని రెండు వాక్యాలుగా విభజించాం.
