id: GEN.50.20
reference: Genesis 50:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אַתֶּ֕ם חֲשַׁבְתֶּ֥ם עָלַ֖/י רָעָ֑ה אֱלֹהִים֙ חֲשָׁבָ֣/הּ לְ/טֹבָ֔ה לְמַ֗עַן עֲשֹׂ֛ה כַּ/יּ֥וֹם הַ/זֶּ֖ה לְ/הַחֲיֹ֥ת עַם רָֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/020.yaml
  text: As for you[a], you intended evil against me, but God intended it for good, in order to bring about what is happening this day—to keep many people alive.
translation:
  language: te
  text: మీరు నాకు కీడు చేయాలని సంకల్పించారు; అయితే దేవుడు దానిని మేలుకోసం సంకల్పించాడు—నేడు కనిపిస్తున్న ఈ ఫలితాన్ని[a] కలుగజేయడానికి, అనేకమంది ప్రజలను సజీవంగా ఉంచడానికి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా మరింత అక్షరార్థంగా, “ఈ రోజున ఉన్నట్లుగా చేయడానికి.” హీబ్రూ నుడికారం ఇప్పుడు స్పష్టంగా కనిపిస్తున్న ప్రస్తుత ఫలితాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲשַׁבְתֶּם / חֲשָׁבָהּ
  choice: సంకల్పించారు / సంకల్పించాడు
  rationale: రెండు చోట్లా ఒకే మూలక్రియను వాడి, సహోదరుల చెడు ఉద్దేశానికీ దేవుని మంచి ఉద్దేశానికీ మధ్య హీబ్రూలో ఉన్న ఉద్దేశపూర్వక సమాంతరతను నిలుపుతుంది.
- source_word: עָלַי רָעָה
  choice: నాకు కీడు చేయాలని
  rationale: על యొక్క విరోధార్థక భావాన్నీ, רָעָהలోని హానికరమైన మరియు నైతికంగా తప్పైన ఉద్దేశాన్నీ సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: לְטֹבָה
  choice: మేలుకై
  rationale: ‘కీడు’తో ఉన్న స్పష్టమైన వ్యత్యాసాన్ని కాపాడుతూ, ప్రయోజనం లేదా లక్ష్యాన్ని సంక్షిప్తంగా సూచిస్తుంది.
- source_word: לְמַעַן עֲשֹׂה כַּיּוֹם הַזֶּה
  choice: నేడు కనిపిస్తున్న ఈ ఫలితాన్ని కలుగజేసి
  rationale: עשהను చారిత్రక ఫలితాన్ని కలుగజేయడంగా, כיום הזהను ఇప్పుడు ప్రత్యక్షంగా కనిపిస్తున్న పరిస్థితిని సూచించే నుడికారంగా వ్యక్తం చేస్తుంది.
- source_word: לְהַחֲיֹת עַם רָב
  choice: అనేకమందిని సజీవంగా ఉంచడానికి
  rationale: חיה హిఫీల్ రూపంలోని ప్రాణాలను కాపాడి నిలిపే భావాన్ని స్పష్టంగా తెలియజేస్తుంది; עם רבను సందర్భానుసారంగా పెద్ద సంఖ్యలో ప్రజలుగా అర్థం చేస్తుంది.
theological_decisions:
- issue: మానవ చెడు ఉద్దేశం మరియు దేవుని మేలైన ఉద్దేశం మధ్య దైవ పరిపాలన సంబంధం
  choice: సహోదరులకూ దేవునికీ ఒకే క్రియ అయిన ‘సంకల్పించు’ను వాడడం
  alternative: మనుషులు ‘కీడు తలపెట్టారు,’ దేవుడు దాన్ని ‘మేలుగా మార్చాడు’ అని వేర్వేరు క్రియలు వాడడం
  rationale: హీబ్రూ వాక్యం ఒకే חשב క్రియను రెండుసార్లు ఉద్దేశపూర్వకంగా వాడుతుంది. అందువల్ల మానవుల బాధ్యతను తగ్గించకుండా, అదే సంఘటనలో దేవుని మేలైన ఉద్దేశాన్ని కూడా నిలుపుతుంది; ‘మార్చాడు’ అని అనువదిస్తే మూలంలోని సమాంతరత, ఉద్రిక్తత తగ్గిపోతాయి.
- issue: רָעָה యొక్క నైతిక భావం
  choice: కీడు
  alternative: హాని
  rationale: సహోదరుల చర్య కేవలం దురదృష్టకరమైనది కాదు, నైతికంగా తప్పైనదీ కావడంతో ‘కీడు’ ఆ బరువును మెరుగ్గా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘సంకల్పించు’ కొంత గంభీరమైన పదమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యేది; ముఖ్యంగా మూలంలోని ఒకే క్రియ పునరుక్తిని నిలుపుతుంది. ఉద్దేశం స్పష్టంగా ఉండేందుకు చివరి వాక్యంలో ‘ఆయన అలా సంకల్పించాడు’ అని పునరుద్ఘాటించబడింది.
