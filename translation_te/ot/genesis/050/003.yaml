source:
  edition: WLC
  text: וַ/יִּמְלְאוּ ל/וֹ֙ אַרְבָּעִ֣ים י֔וֹם כִּ֛י כֵּ֥ן יִמְלְא֖וּ יְמֵ֣י הַ/חֲנֻטִ֑ים וַ/יִּבְכּ֥וּ אֹת֛/וֹ מִצְרַ֖יִם שִׁבְעִ֥ים יֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/003.yaml
  text: Forty days were completed for him[a], for that is how the days of embalming are completed[b]; and Egypt wept for him seventy days.
translation:
  language: te
  text: అతనికోసం నలభై రోజులు పూర్తయ్యాయి; ఎందుకంటే శవభద్రపరిచే ప్రక్రియకు నిర్ణయించిన రోజులు ఈ విధంగానే పూర్తవుతాయి.[a] ఐగుప్తీయులు అతనికోసం డెబ్బై రోజులు ఏడ్చారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “శవభద్రపరిచే రోజుల సంఖ్య ఈ విధంగా పూర్తవుతుంది.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּמְלְאוּ לוֹ
  choice: అతనికోసం ... పూర్తయ్యాయి
  rationale: מלא ఇక్కడ నిర్ణీత కాలం పూర్తికావడాన్ని సూచిస్తుంది. కర్త ఎవరో చెప్పకుండా, గడువు పూర్తయిందనే అంశాన్ని సహజమైన తెలుగులో ముందుకు తెస్తుంది.
- source_word: אַרְבָּעִים יוֹם
  choice: నలభై రోజులు
  rationale: సంఖ్యా పదబంధానికి నేరమైన, సహజమైన తెలుగు రూపం.
- source_word: כִּי כֵן
  choice: ఎందుకంటే ... అంతే
  rationale: ముందు చెప్పిన నలభై రోజుల కాలానికి కారణాన్ని వివరిస్తున్న హెబ్రీ పదబంధపు భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: יִמְלְאוּ יְמֵי הַחֲנֻטִים
  choice: శవానికి సుగంధ ద్రవ్యాలు పూసి భద్రపరిచే ప్రక్రియకు పట్టే రోజులు
  rationale: חנט సందర్భంలో శవాన్ని సుగంధ ద్రవ్యాలతో సిద్ధపరచి కుళ్లకుండా భద్రపరిచే ప్రక్రియను సూచిస్తుంది. సాధారణ పాఠకులకు అర్థమయ్యేలా ప్రక్రియను స్పష్టంగా తెలిపింది; ‘రోజులు పూర్తవుతాయి’ అనే పునరుక్తిని తెలుగులో ‘పట్టే రోజులు అంతే’గా సహజీకరించింది.
- source_word: וַיִּבְכּוּ אֹתוֹ
  choice: అతనికోసం ... ఏడ్చింది
  rationale: בכה యొక్క ప్రాథమిక భావమైన ‘ఏడవడం’ను నిలుపుతుంది; అధికారిక దుఃఖాచారాల భావాన్ని అదనంగా చేర్చదు.
- source_word: מִצְרַיִם
  choice: ఐగుప్తు
  rationale: హెబ్రీలో దేశనామమే సమష్టిగా ఆ దేశ ప్రజలను సూచిస్తుంది. ఆ రూపకాన్ని ప్రధాన పాఠ్యంలో నిలిపి, అర్థాన్ని పాదసూచికలో వివరిస్తుంది.
- source_word: שִׁבְעִים יוֹם
  choice: డెబ్బై రోజులు
  rationale: సంఖ్యా పదబంధానికి నేరమైన తెలుగు రూపం.
