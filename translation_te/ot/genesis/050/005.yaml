  text: אָבִ֞/י הִשְׁבִּיעַ֣/נִי לֵ/אמֹ֗ר הִנֵּ֣ה אָנֹכִי֮ מֵת֒ בְּ/קִבְרִ֗/י אֲשֶׁ֨ר כָּרִ֤יתִי לִ/י֙ בְּ/אֶ֣רֶץ כְּנַ֔עַן שָׁ֖מָּ/ה תִּקְבְּרֵ֑/נִי וְ/עַתָּ֗ה אֶֽעֱלֶה נָּ֛א וְ/אֶקְבְּרָ֥ה אֶת אָבִ֖/י וְ/אָשֽׁוּבָה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/005.yaml
  text: My father made me swear, saying, ‘Look, I am dying. In my grave that I dug for myself in the land of Canaan, there you shall bury me.’ So now, please let me go up and bury my father; then I will return.
translation:
  language: te
  text: '“నా తండ్రి నాతో ప్రమాణం చేయించాడు; ఆయన ఇలా అన్నాడు: ‘ఇదిగో, నేను మరణిస్తున్నాను. కనాను దేశంలో నా కోసం నేను తవ్వుకున్న సమాధిలోనే నన్ను అక్కడే పాతిపెట్టు.’ కాబట్టి ఇప్పుడు, దయచేసి, నేను వెళ్లి నా తండ్రిని పాతిపెట్టి తిరిగి రావడానికి నన్ను అనుమతించండి.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִשְׁבִּיעַנִי
  choice: నాతో ప్రమాణం చేయిస్తూ
  rationale: హిఫీల్ రూపంలోని ‘ప్రమాణం చేయించాడు’ అనే causative భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: הִנֵּה
  choice: చూడు
  rationale: మాటపై దృష్టి నిలిపే హీబ్రూ discourse marker‌ను ప్రత్యక్ష సంభాషణలో సహజంగా నిలుపుతుంది.
- source_word: כָּרִיתִי
  choice: తవ్వుకున్న
  rationale: మూల క్రియకు సాధారణంగా ‘తవ్వు’ అనే అర్థం ఉంది; సమాధిని సిద్ధం చేసుకున్నాడనే భావాన్ని అనవసర వివరణ లేకుండా ఇస్తుంది.
- source_word: אֶעֱלֶה נָּא
  choice: దయచేసి నన్ను వెళ్లనివ్వండి
  rationale: అక్షరార్థంగా ‘దయచేసి నేను పైకి వెళ్తాను’ అయినా, ఫరోకు చేస్తున్న వినయపూర్వక అనుమతి అభ్యర్థనను సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: וְאָשׁוּבָה
  choice: తిరిగి వస్తాను
  rationale: యోసేపు తన ప్రయాణం తాత్కాలికమని ఇచ్చిన స్పష్టమైన హామీని నిలుపుతుంది.
