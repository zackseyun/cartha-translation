translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే ప్రత్యక్ష సంభాషణగా అనువదించబడింది. మూలంలోని ప్రమాణం, కనాను దేశం, సమాధి, తిరిగి వస్తాననే హామీ అన్నీ నిలుపబడ్డాయి.
