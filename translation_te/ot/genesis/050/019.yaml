source:
  edition: WLC
  text: וַ/יֹּ֧אמֶר אֲלֵ/הֶ֛ם יוֹסֵ֖ף אַל תִּירָ֑אוּ כִּ֛י הֲ/תַ֥חַת אֱלֹהִ֖ים אָֽנִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/019.yaml
  text: But Joseph said to them[a], “Do not fear, for am I in the place of God?”
translation:
  language: te
  text: కానీ యోసేపు వారితో ఇలా అన్నాడు, “భయపడకండి. నేను దేవుని స్థానంలో ఉన్నానా?[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నేను దేవుని అధీనంలో ఉన్నానా?” హీబ్రూ పదబంధం నుడికారంగా ఉంది; ఇక్కడ దాని అత్యంత సంభావ్య అర్థం, “నేను దేవుని స్థానంలో ఉన్నానా?” అనేది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵהֶם יוֹסֵף
  choice: అయితే యోసేపు వారితో ... అన్నాడు
  rationale: హీబ్రూ కథనంలోని సాధారణ వాక్య నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగు ప్రత్యక్ష వాక్య క్రమంలో అందిస్తుంది; సందర్భంలోని ప్రతిస్పందన భావాన్ని ‘అయితే’ తెలియజేస్తుంది.
- source_word: אַל תִּירָאוּ
  choice: భయపడకండి
  rationale: నిషేధార్థక ఆజ్ఞను బహువచన గౌరవ/సంబోధన రూపంలో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: כִּי
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఇక్కడ ఇది యోసేపు ఇచ్చే భరోసాకు ఆధారాన్ని పరిచయం చేస్తుంది. తెలుగులో వరుసగా వచ్చే వాక్చాతుర్య ప్రశ్న ఆ వివరణాత్మక సంబంధాన్ని సహజంగానే తెలియజేస్తుంది; ‘ఎందుకంటే’ చేర్చడం ఈ సందర్భంలో కృత్రిమంగా వినిపించవచ్చు.
- source_word: הֲתַחַת אֱלֹהִים אָֽנִי
  choice: నేను దేవుని స్థానంలో ఉన్నానా?
  rationale: תַּחַת అనే పదబంధం ఇక్కడ దేవుని పాత్రను లేదా అధికారాన్ని ఆక్రమించే భావంలో వాడిన నుడికారంగా అత్యంత సహజంగా అర్థమవుతుంది. ప్రశ్నార్థక రూపం మరియు ‘నేను’ అనే ఉద్ఘాటన నిలుపబడ్డాయి.
theological_decisions:
- issue: దైవిక అధికారానికి సంబంధించి యోసేపు వేసిన వాక్చాతుర్య ప్రశ్న భావం
  choice: తాను తీర్పు తీర్చడంలో లేదా ప్రతీకారం చేయడంలో దేవుని స్థానాన్ని ఆక్రమించనని యోసేపు సూచిస్తున్నాడు.
  alternative: తాను దేవుని కింద ఉన్నాడా అని యోసేపు అడుగుతున్నాడు.
  rationale: సోదరులు ప్రతీకారానికి భయపడుతున్న సందర్భంలో, అలాగే తరువాతి వచనంలో దేవుని ఉద్దేశం ప్రస్తావించబడటంతో, ‘దేవుని స్థానంలో’ అనే నుడికారార్థం ఎక్కువగా సరిపోతుంది. అయినప్పటికీ హీబ్రూ పదబంధానికి సాధ్యమైన మరొక అర్థాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘భయపడకండి’ సాధారణ పాఠకులకు స్పష్టంగా ఉండగా మూలంలోని బహువచన సంబోధనను నిలుపుతుంది. పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో ప్రశ్నకు వెంటనే ఉంచబడింది.
