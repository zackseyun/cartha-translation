translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన శైలి. పొడవైన హెబ్రీ వాక్యాన్ని స్పష్టత కోసం రెండు తెలుగు వాక్యాలుగా ఇచ్చాం; భావ క్రమం, పాల్గొన్నవారు, తండ్రిని పాతిపెట్టిన తరువాతి తిరుగు ప్రయాణం యథాతథంగా ఉన్నాయి.
