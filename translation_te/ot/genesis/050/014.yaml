  text: וַ/יָּ֨שָׁב יוֹסֵ֤ף מִצְרַ֨יְמָ/ה֙ ה֣וּא וְ/אֶחָ֔י/ו וְ/כָל הָ/עֹלִ֥ים אִתּ֖/וֹ לִ/קְבֹּ֣ר אֶת אָבִ֑י/ו אַחֲרֵ֖י קָבְר֥/וֹ אֶת אָבִֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/014.yaml
  text: Then Joseph returned to Egypt[a], he and his brothers and all who had gone up with him to bury his father[b], after he had buried his father.
translation:
  language: te
  text: తన తండ్రిని పాతిపెట్టిన తరువాత యోసేపు, అతని సోదరులు, అతని తండ్రిని పాతిపెట్టడానికి అతనితో వెళ్లిన వారందరూ ఐగుప్తుకు తిరిగి వెళ్లారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీలో అక్షరార్థంగా, “అతనితో పైకి వెళ్లిన వారందరూ.” ఐగుప్తు నుండి కనానుకు ప్రయాణించడాన్ని “పైకి వెళ్లడం” అని చెప్పడం బైబిలు హెబ్రీలో సాధారణ ప్రయోగం.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: తిరిగి వెళ్లాడు
  rationale: שׁוב ఇక్కడ గతంలో పూర్తయిన తిరుగు ప్రయాణాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో సందర్భానికి సహజమైన రూపం.
- source_word: מִצְרַיְמָה
  choice: ఐగుప్తుకు
  rationale: దిశను సూచించే ה, ఐగుప్తు వైపు ప్రయాణాన్ని తెలియజేస్తుంది; ‘తిరిగి వెళ్లాడు’తో కలిసి గమ్యాన్ని స్పష్టంగా చెబుతుంది.
- source_word: הוּא וְאֶחָיו
  choice: అతనితోపాటు అతని సోదరులూ
  rationale: ప్రధాన కర్త అయిన యోసేపుతో అతని సోదరులు కూడా తిరిగివచ్చారని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וְכָל הָעֹלִים אִתּוֹ
  choice: అతనితో వెళ్లిన వారందరూ
  rationale: עֹלִים అక్షరార్థంగా ‘పైకి వెళ్లినవారు’; ఇది ఐగుప్తు నుండి కనానుకు ప్రయాణించడాన్ని తెలిపే హెబ్రీయ ప్రయోగం. ప్రధాన వాక్యంలో సహజ తెలుగు కోసం ‘వెళ్లిన’ అని ఇచ్చి, అక్షరార్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: לִקְבֹּר אֶת אָבִיו
  choice: అతని తండ్రిని పాతిపెట్టడానికి
  rationale: ל తో కూడిన క్రియానామం ప్రయోజనాన్ని సూచిస్తుంది.
- source_word: אַחֲרֵי קָבְרוֹ אֶת אָבִיו
  choice: తన తండ్రిని పాతిపెట్టిన తరువాత
  rationale: אַחֲרֵי తరువాతి కాలాన్ని సూచిస్తుంది; ప్రత్యయంతో కూడిన క్రియానామంలోని కర్త సందర్భానుసారం యోసేపే. హెబ్రీలోని ‘తండ్రి’ పునరుక్తిని తెలుగులో వాక్య నిర్మాణాన్ని మార్చి స్పష్టంగా నిలిపాం.
