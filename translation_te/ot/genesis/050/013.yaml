id: GEN.50.13
reference: Genesis 50:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּשְׂא֨וּ אֹת֤/וֹ בָנָי/ו֙ אַ֣רְצָ/ה כְּנַ֔עַן וַ/יִּקְבְּר֣וּ אֹת֔/וֹ בִּ/מְעָרַ֖ת שְׂדֵ֣ה הַ/מַּכְפֵּלָ֑ה אֲשֶׁ֣ר קָנָה֩ אַבְרָהָ֨ם אֶת הַ/שָּׂדֶ֜ה לַ/אֲחֻזַּת קֶ֗בֶר מֵ/אֵ֛ת עֶפְרֹ֥ן הַ/חִתִּ֖י עַל פְּנֵ֥י מַמְרֵֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/013.yaml
  text: His sons carried him to the land of Canaan and buried him in the cave of the field of Machpelah[a], which Abraham had bought with the field as a burial property from Ephron the Hittite[c][b], opposite Mamre.
translation:
  language: te
  text: అతని కుమారులు అతన్ని కనాను దేశానికి మోసుకెళ్లి, మమ్రేకు ఎదురుగా ఉన్న మక్పేలా పొలంలోని గుహలో పాతిపెట్టారు. అబ్రాహాము ఆ పొలాన్ని సమాధి స్థలం కోసం తన సొంత ఆస్తిగా చేసుకోవడానికి హిత్తీయుడైన ఎఫ్రోను నుండి కొన్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׂאוּ אֹתוֹ
  choice: అతన్ని మోసుకెళ్లి
  rationale: נשׂא ఇక్కడ యాకోబు మృతదేహాన్ని భౌతికంగా మోసుకెళ్లడాన్ని సూచిస్తుంది. ‘మోసుకెళ్లి’ అనే పదం ఆ నిర్దిష్ట చర్యను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: בָנָיו
  choice: అతని కుమారులు
  rationale: మూలంలోని పుంలింగ బహువచన రూపాన్ని యథాతథంగా ప్రతిబింబిస్తుంది.
- source_word: אַרְצָה כְּנַעַן
  choice: కనాను దేశానికి
  rationale: దిశను సూచించే రూపంతో పాటు ‘దేశం’ అనే భావాన్ని కూడా స్పష్టంగా నిలుపుతుంది.
- source_word: בִּמְעָרַת שְׂדֵה הַמַּכְפֵּלָה
  choice: మక్పేలా పొలంలోని గుహలో
  rationale: హీబ్రూ సమాస సంబంధాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తూ, గుహ ఆ పొలంలో ఉందనే స్థల సంబంధాన్ని కాపాడుతుంది.
- source_word: אֲשֶׁר קָנָה אַבְרָהָם אֶת הַשָּׂדֶה
  choice: ఆ పొలాన్ని అబ్రాహాము … కొన్నాడు
  rationale: హీబ్రూలోని సంబంధవాచక–పునరుక్త కర్మ నిర్మాణాన్ని అసహజంగా అనుకరించకుండా, కొనబడినది పొలమేనని స్పష్టంగా తెలియజేస్తుంది.
- source_word: לַאֲחֻזַּת קֶבֶר
  choice: సమాధి స్థలంగా సొంతం చేసుకోవడానికి
  rationale: אֲחֻזָּה లోని శాశ్వత ఆస్తి/స్వాధీన భావాన్నీ, קֶבֶר లోని సమాధి ప్రయోజనాన్నీ సామాన్యులకు అర్థమయ్యే తెలుగులో కలిపి వ్యక్తం చేస్తుంది.
- source_word: מֵאֵת עֶפְרֹן הַחִתִּי
  choice: హిత్తీయుడైన ఎఫ్రోను దగ్గర
  rationale: వ్యక్తి పేరు, జాతి గుర్తింపు, కొనుగోలు మూలం అన్నిటినీ సహజ తెలుగు వాక్య నిర్మాణంలో నిలుపుతుంది.
- source_word: עַל פְּנֵי מַמְרֵא
  choice: మమ్రేకు ఎదురుగా ఉన్న
  rationale: ఈ స్థలసూచక పదబంధంలోని ‘ఎదురుగా/ముఖాముఖిగా’ అనే సంబంధాన్ని అనవసరంగా కేవలం ‘దగ్గర’గా మార్చకుండా కాపాడుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. హీబ్రూ వాక్యంలోని పునరుక్త సంబంధవాచక నిర్మాణాన్ని రెండు తెలుగు వాక్యాలుగా విభజించి స్పష్టత కలిగించాం; మూలంలోని సమాచారమంతా నిలుపబడింది.
