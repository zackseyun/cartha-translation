  source_fidelity: 'హీబ్రూ పాఠ్యంలోని వంశావళి భావాన్ని సరిగ్గా ప్రతిబింబిస్తుంది: యోసేపు ఎఫ్రాయిము సంతానాన్ని మూడవ తరం వరకు చూశాడు; మనష్షే కుమారుడైన మాకీరు పిల్లలు యోసేపు మోకాళ్లపై పుట్టారు. לְאֶפְרַיִם యొక్క వంశసంబంధ అర్థం, גַּם యొక్క అనుబంధ భావం, మరియు יֻלְּדוּ యొక్క కర్మణి భావం నిలిచాయి. ‘మూడవ తరం వరకు’ మూలం నిర్దిష్టంగా చెప్పని బంధుత్వాన్ని అతిగా నిర్ణయించదు.'
