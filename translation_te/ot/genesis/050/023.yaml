  text: וַ/יַּ֤רְא יוֹסֵף֙ לְ/אֶפְרַ֔יִם בְּנֵ֖י שִׁלֵּשִׁ֑ים גַּ֗ם בְּנֵ֤י מָכִיר֙ בֶּן מְנַשֶּׁ֔ה יֻלְּד֖וּ עַל בִּרְכֵּ֥י יוֹסֵֽף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/023.yaml
  text: Joseph saw Ephraim’s children to the third generation[a]. Also[b], the children of Machir son of Manasseh were born on Joseph’s knees.
translation:
  language: te
  text: యోసేపు ఎఫ్రాయిము సంతానాన్ని మూడవ తరం వరకు చూశాడు.[a] అలాగే మనష్షే కుమారుడైన మాకీరు పిల్లలు యోసేపు మోకాళ్లపై పుట్టారు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యోసేపు ఎఫ్రాయిము సంతానాన్ని మూడవ తరం వరకు చూసేంతకాలం జీవించాడు.” హీబ్రూ మూలంలో అక్షరార్థంగా “చూశాడు” అని ఉంది.
    reason: lexical_alternative
  - marker: b
    text: “యోసేపు మోకాళ్లపై పుట్టారు” అనేది కుటుంబపరమైన గుర్తింపు, స్వీకరణ లేదా ఆ పిల్లల పట్ల ప్రత్యేక అంగీకారాన్ని సూచించే హీబ్రూ నుడికారం కావచ్చు.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּרְא
  choice: చూశాడు
  rationale: మూలంలోని క్రియకు అక్షరార్థం ‘చూశాడు’. ఈ వంశావళి సందర్భంలో అతడు వారిని చూసేంతకాలం జీవించాడనే భావం ఉండవచ్చు; అయినా మూలపదాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: לְאֶפְרַיִם
  choice: ఎఫ్రాయిము సంతానాన్ని
  rationale: లְ ఉపసర్గం ఇక్కడ వంశసంబంధాన్ని సూచిస్తుంది. తెలుగులో ‘ఎఫ్రాయిము సంతానం’ ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: בְּנֵי שִׁלֵּשִׁים
  choice: మూడవ తరం వరకు
  rationale: ఎఫ్రాయిము వంశంలో మూడవ తరం వరకూ విస్తరించిన సంతానాన్ని సూచిస్తుంది; ఖచ్చితమైన బంధుత్వ స్థాయిని మూలం కంటే ఎక్కువగా నిర్దేశించదు.
- source_word: גַּם
  choice: అలాగే
  rationale: మొదటి వాక్యానికి సమాంతరంగా మరొక విషయాన్ని జోడించే సరళమైన, సహజమైన అనుసంధానం.
- source_word: בְּנֵי מָכִיר בֶּן מְנַשֶּׁה
  choice: మనష్షే కుమారుడైన మాకీరు పిల్లలు
  rationale: మాకీరు ఎవరో స్పష్టంగా గుర్తిస్తూ, בְּנֵי అనే పదాన్ని ఈ వంశసందర్భంలో లింగాన్ని అనవసరంగా పరిమితం చేయని ‘పిల్లలు’గా అనువదిస్తుంది.
- source_word: יֻלְּדוּ
  choice: పుట్టారు
  rationale: ילד క్రియ యొక్క హోఫల్ రూపానికి నేరమైన, సహజమైన తెలుగు అనువాదం.
- source_word: עַל בִּרְכֵּי יוֹסֵף
  choice: యోసేపు మోకాళ్లపై
  rationale: సాంస్కృతిక చిత్రాన్ని, దానిలోని సంభావ్య కుటుంబ అంగీకార భావాన్ని వ్యాఖ్యానించి తొలగించకుండా అక్షర రూపంలో నిలుపుతుంది.
theological_decisions:
- issue: ‘యోసేపు మోకాళ్లపై పుట్టారు’ అనే పదబంధపు ఖచ్చితమైన భావం
  choice: ప్రధాన పాఠ్యంలో మూలంలోని స్పష్టమైన శరీరచిత్రాన్ని నిలుపడం
  alternative: యోసేపు వారిని తన సంతానంగా స్వీకరించాడు / ప్రత్యేకంగా అంగీకరించాడు
  rationale: ఈ నుడికారం కుటుంబపరమైన గుర్తింపు, స్వీకరణ లేదా ప్రత్యేక అంగీకారాన్ని సూచించవచ్చు; అయితే ఖచ్చితమైన ఉద్దేశం వివాదరహితం కాదు. అందువల్ల ప్రధాన పాఠ్యం అస్పష్టతను కాపాడి, వివరణను పాదటిప్పణిలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన శైలి. ‘చూశాడు’, ‘మోకాళ్లపై పుట్టారు’ అనే మూలభాషా చిత్రాలను ప్రధాన పాఠ్యంలో నిలిపి, వాటి సంభావ్య విస్తృతార్థాలను పాదటిప్పణుల్లో తెలిపాం.
