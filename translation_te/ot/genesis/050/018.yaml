source:
  edition: WLC
  text: וַ/יֵּלְכוּ֙ גַּם אֶחָ֔י/ו וַֽ/יִּפְּל֖וּ לְ/פָנָ֑י/ו וַ/יֹּ֣אמְר֔וּ הִנֶּ֥/נּֽוּ לְ/ךָ֖ לַ/עֲבָדִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/018.yaml
  text: Then his brothers also came and fell down before him and said[a], “Here we are, your servants.”
translation:
  language: te
  text: అప్పుడు అతని సోదరులు కూడా వచ్చి, అతని ఎదుట సాగిలపడి, “ఇదిగో, మేము నీ బానిసలం[a]” అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “సేవకులం.” హీబ్రూ పదం עֲבָדִים సేవకులను లేదా బానిసలను సూచించగలదు; ఇక్కడ సోదరులు వ్యక్తం చేసిన సంపూర్ణ లోబడే భావాన్ని నిలుపడానికి “బానిసలం” అని అనువదించబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: వచ్చి
  rationale: הלך అక్షరార్థంగా ‘వెళ్లు/నడుచు’ అయినా, ఇక్కడ యోసేపు ఉన్న చోటుకు సోదరులు చేరడాన్ని తెలుగు కథన దృక్కోణంలో సహజంగా ‘వచ్చి’ అని వ్యక్తపరుస్తుంది.
- source_word: גַּם אֶחָיו
  choice: అతని సోదరులు కూడా
  rationale: గతంలో పంపిన సందేశానికి అదనంగా సోదరులే స్వయంగా వచ్చారనే గַּם యొక్క చేర్పు భావాన్ని ‘కూడా’ నిలుపుతుంది.
- source_word: וַיִּפְּלוּ לְפָנָיו
  choice: అతని ఎదుట సాగిలపడి
  rationale: נפל + לפני ఇక్కడ కేవలం పడిపోవడం కాక, లోబడుతూ ఎదుట సాష్టాంగంగా వంగడాన్ని సూచిస్తుంది; ‘సాగిలపడి’ ఆ శారీరక చర్యనూ వినయాన్నీ సహజంగా తెలియజేస్తుంది.
- source_word: וַיֹּאמְרוּ
  choice: అన్నారు
  rationale: ప్రత్యక్ష సంభాషణను పరిచయం చేసే సాధారణ హీబ్రూ కథన క్రియకు సహజమైన తెలుగు రూపం.
- source_word: הִנֶּנּוּ
  choice: ఇదిగో, మేము
  rationale: తమను తాము సమర్పించుకుంటూ ఉనికిని ప్రకటించే సూత్రప్రాయమైన పలుకును, పురాతన శైలికి లోనుకాకుండా ‘ఇదిగో, మేము’ నిలుపుతుంది.
- source_word: לְךָ לַעֲבָדִים
  choice: నీ బానిసలం
  rationale: లְךָ సంబంధాన్ని తెలుగులో స్వామ్య రూపమైన ‘నీ’తో సహజంగా వ్యక్తపరుస్తుంది. עֲבָדִים సేవకులు లేదా బానిసలు అనే పరిధి కలిగిన పదం; ఈ సంపూర్ణ లోబడే సందర్భంలో ‘బానిసలం’ బలమైన భావాన్ని కాపాడుతుంది.
theological_decisions:
- issue: స్వీయ-లోబడే సందర్భంలో עֲבָדִים అనువాదం
  choice: బానిసలం
  alternative: సేవకులం
  rationale: ఇది ప్రధాన సిద్ధాంత వివాదం కాకపోయినా, సోదరులు మర్యాదపూర్వక సేవను మాత్రమే ప్రతిపాదించడం లేదు; యోసేపు అధికారానికి పూర్తిగా లోబడుతున్నామని ప్రకటిస్తున్నారు. అందువల్ల ‘బానిసలం’ ఆ తీవ్రతను బాగా నిలుపుతుంది; పదానికి ‘సేవకులు’ అనే అర్థం కూడా సాధ్యమని పాదసూచిక తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘సాగిలపడి’ శారీరక నమస్కారాన్నీ లోబడే ధోరణినీ సంక్షిప్తంగా అందిస్తుంది. ‘బానిసలం’ సాధారణ తెలుగు సమాసరూపం; పాదసూచిక మూలపదంలోని నిజమైన అర్థవిస్తృతిని కాపాడుతుంది.
