source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יוֹסֵף֙ אֶל אֶחָ֔י/ו אָנֹכִ֖י מֵ֑ת וֵֽ/אלֹהִ֞ים פָּקֹ֧ד יִפְקֹ֣ד אֶתְ/כֶ֗ם וְ/הֶעֱלָ֤ה אֶתְ/כֶם֙ מִן הָ/אָ֣רֶץ הַ/זֹּ֔את אֶל הָ/אָ֕רֶץ אֲשֶׁ֥ר נִשְׁבַּ֛ע לְ/אַבְרָהָ֥ם לְ/יִצְחָ֖ק וּֽ/לְ/יַעֲקֹֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/024.yaml
  text: And Joseph said to his brothers[a], “I am dying, but God will surely visit you and bring you up from this land to the land that he swore to Abraham, to Isaac, and to Jacob.”
translation:
  language: te
  text: 'యోసేపు తన సోదరులతో ఇలా అన్నాడు: “నేను చనిపోబోతున్నాను. అయితే దేవుడు తప్పకుండా మీపై శ్రద్ధ చూపి[a], ఈ దేశం నుండి మిమ్మల్ని పైకి తీసుకువెళ్లి, అబ్రాహాముకు, ఇస్సాకుకు, యాకోబుకు తాను ప్రమాణం చేసిన దేశానికి చేర్చుతాడు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దేవుడు తప్పకుండా మిమ్మల్ని సందర్శిస్తాడు.” హీబ్రూ నుడికారం దేవుడు తన ప్రజలపై నిర్ణాయకంగా శ్రద్ధ చూపి, వారి పక్షాన జోక్యం చేసుకోవడాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶחָיו
  choice: తన సోదరులతో
  rationale: ఇక్కడ పురుష బహువచన నామవాచకం యోసేపు సహోదరులైన పురుషులనే సూచిస్తుంది; ‘సోదరులు’ సందర్భానుకూలంగా, లింగపరంగా ఖచ్చితమైనది.
- source_word: אָנֹכִי מֵת
  choice: నేను చనిపోబోతున్నాను
  rationale: హీబ్రూ కృదంత ప్రయోగం యోసేపు మరణం సమీపించిందనే భావాన్ని ఇస్తుంది; ఆధునిక తెలుగులో ఇది సహజమైన వ్యక్తీకరణ.
- source_word: פָּקֹד יִפְקֹד
  choice: తప్పకుండా మిమ్మల్ని జ్ఞాపకం చేసుకొని మీ పక్షాన కార్యం చేస్తాడు
  rationale: క్రియానామ అవ్యయం మరియు అసమాపక క్రియ కలయిక నిశ్చయాన్ని బలపరుస్తుంది. פקד ఇక్కడ కేవలం ‘సందర్శించడం’ కాక, దేవుడు తన ప్రజలను శ్రద్ధగా జ్ఞాపకం చేసుకొని వారి పక్షాన నిర్ణాయకంగా జోక్యం చేసుకోవడాన్ని సూచిస్తుంది.
- source_word: וֵאלֹהִים
  choice: అయితే దేవుడు
  rationale: వావ్ సంధి ఇక్కడ యోసేపు మరణానికి, దేవుని నిరంతర కార్యానికి మధ్య వ్యతిరేక సంబంధాన్ని చూపుతుంది.
- source_word: וְהֶעֱלָה אֶתְכֶם
  choice: మిమ్మల్ని పైకి తీసుకెళ్లి … చేర్చుతాడు
  rationale: హిఫిల్ రూపం ‘పైకి వెళ్లేలా చేయడం/పైకి తీసుకెళ్లడం’ అనే దిశాత్మక భావాన్ని కలిగి ఉంది. తెలుగులో వాక్యం సహజంగా ఉండేందుకు గమ్యస్థానంతో ‘చేర్చుతాడు’ జోడించబడింది.
- source_word: מִן הָאָרֶץ הַזֹּאת
  choice: ఈ దేశం నుండి
  rationale: యోసేపు ఉన్న ఐగుప్తును సూచించే సరళమైన, సహజమైన అనువాదం.
- source_word: אֶל הָאָרֶץ אֲשֶׁר נִשְׁבַּע
  choice: తాను ప్రమాణం చేసిన దేశానికి
  rationale: మూలంలో ‘ఇస్తానని’ అనే కర్మ స్పష్టంగా లేకపోవడంతో దాన్ని చేర్చకుండా ప్రమాణ భాషను నిలుపుకుంది.
- source_word: לְאַבְרָהָם לְיִצְחָק וּלְיַעֲקֹב
  choice: అబ్రాహాముకు, ఇస్సాకుకు, యాకోబుకు
  rationale: ప్రతి పితరునితో ఉన్న לְ సంబంధాన్ని తెలుగు విభక్తి ద్వారా పునరావృతం చేసి గంభీరమైన జాబితా రూపాన్ని నిలుపుకుంది.
theological_decisions:
- issue: פָּקֹד יִפְקֹדలో దేవుని వాగ్దాన కార్యం స్వభావం
  choice: దేవుడు వారిని జ్ఞాపకం చేసుకొని వారి పక్షాన తప్పకుండా కార్యం చేస్తాడనే బలమైన హామీ
  alternative: దేవుడు మిమ్మల్ని తప్పకుండా సందర్శిస్తాడు
  rationale: ఈ హీబ్రూ నిర్మాణం కార్యం నిశ్చయంగా జరుగుతుందని బలపరుస్తుంది. ‘సందర్శిస్తాడు’ అనే పదం తెలుగులో కేవలం వచ్చి చూడడంగా అపార్థమయ్యే అవకాశం ఉన్నందున, ఒడంబడిక సందర్భంలోని శ్రద్ధ మరియు జోక్యం రెండింటినీ ప్రధాన పాఠ్యంలో వ్యక్తం చేసి, పదశః ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘పైకి తీసుకెళ్లి’ అనే దిశాత్మక రూపం మూలంలోని עלה భావాన్ని నిలుపుతుంది; ‘చేర్చుతాడు’ తెలుగు వాక్యప్రవాహాన్ని స్పష్టపరుస్తుంది. పాదసూచిక సూచిక [a] ప్రధాన పాఠ్యంలో ఉంచబడింది.
