  text: So they sent word to Joseph[a], saying, “Your father commanded before his death, saying,”
translation:
  language: te
  text: 'అప్పుడు వారు యోసేపుకు[a] సందేశం పంపి ఇలా చెప్పారు: “నీ తండ్రి తన మరణానికి ముందు ఇలా ఆజ్ఞాపించాడు:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, మరింత పదానుసారంగా, “అప్పుడు వారు యోసేపుకు ఆజ్ఞాపించారు.” హీబ్రూ క్రియ సాధారణంగా ‘ఆజ్ఞాపించు’ అని అర్థమిస్తుంది; అయితే ఇక్కడ అది యోసేపునకు ఒక సందేశాన్ని పంపడాన్ని సూచిస్తుండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַוּוּ
  choice: కబురు పంపారు
  rationale: צוה సాధారణంగా ‘ఆజ్ఞాపించు’ అని అర్థమిచ్చినా, אֶל יוֹסֵףతో కూడిన ఈ సందర్భంలో యోసేపుకు సందేశం చేరవేయడమే ఉద్దేశంగా కనిపిస్తుంది. సహజమైన తెలుగులో ‘కబురు పంపారు’ ఆ భావాన్ని తెలియజేస్తుంది; మరింత రూపపరమైన అర్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: אֶל יוֹסֵף
  choice: యోసేపుకు
  rationale: אֶל గ్రహీతను సూచిస్తోంది; తెలుగులో చతుర్థీ విభక్తి ‘-కు’ సహజంగా ఆ సంబంధాన్ని వ్యక్తం చేస్తుంది.
- source_word: לֵאמֹר
  choice: ఇలా
  rationale: మొదటి לֵאמֹר నివేదిత మాటలను పరిచయం చేస్తుంది. తెలుగులో ‘ఇలా’ అని చెప్పడం సహజమైన కథన రూపం.
- source_word: אָבִיךָ
  choice: నీ తండ్రి
  rationale: యోసేపును ఉద్దేశించిన ఏకవచన ద్వితీయ పురుష స్వామ్యార్థాన్ని నేరుగా నిలుపుతుంది.
- source_word: צִוָּה
  choice: ఆజ్ఞాపించాడు
  rationale: రెండవ צוה ఇక్కడ తరువాతి వచనంలో వచ్చే ఆజ్ఞను సూచిస్తుంది; అందువల్ల దాని సాధారణ బలమైన అర్థమైన ‘ఆజ్ఞాపించాడు’ను నిలిపాం.
- source_word: לִפְנֵי מוֹתוֹ
  choice: తాను చనిపోవడానికి ముందు
  rationale: లִפְנֵי ఇక్కడ కాలార్థకంగా ‘ముందు’; מוֹתוֹ యాకోబు మరణాన్ని సూచిస్తుంది. సహజమైన ఆధునిక తెలుగులో క్రియాత్మక రూపం స్పష్టంగా ఉంటుంది.
- source_word: לֵאמֹר
  choice: ఇలా
  rationale: రెండవ לֵאמֹר తరువాతి వచనంలో ఉటంకించబోయే తండ్రి ఆజ్ఞను పరిచయం చేస్తుంది; ద్విబిందువు ఆ కొనసాగింపును స్పష్టపరుస్తుంది.
