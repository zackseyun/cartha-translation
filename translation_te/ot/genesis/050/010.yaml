  naturalness: సవరించిన వాక్యం ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గంభీరంగా ఉంది. ‘శోకాచరణ చేశాడు’ ఏడు రోజుల నిర్దిష్ట దుఃఖకాలాన్ని ‘దుఃఖం ఆచరించాడు’ కంటే మరింత సులభంగా తెలియజేస్తుంది.
