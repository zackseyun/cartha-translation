id: GEN.50.10
reference: Genesis 50:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּבֹ֜אוּ עַד גֹּ֣רֶן הָאָטָ֗ד אֲשֶׁר֙ בְּ/עֵ֣בֶר הַ/יַּרְדֵּ֔ן וַ/יִּ֨סְפְּדוּ שָׁ֔ם מִסְפֵּ֛ד גָּד֥וֹל וְ/כָבֵ֖ד מְאֹ֑ד וַ/יַּ֧עַשׂ לְ/אָבִ֛י/ו אֵ֖בֶל שִׁבְעַ֥ת יָמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/010.yaml
  text: When they came to the threshing floor of Atad[a], which is beyond the Jordan, they lamented there with a very great and grievous lamentation[e][d][c][b], and he observed seven days of mourning for his father.
translation:
  language: te
  text: వారు యొర్దాను అవతల ఉన్న ఆటాదు[a] కళ్లానికి[b] వచ్చినప్పుడు, అక్కడ ఎంతో గొప్పదైన, అత్యంత తీవ్రమైన విలాపం చేశారు.[c] అతడు తన తండ్రి కోసం ఏడు రోజులపాటు శోకాచరణ చేశాడు.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ఆటాదు’ అనే పేరు ‘ముళ్లపొద’ లేదా ‘ముండ్లచెట్టు’ అనే అర్థమున్న పదంతో సంబంధం కలిగి ఉండవచ్చు; ఇక్కడ అది స్థలనామంలో భాగంగా ఉంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘యొర్దానుకు ఆవలి వైపున.’ మూలంలోని మాట భౌగోళిక దృక్కోణాన్ని బట్టి ఏ ఒడ్డునైనా సూచించగలదు.
    reason: alternative_reading
  - marker: c
    text: హీబ్రూ వాక్యం అక్షరార్థంగా ‘చాలా గొప్పదైన, భారమైన విలాపం’ అని ఉంది; ఇది దుఃఖ తీవ్రతను తెలిపే నుడికారం.
    reason: cultural_note
  - marker: d
    text: హీబ్రూ క్రియ ఏకవచనంలో ఉంది—‘అతడు శోకాచరణ చేశాడు’; ఇది బహుశా ప్రత్యేకంగా యోసేపును సూచిస్తుంది. కొన్ని అనువాదాలు సందర్భానుసారం ‘వారు’ అని ఇస్తాయి.
    reason: alternative_reading
lexical_decisions:
- source_word: גֹּרֶן הָאָטָד
  choice: ఆటాదు కళ్లం
  rationale: గֹּרֶן అనేది ధాన్యం నూర్చే కళ్లాన్ని సూచిస్తుంది; הָאָטָד ఇక్కడ స్థలనామంలో భాగంగా ఉన్నందున ‘ఆటాదు’ అని లిప్యంతరీకరించబడింది.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: యొర్దాను అవతల
  rationale: עֵבֶר నదికి అవతలి వైపు లేదా ఆవలి ప్రాంతాన్ని సూచిస్తుంది. భౌగోళిక దృక్కోణాన్ని అనవసరంగా ఖరారు చేయకుండా ‘అవతల’ మూలంలోని సాపేక్షతను నిలుపుతుంది.
- source_word: וַיִּסְפְּדוּ
  choice: విలపించారు
  rationale: ספד మరణించినవారి కోసం చేసే బహిరంగ లేదా ఆచారబద్ధమైన విలాపాన్ని సూచిస్తుంది; ‘విలపించారు’ ఆధునిక తెలుగులో సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: מִסְפֵּד גָּדוֹל וְכָבֵד מְאֹד
  choice: ఎంతో గొప్పగా, తీవ్రంగా విలపించారు
  rationale: నామవాచకం-క్రియ పునరుక్తిని తెలుగులో సహజమైన క్రియావిశేషణ నిర్మాణంగా మార్చి, גָּדוֹל, כָבֵד, מְאֹד కలిగించే తీవ్రమైన దుఃఖ భావాన్ని నిలిపింది.
- source_word: וַיַּעַשׂ ... אֵבֶל
  choice: దుఃఖం ఆచరించాడు
  rationale: עשה తో אֵבֶל కలిసినప్పుడు నిర్దిష్ట కాలం పాటు శోకాచరణ చేయడం అనే నుడికారం వస్తుంది; ‘దుఃఖం ఆచరించాడు’ ఆ ఆచారబద్ధతను స్పష్టంగా తెలియజేస్తుంది.
- source_word: שִׁבְעַת יָמִים
  choice: ఏడు రోజులు
  rationale: శోకాచరణ వ్యవధిని మూలానికి నేరుగా అనుగుణంగా తెలుపుతుంది.
theological_decisions:
- issue: బహువచన క్రియల తరువాత וַיַּעַשׂ అనే ఏకవచన క్రియకు కర్త
  choice: ‘అతడు ... దుఃఖం ఆచరించాడు’ అని ఏకవచనాన్ని నిలిపివేయడం
  alternative: సమూహాన్ని ఉద్దేశించినట్లు ‘వారు ... దుఃఖం ఆచరించారు’ అని అనువదించడం
  rationale: మసొరేటిక్ పాఠం ‘వారు వచ్చారు, విలపించారు’ అనే బహువచనం నుంచి ‘అతడు ఆచరించాడు’ అనే ఏకవచనానికి స్పష్టంగా మారుతుంది. సందర్భంలో ఈ ‘అతడు’ యోసేపును సూచించే అవకాశం ఎక్కువ; పేరు చేర్చి అర్థాన్ని పూర్తిగా ఖరారు చేయకుండా మూలంలోని రూపాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి ఉపయోగించబడింది. ‘కళ్లం’ వ్యవసాయ సందర్భానికి సహజమైన పదం; ‘దుఃఖం ఆచరించాడు’ శోకకాలపు ఆచారబద్ధతను తెలియజేస్తుంది. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో వరుసగా చేర్చబడ్డాయి.
