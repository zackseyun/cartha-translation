language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/עַתָּה֙ אַל תִּירָ֔אוּ אָנֹכִ֛י אֲכַלְכֵּ֥ל אֶתְ/כֶ֖ם וְ/אֶֽת טַפְּ/כֶ֑ם וַ/יְנַחֵ֣ם אוֹתָ֔/ם וַ/יְדַבֵּ֖ר עַל לִבָּֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/021.yaml
  text: So now[a], do not be afraid. I myself will provide for you and your little ones.” Thus he comforted them and spoke to their hearts.
translation:
  language: te
  text: “కాబట్టి ఇప్పుడు భయపడకండి. నేనే మిమ్మల్ని, మీ చిన్నపిల్లలను పోషిస్తాను.” అలా అతడు వారిని ఓదార్చి, వారి హృదయాలకు ధైర్యం కలిగేలా మాట్లాడాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “వారి హృదయానికి మాట్లాడాడు”; అంటే వారితో ఆప్యాయంగా లేదా భరోసానిచ్చేలా మాట్లాడాడు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: కాబట్టి ఇప్పుడు
  rationale: వావ్ సంధానార్థాన్నీ, ‘ఇప్పుడు’ అనే కాలసూచననూ సహజమైన తెలుగు సంభాషణలో నిలుపుతుంది.
- source_word: אַל תִּירָאוּ
  choice: భయపడకండి
  rationale: నిషేధాత్మక ఆజ్ఞతో కూడిన ఆదరణను ఆధునిక ప్రామాణిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אָנֹכִי
  choice: నేనే
  rationale: స్వతంత్ర సర్వనామంలోని ఉద్ఘాటనను, యోసేపు స్వయంగా బాధ్యత తీసుకుంటున్న భావాన్ని నిలుపుతుంది.
- source_word: אֲכַלְכֵּל
  choice: పోషిస్తాను
  rationale: ఆహారం సహా జీవనావసరాలు సమకూర్చి సంరక్షించడం అనే క్రియార్థాన్ని సంక్షిప్తంగా, సందర్భోచితంగా తెలుపుతుంది.
- source_word: טַפְּכֶם
  choice: మీ చిన్నపిల్లలను
  rationale: చిన్న వయసు పిల్లలు అనే కుటుంబసంబంధ సున్నితత్వాన్ని ‘పిల్లలు’ కంటే స్పష్టంగా నిలుపుతుంది.
- source_word: וַיְנַחֵם אֹתָם
  choice: అతడు వారిని ఓదార్చి
  rationale: పియేల్ రూపంలోని ఓదార్పు/ఆశ్వాసన భావాన్ని సహజమైన కథన తెలుగులో అందిస్తుంది.
- source_word: וַיְדַבֵּר עַל לִבָּם
  choice: వారి హృదయాలకు ధైర్యం కలిగేలా మాట్లాడాడు
  rationale: అక్షరార్థంగా ‘వారి హృదయానికి మాట్లాడాడు’ అనే హీబ్రూ నుడికారంలోని ఆప్యాయమైన, భరోసానిచ్చే మాటల భావాన్ని సహజ తెలుగులో తెలియజేస్తూ, మూల చిత్రాన్ని పాదటిప్పణిలో ఉంచుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవబహువచనం వాడబడింది. ‘నేనే’ ద్వారా ఉద్ఘాటన, ‘చిన్నపిల్లలు’ ద్వారా కుటుంబసంబంధ మృదుత్వం నిలుపబడ్డాయి. హీబ్రూ నుడికారాన్ని ప్రధాన పాఠ్యంలో సహజార్థంగా, పాదటిప్పణిలో అక్షరార్థ చిత్రంతో అందించాం.
