source:
  edition: WLC
  text: וַ/יַּ֡רְא יוֹשֵׁב֩ הָ/אָ֨רֶץ הַֽ/כְּנַעֲנִ֜י אֶת הָ/אֵ֗בֶל בְּ/גֹ֨רֶן֙ הָֽאָטָ֔ד וַ/יֹּ֣אמְר֔וּ אֵֽבֶל כָּבֵ֥ד זֶ֖ה לְ/מִצְרָ֑יִם עַל כֵּ֞ן קָרָ֤א שְׁמָ/הּ֙ אָבֵ֣ל מִצְרַ֔יִם אֲשֶׁ֖ר בְּ/עֵ֥בֶר הַ/יַּרְדֵּֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/011.yaml
  text: When the inhabitants of the land[a], the Canaanites, saw the mourning at the threshing floor of Atad, they said, “This is a grievous mourning for the Egyptians.” Therefore its name was called Abel-mizraim[c][b], which is beyond the Jordan.
translation:
  language: te
  text: ఆ దేశ నివాసులైన కనానీయులు ఆటాదు కళ్లం దగ్గర జరిగిన విలాపాన్ని చూసి, “ఇది ఐగుప్తీయుల తీవ్రమైన విలాపం” అన్నారు. అందుచేత యొర్దాను అవతల[b] ఉన్న ఆ స్థలానికి ఆబేలు-మిస్రాయిము[a] అని పేరు వచ్చింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ఆబేలు-మిస్రాయిము” అనే పేరు “ఐగుప్తు విలాపం” అనే మాటలా వినిపిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా “యొర్దాను ఆవలి వైపున”; ఈ మాట ఏ వైపును సూచిస్తుందో వక్త ఉన్న భౌగోళిక దృక్కోణంపై ఆధారపడుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹשֵׁב הָאָרֶץ הַכְּנַעֲנִי
  choice: ఆ దేశ నివాసులైన కనానీయులు
  rationale: ఏకవచన కృదంతం సమూహార్థంలో ఉంది; ‘కనానీయులు’ అనే గుర్తింపును సహజమైన ఆధునిక తెలుగులో విశేషణ సంబంధంగా వ్యక్తం చేస్తుంది.
- source_word: הָאֵבֶל
  choice: విలాపం
  rationale: మరణ సందర్భంలోని శోకప్రకటనను, అంత్యక్రియలతో కూడిన దుఃఖాచరణను సూచిస్తుంది; స్థలనామంలోని పదప్రయోగాన్ని పాదసూచికలో వివరించవచ్చు.
- source_word: בְּגֹרֶן הָאָטָד
  choice: ఆటాదు కళ్లం దగ్గర
  rationale: גֹּרֶן ధాన్యం నూర్చే ‘కళ్లం’; בְּ ఇక్కడ స్థలాన్ని సూచిస్తున్నందున ‘దగ్గర’ సహజమైన తెలుగు ప్రయోగం.
- source_word: אֵבֶל כָּבֵד
  choice: తీవ్రమైన విలాపం
  rationale: כָּבֵד అక్షరార్థంగా ‘బరువైనది’; ఇక్కడ విలాప తీవ్రతను సూచిస్తుంది. ‘తీవ్రమైన’ అనేది మూలభావాన్ని సహజంగా అందిస్తుంది.
- source_word: לְמִצְרָיִם
  choice: ఐగుప్తీయుల
  rationale: రూపం ‘ఐగుప్తు’ అనే దేశనామమైనా, సందర్భంలో ఐగుప్తు నుండి వచ్చిన ప్రజల విలాపమని కనానీయులు గుర్తిస్తున్నారు.
- source_word: עַל כֵּן
  choice: అందుచేత
  rationale: తరువాత వచ్చే స్థలనామానికి కారణాన్ని తెలిపే నిర్ధారణాత్మక సంధాన పదం.
- source_word: קָרָא שְׁמָהּ
  choice: ఆ స్థలానికి … అని పేరు వచ్చింది
  rationale: పేరు పెట్టిన కర్తను మూలం స్పష్టంగా పేర్కొనదు. తెలుగు నామకరణ ప్రయోగంలో కర్తను చేర్చకుండా సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אָבֵל מִצְרַיִם
  choice: ఆబేలు-మిస్రాయిము
  rationale: స్థలనామాన్ని లిప్యంతరీకరించి, אֵבֶל (‘విలాపం’)తో ఉన్న పదప్రయోగాన్ని పాదసూచికలో నిలుపుతుంది.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: యొర్దాను అవతల
  rationale: యొర్దాను నదికి ఆవలి వైపును సూచిస్తుంది; దిశ వక్త ఉన్న భౌగోళిక దృక్కోణంపై ఆధారపడుతుంది.
