translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనా సులభంగా అర్థమయ్యే శైలి. ‘కళ్లం’, ‘విలాపం’, ‘అందుచేత’ వంటి సాధారణ సాహిత్య పదాలు వాడబడ్డాయి. స్థలనామాలు తెలుగు బైబిల్ సంప్రదాయానికి అనుగుణంగా లిప్యంతరీకరించబడ్డాయి.
