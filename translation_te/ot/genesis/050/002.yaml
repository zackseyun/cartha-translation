id: GEN.50.2
reference: Genesis 50:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְצַ֨ו יוֹסֵ֤ף אֶת עֲבָדָי/ו֙ אֶת הָ/רֹ֣פְאִ֔ים לַ/חֲנֹ֖ט אֶת אָבִ֑י/ו וַ/יַּחַנְט֥וּ הָ/רֹפְאִ֖ים אֶת יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/002.yaml
  text: Then Joseph commanded his servants[a], the physicians, to embalm his father[b], and the physicians embalmed Israel.
translation:
  language: te
  text: అప్పుడు యోసేపు తన సేవకులైన[a] వైద్యులకు తన తండ్రి మృతదేహానికి శవసంరక్షణ చేయమని ఆజ్ఞాపించాడు. వైద్యులు ఇశ్రాయేలు మృతదేహానికి శవసంరక్షణ చేశారు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దాసులైన”; హెబ్రీ పదం సందర్భానుసారం సేవకులను లేదా దాసులను సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “ఇశ్రాయేలు” అంటే యాకోబు.
    reason: referent_clarification
lexical_decisions:
- source_word: וַיְצַו
  choice: ఆజ్ఞాపించాడు
  rationale: צוה అనే క్రియ అధికారంతో ఆదేశించడాన్ని సూచిస్తుంది; ‘ఆజ్ఞాపించాడు’ దాని బలాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: עֲבָדָיו
  choice: తన సేవకులైన
  rationale: עבד సందర్భానుసారం సేవకులు లేదా దాసులు అని అర్థమవుతుంది. ఇక్కడ యోసేపు పరివారంలో వైద్యులుగా పనిచేసేవారి పాత్ర ప్రధానంగా ఉంది; వారి బంధిత స్థితి ప్రధానాంశం కాదు.
- source_word: הָרֹפְאִים
  choice: వైద్యులు
  rationale: רפא నుంచి వచ్చిన ఈ రూపం వైద్యం చేసేవారిని సూచిస్తుంది; ఆధునిక ప్రామాణిక తెలుగులో ‘వైద్యులు’ సహజంగానూ గౌరవప్రదంగానూ ఉంది.
- source_word: לַחֲנֹט / וַיַּחַנְטוּ
  choice: దేహాన్ని సుగంధ ద్రవ్యాలతో భద్రపరచడం / అలా భద్రపరిచారు
  rationale: חנט ఇక్కడ ఈజిప్టు అంత్యక్రియల సందర్భంలో మృతదేహాన్ని కుళ్లకుండా ప్రత్యేకంగా సిద్ధం చేసి భద్రపరచడాన్ని సూచిస్తుంది. ‘ఎంబామ్ చేయడం’ అనే విదేశీ పదం కన్నా ఈ వివరణ సాధారణ తెలుగు పాఠకులకు స్పష్టంగా ఉంటుంది; రెండో ప్రయోగంలోని ‘అలా’ అదే ప్రక్రియను సూచిస్తుంది.
- source_word: אָבִיו
  choice: తన తండ్రి
  rationale: స్వామ్య సంబంధాన్ని నేరుగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: יִשְׂרָאֵל
  choice: ఇశ్రాయేలు
  rationale: మూలపాఠం ‘యాకోబు’ అని కాకుండా ‘ఇశ్రాయేలు’ అని స్పష్టంగా పేర్కొంటుంది; ఆ పేరును యథాతథంగా నిలుపుతుంది.
theological_decisions:
- issue: עבד అనే సామాజిక స్థితి పదాన్ని ఈ గృహ/రాజసభ సందర్భంలో అనువదించడం
  choice: సేవకులు
  alternative: దాసులు
  rationale: ఈ వాక్యంలో వారి బంధిత సామాజిక స్థితికన్నా యోసేపు ఆధీనంలో వైద్యులుగా ఉన్న వారి కార్యభూమికే ప్రాధాన్యం. అయినా హెబ్రీ పదానికి ‘దాసులు’ అనే అర్థం కూడా ఉండగలదని పాదసూచికలో నిలుపబడింది.
- issue: యాకోబును సూచించే పేరును నిలుపడం
  choice: ఇశ్రాయేలు
  alternative: యాకోబు
  rationale: మూలపాఠంలోని పేరు మార్పును సమన్వయపరచకుండా నిలుపుతూ, అది యాకోబునే సూచిస్తుందని పాదసూచిక వివరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక, గౌరవప్రదమైన తెలుగు. ‘ఎంబామ్ చేయడం’ లేదా ‘మమ్మీగా చేయడం’ వంటి విదేశీ లేదా అతిగా నిర్దిష్ట పదాలకు బదులు, ఈజిప్టు సందర్భంలోని ప్రక్రియను ‘దేహాన్ని సుగంధ ద్రవ్యాలతో భద్రపరచడం’గా స్పష్టంగా వ్యక్తీకరించాం. అన్ని పాదసూచిక సూచికలు ప్రధాన పాఠ్యంలో ఉన్నాయి.
