revisions:
- from: అప్పుడు యోసేపు తన సేవకులైన[a] వైద్యులకు తన తండ్రి దేహాన్ని సుగంధ ద్రవ్యాలతో భద్రపరచమని ఆజ్ఞాపించాడు. వైద్యులు ఇశ్రాయేలు దేహాన్ని అలా భద్రపరిచారు.[b]
  to: అప్పుడు యోసేపు తన సేవకులైన[a] వైద్యులకు తన తండ్రి మృతదేహానికి శవసంరక్షణ చేయమని ఆజ్ఞాపించాడు. వైద్యులు ఇశ్రాయేలు మృతదేహానికి శవసంరక్షణ చేశారు.[b]
  rationale: The revision removes the unstated reference to spices and renders both instances of the Hebrew embalming verb consistently as “శవసంరక్షణ.” It retains the modern-standard register, the source’s name “Israel,” and both correctly anchored footnotes.
