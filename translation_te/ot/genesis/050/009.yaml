source:
  edition: WLC
  text: וַ/יַּ֣עַל עִמּ֔/וֹ גַּם רֶ֖כֶב גַּם פָּרָשִׁ֑ים וַ/יְהִ֥י הַֽ/מַּחֲנֶ֖ה כָּבֵ֥ד מְאֹֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/009.yaml
  text: Chariots and horsemen also went up with him[c][b][a], and the company became very large.
translation:
  language: te
  text: రథదళమూ, గుర్రపు రౌతులూ అతనితోపాటు వెళ్లారు. ఆ సమూహం చాలా పెద్దదిగా ఉంది[b][a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ‘రథం’ అని ఏకవచనంలో ఉంది; అది ఇక్కడ రథాల దళాన్ని సమూహార్థకంగా సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘ఆ శిబిరం ఎంతో బరువుగా ఉంది’; అంటే ఆ సమూహం చాలా పెద్దదిగా, ఘనంగా లేదా ప్రభావవంతంగా ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: వెళ్లారు
  rationale: עָלָה అనే క్రియకు ప్రాథమికంగా ‘పైకి వెళ్లడం’ అనే అర్థం ఉన్నా, ఇక్కడ ప్రయాణాన్ని సూచించే సందర్భంలో సహజమైన ఆధునిక తెలుగులో ‘వెళ్లారు’ అని అనువదించబడింది. దిశను అనవసరంగా స్పష్టీకరించకుండా మూలంలోని ప్రయాణ భావాన్ని నిలుపుతుంది.
- source_word: עִמּוֹ
  choice: అతనితోపాటు
  rationale: ఈ సందర్భంలో సర్వనామం యోసేపును సూచిస్తుంది; ‘అతనితోపాటు’ సహప్రయాణ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: גַּם ... גַּם
  choice: రథదళం, గుర్రపు రౌతులు కూడా
  rationale: పునరుక్తమైన גַּם రెండు వర్గాలనూ అదనంగా వచ్చిన సమన్విత జంటగా చూపుతుంది. తెలుగులో చివర ఉంచిన ‘కూడా’ ఆ మొత్తం జంటకు వర్తిస్తుంది.
- source_word: רֶכֶב
  choice: రథదళం
  rationale: ఏకవచన రూపం ఇక్కడ సమూహార్థకంగా రథాల సైనిక విభాగాన్ని సూచిస్తుంది. ‘రథదళం’ ఈ సమూహ భావాన్ని సంక్షిప్తంగా, సహజంగా అందిస్తుంది.
- source_word: פָּרָשִׁים
  choice: గుర్రపు రౌతులు
  rationale: ఈ పదం గుర్రాలపై ప్రయాణించే లేదా యుద్ధం చేసే వ్యక్తులను సూచిస్తుంది. ‘గుర్రపు రౌతులు’ ఆధునిక పాఠకులకు స్పష్టంగా ఉండి, ‘అశ్విక దళం’ కంటే సాధారణంగా అర్థమవుతుంది.
- source_word: הַמַּחֲנֶה
  choice: ఆ పరివారం
  rationale: מַחֲנֶה సాధారణంగా ‘శిబిరం’ అని అర్థమవుతుంది; అయితే ఇక్కడ అంత్యక్రియల కోసం ప్రయాణిస్తున్న మొత్తం సమూహాన్ని సూచిస్తుంది. ‘పరివారం’ నిలిచివున్న శిబిరం కంటే వెంటవచ్చే పెద్ద సమూహ భావాన్ని ఇస్తుంది.
- source_word: כָּבֵד מְאֹד
  choice: ఎంతో విస్తారంగా ఉంది
  rationale: అక్షరార్థంగా ‘చాలా బరువుగా ఉంది.’ సమూహాన్ని వర్ణించినప్పుడు ఇది దాని పరిమాణం, ఘనత లేదా ప్రభావాన్ని సూచించే నుడికారం. ‘ఎంతో విస్తారంగా ఉంది’ పరిమాణ భావాన్ని సహజంగా తెలియజేస్తూ, ప్రత్యామ్నాయ భావాన్ని పాదసూచికలో ఉంచుతుంది.
