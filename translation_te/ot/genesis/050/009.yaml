translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘పరివారం’ ప్రయాణిస్తున్న అంత్యక్రియల సమూహాన్ని సూచిస్తుంది; ‘రథదళం’ సమూహార్థక ఏకవచనాన్ని సహజంగా అందిస్తుంది.
