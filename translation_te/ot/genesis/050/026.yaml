  yaml_path: translation/ot/genesis/050/026.yaml
  text: So Joseph died at the age of a hundred and ten years[c][b][a], and they embalmed him and placed him in a coffin in Egypt.
translation:
  language: te
  text: యోసేపు నూట పది సంవత్సరాల వయసులో చనిపోయాడు. వారు అతని దేహాన్ని ఎంబామ్ చేసి[a], ఐగుప్తులో ఒక శవపేటికలో[b] ఉంచారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అతని దేహాన్ని కుళ్లిపోకుండా భద్రపరచడానికి సిద్ధం చేసి.’ హీబ్రూ క్రియ ప్రత్యేకంగా ఐగుప్తీయ సందర్భంలో ఎంబామింగ్‌ను సూచిస్తుంది.
    reason: cultural_note
  - marker: b
    text: ఇక్కడ ‘శవపేటిక’గా అనువదించిన హీబ్రూ పదం ఇతర సందర్భాల్లో ‘పెట్టె’ లేదా ‘మందసం’ అని కూడా అర్థమిస్తుంది; ఈ అంత్యక్రియల సందర్భంలో అది శవపేటికను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: చనిపోయాడు
  rationale: מות అనే క్రియ మరణాన్ని నేరుగా సూచిస్తుంది. తెలుగు సాధారణ వాడుకలో ‘చనిపోయాడు’ స్పష్టంగా, సహజంగా ఉంటుంది; మూలంలో లేని మృదూక్తిని చేర్చదు.
- source_word: בֶּן מֵאָה וָעֶשֶׂר שָׁנִים
  choice: నూట పది సంవత్సరాల వయసులో
  rationale: హీబ్రూ భాషలో వయస్సును అక్షరార్థంగా ‘నూట పది సంవత్సరాల కుమారుడు’ అనే నుడికారంతో చెబుతారు. దాని భావాన్ని సహజమైన ఆధునిక తెలుగులో ఇలా వ్యక్తం చేశాం.
- source_word: וַיַּחַנְטוּ
  choice: అతని దేహాన్ని సుగంధద్రవ్యాలతో భద్రపరచి
  rationale: חנט ఇక్కడ ఐగుప్తీయ సందర్భంలో శవాన్ని కుళ్లకుండా సుగంధద్రవ్యాలతో సిద్ధపరచి భద్రపరచడాన్ని సూచిస్తుంది. ‘ఎంబామ్ చేశారు’ కంటే ఈ రూపం సామాన్య తెలుగు పాఠకులకు స్పష్టంగా ఉంటుంది; ‘మమ్మీగా చేశారు’ అనేది మూలక్రియకన్నా ఎక్కువ నిర్దిష్టమైన వ్యాఖ్యానం.
- source_word: וַיִּישֶׂם
  choice: ఉంచారు
  rationale: שׂים అంటే ‘పెట్టు/ఉంచు’. గంభీరమైన కథన శైలిలో ‘ఉంచారు’ సహజంగా సరిపోతుంది.
- source_word: בָּאָרוֹן
  choice: ఒక శవపేటికలో
  rationale: אָרוֹן అనే పదం సందర్భానుసారం పెట్టె, మందసం లేదా శవపేటికను సూచించగలదు. శవ భద్రపరిచే ఈ సందర్భంలో ‘శవపేటిక’ సరైన అర్థం. హీబ్రూ నిర్దిష్ట ఉపపదాన్ని తెలుగులో ‘ఆ శవపేటిక’గా యాంత్రికంగా అనువదించకుండా, తొలిసారి ప్రస్తావిస్తున్న పాత్రగా ‘ఒక’ వాడటం సహజం.
- source_word: בְּמִצְרָיִם
  choice: ఐగుప్తులో
  rationale: మూలంలోని స్థలనామానికి తెలుగు బైబిలు వాడుకలో సుపరిచితమైన ప్రామాణిక రూపం.
- source_word: וַ
  choice: క్రమానుసంధానాన్ని ప్రత్యేక పదం లేకుండా వాక్యక్రమంలో వ్యక్తం చేయడం
  rationale: ప్రారంభ waw కథనాన్ని ముందున్న విషయంతో కొనసాగిస్తుంది. తెలుగులో తప్పనిసరిగా ‘మరియు’ లేదా ‘కాబట్టి’ చేర్చకుండానే వాక్యానుక్రమం ఆ సంబంధాన్ని సహజంగా తెలియజేస్తుంది; ‘కాబట్టి’ కారణార్థాన్ని అతిగా నిర్దిష్టం చేయవచ్చు.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని వరుస క్రియలను తెలుగులో సహజంగా కలిపి, సాంకేతిక విదేశీ పదాన్ని ప్రధాన పాఠ్యంలో నివారించాం. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
