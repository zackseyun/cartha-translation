  text: וַ/יִּרְא֤וּ אֲחֵֽי יוֹסֵף֙ כִּי מֵ֣ת אֲבִי/הֶ֔ם וַ/יֹּ֣אמְר֔וּ ל֥וּ יִשְׂטְמֵ֖/נוּ יוֹסֵ֑ף וְ/הָשֵׁ֤ב יָשִׁיב֙ לָ֔/נוּ אֵ֚ת כָּל הָ֣/רָעָ֔ה אֲשֶׁ֥ר גָּמַ֖לְנוּ אֹתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/015.yaml
  text: When Joseph’s brothers saw that their father was dead, they said, “What if Joseph hates us and fully repays us for all the evil that we did to him?”
translation:
  language: te
  text: తమ తండ్రి చనిపోయాడని యోసేపు సోదరులు చూసినప్పుడు, వారు, “యోసేపు మనపై పగపట్టి, మనం అతనికి చేసిన కీడంతటికీ మనకు పూర్తిగా తిరిగి చెల్లిస్తాడేమో!” అన్నారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּרְאוּ
  choice: గ్రహించినప్పుడు
  rationale: ఇక్కడ ראה కేవలం కళ్లతో చూడడాన్ని కాక, తండ్రి మరణించిన పరిస్థితిని గుర్తించి దాని పరిణామాన్ని గ్రహించడాన్ని సూచిస్తుంది.
- source_word: לוּ יִשְׂטְמֵנוּ
  choice: మనమీద పగపట్టి ... ఏమో
  rationale: שׂטם తీవ్రమైన శత్రుత్వం లేదా పగను సూచిస్తుంది; לוּ ఇక్కడ భయంతో కూడిన సంభావ్యతను వ్యక్తం చేస్తుంది.
- source_word: וְהָשֵׁב יָשִׁיב לָנוּ
  choice: పూర్తిగా ప్రతీకారం తీర్చుకుంటాడేమో
  rationale: అనంత ధాతువు మరియు పరిమిత క్రియ కలయిక బలాన్ని ఇస్తుంది; సందర్భంలో ‘తిరిగి చెల్లించడం’ కీడుకు ప్రతీకారం చేయడమే.
- source_word: אֵת כָּל־הָרָעָה אֲשֶׁר גָּמַלְנוּ אֹתוֹ
  choice: మనం అతనికి చేసిన కీడంతటికీ
  rationale: గమల్ ఇక్కడ ఒకరికి చేసిన వ్యవహారాన్ని సూచిస్తుంది; సహజమైన తెలుగులో భావాన్ని నేరుగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: యోసేపు సోదరుల మాటలోని భయం మరియు అనిశ్చితి
  choice: ‘...తీర్చుకుంటాడేమో’ అనే సంభావ్యతా రూపం
  alternative: ‘యోసేపు తప్పకుండా మనలను ద్వేషించి...’
  rationale: హీబ్రూ לוּ ను నిశ్చయవాక్యంగా కాక భయంతో ఊహించిన అవకాశంగా ఉంచడం ద్వారా మూలంలోని అనిశ్చితి నిలుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కథనశైలి. ‘పగపట్టి’, ‘ప్రతీకారం తీర్చుకోవడం’ సాధారణ పాఠకులకు స్పష్టంగా ఉండి హీబ్రూ వాక్యంలోని తీవ్రతను నిలుపుతాయి.
