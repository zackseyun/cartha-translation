translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. హీబ్రూ వాక్యం ముందటి వచనానికి వ్యాకరణపరంగా కొనసాగింపుగా ఉన్నందున, తెలుగులో విడిగా చదివినప్పటికీ సంపూర్ణంగా ఉండేందుకు ‘వెళ్లారు’ చేర్చి దానిని పాదటిప్పణిలో వెల్లడించాం.
