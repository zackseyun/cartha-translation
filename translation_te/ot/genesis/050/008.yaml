  text: וְ/כֹל֙ בֵּ֣ית יוֹסֵ֔ף וְ/אֶחָ֖י/ו וּ/בֵ֣ית אָבִ֑י/ו רַ֗ק טַפָּ/ם֙ וְ/צֹאנָ֣/ם וּ/בְקָרָ֔/ם עָזְב֖וּ בְּ/אֶ֥רֶץ גֹּֽשֶׁן׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/008.yaml
  text: and all the household of Joseph[a], and his brothers, and his father's household; only their little ones, their flocks[c][b], and their herds they left in the land of Goshen.
translation:
  language: te
  text: యోసేపు ఇంటివారందరూ[a], అతని సోదరులు, అతని తండ్రి ఇంటివారూ వెళ్లారు[c]; తమ చిన్నపిల్లలను[b], గొర్రెలమేకల మందలను, పశువుల మందలను మాత్రమే గోషెను దేశంలో విడిచిపెట్టారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ ‘ఇంటివారు’ అంటే ఒక ఇంటి భవనం కాదు; యోసేపుకు చెందిన కుటుంబం లేదా గృహసముదాయం.
    reason: lexical_alternative
  - marker: b
    text: ‘చిన్నపిల్లలు’ అనే మాట చిన్న వయసు పిల్లలను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: ‘వెళ్లారు’ అనే క్రియ హీబ్రూ వాక్యంలో ఈ వచనంలో మళ్లీ లేదు; ముందటి వచనంలోని క్రియనుంచి భావాన్ని కొనసాగిస్తూ తెలుగులో స్పష్టత కోసం చేర్చబడింది.
    reason: supplied_for_clarity
lexical_decisions:
- source_word: וְכֹל בֵּית יוֹסֵף
  choice: యోసేపు ఇంటివారందరూ
  rationale: כֹּל యొక్క సమగ్ర భావాన్ని ‘అందరూ’ తెలియజేస్తుంది; בֵּית ఇక్కడ భవనాన్ని కాక యోసేపు కుటుంబం లేదా గృహసముదాయాన్ని సూచిస్తుంది.
- source_word: וְאֶחָיו
  choice: అతని సహోదరులు
  rationale: బహువచనమైన אָח ఈ సందర్భంలో యోసేపు సోదరులను సూచిస్తుంది; ‘సహోదరులు’ ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదంగా, స్పష్టంగా ఉంది.
- source_word: וּבֵית אָבִיו
  choice: అతని తండ్రి ఇంటివారు
  rationale: ‘ఇల్లు’ అనే కట్టడంకన్నా తండ్రికి చెందిన కుటుంబం లేదా గృహసముదాయం ఉద్దేశించబడింది.
- source_word: רַק טַפָּם
  choice: తమ చిన్నపిల్లలను మాత్రమే
  rationale: רַק మినహాయింపు లేదా పరిమితిని సూచిస్తుంది; טַף ముఖ్యంగా చిన్న వయసు పిల్లలను సూచిస్తుంది.
- source_word: וְצֹאנָם
  choice: గొర్రెలు మేకల మందలను
  rationale: צֹאן అనేది సాధారణంగా గొర్రెలు, మేకలు వంటి చిన్న పశువులను కలిపి సూచించే సమూహపదం; రెండింటినీ పేర్కొనడం తెలుగు పాఠకునికి భావాన్ని స్పష్టం చేస్తుంది.
- source_word: וּבְקָרָם
  choice: పశువుల మందలను
  rationale: בָּקָר పెద్ద పశువులను, ముఖ్యంగా గోవులను సూచించే సమూహపదం; ‘పశువుల మందలు’ సందర్భంలో సహజంగా ఉంటుంది.
- source_word: עָזְבוּ
  choice: విడిచిపెట్టారు
  rationale: ఇక్కడ ఉద్దేశపూర్వకంగా అక్కడే ఉంచి వెళ్లడం భావం; ‘వదిలేశారు’ అనేది నిర్లక్ష్యం లేదా పరిత్యాగ భావాన్ని కలిగించవచ్చు.
- source_word: בְּאֶרֶץ גֹּשֶׁן
  choice: గోషెను దేశంలో
  rationale: אֶרֶץ అనే పదాన్ని నిలుపుతూ భౌగోళిక సూచనను పూర్తిగా వ్యక్తం చేస్తుంది.
