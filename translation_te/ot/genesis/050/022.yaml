translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా, గౌరవప్రదంగా ఉండే శైలి. ‘తండ్రి ఇల్లు’ అనే అక్షరార్థం భవనంగా అపార్థం కాకుండా ‘తండ్రి ఇంటివారు’ అని ఇచ్చాం. మొదటి క్రియకు ‘నివసించాడు’, ఆయుష్షు తెలిపే రెండో క్రియకు ‘జీవించాడు’ అని భేదం నిలిపాం.
