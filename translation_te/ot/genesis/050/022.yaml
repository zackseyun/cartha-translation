  yaml_path: translation/ot/genesis/050/022.yaml
  text: Joseph remained in Egypt[a], he and his father's household, and Joseph lived 110 years.
translation:
  language: te
  text: యోసేపు తన తండ్రి ఇంటివారితో కలిసి ఐగుప్తులో నివసించాడు[a]. యోసేపు నూట పది సంవత్సరాలు జీవించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘యోసేపు ఐగుప్తులో ఉండిపోయాడు; అతడూ అతని తండ్రి ఇంటివారూ.’
    reason: వַיֵּשֶׁב కు ‘నివసించాడు’తో పాటు ‘ఉండిపోయాడు’ అనే కొనసాగింపు భావం ఉండవచ్చు; ఈ ప్రత్యామ్నాయం హీబ్రూ వాక్యనిర్మాణాన్ని దగ్గరగా ప్రతిబింబిస్తుంది.
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: నివసించాడు
  rationale: ישב అనే క్రియకు ‘కూర్చున్నాడు, నివసించాడు, ఉండిపోయాడు’ అనే అర్థాలు ఉన్నాయి. ఇక్కడ యాకోబు మరణం తర్వాత ఐగుప్తులో కొనసాగిన నివాసాన్ని సహజమైన ఆధునిక తెలుగులో ‘నివసించాడు’ తెలియజేస్తుంది; తరువాతి ויחי కి వాడిన ‘జీవించాడు’తోనూ భేదం నిలుస్తుంది.
- source_word: בְּמִצְרַיִם
  choice: ఐగుప్తులోనే
  rationale: ఇది నివాసస్థలాన్ని సూచించే సరళమైన స్థానవాచక పదబంధం. సందర్భంలోని కొనసాగింపు భావాన్ని తెలుగులో సహజంగా చూపడానికి ‘లోనే’ వాడబడింది.
- source_word: הוּא וּבֵית אָבִיו
  choice: తన తండ్రి ఇంటివారితో కలిసి
  rationale: בֵית אָבִיו అక్షరార్థంగా ‘తన తండ్రి ఇల్లు’; ఇక్కడ భవనాన్ని కాక తండ్రి కుటుంబం లేదా గృహసమూహాన్ని సూచిస్తుంది. ‘ఇంటివారు’ ఆధునిక తెలుగులో ఈ సామాజిక భావాన్ని సహజంగా అందిస్తుంది.
- source_word: וַיְחִי
  choice: జీవించాడు
  rationale: חיה ఇక్కడ యోసేపు మొత్తం ఆయుష్షును తెలియజేస్తుంది. వయస్సు ప్రకటనలో ‘జీవించాడు’ సహజమైన తెలుగు రూపం.
- source_word: מֵאָה וָעֶשֶׂר שָׁנִים
  choice: నూట పది సంవత్సరాలు
  rationale: మూలంలోని ఖచ్చితమైన 110 సంవత్సరాల వయస్సును తెలుగులో సహజమైన పదరూపంలో అందిస్తుంది.
- source_word: יוֹסֵף
  choice: యోసేపు
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
