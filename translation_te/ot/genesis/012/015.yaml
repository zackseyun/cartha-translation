translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. కర్మణి నిర్మాణం మరియు ‘ఆ స్త్రీ’ అనే మూలపదప్రయోగం ఉద్దేశపూర్వకంగా నిలుపబడ్డాయి.
