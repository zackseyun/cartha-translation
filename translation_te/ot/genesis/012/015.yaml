language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּרְא֤וּ אֹתָ/הּ֙ שָׂרֵ֣י פַרְעֹ֔ה וַ/יְהַֽלְל֥וּ אֹתָ֖/הּ אֶל פַּרְעֹ֑ה וַ/תֻּקַּ֥ח הָ/אִשָּׁ֖ה בֵּ֥ית פַּרְעֹֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/015.yaml
  text: When Pharaoh’s officials saw her[a], they praised her to Pharaoh[b], and the woman was taken into Pharaoh’s house.
translation:
  language: te
  text: ఫరో అధికారులు ఆమెను చూసి, ఫరోకు ఆమె గురించి పొగిడిచెప్పారు[a]. ఆ స్త్రీ ఫరో ఇంటికి తీసుకువెళ్లబడింది[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఫరోకు ఆమెను మెచ్చుకొని చెప్పారు’ / ‘ఫరోతో ఆమె గురించి మంచిగా చెప్పారు.’
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో ‘ఇల్లు’; ఇది కేవలం భవనాన్ని మాత్రమే కాక, ఫరో రాజగృహాన్ని లేదా రాజకుటుంబ పరివారాన్ని కూడా సూచించవచ్చు.
    reason: cultural_note
lexical_decisions:
- source_word: שָׂרֵי פַרְעֹה
  choice: ఫరో అధికారులు
  rationale: שָׂרִים అనే పదం పాలకులు, ఉన్నతాధికారులు లేదా రాజకుమారులను సూచించగలదు. రాజసభ సందర్భంలో ‘అధికారులు’ సహజంగా ఉండి, వారు ఫరో కుమారులనే అనవసర భావాన్ని కలిగించదు.
- source_word: וַיִּרְאוּ אֹתָהּ
  choice: ఆమెను చూసి
  rationale: ראה అనే సాధారణ ‘చూచుట’ క్రియను సందర్భానికి తగిన సహజ తెలుగు రూపంలో నేరుగా అనువదించింది.
- source_word: וַיְהַלְלוּ אֹתָהּ אֶל־פַּרְעֹה
  choice: ఫరో వద్ద ఆమెను పొగిడారు
  rationale: הלל పియేల్ రూపం ఇక్కడ పొగడటం లేదా మెచ్చుకొని చెప్పటం అనే అర్థం ఇస్తుంది. ‘ఫరో వద్ద’ అనేది ఆ ప్రశంస ఫరోకు వినిపించేలా చెప్పబడిందనే దిశను సహజంగా తెలియజేస్తుంది.
- source_word: וַתֻּקַּח
  choice: తీసుకువెళ్లబడింది
  rationale: హీబ్రూ క్రియలోని కర్మణి భావాన్ని, కార్యం చేసిన వ్యక్తిని పేర్కొనకపోవడాన్ని, ఆ స్త్రీ నిష్క్రియ స్థితిని ఈ రూపం నిలుపుతుంది.
- source_word: הָאִשָּׁה
  choice: ఆ స్త్రీ
  rationale: మూలంలో ఉన్నది ‘స్త్రీ’ అనే పదమే; సందర్భాన్ని బట్టి ‘భార్య’ అని వివరణాత్మకంగా మార్చకుండా మూల పదప్రయోగాన్ని నిలిపింది.
- source_word: בֵּית פַּרְעֹה
  choice: ఫరో ఇంటికి
  rationale: בַּיִת అంటే భవనం గానీ గృహస్థానం/రాజగృహ పరివారం గానీ కావచ్చు. ‘ఫరో ఇల్లు’ మూలంలోని విస్తృతార్థాన్ని ఉంచుతుంది; ‘రాజభవనం’ అనేది మరింత వ్యాఖ్యానాత్మకం.
