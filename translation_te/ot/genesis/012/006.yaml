  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּעֲבֹ֤ר אַבְרָם֙ בָּ/אָ֔רֶץ עַ֚ד מְק֣וֹם שְׁכֶ֔ם עַ֖ד אֵל֣וֹן מוֹרֶ֑ה וְ/הַֽ/כְּנַעֲנִ֖י אָ֥ז בָּ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/006.yaml
  text: Abram passed through the land as far as the place of Shechem[a], as far as the oak of Moreh[b]. Now the Canaanite was then in the land.
translation:
  language: te
  text: అబ్రాము ఆ దేశం గుండా షెకెము స్థలం వరకు, మోరే వృక్షం[a] వరకు ప్రయాణించాడు. ఆ సమయంలో కనానీయుడు[b] ఆ దేశంలో ఉన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘మోరే ఓకు చెట్టు’ లేదా ‘మోరే తెరెబింతు చెట్టు’ అని కూడా అనువదించవచ్చు. హెబ్రీ పదం ఒక పెద్ద చెట్టును సూచిస్తుంది; అయితే దాని ఖచ్చితమైన జాతి తెలియదు.
    reason: lexical_alternative
  - marker: b
    text: ‘కనానీయులు అప్పుడు ఆ దేశంలో ఉన్నారు’ అని కూడా అనువదించవచ్చు. హెబ్రీలో జాతివాచక పదం ఏకవచనంలో ఉన్నా, అది కనానీయుల సమూహాన్ని సూచించగలదు.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: గుండా ప్రయాణించి
  rationale: అబ్రాము ఆ దేశాన్ని దాటుకుంటూ ముందుకు సాగిన భావాన్ని తెలియజేస్తుంది; అతని మార్గం లేదా ప్రయాణ విధానాన్ని అనవసరంగా నిర్దిష్టం చేయదు.
- source_word: בָּאָרֶץ
  choice: ఆ దేశం
  rationale: సందర్భంలో సూచించబడుతున్న కనాను దేశాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: עַד
  choice: వరకు
  rationale: ప్రయాణం చేరిన హద్దును సూచించే హెబ్రీ పదాన్ని రెండు చోట్లా ఒకే విధంగా ప్రతిబింబిస్తుంది.
- source_word: מְקוֹם שְׁכֶם
  choice: షెకెము అనే స్థలం
  rationale: מְקוֹם అనే సాధారణ నామవాచకాన్ని నిలుపుతూ, తరువాతి కాలంలో పూర్తిగా అభివృద్ధి చెందిన పట్టణమే ఇక్కడ ఉద్దేశమని ముందుగానే నిర్ధారించదు.
- source_word: אֵלוֹן מוֹרֶה
  choice: మోరే వృక్షం
  rationale: אֵלוֹן సూచించే ఖచ్చితమైన వృక్షజాతి అనిశ్చితంగా ఉన్నందున ప్రధాన పాఠ్యంలో తటస్థమైన ‘వృక్షం’ వాడి, సాధ్యమైన జాతులను పాదటిప్పణిలో ఇచ్చాం.
- source_word: מוֹרֶה
  choice: మోరే
  rationale: ఇక్కడ దీనిని స్థలనామంగా తీసుకోవడం సముచితం; ‘బోధకుడు’ లేదా ‘దైవజ్ఞుడు’ వంటి అనిశ్చిత అర్థాన్ని ప్రధాన పాఠ్యంలో చేర్చలేదు.
- source_word: וְהַכְּנַעֲנִי
  choice: కనానీయుడు
  rationale: హెబ్రీలో ఉన్న ఏకవచన జాతివాచక రూపాన్ని నిలుపుతుంది; అది సమూహార్థంలో వాడబడి ఉండవచ్చని పాదటిప్పణి తెలియజేస్తుంది.
- source_word: אָז
  choice: ఆ సమయంలో
  rationale: కథలో అప్పటి చారిత్రక పరిస్థితిని సహజమైన తెలుగులో స్పష్టంగా సూచిస్తుంది.
- source_word: בָּאָרֶץ
  choice: ఆ దేశంలో
  rationale: మూలంలోని పునరుక్తిని నిలుపుతూ, ఆ భూభాగంలో కనానీయుల ఉనికిపై దృష్టి ఉంచుతుంది.
theological_decisions:
- issue: וְהַכְּנַעֲנִי లో జాతివాచక పదం ఏకవచనంలో ఉండటం
  choice: ప్రధాన పాఠ్యంలో ‘కనానీయుడు ... ఉన్నాడు’ అనే ఏకవచన రూపం
  alternative: ‘కనానీయులు ... ఉన్నారు’ అనే సమూహ బహువచన రూపం
  rationale: నిర్దిష్ట ఉపపదంతో కూడిన హెబ్రీ ఏకవచన జాతివాచకం ఒక జాతి మొత్తాన్ని సమూహంగా సూచించగలదు. మూలరూపాన్ని ప్రధాన పాఠ్యంలో నిలిపి, తెలుగులో మరింత సహజమైన సమూహ బహువచనాన్ని పాదటిప్పణిలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా ఉండే కథనశైలిని వాడాం. ‘వరకు’ అనే పదాన్ని రెండుసార్లు ఉంచి హెబ్రీ వాక్య నిర్మాణంలోని గమ్యహద్దుల పునరుక్తిని నిలిపాం. వృక్షజాతి మరియు జాతివాచక సంఖ్యలోని నిజమైన అనిశ్చితులను పాదటిప్పణుల్లో భద్రపరిచాం.
