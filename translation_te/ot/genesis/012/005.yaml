  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּקַּ֣ח אַבְרָם֩ אֶת שָׂרַ֨י אִשְׁתּ֜/וֹ וְ/אֶת ל֣וֹט בֶּן אָחִ֗י/ו וְ/אֶת כָּל רְכוּשָׁ/ם֙ אֲשֶׁ֣ר רָכָ֔שׁוּ וְ/אֶת הַ/נֶּ֖פֶשׁ אֲשֶׁר עָשׂ֣וּ בְ/חָרָ֑ן וַ/יֵּצְא֗וּ לָ/לֶ֨כֶת֙ אַ֣רְצָ/ה כְּנַ֔עַן וַ/יָּבֹ֖אוּ אַ֥רְצָ/ה כְּנָֽעַן־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/005.yaml
  text: Abram took Sarai his wife[a], and Lot his brother’s son, and all their possessions that they had acquired, and the people whom they had acquired in Haran; and they set out to go to the land of Canaan[b], and they came to the land of Canaan.
translation:
  language: te
  text: అబ్రాము తన భార్య శారయిని, తన సోదరుని కుమారుడైన లోతును, వారు సంపాదించిన ఆస్తి అంతటినీ, హారానులో వారు సమకూర్చుకున్న వారందరినీ[a] వెంట తీసుకున్నాడు. వారు కనాను దేశానికి వెళ్లడానికి బయలుదేరారు. వారు కనాను దేశానికి చేరుకున్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “హారానులో వారు చేసిన ప్రాణులను.” ఇక్కడ “ప్రాణులు” అంటే వ్యక్తులు; ఈ హీబ్రూ నుడికారం వారు అక్కడ తమ ఇంటివారిగా సమకూర్చుకున్న లేదా సంపాదించుకున్న మనుషులను సూచించి ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: వెంట తీసుకొని
  rationale: לקח యొక్క సాధారణ అర్థమైన ‘తీసుకొను’ను నిలుపుతూ, ప్రయాణ సందర్భంలో వ్యక్తులను మరియు ఆస్తిని తనతో తీసుకెళ్లాడనే భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אִשְׁתּוֹ
  choice: తన భార్య
  rationale: వివాహ సందర్భంలో אשה మరియు ఏకవచన స్వామ్య ప్రత్యయం స్పష్టంగా ‘తన భార్య’ అని అర్థమిస్తాయి.
- source_word: בֶּן אָחִיו
  choice: తన సోదరుని కుమారుడు
  rationale: హీబ్రూ బంధుత్వ పదబంధాన్ని ‘మేనల్లుడు’గా సాధారణీకరించకుండా నేరుగా నిలుపుతుంది.
- source_word: כָּל־רְכוּשָׁם אֲשֶׁר רָכָשׁוּ
  choice: వారు సంపాదించిన ఆస్తి అంతటినీ
  rationale: רכוש అనేది సంపద లేదా చరాస్తిని విస్తృతంగా సూచిస్తుంది; అదే మూలానికి చెందిన רכש క్రియలోని సంపాదించడమనే భావాన్ని కూడా ఈ రూపం నిలుపుతుంది.
- source_word: הַנֶּפֶשׁ אֲשֶׁר עָשׂוּ
  choice: వారు సమకూర్చుకున్న వారందరినీ
  rationale: נפש ఇక్కడ వ్యక్తులను సూచిస్తుంది. עשה అక్షరార్థంగా ‘చేశారు’ అయినప్పటికీ, ఈ సందర్భంలో ఇంటివారిలో చేర్చుకున్న లేదా సంపాదించుకున్న వ్యక్తులను సూచించే జాతీయంగా అర్థం చేసుకోవచ్చు. ప్రధాన పాఠం వ్యక్తుల స్థితిని అనవసరంగా నిర్ధారించకుండా సహజంగా ఉంటుంది; అక్షరార్థం పాదటిప్పణిలో నిలుపబడింది.
- source_word: וַיֵּצְאוּ לָלֶכֶת
  choice: వెళ్లడానికి బయలుదేరాడు
  rationale: ఈ క్రియా సముచ్చయం బయలుదేరడం మరియు గమ్యదిశగా వెళ్లాలనే ఉద్దేశం రెండింటినీ తెలియజేస్తుంది. మొదటి క్రియ ఏకవచనంగా అబ్రామును ప్రధాన కర్తగా ఉంచినందున తెలుగు వాక్యంలో ఏకవచనం వాడబడింది.
- source_word: אַרְצָה כְּנַעַן
  choice: కనాను దేశానికి
  rationale: దిశను సూచించే ה ముగింపు మరియు כְּנַעַן కలిపి ‘కనాను దేశానికి’ అనే భావాన్ని ఇస్తాయి.
- source_word: וַיָּבֹאוּ אַרְצָה כְּנָעַן
  choice: వారు కనాను దేశానికి చేరుకున్నారు
  rationale: బహువచన క్రియను నిలుపుతూ, ప్రయాణ గమ్యానికి చేరుకున్నారనే భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; మూలంలోని ‘కనాను దేశం’ పునరుక్తిని కూడా కాపాడుతుంది.
theological_decisions:
- issue: הַנֶּפֶשׁ אֲשֶׁר עָשׂוּ అనే పదబంధం ఆ వ్యక్తుల గుర్తింపు లేదా స్థితిని ఎలా సూచిస్తుంది
  choice: వారు సమకూర్చుకున్న వారందరినీ
  alternative: వారు సంపాదించుకున్న దాసులను / వారు విశ్వాసంలోకి నడిపించిన వారిని
  rationale: మూలపాఠం వారిని దాసులని గానీ, మతాంతరితులని గానీ స్పష్టంగా చెప్పదు. అందువల్ల ఏ ప్రత్యేక సామాజిక లేదా మతపరమైన వ్యాఖ్యానాన్నీ పాఠ్యంలోకి చేర్చకుండా అస్పష్టతను నిలుపబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథనశైలి వాడబడింది. బంధుత్వ సంబంధం మూలంలోని రూపానికి దగ్గరగా ఉంచబడింది; కనాను దేశం అనే గమ్యం రెండుసార్లు రావడం హీబ్రూ పునరుక్తిని ప్రతిబింబిస్తుంది.
