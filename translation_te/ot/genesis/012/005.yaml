  terminology: “భార్య,” “సోదరుని కుమారుడు,” “ఆస్తి,” మరియు “కనాను దేశం” సరైన, సహజమైన పదాలు. הַנֶּפֶשׁ אֲשֶׁר עָשׂוּలోని అనిశ్చితిని “వారందరినీ” మరియు పాదటిప్పణి ద్వారా సముచితంగా కాపాడారు; దాసులు లేదా మతాంతరితులు అని నిర్దిష్టంగా చెప్పలేదు.
