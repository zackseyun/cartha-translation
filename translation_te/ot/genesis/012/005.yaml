  source_fidelity: ప్రధాన పాఠం హీబ్రూ పదక్రమాన్నీ, ఆస్తులు మరియు హారానులో సమకూర్చుకున్న వ్యక్తుల మధ్య భేదాన్నీ బాగా ప్రతిబింబిస్తుంది. అయితే וַיֵּצְאוּ బహువచనం కాగా ముసాయిదాలోని “బయలుదేరాడు” ఏకవచనంగా ఉంది. అబ్రాము తీసుకోవడం ఏకవచనంలోనూ, వారందరి బయలుదేరడం మరియు చేరడం బహువచనంలోనూ ఉండేలా వాక్యాలను విడదీయడం అవసరం.
