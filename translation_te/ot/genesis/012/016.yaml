  terminology: ‘దాసులు, దాసీలు’ అనేవి ఆస్తుల జాబితాలో ఉన్న עֲבָדִים, שְׁפָחֹתల బంధిత స్థితిని మృదుపరచకుండా తెలుపుతున్నాయి. ‘పశువులు,’ ‘మగ గాడిదలు,’ ‘ఆడ గాడిదలు,’ ‘ఒంటెలు’ అన్న పదప్రయోగాలు తగినవే.
