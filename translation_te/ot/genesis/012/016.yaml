id: GEN.12.16
reference: Genesis 12:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/לְ/אַבְרָ֥ם הֵיטִ֖יב בַּ/עֲבוּרָ֑/הּ וַֽ/יְהִי ל֤/וֹ צֹאן וּ/בָקָר֙ וַ/חֲמֹרִ֔ים וַ/עֲבָדִים֙ וּ/שְׁפָחֹ֔ת וַ/אֲתֹנֹ֖ת וּ/גְמַלִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/016.yaml
  text: And he treated Abram well because of her[a], and he came to have sheep and cattle and male donkeys and male servants and female servants and female donkeys and camels.
translation:
  language: te
  text: ఆమె కారణంగా[a] అతడు అబ్రాముకు మేలు చేశాడు; అబ్రాముకు గొర్రెలు, పశువులు, మగ గాడిదలు, దాసులు, దాసీలు, ఆడ గాడిదలు, ఒంటెలు సమకూరాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆమె నిమిత్తం.’ హెబ్రీయ ప్రయోగాన్ని ఈ రెండు విధాలుగా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵיטִיב
  choice: మేలు చేశాడు
  rationale: హిఫీల్ రూపం ఇక్కడ ఒకరికి మేలు చేయడం లేదా అనుకూలంగా వ్యవహరించడం అనే అర్థాన్నిస్తుంది; ‘అబ్రాముకు మేలు చేశాడు’ సహజంగా, వ్యక్తిగత కర్మసంబంధాన్ని నిలుపుతుంది.
- source_word: בַּעֲבוּרָהּ
  choice: ఆమె కారణంగా
  rationale: ఈ ప్రయోగం కారణం లేదా సందర్భాన్ని సూచిస్తుంది. ‘ఆమె కారణంగా’ అనేది లబ్ధిదాయక ఉద్దేశాన్ని అనవసరంగా చేర్చకుండా మూలంలోని కారణార్థాన్ని తెలియజేస్తుంది.
- source_word: וַיְהִי לוֹ
  choice: సమకూరాయి
  rationale: ‘అతనికి కలిగాయి’ అనే హెబ్రీయ నుడికారం ఫలితంగా స్వాధీనంలోకి రావడాన్ని సూచిస్తుంది; సందర్భంలో ఆస్తులు అబ్రాముకు చేరిన భావాన్ని ‘సమకూరాయి’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: צֹאן
  choice: గొర్రెలు
  rationale: ఈ సమూహవాచకం గొర్రెలు/మేకలు వంటి చిన్న పశువులను సూచించగలిగినా, ఆస్తుల జాబితాలో ‘గొర్రెలు’ సరళమైన సాధారణ అనువాదం.
- source_word: בָקָר
  choice: పశువులు
  rationale: గోవుల జాతికి చెందిన మందను సూచించే సమూహవాచకం; తెలుగులో ‘పశువులు’ సహజమైన బైబిలీయ సందర్భానువాదం.
- source_word: חֲמֹרִים
  choice: మగ గాడిదలు
  rationale: పుంలింగ బహువచనం; తరువాత వచ్చే ఆడ గాడిదలతో ఉన్న లింగభేదాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: עֲבָדִים
  choice: దాసులు
  rationale: ఆస్తుల జాబితాలో ఈ పదం బంధిత సేవాస్థితిని సూచిస్తుంది; ‘దాసులు’ ఆ సామాజిక వాస్తవాన్ని ‘సేవకులు’ కంటే స్పష్టంగా నిలుపుతుంది.
- source_word: שְׁפָחֹת
  choice: దాసీలు
  rationale: స్త్రీలింగ బహువచనం, స్త్రీ దాసులను సూచిస్తుంది; ‘దాసీలు’ సంక్షిప్తంగా, సహజంగా, సామాజిక స్థితిని నిలుపుతుంది.
- source_word: אֲתֹנֹת
  choice: ఆడ గాడిదలు
  rationale: స్త్రీలింగ రూపం కావడంతో మగ గాడిదలతో ఉన్న భేదాన్ని కాపాడుతుంది.
- source_word: גְמַלִּים
  choice: ఒంటెలు
  rationale: హెబ్రీయ బహువచనానికి ప్రామాణిక తెలుగు సమానం.
