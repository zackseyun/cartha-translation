id: GEN.12.17
reference: Genesis 12:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְנַגַּ֨ע יְהוָ֧ה אֶת פַּרְעֹ֛ה נְגָעִ֥ים גְּדֹלִ֖ים וְ/אֶת בֵּית֑/וֹ עַל דְּבַ֥ר שָׂרַ֖י אֵ֥שֶׁת אַבְרָֽם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/017.yaml
  text: But Yahweh afflicted Pharaoh and his household with severe plagues because of Sarai[a], Abram’s wife.
translation:
  language: te
  text: కానీ యాహ్వే అబ్రాము భార్య అయిన శారయి కారణంగా ఫరోకు, అతని ఇంటివారికి తీవ్రమైన బాధలను కలిగించాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఫరోను, అతని ఇంటివారిని గొప్ప బాధలతో దెబ్బతీశాడు.” హీబ్రూలో ‘దెబ్బతీయడం/బాధ కలిగించడం’ అనే అర్థమున్న క్రియతో పాటు ‘బాధలు’ లేదా ‘తెగుళ్లు’ అని అర్థమిచ్చే నామవాచకం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְנַגַּע
  choice: బాధించాడు
  rationale: נגע అనే క్రియకు ‘తాకడం/దెబ్బతీయడం’ అనే ప్రాథమిక అర్థాలున్నా, ఇక్కడ נְגָעִיםతో కలిసి హానికరమైన బాధను కలిగించడాన్ని సూచిస్తుంది. ‘బాధించాడు’ ఈ కారణార్థక భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, వ్యక్తిగత నామంగా తెలుగు లిపిలో లిప్యంతరీకరించాం.
- source_word: פַּרְעֹה
  choice: ఫరో
  rationale: ఈజిప్టు రాజుకు వాడే బిరుదుకు తెలుగులో ప్రాచుర్యంలో ఉన్న రూపం.
- source_word: נְגָעִים גְּדֹלִים
  choice: తీవ్రమైన తెగుళ్లతో
  rationale: נְגָעִיםకు ‘దెబ్బలు, బాధలు, తెగుళ్లు’ అనే అర్థాలున్నాయి; ఈ సందర్భంలో ‘తెగుళ్లు’ సహజంగా సరిపోతుంది. גְּדֹלִים పరిమాణం కంటే తీవ్రతను సూచిస్తున్నందున ‘తీవ్రమైన’ అని అనువదించాం.
- source_word: וְאֶת־בֵּיתוֹ
  choice: అతని ఇంటివారిని
  rationale: בֵּיתוֹ ఇక్కడ భవనాన్ని మాత్రమే కాక ఫరో గృహ పరిధిలోని మనుషులను సూచిస్తుంది; అందువల్ల ‘ఇంటివారు’ స్పష్టంగా, సహజంగా ఉంది.
- source_word: עַל־דְּבַר
  choice: కారణంగా
  rationale: ఈ పదబంధం ఇక్కడ బాధలకు కారణాన్ని తెలియజేస్తుంది.
- source_word: שָׂרַי אֵשֶׁת אַבְרָם
  choice: అబ్రాము భార్య శారయి
  rationale: హీబ్రూ సమాసార్థాన్ని సహజమైన తెలుగు పదక్రమంలో ఉంచి, శారయి అబ్రాము భార్య అని స్పష్టంగా గుర్తించాం.
theological_decisions:
- issue: దైవనామం יהוה అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలంలో ఉన్న వ్యక్తిగత దైవనామాన్ని బిరుదుగా మార్చకుండా ‘యాహ్వే’ అని లిప్యంతరీకరించడం మూలరూపాన్ని పారదర్శకంగా నిలుపుతుంది.
- issue: శారయి కారణంగా వచ్చిన బాధ యొక్క స్వరూపం
  choice: తీవ్రమైన తెగుళ్లతో బాధించాడు
  alternative: గొప్ప బాధలతో దెబ్బతీశాడు
  rationale: మూలంలోని క్రియ–నామవాచక పదజంట హానికరమైన దైవిక బాధను సూచిస్తుంది; దాని నిర్దిష్ట వైద్య స్వరూపాన్ని వచనం చెప్పనందున దానిని మరింత నిర్దిష్టం చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని వాడాం. ‘అయితే’ అనే అనుసంధానం హీబ్రూ కథనంలోని వ్యతిరేక మలుపును తెలియజేస్తుంది. మూలంలోని కారణార్థక సంబంధాన్ని, క్రియ–నామవాచక పదజంటలోని భావాన్ని నిలుపుతూ తెలుగులో అసహజమైన పునరుక్తిని నివారించాం.
