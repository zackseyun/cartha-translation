source:
  edition: WLC
  text: אִמְרִי נָ֖א אֲחֹ֣תִ/י אָ֑תְּ לְמַ֨עַן֙ יִֽיטַב לִ֣/י בַ/עֲבוּרֵ֔/ךְ וְ/חָיְתָ֥ה נַפְשִׁ֖/י בִּ/גְלָלֵֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/013.yaml
  text: Please say that you are my sister[a], so that it may go well with me because of you[b], and my life may be spared on your account.
translation:
  language: te
  text: “నీ వల్ల నాకు మేలు జరగడానికి, నీ కారణంగా నా ప్రాణం నిలవడానికి, నీవు నా సహోదరివని దయచేసి చెప్పు.[a][b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “నా నెఫెష్ జీవిస్తుంది.” ఇక్కడ “నెఫెష్” అంటే అబ్రాము ప్రాణం, జీవితం లేదా అతడే.
    reason: lexical_alternative
  - marker: b
    text: “నీ వల్ల,” “నీ కారణంగా” అని అనువదించిన రెండు హీబ్రూ వ్యక్తీకరణలు అర్థంలో దగ్గరగా ఉన్నాయి. శారయి తన సహోదరి అని చెప్పడం ద్వారా తనకు అనుకూలత, భద్రత కలుగుతాయని అబ్రాము ఆశిస్తున్నాడని రెండూ నొక్కిచెబుతున్నాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִמְרִי נָא
  choice: దయచేసి చెప్పు
  rationale: స్త్రీలింగ ఏకవచన ఆజ్ఞారూపంతో ఉన్న נָא అభ్యర్థనను మృదువుగా చేస్తుంది. ‘దయచేసి చెప్పు’ ఆధునిక తెలుగులో సహజంగా ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: אֲחֹתִי אָתְּ
  choice: నీవు నా సహోదరివని
  rationale: ఇది శారయిని అబ్రాము తన సహోదరిగా చెప్పమనే విధేయ వాక్యం. ‘సహోదరి’ గౌరవప్రదమైన, స్పష్టమైన ఆధునిక పదం; ‘అని’ తెలుగులో చెప్పు అనే క్రియతో సహజంగా కలుస్తుంది.
- source_word: לְמַעַן
  choice: అప్పుడు
  rationale: హీబ్రూ పదం ఉద్దేశం లేదా ఆశించిన ఫలితాన్ని పరిచయం చేస్తుంది. ముందున్న అభ్యర్థనకు ఫలితంగా తరువాతి రెండు అంశాలు జరుగుతాయని ‘అప్పుడు’ సహజంగా సూచిస్తుంది.
- source_word: יִיטַב לִי
  choice: నాకు మేలు జరుగుతుంది
  rationale: ‘నాకు మంచిగా ఉంటుంది/మేలు జరుగుతుంది’ అనే విస్తృత హీబ్రూ నుడికారాన్ని నిలుపుతుంది; అతనికి ఎలాంటి అనుకూల వ్యవహారం లభిస్తుందో అనవసరంగా నిర్దిష్టం చేయదు.
- source_word: בַּעֲבוּרֵךְ
  choice: నీ వల్ల
  rationale: ఇక్కడ కారణం లేదా సాధనాన్ని సూచించే సహజమైన తెలుగు వ్యక్తీకరణ. అబ్రాముకు కలిగే మేలు శారయి ద్వారా వస్తుందని తెలియజేస్తుంది.
- source_word: וְחָיְתָה נַפְשִׁי
  choice: నా ప్రాణం నిలుస్తుంది
  rationale: అక్షరార్థంగా ‘నా నెఫెష్ జీవిస్తుంది.’ సందర్భంలో נֶפֶשׁ అబ్రాము జీవితం లేదా స్వయాన్ని సూచిస్తుంది. ‘ప్రాణం నిలుస్తుంది’ మరణం నుంచి తప్పించబడే భావాన్ని సహజంగా అందిస్తుంది.
- source_word: בִּגְלָלֵךְ
  choice: నీ కారణంగా
  rationale: ముందటి בַּעֲבוּרֵךְకు దగ్గరైన రెండవ కారణార్థక వ్యక్తీకరణ. వేరే తెలుగు రూపాన్ని వాడటం ద్వారా భావపునరుక్తి కనిపిస్తుంది, కానీ వాక్యం కృత్రిమంగా ఉండదు.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలి వాడబడింది. ‘ప్రాణం నిలుస్తుంది’ అనే నుడికారం సందర్భంలోని ప్రాణరక్షణ భావాన్ని అందిస్తూ, נֶפֶשׁను శరీరానికి వేరైన ‘ఆత్మ’గా అనవసరంగా వ్యాఖ్యానించదు. రెండు దగ్గరైన కారణార్థక హీబ్రూ పదబంధాలు ‘నీ వల్ల / నీ కారణంగా’గా వేరుచేసి నిలుపబడ్డాయి.
