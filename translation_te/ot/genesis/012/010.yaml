id: GEN.12.10
reference: Genesis 12:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְהִ֥י רָעָ֖ב בָּ/אָ֑רֶץ וַ/יֵּ֨רֶד אַבְרָ֤ם מִצְרַ֨יְמָ/ה֙ לָ/ג֣וּר שָׁ֔ם כִּֽי כָבֵ֥ד הָ/רָעָ֖ב בָּ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/010.yaml
  text: There was a famine in the land[a], and Abram went down to Egypt to sojourn there, because the famine was severe in the land.
translation:
  language: te
  text: ఆ దేశంలో కరువు వచ్చింది. కరువు ఆ దేశంలో తీవ్రంగా ఉండడంతో, అబ్రాము అక్కడ కొంతకాలం పరదేశిగా నివసించడానికి[a] ఐగుప్తుకు దిగివెళ్లాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అక్కడ తాత్కాలికంగా నివసించడానికి.” మూలపదం ఒక పరదేశిగా కొంతకాలం నివసించడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: వచ్చింది
  rationale: హీబ్రూ కథనంలో కొత్త పరిణామాన్ని పరిచయం చేసే క్రియారూపాన్ని తెలుగులో సహజంగా ‘కరువు వచ్చింది’ అని వ్యక్తం చేస్తుంది; మూలంలో లేని ప్రత్యేక కాలసూచక పదాన్ని చేర్చదు.
- source_word: רָעָב
  choice: కరువు
  rationale: ఇది వ్యక్తిగత ఆకలిని కాక, ప్రాంతవ్యాప్త ఆహార కొరతను సూచిస్తుంది.
- source_word: בָּאָרֶץ
  choice: ఆ దేశంలో
  rationale: ఇక్కడ אֶרֶץ మొత్తం భూమిని కాక అబ్రాము ఉన్న ప్రాంతాన్ని సూచిస్తుంది. ‘ఆ దేశంలో’ ఆధునిక తెలుగులో సహజంగా ఉండి, రెండు సందర్భాల్లోనూ మూలంలోని పునరుక్తిని నిలుపుతుంది.
- source_word: וַיֵּרֶד
  choice: దిగివెళ్లాడు
  rationale: ירד లోని ‘కిందికి వెళ్లడం’ అనే దిశాభావాన్ని నిలుపుతూ, ఐగుప్తుకు ప్రయాణాన్ని తెలిపే హీబ్రూ ప్రయోగాన్ని ప్రతిబింబిస్తుంది.
- source_word: מִצְרַיְמָה
  choice: ఐగుప్తుకు
  rationale: దిశను తెలిపే హీబ్రూ అంత్యప్రత్యయంతో కూడిన రూపం ఐగుప్తు వైపు గమ్యాన్ని స్పష్టంగా సూచిస్తుంది.
- source_word: לָגוּר
  choice: కొంతకాలం పరదేశిగా నివసించడానికి
  rationale: גור శాశ్వత స్థిరనివాసం కంటే, బయటి వ్యక్తిగా లేదా పరదేశిగా తాత్కాలికంగా నివసించే భావాన్ని కలిగి ఉంది. ఈ అనువాదం ఆ రెండు భావాంశాలనూ స్పష్టంగా అందిస్తుంది.
- source_word: שָׁם
  choice: అక్కడ
  rationale: సాధారణ స్థలవాచక క్రియావిశేషణాన్ని నేరుగా, సహజంగా అనువదిస్తుంది.
- source_word: כִּי
  choice: ఉండడంతో
  rationale: ఐగుప్తుకు వెళ్లడానికి కరువు కారణమని తెలిపే సంబంధాన్ని ఆధునిక తెలుగులో సహజమైన కారణార్థక నిర్మాణంతో వ్యక్తం చేస్తుంది.
- source_word: כָבֵד
  choice: తీవ్రంగా
  rationale: అక్షరార్థంగా ‘భారీగా’ ఉన్నా, కరువు తీవ్రతను సందర్భానుసారంగా సహజంగా తెలియజేస్తుంది.
