translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. హీబ్రూలోని ‘దేశం’ మరియు ‘కరువు’ పునరుక్తిని నిలిపి, ירד లోని దిశాభావం కోసం ‘దిగివెళ్లాడు’ ఎంచుకోబడింది. పాదసూచిక గుర్తును అది వివరిస్తున్న לָגוּר అనువాదం వెంట ఉంచాం.
