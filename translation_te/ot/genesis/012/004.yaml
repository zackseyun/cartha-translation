id: GEN.12.4
reference: Genesis 12:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֵּ֣לֶךְ אַבְרָ֗ם כַּ/אֲשֶׁ֨ר דִּבֶּ֤ר אֵלָי/ו֙ יְהוָ֔ה וַ/יֵּ֥לֶךְ אִתּ֖/וֹ ל֑וֹט וְ/אַבְרָ֗ם בֶּן חָמֵ֤שׁ שָׁנִים֙ וְ/שִׁבְעִ֣ים שָׁנָ֔ה בְּ/צֵאת֖/וֹ מֵ/חָרָֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/004.yaml
  text: So Abram went, just as Yahweh had spoken to him, and Lot went with him. Abram was seventy-five years old when he departed from Haran.
translation:
  language: te
  text: యాహ్వే అతనితో మాట్లాడినట్లే అబ్రాము వెళ్లాడు, లోతు అతనితో వెళ్లాడు. అబ్రాము హారాను నుండి బయలుదేరినప్పుడు అతనికి డెబ్బై ఐదు సంవత్సరాల వయస్సు ఉంది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: వెళ్లాడు
  rationale: הלך క్రియ యొక్క wayyiqtol రూపం కథనంలో సాధారణ గతకాల గమనాన్ని సూచిస్తుంది. ‘వెళ్లాడు’ సహజమైన, నేరమైన అనువాదం.
- source_word: כַּאֲשֶׁר
  choice: చెప్పినట్లే
  rationale: అబ్రాము చేసిన కార్యం యెహోవా ముందుగా చెప్పిన మాటకు అనుగుణంగా ఉందనే పోలికను, విధేయతను అదనపు వ్యాఖ్యానం లేకుండా తెలియజేస్తుంది.
- source_word: דִּבֶּר אֵלָיו
  choice: తనతో చెప్పిన
  rationale: దేవుని మాట అబ్రాము వెళ్లకముందే జరిగినదని తెలుగు ఉపవాక్య నిర్మాణం సహజంగా తెలియజేస్తుంది; אֵלָיו భావాన్ని ‘తనతో’ అందిస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించదగిన ‘యెహోవా’ రూపంలో లిప్యంతరీకరించాం.
- source_word: אִתּוֹ
  choice: అతనితో
  rationale: సహవాసాన్ని సూచించే హీబ్రూ ఉపసర్గ-సర్వనామ రూపానికి నేరమైన, సహజమైన తెలుగు సమానం.
- source_word: בֶּן חָמֵשׁ שָׁנִים וְשִׁבְעִים שָׁנָה
  choice: అతనికి డెబ్బై ఐదు సంవత్సరాలు
  rationale: వయస్సును తెలిపే హీబ్రూ నుడికారాన్ని ఆధునిక తెలుగులో సహజమైన వయస్సు నిర్మాణంతో అందిస్తుంది.
- source_word: בְּצֵאתוֹ
  choice: బయలుదేరినప్పుడు
  rationale: ב తో కూడిన יצא infinitive construct బయలుదేరిన సమయాన్ని సూచిస్తుంది; ‘బయలుదేరినప్పుడు’ ప్రయాణ సందర్భానికి సహజంగా సరిపోతుంది.
- source_word: מֵחָרָן
  choice: హారాను నుండి
  rationale: מֵ ఉపసర్గను ‘నుండి’గా అనువదించి, స్థలనామాన్ని ప్రామాణిక తెలుగు బైబిలు వాడుకకు దగ్గరగా లిప్యంతరీకరించాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమే ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా లిప్యంతరీకరించాం. ‘యాహ్వే’ మూల ఉచ్చారణను పునర్నిర్మించే సాధారణ రూపమైనప్పటికీ, ఆధునిక సాధారణ తెలుగు పాఠకులకు గుర్తించదగిన స్థిర రూపంగా ‘యెహోవా’ను ఎంచుకున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని రెండు వరుస గమన క్రియలను నిలిపి, అబ్రాము విధేయతను పాఠమే తెలిపే మేరకు ఉంచాం; అదనపు ధార్మిక వ్యాఖ్యానం చేర్చలేదు.
