revisions:
- from: “‘ఈమె నా సహోదరి’ అని ఎందుకు చెప్పావు? దాంతో నేను ఆమెను నాకు భార్యగా చేసుకోవడానికి తీసుకున్నాను. ఇదిగో, నీ భార్య! ఆమెను తీసుకొని వెళ్లిపో.”
  to: “‘ఈమె నా సహోదరి’ అని ఎందుకు చెప్పావు? దాంతో నేను ఆమెను నా భార్యగా తీసుకున్నాను. ఇప్పుడు, ఇదిగో నీ భార్య; ఆమెను తీసుకొని వెళ్ళు.”
  rationale: The revision removes the unsupported purpose nuance from the marital expression and renders the two final imperatives more directly. “దాంతో” appropriately conveys the rhetorical consequence implied by Pharaoh’s question while retaining a natural Telugu dialogue flow. No footnotes are needed.
  reviewer_model: gpt-5.6-terra
