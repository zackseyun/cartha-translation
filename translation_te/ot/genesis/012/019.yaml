id: GEN.12.19
reference: Genesis 12:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: לָ/מָ֤ה אָמַ֨רְתָּ֙ אֲחֹ֣תִ/י הִ֔וא וָ/אֶקַּ֥ח אֹתָ֛/הּ לִ֖/י לְ/אִשָּׁ֑ה וְ/עַתָּ֕ה הִנֵּ֥ה אִשְׁתְּ/ךָ֖ קַ֥ח וָ/לֵֽךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/019.yaml
  text: Why did you say[a], ‘She is my sister,’ and I took her to be my wife? And now, here is your wife[c][b]. Take her and go.”
translation:
  language: te
  text: “‘ఈమె నా సహోదరి’ అని ఎందుకు చెప్పావు? దాంతో నేను ఆమెను నా భార్యగా తీసుకున్నాను. ఇప్పుడు, ఇదిగో నీ భార్య; ఆమెను తీసుకొని వెళ్ళు.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָמָה אָמַרְתָּ
  choice: ఎందుకు చెప్పావు?
  rationale: ఫరో అబ్రామును ప్రశ్నిస్తూ గద్దిస్తున్న సందర్భానికి సహజమైన ఆధునిక తెలుగు ప్రశ్నారూపం.
- source_word: אֲחֹתִי הִוא
  choice: ‘ఈమె నా సహోదరి’
  rationale: హీబ్రూ నామవాచక వాక్యాన్ని ప్రత్యక్ష ఉల్లేఖనంగా ఉంచింది; సందర్భంలోని స్త్రీని సూచించడానికి ‘ఈమె’ సహజం.
- source_word: וָאֶקַּח אֹתָהּ לִי לְאִשָּׁה
  choice: దాంతో నేను ఆమెను నాకు భార్యగా చేసుకోవడానికి తీసుకున్నాను
  rationale: వావ్ కథన క్రమాన్ని, అబ్రాము మాట ఫరో చర్యకు దారితీసిన సందర్భ సంబంధాన్ని ‘దాంతో’ తెలియజేస్తుంది; לִי לְאִשָּׁה లోని వ్యక్తిగత ప్రయోజనం మరియు వివాహ ఉద్దేశం రెండింటినీ నిలుపుతుంది.
- source_word: וְעַתָּה הִנֵּה אִשְׁתְּךָ
  choice: ఇదిగో, నీ భార్య!
  rationale: הִנֵּה యొక్క దృష్టి ఆకర్షించే, సమక్షతను సూచించే బలాన్ని సహజమైన తెలుగులో ‘ఇదిగో’గా అందించింది.
- source_word: קַח וָלֵךְ
  choice: ఆమెను తీసుకొని వెళ్లిపో
  rationale: రెండు ఆజ్ఞల క్రమాన్ని నిలుపుతూ, మొదటి ఆజ్ఞకు సందర్భం ద్వారా స్పష్టమైన కర్మను తెలుగులో వ్యక్తం చేసింది; ‘వెళ్లిపో’ పంపివేసే ఆజ్ఞ బలాన్ని సహజంగా తెలియజేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; రాజు పలికే గద్దింపు మరియు తక్షణ ఆజ్ఞకు తగిన సంక్షిప్త, గౌరవప్రద కథన శైలి. ‘సహోదరి’ని వాడటం ద్వారా బంధుత్వ పదానికి గంభీరమైన బైబిలు సందర్భోచితత నిలుపబడింది.
