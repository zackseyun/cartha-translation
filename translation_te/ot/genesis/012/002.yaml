source:
  edition: WLC
  text: וְ/אֶֽעֶשְׂ/ךָ֙ לְ/ג֣וֹי גָּד֔וֹל וַ/אֲבָ֣רֶכְ/ךָ֔ וַ/אֲגַדְּלָ֖ה שְׁמֶ֑/ךָ וֶ/הְיֵ֖ה בְּרָכָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/002.yaml
  text: And I will make you into a great nation[a], and I will bless you, and I will make your name great[b], and be a blessing.
translation:
  language: te
  text: నేను నిన్ను గొప్ప జాతిగా చేస్తాను; నిన్ను ఆశీర్వదిస్తాను; నీ పేరును గొప్ప చేస్తాను; నీవు ఆశీర్వాదంగా ఉండు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీవు ఆశీర్వాదంగా ఉంటావు.” హెబ్రీలోని క్రియారూపం ఆజ్ఞార్థకం (“ఉండు”); అయితే దేవుని వాగ్దానాల ఫలితాన్ని సూచిస్తున్నదని కొందరు అర్థం చేసుకుంటారు.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֶעֶשְׂךָ לְגוֹי גָּדוֹל
  choice: నేను నిన్ను గొప్ప జాతిగా చేస్తాను
  rationale: עשה అనే క్రియతో לְగוי అనే పూరక పదబంధం కలిసి, అబ్రామును ఒక గొప్ప జనసమూహం/జాతిగా రూపొందిస్తాననే భావాన్ని ఇస్తుంది. ఆధునిక తెలుగులో ‘గొప్ప జాతిగా చేస్తాను’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: וַאֲבָרֶכְךָ
  choice: నిన్ను ఆశీర్వదిస్తాను
  rationale: ברך పియేల్ రూపానికి నేరమైన అర్థం ‘ఆశీర్వదించు’. ద్వితీయ పురుష ఏకవచన కర్మను స్పష్టంగా నిలుపుతుంది.
- source_word: וַאֲגַדְּלָה שְׁמֶךָ
  choice: నీ పేరును గొప్ప చేస్తాను
  rationale: גדל యొక్క causative భావం ‘గొప్ప చేయు’; שֵׁם ను ‘పేరు’గానే ఉంచడం మూలపాఠ పారదర్శకతను, బైబిలు ప్రతిధ్వనిని కాపాడుతుంది.
- source_word: וֶהְיֵה בְּרָכָה
  choice: నీవు ఆశీర్వాదంగా ఉండు
  rationale: היה ఇక్కడ ద్వితీయ పురుష ఏకవచన ఆజ్ఞార్థక రూపం. ‘ఉండు’ ఆ వ్యాకరణ బలాన్ని నిలుపుతుంది; בְּרָכָה ను సహజమైన తెలుగులో ‘ఆశీర్వాదంగా’ అనువదించింది.
theological_decisions:
- issue: וֶהְיֵה בְּרָכָה యొక్క భావబలం
  choice: 'ఆజ్ఞార్థకంగా: ‘నీవు ఆశీర్వాదంగా ఉండు’'
  alternative: 'ఫలితాన్ని/భవిష్యత్తును సూచిస్తూ: ‘నీవు ఆశీర్వాదంగా ఉంటావు’'
  rationale: హెబ్రీ క్రియారూపం ఆజ్ఞార్థకం కాబట్టి ప్రధాన పాఠంలో దానినే నిలిపాం. అయితే ఇది దేవుని వాగ్దానాల వరుసలో ఉన్నందున ఫలితార్థక భవిష్యద్వాక్యంగా గ్రహించే అవకాశాన్ని పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన శైలి. వరుసగా ఉన్న దైవ వాగ్దానాల లయను అర్ధవిరామాలతో నిలిపి, చివరి ఆజ్ఞార్థక మలుపును స్పష్టంగా ఉంచింది.
