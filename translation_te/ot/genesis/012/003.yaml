id: GEN.12.3
reference: Genesis 12:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/אֲבָֽרֲכָה֙ מְבָ֣רְכֶ֔י/ךָ וּ/מְקַלֶּלְ/ךָ֖ אָאֹ֑ר וְ/נִבְרְכ֣וּ בְ/ךָ֔ כֹּ֖ל מִשְׁפְּחֹ֥ת הָ/אֲדָמָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/003.yaml
  text: And I will bless those who bless you[a], and the one who curses you I will curse[c][b]; and in you all the families of the earth will be blessed.
translation:
  language: te
  text: నిన్ను ఆశీర్వదించేవారిని నేను ఆశీర్వదిస్తాను; నిన్ను చులకనగా చూసేవాణ్ణి[a] నేను శపిస్తాను. నీలో భూమి యొక్క కుటుంబాలన్నీ ఆశీర్వదించబడతాయి[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నిన్ను శపించేవాణ్ణి’ లేదా ‘నిన్ను అవమానించేవాణ్ణి’ అని కూడా అనువదించవచ్చు. ఇక్కడి హీబ్రూ క్రియ (קלל) చులకనగా చూడడం, అగౌరవపరచడం లేదా శపించడం అనే అర్థాలను ఇవ్వగలదు; తరువాత ‘నేను శపిస్తాను’ అని అనువదించిన క్రియ (ארר) దీనికంటే బలమైనది.
    reason: lexical_alternative
  - marker: b
    text: ‘నిన్ను బట్టి భూమి యొక్క కుటుంబాలన్నీ తమకు ఆశీర్వాదం కోరుకుంటాయి’ లేదా ‘నీ ద్వారా భూమి యొక్క కుటుంబాలన్నీ ఆశీర్వదించబడతాయి’ అని కూడా అనువదించవచ్చు. హీబ్రూ రూపం కర్మణి భావాన్నా, ఆత్మనేపది/మధ్యమార్థాన్నా సూచిస్తుందనే విషయంలో భిన్నాభిప్రాయాలు ఉన్నాయి; ఉపసర్గకు సాధనార్థక భావం కూడా ఉండవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: וַאֲבָרֲכָה
  choice: నేను ఆశీర్వదిస్తాను
  rationale: బరఖ్ అనే క్రియలోని దేవుని ప్రథమ పురుష వాగ్దాన భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: מְבָרְכֶיךָ
  choice: నిన్ను ఆశీర్వదించేవారిని
  rationale: హీబ్రూలోని బహువచన కృదంతాన్ని వ్యక్తుల సమూహంగా చూపుతూ, దాని బహువచన భావాన్ని నిలుపుతుంది.
- source_word: וּמְקַלֶּלְךָ
  choice: నిన్ను చులకనగా చూసేవాణ్ణి
  rationale: קלל ఇక్కడ చులకనగా చూడడం, అగౌరవపరచడం లేదా శపించడం అనే భావాలను కలిగి ఉండవచ్చు. తరువాతి బలమైన ארר క్రియతో ఉన్న వ్యత్యాసాన్ని ‘చులకనగా చూసేవాణ్ణి’ నిలుపుతుంది; హీబ్రూ ఏకవచనమూ అలాగే ఉంటుంది.
- source_word: אָאֹר
  choice: నేను శపిస్తాను
  rationale: ארר శాపం విధించడాన్ని సూచించే బలమైన క్రియ. ఇది మనిషి చేసే చులకనకు దేవుడు ఇచ్చే మరింత గంభీరమైన ప్రతిస్పందనను స్పష్టంగా తెలియజేస్తుంది.
- source_word: וְנִבְרְכוּ
  choice: ఆశీర్వదించబడతాయి
  rationale: నిఫల్ రూపానికి సూటిగా సరిపోయే కర్మణి అర్థాన్ని ప్రధాన పాఠ్యంలో ఇస్తుంది. ఆత్మనేపది లేదా మధ్యమార్థ పఠనాన్ని పాదసూచికలో ఉంచి అసలులోని సందిగ్ధతను కాపాడుతుంది.
- source_word: בְּךָ
  choice: నీలో
  rationale: בְּ ఉపసర్గకు ఉన్న సూటి స్థానిక లేదా పరిధి భావాన్ని నిలుపుతుంది. ‘నీ ద్వారా’ అనే సాధనార్థక భావాన్ని ప్రత్యామ్నాయంగా పాదసూచికలో ఇస్తుంది.
- source_word: כֹּל מִשְׁפְּחֹת הָאֲדָמָה
  choice: భూమిమీదనున్న కుటుంబాలన్నీ
  rationale: מִשְׁפָּחוֹת లోని కుటుంబ లేదా వంశ సమూహాల భావాన్ని సాధారణ పాఠకులకు అర్థమయ్యే ‘కుటుంబాలు’తో అందిస్తుంది; הָאֲדָמָה యొక్క విశ్వవ్యాప్త పరిధిని ‘భూమిమీదనున్న’ తెలియజేస్తుంది.
theological_decisions:
- issue: וְנִבְרְכוּ בְךָ అనే అబ్రాహాము ఆశీర్వాద సూత్రం యొక్క అర్థం
  choice: 'కర్మణి పఠనం: ‘నీలో ... ఆశీర్వదించబడతాయి’'
  alternative: 'ఆత్మనేపది/మధ్యమార్థం: ‘నిన్ను బట్టి తమకు ఆశీర్వాదం కోరుకుంటాయి’; సాధనార్థక పఠనం: ‘నీ ద్వారా ... ఆశీర్వదించబడతాయి’'
  rationale: నిఫల్ రూపం కర్మణిగానూ ఆత్మనేపది లేదా మధ్యమార్థంగానూ చర్చించబడుతుంది; בְּ ఉపసర్గ సాధనార్థక భావాన్నీ ఇవ్వగలదు. ప్రధాన పాఠ్యంలో సూటి కర్మణి పఠనాన్ని ఉంచి, ఇతర సాధ్యమైన పఠనాలను పాదసూచికలో ఇవ్వడం ద్వారా వేదాంతపరమైన ఉద్రిక్తతను ముందే పరిష్కరించకుండా కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘చులకనగా చూసేవాణ్ణి’ సాధారణ పాఠకునికి స్పష్టంగా ఉండటంతో పాటు קלל మరియు ארר మధ్య ఉన్న బల వ్యత్యాసాన్ని కాపాడుతుంది. ఆశీర్వదించేవారి బహువచనం, చులకనగా చూసే వ్యక్తి ఏకవచనం ఉద్దేశపూర్వకంగా నిలుపబడ్డాయి.
