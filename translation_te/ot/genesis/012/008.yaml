id: GEN.12.8
reference: Genesis 12:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּעְתֵּ֨ק מִ/שָּׁ֜ם הָ/הָ֗רָ/ה מִ/קֶּ֛דֶם לְ/בֵֽית אֵ֖ל וַ/יֵּ֣ט אָהֳלֹ֑/ה בֵּֽית אֵ֤ל מִ/יָּם֙ וְ/הָ/עַ֣י מִ/קֶּ֔דֶם וַ/יִּֽבֶן שָׁ֤ם מִזְבֵּ֨חַ֙ לַֽ/יהוָ֔ה וַ/יִּקְרָ֖א בְּ/שֵׁ֥ם יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/008.yaml
  text: From there he moved to the hill country east of Bethel and pitched his tent[a], with Bethel on the west and Ai on the east[b]. There he built an altar to Yahweh and called on the name of Yahweh.
translation:
  language: te
  text: అక్కడి నుంచి అతడు బేతేలుకు తూర్పున ఉన్న కొండ ప్రాంతానికి వెళ్లి తన గుడారాన్ని వేశాడు; బేతేలు అతనికి పడమట, హాయి తూర్పున ఉండగా. అక్కడ అతడు యాహ్వేకు[a] ఒక బలిపీఠం కట్టి, యాహ్వే నామాన్ని పిలిచి ప్రార్థించాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో “YHWH”; సంప్రదాయంగా “ప్రభువు” అని అనువదిస్తారు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “యాహ్వే నామాన్ని ప్రకటించాడు.” ఈ హీబ్రూ వ్యక్తీకరణ ఆరాధనలో యాహ్వేను పిలిచి ప్రార్థించడాన్ని లేదా ఆయన నామాన్ని బహిరంగంగా ప్రకటించడాన్ని సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעְתֵּק
  choice: వెళ్లి
  rationale: ఈ క్రియ ఒక చోటు నుంచి మరొక చోటుకు తరలడాన్ని సూచిస్తుంది. సందర్భంలో ‘వెళ్లి’ సహజమైన ఆధునిక తెలుగు కథన రూపం.
- source_word: הָהָרָה
  choice: కొండప్రాంతానికి
  rationale: దిశను సూచించే రూపం కొండల ప్రాంతం వైపు వెళ్లడాన్ని తెలుపుతుంది; ఈ భౌగోళిక సందర్భంలో ఏకవచన ‘కొండకు’ కంటే ‘కొండప్రాంతానికి’ తగినది.
- source_word: מִקֶּדֶם לְבֵית אֵל
  choice: బేతేలుకు తూర్పున ఉన్న
  rationale: קֶדֶם ఇక్కడ బేతేలుతో పోల్చిన తూర్పు దిశను సూచిస్తుంది.
- source_word: וַיֵּט אָהֳלֹה
  choice: తన గుడారం వేసుకున్నాడు
  rationale: గుడారాన్ని నిలపడం లేదా ఏర్పాటు చేయడం అనే హీబ్రూ నుడికారానికి ఇది సహజమైన తెలుగు సమానార్థకం.
- source_word: מִיָּם
  choice: పడమట
  rationale: יָם అక్షరార్థంగా ‘సముద్రం’ అయినా, ఇక్కడ భౌగోళిక దిశగా పడమరను సూచిస్తుంది.
- source_word: וְהָעַי מִקֶּדֶם
  choice: తూర్పున హాయి
  rationale: అబ్రాము శిబిరానికి సంబంధించి హాయి తూర్పు వైపున ఉందని సంక్షిప్తంగా, సమతూకంగా తెలియజేస్తుంది.
- source_word: מִזְבֵּחַ
  choice: బలిపీఠం
  rationale: బలి లేదా ఆరాధన కోసం నిర్మించిన స్థలానికి ప్రామాణిక తెలుగు పదం.
- source_word: לַיהוָה
  choice: యాహ్వేకు
  rationale: హీబ్రూ దైవనామమైన יהוהను వ్యక్తిగత నామంగా నేరుగా లిప్యంతరీకరించింది.
- source_word: וַיִּקְרָא בְּשֵׁם יְהוָה
  choice: యాహ్వే నామానికి మొరపెట్టుకున్నాడు
  rationale: ఈ వ్యక్తీకరణ ఆరాధనలో యాహ్వేను వేడుకోవడాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; బహిరంగ ప్రకటన అనే సాధ్యమైన భావాన్ని పాదసూచికలో నిలుపుతుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠంలో ఉన్న ఒడంబడిక దైవనామాన్ని బిరుదుగా మార్చకుండా వ్యక్తిగత నామంగా ఉంచుతుంది.
- issue: וַיִּקְרָא בְּשֵׁם יְהוָה భావం
  choice: యాహ్వే నామానికి మొరపెట్టుకున్నాడు
  alternative: యాహ్వే నామాన్ని ప్రకటించాడు
  rationale: పితరుల ఆరాధన సందర్భంలో ప్రార్థనగా మొరపెట్టుకోవడం ప్రధాన భావంగా కనిపిస్తుంది; అయితే హీబ్రూ పదబంధం బహిరంగంగా ప్రకటించడాన్ని కూడా సూచించగలదు కాబట్టి ఆ భావాన్ని పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘ఉండేలా’ అనే నిర్మాణం శిబిరం బేతేలు, హాయి మధ్య ఉన్న స్థానాన్ని సహజంగా తెలియజేస్తుంది; దైవనామం ‘యాహ్వే’గా నిలుపబడింది.
