    reason: lexical_alternative
  - marker: b
    text: లేదా, “యాహ్వే నామాన్ని ప్రకటించాడు.” ఈ హీబ్రూ వ్యక్తీకరణ ఆరాధనలో యాహ్వేను పిలిచి ప్రార్థించడాన్ని లేదా ఆయన నామాన్ని బహిరంగంగా ప్రకటించడాన్ని సూచించవచ్చు.
