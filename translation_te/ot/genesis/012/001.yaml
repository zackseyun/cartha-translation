id: GEN.12.1
reference: Genesis 12:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל אַבְרָ֔ם לֶךְ לְ/ךָ֛ מֵ/אַרְצְ/ךָ֥ וּ/מִ/מּֽוֹלַדְתְּ/ךָ֖ וּ/מִ/בֵּ֣ית אָבִ֑י/ךָ אֶל הָ/אָ֖רֶץ אֲשֶׁ֥ר אַרְאֶֽ/ךָּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/001.yaml
  text: Yahweh said to Abram, “Go out from your land, from your kindred, and from your father’s house to the land that I will show you.”
translation:
  language: te
  text: 'యాహ్వే అబ్రాముతో ఇలా అన్నాడు: “నీ దేశాన్ని, నీ బంధువులను, నీ తండ్రి ఇంటిని విడిచిపెట్టి, నేను నీకు చూపించే దేశానికి వెళ్లు.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ మూలంలో ఉన్న దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే రూపంలో ఇచ్చాం.
- source_word: לֶךְ־לְךָ
  choice: విడిచిపెట్టి … వెళ్లు
  rationale: ఈ హీబ్రూ ఆజ్ఞ ప్రయాణాన్ని బలంగా సూచిస్తుంది; తరువాతి మూడు מִן పదబంధాలు విడిచి వెళ్లడాన్ని స్పష్టం చేస్తాయి. సహజమైన తెలుగులో ఆ భావాన్ని సమగ్రంగా వ్యక్తం చేశాం.
- source_word: מִמּוֹלַדְתְּךָ
  choice: నీ బంధువులను
  rationale: ఈ సందర్భంలో జన్మస్థలం, స్వజనులు లేదా వంశబంధువులు అనే భావపరిధి ఉంది; దేశం మరియు తండ్రి ఇల్లు మధ్య ‘బంధువులు’ సందర్భానికి సహజంగా సరిపోతుంది.
- source_word: בֵּית אָבִיךָ
  choice: నీ తండ్రి ఇంటిని
  rationale: ‘ఇల్లు’ కుటుంబ గృహాన్నీ విస్తృత పితృకుటుంబాన్నీ సూచించగల మూలంలోని భావవిస్తృతిని నిలుపుతుంది.
- source_word: הָאָרֶץ
  choice: దేశానికి
  rationale: ఇక్కడ אֶרֶץ గమ్యప్రాంతాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘దేశం’ స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: אַרְאֶךָּ
  choice: నేను నీకు చూపించే
  rationale: హీబ్రూ అసంపూర్ణ క్రియ యొక్క భవిష్యదర్థాన్ని సహజ తెలుగు సంబంధ వాక్యంగా అందించాం.
theological_decisions:
- issue: దైవనామం יְהוָה యొక్క అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠం బిరుదు కాక ప్రత్యేక దైవనామాన్ని ఉపయోగిస్తున్నందున దానిని ప్రత్యక్షంగా నిలిపాం.
- issue: לֶךְ־לְךָ లోని రెండవ వ్యక్తి సర్వనామ బలం
  choice: ప్రత్యేక అదనపు భావాన్ని జోడించకుండా ఆజ్ఞను బలమైన సహజ తెలుగులో ఇవ్వడం
  alternative: ‘నీ కోసమే వెళ్లు’ లేదా ‘నీవు వెళ్లిపో’
  rationale: לְךָ యొక్క ఖచ్చితమైన నుడికారం వివాదాస్పదం; స్వప్రయోజన భావాన్ని సిద్ధాంతపరంగా లేదా వ్యాఖ్యానాత్మకంగా బలవంతంగా చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు స్పష్టంగా ఉండే వాక్యనిర్మాణం. హీబ్రూ వాక్యారంభ וַ־ను ప్రత్యేకంగా ‘ఇప్పుడు’ అని అనువదించలేదు; తెలుగు కథన ప్రవాహంలో సహజంగా వదిలాం.
