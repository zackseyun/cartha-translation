- from: 'యెహోవా అబ్రాముతో ఇలా అన్నాడు: “నీ దేశాన్ని, నీ బంధువులను, నీ తండ్రి ఇంటిని విడిచిపెట్టి, నేను నీకు చూపించే దేశానికి వెళ్లు.”'
  to: 'యాహ్వే అబ్రాముతో ఇలా అన్నాడు: “నీ దేశాన్ని, నీ బంధువులను, నీ తండ్రి ఇంటిని విడిచిపెట్టి, నేను నీకు చూపించే దేశానికి వెళ్లు.”'
