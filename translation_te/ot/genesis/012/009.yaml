translation:
  language: te
  text: అబ్రాము నెగెబు వైపు తన ప్రయాణాన్ని కొనసాగించాడు.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దక్షిణం వైపు.” హీబ్రూ పదం నెగెబు అనే దక్షిణ ప్రాంతాన్నిగానీ, దక్షిణ దిశనుగానీ సూచించవచ్చు; ఇక్కడ ప్రాంతాన్ని సూచించే అర్థమే ఎక్కువ సంభావ్యమైనది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “అబ్రాము ప్రయాణం సాగిస్తూ నెగెబు వైపు వెళ్లాడు.”
    reason: previous_rendering
lexical_decisions:
- source_word: וַיִּסַּע
  choice: ప్రయాణం సాగిస్తూ … వెళ్లాడు
  rationale: נסע అనే క్రియ ఇక్కడ మకాం ఎత్తి ముందుకు ప్రయాణించడాన్ని సూచిస్తుంది. తెలుగు వాక్యంలో తరువాతి క్రియాపదబంధంతో కలిపి, కొనసాగుతున్న ప్రయాణ భావాన్ని సహజంగా వ్యక్తం చేశాం.
- source_word: אַבְרָם
  choice: అబ్రాము
  rationale: తెలుగు బైబిలు నామరూప సంప్రదాయానికి అనుగుణమైన లిప్యంతరీకరణ.
- source_word: הָלוֹךְ וְנָסוֹעַ
  choice: ప్రయాణం సాగిస్తూ
  rationale: ఈ క్రియారూపాల కలయిక నిరంతరంగా లేదా క్రమంగా ముందుకు సాగడాన్ని తెలియజేస్తుంది. మూలంలో స్పష్టంగా లేని ‘దశలవారీగా’ అనే భావాన్ని చేర్చకుండా, సహజమైన ఆధునిక తెలుగులో కొనసాగింపు భావాన్ని నిలిపింది.
- source_word: הַנֶּגְבָּה
  choice: నెగెబు వైపు
  rationale: దిశను సూచించే ప్రత్యయం ‘వైపు’గా ఇవ్వబడింది. సపదంతో కూడిన נֶגֶב ఇక్కడ దక్షిణ ప్రాంతమైన నెగెబును సూచించే అవకాశం ఎక్కువ; అయినా ‘దక్షిణం వైపు’ అనే అర్థం కూడా సాధ్యమే.
theological_decisions: []
