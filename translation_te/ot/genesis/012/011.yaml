id: GEN.12.11
reference: Genesis 12:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְהִ֕י כַּ/אֲשֶׁ֥ר הִקְרִ֖יב לָ/ב֣וֹא מִצְרָ֑יְמָ/ה וַ/יֹּ֨אמֶר֙ אֶל שָׂרַ֣י אִשְׁתּ֔/וֹ הִנֵּה נָ֣א יָדַ֔עְתִּי כִּ֛י אִשָּׁ֥ה יְפַת מַרְאֶ֖ה אָֽתְּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/011.yaml
  text: And it happened[a], as he was about to enter Egypt, that he said to Sarai his wife, “Look now[b], I know that you are a woman beautiful in appearance.”
translation:
  language: te
  text: 'అతడు ఐగుప్తులో ప్రవేశించబోతుండగా, తన భార్య శారయితో ఇలా అన్నాడు: “ఇదిగో, నువ్వు చూడడానికి అందమైన స్త్రీవని[a] నాకు తెలుసు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అందమైన రూపం గల స్త్రీవని.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: అతడు …బోతుండగా
  rationale: హీబ్రూ కథన సూత్రాన్ని తెలుగులో సహజమైన కాలసూచక ఉపవాక్యంగా వ్యక్తం చేస్తుంది; సంఘటనల వరుసను కాపాడుతూ కృత్రిమమైన ‘అప్పుడు ఇలా జరిగింది’ అనే నిర్మాణాన్ని నివారిస్తుంది.
- source_word: הִקְרִיב לָבוֹא
  choice: ప్రవేశించబోతుండగా
  rationale: קרב హిఫీల్ రూపం, בוא క్రియావాచకంతో కలిసి, ప్రవేశించే సమయం సమీపించిందనే భావాన్ని ఇస్తుంది. ఈ తెలుగు ప్రయోగం ఆ సమీపతనాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: מִצְרָיְמָה
  choice: ఐగుప్తులో
  rationale: స్థలపేరుకు జోడించిన దిశాసూచక అంత్యం ఐగుప్తు వైపు కదలికను సూచిస్తుంది; ‘ప్రవేశించు’తో తెలుగులో ‘ఐగుప్తులో’ సహజం.
- source_word: שָׂרַי אִשְׁתּוֹ
  choice: తన భార్య శారయితో
  rationale: శారయిని అబ్రాము భార్యగా గుర్తించే హీబ్రూ సమానాధికార నిర్మాణాన్ని సహజమైన తెలుగు పదక్రమంలో ఉంచుతుంది.
- source_word: הִנֵּה נָא
  choice: ఇదిగో
  rationale: శ్రద్ధను ఆకర్షించే הִנֵּה మరియు సంభాషణకు మృదుత్వం లేదా బలాన్ని చేర్చే נָא కలయికను ప్రాచీనంగా అనిపించకుండా సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: יָדַעְתִּי
  choice: నాకు తెలుసు
  rationale: పూర్తిక్రియ ఇక్కడ ప్రస్తుతం ఉన్న జ్ఞానస్థితిని సూచిస్తుంది; ‘నాకు తెలుసు’ ఆధునిక తెలుగులో సహజం.
- source_word: אִשָּׁה יְפַת מַרְאֶה
  choice: చూడడానికి అందమైన స్త్రీ
  rationale: మַרְאֶה కనిపించే రూపాన్ని సూచిస్తుంది. ఈ ఎంపిక సౌందర్యం బాహ్యంగా కనిపించేదని స్పష్టంగా, సాధారణ పాఠకులకు సహజంగా తెలియజేస్తుంది.
- source_word: אָתְּ
  choice: నువ్వు … స్త్రీవని
  rationale: స్వతంత్ర స్త్రీలింగ ఏకవచన సర్వనామానికి హీబ్రూలో ఉన్న ఉద్ఘాటనను తెలుగు వాక్యంలో స్పష్టమైన కర్తగా నిలుపుతుంది.
theological_decisions: []
