  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన కథన ప్రవాహం, గౌరవప్రదమైన సంభాషణా శైలి పాటించబడ్డాయి. ‘శారయి’, ‘ఐగుప్తు’ అనే సంప్రదాయ తెలుగు బైబిలు పేర్లు ఉపయోగించబడ్డాయి.
