  yaml_path: translation/ot/genesis/012/020.yaml
  text: Then Pharaoh gave men orders concerning him[c][b][a], and they sent him away with his wife and all that belonged to him.
translation:
  language: te
  text: అప్పుడు ఫరో అతని విషయమై మనుషులకు ఆజ్ఞలు ఇచ్చాడు[a][b]. వారు అతనిని, అతని భార్యను, అతనికి ఉన్నదంతటినీ[c] పంపివేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అప్పుడు ఫరో అతని విషయమై మనుషులకు ఆజ్ఞ ఇచ్చాడు.”
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో “మనుషులు” అని ఉంది. సందర్భంలో వీరు ఫరో పరివారంలోని వారో, అతని ప్రతినిధులో అయి ఉండవచ్చు; అయితే వారి పాత్రను వాక్యం నిర్దిష్టంగా చెప్పదు.
    reason: cultural_note
  - marker: c
    text: లేదా, “అతనికి ఉన్న సమస్తాన్ని.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: ఆజ్ఞాపించాడు
  rationale: צוה అనే క్రియకు ‘ఆజ్ఞాపించు/ఆదేశించు’ అనే సాధారణ అర్థం ఉంది; తెలుగు వాక్యంలో అధికారపూర్వక ఆదేశాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: עָלָיו
  choice: అతని గురించి
  rationale: צוה తో వచ్చిన עַל ఇక్కడ అబ్రాముకు సంబంధించిన ఆదేశాలను సూచిస్తుంది; ‘అతని గురించి’ మూలంలోని విస్తృతతను కాపాడుతుంది.
- source_word: אֲנָשִׁים
  choice: కొందరు మనుషులు
  rationale: మూలంలో పాత్రను ప్రత్యేకంగా చెప్పకుండా ‘మనుషులు’ అని మాత్రమే ఉంది. తెలుగు సహజత్వం కోసం ‘కొందరు’ చేర్చినా, సేవకులు లేదా అధికారులు అని నిర్దిష్టం చేయలేదు.
- source_word: וַיְשַׁלְּחוּ
  choice: పంపివేశారు
  rationale: שלח యొక్క ఈ సందర్భార్థం పంపివేయడం లేదా వెళ్లగొట్టడం; ‘పంపివేశారు’ ఆ భావాన్ని సహజంగా ఇస్తూ, కేవలం తోడ్కొని వెళ్లారనే అదనపు భావాన్ని చేర్చదు.
- source_word: אֹתוֹ
  choice: అతనిని
  rationale: అబ్రామును సూచించే ప్రత్యక్ష కర్మ సర్వనామానికి సరళమైన అనువాదం.
- source_word: אִשְׁתּוֹ
  choice: అతని భార్యను
  rationale: వైవాహిక సందర్భంలో אשה + ప్రత్యయం యొక్క సాధారణ అర్థం ‘అతని భార్య’.
- source_word: כָּל אֲשֶׁר לוֹ
  choice: అతనికి ఉన్నదంతటినీ
  rationale: ఈ పదబంధం అబ్రాముకు ఉన్న సమస్తాన్ని సూచిస్తుంది; తెలుగు భాషలో సంక్షిప్తంగా, సహజంగా, మూలానికి దగ్గరగా ఉంటుంది.
- source_word: פַּרְעֹה
  choice: ఫరో
  rationale: ఈజిప్టు రాజ బిరుదుకు తెలుగులో ప్రాచుర్యంలో ఉన్న రూపం.
