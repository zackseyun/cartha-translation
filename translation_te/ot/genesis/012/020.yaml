translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. మూలంలోని ‘మనుషులు’ అనే అనిర్దిష్ట పదాన్ని పాత్రపరంగా విస్తరించకుండా నిలిపి, పంపివేత భావాన్ని సహజమైన ‘పంపివేశారు’తో వ్యక్తం చేశాం. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
