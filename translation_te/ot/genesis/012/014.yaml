lexical_decisions:
- source_word: וַיְהִי כְּבֹא
  choice: ప్రవేశించినప్పుడు
  rationale: היהతో కూడిన కథన నిర్మాణం మరియు כְּతో ఉన్న infinitive construct తరువాతి సంఘటనకు కాలసంబంధ నేపథ్యాన్ని ఇస్తాయి. ఆధునిక తెలుగులో ‘ప్రవేశించినప్పుడు’ సహజంగా ఉండి, ఐగుప్తులోనికి వచ్చిన భావాన్ని తెలియజేస్తుంది.
- source_word: מִצְרָיְמָה
  choice: ఐగుప్తులో
  rationale: దిశను సూచించే ה־, ‘ఐగుప్తు వైపు/లోనికి’ అనే గమనాన్ని సూచిస్తుంది. ‘ప్రవేశించాడు’ అనే క్రియతో తెలుగులో ‘ఐగుప్తులో’ సహజమైన నిర్మాణం.
- source_word: וַיִּרְאוּ
  choice: చూశారు
  rationale: ראה యొక్క ప్రాథమిక అర్థమైన ‘చూచుట’ను నిలుపుతుంది; ‘గమనించారు’ అనడం సాధ్యమైనా కొంత వ్యాఖ్యానాత్మకం.
- source_word: הַמִּצְרִים
  choice: ఐగుప్తీయులు
  rationale: నిర్దిష్ట బహువచన జాతివాచక పదానికి సాధారణ తెలుగు సమానం.
- source_word: הָאִשָּׁה
  choice: ఆ స్త్రీ
  rationale: אִשָּׁהకు ‘స్త్రీ’ లేదా ‘భార్య’ అనే రెండు అర్థాలు ఉండగలవు. ఈ ఉపవాక్యంలోని సాధారణ పదప్రయోగాన్ని ‘ఆ స్త్రీ’ నిలుపుతుంది; వైవాహిక సంబంధాన్ని ప్రధాన పాఠంలో అదనంగా నిర్దిష్టం చేయదు.
- source_word: כִּי
  choice: అని
  rationale: వారు చూసి గ్రహించిన విషయాన్ని పరిచయం చేసే complementizerగా ఇక్కడ పనిచేస్తుంది; తెలుగులో ‘అని’ సహజ సమానం.
- source_word: יָפָה
  choice: అందంగా
  rationale: శారీరక సౌందర్యాన్ని సూచించే విశేషణానికి స్పష్టమైన, ఆధునిక తెలుగు రూపం.
- source_word: מְאֹד
  choice: చాలా
  rationale: విశేషణ భావాన్ని బలపరచే సాధారణ ఆధునిక తెలుగు తీవ్రతా సూచకం.
