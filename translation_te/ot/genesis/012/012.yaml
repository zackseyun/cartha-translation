  source_fidelity: 'The Telugu accurately conveys the Hebrew future scenario: the Egyptians’ seeing Sarai, their identifying her as Abram’s wife, their killing Abram, and their allowing her to live. The conditional-temporal sequence “చూసినప్పుడు … అప్పుడు” naturally represents וְהָיָה כִּי without adding meaning.'
