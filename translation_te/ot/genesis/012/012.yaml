id: GEN.12.12
reference: Genesis 12:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הָיָ֗ה כִּֽי יִרְא֤וּ אֹתָ/ךְ֙ הַ/מִּצְרִ֔ים וְ/אָמְר֖וּ אִשְׁתּ֣/וֹ זֹ֑את וְ/הָרְג֥וּ אֹתִ֖/י וְ/אֹתָ֥/ךְ יְחַיּֽוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/012.yaml
  text: And it will be that when the Egyptians see you[a], they will say, ‘This is his wife,’ and they will kill me[b], but they will let you live.
translation:
  language: te
  text: ఈజిప్టీయులు నిన్ను చూసినప్పుడు, ‘ఈమె అతని భార్య’ అని అంటారు. అప్పుడు వారు నన్ను చంపుతారు; కాని నిన్ను బతకనిస్తారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: చూసినప్పుడు … అప్పుడు
  rationale: భవిష్యత్తులో సంభవించబోయే పరిస్థితిని పరిచయం చేసే హీబ్రూ నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగులో షరతు-ఫలిత నిర్మాణంగా వ్యక్తం చేస్తుంది.
- source_word: יִרְאוּ אֹתָךְ
  choice: నిన్ను చూసినప్పుడు
  rationale: ראה అనే సాధారణ ‘చూడు’ అనే అర్థాన్ని నేరుగా, సహజంగా అందిస్తుంది.
- source_word: הַמִּצְרִים
  choice: ఈజిప్టీయులు
  rationale: జాతి/దేశ ప్రజలను సూచించే ప్రామాణిక ఆధునిక తెలుగు రూపం.
- source_word: אִשְׁתּוֹ זֹאת
  choice: ఈమె అతని భార్య
  rationale: ‘అతని భార్య—ఈమె’ అనే హీబ్రూ నామవాచక వాక్యంలోని నిర్దేశక బలాన్ని సహజమైన తెలుగు పదక్రమంలో నిలుపుతుంది.
- source_word: וְהָרְגוּ אֹתִי
  choice: వారు నన్ను చంపుతారు
  rationale: הרג యొక్క సాధారణ అర్థమైన ‘చంపు’ను ఎటువంటి అనవసర తీవ్రతను జోడించకుండా నేరుగా అందిస్తుంది.
- source_word: וְאֹתָךְ יְחַיּוּ
  choice: కాని నిన్ను బతకనిస్తారు
  rationale: חיה హిఫీల్ రూపంలోని ‘బతకనివ్వు/సజీవంగా ఉంచు’ భావాన్ని సహజంగా వ్యక్తం చేస్తూ, నన్ను చంపడం—నిన్ను బతకనివ్వడం మధ్య ఉన్న వ్యత్యాసాన్ని ‘కాని’తో స్పష్టం చేస్తుంది.
theological_decisions: []
translation_notes:
  register: సాధారణ పాఠకులకు స్పష్టంగా ఉండే ఆధునిక ప్రామాణిక తెలుగు; సంభాషణలో గౌరవభరితమైన సరళతను, మూలంలోని భవిష్యత్ భయాన్ని మరియు వ్యత్యాసాన్ని నిలుపుతుంది.
