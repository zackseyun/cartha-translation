  to: అప్పుడు ఫరో అబ్రామును పిలిచి, “నీవు నాకు చేసిన ఈ పని ఏమిటి? ఆమె నీ భార్య అని నాకు ఎందుకు చెప్పలేదు?” అన్నాడు.
