id: GEN.12.18
reference: Genesis 12:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּקְרָ֤א פַרְעֹה֙ לְ/אַבְרָ֔ם וַ/יֹּ֕אמֶר מַה זֹּ֖את עָשִׂ֣יתָ לִּ֑/י לָ֚/מָּה לֹא הִגַּ֣דְתָּ לִּ֔/י כִּ֥י אִשְׁתְּ/ךָ֖ הִֽוא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/018.yaml
  text: Then Pharaoh called Abram and said, “What is this you have done to me? Why did you not tell me that she is your wife?”
translation:
  language: te
  text: అప్పుడు ఫరో అబ్రామును పిలిచి, “నీవు నాకు చేసిన ఈ పని ఏమిటి? ఆమె నీ భార్య అని నాకు ఎందుకు చెప్పలేదు?” అన్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: పిలిపించి
  rationale: కרא అనే క్రియ לְ తో వ్యక్తిని సూచించినప్పుడు పిలవడం లేదా రప్పించడం అనే అర్థం ఇస్తుంది. రాజైన ఫరో అబ్రామును తన దగ్గరకు రప్పించిన సందర్భంలో ‘పిలిపించి’ సహజంగా ఉంది; ‘రప్పించి’ కంటే మూలంలోని ‘పిలిచాడు’ భావాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: פַרְעֹה
  choice: ఫరో
  rationale: హీబ్రూ రాజబిరుదుకు తెలుగులో స్థిరపడిన ప్రామాణిక రూపం.
- source_word: לְאַבְרָם
  choice: అబ్రాము
  rationale: వ్యక్తి పేరును అనువదించకుండా తెలుగులో ప్రాచుర్యంలో ఉన్న రూపంలో లిప్యంతరీకరించాం; కర్మవిభక్తితో ‘అబ్రామును’ అయింది.
- source_word: וַיֹּאמֶר
  choice: అని అడిగాడు
  rationale: אמר యొక్క ప్రాథమిక అర్థం ‘అన్నాడు’; అయితే తరువాత వరుసగా ప్రశ్నలు వస్తున్నందున తెలుగులో ‘అని అడిగాడు’ సహజమైన సంభాషణా నిర్మాణం. ఇది మాటల ప్రశ్నార్థక స్వభావాన్ని మాత్రమే వ్యక్తం చేస్తుంది.
- source_word: מַה זֹּאת עָשִׂיתָ לִּי
  choice: నీవు నాకు చేసిన ఈ పని ఏమిటి?
  rationale: מַה זֹּאת లోని సూచనాత్మక బలాన్ని ‘ఈ పని ఏమిటి?’గా నిలిపి, עָשִׂיתָ לִּי లోని వ్యక్తిగత అభ్యంతరాన్ని ‘నాకు చేసిన’గా స్పష్టంగా ఉంచాం.
- source_word: לָמָּה לֹא הִגַּדְתָּ לִּי
  choice: నాతో ఎందుకు చెప్పలేదు?
  rationale: נגד హిఫిల్ రూపం ఇక్కడ ‘తెలియజేయడం/చెప్పడం’ అని అర్థం. ఆధునిక తెలుగులో ‘నాతో చెప్పడం’ సహజంగా ఉండి, לִי యొక్క సంబంధాన్ని కాపాడుతుంది.
- source_word: כִּי
  choice: అని
  rationale: ఇక్కడ כִּי అబ్రాము వెల్లడించని విషయవిషయక వాక్యాన్ని ప్రవేశపెడుతుంది; తెలుగులో దానికి సహజమైన పూరక సూచిక ‘అని’.
- source_word: אִשְׁתְּךָ הִוא
  choice: ఆమె నీ భార్య
  rationale: హీబ్రూ నామవాచక వాక్యంలోని వర్తమాన భావాన్నీ, הִוא ద్వారా స్త్రీపై పడే స్పష్టతనూ ‘ఆమె నీ భార్య’ నిలుపుతుంది.
- source_word: וַ
  choice: అప్పుడు
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది; ఆధునిక తెలుగులో ‘అప్పుడు’ సంఘటనల క్రమాన్ని సహజంగా తెలియజేస్తుంది.
