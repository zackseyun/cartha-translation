translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా గౌరవప్రదమైన కథన శైలి వాడాం. ఫరో మాటల్లోని నేరుగా ప్రశ్నించే గద్దింపు స్వరాన్ని అతిశయింపకుండా నిలిపాం.
