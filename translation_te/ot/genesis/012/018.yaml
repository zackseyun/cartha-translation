review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys Pharaoh's rebuke, the personal force of 'to me,' and the undisclosed fact that the woman is Abram's wife. However, וַיֹּאמֶר is 'said,' not specifically 'asked'; the interrogative content does not require changing the reporting verb. Also, 'పిలిపించి' can suggest having someone else call Abram, whereas 'పిలిచి' directly represents Pharaoh's action.
  naturalness: The revised wording is fluent modern standard Telugu and retains the direct, reproachful narrative register. 'నాకు చెప్పలేదు' is more direct and idiomatic for the Hebrew indirect-object sense than 'నాతో చెప్పలేదు.'
  terminology: '''ఫరో'' and ''అబ్రాము'' are appropriate standard Telugu biblical forms. No theological terminology or footnotes are involved.'
  issues:
  - severity: low
    issue: Reporting verb rendered as 'అడిగాడు' ('asked').
    rationale: The Hebrew uses the general narrative verb וַיֹּאמֶר, 'said.' Although Pharaoh's speech consists of questions, retaining 'అన్నాడు' more closely follows the source without reducing naturalness.
  - severity: low
    issue: '''పిలిపించి'' may imply indirect causation.'
    rationale: The Hebrew states that Pharaoh himself called Abram. 'అబ్రామును పిలిచి' is direct and unambiguous.
  - severity: low
    issue: '''నాతో ఎందుకు చెప్పలేదు'' is less precise for לִי.'
    rationale: The Hebrew means 'tell me'; Telugu 'నాకు ఎందుకు చెప్పలేదు' conveys this recipient relation more directly.
  revised_text: అప్పుడు ఫరో అబ్రామును పిలిచి, “నీవు నాకు చేసిన ఈ పని ఏమిటి? ఆమె నీ భార్య అని నాకు ఎందుకు చెప్పలేదు?” అన్నాడు.
  revised_footnotes: []
  revision_rationale: 'The revision preserves the Hebrew wording and narrative sequence while making three small fidelity improvements: Pharaoh directly calls Abram, he ''says'' rather than merely ''asks,'' and Abram failed to tell Pharaoh rather than simply speak with him. No disputed ambiguity requires a note.'
