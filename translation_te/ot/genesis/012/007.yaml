revisions:
- from: అప్పుడు యెహోవా అబ్రాముకు ప్రత్యక్షమై, “నీ సంతానానికి[a] ఈ దేశాన్ని ఇస్తాను” అని చెప్పాడు. తనకు ప్రత్యక్షమైన యెహోవా కోసం అబ్రాము అక్కడ ఒక బలిపీఠాన్ని కట్టాడు.
  to: అప్పుడు యాహ్వే అబ్రాముకు ప్రత్యక్షమై, “నీ సంతానానికి[a] ఈ భూమిని ఇస్తాను” అని చెప్పాడు. అప్పుడు అతడు అక్కడ తనకు ప్రత్యక్షమైన యాహ్వేకు ఒక బలిపీఠాన్ని కట్టాడు.
  rationale: The revision aligns the divine-name rendering with the supplied POB decision, uses “భూమి” to preserve the non-political territorial sense of הארץ, and makes the altar's dedication to Yahweh more direct. It preserves the collective-singular ambiguity of זֶרַע through “సంతానం” and retains the footnote anchor and lexical alternative.
