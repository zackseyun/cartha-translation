id: GEN.12.7
reference: Genesis 12:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֵּרָ֤א יְהוָה֙ אֶל אַבְרָ֔ם וַ/יֹּ֕אמֶר לְ/זַ֨רְעֲ/ךָ֔ אֶתֵּ֖ן אֶת הָ/אָ֣רֶץ הַ/זֹּ֑את וַ/יִּ֤בֶן שָׁם֙ מִזְבֵּ֔חַ לַ/יהוָ֖ה הַ/נִּרְאֶ֥ה אֵלָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/007.yaml
  text: Then Yahweh appeared to Abram and said[a], “To your offspring I will give this land.” So there he built an altar to Yahweh, who had appeared to him.
translation:
  language: te
  text: అప్పుడు యాహ్వే అబ్రాముకు ప్రత్యక్షమై, “నీ సంతానానికి[a] ఈ భూమిని ఇస్తాను” అని చెప్పాడు. అప్పుడు అతడు అక్కడ తనకు ప్రత్యక్షమైన యాహ్వేకు ఒక బలిపీఠాన్ని కట్టాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీ విత్తనానికి.” హీబ్రూ పదం రూపంలో ఏకవచనమైనా, ఒక సమూహంగా సంతానాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగు బైబిలు వాడుకలో సుపరిచితమైన ‘యెహోవా’ రూపంలో అందించాం.
- source_word: וַיֵּרָא
  choice: ప్రత్యక్షమై
  rationale: ראה నిఫాల్ రూపం ఇక్కడ అబ్రాముకు కనబడే విధంగా దేవుడు ప్రత్యక్షం కావడాన్ని సూచిస్తుంది; ‘ప్రత్యక్షమై’ సహజమైన, గౌరవప్రదమైన తెలుగు.
- source_word: לְזַרְעֲךָ
  choice: నీ సంతానానికి
  rationale: זֶרַע ఏకవచన రూపంలో ఉండి సమూహార్థంలో పనిచేయగలదు. ‘సంతానం’ ఆ రూపార్థ ఉద్రిక్తతను నిలుపుతూ సహజ తెలుగులో ఉంటుంది.
- source_word: אֶתֵּן
  choice: ఇస్తాను
  rationale: అసంపూర్ణ క్రియ ఇక్కడ భవిష్య వాగ్దానాన్ని వ్యక్తం చేస్తుంది; ‘ఇస్తాను’ దాని హామీ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: הָאָרֶץ הַזֹּאת
  choice: ఈ దేశాన్ని
  rationale: ఈ పితృపురుష వాగ్దాన సందర్భంలో אֶרֶץ నిర్దిష్ట భూభాగాన్ని సూచిస్తుంది; తెలుగులో ‘ఈ దేశాన్ని’ సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: וַיִּבֶן שָׁם מִזְבֵּחַ
  choice: అక్కడ ఒక బలిపీఠాన్ని కట్టాడు
  rationale: కథన క్రమాన్నీ, స్థల సూచననూ నిలుపుతూ ఆధునిక తెలుగులో సహజమైన పదక్రమాన్ని ఉపయోగించాం.
- source_word: לַיהוָה
  choice: యెహోవా కోసం
  rationale: లామెద్ బలిపీఠం యెహోవాకు అంకితమైందనే భావాన్ని సూచిస్తుంది; ‘కోసం’ తెలుగులో ఆ అంకిత సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: הַנִּרְאֶה אֵלָיו
  choice: తనకు ప్రత్యక్షమైన
  rationale: ఆర్టికల్‌తో ఉన్న కృదంతం యెహోవాను అబ్రాముకు ప్రత్యక్షమైనవాడిగా గుర్తిస్తుంది; తెలుగు విశేషణ వాక్యభాగం ముందరి సంఘటనను సహజంగా సూచిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది. దానిని బిరుదైన ‘ప్రభువు’తో మార్చకుండా పేరుగా నిలిపాం.
- issue: זֶרַע యొక్క సమూహార్థక ఏకవచనం
  choice: సంతానం
  alternative: వారసులు / సంతతి
  rationale: హీబ్రూ పదం రూపంలో ఏకవచనమైనా ఒక సమూహాన్ని సూచించగలదు. ‘సంతానం’ దానిని కేవలం ఒక వ్యక్తికిగానీ స్పష్టమైన బహువచనానికిగానీ పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే గౌరవప్రదమైన బైబిలు కథన శైలిలో రూపొందించబడింది. ‘సంతానం’ ద్వారా మూలంలోని ఏకవచన రూపం–సమూహార్థం మధ్య ఉన్న భావ ఉద్రిక్తత నిలుపబడింది.
