  text: అప్పుడు అబ్రాహాము లేచి, ఆ దేశ ప్రజలకు, అంటే హేతు కుమారులకు[a], వంగి నమస్కరించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా “హిత్తీయులకు.” హీబ్రూలో: “హేతు కుమారులకు.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: అప్పుడు అబ్రాహాము లేచి
  rationale: קום అనే క్రియ యొక్క కథన క్రమాన్ని ‘అప్పుడు’తో, లేచి నిలబడే చర్యను సహజమైన తెలుగు ‘లేచి’తో వ్యక్తం చేసింది.
- source_word: וַיִּשְׁתַּחוּ
  choice: వంగి నమస్కరించాడు
  rationale: שׁחה రూపం గౌరవంతో వంగడాన్ని లేదా సాష్టాంగపడడాన్ని సూచించవచ్చు. సందర్భంలో గౌరవప్రదమైన శారీరక భంగిమను అతిశయింపకుండా ‘వంగి నమస్కరించాడు’ సహజంగా తెలియజేస్తుంది.
- source_word: לְעַם הָאָרֶץ
  choice: ఆ దేశ ప్రజలకు
  rationale: ల ఉపసర్గ నమస్కారానికి లక్ష్యమైనవారిని సూచిస్తుంది; עם הארץను సందర్భంలోని స్థానిక ప్రజలను సూచించే ‘ఆ దేశ ప్రజలు’గా అనువదించింది.
- source_word: לִבְנֵי חֵת
  choice: అంటే హేతు కుమారులకు
  rationale: అక్షరార్థంగా ‘హేతు కుమారులు.’ ముందు పేర్కొన్న ‘ఆ దేశ ప్రజలు’ ఎవరనే వివరణాత్మక సంబంధాన్ని ‘అంటే’ స్పష్టం చేస్తుంది; వంశపరమైన హీబ్రూ రూపాన్ని ప్రధాన పాఠ్యంలో నిలుపుతుంది.
- source_word: חֵת
  choice: హేతు
  rationale: వ్యక్తినామాన్ని ఆధునిక ప్రామాణిక తెలుగు లిప్యంతరీకరణలో ‘హేతు’గా ఉంచింది.
