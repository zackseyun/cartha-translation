  source_fidelity: హీబ్రూ వాక్యంలోని గౌరవసంబోధన, వినమనే విజ్ఞప్తి, నాలుగు వందల షెకెలుల వెండి అనే ధరను సూచించే సంక్షిప్త నిర్మాణం, ‘నాకూ మీకూ మధ్య అదెంత?’ అనే అలంకారిక ప్రశ్న, అలాగే పాతిపెట్టమనే ముగింపు ఆజ్ఞ అన్నీ విశ్వసనీయంగా ప్రతిఫలించాయి. ‘మృతురాలిని’ అనేది సమీప సందర్భంలో శారాను సూచించడం వల్ల సముచితమైన సందర్భానుగత స్పష్టీకరణ; అర్థాన్ని మార్చదు.
  naturalness: అనువాదం ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, మర్యాదపూర్వకంగా ఉంది. ‘అయ్యా, నా మాట వినండి’ మరియు ‘నాకూ మీకూ మధ్య అదెంత?’ బేరసారపు సందర్భంలోని గౌరవాన్ని, ధరను తక్కువగా చూపే ధోరణిని చక్కగా తెలియజేస్తాయి.
  terminology: ‘షెకెలు’ను లిప్యంతరీకరించడం తగినది. ‘భూమి’ సందర్భానికి సరిపోతుంది; ‘విలువైన’ హీబ్రూ ఎలిప్సిస్‌ను అర్థవంతంగా పూరిస్తుంది. ఎటువంటి సిద్ధాంతపరమైన లేదా అసంగత నామకరణ సమస్య లేదు.
