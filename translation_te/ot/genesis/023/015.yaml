source:
  edition: WLC
  text: אֲדֹנִ֣/י שְׁמָעֵ֔/נִי אֶרֶץ֩ אַרְבַּ֨ע מֵאֹ֧ת שֶֽׁקֶל כֶּ֛סֶף בֵּינִ֥/י וּ/בֵֽינְ/ךָ֖ מַה הִ֑וא וְ/אֶת מֵתְ/ךָ֖ קְבֹֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/015.yaml
  text: 'My lord[a], listen to me: a piece of land worth four hundred shekels of silver—what is that between me and you? Bury your dead.'
translation:
  language: te
  text: “అయ్యా, నా మాట వినండి. నాలుగు వందల షెకెలుల వెండి విలువైన భూమి—నాకూ మీకూ మధ్య అదెంత? మీ మృతురాలిని పాతిపెట్టండి.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ఇంకా అక్షరార్థంగా: “భూమి—నాలుగు వందల షెకెలుల వెండి—నాకూ మీకూ మధ్య అదెంత?” హీబ్రూ వాక్యం సంక్షిప్తంగా, సూచ్యార్థంతో ఉంది; బేరసారంలో ధరను చిన్నదిగా చూపించే అలంకారిక ప్రశ్న ఇది.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנִי
  choice: అయ్యా
  rationale: ఎఫ్రోనును గౌరవంగా సంబోధించే పదం; ఇది దైవ బిరుదు కాదు. ఆధునిక తెలుగులో ‘అయ్యా’ సహజమైన గౌరవ సంబోధన.
- source_word: שְׁמָעֵנִי
  choice: నా మాట వినండి
  rationale: వినమని చేసే ప్రత్యక్షమైనప్పటికీ మర్యాదపూర్వకమైన విజ్ఞప్తిని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אֶרֶץ
  choice: భూమి
  rationale: చర్చలో ఉన్న నిర్దిష్ట భూభాగాన్ని సూచిస్తుంది; సందర్భం వల్ల ఆస్తి భావం స్పష్టమవుతుంది.
- source_word: אַרְבַּע מֵאֹת שֶׁקֶל כֶּסֶף
  choice: నాలుగు వందల షెకెలుల వెండి విలువైన
  rationale: హీబ్రూ సంక్షిప్త నిర్మాణంలో సూచితమైన ధర/విలువ సంబంధాన్ని తెలుగులో స్పష్టంగా, సహజంగా అందిస్తుంది.
- source_word: בֵּינִי וּבֵינְךָ מַה הִוא
  choice: నాకూ మీకూ మధ్య అదెంత?
  rationale: ఇద్దరి మధ్య ఆ మొత్తం పెద్దది కాదని అలంకారికంగా తగ్గించి చెప్పే బేరసారపు ధోరణిని నిలుపుతుంది.
- source_word: וְאֶת מֵתְךָ קְבֹר
  choice: మీ మృతురాలిని పాతిపెట్టండి
  rationale: సందర్భంలో శారా అనే స్త్రీని సూచిస్తున్నందున తెలుగులో స్త్రీలింగ ఏకవచనం సహజం; ముగింపు ఆజ్ఞను నేరుగా ఉంచుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవ బహువచనాన్ని వాడి, బేరసారపు మర్యాదను మరియు సంక్షిప్త అలంకారిక ప్రశ్నను నిలిపాం. ‘షెకెలు’ అనే ప్రాచీన బరువు/ధన ప్రమాణాన్ని అనువదించకుండా లిప్యంతరీకరించాం.
