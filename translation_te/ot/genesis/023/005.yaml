  yaml_path: translation/ot/genesis/023/005.yaml
  text: The sons of Heth answered Abraham[a], saying to him,
translation:
  language: te
  text: 'హేతు కుమారులు[a] అబ్రాహాముకు ఇలా జవాబిచ్చారు:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “హిత్తీయులు.” హీబ్రూ మూలంలో “హేతు కుమారులు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲנוּ
  choice: జవాబిస్తూ … అన్నారు
  rationale: ענה అనే క్రియ సంభాషణలో ప్రతిస్పందనను సూచిస్తుంది. తరువాతి לֵאמֹר‌తో కలిపి సహజమైన ఆధునిక తెలుగు వాక్యనిర్మాణం కోసం ‘జవాబిస్తూ … ఇలా అన్నారు’ అని అనువదించబడింది.
- source_word: בְנֵי חֵת
  choice: హేతు కుమారులు
  rationale: అక్షరార్థంగా ‘హేతు కుమారులు.’ హీబ్రూ బంధుత్వ వ్యక్తీకరణను, హేతు అనే వ్యక్తినామాన్ని నిలుపుతుంది; సందర్భానుసారంగా ‘హిత్తీయులు’ అని కూడా అనువదించవచ్చు.
- source_word: אֶת אַבְרָהָם
  choice: అబ్రాహాముకు
  rationale: హీబ్రూలో అబ్రాహాము ‘జవాబిచ్చారు’ అనే క్రియకు ప్రత్యక్ష కర్మగా ఉన్నా, తెలుగులో వ్యక్తికి జవాబివ్వడాన్ని సహజంగా చతుర్థీ విభక్తితో వ్యక్తం చేస్తారు.
- source_word: לֵאמֹר
  choice: ఇలా అన్నారు
  rationale: ప్రత్యక్ష ప్రసంగాన్ని పరిచయం చేసే אמר క్రియారూపం. తెలుగులో ‘ఇలా అన్నారు’ తరువాత వచ్చే మాటలకు సహజమైన పరిచయం.
- source_word: לוֹ
  choice: అతనికి (అబ్రాహాముకు అనే రూపంలో అంతర్భావం)
  rationale: ל + మూడవ పురుష ఏకవచన ప్రత్యయం అబ్రాహామునే సంబోధితునిగా మళ్లీ సూచిస్తుంది. తెలుగులో ‘అబ్రాహాముకు’ అని చెప్పిన తరువాత ‘అతనికి’ అని పునరుక్తి చేయడం అసహజం కాబట్టి భావం అదే విభక్తిరూపంలో అంతర్భావంగా నిలుపబడింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. మూలంలోని ‘హేతు కుమారులు’ అనే వంశసూచక ప్రయోగం ప్రధాన పాఠ్యంలో నిలుపబడింది; విస్తృతంగా తెలిసిన జాతిపేరు పాదసూచికలో ఇవ్వబడింది. పాదసూచిక సూచిక సంబంధిత పదబంధం వెంట ఉంచబడింది.
