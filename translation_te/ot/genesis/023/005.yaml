- from: 'హేతు కుమారులు అబ్రాహాముకు జవాబిస్తూ[a] ఇలా అన్నారు:'
  to: 'హేతు కుమారులు[a] అబ్రాహాముకు ఇలా జవాబిచ్చారు:'
  rationale: The revision uses a direct finite verb, “జవాబిచ్చారు,” to render וַיַּעֲנוּ naturally, while “ఇలా” and the colon appropriately introduce the speech signaled by לֵאמֹר לֹו. The footnote marker has been moved to the group name it explains.
