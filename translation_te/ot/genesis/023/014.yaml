  text: And Ephron answered Abraham, saying to him,
translation:
  language: te
  text: 'ఎఫ్రోను అబ్రాహాముకు ఇలా జవాబిచ్చాడు:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן
  choice: జవాబిచ్చాడు
  rationale: సంభాషణాత్మక కథనంలో ענה అనే క్రియ ముందటి మాటకు ప్రతిస్పందనను సూచిస్తుంది. ‘జవాబిచ్చాడు’ ఆధునిక తెలుగులో సహజంగా ఉండి, హీబ్రూ సంభాషణ క్రమాన్ని నిలుపుతుంది.
- source_word: עֶפְרוֹן
  choice: ఎఫ్రోను
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగులో స్థిరపడిన బైబిలు రూపానికి అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: אֶת אַבְרָהָם
  choice: అబ్రాహాముకు
  rationale: אֶת ప్రత్యక్ష కర్మ సూచిక; ఇక్కడ సమాధానం ఎవరిని ఉద్దేశించి చెప్పబడిందో తెలుగులో సహజంగా తెలియజేయడానికి ‘అబ్రాహాముకు’ అని ఇచ్చాం.
- source_word: לֵאמֹר
  choice: ఇలా
  rationale: మాటలను పరిచయం చేసే לֵאמֹר నిర్మాణాన్ని తెలుగులో సహజమైన ప్రత్యక్ష వాక్య ప్రవేశమైన ‘ఇలా’తో వ్యక్తం చేశాం; తరువాతి వచనంలో వచ్చే మాటలకు ద్విబిందువు సంకేతం ఇస్తుంది.
- source_word: לוֹ
  choice: అబ్రాహాముకు అనే రూపంలో అంతర్భూతం
  rationale: לוֹలోని పరోక్ష కర్మ భావాన్ని తెలుగులో ‘అబ్రాహాముకు’ అనే విభక్తి రూపంలో సమగ్రంగా వ్యక్తం చేశాం. విడిగా ‘అతనితో’ అని చేరిస్తే పునరుక్తి, అసహజత కలుగుతాయి.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన కథనశైలి. మూలంలోని సమాధాన క్రియను నిలుపుతూ, ‘లֵאמֹר לוֹ’ నిర్మాణాన్ని తెలుగు వాక్యప్రవాహానికి తగినట్లుగా సంక్షిప్తంగా మలిచాం.
