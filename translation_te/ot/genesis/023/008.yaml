  text: וַ/יְדַבֵּ֥ר אִתָּ֖/ם לֵ/אמֹ֑ר אִם יֵ֣שׁ אֶֽת נַפְשְׁ/כֶ֗ם לִ/קְבֹּ֤ר אֶת מֵתִ/י֙ מִ/לְּ/פָנַ֔/י שְׁמָע֕וּ/נִי וּ/פִגְעוּ לִ֖/י בְּ/עֶפְר֥וֹן בֶּן צֹֽחַר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/008.yaml
  text: And he spoke with them[a], saying, “If it is your desire that I bury my dead out of my sight, listen to me and intercede for me with Ephron son of Zohar,”
translation:
  language: te
  text: 'అతడు వారితో ఇలా అన్నాడు: “నా మరణించిన వ్యక్తిని నా ఎదుటనుండి పాతిపెట్టడానికి మీకు ఇష్టమైతే, నా మాట విని, నా తరఫున సోహరు కుమారుడు ఎఫ్రోనును వేడుకోండి[a],”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నా కోసం సోహరు కుమారుడు ఎఫ్రోనుతో విన్నవించండి.” ఇక్కడి హీబ్రూ పదబంధం ఒకరి తరఫున మరొకరిని కలిసి విజ్ఞప్తి చేయడం లేదా అతనితో మాట్లాడడం అనే భావాన్ని ఇవ్వగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר אִתָּם לֵאמֹר
  choice: అతడు వారితో ఇలా అన్నాడు
  rationale: దבר עם అనే నిర్మాణంలోని ‘వారితో మాట్లాడాడు’ అనే భావాన్ని, ప్రత్యక్ష సంభాషణను పరిచయం చేసే לאמרతో కలిపి సహజమైన ఆధునిక తెలుగు కథన శైలిలో అందిస్తుంది.
- source_word: אִם יֵשׁ אֶת־נַפְשְׁכֶם
  choice: మీరు సమ్మతిస్తే
  rationale: ‘మీ ప్రాణం/మనసు ఉంటే’ అనే హీబ్రూ నుడికారానికి ఇక్కడ కోరిక లేదా అంగీకారం అనే భావం ఉంది; ‘సమ్మతిస్తే’ సందర్భానికి సహజంగా సరిపోతుంది.
- source_word: לִקְבֹּר אֶת־מֵתִי מִלְּפָנַי
  choice: నా మృతురాలిని నా కళ్ల ఎదుటనుంచి పాతిపెట్టేందుకు
  rationale: מֵתִי అక్షరార్థంగా ‘నా మృత వ్యక్తి’; సందర్భంలో సారా ఉద్దేశించబడినందున తెలుగులో సహజమైన స్త్రీలింగ రూపం వాడబడింది. מִלְּפָנַי లోని తన ఎదుటనుంచి తొలగించి సమాధి చేయాలనే భావాన్ని ‘నా కళ్ల ఎదుటనుంచి’ నిలుపుతుంది.
- source_word: שְׁמָעוּנִי
  choice: నా మాట విని
  rationale: ఆజ్ఞార్థక ‘నా మాట వినండి’ అనే భావాన్ని సంభాషణలో సహజంగా కొనసాగిస్తుంది.
- source_word: וּפִגְעוּ לִי בְּעֶפְרוֹן
  choice: నా తరఫున ... ఎఫ్రోనును వేడుకోండి
  rationale: פגע ב నిర్మాణం ఈ చర్చల సందర్భంలో ఒకరి తరఫున మరొకరిని కలిసి అభ్యర్థించడం లేదా విన్నవించడం సూచిస్తుంది; ‘వేడుకోండి’ ఆ విజ్ఞాపన భావాన్ని స్పష్టంగా, అతిశయించకుండా తెలియజేస్తుంది.
- source_word: עֶפְרוֹן בֶּן־צֹחַר
  choice: సోహరు కుమారుడు ఎఫ్రోను
  rationale: వ్యక్తి పేర్లను తెలుగులో లిప్యంతరీకరించి, בןను సహజంగా ‘కుమారుడు’ అని అనువదిస్తుంది.
