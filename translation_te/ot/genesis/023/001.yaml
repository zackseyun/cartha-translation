  text: శారా నూట ఇరవై ఏడు సంవత్సరాలు జీవించింది; ఇవే శారా జీవిత సంవత్సరాలు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ חַיֵּי שָׂרָה
  choice: శారా ... సంవత్సరాలు జీవించింది
  rationale: హీబ్రూ పదబంధానికి అక్షరార్థంగా ‘శారా జీవితం/జీవితకాలం ... సంవత్సరాలు’ అనే భావం ఉన్నా, తెలుగులో వయస్సును సహజంగా, స్పష్టంగా తెలిపేందుకు క్రియారూపంలో అనువదించాం.
- source_word: מֵאָה שָׁנָה וְעֶשְׂרִים שָׁנָה וְשֶׁבַע שָׁנִים
  choice: నూట ఇరవై ఏడు సంవత్సరాలు
  rationale: మూలంలోని 100+20+7 సంఖ్యా నిర్మాణాన్ని ఆధునిక తెలుగు సంఖ్యా వ్యక్తీకరణలో సహజంగా సమగ్రపరిచాం.
- source_word: שְׁנֵי חַיֵּי שָׂרָה
  choice: ఇవే శారా జీవిత సంవత్సరాలు
  rationale: మూలంలో ఉద్దేశపూర్వకంగా పునరుక్తమైన ముగింపు సూత్రాన్ని సంక్షిప్తం చేయకుండా నిలిపాం.
