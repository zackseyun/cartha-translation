translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన వాక్యనిర్మాణం. మూలంలోని వయస్సు ప్రకటనను మరియు చివరి పునరుక్తిని రెండింటినీ నిలిపింది.
