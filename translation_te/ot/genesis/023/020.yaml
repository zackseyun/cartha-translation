  yaml_path: translation/ot/genesis/023/020.yaml
  text: So the field and the cave that was in it were deeded to Abraham as a burial property from the sons of Heth[a][b][c].
translation:
  language: te
  text: ఈ విధంగా ఆ పొలమూ దానిలోని గుహయూ హేతు కుమారుల నుండి అబ్రాహాముకు సమాధి కోసం స్వాస్థ్యంగా బదిలీ చేయబడ్డాయి.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “హిత్తీయుల నుండి.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “అబ్రాహాముకు సమాధి కోసం స్వాస్థ్యంగా స్థిరపడ్డాయి.” “బదిలీ చేయబడ్డాయి” అని అనువదించిన హీబ్రూ క్రియ, ఈ సందర్భంలో ఆస్తి అబ్రాహాము చట్టబద్ధమైన స్వాస్థ్యంగా మారడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: స్థిరపడ్డాయి
  rationale: ఈ న్యాయపరమైన కొనుగోలు సందర్భంలో ఆస్తి అబ్రాహాము హక్కుగా చట్టబద్ధంగా స్థిరపడిన భావాన్ని తెలియజేస్తుంది; పొలం, గుహ అనే సంయుక్త కర్తకు అనుగుణంగా బహువచనం వాడబడింది.
- source_word: הַשָּׂדֶה
  choice: ఆ పొలం
  rationale: కొనుగోలు చేయబడిన నిర్దిష్ట భూభాగాన్ని సహజమైన తెలుగులో సూచిస్తుంది.
- source_word: וְהַמְּעָרָה אֲשֶׁר בּוֹ
  choice: దానిలో ఉన్న గుహ కూడా
  rationale: సంబంధ వాక్యాన్ని నిలుపుతూ, సర్వనామ ప్రత్యయం పొలాన్ని సూచిస్తుందని స్పష్టంగా తెలియజేస్తుంది.
- source_word: לְאַבְרָהָם
  choice: అబ్రాహాముకు
  rationale: న్యాయబద్ధమైన స్వాధీనత పొందిన వ్యక్తిగా అబ్రాహామును సూచిస్తుంది.
- source_word: לַאֲחֻזַּת קָבֶר
  choice: సమాధి స్థలపు స్వాస్థ్యంగా
  rationale: אֲחֻזָּה లోని హక్కుగల ఆస్తి/స్వాధీన భావాన్నీ, קָבֶר లోని సమాధి ప్రయోజనాన్నీ రెండింటినీ నిలుపుతుంది.
- source_word: מֵאֵת
  choice: నుండి
  rationale: లావాదేవీలో ఆస్తి ఏ వర్గం నుండి వచ్చిందో తెలిపే సహజమైన మూలసూచకం.
- source_word: בְּנֵי חֵת
  choice: హేతు కుమారులు
  rationale: హీబ్రూ జాతినామ పదబంధపు రూపాన్ని పారదర్శకంగా నిలుపుతుంది; సందర్భానుసారంగా ‘హిత్తీయులు’ అనీ అనువదించవచ్చు.
