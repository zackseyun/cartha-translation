source:
  edition: WLC
  text: וְ/יִתֶּן לִ֗/י אֶת מְעָרַ֤ת הַ/מַּכְפֵּלָה֙ אֲשֶׁר ל֔/וֹ אֲשֶׁ֖ר בִּ/קְצֵ֣ה שָׂדֵ֑/הוּ בְּ/כֶ֨סֶף מָלֵ֜א יִתְּנֶ֥/נָּה לִ֛/י בְּ/תוֹכְ/כֶ֖ם לַ/אֲחֻזַּת קָֽבֶר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/009.yaml
  text: and let him give me the cave of Machpelah[a], which belongs to him, which is at the end of his field. For the full price in silver[d][c][b], let him give it to me among you as a burial property.
translation:
  language: te
  text: అతనికి చెందిన, అతని పొలం చివరన ఉన్న మక్ఫేలా గుహను అతడు నాకు ఇవ్వనివ్వండి.[a] పూర్తి ధరను వెండిలో చెల్లించి,[b] మీ మధ్య దానిని నాకు సమాధి స్థలం కోసం స్వాస్థ్యంగా ఇవ్వనివ్వండి.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతని పొలం అంచున ఉన్న.” హీబ్రూ పదం పొలం చివరను లేదా అంచును సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “పూర్తి వెండికి”; అంటే పూర్తి ధరను చెల్లించి.
    reason: lexical_alternative
  - marker: c
    text: లేదా, “సమాధి స్వాస్థ్యంగా.” ఇక్కడి హీబ్రూ పదబంధం కేవలం సమాధి చేయడానికి అనుమతిని కాక, చట్టబద్ధమైన స్వాధీన హక్కును నొక్కిచెబుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִתֶּן
  choice: ఇవ్వనివ్వండి
  rationale: విన్నప సందర్భంలోని అసంపూర్ణ క్రియ యొక్క అభ్యర్థన భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: מְעָרַת הַמַּכְפֵּלָה
  choice: మక్ఫేలా గుహ
  rationale: నిర్మాణ సంబంధాన్ని తెలుగులో సహజంగా తెలిపి, స్థలనామాన్ని లిప్యంతరీకరిస్తుంది.
- source_word: אֲשֶׁר לוֹ
  choice: అతనికి చెందిన
  rationale: యాజమాన్య భావాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: אֲשֶׁר בִּקְצֵה שָׂדֵהוּ
  choice: అతని పొలం చివరన ఉన్న
  rationale: קצה లోని చివర/అంచు అనే స్థలార్థాన్ని అతిగా నిర్దిష్టం చేయకుండా అందిస్తుంది; ప్రత్యామ్నాయం పాదటిప్పణిలో ఉంది.
- source_word: בְּכֶסֶף מָלֵא
  choice: దాని పూర్తి వెలను వెండిగా తీసుకొని
  rationale: అక్షరార్థమైన ‘పూర్తి వెండికి’ అనే హీబ్రూ నుడికారాన్ని, తగ్గింపు లేని పూర్తి ధర చెల్లింపుగా సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: יִתְּנֶנָּה
  choice: అది నాకు ... ఇవ్వనివ్వండి
  rationale: కొనుగోలు సందర్భం ఉన్నప్పటికీ మూలంలోని נתן ‘ఇవ్వు’ అనే క్రియను నిలుపుతుంది.
- source_word: בְּתוֹכְכֶם
  choice: మీ మధ్య
  rationale: హిత్తీయుల సమాజం సమక్షంలో, వారి గుర్తింపుతో జరిగే లావాదేవీ భావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: לַאֲחֻזַּת קָבֶר
  choice: సమాధి స్థలంగా శాశ్వత స్వాస్థ్యం
  rationale: אֲחֻזָּה సూచించే చట్టబద్ధమైన, స్థిరమైన స్వాధీన హక్కును తెలుగులో స్పష్టపరుస్తుంది; కేవలం వినియోగ హక్కుగా తగ్గించదు.
