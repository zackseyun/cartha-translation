translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన బహువచన అభ్యర్థన రూపం. ఆస్తి బదిలీకి సంబంధించిన చట్టపరమైన భావాన్ని సాధారణ పాఠకుడికి అర్థమయ్యేలా ఉంచుతూ, మూలంలోని ‘ఇవ్వు’ క్రియను మరియు ‘చివర/అంచు’ సందిగ్ధతను సంరక్షించింది.
