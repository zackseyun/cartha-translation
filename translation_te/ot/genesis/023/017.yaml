revisions:
- from: అలా మమ్రేకు ఎదురుగా ఉన్న మక్ఫేలాలోని ఎఫ్రోను పొలం—ఆ పొలం, దానిలోని గుహ, పొలం చుట్టూ ఉన్న దాని సరిహద్దులన్నిటి లోపల ఉన్న ప్రతి చెట్టు—సొత్తుగా స్థిరపరచబడింది.[a]
  to: అలా మమ్రేకు ఎదురుగా ఉన్న మక్ఫేలాలోని ఎఫ్రోను పొలం—ఆ పొలం, దానిలో ఉన్న గుహ, దాని చుట్టూ ఉన్న మొత్తం హద్దుల లోపలనున్న పొలంలోని ప్రతి చెట్టు—సొత్తుగా ఖరారైంది.[a]
  rationale: The revision improves the natural Telugu syntax of the boundary-and-trees clause and uses a more idiomatic legal expression for the Hebrew property-confirmation idiom. It preserves the formal enumeration, the spatial ambiguity of “before Mamre,” and the lexical uncertainty of וַיָּקָם in the footnote.
