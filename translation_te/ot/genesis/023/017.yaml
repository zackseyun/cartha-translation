base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/017.yaml
  text: So Ephron’s field at Machpelah[a], which was before Mamre—the field, the cave that was in it, and every tree in the field, within all its surrounding border—was confirmed
translation:
  language: te
  text: అలా మమ్రేకు ఎదురుగా ఉన్న మక్ఫేలాలోని ఎఫ్రోను పొలం—ఆ పొలం, దానిలో ఉన్న గుహ, దాని చుట్టూ ఉన్న మొత్తం హద్దుల లోపలనున్న పొలంలోని ప్రతి చెట్టు—సొత్తుగా ఖరారైంది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నిలిచింది,” “స్థిరపడింది,” లేదా “బదిలీ అయింది.” కొనుగోలు సందర్భంలో ఇక్కడి హీబ్రూ క్రియ ఆస్తి హక్కు చట్టబద్ధంగా ఖరారవడాన్ని లేదా బదిలీ కావడాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: సొత్తుగా స్థిరపరచబడింది
  rationale: קום అనే క్రియకు ప్రాథమికంగా ‘నిలిచింది’ అనే అర్థం ఉన్నా, ఈ కొనుగోలు సందర్భంలో ఆస్తి చట్టబద్ధంగా ఖరారైన భావం ఉంది. ‘సొత్తుగా స్థిరపరచబడింది’ ఆ న్యాయపరమైన భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; క్రియలోని సాధ్యమైన అర్థభేదాలను పాదటిప్పణిలో ఉంచాం.
- source_word: שְׂדֵה עֶפְרוֹן
  choice: ఎఫ్రోను పొలం
  rationale: హీబ్రూ సమాసంలోని స్వామ్యసంబంధాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: בַּמַּכְפֵּלָה
  choice: మక్ఫేలాలోని
  rationale: మక్ఫేలా స్థలనామాన్ని లిప్యంతరీకరించి, పొలం అక్కడ ఉందనే స్థానార్థాన్ని చూపుతుంది.
- source_word: לִפְנֵי מַמְרֵא
  choice: మమ్రేకు ఎదురుగా ఉన్న
  rationale: לִפְנֵי యొక్క ‘ముందు/ఎదురుగా’ అనే ప్రాదేశిక భావాన్ని దిశను అతిగా నిర్ధారించకుండా కాపాడుతుంది.
- source_word: הַשָּׂדֶה וְהַמְּעָרָה אֲשֶׁר בּוֹ
  choice: ఆ పొలం, దానిలోని గుహ
  rationale: ఆస్తిలోని భాగాలను జాబితా చేసే మూలంలోని న్యాయపరమైన శైలిని, పొలాన్ని మళ్లీ పేర్కొనడం ద్వారా నిలుపుతుంది.
- source_word: וְכָל הָעֵץ אֲשֶׁר בַּשָּׂדֶה
  choice: పొలంలో ఉన్న ప్రతి చెట్టు
  rationale: כָל తో వచ్చిన ఏకవచన సమూహనామాన్ని పంపిణీ భావంతో ‘ప్రతి చెట్టు’గా అనువదించడం ఆస్తిలోని చెట్లన్నీ చేర్చబడ్డాయని స్పష్టం చేస్తుంది.
- source_word: אֲשֶׁר בְּכָל גְּבֻלוֹ סָבִיב
  choice: పొలం చుట్టూ ఉన్న దాని సరిహద్దులన్నిటి లోపల ఉన్న
  rationale: ఆస్తి మొత్తం పరిధిలోని చెట్లను సూచించే సమగ్ర న్యాయవివరణను కాపాడుతుంది.
