revisions:
- from: 'అతడు ఆ దేశ ప్రజలు వింటుండగా ఎఫ్రోనుతో ఇలా అన్నాడు: “కాదు, దయచేసి నా మాట విను[a]. పొలానికి చెల్లించాల్సిన వెండిని నేను ఇస్తున్నాను[b]; దాన్ని నా దగ్గర తీసుకో. అప్పుడు నా మృతురాలిని అక్కడ పాతిపెడతాను.”'
  to: 'అతడు ఆ దేశ ప్రజలు వింటుండగా ఎఫ్రోనుతో ఇలా అన్నాడు: “అయితే, దయచేసి నా మాట విను[a]. పొలం కోసం వెండిని నేను ఇస్తున్నాను[b]; దాన్ని నా నుండి తీసుకో, అక్కడ నా మరణించినవారిని పాతిపెట్టడానికి.”'
  rationale: The revision removes interpretive additions, restores the directional force of “from me,” and represents the final cohortative as Abraham’s intended purpose. It retains the performative-present rendering of the Hebrew perfect, while the footnote preserves the formally completed and future alternatives.
