id: GEN.23.13
reference: Genesis 23:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְדַבֵּ֨ר אֶל עֶפְר֜וֹן בְּ/אָזְנֵ֤י עַם הָ/אָ֨רֶץ֙ לֵ/אמֹ֔ר אַ֛ךְ אִם אַתָּ֥ה ל֖וּ שְׁמָעֵ֑/נִי נָתַ֜תִּי כֶּ֤סֶף הַ/שָּׂדֶה֙ קַ֣ח מִמֶּ֔/נִּי וְ/אֶקְבְּרָ֥ה אֶת מֵתִ֖/י שָֽׁמָּ/ה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/013.yaml
  text: 'And he spoke to Ephron in the hearing of the people of the land[a], saying, “If only you would hear me: I give the silver for the field; take it from me[b], so that I may bury my dead there.”'
translation:
  language: te
  text: 'అతడు ఆ దేశ ప్రజలు వింటుండగా ఎఫ్రోనుతో ఇలా అన్నాడు: “అయితే, దయచేసి నా మాట విను[a]. పొలం కోసం వెండిని నేను ఇస్తున్నాను[b]; దాన్ని నా నుండి తీసుకో, అక్కడ నా మరణించినవారిని పాతిపెట్టడానికి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీవు నా మాట వింటే బాగుండు.” హీబ్రూ పదబంధం విజ్ఞాపనగా, కొంత సంక్షిప్తంగా ఉంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా “పొలం వెండిని నేను ఇచ్చాను.” ఇక్కడ పూర్తయిన క్రియారూపం బేరసారంలో అధికారికంగా చేస్తున్న ప్రతిపాదనను సూచించవచ్చు; “నేను ఇస్తాను” అని కూడా అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: అతడు ... అన్నాడు
  rationale: దీనిలోని అధికారిక సంభాషణ భావాన్ని సందర్భం తెలియజేస్తుంది; తెలుగులో ప్రత్యక్ష మాటను పరిచయం చేయడానికి ‘అన్నాడు’ సహజంగా ఉంటుంది.
- source_word: בְּאָזְנֵי עַם הָאָרֶץ
  choice: ఆ దేశ ప్రజలు వింటుండగా
  rationale: ‘ప్రజల చెవుల్లో’ అనే అక్షరార్థం కంటే, ప్రజల సమక్షంలో బహిరంగంగా వినిపించేలా మాట్లాడాడనే హీబ్రూ నుడికార భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אַךְ אִם אַתָּה לוּ שְׁמָעֵנִי
  choice: కాదు, దయచేసి నా మాట విను
  rationale: אַךְ ఇక్కడ ముందున్న ప్రతిపాదనను మర్యాదగా తిరస్కరించే ‘కాదు’ అనే భావాన్ని, לוּ విజ్ఞాపనను, שׁמע శ్రద్ధగా వినాలనే భావాన్ని కలిపి వ్యక్తం చేస్తుంది. మూలంలోని సంక్షిప్తమైన, కొంత అస్పష్టమైన నిర్మాణాన్ని పాదసూచికలో సూచించాం.
- source_word: נָתַתִּי כֶּסֶף הַשָּׂדֶה
  choice: పొలానికి చెల్లించాల్సిన వెండిని నేను ఇస్తున్నాను
  rationale: כֶּסֶף యొక్క స్పష్టమైన ‘వెండి’ భావాన్ని నిలుపుతూ, సంబంధాన్ని తెలుగులో సహజంగా చెప్పింది. నָתַתִּי రూపం పూర్తయిన క్రియ అయినప్పటికీ, ఈ బేరసార సందర్భంలో అధికారికంగా ప్రస్తుతం చేస్తున్న ప్రతిపాదనగా అర్థమవుతుంది.
- source_word: קַח מִמֶּנִּי
  choice: దాన్ని నా దగ్గర తీసుకో
  rationale: కర్మ మూలంలో అంతర్లీనంగా ఉంది; ముందున్న వెండిని సూచించేందుకు ‘దాన్ని’ చేర్చడం తెలుగులో స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: וְאֶקְבְּרָה
  choice: అప్పుడు ... పాతిపెడతాను
  rationale: హీబ్రూ cohortative ఈ లావాదేవీ నెరవేరిన తరువాత అబ్రాహాము చేయదలచిన పనిని సూచిస్తుంది; ‘అప్పుడు’ ఉద్దేశించిన ఫలితాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: מֵתִי
  choice: నా మృతురాలిని
  rationale: మూలంలోని ‘నా మృత వ్యక్తి’ అనే సంక్షిప్త నుడికారాన్ని నిలుపుతుంది; సందర్భంలో సారా స్త్రీ కావడంతో తెలుగులో స్త్రీలింగ రూపం సహజం. ‘నా భార్య’ అని ప్రధాన పాఠంలో చేర్చి మూలాన్ని విస్తరించలేదు.
- source_word: שָׁמָּה
  choice: అక్కడ
  rationale: స్థలాన్ని సూచించే సాధారణ క్రియావిశేషణానికి సహజమైన తెలుగు సమానం.
theological_decisions:
- issue: נָתַתִּי అనే perfect క్రియారూపం యొక్క కాలం/ప్రయోగం
  choice: నేను ఇస్తున్నాను
  alternative: నేను ఇచ్చాను; నేను ఇస్తాను
  rationale: బేరసారంలో పలికిన ఈ మాటను పూర్తయిన చెల్లింపుగా కాక, అధికారికంగా చేస్తున్న ప్రతిపాదనగా ప్రధాన పాఠం చూపుతుంది. అయితే హీబ్రూ రూపంలోని పూర్తి క్రియా భావాన్ని పాదసూచికలో నిలిపి, ఇతర సాధ్యమైన కాలార్థాలను మూసివేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. న్యాయపరమైన బహిరంగ బేరసార సందర్భం స్పష్టంగా ఉండేలా వాక్యాన్ని సహజీకరించాం; అయినా ‘వెండి,’ ‘నా మృతురాలు’ వంటి మూలపాఠంలోని ముఖ్యమైన స్పష్ట పదచిత్రాలను నిలిపాం.
