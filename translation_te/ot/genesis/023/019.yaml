- from: దీని తరువాత అబ్రాహాము తన భార్య శారాను కనాను దేశంలో, మమ్రేకు (అంటే హెబ్రోనుకు) ఎదురుగా[a] ఉన్న మక్పేలా పొలపు గుహలో పాతిపెట్టాడు.
  to: దీని తరువాత అబ్రాహాము తన భార్య శారాను కనాను దేశంలో మమ్రే, అంటే హెబ్రోను, ఎదురుగా ఉన్న మక్పేలా పొలపు గుహలో పాతిపెట్టాడు.
