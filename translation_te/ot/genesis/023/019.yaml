id: GEN.23.19
reference: Genesis 23:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אַחֲרֵי כֵן֩ קָבַ֨ר אַבְרָהָ֜ם אֶת שָׂרָ֣ה אִשְׁתּ֗/וֹ אֶל מְעָרַ֞ת שְׂדֵ֧ה הַ/מַּכְפֵּלָ֛ה עַל פְּנֵ֥י מַמְרֵ֖א הִ֣וא חֶבְר֑וֹן בְּ/אֶ֖רֶץ כְּנָֽעַן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/019.yaml
  text: After this[a], Abraham buried Sarah his wife in the cave of the field of Machpelah, facing Mamre (that is, Hebron), in the land of Canaan.
translation:
  language: te
  text: దీని తరువాత అబ్రాహాము తన భార్య శారాను కనాను దేశంలో మమ్రే, అంటే హెబ్రోను, ఎదురుగా ఉన్న మక్పేలా పొలపు గుహలో పాతిపెట్టాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאַחֲרֵי כֵן
  choice: దీని తరువాత
  rationale: ఇది కథన క్రమాన్ని సూచించే సాధారణ కాలసంబంధ సంధి; హెబ్రీలో లేని అదనపు నిర్దిష్టతను చేర్చకుండా సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: קָבַר
  choice: పాతిపెట్టాడు
  rationale: క్రియకు ఇక్కడ స్పష్టమైన అర్థం ‘సమాధి చేయడం/పాతిపెట్టడం.’ సాధారణ పాఠకులకు సహజంగా అర్థమయ్యే పదాన్ని ఎంచుకున్నాం.
- source_word: אֶת שָׂרָה אִשְׁתּוֹ
  choice: తన భార్య శారాను
  rationale: హెబ్రీలో ‘శారా, అతని భార్య’ అనే క్రమం ఉన్నా, తెలుగులో ఈ క్రమం సహజంగా ఉండి సంబంధాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: אֶל מְעָרַת
  choice: గుహలో
  rationale: אֶל అక్షరార్థంగా ‘వైపు/లోనికి’ అయినప్పటికీ, పాతిపెట్టే క్రియతో తెలుగులో స్థలాన్ని ‘గుహలో’ అని చెప్పడం సహజం.
- source_word: מְעָרַת שְׂדֵה הַמַּכְפֵּלָה
  choice: మక్పేలా పొలపు గుహ
  rationale: హెబ్రీ సమాస శ్రేణిలో గుహకు, పొలానికి ఉన్న సంబంధాన్ని సంక్షిప్తంగా, సహజంగా నిలుపుతుంది.
- source_word: הַמַּכְפֵּלָה
  choice: మక్పేలా
  rationale: స్థలనామాన్ని తెలుగులో ధ్వన్యనుకరణగా ఇచ్చాం; హెబ్రీ నిర్దిష్ట ఉపపదాన్ని స్థలనామంలో విడిగా అనువదించలేదు.
- source_word: עַל פְּנֵי מַמְרֵא
  choice: మమ్రేకు ఎదురుగా
  rationale: ఈ పదబంధం మమ్రే ముందున్న లేదా దానికి అభిముఖంగా/ఎదురుగా ఉన్న ప్రదేశాన్ని సూచిస్తుంది; నిర్ధారించలేని దిక్కును చేర్చలేదు.
- source_word: הִוא חֶבְרוֹן
  choice: అంటే హెబ్రోనుకు
  rationale: మమ్రేను హెబ్రోనుతో గుర్తించే వివరణను తెలుగులో సహజమైన కుండలీకరణగా ఇచ్చాం; విభక్తి వాక్య నిర్మాణానికి అనుగుణంగా పెట్టాం.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: కనాను దేశంలో
  rationale: హెబ్రీలోని ‘కనాను దేశంలో’ అనే పూర్తి భౌగోళిక వ్యక్తీకరణను నిలిపాం.
