translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలిని వాడాం. స్థలనామాలను సాధారణ తెలుగు బైబిలు ధ్వనిరూపాలకు దగ్గరగా ఉంచుతూ, వాక్యాన్ని సాధారణ పాఠకులకు సహజంగా నిర్మించాం.
