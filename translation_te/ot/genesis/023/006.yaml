  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: שְׁמָעֵ֣/נוּ אֲדֹנִ֗/י נְשִׂ֨יא אֱלֹהִ֤ים אַתָּה֙ בְּ/תוֹכֵ֔/נוּ בְּ/מִבְחַ֣ר קְבָרֵ֔י/נוּ קְבֹ֖ר אֶת מֵתֶ֑/ךָ אִ֣ישׁ מִמֶּ֔/נּוּ אֶת קִבְר֛/וֹ לֹֽא יִכְלֶ֥ה מִמְּ/ךָ֖ מִ/קְּבֹ֥ר מֵתֶֽ/ךָ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/006.yaml
  text: 'Hear us[a], my lord: you are a prince of God among us. Bury your dead in the choicest of our tombs. None of us will withhold his tomb from you[b], from burying your dead.'
translation:
  language: te
  text: “మా మాట వినండి, ప్రభువా. మీరు మా మధ్య దేవుని అధిపతిగా ఉన్నారు[a]. మా సమాధుల్లో శ్రేష్ఠమైన దానిలో మీ మృతురాలిని పాతిపెట్టండి. మీ మృతురాలిని పాతిపెట్టకుండా తన సమాధిని మీకు ఇవ్వకుండా మిమ్మల్ని అడ్డుకునేవాడు మాలో ఎవ్వరూ ఉండరు.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మా మధ్య అత్యంత గొప్ప అధిపతి.” “దేవుని అధిపతి” అనే హీబ్రూ పదబంధం అత్యున్నత స్థాయిని సూచించే నుడికారంగా కూడా ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמָעֵנוּ
  choice: మా మాట వినండి
  rationale: שׁמע ఆజ్ఞారూపానికి సహజమైన ఆధునిక తెలుగు రూపం; ఏకవచన హీబ్రూ సంబోధనను గౌరవార్థక బహువచన క్రియతో వ్యక్తం చేస్తుంది.
- source_word: אֲדֹנִי
  choice: ప్రభువా
  rationale: అబ్రాహామును గౌరవంగా సంబోధించే పదం. ‘అయ్యా’ కంటే మూలంలోని సామాజిక మర్యాదను, గంభీరతను బలంగా నిలుపుతుంది; ఇక్కడ ఇది దైవనామం కాదు.
- source_word: נְשִׂיא אֱלֹהִים
  choice: దేవుని అధిపతి
  rationale: ‘దేవుని అధిపతి/నాయకుడు’ అనే నిర్మాణాన్ని ప్రధాన పాఠంలో నిలిపి, అది దేవునితో సంబంధాన్ని సూచిస్తుందా లేక అత్యున్నత స్థాయిని తెలిపే నుడికారమా అన్న నిజమైన సందిగ్ధతను పాదసూచికలో కాపాడుతుంది.
- source_word: בְּתוֹכֵנוּ
  choice: మా మధ్య
  rationale: సమాజం మధ్య అబ్రాహాముకు ఉన్న స్థానాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: בְּמִבְחַר קְבָרֵינוּ
  choice: మా సమాధుల్లో శ్రేష్ఠమైన దానిలో
  rationale: מִבְחָר యొక్క ‘ఎంచదగినది/అత్యుత్తమమైనది’ అనే భావాన్ని, సమాధి స్థలాల సందర్భాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: קְבֹר אֶת־מֵתֶךָ
  choice: మీ మృతురాలిని పాతిపెట్టండి
  rationale: ప్రత్యక్ష ఆజ్ఞను నిలుపుతుంది. హీబ్రూ పదం స్వయంగా ‘మీ మృత వ్యక్తి’ అని ఉన్నప్పటికీ, సందర్భంలోని సారా స్త్రీ కావడంతో తెలుగులో సహజమైన స్త్రీలింగ రూపం వాడబడింది.
- source_word: אִישׁ מִמֶּנּוּ
  choice: మాలో ఎవ్వరూ
  rationale: నిషేధ వాక్యంలో పంపిణీ భావమున్న ‘మాలో ఒక్క వ్యక్తి కూడా కాదు’ అనే అర్థాన్ని సహజంగా అందిస్తుంది.
- source_word: אֶת־קִבְרוֹ לֹא יִכְלֶה מִמְּךָ
  choice: తన సమాధిని మీకు ఇవ్వడానికి ... ఎవ్వరూ నిరాకరించరు
  rationale: כלה యొక్క ఇక్కడి ‘వెనక్కి ఉంచడం/నిరాకరించడం’ భావాన్ని స్పష్టంగా వ్యక్తం చేస్తూ, ప్రతి వ్యక్తికి చెందిన సమాధి అనే ఏకవచన పంపిణీ భావాన్ని ‘తన’తో నిలుపుతుంది.
- source_word: מִקְּבֹר מֵתֶךָ
  choice: మీ మృతురాలిని పాతిపెట్టడానికి
  rationale: 'מן + క్రియానామ నిర్మాణంలోని నిరోధ భావాన్ని తెలుగులో ఉద్దేశార్థక నిర్మాణంగా సహజంగా వ్యక్తం చేస్తుంది: సమాధి ఇవ్వడానికి ఎవరూ నిరాకరించరు, కాబట్టి పాతిపెట్టడాన్ని అడ్డుకోరు.'
theological_decisions:
- issue: נְשִׂיא אֱלֹהִים దేవునితో ప్రత్యేక సంబంధాన్ని సూచిస్తుందా, లేక ‘అత్యంత గొప్ప అధిపతి’ అనే హీబ్రూ అతిశయోక్తి నుడికారమా
  choice: ప్రధాన పాఠంలో ‘దేవుని అధిపతి’ అని మూల నిర్మాణాన్ని నిలిపి, నుడికారార్థాన్ని పాదసూచికలో ఇవ్వడం
  alternative: ‘మా మధ్య అత్యంత గొప్ప అధిపతి’
  rationale: దైవసంబంధ భావాన్ని పూర్తిగా తొలగించకుండా, అదే సమయంలో אֱלֹהִים అతిశయోక్తి బలాన్ని ఇవ్వగలదనే భాషాత్మక అవకాశాన్ని కూడా పాఠకునికి తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవార్థక సంబోధన, గంభీరమైన అంత్యక్రియల పదజాలం వాడబడ్డాయి. ‘ప్రభువా’ ఇక్కడ మానవునికి ఇచ్చే మర్యాదపూర్వక సంబోధన. పునరుక్తి మూలపాఠంలోని ‘మీ మృతురాలు’ అనే రెండుసార్ల ప్రస్తావనను ఉద్దేశపూర్వకంగా నిలుపుతుంది.
