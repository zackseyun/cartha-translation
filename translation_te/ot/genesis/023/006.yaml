review_pass:
  verdict: revise
  source_fidelity: The principal sense is conveyed, including the respectful address, the quality of the burial sites, and the collective assurance. However, the final Telugu clause is syntactically awkward and can sound as though the refusal concerns giving a tomb for burial, rather than the Hebrew's assurance that no one will deny his tomb so as to prevent the burial. The source's prevention force should be made explicit.
  naturalness: The opening and middle sentence are natural in a formal modern Telugu register. The wording “తన సమాధిని మీకు ఇవ్వడానికి మాలో ఎవ్వరూ నిరాకరించరు” is unnecessarily convoluted because “ఇవ్వడానికి ... నిరాకరించరు” combines two competing verbal frames. Recasting it with “ఇవ్వకుండా ... అడ్డుకోరు” is clearer and idiomatic.
  terminology: “ప్రభువా” appropriately renders a deferential human address in this context. “దేవుని అధిపతి” preserves the source-oriented construction, while the footnote responsibly supplies the idiomatic-superlative possibility. “మృతురాలిని” is contextually appropriate for Sarah, though the Hebrew expression itself is grammatically masculine/generic; no doctrinal issue is involved.
  issues:
  - severity: medium
    issue: The final clause does not clearly express the Hebrew prevention construction (מִן + infinitive).
    rationale: The Hebrew means that no member of the group will withhold his burial place in a way that prevents Abraham from burying his dead. The draft's double infinitive, “ఇవ్వడానికి ... నిరాకరించరు,” is awkward and leaves this relation less clear.
