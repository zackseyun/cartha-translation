  text: అబ్రాహాముకు స్వాస్థ్యంగా బదిలీ చేయబడింది—హేతు కుమారుల[a] కళ్ల ఎదుట, అతని పట్టణ ద్వారం గుండా వచ్చేవారందరి ఎదుట.
