lexical_decisions:
- source_word: לְאַבְרָהָם
  choice: అబ్రాహాముకు
  rationale: లְ ఉపసర్గం ఈ న్యాయపరమైన బదిలీలో స్వీకర్తను సూచిస్తుంది; తెలుగులో చతుర్థీ విభక్తి సహజంగా దానిని వ్యక్తం చేస్తుంది.
- source_word: לְמִקְנָה
  choice: సొత్తుగా
  rationale: מִקְנָה కొనుగోలు ద్వారా పొందిన ఆస్తి లేదా స్వాధీన సొత్తును సూచిస్తుంది; సందర్భంలో లావాదేవీ ఫలితాన్ని సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: לְעֵינֵי
  choice: కళ్ల ఎదుట
  rationale: ప్రజల దృష్టిలో, సాక్షుల సమక్షంలో జరిగిన న్యాయబద్ధమైన బదిలీని సూచించే హీబ్రూ దృశ్యరూపాన్ని నిలుపుతుంది.
- source_word: בְנֵי חֵת
  choice: హేతు కుమారులు
  rationale: మూలంలోని కుటుంబ-జాతి సూచనను యథాతథంగా ఉంచుతుంది; సందర్భానుసారమైన ‘హిత్తీయులు’ అనే ప్రత్యామ్నాయం పాదసూచికలో ఇవ్వబడింది.
- source_word: בְּכֹל בָּאֵי
  choice: ప్రవేశించే వారందరి ఎదుట
  rationale: పార్టిసిపిల్‌కు సాధారణ లేదా పునరావృత భావం ఉండగలదు; ‘ప్రవేశించే’ దానిని అనవసరంగా కేవలం గతకాల ఘటనగా పరిమితం చేయదు.
- source_word: שַׁעַר עִירוֹ
  choice: అతని పట్టణ ద్వారం
  rationale: మూలంలోని నిర్మాణాన్ని, అలాగే ప్రజా మరియు న్యాయ వ్యవహారాల స్థలమైన పట్టణ ద్వారపు నేపథ్యాన్ని నిలుపుతుంది.
