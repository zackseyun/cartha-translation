translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు స్పష్టమైన శైలి వాడబడింది. ‘పరదేశిని, తాత్కాలిక నివాసిని’ అనే జంట మూలంలోని సామాజిక-న్యాయపరమైన ఉద్వేగాన్ని నిలుపుతుంది; ‘స్వాస్థ్యంగా’ అనే పదం ఈ అధ్యాయంలో కీలకమైన భూహక్కు భావాన్ని కాపాడుతుంది.
