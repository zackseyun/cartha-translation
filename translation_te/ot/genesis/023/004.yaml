    text: అక్షరార్థంగా, ‘సమాధి కోసం ఒక స్వాస్థ్యం’; ఇది కేవలం సమాధి చేసే చోటును కాక, హక్కుగా కలిగే భూస్వాస్థ్యాన్ని కూడా సూచిస్తుంది.
    reason: lexical_alternative
