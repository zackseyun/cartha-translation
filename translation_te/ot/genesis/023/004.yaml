review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys Abraham’s outsider status, his request for a burial holding, and the purpose of burial. However, “నా మృతురాలిని” specifies a female referent although מֵתִי itself is not feminine; Sarah is clear from the narrative context, but the verse’s wording should not add that specification. “తాత్కాలిక” can also overstate the temporal aspect of תּוֹשָׁב, whose emphasis is resident status without full native/landed standing.
  naturalness: The Telugu is generally clear and modern. “సమాధి స్థలాన్ని నాకు స్వాస్థ్యంగా” is understandable but somewhat syntactically awkward. “సమాధి కోసం ఒక భూస్వాస్థ్యం” expresses the legal-property sense more naturally. “పరాయి నివాసిని” is a smoother paired expression for the social status in this context.
  terminology: “పరదేశి” and “భూస్వాస్థ్యం” appropriately convey the key social and property terminology. The revised rendering retains the Hebrew’s singular but avoids imposing the referent’s gender. Footnote anchors are retained and correctly attached.
  issues:
  - severity: medium
    issue: “నా మృతురాలిని” adds feminine gender.
    rationale: Although the deceased is Sarah in the immediate context, מֵתִי is not a feminine form in this verse. A translation should preserve the source expression’s lack of explicit feminine marking.
  - severity: low
    issue: “తాత్కాలిక నివాసిని” makes residence explicitly temporary.
    rationale: תוֹשָׁב denotes a resident/sojourner without full native or property status; transience may be implicit in some contexts but should not be made more definite than the source.
  - severity: low
    issue: The burial-holding phrase is slightly awkward in Telugu.
    rationale: Recasting it as a burial-purpose landholding is more idiomatic while retaining אֲחֻזָּה’s property-right nuance.
  revised_text: నేను మీ మధ్య పరదేశిని, పరాయి నివాసిని. నా మరణించిన వ్యక్తిని నా ఎదుటనుండి[b] పాతిపెట్టడానికి, మీ మధ్య సమాధి కోసం ఒక భూస్వాస్థ్యాన్ని నాకు ఇవ్వండి[a].
  revised_footnotes:
