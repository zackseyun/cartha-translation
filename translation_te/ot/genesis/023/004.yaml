  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: גֵּר וְ/תוֹשָׁ֥ב אָנֹכִ֖י עִמָּ/כֶ֑ם תְּנ֨וּ לִ֤/י אֲחֻזַּת קֶ֨בֶר֙ עִמָּ/כֶ֔ם וְ/אֶקְבְּרָ֥ה מֵתִ֖/י מִ/לְּ/פָנָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/004.yaml
  text: I am a foreigner and a sojourner among you[a]. Give me a burial site among you[b], so that I may bury my dead out of my sight.
translation:
  language: te
  text: నేను మీ మధ్య పరదేశిని, పరాయి నివాసిని. నా మరణించిన వ్యక్తిని నా ఎదుటనుండి[b] పాతిపెట్టడానికి, మీ మధ్య సమాధి కోసం ఒక భూస్వాస్థ్యాన్ని నాకు ఇవ్వండి[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘సమాధి కోసం ఒక స్వాస్థ్యం’; ఇది కేవలం సమాధి చేసే చోటును కాక, హక్కుగా కలిగే భూస్వాస్థ్యాన్ని కూడా సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘నా ఎదుటనుండి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: גֵּר
  choice: పరదేశిని
  rationale: తన స్వజనుల భూమికి వెలుపల, స్థానికులకు ఉండే పూర్తి భూహక్కులు లేకుండా నివసించే వ్యక్తి అనే సామాజిక భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וְתוֹשָׁב
  choice: తాత్కాలిక నివాసిని
  rationale: స్థానిక స్వాస్థ్య హక్కులు లేని నివాసి అనే భావాన్ని గֵּר‌తో కలిపి స్పష్టం చేస్తుంది; కేవలం ‘నివాసి’ కంటే తాత్కాలిక స్థితిని మెరుగ్గా తెలియజేస్తుంది.
- source_word: עִמָּכֶם
  choice: మీ మధ్య
  rationale: అక్షరార్థమైన ‘మీతో’ కంటే, ఆ సమాజంలో నివసిస్తున్న స్థితిని ఈ సందర్భంలో సహజంగా తెలియజేస్తుంది; వచనంలోని రెండు సందర్భాల్లోనూ సరిపోతుంది.
- source_word: תְּנוּ לִי
  choice: నాకు ... ఇవ్వండి
  rationale: נתן ఆజ్ఞారూపంలోని సూటి అభ్యర్థనను సహజంగా నిలుపుతుంది.
- source_word: אֲחֻזַּת קֶבֶר
  choice: ఒక సమాధి స్థలాన్ని నాకు స్వాస్థ్యంగా
  rationale: కేవలం సమాధి తవ్వే చోటు మాత్రమే కాక, హక్కుగా కలిగే భూస్వాస్థ్యం అనే אֲחֻזָּה న్యాయపరమైన భావాన్ని కూడా నిలుపుతుంది.
- source_word: וְאֶקְבְּרָה
  choice: పాతిపెట్టడానికి
  rationale: అభ్యర్థన తరువాతి cohortative తెలిపే ఉద్దేశాన్ని తెలుగులో సహజమైన ప్రయోజనార్థక రూపంతో వ్యక్తం చేస్తుంది.
- source_word: מֵתִי
  choice: నా మృతురాలిని
  rationale: హీబ్రూ పదబంధం మరణించిన తన కుటుంబ సభ్యురాలిని సూచిస్తుంది; సందర్భంలో సారా కావడంతో స్త్రీలింగ రూపం సహజంగా ఉంటుంది, అయితే పేరును పాఠ్యంలో చేర్చలేదు.
- source_word: מִלְּפָנַי
  choice: నా కళ్ల ఎదుటనుండి
  rationale: ‘నా ఎదుటనుండి’ అనే మూల చిత్రణను నిలుపుతూ, తెలుగులో మరణించిన వ్యక్తిని తన దృష్టికి దూరంగా పాతిపెట్టే భావాన్ని సహజంగా తెలియజేస్తుంది.
