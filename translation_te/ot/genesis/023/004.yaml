revisions:
- from: నేను మీ మధ్య పరదేశిని, తాత్కాలిక నివాసిని. నా మృతురాలిని నా కళ్ల ఎదుటనుండి[b] పాతిపెట్టడానికి, మీ మధ్య ఒక సమాధి స్థలాన్ని నాకు స్వాస్థ్యంగా[a] ఇవ్వండి.
  to: నేను మీ మధ్య పరదేశిని, పరాయి నివాసిని. నా మరణించిన వ్యక్తిని నా ఎదుటనుండి[b] పాతిపెట్టడానికి, మీ మధ్య సమాధి కోసం ఒక భూస్వాస్థ్యాన్ని నాకు ఇవ్వండి[a].
  rationale: The revision removes the feminine specification not expressed by the Hebrew, avoids making the resident status unambiguously temporary, and improves the Telugu expression for a legally held burial property. It retains the source order and purpose relation, the singular deceased-person expression, and both footnote anchors.
