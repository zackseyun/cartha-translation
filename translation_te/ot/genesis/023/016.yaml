  edition: WLC
  text: וַ/יִּשְׁמַ֣ע אַבְרָהָם֮ אֶל עֶפְרוֹן֒ וַ/יִּשְׁקֹ֤ל אַבְרָהָם֙ לְ/עֶפְרֹ֔ן אֶת הַ/כֶּ֕סֶף אֲשֶׁ֥ר דִּבֶּ֖ר בְּ/אָזְנֵ֣י בְנֵי חֵ֑ת אַרְבַּ֤ע מֵאוֹת֙ שֶׁ֣קֶל כֶּ֔סֶף עֹבֵ֖ר לַ/סֹּחֵֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/016.yaml
  text: 'So Abraham listened to Ephron[a], and Abraham weighed out for Ephron the silver that he had spoken in the hearing of the sons of Heth: four hundred shekels of silver[b], current with the merchant.'
translation:
  language: te
  text: అప్పుడు అబ్రాహాము ఎఫ్రోను మాట విన్నాడు; హేతు కుమారులు[a] వింటుండగా ఎఫ్రోను చెప్పిన, వ్యాపారంలో చెల్లుబాటయ్యే నాలుగు వందల షెకెలుల వెండిని[b] అబ్రాహాము ఎఫ్రోనుకు తూచి ఇచ్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘హిత్తీయులు’; అక్షరార్థంగా ‘హేతు కుమారులు.’
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘వ్యాపారికి ఆమోదయోగ్యమైన వెండి,’ లేక ‘వ్యాపారుల ప్రామాణిక బరువు ప్రకారమైన వెండి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע אַבְרָהָם אֶל עֶפְרוֹן
  choice: అబ్రాహాము ఎఫ్రోను మాట విన్నాడు
  rationale: שׁמע אל అనే ప్రయోగం ఒకరి మాట వినడం లేదా దానికి చెవియొగ్గడం అనే భావాన్ని ఇస్తుంది. ధరకు స్పష్టంగా ‘సమ్మతించాడు’ అని మూలంలో ఉన్నదానికంటే ఎక్కువగా నిర్ధారించకుండా, సందర్భానికి సహజంగా ఉండేలా ఈ రూపం ఎంచుకోబడింది.
- source_word: וַיִּשְׁקֹל
  choice: తూచి ఇచ్చాడు
  rationale: నాణేల వ్యవస్థకు ముందు వెండిని బరువుతో చెల్లించే చారిత్రక చర్యను שקל సూచిస్తుంది. ‘తూచి ఇచ్చాడు’ అనేది ఆ చర్యనూ చెల్లింపు భావాన్నీ సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: הַכֶּסֶף
  choice: వెండి
  rationale: כֶּסֶף ఇక్కడ చెల్లింపుగా ఉపయోగించిన వెండిని సూచిస్తుంది. ‘డబ్బు’ కంటే ‘వెండి’ మూలంలోని పదార్థపరమైన, చారిత్రక నిర్దిష్టతను కాపాడుతుంది.
- source_word: אֲשֶׁר דִּבֶּר
  choice: ఎఫ్రోను చెప్పిన
  rationale: דבר అక్షరార్థంగా ‘చెప్పాడు/మాట్లాడాడు.’ వ్యాపార సందర్భంలో అది ఎఫ్రోను పేర్కొన్న వెండి మొత్తాన్ని సూచిస్తున్నప్పటికీ, ‘ధర నిర్ణయించిన’ వంటి అధిక వ్యాఖ్యానాన్ని నివారిస్తూ ‘చెప్పిన’ అని అనువదించబడింది.
- source_word: בְּאָזְנֵי בְנֵי חֵת
  choice: హేతు కుమారులు వింటుండగా
  rationale: ‘హేతు కుమారుల చెవుల్లో’ అనే హీబ్రూ ప్రయోగం వారి వినికిడిలో బహిరంగంగా జరిగిన లావాదేవీని సూచిస్తుంది. ‘వింటుండగా’ ఆ శ్రవణ భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: בְנֵי חֵת
  choice: హేతు కుమారులు
  rationale: వంశపరంగా గుర్తించబడిన ‘హేతు కుమారులు’ అనే మూలరూపాన్ని ప్రధాన పాఠ్యంలో ఉంచి, పరిచితమైన జాతిపేరు ‘హిత్తీయులు’ను పాదసూచికలో ఇచ్చాం.
- source_word: אַרְבַּע מֵאוֹת שֶׁקֶל כֶּסֶף
  choice: నాలుగు వందల షెకెలుల వెండి
  rationale: మూలంలోని సంఖ్య, పురాతన బరువు ప్రమాణం, వెండి అనే పదార్థం అన్నిటినీ నేరుగా కాపాడే సహజమైన తెలుగు రూపం.
- source_word: עֹבֵר לַסֹּחֵר
  choice: వ్యాపారుల మధ్య చలామణి అయ్యే
  rationale: ఈ వాణిజ్య ప్రయోగం వ్యాపార లావాదేవీలలో అంగీకరించబడే లేదా ప్రామాణిక బరువుగల వెండిని సూచించవచ్చు. ప్రధాన పాఠ్యంలో సహజమైన అర్థాన్ని ఇచ్చి, నిజమైన భావసందిగ్ధతను పాదసూచికలో నిలిపాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన కథనశైలి వాడబడింది. పురాతన వాణిజ్య చర్యను చూపేందుకు ‘తూచి ఇచ్చాడు,’ మూలంలోని జాతి/వంశపదాన్ని నిలుపేందుకు ‘హేతు కుమారులు,’ మరియు సందిగ్ధమైన వాణిజ్య ప్రయోగానికి పాదసూచికతో కూడిన సహజ రూపం ఉపయోగించబడ్డాయి.
