  to: అప్పుడు అబ్రాహాము ఎఫ్రోను మాట విన్నాడు; హేతు కుమారులు[a] వింటుండగా ఎఫ్రోను చెప్పిన, వ్యాపారంలో చెల్లుబాటయ్యే నాలుగు వందల షెకెలుల వెండిని[b] అబ్రాహాము ఎఫ్రోనుకు తూచి ఇచ్చాడు.
