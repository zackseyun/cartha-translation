    issue: ‘వ్యాపారుల మధ్య చలామణి అయ్యే’ అనే అనువాదం
    rationale: עֹבֵר לַסֹּחֵר అనేది సాధారణంగా వ్యాపారంలో అంగీకరించబడే లేదా ప్రమాణ బరువుకు సరిపోయే వెండిని సూచిస్తుంది. ‘చలామణి’ పదం నాణేల ప్రసరణను సూచించవచ్చు; ఇక్కడ తూచి ఇచ్చే వెండికి అది కొంత అనుచితం.
