  to: ఎఫ్రోను హేతు కుమారుల[a] మధ్య కూర్చుని ఉన్నాడు. హిత్తీయుడైన ఎఫ్రోను, హేతు కుమారుల చెవినపడేలా, తన పట్టణ ద్వారంలోనికి ప్రవేశించే వారందరి సమక్షంలో అబ్రాహాముకు ఇలా జవాబిచ్చాడు:[b]
  rationale: సవరణ మూలంలోని ‘ద్వారంలోనికి వచ్చేవారు’ అనే పదప్రయోగాన్ని స్పష్టంగా ప్రతిబింబిస్తుంది; ‘తన పట్టణ ద్వారం’ అని చేయడం ద్వారా సంబంధాన్ని సహజంగా ఉంచుతుంది. ‘చెవినపడేలా’ ద్వారా బహిరంగ వినికిడి నుడికారాన్ని కాపాడుతూ వాక్యప్రవాహం మెరుగుపరచబడింది. పాదసూచిక గుర్తులు వాటి సంబంధిత పదబంధాల వద్దనే ఉంచబడ్డాయి.
