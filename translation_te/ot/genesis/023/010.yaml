source:
  edition: WLC
  text: וְ/עֶפְר֥וֹן יֹשֵׁ֖ב בְּ/ת֣וֹךְ בְּנֵי חֵ֑ת וַ/יַּעַן֩ עֶפְר֨וֹן הַ/חִתִּ֤י אֶת אַבְרָהָם֙ בְּ/אָזְנֵ֣י בְנֵי חֵ֔ת לְ/כֹ֛ל בָּאֵ֥י שַֽׁעַר עִיר֖/וֹ לֵ/אמֹֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/010.yaml
  text: Ephron was sitting among the sons of Heth[a], and Ephron the Hittite answered Abraham in the hearing of the sons of Heth, before all who entered the gate of his city, saying[b],
translation:
  language: te
  text: ఎఫ్రోను హేతు కుమారుల[a] మధ్య కూర్చుని ఉన్నాడు. హిత్తీయుడైన ఎఫ్రోను, హేతు కుమారుల చెవినపడేలా, తన పట్టణ ద్వారంలోనికి ప్రవేశించే వారందరి సమక్షంలో అబ్రాహాముకు ఇలా జవాబిచ్చాడు:[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: రెండు చోట్లా ‘హేతు కుమారులు’ అనే మాటకు ‘హిత్తీయులు’ అని కూడా అనువదించవచ్చు; హీబ్రూలో అక్షరార్థంగా ‘హేతు కుమారులు’ అని ఉంది.
    reason: lexical_alternative
  - marker: b
    text: ‘పట్టణ ద్వారం’ అనేది సాక్షుల సమక్షంలో చట్టపరమైన, వ్యాపార సంబంధమైన వ్యవహారాలు జరిగే బహిరంగ స్థలాన్ని సూచిస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: יֹשֵׁב
  choice: కూర్చుని ఉన్నాడు
  rationale: హీబ్రూ కృదంతం ఆ దృశ్యంలో ఎఫ్రోను కొనసాగుతున్న స్థితిని సూచిస్తుంది; సాధారణ భూతకాల క్రియకన్నా ఈ రూపం ఆ భావాన్ని నిలుపుతుంది.
- source_word: בְּתוֹךְ
  choice: మధ్య
  rationale: సమావేశమైన సమూహంలో ఎఫ్రోను ఉన్నాడనే సామాజిక సందర్భాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: בְּנֵי חֵת
  choice: హేతు కుమారులు
  rationale: హీబ్రూ పదబంధాన్ని సన్నిహితంగా ప్రతిబింబిస్తూ, తరువాత వచ్చే జాతిసూచకమైన ‘హిత్తీయుడు’తో ఉన్న భేదాన్ని నిలుపుతుంది.
- source_word: וַיַּעַן
  choice: జవాబిచ్చాడు
  rationale: సంభాషణ సందర్భంలో ענהకు సహజమైన, నేరమైన తెలుగు సమానం.
- source_word: הַחִתִּי
  choice: హిత్తీయుడైన
  rationale: నిర్దిష్ట జాతి గుర్తింపును తెలుగులో సహజమైన విశేషణ రూపంలో తెలియజేస్తుంది.
- source_word: בְּאָזְנֵי
  choice: వింటుండగా
  rationale: అక్షరార్థమైన ‘చెవుల్లో’ అనే రూపానికి బదులు, మాట అందరికీ బహిరంగంగా వినిపించిందనే హీబ్రూ నుడికార భావాన్ని సహజంగా అందిస్తుంది.
- source_word: לְכֹל בָּאֵי שַׁעַר עִירוֹ
  choice: అతని పట్టణ ద్వారం దగ్గరికి వచ్చిన వారందరి సమక్షంలో
  rationale: లְ ఉపసర్గకు ఇక్కడ సాక్షుల సమక్షం అనే భావాన్ని ఇచ్చి, పట్టణ ద్వారం వద్ద జరిగిన బహిరంగ వ్యవహార సందర్భాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: שַׁעַר עִירוֹ
  choice: అతని పట్టణ ద్వారం
  rationale: హీబ్రూ నిర్మాణాన్ని స్పష్టంగా నిలుపుతూ సహజమైన తెలుగు పదక్రమాన్ని ఉపయోగిస్తుంది.
- source_word: לֵאמֹר
  choice: 'ఇలా ... :'
  rationale: తదుపరి వచనంలోని ప్రత్యక్ష సంభాషణకు సహజమైన తెలుగు పరిచయ రూపం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. ‘హేతు కుమారులు’ అనే మూలభాష రూపాన్ని ప్రధాన పాఠ్యంలో నిలిపి, సాధారణ జాతినామమైన ‘హిత్తీయులు’ను పాదసూచికలో ఇచ్చాం. వాక్యాన్ని తెలుగు పఠనసౌలభ్యం కోసం రెండు వాక్యాలుగా విభజించాం; చివరి ద్విబిందువు తదుపరి ప్రత్యక్ష వాక్యానికి దారితీస్తుంది.
