id: GEN.23.12
reference: Genesis 23:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּשְׁתַּ֨חוּ֙ אַבְרָהָ֔ם לִ/פְנֵ֖י עַ֥ם הָ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/012.yaml
  text: Then Abraham bowed down before the people of the land[a].
translation:
  language: te
  text: అప్పుడు అబ్రాహాము ఆ దేశ ప్రజల ఎదుట వంగి నమస్కరించాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆ దేశ ప్రజల ఎదుట సాష్టాంగపడ్డాడు.”
    reason: וַיִּשְׁתַּחוּ మరింత పూర్తిగా నేలవైపు వంగడం లేదా సాష్టాంగపడడం అనే భావాన్నీ అనుమతిస్తుంది.
lexical_decisions:
- source_word: וַיִּשְׁתַּחוּ
  choice: వంగి నమస్కరించాడు
  rationale: שׁחה హిష్టఫేల్ రూపం గౌరవం లేదా వినయాన్ని చూపుతూ శరీరాన్ని వంచడాన్ని సూచిస్తుంది. హిత్తీయులతో జరుగుతున్న సామాజిక లావాదేవీ సందర్భంలో ‘వంగి నమస్కరించాడు’ అనేది దైవారాధన భావాన్ని కలిగించకుండా గౌరవ సూచకమైన శారీరక చర్యను సహజంగా తెలియజేస్తుంది.
- source_word: לִפְנֵי
  choice: ఎదుట
  rationale: פָּנִיםతో కూడిన ఈ ఉపసర్గ ‘ముందు’ లేదా ‘సమక్షంలో’ అనే భావాన్ని ఇస్తుంది. ఇక్కడ ‘ఎదుట’ ఆధునిక తెలుగులో సంక్షిప్తంగా, సహజంగా ఉంది.
- source_word: עַם הָאָרֶץ
  choice: ఆ దేశ ప్రజలు
  rationale: ఈ సందర్భంలో ఈ పదబంధం భూసంబంధ లావాదేవీకి సాక్షులుగా ఉన్న స్థానిక ప్రజాసమూహాన్ని సూచిస్తుంది. ‘ఆ దేశ ప్రజలు’ మూలంలోని ప్రజలు–దేశం సంబంధాన్ని నిలుపుతుంది.
- source_word: וַ
  choice: అప్పుడు
  rationale: వయ్యిక్తోల్‌కు ముందున్న వావ్ కథనాన్ని తదుపరి చర్యకు తీసుకెళ్తుంది; ‘అప్పుడు’ ఆ క్రమాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: אַבְרָהָם
  choice: అబ్రాహాము
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన పేరురూపాన్ని అనుసరించాం.
theological_decisions:
- issue: గౌరవ సూచక నమస్కారం మరియు దైవారాధన మధ్య తేడా
  choice: వంగి నమస్కరించాడు
  alternative: ఆరాధించాడు
  rationale: ఈ సందర్భం హిత్తీయుల ఎదుట జరిగిన సామాజిక గౌరవ చర్యను సూచిస్తుంది; ‘ఆరాధించాడు’ అనడం మూలంలో లేని దైవారాధన భావాన్ని కలిగించవచ్చు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన, గౌరవప్రదమైన శైలి. ‘వంగి నమస్కరించాడు’ సామాజిక గౌరవాన్ని స్పష్టపరుస్తూ మూలపదంలోని శారీరక వంగుట భావాన్ని నిలుపుతుంది.
