translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన శైలిని పాటించాం. పేర్లను తెలుగు లిపిలో ధ్వన్యనుకరణగా ఇచ్చాం. హీబ్రూ వాక్యక్రమాన్ని యాంత్రికంగా అనుసరించకుండా, సమాచార క్రమాన్ని మరియు రెండు వేర్వేరు శోకక్రియలను కాపాడేలా తెలుగు వాక్యాన్ని నిర్మించాం.
