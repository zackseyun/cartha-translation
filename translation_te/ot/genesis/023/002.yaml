  text: וַ/תָּ֣מָת שָׂרָ֗ה בְּ/קִרְיַ֥ת אַרְבַּ֛ע הִ֥וא חֶבְר֖וֹן בְּ/אֶ֣רֶץ כְּנָ֑עַן וַ/יָּבֹא֙ אַבְרָהָ֔ם לִ/סְפֹּ֥ד לְ/שָׂרָ֖ה וְ/לִ/בְכֹּתָֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/002.yaml
  text: And Sarah died in Kiriath-arba (that is[a], Hebron) in the land of Canaan[b], and Abraham came to mourn for Sarah and to weep for her.
translation:
  language: te
  text: కనాను దేశంలోని కిర్యత్-అర్బాలో—అంటే హెబ్రోనులో[a]—శారా చనిపోయింది. అప్పుడు అబ్రాహాము శారా కోసం దుఃఖించడానికి, ఆమె కోసం ఏడవడానికి వచ్చాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ కిర్యత్-అర్బా అనే స్థలం హెబ్రోనుతో గుర్తించబడింది.
    reason: cross_reference
  - marker: b
    text: లేదా, “శారా కోసం విలపించడానికి, ఆమెను గూర్చి ఏడవడానికి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּמָת
  choice: చనిపోయింది
  rationale: מות మరణాన్ని సూటిగా సూచిస్తుంది. తెలుగు సాధారణ వాడుకలో ‘చనిపోయింది’ సహజంగా, స్పష్టంగా ఉంటుంది; మూలంలోని నేరుగా చెప్పే ధోరణిని మృదువుచేయదు.
- source_word: בְּקִרְיַת אַרְבַּע
  choice: కిర్యత్-అర్బాలో
  rationale: స్థలనామాన్ని అనువదించకుండా తెలుగు లిపిలో ధ్వన్యనుకరణగా ఇచ్చాం; בְ భావాన్ని ‘లో’తో తెలిపాం.
- source_word: הִוא חֶבְרוֹן
  choice: అంటే హెబ్రోనులో
  rationale: ఈ హీబ్రూ ఉపవాక్యం కిర్యత్-అర్బాను హెబ్రోనుతో గుర్తిస్తుంది. ‘అంటే’ ఆధునిక తెలుగులో ఆ వివరణాత్మక సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: కనాను దేశంలోని
  rationale: אֶרֶץ అనే నామవాచకాన్ని వదలకుండా ‘దేశం’గా వ్యక్తం చేశాం; తెలుగు వాక్య నిర్మాణం కోసం సంబంధవాచక రూపం వాడాం.
- source_word: וַיָּבֹא
  choice: వచ్చాడు
  rationale: בוא సందర్భాన్ని బట్టి రావడం లేదా వెళ్లడం కావచ్చు. కథన దృష్టికోణంలో ‘వచ్చాడు’ సరిపోతుంది; అతడు ఎక్కడి నుంచి వచ్చాడో మూలం చెప్పనందున అదనపు వివరాన్ని చేర్చలేదు.
- source_word: לִסְפֹּד
  choice: దుఃఖించడానికి
  rationale: ספד శోకాచరణను, విలాపాన్ని సూచిస్తుంది. ‘దుఃఖించడానికి’ సాధారణ పాఠకులకు సహజంగా ఉండి విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: לְשָׂרָה
  choice: శారా కోసం
  rationale: శోక సందర్భంలో ל సంబంధాన్ని తెలుగులో సహజమైన ‘కోసం’తో తెలిపాం.
- source_word: וְלִבְכֹּתָהּ
  choice: ఆమె కోసం ఏడవడానికి
  rationale: בכה అంటే ఏడవడం. స్త్రీలింగ ఏకవచన ప్రత్యయాన్ని ‘ఆమె’గా స్పష్టంగా నిలిపి, ఉద్దేశార్థక నిర్మాణాన్ని పునరావృతం చేయడం ద్వారా రెండు క్రియల భేదాన్ని కాపాడాం.
