translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవార్థక సంబోధనను ఉపయోగించాం. ఆస్తి బదిలీ ప్రకటనలోని పునరుక్తిని ఉద్దేశపూర్వకంగా నిలిపి, హీబ్రూ వాక్యంలోని బహిరంగ సాక్ష్య భావాన్ని సహజంగా వ్యక్తం చేశాం.
