id: GEN.23.11
reference: Genesis 23:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: לֹֽא אֲדֹנִ֣/י שְׁמָעֵ֔/נִי הַ/שָּׂדֶה֙ נָתַ֣תִּי לָ֔/ךְ וְ/הַ/מְּעָרָ֥ה אֲשֶׁר בּ֖/וֹ לְ/ךָ֣ נְתַתִּ֑י/הָ לְ/עֵינֵ֧י בְנֵי עַמִּ֛/י נְתַתִּ֥י/הָ לָּ֖/ךְ קְבֹ֥ר מֵתֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/011.yaml
  text: 'No[a], my lord, listen to me: I give you the field, and I give you the cave that is in it[b]. In the sight of the sons of my people I give it to you[c]. Bury your dead.'
translation:
  language: te
  text: “కాదు[a], నా ప్రభువా, నా మాట వినండి. పొలాన్ని మీకు ఇస్తున్నాను; అందులో ఉన్న గుహను కూడా మీకు ఇస్తున్నాను. నా ప్రజల సమక్షంలో దాన్ని మీకు ఇస్తున్నాను[b]. మీ మరణించిన వ్యక్తిని పాతిపెట్టండి.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత పదానుసారంగా: “అలా కాదు, నా ప్రభువా; నా మాట వినండి.”'
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా “నా ప్రజల కుమారుల కళ్ల ఎదుట”; అంటే తన సమాజానికి చెందిన సాక్షుల సమక్షంలో బహిరంగంగా.
    reason: cultural_note
lexical_decisions:
- source_word: לֹא
  choice: కాదు
  rationale: అబ్రాహాము చేసిన ప్రతిపాదనను మర్యాదగా తిరస్కరిస్తూ లేదా సరిదిద్దుతూ చెప్పిన మాట ఇది; ఆధునిక తెలుగులో ‘కాదు’ సహజంగా ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: אֲדֹנִי
  choice: నా ప్రభువా
  rationale: ఆస్తి లావాదేవీ సందర్భంలో అబ్రాహామును గౌరవంగా సంబోధించిన మాట. ‘నా ప్రభువా’ మూలంలోని సామాజిక మర్యాదను నిలుపుతుంది; యజమాని-దాసుడి సంబంధాన్ని అనవసరంగా సూచించదు.
- source_word: שְׁמָעֵנִי
  choice: నా మాట వినండి
  rationale: నేరుగా చేసిన విజ్ఞప్తి. గౌరవార్థక బహువచన క్రియారూపం తెలుగులో సందర్భోచితంగా, సహజంగా ఉంటుంది.
- source_word: הַשָּׂדֶה
  choice: పొలం
  rationale: שׂדה ఇక్కడ గుహ ఉన్న బహిరంగ భూభాగం లేదా పొలాన్ని సూచిస్తుంది; ‘పొలం’ ప్రత్యక్షమైన, సందర్భానికి సరిపోయే పదం.
- source_word: נָתַתִּי לָךְ / נְתַתִּיהָ לָךְ
  choice: మీకు ఇస్తున్నాను
  rationale: హీబ్రూ సంపూర్ణ క్రియారూపం ఇక్కడ మాటతోనే ఆస్తిని బదిలీ చేసే ప్రదర్శనాత్మక ప్రయోగం. తెలుగు వర్తమాన ప్రగతిశీల రూపం తక్షణ బదిలీ ప్రతిపాదనను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: הַמְּעָרָה אֲשֶׁר בּוֹ
  choice: అందులో ఉన్న గుహ
  rationale: గుహ పొలంలోనే ఉందనే స్థల సంబంధాన్ని సంక్షిప్తంగా, స్పష్టంగా నిలుపుతుంది.
- source_word: לְעֵינֵי בְנֵי עַמִּי
  choice: నా ప్రజల సమక్షంలో
  rationale: అక్షరార్థంగా ‘నా ప్రజల కుమారుల కళ్ల ఎదుట’; ఇక్కడ సమాజ సభ్యుల బహిరంగ సాక్ష్యం అనే నుడికార భావాన్ని సహజ తెలుగులో అందిస్తుంది.
- source_word: קְבֹר מֵתֶךָ
  choice: మీ మృతురాలిని పాతిపెట్టండి
  rationale: నేర ఆజ్ఞను నిలుపుతూ, సందర్భంలో మరణించినది శారా కావడంతో తెలుగు స్త్రీలింగ రూపాన్ని వాడింది. ‘పాతిపెట్టండి’ קבר యొక్క సాధారణ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
