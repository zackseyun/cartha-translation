  text: And Cain said to Abel his brother. Then[a], while they were in the field, Cain rose up against Abel his brother and killed him.
translation:
  language: te
  text: కయీను తన సోదరుడైన హేబెలుతో అన్నాడు.[a] వారు పొలంలో ఉన్నప్పుడు కయీను తన సోదరుడైన హేబెలుకు విరోధంగా లేచి అతణ్ణి చంపాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ మసొరెటిక్ పాఠంలో, “కయీను తన సోదరుడైన హేబెలుతో అన్నాడు” అని మాత్రమే ఉంది; అతడు ఏమన్నాడో అందులో లేదు. సెప్టువజింటు, సమరయ పంచగ్రంథం, వుల్గేటు వంటి ప్రాచీన సాక్ష్యాలలో “మనం పొలంలోకి వెళ్దాం” అనే మాటలు ఉన్నాయి.
    reason: textual_variant
lexical_decisions:
- source_word: וַיֹּאמֶר ... אֶל
  choice: కయీను ... హేబెలుతో అన్నాడు
  rationale: אמר అనే క్రియకు సాధారణ అర్థం ‘అను/చెప్పు.’ אֶל వ్యక్తివైపు మాటను నిర్దేశిస్తుంది. తెలుగులో ‘హేబెలుతో అన్నాడు’ సహజంగా ఉండి, మూలపాఠంలోని అసంపూర్ణ వాక్యాన్ని పూరించకుండా అలాగే నిలుపుతుంది.
- source_word: אָחִיו
  choice: తన సోదరుడైన
  rationale: ‘అతని సోదరుడు’ అనే భావాన్ని స్పష్టంగా అందిస్తుంది. ఈ పదబంధం రెండుసార్లు రావడాన్ని నిలుపడం ద్వారా సోదరహత్యపై కథనంలో ఉన్న ఉద్ఘాటనను కాపాడుతుంది.
- source_word: וַיְהִי בִּהְיוֹתָם בַּשָּׂדֶה
  choice: వారు పొలంలో ఉన్నప్పుడు
  rationale: ఈ హీబ్రూ నిర్మాణం కథనంలోని కాలసందర్భాన్ని సూచిస్తుంది. తెలుగులో సహజమైన కాలవాచక ఉపవాక్యంగా అనువదించబడింది.
- source_word: וַיָּקָם ... אֶל
  choice: మీదికి లేచి
  rationale: వ్యతిరేకంగా లేచే హీబ్రూ రూపకాన్ని నిలుపుతుంది; ‘దాడి చేశాడు’ అని పూర్తిగా భావానువాదం చేయకుండా శత్రుత్వాన్ని తెలియజేస్తుంది.
- source_word: וַיַּהַרְגֵהוּ
  choice: అతణ్ణి చంపాడు
  rationale: הרג అనే క్రియకు నేరుగా సరిపడే అర్థం ‘చంపు.’ ‘హత్య చేశాడు’ అనే న్యాయపరమైన వర్గీకరణను మూలక్రియలోకి అదనంగా చేర్చదు.
theological_decisions:
- issue: మసొరెటిక్ పాఠంలో కయీను పలికిన మాటలు లేకపోవడం
  choice: అందించిన WLC మసొరెటిక్ పాఠంలోని సంక్షిప్తమైన, అసంపూర్ణ వాక్యాన్నే ప్రధాన పాఠంలో ఉంచి, పాఠాంతరాన్ని పాదసూచికలో తెలిపాం.
  alternative: ప్రాచీన సాక్ష్యాల ఆధారంగా “మనం పొలానికి వెళ్దాం” అనే మాటలను ప్రధాన పాఠంలో చేర్చడం.
  rationale: అందించిన మూలభాషా పాఠానికి ప్రాధాన్యం ఇచ్చి, దాని నిజమైన అసంపూర్ణతను మౌనంగా సరిచేయలేదు. అదే సమయంలో సెప్టువజింటు, సమరయ పంచకాండం, వుల్గేటు వంటి ప్రాచీన సాక్ష్యాలలో ఉన్న విస్తృత పాఠాన్ని పాదసూచికలో పారదర్శకంగా నమోదు చేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథనశైలి ఉపయోగించబడింది. ‘సోదరుడు’ అనే పదాన్ని రెండుసార్లు నిలిపి మూలంలోని ఉద్ఘాటనను కాపాడాం. మసొరెటిక్ పాఠంలోని అకస్మాత్తు విరామాన్ని సహజీకరించి తొలగించకుండా, పాదసూచిక ద్వారా పాఠాంతర సాక్ష్యాన్ని అందించాం.
