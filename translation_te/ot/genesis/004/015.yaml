id: GEN.4.15
reference: Genesis 4:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֧אמֶר ל֣/וֹ יְהוָ֗ה לָ/כֵן֙ כָּל הֹרֵ֣ג קַ֔יִן שִׁבְעָתַ֖יִם יֻקָּ֑ם וַ/יָּ֨שֶׂם יְהוָ֤ה לְ/קַ֨יִן֙ א֔וֹת לְ/בִלְתִּ֥י הַכּוֹת אֹת֖/וֹ כָּל מֹצְאֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/015.yaml
  text: Then Yahweh said to him[a], “Therefore whoever kills Cain, vengeance will be taken on him sevenfold.” And Yahweh put a mark on Cain[b], lest anyone finding him should strike him.
translation:
  language: te
  text: 'అప్పుడు యెహోవా అతనితో ఇలా అన్నాడు: “కాబట్టి కయీనును చంపేవాడికి ఏడురెట్ల ప్రతీకారం తీర్చబడుతుంది.”[a] కయీనును కనుగొనే ఎవరూ అతనిని కొట్టకుండా ఉండేందుకు యెహోవా కయీనుకు ఒక గుర్తు పెట్టాడు.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కయీనును చంపేవానిపై ఏడురెట్ల ప్రతీకారం జరుగుతుంది.” హీబ్రూ నిష్క్రియ క్రియ సంక్షిప్తంగా ఉంది; ప్రతీకారం చేసేవారు ఎవరో అది ప్రత్యక్షంగా చెప్పదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “సూచన.” హీబ్రూ పదం ఒక సూచనను లేదా ప్రత్యేక గుర్తును సూచించవచ్చు; అది ఏ రూపంలో ఉందో పాఠ్యం చెప్పదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగు బైబిలు వాడుకలో సుపరిచితమైన ‘యెహోవా’గా ఉంచింది.
- source_word: לָכֵן
  choice: కాబట్టి
  rationale: దేవుని సమాధానంలోని నిర్ధారణాత్మక సంబంధాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: כָּל הֹרֵג קַיִן
  choice: కయీనును చంపేవాడికి
  rationale: హీబ్రూ నిర్మాణంలోని సాధారణ, అనిర్దిష్ట భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; తదుపరి నిష్క్రియ క్రియకు లక్ష్యాన్ని కూడా స్పష్టం చేస్తుంది.
- source_word: שִׁבְעָתַיִם
  choice: ఏడంతలుగా
  rationale: ప్రతీకారం యొక్క ఏడు రెట్ల పరిమాణాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: יֻקָּם
  choice: ప్రతీకారం చేయబడుతుంది
  rationale: హీబ్రూ నిష్క్రియ రూపాన్ని సాధ్యమైనంతవరకు నిలుపుతూ, కయీనును చంపినవాడే ప్రతీకారానికి గురవుతాడని సందర్భం ద్వారా స్పష్టం చేస్తుంది; కార్యసాధకుడు మూలంలోలాగే వ్యక్తం కాలేదు.
- source_word: אוֹת
  choice: గుర్తు
  rationale: אות సూచించే ‘సూచన/గుర్తు’ అనే విస్తృత భావాన్ని ఉంచుతుంది; దాని రూపం ఏమిటో వాక్యం చెప్పనందున అనవసరమైన భౌతిక వివరాన్ని చేర్చదు.
- source_word: לְבִלְתִּי הַכּוֹת אֹתוֹ
  choice: అతనిపై దాడి చేయకుండా
  rationale: నిషేధాత్మక ఉద్దేశాన్ని సహజ తెలుగులో చూపుతుంది. נכהకు ‘కొట్టు’ అనే ప్రత్యక్ష అర్థం ఉన్నా, ఇక్కడ హింసాత్మక దాడి భావాన్ని ‘దాడి చేయు’ సముచితంగా అందిస్తుంది; ‘చంపు’ అని మరీ నిర్దిష్టం చేయదు.
- source_word: כָּל מֹצְאוֹ
  choice: కయీనును కనుగొన్నవారెవరూ
  rationale: సార్వత్రిక అనిర్దిష్ట భావాన్ని నిషేధాత్మక ఉద్దేశ వాక్యంతో సహజంగా కలుపుతుంది.
theological_decisions:
- issue: కయీనుకు ఉంచిన אות స్వభావం
  choice: ‘గుర్తు’ అని అనువదించి, దాని రూపాన్ని నిర్దిష్టం చేయలేదు.
  alternative: ‘సూచన’ లేదా ఏదైనా నిర్దిష్టమైన శారీరక ముద్రగా వివరించడం
  rationale: హీబ్రూ పదం గుర్తు లేదా సూచనను సూచించగలదు; అది ఏ రూపంలో ఉందో పాఠ్యం వెల్లడించదు. అందువల్ల తరువాతి ఊహలను అనువాదంలోకి తీసుకురాలేదు.
- issue: ఏడంతల ప్రతీకారం ఎవరిపై జరుగుతుంది
  choice: కయీనును చంపేవాడే ప్రతీకారానికి గురవుతాడని వాక్య నిర్మాణంలో స్పష్టం చేసింది.
  alternative: ‘అతనికి ఏడంతలుగా ప్రతీకారం చేయబడుతుంది’ అనే తెలుగులో సందిగ్ధంగా ఉండగల మరింత అక్షరార్థ రూపం
  rationale: יֻקָּם నిష్క్రియంగా, కార్యసాధకుడిని చెప్పకుండా ఉంది. సందర్భం కయీనును చంపేవాడికి వచ్చే ప్రతీకారాన్ని సూచిస్తుంది; తెలుగు పాఠకుడు ‘అతను’ను కయీనుగా అపార్థం చేసుకోకుండా లక్ష్యాన్ని స్పష్టం చేసింది, కానీ ప్రతీకారం చేసే వ్యక్తిని పేరుపెట్టలేదు.
translation_notes:
  register: సహజమైన, గౌరవప్రదమైన ఆధునిక ప్రామాణిక తెలుగు వాడబడింది. ‘యెహోవా’ ద్వారా దైవనామం నిలుపబడింది. హీబ్రూ నిష్క్రియతను సాధ్యమైనంతవరకు కాపాడుతూ, తెలుగులో కలిగే సర్వనామ సందిగ్ధతను నివారించింది. రెండు పాదటిప్పణి సూచికలూ సంబంధిత ప్రధాన వాక్య భాగాల వెంట ఉంచబడ్డాయి.
