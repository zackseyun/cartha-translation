revisions:
- from: 'అప్పుడు యెహోవా అతనితో ఇలా అన్నాడు: “కాబట్టి కయీనును చంపేవాడికి ఏడంతలుగా ప్రతీకారం చేయబడుతుంది.”[a] యెహోవా కయీనును కనుగొన్నవారెవరూ అతనిపై దాడి చేయకుండా, అతనికి ఒక గుర్తు ఉంచాడు.[b]'
  to: 'అప్పుడు యెహోవా అతనితో ఇలా అన్నాడు: “కాబట్టి కయీనును చంపేవాడికి ఏడురెట్ల ప్రతీకారం తీర్చబడుతుంది.”[a] కయీనును కనుగొనే ఎవరూ అతనిని కొట్టకుండా ఉండేందుకు యెహోవా కయీనుకు ఒక గుర్తు పెట్టాడు.[b]'
  rationale: సవరించిన పాఠం హీబ్రూ నిష్క్రియ నిర్మాణంలో కార్యసాధకుడు చెప్పబడలేదనే అంశాన్ని కాపాడుతూ, కయీనును చంపేవాడిపైనే ప్రతీకారం జరుగుతుందని స్పష్టం చేస్తుంది. చివరి వాక్యంలో ‘కొట్టకుండా’ నכהకు మరింత ప్రత్యక్షమైన సమానార్థకంగా ఉంది; ‘చంపకుండా’ అని మూలంలో లేని నిర్దిష్టతను జోడించదు. గుర్తు స్వరూపం గురించిన సందిగ్ధత అలాగే నిలిపి, సూచికలను సంబంధిత పదాలకు జతచేశారు.
