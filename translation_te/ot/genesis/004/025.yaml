  to: ఆదాము మళ్లీ తన భార్యతో దాంపత్యంగా కలిశాడు. ఆమె ఒక కుమారుణ్ణి కని, అతనికి షేతు[a] అని పేరు పెట్టింది. “కయీను హేబెలును చంపాడు కాబట్టి, హేబెలు స్థానంలో దేవుడు నాకు మరో సంతానాన్ని నియమించాడు” అని ఆమె చెప్పింది.
