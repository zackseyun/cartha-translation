id: GEN.4.25
reference: Genesis 4:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֵּ֨דַע אָדָ֥ם עוֹד֙ אֶת אִשְׁתּ֔/וֹ וַ/תֵּ֣לֶד בֵּ֔ן וַ/תִּקְרָ֥א אֶת שְׁמ֖/וֹ שֵׁ֑ת כִּ֣י שָֽׁת לִ֤/י אֱלֹהִים֙ זֶ֣רַע אַחֵ֔ר תַּ֣חַת הֶ֔בֶל כִּ֥י הֲרָג֖/וֹ קָֽיִן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/025.yaml
  text: And Adam knew his wife again[a], and she bore a son and called his name Seth, for she said, “God has appointed for me another offspring in place of Abel, because Cain killed him.”
translation:
  language: te
  text: ఆదాము మళ్లీ తన భార్యతో దాంపత్యంగా కలిశాడు. ఆమె ఒక కుమారుణ్ణి కని, అతనికి షేతు[a] అని పేరు పెట్టింది. “కయీను హేబెలును చంపాడు కాబట్టి, హేబెలు స్థానంలో దేవుడు నాకు మరో సంతానాన్ని నియమించాడు” అని ఆమె చెప్పింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '‘షేతు’ అనే పేరుకు, ఇక్కడ ‘నియమించాడు’ అని అనువదించిన హెబ్రీ క్రియ (శాత్: ‘ఉంచాడు/నియమించాడు’)తో శబ్దసామ్యం ఉంది; ఇది ఒక పదచమత్కారం.'
    reason: షేతు పేరుకు שָׁת క్రియతో ఉన్న హెబ్రీ పదచమత్కారాన్ని వివరిస్తుంది; అది తెలుగు అనువాదంలో పూర్తిగా పునరుత్పత్తి కాదు.
lexical_decisions:
- source_word: וַיֵּדַע
  choice: తన భార్యతో కలిశాడు
  rationale: భార్యాభర్తల లైంగిక సంబంధాన్ని సూచించే హెబ్రీ మర్యాదోక్తిని, ఆధునిక తెలుగులో సహజంగా అర్థమయ్యే మర్యాదోక్తితో అందిస్తుంది.
- source_word: אָדָם
  choice: ఆదాము
  rationale: ఇక్కడ సాధారణంగా ‘మనిషి’ అనే అర్థం కాక, వ్యక్తి పేరే ఉద్దేశించబడింది.
- source_word: עוֹד
  choice: మళ్లీ
  rationale: ఇంతకుముందు జరిగిన దాంపత్య కలయిక ఇప్పుడు పునరావృతమైందని సహజంగా సూచిస్తుంది.
- source_word: וַתֵּלֶד בֵּן
  choice: ఆమె ఒక కుమారుణ్ణి కని
  rationale: కుమారునికి జన్మనివ్వడాన్ని సంక్షిప్తంగా, సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וַתִּקְרָא אֶת־שְׁמוֹ
  choice: అతనికి … అని పేరు పెట్టింది
  rationale: హెబ్రీ నామకరణ సూత్రానికి సహజమైన ఆధునిక తెలుగు సమానం.
- source_word: שֵׁת
  choice: షేతు
  rationale: హెబ్రీ వ్యక్తి పేరుకు తెలుగు లిప్యంతరీకరణ.
- source_word: שָׁת
  choice: ఉంచాడు
  rationale: שִׁית అనే క్రియకు ‘ఉంచు/నిలుపు’ అనే ప్రాథమిక భావం ఉంది; ఇది షేతు పేరుతో ఉన్న ధ్వన్యనుకరణను సాధ్యమైనంతవరకు చూపుతుంది.
- source_word: זֶרַע
  choice: సంతానం
  rationale: ‘విత్తనం’ అనే అక్షరార్థం కంటే ఇక్కడ జనన/వంశ భావాన్ని సహజంగా తెలియజేస్తూ, పదంలోని విస్తృతార్థాన్ని నిలుపుతుంది.
- source_word: תַּחַת
  choice: స్థానంలో
  rationale: ఇక్కడ ప్రత్యామ్నాయం లేదా భర్తీ అనే సంబంధాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: הֲרָגוֹ
  choice: చంపాడు
  rationale: הרג అనే సాధారణ ‘చంపు’ క్రియకు నేరుగా సరిపోతుంది; మూలంలో లేని మరింత నిర్దిష్టమైన న్యాయపరమైన భావాన్ని చేర్చదు.
theological_decisions:
- issue: షేతు పేరుకు స్త్రీ ఇచ్చిన వివరణ
  choice: దేవుడు నాకు మరొక సంతానాన్ని ఉంచాడు
  alternative: దేవుడు నాకు మరొక బిడ్డను అనుగ్రహించాడు
  rationale: దేవుడే ఈ సంతానాన్ని ఇచ్చాడనే భావాన్ని నిలుపుతూ, షేతు అనే పేరుకు שָׁת (‘ఉంచాడు’) అనే క్రియతో ఉన్న పదచమత్కారాన్ని కాపాడుతుంది. ‘అనుగ్రహించాడు’ సహజమైనదైనా మూలక్రియను, పదచమత్కారాన్ని మరుగుపరుస్తుంది.
- issue: దాంపత్య సంబంధాన్ని సూచించే మర్యాదోక్తి
  choice: తన భార్యతో కలిశాడు
  alternative: తన భార్యను తెలిసికొన్నాడు
  rationale: మూలంలోని మర్యాదోక్తి స్వభావాన్ని నిలుపుతూ ఆధునిక తెలుగు పాఠకులకు ఉద్దేశం స్పష్టంగా ఉండేలా చేస్తుంది; అక్షరానువాదం తెలుగులో తప్పుగా లేదా అస్పష్టంగా అర్థమయ్యే అవకాశం ఉంది.
- issue: זֶרַע పదంలోని ఏకవచన/సమష్టి విస్తృతి
  choice: సంతానం
  alternative: బిడ్డ
  rationale: సందర్భంలో కొత్తగా పుట్టిన కుమారుడు ఉద్దేశించబడినా, హెబ్రీ పదం సంతతి లేదా వంశం అనే విస్తృత భావాన్నీ మోయగలదు. ‘సంతానం’ ఆ ఉద్దేశపూర్వక విస్తృతిని కుదించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘కలిశాడు’ ద్వారా మూలంలోని మర్యాదోక్తి నిలుపబడింది. పేర్లు ఆదాము, షేతు, హేబెలు, కయీను రూపాల్లో లిప్యంతరీకరించబడ్డాయి.
