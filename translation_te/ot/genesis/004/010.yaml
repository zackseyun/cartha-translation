id: GEN.4.10
reference: Genesis 4:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֖אמֶר מֶ֣ה עָשִׂ֑יתָ ק֚וֹל דְּמֵ֣י אָחִ֔י/ךָ צֹעֲקִ֥ים אֵלַ֖/י מִן הָֽ/אֲדָמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/010.yaml
  text: And he said[a], “What have you done? The voice of your brother’s blood is crying out to me from the ground.”
translation:
  language: te
  text: 'అప్పుడు ఆయన ఇలా అన్నాడు: “నీవు చేసినదేమిటి? నీ సోదరుని రక్తపు స్వరం[a] నేలనుండి నాకు మొరపెడుతోంది.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా ‘రక్తాలు’; రక్తపాతం జరిగిన సందర్భాల్లో ఈ బహువచన రూపం వాడబడుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ఆయన ఇలా అన్నాడు
  rationale: వయ్యిక్తోల్ కథనాన్ని ముందుకు నడిపిస్తుంది. ఆధునిక తెలుగులో ‘అప్పుడు’ కథన క్రమాన్ని సహజంగా తెలియజేస్తుంది; ‘ఇలా అన్నాడు’ ప్రత్యక్ష వాక్యాన్ని సుగమంగా పరిచయం చేస్తుంది.
- source_word: מֶה עָשִׂיתָ
  choice: నీవు చేసినదేమిటి?
  rationale: పూర్తయిన చర్యను గంభీరమైన ప్రత్యక్ష ప్రశ్నగా, దాని ప్రస్తుత నైతిక భారాన్ని నిలిపే సహజ తెలుగు ప్రయోగం.
- source_word: קוֹל דְּמֵי אָחִיךָ
  choice: నీ సహోదరుని రక్తం
  rationale: హీబ్రూ వాక్యంలో ‘నీ సహోదరుని రక్తాల స్వరం’ అని అక్షరార్థ నిర్మాణం ఉన్నా, צֹעֲקִים అనే ‘మొరపెడుతోంది’ క్రియలో స్వరం భావం తెలుగులో సహజంగా వ్యక్తమవుతుంది. ‘సహోదరుడు’ గంభీరమైనప్పటికీ సాధారణ పాఠకునికి స్పష్టమైన పదం.
- source_word: דְּמֵי
  choice: రక్తం[a]
  rationale: హీబ్రూలో ఇది బహువచన రూపం (‘రక్తాలు’); రక్తపాతం సందర్భంలో వాడే ఈ రూపాన్ని తెలుగులో సహజమైన ఏకవచన ద్రవ్యనామం ‘రక్తం’గా ఇచ్చి, మూలరూపాన్ని పాదటిప్పణిలో సూచించాం.
- source_word: צֹעֲקִים
  choice: మొరపెడుతోంది
  rationale: ‘మొరపెట్టు’ న్యాయం లేదా సహాయం కోసం వినిపించే తీవ్రమైన పిలుపును సూచించి, రక్తాన్ని వ్యక్తీకరించిన మూలచిత్రాన్ని నిలుపుతుంది. హీబ్రూ కృదంతంలోని కొనసాగుతున్న చర్యను తెలుగు వర్తమాన ప్రగతిశీల రూపం తెలియజేస్తుంది.
- source_word: אֵלַי
  choice: నాకు
  rationale: మొర దేవునికే చేరుతోందనే దిశను సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: מִן הָאֲדָמָה
  choice: నేలలోనుండి
  rationale: కయీను కథనంలోని భూమి/మట్టి చిత్రణను నిలుపుతూ, ఆధునిక తెలుగులో సహజమైన పదం ‘నేల’ను ఎంచుకున్నాం.
theological_decisions:
- issue: హేబెలు చిందించిన రక్తం వ్యక్తిలా మొరపెట్టడం
  choice: రక్తమే దేవునికి మొరపెడుతోందనే వ్యక్తీకరణను యథాతథంగా నిలిపాం.
  alternative: దీనిని ‘రక్తాపరాధం న్యాయం కోరుతోంది’ అని భావార్థంగా వివరించడం.
  rationale: మూల హీబ్రూ స్పష్టమైన, బలమైన వ్యక్తీకరణను ఉపయోగిస్తుంది. దానిని అమూర్తమైన వివరణతో భర్తీ చేయకుండా ఉంచడం వాక్యంలోని నైతిక, దైవశాస్త్రీయ ఉద్వేగాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవగంభీరమైన శైలిని అనుసరించాం. దేవుని మాటకు ‘ఆయన’ వాడాం; ప్రత్యక్ష ఆరోపణ తీవ్రతను ‘నీవు చేసినదేమిటి?’ నిలుపుతుంది. పాదటిప్పణి గుర్తు [a] ప్రధాన పాఠ్యంలో సంబంధిత పదం వెంట ఉంచబడింది.
