id: GEN.4.22
reference: Genesis 4:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/צִלָּ֣ה גַם הִ֗וא יָֽלְדָה֙ אֶת תּ֣וּבַל קַ֔יִן לֹטֵ֕שׁ כָּל חֹרֵ֥שׁ נְחֹ֖שֶׁת וּ/בַרְזֶ֑ל וַֽ/אֲח֥וֹת תּֽוּבַל קַ֖יִן נַֽעֲמָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/022.yaml
  text: Zillah also bore Tubal-cain[a], a forger of every cutting tool of bronze and iron[b]. And the sister of Tubal-cain was Naamah.
translation:
  language: te
  text: సిల్లా కూడా తూబల్‌కయీనును కనింది. అతడు కంచు[a] మరియు ఇనుముతో చేసిన ప్రతి కోసే పనిముట్టును మలిచేవాడు[b]. తూబల్‌కయీనుకు సోదరి నయమా.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “కంచు” అనే పదాన్ని “రాగి” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “కంచు, ఇనుము పనిలోని ప్రతి పనివానికి పదును పెట్టేవాడు/సుత్తితో మలిచేవాడు.” తూబల్‌కయీను తర్వాత ఉన్న హీబ్రూ పదబంధం క్లిష్టమైనది; అది అతడు లోహపు పనిముట్లను మలిచేవాడని లేదా లోహపనివారితో సంబంధమున్నవాడని సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: וְצִלָּה גַם הִוא
  choice: సిల్లా కూడా
  rationale: గַם additive భావాన్ని ‘కూడా’ సహజంగా తెలియజేస్తుంది; הִואను తెలుగులో విడిగా అనువదించాల్సిన అవసరం లేదు. צִלָּהను హీబ్రూ ఉచ్చారణకు దగ్గరగా ‘సిల్లా’గా లిప్యంతరీకరించాం.
- source_word: יָלְדָה
  choice: కనింది
  rationale: వంశావళి కథనంలో ప్రసవాన్ని సంక్షిప్తంగా, సహజంగా తెలిపే ఆధునిక తెలుగు పదం.
- source_word: תּוּבַל קַיִן
  choice: తూబల్‌-కయీను
  rationale: వ్యక్తి పేరును అనువదించకుండా హీబ్రూ రూపానికి దగ్గరగా లిప్యంతరీకరించాం.
- source_word: לֹטֵשׁ כָּל חֹרֵשׁ
  choice: అన్ని రకాల కోసే పనిముట్లను తయారుచేసేవాడు
  rationale: ఈ క్లిష్టమైన పదబంధంలో לֹטֵשׁ పదును పెట్టడం, సుత్తితో మలచడం లేదా లోహాన్ని తయారుచేయడం అనే భావాలను ఇవ్వగలదు; חֹרֵשׁ పనివానిని లేదా సందర్భానుసారంగా తయారైన పనిముట్టును సూచించవచ్చు. ప్రధాన పాఠంలో సందర్భానికి సరిపోయే పనిముట్ల భావాన్ని సహజ తెలుగులో ఇచ్చి, ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: נְחֹשֶׁת
  choice: కంచు
  rationale: ప్రాచీన లోహాల జాబితాలో సాధారణంగా ‘కంచు’ సరిపోతుంది; ‘రాగి’ అనే అర్థం కూడా సాధ్యమని పాదసూచికలో తెలిపాం.
- source_word: וּבַרְזֶל
  choice: ఇనుము
  rationale: ఈ లోహపదానికి నేరమైన, ప్రామాణిక తెలుగు సమానార్థకం.
- source_word: אֲחוֹת
  choice: సోదరి
  rationale: బంధుత్వాన్ని స్పష్టంగా తెలిపే సాధారణ ఆధునిక తెలుగు పదం.
- source_word: נַעֲמָה
  choice: నయమా
  rationale: వ్యక్తి పేరును హీబ్రూ రూపానికి దగ్గరగా లిప్యంతరీకరించాం.
theological_decisions:
- issue: లోహపని గురించిన క్లిష్టమైన హీబ్రూ వాక్యనిర్మాణం
  choice: తూబల్‌-కయీను లోహపు కోసే పనిముట్లను తయారుచేసేవాడని ప్రధాన పాఠంలో ఇవ్వడం
  alternative: అతడు కంచు, ఇనుముతో పనిచేసే ప్రతి పనివానిని పదునుపెట్టేవాడు/సుత్తితో మలిచేవాడు అని అర్థం చేసుకోవడం
  rationale: ఇది సిద్ధాంత సంబంధమైన నిర్ణయం కాకపోయినా, మానవ సాంకేతిక నైపుణ్యాల ఆరంభం గురించి పాఠకుడు గ్రహించే విధానాన్ని ప్రభావితం చేయగల పాఠ్య సందిగ్ధత. అందువల్ల ఒక అర్థాన్ని ప్రధాన పాఠంలో సహజంగా ఇచ్చి, మరొకదాన్ని స్పష్టంగా నిలుపుకున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన కథన శైలిని వాడాం. పేర్లను మూల హీబ్రూ ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించాం. ప్రధాన పాఠంలో ఉన్న ప్రతి పాదసూచిక సూచికకు సరిపడే పాదసూచికను ఇచ్చాం.
