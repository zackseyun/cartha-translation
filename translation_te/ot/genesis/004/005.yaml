  yaml_path: translation/ot/genesis/004/005.yaml
  text: But for Cain and for his offering he had no regard[a]. So Cain became very angry[b], and his face fell.
translation:
  language: te
  text: కానీ కయీనునూ అతని అర్పణనూ ఆయన అనుగ్రహదృష్టితో చూడలేదు.[a] అందుచేత కయీనుకు చాలా కోపం వచ్చింది; అతని ముఖం చిన్నబోయింది.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘కయీనునూ అతని అర్పణనూ ఆయన ఆదరించలేదు.’
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా, ‘అతని ముఖం పడిపోయింది’; అంటే అతడు దిగులుగా లేదా నిరుత్సాహంగా కనిపించాడు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶל קַיִן וְאֶל מִנְחָתוֹ
  choice: కయీనును, అతని అర్పణను
  rationale: שָׁעָה అనే క్రియకు సంబంధించిన రెండింటినీ సమాంతర కర్మలుగా సహజమైన తెలుగులో చూపుతుంది. מִנְחָה ఇక్కడ దేవునికి సమర్పించిన కానుక కాబట్టి ‘అర్పణ’ సందర్భోచితం.
- source_word: לֹא שָׁעָה
  choice: అనుగ్రహంతో చూడలేదు
  rationale: ఈ సందర్భంలో క్రియ కేవలం చూడడాన్ని కాక, ఆదరణతో లేదా అనుకూలంగా చూడడాన్ని సూచిస్తుంది. దేవుడు అర్పణను ఎందుకు అంగీకరించలేదో మాత్రం ఈ అనువాదం చేర్చదు.
- source_word: וַיִּחַר לְקַיִן מְאֹד
  choice: కయీనుకు చాలా కోపం వచ్చింది
  rationale: ‘మండుట’ అనే హీబ్రూ భావచిత్రాన్ని పదశః బదిలీ చేయకుండా, తీవ్ర కోపాన్ని ఆధునిక సహజ తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: וַיִּפְּלוּ פָּנָיו
  choice: అతని ముఖం వాడిపోయింది
  rationale: ముఖం ‘పడింది’ అనే హీబ్రూ నుడికారానికి పదశః కాకుండా, నిరుత్సాహం లేదా మ్లానత ముఖంలో కనిపించిందనే భావాన్ని సహజమైన తెలుగు నుడికారంతో అందిస్తుంది.
theological_decisions:
- issue: కయీను అర్పణ పట్ల దేవుని స్పందన స్వభావం
  choice: ‘అనుగ్రహంతో చూడలేదు’ అని అనువదించడం
  alternative: ‘అంగీకరించలేదు’ లేదా ‘పట్టించుకోలేదు’
  rationale: మూలంలోని שָׁעָה అనుకూల దృష్టి లేదా ఆదరణను సూచిస్తుంది; అయితే ఈ వచనం దానికి కారణాన్ని చెప్పదు. ‘అంగీకరించలేదు’ ఫలితాన్ని మరింత స్పష్టీకరిస్తుంది; ‘పట్టించుకోలేదు’ నిర్లక్ష్య భావాన్ని అధికంగా కలిగించవచ్చు. ఎంచుకున్న రూపం మూలంలోని నియంత్రిత వ్యాఖ్యను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవభరితమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ‘అనుగ్రహంతో చూడలేదు’ దేవుని అనుకూల దృష్టి లేకపోవడాన్ని తెలియజేస్తూ, తిరస్కరణకు కారణాన్ని ఊహించదు. ప్రధాన పాఠ్యంలో రెండు పాదసూచిక గుర్తులూ చేర్చబడ్డాయి.
