source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר יְהוָ֖ה אֶל קָ֑יִן לָ֚/מָּה חָ֣רָה לָ֔/ךְ וְ/לָ֖/מָּה נָפְל֥וּ פָנֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/006.yaml
  text: Then Yahweh said to Cain[a], “Why are you angry, and why has your face fallen?”
translation:
  language: te
  text: 'అప్పుడు యెహోవా కయీనుతో ఇలా అన్నాడు: “నీకెందుకు కోపం వచ్చింది? నీ ముఖం ఎందుకు దిగులుగా ఉంది?[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “నీ ముఖం ఎందుకు పడిపోయింది?”
    reason: హీబ్రూ నుడికారపు వాచ్యరూపాన్ని తెలియజేయడానికి; ప్రధాన పాఠంలోని “దిగులుగా ఉంది” సందర్భానుసారమైన సహజ తెలుగు భావానువాదం.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... అడిగాడు
  rationale: వావ్-కన్సిక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది; ప్రశ్నలతో కూడిన ప్రత్యక్ష సంభాషణ కావడంతో తెలుగులో ‘అప్పుడు ... అడిగాడు’ సహజంగా ఉంటుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో స్థిరపడిన లిప్యంతరీకరణతో వ్యక్తిగత నామంగా అందించింది.
- source_word: אֶל קָיִן
  choice: కయీనుతో
  rationale: మాట్లాడే సందర్భంలోని ‘ఎల్’ను తెలుగులో సహజమైన సహచర్య విభక్తి ‘తో’ ద్వారా వ్యక్తం చేసింది; קָיִןను ‘కయీను’గా లిప్యంతరీకరించింది.
- source_word: לָמָּה חָרָה לָךְ
  choice: నీకెందుకు కోపం వచ్చింది?
  rationale: హీబ్రూ వాచ్యార్థంలో ‘నీకు ఎందుకు మండింది?’ అనే కోపసంబంధ నుడికారం ఉంది. దాని భావాన్ని ఆధునిక తెలుగులో సహజంగా తెలిపింది.
- source_word: וְלָמָּה נָפְלוּ פָנֶיךָ
  choice: నీ ముఖం ఎందుకు వాడిపోయింది?
  rationale: ‘నీ ముఖం ఎందుకు పడిపోయింది?’ అనే హీబ్రూ రూపకానికి తెలుగులో సహజమైన సమీప నుడికారాన్ని ఎంచుకుంది; వాచ్యరూపాన్ని పాదసూచికలో నిలిపింది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో బిరుదు కాకుండా దైవనామమే ఉంది. దానిని ‘ప్రభువు’గా మార్చకుండా, సాధారణ తెలుగు పాఠకులకు సుపరిచితమైన ‘యెహోవా’ అనే నామరూపంతో నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథనశైలి. హీబ్రూ కోప నుడికారాన్ని భావానుసారంగా, ముఖం ‘పడిపోవడం’ అనే రూపకాన్ని సహజ తెలుగు ప్రధాన పాఠంతో పాటు పాదసూచికలో వాచ్యంగా అందించింది.
