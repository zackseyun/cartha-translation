  yaml_path: translation/ot/genesis/004/003.yaml
  text: And in the course of time[c][b][a], Cain brought to Yahweh an offering from the fruit of the ground.
translation:
  language: te
  text: కొంతకాలం గడిచిన తరువాత[a], కయీను నేల దిగుబడిలో కొంతను[b] యాహ్వేకు[c] అర్పణగా తీసుకొచ్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “దినాల అంతం నుండి”; అంటే, కొంతకాలం గడిచిన తరువాత.
    reason: lexical_alternative
  - marker: b
    text: 'లేదా, “నేల ఫలంలో కొంత”; భావం: నేల దిగుబడిలో లేదా పంటలో కొంత.'
    reason: lexical_alternative
  - marker: c
    text: 'హీబ్రూ: יהוה (YHWH), ఇక్కడ “యాహ్వే” అని ధ్వన్యంతరీకరించబడింది; “యెహోవా” మరో లిప్యంతరీకరణ. కొన్ని అనువాదాలు ఈ దైవనామాన్ని “ప్రభువు” అని సూచిస్తాయి.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: గడిచిన తరువాత
  rationale: హీబ్రూ కథన క్రమాన్ని తెలుగులో సహజంగా తెలియజేయడానికి, తరువాతి కాలవాక్యంతో కలిపి అనువదించబడింది.
- source_word: מִקֵּץ יָמִים
  choice: కొంతకాలం గడిచిన తరువాత
  rationale: అక్షరార్థంగా ‘దినాల ముగింపునుండి’ అనే భావం ఉన్నా, సందర్భంలో ఇది కొంత సమయం గడిచిన తరువాత అని సూచించే కాలవ్యవహారం; అంత్యకాల భావాన్ని దిగుమతి చేయదు.
- source_word: וַיָּבֵא
  choice: తీసుకొచ్చాడు
  rationale: בוא యొక్క హిఫీల్ రూపం ఇక్కడ ఒక వస్తువును తీసుకురావడం లేదా సమర్పించడం అనే అర్థం ఇస్తుంది; ‘తీసుకొచ్చాడు’ మూలక్రియను సహజంగా నిలుపుతుంది.
- source_word: קַיִן
  choice: కయీను
  rationale: తెలుగు బైబిలు వాడుకలో గుర్తించదగిన వ్యక్తినామ రూపం.
- source_word: מִפְּרִי הָאֲדָמָה
  choice: నేల పంటలో కొంత
  rationale: פְּרִי ఇక్కడ వ్యవసాయ దిగుబడి లేదా పంటను, אֲדָמָה సాగుచేసే నేలను సూచిస్తాయి. מן భాగార్థంగా ఉండగలందున ‘లో కొంత’ అని సహజంగా వ్యక్తీకరించబడింది.
- source_word: מִנְחָה
  choice: అర్పణగా
  rationale: ఈ ఆరాధనా సందర్భంలో מִנְחָה అనేది కానుక లేదా సమర్పణ; దాని ప్రత్యేక రకాన్ని అనవసరంగా నిర్దేశించకుండా ‘అర్పణ’ అని ఇవ్వబడింది.
- source_word: לַיהוָה
  choice: యాహ్వేకు
  rationale: మూలంలోని יהוה అనే వ్యక్తిగత దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగు లిపిలో ధ్వన్యంతరీకరించింది.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: వచనంలో చతురక్షర దైవనామమే ప్రత్యక్షంగా ఉంది. దాని వ్యక్తిగత నామ స్వభావాన్ని కాపాడటానికి ‘యాహ్వే’ అని ధ్వన్యంతరీకరించబడింది; ఇతర ప్రాచుర్య రూపాలను పాదటిప్పణిలో సూచించాం.
- issue: מִקֵּץ יָמִים యొక్క కాలార్థం
  choice: కొంతకాలం గడిచిన తరువాత
  alternative: దినాల ముగింపులో
  rationale: ఇక్కడి కథన సందర్భం గడిచిన కాలాన్ని సూచిస్తుంది, అంత్యకాలాన్ని కాదు. అందువల్ల సహజ కాలార్థాన్ని ప్రధాన పాఠ్యంలో ఇచ్చి, అక్షరార్థాన్ని పాదటిప్పణిలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘నేల పంట’ సాధారణ పాఠకునికి స్పష్టంగా ఉండి, కయీను సాగుచేసిన אֲדָמָהతో పదసంబంధాన్ని కాపాడుతుంది. అన్ని పాదటిప్పణి సూచికలు ప్రధాన పాఠ్యంలో ఉన్నాయి.
