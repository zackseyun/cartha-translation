  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר לֶ֜מֶךְ לְ/נָשָׁ֗י/ו עָדָ֤ה וְ/צִלָּה֙ שְׁמַ֣עַן קוֹלִ֔/י נְשֵׁ֣י לֶ֔מֶךְ הַאְזֵ֖נָּה אִמְרָתִ֑/י כִּ֣י אִ֤ישׁ הָרַ֨גְתִּי֙ לְ/פִצְעִ֔/י וְ/יֶ֖לֶד לְ/חַבֻּרָתִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/023.yaml
  text: 'And Lamech said to his wives[a], “Adah and Zillah, hear my voice; wives of Lamech, listen to my word: for I have killed a man for wounding me[b], even a young man for striking me.”'
translation:
  language: te
  text: 'లెమెకు తన భార్యలకు[a] ఇలా అన్నాడు:


    “ఆదా, సిల్లా, నా స్వరం వినండి;

    లెమెకు భార్యలారా, నా మాట ఆలకించండి.


    నన్ను గాయపరచినందుకు ఒక మనిషిని చంపాను[b];

    నన్ను కొట్టినందుకు ఒక యువకుణ్ణి చంపాను.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, ‘తన స్త్రీలకు’; ఈ సందర్భంలో ‘తన భార్యలకు’ అనే అర్థం.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘నా గాయానికి ఒక మనిషిని, నా దెబ్బకు ఒక యువకుణ్ణి చంపాను.’ లెమెకు మాటలను జరిగిన హత్య నివేదికగా కాక, బెదిరింపుగా లేదా సాధారణ గొప్పచెప్పుగా—‘చంపుతాను’—కొందరు అర్థం చేసుకుంటారు.
    reason: alternative_reading
lexical_decisions:
- source_word: לְנָשָׁיו
  choice: తన భార్యలతో
  rationale: సందర్భంలో బహువచన రూపం లెమెకు భార్యలనే స్పష్టంగా సూచిస్తుంది; ఆధునిక తెలుగులో సహజమైన సంభాషణారంభానికి ‘తో’ అనుకూలం.
- source_word: שְׁמַעַן קוֹלִי
  choice: నా స్వరం వినండి
  rationale: ‘స్వరం’ అనే స్పష్టమైన హీబ్రూ రూపకల్పనను నిలుపుతూ, స్త్రీల బహువచన ఆజ్ఞను తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: הַאְזֵנָּה אִמְרָתִי
  choice: నా మాట ఆలకించండి
  rationale: మొదటి ఆజ్ఞతో ఉన్న కవితాత్మక సమాంతరాన్ని నిలుపుతూ, శ్రద్ధగా వినాలనే భావాన్ని ‘ఆలకించండి’ తెలియజేస్తుంది.
- source_word: הָרַגְתִּי
  choice: చంపాను
  rationale: హీబ్రూ కతల్ రూపానికి అత్యంత సహజమైన సూటి గతకాల నివేదిక; జరిగిన హత్యగా చదివే ప్రధాన భావాన్ని ఇస్తుంది.
- source_word: לְפִצְעִי
  choice: నన్ను గాయపరచినందుకు
  rationale: అక్షరార్థ నామవాచక నిర్మాణం ‘నా గాయానికి’ అయినప్పటికీ, לְ సంబంధాన్ని ప్రతీకారానికి కారణం లేదా సందర్భంగా తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: אִישׁ
  choice: ఒక మనిషిని
  rationale: సాధారణ ‘man’ భావాన్ని అందిస్తూ, తరువాతి ‘యువకుడు’తో ఉన్న వయస్సు/స్థితి వ్యత్యాసాన్ని కాపాడుతుంది.
- source_word: יֶלֶד
  choice: ఒక యువకుణ్ణి
  rationale: ఇక్కడ ‘పిల్లవాడు’ అని అనవసరంగా చిన్న వయస్సును నిర్ధారించకుండా, אִישׁతో సమాంతరంగా చిన్నవయస్కుడైన పురుషుణ్ణి సూచిస్తుంది.
- source_word: לְחַבֻּרָתִי
  choice: నన్ను కొట్టినందుకు
  rationale: ‘దెబ్బ/చార/గాయం’ అనే నామవాచక భావాన్ని సందర్భానుగుణ క్రియాత్మక తెలుగుగా అందించి, మొదటి పాదంలోని ‘గాయపరచడం’తో స్వల్ప భేదాన్ని ఉంచుతుంది.
theological_decisions:
- issue: లెమెకు మాటలు జరిగిన హత్య నివేదికా, బెదిరింపా లేదా సాధారణ అతిశయోక్తా?
  choice: ప్రధాన పాఠంలో ‘చంపాను’ అని జరిగిన చర్యగా అనువదించడం
  alternative: ‘చంపుతాను’ లేదా ‘చంపేవాణ్ణి’ అని బెదిరింపు/సాధారణ గొప్పచెప్పుగా చదవడం
  rationale: הָרַגְתִּי అనే కతల్ రూపం అత్యంత సహజంగా పూర్తయిన చర్యను సూచిస్తుంది; అయితే ఇతర పఠనసాధ్యతను పాదటిప్పణిలో ఉంచడం అసలు పాఠంలోని ఉద్రిక్తతను కాపాడుతుంది.
- issue: ఈ హత్య ప్రతీకారమా లేక ఆత్మరక్షణా?
  choice: ‘నన్ను గాయపరచినందుకు… నన్ను కొట్టినందుకు’ అని కారణం/సందర్భాన్ని మాత్రమే తెలపడం
  alternative: ‘ఆత్మరక్షణలో’ లేదా ‘అతడు నాపై దాడి చేసినప్పుడు’ అని నైతిక సమర్థన జోడించడం
  rationale: హీబ్రూ పాఠం గాయానికి ప్రతిగా చంపినట్లు చెప్పగలదు గాని ఆత్మరక్షణను స్పష్టంగా నిర్ధారించదు; అందువల్ల నైతిక తీర్పును అనువాదంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కవితాత్మక గద్యరూపం. ‘వినండి/ఆలకించండి’ సమాంతరతను, ‘మనిషి/యువకుడు’ వ్యత్యాసాన్ని నిలిపింది. ప్రధాన పాఠంలో సహజత్వం కోసం గాయం, దెబ్బ నామవాచకాలను క్రియాత్మకంగా ఇచ్చి, అక్షరార్థ నిర్మాణాన్ని పాదటిప్పణిలో భద్రపరిచింది.
