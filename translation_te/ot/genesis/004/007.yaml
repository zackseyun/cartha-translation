  to: నీవు మంచి చేస్తే, నీకు అంగీకారం లభించదా?[a] కానీ నీవు మంచి చేయకపోతే, పాపం[b] తలుపు దగ్గర పొంచి ఉంది. దాని కోరిక నీ వైపే ఉంది;[c] అయితే నీవు దానిని ఏలాలి.[d]
