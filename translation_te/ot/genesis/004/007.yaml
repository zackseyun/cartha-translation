  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: הֲ/ל֤וֹא אִם תֵּיטִיב֙ שְׂאֵ֔ת וְ/אִם֙ לֹ֣א תֵיטִ֔יב לַ/פֶּ֖תַח חַטָּ֣את רֹבֵ֑ץ וְ/אֵלֶ֨י/ךָ֙ תְּשׁ֣וּקָת֔/וֹ וְ/אַתָּ֖ה תִּמְשָׁל בּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/007.yaml
  text: If you do well[a], will there not be acceptance? But if you do not do well, sin is crouching at the door; its desire is for you[d][c][b], but you must rule over it.
translation:
  language: te
  text: నీవు మంచి చేస్తే, నీకు అంగీకారం లభించదా?[a] కానీ నీవు మంచి చేయకపోతే, పాపం[b] తలుపు దగ్గర పొంచి ఉంది. దాని కోరిక నీ వైపే ఉంది;[c] అయితే నీవు దానిని ఏలాలి.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా ‘పైకి ఎత్తడం.’ ఇది కయీను ముఖం పైకెత్తబడటాన్ని లేదా అతడు అంగీకారం పొందటాన్ని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘పాపపరిహార బలి తలుపు దగ్గర పడి ఉంది’ అని కూడా అనువదించవచ్చు. అయితే తక్షణ సందర్భంలోని దృశ్యం, పొంచి ఉన్న జంతువులా పాపాన్ని వ్యక్తీకరించడానికే మరింత సహజంగా సరిపోతుంది.
    reason: alternative_reading
  - marker: c
    text: ‘దాని వాంఛ’ లేదా ‘దాని ఆకాంక్ష’ అని కూడా అనువదించవచ్చు. ఆదికాండం 3:16లోని సమాన పదప్రయోగాన్ని పోల్చండి.
    reason: cross_reference
  - marker: d
    text: ‘నీవు దానిని ఏలుతావు’ లేదా ‘నీవు దానిని ఏలగలవు’ అని కూడా అనువదించవచ్చు. హీబ్రూ వాక్యం ప్రబోధం, భవిష్యద్వాణి లేదా సాధ్యత అనే భావాల్లో చదవడానికి వీలిస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: תֵּיטִיב
  choice: మంచి చేస్తే / మంచి చేయకపోతే
  rationale: יטב ధాతువు హిఫీల్ రూపం ఇక్కడ కేవలం క్షేమంగా ఉండడాన్ని కాక, మంచిగా లేదా సరిగ్గా ప్రవర్తించడాన్ని సూచిస్తుంది. సరళమైన షరతు నిర్మాణాన్ని నిలుపుతూ నైతిక భావాన్ని తెలియజేయడానికి ఈ రూపం ఎంచుకున్నాం.
- source_word: שְׂאֵת
  choice: అంగీకారం లభించదా?
  rationale: ఈ పదానికి అక్షరార్థంగా ‘పైకి ఎత్తడం’ అనే భావం ఉంది. సందర్భంలో కయీను ముఖం పైకెత్తబడటం లేదా దేవుని అంగీకారం పొందటం అనే సంక్షిప్త నుడికార భావం ఉండవచ్చు. ఆధునిక తెలుగు పాఠకునికి ప్రధాన భావం స్పష్టంగా ఉండేందుకు ‘అంగీకారం లభించడం’ అని అనువదించాం; అక్షరార్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: לַפֶּתַח
  choice: తలుపు దగ్గర
  rationale: ఇది ప్రవేశద్వారం లేదా గడప వద్ద ఉన్నదనే ప్రత్యక్ష స్థానార్థక పదబంధం. ముప్పు అతి సమీపంలో ఉందనే దృశ్యాన్ని ‘తలుపు దగ్గర’ సహజంగా తెలియజేస్తుంది.
- source_word: חַטָּאת
  choice: పాపం
  rationale: חטאת అనే పదం ‘పాపం’ లేదా ‘పాపపరిహార బలి’ అని అర్థమివ్వగలదు. అయితే ‘పొంచి ఉంది’ అనే జంతు రూపకం ఇక్కడ పాపాన్ని వ్యక్తీకరించిన ముప్పుగా అర్థం చేసుకోవడానికి బలమైన సందర్భ ఆధారాన్ని ఇస్తుంది. మరో అర్థాన్ని పాదసూచికలో భద్రపరిచాం.
- source_word: רֹבֵץ
  choice: పొంచి ఉంది
  rationale: ఈ కృదంతం జంతువు వంగి పడుకుని దాడికి సిద్ధంగా ఉండే దృశ్యాన్ని సూచించగలదు. తెలుగు ‘పొంచి ఉంది’ ఆ సమీప, నిరంతర ముప్పును సహజంగా వ్యక్తం చేస్తుంది.
- source_word: תְּשׁוּקָתוֹ
  choice: దాని కోరిక
  rationale: תשוקה కోరిక, వాంఛ లేదా ఆకాంక్షను సూచిస్తుంది. ‘పాపం’నే పూర్వపదంగా తీసుకుని ‘దాని’ అని వాడాం. ఆదికాండం 3:16లోని సమాన పదప్రయోగంతో ఉన్న అనుసంధానాన్ని అతిగా వ్యాఖ్యానించకుండా ‘కోరిక’ నిలుపుతుంది.
- source_word: תִּמְשָׁל בּוֹ
  choice: నీవు దానిని ఏలాలి
  rationale: హీబ్రూ అసంపూర్ణ క్రియారూపం ఆజ్ఞాత్మక ప్రబోధం, భవిష్యద్వాణి లేదా సామర్థ్యాన్ని సూచించవచ్చు. దేవుడు కయీనును హెచ్చరిస్తున్న సందర్భంలో ‘ఏలాలి’ ప్రబోధాత్మక బలాన్ని సహజంగా తెలియజేస్తుంది; ఇతర అవకాశాలను పాదసూచికలో ఇచ్చాం.
theological_decisions:
- issue: కయీను పాపాన్ని ఏలుతాడని వాగ్దానం చేస్తున్నదా, ఏలమని ఆదేశిస్తున్నదా, లేక ఏలగల సామర్థ్యం ఉందని చెబుతున్నదా?
  choice: ప్రధాన పాఠంలో ‘నీవు దానిని ఏలాలి’ అనే ప్రబోధాత్మక అర్థం.
  alternative: ‘నీవు దానిని ఏలుతావు’ లేదా ‘నీవు దానిని ఏలగలవు.’
  rationale: תמשל అనే హీబ్రూ అసంపూర్ణ రూపం ఈ మూడు భావ ఛాయలకు అవకాశం ఇస్తుంది. సందర్భం హెచ్చరికతో కూడిన ఉపదేశం కాబట్టి ప్రధాన పాఠంలో కర్తవ్య భావాన్ని ఎంచుకున్నాం. అయితే ఇది తప్పనిసరిగా నెరవేరే వాగ్దానమని గానీ, మానవ సామర్థ్యంపై విస్తృత సిద్ధాంత ప్రకటన అని గానీ తేల్చకుండా అసలు వాక్యంలోని దైవశాస్త్ర ఉద్రిక్తతను పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకునికి అర్థమయ్యేలా, అయినా గంభీరతను నిలుపుతూ అనువదించాం. ‘పొంచి ఉంది’ అనే ప్రయోగం పాపాన్ని దాడికి సిద్ధంగా ఉన్న జంతువుగా చూపే మూల రూపకాన్ని సజీవంగా ఉంచుతుంది. ‘ఏలాలి’ అనే పదం అధికారంతో అదుపుచేయాలనే భావాన్ని ఇస్తుంది; ఏ ప్రత్యేక మతశాఖ సిద్ధాంతాన్నీ పాఠ్యంలో చేర్చలేదు.
