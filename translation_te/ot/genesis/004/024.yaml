source:
  edition: WLC
  text: כִּ֥י שִׁבְעָתַ֖יִם יֻקַּם קָ֑יִן וְ/לֶ֖מֶךְ שִׁבְעִ֥ים וְ/שִׁבְעָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/024.yaml
  text: For Cain is avenged sevenfold[b][a], and Lamech seventy-sevenfold.
translation:
  language: te
  text: ఎందుకంటే కయీనుకు ఏడు రెట్లుగా ప్రతీకారం తీర్చబడుతుంది; లెమెకుకు డెబ్బై ఏడు రెట్లుగా ప్రతీకారం తీర్చబడుతుంది.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ క్రియను సామెతసదృశ నిశ్చయతగా లేదా నిశ్చిత భవిష్యత్ భావంగా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా ‘డెబ్బై మరియు ఏడు’; అంటే ‘డెబ్బై ఏడు రెట్లుగా.’ ‘డెబ్బై ఏడు సార్లు’ అని కూడా అనువదించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి వచనంలోని లెమెకు ప్రగల్భానికి కారణాన్ని పరిచయం చేసే అనుసంధాన పదంగా సహజమైన తెలుగులో ‘ఎందుకంటే’ సరిపోతుంది.
- source_word: שִׁבְעָתַיִם
  choice: ఏడంతలుగా
  rationale: ప్రతీకారం యొక్క ఏడు రెట్ల పరిమాణాన్ని సూచించే క్రియావిశేషణ భావాన్ని, రెండో పాదంలోని సంఖ్యతో సమాంతరంగా నిలుపుతుంది.
- source_word: יֻקַּם
  choice: ప్రతీకారం తీర్చబడితే / ప్రతీకారం తీర్చబడుతుంది
  rationale: נקם ధాతువు హోఫల్ రూపంలోని కర్మణి భావాన్ని నిలుపుతూ, మొదటి పాదాన్ని పోలికకు పునాదిగా మరియు రెండో పాదాన్ని నిశ్చయమైన ప్రకటనగా సహజ తెలుగులో వ్యక్తం చేస్తుంది; హీబ్రూ అసంపూర్ణ క్రియకు వర్తమానసదృశ లేదా నిశ్చిత భవిష్యత్ భావం ఉండవచ్చు.
- source_word: קָיִן
  choice: కయీను
  rationale: వ్యక్తి పేరును ప్రామాణిక తెలుగు బైబిలు రూపానికి సమీపంగా లిప్యంతరీకరించింది.
- source_word: וְלֶמֶךְ
  choice: లెమెకు కోసం
  rationale: సంయోజక సంబంధాన్ని తెలుగు వాక్య నిర్మాణంలో నిలుపుతూ, కయీనుతో లెమెకును పోల్చే భావాన్ని స్పష్టం చేస్తుంది.
- source_word: שִׁבְעִים וְשִׁבְעָה
  choice: డెబ్బై ఏడంతలుగా
  rationale: అక్షరార్థంగా ‘డెబ్బై మరియు ఏడు’ అనే సంఖ్యను డెబ్బై ఏడు రెట్లుగా అందించి, ‘ఏడంతలుగా’తో ఉన్న కవితాత్మక సమాంతరతను కాపాడుతుంది.
theological_decisions:
- issue: లెమెకు ప్రతీకార సంఖ్య యొక్క అర్థం
  choice: డెబ్బై ఏడంతలుగా
  alternative: డెబ్బై సార్లు ఏడంతలుగా; డెబ్బై ఏడు సార్లు
  rationale: హీబ్రూ שִׁבְעִים וְשִׁבְעָה సహజంగా ‘డెబ్బై ఏడు’ అని అర్థమవుతుంది. ‘డెబ్బై సార్లు ఏడు’ అనే తరువాతి సంప్రదాయ పఠనాన్ని ఆదికాండపు పాఠ్యంలోకి దిగుమతి చేయకుండా, మొదటి పాదంతో కవితాత్మక సమాంతరతను నిలుపుతుంది.
- issue: יֻקַּם క్రియ యొక్క కాలభావం
  choice: నిశ్చిత భవిష్యత్ భావంతో ‘ప్రతీకారం తీర్చబడుతుంది’
  alternative: సామెతసదృశ వర్తమానంగా ‘ప్రతీకారం తీర్చబడుతుంది/తీర్చబడుతోంది’
  rationale: హీబ్రూ అసంపూర్ణ రూపం సందర్భంలో నిశ్చయంగా సంభవించే భవిష్యత్ ప్రతీకారాన్ని లేదా సాధారణ నిశ్చితత్వాన్ని సూచించగలదు; ప్రధాన పాఠ్యం నిశ్చిత భవిష్యత్‌ను సహజంగా అందిస్తుండగా, ప్రత్యామ్నాయ కాలభావాన్ని పాదటిప్పణిలో ఉంచింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కవితాత్మక ధోరణిని ఉంచింది. ‘ప్రతీకారం తీర్చబడుతుంది’ అనే కర్మణి రూపం మూలంలోని హోఫల్ కర్మణిని కాపాడుతుంది. రెండు పాదాల పెరుగుతున్న సంఖ్యాబలాన్ని ‘ఏడంతలుగా—డెబ్బై ఏడంతలుగా’ అనే సమాంతర నిర్మాణంతో వ్యక్తం చేసింది.
