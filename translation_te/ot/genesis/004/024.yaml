    text: హీబ్రూ క్రియను సామెతసదృశ నిశ్చయతగా లేదా నిశ్చిత భవిష్యత్ భావంగా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా ‘డెబ్బై మరియు ఏడు’; అంటే ‘డెబ్బై ఏడు రెట్లుగా.’ ‘డెబ్బై ఏడు సార్లు’ అని కూడా అనువదించవచ్చు.
    reason: alternative_reading
  revision_rationale: The revision removes the unsupported conditional, restores the assertive parallelism of the Hebrew, and uses idiomatic Telugu ‘ఏడు రెట్లుగా—డెబ్బై ఏడు రెట్లుగా.’ It preserves the passive wording, the ambiguity of the imperfect’s temporal force, and the source-supported seventy-seven reading without importing ‘seventy times seven.’
