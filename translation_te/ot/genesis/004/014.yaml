source:
  edition: WLC
  text: הֵן֩ גֵּרַ֨שְׁתָּ אֹתִ֜/י הַ/יּ֗וֹם מֵ/עַל֙ פְּנֵ֣י הָֽ/אֲדָמָ֔ה וּ/מִ/פָּנֶ֖י/ךָ אֶסָּתֵ֑ר וְ/הָיִ֜יתִי נָ֤ע וָ/נָד֙ בָּ/אָ֔רֶץ וְ/הָיָ֥ה כָל מֹצְאִ֖/י יַֽהַרְגֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/014.yaml
  text: Look[a], today you have driven me away from the face of the ground, and I will be hidden from your face. I will be a wanderer and a fugitive on the earth[b], and whoever finds me will kill me.
translation:
  language: te
  text: “ఇదిగో, నేడు నీవు నేల ఉపరితలం నుండి నన్ను వెళ్లగొట్టావు. నీ ముఖానికి నేను కనబడకుండా ఉంటాను[a]. నేను భూమి మీద[b] సంచారిగా, పారిపోయినవాడిగా ఉంటాను. నన్ను కనుగొనేవాడెవడైనా నన్ను చంపుతాడు.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీ సన్నిధి నుండి నేను దాగి ఉంటాను”; లేదా, “నీ సన్నిధిలో కనిపించకుండా ఉంటాను.” హీబ్రూలో అక్షరార్థంగా “నీ ముఖం నుండి” అని ఉంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “దేశంలో” లేదా “ప్రాంతంలో.” హీబ్రూ אֶרֶץ సందర్భానుసారం “భూమి,” “దేశం,” లేదా “ప్రాంతం” అని అర్థం కావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: ఇదిగో
  rationale: మాటపై దృష్టి నిలిపి, దానికి బలం చేకూర్చే హీబ్రూ సంభాషణ కణాన్ని ఆధునికమైనప్పటికీ గంభీరమైన తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: גֵּרַשְׁתָּ
  choice: నన్ను వెళ్లగొట్టావు
  rationale: బలవంతంగా పంపివేయడం లేదా బహిష్కరించడం అనే క్రియ బలాన్ని స్పష్టమైన సాధారణ తెలుగులో నిలుపుతుంది.
- source_word: מֵעַל פְּנֵי הָאֲדָמָה
  choice: నేల ముఖం మీదనుంచి
  rationale: ‘నేల ఉపరితలం మీదనుంచి’ అనే భావంతో పాటు మూలంలోని ‘ముఖం’ రూపకాన్ని, ఆదికాండము 4లో కయీనుకు నేలతో ఉన్న సంబంధాన్ని నిలుపుతుంది.
- source_word: וּמִפָּנֶיךָ אֶסָּתֵר
  choice: నీ ముఖానికి కనబడకుండా ఉంటాను
  rationale: నిఫల్ రూపంలోని కర్మణి/ఆత్మార్థక అస్పష్టతను పూర్తిగా ఒకే దిశలో తీర్చకుండా, ‘నీ ముఖం నుండి’ అనే హీబ్రూ సన్నిధి-నుడికారాన్ని తెలుగులో అర్థమయ్యే విధంగా నిలుపుతుంది.
- source_word: נָע וָנָד
  choice: సంచారిగా, నిలకడలేని వాడిగా
  rationale: స్థిర నివాసం లేక తిరగడం, చెదరిపోయిన జీవితం గడపడం అనే జతపదాల భావాన్ని రెండు వర్ణనలుగా నిలుపుతుంది; ‘పారిపోయినవాడు’ అని మాత్రమే అనువదించి భావాన్ని సంకుచితం చేయదు.
- source_word: בָּאָרֶץ
  choice: భూమి మీద
  rationale: ప్రాథమిక కథనపు విస్తృత సందర్భంలో אֶרֶץకు ‘భూమి’ సరిపోతుంది; ‘దేశంలో/ప్రాంతంలో’ అనే సాధ్యమైన పరిమిత భావాన్ని పాదసూచికలో ఉంచింది.
- source_word: כָל מֹצְאִי
  choice: నన్ను కనుగొనేవాడెవడైనా
  rationale: כָלతో కూడిన కృదంత నిర్మాణంలోని అనిర్దిష్ట సార్వత్రిక భావాన్ని సహజమైన తెలుగు రూపంలో వ్యక్తం చేస్తుంది.
- source_word: יַהַרְגֵנִי
  choice: నన్ను చంపుతాడు
  rationale: హత్య చేయడం అనే సాధారణ క్రియార్థాన్ని అలంకారికత లేకుండా స్పష్టమైన ఆధునిక తెలుగులో ఇస్తుంది.
theological_decisions:
- issue: וּמִפָּנֶיךָ אֶסָּתֵרలో దేవుని ముఖం/సన్నిధిని సూచించే నుడికారం మరియు నిఫల్ రూపపు అస్పష్టత
  choice: నీ ముఖానికి కనబడకుండా ఉంటాను
  alternative: నీ సన్నిధి నుండి దాక్కుంటాను / నీ సన్నిధికి కనబడకుండా ఉంటాను
  rationale: మూలంలోని ‘నీ ముఖం’ అనే స్పష్ట రూపకాన్ని నిలుపుతూ, కయీను తానే దాక్కుంటాడా లేక దేవుని ముఖానికి కనబడకుండా ఉంటాడా అనే కర్మణి/ఆత్మార్థక ఉద్రిక్తతను ప్రధాన పాఠంలో అతిగా పరిష్కరించదు. ‘సన్నిధి’ అనే భావానువాదాలు పాదసూచికలో ఇవ్వబడ్డాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన కథన శైలి. ‘నేల ముఖం,’ ‘నీ ముఖం’ అనే మూల రూపకాలను ఉద్దేశపూర్వకంగా నిలిపి, అవసరమైన చోట పాదసూచికలతో సహజ భావాన్ని వివరించింది.
