source:
  edition: WLC
  text: וְ/הָ֣/אָדָ֔ם יָדַ֖ע אֶת חַוָּ֣ה אִשְׁתּ֑/וֹ וַ/תַּ֨הַר֙ וַ/תֵּ֣לֶד אֶת קַ֔יִן וַ/תֹּ֕אמֶר קָנִ֥יתִי אִ֖ישׁ אֶת יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/001.yaml
  text: And Adam knew Eve his wife[a]; and she conceived and bore Cain, and said[b], “I have acquired a man from Yahweh.”
translation:
  language: te
  text: ఆదాము తన భార్య హవ్వతో శారీరక సంబంధం కలిగాడు; ఆమె గర్భం దాల్చి కయీనుకు జన్మనిచ్చింది. అప్పుడు ఆమె, “యాహ్వే నుండి[a] నేను ఒక పురుషుణ్ణి సంపాదించుకున్నాను[b]” అని చెప్పింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హిబ్రూలో అక్షరార్థంగా, “యాహ్వేతో ఒక పురుషుణ్ణి సంపాదించుకున్నాను.” దీనిని “యాహ్వే నుండి” లేదా “యాహ్వే సహాయంతో” అని కూడా అర్థం చేసుకోవచ్చు; “ఒక పురుషుణ్ణి—అంటే యాహ్వేను—సంపాదించుకున్నాను” అనే పఠనం కూడా సాధ్యమే అయినా తక్కువ సంభావ్యమైనది. ప్రధాన పాఠం కయీను పుట్టుకకు యాహ్వే మూలమని హవ్వ అంగీకరించినట్లు గ్రహిస్తుంది.
    reason: alternative_reading
  - marker: b
    text: ‘కయీను’ అనే హిబ్రూ పేరు ‘సంపాదించు’ లేదా ‘పొందు’ అనే అర్థమిచ్చే קָנִיתִי (ఖానీతి) అనే క్రియతో శబ్దసామ్యం కలిగి ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָאָדָם
  choice: ఆదాము
  rationale: ఈ సందర్భంలో הָאָדָם సాధారణంగా మానవజాతిని కాక, ఇంతకు ముందు పరిచయమైన ఆదామునే సూచిస్తుంది. వాక్యారంభంలోని וְ భావాన్ని తెలుగు కథన ప్రవాహంలో తరువాతి వాక్యాల అనుసంధానం ద్వారా సహజంగా వ్యక్తం చేశాం.
- source_word: יָדַע
  choice: తన భార్య హవ్వతో కలిశాడు
  rationale: మూలంలోని ‘తెలుసుకొన్నాడు’ అనే సౌమ్యోక్తి ఇక్కడ లైంగిక సంబంధాన్ని సూచిస్తుంది. తెలుగు పాఠకులకు అర్థమయ్యేలా, గౌరవప్రదంగా ‘కలిశాడు’ అని అనువదించాం.
- source_word: אֶת חַוָּה אִשְׁתּוֹ
  choice: తన భార్య హవ్వతో
  rationale: హవ్వ పేరు, ఆమె భార్య అనే సంబంధం రెండింటినీ సహజమైన తెలుగు పదక్రమంలో నిలిపాం.
- source_word: וַתַּהַר
  choice: ఆమె గర్భం దాల్చి
  rationale: హిబ్రూ జనన కథనాల్లోని ‘గర్భవతి అయింది’ అనే భావానికి ఇది సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: וַתֵּלֶד אֶת קַיִן
  choice: కయీనుకు జన్మనిచ్చింది
  rationale: కయీను పుట్టుకను సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: קַיִן
  choice: కయీను
  rationale: వ్యక్తి పేరును తెలుగు ధ్వన్యనుసారంగా లిప్యంతరీకరించాం; קָנִיתִיతో ఉన్న శబ్దసామ్యాన్ని పాదసూచికలో తెలిపాం.
- source_word: קָנִיתִי
  choice: సంపాదించుకున్నాను
  rationale: קנה అనే క్రియలోని ‘సంపాదించు/పొందు’ భావాన్ని నిలుపుతుంది. ‘సృష్టించాను’ అనే సందర్భానుచితం కాని భావాన్ని నివారిస్తుంది.
- source_word: אִישׁ
  choice: ఒక పురుషుణ్ణి
  rationale: పుట్టినవాడు శిశువైనా, మూలపాఠం ‘కుమారుడు’ లేదా ‘మగబిడ్డ’ కాక אִישׁ (‘పురుషుడు’) అనే పదాన్నే వాడింది; ఆ అసాధారణ పదప్రయోగాన్ని నిలిపాం.
- source_word: אֶת יְהוָה
  choice: యాహ్వే నుండి
  rationale: సందిగ్ధమైన אֶתను ప్రధాన పాఠంలో మూలం లేదా దాతను సూచించే ‘నుండి’గా గ్రహించాం; మరింత అక్షరార్థమైన ‘యాహ్వేతో’ సహా ఇతర సాధ్యార్థాలను పాదసూచికలో ఉంచాం.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా తెలుగు లిపిలో ‘యాహ్వే’గా లిప్యంతరీకరించాం.
theological_decisions:
- issue: హవ్వ మాటలోని אֶת יְהוָה అర్థం
  choice: యాహ్వే నుండి
  alternative: యాహ్వేతో; యాహ్వే సహాయంతో; ‘ఒక పురుషుణ్ణి—యాహ్వేను—సంపాదించుకున్నాను’
  rationale: హిబ్రూ నిర్మాణం నిజంగా సందిగ్ధమైనది. ప్రధాన పాఠం బిడ్డకు యాహ్వే మూలమని హవ్వ అంగీకరించిన భావాన్ని ఇస్తుంది; అయితే మిగతా ప్రధాన పఠనాలను తొలగించకుండా పాదసూచికలో నమోదు చేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని వాడాం. ‘తెలుసుకున్నాడు’ అనే అక్షరార్థ సౌమ్యోక్తి తెలుగులో అపార్థానికి దారితీయవచ్చు కాబట్టి ‘కలిశాడు’ అని స్పష్టీకరించాం. మూలంలోని అసాధారణ ‘ఒక పురుషుడు’ పదప్రయోగం మరియు చివరి పదబంధంలోని వ్యాఖ్యాన సందిగ్ధతను ఉద్దేశపూర్వకంగా నిలిపాం.
