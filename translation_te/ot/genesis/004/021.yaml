translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘సహోదరుడు’ అనే రూపం కొద్దిగా అధికారికమైనదైనా బైబిలు వంశావళి సందర్భానికి తగినది. హీబ్రూ నుడికారమైన ‘తండ్రి’ని ప్రధాన పాఠ్యంలో ‘మూలపురుషుడు’గా అర్థస్పష్టతతో ఇచ్చి, అక్షరార్థాన్ని పాదటిప్పణిలో నిలిపాం. ప్రధాన పాఠ్యంలోని [a], [b] గుర్తులు సంబంధిత పాదటిప్పణులకు సరిపోతాయి.
