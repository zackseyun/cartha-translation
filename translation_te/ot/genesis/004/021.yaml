id: GEN.4.21
reference: Genesis 4:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/שֵׁ֥ם אָחִ֖י/ו יוּבָ֑ל ה֣וּא הָיָ֔ה אֲבִ֕י כָּל תֹּפֵ֥שׂ כִּנּ֖וֹר וְ/עוּגָֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/021.yaml
  text: And the name of his brother was Jubal[c][b][a]; he was the father of all who play the lyre and the pipe.
translation:
  language: te
  text: అతని సహోదరుని పేరు యూబాలు; అతడు వీణను, ఊదే వాద్యాన్ని వాయించే వారందరికీ తండ్రి.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “తండ్రి” అని అనువదించిన హీబ్రూ పదం ఈ సందర్భంలో ఈ వాద్యాలను వాయించే వారి ఆద్యుడు, పూర్వగామి, లేదా ఆ సంప్రదాయాన్ని స్థాపించినవాడు అనే భావాన్ని కూడా సూచించవచ్చు; అందరికీ ప్రత్యక్ష జీవశాస్త్రీయ తండ్రి అని తప్పనిసరిగా కాదు.
    reason: cultural_note
  - marker: b
    text: “ఊదే వాద్యం” అని అనువదించిన హీబ్రూ పదం సూచించే ప్రాచీన వాద్యం ఖచ్చితంగా ఏదో తెలియదు; దాన్ని “గొట్టపు వాద్యం,” “వేణువు,” లేదా “పిల్లనగ్రోవి” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשֵׁם אָחִיו
  choice: అతని సహోదరుని పేరు
  rationale: ముందటి వచనంలోని యాబాలును సూచించే సంబంధాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; వాక్యారంభంలోని וְను ప్రత్యేకంగా ‘మరియు’ అని అనువదించకపోయినా కథన కొనసాగింపు నిలుస్తుంది.
- source_word: יוּבָל
  choice: యూబాలు
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు బైబిలు నామరూప సంప్రదాయానికి అనుగుణంగా లిప్యంతరీకరించింది.
- source_word: הוּא הָיָה אֲבִי
  choice: అతడు ... మూలపురుషుడు
  rationale: ఇక్కడ ‘తండ్రి’ అనే హీబ్రూ నుడికారం ప్రత్యక్ష జీవశాస్త్రీయ పితృత్వం కంటే ఒక వృత్తి లేదా సంప్రదాయానికి ఆద్యుడు/పూర్వగామి అనే భావాన్ని సూచిస్తుంది; ‘మూలపురుషుడు’ ఆ భావాన్ని స్పష్టంగా, గౌరవప్రదంగా అందిస్తుంది.
- source_word: כָּל תֹּפֵשׂ
  choice: వాయించే వారందరికీ
  rationale: תֹּפֵשׂ అక్షరార్థంగా ‘పట్టుకునే/చేపట్టే’ అని ఉన్నా, వాద్యాల సందర్భంలో వాటిని వాయించడాన్ని సూచిస్తుంది.
- source_word: כִּנּוֹר
  choice: వీణ
  rationale: ఇది తంతివాద్యమైన lyre‌ను సూచిస్తుంది. ఖచ్చితమైన ఆధునిక సమాన వాద్యం కాకపోయినా ‘వీణ’ సాధారణ తెలుగు పాఠకునికి సహజమైన విస్తృత తంతివాద్య పదం.
- source_word: עוּגָב
  choice: వేణువు
  rationale: ప్రాచీన వాద్యం ఖచ్చితంగా ఏదో అనిశ్చితం; ఇది సాధారణంగా ఊదే వాద్యంగా గ్రహించబడుతుంది. ‘వేణువు’ అతిగా నిర్దిష్టం కాకుండా సహజమైన తెలుగు పదంగా ఉపయోగించబడింది.
