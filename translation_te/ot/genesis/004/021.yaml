  terminology: యూబాలు అనే నామరూపం నిలిపాం. ‘తండ్రి’ హీబ్రూ idiom‌కు సన్నిహితమైన అనువాదం; అది స్థాపకుడు/ఆద్యుడు అనే భావంలో కూడా వాడబడవచ్చని పాదటిప్పణి వివరిస్తుంది. כִּנּוֹר‌కు ‘వీణ’ను విస్తృత తంతివాద్య పదంగా ఉంచాం. עוּגָב‌ను నిర్దిష్టంగా వేణువు అని చెప్పకుండా ‘ఊదే వాద్యం’గా ఇచ్చాం.
