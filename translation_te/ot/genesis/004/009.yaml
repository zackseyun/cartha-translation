  yaml_path: translation/ot/genesis/004/009.yaml
  text: Then Yahweh said to Cain[a], “Where is Abel your brother?” And he said, “I do not know. Am I my brother’s keeper?”
translation:
  language: te
  text: అప్పుడు యహ్వే కయీనుతో, “నీ సోదరుడు హేబెలు ఎక్కడ ఉన్నాడు?” అని అన్నాడు. అతడు, “నాకు తెలియదు[a]. నా సోదరునికి కాపలాదారుడనా నేను?” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నాకు తెలియలేదు.” హీబ్రూ పరిపూర్ణ క్రియారూపాన్ని గతకాల నిరాకరణగా అనువదించవచ్చు; అయితే ఈ సందర్భంలో అది తనకు ప్రస్తుతం తెలియదని చెప్పే మాటగా సహజంగా అర్థమవుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగు లిపిలో ‘యహ్వే’గా లిప్యంతరీకరించాం.
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... అడిగాడు / ... అన్నాడు
  rationale: మొదటి సందర్భంలో ప్రశ్న ఉన్నందున సహజమైన తెలుగులో ‘అడిగాడు’ అని, కయీను జవాబులో ‘అన్నాడు’ అని అనువదించాం; కథన క్రమాన్ని ‘అప్పుడు’ తెలియజేస్తుంది.
- source_word: אֵי
  choice: ఎక్కడ ఉన్నాడు?
  rationale: స్థానాన్ని ప్రశ్నించే పదం; తెలుగులో వ్యక్తిని గురించి అడిగేటప్పుడు ‘ఎక్కడ ఉన్నాడు?’ అనడం సహజం.
- source_word: הֶבֶל
  choice: హేబెలు
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: אָחִיךָ / אָחִי
  choice: నీ సోదరుడు / నా సోదరుడు
  rationale: మూలంలోని పుంలింగ ఏకవచన బంధుత్వ పదాన్ని, వయోక్రమాన్ని ఊహించకుండా, ‘సోదరుడు’గా నిలిపాం.
- source_word: לֹא יָדַעְתִּי
  choice: నాకు తెలియదు
  rationale: హీబ్రూ పరిపూర్ణ క్రియారూపం గతకాల నిరాకరణగా కూడా అర్థమవగలిగినా, ఈ సంభాషణ సందర్భంలో ప్రస్తుత అజ్ఞానాన్ని ప్రకటించే సహజ తెలుగు రూపాన్ని వాడాం.
- source_word: הֲשֹׁמֵר
  choice: కాపలాదారుణ్ణా
  rationale: שׁמר పదంలోని కాపాడటం, కనిపెట్టుకొని ఉండటం అనే భావాన్ని బాధ్యతను అదనంగా వివరించకుండా తెలుగులో సహజమైన అలంకారప్రశ్నగా వ్యక్తం చేస్తుంది.
- source_word: אָנֹכִי
  choice: నేను
  rationale: స్వతంత్ర సర్వనామంలోని ఉద్ఘాటనను తెలుగు వాక్యాంతంలో ‘నేను’ ఉంచడం ద్వారా నిలిపాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమే ఉంది. దానిని బిరుదుగా మార్చకుండా ‘యహ్వే’ అని లిప్యంతరీకరించడం మూలభేదాన్ని కాపాడుతుంది.
- issue: కయీను మాటలోని కాలభావం
  choice: నాకు తెలియదు
  alternative: నాకు తెలియలేదు
  rationale: మూలంలోని పరిపూర్ణ క్రియ గత నిరాకరణను అనుమతించినప్పటికీ, సందర్భంలో అది తనకు ఇప్పుడు తెలియదని కయీను చెప్పే మాటగా సహజంగా పనిచేస్తుంది; ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథనశైలిని వాడాం. హీబ్రూ అలంకారప్రశ్నలోని ఉద్ఘాటనను ‘నా సోదరునికి కాపలాదారుణ్ణా నేను?’ అనే పదక్రమంతో నిలిపాం.
