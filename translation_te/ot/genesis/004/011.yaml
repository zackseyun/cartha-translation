id: GEN.4.11
reference: Genesis 4:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/עַתָּ֖ה אָר֣וּר אָ֑תָּה מִן הָֽ/אֲדָמָה֙ אֲשֶׁ֣ר פָּצְתָ֣ה אֶת פִּ֔י/הָ לָ/קַ֛חַת אֶת דְּמֵ֥י אָחִ֖י/ךָ מִ/יָּדֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/011.yaml
  text: And now you are cursed from the ground[c][b][a], which has opened its mouth to receive your brother’s blood from your hand.
translation:
  language: te
  text: ఇప్పుడు, నీ చేతినుండి నీ సహోదరుని రక్తాన్ని[b] స్వీకరించడానికి తన నోరు తెరిచిన నేలనుండి[a] నీవు శాపగ్రస్తుడవు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నేలనుండి’ అని ఉన్న హీబ్రూ పదబంధాన్ని ‘నేలకు దూరంగా’ లేదా ‘నేలచేత’ అని కూడా అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా ‘రక్తాలు’; ఇది చిందిన రక్తాన్ని లేదా రక్తపాతాన్ని సూచించే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: ఇక ఇప్పుడు
  rationale: సంయోజక భావాన్నీ, కయీను చేసిన పనికి వెంటనే వచ్చే పరిణామాన్నీ సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: אָרוּר אָתָּה
  choice: నీవు శాపగ్రస్తుడవు
  rationale: హీబ్రూ వాక్యంలోని శపించబడిన స్థితిని గంభీరమైన, సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: מִן הָאֲדָמָה
  choice: నేలనుండి
  rationale: מִן సూచించగల మూలం లేదా వేరుపాటు అనే రెండు ఛాయలనూ సాధ్యమైనంతవరకు నిలుపుతుంది; ‘నేలచేత’ లేదా ‘నేలకు దూరంగా’ అని ఒకే అర్థాన్ని నిర్బంధించదు.
- source_word: אֲשֶׁר פָּצְתָה אֶת פִּיהָ
  choice: తన నోరు తెరిచిన
  rationale: నేలను సజీవంగా చిత్రించే మూలభాష రూపకాన్ని నేరుగా, సహజంగా నిలుపుతుంది.
- source_word: לָקַחַת
  choice: స్వీకరించడానికి
  rationale: చిందిన రక్తాన్ని నేల తనలోకి తీసుకున్నదనే సందర్భంలో ‘తీసుకోవడానికి’ కంటే సహజంగా ఉండి, మూల రూపకాన్ని కాపాడుతుంది.
- source_word: דְּמֵי אָחִיךָ
  choice: నీ సహోదరుని రక్తాన్ని
  rationale: హీబ్రూలోని ‘రక్తాలు’ అనే బహువచనం రక్తపాతం లేదా చిందిన రక్తాన్ని సూచించే నుడికారం; తెలుగులో ఏకవచన ‘రక్తం’ సహజం.
- source_word: מִיָּדֶךָ
  choice: నీ చేతినుండి
  rationale: కయీను ప్రత్యక్ష బాధ్యతను చూపే హీబ్రూ దృశ్యరూపాన్ని నిలుపుతుంది.
theological_decisions:
- issue: శాపానికి నేలతో ఉన్న సంబంధం
  choice: ‘నేలనుండి’ అని అనువదించి మూలం/వేరుపాటు మధ్య ఉన్న భావ ఉద్రిక్తతను నిలుపడం
  alternative: ‘నేలచేత’ లేదా ‘నేలకు దూరంగా’
  rationale: హీబ్రూ מִן ఇక్కడ శాపం నేలనుండి వస్తుందనే భావాన్నీ, కయీను నేలనుండి వేరవుతాడనే భావాన్నీ అనుమతించగలదు. ప్రధాన పాఠం ఏ ఒక్క అర్థాన్నీ పూర్తిగా నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘సహోదరుడు’ బైబిలు సందర్భానికి తగిన గౌరవప్రద పదం; నేల నోరు తెరవడం అనే వ్యక్తీకరణను యథాతథంగా నిలిపాం.
