id: GEN.4.12
reference: Genesis 4:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּ֤י תַֽעֲבֹד֙ אֶת הָ֣/אֲדָמָ֔ה לֹֽא תֹסֵ֥ף תֵּת כֹּחָ֖/הּ לָ֑/ךְ נָ֥ע וָ/נָ֖ד תִּֽהְיֶ֥ה בָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/012.yaml
  text: When you work the ground[a], it will no longer yield its strength to you[d][c][b]. You will be a wanderer and a fugitive on the earth.
translation:
  language: te
  text: నీవు నేలను సాగుచేసినప్పుడు[a], అది ఇకపై తన శక్తిని నీకు ఇవ్వదు[b]. నీవు భూమిమీద[d] అటూ ఇటూ తిరిగే సంచారివై ఉంటావు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘నీవు నేలను సాగుచేస్తే’; లేదా ‘ఎందుకంటే నీవు నేలను సాగుచేసినప్పుడు.’ హీబ్రూ సంధిపదాన్ని సందర్భానుసారం కాలార్థకంగా, షరతార్థకంగా లేదా కారణార్థకంగా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: పదశః, ‘అది తన శక్తిని నీకు ఇవ్వడం ఇక కొనసాగించదు.’ ఇక్కడ ‘శక్తి’ అంటే నేల పంటనిచ్చే శక్తి లేదా సారం.
    reason: lexical_alternative
  - marker: c
    text: లేదా ‘నిలకడలేని సంచారివి.’ హీబ్రూలోని జత పదాలు దగ్గరి అర్థాలు కలిగి, కయీను స్థిరత్వం లేని స్థితిని బలంగా తెలియజేస్తాయి.
    reason: lexical_alternative
  - marker: d
    text: లేదా ‘దేశంలో.’
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: సాగుచేసినప్పుడు
  rationale: ఈ సందర్భంలో כִּי కయీను నేలను సాగుచేసే సమయంలో శాపఫలితం అనుభవంలోకి వస్తుందని సూచించగలదు. కాలార్థకంగా అనువదించడం సహజంగా ఉంది; కారణార్థకమైన ‘ఎందుకంటే’ లేదా షరతార్థకమైన ‘సాగుచేస్తే’ కూడా సాధ్యమేనని పాదటిప్పణిలో ఉంచాం.
- source_word: תַעֲבֹד אֶת־הָאֲדָמָה
  choice: నేలను సాగుచేసినప్పుడు
  rationale: עבד ఇక్కడ నేలపై శ్రమించడం లేదా దాన్ని సాగుచేయడం అనే అర్థంలో ఉంది. אֲדָמָהకు ‘నేల’ అని ఇవ్వడం ఆదికాండంలోని నేలతో సంబంధాన్ని, కయీను వ్యవసాయ పనిని నిలుపుతుంది.
- source_word: לֹא תֹסֵף תֵּת
  choice: ఇకపై ... ఇవ్వదు
  rationale: יסף + క్రియారూపం ఇక కొనసాగకపోవడాన్ని సూచిస్తుంది. ‘ఇకపై ఇవ్వదు’ అనే రూపం హీబ్రూ నుడికార భావాన్ని స్పష్టమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: כֹּחָהּ
  choice: తన శక్తిని
  rationale: పదశః ‘దాని శక్తి.’ సందర్భంలో ఇది నేల పంటనిచ్చే శక్తి లేదా సారాన్ని సూచిస్తుంది. ‘శక్తి’ అని ఉంచడం మూలంలోని రూపకాన్ని కాపాడుతుంది.
- source_word: נָע וָנָד
  choice: అటూ ఇటూ తిరిగే సంచారి
  rationale: ఈ రెండు హీబ్రూ పదాలు స్థిరనివాసం లేక తిరుగుతూ ఉండే స్థితిని పరస్పరం బలపరుస్తాయి. తెలుగులో సహజంగా ఉండేలా రెండు భావాలను ఒక సమన్విత పదబంధంలో వ్యక్తం చేశాం; నేరస్థుడిగా పారిపోతున్నాడనే అదనపు భావాన్ని రుద్దలేదు.
- source_word: בָאָרֶץ
  choice: భూమిమీద
  rationale: אֶרֶץకు ‘భూమి’ లేదా ‘దేశం’ అనే అర్థాలు సాధ్యమే. ఆదికాండపు ఈ ప్రాచీన లోకసందర్భంలో ‘భూమిమీద’ విస్తృత భావాన్ని సహజంగా అందిస్తుంది; ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో తెలిపాం.
theological_decisions:
- issue: కయీనుకు విధించిన తీర్పు పరిధి
  choice: నేల ఫలించకపోవడం అనే భౌతిక పరిణామాన్నీ, స్థిరత్వం లేని సంచార జీవితం అనే సామాజిక పరిణామాన్నీ రెండింటినీ నిలుపడం
  alternative: దీనిని కేవలం మానసిక అశాంతిగా లేదా ఒక ప్రాంతానికే పరిమితమైన దేశబహిష్కరణగా అర్థం చేయడం
  rationale: వచనం నేల తన శక్తిని ఇవ్వకపోవడాన్నీ, కయీను נָע וָנָד కావడాన్నీ కలిపి చెబుతుంది. తరువాతి సిద్ధాంత వర్గీకరణలను చేర్చకుండా ఈ రెండు కోణాల మధ్య ఉన్న ఉద్రిక్తతను అనువాదం కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యే, గంభీరమైన శైలి వాడబడింది. ‘తన శక్తిని’ అనే కొద్దిగా రూపకాత్మకమైన వ్యక్తీకరణ మూల హీబ్రూ చిత్రాన్ని కాపాడుతుంది; ‘అటూ ఇటూ తిరిగే సంచారి’ జత హీబ్రూ పదాల బలాన్ని సహజ తెలుగులో అందిస్తుంది.
