  language: en
  yaml_path: translation/ot/genesis/004/016.yaml
  text: Then Cain went out from before Yahweh and settled in the land of Nod[a], east of Eden.
translation:
  language: te
  text: అప్పుడు కయీను యెహోవా సన్నిధి నుండి బయలుదేరి, ఏదెనుకు తూర్పున ఉన్న నోదు దేశంలో[a] స్థిరపడ్డాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “నోదు” అనే పేరు “సంచరించడం” అని అర్థమిచ్చే హీబ్రూ పదంలా వినిపిస్తుంది; ఇది ఈ అధ్యాయంలో ముందుగా కయీనుకు విధించిన శిక్షను ప్రతిధ్వనింపజేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: బయలుదేరి
  rationale: יצא అనే క్రియలోని బయటికి వెళ్లే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; కయీను వెళ్లిన తీరును అదనంగా వ్యాఖ్యానించదు.
- source_word: מִלִּפְנֵי
  choice: సన్నిధి నుండి
  rationale: అక్షరార్థంగా ‘ముఖం ఎదుట నుండి’ అనే హీబ్రూ నుడికారానికి తెలుగులో సహజమైన సమానార్థకం. దేవునితో సంబంధం తెగిపోవడంలోని కథన-దైవశాస్త్ర ఉద్వేగాన్ని వివరణతో పరిష్కరించకుండా నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవ నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే రూపంలో లిప్యంతరీకరించింది.
- source_word: וַיֵּשֶׁב
  choice: స్థిరపడ్డాడు
  rationale: ישב ఇక్కడ నివసించడం లేదా ఒక చోట కాపురం ఏర్పరచుకోవడం అనే భావాన్ని ఇస్తుంది; ‘స్థిరపడ్డాడు’ కథన సందర్భానికి సహజంగా సరిపోతుంది.
- source_word: בְּאֶרֶץ נוֹד
  choice: నోదు దేశంలో
  rationale: נוֹד ఇక్కడ స్థలనామంగా పనిచేస్తున్నందున అనువదించకుండా లిప్యంతరీకరించింది; ‘సంచారం’తో ఉన్న శబ్దసామ్యాన్ని పాదసూచికలో తెలిపింది.
- source_word: קִדְמַת עֵדֶן
  choice: ఏదెనుకు తూర్పున ఉన్న
  rationale: ఏదెనుతో పోల్చినప్పుడు తూర్పు దిశలో ఉన్న ప్రదేశాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: עֵדֶן
  choice: ఏదెను
  rationale: స్థలనామాన్ని తెలుగులో సుపరిచితమైన రూపంలో లిప్యంతరీకరించింది.
theological_decisions:
- issue: కయీను దేవుని ఎదుటి నుండి వెళ్లడాన్ని ఎలా వ్యక్తపరచాలి
  choice: యెహోవా సన్నిధి నుండి బయలుదేరి
  alternative: యెహోవా ఎదుటి నుండి బయలుదేరి
  rationale: ‘సన్నిధి నుండి’ హీబ్రూ מִלִּפְנֵי నుడికారాన్ని సహజమైన తెలుగులో అందిస్తుంది. ఇది దేవుడు ఒక ప్రదేశానికే పరిమితుడని చెప్పదు; అలాగే కయీను అనుభవించిన దూరత్వాన్ని కూడా చెరపదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘యెహోవా’ అనే వ్యక్తినామాన్ని నిలిపి, ‘నోదు’లోని పదప్రయోగాన్ని ప్రధాన వాక్యంలో విప్పకుండా పాదసూచికలో వివరించింది.
