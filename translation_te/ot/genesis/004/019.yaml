id: GEN.4.19
reference: Genesis 4:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּֽקַּֽח ל֥/וֹ לֶ֖מֶךְ שְׁתֵּ֣י נָשִׁ֑ים שֵׁ֤ם הָֽ/אַחַת֙ עָדָ֔ה וְ/שֵׁ֥ם הַ/שֵּׁנִ֖ית צִלָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/019.yaml
  text: Lamech took for himself two wives[a]. The name of the one was Adah[b], and the name of the other was Zillah.
translation:
  language: te
  text: లెమెకు ఇద్దరు భార్యలను వివాహం చేసుకున్నాడు[a]. ఒకరి పేరు ఆదా, మరొకరి పేరు సిల్లా[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరాలా, “తన కోసం ఇద్దరు భార్యలను తీసుకున్నాడు.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “రెండవదాని పేరు సిల్లా.”
    reason: previous_rendering
lexical_decisions:
- source_word: וַיִּקַּח
  choice: తీసుకున్నాడు
  rationale: לקח అనే క్రియకు ప్రాథమికంగా ‘తీసుకొను’ అనే అర్థం ఉంది; వివాహ సందర్భంలో ‘భార్యగా చేసుకొను’ అనే భావం వస్తుంది. వెంటనే ‘ఇద్దరు భార్యలను’ అని ఉండడం వల్ల వివాహ భావం స్పష్టంగానే ఉంది.
- source_word: לוֹ
  choice: తన కోసం
  rationale: వ్యక్తిగత ఆసక్తిని సూచించే లోֹ రూపంలోని ప్రతిఫల భావాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: שְׁתֵּי נָשִׁים
  choice: ఇద్దరు భార్యలను
  rationale: נָשִׁים అనేది ‘స్త్రీలు’ లేదా ‘భార్యలు’ అని అర్థమవుతుంది; לקח తో కూడిన ఈ సందర్భంలో వివాహ సంబంధమే ఉద్దేశించబడింది.
- source_word: שֵׁם הָאַחַת
  choice: ఒకామె పేరు
  rationale: ఇద్దరిలో ఒకరిని సూచించే హెబ్రీ నామకరణ సూత్రాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: עָדָה
  choice: ఆదా
  rationale: వ్యక్తి పేరును హెబ్రీ ఉచ్చారణకు సమీపంగా లిప్యంతరీకరించాం.
- source_word: וְשֵׁם הַשֵּׁנִית
  choice: రెండో ఆమె పేరు
  rationale: הַשֵּׁנִית యొక్క ‘రెండవది’ అనే ప్రత్యక్ష అర్థాన్ని, హెబ్రీ సమాంతర నిర్మాణాన్ని వీలైనంతగా నిలుపుతూ అందిస్తుంది.
- source_word: צִלָּה
  choice: సిల్లా
  rationale: హెబ్రీ צִלָּה పేరును దాని ఉచ్చారణకు సమీపంగా తెలుగులో లిప్యంతరీకరించాం.
theological_decisions:
- issue: లెమెకు ఇద్దరు భార్యలను చేసుకున్నాడనే బహుభార్యత్వాన్ని ఎలా వ్యక్తపరచాలి
  choice: ‘ఇద్దరు భార్యలను’ అని వివాహ వాస్తవాన్ని స్పష్టంగా చెప్పి, నైతిక వ్యాఖ్యను జోడించలేదు.
  alternative: ‘ఇద్దరు స్త్రీలను’ లేదా ‘ఇద్దరు స్త్రీలను పెళ్లి చేసుకున్నాడు’
  rationale: వచనం లెమెకు చర్యను కథనంగా తెలియజేస్తుంది గాని దానిపై ఇక్కడ నైతిక తీర్పు ఇవ్వదు. కాబట్టి అనువాదం వాస్తవాన్ని స్పష్టంగా ఉంచి, అదనపు సిద్ధాంతపరమైన మూల్యాంకనాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథన శైలి. మూలంలోని ‘తీసుకున్నాడు’ అనే రూపాన్ని ప్రధాన పాఠ్యంలో నిలిపి, సహజమైన వివాహ ప్రయోగాన్ని పాదటిప్పణిలో ఇచ్చాం. ‘రెండో ఆమె’ మూలంలోని క్రమసూచక భావాన్ని నిలుపుతుంది; మరింత సహజమైన ‘మరొకామె’ను ప్రత్యామ్నాయంగా సూచించాం.
