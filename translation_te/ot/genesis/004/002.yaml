  yaml_path: translation/ot/genesis/004/002.yaml
  text: And she gave birth again[a], to his brother Abel. Abel became a shepherd of flocks[c][b], but Cain was a worker of the ground.
translation:
  language: te
  text: ఆమె మళ్లీ కయీను సోదరుడైన హేబెలును కనింది.[a] హేబెలు మందలను కాసేవాడు;[b] కయీను నేలను సాగుచేసేవాడు.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆమె కనడం కొనసాగించింది.’ హీబ్రూ నుడికారం అక్షరార్థంగా ‘కనుటను మరల చేర్చింది’ అని ఉండి, పునరావృతిని లేదా కొనసాగింపును సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ పదం ప్రధానంగా గొర్రెలు, మేకలు వంటి చిన్న పశువుల మందలను సూచిస్తుంది.
    reason: cultural_note
  - marker: c
    text: లేదా, ‘నేలను పనిచేసేవాడు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּסֶף לָלֶדֶת
  choice: ఆమె మళ్లీ ... కనింది
  rationale: יסף + క్రియార్థక రూపం పునరావృతిని లేదా కొనసాగింపును సూచిస్తుంది. ఈ జనన వృత్తాంతంలో ‘మళ్లీ కనింది’ సహజంగా ఉండి వరుసగా జరిగిన రెండవ ప్రసవాన్ని తెలియజేస్తుంది.
- source_word: אֶת אָחִיו אֶת הָבֶל
  choice: కయీను తమ్ముడైన హేబెలును
  rationale: హీబ్రూ వాక్యం హేబెలును కయీను సహోదరునిగా గుర్తిస్తుంది. తెలుగులో సందర్భానుసారంగా ‘కయీను తమ్ముడు’ అని చెప్పడం సంబంధాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: הֶבֶל
  choice: హేబెలు
  rationale: హీబ్రూ వ్యక్తినామానికి సమీపంగా ఉండే తెలుగు లిప్యంతరీకరణ.
- source_word: וַיְהִי הֶבֶל רֹעֵה צֹאן
  choice: హేబెలు గొర్రెలు, మేకల మందలను కాసేవాడు
  rationale: רעה అంటే పశువులను మేపడం లేదా కాయడం; צאן ప్రధానంగా గొర్రెలు, మేకలు వంటి చిన్న పశువుల సమూహాన్ని సూచిస్తుంది. తెలుగు పాఠకులకు భావం స్పష్టంగా ఉండేందుకు రెండింటినీ పేర్కొన్నాం.
- source_word: קַיִן
  choice: కయీను
  rationale: హీబ్రూ వ్యక్తినామానికి సమీపంగా ఉండే తెలుగు లిప్యంతరీకరణ.
- source_word: הָיָה עֹבֵד אֲדָמָה
  choice: నేలను సాగుచేసేవాడు
  rationale: עבד + אדמה అంటే నేలను పనిచేయడం లేదా సాగుచేయడం. ‘రైతు’ కంటే ఈ రూపం మూలంలోని క్రియాత్మక భావాన్ని, ‘నేల’ అనే ప్రధాన పదాన్ని నిలుపుతుంది.
- source_word: וְ
  choice: ;
  rationale: హీబ్రూలోని సాధారణ సంధానాన్ని తెలుగులో రెండు సమాంతర వృత్తుల వర్ణనగా ఉంచాం. ‘కాని’ అని అనువదించి మూలంలో లేని బలమైన వ్యతిరేకతను కలిగించలేదు.
theological_decisions:
- issue: సహోదరుల వృత్తుల వర్ణన
  choice: రెండు వృత్తులనూ ఎటువంటి నైతిక తీర్పు లేకుండా సమాంతరంగా వర్ణించడం
  alternative: ఒక వృత్తి మరొకదానికంటే ఉన్నతమైనదని సూచించే పదప్రయోగం
  rationale: ఈ వచనం వారి వృత్తులను కేవలం వివరిస్తుంది; ఏ వృత్తికీ నైతిక లేదా ఆధ్యాత్మిక ఆధిక్యాన్ని ఆపాదించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. ‘మందలను కాసేవాడు,’ ‘నేలను సాగుచేసేవాడు’ అనే సాధారణ పదబంధాలు వృత్తులను తటస్థంగా తెలియజేస్తాయి. ప్రతి పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో ఉంచబడింది.
