  text: וַ/תֹּ֣סֶף לָ/לֶ֔דֶת אֶת אָחִ֖י/ו אֶת הָ֑בֶל וַֽ/יְהִי הֶ֨בֶל֙ רֹ֣עֵה צֹ֔אן וְ/קַ֕יִן הָיָ֖ה עֹבֵ֥ד אֲדָמָֽה־־־׃
base_translation:
