source:
  edition: WLC
  text: וּ/לְ/שֵׁ֤ת גַּם הוּא֙ יֻלַּד בֵּ֔ן וַ/יִּקְרָ֥א אֶת שְׁמ֖/וֹ אֱנ֑וֹשׁ אָ֣ז הוּחַ֔ל לִ/קְרֹ֖א בְּ/שֵׁ֥ם יְהוָֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/026.yaml
  text: And to Seth also a son was born[a], and he called his name Enosh[b]. At that time people began to call on the name of Yahweh.
translation:
  language: te
  text: షేతుకు కూడా ఒక కుమారుడు పుట్టాడు. షేతు అతనికి ఎనోషు అని పేరు పెట్టాడు. ఆ కాలంలో ప్రజలు యాహ్వే నామాన్ని పిలుచుకోవడం మొదలుపెట్టారు.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత అక్షరార్థంగా: “అప్పుడు యాహ్వే నామాన్ని పిలుచుకోవడం మొదలుపెట్టబడింది.”'
    reason: lexical_alternative
  - marker: b
    text: అల్పసంఖ్యాక వ్యాఖ్యానం ఈ క్రియను “అపవిత్రపరచడం మొదలైంది” అని గ్రహిస్తుంది; అప్పుడు వాక్యానికి, “ఆ కాలంలో యాహ్వే నామాన్ని అపవిత్రపరచడం మొదలైంది” అనే అర్థం వస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: וּלְשֵׁת גַּם הוּא יֻלַּד בֵּן
  choice: షేతుకు కూడా ఒక కుమారుడు పుట్టాడు
  rationale: లְ ఉపసర్గను ‘షేతుకు’ అని, גַּםను ‘కూడా’ అని సహజంగా వ్యక్తం చేస్తూ, יֻלַּד అనే నిష్క్రియ రూపాన్ని ‘పుట్టాడు’ అనే తెలుగు జనన ప్రయోగంతో అనువదించాం.
- source_word: וַיִּקְרָא אֶת־שְׁמוֹ אֱנוֹשׁ
  choice: షేతు అతనికి ఎనోషు అని పేరు పెట్టాడు
  rationale: ‘అతడు’ అనే సర్వనామం వల్ల కలగగల సందిగ్ధతను నివారించడానికి కర్తను ‘షేతు’ అని స్పష్టం చేశాం; హెబ్రీ పేరు పెట్టే నుడికారాన్ని సహజమైన ఆధునిక తెలుగులో ఇచ్చాం.
- source_word: אֱנוֹשׁ
  choice: ఎనోషు
  rationale: ఇది ఇక్కడ వ్యక్తినామం; అందువల్ల దాని సంభావ్య సామాన్య నామార్థాన్ని అనువదించకుండా లిప్యంతరీకరించాం.
- source_word: אָז
  choice: ఆ కాలంలో
  rationale: కాలసూచకమైన ఈ అవ్యయాన్ని సందర్భానికి తగిన సహజ తెలుగు రూపంలో ఇచ్చాం.
- source_word: הוּחַל
  choice: మొదలుపెట్టారు
  rationale: ఈ హోఫల్ రూపాన్ని సాధారణంగా ఆరంభార్థకంగా గ్రహిస్తారు. హెబ్రీలోని అవ్యక్త నిష్క్రియ నిర్మాణాన్ని తెలుగులో సహజంగా చేయడానికి ‘ప్రజలు’ అనే అవ్యక్త మానవ కర్తతో వ్యక్తపరిచాం; మరింత అక్షరార్థ రూపాన్ని పాదసూచికలో ఉంచాం.
- source_word: לִקְרֹא בְּשֵׁם
  choice: నామాన్ని బట్టి మొరపెట్టుకోవడం
  rationale: ఈ హెబ్రీ నుడికారం సందర్భంలో దేవునికి ప్రార్థనాపూర్వకంగా పిలుపునివ్వడం లేదా ఆరాధనలో మొరపెట్టుకోవడాన్ని సూచిస్తుంది. ‘నామాన్ని బట్టి మొరపెట్టుకోవడం’ మూలంలోని ‘నామం’ అంశాన్నీ ఆహ్వాన భావాన్నీ నిలుపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హెబ్రీ దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగులో దాని ఉచ్చారణకు సమీపంగా లిప్యంతరీకరించాం.
theological_decisions:
- issue: הוּחַל לִקְרֹא בְּשֵׁם יְהוָה అనే వివాదాస్పద వాక్యభాగం
  choice: ఆ కాలంలో ప్రజలు యాహ్వే నామాన్ని బట్టి మొరపెట్టుకోవడం మొదలుపెట్టారు
  alternative: ఆ కాలంలో యాహ్వే నామాన్ని అపవిత్రపరచడం మొదలైంది
  rationale: సందర్భం మరియు קרא בשם అనే నుడికారం ఆధారంగా ప్రధాన పాఠంలో ప్రార్థనాపూర్వక ఆహ్వానార్థాన్ని ఎంచుకున్నాం. అయితే הוּחַלను חלל అనే ధాతువు యొక్క ‘అపవిత్రపరచు’ అర్థంతో గ్రహించే అల్పసంఖ్యాక వ్యాఖ్యానం నిజమైన పాఠ్య-వ్యాఖ్యాన ప్రత్యామ్నాయం కాబట్టి దాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని ఉపయోగించాం. వంశావళి వాక్యాల సరళతను కాపాడుతూ, వివాదాస్పద చివరి వాక్యభాగంలోని భావభేదాన్ని పాదసూచికల్లో స్పష్టంగా నిలిపాం.
