revisions:
- from: షేతుకు కూడా ఒక కుమారుడు పుట్టాడు. షేతు అతనికి ఎనోషు అని పేరు పెట్టాడు. ఆ కాలంలో ప్రజలు యాహ్వే నామాన్ని బట్టి మొరపెట్టుకోవడం మొదలుపెట్టారు.[a][b]
  to: షేతుకు కూడా ఒక కుమారుడు పుట్టాడు. షేతు అతనికి ఎనోషు అని పేరు పెట్టాడు. ఆ కాలంలో ప్రజలు యాహ్వే నామాన్ని పిలుచుకోవడం మొదలుపెట్టారు.[a][b]
  rationale: ప్రధాన సవరణ చివరి వాక్యంలోని హెబ్రీ నుడికారానికి సహజమైన, మూలానికి మరింత సమీపమైన తెలుగు రూపాన్ని ఇస్తుంది. హోఫల్ అవ్యక్తతను ప్రధాన పాఠంలో ‘ప్రజలు’ అనే సాధారణ కర్త ద్వారా, అక్షరార్థ ప్రత్యామ్నాయంలో నిష్క్రియ రూపం ద్వారా నిలిపాం. ప్రత్యామ్నాయ ‘అపవిత్రపరచడం’ పఠనాన్ని పాదసూచికలో కొనసాగించాం; దానిని ప్రధాన పాఠంపై రుద్దలేదు. రెండు పాదసూచికలూ అవి వివరిస్తున్న చివరి ఉపవాక్యానికే జతచేయబడ్డాయి.
