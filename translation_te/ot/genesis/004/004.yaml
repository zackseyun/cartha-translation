id: GEN.4.4
reference: Genesis 4:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הֶ֨בֶל הֵבִ֥יא גַם ה֛וּא מִ/בְּכֹר֥וֹת צֹאנ֖/וֹ וּ/מֵֽ/חֶלְבֵ/הֶ֑ן וַ/יִּ֣שַׁע יְהוָ֔ה אֶל הֶ֖בֶל וְ/אֶל מִנְחָתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/004.yaml
  text: And Abel also brought some of the firstborn of his flock[a], and of their fat portions. And Yahweh regarded Abel and his offering[b],
translation:
  language: te
  text: హేబెలు కూడా తన మందలో తొలిగా పుట్టిన వాటిలో కొన్నిటినీ, వాటి కొవ్వు భాగాలనూ[a] తీసుకొచ్చాడు. యాహ్వే హేబెలును, అతని అర్పణను అనుకూలంగా చూశాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘వాటి కొవ్వులోనుండి.’ ఇది అర్పించిన జంతువులలోని అత్యుత్తమమైన కొవ్వు భాగాలను సూచించే అవకాశం ఉంది.
    reason: cultural_note
  - marker: b
    text: లేదా, ‘హేబెలుపై, అతని అర్పణపై దృష్టి పెట్టాడు.’ ఈ సందర్భంలో ఈ మాట అనుకూల దృష్టిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֶבֶל
  choice: హేబెలు
  rationale: వావ్ సాధారణ కథన కొనసాగింపును సూచిస్తుంది; తెలుగులో వాక్యప్రవాహం సహజంగా ఉండేందుకు ప్రత్యేకంగా ‘మరియు’ చేర్చకుండా, ‘కూడా’తో కొనసాగింపు మరియు పోలిక రెండూ వ్యక్తమయ్యాయి.
- source_word: הֵבִיא
  choice: తీసుకొచ్చాడు
  rationale: בוא హిఫిల్ రూపం కానుక లేదా అర్పణ సందర్భంలో ‘తీసుకురావడం’ అనే సాధారణ అర్థాన్నిస్తుంది; ఇది ‘సమర్పించాడు’ కంటే తక్కువ వ్యాఖ్యాత్మకం.
- source_word: גַם הוּא
  choice: కూడా
  rationale: కయీను మాదిరిగానే హేబెలు కూడా అర్పణ తీసుకొచ్చాడనే ఉద్ఘాటనను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: מִבְּכֹרוֹת צֹאנוֹ
  choice: తన మందలో తొలిగా పుట్టిన వాటిలో కొన్నిటిని
  rationale: מן భాగార్థక ప్రయోగాన్ని కాపాడుతూ, మందలోని ప్రతి తొలిచూలు జంతువునూ అర్పించాడనే భావం రాకుండా ‘కొన్నిటిని’ అని అనువదించబడింది. צֹאן గొర్రెలు లేదా మేకల మందను సూచించగలందున ‘మంద’ అని ఉంచబడింది.
- source_word: וּמֵחֶלְבֵהֶן
  choice: వాటి కొవ్వు భాగాలను
  rationale: חֵלֶב ఇక్కడ జంతువుల కొవ్వును, ముఖ్యంగా అర్పణలోని విలువైన కొవ్వు భాగాలను సూచిస్తుంది. ‘కొవ్వు భాగాలు’ మూలపదార్థాన్ని కాపాడుతుంది; ‘శ్రేష్ఠ భాగాలు’ అనే విస్తృత వ్యాఖ్యానాన్ని ప్రధాన పాఠ్యంలోకి తేవదు.
- source_word: וַיִּשַׁע
  choice: అనుకూలంగా చూశాడు
  rationale: ఈ క్రియ ‘వైపు చూడడం/లక్ష్యపెట్టడం’ అనే భావంతో పాటు ఈ సందర్భంలో అనుకూల స్వీకారాన్ని సూచిస్తుంది. ‘అంగీకరించాడు’ అని ఫలితాన్ని మరీ స్పష్టీకరించకుండా సానుకూల దైవ స్పందనను తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవ నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో లిప్యంతరీకరించింది.
- source_word: אֶל הֶבֶל וְאֶל מִנְחָתוֹ
  choice: హేబెలును, అతని అర్పణను
  rationale: పునరుక్తమైన אֶל హేబెలు మరియు అతని అర్పణ రెండూ దైవ దృష్టికి వేర్వేరు లక్ష్యాలని సూచిస్తుంది; తెలుగులో సహజమైన కర్మ నిర్మాణంతో రెండింటినీ నిలిపింది.
- source_word: מִנְחָתוֹ
  choice: అతని అర్పణను
  rationale: מִנְחָה కానుక, కప్పం లేదా అర్పణను సూచించగలదు; ఈ ఆరాధనా సందర్భంలో ‘అర్పణ’ సహజమైనదీ, తగినంత విస్తృతమైనదీ.
theological_decisions:
- issue: וַיִּשַׁע లో దైవ స్పందన స్వభావం
  choice: యాహ్వే హేబెలును, అతని అర్పణను అనుకూలంగా చూశాడని పేర్కొనడం
  alternative: యాహ్వే హేబెలును, అతని అర్పణను అంగీకరించాడు
  rationale: హీబ్రూ క్రియ అనుకూల దృష్టిని సూచిస్తుంది; అయితే ఆ అనుకూలత ఏ విధంగా వ్యక్తమైందో వాక్యం చెప్పదు. అందువల్ల స్వీకార భావాన్ని నిలుపుతూ దాని విధానాన్ని లేదా సంకేతాన్ని అనువాదం చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథన శైలి. ‘తొలిచూలు’ వంటి ప్రాంతానుసారం మారే పదానికి బదులుగా ‘తొలిగా పుట్టినవి’ వాడబడింది. ప్రధాన పాఠ్యంలో మూలంలోని భాగార్థక భావం, కొవ్వు భాగాల స్పష్టత, దైవ స్పందనలోని పరిమిత అనిశ్చితి నిలుపబడ్డాయి.
