reference: Genesis 4:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/תֵּ֥לֶד עָדָ֖ה אֶת יָבָ֑ל ה֣וּא הָיָ֔ה אֲבִ֕י יֹשֵׁ֥ב אֹ֖הֶל וּ/מִקְנֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/020.yaml
  text: Adah bore Jabal[a]; he was the father of those who dwell in tents and have livestock.
translation:
  language: te
  text: ఆదా యాబాలును కన్నది. అతడు గుడారాల్లో నివసించి పశువులను పెంచేవారికి మూలపురుషుడు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “గుడారాల్లో నివసించి పశువులను పెంచేవారికి తండ్రి.” ఇక్కడ “తండ్రి” అనే హీబ్రూ ప్రయోగం ఒక జీవనవిధానానికి పూర్వికుడు, ఆరంభకుడు లేదా ఆదర్శ మూలవ్యక్తి అనే అర్థాలను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּלֶד
  choice: కన్నది
  rationale: ילד క్రియ యొక్క Qal wayyiqtol రూపం వంశావళి సందర్భంలో ‘కన్నది’ అనే సంక్షిప్త, సహజమైన అర్థాన్ని ఇస్తుంది.
- source_word: עָדָה
  choice: ఆదా
  rationale: వ్యక్తి పేరును ఆధునిక ప్రామాణిక తెలుగు ధ్వన్యనుసారం లిప్యంతరీకరించాం.
- source_word: אֶת
  choice: '[కర్మ సూచకం; అనువదించలేదు]'
  rationale: ఇది יָבָל అనే ప్రత్యక్ష కర్మను సూచిస్తుంది; తెలుగులో దీనికి ప్రత్యేక పదం అవసరం లేదు.
- source_word: יָבָל
  choice: యాబాలు
  rationale: హీబ్రూ వ్యక్తి పేరును తెలుగు ధ్వన్యనుసారం లిప్యంతరీకరించి, వాక్యంలోని కర్మవిభక్తికి అనుగుణంగా రూపం ఇచ్చాం.
- source_word: הוּא הָיָה
  choice: అతడు ... మూలపురుషుడు
  rationale: ఈ నిర్మాణం యాబాలు పోషించిన పాత్రను గుర్తిస్తుంది. తెలుగులో ‘అతడు ... మూలపురుషుడు’ అని చెప్పడం సహజంగా ఉంది; ‘అయ్యాడు’ అని అనువదిస్తే అవసరానికి మించి మార్పు భావం రావచ్చు.
- source_word: אֲבִי
  choice: మూలపురుషుడు
  rationale: ఇక్కడ אָב కేవలం జీవశాస్త్రీయ తండ్రి అనే అర్థానికే పరిమితం కాకుండా, ఒక జీవనవిధానానికి పూర్వికుడు లేదా ఆరంభకుడు అనే భావాన్ని కలిగి ఉంది. ‘మూలపురుషుడు’ ఆ విస్తృత భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: יֹשֵׁב אֹהֶל
  choice: గుడారాల్లో నివసిస్తూ
  rationale: ఏకవచన కృదంత నిర్మాణం ఒక జీవనవర్గాన్ని సమష్టిగా సూచిస్తుంది. ‘గుడారాల్లో నివసిస్తూ’ అనే రూపం ఆ జీవనశైలిని తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: וּמִקְנֶה
  choice: పశుసంపదను పోషించేవారు
  rationale: מִקְנֶה మందలు లేదా పెంపుడు పశువుల సముదాయాన్ని సూచిస్తుంది. హీబ్రూలోని సంక్షిప్త నామవాచక సమన్వయాన్ని తెలుగులో అర్థవంతం చేయడానికి సందర్భం సూచించే ‘పోషించేవారు’ అనే క్రియాభావాన్ని వ్యక్తం చేశాం.
theological_decisions:
- issue: ‘తండ్రి’ అనే రూపకానికి ఉన్న సాంస్కృతిక-వంశపారంపర్య భావం
  choice: మూలపురుషుడు
  alternative: తండ్రి / పూర్వికుడు / ఆరంభకుడు
  rationale: ఈ వచనం జీవశాస్త్రీయ పితృత్వం మాత్రమే కాక, గుడార జీవనం మరియు పశుపోషణతో గుర్తించబడే వర్గానికి పూర్వగామిత్వాన్ని సూచించవచ్చు. ప్రధాన పాఠంలో ‘మూలపురుషుడు’ అని ఇచ్చి, భావవ్యాప్తిని పాదటిప్పణిలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడాం. హీబ్రూ వాక్యంలోని సమష్టి భావాన్ని తెలుగులో బహువచన వర్గంగా స్పష్టం చేశాం; అయితే אֲבִי లోని అర్థ వైవిధ్యాన్ని పాదటిప్పణిలో సంరక్షించాం.
