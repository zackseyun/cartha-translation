revisions:
- from: ఆదా యాబాలును కన్నది. అతడు గుడారాల్లో నివసిస్తూ పశుసంపదను పోషించేవారికి మూలపురుషుడు[a].
  to: ఆదా యాబాలును కన్నది. అతడు గుడారాల్లో నివసించి పశువులను పెంచేవారికి మూలపురుషుడు[a].
  rationale: 'Only a safe idiomatic refinement is made: “పశుసంపదను పోషించేవారు” becomes “పశువులను పెంచేవారు.” This retains the Hebrew reference to tent-dwelling people associated with livestock while making the Telugu natural. The footnote is aligned with the revised, unified description of that group.'
  reviewer_model: gpt-5.6-terra
