source:
  edition: WLC
  text: וַ/יֵּ֤דַע קַ֨יִן֙ אֶת אִשְׁתּ֔/וֹ וַ/תַּ֖הַר וַ/תֵּ֣לֶד אֶת חֲנ֑וֹךְ וַֽ/יְהִי֙ בֹּ֣נֶה עִ֔יר וַ/יִּקְרָא֙ שֵׁ֣ם הָ/עִ֔יר כְּ/שֵׁ֖ם בְּנ֥/וֹ חֲנֽוֹךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/017.yaml
  text: Cain knew his wife[a], and she conceived and bore Enoch. He was building a city[d][c][b], and he named the city after his son Enoch.
translation:
  language: te
  text: కయీను తన భార్యతో శారీరక సంబంధం కలిగాడు[a]. ఆమె గర్భం దాల్చి హనోకును కన్నది. అతడు ఒక పట్టణాన్ని కడుతూ ఉన్నాడు[b]; తన కుమారుడైన హనోకు పేరు మీద ఆ పట్టణానికి పేరు పెట్టాడు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ అక్షరార్థంగా, “కయీను తన భార్యను తెలుసుకున్నాడు.” ఇది లైంగిక సంబంధాన్ని సూచించే సాధారణ హీబ్రూ నానుడి.
    reason: cultural_note
  - marker: b
    text: 'ఈ హీబ్రూ క్రియా నిర్మాణం కొనసాగుతున్న చర్యను సూచించగలదు. మరో సాధ్యమైన అనువాదం: “అతడు ఒక పట్టణాన్ని కట్టాడు.”'
    reason: lexical_alternative
  - marker: c
    text: హీబ్రూ అక్షరార్థంగా, “తన కుమారుని పేరువలె ఆ పట్టణం పేరును పిలిచాడు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּדַע
  choice: తన భార్యతో కలిశాడు
  rationale: ‘తెలుసుకొను’ అనే మూలార్థం ఇక్కడ లైంగిక సంబంధాన్ని సూచించే హీబ్రూ నానుడి. ఆధునిక తెలుగులో అర్థం సహజంగా, మర్యాదగా స్పష్టమయ్యేలా ‘కలిశాడు’ అని అనువదించబడింది; మూల నానుడి పాదసూచికలో భద్రపరచబడింది.
- source_word: אִשְׁתּוֹ
  choice: తన భార్య
  rationale: אִשָּׁה అనే పదానికి ‘స్త్రీ/భార్య’ అనే అర్థాలు ఉన్నాయి; స్వామ్యప్రత్యయం, సందర్భం కలిపి ఇక్కడ ‘తన భార్య’ సహజమైన అర్థం.
- source_word: וַתַּהַר
  choice: గర్భవతియై
  rationale: గర్భం ధరించడాన్ని తెలిపే సాధారణ క్రియ; తెలుగు కథన ప్రవాహంలో ‘గర్భవతియై’ సంక్షిప్తంగా, గౌరవప్రదంగా ఉంటుంది.
- source_word: וַתֵּלֶד
  choice: కన్నది
  rationale: יָלַד అంటే కనడం లేదా ప్రసవించడం. ‘కన్నది’ ఆధునిక తెలుగు కథనంలో సహజంగా ఉంటుంది.
- source_word: חֲנוֹךְ
  choice: హనోకు
  rationale: హీబ్రూ పేరును తెలుగులో ప్రాచుర్యంలో ఉన్న బైబిలు రూపమైన ‘హనోకు’గా లిప్యంతరీకరించింది.
- source_word: וַיְהִי בֹּנֶה עִיר
  choice: ఒక పట్టణాన్ని కడుతూ ఉన్నాడు
  rationale: היה తో కూడిన בֹּנֶה కృదంత నిర్మాణం కొనసాగుతున్న చర్యను సూచించగలదు. అందువల్ల పూర్తయిన చర్యగా కాక ‘కడుతూ ఉన్నాడు’ అని అనువదించబడింది.
- source_word: עִיר
  choice: పట్టణం
  rationale: עִיר జనావాస కేంద్రమైన పట్టణం/నగరాన్ని సూచిస్తుంది. ఆదికాండపు ఈ సందర్భంలో ‘పట్టణం’ సహజమైన ఆధునిక తెలుగు పదం; దాని పరిమాణాన్ని అనవసరంగా అతిశయింపజేయదు.
- source_word: וַיִּקְרָא שֵׁם הָעִיר כְּשֵׁם בְּנוֹ
  choice: తన కుమారుడైన హనోకు పేరే ఆ పట్టణానికి పెట్టాడు
  rationale: హీబ్రూలో అక్షరార్థంగా ‘తన కుమారుని పేరును బట్టి పట్టణం పేరు పిలిచాడు’ అనే నామకరణ నానుడి ఉంది. తెలుగులో భావాన్ని సహజంగా తెలియజేస్తూ, ‘పేరు’ పునరుక్తిని ‘పేరే’ ద్వారా కొంత ప్రతిబింబించింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టమైన, గౌరవప్రదమైన కథన శైలి. హీబ్రూ లైంగిక నానుడిని ప్రధాన పాఠ్యంలో సహజంగా అందించి, దాని మూలరూపాన్ని పాదసూచికలో ఉంచింది. కొనసాగుతున్న చర్య అనే హీబ్రూ క్రియా సూక్ష్మతను ‘కడుతూ ఉన్నాడు’తో నిలిపింది.
