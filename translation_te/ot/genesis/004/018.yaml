  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళికి తగిన సంక్షిప్తమైన మరియు గౌరవప్రదమైన శైలిని వాడాం. పేర్లను సంప్రదాయ ఆంగ్ల రూపాల నుంచి కాకుండా హీబ్రూ ఆధారంగా లిప్యంతరీకరించాం; పాఠ్యంలో ఉన్న వర్ణక్రమ భేదాన్ని పాదసూచికలో సంరక్షించాం.
