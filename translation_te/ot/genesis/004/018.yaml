  text: וַ/יִּוָּלֵ֤ד לַֽ/חֲנוֹךְ֙ אֶת עִירָ֔ד וְ/עִירָ֕ד יָלַ֖ד אֶת מְחֽוּיָאֵ֑ל וּ/מְחִיּיָאֵ֗ל יָלַד֙ אֶת מְת֣וּשָׁאֵ֔ל וּ/מְתוּשָׁאֵ֖ל יָלַ֥ד אֶת לָֽמֶךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/018.yaml
  text: To Hanok was born Irad[a], and Irad fathered Mehujael, and Mehujael fathered Methushael, and Methushael fathered Lamech.
translation:
  language: te
  text: హనోకుకు ఈరాదు పుట్టాడు; ఈరాదు మెహూయాయేలుకు[a] తండ్రి అయ్యాడు; మెహూయాయేలు మెతూషాయేలుకు తండ్రి అయ్యాడు; మెతూషాయేలు లామెకుకు తండ్రి అయ్యాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ఈ వచనంలోని హీబ్రూ పాఠ్యంలో ఇదే పేరు రెండు వర్ణక్రమ రూపాల్లో ఉంది: మెహూయాయేలు, మెహియ్యాయేలు.'
    reason: textual_variant
lexical_decisions:
- source_word: וַיִּוָּלֵד
  choice: పుట్టాడు
  rationale: ילד నిఫాల్ రూపం మొదటి వాక్యాన్ని కర్మణి భావంలో ఉంచుతుంది; తెలుగులో ‘హనోకుకు ఈరాదు పుట్టాడు’ సహజంగా ఆ భావాన్ని వ్యక్తపరుస్తుంది.
- source_word: לַחֲנוֹךְ
  choice: హనోకుకు
  rationale: ל ఉపసర్గ బిడ్డ ఎవరికీ పుట్టాడో సూచిస్తుంది; హీబ్రూ పేరుకు సమీపమైన లిప్యంతరీకరణను వాడాం.
- source_word: עִירָד
  choice: ఈరాదు
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు ధ్వని, లిపి పద్ధతులకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: יָלַד
  choice: కన్నాడు
  rationale: వంశావళి సందర్భంలో Qal ילד తండ్రిగా జన్మనివ్వడాన్ని సూచిస్తుంది; ‘కన్నాడు’ సంక్షిప్తమైన, ప్రస్తుత తెలుగులో అర్థమయ్యే వంశావళి ప్రయోగం.
- source_word: מְחוּיָאֵל / מְחִיּיָאֵל
  choice: మెహూయాయేలు
  rationale: ఒకే పేరుకు వచనంలో ఉన్న రెండు వర్ణక్రమ రూపాల్లో మొదటి రూపాన్ని ప్రధాన పాఠ్యంలో ఏకరీతిగా వాడి, రెండవ రూపాన్ని పాదసూచికలో నిలిపాం.
- source_word: מְתוּשָׁאֵל
  choice: మెతూషాయేలు
  rationale: హీబ్రూ రూపాన్ని ఆధారంగా చేసుకున్న తెలుగు లిప్యంతరీకరణ.
- source_word: לָמֶךְ
  choice: లెమెకు
  rationale: హీబ్రూ రూపాన్ని ఆధారంగా చేసుకున్న తెలుగు లిప్యంతరీకరణ.
