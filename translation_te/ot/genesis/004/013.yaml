id: GEN.4.13
reference: Genesis 4:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר קַ֖יִן אֶל יְהוָ֑ה גָּד֥וֹל עֲוֺנִ֖/י מִ/נְּשֹֽׂא־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/013.yaml
  text: And Cain said to Yahweh[a], “My iniquity is too great to bear.”
translation:
  language: te
  text: కయీను యెహోవాతో, “నా దోషం నేను భరించలేనంత పెద్దది[a]” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నా అపరాధభారం నేను భరించలేనంత పెద్దది”; లేదా, “నా శిక్ష నేను భరించలేనంత పెద్దది.” మరో విధంగా, “నా దోషం క్షమించలేనంత పెద్దది.” హీబ్రూ పదం దోషాన్ని, అపరాధభారాన్ని లేదా దానికి వచ్చే శిక్షను సూచించవచ్చు; క్రియకు ‘భరించు/మోయు’ అనే అర్థంతో పాటు, కొన్ని సందర్భాల్లో ‘క్షమించు’ అనే అర్థమూ ఉంటుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అన్నాడు
  rationale: హీబ్రూ కథన ప్రవాహంలోని సాధారణ వావ్-కన్సెక్యూటివ్ రూపం; తెలుగులో సహజమైన కథన క్రమాన్ని ఇస్తుంది.
- source_word: קַיִן
  choice: కయీను
  rationale: వ్యక్తినామాన్ని ప్రామాణిక తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించింది.
- source_word: אֶל
  choice: తో
  rationale: మాట ఎవరిని ఉద్దేశించి చెప్పబడిందో తెలుగులో సహజంగా సూచిస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన టెట్రాగ్రామాటన్‌ను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే లిప్యంతరీకరణతో అందించింది.
- source_word: גָּדוֹל
  choice: భరించలేనంత గొప్పది
  rationale: తదనంతర מִן నిర్మాణంతో కలిసి పరిమితిని మించిన పరిమాణాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: עֲוֺנִי
  choice: నా దోషం
  rationale: עָוֹן యొక్క అపరాధం/దోషం అనే ప్రాథమిక భావాన్ని ప్రధాన పాఠ్యంలో నిలుపుతుంది; శిక్ష లేదా దోషభారం అనే సందర్భోచిత అర్థాలను పాదసూచికలో ఉంచుతుంది.
- source_word: מִנְּשֹׂא
  choice: భరించలేనంత
  rationale: נָשָׂא యొక్క ‘మోయు/భరించు’ భావాన్ని, מִן ద్వారా వ్యక్తమయ్యే ‘మించిన’ భావంతో కలిపి సహజ తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: עֲוֺנִי מִנְּשֹׂא అనే పదబంధంలోని ద్వంద్వార్థం
  choice: “నా దోషం భరించలేనంత గొప్పది”
  alternative: “నా శిక్ష భరించలేనంత గొప్పది”; లేదా “నా దోషం క్షమించలేనంత గొప్పది”
  rationale: עָוֹן అనే పదం దోషం, దోషభారం లేదా దానికి కలిగే శిక్షను సూచించగలదు; נָשָׂא ‘భరించు’తో పాటు కొన్ని సందర్భాల్లో ‘క్షమించు’ అని కూడా అర్థమవుతుంది. ప్రధాన పాఠ్యం మూలంలోని నైతిక పదాన్ని నేరుగా నిలుపుతుండగా, సందర్భం సూచించే ఇతర అర్థాలను పాదసూచిక సంరక్షిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని సంక్షిప్తతను కాపాడుతూ నిజమైన పదార్థ ద్వంద్వార్థాన్ని పాదసూచికలో స్పష్టంగా నిలిపింది.
