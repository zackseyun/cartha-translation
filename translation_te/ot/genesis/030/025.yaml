  yaml_path: translation/ot/genesis/030/025.yaml
  text: And it happened, when Rachel had borne Joseph, that Jacob said to Laban, “Send me away, that I may go to my own place and to my own land.”
translation:
  language: te
  text: రాహేలు యోసేపును కన్నప్పుడు, యాకోబు లాబానుతో, “నన్ను పంపివేయి; నేను నా స్థలానికీ నా దేశానికీ వెళ్లనివ్వు” అన్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שַׁלְּחֵנִי
  choice: నన్ను పంపివేయి
  rationale: పియేల్ ఆజ్ఞార్థక రూపంలోని ‘విడిచిపెట్టు/పంపివేయి’ అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: מְקוֹמִי
  choice: నా సొంత స్థలానికి
  rationale: మొదటి పురుష ఏకవచన స్వామ్య ప్రత్యయాన్ని స్పష్టంగా నిలుపుతూ, యాకోబు తనకు చెందిన నివాసస్థలానికి తిరిగి వెళ్లాలనే భావాన్ని తెలియజేస్తుంది.
- source_word: אַרְצִי
  choice: నా దేశానికి
  rationale: אֶרֶץ ఇక్కడ యాకోబు స్వదేశాన్ని సూచిస్తుంది; ‘దేశం’ సందర్భానికి సహజమైన అర్థం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. హీబ్రూ וַיְהִי...כַּאֲשֶׁר నిర్మాణాన్ని తెలుగులో సహజంగా ‘...తరువాత’గా అందించి, సంఘటనల కాలక్రమాన్ని కాపాడాం.
