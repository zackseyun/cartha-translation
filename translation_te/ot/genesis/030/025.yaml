- from: రాహేలు యోసేపును కన్న తరువాత, యాకోబు లాబానుతో, “నన్ను పంపివేయి. నేను నా సొంత స్థలానికి, నా దేశానికి వెళ్లాలి” అన్నాడు.
  to: రాహేలు యోసేపును కన్నప్పుడు, యాకోబు లాబానుతో, “నన్ను పంపివేయి; నేను నా స్థలానికీ నా దేశానికీ వెళ్లనివ్వు” అన్నాడు.
  rationale: The revision replaces the necessity nuance of 'వెళ్లాలి' with a natural Telugu request that reflects the Hebrew cohortative following Jacob's imperative request to Laban. It also uses 'కన్నప్పుడు' to retain the source's temporal 'when' construction. No footnotes are required.
