  yaml_path: translation/ot/genesis/030/024.yaml
  text: And she called his name Joseph[a], saying, “May Yahweh add to me another son.”
translation:
  language: te
  text: ఆమె అతనికి యోసేపు[a] అని పేరు పెట్టి, “యహ్వే నాకు ఇంకొక కుమారుణ్ణి దయచేయుగాక” అంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “యోసేపు” అనే పేరు హీబ్రూలో “అతడు చేర్చును” లేదా “చేర్చుగాక” అనే అర్థమిచ్చే క్రియతో పదప్రయోగం కలిగి ఉంది.
    reason: యోసేపు అనే పేరుకు, యహ్వే మరొక కుమారుణ్ణి చేర్చాలనే కోరికను తెలిపే హీబ్రూ క్రియకు మధ్య ఉన్న పదప్రయోగాన్ని స్పష్టంచేయడానికి.
lexical_decisions:
- source_word: וַתִּקְרָא אֶת־שְׁמוֹ
  choice: ఆమె అతనికి ... అని పేరు పెట్టి
  rationale: హీబ్రూ నామకరణ సూత్రం అక్షరార్థంగా ‘అతని పేరు పిలిచింది.’ ఆధునిక తెలుగులో ‘అతనికి ... అని పేరు పెట్టి’ సహజంగా ఉండి, నామకరణ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: יוֹסֵף
  choice: యోసేపు
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం; పాదటిప్పణి ద్వారా హీబ్రూ పదప్రయోగాన్ని నిలుపుతుంది.
- source_word: לֵאמֹר
  choice: అంది
  rationale: ప్రత్యక్ష వాక్యాన్ని పరిచయం చేసే హీబ్రూ ఉద్ధరణ రూపాన్ని సహజమైన తెలుగు కథనరీతిలో వ్యక్తపరుస్తుంది.
- source_word: יֹסֵף
  choice: చేర్చుగాక
  rationale: יסף అనే ధాతువు హిఫిల్ రూపంలో ‘చేర్చు/మరింత ఇవ్వు’ అనే అర్థం ఇస్తుంది. సందర్భంలో ఇది కోరిక లేదా ప్రార్థన; అందువల్ల ‘చేర్చుగాక’ ఆ భావాన్ని, యోసేపు పేరుతోనున్న శబ్దసామ్యాన్ని నిలుపుతుంది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవనామమైన టెట్రాగ్రామాటన్‌ను బిరుదుతో భర్తీ చేయకుండా వ్యక్తిగత నామంగా లిప్యంతరీకరించింది.
- source_word: לִי
  choice: నాకు
  rationale: לִי లోని ప్రయోజనార్థక/సంబంధార్థక భావాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: בֵּן אַחֵר
  choice: మరో కుమారుణ్ణి
  rationale: בֵּן ప్రత్యేకంగా ‘కుమారుడు,’ אַחֵר ‘మరొక’ అని అర్థం; ‘మరో కుమారుణ్ణి’ సహజమైన, ఖచ్చితమైన అనువాదం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దానిని బిరుదుగా మార్చకుండా ‘యహ్వే’గా ఇవ్వడం మూలంలోని ప్రత్యేక నామాన్ని కాపాడుతుంది.
- issue: יֹסֵף క్రియ యొక్క భావం
  choice: కోరిక/ప్రార్థనగా ‘చేర్చుగాక’
  alternative: ‘చేర్చుతాడు’ లేదా ‘చేర్చాడు’
  rationale: నామకరణ వివరణలో ఈ రూపం రాహేలు వ్యక్తం చేసిన ఆకాంక్షగా సహజంగా అర్థమవుతుంది. అయితే రూపానికి భవిష్యత్ ప్రకటన భావం సాధ్యమైనందున ఆ ప్రత్యామ్నాయాన్ని పూర్తిగా నిరాకరించకుండా గమనించాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. ‘పేరు పెట్టి’ అనే రూపం అక్షరానువాదమైన ‘అతని పేరు పిలిచి’ కంటే సామాన్య పాఠకులకు సహజం. కోరికను సూచించేందుకు ‘చేర్చుగాక’ వాడబడింది.
