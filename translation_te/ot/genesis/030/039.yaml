translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యే, గౌరవప్రదమైన శైలి. హెబ్రీ సమష్టి నామవాచక పునరుక్తిని నిలిపి, గుర్తుల రకాల మధ్య ఉన్న పరిమిత అర్థభేదాన్ని పాదసూచికల్లో భద్రపరిచాం.
