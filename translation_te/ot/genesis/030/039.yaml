  text: וַ/יֶּחֱמ֥וּ הַ/צֹּ֖אן אֶל הַ/מַּקְל֑וֹת וַ/תֵּלַ֣דְןָ הַ/צֹּ֔אן עֲקֻדִּ֥ים נְקֻדִּ֖ים וּ/טְלֻאִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/039.yaml
  text: So the flock mated by the rods[a], and the flock bore striped, speckled[b], and spotted young.
translation:
  language: te
  text: అలా మంద కర్రల ఎదుట జతకట్టింది; ఆ మంద చారలుగల[a], చుక్కలుగల, మచ్చలుగల[b] పిల్లలను కనింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘చారలుగల’ (עֲקֻדִּים) అనే పదాన్ని ‘పట్టీలుగల’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘చుక్కలుగల’ (נְקֻדִּים), ‘మచ్చలుగల’ (טְלֻאִים) అనే పదాల మధ్య తేడా సుమారైనదే; రెండవ పదాన్ని ‘పెద్ద మచ్చలుగల,’ ‘అసమాన మచ్చలుగల,’ లేదా ‘మచ్చల మేళవింపుగల’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּחֱמוּ
  choice: జతకట్టింది
  rationale: ఈ క్రియ అక్షరార్థంగా వేడిలోకి రావడాన్ని సూచించినా, పశువుల సంతానోత్పత్తి సందర్భంలో జతకట్టడాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘జతకట్టింది’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: הַצֹּאן
  choice: మంద
  rationale: צאן అనేది ప్రధానంగా గొర్రెలు, మేకలతో కూడిన చిన్న పశువుల సమూహాన్ని సూచించే సమష్టి నామవాచకం. ‘మంద’ దాని సమష్టి భావాన్ని సహజంగా నిలుపుతుంది; రెండు ఉపవాక్యాల్లోనూ దాన్ని పునరుక్తి చేయడం హెబ్రీ పాఠాన్ని అనుసరిస్తుంది.
- source_word: אֶל הַמַּקְלוֹת
  choice: కర్రల ఎదుట
  rationale: אֶל సాధారణంగా ‘వైపు/దగ్గర’ అనే అర్థాలు ఇవ్వగలదు; చుట్టుపక్కల వచనాల్లోని దృశ్య ఏర్పాటును బట్టి ‘కర్రల ఎదుట’ సందర్భానికి తగినదిగా ఉంది, కారణ సంబంధాన్ని అదనంగా చేర్చదు.
- source_word: וַתֵּלַדְןָ
  choice: పిల్లలను కనింది
  rationale: ילד ప్రసవించడాన్ని సూచిస్తుంది. మూలంలో సంతానాన్ని తెలిపే నామవాచకం ప్రత్యక్షంగా లేకపోయినా, తెలుగులో వాక్యం స్పష్టంగా ఉండేందుకు ‘పిల్లలను’ చేర్చడం సహజం.
- source_word: עֲקֻדִּים
  choice: చారలుగల
  rationale: ఈ పదం పట్టీలు లేదా చారల వంటి గుర్తులుగల జంతువులను సూచిస్తుంది. ‘చారలుగల’ ఆధునిక తెలుగులో స్పష్టమైన సమానార్థకం.
- source_word: נְקֻדִּים
  choice: చుక్కలుగల
  rationale: ఈ పదం చిన్న చుక్కలు లేదా సూక్ష్మ మచ్చలను సూచిస్తుంది. తరువాతి పదంలోని పెద్ద లేదా అసమాన మచ్చల భావం నుంచి కొంత భేదాన్ని నిలుపుతుంది.
- source_word: וּטְלֻאִים
  choice: పొడలుగల
  rationale: ఈ విశేషణం పెద్ద, అసమాన మచ్చలు లేదా రంగు పొడలను సూచిస్తుంది. ‘పొడలుగల’ ఆ భావాన్ని సంక్షిప్తంగా తెలుపుతుంది; సమీప పదంతో గల అర్థభేదం ఖచ్చితమైనది కాదని పాదసూచికలో పేర్కొనబడింది.
