  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/תֵּ֣רֶא רָחֵ֗ל כִּ֣י לֹ֤א יָֽלְדָה֙ לְ/יַעֲקֹ֔ב וַ/תְּקַנֵּ֥א רָחֵ֖ל בַּ/אֲחֹתָ֑/הּ וַ/תֹּ֤אמֶר אֶֽל יַעֲקֹב֙ הָֽבָ/ה לִּ֣/י בָנִ֔ים וְ/אִם אַ֖יִן מֵתָ֥ה אָנֹֽכִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/001.yaml
  text: When Rachel saw that she had borne no children to Jacob[a], she became jealous of her sister, and she said to Jacob, “Give me children[b], or I will die!”
translation:
  language: te
  text: రాహేలు యాకోబుకు పిల్లలను కనలేదని చూసినప్పుడు, ఆమె తన సోదరిపట్ల అసూయ చెందింది. ఆమె యాకోబుతో, “నాకు పిల్లలను ఇవ్వు[a]; లేకపోతే నేను చనిపోతాను!” అంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పదానికి అక్షరార్థం ‘కుమారులను’; ఈ సందర్భంలో అది సంతానాన్ని సాధారణంగా సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּרֶא רָחֵל כִּי לֹא יָלְדָה לְיַעֲקֹב
  choice: యాకోబుకు తాను పిల్లలను కనలేదని రాహేలు చూసినప్పుడు
  rationale: יָלַד స్త్రీని కర్తగా తీసుకున్నప్పుడు ‘కను/ప్రసవించు’ అని అర్థం. సందర్భంలో సూచితమైన సంతానాన్ని ‘పిల్లలు’గా వ్యక్తం చేశాం; לְיַעֲקֹב సంబంధాన్ని ‘యాకోబుకు’గా నిలిపాం. వావ్ వరుసలోని కారణ–కాల సంబంధాన్ని సహజమైన తెలుగు ‘చూసినప్పుడు’తో తెలిపాం.
- source_word: וַתְּקַנֵּא רָחֵל בַּאֲחֹתָהּ
  choice: ఆమె తన సోదరిపట్ల అసూయపడింది
  rationale: קנא ఇక్కడ సోదరి సంతానవతిగా ఉండటాన్ని బట్టి కలిగిన అసూయను సూచిస్తుంది. ‘సోదరి’ అన్న సాధారణ బంధపదాన్ని ఉంచి, లేయా పేరును అనువాదంలో చేర్చలేదు. రెండోసారి వచ్చిన ‘రాహేలు’ను సహజ తెలుగు కథనశైలిలో ‘ఆమె’గా ఇచ్చాం.
- source_word: הָבָה לִּי בָנִים
  choice: నాకు పిల్లలను ఇవ్వు
  rationale: בָנִים యొక్క ప్రత్యక్ష రూపార్థం ‘కుమారులు’; అయితే సంతానలేమి సందర్భంలో అది సంతానాన్ని విస్తృతంగా సూచించగలదు. సాధారణ పాఠకునికి ఉద్దేశం స్పష్టంగా ఉండేందుకు ‘పిల్లలు’ ఎంచుకుని, రూపార్థాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: וְאִם אַיִן מֵתָה אָנֹכִי
  choice: లేకపోతే నేను చచ్చిపోతాను
  rationale: וְאִם אַיִן తెచ్చే తీవ్రమైన ప్రత్యామ్నాయాన్ని ‘లేకపోతే’ వ్యక్తం చేస్తుంది. מֵתָה אָנֹכִי యొక్క తీవ్రతను మానసిక వివరణగా మార్చకుండా, ప్రత్యక్షమైన భవిష్యదర్థ వాక్యంగా నిలిపాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కథనశైలిని వాడాం. రాహేలు మాటలోని ఆవేదనను మృదువుపరచకుండా ‘చచ్చిపోతాను’ అని నేరుగా ఉంచాం.
