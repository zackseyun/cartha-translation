review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents Rachel's perception of her childlessness in relation to Jacob, her jealousy toward her sister, and her urgent demand. ‘పిల్లలను’ is a defensible contextual rendering of בָּנִים, with the literal ‘sons’ retained in a footnote. The Hebrew's repeated name may naturally be rendered with a pronoun in Telugu.
  naturalness: The overall Telugu is clear and modern. However, ‘చచ్చిపోతాను’ is comparatively colloquial and stark for the elevated narrative register. ‘చనిపోతాను’ preserves the desperate directness of מֵתָה אָנֹכִי while better fitting standard biblical Telugu prose. Reordering the opening slightly also makes Rachel the clear subject from the outset.
  terminology: ‘సోదరి,’ ‘అసూయ,’ and ‘పిల్లలు’ are appropriate. The footnote correctly records the lexical sense ‘sons’ without forcing a male-only meaning into this childbearing context.
  issues:
  - severity: low
    issue: Register of ‘చచ్చిపోతాను’
    rationale: Though it conveys the force, it is more colloquial than the surrounding formal narrative. ‘చనిపోతాను’ is standard, direct, and equally faithful.
  - severity: low
    issue: Opening-clause word order
    rationale: Placing ‘రాహేలు’ first yields a smoother Telugu clause and makes the subject immediately clear, without altering meaning.
