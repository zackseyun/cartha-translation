  terminology: 'యాకోబు, పోప్లరు, బాదం, and చీనారు are suitable. The lexical uncertainty for all three tree identifications should be anchored consistently: the draft lacks the relevant almond/hazel note, while the plane-tree note is currently attached as b.'
