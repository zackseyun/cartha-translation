  register: ఆధునిక ప్రామాణిక తెలుగు; గ్రామీణ కార్యాన్ని స్పష్టంగా చూపించే సహజమైన పదజాలంతో, చెట్ల గుర్తింపులో ఉన్న మూలభాషా అనిశ్చితిని పాదసూచికల్లో నిలిపాం. ప్రధాన వాక్యంలో ప్రతి పాదసూచిక గుర్తు సంబంధిత చెట్టు పేరు వెంట ఉంచబడింది.
