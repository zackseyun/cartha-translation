  text: וַ/יִּֽקַּֽח ל֣/וֹ יַעֲקֹ֗ב מַקַּ֥ל לִבְנֶ֛ה לַ֖ח וְ/ל֣וּז וְ/עֶרְמ֑וֹן וַ/יְפַצֵּ֤ל בָּ/הֵן֙ פְּצָל֣וֹת לְבָנ֔וֹת מַחְשֹׂף֙ הַ/לָּבָ֔ן אֲשֶׁ֖ר עַל הַ/מַּקְלֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/037.yaml
  text: Then Jacob took for himself fresh rods of poplar[a], almond, and plane tree, and peeled white stripes in them[c][b], exposing the white that was on the rods.
translation:
  language: te
  text: అప్పుడు యాకోబు పచ్చి పోప్లరు[a], బాదం[b], చీనారు[c] చెట్ల కొమ్మలను తీసుకొని, వాటి బెరడును చారలుగా ఒలిచి, కొమ్మలలోని తెల్లని భాగం తెల్లని చారలుగా కనిపించేలా చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పచ్చి స్టోరాక్స్’; לִבְנֶה అనే చెట్టు యొక్క ఖచ్చితమైన గుర్తింపు అనిశ్చితం, అయితే ‘పోప్లరు’ అనేది సాధారణ అనువాదం.
    reason: lexical_alternative
  - marker: b
    text: పాత అనువాదాల్లో దీనిని తరచుగా ‘హేజల్ చెట్టు’ అని అనువదించారు; అయితే ‘బాదం చెట్టు’ అనే గుర్తింపు ఎక్కువ సంభావ్యమైనది.
    reason: lexical_alternative
  - marker: c
    text: పాత అనువాదాల్లో దీనిని కొన్నిసార్లు ‘చెస్ట్నట్ చెట్టు’ అని అనువదించారు; ‘ప్లేన్ చెట్టు’ (చీనారు) అనే గుర్తింపు ఎక్కువ సంభావ్యమైనది.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַקַּל
  choice: కొమ్మలు
  rationale: ఇక్కడ చెట్లనుంచి కోసిన పచ్చి కొమ్మలు ఉద్దేశించబడ్డాయి; ఆధునిక తెలుగులో ‘కొమ్మలు’ సహజంగా, సందర్భోచితంగా ఉంది.
- source_word: לִבְנֶה לַח
  choice: లేత పోప్లరు
  rationale: לַח కొత్తగా కోసిన, ఇంకా ఎండని స్థితిని సూచిస్తుంది. לִבְנֶהను సాధారణంగా పోప్లరు చెట్టుగా గుర్తిస్తారు, అయితే ఖచ్చిత గుర్తింపు అనిశ్చితం.
- source_word: לוּז
  choice: బాదం
  rationale: ఈ హెబ్రీ పదానికి పాత అనువాదాల్లో కనిపించే హేజల్ కంటే బాదం చెట్టు అనే గుర్తింపే ఎక్కువ సంభావ్యమైనది.
- source_word: עֶרְמוֹן
  choice: చీనారు
  rationale: ఈ పదం ప్లేన్ చెట్టును సూచిస్తుందని సాధారణంగా భావిస్తారు; తెలుగులో దానికి వాడుకలో ఉన్న పేరు ‘చీనారు’.
- source_word: וַיְפַצֵּל ... פְּצָלוֹת לְבָנוֹת
  choice: బెరడును చారలుగా ఒలిచి
  rationale: యాకోబు బెరడులో కొన్ని భాగాలను తొలగించి తెల్లని చారలు కనిపించేలా చేసిన కార్యాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: מַחְשֹׂף הַלָּבָן אֲשֶׁר עַל הַמַּקְלוֹת
  choice: కొమ్మలలోని తెల్లని భాగం బయటపడేలా చేశాడు
  rationale: బెరడు ఒలవడం వల్ల లోపలి తెల్లని కలప కనిపించిందనే భావాన్ని స్పష్టంగా వ్యక్తపరుస్తుంది; హెబ్రీలోని עַל‌ను సందర్భానుసారంగా సహజ తెలుగులో అందిస్తుంది.
