  text: וַ/יִּזְכֹּ֥ר אֱלֹהִ֖ים אֶת רָחֵ֑ל וַ/יִּשְׁמַ֤ע אֵלֶ֨י/הָ֙ אֱלֹהִ֔ים וַ/יִּפְתַּ֖ח אֶת רַחְמָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/022.yaml
  text: Then God remembered Rachel[b][a], and God listened to her and opened her womb.
translation:
  language: te
  text: అప్పుడు దేవుడు రాహేలును జ్ఞాపకం చేసుకున్నాడు; దేవుడు ఆమెను విని,[b] ఆమె గర్భాన్ని తెరిచాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘రాహేలును పట్టించుకొని’ లేదా ‘రాహేలుపై అనుకూల దృష్టి ఉంచి.’ ఇక్కడ ‘జ్ఞాపకం చేసుకోవడం’ అంటే దేవుడు ఆమెను మరచిపోయాడని కాదు; ఆమెపై అనుకూల దృష్టి ఉంచి చర్య తీసుకున్నాడని తెలిపే బైబిలు నుడికారం.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘ఆమెను ఆలకించి’ లేదా ‘ఆమె మాట విని.’ మూలభాషలో ‘మొర’కు ప్రత్యేక పదం లేదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְכֹּר
  choice: జ్ఞాపకం చేసుకొని
  rationale: זכר అనే క్రియను యథార్థ బైబిలు నుడికారంగా నిలుపుతుంది. ఇక్కడ అది దేవుడు మరచిపోయాడని కాక, రాహేలుపై అనుకూల దృష్టి ఉంచి కార్యానికి పూనుకున్నాడని సూచిస్తుంది.
- source_word: אֱלֹהִים
  choice: దేవుడు
  rationale: మూడు క్రియలూ ఏకవచనంలో ఉన్నాయి; అందువల్ల ఇది ఏకైక దేవుణ్ణే సూచిస్తుంది.
- source_word: אֶת רָחֵל
  choice: రాహేలును
  rationale: אֶת ప్రత్యక్ష కర్మను సూచిస్తుంది; רָחֵל అనే పేరును తెలుగు వాడుకకు తగినట్లు రాహేలు అని లిప్యంతరీకరించాం.
- source_word: וַיִּשְׁמַע אֵלֶיהָ
  choice: ఆమె మొర ఆలకించి
  rationale: שׁמע אֶל అంటే శ్రద్ధగా వినడం లేదా విని స్పందించడం. సందర్భంలో రాహేలు దేవునికి చేసిన విన్నపం అంతర్లీనంగా ఉన్నందున ‘మొర ఆలకించి’ సహజంగా ఉంటుంది; అయితే మూలంలో ‘మొర’కు ప్రత్యేక పదం లేదు కాబట్టి ప్రత్యామ్నాయం పాదసూచికలో ఇచ్చాం.
- source_word: וַיִּפְתַּח
  choice: తెరిచాడు
  rationale: פתח యొక్క concrete భావమైన ‘తెరవడం’ను నిలుపుతూ హీబ్రూ నుడికారాన్ని కాపాడుతుంది.
- source_word: רַחְמָהּ
  choice: ఆమె గర్భాన్ని
  rationale: רֶחֶם అంటే గర్భం లేదా గర్భాశయం. ‘గర్భాన్ని తెరవడం’ అనే బైబిలు నుడికారాన్ని, ‘గర్భం ధరించేలా చేశాడు’ అని వివరణాత్మకంగా మార్చకుండా నిలిపాం.
- source_word: וַ
  choice: అప్పుడు / -కొని, -ించి
  rationale: మొదటి waw-consecutive కథన క్రమాన్ని ముందుకు నడిపిస్తుంది; తెలుగులో ‘అప్పుడు’తో ఆ క్రమాన్ని చూపించి, తరువాతి సమన్వయ క్రియలను సహజమైన అసమాపక క్రియారూపాలతో కలిపాం.
theological_decisions:
- issue: దేవుడు రాహేలును ‘జ్ఞాపకం చేసుకోవడం’ అనే మానవరూపక భాష
  choice: ప్రధాన పాఠ్యంలో ‘జ్ఞాపకం చేసుకొని’ అనే బైబిలు నుడికారాన్ని నిలుపడం
  alternative: రాహేలును పట్టించుకొని / రాహేలుపై దృష్టి ఉంచి
  rationale: హీబ్రూ మాట దేవుడు అంతకు ముందు రాహేలును మరచిపోయాడని తప్పనిసరిగా సూచించదు; ఆమెపై అనుకూల దృష్టి ఉంచి చర్య తీసుకున్నాడనే కథనార్థం ఉంది. అయినా ముఖ్యమైన బైబిలు నుడికారాన్ని వివరణగా మార్చకుండా ప్రధాన పాఠ్యంలో నిలిపి, స్పష్టీకరణను పాదసూచికలో ఇచ్చాం.
- issue: దేవుడు రాహేలు చెప్పినది వినడం మరియు స్పందించడం మధ్య ఉన్న భావవ్యాప్తి
  choice: ‘ఆమె మొర ఆలకించి’
  alternative: ఆమె చెప్పినది విని / ఆమె మాట ఆలకించి
  rationale: שׁמע אֶל శ్రద్ధగా వినడం నుంచి విని స్పందించడం వరకు భావాన్ని కలిగి ఉండవచ్చు. ‘జవాబిచ్చాడు’ అని అనువదించడం మూలం కంటే అధిక నిర్ధారణ అవుతుంది; ‘ఆలకించాడు’ ఆ సంబంధాత్మక భావాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన కథన ప్రవాహం కోసం ‘అప్పుడు’తో ప్రారంభించి, వరుస క్రియలను ‘జ్ఞాపకం చేసుకొని … ఆలకించి … తెరిచాడు’గా అమర్చాం. ‘గర్భాన్ని తెరిచాడు’ అనే గంభీరమైన బైబిలు నుడికారాన్ని ఉద్దేశపూర్వకంగా నిలిపాం. అన్ని పాదసూచిక సూచికలు ప్రధాన పాఠ్యంలో ఉన్నాయి.
