source:
  edition: WLC
  text: וַ/תֹּ֣אמֶר לֵאָ֔ה בְּ/אָשְׁרִ֕/י כִּ֥י אִשְּׁר֖וּ/נִי בָּנ֑וֹת וַ/תִּקְרָ֥א אֶת שְׁמ֖/וֹ אָשֵֽׁר־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/013.yaml
  text: Then Leah said[b][a], “Happy am I! For women will call me happy.” So she called his name Asher.
translation:
  language: te
  text: అప్పుడు లేయా, “నేనెంత సంతోషవంతురాలినో! స్త్రీలు నన్ను సంతోషవంతురాలినని అంటారు” అంది. కాబట్టి ఆమె అతనికి ఆషేరు[a] అని పేరు పెట్టింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ఆషేరు” అనే పేరు, లేయా పలికిన “సంతోషవంతురాలినో,” “సంతోషవంతురాలినని అంటారు” అనే హీబ్రూ పదాలతో పదచమత్కారాన్ని కలిగిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאָשְׁרִי
  choice: నేను ఎంత సంతోషవంతురాలిని!
  rationale: אֹשֶׁר భావించే సంతోషం/ధన్యతను, మొదటి పురుష ఏకవచన ప్రత్యయాన్ని, లేయా పలికిన ఉత్సాహపూర్వక స్వరాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אִשְּׁרוּנִי
  choice: నన్ను సంతోషవంతురాలని అంటారు
  rationale: Piel రూపంలోని ‘సంతోషవంతురాలని ప్రకటించు లేదా పిలుచు’ అనే భావాన్ని నిలుపుతూ, ముందున్న ‘సంతోషవంతురాలిని’తో పదసంబంధాన్ని కాపాడుతుంది.
- source_word: בָּנוֹת
  choice: స్త్రీలు
  rationale: పదశః ‘కుమార్తెలు’ అయినప్పటికీ, ఇక్కడ అది సాధారణంగా స్త్రీలను సూచించే హీబ్రూ వాడుక; సందర్భార్థాన్ని సహజ తెలుగులో ఇస్తుంది.
- source_word: וַתִּקְרָא אֶת־שְׁמוֹ אָשֵׁר
  choice: కాబట్టి ఆమె అతనికి ఆషేరు అని పేరు పెట్టింది
  rationale: హీబ్రూ నామకరణ సూత్రాన్ని సహజమైన తెలుగు కథనశైలిలో అందిస్తుంది.
- source_word: אָשֵׁר
  choice: ఆషేరు
  rationale: వ్యక్తి పేరును అనువదించకుండా హీబ్రూ ఉచ్చారణకు సమీపంగా లిప్యంతరీకరించింది; పేరులోని పదచమత్కారాన్ని పాదటిప్పణి వివరిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. בָּנוֹת యొక్క పదశః అర్థమైన ‘కుమార్తెలు’కు బదులుగా ఇక్కడి విస్తృత సామాజిక అర్థమైన ‘స్త్రీలు’ను వాడింది. హీబ్రూ పదచమత్కారం తెలుగులో పూర్తిగా పునరుత్పత్తి కానందున [a] పాదటిప్పణిలో వివరించింది.
