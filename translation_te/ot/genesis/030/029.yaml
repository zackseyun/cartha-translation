source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֵלָ֔י/ו אַתָּ֣ה יָדַ֔עְתָּ אֵ֖ת אֲשֶׁ֣ר עֲבַדְתִּ֑י/ךָ וְ/אֵ֛ת אֲשֶׁר הָיָ֥ה מִקְנְ/ךָ֖ אִתִּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/029.yaml
  text: He said to him[a], “You know how I have served you, and how your livestock has been with me.”
translation:
  language: te
  text: అతడు అతనితో, “నేను నీకు ఎలా సేవ చేశానో, నీ పశుసంపద నా దగ్గర ఎలా ఉండేదో నీకు తెలుసు[a]” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, మరింత అక్షరార్థంగా, “నీ పశుసంపద నా దగ్గర ఎలా ఉండేదో.” ఈ హీబ్రూ ప్రయోగం పశువులు కేవలం యాకోబు దగ్గర ఉన్నాయని కాక, అతని సంరక్షణలో అవి ఎలా వృద్ధి చెందాయో సూచిస్తుండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלָיו
  choice: అతడు అతనితో … అన్నాడు
  rationale: హీబ్రూ కథన క్రమాన్ని సహజమైన తెలుగు ప్రత్యక్ష సంభాషణ నిర్మాణంలో వ్యక్తం చేస్తుంది.
- source_word: אַתָּה יָדַעְתָּ
  choice: నీకు తెలుసు
  rationale: స్వతంత్ర సర్వనామంలోని స్వల్ప ఉద్ఘాటనను తెలుగు సందర్భం, వాక్యక్రమం సహజంగా మోస్తాయి; ‘నీకే తెలుసు’ అంటే అనవసరమైన ప్రత్యేకార్థం రావచ్చు.
- source_word: אֵת אֲשֶׁר עֲבַדְתִּיךָ
  choice: నేను నీకు ఎలా సేవ చేశానో
  rationale: עבד ఇక్కడ ఒకరి కోసం శ్రమించడం, సేవ చేయడం అనే భావాలను కలిగి ఉంది; ‘సేవ చేశాను’ ఆ రెండింటినీ గౌరవప్రదంగా నిలుపుతుంది.
- source_word: מִקְנְךָ
  choice: నీ పశుసంపద
  rationale: מִקְנֶה మందలు, పశువులు వంటి గృహపాలిత జంతువులను సమూహంగా సూచిస్తుంది; ‘పశుసంపద’ విస్తృతమైన సహజ తెలుగు పదం.
- source_word: הָיָה מִקְנְךָ אִתִּי
  choice: నా దగ్గర నీ పశుసంపద ఎలా ఉందో
  rationale: మూలంలోని ‘నాతో/నా దగ్గర ఉండడం’ అనే రూపాన్ని నిలుపుతూ, అది యాకోబు సంరక్షణలో పశుసంపద పరిస్థితి లేదా అభివృద్ధిని సూచించవచ్చనే సందర్భార్థాన్ని ప్రధాన వచనంలో అతిగా నిర్ధారించదు.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ప్రత్యక్ష సంభాషణ. మూలంలోని అస్పష్టతను ప్రధాన వచనం మరియు పాదటిప్పణి ద్వారా నిలిపింది.
