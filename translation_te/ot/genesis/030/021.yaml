translation:
  language: te
  text: ఆ తర్వాత ఆమె ఒక కుమార్తెను కని, ఆమెకు దీనా అని పేరు పెట్టింది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אַחַר
  choice: ఆ తర్వాత
  rationale: ముందు చెప్పిన జననాల అనంతర క్రమాన్ని సూచించే సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: יָלְדָה
  choice: కని
  rationale: ילד అనే క్రియ యొక్క స్త్రీలింగ ఏకవచన రూపాన్ని, ‘ఒక కుమార్తెను’ అనే ప్రత్యక్ష కర్మతో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: בַּת
  choice: ఒక కుమార్తెను
  rationale: అనిర్దిష్ట ఏకవచన నామవాచకాన్ని తెలుగులో సహజంగా చూపిస్తూ, క్రియకు కర్మగా విభక్తిని జోడిస్తుంది.
- source_word: וַ/תִּקְרָא אֶת שְׁמָהּ
  choice: ఆమెకు … అని పేరు పెట్టింది
  rationale: హీబ్రూ ‘ఆమె పేరును పిలిచింది’ అనే నామకరణ ప్రయోగానికి అర్థసమానమైన, స్పష్టమైన ఆధునిక తెలుగు రూపం.
- source_word: דִּינָה
  choice: దీనా
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగులో స్థిరపడిన ధ్వన్యనుకరణ.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. హీబ్రూ వాక్యక్రమాన్ని వీలైనంతవరకు కాపాడుతూ, నామకరణ ప్రయోగాన్ని సహజ తెలుగు వాడుకకు అనుగుణంగా అందించాం.
