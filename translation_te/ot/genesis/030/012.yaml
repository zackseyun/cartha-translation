  text: And Zilpah[a], Leah's female servant, bore Jacob a second son.
translation:
  language: te
  text: లేయా దాసి అయిన జిల్పా[a] యాకోబుకు రెండవ కుమారుణ్ణి కనింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘లేయాకు చెందిన సేవకురాలు.’ హీబ్రూ పదం లేయాకు అనుబంధంగా ఉన్న స్త్రీ సేవకురాలిని లేదా బానిస స్త్రీని ప్రత్యేకంగా సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּלֶד
  choice: కనింది
  rationale: ילד క్రియ యొక్క కథన రూపం తదుపరి జనన సంఘటనను తెలియజేస్తుంది; ‘కనింది’ ఆధునిక తెలుగులో సహజంగా, సంక్షిప్తంగా ప్రసవాన్ని వ్యక్తం చేస్తుంది.
- source_word: זִלְפָּה
  choice: జిల్పా
  rationale: వ్యక్తి పేరును హీబ్రూ ఉచ్చారణకు దగ్గరగా తెలుగులో లిప్యంతరీకరించాం.
- source_word: שִׁפְחַת לֵאָה
  choice: లేయా దాసి
  rationale: ఈ నిర్మాణ పదబంధం జిల్పాకు లేయాతో ఉన్న సేవకత్వ/బానిసత్వ సామాజిక సంబంధాన్ని సూచిస్తుంది. ప్రధాన పాఠ్యంలో సహజమైన ‘దాసి’ని వాడి, హీబ్రూ పదంలోని విస్తృత భావాన్ని పాదసూచికలో తెలిపాం.
- source_word: בֵּן שֵׁנִי
  choice: రెండవ కుమారుణ్ణి
  rationale: అక్షరార్థంగా ‘రెండవ కుమారుడు’; సందర్భంలో జిల్పా యాకోబుకు కన్న రెండవ కుమారుణ్ణి సూచిస్తుంది.
- source_word: לְיַעֲקֹב
  choice: యాకోబుకు
  rationale: לְ ఉపసర్గ జనన సూత్రంలో తండ్రి లేదా సంబంధిత లబ్ధిదారుణ్ణి సూచిస్తుంది; ‘యాకోబుకు ... కనింది’ తెలుగులో సహజంగా ఈ సంబంధాన్ని నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. హీబ్రూ వాక్య క్రమాన్ని బలవంతంగా అనుసరించకుండా, దాని అర్థసంబంధాలను సహజమైన తెలుగు వాక్య నిర్మాణంలో నిలిపాం.
