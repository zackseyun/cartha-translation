- source_word: כִדְבָרֶךָ
  choice: నీ మాట ప్రకారమే
  rationale: ప్రతిపాదించిన షరతులకు అనుగుణంగా అనే భావాన్ని, మూలంలోని ‘నీ మాట ప్రకారం’ రూపానికి దగ్గరగా నిలుపుతుంది.
