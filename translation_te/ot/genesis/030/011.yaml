  text: וַ/תֹּ֥אמֶר לֵאָ֖ה ב/גד וַ/תִּקְרָ֥א אֶת שְׁמ֖/וֹ גָּֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/011.yaml
  text: And Leah said[a], “Good fortune!” So she called his name Gad.
translation:
  language: te
  text: లేయా, “అదృష్టం!”[a] అని చెప్పింది. ఆమె అతనికి గాదు అని పేరు పెట్టింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడి בגד అనే హీబ్రూ రూపం అర్థం చేసుకోవడం కష్టం. దీన్ని “అదృష్టం!” అనే ఆశ్చర్యోక్తిగా గ్రహించవచ్చు; సంప్రదాయంగా కొందరు దీనిని “ఒక దండు!” అని అనువదిస్తారు. గాదు అనే పేరు ఇక్కడి హీబ్రూ పదంతో శబ్దసామ్యం కలిగి ఉంది.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: అని చెప్పింది
  rationale: אמר క్రియ యొక్క వయ్యిక్తోల్ రూపం కథనంలోని తదుపరి చర్యను తెలియజేస్తుంది; తెలుగు వాక్య నిర్మాణంలో సహజంగా ఉండేలా ఉల్లేఖనం తర్వాత ‘అని చెప్పింది’గా అనువదించాం.
- source_word: לֵאָה
  choice: లేయా
  rationale: హీబ్రూ వ్యక్తినామానికి ఆధునిక తెలుగు బైబిలు వాడుకలో సుపరిచితమైన లిప్యంతరీకరణ.
- source_word: בגד
  choice: అదృష్టం!
  rationale: ఈ క్లిష్టమైన హీబ్రూ రూపాన్ని גד (‘అదృష్టం/భాగ్యం’)తో సంబంధమున్న ఆశ్చర్యోక్తిగా గ్రహించడం సందర్భానికీ, గాదు అనే పేరుతో ఉన్న శబ్దక్రీడకీ సరిపోతుంది. అనిశ్చితిని పాదసూచికలో పేర్కొన్నాం.
- source_word: וַתִּקְרָא אֶת שְׁמוֹ
  choice: అందుకే అతనికి ... అని పేరు పెట్టింది
  rationale: పేరు పెట్టే సందర్భంలోని హీబ్రూ ప్రయోగాన్ని సహజమైన ఆధునిక తెలుగులో తెలిపి, లేయా పలికిన మాటకూ శిశువు పేరుకూ ఉన్న ఫలిత సంబంధాన్ని ‘అందుకే’తో చూపించాం.
- source_word: גָּד
  choice: గాదు
  rationale: హీబ్రూ వ్యక్తినామాన్ని సుపరిచితమైన తెలుగు రూపంలో ఉంచాం; మూలంలోని పేరుతో కూడిన శబ్దక్రీడను పాదసూచిక వివరిస్తుంది.
theological_decisions: []
translation_notes:
  register: సాధారణ పాఠకులకు స్పష్టంగా ఉండే ఆధునిక ప్రామాణిక తెలుగును, కథనానికి తగిన గౌరవప్రదమైన సరళ శైలిని ఉపయోగించాం. మూలంలోని సంక్షిప్త ఆశ్చర్యోక్తిని అలాగే నిలిపి, దాని పాఠసంబంధ అనిశ్చితిని పాదసూచికలో సంరక్షించాం.
