  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֵּ֨לֶךְ רְאוּבֵ֜ן בִּ/ימֵ֣י קְצִיר חִטִּ֗ים וַ/יִּמְצָ֤א דֽוּדָאִים֙ בַּ/שָּׂדֶ֔ה וַ/יָּבֵ֣א אֹתָ֔/ם אֶל לֵאָ֖ה אִמּ֑/וֹ וַ/תֹּ֤אמֶר רָחֵל֙ אֶל לֵאָ֔ה תְּנִי נָ֣א לִ֔/י מִ/דּוּדָאֵ֖י בְּנֵֽ/ךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/014.yaml
  text: In the days of the wheat harvest[a], Reuben went and found mandrakes in the field, and he brought them to Leah his mother. Then Rachel said to Leah, “Please give me some of your son’s mandrakes.”
translation:
  language: te
  text: గోధుమ కోతకాలంలో రూబేను వెళ్లి, పొలంలో మాండ్రేక్‌లు[a] కనుగొన్నాడు. వాటిని తన తల్లి లేయా వద్దకు తీసుకొచ్చాడు. అప్పుడు రాహేలు లేయాతో, “దయచేసి నీ కుమారుడి మాండ్రేక్‌లలో కొన్ని నాకు ఇవ్వు” అంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పదం ‘దూదాయిమ్’. ఇది సాంప్రదాయంగా మాండ్రేక్ మొక్కగా గుర్తించబడింది; ‘ప్రేమఫలాలు’ అని కూడా అనువదించవచ్చు. పరిసర కథనంలో ఇవి సంతానోత్పత్తితో సంబంధం ఉన్నవిగా భావించబడుతున్నాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּימֵי קְצִיר חִטִּים
  choice: గోధుమ కోతకాలంలో
  rationale: హీబ్రూ నిర్మాణం గోధుమల కోత జరిగే కాలాన్ని సూచిస్తుంది. తెలుగు సహజ వాడుకలో ‘గోధుమ కోతకాలంలో’ సంక్షిప్తంగా, స్పష్టంగా ఆ కాలసందర్భాన్ని తెలియజేస్తుంది.
- source_word: וַיֵּלֶךְ
  choice: వెళ్లి
  rationale: కథనాన్ని ముందుకు నడిపే సాధారణ క్రియ. మూలంలో లేని ‘బయటికి’ వంటి భావాన్ని చేర్చకుండా అనువదించబడింది.
- source_word: דּוּדָאִים
  choice: మాండ్రేక్ పండ్లు
  rationale: ఈ మొక్కకు సాంప్రదాయక గుర్తింపు మాండ్రేక్. సాధారణ తెలుగు పాఠకునికి ఇది మొక్కకు సంబంధించిన ఫలమని స్పష్టమయ్యేలా ‘పండ్లు’ చేర్చబడింది; వృక్షశాస్త్రీయ గుర్తింపులోని అనిశ్చితిని పాదసూచికలో ఉంచాం.
- source_word: בַּשָּׂדֶה
  choice: పొలంలో
  rationale: ఈ సందర్భంలో שָׂדֶהకు నేరుగా, సహజంగా సరిపోయే తెలుగు పదం ‘పొలం’.
- source_word: וַיָּבֵא אֹתָם אֶל לֵאָה אִמּוֹ
  choice: వాటిని తన తల్లి లేయా దగ్గరకు తీసుకొచ్చాడు
  rationale: బహువచన కర్మను నిలుపుతూ, లేయా రూబేను తల్లి అనే సంబంధాన్ని సహజ తెలుగు పదక్రమంలో వ్యక్తం చేస్తుంది.
- source_word: תְּנִי נָא לִי
  choice: దయచేసి ... నాకు ఇవ్వు
  rationale: నָאలోని విన్నపం లేదా మర్యాద భావాన్ని ‘దయచేసి’ తెలియజేస్తుంది; ఆజ్ఞార్థక క్రియను సహజంగా ‘ఇవ్వు’గా అనువదించాం.
- source_word: מִדּוּדָאֵי בְּנֵךְ
  choice: నీ కుమారుడి మాండ్రేక్ పండ్లలో కొన్ని
  rationale: מִן ఇక్కడ భాగార్థకంగా ఉంది; అందువల్ల ‘లో కొన్ని’ అని అనువదించాం. ‘నీ కుమారుడి’ అనే స్వామ్యసంబంధాన్ని మూలానికి అనుగుణంగా నిలిపాం.
