  naturalness: The narrative is generally fluent modern Telugu. ‘తన తల్లి లేయా దగ్గరకు’ is understandable, but ‘తన తల్లి లేయా వద్దకు’ is more natural in this formal narrative context. Using ‘మాండ్రేక్‌లు’ avoids an unnecessary and potentially awkward botanical specification.
  terminology: Retain the transliterated traditional identification ‘మాండ్రేక్‌లు’ in the text, while the footnote preserves the lexical and botanical uncertainty and the alternative ‘ప్రేమఫలాలు.’
  issues:
