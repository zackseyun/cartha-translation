translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన కథనశైలి వాడబడింది. మొక్క యొక్క ఖచ్చితమైన గుర్తింపును ప్రధాన పాఠ్యంలో నిర్ధారించినట్టు చూపకుండా, సాంప్రదాయక పేరును ఉపయోగించి ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
