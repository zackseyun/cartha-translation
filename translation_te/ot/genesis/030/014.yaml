  - severity: low
    issue: ‘లేయా దగ్గరకు’ is slightly colloquial for the narrative register.
    rationale: ‘తన తల్లి లేయా వద్దకు’ is a more idiomatic modern-standard Telugu rendering of bringing something to someone.
