source:
  edition: WLC
  text: וַ/תֵּ֣רֶא לֵאָ֔ה כִּ֥י עָמְדָ֖ה מִ/לֶּ֑דֶת וַ/תִּקַּח֙ אֶת זִלְפָּ֣ה שִׁפְחָתָ֔/הּ וַ/תִּתֵּ֥ן אֹתָ֛/הּ לְ/יַעֲקֹ֖ב לְ/אִשָּֽׁה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/009.yaml
  text: When Leah saw that she had stopped bearing children[b][a], she took Zilpah her female servant and gave her to Jacob as a wife.
translation:
  language: te
  text: లేయా తాను పిల్లలను కనడం ఆగిపోయిందని గమనించి,[a] తన దాసి[b] జిల్పాను తీసుకొని యాకోబుకు భార్యగా ఇచ్చింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘పిల్లలను కనడం మానేసిందని’; హీబ్రూ నుడికారానికి అక్షరార్థం ‘కనడం నుండి నిలిచిపోయింది.’
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘తన స్త్రీ సేవకురాలు.’ ఈ పదం ఆధీనంలో ఉన్న స్త్రీ సేవకురాలు లేదా బానిసను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּרֶא
  choice: చూసి
  rationale: వావ్-క్రమరూపం కథనాన్ని ముందుకు నడిపిస్తుంది; తెలుగులో అసమాపక క్రియారూపం తరువాతి చర్యతో సహజమైన కాలసంబంధాన్ని చూపుతుంది.
- source_word: כִּי
  choice: అని
  rationale: ఇక్కడ כִּי కారణాన్ని కాకుండా లేయా గ్రహించిన విషయాన్ని పరిచయం చేస్తుంది.
- source_word: עָמְדָה מִלֶּדֶת
  choice: పిల్లలను కనడం ఆగిపోయింది
  rationale: עמד + מן + క్రియార్థక రూపం ఒక పని చేయడం ఆగిపోవడాన్ని సూచించే నుడికారం; ילד సందర్భంలో ప్రసవించడం అనే భావం ఉంది.
- source_word: שִׁפְחָתָהּ
  choice: తన దాసి
  rationale: שִׁפְחָה ఇంటిలో ఆధీన స్థితిలో ఉన్న స్త్రీ సేవకురాలు లేదా బానిసను సూచిస్తుంది. ‘దాసి’ సంక్షిప్తంగా, సహజంగా ఉండి ఆ ఆధీన స్థితిని పూర్తిగా మృదువుపరచదు.
- source_word: זִלְפָּה
  choice: జిల్పా
  rationale: వ్యక్తి పేరును ఆధునిక ప్రామాణిక తెలుగు లిప్యంతరీకరణలో ఇచ్చాం.
- source_word: לְיַעֲקֹב
  choice: యాకోబుకు
  rationale: ఈ నిర్మాణంలోని לְ పరోక్ష కర్మను తెలుగులో చతుర్థీ విభక్తితో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: לְאִשָּׁה
  choice: భార్యగా
  rationale: נתן ל... לאשה అనే వివాహ సంబంధ వ్యక్తీకరణను ‘భార్యగా ఇచ్చింది’ సహజంగా, సంక్షిప్తంగా ప్రతిబింబిస్తుంది; కేవలం లైంగిక ఏర్పాటుగా మృదువుపరచదు.
theological_decisions:
- issue: జిల్పా గృహస్థితి మరియు వివాహ సంబంధ పదజాలం
  choice: שִׁפְחָהను ‘దాసి’గా, לְאִשָּׁהను ‘భార్యగా’ అనువదించి రెండింటినీ నిలిపాం.
  alternative: ‘పనిమనిషి/సేవకురాలు’ అని మృదువుగా అనువదించడం, లేదా ‘ఉపపత్ని’ అని తరువాతి సాంకేతిక వర్గాన్ని చేర్చడం.
  rationale: హీబ్రూ వచనం జిల్పాను లేయా దాసిగా స్పష్టంగా గుర్తిస్తూనే, ఆమెను యాకోబుకు ‘భార్యగా’ ఇచ్చిందని చెబుతుంది. అందువల్ల ఆమె ఆధీన గృహస్థితినీ, వచనంలోని అధికారిక వివాహ భాషనూ ఎటువంటి సిద్ధాంతపరమైన సమన్వయం లేకుండా అలాగే ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి వాడాం. మూలంలోని చర్యల క్రమాన్ని ‘చూసి ... తీసుకొని ... ఇచ్చింది’ అనే నిర్మాణంతో నిలిపాం; ‘దాసి’ మరియు ‘భార్యగా’ అనే పదాలు వచనంలోని సామాజిక ఉద్రిక్తతను మృదువుపరచకుండా వ్యక్తం చేస్తాయి.
