  text: Then he said[a], “Name your wages, and I will give it.”
translation:
  language: te
  text: 'అప్పుడు అతడు ఇలా అన్నాడు: “నీ జీతం ఎంత ఉండాలో చెప్పు; నేను దానిని ఇస్తాను.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నేను చెల్లించవలసిన నీ జీతాన్ని నిర్ణయించు; నేను దానిని ఇస్తాను.”
    reason: עָלַיలో సూచితమైన, మాట్లాడుతున్నవాడు చెల్లింపు బాధ్యతను స్వీకరించే భావాన్ని మరియు נָקְבָהలోని నిర్దిష్టంగా నిర్ణయించే భావాన్ని చూపే ప్రత్యామ్నాయ అనువాదం.
lexical_decisions:
- source_word: וַיֹּאמַר
  choice: అప్పుడు అతడు … అన్నాడు
  rationale: వావ్-క్రమరూపం కథనాన్ని ముందుకు నడిపిస్తుంది; ఆధునిక తెలుగులో ‘అప్పుడు’ సహజంగా ఆ క్రమాన్ని తెలియజేస్తుంది.
- source_word: נָקְבָה
  choice: ఎంతో చెప్పు
  rationale: נקב ఇక్కడ జీతాన్ని స్పష్టంగా పేర్కొనడాన్ని సూచిస్తుంది. ‘ఎంతో చెప్పు’ అనేది జీతపు సందర్భంలో సహజమైన ఆధునిక తెలుగు.
- source_word: שְׂכָרְךָ
  choice: నీ జీతం
  rationale: שָׂכָר శ్రమకు ఇచ్చే జీతం లేదా ప్రతిఫలాన్ని సూచిస్తుంది; యాకోబు-లాబాను ఉద్యోగ సంబంధ సందర్భంలో ‘జీతం’ ఖచ్చితంగా సరిపోతుంది.
- source_word: עָלַי
  choice: నాకు
  rationale: అక్షరార్థంగా ‘నా మీద’; ఈ ప్రయోగంలో మాట్లాడుతున్న వ్యక్తికి షరతు లేదా మొత్తాన్ని తెలియజేయడం అనే భావం ఉంది. తెలుగులో అది క్రియలో సహజంగా అంతర్భవిస్తుంది; ప్రత్యామ్నాయ పాఠంలో ‘నాకు’ స్పష్టంగా ఉంచబడింది.
- source_word: וְאֶתֵּנָה
  choice: నేను దాన్ని ఇస్తాను
  rationale: נתן అనే ‘ఇవ్వు’ క్రియను నిలుపుతూ, ఏకవచన భావంలో ఉన్న జీతాన్ని సూచించేందుకు తెలుగులో అవసరమైన ‘దాన్ని’ చేర్చబడింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ప్రధాన పాఠంలో హెబ్రీ నుడికారాన్ని సహజీకరించి, దాని మరింత ప్రత్యక్ష రూపాన్ని పాదసూచికలో నిలిపాం.
