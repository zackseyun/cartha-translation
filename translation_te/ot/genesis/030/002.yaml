  edition: WLC
  text: וַ/יִּֽחַר אַ֥ף יַעֲקֹ֖ב בְּ/רָחֵ֑ל וַ/יֹּ֗אמֶר הֲ/תַ֤חַת אֱלֹהִים֙ אָנֹ֔כִי אֲשֶׁר מָנַ֥ע מִמֵּ֖/ךְ פְּרִי בָֽטֶן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/002.yaml
  text: Then Jacob became angry with Rachel and said[a], “Am I in the place of God[b], who has withheld the fruit of the womb from you?”
translation:
  language: te
  text: అప్పుడు యాకోబుకు రాహేలు మీద కోపం రగిలింది[a]. అతడు ఆమెతో, “నీకు గర్భఫలాన్ని[b] ఇవ్వకుండా ఉంచిన దేవుని స్థానంలో నేనున్నానా?” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “యాకోబు కోపం రాహేలు మీద మండింది.”
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో “గర్భఫలం”; ఇది పిల్లలను లేదా సంతానాన్ని సూచించే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: కోపం రగిలింది
  rationale: హీబ్రూ నుడికారంలోని ‘కోపం మండడం’ అనే బలమైన భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: בְּרָחֵל
  choice: రాహేలు మీద
  rationale: కోపం ఎవరిపైకి మళ్లిందో తెలిపే హీబ్రూ ప్రయోగాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: הֲתַחַת אֱלֹהִים אָנֹכִי
  choice: దేవుని స్థానంలో నేనున్నానా?
  rationale: תַּחַת ఇక్కడ భౌతికంగా ‘కింద’ అని కాక, మరొకరి స్థానం లేదా అధికారాన్ని చేపట్టడం అనే భావాన్ని ఇస్తుంది.
- source_word: אֱלֹהִים
  choice: దేవుడు
  rationale: సందర్భం మరియు తరువాత వచ్చే ఏకవచన క్రియ ప్రకారం ఇది ఏకైక దేవుణ్ణే సూచిస్తుంది.
- source_word: אֲשֶׁר מָנַע מִמֵּךְ
  choice: నీకు … కలగకుండా చేసిన
  rationale: రాహేలుకు సంతానం కలగకపోవడానికి దేవుడే కారణమని యాకోబు చెప్పిన భావాన్ని సహజ తెలుగులో స్పష్టంగా నిలుపుతుంది.
- source_word: פְּרִי בָטֶן
  choice: గర్భఫలం
  rationale: సంతానం అనే అర్థమిచ్చే మూలభాష రూపకాన్ని సంక్షిప్తమైన, అర్థమయ్యే తెలుగు పదంతో కాపాడుతుంది.
theological_decisions:
- issue: రాహేలు సంతానలేమిలో దేవుని కార్యసాధకత్వం
  choice: రాహేలుకు గర్భఫలం కలగకుండా చేసింది దేవుడేనని యాకోబు పేర్కొంటున్నట్లు అనువదించబడింది.
  alternative: యాకోబు కేవలం అలంకారికంగా మాట్లాడుతున్నాడని భావించి దేవుని కార్యసాధకత్వాన్ని మృదువుగా చూపడం.
  rationale: אֲשֶׁר מָנַע అనే సంబంధవాక్యం గర్భఫలాన్ని నిలిపినవాడిగా దేవుణ్ణి నేరుగా గుర్తిస్తుంది; ఆ వేదాంతపరమైన ఉద్రిక్తతను అనువాదం తగ్గించకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘కోపం రగిలింది’ మూలంలోని తీవ్రతను నిలుపుతుంది; ‘గర్భఫలం’ మూల రూపకాన్ని కాపాడుతూ సాధారణ పాఠకుడికి అర్థమయ్యేలా ఉంది.
