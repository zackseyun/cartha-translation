revisions:
- from: మందలోని జంతువులు బలహీనంగా ఉన్నప్పుడు[a] అతడు వాటిని పెట్టేవాడు కాదు[b]. కాబట్టి బలహీనమైనవి లాబానువి, బలమైనవి[c] యాకోబువి అయ్యాయి.
  to: కానీ మంద బలహీనంగా ఉన్నప్పుడు[a] అతడు వాటి ఎదుట పెట్టేవాడు కాదు[b]. అలా బలహీనమైనవి లాబానుకు చెందాయి, బలమైనవి[c] యాకోబుకు చెందాయి.
  rationale: 'The revision removes the ambiguous object pronoun while preserving the source’s implicit object: “వాటి ఎదుట పెట్టేవాడు కాదు” is naturally completed by the preceding context and is made explicit in footnote b. It also uses the more natural collective “మంద” and clarifies the resulting allotment with “చెందాయి.”'
