translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన శైలి. మూలంలోని కర్మలేమిని ప్రధాన వాక్యంలో నిలిపి, సందర్భార్థాన్ని పాదసూచికలో తెలిపాం. బలహీనమైనవి–బలమైనవి అనే వ్యత్యాసాన్ని స్పష్టంగా ఉంచాం; హీబ్రూ పదాల సంభావ్య సంతానోత్పత్తి సంబంధిత సూక్ష్మార్థాన్ని పాదసూచికలో పరిరక్షించాం.
