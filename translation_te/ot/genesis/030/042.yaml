  text: וּ/בְ/הַעֲטִ֥יף הַ/צֹּ֖אן לֹ֣א יָשִׂ֑ים וְ/הָיָ֤ה הָ/עֲטֻפִים֙ לְ/לָבָ֔ן וְ/הַ/קְּשֻׁרִ֖ים לְ/יַעֲקֹֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/042.yaml
  text: But when the flock were feeble[a], he would not put them in; so the feeble ones became Laban’s[c][b], and the strong ones Jacob’s.
translation:
  language: te
  text: కానీ మంద బలహీనంగా ఉన్నప్పుడు[a] అతడు వాటి ఎదుట పెట్టేవాడు కాదు[b]. అలా బలహీనమైనవి లాబానుకు చెందాయి, బలమైనవి[c] యాకోబుకు చెందాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మంద బలహీనంగా ఉన్న వేళ.’ ఈ హీబ్రూ పదం బలహీనమైన జంతువులను సూచించవచ్చు; కొందరు దీనిని ఆలస్యంగా సంతానోత్పత్తి చేసే లేదా తక్కువ గుణమున్న జంతువులకు మరింత ప్రత్యేకంగా సంబంధించినదిగా అర్థం చేసుకుంటారు.
    reason: lexical_alternative
  - marker: b
    text: అంటే, ముందరి వచనాల్లో చెప్పినట్లుగా అతడు వాటి ఎదుట కొమ్మలను పెట్టేవాడు కాదు.
    reason: cross_reference
  - marker: c
    text: లేదా, ‘దృఢమైనవి,’ ‘శక్తిగలవి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְהַעֲטִיף
  choice: బలహీనంగా ఉన్నప్పుడు
  rationale: בְּతో కూడిన క్రియారూపం కాలసూచక ఉపవాక్యాన్ని ఏర్పరుస్తుంది. עטף ఇక్కడ బలహీనమైన జంతువులను సూచిస్తుంది; ఆలస్యంగా ఈనేవి అని మరీ నిర్దిష్టంగా చేయకుండా సందర్భంలోని వ్యత్యాసాన్ని నిలుపుతుంది.
- source_word: הַצֹּאן
  choice: మందలోని జంతువులు
  rationale: צֹאן అనేది ముఖ్యంగా గొర్రెలు, మేకలు వంటి చిన్న పశువులను సూచించే సమూహవాచకం. ఈ వాక్యంలో వాటిలోని బలహీనమైన, బలమైన జంతువులను విడదీస్తున్నందున ఈ రూపం తెలుగులో స్పష్టంగా ఉంటుంది.
- source_word: לֹא יָשִׂים
  choice: అతడు వాటిని పెట్టేవాడు కాదు
  rationale: שׂים అంటే పెట్టడం లేదా ఉంచడం. కర్మ వాచ్యంలో స్పష్టంగా లేకపోయినా, ముందరి వచనాల ప్రకారం అది కొమ్మలను సూచిస్తుంది; అనువాదంలో ఆ సూచనను నిలిపి, పాదసూచికలో వివరిస్తున్నాం.
- source_word: וְהָיָה
  choice: కాబట్టి ... అయ్యాయి
  rationale: ఇది ఫలితంగా ఏర్పడిన స్థితిని తెలియజేస్తుంది. తెలుగు వాక్యప్రవాహంలో ‘కాబట్టి ... అయ్యాయి’ ఆ సంబంధాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: הָעֲטֻפִים
  choice: బలహీనమైనవి
  rationale: עטף నుంచి వచ్చిన ఈ రూపం, తరువాతి బలమైన జంతువులకు విరుద్ధంగా బలహీనమైన వాటిని సూచిస్తుంది.
- source_word: לְלָבָן
  choice: లాబానువి
  rationale: לְ ఇక్కడ స్వామ్యాన్ని లేదా వాటాను సూచిస్తుంది; తెలుగు స్వామ్యరూపం సంక్షిప్తంగా, సహజంగా ఉంటుంది.
- source_word: וְהַקְּשֻׁרִים
  choice: బలమైనవి
  rationale: రూపం అరుదైనదైనా, הָעֲטֻפִיםతో ఉన్న వ్యత్యాసంలో దృఢమైన లేదా శక్తిగల జంతువులను సూచిస్తుంది. ‘బలమైనవి’ సాధారణ పాఠకులకు స్పష్టంగా ఉంటుంది.
- source_word: לְיַעֲקֹב
  choice: యాకోబువి
  rationale: לְ ఇక్కడ స్వామ్యాన్ని లేదా కేటాయింపును సూచిస్తుంది; తెలుగు స్వామ్యరూపం సహజమైనది.
