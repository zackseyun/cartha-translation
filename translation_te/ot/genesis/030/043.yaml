id: GEN.30.43
reference: Genesis 30:43
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּפְרֹ֥ץ הָ/אִ֖ישׁ מְאֹ֣ד מְאֹ֑ד וַֽ/יְהִי ל/וֹ֙ צֹ֣אן רַבּ֔וֹת וּ/שְׁפָחוֹת֙ וַ/עֲבָדִ֔ים וּ/גְמַלִּ֖ים וַ/חֲמֹרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/043.yaml
  text: And the man became exceedingly prosperous[b][a], and he came to have many flocks and female servants and male servants and camels and donkeys.
translation:
  language: te
  text: ఆ మనిషి అత్యంత సంపన్నుడయ్యాడు; అతనికి అనేక గొర్రెమేకల మందలు, దాసీలు, దాసులు[a], ఒంటెలు, గాడిదలు కలిగాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘సేవకురాళ్లు, సేవకులు.’ హీబ్రూ పదాలు గృహసేవకులను కూడా సూచించగలవు; అయితే ఇక్కడ వారు సంపాదించుకున్న వాటి జాబితాలో పేర్కొనబడ్డారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְרֹץ ... מְאֹד מְאֹד
  choice: అత్యంత సంపన్నుడయ్యాడు
  rationale: פרץ అనే క్రియకు అక్షరార్థంగా ‘బయటికి విరుచుకుపోవడం/విస్తరించడం’ అనే భావం ఉన్నా, ఇక్కడ సంపద అపారంగా పెరగడాన్ని సూచిస్తుంది. మְאֹד అనే పదం రెండుసార్లు రావడం వల్ల కలిగే తీవ్రతను ‘అత్యంత’ తెలియజేస్తుంది.
- source_word: הָאִישׁ
  choice: ఆ మనిషి
  rationale: సందర్భంలో యాకోబును సూచించినప్పటికీ, మూలంలోని సాధారణ నామవాచక రూపాన్ని అలాగే నిలుపుతుంది.
- source_word: וַיְהִי לוֹ
  choice: అతనికి ... కలిగాయి
  rationale: కథనం సాగేకొద్దీ ఇవన్నీ అతని స్వాధీనంలోకి వచ్చాయనే ఫలితాత్మక స్వామ్యభావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: צֹאן רַבּוֹת
  choice: అనేక గొర్రెమేకల మందలు
  rationale: צֹאן ప్రధానంగా గొర్రెలు, మేకలు వంటి చిన్న పశువులను సమష్టిగా సూచిస్తుంది; ‘గొర్రెమేకల మందలు’ ఆ పరిధిని సాధారణ పాఠకునికి స్పష్టంగా తెలియజేస్తుంది.
- source_word: שְׁפָחוֹת וַעֲבָדִים
  choice: దాసీలు, దాసులు
  rationale: స్త్రీ, పురుష గృహదాసుల లింగభేదాన్నీ, వారి బంధిత సామాజిక స్థితినీ సంక్షిప్తంగా కాపాడుతుంది.
- source_word: גְמַלִּים וַחֲמֹרִים
  choice: ఒంటెలు, గాడిదలు
  rationale: ఈ జంతు పదాలకు సహజమైన ఆధునిక తెలుగు సమానార్థకాలు.
theological_decisions:
- issue: שְׁפָחוֹת మరియు עֲבָדִים పదాలను సేవకులుగా లేదా దాసులుగా అనువదించడం
  choice: దాసీలు, దాసులు
  alternative: పనికత్తెలు, పనివారు / సేవకురాళ్లు, సేవకులు
  rationale: ఈ పదాలు గృహసేవ చేసే వారిని సూచించగలిగినా, ఇక్కడ వారు సంపాదించుకున్న ఆస్తుల జాబితాలో ఉన్నారు. అందువల్ల వారి బంధిత స్థితిని మృదువుచేయకుండా ‘దాసీలు, దాసులు’ అని అనువదించడం మూలంలోని సామాజిక వాస్తవానికి దగ్గరగా ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. మూలంలోని తీవ్రతను ‘అత్యంత’ ద్వారా, సంపద పెరిగిన ఫలితాన్ని ‘సంపన్నుడయ్యాడు’ ద్వారా వ్యక్తం చేసింది; దాస్యస్థితిని అస్పష్టం చేయలేదు.
