id: GEN.30.3
reference: Genesis 30:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/תֹּ֕אמֶר הִנֵּ֛ה אֲמָתִ֥/י בִלְהָ֖ה בֹּ֣א אֵלֶ֑י/הָ וְ/תֵלֵד֙ עַל בִּרְכַּ֔/י וְ/אִבָּנֶ֥ה גַם אָנֹכִ֖י מִמֶּֽ/נָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/003.yaml
  text: Then she said[a], “Here is my female servant Bilhah. Go in to her, so that she may bear on my knees[c][b], and I too may be built up through her.”
translation:
  language: te
  text: అప్పుడు ఆమె, “ఇదిగో నా దాసి బిల్హా. నీవు ఆమె దగ్గరికి వెళ్లు; ఆమె నా మోకాళ్లపై కనేలా, ఆమె ద్వారా నేనూ సంతానం పొందేలా” అని చెప్పింది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲמָתִי
  choice: నా దాసి
  rationale: אמה స్త్రీ దాసిని లేదా సేవకురాలిని సూచిస్తుంది. ‘దాసి’ సామాజిక అధీనస్థితిని స్పష్టంగా, సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: בֹּא אֵלֶיהָ
  choice: ఆమె దగ్గరికి వెళ్లు
  rationale: ఇది లైంగిక సంబంధాన్ని సూచించే హీబ్రూ సభ్యోక్తి. తెలుగు పాఠ్యంలోనూ సభ్యోక్తి స్వరూపాన్ని నిలుపుతూ సందర్భం ద్వారా అర్థమయ్యేలా అనువదించబడింది.
- source_word: וְתֵלֵד עַל בִּרְכַּי
  choice: ఆమె నా మోకాళ్లపై ప్రసవిస్తుంది
  rationale: ‘నా మోకాళ్లపై’ అనే సాంస్కృతికంగా ప్రత్యేకమైన మూలభాషా చిత్రాన్ని పారదర్శకంగా నిలిపి, వివరణను పాదటిప్పణిలో ఇచ్చాం.
- source_word: וְאִבָּנֶה
  choice: నేనూ సంతానవృద్ధి పొందుతాను
  rationale: בנה నిఫాల్ రూపానికి అక్షరార్థం ‘కట్టబడడం’; ఈ సందర్భంలో అది సంతానం ద్వారా కుటుంబంగా వృద్ధి చెందడాన్ని సూచించే రూపకం. తెలుగులో సహజతతో పాటు ఆ సందర్భార్థాన్ని అందించడానికి ‘సంతానవృద్ధి పొందుతాను’ ఎంచుకున్నాం; అక్షరార్థాన్ని పాదటిప్పణిలో నిలిపాం.
- source_word: מִמֶּנָּה
  choice: ఆమె ద్వారా
  rationale: బిల్హా రాహేలు ఆశిస్తున్న సంతానవృద్ధికి సాధనమని తెలిపే ప్రయోజక భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: גַם אָנֹכִי
  choice: నేనూ
  rationale: రాహేలు తన గొడ్రాలితనానికి విరుద్ధంగా తానూ సంతానంతో వృద్ధి పొందాలనే ఆశను తెలిపే ఉద్ఘాటనను నిలుపుతుంది.
theological_decisions:
- issue: וְאִבָּנֶה లోని కుటుంబ/సంతాన రూపకం
  choice: ప్రధాన పాఠ్యంలో ‘సంతానవృద్ధి పొందుతాను’; పాదటిప్పణిలో ‘కట్టబడతాను’ అనే అక్షరార్థం
  alternative: ‘నేనూ ఆమె ద్వారా కట్టబడతాను’
  rationale: అక్షరార్థ తెలుగు ప్రయోగం ఈ సందర్భంలో అసహజంగా, అపార్థకంగా ఉంటుంది. సందర్భార్థాన్ని స్పష్టంగా ఇస్తూనే మూలంలోని రూపకాన్ని పాదటిప్పణిలో సంరక్షించడం ఉత్తమ సమతుల్యత.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. లైంగిక సంబంధానికి సంబంధించిన హీబ్రూ సభ్యోక్తిని సభ్యోక్తిగానే నిలిపాం. సాంస్కృతికంగా ప్రత్యేకమైన ‘మోకాళ్లపై’ అనే చిత్రాన్ని ప్రధాన పాఠ్యంలో ఉంచి పాదటిప్పణిలో వివరించాం.
