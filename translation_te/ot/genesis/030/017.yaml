  yaml_path: translation/ot/genesis/030/017.yaml
  text: And God listened to Leah[a], and she conceived and bore Jacob a fifth son.
translation:
  language: te
  text: దేవుడు లేయాను ఆలకించాడు[a]. ఆమె గర్భం దాల్చి యాకోబుకు ఐదవ కుమారుణ్ణి కనింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దేవుడు లేయాను విన్నాడు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע ... אֶל
  choice: మొర ఆలకించాడు
  rationale: שׁמע + אֶל ఇక్కడ కేవలం శబ్దం వినడాన్ని కాక, అనుకూలంగా విని స్పందించడాన్ని సూచిస్తుంది. తెలుగులో ‘మొర ఆలకించాడు’ ఆ సందర్భార్థాన్ని సహజంగా తెలియజేస్తుంది; ‘మొర’ సందర్భం ద్వారా పూరించబడింది.
- source_word: אֱלֹהִים
  choice: దేవుడు
  rationale: కథన సందర్భంలో ఇది ఏకైక దేవుణ్ణి సూచిస్తుంది; ఆధునిక ప్రామాణిక తెలుగులో సహజమైన రూపం.
- source_word: לֵאָה
  choice: లేయా
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగులో స్థిరపడిన లిప్యంతరీకరణ.
- source_word: וַתַּהַר
  choice: ఆమె గర్భవతియై
  rationale: హָרָה అనే క్రియను జనన కథనంలో స్పష్టంగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: וַתֵּלֶד
  choice: కన్నది
  rationale: יָלַד క్రియకు ఈ సందర్భంలో సంక్షిప్తమైన, సహజమైన తెలుగు సమానార్థకం.
- source_word: לְיַעֲקֹב
  choice: యాకోబుకు
  rationale: לְ ఉపసర్గంలోని పరోక్ష కర్మ/సంబంధ భావాన్ని తెలుగులో దత్తివిభక్తితో నిలుపుతుంది.
- source_word: בֵּן חֲמִישִׁי
  choice: ఐదవ కుమారుణ్ణి
  rationale: క్రమసంఖ్య కుమారుణ్ణి విశేషిస్తుంది; హీబ్రూ నిర్మాణాన్ని అర్థస్పష్టంగా తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: שׁמע אֶל సూచించే దైవిక స్పందన
  choice: దేవుడు లేయా మొర ఆలకించాడు
  alternative: దేవుడు లేయా మాట విన్నాడు
  rationale: హీబ్రూ పదబంధం సాధారణ శ్రవణం కంటే అనుకూలంగా విని స్పందించే భావాన్ని సందర్భంలో కలిగి ఉంది. ప్రధాన పాఠం ఆ భావాన్ని అందిస్తుండగా, పాదసూచిక మరింత పదానుసారమైన ప్రత్యామ్నాయాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనప్పటికీ గౌరవప్రదమైన కథన శైలి. మూలంలోని సంక్షిప్త వరుస చర్యలను రెండు వాక్యాలుగా ఇచ్చి తెలుగు ప్రవాహాన్ని మెరుగుపరచాం.
