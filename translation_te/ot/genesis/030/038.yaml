- from: తాను బెరడు ఒలిచిన కర్రలను మందకు ఎదురుగా, అది నీళ్లు తాగడానికి వచ్చే తొట్టెలలో—నీటి కాలువల్లో—ఉంచాడు.[a] మంద నీళ్లు తాగడానికి వచ్చినప్పుడు జతకట్టే వేడి దానికి పుట్టింది.[b]
  to: తాను బెరడు ఒలిచిన కర్రలను మందకు ఎదురుగా, మంద నీళ్లు తాగడానికి వచ్చే తొట్టెలలో—నీటి కాలువల్లో—ఉంచాడు.[a] మంద నీళ్లు తాగడానికి వచ్చినప్పుడు అవి సంభోగోద్రేకంలోకి వచ్చాయి.[b]
