  text: וַ/יַּצֵּ֗ג אֶת הַ/מַּקְלוֹת֙ אֲשֶׁ֣ר פִּצֵּ֔ל בָּ/רֳהָטִ֖ים בְּ/שִֽׁקֲת֣וֹת הַ/מָּ֑יִם אֲשֶׁר֩ תָּבֹ֨אןָ הַ/צֹּ֤אן לִ/שְׁתּוֹת֙ לְ/נֹ֣כַח הַ/צֹּ֔אן וַ/יֵּחַ֖מְנָה בְּ/בֹאָ֥/ן לִ/שְׁתּֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/038.yaml
  text: He set the rods that he had peeled in the troughs[a], in the watering channels where the flock came to drink, in front of the flock[c][b]; and they mated when they came to drink.
translation:
  language: te
  text: తాను బెరడు ఒలిచిన కర్రలను మందకు ఎదురుగా, మంద నీళ్లు తాగడానికి వచ్చే తొట్టెలలో—నీటి కాలువల్లో—ఉంచాడు.[a] మంద నీళ్లు తాగడానికి వచ్చినప్పుడు అవి సంభోగోద్రేకంలోకి వచ్చాయి.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘తొట్టెలు’, ‘నీటి కాలువలు’ అనే రెండు సంబంధిత పదాలు మూలంలో ఉన్నాయి. ఇవి బహుశా రెండు వేర్వేరు ప్రదేశాలను కాక, పశువులు నీళ్లు తాగే ప్రదేశాన్ని మరింత పూర్తిగా వర్ణిస్తున్నాయి.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “అవి వేడిలోకి వచ్చాయి.” హీబ్రూ క్రియ అక్షరార్థంగా పశువులు వేడెక్కడం లేదా సంభోగోద్రేకంలోకి రావడాన్ని సూచిస్తుంది; ఈ సందర్భంలో జతకట్టడం అంతర్లీనంగా ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּצֵּג
  choice: ఉంచాడు
  rationale: ఏదైనా ఒక నిర్దిష్ట స్థానంలో పెట్టడం అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: הַמַּקְלוֹת
  choice: కర్రలను
  rationale: ముందటి వచనంలో యాకోబు సిద్ధం చేసిన కొమ్మల కర్రలను సూచిస్తుంది; ‘కర్రలు’ సాధారణ పాఠకులకు స్పష్టంగా ఉంటుంది.
- source_word: אֲשֶׁר פִּצֵּל
  choice: తాను బెరడు ఒలిచిన
  rationale: తెల్లని చారలు కనిపించేలా బెరడును తొలగించిన చర్యను సందర్భానుసారంగా స్పష్టంగా తెలియజేస్తుంది.
- source_word: בָּרֳהָטִים בְּשִׁקֲתוֹת הַמָּיִם
  choice: తొట్టెలలో—నీటి కాలువల్లో
  rationale: మూలంలోని పరస్పరం సంబంధించిన రెండు స్థలపదాలను ఒకే నీరు తాగే ప్రదేశానికి సంబంధించిన సమగ్ర వర్ణనగా ఉంచుతుంది; వాటిని పూర్తిగా వేర్వేరు ప్రదేశాలుగా చేయదు.
- source_word: הַצֹּאן
  choice: మంద
  rationale: గొర్రెలు, మేకలు రెండింటినీ కలిగి ఉండగల చిన్న పశువుల సమూహాన్ని సూచించే సహజమైన సమూహపదం.
- source_word: לְנֹכַח הַצֹּאן
  choice: మందకు ఎదురుగా
  rationale: కర్రలు పశువుల కంటికి ఎదురుగా లేదా వాటి ముందు ఉంచబడ్డాయనే స్థానిక భావాన్ని నిలుపుతుంది.
- source_word: וַיֵּחַמְנָה
  choice: జతకట్టే వేడి దానికి పుట్టింది
  rationale: క్రియ యొక్క మూలార్థమైన ‘వేడెక్కడం/కామోద్రేకంలోకి రావడం’ను నిలుపుతూ, పశువుల సంతానోత్పత్తి సందర్భాన్ని సాధారణ పాఠకునికి స్పష్టం చేస్తుంది; జతకట్టడమే జరిగిందని మూలంలోని భావాన్ని మించి ఖరారు చేయదు.
- source_word: בְּבֹאָן לִשְׁתּוֹת
  choice: నీళ్లు తాగడానికి వచ్చినప్పుడు
  rationale: నీరు తాగడానికి రావడం మరియు వేడి పుట్టడం ఒకే సమయంలో జరిగాయని తెలిపే కాలసంబంధ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
