translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గ్రామీణ పశుపోషణ సందర్భానికి సరిపోయే సాధారణ పదాలతో అనువదించబడింది. ‘మంద’ అనే సమూహవాచకాన్ని ఏకవచనంగా కొనసాగించాం. మూలంలోని నీరు తాగే ప్రదేశానికి సంబంధించిన ద్వంద్వ వర్ణనను డాష్ ద్వారా సహజంగా నిలిపాం; చివరి క్రియలోని ‘వేడిలోకి రావడం’ మరియు ‘జతకట్టడం’ మధ్య ఉన్న అర్థసందిగ్ధతను ప్రధాన పాఠం, పాదసూచిక ద్వారా కాపాడాం.
