source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֵלָי/ו֙ לָבָ֔ן אִם נָ֛א מָצָ֥אתִי חֵ֖ן בְּ/עֵינֶ֑י/ךָ נִחַ֕שְׁתִּי וַ/יְבָרֲכֵ֥/נִי יְהוָ֖ה בִּ/גְלָלֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/027.yaml
  text: Then Laban said to him[a], “If I have found favor in your eyes, please stay[b]. I have learned by divination that Yahweh has blessed me because of you.”
translation:
  language: te
  text: అప్పుడు లాబాను అతనితో, “నీ దృష్టిలో నాకు అనుగ్రహం ఉంటే, దయచేసి ఉండిపో.[a] యాహ్వే నీ కారణంగా నన్ను ఆశీర్వదించాడని నేను శకునాలు చూసి తెలుసుకున్నాను[b]” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ఉండిపో’ అనే అభ్యర్థన హీబ్రూ పాఠంలో అధ్యాహారంగా ఉంది; సందర్భాన్ని బట్టి చేర్చబడింది.
    reason: ellipsis_clarification
  - marker: b
    text: లేదా, “నేను శకునం చూశాను”; లేదా, “నేను అనుభవం ద్వారా తెలుసుకున్నాను.” హీబ్రూ క్రియ ప్రధానంగా శకునాలు చూడడం లేదా దివ్యజ్ఞానం ద్వారా తెలుసుకోవడాన్ని సూచిస్తుంది; అయితే అనుభవం ద్వారా గ్రహించడం అనే అర్థం కూడా సాధ్యమే.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם נָא מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: నీ దృష్టిలో నాకు దయ లభించి ఉంటే, దయచేసి ఇక్కడే ఉండు
  rationale: ‘నీ దృష్టిలో దయ లభించడం’ అనే హీబ్రూ నుడికారంలోని రూపకాన్ని నిలుపుతూ సహజమైన ఆధునిక తెలుగులో ఇచ్చాం. נָא లోని వేడుకోలు భావాన్ని ‘దయచేసి’ తెలియజేస్తుంది. సందర్భం కోరే ‘ఇక్కడే ఉండు’ అనే మాట హీబ్రూలో అధ్యాహారంగా ఉంది.
- source_word: נִחַשְׁתִּי
  choice: నేను శకునం ద్వారా తెలుసుకున్నాను
  rationale: పియేల్ రూపంలోని נחשׁ సాధారణంగా శకునం చూడడం లేదా దివ్యజ్ఞానం ద్వారా తెలుసుకోవడాన్ని సూచిస్తుంది. ‘శకునం ద్వారా తెలుసుకున్నాను’ అనేది చర్యనూ, జ్ఞానం పొందిన విధానాన్నీ స్పష్టంగా తెలియజేస్తుంది; అనుభవం ద్వారా గ్రహించాననే సాధ్యమైన అర్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: మూలంలో ఉన్న దేవుని వ్యక్తిగత నామాన్ని బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పండితుల ఉచ్చారణకు దగ్గరగా తెలుగులో లిప్యంతరీకరించాం.
- source_word: וַיְבָרֲכֵנִי
  choice: నన్ను ఆశీర్వదించాడు
  rationale: ברך అనే క్రియ యొక్క ‘ఆశీర్వదించడం’ అనే ప్రాథమిక అర్థాన్ని సహజమైన తెలుగు భూతకాల రూపంలో వ్యక్తం చేశాం.
- source_word: בִּגְלָלֶךָ
  choice: నీ కారణంగానే
  rationale: ఈ పదబంధంలోని కారణార్థాన్ని సహజంగా తెలియజేస్తూ, సందర్భంలోని నొక్కిచెప్పే భావానికి ‘గానే’ చేర్చాం.
- source_word: לָבָן
  choice: లాబాను
  rationale: వ్యక్తి పేరును తెలుగులో స్థిరపడిన బైబిలు రూపానికి అనుగుణంగా లిప్యంతరీకరించాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామాన్ని అనువదించడం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: వచనంలో బిరుదు కాకుండా నాలుగు అక్షరాల దైవనామమే ఉంది. అందువల్ల దానిని ‘ప్రభువు’గా మార్చకుండా పేరుగా లిప్యంతరీకరించాం; ‘యాహ్వే’ రూపం సాధారణంగా పునర్నిర్మించిన హీబ్రూ ఉచ్చారణకు దగ్గరగా ఉంటుంది.
- issue: లాబాను జ్ఞానం పొందిన విధానం
  choice: శకునం ద్వారా తెలుసుకున్నాను
  alternative: అనుభవం ద్వారా తెలుసుకున్నాను
  rationale: נחשׁ అనే క్రియకు ఇక్కడ శకునం చూడడం అనే బలమైన పదార్థం ఉంది. అయితే అనుభవం ద్వారా గ్రహించడం అనే విస్తృత అర్థం కూడా ప్రతిపాదించబడినందున దానిని పాదసూచికలో నిలిపాం; లాబాను పలికిన మాటల నిజత్వంపై వచనం తీర్పు ఇస్తున్నట్లు అనువదించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన కథన శైలిని వాడాం. హీబ్రూ నుడికారమైన ‘నీ దృష్టిలో దయ లభించడం’ను నిలిపి, అధ్యాహార అభ్యర్థనను సహజమైన తెలుగులో స్పష్టం చేశాం.
