- from: అప్పుడు లాబాను అతనితో, “నీ దృష్టిలో నాకు దయ లభించి ఉంటే, దయచేసి ఇక్కడే ఉండు.[a] నీ కారణంగానే యాహ్వే నన్ను ఆశీర్వదించాడని నేను శకునం ద్వారా తెలుసుకున్నాను[b]” అన్నాడు.
  to: అప్పుడు లాబాను అతనితో, “నీ దృష్టిలో నాకు అనుగ్రహం ఉంటే, దయచేసి ఉండిపో.[a] యాహ్వే నీ కారణంగా నన్ను ఆశీర్వదించాడని నేను శకునాలు చూసి తెలుసుకున్నాను[b]” అన్నాడు.
