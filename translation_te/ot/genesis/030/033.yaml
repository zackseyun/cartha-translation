revisions:
- from: 'తరువాత[a] నీవు నా జీతాన్ని పరిశీలించడానికి వచ్చినప్పుడు[b], నా నిజాయితీయే[c] నా తరఫున సాక్ష్యం చెబుతుంది: మేకల్లో చుక్కలు లేదా పెద్ద మచ్చలు లేనిదేదైనా, గొర్రెల్లో ముదురు రంగులో లేనిదేదైనా[d] నా దగ్గర ఉంటే, అది దొంగిలించినదిగా పరిగణించాలి[e].'
  to: 'తరువాత[a] నీవు నా జీతాన్ని పరిశీలించడానికి వచ్చినప్పుడు[b], నా నిజాయితీయే[c] నా తరఫున సాక్ష్యం చెబుతుంది: మేకల్లో చుక్కలూ పెద్ద మచ్చలూ లేని ఏ మేకైనా, గొర్రెల్లో ముదురు రంగు లేని ఏ గొర్రె అయినా[d] నా దగ్గర కనబడితే, అది దొంగిలించినదిగా పరిగణించబడుతుంది[e].'
  rationale: The revision preserves the source’s ambiguity about the timing and the sheep’s precise dark shade, while improving the goat-marking syntax and making the possession/discovery element of the final judicial clause explicit. All original footnote anchors are retained and their explanations remain aligned with the revised text.
