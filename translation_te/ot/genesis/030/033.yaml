source:
  edition: WLC
  text: וְ/עָֽנְתָה בִּ֤/י צִדְקָתִ/י֙ בְּ/י֣וֹם מָחָ֔ר כִּֽי תָב֥וֹא עַל שְׂכָרִ֖/י לְ/פָנֶ֑י/ךָ כֹּ֣ל אֲשֶׁר אֵינֶ/נּוּ֩ נָקֹ֨ד וְ/טָל֜וּא בָּֽ/עִזִּ֗ים וְ/חוּם֙ בַּ/כְּשָׂבִ֔ים גָּנ֥וּב ה֖וּא אִתִּֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/033.yaml
  text: 'So my honesty will answer for me later[a], when you come to inspect my wages: every goat that is not speckled and spotted, and every lamb that is not dark-colored[e][d][c][b], will be considered stolen if it is found with me.'
translation:
  language: te
  text: 'తరువాత[a] నీవు నా జీతాన్ని పరిశీలించడానికి వచ్చినప్పుడు[b], నా నిజాయితీయే[c] నా తరఫున సాక్ష్యం చెబుతుంది: మేకల్లో చుక్కలూ పెద్ద మచ్చలూ లేని ఏ మేకైనా, గొర్రెల్లో ముదురు రంగు లేని ఏ గొర్రె అయినా[d] నా దగ్గర కనబడితే, అది దొంగిలించినదిగా పరిగణించబడుతుంది[e].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: పదశః ‘రేపటి రోజున.’ ఇది మరుసటి రోజును లేదా లాబాను మందను పరిశీలించే తరువాతి సమయాన్ని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: పదశః ‘నీ ఎదుట ఉన్న నా జీతం విషయమై నీవు వచ్చినప్పుడు.’ సందర్భంలో ఇది జీతంగా నిర్ణయించిన జంతువులను పరిశీలించడాన్ని సూచిస్తుంది.
    reason: translation_clarification
  - marker: c
    text: ‘నా నీతి’ లేదా ‘నా యథార్థత’ అని కూడా అనువదించవచ్చు. ఇక్కడ ఈ పదం జీతపు ఒప్పందంలో యాకోబు నిష్కపటంగా వ్యవహరించాడని రుజువు కావడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: d
    text: ‘ముదురు రంగు’కు ‘గోధుమ రంగు’ అని కూడా అర్థం కావచ్చు; ‘గొర్రెల్లో’ అనే పదాన్ని ‘గొర్రెపిల్లల్లో’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: e
    text: పదశః ‘అది నా దగ్గర దొంగిలించబడినదే.’ అంటే, పేర్కొన్న గుర్తులు లేని జంతువు యాకోబు దగ్గర కనిపిస్తే, అది దొంగసొత్తుగా పరిగణించబడుతుంది.
    reason: translation_clarification
lexical_decisions:
- source_word: וְעָנְתָה בִּי
  choice: నా తరఫున సాక్ష్యం చెబుతుంది
  rationale: ענה + בִּי ఇక్కడ యాకోబు పక్షాన జవాబు చెప్పడం లేదా సాక్ష్యమివ్వడం అనే భావాన్ని ఇస్తుంది. తెలుగు పాఠకునికి సహజంగా ఉండేలా సాక్ష్యభాషలో అనువదించబడింది.
- source_word: צִדְקָתִי
  choice: నా నిజాయితీ
  rationale: జీతపు ఒప్పందంలో యాకోబు ప్రవర్తన న్యాయమైనదని రుజువయ్యే సందర్భం కావడంతో, సాధారణ పాఠకునికి ఆచరణాత్మక నైతిక భావాన్ని స్పష్టంగా తెలిపే పదం ఎంచుకోబడింది; ‘నీతి/యథార్థత’ అనే విస్తృత భావం పాదసూచికలో నిలుపబడింది.
- source_word: בְּיוֹם מָחָר
  choice: తరువాత
  rationale: పదశః ‘రేపటి రోజున’; అయితే సందర్భంలో తప్పనిసరిగా మరుసటి రోజే కాక, లాబాను భవిష్యత్తులో మందను తనిఖీ చేసే సమయాన్ని సూచించవచ్చు.
- source_word: כִּי תָבוֹא עַל שְׂכָרִי לְפָנֶיךָ
  choice: నీవు నా జీతాన్ని పరిశీలించడానికి వచ్చినప్పుడు
  rationale: హీబ్రూ వాక్యంలోని ‘నా జీతం విషయమై/మీదికి రావడం’ అనే మాటకు సందర్భానుసారమైన తనిఖీ భావం ఉంది. לְפָנֶיךָ ద్వారా లాబాను ఎదుట పరిశీలన జరుగుతుందనే భావం తెలుగులో కర్త ద్వారా సహజంగానే వ్యక్తమవుతుంది.
- source_word: נָקֹד וְטָלוּא
  choice: చుక్కలు లేదా పెద్ద మచ్చలు
  rationale: נָקֹד చిన్న చుక్కల వంటి గుర్తులను, טָלוּא పెద్ద మచ్చలు లేదా రంగు ప్యాచులను సూచిస్తుంది. నిరాకరణ పరిధిలో తెలుగు ‘లేదా’ వాడటం వల్ల ఈ రెండింటిలో ఏ గుర్తూ లేని మేక అనే ఉద్దేశం స్పష్టమవుతుంది.
- source_word: חוּם
  choice: ముదురు రంగు
  rationale: ఈ పదం గోధుమ లేదా సాధారణంగా ముదురు రంగును సూచించవచ్చు; ఖచ్చితమైన ఛాయను నిర్ణయించకుండా మూలంలోని విస్తృతతను కాపాడుతుంది.
- source_word: בַּכְּשָׂבִים
  choice: గొర్రెల్లో
  rationale: כְּשָׂבִים గొర్రెలను, కొన్నిసార్లు గొర్రెపిల్లలను సూచించగలదు. ఇక్కడ మందలోని జంతువుల వర్గాన్ని సూచిస్తున్నందున విస్తృతమైన ‘గొర్రెలు’ ఎంచుకోబడింది.
- source_word: גָּנוּב הוּא אִתִּי
  choice: నా దగ్గర ఉంటే, అది దొంగిలించినదిగా పరిగణించాలి
  rationale: హీబ్రూ సంక్షిప్తంగా ‘అది నా దగ్గర దొంగిలించబడినదే’ అంటుంది. యాకోబు దగ్గర అర్హతలేని జంతువు కనిపిస్తే దానిని దొంగసొత్తుగా తీర్మానించాలనే న్యాయార్థాన్ని తెలుగులో స్పష్టం చేసింది.
theological_decisions:
- issue: צִדְקָתִי యొక్క నైతిక/ధార్మిక పరిధి
  choice: ప్రధాన పాఠ్యంలో ‘నిజాయితీ’
  alternative: ‘నీతి’ లేదా ‘యథార్థత’
  rationale: ఇది యాకోబు జీతపు ఏర్పాటులో నిరూపించదగిన నిష్కపట ప్రవర్తనను సూచిస్తుంది. విస్తృత ధార్మిక భావాన్ని పూర్తిగా నిరాకరించకుండా పాదసూచికలో ప్రత్యామ్నాయాలు ఇవ్వబడ్డాయి.
- issue: בְּיוֹם מָחָר యొక్క కాలసూచన
  choice: ‘తరువాత’
  alternative: ‘రేపటి రోజున’
  rationale: మరుసటి రోజునే అని ఖచ్చితంగా నిర్ణయించకుండా, భవిష్యత్తులో జరిగే పరిశీలన అనే సందర్భార్థాన్ని ప్రధాన పాఠ్యంలో ఉంచి పదశః రూపాన్ని పాదసూచికలో ఇచ్చింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. పశువుల రంగు-గుర్తుల మధ్య తేడాను సాధారణ పాఠకుడు గ్రహించేలా ‘చుక్కలు’, ‘పెద్ద మచ్చలు’, ‘ముదురు రంగు’ అనే పదాలు ఎంచుకోబడ్డాయి. హీబ్రూ న్యాయసాక్ష్య ధోరణిని ‘నా తరఫున సాక్ష్యం చెబుతుంది’ మరియు ‘పరిగణించాలి’ ద్వారా నిలుపుకున్నాం.
