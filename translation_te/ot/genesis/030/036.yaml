  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, కథన గాంభీర్యాన్ని మరియు మూలంలోని చర్యల క్రమాన్ని కాపాడింది.
