source:
  edition: WLC
  text: וַ/תֹּ֣אמֶר לֵאָ֗ה נָתַ֤ן אֱלֹהִים֙ שְׂכָרִ֔/י אֲשֶׁר נָתַ֥תִּי שִׁפְחָתִ֖/י לְ/אִישִׁ֑/י וַ/תִּקְרָ֥א שְׁמ֖/וֹ יִשָּׂשכָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/018.yaml
  text: And Leah said[a], “God has given me my reward, because I gave my female servant to my husband.” So she named him Issachar.
translation:
  language: te
  text: 'లేయా ఇలా చెప్పింది: “నేను నా దాసిని నా భర్తకు ఇచ్చినందుకు దేవుడు నాకు కూలి ఇచ్చాడు.” అందుకే ఆమె అతనికి ఇశ్శాఖారు[a] అని పేరు పెట్టింది.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ఇశ్శాఖారు” అనే పేరు హీబ్రూలో “కూలి” లేదా “ప్రతిఫలం” అనే అర్థమిచ్చే పదంతో ధ్వనిసామ్యం కలిగి ఉంది; ఇది లేయా చెప్పిన వివరణను ప్రతిబింబిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָתַן אֱלֹהִים
  choice: దేవుడు ఇచ్చాడు
  rationale: హీబ్రూ క్రియకు దేవుడు కర్త. పూర్తయిన కార్యాన్ని తెలుగులో సహజంగా భూతకాలంతో వ్యక్తం చేశాం.
- source_word: שְׂכָרִי
  choice: నాకు కూలి
  rationale: שָׂכָרకు ‘కూలి, జీతం, ప్రతిఫలం’ అనే అర్థాలున్నాయి. ‘కూలి’ లేయా మాటల్లోని లావాదేవీ భావాన్ని, ఇశ్శాఖారు పేరుతో ఉన్న పదసామ్యాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: אֲשֶׁר
  choice: ఇచ్చినందుకు
  rationale: ఈ నిర్మాణంలో సంబంధార్థక అవ్యయం కారణాన్ని సూచిస్తుంది; తెలుగులో ‘ఇచ్చినందుకు’ ఆ కారణ సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: שִׁפְחָתִי
  choice: నా దాసిని
  rationale: ఈ పదం ఆధీనస్థితిలో ఉన్న స్త్రీ సేవకురాలిని సూచిస్తుంది. ‘దాసి’ లింగాన్ని, సేవా/బానిస స్థితి భావపరిధిని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: לְאִישִׁי
  choice: నా భర్తకు
  rationale: సందర్భంలో אִישִׁי లేయా వైవాహిక సంబంధంలోని యాకోబును సూచిస్తుంది; అందువల్ల ‘నా భర్తకు’ స్పష్టమైన సహజ అనువాదం.
- source_word: וַתִּקְרָא שְׁמוֹ
  choice: ఆమె అతనికి ... అని పేరు పెట్టింది
  rationale: హీబ్రూ నామకరణ నుడికారాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: יִשָּׂשכָר
  choice: ఇశ్శాఖారు
  rationale: వ్యక్తి పేరును తెలుగు లిపిలో ధ్వన్యనుసారంగా ఇచ్చాం; కూలి/ప్రతిఫలం అనే పదంతో ఉన్న హీబ్రూ పదసామ్యాన్ని పాదసూచికలో వివరించాం.
theological_decisions:
- issue: లేయా ప్రసవాన్ని దేవుడు ఇచ్చిన కూలిగా వివరించడం
  choice: లేయా పలికిన దైవిక ప్రతిఫల భావాన్ని యథాతథంగా ఉంచడం
  alternative: ‘కూలి’ బదులు మరింత సాధారణమైన ‘ప్రతిఫలం’ వాడి లావాదేవీ భావాన్ని తగ్గించడం
  rationale: ఇది సంఘటనలపై లేయా చేసిన వ్యాఖ్య. అనువాదం ఆమె మాటను సమర్థించకూడదు, విమర్శించకూడదు; దానిలోని దైవిక ప్రతిఫల భావాన్నీ ఉద్రిక్తతనూ నిలుపాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలిని వాడాం. ‘కూలి’ ద్వారా మూలంలోని పదసామ్యాన్ని, లావాదేవీ ఛాయను నిలిపి, పేరుకు వెంటనే పాదసూచిక సూచికను ఉంచాం.
