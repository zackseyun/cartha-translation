    text: ‘దాసి’ లేదా ‘బానిస స్త్రీ’ అని కూడా అనువదించవచ్చు. హీబ్రూ שִׁפְחָה అనే పదం గృహంలో అధీన స్థితిలో ఉన్న స్త్రీ సేవకురాలిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּלֶד
  choice: కనింది
  rationale: ילד క్రియ యొక్క వయ్యిక్తోల్ రూపం కథనంలోని తదుపరి సంఘటనను తెలియజేస్తుంది; కుమారునికి జన్మనివ్వడాన్ని సహజమైన ఆధునిక తెలుగులో ‘కనింది’ అని వ్యక్తపరుస్తుంది.
- source_word: זִלְפָּה
  choice: జిల్పా
  rationale: వ్యక్తి పేరును తెలుగులో ప్రాచుర్యంలో ఉన్న ధ్వన్యనుకరణ రూపంలో ఇచ్చాం.
- source_word: שִׁפְחַת
  choice: దాసి
  rationale: שִׁפְחָה గృహంలో అధీన స్థితిలో ఉన్న స్త్రీ సేవకురాలిని లేదా బానిసను సూచిస్తుంది. ‘దాసి’ లింగాన్నీ అధీన సామాజిక స్థితినీ సంక్షిప్తంగా నిలుపుతుంది; అర్థ పరిధిని పాదటిప్పణిలో వివరించాం.
- source_word: לֵאָה
  choice: లేయా ... అయిన
  rationale: హీబ్రూ నిర్మాణ సంబంధాన్ని తెలుగులో సహజంగా ‘లేయా దాసి అయిన’ అని వ్యక్తపరిచాం.
- source_word: לְיַעֲקֹב
  choice: యాకోబుకు
  rationale: ילדతో కూడిన לְ తండ్రి లేదా ప్రయోజితుని సంబంధాన్ని సూచిస్తుంది; దాని రూపాన్ని తెలుగులో ‘యాకోబుకు’ అని నిలిపాం.
- source_word: בֵּן
  choice: ఒక కుమారుణ్ణి
  rationale: సందర్భంలోని అనిర్దిష్ట ఏకవచన నామవాచకాన్ని సహజమైన తెలుగులో ‘ఒక కుమారుణ్ణి’ అని అనువదించాం.
