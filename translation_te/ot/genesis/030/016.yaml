revisions:
- from: సాయంకాలం యాకోబు పొలం నుండి తిరిగి వచ్చినప్పుడు, లేయా అతనిని ఎదుర్కోవడానికి వెళ్లి, “నువ్వు నా దగ్గరకు రావాలి; ఎందుకంటే నా కుమారుని మాండ్రేక్ పండ్లు ఇచ్చి నిన్ను వెలకు తీసుకున్నాను[a]” అని చెప్పింది. ఆ రాత్రి అతడు ఆమెతో శయనించాడు.
  to: సాయంకాలం యాకోబు పొలం నుండి వచ్చినప్పుడు, లేయా అతనిని కలవడానికి బయటకు వెళ్లి, “నువ్వు నా వద్దకు రావాలి; ఎందుకంటే నా కుమారుని మాండ్రేక్ పండ్లతో నిన్ను కూలికి తీసుకున్నాను[a]” అని చెప్పింది. ఆ రాత్రి అతడు ఆమెతో శయనించాడు.
  rationale: The revised wording removes an unstated implication (‘returned’), replaces a non-idiomatic transactional expression with natural Telugu (‘కూలికి తీసుకున్నాను’), and uses an unambiguous expression for Leah’s going out to meet Jacob. It preserves the source’s direct command, the transactional ambiguity of the mandrakes, and the restrained sexual euphemism.
