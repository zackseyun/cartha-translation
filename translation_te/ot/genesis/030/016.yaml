  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּבֹ֨א יַעֲקֹ֣ב מִן הַ/שָּׂדֶה֮ בָּ/עֶרֶב֒ וַ/תֵּצֵ֨א לֵאָ֜ה לִ/קְרָאת֗/וֹ וַ/תֹּ֨אמֶר֙ אֵלַ֣/י תָּב֔וֹא כִּ֚י שָׂכֹ֣ר שְׂכַרְתִּ֔י/ךָ בְּ/דוּדָאֵ֖י בְּנִ֑/י וַ/יִּשְׁכַּ֥ב עִמָּ֖/הּ בַּ/לַּ֥יְלָה הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/016.yaml
  text: When Jacob came in from the field in the evening[a], Leah went out to meet him and said, “You must come in to me, for I have hired you with my son’s mandrakes.” So he lay with her that night.
translation:
  language: te
  text: సాయంకాలం యాకోబు పొలం నుండి వచ్చినప్పుడు, లేయా అతనిని కలవడానికి బయటకు వెళ్లి, “నువ్వు నా వద్దకు రావాలి; ఎందుకంటే నా కుమారుని మాండ్రేక్ పండ్లతో నిన్ను కూలికి తీసుకున్నాను[a]” అని చెప్పింది. ఆ రాత్రి అతడు ఆమెతో శయనించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నా కుమారుని మాండ్రేక్ పండ్లతో నిన్ను నిజంగానే కూలికి తీసుకున్నాను.” హెబ్రీయులో ‘కూలికి తీసుకోవడం’ అనే క్రియ పునరుక్తమై మాటకు బలాన్ని ఇస్తుంది; మాండ్రేక్ పండ్లు ఈ ఏర్పాటుకు చెల్లింపుగా లేదా సాధనంగా సూచించబడుతున్నాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא ... מִן הַשָּׂדֶה
  choice: పొలం నుండి తిరిగి వచ్చినప్పుడు
  rationale: בוא అనే రాకను, పొలం నుండి నివాసస్థలానికి తిరిగి రావడమనే సందర్భానుసారమైన సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בָּעֶרֶב
  choice: సాయంకాలం
  rationale: కాలసూచక పదబంధానికి సంక్షిప్తమైన, సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: וַתֵּצֵא ... לִקְרָאתוֹ
  choice: అతనిని ఎదుర్కోవడానికి వెళ్లి
  rationale: లేయా యాకోబును కలుసుకోవడానికి బయటకు వెళ్లిందనే చలనాన్ని నిలుపుతుంది; ‘ఎదుర్కోవడానికి’ ఇక్కడ విరోధార్థంలో కాక, ఎదురుగా వెళ్లి కలుసుకోవడమనే అర్థంలో ఉంది.
- source_word: אֵלַי תָּבוֹא
  choice: నువ్వు నా దగ్గరకు రావాలి
  rationale: సందర్భంలోని లైంగిక ఆహ్వానాన్ని అసభ్యంగా కాకుండా సూచించే మూలభాషా నుడికారాన్ని, లేయా గట్టిగా చెప్పిన హక్కుదావాతో సహా నిలుపుతుంది.
- source_word: שָׂכֹר שְׂכַרְתִּיךָ
  choice: నిన్ను వెలకు తీసుకున్నాను
  rationale: שׂכר యొక్క కిరాయి/వెల చెల్లించి పొందడం అనే లావాదేవీ భావాన్ని సహజ తెలుగులో అందిస్తుంది. హెబ్రీయులోని ధాతు పునరుక్తి ఇచ్చే దృఢత్వాన్ని వాక్యంలోని ‘రావాలి’ అనే గట్టి దావా కూడా మోస్తుంది.
- source_word: בְּדוּדָאֵי בְּנִי
  choice: నా కుమారుని మాండ్రేక్ పండ్లు ఇచ్చి
  rationale: בְ ఇక్కడ ఏర్పాటుకు చెల్లించిన వెల లేదా సాధనాన్ని సూచిస్తుంది. ‘ఇచ్చి’ ఆ లావాదేవీ సంబంధాన్ని స్పష్టంగా, కాని అతివ్యాఖ్యానం చేయకుండా తెలుపుతుంది.
- source_word: וַיִּשְׁכַּב עִמָּהּ
  choice: అతడు ఆమెతో శయనించాడు
  rationale: లైంగిక సంబంధానికి మూలంలోని గౌరవప్రదమైన సభ్యోక్తిని తెలుగు బైబిలు శైలికి అనుగుణంగా నిలుపుతుంది.
- source_word: בַּלַּיְלָה הוּא
  choice: ఆ రాత్రి
  rationale: הוּא యొక్క నిర్దేశక బలాన్ని సహజ తెలుగులో ‘ఆ’ ద్వారా వ్యక్తం చేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన కథనశైలిని, గౌరవప్రదమైన బైబిలు ధోరణితో కలిపాం. ‘మాండ్రేక్’ అనే మొక్కపేరును గుర్తించదగిన లిప్యంతరీకరణగా ఉంచి, సందర్భానికి అనుగుణంగా ‘పండ్లు’ చేర్చాం. లైంగిక భావాన్ని మూలంలోని సభ్యోక్తి మేరకే వ్యక్తం చేశాం.
