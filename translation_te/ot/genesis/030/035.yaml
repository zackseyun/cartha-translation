  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా పశువుల గుర్తుల మధ్య పదభేదాన్ని ‘చారలు/చుక్కలు/మచ్చలు’గా నిలిపి, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం.
