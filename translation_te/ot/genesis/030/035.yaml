source:
  edition: WLC
  text: וַ/יָּ֣סַר בַּ/יּוֹם֩ הַ/ה֨וּא אֶת הַ/תְּיָשִׁ֜ים הָֽ/עֲקֻדִּ֣ים וְ/הַ/טְּלֻאִ֗ים וְ/אֵ֤ת כָּל הָֽ/עִזִּים֙ הַ/נְּקֻדּ֣וֹת וְ/הַ/טְּלֻאֹ֔ת כֹּ֤ל אֲשֶׁר לָבָן֙ בּ֔/וֹ וְ/כָל ח֖וּם בַּ/כְּשָׂבִ֑ים וַ/יִּתֵּ֖ן בְּ/יַד בָּנָֽי/ו־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/035.yaml
  text: That day he removed the male goats that were streaked and spotted[a], and all the female goats that were speckled and spotted—every one that had white on it—and every dark-colored one among the lambs[c][b], and he put them into the care of his sons.
translation:
  language: te
  text: ఆ రోజే అతడు చారలున్న, మచ్చలున్న మగ మేకలనూ,[a] చుక్కలున్న, మచ్చలున్న ఆడ మేకలన్నిటినీ—అంటే ఒంటిమీద తెలుపు ఉన్న ప్రతిదానినీ—గొర్రెపిల్లల్లో ముదురు గోధుమ రంగులో ఉన్న ప్రతిదానినీ[b] వేరు చేసి, వాటిని తన కుమారుల సంరక్షణకు అప్పగించాడు.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘చారలున్న’ అనే మాటకు ‘పట్టీలున్న’ అని కూడా అనువదించవచ్చు; హీబ్రూ పదం జంతువుల ఒంటిమీద పట్టీలు లేదా చారల వంటి గుర్తులను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘ముదురు గోధుమ రంగులో’ అనే చోట ‘ముదురు రంగులో’ అని కూడా అనువదించవచ్చు; హీబ్రూ పదం గోధుమ లేదా ముదురు గోధుమ వర్ణాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: అక్షరార్థంగా, ‘తన కుమారుల చేతిలో పెట్టాడు’; ఇది వారి ఆధీనానికి లేదా సంరక్షణకు అప్పగించడాన్ని సూచించే హీబ్రూ నుడికారం.
    reason: idiom
lexical_decisions:
- source_word: וַיָּסַר
  choice: వేరు చేసి
  rationale: హిఫిల్ రూపం మందలోనుంచి జంతువులను తొలగించి ప్రత్యేకంగా ఉంచడాన్ని సూచిస్తుంది; సందర్భంలో ‘వేరు చేసి’ సహజంగా ఉంది.
- source_word: בַּיּוֹם הַהוּא
  choice: ఆ రోజే
  rationale: హీబ్రూ కాలసూచనను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; ‘ఏ’ ఆ రోజునే చర్య జరిగిందనే కథన బలాన్ని ఇస్తుంది.
- source_word: הַתְּיָשִׁים
  choice: మగ మేకలు
  rationale: תיש ప్రత్యేకంగా మగ మేకను సూచిస్తుంది.
- source_word: הָעֲקֻדִּים
  choice: చారలున్న
  rationale: ఈ పదం జంతువుల ఒంటిమీద పట్టీలు లేదా చారల వంటి గుర్తులను సూచిస్తుంది.
- source_word: הַטְּלֻאִים / הַטְּלֻאֹת
  choice: మచ్చలున్న
  rationale: ఈ పదం పెద్దవో అసమానమైనవో అయిన రంగు మచ్చలను సూచిస్తుంది; రెండు లింగరూపాలకూ ఒకే అనువాదం మూలంలోని పదసామ్యాన్ని నిలుపుతుంది.
- source_word: הָעִזִּים
  choice: ఆడ మేకలు
  rationale: సాధారణంగా ‘మేకలు’ అని అర్థమైనా, ముందు చెప్పిన మగ మేకలకు భిన్నంగా ఇక్కడ లింగభేదాన్ని సందర్భం స్పష్టం చేస్తుంది.
- source_word: הַנְּקֻדּוֹת
  choice: చుక్కలున్న
  rationale: చిన్న చుక్కలవంటి గుర్తులను సూచించి, טלאות అనే ‘మచ్చలున్న’ పదంతో ఉన్న భేదాన్ని నిలుపుతుంది.
- source_word: כֹּל אֲשֶׁר לָבָן בּוֹ
  choice: ఒంటిమీద తెలుపు ఉన్న ప్రతిదానినీ
  rationale: ప్రతి జంతువు శరీరంపై తెలుపు రంగు ఏదో మేరకు ఉండటాన్ని సూచించే పంపిణీ భావాన్ని నిలుపుతుంది.
- source_word: וְכָל חוּם בַּכְּשָׂבִים
  choice: గొర్రెపిల్లల్లో ముదురు గోధుమ రంగులో ఉన్న ప్రతిదానినీ
  rationale: חוּם గోధుమ లేదా ముదురు గోధుమ వర్ణాన్ని సూచిస్తుంది; כְּשָׂבִים ఇక్కడ చిన్న గొర్రెలను సూచించగలదు.
- source_word: וַיִּתֵּן בְּיַד בָּנָיו
  choice: వాటిని తన కుమారుల సంరక్షణకు అప్పగించాడు
  rationale: ‘చేతిలో పెట్టాడు’ అనే హీబ్రూ నుడికారం వారి ఆధీనానికి లేదా సంరక్షణకు అప్పగించడాన్ని సూచిస్తుంది.
