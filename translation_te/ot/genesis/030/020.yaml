  text: וַ/תֹּ֣אמֶר לֵאָ֗ה זְבָדַ֨/נִי אֱלֹהִ֥ים אֹתִ/י֮ זֵ֣בֶד טוֹב֒ הַ/פַּ֨עַם֙ יִזְבְּלֵ֣/נִי אִישִׁ֔/י כִּֽי יָלַ֥דְתִּי ל֖/וֹ שִׁשָּׁ֣ה בָנִ֑ים וַ/תִּקְרָ֥א אֶת שְׁמ֖/וֹ זְבֻלֽוּן׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/020.yaml
  text: And Leah said[a], “God has endowed me with a good endowment. This time my husband will honor me, because I have borne him six sons.” So she called his name Zebulun.
translation:
  language: te
  text: లేయా, “దేవుడు నాకు మంచి బహుమానం అనుగ్రహించాడు. నేను నా భర్తకు ఆరుగురు కుమారులను కన్నాను కాబట్టి, ఈసారి నా భర్త నన్ను గౌరవిస్తాడు[a]” అని చెప్పి, అతనికి జెబూలూను అని పేరు పెట్టింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నాతో నివసిస్తాడు” లేదా “నాతో ఉంటాడు.” ఇక్కడి హీబ్రూ క్రియ అరుదైనది; అది ‘జెబూలూను’ అనే పేరుతో పదప్రయోగంగా ముడిపడి ఉంది. ఈ మాటలో గౌరవించడం, తనతో నివసించడం లేదా తనతోనే ఉండిపోవడం అనే భావాలు కలిసి ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: זְבָדַנִי ... זֵבֶד טוֹב
  choice: నాకు మంచి బహుమానం అనుగ్రహించాడు
  rationale: ఒకే మూలానికి చెందిన క్రియ–నామపదాల పదప్రయోగాన్ని తెలుగులో పూర్తిగా పునరుత్పత్తి చేయడం సహజంగా సాధ్యం కాదు. ‘బహుమానం అనుగ్రహించాడు’ అనేది దేవుడు ఇచ్చిన మంచి కానుక/అనుగ్రహం అనే భావాన్ని గౌరవప్రదమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: הַפַּעַם
  choice: ఈసారి
  rationale: సందర్భంలోని లేయా ఆశలో వచ్చిన మార్పును సహజంగా, సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: יִזְבְּלֵנִי
  choice: నన్ను గౌరవిస్తాడు[a]
  rationale: అరుదైన ఈ క్రియకు సందర్భానుసారంగా ‘గౌరవిస్తాడు’ ప్రధాన పాఠంగా సరిపోతుంది; ‘నాతో నివసిస్తాడు/ఉంటాడు’ అనే సాధ్యమైన అర్థాన్ని పాదసూచికలో నిలిపాం.
- source_word: אִישִׁי
  choice: నా భర్త
  rationale: వైవాహిక సందర్భంలో సహజమైన, స్పష్టమైన తెలుగు సమానార్థకం.
- source_word: יָלַדְתִּי לוֹ שִׁשָּׁה בָנִים
  choice: నేను నా భర్తకు ఆరుగురు కుమారులను కన్నాను
  rationale: לוֹ అనే పరోక్ష కర్మను స్పష్టంగా నిలుపుతూ, సాధారణ ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: וַתִּקְרָא אֶת שְׁמוֹ זְבֻלוּן
  choice: అతనికి జెబూలూను అని పేరు పెట్టింది
  rationale: హీబ్రూ నామకరణ సూత్రాన్ని సహజమైన తెలుగు వాక్యరూపంలో అందిస్తుంది.
- source_word: זְבֻלוּן
  choice: జెబూలూను
  rationale: హీబ్రూ వ్యక్తినామానికి సమీపమైన, తెలుగులో చదవదగిన లిప్యంతరీకరణ.
theological_decisions:
- issue: יִזְבְּלֵנִי అనే అరుదైన క్రియ యొక్క అర్థం
  choice: గౌరవిస్తాడు
  alternative: నాతో నివసిస్తాడు / నాతో ఉంటాడు
  rationale: ఆరుగురు కుమారులను కన్నందువల్ల భర్త తనకు మెరుగైన ఆదరణ ఇస్తాడనే లేయా ఆశకు ‘గౌరవిస్తాడు’ సరిపోతుంది. అయితే క్రియ అరుదైనది; జెబూలూను పేరుతో ఉన్న పదప్రయోగం కారణంగా నివసించడం/ఉండడం అనే భావం కూడా సాధ్యమే. అందువల్ల అనిశ్చితిని పాదసూచికలో సంరక్షించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం ఉపయోగించబడింది. హీబ్రూ పదప్రయోగాన్ని తెలుగులో బలవంతంగా అనుకరించకుండా, ప్రధాన భావాన్ని పాఠంలోనూ నిజమైన నిఘంటు అనిశ్చితిని పాదసూచికలోనూ నిలిపాం.
