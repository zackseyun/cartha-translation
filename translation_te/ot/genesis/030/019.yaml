translation:
  language: te
  text: లేయా మళ్లీ గర్భం ధరించి, యాకోబుకు ఆరవ కుమారుణ్ణి కనింది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתַּהַר
  choice: గర్భవతియై
  rationale: హీబ్రూ הרה గర్భం ధరించడాన్ని సూచిస్తుంది. ఆధునిక తెలుగు జననవివరణలో ‘గర్భవతియై’ సహజంగా, సంక్షిప్తంగా ఉంది.
- source_word: עוֹד
  choice: మళ్లీ
  rationale: ఈ కథన క్రమంలో עוֹד పునరావృతిని, అంటే లేయా మరొకసారి గర్భవతి కావడాన్ని సూచిస్తుంది.
- source_word: וַתֵּלֶד
  choice: కనింది
  rationale: ילד ఈ రూపంలో బిడ్డకు జన్మనివ్వడం అని అర్థం. ‘కనింది’ సాధారణ ఆధునిక తెలుగులో సహజమైన సమానార్థకం.
- source_word: בֵּן
  choice: కుమారుణ్ణి
  rationale: בֵּן నేరుగా ‘కుమారుడు’ అని అర్థం; కర్మవిభక్తితో ‘కుమారుణ్ణి’గా ఇచ్చాం.
- source_word: שִׁשִּׁי
  choice: ఆరవ
  rationale: ఈ క్రమసంఖ్య కుమారుని జననక్రమాన్ని తెలియజేస్తుంది; తెలుగులో ‘ఆరవ కుమారుడు’ సహజమైన నిర్మాణం.
- source_word: לְיַעֲקֹב
  choice: యాకోబుకు
  rationale: לְ ఉపసర్గ యాకోబుతో సంబంధాన్ని సూచిస్తూ ‘యాకోబుకు కుమారుణ్ణి కనింది’ అనే తెలుగు జననవివరణ నిర్మాణంలో సహజంగా నిలుస్తుంది.
