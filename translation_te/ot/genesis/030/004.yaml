  yaml_path: translation/ot/genesis/030/004.yaml
  text: So she gave him Bilhah her servant as a wife[a], and Jacob went in to her.
translation:
  language: te
  text: అప్పుడు ఆమె తన దాసియైన[a] బిల్హాను అతనికి భార్యగా ఇచ్చింది; యాకోబు ఆమెతో శయనించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తన సేవకురాలైన.” హీబ్రూ పదం అధీన సామాజిక స్థితిలోని స్త్రీ సేవకురాలిని సూచిస్తుంది.
    reason: శִׁפְחָהకు ప్రత్యామ్నాయ సహజ తెలుగు పదాన్ని మరియు దాని సామాజిక స్థితి సూచనను తెలియజేయడానికి.
lexical_decisions:
- source_word: וַתִּתֶּן
  choice: కాబట్టి ఆమె ... ఇచ్చింది
  rationale: వావ్-కన్సిక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది; ముందటి సందర్భానికి ఫలితసంబంధాన్ని సహజమైన తెలుగులో ‘కాబట్టి’ తెలియజేస్తుంది.
- source_word: לּוֹ
  choice: అతనికి
  rationale: హీబ్రూ పూర్వప్రత్యయ సర్వనామంలోని పరోక్ష కర్మను సహజంగా, స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: בִּלְהָה
  choice: బిల్హా
  rationale: వ్యక్తి పేరును ఆధునిక ప్రామాణిక తెలుగు లిప్యంతరీకరణలో ఇచ్చాం.
- source_word: שִׁפְחָתָהּ
  choice: తన దాసియైన
  rationale: שִׁפְחָה అనేది అధీన సామాజిక స్థితిలోని స్త్రీ సేవకురాలిని సూచిస్తుంది. ‘దాసి’ సంక్షిప్తంగా, లింగాన్ని మరియు అధీన స్థితిని నిలుపుతుంది.
- source_word: לְאִשָּׁה
  choice: భార్యగా
  rationale: ఈ నిర్మాణం వివాహ లేదా ఉపపత్నీ సంబంధంలో ఇవ్వడాన్ని సూచిస్తుంది; మూలంలోని సంబంధపరమైన పదాన్ని వివరణ జోడించకుండా నిలుపుతుంది.
- source_word: וַיָּבֹא אֵלֶיהָ
  choice: ఆమెతో కలిశాడు
  rationale: ఇది లైంగిక సంయోగానికి హీబ్రూలోని మర్యాదాపూర్వక నానుడి. పదక్షరంగా అసహజమైన తెలుగుకన్నా ‘కలిశాడు’ మూలంలోని సభ్యోక్తిని సహజంగా నిలుపుతుంది.
- source_word: יַעֲקֹב
  choice: యాకోబు
  rationale: వ్యక్తి పేరుకు తెలుగులో స్థిరపడిన బైబిలు రూపాన్ని ఉపయోగించాం.
theological_decisions:
- issue: బిల్హా సంబంధ స్థితిని לְאִשָּׁה ద్వారా వ్యక్తపరచడం
  choice: భార్యగా
  alternative: ఉపపత్నిగా
  rationale: మూలపాఠం నేరుగా ‘స్త్రీ/భార్యగా’ అని చెబుతుంది; ‘ఉపపత్ని’ అని నిర్దిష్టీకరించడం సామాజిక సందర్భాన్ని వివరించినా, మూలంలోని పదాన్ని సంకుచితం చేస్తుంది. అందువల్ల ఉద్రిక్తతను పరిష్కరించకుండా ‘భార్యగా’ ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే గౌరవప్రదమైన కథన శైలి. మూలంలోని లైంగిక సభ్యోక్తిని సహజ తెలుగు సభ్యోక్తితో అందించాం.
