id: GEN.30.8
reference: Genesis 30:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/תֹּ֣אמֶר רָחֵ֗ל נַפְתּוּלֵ֨י אֱלֹהִ֧ים נִפְתַּ֛לְתִּי עִם אֲחֹתִ֖/י גַּם יָכֹ֑לְתִּי וַ/תִּקְרָ֥א שְׁמ֖/וֹ נַפְתָּלִֽי׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/008.yaml
  text: Then Rachel said[a], “With wrestlings of God I have wrestled with my sister, and I have also prevailed.” So she called his name Naphtali.
translation:
  language: te
  text: 'అప్పుడు రాహేలు ఇలా చెప్పింది: “దేవుని పోరాటాలతో[a] నేను నా సోదరితో పోరాడాను; నేను కూడా గెలిచాను.” ఆమె అతనికి నఫ్తాలి అని పేరు పెట్టింది.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూలో అక్షరార్థంగా: “దేవుని పోరాటాలతో నేను పోరాడాను.” ఈ మాటకు “దైవిక పోరాటాలతో” లేదా “మహా పోరాటాలతో” అనే అర్థం కూడా ఉండవచ్చు. ఈ మాటకూ ‘నఫ్తాలి’ అనే పేరుకూ హీబ్రూలో పదక్రీడ ఉంది.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נַפְתּוּלֵי אֱלֹהִים
  choice: దేవుని పోరాటాలతో
  rationale: హీబ్రూ నిర్మాణాన్ని నేరుగా ప్రతిబింబిస్తూ దానిలోని నిజమైన సందిగ్ధతను నిలుపుతుంది. ఇది ‘దైవిక పోరాటాలతో’ లేదా అతిశయార్థంలో ‘మహా పోరాటాలతో’ అని కూడా అర్థం కావచ్చు; ఆ అవకాశాలను పాదటీపులో తెలిపాం.
- source_word: נִפְתַּלְתִּי
  choice: నేను ... పోరాడాను
  rationale: పోటీతో కూడిన సంఘర్షణ భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; నఫ్తాలి అనే పేరుతో ఉన్న హీబ్రూ పదక్రీడ అనువాదంలో పూర్తిగా నిలవదు.
- source_word: עִם אֲחֹתִי
  choice: నా అక్కతో
  rationale: עִם యొక్క ప్రాథమిక అర్థమైన ‘తో’ను నిలుపుతుంది. ఆదికాండపు కథనంలో లేయా రాహేలుకు పెద్ద సోదరి కాబట్టి సహజమైన తెలుగు బంధుత్వపదం ‘అక్క’ను వాడాం; సందర్భంలో ఇది ప్రత్యర్థిత్వాన్ని సూచిస్తుంది.
- source_word: גַּם יָכֹלְתִּי
  choice: గెలిచాను కూడా
  rationale: ఈ పోటీ సందర్భంలో క్రియ సూచించే సఫలత లేదా పైచేయి సాధించడాన్ని సాధారణ పాఠకులకు స్పష్టమైన తెలుగులో తెలియజేస్తుంది.
- source_word: וַתִּקְרָא שְׁמוֹ נַפְתָּלִי
  choice: అతనికి నఫ్తాలి అని పేరు పెట్టింది
  rationale: హీబ్రూ నామకరణ సూత్రాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: נַפְתָּלִי
  choice: నఫ్తాలి
  rationale: హీబ్రూ వ్యక్తినామానికి సమీపమైన తెలుగు లిప్యంతరీకరణ. పేరుకూ נפתל/נפתולים పదాలకూ మధ్యనున్న పదక్రీడ తెలుగులో పూర్తిగా పునరుత్పత్తి చేయడం సాధ్యం కాదు.
theological_decisions:
- issue: నַפְתּוּלֵי אֱלֹהִים లో אֱלֹהִים పాత్ర
  choice: దేవుని పోరాటాలతో
  alternative: దైవిక పోరాటాలతో; మహా పోరాటాలతో
  rationale: אֱלֹהִים దేవునికి ప్రత్యక్ష సూచన కావచ్చు, ‘దైవిక’ అనే గుణార్థం ఇవ్వవచ్చు, లేదా అతిశయ సూచకంగా ‘మహా’ అని అర్థం కావచ్చు. ప్రధాన పాఠ్యంలో మరింత రూపపరమైన అనువాదాన్ని ఉంచి, ప్రత్యామ్నాయాలను పాదటీపులో ఇచ్చి వేదాంతపరమైన సందిగ్ధతను పరిష్కరించకుండా నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలిని వాడాం. ‘అక్కతో’ అనేది హీబ్రూ ‘తో’ను నిలుపుతూనే తెలుగు బంధుత్వ ప్రయోగాన్ని సహజంగా చేస్తుంది. పాదటీపు సూచిక [a] ప్రధాన పాఠ్యంలో ఉంది.
