  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/תַּ֖הַר וַ/תֵּ֣לֶד בֵּ֑ן וַ/תֹּ֕אמֶר אָסַ֥ף אֱלֹהִ֖ים אֶת חֶרְפָּתִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/023.yaml
  text: She conceived and bore a son[a], and said, “God has taken away my reproach.”
translation:
  language: te
  text: ఆమె గర్భం ధరించి ఒక కుమారుణ్ణి కని, “దేవుడు నా అవమానాన్ని తొలగించాడు[a]” అని చెప్పింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నా అపకీర్తిని” లేదా “నా సిగ్గును.”
    reason: חֶרְפָּה అనే పదంలోని నింద, సామాజిక అపకీర్తి, సిగ్గు అనే సమీప అర్థాలను తెలియజేయడానికి.
lexical_decisions:
- source_word: וַתַּהַר
  choice: ఆమె గర్భం ధరించి
  rationale: הרה గర్భం ధరించడాన్ని సూచిస్తుంది. ఈ రూపం ఆధునిక ప్రామాణిక తెలుగులో సహజంగా ఉండి, కథనంలోని మొదటి చర్యను స్పష్టంగా తెలియజేస్తుంది.
- source_word: וַתֵּלֶד בֵּן
  choice: ఒక కుమారుణ్ణి కని
  rationale: ילד మరియు בֵּן కలిపి కుమారునికి జన్మనివ్వడాన్ని సూచిస్తాయి. ‘ఒక కుమారుణ్ణి కని’ సంక్షిప్తంగా, సహజమైన తెలుగు కథన శైలిలో ఉంది.
- source_word: וַתֹּאמֶר
  choice: అని చెప్పింది
  rationale: హీబ్రూ కథన కొనసాగింపును తెలుగులో ప్రత్యక్ష వాక్యం తరువాత సహజంగా వచ్చే విధంగా అనువదించాం.
- source_word: אָסַף
  choice: తొలగించాడు
  rationale: ఈ సందర్భంలో אסף అవమానాన్ని తీసివేయడం లేదా తొలగించడం అనే భావాన్ని ఇస్తుంది. ‘తొలగించాడు’ పూర్తయిన చర్య ఫలితాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: אֱלֹהִים
  choice: దేవుడు
  rationale: ఇక్కడ క్రియ ఏకవచనంలో ఉండటంతో אֱלֹהִים ఏకవచన దేవుని సూచిస్తుంది.
- source_word: חֶרְפָּתִי
  choice: నా అవమానాన్ని
  rationale: חֶרְפָּה నింద, అపకీర్తి, సిగ్గు లేదా సామాజిక అవమానం అనే అర్థాలను కలిగి ఉంది. సంతానలేమికి సంబంధించిన ప్రజల దృష్టిలోని అవమానాన్ని ‘నా అవమానాన్ని’ స్పష్టంగా, సాధారణ పాఠకులకు అర్థమయ్యేలా తెలియజేస్తుంది.
theological_decisions:
- issue: אֱלֹהִים పదానికి ఏకవచన అర్థం
  choice: దేవుడు
  alternative: దేవుళ్లు
  rationale: אָסַף అనే క్రియ ఏకవచనంలో ఉండటం, అలాగే సందర్భం, ఏకవచన సూచననే కోరుతున్నాయి; అందువల్ల అదనపు సిద్ధాంత వివరణ లేకుండా ‘దేవుడు’ అని అనువదించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. హీబ్రూ వాక్యంలోని గర్భధారణ–ప్రసవం–మాట అనే క్రమాన్ని నిలుపుకున్నాం; חֶרְפָּה పదంలోని సామాజిక అవమాన భావాన్ని ప్రధాన పాఠ్యంలో ఉంచి, సమీప ప్రత్యామ్నాయాలను పాదసూచికలో ఇచ్చాం.
