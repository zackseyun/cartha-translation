id: GEN.30.7
reference: Genesis 30:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/תַּ֣הַר ע֔וֹד וַ/תֵּ֕לֶד בִּלְהָ֖ה שִׁפְחַ֣ת רָחֵ֑ל בֵּ֥ן שֵׁנִ֖י לְ/יַעֲקֹֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/007.yaml
  text: Bilhah[a], Rachel’s female servant, conceived again and bore Jacob a second son.
translation:
  language: te
  text: రాహేలు దాసి[a] బిల్హా మళ్లీ గర్భవతియై, యాకోబుకు రెండో కుమారుణ్ణి కనింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “సేవకురాలు.” హీబ్రూ పదం తక్కువ సామాజిక హోదాలో, బంధిత స్థితిలో ఉన్న స్త్రీ దాసిని లేదా సేవకురాలిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּהַר
  choice: గర్భవతియై
  rationale: הרה గర్భం ధరించడాన్ని సూచిస్తుంది; ఆధునిక తెలుగు కథనంలో ‘గర్భవతియై’ సహజంగా, సంక్షిప్తంగా ఉంటుంది.
- source_word: עוֹד
  choice: మళ్లీ
  rationale: ఈ జనన కథనంలో עוֹד సంఘటన పునరావృతమైందని సూచిస్తుంది.
- source_word: וַתֵּלֶד
  choice: కనింది
  rationale: Qal రూపంలోని ילד ఇక్కడ కుమారుణ్ణి కనడాన్ని సూచిస్తుంది; ‘కనింది’ సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: שִׁפְחַת
  choice: దాసి
  rationale: שִׁפְחָה తక్కువ సామాజిక హోదాలో, బంధిత స్థితిలో ఉన్న స్త్రీ దాసిని లేదా సేవకురాలిని సూచిస్తుంది. ‘దాసి’ ఆ స్థితిని సంక్షిప్తంగా తెలియజేస్తుంది; ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
- source_word: בֵּן שֵׁנִי
  choice: రెండో కుమారుణ్ణి
  rationale: పదబంధానికి నేరమైన అర్థం ‘రెండో కుమారుడు’; తెలుగు వాక్యనిర్మాణంలో కర్మరూపంగా ‘రెండో కుమారుణ్ణి’ సహజం.
- source_word: לְיַעֲקֹב
  choice: యాకోబుకు
  rationale: לְ ఇక్కడ సంబంధం లేదా పితృత్వాన్ని సూచిస్తూ ‘యాకోబుకు/యాకోబు కోసం’ అనే భావాన్ని కలిగి ఉంది; ‘యాకోబుకు’ మూలంలోని సంబంధాన్ని నిలుపుతుంది.
- source_word: בִּלְהָה שִׁפְחַת רָחֵל
  choice: రాహేలు దాసి బిల్హా
  rationale: హీబ్రూ అన్వయ నిర్మాణం బిల్హాను రాహేలుతో ఆమె సామాజిక స్థితి ద్వారా గుర్తిస్తుంది; ఈ క్రమం తెలుగులో స్పష్టంగా, సహజంగా ఉంటుంది.
