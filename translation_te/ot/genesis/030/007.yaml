  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. మూలంలోని ‘యాకోబుకు’ అనే సంబంధ సూచనను నిలుపుతూ, బిల్హా సామాజిక స్థితిని ‘దాసి’గా స్పష్టంగా వ్యక్తం చేశాం.
