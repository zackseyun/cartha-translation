  text: וְ/הָיָ֗ה בְּ/כָל יַחֵם֮ הַ/צֹּ֣אן הַ/מְקֻשָּׁרוֹת֒ וְ/שָׂ֨ם יַעֲקֹ֧ב אֶת הַ/מַּקְל֛וֹת לְ/עֵינֵ֥י הַ/צֹּ֖אן בָּ/רֳהָטִ֑ים לְ/יַחְמֵ֖/נָּה בַּ/מַּקְלֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/041.yaml
  text: And whenever the stronger of the flock were breeding[a], Jacob would place the rods before the eyes of the flock in the watering troughs[b], so that they might breed among the rods.
translation:
  language: te
  text: మందలోని బలమైన పశువులు జతకట్టే ప్రతిసారీ[a], యాకోబు పశువుల కళ్ల ఎదుట నీటి తొట్టెలలో[b] ఆ కర్రలను పెట్టేవాడు; అవి ఆ కర్రల మధ్య జతకట్టేలా అలా చేసేవాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘బలిష్ఠమైనవి’ లేదా ‘దృఢమైనవి’ అని కూడా అనువదించవచ్చు. హీబ్రూ పదం తదుపరి వచనంలోని బలహీనమైన పశువులకు విరుద్ధంగా, మరింత దృఢంగా ఉన్న పశువులను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘నీటి కాలువలలో’ అని కూడా అనువదించవచ్చు. హీబ్రూ పదం పశువులు తాగడానికి వచ్చే నీటి తొట్టెలను లేదా కాలువలను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה בְּכָל יַחֵם
  choice: జతకట్టే ప్రతిసారీ
  rationale: ఈ నిర్మాణం కథనంలో పదేపదే జరిగే సందర్భాన్ని సూచిస్తుంది; יחם ఇక్కడ పశువులు జతకట్టడాన్ని సూచిస్తుంది.
- source_word: הַצֹּאן
  choice: మంద
  rationale: צאן గొర్రెలు, మేకలు రెండింటినీ కలిగి ఉండగల చిన్న పశువుల సమూహాన్ని సూచిస్తుంది; ‘మంద’ జాతిని అనవసరంగా నిర్దిష్టం చేయదు.
- source_word: הַמְקֻשָּׁרוֹת
  choice: బలమైన మంద
  rationale: తదుపరి వచనంలోని బలహీనమైన వాటికి విరుద్ధంగా, దృఢమైన పశువులను ఈ పదం సూచిస్తుంది.
- source_word: וְשָׂם
  choice: పెట్టేవాడు
  rationale: పదేపదే జరిగే అలవాటు చర్యను తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: הַמַּקְלוֹת
  choice: కర్రలు
  rationale: מקלות అనగా ఈ సందర్భంలో యాకోబు ఉపయోగించిన కర్రలు; ఆధునిక తెలుగులో ఇది సహజమైన పదం.
- source_word: לְעֵינֵי הַצֹּאן
  choice: మంద కళ్ల ఎదుట
  rationale: హీబ్రూ దృశ్య ప్రధానమైన ‘కళ్ల ఎదుట’ అనే వ్యక్తీకరణను స్పష్టంగా నిలుపుతుంది.
- source_word: בָּרֳהָטִים
  choice: నీటి తొట్టెలలో
  rationale: పశువులు తాగడానికి వచ్చే తొట్టెలను లేదా కాలువలను ఈ పదం సూచిస్తుంది; సందర్భాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: לְיַחְמֶנָּה
  choice: జతకట్టాలని
  rationale: לְ ఉద్దేశాన్ని సూచిస్తుంది; యాకోబు ఉద్దేశాన్ని తెలుపుతూ, కర్రలే నేరుగా కారణమని అతిగా చెప్పదు.
- source_word: בַּמַּקְלוֹת
  choice: కర్రల మధ్య
  rationale: ב యొక్క స్థానిక లేదా పరిస్థితి సంబంధమైన భావాన్ని నిలుపుతూ, కర్రలు వాటి ఎదుట అమర్చబడి ఉన్న సమయంలో జతకట్టడాన్ని సూచిస్తుంది.
