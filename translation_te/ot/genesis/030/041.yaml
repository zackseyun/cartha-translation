revisions:
- from: బలమైన మంద జతకట్టే ప్రతిసారీ[a], యాకోబు ఆ మంద కళ్ల ఎదుట నీటి తొట్టెలలో[b] ఆ కర్రలను పెట్టేవాడు; అవి ఆ కర్రల మధ్య జతకట్టాలని అలా చేసేవాడు.
  to: మందలోని బలమైన పశువులు జతకట్టే ప్రతిసారీ[a], యాకోబు పశువుల కళ్ల ఎదుట నీటి తొట్టెలలో[b] ఆ కర్రలను పెట్టేవాడు; అవి ఆ కర్రల మధ్య జతకట్టేలా అలా చేసేవాడు.
  rationale: The revision makes explicit that the qualifying term denotes the stronger animals within the flock, preserving the contrast carried forward into the next verse. It also uses a smoother Telugu purpose construction while retaining the source’s iterative action, visual setting, and locative relationship to the rods.
  reviewer_model: gpt-5.6-terra
