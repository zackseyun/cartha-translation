  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథన శైలి. పునరావృత చర్యను ‘ప్రతిసారీ’, ‘పెట్టేవాడు’ ద్వారా వ్యక్తం చేసి, మూలంలోని దృశ్యమైన ‘కళ్ల ఎదుట’ను నిలిపాం.
