  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/תֹּ֣אמֶר לָ֗/הּ הַ/מְעַט֙ קַחְתֵּ֣/ךְ אֶת אִישִׁ֔/י וְ/לָ/קַ֕חַת גַּ֥ם אֶת דּוּדָאֵ֖י בְּנִ֑/י וַ/תֹּ֣אמֶר רָחֵ֗ל לָ/כֵן֙ יִשְׁכַּ֤ב עִמָּ/ךְ֙ הַ/לַּ֔יְלָה תַּ֖חַת דּוּדָאֵ֥י בְנֵֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/015.yaml
  text: But she said to her, “Was it a small thing that you took my husband, and would you also take my son’s mandrakes?” Rachel said, “Then he may lie with you tonight in exchange for your son’s mandrakes.”
translation:
  language: te
  text: అందుకు ఆమె, “నా భర్తను తీసుకోవడం నీకు చిన్న విషయమా? నా కుమారుని దూదాయిపండ్లను కూడా తీసుకుంటావా?” అని అంది. అప్పుడు రాహేలు, “నీ కుమారుని దూదాయిపండ్లకు బదులుగా ఈ రాత్రి అతడు నీతో పడుకుంటాడు” అని అంది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַמְעַט
  choice: చాలదా?
  rationale: అక్షరార్థంగా ‘చిన్న విషయమా?’ అనే అలంకారిక ప్రశ్న; ఆధునిక సహజ తెలుగులో అదే నిందార్థాన్ని ‘చాలదా?’ స్పష్టంగా అందిస్తుంది.
- source_word: קַחְתֵּךְ אֶת אִישִׁי
  choice: నా భర్తను తీసుకున్నది
  rationale: లేయా చేసిన ఆరోపణలోని నేరుగా, ఉద్వేగభరితమైన భావాన్ని నిలుపుతుంది; కారణాన్ని అదనంగా వివరణ చేయదు.
- source_word: דּוּדָאֵי
  choice: దూదాయిపండ్లు
  rationale: సాంప్రదాయ తెలుగు బైబిలు వాడుకలో గుర్తించదగిన మొక్కపేరు; మూలంలోని నిర్దిష్టమైన కానీ పాఠకులకు అపరిచితమైన వృక్షపదాన్ని సాధారణ పండుగా మార్చదు.
- source_word: יִשְׁכַּב עִמָּךְ
  choice: అతడు నీతో పడుకుంటాడు
  rationale: హీబ్రూ వాక్యంలోని లైంగిక సందర్భాన్ని మర్యాదగా అయినా అస్పష్టపరచకుండా తెలియజేస్తుంది.
- source_word: תַּחַת
  choice: బదులుగా
  rationale: ఇక్కడ వస్తుమార్పిడి లేదా ప్రతిఫల సంబంధాన్ని సహజ తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: రాహేలు యాకోబు సహవాసాన్ని అనుమతించడం లేదా నిర్ణయించడం
  choice: ‘అతడు నీతో పడుకుంటాడు’ అని నేరుగా అనువదించడం
  alternative: ‘అతడు నీతో పడుకోవచ్చు’
  rationale: יִשְׁכַּב రూపం సందర్భంలో ఒప్పంద ఫలితాన్ని ప్రకటిస్తుంది; రాహేలు అధికార స్వభావం లేదా నైతిక సమర్థనను అనువాదం అదనంగా నిర్ధారించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కుటుంబ ఘర్షణలోని కఠిన స్వరాన్ని నిలుపుతూ, వాక్యాన్ని సాధారణ పాఠకులకు సహజంగా మరియు గౌరవప్రదంగా ఉంచాం.
