    text: మరింత అక్షరార్థంగా, “గర్భం ధరించి యాకోబుకు ఒక కుమారుణ్ణి ప్రసవించింది.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּהַר
  choice: గర్భవతియై
  rationale: הרה అనే క్రియ గర్భం ధరించడాన్ని సూచిస్తుంది. కథన క్రమంలో తరువాతి ‘కన్నది’తో సహజంగా కలిసే ఆధునిక తెలుగు ప్రయోగం.
- source_word: בִּלְהָה
  choice: బిల్హా
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగులో సుపరిచితమైన రూపంలో లిప్యంతరీకరించాం.
- source_word: וַתֵּלֶד
  choice: కన్నది
  rationale: ילד ఇక్కడ బిడ్డకు జన్మనివ్వడాన్ని సూచిస్తుంది; ‘కన్నది’ సహజమైన, సంక్షిప్తమైన తెలుగు కథన ప్రయోగం.
- source_word: לְיַעֲקֹב
  choice: యాకోబుకు
  rationale: ל ఉపసర్గ సూచించే సంబంధాన్ని తొలగించకుండా, తెలుగులో సహజమైన సంప్రదాన విభక్తితో వ్యక్తపరుస్తుంది.
- source_word: בֵּן
  choice: ఒక కుమారుణ్ణి
  rationale: בן అంటే ‘కుమారుడు’; కర్మస్థానంలో సహజ తెలుగు రూపం ‘ఒక కుమారుణ్ణి’.
