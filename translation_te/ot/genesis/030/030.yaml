source:
  edition: WLC
  text: כִּ֡י מְעַט֩ אֲשֶׁר הָיָ֨ה לְ/ךָ֤ לְ/פָנַ/י֙ וַ/יִּפְרֹ֣ץ לָ/רֹ֔ב וַ/יְבָ֧רֶךְ יְהוָ֛ה אֹתְ/ךָ֖ לְ/רַגְלִ֑/י וְ/עַתָּ֗ה מָתַ֛י אֶֽעֱשֶׂ֥ה גַם אָנֹכִ֖י לְ/בֵיתִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/030.yaml
  text: For the little that you had before me has increased into abundance[a], and Yahweh has blessed you at my coming. And now[b], when shall I also provide for my own household?
translation:
  language: te
  text: నేను రాకముందు నీకు ఉన్నది కొంచెమే; అది విస్తారంగా పెరిగింది. నా రాకతో[a] యాహ్వే నిన్ను ఆశీర్వదించాడు. ఇప్పుడు నా సొంత ఇంటివారి కోసం నేనూ ఎప్పుడు సమకూర్చుకోవాలి?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా ‘నా పాదం వద్ద.’ ఈ నుడికారం ‘నేను వచ్చినప్పటి నుంచి’ లేదా ‘నా కారణంగా’ అని అర్థమివ్వవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘నా సొంత ఇంటి కోసం నేనూ ఎప్పుడు ఏదైనా చేసుకోవాలి?’
    reason: lexical_alternative
lexical_decisions:
- source_word: מְעַט אֲשֶׁר הָיָה לְךָ לְפָנַי
  choice: నేను రాకముందు నీకు ఉన్నది కొంచెమే
  rationale: లְפָנַי అక్షరార్థంగా ‘నా ముందు’ అయినా, సందర్భంలో యాకోబు రాకకు ముందు లాబాను వద్ద ఉన్న కొద్ది ఆస్తిని సూచిస్తుంది. ఆధునిక తెలుగులో కాలసంబంధ భావాన్ని సహజంగా వ్యక్తం చేసింది.
- source_word: וַיִּפְרֹץ לָרֹב
  choice: అది విస్తారంగా పెరిగింది
  rationale: פרץ లోని వేగంగా విస్తరించడం లేదా హద్దులు దాటి పెరగడం అనే భావాన్నీ, לָרֹב లోని సమృద్ధినీ సహజంగా కలిపి వ్యక్తం చేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని సాధారణ బిరుదుగా మార్చకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే రూపంలో లిప్యంతరీకరించింది.
- source_word: לְרַגְלִי
  choice: నా రాకతో
  rationale: అక్షరార్థంగా ‘నా పాదం వద్ద’ అనే ఈ జాతీయానికి సందర్భంలో యాకోబు రాకను అనుసరించి లేదా అతని కారణంగా ఆశీర్వాదం కలిగిందనే భావం ఉంది. ‘నా రాకతో’ ఆ కాల-కారణ ద్వంద్వసూచనను సంక్షిప్తంగా నిలుపుతుంది; పాదటిప్పణి అక్షరార్థాన్నీ ప్రత్యామ్నాయ భావాలనూ తెలియజేస్తుంది.
- source_word: מָתַי אֶעֱשֶׂה גַם אָנֹכִי לְבֵיתִי
  choice: నా సొంత ఇంటివారి కోసం నేనూ ఎప్పుడు సమకూర్చుకోవాలి?
  rationale: עשה ... לבית అనే విస్తృత ప్రయోగం ఇక్కడ కుటుంబ శ్రేయస్సు కోసం పనిచేసి సంపాదించుకోవడాన్ని సూచిస్తుంది. ‘సమకూర్చుకోవాలి’ ఆర్థిక సందర్భాన్ని సహజ తెలుగులో తెలియజేస్తుంది; ‘నేనూ’ యాకోబు-లాబానుల మధ్య వ్యత్యాసాన్ని నిలుపుతుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: పాఠంలోని ప్రత్యేక దైవనామాన్ని ‘ప్రభువు’ వంటి బిరుదుతో భర్తీ చేయకుండా ఉంచుతూ, ఆధునిక తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన రూపాన్ని ఎంచుకుంది.
- issue: లְרַגְלִי లో ఆశీర్వాదానికి కాలసంబంధమా కారణసంబంధమా
  choice: నా రాకతో
  alternative: నేను వచ్చినప్పటి నుంచి / నా కారణంగా
  rationale: హీబ్రూ జాతీయం యాకోబు రాకతో ఆశీర్వాదం కలిసివచ్చిందని చెబుతుంది; అది కేవలం కాలాన్ని సూచిస్తుందా, యాకోబే సాధనకారణమని చెబుతుందా అన్నది పూర్తిగా నిర్ధారించదు. ప్రధాన పాఠం రెండింటికీ చోటిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘ఇంటివారు’ కుటుంబాన్ని సూచిస్తుంది; ‘సమకూర్చుకోవాలి’ సందర్భంలోని జీవనోపాధి భావాన్ని సహజంగా తెలియజేస్తుంది. మూలంలోని జాతీయ ప్రయోగం మరియు దాని కాల-కారణ అస్పష్టత పాదటిప్పణిలో భద్రపరచబడ్డాయి.
