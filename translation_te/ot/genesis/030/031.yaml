translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. సంభాషణలో సహజమైన ఏకవచన ‘నువ్వు/నీ’ రూపాలు సందర్భానుకూలంగా నిలుపబడ్డాయి; אָשׁוּבָהలోని నిజమైన అర్థసందిగ్ధత పాదసూచికలో భద్రపరచబడింది.
