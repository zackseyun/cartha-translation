base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/031.yaml
  text: And he said[a], “What shall I give you?” And Jacob said, “You shall not give me anything. If you will do this thing for me, I will again pasture your flock and keep it.”
translation:
  language: te
  text: అతడు, “నేను నీకు ఏమి ఇవ్వాలి?” అన్నాడు. యాకోబు, “నువ్వు నాకు ఏమీ ఇవ్వనక్కరలేదు. నువ్వు నా కోసం ఈ పని చేస్తే, నేను మళ్లీ[a] నీ మందను మేపి కాపాడుతాను” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నేను తిరిగి వచ్చి నీ మందను మేపి, దాన్ని కాపాడుతాను.” హీబ్రూ క్రియ తిరిగి రావడాన్నిగానీ, ఆ పనిని మళ్లీ చేపట్టడాన్నిగానీ సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה אֶתֶּן לָךְ
  choice: నేను నీకు ఏమి ఇవ్వాలి?
  rationale: ప్రశ్నార్థకమైన מָה, మొదటి పురుష נתןతో కలిసి లాబాను ఇవ్వవలసిన ప్రతిఫలం ఏమిటని అడుగుతోంది. ఆధునిక తెలుగులో ‘ఏమి ఇవ్వాలి?’ ఆ ప్రతిపాదన భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לֹא תִתֶּן לִי מְאוּמָה
  choice: నువ్వు నాకు ఏమీ ఇవ్వనక్కరలేదు
  rationale: לֹאతో ఉన్న అసంపూర్ణ క్రియ ఇక్కడ భవిష్యత్ అంచనా కాక, యాకోబు ప్రతిఫలాన్ని నిరాకరించడాన్ని సూచిస్తుంది. ‘ఏమీ ఇవ్వనక్కరలేదు’ ప్రత్యక్షంగానూ సహజంగానూ ఉంది.
- source_word: אִם תַּעֲשֶׂה לִּי הַדָּבָר הַזֶּה
  choice: నువ్వు నా కోసం ఈ పని చేస్తే
  rationale: షరతును, హీబ్రూ నిర్దేశక నిర్మాణంలోని ‘ఈ పని’ అనే భావాన్ని నిలుపుతూ ఆధునిక తెలుగులో సహజంగా అనువదించబడింది.
- source_word: אָשׁוּבָה
  choice: నేను మళ్లీ
  rationale: שׁוב ఇక్కడ ఒక ప్రదేశానికి భౌతికంగా తిరిగిరావడం కంటే మందను మేపి కాపాడే సేవను తిరిగి చేపట్టడాన్ని సూచించవచ్చు. ‘మళ్లీ’ ఆ సందర్భార్థాన్ని సంక్షిప్తంగా ఇస్తుంది; ఇతర సాధ్యార్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: אֶרְעֶה צֹאנְךָ
  choice: నీ మందను మేపుతూ
  rationale: רעה, צֹאן సందర్భంలో గొర్రెలు-మేకల మందను మేపడం, పోషించడం అనే కాపరి పనిని సూచిస్తుంది. ‘మందను మేపుతూ’ స్పష్టమైన, సాధారణ తెలుగు ప్రయోగం.
- source_word: אֶשְׁמֹר
  choice: కాపాడుతాను
  rationale: שׁמר ఇక్కడ మందపై రక్షణాత్మక పర్యవేక్షణను సూచిస్తుంది. ‘కాపాడుతాను’ ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
