  text: תְּנָ֞/ה אֶת נָשַׁ֣/י וְ/אֶת יְלָדַ֗/י אֲשֶׁ֨ר עָבַ֧דְתִּי אֹֽתְ/ךָ֛ בָּ/הֵ֖ן וְ/אֵלֵ֑כָה כִּ֚י אַתָּ֣ה יָדַ֔עְתָּ אֶת עֲבֹדָתִ֖/י אֲשֶׁ֥ר עֲבַדְתִּֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/026.yaml
  text: Give me my wives and my children[a], for whom I have served you, so that I may go[b]; for you know the service with which I have served you.
translation:
  language: te
  text: నేను ఎవరి కోసం నీకు సేవ చేశానో, ఆ నా భార్యలను, నా పిల్లలను నాకు అప్పగించు[a], నేను వెళ్లిపోవడానికి. ఎందుకంటే నేను నీకు చేసిన సేవ ఎలాంటిదో నీకు తెలుసు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నేను ఎవరి కోసం నీకు సేవ చేశానో, ఆ నా భార్యలను—అలాగే నా పిల్లలను—నాకు అప్పగించు.’ హీబ్రూ స్త్రీలింగ బహువచన రూపం సేవకు ప్రతిఫలంగా పొందిన భార్యలను మరింత ప్రత్యేకంగా సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘సేవ’ అనే పదాన్ని ‘పని’ లేదా ‘శ్రమ’ అని కూడా అనువదించవచ్చు. ఈ వచనంలో హీబ్రూ మూలపదం పునరావృతమవుతున్న భావాన్ని సాధ్యమైనంతవరకు నిలుపడానికి ‘సేవ’ అని అనువదించాం.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּנָה
  choice: నాకు అప్పగించు
  rationale: נתן క్రియ యొక్క ఆజ్ఞార్థకం. సందర్భంలో యాకోబు తన భార్యలను, పిల్లలను తనతో పంపించాలని కోరుతున్నందున, ఆధునిక తెలుగులో ‘నాకు అప్పగించు’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: נָשַׁי
  choice: నా భార్యలను
  rationale: אִשָּׁה పదానికి ప్రథమ పురుష ఏకవచన స్వామ్యప్రత్యయం కలిగిన బహువచన రూపం; సందర్భంలో ఇది యాకోబు భార్యలనే సూచిస్తుంది.
- source_word: יְלָדַי
  choice: నా పిల్లలను
  rationale: ילד మూలానికి చెందిన సాధారణ కుటుంబపదం. సందర్భానికి ‘పిల్లలు’ సహజమైన, ఖచ్చితమైన తెలుగు రూపం.
- source_word: אֲשֶׁר עָבַדְתִּי אֹתְךָ בָּהֵן
  choice: నేను ఎవరి కోసం నీకు సేవ చేశానో
  rationale: ఈ సంబంధవాక్యం ముందున్న కుటుంబ సభ్యులతో అనుసంధానమవుతుంది. בָהֵן స్త్రీలింగ బహువచనం కావడం వల్ల ముఖ్యంగా భార్యలను సూచించే అవకాశం ఉన్నప్పటికీ, ప్రధాన పాఠం మొత్తం ప్రస్తావించిన కుటుంబాన్ని సహజంగా కలుపుతుంది; ఆ పరిమిత అర్థాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: וְאֵלֵכָה
  choice: నన్ను వెళ్లనివ్వు
  rationale: הלך క్రియ యొక్క cohortative రూపం యాకోబు వెళ్లాలనే సంకల్పాన్నీ, లాబాను అనుమతించాలనే అభ్యర్థననూ తెలియజేస్తుంది. ‘నన్ను వెళ్లనివ్వు’ ఆధునిక తెలుగులో ఈ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి అభ్యర్థనకు కారణాన్ని పరిచయం చేసే వివరణాత్మక ప్రయోగం.
- source_word: יָדַעְתָּ
  choice: నీకు తెలుసు
  rationale: సంపూర్ణ క్రియారూపానికి వర్తమాన ప్రాసంగికత ఉంది; తెలుగులో ‘నీకు తెలుసు’ దానిని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: עֲבֹדָתִי אֲשֶׁר עֲבַדְתִּיךָ
  choice: నేను నీకు చేసిన సేవ
  rationale: నామవాచకం עֲבֹדָה మరియు అదే עבד మూలం నుంచి వచ్చిన క్రియ మధ్యనున్న పదపునరుక్తిని ‘చేసిన సేవ’ కొంతవరకు నిలుపుతుంది; ‘పని’ లేదా ‘శ్రమ’ కూడా సందర్భానుసారం సాధ్యమైనవి.
