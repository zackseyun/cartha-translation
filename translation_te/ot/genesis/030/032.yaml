translation_notes:
  register: సామాన్య పాఠకులకు అర్థమయ్యే ఆధునిక ప్రామాణిక తెలుగు; పశుసంపద సందర్భానికి తగిన ‘మంద’, ‘వేరుచేయడం’, ‘జీతం’ వంటి సహజ పదాలు వాడబడ్డాయి. రంగు నమూనాల విషయంలో మూలంలోని అనిశ్చితి పాదసూచికలో నిలుపబడింది.
