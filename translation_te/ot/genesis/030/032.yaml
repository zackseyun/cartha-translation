source:
  edition: WLC
  text: אֶֽעֱבֹ֨ר בְּ/כָל צֹֽאנְ/ךָ֜ הַ/יּ֗וֹם הָסֵ֨ר מִ/שָּׁ֜ם כָּל שֶׂ֣ה נָקֹ֣ד וְ/טָל֗וּא וְ/כָל שֶׂה חוּם֙ בַּ/כְּשָׂבִ֔ים וְ/טָל֥וּא וְ/נָקֹ֖ד בָּ/עִזִּ֑ים וְ/הָיָ֖ה שְׂכָרִֽ/י־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/032.yaml
  text: Let me pass through all your flock today[a], removing from there every speckled and spotted sheep, every dark-colored lamb among the sheep, and every spotted and speckled one among the goats[b]; and that will be my wages.
translation:
  language: te
  text: ఈ రోజు నేను నీ మంద అంతటిలో వెళ్లి, అక్కడి నుంచి చుక్కలున్న, మచ్చలున్న ప్రతి గొర్రెను[a], గొర్రెలలోని ప్రతి ముదురు రంగు గొర్రెను[b], మేకలలోని మచ్చలున్న, చుక్కలున్న ప్రతి దానిని వేరుచేస్తాను. అదే నా జీతం అవుతుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘చుక్కలున్న’ (נָקֹד), ‘మచ్చలున్న’ (טָלוּא) అనే రెండు పదాలూ రంగు నమూనాలను సూచిస్తాయి; వాటి మధ్య ఖచ్చితమైన భేదం స్పష్టంగా లేదు.
    reason: lexical_alternative
  - marker: b
    text: ‘ముదురు రంగు’ (חוּם) అనే పదాన్ని ‘గోధుమ రంగు’ అని కూడా అనువదించవచ్చు; ఇది గొర్రెలలోని ముదురు లేదా గోధుమ వర్ణాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶעֱבֹר בְּכָל צֹאנְךָ הַיּוֹם
  choice: ఈ రోజు నీ మంద అంతటిలో నేను వెళ్లి
  rationale: עבר యొక్క అసంపూర్ణ క్రియారూపం సందర్భంలో ప్రతిపాదన లేదా సంకల్పాన్ని సూచించగలదు. తెలుగులో ఈ నిర్మాణం యాకోబు ప్రతిపాదిస్తున్న చర్యను సహజంగా తెలియజేస్తుంది; צֹאן అనే సమష్టి పదానికి ‘మంద’ గొర్రెలు, మేకలు రెండింటినీ కలుపుతుంది.
- source_word: הָסֵר מִשָּׁם
  choice: అక్కడి నుంచి ... వేరుచేస్తాను
  rationale: సందర్భం కేవలం తొలగించడం కంటే మందలోనుంచి ప్రత్యేకంగా వేరు చేయడాన్ని సూచిస్తుంది; అందువల్ల ‘వేరుచేస్తాను’ స్పష్టంగా, సహజంగా ఉంది.
- source_word: נָקֹד
  choice: చుక్కలున్న
  rationale: చిన్న బొట్లు లేదా చుక్కల వంటి రంగు గుర్తులను సూచించే పదం; טָלוּאతో ఉన్న భేదాన్ని సాధ్యమైనంతవరకు నిలుపుతుంది.
- source_word: טָלוּא
  choice: మచ్చలున్న
  rationale: పెద్ద మచ్చలు లేదా అతుకులవంటి రంగు నమూనాను సూచిస్తుంది. ఖచ్చితమైన భేదం అనిశ్చితమైనప్పటికీ נָקֹדకు భిన్నమైన సహజ తెలుగు పదాన్ని ఉపయోగించింది.
- source_word: חוּם
  choice: ముదురు రంగులో ఉన్న
  rationale: గొర్రెలలో ముదురు లేదా గోధుమ వర్ణాన్ని సూచిస్తుంది. ఖచ్చితంగా ‘గోధుమ రంగు’ అని పరిమితం చేయకుండా మూలపదంలోని వర్ణ పరిధిని కాపాడుతుంది.
- source_word: בַּכְּשָׂבִים ... בָּעִזִּים
  choice: గొర్రెలలో ... మేకలలో
  rationale: మూలంలోని జాతుల మధ్య స్పష్టమైన వ్యత్యాసాన్ని సరళమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: וְהָיָה שְׂכָרִי
  choice: అవే నా జీతంగా ఉంటాయి
  rationale: వేరు చేసిన జంతువులే ప్రతిఫలమని బహువచన సూచనతో స్పష్టం చేస్తుంది; שָׂכָרకు ఉద్యోగ సంబంధ సందర్భంలో ‘జీతం’ సహజమైన పదం.
