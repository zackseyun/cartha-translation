  to: ఈ రోజు నేను నీ మంద అంతటిలో వెళ్లి, అక్కడి నుంచి చుక్కలున్న, మచ్చలున్న ప్రతి గొర్రెను[a], గొర్రెలలోని ప్రతి ముదురు రంగు గొర్రెను[b], మేకలలోని మచ్చలున్న, చుక్కలున్న ప్రతి దానిని వేరుచేస్తాను. అదే నా జీతం అవుతుంది.
  rationale: అర్థాన్ని మార్చకుండా పాదసూచిక గుర్తులను అవి వివరించే రంగు పదాలకు నేరుగా జతచేశాను. గొర్రెలకు సంబంధించిన ముదురు-రంగు పదబంధాన్ని సహజంగా తీర్చిదిద్దాను. చివరి వాక్యాన్ని హీబ్రూ ‘వహాయా శెఖారీ’లోని ఏకవచన, ఏర్పాటును సూచించే భావాన్ని నిలుపుతూ అనువదించాను.
