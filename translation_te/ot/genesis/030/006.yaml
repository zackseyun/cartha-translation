source:
  edition: WLC
  text: וַ/תֹּ֤אמֶר רָחֵל֙ דָּנַ֣/נִּי אֱלֹהִ֔ים וְ/גַם֙ שָׁמַ֣ע בְּ/קֹלִ֔/י וַ/יִּתֶּן לִ֖/י בֵּ֑ן עַל כֵּ֛ן קָרְאָ֥ה שְׁמ֖/וֹ דָּֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/006.yaml
  text: Then Rachel said[a], “God has judged me, and has also heard my voice and given me a son.” Therefore she called his name Dan.
translation:
  language: te
  text: అప్పుడు రాహేలు, “దేవుడు నా విషయంలో తీర్పు తీర్చాడు; నా మాట కూడా విని నాకు ఒక కుమారుణ్ణి ఇచ్చాడు” అంది. అందుకే ఆమె అతనికి దాను[a] అని పేరు పెట్టింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘దాను’ అనే పేరు, ‘తీర్పు తీర్చాడు’ అనే అర్థమిచ్చే హీబ్రూ క్రియలా వినిపిస్తుంది.
    reason: పేరుకు మరియు דָּנַנִּי అనే క్రియకు మధ్య ఉన్న హీబ్రూ పదచమత్కారాన్ని తెలుగులో నేరుగా పునరుత్పత్తి చేయలేము.
lexical_decisions:
- source_word: דָּנַנִּי
  choice: నా విషయంలో తీర్పు తీర్చాడు
  rationale: దీన్ అనే న్యాయపరమైన మూలపద భావాన్ని నిలుపుతూ, దేవుడు రాహేలును దోషిగా తీర్చాడనే అపార్థం రాకుండా ఆమె విషయమై తీర్పు చేశాడనే భావాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: אֱלֹהִים
  choice: దేవుడు
  rationale: హీబ్రూ రూపం బహువచనాకారంలో ఉన్నా, క్రియ ఏకవచనంలో ఉంది; కథనంలో సూచించబడుతున్నది దేవుడే.
- source_word: שָׁמַע בְּקֹלִי
  choice: నా మాట కూడా విని
  rationale: అక్షరార్థంగా ‘నా స్వరం విన్నాడు’ అయిన ఈ హీబ్రూ నుడికారం, ఒకరి మాట ఆలకించడాన్ని సూచిస్తుంది. ‘నా మాట విని’ ఆధునిక తెలుగులో సహజంగా ఉండి వ్యక్తిగత విన్నప భావాన్ని నిలుపుతుంది.
- source_word: וַיִּתֶּן לִי בֵּן
  choice: నాకు ఒక కుమారుణ్ణి ఇచ్చాడు
  rationale: בן మగ సంతానాన్ని స్పష్టంగా సూచిస్తున్నందున ‘బిడ్డ’ అని సాధారణీకరించకుండా ‘కుమారుడు’ అనే భావాన్ని ఉంచింది.
- source_word: עַל כֵּן
  choice: అందుకే
  rationale: పేరు పెట్టడానికి ముందు చెప్పిన కారణాన్ని సహజంగా అనుసంధానించే ఆధునిక తెలుగు ప్రయోగం.
- source_word: קָרְאָה שְׁמוֹ דָּן
  choice: ఆమె అతనికి దాను అని పేరు పెట్టింది
  rationale: హీబ్రూ నామకరణ నుడికారాన్ని పదక్షరంగా కాకుండా సహజమైన తెలుగులో అందిస్తూ, దాను అనే పేరును స్పష్టంగా ఉంచుతుంది.
- source_word: דָּן
  choice: దాను
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన నామరూపం; హీబ్రూలో ‘తీర్పు తీర్చడం’ అనే క్రియతో ఉన్న పదబంధాన్ని పాదటిప్పణి వివరిస్తుంది.
theological_decisions:
- issue: రాహేలు చెప్పిన దేవుని న్యాయపరమైన చర్య
  choice: దేవుడు నా విషయంలో తీర్పు తీర్చాడు
  alternative: దేవుడు నాకు న్యాయం చేశాడు / దేవుడు నాకు అనుకూలంగా తీర్పు తీర్చాడు
  rationale: మూలంలోని న్యాయపరమైన రూపకాన్ని నిలుపుతుంది; అదే సమయంలో ‘నన్ను తీర్పు తీర్చాడు’ అనే దోషనిర్ణయ ఛాయను, లేదా ‘నన్ను నిర్దోషిగా ప్రకటించాడు’ అనే మూలానికి మించిన నిర్దిష్టతను చేర్చదు.
translation_notes:
  register: సహజమైన ఆధునిక ప్రామాణిక తెలుగు; కథనానికి తగిన గౌరవప్రదమైన సరళ శైలి. హీబ్రూ న్యాయపరమైన రూపకాన్ని కాపాడుతూ, నామకరణ పదచమత్కారాన్ని పాదటిప్పణిలో వివరించింది.
