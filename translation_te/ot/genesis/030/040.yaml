translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకులకు అర్థమయ్యే శైలిని ఉపయోగించాం. ‘మంద ముఖాలను’ అనే అసహజ పదశః రూపానికి బదులు, అదే దృశ్యభావాన్ని ‘చూసేలా నిలిపాడు’ అని సహజంగా వ్యక్తం చేశాం.
