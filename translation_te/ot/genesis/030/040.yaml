source:
  edition: WLC
  text: וְ/הַ/כְּשָׂבִים֮ הִפְרִ֣יד יַעֲקֹב֒ וַ֠/יִּתֵּן פְּנֵ֨י הַ/צֹּ֧אן אֶל עָקֹ֛ד וְ/כָל ח֖וּם בְּ/צֹ֣אן לָבָ֑ן וַ/יָּֽשֶׁת ל֤/וֹ עֲדָרִים֙ לְ/בַדּ֔/וֹ וְ/לֹ֥א שָׁתָ֖/ם עַל צֹ֥אן לָבָֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/040.yaml
  text: And Jacob separated the lambs[a], and he set the faces of the flock toward the striped and all the dark-colored among Laban's flock. Then he set apart flocks for himself[c][b], and did not put them with Laban’s flock.
translation:
  language: te
  text: యాకోబు గొర్రెపిల్లలను[a] వేరుచేశాడు. అతడు మందలోని గొర్రెల ముఖాలను లాబాను మందలోని[c] చారలుగల వాటి వైపుకూ, ముదురు రంగుగల వాటన్నిటి వైపుకూ[b] తిప్పాడు. తరువాత అతడు తనకోసం ప్రత్యేక మందలను ఉంచాడు; వాటిని లాబాను మందతో కలపలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘గొర్రెలను.’
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘గోధుమ రంగుగల వాటన్నిటినీ.’
    reason: lexical_alternative
  - marker: c
    text: లేదా ‘లాబాను మందనుండి వచ్చిన.’ హీబ్రూ పూర్వప్రత్యయం సాధారణంగా ‘లో/మధ్య’ అని అర్థమిస్తుంది; ఈ సందర్భంలో మూలం లేదా ఉద్భవాన్ని సూచిస్తూ ‘నుండి’ అని కూడా గ్రహించవచ్చు.
    reason: source_ambiguity
lexical_decisions:
- source_word: הַכְּשָׂבִים
  choice: గొర్రెపిల్లలను
  rationale: כְּשָׂבִים సాధారణంగా గొర్రెపిల్లలు లేదా చిన్న గొర్రెలను సూచిస్తుంది. సందర్భంలో విస్తృతార్థకమైన ‘గొర్రెలు’ కంటే ‘గొర్రెపిల్లలు’ మూలపదానికి మరింత నిర్దిష్టంగా సరిపోతుంది.
- source_word: הִפְרִיד
  choice: వేరుచేశాడు
  rationale: פרד ధాతువు హిఫీల్ రూపంలో వేరు చేయడం లేదా విడదీయడం అనే ప్రత్యక్ష భావాన్ని ఇస్తుంది.
- source_word: פְּנֵי הַצֹּאן אֶל
  choice: మందలోని గొర్రెలు … చూసేలా వాటిని నిలిపాడు
  rationale: మూలంలోని ‘మంద ముఖాలను … వైపు ఉంచాడు’ అనే దృశ్యరూపాన్ని సహజమైన ఆధునిక తెలుగులో, జంతువులను నిర్దిష్ట దిశగా చూసేలా నిలిపాడనే భావంతో వ్యక్తం చేస్తుంది.
- source_word: עָקֹד
  choice: చారలుగల వాటిని
  rationale: עָקֹד పట్టీలు లేదా చారలవంటి గుర్తులుగల జంతువులను సూచిస్తుంది; ‘చారలుగల’ అనేది స్పష్టమైన, సహజమైన తెలుగు.
- source_word: כָל חוּם
  choice: ముదురు రంగుగల వాటన్నిటిని
  rationale: חוּם గోధుమ లేదా ముదురు వర్ణాన్ని సూచించవచ్చు. ‘ముదురు రంగు’ అనవసరమైన రంగు-నిర్దిష్టతను నివారిస్తూ మూలంలోని భావపరిధిని నిలుపుతుంది.
- source_word: בְּצֹאן לָבָן
  choice: లాబాను మందలో ఉన్న
  rationale: בְּ యొక్క సాధారణ స్థానార్థాన్ని అనుసరించి ‘మందలో ఉన్న’ అని అనువదించబడింది. సందర్భాన్ని బట్టి మూలం లేదా ఉద్భవాన్ని సూచించే ప్రత్యామ్నాయ పఠనాన్ని పాదసూచికలో నిలిపాం.
- source_word: וַיָּשֶׁת לוֹ עֲדָרִים לְבַדּוֹ
  choice: తనకోసం మందలను వేరుగా ఉంచి
  rationale: שׁית లోని ఉంచడం అనే భావాన్నీ, לְבַדּוֹ లోని వేరుగా ఉండే భావాన్నీ సహజంగా కలిపి వ్యక్తం చేస్తుంది.
- source_word: וְלֹא שָׁתָם עַל צֹאן לָבָן
  choice: వాటిని లాబాను మందతో కలపలేదు
  rationale: ఇక్కడ עַל అనుబంధం లేదా కలసి ఉంచడాన్ని సూచిస్తుంది. తెలుగులో ‘మందతో కలపలేదు’ సందర్భార్థాన్ని స్పష్టంగా తెలియజేస్తుంది.
