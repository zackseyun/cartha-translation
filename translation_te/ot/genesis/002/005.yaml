  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/כֹ֣ל שִׂ֣יחַ הַ/שָּׂדֶ֗ה טֶ֚רֶם יִֽהְיֶ֣ה בָ/אָ֔רֶץ וְ/כָל עֵ֥שֶׂב הַ/שָּׂדֶ֖ה טֶ֣רֶם יִצְמָ֑ח כִּי֩ לֹ֨א הִמְטִ֜יר יְהוָ֤ה אֱלֹהִים֙ עַל הָ/אָ֔רֶץ וְ/אָדָ֣ם אַ֔יִן לַֽ/עֲבֹ֖ד אֶת הָֽ/אֲדָמָֽה׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/005.yaml
  text: No shrub of the field was yet on the earth[a], and no plant of the field had yet sprung up, because Yahweh God had not caused it to rain on the earth[c][b], and there was no man to work the ground.
translation:
  language: te
  text: పొలంలోని ఏ పొదా ఇంకా భూమిమీద ఉండలేదు[a]; పొలంలోని ఏ మొక్కా ఇంకా మొలవలేదు. ఎందుకంటే యహ్వే దేవుడు[b] భూమిమీద వర్షం కురిపించలేదు; నేలను సాగుచేయడానికి మనిషి ఎవరూ లేడు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “పొద”కు బదులుగా “గుబురు మొక్క” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: హెబ్రూ దైవనామం יהוהను ఇక్కడ “యహ్వే”గా లిప్యంతరీకరించారు; సంప్రదాయంగా “ప్రభువు” లేదా “యెహోవా” అని కూడా ఇవ్వబడుతుంది.
    reason: alternative_reading
  - marker: c
    text: లేదా, “నేలను సాగుచేయడానికి మానవుడు ఎవరూ లేడు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂיחַ הַשָּׂדֶה
  choice: పొలంలోని పొద
  rationale: שִׂיחַ సాధారణ మొక్కను కాక పొదను సూచిస్తుంది; తరువాతి עֵשֶׂבతో ఉన్న పదభేదాన్ని ఈ అనువాదం నిలుపుతుంది.
- source_word: טֶרֶם יִהְיֶה בָאָרֶץ
  choice: ఇంకా భూమిమీద ఉండలేదు
  rationale: טֶרֶם లోని ‘ఇంకా జరగలేదు’ అనే కాలభావాన్ని, בָאָרֶץ లోని విస్తృత సృష్టి సందర్భాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: עֵשֶׂב הַשָּׂדֶה
  choice: పొలంలోని మొక్క
  rationale: עֵשֶׂב గుల్మం కాని పచ్చని లేదా గుల్మేతర వృక్షజాలాన్ని విస్తృతంగా సూచించగలదు; ‘మొక్క’ ఆధునిక తెలుగులో సహజంగా ఉండి ‘పొద’తో భేదాన్ని కాపాడుతుంది.
- source_word: טֶרֶם יִצְמָח
  choice: ఇంకా మొలవలేదు
  rationale: צמח లోని మొలకెత్తి పైకి రావడం అనే భావాన్ని సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ఇక్కడ כִּי ముందున్న పరిస్థితికి కారణాన్ని పరిచయం చేస్తుంది.
- source_word: הִמְטִיר
  choice: వర్షం కురిపించలేదు
  rationale: מטר హిఫిల్ రూపంలోని కారణార్థక భావాన్ని తెలుగులో సహజంగా ‘కురిపించు’ వ్యక్తం చేస్తుంది.
- source_word: יְהוָה אֱלֹהִים
  choice: యహ్వే దేవుడు
  rationale: దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా పేరుగా ఉంచి, אֱלֹהִיםను ‘దేవుడు’గా అనువదిస్తుంది.
- source_word: וְאָדָם אַיִן
  choice: మనిషి ఎవరూ లేడు
  rationale: אָדָם ఇక్కడ నేలను సాగుచేసే మానవుని సూచిస్తుంది; ‘మనిషి ఎవరూ’ లింగాన్ని అతిగా నిర్ధారించకుండా సహజమైన ఏకవచన మానవ సూచనగా పనిచేస్తుంది.
- source_word: לַעֲבֹד אֶת הָאֲדָמָה
  choice: నేలను సాగుచేయడానికి
  rationale: ఈ వ్యవసాయ సందర్భంలో עבד పని చేయడం లేదా సాగుచేయడం; אֲדָמָה సాగుకు సంబంధించిన నేల. ‘సాగుచేయడం’ ఉద్దేశాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: הָאָרֶץ / הָאֲדָמָה
  choice: భూమి / నేల
  rationale: విస్తృతమైన אֶרֶץకు ‘భూమి’, పనిచేయవలసిన אֲדָמָהకు ‘నేల’ వాడటం మూలంలోని పదభేదాన్ని నిలుపుతుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో ఉన్న వ్యక్తిగత దైవనామాన్ని పేరుగానే చూపిస్తుంది. దాని ఖచ్చితమైన ప్రాచీన ఉచ్చారణ నిర్ధారణ కానందున సంప్రదాయ ప్రత్యామ్నాయాన్ని పాదసూచికలో తెలియజేస్తుంది.
- issue: אָדָם యొక్క సందర్భార్థం
  choice: మనిషి
  alternative: మానవుడు / మానవజాతి
  rationale: ఇక్కడ భావం నేలను సాగుచేయగల మానవ వ్యక్తి లేకపోవడం; ‘మనిషి ఎవరూ’ ఆ ప్రతినిధి ఏకవచనాన్ని సహజంగా నిలుపుతుంది, అయితే ‘మానవుడు’ కూడా సాధ్యమే.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. שִׂיחַ/עֵשֶׂב మరియు אֶרֶץ/אֲדָמָה మధ్యనున్న మూలపాఠ పదభేదాలు వరుసగా ‘పొద/మొక్క’, ‘భూమి/నేల’గా నిలుపబడ్డాయి. మూలంలో లేని ప్రారంభ కాలసూచక పదం చేర్చలేదు.
