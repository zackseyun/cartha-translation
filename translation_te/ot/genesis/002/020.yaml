id: GEN.2.20
reference: Genesis 2:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּקְרָ֨א הָֽ/אָדָ֜ם שֵׁמ֗וֹת לְ/כָל הַ/בְּהֵמָה֙ וּ/לְ/ע֣וֹף הַ/שָּׁמַ֔יִם וּ/לְ/כֹ֖ל חַיַּ֣ת הַ/שָּׂדֶ֑ה וּ/לְ/אָדָ֕ם לֹֽא מָצָ֥א עֵ֖זֶר כְּ/נֶגְדּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/020.yaml
  text: And the man gave names to all the livestock[a], to the birds of the sky, and to every wild animal[c][b], but for the man no helper corresponding to him was found.
translation:
  language: te
  text: ఆ మనిషి[a] పశువులన్నిటికీ, ఆకాశ పక్షులకూ, అడవి జంతువులన్నిటికీ పేర్లు పెట్టాడు. అయితే ఆ మనిషికి తనకు సరితూగే సహాయకుడు[b] దొరకలేదు.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆదాము పశువులన్నిటికీ ... పేర్లు పెట్టాడు. అయితే ఆదాముకు ... దొరకలేదు.”
    reason: alternative_reading
  - marker: b
    text: లేదా, “తనకు తగిన సహాయకుడు.”
    reason: lexical_alternative
  - marker: c
    text: హీబ్రూలో అక్షరార్థంగా, “అతడు కనుగొనలేదు”; అందువల్ల, “అయితే ఆ మనిషి తనకు సరితూగే సహాయకుణ్ణి కనుగొనలేదు” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאָדָם / לְאָדָם
  choice: ఆ మనిషి / ఆ మనిషికి
  rationale: మొదటి పదానికి నిర్దిష్ట ఉపపదం ఉంది; తోట కథనంలోని నిర్దిష్ట పురుషుణ్ణి ఇది సూచిస్తుంది. ఈ దశలో వ్యక్తినామం కంటే సాధారణ నామ భావం ఇంకా స్పష్టంగా ఉండటంతో ‘ఆ మనిషి’ అని అనువదించాం.
- source_word: וַיִּקְרָא ... שֵׁמוֹת
  choice: పేర్లు పెట్టాడు
  rationale: ఈ హీబ్రూ నుడికారం పేర్లను నిర్ణయించి ఇవ్వడాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘పేర్లు పెట్టాడు’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: הַבְּהֵמָה
  choice: పశువులన్నిటికీ
  rationale: ఇక్కడ ఈ పదం పెంపుడు జంతువులను ఒక వర్గంగా సూచిస్తూ అడవి జంతువులతో భేదాన్ని చూపుతుంది. ‘పశువులు’ సాధారణ తెలుగు పాఠకులకు సహజమైన సమూహపదం.
- source_word: עוֹף הַשָּׁמַיִם
  choice: ఆకాశ పక్షులు
  rationale: మూలంలోని ఆకాశ సంబంధ చిత్రాన్ని నిలుపుతూ, సందర్భంలో ఎగిరే జీవులను సహజ తెలుగులో ‘ఆకాశ పక్షులు’గా తెలిపాం.
- source_word: כֹּל חַיַּת הַשָּׂדֶה
  choice: అడవి జంతువులన్నీ
  rationale: ఈ పదబంధం పెంపుడు పశువులకు భిన్నమైన అడవి భూజంతువులను సూచిస్తుంది. ‘అడవి జంతువులు’ ఆధునిక తెలుగులో స్పష్టంగా ఉంది.
- source_word: עֵזֶר
  choice: సహాయకుడు
  rationale: ఈ సందర్భంలో సహాయం చేసే వ్యక్తిని సూచిస్తుంది. మూలపదం తక్కువ స్థాయిని లేదా అధీనతను సూచించదు; ‘సహాయకుడు’ ఆ భావాన్ని అదనపు సిద్ధాంతార్థం లేకుండా నిలుపుతుంది.
- source_word: כְּנֶגְדּוֹ
  choice: తనకు సరితూగే
  rationale: ఈ పదంలో ‘అతని ఎదుట/అతనికి అనుగుణంగా’ అనే పరస్పర అనురూపత భావం ఉంది. ‘తనకు సరితూగే’ అనేది సమానంగా ఎదురునిలిచే, అనుగుణమైన తోడు అనే సంబంధ భావాన్ని సహజ తెలుగులో అందిస్తుంది.
- source_word: לֹא מָצָא
  choice: దొరకలేదు
  rationale: హీబ్రూలో క్రియారూపం అక్షరార్థంగా ‘అతడు కనుగొనలేదు.’ తెలుగులో ఫలితాన్ని కేంద్రీకరించే ‘దొరకలేదు’ సహజంగా ఉండి, తగిన సహాయకుడు లేడనే భావాన్ని తెలియజేస్తుంది.
theological_decisions:
- issue: ఆదికాండం 2:20లో אָדָם పదం అనువాదం
  choice: ఆ మనిషి
  alternative: ఆదాము; మానవుడు
  rationale: ఈ వచనం మానవజాతిని అమూర్తంగా కాక తోటలోని నిర్దిష్ట పురుషుణ్ణి సూచిస్తుంది. అయినా ఈ భాగంలో పదం వ్యక్తినామంగా మారుతున్నట్లు చదివే అవకాశం ఉన్నందున ‘ఆదాము’ అనే ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- issue: עֵזֶר כְּנֶגְדּוֹ అనే పదబంధంలోని సంబంధ భావం
  choice: తనకు సరితూగే సహాయకుడు
  alternative: తనకు తగిన సహాయకుడు; తనకు అనురూపమైన సహాయకుడు
  rationale: మూలంలోని సహాయం మరియు ఎదురుగా ఉండే అనురూపత అనే రెండు భావాలనూ నిలుపుతూ, అధీనతను గానీ నిర్దిష్ట ఆధునిక లింగ సిద్ధాంతాన్ని గానీ వాక్యంలోకి దిగుమతి చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. ‘పేర్లు పెట్టాడు,’ ‘దొరకలేదు’ వంటి సాధారణ ప్రయోగాలతో పఠన సౌలభ్యాన్ని ఉంచి, ‘తనకు సరితూగే సహాయకుడు’ ద్వారా మూలంలోని సంబంధపరమైన ఉద్వేగాన్ని కాపాడాం.
