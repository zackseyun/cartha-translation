id: GEN.2.17
reference: Genesis 2:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/מֵ/עֵ֗ץ הַ/דַּ֨עַת֙ ט֣וֹב וָ/רָ֔ע לֹ֥א תֹאכַ֖ל מִמֶּ֑/נּוּ כִּ֗י בְּ/י֛וֹם אֲכָלְ/ךָ֥ מִמֶּ֖/נּוּ מ֥וֹת תָּמֽוּת׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/017.yaml
  text: but from the tree of the knowledge of good and evil you shall not eat[a], for in the day you eat from it[b], you shall surely die.
translation:
  language: te
  text: అయితే మంచి చెడుల జ్ఞానపు చెట్టు నుండి నీవు తినకూడదు. ఎందుకంటే నీవు దాని నుండి తినే రోజున[a] నిశ్చయంగా చనిపోతావు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘తినే రోజున’ అనే హెబ్రీ నుడికారానికి ‘తిన్నప్పుడు’ అని కూడా అర్థం కావచ్చు.
    reason: lexical_alternative
  - marker: b
    text: హెబ్రీలో ‘చనిపోవడం—నీవు చనిపోతావు’ అనే ఉద్ఘాటనాత్మక నిర్మాణం ఉంది.
    reason: source_form
lexical_decisions:
- source_word: וּמֵעֵץ
  choice: అయితే … చెట్టు నుండి మాత్రం
  rationale: וְ־ ఇక్కడ ముందటి వచనంలోని విస్తృత అనుమతికి వ్యతిరేకతను సూచిస్తుంది; ‘అయితే’ ఆ సంబంధాన్ని సహజంగా తెలియజేస్తుంది. מן అర్థాన్ని ‘నుండి’ నిలుపుతుంది; ‘మాత్రం’ నిషేధించబడిన చెట్టును స్పష్టంగా వేరుచేస్తుంది.
- source_word: הַדַּעַת טוֹב וָרָע
  choice: మంచి చెడుల జ్ఞానాన్నిచ్చే
  rationale: దעת అంటే ‘జ్ఞానం/తెలుసుకోవడం’; טוב ורע అనే జంటను ‘మంచి చెడులు’గా నిలిపాం. తెలుగులో ‘మంచి చెడుల జ్ఞానపు చెట్టు’ కంటే ఈ సంబంధవాచక నిర్మాణం సహజంగా ఉంటుంది; అయితే ఆ చెట్టు జ్ఞానాన్ని ఏ విధంగా ఇస్తుందో వివరించి సిద్ధాంతపరంగా నిర్ణయించదు.
- source_word: לֹא תֹאכַל
  choice: నీవు తినకూడదు
  rationale: నిషేధార్థక హెబ్రీ నిర్మాణంలోని ఆజ్ఞాత్మక బలాన్ని ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గంభీరంగా వ్యక్తం చేస్తుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ఈ సంధి నిషేధానికి కారణాన్ని పరిచయం చేస్తుంది; ‘ఎందుకంటే’ ఆ కారణ సంబంధాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: בְּיוֹם אֲכָלְךָ מִמֶּנּוּ
  choice: నీవు దాని నుండి తినే రోజున
  rationale: ‘రోజున’ అనే మూల రూపాన్ని నిలిపి, అది నిర్దిష్ట దినాన్నా లేక ‘తిన్నప్పుడు’ అనే కాలసూచక నుడికారాన్నా సూచిస్తుందనే అస్పష్టతను ప్రధాన పాఠంలో పరిష్కరించకుండా ఉంచుతుంది.
- source_word: מוֹת תָּמוּת
  choice: నిశ్చయంగా చనిపోతావు
  rationale: అనంత క్రియారూపం మరియు సమాపక క్రియ కలయిక మరణ నిశ్చయాన్ని బలపరుస్తుంది; తెలుగులో ‘నిశ్చయంగా’ ఆ ఉద్ఘాటనను సహజంగా అందిస్తుంది.
theological_decisions:
- issue: ‘నీవు తినే రోజున’ అనే మాటకు ఉన్న కాలసంబంధ భావం మరియు మరణం నెరవేరే విధానం
  choice: ‘తినే రోజున’ అని హెబ్రీ నుడికారాన్ని ప్రధాన పాఠంలో నిలిపి, దాని భావాన్ని పాదసూచికలో ‘తిన్నప్పుడు’ అని కూడా అర్థం కావచ్చని తెలిపాం.
  alternative: ‘నీవు దాని నుండి తిన్నప్పుడు’ అని నేరుగా అనువదించడం; లేదా అదే రోజున తక్షణ శారీరక మరణం సంభవిస్తుందని వ్యాఖ్యానించడం.
  rationale: తరువాతి కథనంలో మనిషి అదే కాలెండర్ రోజున శారీరకంగా మరణించడు. కాబట్టి ఇది తక్షణ మరణమా, మరణశీలత ఆరంభమా, లేక మరణదండన నిశ్చయమా అన్నదాన్ని అనువాదం తేల్చకూడదు.
- issue: מוֹת תָּמוּת లోని మరణ ఉద్ఘాటన
  choice: ‘నిశ్చయంగా చనిపోతావు’
  alternative: ‘చస్తూ చనిపోతావు’ అనే పదశః రూపం
  rationale: హెబ్రీ పదబంధం సాధారణంగా క్రియ యొక్క నిశ్చయాన్ని బలపరుస్తుంది; దానిని తెలుగులో అసహజమైన పునరుక్తితో కాకుండా స్పష్టమైన ఉద్ఘాటనతో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా సహజమైన వాక్యనిర్మాణం వాడుతూ, ఆజ్ఞ యొక్క గంభీరతను మరియు కాలసంబంధ అస్పష్టతను నిలిపాం. హెబ్రీలో ముందుకు తెచ్చిన పదబంధం తరువాత వచ్చే పునరుక్త సర్వనామాన్ని తెలుగులో అసహజంగా పునరావృతం చేయకుండా ‘నుండి మాత్రం’తో దృష్టి ఉంచాం.
