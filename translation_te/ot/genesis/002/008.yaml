  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּטַּ֞ע יְהוָ֧ה אֱלֹהִ֛ים גַּן בְ/עֵ֖דֶן מִ/קֶּ֑דֶם וַ/יָּ֣שֶׂם שָׁ֔ם אֶת הָֽ/אָדָ֖ם אֲשֶׁ֥ר יָצָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/008.yaml
  text: And Yahweh God planted a garden in Eden[a], in the east, and there he put the man whom he had formed.
translation:
  language: te
  text: యాహ్వే దేవుడు ఏదెనులో తూర్పున[a] ఒక తోటను నాటాడు. తాను మలచిన మనిషిని అక్కడ ఉంచాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘తూర్పువైపున.’ హీబ్రూ పదబంధం తూర్పున ఉన్న స్థలాన్ని గానీ, తూర్పు దిశను లేదా అభిముఖతను గానీ సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּטַּע
  choice: నాటాడు
  rationale: נטע ఇక్కడ మొక్కలు నాటి తోటను ఏర్పరచడాన్ని సహజంగా సూచిస్తుంది.
- source_word: יְהוָה אֱלֹהִים
  choice: యెహోవా దేవుడు
  rationale: దైవనామమైన יהוהను పేరుగా లిప్యంతరీకరించి, אֱלֹהִיםను ‘దేవుడు’గా అనువదించాం.
- source_word: גַּן
  choice: ఒక తోటను
  rationale: גן సాగుచేసిన లేదా ఆవరించబడిన తోటను సూచిస్తుంది; తెలుగు వాక్యంలో మొదటిసారి ప్రస్తావన కావడంతో ‘ఒక’ సహజంగా ఉంది.
- source_word: בְעֵדֶן
  choice: ఏదెనులో
  rationale: עֵדֶן ఇక్కడ స్థలనామం; తెలుగులో ప్రాచుర్యంలో ఉన్న ‘ఏదెను’ రూపాన్ని విభక్తితో వాడాం.
- source_word: מִקֶּדֶם
  choice: తూర్పున
  rationale: ఈ పదబంధం తూర్పు ప్రాంతంలోని స్థానాన్ని సూచించగలదు; దిశ లేదా అభిముఖత అనే అర్థమూ సాధ్యమైనందున పాదసూచికలో నిలిపాం.
- source_word: וַיָּשֶׂם שָׁם
  choice: అక్కడ ఉంచాడు
  rationale: שׂים సాధారణంగా ఉంచడం లేదా పెట్టడాన్ని, שָׁם ఆ స్థలాన్ని సూచిస్తాయి.
- source_word: הָאָדָם
  choice: మనిషిని
  rationale: నిర్దిష్ట ఏకవచనం ఇంతకుముందు దేవుడు మలచిన వ్యక్తిగత మానవుణ్ణి సూచిస్తుంది; ‘మనిషి’ సహజమైన ఆధునిక తెలుగు.
- source_word: אֲשֶׁר יָצָר
  choice: తాను మలచిన
  rationale: יצר మట్టితో రూపాన్ని మలచడం లేదా రూపొందించడం అనే భావాన్ని కలిగిస్తుంది; ‘తాను’ కర్తను స్పష్టం చేస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో సాధారణ బిరుదు కాక దైవనామమే ఉంది. దాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో ఉంచాం.
- issue: הָאָדָם యొక్క సూచన
  choice: మనిషి
  alternative: ఆ మనిషి / మానవుడు
  rationale: ఇక్కడ సాధారణ మానవజాతి కాక, ముందుగా మలచబడిన నిర్దిష్ట వ్యక్తి ఉద్దేశించబడ్డాడు. తెలుగు సందర్భంలో ‘మనిషి’ ఆ సూచనను సహజంగా అందిస్తుంది.
- issue: מִקֶּדֶם యొక్క భావం
  choice: తూర్పున
  alternative: తూర్పువైపున
  rationale: హీబ్రూ రూపం స్థానం మరియు దిశ/అభిముఖత మధ్య కొంత సందిగ్ధతను కలిగి ఉంది; ప్రధాన పాఠంలో స్థానార్థాన్ని తీసుకుని ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన కథన శైలిని వాడాం. హీబ్రూ వాక్యంలోని రెండు వరుస క్రియలను తెలుగులో రెండు చిన్న వాక్యాలుగా ఇచ్చి సహజ పఠనాన్ని సాధించాం; భావసందిగ్ధతను పాదసూచికలో నిలిపాం.
