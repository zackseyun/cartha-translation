- from: ఏడవ రోజు వచ్చేసరికి దేవుడు తాను చేసిన పని ముగించాడు[a]. తాను చేసిన పనంతటి నుండి ఏడవ రోజున ఆయన విశ్రమించాడు.
  to: ఏడవ రోజు నాటికి దేవుడు తాను చేసిన పనిని ముగించాడు[a]; ఆయన తాను చేసిన సమస్త పని నుండి ఏడవ రోజున విశ్రమించాడు.
  rationale: 'The revision makes two safe Telugu-language improvements while preserving the audit-trail decision: work was complete by the seventh day in the main text, while the literal Hebrew temporal wording remains available in the footnote. It also renders the comprehensive phrase ‘from all his work that he had done’ naturally and explicitly.'
