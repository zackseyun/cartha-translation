id: GEN.2.2
reference: Genesis 2:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְכַ֤ל אֱלֹהִים֙ בַּ/יּ֣וֹם הַ/שְּׁבִיעִ֔י מְלַאכְתּ֖/וֹ אֲשֶׁ֣ר עָשָׂ֑ה וַ/יִּשְׁבֹּת֙ בַּ/יּ֣וֹם הַ/שְּׁבִיעִ֔י מִ/כָּל מְלַאכְתּ֖/וֹ אֲשֶׁ֥ר עָשָֽׂה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/002.yaml
  text: By the seventh day God had finished his work that he had done[a], and he rested on the seventh day from all his work that he had done.
translation:
  language: te
  text: ఏడవ రోజు నాటికి దేవుడు తాను చేసిన పనిని ముగించాడు[a]; ఆయన తాను చేసిన సమస్త పని నుండి ఏడవ రోజున విశ్రమించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “ఏడవ రోజున దేవుడు తాను చేసిన పనిని ముగించాడు.” హెబ్రీ మాటలను తరచుగా ఈ విధంగా అనువదిస్తారు; ప్రధాన పాఠంలోని “ఏడవ రోజు నాటికి” అనే మాట సందర్భంలో సంభావ్యమైన భావాన్ని తెలియజేస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְכַל
  choice: ముగించాడు
  rationale: כלה అనే క్రియకు ‘ముగించు, పూర్తి చేయు’ అనే అర్థం ఉంది. ‘ఏడవ రోజు వచ్చేసరికి’ అనే కాలప్రయోగంతో కలిపి, ఏడవ రోజు నాటికి పని పూర్తయిందనే సందర్భార్థాన్ని ఇది సహజంగా తెలియజేస్తుంది.
- source_word: אֱלֹהִים
  choice: దేవుడు
  rationale: రూపంలో బహువచనమైనప్పటికీ, ఇక్కడ క్రియ ఏకవచనంలో ఉండి ఆదికాండము 1–2 సందర్భంలో ఏకైక దేవుణ్ణి సూచిస్తుంది.
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: ఏడవ రోజు వచ్చేసరికి / ఏడవ రోజున
  rationale: మొదటి సందర్భంలో, ఆ రోజుకు పని పూర్తయిందనే భావాన్ని తెలపడానికి ‘ఏడవ రోజు వచ్చేసరికి’ అని ఇచ్చాం; రెండవ సందర్భంలో విశ్రాంతి జరిగిన రోజును నేరుగా సూచించడానికి ‘ఏడవ రోజున’ అని అనువదించాం. హెబ్రీ మూలంలోని మొదటి పదబంధానికి అక్షరార్థం ‘ఏడవ రోజున’; దానిని పాదసూచికలో ఉంచాం.
- source_word: מְלַאכְתּוֹ
  choice: తాను చేసిన పని
  rationale: מְלָאכָה అంటే పని లేదా కార్యం. తెలుగు వాక్యంలో కర్తను స్పష్టంగా అనుసంధానిస్తూ ‘తాను చేసిన పని’ సహజంగా ఉంటుంది.
- source_word: אֲשֶׁר עָשָׂה
  choice: తాను చేసిన
  rationale: עשה అనే విస్తృతార్థక క్రియ ‘చేయు/తయారుచేయు’ అని అర్థమవుతుంది. ఇక్కడ ‘చేసిన’ అనేది దాని విస్తృతిని కాపాడి, భౌతిక తయారీకి మాత్రమే పరిమితం చేయదు.
- source_word: וַיִּשְׁבֹּת
  choice: విశ్రమించాడు
  rationale: שבת యొక్క ప్రాథమిక భావం పనిని మానడం లేదా నిలిపివేయడం. సృష్టికార్యం నుండి విరమించిన సందర్భంలో ‘విశ్రమించాడు’ సంప్రదాయబద్ధంగానూ సహజంగానూ ఉంది; అలసట తీర్చుకున్నాడనే భావం తప్పనిసరిగా ఇందులో లేదు.
- source_word: מִכָּל
  choice: పనంతటి నుండి
  rationale: מן + כָּל దేవుడు తన పని మొత్తానికి సంబంధించి విరమించాడని సూచిస్తుంది. ‘పనంతటి నుండి’ తెలుగు భాషలో ఈ సమగ్ర భావాన్ని సంక్షిప్తంగా తెలియజేస్తుంది.
theological_decisions:
- issue: దేవుడు ఏడవ రోజున కూడా పని చేశాడని వాక్యం సూచిస్తుందా?
  choice: ప్రధాన పాఠంలో ‘ఏడవ రోజు వచ్చేసరికి ... ముగించాడు’ అని ఇచ్చి, ఏడవ రోజు నాటికి పని పూర్తయిందనే సందర్భార్థాన్ని వ్యక్తం చేశాం.
  alternative: హెబ్రీ పదక్రమాన్ని మరింత అక్షరార్థంగా అనుసరించి, ‘ఏడవ రోజున దేవుడు ... ముగించాడు’ అని అనువదించవచ్చు.
  rationale: హెబ్రీలో בַּיּוֹם הַשְּׁבִיעִי అక్షరార్థంగా ‘ఏడవ రోజున.’ అయితే వెంటనే అదే రోజున దేవుడు విశ్రమించాడని చెప్పబడుతుంది. ప్రధాన పాఠం సందర్భంలో సంభావ్యమైన కాలార్థాన్ని సహజంగా తెలుపుతుంది; మూలంలోని నిజమైన అనువాద సందిగ్ధతను పాదసూచిక కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని వాడాం. ‘విశ్రమించాడు’ అనే పదం బైబిలు సందర్భానికి పరిచితమైనదైనా ప్రస్తుత తెలుగులో స్పష్టంగానే ఉంది. పాదసూచిక సూచిక [a] ప్రధాన పాఠంలో ఉంచబడింది.
