id: GEN.2.14
reference: Genesis 2:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/שֵׁ֨ם הַ/נָּהָ֤ר הַ/שְּׁלִישִׁי֙ חִדֶּ֔קֶל ה֥וּא הַֽ/הֹלֵ֖ךְ קִדְמַ֣ת אַשּׁ֑וּר וְ/הַ/נָּהָ֥ר הָֽ/רְבִיעִ֖י ה֥וּא פְרָֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/014.yaml
  text: And the name of the third river is Hiddekel[a]; it is the one that goes east of Asshur[b]. And the fourth river is the Euphrates.
translation:
  language: te
  text: మూడవ నది పేరు హిద్దెకెలు[a]. అది అష్షూరుకు తూర్పున ప్రవహిస్తుంది[b]. నాలుగవ నది యూఫ్రటీసు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హిద్దెకెలు నదిని సంప్రదాయంగా టైగ్రిస్ నదిగా గుర్తిస్తారు.
    reason: alternative_reading
  - marker: b
    text: లేదా, “అస్సీరియాకు తూర్పున”; హెబ్రీలో “అష్షూరుకు తూర్పున.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׁם
  choice: పేరు
  rationale: నదిని పరిచయం చేసే హెబ్రీ సూత్రప్రయోగంలోని సాధారణ అర్థాన్ని సహజమైన తెలుగులో నేరుగా నిలుపుతుంది.
- source_word: נָּהָר
  choice: నది
  rationale: సందర్భానికి తగిన సాధారణ, స్పష్టమైన తెలుగు పదం.
- source_word: שְּׁלִישִׁי
  choice: మూడవ
  rationale: హెబ్రీ క్రమసంఖ్యకు నేర అనువాదం.
- source_word: חִדֶּקֶל
  choice: హిద్దెకెలు
  rationale: హెబ్రీ పేరును లిప్యంతరీకరించి నిలిపి, సంప్రదాయంగా టైగ్రిస్‌తో చేసే గుర్తింపును పాదసూచికలో తెలిపాం.
- source_word: הוּא הַהֹלֵךְ
  choice: అది ... ప్రవహిస్తుంది
  rationale: הלך అనే పదానికి మూలంగా ‘వెళ్లు’ అనే భావం ఉన్నా, నది విషయంలో ‘ప్రవహిస్తుంది’ ఆధునిక తెలుగులో సహజంగా ఉండి నిరంతర గమనాన్ని తెలియజేస్తుంది.
- source_word: קִדְמַת
  choice: తూర్పున
  rationale: భౌగోళిక సందర్భంలో ‘తూర్పున’ అనే అర్థాన్ని వ్యక్తం చేస్తుంది; ‘ఎదుట/ముందు’ అనే సాధ్యమైన మూలభావం ఇక్కడ తక్కువ సహజం.
- source_word: אַשּׁוּר
  choice: అష్షూరు
  rationale: హెబ్రీ స్థలనామాన్ని లిప్యంతరీకరించాం; అది అష్షూరు ప్రాంతాన్ని, అంటే అస్సీరియాను, సూచించవచ్చనే విషయాన్ని పాదసూచికలో నిలిపాం.
- source_word: רְבִיעִי
  choice: నాలుగవ
  rationale: హెబ్రీ క్రమసంఖ్యకు నేర అనువాదం.
- source_word: פְרָת
  choice: యూఫ్రటీసు
  rationale: ఆధునిక పాఠకులకు సుపరిచితమైన ఈ నది యొక్క స్థిరపడిన తెలుగు పేరు స్పష్టతను ఇస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. భౌగోళిక పేర్లలో హిద్దెకెలు, అష్షూరు అనే హెబ్రీ రూపాలను నిలిపి, సుపరిచిత గుర్తింపులను పాదసూచికల్లో ఇచ్చాం; యూఫ్రటీసు మాత్రం తెలుగులో స్థిరపడిన పేరుగా వాడబడింది.
