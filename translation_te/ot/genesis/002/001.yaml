    text: లేదా, “పూర్తయ్యాయి.”
    reason: lexical_alternative
  revision_rationale: The revision preserves the Hebrew passive/resultative sense and the broad collective reference of ‘all their host,’ while replacing the slightly restrictive ‘in them’ construction with a direct possessive and making the main/alternative completion terms distinct.
