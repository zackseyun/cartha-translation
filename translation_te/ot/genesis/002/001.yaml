id: GEN.2.1
reference: Genesis 2:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְכֻלּ֛וּ הַ/שָּׁמַ֥יִם וְ/הָ/אָ֖רֶץ וְ/כָל צְבָאָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/001.yaml
  text: Thus the heavens and the earth were finished[b][a], and all their hosts.
translation:
  language: te
  text: ఇలా ఆకాశమూ భూమీ, వాటి సమస్త సమూహమూ సంపూర్ణమయ్యాయి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పూర్తయ్యాయి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְכֻלּוּ
  choice: పూర్తయ్యాయి
  rationale: כלה ధాతువు యొక్క నిష్పన్న కర్మణి భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; సృష్టి కార్యం సంపూర్ణతకు వచ్చిన ఫలితాన్ని సూచిస్తుంది.
- source_word: הַשָּׁמַיִם
  choice: ఆకాశము
  rationale: సృష్టి సందర్భంలో భూమికి జతగా ఉన్న ఆకాశ లోకాన్ని సూచిస్తుంది; తెలుగులో ఈ జంట ప్రయోగానికి ఏకవచన రూపం సహజం.
- source_word: וְהָאָרֶץ
  choice: భూమి
  rationale: ఇక్కడ స్థానికమైన దేశం లేదా నేల కాదు, సృష్టించబడిన భౌమ లోకం ఉద్దేశించబడింది.
- source_word: וְכָל צְבָאָם
  choice: వాటిలోని సమస్త సమూహము
  rationale: צָבָא యొక్క సమీకృతమైన సమూహం/సైన్యం అనే చిత్రాన్ని కొంత నిలుపుతూ, ఆకాశమూ భూమినీ నింపిన సమస్తాన్ని సందర్భానుగుణంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ‘వాటి సమస్త צבא’ యొక్క పరిధి
  choice: ఆకాశమూ భూమిలో ఉన్న సమస్త సృష్టిని సమగ్రంగా సూచించే పదబంధం
  alternative: ప్రధానంగా నక్షత్రాలు లేదా ఆకాశ సైన్యాన్ని మాత్రమే సూచించడం
  rationale: ఈ వాక్యం ఆకాశమూ భూమీ పూర్తయిన విషయాన్ని సంగ్రహిస్తుంది. צָבָא నక్షత్ర సమూహాన్ని లేదా క్రమబద్ధమైన సైన్యాన్ని సూచించగలిగినా, ఇక్కడి జంట సందర్భం వాటిలోని సమస్త సృష్టిని సూచించే విస్తృత భావానికి మద్దతిస్తుంది; ‘సమూహము’ అనే పదం మూలంలోని సామూహిక చిత్రాన్ని పూర్తిగా చెరపదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. ‘ఇలా’ హీబ్రూ వాక్యారంభంలోని ఫలితసూచక సంబంధాన్ని చూపిస్తుంది. ‘ఆకాశమూ భూమీ’ అనే సహజ తెలుగు జంటను ఉపయోగించగా, ‘సమస్త సమూహము’ మూలంలోని సమీకృత సమృద్ధి భావాన్ని నిలుపుతుంది.
