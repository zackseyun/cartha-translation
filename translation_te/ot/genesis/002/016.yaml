id: GEN.2.16
reference: Genesis 2:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְצַו֙ יְהוָ֣ה אֱלֹהִ֔ים עַל הָֽ/אָדָ֖ם לֵ/אמֹ֑ר מִ/כֹּ֥ל עֵֽץ הַ/גָּ֖ן אָכֹ֥ל תֹּאכֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/016.yaml
  text: And Yahweh God commanded the man[a], saying[b], “From every tree of the garden you may surely eat.”
translation:
  language: te
  text: 'యాహ్వే దేవుడు ఆ మనిషికి ఇలా ఆజ్ఞాపించాడు: “తోటలోని ప్రతి చెట్టు నుండి నీవు స్వేచ్ఛగా తినవచ్చు.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీయలో ఒకే క్రియకు సంబంధించిన రెండు రూపాలను కలిపి బలంగా చెప్పబడింది. దీనిని “నీవు నిశ్చయంగా తినవచ్చు” అని కూడా అనువదించవచ్చు.
    reason: మూలంలోని క్రియాబలాన్ని మరియు సాధ్యమైన ప్రత్యామ్నాయ అనువాదాన్ని తెలియజేయడం.
lexical_decisions:
- source_word: וַיְצַו
  choice: ఆజ్ఞాపించాడు
  rationale: צוה అధికారపూర్వకమైన ఆదేశాన్ని సూచిస్తుంది; ఆధునిక ప్రామాణిక తెలుగులో ‘ఆజ్ఞాపించాడు’ స్పష్టమైన, గౌరవప్రదమైన రూపం.
- source_word: יְהוָה אֱלֹהִים
  choice: యాహ్వే దేవుడు
  rationale: יְהוָה అనే వ్యక్తిగత దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా ‘యాహ్వే’గా లిప్యంతరీకరించి, אֱלֹהִיםను సహజంగా ‘దేవుడు’గా అనువదించాం.
- source_word: הָאָדָם
  choice: ఆ మనిషి
  rationale: కథా సందర్భంలో ఇది అప్పుడే సృష్టించి తోటలో ఉంచబడిన నిర్దిష్ట పురుషుణ్ణి సూచిస్తుంది; సాధారణ మానవజాతిని కాదు.
- source_word: לֵאמֹר
  choice: ఇలా
  rationale: ప్రత్యక్ష వాక్యాన్ని పరిచయం చేసే హెబ్రీయ quotative‌ను తెలుగులో సహజమైన ‘ఇలా’తో వ్యక్తపరిచాం.
- source_word: מִכֹּל עֵץ הַגָּן
  choice: తోటలోని ప్రతి చెట్టు పండ్లను
  rationale: ‘తోటలోని ప్రతి చెట్టు’ మూలంలోని విస్తృత అనుమతిని నిలుపుతుంది. తినబడేది చెట్టు కాదని తెలుగులో సహజంగా స్పష్టం చేయడానికి సందర్భంలో అంతర్లీనంగా ఉన్న ‘పండ్లను’ను చేర్చాం.
- source_word: אָכֹל תֹּאכֵל
  choice: నీవు స్వేచ్ఛగా తినవచ్చు
  rationale: ఇన్ఫినిటివ్ అబ్సల్యూట్‌తో కూడిన క్రియారూపం క్రియను బలపరుస్తుంది. ఈ సందర్భంలో అది తినాలనే విధి కంటే విస్తృత అనుమతిని ఇస్తుంది; ‘స్వేచ్ఛగా తినవచ్చు’ ఆ భావాన్ని సహజ తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: יְהוָה దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్ని నేరుగా వాడుతుంది. కాబట్టి దానిని బిరుదుగా మార్చకుండా, ‘Jehovah’ సంప్రదాయ రూపం బదులు మూలానికి దగ్గరైన ‘యాహ్వే’గా ఇచ్చాం.
- issue: הָאָדָם యొక్క సందర్భార్థం
  choice: ఆ మనిషి
  alternative: మానవుడు; మానవజాతి
  rationale: ఇక్కడ ఆజ్ఞను అందుకుంటున్నది కథలోని ఒక నిర్దిష్ట వ్యక్తి. అందువల్ల సామూహికమైన ‘మానవజాతి’ అనే అర్థాన్ని తీసుకోలేదు.
- issue: אָכֹל תֹּאכֵל యొక్క భావబలం
  choice: స్వేచ్ఛగా తినవచ్చు
  alternative: నిశ్చయంగా తినవచ్చు; తప్పక తినాలి
  rationale: హెబ్రీయ నిర్మాణం బలాన్ని సూచించినా, సందర్భం ఆజ్ఞాత్మకంగా తినమని నిర్బంధించడం కాదు; అనుమతిని బలంగా తెలియజేస్తుంది. అందువల్ల విధిని సూచించే ప్రత్యామ్నాయాన్ని ఎంచుకోలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సహజంగా ఉండేలా, అయితే దైవవాక్యానికి తగిన గౌరవప్రదమైన శైలిని పాటించాం. ‘పండ్లను’ అనేది తినబడే వస్తువును తెలుగులో సహజంగా వ్యక్తం చేసే సందర్భసిద్ధ పూరకం. ప్రత్యక్ష వాక్యానికి ముందు ‘ఇలా ఆజ్ఞాపించాడు’ వాడటం ద్వారా హెబ్రీయ వాక్యనిర్మాణాన్ని అక్షరాలా అనుకరించకుండా దాని కార్యాన్ని నిలిపాం.
