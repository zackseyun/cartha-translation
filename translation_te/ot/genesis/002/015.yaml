source:
  edition: WLC
  text: וַ/יִּקַּ֛ח יְהוָ֥ה אֱלֹהִ֖ים אֶת הָֽ/אָדָ֑ם וַ/יַּנִּחֵ֣/הוּ בְ/גַן עֵ֔דֶן לְ/עָבְדָ֖/הּ וּ/לְ/שָׁמְרָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/015.yaml
  text: Then Yahweh God took the man and placed him in the garden of Eden to work it and to keep it[a][b].
translation:
  language: te
  text: అప్పుడు యాహ్వే దేవుడు ఆ మనిషిని తీసుకొని ఏదేను తోటలో ఉంచాడు[b]—దానిని సాగు చేయడానికీ కాపాడడానికీ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దానిని పండించడానికి, కాపలా కాయడానికి.” హీబ్రూ క్రియలకు “పని చేయు/సాగు చేయు” మరియు “కాపాడు/కాపలా కాయు/జాగ్రత్తగా చూసుకో” అనే భావాలు ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “ఉంచాడు” అని అనువదించిన హీబ్రూ క్రియకు “విశ్రాంతి కలిగించాడు” లేదా “స్థిరపరిచాడు” అనే అర్థాలు కూడా ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה אֱלֹהִים
  choice: యాహ్వే దేవుడు
  rationale: దైవిక వ్యక్తినామమైన יהוהను ‘యాహ్వే’గా లిప్యంతరీకరించి, אֱלֹהִיםను సహజమైన తెలుగు బిరుదైన ‘దేవుడు’గా అనువదించింది.
- source_word: הָאָדָם
  choice: ఆ మనిషిని
  rationale: సందర్భంలో ఇది ముందుగా సృష్టించబడిన నిర్దిష్ట పురుష మానవుణ్ణి సూచిస్తుంది; ‘ఆ మనిషి’ ఆ నిర్దిష్టతను నిలుపుతుంది.
- source_word: וַיִּקַּח
  choice: తీసుకొని
  rationale: לקח యొక్క సాధారణ కథనార్థమైన ‘తీసుకొను’ను సహజమైన తెలుగు వాక్యనిర్మాణంలో అందిస్తుంది.
- source_word: וַיַּנִּחֵהוּ
  choice: ఉంచాడు
  rationale: నוח హిఫీల్ రూపం ఇక్కడ ఒక ప్రదేశంలో ఉంచడం లేదా స్థిరపరచడం అనే భావాన్ని ఇస్తుంది; విశ్రాంతి కలిగించడం అనే సాధ్యమైన ఛాయను పాదటిప్పణిలో ఉంచింది.
- source_word: בְּגַן עֵדֶן
  choice: ఏదేను తోటలో
  rationale: హీబ్రూ నిర్మాణాన్ని సహజమైన, స్థిరపడిన తెలుగు రూపంలో వ్యక్తపరుస్తుంది.
- source_word: לְעָבְדָהּ
  choice: దానిని సాగుచేయడానికి
  rationale: తోట అనే కర్మపదంతో עבדకు వ్యవసాయ సందర్భంలోని ‘సాగుచేయు/పనిచేయు’ భావం సహజం; విస్తృతమైన ‘పనిచేయు’ భావాన్ని పాదటిప్పణి సూచిస్తుంది.
- source_word: וּלְשָׁמְרָהּ
  choice: దానిని కాపాడడానికి
  rationale: שמרలోని కాపాడటం, జాగ్రత్తగా చూసుకోవటం అనే అర్థపరిధిని సహజమైన తెలుగులో నిలుపుతుంది; కేవలం సైనిక రక్షణ భావానికి పరిమితం చేయదు.
theological_decisions:
- issue: ఏదేను తోటలో మనిషికి అప్పగించిన పని స్వరూపం
  choice: తోటను సాగుచేయడం, కాపాడడం అనే సాధారణ బాధ్యతగా అనువదించడం
  alternative: ఈ క్రియలను ప్రత్యేకంగా యాజక సేవ మరియు పవిత్రస్థల కాపలా చిత్రణగా అనువదించడం
  rationale: עבד, שמר పదాలకు వ్యవసాయ సంబంధమైన భావాలూ, కొందరు గుర్తించే పవిత్రస్థల సంబంధమైన ప్రతిధ్వనులూ ఉండవచ్చు. అయితే వచనం ప్రత్యేకమైన యాజక సిద్ధాంతాన్ని తప్పనిసరిగా నిర్ధారించదు; అందువల్ల ప్రధాన పాఠం సాధారణ పదార్థాన్ని ఇస్తూ ఆ వ్యాఖ్యానాన్ని రుద్దదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన కథనశైలి. దైవనామాన్ని ‘యాహ్వే’గా నిలిపింది. రెండు హీబ్రూ క్రియల అర్థవిస్తృతిని పాదటిప్పణుల్లో సంరక్షించింది; ప్రతి పాదటిప్పణి సూచిక ప్రధాన పాఠంలో ఉంది.
