translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలిని ఉపయోగించాం. హీబ్రూ కృదంతంలోని కొనసాగుతున్న చర్యను ‘ప్రవహించేది’తో, తరువాతి ఫలితాన్ని ‘విడిపోయి… మారింది’తో వ్యక్తం చేశాం. పాదసూచిక గుర్తును అది వివరిస్తున్న ‘ప్రధాన పాయలు’ పదబంధం వద్ద ఉంచాం.
