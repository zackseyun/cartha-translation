  text: וְ/נָהָרּ֙ יֹצֵ֣א מֵ/עֵ֔דֶן לְ/הַשְׁק֖וֹת אֶת הַ/גָּ֑ן וּ/מִ/שָּׁם֙ יִפָּרֵ֔ד וְ/הָיָ֖ה לְ/אַרְבָּעָ֥ה רָאשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/010.yaml
  text: A river flowed out of Eden to water the garden[a], and from there it divided and became four headwaters.
translation:
  language: te
  text: తోటకు నీరు పెట్టడానికి ఏదెనులోనుండి ఒక నది ప్రవహించేది; అక్కడి నుండి అది విడిపోయి నాలుగు ప్రధాన పాయలుగా[a] మారింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ మూలంలో అక్షరార్థంగా “నాలుగు తలలు” అని ఉంది; ఇక్కడ ఈ పదం నది విడిపోయిన నాలుగు ప్రధాన పాయలను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָהָר יֹצֵא מֵעֵדֶן
  choice: ఏదెనులోనుండి ఒక నది ప్రవహించేది
  rationale: יֹצֵא అనే వర్తమాన కృదంతం నది నిరంతరంగా వెలువడుతూ ప్రవహించడాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘ప్రవహించేది’ ఆ కొనసాగుతున్న నేపథ్య చర్యను సహజంగా తెలియజేస్తుంది; מִן మూలస్థానాన్ని సూచిస్తున్నందున ‘ఏదెనులోనుండి’ అని అనువదించాం.
- source_word: לְהַשְׁקוֹת אֶת־הַגָּן
  choice: తోటకు నీరు పెట్టడానికి
  rationale: לְతో కూడిన causative infinitive ఉద్దేశాన్ని సూచిస్తుంది. ‘నీరు పెట్టడానికి’ అనేది సాంకేతికంగా వినిపించే ‘సాగునీరు అందించడానికి’ కంటే సాధారణ పాఠకులకు సహజంగా ఉంటుంది.
- source_word: וּמִשָּׁם יִפָּרֵד
  choice: అక్కడి నుండి అది విడిపోయి
  rationale: Niphal రూపమైన יִפָּרֵד నది స్వయంగా వేర్వేరు ప్రవాహాలుగా విడిపోవడాన్ని సూచించగలదు. ‘విడిపోయి’ అనే రూపం క్రియాశీలత లేదా బాహ్య కర్తను అనవసరంగా నిర్దేశించదు.
- source_word: וְהָיָה לְאַרְבָּעָה רָאשִׁים
  choice: నాలుగు ప్రధాన పాయలుగా మారింది
  rationale: רָאשִׁים అక్షరార్థంగా ‘తలలు’; నది సందర్భంలో ప్రధాన విభాగాలు లేదా పాయలను సూచిస్తుంది. ‘ప్రధాన పాయలు’ ఆధునిక తెలుగులో భౌగోళిక భావాన్ని స్పష్టంగా ఇస్తుంది; అక్షరార్థాన్ని పాదసూచికలో ఉంచాం.
