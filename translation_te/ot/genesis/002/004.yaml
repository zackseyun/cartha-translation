base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/004.yaml
  text: These are the generations of the heavens and the earth when they were created[c][b][a], in the day that Yahweh God made the earth and the heavens.
translation:
  language: te
  text: ఆకాశాలూ భూమీ సృష్టించబడినప్పుడు వాటి వృత్తాంతం[a] ఇదే. యెహోవా దేవుడు భూమినీ ఆకాశాలనూ చేసినప్పుడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ తోలెదోత్ అనే పదానికి ‘తరాలు,’ ‘ఆవిర్భావాలు,’ ‘చరిత్ర’ లేదా ‘వృత్తాంతం’ అనే అర్థాలు ఉండవచ్చు. ఆదికాండంలో ఇది విభాగాలను పరిచయం చేసే సూత్రపదంగా తరచూ వస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా ‘చేసిన రోజున’; ఇక్కడ ఆ హీబ్రూ నుడికారం ‘చేసినప్పుడు’ లేదా ‘చేసిన సమయంలో’ అని అర్థం.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה תוֹלְדוֹת
  choice: వాటి వృత్తాంతం ఇదే
  rationale: హీబ్రూ బహువచన సూచకాన్ని తెలుగు శీర్షికా సూత్రానికి సహజంగా మార్చి, תוֹלְדוֹת అనే ఆదికాండ నిర్మాణపదానికి సందర్భానుకూలంగా ‘వృత్తాంతం’ ఎంచుకున్నాం; ‘తరాలు’ అనే నిఘంటు రూపం ఇక్కడ తప్పుదారి పట్టించవచ్చు.
- source_word: הַשָּׁמַיִם וְהָאָרֶץ
  choice: ఆకాశాలూ భూమీ
  rationale: שָׁמַיִם యొక్క రూపాన్ని ‘ఆకాశాలు’తో ప్రతిబింబిస్తూ, సమస్త సృష్టిని సూచించే జంటను నిలిపాం.
- source_word: בְּהִבָּרְאָם
  choice: సృష్టించబడినప్పుడు
  rationale: ברא నిఫాల్ రూపంలోని కర్మణి భావాన్ని, అలాగే בְּ యొక్క కాలార్థాన్ని సహజమైన తెలుగులో నిలిపాం.
- source_word: בְּיוֹם עֲשׂוֹת
  choice: చేసినప్పుడు
  rationale: ‘ఆ రోజున’ అని అక్షరార్థంగా కాక, ‘ఎప్పుడు/ఆ సమయంలో’ అనే హీబ్రూ కాలవాచక నుడికారాన్ని తెలుగులో సహజంగా అందించాం.
- source_word: יְהוָה אֱלֹהִים
  choice: యెహోవా దేవుడు
  rationale: దైవనామం YHWHను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో స్థిరపడ్డ ‘యెహోవా’ రూపంతో ఇచ్చాం.
- source_word: אֶרֶץ וְשָׁמָיִם
  choice: భూమినీ ఆకాశాలనూ
  rationale: మొదటి పదజంటకు విరుద్ధంగా ఉన్న మూలపాఠ క్రమాన్ని కాపాడాం; హీబ్రూలో నిర్దిష్ట ఉపపదాలు లేకపోయినా తెలుగులో విభక్తి రూపాలు సహజంగా ఉన్నాయి.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యెహోవా
  alternative: ప్రభువు; యాహ్వే
  rationale: మూలపాఠంలోని వ్యక్తినామాన్ని ప్రధాన పాఠంలో స్పష్టంగా ఉంచాం. ‘ప్రభువు’ పేరు స్థానంలో బిరుదును పెడుతుంది; ‘యాహ్వే’ కూడా సాధ్యమైన పునర్నిర్మిత ఉచ్చారణ.
- issue: תוֹלְדוֹת యొక్క భావం
  choice: వృత్తాంతం
  alternative: తరాలు; ఆవిర్భావాలు; చరిత్ర
  rationale: ఇది ఆదికాండంలోని విభాగసూత్రం. ఆకాశాలకు, భూమికి జీవవంశ ‘తరాలు’ ఉన్నాయనే అనవసర భావం రాకుండా ‘వృత్తాంతం’ వాడి, పదంలోని భావవిస్తృతిని పాదసూచికలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభమైన శైలి. వచనం తరువాతి సృష్టివృత్తాంతానికి శీర్షిక/సంధివాక్యంగా పనిచేసే స్వభావాన్ని సూచించేందుకు చివర దీర్ఘవిరామ చిహ్నం వాడాం. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠంలో ఉన్నాయి.
