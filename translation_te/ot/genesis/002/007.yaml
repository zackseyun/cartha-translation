id: GEN.2.7
reference: Genesis 2:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּיצֶר֩ יְהוָ֨ה אֱלֹהִ֜ים אֶת הָֽ/אָדָ֗ם עָפָר֙ מִן הָ֣/אֲדָמָ֔ה וַ/יִּפַּ֥ח בְּ/אַפָּ֖י/ו נִשְׁמַ֣ת חַיִּ֑ים וַֽ/יְהִ֥י הָֽ/אָדָ֖ם לְ/נֶ֥פֶשׁ חַיָּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/007.yaml
  text: Then Yahweh God formed the man from the dust of the ground[a], and breathed into his nostrils the breath of life[b], and the man became a living creature.
translation:
  language: te
  text: అప్పుడు యెహోవా దేవుడు నేల ధూళితో మనిషిని రూపించాడు; అతని ముక్కు రంధ్రాల్లో జీవశ్వాసను ఊదాడు. అప్పుడు ఆ మనిషి సజీవ ప్రాణి అయ్యాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సజీవ జీవి”; సాంప్రదాయ అనువాదం, “జీవాత్మ.”
    reason: నֶפֶשׁ חַיָּה అనే పదబంధానికి సాధ్యమైన అనువాదాలను సూచిస్తుంది. ఇది శరీరానికి వేరైన అమూర్త ఆత్మను తప్పనిసరిగా సూచించదు; మొత్తం జీవమున్న సత్తాను సూచిస్తుంది.
lexical_decisions:
- source_word: יְהוָה אֱלֹהִים
  choice: యెహోవా దేవుడు
  rationale: దైవ నామాన్ని సాధారణ బిరుదుతో భేదపరుస్తూ, హెబ్రీలోని నామం-బిరుదు కలయికను స్పష్టంగా నిలుపుతుంది.
- source_word: וַיִּיצֶר
  choice: రూపించి
  rationale: మట్టి పనివాడు ఆకారం ఇచ్చే భావాన్ని సూచించే יצר క్రియలోని చేతితో మలిచే స్పష్టమైన చిత్రాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: הָאָדָם
  choice: మనిషి / ఆ మనిషి
  rationale: ఇక్కడ సాధారణ మానవజాతికన్నా కథలో రూపించబడుతున్న నిర్దిష్ట మానవుణ్ణి సూచిస్తుంది. తెలుగులో ‘మనిషి’ సహజంగా ఉండి, అనవసరంగా పేరుగా మార్చదు.
- source_word: עָפָר מִן־הָאֲדָמָה
  choice: నేలలోని ధూళితో
  rationale: עָפָר యొక్క ‘ధూళి’ భావాన్నీ, אֲדָמָה యొక్క ‘నేల’ భావాన్నీ నిలుపుతూ, రూపించడానికి వాడిన పదార్థాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: בְּאַפָּיו
  choice: అతని ముక్కు రంధ్రాల్లో
  rationale: దేవుడు జీవశ్వాసను మనిషి నాసికల్లో ఊదిన శారీరక, స్పష్టమైన చిత్రాన్ని నిలుపుతుంది.
- source_word: נִשְׁמַת חַיִּים
  choice: జీవశ్వాస
  rationale: ‘జీవాన్ని కలిగించే శ్వాస’ అనే హెబ్రీ నామబంధాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది; חַיִּים బహువచనాన్ని తెలుగులో కృత్రిమంగా ప్రతిబింబించదు.
- source_word: לְנֶפֶשׁ חַיָּה
  choice: సజీవ ప్రాణి
  rationale: נֶפֶשׁ ఇక్కడ శరీరానికి వేరైన అమూర్త ఆత్మను తప్పనిసరిగా సూచించదు; మొత్తం జీవమున్న ప్రాణిని సూచిస్తుంది. ఇదే పదబంధం జంతువులకూ వాడబడగల విస్తృతిని ‘ప్రాణి’ నిలుపుతుంది.
theological_decisions:
- issue: הָאָדָם యొక్క వ్యక్తిగత మరియు ప్రతినిధి భావాలు
  choice: మనిషి
  alternative: మానవుడు / మానవజాతి
  rationale: ఈ కథన దశలో దేవుడు రూపిస్తున్న ఒక నిర్దిష్ట మానవుడే ప్రత్యక్ష సూచ్యం. ‘మనిషి’ ఆ వ్యక్తిగత సూచనను నిలుపుతూ, విస్తృత మానవ ప్రతినిధిత్వాన్ని కూడా నిరాకరించదు.
- issue: לְנֶפֶשׁ חַיָּה యొక్క మానవ స్వరూపశాస్త్ర భావం
  choice: సజీవ ప్రాణి
  alternative: సజీవ జీవి / జీవాత్మ
  rationale: హెబ్రీ పదబంధం మొత్తం జీవమున్న సత్తాను వర్ణిస్తుంది. ‘జీవాత్మ’ అనడం శరీరానికి వేరైన ఆత్మ అనే తరువాతి భావాన్ని వచనంలోకి తీసుకురావచ్చు; ‘సజీవ ప్రాణి’ ఆ నిర్ణయాన్ని రుద్దకుండా మూలంలోని విస్తృతిని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకుడికి సులభంగా అర్థమయ్యే గౌరవప్రదమైన కథన శైలి. ‘ధూళి,’ ‘జీవశ్వాస,’ ‘సజీవ ప్రాణి’ వంటి పదాలు మూలంలోని శారీరక చిత్రాన్నీ భావపరమైన విస్తృతినీ నిలుపుతాయి. హెబ్రీ אָדָם–אֲדָמָה పదక్రీడను తెలుగులో పూర్తిగా పునరుత్పత్తి చేయడం సాధ్యం కాకపోయినా, ‘మనిషి’ మరియు ‘నేల’ ద్వారా ప్రధాన భావసంబంధం స్పష్టంగా ఉంచబడింది.
