revisions:
- from: అప్పుడు యెహోవా దేవుడు నేలలోని ధూళితో[a] మనిషిని రూపించి, అతని ముక్కు రంధ్రాల్లో జీవశ్వాసను ఊదాడు. అప్పుడు ఆ మనిషి సజీవ ప్రాణి[b] అయ్యాడు.
  to: అప్పుడు యెహోవా దేవుడు నేల ధూళితో మనిషిని రూపించాడు; అతని ముక్కు రంధ్రాల్లో జీవశ్వాసను ఊదాడు. అప్పుడు ఆ మనిషి సజీవ ప్రాణి అయ్యాడు.[a]
  rationale: The revision replaces the potentially spatial “నేలలోని ధూళితో” with the more source-faithful and idiomatic “నేల ధూళితో,” and uses finite verbs for smooth Telugu narration. The unnecessary material-origin footnote has been omitted rather than retaining an alternative that adds ‘taken.’ The remaining footnote is anchored directly to “సజీవ ప్రాణి,” the expression to which it pertains.
