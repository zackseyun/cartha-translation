  yaml_path: translation/ot/genesis/002/025.yaml
  text: And the man and his wife were both naked[a], and they were not ashamed.
translation:
  language: te
  text: ఆ పురుషుడు, అతని భార్య—వారిద్దరూ నగ్నంగా ఉన్నారు[a]; వారు సిగ్గుపడలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, ‘వారిద్దరూ ... నగ్నంగా’; ఆ జంటలోని ఇద్దరూ వస్త్రాలు లేకుండా ఉన్నారని ఈ పదక్రమం నొక్కిచెబుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: ఉన్నారు
  rationale: היה యొక్క ఈ కథన రూపం ఇక్కడ స్థితిని తెలిపే భూతకాల భావంలో ఉంది; తెలుగు వాక్య నిర్మాణంలో ‘ఉన్నారు’ సహజంగా సరిపోతుంది.
- source_word: שְׁנֵיהֶם
  choice: వారిద్దరూ
  rationale: ఈ ద్వయపదం ఆ జంటలోని ఇద్దరికీ మాట వర్తిస్తుందని నొక్కిచెబుతుంది.
- source_word: עֲרוּמִּים
  choice: నగ్నంగా
  rationale: ఈ విశేషణం వస్త్రాలు లేని స్థితిని నేరుగా సూచిస్తుంది; ‘నగ్నంగా’ ఆధునిక ప్రామాణిక తెలుగులో స్పష్టమైన, గౌరవప్రదమైన పదం.
- source_word: הָאָדָם
  choice: ఆ పురుషుడు
  rationale: ‘అతని భార్య’తో జతగా ఉన్న ఈ సందర్భంలో אָדָם సాధారణ మానవజాతిని కాక నిర్దిష్ట పురుషుణ్ణి సూచిస్తుంది.
- source_word: וְאִשְׁתּוֹ
  choice: అతని భార్య
  rationale: 3వ పురుష ఏకవచన పుంలింగ ప్రత్యయంతో ఉన్న אִשָּׁה ఇక్కడ ముందరి వచనంలో ఏర్పడిన వైవాహిక సంబంధాన్ని స్పష్టంగా సూచిస్తుంది.
- source_word: וְלֹא יִתְבֹּשָׁשׁוּ
  choice: అయినా వారు సిగ్గుపడలేదు
  rationale: בוש యొక్క ఈ రూపం సిగ్గు అనుభవించడాన్ని సూచిస్తుంది. సందర్భంలోని ఆశ్చర్యకర వ్యత్యాసాన్ని తెలుగులో సహజంగా వ్యక్తం చేయడానికి సంధిని ‘అయినా’గా అనువదించాం.
theological_decisions:
- issue: ఈ సందర్భంలో אָדָם అనువాదం
  choice: ఆ పురుషుడు
  alternative: ఆ మానవుడు / మానవుడు
  rationale: వచనం అతణ్ణి ‘అతని భార్య’తో జతచేస్తుంది కాబట్టి ఇక్కడ ఉద్దేశం మానవజాతి మొత్తాన్ని కాక వ్యక్తిగత పురుషుణ్ణి సూచించడం. ‘ఆ’ అనే నిర్దేశకం హీబ్రూ ఉపపదాన్ని కూడా ప్రతిబింబిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘వారిద్దరూ’ అనే పదంతో మూలంలోని ద్వయ-ఉద్ఘాటనను నిలిపాం; ‘సిగ్గుపడలేదు’ అనేది కేవలం ఇబ్బందిపడటం కంటే లోతైన సిగ్గు భావాన్ని వ్యక్తం చేస్తుంది.
