source:
  edition: WLC
  text: עַל כֵּן֙ יַֽעֲזָב אִ֔ישׁ אֶת אָבִ֖י/ו וְ/אֶת אִמּ֑/וֹ וְ/דָבַ֣ק בְּ/אִשְׁתּ֔/וֹ וְ/הָי֖וּ לְ/בָשָׂ֥ר אֶחָֽד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/024.yaml
  text: Therefore a man shall leave his father and his mother and cling to his wife[b][a], and they shall become one flesh.
translation:
  language: te
  text: అందుకే పురుషుడు తన తండ్రిని, తల్లిని విడిచిపెట్టి, తన భార్యను అంటిపెట్టుకుంటాడు[a]; వారిద్దరూ ఒకే శరీరమవుతారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “గట్టిగా కలిసియుంటాడు,” “విడువకుండా అనుబంధమై ఉంటాడు.” హీబ్రూ క్రియ గాఢమైన అనుబంధాన్ని, అతుక్కొని ఉండడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: “ఒకే శరీరం” అనే హీబ్రూ నానుడిలో శారీరక కలయికతో పాటు ఒక కొత్త బంధుత్వ బంధం ఏర్పడటం కూడా ఇమిడి ఉంది.
    reason: cultural_note
lexical_decisions:
- source_word: עַל כֵּן
  choice: అందుకే
  rationale: ముందటి సృష్టి వృత్తాంతం నుంచి వచ్చే కారణబద్ధమైన నిర్ధారణను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: יַעֲזָב
  choice: విడిచిపెట్టి
  rationale: ఇక్కడి క్రియ సాధారణంగా వర్తించే సూత్రాన్ని తెలియజేస్తుంది. ‘త్యజించి’ అనేది అవసరానికి మించిన పరిత్యాగ భావాన్ని కలిగించవచ్చు.
- source_word: אִישׁ
  choice: పురుషుడు
  rationale: హీబ్రూ మూలంలోని పుంలింగ ఏకవచనాన్ని స్పష్టంగా నిలుపుతుంది; వివాహ సందర్భంలో భర్తగా మారే పురుషుణ్ణి సూచిస్తుంది.
- source_word: אָבִיו ... אִמּוֹ
  choice: తన తండ్రిని, తల్లిని
  rationale: మూలంలో తల్లిదండ్రులిద్దరూ విడివిడిగా పేర్కొనబడ్డారు; ‘తల్లిదండ్రులను’ అని కుదించకుండా ఆ రూపాన్నీ ఉద్ఘాటననూ కాపాడుతుంది.
- source_word: וְדָבַק
  choice: అంటిపెట్టుకుంటాడు
  rationale: דבק లోని గట్టి అనుబంధం, అతుక్కొని ఉండే భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; కేవలం శారీరక కౌగిలిగా పరిమితం చేయదు.
- source_word: בְּאִשְׁתּוֹ
  choice: తన భార్యను
  rationale: ఈ సందర్భంలో אִשָּׁה అనేది సాధారణంగా ‘స్త్రీ’ కాక, ‘భార్య’ను సూచిస్తుంది.
- source_word: וְהָיוּ
  choice: అవుతారు
  rationale: ‘ఒకే శరీరం’గా ఏర్పడే ఫలిత స్థితిని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: לְבָשָׂר אֶחָד
  choice: ఒకే శరీరం
  rationale: హీబ్రూ నానుడి యొక్క శారీరక మరియు కొత్త బంధుత్వ సంబంధ భావాలను ముందుగానే ఒకే అర్థానికి పరిమితం చేయకుండా నిలుపుతుంది.
theological_decisions:
- issue: వివాహ సూత్రంలోని లింగ సూచన
  choice: పురుషుడు
  alternative: వ్యక్తి / ఒకరు
  rationale: మూలంలోని אִישׁ స్పష్టంగా పుంలింగ ఏకవచనం; అందువల్ల లింగతటస్థంగా మార్చకుండా ప్రతినిధి పుంలింగాన్ని నిలిపాం.
- issue: వాక్య స్వభావం
  choice: సాధారణంగా వర్తించే సూత్రంగా వర్తమాన రూపం
  alternative: ప్రత్యక్ష ఆజ్ఞగా లేదా గతకాలపు ఆచార వర్ణనగా
  rationale: హీబ్రూ క్రియారూపాలు సృష్టి వృత్తాంతంపై ఆధారపడిన సాధారణ, ప్రమాణాత్మక సూత్రాన్ని తెలియజేస్తాయి; మూలంలో లేని ప్రత్యక్ష ఆజ్ఞను చేర్చలేదు.
- issue: ‘ఒకే శరీరం’ యొక్క పరిధి
  choice: నానుడిని యథాతథంగా ఉంచి పాదటిప్పణిలో వివరణ
  alternative: కేవలం శారీరక కలయికగా లేదా కేవలం ఆధ్యాత్మిక ఐక్యతగా వివరణాత్మక అనువాదం
  rationale: మూలపదబంధం శారీరక సంయోగంతో పాటు కొత్త బంధుత్వ బంధాన్నీ సూచించగలదు; ఆ అర్థవిస్తృతిని కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, అయితే సృష్టి సూత్రానికి తగిన గంభీరతతో అనువదించబడింది. సాధారణ సూత్రాన్ని తెలుగులో సహజంగా వ్యక్తం చేయడానికి వర్తమానకాల రూపాలు వాడబడ్డాయి.
