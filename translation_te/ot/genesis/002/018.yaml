    text: లేదా “అతనికి తగిన సహాయం చేసే వ్యక్తిని,” “అతనికి అనురూపమైన సహాయం చేసే వ్యక్తిని.” హీబ్రూ పదబంధం అతనికి అనుగుణంగా, అతనితో సరిపోలే వ్యక్తి అనే భావాన్ని సూచిస్తుంది; కేవలం అధీన సహాయకుడు అనే భావాన్ని కాదు.
    reason: lexical_alternative
