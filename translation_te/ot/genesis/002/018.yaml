id: GEN.2.18
reference: Genesis 2:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ יְהוָ֣ה אֱלֹהִ֔ים לֹא ט֛וֹב הֱי֥וֹת הָֽ/אָדָ֖ם לְ/בַדּ֑/וֹ אֶֽעֱשֶׂהּ לּ֥/וֹ עֵ֖זֶר כְּ/נֶגְדּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/018.yaml
  text: Then Yahweh God said[a], “It is not good for the man to be alone. I will make a helper corresponding to him.”
translation:
  language: te
  text: 'అప్పుడు యహ్వే దేవుడు ఇలా అన్నాడు: “ఆ మనిషి ఒంటరిగా ఉండడం మంచిది కాదు. అతనికి సరితూగే సహాయం చేసే వ్యక్తిని[a] నేను చేస్తాను.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “అతనికి తగిన సహాయం చేసే వ్యక్తిని,” “అతనికి అనురూపమైన సహాయం చేసే వ్యక్తిని.” హీబ్రూ పదబంధం అతనికి అనుగుణంగా, అతనితో సరిపోలే వ్యక్తి అనే భావాన్ని సూచిస్తుంది; కేవలం అధీన సహాయకుడు అనే భావాన్ని కాదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה אֱלֹהִים
  choice: యెహోవా దేవుడు
  rationale: దైవ నామమైన יְהוָהను ‘యెహోవా’గా లిప్యంతరీకరించి, אֱלֹהִיםను ‘దేవుడు’గా అనువదించడం ద్వారా వ్యక్తిగత నామాన్నీ దైవ బిరుదునూ నిలుపుతుంది.
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... ఇలా అన్నాడు
  rationale: వావ్-కన్సిక్యూటివ్ కథన క్రమాన్ని ముందుకు నడిపిస్తుంది; ఆధునిక తెలుగులో ‘అప్పుడు’ ఆ క్రమాన్ని సహజంగా తెలియజేస్తుంది, ‘ఇలా అన్నాడు’ ప్రత్యక్ష వాక్యాన్ని పరిచయం చేస్తుంది.
- source_word: לֹא טוֹב הֱיוֹת הָאָדָם לְבַדּוֹ
  choice: మనిషి ఒంటరిగా ఉండడం మంచిది కాదు
  rationale: హీబ్రూ వాక్యంలోని ప్రతికూల మూల్యాంకనాన్నీ, ఒంటరిగా ఉండే స్థితినీ స్పష్టమైన ఆధునిక తెలుగులో కాపాడుతుంది.
- source_word: הָאָדָם
  choice: మనిషి
  rationale: ఈ సందర్భంలో తోటలో సృష్టించబడిన నిర్దిష్ట మానవ వ్యక్తిని సూచిస్తుంది. తెలుగు ‘మనిషి’ కథనంలోని పురుష వ్యక్తిని సందర్భానుసారంగా సూచించగలదే గాని, అనవసరంగా ‘మానవజాతి’ అనే సమష్టి అర్థానికి మార్చదు.
- source_word: אֶעֱשֶׂה־לּוֹ
  choice: అతనికి ... నేను చేస్తాను
  rationale: ప్రథమ పురుష అసంపూర్ణ క్రియ దైవ సంకల్పాన్ని వ్యక్తం చేస్తుంది; לּוֹను ‘అతనికి’గా నేరుగా నిలుపుతుంది.
- source_word: עֵזֶר
  choice: సహాయకురాలు
  rationale: సహాయం అందించే వ్యక్తిని సూచిస్తుంది. తరువాతి కథనం స్త్రీని ఉద్దేశిస్తున్నందున తెలుగులో సహజమైన స్త్రీలింగ రూపం వాడబడింది; ఈ పదం స్వయంగా తక్కువ స్థాయిని సూచించదు.
- source_word: כְּנֶגְדּוֹ
  choice: అతనికి సరితూగే
  rationale: ఎదురుగా ఉండే, అనుగుణంగా ఉండే, సరిపోలే వ్యక్తి అనే సంబంధాత్మక భావాన్ని ‘సరితూగే’ సహజంగా వ్యక్తం చేస్తుంది; హోదాపరమైన అధమత్వం లేదా ఆధిక్యాన్ని చేర్చదు.
theological_decisions:
- issue: הָאָדָם యొక్క సందర్భానుసార అర్థం
  choice: మనిషి
  alternative: ఆ మనిషి; మానవుడు; మానవజాతి
  rationale: వాక్యం సాధారణంగా మానవజాతి గురించి మాత్రమే కాక, ముందుగా రూపొందించబడిన ఒంటరి వ్యక్తి గురించి చెబుతోంది. ‘మనిషి’ ఆ కథన ప్రత్యేకతను నిలుపుతూ తెలుగులో సహజంగా ఉంటుంది.
- issue: עֵזֶר כְּנֶגְדּוֹలో హోదా సంబంధం
  choice: అతనికి సరితూగే సహాయకురాలు
  alternative: అతనికి తగిన సహాయకురాలు; అతనికి అనురూపమైన సహాయకురాలు
  rationale: హీబ్రూ పదబంధం సహాయాన్నీ పరస్పర అనుగుణతనూ సూచిస్తుంది; అధమత్వం లేదా ఆధిక్యాన్ని స్పష్టంగా ప్రకటించదు. ఎంపిక చేసిన రూపం ఆ ఉద్రిక్తతను పరిష్కరించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనదిగా, అయితే గౌరవప్రదమైన గ్రంథశైలిలో రూపొందించబడింది. దైవ నామం ‘యెహోవా’గా నిలుపబడింది. ప్రధాన పాఠంలోని [a] సూచిక పాదసూచికతో సరిపోతుంది.
