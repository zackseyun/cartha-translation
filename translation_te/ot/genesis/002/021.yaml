language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּפֵּל֩ יְהוָ֨ה אֱלֹהִ֧ים תַּרְדֵּמָ֛ה עַל הָ/אָדָ֖ם וַ/יִּישָׁ֑ן וַ/יִּקַּ֗ח אַחַת֙ מִ/צַּלְעֹתָ֔י/ו וַ/יִּסְגֹּ֥ר בָּשָׂ֖ר תַּחְתֶּֽ/נָּה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/021.yaml
  text: So Yahweh God caused a deep sleep to fall upon the man[a], and he slept; then he took one of his ribs and closed up the flesh in its place.
translation:
  language: te
  text: అప్పుడు యెహోవా దేవుడు ఆ మనిషికి గాఢనిద్ర కలిగించాడు; అతడు నిద్రపోయాడు. దేవుడు అతని పక్కటెముకలలో ఒకదాన్ని[a] తీసి, ఆ చోటును మాంసంతో మూసివేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అతని పక్కభాగాలలో ఒకదాన్ని.’ హీబ్రూ పదం పక్కటెముకతోపాటు పక్కను లేదా పక్కభాగాన్ని కూడా సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּפֵּל
  choice: గాఢనిద్ర కలిగించాడు
  rationale: נפל యొక్క హిఫీల్ రూపం కారణార్థకమైనది. తెలుగులో సహజంగా ఉండేలా, దేవుడు ఆ మనిషికి గాఢనిద్ర కలిగించాడనే భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: יְהוָה אֱלֹהִים
  choice: యెహోవా దేవుడు
  rationale: దైవనామమైన יהוהను దాని వ్యక్తిగత నామరూపానికి దగ్గరగా ‘యెహోవా’గా, אֱלֹהִיםను ‘దేవుడు’గా అనువదించాం.
- source_word: תַּרְדֵּמָה
  choice: గాఢనిద్ర
  rationale: ఈ పదం సాధారణ నిద్రకంటే తీవ్రమైన, లోతైన నిద్రను సూచిస్తుంది; సందర్భంలో దేవుడు కలిగించిన నిద్ర.
- source_word: הָאָדָם
  choice: ఆ మనిషి
  rationale: ఈ కథన సందర్భంలో మానవజాతి మొత్తాన్ని కాకుండా ఒక నిర్దిష్ట పురుషుణ్ణి సూచిస్తోంది.
- source_word: וַיִּישָׁן
  choice: అతడు నిద్రపోయాడు
  rationale: ישׁן క్రియ యొక్క సరళమైన కథనార్థాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: אַחַת מִצַּלְעֹתָיו
  choice: అతని పక్కటెముకలలో ఒకదాన్ని
  rationale: צֵלָעకు ‘పక్క’, ‘పక్కభాగం’, ‘పక్కటెముక’ అనే అర్థాలు ఉండవచ్చు. మాంసంతో మూయడం అనే శరీరసంబంధ సందర్భంలో ‘పక్కటెముక’ సహజమైన ప్రధాన అనువాదం; ‘పక్కభాగం’ను పాదసూచికలో ఉంచాం.
- source_word: וַיִּסְגֹּר בָּשָׂר
  choice: మాంసంతో మూసివేశాడు
  rationale: סגר అంటే మూయడం; ఇక్కడ తీసిన భాగం ఉన్న చోటును మాంసంతో మూసిన చర్యను తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: תַּחְתֶּנָּה
  choice: దాని స్థానాన్ని
  rationale: పదశః ‘దాని కింద’ అనే రూపం ఉన్నప్పటికీ, సందర్భంలో తీసిన భాగం ఉన్న చోటును సూచిస్తుంది. ‘దాని స్థానాన్ని’ అనే అనువాదం ఆ భావాన్ని సహజంగా అందిస్తుంది.
theological_decisions:
- issue: ఈ సందర్భంలో אָדָם అనువాదం
  choice: ఆ మనిషి
  alternative: ఆ మానవుడు / మానవుడు
  rationale: తరువాతి వచనంలో స్త్రీ నిర్మించబడే నిర్దిష్ట వ్యక్తినే ఈ వచనం సూచిస్తుంది; అందువల్ల సాధారణ మానవజాతి అనే అర్థం కంటే వ్యక్తిగత పురుషార్థం ఇక్కడ ప్రధానమైనది.
- issue: צֵלָע అనువాదం
  choice: పక్కటెముక
  alternative: పక్కభాగం
  rationale: ‘దాని స్థానాన్ని మాంసంతో మూసివేశాడు’ అనే శరీరసంబంధ చిత్రణ ‘పక్కటెముక’ అనే అర్థానికి మద్దతిస్తుంది. అయితే ‘పక్క’ లేదా ‘పక్కభాగం’ అనే నిజమైన పదార్థసాధ్యతను తొలగించకుండా పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. మూలంలోని వరుస చర్యలు నిలుపుతూ, తెలుగులో అసహజమైన పదశః నిర్మాణాలను నివారించాం; צֵלָעలోని నిజమైన సందిగ్ధతను పాదసూచికలో పరిరక్షించాం.
