  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּבֶן֩ יְהוָ֨ה אֱלֹהִ֧ים אֶֽת הַ/צֵּלָ֛ע אֲשֶׁר לָקַ֥ח מִן הָֽ/אָדָ֖ם לְ/אִשָּׁ֑ה וַ/יְבִאֶ֖/הָ אֶל הָֽ/אָדָֽם׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/022.yaml
  text: And the rib that the LORD God had taken from the man, he built into a woman, and he brought her to the man.
translation:
  language: te
  text: యెహోవా దేవుడు మనిషి నుండి తీసుకున్న ఆ పక్కటెముకను స్త్రీగా నిర్మించి, ఆమెను మనిషి వద్దకు తీసుకొచ్చాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּבֶן
  choice: నిర్మించి
  rationale: మూలంలోని בנה అనే ‘కట్టు/నిర్మించు’ క్రియను స్పష్టంగా నిలుపుతుంది; సాధారణమైన ‘చేశాడు’ కంటే మూలరూపకానికి దగ్గరగా ఉంది.
- source_word: יְהוָה אֱלֹהִים
  choice: యెహోవా దేవుడు
  rationale: దైవనామమైన יהוהను ‘యెహోవా’గా లిప్యంతరీకరించి, אֱלֹהִיםను ‘దేవుడు’గా అనువదించింది.
- source_word: הַצֵּלָע
  choice: పక్కటెముకను
  rationale: ఈ సందర్భంలో సంప్రదాయబద్ధంగా, సహజంగా అర్థమయ్యే ‘పక్కటెముక’ను ఎంచుకుంది; పదానికి ‘పక్క/ప్రక్క భాగం’ అనే విస్తృత అర్థం కూడా ఉండగలదు.
- source_word: לְאִשָּׁה
  choice: ఒక స్త్రీగా
  rationale: ఫలిత స్థితిని సూచించే לְను ‘గా’తో సహజంగా వ్యక్తం చేసింది.
- source_word: וַיְבִאֶהָ אֶל־הָאָדָם
  choice: ఆమెను మనిషి దగ్గరకు తీసుకొచ్చాడు
  rationale: స్త్రీని సూచించే స్త్రీలింగ కర్మప్రత్యయాన్ని ‘ఆమెను’గా, אֶלను సహజ తెలుగు ప్రయోగమైన ‘దగ్గరకు’గా తెలిపింది.
theological_decisions:
- issue: దైవనామం יהוה యొక్క ప్రతిపాదన
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలంలో ఉన్న వ్యక్తిగత దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా పాఠ్యంలో ప్రత్యక్షంగా నిలుపుతుంది.
- issue: స్త్రీ సృష్టిని తెలిపే בנה క్రియ
  choice: నిర్మించి
  alternative: చేసి
  rationale: మూలంలోని ఉద్దేశపూర్వక ‘నిర్మాణ’ భాషను నిలుపుతూ, దానిపై అదనపు సిద్ధాంతార్థాన్ని రుద్దదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన వాక్యనిర్మాణం. మూల హీబ్రూ వాక్యక్రమాన్ని సాధ్యమైనంతవరకు నిలుపుతూ తెలుగు సహజత్వం కోసం అనుసంధాన క్రియారూపాలు వాడబడ్డాయి.
