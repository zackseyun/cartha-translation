lexical_decisions:
- source_word: וּזֲהַב
  choice: బంగారం
  rationale: וְ వాక్యాన్ని ముందున్న భూవర్ణనతో కలుపుతుంది; తెలుగులో అదే అనుసంధానం వాక్యప్రవాహం ద్వారా సహజంగా వ్యక్తమవుతుంది. זָהָב కు సాధారణ అర్థం ‘బంగారం’.
- source_word: הָאָרֶץ הַהִוא
  choice: ఆ దేశపు
  rationale: אֶרֶץ ఇక్కడ హవీలా ప్రాంతాన్ని సూచిస్తుంది; הַהִוא వెనుక ప్రస్తావించిన దానిని చూపిస్తుంది. ‘ఆ దేశపు’ ఆధునిక తెలుగులో సహజంగా, సంక్షిప్తంగా ఉంది.
- source_word: טוֹב
  choice: మంచిది
  rationale: ఇక్కడ బంగారం నాణ్యతను సరళంగా అంచనా వేస్తుంది. మూలంలోని సాధారణమైన ‘మంచి’ అనే భావాన్ని అతిగా వివరించకుండా నిలుపుతుంది.
- source_word: שָׁם
  choice: అక్కడ
  rationale: ఈ పదం ముందుగా చెప్పిన దేశాన్నే స్థలంగా సూచిస్తుంది.
- source_word: הַבְּדֹלַח
  choice: బెడోలియం[a]
  rationale: ఈ పదం సూచించే పదార్థం ఖచ్చితంగా తెలియదు. సుగంధ జిగురుగా నిర్ధారించకుండా, సంప్రదాయ గుర్తింపును లిప్యంతరీకరించి సందిగ్ధతను పాదసూచికలో తెలియజేశారు.
- source_word: וְאֶבֶן הַשֹּׁהַם
  choice: ఓనిక్సు రాయి[b]
  rationale: אֶבֶן అనే ‘రాయి’ పదాన్ని స్పష్టంగా నిలిపి, שֹׁהַם కు సంప్రదాయంగా చెప్పే ‘ఓనిక్సు’ను వాడారు; ఖనిజపు ఖచ్చితమైన గుర్తింపు అనిశ్చితమని పాదసూచికలో పేర్కొన్నారు.
