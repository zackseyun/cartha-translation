    issue: ‘కాబట్టి’ introduces an unwarranted inference.
    rationale: The opening וַיְבָרֶךְ is a narrative waw, ‘and/so,’ not a conclusion drawn from a preceding argument. Telugu can represent the sequence directly with ‘దేవుడు ... ఆశీర్వదించి...’ without adding ‘therefore.’
