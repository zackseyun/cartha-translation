  yaml_path: translation/ot/genesis/002/003.yaml
  text: So God blessed the seventh day and made it holy[d][c][b][a], because on it he rested from all his work that God had created to make.
translation:
  language: te
  text: దేవుడు ఏడవ రోజును ఆశీర్వదించి దానిని పవిత్రపరిచాడు[a], ఎందుకంటే ఆ రోజున ఆయన తాను సృష్టించి చేసిన సమస్త కార్యం నుండి విశ్రమించాడు[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దానిని పవిత్రమైనదిగా చేశాడు”; లేదా, “దానిని పవిత్రమైనదిగా ప్రత్యేకించాడు.”
    reason: lexical_alternative
  - marker: b
    text: “విశ్రమించాడు” అని అనువదించిన హీబ్రూ క్రియకు “మానివేశాడు” లేదా “నిలిపివేశాడు” అనే అర్థం కూడా రావచ్చు.
    reason: lexical_alternative
  - marker: c
    text: అక్షరార్థానికి దగ్గరగా, “దేవుడు చేయడానికి సృష్టించిన [కార్యం].” చివరి హీబ్రూ పదబంధం అర్థం చేసుకోవడం కష్టం; దాన్ని “దేవుడు సృష్టించి చేసిన” లేదా “దేవుడు చేయడం ద్వారా సృష్టించిన” అని కూడా అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְבָרֶךְ
  choice: ఆశీర్వదించి
  rationale: బָּרַךְ పియేల్ రూపం ఆ రోజుకు ఆశీర్వాదం అనుగ్రహించడాన్ని సూచిస్తుంది; ‘ఆశీర్వదించాడు’ ఆధునిక ప్రామాణిక తెలుగులో సహజమైన సమానార్థకం.
- source_word: אֱלֹהִים
  choice: దేవుడు
  rationale: ఏకవచన క్రియతో వచ్చిన ఈ పదం ఇక్కడ ఏకైక దేవుణ్ణి సూచిస్తుంది.
- source_word: יוֹם הַשְּׁבִיעִי
  choice: ఏడవ రోజు
  rationale: నామవాచకం, క్రమసంఖ్య రెండింటినీ నేరుగా, సహజంగా ప్రతిబింబిస్తుంది.
- source_word: וַיְקַדֵּשׁ אֹתוֹ
  choice: దాన్ని పవిత్రమైనదిగా చేశాడు
  rationale: קדש పియేల్ రూపంలోని పవిత్రపరచడం లేదా పవిత్రమైనదిగా ప్రత్యేకించడం అనే భావాన్ని సామాన్య పాఠకులకు స్పష్టంగా తెలియజేస్తుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ఏడవ రోజును ఆశీర్వదించి పవిత్రం చేసిన దానికి కారణాన్ని పరిచయం చేస్తుంది.
- source_word: בּוֹ
  choice: ఆ రోజున
  rationale: పూర్వపదమైన ‘ఏడవ రోజు’ను తెలుగులో స్పష్టంగా, సహజంగా తిరిగి సూచిస్తుంది.
- source_word: שָׁבַת
  choice: విశ్రమించాడు
  rationale: క్రియకు ‘మానివేశాడు/నిలిపివేశాడు’ అనే భావం కూడా ఉన్నప్పటికీ, సబ్బాతుతో ఉన్న పదసంబంధాన్ని నిలుపుతూ సందర్భానికి తగిన సంప్రదాయ అర్థాన్ని ఇస్తుంది.
- source_word: מִכָּל מְלַאכְתּוֹ
  choice: తాను … చేసిన పని అంతటి నుండి
  rationale: מְלָאכָה సూచించే పని లేదా కార్యం అనే విస్తృత భావాన్ని, מִן సూచించే విరమణను తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אֲשֶׁר בָּרָא אֱלֹהִים לַעֲשׂוֹת
  choice: దేవుడు తాను సృష్టించి చేసిన
  rationale: చివరి హీబ్రూ నిర్మాణం కఠినమైనది. ప్రధాన పాఠ్యంలో సృష్టి కార్యం పూర్తయిన భావాన్ని చదవదగిన తెలుగులో ఇస్తూ, మరింత రూపానుసారమైన అర్థాన్ని పాదటిప్పణిలో భద్రపరుస్తుంది.
theological_decisions:
- issue: שָׁבַת ను సబ్బాతు భావంతో అనువదించడం
  choice: విశ్రమించాడు
  alternative: పని మానివేశాడు / నిలిపివేశాడు
  rationale: ‘విశ్రమించాడు’ అనే పదం సబ్బాతుతో ఉన్న గ్రంథాంతర్గత సంబంధాన్ని నిలుపుతుంది; ఇది దేవుడు అలసిపోయాడని తప్పనిసరిగా సూచించదు. ‘మానివేశాడు’ అనే నిఘంటు ప్రత్యామ్నాయాన్ని పాదటిప్పణి గుర్తిస్తుంది.
- issue: וַיְקַדֵּשׁ אֹתוֹ లో పవిత్రత భావం
  choice: దాన్ని పవిత్రమైనదిగా చేశాడు
  alternative: దాన్ని పవిత్రపరిచాడు / పవిత్రమైనదిగా ప్రత్యేకించాడు
  rationale: రోజు పవిత్రతను స్పష్టంగా ఉంచుతూ, అనవసరంగా మతశాఖాపరమైన సాంకేతిక పదజాలాన్ని ప్రవేశపెట్టదు.
- issue: אֲשֶׁר בָּרָא אֱלֹהִים לַעֲשׂוֹת అనే క్లిష్ట ముగింపు
  choice: దేవుడు తాను సృష్టించి చేసిన
  alternative: దేవుడు చేయడానికి సృష్టించిన
  rationale: ప్రధాన పాఠ్యంలో సహజమైన తెలుగు, పూర్తయిన సృష్టి కార్యం అనే సందర్భార్థం ప్రాధాన్యం పొందాయి. అయితే హీబ్రూలోని ఉద్దేశార్థక క్రియారూపాన్ని పూర్తిగా పరిష్కరించకుండా ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే వాక్యనిర్మాణం. ‘పవిత్రమైనదిగా చేశాడు’ స్పష్టతను ఇస్తుంది; ‘విశ్రమించాడు’ సబ్బాతు పదసంబంధాన్ని నిలుపుతుంది. క్లిష్టమైన చివరి హీబ్రూ నిర్మాణంలోని సందిగ్ధతను పాదటిప్పణిలో భద్రపరిచాం.
