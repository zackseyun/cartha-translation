source:
  edition: WLC
  text: וְ/אֵ֖ד יַֽעֲלֶ֣ה מִן הָ/אָ֑רֶץ וְ/הִשְׁקָ֖ה אֶֽת כָּל פְּנֵֽי הָֽ/אֲדָמָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/006.yaml
  text: But a mist would rise from the earth and water the whole surface of the ground[a].
translation:
  language: te
  text: కానీ భూమి నుండి ఒక పొగమంచు[a] పైకి లేచేది, నేల ఉపరితలమంతటికీ నీరు పోసేది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నీటి ధార’ లేదా ‘ప్రవాహం.’ ఈ హీబ్రూ పదం అరుదైనది; ఇది గాలిలోని పొగమంచును కాక, భూమిలోనుండి ఉబికివచ్చే నీటిని సూచించవచ్చని కొందరు భావిస్తారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֵד
  choice: అయితే ... పొగమంచు
  rationale: וְ మునుపటి వచనంలోని వర్షం లేకపోవడాన్ని దీనితో వ్యత్యాసపరుస్తుంది. అరుదైన אֵד పదానికి పైకి లేవడం అనే క్రియతో సహజంగా సరిపోయే ‘పొగమంచు’ను ప్రధాన పాఠంలో ఉంచి, ఇతర సాధ్యార్థాలను పాదసూచికలో ఇచ్చాం.
- source_word: יַעֲלֶה
  choice: పైకి లేచి ... అందించేది
  rationale: Qal imperfect గతకాల వర్ణనలో అలవాటుగా లేదా క్రమంగా జరిగే చర్యను సూచించగలదు; తెలుగు ‘అందించేది’ నిర్మాణం ఆ కొనసాగింపు భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: מִן הָ/אָ֑רֶץ
  choice: భూమి నుండి
  rationale: విస్తృత సృష్టి సందర్భంలో אֶרֶץ కు ‘భూమి’ తగినది; అదే వచనంలోని אֲדָמָה నుండి పదభేదాన్నీ నిలుపుతుంది.
- source_word: וְ/הִשְׁקָה
  choice: నీరు అందించేది
  rationale: שקה హిఫిల్ రూపం ‘నీరు పెట్టడం/అందించడం’ అనే భావం ఇస్తుంది. ‘నీరు అందించేది’ ఆధునిక తెలుగులో సహజంగా ఉండి, సాంకేతికమైన ‘సాగునీరు పెట్టేది’ కంటే విస్తృతంగా ఉంటుంది.
- source_word: אֶת כָּל פְּנֵי
  choice: ఉపరితలమంతటికీ
  rationale: ‘ముఖమంతా’ అనే హీబ్రూ నుడికారానికి కనిపించే విస్తీర్ణం లేదా ఉపరితలం అనే భావం ఉంది; ఈ ఎంపిక దానిని సహజ తెలుగులో అందిస్తుంది.
- source_word: הָֽ/אֲדָמָֽה
  choice: నేల
  rationale: אֲדָמָה ఇక్కడ మట్టి/సాగుకు అనువైన నేలను సూచిస్తుంది. ‘నేల’ అనడం אֶרֶץ కు వాడిన ‘భూమి’తో ఉన్న వ్యత్యాసాన్ని కాపాడుతుంది.
theological_decisions:
- issue: אֵד పదం యొక్క అర్థం
  choice: పొగమంచు
  alternative: నీటి ధార లేదా భూమిలోనుండి ఉబికివచ్చే నీరు
  rationale: ఈ అరుదైన పదం అర్థం నిశ్చితం కాదు. ‘పైకి లేచేది’ అనే క్రియతో ‘పొగమంచు’ నేరుగా సరిపోతుంది; అయితే నేలకు నీరు అందించే సందర్భం భూమిలోనుండి ఉబికే ప్రవాహాన్ని కూడా సూచించవచ్చు. కాబట్టి ప్రధాన పాఠంలో ఒక సాధ్యార్థాన్ని ఉంచి, నిజమైన అనిశ్చితిని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన వచనం. ‘భూమి’ (אֶרֶץ), ‘నేల’ (אֲדָמָה) అనే పదభేదం నిలుపబడింది; అరుదైన אֵד పదంలోని అనిశ్చితి పాదసూచిక ద్వారా స్పష్టంగా సంరక్షించబడింది.
