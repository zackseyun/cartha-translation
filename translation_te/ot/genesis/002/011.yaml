  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడాం. మూలంలోని నది కదలికకు సంబంధించిన భావసందిగ్ధతను ప్రధాన పాఠ్యం మరియు పాదసూచిక ద్వారా నిలిపాం.
