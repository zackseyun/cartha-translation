  yaml_path: translation/ot/genesis/002/011.yaml
  text: The name of the first is Pishon; it is the one that goes around all the land of Havilah[a], where there is gold.
translation:
  language: te
  text: మొదటి నది పేరు పీషోను. అది బంగారం ఉన్న హవీలా దేశమంతటినీ చుట్టూ ప్రవహిస్తుంది[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అది బంగారం ఉన్న హవీలా దేశమంతటినీ చుట్టుముడుతుంది.” హెబ్రీ పదానికి “చుట్టూ వెళ్తుంది,” “చుట్టుముడుతుంది” అనే అర్థాలు రావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׁם הָאֶחָד
  choice: మొదటి నది పేరు
  rationale: నాలుగు నదుల వరుసలో הָאֶחָד క్రమసూచకంగా ‘మొదటిది’ అనే భావాన్ని ఇస్తుంది. సందర్భంలో సూచించబడిన ‘నది’ని తెలుగులో స్పష్టంగా చేర్చడం సహజంగా ఉంటుంది.
- source_word: פִּישׁוֹן
  choice: పీషోను
  rationale: నది పేరును తెలుగు బైబిలు నామరూప సంప్రదాయానికి అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: הוּא הַסֹּבֵב
  choice: అది … చుట్టి ప్రవహిస్తుంది
  rationale: סבב అనే క్రియకు ‘చుట్టూ తిరుగు/చుట్టుముట్టు’ అనే అర్థం ఉంది. కర్త నది కాబట్టి ‘చుట్టి ప్రవహిస్తుంది’ అనేది భౌగోళిక భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; అయితే మూలంలోని విస్తృత భావాన్ని పాదసూచికలో ఉంచాం.
- source_word: אֵת כָּל אֶרֶץ הַחֲוִילָה
  choice: హవీలా దేశమంతటినీ
  rationale: כָּל భావాన్ని ‘దేశమంతటినీ’ తెలియజేస్తుంది; אֶרֶץ ఇక్కడ పేరుగల భూభాగాన్ని సూచిస్తుంది.
- source_word: הַחֲוִילָה
  choice: హవీలా
  rationale: స్థలనామాన్ని తెలుగు బైబిలు నామరూప సంప్రదాయానికి అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: אֲשֶׁר שָׁם הַזָּהָב
  choice: బంగారం ఉన్న
  rationale: స్థానార్థకమైన שָׁםను తెలుగు సంబంధవాచక నిర్మాణంలో సహజంగా ‘ఉన్న’ అని వ్యక్తం చేశాం; పదార్థవాచకమైన ‘బంగారం’కు నిర్దిష్టతను అదనంగా మోపలేదు.
