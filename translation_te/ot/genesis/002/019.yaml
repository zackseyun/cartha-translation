  to: యహ్వే దేవుడు నేలనుండి ప్రతి అడవి జంతువును, ఆకాశంలోని ప్రతి పక్షిని రూపొందించాడు[a]; అవి ఏ పేరుతో పిలవబడతాయో చూడటానికి ఆయన వాటిని మనిషి దగ్గరకు తీసుకొచ్చాడు. మనిషి ప్రతి జీవిని ఏ పేరుతో పిలిచాడో, అదే దాని పేరు[b].
  rationale: సవరణలు అర్థాన్ని మార్చకుండా హీబ్రూ వాక్యనిర్మాణంలోని గుర్తింపు భావాన్ని కాపాడతాయి, సర్వనామ సూచనను స్పష్టం చేస్తాయి, మరియు కాలభావంపై పాదసూచిక వివరణను మరింత రూపశాస్త్రపరంగా ఖచ్చితంగా చేస్తాయి. పూర్వభూతకాల పఠనాన్ని ప్రత్యామ్నాయంగా మాత్రమే ఉంచి మూలంలోని వ్యాఖ్యాన అవకాశాన్ని నిలిపాం.
