id: GEN.2.19
reference: Genesis 2:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּצֶר֩ יְהוָ֨ה אֱלֹהִ֜ים מִן הָֽ/אֲדָמָ֗ה כָּל חַיַּ֤ת הַ/שָּׂדֶה֙ וְ/אֵת֙ כָּל ע֣וֹף הַ/שָּׁמַ֔יִם וַ/יָּבֵא֙ אֶל הָ֣/אָדָ֔ם לִ/רְא֖וֹת מַה יִּקְרָא ל֑/וֹ וְ/כֹל֩ אֲשֶׁ֨ר יִקְרָא ל֧/וֹ הָֽ/אָדָ֛ם נֶ֥פֶשׁ חַיָּ֖ה ה֥וּא שְׁמֽ/וֹ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/019.yaml
  text: Yahweh God formed from the ground every wild animal and every bird of the sky[a], and he brought them to the man to see what he would call them. Whatever the man called each living creature[b], that was its name.
translation:
  language: te
  text: యహ్వే దేవుడు నేలనుండి ప్రతి అడవి జంతువును, ఆకాశంలోని ప్రతి పక్షిని రూపొందించాడు[a]; అవి ఏ పేరుతో పిలవబడతాయో చూడటానికి ఆయన వాటిని మనిషి దగ్గరకు తీసుకొచ్చాడు. మనిషి ప్రతి జీవిని ఏ పేరుతో పిలిచాడో, అదే దాని పేరు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ముందే రూపొందించి ఉన్నాడు.” హీబ్రూ క్రియరూపం సాధారణంగా కథనాన్ని ముందుకు నడిపిస్తుంది; సందర్భాన్ని బట్టి దీనిని ముందే జరిగిన చర్యగా కూడా అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
  - marker: b
    text: లేదా, “ఆదాము.” హీబ్రూలో హా-ఆదామ్ ఉంది; దాని అక్షరార్థం “ఆ మనిషి.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּצֶר
  choice: రూపొందించాడు
  rationale: హీబ్రూ కథన క్రియకు సహజమైన సాధారణ భూతకాలాన్ని వాడింది. సందర్భాన్ని బట్టి ముందే జరిగిన చర్యగా అర్థం చేసుకునే అవకాశాన్ని పాదసూచికలో ఉంచింది.
- source_word: יְהוָה אֱלֹהִים
  choice: యహ్వే దేవుడు
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, హీబ్రూ వ్యక్తినామానికి సమీపమైన ఆధునిక తెలుగు లిప్యంతరీకరణను వాడింది.
- source_word: מִן הָאֲדָמָה
  choice: నేలలోనుండి
  rationale: అదామా అనే పదంలోని నేల/మట్టి భావాన్ని సహజమైన తెలుగులో తెలియజేస్తూ, సమీప సందర్భంలోని మనిషి మూలంతో ఉన్న పదసంబంధాన్ని నిలుపుతుంది.
- source_word: כָּל חַיַּת הַשָּׂדֶה
  choice: ప్రతి అడవి జంతువును
  rationale: బయటి ప్రదేశాలకు చెందిన భూజంతువుల వర్గాన్ని ఆధునిక పాఠకులకు స్పష్టంగా తెలియజేస్తుంది; అక్షరార్థమైన ‘పొలంలోని జంతువు’ తెలుగులో పెంపుడు లేదా వ్యవసాయ జంతువు అనే అపార్థం కలిగించవచ్చు.
- source_word: כָּל עוֹף הַשָּׁמַיִם
  choice: ఆకాశంలోని ప్రతి పక్షిని
  rationale: పక్షి మరియు ఆకాశం అనే హీబ్రూ పదాల సాధారణ అర్థాలను సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: וַיָּבֵא אֶל הָאָדָם
  choice: ఆయన వాటిని అతని దగ్గరకు తీసుకొచ్చాడు
  rationale: ముందున్న సమూహవాచక జంతువులు, పక్షులను తెలుగు వాక్యంలో ‘వాటిని’ అని స్పష్టం చేసింది; הָאָדָםను ఇక్కడ వ్యక్తినామంగా కాక ‘మనిషి’గా గ్రహించింది.
- source_word: לִרְאוֹת מַה יִּקְרָא לוֹ
  choice: వాటికి ఏ పేరు పెడతాడో చూడడానికి
  rationale: ఉద్దేశార్థక క్రియను నేరుగా తెలుపుతూ, קרא యొక్క పేరు పెట్టడం/పిలవడం భావాన్ని సందర్భానుసారంగా సహజమైన తెలుగులో వ్యక్తం చేసింది.
- source_word: נֶפֶשׁ חַיָּה
  choice: ప్రతి జీవికి
  rationale: ఈ సందర్భంలో సజీవ ప్రాణిని సూచిస్తుంది. ‘జీవాత్మ’ వంటి తరువాతి తాత్త్విక లేదా సిద్ధాంతార్థాలను అనవసరంగా చేర్చకుండా జంతువులను సూచించే సహజ రూపాన్ని వాడింది.
- source_word: הוּא שְׁמוֹ
  choice: అదే దాని పేరైంది
  rationale: హీబ్రూ నామవాచక వాక్యంలోని ఫలిత భావాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: ఆదికాండం 1లోని సృష్టి క్రమంతో సంబంధించి וַיִּצֶר కాలభావం
  choice: 'సాధారణ భూతకాలం: ‘రూపొందించాడు’'
  alternative: 'పూర్వభూత భావం: ‘ముందే రూపొందించి ఉన్నాడు’'
  rationale: హీబ్రూ wayyiqtol రూపం సాధారణంగా కథనాన్ని ముందుకు నడిపే భూతకాలం; అది స్వయంగా పూర్వభూతాన్ని గుర్తించదు. అయితే విస్తృత సందర్భం పూర్వచర్యగా చదవడానికి వీలు ఇస్తుంది. ప్రధాన పాఠం రూపాన్ని నేరుగా అనుసరిస్తూ, సందర్భసాధ్యమైన పఠనాన్ని పాదసూచికలో ఉంచింది.
- issue: הָאָדָםను సామాన్య నామంగా లేదా వ్యక్తినామంగా అనువదించడం
  choice: మనిషి
  alternative: ఆదాము
  rationale: నిర్దిష్ట ఉపపదంతో ఉన్న హీబ్రూ రూపం అక్షరార్థంగా ‘ఆ మనిషి’. సమీపంలోని אֲדָמָה (నేల)తో పదసంబంధం ఉన్నందున సామాన్య నామార్థాన్ని ప్రధాన పాఠంలో నిలిపి, సంప్రదాయ వ్యక్తినామ పఠనాన్ని పాదసూచికలో తెలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన కథన శైలి. దైవనామానికి ‘యహ్వే’, הָאָדָםకు ప్రధాన పాఠంలో ‘మనిషి’ వాడబడ్డాయి. కాలక్రమంపై హీబ్రూలో ఉన్న వ్యాఖ్యాన అవకాశాన్ని ప్రధాన పాఠంలో బలవంతంగా పరిష్కరించకుండా పాదసూచికలో నిలిపింది.
