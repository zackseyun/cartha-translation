id: GEN.2.23
reference: Genesis 2:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּאמֶר֮ הָֽ/אָדָם֒ זֹ֣את הַ/פַּ֗עַם עֶ֚צֶם מֵֽ/עֲצָמַ֔/י וּ/בָשָׂ֖ר מִ/בְּשָׂרִ֑/י לְ/זֹאת֙ יִקָּרֵ֣א אִשָּׁ֔ה כִּ֥י מֵ/אִ֖ישׁ לֻֽקֳחָה זֹּֽאת־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/023.yaml
  text: Then the man said[a], “This at last is bone of my bones and flesh of my flesh; this one will be called woman[b], because from man she was taken.”
translation:
  language: te
  text: 'అప్పుడు ఆ మనిషి ఇలా అన్నాడు: “చివరికి ఈమెనే![a] ఈమె నా ఎముకల్లోని ఎముక, నా మాంసంలోని మాంసం. ఈమెను ‘స్త్రీ’[b] అని పిలుస్తారు; ఎందుకంటే పురుషుని నుండి ఈమె తీసుకోబడింది.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “ఈసారి ఈమె.” ఈ మాట ఎదురు చూసిన సరియైన జత ఇప్పుడు దొరికిందనే భావంతో “చివరికి” అని కూడా అర్థమవుతుంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో “స్త్రీ” (ఇష్షా), “పురుషుడు” (ఇష్) అనే పదాలు ధ్వనిలో దగ్గరగా ఉండి ఇక్కడ పదక్రీడను ఏర్పరుస్తాయి.
    reason: wordplay
lexical_decisions:
- source_word: הָאָדָם
  choice: ఆ మనిషి
  rationale: ఈ సందర్భంలో ఆదాము స్త్రీకి భిన్నమైన పురుషునిగా మాట్లాడుతున్నాడు; అందువల్ల సాధారణ మానవజాతి అనే అర్థం కంటే ‘ఆ మనిషి’ సందర్భానికి తగినది.
- source_word: זֹאת הַפַּעַם
  choice: చివరికి ఈమెనే!
  rationale: ఈ పదబంధం అక్షరార్థంగా ‘ఈసారి ఈమె’ అనే భావాన్ని కలిగించినా, సందర్భంలో ఎదురుచూసిన సరియైన సహచరి ఇప్పుడు లభించిందనే గుర్తింపు, ఉల్లాసాన్ని వ్యక్తం చేస్తుంది. తెలుగు వాక్యంలో సహజంగా ఉండేలా ‘చివరికి ఈమెనే!’ అని ఇచ్చి, అక్షరార్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: עֶצֶם מֵעֲצָמַי
  choice: నా ఎముకల్లోని ఎముక
  rationale: మూలంలోని ‘ఎముక—నా ఎముకల నుండి’ అనే నిర్మాణాన్ని తెలుగులో సహజమైన సంబంధార్థక రూపంతో అందిస్తూ శరీరసంబంధమైన సన్నిహితత్వాన్ని నిలుపుతుంది.
- source_word: וּבָשָׂר מִבְּשָׂרִי
  choice: నా మాంసంలోని మాంసం
  rationale: ముందటి ‘ఎముక’ వాక్యభాగంతో ఉన్న సమాంతర నిర్మాణాన్ని నిలుపుతూ, మూలంలోని గాఢమైన ఏకత్వ భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: לְזֹאת יִקָּרֵא
  choice: ఈమెను … అని పిలుస్తారు
  rationale: నామకరణాన్ని తెలిపే నిఫాల్ క్రియ యొక్క కర్మణి భావాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; זֹאת యొక్క సూచనాబలాన్ని ‘ఈమెను’ నిలుపుతుంది.
- source_word: אִשָּׁה
  choice: స్త్రీ
  rationale: ఇది సందర్భానుసారమైన సాధారణ అర్థం; ‘భార్య’ అని అనువదించడం మూలంలోని పరిధిని అనవసరంగా కుదిస్తుంది.
- source_word: מֵאִישׁ
  choice: పురుషుని నుండి
  rationale: మూలంలోని ఉత్పత్తి/వేరుచేయబడిన భావాన్ని ‘నుండి’ స్పష్టంగా అందిస్తుంది; אִשָּׁהతో ఉన్న ధ్వనిసామ్యాన్ని తెలుగులో నేరుగా పునరుత్పత్తి చేయలేము.
- source_word: לֻקֳחָה זֹּאת
  choice: ఈమె తీసుకోబడింది
  rationale: స్త్రీలింగ ఏకవచన కర్మణి క్రియను, చివరి సూచనాసర్వనామం ఇచ్చే ఉద్ఘాటనను రెండింటినీ స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: הָאָדָם పదానికి సందర్భానుసారమైన అర్థం
  choice: ఆ మనిషి
  alternative: ఆ మానవుడు / మానవజాతి
  rationale: ఈ వచనం పురుషుడు–స్త్రీ మధ్య వ్యత్యాసం మరియు אִישׁ–אִשָּׁה పదక్రీడపై కేంద్రీకృతమై ఉంది. ‘ఆ మనిషి’ ఈ స్థానిక సందర్భాన్ని కాపాడుతుంది; అయితే ఈ ఒక్క పదప్రయోగం ఆధారంగా విస్తృత మానవశాస్త్ర నిర్ణయాలను చేర్చదు.
- issue: אִישׁ / אִשָּׁה పదక్రీడ
  choice: పురుషుడు / స్త్రీ అని అనువదించి ధ్వనిసామ్యాన్ని పాదసూచికలో వివరించడం
  alternative: భర్త / భార్య
  rationale: ‘భర్త/భార్య’ అనడం భావాన్ని వివాహపాత్రలకే పరిమితం చేస్తుంది. ‘పురుషుడు/స్త్రీ’ మూలపదాల సాధారణ అర్థాన్ని నిలుపుతుంది; తెలుగులో లేని ధ్వనిసంబంధాన్ని పాదసూచిక నిజాయితీగా తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకుడికి సులభంగా ఉండే శైలి. కవితాత్మక సమాంతరతను నిలుపుతూ అతిగా పాతబడిన కర్మణి రూపాలు, మతసంఘ-ప్రత్యేక పదజాలం నివారించబడ్డాయి.
