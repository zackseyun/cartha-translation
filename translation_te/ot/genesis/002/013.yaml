source:
  edition: WLC
  text: וְ/שֵֽׁם הַ/נָּהָ֥ר הַ/שֵּׁנִ֖י גִּיח֑וֹן ה֣וּא הַ/סּוֹבֵ֔ב אֵ֖ת כָּל אֶ֥רֶץ כּֽוּשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/013.yaml
  text: And the name of the second river was Gihon[b][a]; it is the one that goes around all the land of Cush.
translation:
  language: te
  text: రెండవ నది పేరు గీహోను; అది కూషు దేశమంతటినీ చుట్టి ప్రవహిస్తుంది.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘కూషు దేశమంతటినీ చుట్టుముట్టి ప్రవహిస్తుంది.’
    reason: lexical_alternative
  - marker: b
    text: కూషు అనేది సంప్రదాయంగా ఐగుప్తుకు దక్షిణాన ఉన్న ప్రాంతాలతో సంబంధం కలిగిన స్థలనామం; హీబ్రూ పాఠం ఈ ప్రాచీన పేరునే భద్రపరుస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: וְ/שֵׁם הַ/נָּהָר הַ/שֵּׁנִי
  choice: రెండవ నది పేరు
  rationale: వావ్ మునుపటి నదుల వివరణను కొనసాగిస్తుంది; తెలుగులో వాక్యారంభంలో ప్రత్యేకంగా ‘మరియు’ చేర్చకుండానే ఆ అనుసంధానం సహజంగా వ్యక్తమవుతుంది. נָהָר కు ‘నది’, הַשֵּׁנִי కు ‘రెండవ’ ప్రత్యక్ష సమానార్థకాలు.
- source_word: גִּיחוֹן
  choice: గీహోను
  rationale: ప్రాచీన నది పేరును అనువదించకుండా, హీబ్రూ ఉచ్చారణకు సమీపంగా తెలుగు లిపిలో లిప్యంతరీకరించాం.
- source_word: הוּא הַ/סּוֹבֵב
  choice: అది ... చుట్టూ ప్రవహిస్తుంది
  rationale: הוּא నదిని తిరిగి సూచిస్తుంది. סבב అనే క్రియారూపం ‘చుట్టూ వెళ్లడం/చుట్టుముట్టడం’ అనే అర్థాన్ని ఇస్తుంది; నది సందర్భంలో సహజమైన తెలుగుకోసం ‘చుట్టూ ప్రవహిస్తుంది’ ఎంచుకున్నాం.
- source_word: אֵת כָּל אֶרֶץ
  choice: దేశమంతటి
  rationale: כָּל אֶרֶץ యొక్క సంపూర్ణతను సంక్షిప్తమైన, సహజమైన తెలుగు రూపంలో వ్యక్తపరుస్తుంది.
- source_word: כּוּשׁ
  choice: కూషు
  rationale: దీనిని ‘ఇథియోపియా’ అని చారిత్రకంగా నిర్దిష్టీకరించకుండా, హీబ్రూ స్థలనామాన్ని తెలుగు లిపిలో భద్రపరచాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన శైలిని ఉపయోగించాం. ‘చుట్టూ ప్రవహిస్తుంది’ నది సందర్భానికి సహజంగా ఉండగా, ‘చుట్టుముడుతుంది’ అనే మరింత పదశః ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
