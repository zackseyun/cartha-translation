id: GEN.2.9
reference: Genesis 2:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּצְמַ֞ח יְהוָ֤ה אֱלֹהִים֙ מִן הָ֣/אֲדָמָ֔ה כָּל עֵ֛ץ נֶחְמָ֥ד לְ/מַרְאֶ֖ה וְ/ט֣וֹב לְ/מַאֲכָ֑ל וְ/עֵ֤ץ הַֽ/חַיִּים֙ בְּ/ת֣וֹךְ הַ/גָּ֔ן וְ/עֵ֕ץ הַ/דַּ֖עַת ט֥וֹב וָ/רָֽע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/009.yaml
  text: And Yahweh God caused to grow from the ground every tree that is pleasant to the sight and good for food[a], and the tree of life in the midst of the garden[b], and the tree of the knowledge of good and evil.
translation:
  language: te
  text: యహ్వే దేవుడు నేల నుండి చూడటానికి ఆహ్లాదకరంగా, ఆహారానికి మంచిగా ఉన్న ప్రతి చెట్టును మొలిపించాడు; తోట మధ్యలో జీవవృక్షాన్నీ, మంచి చెడుల జ్ఞానపు వృక్షాన్నీ మొలిపించాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘మంచి చెడుల జ్ఞానం’ అనే పదబంధాన్ని అక్షరార్థంగానే ఉంచాం. ఇది నైతిక వివేచనను, పరిపక్వతను, లేదా సమగ్ర జ్ఞానాన్ని సూచిస్తుందా అనే విషయంలో వ్యాఖ్యాతల మధ్య భిన్నాభిప్రాయాలు ఉన్నాయి.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּצְמַח
  choice: మొలిపించాడు
  rationale: హిఫిల్ క్రియారూపంలోని కారణార్థాన్ని సహజమైన తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: יְהוָה אֱלֹהִים
  choice: యహ్వే దేవుడు
  rationale: దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా ‘యహ్వే’గా లిప్యంతరీకరించి, אֱלֹהִיםను ‘దేవుడు’గా అనువదిస్తుంది.
- source_word: מִן הָאֲדָמָה
  choice: నేల నుండి
  rationale: వృక్షాలు మొలిచే సాగుభూమి లేదా మట్టినే ఇక్కడ אֲדָמָה సూచిస్తుంది; ‘నేల’ సాధారణ ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: נֶחְמָד לְמַרְאֶה
  choice: చూడడానికి ఆహ్లాదకరమైనది
  rationale: కంటికి ఇంపుగా, చూడదగినదిగా ఉండే భావాన్ని సరళంగా, మూలానికి సమీపంగా తెలియజేస్తుంది.
- source_word: וְטוֹב לְמַאֲכָל
  choice: ఆహారానికి మంచిది
  rationale: ఆహారంగా ఉపయోగపడే మంచితనాన్ని హెబ్రీ నిర్మాణానికి దగ్గరగా వ్యక్తం చేస్తుంది.
- source_word: וְעֵץ הַחַיִּים
  choice: జీవవృక్షం
  rationale: సంప్రదాయబద్ధమైనదీ పారదర్శకమైనదీ అయిన సమాసరూపం.
- source_word: בְּתוֹךְ הַגָּן
  choice: తోట మధ్యలో
  rationale: తోటలోని మధ్యస్థానాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: וְעֵץ הַדַּעַת טוֹב וָרָע
  choice: మంచిచెడుల జ్ఞానవృక్షం
  rationale: వివాదాస్పదమైన భావాన్ని నైతిక వివేచనగా గానీ సమగ్ర జ్ఞానంగా గానీ ముందుగానే నిర్ధారించకుండా, మూలంలోని పదబంధాన్ని సంక్షిప్తమైన తెలుగు సమాసంగా నిలుపుతుంది.
theological_decisions:
- issue: יהוה అనే దైవనామాన్ని అనువదించడం
  choice: యహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో ఉన్న వ్యక్తిగత దైవనామాన్ని బిరుదుగా మార్చకుండా, సాధ్యమైన ఉచ్చారణకు దగ్గరగా తెలుగులో లిప్యంతరీకరించబడింది.
- issue: ‘మంచిచెడుల జ్ఞానం’ అనే పదబంధం యొక్క భావం
  choice: అర్థవివరణను ప్రధాన పాఠ్యంలో చేర్చకుండా మూలపదబంధాన్ని నిలుపడం
  alternative: నైతిక వివేచన; సమస్త విషయాల జ్ఞానం; మేలు కీడులను నిర్ణయించే జ్ఞానం
  rationale: ఈ హెబ్రీ పదబంధం అర్థంపై భిన్న వ్యాఖ్యానాలు ఉన్నందున, అనువాదం ఆ భేదాన్ని ఏకపక్షంగా పరిష్కరించదు.
- issue: తోట మధ్యలో ఉన్న వృక్షం లేదా వృక్షాల పరిధి
  choice: ‘తోట మధ్యలో’ అనే పదబంధాన్ని జీవవృక్షంతో ప్రత్యక్షంగా అనుసంధానించడం; జ్ఞానవృక్ష స్థానాన్ని అదనంగా నిర్ధారించకపోవడం
  alternative: రెండు వృక్షాలూ తోట మధ్యలో ఉన్నాయని స్పష్టీకరించడం
  rationale: హెబ్రీ పదక్రమంలో בְּתוֹךְ הַגָּן నేరుగా జీవవృక్షం తరువాత వస్తుంది; రెండవ వృక్షానికీ అదే స్థానవివరణ వర్తిస్తుందని ప్రధాన పాఠ్యంలో బలవంతంగా చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే సహజమైన వాక్యనిర్మాణంతో పాటు దైవనామం, జీవవృక్షం, జ్ఞానవృక్షం వంటి గంభీరమైన బైబిలు పదజాలం నిలుపబడింది. పొడవైన హెబ్రీ వాక్యాన్ని తెలుగులో స్పష్టత కోసం రెండు వాక్యాలుగా విభజించినా, కారణార్థం మరియు అంశాల క్రమం కాపాడబడ్డాయి.
