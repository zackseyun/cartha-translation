revisions:
- from: యొక్షాను షెబను, దెదానును కన్నాడు. దెదాను కుమారులు అష్షూరీయులు[a], లెతూషీయులు, లెయుమీయులు.
  to: యొక్షాను షెబాకు, దెదానుకు తండ్రి అయ్యాడు. దెదాను కుమారులు అష్షూరీము[a], లెతూషీము, లెయుమీము.
  rationale: The revision makes the paternal genealogical relationship explicit, regularizes Sheba as ‘షెబా,’ and treats the final three items as transliterated proper names rather than as the potentially misleading ethnonym ‘అష్షూరీయులు.’ The footnote preserves the lexical and referential uncertainty without asserting that they must be clans.
