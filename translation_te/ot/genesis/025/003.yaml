id: GEN.25.3
reference: Genesis 25:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/יָקְשָׁ֣ן יָלַ֔ד אֶת שְׁבָ֖א וְ/אֶת דְּדָ֑ן וּ/בְנֵ֣י דְדָ֔ן הָי֛וּ אַשּׁוּרִ֥ם וּ/לְטוּשִׁ֖ים וּ/לְאֻמִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/003.yaml
  text: Jokshan fathered Sheba and Dedan. The sons of Dedan were Asshurim[a], Letushim, and Leummim.
translation:
  language: te
  text: యొక్షాను షెబాకు, దెదానుకు తండ్రి అయ్యాడు. దెదాను కుమారులు అష్షూరీము[a], లెతూషీము, లెయుమీము.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఈ పేర్లు వ్యక్తుల పేర్లకన్నా వంశాల లేదా తెగల పేర్లు కావచ్చు. వాటిని అష్షూరీమ్, లెతూషీమ్, లెయుమీమ్ అని కూడా లిప్యంతరీకరించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָקְשָׁן
  choice: యొక్షాను
  rationale: వ్యక్తి పేరును హీబ్రూ రూపానికి సమీపంగా, తెలుగులో సహజంగా లిప్యంతరీకరించాం.
- source_word: יָלַד
  choice: కన్నాడు
  rationale: వంశావళిలో పురుషుడు సంతానానికి తండ్రి అయ్యాడనే భావాన్ని సంక్షిప్తంగా, సహజ ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: שְׁבָא
  choice: షెబ
  rationale: వ్యక్తి పేరును హీబ్రూ ఉచ్చారణకు సమీపంగా లిప్యంతరీకరించాం.
- source_word: דְּדָן
  choice: దెదాను
  rationale: వ్యక్తి పేరును అనువదించకుండా తెలుగులో లిప్యంతరీకరించాం.
- source_word: בְנֵי
  choice: కుమారులు
  rationale: హీబ్రూ పురుష బహువచన నిర్మాణాన్ని నేరుగా ప్రతిబింబిస్తుంది; ఇక్కడ వంశాలు లేదా తెగల పేర్లు ఉద్దేశించి ఉండవచ్చనే అవకాశాన్ని పాదసూచికలో ఉంచాం.
- source_word: הָיוּ
  choice: కుమారులు …
  rationale: తెలుగు నామవాక్యంలో ప్రత్యేకమైన ‘ఉన్నారు/అయ్యారు’ క్రియ అవసరం లేకుండానే హీబ్రూ సంబంధార్థం సహజంగా వ్యక్తమవుతుంది.
- source_word: אַשּׁוּרִם
  choice: అష్షూరీయులు
  rationale: ఇది బహువచన జాతి లేదా వంశ నామంగా కనిపిస్తున్నందున హీబ్రూ రూపాన్ని ప్రతిబింబించే తెలుగు రూపం వాడాం.
- source_word: לְטוּשִׁים
  choice: లెతూషీయులు
  rationale: అనిశ్చిత వ్యుత్పత్తిగల వంశ లేదా తెగ పేరుగా లిప్యంతరీకరించాం.
- source_word: לְאֻמִּים
  choice: లెయుమీయులు
  rationale: సాధారణ నామంగా అర్థానువాదం చేయకుండా, ఈ సందర్భంలోని వంశ లేదా ప్రజా నామంగా లిప్యంతరీకరించాం.
theological_decisions:
- issue: దెదాను తరువాతి పేర్లు వ్యక్తులా లేక వంశాలా
  choice: ముఖ్య పాఠంలో ‘కుమారులు’ అని మూల నిర్మాణాన్ని నిలిపి, పేర్లను బహువచన ప్రజా నామాలుగా ఇచ్చాం.
  alternative: వాటిని ముగ్గురు వ్యక్తుల ఏకవచన పేర్లుగా లిప్యంతరీకరించడం.
  rationale: בְנֵי అనే పదం అక్షరార్థంగా ‘కుమారులు’; అయితే తరువాతి మూడు రూపాలు హీబ్రూలో బహువచనంగా ఉండి వంశాలు లేదా తెగలను సూచించే అవకాశం ఉంది. ఈ ఉద్రిక్తతను పాదసూచికతో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన వంశావళి శైలిని వాడాం. పేర్లను మూల హీబ్రూకు సమీపంగా ఉంచి, బహువచన వంశనామాల అనిశ్చితిని పాదసూచికలో స్పష్టంచేశాం.
