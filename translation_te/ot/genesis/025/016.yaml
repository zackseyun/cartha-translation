revisions:
- from: వీరు ఇష్మాయేలు కుమారులు. వారి గ్రామాల్లోను వారి శిబిరాల్లోను వారి పేర్లు ఇవే[a]—తమ తమ జనాలకు పన్నెండు మంది అధిపతులు.[b]
  to: 'వీరు ఇష్మాయేలు కుమారులు; వారి నివాసస్థలాలూ శిబిరాలూ ఆధారంగా వారి పేర్లు ఇవి[a]: వారి వారి జనసమూహాల ప్రకారం పన్నెండు మంది అధిపతులు.[b]'
  rationale: The revision places the names after the classificatory phrase in an idiomatic Telugu construction, preserving the likely function of the Hebrew prepositions while retaining the locative alternative in a footnote. It also revises the final phrase to reflect “according to their peoples” more closely and broadens “గ్రామాలు” to the source-faithful “నివాసస్థలాలు.”
