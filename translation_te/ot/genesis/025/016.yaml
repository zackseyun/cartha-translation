id: GEN.25.16
reference: Genesis 25:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אֵ֣לֶּה הֵ֞ם בְּנֵ֤י יִשְׁמָעֵאל֙ וְ/אֵ֣לֶּה שְׁמֹתָ֔/ם בְּ/חַצְרֵי/הֶ֖ם וּ/בְ/טִֽירֹתָ֑/ם שְׁנֵים עָשָׂ֥ר נְשִׂיאִ֖ם לְ/אֻמֹּתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/016.yaml
  text: 'These are the sons of Ishmael[a], and these are their names[c][b], by their settlements and by their encampments: twelve princes according to their peoples.'
translation:
  language: te
  text: 'వీరు ఇష్మాయేలు కుమారులు; వారి నివాసస్థలాలూ శిబిరాలూ ఆధారంగా వారి పేర్లు ఇవి[a]: వారి వారి జనసమూహాల ప్రకారం పన్నెండు మంది అధిపతులు.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారి నివాసస్థలాల్లోను వారి శిబిరాల్లోను వారి పేర్లు ఇవి.”
    reason: బְּ ఉపసర్గను నివాసస్థలాలు, శిబిరాల ప్రకారం అనే వర్గీకరణార్థంలోనూ, “లో” అనే స్థలార్థంలోనూ అర్థం చేసుకోవచ్చు.
  - marker: b
    text: “అధిపతులు” అనే పదాన్ని “నాయకులు” లేదా “ప్రధానులు” అని కూడా అనువదించవచ్చు. “నివాసస్థలాలు”కు “గ్రామాలు,” “శిబిరాలు”కు “కంచెగల శిబిరాలు” లేదా “కోటలు” అనే అర్థాలు కూడా సాధ్యమే.
    reason: నְשִׂיאִם, חֲצֵרִים, టִירוֹת పదాల సందర్భోచిత అర్థ పరిధిని సూచిస్తుంది.
lexical_decisions:
- source_word: אֵלֶּה הֵם בְּנֵי יִשְׁמָעֵאל
  choice: వీరు ఇష్మాయేలు కుమారులు
  rationale: ఇక్కడ ఇప్పుడే పేరుపేరునా చెప్పబడిన ఇష్మాయేలు ప్రత్యక్ష కుమారులనే సూచిస్తున్నందున ‘కుమారులు’ అనే నిర్దిష్ట అర్థాన్ని నిలిపింది.
- source_word: וְאֵלֶּה שְׁמֹתָם
  choice: వారి పేర్లు ఇవే
  rationale: హీబ్రూ వాక్య నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగు క్రమంలో నేరుగా అందిస్తుంది.
- source_word: בְּחַצְרֵיהֶם
  choice: వారి గ్రామాల్లోను
  rationale: חָצֵר ఇక్కడ గ్రామం, చిన్న నివాస స్థలం లేదా చుట్టూ కంచెగల నివాస సముదాయాన్ని సూచించవచ్చు; సాధారణ పాఠకునికి ‘గ్రామాలు’ సహజంగా ఉంటుంది.
- source_word: וּבְטִירֹתָם
  choice: వారి శిబిరాల్లోను
  rationale: טִירָה శిబిరం, కంచెగల శిబిరం లేదా కోటలాంటి నివాసాన్ని సూచించగలదు. ఇష్మాయేలీయుల సందర్భంలో ‘శిబిరాలు’ సులభంగా అర్థమవుతుంది; పదంలోని విస్తృత అర్థాన్ని పాదటిప్పణిలో తెలిపింది.
- source_word: שְׁנֵים עָשָׂר נְשִׂיאִם
  choice: పన్నెండు మంది అధిపతులు
  rationale: נָשִׂיא గోత్ర లేదా జనసమూహ నాయకుణ్ణి సూచిస్తుంది. ‘రాజకుమారులు’ అని అనువదిస్తే రాజవంశపు కుమారులనే అనవసర భావం రావచ్చు; ‘అధిపతులు’ హోదాను స్పష్టంగా తెలియజేస్తుంది.
- source_word: לְאֻמֹּתָם
  choice: తమ తమ జనాలకు
  rationale: אֻמָּה ప్రజాసమూహం లేదా తెగను సూచిస్తుంది. לְ సంబంధాన్ని తెలుగులో సహజంగా ‘జనాలకు’ అని తెలిపి, ప్రతి అధిపతి తన జనసమూహానికి చెందినవాడనే భావాన్ని నిలిపింది.
theological_decisions:
- issue: నְשִׂיאִם అనే హోదా రాజవంశీయ ‘రాజకుమారులు’నా, లేక గోత్ర నాయకులా?
  choice: అధిపతులు
  alternative: రాజకుమారులు / నాయకులు
  rationale: మూలపదం నాయకత్వ హోదాను సూచిస్తుంది గాని తప్పనిసరిగా రాజు కుమారులని చెప్పదు. అందువల్ల అనవసర రాజవంశ భావాన్ని చేర్చకుండా ‘అధిపతులు’ ఎంచుకుంది.
- issue: బְּ ఉపసర్గ స్థలార్థమా, వర్గీకరణార్థమా?
  choice: గ్రామాల్లోను ... శిబిరాల్లోను
  alternative: గ్రామాల ప్రకారం ... శిబిరాల ప్రకారం
  rationale: ఉపసర్గకు సహజమైన స్థలార్థాన్ని ప్రధాన పాఠ్యంలో ఉంచింది; పేర్లు నివాస ప్రదేశాల ప్రకారం గుర్తించబడ్డాయనే సాధ్యమైన అర్థాన్ని పాదటిప్పణిలో నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన వచనం. ‘తమ తమ జనాలకు’ అనే ప్రయోగం ప్రతి అధిపతికి సంబంధించిన వేర్వేరు ప్రజాసమూహాలను సహజంగా తెలియజేస్తుంది. స్థలార్థం మరియు వర్గీకరణార్థం మధ్యనున్న మూలభాషా సందిగ్ధతను ప్రధాన పాఠ్యం–పాదటిప్పణి ద్వారా నిలిపింది.
