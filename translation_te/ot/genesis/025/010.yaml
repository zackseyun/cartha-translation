translation:
  language: te
  text: అబ్రాహాము హేతు కుమారుల నుండి కొనుగోలు చేసిన ఆ పొలంలోనే అబ్రాహాము, అతని భార్య శారా సమాధి చేయబడ్డారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘హేతు కుమారులు’ అనే హీబ్రూ వ్యక్తీకరణను ‘హిత్తీయులు’ అని కూడా అనువదించవచ్చు; అది హేతుకు చెందిన వంశం లేదా ప్రజావర్గాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשָּׂדֶה
  choice: ఆ పొలం
  rationale: నిర్దిష్టమైన ఈ నామవాచకం సందర్భంలో ముందే పేర్కొన్న సమాధి స్థలాన్ని సూచిస్తుంది; ‘ఆ పొలం’ సహజమైన ఆధునిక తెలుగు.
- source_word: אֲשֶׁר קָנָה אַבְרָהָם
  choice: అబ్రాహాము కొన్న
  rationale: సంబంధ వాక్యాన్ని తెలుగులో సహజమైన కృదంత నిర్మాణంతో అందించింది; భూవ్యవహార సందర్భంలో קנה కు ‘కొన్న’ స్పష్టమైన అర్థం.
- source_word: מֵאֵת בְּנֵי חֵת
  choice: హేతు కుమారుల దగ్గర
  rationale: మూలంలోని కుటుంబ/జాతి రూపమైన ‘హేతు కుమారులు’ను నిలిపి, కొనుగోలు మూలాన్ని తెలుగులో సహజంగా ‘దగ్గర’తో వ్యక్తం చేసింది.
- source_word: שָׁמָּה
  choice: ఆ పొలంలోనే
  rationale: స్థలాన్ని బలంగా తిరిగి సూచించే שָׁמָּה భావాన్ని ‘లోనే’ ద్వారా సహజంగా కలిపింది.
- source_word: קֻבַּר
  choice: పాతిపెట్టారు
  rationale: మూలంలోని సమాధి చేయబడిన భావాన్ని సాధారణ ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది; ముందున్న ఏకవచన క్రియను తెలుగు వాక్యనిర్మాణానికి అనుగుణంగా ఇద్దరికీ వర్తింపజేసింది.
- source_word: וְשָׂרָה אִשְׁתּוֹ
  choice: అతని భార్య శారాను
  rationale: సంబంధాన్ని స్పష్టంగా ఉంచుతూ ఆధునిక తెలుగులో సహజమైన పదక్రమాన్ని వాడింది.
