translation:
  language: te
  text: అబ్రాహాము మరొక భార్యను[a] చేసుకున్నాడు. ఆమె పేరు కెతూరా.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అబ్రాహాము మళ్లీ ఒక భార్యను చేసుకున్నాడు.” హెబ్రీలో అక్షరాలా, ‘అబ్రాహాము జోడించి ఒక భార్యను తీసుకున్నాడు’ అనే, కూడికను సూచించే ప్రయోగం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּסֶף
  choice: మరొక
  rationale: יסף యొక్క కూడిక/పునరావృత్తి భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; హెబ్రీలోని ‘మరల చేసి’ అనే నిర్మాణాన్ని అక్షరానువాదం చేయకుండా, అబ్రాహాము ఇంకొక భార్యను చేసుకున్నాడనే భావాన్ని నిలుపుతుంది.
- source_word: וַיִּקַּח
  choice: చేసుకున్నాడు
  rationale: לקח אשה అనేది భార్యను స్వీకరించడం లేదా వివాహం చేసుకోవడం తెలిపే హెబ్రీ నుడికారం. తెలుగులో ‘భార్యను చేసుకున్నాడు’ సహజంగా ఉండి వివాహ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: אִשָּׁה
  choice: భార్యను
  rationale: לקח అనే క్రియతో ఉన్న సందర్భంలో אִשָּׁהకు ‘స్త్రీ’ కంటే ‘భార్య’ అనే అర్థమే సందర్భోచితం.
- source_word: וּשְׁמָהּ
  choice: ఆమె పేరు
  rationale: సరళమైన హెబ్రీ నామపరిచయ వాక్యాన్ని సహజమైన ఆధునిక తెలుగులో నేరుగా అందిస్తుంది.
- source_word: קְטוּרָה
  choice: కెతూరా
  rationale: వ్యక్తి పేరును మూల హెబ్రీ ఉచ్చారణకు సమీపంగా తెలుగు లిపిలో లిప్యంతరీకరించాం.
theological_decisions:
- issue: וַיֹּסֶף యొక్క కూడిక లేదా పునరావృత్తి భావాన్ని ఎలా వ్యక్తపరచాలి
  choice: అబ్రాహాము మరొక భార్యను చేసుకున్నాడు
  alternative: అబ్రాహాము మళ్లీ ఒక భార్యను చేసుకున్నాడు; అబ్రాహాము ఇంకను చేసి ఒక భార్యను తీసుకున్నాడు
  rationale: ‘మరొక’ అనే పదం మూలంలోని additive భావాన్ని సహజంగా వ్యక్తపరుస్తుంది. అయితే ‘మళ్లీ’ అనే పునరావృత్తి అర్థం కూడా వ్యాకరణపరంగా సాధ్యమైనందున దాన్ని పాదసూచికలో నిలుపుతున్నాం; పాఠ్యంలో లేనిదైన ప్రత్యేక సిద్ధాంత నిర్ణయాన్ని చేర్చడం లేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడాం. ‘తీసుకున్నాడు’ కంటే తెలుగు వివాహ నుడికారమైన ‘భార్యను చేసుకున్నాడు’ను ఎంచుకున్నాం; మూలంలోని కూడిక/పునరావృత్తి సందిగ్ధతను పాదసూచికలో భద్రపరిచాం.
