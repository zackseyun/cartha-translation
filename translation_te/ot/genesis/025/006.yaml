  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి వాడబడింది. వారసుడైన ఇస్సాకుకూ ఉపపత్నుల కుమారులకూ మధ్య వచనం చూపే వ్యత్యాసం అతిశయింపకుండా నిలుపబడింది.
