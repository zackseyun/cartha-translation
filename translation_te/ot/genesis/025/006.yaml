id: GEN.25.6
reference: Genesis 25:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/לִ/בְנֵ֤י הַ/פִּֽילַגְשִׁים֙ אֲשֶׁ֣ר לְ/אַבְרָהָ֔ם נָתַ֥ן אַבְרָהָ֖ם מַתָּנֹ֑ת וַֽ/יְשַׁלְּחֵ֞/ם מֵ/עַ֨ל יִצְחָ֤ק בְּנ/וֹ֙ בְּ/עוֹדֶ֣/נּוּ חַ֔י קֵ֖דְמָ/ה אֶל אֶ֥רֶץ קֶֽדֶם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/006.yaml
  text: But to the sons of his concubines[a], Abraham gave gifts, and while he was still alive he sent them away from his son Isaac[b], eastward to the land of the east.
translation:
  language: te
  text: అయితే అబ్రాహాము తన ఉపపత్నుల[a] కుమారులకు కానుకలు ఇచ్చాడు. తాను ఇంకా బ్రతికి ఉండగానే వారిని తన కుమారుడైన ఇస్సాకు దగ్గరనుంచి తూర్పు దిశగా, తూర్పు దేశానికి పంపివేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అంటే, భార్యలకంటే తక్కువ సామాజిక-న్యాయ హోదా గల స్త్రీలు.
    reason: పురాతన కుటుంబ వ్యవస్థలోని పదార్థాన్ని ఆధునిక పాఠకులకు స్పష్టం చేయడం.
lexical_decisions:
- source_word: וְלִבְנֵי
  choice: అయితే ... కుమారులకు
  rationale: ముందటి వచనంలో ఇస్సాకుకు సమస్తం ఇవ్వడానికీ, ఇక్కడ ఇతర కుమారులకు కానుకలు ఇవ్వడానికీ మధ్య ఉన్న వ్యత్యాసాన్ని ‘అయితే’ సహజంగా వ్యక్తం చేస్తుంది; לְ యొక్క గ్రాహకార్థాన్ని ‘కుమారులకు’ నిలుపుతుంది.
- source_word: הַפִּילַגְשִׁים אֲשֶׁר לְאַבְרָהָם
  choice: తన ఉపపత్నుల
  rationale: ఈ పదబంధం అబ్రాహాముకు చెందిన, భార్యకంటే తక్కువ సామాజిక-న్యాయ హోదా గల స్త్రీలను సూచిస్తుంది. ‘ఉపపత్నులు’ సంక్షిప్తమైన, గౌరవప్రదమైన ప్రామాణిక తెలుగు పదం.
- source_word: נָתַן ... מַתָּנֹת
  choice: కానుకలు ఇచ్చాడు
  rationale: క్రియ-కర్మ పదబంధాన్ని సహజమైన ఆధునిక తెలుగులో నేరుగా అందిస్తుంది.
- source_word: וַיְשַׁלְּחֵם
  choice: వారిని ... పంపివేశాడు
  rationale: కేవలం పంపడమే కాక ఇస్సాకు దగ్గరనుంచి వేరుగా పంపిన భావాన్ని ‘పంపివేశాడు’ వ్యక్తం చేస్తుంది.
- source_word: מֵעַל יִצְחָק בְּנוֹ
  choice: తన కుమారుడైన ఇస్సాకు దగ్గరనుంచి
  rationale: מֵעַל ఇక్కడ ఇస్సాకు సమీపం లేదా సన్నిధి నుంచి వేరుచేయడాన్ని సూచిస్తుంది. ‘దగ్గరనుంచి’ ఆ భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: בְּעוֹדֶנּוּ חַי
  choice: తాను ఇంకా బ్రతికి ఉండగానే
  rationale: అబ్రాహాము తన మరణానికి ముందే ఈ చర్య తీసుకున్నాడనే కాలార్థాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: קֵדְמָה אֶל אֶרֶץ קֶדֶם
  choice: తూర్పు దిశగా, తూర్పు దేశానికి
  rationale: మొదటి పదంలోని దిశార్థాన్నీ, తరువాతి పదబంధంలోని గమ్యప్రాంతాన్నీ విడివిడిగా నిలిపి, మూలంలోని ఉద్దేశపూర్వక పునరుక్తిని సంరక్షిస్తుంది.
