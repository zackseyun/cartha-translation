  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. అసలు హీబ్రూలోని స్పష్టమైన కానీ అసాధారణమైన ‘అతని నోటిలో’ అనే ప్రయోగం ప్రధాన వచనంలో నిలుపబడింది; దాని సంభావ్య భావం పాదసూచికలో ఇవ్వబడింది.
