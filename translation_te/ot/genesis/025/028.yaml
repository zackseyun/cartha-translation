  text: וַ/יֶּאֱהַ֥ב יִצְחָ֛ק אֶת עֵשָׂ֖ו כִּי צַ֣יִד בְּ/פִ֑י/ו וְ/רִבְקָ֖ה אֹהֶ֥בֶת אֶֽת יַעֲקֹֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/028.yaml
  text: Isaac loved Esau because game was in his mouth[a], but Rebekah loved Jacob.
translation:
  language: te
  text: ఇస్సాకు ఏశావును ప్రేమించాడు, ఎందుకంటే వేటమాంసం ఇస్సాకు నోటిలో ఉండేది[a]. అయితే రిబ్కా యాకోబును ప్రేమించేది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “ఎందుకంటే వేటమాంసం ఇస్సాకు నోటిలో ఉండేది.” ఏశావు తెచ్చిన వేటమాంసాన్ని తినడం ఇస్సాకుకు ఇష్టమని ఈ మాటకు బహుశా అర్థం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּאֱהַב
  choice: ప్రేమించాడు
  rationale: కథనంలోని పూర్తయిన గత క్రియను ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אֶת עֵשָׂו
  choice: ఏశావును
  rationale: ప్రత్యక్ష కర్మ సూచకమైన אֶת విడిగా అనువదించబడదు; పేరుకు తెలుగు విభక్తి జోడించబడింది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ఇస్సాకు ఏశావును ప్రేమించడానికి గల కారణాన్ని ఈ పదం పరిచయం చేస్తుంది.
- source_word: צַיִד
  choice: వేటమాంసం
  rationale: వేటాడి సంపాదించిన జంతు ఆహారాన్ని సూచిస్తుంది; ‘జింకమాంసం’ అని అర్థాన్ని అనవసరంగా కుదించదు.
- source_word: בְּפִיו
  choice: అతని నోటిలో
  rationale: హీబ్రూ భాషలోని స్పష్టమైన శరీరాంగ రూపకాన్ని అలాగే ఉంచి, దాని భావాన్ని పాదసూచికలో వివరిస్తుంది.
- source_word: וְרִבְקָה
  choice: అయితే రిబ్కా
  rationale: וְ ప్రాథమికంగా సంధానార్థకమైనా, ఇక్కడ తల్లిదండ్రుల భిన్నమైన అభిమానాల మధ్య ఉన్న వ్యత్యాసాన్ని ‘అయితే’ సహజంగా తెలియజేస్తుంది.
- source_word: אֹהֶבֶת
  choice: ప్రేమించింది
  rationale: వర్తమాన కృదంతం నిరంతర లేదా లక్షణాత్మక అభిమానాన్ని సూచించగలదు; కథన సందర్భంలో తెలుగు భూతకాల రూపం సహజంగా సరిపోతుంది.
- source_word: אֶת יַעֲקֹב
  choice: యాకోబును
  rationale: ప్రత్యక్ష కర్మ సూచకాన్ని విడిగా అనువదించకుండా, పేరుకు తగిన తెలుగు విభక్తి జోడించబడింది.
