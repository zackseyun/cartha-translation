source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יַעֲקֹ֗ב הִשָּׁ֤בְעָ/ה לִּ/י֙ כַּ/יּ֔וֹם וַ/יִּשָּׁבַ֖ע ל֑/וֹ וַ/יִּמְכֹּ֥ר אֶת בְּכֹרָת֖/וֹ לְ/יַעֲקֹֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/033.yaml
  text: And Jacob said[b][a], “Swear to me today.” So he swore to him and sold his birthright to Jacob.
translation:
  language: te
  text: అప్పుడు యాకోబు, “ఈ రోజున నాకు ప్రమాణం చేయి[a]” అన్నాడు. ఏశావు అతనికి ప్రమాణం చేసి, తన జ్యేష్ఠత్వ హక్కును[b] యాకోబుకు అమ్మేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఈ నాటికి నాకు ప్రమాణం చేయి” లేదా “ఈ రోజునే నాకు ప్రమాణం చేయి.”
    reason: lexical_alternative
  - marker: b
    text: “జ్యేష్ఠత్వ హక్కు” అంటే మొదట పుట్టిన కుమారునికి చెందిన హక్కులు, కుటుంబ హోదా.
    reason: cultural_note
lexical_decisions:
- source_word: הִשָּׁבְעָה לִּי
  choice: నాకు ప్రమాణం చెయ్యి
  rationale: ఆజ్ఞార్థక ప్రమాణ సూత్రాన్ని సహజమైన ఆధునిక తెలుగులో నేరుగా వ్యక్తం చేస్తుంది; לִּי ప్రమాణం ఎవరికి చేయబడుతుందో సూచిస్తుంది.
- source_word: כַּיּוֹם
  choice: ఈ రోజే
  rationale: ‘ఈ రోజు/ఈ రోజునే’ అనే కాలార్థంతో పాటు సందర్భంలోని తక్షణతను ‘ఏ’ నొక్కుతో సహజంగా తెలియజేస్తుంది; ఇతర సాధ్యార్థాలను పాదసూచికలో ఉంచాం.
- source_word: וַיִּשָּׁבַע לֹו
  choice: అతనికి ప్రమాణం చేసి
  rationale: కథన క్రమాన్ని సంక్షిప్తంగా కొనసాగిస్తూ, ఆజ్ఞలోని ‘ప్రమాణం’ పదంతో మూలంలోని శబ్దసంబంధాన్ని నిలుపుతుంది.
- source_word: וַיִּמְכֹּר
  choice: అమ్మేశాడు
  rationale: מכר యొక్క స్పష్టమైన విక్రయార్థాన్ని నిలుపుతుంది; తెలుగు క్రియారూపం లావాదేవీ పూర్తయిన భావాన్ని సహజంగా ఇస్తుంది.
- source_word: בְּכֹרָתוֹ
  choice: తన జ్యేష్ఠత్వ హక్కును
  rationale: మొదట పుట్టిన కుమారునికి చెందిన హోదా, హక్కులు అనే కుటుంబ-చట్టపరమైన భావాన్ని సాధారణ పాఠకుడికి స్పష్టంగా అందిస్తుంది.
- source_word: לְיַעֲקֹב
  choice: యాకోబుకు
  rationale: అమ్మకం ద్వారా హక్కు అందుకున్న వ్యక్తిని సూచించే לְ భావాన్ని సహజమైన తెలుగు సంప్రదాన విభక్తితో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ఏశావు బְּכֹרָהను బదిలీ చేసిన స్వభావం
  choice: తన జ్యేష్ఠత్వ హక్కును యాకోబుకు అమ్మేశాడు
  alternative: మొదట పుట్టినవానిగా తనకున్న హక్కులను యాకోబుకు అమ్మేశాడు
  rationale: వచనం మొదట పుట్టిన కుమారుని కుటుంబ-చట్టపరమైన హక్కు/హోదాను నిజమైన లావాదేవీగా వర్ణిస్తుంది. అనవసరమైన సిద్ధాంత వివరణను చేర్చకుండా ఆ భావాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకుడికి సులభంగా అర్థమయ్యే కథన శైలి. ‘ప్రమాణం చెయ్యి’ సంభాషణలో సహజత్వాన్ని, ‘జ్యేష్ఠత్వ హక్కు’ మూలంలోని కుటుంబ-చట్టపరమైన భావాన్ని కాపాడుతాయి. పాదసూచిక గుర్తులు సంబంధిత పదబంధాల వెంట ప్రధాన పాఠ్యంలో ఉంచబడ్డాయి.
