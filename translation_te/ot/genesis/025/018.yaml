id: GEN.25.18
reference: Genesis 25:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּשְׁכְּנ֨וּ מֵֽ/חֲוִילָ֜ה עַד שׁ֗וּר אֲשֶׁר֙ עַל פְּנֵ֣י מִצְרַ֔יִם בֹּאֲ/כָ֖ה אַשּׁ֑וּרָ/ה עַל פְּנֵ֥י כָל אֶחָ֖י/ו נָפָֽל־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/018.yaml
  text: They settled from Havilah to Shur[a], which is opposite Egypt as you go toward Asshur[b]. He settled opposite all his brothers.
translation:
  language: te
  text: వారు హవీలా మొదలుకొని షూరు వరకు నివసించారు. షూరు ఐగుప్తుకు ఎదురుగా, అష్షూరు[b] వైపు వెళ్లే దారిలో ఉంది. అతడు తన సహోదరులందరికీ ఎదురుగా స్థిరపడ్డాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పదబంధం సందిగ్ధంగా ఉంది. దీనిని “అతడు తన సహోదరులందరితో విరోధంగా నివసించాడు” అని కూడా అర్థం చేసుకోవచ్చు; మరింత అక్షరార్థంగా, “అతడు తన సహోదరులందరి ఎదుట పడిపోయాడు” అని ఉంటుంది.
    reason: alternative_reading
  - marker: b
    text: “అష్షూరు”ను “అష్షూరియా” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכְּנוּ
  choice: వారు నివసించారు
  rationale: שׁכן అనే క్రియ ఇక్కడ ఒక ప్రాంతంలో నివసించడం లేదా స్థిరపడటాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘నివసించారు’ సహజంగా ఉండి, ప్రాంత వివరణకు సరిపోతుంది.
- source_word: מֵחֲוִילָה עַד שׁוּר
  choice: హవీలా మొదలుకొని షూరు వరకు
  rationale: ఇది వారి నివాస ప్రాంతపు విస్తృతిని సూచించే సరళమైన ‘నుండి—వరకు’ నిర్మాణం.
- source_word: אֲשֶׁר עַל־פְּנֵי מִצְרַיִם
  choice: షూరు ఐగుప్తుకు ఎదురుగా ... ఉంది
  rationale: עַל־פְּנֵי అనే పదబంధం అక్షరార్థంగా ‘ముఖానికి ఎదురుగా’ అనే స్థల సంబంధాన్ని తెలియజేస్తుంది. నిర్దిష్ట దిక్కును అనవసరంగా చేర్చకుండా ‘ఎదురుగా’ అని అనువదించాం.
- source_word: בֹּאֲכָה אַשּׁוּרָה
  choice: అష్షూరు వైపు వెళ్లే దారిలో
  rationale: దిశాసూచక ה కలిగిన אַשּׁוּרָה అష్షూరు వైపు కదలికను సూచిస్తుంది; ‘వెళ్లే దారిలో’ అనే రూపం తెలుగులో భౌగోళిక వివరణను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: עַל־פְּנֵי כָּל־אֶחָיו נָפָל
  choice: అతడు తన సహోదరులందరికీ ఎదురుగా స్థిరపడ్డాడు
  rationale: ఈ వివాదాస్పద నుడికారంలో עַל־פְּנֵי యొక్క స్థలార్థాన్ని ‘ఎదురుగా’గా ఉంచి, נָפָל ను సందర్భానుసారంగా ‘స్థిరపడ్డాడు’గా అనువదించాం. శత్రుత్వ భావాన్ని ప్రధాన వచనంలో బలవంతంగా చేర్చలేదు.
theological_decisions:
- issue: עַל־פְּנֵי כָּל־אֶחָיו נָפָל అనే చివరి వాక్యభాగం యొక్క భావం
  choice: అతడు తన సహోదరులందరికీ ఎదురుగా స్థిరపడ్డాడు
  alternative: అతడు తన సహోదరులందరితో విరోధంగా నివసించాడు; లేదా అక్షరార్థంగా, అతడు తన సహోదరులందరి ఎదుట పడిపోయాడు
  rationale: హీబ్రూ పదబంధం స్థల సంబంధాన్ని, విరోధ భావాన్ని, లేదా נפל యొక్క సాధారణ ‘పడిపోవు’ అర్థాన్ని సూచించగలదని వివిధ రీతుల్లో అర్థం చేసుకున్నారు. ప్రధాన వచనం తక్కువ వ్యాఖ్యానాత్మకమైన స్థలార్థాన్ని ఇస్తుంది; మిగిలిన నిజమైన సందిగ్ధతను పాదసూచికలో నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన వచనం. పొడవైన హీబ్రూ సంబంధవాక్యాన్ని రెండు తెలుగు వాక్యాలుగా విభజించి భౌగోళిక సంబంధాన్ని స్పష్టంచేశాం; మూలంలోని సందిగ్ధతను పాదసూచికలో నిలిపాం.
