  source_fidelity: The reciprocal/intensive sense of וַיִּתְרֹצֲצוּ is well conveyed by “ఒకరితో ఒకరు పెనుగులాడారు,” and the elliptical question is responsibly represented with an alternative in the footnote. However, the divine-name form should align with the POB audit trail’s stated rendering of יהוה as “Yahweh,” rather than use the distinct traditional “Jehovah” form.
