  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּתְרֹֽצֲצ֤וּ הַ/בָּנִים֙ בְּ/קִרְבָּ֔/הּ וַ/תֹּ֣אמֶר אִם כֵּ֔ן לָ֥/מָּה זֶּ֖ה אָנֹ֑כִי וַ/תֵּ֖לֶךְ לִ/דְרֹ֥שׁ אֶת יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/022.yaml
  text: And the children struggled together within her[a], and she said, “If it is so, why am I like this?” So she went to inquire of Yahweh.
translation:
  language: te
  text: ఆమె లోపల పిల్లలు ఒకరితో ఒకరు పెనుగులాడారు. అప్పుడు ఆమె, “ఇలాగైతే, నేనెందుకు ఇలా ఉన్నాను?[a]” అని చెప్పి, యాహ్వేను అడగడానికి వెళ్లింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నేనెందుకు ఈ విధంగా ఉన్నాను?” హీబ్రూ మాట సంక్షిప్తంగా ఉంది; మరింత అక్షరార్థంగా “నేనెందుకు?” అని కూడా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְרֹצֲצוּ
  choice: ఒకరితో ఒకరు పెనుగులాడారు
  rationale: హిత్పయేల్ రూపంలోని పరస్పర, తీవ్ర కదలికను తెలియజేస్తూ, గర్భంలోని పిల్లల మధ్య సంఘర్షణ భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: הַבָּנִים
  choice: పిల్లలు
  rationale: పుట్టకముందున్న ఈ సందర్భంలో ‘పిల్లలు’ సహజంగా ఉంటుంది; తరువాతి వచనంలో వెల్లడయ్యే వారి పురుష లింగాన్ని ఇది నిరాకరించదు.
- source_word: בְּקִרְבָּהּ
  choice: ఆమె లోపల
  rationale: అక్షరార్థంగా ‘ఆమె అంతర్భాగంలో’; మూలంలో స్పష్టంగా లేని ‘గర్భంలో’ అనే నిర్దిష్టతను చేర్చకుండా శారీరక భావాన్ని అందిస్తుంది.
- source_word: אִם כֵּן
  choice: ఇలాగైతే
  rationale: ఆమె అనుభవిస్తున్న పరిస్థితిని సూచించే షరతు భావాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לָמָּה זֶּה אָנֹכִי
  choice: నేనెందుకు ఇలా ఉన్నాను?
  rationale: హీబ్రూ మాట సంక్షిప్తంగా, అసంపూర్ణంగా ఉంది. అస్తిత్వం గురించిన తాత్త్విక ప్రశ్నగా నిర్ధారించకుండా, ఆమె బాధాకర స్థితిపై ప్రశ్నగా సహజంగా తెలియజేస్తుంది.
- source_word: לִדְרֹשׁ אֶת יְהוָה
  choice: యెహోవాను విచారించడానికి
  rationale: దేవుని నుండి వివరణ లేదా మార్గదర్శకం కోరే సందర్భంలో דרש క్రియకు ఉన్న ప్రత్యేక భావాన్ని తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా స్థిరపడిన రూపంలో వ్యక్తిగత నామంగా అందిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలోని చతురక్షర దైవనామాన్ని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా వ్యక్తిగత నామంగా ఉంచాం. ఆధునిక ప్రామాణిక తెలుగు బైబిలు వాడుకలో సుపరిచితమైన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం; ‘యాహ్వే’ మూల ఉచ్చారణకు దగ్గరైన ప్రత్యామ్నాయం.
- issue: לָמָּה זֶּה אָנֹכִי అనే సంక్షిప్త ప్రశ్న భావం
  choice: నేనెందుకు ఇలా ఉన్నాను?
  alternative: నేనెందుకు?
  rationale: సందర్భానుసారమైన అర్థాన్ని ప్రధాన పాఠ్యంలో సహజంగా ఇచ్చినా, మూలంలోని అస్తిత్వ సంబంధ లేదా మరింత సంక్షిప్త భావసాధ్యతను పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని వాడాం. ‘పెనుగులాడారు’ పరస్పర సంఘర్షణ తీవ్రతను నిలుపుతుంది; సందిగ్ధమైన ప్రశ్నను ప్రధాన పాఠ్యంలో స్పష్టంగా ఉంచి, అసలు హీబ్రూ సంక్షిప్తతను పాదసూచికలో సంరక్షించాం.
