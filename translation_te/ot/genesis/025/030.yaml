source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר עֵשָׂ֜ו אֶֽל יַעֲקֹ֗ב הַלְעִיטֵ֤/נִי נָא֙ מִן הָ/אָדֹ֤ם הָ/אָדֹם֙ הַ/זֶּ֔ה כִּ֥י עָיֵ֖ף אָנֹ֑כִי עַל כֵּ֥ן קָרָֽא שְׁמ֖/וֹ אֱדֽוֹם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/030.yaml
  text: Esau said to Jacob[a], “Please let me gulp down some of that red stuff, that red stuff there[c][b], because I am exhausted.” Therefore his name was called Edom.
translation:
  language: te
  text: ఏశావు యాకోబుతో, “దయచేసి ఆ ఎర్రనిది, అక్కడున్న ఆ ఎర్రనిది కొంచెం నాకు గబగబా మింగడానికి ఇవ్వు[a]; ఎందుకంటే నేను బాగా అలసిపోయాను” అన్నాడు. అందుకే అతని పేరు ఎదోము[b] అని పిలువబడింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ఆహారం పేరు చెప్పకుండా ‘ఎర్రనిది, ఎర్రనిది’ అని పునరుక్తి ఉంది; ఇది ఏశావు తొందరపాటుతో మాట్లాడిన తీరును ప్రతిబింబించవచ్చు. అనేక అనువాదాలు ఇక్కడ ‘చిక్కని కూర’ అని చేర్చుతాయి.
    reason: lexical_alternative
  - marker: b
    text: ‘ఎదోము’ అనే హీబ్రూ పేరు ‘ఎర్ర’ అనే పదంలా వినిపిస్తుంది; ఈ వచనంలోని పదప్రయోగం దీనిపై ఆధారపడింది.
    reason: wordplay
lexical_decisions:
- source_word: הַלְעִיטֵנִי
  choice: నన్ను గబగబా మింగనివ్వు
  rationale: హిఫీల్ ఆజ్ఞారూపం సాధారణంగా ‘తినిపించు’ అనేదానికంటే ఆత్రంగా లేదా అత్యాశగా మింగడాన్ని సూచిస్తుంది. ఈ ప్రయోగం ఏశావు తొందరపాటుతో మాట్లాడిన తీరును నిలుపుతుంది.
- source_word: נָא
  choice: దయచేసి
  rationale: అభ్యర్థనను సూచించే ఈ నిపాతానికి ఆధునిక ప్రామాణిక తెలుగులో సహజమైన సమానం.
- source_word: מִן הָאָדֹם הָאָדֹם הַזֶּה
  choice: ఆ ఎర్రనిది, అక్కడున్న ఆ ఎర్రనిది కొంచెం
  rationale: హీబ్రూలో ఆహారం పేరును చెప్పకుండా ‘ఎర్రనిది’ అనే మాటను పునరుక్తి చేస్తుంది. తెలుగులోనూ ఆ అసంపూర్ణతను, పునరుక్తిని నిలిపి, מן భావాన్ని ‘కొంచెం’తో వ్యక్తం చేసింది.
- source_word: כִּי עָיֵף אָנֹכִי
  choice: ఎందుకంటే నేను బాగా అలసిపోయాను
  rationale: עָיֵף అలసట లేదా శ్రమతో నిస్సత్తువగా ఉండడాన్ని సూచిస్తుంది; ‘బాగా అలసిపోయాను’ సహజంగా ఉండి భావాన్ని అతిశయింపజేయదు.
- source_word: עַל כֵּן
  choice: అందుకే
  rationale: పేరుకు కారణాన్ని తెలిపే అన్వయాన్ని ఆధునిక తెలుగులో సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: קָרָא שְׁמוֹ אֱדוֹם
  choice: అతని పేరు ఎదోము అని పిలువబడింది
  rationale: ‘అతని పేరు’ అనే హీబ్రూ నామకరణ సూత్రాన్ని సాధ్యమైనంత దగ్గరగా నిలుపుతుంది; క్రియకు స్పష్టమైన కర్త లేకపోవడాన్ని కూడా అనవసరంగా పరిష్కరించదు.
- source_word: אֱדוֹם
  choice: ఎదోము
  rationale: వ్యక్తినామాన్ని లిప్యంతరీకరించింది; ‘ఎర్రనిది’తో ఉన్న పదప్రయోగాన్ని పాదటిప్పణి వివరిస్తుంది.
theological_decisions: []
