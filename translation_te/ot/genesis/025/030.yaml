  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన కథన శైలి. ఏశావు మాటల్లోని తొందరపాటు, కొంత మొరటుతనాన్ని ‘గబగబా మింగనివ్వు’తో వ్యక్తం చేసింది. మూలంలోని ‘ఎర్రనిది’ పునరుక్తిని అలాగే నిలిపింది.
