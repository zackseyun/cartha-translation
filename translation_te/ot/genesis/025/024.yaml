  yaml_path: translation/ot/genesis/025/024.yaml
  text: When her days to give birth were fulfilled, behold, there were twins in her womb.
translation:
  language: te
  text: ఆమె ప్రసవించాల్సిన సమయం పూర్తయినప్పుడు, ఇదిగో, ఆమె గర్భంలో కవలలు ఉన్నారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּמְלְאוּ יָמֶיהָ
  choice: ఆమె ప్రసవించే రోజులు నిండినప్పుడు
  rationale: హీబ్రూ భాషలో ఒక కాలవ్యవధి పూర్తవడాన్ని తెలిపే ‘రోజులు నిండడం’ అనే నుడికారాన్ని సహజమైన తెలుగులోనూ నిలుపుతుంది.
- source_word: לָלֶדֶת
  choice: ప్రసవించే
  rationale: పిల్లను కనడం అనే భావాన్ని సందర్భానుకూలమైన, గౌరవప్రదమైన ఆధునిక తెలుగు పదంతో తెలియజేస్తుంది.
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: తర్వాత వెల్లడయ్యే గమనార్హమైన విషయంపై దృష్టి నిలిపే హీబ్రూ సూచక పదం బలాన్ని కాపాడుతుంది.
- source_word: תוֹמִם
  choice: కవలలు
  rationale: మూలంలోని బహువచన నామవాచకానికి నేరమైన, సహజమైన తెలుగు సమానార్థకం.
- source_word: בְּבִטְנָהּ
  choice: ఆమె గర్భంలో
  rationale: ప్రసవ సందర్భంలో בטן అనే పదానికి ‘గర్భం’ అత్యంత సహజమైన, నిర్దిష్టమైన తెలుగు అనువాదం.
theological_decisions: []
translation_notes:
  register: సామాన్య పాఠకులకు అర్థమయ్యే ఆధునిక ప్రామాణిక తెలుగు; ‘రోజులు నిండినప్పుడు,’ ‘ఇదిగో’ అనే రూపాలు మూలంలోని నుడికారాన్ని, వాక్య ఉద్ఘాటనను గౌరవప్రదమైన శైలిలో నిలుపుతున్నాయి.
