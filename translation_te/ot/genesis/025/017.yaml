  text: וְ/אֵ֗לֶּה שְׁנֵי֙ חַיֵּ֣י יִשְׁמָעֵ֔אל מְאַ֥ת שָׁנָ֛ה וּ/שְׁלֹשִׁ֥ים שָׁנָ֖ה וְ/שֶׁ֣בַע שָׁנִ֑ים וַ/יִּגְוַ֣ע וַ/יָּ֔מָת וַ/יֵּאָ֖סֶף אֶל עַמָּֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/017.yaml
  text: 'These were the years of Ishmael’s life: one hundred and thirty-seven years[a]. And he breathed his last and died[b], and was gathered to his people.'
translation:
  language: te
  text: 'ఇష్మాయేలు జీవించిన సంవత్సరాలు ఇవే: నూట ముప్పై ఏడు సంవత్సరాలు. అతడు తుదిశ్వాస విడిచి[a] చనిపోయాడు; తన ప్రజలలో చేర్చబడ్డాడు[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ప్రాణం విడిచాడు.’ ఇక్కడి హీబ్రూ క్రియ తరువాత వచ్చే ‘చనిపోయాడు’ అనే క్రియకు భిన్నమైనది; అందుకే అనువాదంలో రెండింటినీ ఉంచాం.
    reason: lexical_alternative
  - marker: b
    text: ‘తన ప్రజలలో చేర్చబడ్డాడు’ అనేది మరణ ప్రకటనల్లో వాడే హీబ్రూ నుడికారం. అది ఒక వ్యక్తి తన పూర్వీకులతో తిరిగి కలవడాన్ని, తనవారి మధ్య సమాధి చేయబడడాన్ని, లేదా రెండింటినీ సూచించవచ్చు.
    reason: cultural_note
lexical_decisions:
- source_word: וְאֵלֶּה שְׁנֵי חַיֵּי יִשְׁמָעֵאל
  choice: ఇష్మాయేలు జీవించిన సంవత్సరాలు ఇవే
  rationale: జీవితకాలాన్ని సంవత్సరాలతో లెక్కించే హీబ్రూ ప్రయోగాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తూ, సారాంశ ప్రకటన స్వరాన్ని నిలుపుతుంది.
- source_word: מְאַת שָׁנָה וּשְׁלֹשִׁים שָׁנָה וְשֶׁבַע שָׁנִים
  choice: నూట ముప్పై ఏడు సంవత్సరాలు
  rationale: హీబ్రూ సంఖ్యా క్రమంలోని ఖచ్చితమైన మొత్తాన్ని సహజ తెలుగు సంఖ్యా రూపంలో ఇస్తుంది.
- source_word: וַיִּגְוַע
  choice: తుదిశ్వాస విడిచి
  rationale: తరువాత వచ్చే ‘చనిపోయాడు’ అనే వేరే క్రియతో కలిపివేయకుండా, גוע లోని ప్రాణం విడిచే భావాన్ని ప్రత్యేకంగా నిలుపుతుంది.
- source_word: וַיָּמָת
  choice: చనిపోయాడు
  rationale: מות అనే రెండవ మరణక్రియను స్పష్టంగా అనువదించి, మూలంలోని రెండు క్రియల క్రమాన్ని కాపాడుతుంది.
- source_word: וַיֵּאָסֶף אֶל־עַמָּיו
  choice: తన ప్రజల దగ్గరకు చేర్చబడ్డాడు
  rationale: మరణ ప్రకటనలోని హీబ్రూ నుడికారాన్ని దాని కర్మణి రూపంతో సహా నిలుపుతూ, అది సమాధిని సూచిస్తుందా, మరణానంతర కలయికను సూచిస్తుందా అనే విషయాన్ని తేల్చదు.
theological_decisions:
- issue: ‘తన ప్రజల దగ్గరకు చేర్చబడ్డాడు’ అనే మరణసూత్రం యొక్క అర్థం
  choice: హీబ్రూ నుడికారాన్ని వ్యాఖ్యానాత్మకంగా విప్పకుండా అలాగే నిలుపడం
  alternative: తన పూర్వీకులతో సమాధి చేయబడ్డాడు / మరణానంతరం తన పూర్వీకులను చేరాడు
  rationale: ఈ మాట కుటుంబ సమాధిని, మరణించిన పూర్వీకులతో కలయికను, లేదా రెండింటినీ సూచించవచ్చు. మూలపాఠం ఈ అవకాశాల్లో ఒక్కదానినే నిర్బంధించనందున అనువాదం కూడా ఆ భావ ఉద్వేగాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనా గౌరవప్రదమైన మరణ ప్రకటన శైలిని వాడాం. ‘తుదిశ్వాస విడిచి చనిపోయాడు’ అనే క్రమం తెలుగులో కొంత పునరుక్తిలా అనిపించినా, మూలంలోని రెండు వేర్వేరు మరణక్రియలను ఉద్దేశపూర్వకంగా నిలుపుతుంది. ప్రతి పాదసూచిక గుర్తు సంబంధిత పదబంధం వెంట ఉంచబడింది.
