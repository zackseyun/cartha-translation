  text: וַ/יָּ֥זֶד יַעֲקֹ֖ב נָזִ֑יד וַ/יָּבֹ֥א עֵשָׂ֛ו מִן הַ/שָּׂדֶ֖ה וְ/ה֥וּא עָיֵֽף־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/029.yaml
  text: Jacob was cooking a stew[a], and Esau came in from the field[c][b], and he was exhausted.
translation:
  language: te
  text: యాకోబు ఒక కూర వండుతున్నాడు[a], ఏశావు పొలం నుండి వచ్చాడు; అతడు అలసిపోయి ఉన్నాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఒక కూరను ఉడకబెడుతున్నాడు.” ఇక్కడి హీబ్రూ క్రియ ప్రత్యేకంగా ఉడకబెట్టి వండడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “నీરસించి ఉన్నాడు” లేదా “అలసటతో ఉన్నాడు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּזֶד
  choice: వండుతున్నాడు
  rationale: זיד ఇక్కడ ఆహారాన్ని ఉడకబెట్టి సిద్ధం చేయడాన్ని సూచిస్తుంది. తెలుగు కథనంలో కొనసాగుతున్న చర్యను సహజంగా తెలియజేయడానికి ‘వండుతున్నాడు’ అని ఇచ్చాం; ఉడకబెట్టే నిర్దిష్ట భావాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: נָזִיד
  choice: ఒక కూర
  rationale: נָזִיד ఉడకబెట్టి చేసిన వంటకాన్ని, ముఖ్యంగా చిక్కని కూరలాంటి వంటకాన్ని సూచిస్తుంది. ఆధునిక సాధారణ తెలుగులో ‘కూర’ సహజంగా అర్థమవుతుంది; తరువాతి వచనంలో చెప్పే రంగు లేదా పదార్థాన్ని ఇక్కడ ముందుగానే చేర్చలేదు.
- source_word: וַיָּבֹא
  choice: వచ్చాడు
  rationale: בוא అంటే రావడం లేదా ప్రవేశించడం. ‘పొలం నుండి’ అనే పదబంధంతో కలిపినప్పుడు ‘వచ్చాడు’ తెలుగులో సహజంగా చేరికను తెలియజేస్తుంది.
- source_word: מִן הַשָּׂדֶה
  choice: పొలం నుండి
  rationale: שׂדה సాధారణంగా పొలం, బయలు లేదా బహిరంగ ప్రాంతాన్ని సూచిస్తుంది. మూలంలోని ఏకవచన స్థలచిత్రాన్ని నిలుపుతూ, సాధారణ తెలుగు పాఠకులకు స్పష్టంగా ఉండే ‘పొలం నుండి’ ఎంచుకున్నాం.
- source_word: וְהוּא עָיֵף
  choice: అతడు బాగా అలసిపోయి ఉన్నాడు
  rationale: ప్రత్యేక సర్వనామంతో కూడిన స్థితి వాక్యాన్ని స్పష్టంగా నిలిపాం. עָיֵף సాధారణ అలసటకన్నా తీవ్రమైన నీరసాన్ని కూడా సూచించగలదు కాబట్టి ‘బాగా అలసిపోయి’ అని ఇచ్చాం.
