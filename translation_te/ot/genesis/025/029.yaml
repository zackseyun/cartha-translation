translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని వాడాం. హీబ్రూ వాక్యాల వరుసను నిలుపుతూ, రెండవ చర్యకు ‘అప్పుడు’ అనే సహజ కథన అనుసంధానాన్ని ఉపయోగించాం. మూలంలో లేని పదార్థం, రంగు లేదా ధార్మిక వ్యాఖ్యానాన్ని చేర్చలేదు.
