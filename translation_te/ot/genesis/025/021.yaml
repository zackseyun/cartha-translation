id: GEN.25.21
reference: Genesis 25:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֶּעְתַּ֨ר יִצְחָ֤ק לַֽ/יהוָה֙ לְ/נֹ֣כַח אִשְׁתּ֔/וֹ כִּ֥י עֲקָרָ֖ה הִ֑וא וַ/יֵּעָ֤תֶר ל/וֹ֙ יְהוָ֔ה וַ/תַּ֖הַר רִבְקָ֥ה אִשְׁתּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/021.yaml
  text: And Isaac prayed to Yahweh for his wife[a], because she was barren. And Yahweh answered him[b], and Rebekah his wife conceived.
translation:
  language: te
  text: ఇస్సాకు తన భార్య కోసం[a] యెహోవాను వేడుకున్నాడు, ఎందుకంటే ఆమె వంధ్యురాలు. యెహోవా అతని మనవిని ఆలకించాడు[b], అతని భార్య రిబ్కా గర్భం దాల్చింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘తన భార్యకు ఎదురుగా’ అని కూడా అనువదించవచ్చు; ఇక్కడ తన భార్యను గూర్చి లేదా ఆమె పక్షంగా వేడుకున్నాడనే భావం ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: '‘వేడుకున్నాడు,’ ‘ఆలకించాడు’ అనే చోట్ల హీబ్రూలో ఒకే పదమూలం వేర్వేరు రూపాల్లో ఉంది: ఇస్సాకు వేడుకున్నాడు; యెహోవా అతని వేడుకోలుకు అనుకూలంగా స్పందించాడు.'
    reason: lexical_wordplay
lexical_decisions:
- source_word: וַיֶּעְתַּר / וַיֵּעָתֶר (עתר)
  choice: వేడుకున్నాడు / అతని వేడుకను ఆలకించాడు
  rationale: ఒకే హీబ్రూ ధాతువు రెండు రూపాల్లో ఉద్దేశపూర్వకంగా పునరావృతమైంది. తెలుగులో సహజంగా ఉండేలా, ఇస్సాకు చేసిన మనవిని మరియు యెహోవా దానికి అనుకూలంగా స్పందించడాన్ని ఈ జత వ్యక్తపరుస్తుంది; యాంత్రిక కారణత్వాన్ని సూచించదు.
- source_word: לַיהוָה / יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన יהוהను తెలుగులో స్థిరపడిన ప్రత్యక్ష లిప్యంతరీకరణ ‘యెహోవా’గా ఇచ్చాం.
- source_word: לְנֹכַח אִשְׁתּוֹ
  choice: తన భార్య కోసం
  rationale: לְנֹכַחకు అక్షరార్థంగా ‘ఎదురుగా’ అనే భావం ఉన్నప్పటికీ, ఇక్కడ ప్రార్థన సందర్భంలో భార్యను గూర్చి లేదా ఆమె పక్షంగా చేసిన మనవిని ‘కోసం’ సహజంగా తెలియజేస్తుంది. ప్రత్యామ్నాయ అర్థాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: עֲקָרָה
  choice: గొడ్రాలు
  rationale: గర్భం ధరించలేని స్త్రీని సూచించే సందర్భోచితమైన, బైబిలు కథనంలో స్థిరపడిన తెలుగు పదం.
- source_word: וַתַּהַר
  choice: గర్భవతి అయింది
  rationale: గర్భం ధరించిందనే భావాన్ని సాధారణ ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: רִבְקָה
  choice: రిబ్కా
  rationale: హీబ్రూ పేరుకు దగ్గరగా ఉండే, తెలుగులో ప్రాచుర్యంలో ఉన్న బైబిలు రూపం.
theological_decisions:
- issue: עתר ధాతువు పునరావృతం మరియు దేవుని ప్రతిస్పందన
  choice: ఇస్సాకు ‘వేడుకున్నాడు’; యెహోవా ‘అతని వేడుకను ఆలకించాడు’
  alternative: ‘ప్రార్థించాడు’; యెహోవా ‘అతనికి జవాబిచ్చాడు’ లేదా ‘అతనిచేత వేడుకోబడినవాడయ్యాడు’
  rationale: మూలంలోని పదబంధ సంబంధాన్ని సాధ్యమైనంతవరకు నిలుపుతూ, దేవుడు మనవికి అనుకూలంగా స్పందించాడనే భావాన్ని సహజ తెలుగులో ఇస్తుంది; ప్రార్థన దేవుణ్ణి యాంత్రికంగా బలవంతం చేసిందనే భావాన్ని చేర్చదు.
- issue: יהוה దైవనామం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: మూలంలో ఉన్న వ్యక్తిగత దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో సుపరిచితమైన ప్రత్యక్ష రూపంలో నిలిపాం.
- issue: לְנֹכַח యొక్క స్థానార్థక లేదా ప్రయోజనార్థక భావం
  choice: తన భార్య కోసం
  alternative: తన భార్యకు ఎదురుగా; తన భార్యను గూర్చి
  rationale: సందర్భానికి సరిపోయే ప్రయోజనార్థక భావాన్ని ప్రధాన పాఠ్యంలో ఎంచుకుని, నిజమైన స్థానార్థక అస్పష్టతను పాదటిప్పణిలో సంరక్షించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. ‘గొడ్రాలు’ బైబిలు సందర్భంలో స్థిరపడిన పదం; మిగతా వాక్య నిర్మాణం సాధారణ పాఠకులకు స్పష్టంగా ఉంచబడింది. అన్ని పాదటిప్పణి గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
