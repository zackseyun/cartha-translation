source:
  edition: WLC
  text: וְ/אֵ֛לֶּה תּוֹלְדֹ֥ת יִצְחָ֖ק בֶּן אַבְרָהָ֑ם אַבְרָהָ֖ם הוֹלִ֥יד אֶת יִצְחָֽק־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/019.yaml
  text: 'These are the generations of Isaac[a], son of Abraham: Abraham fathered Isaac.'
translation:
  language: te
  text: 'అబ్రాహాము కుమారుడైన ఇస్సాకు వంశవృత్తాంతం[a] ఇదే: అబ్రాహాము ఇస్సాకును కన్నాడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “తరాలు,” “వంశావళి.” హీబ్రూలోని తోలెదోత్ అనే పదం ఆదికాండంలో విభాగాలను ప్రారంభించే పునరావృత శీర్షిక పదం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: ఇదే
  rationale: కొత్త విభాగాన్ని పరిచయం చేసే హీబ్రూ సూత్రప్రయోగాన్ని సహజమైన తెలుగు శీర్షిక వాక్యంగా అందిస్తుంది; ו యొక్క అనుసంధాన భావాన్ని సందర్భానికే వదిలి, లేని కాలార్థాన్ని చేర్చదు.
- source_word: תּוֹלְדֹת
  choice: వంశవృత్తాంతం
  rationale: ఆ వ్యక్తి నుండి కొనసాగిన వంశం మరియు దానికి సంబంధించిన కథనం రెండింటినీ సూచించగల ఆదికాండంలోని పునరావృత నిర్మాణ పదానికి ఇది విస్తృతమైన, గౌరవప్రదమైన తెలుగు సమానం.
- source_word: יִצְחָק בֶּן אַבְרָהָם
  choice: అబ్రాహాము కుమారుడైన ఇస్సాకు
  rationale: వంశపరమైన గుర్తింపును స్పష్టంగా ఉంచుతూ తెలుగులో సహజమైన పదక్రమాన్ని అనుసరిస్తుంది.
- source_word: אַבְרָהָם הוֹלִיד אֶת יִצְחָק
  choice: అబ్రాహాము ఇస్సాకును కన్నాడు
  rationale: ילד హిఫిల్ రూపంలోని ‘కనడం/తండ్రి కావడం’ అనే వంశావళి భావాన్ని సంక్షిప్తంగా, సాధారణ ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ఆదికాండంలోని תולדות సూత్రపదం
  choice: వంశవృత్తాంతం
  alternative: తరాలు; వంశావళి; చరిత్ర
  rationale: ఈ పదం కేవలం సంతాన జాబితానో, కేవలం జీవితచరిత్రనో మాత్రమే సూచిస్తుందని నిర్ణయించకుండా, వంశపరంపరతో పాటు తదనంతర కథనాన్ని పరిచయం చేసే దాని సాహిత్యపరమైన విస్తృతిని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘ఇస్సాకు,’ ‘అబ్రాహాము’ అనే తెలుగు బైబిలు సంప్రదాయ నామరూపాలను ఉంచాం. ప్రధాన పాఠంలోని [a] సూచిక సంబంధిత పాదటిప్పణితో సరిపోతుంది.
