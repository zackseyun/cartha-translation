translation:
  language: te
  text: యాకోబు, “ఈ రోజే[a] నీ జ్యేష్ఠత్వపు హక్కును నాకు అమ్ము” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఈ రోజు నుంచే నీ జ్యేష్ఠత్వపు హక్కును నాకు అమ్ము” లేదా “ఈ రోజున నీ జ్యేష్ఠత్వపు హక్కును నాకు అమ్ము.” ఈ పదబంధం వెంటనే అమలులోకి వచ్చే, కట్టుబాటుతో కూడిన లావాదేవీని నొక్కిచెప్పవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అన్నాడు
  rationale: వావ్-కన్సిక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది. ఆధునిక తెలుగులో ‘అన్నాడు’ సహజంగా భూతకాల కథన భావాన్ని తెలియజేస్తుంది.
- source_word: יַעֲקֹב
  choice: యాకోబు
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగులో స్థిరపడిన లిప్యంతరీకరణను ఉపయోగించాం.
- source_word: מִכְרָה
  choice: అమ్ము
  rationale: מכר క్రియ యొక్క ఆజ్ఞార్థక రూపం; సందర్భంలో నేరుగా, సహజంగా ఉన్న తెలుగు సమానార్థకం ‘అమ్ము’.
- source_word: כַיּוֹם
  choice: ఈ రోజే
  rationale: ఈ పదబంధం ‘ఈ రోజు’ లేదా ‘ఈ రోజు నుంచే/ఈ రోజుతో’ అనే భావాలను ఇవ్వగలదు. తక్షణం జరిగే, బంధకమైన లావాదేవీపై ఉన్న నొక్కును ‘ఈ రోజే’ సహజంగా వ్యక్తపరుస్తుంది; ప్రత్యామ్నాయ సూక్ష్మభావం పాదసూచికలో ఉంచబడింది.
- source_word: אֶת
  choice: '[ప్రత్యక్ష కర్మ సూచిక; అనువదించలేదు]'
  rationale: אֶת నిర్దిష్ట ప్రత్యక్ష కర్మను సూచించే వ్యాకరణ చిహ్నం; తెలుగులో దీనికి విడిగా పదం అవసరం లేదు.
- source_word: בְּכֹרָתְךָ
  choice: నీ జ్యేష్ఠత్వపు హక్కు
  rationale: בְּכֹרָה మొదట పుట్టిన కుమారునికి కలిగే హోదా, హక్కులు, ప్రత్యేకాధికారాలను సూచిస్తుంది. ‘జ్యేష్ఠత్వపు హక్కు’ ఈ భావాన్ని స్పష్టంగా, గౌరవప్రదమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: לִי
  choice: నాకు
  rationale: ‘అమ్ము’ అనే క్రియతో לִי లబ్ధిదారు/గ్రహీతను సూచిస్తుంది; తెలుగులో ‘నాకు’ సహజమైన సమానార్థకం.
