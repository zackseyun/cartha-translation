  text: וַ/יֵּצֵ֤א הָ/רִאשׁוֹן֙ אַדְמוֹנִ֔י כֻּלּ֖/וֹ כְּ/אַדֶּ֣רֶת שֵׂעָ֑ר וַ/יִּקְרְא֥וּ שְׁמ֖/וֹ עֵשָֽׂו׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/025.yaml
  text: The first came out reddish[a], all of him like a hairy cloak[c][b], and they called his name Esau.
translation:
  language: te
  text: మొదటివాడు ఎర్రని ఛాయతో[a] బయటికి వచ్చాడు. అతని శరీరమంతా వెంట్రుకల పైవస్త్రంలా[b] ఉంది. వారు అతని పేరు ఏశావు అని పెట్టారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఎర్రగా’ లేదా ‘ఎరుపు వర్ణంతో.’ హీబ్రూ విశేషణం ఎర్రని రూపాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా ‘వెంట్రుకల వస్త్రంలా’ లేదా ‘వెంట్రుకల అంగవస్త్రంలా.’ హీబ్రూలో పైవస్త్రం, వెంట్రుకలు అనే పదాలతో ఉపమానం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: బయటికి వచ్చాడు
  rationale: ప్రసవంలో శిశువు బయటికి రావడాన్ని తెలిపే సాధారణ హీబ్రూ క్రియను సహజమైన ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: הָרִאשׁוֹן
  choice: మొదటివాడు
  rationale: కవలల్లో ముందుగా జన్మించినవాడిని సంక్షిప్తంగా, సహజంగా సూచిస్తుంది.
- source_word: אַדְמוֹנִי
  choice: ఎర్రని ఛాయతో
  rationale: ఎరుపు కలిసిన శరీర వర్ణం లేదా రూపాన్ని సూచించే విశేషణ భావాన్ని కాపాడుతుంది; కేవలం ‘ఎర్రగా’ అని చెప్పడం కంటే సహజంగా ఉంటుంది.
- source_word: כֻּלּוֹ
  choice: అతని శరీరమంతా
  rationale: వర్ణన అతని దేహమంతటికీ వర్తిస్తుందనే భావాన్ని తెలుగులో స్పష్టపరుస్తుంది.
- source_word: כְּאַדֶּרֶת שֵׂעָר
  choice: వెంట్రుకల అంగవస్త్రంలా
  rationale: ‘వెంట్రుకలతో కప్పబడి’ అని వివరణాత్మకంగా మార్చకుండా, అంగవస్త్రం/పైవస్త్రంతో చేసిన హీబ్రూ ఉపమానాన్ని నిలుపుతుంది.
- source_word: וַיִּקְרְאוּ שְׁמוֹ
  choice: వారు అతనికి ... అని పేరు పెట్టారు
  rationale: హీబ్రూ నామకరణ సూత్రానికి సహజమైన ఆధునిక తెలుగు సమానం.
- source_word: עֵשָׂו
  choice: ఏశావు
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపాన్ని అనుసరిస్తుంది.
theological_decisions:
- issue: శిశువు రూపవర్ణనకు కారణార్థక అనుసంధానం
  choice: ‘అందువల్ల’ అని చేర్చడం
  alternative: కేవలం ‘వారు అతనికి ఏశావు అని పేరు పెట్టారు’ అని సముచ్చయంగా ఉంచడం
  rationale: సందర్భంలో రూపవర్ణన తర్వాత నామకరణం వస్తున్నప్పటికీ, హీబ్రూ వచనంలో కారణార్థకం ప్రత్యక్షంగా లేదు; అందువల్ల ఈ అనుసంధానం మూలాన్ని మించిన వ్యాఖ్యానంగా మారే అవకాశం ఉంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన శైలి. హీబ్రూ ఉపమానాన్ని నిలుపుతూ సాధారణ పాఠకునికి అర్థమయ్యే పదజాలం వాడబడింది.
