  text: అబ్రాహాము తనకు ఉన్నదంతా ఇస్సాకుకు ఇచ్చాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, ‘తనదైనదంతా.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: ఇచ్చాడు
  rationale: נתן అనే క్రియకు ప్రాథమిక అర్థం ‘ఇవ్వడం.’ కథనంలోని wayyiqtol రూపాన్ని సహజమైన తెలుగు భూతకాలంతో అనువదించాం.
- source_word: אַבְרָהָם
  choice: అబ్రాహాము
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: אֶת
  choice: '[విడిగా అనువదించలేదు]'
  rationale: ఇది ప్రత్యక్ష కర్మను సూచించే వ్యాకరణ చిహ్నం; తెలుగు వాక్య నిర్మాణంలో దాని పని అంతర్భూతమైంది.
- source_word: כָּל אֲשֶׁר לוֹ
  choice: తనకు ఉన్నదంతా
  rationale: ఈ పదబంధానికి అక్షరార్థంగా ‘అతనికి చెందినదంతా’ అనే భావం ఉంది. ‘తనకు ఉన్నదంతా’ ఆధునిక తెలుగులో సహజంగా ఉండి, అతని ఆస్తి మొత్తాన్ని సూచిస్తుంది.
- source_word: לְיִצְחָק
  choice: ఇస్సాకుకు
  rationale: לְ ఇక్కడ స్వీకర్తను సూచిస్తుంది; తెలుగు సంప్రదాన విభక్తి దానిని స్పష్టంగా వ్యక్తం చేస్తుంది.
