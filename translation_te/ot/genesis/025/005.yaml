translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, సంక్షిప్తమైన కథన శైలిని ఉపయోగించాం. మూలంలోని సంపూర్ణత భావాన్ని ‘అంతా’ ద్వారా నిలిపాం.
