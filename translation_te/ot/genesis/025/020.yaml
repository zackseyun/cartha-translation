source:
  edition: WLC
  text: וַ/יְהִ֤י יִצְחָק֙ בֶּן אַרְבָּעִ֣ים שָׁנָ֔ה בְּ/קַחְתּ֣/וֹ אֶת רִבְקָ֗ה בַּת בְּתוּאֵל֙ הָֽ/אֲרַמִּ֔י מִ/פַּדַּ֖ן אֲרָ֑ם אֲח֛וֹת לָבָ֥ן הָ/אֲרַמִּ֖י ל֥/וֹ לְ/אִשָּֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/020.yaml
  text: Isaac was forty years old when he took Rebekah[a], the daughter of Bethuel the Aramean from Paddan-aram, the sister of Laban the Aramean[b], to be his wife.
translation:
  language: te
  text: ఇస్సాకు నలభై సంవత్సరాల వయసులో ఉన్నప్పుడు, పద్దన్-అరాము నుండి వచ్చిన అరామీయుడైన బెతూయేలు కుమార్తె, అరామీయుడైన లాబాను[b] సోదరి అయిన రిబ్కాను తన భార్యగా తీసుకున్నాడు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత నుడికారంగా, ‘రిబ్కాను పెళ్లి చేసుకున్నాడు’ అని అనువదించవచ్చు. హీబ్రూలో అక్షరార్థంగా ‘రిబ్కాను తన భార్యగా తీసుకున్నాడు’ అని ఉంది.
    reason: lexical_alternative
  - marker: b
    text: ‘అరామీయుడు’ అనేది పాత సంప్రదాయ అనువాదమైన ‘సిరియనుడు’ కంటే హీబ్రూ జాతి సూచక పదానికి మరింత ఖచ్చితమైన రూపం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי יִצְחָק בֶּן אַרְבָּעִים שָׁנָה
  choice: ఇస్సాకు నలభై ఏళ్ల వయసులో
  rationale: హీబ్రూ వయస్సు-సూచక నుడికారాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది; వివాహం జరిగిన సమయాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: בְּקַחְתּוֹ ... לוֹ לְאִשָּׁה
  choice: తన భార్యగా తీసుకున్నాడు
  rationale: לקח అనే క్రియలోని ‘తీసుకొను’ భావాన్నీ, לוֹ לְאִשָּׁה అనే వివాహ సూత్రంలోని ‘తన భార్యగా’ భావాన్నీ నిలుపుతుంది.
- source_word: רִבְקָה
  choice: రిబ్కా
  rationale: హీబ్రూ వ్యక్తినామానికి సమీపంగా ఉండే, తెలుగులో సులభంగా చదవగల లిప్యంతరీకరణ.
- source_word: בַּת בְּתוּאֵל
  choice: బెతూయేలు కుమార్తె
  rationale: మూలంలోని వంశసంబంధ సూచనను నేరుగా, సహజంగా అందిస్తుంది.
- source_word: הָאֲרַמִּי
  choice: అరామీయుడు
  rationale: అֲרַמִּי అనే జాతి సూచక పదానికి చారిత్రకంగా ఖచ్చితమైన సమానం; పాత సంప్రదాయంలోని ‘సిరియనుడు’ కంటే మూలభాషకు దగ్గరగా ఉంటుంది.
- source_word: מִפַּדַּן אֲרָם
  choice: పద్దన్-అరాముకు చెందిన
  rationale: స్థలనామాన్ని అనువదించకుండా లిప్యంతరీకరించి, מִן సూచించే Herkunft భావాన్ని ‘చెందిన’తో సహజంగా తెలియజేస్తుంది.
- source_word: אֲחוֹת לָבָן
  choice: లాబాను సోదరి
  rationale: మూలంలోని కుటుంబ సంబంధాన్ని స్పష్టమైన ఆధునిక తెలుగులో నిలుపుతుంది.
