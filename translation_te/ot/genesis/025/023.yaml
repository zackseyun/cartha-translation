- from: 'యాహ్వే ఆమెతో ఇలా అన్నాడు: “రెండు జాతులు నీ గర్భంలో ఉన్నాయి; రెండు ప్రజలు నీ అంతరాళం నుంచే వేరుపడతారు. ఒక ప్రజ మరొక ప్రజకంటే బలంగా ఉంటుంది; పెద్దవాడు చిన్నవానికి సేవ చేస్తాడు[a].”'
  to: 'యాహ్వే ఆమెతో ఇలా అన్నాడు: “రెండు జాతులు నీ గర్భంలో ఉన్నాయి; రెండు ప్రజాసమూహాలు నీ లోపలినుండి వేరుపడతాయి. ఒక ప్రజాసమూహం మరొకదానికంటే బలంగా ఉంటుంది; పెద్దవాడు చిన్నవానికి సేవ చేస్తాడు[a].”'
