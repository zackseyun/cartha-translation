id: GEN.25.23
reference: Genesis 25:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה לָ֗/הּ שְׁנֵ֤י גיים בְּ/בִטְנֵ֔/ךְ וּ/שְׁנֵ֣י לְאֻמִּ֔ים מִ/מֵּעַ֖יִ/ךְ יִפָּרֵ֑דוּ וּ/לְאֹם֙ מִ/לְאֹ֣ם יֶֽאֱמָ֔ץ וְ/רַ֖ב יַעֲבֹ֥ד צָעִֽיר׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/023.yaml
  text: And Yahweh said to her[a], “Two nations are in your womb, and two peoples will be separated from within you; and one people will be stronger than the other[b], and the older will serve the younger.”
translation:
  language: te
  text: 'యాహ్వే ఆమెతో ఇలా అన్నాడు: “రెండు జాతులు నీ గర్భంలో ఉన్నాయి; రెండు ప్రజాసమూహాలు నీ లోపలినుండి వేరుపడతాయి. ఒక ప్రజాసమూహం మరొకదానికంటే బలంగా ఉంటుంది; పెద్దవాడు చిన్నవానికి సేవ చేస్తాడు[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “గొప్పవాడు చిన్నవానికి సేవ చేస్తాడు.”
    reason: రַב మరియు צָעִיר పదాలు సందర్భంలో పెద్దవాడు/చిన్నవాడు అనే అర్థాన్ని ఇస్తాయి; అయితే రַבకు గొప్పవాడు అనే అర్థమూ సాధ్యమే.
lexical_decisions:
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగులో దాని ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించాం.
- source_word: שְׁנֵי גיים
  choice: రెండు జాతులు
  rationale: גוי ఇక్కడ రాజకీయ-జాతిపరమైన ప్రజాసమూహాలను సూచిస్తుంది; తరువాతి సమాంతర పదమైన לְאֻמִּים నుంచి భేదాన్ని నిలుపుతుంది.
- source_word: בְּבִטְנֵךְ
  choice: నీ గర్భంలో
  rationale: గర్భధారణ సందర్భంలో בטןకు సహజమైన, స్పష్టమైన తెలుగు పదం ‘గర్భం’.
- source_word: שְׁנֵי לְאֻמִּים
  choice: రెండు ప్రజలు
  rationale: לְאֹם ప్రజాసమూహాన్ని సూచిస్తుంది; ‘ప్రజలు’ అనే పదం మొదటి పాదంలోని ‘జాతులు’తో సమాంతరతను, స్వల్ప పదభేదాన్ని కాపాడుతుంది.
- source_word: מִמֵּעַיִךְ יִפָּרֵדוּ
  choice: నీ అంతరాళం నుంచే వేరుపడతారు
  rationale: מֵעַיִם యొక్క ‘అంతర్భాగాలు’ అనే భావాన్ని నిలుపుతూ, יִפָּרֵדוּ యొక్క నిఫల్ రూపంలోని విడిపోవడం/వేరుపడడం భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וּלְאֹם מִלְאֹם יֶאֱמָץ
  choice: ఒక ప్రజ మరొక ప్రజకంటే బలంగా ఉంటుంది
  rationale: హీబ్రూ వాక్యంలోని రెండు ప్రజాసమూహాల తులనాత్మక బలసంబంధాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: וְרַב יַעֲבֹד צָעִיר
  choice: పెద్దవాడు చిన్నవానికి సేవ చేస్తాడు
  rationale: కవలల సందర్భంలో רַב మరియు צָעִירలను వయస్సు ఆధారమైన ‘పెద్దవాడు/చిన్నవాడు’గా చదవడం సహజం; עבד యొక్క విస్తృత ‘సేవచేయు’ భావాన్ని నిలిపాం.
theological_decisions:
- issue: וְרַב יַעֲבֹד צָעִיר లోని רַב / צָעִיר అర్థం
  choice: పెద్దవాడు చిన్నవానికి సేవ చేస్తాడు
  alternative: గొప్పవాడు అల్పునికి సేవ చేస్తాడు
  rationale: గర్భంలోని కవలల సందర్భం వయస్సు-క్రమ భావాన్ని బలపరుస్తుంది. అయితే హీబ్రూ విశేషణాలు స్థాయి లేదా గొప్పతనం/అల్పత్వాన్ని కూడా సూచించగలవు కాబట్టి ఆ సాధ్యమైన అర్థాన్ని పాదటిప్పణిలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయినా ప్రవచన వాక్యానికి తగిన గంభీరతతో రూపొందించబడింది. సమాంతర కవితా నిర్మాణాన్ని ‘జాతులు/ప్రజలు’ అనే పదజంటతో నిలిపాం.
