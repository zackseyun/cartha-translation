  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֲדַד
  choice: హదదు
  rationale: వంశావళిలోని వ్యక్తి పేరు; అర్థానువాదం చేయకుండా హీబ్రూ వ్యంజనరూపానికి దగ్గరగా తెలుగులో లిప్యంతరీకరించబడింది.
- source_word: תֵימָא
  choice: తేమా
  rationale: వ్యక్తి/గోత్ర సంబంధిత పేరు; హీబ్రూ ఉచ్చారణకు దగ్గరగా సహజమైన తెలుగు రూపం ఎంచుకోబడింది.
- source_word: יְטוּר
  choice: యెతూరు
  rationale: వ్యక్తి పేరు; ఆరంభ యోద్‌ను 'యె'గా, దీర్ఘ స్వరాన్ని 'ూ'తో ప్రతిబింబించే తెలుగు లిప్యంతరీకరణ.
- source_word: נָפִישׁ
  choice: నాఫీషు
  rationale: వ్యక్తి పేరు; హీబ్రూ దీర్ఘ స్వరాలు, చివరి ష్ ధ్వనిని తెలుగులో పలకడానికి అనుకూలంగా లిప్యంతరీకరించబడింది.
- source_word: קֵדְמָה
  choice: కేదెమా
  rationale: వ్యక్తి పేరు; క్వోఫ్‌ను సాధారణ తెలుగు బైబిలు నామరూపాలకు అనుగుణంగా 'క'తో, మిగిలిన ధ్వనులను మూలానికి దగ్గరగా అందించింది.
- source_word: וְ / וָ
  choice: జాబితా విరామచిహ్నాలు
  rationale: హీబ్రూలో ప్రతి పేరును కలిపే సంధికారకాన్ని తెలుగులో సహజమైన జాబితా శైలికి అనుగుణంగా కామాలతో వ్యక్తపరిచాం; చివరి పేరుకు ముందు ప్రత్యేకంగా 'మరియు' చేర్చకపోయినా అనుసంధానం స్పష్టంగా ఉంటుంది.
