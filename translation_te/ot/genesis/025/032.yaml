id: GEN.25.32
reference: Genesis 25:32
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר עֵשָׂ֔ו הִנֵּ֛ה אָנֹכִ֥י הוֹלֵ֖ךְ לָ/מ֑וּת וְ/לָ/מָּה זֶּ֥ה לִ֖/י בְּכֹרָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/032.yaml
  text: Esau said[a], “Look, I am about to die; so what use is this birthright to me?”
translation:
  language: te
  text: అప్పుడు ఏశావు, “చూడు, నేను చనిపోబోతున్నాను; అలాంటప్పుడు ఈ జ్యేష్ఠత్వపు హక్కు నాకు ఎందుకు?” అన్నాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నేను చనిపోవడానికి వెళ్తున్నాను; ఈ జ్యేష్ఠత్వపు హక్కు నాకు ఎందుకు?”
    reason: הלך + למות అనే హీబ్రూ పదబంధానికి మరింత అక్షరార్థమైన ప్రత్యామ్నాయాన్ని చూపిస్తుంది.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు … అన్నాడు
  rationale: హీబ్రూ కథనంలోని wayyiqtol రూపాన్ని సహజమైన తెలుగు కథన శైలిలో ‘అప్పుడు … అన్నాడు’గా వ్యక్తం చేశాం.
- source_word: עֵשָׂו
  choice: ఏశావు
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగులో స్థిరపడిన లిప్యంతరీకరణ.
- source_word: הִנֵּה
  choice: చూడు
  rationale: తాను చెప్పబోయే మాటపై దృష్టి నిలిపే హీబ్రూ ఉద్ఘాటనను ఆధునిక, సహజ తెలుగులో నిలుపుతుంది.
- source_word: אָנֹכִי
  choice: నేను
  rationale: స్వతంత్ర ప్రథమ పురుష సర్వనామంలోని వ్యక్తిగత ఉద్ఘాటనను సందర్భంలో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: הוֹלֵךְ לָמוּת
  choice: చనిపోబోతున్నాను
  rationale: הלך + ధాతురూపం ఇక్కడ అక్షరార్థ ప్రయాణం కాక, మరణం సమీపించిందనే వక్త భావాన్ని సూచిస్తుంది.
- source_word: וְלָמָּה זֶּה לִי
  choice: అలాంటప్పుడు … నాకు ఎందుకు?
  rationale: ఏశావు ముందటి వాదన నుంచి తీసుకున్న అలంకారప్రశ్నాత్మక ముగింపును సహజ తెలుగులో తెలియజేస్తూ, హీబ్రూలోని ‘ఎందుకు/నాకు’ నిర్మాణాన్ని కాపాడుతుంది.
- source_word: בְּכֹרָה
  choice: జ్యేష్ఠత్వపు హక్కు
  rationale: మొదట పుట్టిన కుమారుని స్థానం, దానికి సంబంధించిన హక్కులు అనే సామాజిక-న్యాయ భావాన్ని సాధారణ పాఠకునికి స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: తాను చనిపోబోతున్నానని ఏశావు చెప్పిన మాట యొక్క భావం
  choice: ఏశావు తన మరణం సమీపించిందని చెప్పినట్లుగానే అనువదించాం; అది అక్షరార్థమా అతిశయోక్తా అని నిర్ణయించలేదు.
  alternative: అతడు నిజంగా మరణానికి అతి సమీపంలో ఉన్నాడు; లేదా తీవ్రమైన ఆకలివల్ల అతిశయోక్తిగా మాట్లాడాడు.
  rationale: హీబ్రూ వాక్యం అతడు ‘చనిపోవడానికి వెళ్తున్నాను/చనిపోబోతున్నాను’ అని చెప్పాడనే విషయమే తెలుపుతుంది. కథనంలోని నైతిక, ధార్మిక ఉద్రిక్తతను అనువాదం స్వయంగా పరిష్కరించకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైనా సాధారణ పాఠకునికి సులభంగా అర్థమయ్యే సంభాషణ శైలి. ‘జ్యేష్ఠత్వపు హక్కు’ అనే పదబంధం చట్టపరమైన, కుటుంబపరమైన భావాన్ని స్పష్టంగా నిలుపుతుంది.
