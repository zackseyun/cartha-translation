source:
  edition: WLC
  text: וַ/יְהִ֗י אַחֲרֵי֙ מ֣וֹת אַבְרָהָ֔ם וַ/יְבָ֥רֶךְ אֱלֹהִ֖ים אֶת יִצְחָ֣ק בְּנ֑/וֹ וַ/יֵּ֣שֶׁב יִצְחָ֔ק עִם בְּאֵ֥ר לַחַ֖י רֹאִֽי־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/011.yaml
  text: And it happened after Abraham’s death that God blessed Isaac his son[a], and Isaac lived by Beer-lahai-roi.
translation:
  language: te
  text: 'అబ్రాహాము చనిపోయిన తరువాత ఇలా జరిగింది: దేవుడు అతని కుమారుడైన ఇస్సాకును ఆశీర్వదించాడు. ఇస్సాకు బెయేర్-లహయ్-రోయి[a] దగ్గర నివసించాడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: బెయేర్-లహయ్-రోయి అనేది ఒక బావి పేరు; ఈ హీబ్రూ పేరు ఆదికాండము 16:14లో ముందుగా పరిచయం చేయబడింది.
    reason: cross_reference
lexical_decisions:
- source_word: וַיְהִי
  choice: ఇలా జరిగింది
  rationale: హీబ్రూ కథన ప్రవాహంలో తదుపరి పరిణామాన్ని పరిచయం చేసే రూపం; ఆధునిక తెలుగులో సహజంగా ఉండేలా, దాని కథన స్వభావాన్ని నిలుపుతుంది.
- source_word: אַחֲרֵי מוֹת אַבְרָהָם
  choice: అబ్రాహాము చనిపోయిన తరువాత
  rationale: కాలసంబంధ అర్థాన్ని స్పష్టంగా, సాధారణ ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: וַיְבָרֶךְ אֱלֹהִים
  choice: దేవుడు ... ఆశీర్వదించాడు
  rationale: ברך యొక్క ప్రత్యక్ష అర్థమైన ‘ఆశీర్వదించు’ను, אֱלֹהִיםకు సహజమైన ‘దేవుడు’ను ఉపయోగిస్తుంది.
- source_word: אֶת יִצְחָק בְּנוֹ
  choice: అతని కుమారుడైన ఇస్సాకును
  rationale: ఇస్సాకు అబ్రాహాము కుమారుడని తెలిపే మూలపాఠంలోని సంబంధాన్ని స్పష్టంగా ఉంచుతుంది; ముందున్న అబ్రాహామునే ‘అతని’ సూచిస్తుంది.
- source_word: וַיֵּשֶׁב
  choice: నివసించాడు
  rationale: ఈ కథన సారాంశంలో ישב తెలిపే స్థిర నివాస భావానికి సహజమైన, గౌరవప్రదమైన ఆధునిక తెలుగు పదం.
- source_word: עִם
  choice: దగ్గర
  rationale: స్థలనామం ముందు ఇక్కడ ఇది సామీప్యాన్ని సూచిస్తుంది; తెలుగులో ‘తో’ అని అనడం తప్పుదారి పట్టించగలదు.
- source_word: בְּאֵר לַחַי רֹאִי
  choice: బెయేర్-లహయ్-రోయి
  rationale: ఇది ముందే పరిచయమైన స్థలనామం కావడంతో అర్థానువాదం చేయకుండా హీబ్రూ ఉచ్చారణకు సమీపంగా లిప్యంతరీకరించబడింది.
theological_decisions:
- issue: కథన సందర్భంలో אֱלֹהִים అనువాదం
  choice: దేవుడు
  alternative: దైవం
  rationale: ఇక్కడ ఇస్సాకును ఆశీర్వదించే ఏకైక దేవుణ్ణి సాధారణ కథనరీతిలో సూచిస్తోంది; ‘దేవుడు’ అత్యంత స్పష్టమైన, సహజమైన తెలుగు రూపం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే సహజమైన, గౌరవప్రదమైన కథనశైలి. మూలపాఠంలోని రెండు ప్రధాన క్రియలను రెండు వాక్యాలుగా ఇచ్చి పఠనసౌలభ్యాన్ని పెంచాం; కథన అనుసంధానాన్ని ‘ఇలా జరిగింది’తో నిలిపాం.
