source:
  edition: WLC
  text: וְ/אֵ֗לֶּה שְׁמוֹת֙ בְּנֵ֣י יִשְׁמָעֵ֔אל בִּ/שְׁמֹתָ֖/ם לְ/תוֹלְדֹתָ֑/ם בְּכֹ֤ר יִשְׁמָעֵאל֙ נְבָיֹ֔ת וְ/קֵדָ֥ר וְ/אַדְבְּאֵ֖ל וּ/מִבְשָֽׂם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/013.yaml
  text: 'And these are the names of the sons of Ishmael[a], by their names according to their generations: the firstborn of Ishmael was Nebaioth, and Kedar, and Adbeel, and Mibsam.'
translation:
  language: te
  text: 'ఇష్మాయేలు కుమారుల పేర్లు, వారి పేర్ల ప్రకారం, వారి వంశపరంపరల ప్రకారం[a] ఇవి: ఇష్మాయేలు జ్యేష్ఠుడు నెబాయోతు; కేదారు, అద్బెయేలు, మిబ్శాము.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారి తరతరాల ప్రకారం.” ఇక్కడి హీబ్రూ పదం వంశపారంపర్య సంతతి వరుసలను సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: ఇవే
  rationale: హీబ్రూ జాబితా పరిచయ సూత్రాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది; వాక్య నిర్మాణంలో అనవసరమైన ‘మరియు’ను ముందుంచకుండా సంధి భావాన్ని కొనసాగిస్తుంది.
- source_word: שְׁמוֹת בְּנֵי יִשְׁמָעֵאל
  choice: ఇష్మాయేలు కుమారుల పేర్లు
  rationale: మూలంలోని సంబంధ నిర్మాణాన్ని స్పష్టమైన, సహజమైన తెలుగు రూపంలో నిలుపుతుంది.
- source_word: בִּשְׁמֹתָם
  choice: వారి పేర్ల ప్రకారం
  rationale: మూలంలోని పేర్ల ప్రస్తావనను విడిచిపెట్టకుండా, వంశావళి సూత్రంలోని పునరుక్తిని సంరక్షిస్తుంది.
- source_word: לְתוֹלְדֹתָם
  choice: వారి వంశావళుల వారీగా
  rationale: తోలెదోత్ అనే పదం ఇక్కడ తరతరాల సంతతి వరుసలను సూచిస్తుంది; ‘వంశావళులు’ ఆ వంశపారంపర్య భావాన్ని ఆధునిక తెలుగులో స్పష్టంగా అందిస్తుంది.
- source_word: בְּכֹר יִשְׁמָעֵאל
  choice: ఇష్మాయేలు మొదటి కుమారుడు
  rationale: ‘మొదట పుట్టినవాడు’ అనే భావాన్ని సాధారణ పాఠకునికి సహజంగా తెలియజేస్తూ నెబాయోతు స్థానాన్ని స్పష్టం చేస్తుంది.
- source_word: נְבָיֹת
  choice: నెబాయోతు
  rationale: హీబ్రూ వ్యక్తినామానికి దగ్గరగా ఉండే తెలుగు లిప్యంతరీకరణ.
- source_word: קֵדָר
  choice: కేదారు
  rationale: హీబ్రూ వ్యక్తినామానికి దగ్గరగా ఉండే తెలుగు లిప్యంతరీకరణ.
- source_word: אַדְבְּאֵל
  choice: అద్బెయేలు
  rationale: హీబ్రూ వ్యంజన నిర్మాణాన్ని గుర్తించగలిగే విధంగా తెలిపే తెలుగు లిప్యంతరీకరణ.
- source_word: מִבְשָׂם
  choice: మిబ్శాము
  rationale: హీబ్రూ వ్యక్తినామానికి దగ్గరగా ఉండే తెలుగు లిప్యంతరీకరణ.
