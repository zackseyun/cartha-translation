  yaml_path: translation/ot/genesis/025/008.yaml
  text: And Abraham breathed his last and died in a good old age[a], old and full[b], and he was gathered to his people.
translation:
  language: te
  text: అబ్రాహాము మంచి వృద్ధాప్యంలో, వృద్ధుడై, తృప్తి చెంది[a], తుదిశ్వాస విడిచి చనిపోయాడు. అతడు తన ప్రజలవద్దకు చేర్చబడ్డాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పదానికి ‘నిండిన,’ ‘తృప్తి చెందిన’ అనే అర్థాలు రావచ్చు. సందర్భంలో ఇది జీవితం సంపూర్ణతకు వచ్చిన భావాన్ని సూచించవచ్చు; అయితే మూలంలో ‘జీవితం’ లేదా ‘రోజులు’ అనే పదం లేదు.
    reason: lexical_alternative
  - marker: b
    text: ‘తన ప్రజలవద్దకు చేర్చబడ్డాడు’ అనేది మరణాన్ని తెలిపే సంప్రదాయ హీబ్రూ నుడికారం. మరణించిన తనవారితో కలయికను ఇది సూచించవచ్చు; అయితే అది ఎలా జరుగుతుందో ఈ మాటలే నిర్దిష్టంగా చెప్పవు.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּגְוַע
  choice: తుదిశ్వాస విడిచి
  rationale: మరణవార్తల్లో גוע ప్రాణం విడవడం లేదా చివరి శ్వాస విడవడం అనే భావాన్ని ఇస్తుంది. తరువాత వచ్చే ‘చనిపోయాడు’ అనే మాటతో కలిపివేయకుండా, మూలంలోని రెండు క్రియలనూ సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: וַיָּמָת
  choice: చనిపోయాడు
  rationale: מות మరణాన్ని సూచించే సాధారణ, ప్రత్యక్ష క్రియ. అసలు వాక్యంలోని స్పష్టతను మృదూకరించకుండా తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: בְּשֵׂיבָה טוֹבָה
  choice: మంచి వృద్ధాప్యంలో
  rationale: שֵׂיבָה వృద్ధాప్యాన్ని, טוֹבָה దాని మంచి లేదా అనుకూల స్వభావాన్ని సూచిస్తాయి. ఈ పదబంధం మరణించినప్పటి స్థితిని తెలియజేస్తుంది.
- source_word: זָקֵן
  choice: వృద్ధుడై
  rationale: ‘వృద్ధుడు/ముసలివాడు’ అనే ప్రత్యక్ష భావాన్ని నిలుపుతూ, ముందున్న ‘వృద్ధాప్యంలో’ అనే పదబంధాన్ని మూలంలాగే మరొకసారి బలపరుస్తుంది.
- source_word: וְשָׂבֵעַ
  choice: జీవితంతో తృప్తి చెంది
  rationale: שָׂבֵעַ యొక్క ప్రాథమిక భావం ‘నిండిన, తృప్తి చెందిన’. సందర్భం జీవితాంతం కాబట్టి తెలుగులో అవసరమైన భావపూరక పదంగా ‘జీవితంతో’ వాడబడింది; అయితే మూలంలో ‘రోజులు’ లేదా ‘జీవితం’ అనే పదం స్పష్టంగా లేదని పాదసూచిక తెలియజేస్తుంది.
- source_word: וַיֵּאָסֶף אֶל־עַמָּיו
  choice: అతడు తన ప్రజలవద్దకు చేర్చబడ్డాడు
  rationale: אסף యొక్క నిఫాల్ రూపం మరియు ‘తన ప్రజలవద్దకు’ అనే పదబంధాన్ని సాధ్యమైనంత సమీపంగా ఉంచి, ఇది సమాధిని, మరణించిన బంధువులతో కలయికను, లేదా మరణానంతర స్థితిని సూచిస్తుందా అనే అసలు అనిశ్చితిని కాపాడుతుంది.
- source_word: עַמָּיו
  choice: తన ప్రజలు
  rationale: עם అనే నామవాచకానికి ‘ప్రజలు’ ప్రత్యక్ష సమానం. ‘పూర్వీకులు’ లేదా ‘బంధువులు’ అని కుదించకుండా దాని కుటుంబ–సమూహ విస్తృతిని నిలుపుతుంది.
theological_decisions:
- issue: ‘తన ప్రజలవద్దకు చేర్చబడ్డాడు’ అనే మరణసూత్రం యొక్క అర్థం
  choice: దాని భావాన్ని సమాధి, మరణించిన బంధువులతో కలయిక, లేదా స్పష్టమైన మరణానంతర సిద్ధాంతంగా నిర్ణయించకుండా సంప్రదాయ మరణసూత్రంగానే నిలుపడం.
  alternative: కుటుంబ సమాధిలో పాతిపెట్టబడ్డాడని లేదా మరణించిన పూర్వీకులతో మరణానంతరం కలిశాడని స్పష్టంగా అనువదించడం.
  rationale: హీబ్రూ మాటకు సాంస్కృతిక, దైవశాస్త్రీయ ప్రతిధ్వనులు ఉన్నా, ఈ వచనం వాటిలో ఒక్క అర్థాన్నే నిర్బంధించదు. అందువల్ల మూలంలోని ఉద్వేగం, అనిశ్చితి నిలుపబడ్డాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. ‘తుదిశ్వాస విడిచి చనిపోయాడు’ అనే జోడింపు మూలంలోని వరుసగా ఉన్న రెండు మరణక్రియలను నిలుపుతుంది. ‘తన ప్రజలవద్దకు చేర్చబడ్డాడు’ కొంత బైబిలీయ నుడికారంలా వినిపించినా, మూలంలోని ఉద్దేశపూర్వక అస్పష్టతను కాపాడేందుకు దాన్ని వివరణాత్మకంగా మార్చలేదు.
