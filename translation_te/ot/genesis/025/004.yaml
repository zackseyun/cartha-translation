base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/004.yaml
  text: And the sons of Midian were Ephah[a], Epher, Hanoch, Abida, and Eldaah. All these were the sons of Keturah.
translation:
  language: te
  text: మిద్యాను కుమారులు ఏఫా, ఏఫెరు, హనోకు[a], అబీదా, ఎల్దాయా. వీరందరూ కెతూరా సంతానానికి చెందినవారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పేరు ‘హనోకు’; కొన్ని అనువాదాల్లో సంప్రదాయంగా ‘ఎనోకు’ అని ఉంటుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי מִדְיָן
  choice: మిద్యాను కుమారులు
  rationale: בְּנֵי అనే నిర్మాణ బహువచనం వంశావళి సందర్భంలో పురుష సంతానాన్ని సూచిస్తుంది. ఆరంభ וּ కొనసాగింపును సూచించినా, తెలుగులో ప్రత్యేకంగా ‘మరియు’ చేర్చకుండా వాక్యాన్ని ప్రారంభించడం సహజంగా ఉంటుంది.
- source_word: עֵיפָה
  choice: ఏఫా
  rationale: హీబ్రూ వ్యక్తినామ ధ్వనిరూపానికి దగ్గరగా ఉన్న తెలుగు లిప్యంతరీకరణ.
- source_word: וָעֵפֶר
  choice: ఏఫెరు
  rationale: సంయోజకంతో వచ్చిన హీబ్రూ వ్యక్తినామాన్ని తెలుగు ఉచ్చారణకు సహజంగా లిప్యంతరీకరించింది.
- source_word: וַחֲנֹךְ
  choice: హనోకు
  rationale: חֲנֹךְ అనే హీబ్రూ రూపాన్ని నేరుగా ప్రతిబింబిస్తుంది; సంప్రదాయ ‘ఎనోకు’ రూపంతో కలిగే గందరగోళాన్ని పాదసూచికలో తెలియజేసింది.
- source_word: וַאֲבִידָע
  choice: అబీదా
  rationale: హీబ్రూ స్వరాలనుసారంగా వ్యక్తినామాన్ని లిప్యంతరీకరించింది.
- source_word: וְאֶלְדָּעָה
  choice: ఎల్దాయా
  rationale: హీబ్రూ వ్యక్తినామంలోని ధ్వనిక్రమాన్ని తెలుగులో సహజంగా ప్రతిబింబించే రూపం.
- source_word: כָּל אֵלֶּה
  choice: వీరందరూ
  rationale: జాబితాలోని వ్యక్తులందరినీ సమష్టిగా సూచించే సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: בְּנֵי קְטוּרָה
  choice: కెతూరా కుమారులు
  rationale: హీబ్రూ వంశావళి సూత్రంలోని ‘కుమారులు’ అనే నిర్దిష్ట సంబంధాన్ని అలాగే నిలుపుతుంది.
