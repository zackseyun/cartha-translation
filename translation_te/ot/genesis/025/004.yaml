  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళికి తగిన సంక్షిప్తమైన గౌరవప్రద శైలి. వ్యక్తినామాలు హీబ్రూ ధ్వనిరూపాల ఆధారంగా లిప్యంతరీకరించబడ్డాయి.
