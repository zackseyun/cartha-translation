source:
  edition: WLC
  text: וְ/אֵ֛לֶּה תֹּלְדֹ֥ת יִשְׁמָעֵ֖אל בֶּן אַבְרָהָ֑ם אֲשֶׁ֨ר יָלְדָ֜ה הָגָ֧ר הַ/מִּצְרִ֛ית שִׁפְחַ֥ת שָׂרָ֖ה לְ/אַבְרָהָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/012.yaml
  text: These are the generations of Ishmael[a], Abraham’s son, whom Hagar the Egyptian, Sarah’s servant woman[b], bore to Abraham.
translation:
  language: te
  text: అబ్రాహాము కుమారుడైన ఇష్మాయేలు వంశావళి[a] ఇది. ఐగుప్తీయురాలైన, శారా దాసియైన హాగరు అతనిని అబ్రాహాముకు కనింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఇష్మాయేలు సంతతి వివరాలు ఇవి.” హీబ్రూ ‘తోలెదోత్’ అనే పదం ఆదికాండంలో పునరావృతమయ్యే శీర్షిక; దీనిని “సంతతి,” “కుటుంబ వృత్తాంతం” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: ఇది
  rationale: తెలుగులో వంశావళి శీర్షికను సహజంగా పరిచయం చేస్తుంది. హీబ్రూ וְ యొక్క అనుసంధాన భావాన్ని ప్రత్యేకంగా ‘మరియు’ అని పెట్టకపోయినా సందర్భం ద్వారా వ్యక్తమవుతుంది.
- source_word: תֹּלְדֹת
  choice: వంశావళి
  rationale: ఆదికాండమంతటా పునరావృతమయ్యే నిర్మాణాత్మక పదానికి వంశం, సంతతి, కుటుంబ చరిత్ర అనే విస్తృత భావాలను కాపాడే సహజమైన తెలుగు పదం.
- source_word: יִשְׁמָעֵאל בֶּן־אַבְרָהָם
  choice: అబ్రాహాము కుమారుడైన ఇష్మాయేలు
  rationale: హీబ్రూ సంబంధాన్ని స్పష్టమైన, సహజమైన తెలుగు పదక్రమంలో అందిస్తుంది.
- source_word: אֲשֶׁר יָלְדָה
  choice: అతణ్ణి ... కనింది
  rationale: స్త్రీలింగ క్రియకు హాగరే కర్త అని స్పష్టంగా ఉంచి, ప్రసవ సంబంధాన్ని నేరుగా తెలియజేస్తుంది.
- source_word: הָגָר הַמִּצְרִית
  choice: ఐగుప్తీయురాలైన హాగరు
  rationale: హాగరు యొక్క జాతీయ గుర్తింపును సహజమైన తెలుగు విశేషణ రూపంలో నిలుపుతుంది.
- source_word: שִׁפְחַת שָׂרָה
  choice: శారా దాసీ
  rationale: שִׁפְחָה సూచించే అధీన సేవక స్థితిని ‘పనిమనిషి’ వంటి మృదువైన పదం కంటే స్పష్టంగా ప్రతిబింబిస్తుంది.
- source_word: לְאַבְרָהָם
  choice: అబ్రాహాముకు
  rationale: ఈ జనన నిర్మాణంలో అబ్రాహాము తండ్రి అనే సంబంధాన్ని తెలుగు విభక్తితో సహజంగా తెలియజేస్తుంది.
