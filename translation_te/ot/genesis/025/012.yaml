translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ఆదికాండంలోని సూత్రప్రాయ శీర్షికను ‘వంశావళి ఇది’ అనే సహజ నిర్మాణంతో నిలిపి, హాగరు యొక్క అధీన సామాజిక స్థితిని మృదూకరించకుండా వ్యక్తపరిచింది.
