translation:
  language: te
  text: అబ్రాహాము జీవించిన జీవితకాలం నూట డెబ్బై ఐదు సంవత్సరాలు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “ఇవి అబ్రాహాము జీవిత సంవత్సరాల దినాలు, అతడు జీవించినవి.”
    reason: మూలంలోని וְאֵלֶּה యెమేం షెనె హయ్యే మరియు אֲשֶׁר חָי అనే విస్తృత పునరుక్త ప్రయోగాన్ని చూపించడానికి.
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: అన్నీ కలిపి
  rationale: ఈ వాక్యం అబ్రాహాము జీవితకాలాన్ని సంగ్రహించి మొత్తం చెబుతోంది. ఆరంభంలోని సంధాయక అవ్యయాన్ని తెలుగులో విడిగా అనువదించకుండా, సంగ్రహ భావాన్ని సహజంగా వ్యక్తం చేశాం.
- source_word: יְמֵי שְׁנֵי חַיֵּי אַבְרָהָם אֲשֶׁר חָי
  choice: అబ్రాహాము జీవించిన సంవత్సరాలన్నీ
  rationale: అక్షరార్థంగా ‘అబ్రాహాము జీవించిన అతని జీవిత సంవత్సరాల దినాలు’ అనే పునరుక్తిగల హెబ్రీ నిర్మాణం మొత్తం జీవితకాలాన్ని సూచిస్తుంది. భావాన్ని కోల్పోకుండా ఆధునిక తెలుగులో సహజంగా కుదించాం; అక్షర నిర్మాణాన్ని పాదటిప్పణిలో ఇచ్చాం.
- source_word: מְאַת שָׁנָה וְשִׁבְעִים שָׁנָה וְחָמֵשׁ שָׁנִים
  choice: నూట డెబ్బై ఐదు సంవత్సరాలు
  rationale: హెబ్రీలోని 100 + 70 + 5 అనే కూడిక రూపాన్ని, అదే ఖచ్చిత సంఖ్యను తెలిపే సహజమైన తెలుగు సంఖ్యారూపంలో ఇచ్చాం.
- source_word: אַבְרָהָם
  choice: అబ్రాహాము
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపాన్ని ఉపయోగించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా రూపొందించాం. హెబ్రీ వాక్యంలోని పునరుక్తిని ప్రధాన పాఠ్యంలో సులభతరం చేసి, దాని అక్షర నిర్మాణాన్ని పాదటిప్పణిలో నిలిపాం.
