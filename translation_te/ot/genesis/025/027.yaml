  to: ఆ బాలురు పెరిగి పెద్దవారయ్యాక, ఏశావు వేటలో నైపుణ్యం గలవాడిగా, పొలాల్లో జీవించే వాడిగా అయ్యాడు; అయితే యాకోబు సౌమ్య స్వభావం గలవాడిగా[a], గుడారాల్లో నివసించేవాడిగా ఉండేవాడు.
