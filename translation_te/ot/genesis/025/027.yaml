source:
  edition: WLC
  text: וַֽ/יִּגְדְּלוּ֙ הַ/נְּעָרִ֔ים וַ/יְהִ֣י עֵשָׂ֗ו אִ֛ישׁ יֹדֵ֥עַ צַ֖יִד אִ֣ישׁ שָׂדֶ֑ה וְ/יַעֲקֹב֙ אִ֣ישׁ תָּ֔ם יֹשֵׁ֖ב אֹהָלִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/027.yaml
  text: When the boys grew up[a], Esau became a skillful hunter, a man of the field, but Jacob was a quiet man[b], dwelling in tents.
translation:
  language: te
  text: ఆ బాలురు పెరిగి పెద్దవారయ్యాక, ఏశావు వేటలో నైపుణ్యం గలవాడిగా, పొలాల్లో జీవించే వాడిగా అయ్యాడు; అయితే యాకోబు సౌమ్య స్వభావం గలవాడిగా[a], గుడారాల్లో నివసించేవాడిగా ఉండేవాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నిష్కపటుడు,” “నిర్దోషి,” లేదా “సాదాసీదా వ్యక్తి.” యాకోబును వర్ణించే హెబ్రీ పదం సందర్భానుసారం సంపూర్ణత, సమగ్రత, నిర్దోషిత్వం లేదా సరళ స్వభావం అనే భావాలను ఇవ్వగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְדְּלוּ הַנְּעָרִים
  choice: ఆ బాలురు పెరిగి పెద్దవారైనప్పుడు
  rationale: సందర్భంలో కవల పిల్లలు యౌవనానికి చేరడాన్ని సూచిస్తుంది. ‘పెరిగి పెద్దవారైనప్పుడు’ ఆధునిక తెలుగులో సహజంగా ఈ వికాస భావాన్ని తెలియజేస్తుంది.
- source_word: אִישׁ יֹדֵעַ צַיִד
  choice: వేటలో నైపుణ్యం గలవాడు
  rationale: ‘వేట తెలిసిన మనిషి’ అనే మూల నిర్మాణం అభ్యసించిన సామర్థ్యాన్ని సూచిస్తుంది; ఈ ఎంపిక ఆ భావాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: אִישׁ שָׂדֶה
  choice: బయటి ప్రదేశాల్లో తిరిగే వ్యక్తి
  rationale: అక్షరార్థంగా ‘పొలానికి చెందిన మనిషి’; ఇక్కడ గుడారాల్లో నివసించే యాకోబుకు విరుద్ధంగా, ఆరుబయట ప్రాంతాల్లో జీవించే ఏశావు జీవనశైలిని సూచిస్తుంది.
- source_word: אִישׁ תָּם
  choice: నెమ్మదైన స్వభావం గలవాడు
  rationale: תָּם అనే పదానికి సంపూర్ణుడు, యథార్థవంతుడు, నిర్దోషి, సాధుస్వభావి వంటి భావాలు ఉండవచ్చు. ఈ సందర్భంలోని జీవనశైలి వ్యత్యాసాన్ని బట్టి మృదువైన/నెమ్మదైన స్వభావ భావాన్ని ప్రధాన పాఠ్యంలో ఉంచి, ఇతర నిజమైన అవకాశాలను పాదసూచికలో నిలిపాం.
- source_word: יֹשֵׁב אֹהָלִים
  choice: గుడారాల్లో నివసించేవాడు
  rationale: క్రియారూపం అలవాటైన నివాస విధానాన్ని సూచిస్తుంది; ఈ అనువాదం ఏశావు ఆరుబయటి జీవనంతో ఉన్న వ్యత్యాసాన్ని స్పష్టంగా ఉంచుతుంది.
theological_decisions:
- issue: యాకోబును వర్ణించే תָּם పదార్థం
  choice: నెమ్మదైన స్వభావం గలవాడు
  alternative: యథార్థవంతుడు; నిర్దోషి; సాదాసీదా వ్యక్తి; సంపూర్ణుడు
  rationale: తక్షణ సందర్భం ఏశావు ఆరుబయటి వేట జీవనానికీ యాకోబు గుడార జీవనానికీ మధ్య వ్యత్యాసాన్ని చూపుతుంది. అందువల్ల ప్రధాన పాఠ్యంలో స్వభావ/జీవనశైలి భావాన్ని ఎంచుకున్నాం; అయితే హెబ్రీ పదంలోని నైతిక సమగ్రత లేదా నిర్దోషిత్వ భావాన్ని తిరస్కరించకుండా పాదసూచికలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథన శైలి. హెబ్రీ వాక్యంలోని ఏశావు–యాకోబు జీవనశైలి వ్యత్యాసాన్ని సహజంగా ఉంచుతూ, תָּם పదంలోని అర్థసందిగ్ధతను పాదసూచిక ద్వారా సంరక్షించాం.
