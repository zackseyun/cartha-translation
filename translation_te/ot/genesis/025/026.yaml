source:
  edition: WLC
  text: וְ/אַֽחֲרֵי כֵ֞ן יָצָ֣א אָחִ֗י/ו וְ/יָד֤/וֹ אֹחֶ֨זֶת֙ בַּ/עֲקֵ֣ב עֵשָׂ֔ו וַ/יִּקְרָ֥א שְׁמ֖/וֹ יַעֲקֹ֑ב וְ/יִצְחָ֛ק בֶּן שִׁשִּׁ֥ים שָׁנָ֖ה בְּ/לֶ֥דֶת אֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/026.yaml
  text: Afterward his brother came out[a], and his hand was grasping Esau’s heel, so his name was called Jacob. And Isaac was sixty years old when they were born.
translation:
  language: te
  text: ఆ తర్వాత అతని సోదరుడు బయటికి వచ్చాడు; అతని చెయ్యి ఏశావు మడమను పట్టుకొని ఉంది. అందుకే అతనికి యాకోబు[a] అని పేరు పెట్టారు. వారు పుట్టినప్పుడు ఇస్సాకుకు అరవై ఏళ్లు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “యాకోబు” అనే పేరు హీబ్రూలో “మడమ” అనే పదంతో సంబంధం కలిగి ఉంది; తర్వాత అది మరొకరి స్థానాన్ని లేదా హక్కును చేజిక్కించుకోవడం అనే భావంతోనూ ముడిపడుతుంది. అతడు ఏశావు మడమను పట్టుకొని ఉండడం ఈ పేరుకు అనుగుణంగా ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחֲרֵי כֵן
  choice: ఆ తర్వాత
  rationale: ముందటి శిశువు జననం తర్వాత జరిగిన క్రమాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: יָצָא
  choice: బయటికి వచ్చాడు
  rationale: ప్రసవ సందర్భంలో గర్భం నుంచి బయటికి రావడాన్ని సూచించే హీబ్రూ దృశ్యాత్మకతను నిలుపుతుంది; నేరుగా ‘పుట్టాడు’ అని వ్యాఖ్యానించదు.
- source_word: אָחִיו
  choice: అతని సోదరుడు
  rationale: మూలంలో ‘సోదరుడు’ మాత్రమే ఉంది; సందర్భం వల్ల తెలిసే ‘కవల సోదరుడు’ అనే వివరాన్ని పదంలోకి చేర్చలేదు.
- source_word: וְיָדוֹ אֹחֶזֶת
  choice: అతని చెయ్యి ... పట్టుకొని ఉంది
  rationale: అతడు బయటికి వస్తున్నప్పుడు కొనసాగుతున్న చర్యను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בַּעֲקֵב עֵשָׂו
  choice: ఏశావు మడమను
  rationale: ‘ఏశావు మడమ’ అనే సంబంధాన్ని స్పష్టంగా, సహజంగా అందిస్తుంది.
- source_word: וַיִּקְרָא שְׁמוֹ
  choice: అందుకే అతనికి ... అని పేరు పెట్టారు
  rationale: హీబ్రూ ఏకవచన క్రియకు ఇక్కడ స్పష్టమైన కర్త లేకపోవడంతో, తెలుగు అనిర్దిష్ట బహువచన నిర్మాణం ఆ అస్పష్టతను సహజంగా నిలుపుతుంది; ‘అందుకే’ మడమ పట్టుకోవడం–పేరు పెట్టడం మధ్య కథన సంబంధాన్ని తెలియజేస్తుంది.
- source_word: יַעֲקֹב
  choice: యాకోబు
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం; పేరు మరియు ‘మడమ’ మధ్యనున్న హీబ్రూ పదసంబంధాన్ని పాదటిప్పణి వివరిస్తుంది.
- source_word: בֶּן שִׁשִּׁים שָׁנָה
  choice: అరవై ఏళ్లు
  rationale: హీబ్రూ వయస్సు ప్రయోగానికి సహజమైన తెలుగు సమానం.
- source_word: בְּלֶדֶת אֹתָם
  choice: వారు పుట్టినప్పుడు
  rationale: మూలంలోని కాలసంబంధాన్ని నిలుపుతూ, అక్కడ స్పష్టంగా లేని ప్రసవించిన స్త్రీని కర్తగా చేర్చదు.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథన శైలి. మూలంలోని క్రమం, శరీరచర్య దృశ్యాత్మకత, పేరుపెట్టిన కర్తకు సంబంధించిన అస్పష్టతను సాధ్యమైనంతవరకు నిలిపాం.
