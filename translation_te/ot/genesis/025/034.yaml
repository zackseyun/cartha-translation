  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/יַעֲקֹ֞ב נָתַ֣ן לְ/עֵשָׂ֗ו לֶ֚חֶם וּ/נְזִ֣יד עֲדָשִׁ֔ים וַ/יֹּ֣אכַל וַ/יֵּ֔שְׁתְּ וַ/יָּ֖קָם וַ/יֵּלַ֑ךְ וַ/יִּ֥בֶז עֵשָׂ֖ו אֶת הַ/בְּכֹרָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/034.yaml
  text: And Jacob gave Esau bread and lentil stew[a], and he ate and drank and rose and went away[b]. Thus Esau despised the birthright.
translation:
  language: te
  text: యాకోబు ఏశావుకు రొట్టెను, మసూరు పప్పుతో చేసిన కూరను[a] ఇచ్చాడు. అతడు తిని, తాగి, లేచి, వెళ్లిపోయాడు. ఈ విధంగా ఏశావు జ్యేష్ఠత్వ హక్కును తృణీకరించాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మసూరు పప్పు కూర.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “జ్యేష్ఠత్వ హక్కును చులకనగా చూశాడు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: נָתַן
  choice: ఇచ్చాడు
  rationale: సాధారణ కథన సందర్భంలో హెబ్రీ క్రియకు నేరమైన, సహజమైన సమానార్థకం.
- source_word: לֶחֶם
  choice: రొట్టె
  rationale: పప్పుకూరతో జతగా ప్రస్తావించబడినందున, సాధారణంగా ‘ఆహారం’ అని కాక నిర్దిష్టంగా ‘రొట్టె’ అని అనువదించడం సందర్భానికి సరిపోతుంది.
- source_word: נְזִיד עֲדָשִׁים
  choice: పప్పుకూర
  rationale: కాయధాన్యంతో వండిన చిక్కని వంటకాన్ని ఆధునిక సాధారణ తెలుగులో సహజంగా తెలియజేస్తుంది; దాని ఖచ్చిత నిర్మాణాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: וַיֹּאכַל וַיֵּשְׁתְּ וַיָּקָם וַיֵּלַךְ
  choice: తిని, తాగి, లేచి, వెళ్లిపోయాడు
  rationale: హెబ్రీలోని వరుస క్రియల వేగవంతమైన కథన లయను తెలుగులో సహజమైన క్రియాశ్రేణిగా నిలుపుతుంది.
- source_word: וַיִּבֶז
  choice: తృణీకరించాడు
  rationale: కేవలం నిర్లక్ష్యం చేయడం కాక, విలువలేనిదిగా ఎంచి చులకన చేసే బలమైన భావాన్ని సంక్షిప్తంగా వ్యక్తపరుస్తుంది.
- source_word: הַבְּכֹרָה
  choice: జ్యేష్ఠత్వ హక్కు
  rationale: కుటుంబంలో మొదట పుట్టిన కుమారునికి సంబంధించిన హోదా, హక్కులు రెండింటినీ సంక్షిప్తంగా సూచిస్తుంది.
theological_decisions:
- issue: ఏశావు తన జ్యేష్ఠత్వ హక్కుకు ఇచ్చిన విలువపై కథకుని ముగింపు తీర్పు
  choice: ఈ విధంగా ఏశావు జ్యేష్ఠత్వ హక్కును తృణీకరించాడు
  alternative: ఏశావు జ్యేష్ఠత్వ హక్కును చులకనగా చూశాడు
  rationale: చివరి హెబ్రీ వాక్యం ముందటి చర్యలపై కథకుడు చేసిన సారాంశాత్మక నైతిక మూల్యాంకనం. ‘ఈ విధంగా’ ఆ అన్వయాన్ని చూపుతుంది; ‘తృణీకరించాడు’ దాని బలాన్ని తగ్గించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే గౌరవప్రదమైన కథన శైలిలో అనువదించబడింది. హెబ్రీ క్రియల వేగవంతమైన వరుసను తెలుగులో సహజమైన క్రియాశ్రేణిగా ఉంచాం.
