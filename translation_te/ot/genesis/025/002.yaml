source:
  edition: WLC
  text: וַ/תֵּ֣לֶד ל֗/וֹ אֶת זִמְרָן֙ וְ/אֶת יָקְשָׁ֔ן וְ/אֶת מְדָ֖ן וְ/אֶת מִדְיָ֑ן וְ/אֶת יִשְׁבָּ֖ק וְ/אֶת שֽׁוּחַ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/002.yaml
  text: And she bore him Zimran, Jokshan, Medan, Midian, Ishbak, and Shuah.
translation:
  language: te
  text: ఆమె అతనికి జిమ్రాను, యొక్షాను, మెదాను, మిద్యాను, ఇష్బాకు, షూహను కనింది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֵּלֶד
  choice: కనింది
  rationale: ילד ధాతువు Qal wayyiqtol తృతీయ పురుష ఏకవచన స్త్రీలింగ రూపం; వంశావళి సందర్భంలో ప్రసవించి కుమారులను కన్నదనే భావాన్ని సహజమైన, సంక్షిప్తమైన తెలుగులో తెలియజేస్తుంది.
- source_word: לוֹ
  choice: అతనికి
  rationale: ל ఉపసర్గతో కూడిన సర్వనామ ప్రత్యయం ఇక్కడ పిల్లల తండ్రిని సూచిస్తుంది; ‘అతనికి ... కనింది’ అనేది ఆ సంబంధాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אֶת
  choice: ప్రత్యేకంగా అనువదించలేదు
  rationale: ప్రతి పేరుకు ముందు ఉన్న ప్రత్యక్ష కర్మ సూచికకు తెలుగులో స్వతంత్ర సమానపదం లేదు; వాక్య నిర్మాణమే దాని విధిని తెలియజేస్తుంది.
- source_word: זִמְרָן
  choice: జిమ్రాను
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు ధ్వన్యనుసారంగా లిప్యంతరీకరించి, వాక్యంలో కర్మరూపానికి అనుగుణంగా ‘ను’ చేర్చాం.
- source_word: יָקְשָׁן
  choice: యొక్షాను
  rationale: హీబ్రూ వ్యక్తినామాన్ని మూలధ్వనికి దగ్గరగా, తెలుగులో ప్రాచుర్యమున్న బైబిలు నామరూపాన్ని దృష్టిలో ఉంచుకొని లిప్యంతరీకరించాం.
- source_word: מְדָן
  choice: మెదాను
  rationale: హీబ్రూ వ్యక్తినామాన్ని ధ్వన్యనుసారంగా లిప్యంతరీకరించాం.
- source_word: מִדְיָן
  choice: మిద్యాను
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగులో సుపరిచితమైన రూపంలో లిప్యంతరీకరించాం.
- source_word: יִשְׁבָּק
  choice: ఇష్బాకు
  rationale: హీబ్రూ వ్యక్తినామాన్ని మూల ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించాం.
- source_word: שׁוּחַ
  choice: షూవహు
  rationale: చివరి ח ధ్వనిని పూర్తిగా తొలగించకుండా, తెలుగులో పలకడానికి సహజమైన ‘షూవహు’ రూపాన్ని ఎంచుకున్నాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో వంశావళికి తగిన సంక్షిప్తమైన, గౌరవప్రదమైన శైలి. పేర్లు మూల హీబ్రూ రూపాలకు దగ్గరగా లిప్యంతరీకరించబడ్డాయి; పాఠంలో పాదటిప్పణి సూచికలు అవసరం లేదు.
