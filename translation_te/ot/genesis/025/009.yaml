  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే కథన శైలి వాడబడింది. పొడవైన స్థల వివరణలో సంబంధాలు స్పష్టంగా ఉండేందుకు డాష్‌లతో అనుబంధ వివరణను అమర్చాం; హీబ్రూలోని భౌగోళిక అస్పష్టతను పాదటీపులో నిలిపాం.
