source:
  edition: WLC
  text: וַ/יִּקְבְּר֨וּ אֹת֜/וֹ יִצְחָ֤ק וְ/יִשְׁמָעֵאל֙ בָּנָ֔י/ו אֶל מְעָרַ֖ת הַ/מַּכְפֵּלָ֑ה אֶל שְׂדֵ֞ה עֶפְרֹ֤ן בֶּן צֹ֨חַר֙ הַֽ/חִתִּ֔י אֲשֶׁ֖ר עַל פְּנֵ֥י מַמְרֵֽא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/009.yaml
  text: His sons Isaac and Ishmael buried him in the cave of Machpelah[a], in the field of Ephron son of Zohar the Hittite, which is opposite Mamre.
translation:
  language: te
  text: అతని కుమారులైన ఇస్సాకు, ఇష్మాయేలు అతన్ని మక్పేలా గుహలో, అంటే మమ్రేకు ఎదురుగా ఉన్న సోహరు కుమారుడైన హిత్తీయుడు ఎఫ్రోను పొలంలో, పాతిపెట్టారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మమ్రే ముందు ఉన్న” లేదా “మమ్రేకు అభిముఖంగా ఉన్న.” హీబ్రూ పదబంధం ఒక గుర్తింపు స్థలానికి ముందు లేదా ఎదురుగా ఉన్న ప్రదేశాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: అతన్ని ... పాతిపెట్టారు
  rationale: קבר క్రియ ఇక్కడ కథన క్రమంలో జరిగిన సమాధి చర్యను సూచిస్తుంది. వాక్యారంభంలోని וַను తెలుగులో ప్రత్యేకంగా ‘మరియు’ అని అనువదించకపోవడం సహజ కథన శైలికి అనుగుణం.
- source_word: יִצְחָק וְיִשְׁמָעֵאל בָּנָיו
  choice: అతని కుమారులైన ఇస్సాకు, ఇష్మాయేలు
  rationale: בָּנָיוలోని తృతీయ పురుష ఏకవచన ప్రత్యయం అబ్రాహామును సూచిస్తుంది; పేర్లతో ఉన్న వివరణాత్మక సంబంధాన్ని సహజ తెలుగులో ‘కుమారులైన’తో వ్యక్తం చేశాం.
- source_word: אֶל מְעָרַת הַמַּכְפֵּלָה
  choice: మక్పేలా గుహలో
  rationale: אֶל సాధారణంగా దిశను సూచించినా, קברతో కూడిన ఈ సందర్భంలో సమాధి చేసిన స్థలాన్ని తెలుగులో ‘గుహలో’ అని చెప్పడం సహజం. మక్పేలా స్థలనామంగా లిప్యంతరీకరించబడింది.
- source_word: אֶל שְׂדֵה עֶפְרֹן
  choice: ఎఫ్రోను పొలంలో ఉన్న ఆ గుహలో
  rationale: రెండవ אֶל గుహ ఉన్న విస్తృత స్థలాన్ని మరింత నిర్దిష్టం చేస్తుంది. తెలుగు వాక్యంలో సంబంధాన్ని స్పష్టంగా ఉంచేందుకు ‘పొలంలో ఉన్న ఆ గుహ’ అని పునర్నిర్మించాం.
- source_word: בֶּן צֹחַר הַחִתִּי
  choice: హిత్తీయుడైన సోహరు కుమారుడు
  rationale: בן వంశ సంబంధాన్ని, הַחִתִּי జాతి గుర్తింపును సూచిస్తాయి. హీబ్రూ పదక్రమంలో ‘హిత్తీయుడు’ ఎఫ్రోనును విశేషించగలిగినా, ఆదికాండము 23:8లోని ‘సోహరు కుమారుడైన ఎఫ్రోను’ మరియు 23:10లో ఎఫ్రోనుకు స్పష్టంగా వర్తించే ‘హిత్తీయుడు’ అనే సమీప సందర్భం ఆధారంగా ఈ నిర్మాణం ఎఫ్రోనునే హిత్తీయుడిగా సూచించేలా అనువదించబడింది.
- source_word: אֲשֶׁר עַל פְּנֵי מַמְרֵא
  choice: మమ్రేకు ఎదురుగా ఉన్న
  rationale: עַל־פְּנֵי భౌగోళిక సందర్భంలో ‘ఎదురుగా/ముందుగా/అభిముఖంగా’ అనే పరిధిని కలిగి ఉంది. ‘ఎదురుగా’ దిశను అనవసరంగా నిర్దిష్టం చేయకుండా సహజంగా స్థల సంబంధాన్ని తెలియజేస్తుంది.
