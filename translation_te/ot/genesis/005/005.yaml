  text: So all the days of Adam that he lived were nine hundred and thirty years[a], and he died.
translation:
  language: te
  text: ఆదాము మొత్తం తొమ్మిది వందల ముప్పై సంవత్సరాలు జీవించాడు; అతడు మరణించాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీలో ‘ఆదామ్’ అనే పదానికి కొన్ని సందర్భాల్లో ‘మనిషి’ లేదా ‘మానవజాతి’ అనే అర్థాలు ఉండవచ్చు; అయితే ఇక్కడ అది వంశావళిలోని వ్యక్తి ఆదామును సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ כָּל יְמֵי
  choice: జీవించిన రోజులన్నీ ... సంవత్సరాలు
  rationale: వంశావళిలో ఆయుష్కాలాన్ని సంక్షిప్తంగా తెలిపే హెబ్రీ సూత్రాన్ని సహజమైన తెలుగులో అందిస్తూ, జీవితాన్ని ‘రోజులు’గా లెక్కించే మూలభాషా నుడికారాన్ని నిలుపుతుంది.
- source_word: אָדָם
  choice: ఆదాము
  rationale: ఈ వంశావళి సందర్భంలో ఇది సాధారణంగా ‘మనిషి/మానవజాతి’ అనే అర్థం కాక, వ్యక్తిగత నామం.
- source_word: אֲשֶׁר חַי
  choice: జీవించిన
  rationale: ‘రోజులు’ను విశేషించే సంబంధవాక్యాన్ని తెలుగులో సహజమైన విశేషణ రూపంతో వ్యక్తం చేస్తుంది.
- source_word: תְּשַׁע מֵאוֹת ... וּשְׁלֹשִׁים שָׁנָה
  choice: తొమ్మిది వందల ముప్పై సంవత్సరాలు
  rationale: మూలంలోని సంఖ్యను పూర్తిగా పదాలతో ఇచ్చి వంశావళి సాహిత్య శైలిని కాపాడుతుంది.
- source_word: וַיָּמֹת
  choice: ఆ తరువాత అతడు చనిపోయాడు
  rationale: మరణాన్ని తెలిపే పునరావృత వంశావళి సూత్రాన్ని సరళంగా, గంభీరంగా ఉంచుతుంది; ‘ఆ తరువాత’ కథన క్రమాన్ని సహజ తెలుగులో సూచిస్తుంది.
theological_decisions:
- issue: אָדָם పద ప్రయోగం
  choice: వ్యక్తిగత నామంగా ‘ఆదాము’
  alternative: మనిషి / మానవజాతి
  rationale: ఆదికాండము 5 వంశావళిలో ఈ వచనం పేరుగల వ్యక్తి ఆయుష్కాలాన్ని సంగ్రహిస్తుంది; సాధారణ నామంగా అనువదిస్తే వంశావళి సూచన అస్పష్టమవుతుంది.
- issue: మరణ సూత్రాన్ని కాపాడడం
  choice: అతడు చనిపోయాడు
  alternative: అతని జీవితం ముగిసింది
  rationale: మూలంలోని నేరుగా, పదేపదే వచ్చే మరణ ప్రకటనను మృదువుగా మార్చకుండా దాని ధార్మిక భారాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గంభీరమైన వంశావళి శైలి. ‘రోజులన్నీ’ అనే హెబ్రీ నుడికారాన్ని నిలిపి, అసహజమైన పదక్రమాన్ని నివారించాం.
