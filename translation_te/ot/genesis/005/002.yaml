source:
  edition: WLC
  text: זָכָ֥ר וּ/נְקֵבָ֖ה בְּרָאָ֑/ם וַ/יְבָ֣רֶךְ אֹתָ֗/ם וַ/יִּקְרָ֤א אֶת שְׁמָ/ם֙ אָדָ֔ם בְּ/י֖וֹם הִבָּֽרְאָֽ/ם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/002.yaml
  text: Male and female he created them[a], and he blessed them and called their name Man on the day they were created.
translation:
  language: te
  text: ఆయన వారిని పురుషునిగాను స్త్రీగాను సృష్టించాడు; వారిని ఆశీర్వదించాడు. వారు సృష్టించబడిన రోజున వారి పేరు ‘మనిషి’[a] అని పెట్టాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ: ఆదాం. ఈ పదానికి ‘మనిషి’ లేదా సమష్టిగా ‘మానవజాతి’ అనే అర్థం రావచ్చు; ఇదే ‘ఆదాం’ అనే వ్యక్తినామం కూడా.'
    reason: హీబ్రూ పదంలోని సామూహిక అర్థాన్ని, వ్యక్తినామంగా ఉండే ప్రత్యామ్నాయ పఠనాన్ని రెండింటినీ భద్రపరచడానికి.
lexical_decisions:
- source_word: זָכָר וּנְקֵבָה
  choice: పురుషునిగాను స్త్రీగాను
  rationale: హీబ్రూలోని జతపదాల సమాంతరతను నిలుపుతూ, ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదంగా మరియు సహజంగా లింగ భేదాన్ని తెలియజేస్తుంది.
- source_word: בְּרָאָם
  choice: వారిని సృష్టించాడు
  rationale: మూడవ పురుష బహువచన కర్మప్రత్యయాన్ని స్పష్టంగా చూపిస్తూ, కథన సందర్భానికి తగిన సాధారణ భూతకాలాన్ని వాడింది.
- source_word: וַיְבָרֶךְ אֹתָם
  choice: వారిని ఆశీర్వదించాడు
  rationale: దేవుని ఆశీర్వాద క్రియను సంక్షిప్తంగా, సహజంగా వ్యక్తం చేసే ప్రామాణిక తెలుగు రూపం.
- source_word: וַיִּקְרָא אֶת שְׁמָם
  choice: వారి పేరు … అని పెట్టాడు
  rationale: హీబ్రూలో బహువచనానికి ఒకే ‘పేరు’ ఇవ్వబడిన నిర్మాణాన్ని నిలుపుతుంది; ఇది తరువాతి collective אָדָם పదానికి ముఖ్యమైనది.
- source_word: אָדָם
  choice: మనిషి
  rationale: ఇక్కడ పురుషుడు, స్త్రీ ఇద్దరికీ కలిపి ఇవ్వబడిన ఒక సామూహిక పేరు. ‘మనిషి’ ఏకవచన సామూహిక బలాన్ని మరియు హీబ్రూ పదంలోని భావ ఉద్విగ్నతను సాధ్యమైనంతవరకు నిలుపుతుంది.
- source_word: בְּיוֹם הִבָּרְאָם
  choice: వారు సృష్టించబడిన రోజున
  rationale: కాలసూచనను మరియు హీబ్రూ నిష్క్రియార్థాన్ని సహజమైన తెలుగు వాక్య నిర్మాణంలో నిలుపుతుంది.
theological_decisions:
- issue: אָדָם పదాన్ని స్త్రీపురుషుల ఉమ్మడి మానవ గుర్తింపుగా అనువదించడం
  choice: మనిషి
  alternative: ఆదాం; మానవజాతి
  rationale: తక్షణ సందర్భంలో ఈ పేరు పురుషుడు, స్త్రీ ఇద్దరికీ ఇవ్వబడింది కాబట్టి సామూహిక అర్థమే ప్రధానమైనది. అయితే ఇదే హీబ్రూ రూపం ‘ఆదాం’ అనే వ్యక్తినామంగానూ ఉండగలదు; ఆ నిజమైన ద్వంద్వార్థాన్ని పాదసూచికలో ఉంచాం. ‘మానవజాతి’ సామూహికతను స్పష్టం చేసినా, మూలంలోని ఏకవచన నామకరణ బలాన్ని తగ్గిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, అయితే వంశావళి సందర్భానికి తగిన గంభీరతతో రూపొందించబడింది. ‘వారి పేరు మనిషి’ అనే కొద్దిగా గుర్తించదగిన నిర్మాణం మూలంలోని ఒకే సామూహిక పేరును ఉద్దేశపూర్వకంగా నిలుపుతుంది.
