id: GEN.5.31
reference: Genesis 5:31
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַֽ/יְהִי֙ כָּל יְמֵי לֶ֔מֶךְ שֶׁ֤בַע וְ/שִׁבְעִים֙ שָׁנָ֔ה וּ/שְׁבַ֥ע מֵא֖וֹת שָׁנָ֑ה וַ/יָּמֹֽת־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/031.yaml
  text: So all the days of Lamech were seven hundred seventy-seven years[a], and he died.
translation:
  language: te
  text: లెమెకు జీవించిన రోజులు మొత్తం ఏడువందల డెబ్బై ఏడు సంవత్సరాలు[a]. మరియు అతడు మరణించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో సంఖ్య అక్షరార్థంగా ‘ఏడు మరియు డెబ్బై సంవత్సరాలు, మరియు ఏడు వందల సంవత్సరాలు’ అనే క్రమంలో ఉంది; అంటే మొత్తం 777 సంవత్సరాలు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: జీవించిన ... ఉన్నాయి అనే భావాన్ని మొత్తం వాక్య నిర్మాణంలో వ్యక్తీకరించడం
  rationale: ఈ వావ్-క్రమ రూపం లెమెకు జీవితకాలపు సారాంశాన్ని పరిచయం చేస్తుంది. తెలుగులో ప్రత్యేక సహాయక క్రియను పదేపదే ఉంచకుండా సహజమైన జీవితకాల సూత్రంలో దాని భావాన్ని వ్యక్తం చేయవచ్చు.
- source_word: כָּל יְמֵי
  choice: జీవించిన రోజులన్నీ
  rationale: మూలంలోని ‘అన్ని రోజులు’ అనే జీవితకాల సూచనను నిలుపుతూ, ఆధునిక తెలుగులో ఎవరి మొత్తం ఆయుష్షునో స్పష్టంగా తెలియజేస్తుంది.
- source_word: לֶמֶךְ
  choice: లెమెకు
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగులో ప్రాచుర్యంలో ఉన్న బైబిలు లిప్యంతరీకరణ ప్రకారం అందించింది.
- source_word: שֶׁבַע וְשִׁבְעִים ... וּשְׁבַע מֵאוֹת
  choice: ఏడువందల డెబ్బై ఏడు
  rationale: హీబ్రూ సంఖ్యను ఏకకాలు, పదులు, వందలు అనే క్రమంలో చెప్పినా మొత్తం 777. తెలుగులో సహజ సంఖ్యాక్రమంలో అందించింది; మూల క్రమాన్ని పాదసూచికలో తెలిపింది.
- source_word: שָׁנָה
  choice: సంవత్సరాలు
  rationale: హీబ్రూలో సంఖ్యా నిర్మాణం తరువాత ఏకవచన రూపం ఉన్నా, తెలుగులో ఈ సంఖ్యతో బహువచనం సహజం.
- source_word: וַיָּמֹת
  choice: ఆ తరువాత అతడు చనిపోయాడు
  rationale: వంశావళిలో పునరావృతమయ్యే మరణ ముగింపును సూటిగా నిలుపుతుంది; వావ్ యొక్క కథన క్రమాన్ని ‘ఆ తరువాత’ వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ఆదికాండము 5లోని వంశావళి జీవితకాల సూత్రం
  choice: జీవితకాల సంఖ్యను ఎటువంటి వ్యాఖ్యాత్మక పరిమితి లేకుండా సూటిగా అనువదించడం
  alternative: సంఖ్యను అనువాదంలోనే ప్రతీకాత్మకంగా చూపించడం
  rationale: హీబ్రూ పాఠం సంఖ్యాత్మక జీవితకాల సారాంశాన్నీ మరణ ప్రకటననూ నేరుగా ఇస్తుంది. దాని చారిత్రకత లేదా ప్రతీకాత్మకతపై అదనపు తీర్పును అనువాదంలో చేర్చకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వంశావళి శైలి. మూలంలోని ‘రోజులు’ అనే ప్రయోగాన్ని నిలుపుతూ తెలుగులో స్పష్టత కోసం ‘జీవించిన’ చేర్చబడింది.
