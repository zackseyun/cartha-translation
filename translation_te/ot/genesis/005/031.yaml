revisions:
- from: లెమెకు జీవించిన రోజులన్నీ ఏడువందల డెబ్బై ఏడు సంవత్సరాలు[a]. ఆ తరువాత అతడు చనిపోయాడు.
  to: లెమెకు జీవించిన రోజులు మొత్తం ఏడువందల డెబ్బై ఏడు సంవత్సరాలు[a]. మరియు అతడు మరణించాడు.
  rationale: The revision improves Telugu idiom in the lifespan formula, preserves the Hebrew coordination in the death notice, and makes the footnote’s explanation of the source numerical order more precise. It does not alter the verse’s meaning or introduce an interpretive view of the lifespan.
