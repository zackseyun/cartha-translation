  to: హనోకు అరవై ఐదు సంవత్సరాలు జీవించి మెతూషెలహుకు తండ్రి అయ్యాడు.
  rationale: Replaced ‘మెతూషెలహును కన్నాడు’ with ‘మెతూషెలహుకు తండ్రి అయ్యాడు’ to convey the Hebrew male genealogical verb clearly and idiomatically in modern standard Telugu. No footnote is needed because the revised wording is direct and unambiguous.
