  yaml_path: translation/ot/genesis/005/021.yaml
  text: Enoch lived sixty-five years and fathered Methuselah.
translation:
  language: te
  text: హనోకు అరవై ఐదు సంవత్సరాలు జీవించి మెతూషెలహుకు తండ్రి అయ్యాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: జీవించి
  rationale: వంశావళి సూత్రంలో חיה క్రియ హనోకు జీవించిన కాలాన్ని, కుమారుణ్ని కనే సంఘటన వరకు సూచిస్తుంది. తదుపరి క్రియతో సహజంగా అనుసంధానించేందుకు తెలుగు అసమాపక రూపం వాడబడింది.
- source_word: חֲנוֹךְ
  choice: హనోకు
  rationale: వ్యక్తి పేరును తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: חָמֵשׁ וְשִׁשִּׁים שָׁנָה
  choice: అరవై ఐదు సంవత్సరాలు
  rationale: హీబ్రూ సంఖ్యా క్రమాన్ని సహజమైన ఆధునిక తెలుగు సంఖ్యా రూపంలో ఇచ్చాం.
- source_word: וַיּוֹלֶד
  choice: కన్నాడు
  rationale: పురుష కర్తతో వంశావళి సందర్భంలో ילד అంటే సంతానాన్ని కనడం/కలగజేయడం. ‘కన్నాడు’ సంక్షిప్తంగా, సహజంగా ఉండి మూలంలోని ప్రత్యక్ష వంశసంబంధ ప్రకటనను నిలుపుతుంది.
- source_word: אֶת
  choice: '[విడిగా అనువదించలేదు]'
  rationale: ఇది హీబ్రూ ప్రత్యక్ష కర్మ సూచకం; తెలుగులో కర్మ విభక్తి ద్వారా దాని పని వ్యక్తమవుతుంది.
- source_word: מְתוּשָׁלַח
  choice: మెతూషెలహు
  rationale: మూల హీబ్రూ పేరును ఆధునిక తెలుగు లిపిలో సమీపంగా లిప్యంతరీకరించాం; కర్మస్థానంలో ‘మెతూషెలహును’ అవుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళికి తగిన సంక్షిప్తమైన గౌరవప్రద శైలి. మూలంలోని రెండు వరుస క్రియలను తెలుగు సహజ వాక్యనిర్మాణంలో ‘జీవించి … కన్నాడు’గా అనుసంధానించాం.
