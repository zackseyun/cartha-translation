  yaml_path: translation/ot/genesis/005/017.yaml
  text: So all the days of Mahalalel were eight hundred and ninety-five years, and he died.
translation:
  language: te
  text: మహలలేలు జీవించిన మొత్తం కాలం ఎనిమిది వందల తొంభై ఐదు సంవత్సరాలు; అతడు మరణించాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ כָּל יְמֵי
  choice: జీవించిన మొత్తం కాలం
  rationale: హీబ్రూ వంశావళి సూత్రంలోని ‘అతని దినాలన్నీ’ అనే భావాన్ని ఆధునిక తెలుగులో సహజంగా, సమగ్ర జీవితకాలాన్ని సూచించేలా వ్యక్తపరుస్తుంది.
- source_word: מַהֲלַלְאֵל
  choice: మహలలేలు
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు బైబిల్ వాడుకకు అనుగుణంగా లిప్యంతరీకరించింది.
- source_word: חָמֵשׁ וְתִשְׁעִים שָׁנָה וּשְׁמֹנֶה מֵאוֹת שָׁנָה
  choice: ఎనిమిది వందల తొంభై ఐదు సంవత్సరాలు
  rationale: హీబ్రూ సంఖ్యా భాగాలను వాటి సరైన మొత్తం విలువతో సహజమైన తెలుగు సంఖ్యాక్రమంలో అందిస్తుంది.
- source_word: וַיָּמֹת
  choice: ఆ తర్వాత అతడు చనిపోయాడు
  rationale: వంశావళిలో పునరావృతమయ్యే మరణ సూత్రాన్ని స్పష్టమైన, సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది; ‘ఆ తర్వాత’ కథన క్రమాన్ని తెలియజేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గంభీరమైన వంశావళి శైలి. హీబ్రూ పదబంధాన్ని యాంత్రికంగా ‘దినాలన్నీ’ అని కాకుండా, సాధారణ పాఠకులకు సహజమైన ‘జీవించిన మొత్తం కాలం’గా అనువదించబడింది.
