source:
  edition: WLC
  text: וַ/יִּֽהְי֣וּ יְמֵי אָדָ֗ם אַֽחֲרֵי֙ הוֹלִיד֣/וֹ אֶת שֵׁ֔ת שְׁמֹנֶ֥ה מֵאֹ֖ת שָׁנָ֑ה וַ/יּ֥וֹלֶד בָּנִ֖ים וּ/בָנֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/004.yaml
  text: After he fathered Seth[a], Adam lived eight hundred years and fathered sons and daughters.
translation:
  language: te
  text: షేతుకు తండ్రి అయిన తర్వాత, ఆదాము ఎనిమిది వందల సంవత్సరాలు జీవించాడు[a]. అతడు కుమారులకూ కుమార్తెలకూ తండ్రి అయ్యాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “షేతుకు తండ్రి అయిన తర్వాత ఆదాము దినాలు ఎనిమిది వందల సంవత్సరాలు అయ్యాయి.”
    reason: మూలంలోని ‘ఆదాము దినాలు ... అయ్యాయి’ అనే నుడికార రూపాన్ని చూపించడానికి.
lexical_decisions:
- source_word: וַיִּהְיוּ יְמֵי אָדָם
  choice: ఆదాము ... జీవించాడు
  rationale: హీబ్రూ పదబంధం అక్షరార్థంగా ‘ఆదాము దినాలు ... అయ్యాయి’ అని ఉన్నా, అది అతని జీవితకాలాన్ని తెలిపే నుడికారం. ఆధునిక తెలుగులో ‘జీవించాడు’ సహజంగా అదే భావాన్ని అందిస్తుంది.
- source_word: אָדָם
  choice: ఆదాము
  rationale: వంశావళి సందర్భంలో ఇది మానవజాతిని సూచించే సాధారణ నామం కాదు; వ్యక్తి పేరు.
- source_word: אַחֲרֵי הוֹלִידוֹ אֶת שֵׁת
  choice: షేతుకు తండ్రి అయిన తర్వాత
  rationale: הוליד అనే హిఫీల్ రూపం ‘కనడం/తండ్రి కావడం’ అనే పురుష-నిర్దిష్ట వంశావళి భావాన్ని కలిగిస్తుంది. ‘తండ్రి అయిన’ అనేది ఆధునిక తెలుగులో సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: שְׁמֹנֶה מֵאֹת שָׁנָה
  choice: ఎనిమిది వందల సంవత్సరాలు
  rationale: కాలవ్యవధిని తెలిపే సంఖ్యా పదబంధానికి నేరమైన, సహజమైన అనువాదం.
- source_word: וַיּוֹלֶד בָּנִים וּבָנוֹת
  choice: అతడు ఇంకా కుమారులకు, కుమార్తెలకు తండ్రి అయ్యాడు
  rationale: మూలంలోని ילד ధాతువు భావాన్ని కొనసాగిస్తూ, కుమారులు మరియు కుమార్తెలు అనే రెండు వర్గాలనూ స్పష్టంగా నిలుపుతుంది. వాక్య సమన్వయాన్ని తెలుగులో సహజంగా తెలియజేయడానికి ‘ఇంకా’ వాడబడింది.
theological_decisions:
- issue: אָדָם పదం యొక్క అర్థం
  choice: వ్యక్తి పేరుగా ‘ఆదాము’
  alternative: ‘మనిషి’ లేదా ‘మానవుడు’
  rationale: ఈ వంశావళి సందర్భంలో షేతుకు తండ్రిగా పేర్కొనబడిన నిర్దిష్ట వ్యక్తినే సూచిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనప్పటికీ గౌరవప్రదమైన వంశావళి శైలి. పురాతనంగా వినిపించే ‘కనెను’ వంటి రూపాలను నివారించి, మూలంలోని పురుష-నిర్దిష్ట జనన భావాన్ని ‘తండ్రి అయ్యాడు’ ద్వారా నిలిపాం.
