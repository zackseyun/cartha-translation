    text: హెబ్రీలో యెరెదు; అనేక అనువాదాల్లో సంప్రదాయంగా ‘యారెదు’ అని ఉంటుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: ఆ తరువాత ... అయ్యాయి (వాక్య నిర్మాణంలో సహజంగా సూచితం)
  rationale: వంశావళిలోని సారాంశ వాక్యాన్ని ముందున్న కథనానికి అనుసంధానించే wayyiqtol రూపం. తెలుగులో సహజమైన వాక్యప్రవాహం కోసం ప్రత్యేకంగా ‘మరియు’ అని పెట్టకుండా, చివరి ఉపవాక్యంలో ‘ఆ తరువాత’తో క్రమాన్ని స్పష్టం చేశాం.
- source_word: כָּל יְמֵי
  choice: జీవించిన రోజులన్నీ
  rationale: మొత్తం జీవితకాలాన్ని సూచించే హెబ్రీ వంశావళి నుడికారాన్ని దగ్గరగా, అదే సమయంలో సాధారణ తెలుగు పాఠకులకు స్పష్టంగా అందిస్తుంది.
- source_word: יֶרֶד
  choice: యెరెదు
  rationale: హెబ్రీ పేరులోని ధ్వనిరూపాన్ని తెలుగు లిపిలో నేరుగా ప్రతిబింబించే లిప్యంతరీకరణ.
- source_word: שְׁתַּיִם וְשִׁשִּׁים שָׁנָה וּתְשַׁע מֵאוֹת שָׁנָה
  choice: తొమ్మిది వందల అరవై రెండు సంవత్సరాలు
  rationale: హెబ్రీలోని 900 + 62 అనే మొత్తాన్ని ఆధునిక తెలుగు సంఖ్యాక్రమంలో సహజంగా వ్యక్తం చేస్తుంది; ‘సంవత్సరాలు’ను ఒక్కసారి ఉంచడం తెలుగులో సరళం.
- source_word: וַיָּמֹת
  choice: ఆ తరువాత అతడు చనిపోయాడు
  rationale: ఆ జీవితకాల సారాంశం ముగిసిన తరువాత సంభవించిన మరణాన్ని తెలిపే స్థిర వంశావళి సూత్రాన్ని సూటిగా అనువదిస్తుంది.
