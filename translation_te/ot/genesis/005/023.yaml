  text: So all the days of Enoch were three hundred sixty-five years.
translation:
  language: te
  text: హనోకు జీవించిన రోజులన్నీ మొత్తం మూడు వందల అరవై ఐదు సంవత్సరాలు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: మొత్తం ...
  rationale: వంశావళిలో జీవితకాలాన్ని ముగింపుగా సంక్షిప్తంగా తెలిపే వాక్య నిర్మాణం. తెలుగులో సహజంగా ఉండేందుకు ప్రత్యేకంగా ‘అప్పుడు/మరియు’ అని చేర్చకుండా, ‘మొత్తం’తో సారాంశ భావాన్ని వ్యక్తం చేశాం.
- source_word: כָּל יְמֵי
  choice: జీవించిన రోజులన్నీ
  rationale: అక్షరార్థంగా ‘రోజులన్నీ’; సందర్భంలో సంపూర్ణ జీవితకాలాన్ని సూచిస్తుంది. మూలంలోని ‘రోజులు’ అనే రూపకాన్ని ఉంచుతూ తెలుగులో అర్థం స్పష్టంగా ఉండేలా ‘జీవించిన’ చేర్చాం.
- source_word: חֲנוֹךְ
  choice: హనోకు
  rationale: వ్యక్తి పేరును ఆధునిక తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: חָמֵשׁ וְשִׁשִּׁים ... וּשְׁלֹשׁ מֵאוֹת
  choice: మూడు వందల అరవై ఐదు
  rationale: హీబ్రూలో సంఖ్యా భాగాల క్రమాన్ని యథాతథంగా అనుసరించకుండా, ఆధునిక తెలుగులో సహజమైన సంఖ్యా క్రమంలో ఇచ్చాం.
- source_word: שָׁנָה ... שָׁנָה
  choice: సంవత్సరాలు
  rationale: హీబ్రూలో సంఖ్యలతో ఏకవచన రూపం రెండుసార్లు వచ్చినా, తెలుగులో మొత్తం వయస్సును సహజంగా బహువచనంలో తెలిపాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన వంశావళి శైలి. మూలంలోని ‘రోజులు’ అనే భావాన్ని నిలిపి, అది జీవితకాలాన్ని సూచిస్తుందని సహజంగా స్పష్టం చేశాం.
