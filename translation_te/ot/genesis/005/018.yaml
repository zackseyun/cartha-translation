translation:
  language: te
  text: యెరెదు నూట అరవై రెండు సంవత్సరాలు జీవించాడు; అప్పుడు హనోకుకు తండ్రి అయ్యాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: జీవించి
  rationale: వంశావళి సూత్రంలో חיה అనే క్రియ వయస్సును తెలిపే ప్రకటనను ప్రారంభిస్తుంది. తదుపరి క్రియతో సహజంగా అనుసంధానించడానికి తెలుగులో ‘జీవించి’ అని అనువదించబడింది.
- source_word: יֶרֶד
  choice: యెరెదు
  rationale: హీబ్రూ పేరుకు సమీపంగా ఉండి, తెలుగు బైబిలు వాడుకలో గుర్తుపట్టదగిన రూపం.
- source_word: שְׁתַּיִם וְשִׁשִּׁים שָׁנָה וּמְאַת שָׁנָה
  choice: నూట అరవై రెండు సంవత్సరాలు
  rationale: హీబ్రూ సంఖ్యా నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగు క్రమంలో ఖచ్చితంగా వ్యక్తపరుస్తుంది.
- source_word: וַיּוֹלֶד
  choice: కన్నాడు
  rationale: వంశావళి సందర్భంలో ילד హిఫిల్ రూపం పురుష కర్తకు ‘సంతానాన్ని కన్నాడు/తండ్రి అయ్యాడు’ అనే భావాన్ని ఇస్తుంది. ‘కన్నాడు’ సంక్షిప్తంగా, సహజంగా ఉండి జనన సంబంధాన్ని తెలియజేస్తుంది.
- source_word: אֶת חֲנוֹךְ
  choice: హనోకును
  rationale: אֶת ప్రత్యక్ష కర్మ సూచకం తెలుగులో ప్రత్యేక పదంగా అనువదించబడదు; కర్మ విభక్తి పేరుకే జోడించబడింది. חֲנוֹךְకు మూలభాషకు సమీపమైన ‘హనోకు’ రూపం వాడబడింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళికి తగిన సంక్షిప్తమైన గంభీర శైలి. సంఖ్యను సహజ తెలుగు రూపంలో ఇచ్చి, పేర్లను హీబ్రూ ఉచ్చారణకు సమీపంగా ఉంచాం.
