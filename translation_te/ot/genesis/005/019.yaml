  text: וַֽ/יְחִי יֶ֗רֶד אַֽחֲרֵי֙ הוֹלִיד֣/וֹ אֶת חֲנ֔וֹךְ שְׁמֹנֶ֥ה מֵא֖וֹת שָׁנָ֑ה וַ/יּ֥וֹלֶד בָּנִ֖ים וּ/בָנֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/019.yaml
  text: And Yered lived eight hundred years after he fathered Hanokh[a], and he fathered sons and daughters.
translation:
  language: te
  text: యెరెదు హనోకుకు[a] తండ్రియైన తర్వాత ఎనిమిది వందల సంవత్సరాలు జీవించాడు; అతడు కుమారులకూ కుమార్తెలకూ తండ్రియయ్యాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఈ పేర్ల సాంప్రదాయ తెలుగు రూపాలు ‘యారెదు,’ ‘హనోకు’; ఆంగ్ల సంప్రదాయంలో ‘జారెడ్,’ ‘ఈనోక్’ అని ఉంటాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחִי
  choice: జీవించాడు
  rationale: వంశావళి సూత్రంలో חיה క్రియ పేర్కొన్న కాలవ్యవధిలో జీవించడాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘జీవించాడు’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: יֶרֶד
  choice: యెరెదు
  rationale: హీబ్రూ పేరైన יֶרֶד ధ్వనిరూపాన్ని తెలుగులో సమీపంగా ప్రతిబింబించే లిప్యంతరీకరణ.
- source_word: אַחֲרֵי
  choice: తరువాత
  rationale: పేర్కొన్న కుమారుడు పుట్టిన అనంతర కాలాన్ని సూచించే సాధారణ కాలసంబంధ పదం.
- source_word: הוֹלִידוֹ אֶת־חֲנוֹךְ
  choice: హనోకును కన్న
  rationale: హిఫిల్ ילד ఇక్కడ పురుష కర్తకు సంతానం కలగడాన్ని సూచిస్తుంది. ‘కన్న’ అనేది తెలుగు బైబిలు వంశావళి సందర్భంలో తండ్రిని కర్తగా కూడా వాడగల సంక్షిప్త, సహజ రూపం.
- source_word: חֲנוֹךְ
  choice: హనోకు
  rationale: హీబ్రూ חֲנוֹךְ పేరును సాంప్రదాయ ఆంగ్ల రూపం ద్వారా కాకుండా మూలధ్వనికి దగ్గరగా తెలుగులో లిప్యంతరీకరించింది.
- source_word: שְׁמֹנֶה מֵאוֹת שָׁנָה
  choice: ఎనిమిది వందల సంవత్సరాలు
  rationale: కాలవ్యవధిని తెలుగులో సహజమైన బహువచన రూపంతో వ్యక్తం చేస్తుంది.
- source_word: וַיּוֹלֶד בָּנִים וּבָנוֹת
  choice: అతనికి కుమారులు, కుమార్తెలు పుట్టారు
  rationale: హీబ్రూ వాక్యం మగ, ఆడ సంతానాన్ని విడిగా పేర్కొంటుంది. తెలుగు సహజ వాడుకలో తండ్రి విషయంగా ‘అతనికి ... పుట్టారు’ అనడం స్పష్టంగా ఉండి, రెండు వర్గాలనూ నిలుపుతుంది.
