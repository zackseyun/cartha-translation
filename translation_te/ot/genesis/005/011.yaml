  text: So all the days of Enosh were nine hundred and five years, and he died.
translation:
  language: te
  text: ఎనోషు జీవించిన మొత్తం కాలం తొమ్మిది వందల ఐదు సంవత్సరాలు; అతడు మరణించాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ כָּל יְמֵי
  choice: జీవించిన మొత్తం కాలం
  rationale: వంశావళి సందర్భంలో ఈ హీబ్రూ పదబంధం ఒక వ్యక్తి జీవించిన పూర్తి కాలాన్ని సూచిస్తుంది. ‘అతని దినాలన్నీ’ అనే అక్షరానువాదం కంటే ఈ రూపం ఆధునిక తెలుగులో సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: אֱנוֹשׁ
  choice: ఎనోషు
  rationale: హీబ్రూ పేరులోని ‘ష్’ ధ్వనిని నిలుపుతూ, తెలుగు వాక్యంలో సహజంగా ఉపయోగించగల లిప్యంతరీకరణ.
- source_word: חָמֵשׁ שָׁנִים וּתְשַׁע מֵאוֹת שָׁנָה
  choice: తొమ్మిది వందల ఐదు సంవత్సరాలు
  rationale: హీబ్రూలో సంఖ్య ‘ఐదు సంవత్సరాలు మరియు తొమ్మిది వందల సంవత్సరాలు’ అనే క్రమంలో ఉన్నా, దాని మొత్తం 905. తెలుగు సంఖ్యా ప్రయోగానికి అనుగుణంగా సహజ క్రమంలో ఇవ్వబడింది.
- source_word: וַיָּמֹת
  choice: ఆ తర్వాత అతడు చనిపోయాడు
  rationale: వంశావళిలోని ముగింపు సూత్రాన్ని స్పష్టంగా తెలుపుతుంది. హీబ్రూ కథన క్రమాన్ని ‘ఆ తర్వాత’ సూచిస్తుంది; ‘చనిపోయాడు’ సాధారణ ఆధునిక తెలుగులో సహజమైనది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా గౌరవప్రదమైన కథన శైలి వాడబడింది. మూలంలోని వంశావళి సూత్రార్థం నిలుపుతూ, అసహజమైన అక్షరానువాదాన్ని నివారించాం.
