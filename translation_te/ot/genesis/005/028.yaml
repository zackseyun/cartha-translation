  yaml_path: translation/ot/genesis/005/028.yaml
  text: And Lamech lived one hundred and eighty-two years, and fathered a son.
translation:
  language: te
  text: లెమెకు నూట ఎనభై రెండు సంవత్సరాలు నిండినప్పుడు, అతను ఒక కుమారునికి తండ్రి అయ్యాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: జీవించిన తర్వాత
  rationale: వంశావళి సూత్రంలో ఈ క్రియ, తరువాత చెప్పబడే సంతానోత్పత్తి సంఘటనకు ముందు గడిచిన జీవితకాలాన్ని సూచిస్తుంది; తెలుగులో ‘జీవించిన తర్వాత’ సహజంగా ఆ సంబంధాన్ని తెలియజేస్తుంది.
- source_word: לֶמֶךְ
  choice: లెమెకు
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగులో సాధారణంగా గుర్తించదగిన రూపంలో లిప్యంతరీకరించాం.
- source_word: שְׁתַּיִם וּשְׁמֹנִים שָׁנָה וּמְאַת שָׁנָה
  choice: నూట ఎనభై రెండు సంవత్సరాలు
  rationale: హీబ్రూ సంఖ్యా క్రమాన్ని సహజమైన తెలుగు సంఖ్యా క్రమంలో అందించాం.
- source_word: וַיּוֹלֶד
  choice: తండ్రి అయ్యాడు
  rationale: పురుష కర్తతో హిఫిల్ రూపంలోని ילד అంటే ‘కన్నాడు/కనేటట్లు చేశాడు, తండ్రి అయ్యాడు’; ఆధునిక తెలుగులో ‘తండ్రి అయ్యాడు’ సహజంగా, గౌరవప్రదంగా ఉంది.
- source_word: בֵּן
  choice: ఒక కుమారునికి
  rationale: కుమారుడు ఈ వచనంలో ఇంకా పేరుతో పరిచయం కాలేదు; అందువల్ల అనిర్దిష్ట భావాన్ని ‘ఒక’తో వ్యక్తం చేశాం. ‘తండ్రి అయ్యాడు’ అనే తెలుగు నిర్మాణానికి అనుగుణంగా చతుర్థీ విభక్తి వాడాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; వంశావళి శైలికి తగిన సంక్షిప్తతను నిలుపుతూ, పాతబడిన ‘కనెను’ వంటి రూపానికి బదులుగా సాధారణ పాఠకులకు సహజమైన ‘తండ్రి అయ్యాడు’ వాడాం.
