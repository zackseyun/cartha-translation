translation:
  language: te
  text: యెరెదుకు తండ్రైన తర్వాత మహలలేలు ఎనిమిది వందల ముప్పై సంవత్సరాలు జీవించాడు; అతడు కుమారులకూ కుమార్తెలకూ తండ్రయ్యాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: జీవించి
  rationale: వంశావళి సూత్రంలో పేరుపొందిన కుమారుడు పుట్టిన తర్వాత కొనసాగిన జీవితకాలాన్ని సూచిస్తుంది; తెలుగులో సహజంగా ‘జీవించి’ అని అనువదించాం.
- source_word: מַהֲלַלְאֵל
  choice: మహలలేలు
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: אַחֲרֵי הוֹלִידוֹ אֶת־יֶרֶד
  choice: యెరెదును కన్న తర్వాత
  rationale: אַחֲרֵי కాలానంతర సంబంధాన్ని సూచిస్తుంది; ילד హిఫీల్ పురుష కర్తతో తండ్రిగా సంతానాన్ని కనడాన్ని సూచిస్తుంది. తెలుగులో ‘కన్న తర్వాత’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: שְׁלֹשִׁים שָׁנָה וּשְׁמֹנֶה מֵאוֹת שָׁנָה
  choice: ఎనిమిది వందల ముప్పై సంవత్సరాలు
  rationale: హీబ్రూ పదక్రమాన్ని తెలుగు సంఖ్యా ప్రయోగానికి సహజమైన క్రమంలో ఉంచి, మొత్తం 830 సంవత్సరాలను యథాతథంగా తెలిపాం.
- source_word: וַיּוֹלֶד
  choice: కన్నాడు
  rationale: ముందున్న הוֹלִידוֹతో ఒకే ילד ధాతువును సాధ్యమైనంతవరకు ఒకే తెలుగు క్రియతో ప్రతిబింబించాం; పురుష కర్తకు ‘కన్నాడు’ ఆధునిక తెలుగులో సంతానాన్ని పొందాడనే అర్థంలో సహజం.
- source_word: בָּנִים וּבָנוֹת
  choice: కుమారులను కుమార్తెలను
  rationale: మూలపాఠం మగ, ఆడ సంతానాన్ని విడిగా పేర్కొంటుంది; సాధారణ ‘పిల్లలు’ కంటే ఈ వివరాన్ని నిలిపాం.
