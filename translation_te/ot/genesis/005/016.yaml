translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళి శైలికి తగిన గంభీరతతో కూడిన సరళ వాక్యం. మూలంలోని క్రియాపునరుక్తిని ‘కన్న’ రూపాలతో నిలిపి, సంఖ్యను సహజ తెలుగు క్రమంలో ఇచ్చాం.
