source:
  edition: WLC
  text: וַֽ/יְחִי שֵׁ֗ת אַֽחֲרֵי֙ הוֹלִיד֣/וֹ אֶת אֱנ֔וֹשׁ שֶׁ֣בַע שָׁנִ֔ים וּ/שְׁמֹנֶ֥ה מֵא֖וֹת שָׁנָ֑ה וַ/יּ֥וֹלֶד בָּנִ֖ים וּ/בָנֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/007.yaml
  text: After he fathered Enosh, Seth lived eight hundred and seven years and fathered sons and daughters.
translation:
  language: te
  text: ఎనోషును కనిన తర్వాత షేతు ఎనిమిది వందల ఏడు సంవత్సరాలు జీవించాడు, కుమారులనూ కుమార్తెలనూ కన్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: జీవించి
  rationale: వంశావళి సూత్రంలో నిర్దిష్ట సంఘటన తర్వాత షేతు జీవించిన కాలవ్యవధిని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: אֲחֲרֵי הוֹלִידוֹ אֶת־אֱנוֹשׁ
  choice: ఎనోషును కనిన తర్వాత
  rationale: కాలసంబంధమైన ‘తర్వాత’ భావాన్ని, హిఫిల్ రూపంలోని పితృత్వ/కనడం భావాన్ని సంక్షిప్తంగా నిలుపుతుంది. తెలుగులో పురుషుని విషయంగానూ ‘కన్నాడు/కనిన’ అనే వంశావళి ప్రయోగం సహజంగా అర్థమవుతుంది.
- source_word: שֶׁבַע שָׁנִים וּשְׁמֹנֶה מֵאוֹת שָׁנָה
  choice: ఎనిమిది వందల ఏడు సంవత్సరాలు
  rationale: హీబ్రూలో చిన్న సంఖ్య ముందున్నా, మొత్తం 807ను ఆధునిక తెలుగు సంఖ్యాక్రమంలో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: וַיּוֹלֶד
  choice: కన్నాడు
  rationale: వంశావళిలో సంతానానికి తండ్రి అయ్యాడనే భావాన్ని సాధారణ ఆధునిక తెలుగులో స్పష్టంగా అందిస్తుంది; ప్రాచీన శైలిలోని ‘కనెను’ను నివారిస్తుంది.
- source_word: בָּנִים וּבָנוֹת
  choice: కుమారులను కుమార్తెలను
  rationale: మూలంలోని మగ, ఆడ సంతానాల స్పష్టమైన ప్రస్తావనను ‘పిల్లలు’ అని సాధారణీకరించకుండా కాపాడుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; వంశావళికి తగిన గంభీరతను ఉంచుతూ, సాధారణ పాఠకులకు సులభమైన క్రియారూపాలు వాడబడ్డాయి. మూలంలోని వాక్యక్రమాన్ని సాధ్యమైనంతవరకు నిలిపి, సంఖ్యను తెలుగు సహజ క్రమంలో ఇచ్చాం.
