  yaml_path: translation/ot/genesis/005/008.yaml
  text: So all the days of Seth were nine hundred and twelve years, and he died.
translation:
  language: te
  text: షేతు జీవించిన రోజులన్నీ తొమ్మిది వందల పన్నెండు సంవత్సరాలు; అతడు చనిపోయాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ כָּל יְמֵי
  choice: జీవించిన రోజులన్నీ
  rationale: వంశావళిలో మొత్తం జీవితకాలాన్ని తెలిపే హెబ్రీయ సాధారణ సూత్రాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; ‘రోజులు’ అనే మూల రూపకాన్ని కూడా నిలుపుతుంది.
- source_word: שֵׁת
  choice: షేతు
  rationale: హెబ్రీయ వ్యక్తినామాన్ని తెలుగులో స్థిరపడిన బైబిలు రూపానికి సమీపంగా లిప్యంతరీకరించింది.
- source_word: שְׁתֵּים עֶשְׂרֵה שָׁנָה וּתְשַׁע מֵאוֹת שָׁנָה
  choice: తొమ్మిది వందల పన్నెండు సంవత్సరాలు
  rationale: మూలంలోని ‘పన్నెండు సంవత్సరాలు మరియు తొమ్మిది వందల సంవత్సరాలు’ అనే సంఖ్యా నిర్మాణాన్ని సహజ తెలుగు సంఖ్యాక్రమంలో 912గా అందిస్తుంది.
- source_word: וַיָּמֹת
  choice: ఆ తరువాత అతడు చనిపోయాడు
  rationale: వంశావళిలో పునరావృతమయ్యే మరణ ముగింపు సూత్రాన్ని స్పష్టంగా, గంభీరంగా తెలియజేస్తుంది; వావ్ కథన క్రమాన్ని ‘ఆ తరువాత’ సూచిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గంభీరమైన వంశావళి శైలి. మూలంలోని జీవితకాల సూత్రాన్ని పదశః కఠినత లేకుండా నిలిపి, సంఖ్యను సహజ తెలుగు క్రమంలో ఇచ్చింది.
