- from: లెమెకు నోవహుకు తండ్రి అయిన తరువాత ఐదువందల తొంభై ఐదు సంవత్సరాలు జీవించాడు. అతనికి కుమారులు, కుమార్తెలు పుట్టారు.
  to: లెమెకు నోవహుకు తండ్రైన తరువాత ఐదువందల తొంభై ఐదు సంవత్సరాలు జీవించాడు; అతడు కుమారులకూ కుమార్తెలకూ తండ్రి అయ్యాడు.
