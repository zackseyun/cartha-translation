source:
  edition: WLC
  text: וַֽ/יְחִי לֶ֗מֶךְ אַֽחֲרֵי֙ הוֹלִיד֣/וֹ אֶת נֹ֔חַ חָמֵ֤שׁ וְ/תִשְׁעִים֙ שָׁנָ֔ה וַ/חֲמֵ֥שׁ מֵאֹ֖ת שָׁנָ֑ה וַ/יּ֥וֹלֶד בָּנִ֖ים וּ/בָנֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/030.yaml
  text: And Lamech lived five hundred and ninety-five years after he fathered Noah[a], and he fathered sons and daughters.
translation:
  language: te
  text: లెమెకు నోవహుకు తండ్రైన తరువాత ఐదువందల తొంభై ఐదు సంవత్సరాలు జీవించాడు; అతడు కుమారులకూ కుమార్తెలకూ తండ్రి అయ్యాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: జీవించాడు
  rationale: ఆదికాండము 5 వంశావళి సూత్రంలో, పేర్కొన్న సంఘటన తరువాత గడిచిన జీవితకాలాన్ని తెలిపే సహజమైన తెలుగు పదం.
- source_word: אַחֲרֵי הוֹלִידוֹ אֶת־נֹחַ
  choice: నోవహుకు తండ్రి అయిన తరువాత
  rationale: הוליד అనే హిఫీల్ రూపంలోని పితృసంబంధ భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది; ‘కన్న తరువాత’ అనడం పురుషుని గురించి తెలుగులో అసహజంగా వినిపించవచ్చు.
- source_word: נֹחַ
  choice: నోవహు
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: חָמֵשׁ וְתִשְׁעִים שָׁנָה וַחֲמֵשׁ מֵאוֹת שָׁנָה
  choice: ఐదువందల తొంభై ఐదు సంవత్సరాలు
  rationale: హీబ్రూలోని 95 + 500 అనే మొత్తాన్ని తెలుగు సంఖ్యా క్రమానికి అనుగుణంగా సహజంగా వ్యక్తపరుస్తుంది.
- source_word: וַיּוֹלֶד בָּנִים וּבָנוֹת
  choice: అతనికి కుమారులు, కుమార్తెలు పుట్టారు
  rationale: మూలంలోని కుమారులు–కుమార్తెలు అనే స్పష్టమైన విభజనను నిలుపుతూ, పురుషుని సంతానోత్పత్తిని ఆధునిక తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన వంశావళి శైలి. హీబ్రూ వాక్యంలోని రెండు సమన్విత క్రియలను పఠన సౌలభ్యం కోసం రెండు వాక్యాలుగా ఇచ్చినా భావక్రమం యథాతథంగా ఉంచబడింది.
