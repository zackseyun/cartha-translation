  yaml_path: translation/ot/genesis/005/010.yaml
  text: And Enosh lived eight hundred and fifteen years after he fathered Kenan[c][b][a], and he fathered sons and daughters.
translation:
  language: te
  text: ఎనోషు కేనానుకు తండ్రి అయిన తర్వాత ఎనిమిది వందల పదిహేను సంవత్సరాలు జీవించాడు; అతడు కుమారులకూ కుమార్తెలకూ తండ్రి అయ్యాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: జీవించాడు
  rationale: వంశావళి సూత్రంలో חיה క్రియకు సహజమైన, అర్థస్పష్టమైన తెలుగు రూపం.
- source_word: אֱנוֹשׁ
  choice: ఎనోషు
  rationale: హీబ్రూ పేరైన אֱנוֹשׁ ధ్వనిని నేరుగా ప్రతిబింబించే తెలుగు లిప్యంతరీకరణ.
- source_word: אַחֲרֵי הוֹלִידוֹ אֶת קֵינָן
  choice: కేనానుకు తండ్రి అయిన తర్వాత
  rationale: హిఫిల్ ילד యొక్క పురుష వంశావళి దృష్టిని నిలుపుతూ ఆధునిక తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: חֲמֵשׁ עֶשְׂרֵה ... וּשְׁמֹנֶה מֵאוֹת שָׁנָה
  choice: ఎనిమిది వందల పదిహేను సంవత్సరాలు
  rationale: హీబ్రూలోని 15 + 800 మొత్తాన్ని తెలుగు సంఖ్యా క్రమంలో సహజంగా అందిస్తుంది.
- source_word: וַיּוֹלֶד בָּנִים וּבָנוֹת
  choice: అతనికి కుమారులు, కుమార్తెలు పుట్టారు
  rationale: మగ, ఆడ సంతానాన్ని హీబ్రూ వచనం చెప్పినట్లే ప్రత్యేకంగా నిలుపుతూ, తెలుగులో అసహజంగా ఉండే ‘తండ్రి అయ్యాడు’ పునరుక్తిని నివారిస్తుంది.
