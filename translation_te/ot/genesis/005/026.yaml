  yaml_path: translation/ot/genesis/005/026.yaml
  text: After he fathered Lamech, Methuselah lived 782 years and fathered sons and daughters.
translation:
  language: te
  text: లెమెకును కన్న తరువాత మెతూషెల ఏడు వందల ఎనభై రెండు సంవత్సరాలు జీవించాడు; కుమారులనూ కుమార్తెలనూ కన్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: జీవించి
  rationale: వంశావళి కథనంలో חיה అనే క్రియ, పేరుపెట్టి చెప్పిన కుమారుడు పుట్టిన తరువాత జీవించిన కాలాన్ని సూచిస్తుంది; తెలుగు వాక్యప్రవాహంలో ‘జీవించి’ సహజంగా ఉంటుంది.
- source_word: מְתוּשֶׁלַח
  choice: మెతూషెల
  rationale: హీబ్రూ వ్యక్తినామాన్ని ఆధునిక ప్రామాణిక తెలుగు లిపిలో ధ్వన్యనుసారంగా ఇచ్చాం.
- source_word: אַחֲרֵי
  choice: తరువాత
  rationale: లెమెకు జననం తరువాతి కాలాన్ని సూచించే కాలసంబంధ అవ్యయం.
- source_word: הוֹלִידוֹ אֶת־לֶמֶךְ
  choice: లెమెకును కన్న
  rationale: హిఫీల్ రూపం ఇక్కడ మెతూషెల లెమెకుకు తండ్రి కావడాన్ని సూచిస్తుంది. ‘కన్న’ అనేది సాధారణ తెలుగులో తండ్రికీ వర్తించే, సంక్షిప్తమైన వంశావళి ప్రయోగం.
- source_word: שְׁתַּיִם וּשְׁמוֹנִים שָׁנָה וּשְׁבַע מֵאוֹת שָׁנָה
  choice: ఏడు వందల ఎనభై రెండు సంవత్సరాలు
  rationale: హీబ్రూ సంఖ్యాక్రమంలోని మొత్తం 782ను తెలుగు సహజ సంఖ్యాక్రమంలో పదాలతో ఇచ్చాం.
- source_word: וַיּוֹלֶד
  choice: కన్నాడు
  rationale: ముందటి ילד రూపంతో భావసామ్యాన్ని నిలుపుతూ, తరువాత కలిగిన సంతానాన్ని సూచించేందుకు సహజమైన తెలుగు క్రియను వాడాం.
- source_word: בָּנִים וּבָנוֹת
  choice: కుమారులను కుమార్తెలను
  rationale: మూలంలో మగ, ఆడ సంతానం రెండింటినీ స్పష్టంగా పేర్కొన్నందున సాధారణ ‘పిల్లలు’ అని కాకుండా ఆ భేదాన్ని నిలిపాం.
