source:
  edition: WLC
  text: זֶ֣ה סֵ֔פֶר תּוֹלְדֹ֖ת אָדָ֑ם בְּ/י֗וֹם בְּרֹ֤א אֱלֹהִים֙ אָדָ֔ם בִּ/דְמ֥וּת אֱלֹהִ֖ים עָשָׂ֥ה אֹתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/001.yaml
  text: This is the book of the generations of Adam[a]. In the day God created man[b], he made him in the likeness of God.
translation:
  language: te
  text: ఇది ఆదాము వంశావళి గ్రంథం. దేవుడు మానవుణ్ణి[a] సృష్టించినప్పుడు, దేవుని పోలిక ప్రకారం అతనిని చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘మానవజాతిని’ అని కూడా అనువదించవచ్చు. ఇక్కడి హీబ్రూ పదం ఆదామును మాత్రమే కాక మానవాళిని ప్రతినిధిగా సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶה סֵפֶר
  choice: ఇది ... గ్రంథం
  rationale: నామవాక్యంలోని సూచనార్థక శీర్షికను సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది; סֵפֶר అనే లిఖిత పత్రం/గ్రంథం భావాన్ని నిలుపుతుంది.
- source_word: תּוֹלְדֹת אָדָם
  choice: ఆదాము వంశావళి
  rationale: ఇక్కడ תּוֹלְדֹת తరువాతి వంశపరంపరకు శీర్షికగా ఉంది; మొదటి אָדָם వ్యక్తినామమైన ఆదామును సూచిస్తుంది.
- source_word: בְּיוֹם בְּרֹא
  choice: సృష్టించినప్పుడు
  rationale: ‘సృష్టించిన దినమున’ అనే అక్షరార్థ నిర్మాణం ఇక్కడ కాలసూచక హీబ్రూ నుడికారంగా ‘సృష్టించినప్పుడు’ అనే భావాన్ని ఇస్తుంది; ఆధునిక తెలుగులో ఇదే సహజంగా ఉంది.
- source_word: אֱלֹהִים
  choice: దేవుడు
  rationale: ఈ సందర్భంలోని ఏకవచన క్రియాభావానికి అనుగుణమైన ప్రామాణిక తెలుగు అనువాదం.
- source_word: אָדָם
  choice: మానవుణ్ణి
  rationale: రెండవ ప్రయోగం సృష్టించబడిన మానవజాతిని ఏకవచన ప్రతినిధి రూపంలో సూచిస్తుంది; ‘మానవుణ్ణి’ వ్యక్తినామమైన ‘ఆదాము’తో గందరగోళాన్ని నివారిస్తుంది.
- source_word: בִּדְמוּת אֱלֹהִים
  choice: దేవుని పోలికలో
  rationale: דְּמוּת అంటే పోలిక/సాదృశ్యం; ‘స్వరూపం’ లేదా ‘ప్రతిరూపం’ అని మార్చకుండా మూలపద భేదాన్ని కాపాడుతుంది.
- source_word: עָשָׂה אֹתוֹ
  choice: అతణ్ణి చేశాడు
  rationale: עשה అనే విస్తృతార్థక క్రియకు ‘చేశాడు’ నేరమైన సమానం; ఏకవచన పుంలింగ సర్వనామాన్ని నిలుపుతుంది.
theological_decisions:
- issue: ఒకే వచనంలో אָדָם పదానికి ఉన్న రెండు ప్రయోగాలు
  choice: మొదటిది వ్యక్తినామంగా ‘ఆదాము’; రెండవది సాధారణ/ప్రతినిధి అర్థంలో ‘మానవుణ్ణి’
  alternative: రెండింటినీ ‘ఆదాము’ అని లేదా రెండవదాన్ని ‘మానవజాతిని’ అని అనువదించడం
  rationale: మొదటి ప్రయోగం వంశావళి మూలపురుషుని పేరు; రెండవది సృష్టి కథనాన్ని ప్రతిధ్వనిస్తూ మానవుణ్ణి సాధారణంగా సూచిస్తుంది. ప్రధాన పాఠంలో ఏకవచన రూపాన్ని ఉంచి, విస్తృత సామూహిక భావాన్ని పాదసూచికలో తెలియజేశాం.
- issue: దేవునితో సంబంధాన్ని తెలిపే דְּמוּת పదం
  choice: ‘పోలిక’ను నిలుపడం
  alternative: ‘స్వరూపం’ లేదా ‘ప్రతిరూపం’గా సమన్వయపరచడం
  rationale: ఇక్కడ צֶלֶם కాక דְּמוּת వాడబడింది. అందువల్ల సమీప సృష్టి వచనాల పదజాలంతో కలిపివేయకుండా మూలంలోని ప్రత్యేకతను కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘సృష్టించినప్పుడు’ ద్వారా హీబ్రూ కాలసూచక నుడికారాన్ని తెలుగులో స్పష్టంగా ఇచ్చాం; ‘వంశావళి గ్రంథం’ ద్వారా ఆదికాండంలోని నిర్మాణాత్మక శీర్షిక భావాన్ని నిలిపాం.
