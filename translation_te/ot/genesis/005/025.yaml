- from: మెతూషెల ఏడు వందల ఎనభై సంవత్సరాలు జీవించి, లెమెకును కన్నాడు.[a]
  to: మెతూషెలహు నూట ఎనభై ఏడు సంవత్సరాలు జీవించి, లెమెకుకు తండ్రి అయ్యాడు.[a]
