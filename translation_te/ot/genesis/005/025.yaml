  text: Methuselah lived one hundred and eighty-seven years and fathered Lamech[a].
translation:
  language: te
  text: మెతూషెలహు నూట ఎనభై ఏడు సంవత్సరాలు జీవించి, లెమెకుకు తండ్రి అయ్యాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘లెమెకును కన్నాడు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחִי
  choice: జీవించి
  rationale: వంశావళి సూత్రంలో חיה క్రియ జీవించిన కాలాన్ని తెలిపి, తరువాత సంతానం కలిగిన విషయానికి దారితీస్తుంది; తెలుగు వాక్యప్రవాహంలో ‘జీవించి’ సహజంగా ఉంది.
- source_word: מְתוּשֶׁלַח
  choice: మెతూషెల
  rationale: హీబ్రూ వ్యక్తినామాన్ని ఆధునిక ప్రామాణిక తెలుగు లిపిలో ధ్వన్యనుసారంగా రాశాం.
- source_word: שֶׁבַע וּשְׁמֹנִים שָׁנָה וּמְאַת שָׁנָה
  choice: నూట ఎనభై ఏడు సంవత్సరాలు
  rationale: హీబ్రూ సంఖ్యాక్రమం అక్షరార్థంగా ‘ఏడు మరియు ఎనభై... మరియు వంద’గా ఉన్నా, తెలుగులో సహజమైన సంఖ్యాక్రమం ‘నూట ఎనభై ఏడు’.
- source_word: וַיּוֹלֶד
  choice: కన్నాడు
  rationale: ילד హిఫీల్ రూపం పురుష వంశావళిలో ‘తండ్రి అయ్యాడు/కనెను’ అనే భావాన్ని ఇస్తుంది. ‘కన్నాడు’ సంక్షిప్తంగా, సాధారణ పాఠకులకు అర్థమయ్యే వంశావళి ప్రయోగం.
- source_word: אֶת
  choice: '[విడిగా అనువదించలేదు]'
  rationale: ఇది ప్రత్యక్ష కర్మ సూచిక; తెలుగులో విభక్తి ప్రత్యయం ద్వారా దాని వ్యాకరణ పాత్ర వ్యక్తమవుతుంది.
- source_word: לָמֶךְ
  choice: లెమెకు
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు ధ్వని సంప్రదాయానికి అనుగుణంగా లిప్యంతరీకరించి, కర్మవిభక్తితో ‘లెమెకును’గా వాక్యంలో వాడాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన వంశావళి శైలిని అనుసరించాం. అయితే సమర్పిత ప్రధాన పాఠ్యంలో సంఖ్య అనుకోకుండా ‘ఏడు వందల ఎనభై’గా నమోదైంది; మూలాధారానికి సరైన పాఠం ‘నూట ఎనభై ఏడు సంవత్సరాలు’. ప్రచురణకు ముందు ప్రధాన పాఠాన్ని తప్పనిసరిగా ఆ రూపానికి సవరించాలి.
