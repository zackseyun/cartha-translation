source:
  edition: WLC
  text: וַ/יִּתְהַלֵּ֥ךְ חֲנ֖וֹךְ אֶת הָֽ/אֱלֹהִ֑ים וְ/אֵינֶ֕/נּוּ כִּֽי לָקַ֥ח אֹת֖/וֹ אֱלֹהִֽים־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/024.yaml
  text: Enoch walked with God[a], and he was no more, because God took him.
translation:
  language: te
  text: హనోకు దేవునితో నడిచాడు; అతడు ఇక లేడు, ఎందుకంటే దేవుడు అతణ్ణి తీసుకున్నాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, ‘అతడు లేడు.’ హీబ్రూ పదబంధం హనోకు ఇక లేడని, అంటే ఇక ఉనికిలో/సన్నిధిలో లేడని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְהַלֵּךְ
  choice: నడిచాడు
  rationale: హిత్పయేల్ రూపం ఇక్కడ కేవలం శారీరక నడకను కాక, నిరంతర జీవన విధానాన్ని సూచిస్తుంది. ‘దేవునితో నడిచాడు’ అనే హీబ్రూ రూపకాన్ని తెలుగులో సహజంగా నిలుపుతుంది.
- source_word: אֶת הָאֱלֹהִים
  choice: దేవునితో
  rationale: הלך అనే క్రియతో אֶת సహవాసాన్ని సూచిస్తుంది; అందువల్ల ‘దేవునితో’ అనేది సూటియైన అర్థం.
- source_word: וְאֵינֶנּוּ
  choice: ఆ తర్వాత అతడు కనిపించలేదు
  rationale: హీబ్రూ పదబంధం అక్షరార్థంగా ‘అతడు లేడు’ అని ఉంటుంది; సందర్భంలో అతడు ఇక అక్కడ లేకపోవడాన్ని తెలుగులో సహజంగా తెలియజేస్తూ, అది ఎలా జరిగిందో నిర్దిష్టంగా చెప్పదు.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: హనోకు లేకపోవడానికి కారణాన్ని పరిచయం చేసే కారణార్థక సంధిగా సహజమైన తెలుగు రూపం.
- source_word: לָקַח אֹתוֹ
  choice: అతణ్ణి తీసుకున్నాడు
  rationale: לקח యొక్క సాధారణ అర్థం ‘తీసుకొను.’ దేవుడు అతణ్ణి సాధారణ మానవ జీవితం నుండి తొలగించాడనే భావం ఉన్నప్పటికీ, మూలపాఠం చెప్పినదానికంటే ఎక్కువగా వివరించకుండా ఈ రూపం నిలుపుతుంది.
- source_word: אֱלֹהִים
  choice: దేవుడు
  rationale: ఈ కథన సందర్భంలో ఏకైక దేవుణ్ణి సూచిస్తుంది.
theological_decisions:
- issue: హనోకు మరణించలేదని లేదా పరలోకానికి తీసుకుపోబడ్డాడని స్పష్టంగా చెప్పాలా?
  choice: ‘అతడు కనిపించలేదు, ఎందుకంటే దేవుడు అతణ్ణి తీసుకున్నాడు’ అనే మూలపాఠపు నిగ్రహమైన భావాన్ని నిలుపడం.
  alternative: ‘అతడు మరణించలేదు’; ‘దేవుడు అతణ్ణి పరలోకానికి తీసుకెళ్లాడు’; ‘దేవుడు అతణ్ణి రూపాంతరం చేశాడు.’
  rationale: ఈ వచనం అసాధారణమైన దైవిక తీసుకుపోవడాన్ని బలంగా సూచించినా, హీబ్రూ పాఠం ‘పరలోకానికి’ అని చెప్పదు; ఈ వచనంలో మరణాన్ని నేరుగా నిరాకరించదు. కాబట్టి తరువాతి వ్యాఖ్యానాన్ని ప్రధాన పాఠ్యంలో చేర్చకుండా అసలు వచనంలోని ఉద్దేశపూర్వక సంక్షిప్తతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన, గౌరవప్రదమైన శైలి. హీబ్రూ రూపకమైన ‘దేవునితో నడిచాడు’ అలాగే నిలుపబడింది; వచనం చెప్పనిదాన్ని సిద్ధాంతపరంగా విస్తరించలేదు.
