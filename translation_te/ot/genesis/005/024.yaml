revisions:
- from: హనోకు దేవునితో నడిచాడు. ఆ తర్వాత అతడు కనిపించలేదు[a], ఎందుకంటే దేవుడు అతణ్ణి తీసుకున్నాడు.
  to: హనోకు దేవునితో నడిచాడు; అతడు ఇక లేడు, ఎందుకంటే దేవుడు అతణ్ణి తీసుకున్నాడు.[a]
  rationale: The revision replaces the interpretively observational ‘కనిపించలేదు’ with ‘ఇక లేడు,’ which reflects the Hebrew idiom more directly and preserves its restraint concerning the manner and destination of God’s taking Enoch. The footnote removes the unsupported locative detail while explaining the expression’s sense of absence. No doctrinal conclusion about death or heaven has been added.
  reviewer_model: gpt-5.6-terra
