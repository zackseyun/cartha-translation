  variant: modern standard Telugu
source:
  edition: WLC
  text: וַֽ/יְהִי נֹ֕חַ בֶּן חֲמֵ֥שׁ מֵא֖וֹת שָׁנָ֑ה וַ/יּ֣וֹלֶד נֹ֔חַ אֶת שֵׁ֖ם אֶת חָ֥ם וְ/אֶת יָֽפֶת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/032.yaml
  text: When Noah was five hundred years old[a], he fathered Shem, Ham[b], and Japheth.
translation:
  language: te
  text: నోవహుకు ఐదువందల ఏళ్లు వచ్చినప్పుడు, అతడు షేము, హాము, యాపెతులకు తండ్రి అయ్యాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘షేము, హాము, యాపెతు’ అనే పేర్ల క్రమం హీబ్రూ పాఠాన్ని అనుసరిస్తుంది. ఇది తప్పనిసరిగా వారి జననక్రమాన్ని సూచించదు; ముగ్గురూ ఒకే సంవత్సరంలో పుట్టారని కూడా తప్పనిసరిగా అర్థం కాదు.
    reason: cross_reference
lexical_decisions:
- source_word: וַיְהִי
  choice: వచ్చినప్పుడు
  rationale: ఇక్కడ היה యొక్క వావ్-క్రమ రూపం కాలసంబంధ నేపథ్యాన్ని పరిచయం చేస్తుంది. తెలుగులో ‘వచ్చినప్పుడు’ ఆ విధిని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בֶּן חֲמֵשׁ מֵאוֹת שָׁנָה
  choice: ఐదువందల ఏళ్లు
  rationale: בן + సంఖ్య + שנה అనే హీబ్రూ నుడికారం వయసును సూచిస్తుంది; ‘నోవహుకు ... ఏళ్లు వచ్చినప్పుడు’ ఆధునిక తెలుగులో సహజమైన సమానార్థక నిర్మాణం.
- source_word: וַיּוֹלֶד
  choice: తండ్రి అయ్యాడు
  rationale: పురుష కర్తతో ילד హిఫీల్ రూపం ‘సంతానానికి తండ్రి కావడం/కనడం’ అనే అర్థం ఇస్తుంది. ‘తండ్రి అయ్యాడు’ ఖచ్చితమైనదీ, సాధారణ పాఠకులకు సహజమైనదీ; ‘కనెను’ ప్రాచీన శైలిగా వినిపిస్తుంది.
- source_word: נֹחַ
  choice: నోవహు
  rationale: తెలుగులో స్థిరపడిన బైబిలు వ్యక్తినామ రూపం.
- source_word: שֵׁם
  choice: షేము
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగులో స్థిరపడిన రూపంలో లిప్యంతరీకరించాం.
- source_word: חָם
  choice: హాము
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగులో స్థిరపడిన రూపంలో లిప్యంతరీకరించాం.
- source_word: יָפֶת
  choice: యాపెతు
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగులో స్థిరపడిన రూపంలో లిప్యంతరీకరించాం.
theological_decisions:
- issue: ‘షేము, హాము, యాపెతు’ అనే వరుస జననక్రమాన్ని లేదా ముగ్గురూ ఒకే సంవత్సరంలో పుట్టారని సూచిస్తుందా?
  choice: హీబ్రూ పాఠంలోని పేర్ల వరుసను అలాగే ఉంచి, ప్రధాన వాక్యంలో జననక్రమాన్ని గానీ ఒకే సంవత్సరంలో జన్మించారని గానీ నిర్ధారించలేదు.
  alternative: ఊహించిన జననక్రమం ప్రకారం పేర్లను మార్చడం, లేదా ముగ్గురూ నోవహు ఐదువందలవ ఏటనే పుట్టారని స్పష్టంగా చెప్పడం.
  rationale: హీబ్రూ పాఠం పేర్లను ఈ క్రమంలో ఇస్తుంది; అయితే ఆ క్రమమే ఖచ్చితమైన జననక్రమమని లేదా ముగ్గురి జననాలూ ఒకే సంవత్సరంలో జరిగాయని తప్పనిసరిగా చెప్పదు. అందువల్ల పాఠంలోని ఉద్వేగాన్ని పరిష్కరించకుండా నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. హీబ్రూ కథనంలోని నామపునరుక్తిని తెలుగులో సహజంగా ఉండేందుకు ‘అతడు’తో ఇచ్చాం; అర్థనష్టం లేదు.
