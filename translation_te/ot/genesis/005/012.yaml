base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/012.yaml
  text: Kenan lived seventy years and fathered Mahalalel[a].
translation:
  language: te
  text: కేనాను డెబ్బై సంవత్సరాల వయసులో మహలలేలుకు తండ్రి అయ్యాడు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, మరింత సంప్రదాయబద్ధంగా, “కేనాను డెబ్బై సంవత్సరాల వయసులో మహలలేలును కనెను.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחִי
  choice: జీవించి
  rationale: వంశావళి సూత్రంలో חיה అంటే ‘జీవించు.’ తరువాతి క్రియతో సహజంగా అనుసంధానించడానికి అసమాపక క్రియారూపం వాడబడింది.
- source_word: קֵינָן
  choice: కేనాను
  rationale: హీబ్రూ పేరును తెలుగు బైబిలు నామరూపాలకు అనుగుణంగా లిప్యంతరీకరించిన రూపం.
- source_word: שִׁבְעִים שָׁנָה
  choice: డెబ్బై సంవత్సరాలు
  rationale: ఇది మహలలేలుకు తండ్రి అయినప్పటి కేనాను వయస్సును తెలిపే కాలవ్యవధి ప్రయోగం.
- source_word: וַיּוֹלֶד
  choice: తండ్రి అయ్యాడు
  rationale: వంశావళి సందర్భంలో ילד యొక్క హిఫీల్ రూపం పురుషుడు సంతానానికి జనకుడవడాన్ని సూచిస్తుంది. ‘తండ్రి అయ్యాడు’ ఆధునిక తెలుగులో సహజంగా, స్పష్టంగా ఉంది; ‘కనెను’ మరింత సంప్రదాయబద్ధమైన ప్రత్యామ్నాయం.
- source_word: אֶת
  choice: '[ప్రత్యేకంగా అనువదించలేదు]'
  rationale: ఇది హీబ్రూలో నిర్దిష్ట కర్మను సూచించే వ్యాకరణ చిహ్నం; తెలుగులో దీనికి ప్రత్యేక పదం అవసరం లేదు.
- source_word: מַהֲלַלְאֵל
  choice: మహలలేలు
  rationale: హీబ్రూ వ్యక్తి పేరును తెలుగు బైబిలు నామరూపాలకు అనుగుణంగా లిప్యంతరీకరించిన రూపం.
