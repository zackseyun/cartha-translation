translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వంశావళి శైలి. ప్రధాన పాఠంలో స్పష్టమైన ‘తండ్రి అయ్యాడు’ అనే రూపాన్ని ఉంచి, సంప్రదాయబద్ధమైన ‘కనెను’ రూపాన్ని పాదసూచికలో ఇచ్చాం.
