- from: మహలలేలు పుట్టిన తర్వాత కేనాను ఎనిమిది వందల నలభై సంవత్సరాలు జీవించాడు. అతనికి కుమారులు, కుమార్తెలు పుట్టారు.
  to: మహలలేలుకు తండ్రి అయిన తర్వాత కేనాను ఎనిమిది వందల నలభై సంవత్సరాలు జీవించాడు; అతను కుమారులకూ కుమార్తెలకూ తండ్రి అయ్యాడు.
  rationale: The revision retains the names, 840-year duration, sequence, and explicit sons-and-daughters wording, while replacing passive birth expressions with natural Telugu wording that directly represents Kenan as father, as required by both occurrences of Hebrew ילד in the Hiphil.
