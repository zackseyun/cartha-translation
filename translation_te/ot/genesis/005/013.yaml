  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְחִ֣י קֵינָ֗ן אַחֲרֵי֙ הוֹלִיד֣/וֹ אֶת מַֽהֲלַלְאֵ֔ל אַרְבָּעִ֣ים שָׁנָ֔ה וּ/שְׁמֹנֶ֥ה מֵא֖וֹת שָׁנָ֑ה וַ/יּ֥וֹלֶד בָּנִ֖ים וּ/בָנֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/013.yaml
  text: And Kenan lived eight hundred and forty years after he fathered Mahalalel[b][a], and he fathered sons and daughters.
translation:
  language: te
  text: మహలలేలుకు తండ్రి అయిన తర్వాత కేనాను ఎనిమిది వందల నలభై సంవత్సరాలు జీవించాడు; అతను కుమారులకూ కుమార్తెలకూ తండ్రి అయ్యాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: జీవించాడు
  rationale: వంశావళిలో ఒక వ్యక్తి జీవించిన కాలాన్ని తెలిపే חיה క్రియకు సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: קֵינָן
  choice: కేనాను
  rationale: హీబ్రూ קֵינָן పేరుకు దగ్గరగా ఉండే, తెలుగులో సులభంగా పలకగల లిప్యంతరీకరణ.
- source_word: אַחֲרֵי הוֹלִידוֹ אֶת מַהֲלַלְאֵל
  choice: మహలలేలు పుట్టిన తర్వాత
  rationale: హిఫిల్ ילד తండ్రి ద్వారా సంతానం కలగడాన్ని సూచిస్తుంది; తెలుగులో ‘పుట్టిన తర్వాత’ అనేది సంబంధాన్ని సందర్భం ద్వారా స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: אַרְבָּעִים שָׁנָה וּשְׁמֹנֶה מֵאוֹת שָׁנָה
  choice: ఎనిమిది వందల నలభై సంవత్సరాలు
  rationale: హీబ్రూలోని సంఖ్యా భాగాల మొత్తం 840; తెలుగు సహజ సంఖ్యా క్రమంలో అందించబడింది.
- source_word: וַיּוֹלֶד בָּנִים וּבָנוֹת
  choice: అతనికి కుమారులు, కుమార్తెలు పుట్టారు
  rationale: మగ వ్యక్తి సంతానోత్పత్తిని తెలిపే హిఫిల్ ילד భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తూ, בָּנִים וּבָנוֹת లోని స్త్రీపురుష సంతాన భేదాన్ని నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; వంశావళి శైలికి తగిన గంభీరతను ఉంచుతూ, కృత్రిమమైన ‘కనెను’ వంటి పాత రూపాల బదులు సాధారణ పాఠకులకు సహజమైన వాక్య నిర్మాణం వాడబడింది.
