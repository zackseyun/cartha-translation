id: GEN.5.22
reference: Genesis 5:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּתְהַלֵּ֨ךְ חֲנ֜וֹךְ אֶת הָֽ/אֱלֹהִ֗ים אַֽחֲרֵי֙ הוֹלִיד֣/וֹ אֶת מְתוּשֶׁ֔לַח שְׁלֹ֥שׁ מֵא֖וֹת שָׁנָ֑ה וַ/יּ֥וֹלֶד בָּנִ֖ים וּ/בָנֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/022.yaml
  text: Enoch walked with God three hundred years after he fathered Methuselah[b][a], and he fathered sons and daughters.
translation:
  language: te
  text: మెతూషెలహుకు తండ్రైన తరువాత హనోకు మూడు వందల సంవత్సరాలు దేవునితో నడిచాడు[a]; అతడు కుమారులకు, కుమార్తెలకు తండ్రయ్యాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దేవునితో సహవాసంలో జీవించాడు.’ హీబ్రూ నుడికారం అక్షరార్థంగా ‘దేవునితో నడిచాడు’ అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְהַלֵּךְ ... אֶת הָאֱלֹהִים
  choice: దేవునితో నడిచాడు
  rationale: హిత్పయేల్ రూపంలోని ‘నడుచు’ అనే క్రియ, אֶת הָאֱלֹהִיםతో కలిసి, దేవునితో సంబంధంలో సాగిన జీవన విధానాన్ని సూచించే రూపకం. దాని భావవిస్తృతిని కుదించకుండా తెలుగు ప్రధాన పాఠ్యంలో రూపకాన్నే నిలిపాం.
- source_word: אַחֲרֵי הוֹלִידוֹ אֶת מְתוּשֶׁלַח
  choice: మెతూషెలహును కనిన తరువాత
  rationale: אַחֲרֵי కాలసంబంధమైన ‘తరువాత’ అనే అర్థంలో ఉంది. ילד హిఫీల్ రూపం పురుషుడు సంతానానికి తండ్రి కావడాన్ని సూచిస్తుంది; ‘కనిన’ అనేది సంక్షిప్తమైన, సహజమైన తెలుగు వ్యక్తీకరణ.
- source_word: שְׁלֹשׁ מֵאוֹת שָׁנָה
  choice: మూడు వందల సంవత్సరాలు
  rationale: సంఖ్యా వ్యక్తీకరణను నేరుగా అనువదించాం; ఇది హనోకు దేవునితో నడిచిన కాలవ్యవధిని సూచిస్తుంది.
- source_word: וַיּוֹלֶד בָּנִים וּבָנוֹת
  choice: అతడు కుమారులను, కుమార్తెలను కన్నాడు
  rationale: మూలంలో కుమారులు, కుమార్తెలు అని రెండూ స్పష్టంగా ఉన్నందున ‘పిల్లలు’ అని సాధారణీకరించకుండా వాటిని విడివిడిగా నిలిపాం.
- source_word: מְתוּשֶׁלַח
  choice: మెతూషెలహు
  rationale: హీబ్రూ వ్యక్తినామానికి సమీపంగా, తెలుగులో సులభంగా చదవదగిన లిప్యంతరీకరణను వాడాం.
theological_decisions:
- issue: ‘దేవునితో నడిచాడు’ అనే మాటలో హనోకు–దేవుని సంబంధ స్వభావం
  choice: ప్రధాన పాఠ్యంలో సంబంధాత్మక రూపకాన్ని యథాతథంగా నిలపడం
  alternative: దేవునితో సహవాసంలో జీవించాడు / దేవుని ఎదుట నమ్మకంగా జీవించాడు
  rationale: మూల హీబ్రూ మాట సహవాసం, జీవన విధానం, నమ్మకత్వం వంటి భావాలను సూచించగలిగినా వాటిలో ఒక్కదానికే దానిని పరిమితం చేయదు. అందువల్ల వ్యాఖ్యానాత్మకంగా తీర్మానించకుండా రూపకాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన వాక్యక్రమాన్ని వాడుతూ, ‘దేవునితో నడిచాడు’ అనే గంభీరమైన మూల రూపకాన్ని నిలిపాం. ‘మూడు వందల సంవత్సరాలు’ అనేది హనోకు నడక యొక్క కాలవ్యవధి అని స్పష్టమయ్యేలా దానిని ప్రధాన క్రియతో ఉంచాం.
