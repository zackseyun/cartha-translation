    text: లేదా, ‘దేవునితో సహవాసంలో జీవించాడు.’ హీబ్రూ నుడికారం అక్షరార్థంగా ‘దేవునితో నడిచాడు’ అని ఉంది.
    reason: lexical_alternative
  revision_rationale: The revision replaces potentially maternally marked uses of ‘కను’ with explicit paternal language, reflecting the Hebrew Hiphil and Enoch’s male role in the genealogy. It otherwise preserves the draft’s faithful rendering of the idiom, chronology, duration, names, and explicit reference to both sons and daughters.
