  text: Seth lived 105 years and fathered Enosh[a].
translation:
  language: te
  text: షేతు నూట ఐదు సంవత్సరాలు జీవించినప్పుడు, ఎనోషుకు తండ్రి అయ్యాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, మరింత అక్షరార్థంగా, “ఎనోషును కన్నాడు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחִי
  choice: జీవించిన తరువాత
  rationale: వంశావళి వయస్సు సూత్రంలో חיה ‘జీవించు’ అని అర్థం; తరువాత వచ్చే జనన సంఘటనతో సహజమైన తెలుగు వాక్యసంబంధం కోసం ‘జీవించిన తరువాత’ అని అనువదించాం.
- source_word: שֵׁת
  choice: షేతు
  rationale: హీబ్రూ שֵׁת పేరుకు దగ్గరగా ఉండే, తెలుగులో స్థిరపడిన రూపాన్ని వాడాం.
- source_word: חָמֵשׁ שָׁנִים וּמְאַת שָׁנָה
  choice: 105 సంవత్సరాలు
  rationale: హీబ్రూ పదక్రమం అక్షరార్థంగా ‘ఐదు సంవత్సరాలు మరియు నూరు సంవత్సరం’; దాని ఖచ్చితమైన సంఖ్యార్థాన్ని ఆధునిక తెలుగు అంకెలతో స్పష్టంగా తెలిపాం.
- source_word: וַיּוֹלֶד
  choice: తండ్రి అయ్యాడు
  rationale: వంశావళి సందర్భంలో ילד పురుష కర్తతో ‘కన్నాడు/తండ్రి అయ్యాడు’ అనే భావం ఇస్తుంది. ఆధునిక, గౌరవప్రదమైన తెలుగులో సహజంగా ఉండేందుకు ‘తండ్రి అయ్యాడు’ ఎంచుకున్నాం.
- source_word: אֶת אֱנוֹשׁ
  choice: ఎనోషుకు
  rationale: אֶת అనే ప్రత్యక్ష కర్మ సూచికను విడిగా అనువదించాల్సిన అవసరం లేదు. ‘తండ్రి అయ్యాడు’ అనే తెలుగు నిర్మాణానికి అనుగుణంగా పేరును చతుర్థీ విభక్తిలో ఇచ్చాం; אֱנוֹשׁను హీబ్రూకు దగ్గరగా ‘ఎనోషు’గా లిప్యంతరీకరించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన వంశావళి శైలిని అనుసరించాం. ప్రధాన పాఠంలో సహజమైన ‘తండ్రి అయ్యాడు’ను ఉంచి, మూలంలోని జనన క్రియకు దగ్గరైన రూపాన్ని పాదసూచికలో ఇచ్చాం.
