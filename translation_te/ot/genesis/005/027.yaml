  text: So all the days of Methuselah were nine hundred sixty-nine years, and he died.
translation:
  language: te
  text: మెతూషెలహు జీవించిన రోజులన్నీ తొమ్మిది వందల అరవై తొమ్మిది సంవత్సరాలు. ఆ తర్వాత అతడు చనిపోయాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ כָּל יְמֵי
  choice: జీవించిన రోజులన్నీ
  rationale: హీబ్రూ వంశావళి సూత్రంలోని ‘అతని రోజులన్నీ’ అనే రూపాన్ని భావస్పష్టతతో, సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; ‘జీవితకాలం’ కంటే మూలంలోని ‘రోజులు’ రూపాన్ని నిలుపుతుంది.
- source_word: מְתוּשֶׁלַח
  choice: మెతూషెలహు
  rationale: హీబ్రూ పేరును తెలుగు ధ్వన్యనుసారంగా లిప్యంతరీకరించింది.
- source_word: תֵּשַׁע וְשִׁשִּׁים ... וּתְשַׁע מֵאוֹת שָׁנָה
  choice: తొమ్మిది వందల అరవై తొమ్మిది సంవత్సరాలు
  rationale: హీబ్రూ సంఖ్య 969ను సహజమైన తెలుగు సంఖ్యాక్రమంలో అందిస్తుంది.
- source_word: וַיָּמֹת
  choice: ఆ తర్వాత అతడు చనిపోయాడు
  rationale: వంశావళిలోని ముగింపు సంఘటనను సహజమైన కథన తెలుగులో తెలియజేస్తుంది; వావ్ అనుక్రమణను కాలక్రమ సంబంధంగా వ్యక్తం చేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వంశావళి శైలి. మూలంలోని పునరావృత ‘రోజులు’ సూత్రాన్ని సహజంగా నిలిపింది.
