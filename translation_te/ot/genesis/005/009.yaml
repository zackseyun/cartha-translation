  yaml_path: translation/ot/genesis/005/009.yaml
  text: Enosh lived ninety years and fathered Kenan[a][b].
translation:
  language: te
  text: ఎనోషు తొంభై సంవత్సరాలు జీవించాడు, కేనానును కన్నాడు[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: పాత తెలుగు అనువాదాల్లో ఇక్కడ సాధారణంగా ‘కనెను’ అని ఉంటుంది; హీబ్రూ క్రియ వంశావళి సందర్భంలో ఆధునిక తెలుగులో ‘కన్నాడు’ అని సహజంగా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: కొన్ని అనువాద సంప్రదాయాల్లో గ్రీకు రూపాన్ని అనుసరించి ఈ పేరు ‘కైనాను’ అని ఉంటుంది; హీబ్రూ పాఠంలో పేరు ‘కేనాను’గా ఉంది.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְחִי
  choice: జీవించి
  rationale: వంశావళిలో వయస్సును తెలిపే ఈ సూత్రబద్ధ వాక్యంలో חיה అంటే ‘జీవించాడు’; తరువాతి క్రియతో సహజంగా కలపడానికి తెలుగులో ‘జీవించి’ అని ఇచ్చాం.
- source_word: אֱנוֹשׁ
  choice: ఎనోషు
  rationale: హీబ్రూ אֱנוֹשׁ రూపాన్ని ఆధారంగా చేసుకున్న ఆధునిక తెలుగు లిప్యంతరీకరణ.
- source_word: תִּשְׁעִים שָׁנָה
  choice: తొంభై సంవత్సరాలు
  rationale: హీబ్రూ వయస్సు వ్యక్తీకరణకు సహజమైన తెలుగు బహువచన రూపం.
- source_word: וַיּוֹלֶד
  choice: తండ్రి అయ్యాడు
  rationale: వంశావళిలో పురుష కర్తతో వచ్చిన ילד హిఫీల్ రూపం సంతానానికి తండ్రి కావడాన్ని సూచిస్తుంది. ‘కన్నాడు’ కంటే ఇది తెలుగులో లింగపరంగా స్పష్టమూ సహజమూ; ప్రాచీన శైలిలోని ‘కనెను’ను నివారిస్తుంది.
- source_word: אֶת
  choice: '[ప్రత్యేకంగా అనువదించలేదు]'
  rationale: ఇది ప్రత్యక్ష కర్మ సూచిక; తెలుగులో దీనికి స్వతంత్ర పదం అవసరం లేదు, విభక్తి ద్వారా సంబంధం వ్యక్తమవుతుంది.
- source_word: קֵינָן
  choice: కేనాను
  rationale: మసొరెటిక్ హీబ్రూ קֵינָן రూపానికి దగ్గరైన తెలుగు లిప్యంతరీకరణ; వాక్యంలో చతుర్థీ విభక్తితో ‘కేనానుకు’గా ఉంది.
