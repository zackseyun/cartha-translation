  variant: modern standard Telugu
source:
  edition: WLC
  text: וַֽ/יְחִ֣י אָדָ֗ם שְׁלֹשִׁ֤ים וּ/מְאַת֙ שָׁנָ֔ה וַ/יּ֥וֹלֶד בִּ/דְמוּת֖/וֹ כְּ/צַלְמ֑/וֹ וַ/יִּקְרָ֥א אֶת שְׁמ֖/וֹ שֵֽׁת־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/003.yaml
  text: Adam lived one hundred thirty years and fathered a son in his likeness[a], according to his image[c][b], and called his name Seth.
translation:
  language: te
  text: ఆదాము నూట ముప్పై సంవత్సరాలు జీవించి, తన పోలికలో, తన స్వరూపం ప్రకారం[a] ఒక కుమారునికి తండ్రియయ్యాడు. అతనికి షేతు అని పేరు పెట్టాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఈ మాటలు ఆదికాండము 1:26–27ను ప్రతిధ్వనింపజేస్తాయి. హీబ్రూలోని ‘తండ్రియయ్యాడు’ అనే భావం అక్షరార్థంగా ‘కనెను’; పురుష కర్తతో అది తండ్రిగా సంతానాన్ని కనడాన్ని సూచిస్తుంది.
    reason: cross_reference; lexical_alternative
lexical_decisions:
- source_word: וַיְחִי
  choice: జీవించి
  rationale: వంశావళిలో సంతానం కలిగినప్పటి వయస్సును తెలిపే חיה క్రియారూపానికి సహజమైన తెలుగు ప్రయోగం.
- source_word: אָדָם
  choice: ఆదాము
  rationale: ఇక్కడ సాధారణ ‘మనిషి’ అనే అర్థం కాకుండా మొదటి మనిషి వ్యక్తినామంగా ఉంది.
- source_word: שְׁלֹשִׁים וּמְאַת שָׁנָה
  choice: నూట ముప్పై సంవత్సరాలు
  rationale: హీబ్రూ సంఖ్యా పదబంధాన్ని స్పష్టమైన, సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וַיּוֹלֶד
  choice: ఒక కుమారుణ్ణి కనెను
  rationale: పురుష కర్తతో హిఫిల్ రూపంలోని ילד ‘కనడం/తండ్రి కావడం’ను సూచిస్తుంది. తెలుగు బైబిలు కథన శైలిలో ‘కుమారుణ్ణి కనెను’ సహజంగా ఉండి, సందర్భంలో అంతర్లీనమైన కుమారుణ్ణి స్పష్టం చేస్తుంది.
- source_word: בִּדְמוּתוֹ
  choice: తన పోలికలో
  rationale: דמות సూచించే పోలిక లేదా సాదృశ్యాన్ని నేరుగా నిలుపుతుంది.
- source_word: כְּצַלְמוֹ
  choice: తన స్వరూపం ప్రకారం
  rationale: צלםకు ‘స్వరూపం’, כకు ‘ప్రకారం’ అని ఇచ్చి ఆదికాండము 1:26–27లోని భాషా ప్రతిధ్వనిని నిలుపుతుంది; ‘పోలిక’ మరియు ‘స్వరూపం’ మధ్య పదభేదాన్నీ కాపాడుతుంది.
- source_word: וַיִּקְרָא אֶת־שְׁמוֹ שֵׁת
  choice: అతనికి షేతు అని పేరు పెట్టాడు
  rationale: ‘అతని పేరును పిలిచాడు’ అనే హీబ్రూ నుడికారానికి సహజమైన ఆధునిక తెలుగు సమానార్థకం.
- source_word: שֵׁת
  choice: షేతు
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగులో ధ్వన్యనుసారంగా లిప్యంతరీకరించింది.
theological_decisions:
- issue: ఆదాము కుమారుడు ఆదాము పోలికలో, స్వరూపం ప్రకారం ఉండడం
  choice: ఈ వాక్యాన్ని ఆదాముతో కుమారుని సాదృశ్యంగా నేరుగా అనువదించి, ఆదికాండము 1:26–27 ప్రతిధ్వనిని నిలుపడం
  alternative: పతనం తరువాత దేవుని స్వరూపం తగ్గిపోయిందని లేదా పోయిందని ఈ వాక్యమే నిర్ధారిస్తున్నట్లు వ్యాఖ్యానించడం
  rationale: మూలవాక్యం ఆదికాండము 1:26–27ను ఉద్దేశపూర్వకంగా ప్రతిధ్వనింపజేస్తుంది గాని, ఆ ప్రతిధ్వని యొక్క సంపూర్ణ సిద్ధాంతపరమైన అర్థాన్ని వివరించదు. అందువల్ల అనువాదం ఆ ఉద్రిక్తతను పరిష్కరించకుండా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కథన శైలి. ‘కనెను’ అనే స్వల్ప సాంప్రదాయ రూపం వంశావళి సందర్భానికి తగిన సంక్షిప్తతను ఇస్తుంది; మిగతా వాక్య నిర్మాణం సాధారణ పాఠకులకు సులభంగా ఉంటుంది.
