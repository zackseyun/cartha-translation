translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వంశావళి శైలి. హెబ్రీ సూత్రబద్ధ పునరావృతిని భావపరంగా నిలుపుతూ, అసహజమైన అక్షరానువాదాన్ని నివారించాం.
