  text: וַ/יִּֽהְיוּ֙ כָּל יְמֵ֣י קֵינָ֔ן עֶ֣שֶׂר שָׁנִ֔ים וּ/תְשַׁ֥ע מֵא֖וֹת שָׁנָ֑ה וַ/יָּמֹֽת־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/014.yaml
  text: So all the days of Kenan were nine hundred and ten years[b][a], and he died.
translation:
  language: te
  text: కేనాను[b] జీవించిన రోజులన్నీ[a] మొత్తం తొమ్మిది వందల పది సంవత్సరాలు అయ్యాయి; అతడు మరణించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘కేనాను రోజులన్నీ’; వంశావళిలో మళ్లీ మళ్లీ వచ్చే ఈ మాట అతని పూర్తి ఆయుష్షును సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: కొన్ని సంప్రదాయ అనువాదాల్లో ఈ పేరు ‘కైనాను’ అని ఉంటుంది. ఇక్కడి హెబ్రీ రూపం ‘కేనాను.’
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: కాబట్టి ... అయ్యాయి
  rationale: వావ్-క్రమప్రయోగం వంశావళి కథనాన్ని ముందుకు నడిపిస్తుంది. తెలుగులో ‘కాబట్టి’ ముందున్న ఆయుష్షు వివరాల నుంచి ఈ సమగ్ర లెక్కకు సహజమైన అనుసంధానాన్ని ఇస్తుంది.
- source_word: כָּל יְמֵי
  choice: జీవించిన రోజులన్నీ
  rationale: ‘అతని రోజులన్నీ’ అనే అక్షరార్థ రూపం కంటే ఇది తెలుగులో సహజంగా ఉండి, పూర్తి ఆయుష్షును సూచించే హెబ్రీ వంశావళి సూత్రార్థాన్ని నిలుపుతుంది.
- source_word: קֵינָן
  choice: కేనాను
  rationale: గ్రీకు సంప్రదాయంలోని ‘కైనాను’ రూపాన్ని కాకుండా హెబ్రీ పేరుకు దగ్గరగా ఉన్న తెలుగు లిప్యంతరీకరణను ఎంచుకున్నాం.
- source_word: עֶשֶׂר שָׁנִים וּתְשַׁע מֵאוֹת שָׁנָה
  choice: తొమ్మిది వందల పది సంవత్సరాలు
  rationale: హెబ్రీలోని సంఖ్యా క్రమాన్ని తెలుగులో సహజమైన పెద్ద సంఖ్యనుంచి చిన్న సంఖ్యకు వచ్చే క్రమంలో ఇచ్చాం.
- source_word: וַיָּמֹת
  choice: ఆ తర్వాత అతడు చనిపోయాడు
  rationale: వంశావళి ముగింపు సూత్రాన్ని సరళంగా అనువదించాం; ‘ఆ తర్వాత’ వరుస సంఘటన భావాన్ని స్పష్టం చేస్తుంది.
