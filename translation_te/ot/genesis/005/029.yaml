  to: 'అతడు అతనికి నోవహు[a] అని పేరు పెట్టి ఇలా అన్నాడు: “యెహోవా శపించిన నేలనుండి కలిగిన మన పని నుండీ, మన చేతుల బాధాకరమైన శ్రమ నుండీ ఇతడు మనకు ఓదార్పునిస్తాడు.”'
