id: GEN.5.29
reference: Genesis 5:29
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּקְרָ֧א אֶת שְׁמ֛/וֹ נֹ֖חַ לֵ/אמֹ֑ר זֶ֞֠ה יְנַחֲמֵ֤/נוּ מִֽ/מַּעֲשֵׂ֨/נוּ֙ וּ/מֵ/עִצְּב֣וֹן יָדֵ֔י/נוּ מִן הָ֣/אֲדָמָ֔ה אֲשֶׁ֥ר אֵֽרְרָ֖/הּ יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/029.yaml
  text: And he called his name Noah[a], saying, “This one will comfort us from our work and from the painful toil of our hands, from the ground that Yahweh has cursed.”
translation:
  language: te
  text: 'అతడు అతనికి నోవహు[a] అని పేరు పెట్టి ఇలా అన్నాడు: “యెహోవా శపించిన నేలనుండి కలిగిన మన పని నుండీ, మన చేతుల బాధాకరమైన శ్రమ నుండీ ఇతడు మనకు ఓదార్పునిస్తాడు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “నోవహు” అనే పేరుకు “విశ్రాంతి” లేదా “ఊరట” అనే భావంతో శబ్దసామ్యం ఉంది; ఇక్కడ “ఓదార్పునిస్తాడు” అనే హెబ్రీ పదంతో కూడా శబ్దక్రీడ ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא אֶת־שְׁמוֹ
  choice: అతనికి … అని పేరు పెట్టాడు
  rationale: హెబ్రీ నామకరణ సూత్రాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: נֹחַ
  choice: నోవహు
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం; పేరుతో ముడిపడిన శబ్దక్రీడను పాదసూచిక వివరిస్తుంది.
- source_word: זֶה
  choice: ఇతడు
  rationale: శిశువును సూచించే హెబ్రీ నిర్దేశక సర్వనామ బలాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: יְנַחֲמֵנוּ
  choice: మనకు ఓదార్పునిస్తాడు
  rationale: נחם క్రియ యొక్క ప్రధాన భావమైన ఓదార్చడం/ఆదరించడం అనే అర్థాన్ని నేరుగా అందిస్తుంది; నోవహు పేరుతో ఉన్న విశ్రాంతి/ఊరట శబ్దసామ్యాన్ని పాదసూచికలో భద్రపరుస్తుంది.
- source_word: מִמַּעֲשֵׂנוּ
  choice: మన పనినుండి
  rationale: ఇక్కడ మַעֲשֶׂה నైతిక క్రియలను కాక శారీరక పని లేదా శ్రమను సూచిస్తుంది.
- source_word: וּמֵעִצְּבוֹן יָדֵינוּ
  choice: మన చేతుల బాధాకరమైన శ్రమనుండి
  rationale: עִצָּבוֹן లోని బాధ మరియు కఠిన శ్రమ అనే రెండు ఛాయలనూ నిలుపుతూ, ఆదికాండం 3:17తో ఉన్న ప్రతిధ్వనిని కాపాడుతుంది.
- source_word: מִן־הָאֲדָמָה
  choice: నేల మూలంగా కలిగే
  rationale: శపించబడిన నేలతో పని మరియు బాధాకర శ్రమకు ఉన్న మూల/కారణ సంబంధాన్ని తెలుగులో స్పష్టంగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే లిప్యంతరీకరణతో అందిస్తుంది.
theological_decisions:
- issue: నోవహు పేరుకూ יְנַחֲמֵנוּ క్రియకూ మధ్యనున్న శబ్దక్రీడ
  choice: ప్రధాన పాఠంలో ‘ఓదార్పునిస్తాడు’; పాదసూచికలో విశ్రాంతి/ఊరటతో పేరుకున్న శబ్దసామ్యం
  alternative: ‘మనకు ఊరటనిస్తాడు’ లేదా ‘మనకు విశ్రాంతినిస్తాడు’
  rationale: హెబ్రీ క్రియ నేరుగా ‘ఓదార్చు’ అనే భావాన్నిస్తుంది; నోవహు అనే పేరు ‘విశ్రాంతి’ని సూచించే మరో మూలంతో ధ్వనిసామ్యం కలిగి ఉంది. ప్రధాన పాఠం పదార్థాన్ని, పాదసూచిక పేరుతోనున్న ఉద్దేశపూర్వక శబ్దక్రీడను నిలుపుతాయి.
- issue: מִן־הָאֲדָמָה యొక్క సంబంధం
  choice: శపించబడిన నేల మూలంగా పని, శ్రమ కలుగుతున్నట్లు అనుసంధానం
  alternative: ‘యెహోవా శపించిన నేలనుండి’ అని రూపసామ్యంతో అనువదించడం
  rationale: హెబ్రీలోని מן మూలం, కారణం, లేదా దేనినుండి ఉపశమనం లభిస్తుందో సూచించగలదు. తెలుగు వాక్యంలో నేలే నేరుగా ఓదార్పు పొందే అంశమన్న అపార్థం రాకుండా సందర్భానుగుణ సంబంధాన్ని చూపించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్యనిర్మాణం వాడబడింది. ‘బాధాకరమైన శ్రమ’ ఆదికాండం 3లోని శాపం, వేదన, కష్టప్రయాసల అనుసంధానాన్ని నిలుపుతుంది.
