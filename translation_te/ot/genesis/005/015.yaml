translation:
  language: te
  text: మహలలేలు అరవై ఐదు సంవత్సరాలు జీవించి, యెరెదుకు తండ్రియైనాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: జీవించి
  rationale: వంశావళి సూత్రంలో חיה ఒక నిర్దిష్ట కాలం జీవించడాన్ని సూచిస్తుంది; తరువాతి సమన్వయ క్రియతో సహజంగా కలవడానికి తెలుగు అసమాపక రూపం వాడబడింది.
- source_word: מַהֲלַלְאֵל
  choice: మహలలేలు
  rationale: వ్యక్తిపేరును అనువదించకుండా, హెబ్రీ ఉచ్చారణను అనుసరించి తెలుగులో లిప్యంతరీకరించబడింది.
- source_word: חָמֵשׁ שָׁנִים וְשִׁשִּׁים שָׁנָה
  choice: అరవై ఐదు సంవత్సరాలు
  rationale: హెబ్రీలో సంఖ్య ‘ఐదు మరియు అరవై’ క్రమంలో ఉన్నా, విలువను యథాతథంగా ఉంచి సహజమైన ఆధునిక తెలుగు సంఖ్యాక్రమంలో ఇవ్వబడింది.
- source_word: וַיּוֹלֶד
  choice: కన్నాడు
  rationale: వంశావళిలో ילד పురుషుడు ఒక కుమారునికి తండ్రి కావడాన్ని సూచిస్తుంది. ‘కన్నాడు’ తెలుగు బైబిలు వంశావళి సందర్భంలో సంక్షిప్తంగా, సహజంగా ఆ భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: אֶת יָרֶד
  choice: యారెదును
  rationale: אֶת ప్రత్యక్ష కర్మ సూచికకు ప్రత్యేక పదం అవసరం లేదు; יָרֶד అనే వ్యక్తిపేరు హెబ్రీ రూపానికి దగ్గరగా ‘యారెదు’గా లిప్యంతరీకరించి కర్మవిభక్తి చేర్చబడింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళికి తగిన సంక్షిప్తమైన గౌరవప్రద శైలి. మూలంలోని వరుస క్రియల సంబంధాన్ని సహజ తెలుగు వాక్యనిర్మాణంతో నిలిపింది.
