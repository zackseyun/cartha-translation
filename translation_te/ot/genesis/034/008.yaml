source:
  edition: WLC
  text: וַ/יְדַבֵּ֥ר חֲמ֖וֹר אִתָּ֣/ם לֵ/אמֹ֑ר שְׁכֶ֣ם בְּנִ֗/י חָֽשְׁקָ֤ה נַפְשׁ/וֹ֙ בְּ/בִתְּ/כֶ֔ם תְּנ֨וּ נָ֥א אֹתָ֛/הּ ל֖/וֹ לְ/אִשָּֽׁה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/008.yaml
  text: And Hamor spoke with them[a], saying, “My son Shechem longs for your daughter. Please give her to him as a wife.”
translation:
  language: te
  text: 'హమోరు వారితో ఇలా అన్నాడు: “నా కుమారుడు షెకెము మీ కుమార్తెను గాఢంగా కోరుతున్నాడు[a]. దయచేసి ఆమెను అతనికి భార్యగా ఇవ్వండి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతని మనసు మీ కుమార్తెపై గాఢంగా అంటుకుంది”; అంటే, అతడు ఆమెను బలంగా కోరుతున్నాడు లేదా ఆమెపై గాఢమైన అనుబంధం కలిగివున్నాడు.
    reason: חָשְׁקָה נַפְשׁוֹ అనే హీబ్రూ నుడికారం తీవ్రమైన కోరికను లేదా గాఢమైన అనుబంధాన్ని సూచించగలదు; ప్రధాన పాఠంలో కోరిక భావాన్ని నేరుగా అందిస్తూ, ప్రత్యామ్నాయ సూక్ష్మార్థాన్ని పాదసూచికలో నిలిపాం.
lexical_decisions:
- source_word: וַיְדַבֵּר חֲמוֹר אִתָּם לֵאמֹר
  choice: హమోరు వారితో మాట్లాడుతూ ఇలా అన్నాడు
  rationale: דבר మరియు לאמר రెండింటినీ తెలుగులో సహజమైన కథన పరిచయంగా వ్యక్తం చేస్తూ, אִתָּם లోని ‘వారితో’ అనే భావాన్ని నిలిపింది.
- source_word: שְׁכֶם בְּנִי
  choice: నా కుమారుడు షెకెము
  rationale: హీబ్రూ సమానాధికరణ సంబంధాన్ని ఆధునిక తెలుగులో సహజమైన పదక్రమంతో అందిస్తుంది.
- source_word: חָשְׁקָה נַפְשׁוֹ בְּבִתְּכֶם
  choice: మీ కుమార్తెపై గాఢమైన మమకారం పెంచుకున్నాడు[a]
  rationale: ‘అతని ప్రాణం/మనసు అంటుకుంది’ అనే హీబ్రూ నుడికారంలోని బలమైన ఆకర్షణ లేదా అనుబంధాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; ప్రత్యామ్నాయ భావాలను పాదసూచికలో ఉంచింది.
- source_word: תְּנוּ נָא
  choice: దయచేసి ... ఇవ్వండి
  rationale: ఆజ్ఞారూపంతో కూడిన נָא వ్యక్తం చేసే వినయపూర్వక విన్నపాన్ని స్పష్టంగా నిలిపింది.
- source_word: אֹתָהּ לוֹ לְאִשָּׁה
  choice: ఆమెను అతనికి భార్యగా ఇవ్వండి
  rationale: వివాహానికి ఇచ్చే భావాన్ని సంక్షిప్తంగా, మూలంలోని సంబంధాలను మార్చకుండా అందిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘మమకారం’ బలమైన భావోద్వేగ అనుబంధాన్ని సూచిస్తుండగా, మూలంలోని కోరిక/అంటిపెట్టుకోవడం అనే భావసంభావ్యతను పాదసూచిక సంరక్షిస్తుంది.
