source:
  edition: WLC
  text: וַ/יֹּאמְר֑וּ הַ/כְ/זוֹנָ֕ה יַעֲשֶׂ֖ה אֶת אֲחוֹתֵֽ/נוּ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/031.yaml
  text: But they said[a], “Should he treat our sister like a prostitute?”
translation:
  language: te
  text: అయితే వారు, “అతడు మా సహోదరిని వేశ్యలా చూడాలా?[a]” అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతడు మా సహోదరిని వేశ్యలా చేయాలా?” హీబ్రూ క్రియ అక్షరార్థంగా ‘చేయు’ అని అర్థమిస్తుంది; ఇక్కడ అది ‘అలా పరిగణించడం లేదా ప్రవర్తించడం’ అనే భావంలో ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: అయితే వారు … అన్నారు
  rationale: సందర్భంలో యాకోబు గద్దింపుకు కుమారులు ఎదురుగా ఇచ్చిన జవాబును సూచించే వావ్-క్రమ కథన రూపం; ‘అయితే’ దాని వ్యతిరేక భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: הַכְזוֹנָה
  choice: వేశ్యలా
  rationale: ప్రశ్నార్థక ה, ఉపమానార్థక כ, మరియు זונה కలసి ‘వేశ్యలా?’ అనే భావాన్ని ఇస్తాయి; ఇది ఆధునిక తెలుగులో స్పష్టంగా ఉండి ఉపమాన భావాన్ని కాపాడుతుంది.
- source_word: יַעֲשֶׂה
  choice: చూడాలా
  rationale: עשה అక్షరార్థంగా ‘చేయు/తయారుచేయు’ అనే విస్తృతార్థ క్రియ. ఈ సందర్భంలో వ్యక్తిని ఒక విధంగా పరిగణించడం లేదా ప్రవర్తించడం అనే భావాన్ని తెలుగు ‘వేశ్యలా చూడడం’ సహజంగా వ్యక్తపరుస్తుంది.
- source_word: אֲחוֹתֵנוּ
  choice: మా సహోదరిని
  rationale: ‘మా సోదరి’ అనే స్వామ్యసంబంధ భావాన్ని నేరుగా తెలియజేస్తుంది; ‘సహోదరి’ గౌరవప్రదమైన, సాధారణ ప్రమాణ తెలుగు రూపం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రమాణ తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడబడింది. మూలంలోని సంక్షిప్తమైన, ఆగ్రహభరిత అలంకార ప్రశ్నను అలాగే నిలిపి, עשה క్రియలోని ‘చేయు’/‘అలా చూడడం’ అనే సందిగ్ధతను పాదటిప్పణిలో భద్రపరచాం.
