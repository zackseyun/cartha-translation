  yaml_path: translation/ot/genesis/034/026.yaml
  text: They also killed Hamor and his son Shechem with the sword[a], and they took Dinah from Shechem’s house and went out.
translation:
  language: te
  text: వారు హమోరును, అతని కుమారుడైన షెకెమును కూడా కత్తితో చంపారు[a]. దీనాను షెకెము ఇంటి నుండి తీసుకొని బయటికి వెళ్లారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీలో అక్షరార్థంగా, “కత్తి నోటిచేత”; ఇది కత్తితో చంపడాన్ని సూచించే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת חֲמוֹר וְאֶת שְׁכֶם בְּנוֹ
  choice: హమోరును, అతని కుమారుడైన షెకెమును కూడా
  rationale: ప్రత్యక్ష కర్మ సూచకాలను తెలుగులో విభక్తులతో వ్యక్తం చేశాం. సందర్భంలోని అదనపు బాధితులను సూచించే సంధాన భావాన్ని ‘కూడా’ సహజంగా తెలియజేస్తుంది; బంధుత్వ సంబంధాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: הָרְגוּ
  choice: చంపారు
  rationale: హרג అనే క్రియకు కథన గద్యంలో సూటిగా, ఆధునికంగా సరిపోయే సాధారణ తెలుగు పదం.
- source_word: לְפִי חָרֶב
  choice: కత్తితో
  rationale: అక్షరార్థంగా ‘కత్తి నోటితో’ అనే హెబ్రీయ నుడికారం; ప్రధాన పాఠ్యంలో దాని సహజ భావాన్ని ఇచ్చి, అక్షర రూపాన్ని పాదసూచికలో ఉంచాం.
- source_word: וַיִּקְחוּ אֶת דִּינָה
  choice: దీనాను తీసుకొని
  rationale: לקח యొక్క విస్తృతమైన సాధారణ అర్థాన్ని నిలుపుతుంది; మూలంలో లేని బలవంతపు స్వాధీనత భావాన్ని ‘లాక్కొని’ వంటి పదంతో అధికంగా చేర్చదు.
- source_word: מִבֵּית שְׁכֶם
  choice: షెకెము ఇంటి నుండి
  rationale: ఇక్కడ בַּיִת తక్షణ కథా సందర్భంలో భౌతిక ఇల్లు లేదా నివాసాన్ని సూచించడం సహజం; ‘కుటుంబం’ అని విస్తరించలేదు.
- source_word: וַיֵּצֵאוּ
  choice: వెళ్లిపోయారు
  rationale: יצא సూచించే బయటికి వెళ్లే కదలికను సహజమైన ఆధునిక తెలుగు కథన శైలిలో వ్యక్తం చేస్తుంది.
