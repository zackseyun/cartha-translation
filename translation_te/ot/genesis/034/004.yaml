lexical_decisions:
- source_word: קַח־לִי
  choice: నాకు ... తెచ్చిపెట్టు
  rationale: ఇక్కడ ‘తీసుకో’ అనే అక్షరార్థం కన్నా, తండ్రి వివాహం కుదిర్చి ఆమెను తనకు భార్యగా పొందేలా చేయాలనే ఆజ్ఞ భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: הַיַּלְדָּה הַזֹּאת
  choice: ఈ అమ్మాయిని
  rationale: יַלְדָּה యువతిని సూచిస్తుంది; సందర్భానికి తగిన సహజమైన తెలుగు పదం ‘అమ్మాయి’.
- source_word: לְאִשָּׁה
  choice: భార్యగా
  rationale: వివాహ సంబంధ ఉద్దేశాన్ని నేరుగా, సంక్షిప్తంగా తెలియజేస్తుంది.
