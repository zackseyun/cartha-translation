base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/001.yaml
  text: Dinah[a], the daughter of Leah, whom she had borne to Jacob, went out to see the daughters of the land.
translation:
  language: te
  text: యాకోబుకు లేయా కనిన కుమార్తె దీనా, ఆ దేశపు కుమార్తెలను చూడడానికి[a] బయటికి వెళ్లింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆ దేశపు స్త్రీలను కలుసుకోవడానికి.” హెబ్రీలో అక్షరార్థంగా “ఆ దేశపు కుమార్తెలను చూడడానికి” అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּצֵא
  choice: బయటికి వెళ్లింది
  rationale: יצא అనే క్రియ యొక్క సాధారణ కథనార్థాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; మూలంలో లేని ప్రదేశాన్ని జోడించదు.
- source_word: דִינָה
  choice: దీనా
  rationale: వ్యక్తి పేరును తెలుగులో ప్రాచుర్యంలో ఉన్న రూపానికి అనుగుణంగా లిప్యంతరీకరించింది.
- source_word: בַּת לֵאָה
  choice: లేయా ... కుమార్తె
  rationale: దీనాను ఆమె తల్లి వంశసంబంధంతో గుర్తించే హెబ్రీ నిర్మాణాన్ని తెలుగులో సహజంగా నిలుపుతుంది.
- source_word: אֲשֶׁר יָלְדָה לְיַעֲקֹב
  choice: లేయా యాకోబుకు కనిన
  rationale: సంబంధ వాక్యం లేయాను సూచిస్తూ, దీనా యాకోబుకు పుట్టిన కుమార్తె అని తెలియజేస్తుంది. ‘కనిన’ నేపథ్య సమాచారాన్ని సంక్షిప్తంగా, సహజంగా ఇస్తుంది.
- source_word: לִרְאוֹת
  choice: చూడడానికి
  rationale: ראה క్రియ యొక్క ప్రత్యక్ష అర్థమైన ‘చూడడం’ను ప్రధాన పాఠంలో నిలుపుతుంది; సందర్భంలో ‘కలుసుకోవడం’ లేదా ‘పరామర్శించడం’ భావం ఉండవచ్చనే అవకాశాన్ని పాదసూచికలో ఉంచింది.
- source_word: בִּבְנוֹת הָאָרֶץ
  choice: ఆ దేశపు కుమార్తెలను
  rationale: స్థానిక స్త్రీలు లేదా యువతులను సూచించే హెబ్రీ నుడికారాన్ని అక్షరార్థానికి దగ్గరగా నిలుపుతూ, దాని సహజ తెలుగు ప్రత్యామ్నాయాన్ని పాదసూచికలో అందిస్తుంది.
