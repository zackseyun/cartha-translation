  yaml_path: translation/ot/genesis/034/020.yaml
  text: So Hamor and Shechem his son came to the gate of their city and spoke to the men of their city[a], saying[b],
translation:
  language: te
  text: 'హమోరు, అతని కుమారుడైన షెకెము తమ పట్టణపు ద్వారం వద్దకు వచ్చి, తమ పట్టణపు పురుషులను ఉద్దేశించి ఇలా మాట్లాడారు:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  choice: వచ్చి
  rationale: בוא అనే క్రియ కథనాన్ని ముందుకు నడిపిస్తుంది; గమ్యస్థానమైన పట్టణ ద్వారం దగ్గరకు చేరడాన్ని సహజమైన ఆధునిక తెలుగులో ‘వచ్చి’ అని వ్యక్తపరచడం సముచితం.
- source_word: חֲמוֹר
  choice: హమోరు
  rationale: వ్యక్తి పేరును అర్థానువాదం చేయకుండా తెలుగులో లిప్యంతరీకరించాం.
- source_word: וּשְׁכֶם בְּנוֹ
  choice: అతని కుమారుడు షెకెము
  rationale: తండ్రి-కొడుకు సంబంధాన్ని స్పష్టంగా ఉంచుతూ తెలుగులో సహజమైన పదక్రమాన్ని అనుసరించాం.
- source_word: אֶל שַׁעַר עִירָם
  choice: తమ పట్టణ ద్వారం దగ్గరకు
  rationale: శబ్దార్థంగా ‘తమ పట్టణపు ద్వారం వద్దకు.’ ఇక్కడ పట్టణ ద్వారం పౌర వ్యవహారాలు జరిగే బహిరంగ ప్రదేశం; ‘పట్టణ ద్వారం దగ్గరకు’ అనేది మూలార్థాన్ని సహజంగా అందిస్తుంది.
- source_word: וַיְדַבְּרוּ
  choice: మాట్లాడారు
  rationale: דבר + אֶל అంటే సాధారణంగా ఎవరితోనైనా మాట్లాడడం లేదా వారిని ఉద్దేశించి ప్రసంగించడం; బహిరంగ సమావేశ సందర్భానికి ‘మాట్లాడారు’ సరిపోతుంది.
- source_word: אֶל אַנְשֵׁי עִירָם
  choice: తమ పట్టణంలోని పురుషులతో
  rationale: אַנְשֵׁי అనే పదం ఇక్కడ శబ్దార్థంగా ‘పురుషులు.’ పట్టణ ద్వారం వద్ద పౌర నిర్ణయాల కోసం సమావేశమైన పట్టణపు పురుషులను ఇది సూచించే అవకాశముంది; అందువల్ల లింగనిరపేక్షమైన ‘ప్రజలు’ కంటే ‘పురుషులు’ మూలానికి దగ్గరగా ఉంటుంది.
- source_word: לֵאמֹר
  choice: ఇలా
  rationale: ప్రత్యక్ష ప్రసంగాన్ని పరిచయం చేసే సాధారణ హెబ్రీ పదం. తెలుగులో వాక్యాంతంలోని ద్విబిందువుతో కలిపి ‘ఇలా మాట్లాడారు:’ అనడం సహజంగా ఉంటుంది.
