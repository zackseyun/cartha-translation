translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి వాడాం. హెబ్రీ వాక్య నిర్మాణాన్ని యాంత్రికంగా అనుకరించకుండా దాని భావాన్ని, పట్టణ ద్వారం అనే సాంస్కృతిక సందర్భాన్ని నిలిపాం. ప్రధాన పాఠంలోని [a] గుర్తు పాదసూచికతో సరిపోతుంది.
