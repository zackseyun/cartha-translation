source:
  edition: WLC
  text: וְ/אִם לֹ֧א תִשְׁמְע֛וּ אֵלֵ֖י/נוּ לְ/הִמּ֑וֹל וְ/לָקַ֥חְנוּ אֶת בִּתֵּ֖/נוּ וְ/הָלָֽכְנוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/017.yaml
  text: But if you will not listen to us[a], to be circumcised[b], then we will take our daughter and go.
translation:
  language: te
  text: అయితే మీరు సున్నతి చేయించుకోవాలన్న మా మాట[a] వినకపోతే, మేము మా కుమార్తెను తీసుకొని వెళ్లిపోతాము.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో, “మా మాట వినకపోతే—సున్నతి చేయించుకోవడానికి” అని ఉంది. “సున్నతి చేయించుకోవడం” అనేది వారు వినవలసిన మాటలోని విషయాన్ని సూచించే హీబ్రూ అనంతరూపం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אִם
  choice: అయితే ... పోతే
  rationale: ముందటి ప్రతిపాదనకు విరుద్ధమైన షరతును సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: תִשְׁמְעוּ אֵלֵינוּ
  choice: మీరు మా మాట విని
  rationale: שׁמע אֶל అంటే ‘మాట వినడం/లక్ష్యపెట్టడం’; ఇక్కడ ‘విధేయులవడం’ కంటే ‘మా మాట వినడం’ మూలపాఠానికి దగ్గరగా, సహజంగా ఉంది.
- source_word: לְ/הִמּוֹל
  choice: సున్నతి చేయించుకోకపోతే
  rationale: ఈ నిఫాల్ క్రియారూపం సున్నతి పొందడాన్ని సూచిస్తుంది. తెలుగు సమన్వయ నిర్మాణంలో ఇది వారి మాట వినడంలో భాగమైన కోరిన చర్యగా స్పష్టమవుతుంది.
- source_word: וְ/לָקַחְנוּ אֶת בִּתֵּנוּ
  choice: మేము మా కుమార్తెను తీసుకొని
  rationale: షరతు నెరవేరనప్పుడు జరిగే ఫలితాన్ని భవిష్యదర్థంతో నేరుగా తెలుపుతుంది.
- source_word: וְ/הָלָכְנוּ
  choice: వెళ్లిపోతాము
  rationale: ఈ సందర్భంలో הלך అక్కడి నుంచి వెళ్లిపోవడాన్ని సూచిస్తుంది; ‘వెళ్లిపోతాము’ ఆధునిక తెలుగులో సహజం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. హీబ్రూ వాక్యంలోని షరతు–ఫలిత నిర్మాణాన్ని నిలుపుతూ, సున్నతి చేయించుకోవడం వారి మాట వినడంలోని కోరిన చర్య అని సహజంగా వ్యక్తం చేయబడింది.
