language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אַךְ בְּ/זֹ֖את נֵא֣וֹת לָ/כֶ֑ם אִ֚ם תִּהְי֣וּ כָמֹ֔/נוּ לְ/הִמֹּ֥ל לָ/כֶ֖ם כָּל זָכָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/015.yaml
  text: 'Only on this condition will we agree with you: if you become like us[b][a], by circumcising every male among you.'
translation:
  language: te
  text: 'ఈ షరతుపై మాత్రమే మేము మీతో అంగీకరిస్తాం: మీరు మాలాగా కావాలంటే, మీలోని ప్రతి పురుషుడు సున్నతి పొందాలి.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీరు మాలాగా కావడం అంటే మీలోని ప్రతి పురుషుడు సున్నతి పొందడమే.”
    reason: హిబ్రూ అనంతరూపం మాలాగా కావడానికి అవసరమైన విధానాన్ని తెలియజేస్తుంది; దీనిని తెలుగులో షరతుగా లేదా వివరణాత్మకంగా వ్యక్తపరచవచ్చు.
lexical_decisions:
- source_word: אַךְ בְּזֹאת
  choice: ఈ షరతు మీద మాత్రమే
  rationale: אַךְ పరిమితిని, בְּזֹאת ఒప్పందానికి నిర్దిష్టమైన షరతును సూచిస్తున్నాయి; ఈ సందర్భంలో సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: נֵאוֹת לָכֶם
  choice: మేము మీతో ఒప్పుకుంటాం
  rationale: నిఫల్ రూపం సమ్మతి లేదా అంగీకారాన్ని సూచిస్తుంది; לָכֶםను తెలుగు సంబంధప్రయోగానికి అనుగుణంగా ‘మీతో’గా అందించాం.
- source_word: אִם תִּהְיוּ כָמֹנוּ
  choice: మీరు మాలాగా కావాలి
  rationale: షరతు వాక్యంలో היה ఒక స్థితిలోకి రావడాన్ని సూచిస్తుంది; తెలుగులో షరతు భావాన్ని సహజంగా తెలిపేందుకు ‘కావాలి’ వాడాం.
- source_word: לְהִמֹּל לָכֶם כָּל זָכָר
  choice: మీలోని ప్రతి పురుషుడికి సున్నతి చేయించడం ద్వారా
  rationale: హిబ్రూ నిఫల్ అనంతరూపం సున్నతి పొందడాన్ని, לָכֶם ఆ సమూహానికి చెందిన పురుషులను సూచిస్తుంది; తెలుగు సహజత్వం కోసం కారణక క్రియారూపంతో సాధనార్థక సంబంధాన్ని తెలిపాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; చర్చలో విధిస్తున్న ప్రత్యేక షరతు స్పష్టంగా ఉండేలా, గంభీరమైనప్పటికీ సామాన్య పాఠకులకు సహజంగా ఉండే శైలి.
