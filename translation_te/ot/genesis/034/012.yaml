id: GEN.34.12
reference: Genesis 34:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: הַרְבּ֨וּ עָלַ֤/י מְאֹד֙ מֹ֣הַר וּ/מַתָּ֔ן וְ/אֶ֨תְּנָ֔ה כַּ/אֲשֶׁ֥ר תֹּאמְר֖וּ אֵלָ֑/י וּ/תְנוּ לִ֥/י אֶת הַֽ/נַּעֲרָ֖ לְ/אִשָּֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/012.yaml
  text: Demand from me a very large bride-price and gift[a], and I will give whatever you say to me; only give me the young woman as a wife.
translation:
  language: te
  text: “నా నుంచి వధువు-మూల్యాన్ని[a] కానుకనూ చాలా ఎక్కువగా అడగండి; మీరు నాతో ఏది చెప్పినా నేను ఇస్తాను. ఆ యువతిని నాకు భార్యగా ఇవ్వండి.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వివాహ చెల్లింపు.” హీబ్రూ పదం מֹהַר వరుడు లేదా అతని కుటుంబం వధువు కుటుంబానికి ఇచ్చే చెల్లింపును ప్రత్యేకంగా సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַרְבּוּ עָלַי מְאֹד
  choice: నా నుంచి ... ఎంత ఎక్కువగా అడిగినా
  rationale: హిఫీల్ బహువచన ఆజ్ఞ ఇక్కడ చెల్లించవలసిన మొత్తాన్ని అధికంగా నిర్ణయించమనే భావాన్ని ఇస్తుంది. షెకెము ఎంత పెద్ద మొత్తం అడిగినా చెల్లించడానికి సిద్ధంగా ఉన్నాడనే సందర్భార్థాన్ని సహజమైన తెలుగులో ఇది తెలియజేస్తుంది.
- source_word: מֹהַר
  choice: వధువు మూల్యం
  rationale: వరుడు లేదా అతని కుటుంబం వధువు కుటుంబానికి ఇచ్చే వివాహ చెల్లింపును సూచిస్తుంది; వధువు తన వెంట తెచ్చే కట్నం అనే అర్థం రాకుండా ‘వధువు మూల్యం’ అని అనువదించబడింది.
- source_word: וּמַתָּן
  choice: కానుక
  rationale: వధువు మూల్యంతో పాటు ఇచ్చే అదనపు బహుమతి లేదా కానుకను సూచించే ఏకవచన నామవాచకం.
- source_word: וְאֶתְּנָה
  choice: ఇస్తాను
  rationale: కోహోర్టేటివ్ రూపం మాట్లాడేవాని దృఢమైన సంసిద్ధతను తెలియజేస్తుంది; ఆధునిక తెలుగులో ‘ఇస్తాను’ దానిని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: כַּאֲשֶׁר תֹּאמְרוּ אֵלַי
  choice: మీరు నాతో చెప్పినంత
  rationale: వారు నిర్ణయించి చెప్పే మొత్తం లేదా షరతుకు తాను లోబడతాననే విస్తృత భావాన్ని కాపాడుతుంది.
- source_word: וּתְנוּ לִי
  choice: నాకు ... ఇవ్వండి
  rationale: ముందటి చెల్లింపు ప్రతిపాదన తరువాత వచ్చే ప్రధాన విజ్ఞప్తిని ప్రత్యక్ష ఆజ్ఞారూపంలో ఉంచుతుంది; మూలంలోని וְకు లేని ప్రత్యేక పరిమితి భావాన్ని అదనంగా చేర్చదు.
- source_word: הַנַּעֲרָ
  choice: ఆ యువతిని
  rationale: వివాహ వయస్సులోని యువ స్త్రీని సూచిస్తుంది. ‘బాలిక’ కంటే ‘యువతి’ సందర్భానికి తగినదిగా, ఆధునికంగా ఉంది.
- source_word: לְאִשָּׁה
  choice: భార్యగా
  rationale: ఇది సాధారణ హీబ్రూ వివాహ ప్రయోగం; తెలుగులో ‘భార్యగా’ సంక్షిప్తంగానూ సహజంగానూ ఉంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన ప్రత్యక్ష సంభాషణగా అనువదించబడింది. సాంకేతిక భావాన్ని స్పష్టంగా ఉంచేందుకు ‘వధువు మూల్యం’ వాడబడింది; పాదటిప్పణిలో దాని సాంస్కృతిక అర్థం వివరించబడింది.
