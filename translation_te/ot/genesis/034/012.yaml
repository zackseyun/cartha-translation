- from: “మీరు నా నుంచి వధువు మూల్యాన్నీ కానుకనూ[a] ఎంత ఎక్కువగా అడిగినా, మీరు నాతో చెప్పినంత ఇస్తాను. ఆ యువతిని నాకు భార్యగా ఇవ్వండి.”
  to: “నా నుంచి వధువు-మూల్యాన్ని[a] కానుకనూ చాలా ఎక్కువగా అడగండి; మీరు నాతో ఏది చెప్పినా నేను ఇస్తాను. ఆ యువతిని నాకు భార్యగా ఇవ్వండి.”
  rationale: The revision restores the imperative force of the Hebrew, retains the intensifier “చాలా ఎక్కువగా,” and moves the lexical footnote anchor to the term it explains. It preserves the source’s distinction between the bride-price and the additional gift without adding interpretive material.
