  text: then we will give our daughters to you[a], and we will take your daughters for ourselves, and we will live with you and become one people.
translation:
  language: te
  text: అప్పుడు మేము మా కుమార్తెలను మీకు ఇస్తాం; మీ కుమార్తెలను మేము వివాహం చేసుకుంటాం. మేము మీతో నివసించి, ఒకే ప్రజలమవుతాం.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఒకే ప్రజలుగా ఉంటాం.” హీబ్రూ పదబంధాన్ని ఫలితంగా ఏర్పడే స్థితిగా “ఒకే ప్రజలమవుతాం” అనీ, మరింత యథార్థంగా “ఒకే ప్రజలుగా ఉంటాం” అనీ అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַנּוּ
  choice: అప్పుడు మేము ... ఇస్తాం
  rationale: ముందటి షరతుకు వచ్చే ఫలితాన్ని సూచించే ఈ సందర్భంలో, వావ్‌తో కూడిన క్రియకు భవిష్యత్-ఫలిత భావం ఉంది; తెలుగులో ‘అప్పుడు ... ఇస్తాం’ సహజంగా దాన్ని వ్యక్తం చేస్తుంది.
- source_word: אֶת־בְּנֹתֵינוּ לָכֶם
  choice: మా కుమార్తెలను మీకు
  rationale: బంధుత్వ పదాన్నీ, לָכֶם సూచించే పరోక్ష కర్మనూ నేరుగా నిలుపుతుంది.
- source_word: וְאֶת־בְּנֹתֵיכֶם נִקַּח־לָנוּ
  choice: మీ కుమార్తెలను మేము వివాహం చేసుకుంటాం
  rationale: לקח ప్రాథమికంగా ‘తీసుకోవడం’ అయినా, కుమార్తెల పరస్పర ఇచ్చిపుచ్చుకునే ఈ సందర్భంలో భార్యలుగా స్వీకరించడం ఉద్దేశం. తెలుగులో ‘మాకు తీసుకుంటాం’ అసహజంగా లేదా అస్పష్టంగా ఉంటుంది కాబట్టి సందర్భార్థాన్ని సహజంగా వెల్లడించాం.
- source_word: וְיָשַׁבְנוּ אִתְּכֶם
  choice: మేము మీతో నివసించి
  rationale: ישב యొక్క ‘నివసించు/కాపురముండు’ భావాన్ని ఆధునిక ప్రామాణిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; אִתְּכֶם యొక్క సహవాస భావం ‘మీతో’గా నిలుస్తుంది.
- source_word: וְהָיִינוּ לְעַם אֶחָד
  choice: ఒకే ప్రజగా అవుతాం
  rationale: היה ఇక్కడ అంతర్వివాహం, సహనివాసం ఫలితంగా ఏర్పడే స్థితిని సూచిస్తుంది. עם ఆధునిక రాజకీయ ‘దేశం’ కంటే ప్రజాసమూహాన్ని సూచిస్తుంది; అందువల్ల ‘ఒకే ప్రజ’ ఎంచుకున్నాం.
