  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన కథన శైలి, అయితే గంభీరతను నిలిపింది. పేర్లకు ప్రాచుర్యంలో ఉన్న తెలుగు బైబిలు రూపాలు వాడబడ్డాయి.
