source:
  edition: WLC
  text: וַ/יְהִי֩ בַ/יּ֨וֹם הַ/שְּׁלִישִׁ֜י בִּֽ/הְיוֹתָ֣/ם כֹּֽאֲבִ֗ים וַ/יִּקְח֣וּ שְׁנֵֽי בְנֵי יַ֠עֲקֹב שִׁמְע֨וֹן וְ/לֵוִ֜י אֲחֵ֤י דִינָה֙ אִ֣ישׁ חַרְבּ֔/וֹ וַ/יָּבֹ֥אוּ עַל הָ/עִ֖יר בֶּ֑טַח וַ/יַּֽהַרְג֖וּ כָּל זָכָֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/025.yaml
  text: On the third day[a], while they were in pain, two of Jacob’s sons, Simeon and Levi, Dinah’s brothers, each took his sword, came against the city while it felt secure[b], and killed every male.
translation:
  language: te
  text: మూడవ రోజున[a], వారు నొప్పితో ఉన్నప్పుడు, యాకోబు కుమారుల్లో ఇద్దరైన—దీనా సహోదరులు షిమ్యోను, లేవి—తమ తమ కత్తులు తీసుకొని, నిశ్చింతగా ఉన్న పట్టణం మీదికి వచ్చి[b], మగవారందరినీ చంపారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మూడవ రోజున, వారు నొప్పితో ఉన్నప్పుడు, ఇలా జరిగింది:”
    reason: హీబ్రూ וַיְהִי అనే కథన సూత్రాన్ని మరింత రూపసామ్యంగా అనువదించే ప్రత్యామ్నాయం.
  - marker: b
    text: లేదా, “వారు ధైర్యంగా/సురక్షితంగా పట్టణం మీదికి వచ్చి.” హీబ్రూ בֶּטַח అనే పదం దాడిచేసినవారు వచ్చిన తీరును గానీ, అపాయం ఊహించకుండా నిశ్చింతగా ఉన్న పట్టణ స్థితిని గానీ సూచించవచ్చు.
    reason: మూలంలోని నిజమైన వ్యాకరణ, పదార్థ సందిగ్ధతను నిలుపుతుంది.
lexical_decisions:
- source_word: וַיְהִי בַיּוֹם הַשְּׁלִישִׁי
  choice: మూడవ రోజున
  rationale: హీబ్రూ కథన ప్రవాహాన్ని సహజమైన ఆధునిక తెలుగులో నేరుగా తెలియజేస్తుంది; וַיְהִי అనే కథనారంభ సూత్రాన్ని ప్రత్యేకంగా అనువదించకపోయినా సంఘటనల వరుస నిలుస్తుంది.
- source_word: בִּהְיוֹתָם כֹּאֲבִים
  choice: వారు నొప్పితో ఉన్నప్పుడు
  rationale: సమకాలిక పరిస్థితిని సూచించే నిర్మాణాన్ని, సందర్భం వల్ల తెలిసే సున్నతి కారణాన్ని వచనంలో అదనంగా చేర్చకుండా స్పష్టంగా అందిస్తుంది.
- source_word: שְׁנֵי בְנֵי יַעֲקֹב
  choice: యాకోబు కుమారుల్లో ఇద్దరైన
  rationale: యాకోబు కుమారులలోని ఇద్దరిని సూచించే భాగార్థాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: שִׁמְעוֹן וְלֵוִי אֲחֵי דִינָה
  choice: దీనా సహోదరులు షిమ్యోను, లేవి
  rationale: ఇద్దరి పేర్లతోపాటు దీనాతో వారి సంబంధాన్ని స్పష్టమైన సమానాధికార నిర్మాణంలో తెలియజేస్తుంది.
- source_word: אִישׁ חַרְבּוֹ
  choice: తమ తమ కత్తులు తీసుకొని
  rationale: אִישׁ యొక్క పంపిణీ భావాన్ని, ప్రతి ఒక్కరూ తన కత్తిని తీసుకున్నాడనే అర్థంతో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: וַיָּבֹאוּ עַל הָעִיר
  choice: పట్టణం మీదికి వచ్చి
  rationale: עַל కలిగించే ప్రతికూల లేదా దాడి దిశను నిలుపుతూ, ‘దాడి చేశారు’ అని క్రియను మరీ స్పష్టీకరించకుండా హీబ్రూ రూపకాన్ని అనుసరిస్తుంది.
- source_word: בֶּטַח
  choice: నిశ్చింతగా ఉన్న పట్టణం
  rationale: సందర్భంలో అపాయం ఊహించకుండా భద్రంగా ఉందనుకున్న పట్టణ స్థితిని సహజంగా వ్యక్తపరుస్తుంది; ఈ పదం దాడిచేసినవారి రాక తీరును కూడా సూచించవచ్చనే వ్యాకరణ సందిగ్ధతను పాదసూచికలో నిలిపింది.
- source_word: וַיַּהַרְגוּ כָּל זָכָר
  choice: మగవారందరినీ చంపారు
  rationale: הרג యొక్క సాధారణ ‘చంపు’ భావాన్ని, כָּל זָכָר యొక్క సమగ్ర పురుషలింగ సూచనను స్పష్టమైన ఆధునిక తెలుగులో అందిస్తుంది.
