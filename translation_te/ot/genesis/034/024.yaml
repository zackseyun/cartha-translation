translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలిని వాడాం. మూలంలోని ‘పట్టణ ద్వారం’ చిత్రాన్నీ దాని పునరుక్తినీ నిలిపాం; తెలుగులో అసహజంగా అనిపించే పదక్షర క్రమాన్ని మాత్రం సహజ వాక్యక్రమంగా మార్చాం.
