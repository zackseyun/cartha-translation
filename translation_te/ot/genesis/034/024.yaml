  text: וַ/יִּשְׁמְע֤וּ אֶל חֲמוֹר֙ וְ/אֶל שְׁכֶ֣ם בְּנ֔/וֹ כָּל יֹצְאֵ֖י שַׁ֣עַר עִיר֑/וֹ וַ/יִּמֹּ֨לוּ֙ כָּל זָכָ֔ר כָּל יֹצְאֵ֖י שַׁ֥עַר עִירֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/024.yaml
  text: And all who went out of the gate of his city listened to Hamor and to Shechem his son[a], and every male, all who went out of the gate of his city[c][b], was circumcised.
translation:
  language: te
  text: హమోరు మాటకూ, అతని కుమారుడైన షెకెము మాటకూ, అతని పట్టణపు ద్వారం నుండి బయలుదేరే వారందరూ చెవియొగ్గారు[a]. అతని పట్టణపు ద్వారం నుండి బయలుదేరే వారందరిలోని ప్రతి పురుషుడూ సున్నతి చేయించుకున్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “పట్టణపు ద్వారం నుండి బయలుదేరే వారందరూ” అనేది ప్రజాజీవితంలో పాల్గొనే పట్టణ ప్రజలను సూచించే హీబ్రూ నుడికారం.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁמְעוּ אֶל
  choice: ఆలకించారు
  rationale: ఈ నిర్మాణం కేవలం వినడమే కాక ప్రతిపాదనను అనుకూలంగా స్వీకరించి దానికి స్పందించడాన్ని సూచించగలదు. ‘లోబడ్డారు’ అని అతిగా వ్యాఖ్యానించకుండా ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: כָּל יֹצְאֵי שַׁעַר עִירוֹ
  choice: అతని పట్టణ ద్వారం గుండా బయటికి వచ్చే వారందరూ
  rationale: హీబ్రూ పదబంధంలోని పట్టణ ద్వారం అనే స్పష్టమైన చిత్రాన్ని, వచనంలోని పునరుక్తిని నిలుపుతుంది. ఇది ప్రజాజీవితంలో పాల్గొనే పట్టణ పురుషులను సూచించే నుడికారమని పాదసూచిక వివరిస్తుంది.
- source_word: בְּנוֹ
  choice: అతని కుమారుడైన
  rationale: షెకెముకు హమోరుతో ఉన్న పుత్ర సంబంధాన్ని సహజమైన తెలుగు విశేషణ నిర్మాణంలో స్పష్టంగా తెలియజేస్తుంది.
- source_word: וַיִּמֹּלוּ
  choice: సున్నతి చేయించుకున్నారు
  rationale: నిఫాల్ రూపంలోని పాసివ్/రిఫ్లెక్సివ్ భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; వారు తమకు తామే ఆ క్రియ చేశారని అనవసరంగా నిర్దేశించదు.
- source_word: כָּל זָכָר
  choice: పురుషులందరూ
  rationale: సందర్భంలో పట్టణంలోని మగవారిని సూచిస్తుంది. తెలుగు వాక్య సమ్మతికి, వెంట వచ్చే బహువచన పదబంధానికి ఇది సహజంగా సరిపోతుంది.
- source_word: שַׁעַר עִירוֹ
  choice: అతని పట్టణ ద్వారం
  rationale: పౌర సమావేశాలు, నిర్ణయాలు జరిగే పట్టణ ద్వారం అనే మూలభాషలోని స్పష్టమైన ప్రదేశ సూచనను వ్యాఖ్యానాత్మక పదంతో భర్తీ చేయకుండా నిలుపుతుంది.
