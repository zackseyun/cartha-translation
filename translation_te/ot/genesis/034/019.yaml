    issue: ‘అంతేకాక’ is stronger than the Hebrew conjunction.
    rationale: The final waw simply coordinates the clause (‘and he was …’); ‘అంతేకాక’ introduces an additive/discoursal emphasis. Replacing it with ‘మరియు’ is closer and equally natural.
