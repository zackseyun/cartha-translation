translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి పాటించబడింది. ‘తండ్రి ఇల్లు’ అనే హెబ్రీ కుటుంబపరమైన నుడికారాన్ని ‘తండ్రి ఇంటివారు’గా స్పష్టం చేశాం. మִכֹּל నిర్మాణాన్ని ప్రధాన పాఠ్యంలో సహజమైన అత్యుత్తమార్థకంగా, పాదటిప్పణిలో తులనాత్మకంగా నిలిపాం.
