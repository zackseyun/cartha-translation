  yaml_path: translation/ot/genesis/034/019.yaml
  text: And the young man did not delay to do the thing[a], because he delighted in Jacob’s daughter[d][c][b], and he was honored above all his father’s house.
translation:
  language: te
  text: ఆ యువకుడు ఆ పని చేయడానికి ఆలస్యం చేయలేదు[a], ఎందుకంటే అతడు యాకోబు కుమార్తెను ఎంతో కోరుకున్నాడు[b]; మరియు అతడు తన తండ్రి ఇంటివారందరిలో అత్యంత గౌరవనీయుడు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆ పని చేయడానికి వెనుకాడలేదు.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘యాకోబు కుమార్తెపట్ల అతడు ఎంతో మక్కువ చూపాడు’ లేదా ‘ఆమెపట్ల అతడు ఎంతో సంతోషించాడు.’
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘అతడు తన తండ్రి ఇంటివారందరికంటే ఎక్కువ గౌరవం పొందినవాడు.’
    reason: grammatical_alternative
lexical_decisions:
- source_word: אֵחַר
  choice: ఆలస్యం చేయలేదు
  rationale: ఈ క్రియ ప్రధానంగా ఆలస్యం చేయడం లేదా తాత్సారం చేయడం అనే కాలసంబంధ భావాన్ని ఇస్తుంది; సందర్భంలో అతడు వెంటనే చర్యకు దిగినట్లు సూచిస్తుంది.
- source_word: הַנַּעַר
  choice: ఆ యువకుడు
  rationale: ఇది షెకెమును సూచిస్తుంది. ఆధునిక తెలుగు కథనంలో ‘యువకుడు’ సహజంగా ఉండి, వయస్సును అతిగా నిర్దిష్టం చేయదు.
- source_word: לַעֲשׂוֹת הַדָּבָר
  choice: ఆ పని చేయడంలో
  rationale: ముందటి వచనాల్లో కోరిన కార్యాన్ని తిరిగి సూచించే హెబ్రీ నుడికారాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: అతడు ఆలస్యం చేయకపోవడానికి కారణాన్ని స్పష్టంగా పరిచయం చేస్తుంది.
- source_word: חָפֵץ
  choice: ఎంతో కోరుకున్నాడు
  rationale: ఈ సందర్భంలో కుమార్తెపట్ల బలమైన ఇష్టం లేదా వాంఛను సూచిస్తుంది. ‘కోరుకున్నాడు’ ఆ భావాన్ని సహజంగా అందిస్తుండగా, ‘ఎంతో’ దాని తీవ్రతను తెలియజేస్తుంది.
- source_word: בְּבַת יַעֲקֹב
  choice: యాకోబు కుమార్తెను
  rationale: חָפֵץ తో వచ్చిన בְ ను తెలుగులో కర్మవిభక్తితో సహజంగా వ్యక్తం చేయడం సముచితం.
- source_word: נִכְבָּד
  choice: అత్యంత గౌరవనీయుడు
  rationale: כבד యొక్క నిఫాల్ రూపం గౌరవింపబడిన, ప్రతిష్ఠగల వ్యక్తిని సూచిస్తుంది. తరువాతి מִכֹּל తో కలిపి తెలుగులో సహజమైన అత్యుత్తమార్థక నిర్మాణం వాడబడింది.
- source_word: מִכֹּל בֵּית אָבִיו
  choice: తన తండ్రి ఇంటివారందరిలో
  rationale: ఇక్కడ ‘తండ్రి ఇల్లు’ భవనం కాక కుటుంబం లేదా ఇంటివారిని సూచిస్తుంది; పోలిక ఆ కుటుంబ సభ్యులందరితో ఉంది.
