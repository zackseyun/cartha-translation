id: GEN.34.11
reference: Genesis 34:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר שְׁכֶם֙ אֶל אָבִ֣י/ה וְ/אֶל אַחֶ֔י/הָ אֶמְצָא חֵ֖ן בְּ/עֵינֵי/כֶ֑ם וַ/אֲשֶׁ֥ר תֹּאמְר֛וּ אֵלַ֖/י אֶתֵּֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/011.yaml
  text: Then Shechem said to her father and to her brothers[a], “Let me find favor in your eyes, and whatever you say to me[b], I will give.”
translation:
  language: te
  text: 'అప్పుడు షెకెము ఆమె తండ్రితోను ఆమె సోదరులతోను ఇలా అన్నాడు: “మీ దృష్టిలో నాకు దయ కలుగునుగాక; మీరు నాతో ఏమి చెప్పినా[a], నేను ఇస్తాను.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీరు నన్ను ఏమి అడిగినా, నేను ఇస్తాను.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... ఇలా అన్నాడు
  rationale: వావ్-క్రమరూపం కథనాన్ని ముందుకు నడిపిస్తుంది; ఆధునిక తెలుగులో ‘అప్పుడు’ దాని క్రమార్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: שְׁכֶם
  choice: షెకెము
  rationale: వ్యక్తి పేరును హీబ్రూ ఉచ్చారణకు దగ్గరగా తెలుగు లిపిలో ఇచ్చాం.
- source_word: אֶל אָבִיהָ וְאֶל אַחֶיהָ
  choice: ఆమె తండ్రితో, ఆమె సహోదరులతో
  rationale: పునరుక్తమైన אֶלను రెండు సంబంధపదాలతో ప్రతిబింబించాం; אַחֶיהָ పురుష బహువచనం కావడంతో ‘సహోదరులు’ అని ఇచ్చాం.
- source_word: אֶמְצָא חֵן בְּעֵינֵיכֶם
  choice: మీ దృష్టిలో నాకు అనుగ్రహం లభించనివ్వండి
  rationale: అంగీకారం లేదా ఆదరణ కోరే హీబ్రూ నుడికారాన్ని గౌరవప్రదమైన, అర్థమయ్యే తెలుగులో ఇచ్చాం; ‘కళ్లలో’ అనే అక్షరార్థ రూపం కంటే ‘దృష్టిలో’ తెలుగు నుడికారానికి సహజం.
- source_word: וַאֲשֶׁר תֹּאמְרוּ אֵלַי
  choice: మీరు నాతో ఏమి చెప్పినా
  rationale: అనిర్దిష్ట సంబంధవాక్యపు విస్తృత భావాన్ని నిలిపి, אָמַר אֶל యొక్క ప్రాథమిక ‘చెప్పు’ అర్థాన్ని ఉంచాం; సందర్భానుసారమైన ‘నన్ను ఏమి అడిగినా’ అనే భావాన్ని ప్రధాన పాఠ్యంలోకి దిగుమతి చేయలేదు.
- source_word: אֶתֵּן
  choice: నేను ఇస్తాను
  rationale: נָתַן యొక్క సాధారణ అర్థమైన ‘ఇస్తాను’ను నిలిపాం; వివాహ చర్చల సందర్భం ఉన్నప్పటికీ ‘చెల్లిస్తాను’ అని అర్థాన్ని సంకుచితం చేయలేదు.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన కథనశైలిని వాడాం. హీబ్రూ మూలంలోని ‘చెప్పినా’ అనే విస్తృత పదాన్ని ప్రధాన పాఠ్యంలో నిలిపి, సందర్భానుసారమైన ‘అడిగినా’ను పాదసూచికలో ఇచ్చాం.
