source:
  edition: WLC
  text: אַךְ בְּ֠/זֹאת יֵאֹ֨תוּ לָ֤/נוּ הָ/אֲנָשִׁים֙ לָ/שֶׁ֣בֶת אִתָּ֔/נוּ לִ/הְי֖וֹת לְ/עַ֣ם אֶחָ֑ד בְּ/הִמּ֥וֹל לָ֨/נוּ֙ כָּל זָכָ֔ר כַּ/אֲשֶׁ֖ר הֵ֥ם נִמֹּלִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/022.yaml
  text: 'Only on this condition will the men agree with us[a], to dwell with us and to become one people: that every male among us be circumcised, just as they are circumcised.'
translation:
  language: te
  text: 'ఈ ఒక్క షరతుపైనే ఆ పురుషులు మనతో నివసించడానికి, మనతో ఒకే ప్రజగా కావడానికి మనకు సమ్మతిస్తారు[a]: మనలోని ప్రతి మగవాడు వారు సున్నతి పొందినట్లే సున్నతి పొందితేనే.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మన ప్రతిపాదనకు ఒప్పుకుంటారు,’ ‘మనపట్ల సుముఖంగా ఉంటారు’; హీబ్రూ క్రియ ఒప్పుకోలు లేదా సమ్మతిని వ్యక్తం చేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ בְּזֹאת
  choice: అయితే, ఈ ఒక్క షరతు మీదనే
  rationale: אַךְ యొక్క పరిమితి భావాన్ని, בְּזֹאת సూచించే షరతును సహజమైన ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది; ‘అయితే’ సందర్భంలోని వ్యతిరేక మలుపును కూడా నిలుపుతుంది.
- source_word: יֵאֹתוּ לָנוּ
  choice: మనకు సమ్మతిస్తారు
  rationale: אוה నిఫాల్ రూపం ఇక్కడ ఇష్టపడటం కంటే ఒప్పుకోవడం లేదా సమ్మతించడం అనే చర్చాపరమైన భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: הָאֲנָשִׁים
  choice: ఆ మనుషులు
  rationale: పురుష బహువచన సూచనను నిలుపుతూ, సందర్భంలో ఇంతకుముందు ప్రస్తావించిన సమూహాన్ని సూచిస్తుంది.
- source_word: לָשֶׁבֶת אִתָּנוּ
  choice: మనతో నివసించి
  rationale: ישב యొక్క కలిసి నివసించడం అనే భావాన్ని సహజంగా అందిస్తుంది.
- source_word: לִהְיוֹת לְעַם אֶחָד
  choice: ఒకే ప్రజగా ఉండడానికి
  rationale: ‘ఒకే జాతి’ అని రాజకీయ భావాన్ని అధికంగా చేర్చకుండా, ఏకీకృత సమాజంగా ఉండే భావాన్ని నిలుపుతుంది.
- source_word: בְּהִמּוֹל לָנוּ כָּל זָכָר
  choice: మనలోని ప్రతి మగవాడూ సున్నతి పొందాలి
  rationale: בְּ తో వచ్చిన క్రియారూపంలోని షరతు భావాన్ని తెలుగులో విధిగా స్పష్టం చేస్తూ, זָכָר వయోజన పురుషులకే పరిమితం కాని ‘మగవాడు’ అనే భావాన్ని కాపాడుతుంది.
- source_word: כַּאֲשֶׁר הֵם נִמֹּלִים
  choice: వారు సున్నతి పొందినట్లే
  rationale: హీబ్రూలోని పోలికను, కర్మణి భావాన్ని అదనపు వివరణ లేకుండా నిలుపుతుంది.
