translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘సున్నతి పొందడం’ అనే సాధారణ బైబిలు పదబంధాన్ని ఉంచి, మూలంలోని షరతు మరియు సమ్మతి భావాలు స్పష్టంగా వ్యక్తం చేయబడ్డాయి.
