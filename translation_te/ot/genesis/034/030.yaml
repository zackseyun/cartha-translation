source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יַעֲקֹ֜ב אֶל שִׁמְע֣וֹן וְ/אֶל לֵוִי֮ עֲכַרְתֶּ֣ם אֹתִ/י֒ לְ/הַבְאִישֵׁ֨/נִי֙ בְּ/יֹשֵׁ֣ב הָ/אָ֔רֶץ בַּֽ/כְּנַעֲנִ֖י וּ/בַ/פְּרִזִּ֑י וַ/אֲנִי֙ מְתֵ֣י מִסְפָּ֔ר וְ/נֶאֶסְפ֤וּ עָלַ/י֙ וְ/הִכּ֔וּ/נִי וְ/נִשְׁמַדְתִּ֖י אֲנִ֥י וּ/בֵיתִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/030.yaml
  text: Then Jacob said to Simeon and Levi[a], “You have brought trouble on me, making me stink among the inhabitants of the land, among the Canaanites and the Perizzites. Since I am few in number, they will gather against me and strike me down[b], and I will be destroyed—I and my household.”
translation:
  language: te
  text: 'అప్పుడు యాకోబు షిమ్యోనుతో, లేవితో ఇలా అన్నాడు: “మీరు నాకు కష్టం తెచ్చారు; ఈ దేశ నివాసులైన కనానీయులకూ పెరిజ్జీయులకూ నాకు దుర్వాసన వచ్చేలా చేశారు[a]. నా వాళ్లు సంఖ్యలో కొద్దిమందే. వారు నాకు వ్యతిరేకంగా కూడి నన్ను కొడతారు[b]; అప్పుడు నేనూ నా ఇంటివారూ నాశనమవుతాం.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “నాకు దుర్వాసన వచ్చేలా చేశారు”; అంటే, దేశ ప్రజలు నన్ను అసహ్యించుకునేలా లేదా ద్వేషించేలా చేశారు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “నాపై దాడి చేస్తారు”; హీబ్రూ క్రియకు కొట్టడం, దాడి చేయడం, ఓడించడం వంటి విస్తృత భావాలు ఉన్నాయి.
    reason: source_ambiguity
lexical_decisions:
- source_word: עֲכַרְתֶּם
  choice: మీరు నా మీదికి కష్టం తెచ్చారు
  rationale: ఈ క్రియ ఎవరికైనా కష్టం లేదా విపత్తు కలిగించడాన్ని సూచిస్తుంది. తెలుగు వాక్యరూపం యాకోబు చేసిన నేరారోపణను సహజంగా నిలుపుతుంది.
- source_word: לְהַבְאִישֵׁנִי
  choice: నన్ను దుర్వాసనగా చేసి
  rationale: హీబ్రూ పదంలోని ‘దుర్వాసన కలిగించడం’ అనే సజీవ రూపకాన్ని ప్రధాన పాఠ్యంలో నిలిపి, దాని సామాజిక భావాన్ని పాదటిప్పణిలో వివరించాం.
- source_word: בְּיֹשֵׁב הָאָרֶץ
  choice: ఈ దేశ నివాసులైన
  rationale: సమూహార్థక ఏకవచన కృదంతం దేశంలో నివసించే ప్రజలను సూచిస్తుంది; తరువాత వచ్చే కనానీయులు, పెరిజ్జీయులతో సహజంగా అనుసంధానించాం.
- source_word: בַּכְּנַעֲנִי וּבַפְּרִזִּי
  choice: కనానీయులలోను పెరిజ్జీయులలోను
  rationale: యాకోబు పేరు చెడిపోయిన సామాజిక వర్గాలను ‘లో’ అనే విభక్తితో స్పష్టంగా తెలిపాం.
- source_word: מְתֵי מִסְפָּר
  choice: నా జనబలం కొద్దే
  rationale: అక్షరార్థంగా అసహజమయ్యే ‘సంఖ్యగల మనుషులు’ అనే రూపానికి బదులు, యాకోబు వర్గం సంఖ్యాపరంగా చిన్నదని సందర్భానుగుణంగా తెలిపాం.
- source_word: וְנֶאֶסְפוּ עָלַי
  choice: వారు నాపై కూడి
  rationale: నిఫాల్ రూపంలోని కలిసి సమకూడే భావాన్ని సహజమైన తెలుగులో నిలిపాం; శత్రుత్వ దిశను ‘నాపై’ తెలియజేస్తుంది.
- source_word: וְהִכּוּנִי
  choice: నన్ను దెబ్బతీస్తారు
  rationale: נכה అనే విస్తృతార్థక క్రియ కొట్టడం, దాడి చేయడం లేదా ఓడించడం అనే భావాలను కలిగి ఉంటుంది. వెంటనే వచ్చే సంపూర్ణ నాశన భావంతో అనవసర పునరుక్తి రాకుండా విస్తృతమైన పదాన్ని ఎంచుకున్నాం.
- source_word: וְנִשְׁמַדְתִּי
  choice: నాశనమవుతాం
  rationale: హీబ్రూ క్రియలోని నిర్మూలన తీవ్రతను ‘నాశనం’ నిలుపుతుంది. ‘నేనూ నా ఇంటివారూ’ అనే సంయుక్త కర్తకు అనుగుణంగా తెలుగులో బహువచనం వాడాం.
- source_word: בֵּיתִי
  choice: నా ఇంటివారు
  rationale: ఇక్కడ ‘ఇల్లు’ భవనాన్ని కాక యాకోబు కుటుంబం లేదా గృహసమూహాన్ని సూచిస్తుంది; ‘ఇంటివారు’ సాధారణ ఆధునిక తెలుగులో సహజం.
