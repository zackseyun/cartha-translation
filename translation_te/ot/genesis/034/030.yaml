  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలిని వాడాం. హీబ్రూలోని దుర్వాసన రూపకాన్ని ఉద్దేశపూర్వకంగా ప్రధాన పాఠ్యంలో నిలిపాం; కఠినమైన సంఖ్యా నుడికారాన్ని ‘నా జనబలం కొద్దే’గా సహజీకరించాం.
