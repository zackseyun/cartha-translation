review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the sons’ arrival on hearing the news, their grief and intense anger, Shechem’s singular act, the sexual euphemism, and the concluding social-moral prohibition. However, “తిరిగి వచ్చారు” adds the idea of returning, whereas מן השדה says only that they came from the field.
  naturalness: The Telugu is generally clear and modern. Replacing the repeated noun phrase “ఆ మనుషులు” with “వారు” is more idiomatic and keeps its antecedent unambiguously with Jacob’s sons.
  terminology: “ఘోరమైన పని” suitably communicates נְבָלָה in accessible modern Telugu. “ఇశ్రాయేలులో” appropriately preserves the source expression’s interpretive openness, and “అలాంటిది చేయకూడదు” retains the force of the impersonal prohibition without importing doctrinal interpretation.
  issues:
  - severity: medium
    issue: “తిరిగి వచ్చారు” translates an unstated return.
    rationale: The Hebrew בָּאוּ מִן־הַשָּׂדֶה means “came from the field”; it does not explicitly say that they returned. “వచ్చారు” preserves the source without added narrative detail.
  - severity: low
    issue: “ఆ మనుషులు” is an unnecessarily literal and slightly awkward repetition.
    rationale: הָאֲנָשִׁים resumes Jacob’s sons, not a newly introduced group. Telugu “వారు” naturally maintains this reference and avoids a possible momentary ambiguity.
  revised_text: యాకోబు కుమారులు ఆ సంగతి విని పొలం నుండి వచ్చారు. వారు ఎంతో దుఃఖపడి, మిక్కిలి కోపగించుకున్నారు. ఎందుకంటే యాకోబు కుమార్తెతో పడుకోవడం ద్వారా అతడు ఇశ్రాయేలులో ఘోరమైన పని చేశాడు; అలాంటిది చేయకూడదు.
  revised_footnotes: []
  revision_rationale: The revision removes the unsupported implication of return and improves Telugu cohesion while retaining the Hebrew sequence, the singular reference to the offender, the euphemistic sexual expression, the open sense of “in Israel,” and the categorical final prohibition.
