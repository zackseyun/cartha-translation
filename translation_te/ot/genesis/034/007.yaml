id: GEN.34.7
reference: Genesis 34:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/בְנֵ֨י יַעֲקֹ֜ב בָּ֤אוּ מִן הַ/שָּׂדֶה֙ כְּ/שָׁמְעָ֔/ם וַ/יִּֽתְעַצְּבוּ֙ הָֽ/אֲנָשִׁ֔ים וַ/יִּ֥חַר לָ/הֶ֖ם מְאֹ֑ד כִּֽי נְבָלָ֞ה עָשָׂ֣ה בְ/יִשְׂרָאֵ֗ל לִ/שְׁכַּב֙ אֶת בַּֽת יַעֲקֹ֔ב וְ/כֵ֖ן לֹ֥א יֵעָשֶֽׂה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/007.yaml
  text: And Jacob’s sons came in from the field when they heard it, and the men were grieved and very angry, because he had done an outrageous thing in Israel by lying with Jacob’s daughter, for such a thing must not be done.
translation:
  language: te
  text: యాకోబు కుమారులు ఆ సంగతి విని పొలం నుండి వచ్చారు. వారు ఎంతో దుఃఖపడి, మిక్కిలి కోపగించుకున్నారు. ఎందుకంటే యాకోబు కుమార్తెతో పడుకోవడం ద్వారా అతడు ఇశ్రాయేలులో ఘోరమైన పని చేశాడు; అలాంటిది చేయకూడదు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתְעַצְּבוּ
  choice: ఎంతో దుఃఖపడి
  rationale: ఈ క్రియలో కలిగిన మనోవేదనను సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది; వెంట వచ్చే కోపానికి భిన్నమైన భావాన్ని నిలుపుతుంది.
- source_word: נְבָלָה
  choice: ఘోరమైన పని
  rationale: ఇక్కడ ఇది కేవలం అవమానకరమైన చర్యను కాక, సామాజికంగా మరియు నైతికంగా సహించరాని దుష్కార్యాన్ని సూచిస్తుంది. ‘ఘోరమైన పని’ ఆ తీవ్రతను సాధారణ పాఠకునికి స్పష్టంగా అందిస్తుంది.
- source_word: לִשְׁכַּב אֶת
  choice: తో పడుకోవడం
  rationale: లైంగిక సంబంధాన్ని సూచించే మూలపాఠంలోని మృదూక్తిని అలాగే ఉంచే సహజమైన తెలుగు వ్యక్తీకరణ.
- source_word: וְכֵן לֹא יֵעָשֶׂה
  choice: అలాంటి పని చేయకూడదు
  rationale: సమాజ నియమాన్ని బలంగా తెలిపే మూలవాక్య భావాన్ని సహజంగా అందిస్తుంది; ‘జరగదు’ అనే శుద్ధ వర్ణనగా కాక నిషేధార్థాన్ని వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: בְיִשְׂרָאֵל అనే కాలాతీత లేదా సమూహపరమైన వ్యాఖ్య
  choice: ఇశ్రాయేలులో
  alternative: ఇశ్రాయేలు వంశంలో
  rationale: మూలపాఠంలోని సంక్షిప్త, భావగర్భిత ప్రయోగాన్ని అలాగే ఉంచి, అది వ్యక్తి యాకోబునా, కుటుంబ సమాజమా, తరువాతి జాతి గుర్తింపా అన్న ఉద్వేగాన్ని అనవసరంగా పరిష్కరించదు.
- issue: చివరి వాక్యంలోని నియమబలం
  choice: అలాంటి పని చేయకూడదు
  alternative: అలాంటి పని జరగదు
  rationale: హీబ్రూ నిష్క్రియ రూపం సామాజిక-నైతిక నిషేధాన్ని తెలియజేస్తుంది. తెలుగు అనువాదం దాని విధేయతా బలాన్ని నిలుపుతుంది; అదనపు మతపరమైన వ్యాఖ్యను చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనా సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్య నిర్మాణం. హీబ్రూ వాక్యంలోని భావక్రమాన్ని నిలుపుతూ, తెలుగులో అసహజమైన పునరుక్తిని నివారించడానికి మొదటి వాక్యాన్ని విడదీసి, ‘ఆ మనుషులు’ అనే స్పష్టమైన సూచనను ఉంచాం.
