revisions:
- from: హివ్వీయుడైన హమోరు కుమారుడు షెకెము—ఆ దేశపు అధిపతి—ఆమెను చూశాడు. అతడు ఆమెను పట్టుకొని, ఆమెతో శయనించి, ఆమెపై లైంగిక దౌర్జన్యం చేశాడు.[a]
  to: హివ్వీయుడైన హమోరు కుమారుడూ, ఆ దేశపు అధిపతియైన షెకెము ఆమెను చూశాడు. అతడు ఆమెను తీసుకొని, ఆమెతో శయనించి, ఆమెను అవమానపరచాడు.[a]
