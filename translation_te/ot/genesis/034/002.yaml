source:
  edition: WLC
  text: וַ/יַּ֨רְא אֹתָ֜/הּ שְׁכֶ֧ם בֶּן חֲמ֛וֹר הַֽ/חִוִּ֖י נְשִׂ֣יא הָ/אָ֑רֶץ וַ/יִּקַּ֥ח אֹתָ֛/הּ וַ/יִּשְׁכַּ֥ב אֹתָ֖/הּ וַ/יְעַנֶּֽ/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/002.yaml
  text: When Shechem son of Hamor the Hivite[a], the prince of the land, saw her[b], he took her and lay with her and humiliated her.
translation:
  language: te
  text: హివ్వీయుడైన హమోరు కుమారుడూ, ఆ దేశపు అధిపతియైన షెకెము ఆమెను చూశాడు. అతడు ఆమెను తీసుకొని, ఆమెతో శయనించి, ఆమెను అవమానపరచాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూలభాషలోని చివరి క్రియకు ‘బాధపరిచాడు,’ ‘అవమానపరచాడు,’ లేదా ‘ఉల్లంఘించాడు’ అనే అర్థాలు రావచ్చు. ఈ లైంగిక సందర్భంలో అది ఆమెపై జరిగిన లైంగిక ఉల్లంఘనను సూచిస్తుంది; అందువల్ల కొన్ని అనువాదాలు ‘ఆమెపై అత్యాచారం చేశాడు’ అని మరింత స్పష్టంగా అనువదిస్తాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: చూశాడు
  rationale: ראה అనే క్రియకు ఇక్కడి కథన సందర్భంలో ఉన్న సాధారణ అర్థాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: שְׁכֶם בֶּן־חֲמוֹר הַחִוִּי
  choice: హివ్వీయుడైన హమోరు కుమారుడు షెకెము
  rationale: వ్యక్తి పేర్లు, జాతి సూచన, తండ్రీకొడుకుల సంబంధం అన్నిటినీ తెలుగు వాక్యనిర్మాణంలో స్పష్టంగా ఉంచుతుంది.
- source_word: נְשִׂיא הָאָרֶץ
  choice: ఆ దేశపు అధిపతి
  rationale: נָשִׂיא సూచించే నాయకత్వ హోదాను తెలియజేస్తుంది; రాజు అనే నిర్దిష్ట హోదాను అనవసరంగా ఆపాదించదు.
- source_word: וַיִּקַּח אֹתָהּ
  choice: ఆమెను పట్టుకొని
  rationale: לקח యొక్క ప్రాథమిక ‘తీసుకొను’ భావాన్ని ఈ బలవంతపు సందర్భంలో సహజంగా వ్యక్తం చేస్తుంది; ‘ఎత్తుకుపోయాడు’ వంటి అదనపు స్థలాంతర భావాన్ని చేర్చదు.
- source_word: וַיִּשְׁכַּב אֹתָהּ
  choice: ఆమెతో శయనించి
  rationale: లైంగిక సంభోగాన్ని సూచించే హీబ్రూ నుడికారాన్ని గంభీరమైన, మర్యాదపూర్వక తెలుగు రూపంలో నిలుపుతుంది.
- source_word: וַיְעַנֶּהָ
  choice: ఆమెపై లైంగిక దౌర్జన్యం చేశాడు
  rationale: పియేల్ రూపంలోని ענה బాధపరచడం, అవమానించడం, అణచివేయడం అనే భావాలను కలిగి ఉంది; ఈ లైంగిక సందర్భంలో జరిగిన బలవంతపు ఉల్లంఘనను స్పష్టంగా తెలియజేస్తూ, పదానికి ఉన్న విస్తృత భావపరిధిని పాదసూచికలో నిలుపుతుంది.
theological_decisions:
- issue: లైంగిక హింసను మృదువుగా చేయకుండా, హీబ్రూ పదంలోని భావవిస్తృతిని కాపాడటం
  choice: ఆమెను పట్టుకొని, ఆమెతో శయనించి, ఆమెపై లైంగిక దౌర్జన్యం చేశాడు
  alternative: ఆమెను పట్టుకొని, ఆమెతో శయనించి, ఆమెను అవమానపరిచాడు
  rationale: క్రియల వరుస బలవంతపు లైంగిక తప్పును సూచిస్తుంది. ప్రధాన పాఠం సంఘటన స్వభావాన్ని స్పష్టంగా చెబుతుంది; అయితే చివరి హీబ్రూ క్రియకు ‘అవమానపరచు’ అనే విస్తృత భావం కూడా ఉందని పాదసూచిక తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరమైన కథన శైలి వాడబడింది. ‘శయనించి’ అనే రూపం సందర్భపు తీవ్రతకు తగిన మర్యాదపూర్వక పదం; ‘లైంగిక దౌర్జన్యం’ సంఘటనను అస్పష్టంగా లేదా మృదువుగా చేయకుండా తెలియజేస్తుంది.
