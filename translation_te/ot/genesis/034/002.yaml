review_pass:
  verdict: revise
  source_fidelity: The draft accurately identifies Shechem, Hamor, the Hivites, and Shechem's leadership status. However, “పట్టుకొని” (“seizing/holding”) is stronger than the basic Hebrew וַיִּקַּח (“took”), and the main-text rendering of the final verb should retain its lexical ambiguity while the note explains its sexual-violence context.
  naturalness: The revised wording is natural, modern standard Telugu and keeps a grave narrative register. “ఆమెతో శయనించి” is an appropriate formal idiom in this context.
  terminology: “హివ్వీయుడు,” “అధిపతి,” and “శయనించి” are suitable. Rendering וַיְעַנֶּהָ as “అవమానపరచాడు” preserves the Hebrew verb’s broad sense; the footnote makes clear that in this context it denotes sexual violation without requiring a more narrowly specified term in the main text.
  issues:
  - severity: medium
    issue: “ఆమెను పట్టుకొని” over-specifies וַיִּקַּח.
    rationale: לקח has the basic narrative sense “took.” Although the context is coercive, “పట్టుకొని” explicitly adds a seizing/holding nuance that the verb itself does not state.
  - severity: medium
    issue: “ఆమెపై లైంగిక దౌర్జన్యం చేశాడు” narrows the final Hebrew verb in the main text.
    rationale: ענה in the Piel can mean afflict, humiliate, or violate. The sexual context must not be softened, but “అవమానపరచాడు,” with an explanatory footnote, better preserves the lexical breadth while identifying the contextual sense.
  revised_text: హివ్వీయుడైన హమోరు కుమారుడూ, ఆ దేశపు అధిపతియైన షెకెము ఆమెను చూశాడు. అతడు ఆమెను తీసుకొని, ఆమెతో శయనించి, ఆమెను అవమానపరచాడు.[a]
