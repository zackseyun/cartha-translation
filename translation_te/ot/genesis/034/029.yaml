  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אֶת כָּל חֵילָ֤/ם וְ/אֶת כָּל טַפָּ/ם֙ וְ/אֶת נְשֵׁי/הֶ֔ם שָׁב֖וּ וַ/יָּבֹ֑זּוּ וְ/אֵ֖ת כָּל אֲשֶׁ֥ר בַּ/בָּֽיִת־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/029.yaml
  text: They took captive all their wealth and all their little ones and their wives[c][b][a], and plundered everything that was in the house.
translation:
  language: te
  text: వారి సంపదనంతటినీ స్వాధీనం చేసుకొని, వారి చిన్నపిల్లలనందరినీ[a], వారి భార్యలనందరినీ చెరపట్టి, ఇంట్లో[b] ఉన్నదంతటినీ దోచుకున్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘వారి పిల్లలనందరినీ’; హెబ్రీ טַף అనే పదం సాధారణంగా చిన్నపిల్లలను, కొన్నిసార్లు కుటుంబంపై ఆధారపడినవారిని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘వారి ఇంటివారికీ, ఆస్తులకూ చెందినదంతటినీ’; హెబ్రీలో ‘ఇల్లు’ అనే పదం కొన్నిసార్లు కుటుంబాన్ని, దాని ఆస్తులను కలిపి సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵילָם
  choice: వారి సంపదనంతటినీ
  rationale: חַיִל ఇక్కడ సైనిక బలంకన్నా ఆస్తి, వనరులు, సంపద అనే అర్థాన్ని ఇస్తుంది. ‘సంపద’ అనేది దానిని పశువులకు లేదా వస్తువులకు మాత్రమే పరిమితం చేయదు.
- source_word: טַפָּם
  choice: వారి చిన్నపిల్లలనందరినీ
  rationale: טַף సాధారణంగా కుటుంబంలోని చిన్నపిల్లలను, కొన్నిసార్లు ఆధారపడినవారిని సూచిస్తుంది. ‘చిన్నపిల్లలు’ ప్రధాన భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: נְשֵׁיהֶם
  choice: వారి భార్యలనందరినీ
  rationale: אִשָּׁה అనే పదానికి ‘స్త్రీ’ లేదా ‘భార్య’ అనే అర్థాలు ఉన్నాయి. కుటుంబ సభ్యుల జాబితాలో స్వామ్య ప్రత్యయంతో ఉన్నందున ‘వారి భార్యలు’ సహజమైన సంబంధార్థం.
- source_word: שָׁבוּ
  choice: చెరపట్టి
  rationale: שָׁבָה అంటే యుద్ధం లేదా దాడి సందర్భంలో మనుషులను బందీలుగా పట్టుకోవడం. ‘చెరపట్టి’ ఆ బలవంతపు నిర్బంధాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: וַיָּבֹזּוּ
  choice: దోచుకున్నారు
  rationale: בזז అంటే కొల్లగొట్టడం లేదా దోపిడీ సొమ్ముగా తీసుకోవడం. ‘దోచుకున్నారు’ ఆధునిక తెలుగులో స్పష్టంగా, సహజంగా ఉండి హింసాత్మక సందర్భాన్ని నిలుపుతుంది.
- source_word: כָּל אֲשֶׁר בַּבָּיִת
  choice: ఇంట్లో ఉన్నదంతటినీ
  rationale: ఏకవచనమైన בַּבָּיִת నేరుగా ‘ఇంట్లో’ అని అర్థమవుతుంది; సందర్భానుసారంగా కుటుంబ గృహస్థిని కూడా సూచించవచ్చు. ప్రధాన పాఠం మూలంలోని స్థలార్థానికి దగ్గరగా ఉంది.
