- from: వారి చిన్నపిల్లలనందరినీ[a], వారి భార్యలనందరినీ చెరపట్టి, వారి సంపదనంతటినీ, ఇంట్లో[b] ఉన్నదంతటినీ దోచుకున్నారు.
