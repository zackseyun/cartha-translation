translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సులభంగా అర్థమయ్యే శైలి. హెబ్రీలో సంపద, పిల్లలు, భార్యలు అన్నీ క్రియలకు ముందు కలిపి వస్తాయి; తెలుగులో ‘చెరపట్టడం’ మనుషులకు, ‘దోచుకోవడం’ సంపదకు సహజంగా అన్వయించేలా స్వల్ప పునర్వ్యవస్థీకరణ చేయబడింది. భావాన్ని మృదువుచేయకుండా దాడి మరియు చెర యొక్క తీవ్రతను నిలుపుకుంది.
