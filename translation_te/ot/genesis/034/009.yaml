id: GEN.34.9
reference: Genesis 34:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הִֽתְחַתְּנ֖וּ אֹתָ֑/נוּ בְּנֹֽתֵי/כֶם֙ תִּתְּנוּ לָ֔/נוּ וְ/אֶת בְּנֹתֵ֖י/נוּ תִּקְח֥וּ לָ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/009.yaml
  text: 'Intermarry with us: give your daughters to us[b][a], and take our daughters for yourselves.'
translation:
  language: te
  text: మాతో పెళ్లి సంబంధాలు ఏర్పరచుకోండి[a]. మీ కుమార్తెలను మాకు వివాహానికి ఇవ్వండి[b], మా కుమార్తెలను మీకు భార్యలుగా తీసుకోండి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “మాతో పెళ్లి బంధాలు ఏర్పరచుకోండి.” హీబ్రూ క్రియ పరస్పరం వివాహ బంధాల్లోకి ప్రవేశించడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అంటే, వివాహానికి ఇవ్వండి; ఈ వాక్యంలో “ఇవ్వండి,” “తీసుకోండి” అనే రెండు క్రియలకూ వివాహ భావమే వర్తిస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: וְהִתְחַתְּנוּ אֹתָנוּ
  choice: మాతో వివాహ సంబంధాలు పెట్టుకోండి
  rationale: חתן అనే క్రియ యొక్క హిత్‌పయేల్ రూపం ఇక్కడ పరస్పరం వివాహ బంధాలు ఏర్పరచుకోవడాన్ని సూచిస్తుంది. ఈ తెలుగు ప్రయోగం ఆ పరస్పర భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: בְּנֹתֵיכֶם
  choice: మీ కుమార్తెలను
  rationale: రెండవ పురుష బహువచన ప్రత్యయంతో ఉన్న బహువచన నామవాచకానికి నేరమైన అనువాదం.
- source_word: תִּתְּנוּ לָנוּ
  choice: మాకు ఇవ్వండి
  rationale: వివాహ సందర్భంలో נתן కుమార్తెలను వివాహానికి ఇవ్వడాన్ని సూచిస్తుంది. ముందున్న వివాహ సంబంధాల ప్రస్తావన ఈ సంక్షిప్త రూపానికి అవసరమైన అర్థాన్ని అందిస్తుంది.
- source_word: וְאֶת בְּנֹתֵינוּ תִּקְחוּ לָכֶם
  choice: మా కుమార్తెలను మీ కోసం తీసుకోండి
  rationale: మూలంలోని ‘తీసుకోండి’ అనే పదప్రయోగాన్ని, ‘మీ కోసం’ అనే పరస్పర నిర్మాణాన్ని నిలుపుతుంది; సందర్భం ఇది వివాహార్థమని స్పష్టం చేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని ఉపయోగించాం. పరస్పర వివాహ సంబంధ భావాన్ని స్పష్టంగా ఉంచుతూ, రెండో భాగంలో హీబ్రూ మూలంలోని ‘ఇవ్వడం/తీసుకోవడం’ సమాంతర నిర్మాణాన్ని సాధ్యమైనంతవరకు నిలిపాం.
