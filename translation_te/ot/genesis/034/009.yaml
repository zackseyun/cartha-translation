- from: మాతో వివాహ సంబంధాలు పెట్టుకోండి[a]. మీ కుమార్తెలను మాకు ఇవ్వండి[b]; మా కుమార్తెలను మీ కోసం తీసుకోండి.
  to: మాతో పెళ్లి సంబంధాలు ఏర్పరచుకోండి[a]. మీ కుమార్తెలను మాకు వివాహానికి ఇవ్వండి[b], మా కుమార్తెలను మీకు భార్యలుగా తీసుకోండి.
  rationale: The revision preserves the Hebrew reciprocal structure and its marriage-alliance sense, while replacing an awkward literal Telugu expression with an idiomatic phrase that explicitly reflects the contextually certain marital meaning of taking daughters. Footnote anchors remain correctly placed and the footnotes continue to support the lexical and cultural explanations.
