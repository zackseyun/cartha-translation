translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనప్పటికీ గౌరవప్రదమైన కథన శైలి. మూలంలోని ఉద్దేశం, దిశాభావం, సంబంధం స్పష్టంగా నిలుపబడ్డాయి.
