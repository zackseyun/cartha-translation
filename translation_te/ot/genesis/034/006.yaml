  text: Then Hamor, the father of Shechem, went out to Jacob to speak with him.
translation:
  language: te
  text: అప్పుడు షెకెము తండ్రియైన హమోరు యాకోబుతో మాట్లాడటానికి యాకోబు దగ్గరికి బయలుదేరి వెళ్లాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: బయలుదేరి వెళ్లాడు
  rationale: יצא అనే క్రియలోని ‘బయటికి వెళ్లడం/బయలుదేరడం’ అనే దిశాభావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: חֲמוֹר
  choice: హమోరు
  rationale: వ్యక్తి పేరును తెలుగులో సాధారణ బైబిలు లిప్యంతరీకరణకు అనుగుణంగా ఇచ్చాం.
- source_word: אֲבִי שְׁכֶם
  choice: షెకెము తండ్రి
  rationale: హీబ్రూ సంబంధ నిర్మాణాన్ని తెలుగులో సహజంగా, స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: אֶל יַעֲקֹב
  choice: యాకోబు దగ్గరికి
  rationale: אֶל సూచించే వ్యక్తివైపు గమనాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: לְדַבֵּר אִתּוֹ
  choice: అతనితో మాట్లాడడానికి
  rationale: లְ + infinitive ఉద్దేశాన్ని సూచిస్తుంది; אִתּוֹ పరస్పర సంభాషణ భావాన్ని ఇస్తుంది. ‘అతను’ సమీప పూర్వపదమైన యాకోబును సూచిస్తుంది.
- source_word: וַ
  choice: అప్పుడు
  rationale: కథనంలోని తదుపరి సంఘటనను సూచించే వావ్ క్రమబద్ధతను ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
