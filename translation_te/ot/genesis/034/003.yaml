revisions:
- from: అతని అంతరంగం యాకోబు కుమార్తె దీనా[a]తో పెనవేసుకుంది. అతడు ఆ యువతిని ప్రేమించి, ఆమెతో అనునయంగా మాట్లాడాడు[b].
  to: అతని మనస్సు యాకోబు కుమార్తె అయిన దీనా[a]కు అంటిపెట్టుకుంది. అతడు ఆ యువతిని ప్రేమించి, ఆమెతో అనునయంగా మాట్లాడాడు[b].
  rationale: The revision retains the verse's restrained report of attachment, love, and speech, but makes the first image directional rather than reciprocal. It also corrects the literal explanation of דבק in footnote a and clarifies the literal-versus-idiomatic distinction in footnote b. No doctrinal or moral gloss has been added.
