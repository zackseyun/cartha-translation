  text: וַ/תִּדְבַּ֣ק נַפְשׁ֔/וֹ בְּ/דִינָ֖ה בַּֽת יַעֲקֹ֑ב וַ/יֶּֽאֱהַב֙ אֶת הַֽ/נַּעֲרָ֔ וַ/יְדַבֵּ֖ר עַל לֵ֥ב הַֽ/נַּעֲרָֽ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/003.yaml
  text: His soul clung to Dinah[a], the daughter of Jacob[b], and he loved the young woman and spoke to the heart of the young woman.
translation:
  language: te
  text: అతని మనస్సు యాకోబు కుమార్తె అయిన దీనా[a]కు అంటిపెట్టుకుంది. అతడు ఆ యువతిని ప్రేమించి, ఆమెతో అనునయంగా మాట్లాడాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “అతని ప్రాణం దీనాకు అంటిపెట్టుకుంది.” ఇక్కడ “ప్రాణం” అతని అంతరంగాన్ని లేదా మనస్సును సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “ఆ యువతి హృదయంపై మాట్లాడాడు.” ఈ హీబ్రూ నుడికారం అనునయంగా, ఆప్యాయంగా, లేదా ధైర్యం కలిగించేలా మాట్లాడటాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּדְבַּק נַפְשׁוֹ
  choice: అతని అంతరంగం ...తో పెనవేసుకుంది
  rationale: דבק అనే క్రియలోని అంటుకోవడం, గట్టిగా హత్తుకోవడం అనే సన్నిహిత భావాన్ని ‘పెనవేసుకుంది’ సహజంగా తెలియజేస్తుంది. נפש ఇక్కడ వ్యక్తి అంతరంగాన్ని సూచిస్తుంది; ‘ప్రాణం’ అనే అక్షరార్థ రూపం తెలుగులో ఈ సందర్భంలో అసహజంగా ఉండవచ్చు.
- source_word: בְּדִינָה
  choice: దీనాతో
  rationale: דבק తో వచ్చిన ב సంబంధం లేదా అనుబంధాన్ని సూచిస్తుంది; తెలుగు క్రియ ‘పెనవేసుకుంది’తో ‘తో’ సహజమైన విభక్తి.
- source_word: בַּת יַעֲקֹב
  choice: యాకోబు కుమార్తె
  rationale: హీబ్రూ అన్వయాన్ని సంక్షిప్తంగా, సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: וַיֶּאֱהַב
  choice: ప్రేమించి
  rationale: אהב యొక్క సాధారణ అర్థమైన ‘ప్రేమించు’ను నేరుగా నిలుపుతుంది; చుట్టుపక్కల కథనాన్ని మృదువుపరచే లేదా మరింత ప్రతికూలంగా వ్యాఖ్యానించే పదాన్ని చేర్చదు.
- source_word: הַנַּעֲרָ
  choice: ఆ యువతిని / ఆమెతో
  rationale: נַעֲרָהకు ఆధునిక, గౌరవప్రదమైన తెలుగు రూపం ‘యువతి.’ చివరి ఉపవాక్యంలో పునరుక్తి అసహజంగా కాకుండా ఉండేందుకు సర్వనామం వాడబడింది.
- source_word: וַיְדַבֵּר עַל לֵב
  choice: అనునయంగా మాట్లాడాడు
  rationale: ‘హృదయం మీద/హృదయానికి మాట్లాడటం’ అనే హీబ్రూ నుడికారానికి సందర్భానుగుణంగా ఆప్యాయంగా, ఓదార్పుగా లేదా మెప్పించేలా మాట్లాడటం అనే భావం ఉంది. ‘అనునయంగా’ ఆ ఉద్దేశాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; అక్షరార్థ రూపం పాదటిప్పణిలో ఇవ్వబడింది.
theological_decisions:
- issue: మునుపటి దాడి తరువాత షెకెము భావోద్వేగాలను వర్ణించడం
  choice: ఈ వచనం చెప్పినట్టే అతని అనుబంధం, ప్రేమ, అనునయపు మాటలను నివేదికగా అనువదించడం
  alternative: అతని క్రియలకు ప్రతికూల నైతిక విశేషణాలను అనువాదంలోనే చేర్చడం, లేదా సంఘటనను ప్రేమకథలా మృదువుగా చూపడం
  rationale: హీబ్రూ వచనం ఇక్కడ అతని భావాలను సరళంగా నివేదిస్తుంది. అనువాదం మునుపటి హింసను సమర్థించకూడదు; అలాగే ఈ వచనంలో లేని నైతిక వ్యాఖ్యను చేర్చకూడదు.
- issue: נפש యొక్క మానవ అంతరంగార్థం
  choice: అంతరంగం
  alternative: ప్రాణం / ఆత్మ
  rationale: ఇక్కడ נפש మానవుని భావోద్వేగ స్వరూపాన్ని సూచిస్తుంది. ‘అంతరంగం’ సహజంగా ఆ భావాన్ని అందిస్తుంది; ప్రత్యేకమైన శరీర–ఆత్మ సిద్ధాంతాన్ని వచనంలోకి దిగుమతి చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథన శైలి. హీబ్రూ రూపకాల బలాన్ని ప్రధాన పాఠ్యంలో సహజంగా అందించి, వాటి అక్షరార్థ నిర్మాణాలను పాదటిప్పణుల్లో భద్రపరచింది.
