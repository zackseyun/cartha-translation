translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరమైన కథన శైలిని అనుసరించాం. ‘సహోదరి’ బైబిలు సందర్భానికి తగిన గౌరవప్రద పదం; ‘సున్నతి పొందని’ అనేది సాధారణ పాఠకులకు అర్థమయ్యే స్థిరమైన మత-సాంస్కృతిక పదప్రయోగం. పాదసూచిక గుర్తు [a] సంబంధిత వాక్యభాగం వెంట ప్రధాన పాఠ్యంలో ఉంచబడింది.
