source:
  edition: WLC
  text: וַ/יֹּאמְר֣וּ אֲלֵי/הֶ֗ם לֹ֤א נוּכַל֙ לַ/עֲשׂוֹת֙ הַ/דָּבָ֣ר הַ/זֶּ֔ה לָ/תֵת֙ אֶת אֲחֹתֵ֔/נוּ לְ/אִ֖ישׁ אֲשֶׁר ל֣/וֹ עָרְלָ֑ה כִּֽי חֶרְפָּ֥ה הִ֖וא לָֽ/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/014.yaml
  text: And they said to them[a], “We cannot do this thing, to give our sister to a man who has a foreskin, for that is a disgrace to us.”
translation:
  language: te
  text: 'వారు వారితో ఇలా అన్నారు: “సున్నతి పొందని పురుషునికి మా సహోదరిని ఇవ్వడం మాకు సాధ్యం కాదు; ఎందుకంటే అది మాకు అవమానం.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמְרוּ אֲלֵיהֶם
  choice: వారు వారితో ... అన్నారు
  rationale: אמר అనే సాధారణ కథన క్రియను సహజమైన తెలుగు ప్రత్యక్ష వాక్య నిర్మాణంలో ఇచ్చి, אֲלֵיהֶם లోని బహువచన పరోక్ష కర్మను ‘వారితో’గా నిలిపాం.
- source_word: לֹא נוּכַל לַעֲשׂוֹת הַדָּבָר הַזֶּה
  choice: ఈ పని మేము చేయలేం
  rationale: יכל సామర్థ్యలేమిని సూచిస్తుంది. הדבר הזה ను ఆధునిక తెలుగులో సహజంగా ‘ఈ పని’ అని అనువదించడం మూలార్థాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: לָתֵת אֶת אֲחֹתֵנוּ
  choice: మా సహోదరిని ఇవ్వలేం
  rationale: נתן యొక్క ‘ఇవ్వడం’ అనే మూల భావాన్ని నిలిపాం; వివాహ సందర్భం పరిసర వచనంలో స్పష్టమైనందున ‘పెళ్లికి ఇవ్వడం’ అని విస్తరించలేదు.
- source_word: לְאִישׁ אֲשֶׁר לוֹ עָרְלָה
  choice: సున్నతి పొందని వ్యక్తికి
  rationale: హీబ్రూ పదబంధం అక్షరార్థంగా ‘ముందోలు ఉన్న పురుషుడు’ అని ఉన్నా, అది సున్నతి పొందని వ్యక్తిని సూచించే వాడుక. ప్రధాన పాఠ్యంలో సహజమైన, గౌరవప్రదమైన ఆధునిక తెలుగు రూపాన్ని ఎంచుకొని, అక్షరార్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: כִּי חֶרְפָּה הִוא לָנוּ
  choice: అలా చేయడం మాకు అవమానం
  rationale: חרפה సామాజిక నింద, అవమానం, అపకీర్తి భావాలను కలిగి ఉంది. ‘అవమానం’ ఆధునిక పాఠకులకు సహజంగా ఈ గౌరవ-అపకీర్తి భావాన్ని తెలియజేస్తుంది; ‘అలా చేయడం’ ద్వారా సర్వనామ సూచనను తెలుగులో స్పష్టం చేశాం.
