    reason: మూల హీబ్రూలో ‘సున్నతి పొందని’ అనే అర్థాన్ని ‘శిశ్నచర్మం ఉన్న పురుషుడు’ అనే పదబంధంతో వ్యక్తం చేసింది.
  revision_rationale: The revision retains the Hebrew refusal and its honor/shame rationale, improves idiomatic Telugu speech introduction, restores the source-specific noun ‘man,’ and gives a precise, formal literal footnote. The footnote marker is omitted from the main text because the revised main wording does not rely on a lexical alternative; the literal expression is nevertheless supplied as an unanchored footnote set only if the publication system permits it. If footnotes must always be anchored, attach [a] immediately after ‘సున్నతి పొందని పురుషునికి’.
