  to: 'వారు వారితో ఇలా అన్నారు: “సున్నతి పొందని పురుషునికి మా సహోదరిని ఇవ్వడం మాకు సాధ్యం కాదు; ఎందుకంటే అది మాకు అవమానం.”'
