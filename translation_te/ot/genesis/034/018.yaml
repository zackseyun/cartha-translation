translation:
  language: te
  text: వారి మాటలు హమోరుకు, హమోరు కుమారుడైన షెకెముకు నచ్చాయి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారి మాటలు హమోరుకు, హమోరు కుమారుడైన షెకెముకు మంచివిగా అనిపించాయి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּיטְבוּ
  choice: నచ్చాయి
  rationale: יטב అనే క్రియ దִבְרֵיהֶםను కర్తగా తీసుకొని בְּעֵינֵי అనే మూలభాషా నుడికారంతో ఇక్కడ ఆమోదం లేదా మనోహరతను వ్యక్తం చేస్తుంది. ఆధునిక తెలుగులో ‘నచ్చాయి’ సహజంగా అదే భావాన్ని తెలియజేస్తుంది.
- source_word: דִבְרֵיהֶם
  choice: వారి మాటలు
  rationale: דָּבָר పదపు బహువచన రూపానికి మూడవ పురుష బహువచన ప్రత్యయం జతైంది. ‘వారి మాటలు’ మూలంలోని బహువచనాన్ని నిలుపుతుంది; ‘వారి ప్రతిపాదన’ అనేది సందర్భాన్ని మరింత సంకుచితం చేసే వ్యాఖ్యానాత్మక అనువాదం.
- source_word: בְּעֵינֵי
  choice: హమోరుకు … షెకెముకు
  rationale: అక్షరార్థంగా ‘కళ్లలో’ అనే ఈ హెబ్రీ నుడికారం అభిప్రాయం లేదా ఆమోదాన్ని సూచిస్తుంది. ‘నచ్చాయి’తో కలిసి తెలుగు సంప్రదాన విభక్తి ‘-కు’ ఆ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: חֲמוֹר
  choice: హమోరు
  rationale: వ్యక్తి పేరును తెలుగులో సహజంగా ఉచ్చరించగల రూపంలో లిప్యంతరీకరించాం.
- source_word: שְׁכֶם
  choice: షెకెము
  rationale: వ్యక్తి పేరును మూల ఉచ్చారణకు సమీపంగా, తెలుగులో సహజంగా ఉండేలా లిప్యంతరీకరించాం.
- source_word: בֶּן חֲמוֹר
  choice: హమోరు కుమారుడైన
  rationale: మూలంలోని తండ్రి–కుమారుని సంబంధాన్ని స్పష్టంగా, గౌరవప్రదమైన తెలుగు కథన శైలిలో నిలుపుతుంది.
