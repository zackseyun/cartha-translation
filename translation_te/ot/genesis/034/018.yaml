  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, సంక్షిప్తమైన కథన శైలి వాడబడింది. హెబ్రీ నుడికారాన్ని అక్షరానువాదంగా కాక దాని మూల్యాంకన భావంతో అందించగా, ప్రత్యామ్నాయ రూపాన్ని పాదసూచికలో ఉంచాం.
