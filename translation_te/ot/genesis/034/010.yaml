source:
  edition: WLC
  text: וְ/אִתָּ֖/נוּ תֵּשֵׁ֑בוּ וְ/הָ/אָ֨רֶץ֙ תִּהְיֶ֣ה לִ/פְנֵי/כֶ֔ם שְׁבוּ֙ וּ/סְחָר֔וּ/הָ וְ/הֵֽאָחֲז֖וּ בָּֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/010.yaml
  text: You may dwell with us[a], and the land will be before you. Settle in it, trade in it[b], and acquire property in it.
translation:
  language: te
  text: “మీరు మాతో నివసించవచ్చు; ఈ భూమి మీకు అందుబాటులో ఉంటుంది.[a] దానిలో స్థిరపడండి, వ్యాపారం చేయండి, ఆస్తి హక్కులు పొందండి.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఈ భూమి మీ ఎదుట ఉంటుంది.” అక్షరార్థంగా, “ఈ భూమి మీ ఎదుట ఉంటుంది.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “దానిలో స్వాధీనం పొందండి,” లేదా “దానిలో ఆస్తి హక్కు పొందండి.” హీబ్రూ పదబంధం భూమిలో స్థిరాస్తి లేదా ఆస్తి హక్కులు పొందడాన్ని సూచించే అవకాశం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִתָּנוּ תֵּשֵׁבוּ
  choice: మీరు మాతో నివసించవచ్చు
  rationale: יָשַׁב అంటే ‘నివసించు, స్థిరపడు’ అని అర్థం. సందర్భంలోని ఆహ్వాన లేదా అనుమతి భావాన్ని ‘నివసించవచ్చు’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וְהָאָרֶץ תִּהְיֶה לִפְנֵיכֶם
  choice: ఈ దేశం మీ ఎదుట ఉంటుంది
  rationale: హీబ్రూ ‘మీ ఎదుట’ అనే రూపకాన్ని నిలుపుతూ, దేశం వారికి అందుబాటులో ఉంటుందనే సందర్భార్థాన్ని పాదసూచికలో తెలిపింది.
- source_word: שְׁבוּ
  choice: ఇందులో స్థిరపడండి
  rationale: ఇది יָשַׁב క్రియ యొక్క ఆజ్ఞార్థక రూపం. భూమిలో నివాసం ఏర్పరచుకోవడం అనే భావాన్ని ‘స్థిరపడండి’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: וּסְחָרוּהָ
  choice: వ్యాపారం చేయండి
  rationale: סחר వాణిజ్య కార్యకలాపాన్ని సూచిస్తుంది. ‘వ్యాపారం చేయండి’ ఆధునిక తెలుగులో సహజమైన, స్పష్టమైన అనువాదం.
- source_word: וְהֵאָחֲזוּ בָּהּ
  choice: ఆస్తి సంపాదించుకోండి
  rationale: ఇక్కడ אָחַז నిఫాల్ రూపం దేశంలో స్థిరాస్తి లేదా భూహక్కు పొందడాన్ని సూచించే అవకాశం ఉంది; కేవలం భౌతికంగా పట్టుకోవడం కాదు.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన బహువచన సంబోధనను, సహజమైన ఆహ్వాన భాషను ఉపయోగించాం. హీబ్రూ వాక్యంలోని ‘మీ ఎదుట’ అనే రూపకాన్ని ప్రధాన పాఠంలో నిలిపి, దాని సందర్భార్థాన్ని పాదసూచికలో ఇచ్చాం.
