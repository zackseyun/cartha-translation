revisions:
- from: యాకోబు తన కుమార్తె దీనాను అతడు అపవిత్రపరిచాడని[a] విన్నాడు. అయితే అతని కుమారులు అతని పశువులతో పొలంలో ఉన్నారు; వారు వచ్చే వరకు యాకోబు మౌనంగా ఉన్నాడు.
  to: తన కుమార్తె దీనాను అపవిత్రపరిచాడని[a] యాకోబు విన్నాడు. అయితే అతని కుమారులు అతని పశువులతో పొలంలో ఉన్నారు; వారు వచ్చే వరకు యాకోబు మౌనంగా ఉన్నాడు.
