source:
  edition: WLC
  text: וְ/יַעֲקֹ֣ב שָׁמַ֗ע כִּ֤י טִמֵּא֙ אֶת דִּינָ֣ה בִתּ֔/וֹ וּ/בָנָ֛י/ו הָי֥וּ אֶת מִקְנֵ֖/הוּ בַּ/שָּׂדֶ֑ה וְ/הֶחֱרִ֥שׁ יַעֲקֹ֖ב עַד בֹּאָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/005.yaml
  text: Jacob heard that he had defiled his daughter Dinah. But his sons were with his livestock in the field[a], so Jacob kept silent until they came.
translation:
  language: te
  text: తన కుమార్తె దీనాను అపవిత్రపరిచాడని[a] యాకోబు విన్నాడు. అయితే అతని కుమారులు అతని పశువులతో పొలంలో ఉన్నారు; వారు వచ్చే వరకు యాకోబు మౌనంగా ఉన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘యాకోబు కుమార్తె దీనాను లైంగికంగా అవమానపరిచాడని.’ హీబ్రూ క్రియకు అక్షరార్థంగా ‘అపవిత్రం చేశాడు’ లేదా ‘అశుద్ధం చేశాడు’ అని అర్థం. ఈ సందర్భంలో అది దీనాపై జరిగిన లైంగిక అవమానాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַע
  choice: విన్నాడు
  rationale: నివేదిక ద్వారా విషయం తెలిసినట్లు సూచించే సాధారణ కథన ప్రయోగం; మూలంలోని ‘వినడం’ అనే ప్రత్యక్ష భావాన్ని నిలుపుతుంది.
- source_word: כִּי
  choice: అని
  rationale: యాకోబు విన్న విషయం ఏమిటో తెలిపే ఉపవాక్యాన్ని సహజమైన తెలుగులో పరిచయం చేస్తుంది.
- source_word: טִמֵּא
  choice: అపవిత్రపరిచాడు
  rationale: పీయేల్ రూపంలోని ‘అపవిత్రం చేయడం’ అనే మూలభావాన్ని కాపాడుతుంది; సందర్భంలోని లైంగిక అవమానాన్ని పాదసూచిక వివరిస్తుంది, అయితే మూలపదం కంటే నిర్దిష్టమైన నేరపదాన్ని ప్రధాన వచనంలో చేర్చదు.
- source_word: בִתּוֹ
  choice: తన కుమార్తె
  rationale: తెలుగులో వాక్యకర్త యాకోబుతో సహజంగా అనుసంధానమయ్యే స్వీయసంబంధ రూపం.
- source_word: וּבָנָיו
  choice: అయితే అతని కుమారులు
  rationale: కుమారులు అక్కడ లేకపోవడం మరియు యాకోబు వేచి ఉండడం మధ్యనున్న స్వల్ప కథన వైరుధ్యాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: הָיוּ אֶת מִקְנֵהוּ בַּשָּׂדֶה
  choice: అతని పశువులతో పొలంలో ఉన్నారు
  rationale: వారు పశువులను మేపుతున్నారని మూలం స్పష్టంగా చెప్పదు; వారి స్థలాన్నీ పశువులతో ఉన్నారన్న విషయాన్నీ మాత్రమే అనువదిస్తుంది.
- source_word: מִקְנֵהוּ
  choice: అతని పశువులు
  rationale: మందలు సహా గృహపాలిత జంతువులను సూచించే విస్తృతమైన, సహజమైన తెలుగు పదం.
- source_word: וְהֶחֱרִשׁ
  choice: మౌనంగా ఉన్నాడు
  rationale: మాట్లాడకుండా లేదా వెంటనే స్పందించకుండా ఉండడాన్ని తెలుపుతుంది; ఉద్దేశపూర్వక నియంత్రణను అతిగా వివరించదు.
- source_word: עַד בֹּאָם
  choice: వారు వచ్చే వరకు
  rationale: ‘వారి రాక వరకు’ అనే భావానికి సహజమైన తెలుగు రూపం; ‘తిరిగి’ అనే మూలంలో లేని భావాన్ని చేర్చదు.
theological_decisions:
- issue: దీనాకు జరిగినదాన్ని సూచించే పదం యొక్క పరిధి
  choice: ప్రధాన వచనంలో ‘అపవిత్రపరిచాడు’ అని ఉంచి, లైంగిక అవమాన సందర్భాన్ని పాదసూచికలో వివరించడం
  alternative: ‘లైంగికంగా చెరిపాడు/అత్యాచారం చేశాడు’ వంటి మరింత నిర్దిష్ట పదప్రయోగం
  rationale: హీబ్రూ క్రియ స్వయంగా సాధారణంగా ‘అపవిత్రం చేయడం’ అని అర్థమిస్తుంది. ఈ సందర్భం లైంగిక ఉల్లంఘనను సూచించినప్పటికీ, మూలపదం సాధారణ అత్యాచార క్రియాపదం కాదు; అందుచేత మూలంలోని పదబలాన్నీ వ్యాఖ్యాన పరిమితినీ రెండింటినీ కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గంభీరమైన కథన శైలి వాడబడింది. మూలంలో లేని ప్రారంభ కాలసూచక పదాన్ని చేర్చలేదు. మొదటి వాక్యంలోని ‘అతడు’ సందర్భంలో షెకెమును సూచించే సర్వనామంగా నిలిచి, హీబ్రూ వాక్యంలోని నిజమైన సూచన నిర్మాణాన్ని కాపాడుతుంది.
