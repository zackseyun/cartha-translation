  to: యాకోబు కుమారులు షెకెముకూ అతని తండ్రి హమోరుకూ మోసంతో[a] జవాబిచ్చి మాట్లాడారు, ఎందుకంటే షెకెము తమ సోదరి దీనాను అపవిత్రం చేశాడు[b].
