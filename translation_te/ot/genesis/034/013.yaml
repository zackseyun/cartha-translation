source:
  edition: WLC
  text: וַ/יַּעֲנ֨וּ בְנֵֽי יַעֲקֹ֜ב אֶת שְׁכֶ֨ם וְ/אֶת חֲמ֥וֹר אָבִ֛י/ו בְּ/מִרְמָ֖ה וַ/יְדַבֵּ֑רוּ אֲשֶׁ֣ר טִמֵּ֔א אֵ֖ת דִּינָ֥ה אֲחֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/013.yaml
  text: Jacob’s sons answered Shechem and Hamor his father deceitfully and spoke[b][a], because he had defiled Dinah their sister.
translation:
  language: te
  text: యాకోబు కుమారులు షెకెముకూ అతని తండ్రి హమోరుకూ మోసంతో[a] జవాబిచ్చి మాట్లాడారు, ఎందుకంటే షెకెము తమ సోదరి దీనాను అపవిత్రం చేశాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘మోసంతో.’ హీబ్రూలో ‘మోసం’ అనే నామవాచకం క్రియావిశేషణ భావంలో వాడబడింది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘తమ సోదరి దీనాను లైంగికంగా అవమానించాడు.’ హీబ్రూ అక్షరార్థంగా ‘అపవిత్రం చేశాడు’ అని చెబుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲנוּ
  choice: జవాబిచ్చారు
  rationale: ముందటి ప్రతిపాదనకు యాకోబు కుమారులు ఇచ్చిన ప్రతిస్పందనను సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: בְנֵי יַעֲקֹב
  choice: యాకోబు కుమారులు
  rationale: హీబ్రూ సమాసంలోని కుటుంబ సంబంధాన్ని సూటిగా, సహజంగా నిలుపుతుంది.
- source_word: אֶת שְׁכֶם וְאֶת חֲמוֹר אָבִיו
  choice: షెకెముతో, అతని తండ్రి హమోరుతో
  rationale: ఇద్దరూ జవాబుకు ఉద్దేశింపబడినవారని, ‘అతని తండ్రి’ అనేది హమోరును సూచిస్తుందని స్పష్టంగా తెలుపుతుంది.
- source_word: בְּמִרְמָה
  choice: మోసపూరితంగా
  rationale: ‘మోసంతో’ అనే నామవాచక ప్రయోగానికి ఉన్న క్రియావిశేషణ భావాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: וַיְדַבֵּרוּ
  choice: మాట్లాడి
  rationale: דבר అనే క్రియ యొక్క ‘మాట్లాడు’ భావాన్ని నిలుపుతూ, ‘జవాబిచ్చారు’తో సహజంగా అనుసంధానిస్తుంది.
- source_word: אֲשֶׁר
  choice: ఎందుకంటే
  rationale: ఈ సందర్భంలో తరువాతి వాక్యభాగం వారి మోసపూరిత జవాబుకు కారణాన్ని తెలియజేస్తుంది.
- source_word: טִמֵּא
  choice: అపవిత్రపరిచాడు
  rationale: పియేల్ రూపంలోని ‘అపవిత్రం చేయు/కలుషితం చేయు’ అనే నైతిక-ఆచార సంబంధ పదక్షేత్రాన్ని నిలుపుతుంది; సందర్భంలోని లైంగిక దౌర్జన్యాన్ని మెత్తబరచదు.
- source_word: אֲחֹתָם
  choice: తమ సహోదరి
  rationale: యాకోబు కుమారులతో దీనాకు ఉన్న కుటుంబ సంబంధాన్ని స్పష్టంగా ఉంచుతుంది.
theological_decisions:
- issue: טִמֵּא పదంలోని నైతిక-ఆచార భావం మరియు సందర్భంలోని లైంగిక ఉల్లంఘన
  choice: అపవిత్రపరిచాడు
  alternative: లైంగికంగా అవమానించాడు / చెరచాడు
  rationale: మూలపదపు ‘అపవిత్రం చేయడం’ అనే భావాన్ని ప్రధాన పాఠంలో నిలిపి, సందర్భార్థమైన ఉల్లంఘనను పాదసూచికలో సూచించడం ద్వారా మూలంలోని ఉద్వేగాన్ని అతిగా పరిష్కరించకుండా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన వాక్యక్రమం, అయితే ‘అపవిత్రపరిచాడు’ ద్వారా మూలంలోని గంభీరమైన నైతిక-ఆచార పదప్రయోగం నిలుపబడింది. ‘సహోదరి’ గౌరవప్రదమైన గ్రంథశైలిని ఇస్తుంది.
