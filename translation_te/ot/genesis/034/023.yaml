  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వచనం. మూలంలోని సమ్మతిని ఆశించే ప్రశ్నను, పరిమిత షరతును నిలుపుతూ అనవసర వివరణను జోడించలేదు.
