source:
  edition: WLC
  text: מִקְנֵ/הֶ֤ם וְ/קִנְיָנָ/ם֙ וְ/כָל בְּהֶמְתָּ֔/ם הֲ/ל֥וֹא לָ֖/נוּ הֵ֑ם אַ֚ךְ נֵא֣וֹתָה לָ/הֶ֔ם וְ/יֵשְׁב֖וּ אִתָּֽ/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/023.yaml
  text: Will not their livestock[a], their property, and all their animals be ours? Only let us agree with them[b], and they will dwell with us.
translation:
  language: te
  text: వారి పశుసంపద, వారి ఆస్తి, వారి జంతువులన్నీ మనవే అవవా? మనం వారికి సమ్మతిస్తే చాలు; వారు మనతో నివసిస్తారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִקְנֵהֶם
  choice: వారి పశుసంపద
  rationale: ఈ పదం సాధారణంగా మందలుగా పెంచే పశువులను సూచిస్తుంది. ‘పశుసంపద’ దాని ఆర్థిక విలువను, సమూహార్థాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: קִנְיָנָם
  choice: వారి ఆస్తి
  rationale: సంపాదించుకున్న ఆస్తి లేదా సొత్తు అనే విస్తృత భౌతిక-ఆర్థిక భావాన్ని ‘ఆస్తి’ నిలుపుతుంది.
- source_word: וְכָל בְּהֶמְתָּם
  choice: వారి జంతువులన్నీ
  rationale: בְּהֵמָה విస్తృతంగా జంతువులను, తరచుగా పెంపుడు జంతువులను సూచిస్తుంది. ముందే ‘పశుసంపద’ ఉన్నందున, పునరుక్తిని తగ్గిస్తూ כָל యొక్క సమగ్రతను ‘జంతువులన్నీ’ నిలుపుతుంది.
- source_word: הֲלוֹא לָנוּ הֵם
  choice: మనవి కావా?
  rationale: הֲלוֹא సమ్మతిని ఆశించే అలంకారప్రశ్నను ప్రవేశపెడుతుంది. ‘మనవి కావా?’ దాని ఒప్పించే ధోరణిని సంక్షిప్తంగా, సహజంగా అందిస్తుంది.
- source_word: אַךְ
  choice: చాలు
  rationale: ఇక్కడ אַךְ పరిమిత షరతును సూచిస్తుంది. షరతుతో కూడిన తెలుగు నిర్మాణంలో ‘చాలు’ ‘ఇది ఒక్కటే అవసరం’ అనే భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: נֵאֹותָה לָהֶם
  choice: మనం వారికి సమ్మతిస్తే
  rationale: నిఫల్ రూపం సమ్మతించడం లేదా ఒప్పుకోవడం అనే భావాన్ని ఇస్తుంది. సందర్భంలో షరతు-ఫలిత సంబంధాన్ని సహజ తెలుగులో వ్యక్తం చేయడానికి ఈ నిర్మాణం సరిపోతుంది.
- source_word: וְיֵשְׁבוּ אִתָּנוּ
  choice: అప్పుడు వారు మనతో నివసిస్తారు
  rationale: יָשַׁב నివసించడం, స్థిరపడడం అనే భావాలను కలిగి ఉంది. ‘నివసిస్తారు’ ఇక్కడ ప్రతిపాదిత సహవాసాన్ని గౌరవప్రదమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
