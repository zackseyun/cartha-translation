  yaml_path: translation/ot/genesis/034/028.yaml
  text: They took their flocks[a], their herds, their donkeys, and whatever was in the city and whatever was in the field.
translation:
  language: te
  text: వారు వారి చిన్న పశువుల మందలను, వారి పశువుల మందలను, గాడిదలను, పట్టణంలో ఉన్నదంతటినీ, పొలంలో ఉన్నదంతటినీ తీసుకున్నారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: צֹאנָם
  choice: వారి గొర్రెలు, మేకల మందలను
  rationale: צֹאן అనేది ప్రధానంగా గొర్రెలు, మేకలు వంటి చిన్న పశువులను సూచించే సమూహవాచకం. తెలుగులో అర్థం స్పష్టంగా ఉండేందుకు రెండు జాతులనూ పేర్కొని ‘మందలు’ అని అనువదించాం.
- source_word: בְּקָרָם
  choice: పశువుల మందలను
  rationale: בָּקָר సాధారణంగా పెద్ద పెంపుడు పశువులను, ముఖ్యంగా గోవర్గాన్ని, సమూహంగా సూచిస్తుంది. ‘పశువుల మందలు’ సహజమైన తెలుగు ప్రయోగంగా సమూహ భావాన్ని నిలుపుతుంది.
- source_word: חֲמֹרֵיהֶם
  choice: గాడిదలను
  rationale: ఈ పదం గాడిదలను నేరుగా సూచిస్తుంది; ఆధునిక ప్రామాణిక తెలుగులో ఇదే సహజమైన పదం.
- source_word: אֲשֶׁר בָּעִיר
  choice: పట్టణంలో ఉన్నదంతటినీ
  rationale: సంబంధవాచక నిర్మాణం పట్టణంలో ఉన్న సమస్త దోపిడీ సొత్తును విస్తృతంగా సూచిస్తుంది. ‘ఉన్నదంతటినీ’ ఆ సమగ్ర పరిధిని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אֲשֶׁר בַּשָּׂדֶה
  choice: పొలంలో ఉన్నదంతటినీ
  rationale: שָׂדֶה పొలం లేదా బహిరంగ వ్యవసాయ ప్రదేశాన్ని సూచించగలదు. ఇక్కడ ‘పొలం’ మూలపదానికి నేరమైన, సందర్భోచితమైన అనువాదం.
- source_word: לָקָחוּ
  choice: తీసుకున్నారు
  rationale: לָקַח యొక్క ప్రాథమిక అర్థం ‘తీసుకొను.’ దోపిడీ సందర్భం కథనం నుంచే స్పష్టమవుతుంది కాబట్టి ‘దోచుకున్నారు’ వంటి వివరణాత్మక బలవృద్ధిని నివారించాం.
