translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. హీబ్రూ వాక్యంలోని వరుస జాబితా నిర్మాణాన్ని నిలుపుతూ, చిన్న పశువుల సమూహవాచకానికి తెలుగులో స్పష్టత కల్పించబడింది.
