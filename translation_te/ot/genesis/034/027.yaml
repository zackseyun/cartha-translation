    rationale: హీబ్రూలో ‘పట్టణాన్ని’ (הָעִיר) ప్రధాన క్రియ ‘కొల్లగొట్టారు’కు కర్మగా ఉంది; ‘తమ సహోదరిని అపవిత్రపరిచారు’ అనేది దానిని విశేషించే సంబంధవాచక ఉపవాక్యం. ‘తమ సహోదరిని అపవిత్రపరిచిన పట్టణాన్ని’ అనడం దానిని అక్షరార్థంగా కుదించి చూపదు.
