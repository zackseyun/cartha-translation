id: GEN.34.27
reference: Genesis 34:27
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: בְּנֵ֣י יַעֲקֹ֗ב בָּ֚אוּ עַל הַ֣/חֲלָלִ֔ים וַ/יָּבֹ֖זּוּ הָ/עִ֑יר אֲשֶׁ֥ר טִמְּא֖וּ אֲחוֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/027.yaml
  text: The sons of Jacob came upon the slain and plundered the city[c][b][a], because they had defiled their sister.
translation:
  language: te
  text: యాకోబు కుమారులు హతులైనవారి మీదికి వచ్చి[a], ఆ పట్టణాన్ని కొల్లగొట్టారు. ఎందుకంటే ఆ పట్టణవారు వారి సహోదరిని అపవిత్రపరిచారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘హతులైనవారి దగ్గరికి వచ్చి.’ హీబ్రూ పదబంధం అప్పటికే చంపబడినవారి మీదికి లేదా వారి వద్దకు కదలికను సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘వారు తమ సహోదరిని అపవిత్రపరిచిన పట్టణాన్ని.’ హీబ్రూ సంబంధవాచక వాక్యం సంక్షిప్తంగా ఉంది; సందర్భంలో బహువచన క్రియ పట్టణ ప్రజలను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יַעֲקֹב
  choice: యాకోబు కుమారులు
  rationale: హీబ్రూ నిర్మాణంలోని కుటుంబ సంబంధాన్ని, సమూహంపై ఉన్న కథన ప్రాధాన్యాన్ని నేరుగా నిలుపుతుంది.
- source_word: בָּאוּ עַל
  choice: దగ్గరికి వచ్చి
  rationale: עַל‌తో కూడిన בוא ఇక్కడ హతులైనవారి వద్దకు లేదా మీదికి కదలికను సూచిస్తుంది. సహజమైన ఆధునిక తెలుగులో ‘దగ్గరికి వచ్చి’ అనేది అనవసరంగా మరో దాడిని సూచించకుండా భావాన్ని అందిస్తుంది.
- source_word: הַחֲלָלִים
  choice: హతులైనవారు
  rationale: חֲלָלִים హింసలో చంపబడినవారిని సూచిస్తుంది; సాధారణ ‘చనిపోయినవారు’ కంటే ఇది సందర్భానికి మరింత నిర్దిష్టం.
- source_word: וַיָּבֹזּוּ
  choice: దోచుకున్నారు
  rationale: בזז యుద్ధం లేదా హింస అనంతరం కొల్లగొట్టడాన్ని సూచిస్తుంది; ఈ తెలుగు పదం స్పష్టంగా, సహజంగా ఉంది.
- source_word: הָעִיר
  choice: ఆ పట్టణం
  rationale: עִיר‌కు సందర్భానుకూలమైన సాధారణ తెలుగు పదం; నిర్దిష్ట ప్రత్యయం భావాన్ని ‘ఆ’ ద్వారా వ్యక్తం చేసింది.
- source_word: אֲשֶׁר
  choice: ఎందుకంటే
  rationale: రూపపరంగా ఇది సంబంధవాచక అవ్యయం అయినా, ఇక్కడ తరువాతి వాక్యం పట్టణాన్ని దోచుకోవడానికి కారణాన్ని తెలియజేస్తుంది.
- source_word: טִמְּאוּ
  choice: అపవిత్రపరిచారు
  rationale: పియేల్ రూపంలోని טמא నైతిక, సామాజిక, అపవిత్రత భావాలను కలిగి ఉంది. ‘అపవిత్రపరిచారు’ ఆ విస్తృతిని నిలుపుతుంది; కేవలం శారీరక హింసకే భావాన్ని పరిమితం చేయదు.
- source_word: אֲחוֹתָם
  choice: వారి సహోదరి
  rationale: హీబ్రూలోని కుటుంబ సంబంధాన్ని నేరుగా వ్యక్తం చేస్తుంది; ఆధునిక గౌరవప్రదమైన తెలుగులో ‘సహోదరి’ సరిపోతుంది.
theological_decisions:
- issue: అపవిత్రపరిచినవారి గుర్తింపు
  choice: ‘ఆ పట్టణవారు’ అని స్పష్టీకరించడం
  alternative: ‘వారు తమ సహోదరిని అపవిత్రపరిచారు’
  rationale: హీబ్రూ వాక్యం సంక్షిప్తంగా ఉండి, బహువచన క్రియకు పట్టణ ప్రజలను సమూహంగా సూచిస్తుంది. తెలుగులో కేవలం ‘వారు’ అంటే యాకోబు కుమారులనే సూచించినట్లు తీవ్రమైన అపార్థం కలుగుతుంది. ‘ఆ పట్టణవారు’ కథనార్థాన్ని స్పష్టం చేస్తుంది; ఇది కొత్త సిద్ధాంతార్థాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. మూలంలోని సంక్షిప్త నిర్మాణం వల్ల తెలుగులో కలిగే తప్పు కర్త-సూచనను నివారించేందుకు ‘ఆ పట్టణవారు’ అని స్పష్టీకరించి, అక్షర నిర్మాణాన్ని పాదసూచికలో నిలిపాం.
