translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ప్రత్యక్ష ప్రసంగ శైలి వాడబడింది. హీబ్రూ నుడికారాన్ని ప్రధాన పాఠ్యంలో అర్థస్పష్టంగా అనువదించి, దాని అక్షరరూపాన్ని పాదటిప్పణిలో ఉంచాం; వాణిజ్యానికి సంబంధించిన స్థాన/గమన అస్పష్టతను కూడా పాదటిప్పణిలో కాపాడాం.
