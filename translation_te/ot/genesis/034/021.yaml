  text: הָ/אֲנָשִׁ֨ים הָ/אֵ֜לֶּה שְֽׁלֵמִ֧ים הֵ֣ם אִתָּ֗/נוּ וְ/יֵשְׁב֤וּ בָ/אָ֨רֶץ֙ וְ/יִסְחֲר֣וּ אֹתָ֔/הּ וְ/הָ/אָ֛רֶץ הִנֵּ֥ה רַֽחֲבַת יָדַ֖יִם לִ/פְנֵי/הֶ֑ם אֶת בְּנֹתָ/ם֙ נִקַּֽח לָ֣/נוּ לְ/נָשִׁ֔ים וְ/אֶת בְּנֹתֵ֖י/נוּ נִתֵּ֥ן לָ/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/021.yaml
  text: These men are at peace with us[a]. Let them dwell in the land and trade in it, for, you see, the land is broad enough for them. We will take their daughters for wives for ourselves[d][c][b], and we will give our daughters to them.
translation:
  language: te
  text: “ఈ మనుషులు మనతో శాంతిగా ఉన్నారు[a]. వారు ఈ దేశంలో నివసించి, దానిలో వాణిజ్యం చేయనివ్వండి[c]. ఇదిగో, దేశం వారికి తగినంత విశాలంగా ఉంది[b][d]. వారి కుమార్తెలను మనకు భార్యలుగా తీసుకుందాం; మన కుమార్తెలను వారికి ఇద్దాం.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘మనతో సఖ్యంగా ఉన్నారు,’ ‘మనతో మంచి సంబంధాల్లో ఉన్నారు.’
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా, ‘దేశం—ఇదిగో—వారి ఎదుట చేతుల విషయంలో విశాలంగా ఉంది.’ ఇది వారికి విస్తారమైన స్థలం లేదా తగినంత చోటు అందుబాటులో ఉందని తెలిపే నుడికారం.
    reason: cultural_note
  - marker: c
    text: లేదా ‘దాని గుండా వాణిజ్యం చేయనివ్వండి.’ హీబ్రూ పదబంధం దేశంలో చేసే వాణిజ్యాన్నైనా, దాని భూభాగం గుండా చేసే వాణిజ్యాన్నైనా సూచించవచ్చు.
    reason: lexical_alternative
  - marker: d
    text: ‘ఇదిగో’కు బదులుగా ‘చూడండి’ అని కూడా అనువదించవచ్చు.
    reason: previous_rendering
lexical_decisions:
- source_word: שְׁלֵמִים
  choice: శాంతిగా ఉన్నారు
  rationale: ఇక్కడ ఈ విశేషణం సంపూర్ణతకన్నా పరస్పర శాంతియుత సంబంధాన్ని సూచిస్తుంది. సాధారణ ఆధునిక తెలుగులో ‘మనతో శాంతిగా ఉన్నారు’ ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וְיֵשְׁבוּ
  choice: నివసించనివ్వండి
  rationale: రూపపరంగా అసంపూర్ణ క్రియ అయినా, ఈ ప్రసంగ సందర్భంలో పట్టణవాసులను అనుమతించమని ప్రోత్సహించే భావం ఉంది.
- source_word: וְיִסְחֲרוּ אֹתָהּ
  choice: దానిలో వ్యాపారం చేసుకోనివ్వండి
  rationale: סחר వాణిజ్య కార్యకలాపాన్ని సూచిస్తుంది; స్త్రీలింగ సర్వనామం ‘దేశం’ను తిరిగి సూచిస్తుంది. ‘దానిలో’ ప్రధాన భావాన్ని సహజంగా ఇస్తూ, ‘దాని గుండా’ అనే సాధ్యతను పాదటిప్పణిలో నిలుపుతుంది.
- source_word: הִנֵּה
  choice: ఇదిగో
  rationale: హీబ్రూ అవధాన సూచకానికి గౌరవప్రదమైన, ఇప్పటికీ అర్థమయ్యే తెలుగు సమానార్థకం.
- source_word: רַחֲבַת יָדַיִם לִפְנֵיהֶם
  choice: వారికి తగినంత విశాలంగా ఉంది
  rationale: ‘చేతుల పరంగా విశాలమైనది, వారి ఎదుట’ అనే హీబ్రూ నుడికారం వారికి స్థలం పుష్కలంగా అందుబాటులో ఉందనే భావాన్ని తెలియజేస్తుంది.
- source_word: נִקַּח לָנוּ לְנָשִׁים
  choice: మనకు భార్యలుగా తీసుకుందాం
  rationale: మొదటి బహువచన అసంపూర్ణ క్రియ ఈ సందర్భంలో ప్రతిపాదన లేదా ఉద్దేశాన్ని వ్యక్తం చేస్తుంది; לָנוּ భావాన్ని ‘మనకు’ నిలుపుతుంది.
- source_word: נִתֵּן לָהֶם
  choice: వారికి ఇద్దాం
  rationale: ముందటి ప్రతిపాదనకు సమాంతరంగా పరస్పర వివాహ ఏర్పాటును సూచిస్తుంది.
