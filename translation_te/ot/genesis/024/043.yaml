source:
  edition: WLC
  text: הִנֵּ֛ה אָנֹכִ֥י נִצָּ֖ב עַל עֵ֣ין הַ/מָּ֑יִם וְ/הָיָ֤ה הָֽ/עַלְמָה֙ הַ/יֹּצֵ֣את לִ/שְׁאֹ֔ב וְ/אָמַרְתִּ֣י אֵלֶ֔י/הָ הַשְׁקִֽי/נִי נָ֥א מְעַט מַ֖יִם מִ/כַּדֵּֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/043.yaml
  text: Look[a], I am standing by the spring of water, and let it be that the young woman who comes out to draw, to whom I say[b], ‘Please let me drink a little water from your jar,’
translation:
  language: te
  text: 'ఇదిగో, నేను నీటి ఊట దగ్గర నిలబడి ఉన్నాను. ఇలా జరగనివ్వు: నీళ్లు తోడడానికి బయటకు వచ్చే ఆ యువతికి, ‘దయచేసి నీ కుండలోని కొంచెం నీళ్లు నాకు తాగనివ్వు’ అని నేను చెప్పినప్పుడు[b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: లేదా, ‘దయచేసి నీ కుండలోని కొంచెం నీళ్లు నాకు తాగడానికి ఇవ్వు’ అని నేను ఆమెకు చెప్పినప్పుడు.
    reason: previous_rendering
lexical_decisions:
- source_word: הִנֵּה
  choice: ఇదిగో
  rationale: సన్నివేశాన్ని సజీవంగా చూపించే సూచనార్థక అవ్యయానికి ఆధునిక, సహజమైన తెలుగు సమానార్థకం.
- source_word: נִצָּב
  choice: నిలబడి ఉన్నాను
  rationale: వర్తమానంలో కొనసాగుతున్న స్థితిని హీబ్రూ కృదంతానికి అనుగుణంగా తెలియజేస్తుంది.
- source_word: עַל עֵין הַמָּיִם
  choice: నీటి ఊట దగ్గర
  rationale: עֵין ఇక్కడ బావికంటే సహజ నీటి ఊట లేదా జలస్రోతస్సును సూచిస్తుంది.
- source_word: וְהָיָה
  choice: అప్పుడు ఇలా జరగనివ్వు
  rationale: ప్రార్థనలో కోరుతున్న సూచనను పరిచయం చేసే సంకల్పార్థక భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: הָעַלְמָה
  choice: యువతి
  rationale: వివాహయోగ్య వయసులోని యువతిని సూచిస్తుంది; పదం ఒక్కటే కన్యత్వాన్ని స్పష్టంగా నిర్దేశించదు.
- source_word: הַיֹּצֵאת לִשְׁאֹב
  choice: నీళ్లు తోడడానికి బయటకు వచ్చే
  rationale: నీటిని తోడే ఉద్దేశంతో బయటకు వచ్చే భావాన్ని స్పష్టంగా, సహజంగా అందిస్తుంది.
- source_word: הַשְׁקִינִי נָא
  choice: దయచేసి … నాకు తాగనివ్వు
  rationale: שקה హిఫీల్ రూపంలోని తాగించు లేదా తాగడానికి ఇవ్వు అనే అభ్యర్థనను మర్యాదపూర్వక ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: מְעַט מַיִם מִכַּדֵּךְ
  choice: నీ కుండలోని కొంచెం నీళ్లు
  rationale: పరిమాణం మరియు నీటి పాత్రకు సంబంధించిన మూలపాఠ భావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
theological_decisions:
- issue: עַלְמָה పదం అనువాదం
  choice: యువతి
  alternative: కన్య; పెళ్లీడు యువతి
  rationale: ఈ సందర్భంలో హీబ్రూ పదం యువతిని సూచిస్తుంది గాని, తనంతట తానే కన్యత్వాన్ని స్పష్టంగా ప్రకటించదు. అందువల్ల తరువాతి సిద్ధాంత చర్చను ఈ కథనంలోకి దిగుమతి చేయకుండా ప్రధాన పాఠంలో ‘యువతి’ ఉంచబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి వాడబడింది. వచనం తరువాతి వచనంలో పూర్తయ్యే షరతు వాక్యభాగం కాబట్టి చివర కామా ఉంచబడింది. ‘ఇలా జరగనివ్వు’ ప్రార్థనలో కోరిన సూచన భావాన్ని స్పష్టం చేస్తుంది.
