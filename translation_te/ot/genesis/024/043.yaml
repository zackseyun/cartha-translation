  to: 'ఇదిగో, నేను నీటి ఊట దగ్గర నిలబడి ఉన్నాను. ఇలా జరగనివ్వు: నీళ్లు తోడడానికి బయటకు వచ్చే ఆ యువతికి, ‘దయచేసి నీ కుండలోని కొంచెం నీళ్లు నాకు తాగనివ్వు’ అని నేను చెప్పినప్పుడు[b],'
  rationale: ఆ యువతికి replaces యువతితో to preserve the Hebrew “to her” relation clearly. The footnote is correspondingly adjusted to use ఆమెకు. No theological or lexical change is made; the main text remains a deliberately incomplete conditional clause, as in the verse.
