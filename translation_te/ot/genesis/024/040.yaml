source:
  edition: WLC
  text: וַ/יֹּ֖אמֶר אֵלָ֑/י יְהוָ֞ה אֲשֶׁר הִתְהַלַּ֣כְתִּי לְ/פָנָ֗י/ו יִשְׁלַ֨ח מַלְאָכ֤/וֹ אִתָּ/ךְ֙ וְ/הִצְלִ֣יחַ דַּרְכֶּ֔/ךָ וְ/לָקַחְתָּ֤ אִשָּׁה֙ לִ/בְנִ֔/י מִ/מִּשְׁפַּחְתִּ֖/י וּ/מִ/בֵּ֥ית אָבִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/040.yaml
  text: And he said to me[a], ‘Yahweh, before whom I have walked, will send his angel with you and make your journey successful[b], and you will take a wife for my son from my clan and from my father’s house.’
translation:
  language: te
  text: 'ఆయన నాతో ఇలా అన్నాడు: “నేను ఎవరి సన్నిధిలో నడుచుకున్నానో, ఆ యాహ్వే తన దూతను నీతో పంపి నీ ప్రయాణాన్ని సఫలం చేస్తాడు[a]. నీవు నా వంశం[b] నుండి, నా తండ్రి ఇంటి నుండి నా కుమారునికి భార్యను తీసుకుంటావు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీ మార్గాన్ని వర్ధిల్లజేస్తాడు.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “నా బంధువర్గం”; హీబ్రూ పదం తక్షణ కుటుంబం కంటే విస్తృతమైన బంధుత్వ సమూహాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవ నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ లిప్యంతరీకరణను తెలుగులో అందిస్తుంది.
- source_word: הִתְהַלַּכְתִּי לְפָנָיו
  choice: నేను ఎవరి సన్నిధిలో నడుచుకున్నానో
  rationale: దేవుని సమక్షంలో జీవితం గడపడం, ఆయనకు జవాబుదారిగా నడుచుకోవడం అనే నిబంధనా నుడికారాన్ని వ్యాఖ్యానాత్మకంగా విస్తరించకుండా నిలుపుతుంది.
- source_word: מַלְאָכוֹ
  choice: తన దూతను
  rationale: ఇక్కడ యాహ్వే పంపే పరలోక దూత ఉద్దేశించబడుతున్నందున ‘దూత’ సహజమైనదీ సందర్భోచితమైనదీ.
- source_word: וְהִצְלִיחַ דַּרְכֶּךָ
  choice: నీ ప్రయాణాన్ని సఫలం చేస్తాడు
  rationale: צלח హిఫీల్ రూపంలోని కారణార్థాన్ని నిలుపుతూ, ‘నీ మార్గాన్ని వర్ధిల్లజేస్తాడు’ అనే హీబ్రూ నుడికారాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וְלָקַחְתָּ אִשָּׁה לִבְנִי
  choice: నా కుమారునికి భార్యను తీసుకుంటావు
  rationale: సేవకుడు తనకోసం పెళ్లి చేసుకుంటాడనే అపార్థం రాకుండా, కుమారుని కోసం భార్యను తీసుకోవడం అనే వివాహ నుడికారాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: מִמִּשְׁפַּחְתִּי
  choice: నా వంశం నుండి
  rationale: ఇది కేవలం తక్షణ కుటుంబాన్ని కాక విస్తృత బంధుత్వ సమూహాన్ని సూచించగలదని ‘వంశం’ తెలియజేస్తుంది.
- source_word: וּמִבֵּית אָבִי
  choice: నా తండ్రి ఇంటివారి నుండి
  rationale: పితృసంబంధ గృహాన్నీ కుటుంబ వలయాన్నీ సూచించే హీబ్రూ భావాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవ నామం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: వ్యక్తిగత నిబంధనా నామాన్ని బిరుదుగా మార్చకుండా నిలుపుతుంది; ఏ ప్రత్యేక సంప్రదాయ వ్యాఖ్యానాన్నీ చేర్చదు.
- issue: ‘ఆయన సన్నిధిలో నడుచుకోవడం’ అనే మాట భావం
  choice: నిబంధనా నుడికారాన్ని అలాగే నిలుపడం
  alternative: ఆయనకు నమ్మకంగా జీవించాను; ఆయన సమక్షంలో జీవించాను
  rationale: ఈ మాటలో విశ్వాసపూర్వక జీవనం సూచితమైనప్పటికీ, మూలంలో స్పష్టంగా లేని ‘నమ్మకంగా’ అనే వివరణను ప్రధాన పాఠ్యంలో చేర్చకుండా భావగాంభీర్యాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి వాడబడింది. హీబ్రూ నుడికారాన్ని సాధ్యమైనంతవరకు నిలుపుతూ, అసహజమైన పదానువాదాన్ని నివారించాం. మూలంలో లేని పాదసూచిక గుర్తుల అసమతౌల్యాన్ని సరిచేసి [a]ను ప్రయాణ విజయానికి, [b]ను వంశం అనే పదానికి జత చేశాం.
