  text: So they sent away Rebekah their sister[a], and her nurse, and Abraham’s servant, and his men.
translation:
  language: te
  text: అప్పుడు వారు తమ సహోదరి రిబ్కాను, ఆమె దాదిని[a], అబ్రాహాము సేవకుణ్ణి, అతని మనుష్యులను సాగనంపారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత నిర్దిష్టంగా, ‘ఆమెకు తల్లి పాలు పట్టించిన స్త్రీని.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְשַׁלְּחוּ
  choice: సాగనంపారు
  rationale: పీయేల్ రూపం ఇక్కడ ప్రయాణానికి పంపివేయడాన్ని సూచిస్తుంది. ‘సాగనంపారు’ అనేది కేవలం ‘పంపారు’ కంటే వీడ్కోలు పలికి ప్రయాణానికి పంపిన భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: רִבְקָה
  choice: రిబ్కా
  rationale: హీబ్రూ వ్యక్తినామానికి ప్రామాణిక తెలుగు లిప్యంతరీకరణను ఉపయోగించాం.
- source_word: אֲחֹתָם
  choice: తమ సహోదరి
  rationale: ఆ సందర్భంలోని కుటుంబ సంబంధాన్ని నేరుగా నిలుపుతుంది; వయస్సును సూచించే ‘అక్క’ లేదా ‘చెల్లెలు’ అని మూలపాఠంలో లేని వివరాన్ని చేర్చదు.
- source_word: מֵנִקְתָּהּ
  choice: ఆమె దాది
  rationale: ఈ పదం పాలిచ్చి పెంచిన స్త్రీని సూచిస్తుంది. ‘దాది’ కథనంలో సహజంగా ఉంటుంది; నిర్దిష్ట అర్థాన్ని పాదసూచికలో స్పష్టం చేశాం.
- source_word: עֶבֶד אַבְרָהָם
  choice: అబ్రాహాము సేవకుడు
  rationale: నిర్మాణ సంబంధాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది. ఈ కథన సందర్భంలో అతని బానిస హోదా కంటే అప్పగించబడిన సేవక బాధ్యత ప్రధానంగా ఉంది.
- source_word: אֲנָשָׁיו
  choice: అతని మనుష్యులు
  rationale: ప్రత్యయం సమీపంలోని అబ్రాహాము సేవకుణ్ణి సూచిస్తుంది. వారి నిర్దిష్ట పాత్రను ఊహించకుండా హీబ్రూ పదంలోని సాధారణ ‘మనుష్యులు’ అనే భావాన్ని నిలుపుతుంది.
