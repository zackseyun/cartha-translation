  to: అతని ముందు తినడానికి భోజనం పెట్టారు. అయితే అతడు, “నేను చెప్పవలసిన మాటలు చెప్పే వరకు తినను” అన్నాడు. దానికి అతడు, “చెప్పు” అన్నాడు.
