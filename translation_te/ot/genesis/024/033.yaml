review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the servant’s refusal to eat until he has delivered his message, and the final imperative is correctly rendered. However, the opening word order, “అతడు తినడానికి అతని ముందు,” can attach “to eat” to the wrong person syntactically, rather than indicating the purpose for which the food was placed.
  naturalness: Most of the dialogue is natural modern standard Telugu. Reordering the opening clause makes the intended sense immediately clear. “దానికి” naturally marks the response of the host without adding content.
  terminology: “భోజనం,” “తినను,” “మాటలు,” and “చెప్పు” are suitable, clear terms in an appropriately restrained narrative register. No theological terminology is involved.
  issues:
  - severity: medium
    issue: Opening purpose phrase has potentially misleading attachment
    rationale: “అతడు తినడానికి అతని ముందు భోజనం పెట్టారు” may be read awkwardly as though “అతడు” is the element governed by “తినడానికి.” Placing “అతని ముందు” first and retaining “తినడానికి” with the food-placement clause clearly reflects לְפָנָיו לֶאֱכֹל.
  revised_text: అతని ముందు తినడానికి భోజనం పెట్టారు. అయితే అతడు, “నేను చెప్పవలసిన మాటలు చెప్పే వరకు తినను” అన్నాడు. దానికి అతడు, “చెప్పు” అన్నాడు.
  revised_footnotes: []
  revision_rationale: The first clause is reordered solely to make clear that food was placed before him for eating. The refusal and its temporal limit retain the Hebrew sense, while the final response remains the concise imperative “చెప్పు.”
