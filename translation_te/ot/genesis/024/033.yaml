  yaml_path: translation/ot/genesis/024/033.yaml
  text: Food was set before him to eat[a], but he said, “I will not eat until I have spoken my words.” And he said, “Speak.”
translation:
  language: te
  text: అతని ముందు తినడానికి భోజనం పెట్టారు. అయితే అతడు, “నేను చెప్పవలసిన మాటలు చెప్పే వరకు తినను” అన్నాడు. దానికి అతడు, “చెప్పు” అన్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשֶׂם לְפָנָיו לֶאֱכֹל
  choice: అతడు తినడానికి అతని ముందు భోజనం పెట్టారు
  rationale: שׂים అంటే ‘పెట్టు/ఉంచు.’ కర్త స్పష్టంగా చెప్పబడలేదు; తెలుగులో సందర్భానుసారమైన అనిర్దిష్ట బహువచన క్రియ సహజంగా ఉంటుంది. לֶאֱכֹל ఉద్దేశాన్ని సూచిస్తుంది.
- source_word: לֹא אֹכַל
  choice: తినను
  rationale: అసంపూర్ణ క్రియ ఇక్కడ దృఢమైన సంకల్పాన్ని వ్యక్తం చేస్తుంది; ‘తినను’ సహజంగా, సంక్షిప్తంగా దానిని నిలుపుతుంది.
- source_word: עַד אִם דִּבַּרְתִּי
  choice: చెప్పే వరకు
  rationale: עַד אִם ఇక్కడ అతడు తినకముందు నెరవేరవలసిన పరిమితిని సూచిస్తుంది; తెలుగులో ‘చెప్పే వరకు’ సహజ సమానార్థకం.
- source_word: דְּבָרָי
  choice: నేను చెప్పవలసిన మాటలు
  rationale: అక్షరార్థంగా ‘నా మాటలు.’ ఈ సందర్భంలో తన సందేశం లేదా చెప్పవలసిన విషయం అనే భావాన్ని సహజ తెలుగులో తెలియజేస్తూ, ‘మాటలు’ అనే మూల రూపకాన్ని నిలుపుతుంది.
- source_word: דַּבֵּר
  choice: చెప్పు
  rationale: דבר క్రియ ఆజ్ఞార్థకం. సంభాషణలో ‘చెప్పు’ సంక్షిప్తంగా, సహజంగా ఉంటుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన, గౌరవప్రదమైన కథన శైలి. హీబ్రూ వాక్యంలోని అనిర్దిష్ట కర్తను తెలుగులో అనవసరంగా నిర్దిష్టం చేయలేదు.
