  text: וַ/תְּמַהֵ֗ר וַ/תּ֤וֹרֶד כַּדָּ/הּ֙ מֵֽ/עָלֶ֔י/הָ וַ/תֹּ֣אמֶר שְׁתֵ֔ה וְ/גַם גְּמַלֶּ֖י/ךָ אַשְׁקֶ֑ה וָ/אֵ֕שְׁתְּ וְ/גַ֥ם הַ/גְּמַלִּ֖ים הִשְׁקָֽתָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/046.yaml
  text: She quickly lowered her jar from her shoulder and said[a], ‘Drink, and I will also give water to your camels.’ So I drank, and she also gave water to the camels.
translation:
  language: te
  text: ఆమె వెంటనే తన మీద ఉన్న కుండను దించి[a], “తాగండి; మీ ఒంటెలకు కూడా నీళ్లు ఇస్తాను” అని చెప్పింది. అప్పుడు నేను తాగాను; ఆమె ఒంటెలకు కూడా నీళ్లు ఇచ్చింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “ఆమెపై నుండి.” విస్తృత సందర్భాన్ని బట్టి కుండను ఆమె భుజంపై మోసినట్లు తెలుస్తుంది; అయితే ఈ వచనంలో శరీర భాగం స్పష్టంగా పేర్కొనబడలేదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּמַהֵר
  choice: వెంటనే
  rationale: מהר క్రియ ఆమె ఆలస్యం చేయకుండా త్వరగా స్పందించినట్లు సూచిస్తుంది; తరువాతి క్రియతో సహజంగా కలిసేలా క్రియావిశేషణంగా అనువదించబడింది.
- source_word: וַתּוֹרֶד
  choice: దించి
  rationale: Hiphil రూపం ‘కిందికి వచ్చేలా చేయడం’ అనే భావాన్ని ఇస్తుంది; కుండను తనపై నుండి కిందికి దించిన చర్యకు ‘దించి’ సహజమైన తెలుగు.
- source_word: כַּדָּהּ
  choice: తన కుండను
  rationale: כד నీరు తోడే కుండను సూచిస్తుంది. సందర్భంలో నీటి ఉపయోగం స్పష్టంగా ఉన్నందున ‘నీళ్ల కుండ’ అని అదనంగా పేర్కొనలేదు.
- source_word: מֵעָלֶיהָ
  choice: తనపై నుండి
  rationale: హీబ్రూ పదబంధం శరీర భాగాన్ని స్పష్టంగా చెప్పకుండా ‘ఆమెపై నుండి’ అని మాత్రమే చెబుతుంది. అందువల్ల ప్రధాన పాఠంలో ‘భుజం’ను చేర్చకుండా మూలంలోని అనిశ్చితిని నిలిపాం.
- source_word: שְׁתֵה
  choice: తాగండి
  rationale: నేరమైన ఆజ్ఞారూపాన్ని నిలిపి, అపరిచిత వయోజన పురుషునితో మాట్లాడే సందర్భానికి సరిపోయే మర్యాదపూర్వక ఆధునిక తెలుగు రూపాన్ని వాడాం.
- source_word: וְגַם גְּמַלֶּיךָ אַשְׁקֶה
  choice: మీ ఒంటెలకు కూడా నీళ్లు ఇస్తాను
  rationale: שקה Hiphil రూపం తాగడానికి నీరు ఇవ్వడాన్ని సూచిస్తుంది. ‘నీళ్లు ఇస్తాను’ సాధారణ పాఠకులకు స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: וָאֵשְׁתְּ
  choice: అప్పుడు నేను తాగాను
  rationale: వరుస కథనంలో ఆమె ఆహ్వానానికి కొనసాగింపుగా జరిగిన చర్యను ‘అప్పుడు’ సహజంగా తెలియజేస్తుంది.
- source_word: וְגַם הַגְּמַלִּים הִשְׁקָתָה
  choice: ఆమె ఒంటెలకు కూడా నీళ్లు ఇచ్చింది
  rationale: ముందటి మాటతో పదబంధ సారూప్యతను నిలిపి, ఒంటెలకు తాగడానికి నీరు ఇచ్చిందనే అర్థాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలిని వాడాం. సంభాషణలో ‘తాగండి’ అనే మర్యాదపూర్వక ఏకవచన భావ రూపం సందర్భోచితంగా ఉంది. మూలంలో లేని ‘భుజం’ను ప్రధాన పాఠంలో చేర్చకుండా పాదటిప్పణిలో సందర్భసాధ్యతను వివరించాం.
