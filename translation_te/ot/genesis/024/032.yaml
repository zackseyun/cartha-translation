- from: ఆ మనిషి ఇంట్లోకి వచ్చాడు. అతడు ఒంటెలపై ఉన్న సామాను దించి[a], వాటికి గడ్డినీ మేతనీ పెట్టాడు; తన కాళ్లూ తనతో ఉన్న మనుషుల కాళ్లూ కడుక్కోవడానికి నీళ్లు ఇచ్చాడు.
  to: ఆ మనిషి ఇంట్లోకి వచ్చాడు. అతడు ఒంటెల కట్లు విప్పి[a], వాటికి గడ్డి కాడలనూ మేతనూ పెట్టాడు; తన కాళ్లను, తనతో ఉన్న మనుషుల కాళ్లను కడుక్కోవడానికి నీళ్లు ఇచ్చాడు.
