  text: וַ/יָּבֹ֤א הָ/אִישׁ֙ הַ/בַּ֔יְתָ/ה וַ/יְפַתַּ֖ח הַ/גְּמַלִּ֑ים וַ/יִּתֵּ֨ן תֶּ֤בֶן וּ/מִסְפּוֹא֙ לַ/גְּמַלִּ֔ים וּ/מַ֨יִם֙ לִ/רְחֹ֣ץ רַגְלָ֔י/ו וְ/רַגְלֵ֥י הָ/אֲנָשִׁ֖ים אֲשֶׁ֥ר אִתּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/032.yaml
  text: So the man came into the house and unloaded the camels and gave straw and feed to the camels[b][a], and water to wash his feet and the feet of the men who were with him.
translation:
  language: te
  text: ఆ మనిషి ఇంట్లోకి వచ్చాడు. అతడు ఒంటెల కట్లు విప్పి[a], వాటికి గడ్డి కాడలనూ మేతనూ పెట్టాడు; తన కాళ్లను, తనతో ఉన్న మనుషుల కాళ్లను కడుక్కోవడానికి నీళ్లు ఇచ్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: పదశః, ‘ఒంటెలను తెరిచాడు.’ అంటే ఒంటెల కట్లు లేదా వాటి పరికరాలను విప్పి, ప్రయాణం తరువాత వాటికి విశ్రాంతి కల్పించాడు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא הָאִישׁ הַבַּיְתָה
  choice: ఆ మనిషి ఇంట్లోకి వచ్చాడు
  rationale: בוא మరియు దిశను సూచించే הַבַּיְתָה కలిపి ఇంటి లోపలికి రావడాన్ని సూచిస్తాయి. మూలంలో ఉన్న ‘ఆ మనిషి’ అనే సూచనను అలాగే ఉంచింది.
- source_word: וַיְפַתַּח הַגְּמַלִּים
  choice: అతడు ఒంటెలపై ఉన్న సామాను దించి
  rationale: పదశః ‘ఒంటెలను తెరిచాడు’; సందర్భంలో ఒంటెల కట్లు విప్పి వాటి సామాను లేదా పరికరాలు తొలగించి విశ్రాంతి కల్పించడం అనే నుడికారార్థం ఉంది. సహజమైన తెలుగులో ‘సామాను దించి’ ప్రధాన సందర్భార్థాన్ని అందిస్తుంది; ప్రత్యామ్నాయాన్ని పాదసూచికలో తెలిపింది.
- source_word: וַיִּתֵּן
  choice: పెట్టాడు … ఇచ్చాడు
  rationale: మూలంలోని 3వ పురుష ఏకవచన క్రియను నిలిపింది. పాఠ్యంలో కర్తకు పేరు లేదు కాబట్టి ‘లాబాను’ అని చేర్చలేదు; సమీపంలోని ‘ఆ మనిషి’నే వ్యాకరణపరమైన కర్తగా చదవగల నిర్మాణాన్ని కాపాడింది.
- source_word: תֶּבֶן וּמִסְפּוֹא
  choice: గడ్డినీ మేతనీ
  rationale: תֶּבֶן జంతువులకు ఉపయోగించే ఎండిన గడ్డి/గడ్డి కాడలను, מִסְפּוֹא పశువుల మేతను సూచిస్తాయి. సాధారణ ఆధునిక తెలుగులో ఈ జత స్పష్టంగా ఉంటుంది.
- source_word: מַיִם לִרְחֹץ רַגְלָיו
  choice: తన కాళ్లు … కడుక్కోవడానికి నీళ్లు
  rationale: లక్ష్యార్థక క్రియారూపాన్ని సహజ తెలుగు ప్రయోజన నిర్మాణంతో తెలిపింది; רַגְלָיו లోని ఏకవచన పురుష సూచనను ‘తన’తో నిలిపింది.
- source_word: וְרַגְלֵי הָאֲנָשִׁים אֲשֶׁר אִתּוֹ
  choice: తనతో ఉన్న మనుషుల కాళ్లు
  rationale: మూలంలోని బహువచన ‘మనుషులు’ మరియు ‘అతనితో ఉన్న’ అనే సంబంధ వాక్యాన్ని సంక్షిప్తమైన సహజ తెలుగులో నిలిపింది.
theological_decisions:
- issue: ఆతిథ్య కార్యాలు చేసిన కర్త ఎవరు?
  choice: మూలంలో పేరు చేర్చకుండా ఏకవచన ‘అతడు’ను ఉపయోగించడం
  alternative: ‘లాబాను’ అని స్పష్టంగా చేర్చడం
  rationale: సందర్భరీత్యా లాబాను లేదా అతని ఇంటివారు ఈ పనులు చేశారని భావించవచ్చు; అయితే హెబ్రీ పాఠ్యం ఈ వచనంలో అతని పేరును చెప్పదు, క్రియలు వరుసగా 3వ పురుష ఏకవచనంలో ఉన్నాయి. కాబట్టి సందర్భంతో పరిష్కరించదగిన అస్పష్టతను అనువాదంలో పేరును చేర్చి తొలగించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథన శైలి. ‘పశుగ్రాసం’ కంటే సహజమైన ‘మేత’, పాతబడిన పదాల బదులు ‘సామాను దించి’ వాడబడ్డాయి. మూలంలోని కర్త అస్పష్టతను పేరు చేర్చకుండా కాపాడింది.
