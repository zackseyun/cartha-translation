  yaml_path: translation/ot/genesis/024/025.yaml
  text: Then she said to him[a], “We have plenty of both straw and fodder, and also a place to spend the night.”
translation:
  language: te
  text: అప్పుడు ఆమె అతనితో, “మా దగ్గర గడ్డి, పశువుల మేత సమృద్ధిగా ఉన్నాయి; రాత్రి బస చేయడానికి స్థలం కూడా ఉంది” అని చెప్పింది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֹּאמֶר אֵלָיו
  choice: అప్పుడు ఆమె అతనితో ... అని చెప్పింది
  rationale: వావ్-క్రమరూపం కథనాన్ని ముందుకు నడిపిస్తుంది; אֵלָיוను సహజమైన తెలుగు ఉక్తి నిర్మాణంలో ‘అతనితో’గా వ్యక్తం చేశాం.
- source_word: גַּם ... גַּם ... גַּם
  choice: గడ్డి, పశువుల మేత ...; ... కూడా
  rationale: పునరావృతమైన גַּם ఇచ్చే సంచయార్థాన్ని సహజమైన తెలుగులో జాబితా మరియు ‘కూడా’ ద్వారా నిలిపాం.
- source_word: תֶּבֶן
  choice: గడ్డి
  rationale: పశువుల సంరక్షణ సందర్భంలో ఎండిన గడ్డి లేదా ధాన్యపు కాండాలను సూచించే సాధారణ, సులభమైన తెలుగు పదం.
- source_word: מִסְפּוֹא
  choice: పశువుల మేత
  rationale: జంతువులకు ఇచ్చే ఆహారమనే అర్థాన్ని ‘మేత’ స్పష్టంగా ఇస్తుంది; సందర్భం కోసం ‘పశువుల’ అని చేర్చాం.
- source_word: רַב עִמָּנוּ
  choice: మా దగ్గర ... సమృద్ధిగా ఉన్నాయి
  rationale: అక్షరార్థంగా ‘మాతో చాలా ఉంది’; తెలుగులో స్వాధీనతను ‘మా దగ్గర’ అని, పరిమాణాన్ని ‘సమృద్ధిగా’ అని సహజంగా వ్యక్తం చేశాం.
- source_word: מָקוֹם לָלוּן
  choice: రాత్రి బస చేయడానికి స్థలం
  rationale: לון అంటే రాత్రి గడపడం లేదా బస చేయడం; מָקוֹם యొక్క సాధారణత్వాన్ని ‘స్థలం’ నిలుపుతుంది.
theological_decisions: []
