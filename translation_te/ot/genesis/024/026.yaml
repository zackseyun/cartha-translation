  text: Then the man bowed down and worshiped Yahweh[a][b].
translation:
  language: te
  text: అప్పుడు ఆ మనిషి వంగి, యాహ్వేకు సాష్టాంగ నమస్కారం చేశాడు.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యాహ్వేను ఆరాధించాడు.”
