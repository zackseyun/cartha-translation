  - marker: b
    text: “ఆ మనిషి” అంటే సందర్భంలో అబ్రాహాము సేవకుడు.
    reason: referent_clarification
lexical_decisions:
- source_word: וַיִּקֹּד
  choice: తల వంచి
  rationale: קָדַד శరీరాన్ని లేదా తలను గౌరవపూర్వకంగా వంచడాన్ని సూచిస్తుంది. తరువాతి క్రియతో తేడా నిలిచేలా సహజమైన తెలుగులో ‘తల వంచి’ అని అనువదించాం.
- source_word: הָאִישׁ
  choice: ఆ మనిషి
  rationale: హీబ్రూ పాఠంలో ‘మనిషి’ అనే సాధారణ నామవాచకమే ఉంది. సందర్భంలో అతడు అబ్రాహాము సేవకుడైనా, మూలపాఠపు పదప్రయోగాన్ని నిలిపాం.
- source_word: וַיִּשְׁתַּחוּ
  choice: సాష్టాంగపడ్డాడు
  rationale: ఈ క్రియ గౌరవంతో నేలకు వంగి నమస్కరించడాన్ని, దేవుని సందర్భంలో ఆరాధనను సూచిస్తుంది. ముందున్న ‘తల వంచి’తో కలసి ఉన్న శారీరక చర్యను చెరపకుండా ‘సాష్టాంగపడ్డాడు’ అని ఇచ్చాం.
- source_word: לַיהוָה
  choice: యెహోవాకు
  rationale: యְהוָה అనే దైవనామాన్ని తెలుగులో విస్తృతంగా పరిచితమైన ‘యెహోవా’ రూపంలో లిప్యంతరీకరించాం; לְ ఉపసర్గను ‘-కు’తో తెలిపాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామపు అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు; యాహ్వే
  rationale: మూలపాఠంలో ఉన్న ప్రత్యేక దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా పేరుగానే నిలిపాం. ఆధునిక తెలుగు బైబిలు వాడుకలో సులభంగా గుర్తుపట్టే ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం.
- issue: וַיִּשְׁתַּחוּను ఆరాధనగా భావానువాదం చేయాలా, శారీరక చర్యగా అనువదించాలా
  choice: సాష్టాంగపడ్డాడు
  alternative: ఆరాధించాడు; సాష్టాంగ నమస్కారం చేశాడు
  rationale: దేవునివైపు చేసినందున చర్యకు ఆరాధనా భావం ఉంది; అయినా మూలక్రియలోని శరీరాన్ని వంచే దృశ్యాన్ని నిలిపేందుకు శారీరక చర్యను ప్రధాన పాఠంలో ఉంచి, ఆరాధనా భావాన్ని పాదసూచికలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. వరుసగా ఉన్న రెండు హీబ్రూ క్రియల భేదాన్ని ‘తల వంచి’ మరియు ‘సాష్టాంగపడ్డాడు’ ద్వారా నిలిపాం.
