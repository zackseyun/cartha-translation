  yaml_path: translation/ot/genesis/024/028.yaml
  text: Then the young woman ran and told her mother's household about these things[a].
translation:
  language: te
  text: అప్పుడు ఆ యువతి పరుగెత్తి, ఈ సంగతులను తన తల్లి ఇంటివారికి[a] చెప్పింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘తన తల్లి ఇంటికి.’ హీబ్రూ పదబంధం భౌతిక ఇంటినిగానీ, ఆమె తల్లికి సంబంధించిన కుటుంబం లేదా ఇంటివారినిగానీ సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּרָץ
  choice: పరుగెత్తి
  rationale: רוץ వేగంగా పరుగెత్తడాన్ని సూచిస్తుంది; కథన క్రమంలో ‘పరుగెత్తి’ సహజమైన, ప్రత్యక్షమైన తెలుగు రూపం.
- source_word: הַנַּעֲרָ
  choice: ఆ యువతి
  rationale: נַעֲרָה ఒక యువ స్త్రీని సూచిస్తుంది. సందర్భంలో రిబ్కాను సూచిస్తున్నందున ‘ఆ యువతి’ ఆధునిక, గౌరవప్రదమైన రూపం.
- source_word: וַתַּגֵּד
  choice: చెప్పింది
  rationale: נגד అనే ధాతువు హిఫీల్ రూపంలో తెలియజేయడం లేదా చెప్పడం అనే అర్థం ఇస్తుంది; ‘చెప్పింది’ సహజమైన కథన పదం.
- source_word: לְבֵית אִמָּהּ
  choice: తన తల్లి ఇంటివారికి
  rationale: בַּיִת భౌతిక ఇంటినీ, ఆ ఇంటికి చెందిన కుటుంబం లేదా ఇంటివారినీ సూచించగలదు. వ్యక్తులకు సమాచారం చెప్పే సందర్భంలో ‘ఇంటివారికి’ సహజంగా ఉంటుంది; అసలు పదబంధంలోని ద్వంద్వార్థాన్ని పాదసూచికలో నిలిపాం.
- source_word: כַּדְּבָרִים הָאֵלֶּה
  choice: ఈ సంగతులను
  rationale: דְּבָרִים ‘మాటలు,’ ‘విషయాలు,’ లేదా ‘సంగతులు’ అని అర్థమవుతుంది. జరిగినదాన్ని వివరించే ఈ సందర్భంలో ‘ఈ సంగతులను’ సహజమైన తెలుగు.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘ఇంటివారికి’ అనే రూపం లక్ష్యభాషలోని సహజ వాడుకను అనుసరిస్తూ, హీబ్రూ בַּיִת పదంలోని స్థలం/కుటుంబం అనే సందిగ్ధతను పాదసూచికలో సంరక్షిస్తుంది.
