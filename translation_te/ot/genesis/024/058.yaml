  text: So they called Rebekah and said to her, “Will you go with this man?” And she said, “I will go.”
translation:
  language: te
  text: అప్పుడు వారు రిబ్కాను పిలిచి, “నువ్వు ఈ మనిషితో వెళ్తావా?” అని ఆమెను అడిగారు. అందుకు ఆమె, “వెళ్తాను” అంది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרְאוּ לְרִבְקָה
  choice: వారు రిబ్కాను పిలిచి
  rationale: קרא ఇక్కడ ఒకరిని సంభాషణలోకి పిలిపించడం అనే సాధారణ భావాన్ని ఇస్తుంది. ‘పిలిచి’ సహజమైన ఆధునిక తెలుగు; ‘రప్పించి’ అనవసరమైన బలవంతపు ఛాయను కలిగించవచ్చు.
- source_word: וַיֹּאמְרוּ אֵלֶיהָ
  choice: అని ఆమెను అడిగారు
  rationale: మూలంలో ‘ఆమెతో అన్నారు’ అనే సాధారణ ప్రయోగం ఉన్నా, వెంటనే ప్రత్యక్ష ప్రశ్న వస్తున్నందున తెలుగులో ‘ఆమెను అడిగారు’ అనడం సహజంగా ఉండి సంభాషణ కార్యాన్ని ఖచ్చితంగా తెలియజేస్తుంది.
- source_word: הֲתֵלְכִי
  choice: నువ్వు ... వెళ్తావా?
  rationale: הלך అనే సాధారణ ‘వెళ్లు’ క్రియను, స్త్రీని ఉద్దేశించిన ప్రశ్నగా సహజ తెలుగులో అందిస్తుంది. ‘వెళ్లడానికి ఇష్టపడుతున్నావా?’ అని విస్తరించడం మూలంలో స్పష్టంగా లేని సంకల్ప భావాన్ని జోడిస్తుంది.
- source_word: עִם הָאִישׁ הַזֶּה
  choice: ఈ మనిషితో
  rationale: אִישׁ కు నేరమైన అర్థం ‘మనిషి/పురుషుడు’. సందర్భంలోని వ్యక్తి అబ్రాహాము సేవకుడైనా, ఈ వాక్యంలో ‘సేవకుడు’ అనే పదం లేదు; అందువల్ల మూల పదప్రయోగాన్ని నిలుపుతుంది.
- source_word: וַתֹּאמֶר
  choice: అందుకు ఆమె ... అంది
  rationale: אמר అనే ‘చెప్పు/అను’ క్రియను ‘అంది’ నేరుగా ప్రతిబింబిస్తుంది; ‘అందుకు’ ప్రశ్న-జవాబు సంబంధాన్ని తెలుగులో సహజంగా కూర్చుతుంది.
- source_word: אֵלֵךְ
  choice: వెళ్తాను
  rationale: మొదటి పురుష ఏకవచన ప్రకటనను సంక్షిప్తంగా, దృఢంగా తెలియజేస్తుంది. ‘నేను వెళ్లడానికి సిద్ధంగా ఉన్నాను’ వంటి రూపం మూలానికి మించిన వివరణను జోడిస్తుంది.
