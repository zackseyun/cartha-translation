translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. కుటుంబ సంభాషణ సందర్భానికి తగినట్లుగా ‘నువ్వు’ వాడబడింది. హెబ్రీ వ్యక్తినామం רִבְקָה ను తెలుగు బైబిలు వాడుకకు అనుగుణంగా ‘రిబ్కా’గా లిప్యంతరీకరించబడింది.
