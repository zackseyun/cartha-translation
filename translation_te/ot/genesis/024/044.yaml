source:
  edition: WLC
  text: וְ/אָמְרָ֤ה אֵלַ/י֙ גַּם אַתָּ֣ה שְׁתֵ֔ה וְ/גַ֥ם לִ/גְמַלֶּ֖י/ךָ אֶשְׁאָ֑ב הִ֣וא הָֽ/אִשָּׁ֔ה אֲשֶׁר הֹכִ֥יחַ יְהוָ֖ה לְ/בֶן אֲדֹנִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/044.yaml
  text: and says to me[a], ‘You also drink, and I will draw water for your camels as well’—let her be the woman whom Yahweh has appointed for my master’s son.
translation:
  language: te
  text: “నీవు కూడా తాగు; నీ ఒంటెలకు కూడా నీళ్లు తోడుతాను” అని నాతో చెప్పే ఆమెయే నా యజమాని కుమారుని కోసం యాహ్వే నియమించిన[a] స్త్రీ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నిర్ణయించిన” లేక “నిర్దేశించిన.”
    reason: הֹכִיחַ అనే క్రియకు ఈ సందర్భంలో నిర్ణయించడం లేదా నిర్దేశించడం అనే సమీపార్థాలు కూడా సాధ్యమైనందున.
lexical_decisions:
- source_word: וְאָמְרָה אֵלַי
  choice: అని నాతో చెప్పే
  rationale: సేవకుడు తాను కోరిన సూచనను తిరిగి వివరిస్తున్న సందర్భంలో హెబ్రీ సంపూర్ణ క్రియ షరతుతో కూడిన భావాన్ని కలిగిస్తుంది. తెలుగులో సంబంధవాచక నిర్మాణం సహజంగా ఉండి ఆ భావాన్ని నిలుపుతుంది.
- source_word: גַּם אַתָּה שְׁתֵה
  choice: నీవు కూడా తాగు
  rationale: גַּם మరియు స్వతంత్ర సర్వనామం ఇచ్చే ‘నీవు కూడా’ అనే నొక్కిచెప్పడాన్ని, అలాగే ఆజ్ఞార్థక క్రియను స్పష్టంగా నిలుపుతుంది.
- source_word: וְגַם לִגְמַלֶּיךָ אֶשְׁאָב
  choice: నీ ఒంటెలకు కూడా నీళ్లు తోడిపోస్తాను
  rationale: שׁאב అంటే బావి లేదా నీటి మూలం నుంచి నీళ్లు తోడడం. సందర్భానుసారంగా ‘నీళ్లు’ను స్పష్టంగా చేర్చి, וְגַם లోని అదనపు భావాన్ని ‘కూడా’తో తెలిపింది.
- source_word: הִוא הָאִשָּׁה
  choice: ఆమెయే ... స్త్రీ
  rationale: ఇది గుర్తింపును తెలిపే నామవాచక వాక్యం. ‘ఆమెయే’ అనే రూపం హెబ్రీ సర్వనామంలోని నిర్దిష్ట నొక్కును సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; ఈ దశలో ‘భార్య’ అని ముందుగానే నిర్ధారించదు.
- source_word: אֲשֶׁר הֹכִיחַ
  choice: నిర్ణయించిన
  rationale: יכח హిఫీల్ రూపానికి ఈ సందర్భంలో నిర్ణయించడం, నియమించడం, నిర్దేశించడం అనే భావాలు సాధ్యం. ప్రార్థనకు జవాబుగా దేవుడు ఆ స్త్రీని నిర్దేశించే భావాన్ని ‘నిర్ణయించిన’ సహజంగా తెలియజేస్తుంది; ప్రత్యామ్నాయ భావాన్ని పాదటిప్పణిలో ఉంచింది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హెబ్రీ దైవనామాన్ని సాధారణ బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగు పాఠకులకు సుపరిచితమైన వ్యక్తినామ రూపంలో అందించింది.
- source_word: לְבֶן אֲדֹנִי
  choice: నా యజమాని కుమారుని కోసం
  rationale: לְ ఇక్కడ సంబంధం లేదా ఉద్దేశాన్ని సూచిస్తుంది. ‘కోసం’ ఆ స్త్రీ యజమాని కుమారునికి నిర్దేశించబడిందనే భావాన్ని సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: הִוא הָאִשָּׁה వాక్యాన్ని ప్రకటనగా లేదా ప్రార్థనాత్మక కోరికగా అనువదించడం
  choice: ఆమెయే ... స్త్రీ
  alternative: ఆమెనే ... స్త్రీగా ఉండనివ్వు
  rationale: హెబ్రీలో ఇది స్పష్టమైన ఆజ్ఞార్థక లేదా కోరికార్థక క్రియలేని గుర్తింపు వాక్యం. విస్తృత సందర్భం ప్రార్థనాత్మకమైనదైనా, మూలపాఠంలోని వ్యాకరణ రూపాన్ని మౌనంగా కోరికార్థకంగా మార్చకుండా ప్రకటనగా ఉంచింది.
- issue: יְהוָה దైవనామం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో సాధారణ బిరుదు కాకుండా టెట్రాగ్రామటన్ అనే వ్యక్తినామం ఉంది. అందువల్ల దానిని బిరుదుగా మార్చకుండా తెలుగు సంప్రదాయంలో స్థిరపడిన లిప్యంతరీకరణతో ఇచ్చింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి వాడబడింది. ‘నీళ్లు తోడిపోస్తాను’ గ్రామీణ బావి సందర్భాన్ని సహజంగా వ్యక్తం చేస్తుంది. ప్రత్యక్ష ఉద్ధరణలోని పునరుక్త ‘కూడా’ మూలపాఠంలోని సమాంతర నొక్కును నిలుపుతుంది.
