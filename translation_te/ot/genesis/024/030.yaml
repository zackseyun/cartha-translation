revisions:
- from: అతడు తన చెల్లెలి చేతులపై ఉన్న ముక్కుపుడకను, కంకణాలను చూసినప్పుడు, అలాగే తన చెల్లెలైన రిబ్కా, “ఆ మనిషి నాతో ఇలా మాట్లాడాడు” అని చెప్పిన మాటలు విన్నప్పుడు, ఆ మనిషి దగ్గరికి వెళ్లాడు. ఇదిగో, అతడు నీటి ఊట దగ్గర ఒంటెల పక్కన నిలబడి ఉన్నాడు.
