  rationale: The revision removes the unsupported age distinction in “younger sister” while retaining the source’s repeated identification of Rebekah as Laban’s sister. It also streamlines the rendering of the spring. No footnotes are required because the Telugu wording does not introduce a structural or unresolved lexical ambiguity needing an anchor.
  reviewer_model: gpt-5.6-terra
