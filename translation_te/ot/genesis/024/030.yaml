id: GEN.24.30
reference: Genesis 24:30
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְהִ֣י כִּ/רְאֹ֣ת אֶת הַ/נֶּ֗זֶם וְֽ/אֶת הַ/צְּמִדִים֮ עַל יְדֵ֣י אֲחֹת/וֹ֒ וּ/כְ/שָׁמְע֗/וֹ אֶת דִּבְרֵ֞י רִבְקָ֤ה אֲחֹת/וֹ֙ לֵ/אמֹ֔ר כֹּֽה דִבֶּ֥ר אֵלַ֖/י הָ/אִ֑ישׁ וַ/יָּבֹא֙ אֶל הָ/אִ֔ישׁ וְ/הִנֵּ֛ה עֹמֵ֥ד עַל הַ/גְּמַלִּ֖ים עַל הָ/עָֽיִן׀־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/030.yaml
  text: And it happened[a], when he saw the nose ring and the bracelets on his sister’s hands, and when he heard the words of Rebekah his sister, saying, “This is what the man said to me,” that he went to the man. And behold[d][c][b], he was standing by the camels at the spring.
translation:
  language: te
  text: అతడు తన సోదరి చేతులపై ఉన్న ముక్కుపుడకను, కంకణాలను చూసినప్పుడు, అలాగే తన సోదరియైన రిబ్కా, “ఆ మనిషి నాతో ఇలా మాట్లాడాడు” అని చెప్పిన మాటలు విన్నప్పుడు, ఆ మనిషి దగ్గరికి వెళ్లాడు. ఇదిగో, అతడు ఊట వద్ద ఒంటెల పక్కన నిలబడి ఉన్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: ప్రత్యేక పదబంధంగా అనువదించకుండా కాలసూచక వాక్య నిర్మాణంలో కలిపాం
  rationale: ఇక్కడ వַיְהִי కథనంలోని తదుపరి సంఘటనను కొనసాగిస్తుంది. తెలుగులో ‘అప్పుడు జరిగింది’ అని విడిగా ఉంచడం కృత్రిమంగా ఉంటుంది; ‘చూసినప్పుడు... విన్నప్పుడు... వెళ్లాడు’ అనే నిర్మాణం దాని కథన కార్యాన్ని సహజంగా అందిస్తుంది.
- source_word: הַנֶּזֶם
  choice: ముక్కుపుడకను
  rationale: נֶזֶם సాధారణంగా ఉంగరాన్ని కూడా సూచించగలదు; అయితే ఆదికాండం 24:47లో అది రిబ్కా ముక్కుపై పెట్టబడినట్లు సందర్భం స్పష్టం చేస్తుంది.
- source_word: הַצְּמִדִים
  choice: కంకణాలను
  rationale: చేతులకు లేదా మణికట్టులకు ధరించే జత ఆభరణాలను సూచించే సహజమైన ఆధునిక తెలుగు పదం.
- source_word: עַל יְדֵי אֲחֹתוֹ
  choice: తన చెల్లెలి చేతులపై ఉన్న
  rationale: హీబ్రూ יָדַיִםను ‘చేతులు’గా సమీపంగా ఉంచి, తెలుగులో ఆభరణాల స్థానాన్ని సహజంగా వ్యక్తం చేసింది.
- source_word: דִּבְרֵי רִבְקָה אֲחֹתוֹ לֵאמֹר
  choice: తన చెల్లెలైన రిబ్కా ... అని చెప్పిన మాటలు
  rationale: דִּבְרֵי యొక్క ‘మాటలు’ భావాన్ని, לֵאמֹר యొక్క ప్రత్యక్ష వాక్య పరిచయ కార్యాన్ని రెండింటినీ సహజమైన తెలుగు నిర్మాణంలో నిలిపింది.
- source_word: כֹּה דִבֶּר אֵלַי הָאִישׁ
  choice: ఆ మనిషి నాతో ఇలా మాట్లాడాడు
  rationale: כֹּה యొక్క ‘ఇలా/ఈ విధంగా’ భావాన్ని నేరుగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וַיָּבֹא אֶל הָאִישׁ
  choice: ఆ మనిషి దగ్గరికి వెళ్లాడు
  rationale: בוא + אֶל చేరికను సూచిస్తుంది; లాబాను దృష్టికోణం నుండి తెలుగులో ‘దగ్గరికి వెళ్లాడు’ స్పష్టంగా ఉంటుంది.
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: హఠాత్తుగా దృశ్యాన్ని పాఠకుని ముందుంచే హీబ్రూ సూచక కణం యొక్క సజీవతను నిలుపుతుంది.
- source_word: עֹמֵד עַל הַגְּמַלִּים
  choice: ఒంటెల పక్కన నిలబడి ఉన్నాడు
  rationale: עֹמֵד కొనసాగుతున్న స్థితిని సూచిస్తుంది. ఇక్కడ עַל అనేది ఒంటెలపై నిలబడటం కాక, వాటి దగ్గర లేదా పక్కన ఉండటాన్ని సూచిస్తుంది.
- source_word: עַל הָעָיִן
  choice: నీటి ఊట దగ్గర
  rationale: עַיִן ఇక్కడ బావి అనే సాధారణ భావం కంటే సహజ నీటి ఊట లేదా జలవనరును సూచిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే గౌరవప్రదమైన కథన శైలి. హీబ్రూ దీర్ఘ వాక్య నిర్మాణాన్ని తెలుగులో సహజంగా ఉంచుతూ, ‘ఇదిగో’ ద్వారా కథన సజీవతను కాపాడాం.
