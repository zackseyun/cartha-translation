  text: But you shall go to my father's house and to my clan[a], and you shall take a wife for my son.
translation:
  language: te
  text: కాని నీవు నా తండ్రి ఇంటివద్దకు, నా వంశస్థుల[a] వద్దకు వెళ్లి, నా కుమారునికి భార్యను తీసుకురావాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నా కుటుంబం వద్దకు’ లేదా ‘నా బంధువుల వద్దకు.’ హీబ్రూ పదం కేవలం ఒకే ఇంట్లోని కుటుంబాన్ని కాకుండా విస్తృత కుటుంబ లేదా బంధువర్గాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם לֹא
  choice: కాని
  rationale: మునుపటి నిషేధానికి భిన్నంగా చేయవలసినదాన్ని సూచించే ప్రమాణ సందర్భంలోని వ్యతిరేక భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; దీనిని సాధారణ షరతుగా అనువదించలేదు.
- source_word: בֵּית אָבִי
  choice: నా తండ్రి ఇంటివారి దగ్గరికి
  rationale: ‘నా తండ్రి ఇల్లు’ అనే మూలరూపంలోని కుటుంబ/గృహవర్గ భావాన్ని తెలుగులో స్పష్టంగా తెలియజేస్తుంది; కేవలం భవనాన్ని సూచిస్తున్నట్టు ఉండకుండా చేస్తుంది.
- source_word: תֵּלֵךְ
  choice: వెళ్లి
  rationale: ఆజ్ఞాత్మక బాధ్యతను ప్రధాన క్రియ అయిన ‘తీసుకురావాలి’తో కలిపి సహజమైన తెలుగు వాక్యనిర్మాణంలో వ్యక్తం చేస్తుంది.
- source_word: מִשְׁפַּחְתִּי
  choice: నా వంశంవారి
  rationale: తక్షణ కుటుంబానికి మించిన విస్తృత బంధువర్గాన్ని సూచిస్తుంది. ‘కుటుంబం’ కంటే మూలంలోని విస్తృత బంధుత్వ భావాన్ని బాగా నిలుపుతుంది.
- source_word: וְלָקַחְתָּ אִשָּׁה לִבְנִי
  choice: నా కుమారునికి భార్యను తీసుకురావాలి
  rationale: వివాహ ఏర్పాటులో కుమారుని కోసం భార్యను తీసుకోవడం/తీసుకురావడం అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
