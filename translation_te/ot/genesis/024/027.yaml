reference: Genesis 24:27
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר בָּר֤וּךְ יְהוָה֙ אֱלֹהֵי֙ אֲדֹנִ֣/י אַבְרָהָ֔ם אֲ֠שֶׁר לֹֽא עָזַ֥ב חַסְדּ֛/וֹ וַ/אֲמִתּ֖/וֹ מֵ/עִ֣ם אֲדֹנִ֑/י אָנֹכִ֗י בַּ/דֶּ֨רֶךְ֙ נָחַ֣/נִי יְהוָ֔ה בֵּ֖ית אֲחֵ֥י אֲדֹנִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/027.yaml
  text: And he said[a], “Blessed be Yahweh, the God of my master Abraham, who has not forsaken his steadfast love and his faithfulness from my master. As for me[b], Yahweh has led me on the way to the house of my master’s brothers.”
translation:
  language: te
  text: 'అతడు ఇలా అన్నాడు: “నా యజమాని అబ్రాహాము దేవుడైన యాహ్వే స్తుతింపబడుగాక! ఆయన నా యజమాని పట్ల తన అచంచల ప్రేమను, తన విశ్వసనీయతను[a] విడిచిపెట్టలేదు. నా విషయానికొస్తే, యాహ్వే నన్ను మార్గంలో నా యజమాని సోదరుల[b] ఇంటికి నడిపించాడు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “తన దృఢమైన దయను, తన సత్యాన్ని.” ఈ హీబ్రూ పదజంట తరచుగా స్థిరమైన ప్రేమ, నిబద్ధత, విశ్వసనీయత అనే భావాలను కలిపి తెలియజేస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ మూలంలో “సోదరులు”; ఇక్కడ అది అబ్రాహాము పురుష బంధువులను లేదా అతని కుటుంబ వంశాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ
  choice: స్తుతింపబడుగాక
  rationale: దేవునికి ఉద్దేశించిన స్తుతి ప్రకటనను సహజమైన, గౌరవప్రదమైన తెలుగులో వ్యక్తం చేస్తుంది; కేవలం స్థితిని తెలిపే ‘ధన్యుడు’ కంటే ఆశీర్వాద-స్తుతి సూత్రానికి సరిపోతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగు లిపిలో ధ్వన్యంతరీకరించింది.
- source_word: אֱלֹהֵי אֲדֹנִי אַבְרָהָם
  choice: నా యజమాని అబ్రాహాము దేవుడు
  rationale: హీబ్రూ సంబంధపదబంధాన్ని స్పష్టంగా ఉంచుతూ, సేవకుడు అబ్రాహామును ‘నా యజమాని’ అని సంబోధించే భావాన్ని నిలుపుతుంది.
- source_word: חַסְדּוֹ וַאֲמִתּוֹ
  choice: తన అచంచల ప్రేమను, నమ్మకత్వాన్ని
  rationale: ఈ జంట పదాలలోని స్థిరమైన ప్రేమ/విశ్వసనీయత భావాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది; ఒడంబడిక భావాన్ని అతిగా వివరణాత్మకంగా మార్చదు.
- source_word: לֹא עָזַב ... מֵעִם אֲדֹנִי
  choice: నా యజమాని పట్ల ... విడిచిపెట్టలేదు
  rationale: మూలంలోని ‘విడిచిపెట్టలేదు’ అనే రూపకాన్ని నిలుపుతూ, מֵעִם సూచించే సంబంధాన్ని తెలుగులో సహజంగా ‘పట్ల’తో వ్యక్తం చేస్తుంది.
- source_word: אָנֹכִי
  choice: నా విషయానికొస్తే
  rationale: ముందుకు తెచ్చిన స్వతంత్ర సర్వనామంలోని ఉద్ఘాటనను నిలుపుతుంది.
- source_word: בַּדֶּרֶךְ נָחַנִי
  choice: ఈ మార్గంలో ... నన్ను నడిపించాడు
  rationale: ప్రయాణ మార్గంలో యాహ్వే ఇచ్చిన వ్యక్తిగత నడిపింపును నేరుగా, సహజంగా తెలియజేస్తుంది.
- source_word: בֵּית אֲחֵי אֲדֹנִי
  choice: నా యజమాని సోదరుల ఇంటికి
  rationale: ‘ఇల్లు/ఇంటి’ మరియు పురుష బహువచన బంధుత్వపదమైన ‘సోదరులు’ రెండింటినీ ప్రధాన పాఠ్యంలో నిలుపుతుంది; సందర్భంలోని విస్తృత కుటుంబార్థాన్ని పాదటిప్పణి వివరిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠ్యంలో వ్యక్తినామం ప్రత్యక్షంగా ఉన్నందున దానిని బిరుదుగా మార్చకుండా ధ్వన్యంతరీకరించాం.
- issue: חֶסֶד וֶאֱמֶת పదజంట భావం
  choice: అచంచల ప్రేమ, నమ్మకత్వం
  alternative: కృప, సత్యం / ఒడంబడిక నిబద్ధత, విశ్వసనీయత
  rationale: సంబంధపరమైన స్థిర ప్రేమ మరియు విశ్వసనీయత రెండింటినీ కాపాడుతూ, ‘ఒడంబడిక’ అనే వివరణను మూలంలో లేనిచోట ప్రధాన పాఠ్యంలో చేర్చలేదు.
- issue: אֲחֵי యొక్క బంధుత్వ విస్తృతి
  choice: సోదరులు
  alternative: బంధువులు / కుటుంబీకులు
  rationale: మూలంలోని పురుష బహువచన బంధుత్వపదాన్ని ప్రధాన పాఠ్యంలో నిలిపి, ఈ సందర్భంలో అది అబ్రాహాము పురుష బంధువులు లేదా కుటుంబ వంశాన్ని సూచించవచ్చని పాదటిప్పణిలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి వాడబడింది. స్తుతి సూత్రానికి ‘స్తుతింపబడుగాక’ను, సేవకుని గౌరవ సంబోధనకు ‘నా యజమాని’ని ఎంచుకున్నాం. పాదటిప్పణి గుర్తులను అవి వివరించే పదాల దగ్గర ఉంచాం.
