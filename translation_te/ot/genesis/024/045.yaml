  text: אֲנִי֩ טֶ֨רֶם אֲכַלֶּ֜ה לְ/דַבֵּ֣ר אֶל לִבִּ֗/י וְ/הִנֵּ֨ה רִבְקָ֤ה יֹצֵאת֙ וְ/כַדָּ֣/הּ עַל שִׁכְמָ֔/הּ וַ/תֵּ֥רֶד הָ/עַ֖יְנָ/ה וַ/תִּשְׁאָ֑ב וָ/אֹמַ֥ר אֵלֶ֖י/הָ הַשְׁקִ֥י/נִי נָֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/045.yaml
  text: Before I had finished speaking in my heart[a], behold, Rebekah came out with her jar on her shoulder, and she went down to the spring and drew water. Then I said to her[b], ‘Please give me a drink.’
translation:
  language: te
  text: నేను నా మనసులో మాటలాడటం ఇంకా ముగించకముందే[a], ఇదిగో, రిబ్కా భుజంపై కుండతో బయటికి వచ్చింది. ఆమె ఊటకు[b] దిగి నీళ్లు తోడింది. అప్పుడు నేను ఆమెతో, “దయచేసి నాకు తాగడానికి నీళ్లు ఇవ్వు” అన్నాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “నా హృదయంతో మాట్లాడడం”; ఇది అంతరంగంగా మాట్లాడడాన్ని, సందర్భానుసారంగా ప్రార్థనను కూడా సూచించగల నుడికారం.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “జలధార.” హీబ్రూ పదం సాధారణంగా “బావి”కి వాడే పదం కాక, సహజ నీటి ఊటను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: טֶרֶם אֲכַלֶּה
  choice: ఇంకా ముగించకముందే
  rationale: టֶרֶם ఆ సమయానికి క్రియ ఇంకా పూర్తికాలేదని సూచిస్తుంది; ఈ తెలుగు రూపం కాలసంబంధ భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: לְדַבֵּר אֶל־לִבִּי
  choice: నా హృదయంలో మాట్లాడడం
  rationale: అక్షరార్థంగా ‘నా హృదయంతో/హృదయానికి మాట్లాడడం’; సందర్భంలో అంతరంగ మాట లేదా ప్రార్థన. ప్రధాన పాఠంలో హీబ్రూ రూపకాన్ని పారదర్శకంగా ఉంచి, పాదటిప్పణిలో భావాన్ని వివరిస్తుంది.
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: ఆకస్మికతను, సజీవ కథన ప్రవేశాన్ని సూచించే హీబ్రూ అవ్యయానికి గౌరవప్రదమైన సహజ తెలుగు సమానం.
- source_word: רִבְקָה
  choice: రిబ్కా
  rationale: హీబ్రూ రִבְקָה ధ్వనిరూపానికి దగ్గరగా ఉండే తెలుగు లిప్యంతరీకరణ.
- source_word: יֹצֵאת
  choice: బయటికి వచ్చింది
  rationale: הִנֵּה తరువాతి వర్తమాన కృదంతం కథనంలో సజీవంగా ప్రత్యక్షమయ్యే చర్యను తెలుపుతుంది; తెలుగులో సహజ కథన రూపం.
- source_word: כַדָּהּ
  choice: తన కుండను
  rationale: כַּד్ నీరు తోడటానికి లేదా మోయటానికి ఉపయోగించే పాత్ర; ‘కుండ’ సాధారణ ఆధునిక తెలుగులో స్పష్టంగా ఉంటుంది.
- source_word: עַל־שִׁכְמָהּ
  choice: భుజం మీద
  rationale: మూలంలోని సరళ స్థానార్థాన్ని సహజ తెలుగులో నేరుగా వ్యక్తం చేస్తుంది.
- source_word: וַתֵּרֶד הָעַיְנָה
  choice: నీటి ఊట దగ్గరికి దిగి
  rationale: עַיִן ఇక్కడ సాధారణంగా సహజ నీటి ఊటను సూచిస్తుంది; בְּאֵר ‘బావి’ అనే వేరే పదంతో కలపకుండా మూలభేదాన్ని కాపాడుతుంది.
- source_word: וַתִּשְׁאָב
  choice: నీళ్లు తోడింది
  rationale: שׁאב నీటిని తోడటాన్ని సూచిస్తుంది; తెలుగులో కర్మను స్పష్టంగా చెప్పడం సహజం.
- source_word: הַשְׁקִינִי נָא
  choice: దయచేసి నాకు తాగడానికి ఇవ్వు
  rationale: שׁקה హిఫిల్ ఆజ్ఞార్థకం ‘తాగించు/తాగడానికి ఇవ్వు’ అని అర్థం; נָא లోని వినయాన్ని ‘దయచేసి’ వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: అంతరంగ మాట ప్రార్థనా లేక స్వీయ సంభాషణా
  choice: ప్రధాన పాఠంలో ‘నా హృదయంలో మాట్లాడడం’ అని అనిశ్చితిని నిలుపడం
  alternative: ‘నా మనసులో ప్రార్థించడం’ లేదా ‘నాలో నేను అనుకోవడం’
  rationale: సందర్భం ప్రార్థనను సూచించగలిగినా, לְדַבֵּר אֶל־לִבִּי స్వయంగా అంతరంగ మాటను మాత్రమే స్పష్టంగా చెబుతుంది. అందువల్ల ఒకే వ్యాఖ్యానాన్ని పాఠంలో నిర్బంధించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘ఇదిగో’ ద్వారా మూలంలోని సజీవతను, ‘నీటి ఊట’ ద్వారా עַיִן మరియు ‘బావి’ మధ్య పదభేదాన్ని కాపాడాం. ప్రధాన పాఠంలోని [a] గుర్తు పాదటిప్పణితో సరిపోలుతుంది.
