review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents the temporal clause, vivid הנה particle, Rebekah's jar on her shoulder, descent to a spring, drawing water, and the polite request. However, “నా హృదయంలో మాట్లాడడం” shifts the Hebrew construction (‘speaking to my heart’) to the less natural and somewhat spatially confusing sense of speaking ‘in’ the heart. “నా మనసులో మాటలాడటం” is natural modern Telugu for inward speech and does not force the interpretation of prayer.
  naturalness: 'A few small revisions improve idiomatic modern Telugu: “భుజంపై కుండతో” naturally expresses carrying the jar on her shoulder; “ఊటకు దిగి” precisely expresses going down to the spring; and explicitly supplying “నీళ్లు” makes the request natural in Telugu while remaining contextually entailed.'
  terminology: రిబ్కా is an appropriate Hebrew-near form. ఊట correctly distinguishes עַיִן (‘spring’) from a well. The inward-speech wording preserves the source ambiguity; the footnote may note prayer only as a possible contextual implication, not as the sole meaning.
  issues:
  - severity: medium
    issue: ‘నా హృదయంలో మాట్లాడడం’ is unnatural and slightly imprecise for לְדַבֵּר אֶל־לִבִּי.
    rationale: The Hebrew preposition is ‘to,’ and the idiom denotes inward speech. Telugu ‘హృదయంలో మాట్లాడడం’ can sound like speech occurring inside a physical location. ‘నా మనసులో మాటలాడటం’ idiomatically conveys inward speech without imposing prayer.
  - severity: low
    issue: ‘నీటి ఊట దగ్గరికి దిగి’ weakens the destination expressed by הָעַיְנָה.
    rationale: The Hebrew says that she went down to the spring itself. ‘ఊటకు దిగి’ is both natural and more exact.
  - severity: low
    issue: The draft does not provide a footnote for the source’s lexical distinction between spring and well.
    rationale: Because the English audit trail explicitly identifies this distinction, a footnote anchored to ‘ఊట’ helpfully preserves it in Telugu without burdening the main text.
  revised_text: నేను నా మనసులో మాటలాడటం ఇంకా ముగించకముందే[a], ఇదిగో, రిబ్కా భుజంపై కుండతో బయటికి వచ్చింది. ఆమె ఊటకు[b] దిగి నీళ్లు తోడింది. అప్పుడు నేను ఆమెతో, “దయచేసి నాకు తాగడానికి నీళ్లు ఇవ్వు” అన్నాను.
