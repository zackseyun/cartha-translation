  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/תֹּ֣אמֶר אֶל הָ/עֶ֗בֶד מִֽי הָ/אִ֤ישׁ הַלָּזֶה֙ הַ/הֹלֵ֤ךְ בַּ/שָּׂדֶה֙ לִ/קְרָאתֵ֔/נוּ וַ/יֹּ֥אמֶר הָ/עֶ֖בֶד ה֣וּא אֲדֹנִ֑/י וַ/תִּקַּ֥ח הַ/צָּעִ֖יף וַ/תִּתְכָּֽס־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/065.yaml
  text: And she said to the servant[a], “Who is this man walking in the field to meet us?” And the servant said[c][b], “He is my master.” Then she took the veil and covered herself.
translation:
  language: te
  text: ఆమె ఆ సేవకునితో, “మనలను కలుసుకోవడానికి పొలంలో నడుచుకుంటూ వస్తున్న ఆ మనిషి ఎవరు?” అని అడిగింది. ఆ సేవకుడు, “ఆయన నా యజమాని” అని చెప్పాడు. అప్పుడు ఆమె ముసుగు తీసుకొని ముసుగుతో తనను తాను కప్పుకుంది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָעֶבֶד
  choice: ఆ సేవకుడు
  rationale: עֶבֶד సేవకుడు లేదా బానిసను సూచించగలదు. ఈ వృత్తాంత సందర్భంలో అబ్రాహాము ఇంటి ప్రతినిధిగా అతని పాత్ర ప్రధానమైనందున సహజమైన ‘సేవకుడు’ను ఎంచుకున్నాం.
- source_word: הָאִישׁ הַלָּזֶה
  choice: ఆ మనిషి
  rationale: కనిపిస్తున్న ఒక నిర్దిష్ట పురుషుణ్ణి సూచించే ప్రశ్న ఇది. తెలుగు దూరసూచనలో ‘ఆ మనిషి’ సహజంగా ఉంది.
- source_word: הַהֹלֵךְ בַּשָּׂדֶה
  choice: పొలంలో నడుచుకుంటూ వస్తున్న
  rationale: הלך యొక్క నడక భావాన్ని నిలుపుతూ, לִקְרָאתֵנוּ సూచించే వారి వైపు కదలికను తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לִקְרָאתֵנוּ
  choice: మనలను కలుసుకోవడానికి
  rationale: ఎదురుగా వెళ్లి కలుసుకోవడం అనే ఉద్దేశ్యపూర్వక కదలికను స్పష్టంగా తెలియజేస్తుంది.
- source_word: הוּא אֲדֹנִי
  choice: ఆయన నా యజమాని
  rationale: אֲדֹנִי ఇక్కడ సేవకుని మానవ యజమానిని సూచిస్తుంది; దైవ బిరుదుగా అపార్థం కాకుండా ‘యజమాని’ సరిపోతుంది. గౌరవసూచకంగా ‘ఆయన’ వాడబడింది.
- source_word: הַצָּעִיף
  choice: ముసుగు
  rationale: צעיף స్త్రీ ధరించే కప్పు లేదా ముఖావరణాన్ని సూచిస్తుంది; ఈ వివాహ సందర్భంలో ‘ముసుగు’ స్పష్టమైన ఆధునిక తెలుగు పదం.
- source_word: וַתִּתְכָּס
  choice: తనను కప్పుకుంది
  rationale: హిత్పయేల్ రూపంలోని ఆత్మనేపద భావాన్ని నేరుగా నిలుపుతుంది; ముందు పేర్కొన్న ముసుగుతోనే కప్పుకుందనే సంబంధం సందర్భం ద్వారా స్పష్టమవుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని వరుస సంభాషణను, ఆత్మనేపద భావాన్ని నిలుపుతూ అనవసరమైన సిద్ధాంతార్థాలను చేర్చలేదు.
