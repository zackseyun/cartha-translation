source:
  edition: WLC
  text: וְ/הָיָ֣ה הַֽ/נַּעֲרָ֗ אֲשֶׁ֨ר אֹמַ֤ר אֵלֶ֨י/הָ֙ הַטִּי נָ֤א כַדֵּ/ךְ֙ וְ/אֶשְׁתֶּ֔ה וְ/אָמְרָ֣ה שְׁתֵ֔ה וְ/גַם גְּמַלֶּ֖י/ךָ אַשְׁקֶ֑ה אֹתָ֤/הּ הֹכַ֨חְתָּ֙ לְ/עַבְדְּ/ךָ֣ לְ/יִצְחָ֔ק וּ/בָ֣/הּ אֵדַ֔ע כִּי עָשִׂ֥יתָ חֶ֖סֶד עִם אֲדֹנִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/014.yaml
  text: And let it be that the young woman to whom I say[a], ‘Please lower your jar so that I may drink,’ and who says, ‘Drink, and I will also water your camels’—let her be the one you have appointed for your servant, for Isaac[c][b]. By her I will know that you have shown steadfast love to my master.
translation:
  language: te
  text: నేను ఏ యువతితో, ‘దయచేసి నీ కుండను వంచు; నేను తాగుతాను’ అని అంటానో, ఆమె, ‘తాగండి; మీ ఒంటెలకు కూడా నీళ్లు తాగిస్తాను’ అని చెప్పే యువతి నీ సేవకుని కోసం, ఇస్సాకు కోసం నీవు నియమించిన యువతిగా ఉండనివ్వు.[a] ఆమె ద్వారా[b] నీవు నా యజమాని పట్ల నిబద్ధమైన ప్రేమ చూపించావని నేను తెలుసుకుంటాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీ సేవకుడైన ఇస్సాకు కోసం.” హెబ్రీలో ఈ పదబంధాన్ని ఇస్సాకు అనే ‘నీ సేవకుడికి’ అని సమానాధికరణంగా చదవవచ్చు.
    reason: alternative_reading
  - marker: b
    text: లేదా, “దీని ద్వారా.” హెబ్రీలో అక్షరార్థంగా “ఆమె ద్వారా” అని ఉంది; సందర్భంలో ఆ యువతి దేవుడు ఇచ్చే సూచనగా ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: ఉండనివ్వు
  rationale: ప్రార్థనలోని అభ్యర్థనాత్మక భావాన్ని తెలుగులో సహజంగా వాక్యాంతంలో వ్యక్తం చేస్తుంది; హెబ్రీ వాక్య నిర్మాణాన్ని కృత్రిమంగా అనుకరించదు.
- source_word: הַנַּעֲרָ
  choice: యువతి
  rationale: వివాహ వయస్సులోని యువ స్త్రీని సూచించే సహజమైన ఆధునిక తెలుగు పదం.
- source_word: הַטִּי נָא כַדֵּךְ וְאֶשְׁתֶּה
  choice: దయచేసి నీ కుండను వంచు; నేను తాగుతాను
  rationale: הטה యొక్క వంచు/ఒంపు భావాన్ని, נָא యొక్క మర్యాదపూర్వక అభ్యర్థనను, cohortative సందర్భాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: וְגַם גְּמַלֶּיךָ אַשְׁקֶה
  choice: మీ ఒంటెలకు కూడా నీళ్లు పెడతాను
  rationale: శקה హిఫీల్‌లోని ‘తాగడానికి నీళ్లు ఇవ్వడం’ అనే భావాన్ని సాధారణ తెలుగు వాడుకలో సహజంగా తెలుపుతుంది.
- source_word: אֹתָהּ הֹכַחְתָּ
  choice: ఆమెనే ... నీవు నిర్ణయించినదానిగా
  rationale: ఈ సందర్భంలో హిఫీల్ రూపం దేవుడు సూచన ద్వారా ఎంపిక చేసిన లేదా నిర్ధారించిన స్త్రీని సూచిస్తుంది; ‘నిర్ణయించిన’ అనే పదం ఆ భావాన్ని అతిగా సిద్ధాంతీకరించకుండా అందిస్తుంది.
- source_word: לְעַבְדְּךָ לְיִצְחָק
  choice: నీ సేవకునికి, అంటే ఇస్సాకుకు
  rationale: రెండవ לְ పదబంధాన్ని ముందున్న ‘నీ సేవకుడు’ ఎవరనేది వివరించే సమానాధికరణంగా ప్రధాన పాఠం గ్రహిస్తుంది; పునరుక్త హెబ్రీ నిర్మాణంలోని ప్రత్యామ్నాయ అవకాశాన్ని పాదసూచికలో ఉంచింది.
- source_word: וּבָהּ אֵדַע
  choice: ఆమె ద్వారా ... నేను తెలుసుకుంటాను
  rationale: స్త్రీలింగ ఏకవచన ప్రత్యయం సహజంగా యువతినే తిరిగి సూచిస్తుంది; ఆమె దేవుడు ఇచ్చే సూచనకు సాధనంగా ఉంటుంది.
- source_word: חֶסֶד
  choice: నిబద్ధమైన ప్రేమ
  rationale: חֶסֶד లోని దయ, విశ్వసనీయత, సంబంధ నిబద్ధతలను కేవలం ‘దయ’గా కుదించకుండా, సాంకేతిక ఒడంబడిక పదజాలాన్ని బలవంతంగా చేర్చకుండా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: לְעַבְדְּךָ לְיִצְחָק లో ‘నీ సేవకుడు’ ఎవరు?
  choice: ‘నీ సేవకుడు’ అనేది ఇస్సాకును సూచిస్తుంది; రెండవ పదబంధం వివరణాత్మక సమానాధికరణం.
  alternative: ‘నీ సేవకుని కోసం, ఇస్సాకు కోసం’ అని రెండు వేరు ప్రయోజనార్థక పదబంధాలుగా చదవవచ్చు.
  rationale: కథా సందర్భంలో భార్యను ఇస్సాకు కోసం వెదుకుతున్నారు; పునరుక్త לְ వివరణాత్మకంగా ఉండగలదు. అయినా హెబ్రీ క్రమం మరో పఠనానికి వీలు ఇస్తుంది కాబట్టి దానిని పాదసూచికలో సంరక్షించాం.
- issue: וּבָהּ లోని స్త్రీలింగ ప్రత్యయం దేనిని సూచిస్తుంది?
  choice: యువతి ద్వారా
  alternative: ఈ సూచన లేదా సంఘటన ద్వారా
  rationale: వ్యాకరణపరంగా స్త్రీలింగ ప్రత్యయం ముందున్న యువతిని నేరుగా సూచిస్తుంది; సందర్భంలో ఆమెనే సూచనగా భావించడం వల్ల భావార్థంగా ‘దీని ద్వారా’ అనడం కూడా సాధ్యం.
- issue: חֶסֶד యొక్క భావ పరిధి
  choice: నిబద్ధమైన ప్రేమ
  alternative: దయ; విశ్వసనీయ ప్రేమ; ఒడంబడిక విశ్వాసం
  rationale: సంబంధపరమైన విశ్వసనీయతను నిలుపుతూ, ఈ సందర్భం స్పష్టంగా చెప్పనంత సాంకేతిక ఒడంబడిక అర్థాన్ని అనువాదంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన-ప్రార్థనా శైలి. సేవకుడు యువతిని ఏకవచనంలో సంబోధిస్తాడు; యువతి అపరిచితుడైన పెద్దవానితో మాట్లాడే సహజ తెలుగు మర్యాదను చూపేందుకు గౌరవ బహువచనం వాడింది. ప్రాచీన లేదా మతశాఖాపరమైన ప్రత్యేక పదజాలాన్ని నివారించాం.
