  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אִם לֹ֨א תֹאבֶ֤ה הָֽ/אִשָּׁה֙ לָ/לֶ֣כֶת אַחֲרֶ֔י/ךָ וְ/נִקִּ֕יתָ מִ/שְּׁבֻעָתִ֖/י זֹ֑את רַ֣ק אֶת בְּנִ֔/י לֹ֥א תָשֵׁ֖ב שָֽׁמָּ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/008.yaml
  text: But if the woman is not willing to go after you[a], then you will be free from this oath of mine[b]; only you must not take my son back there.
translation:
  language: te
  text: కాని ఆ స్త్రీ నీ వెంట రావడానికి ఇష్టపడకపోతే[a], నా ఈ ప్రమాణం నుండి నీవు విడుదల పొందుతావు[b]. అయితే నా కుమారుణ్ణి మాత్రం అక్కడికి తిరిగి తీసుకెళ్లకూడదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘నీతో రావడానికి’ లేదా ‘నిన్ను అనుసరించడానికి’; అక్షరార్థంగా ‘నీ వెనుక వెళ్లడానికి.’
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘నా ఈ ప్రమాణబంధం నుండి నీవు విముక్తుడవుతావు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: కాని ... అయితే
  rationale: ముందటి ఆదేశానికి భిన్నమైన సంభావ్యతను తెలిపే షరతుగా సందర్భోచితంగా అనువదించబడింది.
- source_word: לֹא תֹאבֶה
  choice: ఇష్టపడకపోతే
  rationale: ఆమె సమ్మతి లేదా సుముఖత లేకపోవడాన్ని తెలియజేస్తుంది; బహిరంగ ధిక్కారమనే భావాన్ని అతిగా చేర్చదు.
- source_word: הָאִשָּׁה
  choice: ఆ స్త్రీ
  rationale: ఈ దశలో ఆమె ఇంకా గుర్తించబడని భావి వధువు; అందువల్ల ‘భార్య’ అనడం ముందస్తు భావాన్ని చేర్చుతుంది.
- source_word: לָלֶכֶת אַחֲרֶיךָ
  choice: నీ వెంట రావడానికి
  rationale: అక్షరార్థంలోని ‘నీ వెనుక వెళ్లడం’ అనే భావాన్ని సహజమైన ఆధునిక తెలుగు ప్రయాణ సందర్భంలో వ్యక్తం చేస్తుంది.
- source_word: וְנִקִּיתָ
  choice: నీవు విడుదల పొందుతావు
  rationale: ప్రమాణం విధించిన బాధ్యత నుండి విముక్తి పొందడమనే నిఫాల్ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: מִשְּׁבֻעָתִי זֹאת
  choice: నా ఈ ప్రమాణం నుండి
  rationale: మొదటి పురుష ప్రత్యయాన్నీ ‘ఈ’ అనే సూచనార్థాన్నీ రెండింటినీ నిలుపుతుంది.
- source_word: רַק
  choice: అయితే ... మాత్రం
  rationale: విడుదలకు వర్తించే కఠిన పరిమితిని సహజమైన తెలుగులో బలంగా చూపుతుంది.
- source_word: אֶת־בְּנִי לֹא תָשֵׁב שָׁמָּה
  choice: నా కుమారుణ్ణి ... అక్కడికి తిరిగి తీసుకెళ్లకూడదు
  rationale: שוב హిఫీల్‌లోని కారణార్థక భావాన్నీ, ‘అక్కడికి’ అనే స్థల సూచననూ, నిషేధ బలాన్నీ కాపాడుతుంది.
