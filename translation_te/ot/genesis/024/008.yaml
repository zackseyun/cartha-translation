translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘నీ వెంట రావడం’ ప్రయాణ సందర్భాన్ని స్పష్టంగా ఉంచుతుండగా, పాదటిప్పణి హెబ్రీ పదబంధపు అక్షరార్థాన్ని మరియు ప్రత్యామ్నాయాలను భద్రపరుస్తుంది.
