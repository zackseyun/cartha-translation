  source_fidelity: హెబ్రీ వాక్యంలోని షరతు, స్త్రీ యొక్క సుముఖత లేకపోవడం, ప్రమాణబాధ్యత నుండి విడుదల, అలాగే కుమారుణ్ణి అక్కడికి తిరిగి తీసుకెళ్లరాదనే కఠిన పరిమితి అన్నీ సరిగ్గా ప్రతిఫలించాయి. ‘నీ వెంట రావడానికి’ అనేది לָלֶכֶת אַחֲרֶיךָ యొక్క ప్రయాణసందర్భ భావాన్ని సహజంగా అందిస్తుంది; పాదటిప్పణి అక్షరార్థాన్నీ ప్రత్యామ్నాయాలనూ సముచితంగా ఇస్తుంది.
