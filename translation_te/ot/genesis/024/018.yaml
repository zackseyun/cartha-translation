  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. సంభాషణలోని సామాజిక మర్యాదను ‘తాగండి’ అనే రూపంతో నిలుపుతూ, మూలంలోని కాంక్రీటు చర్యల క్రమాన్ని మార్చలేదు.
