  yaml_path: translation/ot/genesis/024/018.yaml
  text: She said[a], “Drink, my lord,” and she quickly lowered her jar onto her hand and gave him a drink.
translation:
  language: te
  text: ఆమె, “అయ్యా[a], తాగండి” అని చెప్పి, వెంటనే తన కుండను తన చేతిమీదకు దించి అతనికి తాగించింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా “నా ప్రభువా.” హీబ్రూలో ఇది ఒక పురుషునికి గౌరవంగా వాడిన సంబోధన; లేదా “అయ్యా.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁתֵה
  choice: తాగండి
  rationale: ఇది రెండవ పురుష ఏకవచన ఆజ్ఞారూపం. తెలుగులో మర్యాదార్థక బహువచన రూపం సందర్భంలోని గౌరవాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: אֲדֹנִי
  choice: నా ప్రభువా
  rationale: మూలంలోని ‘నా ప్రభువు’ అనే అక్షరార్థాన్ని, ఒక అపరిచిత పురుషునితో గౌరవంగా మాట్లాడే సంబోధనగా నిలుపుతుంది; ఇది ఇక్కడ దేవునికి వాడిన బిరుదు కాదు.
- source_word: וַתְמַהֵר
  choice: వెంటనే
  rationale: ఆమె ఆలస్యం చేయకుండా త్వరగా స్పందించిన భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וַתֹּרֶד כַּדָּהּ
  choice: తన కుండను ... దించి
  rationale: కుండను మోస్తున్న స్థానం నుంచి కిందికి తీసుకువచ్చిన భౌతిక చర్యను స్పష్టంగా తెలియజేస్తుంది.
- source_word: עַל יָדָהּ
  choice: చేతిపైకి
  rationale: మూలంలోని ‘ఆమె చేతిమీదికి’ అనే నిర్దిష్టమైన శరీరస్థాన సూచనను నిలుపుతుంది; ఈ వచనంలో నేరుగా లేని ‘భుజం మీద నుంచి’ అనే వివరాన్ని చేర్చదు.
- source_word: וַתַּשְׁקֵהוּ
  choice: అతనికి తాగించింది
  rationale: שׁקה హిఫిల్ రూపంలోని ‘తాగేలా చేయడం/తాగనివ్వడం’ అనే causative భావాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
