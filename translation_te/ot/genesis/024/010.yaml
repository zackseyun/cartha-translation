base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/010.yaml
  text: Then the servant took ten of his master's camels and went[a], with all kinds of good things from his master in his hand. And he arose and went to Aram-naharaim[d][c][b], to the city of Nahor.
translation:
  language: te
  text: అప్పుడు ఆ సేవకుడు తన యజమాని ఒంటెలలో పదింటిని తీసుకొని, తన యజమాని మంచి వస్తువులన్నీ తన చేతిలో ఉండగా, వెళ్లాడు.[a] అతడు లేచి అరామ్-నహరాయీముకు[b], నాహోరు పట్టణానికి వెళ్లాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘తన యజమాని ఆస్తి అంతా అతని అధీనంలో ఉండగా.’ ‘అతని చేతిలో’ అనే హెబ్రీ నుడికారం స్వాధీనం లేదా నిర్వహణాధికారాన్ని కూడా సూచించవచ్చు; ఇక్కడ అతడు తీసుకెళ్లిన విలువైన బహుమతులు ఉద్దేశమై ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: 'హెబ్రీ: ‘అరామ్-నహరాయీము’; సాంప్రదాయికంగా ‘మెసొపొతామియా’ లేదా ‘రెండు నదుల అరాము’ అని అనువదిస్తారు.'
    reason: alternative_reading
lexical_decisions:
- source_word: הָעֶבֶד
  choice: సేవకుడు
  rationale: עֶבֶד అనే పదానికి ‘దాసుడు’ లేదా ‘సేవకుడు’ అనే అర్థాలు ఉండవచ్చు. ఈ గృహ సంబంధ కథన సందర్భంలో అతని బాధ్యతాయుతమైన సేవ ప్రధానంగా కనిపిస్తున్నందున సహజమైన ‘సేవకుడు’ను ఎంచుకున్నాం.
- source_word: עֲשָׂרָה גְמַלִּים מִגְּמַלֵּי אֲדֹנָיו
  choice: తన యజమాని ఒంటెలలో పదింటిని
  rationale: מִן సూచించే సమూహంలోనుంచి ఎంపిక అనే భావాన్ని సహజమైన తెలుగులో ‘ఒంటెలలో పదింటిని’ అని నిలిపాం.
- source_word: אֲדֹנָיו
  choice: తన యజమాని
  rationale: ఇక్కడ אָדוֹן గృహాధిపతిని సూచిస్తుంది; ‘ప్రభువు’ అని అనువదిస్తే అనవసరమైన దైవిక లేదా రాజసంబంధ భావం కలగవచ్చు.
- source_word: וְכָל טוּב אֲדֹנָיו בְּיָדוֹ
  choice: తన యజమాని విలువైన వస్తువులన్నీ అతని చేతిలో ఉన్నాయి
  rationale: טוּב ఇక్కడ నైరూప్యమైన ‘మంచితనం’ కంటే ప్రయాణంలో తీసుకెళ్లిన విలువైన వస్తువులు లేదా బహుమతులను సూచిస్తుంది. בְּיָדוֹ అనే ‘అతని చేతిలో’ రూపాన్ని నిలిపి, అధీనం లేదా బాధ్యత అనే విస్తృత భావాన్ని పాదసూచికలో తెలిపాం.
- source_word: וַיָּקָם וַיֵּלֶךְ
  choice: అతడు లేచి ... వెళ్లాడు
  rationale: క్రియల వరుసను కలిపి ‘బయలుదేరాడు’ అని మాత్రమే చేయకుండా, మూలంలోని కథన లయను నిలిపాం.
- source_word: אֲרַם נַהֲרַיִם
  choice: అరామ్-నహరాయిము
  rationale: సాంప్రదాయిక ‘మెసొపొతామియా’ అనే భౌగోళిక సమానార్థకాన్ని నేరుగా పెట్టకుండా హెబ్రీ పేరును లిప్యంతరీకరించాం.
- source_word: עִיר נָחוֹר
  choice: నాహోరు పట్టణం
  rationale: ఈ నిర్మాణం నాహోరుతో అనుబంధమున్న పట్టణాన్ని సూచించవచ్చు; అతడే దాన్ని స్థాపించాడని అనువాదంలో నిర్ణయించలేదు.
