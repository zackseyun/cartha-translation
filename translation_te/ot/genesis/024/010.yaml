translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలిని వాడాం. హెబ్రీ మూలంలో ‘వెళ్లాడు ... లేచి వెళ్లాడు’ అని కనిపించే పునరుక్తిని తొలగించకుండా ఉంచాం. ప్రదేశనామాలను తెలుగు ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించాం.
