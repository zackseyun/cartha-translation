- from: అప్పుడు ఆ సేవకుడు తన యజమాని ఒంటెలలో పదింటిని తీసుకొని వెళ్లాడు. తన యజమాని విలువైన వస్తువులన్నీ అతని చేతిలో ఉన్నాయి.[a] అతడు లేచి అరామ్-నహరాయిముకు[b], నాహోరు పట్టణానికి వెళ్లాడు.
