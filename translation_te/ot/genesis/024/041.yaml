id: GEN.24.41
reference: Genesis 24:41
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אָ֤ז תִּנָּקֶה֙ מֵ/אָ֣לָתִ֔/י כִּ֥י תָב֖וֹא אֶל מִשְׁפַּחְתִּ֑/י וְ/אִם לֹ֤א יִתְּנוּ֙ לָ֔/ךְ וְ/הָיִ֥יתָ נָקִ֖י מֵ/אָלָתִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/041.yaml
  text: Then you will be free from my oath when you come to my family; and if they do not give to you[a], you will be free from my oath.
translation:
  language: te
  text: అప్పుడు నీవు నా బంధువుల దగ్గరకు వచ్చినప్పుడు నా ప్రమాణం[a] నుంచి విడుదల పొందుతావు; వారు నీకు ఇవ్వకపోతే, నా ప్రమాణం నుంచి విడుదల పొందుతావు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నా శాపం’; హీబ్రూ పదం శాపం లేదా శాపపరిణామం అంతర్లీనంగా ఉన్న ప్రమాణాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּנָּקֶה / נָקִי
  choice: విడుదల పొందుతావు
  rationale: ఇక్కడ నקה పదరూపాలు నైతిక నిర్దోషిత్వాన్ని కాక, ప్రమాణం వల్ల కలిగిన బాధ్యత నుంచి విముక్తిని సూచిస్తున్నాయి. రెండు చోట్లా ఒకే భావాన్ని నిలబెట్టాం.
- source_word: מֵאָלָתִי
  choice: నా ప్రమాణం నుంచి
  rationale: אָלָה పదం శాపపరిణామం కలిగిన ప్రమాణాన్ని సూచించగలదు. ఈ సందర్భంలో సేవకునిపై ఉంచిన ప్రమాణబద్ధ బాధ్యత ప్రధానంగా ఉంది; శాపార్థ ఛాయను పాదసూచికలో ఉంచాం.
- source_word: כִּי
  choice: వచ్చినప్పుడు
  rationale: ఇక్కడ כִּי కాలసంబంధమైన లేదా షరతుతో కూడిన పరిస్థితిని పరిచయం చేస్తుంది. తెలుగు వాక్యసందర్భంలో ‘వచ్చినప్పుడు’ సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: תָבֹא אֶל־מִשְׁפַּחְתִּי
  choice: నా వంశం వారి దగ్గరికి వచ్చినప్పుడు
  rationale: מִשְׁפָּחָה సమీప కుటుంబానికంటే విస్తృతమైన బంధువర్గం లేదా వంశాన్ని సూచిస్తుంది. ‘నా వంశం వారు’ ఆధునిక తెలుగులో సహజంగా, తగిన విస్తృతితో ఉంది.
- source_word: וְאִם לֹא יִתְּנוּ לָךְ
  choice: వారు నీకు ఇవ్వకపోతే
  rationale: హీబ్రూ మూలంలో కర్మ సందర్భం ద్వారా మాత్రమే అర్థమవుతుంది; అది స్పష్టంగా పేర్కొనబడలేదు. మూలంలోని సంక్షిప్తత, అస్పష్టత నిలిచేలా తెలుగులో కూడా కర్మను చేర్చలేదు.
theological_decisions:
- issue: ప్రమాణ సందర్భంలో אָלָה పదానికి అనువాదం
  choice: ప్రమాణం
  alternative: శాపం; శాపపరిణామంతో కూడిన ప్రమాణం
  rationale: కథనంలో అబ్రాహాము సేవకునిపై ఉంచిన ప్రమాణబద్ధ బాధ్యత నుంచి విడుదల ప్రధాన భావం. ‘శాపం’ అని ప్రధాన పాఠ్యంలో పెడితే శిక్షార్థం అతిగా ముందుకు వస్తుంది; అయినా ఆ పదంలోని శాప ఛాయను పాదసూచికలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలిని వాడాం. హీబ్రూ వాక్యంలోని పునరుక్తిని, రెండో భాగంలో చెప్పని కర్మను అలాగే నిలిపాం.
