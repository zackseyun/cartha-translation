revisions:
- from: అప్పుడు నేను తల వంచి యాహ్వేకు సాష్టాంగపడి ఆరాధించాను. నా యజమాని అబ్రాహాము కుమారుని కోసం నా యజమాని సోదరుని కుమార్తెను తీసుకువెళ్లేలా నన్ను నమ్మకమైన మార్గంలో[a] నడిపించిన నా యజమాని అబ్రాహాము దేవుడైన యాహ్వేను స్తుతించాను.
  to: అప్పుడు నేను వంగి యాహ్వేను ఆరాధించాను. నా యజమాని అబ్రాహాము దేవుడైన యాహ్వేను నేను స్తుతించాను; ఆయన తన కుమారుని కోసం నా యజమాని అబ్రాహాము సోదరుని కుమార్తెను తీసుకురావడానికి నన్ను నమ్మకమైన మార్గంలో[a] నడిపించాడు.
  rationale: The revision avoids the over-specific posture implied by “సాష్టాంగపడి,” retains both the physical bowing and worship actions, and clarifies the family relationship and marriage-purpose clause. It retains the draft's defensible rendering of בְּדֶרֶךְ אֱמֶת and preserves the footnote anchor at that phrase.
