  text: וָ/אֶקֹּ֥ד וָֽ/אֶשְׁתַּחֲוֶ֖ה לַ/יהוָ֑ה וָ/אֲבָרֵ֗ךְ אֶת יְהוָה֙ אֱלֹהֵי֙ אֲדֹנִ֣/י אַבְרָהָ֔ם אֲשֶׁ֤ר הִנְחַ֨/נִי֙ בְּ/דֶ֣רֶךְ אֱמֶ֔ת לָ/קַ֛חַת אֶת בַּת אֲחִ֥י אֲדֹנִ֖/י לִ/בְנֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/048.yaml
  text: Then I bowed down and worshiped Yahweh[a], and I blessed Yahweh, the God of my master Abraham, who led me on the true way to take the daughter of my master's brother for his son.
translation:
  language: te
  text: అప్పుడు నేను వంగి యాహ్వేను ఆరాధించాను. నా యజమాని అబ్రాహాము దేవుడైన యాహ్వేను నేను స్తుతించాను; ఆయన తన కుమారుని కోసం నా యజమాని అబ్రాహాము సోదరుని కుమార్తెను తీసుకురావడానికి నన్ను నమ్మకమైన మార్గంలో[a] నడిపించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “సత్యపు మార్గంలో.” ఈ పదబంధానికి “నిజమైన మార్గంలో” లేదా “నమ్మదగిన మార్గంలో” అనే అర్థాలూ ఉండవచ్చు; యాహ్వే నమ్మకంగా నడిపించాడనే భావాన్ని ఇది నొక్కిచెప్పవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶקֹּד
  choice: నేను తల వంచి
  rationale: శరీరాన్ని వంచే భౌతిక చర్యను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; మోకరించడం అని అవసరానికి మించి నిర్దిష్టం చేయదు.
- source_word: וָאֶשְׁתַּחֲוֶה לַיהוָה
  choice: యాహ్వేకు సాష్టాంగపడి ఆరాధించాను
  rationale: దేవుని ఎదుట వినయంతో నేలకు వంగే చర్యనూ, ఆ చర్యలోని ఆరాధన భావాన్నీ రెండింటినీ నిలుపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగు లిపిలో ధ్వన్యంతరీకరించింది.
- source_word: וָאֲבָרֵךְ אֶת יְהוָה
  choice: యాహ్వేను స్తుతించాను
  rationale: దేవుడు కర్మగా ఉన్నప్పుడు ברך అంటే ఆయనను కొనియాడడం లేదా స్తుతించడం. ‘ఆశీర్వదించాను’ కంటే ఇది ఆధునిక తెలుగులో సహజంగా అర్థమవుతుంది.
- source_word: אֱלֹהֵי אֲדֹנִי אַבְרָהָם
  choice: నా యజమాని అబ్రాహాము దేవుడు
  rationale: אֲדֹנִי ఇక్కడ దైవబిరుదు కాదు; సేవకునికి అబ్రాహాముతో ఉన్న యజమాని-సేవక సంబంధాన్ని ‘నా యజమాని’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: הִנְחַנִי
  choice: నన్ను నడిపించిన
  rationale: నחה హిఫీల్ రూపంలోని మార్గనిర్దేశం లేదా నడిపించడం అనే భావాన్ని సహజంగా అందిస్తుంది.
- source_word: בְּדֶרֶךְ אֱמֶת
  choice: నమ్మకమైన మార్గంలో
  rationale: אֱמֶת లోని సత్యం, విశ్వసనీయత, నమ్మకత్వం అనే భావాలను కేవలం దిశాపరమైన ‘సరైన మార్గం’గా కుదించకుండా నిలుపుతుంది.
- source_word: לָקַחַת
  choice: తీసుకువెళ్లేలా
  rationale: వివాహ ఏర్పాటులో కుమార్తెను యజమాని కుమారుని వద్దకు తీసుకువెళ్లే ఉద్దేశాన్ని సందర్భానుగుణంగా స్పష్టం చేస్తుంది.
- source_word: בַּת אֲחִי אֲדֹנִי
  choice: నా యజమాని సోదరుని కుమార్తెను
  rationale: హీబ్రూ బంధుత్వ నిర్మాణాన్ని దాని సాధారణ అర్థంలో నేరుగా నిలుపుతుంది; వంశ సంబంధాన్ని వివరణాత్మకంగా మార్చదు.
- source_word: לִבְנוֹ
  choice: నా యజమాని అబ్రాహాము కుమారుని కోసం
  rationale: సర్వనామం ఎవరిని సూచిస్తుందో తెలుగులో స్పష్టత కోసం అబ్రాహామును పునరుద్ఘాటిస్తూ, ‘అతని కుమారుని కోసం’ అనే అర్థాన్ని కాపాడుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమే ఉంది. అందువల్ల దానిని బిరుదైన ‘ప్రభువు’తో భర్తీ చేయకుండా, ‘Yahweh’ ఉచ్చారణకు అనుగుణంగా ‘యాహ్వే’ అని ధ్వన్యంతరీకరించబడింది.
- issue: בְּדֶרֶךְ אֱמֶת లోని אֱמֶת భావం
  choice: నమ్మకమైన మార్గంలో
  alternative: సరైన మార్గంలో / సత్యపు మార్గంలో
  rationale: ఈ పదబంధం గమ్యానికి సరైన దారిని మాత్రమే కాక, దేవుని నమ్మదగిన లేదా విశ్వసనీయమైన నడిపింపును కూడా సూచించగలదు. ప్రధాన పాఠం ఆ భావతీవ్రతను నిలుపుతుంది; పాదసూచిక నిజమైన/సత్యమైన మార్గం అనే ప్రత్యామ్నాయాన్ని తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. పొడవైన హీబ్రూ వాక్యాన్ని తెలుగులో సహజ పఠనానికి రెండు వాక్యాలుగా విభజించినా, చర్యల క్రమం మరియు కారణ సంబంధం నిలుపబడ్డాయి. [a] గుర్తు సంబంధిత ‘నమ్మకమైన మార్గంలో’ పదబంధం దగ్గరే ఉంచబడింది.
