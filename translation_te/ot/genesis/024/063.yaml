translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే సహజమైన, గౌరవప్రదమైన కథన శైలి. అరుదైన హీబ్రూ క్రియలోని నిజమైన అర్థసందిగ్ధతను [a] పాదసూచికలో కాపాడాం.
