  naturalness: The Telugu is clear, modern, and appropriately narrative. “కళ్లెత్తి చూశాడు” is a natural Telugu idiom that better preserves the two sequential actions without introducing a temporal relation absent from the source.
  terminology: “ఇస్సాకు,” “ధ్యానించడానికి,” “పొలంలో,” “ఇదిగో,” and “ఒంటెలు వస్తున్నాయి” are suitable. The footnote appropriately retains the lexical uncertainty of the rare Hebrew verb and does not overstate a prayer-related interpretation.
  issues:
