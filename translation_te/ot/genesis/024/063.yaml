  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֵּצֵ֥א יִצְחָ֛ק לָ/שׂ֥וּחַ בַּ/שָּׂדֶ֖ה לִ/פְנ֣וֹת עָ֑רֶב וַ/יִּשָּׂ֤א עֵינָי/ו֙ וַ/יַּ֔רְא וְ/הִנֵּ֥ה גְמַלִּ֖ים בָּאִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/063.yaml
  text: And Isaac went out to meditate in the field toward evening[a], and he lifted up his eyes and looked, and behold, camels were coming.
translation:
  language: te
  text: ఇస్సాకు సాయంకాలం సమీపిస్తుండగా పొలంలో ధ్యానించడానికి[a] బయటికి వెళ్లాడు. అతడు కళ్లెత్తి చూశాడు; ఇదిగో, ఒంటెలు వస్తున్నాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘నడవడానికి,’ ‘ఆలోచనలో మునిగిపోవడానికి,’ ‘మాట్లాడడానికి,’ లేదా బహుశా ‘ప్రార్థించడానికి.’ ఇక్కడున్న హీబ్రూ క్రియ అరుదైనది; ఈ సందర్భంలో దాని ఖచ్చిత భావం అనిశ్చితం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: బయటికి వెళ్లాడు
  rationale: יצא అనే క్రియ భౌతికంగా బయటికి వెళ్లడాన్ని సూచిస్తుంది; తెలుగు కథన శైలిలో ఇది సహజమైన ప్రయోగం.
- source_word: יִצְחָק
  choice: ఇస్సాకు
  rationale: తెలుగు బైబిలు సంప్రదాయంలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: לָשׂוּחַ
  choice: ధ్యానించడానికి
  rationale: అరుదైన שׂוח క్రియ యొక్క ఖచ్చిత భావం వివాదాస్పదం. సందర్భంలోని ఏకాంత, ప్రశాంత కార్యాన్ని ‘ధ్యానించడానికి’ సహజంగా తెలియజేస్తుంది; అనిశ్చితిని పాదసూచికలో నిలిపాం.
- source_word: בַּשָּׂדֶה
  choice: పొలంలో
  rationale: שׂדה ఇక్కడ పొలం లేదా బహిరంగ గ్రామీణ ప్రదేశాన్ని సూచిస్తుంది; ‘పొలంలో’ ప్రత్యక్షంగా, సహజంగా ఉంది.
- source_word: לִפְנוֹת עָרֶב
  choice: సాయంకాలం సమీపిస్తుండగా
  rationale: అక్షరార్థంగా సాయంకాలం వైపు తిరిగే సమయాన్ని సూచించే హీబ్రూ కాలవాచకాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: וַיִּשָּׂא עֵינָיו וַיַּרְא
  choice: అతడు తలెత్తి చూసినప్పుడు
  rationale: ‘కళ్లను ఎత్తి చూశాడు’ అనే హీబ్రూ చిత్రాన్ని తెలుగులో సహజమైన ‘తలెత్తి చూశాడు’తో అందిస్తూ, రెండు క్రియల దృష్టి క్రమాన్ని ఒక ప్రవాహవంతమైన వాక్యంగా వ్యక్తపరుస్తుంది.
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: అకస్మాత్తుగా కనిపించిన దృశ్యంపై శ్రద్ధను నిలిపే హీబ్రూ సూచనార్థక అవ్యయపు కథన సజీవతను కాపాడుతుంది.
- source_word: גְמַלִּים בָּאִים
  choice: ఒంటెలు వస్తున్నాయి
  rationale: בָּאִים అనే కృదంతం కొనసాగుతున్న సమీప గమనాన్ని సూచిస్తుంది; తెలుగు వర్తమాన ప్రగతిశీల రూపం దృశ్య తక్షణత్వాన్ని నిలుపుతుంది.
