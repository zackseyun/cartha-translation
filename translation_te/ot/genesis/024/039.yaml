source:
  edition: WLC
  text: וָ/אֹמַ֖ר אֶל אֲדֹנִ֑/י אֻלַ֛י לֹא תֵלֵ֥ךְ הָ/אִשָּׁ֖ה אַחֲרָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/039.yaml
  text: And I said to my master[a], ‘Perhaps the woman will not follow me.’
translation:
  language: te
  text: అప్పుడు నేను నా యజమానితో, “ఆ స్త్రీ నా వెంట రాకపోవచ్చేమో” అన్నాను.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאֹמַר
  choice: అప్పుడు నేను ... అన్నాను
  rationale: వయ్యిక్తోల్ రూపం కథనాన్ని ముందుకు నడిపిస్తుంది. ‘అప్పుడు’ వరుస సంఘటనను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; ‘అన్నాను’ మూలంలోని సాధారణ వాక్కు క్రియను నిలుపుతుంది.
- source_word: אֶל אֲדֹנִי
  choice: నా యజమానితో
  rationale: ఇక్కడ אָדוֹן దేవునికి కాదు, సేవకుని మానవ అధిపతియైన అబ్రాహాముకు సూచిస్తుంది. ‘నా యజమాని’ ఆ సామాజిక సంబంధాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: אֻלַי
  choice: రాకపోవచ్చేమో
  rationale: אֻלַי అనిశ్చితి లేదా సంభావ్యతను వ్యక్తం చేస్తుంది. తెలుగులో ‘-వచ్చేమో’ దీనిని సహజంగా తెలియజేస్తుంది.
- source_word: לֹא תֵלֵךְ
  choice: రాకపోవచ్చేమో
  rationale: అసంపూర్ణ క్రియారూపం ఈ నివేదిత మాటలో భవిష్యత్ సంభావ్యతను సూచిస్తుంది. గమ్యస్థానం వక్త ఉన్న దిశ కావడంతో తెలుగులో ‘రాక’ సహజం.
- source_word: הָאִשָּׁה
  choice: ఆ స్త్రీ
  rationale: మూలపదం సాధారణంగా ‘స్త్రీ’ అనే అర్థమే ఇస్తుంది. సందర్భం భావి వధువుకు సంబంధించినదైనా, ‘భార్య’ లేదా ‘యువతి’ అని అదనంగా నిర్దిష్టం చేయలేదు.
- source_word: אַחֲרָי
  choice: నా వెంట
  rationale: ‘నా తరువాత/వెనుక’ అనే మూల భావం, הלךతో కలిసినప్పుడు ఒకరితో వెళ్లడాన్ని సూచిస్తుంది. ‘నా వెంట’ అర్థాన్నీ సహజ తెలుగు నుడికారాన్నీ కాపాడుతుంది.
theological_decisions: []
translation_notes:
  register: సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే ఆధునిక ప్రామాణిక తెలుగు వాడబడింది. మాటలోని అనిశ్చితిని ప్రశ్నగా లేదా షరతుగా మార్చకుండా ‘రాకపోవచ్చేమో’ ద్వారా నిలుపుకున్నాం.
