lexical_decisions:
- source_word: כִּי
  choice: కానీ
  rationale: మునుపటి వచనంలోని కనానీయులలో నుంచి భార్యను తీసుకోకూడదనే నిషేధానికి విరుద్ధంగా ఈ ఆదేశాన్ని ప్రవేశపెడుతోంది.
- source_word: אֶל אַרְצִי
  choice: నా దేశానికి
  rationale: అబ్రాహాము స్వదేశ ప్రాంతాన్ని సహజమైన ఆధునిక తెలుగులో సూచిస్తుంది; ఆధునిక జాతీయరాజ్య భావాన్ని తప్పనిసరిగా మోపదు.
- source_word: וְאֶל מוֹלַדְתִּי
  choice: నా బంధువుల దగ్గరకు
  rationale: పదం జన్మస్థలాన్నీ బంధువర్గాన్నీ సూచించగలదు. భార్యను తన ప్రజలలో నుంచి తీసుకురావాలనే సందర్భంలో బంధుత్వ భావం ప్రధానంగా కనిపిస్తుంది; స్థలార్థం పాదసూచికలో నిలుపబడింది.
- source_word: תֵּלֵךְ
  choice: వెళ్లి
  rationale: తదనంతర ప్రధాన ఆదేశంతో కలిపి తెలుగులో సహజమైన ఆజ్ఞార్థక నిర్మాణంగా పనిచేస్తుంది.
- source_word: וְלָקַחְתָּ
  choice: తీసుకురావాలి
  rationale: లక్ష్యస్థానానికి వెళ్లి ఇస్సాకుకు భార్యను సంపాదించి రావాలనే సందర్భార్థాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: אִשָּׁה
  choice: భార్యను
  rationale: వివాహ సందర్భంలో אִשָּׁה ఇక్కడ ‘స్త్రీ’ కంటే ‘భార్య’ అనే అర్థాన్నే ఇస్తుంది.
- source_word: לִבְנִי לְיִצְחָק
  choice: నా కుమారుడైన ఇస్సాకుకు
  rationale: పునరుక్త לְ నిర్మాణాన్ని సహజ తెలుగు సమానాధికార నిర్మాణంతో వ్యక్తం చేస్తూ, ఇస్సాకే చెప్పబడిన కుమారుడని స్పష్టం చేస్తుంది.
