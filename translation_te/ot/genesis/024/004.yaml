translation:
  language: te
  text: కానీ నీవు నా దేశానికి, నా బంధువుల దగ్గరకు వెళ్లి, నా కుమారుడైన ఇస్సాకుకు భార్యను తీసుకోవాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
