    text: “నా జన్మస్థలానికి” అని కూడా అనువదించవచ్చు. హీబ్రూ పదం పుట్టిన ప్రదేశాన్నిగానీ బంధువర్గాన్నిగానీ సూచించగలదు; ఇక్కడి సందర్భం బంధువులనే సూచిస్తున్నట్లు కనిపిస్తుంది.
