id: GEN.24.31
reference: Genesis 24:31
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר בּ֖וֹא בְּר֣וּךְ יְהוָ֑ה לָ֤/מָּה תַעֲמֹד֙ בַּ/ח֔וּץ וְ/אָנֹכִי֙ פִּנִּ֣יתִי הַ/בַּ֔יִת וּ/מָק֖וֹם לַ/גְּמַלִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/031.yaml
  text: And he said[a], “Come in, blessed of Yahweh. Why do you stand outside? I have prepared the house, and a place for the camels.”
translation:
  language: te
  text: అతడు, “యాహ్వే ఆశీర్వదించినవాడా,[a] లోపలికి రా. నువ్వు బయట ఎందుకు నిలబడి ఉన్నావు? నేను ఇంటినీ, ఒంటెలకు చోటునూ సిద్ధం చేశాను” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “యాహ్వేచేత ఆశీర్వదించబడినవాడా” లేదా “యాహ్వే ఆశీర్వాదం పొందినవాడా.”
    reason: మూలంలోని בְּרוּךְ יְהוָה సంబోధనను, ఆశీర్వాదానికి యాహ్వేతో ఉన్న సంబంధాన్ని తెలుగులో ఒకటి కంటే ఎక్కువ సహజ విధాలుగా వ్యక్తం చేయవచ్చు.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అతడు … అన్నాడు
  rationale: హీబ్రూ కథన ప్రవాహాన్ని సహజమైన తెలుగు ప్రత్యక్ష వాక్య నిర్మాణంలో వ్యక్తం చేస్తుంది.
- source_word: בּוֹא
  choice: లోపలికి రా
  rationale: ఆతిథ్య సందర్భంలో ఈ ఆజ్ఞ ఇంటిలోకి ప్రవేశించమనే భావాన్ని సూచిస్తుంది; తెలుగులో ‘లోపలికి రా’ సహజంగా ఉంది.
- source_word: בְּרוּךְ יְהוָה
  choice: యాహ్వే ఆశీర్వదించినవాడా
  rationale: కర్మణి కృదంతం మరియు దైవనామం కలిసి ఇక్కడ సంబోధనగా పనిచేస్తున్నాయి. ఈ రూపం ఆధునిక తెలుగులో సహజంగా ఉండి మూలంలోని ఆశీర్వాద భావాన్ని నిలుపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన టెట్రాగ్రామటన్‌ను బిరుదుతో భర్తీ చేయకుండా వ్యక్తిగత నామంగా లిప్యంతరీకరించింది.
- source_word: לָמָּה תַעֲמֹד בַּחוּץ
  choice: నువ్వు బయట ఎందుకు నిలబడ్డావు?
  rationale: עמד యొక్క నిలబడటం అనే భావాన్నీ, בחוץ యొక్క బయట అనే స్థలార్థాన్నీ సహజమైన తెలుగు ప్రశ్నగా వ్యక్తం చేస్తుంది.
- source_word: פִּנִּיתִי
  choice: సిద్ధం చేశాను
  rationale: ఈ క్రియ అక్షరార్థంగా ఖాళీ చేయడం లేదా చోటు కల్పించడం అని సూచించినా, ఆతిథ్య సందర్భంలో దాని ఫలితార్థమైన ‘సిద్ధం చేయడం’ సహజంగా సరిపోతుంది.
- source_word: הַבַּיִת
  choice: ఇంటిని
  rationale: నివాస స్థలాన్ని సూచించే ביתకు నేరమైన, సాధారణ తెలుగు సమానార్థకం.
- source_word: וּמָקוֹם לַגְּמַלִּים
  choice: ఒంటెలకు చోటును
  rationale: మూలంలోని సరళమైన ‘ఒంటెల కోసం స్థలం’ అనే భావాన్ని, అది కట్టివేయడానికా బస చేయించడానికా అని అదనంగా నిర్ణయించకుండా నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה దైవనామ అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. అందువల్ల దానిని బిరుదుగా మార్చకుండా, సాధారణంగా పునర్నిర్మించిన ఉచ్చారణకు అనుగుణంగా ‘యాహ్వే’ అని ఇచ్చాం.
- issue: בְּרוּךְ יְהוָהలో ఆశీర్వాద సంబంధం
  choice: యాహ్వే ఆశీర్వదించినవాడా
  alternative: యాహ్వేకు ఆశీర్వదించబడినవాడా; యాహ్వే ఆశీర్వాదం పొందినవాడా
  rationale: ఈ పదబంధం సంబోధనగా పనిచేస్తుంది; అయితే దైవనామంతో కృదంతానికి ఉన్న సంబంధాన్ని తెలుగులో పలురకాలుగా వ్యక్తం చేయవచ్చు. ప్రధాన పాఠంలో సహజమైన కర్తృవాచక రూపాన్ని ఎంచుకుని, ప్రత్యామ్నాయాలను పాదటిప్పణిలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. సంభాషణలో సందర్భానికి తగిన ఏకవచన ‘నువ్వు’ వాడబడింది; అతి ప్రాచీన పదజాలం నివారించబడింది.
