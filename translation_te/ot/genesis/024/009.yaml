language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּ֤שֶׂם הָ/עֶ֨בֶד֙ אֶת יָד֔/וֹ תַּ֛חַת יֶ֥רֶךְ אַבְרָהָ֖ם אֲדֹנָ֑י/ו וַ/יִּשָּׁ֣בַֽע ל֔/וֹ עַל הַ/דָּבָ֖ר הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/009.yaml
  text: So the servant put his hand under the thigh of Abraham his master and swore to him concerning this matter[a].
translation:
  language: te
  text: అప్పుడు ఆ సేవకుడు తన యజమాని అబ్రాహాము తొడ కింద తన చేయి ఉంచి, ఈ విషయం గురించి అతనికి ప్రమాణం చేశాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘తొడ కింద’ అనేది గంభీరమైన ప్రమాణం చేసేటప్పుడు పాటించిన ఒక సంజ్ఞను తెలిపే హీబ్రూ పదబంధానికి యథార్థ అనువాదం. ఇది నడుము భాగంతో లేదా నిబంధనకు సంబంధించిన సంతానంతో ప్రతీకాత్మకంగా ముడిపడి ఉందని కొందరు భావిస్తారు.
    reason: cultural_note
lexical_decisions:
- source_word: הָעֶבֶד
  choice: ఆ సేవకుడు
  rationale: עֶבֶד అనే పదానికి సేవకుడు లేదా బానిస అనే అర్థాలు ఉండవచ్చు. ఈ సందర్భంలో అబ్రాహాము ఇంటిలో అతని బాధ్యతాయుతమైన పాత్ర ప్రధానంగా కనిపిస్తున్నందున, ఆధునిక తెలుగులో సహజమైన ‘సేవకుడు’ ఎంచుకున్నాం.
- source_word: וַיָּשֶׂם ... אֶת יָדוֹ
  choice: తన చెయ్యి పెట్టి
  rationale: שׂוּם అంటే పెట్టడం లేదా ఉంచడం. హీబ్రూ క్రియను నేరుగా, సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: תַּחַת יֶרֶךְ
  choice: తొడ కింద
  rationale: יָרֵךְ యొక్క ప్రత్యక్ష అర్థం ‘తొడ’. ప్రమాణ సంజ్ఞకు ఉండవచ్చని భావించే ప్రతీకాత్మక అర్థాన్ని ప్రధాన పాఠ్యంలో చేర్చకుండా మూలంలోని శరీరసంబంధ పదప్రయోగాన్ని నిలిపాం.
- source_word: אַבְרָהָם אֲדֹנָיו
  choice: తన యజమాని అబ్రాహాము
  rationale: మానవ సామాజిక సందర్భంలో אֲדוֹן అధికారమున్న ఇంటి యజమానిని సూచిస్తుంది. ‘ప్రభువు’ అనడం దైవసంబంధ భావాన్ని కలిగించవచ్చు; కాబట్టి ‘యజమాని’ స్పష్టంగా సరిపోతుంది.
- source_word: וַיִּשָּׁבַע לוֹ
  choice: అతనికి ప్రమాణం చేశాడు
  rationale: నిఫాల్ రూపంలోని שׁבע అంటే ప్రమాణం చేయడం. לוֹ సూచించే వ్యక్తిగత దిశను ‘అతనికి’ నిలుపుతుంది.
- source_word: עַל הַדָּבָר הַזֶּה
  choice: ఈ విషయం గురించి
  rationale: דָּבָר ఇక్కడ అబ్రాహాము అప్పగించిన నిర్దిష్ట బాధ్యత లేదా విషయాన్ని సూచిస్తుంది. ‘ఈ విషయం గురించి’ ఆధునిక తెలుగులో స్పష్టంగా, సహజంగా ఉంది.
theological_decisions:
- issue: ప్రమాణ సంజ్ఞను యథార్థంగా అనువదించాలా, దాని ప్రతీకాత్మక భావాన్ని ప్రధాన పాఠ్యంలో వివరించాలా
  choice: ‘తొడ కింద’ అని యథార్థంగా అనువదించి, సాధ్యమైన ప్రతీకాత్మక అర్థాన్ని పాదసూచికకు పరిమితం చేశాం.
  alternative: జననేంద్రియాలు, నడుము భాగం లేదా నిబంధనసంబంధ సంతానంతో ముడిపడిన సంజ్ఞగా వ్యాఖ్యానిస్తూ అనువదించడం.
  rationale: హీబ్రూ పాఠ్యం శారీరక చర్యను చెబుతుంది గాని దాని ప్రతీకాత్మకతను స్పష్టంగా వివరించదు. యథార్థ పదప్రయోగాన్ని నిలపడం మూలానికి పారదర్శకంగా ఉండి, ఒక ప్రత్యేక వ్యాఖ్యానాన్ని పాఠ్యంలోకి చొప్పించకుండా ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. మూలంలోని చర్యల క్రమం, సేవకుడు–యజమాని సంబంధం, ప్రమాణపు గంభీరత నిలుపబడ్డాయి.
