  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే కథనశైలి వాడబడింది. ప్రత్యక్ష సంభాషణలో సహజమైన ‘నీళ్లు’ రూపం ఎంచుకోబడింది; మర్యాదను נָא ప్రకారం ‘దయచేసి’తో నిలుపుకున్నాం.
