base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/017.yaml
  text: The servant ran to meet her and said[a], “Please let me drink a little water from your jar.”
translation:
  language: te
  text: అప్పుడు ఆ సేవకుడు ఆమెను కలవడానికి పరుగెత్తి వెళ్లి, “దయచేసి, నీ కుండలో నుండి కొంచెం నీళ్లు నాకు తాగనివ్వు[a]” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నీ కుండలో నుండి కొంచెం నీళ్లు నాకు తాగడానికి ఇవ్వు.’ హీబ్రూ ఆజ్ఞారూపాన్ని ‘నాకు తాగనివ్వు’ అని గానీ, ‘నాకు తాగడానికి ఇవ్వు’ అని గానీ అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּרָץ
  choice: పరుగెత్తి వెళ్లి
  rationale: רוץ అనే క్రియ ఇక్కడ కథనంలో నేరుగా పరుగెత్తడాన్ని సూచిస్తుంది; తెలుగు సహజ కథనశైలిలో ‘పరుగెత్తి వెళ్లి’ చర్యనూ దిశనూ స్పష్టంగా తెలియజేస్తుంది.
- source_word: הָעֶבֶד
  choice: ఆ సేవకుడు
  rationale: עֶבֶד సందర్భానుసారం సేవకుడు లేదా దాసుడు అని అర్థమవుతుంది. ఇక్కడ అబ్రాహాము తరఫున బాధ్యతతో వ్యవహరించే గృహసేవకుడు ఉద్దేశించబడినందున ‘సేవకుడు’ సందర్భోచితం.
- source_word: לִקְרָאתָהּ
  choice: ఆమెను కలుసుకోవడానికి
  rationale: לִקְרַאת్ నిర్మాణం ఒకరి వైపు వెళ్లి వారిని కలుసుకోవడాన్ని సూచిస్తుంది; ఈ అనువాదం ఉద్దేశపూర్వక కదలికను సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וַיֹּאמֶר
  choice: అని అడిగాడు
  rationale: మూలంలో సాధారణంగా ‘అన్నాడు’ ఉన్నప్పటికీ, తరువాతి మాట మర్యాదపూర్వక అభ్యర్థన కావడంతో తెలుగులో ‘అడిగాడు’ సంభాషణ స్వభావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: הַגְמִיאִינִי
  choice: నాకు తాగనివ్వు
  rationale: גמא హిఫిల్ ఆజ్ఞారూపం మొదటి పురుష ఏకవచన ప్రత్యయంతో ‘నన్ను తాగనివ్వు’ లేదా ‘నాకు తాగడానికి ఇవ్వు’ అనే భావాన్ని కలిగిస్తుంది. ‘నాకు తాగనివ్వు’ మూల నిర్మాణానికి దగ్గరగా, సహజంగా ఉంది.
- source_word: נָא
  choice: దయచేసి
  rationale: נָא అభ్యర్థనను మర్యాదపూర్వకంగా చేసే కణం; ఆధునిక తెలుగులో ‘దయచేసి’ సరైన సమానార్థకం.
- source_word: מְעַט מַיִם
  choice: నీళ్లు కొంచెం
  rationale: מְעַט పరిమితమైన కొద్దిపాటి పరిమాణాన్ని సూచిస్తుంది. సాధారణ సంభాషణలో ‘నీళ్లు కొంచెం’ సహజంగా ఉండి అభ్యర్థనలోని మితత్వాన్ని నిలుపుతుంది.
- source_word: מִכַּדֵּךְ
  choice: నీ కుండలోని
  rationale: כַּד నీరు తెచ్చే కుండ లేదా బానను సూచిస్తుంది; స్త్రీలింగ ఏకవచన ప్రత్యయం ‘నీ’గా నిలుపబడింది. ‘కుండలోని’ నీరు ఎక్కడి నుండి కావాలో స్పష్టంగా తెలుపుతుంది.
