source:
  edition: WLC
  text: וַ/יּוֹצֵ֨א הָ/עֶ֜בֶד כְּלֵי כֶ֨סֶף וּ/כְלֵ֤י זָהָב֙ וּ/בְגָדִ֔ים וַ/יִּתֵּ֖ן לְ/רִבְקָ֑ה וּ/מִ֨גְדָּנֹ֔ת נָתַ֥ן לְ/אָחִ֖י/הָ וּ/לְ/אִמָּֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/053.yaml
  text: Then the servant brought out articles of silver and articles of gold and garments[a], and gave them to Rebekah; he also gave choice gifts to her brother and to her mother.
translation:
  language: te
  text: అప్పుడు ఆ సేవకుడు వెండి వస్తువులను, బంగారు వస్తువులను, వస్త్రాలను బయటకు తీసి రిబ్కాకు ఇచ్చాడు. ఆమె సోదరునికి, ఆమె తల్లికి కూడా శ్రేష్ఠమైన కానుకలు[a] ఇచ్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఎంపికైన లేదా విలువైన కానుకలు’; מִגְדָּנוֹת అనే పదం ప్రత్యేకమైన లేదా విలువైన బహుమతులను సూచించవచ్చు; కొన్ని సందర్భాల్లో అది రుచికరమైన ఆహార పదార్థాలను కూడా సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצֵא
  choice: బయటకు తీసి
  rationale: హిఫిల్ రూపంలోని יצא ఇక్కడ ‘బయటకు తీయడం’ అనే స్పష్టమైన చర్యను సూచిస్తుంది; ఆధునిక తెలుగులో ఇది సహజంగా ఉంటుంది.
- source_word: הָעֶבֶד
  choice: ఆ సేవకుడు
  rationale: עֶבֶד అనే పదానికి ‘సేవకుడు’ లేదా ‘బానిస’ అనే అర్థాలు ఉండవచ్చు. ఈ కథన సందర్భంలో గృహ ప్రతినిధిగా వ్యవహరించే వ్యక్తికి ‘సేవకుడు’ సహజమైన, సందర్భోచితమైన పదం.
- source_word: כְּלֵי כֶסֶף וּכְלֵי זָהָב
  choice: వెండి వస్తువులను, బంగారు వస్తువులను
  rationale: כְּלִי అనేది పాత్రలకే పరిమితం కాకుండా వస్తువులు, సామగ్రి వంటి విస్తృత అర్థం గల పదం; ఇక్కడ కానుకలుగా ఇచ్చే విలువైన వస్తువులను సూచించడానికి ‘వస్తువులు’ సరిపోతుంది.
- source_word: וּבְגָדִים
  choice: వస్త్రాలను
  rationale: בְּגָדִים అంటే దుస్తులు లేదా వస్త్రాలు. గౌరవప్రదమైన కథన శైలికి ‘వస్త్రాలు’ తగినది.
- source_word: וַיִּתֵּן לְרִבְקָה
  choice: రిబ్కాకు ఇచ్చాడు
  rationale: ముందు పేర్కొన్న వెండి, బంగారు వస్తువులు, వస్త్రాలు ఇచ్చినవిగా తెలుగు వాక్య నిర్మాణంలో సహజంగానే అర్థమవుతాయి; అదనపు సర్వనామం అవసరం లేదు.
- source_word: וּמִגְדָּנֹת
  choice: శ్రేష్ఠమైన కానుకలు
  rationale: מִגְדָּנוֹת ప్రధానంగా విశేషమైన లేదా విలువైన బహుమతులను సూచిస్తుంది. ‘శ్రేష్ఠమైన కానుకలు’ వాటి ఎంపికైన, ప్రశస్తమైన స్వభావాన్ని తెలియజేస్తూ కేవలం ధరకే పరిమితం చేయదు.
- source_word: לְאָחִיהָ וּלְאִמָּהּ
  choice: ఆమె సోదరునికి, ఆమె తల్లికి
  rationale: హీబ్రూలోని రెండు సంబంధపదాలకూ ఉన్న స్త్రీలింగ ఏకవచన స్వామ్యప్రత్యయాన్ని స్పష్టంగా ప్రతిబింబిస్తుంది.
