id: GEN.24.35
reference: Genesis 24:35
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יהוָ֞ה בֵּרַ֧ךְ אֶת אֲדֹנִ֛/י מְאֹ֖ד וַ/יִּגְדָּ֑ל וַ/יִּתֶּן ל֞/וֹ צֹ֤אן וּ/בָקָר֙ וְ/כֶ֣סֶף וְ/זָהָ֔ב וַ/עֲבָדִם֙ וּ/שְׁפָחֹ֔ת וּ/גְמַלִּ֖ים וַ/חֲמֹרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/035.yaml
  text: And Yahweh has greatly blessed my master[a], and he has become great. He has given him flocks and herds, silver and gold, male servants and female servants, camels and donkeys.
translation:
  language: te
  text: యాహ్వే నా యజమానిని ఎంతో ఆశీర్వదించాడు; ఆయన గొప్పవాడయ్యాడు. యాహ్వే ఆయనకు గొర్రెల, మేకల మందలను, గొడ్ల మందలను, వెండిని, బంగారాన్ని, పురుష సేవకులను, స్త్రీ సేవకులను[a], ఒంటెలను, గాడిదలను ఇచ్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పురుష బానిసలను, స్త్రీ బానిసలను.’ హీబ్రూ పదాలు సందర్భాన్ని బట్టి ఇంటి సేవకులను లేదా బానిసలను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: יהוה
  choice: యాహ్వే
  rationale: దైవనామాన్ని బిరుదుగా మార్చకుండా, హీబ్రూ చతురక్షర నామానికి సాధారణ పండిత లిప్యంతరీకరణను తెలుగులో ప్రతిబింబిస్తుంది.
- source_word: בֵּרַךְ ... מְאֹד
  choice: ఎంతో ఆశీర్వదించాడు
  rationale: క్రియతో పాటు తీవ్రతను తెలిపే מְאֹד భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: אֲדֹנִי
  choice: నా యజమాని
  rationale: ఇక్కడ ఇది దేవుని బిరుదు కాదు; సేవకుడు అబ్రాహాముతో కలిగిన సామాజిక సంబంధాన్ని సూచిస్తుంది.
- source_word: וַיִּגְדָּל
  choice: గొప్పవాడయ్యాడు
  rationale: సంపదకు మాత్రమే పరిమితం చేయకుండా, హోదా మరియు సమృద్ధి రెండింటినీ కలిగి ఉండగల మూలపదపు విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: צֹאן
  choice: గొర్రెలు-మేకల మందలు
  rationale: ఈ సమూహవాచక పదం సాధారణంగా గొర్రెలు, మేకలు వంటి చిన్న పశువులను సూచిస్తుంది; కేవలం ‘మందలు’ కంటే స్పష్టత ఇస్తుంది.
- source_word: בָּקָר
  choice: పశువుల మందలు
  rationale: గోవర్గపు పెద్ద పశువులను సూచించే సమూహవాచక భావాన్ని సహజంగా అందిస్తుంది.
- source_word: כֶּסֶף וְזָהָב
  choice: వెండి, బంగారం
  rationale: మూలంలోని విలువైన లోహాల concrete భావాన్ని అలాగే ఉంచుతుంది.
- source_word: עֲבָדִם וּשְׁפָחֹת
  choice: దాసులు, దాసీలు
  rationale: పురుషులు మరియు స్త్రీల భేదాన్ని నిలుపుతూ, గృహసేవకులు లేదా బానిసలుగా అర్థమయ్యే హీబ్రూ పదాల సామాజిక విస్తృతిని తెలుగులో కొంతవరకు కాపాడుతుంది.
- source_word: גְּמַלִּים וַחֲמֹרִים
  choice: ఒంటెలు, గాడిదలు
  rationale: రెండు జంతు పదాలకు నేరుగా, సహజంగా సరిపడే తెలుగు పదాలు.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో ప్రత్యేక దైవనామమే ఉంది. దాన్ని సాధారణ బిరుదైన ‘ప్రభువు’గా మార్చకుండా, ‘Yahweh’ ఉచ్చారణను తెలుగులో లిప్యంతరీకరించడం మూలభేదాన్ని నిలుపుతుంది.
- issue: עֲבָדִם / שְׁפָחֹת యొక్క సామాజిక స్థితి
  choice: దాసులు, దాసీలు
  alternative: సేవకులు, సేవకురాళ్లు / బానిస పురుషులు, బానిస స్త్రీలు
  rationale: ఈ పదాలు సందర్భానుసారం ఇంటి సేవకులను గానీ బానిసలుగా ఉంచబడిన వారిని గానీ సూచించగలవు. ప్రధాన పాఠంలో సంక్షిప్తమైన సంప్రదాయ పదజోడును ఉంచి, మరింత స్పష్టమైన ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో తెలియజేయడం మూలంలోని అనిశ్చితిని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. సర్వనామాల వల్ల కర్తలో సందిగ్ధత రాకుండా రెండో వాక్యంలో ‘నా యజమాని’, మూడో వాక్యంలో ‘యాహ్వే’ అని స్పష్టంగా పునరుక్తి చేయబడింది.
