    text: లేదా, ‘పురుష బానిసలను, స్త్రీ బానిసలను.’ హీబ్రూ పదాలు సందర్భాన్ని బట్టి ఇంటి సేవకులను లేదా బానిసలను సూచించవచ్చు.
    reason: lexical_alternative
