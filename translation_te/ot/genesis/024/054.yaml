  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּאכְל֣וּ וַ/יִּשְׁתּ֗וּ ה֛וּא וְ/הָ/אֲנָשִׁ֥ים אֲשֶׁר עִמּ֖/וֹ וַ/יָּלִ֑ינוּ וַ/יָּק֣וּמוּ בַ/בֹּ֔קֶר וַ/יֹּ֖אמֶר שַׁלְּחֻ֥/נִי לַֽ/אדֹנִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/054.yaml
  text: Then he and the men who were with him ate and drank[a], and they spent the night there. When they arose in the morning, he said, “Send me away to my master.”
translation:
  language: te
  text: తర్వాత అతడూ అతనితో ఉన్న మనుషులూ తిని తాగి, ఆ రాత్రి అక్కడే గడిపారు. ఉదయం వారు లేచినప్పుడు అతడు, “నా యజమాని[a] దగ్గరికి నన్ను పంపించండి” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నా ప్రభువు.” ఇక్కడ హీబ్రూ పదం אֲדֹנִי అబ్రాహామును, అంటే ఆ సేవకుని మానవ యజమానిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאכְלוּ וַיִּשְׁתּוּ
  choice: తిని తాగి
  rationale: రెండు సరళ కథన క్రియల సంక్షిప్త వరుసను సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: הוּא וְהָאֲנָשִׁים אֲשֶׁר עִמּוֹ
  choice: అతడూ అతనితో ఉన్న మనుషులూ
  rationale: హీబ్రూ వాక్యంలో స్పష్టంగా ఉన్న అతణ్ణీ అతనితో వచ్చిన పురుషులనూ కర్తలుగా ఉంచుతుంది.
- source_word: וַיָּלִינוּ
  choice: ఆ రాత్రి అక్కడే గడిపారు
  rationale: לון/לין అనే క్రియలోని రాత్రిపూట బసచేసిన భావాన్ని సహజంగా తెలియజేస్తుంది; సందర్భంలోని స్థలాన్ని ‘అక్కడే’ స్పష్టం చేస్తుంది.
- source_word: וַיָּקֻמוּ בַבֹּקֶר
  choice: ఉదయం వారు లేచినప్పుడు
  rationale: కథన క్రమాన్ని తెలుగులో సహజమైన కాలసంబంధ ఉపవాక్యంగా అందిస్తుంది.
- source_word: שַׁלְּחֻנִי
  choice: నన్ను పంపించండి
  rationale: బయలుదేరేందుకు అనుమతించి పంపివేయాలనే ఆజ్ఞార్థక భావాన్ని గౌరవపూర్వక/బహువచన తెలుగు రూపంలో తెలియజేస్తుంది.
- source_word: לַאדֹנִי
  choice: నా యజమాని దగ్గరికి
  rationale: ఇక్కడ אָדוֹן అబ్రాహామును, అంటే సేవకుని మానవ అధిపతిని సూచిస్తుంది; ‘యజమాని’ ఆ సంబంధాన్ని స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: అబ్రాహామును సూచించే אָדוֹן పదం అనువాదం
  choice: నా యజమాని
  alternative: నా ప్రభువు
  rationale: సందర్భంలో ఇది దేవునికి సంబంధించిన బిరుదు కాదు; సేవకుడు–యజమాని సామాజిక సంబంధాన్ని ‘యజమాని’ స్పష్టంగా తెలియజేస్తుంది. అయితే మూలపదానికి ‘ప్రభువు’ అనే గౌరవార్థక అర్థమూ సాధ్యమే కాబట్టి దాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘అతడు’ అనే ఏకవచన సర్వనామం అబ్రాహాము సేవకుణ్ణి సూచిస్తుంది; మాట ఎవరిని ఉద్దేశించిందో దృష్టిలో ఉంచి ‘పంపించండి’ అనే గౌరవపూర్వక/బహువచన రూపం వాడబడింది.
