id: GEN.24.15
reference: Genesis 24:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַֽ/יְהִי ה֗וּא טֶרֶם֮ כִּלָּ֣ה לְ/דַבֵּר֒ וְ/הִנֵּ֧ה רִבְקָ֣ה יֹצֵ֗את אֲשֶׁ֤ר יֻלְּדָה֙ לִ/בְתוּאֵ֣ל בֶּן מִלְכָּ֔ה אֵ֥שֶׁת נָח֖וֹר אֲחִ֣י אַבְרָהָ֑ם וְ/כַדָּ֖/הּ עַל שִׁכְמָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/015.yaml
  text: And it happened[a], before he had finished speaking, that behold, Rebekah was coming out—she who had been born to Bethuel son of Milcah, the wife of Nahor[b], Abraham’s brother—with her jar on her shoulder.
translation:
  language: te
  text: అతడు ఇంకా మాట్లాడడం ముగించకముందే, ఇదిగో, రిబ్కా కుండను తన భుజం మీద మోసుకొని బయటికి వస్తోంది. ఆమె అబ్రాహాము సహోదరుడైన నాహోరు భార్య మిల్కాకు పుట్టిన బెతూయేలు కుమార్తె.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: ప్రత్యేకంగా అనువదించకుండా ప్రధాన సంఘటన వాక్యనిర్మాణంలో వ్యక్తీకరించబడింది
  rationale: హీబ్రూ కథనంలో ఇది కొత్త సంఘటనను పరిచయం చేసే సాధారణ రూపం. తెలుగులో ‘జరిగిందేమిటంటే’ అని చేర్చడం భారంగా ఉంటుంది; ‘...ముందే, ఇదిగో’ అనే నిర్మాణం దాని కథన కార్యాన్ని సహజంగా అందిస్తుంది.
- source_word: טֶרֶם כִּלָּה לְדַבֵּר
  choice: అతడు ఇంకా మాట్లాడడం ముగించకముందే
  rationale: טֶרֶם పూర్వకాల సంబంధాన్ని, כִּלָּה + לְדַבֵּר మాట పూర్తికావడాన్ని సూచిస్తాయి. ‘ఇంకా’ కొనసాగుతున్న చర్యను సహజంగా స్పష్టం చేస్తుంది.
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: కథనంలో అకస్మాత్తుగా దృష్టిని ఆకర్షించే హీబ్రూ సూచనను సూటిగా, గౌరవప్రదంగా నిలుపుతుంది.
- source_word: יֹצֵאת
  choice: బయటికి వస్తోంది
  rationale: స్త్రీలింగ ఏకవచన వర్తమాన కృదంతం ఆ క్షణంలో కొనసాగుతున్న చర్యను సజీవంగా చూపుతుంది.
- source_word: אֲשֶׁר יֻלְּדָה לִבְתוּאֵל
  choice: బెతూయేలు కుమార్తె
  rationale: హీబ్రూ నిష్క్రియ రూపం వంశసంబంధాన్ని తెలియజేస్తుంది. తెలుగులో ‘బెతూయేలుకు పుట్టినది’ కంటే ‘బెతూయేలు కుమార్తె’ సహజంగా ఉండి అదే సంబంధాన్ని కాపాడుతుంది.
- source_word: בֶּן מִלְכָּה אֵשֶׁת נָחוֹר אֲחִי אַבְרָהָם
  choice: అబ్రాహాము సహోదరుడైన నాహోరు భార్య మిల్కాకు పుట్టిన బెతూయేలు
  rationale: בֶּן మిల్కాతో బెతూయేలు సంబంధాన్ని సూచిస్తుంది; మొత్తం వంశావళి అనుబంధాన్ని అస్పష్టత లేకుండా సహజ తెలుగు క్రమంలో ఉంచుతుంది.
- source_word: כַּד
  choice: కుండ
  rationale: నీరు తోడటానికి లేదా మోయడానికి ఉపయోగించే పాత్రకు ఆధునిక సాధారణ తెలుగు పదం; మూలంలో లేని ‘నీళ్ల’ అనే విశేషణాన్ని చేర్చలేదు.
- source_word: עַל שִׁכְמָהּ
  choice: తన భుజం మీద
  rationale: స్థానార్థక పదబంధాన్ని స్పష్టమైన ఆధునిక తెలుగులో అందిస్తుంది; ‘తన’ రిబ్కానే సూచిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కథన సజీవత కోసం ‘ఇదిగో’ మరియు కొనసాగుతున్న చర్యకు ‘వస్తోంది’ వాడబడ్డాయి. వంశావళి సమాచారాన్ని సహజ తెలుగు వాక్యక్రమంలో ఉంచుతూ అన్ని సంబంధాలను నిలిపాం.
