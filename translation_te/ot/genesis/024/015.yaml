- from: అతడు ఇంకా మాట్లాడడం ముగించకముందే, ఇదిగో, రిబ్కా తన భుజం మీద కుండ పెట్టుకొని బయటికి వస్తోంది. ఆమె అబ్రాహాము సహోదరుడైన నాహోరు భార్య మిల్కాకు పుట్టిన బెతూయేలు కుమార్తె.
