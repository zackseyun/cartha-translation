  text: וַ/יֹּ֤אמֶר אֵלָי/ו֙ הָ/עֶ֔בֶד אוּלַי֙ לֹא תֹאבֶ֣ה הָֽ/אִשָּׁ֔ה לָ/לֶ֥כֶת אַחֲרַ֖/י אֶל הָ/אָ֣רֶץ הַ/זֹּ֑את הֶֽ/הָשֵׁ֤ב אָשִׁיב֙ אֶת בִּנְ/ךָ֔ אֶל הָ/אָ֖רֶץ אֲשֶׁר יָצָ֥אתָ מִ/שָּֽׁם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/005.yaml
  text: And the servant said to him[a], “Perhaps the woman will not be willing to follow me to this land[b]. Should I then take your son back to the land from which you came?”
translation:
  language: te
  text: అప్పుడు ఆ సేవకుడు అతనితో, “ఒకవేళ ఆ స్త్రీ నన్ను అనుసరించి[a] ఈ దేశానికి రావడానికి ఇష్టపడకపోతే, నీవు బయలుదేరి వచ్చిన దేశానికి నీ కుమారుణ్ణి నేను తిరిగి తీసుకెళ్లాలా[b]?” అని అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ పదశః: “నా వెనుక వెళ్లడానికి”; అంటే, “నన్ను అనుసరించడానికి.”'
    reason: lexical_alternative
  - marker: b
    text: '“తిరిగి తీసుకెళ్లడం” అనే చర్యను నొక్కిచెప్పడానికి హీబ్రూలో ఒకే ధాతువుకు చెందిన క్రియానామ రూపాన్ని, సమాపక క్రియతో కలిపి వాడారు. భావం: “నేను నిజంగానే తిరిగి తీసుకెళ్లాలా?”'
    reason: source_form
lexical_decisions:
- source_word: הָעֶבֶד
  choice: ఆ సేవకుడు
  rationale: עֶבֶד అనే పదానికి ‘సేవకుడు’ లేదా ‘దాసుడు’ అనే అర్థాలు ఉండవచ్చు. ఈ కథన సందర్భంలో అబ్రాహాము ఇంటి అధీన సేవకుణ్ణి సూచిస్తున్నందున, సామాజిక అధీనతను పూర్తిగా తొలగించకుండా సహజంగా వినిపించే ‘సేవకుడు’ ఎంచుకున్నాం.
- source_word: אוּלַי
  choice: ఒకవేళ
  rationale: ఇక్కడ ఈ పదం అనిశ్చితమైన సంభావ్యతను ప్రవేశపెడుతుంది. ప్రశ్నతో కూడిన షరతు వాక్యంలో ‘ఒకవేళ’ ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: לֹא תֹאבֶה
  choice: ఇష్టపడకపోతే
  rationale: אָבָה సమ్మతి లేదా సుముఖతను సూచిస్తుంది. ‘ఇష్టపడకపోతే’ ఆ భావాన్ని సాధారణ పాఠకులకు సహజంగా తెలియజేస్తుంది.
- source_word: הָאִשָּׁה
  choice: ఆ స్త్రీ
  rationale: మూలపాఠం కేవలం ‘ఆ స్త్రీ’ అని మాత్రమే చెబుతుంది; ఆమెను ముందుగానే ‘వధువు’ లేదా ‘యువతి’గా విస్తరించలేదు.
- source_word: לָלֶכֶת אַחֲרַי
  choice: నన్ను అనుసరించి ... రావడానికి
  rationale: పదశః ‘నా వెనుక వెళ్లడానికి.’ గమ్యం మాట్లాడుతున్నవాడు ఉన్న ‘ఈ దేశం’ కావడంతో, తెలుగులో ‘నన్ను అనుసరించి ఈ దేశానికి రావడానికి’ అనడం సహజమైన దిశాభావాన్ని ఇస్తుంది; పదశః రూపాన్ని పాదసూచికలో ఉంచాం.
- source_word: אֶל הָאָרֶץ הַזֹּאת
  choice: ఈ దేశానికి
  rationale: אֶרֶץ అంటే ‘దేశం’ లేదా ‘భూమి/ప్రాంతం.’ ఇక్కడ భౌగోళిక స్వదేశ ప్రాంతాన్ని సూచిస్తున్నందున ‘దేశం’ సహజంగా సరిపోతుంది.
- source_word: הֶהָשֵׁב אָשִׁיב
  choice: నేను తిరిగి తీసుకెళ్లాలా
  rationale: שׁוב ధాతువు యొక్క infinitive absolute మరియు finite verb కలయిక చర్యకు బలాన్ని ఇస్తుంది. ప్రశ్నలోని నిర్ణయార్థక భావాన్ని తెలుగులో ‘తిరిగి తీసుకెళ్లాలా?’గా సహజంగా ఇచ్చి, బలప్రయోగాన్ని పాదసూచికలో తెలిపాం.
- source_word: אֶת בִּנְךָ
  choice: నీ కుమారుణ్ణి
  rationale: మూలంలోని ప్రత్యక్ష, స్పష్టమైన సంబోధనను యథాతథంగా నిలిపాం.
- source_word: אֶל הָאָרֶץ אֲשֶׁר יָצָאתָ מִשָּׁם
  choice: నీవు బయలుదేరి వచ్చిన దేశానికి
  rationale: יָצָא పదశః ‘బయటికి వెళ్లడం/బయలుదేరడం.’ ‘నీవు బయలుదేరి వచ్చిన దేశం’ మూలంలోని భావాన్నీ సంబంధ వాక్యాన్నీ స్పష్టంగా నిలుపుతుంది.
