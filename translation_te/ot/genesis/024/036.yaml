source:
  edition: WLC
  text: וַ/תֵּ֡לֶד שָׂרָה֩ אֵ֨שֶׁת אֲדֹנִ֥/י בֵן֙ לַֽ/אדֹנִ֔/י אַחֲרֵ֖י זִקְנָתָ֑/הּ וַ/יִּתֶּן לּ֖/וֹ אֶת כָּל אֲשֶׁר לֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/036.yaml
  text: And Sarah[a], my master's wife, bore a son to my master after her old age, and he gave him all that he had.
translation:
  language: te
  text: నా యజమాని భార్య అయిన శారా, తన వృద్ధాప్యంలోకి వచ్చిన తర్వాత నా యజమానికి ఒక కుమారుణ్ణి కన్నది; ఆయన తనకు ఉన్నదంతా అతనికి ఇచ్చాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֵּלֶד
  choice: కన్నది
  rationale: ילד ధాతువు Qal wayyiqtol రూపంలో గత కథనక్రియను సూచిస్తుంది; స్త్రీ కుమారుణ్ణి కనడాన్ని ఆధునిక తెలుగులో సహజంగా, సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: אֵשֶׁת אֲדֹנִי
  choice: నా యజమాని భార్య
  rationale: సమాస పదబంధంలోని ‘నా యజమాని భార్య’ అనే సంబంధాన్ని సహజమైన తెలుగు పదక్రమంలో నిలుపుతుంది; సేవకుని గౌరవపూర్వక సంభాషణను కూడా కాపాడుతుంది.
- source_word: בֵן
  choice: ఒక కుమారుణ్ణి
  rationale: హీబ్రూలో నిర్దిష్ట ఉపపదం లేనందున ‘ఒక’ అని అనిర్దిష్టంగా అనువదించడం జనన ప్రకటనకు తెలుగులో సహజం.
- source_word: לַאדֹנִי
  choice: నా యజమానికి
  rationale: ל ఉపసర్గ సూచించే సంబంధం/లబ్ధిదారు భావాన్ని ‘నా యజమానికి’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אַחֲרֵי זִקְנָתָהּ
  choice: వృద్ధాప్యంలో
  rationale: అక్షరార్థంగా ‘ఆమె వృద్ధాప్యం తరువాత’ అయినా, సందర్భంలో ఆమె ముసలితనానికి చేరిన తరువాత లేదా ముదిమి వయసులో ప్రసవించిందనే భావం ఉంది. ‘వృద్ధాప్యంలో’ మూలంలోని వయోభార ప్రాధాన్యాన్ని సహజ తెలుగులో నిలుపుతుంది.
- source_word: וַיִּתֶּן לוֹ
  choice: ఆయన ... అతనికి ఇచ్చాడు
  rationale: נתן యొక్క wayyiqtol రూపం గత కథనక్రమాన్ని కొనసాగిస్తుంది. కర్త అబ్రాహాము, పరోక్ష కర్మ ఇప్పుడే ప్రస్తావించిన కుమారుడు; సర్వనామాలు ఈ సూచనను నిలుపుతాయి.
- source_word: אֶת כָּל אֲשֶׁר לוֹ
  choice: తనకు ఉన్నదంతా
  rationale: అబ్రాహాముకు చెందిన సమస్త ఆస్తిని సూచించే సమగ్ర స్వాస్థ్య పదబంధాన్ని స్పష్టమైన, సహజమైన తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: אַחֲרֵי זִקְנָתָהּ యొక్క కాలసంబంధ భావం
  choice: వృద్ధాప్యంలో
  alternative: ఆమె వృద్ధురాలైన తరువాత
  rationale: అక్షరార్థ నిర్మాణం అసహజంగా ‘ఆమె వృద్ధాప్యం తరువాత’ అని వినిపించవచ్చు. సందర్భానుసారంగా ఇది శారా ముదిమి వయసులో కుమారుణ్ణి కనడాన్ని సూచిస్తుంది; ‘వృద్ధాప్యంలో’ ఆ భావాన్ని అనవసర సిద్ధాంత వివరణ లేకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయితే కథన గౌరవాన్ని మరియు సేవకుని మర్యాదపూర్వక సంభాషణను నిలుపుతూ అనువదించబడింది.
