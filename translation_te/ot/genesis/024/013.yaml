id: GEN.24.13
reference: Genesis 24:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: הִנֵּ֛ה אָנֹכִ֥י נִצָּ֖ב עַל עֵ֣ין הַ/מָּ֑יִם וּ/בְנוֹת֙ אַנְשֵׁ֣י הָ/עִ֔יר יֹצְאֹ֖ת לִ/שְׁאֹ֥ב מָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/013.yaml
  text: Look[a], I am standing by the spring of water[c][b], and the daughters of the men of the city are coming out to draw water.
translation:
  language: te
  text: ఇదిగో, నేను నీటి ఊట[a] దగ్గర నిలబడి ఉన్నాను. పట్టణంలోని యువతులు[b] నీళ్లు తోడడానికి బయటికి వస్తున్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘నీటి బుగ్గ’. హీబ్రూ עֵין הַמָּיִם సహజ నీటి వనరును సూచిస్తుంది; సాధారణంగా ‘బావి’కి వాడే పదం ఇది కాదు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా ‘పట్టణంలోని పురుషుల కుమార్తెలు’; ఇది ఆ పట్టణపు యువతులను సూచించే సామాజిక/కుటుంబ సంబంధ ప్రయోగం.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: ఇదిగో
  rationale: మాట్లాడుతున్న వ్యక్తి ఎదుట ఉన్న దృశ్యంపై దృష్టి నిలిపే సూచక అవ్యయాన్ని సహజమైన, గౌరవప్రదమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אָנֹכִי
  choice: నేను
  rationale: స్వతంత్ర ప్రథమ పురుష సర్వనామాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; సందర్భం కోరని అదనపు ఉద్ఘాటనను చేర్చదు.
- source_word: נִצָּב
  choice: నిలబడి ఉన్నాను
  rationale: నిఫాల్ కృదంతం సూచించే ప్రస్తుత స్థితిని సహజమైన తెలుగు క్రియారూపంతో తెలియజేస్తుంది.
- source_word: עַל
  choice: దగ్గర
  rationale: నీటి వనరుకు సమీపంగా ఉన్న స్థానాన్ని ఈ సందర్భంలో సహజంగా సూచిస్తుంది.
- source_word: עֵין הַמָּיִם
  choice: నీటి ఊట
  rationale: ఇది సాధారణంగా బావిని సూచించే בְּאֵר కాదు; నీరు ఉబికి వచ్చే సహజ వనరును సూచిస్తుంది.
- source_word: וּבְנוֹת אַנְשֵׁי הָעִיר
  choice: పట్టణంలోని యువతులు
  rationale: అక్షరార్థంగా ‘పట్టణంలోని పురుషుల కుమార్తెలు’ అనే సామాజిక/కుటుంబ సంబంధ ప్రయోగం. ఆధునిక తెలుగులో దాని సందర్భార్థాన్ని సహజంగా తెలియజేస్తూ, అక్షరరూపాన్ని పాదసూచికలో నిలుపుతుంది.
- source_word: יֹצְאֹת
  choice: బయటికి వస్తున్నారు
  rationale: స్త్రీలింగ బహువచన కృదంతం సూచించే జరుగుతున్న లేదా సమీప చర్యను, ఊట దగ్గర వేచి ఉన్న వక్త దృష్టికోణం నుంచి వ్యక్తం చేస్తుంది.
- source_word: לִשְׁאֹב מָיִם
  choice: నీళ్లు తోడడానికి
  rationale: నీటి వనరునుంచి నీటిని తీసే చర్యకు సహజమైన తెలుగు నుడికారం.
