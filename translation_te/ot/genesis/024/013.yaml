translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడబడింది. ‘ఇదిగో’ మూలంలోని దృశ్యాత్మక ఉద్ఘాటనను నిలుపుతుంది. అక్షరానువాదంలో అసహజంగా వినిపించే హీబ్రూ సామాజిక ప్రయోగాన్ని ప్రధాన పాఠ్యంలో ‘పట్టణంలోని యువతులు’గా ఇచ్చి, దాని రూపాన్ని పాదసూచికలో భద్రపరిచాం.
