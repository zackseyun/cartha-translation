source:
  edition: WLC
  text: וַ/יַּ֨עַן לָבָ֤ן וּ/בְתוּאֵל֙ וַ/יֹּ֣אמְר֔וּ מֵ/יְהוָ֖ה יָצָ֣א הַ/דָּבָ֑ר לֹ֥א נוּכַ֛ל דַּבֵּ֥ר אֵלֶ֖י/ךָ רַ֥ע אוֹ טֽוֹב־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/050.yaml
  text: Then Laban and Bethuel answered and said[a], “The matter has come from Yahweh[b]; we cannot speak to you bad or good.”
translation:
  language: te
  text: 'అప్పుడు లాబాను, బెతూయేలు జవాబిచ్చి ఇలా అన్నారు: “ఈ విషయం యాహ్వే నుండి వచ్చింది; మేము నీకు చెడుగానీ మంచిగానీ చెప్పలేము.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “చెడుగానీ మంచిగానీ చెప్పలేము” అనేది యాహ్వే నుండి వచ్చిన ఈ విషయాన్ని వారు వ్యతిరేకించలేరని లేదా దానిని మార్చలేరని సూచించే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמְרוּ
  choice: ఇలా జవాబిచ్చారు
  rationale: రెండు క్రియలూ కలసి సంభాషణలో ప్రత్యుత్తరాన్ని పరిచయం చేసే హెబ్రీ సూత్రప్రయోగం. తెలుగులో సహజంగా ఉండేందుకు ఒకే సమగ్ర ప్రయోగంగా అనువదించాం.
- source_word: מֵיְהוָה יָצָא הַדָּבָר
  choice: ఈ విషయం యెహోవా నుంచే వచ్చింది
  rationale: יָצָא తో కూడిన מִן మూలాన్ని సూచిస్తుంది. הַדָּבָר ఇక్కడ వివాహ ప్రతిపాదనకు సంబంధించిన ‘విషయం’; ‘నుంచే’ దాని దైవిక మూలాన్ని సహజంగా స్పష్టం చేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవ నామాన్ని సాధారణ బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే రూపంలో వ్యక్తిగత నామంగా ఇచ్చాం.
- source_word: לֹא נוּכַל
  choice: మాట్లాడలేము
  rationale: יכל సామర్థ్యాన్ని సూచిస్తుంది; ప్రతికూల రూపాన్ని తెలుగులో సంక్షిప్తంగా, సహజంగా వ్యక్తం చేశాం.
- source_word: דַּבֵּר אֵלֶיךָ רַע אוֹ טוֹב
  choice: నీతో చెడుగానీ మంచిగానీ మాట్లాడలేము
  rationale: ‘చెడు లేదా మంచి’ అనే హెబ్రీ ధ్రువపద జంటను, దాని మూల క్రమాన్నీ నిలిపి ఉంచాం. సందర్భంలో ఇది యెహోవా నిర్ణయాన్ని వ్యతిరేకించలేము లేదా మార్చలేము అనే నుడికార భావాన్ని కలిగిస్తుంది.
theological_decisions:
- issue: దైవ నామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: మూలంలో ఉన్న ఒడంబడిక నామాన్ని బిరుదుగా మార్చకుండా వ్యక్తిగత నామంగానే ఉంచాం. ‘యెహోవా’ ఆధునిక తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన రూపం.
- issue: ‘చెడు లేదా మంచి మాట్లాడలేము’ అనే నుడికార భావం
  choice: ప్రధాన పాఠంలో మూలంలోని ధ్రువపద జంటను నిలిపి, భావాన్ని పాదసూచికలో వివరించడం
  alternative: ‘మేము దీనిని వ్యతిరేకించలేము, మార్చలేము’ అని నేరుగా భావానువాదం చేయడం
  rationale: మూలంలోని ఉద్దేశపూర్వక నుడికారాన్నీ దైవ నిర్ణయం ఎదుట వారి పరిమితినీ నిలిపి, దాని భావాన్ని అతిగా నిర్ధారించకుండా వివరించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. హెబ్రీ మాటక్రమం మరియు నుడికారాన్ని సాధ్యమైనంతవరకు నిలిపి, అస్పష్టతను పాదసూచిక ద్వారా వివరించాం.
