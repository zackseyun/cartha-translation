source:
  edition: WLC
  text: וְ/אַשְׁבִּ֣יעֲ/ךָ֔ בַּֽ/יהוָה֙ אֱלֹהֵ֣י הַ/שָּׁמַ֔יִם וֵֽ/אלֹהֵ֖י הָ/אָ֑רֶץ אֲשֶׁ֨ר לֹֽא תִקַּ֤ח אִשָּׁה֙ לִ/בְנִ֔/י מִ/בְּנוֹת֙ הַֽ/כְּנַעֲנִ֔י אֲשֶׁ֥ר אָנֹכִ֖י יוֹשֵׁ֥ב בְּ/קִרְבּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/003.yaml
  text: and I will make you swear by Yahweh[a], the God of heaven and the God of the earth, that you shall not take a wife for my son from the daughters of the Canaanites, among whom I dwell.
translation:
  language: te
  text: 'ఆకాశానికి దేవుడూ భూమికి దేవుడూ అయిన యాహ్వే[a] మీద నీ చేత ప్రమాణం చేయిస్తాను: వారి మధ్య నేను నివసిస్తున్న కనానీయుల కుమార్తెలలో నుండి నా కుమారునికి భార్యను తీసుకోకూడదు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూలో: יהוה (YHWH), దేవుని ప్రత్యేక నామం; ఇక్కడ ‘యాహ్వే’గా లిప్యంతరీకరించబడింది.'
    reason: దైవనామపు మూలరూపం మరియు అనువాద ఎంపికను స్పష్టం చేయడానికి.
lexical_decisions:
- source_word: וְאַשְׁבִּיעֲךָ
  choice: నీ చేత ప్రమాణం చేయిస్తాను
  rationale: שׁבע హిఫీల్ రూపంలోని కారణార్థక భావాన్ని—మరొకరి చేత ప్రమాణం చేయించడం—స్పష్టంగా నిలుపుతుంది.
- source_word: בַּיהוָה
  choice: యాహ్వే తోడని
  rationale: ప్రమాణం ఎవరి మీద చేయబడుతుందో తెలిపే בְּ భావాన్ని సహజమైన తెలుగు ప్రమాణ సూత్రంతో వ్యక్తం చేస్తుంది; יהוה అనే దైవనామాన్ని ‘యాహ్వే’గా లిప్యంతరీకరిస్తుంది.
- source_word: אֱלֹהֵי הַשָּׁמַיִם וֵאלֹהֵי הָאָרֶץ
  choice: పరలోకానికి దేవుడూ భూమికి దేవుడూ అయిన
  rationale: హీబ్రూలో ‘దేవుడు’ అనే నిర్మాణం రెండుసార్లు రావడాన్ని నిలుపుతూ, పరలోకం–భూమి అనే విశ్వవ్యాప్త జోడీని స్పష్టంగా అందిస్తుంది.
- source_word: אֲשֶׁר לֹא תִקַּח אִשָּׁה לִבְנִי
  choice: నా కుమారునికి భార్యగా తీసుకోకూడదు
  rationale: ప్రమాణంలోని నిషేధాన్ని ‘తీసుకోకూడదు’ అని గంభీరంగా, సహజంగా వ్యక్తం చేస్తుంది; వివాహ సందర్భంలో אִשָּׁהను ‘భార్య’గా అనువదిస్తుంది.
- source_word: מִבְּנוֹת הַכְּנַעֲנִי
  choice: ఆ కనానీయుల కుమార్తెలలో ఒకరిని
  rationale: ‘కుమార్తెలు’ అనే హీబ్రూ జాతీయ సమూహ వాడుకను నిలుపుతూ, భార్యగా ఎంపిక చేయబడేది ఒక వ్యక్తి అని తెలుగులో సహజంగా తెలుపుతుంది.
- source_word: אֲשֶׁר אָנֹכִי יוֹשֵׁב בְּקִרְבּוֹ
  choice: నేను ఎవరి మధ్య నివసిస్తున్నానో ఆ కనానీయుల
  rationale: יוֹשֵׁב యొక్క కొనసాగుతున్న నివాస భావాన్నీ, בְּקִרְבּוֹ యొక్క ‘వారి మధ్య’ అనే సామాజిక స్థితినీ సహజమైన సంబంధ వాక్యంగా అందిస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా / ప్రభువు
  rationale: మూలపాఠంలో ఉన్న ఒడంబడిక దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, సాధారణంగా పునర్నిర్మించబడిన ఉచ్చారణకు దగ్గరగా తెలుగులో లిప్యంతరీకరించింది.
- issue: ప్రమాణంలో దేవుని పాత్ర
  choice: యాహ్వే తోడని
  alternative: యాహ్వే పేరున / యాహ్వే సాక్షిగా
  rationale: ‘పేరున’ లేదా ‘సాక్షిగా’ అని మూలంలో లేని భావాన్ని ప్రత్యేకంగా చేర్చకుండా, దేవునిపై ప్రమాణం చేయడాన్ని తెలిపే సహజ తెలుగు సూత్రాన్ని ఉపయోగించింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కుటుంబ-ఒడంబడిక సందర్భానికి తగిన శైలి. హీబ్రూ వాక్యక్రమాన్ని యాంత్రికంగా అనుసరించకుండా, కారణార్థక ప్రమాణం, ద్విగుణిత ‘దేవుడు’ నిర్మాణం, కనానీయుల మధ్య నివాసం అనే మూల భావాలను నిలిపింది.
