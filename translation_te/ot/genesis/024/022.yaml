id: GEN.24.22
reference: Genesis 24:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְהִ֗י כַּ/אֲשֶׁ֨ר כִּלּ֤וּ הַ/גְּמַלִּים֙ לִ/שְׁתּ֔וֹת וַ/יִּקַּ֤ח הָ/אִישׁ֙ נֶ֣זֶם זָהָ֔ב בֶּ֖קַע מִשְׁקָל֑/וֹ וּ/שְׁנֵ֤י צְמִידִים֙ עַל יָדֶ֔י/הָ עֲשָׂרָ֥ה זָהָ֖ב מִשְׁקָלָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/022.yaml
  text: And when the camels had finished drinking[a], the man took a gold ring weighing a beka[b], and two bracelets for her hands weighing ten shekels of gold.
translation:
  language: te
  text: ఒంటెలు తాగడం ముగించినప్పుడు, ఆ మనిషి ఒక బేకా[b] బరువున్న బంగారు ఉంగరాన్ని[a], ఆమె చేతులకు పది షెకెల్ల బంగారు బరువున్న రెండు కంకణాలను తీసుకున్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పదం ముక్కుకు లేదా చెవికి ధరించే ఉంగరాకార ఆభరణాన్ని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ఒక బేకా అర షెకెలుకు సమానమైన బరువు ప్రమాణం.
    reason: cultural_note
lexical_decisions:
- source_word: כַּאֲשֶׁר כִּלּוּ הַגְּמַלִּים לִשְׁתּוֹת
  choice: ఒంటెలు తాగడం ముగించినప్పుడు
  rationale: ఈ నిర్మాణం ఒంటెలు నీళ్లు తాగడం పూర్తయిన తరువాత జరిగిన చర్యను సూచిస్తుంది. తెలుగు వాక్యం సహజంగా ఉండేలా, పూర్తయిన భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: הָאִישׁ
  choice: ఆ మనిషి
  rationale: సందర్భంలో అతడు అబ్రాహాము సేవకుడైనా, ఈ వచనంలోని హీబ్రూ పదం కేవలం ‘మనిషి’ అని ఉంది; అందువల్ల మూలపాఠంలోని సూచననే నిలిపాం.
- source_word: נֶזֶם זָהָב
  choice: బంగారు ఉంగరం
  rationale: נֶזֶם ముక్కుకు లేదా చెవికి ధరించే ఉంగరాకార ఆభరణాన్ని సూచించవచ్చు. ప్రధాన పాఠంలో విస్తృతార్థం గల ‘ఉంగరం’ ఉంచి, శరీర భాగానికి సంబంధించిన అనిశ్చితిని పాదసూచికలో తెలిపాం.
- source_word: בֶּקַע מִשְׁקָלוֹ
  choice: ఒక బేకా బరువున్న
  rationale: బేకా ప్రాచీన బరువు ప్రమాణం. దానిని పేరుతోనే నిలిపి, దాని విలువను పాదసూచికలో వివరించాం.
- source_word: וּשְׁנֵי צְמִידִים עַל יָדֶיהָ
  choice: ఆమె చేతులకు ... రెండు కంకణాలను
  rationale: హీబ్రూలో ‘ఆమె చేతులపై’ అని ఉన్నా, తీసుకున్న సందర్భంలో ఉద్దేశార్థం తెలుగులో సహజంగా వ్యక్తమయ్యేలా ‘ఆమె చేతులకు’ అని అనువదించాం; రెండు అనే సంఖ్యను స్పష్టంగా నిలిపాం.
- source_word: עֲשָׂרָה זָהָב מִשְׁקָלָם
  choice: పది షెకెల్ల బంగారం బరువున్న
  rationale: మూలంలో బరువు ప్రమాణం సందర్భానుసారంగా షెకెల్లు అని గ్రహించబడుతుంది. రెండు కంకణాల మొత్తం బంగారం బరువును తెలుగులో స్పష్టంగా తెలిపాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలిని వాడాం. ‘బేకా’, ‘షెకెలు’ వంటి ప్రాచీన ప్రమాణాలను నిలిపాం. [a] గుర్తును సంబంధిత ‘ఉంగరం’ తరువాత ఉంచాం; [b] గుర్తు బేకా వివరణకు సంబంధించిన వాక్యాంత పాదసూచికగా ఉంది.
