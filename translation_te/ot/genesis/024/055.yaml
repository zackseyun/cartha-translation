  to: 'అయితే ఆమె సోదరుడూ తల్లీ ఇలా అన్నారు: “యువతి కొన్ని రోజులు[a] గానీ పది రోజులు గానీ మాతో ఉండనివ్వండి; ఆ తర్వాత ఆమె వెళ్లవచ్చు.”'
