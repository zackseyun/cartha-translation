source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אָחִ֨י/הָ֙ וְ/אִמָּ֔/הּ תֵּשֵׁ֨ב הַ/נַּעֲרָ֥ אִתָּ֛/נוּ יָמִ֖ים א֣וֹ עָשׂ֑וֹר אַחַ֖ר תֵּלֵֽךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/055.yaml
  text: But her brother and her mother said[a], “Let the young woman stay with us a few days, or ten; after that she may go.”
translation:
  language: te
  text: 'అయితే ఆమె సోదరుడూ తల్లీ ఇలా అన్నారు: “యువతి కొన్ని రోజులు[a] గానీ పది రోజులు గానీ మాతో ఉండనివ్వండి; ఆ తర్వాత ఆమె వెళ్లవచ్చు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “రోజులు, లేదా పది.” ఈ మాటకు “కొన్ని రోజులు, లేదా పది రోజులు” అనే అర్థం ఉండవచ్చు.
    reason: హీబ్రూ నుడికారంలోని సంక్షిప్తమైన, కొంత అనిశ్చితమైన కాలవ్యవధిని స్పష్టం చేయడానికి.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అయితే ... అన్నారు
  rationale: వావ్-వరుస కథనాన్ని ముందుకు నడిపిస్తుండగా, మునుపటి వచనంలోని సేవకుని తొందరపాటు అభ్యర్థనకు ఇక్కడ ప్రతిస్పందనలో వ్యతిరేక భావం ఉంది; అందువల్ల సహజమైన తెలుగులో ‘అయితే’ తగినది. సంయుక్త కర్తకు అనుగుణంగా గౌరవబహువచన క్రియ వాడబడింది.
- source_word: אָחִיהָ וְאִמָּהּ
  choice: ఆమె సోదరుడూ, తల్లీ
  rationale: హీబ్రూ పదక్రమాన్నీ, ‘సోదరుడు’ అనే ఏకవచనాన్నీ నిలిపి, ఆధునిక గౌరవప్రదమైన తెలుగులో అందించబడింది.
- source_word: תֵּשֵׁב
  choice: ఉండనివ్వండి
  rationale: ఇక్కడ ישב అనేది ప్రయాణానికి ముందు కొంతకాలం అక్కడే ఉండడం అనే భావం ఇస్తుంది. అభ్యర్థనాత్మక భావాన్ని తెలుగులో ‘ఉండనివ్వండి’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: הַנַּעֲרָ
  choice: ఈ యువతి
  rationale: నַעֲרָה యువ స్త్రీని సూచిస్తుంది. ‘యువతి’ ఆధునికం, గౌరవప్రదం; నిర్దిష్టంగా ఎదుట ఉన్న రిబ్కాను సూచించేందుకు ‘ఈ’ వాడబడింది.
- source_word: אִתָּנוּ
  choice: మాతో
  rationale: తోడుగా లేదా వారి సమక్షంలో ఉండడాన్ని సూచించే సరళమైన సమానార్థకం.
- source_word: יָמִים
  choice: కొన్ని రోజులైనా
  rationale: పదశః ‘రోజులు’; ఈ సందర్భంలో సంఖ్యలేని బహువచనం ‘కొన్ని రోజులు’ అనే నుడికార భావం ఇవ్వవచ్చు. ‘అయినా’ ప్రత్యామ్నాయ వ్యవధుల ప్రతిపాదనను సహజంగా కలుపుతుంది.
- source_word: אוֹ עָשׂוֹר
  choice: లేక పది రోజులైనా
  rationale: עָשׂוֹר అంటే ‘పది’. తెలుగులో అర్థస్పష్టత కోసం ముందు పదం నుంచి ‘రోజులు’ పునరుక్తి చేయబడింది; ‘లేక’ ప్రత్యామ్నాయాన్ని సూచిస్తుంది.
- source_word: אַחַר
  choice: ఆ తర్వాత
  rationale: తదనంతర చర్యను సహజమైన ఆధునిక తెలుగులో స్పష్టంగా సూచిస్తుంది.
- source_word: תֵּלֵךְ
  choice: ఆమె వెళ్లవచ్చు
  rationale: సందర్భంలో కర్త యువతే. రూపం అనుమతి లేదా ప్రతిపాదన ఛాయను కలిగి ఉండటంతో, ఖచ్చిత భవిష్యత్తుగా కాక ‘వెళ్లవచ్చు’ అని అనువదించబడింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే, గౌరవప్రదమైన కథన శైలి. హీబ్రూ ‘రోజులు, లేక పది’ అనే సంక్షిప్త నిర్మాణాన్ని సందర్భోచితంగా ‘కొన్ని రోజులైనా, లేక పది రోజులైనా’ అని విప్పి చెప్పబడింది.
