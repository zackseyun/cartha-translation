translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘అన్న’ లేదా ‘తమ్ముడు’ అని మూలంలో లేని వయోభేదాన్ని చేర్చకుండా ‘సోదరుడు’ అని అనువదించాం. పునరుక్తమైన రెండు אֶל పదబంధాలను తెలుగులో స్థలసంబంధాన్ని స్పష్టంగా చూపేలా ఒకటిగా అమర్చినా, మూలపాఠపు నిర్మాణాన్ని పాదటిప్పణిలో సంరక్షించాం.
