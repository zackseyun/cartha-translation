  yaml_path: translation/ot/genesis/024/029.yaml
  text: Rebekah had a brother[a], and his name was Laban; and Laban ran out to the man[b], outside by the spring.
translation:
  language: te
  text: రిబ్కాకు ఒక సోదరుడు ఉన్నాడు; అతని పేరు లాబాను. లాబాను బయట, ఊట దగ్గర ఉన్న ఆ మనిషి వద్దకు పరుగెత్తాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ పదక్రమాన్ని మరింత అక్షరార్థంగా అనుసరిస్తే: ‘లాబాను ఆ మనిషి వద్దకు, బయటికి, ఊటవైపుకు పరుగెత్తాడు.’ ఇక్కడ ‘ఊట’కు బదులు ‘నీటి బుగ్గ’ అని కూడా అనువదించవచ్చు; హీబ్రూ పదం ‘బావి’ కంటే ‘ఊట’ను మరింత ఖచ్చితంగా సూచిస్తుంది.'
    reason: source_syntax; lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/רִבְקָה אָח
  choice: రిబ్కాకు ఒక సోదరుడు ఉన్నాడు
  rationale: లְרִבְקָה అనే దత్తార్థక నిర్మాణం ఇక్కడ కలిగియుండడాన్ని సూచించే హీబ్రూ ప్రయోగం. తెలుగులో ‘రిబ్కాకు ... ఉన్నాడు’ సహజంగా అదే భావాన్ని ఇస్తుంది. אָח వయస్సు లేదా అన్న/తమ్ముడు అనే భేదాన్ని చెప్పదు కాబట్టి ‘సోదరుడు’ ఎంచుకున్నాం.
- source_word: וּ/שְׁמ/וֹ לָבָן
  choice: అతని పేరు లాబాను
  rationale: హీబ్రూ నామకరణ సూత్రాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וַ/יָּרָץ
  choice: పరుగెత్తాడు
  rationale: క్రియ యొక్క ప్రాథమిక అర్థమైన ‘పరుగెత్తు’ను నేరుగా నిలుపుతుంది.
- source_word: אֶל הָ/אִישׁ
  choice: ఆ మనిషి వద్దకు
  rationale: אֶל గమ్యాన్ని సూచిస్తుంది. సందర్భంలో ఇతడు అబ్రాహాము సేవకుడైనా, మూలపాఠం సాధారణ పదమైన ‘మనిషి’నే వాడుతుంది కాబట్టి అదే నిలుపబడింది.
- source_word: הַ/חוּצָ/ה
  choice: బయట
  rationale: దిశ లేదా వెలుపలి స్థలాన్ని సూచించే రూపం. తెలుగులో తరువాతి స్థలవివరణతో కలిపి ‘బయట ... ఉన్న’ అని సహజంగా అందించబడింది.
- source_word: אֶל הָ/עָיִן
  choice: నీటి ఊట దగ్గర
  rationale: עַיִן ఇక్కడ సహజంగా ఉబికే నీటి ఊటను సూచిస్తుంది; ‘బావి’ అనే వేరే హీబ్రూ పదంతో ఉన్న భేదాన్ని ‘ఊట’ నిలుపుతుంది. రెండవ אֶל‌ను తెలుగులో సహజమైన స్థలసంబంధంగా ‘దగ్గర’ అని అందించాం.
