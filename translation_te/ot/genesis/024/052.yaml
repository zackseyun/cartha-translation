source:
  edition: WLC
  text: וַ/יְהִ֕י כַּ/אֲשֶׁ֥ר שָׁמַ֛ע עֶ֥בֶד אַבְרָהָ֖ם אֶת דִּבְרֵי/הֶ֑ם וַ/יִּשְׁתַּ֥חוּ אַ֖רְצָ/ה לַֽ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/052.yaml
  text: And when Abraham’s servant heard their words[c][b][a], he bowed down to the ground before Yahweh.
translation:
  language: te
  text: అబ్రాహాము సేవకుడు వారి మాటలు విన్నప్పుడు, అతడు నేలపై వంగి యాహ్వేకు నమస్కరించాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతడు యాహ్వే ఎదుట నేలపై సాష్టాంగ నమస్కారం చేశాడు.” హీబ్రూ క్రియ గౌరవంతో లేదా ఆరాధనతో నేలవైపు వంగడాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: విన్నప్పుడు
  rationale: హీబ్రూ కథన సూత్రంలోని కాలసంబంధ భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; ‘అప్పుడు ఇలా జరిగింది’ అని యాంత్రికంగా అనువదించాల్సిన అవసరం లేదు.
- source_word: עֶבֶד אַבְרָהָם
  choice: అబ్రాహాము సేవకుడు
  rationale: నిర్మాణ సంబంధాన్ని సహజంగా తెలియజేస్తుంది. ఈ సందర్భంలో అతని గృహ ప్రతినిధి పాత్ర ప్రధానమైనందున ‘బానిస’ కంటే ‘సేవకుడు’ తగినది.
- source_word: דִּבְרֵיהֶם
  choice: వారి మాటలు
  rationale: మూలంలోని ‘వారి మాటలు’ అనే ప్రత్యక్ష భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: וַיִּשְׁתַּחוּ אַרְצָה
  choice: నేలవరకు వంగి … నమస్కరించాడు
  rationale: క్రియలోని వినయపూర్వకంగా వంగడం లేదా సాష్టాంగపడడం అనే భావాన్నీ, אַרְצָה లోని నేలవైపు కదలికనూ స్పష్టంగా తెలియజేస్తుంది; ‘ఆరాధించాడు’ అని మాత్రమే చెప్పి శరీర భంగిమను కోల్పోదు.
- source_word: לַיהוָה
  choice: యాహ్వేకు
  rationale: לְ ఉపసర్గంలోని దిశ లేదా గ్రహీత భావాన్ని నిలుపుతూ, దేవుని వ్యక్తిగత నామమైన יהוהను ‘యాహ్వే’గా ప్రత్యక్షంగా అందిస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు
  rationale: మూలపాఠంలో ఉన్న ఒడంబడిక నామాన్ని బిరుదుతో భర్తీ చేయకుండా, పేరుగానే లిప్యంతరీకరించబడింది.
- issue: וַיִּשְׁתַּחוּ క్రియను స్పష్టంగా ‘ఆరాధించాడు’గా అనువదించాలా?
  choice: నేలవరకు వంగి … నమస్కరించాడు
  alternative: యాహ్వేను ఆరాధించాడు
  rationale: ఈ క్రియ ఆరాధనాత్మక గౌరవాన్ని సూచించగలిగినా, పాఠం ‘నేలవైపు’ అనే శరీర భంగిమను ప్రత్యేకంగా చెబుతుంది. అందువల్ల భౌతిక చర్యను ప్రధాన పాఠంలో నిలిపి, ఆరాధన భావాన్ని అతిగా నిర్ధారించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. ‘సాష్టాంగపడ్డాడు’ అనే మరింత నిర్దిష్టమైన ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచి, ప్రధాన పాఠంలో మూలంలోని భౌతిక చర్య మరియు ఆరాధనాత్మక భావం రెండింటినీ సహజంగా నిలిపాం.
