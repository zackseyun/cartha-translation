  yaml_path: translation/ot/genesis/024/024.yaml
  text: She said to him[a], “I am the daughter of Bethuel son of Milcah, whom she bore to Nahor.”
translation:
  language: te
  text: ఆమె అతనితో ఇలా అంది, “నేను బెతూయేలు కుమార్తెను; అతడు మిల్కా నాహోరుకు కనిన కుమారుడు.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֹּאמֶר אֵלָיו
  choice: ఆమె అతనితో … అంది
  rationale: క్రమంగా జరిగిన తదుపరి మాటను తెలిపే హీబ్రూ కథన రూపాన్ని సహజమైన తెలుగు వాక్యక్రమంలో వ్యక్తం చేస్తుంది; אֵלָיו మాట ఎవరిని ఉద్దేశించిందో స్పష్టం చేస్తుంది.
- source_word: בַּת בְּתוּאֵל אָנֹכִי
  choice: నేను … బెతూయేలు కుమార్తెను
  rationale: క్రియలేని హీబ్రూ గుర్తింపు వాక్యాన్ని సహజమైన తెలుగు విధేయ నిర్మాణంతో అందిస్తుంది; స్వతంత్ర సర్వనామమైన אָנֹכִי లోని స్పష్టమైన ‘నేను’ను నిలుపుతుంది.
- source_word: בֶּן מִלְכָּה
  choice: మిల్కా … కనిన కుమారుడైన
  rationale: బెతూయేలు మిల్కా కుమారుడని తెలిపే సంబంధాన్ని తెలుగులో సందిగ్ధత లేకుండా, సహజమైన వంశావళి నిర్మాణంలో వ్యక్తం చేస్తుంది.
- source_word: אֲשֶׁר יָלְדָה לְנָחוֹר
  choice: మిల్కా నాహోరుకు కనిన
  rationale: יָלְדָה లోని స్త్రీ కర్తను మిల్కా అని తెలుగులో స్పష్టం చేస్తూ, לְ ద్వారా తండ్రిగా సూచించబడిన నాహోరును ‘నాహోరుకు’ అని యథార్థంగా నిలుపుతుంది.
- source_word: בְּתוּאֵל / מִלְכָּה / נָחוֹר
  choice: బెతూయేలు / మిల్కా / నాహోరు
  rationale: వ్యక్తుల పేర్లను ఆధునిక ప్రామాణిక తెలుగు లిప్యంతరీకరణలో అందిస్తుంది.
theological_decisions: []
translation_notes:
  register: సహజమైన ఆధునిక ప్రామాణిక తెలుగు కథనశైలిని ఉపయోగిస్తూ, వంశావళి సంబంధాలను స్పష్టంగా ఉంచేందుకు హీబ్రూ పదక్రమాన్ని తెలుగుకు అనుగుణంగా పునర్వ్యవస్థీకరించాం. ‘కనిన’ అనే రూపం గౌరవప్రదమైన గ్రంథశైలిని నిలుపుతూ సాధారణ పాఠకులకు అర్థమయ్యేలా ఉంది.
