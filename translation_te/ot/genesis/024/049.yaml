id: GEN.24.49
reference: Genesis 24:49
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ֠/עַתָּה אִם יֶשְׁ/כֶ֨ם עֹשִׂ֜ים חֶ֧סֶד וֶֽ/אֱמֶ֛ת אֶת אֲדֹנִ֖/י הַגִּ֣ידוּ לִ֑/י וְ/אִם לֹ֕א הַגִּ֣ידוּ לִ֔/י וְ/אֶפְנֶ֥ה עַל יָמִ֖ין א֥וֹ עַל שְׂמֹֽאל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/049.yaml
  text: Now if you are going to show kindness and faithfulness to my master[a], tell me; but if not, tell me, so that I may turn to the right or to the left.
translation:
  language: te
  text: ఇప్పుడు మీరు నా యజమాని పట్ల దయను, విశ్వసనీయతను[a] చూపబోతున్నట్లయితే నాకు చెప్పండి; లేకపోతే అదీ నాకు చెప్పండి. అప్పుడు నేను కుడివైపుకు గానీ ఎడమవైపుకు గానీ తిరుగుతాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘స్థిరమైన ప్రేమను, విశ్వసనీయతను.’ ఈ హీబ్రూ పదజంట తరచుగా సంబంధంలో నిబద్ధతతో, నమ్మదగిన రీతిలో చూపే దయను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: ఇప్పుడు
  rationale: సేవకుని మాటల్లో తక్షణ నిర్ణయానికి వచ్చే మలుపును సహజమైన ఆధునిక తెలుగులో సూచిస్తుంది.
- source_word: אִם יֶשְׁכֶם עֹשִׂים
  choice: మీరు ... చూపబోతున్నట్లయితే
  rationale: ‘మీలో చేయడం ఉన్నట్లయితే’ అనే హీబ్రూ నిర్మాణంలోని ఉద్దేశం లేదా ముందున్న చర్య భావాన్ని సందర్భానుగుణంగా వ్యక్తపరుస్తుంది.
- source_word: חֶסֶד וֶאֱמֶת
  choice: దయను, నమ్మకత్వాన్ని
  rationale: సంబంధంలో చూపే దయతో కూడిన నిబద్ధతను, ఆధారపడదగిన విశ్వసనీయతను రెండు అంశాలుగానే నిలుపుతుంది; ‘సత్యం’ అని మాత్రమే అనువదిస్తే ఈ సందర్భంలోని విశ్వసనీయ ప్రవర్తన భావం మసకబారవచ్చు.
- source_word: אֶת אֲדֹנִי
  choice: నా యజమాని పట్ల
  rationale: ఆ దయ, నమ్మకత్వం ఎవరిపట్ల చూపబడాలో సహజమైన తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: הַגִּידוּ לִי
  choice: నాకు చెప్పండి
  rationale: కుటుంబం నుంచి నేరుగా నిర్ణయం కోరే ఆజ్ఞార్థక వాక్యానికి సరళమైన, గౌరవప్రదమైన రూపం.
- source_word: וְאִם לֹא
  choice: లేకపోతే అదీ
  rationale: అనుకూల నిర్ణయం కాకపోయినా దానిని కూడా స్పష్టంగా తెలియజేయాలని కోరుతున్న వ్యతిరేక ప్రత్యామ్నాయాన్ని తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: וְאֶפְנֶה
  choice: అప్పుడు నేను ... తిరుగుతాను
  rationale: కోహోర్టేటివ్‌లోని తదుపరి ఉద్దేశపూర్వక చర్యను తెలుగులో సహజమైన సంకల్పం/పర్యవసాన రూపంలో తెలియజేస్తుంది.
- source_word: עַל יָמִין אוֹ עַל שְׂמֹאל
  choice: కుడివైపో ఎడమవైపో
  rationale: మరో మార్గాన్ని ఎంచుకోవడం అనే రూపకార్థం ఉన్నప్పటికీ, అర్థమయ్యే హీబ్రూ దిశా చిత్రాన్ని యథాతథంగా నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన సంభాషణ శైలి. హీబ్రూ దిశా రూపకాన్ని నిలిపి, వాక్యాన్ని సాధారణ పాఠకులకు సహజంగా ఉండేలా రూపొందించాం.
