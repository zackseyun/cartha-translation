source:
  edition: WLC
  text: וְ/יִצְחָק֙ בָּ֣א מִ/בּ֔וֹא בְּאֵ֥ר לַחַ֖י רֹאִ֑י וְ/ה֥וּא יוֹשֵׁ֖ב בְּ/אֶ֥רֶץ הַ/נֶּֽגֶב׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/062.yaml
  text: Isaac had come from Beer-lahai-roi[b][a], and he was dwelling in the land of the Negev.
translation:
  language: te
  text: ఇస్సాకు బెయేర్-లహయి-రోయి[a] నుండి వచ్చాడు[b]; అతడు నెగెవు ప్రాంతంలో నివసించేవాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: బెయేర్-లహయి-రోయి హాగరుతో ఇంతకు ముందు సంబంధం ఉన్న స్థలం (ఆది 16:14 చూడండి).
    reason: cross_reference
  - marker: b
    text: లేదా, “ఇస్సాకు బెయేర్-లహయి-రోయి నుండి వచ్చి ఉన్నాడు.” హెబ్రీ క్రియను సందర్భానుసారం సాధారణ భూతకాలంగా లేదా భూతపూర్వకాలంగా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּא מִבּוֹא
  choice: నుండి తిరిగి వచ్చాడు
  rationale: ఈ సంక్షిప్త హెబ్రీ నిర్మాణం ప్రయాణపు మూలస్థానాన్ని సూచిస్తుంది. సందర్భంలో సహజమైన తెలుగుకోసం ‘తిరిగి వచ్చాడు’ అని ఇచ్చాం; అయితే క్రియ స్వయంగా తిరుగు ప్రయాణాన్ని స్పష్టంగా చెప్పదు, అందుకే ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: בְּאֵר לַחַי רֹאִי
  choice: బెయేర్-లహయి-రోయి
  rationale: స్థలపేరును అనువదించకుండా, దాని సంయుక్త రూపం కనిపించేలా లిప్యంతరీకరించాం.
- source_word: יוֹשֵׁב
  choice: నివసిస్తున్నాడు
  rationale: హెబ్రీ కృదంతం కొనసాగుతున్న నివాస స్థితిని సూచిస్తుంది; ఆధునిక సహజ తెలుగులో వర్తమాన కొనసాగింపు రూపం ఆ భావాన్ని అందిస్తుంది.
- source_word: בְּאֶרֶץ הַנֶּגֶב
  choice: నెగెవు ప్రాంతంలో
  rationale: אֶרֶץ అనే భూభాగ భావాన్నీ, הַנֶּגֶב అనే భౌగోళిక నామాన్నీ సహజమైన తెలుగులో కలిపి వ్యక్తం చేస్తుంది.
- source_word: וְהוּא
  choice: అతడు
  rationale: హెబ్రీలోని స్పష్టమైన సర్వనామాన్ని నిలిపి, తెలుగులో వాక్య విభజన ద్వారా నేపథ్య నివాస సమాచారాన్ని సహజంగా అందించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సహజంగా, గౌరవప్రదంగా ఉండే శైలి. మూలంలోని రెండు సమన్విత భాగాలను తెలుగు ప్రవాహం కోసం రెండు వాక్యాలుగా ఇచ్చాం. పాదటిప్పణి గుర్తులన్నీ ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
