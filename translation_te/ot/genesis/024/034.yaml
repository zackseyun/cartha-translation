translation:
  language: te
  text: అప్పుడు అతడు, “నేను అబ్రాహాము సేవకుణ్ణి[a]” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దాసుణ్ణి.”
