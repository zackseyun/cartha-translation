lexical_decisions:
- source_word: וַיֹּאמַר
  choice: అప్పుడు అతడు … అన్నాడు
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది. సహజమైన తెలుగు కథనశైలిలో ‘అప్పుడు’ ఆ క్రమాన్ని తెలియజేస్తుంది; ఉక్తిని అనుసరించి ‘అన్నాడు’ ఉంచడం తెలుగు వాక్యనిర్మాణానికి అనుగుణం.
- source_word: עֶבֶד
  choice: సేవకుడు
  rationale: ఈ పదానికి ‘సేవకుడు’ లేదా ‘దాసుడు’ అనే అర్థాలు ఉండవచ్చు. ఇక్కడ అబ్రాహాము ఇంటిలో తన పాత్రను గౌరవపూర్వకంగా పరిచయం చేసుకుంటున్న సందర్భంలో ‘సేవకుడు’ సహజంగా సరిపోతుంది; బంధిత స్థితిని ప్రధానార్థంగా నిర్ధారించకుండా ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: אַבְרָהָם
  choice: అబ్రాహాము
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపాన్ని ఉపయోగించాం.
- source_word: אָנֹכִי
  choice: నేను … సేవకుణ్ణి
  rationale: స్వతంత్ర సర్వనామం స్పష్టమైన స్వీయ పరిచయాన్ని ఇస్తుంది. తెలుగు నామవాచక విధేయ నిర్మాణంలో ‘నేను … సేవకుణ్ణి’ సహజంగా ఆ భావాన్ని వ్యక్తపరుస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలిని అనుసరించాం. ‘సేవకుణ్ణి’ సాధారణ పాఠకులకు స్పష్టంగా ఉండగా, హీబ్రూ పదంలోని ‘దాసుడు’ అనే భావసాధ్యతను పాదసూచికలో నిలిపాం.
