- from: ఆ యువతి చూడడానికి ఎంతో అందంగా ఉంది. ఆమె కన్య; ఏ పురుషుడూ ఆమెను ఎరుగలేదు[a]. ఆమె నీటి ఊట[b] దగ్గరికి దిగి, తన కుండను నింపుకొని, పైకి వచ్చింది.
  to: ఆ యువతి రూపంలో ఎంతో అందమైనది. ఆమె కన్య; ఏ పురుషుడూ ఆమెను ఎరుగలేదు[a]. ఆమె నీటి ఊటకు దిగి, తన కుండను నింపుకొని, పైకి వచ్చింది.
  rationale: The revision restores the precise directional sense of the Hebrew (“to the spring”) without changing the verse’s meaning. It also makes the first footnote’s relationship to the retained Hebrew euphemism clearer. The b footnote remains anchored to “నీటి ఊట” in the revised text.
