id: GEN.24.16
reference: Genesis 24:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הַֽ/נַּעֲרָ֗ טֹבַ֤ת מַרְאֶה֙ מְאֹ֔ד בְּתוּלָ֕ה וְ/אִ֖ישׁ לֹ֣א יְדָעָ֑/הּ וַ/תֵּ֣רֶד הָ/עַ֔יְנָ/ה וַ/תְּמַלֵּ֥א כַדָּ֖/הּ וַ/תָּֽעַל׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/016.yaml
  text: The young woman was very beautiful in appearance[a], a virgin; no man had known her. She went down to the spring, filled her jar[b], and came up.
translation:
  language: te
  text: ఆ యువతి రూపంలో ఎంతో అందమైనది. ఆమె కన్య; ఏ పురుషుడూ ఆమెను ఎరుగలేదు[a]. ఆమె నీటి ఊటకు దిగి, తన కుండను నింపుకొని, పైకి వచ్చింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఏ పురుషుడూ ఆమెతో లైంగిక సంబంధం కలిగివుండలేదు.’ హీబ్రూలో అక్షరార్థంగా, ‘ఏ పురుషుడూ ఆమెను ఎరుగలేదు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנַּעֲרָ
  choice: ఆ యువతి
  rationale: נַעֲרָה వివాహ వయసులో ఉన్న యువ స్త్రీని సూచించగలదు. ఆధునిక ప్రామాణిక తెలుగులో ‘యువతి’ సహజంగా ఉండి, ‘బాలిక’ అనే అతి చిన్న వయసు భావాన్ని నివారిస్తుంది.
- source_word: טֹבַת מַרְאֶה מְאֹד
  choice: చూడడానికి ఎంతో అందంగా ఉంది
  rationale: ఈ పదబంధం ఆమె రూపంలోని అందాన్ని מְאֹד ద్వారా బలంగా వర్ణిస్తుంది. ఈ తెలుగు రూపం దృశ్య సౌందర్యంపై ఉన్న దృష్టిని సహజంగా నిలుపుతుంది.
- source_word: בְּתוּלָה
  choice: కన్య
  rationale: కథన సందర్భంలో בְּתוּלָה కన్యత్వాన్ని నేరుగా సూచిస్తుంది; ‘కన్య’ సంక్షిప్తమైన, గౌరవప్రదమైన తెలుగు పదం.
- source_word: וְאִישׁ לֹא יְדָעָהּ
  choice: ఏ పురుషుడూ ఆమెను ఎరుగలేదు
  rationale: יָדַע అనే ‘తెలుసుకొను/ఎరుగు’ క్రియ ఇక్కడ లైంగిక సంబంధానికి హీబ్రూ సభ్యోక్తిగా ఉంది. ‘ఎరుగలేదు’ మూలంలోని సాహిత్య సంయమనాన్ని, ఉద్దేశపూర్వక సభ్యోక్తిని నిలుపుతుంది; భావాన్ని పాదసూచిక స్పష్టం చేస్తుంది.
- source_word: הָעַיְנָה
  choice: నీటి ఊట దగ్గరికి
  rationale: עַיִן ఇక్కడ సహజంగా ఉబికే నీటి ఊటను సూచిస్తుంది; అది בְּאֵר అనే బావికి వాడే పదం కాదు. దిశను సూచించే హీబ్రూ రూపాన్ని ‘దగ్గరికి’ తెలియజేస్తుంది.
- source_word: כַדָּהּ
  choice: తన కుండను
  rationale: כַּד నీరు తెచ్చుకోవడానికి ఉపయోగించే కుండ లేదా పాత్ర. కర్తనే దాని యజమానిగా స్పష్టంగా సూచించేందుకు తెలుగులో ‘తన కుండను’ సహజం.
- source_word: וַתָּעַל
  choice: పైకి వచ్చింది
  rationale: עָלָה పైకి వెళ్లడం లేదా రావడం అని అర్థం. అంతకుముందు ఆమె దిగినదానికి ఉన్న స్థలগত వ్యత్యాసాన్ని ఈ రూపం నిలుపుతుంది.
theological_decisions:
- issue: ‘ఆమెను ఎరుగలేదు’ అనే హీబ్రూ సభ్యోక్తి
  choice: సభ్యోక్తిని ప్రధాన పాఠ్యంలో నిలిపి, లైంగిక భావాన్ని పాదసూచికలో వివరించడం
  alternative: ఏ పురుషుడూ ఆమెతో లైంగిక సంబంధం పెట్టుకోలేదు
  rationale: మూలంలోని ‘తెలుసుకొను’ అనే ఉద్దేశపూర్వక సాహిత్య సభ్యోక్తిని నేరుగా వివరణాత్మక వాక్యంగా మార్చకుండా నిలుపుతుంది; అదే సమయంలో పాఠకుడికి ఉద్దేశించిన అర్థం అందుబాటులో ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. హీబ్రూ వాక్యారంభంలోని וְ సాధారణ కథన అనుసంధానంగా ఉండటంతో అదనంగా ‘ఇప్పుడు’ చేర్చలేదు. పాదసూచిక గుర్తులను అవి వివరించే పదబంధాల దగ్గరే ఉంచాం.
