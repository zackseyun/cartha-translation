source:
  edition: WLC
  text: וַ/יְבִאֶ֣/הָ יִצְחָ֗ק הָ/אֹ֨הֱלָ/ה֙ שָׂרָ֣ה אִמּ֔/וֹ וַ/יִּקַּ֧ח אֶת רִבְקָ֛ה וַ/תְּהִי ל֥/וֹ לְ/אִשָּׁ֖ה וַ/יֶּאֱהָבֶ֑/הָ וַ/יִּנָּחֵ֥ם יִצְחָ֖ק אַחֲרֵ֥י אִמּֽ/וֹ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/067.yaml
  text: And Isaac brought her into the tent of Sarah his mother[a], and he took Rebekah, and she became his wife, and he loved her[b]. So Isaac was comforted after his mother's death.
translation:
  language: te
  text: ఇస్సాకు ఆమెను తన తల్లి శారా గుడారంలోకి తీసుకువచ్చాడు[a]. అతడు రిబ్కాను తీసుకున్నాడు; ఆమె అతనికి భార్య అయింది, అతడు ఆమెను ప్రేమించాడు. తన తల్లి చనిపోయిన తర్వాత ఇస్సాకు ఓదార్పు పొందాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘తన తల్లి శారా గుడారంలోకి.’ హీబ్రూ పదక్రమం ఈ రెండు అమరికలకూ వీలు ఇస్తుంది; ప్రాథమిక భావం ఒకటే.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా ‘తన తల్లి తర్వాత.’ సందర్భంలో దీని భావం తన తల్లిని కోల్పోయిన తర్వాత, అంటే ఆమె మరణించిన తర్వాత; అయితే ‘మరణం’ అనే పదం హీబ్రూ పాఠ్యంలో స్పష్టంగా లేదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבִאֶהָ
  choice: ఆమెను … తీసుకువచ్చాడు
  rationale: בוא ధాతువు హిఫీల్ రూపం, 3వ పురుష ఏకవచన స్త్రీలింగ ప్రత్యయంతో, ‘ఆమెను వచ్చేలా చేశాడు/తీసుకువచ్చాడు’ అని అర్థం. తెలుగు కథనంలో ‘తీసుకువచ్చాడు’ సహజంగా ఉంది.
- source_word: הָאֹהֱלָה
  choice: గుడారంలోకి
  rationale: אֹהֶל పదానికి ఉన్న దిశాసూచక ה గుడారం వైపు, సందర్భంలో దాని లోపలికి జరిగిన కదలికను సూచిస్తుంది.
- source_word: שָׂרָה אִמּוֹ
  choice: తన తల్లి శారా
  rationale: ఈ పదబంధం శారాను ఇస్సాకు తల్లిగా గుర్తిస్తుంది. తెలుగు స్వాభావిక పదక్రమంలో ‘తన తల్లి శారా గుడారం’ అని ఇవ్వబడింది.
- source_word: וַיִּקַּח אֶת־רִבְקָה
  choice: రిబ్కాను తీసుకున్నాడు
  rationale: לקח యొక్క ప్రాథమిక అర్థమైన ‘తీసుకొను’ను నిలిపి ఉంచుతుంది. తరువాతి వాక్యభాగమే ఆమె అతనికి భార్య అయిందని స్పష్టంగా చెబుతున్నందున, రెండింటినీ ‘వివాహం చేసుకున్నాడు’ అనే ఒక్క భావంగా కలపలేదు.
- source_word: וַתְּהִי לוֹ לְאִשָּׁה
  choice: ఆమె అతనికి భార్య అయింది
  rationale: היה + ל + אשה అనే నిర్మాణం వివాహ సంబంధ స్థితిని సూచిస్తుంది; ఈ అనువాదం కథనంలోని క్రమాన్ని నిలిపి ఉంచుతుంది.
- source_word: וַיֶּאֱהָבֶהָ
  choice: అతడు ఆమెను ప్రేమించాడు
  rationale: אהב యొక్క సాధారణ అర్థం ‘ప్రేమించు’; దానిని నేరుగా, సహజంగా అనువదించింది.
- source_word: וַיִּנָּחֵם
  choice: ఓదార్పు పొందాడు
  rationale: ఇక్కడ נחם నిఫాల్ రూపం పశ్చాత్తాపం కాకుండా ఓదార్పు పొందడాన్ని సూచిస్తుంది.
- source_word: אַחֲרֵי אִמּוֹ
  choice: తన తల్లి చనిపోయిన తర్వాత
  rationale: అక్షరార్థంగా ‘తన తల్లి తర్వాత’ అయినా, ఆదికాండం 23 సందర్భంలో ఇది తల్లి మరణానంతర దుఃఖాన్ని సూచిస్తుంది. తెలుగులో భావం స్పష్టంగా, సహజంగా ఉండేందుకు ‘చనిపోయిన’ అని వ్యక్తం చేసి, మూలంలోని సంక్షిప్త రూపాన్ని పాదసూచికలో తెలిపింది.
theological_decisions:
- issue: אַחֲרֵי אִמּוֹలో ‘మరణం’ అనే పదం స్పష్టంగా లేకపోవడం
  choice: ప్రధాన పాఠ్యంలో ‘తన తల్లి చనిపోయిన తర్వాత’
  alternative: ‘తన తల్లి తర్వాత’ లేదా ‘తన తల్లి విషయమై’
  rationale: ముందటి అధ్యాయంలో శారా మరణం, ఇస్సాకు పొందిన ఓదార్పు అనే సందర్భం మరణానంతర భావాన్ని బలంగా నిర్ధారిస్తుంది. అయితే మూలంలో ‘మరణం’ అనే నామవాచకం లేదన్న విషయాన్ని పాదసూచిక సంరక్షిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. ‘రిబ్కాను తీసుకున్నాడు; ఆమె అతనికి భార్య అయింది’ అనే క్రమం మూలంలోని రెండు వేర్వేరు క్రియలను నిలిపి ఉంచుతుంది. ‘ఓదార్పు పొందాడు’ సాధారణ పాఠకునికి సహజంగా ఉండి, నిఫాల్ భావాన్ని తెలియజేస్తుంది.
