source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֲלֵ/הֶם֙ אַל תְּאַחֲר֣וּ אֹתִ֔/י וַֽ/יהוָ֖ה הִצְלִ֣יחַ דַּרְכִּ֑/י שַׁלְּח֕וּ/נִי וְ/אֵלְכָ֖ה לַֽ/אדֹנִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/056.yaml
  text: But he said to them[a], “Do not delay me, since Yahweh has made my journey successful. Send me away so that I may go to my master.”
translation:
  language: te
  text: అయితే అతడు వారితో, “నన్ను ఆలస్యం చేయవద్దు. యాహ్వే నా ప్రయాణాన్ని[a] సఫలం చేశాడు. నా యజమాని దగ్గరకు వెళ్లడానికి నన్ను పంపించండి” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ‘నా మార్గాన్ని’; ఇక్కడ అది సేవకుని ప్రయాణాన్ని లేదా కార్యాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵהֶם
  choice: అయితే అతడు వారితో ... అన్నాడు
  rationale: వావ్ వరుస కథనాన్ని ముందుకు నడిపిస్తుంది; ముందు వారు ప్రతిపాదించిన ఆలస్యానికి ప్రతిస్పందనగా ఉన్న వ్యతిరేక భావాన్ని ‘అయితే’ సహజంగా తెలియజేస్తుంది.
- source_word: אַל תְּאַחֲרוּ אֹתִי
  choice: నన్ను ఆలస్యం చేయవద్దు
  rationale: אַל తో కూడిన హిఫిల్ రూపం నిషేధాన్ని, אחר ఈ సందర్భంలో ఒకరిని ఆలస్యం చేయడం లేదా నిలిపివేయడం అనే భావాన్ని ఇస్తుంది.
- source_word: הִצְלִיחַ דַּרְכִּי
  choice: నా ప్రయాణాన్ని సఫలం చేశాడు
  rationale: צלח హిఫిల్ రూపం విజయవంతం చేయడం అనే దైవకారక భావాన్ని వ్యక్తం చేస్తుంది; דֶּרֶךְ అక్షరార్థంగా ‘మార్గం’ అయినా ఇక్కడ సేవకుని ప్రయాణం లేదా అప్పగించబడిన కార్యాన్ని సూచిస్తుంది.
- source_word: שַׁלְּחוּנִי
  choice: నన్ను పంపించండి
  rationale: שלח పియేల్ ఆజ్ఞారూపం, మొదటి పురుష ఏకవచన ప్రత్యయంతో, తనను బయలుదేరనివ్వమని చేసే విజ్ఞప్తిని సూచిస్తుంది.
- source_word: וְאֵלְכָה לַאדֹנִי
  choice: నేను నా యజమాని దగ్గరికి వెళ్తాను
  rationale: కోహోర్టేటివ్ రూపం సేవకుని ఉద్దేశిత తదుపరి చర్యను తెలియజేస్తుంది. אֲדֹנִי ఇక్కడ దేవుని బిరుదు కాదు, అబ్రాహామును సూచిస్తుంది; అందువల్ల ‘నా యజమాని’ స్పష్టంగా ఉంటుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: హీబ్రూ పాఠంలో చతురక్షర దైవనామం నేరుగా ఉంది. ఆధునిక తెలుగు బైబిల్ పాఠకులకు సుపరిచితమైన, దైవనామంగా స్పష్టమైన ‘యెహోవా’ రూపాన్ని ఉపయోగించాం; దీనిని సాధారణ బిరుదైన ‘ప్రభువు’గా మార్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని సంక్షిప్త విజ్ఞప్తి, దైవకారక విజయం, సేవకుడు–యజమాని సంబంధం స్పష్టంగా నిలుపబడ్డాయి.
