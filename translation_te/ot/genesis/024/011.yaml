  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరతను కాపాడుతూ సాధారణ పాఠకులకు సులభంగా ఉండే వాక్యనిర్మాణం. హెబ్రీలోని రెండు సమాంతర కాల సూచనలను అర్థం కోల్పోకుండా రెండు తెలుగు వాక్యాలుగా అందించాం.
