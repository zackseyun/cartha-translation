source:
  edition: WLC
  text: וַ/יַּבְרֵ֧ךְ הַ/גְּמַלִּ֛ים מִ/ח֥וּץ לָ/עִ֖יר אֶל בְּאֵ֣ר הַ/מָּ֑יִם לְ/עֵ֣ת עֶ֔רֶב לְ/עֵ֖ת צֵ֥את הַ/שֹּׁאֲבֹֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/011.yaml
  text: And he made the camels kneel down outside the city by the well of water at evening time[b][a], at the time when the women go out to draw water.
translation:
  language: te
  text: సాయంకాలంలో, నీళ్లు తోడే స్త్రీలు బయటకు వెళ్లే సమయంలో, అతడు పట్టణం వెలుపల నీటి బావి దగ్గర ఒంటెలను మోకరింపజేశాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּבְרֵךְ
  choice: మోకరింపజేశాడు
  rationale: ברך హిఫీల్ రూపం ఇక్కడ ఒంటెలను మోకాళ్లపై కూర్చోబెట్టే కారక చర్యను సూచిస్తుంది. ‘మోకరింపజేశాడు’ ఆ చర్యను సహజంగా, సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: הַגְּמַלִּים
  choice: ఒంటెలను
  rationale: నిర్దిష్ట బహువచన నామవాచకం; సందర్భంలో ముందుగా ప్రస్తావించబడిన ప్రయాణపు ఒంటెలను సూచిస్తుంది.
- source_word: מִחוּץ לָעִיר
  choice: పట్టణం వెలుపల
  rationale: מִחוּץ అంటే ‘వెలుపల’; עִירకు ‘పట్టణం’ లేదా ‘నగరం’ అనే అర్థాలున్నాయి. ఈ ప్రాచీన నివాస స్థల సందర్భంలో సహజమైన ‘పట్టణం’ ఎంచుకోబడింది.
- source_word: אֶל בְּאֵר הַמָּיִם
  choice: నీటి బావి దగ్గర
  rationale: אֶל కదలికను సూచించినా, ఒంటెలను మోకరింపజేసిన తర్వాతి స్థానాన్ని తెలుగులో ‘దగ్గర’ సహజంగా వ్యక్తపరుస్తుంది; ‘నీటి బావి’ మూలంలోని స్పష్టమైన పదబంధాన్ని నిలుపుతుంది.
- source_word: לְעֵת עֶרֶב
  choice: అది సాయంకాలం
  rationale: ఈ పదబంధం సాయంకాల సమయాన్ని సూచిస్తుంది. తరువాతి సమాంతర కాలపదబంధంతో తెలుగులో సహజంగా కలవడానికి ప్రత్యేక వాక్యంగా వ్యక్తీకరించబడింది.
- source_word: לְעֵת צֵאת הַשֹּׁאֲבֹת
  choice: నీళ్లు చేదుకునే స్త్రీలు బయలుదేరే సమయం
  rationale: הַשֹּׁאֲבֹת స్త్రీలింగ బహువచన కృదంతం కాబట్టి ‘స్త్రీలు’ స్పష్టంగా ఇవ్వబడింది. צֵאת బయలుదేరడాన్ని, నీరు చేదే వారి సాధారణ కార్యాన్ని పదబంధం సహజంగా తెలియజేస్తుంది.
