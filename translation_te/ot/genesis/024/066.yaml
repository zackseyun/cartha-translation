translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. మూలంలోని పదక్రమాన్ని యాంత్రికంగా అనుసరించకుండా, అర్థాన్ని కాపాడుతూ తెలుగు వాక్యనిర్మాణానికి అనుగుణంగా అమర్చాం. రెండు పదసంబంధ అనిశ్చితులను పాదసూచికల్లో నిలిపాం.
