source:
  edition: WLC
  text: וַ/יְסַפֵּ֥ר הָ/עֶ֖בֶד לְ/יִצְחָ֑ק אֵ֥ת כָּל הַ/דְּבָרִ֖ים אֲשֶׁ֥ר עָשָֽׂה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/066.yaml
  text: And the servant told Isaac all the things that he had done[a][b].
translation:
  language: te
  text: అప్పుడు ఆ సేవకుడు తాను చేసిన సంగతులన్నిటినీ ఇస్సాకుకు వివరించాడు.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘సంగతులు’కు బదులుగా ‘విషయాలు’ లేదా ‘మాటలు’ అని కూడా అనువదించవచ్చు; హీబ్రూ דְּבָרִים సందర్భానుసారం మాటలు, విషయాలు, లేదా సంఘటనలను సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: ‘సేవకుడు’కు బదులుగా ‘దాసుడు’ అని కూడా అనువదించవచ్చు; హీబ్రూ עֶבֶד రెండింటినీ సూచించగలదు. ఇక్కడ అతని బంధిత స్థితికన్నా అతని పాత్రకు ప్రాధాన్యం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְסַפֵּר
  choice: వివరించాడు
  rationale: పీయేల్ రూపం ఇక్కడ జరిగినదంతా క్రమంగా తెలియజేయడాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘వివరించాడు’ సహజంగా ఉండి, కేవలం చెప్పడం కంటే జరిగిన సంగతులను నివేదించే భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: הָעֶבֶד
  choice: ఆ సేవకుడు
  rationale: עֶבֶד అనే పదానికి ‘సేవకుడు’ లేదా ‘దాసుడు’ అనే అర్థాలు ఉండవచ్చు. ఈ సందర్భంలో అతని బంధిత స్థితికన్నా అప్పగించబడిన పనిని నిర్వర్తించే పాత్ర ప్రధానంగా ఉంది; అందువల్ల ‘సేవకుడు’ సందర్భోచితం.
- source_word: לְיִצְחָק
  choice: ఇస్సాకుకు
  rationale: יִצְחָק అనే పేరును ప్రామాణిక తెలుగు బైబిలు వాడుకకు అనుగుణంగా ‘ఇస్సాకు’ అని లిప్యంతరీకరించి, దత్తివిభక్తితో ఇచ్చాం.
- source_word: אֵת כָּל הַדְּבָרִים
  choice: సంగతులన్నిటినీ
  rationale: דְּבָרִים సందర్భానుసారం మాటలు, విషయాలు, లేదా సంఘటనలను సూచించగలదు. ఇక్కడ సేవకుని ప్రయాణం, చర్యలు, వాటి పరిణామాలు ఉద్దేశించబడ్డాయి కాబట్టి ‘సంగతులన్నిటినీ’ విస్తృత భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: אֲשֶׁר עָשָׂה
  choice: తాను చేసిన
  rationale: హీబ్రూ క్రియకు వ్యాకరణపరంగా సేవకుడే కర్త. ‘తాను చేసిన’ అనే రూపం ఈ సూచనను స్పష్టంగా చేస్తూ, వివరించడానికి ముందు పూర్తయిన చర్యలను సహజ తెలుగు కథనశైలిలో తెలియజేస్తుంది.
