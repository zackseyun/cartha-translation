  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: הִנֵּֽה רִבְקָ֥ה לְ/פָנֶ֖י/ךָ קַ֣ח וָ/לֵ֑ךְ וּ/תְהִ֤י אִשָּׁה֙ לְ/בֶן אֲדֹנֶ֔י/ךָ כַּ/אֲשֶׁ֖ר דִּבֶּ֥ר יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/051.yaml
  text: Look[a], Rebekah is before you. Take her and go, and let her be the wife of your master's son, just as Yahweh has spoken.
translation:
  language: te
  text: “ఇదిగో, రిబ్కా నీ ఎదుటే ఉంది. ఆమెను తీసుకొని వెళ్లు. యహ్వే చెప్పినట్టే ఆమె నీ యజమాని కుమారునికి భార్యగా ఉండాలి[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆమె నీ యజమాని కుమారునికి భార్య కావాలి.” హీబ్రూ జస్సివ్ రూపాన్ని సందర్భానుసారం ‘భార్యగా ఉండాలి’ లేదా ‘భార్య కావాలి’ అని వ్యక్తం చేయవచ్చు.
    reason: జస్సివ్ క్రియారూపంలో ప్రతిఫలించే ‘ఉండు/కావు’ అనే సాధ్యమైన ప్రత్యామ్నాయ వ్యక్తీకరణను సహజ ఆధునిక తెలుగులో నిలుపుటకు.
lexical_decisions:
- source_word: הִנֵּה
  choice: ఇదిగో
  rationale: ఎదుట ఉన్న వ్యక్తివైపు వెంటనే దృష్టి మళ్లించే సూచనార్థక అవ్యయానికి సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: רִבְקָה
  choice: రిబ్కా
  rationale: తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన పేరురూపం; మూలంలోని వ్యక్తిపేరును అనువదించకుండా లిప్యంతరీకరిస్తుంది.
- source_word: לְפָנֶיךָ
  choice: నీ ఎదుటే ఉంది
  rationale: అక్షరార్థమైన ‘నీ ఎదుట’ భావాన్ని నిలుపుతూ, ఆమె అక్కడ ప్రత్యక్షంగా సిద్ధంగా ఉందనే సందర్భార్థాన్ని ‘ఉంది’ మరియు ఉద్ఘాటనార్థక ‘ఏ’తో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: קַח וָלֵךְ
  choice: ఆమెను తీసుకొని వెళ్లు
  rationale: వరుసగా ఉన్న రెండు ఆజ్ఞలను నిలుపుతుంది; తెలుగులో స్పష్టత కోసం సందర్భంలో ప్రత్యక్షంగా ఉన్న స్త్రీలింగ కర్మ ‘ఆమెను’ చేర్చబడింది.
- source_word: וּתְהִי אִשָּׁה
  choice: భార్యగా ఉండాలి
  rationale: హీబ్రూ జస్సివ్‌లోని అనుమతి, సంకల్పం లేదా నిర్ణయ భావాన్ని సందర్భానుసారంగా సహజ తెలుగులో వ్యక్తం చేస్తుంది; ‘కావాలి’ అని అనువదించి మార్పు భావాన్ని తప్పనిసరిగా రుద్దదు.
- source_word: לְבֶן אֲדֹנֶיךָ
  choice: నీ యజమాని కుమారునికి
  rationale: వివాహ సంబంధాన్ని సూచించే לְ ను తెలుగు దత్తివిభక్తి ‘కు’తో సహజంగా చూపిస్తుంది; సేవకుడు–యజమాని సందర్భంలో אֲדֹנֶיךָ కు ‘నీ యజమాని’ సరిపోతుంది.
- source_word: כַּאֲשֶׁר דִּבֶּר
  choice: చెప్పినట్టే
  rationale: దేవుడు పలికిన మాటకు అనుగుణంగా ఇదంతా జరుగుతోందనే సరిపోలికను సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: మూలపాఠంలోని దేవుని వ్యక్తిగత నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో లిప్యంతరీకరిస్తుంది.
theological_decisions:
- issue: וּתְהִי అనే జస్సివ్ రూపం యొక్క భావం
  choice: భార్యగా ఉండాలి
  alternative: భార్య అవుతుంది గాక
  rationale: ఈ సందర్భంలో కుటుంబం వివాహానికి అంగీకారం తెలుపుతూ తీసుకున్న నిర్ణయాన్ని ‘ఉండాలి’ సహజ ఆధునిక తెలుగులో తెలియజేస్తుంది. అయినప్పటికీ జస్సివ్‌ను ఆశీర్వాదం లేదా ఆకాంక్షగా కూడా గ్రహించవచ్చనే అవకాశాన్ని పాదటిప్పణి నిలుపుతుంది.
- issue: יְהוָה అనే దైవనామం
  choice: యహ్వే
  alternative: ప్రభువు
  rationale: హీబ్రూ పాఠంలో బిరుదు కాకుండా స్వనామం ఉన్నందున దానిని లిప్యంతరీకరించడం మూలరూపాన్ని స్పష్టంగా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘అగుగాక’ వంటి పాత రూపం ప్రధాన పాఠ్యంలో నివారించబడింది; దాని ఆకాంక్షార్థం పాదటిప్పణిలో సహజమైన రూపంతో ఇవ్వబడింది.
