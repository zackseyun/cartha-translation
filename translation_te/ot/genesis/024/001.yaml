source:
  edition: WLC
  text: וְ/אַבְרָהָ֣ם זָקֵ֔ן בָּ֖א בַּ/יָּמִ֑ים וַֽ/יהוָ֛ה בֵּרַ֥ךְ אֶת אַבְרָהָ֖ם בַּ/כֹּֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/001.yaml
  text: Abraham was old[a], advanced in years, and Yahweh had blessed Abraham in all things.
translation:
  language: te
  text: అబ్రాహాము వృద్ధుడు, వయస్సు బాగా మళ్లినవాడు[a]; యాహ్వే అబ్రాహామును అన్నిటిలోనూ ఆశీర్వదించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీలో, “దినాల్లోకి వచ్చాడు”; ఇది వయస్సు బాగా మళ్లిందని తెలిపే నానుడి.
    reason: మూలభాషలోని నానుడి అక్షరరూపాన్ని తెలియజేసి, ప్రధాన పాఠంలోని భావానువాదాన్ని వివరిస్తుంది.
lexical_decisions:
- source_word: וְאַבְרָהָם
  choice: అబ్రాహాము
  rationale: వావ్ ఇక్కడ కొత్త కథన భాగాన్ని కలుపుతుంది. తెలుగులో ప్రత్యేకంగా ‘ఇప్పుడు’ అని చేర్చకుండా వాక్యప్రవాహం ద్వారానే ఆ అనుసంధానాన్ని సహజంగా తెలియజేశాం.
- source_word: זָקֵן
  choice: వృద్ధుడయ్యాడు
  rationale: అబ్రాహాము వృద్ధాప్య స్థితికి చేరాడనే భావాన్ని సహజమైన, గౌరవప్రదమైన ఆధునిక తెలుగులో నేరుగా వ్యక్తం చేస్తుంది.
- source_word: בָּא בַּיָּמִים
  choice: వయస్సు బాగా మళ్లింది[a]
  rationale: అక్షరార్థంగా ‘దినాల్లోకి వచ్చాడు’ అనే హెబ్రీ నానుడి ముదిమి బాగా వచ్చిన స్థితిని సూచిస్తుంది. ప్రధాన పాఠంలో సహజమైన తెలుగు నానుడిని, పాదసూచికలో మూలరూపాన్ని ఉంచాం.
- source_word: וַיהוָה
  choice: యాహ్వే
  rationale: మూలపాఠంలోని దేవుని ప్రత్యేక నామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా పేరుగా లిప్యంతరీకరించాం.
- source_word: בֵּרַךְ
  choice: ఆశీర్వదించాడు
  rationale: పూర్తయిన క్రియ అబ్రాహాము జీవితంలో అప్పటికే కార్యరూపంలో ఉన్న దేవుని ఆశీర్వాదాన్ని కథన నేపథ్యంగా సంగ్రహిస్తుంది; తెలుగులో సాధారణ భూతకాల రూపం దీనిని సహజంగా తెలియజేస్తుంది.
- source_word: בַּכֹּל
  choice: అన్నిటిలోనూ
  rationale: ఆశీర్వాదం సమగ్రమైనదని తెలియజేస్తూ, దానిని కేవలం వస్తుసంపదకు పరిమితం చేయకుండా మూలంలోని విస్తృత భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: ఈ వచనంలో సాధారణ బిరుదు కాక దేవుని ప్రత్యేక నామం నేరుగా ఉంది. అందువల్ల దానిని ‘యాహ్వే’గా లిప్యంతరీకరించడం మూలపాఠంలోని నామాన్ని స్పష్టంగా నిలుపుతుంది.
- issue: בַּכֹּל ఆశీర్వాదపు పరిధి
  choice: అన్నిటిలోనూ
  alternative: ప్రతి విధంగానూ / సమస్తంతో
  rationale: హెబ్రీ పదబంధం ఆశీర్వాదపు సమగ్రతను తెలియజేస్తుంది; అది ఏయే అంశాలను సూచిస్తుందో వచనం నిర్దిష్టంగా చెప్పదు. ‘అన్నిటిలోనూ’ ఆ విస్తృతతను ఉంచి అనవసరంగా భౌతిక లేదా ఆధ్యాత్మిక అంశాలకే పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన కథన శైలిని అనుసరించాం. మూలంలోని ‘వృద్ధుడు’ మరియు ‘దినాల్లోకి వచ్చాడు’ అనే పునరుక్తి భావాన్ని రెండు సమాంతర పదబంధాల ద్వారా నిలిపాం; ‘ఇప్పుడు’ వంటి మూలంలో లేని కాలసూచకాన్ని చేర్చలేదు.
