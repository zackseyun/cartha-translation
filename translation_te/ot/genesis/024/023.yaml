    rationale: హీబ్రూలో రెండూ స్త్రీలింగ ఏకవచన ‘నీ’ని సూచిస్తాయి. తెలుగులో గౌరవబహువచనం ఉద్దేశిస్తే రెండు చోట్లా అదే స్థాయిని కొనసాగించాలి; లేకపోతే ‘నీ తండ్రి’ అనడం సుసంగతం.
