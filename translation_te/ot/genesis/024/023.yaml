translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి. కథకుని వాక్యంలో ‘అతడు’ వాడి, రిబ్కాతో సంభాషణలో సహజమైన మర్యాద కోసం ‘మీ తండ్రి’ అని ఉంచాం. మొదటి ప్రశ్నలోని ‘నువ్వు’ కుటుంబ గుర్తింపును అడిగే నేర, సహజ రూపాన్ని నిలుపుతుంది. మూలపాఠంలో ప్రత్యేక పాఠాంతర లేదా వ్యాఖ్యాన అవసరం లేకపోవడంతో పాదటిప్పణి చేర్చలేదు; ఇచ్చిన ఆంగ్ల పాదటిప్పణి గుర్తు దాని ఆంగ్ల ప్రధాన పాఠంతో సరిపోలకపోవడం వల్ల దాన్ని అనుసరించలేదు.
