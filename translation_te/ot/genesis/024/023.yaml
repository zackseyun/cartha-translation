  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ בַּת מִ֣י אַ֔תְּ הַגִּ֥ידִי נָ֖א לִ֑/י הֲ/יֵ֧שׁ בֵּית אָבִ֛י/ךְ מָק֥וֹם לָ֖/נוּ לָ/לִֽין־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/023.yaml
  text: And he said[a], “Whose daughter are you? Please tell me. Is there room in your father’s house for us to spend the night?”
translation:
  language: te
  text: అతడు, “నువ్వు ఎవరి కుమార్తెవు? దయచేసి నాకు చెప్పు. మాకు రాత్రి బస చేయడానికి నీ తండ్రి ఇంట్లో స్థలం ఉందా?” అని అడిగాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అతడు ... అని అడిగాడు
  rationale: హీబ్రూ క్రియ సాధారణంగా ‘అన్నాడు’ అని అర్థమిచ్చినా, ఇక్కడ ప్రత్యక్ష వాక్యమంతా ప్రశ్నలు కావడంతో సహజమైన తెలుగులో ‘అడిగాడు’ అని అనువదించడం మాటల ఉద్దేశాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: בַּת מִי אַתְּ
  choice: నువ్వు ఎవరి కుమార్తెవు?
  rationale: కుటుంబ గుర్తింపును ప్రశ్నిస్తున్న హీబ్రూ నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగులో నేరుగా వ్యక్తపరుస్తుంది.
- source_word: הַגִּידִי נָא לִי
  choice: దయచేసి నాకు చెప్పు
  rationale: נָא వల్ల అభ్యర్థనకు కలిగే మర్యాదపూర్వక మృదుత్వాన్ని ‘దయచేసి’ తెలియజేస్తుంది; లింగసూచక ఏకవచన ఆజ్ఞను సందర్భానుగుణంగా ‘చెప్పు’గా ఉంచింది.
- source_word: הֲיֵשׁ
  choice: ఉందా?
  rationale: ఉనికిని గురించి అడిగే అవ్యయాన్ని తెలుగులో సహజమైన ప్రశ్నారూపంతో అందిస్తుంది.
- source_word: בֵּית אָבִיךְ
  choice: మీ తండ్రి ఇంట్లో
  rationale: హీబ్రూ ‘నీ తండ్రి ఇల్లు’ అనే కుటుంబ-గృహ భావాన్ని నిలుపుతూ, ఆతిథ్యం కోరే సందర్భంలో మర్యాదపూర్వక సంబోధనగా ‘మీ’ వాడబడింది.
- source_word: מָקוֹם
  choice: స్థలం
  rationale: బసకు అందుబాటులో ఉన్న చోటు అనే విస్తృత భావాన్ని కాపాడుతుంది; ప్రత్యేకంగా ఒక గది ఉందని మూలం చెప్పదు.
- source_word: לָנוּ
  choice: మేము
  rationale: మాట్లాడుతున్న సేవకునితో పాటు అతని సహచరులను సూచించే ప్రథమ పురుష బహువచనాన్ని కాపాడుతుంది.
- source_word: לָלִין
  choice: రాత్రి బస చేయడానికి
  rationale: לין అనే క్రియ యొక్క రాత్రిపూట ఉండడం అనే అర్థాన్ని స్పష్టమైన, సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
