  yaml_path: translation/ot/genesis/024/057.yaml
  text: And they said[b][a], “Let us call the young woman and ask her.”
translation:
  language: te
  text: అప్పుడు వారు, “ఆ యువతిని పిలిచి, ఆమెనే అడుగుదాం[a]” అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “ఆమె నోటిని అడుగుదాం”; అంటే ఆమె స్వంత జవాబును ఆమె నుంచే నేరుగా తెలుసుకుందాం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: అప్పుడు వారు … అన్నారు
  rationale: హీబ్రూ కథనంలోని wayyiqtol క్రమాన్ని ఆధునిక తెలుగు కథనశైలిలో సహజంగా తెలియజేస్తుంది; ‘అప్పుడు’ సందర్భంలోని ప్రతిస్పందనను సూచిస్తుంది.
- source_word: נִקְרָא
  choice: పిలిచి
  rationale: సమానాధికరణ సంకల్పరూపమైన ‘మనం పిలుద్దాం’ అనే భావాన్ని, తరువాతి క్రియతో సహజంగా కలిపి ‘పిలిచి … అడుగుదాం’గా అందిస్తుంది.
- source_word: לַנַּעֲרָ
  choice: ఆ యువతిని
  rationale: నַעֲרָה ఇక్కడ వివాహయోగ్య వయస్సులోని రిబ్కాను సూచిస్తుంది. ‘యువతి’ ఆధునిక, గౌరవప్రదమైన పదం; ‘బాలిక’ అనవసరంగా చిన్న వయస్సును సూచించవచ్చు.
- source_word: וְנִשְׁאֲלָה
  choice: అడుగుదాం
  rationale: సమూహ సంకల్పాన్ని తెలియజేసే cohortative భావాన్ని స్పష్టమైన, సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: אֶת־פִּיהָ
  choice: ఆమెనే అడుగుదాం
  rationale: అక్షరార్థంగా ‘ఆమె నోటిని అడుగుదాం’ అనే హీబ్రూ నుడికారం, ఆమె స్వంత జవాబును ఆమె నుంచే నేరుగా తెలుసుకోవడాన్ని సూచిస్తుంది. ‘ఆమెనే’ ఆ ప్రత్యక్షతకు సహజమైన తెలుగులో ప్రాధాన్యం ఇస్తుంది.
