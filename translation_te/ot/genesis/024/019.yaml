  text: וַ/תְּכַ֖ל לְ/הַשְׁקֹת֑/וֹ וַ/תֹּ֗אמֶר גַּ֤ם לִ/גְמַלֶּ֨י/ךָ֙ אֶשְׁאָ֔ב עַ֥ד אִם כִּלּ֖וּ לִ/שְׁתֹּֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/019.yaml
  text: When she had finished giving him a drink[a], she said, “I will draw water for your camels also, until they have finished drinking.”
translation:
  language: te
  text: ఆమె అతనికి నీళ్లు తాగించడం పూర్తయ్యాక, “నీ ఒంటెల కోసం కూడా, అవి తాగడం పూర్తిచేసే వరకు నీళ్లు తోడుతాను” అని చెప్పింది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתְּכַל
  choice: ముగించిన తర్వాత
  rationale: כלה అనే ధాతువు ‘ముగించు, పూర్తి చేయు’ అనే అర్థాన్నిస్తుంది. తరువాతి క్రియకు ముందు ఈ చర్య పూర్తయిందనే కథన క్రమాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: לְהַשְׁקֹתוֹ
  choice: అతనికి నీళ్లు ఇచ్చి
  rationale: שקה హిఫీల్ రూపం ‘అతనికి తాగడానికి ఇవ్వడం’ అని సూచిస్తుంది. మనిషిని ఉద్దేశించిన సందర్భంలో ఇది సహజమైన తెలుగు ప్రయోగం.
- source_word: וַתֹּאמֶר
  choice: అని చెప్పింది
  rationale: אמר అనే సాధారణ కథన క్రియను తెలుగు ప్రత్యక్ష సంభాషణకు సహజమైన వాక్యాంత క్రమంలో అందించింది.
- source_word: גַּם
  choice: కూడా
  rationale: ఆ మనిషికి నీళ్లు ఇచ్చిన చర్యకు తోడు ఒంటెలకూ ఇస్తాననే అదనపు భావాన్ని నిలుపుతుంది.
- source_word: לִגְמַלֶּיךָ
  choice: నీ ఒంటెలు ... వాటికోసం
  rationale: రెండవ పురుష ఏకవచన స్వామ్య ప్రత్యయాన్ని ‘నీ’గా నిలిపి, לְ సూచించే ప్రయోజనార్థాన్ని ‘వాటికోసం’ అని స్పష్టం చేసింది.
- source_word: אֶשְׁאָב
  choice: నీళ్లు తోడుతాను
  rationale: שאב బావి లేదా నీటి వనరు నుంచి నీరు తోడడాన్ని సూచిస్తుంది. మూలంలో కర్మ స్పష్టంగా లేకపోయినా సందర్భానుసారం ‘నీళ్లు’ చేర్చడం తెలుగులో సహజం.
- source_word: עַד אִם
  choice: వరకు
  rationale: ఈ పదసముదాయం అంతిమ పరిమితిని సూచించే ‘వరకు’ అనే భావంలో వాడబడింది; పదక్షర అనువాదం తెలుగులో అసహజంగా ఉంటుంది.
- source_word: כִּלּוּ לִשְׁתֹּת
  choice: తాగడం ముగించే
  rationale: כלה పియేల్ బహువచన రూపం ఒంటెలను సూచిస్తూ, שתה క్రియార్థక నామంతో కలిసి ‘తాగడం పూర్తిచేయు’ అనే భావాన్నిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథన శైలి. హీబ్రూ వాక్యంలోని చర్యల క్రమం, ‘కూడా’ అనే అదనపు భావం, ఒంటెలు తాగి ముగించే వరకు అనే పరిమితి సంరక్షించబడ్డాయి.
