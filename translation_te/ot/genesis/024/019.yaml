review_pass:
  verdict: revise
  source_fidelity: The draft preserves the narrative sequence, the completion of giving the man a drink, the additive force of גַּם, the possessive ‘your camels,’ and the endpoint ‘until they finish drinking.’
  naturalness: ‘నీళ్లు ఇచ్చి ముగించిన తర్వాత’ is understandable, but it is slightly awkward and can momentarily suggest that the water itself was finished. Telugu more naturally expresses completion of this action as ‘అతనికి నీళ్లు తాగించడం పూర్తయ్యాక.’ Reordering the quoted clause also makes the intended scope clearer.
  terminology: ‘ఒంటెలు,’ ‘నీళ్లు తోడుతాను,’ and ‘తాగడం పూర్తిచేసే వరకు’ are appropriate modern standard Telugu renderings. No theological terminology is involved.
  issues:
  - severity: low
    issue: Awkward expression for completing the act of giving a drink
    rationale: ‘నీళ్లు ఇచ్చి ముగించిన తర్వాత’ is not wrong, but ‘అతనికి నీళ్లు తాగించడం పూర్తయ్యాక’ is more idiomatic and unambiguously refers to completion of the action represented by לְהַשְׁקֹתוֹ.
  revised_text: ఆమె అతనికి నీళ్లు తాగించడం పూర్తయ్యాక, “నీ ఒంటెల కోసం కూడా, అవి తాగడం పూర్తిచేసే వరకు నీళ్లు తోడుతాను” అని చెప్పింది.
