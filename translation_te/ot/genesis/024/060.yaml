source:
  edition: WLC
  text: וַ/יְבָרֲכ֤וּ אֶת רִבְקָה֙ וַ/יֹּ֣אמְרוּ לָ֔/הּ אֲחֹתֵ֕/נוּ אַ֥תְּ הֲיִ֖י לְ/אַלְפֵ֣י רְבָבָ֑ה וְ/יִירַ֣שׁ זַרְעֵ֔/ךְ אֵ֖ת שַׁ֥עַר שֹׂנְאָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/060.yaml
  text: And they blessed Rebekah and said to her[a], “Our sister, may you become thousands of ten thousands[b], and may your offspring possess the gate of those who hate them.”
translation:
  language: te
  text: 'వారు రిబ్కాను ఆశీర్వదించి ఆమెతో ఇలా అన్నారు: “మా సోదరీ, నీవు వేలాది పదివేలమందిగా వృద్ధి చెందుగాక[a]; నీ సంతానం తనను ద్వేషించేవారి ద్వారాన్ని స్వాధీనం చేసుకొనుగాక[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “లక్షోపలక్షలుగా” లేదా “లెక్కలేనంత జనసమూహంగా”; అక్షరార్థంగా “వేలాది పదివేలమందిగా.”
    reason: lexical_alternative
  - marker: b
    text: లేదా “తన శత్రువుల ద్వారాన్ని వారసంగా పొందుగాక.” హీబ్రూ అక్షరార్థం “తనను ద్వేషించేవారి ద్వారాన్ని స్వాధీనం చేసుకొనుగాక.” ఇక్కడ “ద్వారం” నగర బలానికీ దానిపై అధికారానికీ ప్రతీక.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבָרֲכוּ
  choice: ఆశీర్వదిస్తూ
  rationale: పియేల్ రూపం రిబ్కాపై ఆశీర్వచనం పలకడాన్ని సూచిస్తుంది; తరువాతి మాటలతో సహజంగా అనుసంధానించేందుకు ఈ రూపాన్ని ఎంచుకున్నాం.
- source_word: רִבְקָה
  choice: రిబ్కా
  rationale: హీబ్రూ పేరుకు దగ్గరగా ఉండే, తెలుగులో ప్రాచుర్యంలో ఉన్న లిప్యంతరీకరణ.
- source_word: אֲחֹתֵנוּ
  choice: మా సోదరీ
  rationale: కుటుంబ సంబంధంతో కూడిన ప్రత్యక్ష సంబోధనను సహజమైన, గౌరవప్రదమైన తెలుగులో నిలుపుతుంది.
- source_word: הֲיִי
  choice: వృద్ధి చెందుగాక
  rationale: ఇది ఆజ్ఞకన్నా ఆశీర్వచనంలోని కోరిక; ‘గాక’ రూపం ఆ భావాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది. సంఖ్యా సమూహంగా ‘అవడం’ అనే హీబ్రూ భావాన్ని తెలుగులో సహజంగా చెప్పేందుకు ‘వృద్ధి చెందు’ వాడబడింది.
- source_word: לְאַלְפֵי רְבָבָה
  choice: వేలాది పదివేలలుగా
  rationale: ‘వేలు’ మరియు ‘పదివేలు’ అనే రెండు సంఖ్యా పదాలను నిలుపుతూ, అపారమైన సంతానవృద్ధిని సూచించే హీబ్రూ అతిశయోక్తిని కాపాడుతుంది.
- source_word: וְיִירַשׁ
  choice: స్వాధీనం చేసుకొనుగాక
  rationale: ఈ సందర్భంలో ירש వారసత్వంగా పొందడం కంటే విజయంతో ఆధీనంలోకి తెచ్చుకోవడం లేదా నియంత్రించడం అనే భావాన్ని ఇస్తుంది.
- source_word: זַרְעֵךְ
  choice: నీ సంతానం
  rationale: హీబ్రూలోని సమూహార్థక ఏకవచనాన్ని తెలుగులో సహజంగా, వాగ్దాన భాషతో అనుసంధానం నిలిచేలా వ్యక్తం చేస్తుంది.
- source_word: שַׁעַר
  choice: ద్వారం
  rationale: నగర రక్షణ, అధికారం, నియంత్రణలను సూచించే స్పష్టమైన హీబ్రూ ప్రతీకను వ్యాఖ్యానించి కరిగించకుండా నిలుపుతుంది.
- source_word: שֹׂנְאָיו
  choice: తనను ద్వేషించేవారి
  rationale: హీబ్రూ ఏకవచన ప్రత్యయాన్ని సమూహార్థక ‘సంతానం’తో అనుసంధానిస్తూ, ‘శత్రువులు’ అనే సంక్షిప్త వ్యాఖ్యానానికి బదులు మూలంలోని ‘ద్వేషించేవారు’ అనే భావాన్ని ప్రత్యక్షంగా ఇస్తుంది.
theological_decisions:
- issue: సమూహార్థక ఏకవచనమైన ‘సంతానం’కు తరువాత వచ్చే ఏకవచన సూచన
  choice: నీ సంతానం తనను ద్వేషించేవారి
  alternative: నీ సంతతి వారిని ద్వేషించేవారి / నీ సంతానాన్ని ద్వేషించేవారి
  rationale: זַרְעֵךְ సమూహార్థక ఏకవచనం; שֹׂנְאָיו లోని ప్రత్యయం కూడా వ్యాకరణపరంగా ఏకవచనం. ‘సంతానం ... తనను’ అని అనువదించడం ఈ రూపాన్ని, పితృపురుషుల వాగ్దాన భాషలోని సాహిత్య ప్రతిధ్వనిని నిలుపుతుంది; దానిని బలవంతంగా బహువచనం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన ఆశీర్వచన శైలి వాడబడింది. ‘వృద్ధి చెందుగాక’, ‘స్వాధీనం చేసుకొనుగాక’ రూపాలు మూలంలోని కోరిక/ఆశీర్వాద భావాన్ని నిలుపుతాయి. ప్రధాన పాఠంలో రెండు పాదటిప్పణి గుర్తులు వాటి సంబంధిత పదబంధాల వెంట ఉంచబడ్డాయి.
