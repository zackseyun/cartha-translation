id: GEN.24.42
reference: Genesis 24:42
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וָ/אָבֹ֥א הַ/יּ֖וֹם אֶל הָ/עָ֑יִן וָ/אֹמַ֗ר יְהוָה֙ אֱלֹהֵי֙ אֲדֹנִ֣/י אַבְרָהָ֔ם אִם יֶשְׁ/ךָ נָּא֙ מַצְלִ֣יחַ דַּרְכִּ֔/י אֲשֶׁ֥ר אָנֹכִ֖י הֹלֵ֥ךְ עָלֶֽי/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/042.yaml
  text: Today I came to the spring and said[a], ‘O Yahweh, God of my master Abraham[b], if now you are prospering my way on which I am going—’
translation:
  language: te
  text: 'ఈ రోజు నేను నీటి ఊట దగ్గరకు వచ్చి ఇలా అన్నాను: “నా యజమాని అబ్రాహాము దేవుడైన యాహ్వే, నీవు దయచేసి నేను సాగుతున్న నా ప్రయాణాన్ని సఫలపరుస్తున్నావైతే—”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאָבֹא הַיּוֹם
  choice: ఈ రోజు నేను ... వచ్చి
  rationale: వావ్-క్రమ నిర్మాణం గత చర్యను తెలియజేస్తుంది; הַיּוֹם కాలాన్ని నొక్కిచెబుతుంది. ఆధునిక తెలుగులో సహజమైన క్రమాన్ని ఎంచుకున్నాం.
- source_word: הָעָיִן
  choice: నీటి ఊట
  rationale: עַיִן ఇక్కడ సహజంగా ఉబికే నీటి మూలాన్ని సూచిస్తుంది. ‘నీటి ఊట’ అనేది ‘బావి’కన్నా మూల పదానికి మరింత నిర్దిష్టంగా సరిపోతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా తెలిసిన ‘యెహోవా’ రూపంలో వ్యక్తిగత నామంగా ఉంచాం.
- source_word: אֱלֹהֵי אֲדֹנִי אַבְרָהָם
  choice: నా యజమాని అబ్రాహాము దేవుడవైన
  rationale: אֲדֹנִי ఇక్కడ దైవ బిరుదు కాదు; సేవకునికి అబ్రాహాముతో ఉన్న యజమాని–సేవక సంబంధాన్ని సూచిస్తుంది.
- source_word: אִם יֶשְׁךָ נָּא מַצְלִיחַ
  choice: నీవు ఇప్పుడు సఫలం చేస్తున్నట్లయితే
  rationale: ఈ అసంపూర్ణ, ప్రార్థనాత్మక షరతు వాక్యంలో נָא యొక్క విన్నప భావాన్నీ, צלח హిఫిల్ రూపంలోని ‘సఫలం చేయడం’ అనే దైవ కార్యాన్నీ నిలిపాం.
- source_word: דַּרְכִּי
  choice: నా ప్రయాణాన్ని
  rationale: అక్షరార్థంగా ‘నా మార్గం’; సందర్భంలో సేవకుడు చేపట్టిన ప్రయాణం లేదా కార్యయాత్రను సూచిస్తుంది. ‘నా’ అనే స్వామ్య భావాన్ని నిలిపాం.
- source_word: אֲשֶׁר אָנֹכִי הֹלֵךְ עָלֶיהָ
  choice: నేను సాగుతున్న
  rationale: అక్షరార్థంగా ‘దానిమీద నేను వెళ్తున్న’ అనే హీబ్రూ ప్రయోగాన్ని తెలుగులో సహజంగా ప్రయాణాన్ని విశేషించే రూపంలో ఇచ్చాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో వ్యక్తిగత దైవనామమే ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుతో మార్చకుండా నామరూపంగా నిలిపాం; ఆధునిక ప్రామాణిక తెలుగు బైబిలు వాడుకలో సుపరిచితమైన ‘యెహోవా’ను ఎంచుకున్నాం.
- issue: షరతు వాక్యంలోని ప్రార్థనాత్మక అసంపూర్ణత
  choice: ‘...చేస్తున్నట్లయితే—’ అని తెరిచి ఉంచడం
  alternative: ‘దయచేసి నా ప్రయాణాన్ని సఫలం చేయి’ అని పూర్తి విన్నపంగా మార్చడం
  rationale: మూలంలోని אִם నిర్మాణం తరువాతి వచనాల్లో పూర్తయ్యే షరతును ప్రారంభిస్తుంది. దానిని నేర ఆజ్ఞగా మార్చకుండా వాక్య ఉద్రిక్తతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు స్పష్టమైన శైలి. మూలంలోని షరతు వాక్య అసంపూర్ణతను చివరి దీర్ఘ విరామచిహ్నంతో నిలిపాం. ఈ ముసాయిదాలో పాదసూచికలు అవసరం లేదని నిర్ణయించాం.
