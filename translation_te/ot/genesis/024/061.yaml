  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. హీబ్రూ వావ్-క్రమంలోని వరుస చర్యలను సహజ తెలుగు అసమాపక క్రియలతో అనుసంధానించి, చివరి ప్రధాన క్రియలను స్పష్టంగా ఉంచింది.
