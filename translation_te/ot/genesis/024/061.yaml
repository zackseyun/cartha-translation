  text: וַ/תָּ֨קָם רִבְקָ֜ה וְ/נַעֲרֹתֶ֗י/הָ וַ/תִּרְכַּ֨בְנָה֙ עַל הַ/גְּמַלִּ֔ים וַ/תֵּלַ֖כְנָה אַחֲרֵ֣י הָ/אִ֑ישׁ וַ/יִּקַּ֥ח הָ/עֶ֛בֶד אֶת רִבְקָ֖ה וַ/יֵּלַֽךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/061.yaml
  text: Then Rebekah and her young women arose[a], mounted the camels, and went after the man. And the servant took Rebekah and went on his way.
translation:
  language: te
  text: అప్పుడు రిబ్కా, ఆమెతో ఉన్న యువతులు లేచి, ఒంటెలపై ఎక్కి, ఆ మనిషి వెనుక వెళ్లారు. ఆ సేవకుడు రిబ్కాను తీసుకొని వెళ్లాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתָּקָם
  choice: లేచి
  rationale: קום అనే క్రియ యొక్క ప్రాథమిక భావమైన లేవడాన్ని నిలుపుతూ, తరువాతి ప్రయాణ చర్యలకు సహజమైన తెలుగు కథన క్రమాన్ని ఇస్తుంది.
- source_word: נַעֲרֹתֶיהָ
  choice: ఆమె యువతులు
  rationale: నַעֲרָה పదం ప్రధానంగా యువ స్త్రీలను సూచిస్తుంది; సందర్భంలో వారు రిబ్కా వెంట ఉండే పరిచారికలు కావచ్చు, కానీ సేవా స్థితిని మూలపదం స్పష్టంగా చెప్పదు.
- source_word: וַתִּרְכַּבְנָה עַל הַגְּמַלִּים
  choice: ఒంటెలెక్కి
  rationale: רכב עַל ఇక్కడ ఒంటెలపై ఎక్కి ప్రయాణానికి సిద్ధపడే చర్యను సూచిస్తుంది; ‘ఒంటెలెక్కి’ సహజమైన, సంక్షిప్తమైన తెలుగు.
- source_word: אַחֲרֵי הָאִישׁ
  choice: ఆ మనిషి వెనుక
  rationale: אַחֲרֵי యొక్క ‘వెనుక/అనుసరిస్తూ’ అనే దిశాత్మక భావాన్ని దగ్గరగా నిలుపుతుంది.
- source_word: הָאִישׁ
  choice: ఆ మనిషి
  rationale: సందర్భంలో అతడు అబ్రాహాము సేవకుడే అయినప్పటికీ, ఈ చోట హీబ్రూ ‘మనిషి’ అని అంటుంది; ఆ కథన భేదాన్ని నిలిపింది.
- source_word: הָעֶבֶד
  choice: ఆ సేవకుడు
  rationale: עֶבֶד కు సేవకుడు లేదా దాసుడు అనే అర్థాలు ఉండవచ్చు; ఇక్కడ అబ్రాహాము ఇంటి బాధ్యతగల ప్రతినిధి సందర్భానికి ‘సేవకుడు’ సరిపోతుంది.
- source_word: וַיִּקַּח ... אֶת רִבְקָה
  choice: రిబ్కాను తీసుకొని
  rationale: לקח యొక్క ‘తీసుకొను’ అనే మౌలిక భావాన్ని నిలుపుతుంది; వెంట తీసుకువెళ్లడం అనే ప్రయాణసంబంధ భావం సందర్భం ద్వారా స్పష్టమవుతుంది.
- source_word: וַיֵּלַךְ
  choice: వెళ్లాడు
  rationale: הלך యొక్క సరళమైన ప్రయాణార్థాన్ని అదనపు భావం చేర్చకుండా తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
