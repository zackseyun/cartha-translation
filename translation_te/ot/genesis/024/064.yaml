  yaml_path: translation/ot/genesis/024/064.yaml
  text: Rebekah lifted up her eyes and saw Isaac[a], and she got down from the camel.
translation:
  language: te
  text: రిబ్కా కన్నులెత్తి ఇస్సాకును చూసింది. అప్పుడు ఆమె ఒంటె మీద నుంచి దిగింది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “ఒంటె మీద నుంచి పడింది.” ఇక్కడ హీబ్రూ పదబంధం ఒంటెపై నుంచి దిగడాన్ని నుడికారంగా సూచిస్తుండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּשָּׂא ... אֶת עֵינֶיהָ
  choice: కన్నులెత్తి
  rationale: ‘తన కన్నులను పైకెత్తింది’ అనే హీబ్రూ నుడికారాన్ని సహజమైన ఆధునిక తెలుగులో ‘కన్నులెత్తి’ అని వ్యక్తం చేశాం; ఇది కేవలం ‘పైకి చూసి’ కంటే మూలంలోని కథన శైలిని మెరుగుగా నిలుపుతుంది.
- source_word: וַתֵּרֶא
  choice: చూసింది
  rationale: ראה అనే క్రియ ఇక్కడ సాధారణ దృశ్యగ్రహణాన్ని సూచిస్తుంది; ‘చూసింది’ సూటిగా, సహజంగా ఉంది.
- source_word: אֶת יִצְחָק
  choice: ఇస్సాకును
  rationale: వ్యక్తి పేరును ప్రామాణిక తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: וַתִּפֹּל מֵעַל הַגָּמָל
  choice: ఒంటె మీద నుంచి దిగింది
  rationale: נפל సాధారణంగా ‘పడిపోవడం’ అని అర్థమైనా, ఈ సందర్భంలో ఒంటెపై నుంచి దిగడాన్ని సూచించే నుడికారంగా ఉండే అవకాశం ఎక్కువ. ‘దిగింది’ అనుకోకుండా కిందపడిందనే అపార్థాన్ని నివారిస్తూ సందర్భోచిత భావాన్ని స్పష్టంగా అందిస్తుంది; అక్షరార్థాన్ని పాదసూచికలో నిలిపాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. హీబ్రూ నుడికారం ‘కన్నులెత్తి’ని నిలిపి, וַתִּפֹּל లోని అక్షరార్థ–సందర్భార్థ భేదాన్ని పాదసూచికలో వెల్లడించాం.
