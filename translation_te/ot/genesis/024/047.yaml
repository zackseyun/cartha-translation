  variant: modern standard Telugu
source:
  edition: WLC
  text: וָ/אֶשְׁאַ֣ל אֹתָ֗/הּ וָ/אֹמַר֮ בַּת מִ֣י אַתְּ֒ וַ/תֹּ֗אמֶר בַּת בְּתוּאֵל֙ בֶּן נָח֔וֹר אֲשֶׁ֥ר יָֽלְדָה לּ֖/וֹ מִלְכָּ֑ה וָ/אָשִׂ֤ם הַ/נֶּ֨זֶם֙ עַל אַפָּ֔/הּ וְ/הַ/צְּמִידִ֖ים עַל יָדֶֽי/הָ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/047.yaml
  text: Then I asked her[a], saying, ‘Whose daughter are you?’ And she said, ‘The daughter of Bethuel son of Nahor[c][b], whom Milcah bore to him.’ Then I put the ring on her nose and the bracelets on her hands.
translation:
  language: te
  text: అప్పుడు నేను ఆమెను, “నీవు ఎవరి కుమార్తెవు?” అని అడిగాను. ఆమె, “నేను మిల్కా నాహోరుకు కనిన బెతూయేలు కుమార్తెను” అని చెప్పింది. అప్పుడు నేను ఆమె ముక్కుకు ముక్కెరను[a], ఆమె చేతులకు కడియాలను[b] పెట్టాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పదం సాధారణంగా ‘ఉంగరం’ లేదా ‘నగ’ అని కూడా అర్థమివ్వగలదు; అది ఆమె ముక్కుకు పెట్టబడిందని తరువాతి పదబంధం తెలియజేస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా ‘ఆమె చేతులపై’; ఈ సందర్భంలో మణికట్టులను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשְׁאַל אֹתָהּ וָאֹמַר
  choice: నేను ఆమెను … అని అడిగాను
  rationale: హీబ్రూలోని ‘ఆమెను అడిగి, అన్నాను’ అనే వరుస క్రియలను సహజమైన ఆధునిక తెలుగులో ఒకే ప్రశ్నార్థక వాక్య నిర్మాణంగా వ్యక్తం చేస్తుంది; అడగడం, పలకడం రెండింటి భావమూ నిలుస్తుంది.
- source_word: בַּת מִי אַתְּ
  choice: నీవు ఎవరి కుమార్తెవు?
  rationale: బంధుత్వాన్ని సూచించే בַּת‌ను స్పష్టంగా ఉంచుతూ హీబ్రూ ప్రశ్నకు సహజమైన తెలుగు రూపం.
- source_word: בַּת בְּתוּאֵל בֶּן נָחוֹר
  choice: నేను నాహోరు కుమారుడైన బెతూయేలు కుమార్తెను
  rationale: మూలంలోని వంశ సంబంధాన్ని యథాతథంగా, తెలుగులో సహజమైన విశేషణ నిర్మాణంతో అందిస్తుంది.
- source_word: אֲשֶׁר יָלְדָה לּוֹ מִלְכָּה
  choice: మిల్కా అతణ్ణి నాహోరుకు కనింది
  rationale: సంబంధ వాక్యాన్ని నిలిపి, לּוֹ సూచించే నాహోరుతో సంబంధాన్ని తెలుగులో స్పష్టం చేస్తుంది; ‘అతణ్ణి’ బెతూయేలును సూచిస్తుంది.
- source_word: הַנֶּזֶם עַל אַפָּהּ
  choice: ఆమె ముక్కుకు ముక్కెరను
  rationale: נֶזֶם సాధారణంగా ఉంగరాకార నగను సూచించగలిగినా, עַל אַפָּהּ దాని స్థానం ముక్కు అని నిర్దేశిస్తుంది. ‘ముక్కెర’ ఆధునిక తెలుగులో సహజమైన సందర్భోచిత పదం.
- source_word: וְהַצְּמִידִים עַל יָדֶיהָ
  choice: ఆమె చేతులకు కడియాలను
  rationale: צְמִידִים‌కు ‘కడియాలు’ స్పష్టమైన తెలుగు సమానార్థకం; יָדֶיהָను అక్షరార్థానికి దగ్గరగా ‘చేతులకు’గా ఉంచింది.
