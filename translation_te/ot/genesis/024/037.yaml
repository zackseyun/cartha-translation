translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరతను కాపాడుతూ సాధారణ పాఠకులకు అర్థమయ్యే కథన శైలి. హీబ్రూలోని ఏకవచన సమూహప్రయోగమైన ‘కనానీయుడు ... అతని దేశం’ తెలుగులో సహజత కోసం ‘కనానీయుల దేశం’గా ఇవ్వబడింది.
