  text: וַ/יַּשְׁבִּעֵ֥/נִי אֲדֹנִ֖/י לֵ/אמֹ֑ר לֹא תִקַּ֤ח אִשָּׁה֙ לִ/בְנִ֔/י מִ/בְּנוֹת֙ הַֽ/כְּנַעֲנִ֔י אֲשֶׁ֥ר אָנֹכִ֖י יֹשֵׁ֥ב בְּ/אַרְצֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/037.yaml
  text: And my master made me swear[a], saying, ‘You shall not take a wife for my son from the daughters of the Canaanites, in whose land I am dwelling.’
translation:
  language: te
  text: 'నా యజమాని నాతో ప్రమాణం చేయించి ఇలా అన్నాడు: ‘నేను నివసిస్తున్న కనానీయుల[a] దేశానికి చెందిన కుమార్తెలలో ఎవరినీ నా కుమారునికి భార్యగా తీసుకోకూడదు.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, ‘నేను అతని దేశంలో నివసిస్తున్న కనానీయుడు’ అని ఏకవచన సమూహప్రయోగం ఉంది. ఇక్కడ అది కనానీయులందరినీ సూచిస్తుంది; ‘నేను నివసిస్తున్న కనానీయుల మధ్య’ అని కూడా భావానువదించవచ్చు.
    reason: హీబ్రూలోని ఏకవచన సమూహప్రయోగం మరియు ‘అతని దేశంలో’ అనే భూభాగ-కేంద్రీకృత పదప్రయోగాన్ని వివరిస్తుంది.
lexical_decisions:
- source_word: וַיַּשְׁבִּעֵנִי
  choice: నాతో ప్రమాణం చేయిస్తూ
  rationale: שׁבע యొక్క హిఫీల్ రూపం ఒకరితో ప్రమాణం చేయించడాన్ని సూచిస్తుంది. తెలుగు వాక్యనిర్మాణంలో ఇది సహజంగా ఉండి, ప్రమాణబద్ధం చేసిన భావాన్ని నిలుపుతుంది.
- source_word: אֲדֹנִי
  choice: నా యజమాని
  rationale: ఇక్కడ సేవకుడు దేవుణ్ణి కాదు, తన మానవ అధిపతియైన అబ్రాహామును సూచిస్తున్నాడు.
- source_word: לֵאמֹר
  choice: ఇలా అన్నాడు
  rationale: ప్రత్యక్ష మాటలను పరిచయం చేసే ఈ రూపానికి ఆధునిక తెలుగు కథనంలో సహజమైన అనువాదం.
- source_word: לֹא תִקַּח
  choice: తీసుకోకూడదు
  rationale: ప్రమాణంతో కూడిన ఆదేశ సందర్భంలో ఈ రూపానికి నిషేధాత్మక బలం ఉంది; తెలుగు ప్రత్యక్ష వచనంలో ‘తీసుకోకూడదు’ ఆ బలాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: אִשָּׁה
  choice: భార్యగా
  rationale: వివాహ సంబంధంగా ‘తీసుకోవడం’ అనే సందర్భంలో אִשָּׁה అంటే సాధారణంగా స్త్రీ కాదు, భార్య.
- source_word: לִבְנִי
  choice: నా కుమారునికి
  rationale: మూలంలో కుమారుని పేరు చేర్చకుండా ‘నా కుమారునికి’ అని మాత్రమే ఉంది; అదే నిలుపబడింది.
- source_word: מִבְּנוֹת הַכְּנַעֲנִי
  choice: కనానీయుల ... కుమార్తెలలో ఎవరినీ
  rationale: హీబ్రూ ఏకవచన సమూహప్రయోగాన్ని తెలుగులో సహజమైన బహువచనంగా వ్యక్తపరుస్తూ, ‘కుమార్తెలు’ అనే కుటుంబపరమైన రూపకాన్ని నిలుపుతుంది.
- source_word: אֲשֶׁר אָנֹכִי יֹשֵׁב בְּאַרְצוֹ
  choice: నేను నివసిస్తున్న కనానీయుల దేశంలోని
  rationale: ‘అతని దేశంలో నేను నివసిస్తున్నాను’ అనే హీబ్రూ భూభాగ-కేంద్రీకృత భావాన్ని నిలుపుతూ, సమూహవాచకమైన ‘కనానీయుడు’ను తెలుగులో సహజంగా బహువచనంలో అందిస్తుంది.
- source_word: יֹשֵׁב
  choice: నివసిస్తున్న
  rationale: వర్తమానంలో కొనసాగుతున్న నివాస స్థితిని సూచించే కృదంత భావాన్ని తెలియజేస్తుంది.
