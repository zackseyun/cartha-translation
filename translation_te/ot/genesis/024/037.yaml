revisions:
- from: 'నా యజమాని నాతో ప్రమాణం చేయిస్తూ[a], ఇలా అన్నాడు: ‘నేను నివసిస్తున్న కనానీయుల దేశంలోని వారి కుమార్తెలలో ఎవరినీ నా కుమారునికి భార్యగా తీసుకోకూడదు.’'
  to: 'నా యజమాని నాతో ప్రమాణం చేయించి ఇలా అన్నాడు: ‘నేను నివసిస్తున్న కనానీయుల[a] దేశానికి చెందిన కుమార్తెలలో ఎవరినీ నా కుమారునికి భార్యగా తీసుకోకూడదు.’'
  rationale: The revision uses a completed causative for the oath, improves the Telugu syntax of the Canaanite/daughters phrase, and replaces the nonessential stylistic footnote with one that documents the Hebrew collective singular and the land-focused clause. No doctrinal interpretation has been added.
