source:
  edition: WLC
  text: יְהוָ֣ה אֱלֹהֵ֣י הַ/שָּׁמַ֗יִם אֲשֶׁ֨ר לְקָחַ֜/נִי מִ/בֵּ֣ית אָבִ/י֮ וּ/מֵ/אֶ֣רֶץ מֽוֹלַדְתִּ/י֒ וַ/אֲשֶׁ֨ר דִּבֶּר לִ֜/י וַ/אֲשֶׁ֤ר נִֽשְׁבַּֽע לִ/י֙ לֵ/אמֹ֔ר לְ/זַ֨רְעֲ/ךָ֔ אֶתֵּ֖ן אֶת הָ/אָ֣רֶץ הַ/זֹּ֑את ה֗וּא יִשְׁלַ֤ח מַלְאָכ/וֹ֙ לְ/פָנֶ֔י/ךָ וְ/לָקַחְתָּ֥ אִשָּׁ֛ה לִ/בְנִ֖/י מִ/שָּֽׁם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/007.yaml
  text: Yahweh[a], the God of heaven, who took me from my father's house and from the land of my birth, and who spoke to me and who swore to me, saying, ‘To your offspring I will give this land’—he will send his angel before you, and you shall take a wife for my son from there.
translation:
  language: te
  text: “పరలోక దేవుడైన యాహ్వే—నా తండ్రి ఇంటి నుండీ, నేను పుట్టిన దేశం నుండీ నన్ను తీసుకున్నవాడు; నాతో మాట్లాడి, ‘నీ సంతానానికి ఈ దేశాన్ని ఇస్తాను’ అని నాకు ప్రమాణం చేసినవాడు—ఆయనే నీ ముందుగా తన దేవదూతను[a] పంపుతాడు. నువ్వు అక్కడి నుండి నా కుమారునికి భార్యను తీసుకురావాలి.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘తన దూతను’ లేదా ‘తన సందేశవాహకుణ్ణి.’ హీబ్రూ מַלְאָךְ అనే పదానికి ‘దూత/సందేశవాహకుడు’ లేదా ‘దేవదూత’ అనే అర్థాలు ఉండవచ్చు; ఈ సందర్భంలో పరలోక దూత అనే భావమే ఎక్కువ సంభావ్యమైనది.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవ నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే రూపంలో వ్యక్తిగత నామంగా ఉంచింది.
- source_word: אֱלֹהֵי הַשָּׁמַיִם
  choice: పరలోక దేవుడు
  rationale: హీబ్రూ బహువచన రూపాన్ని తెలుగు సహజ వాడుకలో సమష్టి భావమిచ్చే ‘పరలోకం’తో అందించింది.
- source_word: לְקָחַנִי
  choice: నన్ను తీసుకువచ్చినవాడు
  rationale: לָקַח యొక్క ‘తీసుకొను’ భావాన్ని నిలుపుతూ, అబ్రాహామును పూర్వదేశం నుండి ప్రస్తుత స్థలానికి దేవుడు నడిపించిన సందర్భాన్ని సహజ తెలుగులో తెలిపింది.
- source_word: מִבֵּית אָבִי
  choice: నా తండ్రి ఇంటి నుండి
  rationale: కుటుంబ-గృహ భావాన్ని వ్యాఖ్యానాత్మకంగా విస్తరించకుండా మూలంలోని రూపాన్ని నిలిపింది.
- source_word: וּמֵאֶרֶץ מוֹלַדְתִּי
  choice: నేను పుట్టిన దేశం నుండి
  rationale: מוֹלֶדֶת పదానికి ఉండగల జన్మస్థలం/స్వదేశం/బంధువర్గం భావాలలో, భౌగోళిక సందర్భానికి సరిపోయే అర్థాన్ని ఎంచుకుంది; బంధుత్వాన్ని అతిగా నిర్దిష్టం చేయలేదు.
- source_word: דִּבֶּר לִי
  choice: నాతో మాట్లాడి
  rationale: ‘వాగ్దానం చేశాడు’ అని ముందే వ్యాఖ్యానించకుండా సాధారణ ‘మాట్లాడు’ అనే క్రియార్థాన్ని కాపాడింది.
- source_word: נִשְׁבַּע לִי
  choice: నాకు ప్రమాణం చేసినవాడు
  rationale: ప్రమాణ సందర్భంలోని నిఫాల్ క్రియను గంభీరమైన, సహజ తెలుగు రూపంలో తెలిపింది.
- source_word: לְזַרְעֲךָ
  choice: నీ సంతానానికి
  rationale: זֶרַע యొక్క సమష్టి ఏకవచన భావాన్ని ‘సంతానం’ సహజంగా నిలుపుతుంది; ‘వారసులు’ కంటే మూలానికి దగ్గరగా ఉంది.
- source_word: אֶתֵּן אֶת הָאָרֶץ הַזֹּאת
  choice: ఈ దేశాన్ని ఇస్తాను
  rationale: నిబంధన వాగ్దానంలోని భూభాగ భావాన్ని తెలుగులో సహజమైన ‘దేశం’తో నేరుగా అందించింది.
- source_word: הוּא
  choice: ఆయనే
  rationale: హీబ్రూ స్వతంత్ర సర్వనామంలోని ఉద్ఘాటనను గౌరవార్థక తెలుగు ఉద్ఘాటక రూపం స్పష్టంగా నిలుపుతుంది.
- source_word: יִשְׁלַח מַלְאָכוֹ לְפָנֶיךָ
  choice: నీకు ముందుగా తన దూతను పంపుతాడు
  rationale: మార్గాన్ని ముందుండి సిద్ధం చేసే భావాన్ని సహజ తెలుగులో తెలిపింది. מַלְאָךְ లోని దూత/దేవదూత సందిగ్ధతను ప్రధాన పాఠంలో ‘దూత’తో, పాదసూచికలో ప్రత్యామ్నాయంతో నిలిపింది.
- source_word: וְלָקַחְתָּ אִשָּׁה לִבְנִי
  choice: నువ్వు ... నా కుమారునికి భార్యను తీసుకురావాలి
  rationale: సేవకునికి ఇచ్చిన బాధ్యతను ఆధునిక తెలుగులో స్పష్టంగా తెలిపింది; ‘భార్యను తీసుకోవాలి’ వల్ల సేవకుడే వివాహం చేసుకుంటాడనే అపార్థాన్ని నివారించింది.
theological_decisions:
- issue: దైవ నామమైన יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలోని వ్యక్తిగత దైవ నామాన్ని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయలేదు. తెలుగు బైబిలు పాఠకులకు విస్తృతంగా గుర్తించదగిన నామరూపాన్ని ఎంచుకుంది; ఉచ్చారణ పునర్నిర్మాణానికి సంబంధించిన ప్రత్యామ్నాయం ఉన్నప్పటికీ పాఠంలో ఒకే రూపాన్ని స్థిరంగా వాడింది.
- issue: מַלְאָכוֹ యొక్క అర్థం
  choice: తన దూతను
  alternative: తన దేవదూతను
  rationale: מַלְאָךְ మానవ లేదా పరలోక సందేశవాహకుణ్ణి సూచించగలదు. దేవుని ముందస్తు నడిపింపును బట్టి పరలోక దూత భావం బలంగా ఉన్నా, ప్రధాన పాఠంలోని ‘దూత’ నిజమైన పదార్థ సందిగ్ధతను నిలుపుతుంది; పాదసూచిక ప్రత్యామ్నాయాన్ని వివరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన ప్రత్యక్ష సంభాషణ శైలిని వాడింది. దేవునికి గౌరవార్థక ఏకవచనం, సేవకునికి సందర్భానుగుణ సాధారణ ఏకవచనం వాడబడ్డాయి. హీబ్రూ వాక్యంలోని పునరుక్త సంబంధవాక్యాలను డాష్‌లతో క్రమబద్ధం చేసి, భావ ఉద్ఘాటనను నిలుపుతూ పఠనసౌలభ్యాన్ని పెంచింది.
