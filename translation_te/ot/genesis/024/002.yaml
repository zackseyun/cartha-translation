    rationale: ఇది అబ్రాహాము కుటుంబసభ్యులలో పెద్దవాడు అనే అర్థాన్ని సూచించగలదు. హీబ్రూలో ఇది అతని సేవకుడు ఇంటిలో/గృహంలో వయసులో లేదా హోదాలో పెద్దవాడని గుర్తింపుగా ఉంది.
