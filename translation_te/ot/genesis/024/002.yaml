translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి. ‘అధిపతిగా’ అనే పదం మూలంలోని పాలనా బాధ్యతను నిలుపుతుంది; ప్రమాణ సంజ్ఞను ప్రధాన వాక్యంలో వ్యాఖ్యానించకుండా యథాతథంగా ఉంచాం. అన్ని పాదటిప్పణి సూచికలు ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
