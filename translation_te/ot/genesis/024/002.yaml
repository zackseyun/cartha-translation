source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אַבְרָהָ֗ם אֶל עַבְדּ/וֹ֙ זְקַ֣ן בֵּית֔/וֹ הַ/מֹּשֵׁ֖ל בְּ/כָל אֲשֶׁר ל֑/וֹ שִֽׂים נָ֥א יָדְ/ךָ֖ תַּ֥חַת יְרֵכִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/002.yaml
  text: And Abraham said to his servant[a], the oldest of his household, who ruled over all that belonged to him[b], “Please put your hand under my thigh.”
translation:
  language: te
  text: అబ్రాహాము తన ఇంటిలో వయసులో పెద్దవాడైన, తనకున్నదంతటిపై అధికారిగా ఉన్న తన సేవకునితో[a], “దయచేసి నీ చేయి నా తొడ కింద పెట్టు” అన్నాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “సేవకుడు” అని అనువదించిన హీబ్రూ పదం సేవకుని లేదా బానిసను సూచించవచ్చు. ఇక్కడ అతడు అబ్రాహాము ఇంటి ఆస్తి వ్యవహారాలన్నిటిపై అధికారం పొందిన విశ్వసనీయ సేవకుడిగా కనిపిస్తున్నాడు.
    reason: lexical_ambiguity
  - marker: b
    text: చేయిని తొడ కింద పెట్టడం ప్రాచీన కాలంలో ప్రమాణం చేసే ఒక సంజ్ఞ; అది గంభీరమైన నిబద్ధతను సూచించి ఉండవచ్చు.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అన్నాడు
  rationale: హీబ్రూ కథన ప్రవాహంలో సహజమైన భూతకాల వాక్యక్రియ; తెలుగులో అనవసరంగా ‘మరియు’ చేర్చకుండా క్రమాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: עַבְדּוֹ
  choice: తన సేవకునితో
  rationale: ఈ సందర్భంలో అబ్రాహాము ఇంటి వ్యవహారాలను నమ్మకంగా నిర్వహించే వ్యక్తి ప్రధానంగా కనిపిస్తున్నాడు; బానిసత్వ స్థితిని నిర్దిష్టంగా తేల్చకుండా עבד పదంలోని సేవకుడు అనే భావాన్ని ఉంచుతుంది.
- source_word: זְקַן בֵּיתוֹ
  choice: తన ఇంటివారిలో పెద్దవాడూ
  rationale: వయస్సు లేదా సీనియారిటీ రెండింటికీ వీలున్న זקן భావాన్ని నిలుపుతూ, ఆధునిక తెలుగులో సహజంగా ఉంటుంది.
- source_word: הַמֹּשֵׁל בְּכָל אֲשֶׁר־לוֹ
  choice: తనకున్నదంతటికీ అధిపతిగా ఉన్న
  rationale: משל లోని పాలన లేదా అధికార బాధ్యత భావాన్ని నేరుగా ఉంచుతుంది; ఇది కేవలం పనులు చూసుకునేవాడనే అర్థానికి పరిమితం చేయదు.
- source_word: שִׂים נָא
  choice: దయచేసి ... పెట్టు
  rationale: ఆజ్ఞతో కూడిన נא యొక్క మర్యాదపూర్వక లేదా మనవిచేసే స్వరాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: יָדְךָ
  choice: నీ చెయ్యి
  rationale: మూలానికి నేరమైన, సహజమైన అనువాదం.
- source_word: תַּחַת יְרֵכִי
  choice: నా తొడ కింద
  rationale: సాంస్కృతికంగా ప్రత్యేకమైన ప్రమాణ సంజ్ఞను మూలంలోని అస్పష్టతతోనే ఉంచుతుంది; వివరణను పాదటిప్పణికి పరిమితం చేస్తుంది.
