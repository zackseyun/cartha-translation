  source_fidelity: మూలంలోని మూడు గుర్తింపులను—అబ్రాహాము సేవకుడు, అతని ఇంటిలో వయస్సులో పెద్దవాడు, అబ్రాహాముకు ఉన్నదంతటిపై అధికారం కలిగినవాడు—స్పష్టంగా వేరు చేసి చూపడం అవసరం. ముసాయిదాలోని “తన ఇంటివారిలో పెద్దవాడూ” కుటుంబసభ్యులలో పెద్దవాడనే భావాన్ని కలిగించవచ్చు; హీబ్రూ పదబంధం సేవకుని ఇంటి/గృహస్థాన సీనియారిటీని వివరిస్తుంది.
