source:
  edition: WLC
  text: וְ/הָ/אִ֥ישׁ מִשְׁתָּאֵ֖ה לָ֑/הּ מַחֲרִ֕ישׁ לָ/דַ֗עַת הַֽ/הִצְלִ֧יחַ יְהוָ֛ה דַּרְכּ֖/וֹ אִם לֹֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/021.yaml
  text: The man watched her silently[a], to know whether Yahweh had made his journey successful or not.
translation:
  language: te
  text: యాహ్వే ఆ మనిషి ప్రయాణాన్ని సఫలం చేశాడో లేదో తెలుసుకోవడానికి ఆ మనిషి ఆమెను మౌనంగా గమనిస్తున్నాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆ మనిషి ఆమెవైపు మౌనంగా తేరి చూస్తూ, యాహ్వే ఆ మనిషి మార్గాన్ని సఫలం చేశాడో లేదో తెలుసుకోవడానికి.”
    reason: מִשְׁתָּאֵהకు ‘తేరి చూడటం/నిశితంగా చూడటం,’ దֶּרֶךְకు అక్షరార్థమైన ‘మార్గం’ అనే ప్రత్యామ్నాయాలను సూచిస్తుంది.
lexical_decisions:
- source_word: הָאִישׁ
  choice: ఆ మనిషి
  rationale: హీబ్రూ పాఠంలో సాధారణ నామవాచకం ‘మనిషి’ ఉంది. సందర్భంలో అతడు అబ్రాహాము సేవకుడైనా, ఆ గుర్తింపును పాఠంలోకి చేర్చకుండా మూలపదాన్ని నిలిపింది.
- source_word: מִשְׁתָּאֵה לָהּ
  choice: ఆమెను ... గమనిస్తూ
  rationale: ఈ వర్తమాన కృదంత రూపం ఆసక్తితో లేదా ఆశ్చర్యంతో నిశితంగా చూడడాన్ని సూచించవచ్చు. ‘గమనిస్తూ’ కొనసాగుతున్న పరిశీలనను సహజంగా తెలియజేస్తూ, ఆశ్చర్య భావాన్ని అనవసరంగా ఖరారు చేయదు.
- source_word: מַחֲרִישׁ
  choice: మౌనంగా
  rationale: חרשׁ రూపం నిశ్శబ్దంగా ఉండడం లేదా మౌనం పాటించడం సూచిస్తుంది. క్రియావిశేషణ రూపం ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: לָדַעַת
  choice: తెలుసుకోవాలని
  rationale: ఈ అనంతరూపం ఉద్దేశాన్ని వ్యక్తపరుస్తుంది; ‘తెలుసుకోవాలని’ దానిని తెలుగులో స్పష్టంగా అందిస్తుంది.
- source_word: הַהִצְלִיחַ
  choice: సఫలం చేశాడో
  rationale: צלח హిఫీల్ రూపంలోని కారణార్థాన్ని—‘విజయవంతం చేయడం’—ఈ పదబంధం నిలుపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: మూలంలో ఉన్న దైవనామం יהוהను బిరుదుతో భర్తీ చేయకుండా లిప్యంతరీకరించింది.
- source_word: דַּרְכּוֹ
  choice: తన ప్రయాణాన్ని
  rationale: דרך అక్షరార్థంగా ‘దారి/మార్గం’; ఈ కథన సందర్భంలో అతని ప్రయాణం లేదా కార్యయత్నాన్ని సూచిస్తుంది. ‘ప్రయాణం’ సహజంగా సందర్భార్థాన్ని అందిస్తుంది.
- source_word: אִם לֹא
  choice: లేదో
  rationale: పరోక్ష ప్రశ్నలో ఈ నిర్మాణం ‘అవునో కాదో / లేదా కాదో’ అనే భావాన్ని ఇస్తుంది; తెలుగులో ‘చేశాడో లేదో’ సహజమైన సమానార్థక నిర్మాణం.
theological_decisions:
- issue: יהוה దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: వచనం దైవనామాన్ని ప్రత్యక్షంగా ఉపయోగిస్తుంది. వ్యక్తినామాన్ని బిరుదుగా మార్చకుండా ‘యాహ్వే’గా ఇవ్వడం మూలపాఠానికి దగ్గరగా ఉంటుంది.
- issue: సేవకుని అంతరంగ స్థితి
  choice: గమనిస్తూ
  alternative: ఆశ్చర్యంతో చూస్తూ
  rationale: מִשְׁתָּאֵה ఆశ్చర్యం లేదా విస్మయ ఛాయను కలిగి ఉండవచ్చు, కానీ ఇక్కడ ప్రధానంగా నిశిత పరిశీలనను సూచించవచ్చు. భావోద్వేగాన్ని ఖరారు చేయకుండా అస్పష్టతను నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనప్పటికీ గౌరవప్రదమైన కథన శైలి. ‘తన’ అనేది వాక్యకర్త అయిన మనిషి ప్రయాణాన్ని సూచిస్తుంది. మూలంలోని కొనసాగుతున్న కృదంతాలను తెలుగులో ‘గమనిస్తూ ... చూస్తున్నాడు’గా ప్రతిబింబించింది.
