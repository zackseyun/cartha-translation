  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּאמַ֓ר יְהוָ֗ה אֱלֹהֵי֙ אֲדֹנִ֣/י אַבְרָהָ֔ם הַקְרֵה נָ֥א לְ/פָנַ֖/י הַ/יּ֑וֹם וַ/עֲשֵׂה חֶ֕סֶד עִ֖ם אֲדֹנִ֥/י אַבְרָהָֽם׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/012.yaml
  text: And he said[a], “O Yahweh, God of my master Abraham, please grant success before me today[c][b], and show steadfast love to my master Abraham.”
translation:
  language: te
  text: 'అతడు ఇలా అన్నాడు: “యాహ్వే, నా యజమాని అబ్రాహాము దేవా, దయచేసి ఈ రోజు నా ఎదుట అది జరిగేలా చేయి[a]; నా యజమాని అబ్రాహాముపట్ల స్థిరమైన ప్రేమ చూపించు[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “ఈ రోజు నా ఎదుట అది సంభవించేలా చేయి.” హీబ్రూ క్రియ కోరుకున్న సమావేశం లేదా సంఘటనను దేవుడే అనుకూలంగా కలిగించాలనే విన్నపాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: “స్థిరమైన ప్రేమ” అని అనువదించిన హీబ్రూ పదం హెసెద్; దీనికి విశ్వసనీయమైన దయ, అచంచల ప్రేమ, నిబంధనపట్ల నమ్మకత్వం అనే భావాలు కూడా ఉన్నాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దేవుని ప్రత్యేక నామమైన యెహోవా చతురక్షర నామాన్ని బిరుదుగా మార్చకుండా ‘యాహ్వే’గా లిప్యంతరీకరించాం.
- source_word: אֱלֹהֵי אֲדֹנִי אַבְרָהָם
  choice: నా యజమాని అబ్రాహాము దేవుడు
  rationale: మాట్లాడుతున్నవాడు అబ్రాహాము సేవకుడు కాబట్టి אֲדֹנִי అనే సంబంధపదానికి ఆధునిక తెలుగులో సహజమైన ‘నా యజమాని’ సరిపోతుంది.
- source_word: הַקְרֵה נָא לְפָנַי הַיּוֹם
  choice: దయచేసి ఈ రోజు నా ప్రయత్నం సఫలమయ్యేలా చేయి
  rationale: קרה హిఫీల్ రూపం దేవుడు కోరుకున్న సంఘటనను కలిగించాలనే విన్నపాన్ని తెలియజేస్తుంది. ‘నా ప్రయత్నం’ అనేది సందర్భం నుంచి స్పష్టమయ్యే భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; మూలంలోని ‘నా ఎదుట జరిగేలా చేయి’ అనే రూపాన్ని పాదసూచికలో ఉంచాం.
- source_word: וַעֲשֵׂה חֶסֶד
  choice: నిబద్ధమైన ప్రేమ చూపించు
  rationale: חֶסֶדలోని ప్రేమ, విశ్వసనీయత, దయ అనే పరస్పర సంబంధిత భావాలను సాధారణ ‘దయ’కే పరిమితం చేయకుండా ‘నిబద్ధమైన ప్రేమ’గా వ్యక్తం చేశాం.
- source_word: עִם אֲדֹנִי אַבְרָהָם
  choice: నా యజమాని అబ్రాహాముపట్ల
  rationale: עִם అక్షరార్థంగా ‘తో’ అయినా, ‘ప్రేమ చూపించు’ అనే తెలుగు ప్రయోగంతో ‘పట్ల’ సహజంగా ఉండి అదే సంబంధాన్ని తెలియజేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలంలో ప్రత్యేక దైవనామం నేరుగా ఉంది; దాన్ని బిరుదుతో భర్తీ చేయకుండా పేరు రూపంలో నిలిపాం.
- issue: חֶסֶד యొక్క భావపరిధి
  choice: నిబద్ధమైన ప్రేమ
  alternative: దయ / అచంచలమైన ప్రేమ / నిబంధన విశ్వసనీయత
  rationale: ఈ పదంలోని స్థిరత్వం, విశ్వసనీయత, దయలను సూచిస్తూ, ప్రధాన పాఠంలో సాంకేతికమైన నిబంధన పదజాలాన్ని అతిగా నిర్దిష్టం చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో ప్రార్థనకు తగిన గౌరవభరితమైన ఏకవచన సంబోధనను వాడాం. వాక్యాన్ని సాధారణ పాఠకులకు సహజంగా ఉంచుతూ, హీబ్రూ క్రియలోని దైవ కార్యసాధకత్వాన్ని మరియు חֶסֶד యొక్క విస్తృత భావాన్ని నిలిపాం.
