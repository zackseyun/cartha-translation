    text: మరింత అక్షరార్థంగా, “ఈ రోజు నా ఎదుట అది సంభవించేలా చేయి.” హీబ్రూ క్రియ కోరుకున్న సమావేశం లేదా సంఘటనను దేవుడే అనుకూలంగా కలిగించాలనే విన్నపాన్ని సూచిస్తుంది.
