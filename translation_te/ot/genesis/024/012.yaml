  - marker: b
    text: “స్థిరమైన ప్రేమ” అని అనువదించిన హీబ్రూ పదం హెసెద్; దీనికి విశ్వసనీయమైన దయ, అచంచల ప్రేమ, నిబంధనపట్ల నమ్మకత్వం అనే భావాలు కూడా ఉన్నాయి.
