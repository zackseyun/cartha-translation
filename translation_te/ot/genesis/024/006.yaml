  text: וַ/יֹּ֥אמֶר אֵלָ֖י/ו אַבְרָהָ֑ם הִשָּׁ֣מֶר לְ/ךָ֔ פֶּן תָּשִׁ֥יב אֶת בְּנִ֖/י שָֽׁמָּ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/006.yaml
  text: Abraham said to him[a], “Be careful that you do not take my son back there.”
translation:
  language: te
  text: అబ్రాహాము అతనితో, “నా కుమారుణ్ణి తిరిగి అక్కడికి తీసుకెళ్లకుండా జాగ్రత్తపడు” అన్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלָיו אַבְרָהָם
  choice: అబ్రాహాము అతనితో ... అన్నాడు
  rationale: హీబ్రూ కథనంలోని సాధారణ భూతకాల వాక్య నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగు సంభాషణా క్రమంలో అందిస్తుంది.
- source_word: הִשָּׁמֶר לְךָ
  choice: జాగ్రత్తపడు
  rationale: నిఫ్అల్ ఆజ్ఞారూపం మరియు నైతిక దత్తివాచకం కలిగిన హెచ్చరిక భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: פֶּן
  choice: '...కుండా'
  rationale: ప్రతికూల హెచ్చరికను తెలిపే హీబ్రూ అవ్యయ భావాన్ని తెలుగులో సహజమైన నిరోధక నిర్మాణంతో వ్యక్తపరుస్తుంది.
- source_word: תָּשִׁיב
  choice: తిరిగి ... తీసుకెళ్లడం
  rationale: שׁוב హిఫ్ఇల్ రూపంలోని ‘తిరిగి వెళ్లేలా చేయడం’ అనే కారణార్థాన్ని నిలుపుతూ, ప్రయాణ సందర్భంలో సేవకుడు కుమారుణ్ణి ఆ ప్రదేశానికి తీసుకెళ్లడాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: אֶת־בְּנִי
  choice: నా కుమారుణ్ణి
  rationale: ప్రత్యక్ష కర్మ సూచికతో కూడిన ప్రథమ పురుష ఏకవచన స్వామ్య ప్రత్యయాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: שָׁמָּה
  choice: అక్కడికి
  rationale: గమ్యదిశను సూచించే హీబ్రూ అవ్యయ భావాన్ని తెలుగు దిశావాచక రూపంతో స్పష్టంగా తెలియజేస్తుంది.
