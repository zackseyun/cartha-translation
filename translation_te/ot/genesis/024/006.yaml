translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే కథన శైలి. ‘తిరిగి అక్కడికి తీసుకెళ్లు’ అనే రూపం కుమారుడు ఇంతకుముందు ఆ ప్రదేశంలో ఉన్నాడనే భావాన్ని తప్పనిసరిగా నిర్ణయించదు; మూలంలోని కారణార్థక క్రియకు సహజమైన తెలుగు సమానార్థక నిర్మాణంగా వాడబడింది.
