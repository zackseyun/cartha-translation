  terminology: ‘కుండ,’ ‘తొట్టి,’ ‘బావి,’ and ‘ఒంటెలన్నిటికీ’ are appropriate, clear terms. No theological terminology occurs. The English audit-trail alternative for ‘emptied/poured out’ does not require a Telugu footnote, since the selected Telugu wording adequately conveys the source sense without a material ambiguity.
