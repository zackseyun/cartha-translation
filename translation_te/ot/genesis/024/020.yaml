base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/020.yaml
  text: She quickly emptied her jar into the trough[a], and ran again to the well to draw water, and drew for all his camels.
translation:
  language: te
  text: ఆమె త్వరగా తన కుండలోని నీటిని తొట్టిలో కుమ్మరించి, మళ్లీ నీళ్లు తోడడానికి బావి దగ్గరికి పరుగెత్తింది. అతని ఒంటెలన్నిటికీ నీళ్లు తోడింది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתְּמַהֵר
  choice: త్వరగా
  rationale: ఈ క్రియ త్వరపడడం లేదా వేగంగా చేయడం అనే భావాన్ని తెలియజేస్తుంది; తెలుగులో సహజంగా క్రియావిశేషణంగా అందించబడింది.
- source_word: וַתְּעַר כַּדָּהּ
  choice: తన కుండలోని నీటిని ... కుమ్మరించి
  rationale: ערה అంటే ఇక్కడ కుండలోని ద్రవాన్ని ఖాళీ అయ్యేలా కుమ్మరించడం. తెలుగులో కుండనే ‘ఖాళీ చేసింది’ అనడం కన్నా దానిలోని నీటిని కుమ్మరించిందని చెప్పడం సహజం; సందర్భం ద్వారా నీరు స్పష్టంగా ఉంది.
- source_word: הַשֹּׁקֶת
  choice: తొట్టిలో
  rationale: జంతువులు నీరు తాగే పాత్ర లేదా తొట్టిని సూచిస్తుంది. ఒంటెల సందర్భంలో ‘తొట్టి’ స్పష్టమైన, సాధారణ తెలుగు పదం.
- source_word: וַתָּרָץ עוֹד
  choice: మళ్లీ ... పరుగెత్తింది
  rationale: רץ పరుగెత్తడాన్ని, עוֹד చర్య పునరావృతిని సూచిస్తాయి.
- source_word: הַבְּאֵר
  choice: బావి దగ్గరికి
  rationale: בְּאֵר సాధారణంగా బావిని సూచిస్తుంది. గమ్యాన్ని తెలుగులో సహజంగా చెప్పేందుకు ‘దగ్గరికి’ వాడబడింది.
- source_word: לִשְׁאֹב
  choice: నీళ్లు తోడడానికి
  rationale: బావి నుండి నీరు తీయడాన్ని ఆధునిక ప్రామాణిక తెలుగులో సహజంగా ‘నీళ్లు తోడడం’ అంటారు.
- source_word: וַתִּשְׁאַב
  choice: నీళ్లు తోడింది
  rationale: మూలంలో ఉన్న తదుపరి సమాప్త క్రియను నిలుపుతూ, తెలుగులో స్పష్టత కోసం నీరు అనే కర్మను వ్యక్తం చేసింది.
- source_word: לְכָל גְּמַלָּיו
  choice: అతని ఒంటెలన్నిటికీ
  rationale: כָּל తెలిపే సంపూర్ణతను ‘అన్నిటికీ’ నిలుపుతుంది; לְ ప్రయోజనార్థక భావాన్ని ‘కి’ తెలియజేస్తుంది.
