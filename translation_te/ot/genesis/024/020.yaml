  source_fidelity: 'The Telugu accurately represents the Hebrew narrative sequence: she acted quickly, poured out the contents of her jar into the trough, ran again to the well to draw water, and drew water for all his camels. The explicit additions ‘నీటిని/నీళ్లు’ are contextually entailed by the water-drawing setting and make natural Telugu without materially expanding the sense.'
