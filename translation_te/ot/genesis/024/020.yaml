translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సరళమైనప్పటికీ గౌరవప్రదమైన కథన శైలి. మూలంలోని వేగవంతమైన వరుస చర్యలను రెండు సహజ తెలుగు వాక్యాలుగా అందించాం. వివరణ అవసరమైన నిజమైన పాఠ్య లేదా తాత్త్విక సందిగ్ధత లేనందున పాదటిప్పణి చేర్చలేదు.
