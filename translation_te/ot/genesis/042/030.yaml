  text: דִּ֠בֶּר הָ/אִ֨ישׁ אֲדֹנֵ֥י הָ/אָ֛רֶץ אִתָּ֖/נוּ קָשׁ֑וֹת וַ/יִּתֵּ֣ן אֹתָ֔/נוּ כִּֽ/מְרַגְּלִ֖ים אֶת הָ/אָֽרֶץ־׃
