  language: en
  yaml_path: translation/ot/genesis/042/030.yaml
  text: The man, the lord of the land, spoke harshly with us and treated us as spies of the land.
translation:
  language: te
  text: ఆ మనిషి, ఆ దేశానికి అధిపతి, మాతో కఠినంగా మాట్లాడి, మమ్మల్ని ఆ దేశంపై నిఘా వేసే గూఢచారులుగా పరిగణించాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲדֹנֵי הָאָרֶץ
  choice: ఆ దేశానికి అధిపతి
  rationale: భూమి/దేశంపై అధికారమున్న పాలకుడు అనే సందర్భార్థాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: אִתָּנוּ קָשׁוֹת
  choice: మాతో కఠినంగా మాట్లాడి
  rationale: ‘మాతో’ అనే సంబంధాన్ని నిలుపుతూ, קָשׁוֹת సూచించే కఠినమైన మాటతీరును సహజంగా తెలియజేస్తుంది.
- source_word: וַיִּתֵּן אֹתָנוּ כִּמְרַגְּלִים
  choice: మమ్మల్ని ... వేగుచూసేవారిగా పరిగణించాడు
  rationale: נתן ... כ యొక్క సందర్భోచిత భావమైన ‘అలా భావించడం/పరిగణించడం’ను తెలుగులో స్పష్టంగా అందిస్తుంది; מְרַגְּלִיםకు సాధారణంగా అర్థమయ్యే వివరణాత్మక పదాన్ని వాడుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్య నిర్మాణం. మూలంలోని ‘ఆ మనిషి—ఆ దేశానికి అధిపతి’ అనే appositional నిర్మాణం నిలుపబడింది.
