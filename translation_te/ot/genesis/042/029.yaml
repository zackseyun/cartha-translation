translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. హీబ్రూ పదక్రమాన్ని యాంత్రికంగా అనుసరించకుండా, దాని దిశా మరియు స్థల భావాలను సహజమైన తెలుగు వాక్యంలో నిలిపాం.
