source:
  edition: WLC
  text: וַ/יָּבֹ֛אוּ אֶל יַעֲקֹ֥ב אֲבִי/הֶ֖ם אַ֣רְצָ/ה כְּנָ֑עַן וַ/יַּגִּ֣ידוּ ל֔/וֹ אֵ֛ת כָּל הַ/קֹּרֹ֥ת אֹתָ֖/ם לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/029.yaml
  text: Then they came to Jacob their father in the land of Canaan and told him all that had happened to them[a], saying,
translation:
  language: te
  text: 'తర్వాత వారు కనాను దేశంలో ఉన్న తమ తండ్రి యాకోబు దగ్గరికి వచ్చి,[a] తమకు జరిగినదంతా అతనికి ఇలా చెప్పారు:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరాలా, “తమ తండ్రి యాకోబు దగ్గరికి, కనాను దేశానికి.” తెలుగులో సహజంగా ఉండేందుకు, యాకోబు కనాను దేశంలో ఉన్నాడని సూచించే విధంగా అనువదించబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: తర్వాత వారు ... వచ్చి
  rationale: వయ్యిక్తోల్ రూపం కథనాన్ని ముందుకు నడిపిస్తుంది; ‘తర్వాత’ వరుసగా జరిగిన చర్యను సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: אֶל יַעֲקֹב אֲבִיהֶם
  choice: తమ తండ్రి యాకోబు దగ్గరికి
  rationale: אֶל దిశను సూచిస్తుంది; బంధసూచక ప్రత్యయం గల אֲבִיהֶם ను ‘తమ తండ్రి’గా అనువదించడం తెలుగు వాక్య నిర్మాణానికి సహజం.
- source_word: אַרְצָה כְּנָעַן
  choice: కనాను దేశంలో ఉన్న
  rationale: దిశాసూచక ה కలిగిన పదబంధం కనాను దేశం వైపు/లోనికి కదలికను సూచిస్తుంది. యాకోబు దగ్గరికి రావడమనే ముందు గమ్యంతో కలిపి, అతని స్థానాన్ని తెలిపే ‘కనాను దేశంలో ఉన్న’ అనే రూపం ద్విగమ్యపు అసహజతను నివారిస్తూ భావాన్ని కాపాడుతుంది.
- source_word: וַיַּגִּידוּ לוֹ
  choice: అతనికి ... చెప్పారు
  rationale: נגד హిఫీల్ రూపం ‘తెలియజేయడం/చెప్పడం’ అనే అర్థం ఇస్తుంది; కథన సందర్భంలో ‘చెప్పారు’ స్పష్టంగా, సహజంగా ఉంది.
- source_word: אֵת כָּל הַקֹּרֹת אֹתָם
  choice: తమకు జరిగినదంతా
  rationale: קרה నుండి వచ్చిన రూపం వారికి సంభవించిన విషయాలను సూచిస్తుంది; ‘జరిగినదంతా’ సంపూర్ణతను, సంఘటనల భావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: לֵאמֹר
  choice: 'ఇలా చెప్పారు:'
  rationale: తరువాతి వచనంలోని ప్రత్యక్ష వాక్యాన్ని పరిచయం చేస్తుంది; తెలుగులో ద్విబిందువుతో కూడిన ‘ఇలా చెప్పారు’ సహజమైన కథన రూపం.
