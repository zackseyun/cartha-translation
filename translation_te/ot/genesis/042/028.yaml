id: GEN.42.28
reference: Genesis 42:28
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֶל אֶחָי/ו֙ הוּשַׁ֣ב כַּסְפִּ֔/י וְ/גַ֖ם הִנֵּ֣ה בְ/אַמְתַּחְתִּ֑/י וַ/יֵּצֵ֣א לִבָּ֗/ם וַ/יֶּֽחֶרְד֞וּ אִ֤ישׁ אֶל אָחִי/ו֙ לֵ/אמֹ֔ר מַה זֹּ֛את עָשָׂ֥ה אֱלֹהִ֖ים לָֽ/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/028.yaml
  text: He said to his brothers[a], “My silver has been returned, and look, it is even in my sack!” Then their hearts failed them, and they trembled, each man to his brother, saying[b], “What is this that God has done to us?”
translation:
  language: te
  text: అతడు తన సోదరులతో, “నా వెండి తిరిగి ఇవ్వబడింది; ఇదిగో, అది నా సంచిలోనే ఉంది!” అన్నాడు. అప్పుడు వారి ధైర్యం చెదిరిపోయింది[a]. వారు వణికిపోయారు. ప్రతి ఒక్కరూ తన సోదరునితో, “దేవుడు మనకు చేసిన ఈ పని ఏమిటి?” అన్నారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “వారి హృదయం బయటికి వెళ్లింది”; భావం, వారి ధైర్యం వారిని విడిచిపోయింది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “ఒకడు తన సోదరునితో.” అంటే, “ఒకరితో ఒకరు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הוּשַׁב
  choice: తిరిగి పెట్టబడింది
  rationale: హోఫల్ రూపంలోని నిష్క్రియార్థాన్ని నిలుపుతూ, వెండి సంచిలో తిరిగి ఉంచబడిందనే కనుగొన్న స్థితిని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: כַּסְפִּי
  choice: నా వెండి
  rationale: כֶּסֶף యొక్క అక్షరార్థమైన ‘వెండి’ని నిలుపుతుంది; ఈ సందర్భంలో అది చెల్లింపుగా ఉపయోగించిన ధనమని కథనం స్పష్టం చేస్తుంది.
- source_word: אַמְתַּחַת
  choice: సంచి
  rationale: ధాన్యం లేదా ప్రయాణ సరుకును మోసే సంచికి సరిపోయే సాధారణ ఆధునిక తెలుగు పదం.
- source_word: וְגַם הִנֵּה
  choice: ఇదిగో, అది ... నే ఉంది
  rationale: הִנֵּה లోని చూపించే ఆశ్చర్యాన్నీ, גַם లోని ఉద్ఘాటననూ ‘ఇదిగో’ మరియు ‘నే’ ద్వారా సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וַיֵּצֵא לִבָּם
  choice: వారి గుండె జారిపోయింది
  rationale: ‘వారి హృదయం బయటికి వెళ్లింది’ అనే మూలభాషా రూపకానికి సమీపంగా ఉండి, అకస్మాత్తుగా ధైర్యం కోల్పోయి దిగ్భ్రాంతి చెందడాన్ని తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וַיֶּחֶרְדוּ
  choice: వణికిపోయారు
  rationale: భయం లేదా ఆందోళనతో వణకడం అనే శారీరక-భావోద్వేగ బలాన్ని నిలుపుతుంది.
- source_word: אִישׁ אֶל אָחִיו
  choice: ఒకడు తన సోదరునితో
  rationale: మూలంలోని పంపిణీ భావాన్నీ పురుష సహోదర సంబంధాన్నీ కాపాడుతుంది; సందర్భంలో పరస్పరం మాట్లాడుకున్నారనే భావం ఉంది.
- source_word: מַה זֹּאת
  choice: ఇలా ఎందుకు
  rationale: తెలుగులో భయంతో అడిగే ప్రశ్నగా సహజంగా వినిపిస్తుంది; అయితే మూలంలోని అక్షరార్థమైన ‘ఇది ఏమిటి?’ అనే రూపం పాదసూచికలో భద్రపరచాలి.
- source_word: אֱלֹהִים
  choice: దేవుడు
  rationale: క్రియ ఏకవచనంలో ఉండటం మరియు కథా సందర్భం ఒకే దేవుణ్ణి సూచించడం వల్ల ఏకవచన ‘దేవుడు’ సరైనది.
theological_decisions:
- issue: సోదరుల ప్రశ్నలో אֱלֹהִים అనువాదం
  choice: దేవుడు
  alternative: దేవత / దేవుళ్లు
  rationale: పదరూపం బహువచనాకారంలో ఉన్నప్పటికీ, ఏకవచన క్రియ మరియు కథా సందర్భం ఒకే దేవుని కార్యాన్ని సూచిస్తాయి; అదనపు దైవశాస్త్రీయ వివరణను చేర్చలేదు.
- issue: אִישׁ אֶל אָחִיו లోని లింగ-సంబంధ భాష
  choice: ఒకడు తన సోదరునితో
  alternative: ఒకరితో ఒకరు
  rationale: మూలంలోని పురుష ఏకవచన పంపిణీ రూపాన్నీ సోదర సంబంధాన్నీ నిలుపుతుంది.
- issue: దేవుని కార్యంపై ప్రశ్న యొక్క స్వరూపం
  choice: దేవుడు మనకు ఇలా ఎందుకు చేశాడు?
  alternative: దేవుడు మనకు చేసిన ఈ పని ఏమిటి?
  rationale: తెలుగులో భయభరిత ప్రశ్నను సహజంగా వ్యక్తం చేస్తుంది; అయినప్పటికీ ‘ఎందుకు’ అనేది మూలంలోని מַה ను వ్యాఖ్యానించే ప్రమాదం ఉన్నందున అక్షరార్థ ప్రత్యామ్నాయం పాదసూచికలో ఇవ్వబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి. ‘వెండి,’ ‘సంచి,’ ‘సోదరుడు’ వంటి పదాలు చారిత్రక నేపథ్యాన్నీ మూలంలోని సంబంధ భాషనూ నిలుపుతాయి; క్లిష్టమైన హృదయ రూపకానికి పాదసూచిక ఇచ్చబడింది.
