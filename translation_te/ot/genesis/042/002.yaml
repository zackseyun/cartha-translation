translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘దిగివెళ్లి’ ద్వారా మూలంలోని భౌగోళిక దిశాభావం, ‘బతుకుతాం, చనిపోము’ ద్వారా హెబ్రీ సమాంతరత నిలుపబడ్డాయి. మూలాధారంతో సరిపోని ఆంగ్ల పాదటిప్పణి గుర్తులు చేర్చబడలేదు.
