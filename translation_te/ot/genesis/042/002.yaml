source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר הִנֵּ֣ה שָׁמַ֔עְתִּי כִּ֥י יֶשׁ שֶׁ֖בֶר בְּ/מִצְרָ֑יִם רְדוּ שָׁ֨מָּ/ה֙ וְ/שִׁבְרוּ לָ֣/נוּ מִ/שָּׁ֔ם וְ/נִחְיֶ֖ה וְ/לֹ֥א נָמֽוּת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/002.yaml
  text: He said[a], “Look, I have heard that there is grain in Egypt. Go down there and buy some for us from there[b], so that we may live and not die.”
translation:
  language: te
  text: 'అతడు ఇలా అన్నాడు: “చూడండి, ఐగుప్తులో ధాన్యం దొరుకుతుందని విన్నాను. అక్కడికి దిగివెళ్లి, అక్కడి నుంచి మన కోసం ధాన్యం కొనండి. అప్పుడు మనం బతుకుతాం, చనిపోము.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: చూడండి
  rationale: తరువాత చెప్పబోయే విషయంపై శ్రోతల దృష్టిని నిలిపే సంభాషణా సూచకం; ఆధునిక తెలుగులో సహజంగా, తక్షణత్వంతో వినిపిస్తుంది.
- source_word: שָׁמַעְתִּי
  choice: విన్నాను
  rationale: విన్న సమాచారం ఇప్పుడు ప్రాసంగికంగా ఉందనే భావాన్ని తెలుగు భూతకాల రూపం సందర్భానుసారంగా సహజంగా తెలియజేస్తుంది.
- source_word: שֶׁבֶר
  choice: ధాన్యం
  rationale: కరవు సందర్భంలో కొనుగోలుకు లభించే ధాన్యాన్ని సూచిస్తుంది; సాధారణమైన ‘ఆహారం’ కంటే ఇది నిర్దిష్టమైనది.
- source_word: רְדוּ
  choice: దిగివెళ్లి
  rationale: కనాను నుంచి ఐగుప్తుకు వెళ్లడాన్ని ‘దిగడం’గా చెప్పే హెబ్రీ దిశాభావాన్ని నిలుపుతుంది.
- source_word: שָׁמָּה
  choice: అక్కడికి
  rationale: గమ్యదిశను సూచించే సహజమైన తెలుగు రూపం.
- source_word: וְשִׁבְרוּ
  choice: ధాన్యం కొనండి
  rationale: ఈ సందర్భంలో క్రియ ప్రత్యేకంగా ధాన్యం కొనడాన్ని సూచిస్తుంది; తెలుగులో కర్మను మళ్లీ స్పష్టంగా చెప్పడం సహజంగా ఉంటుంది.
- source_word: לָנוּ
  choice: మన కోసం
  rationale: ప్రయోజనార్థక దత్తార్థాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: מִשָּׁם
  choice: అక్కడి నుంచి
  rationale: హెబ్రీలో స్పష్టంగా ఉన్న ‘నుంచి’ అనే మూలస్థాన భావాన్ని నిలుపుతుంది.
- source_word: וְנִחְיֶה וְלֹא נָמוּת
  choice: అప్పుడు మనం బతుకుతాం, చనిపోము
  rationale: జీవించడం–చనిపోకపోవడం అనే సమాంతర విరుద్ధ జంటను, ఆజ్ఞ వల్ల ఆశించే ఫలితాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
