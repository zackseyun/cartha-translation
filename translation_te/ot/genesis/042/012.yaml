translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన కథన శైలిని ఉపయోగించాం. అసలు హీబ్రూలోని ‘దేశపు నగ్నత్వం’ అనే ఉద్దేశపూర్వక రూపకాన్ని సరళీకరించకుండా ప్రధాన పాఠ్యంలో ఉంచి, దాని సందర్భార్థాన్ని పాదసూచికలో తెలిపాం. పాదసూచిక గుర్తులను అవి వివరిస్తున్న పదబంధాల వద్దనే ఉంచాం.
