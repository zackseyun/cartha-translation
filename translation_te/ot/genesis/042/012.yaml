source:
  edition: WLC
  text: וַ/יֹּ֖אמֶר אֲלֵ/הֶ֑ם לֹ֕א כִּֽי עֶרְוַ֥ת הָ/אָ֖רֶץ בָּאתֶ֥ם לִ/רְאֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/012.yaml
  text: But he said to them[a], “No[b], but you have come to see the nakedness of the land.”
translation:
  language: te
  text: అయితే అతడు వారితో, “కాదు! దేశపు నగ్నత్వాన్ని[a] చూడడానికే[b] మీరు వచ్చారు” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “దేశంలోని బహిర్గతమైన/రక్షణలేని ప్రాంతాలను.” హీబ్రూలో అక్షరార్థంగా “దేశపు నగ్నత్వం” అని ఉంది. శత్రువులు లేదా గూఢచారులు తమ ప్రయోజనానికి వాడుకోగల బలహీన ప్రాంతాలకు ఇది ఒక రూపకం.
    reason: lexical_alternative
  - marker: b
    text: లేదా “వేగు చూడడానికే.” హీబ్రూ క్రియకు అక్షరార్థం “చూడడం”; అయితే సందర్భంలో యోసేపు వారు రహస్యంగా సమాచారం సేకరించడానికి వచ్చారని ఆరోపిస్తున్నాడు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵהֶם
  choice: అయితే అతడు వారితో ... అన్నాడు
  rationale: వావ్ వరుస కథనాన్ని కొనసాగిస్తూనే, ముందటి వచనంలో సోదరులు చేసిన నిరాకరణకు విరుద్ధమైన ప్రతిస్పందనను ఇక్కడ సూచిస్తుంది. ఆధునిక తెలుగులో ‘అయితే’ ఆ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לֹא
  choice: కాదు!
  rationale: సోదరుల వాదనను యోసేపు ఆకస్మికంగా, బలంగా తిరస్కరిస్తున్నాడు. ‘కాదు!’ ఆ సంక్షిప్తమైన ఖండనను నిలుపుతుంది.
- source_word: כִּי
  choice: ప్రత్యేక పదంగా అనువదించకుండా, ‘చూడడానికే’లోని ఉద్ఘాటన ద్వారా
  rationale: ఈ సందర్భంలో כִּי నిరాకరణ తరువాత సరిదిద్దే ఆరోపణను ప్రవేశపెడుతుంది. తెలుగులో ‘చూడడానికే’ అనే ఉద్ఘాటిత నిర్మాణం ‘కాదు, అసలు ఉద్దేశం ఇదే’ అనే భావాన్ని సహజంగా అందిస్తుంది.
- source_word: עֶרְוַת הָאָרֶץ
  choice: దేశపు నగ్నత్వాన్ని
  rationale: హీబ్రూ పదబంధంలోని ‘నగ్నత్వం’ అనే రూపకాన్ని ప్రధాన పాఠ్యంలో నిలిపి, దాని భావమైన బహిర్గతమైన లేదా రక్షణలేని ప్రాంతాలను పాదసూచికలో వివరిస్తుంది.
- source_word: בָּאתֶם
  choice: మీరు వచ్చారు
  rationale: పూర్తయిన రాకను, ప్రస్తుత ఆరోపణతో దాని సంబంధాన్ని సహజమైన తెలుగు భూతకాల రూపంలో వ్యక్తం చేస్తుంది.
- source_word: לִרְאוֹת
  choice: చూడడానికి
  rationale: ראה అనే క్రియ యొక్క ప్రాథమిక అర్థం ‘చూడడం.’ సందర్భంలో గూఢచర్యపు భావం ఉన్నప్పటికీ, మూలపాఠ్యంలో ప్రత్యేకంగా ‘వేగు చూడడం’ అనే క్రియ లేదు; అందువల్ల మూలంలోని పదప్రయోగాన్ని నిలిపాం.
