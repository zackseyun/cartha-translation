  terminology: ‘దేశం,’ ‘నగ్నత్వం,’ ‘చూడడం’ ఎంపికలు మూలపాఠ్యానికి నమ్మకంగా ఉన్నాయి. పాదసూచికలోని ‘బహిర్గతమైన/రక్షణలేని ప్రాంతాలు’ రూపకానికి సరైన అర్థవివరణను ఇస్తుంది; ‘వేగు చూడడం’ ప్రత్యామ్నాయం సందర్భంలోని గూఢచర్య ఆరోపణను మాత్రమే వివరిస్తుంది, ప్రధాన పాఠ్యాన్ని అతిగా వ్యాఖ్యానించదు.
