- from: అప్పుడు యోసేపు వారి గురించి తాను కన్న కలలను జ్ఞాపకం చేసుకొని, వారితో, “మీరు గూఢచారులు! దేశంలోని బలహీన ప్రదేశాలను చూడటానికి వచ్చారు[a]” అన్నాడు.
