source:
  edition: WLC
  text: וַ/יִּזְכֹּ֣ר יוֹסֵ֔ף אֵ֚ת הַ/חֲלֹמ֔וֹת אֲשֶׁ֥ר חָלַ֖ם לָ/הֶ֑ם וַ/יֹּ֤אמֶר אֲלֵ/הֶם֙ מְרַגְּלִ֣ים אַתֶּ֔ם לִ/רְא֛וֹת אֶת עֶרְוַ֥ת הָ/אָ֖רֶץ בָּאתֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/009.yaml
  text: Then Joseph remembered the dreams that he had dreamed about them[a], and he said to them, “You are spies; you have come to see the nakedness of the land.”
translation:
  language: te
  text: అప్పుడు యోసేపు వారి గురించి తాను కన్న కలలను జ్ఞాపకం చేసుకున్నాడు; వారితో, “మీరు గూఢచారులు! దేశపు నగ్నతను చూడటానికి వచ్చారు[a]” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “దేశపు నగ్నత” అనేది దాడికి బహిర్గతమైన లేదా రక్షణలేని ప్రాంతాలను సూచించే హీబ్రూ నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְכֹּר
  choice: జ్ఞాపకం చేసుకొని
  rationale: ఈ సందర్భంలో యోసేపు గతంలో కన్న కలలను గుర్తుచేసుకున్నాడనే సాధారణ కథన భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: הַחֲלֹמוֹת אֲשֶׁר חָלַם
  choice: తాను కన్న కలలను
  rationale: హీబ్రూలోని ఒకే ధాతువుతో ఏర్పడిన నిర్మాణాన్ని తెలుగులో సహజంగా ‘కన్న కలలు’ అని అందిస్తుంది.
- source_word: לָהֶם
  choice: వారి గురించి
  rationale: కలలు యోసేపు సహోదరులకు సంబంధించినవని సందర్భం సూచిస్తుంది; ‘వారి గురించి’ ఆ సంబంధార్థాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: מְרַגְּלִים
  choice: గూఢచారులు
  rationale: ఈ సందర్భంలో రహస్యంగా దేశాన్ని పరిశీలించేవారనే నిందను ఆధునిక ప్రామాణిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: לִרְאוֹת
  choice: చూడటానికి
  rationale: హీబ్రూ క్రియ యొక్క ప్రాథమికమైన ‘చూడటం’ అనే అర్థాన్ని నిలుపుతుంది; గూఢంగా పరిశీలించడమనే భావం సందర్భం ద్వారా వస్తుంది.
- source_word: עֶרְוַת הָאָרֶץ
  choice: దేశంలోని బలహీన ప్రదేశాలను
  rationale: హీబ్రూ పదబంధం అక్షరార్థంగా ‘దేశపు నగ్నత’ అయినా, ఇక్కడ దాడికి అనుకూలంగా బహిర్గతమైన లేదా రక్షణలేని ప్రాంతాలను సూచించే నుడికారం. ప్రధాన పాఠ్యంలో అర్థాన్ని సహజంగా అందించి, అక్షర చిత్రాన్ని పాదసూచికలో ఉంచింది.
- source_word: בָּאתֶם
  choice: వచ్చారు
  rationale: వారు వచ్చిన ఉద్దేశాన్ని నేరుగా ఆరోపించే సంభాషణలో సహజమైన తెలుగు భూతకాల రూపం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కథన శైలి. మూలంలోని ఆరోపణాత్మక బలాన్ని ‘మీరు గూఢచారులు!’ ద్వారా నిలిపి, అపార్థానికి దారితీయగల హీబ్రూ నుడికారాన్ని ప్రధాన పాఠ్యంలో అర్థానువాదంగా, పాదసూచికలో అక్షర చిత్రంతో అందించింది.
