    reason: lexical_alternative
  revision_rationale: The revision restores the Hebrew's literal land-nakedness metaphor to the main text, consistent with optimal equivalence and the English audit trail, while preserving its idiomatic military sense in the footnote. It also makes Joseph's remembering an independent completed narrative action.
