id: GEN.42.7
reference: Genesis 42:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּ֥רְא יוֹסֵ֛ף אֶת אֶחָ֖י/ו וַ/יַּכִּרֵ֑/ם וַ/יִּתְנַכֵּ֨ר אֲלֵי/הֶ֜ם וַ/יְדַבֵּ֧ר אִתָּ֣/ם קָשׁ֗וֹת וַ/יֹּ֤אמֶר אֲלֵ/הֶם֙ מֵ/אַ֣יִן בָּאתֶ֔ם וַ/יֹּ֣אמְר֔וּ מֵ/אֶ֥רֶץ כְּנַ֖עַן לִ/שְׁבָּר אֹֽכֶל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/007.yaml
  text: When Joseph saw his brothers[a], he recognized them, but he acted like a stranger toward them and spoke harshly with them. He said to them, “Where have you come from?” And they said, “From the land of Canaan[b], to buy food.”
translation:
  language: te
  text: యోసేపు తన అన్నదమ్ములను చూసినప్పుడు, వారిని గుర్తుపట్టాడు. అయితే అతడు వారి ఎదుట పరాయివాడిలా ప్రవర్తించి[a], వారితో కఠినంగా మాట్లాడాడు. “మీరు ఎక్కడి నుంచి వచ్చారు?” అని వారిని అడిగాడు. వారు, “కనాను దేశం నుంచి ఆహారం[b] కొనడానికి వచ్చాము” అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారికి తెలియని వాడిలా వారి ఎదుట కనిపించాడు.” హీబ్రూ పదం అతడు వారికి పరాయివాడిగా లేదా తెలియనివాడిగా తనను చూపించుకున్నాడనే భావాన్ని ఇవ్వగలదు; అది తప్పనిసరిగా భౌతిక మారువేషాన్ని సూచించదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ధాన్యం.” కరవు సందర్భంలో ఇక్కడి క్రియ తరచుగా ధాన్యం కొనడాన్ని సూచిస్తుంది; అయితే నామవాచకానికి విస్తృతమైన అర్థం “ఆహారం.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא יוֹסֵף אֶת־אֶחָיו
  choice: యోసేపు తన అన్నదమ్ములను చూసినప్పుడు
  rationale: కథనాన్ని ముందుకు నడిపే హీబ్రూ వావ్-క్రమాన్ని సహజమైన తెలుగు కాలసంబంధ వాక్యంగా వ్యక్తం చేస్తుంది. సందర్భంలో אֶחָיו యోసేపు మగ సహోదరులను సూచిస్తున్నందున ‘అన్నదమ్ములు’ స్పష్టమైన తెలుగు పదం.
- source_word: וַיַּכִּרֵם
  choice: వారిని గుర్తుపట్టాడు
  rationale: נכר హిఫిల్ రూపం ఇక్కడ వారెవరో గుర్తించడం అనే అర్థాన్ని ఇస్తుంది; ‘గుర్తుపట్టాడు’ ఆధునిక తెలుగులో సహజమైన సమానార్థకం.
- source_word: וַיִּתְנַכֵּר אֲלֵיהֶם
  choice: వారి ఎదుట పరాయివాడిలా ప్రవర్తించి
  rationale: נכר హిత్పయేల్ రూపం వారి విషయంలో తాను పరాయివాడిగా లేదా తెలియనివాడిగా కనిపించేలా ప్రవర్తించడాన్ని సూచిస్తుంది. భౌతికంగా మారువేషం వేసుకున్నాడని నిర్బంధించకుండా సంబంధాత్మక భావాన్ని నిలుపుతుంది.
- source_word: וַיְדַבֵּר אִתָּם קָשׁוֹת
  choice: వారితో కఠినంగా మాట్లాడాడు
  rationale: קָשׁוֹת మాటల తీరును సూచిస్తుంది. ‘కఠినంగా మాట్లాడాడు’ తీవ్రతను నిలుపుతూ సహజమైన ఆధునిక తెలుగు ప్రయోగంగా ఉంది.
- source_word: מֵאַיִן בָּאתֶם
  choice: మీరు ఎక్కడి నుంచి వచ్చారు?
  rationale: వారు వచ్చిన ప్రదేశాన్ని అడిగే ప్రత్యక్ష ప్రశ్నను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: מֵאֶרֶץ כְּנַעַן
  choice: కనాను దేశం నుంచి
  rationale: ‘దేశం’ అనే పదం హీబ్రూ אֶרֶץ‌ను నిలుపుతూ భౌగోళిక వ్యక్తీకరణను స్పష్టంగా అందిస్తుంది.
- source_word: לִשְׁבָּר אֹכֶל
  choice: ఆహారం కొనడానికి
  rationale: שבר ఈ కరవు సందర్భంలో సరుకులు, ముఖ్యంగా ధాన్యం, కొనడాన్ని సూచించగలదు; అయితే אֹכֶל విస్తృతంగా ‘ఆహారం’ అని అర్థమవుతుంది. అందువల్ల ప్రధాన పాఠంలో అర్థాన్ని అనవసరంగా కుదించకుండా ‘ఆహారం’ వాడబడింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. హీబ్రూ కథన క్రమాన్ని సహజ తెలుగు వాక్య నిర్మాణంలో అందిస్తూ, וַיִּתְנַכֵּר యొక్క నిజమైన అర్థవిస్తృతిని పాదటిప్పణిలో నిలుపుకున్నాం.
