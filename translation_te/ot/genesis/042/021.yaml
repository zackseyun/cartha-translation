  text: וַ/יֹּאמְר֞וּ אִ֣ישׁ אֶל אָחִ֗י/ו אֲבָל֮ אֲשֵׁמִ֣ים אֲנַחְנוּ֮ עַל אָחִי/נוּ֒ אֲשֶׁ֨ר רָאִ֜ינוּ צָרַ֥ת נַפְשׁ֛/וֹ בְּ/הִתְחַֽנְנ֥/וֹ אֵלֵ֖י/נוּ וְ/לֹ֣א שָׁמָ֑עְנוּ עַל כֵּן֙ בָּ֣אָה אֵלֵ֔י/נוּ הַ/צָּרָ֖ה הַ/זֹּֽאת־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/021.yaml
  text: Then they said to one another[a], “Indeed, we are guilty concerning our brother, because we saw the distress of his soul when he pleaded with us, and we did not listen[b]. Therefore this distress has come upon us.”
translation:
  language: te
  text: 'అప్పుడు వారు ఒకరితో ఒకరు ఇలా చెప్పుకున్నారు: “నిజంగా, మన సోదరుని విషయంలో మనం దోషులం. అతడు మనల్ని వేడుకున్నప్పుడు అతని ప్రాణవేదనను[a] మనం చూశాం; అయినా మనం వినలేదు. అందుకే ఈ వేదన[b] మన మీదికి వచ్చింది.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతని తీవ్రమైన వ్యథను.” హెబ్రీలో అక్షరార్థంగా “అతని ప్రాణపు వేదన” అని ఉంది; ఇది అతని లోతైన వ్యక్తిగత వ్యథను తెలిపే నుడికారం.
    reason: lexical_alternative
  - marker: b
    text: యోసేపు అనుభవించిన “వేదనకు,” సోదరులు ఇప్పుడు అనుభవిస్తున్న “వేదనకు” హెబ్రీలో ఒకే మూలపదం వాడబడింది. ఈ పునరుక్తి వారి గత క్రూరత్వాన్ని ప్రస్తుత కష్టంతో అనుసంధానిస్తుంది.
    reason: wordplay
lexical_decisions:
- source_word: וַיֹּאמְרוּ אִישׁ אֶל־אָחִיו
  choice: వారు ఒకరితో ఒకరు ఇలా చెప్పుకున్నారు
  rationale: హెబ్రీ పరస్పరార్థక నుడికారాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; కథన వావ్‌ను ‘అప్పుడు’గా తెలిపింది.
- source_word: אֲבָל
  choice: నిజంగా
  rationale: ఇక్కడ ఇది వ్యతిరేకార్థకమైన ‘కాని’ కాదు; గంభీరమైన అంగీకారాన్ని బలపరిచే పదం.
- source_word: אֲשֵׁמִים אֲנַחְנוּ
  choice: మనం దోషులం
  rationale: బాధ్యతతో కూడిన అపరాధాన్ని స్పష్టంగా, సాధారణ పాఠకులకు సహజంగా తెలియజేస్తుంది.
- source_word: עַל־אָחִינוּ
  choice: మన సోదరుని విషయంలో
  rationale: వారి దోషం ఏ విషయానికి సంబంధించినదో చూపిస్తుంది; మూలంలో సాధ్యమైన ‘అతనికి విరోధంగా’ అనే భావాన్ని అనవసరంగా నిర్ణయించదు.
- source_word: צָרַת נַפְשׁוֹ
  choice: అతని ప్రాణవేదనను
  rationale: ‘అతని ప్రాణపు వేదన’ అనే హెబ్రీ భావచిత్రాన్ని సంక్షిప్తంగా నిలుపుతూ, తీవ్రమైన వ్యక్తిగత వ్యథను సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: בְּהִתְחַנְנוֹ אֵלֵינוּ
  choice: అతడు మనల్ని వేడుకున్నప్పుడు
  rationale: కరుణ కోసం అతడు చేసిన ఆర్త వినతిని తెలుపుతుంది; మూలంలో స్పష్టంగా లేని కర్మను అదనంగా చేర్చదు.
- source_word: וְלֹא שָׁמָעְנוּ
  choice: అయినా మనం వినలేదు
  rationale: కేవలం శబ్దం వినకపోవడం కాక, అతని విన్నపాన్ని ఆలకించి స్పందించకపోవడాన్ని సందర్భానుసారంగా తెలియజేస్తుంది.
- source_word: עַל־כֵּן
  choice: అందుకే
  rationale: గత దోషానికి ప్రస్తుత కష్టాన్ని పర్యవసానంగా వారు అనుసంధానిస్తున్న భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: בָּאָה אֵלֵינוּ הַצָּרָה הַזֹּאת
  choice: ఈ వేదన మన మీదికి వచ్చింది
  rationale: ‘వచ్చింది’ మరియు ‘మన మీదికి’ అనే హెబ్రీ రూపకాన్ని నిలుపుతుంది; ముందున్న צָרַת‌తో పదసంబంధాన్ని ‘వేదన’ పునరావృతం ద్వారా కాపాడుతుంది.
theological_decisions:
- issue: נפשׁ అనే పదాన్ని ‘ఆత్మ’గా నిర్ణయించాలా, లేక సంపూర్ణ వ్యక్తి/ప్రాణం అనే హెబ్రీ నుడికారంగా ఉంచాలా
  choice: ప్రాణవేదన
  alternative: ఆత్మ వేదన
  rationale: ఈ సందర్భంలో נפשׁ మానవుని లోతైన వ్యక్తిగత వ్యథను సూచిస్తుంది; ‘ఆత్మ’ అని అనువదిస్తే ప్రత్యేకమైన శరీర–ఆత్మ విభజన భావాన్ని మూలం కంటే ఎక్కువగా సూచించే ప్రమాదం ఉంది.
- issue: సోదరుల ప్రస్తుత వేదనను దైవిక శిక్షగా స్పష్టీకరించాలా
  choice: వారు చెప్పిన కారణ–పర్యవసాన సంబంధాన్ని మాత్రమే అనువదించడం
  alternative: దేవుడు ఈ శిక్షను మన మీదికి తెచ్చాడు
  rationale: వారు తమ కష్టాన్ని గత దోషంతో అనుసంధానిస్తున్నారు; అయితే ఈ వాక్యంలో దేవుడు ప్రత్యక్ష కర్తగా పేర్కొనబడలేదు. అందువల్ల ఆ భావాన్ని అదనంగా చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు స్పష్టమైన శైలి. ఒప్పుకోలులోని గంభీరతను నిలుపుతూ అతిగా మతపరమైన లేదా పాతకాలపు పదజాలాన్ని నివారించింది.
