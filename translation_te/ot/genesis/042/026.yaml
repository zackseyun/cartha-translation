  yaml_path: translation/ot/genesis/042/026.yaml
  text: Then they loaded their grain onto their donkeys and went from there[a].
translation:
  language: te
  text: అప్పుడు వారు తమ ధాన్యాన్ని గాడిదల మీద ఎక్కించుకొని అక్కడి నుంచి వెళ్లిపోయారు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘తమ ఆహార సామగ్రిని’ లేదా ‘తాము కొనుగోలు చేసిన ధాన్యాన్ని.’ హీబ్రూ పదం ఆహార సరఫరాలను సూచించగలదు; అయితే ఈ సందర్భంలో అది ఈజిప్టులో సంపాదించిన ధాన్యాన్నే అత్యంత సహజంగా సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂאוּ
  choice: ఎక్కించుకొని
  rationale: נשׂא అనే క్రియకు ప్రాథమికంగా ‘ఎత్తు/మోయు’ అనే అర్థాలున్నా, ప్రయాణానికి సరుకును జంతువుల మీద ఉంచే ఈ సందర్భంలో ‘ఎక్కించుకొని’ అనేది సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: שִׁבְרָם
  choice: తమ ధాన్యాన్ని
  rationale: యోసేపు కథనంలోని కరవు సందర్భంలో שֶׁבֶר సాధారణంగా ఈజిప్టులో కొనుగోలు చేసిన ధాన్యాన్ని సూచిస్తుంది. ‘ధాన్యం’ సందర్భానుసారంగా స్పష్టంగా ఉండగా, ‘ఆహార సామగ్రి’ కంటే నిర్దిష్టంగా ఉంది.
- source_word: עַל חֲמֹרֵיהֶם
  choice: గాడిదల మీద
  rationale: עַל ఇక్కడ సరుకును జంతువులపై ఉంచడాన్ని సూచిస్తుంది; ‘గాడిదల మీద’ ఆధునిక తెలుగులో స్పష్టంగా, సహజంగా ఉంది.
- source_word: וַיֵּלְכוּ
  choice: వెళ్లిపోయారు
  rationale: הלך సాధారణ గమన క్రియ. מִשָּׁם తో కలిసినప్పుడు ఆ స్థలం నుంచి బయలుదేరడాన్ని ‘వెళ్లిపోయారు’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: מִשָּׁם
  choice: అక్కడి నుంచి
  rationale: స్థలాన్ని సూచించే ఈ పదబంధానికి ‘అక్కడి నుంచి’ నేరుగా, స్పష్టంగా సరిపోతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. హీబ్రూ వాక్యక్రమంలోని వరుస చర్యలను సహజ తెలుగులో ‘ఎక్కించుకొని… వెళ్లిపోయారు’గా వ్యక్తం చేశాం.
