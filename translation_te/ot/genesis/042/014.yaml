translation:
  language: te
  text: 'యోసేపు వారితో ఇలా అన్నాడు: “నేను మీతో చెప్పింది ఇదే: ‘మీరు గూఢచారులు.’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵהֶם יוֹסֵף
  choice: యోసేపు వారితో ఇలా అన్నాడు
  rationale: హీబ్రూ కథన క్రియను సహజమైన తెలుగు వాక్యక్రమంలో ఇచ్చి, אֲלֵהֶםను ‘వారితో’గా వ్యక్తపరిచాం. తరువాత వచ్చే మాటను పరిచయం చేయడానికి ‘ఇలా’ సహజంగా పనిచేస్తుంది.
- source_word: הוּא אֲשֶׁר דִּבַּרְתִּי אֲלֵכֶם
  choice: నేను మీతో చెప్పింది ఇదే
  rationale: הוּא אֲשֶׁרలోని నొక్కిచెప్పే, ముందటి మాటను తిరిగి నిర్ధారించే భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: לֵאמֹר
  choice: ':'
  rationale: ఈ infinitive construct తరువాతి ప్రత్యక్ష ఉక్తిని పరిచయం చేస్తుంది. ‘చెప్పి’ వంటి పునరుక్తి తెలుగులో కృత్రిమంగా ఉండేందున, దాని వాక్యనిర్మాణ కార్యాన్ని ద్విబిందువు ద్వారా తెలిపాం.
- source_word: מְרַגְּלִים אַתֶּם
  choice: మీరు గూఢచారులు
  rationale: భూమి లేదా పరిస్థితులను రహస్యంగా పరిశీలించే వ్యక్తులను సూచించే מְרַגְּלִיםకు ‘గూఢచారులు’ స్పష్టమైన, ఆధునిక తెలుగు సమానార్థకం; స్వతంత్ర సర్వనామమైన אַתֶּםలోని ప్రత్యక్ష ఆరోపణను ‘మీరు’ నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరత కలిగిన కథన శైలి. హీబ్రూ వాక్యంలోని నొక్కిచెప్పే భావాన్ని నిలుపుతూ, ‘చెప్పాను—చెబుతూ’ అనే అసహజ పునరుక్తిని నివారించాం.
