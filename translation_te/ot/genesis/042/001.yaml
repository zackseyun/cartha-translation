source:
  edition: WLC
  text: וַ/יַּ֣רְא יַעֲקֹ֔ב כִּ֥י יֶשׁ שֶׁ֖בֶר בְּ/מִצְרָ֑יִם וַ/יֹּ֤אמֶר יַעֲקֹב֙ לְ/בָנָ֔י/ו לָ֖/מָּה תִּתְרָאֽוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/001.yaml
  text: When Jacob saw that there was grain in Egypt[a], Jacob said to his sons, “Why do you keep looking at one another?”
translation:
  language: te
  text: 'ఈజిప్టులో ధాన్యం ఉందని యాకోబు గమనించినప్పుడు, తన కుమారులతో ఇలా అన్నాడు: “మీరెందుకు ఒకరినొకరు చూస్తూ ఉన్నారు?[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీరెందుకు మిమ్మల్ని మీరు చూపించుకుంటున్నారు?” హీబ్రూ క్రియకు వేరొక అర్థం ఉండవచ్చు; అయితే ఈ సందర్భంలో సహోదరులు సంకోచంతో ఒకరినొకరు చూస్తూ ఉండడమే ఎక్కువ సంభావ్యమైన భావం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: తెలుసుకొని
  rationale: ראה సాధారణంగా ‘చూశాడు’ అని అర్థమైనా, ఇక్కడ ఈజిప్టులో ధాన్యం ఉందనే సమాచారం యాకోబుకు తెలిసిందనే భావం సందర్భానికి సహజం. తరువాతి మాటతో ఉన్న కాలసంబంధాన్ని ‘తెలుసుకొని’ తెలియజేస్తుంది.
- source_word: כִּי יֶשׁ
  choice: ఉందని
  rationale: כִּי తో కూడిన יֵשׁ యాకోబు గ్రహించిన విషయం ఏమిటో పరిచయం చేస్తుంది; తెలుగులో ‘ఉందని’ సహజమైన నిర్మాణం.
- source_word: שֶׁבֶר
  choice: ధాన్యం
  rationale: కరవు సందర్భంలో కొనడానికి అందుబాటులో ఉన్న ధాన్యాన్ని సూచిస్తుంది; విస్తృతమైన ‘ఆహారం’ కంటే ఇది నిర్దిష్టం.
- source_word: בְּמִצְרָיִם
  choice: ఈజిప్టులో
  rationale: స్థలాన్ని సూచించే בְּ ఉపసర్గను సహజమైన తెలుగు అధికరణ రూపంతో అనువదించాం.
- source_word: לְבָנָיו
  choice: తన కుమారులతో
  rationale: ఇక్కడ בָּנִים యాకోబు కుమారులనే సూచిస్తుంది. אמר ל־ అనే మాటలాడే నిర్మాణానికి తెలుగులో ‘కుమారులతో ... అన్నాడు’ సహజం.
- source_word: לָמָּה
  choice: ఎందుకు
  rationale: ప్రత్యక్ష ప్రశ్నార్థక భావాన్ని సరళంగా నిలుపుతుంది.
- source_word: תִּתְרָאוּ
  choice: ఒకరి ముఖం ఒకరు చూసుకుంటూ ఉన్నారు
  rationale: ראה హిత్పయేల్ రూపం ఇక్కడ పరస్పరం చూసుకుంటూ సంకోచంతో ఏమీ చేయకుండా ఉండడాన్ని సూచించే అవకాశం ఎక్కువ. ‘చూసుకుంటూ ఉన్నారు’ ఆ కొనసాగుతున్న నిష్క్రియను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
