translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. హీబ్రూ వాక్యంలో ‘యాకోబు’ రెండుసార్లు ఉన్నప్పటికీ, తెలుగులో అనవసర పునరుక్తిని నివారించడానికి రెండవసారి సర్వనామ సంబంధమైన ‘తన’ వాడాం. పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో చేర్చబడింది.
