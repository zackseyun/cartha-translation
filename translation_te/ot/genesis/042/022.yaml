  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּעַן֩ רְאוּבֵ֨ן אֹתָ֜/ם לֵ/אמֹ֗ר הֲ/לוֹא֩ אָמַ֨רְתִּי אֲלֵי/כֶ֧ם לֵ/אמֹ֛ר אַל תֶּחֶטְא֥וּ בַ/יֶּ֖לֶד וְ/לֹ֣א שְׁמַעְתֶּ֑ם וְ/גַם דָּמ֖/וֹ הִנֵּ֥ה נִדְרָֽשׁ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/022.yaml
  text: Then Reuben answered them, saying, “Did I not tell you, ‘Do not sin against the boy’? But you did not listen. And now, look, his blood is being required.”
translation:
  language: te
  text: 'అప్పుడు రూబేను వారికి ఇలా జవాబిచ్చాడు: “ఆ బాలునికి విరోధంగా పాపం చేయవద్దని నేను మీతో చెప్పలేదా? అయినా మీరు వినలేదు. ఇదిగో, అతని రక్తానికి కూడా ఇప్పుడు లెక్క అడగబడుతోంది.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַיֶּלֶד
  choice: ఆ బాలునికి విరోధంగా
  rationale: בְּ ఇక్కడ వ్యక్తికి హాని చేసే పాపాన్ని సూచిస్తుంది; ‘బాలుని విషయంలో’ కంటే ‘విరోధంగా’ సందర్భార్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: דָּמוֹ
  choice: అతని రక్తానికి
  rationale: హీబ్రూ రక్తప్రయోగాన్ని నిలిపి, అతని మరణానికి సంబంధించిన రక్తాపరాధ భావాన్ని కాపాడుతుంది.
- source_word: נִדְרָשׁ
  choice: జవాబు చెప్పాల్సి వస్తోంది
  rationale: דרש నిఫాల్ రూపం రక్తానికి లెక్క అడగబడటం లేదా ప్రతిఫలం కోరబడటం అనే భావాన్ని ఇస్తుంది; తెలుగులో సహజంగా ఉండేలా బాధ్యతను సూచించే ప్రయోగం ఎంచుకున్నాం.
- source_word: הִנֵּה
  choice: ఇదిగో, ఇప్పుడు
  rationale: హెచ్చరిక నెరవేరుతున్నదానిపై దృష్టి నిలిపే సూచనాత్మక బలాన్ని వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ‘అతని రక్తం కోరబడుతోంది’ అనే దైవిక కర్త స్పష్టంగా చెప్పబడని వాక్యం
  choice: ‘అతని రక్తానికి జవాబు చెప్పాల్సి వస్తోంది’ అని కర్తను పేర్కొనకుండా ఉంచడం
  alternative: ‘దేవుడు అతని రక్తానికి మీ దగ్గర లెక్క అడుగుతున్నాడు’
  rationale: మూలంలోని నిఫాల్ క్రియ కర్తను ప్రకటించదు. దైవిక న్యాయం సూచితమై ఉండవచ్చు గాని, దేవుని పేరును పాఠ్యంలో చేర్చడం మూలంలోని అర్థసందిగ్ధతను అనవసరంగా పరిష్కరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు స్పష్టంగా ఉండే సంభాషణా శైలి. హీబ్రూలోని పునరుక్త ‘చెప్పుతూ’ తెలుగులో సహజత్వం కోసం ఒకసారి మాత్రమే వ్యక్తీకరించబడింది.
