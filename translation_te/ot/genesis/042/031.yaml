translation_notes:
  register: సాధారణ పాఠకులకు అర్థమయ్యే ఆధునిక ప్రామాణిక తెలుగు; ప్రత్యక్ష సంభాషణకు సహజమైన, గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది.
