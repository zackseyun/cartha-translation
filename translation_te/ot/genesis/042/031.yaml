  text: And we said to him[a], ‘We are honest men[b]; we have not been spies.’
translation:
  language: te
  text: అప్పుడు మేము అతనితో, “మేము నిజాయితీగలవాళ్లం; మేము ఎప్పుడూ గూఢచారులం కాదు[a]” అని చెప్పాము.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మేము గూఢచర్యం చేయలేదు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנֹּאמֶר
  choice: అప్పుడు మేము ... చెప్పాము
  rationale: వయ్యిక్తోల్ రూపం కథనంలోని తదుపరి చర్యను సూచిస్తుంది; ఆధునిక తెలుగు కథన ప్రవాహంలో ‘అప్పుడు’ సహజంగా ఉంటుంది.
- source_word: אֵלָיו
  choice: అతనితో
  rationale: אֶל ఉపసర్గతో మూడవ పురుష ఏకవచన ప్రత్యయం ఉంది; తెలుగు మాటల సందర్భంలో ‘అతనితో చెప్పాము’ సహజమైన సమానార్థకం.
- source_word: כֵּנִים
  choice: నిజాయితీపరులం
  rationale: ఈ పదం గూఢచర్య ఆరోపణకు విరుద్ధంగా నమ్మదగిన, కపటం లేని వ్యక్తులను సూచిస్తుంది; ‘నిజాయితీపరులు’ సాధారణ ఆధునిక తెలుగులో స్పష్టంగా ఉంది.
- source_word: אֲנָחְנוּ
  choice: మేము
  rationale: స్వతంత్ర సర్వనామంలోని ఉద్ఘాటనను తెలుగు వాక్యంలో స్పష్టమైన ‘మేము’ నిలుపుతుంది.
- source_word: לֹא הָיִינוּ מְרַגְּלִים
  choice: మేము గూఢచారులుగా ఉండలేదు
  rationale: నిరాకరించబడిన היה రూపం మరియు బహువచన కృదంతం గత స్థితి లేదా కార్యకలాపాన్ని సూచించగలవు; ప్రధాన అనువాదం వ్యక్తుల స్థితిని సహజ తెలుగులో నిలుపుతుంది, కార్యకలాప భావాన్ని పాదటిప్పణిలో ఇస్తుంది.
