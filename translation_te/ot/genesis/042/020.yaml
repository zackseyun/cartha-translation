- from: మీ తమ్ముణ్ణి నా దగ్గరికి తీసుకురండి. అప్పుడు మీ మాటలు నిజమని నిర్ధారణ అవుతాయి[a]; మీరు చనిపోరు.” వారు అలాగే చేశారు.
  to: మీ అందరికన్నా చిన్నవాడైన మీ తమ్ముణ్ణి నా దగ్గరికి తీసుకురండి; అప్పుడు మీ మాటలు నిజమైనవని నిర్ధారించబడతాయి[a], మీరు చనిపోరు.” వారు అలాగే చేశారు.
  rationale: The revision explicitly represents the youngest-brother sense of הַקָּטֹן and smooths the Telugu expression for the verification of their words. It retains the source’s coordination before ‘you will not die,’ the narrative conclusion, and the lexical ambiguity in the footnote.
