id: GEN.42.20
reference: Genesis 42:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אֶת אֲחִי/כֶ֤ם הַ/קָּטֹן֙ תָּבִ֣יאוּ אֵלַ֔/י וְ/יֵאָמְנ֥וּ דִבְרֵי/כֶ֖ם וְ/לֹ֣א תָמ֑וּתוּ וַ/יַּעֲשׂוּ כֵֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/020.yaml
  text: Then bring your youngest brother to me[a], so that your words may be verified and you will not die.” And they did so.
translation:
  language: te
  text: మీ అందరికన్నా చిన్నవాడైన మీ తమ్ముణ్ణి నా దగ్గరికి తీసుకురండి; అప్పుడు మీ మాటలు నిజమైనవని నిర్ధారించబడతాయి[a], మీరు చనిపోరు.” వారు అలాగే చేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మీ మాటలు ధృవపడతాయి’ లేదా ‘మీ మాటలు నమ్మబడతాయి.’ ఇక్కడి హెబ్రీ క్రియ మాటలు నిజమైనవిగా స్థిరపడడాన్ని లేదా నమ్మదగినవిగా అంగీకరించబడడాన్ని సూచించగలదు; ఈ సందర్భంలో అవి నిజమైనవని నిర్ధారించబడడం అనే భావం అనుకూలంగా ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲחִיכֶם הַקָּטֹן
  choice: మీ తమ్ముణ్ణి
  rationale: הַקָּטֹן అక్షరార్థంగా ‘చిన్నవాడు/చిన్నవయస్కుడు’; సహోదరుల సందర్భంలో బెన్యామీనును సూచించడానికి సహజమైన ఆధునిక తెలుగు ప్రయోగం ‘తమ్ముడు.’ కథన సందర్భం అతడు అందరిలో చిన్నవాడని స్పష్టం చేస్తుంది.
- source_word: תָּבִיאוּ אֵלַי
  choice: నా దగ్గరికి తీసుకురండి
  rationale: בוא యొక్క హిఫీల్ రూపం ‘తీసుకురండి’ అనే కారణార్థక భావాన్ని ఇస్తుంది; אֵלַי ను ‘నా దగ్గరికి’ నేరుగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וְיֵאָמְנוּ
  choice: నిజమని నిర్ధారణ అవుతాయి
  rationale: אמן నిఫాల్ రూపం ఇక్కడ మాటలు నిజమైనవిగా స్థిరపడడం లేదా నమ్మదగినవిగా అంగీకరించబడడం అనే భావం కలిగి ఉంది. యోసేపు వారి వాదనను పరీక్షిస్తున్న సందర్భంలో ‘నిజమని నిర్ధారణ అవుతాయి’ అనేది ప్రధాన భావాన్ని స్పష్టంగా అందిస్తుంది; ప్రత్యామ్నాయ భావాన్ని పాదసూచికలో నిలిపాం.
- source_word: דִבְרֵיכֶם
  choice: మీ మాటలు
  rationale: మూలంలోని బహువచన నిర్మాణాన్ని నేరుగా, సహజమైన తెలుగులో నిలుపుతుంది; వారు ఇంతకుముందు చెప్పిన విషయాలతో అనుసంధానాన్ని కాపాడుతుంది.
- source_word: וְלֹא תָמֻתוּ
  choice: మీరు చనిపోరు
  rationale: హెబ్రీ సమన్వయ వాక్య నిర్మాణంలోని ఫలితం/పర్యవసాన భావాన్ని సంక్షిప్తంగా నిలుపుతుంది; ఆజ్ఞను పాటిస్తే మరణించరనే హామీతో కూడిన హెచ్చరికను వ్యక్తం చేస్తుంది.
- source_word: וַיַּעֲשׂוּ כֵן
  choice: వారు అలాగే చేశారు
  rationale: వారి అనుసరణను తెలిపే హెబ్రీ కథన సూత్రానికి సహజమైన తెలుగు సమానార్థకం.
