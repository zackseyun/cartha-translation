translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘మీ తమ్ముణ్ణి’ అనే రూపం సాధారణ పాఠకులకు సులభంగా అర్థమవుతుంది; ‘నిర్ధారణ’ పరిశీలన సందర్భాన్ని స్పష్టంగా తెలియజేస్తుంది.
