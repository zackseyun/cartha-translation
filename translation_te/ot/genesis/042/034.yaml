translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ప్రత్యక్ష సంభాషణ శైలి వాడబడింది. పదాంత సంధుల్లో సాధారణ తెలుగు రూపాలు (‘తమ్ముణ్ణి,’ ‘సోదరుణ్ణి’) ఎంచుకోబడ్డాయి. మూలంలోని వాణిజ్య/సంచార అర్థసంభావ్యతను పాదటిప్పణిలో నిలుపుకున్నాం.
