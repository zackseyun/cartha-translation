  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ֠/הָבִיאוּ אֶת אֲחִי/כֶ֣ם הַ/קָּטֹן֮ אֵלַ/י֒ וְ/אֵֽדְעָ֗ה כִּ֣י לֹ֤א מְרַגְּלִים֙ אַתֶּ֔ם כִּ֥י כֵנִ֖ים אַתֶּ֑ם אֶת אֲחִי/כֶם֙ אֶתֵּ֣ן לָ/כֶ֔ם וְ/אֶת הָ/אָ֖רֶץ תִּסְחָֽרוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/034.yaml
  text: Bring your youngest brother to me[a], so that I may know that you are not spies, but honest men. Then I will give your brother back to you, and you may trade in the land.”
translation:
  language: te
  text: “మీ చిన్న సోదరుణ్ణి నా దగ్గరకు తీసుకురండి. అప్పుడు మీరు గూఢచారులు కాదని, నిజాయితీగలవారని నేను తెలుసుకుంటాను. మీ సోదరుణ్ణి మీకు తిరిగి ఇస్తాను; మీరు ఈ దేశంలో వ్యాపారం చేసుకోవచ్చు[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీరు ఈ దేశంలో సంచరించవచ్చు.” హీబ్రూ క్రియకు విస్తృతంగా సంచరించడం అనే అర్థం కూడా ఉండవచ్చు; అయితే ఈ సందర్భంలో “వ్యాపారం చేయడం” అనే అర్థమే ఎక్కువగా సరిపోతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָבִיאוּ
  choice: తీసుకురండి
  rationale: בוא అనే ధాతువు హిఫీల్ ఆజ్ఞార్థక రూపంలో ఉంది; తెలుగులో ‘తీసుకురండి’ సహజమైన ప్రత్యక్ష ఆజ్ఞ.
- source_word: אֲחִיכֶם הַקָּטֹן
  choice: మీ చిన్న తమ్ముణ్ణి
  rationale: సోదరుల సందర్భంలో הַקָּטֹן వయసులో చిన్నవాడిని సూచిస్తుంది; తెలుగు బంధుత్వ పదమైన ‘తమ్ముడు’ ఈ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וְאֵדְעָה
  choice: అప్పుడు … నేను తెలుసుకుంటాను
  rationale: కోహోర్టేటివ్ రూపం ఆజ్ఞ నెరవేరిన ఫలితాన్ని లేదా ఉద్దేశాన్ని సూచిస్తుంది; ఈ సందర్భంలో తెలుగు ఫలిత వాక్యం సహజంగా ఉంటుంది.
- source_word: כִּי לֹא מְרַגְּלִים אַתֶּם
  choice: మీరు గూఢచారులు కాదని
  rationale: מְרַגְּלִים ఇక్కడ వ్యక్తులను సూచించే బహువచన నామవాచక భావంలో ఉంది.
- source_word: כִּי כֵנִים אַתֶּם
  choice: నిజాయితీపరులని
  rationale: כֵנִים విశ్వసనీయత, యథార్థత లేదా నిజాయితీని సూచిస్తుంది; ‘నిజాయితీపరులు’ గూఢచారులకు వ్యతిరేక భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: אֶת אֲחִיכֶם אֶתֵּן לָכֶם
  choice: మీ సోదరుణ్ణి మీకు తిరిగి అప్పగిస్తాను
  rationale: నిర్బంధించబడిన సోదరుణ్ణి తిరిగి ఇవ్వడం సందర్భంలో అంతర్భూతం; ‘తిరిగి అప్పగిస్తాను’ దానిని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: וְאֶת הָאָרֶץ תִּסְחָרוּ
  choice: మీరు ఈ దేశంలో వ్యాపారం చేసుకోవచ్చు
  rationale: סחר సాధారణంగా వర్తకం లేదా వ్యాపారాన్ని సూచిస్తుంది; కరవు సందర్భంలో ధాన్యం కొనుగోలు కోసం వ్యాపారం చేయడానికి అనుమతి అనే భావం బాగా సరిపోతుంది.
