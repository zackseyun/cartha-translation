translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కథనానికి తగిన గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన శైలి. ‘ఇదిగో’ ద్వారా మూలంలోని ఆకస్మిక ఆవిష్కరణ భావం నిలుపబడింది; ‘వెండి మూట’ ద్వారా ద్రవ్యమూ దానిని కట్టి ఉంచిన రూపమూ రెండూ ప్రతిఫలించాయి.
