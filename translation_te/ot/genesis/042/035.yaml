id: GEN.42.35
reference: Genesis 42:35
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְהִ֗י הֵ֚ם מְרִיקִ֣ים שַׂקֵּי/הֶ֔ם וְ/הִנֵּה אִ֥ישׁ צְרוֹר כַּסְפּ֖/וֹ בְּ/שַׂקּ֑/וֹ וַ/יִּרְא֞וּ אֶת צְרֹר֧וֹת כַּסְפֵּי/הֶ֛ם הֵ֥מָּה וַ/אֲבִי/הֶ֖ם וַ/יִּירָֽאוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/035.yaml
  text: And as they were emptying their sacks[a], behold, each man’s bundle of silver was in his sack; and they saw their bundles of silver, they and their father[b], and they were afraid.
translation:
  language: te
  text: వారు తమ సంచులను ఖాళీ చేస్తుండగా, ఇదిగో, ఒక్కొక్కరి వెండి మూట అతని సంచిలో ఉంది. వారి వెండి మూటలను చూసి, వారూ వారి తండ్రিও భయపడ్డారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי הֵם מְרִיקִים
  choice: వారు ... ఖాళీ చేస్తుండగా
  rationale: היה తో కూడిన కృదంత నిర్మాణం నేపథ్యంగా కొనసాగుతున్న చర్యను సూచిస్తుంది. తెలుగులో సహజమైన కాలసంబంధ ఉపవాక్యంగా అనువదించబడింది; ప్రత్యేకంగా ‘జరిగింది’ అని చేర్చకపోయినా కథన సంబంధం నిలుస్తుంది.
- source_word: שַׂקֵּיהֶם
  choice: తమ సంచులను
  rationale: שַׂק ధాన్యం లేదా సరుకులు పెట్టే సంచిని సూచిస్తుంది. ఆధునిక తెలుగులో ‘సంచులు’ స్పష్టంగా, సహజంగా ఉంది.
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: అకస్మాత్తుగా గమనించిన విషయాన్నీ ఆశ్చర్యాన్నీ సూచించే హీబ్రూ అవ్యయ బలాన్ని ‘ఇదిగో’ నిలుపుతుంది.
- source_word: אִישׁ
  choice: ఒక్కొక్కరి
  rationale: ఇక్కడ אִישׁ పంపిణీ భావంలో ఉంది; ప్రతి వ్యక్తికి సంబంధించినదని ‘ఒక్కొక్కరి’ సహజంగా తెలియజేస్తుంది.
- source_word: צְרוֹר כַּסְפּוֹ
  choice: వెండి మూట
  rationale: צְרוֹר కట్టబడిన లేదా చుట్టబడిన వస్తువును సూచిస్తుంది; כֶּסֶף ఇక్కడ చెల్లింపుగా వాడిన వెండి. ‘వెండి మూట’ రెండు అంశాలనూ సంక్షిప్తంగా నిలుపుతుంది.
- source_word: בְּשַׂקּוֹ
  choice: అతని సంచిలోనే
  rationale: ఏ వ్యక్తి వెండి మూట అతని స్వంత సంచిలో ఉందనే ఏకవచన పంపిణీ సంబంధాన్ని నిలుపుతుంది. ‘నే’ అకస్మాత్తు కనుగొనబడిన స్థలాన్ని సహజంగా ఉద్ఘాటిస్తుంది.
- source_word: וַיִּרְאוּ אֶת צְרֹרוֹת כַּסְפֵּיהֶם
  choice: తమ వెండి మూటలను చూసి
  rationale: బహువచన పునరుక్తిని నిలుపుతూ, తరువాతి భయ ప్రతిస్పందనతో తెలుగులో సహజంగా అనుసంధానించబడింది.
- source_word: הֵמָּה וַאֲבִיהֶם
  choice: వారూ వారి తండ్రి కూడా
  rationale: చూసినవారు కుమారులే కాక వారి తండ్రి కూడా అని హీబ్రూలోని ఉద్ఘాటనను స్పష్టంగా నిలుపుతుంది.
- source_word: וַיִּירָאוּ
  choice: భయపడ్డారు
  rationale: కనుగొన్న దానికి తక్షణ ప్రతిస్పందనగా కలిగిన భయాన్ని ఆధునిక, సహజ తెలుగులో వ్యక్తం చేస్తుంది.
