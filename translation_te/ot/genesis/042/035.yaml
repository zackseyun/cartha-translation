revisions:
- from: వారు తమ సంచులను ఖాళీ చేస్తుండగా, ఇదిగో, ఒక్కొక్కరి వెండి మూట అతని సంచిలోనే ఉంది. వారు—వారూ వారి తండ్రి కూడా—తమ వెండి మూటలను చూసి భయపడ్డారు.
  to: వారు తమ సంచులను ఖాళీ చేస్తుండగా, ఇదిగో, ఒక్కొక్కరి వెండి మూట అతని సంచిలో ఉంది. వారి వెండి మూటలను చూసి, వారూ వారి తండ్రিও భయపడ్డారు.
  rationale: The revision preserves every source element while replacing the unnatural parenthetical repetition with a clear coordinated subject. It also removes a nonessential added emphasis from the locative phrase. No footnote is necessary because the rendering does not resolve a disputed textual ambiguity or require explanatory supplementation.
