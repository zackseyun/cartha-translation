  yaml_path: translation/ot/genesis/042/032.yaml
  text: We are twelve brothers[a], sons of our father. One is no more[b], and the youngest is with our father today in the land of Canaan.
translation:
  language: te
  text: “మేము పన్నెండుమంది అన్నదమ్ములం—మా తండ్రి కుమారులం. ఒకడు లేడు[a]; అందరిలో చిన్నవాడు ఈ రోజు కనాను దేశంలో మా తండ్రితో ఉన్నాడు.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “ఒకడు లేడు.” ఈ హీబ్రూ నుడికారం ఆ వ్యక్తి కనిపించకపోవడం, వెళ్లిపోవడం, లేదా చనిపోయి ఉండవచ్చని భావించడం వంటి అర్థాలను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁנֵים עָשָׂר אֲנַחְנוּ אַחִים
  choice: మేము పన్నెండుమంది అన్నదమ్ములం
  rationale: సంఖ్యను, స్వతంత్ర సర్వనామాన్ని, సహోదర సంబంధాన్ని సహజమైన ఆధునిక తెలుగులో ఒకే నామవాక్యంగా అందిస్తుంది.
- source_word: בְּנֵי אָבִינוּ
  choice: మా తండ్రి కుమారులం
  rationale: మూలంలోని అనుబంధ వివరణను నిలుపుతూ, వారంతా తమ తండ్రి కుమారులని స్పష్టంగా చెబుతుంది; ‘ఒకే తండ్రి’ అనే పదాన్ని మూలంలో లేనందున చేర్చలేదు.
- source_word: הָאֶחָד אֵינֶנּוּ
  choice: ఒకడు లేడు
  rationale: ‘ఒకడు లేడు’ అనేది హీబ్రూ నుడికారంలోని సంక్షిప్తతను, అతడు కనిపించకపోవడం లేదా మరణించి ఉండవచ్చనే ఉద్దేశపూర్వక అస్పష్టతను నిలుపుతుంది.
- source_word: וְהַקָּטֹן
  choice: చిన్నవాడు
  rationale: సహోదరుల సందర్భంలో ఈ విశేషణం వయస్సులో చిన్నవాడిని సూచిస్తుంది. ‘చిన్నవాడు’ సహజంగా ఉండి, ‘అందరికంటే చిన్నవాడు’ అనే భావాన్ని సందర్భమే తెలియజేస్తుంది.
- source_word: הַיּוֹם
  choice: ఈ రోజు
  rationale: మూలంలోని కాలసూచక పదాన్ని నేరుగా, సహజంగా అనువదిస్తుంది.
- source_word: אֶת אָבִינוּ
  choice: మా తండ్రి దగ్గర
  rationale: ఇక్కడ אֶת సహవాసాన్ని సూచిస్తుంది. తెలుగులో ‘దగ్గర’ అనేది చిన్న కుమారుడు తండ్రితోనే ఉన్నాడనే భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: కనాను దేశంలో
  rationale: మూలంలోని ‘దేశం’ అనే పదాన్ని నిలుపుతూ భౌగోళిక పేరును సాధారణ తెలుగు రూపంలో అందిస్తుంది.
theological_decisions:
- issue: אֵינֶנּוּ అనే మాట యోసేపు మరణించాడని ఖచ్చితంగా చెబుతుందా అనే ప్రశ్న
  choice: ఒకడు లేడు
  alternative: ఒకడు ఇక లేడు / ఒకడు చనిపోయాడు
  rationale: మాట్లాడేవారు యోసేపు మరణించాడని భావించినప్పటికీ, హీబ్రూ వాక్యం అక్షరార్థంగా ‘అతడు లేడు’ అని మాత్రమే చెబుతుంది. కాబట్టి మరణాన్ని అనువాదంలో ఖరారు చేయకుండా మూలంలోని ఉద్వేగభరితమైన అస్పష్టతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, కుటుంబ సంభాషణకు తగిన సహజమైనప్పటికీ గౌరవప్రదమైన శైలి వాడబడింది. ‘అన్నదమ్ములు’ పురుష సహోదరులను స్పష్టంగా సూచిస్తుంది. హీబ్రూ నామవాక్య నిర్మాణాన్ని తెలుగులో సహజంగా వినిపించేలా ‘అన్నదమ్ములం,’ ‘కుమారులం,’ ‘ఉన్నాడు’ రూపాలతో వ్యక్తం చేశాం.
