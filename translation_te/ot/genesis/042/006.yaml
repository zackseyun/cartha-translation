source:
  edition: WLC
  text: וְ/יוֹסֵ֗ף ה֚וּא הַ/שַּׁלִּ֣יט עַל הָ/אָ֔רֶץ ה֥וּא הַ/מַּשְׁבִּ֖יר לְ/כָל עַ֣ם הָ/אָ֑רֶץ וַ/יָּבֹ֨אוּ֙ אֲחֵ֣י יוֹסֵ֔ף וַ/יִּשְׁתַּֽחֲווּ ל֥/וֹ אַפַּ֖יִם אָֽרְצָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/006.yaml
  text: Joseph was the ruler over the land; he was the one who sold grain to all the people of the land[a]. And Joseph’s brothers came and bowed down to him with their faces to the ground.
translation:
  language: te
  text: యోసేపు ఆ దేశంపై అధిపతిగా ఉన్నాడు; ఆ దేశ ప్రజలందరికీ ధాన్యం అమ్మేవాడు అతడే. యోసేపు సోదరులు వచ్చి అతని ఎదుట ముఖాలను నేలకు ఆనించి నమస్కరించారు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతని ఎదుట సాష్టాంగపడ్డారు.” హీబ్రూ క్రియ గౌరవసూచకంగా లోతుగా వంగడాన్ని లేదా పూర్తిగా సాష్టాంగపడడాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשַּׁלִּיט
  choice: అధిపతి
  rationale: దేశంపై అధికారం చలాయించే వ్యక్తిని సూచిస్తుంది; నిర్దిష్టమైన పరిపాలనా పదవిని అనవసరంగా నిర్ధారించకుండా యోసేపు అధికార స్థానాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: עַל הָאָרֶץ
  choice: ఆ దేశానికి
  rationale: ఈ సందర్భంలో אֶרֶץ భూమి అంతటినీ కాక, కథలో ప్రస్తావనలో ఉన్న ఐగుప్తు దేశాన్ని సూచిస్తుంది.
- source_word: הַמַּשְׁבִּיר
  choice: ధాన్యం అమ్మేవాడు
  rationale: కరవు సందర్భంలో שׁבר హిఫిల్ రూపం ధాన్యం అమ్మడాన్ని సూచిస్తుంది; సందర్భం ద్వారా గ్రహించబడే ధాన్యాన్ని తెలుగులో స్పష్టంగా పేర్కొనడం సహజం.
- source_word: לְכָל עַם הָאָרֶץ
  choice: ఆ దేశ ప్రజలందరికీ
  rationale: עַם సమూహార్థక ఏకవచనం; ఇక్కడ הָאָרֶץ స్థానికంగా ఆ దేశాన్నే సూచిస్తుంది.
- source_word: אֲחֵי יוֹסֵף
  choice: యోసేపు సోదరులు
  rationale: హీబ్రూ నిర్మాణ సంబంధాన్ని తెలుగులో సహజమైన స్వామ్య నిర్మాణంతో వ్యక్తపరుస్తుంది.
- source_word: וַיִּשְׁתַּחֲווּ לוֹ
  choice: అతనికి నమస్కరించారు
  rationale: שׁחה లోతుగా వంగడం లేదా సాష్టాంగపడడం ద్వారా గౌరవం చూపడాన్ని సూచించగలదు. ఇక్కడ దైవారాధన భావాన్ని చేర్చకుండా సామాజిక విధేయతను వ్యక్తపరుస్తుంది.
- source_word: אַפַּיִם אָרְצָה
  choice: నేలకు ముఖాలు వంచి
  rationale: ఈ హీబ్రూ నుడికారం వారు అత్యంత లోతుగా వంగిన భంగిమను వర్ణిస్తుంది; తెలుగులో సహజంగా శారీరక భంగిమను తెలియజేస్తుంది.
- source_word: וְ
  choice: ప్రత్యేక పదం లేకుండా వాక్యక్రమంతో అనుసంధానం
  rationale: ప్రారంభ సంధి కథనాన్ని కొనసాగిస్తుంది; తెలుగులో అదనపు కాలసూచక పదాన్ని చేర్చకుండా వాక్య పరంపర ద్వారానే ఆ అనుసంధానం సహజంగా వ్యక్తమవుతుంది.
theological_decisions:
- issue: యోసేపు ఎదుట అతని సోదరులు చేసిన చర్య
  choice: నేలకు ముఖాలు వంచి అతనికి నమస్కరించారు
  alternative: అతని ఎదుట సాష్టాంగపడ్డారు
  rationale: ఈ దృశ్యం సామాజిక విధేయతను, గాఢ గౌరవాన్ని చూపుతుంది; దైవారాధన అని అనవసరంగా నిర్ధారించకుండా శారీరక చర్యను నిలుపుతుంది. అదే సమయంలో పూర్తి సాష్టాంగ ప్రణామం అనే సాధ్యమైన భావాన్ని పాదసూచికలో ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే గంభీర కథన శైలి. ‘అధిపతి’ అధికారాన్ని తెలియజేస్తుంది గాని నిర్దిష్ట పదవిని విధించదు; ‘నమస్కరించారు’కు జతచేసిన శారీరక భంగిమ మూలంలోని లోతైన వంగడాన్ని స్పష్టపరుస్తుంది.
