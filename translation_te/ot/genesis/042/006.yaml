revisions:
- from: యోసేపు ఆ దేశానికి అధిపతిగా ఉన్నాడు; ఆ దేశ ప్రజలందరికీ ధాన్యం అమ్మేవాడు అతడే. యోసేపు సోదరులు వచ్చి, నేలకు ముఖాలు వంచి అతనికి నమస్కరించారు.[a]
  to: యోసేపు ఆ దేశంపై అధిపతిగా ఉన్నాడు; ఆ దేశ ప్రజలందరికీ ధాన్యం అమ్మేవాడు అతడే. యోసేపు సోదరులు వచ్చి అతని ఎదుట ముఖాలను నేలకు ఆనించి నమస్కరించారు[a].
  rationale: The revision strengthens the rendering of the Hebrew idiom אַפַּיִם אָרְצָה from a potentially partial bow to a face-to-ground posture. It retains the source’s ambiguity between deep bowing and full prostration by placing the latter as a lexical alternative in the footnote. The footnote anchor is retained directly on the verb describing the act of homage.
