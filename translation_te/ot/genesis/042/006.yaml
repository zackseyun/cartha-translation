  timestamp: '2026-07-17T21:08:36Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately identifies Joseph as the authority over Egypt and as the seller of grain, and it retains the brothers’ arrival and their act of homage. However, “నేలకు ముఖాలు వంచి” can suggest merely lowering or bowing the face, whereas אַפַּיִם אָרְצָה depicts a much more fully face-to-ground posture. The revision states that posture more clearly without turning it into worship.
  naturalness: The revised wording is modern, idiomatic Telugu narrative prose. “ముఖాలను నేలకు ఆనించి” naturally conveys the physical posture; “అతని ఎదుట” makes the direction of the homage explicit.
  terminology: “అధిపతి” is an appropriate non-specific rendering of הַשַּׁלִּיט. “ధాన్యం అమ్మేవాడు” correctly represents the contextual sense of הַמַּשְׁבִּיר. “నమస్కరించారు” is acceptable when qualified by the face-to-ground posture and does not impose a cultic sense.
  issues:
  - severity: medium
    issue: The phrase “నేలకు ముఖాలు వంచి” understates the face-to-ground idiom.
    rationale: אַפַּיִם אָרְצָה describes faces directed to/at the ground in an act of deep prostration. Simply bending faces can denote a less complete gesture. “ముఖాలను నేలకు ఆనించి” preserves the embodied depth of the source expression.
  revised_text: యోసేపు ఆ దేశంపై అధిపతిగా ఉన్నాడు; ఆ దేశ ప్రజలందరికీ ధాన్యం అమ్మేవాడు అతడే. యోసేపు సోదరులు వచ్చి అతని ఎదుట ముఖాలను నేలకు ఆనించి నమస్కరించారు[a].
