id: GEN.42.4
reference: Genesis 42:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אֶת בִּנְיָמִין֙ אֲחִ֣י יוֹסֵ֔ף לֹא שָׁלַ֥ח יַעֲקֹ֖ב אֶת אֶחָ֑י/ו כִּ֣י אָמַ֔ר פֶּן יִקְרָאֶ֖/נּוּ אָסֽוֹן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/004.yaml
  text: But Jacob did not send Benjamin[a], Joseph’s brother, with his brothers, for he said, “Lest harm happen to him.”
translation:
  language: te
  text: కానీ యాకోబు యోసేపు సహోదరుడైన బెన్యామీనును అతని సహోదరులతో పంపలేదు; ఎందుకంటే, “అతనికి ఆపద[a] కలుగుతుందేమో” అని అతడు అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “విపత్తు అతనికి సంభవించవచ్చు.”
    reason: אָסוֹן అనే పదానికి ‘ఆపద,’ ‘విపత్తు,’ లేదా ‘తీవ్ర హాని’ అనే విస్తృత భావపరిధి ఉంది.
lexical_decisions:
- source_word: וְ/אֶת
  choice: కానీ
  rationale: ముందటి వచనంలో ఇతర కుమారులు వెళ్లిన దానికి భిన్నంగా బెన్యామీను పంపబడలేదనే వ్యత్యాసాన్ని సందర్భానుసారంగా తెలియజేస్తుంది; אֶת కర్మ సూచకం కాబట్టి ప్రత్యేకంగా అనువదించబడలేదు.
- source_word: בִּנְיָמִין
  choice: బెన్యామీను
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: אֲחִי יוֹסֵף
  choice: యోసేపు తమ్ముడైన
  rationale: ఇద్దరూ ఒకే తల్లికి పుట్టినవారు, బెన్యామీను యోసేపుకంటే చిన్నవాడు అనే కథన సందర్భంలో సహజమైన తెలుగు బంధుత్వ పదం; మూలంలోని సహోదర సంబంధాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: לֹא שָׁלַח
  choice: పంపలేదు
  rationale: שׁלח అనే సాధారణ క్రియకు కథన సందర్భంలో నేరమైన, సహజమైన తెలుగు అనువాదం.
- source_word: אֶת אֶחָיו
  choice: అతని అన్నలతో
  rationale: బెన్యామీను వారితో కలిసి పంపబడలేదనే భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; కథన సందర్భంలో వారు అతనికంటే పెద్దవారు.
- source_word: כִּי אָמַר
  choice: ఎందుకంటే … అని అతడు అన్నాడు
  rationale: כִּי కారణాన్ని తెలియజేస్తుంది; אָמַר ను ‘అన్నాడు’గా నేరుగా ఉంచి ‘అనుకున్నాడు’ అనే వ్యాఖ్యానాన్ని చేర్చలేదు.
- source_word: פֶּן
  choice: కలగవచ్చేమో
  rationale: భయపడుతున్న సంభావ్యతను సూచించే פֶּן భావాన్ని ఆధునిక సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: יִקְרָאֶנּוּ
  choice: అతనికి … కలగవచ్చేమో
  rationale: ఆపద ఒకరికి సంభవించడాన్ని సూచించే హీబ్రూ ప్రయోగానికి సహజమైన తెలుగు రూపం.
- source_word: אָסוֹן
  choice: ఏదైనా ఆపద
  rationale: తీవ్రమైన హాని, దుర్ఘటన లేదా విపత్తు అనే విస్తృత భావాన్ని ఒక నిర్దిష్ట ఘటనగా పరిమితం చేయకుండా కాపాడుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి. ‘లేకపోతే అతనికి ఆపద కలుగుతుంది’ కంటే ‘కలగవచ్చేమో’ అనేది తండ్రి భయాన్ని సహజంగా వ్యక్తం చేస్తుంది. పాదటిప్పణి అవసరం లేదు; ప్రధాన పాఠమే אָסוֹן యొక్క భావ పరిధిని సముచితంగా నిలుపుతుంది.
