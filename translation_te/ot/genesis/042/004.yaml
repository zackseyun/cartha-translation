revisions:
- from: కానీ యాకోబు యోసేపు తమ్ముడైన బెన్యామీనును అతని అన్నలతో పంపలేదు. ఎందుకంటే, “అతనికి ఏదైనా ఆపద కలగవచ్చేమో” అని అతడు అన్నాడు.
  to: కానీ యాకోబు యోసేపు సహోదరుడైన బెన్యామీనును అతని సహోదరులతో పంపలేదు; ఎందుకంటే, “అతనికి ఆపద[a] కలుగుతుందేమో” అని అతడు అన్నాడు.
  rationale: Source-level age neutrality is restored by replacing “తమ్ముడైన” with “సహోదరుడైన.” The matching “సహోదరులతో” keeps the referential relationship clear without adding an age distinction. The feared possibility introduced by פֶּן is retained in “కలుగుతుందేమో,” and a footnote records the viable ‘disaster/calamity’ sense of אָסוֹן.
