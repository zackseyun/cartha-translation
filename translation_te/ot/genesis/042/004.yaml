  revision_rationale: Source-level age neutrality is restored by replacing “తమ్ముడైన” with “సహోదరుడైన.” The matching “సహోదరులతో” keeps the referential relationship clear without adding an age distinction. The feared possibility introduced by פֶּן is retained in “కలుగుతుందేమో,” and a footnote records the viable ‘disaster/calamity’ sense of אָסוֹן.
