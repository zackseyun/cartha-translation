id: GEN.42.36
reference: Genesis 42:36
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֲלֵ/הֶם֙ יַעֲקֹ֣ב אֲבִי/הֶ֔ם אֹתִ֖/י שִׁכַּלְתֶּ֑ם יוֹסֵ֤ף אֵינֶ֨/נּוּ֙ וְ/שִׁמְע֣וֹן אֵינֶ֔/נּוּ וְ/אֶת בִּנְיָמִ֣ן תִּקָּ֔חוּ עָלַ֖/י הָי֥וּ כֻלָּֽ/נָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/036.yaml
  text: 'And Jacob their father said to them[a], “You have bereaved me: Joseph is no more, and Simeon is no more, and you would take Benjamin[b]. All these things have come against me.”'
translation:
  language: te
  text: 'వారి తండ్రి యాకోబు వారితో ఇలా అన్నాడు: “మీరు నన్ను బిడ్డలను కోల్పోయినవాడిగా చేశారు[a]. యోసేపు లేడు, షిమ్యోను లేడు; ఇప్పుడు బెన్యామీనును కూడా తీసుకుపోవాలనుకుంటున్నారు. ఇవన్నీ నాకు విరోధంగా జరిగాయి[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీరు నన్ను బిడ్డలు లేనివాడిగా చేశారు.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “అవన్నీ నాకు విరోధంగా ఉన్నాయి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁכַּלְתֶּם
  choice: మీరు నన్ను బిడ్డలను కోల్పోయినవాడిగా చేశారు
  rationale: పీయేల్ రూపంలోని ‘బిడ్డలను కోల్పోయేలా చేయడం/శోకంలో ముంచడం’ అనే కారణార్థాన్ని, బహువచన కర్తను, ముందుకు తెచ్చిన ‘నన్ను’ అనే బాధితుని భావాన్ని నిలుపుతుంది.
- source_word: אֵינֶנּוּ
  choice: లేడు
  rationale: యోసేపు విషయంలోనూ షిమ్యోను విషయంలోనూ ఒకే హీబ్రూ పదబంధం ఉంది. ‘లేడు’ అనేది మరణమని లేదా కేవలం తాత్కాలిక గైర్హాజరని ప్రత్యేకంగా నిర్ణయించకుండా, నష్టం/లేమి అనే ఉమ్మడి భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: תִּקָּחוּ
  choice: తీసుకుపోవాలనుకుంటున్నారు
  rationale: రూపపరంగా అసంపూర్ణ క్రియ అయినా, సందర్భంలో ప్రతిపాదిత లేదా ఉద్దేశిత చర్యపై యాకోబు చేస్తున్న నిరసనను వ్యక్తం చేస్తుంది; తెలుగులో సాధారణ భవిష్యత్తుకన్నా ఈ రూపం సందర్భార్థాన్ని సహజంగా అందిస్తుంది.
- source_word: עָלַי הָיוּ כֻלָּנָה
  choice: ఇవన్నీ నాకు విరోధంగా జరిగాయి
  rationale: సంఘటనలన్నీ యాకోబుకు ప్రతికూలంగా వచ్చిపడ్డాయనే సమష్టి, విరోధార్థాలను నిలుపుతుంది.
- source_word: אֹתִי
  choice: నన్ను
  rationale: హీబ్రూలో ముందుకు తెచ్చిన కర్మ యాకోబే నష్టాన్ని అనుభవిస్తున్నాడనే నొక్కిచెప్పడాన్ని తెలుగులో స్పష్టంగా ఉంచుతుంది.
- source_word: יַעֲקֹב אֲבִיהֶם
  choice: వారి తండ్రి యాకోబు
  rationale: తెలుగులో సహజమైన నామవాచక క్రమంతో సంబంధాన్ని, వ్యక్తి పేరును స్పష్టంగా తెలియజేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. యోసేపు, షిమ్యోను ఇద్దరికీ ఒకే ‘లేడు’ రూపాన్ని వాడి మూలంలోని ఉద్దేశపూర్వక సమాంతరతను, మరణం/గైర్హాజరు మధ్య ఉన్న సందర్భసంబంధ అస్పష్టతను కాపాడాం.
