id: GEN.42.19
reference: Genesis 42:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אִם כֵּנִ֣ים אַתֶּ֔ם אֲחִי/כֶ֣ם אֶחָ֔ד יֵאָסֵ֖ר בְּ/בֵ֣ית מִשְׁמַרְ/כֶ֑ם וְ/אַתֶּם֙ לְכ֣וּ הָבִ֔יאוּ שֶׁ֖בֶר רַעֲב֥וֹן בָּתֵּי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/019.yaml
  text: If you are honest[a], let one of your brothers be confined in your place of custody, and you[c][b], go and bring grain for the famine of your households.
translation:
  language: te
  text: మీరు నిజాయితీగలవారైతే[a], మీ సోదరుల్లో ఒకడు మీరు నిర్బంధంలో ఉన్న చోట[b] బంధించబడి ఉండాలి. మిగిలిన మీరు వెళ్లి, మీ ఇళ్లవారికి కరవు సమయంలో అవసరమైన ధాన్యాన్ని తీసుకెళ్లండి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘మీరు సత్యవంతులైతే.’ హెబ్రీ విశేషణాన్ని మరింత అక్షరార్థంగా ‘నిజమైనవారు’ లేదా ‘సత్యవంతులు’ అని అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా ‘మీ నిర్బంధ గృహంలో’ లేదా ‘మీ కాపలా గృహంలో.’
    reason: lexical_alternative
lexical_decisions:
- source_word: כֵּנִים
  choice: నిజాయితీపరులు
  rationale: ఈ విచారణ సందర్భంలో వారు చెప్పేది నిజమా అనే భావమే ప్రధానమైనది. ‘నిజాయితీపరులు’ ఆధునిక తెలుగులో సహజంగా ఉండి, హెబ్రీ విశేషణంలోని సత్యనిష్ఠ భావాన్ని తెలియజేస్తుంది.
- source_word: אֲחִיכֶם אֶחָד
  choice: మీ సోదరుల్లో ఒకడు
  rationale: సోదరుల సమూహంలో ఒక వ్యక్తిని సూచించే హెబ్రీ నిర్మాణంలోని భాగార్థాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: יֵאָסֵר
  choice: బంధించబడి ఉండాలి
  rationale: נאסר రూపం బంధించబడటం లేదా నిర్బంధంలో ఉంచబడటాన్ని సూచించగలదు. సమీపంలోని కాపలా స్థలం సందర్భంలో ఈ ఎంపిక నిర్బంధ భావాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: בְּבֵית מִשְׁמַרְכֶם
  choice: మిమ్మల్ని ఉంచిన నిర్బంధ స్థలంలో
  rationale: అక్షరార్థంగా ‘మీ కాపలా/నిర్బంధ గృహంలో’. ప్రత్యయం వారు ప్రస్తుతం ఉంచబడిన నిర్బంధాన్ని సూచిస్తుందని గ్రహించి, అధికంగా వ్యవస్థీకృతమైన ‘కారాగారం’ భావాన్ని దిగుమతి చేయకుండా అనువదించబడింది.
- source_word: וְאַתֶּם לְכוּ
  choice: మిగిలిన మీరు వెళ్లి
  rationale: ఒక సోదరుడు వెనుక ఉండటానికి విరుద్ధంగా మిగిలిన వారిని ఉద్దేశించిన ఉద్ఘాటనను తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; וְ అనే సాధారణ అనుసంధానాన్ని బలమైన విరోధార్థకంగా మార్చదు.
- source_word: הָבִיאוּ
  choice: తీసుకెళ్లండి
  rationale: మాట్లాడుతున్న యోసేపు దృష్టిలో వారు ధాన్యాన్ని అక్కడి నుండి తమ ఇళ్లకు తీసుకెళ్లాలి. తెలుగు దిశాసూచక వాడుకలో ‘తీసుకెళ్లండి’ సందర్భానికి సహజమైనది.
- source_word: שֶׁבֶר
  choice: ధాన్యం
  rationale: యోసేపు కథనంలో ఈ పదం కరవు సమయంలో కొనుగోలు చేసే ధాన్యాన్ని సాధారణంగా సూచిస్తుంది.
- source_word: רַעֲבוֹן בָּתֵּיכֶם
  choice: మీ ఇళ్లవారి కరవు కోసం
  rationale: హెబ్రీలోని ‘మీ ఇళ్ల కరవు’ అనే సంక్షిప్త సంబంధాన్ని సాధ్యమైనంత దగ్గరగా ఉంచుతూ, ‘ఇళ్లు’ను భవనాలుగా కాక ఇంటివారిగా అర్థమయ్యేలా ‘ఇళ్లవారు’ అని ఇచ్చింది.
