translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, కథనానికి తగిన ఆజ్ఞారూప శైలి ఉపయోగించబడింది. ‘మిగిలిన మీరు’ అనే పదబంధం ఒక సోదరుడు నిర్బంధంలో ఉండగా ఇతరులు వెళ్లాలనే వ్యత్యాసాన్ని సహజంగా స్పష్టం చేస్తుంది. మూలంలోని కరవు–ఇళ్ల సంబంధాన్ని పూర్తిగా ‘ఆకలితో ఉన్న కుటుంబాలు’గా వివరణాత్మకంగా మార్చకుండా నిలుపుకుంది.
