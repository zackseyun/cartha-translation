review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the conditional test, the selection of one brother, detention, and the command to obtain grain. However, ‘మీ ఇళ్లవారి కరవు కోసం’ is not natural Telugu and can imply that the household members themselves possess a famine. The Hebrew construct refers to grain needed by their households in the famine. The custodial phrase is also more clearly rendered as the place where they are being held, as required by the immediate narrative context.
  naturalness: ‘నిజాయితీపరులు’ is understandable but less idiomatic than ‘నిజాయితీగలవారు.’ The revised wording is modern standard Telugu, preserves the command/register, and expresses the famine-related purpose naturally without making the households themselves the subject of ‘famine.’
  terminology: ‘ధాన్యం’ appropriately renders שֶׁבֶר in the Joseph famine narrative. ‘నిర్బంధంలో ఉన్న చోట’ accurately reflects בְּבֵית מִשְׁמַרְכֶם in context without imposing the more specific notion of a formal prison. No theological terminology is at issue.
  issues:
  - severity: medium
    issue: The expression ‘మీ ఇళ్లవారి కరవు కోసం’ is semantically awkward.
    rationale: While it attempts to preserve the Hebrew construction, Telugu does not naturally speak of a famine belonging to household members. It should express grain required for those at home during the famine.
  - severity: low
    issue: ‘నిజాయితీపరులు’ is less natural than ‘నిజాయితీగలవారు.’
    rationale: The latter is the more idiomatic modern standard Telugu expression for people who are honest/truthful.
  - severity: low
    issue: ‘మిమ్మల్ని ఉంచిన నిర్బంధ స్థలంలో’ is cumbersome.
    rationale: The Hebrew suffix and the narrative context indicate the custody in which the brothers are being held. ‘మీరు నిర్బంధంలో ఉన్న చోట’ conveys this directly and naturally.
  revised_text: మీరు నిజాయితీగలవారైతే[a], మీ సోదరుల్లో ఒకడు మీరు నిర్బంధంలో ఉన్న చోట[b] బంధించబడి ఉండాలి. మిగిలిన మీరు వెళ్లి, మీ ఇళ్లవారికి కరవు సమయంలో అవసరమైన ధాన్యాన్ని తీసుకెళ్లండి.
