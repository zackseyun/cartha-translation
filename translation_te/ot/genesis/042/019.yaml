- from: మీరు నిజాయితీపరులైతే[a], మీ సోదరుల్లో ఒకడు మిమ్మల్ని ఉంచిన నిర్బంధ స్థలంలో[b] బంధించబడి ఉండాలి. మిగిలిన మీరు వెళ్లి, మీ ఇళ్లవారి కరవు కోసం ధాన్యం తీసుకెళ్లండి.
  to: మీరు నిజాయితీగలవారైతే[a], మీ సోదరుల్లో ఒకడు మీరు నిర్బంధంలో ఉన్న చోట[b] బంధించబడి ఉండాలి. మిగిలిన మీరు వెళ్లి, మీ ఇళ్లవారికి కరవు సమయంలో అవసరమైన ధాన్యాన్ని తీసుకెళ్లండి.
  rationale: 'The revision retains the source’s contrast between the one brother left in custody and the others who depart, while using idiomatic Telugu. It makes explicit only what the Hebrew construction and immediate context support: the grain is needed by their households during the famine. Footnote anchors and their corresponding notes are preserved.'
