  yaml_path: translation/ot/genesis/042/010.yaml
  text: But they said to him[a], “No, my lord; your servants have come to buy food.”
translation:
  language: te
  text: కాని వారు అతనితో, “కాదు, నా ప్రభూ; మీ సేవకులమైన మేము ఆహారం[a] కొనడానికి వచ్చాము” అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ధాన్యం.” హీబ్రూ పాఠంలో “ఆహారం” అని ఉంది; అయితే కరువు సందర్భంలో ఇక్కడ ఉద్దేశించిన ఆహారం ధాన్యమే అయి ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ אֵלָיו
  choice: కాని వారు అతనితో ... అన్నారు
  rationale: వావ్ కథనాన్ని కొనసాగిస్తూనే ముందటి ఆరోపణకు ప్రతిస్పందనగా వ్యతిరేక భావాన్ని సూచిస్తుంది; అందువల్ల సహజమైన తెలుగులో ‘కాని’ అని అనువదించబడింది. אֵלָיו సంభాషణ యోసేపును ఉద్దేశించినదని స్పష్టం చేస్తుంది.
- source_word: לֹא
  choice: అలా కాదు
  rationale: ప్రత్యక్ష సంభాషణలోని దృఢమైన నిరాకరణను ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אֲדֹנִי
  choice: నా ప్రభూ
  rationale: ఈజిప్టు అధికారిని గౌరవంగా సంబోధిస్తూ సామాజిక అధీనతను చూపే పదబంధం; కేవలం ‘అయ్యా’ కంటే మూలంలోని మర్యాదాపూర్వక హోదాను బలంగా నిలుపుతుంది.
- source_word: וַעֲבָדֶיךָ
  choice: నీ సేవకులమైన మేము
  rationale: עֶבֶד బానిసను లేదా సేవకుణ్ణి సూచించగలదు; ఇక్కడ ఇది బంధిత స్థితిని ప్రకటించడం కాక, రాజసభా మర్యాదతో తమను తాము తగ్గించుకొని చెప్పుకునే విధానం.
- source_word: בָּאוּ
  choice: వచ్చాము
  rationale: వారు వచ్చిన ఉద్దేశాన్ని ప్రత్యక్ష సంభాషణలో సహజమైన తెలుగు భూతకాల రూపంతో తెలియజేస్తుంది.
- source_word: לִשְׁבָּר
  choice: కొనడానికి
  rationale: కరువు మరియు ఈజిప్టు ధాన్య పంపిణీ సందర్భంలో שׁבר యొక్క భావం కొనుగోలు చేయడం; కర్మ తరువాత వస్తున్నందున ఈ రూపం సరిపోతుంది.
- source_word: אֹכֶל
  choice: ఆహారం
  rationale: אֹכֶל యొక్క విస్తృత అర్థం ‘ఆహారం’; సందర్భంలో ధాన్యం ఉద్దేశించబడి ఉండవచ్చుగాని, ప్రధాన పాఠంలో మూలపదపు విస్తృతిని నిలుపుతుంది.
