translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ప్రత్యక్ష సంభాషణను ఉపయోగించాం. ‘నా ప్రభూ,’ ‘నీ సేవకులమైన మేము’ అనే రూపాలు సహోదరుల వినయపూర్వక, అధీన స్వరాన్ని నిలుపుతాయి. అడుగుజాడ [a] ప్రధాన పాఠంలో సంబంధిత పదబంధం వెంట ఉంచబడింది.
