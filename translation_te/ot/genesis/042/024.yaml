  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. హీబ్రూ క్రియల వరుసను తెలుగులో సహజంగా చదవడానికి మూడు వాక్యాలుగా విభజించినప్పటికీ, సంఘటనల క్రమం యథాతథంగా ఉంచబడింది.
