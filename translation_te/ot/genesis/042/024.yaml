source:
  edition: WLC
  text: וַ/יִּסֹּ֥ב מֵֽ/עֲלֵי/הֶ֖ם וַ/יֵּ֑בְךְּ וַ/יָּ֤שָׁב אֲלֵ/הֶם֙ וַ/יְדַבֵּ֣ר אֲלֵ/הֶ֔ם וַ/יִּקַּ֤ח מֵֽ/אִתָּ/ם֙ אֶת שִׁמְע֔וֹן וַ/יֶּאֱסֹ֥ר אֹת֖/וֹ לְ/עֵינֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/024.yaml
  text: He turned away from them and wept[a]. Then he returned to them and spoke to them[b], and he took Simeon from among them and bound him before their eyes.
translation:
  language: te
  text: అతడు వారి నుంచి పక్కకు తిరిగి ఏడ్చాడు. తరువాత తిరిగి వారి దగ్గరికి వచ్చి వారితో మాట్లాడాడు. అతడు వారిలోనుండి షిమ్యోనును తీసుకొని, వారి కళ్ల ఎదుట[a] అతణ్ణి కట్టివేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘వారు చూస్తుండగా.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסֹּב מֵעֲלֵיהֶם
  choice: వారి నుంచి పక్కకు తిరిగి
  rationale: సందర్భంలో యోసేపు తన సహోదరుల నుంచి ముఖం మరల్చి ఏడుస్తున్న భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; పూర్తిగా అక్కడి నుంచి వెళ్లిపోయాడని అనవసరంగా నిర్దిష్టం చేయదు.
- source_word: וַיֵּבְךְּ
  choice: ఏడ్చాడు
  rationale: בכה అనే క్రియకు కథన సందర్భంలో సహజమైన, నేరమైన తెలుగు సమానార్థకం.
- source_word: וַיָּשָׁב אֲלֵהֶם
  choice: తిరిగి వారి దగ్గరికి వచ్చి
  rationale: అతడు కొంతసేపు వారి నుంచి పక్కకు మళ్లి, మళ్లీ వారి వద్దకు వచ్చిన క్రమాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: וַיְדַבֵּר אֲלֵהֶם
  choice: వారితో మాట్లాడాడు
  rationale: హీబ్రూ వ్యక్తపరచే సాధారణ సంభాషణ చర్యను సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: וַיִּקַּח מֵאִתָּם אֶת־שִׁמְעוֹן
  choice: వారిలోనుండి షిమ్యోనును తీసుకొని
  rationale: మొత్తం సహోదరుల గుంపులోనుండి షిమ్యోను ప్రత్యేకంగా తీసుకోబడ్డాడనే భావాన్ని నిలుపుతుంది.
- source_word: וַיֶּאֱסֹר אֹתוֹ
  choice: అతణ్ణి కట్టివేశాడు
  rationale: אסר సూచించే ప్రత్యక్షంగా బంధించే చర్యను తెలియజేస్తుంది; ‘చెరసాలలో వేశాడు’ వంటి సందర్భానికి మించిన వ్యాఖ్యానాన్ని నివారిస్తుంది.
- source_word: לְעֵינֵיהֶם
  choice: వారి కళ్ల ఎదుట
  rationale: మూలంలోని దృశ్యాత్మకతను, ఆ చర్య వారు చూస్తుండగానే జరిగిందనే భావాన్ని నిలుపుతుంది.
