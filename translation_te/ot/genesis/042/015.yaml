source:
  edition: WLC
  text: בְּ/זֹ֖את תִּבָּחֵ֑נוּ חֵ֤י פַרְעֹה֙ אִם תֵּצְא֣וּ מִ/זֶּ֔ה כִּ֧י אִם בְּ/ב֛וֹא אֲחִי/כֶ֥ם הַ/קָּטֹ֖ן הֵֽנָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/015.yaml
  text: 'By this you will be tested: as Pharaoh lives[a], you shall not leave this place unless your youngest brother comes here.'
translation:
  language: te
  text: 'దీనివల్ల మీరు పరీక్షించబడతారు: ఫరో జీవం తోడు[a], మీ చిన్న తమ్ముడు ఇక్కడికి వస్తే తప్ప మీరు ఇక్కడి నుండి వెళ్లనే వెళ్లరు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూలో అక్షరార్థంగా, “మీరు ఇక్కడి నుండి వెళితే”; ప్రమాణ నిర్మాణంలో ఈ “వెళితే” అనే రూపం బలమైన నిరాకరణను వ్యక్తం చేస్తుంది: “మీరు ఇక్కడి నుండి వెళ్లనే వెళ్లరు.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּזֹאת
  choice: ఈ విధంగా
  rationale: పరీక్ష జరిగే సాధనాన్ని లేదా ప్రమాణాన్ని సూచించే בְּను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: תִּבָּחֵנוּ
  choice: మీరు పరీక్షించబడతారు
  rationale: בחן ధాతువు నిఫల్ రూపం పరీక్షింపబడడం లేదా నిజానిజాలు నిర్ధారించబడడాన్ని సూచిస్తుంది; కర్తరి భావాన్ని చేర్చకుండా కర్మణి రూపాన్ని నిలుపుతుంది.
- source_word: חֵי פַרְעֹה
  choice: ఫరో జీవం తోడు
  rationale: ఫరో ప్రాణాన్ని సాక్షిగా ఉంచే ప్రమాణ సూత్రాన్ని, దాని గంభీరతతో సహా, సహజ తెలుగు ప్రమాణ భాషలో వ్యక్తపరుస్తుంది.
- source_word: אִם תֵּצְאוּ מִזֶּה
  choice: మీరు ఇక్కడి నుండి వెళ్లనే వెళ్లరు
  rationale: ప్రమాణ వాక్యం తరువాత אִם బలమైన నిరాకరణను వ్యక్తం చేస్తుంది; ‘వెళ్లనే వెళ్లరు’ ఆ నిశ్చయాత్మక బలాన్ని తెలుగులో నిలుపుతుంది.
- source_word: כִּי אִם
  choice: తప్ప
  rationale: ముందున్న నిరాకరణకు ఏకైక మినహాయింపును సూచిస్తుంది.
- source_word: בְּבוֹא
  choice: వస్తే
  rationale: בְּతో కూడిన క్రియానామం అనుమతికి సంబంధించిన పరిస్థితిని సూచిస్తుంది; షరతు నిర్మాణం తెలుగులో సహజంగా ఉంటుంది.
- source_word: אֲחִיכֶם הַקָּטֹן
  choice: మీ చిన్న తమ్ముడు
  rationale: הַקָּטֹן వయస్సులో చిన్నవాడిని సూచిస్తుంది; సందర్భంలో బెంజమీనును ఉద్దేశించినందున ‘చిన్న తమ్ముడు’ సహజంగా, అవసరానికి మించిన వివరణ లేకుండా అర్థాన్ని అందిస్తుంది.
- source_word: הֵנָּה
  choice: ఇక్కడికి
  rationale: గమ్యదిశను సూచించే హీబ్రూ క్రియావిశేషణాన్ని తెలుగులోని దిశార్థక రూపం స్పష్టంగా ప్రతిబింబిస్తుంది.
