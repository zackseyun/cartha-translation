translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. שַׂק మరియు אַמְתַּחַת మధ్య పదభేదాన్ని “గోనెసంచి,” “మూట” ద్వారా సాధ్యమైనంతవరకు నిలిపాం. అందించిన ఆంగ్ల consultation layerలో పాదసూచిక గుర్తులు వాటి విషయాలకు సరిపోని స్థానాల్లో ఉన్నందున, మూలపాఠం మరియు పాదసూచిక విషయానికి అనుగుణంగా [a]ను “మూట నోటిలో” వద్ద, [b]ను “వెండి” వద్ద ఉంచాం.
