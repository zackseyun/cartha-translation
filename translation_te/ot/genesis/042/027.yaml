  to: 'వారిలో ఒకడు బసచేసే చోట తన గాడిదకు మేత పెట్టడానికి తన గోనెసంచిని తెరిచాడు. అప్పుడు అతడు తన వెండిని[b] చూశాడు—ఇదిగో, అది తన సంచి నోటి దగ్గర[a] ఉంది.


