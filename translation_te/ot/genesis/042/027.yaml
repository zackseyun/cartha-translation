  text: וַ/יִּפְתַּ֨ח הָ/אֶחָ֜ד אֶת שַׂקּ֗/וֹ לָ/תֵ֥ת מִסְפּ֛וֹא לַ/חֲמֹר֖/וֹ בַּ/מָּל֑וֹן וַ/יַּרְא֙ אֶת כַּסְפּ֔/וֹ וְ/הִנֵּה ה֖וּא בְּ/פִ֥י אַמְתַּחְתּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/027.yaml
  text: Then one of them opened his sack to give fodder to his donkey at the lodging place[a], and he saw his silver—and behold[b], it was in the mouth of his bag.
translation:
  language: te
  text: 'వారిలో ఒకడు బసచేసే చోట తన గాడిదకు మేత పెట్టడానికి తన గోనెసంచిని తెరిచాడు. అప్పుడు అతడు తన వెండిని[b] చూశాడు—ఇదిగో, అది తన సంచి నోటి దగ్గర[a] ఉంది.


    [a] లేదా, “తన సంచి తెరువులో.”


    [b] ఇక్కడ “వెండి” అంటే అతడు చెల్లించిన డబ్బు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తన సంచి తెరువులో.”
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ “వెండి” అంటే అతడు చెల్లించిన డబ్బు.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּפְתַּח
  choice: తెరిచాడు
  rationale: פתח అనే సాధారణ క్రియకు సహజమైన తెలుగు సమానం; కథనంలోని పూర్తయిన చర్యను స్పష్టంగా తెలియజేస్తుంది.
- source_word: הָאֶחָד
  choice: వారిలో ఒకడు
  rationale: అక్షరార్థంగా “ఆ ఒకడు”; సందర్భంలో యోసేపు సోదరుల్లో ఒకడని స్పష్టంచేయడానికి సహజ తెలుగు ప్రయోగం.
- source_word: שַׂקּוֹ
  choice: తన గోనెసంచిని
  rationale: ధాన్యం మోసే పెద్ద సంచిని సూచిస్తుంది; తరువాత వచ్చే אַמְתַּחַת పదానికి ఉపయోగించిన “మూట”తో భేదాన్ని నిలుపుతుంది.
- source_word: לָתֵת מִסְפּוֹא לַחֲמֹרוֹ
  choice: తన గాడిదకు మేత వేయడానికి
  rationale: జంతువుకు ఆహారం ఇవ్వడాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בַּמָּלוֹן
  choice: బసచేసే చోట
  rationale: మార్గమధ్యంలో రాత్రి బస చేసే స్థలాన్ని సూచిస్తుంది; వాణిజ్యపరమైన సత్రం లేదా హోటల్ అని అనవసరంగా నిర్దిష్టం చేయదు.
- source_word: כַּסְפּוֹ
  choice: తన వెండిని
  rationale: כֶּסֶף యొక్క concrete అర్థమైన “వెండి”ని నిలుపుతుంది; సందర్భంలో అది చెల్లింపుగా ఇచ్చిన డబ్బని పాదసూచిక వివరిస్తుంది.
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: అనుకోని విషయాన్ని అకస్మాత్తుగా గమనించిన భావాన్ని, కథన బలాన్ని నిలుపుతుంది.
- source_word: בְּפִי אַמְתַּחְתּוֹ
  choice: తన మూట నోటిలో
  rationale: సంచి తెరుచుకునే భాగానికి “నోరు” అనే హీబ్రూ రూపకాన్ని తెలుగులోనూ అర్థమయ్యే విధంగా నిలుపుతూ, ప్రత్యామ్నాయ భావాన్ని పాదసూచికలో ఇస్తుంది.
