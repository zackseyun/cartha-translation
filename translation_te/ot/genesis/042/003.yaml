  text: So Joseph’s ten brothers went down to buy grain from Egypt[a].
translation:
  language: te
  text: అప్పుడు యోసేపు పదిమంది సోదరులు ఐగుప్తు నుంచి ధాన్యం కొనడానికి దిగివెళ్లారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఐగుప్తులో ధాన్యం కొనడానికి దిగివెళ్లారు.” హీబ్రూలో “ఐగుప్తు నుంచి” అనే మాట ధాన్యానికి ఐగుప్తే మూలమని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרְדוּ
  choice: వెళ్లారు
  rationale: ירד అక్షరార్థంగా ‘దిగివెళ్లారు’ అని అర్థమిచ్చినా, ఐగుప్తుకు ప్రయాణాన్ని సూచించే ఈ భౌగోళిక ప్రయోగాన్ని ఆధునిక తెలుగులో సహజంగా ‘వెళ్లారు’ అని అనువదించాం.
- source_word: אֲחֵי יוֹסֵף עֲשָׂרָה
  choice: యోసేపు సోదరులు పదిమంది
  rationale: హీబ్రూ నిర్మాణంలో ‘యోసేపు సోదరులు’కు ‘పది’ అనే సంఖ్య వర్తిస్తుంది; వ్యక్తులను లెక్కించే సహజ తెలుగు రూపంగా ‘పదిమంది’ వాడాం.
- source_word: לִשְׁבֹּר
  choice: కొనడానికి
  rationale: ఈ కరవు కథన సందర్భంలో שׁבר ధాన్యాన్ని కొనుగోలు చేయడాన్ని సూచిస్తుంది.
- source_word: בָּר
  choice: ధాన్యం
  rationale: בָּר ఇక్కడ తృణధాన్యాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘ధాన్యం’ స్పష్టమైన, సహజమైన సమానార్థకం.
- source_word: מִמִּצְרָיִם
  choice: ఐగుప్తుకు
  rationale: מן అక్షరార్థంగా ‘నుండి’ అని మూలాన్ని సూచించినా, తెలుగులో కొనుగోలు జరిగే ప్రదేశాన్ని గమ్యంగా చెప్పడం సహజం; మూలభాషలోని ‘ఐగుప్తు నుండి’ అనే భావాన్ని పాదసూచికలో నిలిపాం.
theological_decisions: []
translation_notes:
  register: సాధారణ ఆధునిక తెలుగు పాఠకులకు సహజంగా, గౌరవప్రదంగా ఉండే శైలి. ‘దిగివెళ్లారు’ అనే భౌగోళిక నుడికారాన్ని ప్రధాన పాఠ్యంలో సరళీకరించి, మూలంలోని ‘నుండి’ భావంతో పాటు పాదసూచికలో ఇచ్చాం.
