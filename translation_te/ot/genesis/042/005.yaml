translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. ‘వచ్చారు… వస్తున్నవారి’ అనే మూలంలోని పునరుక్తిని భావన స్పష్టంగా ఉండేంతవరకు నిలిపి, గమ్యస్థానాన్ని సూచించేందుకు ‘అక్కడికి’ చేర్చబడింది.
