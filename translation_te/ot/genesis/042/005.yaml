  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּבֹ֨אוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל לִ/שְׁבֹּ֖ר בְּ/ת֣וֹךְ הַ/בָּאִ֑ים כִּֽי הָיָ֥ה הָ/רָעָ֖ב בְּ/אֶ֥רֶץ כְּנָֽעַן־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/005.yaml
  text: So the sons of Israel came to buy grain among those who were coming[b][a], because the famine was in the land of Canaan.
translation:
  language: te
  text: కనుక ఇశ్రాయేలు కుమారులు ధాన్యం కొనడానికి వచ్చినవారితో కలిసి వచ్చారు; ఎందుకంటే కనాను దేశంలో కరువు ఉంది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: వచ్చారు
  rationale: בוא క్రియ యొక్క వరుస కథన రూపం; ఐగుప్తుకు చేరుతున్న దృక్కోణాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: ఈ సందర్భంలో ఇది ఇశ్రాయేలు అనే యాకోబు యొక్క కుమారులను ప్రత్యేకంగా సూచిస్తుంది; జాతిని సాధారణంగా సూచించే విస్తృత పదబంధం కాదు.
- source_word: לִשְׁבֹּר
  choice: ధాన్యం కొనడానికి
  rationale: మూల క్రియకు ‘కొను’ అనే అర్థం ఉన్నా, కరువు మరియు యోసేపు కథా సందర్భంలో కొనేది ధాన్యమని స్పష్టంగా ఉంది.
- source_word: בְּתוֹךְ הַבָּאִים
  choice: అక్కడికి వస్తున్నవారి మధ్య
  rationale: בְּתוֹךְ ఒక సమూహం మధ్య ఉండడాన్ని, הַבָּאִים వస్తున్నవారిని సూచిస్తాయి; ఇతరులతో కలిసి వచ్చిన భావాన్ని మూలానికి దగ్గరగా ఉంచుతుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: వారు రావడానికి గల కారణాన్ని పరిచయం చేస్తుంది.
- source_word: הָיָה הָרָעָב
  choice: కరువు ఉంది
  rationale: హీబ్రూ స్థితి/అస్తిత్వ వాక్యాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: కనాను దేశంలో
  rationale: మూలంలోని భౌగోళికంగా ప్రాముఖ్యమైన ‘కనాను దేశం’ అనే నిర్దిష్ట వ్యక్తీకరణను నిలుపుతుంది.
