  yaml_path: translation/ot/genesis/042/037.yaml
  text: Then Reuben said to his father[a], “You may put my two sons to death if I do not bring him back to you. Put him in my hand, and I myself will bring him back to you.”
translation:
  language: te
  text: అప్పుడు రూబేను తన తండ్రితో, “నేను అతణ్ణి తిరిగి నీ దగ్గరికి తీసుకురాకపోతే, నా ఇద్దరు కుమారులను చంపించు. అతణ్ణి నా చేతికి అప్పగించు; నేనే అతణ్ణి తిరిగి నీ దగ్గరికి తీసుకొస్తాను” అన్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר רְאוּבֵן אֶל אָבִיו
  choice: అప్పుడు రూబేను తన తండ్రితో ... అన్నాడు
  rationale: వావ్-కన్సెక్యూటివ్ కథన క్రమాన్ని ముందుకు నడిపిస్తుంది; ‘అప్పుడు’ దాని క్రమబద్ధ భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది. לֵאמֹר అనే హెబ్రీయు ఉక్తి-పరిచయ పదాన్ని ప్రత్యక్ష సంభాషణ నిర్మాణంలో విడిగా అనువదించలేదు.
- source_word: אֶת שְׁנֵי בָנַי תָּמִית
  choice: నా ఇద్దరు కుమారులను చంపించు
  rationale: מות హిఫీల్ రూపం ‘మరణింపజేయు’ అనే కారణార్థాన్ని వ్యక్తం చేస్తుంది. ‘చంపించు’ ఆ భావాన్ని సంక్షిప్తంగా, స్పష్టంగా నిలుపుతుంది; ఇది రూబేను చేసిన తీవ్రమైన హామీ.
- source_word: אִם לֹא אֲבִיאֶנּוּ אֵלֶיךָ
  choice: నేను అతణ్ణి తిరిగి నీ దగ్గరికి తీసుకురాకపోతే
  rationale: אִם לֹא యొక్క ప్రతికూల షరతును సహజమైన తెలుగు షరతు నిర్మాణంతో ఇచ్చాం. בוא హిఫీల్ అక్షరార్థంగా ‘తీసుకురావడం’; సందర్భం బెంజమీనును యాకోబు దగ్గరికి తిరిగి చేర్చడాన్ని సూచిస్తున్నందున ‘తిరిగి’ చేర్చాం.
- source_word: תְּנָה אֹתוֹ עַל יָדִי
  choice: అతణ్ణి నా చేతికి అప్పగించు
  rationale: ‘నా చేతిమీద ఉంచు’ అనే హెబ్రీయు ప్రతీక బాధ్యతగా అప్పగించడాన్ని సూచిస్తుంది. తెలుగులో ‘నా చేతికి అప్పగించు’ చేతి ప్రతీకను కొంత నిలుపుతూ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וַאֲנִי אֲשִׁיבֶנּוּ אֵלֶיךָ
  choice: నేనే అతణ్ణి తిరిగి నీ దగ్గరికి తీసుకొస్తాను
  rationale: ప్రత్యేకంగా వాడిన וַאֲנִי లోని కర్తృత్వ ఉద్ఘాటనను ‘నేనే’తో నిలిపాం. שוב హిఫీల్ ‘తిరిగి చేర్చడం/తీసుకురావడం’ అనే భావాన్ని ఇస్తుంది.
