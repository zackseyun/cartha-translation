translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన ప్రత్యక్ష సంభాషణగా రూపొందించాం. మూలంలోని రూబేను హామీ తీవ్రతను మృదువుచేయలేదు; అలాగే ‘నా చేతికి’ అనే హెబ్రీయు బాధ్యతా ప్రతీకను తెలుగు వాడుకకు అనుగుణంగా నిలిపాం.
