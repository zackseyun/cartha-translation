id: GEN.42.38
reference: Genesis 42:38
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר לֹֽא יֵרֵ֥ד בְּנִ֖/י עִמָּ/כֶ֑ם כִּֽי אָחִ֨י/ו מֵ֜ת וְ/ה֧וּא לְ/בַדּ֣/וֹ נִשְׁאָ֗ר וּ/קְרָאָ֤/הוּ אָסוֹן֙ בַּ/דֶּ֨רֶךְ֙ אֲשֶׁ֣ר תֵּֽלְכוּ בָ֔/הּ וְ/הוֹרַדְתֶּ֧ם אֶת שֵׂיבָתִ֛/י בְּ/יָג֖וֹן שְׁאֽוֹלָ/ה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/038.yaml
  text: But he said[a], “My son will not go down with you, because his brother is dead, and he alone is left. If harm should happen to him on the journey on which you go[b], then you would bring my gray hair down to Sheol in sorrow.”
translation:
  language: te
  text: 'కాని అతడు ఇలా అన్నాడు: “నా కుమారుడు మీతో కలిసి దిగిపోడు. ఎందుకంటే అతని సోదరుడు చనిపోయాడు; అతడొక్కడే మిగిలాడు. మీరు వెళ్లే దారిలో అతనికి ఏదైనా ఆపద కలిగితే[a], మీరు నా నెరిసిన తలను దుఃఖంతో షియోలుకు[b] దింపుతారు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “అతనికి విపత్తు సంభవిస్తే.”'
    reason: אָסוֹן అనే పదానికి ‘ఆపద,’ ‘విపత్తు,’ ‘తీవ్రమైన హాని’ అనే భావాలు ఉండవచ్చు.
  - marker: b
    text: షియోలు అనేది మృతుల లోకాన్ని సూచించే హీబ్రూ పదం; సందర్భానుసారం “సమాధి” అని కూడా అనువదించవచ్చు.
    reason: హీబ్రూ שְׁאוֹל యొక్క భావ పరిధిని, దాని సాధ్యమైన ప్రత్యామ్నాయ అనువాదాన్ని తెలియజేస్తుంది.
lexical_decisions:
- source_word: יֵרֵד
  choice: దిగిరాడు
  rationale: కనాను నుండి ఐగుప్తుకు ప్రయాణాన్ని ఆదికాండంలో ‘దిగిపోవడం’గా వర్ణించే భౌగోళిక చిత్రాన్ని నిలుపుతుంది.
- source_word: בְּנִי
  choice: నా కుమారుడు
  rationale: בן అనే పదంలోని పురుషలింగ సంబంధాన్ని నేరుగా, సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אָחִיו מֵת
  choice: అతని సహోదరుడు చనిపోయాడు
  rationale: యాకోబు దృష్టిలో యోసేపు మరణించాడనే భావాన్ని స్పష్టంగా తెలియజేస్తుంది; ‘సహోదరుడు’ గంభీరమైన ప్రమాణ తెలుగుకు తగినది.
- source_word: לְבַדּוֹ נִשְׁאָר
  choice: ఇతడొక్కడే మిగిలాడు
  rationale: లבדו లోని ‘ఒక్కడే’ అనే ఉద్ఘాటనను కాపాడుతూ, యాకోబు సమక్షంలో ఉన్న బెన్యామీనును సూచించే సహజమైన రూపం.
- source_word: וּקְרָאָהוּ אָסוֹן
  choice: అతనికి ఏదైనా ఆపద కలిగితే
  rationale: హీబ్రూ సంయుక్త వాక్యానికి సందర్భంలో ఉన్న షరతు భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; אָסוֹן సూచించే తీవ్రమైన హాని లేదా విపత్తును ‘ఆపద’ విస్తృతంగా నిలుపుతుంది.
- source_word: בַּדֶּרֶךְ אֲשֶׁר תֵּלְכוּ בָהּ
  choice: మీరు వెళ్లే దారిలో
  rationale: דרך యొక్క దారి/ప్రయాణ భావాన్నీ, ‘మీరు వెళ్లే’ అనే మూల వాక్య నిర్మాణాన్నీ సంక్షిప్తమైన సహజ తెలుగులో నిలుపుతుంది.
- source_word: וְהוֹרַדְתֶּם
  choice: మీరు ... దింపుతారు
  rationale: ירד హిఫిల్ రూపంలోని ‘కిందికి తీసుకెళ్లడం’ అనే కారణార్థక భావాన్ని కాపాడుతుంది; ముందున్న షరతుకు ఫలితంగా ఇది అర్థమవుతుంది.
- source_word: שֵׂיבָתִי
  choice: నా నెరిసిన తలను
  rationale: అక్షరార్థంగా ‘నా నెరిసిన జుట్టు’ అనే వృద్ధాప్య చిత్రాన్ని తెలుగులో సహజమైన శరీరభాగ సూచనతో నిలుపుతుంది; కేవలం ‘నా వృద్ధాప్యాన్ని’ అని నైరూప్యంగా చేయదు.
- source_word: בְּיָגוֹן
  choice: దుఃఖంతో
  rationale: יגון లోని లోతైన శోకం అనే భావాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: שְׁאֹלָה
  choice: షియోలుకు
  rationale: భౌతిక సమాధి అని మాత్రమే అర్థాన్ని కుదించకుండా, మృతుల లోకాన్ని సూచించగల హీబ్రూ పదాన్ని లిప్యంతరీకరించి మూలంలోని భావ విస్తృతిని కాపాడుతుంది.
theological_decisions:
- issue: שְׁאוֹל ను ‘షియోలు’గా ఉంచాలా, ‘సమాధి’ లేదా ‘మృతుల లోకం’గా అనువదించాలా
  choice: షియోలుకు
  alternative: సమాధికి; మృతుల లోకానికి
  rationale: שְׁאוֹל కొన్ని సందర్భాల్లో సమాధికంటే విస్తృతంగా మృతుల లోకాన్ని సూచించగలదు. లిప్యంతరీకరణ ఆ భావాన్ని ఒకే వివరణకు పరిమితం చేయకుండా మూలంలోని అస్పష్టతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రమాణ తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ‘దిగిరాడు,’ ‘దింపుతారు’ ద్వారా మూలంలోని పునరుక్త దిగివెళ్లే చిత్రాన్ని నిలిపాం. మూలంలో లేని ‘ఐగుప్తు’ను చేర్చలేదు. పాదసూచిక గుర్తులను అవి వివరించే ‘ఆపద’ మరియు ‘షియోలు’ పదాల వద్ద ఉంచాం.
