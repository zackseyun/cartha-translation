  text: כֻּלָּ֕/נוּ בְּנֵ֥י אִישׁ אֶחָ֖ד נָ֑חְנוּ כֵּנִ֣ים אֲנַ֔חְנוּ לֹא הָי֥וּ עֲבָדֶ֖י/ךָ מְרַגְּלִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/011.yaml
  text: We are all sons of one man[a]. We are honest[b]; your servants have not been spies.
translation:
  language: te
  text: మేమంతా ఒకే మనిషి కుమారులం. మేము నిజాయితీగలవాళ్లం[a]; మీ సేవకులమైన మేము గూఢచారులుగా ఉండలేదు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మేము యథార్థపరులం’ లేదా ‘మేము నమ్మదగినవాళ్లం.’ హెబ్రీ పదం గూఢచర్య ఆరోపణకు విరుద్ధంగా, వారు నిష్కపటులు, విశ్వసనీయులు అని చెప్పే భావాన్ని కలిగి ఉంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘మీ సేవకులమైన మేము గూఢచారులం కాదు.’ హెబ్రీ నిర్మాణాన్ని తెలుగులో గత ప్రవర్తన లేదా స్థితి నిరాకరణగానూ, వర్తమాన స్థితి నిరాకరణగానూ సహజంగా వ్యక్తపరచవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֻּלָּנוּ
  choice: మేమంతా
  rationale: మాట్లాడుతున్న సహోదరులందరినీ సమగ్రంగా సూచిస్తూ, హెబ్రీలోని సమూహ ఉద్ఘాటనను సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: בְּנֵי אִישׁ אֶחָד
  choice: ఒకే మనిషి కుమారులం
  rationale: అక్షరార్థంగా ‘ఒక మనిషి కుమారులు.’ పురుష సహోదరులనే సూచిస్తున్నందున ‘కుమారులు’ను నిలిపి, אֶחָד యొక్క భావాన్ని ‘ఒకే’తో వ్యక్తపరచింది.
- source_word: כֵּנִים
  choice: నిజాయితీపరులం
  rationale: గూఢచర్య ఆరోపణకు విరుద్ధంగా వారు తమను నమ్మదగినవారిగా, కపటంలేనివారిగా చెప్పుకుంటున్న భావాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: עֲבָדֶיךָ
  choice: మీ సేవకులమైన మేము
  rationale: ఇక్కడ బానిసత్వ స్థితికన్నా అధికారితో వినయంగా మాట్లాడే స్వీయసూచన ప్రధానమైనది; ‘సేవకులు’ ఆ సంభాషణాత్మక గౌరవాన్ని అందిస్తుంది.
- source_word: מְרַגְּלִים
  choice: గూఢచారులు
  rationale: రహస్యంగా దేశాన్ని పరిశీలించడానికి వచ్చినవారనే ఆరోపణను స్పష్టంగా, ప్రామాణిక ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: לֹא הָיוּ ... מְרַגְּלִים
  choice: గూఢచారులం కాదు
  rationale: హెబ్రీ היה + కృదంత నిర్మాణాన్ని ఆరోపణకు నేరుగా ఇచ్చిన సహజ తెలుగు నిరాకరణగా అందిస్తుంది; కాలసంబంధ సూక్ష్మతకు పాదసూచికలో ప్రత్యామ్నాయం ఇచ్చింది.
