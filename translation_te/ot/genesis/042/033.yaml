  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֵלֵ֗י/נוּ הָ/אִישׁ֙ אֲדֹנֵ֣י הָ/אָ֔רֶץ בְּ/זֹ֣את אֵדַ֔ע כִּ֥י כֵנִ֖ים אַתֶּ֑ם אֲחִי/כֶ֤ם הָֽ/אֶחָד֙ הַנִּ֣יחוּ אִתִּ֔/י וְ/אֶת רַעֲב֥וֹן בָּתֵּי/כֶ֖ם קְח֥וּ וָ/לֵֽכוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/033.yaml
  text: 'Then the man[a], the lord of the land, said to us, ‘By this I will know that you are honest: leave one of your brothers with me, take grain for the famine of your households, and go.’'
translation:
  language: te
  text: 'అప్పుడు దేశానికి అధిపతియైన ఆ మనిషి మాతో ఇలా అన్నాడు: “మీరు నిజాయితీపరులని దీనివల్ల నేను తెలుసుకుంటాను: మీ సోదరుల్లో ఒకడిని నా దగ్గర విడిచిపెట్టండి; మీ కుటుంబాల్లోని కరవు తీర్చడానికి ధాన్యాన్ని[a] తీసుకొని వెళ్లండి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హెబ్రీయులో అక్షరార్థంగా, “మీ కుటుంబాల కరవును తీసుకోండి.” భావం: కరవుతో బాధపడుతున్న తమ కుటుంబాల కోసం ధాన్యాన్ని లేదా ఆహార సరఫరాలను తీసుకెళ్లడం.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאִישׁ אֲדֹנֵי הָאָרֶץ
  choice: దేశానికి అధిపతియైన ఆ మనిషి
  rationale: הָאִישׁ అనే సాధారణ నామవాచకాన్నీ, దానికి విశేషణసమానంగా వచ్చిన אֲדֹנֵי הָאָרֶץ అనే అధికార సూచక పదబంధాన్నీ సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: בְּזֹאת
  choice: దీనివల్ల
  rationale: తరువాత చెప్పబడే చర్యనే వారి నిజాయితీని తెలుసుకునే పరీక్ష లేదా ప్రమాణంగా సూచించే సాధనార్థక భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: אֵדַע
  choice: నేను తెలుసుకుంటాను
  rationale: వారి చర్యపై ఆధారపడిన భవిష్యత్ ఫలితాన్ని సూచించే యిక్తోల్ రూప భావాన్ని కాపాడుతుంది.
- source_word: כֵנִים
  choice: నిజాయితీపరులు
  rationale: ఈ కథా సందర్భంలో వారు గూఢచారులు కాకుండా నమ్మదగిన, సూటిగా వ్యవహరించే మనుషులని సూచిస్తుంది.
- source_word: אֲחִיכֶם הָאֶחָד
  choice: మీ సోదరుల్లో ఒకడిని
  rationale: సోదరుల సమూహంలో ఒకరిని సూచించే హెబ్రీయ భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: הַנִּיחוּ אִתִּי
  choice: నా దగ్గర విడిచిపెట్టండి
  rationale: హిఫిల్ రూపం ఇక్కడ ఒకరిని తన వద్ద ఉండనివ్వడం లేదా వదిలి వెళ్లడం అనే సందర్భోచిత భావాన్ని ఇస్తుంది.
- source_word: רַעֲבוֹן בָּתֵּיכֶם
  choice: మీ కుటుంబాలను కరవులో ఆదుకోవడానికి కావలసిన ధాన్యాన్ని
  rationale: హెబ్రీయ వాక్యం అక్షరార్థంగా ‘మీ ఇళ్ల కరవును తీసుకోండి’ అనే సంక్షిప్త ప్రయోగాన్ని కలిగి ఉంది. సందర్భం ధాన్యం కొనుగోలు చేయడం కాబట్టి, ఉద్దేశిత వస్తువును స్పష్టం చేస్తూ కుటుంబాలకు సంబంధించిన కరవు భావాన్ని నిలుపుతుంది.
- source_word: קְחוּ וָלֵכוּ
  choice: తీసుకొని వెళ్లండి
  rationale: వరుసగా ఉన్న రెండు ఆజ్ఞల సరళమైన గమనాన్ని సహజమైన తెలుగు సంయుక్త క్రియతో అందిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన కథన శైలి వాడబడింది. మూలంలోని సంక్షిప్త ప్రయోగాన్ని ప్రధాన పాఠ్యంలో సహజంగా స్పష్టం చేసి, అక్షరార్థాన్ని పాదసూచికలో భద్రపరచాం.
