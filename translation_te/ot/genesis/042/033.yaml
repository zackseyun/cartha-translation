review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the speaker’s authority, the criterion for recognizing the brothers as honest, the requirement to leave one brother, and the concluding commands. The supplied object “grain” is justified by the immediate narrative context. However, “మీ కుటుంబాలను కరవులో ఆదుకోవడానికి” shifts the Hebrew elliptical phrase toward helping/supporting the families rather than directly expressing grain for the famine affecting their households.
  naturalness: The Telugu is clear and appropriately formal. Recasting the famine phrase as “మీ కుటుంబాల్లోని కరవు తీర్చడానికి” is more idiomatic and directly connected to the grain being taken.
  terminology: “దేశానికి అధిపతియైన ఆ మనిషి,” “నిజాయితీపరులు,” and “నా దగ్గర విడిచిపెట్టండి” suit modern standard Telugu and preserve the narrative register. No theological terminology is at issue.
  issues:
