  to: 'అప్పుడు దేశానికి అధిపతియైన ఆ మనిషి మాతో ఇలా అన్నాడు: “మీరు నిజాయితీపరులని దీనివల్ల నేను తెలుసుకుంటాను: మీ సోదరుల్లో ఒకడిని నా దగ్గర విడిచిపెట్టండి; మీ కుటుంబాల్లోని కరవు తీర్చడానికి ధాన్యాన్ని[a] తీసుకొని వెళ్లండి.”'
