    rationale: “కనాను దేశంలో నివసించే ఒకే తండ్రి కుమారులం”లో ‘నివసించే’ ప్రధానంగా కుమారులను విశేషిస్తుంది. మూలంలో ‘కనాను దేశంలో ఉన్న ఒకే మనిషి/తండ్రి కుమారులం’ అనే కుటుంబ పరిచయం ఉంది. సవరణ ఈ సంబంధాన్ని స్పష్టపరుస్తుంది.
