id: GEN.42.13
reference: Genesis 42:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּאמְר֗וּ שְׁנֵ֣ים עָשָׂר֩ עֲבָדֶ֨י/ךָ אַחִ֧ים אֲנַ֛חְנוּ בְּנֵ֥י אִישׁ אֶחָ֖ד בְּ/אֶ֣רֶץ כְּנָ֑עַן וְ/הִנֵּ֨ה הַ/קָּטֹ֤ן אֶת אָבִ֨י/נוּ֙ הַ/יּ֔וֹם וְ/הָ/אֶחָ֖ד אֵינֶֽ/נּוּ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/013.yaml
  text: And they said[a], “We, your servants, are twelve brothers, sons of one man in the land of Canaan. And behold, the youngest is with our father today, and one is no more.”
translation:
  language: te
  text: 'వారు ఇలా అన్నారు: “మీ సేవకులమైన మేము పన్నెండు మంది అన్నదమ్ములం; కనాను దేశంలో ఉన్న ఒకే తండ్రి కుమారులం. ఇదిగో, అందరిలో చిన్నవాడు ఈ రోజు మా తండ్రి దగ్గర ఉన్నాడు; ఒకడు లేడు[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ అక్షరార్థం: “ఒకడు లేడు.” ఇది “పోయాడు” లేదా “ఇక జీవించి లేడు” అనే భావాన్ని సూచించగల సభ్యోక్తి.'
    reason: మూలపాఠంలోని గైర్హాజరు లేదా మరణం అనే ద్వంద్వార్థాన్ని తెలియజేయడం.
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: వారు ఇలా అన్నారు
  rationale: హీబ్రూ కథన క్రమాన్ని సహజమైన ఆధునిక తెలుగు కథన శైలిలో వ్యక్తపరుస్తుంది.
- source_word: עֲבָדֶיךָ
  choice: మీ సేవకులమైన
  rationale: ఇక్కడ సహోదరులు ఒక ఐగుప్తు అధికారితో వినయంగా మాట్లాడుతున్నారు; ఇది బానిసత్వ స్థితిని కాక గౌరవపూర్వక స్వీయసంబోధనను సూచిస్తుంది.
- source_word: שְׁנֵים עָשָׂר ... אַחִים אֲנַחְנוּ
  choice: మేము పన్నెండు మంది అన్నదమ్ములం
  rationale: వారి సంఖ్యను, పరస్పర సోదర సంబంధాన్ని స్పష్టంగా మరియు సహజంగా తెలియజేస్తుంది.
- source_word: בְּנֵי אִישׁ אֶחָד
  choice: ఒకే తండ్రి కుమారులం
  rationale: అక్షరార్థంగా ‘ఒక మనిషి కుమారులు’; కుటుంబ సందర్భంలో ‘ఒకే తండ్రి కుమారులు’ అనేది సహజమైన తెలుగు, అలాగే పురుష లింగ సూచనను నిలుపుతుంది.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: కనాను దేశంలో నివసించే
  rationale: ‘కనాను దేశంలో’ అనే స్థల సూచనను నిలుపుతూ, తెలుగులో వాక్య సంబంధాన్ని స్పష్టంగా చేస్తుంది.
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: ప్రస్తుత పరిస్థితిపై దృష్టి ఆకర్షించే హీబ్రూ సమర్పణార్థక అవ్యయ బలాన్ని నిలుపుతుంది.
- source_word: הַקָּטֹן
  choice: చిన్నవాడు
  rationale: కుటుంబ సందర్భంలో ఇది చిన్న వయస్సుగల, అంటే అందరిలో చిన్నవాడైన సహోదరుణ్ని సహజంగా సూచిస్తుంది.
- source_word: אֶת אָבִינוּ
  choice: మా తండ్రి దగ్గర ఉన్నాడు
  rationale: ఇక్కడ אֶת సహవాసాన్ని సూచిస్తుంది; ‘దగ్గర’ అనే రూపం అతడు తండ్రితో ఉన్నాడనే భావాన్ని సహజ తెలుగులో అందిస్తుంది.
- source_word: הַיּוֹם
  choice: ఈ రోజు
  rationale: హీబ్రూ కాలసూచక పదానికి నేరమైన, స్పష్టమైన అనువాదం.
- source_word: וְהָאֶחָד אֵינֶנּוּ
  choice: మరొకడు లేడు
  rationale: హీబ్రూలోని ‘ఒకడు లేడు’ అనే ఉద్దేశపూర్వక అస్పష్టతను నిలుపుతుంది; అతడు కనబడటం లేదనే భావమో, చనిపోయాడనే సూచనో రెండూ సాధ్యంగా ఉంటాయి.
theological_decisions:
- issue: యోసేపు స్థితి గురించి ‘ఒకడు లేడు’ అనే అస్పష్టత
  choice: మరొకడు లేడు
  alternative: మరొకడు చనిపోయాడు
  rationale: మూలపాఠం మరణాన్ని స్పష్టంగా ప్రకటించకుండా గైర్హాజరు లేదా కోల్పోవడాన్ని సభ్యోక్తిగా చెబుతుంది. కాబట్టి కథనంలోని ఉద్రిక్తతను పరిష్కరించకుండా నిలుపబడింది.
- issue: లింగ నిర్దిష్టమైన కుటుంబ భాష
  choice: ఒకే తండ్రి కుమారులం; అన్నదమ్ములం
  alternative: ఒకే తండ్రి పిల్లలం; తోబుట్టువులం
  rationale: మూలంలోని masculine forms ఈ సందర్భంలో యాకోబు కుమారులనే ప్రత్యేకంగా సూచిస్తున్నాయి; అందువల్ల లింగనిర్దిష్టతను నిలుపబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. ‘ఇదిగో’ మూలంలోని దృష్టి ఆకర్షణను నిలుపుతుంది; ‘మరొకడు లేడు’ అనేది ఉద్దేశపూర్వకంగా సంక్షిప్తంగా ఉంచి మూల అస్పష్టతను కాపాడుతుంది.
