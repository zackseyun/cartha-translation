revisions:
- from: 'మూడవ రోజున యోసేపు వారితో ఇలా అన్నాడు: “మీరు ఇలా చేసి బ్రతకండి[a]. నేను దేవునికి భయపడేవాణ్ణి.”'
  to: 'మూడవ రోజున యోసేపు వారితో ఇలా అన్నాడు: “ఇది చేయండి, బ్రతకండి[a]. నేను దేవునికి భయపడతాను.”'
  rationale: 'The revision retains the Hebrew’s concise command-plus-life sequence and its possible command/result relationship, as reflected in the footnote. It also corrects the tense-aspect of Joseph’s confession: the Hebrew presents his fear of God as a current characteristic, not a past habit.'
