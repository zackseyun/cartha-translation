id: GEN.42.18
reference: Genesis 42:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אֲלֵ/הֶ֤ם יוֹסֵף֙ בַּ/יּ֣וֹם הַ/שְּׁלִישִׁ֔י זֹ֥את עֲשׂ֖וּ וִֽ/חְי֑וּ אֶת הָ/אֱלֹהִ֖ים אֲנִ֥י יָרֵֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/018.yaml
  text: On the third day Joseph said to them[a], “Do this and live, for I fear God.
translation:
  language: te
  text: 'మూడవ రోజున యోసేపు వారితో ఇలా అన్నాడు: “ఇది చేయండి, బ్రతకండి[a]. నేను దేవునికి భయపడతాను.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఇది చేయండి, అప్పుడు బ్రతుకుతారు”; హీబ్రూలో వరుసగా రెండు ఆజ్ఞలు ఉండవచ్చు, లేదా మొదటి ఆజ్ఞను అనుసరించిన ఫలితాన్ని రెండవది సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵהֶם יוֹסֵף
  choice: యోసేపు వారితో ఇలా అన్నాడు
  rationale: אמר అనే క్రియతో ప్రత్యక్ష వాక్యం ప్రారంభమవుతోంది; ‘వారితో ... అన్నాడు’ ఆధునిక తెలుగులో సహజంగా పరోక్ష కర్మను తెలియజేస్తుంది.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: మూడవ రోజున
  rationale: హీబ్రూ కాలసూచక పదబంధానికి సహజమైన, సంక్షిప్త తెలుగు రూపం.
- source_word: זֹאת עֲשׂוּ
  choice: మీరు ఇలా చేసి
  rationale: זֹאת అనే సూచనార్థక పదం సందర్భంలో ఒక చర్యావిధానాన్ని సూచిస్తుంది; ‘ఇలా’ తెలుగులో సహజంగా ఉంటుంది. కర్తను స్పష్టంచేయడానికి ‘మీరు’ చేర్చబడింది.
- source_word: וִחְיוּ
  choice: బ్రతకండి
  rationale: ఆజ్ఞారూపాన్ని నిలిపి, ముందున్న ఆజ్ఞను అనుసరించడం వల్ల జీవించడం/ప్రాణాలతో ఉండడం అనే భావాన్ని సంక్షిప్తంగా ఉంచుతుంది.
- source_word: אֶת הָאֱלֹהִים
  choice: దేవునికి
  rationale: ఇక్కడ הָאֱלֹהִים ఏక దేవునిని సూచిస్తుంది. తెలుగు ‘భయపడు’ క్రియతో ‘దేవునికి’ అనే చతుర్థీ విభక్తి సహజం.
- source_word: אֲנִי יָרֵא
  choice: నేను ... భయపడేవాణ్ణి
  rationale: సర్వనామంతో కూడిన కర్తృవాచక కృదంతం యోసేపు స్వభావసిద్ధమైన దేవభయాన్ని తెలియజేస్తుంది; ‘భయపడేవాణ్ణి’ ఆ నిరంతర లక్షణాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: אֶת הָאֱלֹהִים אֲנִי יָרֵא అనే యోసేపు ప్రకటన భావం
  choice: నేను దేవునికి భయపడేవాణ్ణి
  alternative: నేను దైవానికి భయపడేవాణ్ణి
  rationale: ఆదికాండ కథన సందర్భంలో ఇది యోసేపు దేవునిపట్ల కలిగిన భయభక్తిని సూచిస్తుంది. ‘దేవునికి’ అని అనువదించడం ఏక దేవుని సూచనను నిలుపుతుంది; అయితే అదనపు వివరణను ప్రధాన వచనంలో చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘బ్రతకండి’ ఇక్కడ కేవలం జీవించడం మాత్రమే కాక ప్రాణాలతో ఉండడమనే సందర్భార్థాన్నీ కలిగి ఉంటుంది. మూలంలోని సంక్షిప్తత, ఆజ్ఞ-ఫలిత సంబంధంలోని సందిగ్ధత పాదసూచికతో నిలుపబడ్డాయి.
