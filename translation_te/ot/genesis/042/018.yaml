    text: లేదా “ఇది చేయండి, అప్పుడు బ్రతుకుతారు”; హీబ్రూలో వరుసగా రెండు ఆజ్ఞలు ఉండవచ్చు, లేదా మొదటి ఆజ్ఞను అనుసరించిన ఫలితాన్ని రెండవది సూచించవచ్చు.
