translation:
  language: te
  text: అతడు వారిని మూడు రోజులపాటు నిర్బంధంలో ఉంచాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతడు వారిని మూడు రోజులపాటు కాపలా కింద ఉంచాడు.” హీబ్రూ క్రియకు అక్షరార్థంగా “పోగుచేశాడు/సమకూర్చాడు” అని అర్థం; అయితే ఇక్కడ అది వారిని అదుపులో ఉంచడాన్ని సూచించే నుడికారంగా వాడబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּאֱסֹף
  choice: ఉంచాడు
  rationale: אָסַף అనే క్రియకు అక్షరార్థంగా ‘పోగుచేయడం/సమకూర్చడం’ అనే భావం ఉన్నా, אֶל מִשְׁמָר తో కలిసి ఇక్కడ ఎవరినైనా కాపలా కింద ఉంచడాన్ని సూచిస్తుంది. ‘ఉంచాడు’ ఆధునిక తెలుగులో సహజంగా ఈ సందర్భార్థాన్ని తెలియజేస్తుంది.
- source_word: אֹתָם
  choice: వారిని
  rationale: ఇది పుంలింగ బహువచన ప్రత్యక్ష కర్మ సర్వనామం; యోసేపు సహోదరులను సూచిస్తుంది.
- source_word: אֶל
  choice: లో
  rationale: אֶל సాధారణంగా ‘వైపు/లోనికి’ అనే దిశార్థాన్ని ఇస్తుంది; ‘కాపలాలో ఉంచాడు’ అనే తెలుగు ప్రయోగంలో నిర్బంధ స్థితిలోకి చేర్చిన భావం సహజంగా వ్యక్తమవుతుంది.
- source_word: מִשְׁמָר
  choice: కాపలా
  rationale: ఈ పదం కాపాడబడే లేదా అదుపులో ఉంచబడే స్థలాన్ని గానీ స్థితిని గానీ సూచించవచ్చు. ‘కాపలా’ మూలంలోని విస్తృతతను నిలుపుతూ, తప్పనిసరిగా అధికారిక చెరసాలనే సూచించకుండా ఉంటుంది.
- source_word: שְׁלֹשֶׁת יָמִים
  choice: మూడు రోజులపాటు
  rationale: ఈ పదబంధం కాలవ్యవధిని సూచిస్తుంది; ‘మూడు రోజులపాటు’ సహజమైన ఆధునిక తెలుగు రూపం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం. ‘కాపలాలో’ అనే పదం మִשְׁמָר లోని కాపలా/అదుపు భావాన్ని నిలుపుతుంది; ‘చెరసాలలో’ అని అనువదించి మూలం కంటే ఎక్కువ నిర్దిష్టతను చేర్చలేదు.
