  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּכֵּ֥ר יוֹסֵ֖ף אֶת אֶחָ֑י/ו וְ/הֵ֖ם לֹ֥א הִכִּרֻֽ/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/008.yaml
  text: Joseph recognized his brothers[a], but they did not recognize him.
translation:
  language: te
  text: యోసేపు తన అన్నదమ్ములను గుర్తుపట్టాడు; కానీ వారు అతణ్ణి గుర్తుపట్టలేదు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּכֵּר
  choice: గుర్తుపట్టాడు
  rationale: నכר అనే క్రియ యొక్క హిఫీల్ రూపం ఇక్కడ ముందుగా తెలిసిన వ్యక్తులను చూసి గుర్తించడం అనే అర్థాన్ని ఇస్తుంది. ఆధునిక తెలుగులో ‘గుర్తుపట్టాడు’ సహజంగా ఉండి కథలోని వ్యత్యాసాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: יוֹסֵף
  choice: యోసేపు
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: אֶת־אֶחָיו
  choice: తన అన్నదమ్ములను
  rationale: సందర్భంలో אָח పదం యోసేపు యొక్క పురుష సహోదరులను సూచిస్తుంది. ‘అన్నదమ్ములు’ సాధారణ ఆధునిక తెలుగులో సహజమైన, సందర్భోచితమైన పదం.
- source_word: וְהֵם
  choice: కానీ వారు
  rationale: ו సాధారణంగా ‘మరియు’ అని అనువదించవచ్చుగానీ, ఇక్కడ యోసేపు గుర్తుపట్టడానికీ వారు గుర్తుపట్టకపోవడానికీ మధ్య వ్యత్యాసం ఉంది; అందువల్ల ‘కానీ’ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לֹא הִכִּרֻהוּ
  choice: అతణ్ణి గుర్తుపట్టలేదు
  rationale: మొదటి ఉపవాక్యంలో ఉన్న అదే נכר క్రియను ‘గుర్తుపట్టు’ అనే పదంతో మళ్లీ ఇవ్వడం ద్వారా మూలంలోని పదపునరుక్తి, కథన వ్యంగ్యం నిలిచాయి; కర్మ ప్రత్యయం యోసేపును సూచిస్తుంది.
theological_decisions: []
translation_notes:
  register: సరళమైన, గౌరవప్రదమైన ఆధునిక ప్రామాణిక తెలుగు. మూలంలోని ఒకే క్రియ పునరుక్తిని రెండు ఉపవాక్యాల్లోనూ ‘గుర్తుపట్టు’తో నిలిపినందున ప్రత్యేక పాదటిప్పణి అవసరం లేదు.
