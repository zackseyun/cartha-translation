id: GEN.42.23
reference: Genesis 42:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הֵם֙ לֹ֣א יָֽדְע֔וּ כִּ֥י שֹׁמֵ֖עַ יוֹסֵ֑ף כִּ֥י הַ/מֵּלִ֖יץ בֵּינֹתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/023.yaml
  text: But they did not know that Joseph was listening[a], because the interpreter was between them.
translation:
  language: te
  text: కాని యోసేపు వారి మాటలు అర్థం చేసుకుంటున్నాడని[a] వారికి తెలియలేదు, ఎందుకంటే యోసేపుకూ వారికీ మధ్య అనువాదకుడు ఉన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యోసేపు వింటున్నాడని”; అంటే, వారు చెప్పేదాన్ని ఆయన అర్థం చేసుకోగలడనే భావం.
    reason: శֹׁמֵעַ యొక్క ‘వినడం’ అనే ప్రాథమిక అర్థాన్ని, సందర్భంలో ఉన్న ‘అర్థం చేసుకోవడం’ అనే భావంతో పాటు కాపాడుతుంది.
lexical_decisions:
- source_word: וְהֵם
  choice: కాని ... వారికి
  rationale: ముందటి సందర్భంతో ఉన్న కథన విరుద్ధతను ‘కాని’ సహజంగా తెలియజేస్తుంది; హీబ్రూలోని బహువచన సర్వనామ భావం తెలుగులో ‘వారికి’ ద్వారా వ్యక్తమవుతుంది.
- source_word: לֹא יָדְעוּ
  choice: తెలియలేదు
  rationale: ఇక్కడ ידע గతకాలంలో వారికి ఆ విషయం తెలియకపోవడాన్ని నేరుగా సూచిస్తుంది.
- source_word: כִּי
  choice: అని
  rationale: మొదటి כִּי వారికి తెలియని విషయం ఏమిటో పరిచయం చేస్తుంది; తెలుగులో ‘అని’ సహజమైన విషయసూచక ప్రయోగం.
- source_word: שֹׁמֵעַ
  choice: మాటలు అర్థం చేసుకుంటున్నాడు
  rationale: שׁמע యొక్క ప్రాథమిక భావం వినడం అయినా, అనువాదకుడు ఉన్న సందర్భంలో యోసేపు వారి భాషను గ్రహించగలడనే అంశమే ఉద్దేశం. ‘మాటలు అర్థం చేసుకుంటున్నాడు’ ఆ సందర్భార్థాన్ని స్పష్టంగా, సహజంగా అందిస్తుంది.
- source_word: יוֹסֵף
  choice: యోసేపు
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: రెండవ כִּי వారు ఎందుకు అలా భావించారో కారణాన్ని పరిచయం చేస్తుంది.
- source_word: הַמֵּלִיץ
  choice: అనువాదకుడు
  rationale: ఈ సందర్భంలో מליץ రెండు భాషా పక్షాల మధ్య మాటలను అందించే వ్యక్తిని సూచిస్తుంది; ఆధునిక తెలుగులో ‘అనువాదకుడు’ స్పష్టమైన పదం.
- source_word: בֵּינֹתָם
  choice: వారి మధ్య
  rationale: యోసేపు మరియు అతని సోదరుల మధ్య అనువాదకుడు మధ్యవర్తిగా ఉన్న సంబంధాన్ని కాపాడుతుంది.
