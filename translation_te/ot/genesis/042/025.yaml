  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְצַ֣ו יוֹסֵ֗ף וַ/יְמַלְא֣וּ אֶת כְּלֵי/הֶם֮ בָּר֒ וּ/לְ/הָשִׁ֤יב כַּסְפֵּי/הֶם֙ אִ֣ישׁ אֶל שַׂקּ֔/וֹ וְ/לָ/תֵ֥ת לָ/הֶ֛ם צֵדָ֖ה לַ/דָּ֑רֶךְ וַ/יַּ֥עַשׂ לָ/הֶ֖ם כֵּֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/025.yaml
  text: Then Joseph gave orders to fill their containers with grain[a], to return each man's silver to his sack, and to give them provisions for the journey[d][c][b]. And so it was done for them.
translation:
  language: te
  text: అప్పుడు యోసేపు వారి పాత్రలను ధాన్యంతో నింపాలని, ప్రతి ఒక్కరి వెండిని తిరిగి అతని సంచిలో పెట్టాలని, ప్రయాణానికి వారికి ఆహార సామగ్రి ఇవ్వాలని ఆజ్ఞాపించాడు. వారికి అలాగే చేయబడింది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְצַו
  choice: ఆజ్ఞాపించాడు
  rationale: צוה ఆదేశం జారీచేయడాన్ని సూచిస్తుంది; తరువాతి క్రియార్థక నిర్మాణాలతో సహజంగా సరిపోతుంది.
- source_word: כְּלֵיהֶם
  choice: వారి పాత్రలను
  rationale: כְּלִי అనేది సామాను ఉంచే పాత్ర లేదా పరికరానికి విస్తృత పదం. తరువాత వచ్చే שַׂקּוֹను ‘సంచి’గా వేరుగా అనువదించడం ద్వారా మూలంలోని పదభేదం నిలుస్తుంది.
- source_word: בָּר
  choice: ధాన్యం
  rationale: కరవు సందర్భంలో בָּר ధాన్యాన్ని సూచిస్తుంది; నిర్దిష్టంగా గోధుమ అని పరిమితం చేయదు.
- source_word: וּלְהָשִׁיב כַּסְפֵּיהֶם
  choice: వారి వెండిని తిరిగి ... పెట్టాలని
  rationale: כֶּסֶף అక్షరార్థంగా వెండి; సందర్భంలో చెల్లింపుగా ఉపయోగించిన డబ్బు. కథనంలోని స్పష్టమైన వస్తువును నిలుపుకోవడానికి ‘వెండి’ ఎంచుకోబడింది.
- source_word: אִישׁ אֶל שַׂקּוֹ
  choice: ప్రతి ఒక్కరి వెండిని తిరిగి అతని సంచిలో
  rationale: אִישׁ ఇక్కడ పంపిణీయ భావంలో ‘ప్రతి ఒక్కరు’; שַׂק ప్రత్యేకంగా సంచిని సూచిస్తుంది. ‘అతని’ అన్నది సందర్భంలోని పురుష సహోదరులకు అనుగుణం.
- source_word: צֵדָה לַדָּרֶךְ
  choice: ప్రయాణానికి ... ఆహార సామగ్రి
  rationale: צֵדָה ప్రయాణంలో ఉపయోగించే ఆహారం లేదా సరఫరాలను సూచిస్తుంది; ‘ఆహార సామగ్రి’ సాధారణ పాఠకునికి సహజంగా, సందర్భోచితంగా ఉంది.
- source_word: וַיַּעַשׂ לָהֶם כֵּן
  choice: వారికి అలాగే చేయబడింది
  rationale: ఏకవచన క్రియకు కర్త స్పష్టంగా పేర్కొనబడలేదు. తెలుగులో కర్మణి రూపం ఆ అనిర్దిష్టతను కాపాడుతూ, ఆజ్ఞ అమలైందనే భావాన్ని సహజంగా తెలియజేస్తుంది.
