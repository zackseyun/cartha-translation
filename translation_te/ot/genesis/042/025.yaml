translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన, సులభంగా అర్థమయ్యే కథన శైలి. ‘పాత్రలు/సంచి’ అనే మూల పదభేదం ఉద్దేశపూర్వకంగా నిలుపబడింది. ‘వెండి’ ద్వారా అక్షరార్థం మరియు ద్రవ్యార్థం రెండింటికీ సందర్భంలో చోటు ఉంటుంది.
