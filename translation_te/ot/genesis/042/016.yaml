    issue: Purposive connective is weakened
    rationale: “అప్పుడు” marks simple sequence, whereas the Hebrew construction presents the confinement/testing as the means by which the brothers' truthfulness is assessed. “తద్వారా” better conveys this relation.
  - severity: low
    issue: Slightly colloquial accusative form
    rationale: “ఒకణ్ణి” is understandable, but “ఒకరిని” is preferable in modern standard written Telugu for this formal narrative register.
