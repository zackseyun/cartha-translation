base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/016.yaml
  text: Send one of you[a], and let him bring your brother, while you remain confined, so that your words may be tested, whether the truth is with you. But if not, as Pharaoh lives[d][c][b], surely you are spies.
translation:
  language: te
  text: మీలో ఒకరిని పంపండి; అతడు మీ సోదరుణ్ణి తీసుకురావాలి.[a] మీరు మాత్రం నిర్బంధంలో ఉండండి.[b] తద్వారా మీ మాటలు పరీక్షించబడి, సత్యం మీతో ఉందో లేదో[c] తేలుతుంది. లేకపోతే, ఫరో ప్రాణం తోడు,[d] మీరు తప్పకుండా గూఢచారులే.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “అతడు మీ సోదరుణ్ణి తీసుకోవాలి.” ఇక్కడ అతణ్ణి వెంటబెట్టుకొని తిరిగి రావడం ఉద్దేశం.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “మీరు బంధించబడి ఉండండి”; అంటే, కాపలాలో ఉంచబడండి.
    reason: lexical_alternative
  - marker: c
    text: అక్షరార్థంగా, “సత్యం మీతో ఉందో లేదో”; అంటే, మీరు నిజం చెబుతున్నారో లేదో.
    reason: lexical_alternative
  - marker: d
    text: “ఫరో ప్రాణం తోడు” అనేది ఫరో ప్రాణాన్ని ప్రస్తావిస్తూ చేసిన ప్రమాణ వాక్యం.
    reason: cultural_note
lexical_decisions:
- source_word: שִׁלְחוּ מִכֶּם אֶחָד
  choice: మీలో ఒకణ్ణి పంపండి
  rationale: బహువచన ఆజ్ఞను, సమూహం నుండి ఒక వ్యక్తిని ఎంపిక చేసి పంపాలనే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: וְיִקַּח אֶת אֲחִיכֶם
  choice: అతడు మీ సోదరుణ్ణి తీసుకురావాలి
  rationale: לקח సాధారణంగా ‘తీసుకొను’ అని అర్థమైనా, సందర్భంలో సోదరుణ్ణి అక్కడి నుండి యోసేపు వద్దకు తీసుకురావడం ఉద్దేశం. మూలపదానికి దగ్గరైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: וְאַתֶּם הֵאָסְרוּ
  choice: మీరు మాత్రం నిర్బంధంలో ఉండండి
  rationale: אסר యొక్క నిఫాల్ రూపం బంధించబడడం లేదా అదుపులో ఉంచబడడం సూచిస్తుంది. ‘మాత్రం’ ఒకడు వెళ్లగా మిగిలినవారు నిర్బంధంలో ఉండాలనే వ్యత్యాసాన్ని సహజంగా చూపుతుంది.
- source_word: וְיִבָּחֲנוּ דִּבְרֵיכֶם
  choice: మీ మాటలు పరీక్షించబడి
  rationale: ‘మీ మాటలు’ అనే హీబ్రూ అభివ్యక్తిని నిలుపుతూ, בחן యొక్క పరీక్షించడం లేదా పరిశీలించడం అనే భావాన్ని తెలియజేస్తుంది.
- source_word: הַאֱמֶת אִתְּכֶם
  choice: సత్యం మీతో ఉందో లేదో
  rationale: ‘సత్యం మీతో ఉంది’ అనే మూలభాషా రూపకాన్ని పరిష్కరించకుండా నిలుపుతుంది; దాని సందర్భార్థాన్ని పాదసూచిక వివరిస్తుంది.
- source_word: חֵי פַרְעֹה
  choice: ఫరో ప్రాణం తోడు
  rationale: ఫరో జీవాన్ని ప్రస్తావించే ప్రమాణ సూత్రాన్ని తెలుగులో సహజమైన ప్రమాణ వాక్యంతో వ్యక్తం చేస్తుంది.
- source_word: כִּי מְרַגְּלִים אַתֶּם
  choice: మీరు తప్పకుండా గూఢచారులే
  rationale: כִּי యొక్క నిశ్చయార్థక బలాన్ని ‘తప్పకుండా’ తెలియజేస్తుంది; מרגלים కు ‘గూఢచారులు’ ప్రత్యక్ష సమానార్థకం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గంభీరమైన ఆజ్ఞారూప శైలిని వాడాం. ‘సత్యం మీతో’ అనే మూలభాషా అసాధారణ రూపాన్ని ఉద్దేశపూర్వకంగా నిలిపి, వివరణను పాదసూచికకు పరిమితం చేశాం.
