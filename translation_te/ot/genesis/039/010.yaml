  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְהִ֕י כְּ/דַבְּרָ֥/הּ אֶל יוֹסֵ֖ף י֣וֹם י֑וֹם וְ/לֹא שָׁמַ֥ע אֵלֶ֛י/הָ לִ/שְׁכַּ֥ב אֶצְלָ֖/הּ לִ/הְי֥וֹת עִמָּֽ/הּ־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/010.yaml
  text: And it happened[a], as she spoke to Yosef day after day, that he did not listen to her, to lie beside her or to be with her.
translation:
  language: te
  text: 'ఇలా జరిగింది: ఆమె యోసేపుతో రోజు రోజుకూ మాట్లాడుతుండగా, అతడు ఆమె మాట వినలేదు—ఆమె పక్కన పడుకోవడానికిగానీ, ఆమెతో ఉండడానికిగానీ.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כְּדַבְּרָהּ
  choice: ఆమె … మాట్లాడుతుండగా
  rationale: వַיְהִי కథనంలోని తదుపరి పరిణామాన్ని పరిచయం చేస్తుంది; כְּדַבְּרָהּ కాలసంబంధ భావాన్ని ఇస్తుంది. తెలుగులో సహజమైన కథన ప్రవాహం కోసం రెండింటినీ ‘మాట్లాడుతుండగా’ అనే నిర్మాణంలో వ్యక్తం చేశాం.
- source_word: יוֹסֵף
  choice: యోసేపు
  rationale: హెబ్రీ పేరుకు దగ్గరగా ఉండే, తెలుగులో స్థిరపడిన రూపం.
- source_word: יוֹם יוֹם
  choice: రోజు రోజుకూ
  rationale: నామవాచక పునరుక్తి నిరంతర పునరావృతాన్ని సూచిస్తుంది; ఈ తెలుగు రూపం ఆమె పదేపదే ఒత్తిడి చేసిన భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וְלֹא שָׁמַע אֵלֶיהָ
  choice: అతడు ఆమె మాట వినలేదు
  rationale: שׁמע אֶל అంటే ఒకరి మాట వినడం లేదా దానికి లోబడడం. ‘మాట వినలేదు’ వినడాన్ని, అంగీకరించకపోవడాన్ని రెండింటినీ సందర్భానుకూలంగా వ్యక్తం చేస్తుంది.
- source_word: לִשְׁכַּב אֶצְלָהּ
  choice: ఆమె పక్కన పడుకోవడానికి
  rationale: שׁכב లైంగిక భావాన్ని కలిగి ఉండగలదు; అయితే אֵצֶל ప్రాదేశిక భావాన్ని కూడా ఇస్తుంది. ‘పక్కన పడుకోవడం’ మూలంలోని రూపాన్ని నిలిపి, సందర్భంలోని లైంగిక సూచనను పాఠకుడు గ్రహించేలా చేస్తుంది.
- source_word: לִהְיוֹת עִמָּהּ
  choice: ఆమెతో ఉండడానికి
  rationale: היה עם అనే పదబంధానికి నేరమైన విస్తృతార్థం ‘ఒకరితో ఉండడం.’ ఇది లైంగిక చర్యను మాత్రమే కాక, రాజీపడే సాన్నిహిత్యాన్ని కూడా అతడు తిరస్కరించిన భావానికి అవకాశం ఉంచుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘గానీ … గానీ’ నిర్మాణం రెండు నిరాకరించిన చర్యలను స్పష్టంగా సమన్వయపరుస్తుంది; మూలంలోని లైంగిక సూచనను అతిగా స్పష్టీకరించకుండా దాని సందిగ్ధతను నిలిపింది.
