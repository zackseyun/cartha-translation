base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/006.yaml
  text: So he left all that he had in Joseph’s hand[a], and he knew nothing with him except the food that he ate[b]. Now Joseph was handsome in form and handsome in appearance.
translation:
  language: te
  text: అతడు తనకున్నదంతా యోసేపు చేతిలో ఉంచాడు[a]. తాను తినే ఆహారం[b] తప్ప, యోసేపు బాధ్యతలో ఉన్న దేని గురించీ అతడు పట్టించుకోలేదు. యోసేపు దేహాకృతిలోనూ రూపంలోనూ అందగాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘యోసేపు చేతిలో’ అంటే యోసేపు అధీనంలో లేదా బాధ్యతలో అని అర్థం.
    reason: idiom
  - marker: b
    text: హెబ్రీలో ‘తాను తినే రొట్టె.’ ఇక్కడ ‘రొట్టె’ సాధారణంగా ఆహారాన్ని సూచించవచ్చు. అంతకుముందటి వాక్యభాగం అక్షరార్థంగా, ‘అతనితో అతనికి ఏ విషయమూ తెలియదు’ అనే నిర్మాణంలో ఉంది; సందర్భంలో అది యోసేపుకు అప్పగించిన వ్యవహారాల గురించి అతడు పట్టించుకోలేదని సూచిస్తుంది.
    reason: lexical_and_translation_alternative
lexical_decisions:
- source_word: וַיַּעֲזֹב
  choice: ఉంచాడు
  rationale: עזב అనే క్రియకు ప్రాథమికంగా ‘విడిచిపెట్టు/ఉంచు’ అనే భావం ఉంది. ఈ పరిపాలనా సందర్భంలో ‘యోసేపు చేతిలో ఉంచాడు’ అనేది మూలంలోని రూపకాన్ని నిలుపుతూ బాధ్యత అప్పగించాడనే భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: כָּל אֲשֶׁר לוֹ
  choice: తనకున్నదంతా
  rationale: పోతీఫరు ఆస్తులు, వ్యవహారాలు అన్నిటినీ సమగ్రంగా సూచించే సహజమైన తెలుగు ప్రయోగం.
- source_word: בְּיַד יוֹסֵף
  choice: యోసేపు చేతిలో
  rationale: ‘చేతిలో’ అనే మూలభాషా రూపకం అధీనాన్ని, నిర్వహణ బాధ్యతను సూచిస్తుంది; తెలుగులోనూ ఇది సులభంగా అర్థమవుతుంది.
- source_word: וְלֹא יָדַע אִתּוֹ מְאוּמָה
  choice: యోసేపు చూసుకుంటుండగా ... మరి దేని గురించీ అతడు పట్టించుకోలేదు
  rationale: అక్షరార్థంగా అస్పష్టమైన ‘అతనితో ఏమీ ఎరుగలేదు’ అనే నిర్మాణం, సందర్భంలో యోసేపు నిర్వహిస్తున్న వ్యవహారాల గురించి యజమాని శ్రద్ధ పెట్టనవసరం లేకపోయిందనే భావాన్ని ఇస్తుంది. పాదసూచికలో మరింత అక్షరార్థమైన ప్రత్యామ్నాయం ఇవ్వబడింది.
- source_word: כִּי אִם
  choice: తప్ప
  rationale: మినహాయింపును సంక్షిప్తంగా, సహజంగా సూచిస్తుంది.
- source_word: הַלֶּחֶם אֲשֶׁר הוּא אֹכֵל
  choice: తాను తినే ఆహారం
  rationale: לֶחֶם అక్షరార్థంగా ‘రొట్టె’ అయినా, ఇక్కడ సాధారణంగా భోజనం లేదా ఆహారాన్ని సూచించే విస్తృతార్థం సహజంగా సరిపోతుంది.
- source_word: יְפֵה תֹאַר וִיפֵה מַרְאֶה
  choice: దేహాకృతిలోనూ రూపంలోనూ అందగాడు
  rationale: תֹאַר శరీరాకృతిని, מַרְאֶה కనిపించే రూపాన్ని సూచిస్తాయి. రెండింటి మధ్య భేదాన్నీ హెబ్రీ సమాంతర నిర్మాణాన్నీ ఈ అనువాదం నిలుపుతుంది.
theological_decisions:
- issue: וְלֹא יָדַע אִתּוֹ מְאוּמָה అనే వాక్యభాగంలోని వ్యాకరణ అస్పష్టత
  choice: యోసేపు నిర్వహణలో ఉండగా యజమాని ఇతర విషయాల గురించి పట్టించుకోలేదనే సందర్భార్థాన్ని ప్రధాన పాఠ్యంలో ఇచ్చాం.
  alternative: ‘అతనితో ఉన్న దేని గురించీ అతనికి తెలియదు’ అనే మరింత అక్షరార్థ అనువాదం.
  rationale: మూలంలోని అసాధారణ ప్రయోగాన్ని సిద్ధాంతపరంగా అతిగా వివరించకుండా, సందర్భానికి తగిన భావాన్ని ప్రధాన పాఠ్యంలో సహజంగా తెలుపుతూ ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘చేతిలో’ అనే సహజ రూపకం మూలభాషా చిత్రాన్ని నిలుపుతుంది; ‘దేహాకృతి’ మరియు ‘రూపం’ ద్వారా చివరి రెండు హెబ్రీ పదబంధాల భేదం కాపాడబడింది.
