- from: ఈ ఇంట్లో నాకంటే గొప్పవాడు ఎవడూ లేడు[a]. నిన్ను తప్ప ఆయన నా దగ్గర ఏదీ దాచిపెట్టలేదు; ఎందుకంటే నువ్వు ఆయన భార్యవు. అలాంటప్పుడు నేను ఇంత గొప్ప దుష్కార్యం చేసి దేవునికి విరోధంగా ఎలా పాపం చేయగలను?[b]
  to: ఈ ఇంట్లో నాకంటే గొప్పవాడు ఎవరూ లేరు[a]. నిన్ను తప్ప ఆయన నాకు దేనినీ నిరాకరించలేదు, ఎందుకంటే నువ్వు ఆయన భార్యవు. అలాంటప్పుడు నేను ఈ గొప్ప చెడును[b] చేసి దేవునికి విరోధంగా ఎలా పాపం చేయగలను?
  rationale: ‘నిరాకరించలేదు’ అనేది חָשַׂךְ מִמֶּנִּי מְאוּמָה యొక్క ‘ఏదీ వెనుక ఉంచలేదు/withheld nothing’ అనే భావాన్ని ఆధునిక తెలుగులో స్పష్టంగా ఇస్తుంది. ‘ఈ గొప్ప చెడు’ హీబ్రూ הָרָעָה הַגְּדֹלָה הַזֹּאת లోని నిర్దేశకతను కాపాడుతుంది. [b]ను సంబంధిత పదం వెంట పెట్టి పాదటిప్పణి ఆంకరింగ్‌ను సరిచేశారు.
