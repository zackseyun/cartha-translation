source:
  edition: WLC
  text: אֵינֶ֨/נּוּ גָד֜וֹל בַּ/בַּ֣יִת הַ/זֶּה֮ מִמֶּ/נִּי֒ וְ/לֹֽא חָשַׂ֤ךְ מִמֶּ֨/נִּי֙ מְא֔וּמָה כִּ֥י אִם אוֹתָ֖/ךְ בַּ/אֲשֶׁ֣ר אַתְּ אִשְׁתּ֑/וֹ וְ/אֵ֨יךְ אֶֽעֱשֶׂ֜ה הָ/רָעָ֤ה הַ/גְּדֹלָה֙ הַ/זֹּ֔את וְ/חָטָ֖אתִי לֵֽ/אלֹהִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/009.yaml
  text: There is no one greater in this house than I am[a], and he has withheld nothing from me except you, because you are his wife[b]. So how could I do this great evil and sin against God?
translation:
  language: te
  text: ఈ ఇంట్లో నాకంటే గొప్పవాడు ఎవరూ లేరు[a]. నిన్ను తప్ప ఆయన నాకు దేనినీ నిరాకరించలేదు, ఎందుకంటే నువ్వు ఆయన భార్యవు. అలాంటప్పుడు నేను ఈ గొప్ప చెడును[b] చేసి దేవునికి విరోధంగా ఎలా పాపం చేయగలను?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఈ ఇంట్లో నాకంటే ఉన్నత స్థానంలో ఎవరూ లేరు.” హీబ్రూలో యోసేపుకంటే గొప్పవాడైన ఎవరూ ఈ ఇంట్లో లేరని అక్షరార్థంగా నిరాకరించబడుతోంది.
    reason: lexical_alternative
  - marker: b
    text: “చెడు” అని అనువదించిన హీబ్రూ పదానికి “దుష్కార్యం,” “దుష్టత్వం,” లేదా “తప్పు” అనే అర్థాలు రావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵינֶנּוּ גָדוֹל ... מִמֶּנִּי
  choice: ఈ ఇంట్లో నాకంటే గొప్పవాడు ఎవడూ లేడు
  rationale: אֵין నిర్మాణం ఒక నిర్దిష్ట వ్యక్తిని నిరాకరించడం కంటే, యోసేపుకంటే గొప్పవాడైన ఎవరూ ఇంట్లో లేరని సూచిస్తుంది. ఈ తెలుగు రూపం అతని గృహనిర్వహణ హోదాను సహజంగా తెలియజేస్తుంది.
- source_word: בַּבַּיִת הַזֶּה
  choice: ఈ ఇంట్లో
  rationale: בַּיִת భౌతిక ఇల్లు లేదా ఇంటివారి వ్యవస్థ/గృహస్థానాన్ని సూచించగలదు. ‘ఈ ఇంట్లో’ హీబ్రూ రూపకాన్ని నిలుపుతూ సందర్భానికి తగిన విస్తృత అర్థాన్ని ఇస్తుంది.
- source_word: חָשַׂךְ מִמֶּנִּי מְאוּמָה
  choice: నా దగ్గర ఏదీ దాచిపెట్టలేదు
  rationale: חָשַׂךְ ఇక్కడ వెనక్కి ఉంచడం లేదా ఇవ్వకుండా దాచడం అనే భావం. ఆధునిక తెలుగులో ‘దాచిపెట్టలేదు’ సహజంగా ఉండి, యజమాని యోసేపుకు ఏదీ నిరాకరించలేదనే అర్థాన్ని అందిస్తుంది.
- source_word: כִּי אִם אוֹתָךְ
  choice: నిన్ను తప్ప
  rationale: నిరాకరణ తరువాత כִּי אִם మినహాయింపును సూచిస్తుంది. ‘నిన్ను తప్ప’ సంక్షిప్తంగా, స్పష్టంగా అదే భావాన్ని ఇస్తుంది.
- source_word: בַּאֲשֶׁר אַתְּ אִשְׁתּוֹ
  choice: ఎందుకంటే నువ్వు ఆయన భార్యవు
  rationale: ఈ పదబంధం ఆ మినహాయింపుకు కారణాన్ని తెలియజేస్తుంది. ‘ఎందుకంటే’ దాని కారణార్థాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וְאֵיךְ
  choice: అలాంటప్పుడు ... ఎలా
  rationale: וְאֵיךְ ముందున్న విషయాలనుంచి యోసేపు తీసుకున్న నైతిక నిర్ధారణను ప్రవేశపెడుతుంది. ‘అలాంటప్పుడు ... ఎలా’ ఆ అనుమానార్థక, నిర్ధారణాత్మక బలాన్ని తెలుగులో సహజంగా చూపుతుంది.
- source_word: אֶעֱשֶׂה
  choice: చేసి
  rationale: עשה సాధారణంగా ‘చేయు’ అనే అర్థం. దాని కర్మ ‘ఈ గొప్ప దుష్కార్యం’ నైతిక స్వభావాన్ని ఇప్పటికే స్పష్టం చేస్తున్నందున మరింత వ్యాఖ్యానాత్మక క్రియ అవసరం లేదు.
- source_word: הָרָעָה הַגְּדֹלָה הַזֹּאת
  choice: ఇంత గొప్ప దుష్కార్యం
  rationale: רָעָה చెడు, దుష్టత్వం, అపకారం అనే అర్థాలను కలిగి ఉంది. ‘దుష్కార్యం’ ఇక్కడ చేయబోయే తీవ్రమైన నైతిక తప్పును సహజంగా తెలియజేస్తుంది; ‘ఇంత గొప్ప’ నిర్దేశక పదం మరియు తీవ్రతను వ్యక్తం చేస్తుంది.
- source_word: וְחָטָאתִי לֵאלֹהִים
  choice: దేవునికి విరోధంగా ... పాపం చేయగలను
  rationale: חטא + ל ఇక్కడ ఎవరికైనా విరోధంగా పాపం చేయడాన్ని సూచిస్తుంది. ‘దేవునికి విరోధంగా’ లక్ష్యార్థాన్ని స్పష్టంగా, సహజమైన తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: యోసేపు మాటల్లో אֱלֹהִים యొక్క నిర్దేశ్యం
  choice: దేవుడు
  alternative: ఒక దేవుడు / దేవత
  rationale: ఆదికాండపు కథనంలో యోసేపు తాను ఆరాధించే నిజ దేవునినే సూచిస్తున్నాడు; అతని మాట ఈ చర్యను కేవలం యజమానిపై చేసిన తప్పుగా కాక దేవునికి విరోధమైన పాపంగా పేర్కొంటుంది. అందువల్ల ‘దేవుడు’ సందర్భానుకూలం.
- issue: పాపం యొక్క ద్వంద్వ సంబంధం
  choice: దుష్కార్యం చేయడం మరియు దేవునికి విరోధంగా పాపం చేయడం రెండింటినీ నిలుపుట
  alternative: యజమానిపై చేసిన సామాజిక తప్పుగా మాత్రమే సంక్షిప్తీకరించడం
  rationale: హీబ్రూ వాక్యం మానవ సంబంధ ద్రోహాన్ని సూచించే సందర్భాన్ని, దేవునికి విరోధమైన పాపమనే ప్రత్యక్ష నైతిక వాదనను కలిపి ఉంచుతుంది. అనువాదం ఈ ఉద్రిక్తతను తగ్గించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవభరితమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి వాడబడింది. యోసేపు పొతీఫరు భార్యతో నేరుగా మాట్లాడుతున్నందున ‘నువ్వు’ సహజమైన ఏకవచన సంబోధనగా ఉంచబడింది; పొతీఫరును ‘ఆయన’గా గౌరవంగా సూచించబడింది. ప్రధాన పాఠంలోని [a], [b] గుర్తులు సంబంధిత పాదటిప్పణులతో సరిపోతాయి.
