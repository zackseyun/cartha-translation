  text: וַ/תִּתְפְּשֵׂ֧/הוּ בְּ/בִגְד֛/וֹ לֵ/אמֹ֖ר שִׁכְבָ֣/ה עִמִּ֑/י וַ/יַּעֲזֹ֤ב בִּגְד/וֹ֙ בְּ/יָדָ֔/הּ וַ/יָּ֖נָס וַ/יֵּצֵ֥א הַ/חֽוּצָ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/012.yaml
  text: Then she grabbed him by his garment[a], saying[b], “Lie with me!” But he left his garment in her hand and fled and went outside.
translation:
  language: te
  text: అప్పుడు ఆమె అతని వస్త్రాన్ని[a] పట్టుకొని, “నాతో పడుకో![b]” అంది. కానీ అతడు తన వస్త్రాన్ని ఆమె చేతిలో వదిలి, పారిపోయి బయటికి వెళ్లాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘వస్త్రం’ అనే హెబ్రీ పదాన్ని సందర్భాన్ని బట్టి ‘అంగీ’ లేదా ‘పైవస్త్రం’ అని కూడా అనువదించవచ్చు; అది సాధారణంగా ఒక దుస్తును సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా ‘నాతో పడుకో!’; ఇక్కడ ఈ హెబ్రీ ప్రయోగం లైంగిక సంబంధానికి చేసిన ప్రతిపాదనను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּתְפְּשֵׂהוּ
  choice: ఆమె ... పట్టుకొని
  rationale: תפשׂ బలంగా పట్టుకోవడాన్ని సూచిస్తుంది. సందర్భంలో అకస్మాత్తుగా జరిగిన శారీరక చర్యను సహజమైన ఆధునిక తెలుగులో ‘పట్టుకొని’ తెలియజేస్తుంది.
- source_word: בְּבִגְדוֹ / בִּגְדוֹ
  choice: అతని వస్త్రాన్ని / తన వస్త్రాన్ని
  rationale: בגד ఒక నిర్దిష్ట రకాన్ని కాక సాధారణంగా దుస్తు లేదా వస్త్రాన్ని సూచిస్తుంది. అందువల్ల ‘అంగీ’ లేదా ‘పైవస్త్రం’ అని మరీ నిర్దిష్టం చేయకుండా ‘వస్త్రం’ అని అనువదించబడింది.
- source_word: לֵאמֹר
  choice: '... అంది'
  rationale: ఈ infinitive construct ప్రత్యక్ష సంభాషణను పరిచయం చేస్తుంది. తెలుగు కథన శైలిలో ‘అంది’ సహజంగా అదే పనిని చేస్తుంది.
- source_word: שִׁכְבָה עִמִּי
  choice: నాతో పడుకో!
  rationale: שׁכב + עִם ఇక్కడ లైంగిక సంబంధానికి వాడిన సభ్యోక్తి. ‘నాతో పడుకో’ మూలంలోని ‘పడుకొను’ భావాన్ని, అలాగే దాని లైంగిక ఉద్దేశాన్ని నిలుపుతుంది.
- source_word: וַיַּעֲזֹב
  choice: వదిలి
  rationale: עזב ఇక్కడ వస్త్రాన్ని ఆమె చేతిలో ఉండనిచ్చి వెళ్లిపోవడాన్ని సూచిస్తుంది. ‘వదిలి’ సంక్షిప్తంగాను సందర్భోచితంగాను ఉంది.
- source_word: בְּיָדָהּ
  choice: ఆమె చేతిలోనే
  rationale: יד అంటే అక్షరార్థంగా ‘చెయ్యి’. ‘చేతిలోనే’ అనడం వస్త్రం ఆమె పట్టు లేదా స్వాధీనంలో మిగిలిపోయిందనే భావాన్ని సహజంగా స్పష్టం చేస్తుంది.
- source_word: וַיָּנָס
  choice: పారిపోయి
  rationale: נוס అత్యవసరంగా తప్పించుకొని పారిపోవడాన్ని సూచిస్తుంది. ‘పారిపోయి’ ఆ తీవ్రతను నిలుపుతుంది.
- source_word: וַיֵּצֵא הַחוּצָה
  choice: బయటికి వెళ్లాడు
  rationale: יצא + החוצה లోపలి ప్రదేశం నుంచి బయటికి కదలడాన్ని సూచిస్తుంది. ‘బయటికి వెళ్లాడు’ ఆధునిక తెలుగులో సహజమైన దిశాసూచక వ్యక్తీకరణ.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. హెబ్రీ వాక్యంలోని వరుస చర్యలు నిలుపుతూ, తెలుగులో సహజంగా వినిపించేందుకు లֵאמֹר ను ‘అంది’గా మలిచాం. మూలంలోని లైంగిక సభ్యోక్తిని మరింత మృదువుగానో మరింత స్పష్టంగానో మార్చకుండా నిలిపాం.
