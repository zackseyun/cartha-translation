  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּ֣רְא אֲדֹנָ֔י/ו כִּ֥י יְהוָ֖ה אִתּ֑/וֹ וְ/כֹל֙ אֲשֶׁר ה֣וּא עֹשֶׂ֔ה יְהוָ֖ה מַצְלִ֥יחַ בְּ/יָדֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/003.yaml
  text: His master saw that Yahweh was with him[a], and that Yahweh made prosper in his hand all that he did.
translation:
  language: te
  text: అతని యజమాని యాహ్వే అతనితో ఉన్నాడనీ, అతడు చేసే ప్రతిదీ అతని చేతిలో[a] సఫలమయ్యేలా యాహ్వే చేస్తున్నాడనీ చూశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘అతని చేతిలో’; ‘అతని ద్వారా’ లేదా ‘అతని నిర్వహణలో’ అనే భావమూ ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: చూశాడు
  rationale: ראה అనే క్రియకు ఉన్న సరళమైన కథనార్థమైన ‘చూశాడు’ను నిలుపుతుంది; సందర్భంలో గమనించి తెలుసుకోవడం అనే భావం సహజంగానే వ్యక్తమవుతుంది.
- source_word: אֲדֹנָיו
  choice: అతని యజమాని
  rationale: ఇంటి దాసుడైన యోసేపుపై అధికారమున్న పోతీఫరును సూచిస్తుంది; ఆధునిక తెలుగులో ‘యజమాని’ సామాజిక సందర్భానికి సహజంగా సరిపోతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో లిప్యంతరీకరించింది.
- source_word: אִתּוֹ
  choice: అతనితో ఉన్నాడు
  rationale: యోసేపుతో దేవుని సన్నిధి ఉందనే భావాన్ని నేరుగా, సహజంగా తెలియజేస్తుంది.
- source_word: וְכֹל אֲשֶׁר הוּא עֹשֶׂה
  choice: అతడు చేసే ప్రతిదానినీ
  rationale: హీబ్రూ వర్తమాన కృదంతం తెలిపే కొనసాగుతున్న లేదా అలవాటైన కార్యాన్ని, దాని సమగ్ర పరిధిని నిలుపుతుంది.
- source_word: מַצְלִיחַ
  choice: సఫలం చేస్తున్నాడు
  rationale: צלח హిఫీల్ రూపంలోని కారణార్థాన్ని నిలుపుతూ, విజయానికి యాహ్వేనే కారణమని స్పష్టంగా తెలియజేస్తుంది.
- source_word: בְּיָדוֹ
  choice: అతని చేతిలో
  rationale: మూలంలోని స్పష్టమైన చేతి రూపకాన్ని నిలుపుతుంది; అది సాధనం, నిర్వహణ లేదా బాధ్యతా పరిధిని సూచించవచ్చు.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది; ‘యాహ్వే’ దాన్ని బిరుదుగా మార్చకుండా నిలుపుతుంది.
- issue: בְּיָדוֹ లోని భావ పరిధి
  choice: ప్రధాన పాఠంలో ‘అతని చేతిలో’ అని నిలుపడం
  alternative: అతని ద్వారా / అతని పర్యవేక్షణలో
  rationale: ఈ హీబ్రూ పదబంధం సాధనం, కార్యనిర్వహణ లేదా అధికార పరిధి అనే భావాలను కలిగి ఉండవచ్చు. ప్రధాన పాఠంలో రూపకాన్ని నిలిపి, ప్రత్యామ్నాయ భావాలను పాదసూచికలో ఇవ్వడం అనవసరమైన అర్థనిర్ణయాన్ని నివారిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. మూలంలోని యాహ్వే నామ పునరుక్తిని, ‘చేతిలో’ అనే స్పష్టమైన రూపకాన్ని నిలుపుతూ వాక్య నిర్మాణాన్ని తెలుగుకు అనుగుణంగా అమర్చాం.
