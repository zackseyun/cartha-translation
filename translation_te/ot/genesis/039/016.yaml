  yaml_path: translation/ot/genesis/039/016.yaml
  text: So she kept his garment beside her until his master came home.
translation:
  language: te
  text: అతని యజమాని తన ఇంటికి వచ్చే వరకు ఆమె అతని వస్త్రాన్ని తన వద్ద ఉంచింది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתַּנַּח
  choice: ఉంచుకుంది
  rationale: హిఫీల్ రూపం ఇక్కడ ‘ఉంచింది/తన దగ్గర ఉండనిచ్చింది’ అనే భావాన్ని ఇస్తుంది; సందర్భంలో వస్త్రాన్ని సాక్ష్యంగా తన వద్ద ఉంచుకోవడం సహజంగా వ్యక్తమవుతుంది.
- source_word: בִּגְדוֹ
  choice: అతని వస్త్రాన్ని
  rationale: בֶּגֶד సాధారణంగా వస్త్రం లేదా పైవస్త్రాన్ని సూచిస్తుంది; మూలంలో లేని మరింత నిర్దిష్టమైన వస్త్ర రకాన్ని చేర్చలేదు.
- source_word: אֶצְלָהּ
  choice: తన దగ్గర
  rationale: ‘ఆమె పక్కన/ఆమె వద్ద’ అనే మూల భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: עַד בּוֹא אֲדֹנָיו אֶל־בֵּיתוֹ
  choice: అతని యజమాని ఇంటికి వచ్చే వరకు
  rationale: అక్షరార్థంగా ‘అతని యజమాని తన ఇంటికి వచ్చేవరకు’; తెలుగు సందర్భంలో యజమాని స్వగృహమే ఉద్దేశమని స్పష్టంగా ఉండటంతో సహజంగా ‘ఇంటికి’ అని అనువదించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. ‘వస్త్రం’ అనే విస్తృత పదాన్ని నిలిపి, మూలంలో లేని వివరణను చేర్చలేదు.
