  naturalness: The draft is clear modern Telugu. Replacing ఉంచుకుంది with ఉంచింది and using తన వద్ద gives a more direct, natural narrative rendering without adding nuance.
  terminology: వస్త్రం appropriately preserves the broad sense of בֶּגֶד. యజమాని is suitable for אָדוֹן in this narrative context. No theological terminology or footnotes are involved.
