source:
  edition: WLC
  text: וַ/יְהִי֙ כִּ/רְאוֹתָ֔/הּ כִּֽי עָזַ֥ב בִּגְד֖/וֹ בְּ/יָדָ֑/הּ וַ/יָּ֖נָס הַ/חֽוּצָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/013.yaml
  text: And it happened[a], when she saw that he had left his garment in her hand and had fled outside,
translation:
  language: te
  text: 'అతడు తన వస్త్రాన్ని[a] ఆమె చేతిలో విడిచిపెట్టి బయటికి పారిపోయాడని ఆమె చూసినప్పుడు, ఇలా జరిగింది:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘బట్టను’; హెబ్రీ పదం సాధారణమైనది, కాబట్టి దానిని మరింత నిర్దిష్టంగా ‘పైవస్త్రం’ అని అర్థం చేసుకోవలసిన అవసరం లేదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: ప్రత్యేక పదంగా అనువదించకుండా కాలసూచక ఉపవాక్య నిర్మాణంలో వ్యక్తీకరించబడింది
  rationale: ఇక్కడ וַיְהִי కథనాన్ని ముందుకు నడిపిస్తూ כִּרְאוֹתָהּ అనే కాలసూచక నిర్మాణాన్ని పరిచయం చేస్తుంది. తెలుగులో ‘ఇలా జరిగింది’ అని విడిగా చేర్చడం అసహజంగా ఉండి, తరువాతి వచనంలో పూర్తయ్యే వాక్య నిర్మాణాన్ని భారంగా చేస్తుంది.
- source_word: כִּרְאוֹתָהּ
  choice: ఆమె చూసినప్పుడు
  rationale: כְּ + ראה ధాతువు యొక్క infinitive construct, 3వ పురు. ఏక. స్త్రీ. ప్రత్యయంతో కలిసి ‘ఆమె చూసినప్పుడు’ అనే కాలార్థాన్ని ఇస్తుంది.
- source_word: כִּי
  choice: అని
  rationale: ఆమె గమనించిన విషయాన్ని తెలిపే ఉపవాక్యాన్ని సహజమైన తెలుగులో ‘అని’ అనుసంధానిస్తుంది.
- source_word: עָזַב
  choice: విడిచిపెట్టి
  rationale: ఈ సందర్భంలో క్రియకు ‘వదిలివేయడం’ అనే సాధారణ అర్థమే సరిపోతుంది; తదుపరి పారిపోవడం అనే చర్యతో సహజంగా అనుసంధానించేందుకు ‘విడిచిపెట్టి’ వాడబడింది.
- source_word: בִּגְדוֹ
  choice: తన వస్త్రాన్ని
  rationale: בגד అనేది నిర్దిష్టంగా పైవస్త్రం లేదా అంగీ అని చెప్పని సాధారణ వస్త్రపదం. తెలుగు ‘వస్త్రం’ ఆ విస్తృతిని నిలుపుతుంది; కర్తను స్పష్టంగా సూచించేందుకు ‘తన’ వాడబడింది.
- source_word: בְּיָדָהּ
  choice: ఆమె చేతిలో
  rationale: హెబ్రీలోని స్పష్టమైన, దృశ్యాత్మక భావాన్ని సహజ తెలుగు నుడికారంలో నేరుగా నిలుపుతుంది.
- source_word: וַיָּנָס
  choice: పారిపోయాడు
  rationale: נוס అత్యవసరంగా తప్పించుకొని పారిపోవడాన్ని సూచిస్తుంది; ‘పారిపోయాడు’ తెలుగు సందర్భంలో ఖచ్చితమైన, సహజమైన రూపం.
- source_word: הַחוּצָה
  choice: బయటికి
  rationale: దిశను సూచించే -ה అంత్యరూపాన్ని ‘బయటికి’ సహజంగా వ్యక్తీకరిస్తుంది.
