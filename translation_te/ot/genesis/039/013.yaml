translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన కథన శైలి వాడబడింది. మూలంలోని వాక్యం తరువాతి వచనంలో కొనసాగుతుంది కాబట్టి చివర కామా ఉంచబడింది. పాదసూచిక గుర్తు అది వివరిస్తున్న ‘వస్త్రాన్ని’ అనే పదం వద్ద ఉంచబడింది.
