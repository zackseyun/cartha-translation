source:
  edition: WLC
  text: וַ/יִּמְצָ֨א יוֹסֵ֥ף חֵ֛ן בְּ/עֵינָ֖י/ו וַ/יְשָׁ֣רֶת אֹת֑/וֹ וַ/יַּפְקִדֵ֨/הוּ֙ עַל בֵּית֔/וֹ וְ/כָל יֶשׁ ל֖/וֹ נָתַ֥ן בְּ/יָדֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/004.yaml
  text: And Joseph found favor in his eyes and served him[c][b][a], and he appointed him over his house and put all that he had into his hand.
translation:
  language: te
  text: యోసేపు అతని దృష్టిలో దయ పొంది, అతనికి సేవ చేశాడు. అతడు యోసేపును తన ఇంటి వ్యవహారాలపై అధికారిగా నియమించి, తనకు ఉన్నదంతా అతని చేతికి అప్పగించాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “అతని చేతిలో పెట్టాడు”; అంటే యోసేపు అధికారం లేదా సంరక్షణకు అప్పగించాడు.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּמְצָא ... חֵן בְּעֵינָיו
  choice: అతని దృష్టిలో అనుగ్రహం పొంది
  rationale: హీబ్రూ నుడికారమైన ‘అతని కళ్లలో అనుగ్రహం పొందాడు’ అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది; కథన సందర్భంలో ‘అనుగ్రహం’ ఆదరణను సూచిస్తుంది.
- source_word: וַיְשָׁרֶת אֹתוֹ
  choice: అతనికి సేవ చేశాడు
  rationale: యోసేపు పోతీఫరుకు వ్యక్తిగతంగా సేవ చేసిన భావాన్ని సూటిగా తెలియజేస్తుంది.
- source_word: וַיַּפְקִדֵהוּ עַל־בֵּיתוֹ
  choice: యోసేపును తన ఇంటి మీద అధికారిగా నియమించి
  rationale: פקד యొక్క పరిపాలనా నియామక భావాన్ని నిలుపుతుంది. తెలుగు సర్వనామాల వల్ల కలిగే అయోమయాన్ని నివారించేందుకు కర్మగా ‘యోసేపును’ స్పష్టంగా పేర్కొనబడింది; ‘ఇంటి’లో గృహవ్యవస్థ/ఇంటివారి విస్తృత భావం కూడా సందర్భానుసారంగా ఉంది.
- source_word: וְכָל־יֶשׁ־לוֹ
  choice: తనకు కలిగినదంతా
  rationale: పోతీఫరుకు చెందిన ఆస్తి, వ్యవహారాలన్నిటినీ సమగ్రంగా సూచించే సహజమైన తెలుగు రూపం.
- source_word: נָתַן בְּיָדוֹ
  choice: అతని చేతికి అప్పగించాడు
  rationale: ‘అతని చేతిలో ఉంచాడు’ అనే హీబ్రూ రూపకాన్ని కొంత నిలుపుతూ, అధికారం మరియు బాధ్యతకు అప్పగించిన భావాన్ని తెలుగులో స్పష్టంగా అందిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి. మూలంలోని వరుస సర్వనామాలు తెలుగులో అస్పష్టత కలిగించకుండా ‘యోసేపును’ ఒక్కసారి స్పష్టం చేయబడింది. హీబ్రూ ‘చేతి’ నుడికారాన్ని ప్రధాన పాఠ్యంలో సహజంగా నిలుపుతూ దాని భావాన్ని పాదటిప్పణిలో వివరించాం.
