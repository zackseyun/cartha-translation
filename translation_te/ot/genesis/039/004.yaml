review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys Joseph's finding favor, serving Potiphar, being appointed over the household, and receiving responsibility for all his master's possessions. The final idiom and its explanatory footnote are substantively faithful to Hebrew.
  naturalness: ‘తన ఇంటి మీద అధికారిగా’ is understandable but not idiomatic modern standard Telugu for administrative oversight of a household establishment. ‘తన ఇంటి వ్యవహారాలపై అధికారిగా’ is clearer and more natural. ‘దయ పొంది’ is a natural narrative equivalent for finding favor and avoids the potentially more theological coloring of ‘అనుగ్రహం’ in this social context.
  terminology: ‘దయ పొంది,’ ‘సేవ చేశాడు,’ ‘అధికారిగా నియమించి,’ and ‘అప్పగించాడు’ appropriately convey the narrative and administrative senses without importing theological interpretation. The footnote correctly explains the Hebrew hand idiom.
  issues:
  - severity: low
    issue: ‘అనుగ్రహం’ may carry an unnecessarily theological or elevated nuance here.
    rationale: חֵן in this narrative refers to Potiphar's favorable regard toward Joseph. ‘దయ’ is a conventional, natural Telugu expression in ‘దృష్టిలో దయ పొందడం’ and fits the immediate social setting.
  - severity: medium
    issue: ‘తన ఇంటి మీద అధికారిగా’ is awkward and may suggest authority over a physical building.
    rationale: בֵּיתוֹ denotes Potiphar's household establishment. Referring to ‘ఇంటి వ్యవహారాలు’ communicates the intended sphere of oversight naturally while retaining the broad household sense.
  revised_text: యోసేపు అతని దృష్టిలో దయ పొంది, అతనికి సేవ చేశాడు. అతడు యోసేపును తన ఇంటి వ్యవహారాలపై అధికారిగా నియమించి, తనకు ఉన్నదంతా అతని చేతికి అప్పగించాడు.[a]
  revised_footnotes:
  - marker: a
    text: అక్షరార్థంగా, “అతని చేతిలో పెట్టాడు”; అంటే యోసేపు అధికారం లేదా సంరక్షణకు అప్పగించాడు.
    reason: cultural_note
  revision_rationale: The revision retains every element of the Hebrew while using more natural modern Telugu. It renders the household-administration sense of ‘house’ clearly and keeps the ‘hand’ idiom in the main text, with its sense explained in the footnote.
