revisions:
- from: యోసేపు అతని దృష్టిలో అనుగ్రహం పొంది, అతనికి సేవ చేశాడు. అతడు యోసేపును తన ఇంటి మీద అధికారిగా నియమించి, తనకు కలిగినదంతా అతని చేతికి అప్పగించాడు.[a]
  to: యోసేపు అతని దృష్టిలో దయ పొంది, అతనికి సేవ చేశాడు. అతడు యోసేపును తన ఇంటి వ్యవహారాలపై అధికారిగా నియమించి, తనకు ఉన్నదంతా అతని చేతికి అప్పగించాడు.[a]
