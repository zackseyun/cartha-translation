source:
  edition: WLC
  text: וַ/יִּתֵּ֞ן שַׂ֤ר בֵּית הַ/סֹּ֨הַר֙ בְּ/יַד יוֹסֵ֔ף אֵ֚ת כָּל הָ֣/אֲסִירִ֔ם אֲשֶׁ֖ר בְּ/בֵ֣ית הַ/סֹּ֑הַר וְ/אֵ֨ת כָּל אֲשֶׁ֤ר עֹשִׂים֙ שָׁ֔ם ה֖וּא הָיָ֥ה עֹשֶֽׂה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/022.yaml
  text: And the chief of the prison put into Yosef’s hand all the prisoners who were in the prison[a], and whatever was done there[c][b], he was the one doing it.
translation:
  language: te
  text: చెరసాల అధికారి చెరసాలలో ఉన్న ఖైదీలందరినీ యోసేపు చేతికి అప్పగించాడు[a]. అక్కడ జరిగే ప్రతిదాన్నీ యోసేపే చేసేవాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “యోసేపు చేతిలో పెట్టాడు”; అంటే వారిపై బాధ్యతను, అధికారాన్ని అతనికి అప్పగించాడు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “అక్కడ జరిగే ప్రతిదాన్నీ యోసేపే నిర్వహించేవాడు.” హీబ్రూలో యోసేపు క్రియాశీల బాధ్యతను ఉద్ఘాటిస్తుంది; అతడు పనులను స్వయంగా చేసేవాడని లేదా వాటి నిర్వహణ బాధ్యతను చేపట్టేవాడని సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: שַׂר בֵּית הַסֹּהַר
  choice: చెరసాల అధికారి
  rationale: שַׂר ఇక్కడ చెరసాల బాధ్యత వహించే అధికారిని సూచిస్తుంది. ఆధునిక తెలుగులో ‘చెరసాల అధికారి’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: בְּיַד יוֹסֵף
  choice: యోసేపు చేతికి అప్పగించాడు
  rationale: ‘చేతిలో పెట్టడం’ అనే హీబ్రూ నుడికారం నియంత్రణకు, బాధ్యతకు అప్పగించడాన్ని సూచిస్తుంది; తెలుగులో ‘చేతికి అప్పగించాడు’ ఆ రూపకాన్ని, భావాన్ని రెండింటినీ నిలుపుతుంది.
- source_word: יוֹסֵף
  choice: యోసేపు
  rationale: మూల హీబ్రూ పేరుకు అనుగుణమైన, తెలుగులో స్థిరపడిన లిప్యంతరీకరణ.
- source_word: כָּל הָאֲסִירִם
  choice: ఖైదీలందరినీ
  rationale: చెరసాల సందర్భంలో אֲסִירִיםకు ‘ఖైదీలు’ స్పష్టమైన ఆధునిక తెలుగు పదం.
- source_word: אֲשֶׁר בְּבֵית הַסֹּהַר
  choice: చెరసాలలో ఉన్న
  rationale: సంబంధ వాక్యభాగాన్ని సహజమైన తెలుగు విశేషణ నిర్మాణంగా అందిస్తుంది.
- source_word: וְאֵת כָּל אֲשֶׁר עֹשִׂים שָׁם
  choice: అక్కడ జరిగే ప్రతి పనినీ
  rationale: עֹשִׂים అనిర్దిష్ట బహువచన కర్తతో ‘అక్కడ వారు చేసే సమస్తం’ అని అర్థమవుతుంది. కర్తను అనవసరంగా నిర్దిష్టం చేయకుండా తెలుగులో సహజంగా ‘జరిగే ప్రతి పని’గా ఇచ్చింది.
- source_word: הוּא הָיָה עֹשֶׂה
  choice: యోసేపే నిర్వహించేవాడు
  rationale: הוּא యొక్క ఉద్ఘాటనను ‘యోసేపే’ నిలుపుతుంది; היה + కృదంతం తెలిపే కొనసాగుతున్న లేదా అలవాటైన బాధ్యతను ‘నిర్వహించేవాడు’ సహజంగా వ్యక్తం చేస్తుంది. సందర్భంలో ఇది ప్రతి పనిని స్వయంగా చేయడమే కాక దాని నిర్వహణ బాధ్యతను కూడా సూచించవచ్చు.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. హీబ్రూ ‘చేతి’ నుడికారాన్ని సహజమైన తెలుగు రూపంలో నిలిపి, చివరి క్రియలోని ఉద్ఘాటన మరియు కొనసాగుతున్న బాధ్యత రెండింటినీ కాపాడింది.
