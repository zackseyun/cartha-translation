source:
  edition: WLC
  text: וַ/יְהִ֡י מֵ/אָז֩ הִפְקִ֨יד אֹת֜/וֹ בְּ/בֵית֗/וֹ וְ/עַל֙ כָּל אֲשֶׁ֣ר יֶשׁ ל֔/וֹ וַ/יְבָ֧רֶךְ יְהוָ֛ה אֶת בֵּ֥ית הַ/מִּצְרִ֖י בִּ/גְלַ֣ל יוֹסֵ֑ף וַ/יְהִ֞י בִּרְכַּ֤ת יְהוָה֙ בְּ/כָל אֲשֶׁ֣ר יֶשׁ ל֔/וֹ בַּ/בַּ֖יִת וּ/בַ/שָּׂדֶֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/005.yaml
  text: And from the time he appointed him over his house and over all that he had[a], Yahweh blessed the Egyptian’s house because of Joseph, and Yahweh’s blessing was on all that he had[b], in the house and in the field.
translation:
  language: te
  text: అతడు యోసేపును తన ఇంటికీ తనకు ఉన్నదంతటికీ బాధ్యునిగా నియమించినప్పటి నుండి[a], యహ్వే యోసేపు కారణంగా ఆ ఐగుప్తీయుని ఇంటిని ఆశీర్వదించాడు. ఇంటిలోను పొలంలోను అతనికి ఉన్నదంతటిమీద యహ్వే ఆశీర్వాదం ఉండేది[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అప్పటి నుండి, అతడు యోసేపును తన ఇంటికీ తనకు ఉన్నదంతటికీ బాధ్యునిగా ఉంచినప్పుడు.”
    reason: מֵאָז మరియు הִפְקִיד కలయికను కాలారంభంగా లేదా ‘అప్పటి నుండి, ఎప్పుడైతే’ అనే ఉపవాక్యంగా వ్యక్తం చేయవచ్చు.
  - marker: b
    text: లేదా, “అతనికి ఉన్నదంతటిలో—ఇంటిలోను పొలంలోను—యహ్వే ఆశీర్వాదం ఉండేది.”
    reason: బְּ అనే ఉపసర్గను ‘మీద’ లేదా ఆశీర్వాదం ఉన్న/ప్రభావించిన పరిధిని సూచించే ‘లో’ అని అర్థం చేసుకోవచ్చు; చివరి పదబంధం ఆ సమస్త పరిధిని వివరిస్తుంది.
lexical_decisions:
- source_word: מֵאָז
  choice: నియమించినప్పటి నుండి
  rationale: ఈ పదం ఒక నిర్దిష్ట సమయం మొదలుకొని తరువాతి పరిస్థితి కొనసాగిందని సూచిస్తుంది; తెలుగు వాక్యనిర్మాణంలో ‘అప్పటి నుండి’ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: הִפְקִיד
  choice: అధికారిగా నియమించాడు
  rationale: హిఫిల్ రూపం ఇక్కడ పర్యవేక్షణ, నిర్వహణ బాధ్యత అప్పగించడాన్ని సూచిస్తుంది. ‘అధికారిగా నియమించాడు’ అధికార పరిధిని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: בְּבֵיתוֹ וְעַל כָּל אֲשֶׁר יֶשׁ־לוֹ
  choice: తన ఇంటిమీద, తనకు ఉన్నదంతటిమీద
  rationale: ఇవి కేవలం స్థలాన్ని కాక యోసేపుకు అప్పగించిన పరిపాలనా పరిధిని సూచిస్తున్నాయి; ‘మీద’ ఆ అధికార భావాన్ని నిలుపుతుంది.
- source_word: וַיְבָרֶךְ
  choice: ఆశీర్వదించాడు
  rationale: ברך అనే సాధారణ ‘ఆశీర్వదించు’ అర్థాన్ని నిలిపి, దాని ఫలితాన్ని కేవలం భౌతిక సమృద్ధిగా కుదించలేదు.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవ నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పండిత లిప్యంతరీకరణకు అనుగుణంగా తెలుగులో ఇచ్చింది.
- source_word: בֵּית הַמִּצְרִי
  choice: ఆ ఐగుప్తీయుని ఇల్లు
  rationale: సందర్భంలోని పోతీఫరు గృహాన్ని సూచించే నిర్మాణాన్ని సహజమైన తెలుగు స్వామ్య రూపంలో వ్యక్తం చేసింది.
- source_word: בִּגְלַל יוֹסֵף
  choice: యోసేపును బట్టి
  rationale: בגלל తెలిపే కారణ సంబంధాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בִּרְכַּת יְהוָה
  choice: యహ్వే ఆశీర్వాదం
  rationale: ఆశీర్వాదానికి మూలం యహ్వే అని నిర్మాణం నేరుగా తెలియజేస్తుంది.
- source_word: בְּכָל אֲשֶׁר יֶשׁ־לוֹ
  choice: అతనికి ఉన్నదంతటిమీద
  rationale: ఆశీర్వాదం అతని ఆస్తి, వ్యవహారాల సమస్త పరిధిపై ఉందనే భావాన్ని నిలుపుతుంది.
- source_word: בַּבַּיִת וּבַשָּׂדֶה
  choice: ఇంటిలోను పొలంలోను
  rationale: గృహ, వ్యవసాయ రంగాలన్నిటినీ కలిపి సూచించే మూలంలోని స్పష్టమైన చిత్రణను యథాతథంగా ఉంచుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవ నామం అనువాదం
  choice: యహ్వే
  alternative: యెహోవా లేదా ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవ నామం నేరుగా ఉంది. దానిని బిరుదుగా మార్చకుండా ‘యహ్వే’గా లిప్యంతరీకరించడం మూలంలోని ప్రత్యేకతను కాపాడుతుంది.
- issue: ఆశీర్వాదానికి కారణ సంబంధం
  choice: యోసేపును బట్టి
  alternative: యోసేపు నిమిత్తం
  rationale: వాక్యం ఐగుప్తీయుని ఇంటికి కలిగిన ఆశీర్వాదాన్ని యోసేపు అక్కడ ఉండటంతో అనుసంధానిస్తుంది; దీనికి మించి ఏ ప్రత్యేక సిద్ధాంతపరమైన వివరణను చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘ఇంటిమీద ... అధికారిగా’ అనే ప్రయోగం పరిపాలనా బాధ్యతను స్పష్టం చేస్తుంది; ‘ఇంటిలోను పొలంలోను’ మూలంలోని సమగ్ర జంటను నిలుపుతుంది.
