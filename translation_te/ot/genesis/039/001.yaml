  rationale: 'మూలంలోని ముందస్తు నిష్క్రియ చర్యను ‘ఇప్పటికే’ ద్వారా స్పష్టం చేశాం; కొనుగోలు సందర్భంలో ‘ఇష్మాయేలీయుల నుండి’ అనే సహజమైన, నేరుగా సరిపోలే రూపాన్ని వాడాం; పోతీఫరు పదవులు మరియు జాతీయతను ఆధునిక తెలుగులో సులభంగా చదవగల క్రమంలో పెట్టాం. అయితే పాదసూచిక గుర్తులు తిరిగి సరైన పదాల వద్ద ఉండాలి: సְרִיסను వివరిస్తున్న [a] ‘అధికారి’ వెంట, మరియు ‘ఐగుప్తీయుడు’ వెంట [b] ఉండాలి. కాబట్టి పూర్తి ప్రచురణ పాఠ్యం ఇలా ఉండాలి: “యోసేపు ఇప్పటికే ఐగుప్తుకు తీసుకువెళ్లబడ్డాడు. ఫరోకు అధికారి[a], అంగరక్షక దళాధిపతి అయిన ఐగుప్తీయుడు[b] పోతీఫరు, అతణ్ణి అక్కడికి తీసుకువెళ్లిన ఇష్మాయేలీయుల నుండి కొనుక్కున్నాడు.”'
