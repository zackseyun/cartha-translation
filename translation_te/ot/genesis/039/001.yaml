source:
  edition: WLC
  text: וְ/יוֹסֵ֖ף הוּרַ֣ד מִצְרָ֑יְמָ/ה וַ/יִּקְנֵ֡/הוּ פּוֹטִיפַר֩ סְרִ֨יס פַּרְעֹ֜ה שַׂ֤ר הַ/טַּבָּחִים֙ אִ֣ישׁ מִצְרִ֔י מִ/יַּד֙ הַ/יִּשְׁמְעֵאלִ֔ים אֲשֶׁ֥ר הוֹרִדֻ֖/הוּ שָֽׁמָּ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/001.yaml
  text: Joseph had been brought down to Egypt[a], and Potiphar, an officer of Pharaoh, the captain of the guard, an Egyptian[b], bought him from the Ishmaelites who had brought him down there.
translation:
  language: te
  text: యోసేపు ఇప్పటికే ఐగుప్తుకు తీసుకువెళ్లబడ్డాడు. ఫరోకు అధికారిగా ఉన్న, అంగరక్షక దళాధిపతి అయిన ఐగుప్తీయుడు పోతీఫరు[a], అతణ్ణి అక్కడికి తీసుకువెళ్లిన ఇష్మాయేలీయుల నుండి కొనుక్కున్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘అధికారి’ అని అనువదించిన హెబ్రీ పదానికి ‘నపుంసకుడు’ అనే అర్థం కూడా ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוּרַד
  choice: తీసుకువెళ్లబడ్డాడు
  rationale: హొఫాల్ రూపంలోని నిష్క్రియార్థాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది. హెబ్రీలోని ‘కిందికి’ అనే భౌగోళిక ప్రయోగాన్ని తెలుగులో కృత్రిమంగా చేర్చకుండా, బలవంతంగా ఐగుప్తుకు తీసుకువెళ్లబడిన భావాన్ని నిలుపుతుంది.
- source_word: מִצְרָיְמָה
  choice: ఐగుప్తుకు
  rationale: దిశను సూచించే హెబ్రీ ప్రత్యయాన్ని గమ్యస్థానార్థకమైన ‘-కు’ సహజంగా తెలియజేస్తుంది.
- source_word: וַיִּקְנֵהוּ
  choice: అతణ్ణి ... కొనుక్కున్నాడు
  rationale: బానిస వ్యాపార సందర్భంలో קנה అనే పదానికి ‘కొను’ అనే ప్రత్యక్ష లావాదేవీ అర్థమే సరైనది.
- source_word: סְרִיס פַּרְעֹה
  choice: ఫరో అధికారి
  rationale: סְרִיס రాజసభ అధికారిని లేదా నపుంసకుణ్ణి సూచించవచ్చు. సందర్భంలో విస్తృతమైన పరిపాలనా అర్థాన్ని ప్రధాన పాఠ్యంలో ఉంచి, మరో సాధ్యార్థాన్ని పాదసూచికలో నిలిపాం.
- source_word: שַׂר הַטַּבָּחִים
  choice: అంగరక్షక దళాధిపతి
  rationale: రాజ అంగరక్షకులు లేదా శిక్ష అమలుదారుల అధిపతి అనే పదవిని, అతిగా నిర్దిష్టం చేయకుండా తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: אִישׁ מִצְרִי
  choice: ఐగుప్తీయుడు
  rationale: వ్యక్తి పురుషుడని సందర్భం ఇప్పటికే స్పష్టం చేస్తున్నందున, సహజమైన తెలుగులో జాతీయ గుర్తింపును సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: מִיַּד הַיִּשְׁמְעֵאלִים
  choice: ఇష్మాయేలీయుల దగ్గర
  rationale: ‘చేతిలోనుండి’ అనే హెబ్రీ నుడికారాన్ని కొనుగోలు సందర్భానికి సహజమైన తెలుగు రూపంలో అందిస్తుంది.
- source_word: אֲשֶׁר הוֹרִדֻהוּ שָׁמָּה
  choice: అతణ్ణి అక్కడికి తీసుకువెళ్లిన
  rationale: సంబంధవాక్యం ఇష్మాయేలీయులను సూచిస్తుందని స్పష్టంగా ఉంచి, שָׁמָּה లోని ‘అక్కడికి’ అనే భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: పోతీఫరు పదవిలో סְרִיס పదార్థం
  choice: ప్రధాన పాఠ్యంలో ‘ఫరో అధికారి’
  alternative: ‘ఫరో నపుంసకుడు’ లేదా ‘ఫరో ఆస్థానంలోని నపుంసక అధికారి’
  rationale: ఈ హెబ్రీ పదం శారీరక స్థితిని సూచించగలిగినప్పటికీ రాజసభ అధికారికి పదవినామంగానూ వాడబడుతుంది. కథనం శారీరక అర్థాన్ని తప్పనిసరి చేయదు; అందువల్ల తటస్థమైన పదవార్థాన్ని పాఠ్యంలో ఉంచి అసలైన సందిగ్ధతను పాదసూచికలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే కథనశైలి. హెబ్రీ వాక్యంలోని దీర్ఘ అన్వయాన్ని తెలుగులో స్పష్టత కోసం రెండు వాక్యాలుగా విభజించాం. [a], [b] గుర్తులను అవి వివరిస్తున్న పదాల వెంటనే ఉంచాం.
