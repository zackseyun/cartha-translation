  text: Then she spoke to him with words like these[a], saying, “The Hebrew servant whom you brought to us came to me to mock me.”
translation:
  language: te
  text: 'అప్పుడు ఆమె అతనితో ఇలాంటి మాటలు చెబుతూ ఇలా అంది: “నువ్వు మన దగ్గరికి తీసుకొచ్చిన ఆ హెబ్రీ దాసుడు నన్ను ఎగతాళి చేయడానికి[a] నా దగ్గరికి వచ్చాడు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నాతో చెలగాటమాడడానికి”; సందర్భాన్ని బట్టి ఇందులో లైంగికంగా వేధించడం లేదా దుర్వినియోగం చేయడం అనే సూచన ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּדַבֵּר אֵלָיו
  choice: అప్పుడు ఆమె అతనితో ... చెప్పింది
  rationale: వయ్యిక్తోల్ కథనాన్ని ముందుకు నడిపిస్తుంది. హీబ్రూలో ఉన్న సర్వనామాన్ని పేరుతో భర్తీ చేయకుండా ‘అతనితో’గా ఉంచాం.
- source_word: כַּדְּבָרִים הָאֵלֶּה לֵאמֹר
  choice: ఇలాంటి మాటలే చెప్పింది
  rationale: నివేదికలోని మాటలను పరిచయం చేసే హీబ్రూ ప్రయోగాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తూ, כ యొక్క పోలిక భావాన్ని ‘ఇలాంటి’ ద్వారా నిలిపాం.
- source_word: הָעֶבֶד הָעִבְרִי
  choice: ఆ హెబ్రీ దాసుడు
  rationale: עבד ఇక్కడ బంధిత గృహదాసుని సామాజిక స్థితిని సూచిస్తుంది; అందువల్ల మృదువైన ‘సేవకుడు’కన్నా ‘దాసుడు’ మూలార్థానికి దగ్గరగా ఉంది. הָעִבְרִי జాతి గుర్తింపుగా ‘హెబ్రీ’ అని అనువదించాం.
- source_word: אֲשֶׁר הֵבֵאתָ לָּנוּ
  choice: నువ్వు మన దగ్గరికి తీసుకొచ్చిన
  rationale: భర్తను నిందించే ధోరణినీ, మొదటి పురుష బహువచనాన్నీ నిలిపాం. ‘మన’ అనేది సంబోధితుడైన భర్తను కూడా సహజంగా చేర్చుతుంది.
- source_word: בָּא אֵלַי
  choice: నా దగ్గరికి వచ్చాడు
  rationale: בוא + אל ఆమెవైపు రావడాన్ని సూచిస్తుంది. మూలంలో లేనంత బలమైన లైంగిక సభ్యోక్తిని ప్రధాన పాఠ్యంలో చేర్చలేదు.
- source_word: לְצַחֶק בִּי
  choice: నన్ను ఆటపట్టించడానికి
  rationale: צחק యొక్క ఎగతాళి చేయడం లేదా ఆటగా చూడడం అనే భావాన్ని సహజంగా అందిస్తుంది; సందర్భంలో ఉండగల లైంగిక లేదా దుర్వినియోగ సూచనను పాదటిప్పణిలో ఉంచాం.
