  yaml_path: translation/ot/genesis/039/018.yaml
  text: And when I raised my voice and cried out[a], he left his garment beside me and fled outside.
translation:
  language: te
  text: నేను నా స్వరం ఎత్తి కేక వేసినప్పుడు, అతడు తన వస్త్రాన్ని[a] నా పక్కన విడిచిపెట్టి బయటికి పారిపోయాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘తన పైవస్త్రాన్ని.’ హీబ్రూ పదమైన בֶּגֶד సాధారణంగా వస్త్రాన్ని సూచిస్తుంది; అది ఏ రకమైన దుస్తు అని నిర్దిష్టంగా చెప్పదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּהֲרִימִי
  choice: నేను … ఎత్తి … వేసినప్పుడు
  rationale: וַיְהִי ఇక్కడ తరువాతి చర్యకు కాలసంబంధ ఉపవాక్యాన్ని పరిచయం చేస్తుంది; כַּהֲרִימִי అంటే ‘నేను ఎత్తినప్పుడు.’ సహజమైన తెలుగు వాక్యనిర్మాణంలో వీటిని కలిపి అనువదించాం.
- source_word: קוֹלִי וָאֶקְרָא
  choice: నా స్వరం ఎత్తి కేక వేసినప్పుడు
  rationale: קוֹלִי అంటే ‘నా స్వరం’; קרא ఇక్కడ అపాయం తెలియజేస్తూ గట్టిగా పిలవడం లేదా కేక వేయడం అనే భావం ఇస్తుంది. ‘కేక వేశాను’ సందర్భంలోని అత్యవసరతను సహజంగా తెలియజేస్తుంది.
- source_word: וַיַּעֲזֹב
  choice: విడిచిపెట్టి
  rationale: עזב ఇక్కడ వస్త్రాన్ని అక్కడే వదిలేయడాన్ని సూచిస్తుంది. తరువాతి ‘పారిపోయాడు’తో చర్యల వరుసను సహజంగా కలపడానికి ‘విడిచిపెట్టి’ ఎంచుకున్నాం.
- source_word: בִּגְדוֹ
  choice: తన వస్త్రాన్ని
  rationale: בֶּגֶד ఒక సాధారణ వస్త్రపదం; నిర్దిష్టంగా అంగీ, పైవస్త్రం లేదా మరో రకమైన దుస్తు అని చెప్పదు. అందువల్ల విస్తృతార్థకమైన ‘వస్త్రం’ వాడాం.
- source_word: אֶצְלִי
  choice: నా పక్కనే
  rationale: אצל సమీపాన్ని సూచిస్తుంది. ‘నా పక్కనే’ స్థలసంబంధ భావాన్ని స్పష్టంగా ఉంచుతుంది; కేవలం స్వాధీనంలో ఉందనే భావానికి పరిమితం చేయదు.
- source_word: וַיָּנָס הַחוּצָה
  choice: బయటికి పారిపోయాడు
  rationale: נוס అంటే పారిపోవడం; הַחוּצָה లోని దిశార్థక రూపం బయటివైపు కదలికను సూచిస్తుంది. ‘బయటికి పారిపోయాడు’ రెండింటినీ సహజంగా ప్రతిబింబిస్తుంది.
