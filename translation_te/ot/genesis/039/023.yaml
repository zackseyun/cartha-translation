source:
  edition: WLC
  text: אֵ֣ין שַׂ֣ר בֵּית הַ/סֹּ֗הַר רֹאֶ֤ה אֶֽת כָּל מְא֨וּמָה֙ בְּ/יָד֔/וֹ בַּ/אֲשֶׁ֥ר יְהוָ֖ה אִתּ֑/וֹ וַֽ/אֲשֶׁר ה֥וּא עֹשֶׂ֖ה יְהוָ֥ה מַצְלִֽיחַ׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/023.yaml
  text: The chief of the prison paid attention to nothing that was in his hand[a], because Yahweh was with him; and whatever he did[c][b], Yahweh made prosper.
translation:
  language: te
  text: చెరసాల అధికారి యోసేపు చేతిలో ఉన్న దేనినీ పట్టించుకోలేదు[a], ఎందుకంటే యాహ్వే అతనితో ఉన్నాడు; యోసేపు చేసిన ప్రతి పనిని యాహ్వే సఫలపరిచాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘అతని చేతిలో ఉన్న దేనినీ చూడలేదు’; అంటే యోసేపు బాధ్యతకు అప్పగించిన దేని గురించీ అధికారి స్వయంగా పర్యవేక్షించలేదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘యోసేపు చేసిన ప్రతిదానిని యాహ్వే విజయవంతం చేశాడు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׂר בֵּית הַסֹּהַר
  choice: చెరసాల అధికారి
  rationale: שַׂר పరిపాలనా అధికారిని సూచిస్తుంది; ‘చెరసాల అధికారి’ ఆధునిక తెలుగులో సహజంగా ఉండి ఆ భావాన్ని నిలుపుతుంది.
- source_word: אֵין ... רֹאֶה אֶת כָּל מְאוּמָה
  choice: దేనినీ ... పట్టించుకోలేదు
  rationale: అక్షరార్థంగా ‘ఏదీ చూడలేదు’; సందర్భంలో యోసేపుకు అప్పగించిన విషయాలను తనిఖీ చేయడం లేదా వాటి గురించి చింతించడం లేదనే కార్యార్థం ఉంది.
- source_word: בְּיָדוֹ
  choice: అతని చేతిలో ఉన్న
  rationale: యోసేపు నియంత్రణకు లేదా బాధ్యతకు అప్పగించబడినదాన్ని సూచించే హీబ్రూ రూపకాన్ని ప్రధాన పాఠ్యంలో నిలుపుతుంది.
- source_word: בַּאֲשֶׁר יְהוָה אִתּוֹ
  choice: యెహోవా యోసేపుతో ఉన్నాడు కాబట్టి
  rationale: בַּאֲשֶׁר ఇక్కడ కారణార్థకంగా ఉంది. హీబ్రూలో సర్వనామం ఉన్నప్పటికీ, తెలుగులో సూచన స్పష్టంగా ఉండేందుకు ‘యోసేపు’ అని పేర్కొనబడింది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన టెట్రాగ్రామటన్‌ను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో స్థిరపడిన వ్యక్తినామ రూపం ‘యెహోవా’గా లిప్యంతరీకరించబడింది.
- source_word: וַאֲשֶׁר הוּא עֹשֶׂה
  choice: అతడు ఏమి చేసినా
  rationale: యోసేపు చేసే ప్రతి పనినీ సమగ్రంగా సూచించే సహజమైన తెలుగు సంబంధ వాక్య నిర్మాణం.
- source_word: מַצְלִיחַ
  choice: దాన్ని సఫలం చేశాడు
  rationale: హిఫీల్ క్రియలోని కారణార్థాన్ని—యెహోవా విజయవంతం చేశాడనే భావాన్ని—స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: יְהוָה దైవనామ అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దాన్ని ‘ప్రభువు’ అనే బిరుదుతో మార్చకుండా ఉంచుతూ, సాధారణ తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం; మూల ఉచ్చారణను మరింత సమీపంగా ప్రతిబింబించే ‘యాహ్వే’ కూడా సాధ్యమైన రూపం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభమైన శైలి. ‘అతని చేతిలో’ అనే హీబ్రూ రూపకాన్ని పాఠ్యంలో నిలిపి, దాని కార్యార్థాన్ని పాదసూచికలో వివరించాం. సర్వనామ సందిగ్ధత నివారించేందుకు మొదటి భాగంలో ‘యోసేపు’ అని స్పష్టం చేశాం.
