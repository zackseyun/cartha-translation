base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/008.yaml
  text: But he refused and said to his master's wife[a], "Look, my master does not concern himself with what is in the house[c][b], and everything that belongs to him he has put into my hand."
translation:
  language: te
  text: 'అతడు మాత్రం నిరాకరించి, తన యజమాని భార్యతో ఇలా అన్నాడు: “చూడండి, ఇంట్లోని విషయాల గురించి నా యజమాని ఏమాత్రం పట్టించుకోడు[a]. తనకు ఉన్నదంతా నా చేతికి అప్పగించాడు[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “ఇంట్లో ఏముందో నాతో తెలియదు.” ఇది ఇంటి విషయాలను యోసేపు పర్యవేక్షణకు వదిలి, యజమాని వాటి గురించి పట్టించుకోడని సూచించే ప్రయోగం.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా, “నా చేతిలో పెట్టాడు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמָאֵן
  choice: అతడు మాత్రం నిరాకరించి
  rationale: మునుపటి వచనంలోని ప్రతిపాదనకు యోసేపు చూపిన వ్యతిరేక స్పందనను ‘మాత్రం’ తెలియజేస్తుంది; క్రియ యొక్క ‘నిరాకరించు/ఒప్పుకోకపోవు’ అర్థాన్ని ‘నిరాకరించి’ నేరుగా అందిస్తుంది.
- source_word: וַיֹּאמֶר אֶל־אֵשֶׁת אֲדֹנָיו
  choice: తన యజమాని భార్యతో ఇలా అన్నాడు
  rationale: హీబ్రూ సంబంధ నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: הֵן
  choice: చూడండి
  rationale: తర్వాత చెప్పబోయే విషయంపై శ్రద్ధ నిలిపే సంభాషణాత్మక అవ్యయాన్ని గౌరవపూర్వకమైన సహజ తెలుగు రూపంలో అందిస్తుంది.
- source_word: אֲדֹנִי
  choice: నా యజమాని
  rationale: ఇంటి పరిపాలన సందర్భంలో యోసేపుకు పోతీఫరుతో ఉన్న సామాజిక సంబంధాన్ని ‘యజమాని’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: לֹא יָדַע אִתִּי מַה בַּבָּיִת
  choice: ఇంట్లోని విషయాల గురించి నా యజమాని నన్నేమీ అడగడు
  rationale: అక్షరార్థంగా అస్పష్టంగా ఉండే ‘నాతో తెలుసుకోడు’ అనే హీబ్రూ ప్రయోగాన్ని, ఇంటి వ్యవహారాలను యోసేపు పర్యవేక్షణకు వదిలి యజమాని వాటి గురించి విచారించడు అనే సందర్భార్థంతో సహజంగా అందిస్తుంది; అక్షరరూపాన్ని పాదటిప్పణిలో ఉంచింది.
- source_word: וְכֹל אֲשֶׁר יֶשׁ־לוֹ
  choice: తనకు ఉన్నదంతా
  rationale: యజమాని ఆస్తి, గృహసంబంధ వనరుల సమగ్రతను సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: נָתַן בְּיָדִי
  choice: నా చేతికి అప్పగించాడు
  rationale: ‘నా చేతిలో పెట్టాడు’ అనే మూలభాషా రూపకాన్ని తెలుగు వాడుకలో సహజమైన ‘నా చేతికి’ ద్వారా కొంత నిలుపుతూ, అప్పగింత మరియు అధికార భావాన్ని స్పష్టం చేస్తుంది.
