translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన కానీ సాధారణ పాఠకులకు సులభమైన సంభాషణ శైలి. ‘చూడండి’ ద్వారా యోసేపు యజమాని భార్యను సంబోధించే మర్యాద నిలుపబడింది. మూలంలోని క్లిష్టమైన לֹא יָדַע אִתִּי ప్రయోగాన్ని ప్రధాన పాఠ్యంలో సహజంగా ఇచ్చి, దాని అక్షరరూపం మరియు భావాన్ని పాదటిప్పణిలో వెల్లడించాం.
