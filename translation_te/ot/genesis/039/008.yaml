  to: 'అతడు మాత్రం నిరాకరించి, తన యజమాని భార్యతో ఇలా అన్నాడు: “చూడండి, ఇంట్లోని విషయాల గురించి నా యజమాని ఏమాత్రం పట్టించుకోడు[a]. తనకు ఉన్నదంతా నా చేతికి అప్పగించాడు[b].”'
