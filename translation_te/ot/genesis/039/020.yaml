source:
  edition: WLC
  text: וַ/יִּקַּח֩ אֲדֹנֵ֨י יוֹסֵ֜ף אֹת֗/וֹ וַֽ/יִּתְּנֵ֨/הוּ֙ אֶל בֵּ֣ית הַ/סֹּ֔הַר מְק֕וֹם אֲשֶׁר אסורי הַ/מֶּ֖לֶךְ אֲסוּרִ֑ים וַֽ/יְהִי שָׁ֖ם בְּ/בֵ֥ית הַ/סֹּֽהַר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/020.yaml
  text: So Joseph’s master took him and put him into the prison[a], the place where the king’s prisoners were confined[b]. And he was there in the prison.
translation:
  language: te
  text: అప్పుడు యోసేపు యజమాని అతన్ని తీసుకొని చెరసాలలో ఉంచాడు[a]—అది రాజు ఖైదీలు బంధించబడే స్థలం[b]. అతడు అక్కడ చెరసాలలో ఉన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రూలో అక్షరార్థంగా, “సోహర్ గృహం.” “సోహర్” అనేది చెరసాల లేదా నిర్బంధ గృహాన్ని సూచించే, బహుశా ఐగుప్తీయ మూలంగల పదం.
    reason: cultural_note
  - marker: b
    text: హెబ్రూలో “బంధించు” అనే ఒకే మూలపదం రెండుసార్లు వస్తుంది; అక్షరార్థంగా, “రాజు బంధితులు బంధించబడే స్థలం.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנֵי יוֹסֵף
  choice: యోసేపు యజమాని
  rationale: ఈ సందర్భంలో אֲדֹנֵי అనేది యోసేపుపై అధికారం కలిగిన మానవ యజమానిని సూచిస్తుంది; దైవ బిరుదును కాదు. ‘యజమాని’ ఆధునిక తెలుగులో సహజంగా ఉండి కథా సందర్భానికి సరిపోతుంది.
- source_word: וַיִּקַּח
  choice: తీసుకొని
  rationale: לקח యొక్క సాధారణ అర్థం ‘తీసుకోవడం.’ మూలంలో ప్రత్యేక బలప్రయోగ సూచన లేనందున ‘పట్టుకొని’ లేదా ‘బలవంతంగా లాక్కొని’ అని తీవ్రత పెంచలేదు.
- source_word: וַיִּתְּנֵהוּ אֶל
  choice: చెరసాలలో ఉంచాడు
  rationale: נתן + אֶל ఇక్కడ ఒక వ్యక్తిని నిర్దిష్ట స్థలంలో ఉంచడాన్ని సూచిస్తుంది. తెలుగు వాక్యనిర్మాణంలో ‘చెరసాలలో ఉంచాడు’ సహజంగా గమ్యస్థానాన్నీ నిర్బంధాన్నీ తెలియజేస్తుంది.
- source_word: בֵּית הַסֹּהַר
  choice: చెరసాల
  rationale: ఈ పదబంధం నిర్బంధ స్థలాన్ని సూచిస్తుంది. అక్షరరూపాన్ని అనువదిస్తే అపారదర్శకంగా ఉండేందున, సాధారణ పాఠకునికి స్పష్టమైన ‘చెరసాల’ను ఉపయోగించి మూలపద వివరాన్ని పాదటిప్పణిలో ఇచ్చాం.
- source_word: מְקוֹם אֲשֶׁר
  choice: అది … స్థలం
  rationale: హెబ్రూలో చెరసాలను ‘ఎక్కడైతే…’ అనే వివరణాత్మక అనుబంధంతో స్పష్టీకరిస్తుంది. తెలుగులో ‘అది … స్థలం’ అని ఇవ్వడం ఆ నిర్మాణాన్ని సహజంగా నిలుపుతుంది.
- source_word: אֲסוּרֵי הַמֶּלֶךְ אֲסוּרִים
  choice: రాజు ఖైదీలు బంధించబడే
  rationale: אסר మూలం నామవాచక భావంలోనూ క్రియాభావంలోనూ పునరావృతమవుతుంది. ప్రధాన వాక్యంలో సహజమైన తెలుగు వాడుతూ భావాన్ని అందించి, మూలంలోని పదపునరుక్తిని పాదటిప్పణిలో తెలియజేశాం.
- source_word: וַיְהִי שָׁם
  choice: అతడు అక్కడ … ఉన్నాడు
  rationale: היה + שָׁם యోసేపు ఆ ప్రదేశంలో ఉన్నాడని సాధారణంగా చెబుతుంది. ‘ఉండిపోయాడు’ అనే అనువాదం మూలంలో స్పష్టంగా లేని కాలవ్యాప్తిని చేర్చవచ్చు కాబట్టి ‘ఉన్నాడు’ను ఎంచుకున్నాం.
- source_word: בְּבֵית הַסֹּהַר
  choice: చెరసాలలో
  rationale: మూలం చివర నిర్బంధ స్థలాన్ని మళ్లీ పేర్కొంటుంది. ఆ ఉద్దేశపూర్వక పునరుక్తిని తొలగించకుండా తెలుగులోనూ నిలిపాం.
