translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘యోసేపు’ అనే స్థిరపడిన తెలుగు నామరూపం, ‘చెరసాల’ అనే సాధారణంగా అర్థమయ్యే పదం ఎంచుకున్నాం. హెబ్రూ మూలంలోని చివరి స్థలపునరుక్తిని నిలిపి, తెలుగులో అసహజంగా వినిపించే ధాతు పునరుక్తిని పాదటిప్పణిలో వివరించాం.
