base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/002.yaml
  text: Yahweh was with Joseph[a], and he became a successful man; and he was in the house of his Egyptian master.
translation:
  language: te
  text: యాహ్వే యోసేపుతో ఉన్నాడు; అతడు సఫలుడయ్యాడు[a]; అతడు తన ఐగుప్తీయ యజమాని ఇంట్లో ఉన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వర్ధిల్లినవాడు.’ హీబ్రూ కృదంతం వర్ధిల్లడం లేదా సఫలమవడం అనే భావాన్ని ఇవ్వగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే లిప్యంతరీకరణతో అందించాం.
- source_word: אֶת יוֹסֵף
  choice: యోసేపుతో
  rationale: ఈ నిర్మాణం దేవుని సన్నిధి, అనుగ్రహాన్ని సూచించే ‘యోసేపుతో ఉన్నాడు’ అనే సహజ తెలుగు ప్రయోగంగా అనువదించబడింది.
- source_word: אִישׁ מַצְלִיחַ
  choice: అతడు సఫలుడయ్యాడు
  rationale: אִישׁ ఇక్కడ యోసేపునే సూచిస్తుంది; తెలుగులో ‘సఫలమైన మనిషి అయ్యాడు’ కంటే ఈ విధానం సహజంగా ఉండి, מַצְלִיחַ లోని విజయవంతమవడం/వర్ధిల్లడం అనే భావాన్ని నిలుపుతుంది.
- source_word: בְּבֵית
  choice: ఇంట్లో
  rationale: మూలంలోని ‘ఇంటిలో’ అనే స్థలార్థాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אֲדֹנָיו
  choice: తన ... యజమాని
  rationale: యోసేపుపై అధికారమున్న వ్యక్తిని సందర్భానుగుణంగా ‘యజమాని’ అని అందించాం; ‘ప్రభువు’ అనే పదం ఇక్కడ దైవార్థంతో గందరగోళం కలిగించవచ్చు.
- source_word: הַמִּצְרִי
  choice: ఐగుప్తీయ
  rationale: యజమాని జాతిని విశేషణంగా గుర్తిస్తూ, బైబిలు సందర్భంలో సుపరిచితమైన తెలుగు రూపాన్ని ఉపయోగించాం.
- source_word: וַיְהִי ... וַיְהִי ... וַיְהִי
  choice: ఉన్నాడు ... అయ్యాడు ... ఉండేవాడు
  rationale: మూలంలోని వరుస నిర్మాణాన్ని భావపరంగా నిలుపుతూ, తెలుగు కథనశైలికి తగిన కాలరూపాలు వాడబడ్డాయి.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో వ్యక్తిగత దైవనామమే ఉంది; దాన్ని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయలేదు. తెలుగు పాఠకులకు విస్తృతంగా పరిచితమైన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం; ‘యాహ్వే’ కూడా సాధ్యమైన లిప్యంతరీకరణ.
- issue: యోసేపు సఫలతకు దైవసన్నిధితో ఉన్న సంబంధం
  choice: రెండు వాక్యాలను ‘అందువల్ల’తో అనుసంధానించడం
  alternative: ‘యెహోవా యోసేపుతో ఉన్నాడు; అతడు సఫలుడయ్యాడు’ అని స్పష్టమైన కారణసూచకం లేకుండా ఉంచడం
  rationale: వరుస హీబ్రూ వాక్యాలు సందర్భంలో దైవసన్నిధి మరియు యోసేపు సఫలత మధ్య సంబంధాన్ని సూచిస్తాయి. ‘అందువల్ల’ ఆ సంబంధాన్ని సహజ తెలుగులో తెలియజేస్తుంది; అయితే అది మూలంలో ప్రత్యేక కారణసూచక పదంగా లేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. ‘సఫలుడయ్యాడు’ ఆర్థిక సంపదకు మాత్రమే పరిమితం కాకుండా విస్తృత విజయభావాన్ని ఇస్తుంది. ‘ఐగుప్తీయ’ అనే రూపం బైబిలు పరిచయాన్ని కాపాడుతుంది.
