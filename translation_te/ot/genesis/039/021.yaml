id: GEN.39.21
reference: Genesis 39:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְהִ֤י יְהוָה֙ אֶת יוֹסֵ֔ף וַ/יֵּ֥ט אֵלָ֖י/ו חָ֑סֶד וַ/יִּתֵּ֣ן חִנּ֔/וֹ בְּ/עֵינֵ֖י שַׂ֥ר בֵּית הַ/סֹּֽהַר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/021.yaml
  text: But Yahweh was with Joseph and extended covenant faithfulness to him[b][a], and he gave him favor in the eyes of the chief of the prison.
translation:
  language: te
  text: అయితే యహ్వే యోసేపుకు తోడుగా ఉండి, అతనిపట్ల నిబద్ధమైన ప్రేమ చూపించాడు[a]. చెరసాల అధికారి[b] దృష్టిలో యోసేపుకు అనుగ్రహం కలిగేలా చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “స్థిరమైన ప్రేమ,” “విశ్వసనీయ ప్రేమ,” లేదా “దయ.” హీబ్రూ חֶסֶד అనే పదం సందర్భానుసారంగా ఈ భావాలను సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా “చెరసాల ఇంటి అధిపతి.” అంటే చెరసాలకు బాధ్యుడైన అధికారి.
    reason: source_idiom
lexical_decisions:
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవ నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగులో దాని సాధారణ లిప్యంతరీకరణను ఉపయోగిస్తుంది.
- source_word: וַיְהִי ... אֶת
  choice: తోడుగా ఉండి
  rationale: ఈ హీబ్రూ నిర్మాణం సన్నిధి, సహవాసం, తోడ్పాటును సూచిస్తుంది; తెలుగులో ‘తోడుగా ఉండి’ సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: וַיֵּט אֵלָיו חָסֶד
  choice: అతనిపట్ల నిబద్ధమైన ప్రేమ చూపించాడు
  rationale: నָטָהతో కూడిన ఈ ప్రయోగం ప్రేమపూర్వక అనుగ్రహాన్ని చూపించడాన్ని సూచిస్తుంది. חֶסֶדలోని స్థిరత్వం, విశ్వసనీయతను ‘నిబద్ధమైన ప్రేమ’ తెలియజేస్తుంది; ఈ వచనంలో స్పష్టంగా ప్రస్తావించని ఒడంబడికను ప్రధాన పాఠంలో చేర్చదు.
- source_word: חִנּוֹ בְּעֵינֵי
  choice: దృష్టిలో యోసేపుకు అనుగ్రహం కలిగేలా చేశాడు
  rationale: ఒకరి దృష్టిలో ఆమోదం లేదా అనుకూలత పొందడం అనే హీబ్రూ నుడికారాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: שַׂר בֵּית הַסֹּהַר
  choice: చెరసాల అధికారి
  rationale: చెరసాలకు బాధ్యుడైన ప్రధాన అధికారిని సూచించే సహజమైన ఆధునిక తెలుగు పదబంధం; హీబ్రూ నిర్మాణం యొక్క మరింత అక్షరార్థ రూపాన్ని పాదసూచికలో ఉంచింది.
- source_word: וַ
  choice: అయితే
  rationale: ముందరి సందర్భంలో యోసేపు చెరసాలలో వేయబడటానికి, ఇక్కడ యహ్వే అతనికి తోడుగా ఉండటానికి మధ్యనున్న వ్యత్యాసాన్ని తెలుగులో స్పష్టంగా చూపిస్తుంది.
theological_decisions:
- issue: חֶסֶדలోని దైవిక విశ్వసనీయ ప్రేమ
  choice: నిబద్ధమైన ప్రేమ
  alternative: ఒడంబడిక విశ్వసనీయత; స్థిరమైన ప్రేమ; దయ
  rationale: ఈ పదం సాధారణ దయకన్నా స్థిరమైన, విశ్వసనీయమైన ప్రేమను సూచించగలదు. అయితే తక్షణ సందర్భంలో ఒడంబడికను స్పష్టంగా ప్రస్తావించనందున ‘ఒడంబడిక విశ్వసనీయత’ అని వ్యాఖ్యానాత్మకంగా నిర్ధారించలేదు; ప్రత్యామ్నాయ భావాలను పాదసూచికలో భద్రపరిచింది.
- issue: יְהוָה దైవ నామం
  choice: యహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలోని వ్యక్తిగత దైవ నామాన్ని బిరుదుగా మార్చకుండా నిలుపుతుంది; ఏ ప్రత్యేక మతశాఖ ప్రయోగానికీ ప్రాధాన్యం ఇవ్వకుండా మూలరూపానికి దగ్గరైన లిప్యంతరీకరణను వాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘తోడుగా ఉండి,’ ‘నిబద్ధమైన ప్రేమ,’ ‘అనుగ్రహం’ వంటి పదాలు సాధారణ పాఠకులకు అర్థమయ్యేలా ఉండి మూలపాఠపు గంభీరతను నిలుపుతాయి.
