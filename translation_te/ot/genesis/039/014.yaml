revisions:
- from: 'ఆమె తన ఇంటి మగవారిని పిలిచి వారితో ఇలా అంది: “చూడండి! మనలను అపహాస్యం చేయడానికి అతడు ఒక హెబ్రీయుణ్ణి మన దగ్గరికి తీసుకొచ్చాడు.[a] వాడు నాతో పడుకోవడానికి నా దగ్గరికి వచ్చాడు[b]; నేను పెద్దగా కేక వేశాను.”'
  to: 'ఆమె తన ఇంట్లోని పురుషులను పిలిచి వారితో ఇలా అంది: “చూడండి! మనలను అపహాస్యం చేయడానికి అతడు ఒక హెబ్రీయుడిని మన ఇంటికి తీసుకొచ్చాడు. వాడు నాతో పడుకోవడానికి నా దగ్గరికి వచ్చాడు[a]; నేను పెద్దగా కేక వేశాను.”'
  rationale: The revision makes the household reference natural and unambiguous in Telugu, while retaining the masculine plural of the Hebrew. It also renders the introduced Hebrew man and the collective household setting smoothly. The main rendering “అపహాస్యం చేయడానికి” remains broad enough for the source verb’s context-dependent force; no doctrinal or overly specific sexual interpretation is imposed. The idiom footnote is retained at its proper anchor.
