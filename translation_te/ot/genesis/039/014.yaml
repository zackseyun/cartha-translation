source:
  edition: WLC
  text: וַ/תִּקְרָ֞א לְ/אַנְשֵׁ֣י בֵיתָ֗/הּ וַ/תֹּ֤אמֶר לָ/הֶם֙ לֵ/אמֹ֔ר רְא֗וּ הֵ֥בִיא לָ֛/נוּ אִ֥ישׁ עִבְרִ֖י לְ/צַ֣חֶק בָּ֑/נוּ בָּ֤א אֵלַ/י֙ לִ/שְׁכַּ֣ב עִמִּ֔/י וָ/אֶקְרָ֖א בְּ/ק֥וֹל גָּדֽוֹל׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/014.yaml
  text: Then she called the men of her household and said to them[a], “Look, he has brought a Hebrew man to us to mock us. He came in to me to lie with me[b], and I cried out with a loud voice.”
translation:
  language: te
  text: 'ఆమె తన ఇంట్లోని పురుషులను పిలిచి వారితో ఇలా అంది: “చూడండి! మనలను అపహాస్యం చేయడానికి అతడు ఒక హెబ్రీయుడిని మన ఇంటికి తీసుకొచ్చాడు. వాడు నాతో పడుకోవడానికి నా దగ్గరికి వచ్చాడు[a]; నేను పెద్దగా కేక వేశాను.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “నాతో పడుకోవడానికి” అనేది ఇక్కడ లైంగిక సంబంధం పెట్టుకోవడాన్ని సూచించే నానుడి.
    reason: idiom_clarification
lexical_decisions:
- source_word: וַתִּקְרָא לְאַנְשֵׁי בֵיתָהּ
  choice: ఆమె తన ఇంటి మగవారిని పిలిచి
  rationale: אַנְשֵׁי అనే పుంలింగ బహువచనాన్ని ‘మగవారు’ అని స్పష్టంగా ఉంచి, בֵיתָהּ యొక్క కుటుంబ/గృహ పరిధిని సహజమైన ఆధునిక తెలుగులో తెలిపింది.
- source_word: וַתֹּאמֶר לָהֶם לֵאמֹר
  choice: వారితో ఇలా అంది
  rationale: హీబ్రూ మాట-పరిచయ సూత్రంలోని పునరుక్తిని తెలుగులో సహజంగా కుదించి, ప్రత్యక్ష సంభాషణను నిలిపింది.
- source_word: רְאוּ
  choice: చూడండి!
  rationale: శ్రోతల దృష్టిని ఆకర్షించే బహువచన ఆజ్ఞను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేసింది.
- source_word: הֵבִיא לָנוּ אִישׁ עִבְרִי
  choice: అతడు ఒక హెబ్రీయుణ్ణి మన దగ్గరికి తీసుకొచ్చాడు
  rationale: בוא యొక్క హిఫీల్ causative భావమైన ‘తీసుకొచ్చు’ను, לָנוּ లోని సమూహ సంఘీభావ సూచనను, אִישׁ עִבְרִי లోని జాతి-పురుష గుర్తింపును కాపాడింది.
- source_word: לְצַחֶק בָּנוּ
  choice: మనలను అపహాస్యం చేయడానికి
  rationale: צחק ב־ ఇక్కడ ఎగతాళి చేయడం/ఆటవస్తువుగా చూడడం అనే విస్తృత భావాన్ని కలిగి, ఆరోపణ సందర్భంలో అవమానకరమైన—సంభవంగా లైంగికమైన—ఛాయను మోస్తుంది; ప్రధాన పాఠం ఆ అస్పష్టతను అతిగా నిర్దిష్టం చేయదు.
- source_word: בָּא אֵלַי
  choice: వాడు ... నా దగ్గరికి వచ్చాడు
  rationale: ఆమె ఆరోపణలోని తక్కువచేసే స్వరానికి ‘వాడు’ సహజంగా సరిపోతుంది; אֶלַי ని ‘నా దగ్గరికి’గా నేరుగా ప్రతిబింబించింది.
- source_word: לִשְׁכַּב עִמִּי
  choice: నాతో పడుకోవడానికి
  rationale: ఇది లైంగిక సంబంధాన్ని సూచించే హీబ్రూ నానుడి; తెలుగు సమాన నానుడి మూలంలోని పరోక్షతను నిలుపుతుంది.
- source_word: וָאֶקְרָא בְּקוֹל גָּדוֹל
  choice: నేను పెద్దగా కేక వేశాను
  rationale: అత్యవసర సందర్భంలోని קרא ను ‘కేక వేశాను’గా, בְּקוֹל גָּדוֹל ను సహజంగా ‘పెద్దగా’గా అందించింది; సాధారణ హీబ్రూ ו־ ను అదనపు విరోధార్థం చేర్చకుండా వరుస చర్యగా ఉంచింది.
theological_decisions:
- issue: צחק అనే క్రియలోని ఆరోపణ స్వభావం
  choice: అపహాస్యం చేయడానికి
  alternative: మనతో ఆటలాడడానికి / మనలను అవమానించడానికి
  rationale: భార్య చేసిన ఆరోపణలో లైంగిక అవమాన ఛాయ ఉన్నప్పటికీ, మూలపదం దానిని ఒక్క నిర్దిష్ట చర్యగా మాత్రమే పరిమితం చేయదు. అందువల్ల ప్రధాన పాఠంలో విస్తృత భావాన్ని, పాదటిప్పణిలో ఇతర సాధ్యార్థాలను ఉంచింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైన కథన శైలిని ఉపయోగించింది. భార్య ఇంటి మగవారిని తన పక్షాన చేర్చుకునే ఆరోపణాత్మక స్వరం ‘మనలను,’ ‘మన దగ్గరికి’ అనే రూపాల్లో నిలిచింది. మూలంలో లేని స్పష్టమైన ‘కాని’ వంటి విరోధ సంధిని చేర్చలేదు.
