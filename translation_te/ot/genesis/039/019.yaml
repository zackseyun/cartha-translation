id: GEN.39.19
reference: Genesis 39:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְהִי֩ כִ/שְׁמֹ֨עַ אֲדֹנָ֜י/ו אֶת דִּבְרֵ֣י אִשְׁתּ֗/וֹ אֲשֶׁ֨ר דִּבְּרָ֤ה אֵלָי/ו֙ לֵ/אמֹ֔ר כַּ/דְּבָרִ֣ים הָ/אֵ֔לֶּה עָ֥שָׂהּ לִ֖/י עַבְדֶּ֑/ךָ וַ/יִּ֖חַר אַפּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/019.yaml
  text: And it happened that when his master heard the words of his wife that she spoke to him[a], saying[b], “According to these words your servant did to me,” his anger burned.
translation:
  language: te
  text: అతని యజమాని, “నీ దాసుడు[b] నాకు ఇలాంటి పనులు[a] చేశాడు” అని తన భార్య తనతో చెప్పిన మాటలు విన్నప్పుడు, అతని కోపం మండింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “ఈ మాటల ప్రకారం నీ దాసుడు నాకు చేశాడు.” ఈ హీబ్రూ పదబంధం “ఇలాంటివి” అనే భావాన్నీ, ఆమె చెప్పిన ఆరోపణను సూచించే భావాన్నీ ఇవ్వగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “నీ సేవకుడు.” హీబ్రూ עבד అనే పదానికి “సేవకుడు,” “బానిస” అనే రెండు అర్థాలూ ఉండవచ్చు; ఈ ఇంటి సందర్భంలో యోసేపు అధీనస్థితిని “దాసుడు” స్పష్టంగా తెలియజేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִשְׁמֹעַ
  choice: విన్నప్పుడు
  rationale: హీబ్రూ కథన క్రమాన్ని తెలుగులో సహజమైన కాలసూచక ఉపవాక్యంతో వ్యక్తం చేస్తుంది; వాక్యారంభంలోని וַיְהִיని విడిగా అనువదించడం తెలుగులో అనవసరంగా భారంగా ఉంటుంది.
- source_word: אֲדֹנָיו
  choice: అతని యజమాని
  rationale: ఇంటి యజమానిగా, యోసేపుపై అధికారం కలిగిన పోతీఫరును సూచిస్తుంది; ‘ప్రభువు’ కంటే ‘యజమాని’ ఈ సందర్భానికి స్పష్టంగా సరిపోతుంది.
- source_word: דִּבְרֵי אִשְׁתּוֹ אֲשֶׁר דִּבְּרָה אֵלָיו
  choice: తన భార్య తనతో చెప్పిన మాటలు
  rationale: ‘మాటలు’ అనే మూలపదాన్ని నిలుపుతూ, భార్య తన భర్తతో చెప్పిందనే సంబంధాన్ని సహజమైన తెలుగులో స్పష్టం చేస్తుంది.
- source_word: כַּדְּבָרִים הָאֵלֶּה
  choice: ఇలాంటి పనులు
  rationale: ఈ పదబంధం ఆమె తెలిపిన ఆరోపణల స్వరూపాన్ని సూచిస్తుంది. ‘ఇలాంటి పనులు’ ఆధునిక తెలుగులో సహజంగా ఉండి, నిర్దిష్ట ఆరోపణను మరింత విపులీకరించదు.
- source_word: עַבְדְּךָ
  choice: నీ దాసుడు
  rationale: עבד సేవకుడు లేదా బానిస అనే అర్థాలు కలిగి ఉన్నా, ఇక్కడ యోసేపు పోతీఫరు ఆధీనంలో ఉన్నవాడు. ‘దాసుడు’ ఆ అధీనస్థితిని గౌరవప్రదమైన బైబిలు శైలిలో తెలియజేస్తుంది.
- source_word: וַיִּחַר אַפּוֹ
  choice: అతని కోపం మండింది
  rationale: కోపం మండడాన్ని సూచించే హీబ్రూ రూపకాన్ని సహజమైన తెలుగు నుడికారంతో నిలుపుతుంది.
theological_decisions:
- issue: యజమాని కోపం ఎవరిమీద మండిందో వచనం స్పష్టంగా చెప్పదు
  choice: ‘అతని కోపం మండింది’ అని మాత్రమే అనువదించడం
  alternative: ‘యోసేపుమీద అతని కోపం మండింది’ అని స్పష్టీకరించడం
  rationale: హీబ్రూ మూలంలో కోపం ఎవరిమీదో ప్రత్యక్షంగా పేర్కొనలేదు. కథాసందర్భం ఒక నిర్ధారణకు దారితీయవచ్చినా, అనువాదం ఆ అస్పష్టతను తొలగించకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గంభీరంగా రూపొందించబడింది. మూలంలోని ‘మాటలు’ మరియు ‘కోపం మండింది’ అనే రూపకభాషను నిలుపుతూ, వాక్య నిర్మాణాన్ని తెలుగు పాఠకులకు సులభంగా అర్థమయ్యేలా క్రమబద్ధం చేశాం.
