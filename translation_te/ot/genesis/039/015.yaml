source:
  edition: WLC
  text: וַ/יְהִ֣י כְ/שָׁמְע֔/וֹ כִּֽי הֲרִימֹ֥תִי קוֹלִ֖/י וָ/אֶקְרָ֑א וַ/יַּעֲזֹ֤ב בִּגְד/וֹ֙ אֶצְלִ֔/י וַ/יָּ֖נָס וַ/יֵּצֵ֥א הַ/חֽוּצָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/015.yaml
  text: And when he heard that I had raised my voice and cried out[b][a], he left his garment beside me and fled and went outside.
translation:
  language: te
  text: నేను గొంతెత్తి కేక వేసినట్లు[a] అతడు వినగానే, తన వస్త్రాన్ని నా దగ్గర[b] విడిచిపెట్టి పారిపోయి బయటికి వెళ్లాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నేను స్వరం ఎత్తి పిలిచినట్లు.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “తన వస్త్రాన్ని నా వద్ద విడిచిపెట్టి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְשָׁמְעוֹ
  choice: అతడు వినగానే
  rationale: వַיְהִי తో కూడిన కాలసూచక నిర్మాణాన్ని తెలుగులో సహజమైన కథన క్రమంగా ‘వినగానే’ అని వ్యక్తపరుస్తుంది.
- source_word: כִּי
  choice: అని / అని తెలిపే భావం
  rationale: ఇక్కడ כִּי అతడు విన్న విషయాన్ని పరిచయం చేస్తుంది; తెలుగులో ‘వినగానే’ ముందు వచ్చే ‘...వేసినట్లు’ ద్వారా ఆ విషయార్థం సహజంగా వ్యక్తమవుతుంది.
- source_word: הֲרִימֹתִי קוֹלִי וָאֶקְרָא
  choice: నేను గొంతెత్తి కేక వేసినట్లు
  rationale: ‘స్వరాన్ని ఎత్తడం’ అనే హీబ్రూ నుడికారాన్ని సహజమైన ఆధునిక తెలుగులో ‘గొంతెత్తి’ అని, సందర్భంలోని సహాయార్థ కేకను ‘కేక వేసి’ అని అందిస్తుంది; క్రియల సమన్వయాన్ని ఒక సహజమైన పదబంధంగా కలుపుతుంది.
- source_word: וַיַּעֲזֹב בִּגְדוֹ
  choice: తన వస్త్రాన్ని ... విడిచిపెట్టి
  rationale: בגד ఏకవచనాన్ని ‘వస్త్రం’గా నిలుపుతూ, עזב సూచించే అక్కడే వదిలివెళ్లడాన్ని ‘విడిచిపెట్టి’ సహజంగా వ్యక్తపరుస్తుంది.
- source_word: אֶצְלִי
  choice: నా దగ్గరే
  rationale: ఈ పదం ‘నా పక్కన’ అనే స్థలసామీప్యాన్నీ, ‘నా వద్ద’ అనే అధీన/సాన్నిధ్య భావాన్నీ అనుమతిస్తుంది; ‘నా దగ్గరే’ ఈ రెండు ఛాయలను తెలుగులో ఉంచుతుంది.
- source_word: וַיָּנָס
  choice: పారిపోయి
  rationale: నూస్ ధాతువు సూచించే ఆకస్మికంగా తప్పించుకొని పోవడాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וַיֵּצֵא הַחוּצָה
  choice: బయటికి వెళ్లాడు
  rationale: దిశాసూచక הַחוּצָהను ‘బయటికి’గా స్పష్టంగా నిలుపుతుంది.
