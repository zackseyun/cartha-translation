  text: וַ/יְהִ֗י אַחַר֙ הַ/דְּבָרִ֣ים הָ/אֵ֔לֶּה וַ/תִּשָּׂ֧א אֵֽשֶׁת אֲדֹנָ֛י/ו אֶת עֵינֶ֖י/הָ אֶל יוֹסֵ֑ף וַ/תֹּ֖אמֶר שִׁכְבָ֥/ה עִמִּֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/007.yaml
  text: And after these things[a], his master's wife cast her eyes on Yosef and said, “Lie with me.”
translation:
  language: te
  text: ఈ సంగతులు జరిగిన తర్వాత, అతని యజమాని భార్య యోసేపు మీద కన్నేసి[a], “నాతో పడుకో” అని చెప్పింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీయులో అక్షరార్థంగా, “యోసేపు వైపు తన కళ్లను ఎత్తింది”; ఇక్కడ ఇది కోరికతో అతని మీద దృష్టి నిలిపిందని తెలిపే నానుడి.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַחַר הַדְּבָרִים הָאֵלֶּה
  choice: ఈ సంగతులు జరిగిన తర్వాత
  rationale: కథనంలో ఆ తర్వాత జరిగిన పరిణామాన్ని పరిచయం చేసే హెబ్రీయు ప్రయోగాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וַתִּשָּׂא ... אֶת עֵינֶיהָ אֶל
  choice: మీద కన్నేసి
  rationale: అక్షరార్థంగా ‘తన కళ్లను ... వైపు ఎత్తింది.’ ఈ సందర్భంలో ఇది తటస్థంగా చూడడాన్ని కాక, కోరికతో కూడిన ఉద్దేశపూర్వక దృష్టిని సూచిస్తుంది; ‘కన్నేసి’ ఆ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: אֵשֶׁת אֲדֹנָיו
  choice: అతని యజమాని భార్య
  rationale: స్త్రీని యోసేపు యజమానితో ఉన్న సంబంధం ద్వారా గుర్తించే మూలంలోని నిర్మాణాన్ని స్పష్టమైన తెలుగులో నిలుపుతుంది.
- source_word: יוֹסֵף
  choice: యోసేపు
  rationale: హెబ్రీయు పేరుకు స్థిరపడిన తెలుగు లిప్యంతరీకరణను ఉపయోగిస్తుంది.
- source_word: שִׁכְבָה עִמִּי
  choice: నాతో పడుకో
  rationale: ఇది నేరుగా చేసిన లైంగిక ఆహ్వానం. ‘నాతో పడుకో’ మూలంలోని సంక్షిప్తతను, సూటితనాన్ని కాపాడుతుంది.
