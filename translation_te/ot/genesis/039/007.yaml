translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కథనానికి తగిన గౌరవప్రదమైన, సులభమైన శైలి. ‘కన్నేసి’ సందర్భంలోని కోరికభరిత దృష్టిని సహజంగా తెలియజేస్తుంది; పాదటిప్పణి అక్షరార్థాన్ని భద్రపరుస్తుంది.
