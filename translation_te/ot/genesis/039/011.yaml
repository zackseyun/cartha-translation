  yaml_path: translation/ot/genesis/039/011.yaml
  text: And it happened on such a day that he went into the house to do his work[b][a], and none of the men of the house was there in the house.
translation:
  language: te
  text: ఒక రోజు[a] అతడు తన పని చేయడానికి ఇంట్లోకి వెళ్లాడు. అప్పుడు ఇంటి పురుషుల్లో ఒక్కరు కూడా అక్కడ ఇంట్లో లేరు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “ఈ రోజువంటి రోజున.” ఈ హీబ్రూ నుడికారం ఇక్కడ “ఇలాంటి ఒక సందర్భంలో” లేదా “ఒకరోజు” అనే భావాన్ని ఇస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּהַיּוֹם הַזֶּה
  choice: ఒకరోజు
  rationale: హీబ్రూ కథన సూత్రాన్ని, సందర్భంలో ఒక నిర్దిష్ట సందర్భాన్ని సూచించే కְּהַיּוֹם הַזֶּה అనే నుడికారాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది; దాని అక్షరార్థాన్ని పాదటిప్పణిలో నిలుపుతుంది.
- source_word: וַיָּבֹא הַבַּיְתָה
  choice: అతడు ... ఇంట్లోకి వెళ్లాడు
  rationale: בוא క్రియకు జతైన దిశాసూచక ה ఇంటి లోపలికి జరిగిన కదలికను సూచిస్తుంది. కథన దృష్టికోణంలో ‘వెళ్లాడు’ సహజంగా ఉంది.
- source_word: לַעֲשׂוֹת מְלַאכְתּוֹ
  choice: తన పని చేసుకోవడానికి
  rationale: מְלָאכָה ఇక్కడ యోసేపు నిర్వహించే పనిని సూచిస్తుంది. ‘తన పని’ అర్థాన్ని స్పష్టంగా, సహజంగా అందిస్తుంది.
- source_word: וְאֵין אִישׁ מֵאַנְשֵׁי הַבַּיִת
  choice: ఇంటి మనుషుల్లో ఒక్కరు కూడా ... లేరు
  rationale: ప్రతికూల అస్తిత్వ నిర్మాణాన్నీ, ‘ఇంటి పురుషులు/మనుషులు’ అనే సమూహ సూచననూ తెలుగులో సహజంగా వ్యక్తపరుస్తుంది. ‘మనుషులు’ ఇక్కడ ఇంటికి చెందిన సేవకులు లేదా సిబ్బందిని సూచించే సందర్భోచిత పదం; స్త్రీని కూడా కలుపుకునే ‘ఎవరూ’గా విస్తరించదు.
- source_word: שָׁם בַּבָּיִת
  choice: అక్కడ ఇంట్లో
  rationale: హీబ్రూలోని ‘అక్కడ’ మరియు ‘ఇంట్లో’ అనే రెండు స్థాన సూచనలనూ నిలుపుతూ, మూలంలోని ఉద్ఘాటనాత్మక పునరుక్తిని సంరక్షిస్తుంది.
