    rationale: וַיִּקְרָא ప్రాథమికంగా ‘పిలిచాడు/బిగ్గరగా పిలిచాడు.’ తరువాతి ప్రత్యక్ష ఆజ్ఞ ఆ ఆజ్ఞస్వరూపాన్ని తానే చూపిస్తుంది. ‘బిగ్గరగా పిలిచి’ మూలానికి మరింత దగ్గరగా ఉంటుంది.
