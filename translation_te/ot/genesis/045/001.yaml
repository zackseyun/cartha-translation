reference: Genesis 45:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/לֹֽא יָכֹ֨ל יוֹסֵ֜ף לְ/הִתְאַפֵּ֗ק לְ/כֹ֤ל הַ/נִּצָּבִים֙ עָלָ֔י/ו וַ/יִּקְרָ֕א הוֹצִ֥יאוּ כָל אִ֖ישׁ מֵ/עָלָ֑/י וְ/לֹא עָ֤מַד אִישׁ֙ אִתּ֔/וֹ בְּ/הִתְוַדַּ֥ע יוֹסֵ֖ף אֶל אֶחָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/001.yaml
  text: Then Joseph could no longer restrain himself before all those standing by him[a], and he cried out[c][b], “Have everyone go out from me!” And no one remained with him when Joseph made himself known to his brothers.
translation:
  language: te
  text: అప్పుడు యోసేపు తన దగ్గర నిలబడి ఉన్న వారందరి సమక్షంలో తనను తాను ఇక అదుపు చేసుకోలేక, “అందరినీ నా దగ్గర నుంచి బయటికి పంపండి!” అని బిగ్గరగా పిలిచాడు. యోసేపు తన సహోదరులకు తనను తెలియజేసినప్పుడు అతనితో మరెవరూ అక్కడ ఉండలేదు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יָכֹל ... לְהִתְאַפֵּק
  choice: తనను తాను ఇక అదుపు చేసుకోలేక
  rationale: నిరాకరణతో కూడిన సామర్థ్య క్రియను, హిత్పయేల్ రూపంలోని ఆత్మనిగ్రహ భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: לְכֹל הַנִּצָּבִים עָלָיו
  choice: తన దగ్గర నిలబడి ఉన్న వారందరి సమక్షంలో
  rationale: నిలబడి లేదా విధిలో ఉన్నవారనే మూల భావాన్ని కాపాడుతూ, עָלָיו యొక్క సందర్భానుగుణ సంబంధాన్ని ‘దగ్గర’ మరియు ‘సమక్షంలో’ ద్వారా స్పష్టం చేస్తుంది; వారిని తప్పనిసరిగా సేవకులుగా నిర్వచించదు.
- source_word: וַיִּקְרָא
  choice: బిగ్గరగా ఆదేశించాడు
  rationale: క్రియలోని గట్టిగా పిలిచిన భావాన్ని, వెంట వచ్చే ఆజ్ఞ యొక్క సందర్భాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: הוֹצִיאוּ כָל אִישׁ מֵעָלָי
  choice: అందరినీ నా దగ్గర నుంచి బయటికి పంపండి
  rationale: బహువచన కారణార్థక ఆజ్ఞను మరియు ‘ప్రతి వ్యక్తి’ అనే పంపిణీ భావాన్ని సహజ తెలుగులో నిలుపుతుంది.
- source_word: וְלֹא עָמַד אִישׁ אִתּוֹ
  choice: అతనితో మరెవరూ అక్కడ ఉండలేదు
  rationale: ‘ఎవరూ అతనితో నిలబడలేదు’ అనే హీబ్రూ పదప్రయోగానికి సందర్భంలో ఉద్దేశించిన ‘ఎవరూ అక్కడ మిగలలేదు’ అనే అర్థాన్ని సహజంగా అందిస్తుంది.
- source_word: בְּהִתְוַדַּע יוֹסֵף
  choice: యోసేపు ... తనను తాను తెలియజేసుకున్నప్పుడు
  rationale: ידע హిత్పయేల్ రూపంలోని ‘తనను తాను తెలియపరచుకోవడం/బయలుపరచుకోవడం’ అనే ప్రతిఫలిత భావాన్ని కాపాడుతుంది.
- source_word: אֶל אֶחָיו
  choice: తన సహోదరులకు
  rationale: ఇక్కడ ఉద్దేశించబడిన యోసేపు యొక్క పురుష సహోదరులను ఖచ్చితంగా సూచిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. మూలంలోని భావోద్వేగ తీవ్రతను ‘ఇక అదుపు చేసుకోలేక’ మరియు ‘బిగ్గరగా’ ద్వారా వ్యక్తం చేశాం; అదనపు భావోద్వేగ కారణాన్ని చేర్చలేదు.
