id: GEN.45.14
reference: Genesis 45:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּפֹּ֛ל עַל צַוְּארֵ֥י בִנְיָמִֽן אָחִ֖י/ו וַ/יֵּ֑בְךְּ וּ/בִנְיָמִ֔ן בָּכָ֖ה עַל צַוָּארָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/014.yaml
  text: Then he fell on the neck of Benjamin his brother and wept[a], and Benjamin wept on his neck.
translation:
  language: te
  text: అప్పుడు యోసేపు తన సోదరుడైన బెన్యామీను మెడపై పడి ఏడ్చాడు[a]; బెన్యామీను యోసేపు మెడపై ఏడ్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీలో అక్షరార్థంగా, “తన సోదరుడైన బెన్యామీను మెడలపై పడి … బెన్యామీను అతని మెడలపై ఏడ్చాడు.” ఇక్కడ “మెడలు” అనే బహువచన రూపం ఆలింగనం చేసుకునే సందర్భంలో మెడ చుట్టూ అనే భావాన్ని సూచించే హెబ్రీ ప్రయోగం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפֹּל
  choice: మెడమీద పడి
  rationale: נפל అనే క్రియ యొక్క ‘పడు’ అనే స్పష్టమైన భావాన్ని నిలుపుతూ, ఆలింగనం చేసుకునే సందర్భంలో సహజమైన తెలుగు ప్రయోగాన్ని ఇస్తుంది.
- source_word: צַוְּארֵי / צַוָּארָיו
  choice: మెడమీద
  rationale: మొదటి రూపం హెబ్రీలో వ్యాకరణపరంగా బహువచన/ద్వివచన రూపంలో కనిపించినా, ఇది మెడ చుట్టూ కౌగిలించుకోవడాన్ని సూచించే జాతీయ ప్రయోగం. తెలుగులో ఏకవచన ‘మెడమీద’ సహజంగా ఉంటుంది.
- source_word: בִנְיָמִן
  choice: బెన్యామీను
  rationale: తెలుగు బైబిలు వాడుకలో సుపరిచితమైన పేరురూపాన్ని ఉపయోగించింది.
- source_word: אָחִיו
  choice: తన తమ్ముడైన
  rationale: హెబ్రీలో సాధారణంగా ‘అతని సహోదరుడు’ అని ఉన్నప్పటికీ, కథా సందర్భంలో బెన్యామీను యోసేపు తమ్ముడు; సహజమైన తెలుగులో కుటుంబ సంబంధాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: וַיֵּבְךְּ / בָּכָה
  choice: ఏడ్చాడు
  rationale: בכה అనే క్రియకు సహజమైన ఆధునిక తెలుగు సమానార్థకం; రెండు సందర్భాల్లోనూ ఒకే పదాన్ని ఉంచింది.
- source_word: וּבִנְיָמִן
  choice: బెన్యామీను కూడా
  rationale: וְ సమన్వయాన్ని తెలుగులో సహజంగా తెలియజేస్తూ, పరస్పర చర్యను స్పష్టం చేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, కథనానికి తగిన గంభీరతతోనూ సాధారణ పాఠకులకు సహజంగా అర్థమయ్యే విధంగానూ అనువదించబడింది. రెండో వాక్యంలో సర్వనామం వల్ల కలిగే సందిగ్ధతను నివారించడానికి ‘యోసేపు’ పేరును పునరుక్తి చేసింది.
