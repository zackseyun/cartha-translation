  yaml_path: translation/ot/genesis/045/013.yaml
  text: And tell my father about all my honor in Egypt and everything you have seen[b][a]. Hurry and bring my father down here.
translation:
  language: te
  text: ఈజిప్టులో నాకు ఉన్న ఘనత అంతటినీ, మీరు చూసినదంతటినీ నా తండ్రికి తెలియజేయండి.[a] తొందరపడి నా తండ్రిని ఇక్కడికి దింపి తీసుకురండి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ఘనత”ను “మహిమ” అని కూడా అనువదించవచ్చు. హెబ్రీ పదం యోసేపుకు ఈజిప్టులో ఉన్న ఉన్నత స్థానం, ప్రతిష్ఠను సూచిస్తుంది. “దింపి తీసుకురండి”లో ఈజిప్టుకు వెళ్లడాన్ని ‘కిందికి’ వెళ్లడంగా చెప్పే హెబ్రీ దిశాభావం ఉంది.
    reason: lexical_and_directional_alternative
lexical_decisions:
- source_word: הִגַּדְתֶּם
  choice: చెప్పండి
  rationale: נגד హిఫీల్ రూపం ‘తెలియజేయడం/చెప్పడం’ అనే అర్థాన్ని ఇస్తుంది; సోదరులకు ఇచ్చిన ప్రత్యక్ష ఆదేశంగా ‘చెప్పండి’ సహజంగా ఉంది.
- source_word: כָּל כְּבוֹדִי
  choice: నాకు ఉన్న గౌరవమంతటి
  rationale: כבוד ఇక్కడ యోసేపుకు ఈజిప్టులో లభించిన ఉన్నత స్థానం, ప్రతిష్ఠను సూచిస్తుంది. ‘గౌరవం’ ఈ సందర్భాన్ని సహజంగా తెలియజేస్తుంది; ‘మహిమ’ కూడా సాధ్యమైన పదార్థం.
- source_word: בְּמִצְרַיִם
  choice: ఈజిప్టులో
  rationale: స్థానాన్ని సూచించే సరళమైన పదబంధం.
- source_word: כָּל אֲשֶׁר רְאִיתֶם
  choice: మీరు చూసినదంతటి
  rationale: సోదరులు ప్రత్యక్షంగా చూసిన సమస్త సాక్ష్యాన్ని సూచిస్తూ మూలంలోని విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: מִהַרְתֶּם
  choice: త్వరపడి
  rationale: క్రియలోని అత్యవసరతను సహజమైన తెలుగు ఆజ్ఞారూపంలో తెలియజేస్తుంది.
- source_word: הוֹרַדְתֶּם
  choice: తీసుకురండి
  rationale: ירד హిఫీల్ అక్షరార్థంగా ‘దిగివచ్చేలా చేయండి’ అని సూచిస్తుంది. తెలుగులో గమ్యస్థానమైన వక్తవైపు తీసుకురావడాన్ని ‘ఇక్కడికి తీసుకురండి’ సహజంగా వ్యక్తపరుస్తుంది; దిగువకు ప్రయాణించే దిశాభావాన్ని పాదసూచికలో తెలిపాం.
- source_word: הֵנָּה
  choice: ఇక్కడికి
  rationale: వక్త ఉన్న స్థలాన్ని గమ్యంగా సూచించే దిశార్థక అవ్యయం; ‘ఇక్కడికి’ తెలుగులో స్పష్టంగా ఉంది.
