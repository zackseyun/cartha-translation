  text: וַ/יַּֽעֲשׂוּ כֵן֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וַ/יִּתֵּ֨ן לָ/הֶ֥ם יוֹסֵ֛ף עֲגָל֖וֹת עַל פִּ֣י פַרְעֹ֑ה וַ/יִּתֵּ֥ן לָ/הֶ֛ם צֵדָ֖ה לַ/דָּֽרֶךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/021.yaml
  text: And the sons of Israel did so[a], and Joseph gave them wagons according to Pharaoh’s command, and he gave them provisions for the journey.
translation:
  language: te
  text: ఇశ్రాయేలు కుమారులు అలాగే చేశారు. ఫరో ఆజ్ఞ ప్రకారం[a] యోసేపు వారికి బండ్లను ఇచ్చాడు; ప్రయాణానికి కావలసిన సరుకులను కూడా ఇచ్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “ఫరో నోటి ప్రకారం”; ఇది “ఫరో ఆజ్ఞ ప్రకారం” అనే అర్థమిచ్చే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ כֵן
  choice: అలాగే చేశారు
  rationale: ఇంతకుముందు చెప్పిన విధంగానే వారు చేశారని తెలిపే సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: ఇక్కడ యాకోబు/ఇశ్రాయేలు యొక్క మగ సంతానమే ప్రత్యక్షంగా ఉద్దేశించబడినందున మూలంలోని లింగ-నిర్దిష్ట భావాన్ని నిలుపుతుంది.
- source_word: עֲגָלֹות
  choice: బండ్లు
  rationale: మనుషులను, సామానును తరలించడానికి ఉపయోగించే చక్రాల వాహనాలను సూచించే సాధారణ తెలుగు పదం.
- source_word: עַל פִּי פַרְעֹה
  choice: ఫరో ఆజ్ఞ ప్రకారం
  rationale: అక్షరార్థంగా ‘ఫరో నోటి ప్రకారం’ అనే హీబ్రూ నుడికారం; సందర్భంలో అతని ఆజ్ఞకు అనుగుణంగా అని అర్థం.
- source_word: צֵדָה
  choice: ప్రయాణానికి కావలసిన సరుకులు
  rationale: దారిలో అవసరమయ్యే ఆహారం లేదా ఇతర ప్రయాణ సరఫరాలను సూచిస్తుంది; కేవలం ఆహారానికే భావాన్ని పరిమితం చేయదు.
- source_word: לַדָּרֶךְ
  choice: ప్రయాణానికి కావలసిన
  rationale: ప్రయాణ సమయంలో ఉపయోగించేందుకు ఇచ్చిన సరఫరాల ఉద్దేశాన్ని సహజమైన తెలుగులో స్పష్టం చేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని ‘ఇశ్రాయేలు కుమారులు’ అనే నిర్దిష్ట సంబంధాన్ని నిలిపి, హీబ్రూ నుడికారాన్ని ప్రధాన పాఠ్యంలో స్పష్టమైన అర్థంతో అనువదించి అక్షరార్థాన్ని పాదటిప్పణిలో ఇచ్చాం.
