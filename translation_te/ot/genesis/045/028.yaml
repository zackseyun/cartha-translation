  yaml_path: translation/ot/genesis/045/028.yaml
  text: And Israel said[a], “Enough! Joseph my son is still alive. I will go and see him before I die.”
translation:
  language: te
  text: అప్పుడు ఇశ్రాయేలు, “చాలు![a] నా కుమారుడు యోసేపు ఇంకా జీవించి ఉన్నాడు. నేను చనిపోయే ముందు వెళ్లి అతణ్ణి చూస్తాను” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఇది చాలు.” ఇక్కడ హీబ్రూ పదం רַב చాలుదనాన్ని తెలిపే ఉద్గారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... అన్నాడు
  rationale: వయ్యిక్తోల్ కథన ప్రవాహాన్ని సహజమైన ఆధునిక తెలుగు కథన శైలిలో ముందుకు తీసుకెళ్తుంది; క్రమాన్ని అతిగా నిర్దిష్టం చేయదు.
- source_word: יִשְׂרָאֵל
  choice: ఇశ్రాయేలు
  rationale: మూలపాఠంలో ‘యాకోబు’ కాకుండా ‘ఇశ్రాయేలు’ అని స్పష్టంగా ఉంది; అందువల్ల అదే పేరును నిలుపుకున్నాం.
- source_word: רַב
  choice: చాలు!
  rationale: ఈ సందర్భంలో ఇది చాలుదనాన్ని ప్రకటించే ఉద్వేగభరిత ఉద్గారం. ‘చాలు!’ సంక్షిప్తంగా, సహజంగా దాని భావబలాన్ని అందిస్తుంది.
- source_word: עוֹד
  choice: ఇంకా
  rationale: חָיతో కలిసి యోసేపు జీవించి ఉండటం కొనసాగుతోందనే భావాన్ని తెలియజేస్తుంది.
- source_word: בְּנִי
  choice: నా కుమారుడు
  rationale: స్వామ్యార్థాన్ని, తండ్రీకొడుకుల వ్యక్తిగత అనుబంధాన్ని నేరుగా నిలుపుతుంది.
- source_word: חָי
  choice: బతికే ఉన్నాడు
  rationale: ‘జీవించి ఉన్నాడు’ కంటే సాధారణ పాఠకులకు సహజంగా ఉండి, ‘నిజంగా ఇంకా బతికే ఉన్నాడు’ అనే సందర్భోచిత ఉద్ఘాటనను తెలియజేస్తుంది.
- source_word: אֵלְכָה
  choice: నేను ... వెళ్లి
  rationale: కోహోర్టేటివ్ రూపంలోని దృఢ సంకల్పాన్ని తెలుగు భవిష్యదర్థ వాక్యనిర్మాణంలో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: וְאֶרְאֶנּוּ
  choice: అతణ్ణి చూస్తాను
  rationale: మూడవ పురుష ఏకవచన కర్మప్రత్యయంతో ఉన్న ‘చూడు’ అనే సరళ భావాన్ని ఆధునిక తెలుగులో నేరుగా అందిస్తుంది.
- source_word: בְּטֶרֶם
  choice: చనిపోకముందే
  rationale: తరువాత సంభవించబోయే మరణానికి ముందు అనే కాలసంబంధాన్ని తెలియజేస్తుంది; ‘-ఏ’ అతని తక్షణ సంకల్పాన్ని సహజంగా బలపరుస్తుంది.
- source_word: אָמוּת
  choice: నేను చనిపో
  rationale: మరణించడాన్ని సూచించే ప్రథమ పురుష క్రియను ఉపవాక్య నిర్మాణానికి తగిన తెలుగులో అందిస్తుంది.
