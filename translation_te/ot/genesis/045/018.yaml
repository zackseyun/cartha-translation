- from: మీ తండ్రిని, మీ కుటుంబాలవారిని తీసుకొని నా దగ్గరికి రండి. నేను మీకు ఐగుప్తు దేశంలోని శ్రేష్ఠమైన భాగాన్ని ఇస్తాను; మీరు దేశంలోని సారవంతమైన సంపదను అనుభవిస్తారు.[a]
  to: మీ తండ్రిని, మీ ఇంటివారిని తీసుకొని నా దగ్గరికి రండి. నేను మీకు ఐగుప్తు దేశంలోని అత్యుత్తమమైన వాటిని ఇస్తాను; మీరు దేశపు సారాన్ని అనుభవిస్తారు.[a]
