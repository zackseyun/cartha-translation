base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/018.yaml
  text: Take your father and your households[a], and come to me, and I will give you the best of the land of Egypt, and you shall eat the fat of the land.
translation:
  language: te
  text: మీ తండ్రిని, మీ ఇంటివారిని తీసుకొని నా దగ్గరికి రండి. నేను మీకు ఐగుప్తు దేశంలోని అత్యుత్తమమైన వాటిని ఇస్తాను; మీరు దేశపు సారాన్ని అనుభవిస్తారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “దేశపు కొవ్వును తింటారు”; ఇది దేశంలోని అత్యుత్తమమైన, సమృద్ధిగల వాటిని అనుభవించడాన్ని సూచించే హీబ్రూ నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּקְחוּ
  choice: తీసుకొని
  rationale: לקח అనే క్రియ యొక్క బహువచన ఆజ్ఞారూపం. తండ్రిని, కుటుంబాలవారిని వెంట తీసుకురావాలనే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: אֲבִיכֶם
  choice: మీ తండ్రిని
  rationale: రెండవ పురుష బహువచన ప్రత్యయంతో ఉన్న ఏకవచన నామం; ఇక్కడ యాకోబును సూచిస్తుంది.
- source_word: בָּתֵּיכֶם
  choice: మీ కుటుంబాలవారిని
  rationale: అక్షరార్థంగా ‘మీ ఇళ్లను’ అయినా, సందర్భంలో בית అనేది ఇంటివారిని లేదా కుటుంబ సమూహాన్ని సూచిస్తుంది. ‘కుటుంబాలవారిని’ అనేది వ్యక్తులను తీసుకురావాలనే భావాన్ని స్పష్టంగా, సహజంగా అందిస్తుంది.
- source_word: וּבֹאוּ אֵלַי
  choice: నా దగ్గరికి రండి
  rationale: בוא క్రియ యొక్క బహువచన ఆజ్ఞారూపం, אל ఉపసర్గతో కలిసి ‘నా దగ్గరికి రండి’ అనే సూటి భావాన్ని ఇస్తుంది; ‘తిరిగి’ అనే అదనపు భావాన్ని చేర్చలేదు.
- source_word: וְאֶתְּנָה לָכֶם
  choice: నేను మీకు ... ఇస్తాను
  rationale: ఆజ్ఞల తరువాత వచ్చిన נתן రూపం ఇక్కడ వాగ్దానం లేదా హామీని వ్యక్తం చేస్తుంది; తెలుగు భవిష్యత్ రూపం దానిని సహజంగా తెలియజేస్తుంది.
- source_word: טוּב אֶרֶץ מִצְרַיִם
  choice: ఐగుప్తు దేశంలోని శ్రేష్ఠమైన భాగాన్ని
  rationale: טוּב ఇక్కడ దేశపు మేలు, సమృద్ధి లేదా అత్యుత్తమ భాగాన్ని సూచిస్తుంది. ‘శ్రేష్ఠమైన భాగం’ భూభాగం మరియు దాని వనరులు రెండింటినీ సూచించగల మూలంలోని విస్తృతిని నిలుపుతుంది.
- source_word: וְאִכְלוּ
  choice: మీరు ... అనుభవిస్తారు
  rationale: అక్షరార్థంగా ‘తింటారు/తినండి’. חֵלֶב הָאָרֶץ అనే రూపకాలంకారంతో కలిసి దేశపు అత్యుత్తమ సమృద్ధిని పొందడాన్ని సూచిస్తున్నందున, తెలుగులో ‘అనుభవిస్తారు’ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: חֵלֶב הָאָרֶץ
  choice: దేశంలోని సారవంతమైన సంపదను
  rationale: חֵלֶב అక్షరార్థంగా ‘కొవ్వు’; ఇక్కడ దేశంలోని అత్యుత్తమమైన, సమృద్ధిగల భాగానికి వాడిన హీబ్రూ నుడికారం. తెలుగులో అక్షరానువాదం అసహజంగా లేదా అపార్థకంగా ఉండే అవకాశమున్నందున భావాన్ని ప్రధాన పాఠ్యంలో ఇచ్చి, మూల రూపకాన్ని పాదసూచికలో నిలిపాం.
