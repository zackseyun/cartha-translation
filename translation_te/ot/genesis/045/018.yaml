translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని వాడాం. ‘ఐగుప్తు’ అనే సాంప్రదాయ బైబిలు స్థలనామాన్ని నిలిపాం. హీబ్రూ నుడికారాన్ని ప్రధాన పాఠ్యంలో స్పష్టమైన భావంతో అనువదించి, దాని అక్షర రూపాన్ని పాదసూచికలో ఇచ్చాం.
