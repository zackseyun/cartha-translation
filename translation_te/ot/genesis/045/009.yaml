id: GEN.45.9
reference: Genesis 45:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: מַהֲרוּ֮ וַ/עֲל֣וּ אֶל אָבִ/י֒ וַ/אֲמַרְתֶּ֣ם אֵלָ֗י/ו כֹּ֤ה אָמַר֙ בִּנְ/ךָ֣ יוֹסֵ֔ף שָׂמַ֧/נִי אֱלֹהִ֛ים לְ/אָד֖וֹן לְ/כָל מִצְרָ֑יִם רְדָ֥/ה אֵלַ֖/י אַֽל תַּעֲמֹֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/009.yaml
  text: 'Hurry and go up to my father[a], and say to him, ‘Thus says your son Joseph: God has made me lord over all Egypt. Come down to me; do not delay.’'
translation:
  language: te
  text: 'త్వరగా నా తండ్రి దగ్గరికి వెళ్లి, ఆయనకు ఇలా చెప్పండి: ‘మీ కుమారుడు యోసేపు ఇలా చెబుతున్నాడు: దేవుడు నన్ను ఐగుప్తు దేశమంతటిపై అధిపతిగా నియమించాడు. నా దగ్గరికి దిగిరండి; ఆలస్యం చేయవద్దు.’'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַהֲרוּ
  choice: త్వరగా
  rationale: బహువచన ఆజ్ఞలోని అత్యవసర భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: וַעֲלוּ אֶל אָבִי
  choice: నా తండ్రి దగ్గరికి వెళ్లి
  rationale: కనానుకు ‘ఎక్కి వెళ్లడం’ అనే మూలభాష దిశాభావం ఉన్నప్పటికీ, తెలుగులో ‘ఎక్కి వెళ్లండి’ అనడం సందర్భంలో అసహజంగా లేదా భౌతిక ఎక్కుదలగా వినిపించవచ్చు; గమ్యాన్ని స్పష్టంగా, సహజంగా వ్యక్తం చేసింది.
- source_word: וַאֲמַרְתֶּם אֵלָיו
  choice: ఆయనతో ఇలా చెప్పండి
  rationale: వరుస ఆదేశాన్ని మర్యాదపూర్వక బహువచన ఆజ్ఞగా సహజంగా అందిస్తుంది.
- source_word: כֹּה אָמַר
  choice: ఇలా చెబుతున్నాడు
  rationale: దూతవాక్య సూత్రాన్ని ప్రస్తుత తెలుగు ప్రత్యక్ష ఉద్ధరణలో సహజంగా నిలుపుతుంది.
- source_word: בִּנְךָ יוֹסֵף
  choice: మీ కుమారుడు యోసేపు
  rationale: తండ్రిని ఉద్దేశించిన గౌరవ ఏకవచనాన్ని తెలుగులో ‘మీ’తో వ్యక్తం చేస్తూ, కుమార సంబంధంపై మూలంలోని ప్రాధాన్యాన్ని నిలుపుతుంది.
- source_word: שָׂמַנִי אֱלֹהִים
  choice: దేవుడు నన్ను ... చేశాడు
  rationale: שׂים ఇక్కడ ఒక అధికార స్థానంలో ఉంచడం లేదా నియమించడం అనే భావం కలిగి ఉంది; ‘చేశాడు’ తెలుగులో సహజంగా ఆ ఫలితస్థితిని తెలుపుతుంది.
- source_word: לְאָדוֹן לְכָל מִצְרָיִם
  choice: ఐగుప్తు దేశమంతటికీ ప్రభువుగా
  rationale: ఆదోన్ సూచించే అధికారస్థానాన్ని ‘ప్రభువు’ నిలుపుతుంది; ‘దేశమంతటికీ’ ఆ అధికారం మొత్తం ఐగుప్తుపై వ్యాపించిందని తెలుపుతుంది.
- source_word: רְדָה אֵלַי
  choice: నా దగ్గరికి దిగిరండి
  rationale: ఐగుప్తుకు దిగివెళ్లే భౌగోళిక దిశను నిలుపుతూ, యోసేపే గమ్యస్థానం కనుక ‘దిగిరండి’ సహజంగా ఉంటుంది.
- source_word: אַל תַּעֲמֹד
  choice: ఆలస్యం చేయకుండా
  rationale: అక్షరార్థంగా ‘నిలవవద్దు’ అయినా, ఈ సందర్భంలో ఆగిపోక లేదా తాత్సారం చేయక వెంటనే రావాలనే భావం; తెలుగు వాక్యంలో క్రియావిశేషణ రూపం అత్యవసరతను సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: אֱלֹהִים పదానికి అనువాదం
  choice: దేవుడు
  alternative: దేవత
  rationale: క్రియారూపం మరియు యోసేపు ప్రసంగ సందర్భం ఏకవచన దేవుణ్ణే సూచిస్తున్నాయి; ఇది సందర్భంలో స్పష్టమైన అర్థం, సిద్ధాంతపరమైన విస్తరణ కాదు.
- issue: אָדוֹן అనే అధికార బిరుదు
  choice: ప్రభువు
  alternative: అధిపతి
  rationale: యోసేపుకు ఐగుప్తుపై ఇవ్వబడిన అధికారాన్ని మూలంలోని విస్తృత స్థాయి పదంతోనే నిలుపుతుంది; ఇది అతనికి దైవత్వం ఆపాదించడం కాదు, పరిపాలనా అధికారాన్ని సూచిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవసూచక సంబోధన, సహజమైన ఆజ్ఞారూపాలు, మరియు కథనానికి తగిన గంభీరత నిలుపబడ్డాయి. అందించిన ఆంగ్ల పాఠంలో [a] గుర్తు స్థానభ్రంశమైనట్లు కనిపిస్తుంది; దాని వివరణ אַל תַּעֲמֹדకు సంబంధించినది. తెలుగు ప్రధాన పాఠంలో ‘ఆలస్యం చేయకుండా’ భావాన్ని స్పష్టంగా ఇచ్చినందున పాదటిప్పణి అవసరం లేదు.
