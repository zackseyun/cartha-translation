source:
  edition: WLC
  text: וְ/עַתָּ֣ה אַל תֵּעָ֣צְב֗וּ וְ/אַל יִ֨חַר֙ בְּ/עֵ֣ינֵי/כֶ֔ם כִּֽי מְכַרְתֶּ֥ם אֹתִ֖/י הֵ֑נָּה כִּ֣י לְ/מִֽחְיָ֔ה שְׁלָחַ֥/נִי אֱלֹהִ֖ים לִ/פְנֵי/כֶֽם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/005.yaml
  text: And now[a], do not be distressed or angry with yourselves because you sold me here[c][b], for God sent me ahead of you to preserve life.
translation:
  language: te
  text: ఇప్పుడు, మీరు నన్ను ఇక్కడికి అమ్మివేసినందుకు దుఃఖపడకండి; మీరే మీపై కోపపడకండి.[a] ఎందుకంటే ప్రాణాలను కాపాడటానికి[b] దేవుడు నన్ను మీకు ముందుగా పంపించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “మీ కళ్లలో మండనివ్వకండి”; ఇది కోపపడడం లేదా అసంతృప్తి చెందడాన్ని సూచించే నుడికారం.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ప్రాణరక్షణ కోసం.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: ఇప్పుడు
  rationale: యోసేపు ప్రస్తుత విజ్ఞప్తిని పరిచయం చేసే సంభాషణ సూచకం. ఆధునిక తెలుగులో ‘ఇప్పుడు’ సహజంగా ఉండి కాలసూచక భావాన్ని నిలుపుతుంది.
- source_word: אַל תֵּעָצְבוּ
  choice: దుఃఖపడకండి
  rationale: עצב ఇక్కడ మనోవేదన లేదా దుఃఖాన్ని సూచిస్తుంది. ‘దుఃఖపడకండి’ సాధారణ పాఠకులకు స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: וְאַל יִחַר בְּעֵינֵיכֶם
  choice: మీ మీద మీరే కోపపడకండి
  rationale: అక్షరార్థంగా ‘మీ కళ్లలో మండనివ్వకండి’ అనే హీబ్రూ నుడికారం కోపం లేదా అసంతృప్తిని సూచిస్తుంది. సందర్భంలో సహోదరులు తమ చర్యను బట్టి తమను తాము నిందించుకోవడం ఉద్దేశించబడింది.
- source_word: כִּי מְכַרְתֶּם אֹתִי הֵנָּה
  choice: మీరు నన్ను ఇక్కడికి అమ్మివేసినందుకు
  rationale: כִּי నిషేధానికి కారణాన్ని తెలియజేస్తుంది; הֵנָּה గమ్యస్థాన భావంతో ‘ఇక్కడికి’ అని సహజంగా అనువదించబడింది.
- source_word: לְמִחְיָה
  choice: ప్రాణాలను నిలబెట్టడానికి
  rationale: מִחְיָה జీవరక్షణ లేదా మనుగడను సూచిస్తుంది. ఉద్దేశార్థక לְ ను ‘నిలబెట్టడానికి’ స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: שְׁלָחַנִי אֱלֹהִים
  choice: దేవుడు నన్ను ... పంపించాడు
  rationale: హీబ్రూ సంపూర్ణ క్రియను కథన సందర్భంలో భూతకాలంగా సహజంగా వ్యక్తపరుస్తూ, దైవ కార్యాన్ని క్రియాశీలంగా ఉంచుతుంది.
- source_word: לִפְנֵיכֶם
  choice: మీకు ముందుగా
  rationale: స్థానపరమైన, కాలపరమైన ముందస్తు భావాలు రెండింటినీ తెలుగులో సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: దైవ నిర్వహణ మరియు మానవ బాధ్యత
  choice: ‘మీరు నన్ను ... అమ్మివేసినందుకు’ అనే సహోదరుల చర్యనూ, ‘దేవుడు నన్ను ... పంపించాడు’ అనే దేవుని ఉద్దేశపూర్వక కార్యాన్నీ రెండింటినీ స్పష్టంగా నిలిపాం.
  alternative: సహోదరుల చర్యను ‘పంపివేశారు’ అని మృదువుపరచడం లేదా దేవుని కార్యాన్ని కేవలం అనుమతిగా చూపడం.
  rationale: హీబ్రూ వాక్యం మానవ చర్యను, దైవ కార్యాన్ని పక్కపక్కనే ఉంచుతుంది. వాటి మధ్య ఉన్న వేదాంతపరమైన ఉద్వేగాన్ని పరిష్కరించకుండా అనువాదం నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన బహువచన సంబోధనను, సరళమైనప్పటికీ హుందాగా ఉండే కథన శైలిని ఉపయోగించాం. హీబ్రూ నుడికారాన్ని ప్రధాన పాఠ్యంలో సహజీకరించి, దాని అక్షరార్థాన్ని పాదసూచికలో నిలిపాం.
