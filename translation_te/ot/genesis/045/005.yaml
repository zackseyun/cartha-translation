review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately retains both clauses of agency: the brothers sold Joseph, and God sent him ahead of them. ‘ఇక్కడికి’ appropriately reflects the directional/deictic force of הֵנָּה in context, and ‘మీకు ముందుగా’ conveys לִפְנֵיכֶם. The purpose clause is retained, but ‘ప్రాణాలను నిలబెట్టడానికి’ is less idiomatic Telugu than a direct expression of preserving life.'
  naturalness: The wording is generally clear and modern. ‘మీరే మీపై కోపపడకండి’ is smoother than ‘మీ మీద మీరే కోపపడకండి,’ and ‘ప్రాణాలను కాపాడటానికి’ is more natural standard Telugu than ‘ప్రాణాలను నిలబెట్టడానికి.’
  terminology: ‘దుఃఖపడకండి,’ ‘అమ్మివేసినందుకు,’ and ‘దేవుడు ... పంపించాడు’ are accurate and appropriately dignified. ‘ప్రాణాలను కాపాడటానికి’ preserves the life-preserving purpose without importing a doctrinal interpretation.
  issues:
  - severity: low
    issue: The purpose expression ‘ప్రాణాలను నిలబెట్టడానికి’ is somewhat unnatural in modern standard Telugu.
    rationale: While understandable, Telugu normally expresses preservation of life as ‘ప్రాణాలను కాపాడటానికి’ or ‘ప్రాణరక్షణ కోసం.’ The former retains the verbal purpose construction of לְמִחְיָה more naturally.
  - severity: low
    issue: The reflexive wording for anger can be smoother.
    rationale: ‘మీరే మీపై కోపపడకండి’ is a more natural Telugu expression for being angry with oneself while preserving the contextual sense of the Hebrew idiom.
  revised_text: ఇప్పుడు, మీరు నన్ను ఇక్కడికి అమ్మివేసినందుకు దుఃఖపడకండి; మీరే మీపై కోపపడకండి.[a] ఎందుకంటే ప్రాణాలను కాపాడటానికి[b] దేవుడు నన్ను మీకు ముందుగా పంపించాడు.
