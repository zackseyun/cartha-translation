- from: ఇప్పుడు, మీరు నన్ను ఇక్కడికి అమ్మివేసినందుకు దుఃఖపడకండి; మీ మీద మీరే కోపపడకండి.[a] ఎందుకంటే ప్రాణాలను నిలబెట్టడానికి[b] దేవుడు నన్ను మీకు ముందుగా పంపించాడు.
  to: ఇప్పుడు, మీరు నన్ను ఇక్కడికి అమ్మివేసినందుకు దుఃఖపడకండి; మీరే మీపై కోపపడకండి.[a] ఎందుకంటే ప్రాణాలను కాపాడటానికి[b] దేవుడు నన్ను మీకు ముందుగా పంపించాడు.
  rationale: Small stylistic revisions improve modern Telugu idiom while maintaining the Hebrew sequence, causal relationship, purpose clause, and the juxtaposition of human responsibility with God’s active sending. The footnote anchor remains attached to the idiomatic anger expression, and the alternative for לְמִחְיָה is retained.
