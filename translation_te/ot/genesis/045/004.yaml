review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately represents the sequential actions, Joseph’s polite invitation to approach, the brothers’ response, and the identifying statement including their sale of him to Egypt. However, the final Telugu identification clause is syntactically unclear: “నేను ... యోసేపును—మీరు ... అమ్మినవాణ్ణి” can sound like an accusative/fragmented construction rather than Joseph’s direct self-identification.'
  naturalness: The narrative is generally natural modern standard Telugu. Recasting the final speech into two short, direct clauses makes the revelation idiomatic and unambiguous while retaining the Hebrew’s direct accusation.
  terminology: ‘యోసేపు’ and ‘ఐగుప్తు’ are standard Telugu biblical forms. ‘సోదరులు/సోదరుడు’ is appropriate and slightly more natural in this context than repeatedly using the more formal ‘సహోదరులు.’ No theological terminology is at issue.
  issues:
  - severity: medium
    issue: The phrase “నేను మీ సహోదరుడైన యోసేపును—మీరు ఐగుప్తుకు అమ్మినవాణ్ణి” is grammatically and syntactically awkward.
    rationale: The accusative-looking predicate and the following relative phrase obscure the simple Hebrew assertion, ‘I am Joseph, your brother, whom you sold into Egypt.’ A direct Telugu self-identification followed by ‘మీరు నన్ను ... అమ్మారు’ communicates the same meaning clearly.
  revised_text: అప్పుడు యోసేపు తన సోదరులతో, “దయచేసి నా దగ్గరికి రండి” అన్నాడు. వారు అతని దగ్గరికి వచ్చారు. అప్పుడు అతడు, “నేనే మీ సోదరుడైన యోసేపును; మీరు నన్ను ఐగుప్తుకు అమ్మారు” అన్నాడు.
  revised_footnotes: []
  revision_rationale: The revision preserves every source element and the repeated approach language, while resolving the unclear final appositional construction. Dividing the final identification into a statement of identity and a direct statement of what the brothers did is natural modern Telugu and does not add interpretive content.
