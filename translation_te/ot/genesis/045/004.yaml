id: GEN.45.4
reference: Genesis 45:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יוֹסֵ֧ף אֶל אֶחָ֛י/ו גְּשׁוּ נָ֥א אֵלַ֖/י וַ/יִּגָּ֑שׁוּ וַ/יֹּ֗אמֶר אֲנִי֙ יוֹסֵ֣ף אֲחִי/כֶ֔ם אֲשֶׁר מְכַרְתֶּ֥ם אֹתִ֖/י מִצְרָֽיְמָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/004.yaml
  text: Then Joseph said to his brothers, “Please come near to me.” And they came near. Then he said, “I am Joseph, your brother, whom you sold into Egypt.”
translation:
  language: te
  text: అప్పుడు యోసేపు తన సోదరులతో, “దయచేసి నా దగ్గరికి రండి” అన్నాడు. వారు అతని దగ్గరికి వచ్చారు. అప్పుడు అతడు, “నేనే మీ సోదరుడైన యోసేపును; మీరు నన్ను ఐగుప్తుకు అమ్మారు” అన్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... అన్నాడు
  rationale: వావ్-క్రమరూపం కథనాన్ని ముందుకు నడిపిస్తుంది; ఆధునిక తెలుగులో ‘అప్పుడు’ దాని క్రమబద్ధమైన భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: אֶל־אֶחָיו
  choice: తన సహోదరులతో
  rationale: ఆח్ బహువచనానికి తృతీయ పురుష ఏకవచన ప్రత్యయం కలసి ‘అతని సహోదరులు’ అని అర్థమిస్తుంది; తెలుగు మాటల సందర్భంలో ‘తన సహోదరులతో’ సహజంగా ఉంటుంది.
- source_word: גְּשׁוּ נָא אֵלַי
  choice: దయచేసి నా దగ్గరికి రండి
  rationale: נגשׁ సమీపించడం లేదా దగ్గరికి రావడం; נָא మర్యాదపూర్వకమైన విజ్ఞప్తిని సూచిస్తుంది. పోలిక భావాన్ని చేర్చకుండా మూలార్థాన్ని నిలుపుతుంది.
- source_word: וַיִּגָּשׁוּ
  choice: వారు అతని దగ్గరికి వచ్చారు
  rationale: ముందటి ఆజ్ఞలోని נגשׁ పదాన్నే పునరావృతం చేసిన హీబ్రూ నిర్మాణాన్ని ‘దగ్గరికి’ అని మళ్లీ వాడి నిలిపింది; ‘అతని’ అనేది తెలుగు సందర్భస్పష్టత కోసం.
- source_word: אֲנִי יוֹסֵף
  choice: నేను ... యోసేపును
  rationale: హీబ్రూలో క్రియలేని గుర్తింపు వాక్యాన్ని సహజమైన తెలుగు నామవిభక్తితో అందించింది; ‘యోసేపు’ ప్రామాణిక తెలుగు రూపం.
- source_word: אֲחִיכֶם
  choice: మీ సహోదరుడైన
  rationale: ఏకవచన నామానికి ద్వితీయ పురుష బహువచన ప్రత్యయం ఉంది; యోసేపు వారితో తన బంధుత్వాన్ని నేరుగా గుర్తుచేస్తున్నాడు.
- source_word: אֲשֶׁר מְכַרְתֶּם אֹתִי
  choice: మీరు ... అమ్మినవాణ్ణి
  rationale: సాపేక్ష ఉపవాక్యంలోని ప్రత్యక్షమైన, వ్యక్తిగత ఆరోపణను తెలుగు సహజ నిర్మాణంలో కాపాడుతుంది; మూలంలో లేని అదనపు తీవ్రతను చేర్చదు.
- source_word: מִצְרָיְמָה
  choice: ఐగుప్తుకు
  rationale: దిశను సూచించే -ה ప్రత్యయం ఐగుప్తు వైపు గమ్యాన్ని తెలియజేస్తుంది; తెలుగులో ‘ఐగుప్తుకు’ దీనిని సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. గెషూ/వయ్యిగ్గాషూ పునరుక్తిని ‘దగ్గరికి రండి/దగ్గరికి వచ్చారు’గా నిలిపి, యోసేపు వెల్లడిలోని ఉద్వేగాన్ని సంక్షిప్తంగా కాపాడింది.
