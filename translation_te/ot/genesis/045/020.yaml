  register: సాధారణ పాఠకులకు అర్థమయ్యే ఆధునిక ప్రామాణిక తెలుగు; ఆజ్ఞలో గౌరవబహువచనం వాడబడింది. మూలంలోని నుడికారాన్ని ప్రధాన వాక్యంలో సహజీకరించి, పాదసూచికలో అక్షరార్థాన్ని ఇచ్చాం.
