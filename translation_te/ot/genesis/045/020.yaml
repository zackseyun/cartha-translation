source:
  edition: WLC
  text: וְ/עֵ֣ינְ/כֶ֔ם אַל תָּחֹ֖ס עַל כְּלֵי/כֶ֑ם כִּי ט֛וּב כָּל אֶ֥רֶץ מִצְרַ֖יִם לָ/כֶ֥ם הֽוּא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/020.yaml
  text: And do not let your eye spare your belongings[b][a], for all the best of the land of Egypt is yours.
translation:
  language: te
  text: మీ సామాన్ల గురించి దిగులుపడకండి[a]. ఎందుకంటే ఐగుప్తు దేశమంతటిలోని శ్రేష్ఠమైనది మీ సొంతం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “మీ కన్ను మీ సామాన్లపై జాలిపడనివ్వకండి.” అంటే వాటిని వదిలివెళ్లడం గురించి విచారించవద్దు లేదా వాటిపై మమకారం చూపవద్దు.
    reason: హీబ్రూ నుడికారంలోని దృశ్యరూపాన్ని, దాని భావపరిధిని తెలియజేయడానికి.
lexical_decisions:
- source_word: וְעֵינְכֶם אַל־תָּחֹס עַל
  choice: దిగులుపడకండి
  rationale: ‘మీ కన్ను జాలిపడనివ్వకండి’ అనే హీబ్రూ నుడికారానికి, వదిలివెళ్లే వస్తువుల గురించి విచారించవద్దు లేదా మమకారం చూపవద్దు అనే భావం ఉంది. ప్రధాన వాక్యంలో సహజమైన ఆధునిక తెలుగు వాడి, మూలంలోని దృశ్యరూపాన్ని పాదసూచికలో నిలిపాం.
- source_word: כְּלֵיכֶם
  choice: మీ సామాన్ల గురించి
  rationale: כְּלִי అనే పదం పాత్రలు, ఉపకరణాలు, వస్తువులు లేదా ఆస్తిసామగ్రిని సూచించగలదు. ప్రయాణ సందర్భంలో ‘సామాన్లు’ విస్తృతమైన, సహజమైన తెలుగు సమానార్థకం.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందున్న ఆజ్ఞకు కారణాన్ని పరిచయం చేసే సంధానపదంగా స్పష్టంగా, సహజంగా ఉంది.
- source_word: טוּב כָּל־אֶרֶץ מִצְרַיִם
  choice: ఐగుప్తు దేశమంతటిలోని శ్రేష్ఠమైనది
  rationale: ఇక్కడ טוּב నైరూప్యమైన ‘మంచితనం’ కంటే దేశం అందించే మేలైన సంపద లేదా ఫలసాయాన్ని సూచిస్తుంది. ఏకవచన సమాహార భావాన్ని ‘శ్రేష్ఠమైనది’ నిలుపుతుంది.
- source_word: לָכֶם הוּא
  choice: మీ సొంతం
  rationale: లామెద్‌తో కూడిన సర్వనామం మరియు הוּא కలసి స్వాధీనతను, భరోసాను వ్యక్తం చేస్తున్నాయి; ‘మీ సొంతం’ దీనిని సహజంగా తెలియజేస్తుంది.
