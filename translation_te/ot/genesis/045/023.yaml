  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. హీబ్రూ వాక్యంలోని ముందుంచిన ‘తన తండ్రికి’ అనే అంశాన్ని నిలిపి, తెలుగులో జాబితా స్పష్టత కోసం చివర ‘పంపాడు’ను పునరుక్తి చేశాం.
