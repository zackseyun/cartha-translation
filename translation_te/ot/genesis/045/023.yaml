id: GEN.45.23
reference: Genesis 45:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/לְ/אָבִ֞י/ו שָׁלַ֤ח כְּ/זֹאת֙ עֲשָׂרָ֣ה חֲמֹרִ֔ים נֹשְׂאִ֖ים מִ/טּ֣וּב מִצְרָ֑יִם וְ/עֶ֣שֶׂר אֲתֹנֹ֡ת נֹֽ֠שְׂאֹת בָּ֣ר וָ/לֶ֧חֶם וּ/מָז֛וֹן לְ/אָבִ֖י/ו לַ/דָּֽרֶךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/023.yaml
  text: 'And to his father he sent this: ten donkeys carrying some of the best things of Egypt[a], and ten female donkeys carrying grain and bread and provisions for his father for the journey.'
translation:
  language: te
  text: 'తన తండ్రికి అతడు ఇలా పంపాడు: ఐగుప్తులోని శ్రేష్ఠమైన వాటిలో కొన్నింటిని[a] మోస్తున్న పది గాడిదలను, ధాన్యాన్ని, రొట్టెను, ప్రయాణానికి తన తండ్రికి కావలసిన ఆహార సామగ్రిని మోస్తున్న పది ఆడ గాడిదలను.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఐగుప్తు శ్రేష్ఠమైన వాటిలో కొంత”; “ఐగుప్తు సమృద్ధిలో కొంత.”
    reason: మִטּוּב מִצְרָיִם అనే పదబంధం ఐగుప్తులోని అత్యుత్తమ వస్తువులలో కొంతను, లేదా ఐగుప్తు సమృద్ధి/మేలైన దిగుబడిలో కొంతను సూచించవచ్చు.
lexical_decisions:
- source_word: כְּזֹאת
  choice: ఇలా
  rationale: పంపిన వస్తువుల జాబితాను పరిచయం చేసే హీబ్రూ ప్రయోగాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: חֲמֹרִים
  choice: గాడిదలు
  rationale: సాధారణ, స్పష్టమైన ఆధునిక తెలుగు పదం.
- source_word: נֹשְׂאִים / נֹשְׂאֹת
  choice: మోస్తున్న
  rationale: జంతువులు వస్తువులను రవాణా చేస్తున్నాయని తెలిపే కృదంత భావాన్ని నేరుగా నిలుపుతుంది.
- source_word: מִטּוּב מִצְרָיִם
  choice: ఐగుప్తులోని శ్రేష్ఠమైన వాటిలో కొన్నింటిని
  rationale: טוּב యొక్క శ్రేష్ఠత/సమృద్ధి భావాన్ని, అలాగే מִן యొక్క భాగార్థాన్ని నిలుపుతుంది; వస్తువులు ఏవో అనవసరంగా నిర్దిష్టం చేయదు.
- source_word: אֲתֹנֹת
  choice: ఆడ గాడిదలు
  rationale: మొదటి సాధారణ పదానికి భిన్నంగా మూలపాఠం ప్రత్యేకంగా సూచించిన ఆడ జంతువులను స్పష్టంగా తెలుపుతుంది.
- source_word: בָּר
  choice: ధాన్యం
  rationale: నిర్దిష్ట ధాన్యజాతిని ఊహించకుండా సాధారణ అర్థాన్ని నిలుపుతుంది.
- source_word: לֶחֶם
  choice: రొట్టె
  rationale: సాధారణ ప్రత్యక్ష అర్థాన్ని నిలుపుతూ తరువాతి విస్తృత పదమైన ఆహార సామగ్రి నుంచి వేరు చేస్తుంది.
- source_word: מָזוֹן
  choice: ఆహార సామగ్రి
  rationale: ప్రయాణానికి అవసరమైన పోషక ఆహార సరఫరాల భావాన్ని సహజంగా అందిస్తుంది.
- source_word: לַדָּרֶךְ
  choice: ప్రయాణంలో ... కావలసిన
  rationale: సరఫరాలు ప్రయాణ వినియోగం కోసం అన్న ఉద్దేశాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
