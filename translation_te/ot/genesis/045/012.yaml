source:
  edition: WLC
  text: וְ/הִנֵּ֤ה עֵֽינֵי/כֶם֙ רֹא֔וֹת וְ/עֵינֵ֖י אָחִ֣/י בִנְיָמִ֑ין כִּי פִ֖/י הַֽ/מְדַבֵּ֥ר אֲלֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/012.yaml
  text: And look[a], your eyes see—and the eyes of my brother Benjamin—that it is my mouth that is speaking to you.
translation:
  language: te
  text: ఇదిగో[a], నా నోరే మీతో మాట్లాడుతున్నదని మీ కళ్లూ, నా తమ్ముడు బెన్యామీను కళ్లూ చూస్తున్నాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, మరింత అక్షరార్థంగా: “ఇదిగో, మీ కళ్లూ, నా తమ్ముడు బెన్యామీను కళ్లూ చూస్తున్నాయి—మీతో మాట్లాడుతున్నది నా నోరేనని.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: శ్రోతల దృష్టిని బలంగా ఆకర్షించే హీబ్రూ సంభాషణాత్మక సూచనను సహజమైన, గౌరవప్రదమైన తెలుగులో నిలుపుతుంది.
- source_word: עֵינֵיכֶם רֹאוֹת
  choice: మీ కళ్లూ ... చూస్తున్నాయి
  rationale: ప్రత్యక్ష దృశ్య నిర్ధారణను నొక్కిచెప్పే శరీరావయవ రూపకాన్ని అలాగే ఉంచి, వర్తమానంలో కొనసాగుతున్న గ్రహింపును సహజంగా వ్యక్తపరుస్తుంది.
- source_word: וְעֵינֵי אָחִי בִנְיָמִין
  choice: నా తమ్ముడు బెన్యామీను కళ్లూ
  rationale: ‘మీ కళ్లూ’ అనే సమాంతర నిర్మాణాన్ని కాపాడుతుంది. సందర్భంలో బెన్యామీను యోసేపు కన్నా చిన్నవాడు కాబట్టి ఆధునిక తెలుగులో సహజమైన ‘తమ్ముడు’ను ఎంచుకుంది.
- source_word: כִּי
  choice: అని
  rationale: వారి కళ్లకు స్పష్టమవుతున్న విషయాన్ని పరిచయం చేసే content-clause సూచకంగా ఇక్కడ సహజంగా సరిపోతుంది.
- source_word: פִי
  choice: నా నోరే
  rationale: యోసేపే నేరుగా మాట్లాడుతున్నాడనే ఉద్ఘాటన కోసం హీబ్రూలోని స్పష్టమైన ‘నా నోరు’ను నిలిపి, ‘ఏ’తో దృష్టిని బలపరుస్తుంది.
- source_word: הַמְדַבֵּר אֲלֵיכֶם
  choice: మీతో మాట్లాడుతున్నదని
  rationale: నిర్దిష్ట ఆర్టికల్‌తో ఉన్న కృదంతం సూచించే ప్రస్తుత ప్రత్యక్ష చర్యను సహజమైన తెలుగు వాక్యనిర్మాణంలో అందిస్తుంది.
