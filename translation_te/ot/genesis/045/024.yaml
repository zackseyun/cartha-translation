  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. మూలంలోని వరుస క్రియలను స్పష్టంగా ఉంచి, సందిగ్ధమైన רגז పదానికి సందర్భోచిత ప్రధాన అనువాదంతో పాటు ప్రత్యామ్నాయ భావాలను పాదసూచికలో సంరక్షించాం.
