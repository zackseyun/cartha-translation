  yaml_path: translation/ot/genesis/045/024.yaml
  text: Then he sent his brothers away[a], and they departed; and he said to them, “Do not quarrel on the way.”
translation:
  language: te
  text: అప్పుడు యోసేపు తన సోదరులను పంపివేశాడు; వారు బయలుదేరారు. అతడు వారితో, “దారిలో ఒకరితో ఒకరు కలహించుకోవద్దు[a]” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆందోళన చెందవద్దు,” “కోపపడవద్దు,” లేదా “దారిలో భయపడవద్దు.” ఇక్కడి హెబ్రీ క్రియ వివిధ రకాల భావోద్వేగ కలవరాన్ని సూచించగలదు. యోసేపు తన సంగతి వెల్లడించిన తరువాత సోదరులు కలిసి ప్రయాణిస్తున్న సందర్భంలో “ఒకరితో ఒకరు కలహించుకోవద్దు” అనేది తగిన భావం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְשַׁלַּח
  choice: పంపివేశాడు
  rationale: పియేల్ రూపం వారిని తన సమక్షం నుండి బయలుదేరేలా పంపడాన్ని సూచిస్తుంది; ‘పంపివేశాడు’ ఈ భావాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: אֶת־אֶחָיו
  choice: తన సోదరులను
  rationale: కుటుంబ సంబంధాన్ని తెలిపే హెబ్రీ పదాన్ని సందర్భానుసారంగా నేరుగా అనువదిస్తుంది.
- source_word: וַיֵּלֵכוּ
  choice: వారు బయలుదేరారు
  rationale: ముందటి పంపివేతకు అనుసరించిన ప్రయాణారంభాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וַיֹּאמֶר אֲלֵהֶם
  choice: అతడు వారితో ... అన్నాడు
  rationale: హెబ్రీ సాధారణ సంభాషణ సూత్రానికి సహజమైన తెలుగు రూపం.
- source_word: אַל
  choice: వద్దు
  rationale: నిషేధార్థక హెబ్రీ అవ్యయానికి తెలుగు ఆజ్ఞార్థక నిషేధ రూపం.
- source_word: תִּרְגְּזוּ
  choice: ఒకరితో ఒకరు కలహించుకోవద్దు
  rationale: רגז భావోద్వేగ కలవరాన్ని, కోపాన్ని, భయాన్ని లేదా వణుకును సూచించగలదు. యోసేపు విషయం బయలుపడిన తరువాత సోదరులు కలిసి ప్రయాణిస్తున్న తక్షణ సందర్భంలో పరస్పర కలహం అనే భావం సముచితంగా ఉంది; పదంలోని విస్తృత అనిశ్చితిని పాదసూచికలో నిలిపాం.
- source_word: בַּדָּרֶךְ
  choice: దారిలో
  rationale: కనానుకు తిరుగు ప్రయాణంలో ఉన్న మార్గాన్ని సంక్షిప్తంగా, సహజంగా సూచిస్తుంది.
