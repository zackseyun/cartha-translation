id: GEN.45.16
reference: Genesis 45:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הַ/קֹּ֣ל נִשְׁמַ֗ע בֵּ֤ית פַּרְעֹה֙ לֵ/אמֹ֔ר בָּ֖אוּ אֲחֵ֣י יוֹסֵ֑ף וַ/יִּיטַב֙ בְּ/עֵינֵ֣י פַרְעֹ֔ה וּ/בְ/עֵינֵ֖י עֲבָדָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/016.yaml
  text: The report was heard in Pharaoh’s house[a], saying[b], “Joseph’s brothers have come,” and it was pleasing in the eyes of Pharaoh and in the eyes of his servants.
translation:
  language: te
  text: “యోసేపు సోదరులు వచ్చారు” అనే వార్త ఫరో ఇంటిలో వినబడింది. అది ఫరోకు, అతని సేవకులకు సంతోషం కలిగించింది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַקֹּל נִשְׁמַע
  choice: వార్త ... వినబడింది
  rationale: కּוֹל అనే పదానికి అక్షరార్థంగా ‘శబ్దం/స్వరం’ ఉన్నా, తరువాత వచ్చే సమాచార వాక్యం దృష్ట్యా ఇక్కడ ‘వార్త’ సహజమైన సందర్భార్థం. נִשְׁמַע యొక్క నిఫాల్ నిష్క్రియ రూపాన్ని ‘వినబడింది’ నిలుపుతుంది.
- source_word: בֵּית פַּרְעֹה
  choice: ఫరో ఇంటిలో
  rationale: ‘ఫరో గృహంలో’ అనే మూల నిర్మాణానికి సన్నిహితమైన, ఆధునిక తెలుగులో సహజమైన రూపం. ‘రాజసభలో’ అనడం సందర్భోచితమైనా మరింత వ్యాఖ్యానాత్మకం.
- source_word: לֵאמֹר
  choice: అనే
  rationale: వార్తలోని విషయాన్ని పరిచయం చేసే హెబ్రీ సూచకాన్ని తెలుగులో సహజంగా ‘అనే’ ద్వారా వ్యక్తం చేస్తుంది; అక్షరానువాదమైన ‘అంటూ’ ఇక్కడ కొంత అసహజంగా ఉంటుంది.
- source_word: בָּאוּ
  choice: వచ్చారు
  rationale: పూర్తయిన రాకను, వారు ఇప్పుడు అక్కడ ఉన్నారనే సందర్భాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: אֲחֵי יוֹסֵף
  choice: యోసేపు సోదరులు
  rationale: హెబ్రీ సమాస సంబంధాన్ని తెలుగులో సహజమైన స్వామ్య నిర్మాణంతో అందిస్తుంది.
- source_word: וַיִּיטַב בְּעֵינֵי
  choice: సంతోషం కలిగించింది
  rationale: ‘వారి కళ్లలో మంచిదైంది’ అనే హెబ్రీ నుడికారానికి సందర్భానుగుణమైన సహజ తెలుగు. ఈ వార్త వారికి అనుకూలంగా, సంతోషకరంగా అనిపించిందనే భావాన్ని అందిస్తుంది.
- source_word: עֲבָדָיו
  choice: అతని సేవకులు
  rationale: עֶבֶד యొక్క విస్తృత అర్థాన్ని నేరుగా నిలుపుతుంది. రాజసభ సందర్భంలో అధికారులు లేదా పరిచారకులు కావచ్చుగాని, హోదాను అతిగా నిర్దిష్టం చేయదు.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడబడింది. హెబ్రీ నిష్క్రియ రూపం మొదటి వాక్యంలో నిలుపబడగా, ‘బְּעֵינֵי’ నుడికారం పదప్రతిపదార్థంగా కాక సహజమైన తెలుగు భావంతో అనువదించబడింది.
