translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘అన్నదమ్ములు’ కంటే ‘సోదరులు’ ఎంచుకోవడం ద్వారా వారిలో వయోక్రమాన్ని మూలం చెప్పనప్పుడు అదనంగా నిర్ధారించకుండా నివారించబడింది. మూలంలోని וְאַחֲרֵי כֵן తరువాతే వచ్చే వాక్య భాగానికి ‘ఆ తరువాత’ అన్వయించబడింది; ఇక్కడ పాదసూచిక అవసరం లేదు, ఎందుకంటే ‘అతనితో మాట్లాడారు’ హెబ్రీయ భాషలోని సహజ భావాన్ని నేరుగా నిలుపుతుంది.
