review_pass:
  verdict: revise
  source_fidelity: The draft correctly renders Joseph's kissing of all his brothers, his weeping, the temporal sequence, and the brothers' subsequent speech with him. However, “వారిపై పడి” normally conveys falling onto/attacking someone in modern Telugu and is stronger and less precise than the Hebrew context warrants. The preposition עַל here depicts Joseph weeping upon/over his brothers in close embrace.
  naturalness: The narrative is otherwise clear and appropriately modern. Replacing the potentially misleading physical idiom with “వారిని ఆనుకొని” gives a natural Telugu portrayal of intimate, tearful reconciliation.
  terminology: “సోదరులు” appropriately retains the source's non-specific brother terminology without importing a birth-order distinction. “ముద్దుపెట్టుకొని” and “అతనితో మాట్లాడారు” are suitable, natural equivalents.
  issues:
  - severity: medium
    issue: “వారిపై పడి ఏడ్చాడు” is misleading in modern Telugu.
    rationale: This phrasing commonly suggests that Joseph fell upon them, rather than that he wept over them while close to them. It can introduce an unintended forceful-action nuance. “వారిని ఆనుకొని ఏడ్చాడు” preserves the contextual physical closeness and emotional action naturally.
  revised_text: అతడు తన సోదరులందరినీ ముద్దుపెట్టుకొని, వారిని ఆనుకొని ఏడ్చాడు. ఆ తరువాత అతని సోదరులు అతనితో మాట్లాడారు.
  revised_footnotes: []
  revision_rationale: 'The revision corrects the rendering of עֲלֵיהֶם in its immediate reconciliation context. It avoids an unnatural or potentially violent implication while retaining the image of Joseph weeping in close contact with his brothers. No footnote is required: “అతనితో మాట్లాడారు” naturally represents the Hebrew construction here, and the alternative ‘spoke to him’ does not materially affect the Telugu rendering.'
