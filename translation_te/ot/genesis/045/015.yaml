revisions:
- from: అతడు తన సోదరులందరినీ ముద్దుపెట్టుకొని, వారిపై పడి ఏడ్చాడు. ఆ తరువాత అతని సోదరులు అతనితో మాట్లాడారు.
  to: అతడు తన సోదరులందరినీ ముద్దుపెట్టుకొని, వారిని ఆనుకొని ఏడ్చాడు. ఆ తరువాత అతని సోదరులు అతనితో మాట్లాడారు.
  rationale: 'The revision corrects the rendering of עֲלֵיהֶם in its immediate reconciliation context. It avoids an unnatural or potentially violent implication while retaining the image of Joseph weeping in close contact with his brothers. No footnote is required: “అతనితో మాట్లాడారు” naturally represents the Hebrew construction here, and the alternative ‘spoke to him’ does not materially affect the Telugu rendering.'
  reviewer_model: gpt-5.6-terra
