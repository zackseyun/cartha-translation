  yaml_path: translation/ot/genesis/045/015.yaml
  text: And he kissed all his brothers and wept over them. After that[a], his brothers spoke with him.
translation:
  language: te
  text: అతడు తన సోదరులందరినీ ముద్దుపెట్టుకొని, వారిని ఆనుకొని ఏడ్చాడు. ఆ తరువాత అతని సోదరులు అతనితో మాట్లాడారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְנַשֵּׁק
  choice: ముద్దుపెట్టుకొని
  rationale: נשׁק పియేల్ రూపం ప్రేమను, సమాధానపడటాన్ని వ్యక్తం చేసే ముద్దును సూచిస్తుంది. తెలుగులో ‘ముద్దుపెట్టుకొని’ సహజంగా ఉండి చర్యల వరుసను స్పష్టంగా కలుపుతుంది.
- source_word: לְכָל אֶחָיו
  choice: తన సోదరులందరినీ
  rationale: כָּל మరియు బహువచన సంబంధపదం కలిపి యోసేపు సోదరుల మొత్తం సమూహాన్ని సూచిస్తాయి. ‘సోదరులందరినీ’ ఈ సంపూర్ణతను సహజంగా తెలియజేస్తుంది.
- source_word: וַיֵּבְךְּ
  choice: ఏడ్చాడు
  rationale: בכה అంటే ఏడవడం లేదా కన్నీరు కార్చడం. ఆధునిక ప్రామాణిక తెలుగులో ‘ఏడ్చాడు’ సహజంగా ఉండి ఈ సమాధాన దృశ్యంలోని గాఢ భావోద్వేగాన్ని నిలుపుతుంది.
- source_word: עֲלֵיהֶם
  choice: వారిపై పడి
  rationale: עַל ఇక్కడ శారీరక సమీపతను లేదా వారిని ఆనుకొని ఏడవడాన్ని సూచించగలదు. ‘వారిపై పడి’ మూలంలోని దృశ్యాత్మకతను తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וְאַחֲרֵי כֵן
  choice: ఆ తరువాత
  rationale: ఈ కాలసూచక పదబంధం సంఘటనల క్రమాన్ని సూచిస్తుంది. ‘ఆ తరువాత’ స్పష్టమైన, ప్రస్తుత వాడుకలోని కథన ప్రయోగం.
- source_word: דִּבְּרוּ אֶחָיו אִתּוֹ
  choice: అతని సోదరులు అతనితో మాట్లాడారు
  rationale: דבר తో אֵת వాడుక ఒకరితో మాట్లాడటాన్ని, సందర్భానుసారం సంభాషణను సూచిస్తుంది. ‘అతనితో మాట్లాడారు’ పరస్పర సంభాషణ భావాన్ని నిలుపుతూ సహజమైన తెలుగును ఇస్తుంది.
