revisions:
- from: దేవుడు దేశంలో మీకు ఒక శేషాన్ని నిలిపి ఉంచడానికి[a], గొప్ప విడుదల కలిగేలా మిమ్మల్ని సజీవంగా కాపాడడానికి[b] నన్ను మీకంటే ముందుగా పంపించాడు.
  to: దేవుడు దేశంలో మీకు ఒక శేషాన్ని నిలిపి ఉంచడానికి[a], గొప్ప రక్షణ కోసం మిమ్మల్ని సజీవంగా కాపాడడానికి[b] నన్ను మీకంటే ముందుగా పంపించాడు.
  rationale: The revision replaces “విడుదల కలిగేలా” with “రక్షణ కోసం,” which better represents the Hebrew deliverance/escape sense and avoids introducing a causative meaning. It retains the source’s purpose/result construction and preserves the lexically possible ‘survivors’ interpretation in footnote b. Footnote anchors remain attached to the respective ambiguous expressions.
