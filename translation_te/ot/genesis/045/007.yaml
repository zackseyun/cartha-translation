  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּשְׁלָחֵ֤/נִי אֱלֹהִים֙ לִ/פְנֵי/כֶ֔ם לָ/שׂ֥וּם לָ/כֶ֛ם שְׁאֵרִ֖ית בָּ/אָ֑רֶץ וּ/לְ/הַחֲי֣וֹת לָ/כֶ֔ם לִ/פְלֵיטָ֖ה גְּדֹלָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/007.yaml
  text: And God sent me ahead of you to preserve for you a remnant in the land[b][a], and to keep you alive by a great deliverance.
translation:
  language: te
  text: దేవుడు దేశంలో మీకు ఒక శేషాన్ని నిలిపి ఉంచడానికి[a], గొప్ప రక్షణ కోసం మిమ్మల్ని సజీవంగా కాపాడడానికి[b] నన్ను మీకంటే ముందుగా పంపించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దేశంలో మీ కోసం బతికి మిగిలినవారిని కాపాడడానికి.’ שְׁאֵרִית అనే హీబ్రూ పదానికి ‘శేషం,’ ‘బతికి మిగిలినవారు,’ లేదా ‘సంతతి’ అనే అర్థాలు ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘గొప్ప తప్పించుకోవడం కోసం’ లేదా ‘అనేకమంది బతికి మిగిలేలా.’ לִפְלֵיטָה גְּדֹלָה అనే హీబ్రూ పదబంధం గొప్ప రక్షణ/తప్పించుకోవడాన్ని లేదా దాని ఫలితంగా బతికి మిగిలినవారిని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלָחֵנִי
  choice: నన్ను పంపించాడు
  rationale: కథనాన్ని ముందుకు నడిపించే wayyiqtol రూపాన్ని సహజమైన తెలుగు భూతకాలంతో అనువదించాం.
- source_word: אֱלֹהִים
  choice: దేవుడు
  rationale: ఈ సందర్భంలో యోసేపు సంఘటనలను ఏకవచనంలోని దేవుని కార్యంగా వివరిస్తున్నాడు.
- source_word: לִפְנֵיכֶם
  choice: మీకంటే ముందుగా
  rationale: అక్షరార్థమైన ‘మీ ముందు’ కంటే, యోసేపు వారికంటే ముందే ఐగుప్తుకు చేరిన కాలపరమైన భావాన్ని ఇది స్పష్టంగా తెలియజేస్తుంది.
- source_word: לָשׂוּם לָכֶם שְׁאֵרִית
  choice: మీకు ఒక శేషాన్ని నిలిపి ఉంచడానికి
  rationale: שׂוּם యొక్క ‘ఉంచు/నిలుపు’ భావాన్నీ, שְׁאֵרִית యొక్క ‘మిగిలిన భాగం/ప్రజలు’ భావాన్నీ కలిపి సహజంగా వ్యక్తం చేస్తుంది.
- source_word: שְׁאֵרִית
  choice: శేషం
  rationale: హీబ్రూ పదంలోని ‘మిగిలి జీవించేవారు’ అనే అర్థంతో పాటు బైబిలు అంతటా కనిపించే పదప్రతిధ్వనిని కాపాడుతుంది; ప్రత్యామ్నాయాలను పాదసూచికలో ఇచ్చాం.
- source_word: בָּאָרֶץ
  choice: దేశంలో
  rationale: אֶרֶץకు ‘భూమి’ లేదా ‘దేశం’ అనే అర్థాలు ఉండవచ్చు; కరవు మరియు ఐగుప్తు సందర్భంలో స్థానికమైన ‘దేశంలో’ సహజంగా సరిపోతుంది.
- source_word: וּלְהַחֲיוֹת לָכֶם
  choice: మిమ్మల్ని సజీవంగా కాపాడడానికి
  rationale: חיה హిఫీల్ రూపం జీవించి ఉండేలా చేయడం లేదా ప్రాణాలతో కాపాడడం అనే భావాన్ని ఇస్తుంది.
- source_word: לִפְלֵיטָה גְּדֹלָה
  choice: గొప్ప విడుదల కలిగేలా
  rationale: ל ఉపసర్గలోని ఉద్దేశం/ఫలితం భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తూ, פְּלֵיטָהను రక్షణాత్మక ఫలితమైన ‘విడుదల’గా ప్రధాన పాఠంలో చూపిస్తుంది.
theological_decisions:
- issue: שְׁאֵרִיתను ‘శేషం’గా అనువదించాలా, ‘బతికి మిగిలినవారు’గా అనువదించాలా
  choice: శేషం
  alternative: బతికి మిగిలినవారు / సంతతి
  rationale: ‘శేషం’ మూలపదానికి దగ్గరగా ఉండి దాని బైబిలీయ పదప్రతిధ్వనిని నిలుపుతుంది; తక్షణ సందర్భంలోని జీవించి మిగలడం అనే భావాన్ని పాదసూచిక స్పష్టం చేస్తుంది.
- issue: לִפְלֵיטָה גְּדֹלָה విడుదల అనే సంఘటన/ఫలితాన్ని సూచిస్తుందా, లేక మిగిలిన ప్రజలను సూచిస్తుందా
  choice: గొప్ప విడుదల కలిగేలా
  alternative: గొప్ప తప్పించుకొనుట కోసం / అనేకమంది బతికి మిగిలేలా
  rationale: ఈ పదబంధం ఉద్దేశాన్ని లేదా ఫలితాన్ని తెలుపగలదు. ప్రధాన పాఠం రక్షించే ఫలితాన్ని ఎంచుకుంటుంది; వ్యక్తుల సమూహాన్ని సూచించే సాధ్యమైన అర్థాన్ని పాదసూచికలో నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడబడింది. ‘శేషం’ బైబిలీయంగా పరిచితమైన పదం అయినప్పటికీ, సాధారణ పాఠకునికి దాని సందర్భార్థం తెలిసేలా పాదసూచిక జోడించబడింది. మూలంలోని ఉద్దేశం/ఫలితం మరియు విడుదల/బతికి మిగిలినవారు అనే ద్వంద్వ సాధ్యతలను మౌనంగా పరిష్కరించకుండా నమోదు చేశాం.
