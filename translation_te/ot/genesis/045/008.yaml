    rationale: “కాబట్టి, ఇప్పుడు” reads more naturally as a discourse transition in Telugu than the unpunctuated “కాబట్టి ఇప్పుడు.”
  - severity: low
    issue: Scope of ‘all his house’
    rationale: “అతని ఇల్లంతటికీ” can be understood primarily as the physical house. “అతని ఇంటి అంతటికీ” more naturally communicates the full household/domain while retaining the Hebrew image and breadth.
