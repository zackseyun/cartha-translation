  source_fidelity: The draft accurately represents the discourse-concluding וְעַתָּה, the emphatic contrast between the brothers and God, and Joseph’s three roles. “దేవుడే” appropriately conveys the adversative force after the negation without resolving the text’s tension concerning divine purpose and human action. The figurative “father to Pharaoh” is retained rather than reduced to “adviser.”
