  terminology: “ఫరో,” “దేవుడు,” “ప్రభువు,” “ఐగుప్తు,” and “పరిపాలకుడు” are suitable in modern standard Telugu. The footnote appropriately preserves the metaphor while offering limited role-based clarification.
