id: GEN.45.8
reference: Genesis 45:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/עַתָּ֗ה לֹֽא אַתֶּ֞ם שְׁלַחְתֶּ֤ם אֹתִ/י֙ הֵ֔נָּה כִּ֖י הָ/אֱלֹהִ֑ים וַ/יְשִׂימֵ֨/נִֽי לְ/אָ֜ב לְ/פַרְעֹ֗ה וּ/לְ/אָדוֹן֙ לְ/כָל בֵּית֔/וֹ וּ/מֹשֵׁ֖ל בְּ/כָל אֶ֥רֶץ מִצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/008.yaml
  text: So now[a], it was not you who sent me here, but God; and he has made me a father to Pharaoh, and lord over all his house, and ruler over all the land of Egypt.
translation:
  language: te
  text: కాబట్టి, ఇప్పుడు నన్ను ఇక్కడికి పంపింది మీరు కాదు, దేవుడే. ఆయన నన్ను ఫరోకు తండ్రిగా[a], అతని ఇంటి అంతటికీ ప్రభువుగా, ఐగుప్తు దేశమంతటిపై పరిపాలకుడిగా చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఫరోకు తండ్రివలె”; అంటే ప్రధాన సంరక్షకుడు, సలహాదారు లేదా ఉపకారి.
    reason: אָב అనే మూలపదంలోని రూపకానికి సాధ్యమైన కార్యార్థాన్ని తెలియజేయడానికి.
lexical_decisions:
- source_word: וְעַתָּה
  choice: కాబట్టి ఇప్పుడు
  rationale: וְ అనే అనుసంధాన భావాన్నీ, עַתָּה అనే కాలసూచకమైన మరియు ప్రసంగాన్ని ముగింపువైపు నడిపించే భావాన్నీ సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: לֹא אַתֶּם שְׁלַחְתֶּם אֹתִי הֵנָּה
  choice: నన్ను ఇక్కడికి పంపింది మీరు కాదు
  rationale: మూలంలోని אַתֶּם అనే స్పష్టమైన సర్వనామానికి ఉన్న ఉద్ఘాటనను తెలుగు విభక్త వాక్యనిర్మాణంతో నిలుపుతుంది; הֵנָּה ను సందర్భానుసారం ‘ఇక్కడికి’గా అనువదించింది.
- source_word: כִּי הָאֱלֹהִים
  choice: దేవుడే
  rationale: నిరాకరణ తరువాత כִּי చూపే ‘మీరు కాదు, దేవుడు’ అనే బలమైన వ్యతిరేకతను ‘దేవుడే’ సహజంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: וַיְשִׂימֵנִי
  choice: ఆయన నన్ను ... చేశాడు
  rationale: שׂים యొక్క ‘ఉంచు/చేయు’ భావాన్ని, తరువాత వచ్చే మూడు హోదాలతో సహజంగా కలిసే విధంగా అనువదిస్తుంది; ‘నియమించాడు’ అని పరిపాలనా భావానికి మాత్రమే పరిమితం చేయదు.
- source_word: לְאָב לְפַרְעֹה
  choice: ఫరోకు తండ్రిగా
  rationale: אָב లోని రూపకాన్ని వ్యాఖ్యానించి కుదించకుండా నిలుపుతుంది. ఇది అక్షరార్థ జనకత్వం కంటే సంరక్షకుడు, ప్రధాన సలహాదారు లేదా ఉపకారి వంటి పాత్రను సూచించవచ్చు.
- source_word: וּלְאָדוֹן לְכָל בֵּיתוֹ
  choice: అతని ఇల్లంతటికీ ప్రభువుగా
  rationale: אָדוֹן సూచించే అధికారం, ఆధిపత్యాన్ని ‘ప్రభువు’ తెలియజేస్తుంది; בֵּיתוֹ కుటుంబం, గృహసిబ్బంది, ఆస్తిపాస్తులతో కూడిన విస్తృత గృహవ్యవస్థను సూచించగలదని ‘ఇల్లంతటికీ’ నిలుపుతుంది.
- source_word: וּמֹשֵׁל בְּכָל אֶרֶץ מִצְרָיִם
  choice: ఐగుప్తు దేశమంతటిపై పరిపాలకుడిగా
  rationale: מֹשֵׁל లోని విస్తృత పాలనా భావాన్ని ‘పరిపాలకుడు’ తెలియజేస్తుంది; ‘దేశమంతటిపై’ అని చెప్పడం כָל אֶרֶץ యొక్క భౌగోళిక పరిధిని స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: యోసేపు మాటల్లో దేవుని సార్వభౌమ కార్యం మరియు అన్నల మానవ క్రియ మధ్య సంబంధం
  choice: ‘మీరు కాదు, దేవుడే’ అనే బలమైన వ్యతిరేకతను యథాతథంగా నిలుపడం
  alternative: అన్నల బాధ్యతను తగ్గించే మృదువైన రూపం, లేదా దేవుని నిర్వహణ గురించి ఒక నిర్దిష్ట సిద్ధాంతాన్ని వివరిస్తూ చెప్పే భావానువాదం
  rationale: ఈ వాక్యం దేవుని నిర్ణాయక ఉద్దేశాన్ని ప్రధానంగా చూపుతుంది; అయితే అన్నలు నిజంగా చేసిన కార్యాన్ని చుట్టుపక్కల కథనం నిరాకరించదు. కాబట్టి అనువాదం ఈ ఉద్రిక్తతను పరిష్కరించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం ఉపయోగించబడింది. ‘ఫరో,’ ‘ప్రభువు,’ ‘ఐగుప్తు’ వంటి బైబిలు పాఠకులకు పరిచితమైన పదాలను ఉంచుతూ, వాక్యాన్ని సాధారణ పాఠకులకు స్పష్టంగా తీర్చిదిద్దాం.
