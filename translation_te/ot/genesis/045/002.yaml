lexical_decisions:
- source_word: וַיִּתֵּן אֶת־קֹלוֹ בִּבְכִי
  choice: అతడు బిగ్గరగా ఏడ్చాడు
  rationale: అక్షరార్థంగా ‘ఏడుపులో తన స్వరాన్ని ఇచ్చాడు’ అనే హెబ్రీ నుడికారం వినిపించేలా గట్టిగా ఏడవడాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘బిగ్గరగా ఏడ్చాడు’ సహజంగా అదే భావాన్ని అందిస్తుంది.
- source_word: וַיִּשְׁמְעוּ
  choice: విన్నారు
