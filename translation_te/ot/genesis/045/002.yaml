- source_word: מִצְרַיִם
  choice: ఐగుప్తీయులు
  rationale: ఈ రూపం ‘ఐగుప్తు’ దేశాన్ని కూడా సూచించగలిగినా, దానితో ఉన్న బహువచన క్రియ ప్రజలను సమష్టిగా సూచించే ‘ఐగుప్తీయులు’ అనే భావానికి మద్దతిస్తుంది.
- source_word: בֵּית פַּרְעֹה
  choice: ఫరో ఇంటివారు
  rationale: హెబ్రీ ‘ఫరో ఇల్లు’ అనేది రాజ కుటుంబాన్ని, గృహస్థులను లేదా రాజాస్థాన వర్గాన్ని సూచించవచ్చు. ‘ఫరో ఇంటివారు’ వ్యక్తులను సూచిస్తూ మూలంలోని విస్తృత భావాన్ని సహజ తెలుగులో నిలుపుతుంది.
