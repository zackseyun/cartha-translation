translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని వాడాం. ‘ఐగుప్తు’ అనే సంప్రదాయ బైబిలు భౌగోళిక నామాన్ని ఉంచాం. మూలంలోని హృదయ రూపకాన్నీ, దాని భావార్థంలోని స్వల్ప అనిశ్చితినీ పాదసూచికతో సంరక్షించాం.
