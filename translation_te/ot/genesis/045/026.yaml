  text: וַ/יַּגִּ֨דוּ ל֜/וֹ לֵ/אמֹ֗ר ע֚וֹד יוֹסֵ֣ף חַ֔י וְ/כִֽי ה֥וּא מֹשֵׁ֖ל בְּ/כָל אֶ֣רֶץ מִצְרָ֑יִם וַ/יָּ֣פָג לִבּ֔/וֹ כִּ֥י לֹא הֶאֱמִ֖ין לָ/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/026.yaml
  text: They told him[a], saying, “Joseph is still alive, and he is ruler over all the land of Egypt.” But his heart went numb, for he did not believe them.
translation:
  language: te
  text: వారు అతనికి, “యోసేపు ఇంకా బ్రతికే ఉన్నాడు; అతడు ఐగుప్తు దేశమంతటిపై పాలిస్తున్నాడు” అని చెప్పారు. అయితే అతని హృదయం మొద్దుబారిపోయింది[a]; ఎందుకంటే అతడు వారిని నమ్మలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతని హృదయం సొమ్మసిల్లింది,” లేదా “అతని హృదయం స్తంభించిపోయింది.” ఈ హీబ్రూ అభివ్యక్తి ఆ వార్త విన్నప్పుడు యాకోబు పొందిన దిగ్భ్రాంతితో కూడిన, బలహీనమైన అంతరంగ ప్రతిస్పందనను వర్ణిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגִּדוּ לוֹ לֵאמֹר
  choice: వారు అతనితో ... అని చెప్పారు
  rationale: హిఫిల్ రూపంలోని נגד ఇక్కడ ‘తెలియజేయడం/చెప్పడం’ అనే అర్థం ఇస్తుంది. לֵאמֹר అనే మాటను తెలుగు ప్రత్యక్ష వాక్య నిర్మాణంలో సహజంగా ‘అని’తో వ్యక్తం చేశాం.
- source_word: עוֹד יוֹסֵף חַי
  choice: యోసేపు ఇంకా బతికే ఉన్నాడు
  rationale: עוֹד కొనసాగుతున్న స్థితిని సూచిస్తుంది; ‘ఇంకా ... ఉన్నాడు’ దానిని స్పష్టంగా తెలియజేస్తుంది. ఆశ్చర్యకరమైన వార్తలోని ఉద్ఘాటనను ‘బతికే’ సహజంగా అందిస్తుంది.
- source_word: וְכִי הוּא מֹשֵׁל
  choice: అతడే ... పరిపాలిస్తున్నాడు
  rationale: מֹשֵׁל అనేది పాలించే కార్యాన్ని సూచించే కృదంతం. నిర్దిష్ట ఐగుప్తీయ అధికార పదవిని ఊహించకుండా ‘పరిపాలిస్తున్నాడు’ అని అనువదించాం; הוּא పై ఉన్న భావ ఉద్ఘాటనను ‘అతడే’ తెలియజేస్తుంది.
- source_word: בְּכָל אֶרֶץ מִצְרָיִם
  choice: ఐగుప్తు దేశమంతటినీ
  rationale: משל తో వచ్చిన ב పాలనా పరిధిని సూచిస్తుంది. తెలుగులో ‘దేశమంతటినీ పరిపాలిస్తున్నాడు’ సహజంగా ఉండి, ఆ పాలన దేశమంతటిపై ఉందని తెలియజేస్తుంది.
- source_word: וַיָּפָג לִבּוֹ
  choice: అతని హృదయం మొద్దుబారిపోయింది
  rationale: פוג ఇక్కడ బలహీనపడడం, స్తంభించడం లేదా మొద్దుబారడం వంటి ఆకస్మిక అంతరంగ ప్రతిస్పందనను సూచిస్తుంది. మూలంలోని హృదయ రూపకాన్ని నిలుపుతూ ‘మొద్దుబారిపోయింది’ యాకోబు దిగ్భ్రాంతిని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: כִּי לֹא הֶאֱמִין לָהֶם
  choice: ఎందుకంటే అతడు వారి మాట నమ్మలేదు
  rationale: כִּי ముందున్న ప్రతిస్పందనకు కారణాన్ని తెలియజేస్తుంది. לָהֶם ను తెలుగులో సహజంగా ‘వారి మాట’ అని వ్యక్తం చేశాం.
