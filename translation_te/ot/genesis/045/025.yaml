  text: וַֽ/יַּעֲל֖וּ מִ/מִּצְרָ֑יִם וַ/יָּבֹ֨אוּ֙ אֶ֣רֶץ כְּנַ֔עַן אֶֽל יַעֲקֹ֖ב אֲבִי/הֶֽם־׃
