  yaml_path: translation/ot/genesis/045/025.yaml
  text: So they went up from Egypt and came to the land of Canaan, to Jacob their father.
translation:
  language: te
  text: వారు ఐగుప్తు నుండి పైకి వెళ్లి, కనాను దేశానికి, తమ తండ్రియైన యాకోబు దగ్గరకు వచ్చారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: పైకి వెళ్లి
  rationale: עלה అనే క్రియకు ప్రాథమికంగా ‘పైకి వెళ్లడం’ అనే అర్థం ఉంది. ఐగుప్తు నుండి కనానుకు చేసే ప్రయాణంలోని భౌగోళిక దిశాభావాన్ని ఇది నిలుపుతుంది.
- source_word: מִמִּצְרָיִם
  choice: ఐగుప్తు నుండి
  rationale: מִן మూలస్థానాన్ని సూచిస్తుంది; מִצְרַיִםకు తెలుగులో స్థిరపడిన బైబిలు రూపం ‘ఐగుప్తు’.
- source_word: וַיָּבֹאוּ
  choice: వచ్చారు
  rationale: בוא సాధారణంగా ‘రావడం’ లేదా ‘ప్రవేశించడం’ అని అర్థం. ఇక్కడ గమ్యస్థానానికి చేరడాన్ని సహజంగా తెలిపేందుకు ‘వచ్చారు’ సరిపోతుంది.
- source_word: אֶרֶץ כְּנַעַן
  choice: కనాను దేశానికి
  rationale: మూలంలోని אֶרֶץ పదాన్ని ‘దేశం’గా స్పష్టంగా నిలుపుతూ, గమనాన్ని తెలుగులో సహజమైన ‘దేశానికి’ ద్వారా వ్యక్తం చేసింది.
- source_word: אֶל יַעֲקֹב
  choice: యాకోబు దగ్గరకు
  rationale: אֶל వ్యక్తివైపు గమనాన్ని సూచిస్తుంది. తెలుగులో ‘యాకోబు దగ్గరకు’ సహజంగా ఆ దిశను తెలియజేస్తుంది.
- source_word: אֲבִיהֶם
  choice: తమ తండ్రి
  rationale: ఈ పదం వారి స్వంత తండ్రిని సూచిస్తుంది. కర్తతో అన్వయాన్ని స్పష్టంగా, సహజంగా చూపేందుకు ‘తమ’ వాడబడింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. ‘పైకి వెళ్లి’ అనే రూపం హెబ్రీ భౌగోళిక ప్రయాణ నుడికారాన్ని నిలుపుతుంది; వాక్యక్రమం తెలుగు సహజత్వానికి అనుగుణంగా ఉంది.
