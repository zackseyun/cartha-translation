id: GEN.45.19
reference: Genesis 45:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אַתָּ֥ה צֻוֵּ֖יתָה זֹ֣את עֲשׂ֑וּ קְחוּ לָ/כֶם֩ מֵ/אֶ֨רֶץ מִצְרַ֜יִם עֲגָל֗וֹת לְ/טַפְּ/כֶם֙ וְ/לִ/נְשֵׁי/כֶ֔ם וּ/נְשָׂאתֶ֥ם אֶת אֲבִי/כֶ֖ם וּ/בָאתֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/019.yaml
  text: 'And you are commanded[a], ‘Do this: take for yourselves wagons from the land of Egypt for your little ones and for your wives[c][b], and carry your father and come.’'
translation:
  language: te
  text: 'నీకు ఆజ్ఞ ఇవ్వబడింది: ‘ఇది చేయండి: మీ చిన్నపిల్లల కోసం, మీ భార్యల కోసం ఐగుప్తు దేశం నుండి బండ్లను తీసుకోండి; మీ తండ్రిని తీసుకొని రండి.’'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: צֻוֵּיתָה
  choice: నీవు ఈ ఆజ్ఞను పొందావు
  rationale: పుయల్ రూపంలోని నిష్క్రియ భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది; సందర్భంలో ఆజ్ఞ యోసేపుకు ఇవ్వబడింది.
- source_word: זֹאת עֲשׂוּ
  choice: ఇలా చేయండి
  rationale: హెబ్రీ ఆదేశ సూత్రంలోని సంక్షిప్తతను, బహువచన ఆజ్ఞను సహజంగా వ్యక్తపరుస్తుంది.
- source_word: קְחוּ לָכֶם
  choice: తీసుకోండి
  rationale: לָכֶם లోని ప్రయోజన భావం తరువాత వచ్చే ‘మీ ... కోసం’ అనే పదబంధాల్లో తెలుగులో సహజంగా వ్యక్తమవుతుంది.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: ఐగుప్తు దేశం నుండి
  rationale: אֶרֶץ అనే పదాన్ని విడిచిపెట్టకుండా మూలంలోని పూర్తి పదబంధాన్ని నిలుపుతుంది.
- source_word: עֲגָלוֹת
  choice: బండ్లను
  rationale: మనుషులను, సామానును రవాణా చేసే చక్రాల వాహనాలకు సహజమైన సాధారణ తెలుగు పదం.
- source_word: לְטַפְּכֶם
  choice: మీ చిన్నపిల్లల కోసం
  rationale: טַף సాధారణంగా సంతానం మొత్తాన్ని కాక చిన్న పిల్లలను సూచిస్తుంది.
- source_word: וְלִנְשֵׁיכֶם
  choice: మీ భార్యల కోసం
  rationale: కుటుంబ ప్రయాణ సందర్భంలో נָשִׁים యొక్క సంబంధార్థం ‘భార్యలు’ స్పష్టంగా సరిపోతుంది.
- source_word: וּנְשָׂאתֶם אֶת אֲבִיכֶם
  choice: మీ తండ్రిని ఎక్కించుకొని
  rationale: נשא యొక్క మోయడం/తీసుకురావడం భావాన్ని బండ్ల సందర్భానికి అనుగుణంగా సహజంగా తెలుపుతుంది; ఆయనను బండ్లలో రవాణా చేయాలనే భావాన్ని అతిగా వివరించకుండా అందిస్తుంది.
- source_word: וּבָאתֶם
  choice: రండి
  rationale: మూలంలోని ‘రండి’ అనే సాధారణ భావాన్ని నిలుపుతుంది; సందర్భం ఐగుప్తుకు తిరిగి రావడాన్ని సూచించినా ‘తిరిగి’ అనే పదాన్ని చేర్చదు.
