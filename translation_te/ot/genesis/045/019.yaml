translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. యోసేపును ఉద్దేశించిన ఏకవచన వాక్యం తరువాత అతని సహోదరులకు చెప్పవలసిన బహువచన ఆజ్ఞను స్పష్టంగా నిలిపింది. మూలంలో లేని ‘తిరిగి’ అనే భావాన్ని పాఠ్యంలో చేర్చలేదు.
