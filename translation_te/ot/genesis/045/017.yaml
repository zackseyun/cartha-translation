id: GEN.45.17
reference: Genesis 45:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר פַּרְעֹה֙ אֶל יוֹסֵ֔ף אֱמֹ֥ר אֶל אַחֶ֖י/ךָ זֹ֣את עֲשׂ֑וּ טַֽעֲנוּ֙ אֶת בְּעִ֣ירְ/כֶ֔ם וּ/לְכוּ בֹ֖אוּ אַ֥רְצָ/ה כְּנָֽעַן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/017.yaml
  text: 'Then Pharaoh said to Joseph[a], “Tell your brothers, ‘Do this: load your beasts and go[b]; return to the land of Canaan.’”'
translation:
  language: te
  text: 'అప్పుడు ఫరో యోసేపుతో ఇలా అన్నాడు: “నీ సహోదరులకు ఇలా చెప్పు: ‘ఇది చేయండి: మీ పశువులపై సామాను మోపి, వెళ్లి కనాను దేశానికి చేరండి.’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... అన్నాడు
  rationale: వావ్-కన్సిక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది; ‘అప్పుడు’ సహజమైన తెలుగు కథన క్రమాన్ని తెలియజేస్తుంది.
- source_word: פַּרְעֹה
  choice: ఫరో
  rationale: ఆదికాండంలో ఈజిప్టు రాజుకు వాడే బిరుదుకు ప్రామాణిక తెలుగు రూపం.
- source_word: אֱמֹר אֶל אַחֶיךָ
  choice: నీ సహోదరులతో ఇలా చెప్పు
  rationale: యోసేపు తన సహోదరులకు ఆదేశాన్ని తెలియజేయాలని చెప్పే నిర్మాణాన్ని సహజంగా, స్పష్టంగా అందిస్తుంది.
- source_word: זֹאת עֲשׂוּ
  choice: మీరు చేయవలసింది ఇదే
  rationale: ఆ తరువాత వచ్చే నిర్దేశాన్ని పరిచయం చేసే సహజ తెలుగు రూపం; ‘ఇది చేయండి’ అనే మరింత రూపసామ్యమైన భావాన్ని నిలుపుతుంది.
- source_word: טַעֲנוּ
  choice: సామాను మోపి
  rationale: ప్రయాణం కోసం జంతువుల మీద బరువు లేదా సామాను ఎక్కించడాన్ని సందర్భానుసారంగా స్పష్టంగా తెలియజేస్తుంది.
- source_word: בְּעִירְכֶם
  choice: మీ పశువుల మీద
  rationale: בְּעִיר ఇక్కడ భారాలు మోసే గృహపశువులను సూచిస్తుంది; ‘పశువులు’ ఆధునిక తెలుగులో సహజమైన విస్తృత పదం.
- source_word: וּלְכוּ בֹאוּ
  choice: తిరిగి వెళ్లండి
  rationale: ‘వెళ్లండి, రండి/చేరండి’ అనే వరుస ఆజ్ఞలు ఈజిప్టు నుంచి కనానుకు చేసే ప్రయాణాన్ని సూచిస్తాయి. తెలుగు దృష్టికోణంలో ‘తిరిగి వెళ్లండి’ రెండింటి సమగ్ర భావాన్ని సహజంగా ఇస్తుంది.
- source_word: אַרְצָה כְּנָעַן
  choice: కనాను దేశానికి
  rationale: దిశాసూచక ప్రత్యయం మరియు ‘దేశం’ అనే నామవాచక భావం రెండింటినీ స్పష్టంగా నిలుపుతుంది.
