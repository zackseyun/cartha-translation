translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనా సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే కథన శైలి. మూలంలోని వరుస ప్రయాణ ఆజ్ఞలను తెలుగులో సహజమైన ‘తిరిగి వెళ్లండి’గా సమీకరించాం.
