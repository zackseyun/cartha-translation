review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys Pharaoh's command, loading the animals, and the destination, Canaan. However, “నీ సహోదరులతో ... చెప్పు” means “say with your brothers,” whereas אֶל־אַחֶיךָ means “to your brothers.” Also, “తిరిగి వెళ్లండి” naturally conveys the journey but compresses the Hebrew’s two sequential imperatives, “go” and “come/arrive.”
  naturalness: The Telugu is clear and suitably formal for biblical narrative. “వెళ్లి కనాను దేశానికి చేరండి” is natural modern Telugu and retains the sequential travel sense without an awkwardly literal rendering.
  terminology: “ఫరో,” “యోసేపు,” “కనాను దేశం,” and “పశువులు” are appropriate. “సహోదరులు” is acceptable in this register. “సామాను మోపి” suitably expresses loading baggage onto animals.
  issues:
  - severity: medium
    issue: Recipient relation rendered as associative
    rationale: “నీ సహోదరులతో ఇలా చెప్పు” means “say this with your brothers,” but the Hebrew אֶל אַחֶיךָ directs Joseph to speak to his brothers. It should be “నీ సహోదరులకు ఇలా చెప్పు.”
  - severity: low
    issue: Two travel imperatives compressed
    rationale: “తిరిగి వెళ్లండి” is idiomatic but subsumes וּלְכוּ בֹאוּ. “వెళ్లి ... చేరండి” preserves departure and arrival naturally in Telugu.
  revised_text: 'అప్పుడు ఫరో యోసేపుతో ఇలా అన్నాడు: “నీ సహోదరులకు ఇలా చెప్పు: ‘ఇది చేయండి: మీ పశువులపై సామాను మోపి, వెళ్లి కనాను దేశానికి చేరండి.’”'
  revised_footnotes: []
  revision_rationale: The revision corrects the directional sense of “to your brothers” and represents both travel actions in the Hebrew through the natural Telugu sequence “వెళ్లి ... చేరండి.” No footnote is necessary, since the revised wording is clear and does not introduce or resolve a textual ambiguity.
