  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּי זֶ֛ה שְׁנָתַ֥יִם הָ/רָעָ֖ב בְּ/קֶ֣רֶב הָ/אָ֑רֶץ וְ/עוֹד֙ חָמֵ֣שׁ שָׁנִ֔ים אֲשֶׁ֥ר אֵין חָרִ֖ישׁ וְ/קָצִּֽיר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/006.yaml
  text: For these two years the famine has been in the midst of the land[b][a], and there are still five years in which there will be neither plowing nor harvest.
translation:
  language: te
  text: ఎందుకంటే, ఈ రెండు సంవత్సరాలుగా దేశంలో[a] క్షామం ఉంది; ఇంకా ఐదు సంవత్సరాలు దున్నడమూ పంట కోయడమూ ఉండవు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “దేశం నడుమ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: యోసేపును దేవుడు ముందుగా ఎందుకు పంపాడో వివరించే కారణవాక్యాన్ని సహజంగా పరిచయం చేస్తుంది.
- source_word: זֶה שְׁנָתַיִם
  choice: ఇప్పటికే రెండు సంవత్సరాలుగా
  rationale: గడిచిన ప్రస్తుత రెండేళ్ల కాలాన్ని సూచించే హీబ్రూ ప్రయోగాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: הָרָעָב
  choice: కరవు
  rationale: కథనంలో ఇప్పటికే ప్రస్తావించబడిన నిర్దిష్టమైన ఆహార కొరతను సూచిస్తుంది.
- source_word: בְּקֶרֶב הָאָרֶץ
  choice: దేశంలో
  rationale: స్థానిక సందర్భంలో אֶרֶץ అంటే ‘దేశం’; בְּקֶרֶב యొక్క అక్షరార్థాన్ని పాదసూచికలో ఉంచి, ప్రధాన పాఠ్యంలో సహజమైన తెలుగు వాడబడింది.
- source_word: וְעוֹד חָמֵשׁ שָׁנִים
  choice: ఇంకా ఐదు సంవత్సరాలు
  rationale: ప్రస్తుత సమయం నుండి మరో ఐదేళ్లు మిగిలి ఉన్నాయనే భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: אֲשֶׁר אֵין
  choice: ఉండవు
  rationale: ముందున్న ఐదేళ్లలో వ్యవసాయ క్రియలు ఉండవని సందర్భానుగుణ భవిష్యత్తు భావంతో తెలుపుతుంది.
- source_word: חָרִישׁ
  choice: దున్నడం
  rationale: పొలాన్ని దున్నడం లేదా సాగుకు సిద్ధం చేయడాన్ని సూచించే స్పష్టమైన సాధారణ తెలుగు పదం.
- source_word: קָצִיר
  choice: పంటకోత
  rationale: దున్నడంతో జతగా వచ్చే కోత లేదా పంట సేకరణను సంక్షిప్తంగా, సహజంగా సూచిస్తుంది.
