translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే, గౌరవప్రదమైన శైలి. హీబ్రూ వాక్యంలోని కాలవ్యాప్తిని ‘ఇప్పటికే రెండు సంవత్సరాలుగా’ అని సహజంగా వ్యక్తపరచి, בְּקֶרֶב యొక్క మరింత అక్షరార్థ రూపాన్ని పాదసూచికలో నిలిపాము.
