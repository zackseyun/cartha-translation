id: GEN.45.10
reference: Genesis 45:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/יָשַׁבְתָּ֣ בְ/אֶֽרֶץ גֹּ֗שֶׁן וְ/הָיִ֤יתָ קָרוֹב֙ אֵלַ֔/י אַתָּ֕ה וּ/בָנֶ֖י/ךָ וּ/בְנֵ֣י בָנֶ֑י/ךָ וְ/צֹאנְ/ךָ֥ וּ/בְקָרְ/ךָ֖ וְ/כָל אֲשֶׁר לָֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/010.yaml
  text: You shall live in the land of Goshen, and you shall be near me—you and your sons and your grandsons, and your flocks and your herds and all that you have.
translation:
  language: te
  text: నీవు గోషెను దేశంలో నివసిస్తావు, నాకు దగ్గరగా ఉంటావు—నీవు, నీ కుమారులు, నీ కుమారుల కుమారులు, నీ మందలు, నీ పశువులు, నీకు ఉన్నదంతా.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיָשַׁבְתָּ
  choice: నీవు ... నివసిస్తావు
  rationale: ישׁב ఇక్కడ ఒక ప్రాంతంలో స్థిరంగా నివసించడాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘నివసిస్తావు’ సహజంగా, గౌరవప్రదంగా ఉంది.
- source_word: בְאֶרֶץ גֹּשֶׁן
  choice: గోషెను దేశంలో
  rationale: אֶרֶץ అనే భౌగోళిక పదాన్ని నిలుపుతూ, గోషెను అనే స్థలనామాన్ని లిప్యంతరీకరించింది.
- source_word: וְהָיִיתָ קָרוֹב אֵלַי
  choice: నాకు దగ్గరగా ఉంటారు
  rationale: היה + קָרוֹב సమీపంలో ఉండడాన్ని వ్యక్తం చేస్తుంది. తరువాత వచ్చే సమగ్ర జాబితాకు అనుగుణంగా తెలుగులో బహువచన క్రియను ఉపయోగించడం సహజం.
- source_word: אַתָּה
  choice: నీవు
  rationale: స్వతంత్ర సర్వనామంలోని ఉద్ఘాటనను జాబితా ప్రారంభంలో స్పష్టంగా నిలిపింది.
- source_word: וּבָנֶיךָ
  choice: నీ కుమారులు
  rationale: בנים ఇక్కడ పుంలింగ బహువచనం; తరువాతి తరమైన కుమారుల కుమారుల నుండి వేరుగా పేర్కొనబడింది.
- source_word: וּבְנֵי בָנֶיךָ
  choice: నీ కుమారుల కుమారులు
  rationale: హీబ్రూ బంధుత్వ నిర్మాణాన్ని యథాతథంగా ఉంచింది; ‘మనవళ్లు’ కంటే ఇది మూలంలోని పురుష-వంశ సూచనను స్పష్టంగా కాపాడుతుంది.
- source_word: וְצֹאנְךָ
  choice: నీ మందలు
  rationale: צֹאן గొర్రెలు, మేకలు వంటి చిన్న పశువుల సమూహాలను సూచించే సామూహిక పదం; ‘మందలు’ సంక్షిప్తమైన సహజ సమానార్థకం.
- source_word: וּבְקָרְךָ
  choice: నీ పశువులు
  rationale: בקר ప్రధానంగా పెద్ద పశువులను, ముఖ్యంగా పశుసంపదను సూచిస్తుంది. తెలుగులో ‘పశువులు’ సహజమైన సాధారణ పదం; ముందు ఉన్న ‘మందలు’తో భేదం సందర్భం ద్వారా నిలుస్తుంది.
- source_word: וְכָל אֲשֶׁר לָךְ
  choice: నీకు ఉన్నదంతా
  rationale: వ్యక్తికి చెందిన సమస్త ఆస్తిని విస్తృతంగా సూచించే మూలపదబంధానికి ఇది సహజమైన తెలుగు రూపం.
