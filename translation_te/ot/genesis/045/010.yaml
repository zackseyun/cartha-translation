translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం. యోసేపు యాకోబుతో ఏకవచనంగా మాట్లాడుతున్నప్పటికీ, ‘నీవు’తో మొదలయ్యే మనుషులు మరియు ఆస్తుల సమగ్ర జాబితాకు అనుగుణంగా చివర బహువచన క్రియ వాడబడింది. వివరణ అవసరమైన పాఠ్యాంతరాలు లేదా నిజమైన భావసందిగ్ధతలు లేనందున పాదటిప్పణులు ఇవ్వలేదు.
