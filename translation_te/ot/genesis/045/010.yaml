revisions:
- from: నీవు గోషెను దేశంలో నివసిస్తావు; నీవు, నీ కుమారులు, నీ కుమారుల కుమారులు, నీ మందలు, నీ పశువులు, నీకు ఉన్నదంతా నాకు దగ్గరగా ఉంటారు.
  to: నీవు గోషెను దేశంలో నివసిస్తావు, నాకు దగ్గరగా ఉంటావు—నీవు, నీ కుమారులు, నీ కుమారుల కుమారులు, నీ మందలు, నీ పశువులు, నీకు ఉన్నదంతా.
  rationale: The revision preserves the Hebrew sequence and emphasis while restoring the singular predicate addressed to Jacob. The dash introduces the appositional household-and-property list without falsely making all listed items the grammatical subject of a plural verb.
