review_pass:
  verdict: revise
  source_fidelity: The draft correctly renders residence in Goshen, the specified family generations, livestock categories, and the comprehensive expression for possessions. However, its final plural verb makes Jacob, his sons, grandsons, flocks, herds, and possessions collectively the grammatical subject of ‘be near me,’ whereas the Hebrew has singular ‘you shall be near me,’ followed by an emphatic appositional list.
  naturalness: The initial semicolon and the shift to ‘ఉంటారు’ produce an unnatural and misleading Telugu construction, especially because inanimate possessions are included with a personal plural verb. Recasting the sentence with singular verbs for Jacob and retaining the following list after a dash is clear and natural.
  terminology: ‘గోషెను దేశం,’ ‘కుమారులు,’ ‘కుమారుల కుమారులు,’ ‘మందలు,’ ‘పశువులు,’ and ‘నీకు ఉన్నదంతా’ are suitable modern-standard Telugu equivalents. No theological terminology or footnotes are needed.
  issues:
  - severity: medium
    issue: The verb ‘ఉంటారు’ is plural and governs the entire following list.
    rationale: 'וְהָיִיתָ קָרוֹב אֵלַי is second-person masculine singular: ‘you shall be near me.’ The listed family, livestock, and possessions elaborate the addressee’s household rather than requiring a plural predicate. The current wording also applies a personal plural verb to animals and possessions.'
  revised_text: నీవు గోషెను దేశంలో నివసిస్తావు, నాకు దగ్గరగా ఉంటావు—నీవు, నీ కుమారులు, నీ కుమారుల కుమారులు, నీ మందలు, నీ పశువులు, నీకు ఉన్నదంతా.
  revised_footnotes: []
  revision_rationale: The revision preserves the Hebrew sequence and emphasis while restoring the singular predicate addressed to Jacob. The dash introduces the appositional household-and-property list without falsely making all listed items the grammatical subject of a plural verb.
