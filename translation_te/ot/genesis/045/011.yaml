id: GEN.45.11
reference: Genesis 45:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/כִלְכַּלְתִּ֤י אֹֽתְ/ךָ֙ שָׁ֔ם כִּי ע֛וֹד חָמֵ֥שׁ שָׁנִ֖ים רָעָ֑ב פֶּן תִּוָּרֵ֛שׁ אַתָּ֥ה וּ/בֵֽיתְ/ךָ֖ וְ/כָל אֲשֶׁר לָֽ/ךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/011.yaml
  text: There I will provide for you, because there are still five years of famine, lest you and your household and all that belongs to you become destitute.
translation:
  language: te
  text: అక్కడ నేను నిన్ను పోషిస్తాను; ఇంకా ఐదు సంవత్సరాలు కరవు ఉంది కాబట్టి, నీవు నీ ఇంటివారితో కూడ, నీకు ఉన్న సమస్తాన్ని కోల్పోయి, నిరుపేదవు కాకుండా ఉంటావు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכִלְכַּלְתִּי
  choice: నేను నిన్ను పోషిస్తాను
  rationale: כלכל అనే క్రియ ఇక్కడ ఆహారం, అవసరాలు సమకూర్చి సంరక్షించడాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘పోషిస్తాను’ సహజంగా, సంక్షిప్తంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: తరువాతి వాక్యం యోసేపు ఎందుకు పోషిస్తాడో కారణాన్ని తెలియజేస్తుంది; మూలంలోని కారణార్థాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: פֶּן
  choice: లేకపోతే
  rationale: నివారించదలచిన ప్రతికూల పరిణామాన్ని పరిచయం చేసే హెచ్చరిక భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: תִּוָּרֵשׁ
  choice: దారిద్ర్యంలో పడిపోతారు
  rationale: ఈ సందర్భంలో క్రియ ఆస్తి లేదా జీవనాధారం కోల్పోయి నిరుపేదలవడాన్ని సూచిస్తుంది; ‘దారిద్ర్యంలో పడిపోవడం’ ఆ ఫలితాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: בֵיתְךָ
  choice: నీ ఇంటివారూ
  rationale: ఇక్కడ ‘ఇల్లు’ భవనాన్ని కాక కుటుంబం లేదా గృహస్థులను సూచిస్తుంది.
- source_word: וְכָל־אֲשֶׁר־לָךְ
  choice: నీకు ఉన్నదంతా
  rationale: వ్యక్తికి చెందిన సమస్త ఆస్తి, వనరులను కలుపుకునే విస్తృత భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: కరవు కారణంగా యోసేపు పోషణ మరియు సంభవించగల దారిద్ర్యం మధ్య సంబంధం
  choice: కారణాన్ని ‘ఎందుకంటే’తో, నివారించవలసిన ఫలితాన్ని ‘లేకపోతే’తో వ్యక్తం చేయడం
  alternative: రెండు సంబంధాలనూ ఒకే దీర్ఘ వాక్యంలో అస్పష్టంగా ఉంచడం
  rationale: మూలంలోని כִּי మరియు פֶּן సంబంధాలను విడివిడిగా నిలుపుతూ, అదనపు దైవశాస్త్రీయ అర్థాన్ని చేర్చకుండా యోసేపు మాటల తార్కిక క్రమాన్ని స్పష్టం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభమైనదిగా, అయితే గౌరవప్రదమైన కథన శైలిలో రూపొందించబడింది. మూలంలోని ఏకవచన ‘నిన్ను/నువ్వు’ను నిలిపి, దానితో కూడిన కుటుంబం మరియు ఆస్తిని తరువాత పేర్కొంది.
