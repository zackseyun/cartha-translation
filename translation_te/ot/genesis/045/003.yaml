  source_fidelity: The Telugu faithfully conveys the Hebrew narrative sequence, Joseph’s explicit self-identification, the continuing-state question about his father, the brothers’ inability to answer, and their alarm/dismay in Joseph’s presence. “దిగ్భ్రాంతి చెందారు” is an appropriately restrained rendering of נִבְהֲלוּ and does not force the stronger sense “terrified.”
