language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יוֹסֵ֤ף אֶל אֶחָי/ו֙ אֲנִ֣י יוֹסֵ֔ף הַ/ע֥וֹד אָבִ֖/י חָ֑י וְ/לֹֽא יָכְל֤וּ אֶחָי/ו֙ לַ/עֲנ֣וֹת אֹת֔/וֹ כִּ֥י נִבְהֲל֖וּ מִ/פָּנָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/003.yaml
  text: Then Joseph said to his brothers[a], “I am Joseph. Is my father still alive?” But his brothers could not answer him[b], because they were dismayed at his presence.
translation:
  language: te
  text: అప్పుడు యోసేపు తన సోదరులతో, “నేను యోసేపును. నా తండ్రి ఇంకా బ్రతికే ఉన్నాడా?” అన్నాడు. అయితే అతని సోదరులు అతనికి జవాబు చెప్పలేకపోయారు; ఎందుకంటే అతని సమక్షంలో[b] వారు దిగ్భ్రాంతి చెందారు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “భయభ్రాంతులయ్యారు” లేదా “హడలిపోయారు.”
    reason: נִבְהֲלוּ అనే పదం దిగ్భ్రాంతి, కలవరం, భయం వంటి పరస్పరం మిళితమైన భావాలను సూచించగలదు.
  - marker: b
    text: అక్షరార్థంగా “అతని ముఖం ఎదుటనుండి”; ఇది ఒకరి సమక్షంలో ఉండడం వల్ల కలిగే ప్రభావాన్ని తెలిపే హీబ్రూ ప్రయోగం.
    reason: మూలంలోని מִפָּנָיו ప్రయోగానికి ఉన్న అక్షరార్థం మరియు కారణసూచక ఛాయను వివరిస్తుంది.
lexical_decisions:
- source_word: וַיֹּאמֶר יוֹסֵף אֶל אֶחָיו
  choice: అప్పుడు యోసేపు తన సోదరులతో ... అన్నాడు
  rationale: వావ్-కన్సెక్యూటివ్ కథన క్రమాన్ని ముందుకు నడిపిస్తుంది; ‘అప్పుడు’ ఆధునిక తెలుగు కథన శైలిలో సహజంగా ఆ క్రమాన్ని తెలియజేస్తుంది.
- source_word: אֲנִי יוֹסֵף
  choice: నేను యోసేపును
  rationale: మూలంలోని స్పష్టమైన స్వీయ పరిచయాన్ని సహజమైన తెలుగు వాక్యరూపంలో నిలుపుతుంది.
- source_word: הַעוֹד אָבִי חָי
  choice: నా తండ్రి ఇంకా బ్రతికే ఉన్నాడా?
  rationale: הַעוֹד కొనసాగుతున్న స్థితిని ప్రశ్నిస్తుంది; ‘ఇంకా బ్రతికే ఉన్నాడా?’ ఆ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది. אָבִי లోని ప్రథమ పురుష స్వామ్యాన్ని ‘నా తండ్రి’గా స్పష్టంగా ఉంచింది.
- source_word: וְלֹא יָכְלוּ ... לַעֲנוֹת אֹתוֹ
  choice: అయితే ... అతనికి జవాబు చెప్పలేకపోయారు
  rationale: יכל యొక్క అసమర్థత భావాన్ని ‘చెప్పలేకపోయారు’ నేరుగా తెలియజేస్తుంది; సందర్భంలోని వ్యత్యాసాన్ని ‘అయితే’ సహజంగా చూపిస్తుంది.
- source_word: נִבְהֲלוּ
  choice: దిగ్భ్రాంతి చెందారు
  rationale: בהל నిఫాల్ రూపం సూచించే అకస్మాత్తు కలవరాన్ని, భయంతో కూడిన దిగ్భ్రాంతిని అతిశయింపకుండా వ్యక్తం చేస్తుంది; ‘భయభ్రాంతులయ్యారు’ లేదా ‘హడలిపోయారు’ కూడా సందర్భానుసార ప్రత్యామ్నాయాలు.
- source_word: מִפָּנָיו
  choice: అతని సమక్షంలో
  rationale: అక్షరార్థంగా ‘అతని ముఖం ఎదుటనుండి’ అనే హీబ్రూ ప్రయోగం, అతని ఎదుట ఉండడం వల్ల కలిగిన ప్రభావాన్ని సూచిస్తుంది; ‘అతని సమక్షంలో’ రూపం ఆ భావాన్ని గౌరవప్రదమైన సహజ తెలుగులో నిలుపుతుంది.
