translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘యోసేపు,’ ‘సోదరులు,’ ‘సమక్షంలో’ వంటి సుపరిచిత బైబిలు పదజాలాన్ని ఉంచుతూ, సాధారణ పాఠకుడికి సులభంగా అర్థమయ్యే వాక్యనిర్మాణం ఎంచుకోబడింది.
