  yaml_path: translation/ot/genesis/045/027.yaml
  text: And they told him all the words of Yosef that he had spoken to them[a], and he saw the wagons that Yosef had sent to carry him[b], and the spirit of their father Yaakov revived.
translation:
  language: te
  text: వారు యోసేపు తమతో చెప్పిన మాటలన్నిటినీ అతనికి చెప్పారు. యోసేపు అతనిని తీసుకురావడానికి పంపిన బండ్లను[a] అతడు చూశాడు. అప్పుడు వారి తండ్రి యాకోబు ఆత్మకు మళ్లీ జీవం వచ్చింది[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘రవాణా బండ్లను.’ హీబ్రూ పదం మనుషులను లేదా సామాను తరలించడానికి ఉపయోగించే చక్రాల వాహనాలను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘వారి తండ్రి యాకోబు ఆత్మ జీవించింది.’ ఇది అతనికి జీవశక్తి లేదా ధైర్యం తిరిగి కలిగిందని తెలిపే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבְּרוּ אֵלָיו
  choice: వారు అతనికి చెప్పారు
  rationale: దావార్ అనే క్రియ ఇక్కడ యాకోబుకు కుమారులు సమాచారం తెలియజేయడాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘చెప్పారు’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: אֵת כָּל דִּבְרֵי יוֹסֵף אֲשֶׁר דִּבֶּר אֲלֵהֶם
  choice: యోసేపు తమతో చెప్పిన మాటలన్నిటినీ
  rationale: ‘మాటలు’ అనే నామవాచకాన్ని నిలుపుతూ, దిబ్రే/దిబ్బేర్ మధ్యనున్న పదబంధ సంబంధాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: הָעֲגָלוֹת
  choice: బండ్లు
  rationale: ఈ పదం ప్రయాణికులను లేదా సామాను రవాణా చేసే చక్రాల వాహనాలను సూచిస్తుంది; ‘బండ్లు’ సాధారణ ఆధునిక తెలుగు పదం.
- source_word: אֲשֶׁר שָׁלַח יוֹסֵף לָשֵׂאת אֹתוֹ
  choice: తనను తీసుకురావడానికి యోసేపు పంపిన
  rationale: నాసా అనే క్రియకు ‘మోయడం/తీసుకెళ్లడం’ అనే భావం ఉంది. గమ్యస్థానం యోసేపు ఉన్న ఐగుప్తు కావడంతో ‘తీసుకురావడానికి’ తెలుగులో సహజంగా సందర్భాన్ని తెలియజేస్తుంది.
- source_word: וַתְּחִי רוּחַ
  choice: ఆత్మ మళ్లీ చైతన్యం పొందింది
  rationale: హీబ్రూ జీవం-సంబంధిత నుడికారాన్ని పూర్తిగా శారీరక పునర్జీవంగా భావింపజేయకుండా, యాకోబుకు తిరిగి కలిగిన జీవశక్తి మరియు ధైర్యాన్ని తెలియజేస్తుంది; ‘ఆత్మ’ ద్వారా רוּחַను నిలుపుతుంది.
- source_word: יַעֲקֹב אֲבִיהֶם
  choice: వారి తండ్రి యాకోబు
  rationale: హీబ్రూ పదక్రమం, కుటుంబ సంబంధం రెండింటినీ సహజమైన తెలుగు రూపంలో నిలుపుతుంది; పేరును మూలభాష ధ్వనికి అనుగుణంగా లిప్యంతరీకరించింది.
theological_decisions:
- issue: וַתְּחִי רוּחַ అనే నుడికారాన్ని అర్థం చేసుకోవడం
  choice: ఆత్మ మళ్లీ చైతన్యం పొందింది
  alternative: ఆత్మ మళ్లీ జీవించింది / ప్రాణం తిరిగి వచ్చింది
  rationale: ఈ సందర్భంలో యాకోబు మరణించి తిరిగి జీవించాడని కాదు; అతని జీవశక్తి, ఆశ, ధైర్యం పునరుద్ధరించబడినట్లు నుడికారం సూచిస్తుంది. అయినా ‘ఆత్మ’ను ఉంచి మూలంలోని భావ విస్తృతిని కాపాడింది.
- issue: יַעֲקֹב అనే పితరుని పేరు
  choice: యాకోబు
  alternative: జాకబ్
  rationale: హీబ్రూ పేరును తెలుగు ధ్వని నిర్మాణానికి అనుగుణంగా లిప్యంతరీకరించడం, ఆంగ్లీకృత రూపాన్ని ఆధారంగా చేసుకోవడం కంటే మూలభాషకు దగ్గరగా ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సరళమైనా గౌరవప్రదమైన కథన శైలి. పొడవైన హీబ్రూ సమన్వయ వాక్యాన్ని తెలుగు పఠనసౌలభ్యం కోసం మూడు వాక్యాలుగా విభజించాం. మూలంలోని వరుస కథన గమనాన్ని ‘అప్పుడు’తో స్పష్టంచేశాం.
