translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. పంపిణీ భావాన్ని ‘ఒక్కొక్కరికి ఒక్కో’ ద్వారా సహజంగా వ్యక్తం చేశాం. ‘వెండి నాణాలు’ సాధారణ పాఠకుడికి స్పష్టమైనప్పటికీ, మూలంలో ప్రమాణం పేర్కొనబడలేదని పాదసూచికలో కాపాడాం.
