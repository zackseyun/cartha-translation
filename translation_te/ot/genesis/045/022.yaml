  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: לְ/כֻלָּ֥/ם נָתַ֛ן לָ/אִ֖ישׁ חֲלִפ֣וֹת שְׂמָלֹ֑ת וּ/לְ/בִנְיָמִ֤ן נָתַן֙ שְׁלֹ֣שׁ מֵא֣וֹת כֶּ֔סֶף וְ/חָמֵ֖שׁ חֲלִפֹ֥ת שְׂמָלֹֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/022.yaml
  text: To each of them he gave a change of clothes[b][a], but to Benjamin he gave three hundred pieces of silver and five changes of clothes.
translation:
  language: te
  text: వారిలో ఒక్కొక్కరికి ఒక్కో జత దుస్తులు ఇచ్చాడు.[a] అయితే బెన్యామీనుకు మూడు వందల వెండి ముక్కలు[b], ఐదు జతల దుస్తులు ఇచ్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “వారందరికీ, ప్రతి మనిషికి.”
    reason: previous_rendering
  - marker: b
    text: హీబ్రూలో “మూడు వందల వెండి” అని మాత్రమే ఉంది; నిర్దిష్ట ద్రవ్య ప్రమాణం చెప్పబడలేదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכֻלָּם ... לָאִישׁ
  choice: వారిలో ఒక్కొక్కరికి
  rationale: రెండు పంపిణీ సూచక పదబంధాల భావాన్ని సహజమైన తెలుగులో కలిపి, ప్రతి వ్యక్తికీ ఇచ్చాడనే అర్థాన్ని నిలుపుతుంది.
- source_word: נָתַן
  choice: ఇచ్చాడు
  rationale: బహుమతులు ఇచ్చే ఈ కథన సందర్భంలో సాధారణమైన, సహజమైన అనువాదం.
- source_word: חֲלִפוֹת שְׂמָלֹת
  choice: జతల బట్టలు
  rationale: మార్చుకొని ధరించడానికి ఇచ్చిన అదనపు దుస్తుల సముదాయాలను ఆధునిక తెలుగులో సహజంగా సూచిస్తుంది; మొదటి భాగంలో పంపిణీ భావం వల్ల ‘ఒక్కో జత’ అని ఉంది.
- source_word: וּלְבִנְיָמִן
  choice: అయితే బెన్యామీనుకు
  rationale: మిగతావారికి ఇచ్చినదానికీ బెన్యామీనుకు ఇచ్చిన విశేష బహుమతికీ మధ్యనున్న వ్యత్యాసాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: שְׁלֹשׁ מֵאוֹת כֶּסֶף
  choice: మూడు వందల వెండి నాణాలు
  rationale: హీబ్రూలో నిర్దిష్ట ద్రవ్య ప్రమాణం చెప్పబడలేదు. ‘నాణాలు’ అనేది తెలుగులో ధనమొత్తాన్ని సహజంగా సూచించినా, అది మూలంలోని అస్పష్టతను కొంత నిర్దిష్టం చేస్తుంది; అందుకే పాదసూచిక ఇచ్చాం.
- source_word: וְחָמֵשׁ חֲלִפֹת שְׂמָלֹת
  choice: ఐదు జతల బట్టలు
  rationale: ముందున్న దుస్తుల పదబంధంతో భావసామ్యాన్ని ఉంచుతూ సంఖ్యను స్పష్టంగా అందిస్తుంది.
