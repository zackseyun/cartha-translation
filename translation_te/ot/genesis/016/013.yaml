source:
  edition: WLC
  text: וַ/תִּקְרָ֤א שֵׁם יְהוָה֙ הַ/דֹּבֵ֣ר אֵלֶ֔י/הָ אַתָּ֖ה אֵ֣ל רֳאִ֑י כִּ֣י אָֽמְרָ֗ה הֲ/גַ֥ם הֲלֹ֛ם רָאִ֖יתִי אַחֲרֵ֥י רֹאִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/013.yaml
  text: So she called the name of Yahweh who spoke to her[a], “You are a God who sees me,” for she said[c][b], “Have I really here seen after the One who sees me?”
translation:
  language: te
  text: తనతో మాట్లాడిన యహ్వేకు ఆమె, “నీవు నన్ను చూసే దేవుడవు”[a] అని పేరు పెట్టింది. ఎందుకంటే ఆమె, “నన్ను చూసేవాని తరువాత కూడా నేను ఇక్కడ నిజంగా చూశానా?”[b] అని చెప్పింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీవు చూసే దేవుడవు,” లేదా “నీవు దర్శనపు దేవుడవు.”
    reason: lexical_alternative
  - marker: b
    text: చివరి వాక్యభాగం హీబ్రూలో చాలా క్లిష్టంగా ఉంది. దీనికి, “నన్ను చూసినవానిని చూసిన తరువాత కూడా నేను ఇక్కడ బ్రతికే ఉన్నానా?” అనే అర్థం ఉండవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּקְרָא שֵׁם יְהוָה
  choice: యహ్వేకు ఆమె … అని పేరు పెట్టింది
  rationale: ‘పేరు పిలిచింది’ అనే హీబ్రూ నుడికారాన్ని తెలుగులో యాంత్రికంగా అనుకరించకుండా, హాగరు యహ్వేకు ఒక వర్ణనాత్మక పేరు పెట్టిందనే భావాన్ని సహజంగా తెలియజేస్తుంది. יְהוָה అనే వ్యక్తిగత నామాన్ని ‘యహ్వే’గా ఉంచింది.
- source_word: הַדֹּבֵר אֵלֶיהָ
  choice: తనతో మాట్లాడిన
  rationale: హాగరుతో సంభాషించినవాడిగా యహ్వేను గుర్తించే హీబ్రూ కృదంత నిర్మాణాన్ని సహజమైన తెలుగు సంబంధవాచక రూపంలో అందిస్తుంది.
- source_word: אַתָּה אֵל רֳאִי
  choice: నీవు నన్ను చూసే దేవుడవు
  rationale: רֳאִי రూపం ‘చూడడం’ లేదా ‘నన్ను చూసేవాడు’ అనే భావాలకు వీలిస్తుంది. సందర్భంలో హాగరును దేవుడు గమనించాడనే భావాన్ని ముందుకు తెస్తూ, హీబ్రూలో లేని నిర్దిష్టతను అధికంగా చేర్చదు.
- source_word: כִּי אָמְרָה
  choice: ఎందుకంటే ఆమె … అని అనుకుంది
  rationale: పేరు పెట్టడానికి కారణాన్ని పరిచయం చేస్తుంది. ఇక్కడ ఆమె తనలో తాను పలికిన మాటగా ‘అనుకుంది’ సహజంగా ఉంది.
- source_word: הֲגַם הֲלֹם
  choice: కూడా నేను ఇక్కడ నిజంగా
  rationale: ప్రశ్నలోని ఆశ్చర్యం, బలాన్ని ‘కూడా’, ‘నిజంగా’ అనే పదాలతో వ్యక్తపరుస్తుంది.
- source_word: רָאִיתִי אַחֲרֵי רֹאִי
  choice: నన్ను చూసేవాని తరువాత కూడా నేను … నిజంగా చూశానా?
  rationale: అత్యంత క్లిష్టమైన హీబ్రూ పదబంధంలోని ‘చూశాను’, ‘తరువాత’, ‘నన్ను చూసేవాడు’ అనే అంశాలను వీలైనంత స్పష్టంగా ఉంచి, ‘చూసి కూడా బ్రతికాను’ అనే వ్యాఖ్యానాన్ని ప్రధాన పాఠ్యంలో చేర్చకుండా సందిగ్ధతను కాపాడుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠ్యంలో ఉన్న చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా వ్యక్తిగత నామంగా లిప్యంతరీకరించింది.
- issue: אֵל רֳאִי అనే దైవవర్ణన
  choice: నీవు నన్ను చూసే దేవుడవు
  alternative: నీవు చూసే దేవుడవు; నీవు దర్శనపు దేవుడవు
  rationale: హాగరును దేవుడు చూశాడనే తక్షణ సందర్భానికి అనుగుణంగా ఉంది; అయినా ఇతర సాధ్యార్థాలను పాదటిప్పణిలో నిలుపుతుంది.
- issue: רָאִיתִי אַחֲרֵי רֹאִי అనే చివరి వాక్యభాగం
  choice: నన్ను చూసేవాని తరువాత కూడా నేను ఇక్కడ నిజంగా చూశానా?
  alternative: నన్ను చూసినవానిని చూసి కూడా నేను ఇక్కడ బ్రతికే ఉన్నానా?
  rationale: హీబ్రూ వాక్యనిర్మాణం సంక్షిప్తంగానూ క్లిష్టంగానూ ఉంది. ప్రధాన పాఠ్యం దాని అస్పష్టతను నిలుపుతుంది; బ్రతికి ఉండడం గురించిన సాంప్రదాయ వ్యాఖ్యానాన్ని పాదటిప్పణిలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. ప్రధాన వాక్యం సులభంగా చదవదగినదిగా ఉంచినా, చివరి హీబ్రూ వాక్యభాగంలోని నిజమైన సందిగ్ధతను అతిగా వివరణాత్మకంగా మార్చలేదు.
