id: GEN.16.10
reference: Genesis 16:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר לָ/הּ֙ מַלְאַ֣ךְ יְהוָ֔ה הַרְבָּ֥ה אַרְבֶּ֖ה אֶת זַרְעֵ֑/ךְ וְ/לֹ֥א יִסָּפֵ֖ר מֵ/רֹֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/010.yaml
  text: Then the angel of Yahweh said to her[a], “I will greatly multiply your offspring, so that it cannot be counted because of its multitude.”
translation:
  language: te
  text: 'అప్పుడు యాహ్వే దూత[a] ఆమెతో ఇలా అన్నాడు: “నేను నీ సంతానాన్ని ఎంతో విస్తరింపజేస్తాను; అది ఎంతో ఎక్కువగా ఉండి లెక్కించలేనంతగా ఉంటుంది.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యాహ్వే సందేశవాహకుడు.”
    reason: מַלְאָךְ అనే హీబ్రూ పదం ‘దూత’తో పాటు ‘సందేశవాహకుడు’ అనే అర్థాన్నీ కలిగి ఉంటుంది.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... అన్నాడు
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది; ఆధునిక తెలుగు కథనశైలిలో ‘అప్పుడు’ సంఘటనల క్రమాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: מַלְאַךְ יְהוָה
  choice: యాహ్వే దూత
  rationale: מַלְאַךְ అనే పదానికి ‘దూత’ లేదా ‘సందేశవాహకుడు’ అనే అర్థాలు ఉండవచ్చు. ‘యాహ్వే దూత’ ఆదికాండంలోని స్థిరమైన ప్రయోగానికి తగినదిగా ఉండి, ఆ వ్యక్తి గుర్తింపును మరింతగా నిర్వచించదు.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హీబ్రూ దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ తెలుగు లిప్యంతరీకరణ ‘యాహ్వే’గా ఇచ్చాం.
- source_word: הַרְבָּה אַרְבֶּה
  choice: ఎంతో విస్తరింపజేస్తాను
  rationale: క్రియావిశేషక క్రియారూపం మరియు పరిమిత క్రియ కలయిక చర్య పరిమాణాన్ని బలంగా వ్యక్తం చేస్తుంది. ‘ఎంతో’ ఆ తీవ్రతను సహజమైన తెలుగులో తెలియజేస్తుంది; దీనిని కేవలం నిశ్చయార్థంగా మార్చదు.
- source_word: זַרְעֵךְ
  choice: నీ సంతానం
  rationale: זֶרַע ఇక్కడ సమూహార్థక ఏకవచనం. ‘సంతానం’ ఆ సమూహార్థాన్ని సహజంగా నిలుపుతుంది.
- source_word: וְלֹא יִסָּפֵר
  choice: లెక్కించలేనంతగా ఉంటుంది
  rationale: నిఫాల్ రూపం లెక్కింపబడడాన్ని సూచిస్తుంది; సందర్భంలో ఉద్దేశం సంఖ్యాతీతమైన విస్తారాన్ని తెలియజేయడం.
- source_word: מֵרֹב
  choice: అది విస్తారంగా ఉండడం వల్ల
  rationale: מִן + רֹב ఇక్కడ అధిక సంఖ్య కారణంగా లెక్కించలేకపోవడాన్ని సూచిస్తుంది. తెలుగు రూపం ఆ కారణ సంబంధాన్ని స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది; అందువల్ల దానిని బిరుదుగా మార్చకుండా లిప్యంతరీకరించాం.
- issue: מַלְאַךְ יְהוָה యొక్క గుర్తింపు మరియు అర్థపరిధి
  choice: యాహ్వే దూత
  alternative: యాహ్వే సందేశవాహకుడు
  rationale: ‘దూత’ దేవదూతను లేదా పంపబడిన సందేశవాహకుణ్ణి సూచించగలదు. మూలపాఠం ఉంచిన గుర్తింపు సంబంధమైన ఉద్వేగాన్ని పరిష్కరించకుండా ప్రధాన పాఠంలో సాధారణ ప్రయోగాన్ని ఉంచి, ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే కథనశైలి వాడబడింది. ‘సంతానం’ సమూహార్థక ఏకవచనాన్ని నిలుపుతుంది; ‘ఎంతో విస్తరింపజేస్తాను’ హీబ్రూ తీవ్రతను పరిమాణార్థంగా వ్యక్తం చేస్తుంది.
