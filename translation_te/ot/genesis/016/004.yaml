- from: అతడు హాగరుతో కలిశాడు; ఆమె గర్భవతి అయింది. తాను గర్భవతి అయ్యానని ఆమె గ్రహించినప్పుడు, ఆమె దృష్టిలో తన యజమానురాలు చులకన అయింది.[a]
  to: అతడు హాగరుతో శయనించాడు; ఆమె గర్భం దాల్చింది. తాను గర్భవతి అని ఆమె చూసినప్పుడు, తన యజమానురాలు ఆమె దృష్టిలో చులకన అయింది.[a]
  rationale: The opening verb is revised because the draft's ‘కలిశాడు’ fails to convey the contextual sexual sense of the Hebrew euphemism. The conception/perception wording is made more idiomatic and source-proximate. The final clause preserves the Hebrew grammatical subject and its evaluative idiom, and the footnote states the viable active rendering without treating it as the primary syntax.
