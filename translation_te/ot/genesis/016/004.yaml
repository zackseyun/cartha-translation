  text: וַ/יָּבֹ֥א אֶל הָגָ֖ר וַ/תַּ֑הַר וַ/תֵּ֨רֶא֙ כִּ֣י הָרָ֔תָה וַ/תֵּקַ֥ל גְּבִרְתָּ֖/הּ בְּ/עֵינֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/004.yaml
  text: He went in to Hagar[a], and she conceived. When she saw that she had conceived, her mistress was despised in her eyes.
translation:
  language: te
  text: అతడు హాగరుతో శయనించాడు; ఆమె గర్భం దాల్చింది. తాను గర్భవతి అని ఆమె చూసినప్పుడు, తన యజమానురాలు ఆమె దృష్టిలో చులకన అయింది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆమె తన యజమానురాలిని చిన్నచూపు చూసింది.” హీబ్రూ వాక్యనిర్మాణం ప్రకారం యజమానురాలు హాగరు దృష్టిలో చులకన అయింది; ఈ క్రియను హాగరు తన యజమానురాలిని చిన్నచూపు చూసిందనే భావంలో కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא אֶל הָגָר
  choice: అతడు హాగరుతో కలిశాడు
  rationale: בוא אל అనే హీబ్రూ ప్రయోగం ఈ సందర్భంలో లైంగిక సంబంధాన్ని మర్యాదపూర్వకంగా సూచిస్తుంది. ఆధునిక తెలుగులో ‘కలిశాడు’ ఆ భావాన్ని సహజంగా, అనవసరమైన స్పష్టత లేకుండా తెలియజేస్తుంది.
- source_word: וַתַּהַר / הָרָתָה
  choice: గర్భవతి అయింది / గర్భవతి అయ్యానని
  rationale: הרה గర్భం ధరించడాన్ని లేదా గర్భవతిగా ఉండడాన్ని సూచిస్తుంది. తెలుగు సహజత్వాన్ని కాపాడుతూ మూలంలోని పదపునరుక్తిని సాధ్యమైనంతవరకు నిలిపింది.
- source_word: וַתֵּרֶא כִּי
  choice: గ్రహించినప్పుడు
  rationale: ఇక్కడ ראה ప్రత్యక్షంగా చూడడం కంటే తన స్థితిని తెలుసుకోవడం లేదా గ్రహించడం అనే భావంలో ఉంది; కాలక్రమ సంబంధాన్ని ‘అప్పుడు’తో సహజంగా తెలిపింది.
- source_word: וַתֵּקַל
  choice: చులకన అయింది
  rationale: קלל ఇక్కడ విలువ తగ్గి కనిపించడం, తేలికగా ఎంచబడడం అనే భావాన్ని ఇస్తుంది. ‘చులకన అయింది’ యజమానురాలి నిజ స్థితి మారిందని ఖచ్చితంగా చెప్పకుండా, హాగరు అంచనాలో ఆమె స్థానం తగ్గిందనే భావాన్ని నిలుపుతుంది.
- source_word: גְּבִרְתָּהּ
  choice: తన యజమానురాలు
  rationale: גברת ఒక స్త్రీపై అధికారమున్న మహిళను సూచిస్తుంది. ఈ సామాజిక సంబంధాన్ని ఆధునిక తెలుగులో ‘యజమానురాలు’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: בְּעֵינֶיהָ
  choice: ఆమె దృష్టిలో
  rationale: ‘ఆమె కళ్లలో’ అనే హీబ్రూ నుడికారానికి తెలుగులో సహజమైన మూల్యాంకనార్థక సమానార్థకం ‘ఆమె దృష్టిలో’.
