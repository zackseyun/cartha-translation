  terminology: ‘బానిస స్త్రీ’ faithfully preserves the bonded status denoted by שִׁפְחָה and avoids reducing it to ordinary domestic employment. The names ‘శారయి,’ ‘అబ్రాము,’ and ‘హాగరు’ follow established Telugu biblical forms. The footnote is correctly anchored and accurately offers softer traditional alternatives without making them the main rendering.
