  source_fidelity: 'The Telugu accurately represents the Hebrew: Sarai is identified as Abram’s wife; her not bearing children for him is retained; and the possession and identification of an Egyptian slave woman named Hagar are clear. The supplied ‘పిల్లలను’ appropriately makes the implicit object explicit in idiomatic Telugu.'
