translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని వాడాం. బానిసత్వపు సామాజిక వాస్తవాన్ని మృదువుపరచకుండా, పాఠకులకు స్పష్టంగా ఉండే పదజాలాన్ని ఎంచుకున్నాం.
