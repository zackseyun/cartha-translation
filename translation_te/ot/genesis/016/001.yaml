  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/שָׂרַי֙ אֵ֣שֶׁת אַבְרָ֔ם לֹ֥א יָלְדָ֖ה ל֑/וֹ וְ/לָ֛/הּ שִׁפְחָ֥ה מִצְרִ֖ית וּ/שְׁמָ֥/הּ הָגָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/001.yaml
  text: Sarai[a], Abram’s wife, had borne him no children, and she had an Egyptian servant woman whose name was Hagar.
translation:
  language: te
  text: అబ్రాము భార్య శారయి అతనికి పిల్లలను కనలేదు. ఆమెకు హాగరు అనే ఐగుప్తీయ బానిస స్త్రీ[a] ఉండేది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పదం ఇంటిలో సేవచేసే బంధిత స్త్రీని సూచిస్తుంది; సంప్రదాయంగా దీనిని ‘దాసి’ లేదా ‘సేవకురాలు’ అని కూడా అనువదిస్తారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׂרַי
  choice: శారయి
  rationale: వావ్ సంధి కథన అనుసంధానాన్ని సూచిస్తుంది; తెలుగులో వాక్యారంభంలో ప్రత్యేకంగా ‘మరియు’ చేర్చకుండా సహజమైన కథన కొనసాగింపుగా చూపించాం. పేరును ‘శారయి’గా లిప్యంతరీకరించాం.
- source_word: אֵשֶׁת אַבְרָם
  choice: అబ్రాము భార్య
  rationale: హీబ్రూ సమాస నిర్మాణంలోని ‘అబ్రాము యొక్క భార్య’ అనే సంబంధాన్ని సహజమైన తెలుగు స్వామ్య నిర్మాణంతో తెలిపాం.
- source_word: לֹא יָלְדָה לוֹ
  choice: అతనికి పిల్లలను కనలేదు
  rationale: యָלַד క్రియతో ఉన్న పరోక్ష కర్మ ‘అతనికి’ని నిలిపి, తెలుగులో భావం సంపూర్ణంగా ఉండేందుకు సందర్భంలో అంతర్లీనమైన సంతానార్థాన్ని ‘పిల్లలను’గా వ్యక్తం చేశాం.
- source_word: וְלָהּ
  choice: ఆమెకు … ఉండేది
  rationale: అక్షరార్థంగా ‘ఆమెకు [ఒకరు] ఉండెను’ అనే స్వామ్య నిర్మాణాన్ని సహజమైన తెలుగులో అదే విధంగా నిలిపాం.
- source_word: שִׁפְחָה
  choice: బానిస స్త్రీ
  rationale: ఈ పదం ఇంటి పరిధిలో సేవచేసే స్వేచ్ఛలేని స్త్రీని సూచిస్తుంది. కేవలం ‘పనిమనిషి’ లేదా ‘సేవకురాలు’ అనడం బంధిత సామాజిక స్థితిని మృదువుపరచవచ్చు కాబట్టి ‘బానిస స్త్రీ’ని ఎంచుకున్నాం.
- source_word: מִצְרִית
  choice: ఐగుప్తీయ
  rationale: ఆమె ఐగుప్తు దేశానికి చెందినదని తెలిపే విశేషణాన్ని తెలుగు బైబిల్ నామరూప సంప్రదాయానికి అనుగుణంగా ఇచ్చాం.
- source_word: וּשְׁמָהּ הָגָר
  choice: హాగరు అనే
  rationale: ‘ఆమె పేరు హాగరు’ అనే స్పష్టమైన నామపరిచయాన్ని తెలుగులో సహజంగా నామవాచకానికి ముందు ‘హాగరు అనే’గా కలిపాం.
