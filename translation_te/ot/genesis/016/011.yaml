id: GEN.16.11
reference: Genesis 16:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר לָ/הּ֙ מַלְאַ֣ךְ יְהוָ֔ה הִנָּ֥/ךְ הָרָ֖ה וְ/יֹלַ֣דְתְּ בֵּ֑ן וְ/קָרָ֤את שְׁמ/וֹ֙ יִשְׁמָעֵ֔אל כִּֽי שָׁמַ֥ע יְהוָ֖ה אֶל עָנְיֵֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/011.yaml
  text: Then the angel of Yahweh said to her[a], “Behold, you are pregnant and will bear a son, and you shall call his name Ishmael, because Yahweh has heard your affliction.”
translation:
  language: te
  text: 'అప్పుడు యహ్వే దూత ఆమెతో[a] ఇలా అన్నాడు: “ఇదిగో, నీవు గర్భవతివి; నీవు ఒక కుమారుణ్ణి కంటావు. అతనికి ఇష్మాయేలు అని పేరు పెట్టాలి. ఎందుకంటే యహ్వే నీ బాధను విన్నాడు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “యహ్వే దేవదూత.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: యెహోవా దూత
  rationale: מַלְאַךְ అంటే ‘దూత’ లేదా సందర్భానుసారంగా ‘దేవదూత’. ‘యెహోవా దూత’ అనే రూపం హెబ్రీ పదబంధానికి దగ్గరగా ఉండి, ఆ దూత స్వరూపాన్ని వచనం చెప్పినదానికంటే ఎక్కువగా నిర్ధారించదు.
- source_word: הִנָּךְ הָרָה
  choice: ఇదిగో, నీవు గర్భవతివి
  rationale: הִנָּךְ శ్రద్ధను ఆకర్షించే గంభీర ప్రకటనను సూచిస్తుంది; ‘ఇదిగో’ దాని సూచనాత్మక బలాన్ని నిలుపుతుంది. הָרָהను ఆధునిక, స్పష్టమైన ‘గర్భవతివి’గా అనువదించాం.
- source_word: וְיֹלַדְתְּ בֵּן
  choice: నీవు ఒక కుమారుణ్ణి కంటావు
  rationale: రాబోయే జననాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తూ, ‘కుమారుడు’ అనే మూలార్థాన్ని నిలుపుతుంది.
- source_word: וְקָרָאת שְׁמוֹ
  choice: అతనికి ... అని పేరు పెట్టాలి
  rationale: హెబ్రీ నామకరణ సూత్రంలోని ఆదేశాత్మక భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: יִשְׁמָעֵאל
  choice: ఇష్మాయేలు
  rationale: వ్యక్తి పేరును ప్రామాణిక తెలుగు లిప్యంతరీకరణలో ఇచ్చాం; దాని ధ్వన్యర్థాన్ని తరువాతి కారణవాక్యం వివరిస్తుంది.
- source_word: כִּי שָׁמַע יְהוָה
  choice: ఎందుకంటే యెహోవా ... విన్నాడు
  rationale: כִּי నామకరణానికి కారణాన్ని ఇస్తుంది. שָׁמַע అనే సంపూర్ణ క్రియను తెలుగులో సహజమైన భూతకాల రూపంతో ఇచ్చాం.
- source_word: עָנְיֵךְ
  choice: నీ బాధను
  rationale: ఈ పదం బాధ, కష్టం, అణచివేతలోని దుస్థితి వంటి విస్తృత భావాన్ని కలిగి ఉంది. సందర్భంలో సహజంగా ఉండే ‘బాధ’ ఆ విస్తృతిని అనవసరంగా సంకుచితం చేయదు.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో స్థిరపడిన వ్యక్తినామ రూపమైన ‘యెహోవా’గా ఇచ్చాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా పేరుగానే నిలిపాం.
- issue: מַלְאַךְ יְהוָה యొక్క గుర్తింపు
  choice: యెహోవా దూత
  alternative: యెహోవా దేవదూత
  rationale: ‘దూత’ మూలపదంలోని ‘సందేశవాహకుడు/దూత’ భావాన్ని నిలుపుతుంది; ఈ వచనం స్పష్టంగా చెప్పని మరింత నిర్దిష్టమైన దైవశాస్త్రీయ గుర్తింపును అనువాదంలో చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలిని ఉపయోగించాం. ‘ఇదిగో’ ప్రకటనలోని గంభీరతను నిలుపుతుంది; మిగతా వాక్య నిర్మాణం సహజ తెలుగు పఠనానికి అనుగుణంగా ఉంది.
