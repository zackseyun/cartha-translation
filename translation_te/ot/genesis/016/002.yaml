id: GEN.16.2
reference: Genesis 16:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/תֹּ֨אמֶר שָׂרַ֜י אֶל אַבְרָ֗ם הִנֵּה נָ֞א עֲצָרַ֤/נִי יְהוָה֙ מִ/לֶּ֔דֶת בֹּא נָא֙ אֶל שִׁפְחָתִ֔/י אוּלַ֥י אִבָּנֶ֖ה מִמֶּ֑/נָּה וַ/יִּשְׁמַ֥ע אַבְרָ֖ם לְ/ק֥וֹל שָׂרָֽי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/002.yaml
  text: Then Sarai said to Abram[a], “Look now, Yahweh has kept me from bearing children. Please go in to my female servant; perhaps I will be built up through her.” And Abram listened to the voice of Sarai.
translation:
  language: te
  text: 'అప్పుడు శారయి అబ్రాముతో ఇలా అంది: “చూడు, యెహోవా నన్ను పిల్లలు కననివ్వలేదు. దయచేసి నా దాసితో కలువు. బహుశా ఆమె ద్వారా నేను సంతానం పొందుతానేమో[a].” అబ్రాము శారయి చెప్పినట్లు చేశాడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “బహుశా నేను ఆమె ద్వారా కట్టబడతానేమో” అని ఉంది. ఇది ఆమె ద్వారా పిల్లలను పొందడం లేదా కుటుంబంగా స్థాపించబడడం అనే భావాన్ని సూచించవచ్చు.
    reason: అִבָּנֶה మౌలిక ‘కట్టబడటం’ రూపకాన్ని, దాని సంతాన/కుటుంబ-నిర్మాణ భావవ్యాప్తితో సహా కాపాడడానికి.
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: అప్పుడు ... ఇలా అంది
  rationale: వావ్-కన్సిక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది; ఆధునిక తెలుగు కథన ప్రవాహంలో ‘అప్పుడు’ సహజంగా క్రమాన్ని తెలియజేస్తుంది.
- source_word: הִנֵּה נָא
  choice: చూడు
  rationale: వినేవారి దృష్టిని ఆకర్షించే హీబ్రూ ప్రయోగాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది; נָא ఇచ్చే మృదుత్వం సందర్భంలోని అభ్యర్థనలోనూ ప్రతిఫలిస్తుంది.
- source_word: עֲצָרַנִי יְהוָה מִלֶּדֶת
  choice: యెహోవా నన్ను పిల్లలు కననివ్వలేదు
  rationale: శారయి తన సంతానలేమిని యెహోవా చర్యకే ఆపాదిస్తున్న భావాన్ని తగ్గించకుండా, తెలుగులో సహజంగా అందిస్తుంది.
- source_word: בֹּא נָא אֶל
  choice: దయచేసి ... చేరు
  rationale: లైంగిక కలయికను సూచించే మూలంలోని సభ్యోక్తిని తెలుగులో గౌరవప్రదమైన సభ్యోక్తిగానే ఉంచుతుంది; נָא ను ‘దయచేసి’గా వ్యక్తపరుస్తుంది.
- source_word: שִׁפְחָתִי
  choice: నా దాసిని
  rationale: ఆ స్త్రీ స్వతంత్ర సేవకురాలు కాక, అధీనస్థితిలో ఉన్న దాసి అనే సామాజిక స్థితిని మృదువుపరచకుండా సూచిస్తుంది.
- source_word: אוּלַי אִבָּנֶה מִמֶּנָּה
  choice: బహుశా ఆమె ద్వారా నేను సంతానం పొందుతానేమో[a]
  rationale: సందర్భంలోని సంతానప్రాప్తి భావాన్ని సాధారణ పాఠకునికి సహజంగా తెలియజేస్తుంది; ‘కట్టబడటం’ అనే హీబ్రూ రూపకాన్ని, దానిలోని కుటుంబంగా స్థాపించబడటం అనే విస్తృత సాధ్యతను పాదసూచికలో కాపాడుతుంది.
- source_word: וַיִּשְׁמַע אַבְרָם לְקוֹל שָׂרָי
  choice: అబ్రాము శారయి మాట విన్నాడు
  rationale: ‘స్వరాన్ని వినడం’ అనే హీబ్రూ ప్రయోగంలోని వినడం/అంగీకరించడం అనే భావసాంద్రతను తెలుగులో ‘మాట విన్నాడు’ సహజంగా నిలుపుతుంది.
theological_decisions:
- issue: శారయి సంతానలేమిలో యెహోవా పాత్ర
  choice: యెహోవా నన్ను పిల్లలు కననివ్వలేదు
  alternative: యెహోవా నన్ను పిల్లలు కనకుండా అడ్డుకున్నాడు
  rationale: వాక్యం దైవ చర్యను స్పష్టంగా ఆపాదిస్తుంది. దానిని తగ్గించకుండా ఉంచుతూ, దానికి అదనపు కారణం లేదా సమర్థనను అనువాదం చేర్చదు.
- issue: లైంగిక కలయికను ఎంత స్పష్టంగా చెప్పాలి
  choice: నా దాసిని చేరు
  alternative: నా దాసితో లైంగిక సంబంధం పెట్టుకో
  rationale: మూలపాఠం ఉద్దేశపూర్వకంగా సభ్యోక్తిని ఉపయోగిస్తుంది. ఎంపిక చేసిన తెలుగు పదబంధం సందర్భంలో అర్థమయ్యేలా ఉండి, మూలంలోని మితమైన శైలిని కాపాడుతుంది.
- issue: אִבָּנֶה అనే నిర్మాణ రూపకం
  choice: ప్రధాన పాఠంలో సంతానప్రాప్తి భావం; పాదసూచికలో అక్షరార్థ రూపకం మరియు దాని సాధ్యమైన విస్తృతి
  alternative: నేను ఆమె ద్వారా కట్టబడతానేమో
  rationale: తెలుగులో అక్షరార్థ రూపం అత్యంత అసహజంగా, అస్పష్టంగా ఉంటుంది. అందువల్ల సందర్భార్థాన్ని ప్రధాన పాఠంలో ఇచ్చి, కుటుంబంగా నిర్మించబడటం లేదా స్థాపించబడటం అనే మూల రూపకపు ఉద్రిక్తతను పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకునికి అర్థమయ్యే, గౌరవప్రదమైన కథనశైలి. ‘దాసి’ ద్వారా బంధిత సామాజిక స్థితి నిలుపబడింది; లైంగిక చర్యకు మూలంలోని సభ్యోక్తి కాపాడబడింది. దైవనామం יְהוָה ను తెలుగు బైబిలు వాడుకకు అనుగుణంగా ‘యెహోవా’గా లిప్యంతరీకరించాం.
