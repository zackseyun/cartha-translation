revisions:
- from: 'అప్పుడు శారయి అబ్రాముతో ఇలా అంది: “చూడు, యెహోవా నన్ను పిల్లలు కననివ్వలేదు. దయచేసి నా దాసిని చేరు. బహుశా ఆమె ద్వారా నేను సంతానం పొందుతానేమో[a].” అబ్రాము శారయి మాట విన్నాడు.'
  to: 'అప్పుడు శారయి అబ్రాముతో ఇలా అంది: “చూడు, యెహోవా నన్ను పిల్లలు కననివ్వలేదు. దయచేసి నా దాసితో కలువు. బహుశా ఆమె ద్వారా నేను సంతానం పొందుతానేమో[a].” అబ్రాము శారయి చెప్పినట్లు చేశాడు.'
  rationale: సురక్షితమైన రెండు శైలీ-నిర్దిష్ట సవరణలు మాత్రమే చేశాం. ‘నా దాసితో కలువు’ హీబ్రూ సభ్యోక్తిని ఆధునిక తెలుగులో స్పష్టంగా, అయినా మితంగా వ్యక్తపరుస్తుంది. చివరి క్రియను ‘శారయి చెప్పినట్లు చేశాడు’గా మార్చడం ద్వారా వచనంలోని వినడం ద్వారా అంగీకరించి అనుసరించిన భావం సహజంగా ప్రతిఫలిస్తుంది. అִבָּנֶה యొక్క ఉద్దేశపూర్వక రూపక-భావసందిగ్ధతను పాదసూచిక నిలుపుతుంది.
