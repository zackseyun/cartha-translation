id: GEN.16.12
reference: Genesis 16:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/ה֤וּא יִהְיֶה֙ פֶּ֣רֶא אָדָ֔ם יָד֣/וֹ בַ/כֹּ֔ל וְ/יַ֥ד כֹּ֖ל בּ֑/וֹ וְ/עַל פְּנֵ֥י כָל אֶחָ֖י/ו יִשְׁכֹּֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/012.yaml
  text: And he will be a wild donkey of a man[a]; his hand will be against everyone, and everyone's hand against him[c][b], and he will dwell opposite all his brothers.
translation:
  language: te
  text: అతడు అడవి గాడిదలాంటి మనిషిగా ఉంటాడు[a]. అతని చెయ్యి అందరికీ విరోధంగా ఉంటుంది; అందరి చెయ్యి అతనికి విరోధంగా ఉంటుంది. అతడు తన సహోదరులందరికీ ఎదురుగా నివసిస్తాడు[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూల హీబ్రూలో అతణ్ణి నేరుగా అడవి గాడిదతో పోల్చారు. ఇది అతడు కేవలం ‘అడవి స్వభావం గలవాడు’ అని చెప్పడం కంటే, మచ్చిక కాని స్వేచ్ఛను చిత్రించే ఉపమానం.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘ఎదుట,’ ‘సమక్షంలో.’ హీబ్రూ పదబంధం తన సహోదరులకు ఎదురుగా, వారి ఎదుట, లేదా వారితో ప్రతిఘటనతో నివసించడాన్ని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: ‘సహోదరులు’ అనే మాట సొంత అన్నదమ్ములతో పాటు దగ్గరి బంధువులను లేదా సంబంధిత ప్రజలను కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּרֶא אָדָם
  choice: అడవి గాడిదలాంటి మనిషి
  rationale: פֶּרֶא అనేది కేవలం ‘అడవి స్వభావం’ అని కాక, అడవి గాడిదను సూచిస్తుంది. తెలుగు సహజత్వాన్ని కాపాడుతూ మూలంలోని స్పష్టమైన జంతు ఉపమానాన్ని నిలిపేందుకు ‘అడవి గాడిదలాంటి మనిషి’ అని అనువదించాం.
- source_word: אָדָם
  choice: మనిషి
  rationale: ఇక్కడ ఈ పదం సాధారణ మానవజాతిని కాక, నిర్దిష్టంగా ఇష్మాయేలును సూచిస్తుంది.
- source_word: יָדוֹ בַכֹּל
  choice: అతని చెయ్యి అందరికీ విరోధంగా ఉంటుంది
  rationale: ‘చెయ్యి’ అనే మూల భాషా రూపకాన్ని నిలిపి, సందర్భం సూచించే ప్రతికూలతను ‘విరోధంగా’ అని స్పష్టం చేశాం.
- source_word: וְיַד כֹּל בּוֹ
  choice: అందరి చెయ్యి అతనికి విరోధంగా ఉంటుంది
  rationale: ముందరి వాక్యభాగంతో ఉన్న సమాంతర నిర్మాణాన్ని, పరస్పర విరోధ భావాన్ని కాపాడాం.
- source_word: וְעַל־פְּנֵי
  choice: ఎదురుగా
  rationale: ఈ పదబంధం ‘ఎదుట,’ ‘సమక్షంలో,’ ‘ఎదురుగా’ అనే స్థలసంబంధ లేదా సంబంధాత్మక భావాలను ఇవ్వగలదు. ‘ఎదురుగా’ అనేది అస్పష్టతను కొంతవరకు నిలుపుతూ సహజమైన తెలుగు ప్రయోగం.
- source_word: כָּל־אֶחָיו
  choice: తన సహోదరులందరికీ
  rationale: אָח యొక్క ప్రాథమిక అర్థమైన ‘సహోదరుడు’ను ప్రధాన పాఠ్యంలో ఉంచాం; అది విస్తృత బంధువర్గాన్ని కూడా సూచించగలదని పాదసూచికలో తెలిపాం.
- source_word: יִשְׁכֹּן
  choice: నివసిస్తాడు
  rationale: שׁכן లోని నివసించడం లేదా స్థిరపడడం అనే భావానికి ‘నివసిస్తాడు’ గౌరవప్రదమైన, సహజమైన ఆధునిక తెలుగు రూపం.
theological_decisions:
- issue: פֶּרֶא אָדָם అనే రూపకం ద్వారా ఇష్మాయేలు స్వభావ చిత్రణ
  choice: ‘అడవి గాడిదలాంటి మనిషి’ అని జంతు ఉపమానాన్ని స్పష్టంగా నిలిపాం
  alternative: ‘అడవి మనిషి’ లేదా ‘క్రూరుడు’
  rationale: మూలపాఠం అడవి గాడిద రూపకాన్ని ఉపయోగిస్తుంది. దాన్ని సాధారణ ‘అడవి మనిషి’గా చదును చేయడం గానీ, ‘క్రూరుడు’ అని అదనపు నైతిక తీర్పును చేర్చడం గానీ చేయకుండా, అదుపులేని స్వేచ్ఛ మరియు ఘర్షణతో కూడిన మూల చిత్రాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని వాడాం. ‘చెయ్యి’ రూపకాన్ని, పరస్పర విరోధ సమాంతరతను, చివరి పదబంధంలోని స్థలసంబంధ/ప్రతిఘటనాత్మక అస్పష్టతను సాధ్యమైనంతవరకు నిలిపాం.
