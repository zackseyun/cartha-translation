  to: అబ్రాము కనాను దేశంలో నివసించి పది సంవత్సరాలు గడిచిన తరువాత, అబ్రాము భార్య శారయి తన బానిస అయిన ఐగుప్తీయురాలు హాగరును తీసుకొని, తన భర్త అబ్రాముకు భార్యగా ఇచ్చింది.[a]
