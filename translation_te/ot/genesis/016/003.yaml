id: GEN.16.3
reference: Genesis 16:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/תִּקַּ֞ח שָׂרַ֣י אֵֽשֶׁת אַבְרָ֗ם אֶת הָגָ֤ר הַ/מִּצְרִית֙ שִׁפְחָתָ֔/הּ מִ/קֵּץ֙ עֶ֣שֶׂר שָׁנִ֔ים לְ/שֶׁ֥בֶת אַבְרָ֖ם בְּ/אֶ֣רֶץ כְּנָ֑עַן וַ/תִּתֵּ֥ן אֹתָ֛/הּ לְ/אַבְרָ֥ם אִישָׁ֖/הּ ל֥/וֹ לְ/אִשָּֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/003.yaml
  text: So Sarai[a], Abram’s wife, took Hagar the Egyptian, her female servant, after Abram had lived ten years in the land of Canaan[b], and gave her to Abram her husband as a wife.
translation:
  language: te
  text: అబ్రాము కనాను దేశంలో నివసించి పది సంవత్సరాలు గడిచిన తరువాత, అబ్రాము భార్య శారయి తన బానిస అయిన ఐగుప్తీయురాలు హాగరును తీసుకొని, తన భర్త అబ్రాముకు భార్యగా ఇచ్చింది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూల హీబ్రూలో, ‘అతనికి భార్యగా’; ఇదే వాక్యం హాగరును శారయి బానిసగా కూడా గుర్తిస్తుంది.
    reason: హాగరును అబ్రాముకు భార్యగా ఇచ్చినట్లు చెప్పడంతోపాటు, ఆమె శారయి బానిస అనే మూలపాఠంలోని సామాజిక స్థితిని కూడా స్పష్టం చేస్తుంది.
lexical_decisions:
- source_word: וַתִּקַּח
  choice: తీసుకొని
  rationale: לקח అనే క్రియకు కథన సందర్భంలో సహజమైన అర్థం ‘తీసుకోవడం’; తరువాతి ‘ఇచ్చింది’ అనే క్రియతో అనుసంధానించేందుకు తెలుగులో ‘తీసుకొని’ సహజంగా ఉంటుంది.
- source_word: שָׂרַי אֵשֶׁת אַבְרָם
  choice: అబ్రాము భార్య శారయి
  rationale: శారయిని అబ్రాము భార్యగా గుర్తించే సమానాధికార నిర్మాణాన్ని సహజమైన తెలుగు పదక్రమంలో తెలిపింది.
- source_word: הָגָר הַמִּצְרִית
  choice: ఐగుప్తీయురాలైన ... హాగరు
  rationale: జాతి లేదా దేశ మూలాన్ని సూచించే హీబ్రూ విశేషణాన్ని తెలుగులో స్త్రీలింగ రూపంతో స్పష్టంగా తెలిపింది.
- source_word: שִׁפְחָתָהּ
  choice: తన బానిస
  rationale: שִׁפְחָה హాగరు స్వేచ్ఛగల పనిమనిషి కాదని, బానిస స్థితిలో ఉన్న స్త్రీ అని సూచిస్తుంది. ‘బానిస’ ఆ సామాజిక వాస్తవాన్ని మృదుపరచకుండా తెలియజేస్తుంది; హాగరు స్త్రీ అని సందర్భం స్పష్టం చేస్తుంది.
- source_word: מִקֵּץ עֶשֶׂר שָׁנִים
  choice: పది సంవత్సరాలు పూర్తయిన తరువాత
  rationale: పది సంవత్సరాల కాలం ముగిసిన తరువాత జరిగిన చర్యను సూచించే హీబ్రూ కాలప్రయోగాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: לְשֶׁבֶת אַבְרָם בְּאֶרֶץ כְּנָעַן
  choice: అబ్రాము కనాను దేశంలో నివసించి
  rationale: అబ్రాము కనానులో నివసించిన కాలానికే పది సంవత్సరాల లెక్క అనుసంధానమై ఉందని స్పష్టంగా ఉంచుతుంది.
- source_word: וַתִּתֵּן אֹתָהּ
  choice: ఇచ్చింది
  rationale: కథనంలోని కర్త శారయియే కొనసాగుతున్నందున సర్వనామాన్ని మళ్లీ చేర్చకుండా సహజంగా అనువదించింది.
- source_word: לְאַבְרָם אִישָׁהּ
  choice: తన భర్త అబ్రాముకు
  rationale: אִישָׁהּ ఇక్కడ ‘ఆమె భర్త’ అని అర్థం; తెలుగు విభక్తులతో సంబంధాన్ని స్పష్టంగా తెలిపింది.
- source_word: לוֹ לְאִשָּׁה
  choice: భార్యగా
  rationale: మూలంలో ప్రత్యేకంగా ‘ఉపపత్ని’ అనే పదం కాక אִשָּׁה (‘స్త్రీ/భార్య’) ఉంది. సందర్భంలో అబ్రాముకు భార్య స్థితిలో ఇవ్వబడిందనే భావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
theological_decisions:
- issue: అబ్రాముతో హాగరుకు ఏర్పడిన సంబంధ స్థితి
  choice: ‘భార్యగా’ అని అనువదిస్తూ, హాగరు శారయి ‘బానిస’ అనే గుర్తింపును కూడా ప్రధాన వాక్యంలో ఉంచడం.
  alternative: ‘ఉపపత్నిగా’ లేదా ‘అతని భార్య కావడానికి’
  rationale: హీబ్రూ పాఠం לְאִשָּׁה అని స్పష్టంగా చెబుతుంది; ‘ఉపపత్ని’కి ప్రత్యేకమైన పదాన్ని వాడదు. అదే సమయంలో ఆమెను שִׁפְחָה, అంటే బానిసగా గుర్తిస్తుంది. ఈ రెండు సామాజిక స్థితుల మధ్య ఉన్న ఉద్రిక్తతను పరిష్కరించకుండా యథాతథంగా నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన కథన శైలిని వాడింది. ‘బానిస’ అనే పదం మూలంలోని సామాజిక స్థితిని మృదుపరచదు; ‘భార్యగా’ అనే పదం మూలంలో లేని ‘ఉపపత్ని’ భావాన్ని దిగుమతి చేయదు.
