id: GEN.16.6
reference: Genesis 16:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אַבְרָ֜ם אֶל שָׂרַ֗י הִנֵּ֤ה שִׁפְחָתֵ/ךְ֙ בְּ/יָדֵ֔/ךְ עֲשִׂי לָ֖/הּ הַ/טּ֣וֹב בְּ/עֵינָ֑יִ/ךְ וַ/תְּעַנֶּ֣/הָ שָׂרַ֔י וַ/תִּבְרַ֖ח מִ/פָּנֶֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/006.yaml
  text: Then Abram said to Sarai[a], “Look, your female servant is in your hand; do to her what is good in your eyes.” Then Sarai afflicted her, and she fled from her presence.
translation:
  language: te
  text: అప్పుడు అబ్రాము శారయితో, “ఇదిగో, నీ బానిస స్త్రీ నీ చేతిలో ఉంది; నీ దృష్టికి ఏది మంచిదో ఆమెకు అది చేయి” అన్నాడు. అప్పుడు శారయి ఆమెను బాధపెట్టింది[a]; హాగరు శారయి దగ్గరనుంచి పారిపోయింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఆమెతో కఠినంగా ప్రవర్తించింది” లేదా “ఆమెను అణచివేసింది.” హీబ్రూ క్రియ బాధించడం, అవమానించడం లేదా కఠినంగా ప్రవర్తించడం అనే అర్థాలను సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: ఇదిగో
  rationale: హీబ్రూ పదంలోని సూచనాత్మక బలాన్ని సహజమైన ఆధునిక తెలుగు సంభాషణా సూచికతో నిలుపుతుంది.
- source_word: שִׁפְחָתֵךְ
  choice: నీ బానిస స్త్రీ
  rationale: సాధారణ సేవకత్వంగా మృదువుచేయకుండా, హాగరు బంధిత సామాజిక స్థితిని స్పష్టంగా తెలియజేస్తుంది.
- source_word: בְּיָדֵךְ
  choice: నీ చేతిలో ఉంది
  rationale: అధికారం, నియంత్రణ అనే భావాన్ని కలిగిన హీబ్రూ నుడికారాన్ని తెలుగులో అర్థమయ్యే విధంగా నిలుపుతుంది.
- source_word: עֲשִׂי לָהּ הַטּוֹב בְּעֵינָיִךְ
  choice: నీ దృష్టికి ఏది మంచిదో ఆమెకు అది చేయి
  rationale: ‘నీ కళ్లలో మంచిది’ అనే మూల నుడికార భావాన్ని సహజమైన తెలుగులో, చర్య హాగరు పట్ల మళ్లించబడిందని స్పష్టంగా అనువదిస్తుంది.
- source_word: וַתְּעַנֶּהָ
  choice: ఆమెను బాధించింది
  rationale: ఈ పీయేల్ క్రియ సూచించే బాధపెట్టడం లేదా కఠినంగా అణచడం అనే తీవ్రతను నిలుపుతూ, దాని నిర్దిష్ట రూపాన్ని అనవసరంగా నిర్ణయించదు.
- source_word: וַתִּבְרַח מִפָּנֶיהָ
  choice: ఆమె శారయి దగ్గరనుంచి పారిపోయింది
  rationale: హాగరు పారిపోవడాన్ని సహజమైన కథన తెలుగులో తెలియజేస్తుంది; అస్పష్ట స్త్రీ సర్వనామాల వల్ల కలిగే గందరగోళాన్ని నివారించడానికి శారయి పేరును పునరుక్తి చేస్తుంది.
theological_decisions:
- issue: హాగరు సామాజిక స్థితి
  choice: బానిస స్త్రీ
  alternative: దాసి / సేవకురాలు
  rationale: ఇంటి అధికార సంబంధంలో హాగరు బంధిత స్థితి సందర్భానికి ముఖ్యమైనది; ‘సేవకురాలు’ ఆ స్థితిని మృదువుచేయవచ్చు.
- issue: శారయి ప్రవర్తన తీవ్రత
  choice: బాధించింది
  alternative: కఠినంగా ప్రవర్తించింది / అణచివేసింది
  rationale: హీబ్రూ పదం నిజమైన బాధను లేదా అణచివేతను సూచిస్తుంది, కానీ ఈ వచనం దాని నిర్దిష్ట రూపాన్ని చెప్పదు. ప్రధాన పాఠం ఆ అనిశ్చితిని నిలుపుతుంది; ప్రత్యామ్నాయాలను పాదసూచికలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కథన శైలి వాడబడింది. బానిసత్వ భాషను మృదువుచేయలేదు; మూలంలోని అధికార సంబంధం మరియు క్రియలోని అర్థవిస్తృతి నిలుపబడ్డాయి.
