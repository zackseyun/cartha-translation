review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents Abram's statement, Hagar's enslaved status, the authority idiom 'in your hand,' and Sarai's harsh treatment. However, 'దాంతో' explicitly frames Hagar's flight as a result, whereas the Hebrew uses simple narrative succession ('and/then'); the causal connection is contextually plausible but should not be added by the translation.
  naturalness: The Telugu is clear and appropriately formal. 'ఆమెను బాధపెట్టింది' is slightly more idiomatic and explicit than 'ఆమెను బాధించింది' for inflicted suffering, while still not specifying the form of mistreatment.
  terminology: '''బానిస స్త్రీ'' properly retains the salient bonded status of שִׁפְחָה. The revised rendering of וַתְּעַנֶּהָ retains its broad sense of affliction/harsh treatment, with alternatives supplied in the footnote.'
  issues:
  - severity: low
    issue: Added causal connective 'దాంతో'
    rationale: The Hebrew waw links the clauses sequentially and does not itself state a consequence. Remove the explicit causal connective to preserve the source's formulation.
  - severity: low
    issue: Main verb 'బాధించింది' is less idiomatic in this transitive context
    rationale: '''బాధపెట్టింది'' naturally conveys that Sarai caused Hagar suffering and remains appropriately nonspecific about the nature of the harsh treatment.'
  revised_text: అప్పుడు అబ్రాము శారయితో, “ఇదిగో, నీ బానిస స్త్రీ నీ చేతిలో ఉంది; నీ దృష్టికి ఏది మంచిదో ఆమెకు అది చేయి” అన్నాడు. అప్పుడు శారయి ఆమెను బాధపెట్టింది[a]; హాగరు శారయి దగ్గరనుంచి పారిపోయింది.
