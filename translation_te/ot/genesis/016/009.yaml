source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר לָ/הּ֙ מַלְאַ֣ךְ יְהוָ֔ה שׁ֖וּבִי אֶל גְּבִרְתֵּ֑/ךְ וְ/הִתְעַנִּ֖י תַּ֥חַת יָדֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/009.yaml
  text: Then the angel of Yahweh said to her[c][b][a], “Return to your mistress and humble yourself under her hand.”
translation:
  language: te
  text: 'అప్పుడు యాహ్వే దూత[a] ఆమెతో ఇలా అన్నాడు: “నీ యజమానురాలి దగ్గరికి తిరిగి వెళ్లి, ఆమె అధికారానికి లోబడి ఉండు[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలోని מַלְאָךְ పదాన్ని ‘సందేశవాహకుడు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: 'అక్షరార్థంగా, “ఆమె చేతి కింద నిన్ను నీవు అణచుకో.” భావం: ఆమె అధికారానికి లోబడు; ఈ క్రియకు అణచివేతను లేదా బాధను అనుభవించడం అనే ఛాయ కూడా ఉండవచ్చు.'
    reason: lexical_and_cultural_note
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: యాహ్వే దూత
  rationale: מַלְאַךְ అనే పదానికి ‘దూత’ లేదా ‘సందేశవాహకుడు’ అనే అర్థాలు ఉండవచ్చు. ఈ దైవిక ప్రత్యక్షత సందర్భంలో ‘యాహ్వే దూత’ సహజమైన తెలుగు ప్రయోగం; దూత స్వరూపం గురించి అదనపు సిద్ధాంతాన్ని చేర్చదు.
- source_word: שׁוּבִי אֶל גְּבִרְתֵּךְ
  choice: నీ యజమానురాలి దగ్గరికి తిరిగి వెళ్లు
  rationale: స్త్రీలింగ ఏకవచన ఆజ్ఞారూపపు బలాన్ని నిలుపుతూ, గְּבִרְתֵּךְ సూచించే స్త్రీ అధికారి లేదా యజమానురాలి సామాజిక స్థానాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: וְהִתְעַנִּי
  choice: లోబడి ఉండు
  rationale: ענה ధాతువు హిత్పయేల్ ఆజ్ఞారూపం ఇక్కడ తనను తాను అణచుకొని అధీనస్థితిని అంగీకరించడాన్ని సూచిస్తుంది. ‘లోబడి ఉండు’ సందర్భంలోని సంబంధపరమైన అధీనతను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; బాధను కోరుకోవాలనే భావాన్ని అనవసరంగా చేర్చదు.
- source_word: תַּחַת יָדֶיהָ
  choice: ఆమె అధికారానికి
  rationale: అక్షరార్థంగా ‘ఆమె చేతి కింద’ అనే హీబ్రూ నుడికారం ఇక్కడ ఆమె అధికారం లేదా ఆధీనాన్ని సూచిస్తుంది. ప్రధాన పాఠ్యంలో ఉద్దేశించిన అర్థాన్ని సహజంగా ఇచ్చి, అక్షర రూపాన్ని పాదటిప్పణిలో నిలిపాం.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హీబ్రూ చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా వ్యక్తిగత నామంగా లిప్యంతరీకరించాం.
theological_decisions:
- issue: יְהוָה దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠ్యంలో ఉన్న వ్యక్తిగత దైవనామాన్ని బిరుదుగా మార్చకుండా, సాధారణంగా అంగీకరించబడిన ఉచ్చారణకు దగ్గరగా తెలుగులో లిప్యంతరీకరించడం మూలరూపాన్ని కాపాడుతుంది.
- issue: מַלְאַךְ ను దేవదూతగా లేదా సందేశవాహకుడిగా అర్థం చేసుకోవడం
  choice: దూత
  alternative: సందేశవాహకుడు
  rationale: ‘దూత’ అనే తెలుగు పదం సందర్భానికి సహజంగా సరిపోతూ, మూలపదంలోని అర్థ విస్తృతిని కొంతవరకు నిలుపుతుంది. ఈ వ్యక్తి యొక్క ఖచ్చితమైన దైవశాస్త్రీయ గుర్తింపును వచనం చెప్పేదానికంటే ఎక్కువగా నిర్ణయించదు.
- issue: וְהִתְעַנִּי లోని అణచుకోవడం లేదా బాధ అనుభవించడం అనే ఉద్రిక్తత
  choice: ఆమె అధికారానికి లోబడి ఉండు
  alternative: ఆమె చేతి కింద నిన్ను నీవు అణచుకో; ఆమె అధికారంలో బాధను భరించు
  rationale: వ్యాకరణంలోని స్వీయ-అధీనత భావాన్ని, సామాజిక సందర్భాన్ని ప్రధాన పాఠ్యంలో సహజంగా తెలిపాం. అయితే ధాతువులో బాధింపబడటం లేదా అణచబడటం అనే గాఢ ఛాయ కూడా ఉండగలదని పాదటిప్పణిలో వెల్లడించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథనశైలిని వాడాం. ‘ఆమె చేతి కింద’ అనే హీబ్రూ నుడికారాన్ని ప్రధాన పాఠ్యంలో యాంత్రికంగా ఉంచకుండా దాని సందర్భార్థమైన ‘ఆమె అధికారానికి’ అని ఇచ్చి, మూలచిత్రాన్ని పాదటిప్పణిలో భద్రపరిచాం.
