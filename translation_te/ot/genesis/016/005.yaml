  rationale: The revision resolves the grammatical error in the conception clause, uses a more natural Telugu rendering of the Hebrew “bosom” idiom, and improves the final reciprocal phrase. It preserves the source’s accusation, social-status language, jussive appeal, divine name, and the acknowledged ambiguity of “my wrong/injustice” in footnote a.
