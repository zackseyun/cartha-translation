source:
  edition: WLC
  text: וַ/תֹּ֨אמֶר שָׂרַ֣י אֶל אַבְרָם֮ חֲמָסִ֣/י עָלֶי/ךָ֒ אָנֹכִ֗י נָתַ֤תִּי שִׁפְחָתִ/י֙ בְּ/חֵיקֶ֔/ךָ וַ/תֵּ֨רֶא֙ כִּ֣י הָרָ֔תָה וָ/אֵקַ֖ל בְּ/עֵינֶ֑י/הָ יִשְׁפֹּ֥ט יְהוָ֖ה בֵּינִ֥/י וּ/בֵינֶֽיׄ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/005.yaml
  text: Then Sarai said to Abram[a], “The wrong done to me is on you. I gave my female servant into your embrace, and when she saw that she had conceived, I became contemptible in her eyes[b]. May Yahweh judge between me and you.”
translation:
  language: te
  text: అప్పుడు శారయి అబ్రాముతో, “నాకు జరిగిన అన్యాయానికి నువ్వే బాధ్యుడివి.[a] నా దాసిని నీ ఒడిలో ఉంచాను.[b] తాను గర్భం ధరించిందని ఆమె చూసినప్పుడు, ఆమె దృష్టిలో నేను తృణీకారానికి గురయ్యాను. నాకూ నీకూ మధ్య యహ్వే తీర్పు తీర్చుగాక” అంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'అక్షరార్థానికి దగ్గరగా, “నా అన్యాయం నీ మీద ఉండుగాక.” ఇక్కడ భావం: శారయి అనుభవించిన అన్యాయానికి అబ్రాము బాధ్యత వహించాలని ఆమె ఆరోపిస్తోంది.'
    reason: lexical_alternative
  - marker: b
    text: హెబ్రీలో “నీ ఒడిలోకి.” ఇక్కడ అది సన్నిహిత దాంపత్య స్వీకరణను సూచించే మర్యాదపూర్వక భావప్రయోగం.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲמָסִי עָלֶיךָ
  choice: నాకు జరిగిన అన్యాయానికి నువ్వే బాధ్యుడివి
  rationale: חָמָסִי ఇక్కడ శారయి చేసిన తప్పును కాక, తాను అనుభవించిన అన్యాయం లేదా హానిని సూచిస్తుంది; עָלֶיךָ ఆ బాధ్యతను అబ్రాముపై మోపుతుంది. సహజమైన ఆధునిక తెలుగులో ఆరోపణ బలాన్ని నిలుపుతుంది.
- source_word: שִׁפְחָתִי
  choice: నా దాసిని
  rationale: שִׁפְחָה ఆధీన సామాజిక స్థితిలో ఉన్న స్త్రీ దాసిని సూచిస్తుంది. ‘దాసి’ తెలుగు బైబిలు సందర్భంలో సహజంగా, సంక్షిప్తంగా ఆ స్థితిని తెలియజేస్తుంది.
- source_word: בְּחֵיקֶךָ
  choice: నీ కౌగిటికి
  rationale: חֵיק అక్షరార్థంగా ఒడి లేదా రొమ్ము ప్రాంతాన్ని సూచించినా, ఇక్కడ సన్నిహిత దాంపత్య స్వీకరణకు మర్యాదపూర్వక రూపకం. ‘కౌగిటికి’ ఆ రూపకాన్ని కాపాడుతుంది.
- source_word: הָרָתָה
  choice: తాను గర్భం ధరించానని
  rationale: పూర్తయిన గర్భధారణను సూచించే క్రియను సహజమైన తెలుగు పరోక్ష వాక్యరూపంలో వ్యక్తం చేస్తుంది.
- source_word: וָאֵקַל בְּעֵינֶיהָ
  choice: ఆమె దృష్టిలో నేను తృణీకారానికి గురయ్యాను
  rationale: קלל రూపం శారయి విలువ హాగరు అంచనాలో తగ్గిపోయి, ఆమె తృణీకారానికి గురైందనే ఫలితార్థాన్ని ఇస్తుంది. ‘ఆమె దృష్టిలో’ హెబ్రీయ భావప్రయోగాన్ని నిలుపుతుంది.
- source_word: יִשְׁפֹּט יְהוָה
  choice: యహ్వే తీర్పు తీర్చుగాక
  rationale: יִשְׁפֹּט ఇక్కడ దైవ న్యాయనిర్ణయాన్ని కోరే జస్సివ్ భావం కలిగి ఉంది; ‘తీర్పు తీర్చుగాక’ ఆ విజ్ఞాపనను తెలియజేస్తుంది. יְהוָהను వ్యక్తిగత దైవనామంగా ‘యహ్వే’ అని లిప్యంతరీకరించాం.
- source_word: בֵּינִי וּבֵינֶיךָ
  choice: నాకు నీకు మధ్య
  rationale: రెండు పక్షాల మధ్య యహ్వే న్యాయనిర్ణేతగా ఉండాలని చేసే ప్రత్యక్ష విజ్ఞాపనను కాపాడుతుంది.
theological_decisions:
- issue: חֲמָסִי అనే పదబంధంలో తప్పు ఎవరిది అనే సందిగ్ధత
  choice: శారయికి జరిగిన అన్యాయానికి అబ్రాము బాధ్యుడని ఆరోపణగా ప్రధాన పాఠంలో అనువదించడం
  alternative: ‘నా అన్యాయం నీ మీద ఉండుగాక’ అనే మరింత అక్షరార్థ రూపం
  rationale: సందర్భంలో శారయి తన తప్పును ఒప్పుకోవడం కంటే తాను అనుభవించిన అవమానానికి అబ్రామును బాధ్యునిగా నిలబెడుతోంది. అయినా హెబ్రీయ స్వామ్యప్రత్యయపు సంక్షిప్తతలోని ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- issue: దైవనామం יְהוָה అనువాదం
  choice: యహ్వే
  alternative: ప్రభువు
  rationale: మూలపాఠంలో ఉన్న వ్యక్తిగత దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా లిప్యంతరీకరించడం ద్వారా దాని ప్రత్యేకతను నిలుపుతున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథనశైలి వాడబడింది. సంభాషణలోని ఆరోపణ తీవ్రతను సహజంగా ఉంచుతూ, ‘కౌగిటికి’ మరియు ‘ఆమె దృష్టిలో’ వంటి మూలరూపకాలను సాధ్యమైనంతవరకు నిలిపాం. ప్రతి పాదసూచిక గుర్తు ప్రధాన పాఠంలో చేర్చబడింది.
