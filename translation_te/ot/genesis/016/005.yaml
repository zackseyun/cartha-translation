review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately conveys Sarai’s accusation, the giving of her female slave to Abram, Hagar’s conception, Sarai’s diminished standing in Hagar’s estimation, and Sarai’s jussive appeal to Yahweh as judge. A small wording correction is needed: “తాను గర్భం ధరించానని” is grammatically mismatched, as it reads as though Hagar says that she herself has conceived. The Hebrew states that she saw/perceived that she had conceived.'
  naturalness: Modern standard Telugu is generally clear and suitably restrained. “నీ ఒడిలో ఉంచాను” is more idiomatic and closer to the Hebrew idiom than “నీ కౌగిటికి అప్పగించాను.” “నాకూ నీకూ మధ్య” is the natural Telugu form.
  terminology: “దాసి” appropriately represents שפחה in this context, and “యహ్వే” correctly preserves the divine name. “తృణీకారానికి గురయ్యాను” adequately conveys Sarai’s loss of standing in Hagar’s eyes, though it is slightly more passive than the Hebrew.
  issues:
  - severity: medium
    issue: The clause “తాను గర్భం ధరించానని ఆమె గ్రహించినప్పుడు” has a reflexive/person mismatch.
    rationale: The source has “when she saw that she had conceived.” In Telugu, “తాను ... ధరించానని” is first-person quoted-style wording and is not grammatically appropriate here. “తాను గర్భం ధరించిందని ఆమె చూసినప్పుడు” correctly expresses the third-person completed action.
  - severity: low
    issue: “నీ కౌగిటికి అప్పగించాను” is less natural and somewhat shifts the idiom.
    rationale: The Hebrew literally says “into your bosom.” In this context, “నా దాసిని నీ ఒడిలో ఉంచాను” is idiomatic Telugu, retains the modest source metaphor, and does not introduce the more active nuance of “entrusted.”
  - severity: low
    issue: “నాకు నీకు మధ్య” needs natural conjunctive forms.
    rationale: “నాకూ నీకూ మధ్య” is the standard, fluent Telugu expression for “between me and you.”
  revised_text: అప్పుడు శారయి అబ్రాముతో, “నాకు జరిగిన అన్యాయానికి నువ్వే బాధ్యుడివి.[a] నా దాసిని నీ ఒడిలో ఉంచాను.[b] తాను గర్భం ధరించిందని ఆమె చూసినప్పుడు, ఆమె దృష్టిలో నేను తృణీకారానికి గురయ్యాను. నాకూ నీకూ మధ్య యహ్వే తీర్పు తీర్చుగాక” అంది.
