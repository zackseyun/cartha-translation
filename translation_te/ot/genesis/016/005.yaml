- from: అప్పుడు శారయి అబ్రాముతో, “నాకు జరిగిన అన్యాయానికి నువ్వే బాధ్యుడివి.[a] నా దాసిని నీ కౌగిటికి అప్పగించాను.[b] తాను గర్భం ధరించానని ఆమె గ్రహించినప్పుడు, ఆమె దృష్టిలో నేను తృణీకారానికి గురయ్యాను. నాకు నీకు మధ్య యహ్వే తీర్పు తీర్చుగాక” అంది.
