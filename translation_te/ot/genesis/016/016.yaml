translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడాం. మూలంలోని కాలసంబంధ నిర్మాణాన్ని సహజ తెలుగు పదక్రమంలో అందించాం; לְ ఉపసర్గలోని నిజమైన భావసాధ్యతను పాదటిప్పణిలో నిలిపాం.
