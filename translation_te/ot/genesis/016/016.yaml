  yaml_path: translation/ot/genesis/016/016.yaml
  text: Abram was eighty-six years old when Hagar bore Ishmael to Abram[a].
translation:
  language: te
  text: హాగరు అబ్రాముకు[a] ఇష్మాయేలును కన్నప్పుడు అబ్రాము వయసు ఎనభై ఆరు సంవత్సరాలు ఉంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అబ్రాము కోసం.’ ఈ సందర్భంలో హీబ్రూ ఉపసర్గను రెండు విధాలుగా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַבְרָם
  choice: అబ్రాము
  rationale: వ్యక్తి పేరును ఆధునిక ప్రామాణిక తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: בֶּן
  choice: వయసు ... సంవత్సరాలు
  rationale: హీబ్రూ వయస్సు సూచించే నుడికారాన్ని తెలుగులో సహజమైన వయస్సు నిర్మాణంతో వ్యక్తం చేశాం.
- source_word: שְׁמֹנִים שָׁנָה וְשֵׁשׁ שָׁנִים
  choice: ఎనభై ఆరు సంవత్సరాలు
  rationale: హీబ్రూ సంఖ్యా పదబంధానికి స్పష్టమైన, సహజమైన ఆధునిక తెలుగు సమానార్థకం.
- source_word: בְּ/לֶדֶת
  choice: కన్నప్పుడు
  rationale: בְּ తో కూడిన ילד క్రియానామ రూపం కాలసంబంధ ఉపవాక్యాన్ని ప్రవేశపెడుతుంది; తెలుగులో ‘కన్నప్పుడు’ సహజంగా ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: הָגָר
  choice: హాగరు
  rationale: వ్యక్తి పేరును తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: אֶת יִשְׁמָעֵאל
  choice: ఇష్మాయేలును
  rationale: אֶת కర్మ సూచకం విడిగా అనువదించబడదు; తెలుగు కర్మ విభక్తితో పేరును ఇచ్చాం.
- source_word: לְ/אַבְרָם
  choice: అబ్రాముకు
  rationale: לְ ఉపసర్గ సూచించే సంబంధాన్ని ‘అబ్రాముకు’గా ఉంచడం మూలానికి దగ్గరగా ఉండి తెలుగులో సహజంగా ఉంది; సందర్భానుసారం ‘అబ్రాము కోసం’ అనే భావమూ సాధ్యమే.
