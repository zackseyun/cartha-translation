  variant: modern standard Telugu
source:
  edition: WLC
  text: וַֽ/יִּמְצָאָ֞/הּ מַלְאַ֧ךְ יְהוָ֛ה עַל עֵ֥ין הַ/מַּ֖יִם בַּ/מִּדְבָּ֑ר עַל הָ/עַ֖יִן בְּ/דֶ֥רֶךְ שֽׁוּר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/007.yaml
  text: And the angel of Yahweh found her by a spring of water in the wilderness[b][a], by the spring on the way to Shur.
translation:
  language: te
  text: యాహ్వే దూత అరణ్యంలో, షూరుకు వెళ్లే మార్గంలోని ఒక నీటి ఊట దగ్గర ఆమెను కనుగొన్నాడు.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యాహ్వే సందేశకుడు.” హీబ్రూ పదానికి “దూత” లేదా “సందేశకుడు” అనే అర్థాలు రావచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “యాహ్వే” అనేది హీబ్రూ దైవనామం YHWHకు లిప్యంతరీకరణ; సంప్రదాయంగా దీనిని “ప్రభువు” అని అనువదిస్తారు.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּמְצָאָהּ
  choice: ఆమెను కనుగొన్నాడు
  rationale: מצא అనే క్రియకు ఇక్కడ సహజమైన అర్థం ‘కనుగొన్నాడు.’ స్త్రీలింగ ఏకవచన కర్మ ప్రత్యయం హాగరును సూచిస్తుంది.
- source_word: מַלְאַךְ יְהוָה
  choice: యాహ్వే దేవదూత
  rationale: מַלְאַךְ అనే పదానికి ‘దూత/సందేశకుడు’ అనే విస్తృత అర్థం ఉంది; దేవుని నుంచి వచ్చిన దూతను సూచించే ఈ సందర్భంలో ‘దేవదూత’ సహజంగా ఉంటుంది. పదంలోని అర్థసాధ్యతను పాదసూచికలో నిలుపుకున్నాం.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హీబ్రూ చతురక్షర దైవనామం YHWHను బిరుదుతో భర్తీ చేయకుండా వ్యక్తినామంగా లిప్యంతరీకరించాం.
- source_word: עַל עֵין הַמַּיִם
  choice: ఒక నీటి ఊట దగ్గర
  rationale: עַיִן ఇక్కడ నీటి ఉద్గమస్థానమైన ‘ఊట’ను సూచిస్తుంది; עַלను స్థలసంబంధంగా సహజమైన ‘దగ్గర’తో అనువదించాం.
- source_word: בַּמִּדְבָּר
  choice: అరణ్యంలో
  rationale: מִדְבָּר తప్పనిసరిగా ఇసుక ఎడారినే కాక జనావాసం లేని అరణ్యప్రాంతాన్ని కూడా సూచిస్తుంది; ‘అరణ్యం’ ఆ విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: עַל הָעַיִן
  choice: ఆ ఊట
  rationale: నిర్దిష్ట ఉపపదంతో తిరిగి వచ్చిన עַיִן ముందే చెప్పిన అదే ఊటను సూచిస్తుంది; తెలుగులో పునరుక్తి భారాన్ని తగ్గిస్తూ సూచనను స్పష్టంచేశాం.
- source_word: בְּדֶרֶךְ שׁוּר
  choice: షూరుకు వెళ్లే మార్గంలో
  rationale: דֶּרֶךְకు ‘మార్గం’ సహజమైన సమానార్థకం; షూరు స్థలనామంగా లిప్యంతరీకరించబడింది.
theological_decisions:
- issue: מַלְאַךְ అనే పదాన్ని దేవదూతగా లేదా సందేశకుడిగా అనువదించడం
  choice: యాహ్వే దేవదూత
  alternative: యాహ్వే సందేశకుడు
  rationale: ఈ దైవిక ప్రత్యక్షత సందర్భంలో ‘దేవదూత’ సాధారణ పాఠకునికి సహజమైనది; అయితే మూలపదంలోని ‘సందేశకుడు’ అనే అర్థాన్ని పాదసూచికలో ఇచ్చి అస్పష్టతను కాపాడాం.
- issue: יְהוָה దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు
  rationale: మూలంలో వ్యక్తమైన YHWH అనే దైవనామాన్ని వ్యక్తినామంగా నిలిపాం; సంప్రదాయ బిరుదు రూపాన్ని పాదసూచికలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథనశైలిని ఉపయోగించాం. హీబ్రూ వాక్యంలోని రెండవ స్థలవివరణను తెలుగులో సహజంగా ఉండేందుకు ప్రత్యేక వాక్యంగా ఇచ్చాం; రెండు సూచనలూ అదే ఊటను సూచిస్తున్నాయని స్పష్టంగా నిలిపాం.
