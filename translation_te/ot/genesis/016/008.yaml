id: GEN.16.8
reference: Genesis 16:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּאמַ֗ר הָגָ֞ר שִׁפְחַ֥ת שָׂרַ֛י אֵֽי מִ/זֶּ֥ה בָ֖את וְ/אָ֣נָה תֵלֵ֑כִי וַ/תֹּ֕אמֶר מִ/פְּנֵי֙ שָׂרַ֣י גְּבִרְתִּ֔/י אָנֹכִ֖י בֹּרַֽחַת־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/008.yaml
  text: And he said[a], “Hagar, Sarai’s servant woman, where have you come from, and where are you going?” And she said[b], “I am fleeing from the presence of Sarai my mistress.”
translation:
  language: te
  text: అతడు, “శారయికి బానిసైన హాగరూ,[a] నువ్వు ఎక్కడి నుంచి వచ్చావు? ఎక్కడికి వెళ్తున్నావు?” అన్నాడు. అందుకు ఆమె, “నా యజమానురాలు శారయి సమక్షం నుంచి[b] నేను పారిపోతున్నాను” అంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘బానిస’కు ‘దాసి’ లేదా ‘సేవకురాలు’ అని కూడా అనువదించవచ్చు; హీబ్రూ పదం శారయి ఆధీనంలో బానిస హోదాలో ఉన్న స్త్రీని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “నా యజమానురాలు శారయి ముఖం ఎదుటి నుంచి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁפְחַת
  choice: బానిసవైన
  rationale: ఈ హీబ్రూ పదం శారయి ఆధీనంలో బానిస హోదాలో ఉన్న స్త్రీని సూచిస్తుంది. ‘పనిమనిషి’ కంటే ‘బానిస’ ఆమె సామాజిక స్థితిని స్పష్టంగా తెలియజేస్తుంది.
- source_word: אֵי מִזֶּה
  choice: ఎక్కడి నుంచి వచ్చావు
  rationale: మూలస్థానాన్ని అడిగే హీబ్రూ నుడికారానికి ఇది సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: וְאָנָה תֵלֵכִי
  choice: ఎక్కడికి వెళ్తున్నావు
  rationale: గమ్యస్థానాన్ని అడిగే ప్రశ్నను, కొనసాగుతున్న ప్రయాణ భావంతో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: מִפְּנֵי
  choice: సన్నిధి నుంచి
  rationale: అక్షరార్థమైన ‘ముఖం/సన్నిధి నుంచి’ అనే భావాన్ని నిలుపుతూ, ఒక వ్యక్తి సమక్షం నుంచి దూరమవడాన్ని తెలుపుతుంది.
- source_word: גְּבִרְתִּי
  choice: నా యజమానురాలైన
  rationale: స్త్రీలింగ రూపం హాగరుపై అధికారం కలిగిన స్త్రీని సూచిస్తుంది; ‘యజమానురాలు’ ఆ సంబంధాన్ని స్పష్టంగా చూపుతుంది.
- source_word: בֹּרַחַת
  choice: నేను పారిపోతున్నాను
  rationale: హీబ్రూ కృదంతం కొనసాగుతున్న చర్యను సూచిస్తుంది; ఈ తెలుగు రూపం ఆ భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: וַיֹּאמַר
  choice: అతడు … అన్నాడు
  rationale: మునుపటి వచనంలోని కర్తను సర్వనామంతో కొనసాగిస్తూ, ఈ వచనంలో లేని పూర్తి బిరుదును చేర్చదు.
- source_word: שָׂרַי
  choice: శారయి
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగు లిప్యంతరీకరణ.
- source_word: הָגָר
  choice: హాగరు
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగు లిప్యంతరీకరణ; సంబోధనలో ‘హాగరూ’గా రూపాంతరం చెందుతుంది.
theological_decisions:
- issue: హాగరు సామాజిక హోదాను ఎలా అనువదించాలి
  choice: బానిస
  alternative: దాసి / పనిమనిషి
  rationale: మూలపదం ఆమె అధీన, బానిస హోదాను స్పష్టంగా సూచిస్తుంది. మృదువైన పదంతో ఆ సంబంధాన్ని మరుగుపరచకుండా ‘బానిస’ అని అనువదించబడింది.
- issue: మాట్లాడుతున్నవారిని ‘యెహోవా దూత’ అని ఈ వచనంలో మళ్లీ స్పష్టపరచాలా
  choice: అతడు
  alternative: యెహోవా దూత
  rationale: మునుపటి వచనం కర్తను స్పష్టం చేసినా, ఈ వచనంలోని హీబ్రూ పాఠం కేవలం ‘అతడు అన్నాడు’ అని కొనసాగుతుంది; అందువల్ల ఇక్కడ బిరుదు చేర్చబడలేదు.
translation_notes:
  register: సాధారణ పాఠకులకు అర్థమయ్యే ఆధునిక ప్రామాణిక తెలుగు వాడబడింది. సంభాషణ సహజంగా ఉండేలా ‘నువ్వు’ రూపం తీసుకోబడింది; అదే సమయంలో ‘సన్నిధి’, ‘యజమానురాలు’ వంటి పదాలతో గౌరవప్రదమైన గ్రంథశైలిని నిలుపుకుంది. ‘బానిస’ అనే పదం మూలంలోని సామాజిక అసమానతను మృదువుచేయకుండా తెలియజేస్తుంది.
