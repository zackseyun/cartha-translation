translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. మూలంలోని హాగరు ప్రస్తావన పునరుక్తిని ఉద్దేశపూర్వకంగా నిలిపి, హీబ్రూ నుడికారాన్ని ప్రధాన పాఠంలో సహజ తెలుగుగా ఇచ్చాం.
