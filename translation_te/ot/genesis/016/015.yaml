source:
  edition: WLC
  text: וַ/תֵּ֧לֶד הָגָ֛ר לְ/אַבְרָ֖ם בֵּ֑ן וַ/יִּקְרָ֨א אַבְרָ֧ם שֶׁם בְּנ֛/וֹ אֲשֶׁר יָלְדָ֥ה הָגָ֖ר יִשְׁמָעֵֽאל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/015.yaml
  text: Hagar bore a son to Abram[a], and Abram called the name of his son, whom Hagar bore, Ishmael.
translation:
  language: te
  text: 'హాగరు అబ్రాముకు ఒక కుమారుణ్ణి కన్నది. హాగరు కన్న తన కుమారునికి అబ్రాము ఇష్మాయేలు అని పేరు పెట్టాడు.[a]


    [a] మూలభాషలో అక్షరార్థంగా, “అబ్రాము హాగరు కన్న తన కుమారుని పేరు ఇష్మాయేలు అని పిలిచాడు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూలభాషలో అక్షరార్థంగా, “అబ్రాము హాగరు కన్న తన కుమారుని పేరు ఇష్మాయేలు అని పిలిచాడు.”
    reason: హీబ్రూ קרא שם నుడికారం యొక్క అక్షరార్థ నిర్మాణాన్ని, అలాగే హాగరును మళ్లీ పేర్కొనే సంబంధవాక్యాన్ని చూపిస్తూ, ప్రధాన పాఠంలో సహజమైన తెలుగు ‘పేరు పెట్టాడు’ను ఉపయోగించడానికి.
lexical_decisions:
- source_word: וַתֵּלֶד
  choice: కన్నది
  rationale: స్త్రీ కర్తగా ఉన్న ילד అనే క్రియకు ‘కను/ప్రసవించు’ అనే అర్థం వస్తుంది. కథన శైలిలో ‘కన్నది’ సహజంగా, సంక్షిప్తంగా ఉంటుంది.
- source_word: לְאַבְרָם
  choice: అబ్రాముకు
  rationale: לְ ఉపసర్గ ఇక్కడ సంబంధాన్ని—ఆ బిడ్డ అబ్రాము కుమారుడని—తెలియజేస్తుంది. ‘అబ్రాముకు’ అనేది తెలుగు వాక్యనిర్మాణంలో సహజంగా ఉండి మూలంలోని సంబంధాన్ని నిలుపుతుంది.
- source_word: בֵּן
  choice: ఒక కుమారుణ్ణి
  rationale: నిర్దిష్ట ఉపపదం లేని בֵּןను తెలుగు కథనంలో సహజమైన అనిర్దిష్ట రూపంగా ‘ఒక కుమారుణ్ణి’ అని అనువదించాం.
- source_word: וַיִּקְרָא ... שֵׁם
  choice: పేరు పెట్టాడు
  rationale: ‘పేరును పిలిచాడు’ అనే హీబ్రూ నుడికారానికి ఆధునిక తెలుగులో సహజమైన సమానార్థక ప్రయోగం ‘పేరు పెట్టాడు.’ అక్షరార్థ నిర్మాణాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: בְּנוֹ
  choice: కుమారునికి
  rationale: ప్రత్యయం ఆ కుమారుడు అబ్రాముకు చెందినవాడని సూచిస్తుంది. ముందున్న ‘తనకు’తో కలిపి ఈ స్వామ్య సంబంధం తెలుగులో స్పష్టమవుతుంది.
- source_word: אֲשֶׁר יָלְדָה הָגָר
  choice: హాగరు తనకు కన్న
  rationale: మూలంలోని సంబంధవాచక ఉపవాక్యం హాగరును మళ్లీ స్పష్టంగా పేర్కొంటుంది. తెలుగు సహజత్వంతో పాటు ఆ పునరుక్తిని కూడా నిలిపాం.
- source_word: יִשְׁמָעֵאל
  choice: ఇష్మాయేలు
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగులో స్థిరపడిన బైబిలు రూపానికి దగ్గరగా లిప్యంతరీకరించాం.
