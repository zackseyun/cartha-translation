  yaml_path: translation/ot/genesis/016/014.yaml
  text: Therefore the well was called Beer-lahai-roi. Look, it is between Kadesh and Bered.
translation:
  language: te
  text: అందువల్ల ఆ బావికి బేర్‌-లహయీ-రోయీ[a] అని పేరు పెట్టబడింది. ఇదిగో, అది కాదేషు, బెరెదు మధ్యలో ఉంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: బేర్‌-లహయీ-రోయీ అనే పేరుకు “నన్ను చూసే సజీవుని బావి” అనే అర్థం ఉండవచ్చు. హీబ్రూ పదబంధంలోని ఖచ్చితమైన వ్యాకరణ సంబంధం అనిశ్చితం.
    reason: స్థలనామాన్ని ప్రధాన పాఠంలో ధ్వన్యనుకరణగా నిలుపుతూ, సాధ్యమైన అర్థాన్ని సూచిస్తుంది; వివాదాస్పదమైన వ్యాకరణ సంబంధాన్ని ఒకే వివరణగా నిర్ణయించదు.
lexical_decisions:
- source_word: עַל כֵּן
  choice: అందుకే
  rationale: ముందటి సంఘటనకు ఈ పేరు పెట్టడాన్ని కారణఫల సంబంధంతో కలిపే సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: קָרָא
  choice: పేరు పెట్టారు
  rationale: హీబ్రూ క్రియ ఏకవచనంగా ఉండి కర్తను స్పష్టంగా పేర్కొనదు. తెలుగులో కర్తను ఊహించి నిర్ణయించకుండా అనిర్దిష్ట గౌరవ బహువచన రూపం వాడబడింది.
- source_word: בְּאֵר לַחַי רֹאִי
  choice: బేర్‌-లహయీ-రోయీ
  rationale: స్థల నామాన్ని అనువదించి ప్రధాన పాఠంలో అర్థాన్ని స్థిరపరచకుండా ధ్వన్యనుకరణ చేసి, దాని సాధ్యమైన అర్థాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: הִנֵּה
  choice: ఇదిగో
  rationale: స్థలాన్ని గమనింపజేసే హీబ్రూ సూచనార్థక పదబలాన్ని సహజంగా నిలుపుతుంది.
- source_word: בֵין קָדֵשׁ וּבֵין בָּרֶד
  choice: కాదేశుకు, బెరెదుకు మధ్య
  rationale: రెండు ప్రదేశాల మధ్యనున్న స్థానాన్ని సహజమైన తెలుగు వాక్య నిర్మాణంలో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: బేర్‌-లహయీ-రోయీ అనే పేరులోని భావం
  choice: ప్రధాన పాఠంలో పేరును ధ్వన్యనుకరణ చేసి, సాధ్యమైన అర్థాన్ని పాదసూచికలో ఉంచడం
  alternative: ‘నన్ను చూసే సజీవుని బావి’ లేదా ‘నన్ను చూసిన సజీవుని బావి’ అని నేరుగా అనువదించడం
  rationale: לַחַי רֹאִי నిర్మాణం ‘చూసే’ లేదా ‘చూసిన’ అనే భావసూక్ష్మతకు అవకాశం ఇస్తుంది. దేవుని దర్శనం గురించిన భావాన్ని ఒకే విధంగా తీర్మానించకుండా అసలు పేరును నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన శైలి. కాదేశు, బెరెదు అనే బైబిలు స్థలనామాల ప్రాచుర్య రూపాలు వాడబడ్డాయి; ‘ఇదిగో’ ద్వారా హీబ్రూ הִנֵּה యొక్క దృష్టి ఆకర్షణ నిలుపబడింది.
