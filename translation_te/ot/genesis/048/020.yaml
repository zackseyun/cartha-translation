  edition: WLC
  text: וַ/יְבָ֨רֲכֵ֜/ם בַּ/יּ֣וֹם הַ/הוּא֮ לֵ/אמוֹר֒ בְּ/ךָ֗ יְבָרֵ֤ךְ יִשְׂרָאֵל֙ לֵ/אמֹ֔ר יְשִֽׂמְ/ךָ֣ אֱלֹהִ֔ים כְּ/אֶפְרַ֖יִם וְ/כִ/מְנַשֶּׁ֑ה וַ/יָּ֥שֶׂם אֶת אֶפְרַ֖יִם לִ/פְנֵ֥י מְנַשֶּֽׁה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/020.yaml
  text: So he blessed them that day[a], saying, “By you Israel will bless, saying, ‘May God make you like Ephraim and like Manasseh.’” And he set Ephraim before Manasseh.
translation:
  language: te
  text: 'ఆ రోజున అతడు వారిని ఆశీర్వదిస్తూ ఇలా అన్నాడు: “నీ ద్వారా ఇశ్రాయేలు ఇలా ఆశీర్వదిస్తాడు: ‘దేవుడు నిన్ను ఎఫ్రాయిములాగా, మనష్షేలాగా చేయుగాక.’” అతడు ఎఫ్రాయిమును మనష్షేకు ముందు ఉంచాడు.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְבָרֲכֵם
  choice: అతడు వారిని ఆశీర్వదిస్తూ
  rationale: ברך పియేల్ రూపం ‘ఆశీర్వదించు’ అనే సాధారణ అర్థాన్ని ఇస్తుంది; బహువచన కర్మప్రత్యయం ఎఫ్రాయిము, మనష్షే ఇద్దరినీ సూచిస్తుంది.
- source_word: בַּיּוֹם הַהוּא
  choice: ఆ రోజు
  rationale: కాలాన్ని నిర్దిష్టంగా సూచించే సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: בְּךָ
  choice: మీ పేర్లతో
  rationale: హీబ్రూలో ఏకవచన రూపం ఉన్నప్పటికీ, వెంటనే ఎఫ్రాయిము–మనష్షే ఇద్దరి పేర్లతో పలికే ఆశీర్వాద సూత్రం వస్తుంది. అందువల్ల ఉద్దేశాన్ని సహజ తెలుగులో తెలియజేస్తూ, పాదటిప్పణిలో అక్షరార్థ ప్రత్యామ్నాయాన్ని ఉంచాం.
- source_word: יְבָרֵךְ יִשְׂרָאֵל
  choice: ఇశ్రాయేలు ... ఆశీర్వదిస్తాడు
  rationale: ఇంపర్ఫెక్ట్ రూపం భవిష్యత్తులో లేదా ఆనవాయితీగా జరిగే చర్యను సూచిస్తుంది. ‘ఇశ్రాయేలు’ అనే పేరును విస్తరించకుండా ఉంచడం మూలంలోని వ్యక్తి/ప్రజల భావసంభావ్యతను నిలుపుతుంది.
- source_word: יְשִׂמְךָ אֱלֹהִים
  choice: దేవుడు నిన్ను ... చేయుగాక
  rationale: ఆశీర్వాద సందర్భంలోని కోరికను తెలుగులో ‘చేయుగాక’ సహజంగా, గంభీరంగా వ్యక్తం చేస్తుంది.
- source_word: כְּאֶפְרַיִם וְכִמְנַשֶּׁה
  choice: ఎఫ్రాయిములాగా, మనష్షేలాగా
  rationale: రెండుసార్లు వచ్చిన כ పోలికను రెండు పేర్లతోనూ విడిగా వ్యక్తం చేసి మూలంలోని లయ, ఉద్ఘాటనను కాపాడాం.
- source_word: וַיָּשֶׂם אֶת אֶפְרַיִם לִפְנֵי מְנַשֶּׁה
  choice: ఈ విధంగా అతడు మనష్షే కంటే ఎఫ్రాయిముకు ముందుస్థానం ఇచ్చాడు
  rationale: లִפְנֵי ఇక్కడ కేవలం భౌతిక స్థానాన్ని కాక ఆశీర్వాద క్రమంలోని ప్రాధాన్యాన్ని సూచిస్తుంది; ‘ముందుస్థానం ఇచ్చాడు’ ఆ భావాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ఆశీర్వాద సూత్రంలో ‘ఇశ్రాయేలు’ అనే పదానికి నిర్దిష్ట సూచన
  choice: ‘ఇశ్రాయేలు’ అని మాత్రమే ఉంచి, యాకోబు లేదా ఇశ్రాయేలు ప్రజలు అని విస్తరించలేదు.
  alternative: ‘ఇశ్రాయేలు ప్రజలు’ లేదా ‘యాకోబు’ అని స్పష్టీకరించడం.
  rationale: మూలపాఠం కేవలం יִשְׂרָאֵל అని చెబుతుంది. సందర్భంలో భవిష్యత్ ఇశ్రాయేలీయుల వాడుక ప్రధానంగా కనిపించినా, పితరుడైన యాకోబుతో ఉన్న ప్రతిధ్వనిని అనువాదంలో తొలగించకూడదు.
- issue: ఎఫ్రాయిమును మనష్షేకు ముందు ఉంచడం
  choice: ‘ముందుస్థానం ఇచ్చాడు’ అని అనువదించాం.
  alternative: ‘మనష్షే ముందు ఎఫ్రాయిమును ఉంచాడు’ అనే అక్షరార్థ అనువాదం.
  rationale: ఈ సందర్భంలో చర్య ఆశీర్వాద క్రమంలో ఎఫ్రాయిముకు ఇచ్చిన ప్రాధాన్యాన్ని సూచిస్తుంది; నిర్దిష్ట సిద్ధాంతార్థాన్ని జోడించకుండా ఆ సందర్భార్థాన్ని వ్యక్తం చేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. పేర్లు సాధారణ తెలుగు బైబిలు రూపాలకు సమీపంగా ఉంచబడ్డాయి. మూలంలోని ప్రత్యక్ష వాక్యం, ఆశీర్వాద కోరిక, ‘ఇశ్రాయేలు’ అనే పదంలోని భావసంభావ్యత నిలుపబడ్డాయి.
