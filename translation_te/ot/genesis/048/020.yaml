revisions:
- from: 'ఆ రోజు అతడు వారిని ఆశీర్వదిస్తూ ఇలా అన్నాడు: “మీ పేర్లతో[a] ఇశ్రాయేలు, ‘దేవుడు నిన్ను ఎఫ్రాయిములాగా, మనష్షేలాగా చేయుగాక’ అని ఆశీర్వదిస్తాడు.” ఈ విధంగా అతడు మనష్షే కంటే ఎఫ్రాయిముకు ముందుస్థానం ఇచ్చాడు.'
  to: 'ఆ రోజున అతడు వారిని ఆశీర్వదిస్తూ ఇలా అన్నాడు: “నీ ద్వారా ఇశ్రాయేలు ఇలా ఆశీర్వదిస్తాడు: ‘దేవుడు నిన్ను ఎఫ్రాయిములాగా, మనష్షేలాగా చేయుగాక.’” అతడు ఎఫ్రాయిమును మనష్షేకు ముందు ఉంచాడు.'
  rationale: The revision restores the singular, potentially ambiguous force of בְּךָ in the main text and confines the alternate prepositional rendering to the footnote. It also renders the final clause directly, preserving the textual image and its implied precedence without adding an explanatory formulation.
