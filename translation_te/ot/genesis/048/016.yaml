revisions:
- from: అన్ని కీడుల నుండి నన్ను విమోచించిన దూత ఈ బాలురను ఆశీర్వదించుగాక. నా పేరు, నా పితరులైన అబ్రాహాము, ఇస్సాకుల పేరు వీరికి పెట్టబడుగాక[a][b]. దేశం మధ్యలో వారు అత్యధికంగా విస్తరించుగాక[c][d].
