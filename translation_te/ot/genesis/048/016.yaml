  variant: modern standard Telugu
source:
  edition: WLC
  text: הַ/מַּלְאָךְ֩ הַ/גֹּאֵ֨ל אֹתִ֜/י מִ/כָּל רָ֗ע יְבָרֵךְ֮ אֶת הַ/נְּעָרִים֒ וְ/יִקָּרֵ֤א בָ/הֶם֙ שְׁמִ֔/י וְ/שֵׁ֥ם אֲבֹתַ֖/י אַבְרָהָ֣ם וְ/יִצְחָ֑ק וְ/יִדְגּ֥וּ לָ/רֹ֖ב בְּ/קֶ֥רֶב הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/016.yaml
  text: The angel who has redeemed me from all evil[a], may he bless the boys; and may my name and the name of my fathers Abraham and Isaac be called on them[e][d][c][b]; and may they multiply greatly in the midst of the land.
translation:
  language: te
  text: సమస్త కీడుల నుండి నన్ను విమోచించిన దూత ఈ బాలురను ఆశీర్వదించుగాక. నా పేరు, నా పితరులైన అబ్రాహాము, ఇస్సాకు పేర్లు వీరికి పెట్టబడుగాక[a][b]. వారు దేశం మధ్యలో సమృద్ధిగా వృద్ధి చెందుగాక[c][d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూల నుడికారం అక్షరార్థంగా, ‘నా పేరు వారిపై పిలువబడుగాక.’ అంటే వారు యాకోబు పేరు, వంశ గుర్తింపుతో అనుబంధించబడాలని భావం.
    reason: lexical_alternative
  - marker: b
    text: ‘నా పేరు వీరికి పెట్టబడుగాక; అలాగే నా పితరులైన అబ్రాహాము, ఇస్సాకు పేర్లు కూడా’ అని కూడా అనువదించవచ్చు.
    reason: alternative_reading
  - marker: c
    text: ఇక్కడి అరుదైన హీబ్రూ క్రియ విస్తారమైన సంతానవృద్ధిని సూచిస్తుంది; అది చేపలు విపరీతంగా పెరిగే రూపచిత్రాన్ని ధ్వనింపజేయవచ్చు.
    reason: lexical_alternative
  - marker: d
    text: ‘భూమి మధ్యలో’ అని కూడా అనువదించవచ్చు. హీబ్రూ పదానికి ‘దేశం,’ ‘భూమి’ అనే రెండు అర్థాలూ ఉన్నాయి.
    reason: alternative_reading
lexical_decisions:
- source_word: הַמַּלְאָךְ
  choice: దూత
  rationale: מַלְאָךְ అంటే ‘దూత/దేవదూత.’ ఇక్కడ దైవిక ప్రతినిధిని సూచిస్తున్నప్పటికీ అతని స్వరూపాన్ని వాక్యం స్పష్టంగా నిర్వచించదు; ‘దూత’ మూలపదంలోని ప్రతినిధి భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: הַגֹּאֵל אֹתִי
  choice: నన్ను విమోచించిన
  rationale: גאל అనే పదం విమోచకునిగా విడిపించడం లేదా రక్షించడం అనే భావాన్ని కలిగి ఉంది. యాకోబు గత జీవితమంతటిలో పొందిన రక్షణను వెనుదిరిగి చెబుతున్న సందర్భంలో పూర్తయిన చర్యగా అనువదించడం సహజం.
- source_word: מִכָּל רָע
  choice: అన్ని కీడుల నుండి
  rationale: רָע నైతిక చెడుతో పాటు కీడు, ఆపద, విపత్తు అనే అర్థాలను కూడా కలిగి ఉంటుంది. ‘కీడు’ ఈ సందర్భంలోని విస్తృత పరిధిని నిలుపుతుంది.
- source_word: יְבָרֵךְ
  choice: ఆశీర్వదించుగాక
  rationale: ఆశీర్వాద సందర్భంలో ఈ yiqtol కోరిక లేదా ప్రార్థనార్థక బలాన్ని కలిగి ఉంది; తెలుగు ఆశీర్వచన శైలిలో ‘-గాక’ దానిని స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: הַנְּעָרִים
  choice: ఈ బాలురను
  rationale: ఇది ఎఫ్రాయిము, మనష్షేలను సూచిస్తుంది. సందర్భంలో వారు ప్రత్యక్షంగా ఉన్నందున ‘ఈ బాలురు’ సహజంగా, నిర్దిష్టంగా ఉంటుంది.
- source_word: וְיִקָּרֵא בָהֶם שְׁמִי
  choice: నా పేరు ... వీరికి పెట్టబడుగాక
  rationale: ‘పేరు వారిపై పిలువబడుట’ అనే హీబ్రూ నుడికారానికి కుటుంబ నామం, గుర్తింపు వారితో ముడిపడాలని భావం. సహజమైన ఆధునిక తెలుగులో ‘పేరు వీరికి పెట్టబడుగాక’ అని ఇచ్చి, మూల నుడికారాన్ని పాదసూచికలో ఉంచాం.
- source_word: וְשֵׁם אֲבֹתַי אַבְרָהָם וְיִצְחָק
  choice: నా పితరులైన అబ్రాహాము, ఇస్సాకుల పేరు
  rationale: మూలంలో ‘పేరు’ ఏకవచనంలో ఉంది; అది వంశపారంపర్య గుర్తింపును సమష్టిగా సూచిస్తుంది. అందువల్ల తెలుగులోనూ ఏకవచనాన్ని నిలిపాం.
- source_word: וְיִדְגּוּ לָרֹב
  choice: వారు అత్యధికంగా విస్తరించుగాక
  rationale: అరుదైన דגה క్రియ చేపలవలె విస్తారంగా పెరగడాన్ని ధ్వనింపజేస్తుంది. ప్రధాన పాఠంలో అర్థాన్ని సహజంగా తెలియజేసి, చేపల రూపచిత్రాన్ని పాదసూచికలో వివరించాం.
- source_word: בְּקֶרֶב הָאָרֶץ
  choice: దేశం మధ్యలో
  rationale: אֶרֶץ అంటే సందర్భానుసారం ‘దేశం’ లేదా ‘భూమి.’ పితరులకు వాగ్దానం చేయబడిన దేశం నేపథ్యంగా ఉన్నందున ‘దేశం’ ఎంచుకున్నాం; విస్తృత ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలిపాం.
theological_decisions:
- issue: యాకోబు ఆశీర్వాదంలోని ‘దూత’ ఎవరు?
  choice: అతని స్వరూపాన్ని మరింత నిర్దిష్టంగా నిర్ణయించకుండా ‘దూత’ అని ఉంచడం
  alternative: దేవుని ప్రత్యక్షతగా భావించడం; లేదా దేవుని తరఫున పనిచేసే సృష్టించబడిన దేవదూతగా భావించడం
  rationale: ఈ ఆశీర్వాదంలో దేవునికీ దూతకీ సన్నిహిత సంబంధం ఉంది; అయితే హీబ్రూ వాక్యం దూత యొక్క అస్తిత్వ స్వరూపాన్ని స్పష్టంగా నిర్వచించదు. అందువల్ల అనువాదం ఏ ప్రత్యేక క్రీస్తు సంబంధమైన లేదా దేవదర్శన సంబంధమైన నిర్ణయాన్నీ పాఠంలోకి చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ ఆశీర్వచనానికి తగిన గంభీరత కోసం ‘ఆశీర్వదించుగాక,’ ‘పెట్టబడుగాక,’ ‘విస్తరించుగాక’ అనే రూపాలు వాడబడ్డాయి. అబ్రాహాము, ఇస్సాకు అనే సాధారణ తెలుగు బైబిలు నామరూపాలు నిలుపబడ్డాయి.
