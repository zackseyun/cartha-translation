id: GEN.48.5
reference: Genesis 48:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/עַתָּ֡ה שְׁנֵֽי בָנֶי/ךָ֩ הַ/נּוֹלָדִ֨ים לְ/ךָ֜ בְּ/אֶ֣רֶץ מִצְרַ֗יִם עַד בֹּאִ֥/י אֵלֶ֛י/ךָ מִצְרַ֖יְמָ/ה לִ/י הֵ֑ם אֶפְרַ֨יִם֙ וּ/מְנַשֶּׁ֔ה כִּ/רְאוּבֵ֥ן וְ/שִׁמְע֖וֹן יִֽהְיוּ לִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/005.yaml
  text: And now[a], your two sons, who were born to you in the land of Egypt before I came to you in Egypt, are mine; Ephraim and Manasseh shall be mine[c][b], like Reuben and Simeon.
translation:
  language: te
  text: ఇప్పుడు, నేను ఐగుప్తులో నీ దగ్గరకు రాకముందు ఐగుప్తు దేశంలో నీకు పుట్టిన నీ ఇద్దరు కుమారులు నావారు. ఎఫ్రాయిము, మనష్షే—రూబేను, షిమ్యోను వలె—నావారుగా ఉంటారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అంటే, ఎఫ్రాయిము, మనష్షే యాకోబు సొంత కుమారులుగా లెక్కించబడి, రూబేను, షిమ్యోనులతో పోల్చదగిన హోదా పొందుతారు. ‘రాకముందు’ అనే మాటకు మరింత పదశః అనువాదం ‘నేను ఐగుప్తులో నీ దగ్గరకు వచ్చేవరకు.’
    reason: సాంస్కృతిక వివరణ మరియు పదశః ప్రత్యామ్నాయం
lexical_decisions:
- source_word: וְעַתָּה
  choice: ఇప్పుడు
  rationale: యాకోబు మాటల్లో కొత్త, ప్రాముఖ్యమైన ప్రకటనను సహజమైన ఆధునిక తెలుగులో ప్రారంభిస్తుంది; వావ్ సంధిని ప్రత్యేకంగా ‘మరియు’ అని అనువదించకపోయినా ప్రసంగ సంబంధం నిలుస్తుంది.
- source_word: שְׁנֵי בָנֶיךָ הַנּוֹלָדִים לְךָ
  choice: నీకు పుట్టిన నీ ఇద్దరు కుమారులు
  rationale: ఇద్దరు అనే సంఖ్యను, యోసేపుతో వారి పుత్ర సంబంధాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: ఐగుప్తు దేశంలో
  rationale: మూలంలోని ‘దేశం’ అనే పదాన్ని విడిచిపెట్టకుండా స్థల సూచనను కాపాడుతుంది.
- source_word: עַד בֹּאִי אֵלֶיךָ מִצְרַיְמָה
  choice: నేను ఐగుప్తులో నీ దగ్గరకు రాకముందు
  rationale: עַד యొక్క పదశః ‘వరకు’ భావం ఇక్కడ యాకోబు రాకకు పూర్వం పుట్టిన కుమారులను పరిమితం చేస్తుంది; తెలుగులో ‘రాకముందు’ సందర్భార్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: לִי הֵם
  choice: నావారు
  rationale: ‘వారు నాకు చెందినవారు’ అనే బంధస్థితిని సంక్షిప్తంగా తెలియజేస్తుంది; మూలంలో లేని సాంకేతిక దత్తత పదాన్ని చేర్చదు.
- source_word: אֶפְרַיִם וּמְנַשֶּׁה
  choice: ఎఫ్రాయిము, మనష్షే
  rationale: తెలుగు బైబిలు నామరూపాలకు అనుగుణమైన లిప్యంతరీకరణ.
- source_word: כִּרְאוּבֵן וְשִׁמְעוֹן
  choice: రూబేను, షిమ్యోను వలె
  rationale: כְּ సూచించే పోలికను స్పష్టంగా ఉంచి, సమాన పుత్ర హోదాను అతిగా వివరిచకుండా తెలియజేస్తుంది.
- source_word: יִהְיוּ לִי
  choice: నావారుగా ఉంటారు
  rationale: భవిష్యత్ ప్రకటన యొక్క గంభీరతను నిలుపుతూ సహజమైన తెలుగులో సంబంధ హోదాను వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ఎఫ్రాయిము, మనష్షేలపై యాకోబు చేసిన హక్కు ప్రకటన స్వభావం
  choice: ‘నావారు… నావారుగా ఉంటారు’ అని మూల ప్రకటనను నేరుగా అనువదించడం
  alternative: ‘వారిని నా కుమారులుగా దత్తత తీసుకుంటున్నాను’ అని స్పష్టమైన దత్తత పరిభాషను ఉపయోగించడం
  rationale: వచనం వారిని రూబేను, షిమ్యోనులతో సమానమైన పుత్ర హోదాలో చేర్చుతుంది; అయితే సాంకేతికంగా ‘దత్తత’ అనే పదాన్ని ఉపయోగించదు. అందువల్ల ఫలితాన్ని నిలిపి, విధానాన్ని అదనంగా నిర్వచించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. మూలంలోని ఐగుప్తు ప్రస్తావన రెండుసార్లు ఉండటాన్ని నిలిపింది. సాంకేతిక న్యాయపరమైన ‘దత్తత’ పదాన్ని ప్రధాన పాఠ్యంలో చేర్చకుండా, సందర్భంలోని పుత్ర హోదాను పాదటిప్పణిలో వివరించింది.
