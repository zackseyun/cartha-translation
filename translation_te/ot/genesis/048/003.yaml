  text: וַ/יֹּ֤אמֶר יַעֲקֹב֙ אֶל יוֹסֵ֔ף אֵ֥ל שַׁדַּ֛י נִרְאָֽה אֵלַ֥/י בְּ/ל֖וּז בְּ/אֶ֣רֶץ כְּנָ֑עַן וַ/יְבָ֖רֶךְ אֹתִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/003.yaml
  text: And Jacob said to Joseph[a], “God Almighty appeared to me at Luz in the land of Canaan and blessed me,”
translation:
  language: te
  text: 'యాకోబు యోసేపుతో ఇలా అన్నాడు: “సర్వశక్తిమంతుడైన దేవుడు[a] కనాను దేశంలోని లూజులో నాకు ప్రత్యక్షమై నన్ను ఆశీర్వదించాడు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ: “ఏల్ షద్దాయి.” దీన్ని సంప్రదాయంగా “సర్వశక్తిమంతుడైన దేవుడు” అని అనువదిస్తారు; ‘షద్దాయి’ అనే పదం యొక్క ఖచ్చిత భావం గురించి భిన్నాభిప్రాయాలు ఉన్నాయి.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר יַעֲקֹב אֶל יוֹסֵף
  choice: యాకోబు యోసేపుతో ఇలా అన్నాడు
  rationale: హీబ్రూ కథన క్రమాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; సంభాషణను పరిచయం చేయడానికి ‘ఇలా’ సహజంగా ఉంది.
- source_word: אֵל שַׁדַּי
  choice: సర్వశక్తిమంతుడైన దేవుడు
  rationale: దైవ బిరుదును అపారదర్శకంగా లిప్యంతరీకరించకుండా తెలుగులో స్థిరంగా, అర్థవంతంగా అనువదిస్తుంది; שַׁדַּי యొక్క ఖచ్చిత భావం వివాదాస్పదమైనందున మూలరూపాన్ని పాదటిప్పణిలో ఉంచింది.
- source_word: נִרְאָה אֵלַי
  choice: నాకు ప్రత్యక్షమై
  rationale: నిఫాల్ రూపం సూచించే దైవ ప్రత్యక్షతను అదనపు వివరణ లేకుండా సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בְּלוּז בְּאֶרֶץ כְּנָעַן
  choice: కనాను దేశంలోని లూజులో
  rationale: ‘దేశం’ అనే మూలపదాన్ని నిలుపుతూ స్థలాల మధ్య సంబంధాన్ని సహజమైన తెలుగు నిర్మాణంలో చూపిస్తుంది.
- source_word: וַיְבָרֶךְ אֹתִי
  choice: నన్ను ఆశీర్వదించాడు
  rationale: అదే దైవ కర్త కొనసాగుతున్నదని స్పష్టంగా తెలియజేస్తూ హీబ్రూ క్రియ యొక్క అర్థాన్ని నేరుగా అందిస్తుంది.
theological_decisions:
- issue: אֵל שַׁדַּי అనే దైవ బిరుదు అనువాదం
  choice: సర్వశక్తిమంతుడైన దేవుడు
  alternative: ఏల్ షద్దాయి
  rationale: తెలుగు పాఠకులకు బిరుదు యొక్క సంప్రదాయ భావాన్ని స్పష్టంగా అందిస్తుంది. అయితే שַׁדַּי యొక్క వ్యుత్పత్తి, ఖచ్చిత భావఛాయ వివాదాస్పదమైనందున ‘ఏల్ షద్దాయి’ రూపాన్ని పాదటిప్పణిలో భద్రపరుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని దైవ బిరుదు సంబంధమైన నిజమైన పదార్థ అనిశ్చితిని పాదటిప్పణి ద్వారా నిలుపుకుంది.
