language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּ֥רְא יִשְׂרָאֵ֖ל אֶת בְּנֵ֣י יוֹסֵ֑ף וַ/יֹּ֖אמֶר מִי אֵֽלֶּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/008.yaml
  text: When Israel saw Joseph's sons[a], he said[b], “Who are these?”
translation:
  language: te
  text: ఇశ్రాయేలు యోసేపు కుమారులను చూసి, “వీరు ఎవరు?” అని అన్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּרְא
  choice: చూసి
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని ముందుకు నడిపి, తరువాతి మాటకు కాలక్రమ సంబంధాన్ని కల్పిస్తుంది. ఆధునిక తెలుగులో ‘చూసి’ ఈ అనుబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: יִשְׂרָאֵל
  choice: ఇశ్రాయేలు
  rationale: మూల హీబ్రూ పాఠంలో ‘యాకోబు’ కాకుండా ‘ఇశ్రాయేలు’ ఉంది; కాబట్టి ఆ పేరునే నిలుపుకున్నాం.
- source_word: אֶת
  choice: '[ప్రత్యేకంగా అనువదించలేదు]'
  rationale: ఇది నిర్దిష్ట ప్రత్యక్ష కర్మను సూచించే హీబ్రూ వ్యాకరణ చిహ్నం; తెలుగులో దీనికి విడిగా సమాన పదం అవసరం లేదు.
- source_word: בְּנֵי יוֹסֵף
  choice: యోసేపు కుమారులను
  rationale: ఈ సమాస పదబంధం అక్షరార్థంగా ‘యోసేపు కుమారులు.’ వాక్యంలో కర్మగా ఉన్నందున తెలుగులో ‘యోసేపు కుమారులను’ సహజంగా ఉంటుంది.
- source_word: וַיֹּאמֶר
  choice: అని అడిగాడు
  rationale: అక్షరార్థంగా ‘అన్నాడు’; అయితే వెంట వచ్చే మాట ప్రశ్న కావడంతో ఆధునిక తెలుగులో ‘అని అడిగాడు’ సహజంగా, సందర్భార్థాన్ని నిష్కళంకంగా తెలియజేస్తుంది.
- source_word: מִי
  choice: ఎవరు
  rationale: వ్యక్తుల గుర్తింపును అడిగే ప్రశ్నార్థక సర్వనామం.
- source_word: אֵלֶּה
  choice: వీరు
  rationale: సమక్షంలో ఉన్న వ్యక్తులను సూచించే బహువచన సర్వనామం; మానవులకు గౌరవప్రదమైన ఆధునిక తెలుగు రూపం ‘వీరు.’
theological_decisions:
- issue: పితామహుని పేరుగా יִשְׂרָאֵל
  choice: ఇశ్రాయేలు
  alternative: యాకోబు
  rationale: ఈ వచనం ఉద్దేశపూర్వకంగా ‘ఇశ్రాయేలు’ అనే పేరును వాడుతుంది. దానిని ‘యాకోబు’గా మార్చితే మూలపాఠంలోని నామభేదం కనుమరుగవుతుంది.
translation_notes:
  register: సహజమైన, ఆధునిక ప్రామాణిక తెలుగు; కథన గాంభీర్యాన్ని నిలుపుతూ సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే నిర్మాణం. ‘వీరు’ వ్యక్తులను సూచించే మర్యాదపూర్వక బహువచనంగా ఎంచుకున్నాం.
