  source_fidelity: మూల హీబ్రూలోని చర్యల క్రమం మరియు కారణసూచక כִּי ('ఎందుకంటే/ఎందుకనగా')ను స్పష్టంగా కాపాడాలి. ముసాయిదాలో ‘మనష్షే మొదట పుట్టినవాడైనా’ అనే concessive నిర్మాణం కారణసంబంధాన్ని మార్చి, చేతులు అడ్డంగా ఉంచిన చర్యను వాక్యాంతంలో విడదీస్తోంది.
