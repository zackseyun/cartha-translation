  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּשְׁלַח֩ יִשְׂרָאֵ֨ל אֶת יְמִינ֜/וֹ וַ/יָּ֨שֶׁת עַל רֹ֤אשׁ אֶפְרַ֨יִם֙ וְ/ה֣וּא הַ/צָּעִ֔יר וְ/אֶת שְׂמֹאל֖/וֹ עַל רֹ֣אשׁ מְנַשֶּׁ֑ה שִׂכֵּל֙ אֶת יָדָ֔י/ו כִּ֥י מְנַשֶּׁ֖ה הַ/בְּכֽוֹר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/014.yaml
  text: Then Israel stretched out his right hand and placed it on Ephraim’s head[a], though he was the younger, and his left hand on Manasseh’s head, crossing his hands, for Manasseh was the firstborn.
translation:
  language: te
  text: అప్పుడు ఇశ్రాయేలు తన కుడిచేతిని చాపి, చిన్నవాడైన ఎఫ్రాయిము తలపై ఉంచాడు; తన ఎడమచేతిని మనష్షే తలపై ఉంచాడు. మనష్షే మొదట పుట్టినవాడు కాబట్టి, అతడు తన చేతులను ఉద్దేశపూర్వకంగా అడ్డంగా ఉంచాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తన చేతులను ఉద్దేశపూర్వకంగా నడిపించాడు.” ఈ హీబ్రూ పదబంధం ఉద్దేశంతో, నేర్పుగా చేతులను అమర్చడాన్ని సూచించవచ్చు; ఇక్కడి సందర్భం అతడు వాటిని అడ్డంగా ఉంచాడని తెలియజేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: చాపి
  rationale: చేతిని భౌతికంగా ముందుకు చాపే చర్యను ఈ సందర్భంలో సహజంగా తెలుపుతుంది.
- source_word: וַיָּשֶׁת
  choice: ఉంచాడు
  rationale: తలపై చేయి పెట్టే ఆశీర్వాద చర్యను సరళంగా, స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: וְהוּא הַצָּעִיר
  choice: చిన్నవాడైన
  rationale: ఎఫ్రాయిము వయస్సులో చిన్నవాడనే సమాచారాన్ని సహజమైన తెలుగు వాక్యనిర్మాణంలో నిలుపుతుంది.
- source_word: שִׂכֵּל אֶת יָדָיו
  choice: ఉద్దేశపూర్వకంగా తన చేతులను అడ్డంగా ఉంచాడు
  rationale: అరుదైన హీబ్రూ ప్రయోగంలోని ఉద్దేశపూర్వక, నైపుణ్యపూర్వక అమరిక భావాన్ని, సందర్భం సూచించే చేతుల అడ్డమార్పుతో కలిపి వ్యక్తపరుస్తుంది.
- source_word: הַבְּכֹר
  choice: మొదట పుట్టినవాడు
  rationale: ఆశీర్వాద సందర్భంలో ప్రాముఖ్యమైన జననక్రమ భావాన్ని స్పష్టంగా కాపాడుతుంది.
theological_decisions:
- issue: שִׂכֵּל אֶת יָדָיו అనే ప్రయోగ వివరణ
  choice: యాకోబు ఉద్దేశపూర్వకంగా చేతులను అడ్డంగా ఉంచాడు
  alternative: యాకోబు తన చేతులను వివేకంతో లేదా నైపుణ్యంగా నడిపించాడు
  rationale: కుడిచేయి చిన్నవాడైన ఎఫ్రాయిముపై, ఎడమచేయి మొదట పుట్టిన మనష్షేపై ఉంచిన తక్షణ సందర్భం చేతులు అడ్డంగా పెట్టిన చర్యను బలంగా సూచిస్తుంది. అయినా హీబ్రూ పదబంధంలోని ఉద్దేశపూర్వక అమరిక భావాన్ని అనువాదంలోను పాదసూచికలోను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన కథనశైలి వాడబడింది. ‘ఇశ్రాయేలు,’ ‘ఎఫ్రాయిము,’ ‘మనష్షే’ అనే స్థిరమైన బైబిలు నామరూపాలు ఉంచబడ్డాయి; క్లిష్టమైన హీబ్రూ ప్రయోగంలోని అనిశ్చితి పాదసూచికలో భద్రపరచబడింది.
