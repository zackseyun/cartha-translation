  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, అయితే వాక్య గౌరవాన్ని నిలుపుతూ అనువదించబడింది. గుర్తుతెలియని వక్తను పేరుపెట్టి నిర్ధారించలేదు.
