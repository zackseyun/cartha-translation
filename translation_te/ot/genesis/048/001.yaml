  to: ఈ సంగతుల తరువాత, యోసేపుతో ఎవరో[a], “ఇదిగో, నీ తండ్రి అనారోగ్యంతో ఉన్నాడు” అని చెప్పాడు. అప్పుడు యోసేపు తన ఇద్దరు కుమారులైన మనష్షేను, ఎఫ్రాయిమును తన వెంట తీసుకువెళ్లాడు.
