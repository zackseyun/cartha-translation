  text: וַ/יְהִ֗י אַחֲרֵי֙ הַ/דְּבָרִ֣ים הָ/אֵ֔לֶּה וַ/יֹּ֣אמֶר לְ/יוֹסֵ֔ף הִנֵּ֥ה אָבִ֖י/ךָ חֹלֶ֑ה וַ/יִּקַּ֞ח אֶת שְׁנֵ֤י בָנָי/ו֙ עִמּ֔/וֹ אֶת מְנַשֶּׁ֖ה וְ/אֶת אֶפְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/001.yaml
  text: After these things[a], it was said to Yoseph, “Look, your father is sick.” So he took his two sons with him, Manasseh and Ephraim.
translation:
  language: te
  text: ఈ సంగతుల తరువాత, యోసేపుతో ఎవరో[a], “ఇదిగో, నీ తండ్రి అనారోగ్యంతో ఉన్నాడు” అని చెప్పాడు. అప్పుడు యోసేపు తన ఇద్దరు కుమారులైన మనష్షేను, ఎఫ్రాయిమును తన వెంట తీసుకువెళ్లాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, ‘అతడు యోసేపుతో చెప్పాడు’; అయితే చెప్పిన వ్యక్తి ఎవరో పేర్కొనబడలేదు. అందువల్ల ప్రధాన పాఠంలో ‘ఎవరో’ అని అనిర్దిష్టంగానే ఉంచబడింది.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי הַדְּבָרִים הָאֵלֶּה
  choice: ఈ సంగతులు జరిగిన తరువాత
  rationale: కథనంలోని తదుపరి పరిణామాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తూ, ‘ఈ సంగతుల తరువాత’ అనే పూర్వాపర సంబంధాన్ని నిలుపుతుంది.
- source_word: וַיֹּאמֶר לְיוֹסֵף
  choice: ఒక వ్యక్తి యోసేపుతో ... అని చెప్పాడు
  rationale: హీబ్రూ క్రియ పురుష ఏకవచనంలో ఉన్నా, మాట్లాడిన వ్యక్తి ఎవరో పేర్కొనబడలేదు. ‘ఒక వ్యక్తి’ అనేది అతని గుర్తింపును ఊహించకుండా ఆ అనిర్దిష్టతను నిలుపుతుంది.
- source_word: הִנֵּה
  choice: ఇదిగో
  rationale: శ్రోత దృష్టిని వెంటనే విషయంపై నిలిపే హీబ్రూ సూచక అవ్యయానికి సహజమైన, గౌరవప్రదమైన తెలుగు సమానం.
- source_word: אָבִיךָ חֹלֶה
  choice: నీ తండ్రి జబ్బుపడ్డాడు
  rationale: తండ్రి ప్రస్తుతం అనారోగ్యంతో ఉన్నాడనే భావాన్ని సాధారణ ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: וַיִּקַּח אֶת שְׁנֵי בָנָיו עִמּוֹ
  choice: అప్పుడు యోసేపు తన ఇద్దరు కుమారులను తనతో తీసుకువెళ్లాడు
  rationale: కథన క్రమాన్ని ‘అప్పుడు’తో సహజంగా కొనసాగిస్తూ, కుమారులు యోసేపుతో వెళ్లారనే భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: אֶת מְנַשֶּׁה וְאֶת אֶפְרָיִם
  choice: మనష్షేను, ఎఫ్రాయిమును
  rationale: హీబ్రూ వ్యక్తినామాలకు దగ్గరగా ఉండే, తెలుగులో సులభంగా చదవగల రూపాలు; ఇవి ఇద్దరు కుమారులు ఎవరో వివరిస్తాయి.
