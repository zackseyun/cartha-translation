source:
  edition: WLC
  text: וְ/עֵינֵ֤י יִשְׂרָאֵל֙ כָּבְד֣וּ מִ/זֹּ֔קֶן לֹ֥א יוּכַ֖ל לִ/רְא֑וֹת וַ/יַּגֵּ֤שׁ אֹתָ/ם֙ אֵלָ֔י/ו וַ/יִּשַּׁ֥ק לָ/הֶ֖ם וַ/יְחַבֵּ֥ק לָ/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/010.yaml
  text: Israel’s eyes were dim with age[a]; he could not see. So he brought them near to him[b], and he kissed them and embraced them.
translation:
  language: te
  text: ఇశ్రాయేలు కళ్ళు వృద్ధాప్యం వల్ల మసకబారాయి[a]; అతడు చూడలేకపోయాడు. అప్పుడు యోసేపు వారిని ఇశ్రాయేలు దగ్గరికి తీసుకొచ్చాడు; ఇశ్రాయేలు వారిని ముద్దుపెట్టుకొని కౌగిలించుకున్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'అక్షరార్థం: ‘ఇశ్రాయేలు కళ్ళు వృద్ధాప్యం వల్ల బరువెక్కాయి.’ ఇది చూపు మసకబారిందని సూచించే హీబ్రూ నుడికారం.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵינֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కళ్ళు
  rationale: హీబ్రూ సమాసాన్ని సహజమైన తెలుగు స్వామ్య నిర్మాణంలో అందిస్తూ, మూలంలో ఉన్న ‘ఇశ్రాయేలు’ అనే పేరునే నిలిపాం.
- source_word: כָּבְדוּ מִזֹּקֶן
  choice: ముసలితనం వల్ల మందగించాయి
  rationale: అక్షరార్థంగా ‘ముసలితనం వల్ల బరువెక్కాయి’; చూపు సందర్భంలో ఇది కళ్ళు మందగించడాన్ని సూచిస్తుంది. కారణార్థకమైన מִן‌ను ‘వల్ల’గా స్పష్టంగా అందించాం.
- source_word: לֹא יוּכַל לִרְאוֹת
  choice: అతడు చూడలేకపోయాడు
  rationale: సామర్థ్యలేమిని తెలిపే హీబ్రూ నిర్మాణానికి సహజమైన ఆధునిక తెలుగు సమానం.
- source_word: וַיַּגֵּשׁ אֹתָם אֵלָיו
  choice: అప్పుడు అతడు వారిని తన దగ్గరికి రప్పించుకున్నాడు
  rationale: హిఫిల్ క్రియలోని ‘దగ్గరికి తీసుకురావడం/రప్పించడం’ భావాన్ని నిలిపాం. కర్తను మూలంలాగే సర్వనామంతో ఉంచి, సందర్భం నిర్ణయించే అంశాన్ని పాఠ్యంలో ప్రత్యేక పేరుతో పరిష్కరించలేదు.
- source_word: וַיִּשַּׁק לָהֶם
  choice: వారిని ముద్దుపెట్టుకొని
  rationale: బహువచన ప్రత్యయాన్ని సహజమైన తెలుగు కర్మరూపంలో అందించాం.
- source_word: וַיְחַבֵּק לָהֶם
  choice: కౌగిలించుకున్నాడు
  rationale: ఆప్యాయ చర్యను గౌరవప్రదమైన, సహజమైన కథన భాషలో అందిస్తుంది.
theological_decisions:
- issue: וַיַּגֵּשׁ క్రియ కర్త ఎవరు?
  choice: ‘అతడు’ అని మూలంలోని అంతర్నిహిత కర్తను అలాగే ఉంచడం
  alternative: ‘యోసేపు’ అని పేరును చేర్చడం
  rationale: హీబ్రూ క్రియ పురుష ఏకవచన కర్తను సూచించినా పేరును చెప్పదు. సమీప వ్యాకరణ కర్త ఇశ్రాయేలు కాగా, ముందరి సందర్భం యోసేపును సూచించవచ్చనే చర్చ ఉంది. మూలంలోని నిజమైన అస్పష్టతను తొలగించకుండా సర్వనామాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా, కథనానికి తగిన గౌరవప్రదమైన శైలిలో రూపొందించబడింది. ‘కళ్ళు’ సాధారణ ఆధునిక రూపం; ‘ముసలితనం’ మూలంలోని వృద్ధాప్య కారణాన్ని నేరుగా తెలియజేస్తుంది.
