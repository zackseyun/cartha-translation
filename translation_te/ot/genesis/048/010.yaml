revisions:
- from: ఇశ్రాయేలు కళ్ళు ముసలితనం వల్ల మందగించాయి[a]; అతడు చూడలేకపోయాడు. అప్పుడు అతడు వారిని తన దగ్గరికి రప్పించుకున్నాడు[b]; వారిని ముద్దుపెట్టుకొని కౌగిలించుకున్నాడు.
