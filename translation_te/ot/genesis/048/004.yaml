revisions:
- from: 'ఆయన నాతో ఇలా అన్నాడు: “ఇదిగో, నేను నిన్ను ఫలవంతునిగా చేసి, నీ సంతానాన్ని విస్తరింపజేస్తాను; నిన్ను జనసమూహంగా చేస్తాను. నీ తర్వాత నీ సంతానానికి ఈ దేశాన్ని శాశ్వత స్వాస్థ్యంగా ఇస్తాను.”'
  to: 'ఆయన నాతో ఇలా అన్నాడు: “ఇదిగో, నేను నిన్ను ఫలవంతునిగా చేసి విస్తరింపజేస్తాను; నిన్ను ప్రజల సమాజంగా చేస్తాను. నీ తర్వాత నీ సంతానానికి ఈ భూమిని శాశ్వత స్వాస్థ్యంగా ఇస్తాను.”'
  rationale: The revision explicitly retains the plural “peoples” in the promised assembly and uses “భూమి” for the promised land. All other elements of the draft, including the collective rendering “సంతానం” and the enduring-possession sense of “శాశ్వత స్వాస్థ్యం,” are retained.
