id: GEN.48.4
reference: Genesis 48:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֵלַ֗/י הִנְ/נִ֤י מַפְרְ/ךָ֙ וְ/הִרְבִּיתִ֔/ךָ וּ/נְתַתִּ֖י/ךָ לִ/קְהַ֣ל עַמִּ֑ים וְ/נָ֨תַתִּ֜י אֶת הָ/אָ֧רֶץ הַ/זֹּ֛את לְ/זַרְעֲ/ךָ֥ אַחֲרֶ֖י/ךָ אֲחֻזַּ֥ת עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/004.yaml
  text: And he said to me, ‘Look, I will make you fruitful and multiply you, and I will make you into an assembly of peoples, and I will give this land to your offspring after you as an everlasting possession.’
translation:
  language: te
  text: 'ఆయన నాతో ఇలా అన్నాడు: “ఇదిగో, నేను నిన్ను ఫలవంతునిగా చేసి విస్తరింపజేస్తాను; నిన్ను ప్రజల సమాజంగా చేస్తాను. నీ తర్వాత నీ సంతానానికి ఈ భూమిని శాశ్వత స్వాస్థ్యంగా ఇస్తాను.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנְנִי
  choice: ఇదిగో, నేను
  rationale: దృష్టిని ఆకర్షిస్తూ తరువాతి దైవ వాగ్దానాన్ని బలంగా పరిచయం చేసే హీబ్రూ రూపాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: מַפְרְךָ וְהִרְבִּיתִךָ
  choice: నిన్ను ఫలవంతునిగా చేసి, నీ సంతానాన్ని విస్తరింపజేస్తాను
  rationale: మొదటి క్రియలోని ఫలవృద్ధి భావాన్నీ, రెండవ క్రియలోని సంఖ్యావృద్ధి భావాన్నీ స్పష్టంగా వేరు చేస్తుంది; సందర్భంలో యాకోబు సంతానం ఉద్దేశించబడింది.
- source_word: לִקְהַל עַמִּים
  choice: జనసమూహంగా
  rationale: קהל యొక్క సమాహార భావాన్ని, עמים యొక్క బహుజన భావాన్ని సంక్షిప్తంగా తెలియజేస్తుంది; దీనిని రాజకీయ ‘దేశాలు’గా అతిగా నిర్దిష్టం చేయదు.
- source_word: לְזַרְעֲךָ אַחֲרֶיךָ
  choice: నీ తర్వాత నీ సంతానానికి
  rationale: זֶרַע అనే సమూహార్థక పదాన్ని తెలుగులో సహజమైన ఏకవచన సమూహనామమైన ‘సంతానం’తో అనువదించి, తరాల కొనసాగింపును నిలుపుతుంది.
- source_word: אֲחֻזַּת עוֹלָם
  choice: శాశ్వత స్వాస్థ్యంగా
  rationale: భూమిపై స్థిరమైన వారసత్వాధికారాన్ని సూచించే אֲחֻזָּה భావాన్ని ‘స్వాస్థ్యం’ వ్యక్తం చేస్తుంది; עוֹלָםను సందర్భానుసారంగా ‘శాశ్వత’గా అందిస్తుంది.
theological_decisions:
- issue: కְהַל עַמִּים యొక్క పరిధి
  choice: జనసమూహం
  alternative: ప్రజల సమాజం / జనముల సమూహం
  rationale: మూలంలోని బహువచన ‘ప్రజలు/జనాలు’ భావాన్ని కోల్పోకుండా, అది జాతుల రాజకీయ సమాఖ్య అని అదనపు సిద్ధాంతార్థం చేర్చకుండా అనువదించబడింది.
- issue: עוֹלָם యొక్క కాలవ్యాప్తి
  choice: శాశ్వత
  alternative: దీర్ఘకాలిక / తరతరాల
  rationale: ఒడంబడిక వాగ్దానంలోని బలమైన, నిరవధిక భావాన్ని సంప్రదాయబద్ధంగా నిలుపుతుంది; వాక్యం స్వయంగా దాని అమలుకు సంబంధించిన తరువాతి ధార్మిక ప్రశ్నలను పరిష్కరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కానీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. దేవుని ప్రత్యక్ష వాక్యానికి గౌరవభరిత స్వరం ఉంచబడింది; అనవసరమైన ప్రాచీన పదబంధాలు నివారించబడ్డాయి.
