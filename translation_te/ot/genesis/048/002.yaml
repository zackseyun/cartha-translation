  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּגֵּ֣ד לְ/יַעֲקֹ֔ב וַ/יֹּ֕אמֶר הִנֵּ֛ה בִּנְ/ךָ֥ יוֹסֵ֖ף בָּ֣א אֵלֶ֑י/ךָ וַ/יִּתְחַזֵּק֙ יִשְׂרָאֵ֔ל וַ/יֵּ֖שֶׁב עַל הַ/מִּטָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/002.yaml
  text: And it was told to Jacob[a], and it was said, “Look, your son Joseph has come to you.” And Israel strengthened himself and sat up on the bed.
translation:
  language: te
  text: 'అప్పుడు యాకోబుకు ఇలా తెలియజేయబడింది: “ఇదిగో, నీ కుమారుడు యోసేపు నీ దగ్గరికి వచ్చాడు.” ఇశ్రాయేలు శక్తి కూడగట్టుకొని మంచం మీద కూర్చున్నాడు.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּגֵּד ... וַיֹּאמֶר
  choice: అప్పుడు యాకోబుతో ... అని చెప్పారు
  rationale: మూలంలో చెప్పిన వ్యక్తి పేరు లేదా గుర్తింపు లేదు. తెలుగులో కర్తను పేర్కొనని ‘చెప్పారు’ ప్రయోగం ఆ అనిర్దిష్టతను సహజంగా నిలుపుతుంది; వరుసగా ఉన్న రెండు హీబ్రూ క్రియలను తెలుగు ప్రత్యక్ష వాక్య నిర్మాణంలో అనవసర పునరుక్తి లేకుండా వ్యక్తపరుస్తుంది.
- source_word: הִנֵּה
  choice: ఇదిగో
  rationale: దృష్టిని ఆకర్షించే హీబ్రూ సూచనార్థక అవ్యయానికి ఆధునిక, సహజమైన తెలుగు సమానం.
- source_word: בִּנְךָ יוֹסֵף
  choice: నీ కుమారుడు యోసేపు
  rationale: స్వామ్య సంబంధాన్ని, వ్యక్తి పేరును నేరుగా మరియు స్పష్టంగా నిలుపుతుంది.
- source_word: בָּא אֵלֶיךָ
  choice: నీ దగ్గరికి వచ్చాడు
  rationale: యోసేపు ఇప్పటికే చేరుకున్నాడనే తక్షణ సందర్భానికి సరిపోయే పూర్తయిన చర్యగా అనువదించబడింది.
- source_word: וַיִּתְחַזֵּק
  choice: తనను తాను బలపరచుకొని
  rationale: חזק హిత్పయేల్ రూపంలోని ఆత్మనేపద భావాన్ని దగ్గరగా నిలుపుతూ, అనారోగ్యంలో ఉన్న ఇశ్రాయేలు తన శక్తిని కూడగట్టుకున్నాడనే సందర్భార్థాన్ని తెలియజేస్తుంది.
- source_word: וַיֵּשֶׁב עַל הַמִּטָּה
  choice: మంచం మీద కూర్చున్నాడు
  rationale: ישב యొక్క ప్రాథమిక అర్థాన్నీ, מִטָּה యొక్క సాధారణ అర్థాన్నీ సహజమైన తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: ఒకే వచనంలో ‘యాకోబు’, ‘ఇశ్రాయేలు’ అనే రెండు పేర్ల వినియోగం
  choice: మూలంలోని పేరు మార్పును యథాతథంగా నిలుపడం
  alternative: శైలీ ఏకరూపత కోసం రెండు చోట్లా ‘యాకోబు’ అని వాడడం
  rationale: ఈ పేరు మార్పుకు సాహిత్య లేదా వేదాంత ప్రాముఖ్యత ఉండవచ్చు. దానిని సమన్వయపరచకుండా మూలంలోని ఉద్వేగాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం. మూలంలో తెలియని సమాచారదాతను కర్తలేని ‘చెప్పారు’ రూపంతో సూచించాం.
