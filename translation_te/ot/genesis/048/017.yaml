  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా అనువదించబడింది. వ్యక్తుల పేర్లకు సాధారణ తెలుగు బైబిలు రూపాలైన ‘ఎఫ్రాయిము’, ‘మనష్షే’, ‘యోసేపు’ ఉపయోగించబడ్డాయి.
