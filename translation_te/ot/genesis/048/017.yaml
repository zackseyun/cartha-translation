source:
  edition: WLC
  text: וַ/יַּ֣רְא יוֹסֵ֗ף כִּי יָשִׁ֨ית אָבִ֧י/ו יַד יְמִינ֛/וֹ עַל רֹ֥אשׁ אֶפְרַ֖יִם וַ/יֵּ֣רַע בְּ/עֵינָ֑י/ו וַ/יִּתְמֹ֣ךְ יַד אָבִ֗י/ו לְ/הָסִ֥יר אֹתָ֛/הּ מֵ/עַ֥ל רֹאשׁ אֶפְרַ֖יִם עַל רֹ֥אשׁ מְנַשֶּֽׁה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/017.yaml
  text: When Joseph saw that his father had placed his right hand on Ephraim’s head[a], it was displeasing in his eyes, and he took hold of his father’s hand to remove it from Ephraim’s head to Manasseh’s head.
translation:
  language: te
  text: తన తండ్రి కుడిచేతిని ఎఫ్రాయిము తలమీద ఉంచాడని యోసేపు చూసినప్పుడు, అది అతనికి నచ్చలేదు.[a] అప్పుడు అతడు తన తండ్రి చేతిని పట్టుకొని, దానిని ఎఫ్రాయిము తలమీదనుండి తీసి మనష్షే తలమీద ఉంచడానికి ప్రయత్నించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “అది అతని కళ్లకు చెడ్డదిగా అనిపించింది.” అంటే, అది అతనికి నచ్చలేదు.
    reason: హీబ్రూ భాషలోని శరీరభాగ నుడికారాన్ని తెలియజేస్తూ, సందర్భంలో ‘చెడు’ అనేది నైతిక దుష్టత్వాన్ని సూచించదని స్పష్టం చేయడం.
lexical_decisions:
- source_word: וַיַּרְא ... כִּי
  choice: '... ఉంచడం యోసేపు చూసినప్పుడు'
  rationale: కథన క్రమంలోని కాలసంబంధాన్ని, యోసేపు చూసిన విషయాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: יָשִׁית
  choice: ఉంచడం
  rationale: చేతిని ఒకరి తలమీద పెట్టే ఆశీర్వాద చర్యను స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: יַד יְמִינוֹ
  choice: తన తండ్రి కుడిచేతిని
  rationale: సందర్భానుసారం కుడిచేయి తండ్రిదేనని స్పష్టం చేస్తూ, ఆశీర్వాద సూచనలో దాని ప్రాముఖ్యతను నిలుపుతుంది.
- source_word: וַיֵּרַע בְּעֵינָיו
  choice: అది అతనికి నచ్చలేదు
  rationale: హీబ్రూ నుడికారంలోని భావాన్ని సహజమైన తెలుగులో ఇస్తుంది; అక్షరార్థ రూపాన్ని పాదటిప్పణిలో సంరక్షించింది.
- source_word: וַיִּתְמֹךְ
  choice: పట్టుకొని
  rationale: తמך అనే క్రియకు ఇక్కడ తండ్రి చేతిని దారి మళ్లించేందుకు పట్టుకోవడం అనే సందర్భోచిత భావం ఉంది; అనవసరంగా బలప్రయోగాన్ని సూచించదు.
- source_word: לְהָסִיר אֹתָהּ מֵעַל ... עַל
  choice: దాన్ని ... తలమీద నుంచి ... తలమీదికి మార్చడానికి ప్రయత్నించాడు
  rationale: చేతిని ఒక తలమీద నుంచి మరొక తలమీదికి తరలించాలన్న ఉద్దేశాన్ని తెలుగులో స్పష్టంగా తెలియజేస్తుంది; తరువాతి వచనంలో యాకోబు నిరాకరించినందున కార్యం పూర్తయిందనే భావం రాకుండా ‘ప్రయత్నించాడు’ అని ఇచ్చింది.
