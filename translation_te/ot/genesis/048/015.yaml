source:
  edition: WLC
  text: וַ/יְבָ֥רֶךְ אֶת יוֹסֵ֖ף וַ/יֹּאמַ֑ר הָֽ/אֱלֹהִ֡ים אֲשֶׁר֩ הִתְהַלְּכ֨וּ אֲבֹתַ֤/י לְ/פָנָי/ו֙ אַבְרָהָ֣ם וְ/יִצְחָ֔ק הָֽ/אֱלֹהִים֙ הָ/רֹעֶ֣ה אֹתִ֔/י מֵ/עוֹדִ֖/י עַד הַ/יּ֥וֹם הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/015.yaml
  text: And he blessed Joseph and said[a], “The God before whom my fathers Abraham and Isaac walked[b], the God who has shepherded me from my beginning to this day,”
translation:
  language: te
  text: 'అతడు యోసేపును ఆశీర్వదించి ఇలా అన్నాడు:


    “నా పితరులైన అబ్రాహాము, ఇస్సాకు ఎవరి సన్నిధిలో నడిచారో ఆ దేవుడు,


    నా జీవితం ఆరంభమైనప్పటి నుంచి[b] ఈ రోజు వరకు నన్ను కాపరివలె కాస్తూ వచ్చిన[a] దేవుడు,”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నాకు కాపరిగా ఉన్న” లేదా “నన్ను పోషిస్తూ వచ్చిన.” హీబ్రూ క్రియ కాపరి నిరంతరం చూపే సంరక్షణ, మార్గదర్శకత్వం, పోషణ అనే చిత్రాన్ని కలిగి ఉంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా “నా జీవితమంతా.” హీబ్రూ పదబంధం యాకోబు జీవితపు అత్యారంభం నుంచే దేవుడు అతణ్ణి సంరక్షించాడని నొక్కిచెబుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבָרֶךְ אֶת יוֹסֵף
  choice: అతడు యోసేపును ఆశీర్వదిస్తూ
  rationale: హీబ్రూ వాక్యంలో ఆశీర్వాదం పొందినవాడిగా యోసేపే స్పష్టంగా ఉన్నాడు; సందర్భాన్ని బట్టి అతని కుమారులుగా మార్చకుండా మూలపాఠాన్ని నిలిపింది. తరువాతి וַיֹּאמַר‌తో సహజంగా అనుసంధానించేందుకు ‘ఆశీర్వదిస్తూ ఇలా అన్నాడు’ అని ఇచ్చింది.
- source_word: הָאֱלֹהִים
  choice: ఆ దేవుడు
  rationale: నిర్దిష్ట ఉపపదంతో ఉన్న దైవనామాన్ని, పితరులతోనూ యాకోబుతోనూ ఆయనకున్న సంబంధం ద్వారా గుర్తించే గంభీర ఆహ్వానంగా అనువదించింది.
- source_word: אֲשֶׁר הִתְהַלְּכוּ אֲבֹתַי לְפָנָיו
  choice: నా పితరులైన ... ఎవరి సన్నిధిలో నడిచారో
  rationale: దేవుని సమక్షంలో తమ జీవితం గడపడం అనే సంబంధాత్మక, నిబంధనాత్మక నడక రూపకాన్ని వ్యాఖ్యానించి కేవలం ‘విధేయులయ్యారు’గా కుదించకుండా నిలిపింది.
- source_word: אַבְרָהָם וְיִצְחָק
  choice: అబ్రాహాము, ఇస్సాకు
  rationale: ఆధునిక ప్రామాణిక తెలుగు బైబిలు వాడుకలో సుపరిచితమైన పేర్ల రూపాలు.
- source_word: הָרֹעֶה אֹתִי
  choice: నన్ను కాపరిగా కాస్తూ వచ్చిన
  rationale: רעה లోని కాపరి రూపకాన్నీ, కొనసాగుతున్న సంరక్షణ భావాన్నీ నిలిపింది; కేవలం ‘పోషించిన’ అని భావాన్ని పలుచన చేయలేదు.
- source_word: מֵעוֹדִי
  choice: నా జీవితం ఆరంభమైనప్పటి నుంచి
  rationale: యాకోబు ఉనికి లేదా జీవితపు తొలిదశ నుంచే అనే విస్తృత భావాన్ని తెలుపుతుంది; దానిని ‘యౌవనం నుంచి’ లేదా ఒక నిర్దిష్ట జననక్షణానికి పరిమితం చేయదు.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: ఈ రోజు వరకు
  rationale: ఆరంభం నుంచి ప్రస్తుత క్షణం వరకూ కొనసాగిన దైవ సంరక్షణను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: దేవుని సన్నిధిలో నడవడం అనే పితరుల రూపకం
  choice: ఎవరి సన్నిధిలో నడిచారో
  alternative: ఎవరి సమక్షంలో జీవించారో; ఎవరిని అనుసరించారో
  rationale: ‘నడవడం’ అనే మూలరూపకం దేవునితో సంబంధం, ఆయన దృష్టిలో జీవించడం, విశ్వాసపూర్వక ప్రవర్తన వంటి పరస్పర సంబంధిత భావాలకు చోటిస్తుంది; దానిని విధేయత అనే ఒక్క భావానికి పరిమితం చేయదు.
- issue: దేవుని కాపరి రూపకం
  choice: నన్ను కాపరిగా కాస్తూ వచ్చిన దేవుడు
  alternative: నాకు కాపరిగా ఉన్న దేవుడు; నన్ను పోషించిన దేవుడు
  rationale: హీబ్రూ క్రియలోని క్రియాశీల కాపరి రూపకాన్నీ, గతం నుంచి వర్తమానం వరకు కొనసాగిన శ్రద్ధనూ నిలిపింది; ఒక ప్రత్యేక సిద్ధాంతార్థాన్ని జోడించలేదు.
- issue: מֵעוֹדִי సూచించే కాలారంభం
  choice: నా జీవితం ఆరంభమైనప్పటి నుంచి
  alternative: నా పుట్టుక నుంచి; నా జీవితమంతా
  rationale: ఈ పదబంధం జీవితపు లేదా ఉనికి యొక్క ఆరంభాన్ని సూచించే విస్తృతతను కాపాడుతుంది; మూలం నిర్దిష్టంగా చెప్పనిదాన్ని ‘పుట్టుక’గా కుదించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గంభీరంగా రూపొందించబడింది. ‘సన్నిధిలో నడిచారు’ మరియు ‘కాపరిగా కాస్తూ వచ్చిన’ అనే బైబిలీయ రూపకాలు సాధారణ పాఠకుడికి అర్థమయ్యేలా నిలిపబడ్డాయి. ఈ వాక్యం తరువాతి వచనంలో కొనసాగే ఆశీర్వాద ఆహ్వానం కాబట్టి చివరలో ముగింపు సూచించే పూర్ణవిరామం కాకుండా కామా ఉంచబడింది.
