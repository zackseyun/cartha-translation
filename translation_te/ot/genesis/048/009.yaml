id: GEN.48.9
reference: Genesis 48:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יוֹסֵף֙ אֶל אָבִ֔י/ו בָּנַ֣/י הֵ֔ם אֲשֶׁר נָֽתַן לִ֥/י אֱלֹהִ֖ים בָּ/זֶ֑ה וַ/יֹּאמַ֕ר קָֽחֶ/ם נָ֥א אֵלַ֖/י וַ/אֲבָרֲכֵֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/009.yaml
  text: And Joseph said to his father[a], “They are my sons, whom God has given me here.” And he said, “Please bring them to me[b], and I will bless them.”
translation:
  language: te
  text: యోసేపు తన తండ్రితో, “వీరు నా కుమారులు; దేవుడు నాకు ఇక్కడ ఇచ్చినవారు[a]” అని చెప్పాడు. అప్పుడు అతని తండ్రి, “దయచేసి వారిని నా దగ్గరకు తీసుకురా; నేను వారిని ఆశీర్వదిస్తాను[b]” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఈ స్థలంలో నాకు ఇచ్చినవారు.” హీబ్రూ ప్రయోగం యోసేపు అప్పటికి ఉన్న ప్రదేశాన్ని మరింత నిర్దిష్టంగా సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా “నేను వారిని ఆశీర్వదించడానికి వారిని నా దగ్గరకు తీసుకురా, దయచేసి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אָבִיו
  choice: తన తండ్రితో
  rationale: తెలుగులో కర్త యోసేపు అని స్పష్టంగా ఉన్నందున ‘తన తండ్రితో’ సహజంగా ఉండి మూలంలోని బంధాన్ని కచ్చితంగా తెలియజేస్తుంది.
- source_word: בָּנַי הֵם
  choice: వీరు నా కుమారులు
  rationale: సమక్షంలో ఉన్న ఇద్దరిని గుర్తిస్తూ చెప్పే సందర్భంలో ‘వీరు’ సహజమైన సూచన; ‘కుమారులు’ అనే పదం పుంలింగ బహువచనాన్ని నిలుపుతుంది.
- source_word: אֲשֶׁר נָתַן לִי אֱלֹהִים
  choice: దేవుడు నాకు ... అనుగ్రహించినవారు
  rationale: נתן ప్రాథమికంగా ‘ఇచ్చాడు’ అయినా, దేవుడు కుమారులను ఇచ్చిన సందర్భంలో ‘అనుగ్రహించాడు’ సహజమైన, గౌరవప్రదమైన తెలుగు; దైవిక బహుమతి భావాన్ని అతిశయించకుండా వ్యక్తపరుస్తుంది.
- source_word: בָּזֶה
  choice: ఇక్కడ
  rationale: ఈ సూచనాత్మక పదబంధం యోసేపు ఉన్న ప్రదేశాన్ని, సందర్భానుసారం ఐగుప్తును, సూచించగలదు. ‘ఇక్కడ’ దాని సహజ తెలుగు సమానం; ప్రత్యామ్నాయ అర్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: קָחֶם נָא אֵלַי
  choice: దయచేసి వారిని నా దగ్గరికి తీసుకురా
  rationale: לקח సాధారణంగా ‘తీసుకో’ అయినా, వారిని యాకోబు దగ్గరకు చేర్చాలనే సందర్భార్థానికి ‘తీసుకురా’ సహజం. נא లోని మర్యాదపూర్వక అభ్యర్థనను ‘దయచేసి’ తెలియజేస్తుంది.
- source_word: וַאֲבָרֲכֵם
  choice: నేను వారిని ఆశీర్వదిస్తాను
  rationale: అభ్యర్థన తరువాత వచ్చే ఉద్దేశ్య/సంకల్ప భావాన్ని సహజ తెలుగులో భవిష్యత్ రూపంతో వ్యక్తం చేసింది; ‘నేను వారిని ఆశీర్వదించేందుకు’ అనే ప్రత్యామ్నాయాన్ని పాదసూచికలో సూచించాం.
theological_decisions:
- issue: אֱלֹהִים పదం ఎవరిని సూచిస్తుంది
  choice: దేవుడు
  alternative: ఒక దేవుడు / దేవతలు
  rationale: పితరుల కథనం మరియు యోసేపు మాటల తక్షణ సందర్భంలో ఈ పదం ఇశ్రాయేలు దేవుణ్ణే ఏకవచనంగా సూచిస్తుంది.
- issue: కుమారులు దేవుని వరమనే వాక్య భావం
  choice: దేవుడు నాకు అనుగ్రహించినవారు
  alternative: దేవుడు నాకు ఇచ్చినవారు
  rationale: మూలంలోని נתן అర్థాన్ని నిలుపుతూ, పిల్లలు దేవుని ప్రసాదమని యోసేపు చెప్పే భావాన్ని సహజమైన గౌరవప్రద తెలుగులో అందిస్తుంది; అదనపు సిద్ధాంతాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన కథన శైలి వాడబడింది. సంభాషణలో మర్యాదను ‘దయచేసి’తో, కుటుంబ సంబంధాన్ని ‘తండ్రి/కుమారులు’తో స్పష్టంగా ఉంచాం. మూలంలోని సూచనాత్మక మరియు ఉద్దేశ్య సంబంధిత స్వల్ప అస్పష్టతలను పాదసూచికల్లో సంరక్షించాం.
