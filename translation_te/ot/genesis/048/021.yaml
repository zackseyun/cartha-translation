reference: Genesis 48:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יִשְׂרָאֵל֙ אֶל יוֹסֵ֔ף הִנֵּ֥ה אָנֹכִ֖י מֵ֑ת וְ/הָיָ֤ה אֱלֹהִים֙ עִמָּ/כֶ֔ם וְ/הֵשִׁ֣יב אֶתְ/כֶ֔ם אֶל אֶ֖רֶץ אֲבֹתֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/021.yaml
  text: Then Israel said to Joseph[a], “Behold, I am about to die[b], but God will be with you and will bring you back to the land of your fathers.”
translation:
  language: te
  text: 'అప్పుడు ఇశ్రాయేలు యోసేపుతో ఇలా అన్నాడు: “ఇదిగో, నేను చనిపోబోతున్నాను. కానీ[a] దేవుడు మీతో ఉంటాడు, మిమ్మల్ని మీ పితరుల దేశానికి తిరిగి తీసుకువస్తాడు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మరియు.” హీబ్రూ సంధిపదం సాధారణంగా “మరియు” అని అర్థమిస్తుంది; ఇక్కడ ఇశ్రాయేలు చనిపోబోతున్నప్పటికీ దేవుడు వారితో ఉంటాడనే వ్యత్యాసాన్ని అది సూచించే అవకాశం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... అన్నాడు
  rationale: వావ్-క్రమబద్ధ రూపం కథనాన్ని ముందుకు నడిపిస్తుంది; ‘అప్పుడు’ ఆధునిక తెలుగులో దాని క్రమార్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: יִשְׂרָאֵל
  choice: ఇశ్రాయేలు
  rationale: మూలపాఠం ‘యాకోబు’కు బదులు ఒడంబడిక పేరైన ‘ఇశ్రాయేలు’ను వాడుతుంది; అదే పేరును నిలిపాం.
- source_word: הִנֵּה
  choice: ఇదిగో
  rationale: శ్రద్ధను ఆకర్షించే హీబ్రూ సంభాషణా సూచికకు సహజమైన, గౌరవప్రదమైన తెలుగు సమానం.
- source_word: אָנֹכִי מֵת
  choice: నేను చనిపోబోతున్నాను
  rationale: ఇక్కడ కృదంత ప్రయోగం పూర్తయిన మరణాన్ని కాక సమీపిస్తున్న మరణాన్ని సూచిస్తుంది.
- source_word: וְהָיָה אֱלֹהִים עִמָּכֶם
  choice: కానీ దేవుడు మీతో ఉంటాడు
  rationale: వావ్ అక్షరార్థంగా ‘మరియు’; సందర్భంలో ఇశ్రాయేలు మరణానికి, దేవుని కొనసాగుతున్న సన్నిధికి మధ్య వ్యత్యాసం ఉంది. ఆ మూలపాఠ్య రూపాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: עִמָּכֶם
  choice: మీతో
  rationale: హీబ్రూ ప్రత్యయం బహువచనం. తెలుగు ‘మీతో’ కూడా బహువచనాన్ని స్పష్టంగా చూపిస్తుంది.
- source_word: וְהֵשִׁיב אֶתְכֶם
  choice: మిమ్మల్ని ... తిరిగి తీసుకువస్తాడు
  rationale: హిఫీల్ రూపంలోని కారక భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; ‘మిమ్మల్ని’ మూలంలోని బహువచనాన్ని కాపాడుతుంది.
- source_word: אֶל אֶרֶץ אֲבֹתֵיכֶם
  choice: మీ పితరుల దేశానికి
  rationale: పితరులకు సంబంధించిన పూర్వీకుల దేశాన్ని సూచించే మూలపదబంధానికి సన్నిహితమైన, బైబిలు సందర్భంలో సుపరిచితమైన తెలుగు రూపం.
theological_decisions:
- issue: యోసేపును ఉద్దేశించిన మాటల్లో బహువచన సర్వనామాల సూచన
  choice: ‘మీతో’, ‘మిమ్మల్ని’ అనే బహువచన రూపాలను నిలిపాం.
  alternative: యోసేపు ఒక్కడినే ఉద్దేశించినట్లు ఏకవచన గౌరవార్థక రూపాలుగా అర్థం చేసుకోవడం.
  rationale: రెండు హీబ్రూ ప్రత్యయాలూ బహువచనంలో ఉన్నాయి; అందువల్ల వాగ్దానం యోసేపుతోపాటు అతని కుటుంబం లేదా సంతతిని కూడా ఆవరించగల మూలపాఠ్య విస్తృతిని అనువాదం కాపాడుతుంది.
- issue: ‘దేవుడు మీతో ఉంటాడు’ ముందు ఉన్న వావ్ సంధి భావం
  choice: సందర్భంలోని వ్యత్యాసాన్ని చూపేందుకు ‘కానీ’ అని అనువదించాం.
  alternative: అక్షరార్థ సంధిగా ‘మరియు’ లేదా ‘అలాగే’ అని అనువదించడం.
  rationale: ఇశ్రాయేలు మరణించబోతున్నప్పటికీ దేవుడు వారితో కొనసాగి ఉంటాడనే సందర్భార్థ వ్యత్యాసం ఉంది; అయితే హీబ్రూ సంధి సరళంగా ‘మరియు’ అని కూడా రావచ్చని పాదటిప్పణి తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన వాక్యనిర్మాణం వాడాం. ‘ఇదిగో’, ‘పితరులు’ వంటి పదాలు బైబిలు గంభీరతను నిలుపుతాయి; బహువచన సూచనను తెలుగులో ప్రత్యక్షంగా ఉంచాం.
