- from: వారి తరువాత నీకు పుట్టే సంతానం నీదిగానే ఉంటుంది.[a] తమ స్వాస్థ్యంలో వారు తమ సహోదరుల పేరుతో పిలువబడతారు.[b]
  to: వారి తరువాత నీకు పుట్టిన సంతానం నీ వారిగా ఉంటారు.[a] తమ స్వాస్థ్యంలో వారు తమ సహోదరుల పేరున పిలువబడతారు.[b]
