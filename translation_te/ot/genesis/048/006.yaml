source:
  edition: WLC
  text: וּ/מוֹלַדְתְּ/ךָ֛ אֲשֶׁר הוֹלַ֥דְתָּ אַחֲרֵי/הֶ֖ם לְ/ךָ֣ יִהְי֑וּ עַ֣ל שֵׁ֧ם אֲחֵי/הֶ֛ם יִקָּרְא֖וּ בְּ/נַחֲלָתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/006.yaml
  text: But your offspring whom you father after them will be yours[b][a]; they will be called by the name of their brothers in their inheritance.
translation:
  language: te
  text: వారి తరువాత నీకు పుట్టిన సంతానం నీ వారిగా ఉంటారు.[a] తమ స్వాస్థ్యంలో వారు తమ సహోదరుల పేరున పిలువబడతారు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అంటే, వారికి ప్రత్యేక గోత్ర స్వాస్థ్యాలు లభించవు; వారు ఎఫ్రాయిము, మనష్షే గోత్రాల కింద లెక్కించబడతారు.
    reason: cross_reference
  - marker: b
    text: లేదా, ‘తమ స్వాస్థ్యములో తమ సహోదరుల పేరున లెక్కించబడతారు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמוֹלַדְתְּךָ
  choice: నీకు పుట్టే సంతానం
  rationale: ఈ నామవాచకం ఒకరికి పుట్టినవారిని సూచిస్తుంది. సందర్భంలో యోసేపుకు తరువాత పుట్టే పిల్లలను ఉద్దేశించినప్పటికీ, ‘సంతానం’ మూలంలోని విస్తృతతను సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: הוֹלַדְתָּ
  choice: నీకు పుట్టే
  rationale: హిఫీల్ రూపం యోసేపును ఉద్దేశించి కనడం/కనించడం అనే పితృసంబంధ భావాన్ని ఇస్తుంది. తెలుగులో ‘నీకు పుట్టే’ సహజంగా ఉండి అదే భావాన్ని తెలియజేస్తుంది.
- source_word: אַחֲרֵיהֶם
  choice: వారి తరువాత
  rationale: ‘వారు’ అనేది ముందటి వచనంలోని ఎఫ్రాయిము, మనష్షేలను సూచిస్తుంది; కాలక్రమ భావాన్ని నేరుగా నిలుపుతుంది.
- source_word: לְךָ יִהְיוּ
  choice: నీదిగానే ఉంటుంది
  rationale: ఎఫ్రాయిము, మనష్షేలు యాకోబువారిగా లెక్కించబడటానికి భిన్నంగా, తరువాతి సంతానం యోసేపువారిగానే ఉంటారని తెలిపే కుటుంబ-న్యాయ సంబంధాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: עַל שֵׁם אֲחֵיהֶם
  choice: తమ సహోదరుల పేరుతో
  rationale: తరువాతి సంతానం ఎఫ్రాయిము లేదా మనష్షే గోత్రనామం కింద లెక్కించబడుతుందనే భావాన్ని తెలియజేస్తూ, ‘పేరు’ అనే మూలపదాన్ని నిలుపుతుంది.
- source_word: אֲחֵיהֶם
  choice: తమ సహోదరుల
  rationale: హీబ్రూ పదానికి నేరమైన కుటుంబసంబంధ అర్థాన్ని నిలుపుతుంది; అది ఎఫ్రాయిము, మనష్షేలను సూచిస్తుందని సందర్భం తెలియజేస్తుంది.
- source_word: יִקָּרְאוּ
  choice: పిలువబడతారు
  rationale: కרא నిఫాల్ రూపంలోని ‘పిలువబడటం/పేరు పొందటం’ అనే ప్రాథమిక భావాన్ని నిలుపుతుంది; స్వాస్థ్య సందర్భంలో ఒక పేరుకింద లెక్కించబడే భావమూ ఇందులో ఉంది.
- source_word: בְּנַחֲלָתָם
  choice: తమ స్వాస్థ్యంలో
  rationale: נַחֲלָה వారసత్వంగా లభించే భూభాగం లేదా వాటాను సూచిస్తుంది. ‘స్వాస్థ్యం’ బైబిలు సందర్భానికి తగిన, గౌరవప్రదమైన ఆధునిక తెలుగు పదం.
