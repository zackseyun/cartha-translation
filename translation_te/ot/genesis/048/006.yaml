translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. ‘సహోదరులు’, ‘స్వాస్థ్యం’ వంటి పదాలు కుటుంబ మరియు గోత్ర వారసత్వ సందర్భాన్ని స్పష్టంగా ఉంచుతాయి. మూలంలోని పేరు పెట్టడం మరియు ఒక గోత్రం కింద లెక్కించడం మధ్య ఉన్న భావసాంద్రతను ప్రధాన పాఠం, ప్రత్యామ్నాయ పాదటిప్పణి ద్వారా సంరక్షించాం.
