  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/אֲנִ֞י נָתַ֧תִּֽי לְ/ךָ֛ שְׁכֶ֥ם אַחַ֖ד עַל אַחֶ֑י/ךָ אֲשֶׁ֤ר לָקַ֨חְתִּי֙ מִ/יַּ֣ד הָֽ/אֱמֹרִ֔י בְּ/חַרְבִּ֖/י וּ/בְ/קַשְׁתִּֽ/י־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/022.yaml
  text: And I give you one portion above your brothers[a], which I took from the hand of the Amorite with my sword and with my bow.
translation:
  language: te
  text: నేనైతే నీ సహోదరులకు మించి ఒక భాగాన్ని నీకు ఇస్తున్నాను[a]. ఆ భాగాన్ని నేను నా ఖడ్గంతో, నా విల్లుతో అమోరీయుని చేతిలోనుండి తీసుకున్నాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “భాగం” అని అనువదించిన హీబ్రూ పదం שְׁכֶם (షెకెమ్)కు “భుజం,” “కొండవాలు” అనే అర్థాలు కూడా ఉన్నాయి; అది షెకెము అనే స్థలనామాన్ని కూడా ప్రతిధ్వనింపజేయవచ్చు. అందువల్ల ఈ మాట యోసేపుకు ఇచ్చిన అదనపు వాటాన్నీ, తరువాత అతనితో సంబంధం కలిగిన షెకెము ప్రాంతాన్నీ ఒకేసారి సూచిస్తుండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: నేనైతే
  rationale: క్రియలోనే కర్త ఉన్నప్పటికీ స్వతంత్ర సర్వనామం వాడబడినందున ఉన్న ఉద్ఘాటనను సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: נָתַתִּי
  choice: ఇస్తున్నాను
  rationale: రూపపరంగా సంపూర్ణ క్రియ అయినా, యాకోబు చేస్తున్న అధికారిక వారసత్వ ప్రదానంలో వర్తమాన కార్యనిర్వాహక ప్రకటనగా గ్రహించవచ్చు.
- source_word: שְׁכֶם אַחַד
  choice: ఒక భాగం ఎక్కువగా
  rationale: సందర్భంలో యోసేపుకు సహోదరులకంటే అదనపు వారసత్వ వాటా ఇవ్వడమే ప్రధాన భావం. שְׁכֶם పదంలోని భుజం/కొండవాలు అనే అర్థాన్నీ, షెకెము స్థలనామంతో ఉండగల పదప్రయోగాన్నీ పాదసూచికలో నిలుపుతున్నాం.
- source_word: עַל אַחֶיךָ
  choice: నీ సహోదరులకంటే ... ఎక్కువగా
  rationale: עַל ఇక్కడ ఆధిక్యం లేదా అదనాన్ని సూచిస్తుంది; తెలుగు వాక్యంలో పోలికను స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אֲשֶׁר לָקַחְתִּי
  choice: దానిని నేను ... తీసుకున్నాను
  rationale: సాపేక్ష ఉపవాక్యాన్ని తెలుగులో సహజమైన ప్రత్యేక వాక్యంగా మార్చి, לקח యొక్క నేరమైన భావాన్ని కాపాడుతుంది.
- source_word: מִיַּד הָאֱמֹרִי
  choice: అమోరీయుని చేతిలోనుండి
  rationale: హీబ్రూ ఏకవచనాన్ని, అలాగే అధికారం లేదా స్వాధీనం నుండి తీసుకోవడం అనే 'చేతిలోనుండి' నుడికారాన్ని నిలుపుతుంది.
- source_word: בְּחַרְבִּי וּבְקַשְׁתִּי
  choice: నా ఖడ్గంతో, నా విల్లుతో
  rationale: రెండు ఆయుధాల యుద్ధ చిత్రణను, రెండింటితోనూ ఉన్న సాధనార్థక సంబంధాన్ని ప్రత్యక్షంగా నిలుపుతుంది.
theological_decisions:
- issue: שְׁכֶם పదం అదనపు భాగాన్ని సూచిస్తుందా, కొండవాలు/భుజాన్ని సూచిస్తుందా, లేక షెకెము స్థలనామాన్ని ప్రతిధ్వనింపజేస్తుందా?
  choice: ప్రధాన పాఠ్యంలో ‘ఒక భాగం ఎక్కువగా’ అని అనువదించి, పదంలోని ఇతర సాధ్యార్థాలను పాదసూచికలో ఉంచడం.
  alternative: ‘ఒక కొండవాలు’, లేదా ‘షెకెము—ఒక భాగం’ అని అనువదించడం.
  rationale: వారసత్వ సందర్భంలో అదనపు వాటా ప్రధాన భావంగా సరిపోతుంది; అయితే యోసేపుతో తరువాత అనుసంధానమైన షెకెము స్థలానికీ, పదపు భౌగోళిక అర్థానికీ ఉండగల ఉద్దేశపూర్వక ప్రతిధ్వనిని తొలగించకుండా పాదసూచిక తెలియజేస్తుంది.
- issue: యాకోబు ఖడ్గం, విల్లు గురించిన మాటను అక్షరార్థ చారిత్రక యుద్ధంగా నిర్ణయించాలా?
  choice: యుద్ధాయుధాల భాషను యథాతథంగా అనువదించి, దాని చారిత్రక లేదా అలంకారిక స్వభావాన్ని నిర్ణయించకుండా ఉంచడం.
  alternative: దీనిని వంశస్థుల భవిష్య కార్యానికి లేదా దైవ సహాయానికి రూపకంగా వివరించడం.
  rationale: మూలపాఠ్యం ‘నా ఖడ్గంతో, నా విల్లుతో’ అని స్పష్టంగా చెబుతుంది; అనువాదం పాఠ్యానికి మించిన సిద్ధాంతపరమైన పరిష్కారాన్ని చేర్చకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘నేనైతే’ మూలంలోని ఉద్ఘాటనను చూపుతుంది; ‘సహోదరులు’, ‘ఖడ్గం’, ‘అమోరీయుడు’ వంటి పదాలు బైబిలు సందర్భానికి తగిన గంభీరతను నిలుపుతూ సాధారణ పాఠకునికి అర్థమయ్యేలా ఉన్నాయి.
