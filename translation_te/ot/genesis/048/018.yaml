revisions:
- from: అప్పుడు యోసేపు తన తండ్రితో, “అలా కాదు, నాన్నా! ఇతడే మొదట పుట్టినవాడు. ఇతని తల మీద నీ కుడిచెయ్యి ఉంచు” అన్నాడు.
  to: 'అప్పుడు యోసేపు తన తండ్రితో ఇలా అన్నాడు: “అలా కాదు, నా తండ్రీ; ఎందుకంటే ఇతడే మొదట పుట్టినవాడు. ఇతని తలపై నీ కుడిచేయి ఉంచు.”'
  rationale: The revision retains the draft’s clear deictic wording and its transparent rendering of ‘firstborn,’ while explicitly restoring the explanatory force of כִּי and the possessive-respectful address אָבִי. No footnote is needed, since the Hebrew wording is straightforward and the translation does not resolve a disputed ambiguity.
  reviewer_model: gpt-5.6-terra
