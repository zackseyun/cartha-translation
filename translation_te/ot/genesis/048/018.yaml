id: GEN.48.18
reference: Genesis 48:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֧אמֶר יוֹסֵ֛ף אֶל אָבִ֖י/ו לֹא כֵ֣ן אָבִ֑/י כִּי זֶ֣ה הַ/בְּכֹ֔ר שִׂ֥ים יְמִינְ/ךָ֖ עַל רֹאשֽׁ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/018.yaml
  text: And Joseph said to his father, “Not so, my father, for this one is the firstborn. Put your right hand on his head.”
translation:
  language: te
  text: 'అప్పుడు యోసేపు తన తండ్రితో ఇలా అన్నాడు: “అలా కాదు, నా తండ్రీ; ఎందుకంటే ఇతడే మొదట పుట్టినవాడు. ఇతని తలపై నీ కుడిచేయి ఉంచు.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... అన్నాడు
  rationale: వావ్-కన్సిక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది; ఆధునిక తెలుగు కథనంలో ‘అప్పుడు ... అన్నాడు’ సహజంగా ఉంటుంది.
- source_word: אֶל אָבִיו
  choice: తన తండ్రితో
  rationale: אֶל దిశను సూచించినా, ‘చెప్పు’ అనే తెలుగు ప్రయోగంతో ‘తో’ సహజం; ప్రతిఫలక ‘తన’ యోసేపు తండ్రినే స్పష్టంగా సూచిస్తుంది.
- source_word: לֹא כֵן
  choice: అలా కాదు
  rationale: సరిదిద్దే లేదా అభ్యంతరం తెలిపే ఈ హీబ్రూ నుడికారానికి ఇది సహజమైన, నేరుగా ఉన్న తెలుగు రూపం.
- source_word: אָבִי
  choice: నాన్నా
  rationale: మొదటి పురుష ఏకవచన సంబంధాన్ని, కుమారుడు తండ్రిని గౌరవంగా నేరుగా సంబోధించే స్వరాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: כִּי
  choice: (ప్రత్యేక అనుసంధాన పదం లేకుండా)
  rationale: ఇక్కడ כִּי కారణ వివరణను పరిచయం చేస్తుంది. ‘ఇతడే’తో మొదలయ్యే తరువాతి వాక్యం తెలుగులో అదే వివరణాత్మక సంబంధాన్ని సహజంగా తెలియజేస్తుంది; ‘ఎందుకంటే’ చేరిస్తే మాట కొంత భారంగా ఉంటుంది.
- source_word: זֶה
  choice: ఇతడే
  rationale: భౌతికంగా చూపబడుతున్న కుమారుణ్ణి సూచించే దైక్తిక బలాన్ని ‘ఇతడు’ నిలుపుతుంది; ‘ఏ’ ఉద్ఘాటన సందర్భానుసారమైన వ్యత్యాసాన్ని తెలియజేస్తుంది.
- source_word: הַבְּכֹר
  choice: మొదట పుట్టినవాడు
  rationale: జనన క్రమంతో పాటు కుటుంబ స్థితిని స్పష్టంగా, సాధారణ ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: שִׂים
  choice: ఉంచు
  rationale: ఆజ్ఞార్థక రూపాన్ని నేరుగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: יְמִינְךָ
  choice: నీ కుడిచెయ్యి
  rationale: ‘కుడి’ అనేది వైపు మాత్రమే కాక చెయ్యిని సూచిస్తోందని స్పష్టపరుస్తుంది; రెండవ పురుష సంబంధాన్ని ‘నీ’ నిలుపుతుంది.
- source_word: עַל רֹאשׁוֹ
  choice: ఇతని తల మీద
  rationale: ఆశీర్వాద సందర్భంలోని చేతి ఉంచే చర్యను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; సర్వనామ సూచనను స్పష్టంగా ఉంచుతుంది.
theological_decisions:
- issue: ఆశీర్వాద సందర్భంలోని జ్యేష్ఠత్వ స్థితి పదం
  choice: మొదట పుట్టినవాడు
  alternative: పెద్దవాడు / జ్యేష్ఠుడు
  rationale: בכור కేవలం వయస్సులో పెద్దవాడని కాక జనన క్రమం మరియు దానితో ముడిపడిన కుటుంబ స్థితిని సూచిస్తుంది. ‘మొదట పుట్టినవాడు’ ఆ భావాన్ని పారదర్శకంగా నిలుపుతుంది; ‘పెద్దవాడు’ వయస్సుకే పరిమితం కావచ్చు, ‘జ్యేష్ఠుడు’ సాధారణ పాఠకులకు కొంత గ్రాంథికం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కుటుంబ సంభాషణకు తగిన సహజత్వంతో కూడిన గౌరవభరిత కథన శైలి. ‘నాన్నా’ అనేది ఆప్యాయతతో కూడిన గౌరవ సంబోధన; వాక్య నిర్మాణం మూలంలోని నేరుతనాన్ని నిలుపుతుంది.
