id: GEN.48.13
reference: Genesis 48:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּקַּ֣ח יוֹסֵף֮ אֶת שְׁנֵי/הֶם֒ אֶת אֶפְרַ֤יִם בִּֽ/ימִינ/וֹ֙ מִ/שְּׂמֹ֣אל יִשְׂרָאֵ֔ל וְ/אֶת מְנַשֶּׁ֥ה בִ/שְׂמֹאל֖/וֹ מִ/ימִ֣ין יִשְׂרָאֵ֑ל וַ/יַּגֵּ֖שׁ אֵלָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/013.yaml
  text: And Joseph took the two of them—Ephraim in his right hand, at Israel’s left, and Manasseh in his left hand, at Israel’s right—and brought them near to him.
translation:
  language: te
  text: యోసేపు వారిద్దరినీ తీసుకున్నాడు—ఎఫ్రాయిమును తన కుడిచేతిలో పట్టుకొని ఇశ్రాయేలు ఎడమవైపున, మనష్షేను తన ఎడమచేతిలో పట్టుకొని ఇశ్రాయేలు కుడివైపున ఉంచి—వారిని ఇశ్రాయేలు దగ్గరికి తీసుకొచ్చాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקַּח
  choice: తీసుకున్నాడు
  rationale: హీబ్రూ క్రియ యొక్క సాధారణ అర్థాన్ని సహజమైన ఆధునిక తెలుగులో ప్రతిబింబిస్తుంది.
- source_word: מִשְּׂמֹאל יִשְׂרָאֵל / מִימִין יִשְׂרָאֵל
  choice: ఇశ్రాయేలు ఎడమవైపున / ఇశ్రాయేలు కుడివైపున
  rationale: מִן రూపం ఇక్కడ స్థానం లేదా అమరికను సూచిస్తోంది; సందర్భానికి అనుగుణంగా ‘వైపున’ అనేది సహజంగా ఉంటుంది, దిశాత్మకమైన ‘నుండి’ అనే అపార్థాన్ని నివారిస్తుంది.
- source_word: וַיַּגֵּשׁ אֵלָיו
  choice: వారిని అతని దగ్గరికి తీసుకొచ్చాడు
  rationale: హిఫీల్ రూపంలోని ‘దగ్గరకు చేర్చడం’ అనే కారణార్థాన్ని స్పష్టమైన తెలుగులో అందిస్తుంది; ‘అతని’ అనేది సందర్భంలో ఇశ్రాయేలును సూచిస్తుంది.
theological_decisions:
- issue: ఎఫ్రాయిము, మనష్షేల అమరిక మరియు తరువాతి ఆశీర్వాదంలో చేతుల మార్పు
  choice: యోసేపు దృష్టిలో ఎఫ్రాయిమును తన కుడిచేతితో ఇశ్రాయేలు ఎడమవైపున, మనష్షేను తన ఎడమచేతితో ఇశ్రాయేలు కుడివైపున ఉంచినట్లు ఖచ్చితంగా తెలిపింది.
  alternative: దిశలను ఇశ్రాయేలు దృష్టికోణం నుంచి మాత్రమే సంక్షిప్తంగా చెప్పడం.
  rationale: మూలపాఠంలోని రెండు వ్యక్తుల దృష్టికోణాలను నిలుపుకోవడం వల్ల తరువాతి వచనాల్లో ఇశ్రాయేలు చేతులు అడ్డంగా చాచిన చర్య స్పష్టంగా అర్థమవుతుంది; అదనపు సిద్ధాంతార్థం చేర్చబడలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కుటుంబ కథనానికి తగిన సహజమైన, గౌరవప్రదమైన శైలి. మూలంలోని అమరికను స్పష్టంగా ఉంచుతూ భారమైన పదబంధాలను నివారించింది.
