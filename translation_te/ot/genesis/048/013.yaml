revisions:
- from: యోసేపు వారిద్దరినీ తీసుకున్నాడు—ఎఫ్రాయిమును తన కుడిచేతితో ఇశ్రాయేలు ఎడమవైపున, మనష్షేను తన ఎడమచేతితో ఇశ్రాయేలు కుడివైపున ఉంచి—వారిని అతని దగ్గరికి తీసుకొచ్చాడు.
  to: యోసేపు వారిద్దరినీ తీసుకున్నాడు—ఎఫ్రాయిమును తన కుడిచేతిలో పట్టుకొని ఇశ్రాయేలు ఎడమవైపున, మనష్షేను తన ఎడమచేతిలో పట్టుకొని ఇశ్రాయేలు కుడివైపున ఉంచి—వారిని ఇశ్రాయేలు దగ్గరికి తీసుకొచ్చాడు.
  rationale: The revision removes the added placing nuance as the main connective action and makes explicit that the boys are held in Joseph’s respective hands. “ఇశ్రాయేలు దగ్గరికి” resolves the otherwise potentially unclear pronoun “అతని,” while retaining the Hebrew referent and the deliberate spatial arrangement.
