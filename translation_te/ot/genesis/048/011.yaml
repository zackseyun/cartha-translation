    rationale: హీబ్రూ וְהִנֵּה ఇక్కడ విరోధాన్ని కాక ఆశ్చర్యకరమైన వాస్తవాన్ని సూచిస్తుంది. ‘ఇదిగో’ మాత్రమే ఆ ఉద్ఘాటనను తగినట్లుగా అందిస్తుంది.
