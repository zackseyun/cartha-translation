source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יִשְׂרָאֵל֙ אֶל יוֹסֵ֔ף רְאֹ֥ה פָנֶ֖י/ךָ לֹ֣א פִלָּ֑לְתִּי וְ/הִנֵּ֨ה הֶרְאָ֥ה אֹתִ֛/י אֱלֹהִ֖ים גַּ֥ם אֶת זַרְעֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/011.yaml
  text: And Israel said to Joseph[a], “I did not expect to see your face, and behold, God has let me see even your offspring.”
translation:
  language: te
  text: ఇశ్రాయేలు యోసేపుతో, “నీ ముఖం చూస్తానని నేను అనుకోలేదు; ఇదిగో, దేవుడు నీ సంతానాన్ని కూడా నాకు చూపించాడు” అన్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అన్నాడు
  rationale: హీబ్రూ కథన ప్రవాహాన్ని సహజమైన ఆధునిక తెలుగు వాక్యనిర్మాణంలో తెలియజేస్తుంది.
- source_word: יִשְׂרָאֵל
  choice: ఇశ్రాయేలు
  rationale: మూలపాఠంలో ఉన్న ఒడంబడిక పేరునే నిలుపుతుంది; ‘యాకోబు’గా సమన్వయపరచదు.
- source_word: רְאֹה פָנֶיךָ
  choice: నీ ముఖం చూస్తానని
  rationale: ‘నిన్ను ప్రత్యక్షంగా చూడడం’ అనే హీబ్రూ నుడికార భావంతోపాటు దాని స్పష్టమైన చిత్రాత్మకతను కూడా నిలుపుతుంది.
- source_word: לֹא פִלָּלְתִּי
  choice: నేను అనుకోలేదు
  rationale: ఈ సందర్భంలో క్రియ ప్రార్థనకన్నా ఊహించడం లేదా ఎదురుచూడడం అనే భావాన్ని ఇస్తుంది; తెలుగులో ‘అనుకోలేదు’ సహజంగా ఉంటుంది.
- source_word: וְהִנֵּה
  choice: అయితే ఇదిగో
  rationale: ఆశ్చర్యకరమైన మలుపును, దృష్టిని ఆకర్షించే ఉద్ఘాటనను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: הֶרְאָה אֹתִי
  choice: నాకు చూపించాడు
  rationale: ראה క్రియ యొక్క హిఫీల్ కారణార్థక రూపాన్ని నేరుగా, సహజంగా అందిస్తుంది.
- source_word: אֱלֹהִים
  choice: దేవుడు
  rationale: ఇది సాధారణ దైవ బిరుదు; యెహోవా అనే ప్రత్యేక నామం కాదు.
- source_word: גַּם
  choice: కూడా
  rationale: యోసేపును చూడడానికంటే మించి అతని సంతానాన్నీ చూసిన అదనపు ఆశీర్వాదాన్ని సూచిస్తుంది.
- source_word: זַרְעֶךָ
  choice: నీ సంతానాన్ని
  rationale: זֶרַע యొక్క ఏకవచన సమూహార్థాన్ని నిలుపుతూ, పిల్లలకే పరిమితం చేయకుండా సహజమైన తెలుగు పదాన్ని ఉపయోగిస్తుంది.
theological_decisions:
- issue: పితృపురుషుల కథనంలో אֱלֹהִים అనువాదం
  choice: దేవుడు
  alternative: దైవం
  rationale: మూలంలోని సాధారణ దైవ బిరుదుకు ‘దేవుడు’ ప్రత్యక్షమైన, ప్రామాణికమైన సమానం; వాక్యం దేవుని కృపాపూర్వక ఏర్పాటును మాత్రమే పేర్కొంటుంది, అదనపు సిద్ధాంత వివరణ అవసరం లేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనదిగా, సాధారణ పాఠకులకు సులభంగా ఉండేలా రూపొందించబడింది. హీబ్రూ ‘నీ ముఖం చూడడం’ అనే నుడికారాన్ని దాని భావోద్వేగ స్పష్టత కోసం నిలుపుతూ, తెలుగు వాక్యక్రమాన్ని సహజంగా ఉంచింది.
