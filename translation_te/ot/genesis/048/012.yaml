id: GEN.48.12
reference: Genesis 48:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יּוֹצֵ֥א יוֹסֵ֛ף אֹתָ֖/ם מֵ/עִ֣ם בִּרְכָּ֑י/ו וַ/יִּשְׁתַּ֥חוּ לְ/אַפָּ֖י/ו אָֽרְצָ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/012.yaml
  text: Then Joseph brought them out from between his knees[a], and he bowed with his face to the ground.
translation:
  language: te
  text: అప్పుడు యోసేపు వారిని యాకోబు మోకాళ్ల మధ్యనుండి[a] బయటికి తీసి, ముఖం నేలవైపు ఉంచి నమస్కరించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘యాకోబు మోకాళ్ల దగ్గరనుండి.’ హీబ్రూ ప్రయోగం ఆశీర్వాద సందర్భంలో బాలురు యాకోబుకు అతి దగ్గరగా ఉన్న స్థానాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצֵא
  choice: బయటికి తీసి
  rationale: 'יצא హిఫీల్ రూపంలోని కారణార్థాన్ని నిలుపుతుంది: యోసేపు వారిని వారు ఉన్న స్థానం నుండి బయటికి తీసుకొచ్చాడు.'
- source_word: אֹתָם
  choice: వారిని
  rationale: ఎఫ్రాయిము, మనష్షేలను సూచించే ప్రత్యక్ష కర్మ సర్వనామం.
- source_word: מֵעִם בִּרְכָּיו
  choice: యాకోబు మోకాళ్ల దగ్గరనుండి
  rationale: מֵעִם అనే ప్రయోగం ‘వద్దనుండి/దగ్గరనుండి’ అనే భావాన్ని ఇస్తుంది. ‘అతని’ అనే అస్పష్ట సర్వనామానికి బదులు సందర్భానుసారం యాకోబును స్పష్టంగా పేర్కొనడం సహజమైన తెలుగు; బాలురు మోకాళ్ల మధ్య ఉన్నారా లేక పక్కన ఉన్నారా అన్న అస్పష్టతను ప్రధాన పాఠంలో ‘దగ్గర’ నిలుపుతుంది.
- source_word: וַיִּשְׁתַּחוּ
  choice: వంగి నమస్కరించాడు
  rationale: שׁחה రూపం గౌరవంతో పూర్తిగా వంగడాన్ని సూచిస్తుంది; తరువాతి దిశా పదబంధంతో కలిపి ఈ తెలుగు ప్రయోగం సహజంగా ఆ భంగిమను తెలియజేస్తుంది.
- source_word: לְאַפָּיו אָרְצָה
  choice: నేలవరకు వంగి
  rationale: అక్షరార్థంగా ముఖం నేలవైపు ఉండే సాష్టాంగసదృశ భంగిమ. ‘నేలవరకు వంగి’ అనేది అతిగా వివరణ జోడించకుండా దిశనూ లోతైన వంగడాన్నీ తెలుపుతుంది.
theological_decisions:
- issue: ‘అతని మోకాళ్లు’లో స్వామ్య సూచన ఎవరిని ఉద్దేశిస్తుంది?
  choice: యాకోబు మోకాళ్లు
  alternative: యోసేపు మోకాళ్లు
  rationale: సందర్భంలో యోసేపు తన కుమారులను యాకోబు సమీపం నుండి వెనక్కి తీస్తున్నాడు; అందువల్ల ఏకవచన పుంలింగ ప్రత్యయం సహజంగా యాకోబును సూచిస్తుంది. ఇది సందర్భాధారిత సర్వనామ నిర్ణయం, సిద్ధాంతపరమైనది కాదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘మోకాళ్ల దగ్గరనుండి’ అనే పాఠం హీబ్రూ מֵעִם యొక్క స్థలసంబంధ విస్తృతిని కాపాడుతుంది; ‘మధ్యనుండి’ అనే మరింత నిర్దిష్ట దృశ్యాన్ని పాదటిప్పణిలో ఉంచింది.
