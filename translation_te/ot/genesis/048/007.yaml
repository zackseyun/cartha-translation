translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. పొడవైన హెబ్రీ వాక్యాన్ని తెలుగులో సహజంగా చదవడానికి రెండు వాక్యాలుగా విభజించాం; భావక్రమం మారలేదు. ‘నా దగ్గరే’ అనే ఎంపికతో మూలంలోని స్థలసంబంధ భావాన్ని ప్రధాన పాఠంలో ఉంచి, భావోద్వేగ ఛాయను పాదటిప్పణిలో సంరక్షించాం.
