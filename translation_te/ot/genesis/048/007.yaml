  text: וַ/אֲנִ֣י בְּ/בֹאִ֣/י מִ/פַּדָּ֗ן מֵ֩תָה֩ עָלַ֨/י רָחֵ֜ל בְּ/אֶ֤רֶץ כְּנַ֨עַן֙ בַּ/דֶּ֔רֶךְ בְּ/ע֥וֹד כִּבְרַת אֶ֖רֶץ לָ/בֹ֣א אֶפְרָ֑תָה וָ/אֶקְבְּרֶ֤/הָ שָּׁם֙ בְּ/דֶ֣רֶךְ אֶפְרָ֔ת הִ֖וא בֵּ֥ית לָֽחֶם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/007.yaml
  text: As for me[a], when I came from Paddan, Rachel died to my sorrow in the land of Canaan on the way, while there was still some distance to go to Ephrath; and I buried her there on the way to Ephrath (that is[c][b], Bethlehem).
translation:
  language: te
  text: “నా విషయానికొస్తే, నేను పద్దాను[a] నుండి వచ్చినప్పుడు, కనాను దేశంలో, దారిలో రాహేలు నా దగ్గర[b] చనిపోయింది; ఎఫ్రాతాకు చేరడానికి ఇంకా కొంత దూరం[c] ఉండగానే నేను ఆమెను అక్కడ, ఎఫ్రాతాకు వెళ్లే దారిలో పాతిపెట్టాను. ఎఫ్రాతా అంటే బేత్లెహేము.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీ మూలపాఠంలో ఇక్కడ ‘పద్దాను’ అని మాత్రమే ఉంది. సంబంధిత వచనాల ఆధారంగా కొందరు దీనిని ‘పద్దాను-అరాము’ అని విస్తరిస్తారు.
    reason: lexical_alternative
  - marker: b
    text: పదశః ‘నా మీద చనిపోయింది.’ ఈ హెబ్రీ ప్రయోగం రాహేలు యాకోబు సమీపంలో చనిపోయిందనే భావాన్నిగానీ, ఆమె మరణం అతనికి కలిగించిన వ్యక్తిగత భారాన్నిగానీ నొక్కి చెప్పవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: ‘కొంత దూరం’ అని అనువదించిన హెబ్రీ ప్రయోగం ఇంకా మిగిలి ఉన్న ఒక ప్రయాణపు భూభాగాన్ని సూచిస్తుంది; ఖచ్చితమైన దూరం తెలియదు.
    reason: cultural_note
lexical_decisions:
- source_word: וַאֲנִי
  choice: నా విషయానికొస్తే
  rationale: స్వతంత్ర సర్వనామంతో కూడిన ఈ ఆరంభం యాకోబు తన వ్యక్తిగత అనుభవం వైపు విషయాన్ని మళ్లిస్తున్నట్లు చూపుతుంది.
- source_word: בְּבֹאִי מִפַּדָּן
  choice: నేను పద్దాను నుండి వస్తున్నప్పుడు
  rationale: בְּ తో కూడిన క్రియారూపానికి కాలసంబంధమైన భావం ఉంది; మూలపాఠంలో ఉన్న ‘పద్దాను’ అనే సంక్షిప్త స్థలనామాన్నే నిలిపింది.
- source_word: מֵתָה עָלַי
  choice: నా దగ్గరే చనిపోయింది
  rationale: పదశః ‘నా మీద చనిపోయింది’ అనే హెబ్రీ ప్రయోగం యాకోబు సమీపంలో మరణించడాన్నీ, ఆ మరణం అతనిపై పడిన వ్యక్తిగత భారాన్నీ సూచించవచ్చు. ప్రధాన పాఠంలో సహజమైన స్థలసంబంధ భావాన్ని ఇచ్చి, విస్తృత భావసాధ్యతను పాదటిప్పణిలో నిలిపింది.
- source_word: בְּאֶרֶץ כְּנַעַן בַּדֶּרֶךְ
  choice: కనాను దేశంలో దారిలో
  rationale: ప్రయాణ సందర్భంలోని భౌగోళిక వివరాన్ని, ‘దేశం’ అనే మూలపాఠపు పూర్తి పదబంధాన్ని నిలిపింది.
- source_word: בְּעוֹד כִּבְרַת אֶרֶץ לָבֹא אֶפְרָתָה
  choice: ఎఫ్రాతాకు చేరుకోవడానికి ఇంకా కొంత దూరం ఉండగానే
  rationale: כִּבְרַת אֶרֶץ ఖచ్చితమైన కొలత తెలియని మిగిలిన ప్రయాణదూరాన్ని సూచించే ప్రయోగం; కృత్రిమమైన ఖచ్చితత్వం లేకుండా భావాన్ని తెలిపింది.
- source_word: וָאֶקְבְּרֶהָ שָּׁם
  choice: నేను ఆమెను అక్కడ ... పాతిపెట్టాను
  rationale: యాకోబు చేసిన తదుపరి కార్యాన్నీ, సమాధి స్థలాన్ని సూచించే ‘అక్కడ’ అనే అవ్యయాన్నీ స్పష్టంగా నిలిపింది.
- source_word: בְּדֶרֶךְ אֶפְרָת הִוא בֵּית לָחֶם
  choice: ఎఫ్రాతాకు వెళ్లే దారిలో—ఎఫ్రాతా అంటే బేత్లెహేము
  rationale: ప్రయాణ మార్గాన్నీ, ఎఫ్రాతాను బేత్లెహేముతో గుర్తించే మూలపాఠపు వివరణనూ సహజమైన ఆధునిక తెలుగులో తెలిపింది.
