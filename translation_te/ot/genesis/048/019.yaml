id: GEN.48.19
reference: Genesis 48:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְמָאֵ֣ן אָבִ֗י/ו וַ/יֹּ֨אמֶר֙ יָדַ֤עְתִּֽי בְנִ/י֙ יָדַ֔עְתִּי גַּם ה֥וּא יִֽהְיֶה לְּ/עָ֖ם וְ/גַם ה֣וּא יִגְדָּ֑ל וְ/אוּלָ֗ם אָחִ֤י/ו הַ/קָּטֹן֙ יִגְדַּ֣ל מִמֶּ֔/נּוּ וְ/זַרְע֖/וֹ יִהְיֶ֥ה מְלֹֽא הַ/גּוֹיִֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/019.yaml
  text: But his father refused and said[a], “I know, my son, I know. He too will become a people, and he too will become great. Nevertheless, his younger brother will become greater than he, and his offspring will become the fullness of nations.”
translation:
  language: te
  text: అయితే అతని తండ్రి నిరాకరించి ఇలా అన్నాడు, “నా కుమారుడా, నాకు తెలుసు, నాకు తెలుసు. అతడూ ఒక జనమవుతాడు; అతడూ గొప్పవాడవుతాడు. అయినా అతని తమ్ముడు అతనికంటే గొప్పవాడవుతాడు; ఆ తమ్ముడి సంతానం జనాంగాల నిండుదనం[a] అవుతుంది.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అనేక జనాంగాల సమూహం.” హీబ్రూ పదబంధానికి మరింత అక్షరార్థంగా “జనాంగాల నిండుదనం” అని అర్థం.
    reason: מְלֹא הַגּוֹיִם అనే అసాధారణ పదబంధంలోని అక్షరార్థాన్నీ, సాధ్యమైన భావానువాదాన్నీ రెండింటినీ సంరక్షించడానికి.
lexical_decisions:
- source_word: וַיְמָאֵן
  choice: ఒప్పుకోకుండా
  rationale: మָאֵן ఉద్దేశపూర్వకంగా నిరాకరించడాన్ని సూచిస్తుంది. యోసేపు చేతులను మార్చడానికి చేసిన ప్రయత్నాన్ని యాకోబు అంగీకరించలేదనే సందర్భార్థాన్ని ఇది సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: יָדַעְתִּי ... יָדַעְתִּי
  choice: నాకు తెలుసు, నాకు తెలుసు
  rationale: మూలంలోని ఉద్ఘాటనాత్మక పునరుక్తిని అలాగే నిలిపి, తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בְנִי
  choice: నా కుమారుడా
  rationale: యోసేపును నేరుగా సంబోధించే సంబంధపదాన్ని గౌరవప్రదమైన సాధారణ తెలుగులో అందిస్తుంది.
- source_word: גַּם הוּא יִהְיֶה לְעָם
  choice: ఇతడు కూడా ఒక జనమవుతాడు
  rationale: עָם యొక్క సమూహార్థమైన ‘జనం/ప్రజ’ భావాన్ని నిలుపుతుంది; సందర్భంలోని మనష్షేను సూచించడానికి ‘ఇతడు’ వాడబడింది.
- source_word: וְגַם הוּא יִגְדָּל
  choice: ఇతడు కూడా గొప్పవాడవుతాడు
  rationale: גדל ఇక్కడ స్థాయి, ప్రాముఖ్యతలో గొప్పవాడవడం అనే భవిష్య భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: וְאוּלָם
  choice: అయినా
  rationale: మనష్షే గొప్పవాడవుతాడనే మాటకూ ఎఫ్రాయిము ఇంకా గొప్పవాడవుతాడనే మాటకూ మధ్య బలమైన వ్యత్యాసాన్ని సహజంగా సూచిస్తుంది.
- source_word: אָחִיו הַקָּטֹן
  choice: ఇతని తమ్ముడు
  rationale: הַקָּטֹן ఇక్కడ పరిమాణాన్ని కాక జననక్రమంలో చిన్నవాడిని సూచిస్తుంది; తెలుగులో ‘తమ్ముడు’ ఆ సంబంధాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: יִגְדַּל מִמֶּנּוּ
  choice: ఇతనికంటే గొప్పవాడవుతాడు
  rationale: తులనార్థక מִן‌ను స్పష్టంగా నిలిపి, ముందున్న גדלతో పదబంధ సారూప్యాన్ని కాపాడుతుంది.
- source_word: וְזַרְעוֹ
  choice: అతని సంతానం
  rationale: זֶרַע యొక్క సమూహ ఏకవచన భావాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: יִהְיֶה מְלֹא הַגּוֹיִם
  choice: జనాంగాల సంపూర్ణత అవుతుంది
  rationale: מְלֹא యొక్క ‘నిండుదనం/సంపూర్ణత’ భావాన్ని వ్యాఖ్యానాత్మకంగా ‘అనేక జనాంగాలు’ అని మార్చకుండా నిలుపుతుంది; తెలుగులో చదవదగిన రూపంగా ‘సంపూర్ణత’ ఎంచుకోబడింది.
theological_decisions:
- issue: מְלֹא הַגּוֹיִם పదబంధం యొక్క అర్థం
  choice: జనాంగాల సంపూర్ణత
  alternative: అనేక జనాంగాలు; జనాంగాల సమూహం
  rationale: ఈ అసాధారణ పదబంధాన్ని కేవలం సంఖ్యాబాహుళ్యంగా నిర్ణయించకుండా, మూలంలోని ‘సంపూర్ణత/నిండుదనం’ భావాన్ని ప్రధాన పాఠ్యంలో నిలిపాము. సాధ్యమైన సంఖ్యాబాహుళ్య అర్థాన్ని పాదటిప్పణిలో ఇచ్చాము.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే వాక్య గౌరవం మరియు మూలంలోని పునరుక్తి, వ్యత్యాసం, అసాధారణ ‘సంపూర్ణత’ రూపకం నిలుపబడ్డాయి. పాదటిప్పణి సూచిక [a] సంబంధిత పదబంధం వెంట ఉంచబడింది.
