revisions:
- from: అయితే అతని తండ్రి ఒప్పుకోకుండా, “నా కుమారుడా, నాకు తెలుసు, నాకు తెలుసు. ఇతడు కూడా ఒక జనమవుతాడు; ఇతడు కూడా గొప్పవాడవుతాడు. అయినా ఇతని తమ్ముడు ఇతనికంటే గొప్పవాడవుతాడు; అతని సంతానం జనాంగాల సంపూర్ణత[a] అవుతుంది” అన్నాడు.
  to: అయితే అతని తండ్రి నిరాకరించి ఇలా అన్నాడు, “నా కుమారుడా, నాకు తెలుసు, నాకు తెలుసు. అతడూ ఒక జనమవుతాడు; అతడూ గొప్పవాడవుతాడు. అయినా అతని తమ్ముడు అతనికంటే గొప్పవాడవుతాడు; ఆ తమ్ముడి సంతానం జనాంగాల నిండుదనం[a] అవుతుంది.”
  rationale: The revision replaces an awkward expression of refusal with natural Telugu, clarifies that the final ‘offspring’ belongs to the younger brother without adding interpretation, and uses ‘నిండుదనం’ as a closer, more readable equivalent for מְלֹא. The footnote continues to preserve the literal rendering and a possible idiomatic alternative.
