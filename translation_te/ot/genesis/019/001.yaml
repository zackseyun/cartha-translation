id: GEN.19.1
reference: Genesis 19:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ֠/יָּבֹאוּ שְׁנֵ֨י הַ/מַּלְאָכִ֤ים סְדֹ֨מָ/ה֙ בָּ/עֶ֔רֶב וְ/ל֖וֹט יֹשֵׁ֣ב בְּ/שַֽׁעַר סְדֹ֑ם וַ/יַּרְא לוֹט֙ וַ/יָּ֣קָם לִ/קְרָאתָ֔/ם וַ/יִּשְׁתַּ֥חוּ אַפַּ֖יִם אָֽרְצָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/001.yaml
  text: The two angels came to Sodom in the evening[a], and Lot was sitting in the gate of Sodom. When Lot saw them[c][b], he rose to meet them and bowed with his face to the ground.
translation:
  language: te
  text: ఆ ఇద్దరు దేవదూతలు సాయంకాలం సొదొమకు వచ్చారు. లోతు సొదొమ పట్టణ ద్వారం వద్ద[a] కూర్చొని ఉన్నాడు. లోతు వారిని చూసి, వారిని కలవడానికి లేచి, ముఖం నేలకు ఆనేటట్లు వంగి నమస్కరించాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘పట్టణ ద్వారం’ అంటే కేవలం ప్రవేశద్వారం కాదు; ప్రజలు కలుసుకునే, పట్టణ వ్యవహారాలు జరిగే ద్వారప్రాంతం.
    reason: cultural_note
  - marker: b
    text: లేదా, ‘ముఖం నేలకు ఆనేటట్లు పూర్తిగా వంగి నమస్కరించాడు.’ హీబ్రూ పదబంధం నేలవరకు పూర్తిగా వంగి గౌరవం చూపే చర్యను వర్ణిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁנֵי הַמַּלְאָכִים
  choice: ఆ ఇద్దరు దేవదూతలు
  rationale: מַלְאָךְ అనే పదానికి ‘దూత’ లేదా ‘దేవదూత’ అనే అర్థాలు ఉండవచ్చు. మునుపటి కథనంలోని పరలోక సందర్శకులే ఇక్కడ ఉద్దేశించబడినందున ‘దేవదూతలు’ సహజంగా, సందర్భానుగుణంగా ఉంది. నిర్దిష్టతను ‘ఆ’ తెలియజేస్తుంది.
- source_word: בָּעֶרֶב
  choice: సాయంకాలం
  rationale: రాక జరిగిన సమయాన్ని ఆధునిక ప్రామాణిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: סְדֹמָה
  choice: సొదొమకు
  rationale: స్థలపేరుకు జోడించిన దిశార్థక ה, సొదొమ వైపు/సొదొమకు జరిగిన గమనాన్ని సూచిస్తుంది; ‘సొదొమకు’ సరళమైన సమానార్థకం.
- source_word: יֹשֵׁב
  choice: కూర్చొని ఉన్నాడు
  rationale: హీబ్రూ కృదంతం నేపథ్యంలోని కొనసాగుతున్న స్థితిని సూచిస్తుంది; ఈ రూపం ఆ భావాన్ని నిలుపుతుంది.
- source_word: בְּשַׁעַר סְדֹם
  choice: సొదొమ పట్టణ ద్వారం దగ్గర
  rationale: ఇది కేవలం తలుపు లోపల అని కాకుండా పట్టణ ద్వార ప్రాంగణాన్ని సూచిస్తుంది. ‘దగ్గర’ ఆధునిక తెలుగులో సహజం; సాంస్కృతిక విస్తృతిని పాదసూచిక వివరిస్తుంది.
- source_word: וַיָּקָם לִקְרָאתָם
  choice: వారిని ఎదుర్కోవడానికి లేచి
  rationale: లేచి వచ్చినవారిని కలుసుకోవడానికి ముందుకు వెళ్లే భావాన్ని సహజ తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: וַיִּשְׁתַּחוּ אַפַּיִם אָרְצָה
  choice: నేలవరకు ముఖం వంచి నమస్కరించాడు
  rationale: ముఖం నేలవైపు ఉండేంతగా లోతుగా వంగిన గౌరవ చర్యను తెలియజేస్తుంది; ‘ఆరాధించాడు’ అనే సందర్భానికి మించిన ధార్మిక నిర్ణయాన్ని నివారిస్తుంది.
theological_decisions:
- issue: וַיִּשְׁתַּחוּ అనే క్రియను ఆరాధనగా అనువదించాలా, గౌరవపూర్వక సాష్టాంగ నమస్కారంగా అనువదించాలా
  choice: నేలవరకు ముఖం వంచి నమస్కరించాడు
  alternative: ఆరాధించాడు
  rationale: שׁחה దేవుని ఆరాధించడాన్నీ, మనుషులు లేదా దేవదూతల ఎదుట గౌరవంతో వంగడాన్నీ సూచించగలదు. ఈ సందర్భంలో ‘ఆరాధించాడు’ అనడం వచనం స్పష్టంగా చెప్పని ధార్మిక భావాన్ని చేర్చుతుంది; కాబట్టి శరీర చర్యను, గౌరవ భావాన్ని తెలిపే అనువాదం ఎంచుకోబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా కథన శైలిని సహజంగా ఉంచి, ‘పట్టణ ద్వారం’ అనే ప్రాచీన సాంస్కృతిక భావానికి పాదసూచిక ఇచ్చాం. గౌరవప్రదమైన శైలి పాటించబడింది; ఆరాధన అనే ధార్మిక భావాన్ని అనవసరంగా నిర్ధారించలేదు.
