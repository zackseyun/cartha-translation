lexical_decisions:
- source_word: הַשֶּׁמֶשׁ
  choice: సూర్యుడు
  rationale: నిర్దిష్ట ఉపపదంతో ఉన్న నామవాచకం; ఆధునిక తెలుగులో సహజమైన ప్రామాణిక రూపం.
- source_word: יָצָא
  choice: ఉదయించాడు
  rationale: మూలార్థం ‘బయలుదేరాడు/వెలువడ్డాడు’; సూర్యునితో వాడినప్పుడు సందర్భానుసారంగా ‘ఉదయించాడు’ అనే అర్థం సహజం.
- source_word: עַל הָאָרֶץ
  choice: భూమిపైకి
  rationale: עַל అంటే ‘మీద/పైకి’; אֶרֶץ ‘భూమి’ లేదా ‘దేశం/ప్రాంతం’ కావచ్చు. సూర్యోదయ వర్ణనలో ‘భూమిపైకి’ సహజంగా ఉండగా, స్థానిక ‘ప్రాంతం’ అనే భావమూ సాధ్యమని పాదటిప్పణిలో ఉంచాం.
- source_word: וְלוֹט
  choice: లోతు
  rationale: సంయోజకాన్ని తెలుగులో అర్థవిరామంతో సహజంగా వ్యక్తం చేసి, వ్యక్తి పేరును ప్రామాణిక తెలుగు రూపంలో ఇచ్చాం.
- source_word: בָּא
  choice: చేరుకున్నాడు
  rationale: בוא అంటే ‘వచ్చాడు/ప్రవేశించాడు’; గమ్యస్థానానికి ప్రయాణం పూర్తయిన సందర్భంలో ‘చేరుకున్నాడు’ సహజంగా భావాన్ని అందిస్తుంది.
- source_word: צֹעֲרָה
  choice: సోయరుకు
  rationale: స్థలనామానికి దిశను సూచించే ה జతైంది; తెలుగులో ‘సోయరుకు’ అని గమ్యాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
