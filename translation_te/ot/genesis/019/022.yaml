  yaml_path: translation/ot/genesis/019/022.yaml
  text: Hurry[a], escape there[b], for I cannot do anything until you arrive there.” Therefore the city was called Zoar.
translation:
  language: te
  text: “త్వరపడు! అక్కడికి తప్పించుకొని పో. నువ్వు అక్కడికి చేరుకునే వరకు నేను ఏమీ చేయలేను.” అందుకే ఆ పట్టణానికి సోయరు[a] అని పేరు పెట్టారు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: సోయరు అనే పేరు, హెబ్రీలో ‘చిన్నది’ లేదా ‘అల్పమైనది’ అనే పదంలా వినిపిస్తుంది; ఆదికాండం 19:20 చూడండి.
    reason: cross_reference
  - marker: b
    text: మరింత అక్షరార్థంగా, “అతడు ఆ పట్టణం పేరును సోయరు అని పిలిచాడు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מַהֵר
  choice: త్వరపడు
  rationale: ఆజ్ఞారూపంలోని అత్యవసర భావాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: הִמָּלֵט
  choice: తప్పించుకొని పో
  rationale: నిఫాల్ ఆజ్ఞారూపం సూచించే ‘తప్పించుకోవడం/ప్రాణాలతో బయటపడడం’ అనే భావాన్ని సందర్భానికి తగిన సహజమైన తెలుగులో అందిస్తుంది.
- source_word: שָׁמָּה
  choice: అక్కడికి
  rationale: గమ్యదిశను సూచించే హెబ్రీ క్రియావిశేషణాన్ని తెలుగులోని దిశార్థక రూపంతో వ్యక్తం చేస్తుంది.
- source_word: לֹא אוּכַל לַעֲשׂוֹת דָּבָר
  choice: నేను ఏమీ చేయలేను
  rationale: ‘ఒక కార్యాన్ని చేయలేను’ అనే హెబ్రీ నిర్మాణాన్ని సహజంగా అనువదిస్తూ, సంపూర్ణ అసమర్థతగా వినిపించే మూలవాక్య బలాన్ని నిలుపుతుంది.
- source_word: עַד בֹּאֲךָ שָׁמָּה
  choice: నువ్వు అక్కడికి చేరుకునే వరకు
  rationale: రెండవ పురుష ఏకవచన ప్రత్యయంతో ఉన్న ‘నీ రాక వరకు’ అనే భావాన్ని గమ్యస్థానానికి చేరడమనే సందర్భంలో సహజంగా తెలియజేస్తుంది.
- source_word: עַל כֵּן
  choice: అందుకే
  rationale: పట్టణం పేరుకు కారణాన్ని పరిచయం చేసే నిర్ధారణాత్మక సూత్రాన్ని ప్రస్తుత ప్రామాణిక తెలుగులో సహజంగా అందిస్తుంది.
- source_word: קָרָא שֵׁם הָעִיר
  choice: ఆ పట్టణానికి … అని పేరు పెట్టారు
  rationale: హెబ్రీలోని అక్షరార్థ నిర్మాణాన్ని తెలుగులో సహజమైన అనిర్దిష్ట కర్త వాక్యంగా ఇస్తుంది; మూలంలోని ఏకవచన పురుష కర్త ఎవరో స్పష్టంగా చెప్పబడనందున అతని గుర్తింపును దిగుమతి చేయదు.
- source_word: צֹעַר
  choice: సోయరు
  rationale: హెబ్రీ స్థలనామాన్ని తెలుగులో లిప్యంతరీకరిస్తుంది; దాని పదక్రీడను పాదసూచిక వివరిస్తుంది.
theological_decisions:
- issue: తీర్పు సందర్భంలో ‘నేను చేయలేను’ అనే అసమర్థత ప్రకటన
  choice: నేను ఏమీ చేయలేను
  alternative: నేను ఏమీ చేయకూడదు / నేను దీనిని చేయలేను
  rationale: לֹא אוּכַל అనే మూలపాఠం నేరుగా అసమర్థతను తెలుపుతుంది. దానిని అనుమతి, సంకల్పం లేదా దూతకున్న పరిమితిగా మార్చకుండా వాక్యంలోని దైవశాస్త్రీయ ఉద్వేగాన్ని అలాగే ఉంచుతుంది.
- issue: పట్టణానికి పేరు పెట్టిన కర్త గుర్తింపు
  choice: పేరు పెట్టారు
  alternative: అతడు ఆ పట్టణం పేరును సోయరు అని పిలిచాడు
  rationale: హెబ్రీ క్రియ మూడవ పురుష ఏకవచనంలో ఉన్నా, ఈ వాక్యంలో కర్తకు స్పష్టమైన గుర్తింపు లేదు. సహజమైన తెలుగు అనిర్దిష్ట కర్త నిర్మాణం అనవసరమైన గుర్తింపును నివారిస్తుంది; అక్షరార్థ నిర్మాణం పాదసూచికలో నిలుపబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి వాడబడింది. అత్యవసరతను రెండు సంక్షిప్త ఆజ్ఞలతో వ్యక్తం చేసి, మూలంలోని అసమర్థత ప్రకటనను సున్నితపరచకుండా నిలిపాం. పాదసూచిక గుర్తులను అవి వివరిస్తున్న ‘సోయరు’ మరియు పేరు పెట్టే వాక్యభాగాల వద్ద ఉంచాం.
