  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּשְׁלְח֤וּ הָֽ/אֲנָשִׁים֙ אֶת יָדָ֔/ם וַ/יָּבִ֧יאוּ אֶת ל֛וֹט אֲלֵי/הֶ֖ם הַ/בָּ֑יְתָ/ה וְ/אֶת הַ/דֶּ֖לֶת סָגָֽרוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/010.yaml
  text: But the men reached out their hands and brought Lot into the house with them[c][b][a], and shut the door.
translation:
  language: te
  text: అయితే ఆ మనుషులు[b] తమ చేతులు చాపి[a], లోతును తమ దగ్గరకు, ఇంటిలోనికి తీసుకువచ్చి, తలుపు మూసివేశారు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘తమ చేతులు ముందుకు చాపి.’
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో ‘ఆ మనుషులు’; విస్తృత సందర్భం వారు దేవదూతలైన సందేశకులని తెలియజేస్తుంది.
    reason: alternative_reading
  - marker: c
    text: లేదా, ‘వారు తలుపు మూసివేశారు.’
    reason: previous_rendering
lexical_decisions:
- source_word: הָאֲנָשִׁים
  choice: ఆ మనుషులు
  rationale: ఈ వచనంలో ఉన్న సాధారణ నామవాచకమైన ‘మనుషులు’ అనే రూపాన్నే నిలుపుతుంది; సందర్భం వారిని దేవదూతలైన సందేశకులుగా గుర్తించినా, దానిని ప్రధాన పాఠ్యంలో చేర్చదు.
- source_word: וַיִּשְׁלְחוּ אֶת יָדָם
  choice: తమ చేతులు బయటికి చాపి
  rationale: చేతిని ముందుకు లేదా బయటికి చాపడాన్ని సూచించే హీబ్రూ నుడికారాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది. హీబ్రూలో ‘చెయ్యి’ ఏకవచన రూపంలో ఉన్నా, బహువచన కర్తకు తెలుగులో ‘చేతులు’ సహజం.
- source_word: וַיָּבִיאוּ
  choice: తీసుకొని
  rationale: בוא ధాతువు హిఫీల్ రూపం ‘తీసుకురావడం’ అనే భావాన్ని ఇస్తుంది. సందర్భంలోని తొందరను బట్టి ‘లాగి’ అని అర్థాన్ని విస్తరించకుండా, నేరుగా ఉన్న క్రియాభావాన్ని నిలుపుతుంది.
- source_word: אֲלֵיהֶם הַבָּיְתָה
  choice: తమ దగ్గరికి ఇంట్లోకి
  rationale: లోతు వారి వైపుకు, ఇంటి లోపలికి కదిలిన రెండు భావాలనూ నిలుపుతుంది.
- source_word: הַדֶּלֶת
  choice: తలుపు
  rationale: సాధారణ హీబ్రూ పదానికి సహజమైన తెలుగు సమానార్థకం.
- source_word: סָגָרוּ
  choice: మూసివేశారు
  rationale: కథన సందర్భంలో తలుపును పూర్తిగా మూసిన చర్యను సహజంగా తెలియజేస్తుంది.
- source_word: וַ
  choice: అయితే
  rationale: మునుపటి వచనంలోని గుంపు చర్యకు విరుద్ధంగా ఈ చర్య జరిగినట్లు కథన సంబంధాన్ని సహజంగా సూచిస్తుంది.
theological_decisions:
- issue: הָאֲנָשִׁים అనే పదాన్ని ప్రధాన పాఠ్యంలో దేవదూతలుగా స్పష్టీకరించాలా
  choice: ప్రధాన పాఠ్యంలో ‘ఆ మనుషులు’ అని ఉంచడం
  alternative: ‘ఆ దేవదూతలు’ లేదా ‘ఆ సందర్శకులు’
  rationale: విస్తృత సందర్భం వారు దేవదూతలైన సందేశకులని తెలియజేస్తుంది; అయితే ఈ వచనం వారిని ‘మనుషులు’ అనే సాధారణ పదంతోనే సూచిస్తుంది. కాబట్టి మూలపాఠంలోని పదప్రయోగాన్ని ప్రధాన పాఠ్యంలో నిలిపి, సందర్భసంబంధ గుర్తింపును పాదసూచికలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గంభీరమైన కథన శైలి. హీబ్రూ క్రియల వేగవంతమైన వరుసను సంయుక్త క్రియలతో నిలిపింది; సందర్భాన్ని బట్టి అవసరానికి మించి వివరణను ప్రధాన పాఠ్యంలో చేర్చలేదు.
