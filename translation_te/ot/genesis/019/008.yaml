id: GEN.19.8
reference: Genesis 19:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: הִנֵּה נָ֨א לִ֜/י שְׁתֵּ֣י בָנ֗וֹת אֲשֶׁ֤ר לֹֽא יָדְעוּ֙ אִ֔ישׁ אוֹצִֽיאָה נָּ֤א אֶתְ/הֶן֙ אֲלֵי/כֶ֔ם וַ/עֲשׂ֣וּ לָ/הֶ֔ן כַּ/טּ֖וֹב בְּ/עֵינֵי/כֶ֑ם רַ֠ק לָֽ/אֲנָשִׁ֤ים הָ/אֵל֙ אַל תַּעֲשׂ֣וּ דָבָ֔ר כִּֽי עַל כֵּ֥ן בָּ֖אוּ בְּ/צֵ֥ל קֹרָתִֽ/י־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/008.yaml
  text: Look[a], please, I have two daughters who have not known a man. Please let me bring them out to you, and do to them as is good in your eyes. Only to these men do nothing[c][b], for they have come under the shadow of my roof.
translation:
  language: te
  text: ఇదిగో, దయచేసి, పురుషునితో లైంగిక సంబంధం కలగని ఇద్దరు కుమార్తెలు నాకు ఉన్నారు.[a] దయచేసి వారిని మీ దగ్గరికి బయటకు తీసుకురానివ్వండి; మీ దృష్టికి ఏది మంచిదో వారితో చేయండి. అయితే ఈ మనుషులకు మాత్రం ఏమీ చేయకండి; ఎందుకంటే వారు నా కప్పు నీడలోకి వచ్చారు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థానికి దగ్గరగా, “పురుషుణ్ణి ఎరుగని”; ఇది పురుషునితో లైంగిక సంబంధం కలగలేదని తెలిపే హీబ్రూ నుడికారం. సాంప్రదాయకంగా, “కన్యలు.”
    reason: lexical_alternative
  - marker: b
    text: 'హీబ్రూ: “నా కప్పు నీడలోకి.” తన ఇంటికి వచ్చిన అతిథులకు ఇవ్వవలసిన ఆశ్రయం, రక్షణను సూచించే నుడికారం.'
    reason: cultural_note
lexical_decisions:
- source_word: הִנֵּה נָא
  choice: ఇదిగో
  rationale: הִנֵּה యొక్క తక్షణ అవధాన పిలుపును సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది; נָא లోని వేడుకోలు స్వరం తరువాతి ‘దయచేసి’లో స్పష్టమవుతుంది.
- source_word: שְׁתֵּי בָנוֹת
  choice: ఇద్దరు కుమార్తెలు
  rationale: మూలంలోని సంఖ్యను, బంధాన్ని నేరుగా తెలియజేస్తుంది.
- source_word: אֲשֶׁר לֹא יָדְעוּ אִישׁ
  choice: పురుషునితో సంబంధం ఎరుగని
  rationale: יָדַע అనే లైంగిక సంబంధార్థక హీబ్రూ ప్రయోగాన్ని మర్యాదగా కానీ అర్థం మరుగుపడకుండా అందిస్తుంది; ‘కన్యలు’ అనే సంక్షిప్త వ్యాఖ్యానాన్ని ప్రధాన పాఠ్యంలో పెట్టదు.
- source_word: אוֹצִיאָה נָּא אֶתְהֶן אֲלֵיכֶם
  choice: దయచేసి వారిని మీ దగ్గరికి బయటకు తీసుకొస్తాను
  rationale: కోహోర్టేటివ్ రూపంలోని లోతు ప్రతిపాదన/సంకల్పాన్ని, נָא లోని వేడుకోలును సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וַעֲשׂוּ לָהֶן כַּטּוֹב בְּעֵינֵיכֶם
  choice: మీ దృష్టికి ఏది మంచిదో వారికి చేయండి
  rationale: ‘మీ కళ్లలో మంచిది’ అనే మూల నుడికారానికి దగ్గరగా ఉంటూనే తెలుగులో సహజంగా ఉంది; ఆ ప్రతిపాదనలోని దిగ్భ్రాంతికర తీవ్రతను తగ్గించదు.
- source_word: רַק לָאֲנָשִׁים הָאֵל אַל תַּעֲשׂוּ דָבָר
  choice: అయితే ఈ మనుషులకు మాత్రం ఏమీ చేయకండి
  rationale: רַק సూచించే బలమైన పరిమితి/వ్యతిరేకతను ‘మాత్రం’ ద్వారా స్పష్టంగా చూపిస్తూ నిషేధాన్ని సహజంగా అందిస్తుంది.
- source_word: כִּי עַל כֵּן בָּאוּ
  choice: ఎందుకంటే వారు ... వచ్చారు
  rationale: లోతు తన అతిథులను కాపాడవలసిన బాధ్యతకు కారణాన్ని సూచించే మూలంలోని కారణార్థాన్ని నిలుపుతుంది.
- source_word: בְּצֵל קֹרָתִי
  choice: నా ఇంటి కప్పు నీడలోకి
  rationale: ‘నా కప్పు నీడలో’ అనే మూల చిత్రాన్ని నిలుపుతూ, తెలుగులో అది భవనపు కప్పని స్పష్టం చేయడానికి ‘ఇంటి’ని జతచేస్తుంది; ఆతిథ్య రక్షణ భావం పాదసూచికలో వివరించబడింది.
theological_decisions:
- issue: లోతు చేసిన దిగ్భ్రాంతికర ప్రతిపాదనను నైతిక సౌలభ్యం కోసం మృదువుగా చేయాలా?
  choice: హీబ్రూ వాక్యంలోని స్పష్టమైన, కలవరపరిచే భావాన్ని మృదుపరచకుండా నిలుపడం
  alternative: ‘మీ ఇష్టం వచ్చినట్లు వారితో వ్యవహరించండి’ వంటి కొంత మృదువైన రూపం
  rationale: మూలపాఠ్యం ఈ ప్రతిపాదనను సమర్థించదు, అలాగే దాని తీవ్రతను దాచదు. అనువాదం నైతిక ఆమోదాన్ని చొప్పించకూడదు; మూలంలోని అసౌకర్యాన్ని కూడా తొలగించకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనా సామాన్య పాఠకులకు అర్థమయ్యే శైలి. మూలంలోని పునరుక్త వేడుకోలు స్వరాన్ని సహజ తెలుగు ప్రవాహంలో అందించి, దిగ్భ్రాంతికర ప్రతిపాదనను వ్యాఖ్యానంతో మృదువుపరచలేదు. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
