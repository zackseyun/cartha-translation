revisions:
- from: ఇదిగో, పురుషునితో సంబంధం ఎరుగని ఇద్దరు కుమార్తెలు నాకు ఉన్నారు.[a] దయచేసి వారిని మీ దగ్గరికి బయటకు తీసుకొస్తాను; మీ దృష్టికి ఏది మంచిదో వారికి చేయండి. అయితే ఈ మనుషులకు మాత్రం ఏమీ చేయకండి; ఎందుకంటే వారు నా ఇంటి కప్పు నీడలోకి వచ్చారు.[b]
  to: ఇదిగో, దయచేసి, పురుషునితో లైంగిక సంబంధం కలగని ఇద్దరు కుమార్తెలు నాకు ఉన్నారు.[a] దయచేసి వారిని మీ దగ్గరికి బయటకు తీసుకురానివ్వండి; మీ దృష్టికి ఏది మంచిదో వారితో చేయండి. అయితే ఈ మనుషులకు మాత్రం ఏమీ చేయకండి; ఎందుకంటే వారు నా కప్పు నీడలోకి వచ్చారు.[b]
  rationale: సవరణలు మూలపాఠ్యంలోని రెండు వేడుకోలు కణాల స్వరాన్ని, ‘తెలియుట’ అనే లైంగిక నుడికారపు సందర్భార్థాన్ని, మరియు కోహోర్టేటివ్ ప్రతిపాదనను స్పష్టంగా, సహజమైన ఆధునిక ప్రామాణిక తెలుగులో నిలుపుతాయి. లోతు చేసిన ప్రతిపాదనను మృదువుపరచలేదు; దానికి నైతిక వ్యాఖ్యానాన్ని కూడా జోడించలేదు. పాదసూచిక గుర్తులు, వాటి విషయాలు సరియైన స్థానాల్లో ఉన్నాయి.
