source:
  edition: WLC
  text: וַ/תֹּ֧אמֶר הַ/בְּכִירָ֛ה אֶל הַ/צְּעִירָ֖ה אָבִ֣י/נוּ זָקֵ֑ן וְ/אִ֨ישׁ אֵ֤ין בָּ/אָ֨רֶץ֙ לָ/ב֣וֹא עָלֵ֔י/נוּ כְּ/דֶ֖רֶךְ כָּל הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/031.yaml
  text: And the firstborn said to the younger[a], “Our father is old[b], and there is not a man in the land to come in to us according to the way of all the earth.”
translation:
  language: te
  text: పెద్ద కుమార్తె చిన్న కుమార్తెతో, “మన తండ్రి వృద్ధుడు. లోకమంతటి ఆచారం ప్రకారం[b] మన దగ్గరకు రావడానికి[a] ఈ దేశంలో ఏ పురుషుడూ లేడు” అంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘మన దగ్గరకు రావడం’ అనేది ఇక్కడ లైంగిక సంబంధం పెట్టుకోవడాన్ని సూచించే హీబ్రూ సౌమ్యోక్తి.
    reason: lexical_alternative
  - marker: b
    text: ‘లోకమంతటి ఆచారం ప్రకారం’ అంటే సాధారణ మానవ ఆచారం లేదా పద్ధతి; ఈ సందర్భంలో అది లైంగిక సంబంధానికి సంబంధించినది.
    reason: cultural_note
lexical_decisions:
- source_word: הַבְּכִירָה
  choice: పెద్ద కుమార్తె
  rationale: ఈ పదం కుటుంబంలోని పుట్టుక క్రమాన్ని సూచిస్తుంది. సహజమైన ఆధునిక తెలుగులో ‘పెద్ద కుమార్తె’ ఆ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: הַצְּעִירָה
  choice: చిన్న కుమార్తె
  rationale: ‘చిన్నది/వయసులో చిన్నది’ అనే తులనాత్మక భావాన్ని, ‘పెద్ద కుమార్తె’తో ఉన్న జత వ్యత్యాసాన్ని సహజంగా నిలుపుతుంది.
- source_word: אָבִינוּ זָקֵן
  choice: మన తండ్రి ముసలివాడయ్యాడు
  rationale: హీబ్రూ వాక్యం తండ్రి వృద్ధాప్య స్థితిని నేరుగా చెబుతుంది. తెలుగు సందర్భంలో ‘ముసలివాడయ్యాడు’ సహజంగా ఉండి, ఆయన వయసు మళ్లిందనే భావాన్ని ఇస్తుంది.
- source_word: וְאִישׁ אֵין בָּאָרֶץ
  choice: ఈ దేశంలో పురుషుడెవడూ లేడు
  rationale: אִישׁ ఇక్కడ సంతానోత్పత్తి సందర్భంలో పురుషుణ్ణే సూచిస్తుంది; అందువల్ల లింగతటస్థ పదం వాడలేదు. בָאָרֶץ ను ‘ఈ దేశంలో’గా అనువదించడం ఆ ప్రదేశాన్ని సూచించే సహజ తెలుగు రూపం.
- source_word: לָבוֹא עָלֵינוּ
  choice: మన దగ్గరకు రావడానికి
  rationale: మూలంలోని లైంగిక సౌమ్యోక్తిని నేరుగా అసభ్యంగా చేయకుండా నిలుపుతుంది. సందర్భంలో దీని ఉద్దేశం లైంగిక సంబంధమేనని పాదసూచిక వివరిస్తుంది.
- source_word: כְּדֶרֶךְ כָּל הָאָרֶץ
  choice: లోకమంతటి ఆచారం ప్రకారం
  rationale: ‘భూమి అంతటి మార్గం’ అనే పదశః రూపం తెలుగులో అసహజంగా ఉంటుంది. ఈ నుడికారం సూచించే సాధారణ మానవ ఆచారం లేదా జీవనపద్ధతిని ఈ రూపం స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ‘లోకమంతటి ఆచారం’ అనే మాట యొక్క పరిధి
  choice: సాధారణ మానవ ఆచారాన్ని సూచించే విస్తృత నుడికారంగా ఉంచడం
  alternative: వివాహం లేదా సంతానోత్పత్తి అని ప్రధాన వాక్యంలోనే స్పష్టంగా పేర్కొనడం
  rationale: సందర్భం లైంగిక సంబంధం మరియు కుటుంబ కొనసాగింపును సూచించినా, మూలపాఠం వాటిని నేరుగా పేర్కొనదు. అందువల్ల మూలంలోని సౌమ్యోక్తి మరియు కొంత అస్పష్టతను ప్రధాన వాక్యంలో నిలిపి, పాదసూచికలో వివరణ ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన కథన శైలి వాడబడింది. మూలంలోని లైంగిక సౌమ్యోక్తిని ప్రధాన వాక్యంలో నిలిపి, అవసరమైన వివరణను పాదసూచికలకు పరిమితం చేశాం.
