lexical_decisions:
- source_word: וַתַּהֲרֶיןָ
  choice: గర్భవతులయ్యారు
  rationale: הרה క్రియ ఇక్కడ ఆ ఇద్దరు స్త్రీలు గర్భం ధరించినట్లు సూచిస్తుంది. ఆధునిక తెలుగులో ‘గర్భవతులయ్యారు’ సహజంగా, స్పష్టంగా ఉంది; ‘గర్భం ధరించారు’ కూడా సాధ్యమే.
- source_word: שְׁתֵּי
  choice: ఇద్దరూ
  rationale: ఈ సంఖ్య లోతు కుమార్తెలు ఇద్దరూ ఇందులో ఉన్నారని తెలియజేస్తుంది. తెలుగులో ‘కుమార్తెలిద్దరూ’ ఆ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בְנוֹת לוֹט
  choice: లోతు కుమార్తెలు
  rationale: హీబ్రూ సంబంధ పదబంధాన్ని తెలుగులో సహజమైన స్వామ్య నిర్మాణంతో అనువదించాం.
- source_word: מֵאֲבִיהֶן
  choice: తమ తండ్రివల్ల
  rationale: מִן ఇక్కడ మూలం లేదా పితృత్వాన్ని సూచిస్తుంది. ‘తమ తండ్రివల్ల’ సందర్భంలో సహజంగా పితృత్వ భావాన్ని అందిస్తూ, అక్షరార్థమైన ‘తమ తండ్రి నుండి’ అనే మూలభావాన్నీ నిలుపుతుంది.
