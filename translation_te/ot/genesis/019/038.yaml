  yaml_path: translation/ot/genesis/019/038.yaml
  text: The younger also bore a son and called his name Ben-ammi[b][a]; he is the father of the Ammonites to this day.
translation:
  language: te
  text: చిన్న కుమార్తె కూడా ఒక కుమారుణ్ణి కని, అతనికి బెన్‌-అమ్మీ[a] అని పేరు పెట్టింది. అతడు నేటివరకు అమ్మోనీయుల[b] పూర్వికుడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “బెన్‌-అమ్మీ” అనే పేరుకు బహుశా “నా ప్రజకు చెందిన కుమారుడు” లేదా “నా బంధువు కుమారుడు” అని అర్థం.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “అమ్మోను కుమారులు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַצְּעִירָה
  choice: చిన్న కుమార్తె
  rationale: సందర్భంలో ఇది లోతు చిన్న కుమార్తెను సూచించే నామవాచకార్థ విశేషణం; తెలుగులో సూచ్యార్థాన్ని స్పష్టంగా చెప్పడం సహజం.
- source_word: גַם הִוא
  choice: కూడా
  rationale: పెద్ద కుమార్తెలాగే చిన్న కుమార్తె కూడా కుమారుణ్ణి కన్నదనే సమాంతర భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: יָלְדָה בֵּן
  choice: ఒక కుమారుణ్ణి కని
  rationale: హీబ్రూ జనన వాక్యప్రయోగానికి సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: וַתִּקְרָא שְׁמוֹ
  choice: అతనికి ... అని పేరు పెట్టింది
  rationale: ‘అతని పేరు పిలిచింది’ అనే హీబ్రూ నామకరణ సూత్రాన్ని తెలుగులో సహజంగా అందిస్తుంది.
- source_word: בֶּן עַמִּי
  choice: బెన్‌-అమ్మీ
  rationale: వ్యక్తి పేరును లిప్యంతరీకరించి, కథనానికి ప్రాముఖ్యమైన దాని సాధ్యమైన అర్థాలను పాదటిప్పణిలో ఉంచింది.
- source_word: הוּא אֲבִי
  choice: అతడు ... పూర్వికుడు
  rationale: ఇక్కడ ‘తండ్రి’ అనేది ఒక జనసమూహపు మూలపురుషుడు అనే వంశావళి భావంలో ఉంది; ‘పూర్వికుడు’ ఆధునిక తెలుగులో స్పష్టం.
- source_word: בְנֵי עַמּוֹן
  choice: అమ్మోనీయులకు
  rationale: అక్షరార్థంగా ‘అమ్మోను కుమారులు’; ప్రజాజాతిని సూచించే సహజ తెలుగు రూపంగా ‘అమ్మోనీయులు’ వాడబడింది, అక్షరార్థం పాదటిప్పణిలో ఇవ్వబడింది.
- source_word: עַד הַיּוֹם
  choice: నేటివరకు
  rationale: కథకుని కాలం వరకు కొనసాగిన గుర్తింపును తెలిపే హీబ్రూ కాలవ్యవహారానికి సహజ సమానార్థకం.
