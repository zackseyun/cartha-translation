source:
  edition: WLC
  text: וַ/יַּשְׁכֵּ֥ם אַבְרָהָ֖ם בַּ/בֹּ֑קֶר אֶל הַ֨/מָּק֔וֹם אֲשֶׁר עָ֥מַד שָׁ֖ם אֶת פְּנֵ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/027.yaml
  text: Abraham rose early in the morning to the place where he had stood before Yahweh[a].
translation:
  language: te
  text: అబ్రాహాము ఉదయాన్నే లేచి, తాను యాహ్వే[a] సన్నిధిలో నిలిచిన చోటికి వెళ్లాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ మూలంలో అక్షరార్థంగా, “యాహ్వే ముఖం ఎదుట”; అంటే “యాహ్వే సన్నిధిలో.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכֵּם
  choice: తెల్లవారుజామునే లేచి
  rationale: שׁכם యొక్క హిఫిల్ రూపం సాధారణంగా ‘పొద్దున్నే లేవడం’ అని అర్థం. ‘తెల్లవారుజామునే లేచి’ కాలప్రాధాన్యాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది; స్వతహాగా ప్రయాణార్థాన్ని ఈ క్రియలో చేర్చదు.
- source_word: בַּבֹּקֶר
  choice: తెల్లవారుజామునే
  rationale: בֹּקֶר అంటే ఉదయం. וַיַּשְׁכֵּםతో కలిసి ఇది ఉదయాన్నే జరిగిన చర్యను బలపరుస్తుంది; తెలుగులో రెండు పదబంధాల భావాన్ని సహజంగా సమన్వయపరచడానికి ‘తెల్లవారుజామునే’ వాడబడింది.
- source_word: אֶל הַמָּקוֹם
  choice: చోటికి
  rationale: מָקוֹםకు సాధారణ అర్థం ‘చోటు/స్థలం.’ ముందుగా ప్రస్తావించిన ప్రదేశాన్ని సూచించే కథన సందర్భంలో ‘చోటికి’ సహజంగా ఉంటుంది.
- source_word: אֲשֶׁר עָמַד שָׁם
  choice: తాను ... నిలిచిన
  rationale: సాపేక్ష వాక్యం గతంలో జరిగిన సంఘటనను వెనుకకు సూచిస్తుంది. שָׁם భావం తెలుగులో ‘చోటికి’ అనే సంబంధ నిర్మాణంలో సహజంగా ఇమిడిపోతుంది.
- source_word: אֶת־פְּנֵי
  choice: సన్నిధిలో
  rationale: עמד את־פני అనే ప్రయోగం ఒకరి ముఖం ఎదుట, అంటే వారి సమక్షంలో నిలవడాన్ని సూచిస్తుంది. ‘సన్నిధిలో’ ఈ భావాన్ని గౌరవప్రదమైన, సహజమైన తెలుగులో తెలియజేస్తుంది; అక్షరార్థమైన ‘ముఖం ఎదుట’ను పాదటిప్పణిలో ఉంచాం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో లిప్యంతరీకరించాం.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలపాఠంలో సాధారణ బిరుదు కాకుండా చతురక్షర దైవనామం నేరుగా ఉంది. వ్యక్తినామ స్వభావాన్ని కాపాడుతూ, ఆధునిక తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం; ‘యాహ్వే’ సాధ్యమైన మరొక లిప్యంతరీకరణ.
- issue: אֶת־פְּנֵי ప్రయోగం
  choice: సన్నిధిలో
  alternative: ముఖం ఎదుట
  rationale: హీబ్రూ రూపం అక్షరార్థంగా ‘ముఖం ఎదుట’ అయినప్పటికీ, సందర్భంలో అది యెహోవా సమక్షంలో నిలబడటాన్ని సూచించే నుడికారం. ప్రధాన పాఠంలో సహజమైన భావాన్ని ఇచ్చి, మూలరూపాన్ని పాదటిప్పణిలో చూపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన కథన శైలి. హీబ్రూ పదక్రమాన్ని యాంత్రికంగా అనుసరించకుండా, కాలసూచన మరియు ముందుగా ప్రస్తావించిన ప్రదేశానికి తిరిగి వెళ్లడం స్పష్టంగా ఉంచబడింది.
