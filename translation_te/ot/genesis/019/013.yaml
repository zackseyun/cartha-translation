id: GEN.19.13
reference: Genesis 19:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּֽי מַשְׁחִתִ֣ים אֲנַ֔חְנוּ אֶת הַ/מָּק֖וֹם הַ/זֶּ֑ה כִּֽי גָֽדְלָ֤ה צַעֲקָתָ/ם֙ אֶת פְּנֵ֣י יְהוָ֔ה וַ/יְשַׁלְּחֵ֥/נוּ יְהוָ֖ה לְ/שַׁחֲתָֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/013.yaml
  text: For we are about to destroy this place[a], because their outcry has become great before Yahweh, and Yahweh has sent us to destroy it.
translation:
  language: te
  text: ఎందుకంటే మేము ఈ స్థలాన్ని నాశనం చేయబోతున్నాం; ఎందుకంటే యాహ్వే సన్నిధిలో వారి మొర[a] ఎంతో పెరిగిపోయింది, దానిని నాశనం చేయడానికి యాహ్వే మమ్మల్ని పంపించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారికి వ్యతిరేకంగా లేచిన మొర యాహ్వే సన్నిధిలో ఎంతో పెరిగిపోయింది.” హీబ్రూ రూపాన్ని అక్షరార్థంగా “వారి మొర” అని తీసుకోవచ్చు; అయితే సందర్భాన్ని బట్టి చాలామంది దీన్ని ఈ స్థల ప్రజలకు వ్యతిరేకంగా లేచిన మొరగా అర్థం చేసుకుంటారు.
    reason: alternative_reading
lexical_decisions:
- source_word: מַשְׁחִתִים
  choice: నాశనం చేయబోతున్నాం
  rationale: హిఫీల్ వర్తమాన కృదంతం ఇక్కడ సమీప భవిష్యత్తులో జరగబోయే తీర్పును సూచిస్తుంది; ఈ తెలుగు రూపం ఆ తక్షణ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: הַמָּקוֹם הַזֶּה
  choice: ఈ స్థలం
  rationale: స్థలాన్ని సూచించే సాధారణ పదార్థాన్నీ, ‘ఈ’ అనే సమీప సూచననూ నేరుగా కాపాడుతుంది.
- source_word: גָדְלָה
  choice: ఎంతో తీవ్రమైంది
  rationale: మొర పరిమాణం లేదా తీవ్రత పెరిగి ఉన్న స్థితిని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; కేవలం శబ్ద పరిమాణానికే అర్థాన్ని పరిమితం చేయదు.
- source_word: צַעֲקָתָם
  choice: వారి మొర
  rationale: మూడవ పురుష బహువచన ప్రత్యయాన్ని నేరుగా నిలుపుతూ, బాధ లేదా అన్యాయంపై లేచిన కేక అనే న్యాయసంబంధ సందర్భాన్ని ‘మొర’ తెలియజేస్తుంది.
- source_word: אֶת־פְּנֵי יְהוָה
  choice: యాహ్వే సన్నిధిలో
  rationale: హీబ్రూ నానుడిలోని దేవుని సమక్ష భావాన్ని సహజమైన, గౌరవప్రదమైన తెలుగులో అందిస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన టెట్రాగ్రామటన్‌ను బిరుదుతో భర్తీ చేయకుండా తెలుగు లిపిలో లిప్యంతరీకరిస్తుంది.
- source_word: וַיְשַׁלְּחֵנוּ
  choice: మమ్మల్ని పంపించాడు
  rationale: ఇప్పటి కార్యానికి ముందుగా జరిగిన పంపింపును సందర్భానుసారంగా స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: לְשַׁחֲתָהּ
  choice: దాన్ని నాశనం చేయడానికి
  rationale: స్త్రీలింగ ప్రత్యయం సూచించే నగరం లేదా స్థలాన్ని తెలుగులో సహజంగా ‘దాన్ని’ అని సూచిస్తూ, ముందున్న שׁחת మూలపదంతో పదసామ్యాన్ని కాపాడుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలంలో వ్యక్తిగత దైవనామం ప్రత్యక్షంగా ఉంది; అందువల్ల దానిని బిరుదుగా మార్చకుండా ‘యాహ్వే’గా లిప్యంతరీకరించాం.
- issue: צַעֲקָתָם భావం
  choice: వారి మొర
  alternative: వారికి వ్యతిరేకంగా లేచిన మొర
  rationale: హీబ్రూ ప్రత్యయం వ్యాకరణపరంగా ‘వారి మొర’ అని నేరుగా అనువదించవచ్చు. అయితే సందర్భంలో అది ఆ స్థల ప్రజలకు వ్యతిరేకంగా లేచిన మొరగా కూడా అర్థమవుతుంది; ఈ సందిగ్ధతను ప్రధాన పాఠంలో పరిష్కరించకుండా ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే వాక్య గాంభీర్యాన్ని నిలుపుతూ అనువదించాం. ‘మొర’ న్యాయం కోసం లేచిన ఆర్తనాద భావాన్ని ఇస్తుంది; ‘నాశనం చేయబోతున్నాం’ సమీపిస్తున్న చర్యను తెలియజేస్తుంది.
