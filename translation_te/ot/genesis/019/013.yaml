revisions:
- from: ఎందుకంటే మేము ఈ స్థలాన్ని నాశనం చేయబోతున్నాం. యాహ్వే సన్నిధిలో వారి మొర[a] ఎంతో తీవ్రమైంది; దాన్ని నాశనం చేయడానికి యాహ్వే మమ్మల్ని పంపించాడు.
  to: ఎందుకంటే మేము ఈ స్థలాన్ని నాశనం చేయబోతున్నాం; ఎందుకంటే యాహ్వే సన్నిధిలో వారి మొర[a] ఎంతో పెరిగిపోయింది, దానిని నాశనం చేయడానికి యాహ్వే మమ్మల్ని పంపించాడు.
  rationale: The revision explicitly renders both occurrences of כִּי, uses wording that more closely reflects the resultative ‘has grown great’ sense of גדלה, and retains the Hebrew ambiguity of ‘their outcry’ in both the main text and anchored footnote. No doctrinal interpretation has been added.
