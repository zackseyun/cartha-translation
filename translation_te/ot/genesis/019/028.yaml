id: GEN.19.28
reference: Genesis 19:28
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּשְׁקֵ֗ף עַל פְּנֵ֤י סְדֹם֙ וַ/עֲמֹרָ֔ה וְ/עַֽל כָּל פְּנֵ֖י אֶ֣רֶץ הַ/כִּכָּ֑ר וַ/יַּ֗רְא וְ/הִנֵּ֤ה עָלָה֙ קִיטֹ֣ר הָ/אָ֔רֶץ כְּ/קִיטֹ֖ר הַ/כִּבְשָֽׁן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/028.yaml
  text: And he looked out over Sodom and Gomorrah and over all the land of the plain[a], and he saw, and behold, smoke was rising from the land like the smoke of a furnace.
translation:
  language: te
  text: అతడు సొదొమ, గొమొర్రాల మీదికీ, మైదాన దేశమంతటి మీదికీ చూశాడు. అతడు చూశాడు; ఇదిగో, ఆ దేశం నుండి కొలిమి పొగలా[a] పొగ పైకి లేస్తోంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “బట్టీ పొగలా.”
    reason: כִּבְשָׁן అనే హీబ్రూ పదం కొలిమిని లేదా కాల్చే బట్టీని సూచించవచ్చు.
lexical_decisions:
- source_word: וַיַּשְׁקֵף עַל־פְּנֵי
  choice: వైపు చూశాడు
  rationale: ఎత్తైన ప్రదేశం నుండి ఒక ప్రాంతాన్ని వీక్షించే భావాన్ని సందర్భానుగుణంగా సహజమైన తెలుగులో తెలియజేస్తుంది; నిలువు దిశను అవసరానికి మించి నిర్దిష్టం చేయదు.
- source_word: סְדֹם וַעֲמֹרָה
  choice: సొదొమ, గొమొర్రా
  rationale: తెలుగులో విస్తృతంగా గుర్తించదగిన ప్రామాణిక స్థలనామ రూపాలు.
- source_word: כָּל־פְּנֵי אֶרֶץ הַכִּכָּר
  choice: మైదాన ప్రాంతమంతటి వైపూ
  rationale: כִּכָּר ఇక్కడ యొర్దాను మైదాన ప్రాంతాన్ని సూచిస్తుంది. ఈ అనువాదం భౌగోళిక భావాన్ని సహజంగా అందిస్తూ, ‘ముఖమంతా’ అనే కృత్రిమ పదప్రయోగాన్ని నివారిస్తుంది.
- source_word: וַיַּרְא
  choice: అతడు చూశాడు
  rationale: ראה అనే క్రియ యొక్క సరళమైన అర్థాన్ని, మూలంలోని కథన క్రమాన్ని నిలుపుతుంది.
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: హఠాత్తుగా కంటపడిన దృశ్యాన్ని సజీవంగా చూపించే మూలపాఠంలోని సంభాషణ సూచక బలాన్ని నిలుపుతుంది.
- source_word: עָלָה קִיטֹר הָאָרֶץ
  choice: ఆ ప్రాంతం నుండి పొగ ... పైకి లేస్తుండడం
  rationale: కనిపిస్తున్న పొగ పైకి ఎగసే కొనసాగుతున్న దృశ్యాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; הָאָרֶץను స్థానిక సందర్భానికి అనుగుణంగా ‘ఆ ప్రాంతం’గా అనువదించింది.
- source_word: כְּקִיטֹר הַכִּבְשָׁן
  choice: కొలిమి పొగలా
  rationale: כִּבְשָׁןకు ‘కొలిమి’ లేదా ‘బట్టీ’ అనే అర్థాలు సాధ్యమవుతాయి. ప్రధాన పాఠంలో సులభంగా అర్థమయ్యే ‘కొలిమి’ని ఉంచి, ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలిపింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కథన శైలిని వాడింది. మూలంలోని ‘చూశాడు ... అతడు చూశాడు’ అనే దృశ్య క్రమాన్నీ, וְהִנֵּה యొక్క సజీవతను ‘ఇదిగో’ ద్వారా నిలిపింది. పాదసూచిక గుర్తును దాని నిజమైన పదసంబంధమైన ‘కొలిమి పొగలా’ వద్ద ఉంచింది.
