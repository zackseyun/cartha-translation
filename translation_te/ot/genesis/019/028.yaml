revisions:
- from: అతడు సొదొమ, గొమొర్రాల వైపూ, మైదాన ప్రాంతమంతటి వైపూ చూశాడు. ఇదిగో, ఆ ప్రాంతం నుండి పొగ కొలిమి పొగలా[a] పైకి లేస్తుండడం అతడు చూశాడు.
  to: అతడు సొదొమ, గొమొర్రాల మీదికీ, మైదాన దేశమంతటి మీదికీ చూశాడు. అతడు చూశాడు; ఇదిగో, ఆ దేశం నుండి కొలిమి పొగలా[a] పొగ పైకి లేస్తోంది.
  rationale: The revision replaces the awkward repeated directional phrasing with Telugu that conveys looking over an expanse, restores the two explicit narrative verbs, and retains the vivid ‘ఇదిగో’ presentation. The local referent of הָאָרֶץ is kept as ‘ఆ దేశం,’ while preserving the source image of smoke rising from it and the lexical alternative for כִּבְשָׁן.
