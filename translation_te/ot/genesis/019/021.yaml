  text: וַ/יֹּ֣אמֶר אֵלָ֔י/ו הִנֵּה֙ נָשָׂ֣אתִי פָנֶ֔י/ךָ גַּ֖ם לַ/דָּבָ֣ר הַ/זֶּ֑ה לְ/בִלְתִּ֛י הָפְכִּ֥/י אֶת הָ/עִ֖יר אֲשֶׁ֥ר דִּבַּֽרְתָּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/021.yaml
  text: 'And he said to him[a], “Look, I grant you this request also: I will not overthrow the city of which you have spoken.”'
translation:
  language: te
  text: అతడు అతనితో, “ఇదిగో, ఈ విషయంలో కూడా నీ మనవిని అంగీకరించాను[a]. నీవు చెప్పిన ఆ పట్టణాన్ని నేను కూలదోయను” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ నుడికారంలో అక్షరార్థం: “నీ ముఖాన్ని ఎత్తాను”; అంటే, “నీ పట్ల అనుగ్రహం చూపాను” లేదా “నీ మనవిని అంగీకరించాను.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: ఇదిగో
  rationale: సంభాషణలో శ్రద్ధను ఆకర్షించే హీబ్రూ పదం యొక్క బలాన్ని సహజమైన, గౌరవప్రదమైన తెలుగులో నిలుపుతుంది.
- source_word: נָשָׂאתִי פָנֶיךָ
  choice: నీ మనవిని అంగీకరించాను
  rationale: అక్షరార్థంగా ‘నీ ముఖాన్ని ఎత్తాను’ అనే ఈ హీబ్రూ నుడికారం ఇక్కడ లోతు చేసిన విన్నపాన్ని అనుకూలంగా స్వీకరించడాన్ని సూచిస్తుంది. పూర్తి క్రియారూపాన్ని ‘అంగీకరించాను’ నిలుపుతుంది.
- source_word: גַּם לַדָּבָר הַזֶּה
  choice: ఈ విషయంలో కూడా
  rationale: דָּבָר ఇక్కడ లోతు ఇప్పుడే ప్రస్తావించిన విషయాన్ని సూచిస్తుంది; גַּם యొక్క అదనపు భావాన్ని ‘కూడా’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: לְבִלְתִּי הָפְכִּי
  choice: నేను నాశనం చేయను
  rationale: הפך యొక్క మూలభావం తలకిందులు చేయడం లేదా కూలదోయడం అయినా, పట్టణంపై సంభవించే విపత్తును ఆధునిక తెలుగులో సహజంగా ‘నాశనం చేయను’ తెలియజేస్తుంది.
- source_word: הָעִיר אֲשֶׁר דִּבַּרְתָּ
  choice: నీవు చెప్పిన ఆ పట్టణాన్ని
  rationale: లోతు ప్రస్తావించిన నిర్దిష్ట పట్టణాన్ని సూచించే సంబంధ వాక్యాన్ని స్పష్టమైన తెలుగు పదక్రమంలో అందిస్తుంది.
