source:
  edition: WLC
  text: וַ/יַּעַל֩ ל֨וֹט מִ/צּ֜וֹעַר וַ/יֵּ֣שֶׁב בָּ/הָ֗ר וּ/שְׁתֵּ֤י בְנֹתָי/ו֙ עִמּ֔/וֹ כִּ֥י יָרֵ֖א לָ/שֶׁ֣בֶת בְּ/צ֑וֹעַר וַ/יֵּ֨שֶׁב֙ בַּ/מְּעָרָ֔ה ה֖וּא וּ/שְׁתֵּ֥י בְנֹתָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/030.yaml
  text: Then Lot went up from Zoar and lived in the mountains[a], and his two daughters were with him, because he was afraid to live in Zoar. So he lived in a cave, he and his two daughters.
translation:
  language: te
  text: అప్పుడు లోతు సోయరు నుండి కొండ ప్రాంతానికి ఎక్కి వెళ్లి కొండ ప్రాంతంలో నివసించాడు; అతని ఇద్దరు కుమార్తెలు అతనితో ఉన్నారు. సోయరులో నివసించడానికి అతడు భయపడ్డాడు కాబట్టి, అతడు ఒక గుహలో[a] నివసించాడు—అతడూ అతని ఇద్దరు కుమార్తెలూ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీలో, “ఆ గుహలో.” ఇక్కడున్న నిర్దిష్ట ఉపపదం అతడు నివసించిన ప్రత్యేక గుహను సూచించవచ్చు; అయితే ఆ గుహను ఇంతకుముందు ప్రస్తావించలేదు కాబట్టి తెలుగులో “ఒక గుహలో” అని అనడం సహజం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: ఎక్కి వెళ్లి
  rationale: עלה అనే క్రియలో ఉన్న పైకి వెళ్లే భౌగోళిక దిశను సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: מִצּוֹעַר
  choice: సోయరు నుండి
  rationale: מן అనే విభక్త్యర్థకం స్థలం నుండి బయలుదేరడాన్ని సూచిస్తుంది; స్థలనామాన్ని సోయరు అని లిప్యంతరీకరించాం.
- source_word: וַיֵּשֶׁב
  choice: నివసించాడు
  rationale: ఈ కథన సందర్భంలో ישב కూర్చోవడం కంటే ఒక చోట ఉండి జీవించడాన్ని సూచిస్తుంది.
- source_word: בָּהָר
  choice: కొండ ప్రాంతానికి
  rationale: ఏకవచన הַר ఇక్కడ భూభాగాన్ని సమష్టిగా సూచించగలదు; తెలుగు వాడుకలో ‘కొండ ప్రాంతం’ సహజంగా ఉండి మూలంలోని భౌగోళిక భావాన్ని కాపాడుతుంది.
- source_word: וּשְׁתֵּי בְנֹתָיו עִמּוֹ
  choice: అతని ఇద్దరు కుమార్తెలు అతనితో ఉన్నారు
  rationale: హెబ్రీలో క్రియలేని అనుబంధ వాక్యాన్ని సహజమైన తెలుగులో స్పష్టమైన వాక్యంగా అందిస్తుంది.
- source_word: כִּי יָרֵא
  choice: భయపడ్డాడు కాబట్టి
  rationale: כִּי ఇక్కడ కారణాన్ని పరిచయం చేస్తుంది; יָרֵא అతని భయస్థితిని తెలియజేస్తుంది.
- source_word: לָשֶׁבֶת בְּצֹעַר
  choice: సోయరులో నివసించడానికి
  rationale: ముందటి ישבతో అనుసరణను ఉంచుతూ, నివాస భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: בַּמְּעָרָה
  choice: ఒక గుహలో
  rationale: మూలంలో నిర్దిష్ట ఉపపదం ఉన్నప్పటికీ, ఈ నివాస స్థలం కథనంలో మొదటిసారి ప్రస్తావించబడుతున్నందున ఆధునిక తెలుగులో ‘ఒక గుహలో’ సహజం; అక్షరార్థ ప్రత్యామ్నాయం పాదటిప్పణిలో ఉంచబడింది.
- source_word: הוּא וּשְׁתֵּי בְנֹתָיו
  choice: అతడూ అతని ఇద్దరు కుమార్తెలూ
  rationale: గుహలో ఉన్నవారిని మళ్లీ నొక్కిచెప్పే మూలంలోని ముగింపు పదబంధాన్ని నిలుపుతుంది.
