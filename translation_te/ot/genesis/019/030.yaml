translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన కథన శైలి. మూలంలోని పైకి వెళ్లే దిశ, కారణ సంబంధం, చివరి పునరుద్ఘాటన నిలుపబడ్డాయి.
