revisions:
- from: అప్పుడు లోతు సోయరు నుండి కొండ ప్రాంతానికి ఎక్కి వెళ్లి అక్కడ నివసించాడు; అతని ఇద్దరు కుమార్తెలు అతనితో ఉన్నారు. సోయరులో నివసించడానికి అతడు భయపడ్డాడు కాబట్టి, అతడూ అతని ఇద్దరు కుమార్తెలూ ఒక గుహలో[a] నివసించారు.
  to: అప్పుడు లోతు సోయరు నుండి కొండ ప్రాంతానికి ఎక్కి వెళ్లి కొండ ప్రాంతంలో నివసించాడు; అతని ఇద్దరు కుమార్తెలు అతనితో ఉన్నారు. సోయరులో నివసించడానికి అతడు భయపడ్డాడు కాబట్టి, అతడు ఒక గుహలో[a] నివసించాడు—అతడూ అతని ఇద్దరు కుమార్తెలూ.
  rationale: 'The revision restores the Hebrew syntax and emphasis in the final clause: Lot is the one said to have lived in the cave, while the final phrase identifies him together with his two daughters. It also makes the hill-country residence phrase more directly correspond to the Hebrew locative expression while retaining natural Telugu.'
