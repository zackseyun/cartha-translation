id: GEN.19.11
reference: Genesis 19:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְֽ/אֶת הָ/אֲנָשִׁ֞ים אֲשֶׁר פֶּ֣תַח הַ/בַּ֗יִת הִכּוּ֙ בַּ/סַּנְוֵרִ֔ים מִ/קָּטֹ֖ן וְ/עַד גָּד֑וֹל וַ/יִּלְא֖וּ לִ/מְצֹ֥א הַ/פָּֽתַח־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/011.yaml
  text: And they struck the men who were at the entrance of the house with blindness[a], from the least to the greatest, so that they wore themselves out trying to find the doorway.
translation:
  language: te
  text: ఇంటి ప్రవేశద్వారం దగ్గర ఉన్న పురుషులను వారు చిన్నవారి నుండి పెద్దవారి వరకు అంధత్వంతో[a] కొట్టారు. అప్పుడు వారు ద్వారాన్ని కనుగొనడానికి అలసిపోయారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మిరుమిట్లు గొలిపే స్థితితో’ లేదా ‘దృష్టి గందరగోళంతో.’ ఇక్కడి అరుదైన హీబ్రూ పదం సాధారణ అంధత్వం కంటే భిన్నమైన దృష్టి వైకల్యాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִכּוּ
  choice: మొత్తారు
  rationale: נכה హిఫిల్ రూపం ‘కొట్టు/దెబ్బతీయు’ అనే భావాన్ని ఇస్తుంది. ఇక్కడ శారీరక దెబ్బకన్నా ఒక స్థితికి గురిచేయడం సందర్భార్థం; ‘మొత్తారు’ మూలంలోని బలమైన క్రియను నిలుపుతుంది.
- source_word: הָאֲנָשִׁים
  choice: మనుషులను
  rationale: ఈ సందర్భంలో లోతు ఇంటి బయట గుమికూడిన పురుషులనే సూచిస్తుంది; ‘మనుషులు’ ఆధునిక తెలుగులో సహజంగా ఉండి హీబ్రూ బహువచనాన్ని ప్రతిబింబిస్తుంది.
- source_word: אֲשֶׁר פֶּתַח הַבַּיִת
  choice: ఇంటి ప్రవేశద్వారం దగ్గర ఉన్న
  rationale: పదబంధం వారి స్థానాన్ని తెలియజేస్తుంది. ‘ప్రవేశద్వారం దగ్గర’ అనేది פתח యొక్క ‘ద్వారం/ప్రవేశం’ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: בַּסַּנְוֵרִים
  choice: దృష్టి మసకబారే అంధత్వంతో
  rationale: అరుదైన סַנְוֵרִים సాధారణ అంధత్వమే కాక దృష్టిని గందరగోళపరిచే మిరుమిట్లు లేదా మసక స్థితిని సూచించవచ్చు. ప్రధాన పాఠంలో రెండు భావాలనూ సంక్షిప్తంగా ఉంచి, అనిశ్చితిని పాదటిప్పణిలో వివరించాం.
- source_word: מִקָּטֹן וְעַד גָּדוֹל
  choice: చిన్నవాడి నుంచి పెద్దవాడి వరకు
  rationale: హీబ్రూ విస్తారార్థక జంటను రూపపరంగా నిలుపుతుంది; ఇది వయస్సు లేదా హోదాలోని ప్రతి ఒక్కరినీ సమగ్రంగా సూచించవచ్చు.
- source_word: וַיִּלְאוּ
  choice: అలసిపోయారు
  rationale: לָאָה అలసిపోవడం లేదా శక్తి ఉడిగిపోవడాన్ని సూచిస్తుంది. పునరుక్త ‘వెదికి వెదికి’ వారి విఫలమైన నిరంతర ప్రయత్నాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: לִמְצֹא הַפָּתַח
  choice: ద్వారం వెదికి వెదికి
  rationale: ద్వారాన్ని కనుగొనాలనే విఫల ప్రయత్నాన్ని సహజ తెలుగు క్రియారూపంలో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: סַנְוֵרִים అనే బాధ స్వభావం
  choice: దృష్టి మసకబారే అంధత్వం
  alternative: అంధత్వం; మిరుమిట్లు; దృష్టి గందరగోళం
  rationale: ఈ అరుదైన హీబ్రూ పదం దేవుని వల్ల కలిగిన దృష్టి వైకల్యాన్ని స్పష్టంగా సూచించినా, అది సంపూర్ణ సాధారణ అంధత్వమా లేక దృష్టిని గందరగోళపరిచే మిరుమిట్ల స్థితియా అనేది ఖచ్చితంగా చెప్పదు. అనిశ్చితిని పరిష్కరించకుండా ప్రధాన పాఠం మరియు పాదటిప్పణిలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే శైలి. మూలంలోని క్రియాబలం, సమగ్రతను తెలిపే ‘చిన్నవాడి నుంచి పెద్దవాడి వరకు,’ అలాగే అరుదైన దృష్టి-వైకల్య పదంలోని అనిశ్చితి సంరక్షించబడ్డాయి.
