revisions:
- from: ఇంటి ప్రవేశద్వారం దగ్గర ఉన్న మనుషులను వారు చిన్నవాడి నుంచి పెద్దవాడి వరకు దృష్టి మసకబారే అంధత్వంతో[a] మొత్తారు. దాంతో వారు ద్వారం వెదికి వెదికి అలసిపోయారు.
  to: ఇంటి ప్రవేశద్వారం దగ్గర ఉన్న పురుషులను వారు చిన్నవారి నుండి పెద్దవారి వరకు అంధత్వంతో[a] కొట్టారు. అప్పుడు వారు ద్వారాన్ని కనుగొనడానికి అలసిపోయారు.
  rationale: The revision replaces an unsuitable verb with a direct equivalent of the Hebrew ‘struck,’ uses a clear contextual term for the male group, and keeps ‘blindness’ in the main text while preserving the rare term’s possible nuance in the footnote. It also renders the inclusive merism without imposing an age-only interpretation.
