source:
  edition: WLC
  text: וַֽ/יהוָ֗ה הִמְטִ֧יר עַל סְדֹ֛ם וְ/עַל עֲמֹרָ֖ה גָּפְרִ֣ית וָ/אֵ֑שׁ מֵ/אֵ֥ת יְהוָ֖ה מִן הַ/שָּׁמָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/024.yaml
  text: Then Yahweh rained sulfur and fire on Sodom and Gomorrah from Yahweh out of the heavens[a][b].
translation:
  language: te
  text: అప్పుడు యెహోవా సొదొమ మీద, గొమొర్రా మీద గంధకాన్నీ అగ్నినీ యెహోవా నుండి, ఆకాశాల నుండి కురిపించాడు.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: సాంప్రదాయిక అనువాదాల్లో ‘గంధకాగ్ని’ వంటి పదప్రయోగం కనిపించవచ్చు. హీబ్రూ గָּפְרִית అనే పదం నిర్దిష్టంగా ‘గంధకం’ను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా, ‘యెహోవా నుండి, ఆకాశాల నుండి’ అని ఉంది. మూలంలో దైవనామం రెండుసార్లు ఉన్నందున అనువాదంలో కూడా ఆ పునరుక్తిని నిలుపుతున్నాం.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామంలోని నాలుగు హల్లులను సూచించే, తెలుగులో విస్తృతంగా పరిచయమైన రూపం; మూలంలో రెండుసార్లు ఉన్న దైవనామాన్ని రెండుసార్లూ నిలుపుతుంది.
- source_word: הִמְטִיר
  choice: కురిపించాడు
  rationale: హిఫీల్ రూపంలోని ‘వర్షంలా కురిపించు’ భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: גָּפְרִית
  choice: గంధకం
  rationale: ఈ నామవాచకానికి ఆధునిక, నిర్దిష్టమైన తెలుగు సమానార్థకం; పాతకాలపు అస్పష్ట పదాన్ని నివారిస్తుంది.
- source_word: אֵשׁ
  choice: అగ్ని
  rationale: మూలంలోని అగ్ని భావాన్ని గౌరవప్రదమైన, సులభంగా అర్థమయ్యే పదంతో నేరుగా అందిస్తుంది.
- source_word: עַל סְדֹם וְעַל עֲמֹרָה
  choice: సొదొమ మీద, గొమొర్రా మీద
  rationale: ప్రతి పట్టణానికి ముందు పునరుక్తమైన עַלను నిలుపుతూ తీర్పు లక్ష్యాన్ని స్పష్టంగా చూపుతుంది.
- source_word: מֵאֵת יְהוָה
  choice: యెహోవా దగ్గరనుండి
  rationale: మూలం స్పష్టంగా తెలిపే మూలం లేదా ఉద్భవాన్ని నిలుపుతుంది; రెండో దైవనామాన్ని తొలగించదు.
- source_word: מִן הַשָּׁמָיִם
  choice: ఆకాశాలనుండి
  rationale: హీబ్రూ పదంలోని బహువచన రూపాన్ని సాధ్యమైనంత స్పష్టంగా కాపాడుతుంది.
- source_word: וַ
  choice: అప్పుడు
  rationale: కథన క్రమాన్ని ఆధునిక తెలుగులో సహజంగా ముందుకు నడిపిస్తుంది.
theological_decisions:
- issue: ‘యెహోవా ... యెహోవా దగ్గరనుండి’ అనే దైవనామ పునరుక్తి
  choice: రెండు చోట్లా దైవనామాన్ని ప్రధాన పాఠ్యంలో నిలుపడం
  alternative: ‘యెహోవా ఆకాశం నుండి ... కురిపించాడు’ అని పునరుక్తిని తొలగించడం
  rationale: హీబ్రూ మూలం యెహోవా అనే నామాన్ని స్పష్టంగా రెండుసార్లు వాడుతుంది. దాని సంబంధమైన దైవశాస్త్ర ప్రశ్నను అనువాదం స్వయంగా పరిష్కరించకుండా మూలంలోని ఉద్వేగాన్ని నిలుపుతుంది.
- issue: מֵאֵת יְהוָה מִן הַשָּׁמָיִם వాక్యభాగపు సంబంధం
  choice: ‘అవి ... వచ్చాయి’ అనే వ్యాకరణ సహాయంతో గంధకం, అగ్ని ఎక్కడినుండి వచ్చాయో స్పష్టం చేయడం
  alternative: ‘యెహోవా ... యెహోవా దగ్గరనుండి ఆకాశాలనుండి కురిపించాడు’ అనే అత్యంత రూపానుగుణ నిర్మాణం
  rationale: తెలుగులో అసహజమైన లేదా కర్త తన దగ్గరనుండే కురిపించినట్టు ముందుగానే వివరణ ఇచ్చే నిర్మాణాన్ని నివారిస్తూ, మూలంలోని రెండో దైవనామం మరియు పరలోక మూలం రెండింటినీ నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన కథన శైలి. ‘గంధకం’ శాస్త్రీయంగా స్పష్టమైన సాధారణ పదం. హీబ్రూ బహువచనాన్ని ప్రతిబింబించేందుకు ‘ఆకాశాలు’ వాడబడింది; అసాధారణమైన దైవనామ పునరుక్తిని వ్యాఖ్యానాత్మకంగా సరళీకరించలేదు.
