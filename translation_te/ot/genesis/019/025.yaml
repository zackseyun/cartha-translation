id: GEN.19.25
reference: Genesis 19:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַֽ/יַּהֲפֹךְ֙ אֶת הֶ/עָרִ֣ים הָ/אֵ֔ל וְ/אֵ֖ת כָּל הַ/כִּכָּ֑ר וְ/אֵת֙ כָּל יֹשְׁבֵ֣י הֶ/עָרִ֔ים וְ/צֶ֖מַח הָ/אֲדָמָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/025.yaml
  text: And he overthrew those cities[a], and all the plain, and all the inhabitants of the cities[b], and the vegetation of the ground.
translation:
  language: te
  text: ఆ పట్టణాలను, ఆ మైదాన ప్రాంతమంతటినీ[b], ఆ పట్టణాల నివాసులందరినీ, నేలలోని సమస్త వృక్షసంపదను తలకిందులు చేశాడు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘తలకిందులు చేశాడు’ అనే హీబ్రూ క్రియకు ‘కూలదోశాడు’ అని కూడా అర్థం చెప్పవచ్చు; అది విపత్తుతో పూర్తిగా తారుమారు చేయడాన్ని నొక్కిచెబుతుంది.
    reason: lexical_alternative
  - marker: b
    text: ఈ సందర్భంలో ‘మైదాన ప్రాంతం’ అంటే యొర్దాను మైదాన పరిసర ప్రాంతం.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּהֲפֹךְ
  choice: తలకిందులు చేశాడు
  rationale: הפך అనే క్రియ ఇక్కడ విపత్తుతో కూడిన తలకిందులు చేయడం లేదా కూలదోయడం అనే స్పష్టమైన రూపకాన్ని కలిగి ఉంది. సాధారణమైన ‘నాశనం చేశాడు’ కంటే ‘తలకిందులు చేశాడు’ మూలంలోని దృశ్యాన్ని కాపాడుతుంది.
- source_word: הֶעָרִים הָאֵל
  choice: ఆ పట్టణాలను
  rationale: אֵל అనే సూచనపదం ముందుగా ప్రస్తావించిన నిర్దిష్ట పట్టణాలను తిరిగి సూచిస్తుంది; ఆధునిక తెలుగు కథనంలో ‘ఆ పట్టణాలను’ సహజంగా ఉంది.
- source_word: כָּל הַכִּכָּר
  choice: ఆ మైదాన ప్రాంతమంతటినీ
  rationale: כִּכָּר ఈ సందర్భంలో యొర్దాను మైదానానికి చెందిన మొత్తం పరిసర ప్రాంతాన్ని సూచిస్తుంది. ‘మైదాన ప్రాంతం’ భౌగోళిక భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: כָּל יֹשְׁבֵי הֶעָרִים
  choice: ఆ పట్టణాల నివాసులందరినీ
  rationale: ישב నుండి వచ్చిన కృదంత రూపం పట్టణాల్లో నివసించేవారిని సూచిస్తుంది; ‘నివాసులు’ సంక్షిప్తంగా, సహజంగా, అర్థస్పష్టంగా ఉంది.
- source_word: צֶמַח הָאֲדָמָה
  choice: నేలపై మొలిచిన సమస్తాన్నీ
  rationale: צֶמַח మొలిచిన పెరుగుదలను లేదా వృక్షసంపదను, אֲדָמָה నేలను సూచిస్తాయి. ఈ ప్రయోగం మూలంలోని వ్యవసాయ, భౌతిక భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: ఏకవచన పురుష క్రియకు అంతర్నిహిత కర్త
  choice: కర్తకు ప్రత్యేక నామం లేదా సర్వనామం చేర్చకుండా, ‘చేశాడు’ అనే ఏకవచన పురుష క్రియతో అనువదించబడింది.
  alternative: ‘ఆయన’ లేదా ‘యెహోవా/దేవుడు’ అని కర్తను స్పష్టంగా పేర్కొనడం.
  rationale: హీబ్రూ వాక్యంలో క్రియ ఏకవచన పురుష రూపంలో ఉన్నా, ఈ ఉపవాక్యంలో కర్తకు ప్రత్యేక నామం లేదు; ముందరి సందర్భం కర్తను గుర్తిస్తుంది. తెలుగు క్రియారూపమే కర్త లక్షణాన్ని తెలియజేయగలదు కాబట్టి, మూలంలో లేని నామాన్ని చేర్చకుండా సందర్భ సంబంధం మరియు మూలంలోని నిర్మాణం రెండూ కాపాడబడ్డాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన కథన శైలి వాడబడింది. కర్తను అనవసరంగా పేరుపెట్టి స్పష్టీకరించకుండా తెలుగు క్రియలోనే ఉంచారు; మూలంలోని సమాంతర కర్మల వరుసను నిలిపారు.
