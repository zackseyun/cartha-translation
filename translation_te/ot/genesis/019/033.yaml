source:
  edition: WLC
  text: וַ/תַּשְׁקֶ֧יןָ אֶת אֲבִי/הֶ֛ן יַ֖יִן בַּ/לַּ֣יְלָה ה֑וּא וַ/תָּבֹ֤א הַ/בְּכִירָה֙ וַ/תִּשְׁכַּ֣ב אֶת אָבִ֔י/הָ וְ/לֹֽא יָדַ֥ע בְּ/שִׁכְבָ֖/הּ וּ/בְ/קׄוּמָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/033.yaml
  text: So they gave their father wine to drink that night[a], and the firstborn went in and lay with her father. He did not know when she lay down or when she arose.
translation:
  language: te
  text: ఆ రాత్రి వారు తమ తండ్రికి ద్రాక్షామద్యం తాగించారు. పెద్ద కుమార్తె లోపలికి వెళ్లి తన తండ్రితో పడుకుంది. ఆమె పడుకున్నప్పుడుగానీ లేచినప్పుడుగానీ అతనికి తెలియలేదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత అక్షరార్థంగా: “ఆమె పడుకోవడంలోను ఆమె లేవడంలోను.”'
    reason: హీబ్రూ పదబంధాల నిర్మాణాన్ని చూపించే అక్షరార్థ ప్రత్యామ్నాయం.
lexical_decisions:
- source_word: וַתַּשְׁקֶיןָ
  choice: వారు తమ తండ్రికి ... తాగించారు
  rationale: שׁקה హిఫీల్ రూపం ‘తాగించు’ అనే కారక భావాన్ని ఇస్తుంది. తెలుగు వాక్యంలో ఇది సహజంగాను మూలంలోని భావానికి దగ్గరగాను ఉంది.
- source_word: יַיִן
  choice: ద్రాక్షారసం
  rationale: ייןకు సాధారణ తెలుగు బైబిలు సందర్భంలో స్పష్టమైన, గౌరవప్రదమైన పదం; ఇది మత్తు కలిగించే ద్రాక్షతో చేసిన పానీయాన్ని సూచిస్తుంది.
- source_word: בַּלַּיְלָה הוּא
  choice: ఆ రాత్రి
  rationale: నిర్దిష్టమైన గత రాత్రిని సూచించే సహజ తెలుగు కాలవ్యక్తీకరణ.
- source_word: הַבְּכִירָה
  choice: పెద్ద కుమార్తె
  rationale: స్త్రీలింగంలోని ‘మొదట పుట్టినది’ అనే భావాన్ని సందర్భానుసారంగా సహజ తెలుగులో తెలియజేస్తుంది; ఆమె లోతు పెద్ద కుమార్తె అని ముందటి సందర్భం స్పష్టం చేస్తుంది.
- source_word: וַתָּבֹא
  choice: లోపలికి వెళ్లి
  rationale: తండ్రి ఉన్న చోటికి ప్రవేశించడాన్ని కథన దృష్టికోణంలో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וַתִּשְׁכַּב אֶת
  choice: తన తండ్రితో పడుకుంది
  rationale: ఈ నిర్మాణం లైంగిక సంబంధానికి వాడే హీబ్రూ సౌమ్యోక్తి. తెలుగు పదబంధం మూలంలోని సంయమనభరిత కథన శైలిని నిలుపుతుంది.
- source_word: וְלֹא יָדַע
  choice: అతనికి తెలియలేదు
  rationale: ידע ఇక్కడ అవగాహన లేకపోవడాన్ని సూచిస్తుంది. తరువాతి రెండు కాలసూచక పదబంధాలతో సహజంగా అనుసంధానమవుతుంది.
- source_word: בְּשִׁכְבָהּ וּבְקוּמָהּ
  choice: ఆమె పడుకున్నప్పుడుగానీ లేచినప్పుడుగానీ
  rationale: రెండు ఇన్ఫినిటివ్ నిర్మాణాల కాల/పరిస్థితి భావాన్ని సహజ తెలుగులో సమాంతరంగా వ్యక్తం చేస్తుంది; మూలంలో లేని ‘అతనితో’ అనే మాటను ఈ చివరి ఉపవాక్యంలో జోడించదు.
theological_decisions:
- issue: లోతు అవగాహన స్థాయి
  choice: ఆమె పడుకున్న సమయమూ లేచిన సమయమూ అతనికి తెలియలేదని మాత్రమే చెప్పడం
  alternative: జరిగిన దాని గురించి అతనికి అసలేమీ తెలియలేదని విస్తరించి చెప్పడం
  rationale: మూలపాఠం అతని అవగాహన లేకపోవడాన్ని ఆమె పడుకోవడం, లేవడం అనే రెండు సందర్భాలకు నేరుగా అనుసంధానిస్తుంది. దానిని మరింత విస్తరించడం లేదా పరిమితం చేయడం వ్యాఖ్యానాత్మకమవుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన కథన శైలి వాడబడింది. లైంగిక చర్యకు మూలంలోని సౌమ్యోక్తిని నిలుపుతూ ‘పడుకుంది’ అని అనువదించబడింది. పాదసూచిక గుర్తు అది వివరిస్తున్న చివరి వాక్యభాగం వద్ద ఉంచబడింది.
