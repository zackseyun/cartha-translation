revisions:
- from: ఆ రాత్రి కూడా వారు తమ తండ్రికి ద్రాక్షారసం తాగించారు. చిన్న కుమార్తె లేచి అతనితో పడుకుంది; ఆమె ఎప్పుడు పడుకుందో, ఎప్పుడు లేచిందో అతనికి తెలియలేదు.
  to: ఆ రాత్రి కూడా వారు తమ తండ్రికి తాగడానికి ద్రాక్షారసం ఇచ్చారు. చిన్న కుమార్తె లేచి అతనితో పడుకుంది; ఆమె ఎప్పుడు పడుకుందో, ఎప్పుడు లేచిందో అతనికి తెలియలేదు.
  rationale: 'A small revision to the opening verb more closely represents the Hebrew causative while maintaining natural modern Telugu. No footnote is required: the source wording is represented directly, and the English audit footnote offers only a formal stylistic alternative, not a distinct textual issue.'
