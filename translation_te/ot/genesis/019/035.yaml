id: GEN.19.35
reference: Genesis 19:35
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/תַּשְׁקֶ֜יןָ גַּ֣ם בַּ/לַּ֧יְלָה הַ/ה֛וּא אֶת אֲבִי/הֶ֖ן יָ֑יִן וַ/תָּ֤קָם הַ/צְּעִירָה֙ וַ/תִּשְׁכַּ֣ב עִמּ֔/וֹ וְ/לֹֽא יָדַ֥ע בְּ/שִׁכְבָ֖/הּ וּ/בְ/קֻמָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/035.yaml
  text: So they also gave their father wine to drink that night[a], and the younger arose and lay with him, and he did not know when she lay down or when she arose.
translation:
  language: te
  text: ఆ రాత్రి కూడా వారు తమ తండ్రికి తాగడానికి ద్రాక్షారసం ఇచ్చారు. చిన్న కుమార్తె లేచి అతనితో పడుకుంది; ఆమె ఎప్పుడు పడుకుందో, ఎప్పుడు లేచిందో అతనికి తెలియలేదు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתַּשְׁקֶיןָ
  choice: వారు ... తాగించారు
  rationale: שׁקה హిఫీల్ రూపంలోని కారణార్థాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; క్రియలోనే ‘మత్తెక్కించారు’ అనే మరింత బలమైన వ్యాఖ్యానాన్ని చేర్చదు.
- source_word: גַּם
  choice: కూడా
  rationale: మునుపటి రాత్రి జరిగినదానికి కొనసాగింపును సూచిస్తుంది.
- source_word: בַּלַּיְלָה הַהוּא
  choice: ఆ రాత్రి
  rationale: హీబ్రూ కాలసూచక పదబంధానికి సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: אֶת אֲבִיהֶן יָיִן
  choice: తమ తండ్రికి ద్రాక్షారసం
  rationale: తండ్రి తాగించబడిన వ్యక్తి, ద్రాక్షారసం తాగించిన పదార్థం అనే నిర్మాణాన్ని తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: וַתָּקָם הַצְּעִירָה
  choice: చిన్న కుమార్తె లేచి
  rationale: స్త్రీలింగంలోని ‘చిన్నది’ అనే భావాన్ని సందర్భానుసారంగా ‘చిన్న కుమార్తె’ అని స్పష్టం చేస్తుంది; కథన క్రమాన్ని నిలుపుతుంది.
- source_word: וַתִּשְׁכַּב עִמּוֹ
  choice: అతనితో పడుకుంది
  rationale: లైంగిక సంబంధాన్ని సూచించే హీబ్రూ నుడికారానికి దగ్గరగా ఉండి, తెలుగులో అర్థమయ్యే గంభీరమైన రూపం.
- source_word: וְלֹא יָדַע
  choice: అతనికి తెలియలేదు
  rationale: ידע ఇక్కడ అవగాహన లేకపోవడాన్ని సూచిస్తుంది; తెలుగులో సహజంగా ఆ భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: בְּשִׁכְבָהּ
  choice: ఆమె ఎప్పుడు పడుకుందో
  rationale: בְּ తో కూడిన క్రియానామ రూపాన్ని కాలార్థకంగా అనువదించి, మూలంలోని భావాన్ని సహజ తెలుగులో అందిస్తుంది.
- source_word: וּבְקֻמָהּ
  choice: ఎప్పుడు లేచిందో
  rationale: మునుపటి పదబంధంతో సమాంతరతను కాపాడుతూ కాలార్థాన్ని తెలుపుతుంది.
