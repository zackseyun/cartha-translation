- from: అయితే అతడు తాత్సారం చేస్తుండగా, యహ్వేకు అతని మీద కనికరం ఉండడంతో, ఆ మనుషులు[a] అతని చెయ్యినీ, అతని భార్య చెయ్యినీ, అతని ఇద్దరు కుమార్తెల చేతులనూ[b] గట్టిగా పట్టుకున్నారు. వారు అతణ్ణి బయటికి తీసుకువచ్చి నగరం వెలుపల ఉంచారు.
  to: అయితే అతడు ఆలస్యం చేయగా, యహ్వే అతనిపట్ల కనికరం చూపినందున ఆ మనుషులు[a] అతని చేతిని, అతని భార్య చేతిని, అతని ఇద్దరు కుమార్తెల చేతులను[b] గట్టిగా పట్టుకున్నారు. వారు అతన్ని బయటికి తీసుకువచ్చి నగరం వెలుపల ఉంచారు.
  rationale: The revision corrects the awkward causal construction while retaining its explicit connection to Yahweh’s compassion. It also uses a more direct narrative expression for Lot’s delay and standard formal hand forms (‘చేతిని/చేతులను’). The Hebrew’s repeated hand terminology, “the men,” and the singular reference to Lot in the final actions remain intact.
