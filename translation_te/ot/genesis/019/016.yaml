source:
  edition: WLC
  text: וַֽ/יִּתְמַהְמָ֓הּ וַ/יַּחֲזִ֨קוּ הָ/אֲנָשִׁ֜ים בְּ/יָד֣/וֹ וּ/בְ/יַד אִשְׁתּ֗/וֹ וּ/בְ/יַד֙ שְׁתֵּ֣י בְנֹתָ֔י/ו בְּ/חֶמְלַ֥ת יְהוָ֖ה עָלָ֑י/ו וַ/יֹּצִאֻ֥/הוּ וַ/יַּנִּחֻ֖/הוּ מִ/ח֥וּץ לָ/עִֽיר׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/016.yaml
  text: But he lingered[a], so the men seized his hand, his wife’s hand, and the hands of his two daughters, because of Yahweh’s compassion for him[b]; and they brought him out and set him outside the city.
translation:
  language: te
  text: అయితే అతడు ఆలస్యం చేయగా, యహ్వే అతనిపట్ల కనికరం చూపినందున ఆ మనుషులు[a] అతని చేతిని, అతని భార్య చేతిని, అతని ఇద్దరు కుమార్తెల చేతులను[b] గట్టిగా పట్టుకున్నారు. వారు అతన్ని బయటికి తీసుకువచ్చి నగరం వెలుపల ఉంచారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: సందర్భంలో వీరు దేవదూతలైన సందేశకులు; హీబ్రూ పాఠ్యం ఇక్కడ వారిని ‘మనుషులు’ అని అంటుంది.
    reason: contextual_identification
  - marker: b
    text: హీబ్రూ పాఠ్యంలో ‘అతని చెయ్యి, అతని భార్య చెయ్యి, అతని ఇద్దరు కుమార్తెల చేతులు’ అని ఉంది.
    reason: literal_wording
lexical_decisions:
- source_word: וַיִּתְמַהְמָהּ
  choice: తాత్సారం చేస్తుండగా
  rationale: ఈ క్రియ కేవలం మనసులో సందేహపడడాన్ని కాక, ఆలస్యం చేయడాన్ని సూచిస్తుంది. కథలోని అత్యవసరతకు ‘తాత్సారం చేయడం’ సరిపోతుంది.
- source_word: הָאֲנָשִׁים
  choice: ఆ మనుషులు
  rationale: సందర్భంలో వారు దేవదూతలైనప్పటికీ, ఈ వచనం వారిని నేరుగా ‘మనుషులు’ అని పిలుస్తుంది; అందువల్ల మూలంలోని కథనపదాన్ని ప్రధాన పాఠ్యంలో నిలిపాం.
- source_word: וַיַּחֲזִקוּ
  choice: గట్టిగా పట్టుకున్నారు
  rationale: ఈ నిర్మాణంలోని חזק బలంగా పట్టుకోవడాన్ని సూచిస్తుంది. రక్షణ చర్యలోని అత్యవసరతను ఈ సహజమైన తెలుగు ప్రయోగం తెలియజేస్తుంది.
- source_word: בְּיָדוֹ ... וּבְיַד אִשְׁתּוֹ ... וּבְיַד שְׁתֵּי בְנֹתָיו
  choice: అతని చెయ్యినీ, అతని భార్య చెయ్యినీ, అతని ఇద్దరు కుమార్తెల చేతులనూ
  rationale: మూలంలోని ‘చెయ్యి’ అనే పదపు పునరుక్తిని సాధ్యమైనంతవరకు నిలిపి, ఇద్దరు కుమార్తెల విషయంలో సహజమైన బహువచనాన్ని వాడాం.
- source_word: בְּחֶמְלַת יְהוָה עָלָיו
  choice: యహ్వేకు అతని మీద కనికరం ఉండడంతో
  rationale: חמלה కనికరం లేదా జాలిని సూచిస్తుంది; ב ఇక్కడ కారణాన్ని తెలియజేస్తుంది. ఈ అనువాదం రక్షణకు దేవుని కనికరమే కారణమని స్పష్టంగా ఉంచుతుంది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, సాధారణంగా పునర్నిర్మించబడిన ఉచ్చారణకు అనుగుణంగా తెలుగులో లిప్యంతరీకరించాం.
- source_word: וַיֹּצִאֻהוּ
  choice: వారు అతణ్ణి బయటికి తీసుకువచ్చి
  rationale: יצא హిఫీల్ రూపం ‘బయటికి వెళ్లేలా చేయడం’ అనే భావాన్ని ఇస్తుంది. మూలంలోని ఏకవచన పురుష కర్మప్రత్యయాన్ని ‘అతణ్ణి’గా నిలిపాం.
- source_word: וַיַּנִּחֻהוּ מִחוּץ לָעִיר
  choice: నగరం వెలుపల ఉంచారు
  rationale: נוח హిఫీల్ ఇక్కడ ఒక చోట ఉంచడాన్ని సూచిస్తుంది; מִחוּץ לָעִיר నగర సరిహద్దుల బయట ఉన్న స్థలాన్ని సూచిస్తుంది.
theological_decisions:
- issue: రక్షించినవారి కథనపరమైన గుర్తింపు
  choice: ఆ మనుషులు
  alternative: ఆ దేవదూతలు
  rationale: విస్తృత సందర్భం వారిని దేవదూతలుగా గుర్తించినా, ఈ వచనంలోని హీబ్రూ వారిని ‘మనుషులు’ అని పేర్కొంటుంది. వ్యాఖ్యానాన్ని ప్రధాన పాఠ్యంలో చేర్చకుండా మూలపదాన్ని నిలిపాం.
- issue: బయటికి తీసుకువచ్చిన వ్యక్తికి వాడిన కర్మప్రత్యయం
  choice: అతణ్ణి
  alternative: వారిని
  rationale: కుటుంబ సభ్యులందరి చేతులను పట్టుకున్నట్లు ముందుభాగం చెప్పినా, తరువాతి రెండు హీబ్రూ క్రియల కర్మప్రత్యయాలు ఏకవచన పురుష రూపంలో లోతును సూచిస్తాయి. భావాన్ని సులభతరం చేయడానికి దానిని బహువచనంగా మార్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా ఉండే కథనశైలిని వాడాం. ‘తాత్సారం’, ‘కనికరం’, ‘వెలుపల’ వంటి పదాలు సాధారణ పాఠకులకు అర్థమయ్యేలా ఉండి, వచన గాంభీర్యాన్ని నిలుపుతాయి. మూలంలోని ఏకవచన ‘అతణ్ణి’ వల్ల కలిగే కథన ఉద్రిక్తతను ఉద్దేశపూర్వకంగా కాపాడాం.
