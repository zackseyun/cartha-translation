source:
  edition: WLC
  text: טֶרֶם֮ יִשְׁכָּבוּ֒ וְ/אַנְשֵׁ֨י הָ/עִ֜יר אַנְשֵׁ֤י סְדֹם֙ נָסַ֣בּוּ עַל הַ/בַּ֔יִת מִ/נַּ֖עַר וְ/עַד זָקֵ֑ן כָּל הָ/עָ֖ם מִ/קָּצֶֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/004.yaml
  text: Before they lay down[a], the men of the city, the men of Sodom, surrounded the house—from young to old[c][b], all the people from every quarter.
translation:
  language: te
  text: వారు పడుకోకముందే, ఆ పట్టణపు పురుషులు, అంటే సొదొమ పురుషులు, యువకుల నుండి వృద్ధుల వరకు—పట్టణం నలుమూలల[b] నుండీ వచ్చిన ప్రజలందరూ—ఆ ఇంటిని చుట్టుముట్టారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “చుట్టుముట్టారు” అనే హీబ్రూ క్రియకు “ఇంటి చుట్టూ చేరారు” లేదా “ఇంటిని ఆవరించారు” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “నలుమూలల” అని అనువదించిన హీబ్రూ మాట అక్షరార్థంగా “అంచు నుండి” లేదా “చివర నుండి” అని ఉంటుంది; ఇక్కడ అది పట్టణంలోని ప్రతి భాగం నుండి అనే భావాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: טֶרֶם יִשְׁכָּבוּ
  choice: వారు పడుకోకముందే
  rationale: కాలసంబంధమైన טֶרֶםను సహజమైన తెలుగులో వ్యక్తం చేస్తూ, שׁכב యొక్క ‘పడుకోవడం’ అనే స్పష్టమైన భావాన్ని నిలుపుతుంది.
- source_word: אַנְשֵׁי הָעִיר אַנְשֵׁי סְדֹם
  choice: ఆ పట్టణపు పురుషులు—సొదొమ పురుషులు
  rationale: మూలంలోని పురుషవాచక పదప్రయోగాన్నీ, రెండవ పదబంధం మొదటిదాన్ని గుర్తించే సమానాధికరణ నిర్మాణాన్నీ నిలుపుతుంది.
- source_word: נָסַבּוּ עַל הַבַּיִת
  choice: ఆ ఇంటిని చుట్టుముట్టారు
  rationale: נסב עם על ఇక్కడ ఇంటి చుట్టూ గుంపుగా చేరి ఆవరించిన భావాన్ని ఇస్తుంది; సందర్భంలోని నిర్బంధక స్వరాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: מִנַּעַר וְעַד זָקֵן
  choice: యువకుని మొదలుకొని వృద్ధుని వరకు
  rationale: యువ వయస్సు నుండి వృద్ధాప్యం వరకు అన్న సమగ్ర వయోపరిధిని సూచించే ద్వంద్వోక్తిని తెలుగులో నిలుపుతుంది.
- source_word: כָּל הָעָם
  choice: ప్రజలందరూ
  rationale: עָם అనే సమూహవాచక పదానికి సహజమైన తెలుగు; వాక్యారంభంలోని ‘పురుషులు’ అనే నిర్దిష్టతను మార్చకుండా, తరువాతి విస్తృత సమూహపదాన్ని ప్రతిబింబిస్తుంది.
- source_word: מִקָּצֶה
  choice: పట్టణం నలుమూలల నుండివచ్చిన
  rationale: అక్షరార్థంగా ‘అంచు/చివర నుండి’; ఈ సందర్భంలో పట్టణంలోని అన్ని వైపుల నుంచి వచ్చిన సమూహాన్ని సూచించే సహజమైన నుడికార రూపం.
theological_decisions:
- issue: గుంపును సూచించే లింగభేద పదప్రయోగం
  choice: אַנְשֵׁיను ‘పురుషులు’గా, כָּל הָעָםను ‘ప్రజలందరూ’గా అనువదించడం
  alternative: రెండు పదప్రయోగాలనూ లింగనిరపేక్షంగా ‘ప్రజలు’ అని అనువదించడం
  rationale: హీబ్రూ మొదట ఉద్దేశపూర్వకంగా పురుషవాచక పదాన్ని వాడి, తరువాత సమూహవాచకమైన עָםను వాడుతుంది. ఈ వ్యత్యాసాన్ని నిలపడం మూలపాఠాన్ని చదునుచేయకుండా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే శైలి. హీబ్రూ వాక్యంలోని సమానాధికరణ పునరుక్తిని డాష్‌లతో నిలిపి, తెలుగులో సహజమైన పదక్రమం కోసం వయోపరిధి మరియు ప్రాంతవ్యాప్తిని క్రియకు ముందు అమర్చాం.
