- from: వారు పడుకోకముందే, ఆ పట్టణపు పురుషులు—సొదొమ పురుషులు—యువకుని మొదలుకొని వృద్ధుని వరకు, పట్టణం నలుమూలల నుండివచ్చిన ప్రజలందరూ, ఆ ఇంటిని చుట్టుముట్టారు.[a][b]
