  text: וַ/יְהִי֩ כְ/הוֹצִיאָ֨/ם אֹתָ֜/ם הַ/ח֗וּצָ/ה וַ/יֹּ֨אמֶר֙ הִמָּלֵ֣ט עַל נַפְשֶׁ֔/ךָ אַל תַּבִּ֣יט אַחֲרֶ֔י/ךָ וְ/אַֽל תַּעֲמֹ֖ד בְּ/כָל הַ/כִּכָּ֑ר הָ/הָ֥רָ/ה הִמָּלֵ֖ט פֶּן תִּסָּפֶֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/017.yaml
  text: And as they brought them outside[a], he said, “Escape for your life. Do not look behind you, and do not stop anywhere in the plain. Escape to the hills[c][b], lest you be swept away.”
translation:
  language: te
  text: 'వారు వారిని బయటికి తీసుకొచ్చినప్పుడు, అతడు[a] ఇలా అన్నాడు: “నీ ప్రాణం కాపాడుకోవడానికి పారిపో! నీ వెనక్కి చూడకు; ఈ మైదాన ప్రాంతంలో ఎక్కడా ఆగకు. కొండ ప్రాంతానికి[b] పారిపో; లేకపోతే నువ్వు నాశనమైపోతావు[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘అతడు’ ఎవరో హీబ్రూ పాఠం ఇక్కడ ప్రత్యేకంగా చెప్పదు; క్రియ మాత్రం ఏకవచనంలో ఉంది.
    reason: narrative_ambiguity
  - marker: b
    text: లేదా, ‘కొండకు’ లేదా ‘కొండల ప్రాంతానికి.’
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘నువ్వు తుడిచిపెట్టుకుపోతావు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחוּצָה
  choice: బయటికి
  rationale: దిశను సూచించే ఈ రూపం నగరం లేదా లోపలి ప్రదేశం నుంచి వెలుపలికి తీసుకురావడాన్ని తెలియజేస్తుంది; ‘బయటికి’ సహజమైన ఆధునిక తెలుగు.
- source_word: הִמָּלֵט
  choice: పారిపో
  rationale: ముప్పు నుంచి తక్షణమే తప్పించుకోవాలనే ఆజ్ఞను తెలియజేస్తుంది. రెండు చోట్లా ఒకే పదాన్ని వాడి మూలంలోని పునరుక్తిని నిలిపాం.
- source_word: עַל נַפְשֶׁךָ
  choice: నీ ప్రాణం కాపాడుకోవడానికి
  rationale: ఇది ప్రాణరక్షణ కోసం తప్పించుకోవడాన్ని సూచించే హీబ్రూ నుడికారం; తెలుగులో ఉద్దేశం, అత్యవసరత రెండూ స్పష్టంగా వినిపిస్తాయి.
- source_word: אַל תַּבִּיט אַחֲרֶיךָ
  choice: నీ వెనక్కి చూడకు
  rationale: వ్యక్తి తన వెనుకవైపు చూడకూడదనే ఆజ్ఞను సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: וְאַל תַּעֲמֹד
  choice: ఎక్కడా ఆగకు
  rationale: ఈ హెచ్చరిక సందర్భంలో క్రియ కేవలం నిలబడటాన్ని కాక, పారిపోతూ మధ్యలో ఆగిపోవడాన్ని సూచిస్తుంది.
- source_word: בְּכָל הַכִּכָּר
  choice: ఈ మైదాన ప్రాంతంలో ఎక్కడా
  rationale: כִּכָּר ఇక్కడ యొర్దాను పరిసర మైదాన ప్రాంతాన్ని సూచిస్తుంది; בְּכָל యొక్క విస్తృత నిషేధ భావాన్ని ‘ఎక్కడా’ తెలియజేస్తుంది.
- source_word: הָהָרָה
  choice: కొండ ప్రాంతానికి
  rationale: దిశార్థక రూపం కొండకు లేదా కొండల ప్రాంతానికి వెళ్లడాన్ని సూచించగలదు. మైదాన ప్రాంతంతో ఉన్న భౌగోళిక వ్యత్యాసాన్ని ‘కొండ ప్రాంతం’ సహజంగా నిలుపుతుంది.
- source_word: פֶּן תִּסָּפֶה
  choice: లేకపోతే నువ్వు నాశనమైపోతావు
  rationale: రాబోయే విపత్తులో చిక్కుకొని నశించే ప్రమాదాన్ని సూచిస్తుంది. ‘లేకపోతే’ ఆ హెచ్చరిక భావాన్ని తెలుగులో నేరుగా అందిస్తుంది.
theological_decisions:
- issue: మాట్లాడిన వ్యక్తి గుర్తింపు
  choice: ‘అతడు అన్నాడు’ అనే ఏకవచన రూపాన్ని నిలిపాం.
  alternative: సందేశకుల సమూహాన్ని ఉద్దేశించి ‘వారు అన్నారు’ అని భావానువాదం చేయడం, లేదా ‘దూత అన్నాడు’ అని స్పష్టీకరించడం.
  rationale: హీబ్రూ క్రియ ఏకవచనంలో ఉంది; అయితే ‘అతడు’ ఎవరో ఈ వాక్యం స్వయంగా నిర్దిష్టంగా చెప్పదు. అందువల్ల దూత అని చేర్చకుండా వ్యాకరణ ఏకవచనాన్ని, కథనంలోని అనిశ్చితిని నిలిపాం.
- issue: פֶּן תִּסָּפֶה లోని నాశన భావం
  choice: ‘నాశనమైపోతావు’
  alternative: ‘తుడిచిపెట్టుకుపోతావు’ లేదా ‘నశించిపోతావు’
  rationale: ఈ క్రియ విపత్తులో ఇతరులతో పాటు కొట్టుకుపోవడం లేదా నశించడం అనే భావాలను కలిగి ఉండగలదు. ప్రధాన పాఠంలో విస్తృతమైన ‘నాశనమైపోతావు’ అని ఇచ్చి, మరింత చిత్రాత్మకమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైనా సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలిని వాడాం. లోతు/స్పష్టత కోసం మూలంలోని సర్వనామాలను అనవసరంగా పేర్లతో భర్తీ చేయలేదు; ఆజ్ఞల అత్యవసరతను చిన్న, నేర వాక్యాలతో నిలిపాం.
