  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: הִנֵּה נָ֠א הָ/עִ֨יר הַ/זֹּ֧את קְרֹבָ֛ה לָ/נ֥וּס שָׁ֖מָּ/ה וְ/הִ֣יא מִצְעָ֑ר אִמָּלְטָ֨ה נָּ֜א שָׁ֗מָּ/ה הֲ/לֹ֥א מִצְעָ֛ר הִ֖וא וּ/תְחִ֥י נַפְשִֽׁ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/020.yaml
  text: Look[a], please, this city is near enough to flee there, and it is small[b]. Please let me escape there—is it not small? Then my life will live.
translation:
  language: te
  text: “ఇదిగో, దయచేసి, ఈ పట్టణం అక్కడికి పారిపోవడానికి దగ్గరగా ఉంది, అది చిన్నది. దయచేసి నన్ను అక్కడికి తప్పించుకొని వెళ్లనివ్వండి—అది చిన్నదే కదా? అప్పుడు నేను బ్రతుకుతాను.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה נָא
  choice: ఇదిగో, దయచేసి చూడండి!
  rationale: הִנֵּה యొక్క దృష్టిని ఆకర్షించే బలాన్ని, నָא లోని వేడుకోలు భావాన్ని సహజమైన ఆధునిక తెలుగులో కలిపి వ్యక్తం చేస్తుంది.
- source_word: הָעִיר הַזֹּאת
  choice: ఆ పట్టణం
  rationale: మాట్లాడుతున్న లోతు తనకు, ఎదుటివారికి కనిపిస్తున్న నిర్దిష్ట స్థలాన్ని చూపిస్తున్నందున తెలుగు సందర్భంలో ‘ఆ’ సహజం. ఇక్కడ చిన్న నివాసస్థలమనే వాదనకు ‘పట్టణం’ అనుకూలంగా ఉంది.
- source_word: קְרֹבָה לָנוּס שָׁמָּה
  choice: పారిపోవడానికి ... దగ్గరలోనే ఉంది
  rationale: సమీపత్వాన్నీ, అక్కడికి పారిపోవాలనే ఉద్దేశాన్నీ సహజంగా తెలియజేస్తుంది; ‘నే’ అత్యవసర వాదనను బలపరుస్తుంది.
- source_word: וְהִיא מִצְעָר
  choice: అది చిన్నది
  rationale: מִצְעָר యొక్క చిన్నదనం లేదా అల్పత్వం అనే ప్రాథమిక భావాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: אִמָּלְטָה נָּא שָׁמָּה
  choice: దయచేసి నన్ను అక్కడికి తప్పించుకొని పోనివ్వండి
  rationale: కోహోర్టేటివ్ రూపంలోని వేడుకోలును, מלט లోని ప్రమాదం నుంచి తప్పించుకునే భావాన్ని రెండింటినీ వ్యక్తం చేస్తుంది.
- source_word: הֲלֹא מִצְעָר הִוא
  choice: అది చిన్నదే కదా?
  rationale: הֲלֹא సూచించే సమ్మతి ఆశించే అలంకారప్రశ్నను సహజమైన తెలుగులో నిలుపుతుంది; మునుపటి ‘చిన్నది’ అనే పదాన్ని పునరావృతం చేస్తుంది.
- source_word: וּתְחִי נַפְשִׁי
  choice: అప్పుడు నేను బ్రతుకుతాను
  rationale: נֶפֶשׁ ఇక్కడ వ్యక్తినే సూచించే హీబ్రూ ప్రయోగం; పదశః ‘నా ప్రాణం బ్రతుకుతుంది’ అని కాకుండా దాని సహజ అర్థాన్ని అందిస్తుంది. వావ్ ముందు అభ్యర్థన ఫలితాన్ని సూచిస్తుంది.
