translation_notes:
  register: గౌరవపూర్వక బహువచన సంబోధనతో అత్యవసరమైన వేడుకోలు స్వరాన్ని నిలిపి, ఆధునిక ప్రామాణిక తెలుగులో సహజంగా రూపొందించబడింది. హీబ్రూ నెఫెష్ ప్రయోగాన్ని అతిగా ఆధ్యాత్మికీకరించకుండా ‘నేను బ్రతుకుతాను’గా ఇచ్చాం.
