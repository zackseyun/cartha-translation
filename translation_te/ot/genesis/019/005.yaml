language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּקְרְא֤וּ אֶל לוֹט֙ וַ/יֹּ֣אמְרוּ ל֔/וֹ אַיֵּ֧ה הָ/אֲנָשִׁ֛ים אֲשֶׁר בָּ֥אוּ אֵלֶ֖י/ךָ הַ/לָּ֑יְלָה הוֹצִיאֵ֣/ם אֵלֵ֔י/נוּ וְ/נֵדְעָ֖ה אֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/005.yaml
  text: And they called to Lot and said to him[a], “Where are the men who came to you tonight? Bring them out to us so that we may know them.”
translation:
  language: te
  text: 'వారు లోతును పిలిచి అతనితో ఇలా అన్నారు: “ఈ రాత్రి నీ దగ్గరకు వచ్చిన ఆ పురుషులు ఎక్కడ ఉన్నారు? మేము వారిని తెలుసుకోవడానికి వారిని మా దగ్గరకు బయటికి రప్పించు.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרְאוּ אֶל־לוֹט
  choice: వారు లోతును పిలిచి
  rationale: קרא אל అనే ప్రయోగం ఇక్కడ ఎవరినైనా ఉద్దేశించి పిలవడం అనే సాధారణ అర్థాన్ని ఇస్తుంది; మూలంలో లేని తీవ్రతను ‘అరిచారు’ అని చేర్చలేదు.
- source_word: אַיֵּה הָאֲנָשִׁים
  choice: ఆ పురుషులు ఎక్కడ ఉన్నారు?
  rationale: אֲנָשִׁים ఇక్కడ లోతు ఇంటికి వచ్చిన పురుష సందర్శకులను స్పష్టంగా సూచిస్తుంది; తెలుగు వాక్యనిర్మాణానికి సహజంగా ‘ఎక్కడ ఉన్నారు’ అని ఇచ్చాం.
- source_word: בָּאוּ אֵלֶיךָ הַלָּיְלָה
  choice: ఈ రాత్రి నీ దగ్గరకు వచ్చిన
  rationale: הַלָּיְלָה ప్రస్తుత రాత్రిని సూచిస్తుంది; ‘ఈ రాత్రి’ ఆధునిక తెలుగులో సహజమైన కాలవ్యక్తీకరణ.
- source_word: הוֹצִיאֵם אֵלֵינוּ
  choice: వారిని మా దగ్గరకు బయటికి తీసుకురా
  rationale: יצא యొక్క హిఫీల్ రూపం ‘బయటికి వచ్చేలా చేయు/తీసుకురా’ అనే కారణార్థాన్ని కలిగి ఉంది; אֵלֵינוּ లోని ‘మా దగ్గరకు’ దిశను కూడా నిలిపాం.
- source_word: וְנֵדְעָה אֹתָם
  choice: మేము వారిని తెలుసుకునేలా
  rationale: ידע యొక్క ప్రత్యక్ష పదార్థం ‘తెలుసుకొను.’ సందర్భంలోని లైంగిక భావాన్ని ప్రధాన పాఠ్యంలో విప్పి చెప్పకుండా, మూలంలోని పదప్రయోగం మరియు ఉద్దేశపూర్వక ఉద్వేగాన్ని నిలిపి, పాదసూచికలో సందర్భార్థాన్ని తెలిపాం.
theological_decisions:
- issue: וְנֵדְעָה אֹתָם లోని ఉద్దేశాన్ని ప్రధాన పాఠ్యంలో లైంగికంగా స్పష్టం చేయాలా?
  choice: ప్రధాన పాఠ్యంలో ‘వారిని తెలుసుకునేలా’ అని మూల పదప్రయోగాన్ని నిలిపి, సందర్భంలోని లైంగిక భావాన్ని పాదసూచికలో వివరించడం.
  alternative: ‘వారితో లైంగిక సంబంధం పెట్టుకునేలా’ లేదా ‘వారిని లైంగికంగా హింసించేలా’ అని ప్రధాన పాఠ్యంలో స్పష్టంగా అనువదించడం.
  rationale: ידע సాధారణంగా ‘తెలుసుకొను’ అని అర్థం. ఈ సందర్భం బలవంతపు లైంగిక ఉద్దేశాన్ని బలంగా సూచించినప్పటికీ, దాన్ని ప్రధాన పాఠ్యంలో పూర్తిగా విప్పి చెప్పడం మూలంలోని పదరూపం కంటే వ్యాఖ్యానాన్ని ముందుకు తెస్తుంది. పాదసూచిక భావాన్ని స్పష్టం చేస్తూనే మూలంలోని సాహిత్య ఉద్వేగాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలిని వాడాం. ‘పురుషులు’ ద్వారా సందర్శకుల లింగసూచనను నిలిపాం. లైంగిక ఉద్దేశాన్ని అతిగా మృదువుచేయకుండా పాదసూచికలో స్పష్టం చేశాం; ‘హింస’ అనే అంశం సందర్భంలో సాధ్యమైనప్పటికీ ఆ పదాన్ని మూలంలో ప్రత్యక్షంగా లేకపోవడంతో అనువాదంలో చేర్చలేదు.
