source:
  edition: WLC
  text: וַ/יְהִ֗י בְּ/שַׁחֵ֤ת אֱלֹהִים֙ אֶת עָרֵ֣י הַ/כִּכָּ֔ר וַ/יִּזְכֹּ֥ר אֱלֹהִ֖ים אֶת אַבְרָהָ֑ם וַ/יְשַׁלַּ֤ח אֶת לוֹט֙ מִ/תּ֣וֹךְ הַ/הֲפֵכָ֔ה בַּ/הֲפֹךְ֙ אֶת הֶ֣/עָרִ֔ים אֲשֶׁר יָשַׁ֥ב בָּ/הֵ֖ן לֽוֹט־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/029.yaml
  text: So it happened[a], when God destroyed the cities of the plain, that God remembered Abraham and sent Lot out of the midst of the overthrow[d][c][b], when he overthrew the cities in which Lot had lived.
translation:
  language: te
  text: 'దేవుడు మైదాన ప్రాంతంలోని పట్టణాలను నాశనం చేసినప్పుడు ఇలా జరిగింది: దేవుడు అబ్రాహామును జ్ఞాపకం చేసుకున్నాడు[a], మరియు లోతు నివసించిన ఆ పట్టణాలను ఆయన తలకిందులు చేసినప్పుడు, ఆ తలకిందులు చేయడంలోని మధ్యనుండి లోతును బయటికి పంపించాడు[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘దేవుడు అబ్రాహామును జ్ఞాపకం చేసుకున్నాడు’ అనేది దేవుడు అతన్ని మరచిపోయాడని కాదు; అబ్రాహాము పట్ల శ్రద్ధతో కార్యం చేశాడని తెలిపే హీబ్రూ ప్రయోగం.
    reason: cultural_note
  - marker: b
    text: ‘తలకిందులు చేయడం’కు వాడిన హీబ్రూ నామవాచకం, ‘తలకిందులు చేసినప్పుడు’ అనే తరువాతి క్రియతో ఒకే మూలానికి చెందినది; అందువల్ల ‘ఆ తలకిందులు చేయడంలోనుండి’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בְּשַׁחֵת
  choice: నాశనం చేసినప్పుడు ఇలా జరిగింది
  rationale: וַיְהִי అనే కథన పరిచయాన్ని పూర్తిగా వదలకుండా, בְּ + infinitive construct యొక్క కాలార్థాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: עָרֵי הַכִּכָּר
  choice: మైదాన ప్రాంతంలోని పట్టణాలు
  rationale: כִּכָּר ఇక్కడ యొర్దాను మైదాన ప్రాంతాన్ని సూచిస్తుంది; ‘మైదాన ప్రాంతం’ సాధారణ పాఠకులకు స్పష్టంగా ఉంటుంది.
- source_word: וַיִּזְכֹּר אֱלֹהִים אֶת־אַבְרָהָם
  choice: దేవుడు అబ్రాహామును జ్ఞాపకం చేసుకొని
  rationale: దైవిక ‘జ్ఞాపకం చేసుకోవడం’ అనే హీబ్రూ ప్రయోగాన్ని వ్యాఖ్యానాత్మకంగా మార్చకుండా నిలుపుతుంది; తరువాతి చర్య దాని ఫలితాన్ని తెలియజేస్తుంది.
- source_word: וַיְשַׁלַּח אֶת־לוֹט
  choice: లోతును బయటికి పంపించాడు
  rationale: שׁלח యొక్క ప్రాథమికమైన ‘పంపు’ భావాన్ని కాపాడుతూ, ప్రమాదస్థలం నుండి బయటకు వెళ్లే దిశను తెలుగులో స్పష్టం చేస్తుంది.
- source_word: מִתּוֹךְ הַהֲפֵכָה
  choice: ఆ వినాశనం మధ్యనుండి
  rationale: תּוֹךְ లోని ‘మధ్య’ భావాన్నీ, הֲפֵכָה సూచించే ఘోర నాశనాన్నీ సహజమైన తెలుగులో అందిస్తుంది.
- source_word: בַּהֲפֹךְ
  choice: తలకిందులు చేసినప్పుడు
  rationale: הפך యొక్క తలకిందులు చేయడం/కూలదోయడం అనే చిత్రాత్మక భావాన్ని నిలుపుతూ కాలసంబంధాన్ని వ్యక్తం చేస్తుంది.
- source_word: אֲשֶׁר יָשַׁב בָּהֵן לוֹט
  choice: లోతు నివసించిన ఆ పట్టణాలు
  rationale: హీబ్రూలోని బహువచన సంబంధవాక్యాన్ని కాపాడి, ישׁב ను ఆధునిక తెలుగులో సహజమైన ‘నివసించు’గా అనువదిస్తుంది.
theological_decisions:
- issue: ‘దేవుడు అబ్రాహామును జ్ఞాపకం చేసుకున్నాడు’ అనే మాట యొక్క భావం
  choice: ప్రధాన పాఠ్యంలో ‘జ్ఞాపకం చేసుకొని’ అనే హీబ్రూ ప్రయోగాన్ని నిలిపివేయడం
  alternative: దేవుడు అబ్రాహాము నిమిత్తం చర్య తీసుకున్నాడు
  rationale: దేవుడు మరచిపోయాడనే అర్థం ఇక్కడ ఉద్దేశం కాదు; విశ్వాసపూర్వక శ్రద్ధ కార్యరూపం దాల్చడాన్ని ఈ ప్రయోగం సూచిస్తుంది. అయినప్పటికీ దానిని ప్రధాన పాఠ్యంలో విస్తరించడం మూలంలోని భావసాంద్రతను ముందుగానే పరిష్కరిస్తుంది.
- issue: లోతు విడుదలకు అబ్రాహాముతో ఉన్న సంబంధం
  choice: మూలం చెప్పినట్లుగా దేవుడు అబ్రాహామును జ్ఞాపకం చేసుకొని లోతును బయటికి పంపించాడని ఉంచడం
  alternative: అబ్రాహాము ప్రార్థనవల్లనే దేవుడు లోతును రక్షించాడు
  rationale: వాక్యం అబ్రాహాము పట్ల దేవుని జ్ఞాపకాన్నీ లోతు విడుదలనూ అనుసంధానిస్తుంది; అయితే ప్రార్థనకు ప్రత్యక్ష కారణత్వం వంటి అదనపు వివరణను మూలపాఠ్యం ఇక్కడ స్పష్టంగా చెప్పదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన కథన శైలి. ‘ఇలా జరిగింది’ ద్వారా హీబ్రూ కథన నిర్మాణం నిలిచింది. ‘వినాశనం’ సహజత కోసం ఎంచుకోబడగా, మూలంలోని పదప్రతిధ్వని పాదటిప్పణిలో చూపబడింది.
