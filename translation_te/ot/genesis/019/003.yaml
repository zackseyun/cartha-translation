source:
  edition: WLC
  text: וַ/יִּפְצַר בָּ֣/ם מְאֹ֔ד וַ/יָּסֻ֣רוּ אֵלָ֔י/ו וַ/יָּבֹ֖אוּ אֶל בֵּית֑/וֹ וַ/יַּ֤עַשׂ לָ/הֶם֙ מִשְׁתֶּ֔ה וּ/מַצּ֥וֹת אָפָ֖ה וַ/יֹּאכֵֽלוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/003.yaml
  text: But he urged them strongly[a], so they turned aside to him and entered his house. He prepared a feast for them, baked unleavened bread[b], and they ate.
translation:
  language: te
  text: అయితే అతడు వారిని ఎంతో పట్టుబట్టి కోరాడు[a]. అప్పుడు వారు అతని వద్దకు మళ్లి, అతని ఇంట్లోకి ప్రవేశించారు. అతడు వారికి విందు సిద్ధం చేసి, పులియని రొట్టెలు కాల్చాడు[b]; వారు తిన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వారిని ఎంతో గట్టిగా ఒత్తిడి చేశాడు’ లేదా ‘ఎంతో పట్టుబట్టాడు.’
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో, ‘పులియని రొట్టెలు’ లేదా ‘పులియని రొట్టె ముద్దలు’; పులియబెట్టే పదార్థం లేకుండా చేసిన రొట్టెలు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְצַר בָּם מְאֹד
  choice: వారిని ఎంతో బలంగా బతిమాలాడు
  rationale: פצר అనేది ఒకరిని గట్టిగా కోరడం లేదా పట్టుబట్టడం అనే భావాన్ని ఇస్తుంది; מְאֹד ఆ తీవ్రతను పెంచుతుంది. ఆధునిక తెలుగులో ‘ఎంతో బలంగా బతిమాలాడు’ సహజంగా ఉండి, లోతు యొక్క ఆతిథ్యపూర్వకమైన గట్టి అభ్యర్థనను తెలియజేస్తుంది.
- source_word: וַיָּסֻרוּ אֵלָיו
  choice: వారు అతని వైపు తిరిగి
  rationale: סור యొక్క ‘తిరుగు/పక్కకు మళ్లు’ అనే దిశాత్మక చిత్రాన్ని నిలుపుతూ, אֵלָיוను ‘అతని వైపు’గా స్పష్టంగా ప్రతిబింబిస్తుంది.
- source_word: וַיָּבֹאוּ אֶל־בֵּיתוֹ
  choice: అతని ఇంట్లోకి ప్రవేశించారు
  rationale: గమనాన్ని మరియు గమ్యస్థానాన్ని సహజమైన ఆధునిక తెలుగులో సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: מִשְׁתֶּה
  choice: విందు
  rationale: ఈ పదం భోజన విందు లేదా పానసహిత విందును సూచించగలదు. సందర్భం మద్యాన్ని ప్రత్యేకంగా ముందుకు తేవనందున విస్తృతార్థకమైన ‘విందు’ సరైనది.
- source_word: מַצּוֹת
  choice: పులియని రొట్టెలు
  rationale: పులియబెట్టే పదార్థం లేకుండా చేసిన రొట్టెలను సూచించే బహువచన రూపాన్ని తెలుగులో స్పష్టంగా, సహజంగా అందిస్తుంది.
- source_word: אָפָה
  choice: కాల్చాడు
  rationale: రొట్టెలను వేడితో తయారుచేసే చర్యకు ‘కాల్చాడు’ సహజమైన తెలుగు వాడుక; హీబ్రూ క్రియను స్పష్టంగా నిలుపుతుంది.
- source_word: וַיֹּאכֵלוּ
  choice: వారు తిన్నారు
  rationale: సందర్శకులు సిద్ధం చేసిన ఆహారాన్ని తిన్నారనే సరళమైన కథన ముగింపును నేరుగా తెలియజేస్తుంది.
