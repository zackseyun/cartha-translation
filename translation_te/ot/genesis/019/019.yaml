id: GEN.19.19
reference: Genesis 19:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: הִנֵּה נָ֠א מָצָ֨א עַבְדְּ/ךָ֣ חֵן֮ בְּ/עֵינֶי/ךָ֒ וַ/תַּגְדֵּ֣ל חַסְדְּ/ךָ֗ אֲשֶׁ֤ר עָשִׂ֨יתָ֙ עִמָּדִ֔/י לְ/הַחֲי֖וֹת אֶת נַפְשִׁ֑/י וְ/אָנֹכִ֗י לֹ֤א אוּכַל֙ לְ/הִמָּלֵ֣ט הָ/הָ֔רָ/ה פֶּן תִּדְבָּקַ֥/נִי הָ/רָעָ֖ה וָ/מַֽתִּי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/019.yaml
  text: Look[a], please, your servant has found favor in your eyes, and you have made great your steadfast love that you have shown me by preserving my life. But I cannot escape to the mountain[b], lest the disaster overtake me and I die.
translation:
  language: te
  text: “దయచేసి చూడండి! మీ సేవకుడైన నాకు మీ దృష్టిలో అనుగ్రహం లభించింది. నా ప్రాణాన్ని కాపాడడం ద్వారా మీరు నాపట్ల చూపిన మీ స్థిరమైన ప్రేమను[a] ఎంతో గొప్పగా కనబరిచారు. అయితే నేను కొండకు తప్పించుకొని వెళ్లలేను; ఆ విపత్తు[b] నన్ను పట్టుకుంటే నేను చనిపోతానేమో.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “మీ దయను,” “మీ కరుణను,” లేదా “మీ నిబద్ధ కృపను.”
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా “ఆ చెడు”; ఇక్కడ భావం అతనిపై పడబోయే ఆపద లేదా విపత్తు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה נָא
  choice: దయచేసి చూడండి
  rationale: הִנֵּה శ్రద్ధను ఆకర్షిస్తుంది; נָא వినయపూర్వకమైన, అత్యవసర విన్నపాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ఈ రెండింటి సంభాషణాత్మక బలాన్ని ఈ పదబంధం సహజంగా తెలియజేస్తుంది.
- source_word: מָצָא ... חֵן בְּעֵינֶיךָ
  choice: మీ దృష్టిలో అనుగ్రహం లభించింది
  rationale: అనుకూల ఆదరణ పొందడాన్ని తెలిపే హీబ్రూ నుడికారాన్ని తెలుగు వాడుకకు తగిన విధంగా అందిస్తుంది; ‘మీ దృష్టిలో’ అనే మూలభాషా చిత్రాన్ని నిలుపుతుంది.
- source_word: עַבְדְּךָ
  choice: మీ సేవకుడైన నాకు
  rationale: ఇక్కడ ఇది బానిసత్వ స్థితిని ప్రధానంగా చెప్పడం కాక, ఉన్నతునితో మాట్లాడే వ్యక్తి వినయపూర్వకంగా తనను తాను సూచించుకునే మాట.
- source_word: וַתַּגְדֵּל חַסְדְּךָ
  choice: మీ స్థిరమైన ప్రేమను ఎంతో గొప్పగా కనబరిచారు
  rationale: גדל యొక్క తీవ్రతను ‘ఎంతో గొప్పగా’ నిలుపుతూ, חסד ను విశ్వసనీయమైన, కృపగల ప్రేమగా వ్యక్తం చేస్తుంది.
- source_word: עָשִׂיתָ עִמָּדִי
  choice: మీరు నాపట్ల చూపిన
  rationale: అక్షరార్థంగా ‘నాతో చేసిన’ అనే భావం ఉన్నా, ప్రేమ లేదా కృప సందర్భంలో ‘నాపట్ల చూపిన’ అనేది సహజమైన తెలుగు.
- source_word: לְהַחֲיוֹת אֶת נַפְשִׁי
  choice: నా ప్రాణాన్ని కాపాడి
  rationale: లోతు కలిగిన వేరొక మతశాస్త్రీయ పదాన్ని చేర్చకుండా, లోతు ప్రాణంతో ఉండేలా చేసిన కార్యాన్ని స్పష్టంగా చెబుతుంది.
- source_word: וְאָנֹכִי לֹא אוּכַל
  choice: అయితే నేను ... వెళ్లలేను
  rationale: אָנֹכִי లోని వ్యక్తిగత ఉద్ఘాటనను ‘నేను’ ద్వారా, ముందరి కృతజ్ఞతకు వ్యతిరేకతను ‘అయితే’ ద్వారా తెలియజేస్తుంది.
- source_word: לְהִמָּלֵט הָהָרָה
  choice: కొండకు తప్పించుకొని వెళ్లడం
  rationale: הָהָרָה లోని దిశార్థాన్ని ‘కొండకు’ నిలుపుతుంది; המלט లోని ప్రమాదం నుండి తప్పించుకునే భావాన్ని స్పష్టపరుస్తుంది.
- source_word: פֶּן תִּדְבָּקַנִי
  choice: నన్ను పట్టుకొని ... ఏమో
  rationale: פֶּן సూచించే భయపడుతున్న పరిణామాన్ని తెలుగు ‘ఏమో’ నిర్మాణం సహజంగా తెలియజేస్తుంది; דבק ఇక్కడ విపత్తు చేరి పట్టుకోవడం అనే సందర్భార్థంలో ఉంది.
- source_word: הָרָעָה
  choice: ఆ విపత్తు
  rationale: ఇక్కడ רעה నైతిక దుష్టత్వం కాక, లోతును తాకబోయే వినాశకరమైన ఆపదను సూచిస్తుంది.
theological_decisions:
- issue: దైవదూతల ద్వారా చూపబడిన חֶסֶד ను ఎలా అనువదించాలి
  choice: స్థిరమైన ప్రేమ
  alternative: దయ / కరుణ / నిబద్ధ కృప
  rationale: ఈ సందర్భంలో ప్రాణాన్ని కాపాడిన కృపగల, విశ్వసనీయమైన మేలును సూచిస్తుంది. ‘స్థిరమైన ప్రేమ’ దాని సంబంధపరమైన, మతశాస్త్రీయ లోతును ఉంచుతుంది; అయితే ఇక్కడ స్పష్టంగా లేని సాంకేతిక నిబంధనార్థాన్ని బలవంతంగా చేర్చదు.
- issue: הָרָעָה లోని ‘చెడు’ భావాన్ని నైతిక దుష్టత్వంగా తీసుకోవాలా, సంభవించే ఆపదగా తీసుకోవాలా
  choice: విపత్తు
  alternative: చెడు / కీడు
  rationale: సొదొమపై రాబోయే వినాశనం లోతును చేరి అతని మరణానికి కారణమవుతుందనే భయమే తక్షణ సందర్భం; కాబట్టి ఇది నైతిక చెడుకంటే విపత్తును సూచిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన ప్రత్యక్ష సంభాషణ. దైవదూతను ఉద్దేశించిన హీబ్రూ ఏకవచనాన్ని తెలుగులో సహజమైన గౌరవ బహువచన క్రియలతో వ్యక్తం చేశాం. వాక్యంలోని అత్యవసర విన్నప స్వరం, వినయం, భయపడుతున్న పరిణామం నిలుపబడ్డాయి.
