  to: “దయచేసి చూడండి! మీ సేవకుడైన నాకు మీ దృష్టిలో అనుగ్రహం లభించింది. నా ప్రాణాన్ని కాపాడడం ద్వారా మీరు నాపట్ల చూపిన మీ స్థిరమైన ప్రేమను[a] ఎంతో గొప్పగా కనబరిచారు. అయితే నేను కొండకు తప్పించుకొని వెళ్లలేను; ఆ విపత్తు[b] నన్ను పట్టుకుంటే నేను చనిపోతానేమో.”
