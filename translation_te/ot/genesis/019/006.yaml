revisions:
- from: లోతు వారి దగ్గరకు ద్వారప్రవేశం వరకు బయటికి వెళ్లి, తన వెనుక తలుపు మూసేశాడు.[a]
  to: లోతు ద్వారప్రవేశం వద్ద వారి దగ్గరకు బయటికి వెళ్లి, తన వెనుక తలుపును మూసేశాడు.[a]
  rationale: The revision replaces the endpoint-like “వరకు” with a natural locative expression that fits the Hebrew directional sense in context, improves clause flow, and adds the standard accusative marker. It preserves the source’s lexical distinction between the entrance/opening and the door, including in the footnote.
