  text: Lot went out to them at the entrance and shut the door behind him[a].
translation:
  language: te
  text: లోతు ద్వారప్రవేశం వద్ద వారి దగ్గరకు బయటికి వెళ్లి, తన వెనుక తలుపును మూసేశాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ద్వారప్రవేశానికి.’ హీబ్రూలో ప్రవేశస్థలం లేదా తెరువు (פֶּתַח), తలుపు (דֶּלֶת) అనే రెండు వేర్వేరు పదాలు ఉన్నాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: బయటికి వెళ్లి
  rationale: יצא అనే క్రియ కథనాన్ని ముందుకు నడిపే సాధారణ భూతకాల చర్యను సూచిస్తుంది; సందర్భంలోని బయటి దిశను సహజమైన తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: אֲלֵהֶם
  choice: వారి దగ్గరకు
  rationale: אֶל + బహువచన ప్రత్యయం బయట ఉన్నవారి వైపు కదలికను సూచిస్తుంది.
- source_word: לוֹט
  choice: లోతు
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: הַפֶּתְחָה
  choice: ద్వారప్రవేశం వరకు
  rationale: פֶּתַח అంటే తలుపు పలక కాకుండా ప్రవేశస్థలం లేదా తెరువు; దిశను సూచించే ה־ను ‘వరకు’తో వ్యక్తం చేసి, తరువాతి דֶּלֶתతో ఉన్న భేదాన్ని నిలిపింది.
- source_word: וְהַדֶּלֶת
  choice: తలుపు
  rationale: דֶּלֶת ప్రత్యేకంగా మూసే తలుపును సూచిస్తుంది; ముందున్న ‘ద్వారప్రవేశం’తో పదార్థభేదం కాపాడబడింది.
- source_word: סָגַר
  choice: మూసేశాడు
  rationale: సందర్భంలో తలుపును పూర్తిగా మూసిన కథన చర్యను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: אַחֲרָיו
  choice: తన వెనుక
  rationale: 'ఇక్కడ పదబంధం కాలార్థం కాక స్థలార్థంలో ఉంది: లోతు బయటికి వెళ్లిన తరువాత తలుపు అతని వెనుక ఉండగా దాన్ని మూసాడు.'
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘ద్వారప్రవేశం’ మరియు ‘తలుపు’ అనే పదాలతో మూలంలోని పదార్థభేదాన్ని ఉద్దేశపూర్వకంగా నిలిపింది.
