id: GEN.19.37
reference: Genesis 19:37
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/תֵּ֤לֶד הַ/בְּכִירָה֙ בֵּ֔ן וַ/תִּקְרָ֥א שְׁמ֖/וֹ מוֹאָ֑ב ה֥וּא אֲבִֽי מוֹאָ֖ב עַד הַ/יּֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/037.yaml
  text: The firstborn bore a son and called his name Moab[a]; he is the father of Moab to this day.
translation:
  language: te
  text: పెద్ద కుమార్తె ఒక కుమారుణ్ణి కని, అతనికి మోయాబు అని పేరు పెట్టింది. అతడే ఈనాటివరకు మోయాబు వంశానికి[a] మూలపురుషుడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘మోయాబుకు తండ్రి.’ ఇక్కడ ‘మోయాబు’ అనే పేరు అతని సంతతివారైన మోయాబీయులను, అంటే మోయాబు వంశాన్ని, సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּלֶד
  choice: కని
  rationale: యָלַד్ అనే క్రియ ఇక్కడ కుమారుణ్ణి కనడం అనే సాధారణ అర్థంలో ఉంది; ‘కని’ సహజమైన ఆధునిక తెలుగు కథన ప్రయోగం.
- source_word: הַבְּכִירָה
  choice: పెద్ద కుమార్తె
  rationale: స్త్రీలింగ ఏకవచన రూపం ‘మొదట పుట్టినది/పెద్దది’ అని అర్థం. సందర్భంలో లోతు పెద్ద కుమార్తెను సూచిస్తున్నందున స్పష్టత కోసం ‘పెద్ద కుమార్తె’ అని అనువదించబడింది.
- source_word: בֵּן
  choice: ఒక కుమారుణ్ణి
  rationale: ఇది జనన క్రియకు ప్రత్యక్ష కర్మ; తెలుగు వాక్య నిర్మాణంలో ‘ఒక కుమారుణ్ణి’ సహజంగా ఉంటుంది.
- source_word: וַתִּקְרָא שְׁמוֹ
  choice: అతనికి ... అని పేరు పెట్టింది
  rationale: హీబ్రూ నుడికారం అక్షరార్థంగా ‘అతని పేరును పిలిచింది’; ఆధునిక తెలుగులో ‘పేరు పెట్టింది’ అదే భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: מוֹאָב
  choice: మోయాబు
  rationale: వ్యక్తి/ప్రజల పేరును తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించబడింది.
- source_word: הוּא
  choice: అతడే
  rationale: స్వతంత్ర సర్వనామం ముందున్న మోయాబును తిరిగి సూచిస్తుంది; ‘అతడే’ దాని ఉద్ఘాటనను నిలుపుతుంది.
- source_word: אֲבִי מוֹאָב
  choice: మోయాబుకు మూలపురుషుడు
  rationale: అక్షరార్థం ‘మోయాబు తండ్రి’; ఇక్కడ మోయాబు ప్రజల వంశస్థాపక పూర్వికుడు అనే భావం ఉంది. ‘మూలపురుషుడు’ ఆ వంశపరమైన అర్థాన్ని సహజంగా వ్యక్తం చేస్తుంది; అక్షరార్థ నిర్మాణం పాదసూచికలో ఇవ్వబడింది.
- source_word: עַד הַיּוֹם
  choice: నేటివరకు
  rationale: కథకుని కాలం వరకు కొనసాగిన స్థితిని సూచించే హీబ్రూ నుడికారానికి సంక్షిప్తమైన సహజ తెలుగు సమానం.
