translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. ‘పెద్ద కుమార్తె’ సందర్భస్పష్టతను ఇస్తుంది; ‘మూలపురుషుడు’ హీబ్రూ వంశపరమైన భావాన్ని తెలియజేస్తూ అక్షరార్థాన్ని పాదసూచికలో కాపాడుతుంది.
