source:
  edition: WLC
  text: וַ/יֵּצֵ֨א ל֜וֹט וַ/יְדַבֵּ֣ר אֶל חֲתָנָ֣י/ו לֹקְחֵ֣י בְנֹתָ֗י/ו וַ/יֹּ֨אמֶר֙ ק֤וּמוּ צְּאוּ֙ מִן הַ/מָּק֣וֹם הַ/זֶּ֔ה כִּֽי מַשְׁחִ֥ית יְהוָ֖ה אֶת הָ/עִ֑יר וַ/יְהִ֥י כִ/מְצַחֵ֖ק בְּ/עֵינֵ֥י חֲתָנָֽי/ו׀־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/014.yaml
  text: So Lot went out and spoke to his sons-in-law[a], who were to marry his daughters, and said, “Get up, get out of this place[b], because Yahweh is about to destroy the city.” But he seemed to his sons-in-law to be joking.
translation:
  language: te
  text: లోతు బయటికి వెళ్లి, తన కుమార్తెలను పెళ్లి చేసుకోబోయే తన అల్లుళ్లతో[a] మాట్లాడాడు. అతడు, “లేచి, ఈ స్థలంనుంచి బయటికి వెళ్లండి! ఎందుకంటే యాహ్వే ఆ పట్టణాన్ని నాశనం చేయబోతున్నాడు” అన్నాడు. అయితే తన అల్లుళ్లకు అతడు సరదాగా మాట్లాడుతున్నవానిలా కనిపించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తన కుమార్తెలను పెళ్లి చేసుకున్న తన అల్లుళ్లతో.” హెబ్రీ పదబంధం వారు అప్పటికే పెళ్లి చేసుకున్నవారో, పెళ్లి చేసుకోబోతున్నవారో అనే రెండు భావాలకూ వీలు కల్పిస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: חֲתָנָיו
  choice: తన అల్లుళ్లతో
  rationale: חָתָן అనే పదం పెళ్లికుమారుడు లేదా అల్లుడు అనే అర్థాలను ఇవ్వగలదు. ఆధునిక తెలుగులో సంబంధాన్ని సహజంగా తెలిపేందుకు ‘అల్లుళ్లు’ వాడబడింది; వివాహ స్థితిలోని సందిగ్ధతను పాదటిప్పణి కాపాడుతుంది.
- source_word: לֹקְחֵי בְנֹתָיו
  choice: తన కుమార్తెలను పెళ్లి చేసుకోబోయే
  rationale: ‘తన కుమార్తెలను తీసుకునేవారు’ అనే హెబ్రీ భాగం వివాహ సంబంధాన్ని సూచిస్తుంది. సందర్భాన్ని బట్టి భావి/సమీప వివాహ భావం ప్రధాన పాఠ్యంలో ఇవ్వబడింది; పూర్తయిన వివాహం అనే సాధ్యతను పాదటిప్పణిలో ఉంచాం.
- source_word: קוּמוּ צְּאוּ
  choice: లేవండి, ... బయలుదేరండి!
  rationale: వరుసగా ఉన్న రెండు ఆజ్ఞల అత్యవసరతను, సహజమైన ఆధునిక తెలుగు వాక్యనిర్మాణాన్ని కాపాడుతుంది.
- source_word: מִן־הַמָּקוֹם הַזֶּה
  choice: ఈ చోటు నుంచి
  rationale: మూలంలోని నిర్దిష్ట స్థలసూచనను నేరుగా, సహజంగా అందిస్తుంది.
- source_word: מַשְׁחִית
  choice: నాశనం చేయబోతున్నాడు
  rationale: హిఫిల్ కృదంతం సందర్భంలో సమీప భవిష్యత్తులో సంభవించబోయే చర్యను సూచిస్తుంది; నాశనం ఇంకా మొదలుకాలేదనే కథనస్థితిని ఇది కాపాడుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: మూలంలోని దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ప్రత్యక్ష లిప్యంతరీకరణతో అందిస్తుంది.
- source_word: הָעִיר
  choice: ఈ పట్టణాన్ని
  rationale: నిర్దిష్ట ఉపపదం కథనంలో చర్చలో ఉన్న పట్టణాన్ని సూచిస్తుంది. తెలుగులో ‘ఈ పట్టణం’ సందర్భసూచనను సహజంగా స్పష్టం చేస్తుంది.
- source_word: כִּמְצַחֵק
  choice: హాస్యమాడుతున్నవాడిలా
  rationale: అతడు నిజంగా హాస్యమాడాడని కాక, అల్లుళ్లకు అలా కనిపించాడనే పోలికను ‘లా’ కాపాడుతుంది; ‘ఎగతాళి’ అనే బలమైన భావాన్ని అనవసరంగా చేర్చదు.
- source_word: בְּעֵינֵי
  choice: తన అల్లుళ్ల దృష్టికి
  rationale: ‘వారి కళ్లలో’ అనే హెబ్రీ నుడికారాన్ని తెలుగు నుడికారానికి అనుగుణంగా ఇస్తూ, అది వారి అంచనా మాత్రమేనని స్పష్టం చేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: వ్యక్తిగత దైవనామాన్ని ‘ప్రభువు’ వంటి బిరుదుగా మార్చకుండా లిప్యంతరీకరించాం. ఆధునిక తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం; మూల ఉచ్చారణకు సమీపమైన ‘యాహ్వే’ కూడా సాధ్యమైన రూపం.
- issue: లోతు కుమార్తెల వివాహ స్థితి
  choice: పెళ్లి చేసుకోబోయే అల్లుళ్లు
  alternative: అప్పటికే అతని కుమార్తెలను పెళ్లి చేసుకున్న అల్లుళ్లు
  rationale: לֹקְחֵי అనే కృదంతం వివాహం జరగబోతున్నదని లేదా జరిగిందని అర్థమివ్వగలదు. తరువాతి కథన సందర్భంతో సరిపోయే భావి అర్థాన్ని ప్రధాన పాఠ్యంలో ఎంచుకున్నప్పటికీ, మూలంలోని నిజమైన సందిగ్ధతను పాదటిప్పణిలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే కథనశైలి. ఆజ్ఞలలోని అత్యవసరతను నిలిపి, చివరి వాక్యంలో హెబ్రీ పోలికను సహజమైన తెలుగు రూపంలో కాపాడాం.
