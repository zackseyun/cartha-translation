  rationale: సవరించిన పాఠ్యం హెబ్రీలోని לֹקְחֵי בְנֹתָיו యొక్క వివాహస్థితి సందిగ్ధతను పాదటిప్పణిలో నిలిపి, కוּמוּ צְאוּ యొక్క ద్వంద్వ అత్యవసరతను ‘లేచి, ... బయటికి వెళ్లండి’తో అందిస్తుంది. מַשְׁחִית యొక్క సమీప చర్య ‘నాశనం చేయబోతున్నాడు’గా, כִמְצַחֵק యొక్క పోలిక ‘సరదాగా మాట్లాడుతున్నవానిలా’గా నిలిచాయి. దైవనామం ఆడిట్ ట్రయిల్‌కు అనుగుణంగా ‘యాహ్వే’గా సవరించబడింది.
