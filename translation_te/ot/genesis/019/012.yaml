id: GEN.19.12
reference: Genesis 19:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּאמְר֨וּ הָ/אֲנָשִׁ֜ים אֶל ל֗וֹט עֹ֚ד מִֽי לְ/ךָ֣ פֹ֔ה חָתָן֙ וּ/בָנֶ֣י/ךָ וּ/בְנֹתֶ֔י/ךָ וְ/כֹ֥ל אֲשֶׁר לְ/ךָ֖ בָּ/עִ֑יר הוֹצֵ֖א מִן הַ/מָּקֽוֹם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/012.yaml
  text: Then the men said to Lot[a], “Who else do you have here? A son-in-law, your sons, your daughters[c][b], and everyone who belongs to you in the city—bring them out of the place.”
translation:
  language: te
  text: అప్పుడు ఆ మనుషులు లోతుతో ఇలా అన్నారు, “ఇక్కడ నీకు ఇంకా ఎవరున్నారు? అల్లుడు, నీ కుమారులు, నీ కుమార్తెలు, పట్టణంలో నీకు చెందిన వారందరినీ ఈ స్థలం నుండి బయటికి తీసుకురా.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָאֲנָשִׁים
  choice: ఆ మనుషులు
  rationale: హీబ్రూ పదం సాధారణంగా ‘మనుషులు’ అని అర్థం. విస్తృత కథనం వారిని దేవదూతలుగా గుర్తించినప్పటికీ, ఈ వాక్యంలోని పదప్రయోగాన్ని ప్రధాన పాఠ్యంలో నిలుపుతున్నాం.
- source_word: עֹד מִי לְךָ פֹה
  choice: ఇక్కడ నీకు ఇంకా ఎవరున్నారు?
  rationale: లోతుతో సంబంధమున్న ఇతర వ్యక్తులు అక్కడ ఉన్నారా అని అడిగే హీబ్రూ నుడికారాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: חָתָן
  choice: అల్లుడు
  rationale: ఈ సందర్భంలో ఈ పదం లోతు కుమార్తెలకు కాబోయే లేదా అప్పటికే వివాహమైన భర్తను సూచించడం అత్యంత సహజం; హీబ్రూలో ఇది ఏకవచనం.
- source_word: וּבָנֶיךָ וּבְנֹתֶיךָ
  choice: నీ కుమారులు, నీ కుమార్తెలు
  rationale: స్వామ్యార్థక బహువచనాలను నేరుగా, స్పష్టంగా అనువదిస్తుంది.
- source_word: וְכֹל אֲשֶׁר לְךָ בָּעִיר
  choice: పట్టణంలో నీకు చెందిన వారందరినీ
  rationale: అక్షరార్థంగా ‘పట్టణంలో నీకు చెందినదంతా’ అనే విస్తృత భావం సాధ్యమైనా, బయటికి తీసుకురావలసిన వ్యక్తుల జాబితా అనే సందర్భంలో కుటుంబం లేదా ఇంటివారికి చెందిన ప్రజలను సూచించే వ్యక్తిగత రూపం సహజం.
- source_word: הוֹצֵא מִן הַמָּקוֹם
  choice: ఈ స్థలం నుంచి బయటికి తీసుకురా
  rationale: లోతును ఉద్దేశించిన ఏకవచన ఆజ్ఞను నిలుపుతూ, ముందున్న జాబితాను తెలుగులో అవసరమైన కర్మగా అనుసంధానిస్తుంది. ‘ఈ’ అనేది సందర్భంలో స్పష్టమైన ప్రదేశసూచనను సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: הָאֲנָשִׁים ను ప్రధాన పాఠ్యంలో దేవదూతలుగా గుర్తించాలా
  choice: ‘ఆ మనుషులు’ అని ఉంచడం
  alternative: ‘ఆ దేవదూతలు’ లేదా ‘ఆ దూతలు’
  rationale: కథా సందర్భం వారి దేవదూత స్వరూపాన్ని తెలియజేసినా, ఈ వచనం సాధారణ హీబ్రూ పదమైన ‘మనుషులు’నే ఉపయోగిస్తుంది. అందువల్ల ఇక్కడ లేని గుర్తింపును ప్రధాన పాఠ్యంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘లోతుతో ... అన్నారు’ అనే నిర్మాణం తెలుగులో సులభంగా చదవబడుతుంది. అసలు పాఠ్యంలోని పురుషుల గుర్తింపు మరియు חָתָן పదంలోని పరిమిత సందిగ్ధతను పాదసూచనతో కాపాడాం.
