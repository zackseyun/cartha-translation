    rationale: బַּעֲוֺן הָעִיר సందర్భంలో శిక్షార్థం సముచితమైనదే; అయితే సవరించిన రూపం శిక్ష పట్టణానికే సంబంధించినదని మరింత నేరుగా తెలియజేస్తుంది.
