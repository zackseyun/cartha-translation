id: GEN.19.15
reference: Genesis 19:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/כְמוֹ֙ הַ/שַּׁ֣חַר עָלָ֔ה וַ/יָּאִ֥יצוּ הַ/מַּלְאָכִ֖ים בְּ/ל֣וֹט לֵ/אמֹ֑ר קוּם֩ קַ֨ח אֶֽת אִשְׁתְּ/ךָ֜ וְ/אֶת שְׁתֵּ֤י בְנֹתֶ֨י/ךָ֙ הַ/נִּמְצָאֹ֔ת פֶּן תִּסָּפֶ֖ה בַּ/עֲוֺ֥ן הָ/עִֽיר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/015.yaml
  text: And as dawn was rising[a], the angels urged Lot, saying, “Get up, take your wife and your two daughters who are here, lest you be swept away in the punishment of the city.”
translation:
  language: te
  text: తెల్లవారుతుండగా దేవదూతలు లోతును తొందరపెట్టి, “లేచి, నీ భార్యను, ఇక్కడ ఉన్న నీ ఇద్దరు కుమార్తెలను తీసుకో; లేకపోతే పట్టణానికి విధించబడిన శిక్షలో నీవూ తుడిచిపెట్టుకుపోతావు[a]” అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఈ పట్టణపు దోషంలో” లేదా “ఈ పట్టణపు అపరాధభారం కారణంగా.” హీబ్రూ పదం దోషాన్ని, అపరాధభారాన్ని, లేదా దాని ఫలితమైన శిక్షను సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְמוֹ הַשַּׁחַר עָלָה
  choice: తెల్లవారుతుండగా
  rationale: ఉదయం పైకి రావడం అనే హీబ్రూ చిత్రాన్ని తెలుగులో సహజమైన కాలసూచక ప్రయోగంతో తెలియజేస్తుంది.
- source_word: וַיָּאִיצוּ
  choice: తొందరపెట్టి
  rationale: వెంటనే చర్య తీసుకునేలా ఒత్తిడి చేయడం అనే క్రియాభావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: הַמַּלְאָכִים
  choice: దేవదూతలు
  rationale: ఈ సందర్భంలో వీరు పరలోక దూతలు; అందువల్ల సాధారణ ‘దూతలు’ కంటే ‘దేవదూతలు’ స్పష్టంగా ఉంటుంది.
- source_word: קוּם קַח
  choice: లేచి ... తీసుకుపో
  rationale: రెండు ఆజ్ఞల అత్యవసరతను నిలుపుతూ, పట్టణం విడిచి వెళ్లాల్సిన సందర్భాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: הַנִּמְצָאֹת
  choice: ఇక్కడ ఉన్న
  rationale: అక్షరార్థంలోని ‘కనబడిన/ఉన్న’ భావాన్ని, లోతుతో ప్రస్తుతం ఉన్న కుమార్తెలను సూచించేలా సహజంగా అందిస్తుంది.
- source_word: פֶּן תִּסָּפֶה
  choice: లేకపోతే ... నీవూ తుడిచిపెట్టుకుపోతావు
  rationale: ఇతరులతోపాటు అదే వినాశంలో చిక్కుకొని నశించడం అనే నిఫల్ క్రియాభావాన్ని కాపాడుతుంది.
- source_word: בַּעֲוֺן הָעִיר
  choice: ఈ పట్టణపు దోషానికి వచ్చే శిక్షలో
  rationale: עָוֹן లోని దోషం, అపరాధభారం, దాని శిక్ష అనే భావవ్యాప్తిని ప్రధాన పాఠ్యంలో సంక్షిప్తంగా ప్రతిబింబిస్తుంది.
theological_decisions:
- issue: తీర్పు సందర్భంలో עָוֹן అనువాదం
  choice: ఈ పట్టణపు దోషానికి వచ్చే శిక్షలో
  alternative: ఈ పట్టణపు దోషంలో; ఈ పట్టణపు అపరాధం కారణంగా
  rationale: హీబ్రూ పదం పాపం లేదా దోషం, అపరాధభారం, దాని ఫలితమైన శిక్షను సూచించగలదు. సందర్భం రాబోయే వినాశాన్ని సూచిస్తున్నప్పటికీ, దోషం-శిక్ష సంబంధాన్ని ప్రధాన పాఠ్యంలో నిలిపి, అసలు పదంలోని ఉద్వేగాన్ని పూర్తిగా తొలగించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన శైలి. ప్రత్యక్ష సంభాషణలో అత్యవసరతను ఉంచి, עָוֹן యొక్క నిజమైన అర్థవ్యాప్తిని పాదసూచికలో భద్రపరిచాం.
