translation:
  language: te
  text: కాని అతని భార్య అతని వెనుక ఉండి వెనక్కి చూసింది[a]; ఆమె ఉప్పు స్తంభంగా మారింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పదబంధాన్ని మరింత అక్షరార్థంగా అనువదిస్తే, ‘అతని వెనుకనుండి చూసింది.’ ఇది ఆమె అతని వెనుక ఉన్న స్థానాన్ని సూచించవచ్చు; సందర్భంలో వెనక్కి చూసిందనే భావాన్నీ ఇస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּבֵּט
  choice: వెనక్కి చూసింది
  rationale: נבט అనే క్రియ ప్రాథమికంగా ‘చూడు’ అని అర్థం. ఈ సందర్భంలో מֵאַחֲרָיו అనే పదబంధంతో కలిసి, సహజమైన తెలుగులో ‘వెనక్కి చూసింది’ అని అనువదించడం చర్య దిశను స్పష్టంగా తెలియజేస్తుంది; ఉద్దేశాన్ని మాత్రం జోడించదు.
- source_word: אִשְׁתּוֹ
  choice: అతని భార్య
  rationale: మూడవ పురుష ఏకవచన పుంలింగ ప్రత్యయంతో ఉన్న నామవాచకం నేరుగా ‘అతని భార్య’ అని అర్థం; సందర్భంలో ఇది లోతు భార్యను సూచిస్తుంది.
- source_word: מֵאַחֲרָיו
  choice: అతని వెనుకనుండి
  rationale: మూల పదబంధంలోని ‘అతని వెనుకనుండి’ అనే స్థానార్థాన్ని నిలుపుతుంది. ఇది ఆమె లోతు వెనుక ఉన్నదని సూచించగలదు; సందర్భంలో వెనక్కి చూడడమనే దిశార్థంతోనూ సంబంధం కలిగి ఉంది.
- source_word: וַתְּהִי
  choice: మారింది
  rationale: కథన క్రమంలో היה ఇక్కడ ఒక కొత్త స్థితిలోకి రావడాన్ని సూచిస్తుంది; అందువల్ల ‘ఉంది’ కంటే ‘మారింది’ సరైనది.
- source_word: נְצִיב מֶלַח
  choice: ఉప్పు స్తంభం
  rationale: నిలువుగా స్థాపించబడిన రూపాన్ని సూచించే נְצִיב మరియు దానిని విశేషించే מֶלַח కలిపి సహజంగా ‘ఉప్పు స్తంభం’ అవుతుంది.
theological_decisions:
- issue: లోతు భార్యకు సంభవించిన మార్పు స్వభావం
  choice: ఆమె ఉప్పు స్తంభంగా మారిందని నేరుగా అనువదించడం
  alternative: ఆమె ఉప్పు స్తంభంలా అయింది
  rationale: హీబ్రూ వాక్యంలో ఉపమాన సూచకం లేదు. కాబట్టి దీనిని పోలికగా బలహీనపరచకుండా, కథనం చెప్పే మార్పును యథాతథంగా నిలుపుతున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గంభీరమైన కథన శైలి వాడబడింది. ‘అతని వెనుకనుండి వెనక్కి’ అనే స్వల్ప పునరుక్తి మూలంలోని స్థానార్థాన్నీ సందర్భంలోని దిశార్థాన్నీ రెండింటినీ నిలుపుతుంది. ‘అప్పుడు’ కథన ఫలిత క్రమాన్ని సహజంగా తెలుపుతుంది.
