  text: לְכָ֨/ה נַשְׁקֶ֧ה אֶת אָבִ֛י/נוּ יַ֖יִן וְ/נִשְׁכְּבָ֣ה עִמּ֑/וֹ וּ/נְחַיֶּ֥ה מֵ/אָבִ֖י/נוּ זָֽרַע־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/032.yaml
  text: Come[a], let us make our father drink wine, and let us lie with him[b], so that we may preserve offspring through our father.
translation:
  language: te
  text: “రా, మన తండ్రికి ద్రాక్షామద్యం తాగిద్దాం, అతనితో పడుకుందాం; అలా మన తండ్రి ద్వారా సంతానం[a] కొనసాగునట్లు చేద్దాం.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూలభాషలో “విత్తనం”; ఇక్కడ సంతానం లేదా వంశం అనే భావం.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכָה
  choice: రా
  rationale: הלך క్రియారూపం ఇక్కడ చర్యకు ప్రేరేపించే ఆహ్వానంగా వాడబడింది; ఏకవచన స్త్రీని ఉద్దేశించిన సహజమైన తెలుగు రూపం ‘రా’.
- source_word: נַשְׁקֶה
  choice: తాగిద్దాం
  rationale: שקה హిఫీల్ రూపం కారణార్థకం; తాము తాగడం కాదు, తండ్రికి తాగించడం అనే భావాన్ని తెలియజేస్తుంది.
- source_word: אָבִינוּ
  choice: మన తండ్రి
  rationale: హీబ్రూలోని సమూహ స్వామ్యాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; వచనంలోని రెండు సందర్భాల్లోనూ పునరుక్తిని నిలిపింది.
- source_word: יַיִן
  choice: ద్రాక్షమద్యం
  rationale: יין మత్తు కలిగించే wine‌ను సూచిస్తుంది; ‘ద్రాక్షారసం’ అనేది మద్యంలేని రసంగా అపార్థం కావచ్చు కాబట్టి ‘ద్రాక్షమద్యం’ స్పష్టంగా ఉంది.
- source_word: וְנִשְׁכְּבָה עִמּוֹ
  choice: అతనితో పడుకుందాం
  rationale: שכב עם లైంగిక సంబంధానికి వాడే మర్యాదాపూర్వక సూచన; మూలంలోని పరోక్షతను, గంభీరతను నిలుపుతుంది.
- source_word: וּנְחַיֶּה
  choice: కొనసాగిద్దాం
  rationale: חיה పియేల్ రూపానికి ‘జీవింపజేయడం/నిలిపి ఉంచడం’ అనే భావం ఉంది; זרעతో కలిసి వంశం లేదా సంతానం అంతరించకుండా కొనసాగించడాన్ని సూచిస్తుంది.
- source_word: מֵאָבִינוּ
  choice: మన తండ్రి ద్వారా
  rationale: מן ఇక్కడ సంతానానికి మూలాన్ని సూచిస్తుంది; తెలుగులో ‘ద్వారా’ ఈ సందర్భంలోని జనకత్వ సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: זָרַע
  choice: సంతానం
  rationale: పదశః ‘విత్తనం’; ఇక్కడ భావం సంతతి లేదా వంశపారంపర్యం కాబట్టి ‘సంతానం’ సాధారణ పాఠకులకు స్పష్టంగా ఉంటుంది.
