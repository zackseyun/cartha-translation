translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కథనంలో సహజత్వం, సంభాషణలో గంభీరత పాటించబడ్డాయి. మూలంలోని లైంగిక సభ్యోక్తి సభ్యోక్తిగానే నిలుపబడింది. ‘విత్తనం’ అనే అక్షరార్థం కన్నా సందర్భోచితమైన ‘సంతానం’ వాడబడింది.
