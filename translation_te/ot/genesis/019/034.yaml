revisions:
- from: మరుసటి రోజు పెద్ద కుమార్తె చిన్న కుమార్తెతో, “చూడు, నిన్న రాత్రి నేను నాన్నతో శయనించాను. ఈ రాత్రి కూడా ఆయనకు ద్రాక్షారసం తాగిద్దాం. ఆ తర్వాత నువ్వు వెళ్లి ఆయనతో శయనించు. అలా మన తండ్రి ద్వారా సంతానాన్ని నిలిపి ఉంచుదాం” అంది.
  to: మరుసటి రోజు పెద్ద కుమార్తె చిన్న కుమార్తెతో, “చూడు, నిన్న రాత్రి నేను నాన్నతో శయనించాను. ఈ రాత్రి కూడా ఆయనకు ద్రాక్షారసం తాగిద్దాం. ఆ తర్వాత రా, ఆయనతో శయనించు. అలా మన తండ్రి వలన సంతానం కలిగేలా చేద్దాం” అంది.
