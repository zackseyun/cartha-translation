source:
  edition: WLC
  text: וַֽ/יְהִי֙ מִֽ/מָּחֳרָ֔ת וַ/תֹּ֤אמֶר הַ/בְּכִירָה֙ אֶל הַ/צְּעִירָ֔ה הֵן שָׁכַ֥בְתִּי אֶ֖מֶשׁ אֶת אָבִ֑/י נַשְׁקֶ֨/נּוּ יַ֜יִן גַּם הַ/לַּ֗יְלָה וּ/בֹ֨אִי֙ שִׁכְבִ֣י עִמּ֔/וֹ וּ/נְחַיֶּ֥ה מֵ/אָבִ֖י/נוּ זָֽרַע־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/034.yaml
  text: And it happened on the next day that the firstborn said to the younger[a], “Look, I lay with my father last night. Let us make him drink wine tonight also. Then come, lie with him, so that we may preserve offspring from our father.”
translation:
  language: te
  text: మరుసటి రోజు పెద్ద కుమార్తె చిన్న కుమార్తెతో, “చూడు, నిన్న రాత్రి నేను నాన్నతో శయనించాను. ఈ రాత్రి కూడా ఆయనకు ద్రాక్షారసం తాగిద్దాం. ఆ తర్వాత రా, ఆయనతో శయనించు. అలా మన తండ్రి వలన సంతానం కలిగేలా చేద్దాం” అంది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי מִמָּחֳרָת
  choice: మరుసటి రోజు
  rationale: హీబ్రూ కథన కొనసాగింపును సహజమైన ఆధునిక తెలుగు కథన శైలిలో వ్యక్తం చేస్తుంది; కృత్రిమమైన ‘జరిగిందేమిటంటే’ను నివారిస్తుంది.
- source_word: הַבְּכִירָה ... הַצְּעִירָה
  choice: పెద్ద కుమార్తె ... చిన్న కుమార్తె
  rationale: స్త్రీలింగ రూపాలను సందర్భానుసారం స్పష్టంగా చూపుతూ, జననక్రమ వ్యత్యాసాన్ని సహజ తెలుగులో నిలుపుతుంది.
- source_word: הֵן
  choice: చూడు
  rationale: శ్రద్ధను ఆకర్షించే హీబ్రూ అవ్యయ బలాన్ని ఆధునిక సంభాషణాత్మక తెలుగులో తెలియజేస్తుంది.
- source_word: שָׁכַבְתִּי אֶת אָבִי / שִׁכְבִי עִמּוֹ
  choice: నాన్నతో శయనించాను / ఆయనతో శయనించు
  rationale: లైంగిక భావం ఉన్న హీబ్రూ సభ్యోక్తిని అతిగా వైద్యపరంగా లేదా అస్పష్టంగా చేయకుండా గంభీరంగా నిలుపుతుంది.
- source_word: נַשְׁקֶנּוּ יַיִן
  choice: ఆయనకు ద్రాక్షారసం తాగిద్దాం
  rationale: హిఫీల్ కారణార్థక భావాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: וּנְחַיֶּה מֵאָבִינוּ זָרַע
  choice: మన తండ్రి ద్వారా సంతానాన్ని నిలిపి ఉంచుదాం
  rationale: חיה యొక్క ‘జీవింపజేయు/నిలిపి ఉంచు’ భావాన్నీ, זרע యొక్క సంతతి భావాన్నీ కాపాడుతుంది; מן ఇక్కడ మూలం లేదా వంశోత్పత్తిని సూచిస్తుంది.
