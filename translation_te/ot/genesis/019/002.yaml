id: GEN.19.2
reference: Genesis 19:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֜אמֶר הִנֶּ֣ה נָּא אֲדֹנַ֗/י ס֣וּרוּ נָ֠א אֶל בֵּ֨ית עַבְדְּ/כֶ֤ם וְ/לִ֨ינוּ֙ וְ/רַחֲצ֣וּ רַגְלֵי/כֶ֔ם וְ/הִשְׁכַּמְתֶּ֖ם וַ/הֲלַכְתֶּ֣ם לְ/דַרְכְּ/כֶ֑ם וַ/יֹּאמְר֣וּ לֹּ֔א כִּ֥י בָ/רְח֖וֹב נָלִֽין־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/002.yaml
  text: And he said[a], “Please, my lords, turn aside to your servant’s house, and spend the night, and wash your feet. Then you may rise early and go on your way.” But they said, “No[d][c][b], but we will spend the night in the square.”
translation:
  language: te
  text: 'అతడు ఇలా అన్నాడు: “అయ్యలారా[a], దయచేసి మీ సేవకుడి ఇంటికి తిరిగి రండి; రాత్రి బస చేసి, మీ కాళ్లు కడుక్కోండి. ఆ తర్వాత తెల్లవారగానే లేచి మీ దారిన వెళ్లవచ్చు.” అయితే వారు, “లేదు, మేము పట్టణ కూడలిలో రాత్రి బస చేస్తాం” అన్నారు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నా ప్రభువా.’ אֲדֹנַי అనే రూపాన్ని ఏకవచన గౌరవార్థక సంబోధనగా కూడా అర్థం చేసుకోవచ్చు; అయితే ఇక్కడ లోతు ఇద్దరు సందర్శకులను సంబోధిస్తున్నందున బహువచన భావం సందర్భానికి బాగా సరిపోతుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: הִנֶּה נָּא ... סוּרוּ נָא
  choice: అయ్యలారా, దయచేసి ... వచ్చి
  rationale: రెండు נָא పదాలు మర్యాదతో కూడిన ఆతుర విన్నపాన్ని తెలియజేస్తాయి. తెలుగులో వాటిని యాంత్రికంగా రెండుసార్లు అనువదించకుండా ‘దయచేసి’తో సహజంగా వ్యక్తం చేశాం; סור אל సందర్భానుసారం ఇంటికి ‘వచ్చి’ అని అనువదించాం.
- source_word: אֲדֹנַי
  choice: అయ్యలారా
  rationale: లోతు ఇద్దరు అతిథులను గౌరవంగా సంబోధిస్తున్నాడు. బహువచన క్రియలు, సర్వనామాలు దీనికి మద్దతిస్తాయి; ‘అయ్యలారా’ ఆధునిక తెలుగులో గౌరవపూర్వక మానవ సంబోధనగా సహజంగా ఉంది.
- source_word: בֵּית עַבְדְּכֶם
  choice: మీ సేవకుని ఇంటికి
  rationale: లోతు తనను తాను వినయంగా ‘మీ సేవకుడు’ అని పేర్కొనే మూలంలోని మర్యాదా సూత్రాన్ని నిలిపింది.
- source_word: וְלִינוּ / נָלִין
  choice: రాత్రి బస చేసి / రాత్రి గడుపుతాం
  rationale: לין రాత్రిపూట బస చేయడాన్ని సూచిస్తుంది. మొదటి సందర్భంలో ఆహ్వానానికి ‘బస చేసి’, రెండవ సందర్భంలో బహిరంగ ప్రదేశంలో ఉండటానికి సహజమైన ‘రాత్రి గడుపుతాం’ వాడాం.
- source_word: וְרַחֲצוּ רַגְלֵיכֶם
  choice: మీ కాళ్లు కడుక్కోండి
  rationale: ప్రాచీన ఆతిథ్య ఆచారాన్ని స్పష్టంగా, నేరుగా నిలిపే సహజ తెలుగు రూపం.
- source_word: וְהִשְׁכַּמְתֶּם וַהֲלַכְתֶּם לְדַרְכְּכֶם
  choice: తెల్లవారగానే లేచి మీ దారిన వెళ్లవచ్చు
  rationale: మరుసటి రోజు త్వరగా లేచి ప్రయాణం కొనసాగించవచ్చనే ఆహ్వాన భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בָרְחוֹב
  choice: పట్టణ కూడలిలోనే
  rationale: רְחוֹב ఇక్కడ కేవలం వీధిని కాక పట్టణంలోని బహిరంగ ప్రజా ప్రదేశం లేదా కూడలిని సూచిస్తుంది. ‘పట్టణ కూడలి’ ఆ భావాన్ని స్పష్టంగా అందిస్తుంది.
theological_decisions:
- issue: אֲדֹנַי దైవ బిరుదా లేక మనుషులకు చేసిన గౌరవ సంబోధనా
  choice: ఇద్దరు అతిథులకు చేసిన బహువచన గౌరవ సంబోధనగా ‘అయ్యలారా’
  alternative: ఏకవచన గౌరవార్థక రూపంగా ‘నా ప్రభువా’
  rationale: ఈ వాక్యంలోని బహువచన క్రియలు, సర్వనామాలు మరియు లోతు ఇద్దరు సందర్శకులతో మాట్లాడుతున్న తక్షణ కథా సందర్భం బహువచన మానవ సంబోధనకు మద్దతిస్తాయి. అయినా రూపానికి సాధ్యమైన ఏకవచన గౌరవార్థక అవగాహనను పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన, సామాన్య పాఠకులకు సులభమైన కథన శైలి వాడాం. ‘మీ సేవకుడు’ అనే ప్రాచీన వినయ సంబోధనను నిలిపి, ‘అయ్యలారా’తో మానవ అతిథులకు చేసిన గౌరవ సంబోధనను దైవ బిరుదుగా వినిపించకుండా చూశాం. మూలంలోని వరుస ఆహ్వాన క్రియలను తెలుగులో సాఫీగా చదవబడేలా అనుసంధానించాం.
