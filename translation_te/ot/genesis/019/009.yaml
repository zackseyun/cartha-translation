translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కథనానికి తగిన గంభీరతతో పాటు గుంపు మాటలలోని శత్రుత్వం, అవమానం నిలుపబడ్డాయి. ‘సంచరించడానికి’ వంటి తప్పుదోవ పట్టించే పదం, ‘ప్రవాసిగా ఉండడానికి’ వంటి అధికారిక పదబంధం బదులు సాధారణ పాఠకుడికి స్పష్టమైన ‘పరదేశిగా నివసించడానికి’ వాడబడింది. అన్ని పాదటిప్పణి సూచికలు సంబంధిత ప్రధాన పాఠ్యంలో ఉంచబడ్డాయి.
