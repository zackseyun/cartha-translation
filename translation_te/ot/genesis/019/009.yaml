source:
  edition: WLC
  text: וַ/יֹּאמְר֣וּ גֶּשׁ הָ֗לְאָה וַ/יֹּֽאמְרוּ֙ הָ/אֶחָ֤ד בָּֽא לָ/גוּר֙ וַ/יִּשְׁפֹּ֣ט שָׁפ֔וֹט עַתָּ֕ה נָרַ֥ע לְ/ךָ֖ מֵ/הֶ֑ם וַ/יִּפְצְר֨וּ בָ/אִ֤ישׁ בְּ/לוֹט֙ מְאֹ֔ד וַֽ/יִּגְּשׁ֖וּ לִ/שְׁבֹּ֥ר הַ/דָּֽלֶת׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/009.yaml
  text: And they said[a], “Get back!” Then they said, “This one came to live as a foreigner, and now he keeps acting as judge! Now we will treat you worse than them.” And they pressed very hard against the man, against Lot[d][c][b], and came near to break down the door.
translation:
  language: te
  text: అప్పుడు వారు, “వెనక్కి జరుగు!”[a] అన్నారు. మళ్లీ వారు, “ఈ ఒక్కడు పరదేశిగా ఉండడానికి వచ్చాడు; ఇప్పుడేమో తీర్పు చెప్పేవాడిలా వ్యవహరిస్తున్నాడు![b] ఇప్పుడు వాళ్లకంటే నీకే ఎక్కువ కీడు చేస్తాం”[c] అన్నారు. వారు ఆ మనిషి, అంటే లోతును, చాలా బలంగా నెట్టుతూ,[d] తలుపు పగులగొట్టడానికి దగ్గరికి వచ్చారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “పక్కకు జరుగు!”
    reason: lexical_alternative
  - marker: b
    text: 'మూలభాషలో ‘తీర్పు చెప్పడం’ అనే భావం బలంగా నొక్కిచెప్పబడింది. మరో అనువాదం: “ఇప్పుడేమో తీర్పు చెప్పడానికి వచ్చాడా!”'
    reason: lexical_alternative
  - marker: c
    text: అక్షరార్థంగా, “వాళ్లకంటే నీకు ఎక్కువ కీడు చేస్తాం”; సందర్భంలో ఇది అతిథులకు చేయదలచినదానికంటే లోతుకు ఎక్కువ హాని చేస్తామనే బెదిరింపు.
    reason: lexical_alternative
  - marker: d
    text: లేదా “ఆ మనిషి, అంటే లోతు, మీద చాలా బలంగా ఒత్తిడి చేశారు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: גֶּשׁ הָלְאָה
  choice: వెనక్కి పో!
  rationale: ఈ సందర్భంలో ఇది లోతును దూరంగా లేదా వెనక్కి జరగమనే శత్రుత్వపూరిత ఆజ్ఞ. సహజమైన ఆధునిక తెలుగులో దాని బలాన్ని చూపుతుంది.
- source_word: הָאֶחָד
  choice: ఈ ఒక్కడు
  rationale: హీబ్రూ మాటలోని తిరస్కారపూరిత, అవమానకర ధోరణిని అనవసరమైన వాడుకభాషా రంగు చేర్చకుండా తెలియజేస్తుంది.
- source_word: בָּא לָגוּר
  choice: పరదేశిగా నివసించడానికి వచ్చాడు
  rationale: גור ఇక్కడ స్థానికుడు కాని నివాసిగా ఉండడాన్ని సూచిస్తుంది; ‘పరదేశిగా నివసించడం’ ఆ సామాజిక స్థితిని స్పష్టంగా తెలియజేస్తుంది.
- source_word: וַיִּשְׁפֹּט שָׁפוֹט
  choice: తీర్పరి వలె తీర్పులు తీర్చుతున్నాడు
  rationale: సమాపక క్రియతో కూడిన infinitive absolute తీర్పు చెప్పడాన్ని బలపరుస్తుంది. పునరుక్తి హీబ్రూ తీవ్రతను, వారి ఎద్దేవాను తెలుగులో నిలుపుతుంది.
- source_word: נָרַע לְךָ מֵהֶם
  choice: వాళ్లకు చేయబోయేదానికంటే నీకు మరింత కీడు చేస్తాం
  rationale: רעע యొక్క causative భావమైన కీడు చేయడాన్ని, సందర్శకులతో పోలిస్తే లోతుకు ఎక్కువ హాని చేస్తామన్న బెదిరింపును నేరుగా నిలుపుతుంది.
- source_word: וַיִּפְצְרוּ בָאִישׁ בְּלוֹט מְאֹד
  choice: లోతు అనే ఆ మనిషి మీదికి చాలా బలంగా తోసుకొచ్చి
  rationale: తలుపును పగులగొట్టడానికి ముందుకు రావడం అనే భౌతిక సందర్భంలో פצר బలంగా నెట్టడం లేదా ఒత్తిడి చేయడం అనే భావం ఇస్తుంది; מְאֹד తీవ్రతను ‘చాలా బలంగా’ చూపుతుంది. ద్విగుణ preposition ను అసహజంగా పునరావృతం చేయకుండా apposition ను స్పష్టం చేస్తుంది.
- source_word: וַיִּגְּשׁוּ לִשְׁבֹּר הַדָּלֶת
  choice: తలుపు పగులగొట్టడానికి దగ్గరికి వచ్చారు
  rationale: נגשׁ తో infinitive ఉద్దేశపూర్వకంగా ముందుకు రావడాన్ని సూచిస్తుంది; שׁבר ఇక్కడ తలుపును బలవంతంగా పగులగొట్టడాన్ని సూచిస్తుంది.
