source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר ל֖וֹט אֲלֵ/הֶ֑ם אַל נָ֖א אֲדֹנָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/018.yaml
  text: But Lot said to them[a], “No, please, my lords.”
translation:
  language: te
  text: 'అయితే లోతు వారితో ఇలా అన్నాడు: “వద్దు, దయచేసి, నా ప్రభువులారా![a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వద్దు, దయచేసి, నా ప్రభువా!” హీబ్రూ రూపమైన אֲדֹנָיను కొన్ని వివరణల్లో ఏకవచన గౌరవ సంబోధనగా అర్థం చేసుకోవచ్చు; అయితే ‘వారితో’ అనే బహువచన సందర్భం ఇక్కడ “నా ప్రభువులారా” అనే పఠనానికి మద్దతిస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అయితే ... అన్నాడు
  rationale: వావ్-క్రమ రూపం కథనాన్ని ముందుకు నడిపిస్తుంది; ఇక్కడ లోతు ముందటి ఆదేశానికి అభ్యంతరం చెబుతున్నందున సందర్భంలోని వ్యతిరేక భావాన్ని ‘అయితే’ సహజంగా తెలియజేస్తుంది.
- source_word: לוֹט
  choice: లోతు
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: אֲלֵהֶם
  choice: వారితో
  rationale: אֶל అనే విభక్తిపూర్వక పదానికి మూడవ పురుష బహువచన ప్రత్యయం కలసి ‘వారితో/వారికి’ అనే అర్థం ఇస్తుంది. మూలంలోని సర్వనామాన్ని విస్తరించి ‘ఆ మనుషులతో’ అని చేయకుండా నిలుపుతుంది.
- source_word: אַל
  choice: వద్దు
  rationale: క్రియలేని ఈ విన్నపంలో אַל ముందటి ప్రతిపాదనను తిరస్కరించే బలమైన నిషేధంగా పనిచేస్తుంది; ఆధునిక తెలుగులో ‘వద్దు’ సహజమైన సమానార్థకం.
- source_word: נָא
  choice: దయచేసి
  rationale: విన్నపం లేదా మర్యాదను తెలిపే కణం; ‘దయచేసి’ ఆధునిక, స్పష్టమైన తెలుగు రూపం.
- source_word: אֲדֹנָי
  choice: నా ప్రభువులారా
  rationale: ‘వారితో’ అనే బహువచన సందర్భం ఇద్దరు సందర్శకులను ఉద్దేశించిన బహువచన సంబోధనను బలపరుస్తుంది. ‘ప్రభువులారా’ אֲדוֹן పదంలోని గౌరవార్థాన్ని, బహువచనాన్ని రెండింటినీ నిలుపుతుంది.
theological_decisions:
- issue: אֲדֹנָי అనే రూపాన్ని దైవ సంబోధనగా ‘నా ప్రభువా’ అని చదవాలా, లేక ఇద్దరు సందర్శకులకు గౌరవపూర్వక బహువచన సంబోధనగా ‘నా ప్రభువులారా’ అని చదవాలా?
  choice: 'ఇద్దరు సందర్శకులకు బహువచన గౌరవ సంబోధన: ‘నా ప్రభువులారా’'
  alternative: ‘నా ప్రభువా’
  rationale: ‘వారితో’ అనే స్పష్టమైన బహువచన సూచన తక్షణ సందర్భంలో బహువచన సంబోధనకే మద్దతిస్తుంది. అయినా ఈ హీబ్రూ రూపాన్ని ఏకవచన గౌరవ లేదా దైవ సంబోధనగా అర్థం చేసుకునే అవకాశం ఉన్నందున ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘వద్దు, దయచేసి’ విన్నపంలోని తక్షణ నిరాకరణను నిలుపుతుంది; ‘నా ప్రభువులారా’ కొంత ఉన్నత గౌరవ సంబోధన అయినప్పటికీ సందర్భానికి తగినదిగా, సాధారణ పాఠకులకు అర్థమయ్యేలా ఉంది.
