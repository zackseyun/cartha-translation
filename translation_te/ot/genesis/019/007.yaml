lexical_decisions:
- source_word: אַל־נָא
  choice: దయచేసి ... చేయకండి
  rationale: విన్నపంతో కూడిన నిషేధాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אַחַי
  choice: నా సోదరులారా
  rationale: అక్షరార్థాన్ని నిలుపుతూ, లోతు పట్టణపు పురుషులను శాంతింపజేయడానికి లోతు వాడిన స్నేహపూర్వక సంబోధనను యథాతథంగా ఉంచుతుంది.
- source_word: תָּרֵעוּ
  choice: ఈ దుష్కార్యం చేయకండి
  rationale: హిఫీల్ క్రియకు ఇక్కడ సందర్భానుగుణంగా ‘చెడు చేయడం/దుష్కార్యం చేయడం’ అనే భావం ఉంది; ‘ఈ’ అనేది ఎదురున్న ప్రతిపాదిత చర్యను సహజంగా సూచిస్తుంది.
