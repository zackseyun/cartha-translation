translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని ‘ఇశ్రాయేలు’ పేరును అలాగే ఉంచి, ప్రశ్నలోని నిందారోపణ స్వరాన్ని అతిశయింపకుండా కాపాడాం.
