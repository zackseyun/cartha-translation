id: GEN.43.6
reference: Genesis 43:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ יִשְׂרָאֵ֔ל לָ/מָ֥ה הֲרֵעֹתֶ֖ם לִ֑/י לְ/הַגִּ֣יד לָ/אִ֔ישׁ הַ/ע֥וֹד לָ/כֶ֖ם אָֽח׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/006.yaml
  text: Then Israel said[a], “Why did you do me harm by telling the man that you still had another brother?”
translation:
  language: te
  text: 'అప్పుడు ఇశ్రాయేలు ఇలా అన్నాడు: “మీకు ఇంకా ఒక సోదరుడు ఉన్నాడని ఆ మనిషికి చెప్పి, నాకు ఎందుకు కీడు కలిగించారు?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... అన్నాడు
  rationale: వావ్-కన్సిక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది; ‘అప్పుడు’ దాని క్రమానుగత భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: יִשְׂרָאֵל
  choice: ఇశ్రాయేలు
  rationale: మూలపాఠంలో ‘యాకోబు’ కాకుండా ‘ఇశ్రాయేలు’ అనే పేరు ఉంది; కథకుడు ఎంచుకున్న పేరునే నిలుపుకున్నాం.
- source_word: לָמָה
  choice: ఎందుకు
  rationale: ప్రత్యక్ష కారణార్థక ప్రశ్నకు సహజమైన తెలుగు సమానం.
- source_word: הֲרֵעֹתֶם לִי
  choice: నాకు ... కీడు కలిగించారు
  rationale: רעע హిఫిల్ రూపం హాని లేదా కీడు కలిగించడాన్ని సూచిస్తుంది. నైతిక దుష్టత్వాన్ని అతిశయింపకుండా, కారణార్థక భావాన్ని ‘కీడు కలిగించారు’ నిలుపుతుంది.
- source_word: לְהַגִּיד
  choice: చెప్పి
  rationale: హాని ఏ విధంగా కలిగిందో తెలిపే సాధనార్థక సంబంధాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: לָאִישׁ
  choice: ఆ మనిషికి
  rationale: ముందటి కథనం ద్వారా తెలిసిన ఐగుప్తు అధికారిని సూచిస్తుంది; తెలుగు సందర్భంలో ‘ఆ మనిషి’ సహజమైన నిర్దిష్ట సూచన.
- source_word: הַעוֹד לָכֶם אָח
  choice: మీకు ఇంకా ఒక సోదరుడు ఉన్నాడని
  rationale: ‘మీకు ఇంకా ఒక సోదరుడు ఉన్నాడా/ఉన్నాడని’ అనే అస్తిత్వ భావాన్ని నేరుగా నిలుపుతుంది; మూలంలో స్పష్టంగా లేని ‘మరొక’ అనే భావాన్ని ప్రధాన పాఠంలో చేర్చలేదు.
