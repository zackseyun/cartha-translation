source:
  edition: WLC
  text: אָֽנֹכִי֙ אֶֽעֶרְבֶ֔/נּוּ מִ/יָּדִ֖/י תְּבַקְשֶׁ֑/נּוּ אִם לֹ֨א הֲבִיאֹתִ֤י/ו אֵלֶ֨י/ךָ֙ וְ/הִצַּגְתִּ֣י/ו לְ/פָנֶ֔י/ךָ וְ/חָטָ֥אתִֽי לְ/ךָ֖ כָּל הַ/יָּמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/009.yaml
  text: I myself will guarantee him. From my hand you may require him. If I do not bring him to you and set him before you[a], then I will bear the blame to you all my days.
translation:
  language: te
  text: అతనికి నేనే పూచీగా ఉంటాను. అతన్ని నా చేతినుంచి నీవు అడగవచ్చు. నేను అతన్ని నీ దగ్గరికి తీసుకొచ్చి నీ ఎదుట నిలబెట్టకపోతే, జీవితాంతం నీ పట్ల నిందను నేనే మోస్తాను.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, మరింత అక్షరార్థంగా: “అప్పుడు నేను జీవితాంతం నీ పట్ల పాపం చేసినవాడినై ఉంటాను.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָנֹכִי
  choice: నేనే
  rationale: స్వతంత్ర సర్వనామంలోని ఉద్ఘాటనను సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది; యూదా స్వయంగా బాధ్యత తీసుకుంటున్నాడు.
- source_word: אֶעֶרְבֶנּוּ
  choice: అతనికి పూచీగా ఉంటాను
  rationale: ערב క్రియలోని హామీదారు లేదా బాధ్యత వహించేవాడు అనే న్యాయపరమైన భావాన్ని తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: מִיָּדִי תְּבַקְשֶׁנּוּ
  choice: అతన్ని నా చేతినుంచి నీవు అడగవచ్చు
  rationale: మూలంలోని ‘నా చేతినుంచి’ అనే జవాబుదారీతనపు సజీవ రూపకాన్ని నిలుపుతూ, בקש యొక్క కోరడం లేదా తిరిగి అప్పగింపజేయడం అనే భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: הֲבִיאֹתִיו אֵלֶיךָ
  choice: అతన్ని నీ దగ్గరికి తీసుకొచ్చి
  rationale: హిఫిల్ రూపంలోని ‘తీసుకురావడం’ భావాన్ని అనువదిస్తుంది; సందర్భంలో తిరిగి తీసుకురావడం సూచితమైనా, మూలంలో లేని ‘తిరిగి’ని చేర్చదు.
- source_word: וְהִצַּגְתִּיו לְפָנֶיךָ
  choice: నీ ఎదుట నిలబెట్టకపోతే
  rationale: יצג హిఫిల్‌లోని ఎదుట ఉంచడం లేదా హాజరుపరచడం అనే స్పష్టమైన దృశ్యాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: וְחָטָאתִי לְךָ
  choice: నీ పట్ల ఆ నిందను నేనే మోస్తాను
  rationale: తండ్రి ఎదుట యూదా స్వీకరించే శాశ్వత దోషబాధ్యతను సందర్భానుకూలంగా తెలియజేస్తూ, חטא లోని నైతిక తీవ్రతను ‘నింద’ ద్వారా కాపాడుతుంది.
- source_word: כָּל הַיָּמִים
  choice: జీవితాంతం
  rationale: అక్షరార్థంగా ‘అన్ని రోజులు’ అయిన పదబంధం ఇక్కడ జీవితకాలమంతటి వ్యవధిని సూచిస్తుంది; ‘జీవితాంతం’ ఆధునిక తెలుగులో సహజంగా అదే బలాన్ని ఇస్తుంది.
theological_decisions:
- issue: וְחָטָאתִי לְךָ అనే పదబంధాన్ని కుటుంబపరమైన పూచీ సందర్భంలో అనువదించడం
  choice: నీ పట్ల ఆ నిందను నేనే మోస్తాను
  alternative: నీ పట్ల నేను పాపం చేసినవాడినై ఉంటాను
  rationale: חטא సాధారణంగా ‘పాపం చేయడం’ అని అర్థమైనా, ఇక్కడ యూదా తన తండ్రికి వ్యక్తిగత బాధ్యతను ప్రతిజ్ఞ చేస్తున్నాడు. ప్రధాన పాఠం దోషబాధ్యతను సహజంగా వ్యక్తం చేస్తుంది; మరింత అక్షరార్థమైన, నైతికంగా గంభీరమైన ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచడం ద్వారా మూలంలోని ఉద్వేగాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనదిగానూ సాధారణ పాఠకులకు సులభంగానూ ఉంది. ‘పూచీగా ఉంటాను’ బాధ్యత స్వీకరణను స్పష్టంగా తెలియజేస్తుంది; మూలంలోని ‘నా చేతినుంచి’ రూపకం ఉద్దేశపూర్వకంగా నిలుపబడింది.
