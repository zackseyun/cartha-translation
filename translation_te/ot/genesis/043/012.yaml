source:
  edition: WLC
  text: וְ/כֶ֥סֶף מִשְׁנֶ֖ה קְח֣וּ בְ/יֶדְ/כֶ֑ם וְ/אֶת הַ/כֶּ֜סֶף הַ/מּוּשָׁ֨ב בְּ/פִ֤י אַמְתְּחֹֽתֵי/כֶם֙ תָּשִׁ֣יבוּ בְ/יֶדְ/כֶ֔ם אוּלַ֥י מִשְׁגֶּ֖ה הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/012.yaml
  text: Take double money in your hand[a], and take back in your hand the money that was returned in the mouth of your sacks[b]; perhaps it was a mistake.
translation:
  language: te
  text: రెట్టింపు సొమ్మును మీ చేతుల్లో తీసుకెళ్లండి; మీ గోనెసంచుల తెరువులలో[a] తిరిగి పెట్టబడిన సొమ్మును కూడా మీ చేతుల్లో తిరిగి తీసుకెళ్లండి. బహుశా అది పొరపాటు అయి ఉండవచ్చు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘మీ గోనెసంచుల నోళ్లలో’; అంటే సంచుల తెరచిన భాగాల్లో.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֶסֶף מִשְׁנֶה
  choice: రెట్టింపు సొమ్ము
  rationale: כֶסֶף సందర్భానుసారంగా వెండి లేదా డబ్బును సూచించగలదు; కొనుగోలు సందర్భంలో ‘సొమ్ము’ సహజంగా ఉంటుంది. מִשְׁנֶה యొక్క పరిమాణ భావాన్ని ‘రెట్టింపు’ నిలుపుతుంది; అది ముందటి మొత్తానికి సమానమైన అదనపు సొమ్మా లేక మొత్తం రెండింతలా అన్నదాన్ని అనవసరంగా నిర్ణయించదు.
- source_word: קְחוּ בְיֶדְכֶם
  choice: మీ చేతుల్లో తీసుకెళ్లండి
  rationale: ‘చేతిలో’ అనే హీబ్రూ దృశ్యరూపాన్ని నిలుపుతూ, ప్రయాణంలో వెంట తీసుకెళ్లాలనే భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: הַכֶּסֶף הַמּוּשָׁב
  choice: తిరిగి పెట్టబడిన సొమ్ము
  rationale: שוב యొక్క హోఫల్ రూపం నిష్క్రియార్థకం. సొమ్ము వారిచేత అప్పటికే తిరిగి చెల్లించబడిందని సూచించకుండా, సంచుల్లో మళ్లీ పెట్టబడిందనే కథా సందర్భాన్ని స్పష్టం చేస్తుంది.
- source_word: בְּפִי אַמְתְּחֹתֵיכֶם
  choice: మీ గోనెసంచుల నోళ్లలో
  rationale: פי అనే ‘నోరు’ రూపకాన్ని తెలుగులోనూ అర్థమయ్యేలా నిలుపుతుంది; అది సంచుల తెరచిన భాగాన్ని సూచిస్తుందని పాదటిప్పణి వివరిస్తుంది.
- source_word: תָּשִׁיבוּ בְיֶדְכֶם
  choice: మీ చేతుల్లో తిరిగి తీసుకెళ్లండి
  rationale: హిఫిల్ క్రియలోని ‘తిరిగి తీసుకురావడం’ భావాన్ని, మొదటి ఖండంలోని ‘మీ చేతుల్లో’ అనే పునరుక్తితో సహా నిలుపుతుంది.
- source_word: אוּלַי מִשְׁגֶּה הוּא
  choice: బహుశా అది పొరపాటు అయి ఉండవచ్చు
  rationale: אוּלַי లోని అనిశ్చితిని ‘బహుశా’ తెలియజేస్తుంది; מִשְׁגֶּה ను నైతిక అపరాధం లేదా మోసం అని అధికంగా వ్యాఖ్యానించకుండా ‘పొరపాటు’గా అనువదిస్తుంది.
