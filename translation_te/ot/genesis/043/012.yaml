translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా ఉండే శైలి. హీబ్రూలో రెండుసార్లు వచ్చే ‘మీ చేతుల్లో’ అనే దృశ్యరూప పునరుక్తిని ఉద్దేశపూర్వకంగా నిలిపాం.
