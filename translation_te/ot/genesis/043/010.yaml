source:
  edition: WLC
  text: כִּ֖י לוּלֵ֣א הִתְמַהְמָ֑הְנוּ כִּֽי עַתָּ֥ה שַׁ֖בְנוּ זֶ֥ה פַעֲמָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/010.yaml
  text: For if we had not delayed[b][a], by now we would have returned twice.
translation:
  language: te
  text: ఎందుకంటే మనం ఆలస్యం చేసి ఉండకపోతే[a], ఇప్పటికల్లా రెండుసార్లు తిరిగి వచ్చి ఉండేవాళ్లం[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మనం తాత్సారం చేసి ఉండకపోతే’ లేదా ‘మనం సంకోచించి ఉండకపోతే.’ హీబ్రూ క్రియ ఆలస్యం చేయడం, తాత్సారం చేయడం, లేదా సంకోచించడం అనే భావాలను సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘మనం ఈ రెండు సార్లు తిరిగి వచ్చి ఉండేవాళ్లం’; సందర్భంలో ఇది ఇప్పటికే రెండుసార్లు తిరిగి వచ్చి ఉండేవాళ్లమనే అర్థం ఇచ్చే హీబ్రూ నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే (తెలుగులో విడిగా వ్యక్తం చేయకుండా కారణార్థక ప్రవాహంలో అంతర్భావితం)
  rationale: మొదటి כִּי యూదా చెప్పే కారణాన్ని పరిచయం చేస్తుంది. ఈ ఒక్క వాక్యాన్ని సహజ తెలుగులో చెప్పేటప్పుడు ప్రారంభ కారణసూచక పదం లేకుండానే సందర్భంలోని వివరణాత్మక బలం నిలుస్తుంది.
- source_word: לוּלֵא
  choice: చేయకపోయి ఉంటే
  rationale: గతంలో వాస్తవంగా జరగని పరిస్థితిని సూచించే ప్రతికల్పనను సహజమైన ఆధునిక తెలుగు రూపంలో తెలియజేస్తుంది.
- source_word: הִתְמַהְמָהְנוּ
  choice: మనం ఆలస్యం చేయకపోయి ఉంటే
  rationale: ఈ క్రియ ఆలస్యం చేయడం, తాత్సారం చేయడం, లేదా జాప్యం చేయడం అనే భావాలను కలిగి ఉంది. ప్రయాణం వాయిదా పడిన సందర్భంలో ‘ఆలస్యం చేయడం’ స్పష్టంగా, సహజంగా ఉంది.
- source_word: כִּי עַתָּה
  choice: ఇప్పటికల్లా
  rationale: ప్రతికల్పిత గత పరిస్థితి ఫలితం ప్రస్తుత సమయానికి ముందే నెరవేరి ఉండేదనే భావాన్ని ‘ఇప్పటికల్లా’ సహజంగా అందిస్తుంది.
- source_word: שַׁבְנוּ
  choice: తిరిగి వచ్చి ఉండేవాళ్లం
  rationale: రూపపరంగా సంపూర్ణ క్రియ అయినా, ఈ ప్రతికల్పిత నిర్మాణంలో జరిగి ఉండే ఫలితాన్ని సూచిస్తుంది; తెలుగు సంభావ్య భూతకాల రూపం ఆ భావాన్ని నిలుపుతుంది.
- source_word: זֶה פַעֲמָיִם
  choice: రెండుసార్లు
  rationale: హీబ్రూ పదబంధం సందర్భంలో రెండు ప్రయాణాలు పూర్తిచేసి తిరిగి వచ్చి ఉండేవారనే భావాన్ని సూచిస్తుంది. ‘రెండుసార్లు’ సహజ తెలుగు సమానార్థకం.
