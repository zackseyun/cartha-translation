  text: So the man did as Joseph said[a], and the man brought the men into Joseph’s house.
translation:
  language: te
  text: ఆ మనిషి యోసేపు చెప్పినట్లే చేసి, ఆ మనుషులను యోసేపు ఇంట్లోకి తీసుకొచ్చాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: చేసి
  rationale: עשה ఇక్కడ ఆదేశానికి అనుగుణంగా చేయడాన్ని సూచిస్తుంది. ‘చెప్పినట్లే చేసి’ అనేది సహజమైన తెలుగు ప్రయోగం.
- source_word: הָאִישׁ
  choice: ఆ మనిషి
  rationale: హీబ్రూ మూలంలో అతని బాధ్యతను పేర్కొనకుండా ‘ఆ మనిషి’ అని మాత్రమే ఉంది; కాబట్టి ‘గృహనిర్వాహకుడు’ లేదా ‘సేవకుడు’ అని వివరణను చేర్చలేదు.
- source_word: כַּאֲשֶׁר אָמַר יוֹסֵף
  choice: యోసేపు చెప్పినట్లే
  rationale: యోసేపు పలికిన ఆదేశానికి సరిగ్గా అనుగుణంగా అతడు చేసిన భావాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: וַיָּבֵא
  choice: తీసుకొచ్చాడు
  rationale: בוא హిఫీల్ రూపం ‘రప్పించడం/తీసుకురావడం’ అనే కారణార్థక భావాన్ని ఇస్తుంది; సందర్భంలో ‘తీసుకొచ్చాడు’ సహజంగా ఉంది.
- source_word: הָאֲנָשִׁים
  choice: ఆ మనుషులను
  rationale: మూలం వారిని ‘సోదరులు’ అని కాక ‘మనుషులు’ అని పేర్కొంటుంది; కథనంలోని పదప్రయోగాన్ని అలాగే నిలిపింది.
- source_word: בֵּיתָה יוֹסֵף
  choice: యోసేపు ఇంట్లోకి
  rationale: בֵּיתָה లోని దిశార్థక ה ఇంటి వైపు కదలికను సూచిస్తుంది; సందర్భంలో ప్రవేశ భావాన్ని ‘ఇంట్లోకి’ స్పష్టంగా తెలియజేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘ఆ మనిషి/ఆ మనుషులు’ అనే పునరుక్తి హీబ్రూ మూలంలోని పదప్రయోగ భేదాన్ని కాపాడుతుంది.
