source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוּדָ֜ה אֶל יִשְׂרָאֵ֣ל אָבִ֗י/ו שִׁלְחָ֥/ה הַ/נַּ֛עַר אִתִּ֖/י וְ/נָק֣וּמָה וְ/נֵלֵ֑כָה וְ/נִֽחְיֶה֙ וְ/לֹ֣א נָמ֔וּת גַּם אֲנַ֥חְנוּ גַם אַתָּ֖ה גַּם טַפֵּֽ/נוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/008.yaml
  text: And Judah said to Israel his father[a], “Send the boy with me, and let us arise and go, so that we may live and not die—both we and you and our little ones.”
translation:
  language: te
  text: 'యూదా తన తండ్రియైన ఇశ్రాయేలుతో ఇలా అన్నాడు: “ఆ కుర్రవాణ్ణి[a] నాతో పంపించు. మనం లేచి వెళ్దాం; తద్వారా మనమూ, నీవూ, మన చిన్నపిల్లలూ బ్రతికి చనిపోకుండా ఉంటాం.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యువకుణ్ణి.” హెబ్రూ పదం చిన్నబిడ్డనే కాకుండా యువకుణ్ణి కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: ఇలా అన్నాడు
  rationale: హీబ్రూ కథన ప్రవాహాన్ని సహజమైన ఆధునిక తెలుగు వాక్యనిర్మాణంలో కొనసాగిస్తుంది.
- source_word: יִשְׂרָאֵל אָבִיו
  choice: తన తండ్రి ఇశ్రాయేలుతో
  rationale: మూలంలోని ‘ఇశ్రాయేలు’ పేరును ‘యాకోబు’గా మార్చకుండా ఉంచి, అతడు యూదా తండ్రి అని స్పష్టంగా తెలియజేస్తుంది.
- source_word: שִׁלְחָה הַנַּעַר אִתִּי
  choice: ఆ కుర్రవాణ్ణి నాతో పంపించు
  rationale: ఆజ్ఞార్థక అభ్యర్థనను నేరుగా వ్యక్తపరుస్తుంది. נער అనే పదం చిన్నబిడ్డకే పరిమితం కాక యువకుణ్ణి కూడా సూచించగలదు; సందర్భంలోని కుటుంబ అనుబంధాన్ని ‘కుర్రవాడు’ సహజంగా నిలుపుతుంది.
- source_word: וְנָקוּמָה וְנֵלֵכָה
  choice: మనం లేచి వెళ్దాం
  rationale: రెండు cohortative క్రియలలోని ఉమ్మడి, తక్షణ చర్యకు పిలుపును సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: וְנִחְיֶה וְלֹא נָמוּת
  choice: అప్పుడు ... బ్రతుకుతాం, చనిపోము
  rationale: వెళ్లడం వల్ల కలిగే ఉద్దేశం లేదా ఫలితాన్ని సందర్భానుసారంగా తెలియజేస్తూ, జీవించడం–చనిపోకపోవడం అనే మూలంలోని వ్యతిరేక జోడీని నిలుపుతుంది.
- source_word: גַּם אֲנַחְנוּ גַם אַתָּה גַּם טַפֵּנוּ
  choice: మనమూ, నువ్వూ, మన చిన్నపిల్లలూ
  rationale: మూడుసార్లు వచ్చిన גם పదంలోని సమగ్రతను, ఉద్ఘాటనను తెలుగు ‘-ూ’ ప్రత్యయాల పునరావృతితో సహజంగా ప్రతిబింబిస్తుంది; טף లోని చిన్నవారి బలహీనతను ‘చిన్నపిల్లలు’ స్పష్టంగా చూపుతుంది.
