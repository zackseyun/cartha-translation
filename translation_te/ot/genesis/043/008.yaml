translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘లేచి వెళ్దాం’ అనే రూపం మూలంలోని రెండు క్రియలను నిలుపుతుంది; ‘మనమూ, నువ్వూ, మన చిన్నపిల్లలూ’ అనే నిర్మాణం పునరుక్త ఉద్ఘాటనను తెలుగులో సహజంగా అందిస్తుంది.
