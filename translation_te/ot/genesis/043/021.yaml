base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/021.yaml
  text: And when we came to the lodging place and opened our sacks[a], behold[b], each man's silver was in the mouth of his sack—our silver in its full weight—and we brought it back in our hand.
translation:
  language: te
  text: మేము బస స్థలానికి వచ్చి మా సంచులను తెరిచినప్పుడు, ఇదిగో, ఒక్కొక్కరి వెండి ఒక్కొక్కరి సంచి నోటిలో[a] ఉంది—మా వెండి దాని పూర్తి తూకంతోనే ఉంది[b]. దానిని మేము మా చేతిలో తిరిగి తీసుకొచ్చాము.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఒక్కొక్కరి సంచి తెరుచుకునే చోట.’ హీబ్రూలో అక్షరార్థంగా ‘అతని సంచి నోటిలో’ అని ఉంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘మా వెండి దాని తూకం ప్రకారం ఉంది.’ తిరిగి దొరికినది మొదట తూచి ఇచ్చిన ఖచ్చితమైన పరిమాణమేనని హీబ్రూ సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמָּלוֹן
  choice: బస చేసే చోటు
  rationale: ఇది ప్రయాణంలో రాత్రి గడిపే స్థలాన్ని సూచిస్తుంది; ఆధునిక వాణిజ్య సత్రం అని నిర్దిష్టంగా చెప్పదు.
- source_word: אַמְתְּחֹתֵינוּ / אַמְתַּחְתּוֹ
  choice: మా మూటలు / వారి వారి మూట
  rationale: ధాన్యం లేదా ప్రయాణ సామగ్రి మోసే సంచిని సూచించే పదానికి కథా సందర్భంలో ‘మూట’ సహజంగా సరిపోతుంది.
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: అకస్మాత్తుగా కనుగొన్న విషయాన్ని సజీవంగా చూపించే హీబ్రూ సూచకపద బలాన్ని నిలుపుతుంది.
- source_word: כֶסֶף אִישׁ
  choice: ఒక్కొక్కరి వెండి
  rationale: אִישׁ యొక్క పంపిణీ భావాన్ని ‘ఒక్కొక్కరి’ స్పష్టంగా తెలియజేస్తుంది; כֶסֶף ను సాధారణంగా ‘డబ్బు’ అని కాక ‘వెండి’గా ఉంచింది.
- source_word: בְּפִי אַמְתַּחְתּוֹ
  choice: వారి వారి మూట నోటిలో
  rationale: పాత్ర లేదా సంచి తెరుచుకునే భాగాన్ని ‘నోరు’ అని పిలిచే మూలభాష రూపకాన్ని తెలుగులో అర్థమయ్యే విధంగా నిలుపుతుంది.
- source_word: בְּמִשְׁקָלוֹ
  choice: పూర్తి తూకంతోనే
  rationale: తిరిగి దొరికిన వెండి తూకంలో ఏమీ తగ్గకుండా, ఇచ్చిన ఖచ్చితమైన పరిమాణంలోనే ఉందనే భావాన్ని తెలియజేస్తుంది.
- source_word: וַנָּשֶׁב אֹתוֹ בְּיָדֵנוּ
  choice: దాన్ని మేము మా చేతిలో తిరిగి తీసుకొచ్చాం
  rationale: తాము ఆ వెండిని వెంట తీసుకొని తిరిగి వచ్చామని తెలిపే చర్యను, ‘చేతిలో’ అనే మూలభాష చిత్రంతో సహా నిలుపుతుంది.
