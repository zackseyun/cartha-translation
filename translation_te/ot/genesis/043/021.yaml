  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథన శైలి. ‘మూట నోరు,’ ‘మా చేతిలో’ వంటి మూలభాష చిత్రాలను అర్థస్పష్టత కోల్పోకుండా నిలిపి, అవసరమైన ప్రత్యామ్నాయాన్ని పాదసూచికల్లో ఇచ్చాం.
