    text: లేదా, ‘నీవు మా సోదరుణ్ణి మాతో పంపడానికి సిద్ధంగా ఉంటే.’ יֵשׁ + కృదంతం అనే హెబ్రీ ప్రయోగం పంపే చర్యను లేదా పంపడానికి సంసిద్ధతను సూచించవచ్చు.
    reason: lexical_alternative
  revision_rationale: The revision gives the sending action as the primary conditional sense, preserves the Hebrew idiom's willingness nuance in the footnote, and renders 'our brother' without adding the age-specific sense 'younger brother.' No other change is needed.
