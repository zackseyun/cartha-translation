lexical_decisions:
- source_word: אִם
  choice: ఉంటే
  rationale: ఇది షరతును పరిచయం చేస్తుంది; తెలుగులో సహజమైన షరతార్థక క్రియారూపం.
- source_word: יֶשְׁךָ + מְשַׁלֵּחַ
  choice: పంపడానికి సిద్ధంగా ఉంటే
  rationale: יֵשׁ + సర్వనామ ప్రత్యయం + కృదంతం ఇక్కడ పంపే చర్యతోపాటు దానికి గల సంసిద్ధతను కూడా సూచించగలదు. ఈ సందర్భంలో ‘సిద్ధంగా ఉంటే’ ఆ భావాన్ని సహజంగా తెలియజేస్తుంది; సరళమైన ‘పంపితే’ కూడా సాధ్యమే.
- source_word: אֶת אָחִינוּ
  choice: మా తమ్ముణ్ణి
  rationale: ‘మా సహోదరుణ్ణి’ అనేది అక్షరార్థం; సందర్భంలో మాట్లాడుతున్న యూదా కంటే బెన్యామీను చిన్నవాడు కాబట్టి ఆధునిక తెలుగులో ‘మా తమ్ముణ్ణి’ సహజంగా, ఖచ్చితంగా ఉంటుంది.
- source_word: אִתָּנוּ
  choice: మాతో
  rationale: వారితో కలిసి బెన్యామీను ప్రయాణించాలనే సహచర్య భావాన్ని నేరుగా తెలియజేస్తుంది.
- source_word: נֵרְדָה
  choice: మేము దిగివెళ్లి
  rationale: మొదటి పురుష బహువచన cohortative ఇక్కడ షరతు నెరవేరితే వారు చేయబోయే కార్యాన్ని సూచిస్తుంది; కనానునుంచి ఐగుప్తుకు వెళ్లడాన్ని హెబ్రీ సంప్రదాయ ప్రయోగం ‘దిగివెళ్లు’ అని చెబుతుంది.
- source_word: וְנִשְׁבְּרָה
  choice: కొంటాం
  rationale: ఆహార సరఫరా సందర్భంలో שבר అంటే కొనడం. తెలుగులో సరళమైన భవిష్యత్ రూపం షరతు ఫలితాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לְךָ
  choice: నీ కోసం
  rationale: ద్వితీయ పురుష ఏకవచనానికి ప్రయోజనం లేదా మేలు అనే భావాన్ని నేరుగా తెలియజేస్తుంది.
- source_word: אֹכֶל
  choice: ఆహారం
  rationale: ఈ నామవాచకం ధాన్యానికి మాత్రమే పరిమితం కాకుండా సాధారణంగా ఆహారాన్ని సూచిస్తుంది; అందువల్ల మూలంలోని విస్తృత అర్థాన్ని నిలుపుతుంది.
