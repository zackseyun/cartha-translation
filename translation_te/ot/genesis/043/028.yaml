source:
  edition: WLC
  text: וַ/יֹּאמְר֗וּ שָׁל֛וֹם לְ/עַבְדְּ/ךָ֥ לְ/אָבִ֖י/נוּ עוֹדֶ֣/נּוּ חָ֑י וַֽ/יִּקְּד֖וּ ו/ישתחו׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/028.yaml
  text: They said[a], “Your servant our father is well; he is still alive.” Then they bowed down and prostrated themselves.
translation:
  language: te
  text: అందుకు వారు, “మీ సేవకుడైన మా తండ్రి క్షేమంగా ఉన్నాడు[a]; ఆయన ఇంకా బ్రతికే ఉన్నాడు” అన్నారు. తరువాత వారు తల వంచి, సాష్టాంగ నమస్కారం చేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ‘షాలోమ్’—అక్షరార్థంగా ‘శాంతి’; ఇక్కడ క్షేమం లేదా బాగుండడం అనే భావంలో వాడబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלוֹם
  choice: క్షేమంగా ఉన్నాడు
  rationale: తండ్రి యోగక్షేమాన్ని గురించి అడిగిన ప్రశ్నకు ఇచ్చిన జవాబులో שָׁלוֹם ఆరోగ్యం, క్షేమం అనే భావంలో వాడబడింది; ఆధునిక తెలుగులో ‘క్షేమంగా ఉన్నాడు’ సహజంగా ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: לְעַבְדְּךָ
  choice: మీ సేవకుడైన
  rationale: ఇక్కడ עבד బానిసత్వాన్ని కాక, యోసేపుతో వినయపూర్వకంగా మాట్లాడే రాజసభా మర్యాదను సూచిస్తుంది; ‘మీ సేవకుడు’ ఆ సామాజిక స్థాయిని అతిశయింపకుండా నిలుపుతుంది.
- source_word: לְאָבִינוּ
  choice: మా తండ్రి
  rationale: మొదటి పురుష బహువచన స్వామ్యార్థాన్ని నేరుగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: עוֹדֶנּוּ חָי
  choice: ఆయన ఇంకా బ్రతికే ఉన్నాడు
  rationale: עוֹדֶנּוּలోని కొనసాగింపు భావాన్ని ‘ఇంకా’, חָיలోని జీవించి ఉండడాన్ని ‘బ్రతికే ఉన్నాడు’ స్పష్టంగా నిలుపుతాయి.
- source_word: וַיִּקְּדוּ
  choice: తల వంచి
  rationale: קדד శరీరాన్ని, ముఖ్యంగా తలను వంచడాన్ని సూచిస్తుంది; తరువాతి సంపూర్ణ సాష్టాంగ చర్యతో తేడా కనిపించేలా ‘తల వంచి’ అని అనువదించబడింది.
- source_word: וישתחו
  choice: సాష్టాంగపడ్డారు
  rationale: ఈ సందర్భంలో השתחוה యోసేపు ఎదుట గౌరవంతో నేలవరకు వంగడాన్ని సూచిస్తుంది; ‘సాష్టాంగపడ్డారు’ శారీరక చర్యను తెలియజేస్తూ మతపరమైన ఆరాధన భావాన్ని అనవసరంగా చేర్చదు.
theological_decisions:
- issue: וישתחו అనే గౌరవప్రణామ క్రియ అనువాదం
  choice: సాష్టాంగపడ్డారు
  alternative: ఆరాధించారు; నమస్కరించారు
  rationale: సందర్భం యోసేపు ఎదుట సామాజిక గౌరవప్రణామం చేయడమే, దేవారాధన కాదు. ‘సాష్టాంగపడ్డారు’ శారీరక భంగిమను కాపాడుతుంది; ‘ఆరాధించారు’ అనవసరమైన మతపరమైన అర్థాన్ని చేర్చుతుంది, ‘నమస్కరించారు’ మాత్రం మూలంలోని సంపూర్ణంగా వంగే బలాన్ని తగ్గించవచ్చు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన ప్రత్యక్ష సంభాషణను ఉపయోగించాం. ‘మీ సేవకుడైన మా తండ్రి’ అనే నిర్మాణం మూలంలోని వినయపూర్వక సంబోధనను సహజంగా నిలుపుతుంది. వరుసగా ఉన్న రెండు శారీరక క్రియల మధ్య తేడాను ‘తల వంచి, సాష్టాంగపడ్డారు’ ద్వారా కాపాడాం.
