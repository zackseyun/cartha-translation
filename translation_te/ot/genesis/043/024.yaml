  text: וַ/יָּבֵ֥א הָ/אִ֛ישׁ אֶת הָ/אֲנָשִׁ֖ים בֵּ֣יתָ/ה יוֹסֵ֑ף וַ/יִּתֶּן מַ֨יִם֙ וַ/יִּרְחֲצ֣וּ רַגְלֵי/הֶ֔ם וַ/יִּתֵּ֥ן מִסְפּ֖וֹא לַ/חֲמֹֽרֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/024.yaml
  text: The man brought the men into Joseph’s house and gave them water[a], and they washed their feet[c][b]; then he gave fodder to their donkeys.
translation:
  language: te
  text: ఆ మనిషి ఆ మనుషులను యోసేపు ఇంటిలోకి తీసుకువచ్చి, వారికి నీళ్లు ఇచ్చాడు; వారు తమ కాళ్లు కడుక్కున్నారు. తరువాత అతడు వారి గాడిదలకు మేత ఇచ్చాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పాఠంలో ‘ఆ మనిషి,’ ‘ఆ మనుషులు’ అని ఉంది. సందర్భాన్ని బట్టి ఆ మనిషి యోసేపు ఇంటి అధికారి అని, ఆ మనుషులు యోసేపు సోదరులు అని స్పష్టమైనా, ఈ వచనం వారిని అలా ప్రత్యేకంగా పేర్కొనదు.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּבֵא
  choice: తీసుకువచ్చి
  rationale: בוא హిఫిల్ రూపం వారిని ఇంటిలోకి ప్రవేశింపజేసిన భావాన్ని ఇస్తుంది; ‘తీసుకువచ్చి’ ఆధునిక తెలుగులో సహజంగా ఆ కారణార్థక గమనాన్ని తెలియజేస్తుంది.
- source_word: הָאִישׁ / הָאֲנָשִׁים
  choice: ఆ మనిషి / ఆ మనుషులను
  rationale: హీబ్రూ పాఠం ఇక్కడ అతని పదవిని లేదా వారి బంధుత్వాన్ని ప్రత్యేకంగా చెప్పకుండా సాధారణ నామాలనే వాడుతుంది; సందర్భం స్పష్టమైనా అదే నిర్దిష్టతను నిలుపుకున్నాం.
- source_word: בֵּיתָה יוֹסֵף
  choice: యోసేపు ఇంటిలోకి
  rationale: בֵּיתָה లోని దిశాసూచక ప్రత్యయం ఇంటి లోపలికి జరిగిన గమనాన్ని సూచిస్తుంది; ‘ఇంటిలోకి’ దానిని స్పష్టంగా తెలియజేస్తుంది.
- source_word: וַיִּתֶּן מַיִם
  choice: వారికి నీళ్లు ఇచ్చాడు
  rationale: హీబ్రూలో ‘వారికి’ ప్రత్యక్షంగా లేకపోయినా సందర్భంలో గ్రహించబడుతుంది; తెలుగులో సహజమైన వాక్యం కోసం దాన్ని వ్యక్తం చేశాం.
- source_word: וַיִּרְחֲצוּ רַגְלֵיהֶם
  choice: వారు తమ కాళ్లు కడుక్కున్నారు
  rationale: క్రియ కర్తరి బహువచనంలో ఉంది. సేవకుడు కడిగాడని పాఠం చెప్పదు కాబట్టి కర్తరి భావాన్నే నిలిపాం.
- source_word: מִסְפּוֹא
  choice: మేత
  rationale: ఈ నామవాచకం జంతువులకు పెట్టే ఆహారాన్ని సూచిస్తుంది; ‘మేత’ సాధారణ, స్పష్టమైన ఆధునిక తెలుగు పదం.
- source_word: לַחֲמֹרֵיהֶם
  choice: వారి గాడిదలకు
  rationale: ל ఉపసర్గ గ్రహీతను సూచిస్తుంది; తెలుగులో ‘గాడిదలకు మేత వేశాడు’ సహజంగా అదే భావాన్ని అందిస్తుంది.
