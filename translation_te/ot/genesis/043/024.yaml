translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. కథనంలోని కర్తల మార్పు స్పష్టంగా ఉండేందుకు అర్ధవిరామం, తరువాత వాక్య విభజన వాడాం. నీటిని ఇచ్చిన ఉద్దేశాన్ని పాఠం ప్రత్యక్షంగా చెప్పనందున అనవసర వివరణ చేర్చలేదు.
