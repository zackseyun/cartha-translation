id: GEN.43.29
reference: Genesis 43:29
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּשָּׂ֣א עֵינָ֗י/ו וַ/יַּ֞רְא אֶת בִּנְיָמִ֣ין אָחִי/ו֮ בֶּן אִמּ/וֹ֒ וַ/יֹּ֗אמֶר הֲ/זֶה֙ אֲחִי/כֶ֣ם הַ/קָּטֹ֔ן אֲשֶׁ֥ר אֲמַרְתֶּ֖ם אֵלָ֑/י וַ/יֹּאמַ֕ר אֱלֹהִ֥ים יָחְנְ/ךָ֖ בְּנִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/029.yaml
  text: He lifted up his eyes and saw Benjamin[a], his brother, his mother's son, and said, “Is this your youngest brother, of whom you spoke to me?” Then he said, “May God be gracious to you, my son.”
translation:
  language: te
  text: అతడు తన కళ్లు పైకెత్తి, తన తల్లికి పుట్టిన తన సోదరుడు బెన్యామీనును చూశాడు. “మీరు నాకు చెప్పిన మీ అందరిలో చిన్న తమ్ముడు ఇతడేనా?” అని అడిగాడు. ఆ తర్వాత, “నా కుమారుడా, దేవుడు నీపై దయ చూపుగాక” అన్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשָּׂא עֵינָיו
  choice: తన కళ్లు పైకెత్తి
  rationale: హీబ్రూ నుడికారంలోని దృశ్య స్పష్టతను నిలుపుతూ, తెలుగులో సహజంగా అర్థమయ్యే విధంగా అనువదించబడింది.
- source_word: וַיַּרְא
  choice: చూశాడు
  rationale: ראה అనే క్రియ ఇక్కడ సాధారణంగా చూడడాన్ని సూచిస్తుంది; ముందున్న నుడికారంతో సహజమైన క్రమాన్ని ఏర్పరుస్తుంది.
- source_word: אֶת בִּנְיָמִין
  choice: బెన్యామీనును
  rationale: వ్యక్తి పేరును ప్రామాణిక తెలుగు బైబిలు ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించి, వాక్యంలో కర్మవిభక్తి చేర్చబడింది.
- source_word: אָחִיו בֶּן אִמּוֹ
  choice: తన తల్లి కుమారుడైన తన సహోదరుడు
  rationale: బెన్యామీను యోసేపుకు ఒకే తల్లి ద్వారా కలిగిన సహోదరుడని మూలంలోని స్పష్టమైన సంబంధాన్ని సంక్షిప్త వ్యాఖ్యానంగా మార్చకుండా నిలుపుతుంది.
- source_word: אֲחִיכֶם הַקָּטֹן
  choice: మీ చిన్న తమ్ముడు
  rationale: సందర్భంలో הַקָּטֹן కుటుంబంలోని చిన్నవాడిని సూచిస్తుంది. తెలుగులో వయస్సులో చిన్న పురుష సహోదరునికి ‘తమ్ముడు’ సహజమైనది; ‘చిన్న’ అతడే అందరిలో చిన్నవాడన్న భావాన్ని నిలుపుతుంది.
- source_word: אֲשֶׁר אֲמַרְתֶּם אֵלָי
  choice: మీరు నాకు చెప్పిన
  rationale: హీబ్రూ పదబంధ భావాన్ని తెలుగులో నేరుగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אֱלֹהִים
  choice: దేవుడు
  rationale: ఆశీర్వాద వాక్యంలో ఇశ్రాయేలు దేవుణ్ణి సూచించే సాధారణ హీబ్రూ పదానికి ప్రామాణిక తెలుగు సమానార్థకం.
- source_word: יָחְנְךָ
  choice: నీపై దయ చూపుగాక
  rationale: חנן లోని కృపాపూర్వక అనుగ్రహ భావాన్ని, ఆశీర్వాదార్థక జస్సివ్ బలాన్ని ‘చూపుగాక’ ద్వారా సహజంగా అందిస్తుంది.
- source_word: בְּנִי
  choice: నా కుమారుడా
  rationale: పురుష ఏకవచన సంబోధనను, దానిలోని ఆప్యాయతను యథాతథంగా నిలుపుతుంది.
theological_decisions:
- issue: אֱלֹהִים יָחְנְךָ అనే ఆశీర్వాద సూత్రం
  choice: దేవుడు నీపై దయ చూపుగాక
  alternative: దేవుడు నీకు కృప చూపుగాక
  rationale: ‘దయ చూపుగాక’ మూలంలోని חנן భావాన్ని సాధారణ ఆధునిక తెలుగు పాఠకునికి స్పష్టంగా అందిస్తుంది. ‘గాక’ ఆశీర్వాదం లేదా ప్రార్థనాత్మక ఆకాంక్షను తెలియజేస్తుంది; అదనపు సిద్ధాంతార్థం చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కథనానికి తగిన గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. బెన్యామీను యోసేపు తల్లి కుమారుడని మూలంలో ఉన్న పునరుక్తి సంబంధ ప్రాధాన్యాన్ని ప్రధాన పాఠ్యంలోనే నిలిపినందున పాదటిప్పణి అవసరం లేదు.
