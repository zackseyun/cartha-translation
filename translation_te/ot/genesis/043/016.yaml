  text: וַ/יַּ֨רְא יוֹסֵ֣ף אִתָּ/ם֮ אֶת בִּנְיָמִין֒ וַ/יֹּ֨אמֶר֙ לַֽ/אֲשֶׁ֣ר עַל בֵּית֔/וֹ הָבֵ֥א אֶת הָ/אֲנָשִׁ֖ים הַ/בָּ֑יְתָ/ה וּ/טְבֹ֤חַ טֶ֨בַח֙ וְ/הָכֵ֔ן כִּ֥י אִתִּ֛/י יֹאכְל֥וּ הָ/אֲנָשִׁ֖ים בַּֽ/צָּהֳרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/016.yaml
  text: When Joseph saw Benjamin with them[a], he said to the one over his household, “Bring the men into the house, slaughter an animal, and prepare it[c][b], because the men will eat with me at noon.”
translation:
  language: te
  text: యోసేపు వారితో ఉన్న బెన్యామీనును చూసి, తన ఇంటి బాధ్యత వహిస్తున్న వ్యక్తితో[a], “ఈ మనుష్యులను ఇంట్లోకి తీసుకువెళ్లు. ఒక జంతువును వధించి[b], భోజనం సిద్ధం చేయి; ఎందుకంటే ఈ మనుష్యులు మధ్యాహ్నం నాతో కలిసి భోజనం చేస్తారు” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “తన ఇంటిపై ఉన్న వ్యక్తితో”; అంటే తన ఇంటి బాధ్యత వహిస్తున్న వ్యక్తితో.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా, “వధను వధించు”; ఇది భోజనం కోసం ఒక జంతువును వధించడాన్ని సూచించే నుడికారం.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּרְא
  choice: చూసి
  rationale: ఇక్కడ ראה సాధారణ దృశ్యగ్రహణాన్ని, అంటే బెన్యామీను వారితో ఉన్నాడని యోసేపు గమనించడాన్ని సూచిస్తుంది.
- source_word: אִתָּם אֶת־בִּנְיָמִין
  choice: వారితో ఉన్న బెన్యామీనును
  rationale: אִתָּם బెన్యామీను ఇతర సహోదరులతో కలిసి ఉన్నాడనే భావాన్ని నేరుగా తెలియజేస్తుంది.
- source_word: לַאֲשֶׁר עַל־בֵּיתוֹ
  choice: తన ఇంటి వ్యవహారాలపై అధికారిగా ఉన్న వ్యక్తితో
  rationale: హీబ్రూ పదబంధం అక్షరార్థంగా యోసేపు ఇంటి లేదా గృహ నిర్వహణపై నియమించబడిన వ్యక్తిని సూచిస్తుంది; ఆధునిక తెలుగులో అర్థమయ్యేలా, పదవిని అతిగా నిర్దిష్టం చేయకుండా అనువదించబడింది.
- source_word: הָבֵא אֶת־הָאֲנָשִׁים הַבָּיְתָה
  choice: ఈ మనుష్యులను ఇంట్లోకి తీసుకువెళ్లు
  rationale: הַבָּיְתָה లోని దిశార్థక రూపం ఇంటి లోపలికి తీసుకువెళ్లడాన్ని సూచిస్తుంది.
- source_word: וּטְבֹחַ טֶבַח
  choice: ఒక జంతువును వధించి
  rationale: ఒకే మూలానికి చెందిన క్రియ-నామ సమాసం భోజనం కోసం జంతువును వధించడాన్ని సూచించే హీబ్రూ నుడికారం; జంతువు జాతిని మూలపాఠం నిర్దిష్టం చేయదు.
- source_word: וְהָכֵן
  choice: భోజనం సిద్ధం చేయి
  rationale: כון హిఫీల్ ఆజ్ఞారూపం ‘సిద్ధం చేయి’ అని అర్థం. ముందున్న వధ ఆజ్ఞతో కలిపి, భోజన ఏర్పాటును సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: כִּי אִתִּי יֹאכְלוּ הָאֲנָשִׁים
  choice: ఎందుకంటే ఈ మనుష్యులు ... నాతో కలిసి భోజనం చేస్తారు
  rationale: כִּי ఆ ఆజ్ఞలకు కారణాన్ని తెలియజేస్తుంది; ‘నాతో కలిసి భోజనం చేస్తారు’ అనేది సహజమైన ఆధునిక తెలుగు.
- source_word: בַּצָּהֳרָיִם
  choice: మధ్యాహ్నం
  rationale: ఈ పదం మధ్యాహ్న సమయాన్ని లేదా నడిమధ్యాహ్నాన్ని సూచిస్తుంది; ‘మధ్యాహ్నం’ సాధారణ తెలుగు సమానార్థకం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. ‘గృహనిర్వాహకుడు’ వంటి కొంత అధికారిక పదానికి బదులు మూలంలోని వివరణాత్మక నిర్మాణాన్ని సహజంగా ఉంచాం. ఆజ్ఞలకు ఏకవచన రూపాలు వాడి, యోసేపు ఒకే గృహాధికారితో మాట్లాడుతున్నాడనే హీబ్రూ వ్యాకరణాన్ని నిలిపాం.
