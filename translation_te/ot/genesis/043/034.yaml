  text: וַ/יִּשָּׂ֨א מַשְׂאֹ֜ת מֵ/אֵ֣ת פָּנָי/ו֮ אֲלֵ/הֶם֒ וַ/תֵּ֜רֶב מַשְׂאַ֧ת בִּנְיָמִ֛ן מִ/מַּשְׂאֹ֥ת כֻּלָּ֖/ם חָמֵ֣שׁ יָד֑וֹת וַ/יִּשְׁתּ֥וּ וַֽ/יִּשְׁכְּר֖וּ עִמּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/034.yaml
  text: He sent portions to them from before him[a], but Benjamin’s portion was five times as much as all of theirs[c][b]. So they drank and became drunk with him.
translation:
  language: te
  text: అతడు అతని ఎదుటనుండి వారికి భోజన భాగాలు పంపించాడు[a]. అయితే బెన్యామీను భాగం వారిలో ప్రతి ఒక్కరి భాగంకంటే ఐదు రెట్లు పెద్దది[b]. వారు అతనితో కలిసి తాగి మత్తెక్కారు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “అతని ఎదుటనుండి”; అంటే యోసేపు కూర్చున్న చోటు నుండి లేదా అతని బల్ల దగ్గర నుండి అని భావం కావచ్చు.
    reason: cultural_note
  - marker: b
    text: అక్షరార్థంగా, “ఐదు చేతులు”; ఇది ఐదు రెట్ల పరిమాణాన్ని సూచించే హీబ్రూ నుడికారం.
    reason: lexical_alternative
  - marker: c
    text: లేదా కొంత మృదువుగా, “ఉల్లాసంగా ఉన్నారు”; అయితే హీబ్రూ క్రియ మరింత ప్రత్యక్షంగా మద్యం మత్తెక్కడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא מַשְׂאֹת
  choice: భోజన భాగాలను పంపించాడు
  rationale: భోజన సందర్భంలో ఈ పదబంధం వడ్డించేందుకు ఆహార భాగాలను పంపించడాన్ని సూచిస్తుంది; ‘ఎత్తాడు’ అనే అక్షరార్థం ఇక్కడ సహజం కాదు.
- source_word: מֵאֵת פָּנָיו
  choice: తన ఎదుట నుంచి
  rationale: హీబ్రూ భాషలోని ‘అతని ముఖం ఎదుట నుంచి’ అనే చిత్రాన్ని సాధ్యమైనంత నిలుపుతూ, యోసేపు కూర్చున్న చోటు నుంచి భాగాలు పంపబడ్డాయని సహజంగా తెలియజేస్తుంది.
- source_word: מַשְׂאַת בִּנְיָמִן
  choice: బెన్యామీను భాగం
  rationale: ఇది భోజనంలో బెన్యామీనుకు ఇచ్చిన ఆహార భాగాన్ని సూచిస్తుంది.
- source_word: מִמַּשְׂאֹת כֻּלָּם חָמֵשׁ יָדוֹת
  choice: వారందరి భాగాలకంటే ఐదింతలు ఎక్కువగా
  rationale: ‘ఐదు చేతులు’ అనే హీబ్రూ నుడికారం పరిమాణంలో ఐదింతలు అని అర్థం; כֻּלָּם అనే పదంలోని సమష్టి పోలికను ‘వారందరి భాగాలకంటే’ నిలుపుతుంది.
- source_word: וַיִּשְׁתּוּ
  choice: తాగి
  rationale: విందులో వారు పానీయం తాగినట్లు తెలిపే సూటి కథన క్రియ.
- source_word: וַיִּשְׁכְּרוּ
  choice: మత్తెక్కారు
  rationale: ఈ హీబ్రూ క్రియ సాధారణంగా మద్యం వల్ల మత్తు చెందడాన్ని సూచిస్తుంది; ‘సంతోషించారు’ అని మృదువుగా మార్చకుండా ప్రత్యక్ష భావాన్ని నిలుపుతుంది.
- source_word: עִמּוֹ
  choice: అతనితో కలిసి
  rationale: సర్వనామం యోసేపును సూచిస్తుంది; మూలంలోని సర్వనామ రూపాన్ని నిలుపుతూ తెలుగు వాక్యంలో సహజంగా ఉంది.
