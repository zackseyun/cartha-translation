  text: וַֽ/יִּגְּשׁוּ֙ אֶל הָ/אִ֔ישׁ אֲשֶׁ֖ר עַל בֵּ֣ית יוֹסֵ֑ף וַ/יְדַבְּר֥וּ אֵלָ֖י/ו פֶּ֥תַח הַ/בָּֽיִת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/019.yaml
  text: So they approached the man who was over Joseph’s household and spoke to him at the entrance of the house,[a]
translation:
  language: te
  text: అప్పుడు వారు యోసేపు ఇంటి బాధ్యత చూసే ఆ మనిషి దగ్గరకు వెళ్లి, ఇంటి ప్రవేశద్వారం దగ్గర అతనితో మాట్లాడారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఇంటి ద్వారం దగ్గర.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְּשׁוּ
  choice: దగ్గరకు వెళ్లి
  rationale: נגשׁ ఇక్కడ ఒకరి సమీపానికి కదలడాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘దగ్గరకు వెళ్లి’ సహజంగా ఉండి దిశాత్మక భావాన్ని నిలుపుతుంది.
- source_word: הָאִישׁ
  choice: ఆ మనిషి
  rationale: హీబ్రూ పాఠంలో ప్రత్యేక పదవి కాకుండా ‘మనిషి’ అనే సాధారణ పదమే ఉంది. సందర్భం అతడు గృహ నిర్వాహకుడని చూపించినా, అనువాదం మూలంలోని సాధారణ పదాన్ని నిలుపుతుంది.
- source_word: אֲשֶׁר עַל בֵּית יוֹסֵף
  choice: యోసేపు ఇంటి బాధ్యతలో ఉన్న
  rationale: עַל నిర్మాణం అధికారం లేదా పర్యవేక్షణను తెలియజేస్తుంది. ‘ఇంటి బాధ్యతలో ఉన్న’ అనేది కేవలం భవనాన్ని కాక యోసేపు గృహ వ్యవహారాల నిర్వహణను సహజ తెలుగులో సూచిస్తుంది.
- source_word: וַיְדַבְּרוּ אֵלָיו
  choice: అతనితో మాట్లాడారు
  rationale: דבר + אֶל అంటే సాధారణంగా ఒకరితో లేదా ఒకరికి మాట్లాడడం. తరువాతి వచనంలో మాటల విషయం వస్తుంది కాబట్టి ఇది సరైన కథన సంధి.
- source_word: פֶּתַח הַבָּיִת
  choice: ఇంటి ప్రవేశద్వారం దగ్గర
  rationale: פֶּתַח అనేది తెరువు, ప్రవేశస్థలం లేదా ద్వారాన్ని సూచించగలదు. ‘ప్రవేశద్వారం దగ్గర’ దృశ్యాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది; ‘ఇంటి ద్వారం దగ్గర’ కూడా సాధ్యమైన ప్రత్యామ్నాయం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని ‘ఆ మనిషి’ అనే సాధారణ సూచనను పదవిపేరుగా మార్చలేదు.
