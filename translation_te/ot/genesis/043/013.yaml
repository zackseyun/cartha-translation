  text: וְ/אֶת אֲחִי/כֶ֖ם קָ֑חוּ וְ/ק֖וּמוּ שׁ֥וּבוּ אֶל הָ/אִֽישׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/013.yaml
  text: Take your brother also[a], and arise[b], return to the man.
translation:
  language: te
  text: మీ సోదరుణ్ణి కూడా[a] తీసుకొని, లేచి[b], ఆ మనిషి దగ్గరికి తిరిగి వెళ్లండి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూల హీబ్రూలో ‘మీ సోదరుణ్ణి’; సందర్భంలో ఇతడు బెన్యామీను.
    reason: cross_reference
  - marker: b
    text: మూల హీబ్రూలో వరుసగా ‘లేవండి, తిరిగి వెళ్లండి’ అనే రెండు ఆజ్ఞారూపాలు ఉన్నాయి.
    reason: source_structure
lexical_decisions:
- source_word: וְ/אֶת
  choice: కూడా
  rationale: וְ తో కూడిన కర్మ సూచిక ఇక్కడ అదనంగా తీసుకెళ్లవలసిన వ్యక్తిని పరిచయం చేస్తుంది; తెలుగులో ‘కూడా’ ఆ జోడింపు భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אֲחִי/כֶם
  choice: మీ సోదరుణ్ణి
  rationale: మూలంలో నేరుగా ‘మీ సోదరుణ్ణి’ అని ఉంది. సందర్భంలో అతడు బెన్యామీను అయినా, పేరును ప్రధాన వాక్యంలో చేర్చకుండా మూలంలోని సాధారణ బంధుత్వ పదాన్ని నిలిపింది.
- source_word: קָחוּ
  choice: తీసుకొని
  rationale: לקח అనే క్రియకు ప్రాథమిక భావం ‘తీసుకోవడం’. తరువాతి ప్రయాణ ఆజ్ఞలతో సహజమైన తెలుగు వాక్యంగా కలపడానికి ‘తీసుకొని’ అని ఇచ్చింది.
- source_word: וְ/ק֖וּמוּ
  choice: లేచి
  rationale: קום యొక్క ఆజ్ఞారూపం ‘లేవండి’ అనే భావాన్ని ఇస్తుంది. వరుస ఆజ్ఞలను సహజమైన తెలుగులో వ్యక్తం చేయడానికి ‘లేచి’ అని అనుసంధానించింది; క్రియను పూర్తిగా వదలలేదు.
- source_word: שׁ֥וּבוּ
  choice: తిరిగి వెళ్లండి
  rationale: שוב ఇక్కడ ప్రయాణ సందర్భంలో మునుపటి స్థలానికి తిరిగి వెళ్లడాన్ని సూచిస్తుంది. ‘తిరిగి వెళ్లండి’ ఆధునిక తెలుగులో స్పష్టంగా, సహజంగా ఉంది.
- source_word: אֶל הָ/אִישׁ
  choice: ఆ మనిషి దగ్గరికి
  rationale: నిర్దిష్టంగా ముందే తెలిసిన మనిషిని సూచించే హీబ్రూ పదబంధాన్ని తెలుగులో సహజంగా ‘ఆ మనిషి దగ్గరికి’ అని వ్యక్తం చేసింది; అతని హోదాను మూలంలో లేనందున చేర్చలేదు.
