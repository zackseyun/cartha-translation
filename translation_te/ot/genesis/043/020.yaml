  text: וַ/יֹּאמְר֖וּ בִּ֣י אֲדֹנִ֑/י יָרֹ֥ד יָרַ֛דְנוּ בַּ/תְּחִלָּ֖ה לִ/שְׁבָּר אֹֽכֶל־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/020.yaml
  text: And they said[a], “Please, my lord[b], we came down the first time to buy food.”
translation:
  language: te
  text: 'అప్పుడు వారు ఇలా అన్నారు: “దయచేసి, మా ప్రభూ[a], మేము మొదటిసారి ఆహారం కొనడానికి నిజంగానే దిగివచ్చాం[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ “ప్రభూ” అనేది ఉన్నత స్థానంలోని ఒక మనిషిని గౌరవంగా సంబోధించే మాట; దేవునికి చెందిన బిరుదు కాదు.
    reason: cultural_note
  - marker: b
    text: హీబ్రూలో ఒకే క్రియను ప్రత్యేక నిర్మాణంలో పునరుక్తి చేసి నొక్కిచెప్పారు; అందుకే “నిజంగానే దిగివచ్చాం” అని అనువదించబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: అప్పుడు వారు … అన్నారు
  rationale: వావ్-క్రమ కథన రూపాన్ని సహజమైన ఆధునిక తెలుగు కథన ప్రవాహంతో వ్యక్తపరుస్తుంది.
- source_word: בִּי
  choice: దయచేసి
  rationale: ఇది అక్షరార్థంలోని విభక్తి ప్రయోగం కాదు; వినయపూర్వకంగా మనవి చేయడానికి వాడిన అవ్యయం.
- source_word: אֲדֹנִי
  choice: మా ప్రభూ
  rationale: ఉన్నత స్థానంలోని మానవ అధికారిని గౌరవంగా సంబోధించే రూపం; సందర్భంలో ఇది దేవుని బిరుదు కాదు.
- source_word: יָרֹד יָרַדְנוּ
  choice: నిజంగానే ఇక్కడికి వచ్చాం
  rationale: క్రియతో కూడిన infinitive absolute ఇచ్చే నొక్కిచెప్పే భావాన్ని ‘నిజంగానే’ తెలియజేస్తుంది; ఐగుప్తుకు ‘దిగివచ్చాం’ అనేది తెలుగులో కృత్రిమంగా ఉండేందున గమ్యస్థాన భావాన్ని ‘ఇక్కడికి వచ్చాం’గా సహజీకరించింది.
- source_word: בַּתְּחִלָּה
  choice: మొదటిసారి
  rationale: ఈ సందర్భంలో సాధారణ ‘ఆరంభం’ కంటే మునుపటి మొదటి ప్రయాణాన్ని సూచిస్తుంది.
- source_word: לִשְׁבָּר
  choice: కొనడానికి
  rationale: ఆహార సరఫరాను ధర చెల్లించి సంపాదించడాన్ని సూచించే సందర్భోచిత అర్థం.
- source_word: אֹכֶל
  choice: ఆహారం
  rationale: సందర్భంలో ధాన్యం ఉన్నప్పటికీ మూల నామవాచకం విస్తృతంగా ‘ఆహారం’ అని అర్థమిస్తుంది; అనవసరంగా భావాన్ని కుదించదు.
theological_decisions:
- issue: אֲדֹנִי అనే సంబోధనకు దైవార్థం వచ్చే అవకాశం
  choice: మా ప్రభూ
  alternative: అయ్యా
  rationale: మూలంలోని గౌరవపూర్వక సామాజిక స్థాయిని నిలుపుతూ, పాదటిప్పణిలో ఇది మానవ అధికారికి చేసిన సంబోధనని స్పష్టం చేసింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో వినయపూర్వకమైన, గౌరవభరితమైన ప్రత్యక్ష సంభాషణ. ‘మా ప్రభూ’ సామాజిక అధీనతను నిలుపుతుంది; ‘నిజంగానే’ హీబ్రూ నొక్కిచెప్పే నిర్మాణాన్ని సహజంగా ప్రతిబింబిస్తుంది.
