base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/033.yaml
  text: And they sat before him[a], the firstborn according to his birthright and the youngest according to his youth[b], and the men looked at one another in astonishment.
translation:
  language: te
  text: వారు అతని ఎదుట కూర్చున్నారు; జ్యేష్ఠుడు తన జన్మక్రమం ప్రకారం, కనిష్ఠుడు తన వయసుక్రమం ప్రకారం కూర్చున్నారు.[a] అప్పుడు ఆ మనుషులు ఆశ్చర్యంతో ఒకరినొకరు చూసుకున్నారు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “జ్యేష్ఠుడు తన జ్యేష్ఠత్వం ప్రకారం, కనిష్ఠుడు తన కనిష్ఠత్వం ప్రకారం.” భోజనానికి కూర్చున్న క్రమాన్ని వర్ణిస్తూ, హెబ్రీ పాఠం జ్యేష్ఠుని స్థితినీ కనిష్ఠుని స్థితినీ జతగా పేర్కొంటుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ఆ మనుషులు ఒకరినొకరు చూసుకొని విస్తుపోయారు.” హెబ్రీ క్రియ ఆశ్చర్యాన్ని సూచిస్తుంది; “ఒక్కొక్కడు తన తోటి వానివైపు” అనే మాట పరస్పర స్పందనను తెలియజేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשְׁבוּ
  choice: వారు కూర్చున్నారు
  rationale: ישׁב క్రియ యొక్క క్రియాశీల కథనరూపాన్ని సహజంగా నిలుపుతుంది; ‘కూర్చోబెట్టబడ్డారు’ అనే కర్మణి భావాన్ని మూలపాఠం ప్రత్యక్షంగా చెప్పదు.
- source_word: לְפָנָיו
  choice: అతని ఎదుట
  rationale: యోసేపుకు ఎదురుగా ఉన్న స్థల సంబంధాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: הַבְּכֹר כִּבְכֹרָתוֹ
  choice: మొదటిపుట్టినవాడు తన జన్మక్రమం ప్రకారం
  rationale: בכור లోని మొదటిపుట్టిన స్థితిని నిలుపుతూ, ఈ భోజనాసన సందర్భంలో בכורה సూచించే వయోక్రమ భావాన్ని స్పష్టం చేస్తుంది.
- source_word: וְהַצָּעִיר כִּצְעִרָתוֹ
  choice: చిన్నవాడు తన చిన్నవయసు ప్రకారం
  rationale: మొదటిపుట్టినవాడితో ఉన్న హెబ్రీ సమాంతరతను సాధ్యమైనంతగా నిలుపుతూ, సోదరులు పెద్దవాడి నుంచి చిన్నవాడి వరకు కూర్చున్నారని తెలియజేస్తుంది.
- source_word: וַיִּתְמְהוּ
  choice: ఆశ్చర్యంతో ... చూసుకున్నారు
  rationale: תמה తెలిపే విస్మయాన్ని, తరువాతి పరస్పర ప్రయోగమైన איש אל־רעהו తో కలిపి సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: הָאֲנָשִׁים
  choice: ఆ మనుషులు
  rationale: సందర్భంలో వారు యోసేపు సోదరులే అయినా, మూలంలోని ‘మనుషులు’ అనే పదాన్ని వ్యాఖ్యానాత్మకంగా మార్చకుండా నిలుపుతుంది.
- source_word: אִישׁ אֶל־רֵעֵהוּ
  choice: ఒకరినొకరు
  rationale: ‘ఒక్కొక్కడు తన తోటి వానివైపు’ అనే హెబ్రీ పరస్పర ప్రయోగానికి సహజమైన తెలుగు సమానం.
