revisions:
- from: వారు అతని ఎదుట కూర్చున్నారు—మొదటిపుట్టినవాడు తన జన్మక్రమం ప్రకారం మొదలుకొని, చిన్నవాడు తన చిన్నవయసు ప్రకారం వరకు.[a] అప్పుడు ఆ మనుషులు ఆశ్చర్యంతో ఒకరినొకరు చూసుకున్నారు.[b]
  to: వారు అతని ఎదుట కూర్చున్నారు; జ్యేష్ఠుడు తన జన్మక్రమం ప్రకారం, కనిష్ఠుడు తన వయసుక్రమం ప్రకారం కూర్చున్నారు.[a] అప్పుడు ఆ మనుషులు ఆశ్చర్యంతో ఒకరినొకరు చూసుకున్నారు.[b]
  rationale: The revision removes the unsupported and malformed ‘from ... to’ expansion, retains the Hebrew’s paired wording, and uses idiomatic Telugu for seating according to birth/age order. The reciprocal astonishment and the source term “మనుషులు” are retained.
