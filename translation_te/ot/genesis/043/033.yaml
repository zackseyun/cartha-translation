translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథనశైలి. ‘జన్మక్రమం’ సందర్భార్థాన్ని స్పష్టం చేస్తుంది; అడుగుసూచిలో ‘జ్యేష్ఠత్వం’ అనే మరింత రూపసామ్య ప్రత్యామ్నాయం ఇవ్వబడింది. ప్రధాన వాక్యంలో ‘మొదలుకొని ... వరకు’ అనేది మొత్తం సోదరుల వయోక్రమ అమరికను సహజంగా వ్యక్తపరచే స్వల్ప స్పష్టీకరణ.
