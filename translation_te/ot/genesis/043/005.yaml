source:
  edition: WLC
  text: וְ/אִם אֵינְ/ךָ֥ מְשַׁלֵּ֖חַ לֹ֣א נֵרֵ֑ד כִּֽי הָ/אִ֞ישׁ אָמַ֤ר אֵלֵ֨י/נוּ֙ לֹֽא תִרְא֣וּ פָנַ֔/י בִּלְתִּ֖י אֲחִי/כֶ֥ם אִתְּ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/005.yaml
  text: But if you will not send him[a], we will not go down, because the man said to us, ‘You will not see my face unless your brother is with you.’
translation:
  language: te
  text: కానీ మీరు అతణ్ణి పంపకపోతే, మేము దిగివెళ్లము. ఎందుకంటే ఆ మనిషి మాతో, “మీ సోదరుడు మీతో ఉంటే తప్ప మీరు నా ముఖం చూడరు[a]” అని చెప్పాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “నా ముఖం చూడడం” అనేది ఒకరి ఎదుట హాజరవడం లేదా వారి సమక్షంలోకి రావడం అనే అర్థమిచ్చే హీబ్రూ నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: కానీ … అయితే
  rationale: ముందటి వచనంలోని షరతుకు వ్యతిరేకమైన మరో పరిస్థితిని ఇది పరిచయం చేస్తుంది; అందువల్ల సందర్భంలోని వ్యతిరేక భావాన్ని ‘కానీ’ సహజంగా తెలియజేస్తుంది.
- source_word: אֵינְךָ מְשַׁלֵּחַ
  choice: నువ్వు అతణ్ణి పంపకపోతే
  rationale: నిరాకరణతో కూడిన కృదంత రూపం ఉద్దేశించిన నిరాకరణను సూచిస్తుంది. హీబ్రూలో కర్మ స్పష్టంగా లేకపోయినా, సందర్భాన్ని బట్టి అది బెన్యామీనును సూచిస్తున్నందున తెలుగులో వాక్యపూర్ణత కోసం ‘అతణ్ణి’ చేర్చబడింది.
- source_word: לֹא נֵרֵד
  choice: మేము దిగివెళ్లము
  rationale: కనాను నుండి ఐగుప్తుకు ప్రయాణాన్ని హీబ్రూ ‘దిగడం’గా వర్ణిస్తుంది; ‘దిగివెళ్లము’ ఆ భౌగోళిక కథన భాషను నిలుపుతుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ఇక్కడ ఈ పదం వారు దిగివెళ్లకపోవడానికి కారణాన్ని పరిచయం చేస్తుంది.
- source_word: הָאִישׁ
  choice: ఆ మనిషి
  rationale: సోదరులకు యోసేపు అసలు గుర్తింపు ఇంకా తెలియదు; వారి దృష్టికోణాన్ని కాపాడుతూ సాధారణ సూచననే ఉంచుతుంది.
- source_word: אָמַר אֵלֵינוּ
  choice: మాతో … అని చెప్పాడు
  rationale: ప్రత్యక్ష వాక్యాన్ని తెలుగులో సహజంగా పరిచయం చేస్తూ హీబ్రూ భావాన్ని నేరుగా అందిస్తుంది.
- source_word: לֹא תִרְאוּ פָנַי
  choice: మీరు నా ముఖం చూడరు
  rationale: హీబ్రూ పదబంధంలోని రూపకాన్ని యథాతథంగా నిలుపుతుంది; సందర్భంలో ఇది అతని సమక్షంలోకి రావడం లేదా అతని ఎదుట హాజరవడం అనే అర్థాన్ని ఇస్తుంది.
- source_word: בִּלְתִּי
  choice: … ఉంటే తప్ప
  rationale: సోదరుడు వారితో ఉండడం అవసరమైన షరతని తెలుగులో స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אֲחִיכֶם אִתְּכֶם
  choice: మీ సోదరుడు మీతో ఉంటే
  rationale: మూలంలో బెన్యామీను పేరు చెప్పకుండా ‘మీ సోదరుడు’ అనే ఉంది; అదే పదప్రయోగాన్ని నిలిపి, హీబ్రూ నామవాచక వాక్యాన్ని తెలుగులో అవసరమైన క్రియతో పూర్తి చేస్తుంది.
