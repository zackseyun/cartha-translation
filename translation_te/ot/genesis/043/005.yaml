translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. తండ్రిని ఉద్దేశించిన ఏకవచన ‘నువ్వు’, సోదరులను ఉద్దేశించిన బహువచన ‘మీరు/మీతో’ అనే భేదం మూలానికి అనుగుణంగా నిలుపబడింది.
