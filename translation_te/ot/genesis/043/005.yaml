  terminology: “దిగివెళ్లము,” “ఆ మనిషి,” “నా ముఖం చూడరు,” and “మీ సోదరుడు” are appropriate and retain the narrative and idiomatic features of the source. The footnote correctly explains the idiom without replacing the translation’s literal wording.
