id: GEN.43.11
reference: Genesis 43:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אֲלֵ/הֶ֜ם יִשְׂרָאֵ֣ל אֲבִי/הֶ֗ם אִם כֵּ֣ן אֵפוֹא֮ זֹ֣את עֲשׂוּ֒ קְח֞וּ מִ/זִּמְרַ֤ת הָ/אָ֨רֶץ֙ בִּ/כְלֵי/כֶ֔ם וְ/הוֹרִ֥ידוּ לָ/אִ֖ישׁ מִנְחָ֑ה מְעַ֤ט צֳרִי֙ וּ/מְעַ֣ט דְּבַ֔שׁ נְכֹ֣את וָ/לֹ֔ט בָּטְנִ֖ים וּ/שְׁקֵדִֽים־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/011.yaml
  text: 'Then Israel their father said to them[a], “If it must be so, then do this: take some of the choice products of the land in your containers, and carry down to the man a gift—a little balm and a little honey, gum and myrrh[c][b], pistachio nuts and almonds.”'
translation:
  language: te
  text: 'అప్పుడు వారి తండ్రి ఇశ్రాయేలు వారితో ఇలా అన్నాడు: “అలా చేయక తప్పదంటే, ఇది చేయండి: దేశంలోని మేలైన ఉత్పత్తుల్లో కొన్నింటిని[a] మీ పాత్రల్లో పెట్టుకొని, ఆ మనిషికి కానుకగా కిందికి తీసుకెళ్లండి—కొంచెం ఔషధ సుగంధరసం, కొంచెం తేనె[b], సుగంధ జిగురు, బోళము[c], పిస్తాపప్పులు, బాదంపప్పులు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూలభాషలోని పదబంధాన్ని “దేశంలోని శ్రేష్ఠమైన పంటలో కొంత” అని కూడా అనువదించవచ్చు. అది పండ్లకు మాత్రమే పరిమితం కాదు.
    reason: lexical_alternative
  - marker: b
    text: “తేనె” అనే పదం కొన్ని సందర్భాల్లో పండ్లతో చేసిన చిక్కని తీపి పాకాన్ని కూడా సూచించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: “సుగంధ జిగురు,” “బోళము” అని అనువదించిన హీబ్రూ పదాలు ఏ వృక్ష పదార్థాలను సూచిస్తున్నాయో ఖచ్చితంగా తెలియదు; అవి ట్రాగకాంత్ జిగురు లేదా లాడనం వంటి సుగంధ రెసిన్లను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׂרָאֵל אֲבִיהֶם
  choice: వారి తండ్రి ఇశ్రాయేలు
  rationale: హీబ్రూ పదక్రమంలోని సంబంధాన్ని సహజమైన తెలుగులో నిలుపుతూ, ఈ సందర్భంలో యాకోబుకు వాడిన ‘ఇశ్రాయేలు’ పేరును యథాతథంగా ఉంచుతుంది.
- source_word: אִם כֵּן אֵפוֹא
  choice: అలా చేయక తప్పదంటే
  rationale: ఇది కేవలం షరతును కాక, పరిస్థితులకు అయిష్టంగా తలొగ్గడాన్ని కూడా సూచిస్తుంది.
- source_word: מִזִּמְרַת הָאָרֶץ
  choice: దేశంలోని మేలైన ఉత్పత్తుల్లో కొన్నింటిని
  rationale: ఈ పదబంధం పండ్లకు మాత్రమే పరిమితం కాకుండా దేశపు విలువైన పంట ఉత్పత్తులను విస్తృతంగా సూచిస్తుంది.
- source_word: בִּכְלֵיכֶם
  choice: మీ పాత్రల్లో
  rationale: హీబ్రూ పదం సాధారణంగా వస్తువులు పెట్టే పాత్రలు లేదా సామగ్రిని సూచిస్తుంది; నిర్దిష్టంగా సంచులని చెప్పదు.
- source_word: וְהוֹרִידוּ
  choice: కిందికి తీసుకెళ్లండి
  rationale: ఐగుప్తుకు వెళ్లడాన్ని ‘దిగిపోవడం’గా చెప్పే హీబ్రూ దిశాసూచనను నిలుపుతుంది.
- source_word: לָאִישׁ מִנְחָה
  choice: ఆ మనిషికి కానుకగా
  rationale: ఇక్కడ מִנְחָה ఆరాధనా అర్పణ కంటే అనుకూలత పొందేందుకు ఇచ్చే కానుకను సూచిస్తుంది.
- source_word: צֳרִי
  choice: ఔషధ సుగంధరసం
  rationale: మొక్క నుంచి లభించే సువాసనగల ఔషధ బాల్సమ్ లేదా రెసిన్ భావాన్ని సాధారణ పాఠకునికి అర్థమయ్యేలా తెలియజేస్తుంది.
- source_word: דְּבַשׁ
  choice: తేనె
  rationale: ఇది పదానికి సాధారణ అర్థం; కొన్ని సందర్భాల్లో చిక్కని తీపి పాకాన్ని కూడా సూచించే అవకాశాన్ని పాదసూచికలో ఉంచింది.
- source_word: נְכֹאת
  choice: సుగంధ జిగురు
  rationale: ఖచ్చితమైన వృక్ష పదార్థం తెలియనందున, సువాసనగల గమ్ లేదా రెసిన్ అనే విస్తృత భావాన్ని ఇస్తుంది.
- source_word: לֹט
  choice: బోళం
  rationale: తెలుగులో మిర్రా వంటి సుగంధ రెసిన్‌కు పరిచితమైన పదం; ఖచ్చితమైన గుర్తింపు అనిశ్చితమని పాదసూచిక తెలియజేస్తుంది.
- source_word: בָּטְנִים וּשְׁקֵדִים
  choice: పిస్తాపప్పులు, బాదంపప్పులు
  rationale: సూచించబడిన రెండు గింజలను ఆధునిక ప్రామాణిక తెలుగులో స్పష్టంగా గుర్తిస్తుంది.
