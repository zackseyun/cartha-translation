  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. అరుదైన వృక్ష పదార్థాల విషయంలో అతిగా నిర్దిష్టీకరించకుండా మూలంలోని అనిశ్చితి పాదసూచికలో నిలుపబడింది.
