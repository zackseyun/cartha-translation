  text: Then he washed his face[a], came out, controlled himself, and said, “Serve the food.”
translation:
  language: te
  text: తర్వాత అతడు తన ముఖం కడుక్కొని బయటికి వచ్చాడు. తనను తాను నిగ్రహించుకొని, “భోజనం[a] వడ్డించండి” అని చెప్పాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పదానికి అక్షరార్థం ‘రొట్టె’; ఇక్కడ అది వడ్డించాల్సిన భోజనాన్ని విస్తృతంగా సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְחַץ פָּנָיו
  choice: తన ముఖం కడుక్కొని
  rationale: רחץ సాధారణంగా ‘కడుగు’ అని అర్థం; ఏడ్చిన తర్వాత యోసేపు తన ముఖాన్ని శుభ్రం చేసుకున్న సందర్భానికి ఇది సహజమైన ఆధునిక తెలుగు. פָּנִים రూపరీత్యా బహువచనమైనా, ఒక వ్యక్తిని సూచించినప్పుడు తెలుగులో ‘ముఖం’ అని ఏకవచనంగా చెప్పడం సహజం.
- source_word: וַיֵּצֵא
  choice: బయటికి వచ్చాడు
  rationale: יצא అంటే బయటికి వెళ్లడం లేదా రావడం. యోసేపు ఏకాంత గది నుంచి భోజనం జరిగే చోటికి తిరిగి వచ్చిన కథన దృష్టికి ‘బయటికి వచ్చాడు’ సరిపోతుంది.
- source_word: וַיִּתְאַפַּק
  choice: తనను తాను నిగ్రహించుకొని
  rationale: אפק యొక్క హిత్పయేల్ రూపం బలమైన భావోద్వేగాన్ని అదుపులో ఉంచుకోవడాన్ని సూచిస్తుంది. ‘నిగ్రహించుకొని’ మూలంలోని స్వీయ నియంత్రణ భావాన్ని గౌరవప్రదమైన, సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: שִׂימוּ
  choice: వడ్డించండి
  rationale: మూలార్థం ‘పెట్టండి’; అయితే భోజన సందర్భంలో ఆహారాన్ని ముందుంచి వడ్డించమనే ఆజ్ఞను ఇది సూచిస్తుంది. ‘వడ్డించండి’ సందర్భానుకూలమైన సహజ తెలుగు.
- source_word: לָחֶם
  choice: భోజనం
  rationale: לֶחֶם అక్షరార్థంగా ‘రొట్టె’; అయితే ఇది విస్తృతంగా ఆహారం లేదా భోజనాన్ని సూచించగలదు. విందు వడ్డించే ఈ సందర్భంలో ‘భోజనం’ ఉద్దేశించిన విస్తృత భావాన్ని తెలియజేస్తుంది.
