translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. హీబ్రూ వాక్యంలోని వరుస చర్యలను సహజ తెలుగు ప్రవాహంతో అందించేందుకు మొదటి రెండు క్రియలను ఒక వాక్యంగా, ఆజ్ఞను తదుపరి వాక్యంగా ఇచ్చాం. పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో చేర్చబడింది.
