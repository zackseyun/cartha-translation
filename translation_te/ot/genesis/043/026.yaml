base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/026.yaml
  text: When Joseph came into the house[a], they brought to him the gift that was in their hands into the house[c][b], and they bowed down to the ground before him.
translation:
  language: te
  text: యోసేపు ఇంట్లోకి వచ్చినప్పుడు, వారు తమ చేతుల్లో ఉన్న కానుకను ఇంట్లోకి అతని దగ్గరకు తీసుకొచ్చారు. ఆ తరువాత అతని ఎదుట నేలవరకు వంగి నమస్కరించారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא ... הַבַּיְתָה
  choice: ఇంట్లోకి వచ్చినప్పుడు
  rationale: בוא యొక్క సాధారణ ‘రావడం/ప్రవేశించడం’ భావాన్ని, దిశను సూచించే ה కలిగిన ‘ఇంట్లోకి’తో సహజమైన తెలుగు కథన శైలిలో వ్యక్తపరుస్తుంది.
- source_word: וַיָּבִיאוּ לוֹ
  choice: అతని దగ్గరకు తీసుకొచ్చారు
  rationale: హిఫీల్ రూపంలోని ‘తీసుకురావడం’ అనే భావాన్ని నిలుపుతూ, కానుకను యోసేపు వద్దకు తీసుకొచ్చారని స్పష్టంగా తెలియజేస్తుంది.
- source_word: הַמִּנְחָה
  choice: కానుక
  rationale: מִנְחָה సందర్భానుసారంగా కానుక, కప్పం లేదా అర్పణ కావచ్చు. ఇక్కడ ఇది యోసేపుకు తీసుకొచ్చిన దౌత్యపూర్వక బహుమతి; ఆరాధనా అర్పణ కాదు.
- source_word: אֲשֶׁר בְּיָדָם
  choice: తమ చేతుల్లో ఉన్న
  rationale: మూలంలోని స్పష్టమైన శరీరాధారిత నుడికారాన్ని తెలుగులో అర్థమయ్యే విధంగా యథాతథంగా నిలుపుతుంది.
- source_word: הַבָּיְתָה
  choice: ఇంట్లోకి
  rationale: ఈ దిశార్థక పదం వచనంలో రెండోసారి రావడాన్ని తొలగించకుండా అనువదించింది; మొదట యోసేపు ప్రవేశాన్ని, తరువాత కానుకను లోపలికి తేవడాన్ని ఇది సూచిస్తుంది.
- source_word: וַיִּשְׁתַּחֲווּ לוֹ אָרְצָה
  choice: అతని ఎదుట నేలవరకు వంగి నమస్కరించారు
  rationale: యోసేపుకు గౌరవం చూపుతూ నేలవైపు వంగిన శారీరక చర్యను స్పష్టంగా తెలుపుతుంది; దానిని తప్పనిసరిగా ఆరాధనగా అర్థం చేసుకోనివ్వదు.
theological_decisions:
- issue: యోసేపు ఎదుట చేసిన చర్యను ఆరాధనగా కాక గౌరవప్రణామంగా అనువదించడం
  choice: వంగి నమస్కరించారు
  alternative: సాష్టాంగపడ్డారు / పూజించారు
  rationale: שׁחה ఇక్కడ అధికారస్థుడి ఎదుట చేసిన ప్రణామాన్ని సూచిస్తుంది. ‘పూజించారు’ అనడం మూలంలో లేని ఆరాధనా భావాన్ని చేర్చుతుంది; ‘వంగి నమస్కరించారు’ చర్యను మరియు సందర్భాన్ని రెండింటినీ కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. హెబ్రీ మూలంలో ‘ఇంట్లోకి’ రెండుసార్లు రావడాన్ని ఉద్దేశపూర్వకంగా నిలిపి ఉంచాం. పొడవైన సంయుక్త వాక్యాన్ని రెండు వాక్యాలుగా విభజించినా, సంఘటనల క్రమం మరియు భావసంబంధం మారలేదు.
