translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘గట్టిగా హెచ్చరిస్తూ’ మూలంలోని ఉద్ఘాటనను సాధారణ పాఠకునికి స్పష్టంగా అందిస్తుంది; ‘నా ముఖం చూడరు’ అనే మూల నుడికారాన్ని నిలిపి, దాని ప్రత్యామ్నాయ భావాన్ని పాదసూచికలో ఇచ్చాం.
