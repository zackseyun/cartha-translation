  text: וַ/יֹּ֧אמֶר אֵלָ֛י/ו יְהוּדָ֖ה לֵ/אמֹ֑ר הָעֵ֣ד הֵעִד֩ בָּ֨/נוּ הָ/אִ֤ישׁ לֵ/אמֹר֙ לֹֽא תִרְא֣וּ פָנַ֔/י בִּלְתִּ֖י אֲחִי/כֶ֥ם אִתְּ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/003.yaml
  text: Then Judah said to him[a], “The man solemnly warned us, saying[b], ‘You shall not see my face unless your brother is with you.’”
translation:
  language: te
  text: 'అప్పుడు యూదా అతనితో ఇలా అన్నాడు: “ఆ మనిషి మమ్మల్ని గట్టిగా హెచ్చరించాడు[a]: ‘మీ సోదరుడు మీతో లేకపోతే మీరు నా ముఖం చూడరు[b].’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మమ్మల్ని ఎంతో స్పష్టంగా హెచ్చరించాడు” లేదా “మమ్మల్ని ఖచ్చితంగా హెచ్చరించాడు.” హీబ్రూలో ఒకే క్రియాభావాన్ని రెండుసార్లు వ్యక్తపరిచే నిర్మాణం ఉద్ఘాటనను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “మీరు నా ముఖం చూడరు.” ఈ నుడికారం “మీరు నా ఎదుటికి రాలేరు” అని కూడా అర్థమివ్వవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלָיו יְהוּדָה
  choice: అప్పుడు యూదా అతనితో ఇలా అన్నాడు
  rationale: వావ్-కన్సెక్యూటివ్ కథన క్రమాన్ని ముందుకు నడిపిస్తుంది; ‘అప్పుడు’ సహజమైన తెలుగు కథన ప్రవాహాన్ని ఇస్తుంది. אֵלָיו సందర్భంలో యాకోబును సూచిస్తుంది.
- source_word: הָעֵד הֵעִד בָּנוּ
  choice: మమ్మల్ని గట్టిగా హెచ్చరిస్తూ
  rationale: ఇన్ఫినిటివ్ అబ్సల్యూట్‌తో అదే ధాతువు గల పరిమిత క్రియ రావడం హెచ్చరికకు బలమైన ఉద్ఘాటన ఇస్తుంది. ఈ సందర్భంలో న్యాయస్థాన సంబంధమైన ‘సాక్ష్యమిచ్చాడు’ కంటే ‘గట్టిగా హెచ్చరించాడు’ సహజంగా భావాన్ని అందిస్తుంది.
- source_word: הָאִישׁ
  choice: ఆ మనిషి
  rationale: ఇది ముందుగా కలిసిన ఐగుప్తు అధికారిని సూచిస్తుంది. తెలుగు సందర్భంలో నిర్దిష్టంగా గుర్తించబడిన వ్యక్తిని ‘ఆ మనిషి’ అని చెప్పడం సహజం.
- source_word: לֹא תִרְאוּ פָנַי
  choice: మీరు నా ముఖం చూడరు
  rationale: హీబ్రూ దృశ్యరూపాన్ని ప్రధాన పాఠ్యంలో నిలిపింది; సందర్భంలో ఇది ‘నా ఎదుటికి రాలేరు’ అనే భావాన్ని కూడా సూచించవచ్చు.
- source_word: בִּלְתִּי אֲחִיכֶם אִתְּכֶם
  choice: మీ సోదరుడు మీతో ఉంటే తప్ప
  rationale: בִּלְתִּי ఇక్కడ షరతును సూచిస్తుంది. ఏకవచన నామవాచకానికి బహువచన ప్రత్యయం ఉన్నందున ‘మీ సోదరుడు’ సరైనది; సందర్భంలో అతడు బెన్యామీను.
