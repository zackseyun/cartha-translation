id: GEN.43.14
reference: Genesis 43:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אֵ֣ל שַׁדַּ֗י יִתֵּ֨ן לָ/כֶ֤ם רַחֲמִים֙ לִ/פְנֵ֣י הָ/אִ֔ישׁ וְ/שִׁלַּ֥ח לָ/כֶ֛ם אֶת אֲחִי/כֶ֥ם אַחֵ֖ר וְ/אֶת בִּנְיָמִ֑ין וַ/אֲנִ֕י כַּ/אֲשֶׁ֥ר שָׁכֹ֖לְתִּי שָׁכָֽלְתִּי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/014.yaml
  text: May God Almighty grant you mercy before the man[a], so that he may send back your other brother and Benjamin. And as for me, if I am bereaved[c][b], I am bereaved.
translation:
  language: te
  text: సర్వశక్తిమంతుడైన దేవుడు ఆ మనిషి మీపై కనికరం చూపేలా చేయుగాక[a]. అతడు మీ ఇతర సహోదరుణ్ణీ[b], బెన్యామీనునీ మీ దగ్గరకు తిరిగి పంపుగాక. ఇక నేను బిడ్డలను కోల్పోవలసి వస్తే, కోల్పోవలసి వచ్చినట్టే[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘కనికరం’కు బదులుగా ‘కరుణ’ అని కూడా అనువదించవచ్చు. హీబ్రూ רַחֲמִים కనికరం, కరుణ, వాత్సల్యంతో కూడిన జాలి అనే భావాలను సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: ‘మీ ఇతర సహోదరుడు’ అంటే ఈజిప్టులో నిర్బంధించబడిన షిమ్యోను.
    reason: cross_reference
  - marker: c
    text: లేదా, ‘నేను బిడ్డలను కోల్పోయినట్లయితే, కోల్పోయినట్టే.’ హీబ్రూలో ఒకే క్రియను రెండుసార్లు వాడడం యాకోబు నిస్సహాయ రాజీనామాను బలంగా వ్యక్తం చేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵל שַׁדַּי
  choice: సర్వశక్తిమంతుడైన దేవుడు
  rationale: దైవ బిరుదును లిప్యంతరీకరించకుండా అర్థవంతంగా అనువదించింది; సందర్భంలోని ప్రార్థనకు సహజంగా సరిపోతుంది.
- source_word: יִתֵּן לָכֶם רַחֲמִים לִפְנֵי הָאִישׁ
  choice: ఆ మనిషి సమక్షంలో మీకు కనికరం లభించేలా చేయుగాక
  rationale: רַחֲמִים లోని కనికరం, కరుణ అనే భావాన్ని నిలుపుతూ, לִפְנֵי యొక్క ‘సమక్షంలో’ అనే సంబంధాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేసింది.
- source_word: וְשִׁלַּח לָכֶם
  choice: అప్పుడు అతడు ... మీతో తిరిగి పంపుగాక
  rationale: కోరిక/ప్రార్థన క్రమాన్ని కొనసాగిస్తూ, సందర్భంలో ‘అతడు’ ఆ ఈజిప్టు అధికారిని సూచిస్తుందని స్పష్టపరుస్తుంది; తిరిగి రావడం అనే సందర్భార్థాన్ని ‘తిరిగి పంపు’ తెలియజేస్తుంది.
- source_word: אֶת אֲחִיכֶם אַחֵר
  choice: మీ మరో సహోదరుణ్ణి
  rationale: אַחֵר అనే ‘మరో/ఇతర’ భావాన్ని సంక్షిప్తంగా నిలుపుతుంది; గౌరవప్రదమైన కథన శైలికి ‘సహోదరుడు’ సరిపోతుంది.
- source_word: כַּאֲשֶׁר שָׁכֹלְתִּי שָׁכָלְתִּי
  choice: నేను బిడ్డలను కోల్పోతే, కోల్పోయినట్టే
  rationale: שׁכל క్రియలోని బిడ్డలను కోల్పోయి దుఃఖితుడవడం అనే భావాన్ని, మూలంలోని పునరుక్తిని మరియు యాకోబు నిస్సహాయ సమ్మతిని సహజమైన తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: אֵל שַׁדַּי అనే దైవ బిరుదు
  choice: సర్వశక్తిమంతుడైన దేవుడు
  alternative: ఏల్ షద్దాయి
  rationale: పేరును మార్చకుండా ఉంచాల్సిన అవసరం ఉన్న వ్యక్తినామం కంటే ఇది అర్థవంతమైన దైవ బిరుదు; అందువల్ల పాఠకులకు అర్థమయ్యేలా అనువదించబడింది.
- issue: చివరి పునరుక్త వాక్యం వ్యక్తపరచే భావం
  choice: సంభవించగల నష్టాన్ని నిస్సహాయంగా అంగీకరించే షరతు రూపం
  alternative: ‘నేను ఇప్పటికే బిడ్డలను కోల్పోయినట్లే, ఇంకా కోల్పోయినవాడినే’ అనే కాలార్థ పఠనం
  rationale: כַּאֲשֶׁר రూపానికి అక్షరార్థంగా ‘ఎలాగైతే/యథా’ అనే అవకాశం ఉన్నా, సందర్భం మరియు పునరుక్తి యాకోబు ఎదురయ్యే నష్టాన్ని అంగీకరిస్తున్న భావానికి అనుకూలంగా ఉన్నాయి; ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో భద్రపరిచింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన-ప్రార్థనా శైలి వాడబడింది. ‘చేయుగాక/పంపుగాక’ రూపాలు ఆశీర్వాదం లేదా ప్రార్థన స్వరాన్ని నిలుపుతాయి; అరుదైన లేదా మతశాఖాపరమైన పదజాలాన్ని నివారించింది.
