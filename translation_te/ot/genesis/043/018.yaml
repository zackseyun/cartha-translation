  text: וַ/יִּֽירְא֣וּ הָֽ/אֲנָשִׁ֗ים כִּ֣י הֽוּבְאוּ֮ בֵּ֣ית יוֹסֵף֒ וַ/יֹּאמְר֗וּ עַל דְּבַ֤ר הַ/כֶּ֨סֶף֙ הַ/שָּׁ֤ב בְּ/אַמְתְּחֹתֵ֨י/נוּ֙ בַּ/תְּחִלָּ֔ה אֲנַ֖חְנוּ מֽוּבָאִ֑ים לְ/הִתְגֹּלֵ֤ל עָלֵ֨י/נוּ֙ וּ/לְ/הִתְנַפֵּ֣ל עָלֵ֔י/נוּ וְ/לָ/קַ֧חַת אֹתָ֛/נוּ לַ/עֲבָדִ֖ים וְ/אֶת חֲמֹרֵֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/018.yaml
  text: The men were afraid because they had been brought into Joseph’s house[a], and they said, “It is because of the money that was returned in our sacks the first time that we are being brought in, so that he may make a pretext against us and fall upon us and take us as servants, along with our donkeys.”
translation:
  language: te
  text: 'ఆ మనుషులు తమను యోసేపు ఇంటికి తీసుకువచ్చారని తెలిసి భయపడ్డారు. వారు ఇలా అనుకున్నారు: “మొదటిసారి మన గోనెసంచుల్లో తిరిగి పెట్టబడిన డబ్బు కారణంగానే మనల్ని లోపలికి తీసుకువస్తున్నారు. మనకు వ్యతిరేకంగా ఒక సాకు కల్పించుకొని[a], మన మీద దాడి చేసి, మనల్ని బానిసలుగా తీసుకొని, మన గాడిదలను కూడా తీసుకోవడానికే ఇలా చేస్తున్నారు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మనకు వ్యతిరేకంగా ఒక అవకాశం వెదకడానికి.” ఇక్కడి హీబ్రూ నుడికారం క్లిష్టమైనది; సందర్భంలో తమకు హాని చేయడానికి ఒక కారణం లేదా సాకు కల్పించుకోవడం అనే భావాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּירְאוּ
  choice: భయపడ్డారు
  rationale: ירא అనే క్రియ ఇక్కడ వారిలో కలిగిన భయాన్ని కథన క్రమంలో తెలియజేస్తుంది; ఆధునిక తెలుగులో సహజమైన రూపం.
- source_word: הוּבְאוּ בֵּית יוֹסֵף
  choice: తమను యోసేపు ఇంట్లోకి తీసుకువెళ్లడం
  rationale: בוא హోఫల్ రూపంలోని కారణార్థక కర్మణి భావాన్ని, ఇంటిలోకి ప్రవేశింపజేయబడిన సందర్భాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: עַל דְּבַר הַכֶּסֶף
  choice: డబ్బు కారణంగానే
  rationale: עַל דְּבַר ఇక్కడ కేవలం విషయాన్ని కాక కారణాన్ని లేదా సాకును సూచిస్తుంది.
- source_word: הַשָּׁב בְּאַמְתְּחֹתֵינוּ
  choice: మన గోనెసంచుల్లో తిరిగి పెట్టబడిన
  rationale: שוב లోని తిరిగి రావడం/పెట్టబడడం అనే ఫలితార్థాన్ని, ధాన్య ప్రయాణ సంచులను సూచించే אַמְתַּחַת భావాన్ని సందర్భానుసారంగా అందిస్తుంది.
- source_word: בַּתְּחִלָּה
  choice: మొదటిసారి
  rationale: ఈ కథనంలో వారి మొదటి ఐగుప్తు ప్రయాణాన్ని సూచిస్తున్నందున కాలసూచనను సహజంగా తెలియజేస్తుంది.
- source_word: לְהִתְגֹּלֵל עָלֵינוּ
  choice: మనపై నెపం మోపి
  rationale: ఇది క్లిష్టమైన హీబ్రూ నుడికారం; సందర్భంలో తమకు వ్యతిరేకంగా ఒక కారణం కల్పించడం లేదా ఆరోపణ మోపడం అనే శత్రుత్వపూరిత భావాన్ని సూచిస్తుంది.
- source_word: וּלְהִתְנַפֵּל עָלֵינוּ
  choice: మన మీద దాడిచేసి
  rationale: נפל హిత్పయేల్ రూపం עַל తో కలిసి ఇక్కడ శత్రుత్వంతో మీదపడడాన్ని సూచిస్తుంది; ‘దాడిచేసి’ ఆధునిక తెలుగులో స్పష్టం.
- source_word: וְלָקַחַת אֹתָנוּ לַעֲבָדִים
  choice: మనల్ని బానిసలుగా చేసుకొని
  rationale: עֲבָדִים ఇక్కడ సాధారణ సేవకత్వం కాక బలవంతపు బానిస స్థితిని సూచిస్తుంది.
- source_word: וְאֶת חֲמֹרֵינוּ
  choice: మన గాడిదలను స్వాధీనం చేసుకోవడానికి
  rationale: ‘తీసుకోవడం’ అనే క్రియ ఈ పదబంధానికీ వర్తిస్తుంది; గాడిదలు బానిసలవుతాయనే అపార్థం రాకుండా సమన్వయ నిర్మాణాన్ని తెలుగులో స్పష్టం చేసింది.
