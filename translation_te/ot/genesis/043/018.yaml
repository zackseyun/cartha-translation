revisions:
- from: ఆ మనుషులు తమను యోసేపు ఇంట్లోకి తీసుకువెళ్లడం చూసి భయపడ్డారు. వారు, “మొదటిసారి మన గోనెసంచుల్లో తిరిగి పెట్టబడిన డబ్బు కారణంగానే మనల్ని లోపలికి తీసుకువెళ్తున్నారు. మనపై నెపం మోపి[a], మన మీద దాడిచేసి, మనల్ని బానిసలుగా చేసుకొని, మన గాడిదలను స్వాధీనం చేసుకోవడానికే ఇలా చేస్తున్నారు” అనుకున్నారు.
  to: 'ఆ మనుషులు తమను యోసేపు ఇంటికి తీసుకువచ్చారని తెలిసి భయపడ్డారు. వారు ఇలా అనుకున్నారు: “మొదటిసారి మన గోనెసంచుల్లో తిరిగి పెట్టబడిన డబ్బు కారణంగానే మనల్ని లోపలికి తీసుకువస్తున్నారు. మనకు వ్యతిరేకంగా ఒక సాకు కల్పించుకొని[a], మన మీద దాడి చేసి, మనల్ని బానిసలుగా తీసుకొని, మన గాడిదలను కూడా తీసుకోవడానికే ఇలా చేస్తున్నారు.”'
  rationale: The revision restores the passive causal force of the opening clause, renders the hostile idiom with a cautious contextual equivalent, and makes the final two objects of “take” explicit in Telugu. The footnote preserves the lexical uncertainty without an inaccurate literal gloss.
