  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి పాటించబడింది. సోదరుల భయభావాన్ని ప్రత్యక్ష వాక్యంలో నిలిపి, క్లిష్టమైన హీబ్రూ నుడికారంలోని అనిశ్చితిని పాదసూచికలో సంరక్షించాం.
