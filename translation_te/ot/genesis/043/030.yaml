  yaml_path: translation/ot/genesis/043/030.yaml
  text: Then Joseph hurried[a], because his compassion for his brother was stirred, and he sought a place to weep[b]. He entered the room and wept there.
translation:
  language: te
  text: అప్పుడు యోసేపు తన సోదరునిపట్ల కరుణ ఉప్పొంగడంతో త్వరపడ్డాడు. అతడు ఏడవడానికి ఒక చోటు వెదికాడు.[a] గదిలోకి వెళ్లి అక్కడ ఏడ్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, ‘ఏడవడానికి వెదికాడు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמַהֵר
  choice: త్వరపడ్డాడు
  rationale: క్రియకు ‘త్వరపడు’ అనే అర్థం ఉంది. మూలంలో లేని ‘బయటికి’ అనే దిశను చేర్చకుండా ఉంచింది.
- source_word: נִכְמְרוּ רַחֲמָיו
  choice: వాత్సల్యం ఉప్పొంగడంతో
  rationale: ‘కరుణలు/అంతరంగ వాత్సల్యాలు కదిలాయి’ అనే హెబ్రీ భావవ్యక్తీకరణలోని గాఢమైన అనురాగాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: אֶל אָחִיו
  choice: తన తమ్ముడిపట్ల
  rationale: సందర్భంలో ఉద్దేశించబడినవాడు బెన్యామీను, యోసేపు తమ్ముడు. పేరును చేర్చకుండా సంబంధాన్ని సహజమైన తెలుగులో స్పష్టం చేస్తుంది.
- source_word: וַיְבַקֵּשׁ לִבְכּוֹת
  choice: ఏడవడానికి ఒక చోటు వెదికాడు
  rationale: మూలం అక్షరార్థంగా ‘ఏడవడానికి వెదికాడు’ అంటుంది; సందర్భంలో అంతర్లీనంగా ఉన్న ఏకాంత స్థలాన్ని సహజ తెలుగులో స్పష్టం చేస్తుంది. మరింత అక్షరార్థ రూపం పాదసూచికలో నిలుపబడింది.
- source_word: הַחַדְרָה
  choice: లోపలి గదిలోకి
  rationale: హెబ్రీ నామవాచకం గది లేదా అంతర్గది అనే అర్థం ఇస్తుంది; సందర్భంలోని వ్యక్తిగత ప్రదేశాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וַיֵּבְךְּ שָׁמָּה
  choice: అక్కడ ఏడ్చాడు
  rationale: ఏడుపును సూచించే క్రియనూ, שָׁמָּה లోని స్థాన ప్రాధాన్యాన్నీ నేరుగా నిలుపుతుంది.
