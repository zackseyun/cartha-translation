id: GEN.43.25
reference: Genesis 43:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּכִ֨ינוּ֙ אֶת הַ/מִּנְחָ֔ה עַד בּ֥וֹא יוֹסֵ֖ף בַּֽ/צָּהֳרָ֑יִם כִּ֣י שָֽׁמְע֔וּ כִּי שָׁ֖ם יֹ֥אכְלוּ לָֽחֶם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/025.yaml
  text: And they prepared the gift until Yosef came at noon[a], because they had heard that they would eat bread there.
translation:
  language: te
  text: వారు యోసేపు మధ్యాహ్నం వచ్చేంతవరకు ఆ కానుకను సిద్ధం చేశారు. ఎందుకంటే తాము అక్కడ భోజనం చేస్తామని వారు విన్నారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ మూలంలో అక్షరార్థంగా ‘రొట్టె తింటారు’; ఇది కలిసి భోజనం చేయడాన్ని సూచించే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּכִינוּ
  choice: సిద్ధం చేశారు
  rationale: כון అనే ధాతువు హిఫీల్ రూపంలో ఇక్కడ ఒక వస్తువును సిద్ధపరచడం అనే అర్థం ఇస్తుంది; ఆధునిక తెలుగులో ఇది సహజంగా ఉంది.
- source_word: הַמִּנְחָה
  choice: ఆ కానుకను
  rationale: ఈ కథన సందర్భంలో מִנְחָה ఆరాధనా అర్పణ కాదు, యోసేపుకు తీసుకొచ్చిన కానుక. ముందు ప్రస్తావించిన కానుకను సూచించేందుకు ‘ఆ’ వాడబడింది.
- source_word: עַד בּוֹא יוֹסֵף
  choice: యోసేపు ... వచ్చేంతవరకు
  rationale: עַד తో కూడిన בוא infinitive construct యోసేపు వచ్చే సమయం వరకు కొనసాగిన సిద్ధపాటును సూచిస్తుంది.
- source_word: בַּצָּהֳרָיִם
  choice: మధ్యాహ్నం
  rationale: ఈ పదం మధ్యాహ్న సమయాన్ని సూచిస్తుంది; తెలుగులో ‘మధ్యాహ్నం’ సంక్షిప్తంగా, సహజంగా ఉంది.
- source_word: כִּי שָׁמְעוּ
  choice: ఎందుకంటే ... వారు విన్నారు
  rationale: మొదటి כִּי కారణాన్ని తెలియజేస్తుంది. తెలుగు వాక్యక్రమంలో కారణ వాక్యాన్ని విడిగా ఉంచడం స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: כִּי שָׁם
  choice: అక్కడ ... అని
  rationale: రెండవ כִּי వారు విన్న విషయం యొక్క విషయవాక్యాన్ని పరిచయం చేస్తుంది; שָׁםను ‘అక్కడ’గా నిలిపాం.
- source_word: יֹאכְלוּ לָחֶם
  choice: భోజనం చేస్తామని
  rationale: అక్షరార్థంగా ‘రొట్టె తింటారు’; సందర్భంలో ఇది భోజనం చేయడాన్ని సూచించే హీబ్రూ నుడికారం. ప్రధాన పాఠ్యంలో సహజమైన తెలుగు ఇచ్చి, అక్షరార్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: יוֹסֵף
  choice: యోసేపు
  rationale: హీబ్రూ పేరుకు సమీపంగా ఉండి, తెలుగులో స్థిరపడిన సహజ రూపం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన కథన శైలి. హీబ్రూ వాక్యంలోని కారణ సంబంధం, స్థల సూచన నిలుపబడ్డాయి; నుడికారాన్ని సహజ తెలుగులో అనువదించి అక్షరార్థాన్ని పాదసూచికలో ఇచ్చాం.
