translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని వరుస చర్యలను నిలుపుతూ, బెన్యామీనును ‘తీసుకోవడం’ అనే భావాన్ని సహజ తెలుగులో ‘వెంటబెట్టుకున్నారు’గా వ్యక్తం చేసింది.
