language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּקְח֤וּ הָֽ/אֲנָשִׁים֙ אֶת הַ/מִּנְחָ֣ה הַ/זֹּ֔את וּ/מִשְׁנֶה כֶּ֛סֶף לָקְח֥וּ בְ/יָדָ֖/ם וְ/אֶת בִּנְיָמִ֑ן וַ/יָּקֻ֨מוּ֙ וַ/יֵּרְד֣וּ מִצְרַ֔יִם וַ/יַּֽעַמְד֖וּ לִ/פְנֵ֥י יוֹסֵֽף־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/015.yaml
  text: So the men took this gift[a], and they took double the money in their hand, and Benjamin[d][c][b]. Then they arose and went down to Egypt and stood before Joseph.
translation:
  language: te
  text: ఆ మనుషులు ఈ కానుకను, తమ చేతిలో[a] రెట్టింపు సొమ్మును, బెన్యామీనును తీసుకున్నారు. తరువాత వారు లేచి ఐగుప్తుకు దిగివెళ్లి[b], యోసేపు ఎదుట నిలబడ్డారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘తమ చేతిలో’ అనేది తమ స్వాధీనంలో లేదా తమతో ఉంచుకుని అనే అర్థమిచ్చే హీబ్రూ నుడికారం.
    reason: lexical_alternative
  - marker: b
    text: కనాను నుండి ఐగుప్తుకు వెళ్లడాన్ని హీబ్రూ భౌగోళిక నుడికారంలో ‘దిగివెళ్లడం’ అంటారు.
    reason: cultural_note
lexical_decisions:
- source_word: מִנְחָה
  choice: కానుక
  rationale: ఈ కథన సందర్భంలో ఇది ఆరాధనా అర్పణ కాదు; అధికారస్థానంలో ఉన్న వ్యక్తికి అనుకూలత కోసం తీసుకెళ్లే బహుమతి. ‘కానుక’ సహజంగా, గౌరవప్రదంగా ఈ భావాన్ని తెలియజేస్తుంది.
- source_word: מִשְׁנֶה כֶּסֶף
  choice: రెట్టింపు సొమ్ము
  rationale: మునుపటి మొత్తంతో పోలిస్తే రెండింతల ధనాన్ని సూచించే సంక్షిప్తమైన, సహజమైన అనువాదం.
- source_word: כֶּסֶף
  choice: సొమ్ము
  rationale: పదశః ‘వెండి’ అయినా, ఇక్కడ లావాదేవీ కోసం తీసుకెళ్లే ధనం అనే అర్థం ఉంది.
- source_word: בְיָדָם
  choice: తమ చేతిలో
  rationale: స్వాధీనంలో ఉంచుకోవడం లేదా వెంట తీసుకెళ్లడం అనే హీబ్రూ నుడికారాన్ని సాధ్యమైనంత దగ్గరగా నిలుపుతుంది.
- source_word: וְאֶת בִּנְיָמִן
  choice: బెన్యామీనును కూడా వెంటబెట్టుకున్నారు
  rationale: బెన్యామీనును తమతో తీసుకెళ్లారనే భావాన్ని సహజమైన తెలుగులో స్పష్టంగా తెలియజేస్తూ, హీబ్రూ వాక్యంలోని కర్మ సంబంధాన్ని నిలుపుతుంది.
- source_word: וַיָּקֻמוּ
  choice: వారు లేచి
  rationale: ప్రయాణానికి బయలుదేరే ముందు వారు లేచారనే వరుస చర్యను మూలానికి దగ్గరగా ఉంచుతుంది.
- source_word: וַיֵּרְדוּ מִצְרַיִם
  choice: ఐగుప్తుకు దిగివెళ్లి
  rationale: కనాను నుండి ఐగుప్తుకు ప్రయాణాన్ని ‘దిగివెళ్లడం’గా చెప్పే హీబ్రూ భౌగోళిక నుడికారాన్ని నిలుపుతుంది.
- source_word: וַיַּעַמְדוּ לִפְנֵי יוֹסֵף
  choice: యోసేపు ఎదుట నిలబడ్డారు
  rationale: పాలకుని సమక్షంలో నిలబడటాన్ని నేరుగా, గౌరవప్రదంగా వ్యక్తం చేస్తుంది.
- source_word: הָאֲנָשִׁים
  choice: ఆ మనుషులు
  rationale: సందర్భంలో వారు యోసేపు సోదరులైనా, మూలపాఠం వాడిన సాధారణ సూచననే అనుసరిస్తుంది.
