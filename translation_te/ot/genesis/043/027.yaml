translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలిని ఉపయోగించాం. ‘క్షేమం’ అనే పదాన్ని రెండుసార్లు ఉంచడం మూలంలోని שָׁלוֹם పద పునరావృతాన్ని ప్రతిబింబిస్తుంది; ‘బతికే ఉన్నాడా’ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే నేరమైన ప్రయోగం.
