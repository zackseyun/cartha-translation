  text: וַ/יִּשְׁאַ֤ל לָ/הֶם֙ לְ/שָׁל֔וֹם וַ/יֹּ֗אמֶר הֲ/שָׁל֛וֹם אֲבִי/כֶ֥ם הַ/זָּקֵ֖ן אֲשֶׁ֣ר אֲמַרְתֶּ֑ם הַ/עוֹדֶ֖/נּוּ חָֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/027.yaml
  text: He asked them about their well-being and said[a], “Is your elderly father, whom you spoke of[b], well? Is he still alive?”
translation:
  language: te
  text: అతడు వారి క్షేమం గురించి అడిగి[a], “మీరు చెప్పిన వృద్ధుడైన మీ తండ్రి క్షేమంగా ఉన్నాడా? ఆయన ఇంకా బతికే ఉన్నాడా?” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ నుడికారంలో ఇక్కడ ‘షాలోమ్’ అనే పదం ఒకరి మొత్తం క్షేమాన్ని లేదా బాగోగులను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁאַל
  choice: అడిగి
  rationale: שׁאל ఇక్కడ యోసేపు వారి పరిస్థితిని విచారించడాన్ని సూచిస్తుంది. ‘అడిగి’ అనేది సహజమైన, స్పష్టమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: לְשָׁלוֹם
  choice: వారి క్షేమం గురించి
  rationale: ఈ సందర్భంలో שָׁלוֹם కేవలం కలహం లేని స్థితిని కాక, మొత్తం బాగోగులు లేదా క్షేమాన్ని సూచిస్తుంది. తెలుగు నుడికారంలో ‘క్షేమం గురించి అడగడం’ ఈ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: הֲשָׁלוֹם
  choice: క్షేమంగా ఉన్నాడా
  rationale: తండ్రి సాధారణంగా బాగున్నాడా అని ప్రశ్నిస్తోంది; ‘ఆరోగ్యంగా’ అని అనడం హీబ్రూ పదార్థాన్ని కేవలం శారీరక ఆరోగ్యానికే పరిమితం చేస్తుంది.
- source_word: אֲבִיכֶם הַזָּקֵן
  choice: వృద్ధుడైన మీ తండ్రి
  rationale: הַזָּקֵן తండ్రి వృద్ధాప్యాన్ని స్పష్టంగా సూచిస్తుంది. ‘వృద్ధుడైన’ గౌరవప్రదమైన, ప్రస్తుత ప్రామాణిక తెలుగు రూపం.
- source_word: אֲשֶׁר אֲמַרְתֶּם
  choice: మీరు చెప్పిన
  rationale: సోదరులు ఇంతకు ముందు ప్రస్తావించిన తండ్రిని ఈ సంబంధ వాక్యం సూచిస్తుంది. ‘మీరు చెప్పిన’ సంక్షిప్తంగా, సహజంగా ఉంది.
- source_word: הַעוֹדֶנּוּ חָי
  choice: ఆయన ఇంకా బతికే ఉన్నాడా
  rationale: עוֹד కొనసాగుతున్న స్థితిని, חָי సజీవంగా ఉండడాన్ని సూచిస్తాయి. ‘ఇంకా బతికే ఉన్నాడా’ ప్రశ్నలోని నేరుతనాన్ని, సహజత్వాన్ని కాపాడుతుంది.
