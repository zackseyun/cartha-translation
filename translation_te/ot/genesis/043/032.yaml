source:
  edition: WLC
  text: וַ/יָּשִׂ֥ימוּ ל֛/וֹ לְ/בַדּ֖/וֹ וְ/לָ/הֶ֣ם לְ/בַדָּ֑/ם וְ/לַ/מִּצְרִ֞ים הָ/אֹכְלִ֤ים אִתּ/וֹ֙ לְ/בַדָּ֔/ם כִּי֩ לֹ֨א יוּכְל֜וּ/ן הַ/מִּצְרִ֗ים לֶ/אֱכֹ֤ל אֶת הָֽ/עִבְרִים֙ לֶ֔חֶם כִּי תוֹעֵבָ֥ה הִ֖וא לְ/מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/032.yaml
  text: So they served him by himself[a], and them by themselves, and the Egyptians who ate with him by themselves, because the Egyptians could not eat bread with the Hebrews, for that is an abomination to the Egyptians.
translation:
  language: te
  text: వారు అతనికి విడిగా, వారికి విడిగా, అతనితో కలిసి భోజనం చేస్తున్న ఐగుప్తీయులకు విడిగా వడ్డించారు. ఎందుకంటే ఐగుప్తీయులు హెబ్రీయులతో కలిసి భోజనం చేయలేరు[a]; అలా చేయడం ఐగుప్తీయులకు అసహ్యమైన విషయం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “హెబ్రీయులతో రొట్టె తినడం”; ఇది వారితో కలిసి భోజనం చేయడాన్ని సూచించే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשִׂימוּ
  choice: వడ్డించారు
  rationale: మూల క్రియకు అక్షరార్థంగా ‘ఉంచారు’ అనే భావం ఉన్నా, భోజన సందర్భంలో వేర్వేరు గుంపులకు ఆహారం అమర్చిపెట్టడాన్ని సహజ తెలుగులో ‘వడ్డించారు’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: לְבַדּוֹ / לְבַדָּם
  choice: విడిగా
  rationale: మూలంలో మూడుసార్లు కనిపించే వేర్పాటు భావాన్ని తెలుగులోనూ మూడుసార్లు పునరావృతం చేసి సామాజిక దూరాన్ని నిలిపింది.
- source_word: הָאֹכְלִים אִתּוֹ
  choice: అతనితో కలిసి భోజనం చేస్తున్న
  rationale: హీబ్రూ వర్తమాన కృదంత భావాన్ని సందర్భానుగుణంగా కొనసాగుతున్న భోజన చర్యగా సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: לֹא יוּכְלוּן
  choice: చేయలేరు
  rationale: ఇక్కడ శారీరక అసమర్థతకన్నా సామాజిక లేదా ఆచారపరమైన అసాధ్యత ప్రధానంగా ఉంది; ‘చేయలేరు’ ఆ అనిశ్చితిని నిలుపుతుంది.
- source_word: לֶאֱכֹל אֶת הָעִבְרִים לֶחֶם
  choice: హెబ్రీయులతో కలిసి భోజనం చేయడం
  rationale: ‘రొట్టె తినడం’ అనే హీబ్రూ నుడికారం కలిసి భోజనం చేయడాన్ని సూచిస్తుంది. అక్షరానువాదం తెలుగులో అపార్థం కలిగించగలదు కాబట్టి నుడికార భావాన్ని ప్రధాన పాఠ్యంలో ఇచ్చింది.
- source_word: תוֹעֵבָה
  choice: అసహ్యకరమైనది
  rationale: ఈ పదంలోని బలమైన సాంస్కృతిక లేదా ఆచారపరమైన విరక్తిని సహజ ఆధునిక తెలుగులో తెలియజేస్తుంది; నిర్దిష్ట మతపరమైన వివరణను అనవసరంగా చేర్చదు.
- source_word: מִצְרִים / הָעִבְרִים
  choice: ఐగుప్తీయులు / హెబ్రీయులు
  rationale: రెండు జనసమూహాల మధ్య మూలపాఠ్యం చూపించే స్పష్టమైన సామాజిక భేదాన్ని నిలుపుతుంది.
theological_decisions:
- issue: ఐగుప్తీయుల అసహ్యానికి గల కారణం
  choice: కారణాన్ని వివరించకుండా మూలపాఠ్యంలోని సాంస్కృతిక నిషేధాన్ని మాత్రమే పేర్కొనడం
  alternative: జాతి, ఆచారం లేదా వృత్తి ఆధారిత నిర్దిష్ట కారణాన్ని చేర్చడం
  rationale: ఈ వచనం ఆ అసహ్యానికి ఖచ్చితమైన కారణం చెప్పదు. కాబట్టి ఊహాత్మక చారిత్రక లేదా మతపరమైన వివరణను పాఠ్యంలోకి దిగుమతి చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. హీబ్రూ వాక్యంలోని మూడంచెల వేర్పాటును పునరావృత నిర్మాణంతో నిలిపి, ‘రొట్టె తినడం’ అనే నుడికారాన్ని సహజ తెలుగు ‘భోజనం చేయడం’గా అందించింది.
