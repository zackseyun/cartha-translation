source:
  edition: WLC
  text: וַ/יֹּאמְר֡וּ שָׁא֣וֹל שָֽׁאַל הָ֠/אִישׁ לָ֣/נוּ וּ/לְ/מֽוֹלַדְתֵּ֜/נוּ לֵ/אמֹ֗ר הַ/ע֨וֹד אֲבִי/כֶ֥ם חַי֙ הֲ/יֵ֣שׁ לָ/כֶ֣ם אָ֔ח וַ/נַ֨גֶּד ל֔/וֹ עַל פִּ֖י הַ/דְּבָרִ֣ים הָ/אֵ֑לֶּה הֲ/יָד֣וֹעַ נֵדַ֔ע כִּ֣י יֹאמַ֔ר הוֹרִ֖ידוּ אֶת אֲחִי/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/007.yaml
  text: They said, “The man questioned us closely about us and about our family, saying, ‘Is your father still alive? Do you have another brother?’ So we told him according to these words. How could we possibly know that he would say, ‘Bring your brother down’?”
translation:
  language: te
  text: 'వారు ఇలా అన్నారు: “ఆ మనిషి మమ్మల్ని మా గురించీ, మా కుటుంబం గురించీ క్షుణ్ణంగా విచారించాడు. ‘మీ తండ్రి ఇంకా బతికే ఉన్నాడా? మీకు మరో సోదరుడు ఉన్నాడా?’ అని అడిగాడు. ఆ ప్రశ్నలకు తగినట్లే మేము అతనికి చెప్పాం. ‘మీ సోదరుణ్ణి తీసుకొని దిగిరండి’ అని అతడు అంటాడని మాకెలా తెలిసేది?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׁאוֹל שָׁאַל
  choice: క్షుణ్ణంగా అడిగాడు
  rationale: హీబ్రూ క్రియ పునరుక్తి ప్రశ్నల తీవ్రతను సూచిస్తుంది; సహజమైన ఆధునిక తెలుగులో దానిని ‘క్షుణ్ణంగా’ అని వ్యక్తం చేశాం.
- source_word: מוֹלַדְתֵּנוּ
  choice: మా కుటుంబం
  rationale: ఈ సందర్భంలో ఈ పదం జన్మసంబంధమైన బంధువర్గాన్ని లేదా కుటుంబ నేపథ్యాన్ని సూచిస్తుంది; ‘మా కుటుంబం’ సాధారణ పాఠకులకు సహజంగా ఉంటుంది.
- source_word: הֲיֵשׁ לָכֶם אָח
  choice: మీకు మరో సోదరుడు ఉన్నాడా?
  rationale: సందర్భం ప్రకారం ఇప్పటికే అక్కడున్న సోదరులతో పాటు ఇంకొక సోదరుడు ఉన్నాడా అనే ప్రశ్న; అందువల్ల తెలుగులో సహజత కోసం ‘మరో’ చేర్చబడింది.
- source_word: עַל־פִּי הַדְּבָרִים הָאֵלֶּה
  choice: అతడు అడిగినదాని ప్రకారమే
  rationale: అక్షరార్థంగా ‘ఈ మాటల ప్రకారం’; సందర్భంలో వారు అడిగిన ప్రశ్నలకు తగిన సమాచారమే ఇచ్చారని భావం.
- source_word: הוֹרִידוּ
  choice: తీసుకొని దిగిరండి
  rationale: హీబ్రూ ‘కిందికి తీసుకురండి’ అనే దిశార్థాన్ని కలిగి ఉంది; కథలో కనానునుంచి ఐగుప్తుకు వెళ్లడాన్ని ‘దిగడం’గా చెప్పే భాషను నిలిపాం.
theological_decisions:
- issue: సోదరుడి వయస్సు లేదా జననక్రమం
  choice: సోదరుడు
  alternative: తమ్ముడు
  rationale: హీబ్రూ אָח స్వతహాగా పెద్ద లేదా చిన్న సోదరుడని నిర్దిష్టం చేయదు. సందర్భంలో బెన్యామీను చిన్నవాడైనా, మూలపదంలోని సాధారణతను కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సంభాషణకు సహజమైన శైలి. హీబ్రూ ప్రశ్నార్థక వాక్యంలోని బలమైన అసాధ్యత భావాన్ని ‘మాకెలా తెలిసేది?’గా నిలిపాం.
