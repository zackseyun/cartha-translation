  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ שָׁל֨וֹם לָ/כֶ֜ם אַל תִּירָ֗אוּ אֱלֹ֨הֵי/כֶ֜ם וֵֽ/אלֹהֵ֤י אֲבִי/כֶם֙ נָתַ֨ן לָ/כֶ֤ם מַטְמוֹן֙ בְּ/אַמְתְּחֹ֣תֵי/כֶ֔ם כַּסְפְּ/כֶ֖ם בָּ֣א אֵלָ֑/י וַ/יּוֹצֵ֥א אֲלֵ/הֶ֖ם אֶת שִׁמְעֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/023.yaml
  text: He said[a], “Peace to you. Do not be afraid. Your God and the God of your father has given you treasure in your sacks[b]. Your silver came to me.” Then he brought Simeon out to them.
translation:
  language: te
  text: అతడు, “మీకు క్షేమం కలుగుగాక. భయపడకండి. మీ దేవుడూ మీ తండ్రి దేవుడూ మీ గోనెసంచుల్లో మీకు ఒక నిధిని[a] ఇచ్చాడు. మీ వెండి[b] నాకు చేరింది” అన్నాడు. తరువాత అతడు షిమ్యోనును వారి దగ్గరికి బయటకు తీసుకొచ్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘దాచిన నిధిని.’
    reason: מַטְמוֹן అనే పదంలో దాచిపెట్టిన లేదా నిల్వచేసిన నిధి అనే భావఛాయ ఉంది.
  - marker: b
    text: లేదా ‘మీ డబ్బు.’ హీబ్రూలో ‘వెండి’ అనే పదం తరచుగా డబ్బును సూచిస్తుంది.
    reason: כֶּסֶף యొక్క అక్షరార్థం ‘వెండి’; ఈ సందర్భంలో అది చెల్లింపు డబ్బును సూచించవచ్చు.
lexical_decisions:
- source_word: שָׁלוֹם לָכֶם
  choice: మీకు క్షేమం కలుగుగాక
  rationale: ఈ సందర్భంలో שָׁלוֹם భయాన్ని తొలగించే అభయవచనం/శుభాకాంక్షగా పనిచేస్తుంది. ‘క్షేమం’ దాని శాంతి, సురక్షిత స్థితి అనే భావాలను సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: אַל תִּירָאוּ
  choice: భయపడకండి
  rationale: బహువచన నిషేధాజ్ఞను సహజమైన, గౌరవప్రదమైన ఆధునిక తెలుగులో నేరుగా వ్యక్తం చేస్తుంది.
- source_word: אֱלֹהֵיכֶם וֵאלֹהֵי אֲבִיכֶם
  choice: మీ దేవుడూ మీ తండ్రి దేవుడూ
  rationale: దేవునికి ఏకవచన సూచనను, ‘తండ్రి’ అనే హీబ్రూ ఏకవచనాన్ని అలాగే నిలుపుతుంది.
- source_word: נָתַן לָכֶם
  choice: మీకు ... ఇచ్చాడు
  rationale: హీబ్రూ సంపూర్ణ క్రియను నేరుగా భూతకాలంలో అనువదిస్తూ, నిధి ఇప్పుడు సంచుల్లో ఉండటానికి ఇచ్చిన వివరణను స్పష్టంగా ఉంచుతుంది.
- source_word: מַטְמוֹן
  choice: నిధి
  rationale: దాచిపెట్టిన లేదా నిల్వచేసిన విలువైన వస్తువు అనే భావాన్ని సంక్షిప్తంగా అందిస్తుంది; దాగి ఉన్నదనే ఛాయను పాదసూచికలో నిలిపింది.
- source_word: בְּאַמְתְּחֹתֵיכֶם
  choice: మీ గోనెసంచుల్లో
  rationale: ధాన్యం రవాణా చేసే సంచుల సందర్భాన్ని సాధారణ ‘సంచులు’ కంటే స్పష్టంగా తెలియజేస్తుంది.
- source_word: כַּסְפְּכֶם בָּא אֵלָי
  choice: మీ వెండి నాకు చేరింది
  rationale: כֶּסֶף యొక్క మౌలిక అర్థమైన ‘వెండి’ని, בָּא אֵלָי అనే ‘నా దగ్గరికి వచ్చింది/చేరింది’ నిర్మాణాన్ని కాపాడుతుంది; ‘డబ్బు’ అనే సందర్భార్థాన్ని పాదసూచికలో ఇస్తుంది.
- source_word: וַיּוֹצֵא אֲלֵהֶם אֶת שִׁמְעוֹן
  choice: తరువాత అతడు షిమ్యోనును బయటకు తీసుకొచ్చి వారి దగ్గరికి తీసుకువచ్చాడు
  rationale: יצא హిఫీల్ రూపంలోని ‘బయటకు తీసుకురావడం’ అనే దిశాభావాన్ని, אֲלֵהֶם లోని ‘వారి దగ్గరికి’ అనే భావాన్ని రెండింటినీ నిలుపుతుంది.
theological_decisions:
- issue: గృహనిర్వాహకుడు దేవుని గురించి పలికిన మాటల భావం
  choice: అతని మాటలను ‘మీ దేవుడూ మీ తండ్రి దేవుడూ’ అని నేరుగా అనువదించడం
  alternative: ఇది కేవలం మర్యాదపూర్వక అనుకూల మాట అని గానీ, అతని వ్యక్తిగత విశ్వాస ప్రకటన అని గానీ స్పష్టీకరించడం
  rationale: హీబ్రూ పాఠం గృహనిర్వాహకుని అంతరంగ విశ్వాసాన్ని వివరించదు. కాబట్టి అనువాదం అతని మాటలను మాత్రమే అందించి, పాఠం తేల్చని ధార్మిక ప్రశ్నను తేల్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే కథన గౌరవాన్ని నిలుపుతూ అనువదించబడింది. సంభాషణలో గౌరవపూర్వక బహువచన రూపాలు వాడబడ్డాయి; హీబ్రూ వాక్యంలోని సంక్షిప్త అభయవచనం, ‘వెండి’ అనే స్పష్టమైన రూపకం, షిమ్యోనును ‘బయటకు’ తీసుకురావడం అనే దిశాభావం కాపాడబడ్డాయి.
