- from: ఆహారం కొనడానికి[b] మేము అదనంగా వెండిని[a] మా చేతిలో[c] తీసుకొని దిగివచ్చాము. మా వెండిని మా సంచుల్లో ఎవరు పెట్టారో మాకు తెలియదు.
  to: ఆహారం కొనడానికి[b] మేము అదనపు వెండిని[a] మా చేతుల్లో[c] తీసుకొని దిగివచ్చాము. మా వెండిని మా సంచుల్లో ఎవరు పెట్టారో మాకు తెలియదు.
