translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ప్రత్యక్ష సంభాషణ శైలిని ఉపయోగించాం. ‘దిగివచ్చాము’ ద్వారా ఆదికాండంలోని ప్రయాణ దిశను నిలిపి, ‘వెండి’ ద్వారా హీబ్రూ పదపునరుక్తిని కనిపించేలా చేశాం; అవసరమైన సాధారణ అర్థాలను పాదసూచికల్లో ఇచ్చాం.
