source:
  edition: WLC
  text: וְ/כֶ֧סֶף אַחֵ֛ר הוֹרַ֥דְנוּ בְ/יָדֵ֖/נוּ לִ/שְׁבָּר אֹ֑כֶל לֹ֣א יָדַ֔עְנוּ מִי שָׂ֥ם כַּסְפֵּ֖/נוּ בְּ/אַמְתְּחֹתֵֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/022.yaml
  text: And we have brought down other silver in our hands to buy food[c][b][a]. We do not know who put our silver in our sacks.
translation:
  language: te
  text: ఆహారం కొనడానికి[b] మేము అదనపు వెండిని[a] మా చేతుల్లో[c] తీసుకొని దిగివచ్చాము. మా వెండిని మా సంచుల్లో ఎవరు పెట్టారో మాకు తెలియదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “డబ్బును”; ఈ వచనంలో రెండుసార్లు వచ్చిన హీబ్రూ పదం వెండి అనే లోహాన్ని గానీ డబ్బును గానీ సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ధాన్యం కొనడానికి”; ఇక్కడి క్రియాపదబంధం ప్రత్యేకంగా ధాన్యం కొనడాన్ని సూచించవచ్చు, అయితే నామవాచకానికి ‘ఆహారం’ అనే విస్తృతార్థం ఉంది.
    reason: lexical_alternative
  - marker: c
    text: లేదా, “మా చేతిలో”; హీబ్రూలో అక్షరార్థంగా ఏకవచనంలో “మా చేతిలో” అని ఉంది.
    reason: translation_alternative
lexical_decisions:
- source_word: וְ/כֶסֶף אַחֵר
  choice: అదనంగా వెండిని
  rationale: כֶּסֶף అనే పదం వెండిని గానీ చెల్లింపుకు ఉపయోగించే డబ్బును గానీ సూచించగలదు. ఒకే హీబ్రూ పదం రెండుసార్లు వచ్చినదాన్ని కనిపించేలా ‘వెండి’ అని ఉంచాం; אַחֵר ఇక్కడ ముందటి మొత్తానికి అదనంగా తెచ్చిన మొత్తాన్ని సూచిస్తుంది.
- source_word: הוֹרַדְנוּ
  choice: దిగివచ్చాము
  rationale: ירד యొక్క హిఫీల్ రూపం అక్షరార్థంగా ‘కిందికి తీసుకొనివచ్చాము’ అని సూచిస్తుంది. కనాను నుండి ఐగుప్తుకు ప్రయాణాన్ని ఆదికాండం ‘దిగివెళ్లడం’గా వర్ణించే భౌగోళిక దృక్కోణాన్ని ఈ ప్రయోగం నిలుపుతుంది.
- source_word: בְ/יָדֵ/נוּ
  choice: మా చేతిలో
  rationale: హీబ్రూలో అక్షరార్థంగా ‘మా చేతిలో’ అనే ఏకవచన శరీరభాగ నామంతో కూడిన సమూహార్థక నుడికారం ఉంది. తెలుగులోనూ ‘మా చేతిలో తీసుకొని’ అనేది సహజంగా ‘మా వెంట/మా అధీనంలో తీసుకొని’ అనే భావాన్ని ఇస్తుంది.
- source_word: לִ/שְׁבָּר אֹכֶל
  choice: ఆహారం కొనడానికి
  rationale: ఈ సందర్భంలో שׁבר కొనడాన్ని, ముఖ్యంగా ధాన్యం లేదా సరుకులు కొనడాన్ని సూచిస్తుంది; అయితే אֹכֶל సాధారణంగా ‘ఆహారం’ అనే విస్తృతార్థం కలిగి ఉన్నందున దానినే ప్రధాన పాఠంలో ఉంచాం.
- source_word: לֹא יָדַעְנוּ
  choice: మాకు తెలియదు
  rationale: పూర్తిక్రియా రూపం గతం నుండి కొనసాగుతున్న ప్రస్తుత తెలియకపోవడాన్ని తెలియజేయగలదు. ప్రత్యక్ష సంభాషణలో ‘మాకు తెలియదు’ సహజంగా ఆ ప్రస్తుత వాదనను వ్యక్తం చేస్తుంది.
- source_word: מִי שָׂם
  choice: ఎవరు పెట్టారో
  rationale: מִי పరోక్ష ప్రశ్నలో ‘ఎవరు’ అని, שׂים సాధారణంగా ‘పెట్టు/ఉంచు’ అని అర్థమిస్తాయి; తెలుగు పరోక్ష ప్రశ్న నిర్మాణానికి ‘ఎవరు పెట్టారో’ సహజం.
- source_word: כַּסְפֵּ/נוּ
  choice: మా వెండిని
  rationale: మొదటి כֶּסֶף తో పదపునరుక్తిని నిలుపుతూ అదే ‘వెండి’ పదాన్ని వాడాం; సందర్భంలో ఇది చెల్లింపు సొమ్ముగా పనిచేస్తుంది.
- source_word: בְּ/אַמְתְּחֹתֵי/נוּ
  choice: మా సంచుల్లో
  rationale: אַמְתַּחַת ధాన్యం లేదా ప్రయాణ సరుకులు మోసే సంచి/గోనెను సూచిస్తుంది. ‘సంచులు’ ఆధునిక తెలుగులో స్పష్టమైన, విస్తృతంగా అర్థమయ్యే పదం.
