language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְהִ֗י כַּ/אֲשֶׁ֤ר כִּלּוּ֙ לֶ/אֱכֹ֣ל אֶת הַ/שֶּׁ֔בֶר אֲשֶׁ֥ר הֵבִ֖יאוּ מִ/מִּצְרָ֑יִם וַ/יֹּ֤אמֶר אֲלֵי/הֶם֙ אֲבִי/הֶ֔ם שֻׁ֖בוּ שִׁבְרוּ לָ֥/נוּ מְעַט אֹֽכֶל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/002.yaml
  text: And when they had finished eating the grain that they had brought from Egypt[a], their father said to them, “Go back; buy us a little food.”
translation:
  language: te
  text: వారు ఐగుప్తు నుండి తెచ్చిన ధాన్యాన్ని తినడం ముగించినప్పుడు, వారి తండ్రి వారితో, “మళ్లీ వెళ్లి మన కోసం కొంచెం ఆహారం కొనండి” అన్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: అప్పుడు
  rationale: హీబ్రూ కథన సూత్రం తరువాతి సంఘటనను ముందటి సందర్భంతో కలుపుతుంది. తెలుగులో వాక్యాన్ని సహజంగా ఉంచుతూ కాలసంబంధాన్ని ‘...ముగించినప్పుడు’ తెలియజేస్తుంది.
- source_word: כִּלּוּ לֶאֱכֹל
  choice: తినడం ముగించినప్పుడు
  rationale: כלהతో క్రియార్థక రూపం కలసి తినే పని పూర్తయిందని సూచిస్తుంది; ఈ భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: הַשֶּׁבֶר
  choice: ధాన్యాన్ని
  rationale: యోసేపు కథలో ఈ పదం కరవు సమయంలో కొనుగోలు చేసిన ధాన్యాన్ని ప్రత్యేకంగా సూచిస్తుంది; సాధారణ ‘ఆహారం’ కంటే ‘ధాన్యం’ మరింత నిర్దిష్టం.
- source_word: הֵבִיאוּ מִמִּצְרָיִם
  choice: ఐగుప్తు నుండి తెచ్చిన
  rationale: ధాన్యాన్ని తినడం పూర్తవడానికి ముందే దాన్ని ఐగుప్తు నుండి తెచ్చారనే క్రమాన్ని తెలుగు సంబంధక క్రియ సహజంగా తెలియజేస్తుంది.
- source_word: אֲבִיהֶם
  choice: వారి తండ్రి
  rationale: మూలంలోని బంధసూచక పదాన్ని అలాగే నిలుపుతుంది; ఇక్కడ ‘యాకోబు’ అనే పేరును చేర్చాల్సిన అవసరం లేదు.
- source_word: שֻׁבוּ
  choice: మళ్లీ వెళ్లి
  rationale: వారు తిరిగి ఐగుప్తుకు వెళ్లాలనే ఆజ్ఞను సహజమైన తెలుగులో తెలియజేస్తుంది; ‘తిరిగి వెళ్లి’ కూడా సాధ్యమే.
- source_word: שִׁבְרוּ
  choice: కొనండి
  rationale: ఈ సందర్భంలో שׁבר ధాన్యం లేదా ఆహారం కొనడాన్ని సూచిస్తుంది. తరువాత కర్మ స్పష్టంగా ఉన్నందున క్రియలో ‘ధాన్యం’ అని అదనంగా చేర్చలేదు.
- source_word: לָנוּ
  choice: మన కోసం
  rationale: దాతృక భావాన్ని ఆధునిక తెలుగులో సహజంగా, స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: מְעַט אֹכֶל
  choice: కొంచెం ఆహారం
  rationale: מְעַט చిన్న పరిమాణాన్ని, אֹכֶל సాధారణంగా ఆహారాన్ని సూచిస్తాయి; ఈ రెండింటి వ్యత్యాసాన్ని నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. మొదటి భాగంలోని הַשֶּׁבֶר‌ను నిర్దిష్టంగా ‘ధాన్యం’గా, చివరి אֹכֶל‌ను విస్తృతార్థంలో ‘ఆహారం’గా అనువదించి మూలంలోని పదభేదాన్ని నిలిపాం. ప్రత్యక్ష వాక్యంలో తండ్రి తనను కుటుంబంతో కలుపుకొని చెప్పే భావానికి ‘మన కోసం’ ఉపయోగించాం.
