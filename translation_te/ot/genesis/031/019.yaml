base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/019.yaml
  text: Laban had gone to shear his flock[a], and Rachel stole the household idols that belonged to her father.
translation:
  language: te
  text: లాబాను తన మంద బొచ్చు కత్తిరించడానికి వెళ్లి ఉండగా, రాహేలు తన తండ్రికి చెందిన గృహదేవతా విగ్రహాలను[a] దొంగిలించింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హెబ్రీ: తెరాఫీమ్; ‘ఇంటి దేవుళ్లు’ అని కూడా అనువదించవచ్చు.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָלַךְ
  choice: వెళ్లినప్పుడు
  rationale: కథనంలో ఇది రాహేలు చేసిన ప్రధాన కార్యానికి నేపథ్య పరిస్థితిని తెలియజేస్తుంది. తెలుగు ఉపవాక్య నిర్మాణం లాబాను అక్కడ లేని సమయంలో దొంగతనం జరిగిందనే సంబంధాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לִגְזֹז
  choice: బొచ్చు కత్తిరించడానికి
  rationale: మంద జంతువుల బొచ్చును కత్తిరించే ప్రత్యేక కార్యాన్ని సాధారణ ఆధునిక తెలుగు పాఠకులకు స్పష్టంగా తెలియజేస్తుంది.
- source_word: צֹאנוֹ
  choice: తన మంద
  rationale: ఈ పదం గొర్రెలు, మేకలు వంటి చిన్న పశువుల సమూహాన్ని సూచించగలదు; ‘మంద’ ఆ సమూహార్థాన్ని అనవసరంగా కుదించకుండా నిలుపుతుంది.
- source_word: וַתִּגְנֹב
  choice: దొంగిలించింది
  rationale: మూలంలోని גנב పదానికి ఉన్న స్పష్టమైన దొంగతనపు నైతిక-చట్టపరమైన భావాన్ని మెత్తబరచకుండా కాపాడుతుంది.
- source_word: הַתְּרָפִים
  choice: గృహదేవతా విగ్రహాలను
  rationale: ఇంటితో సంబంధమున్న ఆరాధనా వస్తువులని, అవి విగ్రహాలని ఆధునిక పాఠకులకు స్పష్టంగా తెలియజేస్తుంది; మూలపదం మరియు మరో సాధ్యమైన అనువాదం పాదటిప్పణిలో ఇవ్వబడ్డాయి.
- source_word: אֲשֶׁר לְאָבִיהָ
  choice: తన తండ్రికి చెందిన
  rationale: ఈ హెబ్రీ వాక్యభాగం తెలిపే స్వామ్య సంబంధాన్ని సహజమైన తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: וְ
  choice: ఉపవాక్య సంబంధంలో అంతర్లీనంగా వ్యక్తీకరించబడింది
  rationale: ప్రత్యేకంగా ‘ఇప్పుడు’ అనే కాలసూచక పదాన్ని చేర్చకుండా, నేపథ్య కార్యానికీ ప్రధాన కార్యానికీ ఉన్న కథన సంబంధాన్ని తెలుగు వాక్య నిర్మాణమే తెలియజేస్తుంది.
theological_decisions:
- issue: תְּרָפִים అనే గృహ ఆరాధనా వస్తువుల పేరు
  choice: గృహదేవతా విగ్రహాలు
  alternative: తెరాఫీము; ఇంటి దేవుళ్లు
  rationale: మూలపదం గృహానికి సంబంధించిన ఆరాధనా ప్రతిమలను సూచిస్తుంది. ‘గృహదేవతా విగ్రహాలు’ వాటి మతపరమైన స్వభావాన్ని దాచకుండా పాఠకులకు అర్థమయ్యేలా చేస్తుంది; ఒక ప్రత్యేక మతశాఖ వ్యాఖ్యానాన్ని ఇందులో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. నేపథ్య క్రియను ‘వెళ్లినప్పుడు’ అనే నిర్మాణంతో చూపించి, రాహేలు చేసిన దొంగతనాన్ని ప్రధాన కార్యంగా నిలిపాం. పాదటిప్పణి గుర్తును అది వివరిస్తున్న ‘గృహదేవతా విగ్రహాలను’ అనే పదబంధం వెంట ఉంచాం.
