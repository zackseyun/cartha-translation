    rationale: హీబ్రూలో ‘నేను దాటను’ మరియు ‘నువ్వు దాటవు’ అనే రెండు సమాంతర ప్రమాణ-నిబంధనలు ఉన్నాయి; ప్రత్యక్ష ఆజ్ఞ లేదు. ‘రానని’ అని ఇవ్వడం రెండింటి సమాంతరతను కాపాడుతుంది.
  - severity: low
