  to: '“ఈ రాళ్లకుప్ప సాక్షి; ఈ రాతి స్తంభమూ సాక్షి: నేను ఈ రాళ్లకుప్పను దాటి నీ వైపుకు హాని చేయడానికి రానని, నువ్వు ఈ రాళ్లకుప్పను, ఈ రాతి స్తంభాన్ని దాటి నా వైపుకు హాని చేయడానికి రావని ఇవి సాక్ష్యంగా ఉన్నాయి.”'
  rationale: సవరణ మూలంలోని రెండు సమాంతర ప్రమాణ నిబంధనలను తెలుగులో సమానమైన ‘రానని’ రూపాలతో అందించింది; రెండవ భాగాన్ని ఆజ్ఞగా మార్చలేదు. ‘హాని చేయడానికి’ అనే ఉద్దేశాన్ని రెండు చర్యలతో స్పష్టంగా కలిపింది. ‘రాతి స్తంభం’ ద్వారా నిలబెట్టిన రాతి గుర్తు అనే సందర్భార్థం నిలిచింది. సాక్షి-ప్రకటనకు ‘ఇవి సాక్ష్యంగా ఉన్నాయి’ అనే ముగింపు తెలుగులో సహజమైన పూర్తి వాక్య నిర్మాణాన్ని అందిస్తుంది.
