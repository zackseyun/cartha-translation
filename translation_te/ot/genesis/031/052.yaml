id: GEN.31.52
reference: Genesis 31:52
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: עֵ֚ד הַ/גַּ֣ל הַ/זֶּ֔ה וְ/עֵדָ֖ה הַ/מַּצֵּבָ֑ה אִם אָ֗נִי לֹֽא אֶֽעֱבֹ֤ר אֵלֶ֨י/ךָ֙ אֶת הַ/גַּ֣ל הַ/זֶּ֔ה וְ/אִם אַ֠תָּה לֹא תַעֲבֹ֨ר אֵלַ֜/י אֶת הַ/גַּ֥ל הַ/זֶּ֛ה וְ/אֶת הַ/מַּצֵּבָ֥ה הַ/זֹּ֖את לְ/רָעָֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/052.yaml
  text: This heap is a witness[a], and the pillar is a witness, that I will not pass over this heap toward you[c][b], and that you will not pass over this heap and this pillar toward me for harm.
translation:
  language: te
  text: '“ఈ రాళ్లకుప్ప సాక్షి; ఈ రాతి స్తంభమూ సాక్షి: నేను ఈ రాళ్లకుప్పను దాటి నీ వైపుకు హాని చేయడానికి రానని, నువ్వు ఈ రాళ్లకుప్పను, ఈ రాతి స్తంభాన్ని దాటి నా వైపుకు హాని చేయడానికి రావని ఇవి సాక్ష్యంగా ఉన్నాయి.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֵד
  choice: సాక్షి
  rationale: జ్ఞాపకార్థంగా నిలిపిన వస్తువు ఒప్పంద నిబంధనకు సాక్షిగా పనిచేస్తుందని తెలిపే విధేయ నామవాచకం.
- source_word: גַּל
  choice: రాళ్లకుప్ప
  rationale: సందర్భంలో సరిహద్దు గుర్తుగా పేర్చిన రాళ్ల కుప్పను సూచిస్తుంది; ‘కుప్ప’ కంటే ‘రాళ్లకుప్ప’ భౌతిక రూపాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: וְעֵדָה
  choice: ఈ స్తంభమూ సాక్షి
  rationale: ముందున్న సాక్షి భావానికి సమాంతరంగా స్తంభం కూడా సాక్షిగా ఉందని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: מַצֵּבָה
  choice: స్తంభం
  rationale: నిలువుగా స్థాపించిన రాతి గుర్తును సూచించే సరళమైన, ప్రామాణిక తెలుగు పదం.
- source_word: אִם
  choice: ప్రత్యక్షంగా అనువదించకుండా సాక్ష్యపు నిబంధనగా రెండు వాక్యాలు
  rationale: ఇక్కడ אִם సాధారణ షరతు కంటే ప్రమాణం లేదా ఒప్పంద నిబంధనను ప్రవేశపెడుతుంది. తెలుగులో సాక్షి ప్రకటన తర్వాత నేరుగా నిబంధనలను చెప్పడం సహజం.
- source_word: אֶעֱבֹר / תַעֲבֹר
  choice: దాటి ... రాను / రావద్దు
  rationale: సరిహద్దు గుర్తును దాటి అవతలి పక్షం వైపు వెళ్లడాన్ని సూచిస్తుంది. వ్యక్తి సంకల్పాన్ని తెలిపే మొదటి పురుష రూపానికి ‘రాను’, ఎదుటివానికి విధించిన నిబంధనకు ‘రావద్దు’ సహజంగా సరిపోతాయి.
- source_word: אֵלֶיךָ / אֵלַי
  choice: నీ వైపుకు / నా వైపుకు
  rationale: అవతలి వ్యక్తి దిశగా కదలికను తెలియజేస్తూ, శత్రుత్వ భావాన్ని ఈ పదబంధంలో ముందుగానే చేర్చకుండా ఉంచుతుంది.
- source_word: לְרָעָה
  choice: హాని చేయడానికి
  rationale: కేవలం సరిహద్దు దాటడాన్ని కాక, హానికరమైన లేదా శత్రుత్వ ఉద్దేశంతో దాటడాన్ని నిషేధిస్తున్నదని స్పష్టంగా, సహజంగా తెలుపుతుంది.
theological_decisions:
- issue: సరిహద్దు దాటడంపై నిషేధం సంపూర్ణమా, లేక హానికర ఉద్దేశానికే పరిమితమా?
  choice: ‘హాని చేయడానికి’ అనే ఉద్దేశ పదబంధాన్ని రెండు సమాంతర నిబంధనలకూ వర్తించేలా వాక్యాంత భావంగా నిలిపాం.
  alternative: ప్రతి నిబంధనలో విడిగా ‘హాని చేయడానికి’ అని పునరుక్తి చేయడం, లేదా రెండవ నిబంధనకే పరిమితం చేయడం.
  rationale: హీబ్రూ వాక్యంలో לְרָעָה చివర ఉంచబడింది; సందర్భానుసారం అది పరస్పర సరిహద్దు దాటడాన్ని హానికర ఉద్దేశంతో చేసినప్పుడు నిషేధిస్తుంది. తెలుగులో మొదట ఉంచడం వల్ల రెండు పక్షాల చర్యలకూ అది వర్తిస్తుందని సహజంగా తెలుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరతను కాపాడుతూ సాధారణ పాఠకులకు స్పష్టంగా ఉండే పదప్రయోగం. హీబ్రూలోని సమాంతర ‘సాక్షి’ ప్రకటనను నిలిపి, ఒప్పంద నిబంధనలను సహజమైన ప్రత్యక్ష వాక్యాలుగా అందించాం.
