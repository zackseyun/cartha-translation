- from: ఈ ఇరవై సంవత్సరాలు నేను నీతో ఉన్నాను. నీ ఆడగొర్రెలూ ఆడమేకలూ గర్భస్రావం కాలేదు[a]; నీ మందలోని పొట్టేళ్లను నేను తినలేదు.
  to: ఈ ఇరవై సంవత్సరాలుగా నేను నీతో ఉన్నాను. నీ ఆడగొర్రెలూ ఆడమేకలూ పిల్లలను కోల్పోలేదు[a]; నీ మందలోని పొట్టేళ్లను నేను తినలేదు.
