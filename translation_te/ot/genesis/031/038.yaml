source:
  edition: WLC
  text: זֶה֩ עֶשְׂרִ֨ים שָׁנָ֤ה אָנֹכִי֙ עִמָּ֔/ךְ רְחֵלֶ֥י/ךָ וְ/עִזֶּ֖י/ךָ לֹ֣א שִׁכֵּ֑לוּ וְ/אֵילֵ֥י צֹאנְ/ךָ֖ לֹ֥א אָכָֽלְתִּי׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/038.yaml
  text: These twenty years I have been with you; your ewes and your female goats have not miscarried[a], and I have not eaten the rams of your flock.
translation:
  language: te
  text: ఈ ఇరవై సంవత్సరాలుగా నేను నీతో ఉన్నాను. నీ ఆడగొర్రెలూ ఆడమేకలూ పిల్లలను కోల్పోలేదు[a]; నీ మందలోని పొట్టేళ్లను నేను తినలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “గర్భం పోయలేదు.” హీబ్రూ క్రియ సంతానాన్ని కోల్పోవడం లేదా గర్భం పోవడం అనే అర్థాన్ని సూచించగలదు; ఈ పశుపోషణ సందర్భంలో ఈ రెండు భావాలూ సాధ్యమే.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶה עֶשְׂרִים שָׁנָה
  choice: ఈ ఇరవై సంవత్సరాలు
  rationale: హీబ్రూ పదబంధంలోని సూచనాత్మక బలాన్ని నిలుపుతూ, ఆధునిక తెలుగులో సహజంగా కాలవ్యవధిని తెలియజేస్తుంది.
- source_word: אָנֹכִי עִמָּךְ
  choice: నేను నీతో ఉన్నాను
  rationale: మూలంలో స్పష్టమైన క్రియ లేకపోయినా, సందర్భంలో ఇరవై సంవత్సరాలపాటు కొనసాగిన సహవాసం లేదా సేవను ఈ తెలుగు రూపం సహజంగా వ్యక్తం చేస్తుంది.
- source_word: רְחֵלֶיךָ
  choice: నీ ఆడగొర్రెలు
  rationale: ఈ నామవాచకం సాధారణంగా గొర్రెలను కాక, ప్రత్యేకంగా ఆడగొర్రెలను సూచిస్తుంది.
- source_word: וְעִזֶּיךָ
  choice: ఆడమేకలు
  rationale: మూలపదంలోని ఆడ మేకలనే సూచించే ప్రత్యేకతను స్పష్టమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: לֹא שִׁכֵּלוּ
  choice: గర్భస్రావం కాలేదు
  rationale: పశుపోషణ సందర్భంలో సంతానాన్ని కోల్పోవడం లేదా గర్భం పోవడం అనే భావానికి ఇది సంక్షిప్తమైన, సందర్భోచిత అనువాదం.
- source_word: וְאֵילֵי צֹאנְךָ
  choice: నీ మందలోని పొట్టేళ్లు
  rationale: אֵילִים ప్రత్యేకంగా మగ గొర్రెలను సూచిస్తుంది; 'పొట్టేళ్లు' ఆ జంతు-లింగ ప్రత్యేకతను సహజ తెలుగులో నిలుపుతుంది.
- source_word: לֹא אָכָלְתִּי
  choice: నేను తినలేదు
  rationale: యాకోబు తన మొత్తం సేవాకాలపు ప్రవర్తనను వెనుదిరిగి సమర్థించుకుంటున్న సందర్భంలో తెలుగు భూతకాల రూపం సహజంగా, స్పష్టంగా ఉంది.
