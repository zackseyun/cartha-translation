translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలిని ఉపయోగించాం. ఆడగొర్రెలు, ఆడమేకలు, పొట్టేళ్లు అనే పదాలతో మూలంలోని జంతు-లింగ ప్రత్యేకతను నిలిపాం; శిఖేలు అనే క్రియలోని విస్తృత భావాన్ని పాదటిప్పణిలో భద్రపరిచాం.
