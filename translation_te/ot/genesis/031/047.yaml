translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. రెండు భాషలలోని పేర్ల వ్యత్యాసాన్ని ప్రధాన వాక్యంలో లిప్యంతరీకరణ ద్వారా, వాటి సమానార్థాన్ని పాదసూచికల ద్వారా స్పష్టంచేశాం. పాదసూచిక సూచికలు సంబంధిత పేర్ల వెంట ఉంచబడ్డాయి.
