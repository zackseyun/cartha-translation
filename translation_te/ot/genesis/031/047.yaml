lexical_decisions:
- source_word: וַיִּקְרָא ל֣וֹ לָבָן
  choice: లాబాను దానికి ... అని పేరు పెట్టాడు
  rationale: קרא + ל అనే నామకరణ నిర్మాణాన్ని ఆధునిక తెలుగులో సహజంగా ‘దానికి ... అని పేరు పెట్టాడు’ అని వ్యక్తపరచడం జరిగింది; పురుష ఏకవచన ప్రత్యయం సందర్భంలో నిర్జీవమైన రాళ్లకుప్పను సూచిస్తుంది.
- source_word: יְגַר שָׂהֲדוּתָא
  choice: యెగర్‌-సహదూతా
  rationale: లాబాను పెట్టిన అరామీయ నామాన్ని అనువదించకుండా లిప్యంతరీకరించి, దాని అర్థాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: וְיַעֲקֹב
  choice: యాకోబు మాత్రం
  rationale: וְ సాధారణంగా ‘మరియు’ అయినా, ఇక్కడ ఒకే కుప్పకు లాబాను అరామీయ పేరును, యాకోబు హీబ్రూ పేరును పెట్టిన వ్యత్యాసాన్ని ‘మాత్రం’ సహజంగా తెలియజేస్తుంది.
- source_word: קָרָא ל֖וֹ
  choice: దానికి ... అని పేరు పెట్టాడు
  rationale: మొదటి నామకరణ క్రియతో సమాంతరతను నిలుపుతూ, తెలుగు నామకరణ వాక్యనిర్మాణాన్ని ఉపయోగించాం.
- source_word: גַּלְעֵד
  choice: గలేద్
  rationale: హీబ్రూ నామాన్ని ప్రధాన వాక్యంలో లిప్యంతరీకరించి, దాని పదార్థాన్ని పాదసూచికలో నిలిపాం.
