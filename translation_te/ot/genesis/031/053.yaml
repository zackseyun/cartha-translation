id: GEN.31.53
reference: Genesis 31:53
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אֱלֹהֵ֨י אַבְרָהָ֜ם וֵֽ/אלֹהֵ֤י נָחוֹר֙ יִשְׁפְּט֣וּ בֵינֵ֔י/נוּ אֱלֹהֵ֖י אֲבִי/הֶ֑ם וַ/יִּשָּׁבַ֣ע יַעֲקֹ֔ב בְּ/פַ֖חַד אָבִ֥י/ו יִצְחָֽק׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/053.yaml
  text: May the God of Abraham and the god of Nahor[a], the god of their father, judge between us[c][b]. And Jacob swore by the Fear of his father Isaac.
translation:
  language: te
  text: “అబ్రాహాము దేవుడూ, నాహోరు దేవుడూ—వారి తండ్రి దేవుడు—మన మధ్య తీర్పు తీర్చుగాక” అని అన్నారు.[a] యాకోబు తన తండ్రి ఇస్సాకు యొక్క “భీతి” పేరట ప్రమాణం చేశాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో, “అబ్రాహాము దేవుడూ, నాహోరు దేవుడూ, వారి తండ్రి దేవుడూ మన మధ్య తీర్పు తీర్చుగాక” అని ఒకే దేవుని సూచిస్తున్నట్టుగానూ చదవవచ్చు. అయితే ‘తీర్పు తీర్చుగాక’ అనే హీబ్రూ క్రియ బహువచనంలో ఉంది.
    reason: alternative_reading
  - marker: b
    text: అక్షరార్థంగా, “తన తండ్రి ఇస్సాకు యొక్క భీతి [లేదా భయం] పేరట.” ఇక్కడ ‘భీతి’ అనేది దేవునికి ఉపయోగించిన అసాధారణ బిరుదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהֵי אַבְרָהָם וֵאלֹהֵי נָחוֹר
  choice: అబ్రాహాము దేవుడూ, నాహోరు దేవుడూ
  rationale: రెండు సమాంతర אֱלֹהֵי పదబంధాలను సహజమైన తెలుగులో సమన్వయంగా ఉంచుతుంది. తెలుగులో ఆంగ్లంలా పెద్ద/చిన్న అక్షరాల భేదం లేకపోవడంతో, ఒకే దేవుడా వేర్వేరు దేవుళ్లా అనే సందిగ్ధతను సందర్భం మరియు పాదటిప్పణి ద్వారా నిలుపుతుంది.
- source_word: אֱלֹהֵי אֲבִיהֶם
  choice: వారి తండ్రి దేవుడు
  rationale: ముందున్న ఆహ్వానానికి అనుబంధ వివరణ లేదా పునర్వ్యాఖ్యగా ఉన్న హీబ్రూ నిర్మాణాన్ని సంక్షిప్తంగా ప్రతిబింబిస్తుంది.
- source_word: יִשְׁפְּטוּ בֵינֵינוּ
  choice: మన మధ్య తీర్పు తీర్చుగాక
  rationale: ఇంపర్ఫెక్ట్ క్రియలోని ఆశీర్వచన/కోరిక భావాన్ని ‘తీర్చుగాక’ ద్వారా చూపుతుంది; బహువచన క్రియ వల్ల కలిగే సంఖ్యా అసంగతతను పాదటిప్పణిలో సూచిస్తుంది.
- source_word: וַיִּשָּׁבַע
  choice: ప్రమాణం చేశాడు
  rationale: ప్రమాణసూత్ర సందర్భంలో సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: בְּפַחַד אָבִיו יִצְחָק
  choice: తన తండ్రి ఇస్సాకు భయపడినవాని పేరట
  rationale: פַחַד అనే అసాధారణ దైవనామాన్ని తెలుగులో అక్షరార్థంగా ‘భయం’ అని వ్యక్తీకరించడం దేవునికన్నా భావోద్వేగంపైన ప్రమాణం చేసినట్టు అపార్థం కలిగించవచ్చు. అందుచేత దైవసూచనను స్పష్టంచేస్తూ, అసలు పదంలోని ‘భయపడుట’ భావాన్ని నిలుపుతుంది; అక్షరార్థ రూపం పాదటిప్పణిలో ఇవ్వబడింది.
theological_decisions:
- issue: అబ్రాహాము దేవుడు, నాహోరు దేవుడు, వారి తండ్రి దేవుడు ఒకే దేవుడా లేక వేర్వేరు దేవుళ్లా
  choice: ప్రధాన పాఠంలో సమాంతర పదబంధాలను ఉంచి గుర్తింపును నిర్ధారించకుండా వదిలివేయడం
  alternative: ‘అబ్రాహాము దేవుడూ నాహోరు దేవుడూ అయిన వారి తండ్రి దేవుడు’ అని ఒకే దేవుడిగా స్పష్టీకరించడం
  rationale: హీబ్రూ పునరుక్త אֱלֹהֵי రూపాలు, బహువచన క్రియ, అనుబంధ పదబంధం—ఇవన్నీ నిజమైన వ్యాకరణ-తాత్త్విక సందిగ్ధతను కలిగిస్తాయి. తెలుగు అక్షరరూపంలో capitalization భేదం సాధ్యం కానందున దాన్ని వ్యాఖ్యానాత్మకంగా పరిష్కరించలేదు.
- issue: בְּפַחַד అనే అసాధారణ దైవసూచక బిరుదు
  choice: ‘తన తండ్రి ఇస్సాకు భయపడినవాని పేరట’
  alternative: ‘తన తండ్రి ఇస్సాకు యొక్క భయం తోడు’ లేదా ‘ఇస్సాకు భయం పేరట’
  rationale: మూలంలోని ‘భయం/భీతి’ భావాన్ని కాపాడుతూ, తెలుగులో ప్రమాణం దేవుని పేరటేనని అర్థమయ్యేలా చేస్తుంది. మరింత అక్షరార్థమైన, అసాధారణ బిరుదును పాదటిప్పణిలో నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన బైబిలు శైలి. మూలపాఠంలో ప్రత్యక్షంగా లేని ‘అని లాబాను అన్నాడు’ ప్రధాన పాఠంలో చేర్చడం సందర్భాన్ని స్పష్టంచేసినా, కఠిన మూలనిష్ఠ దృష్టిలో అది అవసరం లేకపోవచ్చు.
