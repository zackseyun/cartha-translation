source:
  edition: WLC
  text: כִּֽי מִשַּׁ֣שְׁתָּ אֶת כָּל כֵּלַ֗/י מַה מָּצָ֨אתָ֙ מִ/כֹּ֣ל כְּלֵי בֵיתֶ֔/ךָ שִׂ֣ים כֹּ֔ה נֶ֥גֶד אַחַ֖/י וְ/אַחֶ֑י/ךָ וְ/יוֹכִ֖יחוּ בֵּ֥ין שְׁנֵֽי/נוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/037.yaml
  text: Since you have searched through all my goods[a], what have you found of all the goods of your house? Set it here before my brothers and your brothers[b], and let them judge between the two of us.
translation:
  language: te
  text: నీవు నా సామానంతటినీ తడిమి వెదికావు గదా; నీ ఇంటి సామానులోనిది ఏమైనా కనుగొన్నావా? దాన్ని ఇక్కడ నా సహోదరుల ఎదుట, నీ సహోదరుల ఎదుట ఉంచు. మన ఇద్దరి మధ్య వారే తీర్పు చెప్పాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మన ఇద్దరి మధ్య వారే నిర్ణయం చేయాలి.” ఈ హీబ్రూ క్రియకు న్యాయనిర్ణయం చేయడం లేదా మధ్యవర్తిగా వివాదాన్ని పరిష్కరించడం అనే భావాలు ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשַּׁשְׁתָּ
  choice: తడిమి వెదికావు
  rationale: మూల క్రియలో చేతులతో తడిమి చూడడం అనే స్పష్టమైన భావం ఉంది; ఈ సందర్భంలో అది దొంగిలించిన వస్తువుల కోసం క్షుణ్ణంగా వెదకడాన్ని సూచిస్తుంది.
- source_word: כָּל כֵּלַי
  choice: నా సామానంతటినీ
  rationale: כְּלִי ఇక్కడ పాత్రలకు మాత్రమే పరిమితం కాకుండా కదిలించగల వస్తువులు, సామాను అనే విస్తృత అర్థంలో ఉంది.
- source_word: מַה מָּצָאתָ מִכֹּל כְּלֵי בֵיתֶךָ
  choice: నీ ఇంటి సామానులోనిది ఏమైనా కనుగొన్నావా?
  rationale: מִן‌ను ఇక్కడ భాగార్థకంగా తీసుకుని, యాకోబు సామానులో లాబాను ఇంటికి చెందిన వస్తువు ఏదైనా దొరికిందా అనే ప్రశ్నను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: שִׂים כֹּה נֶגֶד
  choice: దాన్ని ఇక్కడ ... ఎదుట ఉంచు
  rationale: దొరికిందని చెప్పే వస్తువును సాక్షుల సమక్షంలో బహిరంగంగా పెట్టాలనే ఆజ్ఞను సూటిగా తెలియజేస్తుంది.
- source_word: אַחַי וְאַחֶיךָ
  choice: నా సహోదరులు ... నీ సహోదరులు
  rationale: మూలంలోని సాధారణ బంధుత్వ పదాన్ని నిలుపుతుంది; ఈ సందర్భంలో అది విస్తృత బంధువర్గాన్నీ సూచించవచ్చు.
- source_word: וְיוֹכִיחוּ בֵּין שְׁנֵינוּ
  choice: మన ఇద్దరి మధ్య వారే తీర్పు చెప్పాలి
  rationale: హిఫీల్ రూపానికి ఇక్కడ న్యాయనిర్ణయ లేదా మధ్యవర్తిత్వ భావం ఉంది; 'తీర్పు చెప్పాలి' ఆ భావాన్ని గౌరవప్రదమైన ఆధునిక తెలుగులో అందిస్తుంది.
