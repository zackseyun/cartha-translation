  text: אָנֹכִ֤י הָ/אֵל֙ בֵּֽית אֵ֔ל אֲשֶׁ֨ר מָשַׁ֤חְתָּ שָּׁם֙ מַצֵּבָ֔ה אֲשֶׁ֨ר נָדַ֥רְתָּ לִּ֛/י שָׁ֖ם נֶ֑דֶר עַתָּ֗ה ק֥וּם צֵא֙ מִן הָ/אָ֣רֶץ הַ/זֹּ֔את וְ/שׁ֖וּב אֶל אֶ֥רֶץ מוֹלַדְתֶּֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/013.yaml
  text: I am the God of Bethel[a], where you anointed a pillar and where you vowed a vow to me. Now arise, go out from this land[b], and return to the land of your birth.
translation:
  language: te
  text: “నేనే బేతేలు దేవుడను[a]. అక్కడ నువ్వు ఒక నిలువురాయికి నూనె పోసి అభిషేకించావు; అక్కడ నాకు ఒక మొక్కుబడి చేసుకున్నావు. ఇప్పుడు లేచి, ఈ దేశం నుండి బయలుదేరి, నీ స్వదేశానికి తిరిగి వెళ్లు.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘బేతేలు’ అంటే ‘దేవుని ఇల్లు’; ఇక్కడ అది ఒక స్థలనామం.
    reason: cultural_note
lexical_decisions:
- source_word: הָאֵל בֵּית אֵל
  choice: బేతేలు దేవుణ్ణి
  rationale: నిర్దిష్ట ఉపపదంతో ఉన్న ఈ నిర్మాణం వక్తను యాకోబు బేతేలులో కలుసుకున్న దేవునిగా గుర్తిస్తుంది. బేతేలు అనేది స్థలనామం కాబట్టి దాన్ని అనువదించకుండా లిప్యంతరీకరించాం.
- source_word: מָשַׁחְתָּ שָּׁם מַצֵּבָה
  choice: అక్కడ నువ్వు ఒక స్తంభానికి నూనె అభిషేకం చేశావు
  rationale: מָשַׁחְתָּ అంటే అభిషేకించడం; సందర్భంలో యాకోబు స్తంభంపై నూనె పోశాడు. తెలుగులో ‘స్తంభాన్ని అభిషేకించావు’ కంటే ‘స్తంభానికి నూనె అభిషేకం చేశావు’ concrete actionను స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: מַצֵּבָה
  choice: స్తంభం
  rationale: యాకోబు నిలబెట్టిన స్మారక రాయిని సూచిస్తుంది. ‘నిలువురాయి’ కూడా సాధ్యమే, కాని ‘స్తంభం’ సంక్షిప్తంగా, సాధారణ పాఠకులకు సులభంగా ఉంటుంది.
- source_word: נָדַרְתָּ לִּי שָׁם נֶדֶר
  choice: అక్కడే నాకు మొక్కుబడి చేసుకున్నావు
  rationale: హీబ్రూలో ఒకే మూలానికి చెందిన క్రియ-నామవాచక కలయిక ఉంది. తెలుగులో దానిని యాంత్రికంగా పునరుక్తి చేయకుండా, దేవునికి చేసిన solemn vow అనే భావాన్ని సహజమైన ‘మొక్కుబడి చేసుకున్నావు’తో వ్యక్తం చేశాం.
- source_word: עַתָּה קוּם
  choice: ఇప్పుడు లేచి
  rationale: జ్ఞాపకం చేయడం నుండి ఆజ్ఞకు మార్పును ‘ఇప్పుడు’ తెలియజేస్తుంది; קוּם తరువాతి ప్రయాణ ఆజ్ఞకు సిద్ధపడడాన్ని సూచిస్తుంది.
- source_word: צֵא מִן הָאָרֶץ הַזֹּאת
  choice: ఈ దేశం నుండి బయలుదేరి
  rationale: ఇక్కడ אֶרֶץ మొత్తం భూమిని కాక యాకోబు నివసిస్తున్న ప్రాంతాన్ని సూచిస్తుంది. ‘బయలుదేరి’ అనేది ప్రయాణ సందర్భంలో సహజమైన తెలుగు.
- source_word: וְשׁוּב אֶל אֶרֶץ מוֹלַדְתֶּךָ
  choice: నువ్వు పుట్టిన దేశానికి తిరిగి వెళ్లు
  rationale: מוֹלֶדֶת జన్మస్థలం, స్వదేశం లేదా వంశ సంబంధాన్ని సూచించగలదు. אֶרֶץ‌తో కలిసి ఇక్కడ యాకోబు పుట్టిన/స్వదేశాన్ని సూచించడం సహజం; మూలంలోని ambiguityని అతిగా బంధుత్వానికి పరిమితం చేయలేదు.
theological_decisions:
- issue: వక్త తనను ‘బేతేలు దేవుడు’గా గుర్తించుకోవడం
  choice: బేతేలు దేవుణ్ణి నేనే
  alternative: బేతేలులో ఉన్న దేవుణ్ణి నేనే
  rationale: ఈ నిర్మాణం దేవుణ్ణి బేతేలుకు పరిమితమైన స్థానిక దేవతగా చూపడం కాదు; బేతేలులో యాకోబుకు ప్రత్యక్షమైన అదే దేవునిగా వక్తను గుర్తిస్తుంది. అదనపు వివరణను ప్రధాన పాఠ్యంలో చేర్చకుండా మూల నిర్మాణాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కానీ సాధారణ పాఠకులకు సులభమైన ఏకవచన సంభాషణ శైలిని వాడాం. ప్రధాన పాఠ్యంలో ఉన్న [a] సూచికకు సరిపడే ఒకే పాదటిప్పణి ఇచ్చాం. అందించిన ఆంగ్ల పాదటిప్పణుల్లో గుర్తులు-విషయాలు తారుమారైనట్లు కనిపించినందున, హీబ్రూ మూలానికి సంబంధించిన బేతేలు వివరణనే సరైన చోట ఉంచాం.
