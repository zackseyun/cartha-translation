  text: Then Jacob took a stone and set it up as a pillar[a].
translation:
  language: te
  text: అప్పుడు యాకోబు ఒక రాయిని తీసుకుని, దాన్ని స్తంభంగా నిలబెట్టాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నిలువురాయిగా” లేదా “జ్ఞాపకార్థపు రాయిగా.” హీబ్రూ పదం מַצֵּבָה నిలబెట్టిన రాతి గుర్తు లేదా స్తంభాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: తీసుకుని
  rationale: לקח అనే క్రియ యొక్క సాధారణ కథనార్థం ‘తీసుకోవడం.’ తరువాతి క్రియతో సహజమైన తెలుగు వాక్యప్రవాహం కోసం ‘తీసుకుని’ అని అనువదించాం.
- source_word: יַעֲקֹב
  choice: యాకోబు
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: אָבֶן
  choice: ఒక రాయిని
  rationale: ఏకవచన నామవాచకాన్ని తెలుగులో సహజంగా అనిర్దిష్టంగా సూచించడానికి ‘ఒక’ చేర్చాం.
- source_word: וַיְרִימֶהָ
  choice: దాన్ని ... నిలబెట్టాడు
  rationale: స్త్రీలింగ ఏకవచన ప్రత్యయం ముందున్న రాయిని సూచిస్తుంది. ఈ సందర్భంలో రాయిని పైకెత్తడం మాత్రమే కాక దానిని నిటారుగా స్థాపించడం భావం కాబట్టి ‘నిలబెట్టాడు’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: מַצֵּבָה
  choice: స్తంభంగా
  rationale: ఈ పదం నిలబెట్టిన రాతి గుర్తు లేదా స్తంభాన్ని సూచిస్తుంది. సందర్భం చెప్పనంత ఆరాధనాపరమైన లేదా స్మారకపరమైన ఉద్దేశాన్ని ప్రధాన పాఠ్యంలో చేర్చకుండా ‘స్తంభంగా’ మూలార్థాన్ని కాపాడుతుంది.
theological_decisions:
- issue: מַצֵּבָה అనే పదానికి స్మారక లేదా ఆరాధనాపరమైన అనుబంధాలు ఉండగల సందర్భంలో దాని అనువాదం
  choice: స్తంభంగా
  alternative: నిలువురాయిగా; జ్ఞాపకార్థపు రాయిగా
  rationale: ఈ వచనం రాయిని నిలబెట్టిన భౌతిక చర్యనే స్పష్టంగా చెబుతుంది; దాని ప్రత్యేక మతపరమైన లేదా స్మారక ఉద్దేశాన్ని స్వయంగా నిర్వచించదు. కాబట్టి ‘స్తంభంగా’ అనేది భావాన్ని అనవసరంగా నిర్ధారించకుండా అస్పష్టతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. ‘దాన్ని’ అనే సర్వనామం రాయిని స్పష్టంగా సూచిస్తుంది; ‘స్తంభంగా నిలబెట్టాడు’ మూలంలోని క్రియతో కూడిన విధేయ నామవాచక నిర్మాణాన్ని సహజ తెలుగులో ప్రతిబింబిస్తుంది.
