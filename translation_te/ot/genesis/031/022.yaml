  text: וַ/יֻּגַּ֥ד לְ/לָבָ֖ן בַּ/יּ֣וֹם הַ/שְּׁלִישִׁ֑י כִּ֥י בָרַ֖ח יַעֲקֹֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/022.yaml
  text: On the third day[a], Laban was told that Jacob had fled.
translation:
  language: te
  text: మూడో రోజున, యాకోబు పారిపోయాడని లాబానుకు కబురు అందింది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֻּגַּד
  choice: కబురు అందింది
  rationale: నגד్ హొఫాల్ రూపం సమాచారాన్ని లాబానుకు తెలియజేయబడినట్లు సూచిస్తుంది. తెలుగులో ‘కబురు అందింది’ సహజంగా ఉండి, తెలియజేసిన వ్యక్తిని చేర్చకుండా మూలంలోని కర్మణి భావాన్ని నిలుపుతుంది.
- source_word: לְלָבָן
  choice: లాబానుకు
  rationale: לְ ఇక్కడ సమాచారం అందుకున్న పరోక్ష కర్మను సూచిస్తుంది; అందువల్ల దత్తివిభక్తి ‘లాబానుకు’ సరైనది.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: మూడో రోజున
  rationale: హీబ్రూ వచనం ‘ఆ తరువాత’ అని స్పష్టంగా చేర్చదు. ‘మూడో రోజున’ కాలసూచనను సంక్షిప్తంగా, సహజంగా అందిస్తుంది.
- source_word: כִּי
  choice: అని
  rationale: ఇక్కడ כִּי నివేదించబడిన సమాచారం యొక్క విషయాన్ని పరిచయం చేస్తుంది; తెలుగు పరోక్ష వాక్యంలో ‘అని’ సహజమైన సమానార్థకం.
- source_word: בָרַח
  choice: పారిపోయాడు
  rationale: ברח అంటే పారిపోవడం. తెలుగు పరోక్ష వాక్య నిర్మాణంలో ‘పారిపోయాడని’ ఆ చర్య నివేదికకు ముందే జరిగిందనే క్రమాన్ని సహజంగా తెలియజేస్తుంది; ప్రత్యేక పూర్వభూతకాల రూపం అవసరం లేదు.
- source_word: יַעֲקֹב
  choice: యాకోబు
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని తెలియజేసిన వ్యక్తి అనిర్దిష్టతను నిలుపుతూ ఎటువంటి అదనపు కాలవివరాన్నీ చేర్చలేదు.
