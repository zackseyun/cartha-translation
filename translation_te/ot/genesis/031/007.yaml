source:
  edition: WLC
  text: וַ/אֲבִי/כֶן֙ הֵ֣תֶל בִּ֔/י וְ/הֶחֱלִ֥ף אֶת מַשְׂכֻּרְתִּ֖/י עֲשֶׂ֣רֶת מֹנִ֑ים וְ/לֹֽא נְתָנ֣/וֹ אֱלֹהִ֔ים לְ/הָרַ֖ע עִמָּדִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/007.yaml
  text: Yet your father has deceived me and changed my wages ten times[c][b][a], but God did not allow him to harm me.
translation:
  language: te
  text: మీ తండ్రి నన్ను మోసం చేసి[a], నా జీతాన్ని పదిసార్లు[b] మార్చాడు. కానీ దేవుడు అతనిని నాకు హాని చేయనివ్వలేదు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నాతో ఎగతాళిగా వ్యవహరించి’ లేదా ‘నన్ను మభ్యపెట్టి.’ హీబ్రూ క్రియ మోసపూరితమైన లేదా ఎగతాళితో కూడిన ప్రవర్తనను సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో ‘పదిసార్లు.’ ఇది పదేపదే మార్చాడనే నుడికారం కావచ్చు; ఖచ్చితంగా పది సార్లనే ఉద్దేశించి ఉండనవసరం లేదు.
    reason: cultural_note
  - marker: c
    text: అక్షరార్థంగా, ‘నాకు హాని చేయడానికి దేవుడు అతనికి ఇవ్వలేదు’; అంటే, దేవుడు అతనికి అనుమతి లేదా అవకాశం ఇవ్వలేదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵתֶל
  choice: మోసం చేసి
  rationale: హిఫీల్ రూపం మోసపూరితంగా లేదా ఎగతాళిగా వ్యవహరించడాన్ని సూచించగలదు. జీతాన్ని పదేపదే మార్చిన సందర్భంలో ‘మోసం చేసి’ అనేది ప్రధాన భావాన్ని సహజంగా తెలియజేస్తుంది; ఇతర భావ ఛాయను పాదటిప్పణిలో ఉంచాం.
- source_word: וְהֶחֱלִף
  choice: మార్చాడు
  rationale: అంగీకరించిన ప్రతిఫలాన్ని పదేపదే మార్చడాన్ని సూచించే సహజమైన ఆధునిక తెలుగు పదం.
- source_word: מַשְׂכֻּרְתִּי
  choice: నా జీతాన్ని
  rationale: పనికి చెల్లించాల్సిన వేతనాన్ని స్పష్టంగా, సాధారణ పాఠకులకు అర్థమయ్యేలా తెలియజేస్తుంది.
- source_word: עֲשֶׂרֶת מֹנִים
  choice: పదిసార్లు
  rationale: హీబ్రూ వ్యక్తీకరణను నేరుగా నిలుపుతుంది; ఇది ఖచ్చిత సంఖ్యకన్నా పదేపదే జరిగిన చర్యను సూచించే అవకాశం పాదటిప్పణిలో తెలిపాం.
- source_word: וְלֹא נְתָנוֹ אֱלֹהִים
  choice: దేవుడు అనుమతించలేదు
  rationale: అక్షరార్థంగా ‘దేవుడు అతనికి ఇవ్వలేదు’; సందర్భంలో అవకాశం లేదా అనుమతి ఇవ్వలేదనే హీబ్రూ నుడికార భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: לְהָרַע עִמָּדִי
  choice: నాకు హాని చేయడానికి
  rationale: నా పట్ల చెడుగా ప్రవర్తించడం లేదా నాకు హాని చేయడం అనే సందర్భోచిత భావాన్ని సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: אֱלֹהִים
  choice: దేవుడు
  rationale: యాకోబు మాటల్లో నిజ దేవుణ్ణి సూచిస్తున్నందున సాధారణ తెలుగు రూపం వాడబడింది.
theological_decisions:
- issue: ‘దేవుడు అతనికి ఇవ్వలేదు’ అనే నుడికారంలో వ్యక్తమయ్యే దైవిక నిరోధం
  choice: అతడు యాకోబుకు హాని చేయడానికి దేవుడు అనుమతించలేదు
  alternative: దేవుడు యాకోబును అతని చేతికి అప్పగించలేదు / హాని చేయడంలో అతడు సఫలం కావనివ్వలేదు
  rationale: దేవుడు లాబాను చర్యను నిరోధించాడనే వాక్యబలాన్ని కాపాడుతుంది; అతని ఉద్దేశం, ప్రయత్నం లేదా సాధన విధానం గురించి మూలపాఠం చెప్పనిదాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం. ‘మీ తండ్రి’ ద్వారా బహువచన శ్రోతలను ఉద్దేశించిన రూపం నిలుపబడింది. విరుద్ధతను స్పష్టపరచడానికి రెండు వాక్యాలుగా విభజించి, రెండవ భాగంలో ‘అయినా’ వాడబడింది; మూలంలోని భావసంబంధం కాపాడబడింది.
