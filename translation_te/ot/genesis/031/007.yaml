  verdict: revise
  source_fidelity: The draft accurately renders Jacob’s charge that Laban treated him deceptively, repeatedly changed his wages, and was restrained by God from harming him. ‘మోసం చేసి’ is a sound contextual rendering of הֵתֶל, while the footnote appropriately preserves the possible nuance of mocking treatment.
