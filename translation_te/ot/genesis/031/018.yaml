id: GEN.31.18
reference: Genesis 31:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּנְהַ֣ג אֶת כָּל מִקְנֵ֗/הוּ וְ/אֶת כָּל רְכֻשׁ/וֹ֙ אֲשֶׁ֣ר רָכָ֔שׁ מִקְנֵה֙ קִנְיָנ֔/וֹ אֲשֶׁ֥ר רָכַ֖שׁ בְּ/פַדַּ֣ן אֲרָ֑ם לָ/ב֛וֹא אֶל יִצְחָ֥ק אָבִ֖י/ו אַ֥רְצָ/ה כְּנָֽעַן־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/018.yaml
  text: And he drove all his livestock and all his possessions that he had acquired—the livestock he had acquired in Paddan-aram—to go to Isaac his father in the land of Canaan[a].
translation:
  language: te
  text: అతడు తన పశువులన్నిటినీ తోలుతూ, తాను సంపాదించుకున్న ఆస్తి అంతటినీ—పద్దన్-అరాములో తాను సంపాదించుకున్న పశుసంపదను—వెంట తీసుకొని, తన తండ్రి ఇస్సాకు దగ్గరకు, కనాను దేశానికి వెళ్లడానికి బయలుదేరాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּנְהַג
  choice: తోలుకొని
  rationale: נהג ఇక్కడ పశువులను ముందుకు నడిపించడాన్ని సూచిస్తుంది; మ pastoral సందర్భంలో ‘తోలుకొని’ సహజంగా, నిర్దిష్టంగా ఉంది.
- source_word: מִקְנֵהוּ
  choice: తన పశువులన్నిటినీ
  rationale: מִקְנֶה అనేది గొర్రెలు, మేకలు, పశువులు మొదలైన పెంపుడు జంతువులను సమష్టిగా సూచిస్తుంది; ‘పశువులు’ ఆధునిక తెలుగులో విస్తృతంగా అర్థమయ్యే పదం.
- source_word: רְכֻשׁוֹ
  choice: తాను సంపాదించిన ఆస్తి అంతటినీ
  rationale: רְכוּשׁ సంపాదించుకున్న వస్తుసంపద లేదా ఆస్తిని సూచిస్తుంది; ‘ఆస్తి’ దాని విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: רָכָשׁ
  choice: సంపాదించిన
  rationale: ఆస్తిని లేదా పశుసంపదను పొందడం అనే ఆర్థిక భావాన్ని ఇస్తుంది; మూలంలోని పునరుక్తిని తెలుగులో కూడా నిలిపింది.
- source_word: מִקְנֵה קִנְיָנוֹ
  choice: తన పశుసంపదను
  rationale: హీబ్రూ పదబంధంలోని సంపాదిత పశుసంపద భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తూ, తదనంతర ‘సంపాదించిన’తో ఆ నొక్కిచెప్పడాన్ని నిలుపుతుంది.
- source_word: בְּפַדַּן אֲרָם
  choice: పద్దన్-అరాములో
  rationale: స్థలనామాన్ని అనువదించకుండా తెలుగు లిపిలో ధ్వన్యంతరీకరించింది.
- source_word: לָבוֹא
  choice: వెళ్లడానికి బయలుదేరాడు
  rationale: ఈ క్రియారూపం గమ్యాన్ని ఉద్దేశించిన ప్రయాణాన్ని సూచిస్తుంది; వాక్యంలోని కదలికను సహజ తెలుగులో స్పష్టంగా చూపిస్తుంది.
- source_word: אַרְצָה כְּנָעַן
  choice: కనాను దేశంలో ఉన్న
  rationale: ప్రధాన పాఠ్యంలో ఇస్సాకు ఉన్న ప్రదేశంగా కనానును సహజంగా తెలిపింది; హీబ్రూలోని దిశార్థక రూపాన్ని పాదసూచికలో స్పష్టం చేసింది.
