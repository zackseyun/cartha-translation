translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన శైలి. మూలంలోని ‘సంపాదించిన’ అనే పునరుక్తిని పూర్తిగా తొలగించకుండా, సహజ వాక్యనిర్మాణంలో నిలిపింది.
