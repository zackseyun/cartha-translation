translation:
  language: te
  text: నేను మీ తండ్రికి నా పూర్తి శక్తితో సేవ చేశానని మీకు స్వయంగా తెలుసు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మీ తండ్రి కోసం నా పూర్తి శక్తితో పనిచేశానని.’ హీబ్రూ క్రియకు ‘సేవ చేయడం,’ ‘పనిచేయడం’ అనే రెండు అర్థాలూ రావచ్చు; లాబాను దగ్గర యాకోబు గడిపిన శ్రమ సంవత్సరాల సందర్భానికి రెండూ సరిపోతాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתֵּנָה
  choice: మీకు స్వయంగా
  rationale: స్త్రీలింగ బహువచన స్వతంత్ర సర్వనామంలోని ఉద్ఘాటనను సహజమైన ఆధునిక తెలుగులో ‘స్వయంగా’ తెలియజేస్తుంది. వాక్యారంభంలోని וְ సందర్భంలో తెలుగులో విడిగా అనువదించకపోయినా భావసంబంధం నిలుస్తుంది.
- source_word: יְדַעְתֶּן
  choice: తెలుసు
  rationale: Qal perfect 2fp ఇక్కడ గతంలో పొందిన జ్ఞానం వల్ల కొనసాగుతున్న ప్రస్తుత అవగాహనను సూచిస్తుంది; తెలుగులో ‘తెలుసు’ సహజం.
- source_word: כִּי
  choice: అని
  rationale: వారు తెలిసికొన్న విషయాన్ని పరిచయం చేస్తుంది; తెలుగు పరోక్ష వాక్య నిర్మాణంలో ‘అని’ సరిపోతుంది.
- source_word: בְּכָל־כֹּחִי
  choice: నా శక్తి అంతటితో
  rationale: యాకోబు తన పూర్తి సామర్థ్యంతో శ్రమించాడనే భావాన్ని నేరుగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: עָבַדְתִּי
  choice: సేవ చేశాను
  rationale: עבד అనే క్రియలోని ‘సేవచేయు’ భావాన్ని నిలుపుతుంది; ఈ పని సందర్భంలో ‘పనిచేశాను’ అనే అర్థం కూడా సాధ్యమే కాబట్టి దాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: אֶת־אֲבִיכֶן
  choice: మీ తండ్రికి
  rationale: తెలుగులో ‘సేవ చేయడం’ అనే క్రియతో వ్యక్తిని సాధారణంగా చతుర్థీ విభక్తిలో చెప్పడం సహజం; స్త్రీలింగ బహువచన స్వామ్య ప్రత్యయ భావం ‘మీ’లో వ్యక్తమవుతుంది.
