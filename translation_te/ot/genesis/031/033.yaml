  source_fidelity: హీబ్రూ కథనంలోని వరుస శోధన, గుడారాల్లోకి ప్రవేశించడం, కనుగొనకపోవడం, ఆపై లేయా గుడారం నుంచి రాహేలు గుడారంలోకి వెళ్లడం అన్నీ విశ్వసనీయంగా ప్రతిఫలించాయి. ‘వాటిని’ అనే కర్మ సందర్భం నుంచి సహజంగా పూరించబడింది; పాదసూచిక దానిని స్పష్టంగా, మూలపాఠానికి న్యాయంగా వివరిస్తుంది.
