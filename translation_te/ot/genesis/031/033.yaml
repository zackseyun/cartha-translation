  terminology: ‘గుడారం,’ వ్యక్తినామాలు లాబాను, యాకోబు, లేయా, రాహేలు, అలాగే ‘గృహదేవతలు’ సందర్భానుగుణంగా ఉన్నాయి. ‘దాసీలు’ అనేది אָמָה యొక్క సేవక/బానిస సామాజిక స్థితిని ఈ సందర్భంలో తగినంతగా సూచించే సహజ పదం.
