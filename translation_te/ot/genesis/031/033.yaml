translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన కథన శైలి వాడబడింది. గుడారాలను ఒక్కొక్కటిగా వెదికిన క్రమాన్ని చూపేందుకు మూలంలోని పునరుక్త నిర్మాణాన్ని సాధ్యమైనంతవరకు నిలిపాం; లేయా గుడారం నుంచి బయలుదేరినట్టు చెప్పే మూలపాఠంలోని ఆశ్చర్యకరమైన క్రమాన్ని సవరించలేదు.
