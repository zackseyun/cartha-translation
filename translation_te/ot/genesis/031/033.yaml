source:
  edition: WLC
  text: וַ/יָּבֹ֨א לָבָ֜ן בְּ/אֹ֥הֶל יַעֲקֹ֣ב וּ/בְ/אֹ֣הֶל לֵאָ֗ה וּ/בְ/אֹ֛הֶל שְׁתֵּ֥י הָ/אֲמָהֹ֖ת וְ/לֹ֣א מָצָ֑א וַ/יֵּצֵא֙ מֵ/אֹ֣הֶל לֵאָ֔ה וַ/יָּבֹ֖א בְּ/אֹ֥הֶל רָחֵֽל׀׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/033.yaml
  text: So Laban went into Jacob’s tent[a], and into Leah’s tent, and into the tent of the two female servants, but he did not find them. Then he came out of Leah’s tent and went into Rachel’s tent.
translation:
  language: te
  text: లాబాను యాకోబు గుడారంలోకి, లేయా గుడారంలోకి, ఆ ఇద్దరు దాసీల గుడారంలోకి వెళ్లాడు. కానీ వాటిని కనుగొనలేదు[a]. తరువాత అతడు లేయా గుడారం నుంచి బయటికి వచ్చి రాహేలు గుడారంలోకి వెళ్లాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ‘కనుగొనలేదు’ అని మాత్రమే ఉంది; కర్మను ఈ వచనంలో పేర్కొనలేదు. సందర్భం ప్రకారం లాబాను వెతుకుతున్న గృహదేవతలను ఇది సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא ... בְּאֹהֶל
  choice: గుడారంలోకి వెళ్లాడు
  rationale: בוא అనే క్రియ בְּ ఉపసర్గతో ఇక్కడ ఒక స్థలంలోకి ప్రవేశించడాన్ని సూచిస్తుంది. కథన తెలుగులో ‘గుడారంలోకి వెళ్లాడు’ సహజంగా ఉండి దిశాభావాన్ని నిలుపుతుంది.
- source_word: אֹהֶל
  choice: గుడారం
  rationale: మూలపదానికి సాధారణ అర్థం ‘గుడారం’. పితరుల కాలపు ఈ సందర్భంలో దానిని ‘నివాసం’ అని సాధారణీకరించకుండా నిర్దిష్టమైన వస్తువునే పేర్కొనడం సముచితం.
- source_word: שְׁתֵּי הָאֲמָהֹת
  choice: ఆ ఇద్దరు దాసీలు
  rationale: אָמָה ఇంటి పరిధిలో సేవచేసే దాసిని లేదా బానిస స్త్రీని సూచిస్తుంది. ‘దాసీలు’ ఆధునిక తెలుగులో సంక్షిప్తంగా, స్పష్టంగా ఉండి వారి అధీన సామాజిక స్థితిని పూర్తిగా మరుగుపరచదు.
- source_word: וְלֹא מָצָא
  choice: కానీ వాటిని కనుగొనలేదు
  rationale: హీబ్రూలో కర్మ చెప్పబడలేదు; ముందటి సందర్భం ప్రకారం లాబాను వెతుకుతున్న గృహదేవతలే ఉద్దేశం. సహజమైన తెలుగుకోసం ‘వాటిని’ చేర్చినా, ఆ వివరణను పాదసూచికలో స్పష్టం చేశాం. సందర్భంలోని వ్యతిరేక ఫలితాన్ని ‘కానీ’ తెలియజేస్తుంది.
- source_word: וַיֵּצֵא מֵאֹהֶל לֵאָה
  choice: తరువాత అతడు లేయా గుడారం నుంచి బయటికి వచ్చి
  rationale: יצא బయటికి రావడాన్ని సూచిస్తుంది. ‘తరువాత’ వరుసగా సాగే హీబ్రూ కథన క్రమాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: וַיָּבֹא בְּאֹהֶל רָחֵל
  choice: రాహేలు గుడారంలోకి వెళ్లాడు
  rationale: ముందు వచ్చిన అదే చలన క్రియను ఒకే విధంగా అనువదించడం గుడారాల మధ్య సాగిన వెదకులాట క్రమాన్ని నిలుపుతుంది.
