  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר שָׂא נָ֨א עֵינֶ֤י/ךָ וּ/רְאֵה֙ כָּל הָֽ/עַתֻּדִים֙ הָ/עֹלִ֣ים עַל הַ/צֹּ֔אן עֲקֻדִּ֥ים נְקֻדִּ֖ים וּ/בְרֻדִּ֑ים כִּ֣י רָאִ֔יתִי אֵ֛ת כָּל אֲשֶׁ֥ר לָבָ֖ן עֹ֥שֶׂה לָּֽ/ךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/012.yaml
  text: 'And he said[a], “Please lift up your eyes and see: all the male goats that are mating with the flock are striped, speckled, and spotted[b], for I have seen all that Laban is doing to you.”'
translation:
  language: te
  text: 'అప్పుడు ఆయన ఇలా అన్నాడు: “దయచేసి నీ కళ్లను పైకెత్తి చూడు. మందలోని జంతువులతో జతకడుతున్న[a] మగ మేకలన్నీ చారలుగలవి, చుక్కలుగలవి, మచ్చలుగలవి[b]. ఎందుకంటే లాబాను నీకు చేస్తున్నదంతా నేను చూశాను.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మందపైకి ఎక్కుతున్న.” ఇది జంతువుల సంతానోత్పత్తిని సూచించే హీబ్రూ నుడికారం.
    reason: lexical_alternative
  - marker: b
    text: “చారలుగలవి” అని అనువదించిన హీబ్రూ పదాన్ని “వలయపు చారలుగలవి” లేదా “పట్టీలుగలవి” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂא נָא עֵינֶיךָ וּרְאֵה
  choice: దయచేసి నీ కళ్లు పైకెత్తి చూడు
  rationale: ‘కళ్లు పైకెత్తడం’ అనే హీబ్రూ దృశ్యజ్ఞాన నుడికారాన్ని నిలుపుతూ, נָא లోని మర్యాదపూర్వక అభ్యర్థనను ‘దయచేసి’తో వ్యక్తం చేస్తుంది.
- source_word: הָעַתֻּדִים
  choice: మగ మేకలు
  rationale: עתודים ఇక్కడ మేకపోతులను సూచిస్తుంది; ఆధునిక సాధారణ పాఠకులకు ‘మగ మేకలు’ స్పష్టంగా ఉంటుంది.
- source_word: הָעֹלִים עַל הַצֹּאן
  choice: మందతో జతకడుతున్న
  rationale: జంతువుల సంతానోత్పత్తి సందర్భంలో עלה על అనేది ఎక్కి సంభోగించడాన్ని సూచించే నుడికారం; ‘జతకడుతున్న’ సహజంగా, మర్యాదగా భావాన్ని తెలియజేస్తుంది.
- source_word: עֲקֻדִּים נְקֻדִּים וּבְרֻדִּים
  choice: చారలుగలవి, చుక్కలుగలవి, మచ్చలుగలవి
  rationale: మూడు వేర్వేరు రకాల శరీర గుర్తుల మధ్య ఉన్న మూలభాషా భేదాన్ని సాధ్యమైనంత స్పష్టంగా నిలుపుతుంది.
- source_word: כִּי רָאִיתִי
  choice: ఎందుకంటే … నేను చూశాను
  rationale: כִּי యొక్క కారణార్థాన్ని, רָאִיתִי యొక్క సంపూర్ణ క్రియారూపాన్ని నేరుగా ప్రతిబింబిస్తుంది.
- source_word: כָּל אֲשֶׁר לָבָן עֹשֶׂה לָּךְ
  choice: లాబాను నీకు చేస్తున్నదంతా
  rationale: עֹשֶׂה అనే కృదంతం కొనసాగుతున్న చర్యను సూచిస్తుంది; సందర్భంలో לָּךְ ప్రభావిత వ్యక్తిని సూచించే ‘నీకు’గా అనువదించబడింది.
