id: GEN.31.54
reference: Genesis 31:54
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּזְבַּ֨ח יַעֲקֹ֥ב זֶ֨בַח֙ בָּ/הָ֔ר וַ/יִּקְרָ֥א לְ/אֶחָ֖י/ו לֶ/אֱכָל לָ֑חֶם וַ/יֹּ֣אכְלוּ לֶ֔חֶם וַ/יָּלִ֖ינוּ בָּ/הָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/054.yaml
  text: Then Jacob offered a sacrifice on the mountain and called his brothers to eat bread[a]. They ate bread and spent the night on the mountain.
translation:
  language: te
  text: అప్పుడు యాకోబు ఆ పర్వతం మీద ఒక బలి అర్పించి, భోజనం చేయడానికి తన సోదరులను[a] పిలిచాడు. వారు భోజనం చేసి, ఆ పర్వతం మీద ఆ రాత్రి గడిపారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “తన బంధువులను.” ఇక్కడ “సోదరులు” అనే హీబ్రూ పదం సందర్భానుసారంగా విస్తృత బంధువులను లేదా సహచరులను కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְבַּח ... זֶבַח
  choice: ఒక బలి అర్పించి
  rationale: హీబ్రూలో ఒకే మూలానికి చెందిన క్రియ, నామవాచకం కలిసి బలియర్పణను బలంగా వ్యక్తం చేస్తున్నాయి. తెలుగులో ‘బలి అర్పించాడు’ సహజంగా ఉండి ఆ ఆరాధనాపరమైన భావాన్ని కాపాడుతుంది.
- source_word: בָּהָר
  choice: ఆ పర్వతం మీద
  rationale: నిర్దిష్ట రూపంలోని הַרకు సందర్భానుగుణంగా ‘ఆ పర్వతం’ సరిపోతుంది; ఇదే స్థలం వాక్యాంతంలోనూ పునరావృతమవుతుంది.
- source_word: וַיִּקְרָא
  choice: పిలిచాడు
  rationale: קרא అనే క్రియకు నేరమైన అర్థం ‘పిలిచాడు’; సందర్భంలో ఆహ్వాన భావం ఉన్నప్పటికీ మూలపదానికి దగ్గరగా ఉండేందుకు దీనినే ఉంచాం.
- source_word: לְאֶחָיו
  choice: తన సోదరులను[a]
  rationale: אָח పదం అక్షరార్థంగా ‘సోదరుడు’; సందర్భంలో విస్తృత బంధువులు లేదా సహచరులనూ సూచించవచ్చు. ప్రధాన పాఠంలో కుటుంబసంబంధ పదాన్ని నిలిపి, విస్తృత అర్థాన్ని పాదటిప్పణిలో ఇచ్చాం.
- source_word: לֶאֱכָל לָחֶם / וַיֹּאכְלוּ לֶחֶם
  choice: భోజనం చేయడానికి / వారు భోజనం చేసి
  rationale: ‘రొట్టె తినడం’ అనే హీబ్రూ నుడికారం సాధారణంగా భోజనం చేయడాన్ని సూచిస్తుంది. తెలుగులో ‘రొట్టె తినడానికి’ అని రెండుసార్లు చెప్పడం అసహజంగా ఉండవచ్చు; ‘భోజనం చేయడం’ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וַיָּלִינוּ
  choice: ఆ రాత్రి గడిపారు
  rationale: לון అంటే రాత్రిపూట బసచేయడం లేదా రాత్రి గడపడం. ఆధునిక తెలుగులో ‘ఆ రాత్రి గడిపారు’ సహజంగా, స్పష్టంగా ఉంటుంది.
theological_decisions:
- issue: ఒడంబడిక సందర్భంలో ‘అతని సోదరులు’ అనే పదం పరిధి
  choice: ప్రధాన పాఠంలో ‘తన సోదరులను’
  alternative: తన బంధువులను; తన బంధుజనులను
  rationale: హీబ్రూ పదం అక్షరార్థ కుటుంబసంబంధాన్ని మాత్రమే కాక విస్తృత పురుష బంధువులు లేదా సహచరులను కూడా సూచించగలదు. మూలపాఠంలోని ఉద్దేశపూర్వక అస్పష్టతను నిలిపేందుకు ‘సోదరులు’ ఉంచి, ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన కథనశైలి. ‘రొట్టె తినడం’ అనే హీబ్రూ నుడికారాన్ని సహజమైన ‘భోజనం చేయడం’గా అనువదించాం; స్థలపునరావృతాన్ని మాత్రం నిలిపాం.
