source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר לָבָ֖ן לְ/יַעֲקֹ֑ב הִנֵּ֣ה הַ/גַּ֣ל הַ/זֶּ֗ה וְ/הִנֵּה֙ הַ/מַצֵּבָ֔ה אֲשֶׁ֥ר יָרִ֖יתִי בֵּינִ֥/י וּ/בֵינֶֽ/ךָ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/051.yaml
  text: Then Laban said to Jacob[a], “Look at this mound[b], and look at the pillar that I have set up between me and you.”
translation:
  language: te
  text: అప్పుడు లాబాను యాకోబుతో, “ఇదిగో ఈ రాళ్లకుప్ప[a]; ఇదిగో నాకూ నీకూ మధ్య నేను నిలబెట్టిన స్తంభం[b]” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఈ కుప్ప.” ఇక్కడి హీబ్రూ పదం లాబాను, యాకోబు మధ్య సాక్షిగా పేర్చిన రాళ్ల కుప్పను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా “నిలువురాయి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... అన్నాడు
  rationale: వావ్-కాన్సిక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది. ఆధునిక తెలుగులో ‘అప్పుడు’ సంఘటనల క్రమాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: הִנֵּה ... וְהִנֵּה
  choice: ఇదిగో ...; ఇదిగో
  rationale: దృష్టిని ఆకర్షించే హీబ్రూ అవ్యయాన్ని రెండుసార్లూ అనువదించి, మూలంలోని బలమైన సమాంతర నిర్మాణాన్ని నిలిపాం.
- source_word: הַגַּל הַזֶּה
  choice: ఈ రాళ్లకుప్ప
  rationale: గַּל అంటే కుప్ప లేదా గుట్ట; ఈ సందర్భంలో అది సాక్షిగా పేర్చిన రాళ్ల కుప్ప. ‘రాళ్లకుప్ప’ సాధారణ పాఠకునికి సందర్భాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: הַמַּצֵּבָה
  choice: స్తంభం
  rationale: מַצֵּבָה ఇక్కడ నిలబెట్టిన రాయిని సూచిస్తుంది. ‘స్తంభం’ సంక్షిప్తమైన, సహజమైన ప్రామాణిక తెలుగు పదం; ప్రత్యామ్నాయ భావాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: יָרִיתִי
  choice: నేను నిలబెట్టిన
  rationale: ఈ సందర్భంలో క్రియ స్తంభాన్ని ఏర్పాటు చేయడం లేదా నిలబెట్టడం అనే భావాన్నిస్తుంది. ‘నిలబెట్టిన’ రాతి స్తంభానికి సహజంగా సరిపోతుంది.
- source_word: בֵּינִי וּבֵינֶךָ
  choice: నాకూ నీకూ మధ్య
  rationale: మూలంలోని పరస్పర సరిహద్దు భావాన్ని సహజమైన ఆధునిక తెలుగు నిర్మాణంతో కాపాడుతుంది.
