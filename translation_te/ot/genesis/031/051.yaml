translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే కథన శైలిని వాడాం. పునరుక్తమైన הִנֵּהను ‘ఇదిగో’ అని రెండుసార్లు ఉంచి మూలంలోని ఉద్ఘాటనను నిలిపాం; పాదసూచిక గుర్తులు సంబంధిత పదాల వెంటనే ఉంచాం.
