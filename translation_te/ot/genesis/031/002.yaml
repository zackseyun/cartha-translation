  text: וַ/יַּ֥רְא יַעֲקֹ֖ב אֶת פְּנֵ֣י לָבָ֑ן וְ/הִנֵּ֥ה אֵינֶ֛/נּוּ עִמּ֖/וֹ כִּ/תְמ֥וֹל שִׁלְשֽׁוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/002.yaml
  text: And Jacob saw Laban’s face[a], and behold[b], it was not toward him as before.
translation:
  language: te
  text: యాకోబు లాబాను ముఖాన్ని చూశాడు. ఇదిగో, లాబాను తనపట్ల మునుపటిలా[a] లేడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “నిన్న, మొన్న ఉన్నట్లుగా”; అంటే, లాబాను వైఖరి యాకోబుపట్ల మునుపటిలా లేదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: చూశాడు
  rationale: ראה అనే సాధారణ కథన క్రియకు నేరమైన అర్థాన్ని నిలుపుతుంది; సందర్భానికి మించిన ‘గ్రహించాడు’ అనే భావాన్ని చేర్చదు.
- source_word: פְּנֵי לָבָן
  choice: లాబాను ముఖాన్ని
  rationale: హీబ్రూలోని స్పష్టమైన ‘ముఖం’ అనే రూపకచిత్రాన్ని నిలుపుతూ, అతని వైఖరి ముఖంలో కనిపించిందనే భావాన్ని పాఠకుడు సందర్భం నుంచి గ్రహించనిస్తుంది.
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: తరువాత చెప్పబోయే విషయంపై దృష్టి నిలిపే హీబ్రూ కథన సూచిక యొక్క సజీవతను సహజమైన తెలుగు పదంతో నిలుపుతుంది.
- source_word: אֵינֶנּוּ עִמּוֹ
  choice: లాబాను తనపట్ల ... లేడు
  rationale: అక్షరార్థంగా ‘అతడు అతనితో లేడు.’ ఇక్కడ అది లాబాను వైఖరి యాకోబుపట్ల మారిందని సూచిస్తుంది. పేరును మళ్లీ ఉపయోగించడం ద్వారా తెలుగు సర్వనామాల సందిగ్ధతను నివారించి, ‘తనపట్ల’తో సంబంధ దిశను స్పష్టం చేసింది.
- source_word: כִּתְמוֹל שִׁלְשׁוֹם
  choice: మునుపటిలా
  rationale: ‘నిన్న, మొన్న ఉన్నట్లుగా’ అనే హీబ్రూ కాలసూచక నుడికారానికి సహజమైన ఆధునిక తెలుగు సమానార్థకం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథనశైలి. ‘ముఖం’ అనే హీబ్రూ రూపకచిత్రం మరియు ‘ఇదిగో’ అనే దృష్టి సూచిక నిలుపబడ్డాయి; సంబంధ నుడికారాన్ని సహజంగా అర్థమయ్యేలా ‘తనపట్ల’ అని అనువదించాం.
