  terminology: ‘ఇంటి దేవతా విగ్రహాలు’ is a clear contextual rendering of תְּרָפִים, while footnote a responsibly retains ‘తెరాఫీములు’ and ‘ఇంటి దేవతలు’ as alternatives. ‘ఒంటె జీను మెత్త’ appropriately preserves the likely padded-saddle sense of כַּר, with alternatives noted in footnote b.
