  source_fidelity: 'The Telugu accurately represents the Hebrew narrative: Rachel’s taking, placing, and sitting on the teraphim; the camel’s padded saddle equipment; and Laban’s tactile search of the entire tent. The implicit object of ‘did not find’ is supplied naturally as ‘అవి’ without altering the sense.'
