id: GEN.31.34
reference: Genesis 31:34
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/רָחֵ֞ל לָקְחָ֣ה אֶת הַ/תְּרָפִ֗ים וַ/תְּשִׂמֵ֛/ם בְּ/כַ֥ר הַ/גָּמָ֖ל וַ/תֵּ֣שֶׁב עֲלֵי/הֶ֑ם וַ/יְמַשֵּׁ֥שׁ לָבָ֛ן אֶת כָּל הָ/אֹ֖הֶל וְ/לֹ֥א מָצָֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/034.yaml
  text: Rachel had taken the household idols[a], put them in the camel’s saddle cushion, and sat on them. Laban felt through the whole tent[c][b], but did not find them.
translation:
  language: te
  text: రాహేలు ఆ ఇంటి దేవతా విగ్రహాలను[a] తీసుకొని, వాటిని ఒంటె జీను మెత్తలో[b] పెట్టి, వాటి మీద కూర్చుంది. లాబాను గుడారమంతా చేతులతో తడవి వెదికాడు, కాని అవి అతనికి దొరకలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘తెరాఫీములను,’ లేదా ‘ఇంటి దేవతలను.’ హెబ్రీ పదం ఇంటి ఆరాధనకు సంబంధించిన వస్తువులను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘ఒంటె జీనులో,’ లేదా ‘ఒంటె సామాను మోసే జీను అమరికలో.’ హెబ్రీ పదం బహుశా ఒంటె జీనులోని మెత్తగా అమర్చిన భాగాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַתְּרָפִים
  choice: ఆ ఇంటి దేవతా విగ్రహాలను
  rationale: తెరాఫీము అనే హెబ్రీ పదం ఇంటికి సంబంధించిన ఆరాధనా వస్తువులను లేదా దేవతా ప్రతిమలను సూచిస్తుంది. ‘ఇంటి దేవతా విగ్రహాలు’ అనేది సాధారణ తెలుగు పాఠకునికి వస్తువుల స్వభావాన్ని స్పష్టంగా తెలియజేస్తుంది; మూలపదాన్ని లిప్యంతరీకరించి అస్పష్టంగా ఉంచదు.
- source_word: בְּכַר הַגָּמָל
  choice: ఒంటె జీను మెత్తలో
  rationale: כַּר సాధారణంగా మెత్త లేదా మెత్తగా అమర్చిన భాగాన్ని సూచిస్తుంది. ఒంటె సందర్భంలో ఇది జీనుకు సంబంధించిన మెత్తని భాగమని సహజంగా అర్థమవుతుంది.
- source_word: וַתֵּשֶׁב עֲלֵיהֶם
  choice: వాటి మీద కూర్చుంది
  rationale: క్రియల కథన క్రమాన్ని సహజమైన భూతకాలంతో వ్యక్తం చేస్తూ, విగ్రహాలను దాచడానికి రాహేలు చేసిన శారీరక చర్యను నిలుపుతుంది.
- source_word: וַיְמַשֵּׁשׁ
  choice: చేతులతో తడవి వెదికాడు
  rationale: מששׁ కేవలం సాధారణంగా వెదకడమే కాకుండా స్పర్శించి, తడవి వెదకడాన్ని సూచిస్తుంది. ఈ రెండుపదాల ప్రయోగం ఆ స్పర్శాత్మక భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: כָּל הָאֹהֶל
  choice: గుడారమంతా
  rationale: నిర్దిష్ట నామవాచకంతో కూడిన כָּל భావాన్ని సహజమైన, సంక్షిప్త ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: וְלֹא מָצָא
  choice: కాని అవి అతనికి దొరకలేదు
  rationale: హెబ్రీలో కర్మ సూచితం మాత్రమే; తెలుగులో సందర్భానుసారంగా ‘అవి’ అని చేర్చడం స్పష్టతనిస్తుంది. ‘కాని’ వెదికినా ఫలితం లేకపోయిన వ్యతిరేక భావాన్ని తెలియజేస్తుంది.
- source_word: וְרָחֵל
  choice: రాహేలు
  rationale: ప్రారంభ వావ్ కథన అనుసంధానాన్ని సూచిస్తుంది; తెలుగులో ప్రత్యేకంగా ‘ఇప్పుడు’ లేదా ‘మరి’ చేర్చకుండా పేరు నుంచే వాక్యాన్ని ప్రారంభించడం సహజంగా ఉంటుంది.
theological_decisions:
- issue: תְּרָפִים యొక్క స్వరూపం
  choice: ఇంటి దేవతా విగ్రహాలు
  alternative: తెరాఫీము / ఇంటి దేవతలు
  rationale: ఇవి ఇంటి ఆరాధనకు సంబంధించిన వస్తువులనే కనీస భావాన్ని వ్యక్తం చేస్తూ, వాటి నిర్దిష్ట మతపరమైన ఉపయోగం లేదా రూపం గురించి మూలంలో లేనంత ఖచ్చితత్వాన్ని విధించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన కథన శైలి. ‘చేతులతో తడవి వెదికాడు’ ద్వారా మూలంలోని స్పర్శాత్మక అన్వేషణ భావం నిలుపబడింది. నేపథ్యాన్ని తెలిపే మొదటి వాక్యంలో సహజ తెలుగు క్రియాక్రమం వాడబడింది.
