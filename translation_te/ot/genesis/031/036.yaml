  text: וַ/יִּ֥חַר לְ/יַעֲקֹ֖ב וַ/יָּ֣רֶב בְּ/לָבָ֑ן וַ/יַּ֤עַן יַעֲקֹב֙ וַ/יֹּ֣אמֶר לְ/לָבָ֔ן מַה פִּשְׁעִ/י֙ מַ֣ה חַטָּאתִ֔/י כִּ֥י דָלַ֖קְתָּ אַחֲרָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/036.yaml
  text: Then Jacob became angry and contended with Laban. Jacob answered and said to Laban[a], “What is my transgression? What is my sin, that you have pursued me?”
translation:
  language: te
  text: 'అప్పుడు యాకోబుకు కోపం వచ్చి లాబానుతో వాదించాడు. యాకోబు లాబానుకు జవాబుగా ఇలా అన్నాడు: “నా అపరాధం ఏమిటి? నా పాపం ఏమిటి, నువ్వు నన్ను వెంబడించడానికి?[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నువ్వు నన్ను తీవ్రంగా వెంబడించడానికి?” హీబ్రూ క్రియలో ‘మండడం’ అనే చిత్రణ ఉంది; దాని నుంచి తీవ్రంగా లేదా పట్టుదలగా వెంటపడడం అనే భావం వస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר לְיַעֲקֹב
  choice: యాకోబుకు కోపం వచ్చి
  rationale: חרה + ל అనే హీబ్రూ నుడికారం కోపం రగులుకోవడాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘కోపం వచ్చి’ సహజంగా ఉండి, కథనంలోని ఆరంభ భావాన్ని నిలుపుతుంది.
- source_word: וַיָּרֶב בְּלָבָן
  choice: లాబానుతో వాదించాడు
  rationale: ריב ఇక్కడ ప్రతివాదం చేయడం లేదా వివాదపడడం అనే భావం ఇస్తుంది. ‘వాదించాడు’ విరోధ స్వరాన్ని సహజంగా తెలియజేస్తుంది; శారీరక పోరాటాన్ని సూచించదు.
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: జవాబిస్తూ ఇలా అన్నాడు
  rationale: హీబ్రూలోని ‘జవాబిచ్చి అన్నాడు’ అనే జంట క్రియల భావాన్ని పునరుక్తి భారంగా లేకుండా సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: מַה פִּשְׁעִי
  choice: నా అపరాధం ఏమిటి?
  rationale: פֶּשַׁע ఉద్దేశపూర్వక అతిక్రమణ లేదా తప్పు అనే నైతిక-న్యాయ భావాన్ని కలిగి ఉంది. ‘అపరాధం’ ఆ భావాన్ని తెలుగులో స్పష్టంగా అందిస్తుంది.
- source_word: מַה חַטָּאתִי
  choice: నా పాపం ఏమిటి?
  rationale: חַטָּאת్‌ను నేరుగా ‘పాపం’గా అనువదించడం, ‘అపరాధం’తో ఉన్న మూలభాషా సమాంతరతను నిలుపుతుంది.
- source_word: כִּי דָלַקְתָּ אַחֲרָי
  choice: నువ్వు నన్ను ఇంత తీవ్రంగా వెంబడించడానికి కారణం ఏమిటి?
  rationale: דלק ప్రాథమికంగా మండడం, విస్తృతార్థంలో తీవ్రంగా లేదా పట్టుదలగా వెంటపడడం అనే సజీవ భావాన్ని కలిగి ఉంది. తెలుగు ప్రశ్నా నిర్మాణంలో ‘కారణం ఏమిటి?’ ముందున్న రెండు ప్రశ్నలతో సంబంధాన్ని సహజంగా చూపుతుంది; ‘తీవ్రంగా’ ఆ క్రియలోని ఉద్ధృతిని నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే కథన శైలి. మూలంలోని రెండు సమాంతర ప్రశ్నలు, యాకోబు కోపం, లాబానుతో అతని ప్రతివాదం నిలుపబడ్డాయి.
