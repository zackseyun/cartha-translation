    reason: lexical_alternative
  revision_rationale: The revision removes the added question about Laban's motive and lets the pursuit clause qualify Jacob's preceding rhetorical questions, as in the Hebrew. It also retains the intensified sense of the pursuit verb in a properly anchored lexical footnote rather than making it mandatory in the main text.
