id: GEN.31.16
reference: Genesis 31:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּ֣י כָל הָ/עֹ֗שֶׁר אֲשֶׁ֨ר הִצִּ֤יל אֱלֹהִים֙ מֵֽ/אָבִ֔י/נוּ לָ֥/נוּ ה֖וּא וּ/לְ/בָנֵ֑י/נוּ וְ/עַתָּ֗ה כֹּל֩ אֲשֶׁ֨ר אָמַ֧ר אֱלֹהִ֛ים אֵלֶ֖י/ךָ עֲשֵֽׂה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/016.yaml
  text: For all the wealth that God has taken from our father belongs to us and to our children. So now[a], whatever God has said to you, do.
translation:
  language: te
  text: ఎందుకంటే, దేవుడు మా తండ్రి నుండి తీసుకున్న సంపదంతా మాకూ మా పిల్లలకూ చెందుతుంది. కాబట్టి ఇప్పుడు దేవుడు నీతో చెప్పినదంతా చేయి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి మాటకు రాహేలు, లేయాలు ఇస్తున్న కారణాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: כָל הָעֹשֶׁר
  choice: సంపదంతా
  rationale: עֹשֶׁר అంటే సంపద లేదా ఐశ్వర్యం; సందర్భంలోని పశుసంపదతో సహా ఆస్తులన్నిటినీ సూచించగల సహజమైన పదబంధం.
- source_word: הִצִּיל
  choice: విడిపించిన
  rationale: నצל హిఫీల్ రూపానికి సాధారణంగా ‘రక్షించు/విడిపించు’ అనే భావం ఉంది. ఇక్కడ సంపదను లాబాను అధీనంనుండి దేవుడు తొలగించి యాకోబు కుటుంబానికి చేర్చిన సందర్భార్థాన్ని ‘విడిపించిన’ నిలుపుతుంది; ప్రత్యామ్నాయ భావాన్ని పాదసూచిక వివరిస్తుంది.
- source_word: מֵאָבִינוּ
  choice: మా తండ్రి దగ్గర నుండి
  rationale: מן సూచించే మూలాన్ని స్పష్టంగా, సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: לָנוּ הוּא וּלְבָנֵינוּ
  choice: మాదే, మా పిల్లలదే
  rationale: హీబ్రూ వాక్యంలోని స్వామ్యము లేదా హక్కు భావాన్ని సంక్షిప్తంగా, బలంగా తెలియజేస్తుంది.
- source_word: וְעַתָּה
  choice: కాబట్టి ఇప్పుడు
  rationale: కారణ వివరణనుంచి ఆచరణకు ఇచ్చే ప్రోత్సాహానికి మార్పును, సందర్భంలోని నిర్ధారణాత్మక భావాన్ని చూపుతుంది.
- source_word: כֹּל אֲשֶׁר אָמַר אֱלֹהִים אֵלֶיךָ
  choice: దేవుడు నీతో చెప్పినదంతా
  rationale: כֹּל אֲשֶׁר యొక్క సంపూర్ణతను కాపాడుతూ తెలుగులో సహజంగా ఉంటుంది.
- source_word: עֲשֵׂה
  choice: చేయి
  rationale: హీబ్రూ ఆజ్ఞ యొక్క సంక్షిప్తతను, ప్రత్యక్షతను నిలుపుతుంది.
theological_decisions:
- issue: లాబాను సంపద విషయంలో దేవుని చర్య
  choice: ‘విడిపించిన’ అని అనువదించడం
  alternative: ‘తీసుకున్న’ లేదా ‘తీసివేసిన’
  rationale: మూల క్రియలోని రక్షణ/విడుదల భావాన్ని నిలుపుతూ, సందర్భంలో సంపద లాబాను అధీనంనుండి యాకోబు కుటుంబానికి రావడాన్ని సూచిస్తుంది. ఇది దైవ చర్య స్వభావాన్ని సిద్ధాంతపరంగా అతిగా నిర్ధారించదు; సందర్భోచిత ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కుటుంబ సంభాషణకు సహజంగా ఉండేలా, అయినా గౌరవప్రదమైన బైబిలు శైలిని కాపాడింది. పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో సంబంధిత క్రియ వెంట ఉంచబడింది.
