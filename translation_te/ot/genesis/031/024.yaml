  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּבֹ֧א אֱלֹהִ֛ים אֶל לָבָ֥ן הָ/אֲרַמִּ֖י בַּ/חֲלֹ֣ם הַ/לָּ֑יְלָה וַ/יֹּ֣אמֶר ל֗/וֹ הִשָּׁ֧מֶר לְ/ךָ֛ פֶּן תְּדַבֵּ֥ר עִֽם יַעֲקֹ֖ב מִ/טּ֥וֹב עַד רָֽע־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/024.yaml
  text: But God came to Laban the Aramean in a dream at night and said to him[c][b][a], “Be careful not to speak to Jacob either good or bad.”
translation:
  language: te
  text: అయితే దేవుడు రాత్రి కలలో అరామీయుడైన లాబాను దగ్గరకు వచ్చి అతనితో, “జాగ్రత్త! యాకోబుతో మంచిగానీ చెడుగానీ ఏమీ మాట్లాడవద్దు[a]” అని చెప్పాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “మంచి నుండి చెడు వరకు.” ఇది అనుకూలమైనదైనా ప్రతికూలమైనదైనా ఏ మాటా మాట్లాడకూడదని తెలిపే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: వచ్చి
  rationale: בוא అనే సాధారణ గమన క్రియకు ‘వచ్చాడు’ సహజమైన సమానం. ‘కనిపించాడు’ అని అనువదిస్తే మూలంలో స్పష్టంగా లేని ప్రత్యక్షత భావం చేరుతుంది.
- source_word: אֱלֹהִים
  choice: దేవుడు
  rationale: ఏకవచన క్రియతోనూ కథా సందర్భంలోనూ ఇది ఏక దేవుణ్ణే సూచిస్తుంది.
- source_word: לָבָן הָאֲרַמִּי
  choice: అరామీయుడైన లాబాను
  rationale: אֲרַמִּי అనే జాతినామం ‘అరామీయుడు’; సంప్రదాయ ‘సిరియుడు’ కంటే ఇది హీబ్రూ పదాన్ని నేరుగా ప్రతిబింబిస్తుంది.
- source_word: בַּחֲלֹם הַלָּיְלָה
  choice: రాత్రి కలలో
  rationale: ‘కలలో’ మరియు రాత్రి కాలసూచన రెండింటినీ సహజమైన ఆధునిక తెలుగులో సంక్షిప్తంగా నిలుపుతుంది.
- source_word: הִשָּׁמֶר לְךָ
  choice: జాగ్రత్త!
  rationale: ఇది హెచ్చరికను తెలిపే హీబ్రూ ప్రయోగం. ‘జాగ్రత్త!’ దాని బలాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: פֶּן תְּדַבֵּר עִם יַעֲקֹב
  choice: యాకోబుతో … మాట్లాడవద్దు
  rationale: פֶּן నిషేధాత్మక హెచ్చరికను సూచిస్తుంది; דבר עם అనే నిర్మాణాన్ని ‘తో మాట్లాడటం’ సహజంగా ప్రతిబింబిస్తుంది.
- source_word: מִטּוֹב עַד רָע
  choice: మంచిగానీ చెడుగానీ ఏమీ
  rationale: అక్షరార్థంగా ‘మంచి నుండి చెడు వరకు’ అయిన ఈ జంట ప్రయోగం సందర్భంలో సమస్త మాటలనూ—అనుకూలమైనవైనా ప్రతికూలమైనవైనా—నిషేధిస్తుంది. ‘ఏమీ’ ఆ నుడికార భావాన్ని తెలుగులో స్పష్టం చేస్తుంది; పాదటిప్పణి అక్షరరూపాన్ని తెలియజేస్తుంది.
theological_decisions:
- issue: אֱלֹהִים యొక్క గుర్తింపు
  choice: దేవుడు
  alternative: దేవతలు / ఒక దైవిక సత్తా
  rationale: ఏకవచన క్రియారూపం మరియు కథా సందర్భం ఒకే దేవుణ్ణి సూచిస్తున్నాయి; ప్రత్యేక సిద్ధాంత వివరణను వాక్యంలో చేర్చలేదు.
- issue: మంచి నుండి చెడు వరకు అనే హెచ్చరిక పరిధి
  choice: యాకోబుతో మంచిగానీ చెడుగానీ ఏమీ మాట్లాడకూడదనే సంపూర్ణ నిషేధం
  alternative: యాకోబును బెదిరించే చెడు మాటలు మాత్రమే మాట్లాడకూడదు
  rationale: ధ్రువపదాల జంట మొత్తం పరిధిని సూచించే హీబ్రూ నుడికారం. అయినా మూలంలోని ‘మంచి/చెడు’ ఉద్వేగాన్ని ప్రధాన పాఠంలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రద కథన శైలి. ‘అరామీయుడు’ అనే మూల జాతినామాన్ని నిలిపి, హెచ్చరికకు సహజమైన ప్రత్యక్ష వాక్య నిర్మాణం వాడబడింది.
