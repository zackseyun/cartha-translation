reference: Genesis 31:31
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּ֥עַן יַעֲקֹ֖ב וַ/יֹּ֣אמֶר לְ/לָבָ֑ן כִּ֣י יָרֵ֔אתִי כִּ֣י אָמַ֔רְתִּי פֶּן תִּגְזֹ֥ל אֶת בְּנוֹתֶ֖י/ךָ מֵ/עִמִּֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/031.yaml
  text: Then Jacob answered and said to Laban[a], “Because I was afraid, for I said[b], ‘Lest you take your daughters from me by force.’”
translation:
  language: te
  text: 'అప్పుడు యాకోబు లాబానుకు జవాబిచ్చి ఇలా అన్నాడు: “నేను భయపడ్డాను, ఎందుకంటే ఇలా అనుకున్నాను: ‘నువ్వు నీ కుమార్తెలను నా దగ్గర నుంచి బలవంతంగా లాక్కుంటావేమో.’”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “నేను అన్నాను”; ఇక్కడ తనలో తాను అనుకోవడం అనే భావం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: జవాబిచ్చి ఇలా అన్నాడు
  rationale: హీబ్రూ కథనంలోని ‘జవాబిచ్చాడు—అన్నాడు’ అనే రెండు క్రియలనూ నిలుపుతూ, తెలుగులో సహజమైన సంభాషణ ప్రవేశంగా ఉంటుంది.
- source_word: כִּי יָרֵאתִי
  choice: నేను భయపడ్డాను. ఎందుకంటే
  rationale: మొదటి כִּי కారణాన్ని సూచిస్తుంది; వాక్యాన్ని రెండుగా విభజించడం ఆధునిక తెలుగులో స్పష్టతను ఇస్తూ కారణ సంబంధాన్ని కాపాడుతుంది.
- source_word: כִּי אָמַרְתִּי
  choice: అని అనుకున్నాను
  rationale: אָמַרְתִּי అక్షరార్థంగా ‘నేను అన్నాను’; అయితే ఇక్కడ యాకోబు తనలో తాను అనుకున్నదాన్ని సూచిస్తుంది. ప్రధాన పాఠంలో సహజమైన తెలుగు వాడి, అక్షరార్థాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: פֶּן
  choice: లాక్కుంటావేమో
  rationale: భయపడుతున్న సంభావ్య ఫలితాన్ని సూచించే פֶּן భావాన్ని తెలుగు ‘ఏమో’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: תִּגְזֹל
  choice: బలవంతంగా లాక్కుంటావు
  rationale: גזל కేవలం తీసుకోవడం కాక అన్యాయంగా లేదా బలవంతంగా అపహరించడం అనే బలమైన భావాన్ని కలిగి ఉంది; ఈ ఎంపిక ఆ తీవ్రతను ప్రధాన పాఠంలోనే నిలుపుతుంది.
- source_word: אֶת־בְּנוֹתֶיךָ מֵעִמִּי
  choice: నీ కుమార్తెలను నా దగ్గర నుంచి
  rationale: బంధుత్వ సంబంధాన్నీ, యాకోబు సమక్షం లేదా సహవాసం నుంచి వారిని వేరుచేయడాన్నీ సహజమైన తెలుగులో తెలియజేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘నువ్వు’ కుటుంబ సంభాషణ సందర్భానికి సహజంగా ఉండగా, అవమానార్థాన్ని మోపదు. גזל యొక్క బలమైన భావాన్ని పాదసూచికకు పరిమితం చేయకుండా ‘బలవంతంగా లాక్కుంటావు’ ద్వారా ప్రధాన పాఠంలోనే వ్యక్తం చేశాం.
