- from: 'అప్పుడు యాకోబు లాబానుకు జవాబిచ్చి ఇలా అన్నాడు: “నేను భయపడ్డాను. ఎందుకంటే, ‘నువ్వు నీ కుమార్తెలను నా దగ్గర నుంచి బలవంతంగా లాక్కుంటావేమో’ అని అనుకున్నాను[a].”'
  to: 'అప్పుడు యాకోబు లాబానుకు జవాబిచ్చి ఇలా అన్నాడు: “నేను భయపడ్డాను, ఎందుకంటే ఇలా అనుకున్నాను: ‘నువ్వు నీ కుమార్తెలను నా దగ్గర నుంచి బలవంతంగా లాక్కుంటావేమో.’”[a]'
  rationale: Only the Telugu sentence and quotation structure have been smoothed. The revision retains the source’s causal relationship, the internal-speech sense of אָמַרְתִּי, the apprehensive force of פֶּן, and the strong seizure nuance of תִּגְזֹל. The footnote anchor is placed after the complete direct-speech unit because it explains Jacob’s introductory “అనుకున్నాను.”
