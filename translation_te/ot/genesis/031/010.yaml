id: GEN.31.10
reference: Genesis 31:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְהִ֗י בְּ/עֵת֙ יַחֵ֣ם הַ/צֹּ֔אן וָ/אֶשָּׂ֥א עֵינַ֛/י וָ/אֵ֖רֶא בַּ/חֲל֑וֹם וְ/הִנֵּ֤ה הָֽ/עַתֻּדִים֙ הָ/עֹלִ֣ים עַל הַ/צֹּ֔אן עֲקֻדִּ֥ים נְקֻדִּ֖ים וּ/בְרֻדִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/010.yaml
  text: And it happened at the time when the flock was mating that I lifted up my eyes and saw in a dream[a], and behold, the male goats that were mounting the flock were striped, speckled[b], and mottled.
translation:
  language: te
  text: మంద జతకట్టే సమయంలో, నేను కళ్లెత్తి కలలో చూశాను. ఇదిగో, మందలోని ఆడ జంతువులపైకి ఎక్కుతున్న మగ మేకలు చారలు గలవి,[a] మచ్చలు గలవి, మిశ్రమ మచ్చలు గలవి.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “పట్టీలవంటి గుర్తులు గలవి.” హీబ్రూ పదం జంతువుల శరీరంపై పట్టీలు లేదా చారలవంటి గుర్తులను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా “కలగలిసిన రంగులు గలవి.” ఈ మూడు హీబ్రూ పదాలు బహుశా వేర్వేరు శరీరపు రంగు నమూనాలను సూచిస్తున్నాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בְּעֵת
  choice: సమయంలో
  rationale: గతంలో దర్శనం సంభవించిన సందర్భాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; ప్రత్యేకంగా ‘సంభవించింది’ అని చేర్చకుండానే హీబ్రూ కాలసూచక నిర్మాణాన్ని అందిస్తుంది.
- source_word: יַחֵם הַצֹּאן
  choice: మంద జతకట్టే
  rationale: పశువులు వేడిలో ఉండి జతకట్టే సంతానోత్పత్తి సందర్భాన్ని స్పష్టంగా, మర్యాదగా వ్యక్తం చేస్తుంది; ‘గర్భం ధరించే’ అని ఫలితాన్ని ముందుగా నిర్ణయించదు.
- source_word: וָאֶשָּׂא עֵינַי
  choice: నేను కళ్లెత్తి
  rationale: చూపును పైకి మళ్లించడాన్ని సూచించే హీబ్రూ నుడికారాన్ని తెలుగులో సహజంగా నిలుపుతుంది.
- source_word: וָאֵרֶא בַּחֲלוֹם
  choice: కలలో చూశాను
  rationale: చూడటం జరిగిన మాధ్యమం కల అని నేరుగా తెలియజేస్తుంది.
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: దర్శనంలోని హఠాత్తైన, సజీవమైన ప్రదర్శన భావాన్ని నిలుపుతుంది.
- source_word: הָעַתֻּדִים
  choice: మగ మేకలు
  rationale: సంతానోత్పత్తికి ఉపయోగించే మగ మేకలను సామాన్య పాఠకులకు స్పష్టంగా సూచిస్తుంది.
- source_word: הָעֹלִים עַל הַצֹּאן
  choice: మందపైకి ఎక్కుతున్న
  rationale: జతకట్టే సందర్భంలో עלה על అనే స్పష్టమైన శారీరక చిత్రణను అతిగా వివరణాత్మకం చేయకుండా నిలుపుతుంది.
- source_word: עֲקֻדִּים
  choice: చారలు గలవి
  rationale: కట్టులా లేదా పట్టీలా కనిపించే గుర్తులను సులభంగా అర్థమయ్యే తెలుగులో తెలుపుతుంది.
- source_word: נְקֻדִּים
  choice: మచ్చలు గలవి
  rationale: చిన్న చుక్కలవంటి లేదా మచ్చలవంటి గుర్తులను సూచిస్తుంది.
- source_word: וּבְרֻדִּים
  choice: రంగురంగుల మచ్చలు గలవి
  rationale: మునుపటి మచ్చల పదంతో పూర్తిగా కలిపివేయకుండా, కలగలిసిన లేదా విచిత్రవర్ణపు మచ్చల నమూనాను సూచిస్తుంది; ఈ అరుదైన పదానికి గల అర్థ అనిశ్చితిని పాదసూచికలో ఉంచుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గ్రామీణ పశుపోషణ సందర్భానికి సరిపోయే సాధారణ పదజాలం వాడబడింది. ‘ఇదిగో’ ద్వారా దర్శనపు సజీవతను, ‘మందపైకి ఎక్కుతున్న’ ద్వారా మూలంలోని concrete imageryను నిలిపాం. మూడు వర్ణనాత్మక పదాల మధ్య సాధ్యమైనంత భేదం ఉంచుతూ, అరుదైన రంగు పదాల అనిశ్చితిని పాదసూచికల్లో తెలిపాం.
