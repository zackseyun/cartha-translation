- from: మంద జతకట్టే సమయంలో, నేను కళ్లెత్తి కలలో చూశాను. ఇదిగో, మందపైకి ఎక్కుతున్న మగ మేకలు చారలు గలవి,[a] మచ్చలు గలవి, రంగురంగుల మచ్చలు గలవి.[b]
