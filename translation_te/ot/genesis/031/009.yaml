source:
  edition: WLC
  text: וַ/יַּצֵּ֧ל אֱלֹהִ֛ים אֶת מִקְנֵ֥ה אֲבִי/כֶ֖ם וַ/יִּתֶּן לִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/009.yaml
  text: So God took away your father's livestock and gave it to me[a].
translation:
  language: te
  text: కాబట్టి దేవుడు మీ తండ్రి పశుసంపదను అతని దగ్గర నుండి తీసి నాకు ఇచ్చాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘లాక్కొని’ లేదా ‘విడిపించి’ అని కూడా అనువదించవచ్చు. హెబ్రీ క్రియ ఒకరి అధీనంలోనుండి తీసి మరొకరికి చేర్చడం అనే భావాన్ని ఇవ్వగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּצֵּל
  choice: అతని దగ్గర నుండి తీసి
  rationale: నצל హిఫీల్ రూపం ఒకరి అధీనంలోనుండి తీసి మరొకరికి చేర్చడం, విడిపించడం లేదా లాక్కోవడం అనే భావాలను కలిగి ఉండవచ్చు. ఈ సందర్భంలో లాబాను నుండి యాకోబుకు పశుసంపద బదిలీ కావడం ప్రధాన భావం; అందువల్ల ‘అతని దగ్గర నుండి తీసి’ సహజంగా, అతిశయోక్తి లేకుండా ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: אֱלֹהִים
  choice: దేవుడు
  rationale: ఇక్కడ యాకోబు పక్షాన కార్యం చేస్తున్న దేవుణ్ణి సూచించే సాధారణ హెబ్రీ పదానికి ఆధునిక ప్రామాణిక తెలుగు రూపం.
- source_word: מִקְנֵה
  choice: పశుసంపద
  rationale: ఈ పదం సంపాదించిన ఆస్తిని, ముఖ్యంగా పెంపుడు జంతువులను సూచిస్తుంది. మందల సందర్భంలో ‘పశుసంపద’ విస్తృతతనూ సమూహార్థాన్నీ కాపాడుతుంది.
- source_word: אֲבִיכֶם
  choice: మీ తండ్రి
  rationale: 'ఏకవచన నామవాచకానికి ద్వితీయ పురుష బహువచన ప్రత్యయం ఉంది: రాహేలు, లేయా ఇద్దరినీ ఉద్దేశించి వారి ఒకే తండ్రి లాబానును సూచిస్తుంది.'
- source_word: וַיִּתֶּן לִי
  choice: నాకు ఇచ్చాడు
  rationale: נתן క్రియ మరియు ‘నాకు’ అనే పరోక్ష కర్మ బదిలీని స్పష్టంగా తెలియజేస్తాయి; ఇచ్చినది ముందున్న ‘పశుసంపద’ నుంచే సహజంగా గ్రహించబడుతుంది.
theological_decisions:
- issue: యాకోబు అభివృద్ధిలో దేవుని ప్రత్యక్ష కార్యం
  choice: లాబాను అధీనంలోని పశుసంపదను దేవుడు తీసి యాకోబుకు ఇచ్చాడని నేరుగా పేర్కొనడం
  alternative: కేవలం దేవుడు యాకోబును ఆశీర్వదించాడనే మృదువైన భావవ్యక్తీకరణ
  rationale: וַיַּצֵּל ... וַיִּתֶּן అనే క్రియలు దేవుని కార్యాన్నీ ఒకరి నుండి మరొకరికి జరిగిన బదిలీనీ ప్రత్యక్షంగా చెబుతున్నాయి. ఆ బలమైన వాక్యార్థాన్ని అస్పష్టమైన ‘ఆశీర్వాదం’గా మార్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం. ‘పశుసంపద’ సమూహార్థక ఏకవచనంగా వాడబడింది. ‘అతని దగ్గర నుండి’ అనే స్పష్టీకరణ మూలంలోని బదిలీ భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
