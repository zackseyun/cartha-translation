translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథనశైలి. వరుస హీబ్రూ వావ్ నిర్మాణాలను యాంత్రికంగా పునరావృతం చేయకుండా, చర్యల క్రమాన్ని స్పష్టంగా ఉంచే సహజ తెలుగు వాక్యనిర్మాణం ఉపయోగించబడింది.
