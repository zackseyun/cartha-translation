id: GEN.31.23
reference: Genesis 31:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּקַּ֤ח אֶת אֶחָי/ו֙ עִמּ֔/וֹ וַ/יִּרְדֹּ֣ף אַחֲרָ֔י/ו דֶּ֖רֶךְ שִׁבְעַ֣ת יָמִ֑ים וַ/יַּדְבֵּ֥ק אֹת֖/וֹ בְּ/הַ֥ר הַ/גִּלְעָֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/023.yaml
  text: And he took his kinsmen with him[a], and pursued him for a journey of seven days[d][c][b], and caught up with him in the hill country of Gilead.
translation:
  language: te
  text: అతడు తన బంధువులను తనతో తీసుకొని[a], యాకోబును వెంబడిస్తూ ఏడు రోజుల ప్రయాణం చేసి, గిలాదు కొండప్రాంతంలో అతన్ని చేరుకున్నాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘తన సోదరులను’; హీబ్రూ పదం సోదరులను మాత్రమే కాక విస్తృతంగా బంధువులను కూడా సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: ‘గిలాదు పర్వతం దగ్గర’ అని కూడా అనువదించవచ్చు; హీబ్రూ పదబంధం ఒక నిర్దిష్ట పర్వతాన్ని లేదా గిలాదు కొండప్రాంతాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶחָיו
  choice: తన బంధువులను
  rationale: אָח పదం సంకుచితంగా సోదరులను, విస్తృతంగా బంధువులను లేదా వంశసంబంధీకులను సూచించగలదు. సందర్భంలో లాబాను తన విస్తృత కుటుంబవర్గాన్ని సమీకరించినందున ‘బంధువులను’ సహజంగా సరిపోతుంది; ‘సోదరులను’ అనే ప్రత్యామ్నాయం పాదసూచికలో నిలుపబడింది.
- source_word: וַיִּרְדֹּף אַחֲרָיו
  choice: యాకోబును వెంబడిస్తూ
  rationale: רדף + אחר నిర్మాణం ‘అతని వెనుక వెంబడించు’ అనే భావాన్ని ఇస్తుంది. తెలుగులో ‘వెంబడిస్తూ’ సహజమైనది; సర్వనామ అస్పష్టతను నివారించడానికి సందర్భానుసారంగా ‘యాకోబును’ అని స్పష్టం చేయబడింది.
- source_word: דֶּרֶךְ שִׁבְעַת יָמִים
  choice: ఏడు రోజుల ప్రయాణం చేసి
  rationale: דֶּרֶךְ ఇక్కడ ప్రయాణదూరం లేదా ప్రయాణవ్యవధిని సూచించే క్రియావిశేషణ భావంలో ఉంది. ‘ఏడు రోజుల ప్రయాణం చేసి’ మూలంలోని ‘ప్రయాణం/మార్గం’ భావాన్ని కాపాడుతూ ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: וַיַּדְבֵּק אֹתוֹ
  choice: అతన్ని చేరుకున్నాడు
  rationale: דבק ఇక్కడ వెంబడింపులో ఒకరిని చేరుకోవడం లేదా పట్టుకోవడం అనే భావం ఇస్తుంది. ‘చేరుకున్నాడు’ అనేది అతిగా ‘పట్టుకున్నాడు’ అనే భావాన్ని చేర్చకుండా మూలార్థాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בְּהַר הַגִּלְעָד
  choice: గిలాదు కొండప్రాంతంలో
  rationale: הַר ఒక నిర్దిష్ట పర్వతాన్ని గానీ, కొండల ప్రాంతాన్ని గానీ సూచించవచ్చు. సందర్భానికి ప్రాంతీయ అర్థం అనుకూలంగా ఉన్నా, అసలు భాషలోని సంభావ్య ద్వంద్వార్థం పాదసూచికలో ఉంచబడింది.
