review_pass:
  verdict: revise
  source_fidelity: ‘కబురు పంపి’ appropriately conveys וַיִּשְׁלַח in context, and ‘పిలిపించాడు’ suitably expresses Jacob’s summoning of Rachel and Leah. However, the main text’s ‘పొలంలో తన మంద ఉన్న చోటికి’ resolves the two successive Hebrew destination expressions into an explanatory location more strongly than necessary. A closer Telugu construction can retain both phrases and their relationship without implying that the Hebrew explicitly says ‘where his flock was.’
  naturalness: The revision remains fluent in modern standard Telugu. Repeating the two destination phrases with a comma is concise and avoids the somewhat over-explanatory phrasing ‘తన మంద ఉన్న చోటికి.’
  terminology: ‘యాకోబు,’ ‘రాహేలు,’ ‘లేయా,’ ‘పొలం,’ and ‘మంద’ are appropriate standard biblical Telugu forms. No theological terminology is involved.
  issues:
  - severity: low
    issue: The phrase ‘తన మంద ఉన్న చోటికి’ makes the final phrase explicitly locational and embeds an interpretation in the main text.
    rationale: אֶל־צֹאנוֹ is formally ‘to his flock’; while it likely identifies the meeting place, the Hebrew’s compact relation between the field and flock should be retained where Telugu permits.
  revised_text: అప్పుడు యాకోబు కబురు పంపి, రాహేలును లేయాను పొలానికి, తన మంద దగ్గరికి[a] పిలిపించాడు.
