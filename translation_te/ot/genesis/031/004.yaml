  yaml_path: translation/ot/genesis/031/004.yaml
  text: So Jacob sent and called Rachel and Leah to the field[a], to his flock[b],
translation:
  language: te
  text: అప్పుడు యాకోబు కబురు పంపి, రాహేలును లేయాను పొలానికి, తన మంద దగ్గరికి[a] పిలిపించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పొలంలో, తన మంద ఉన్న చోటికి.” చివరి పదబంధం సమావేశ స్థలాన్ని మరింత స్పష్టంగా తెలియజేస్తున్నట్లు అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: కబురు పంపి
  rationale: שׁלח అనే క్రియకు ప్రాథమికంగా ‘పంపడం’ అనే అర్థం ఉంది. తరువాత వచ్చే ‘పిలిచాడు’ అనే క్రియతో కలిపి, యాకోబు వారిని రప్పించడానికి కబురు పంపాడనే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: וַיִּקְרָא
  choice: పిలిపించాడు
  rationale: קרא కు వ్యక్తులను ఉద్దేశించిన לְ వచ్చినప్పుడు ‘పిలవడం, రమ్మని పిలిపించడం’ అనే భావం ఉంటుంది. ఇక్కడ యాకోబు కబురు పంపి వారిని తన దగ్గరికి రప్పించాడు కాబట్టి ‘పిలిపించాడు’ సహజంగా సరిపోతుంది.
- source_word: לְרָחֵל וּלְלֵאָה
  choice: రాహేలును లేయాను
  rationale: వ్యక్తుల పేర్లను ఆధునిక ప్రామాణిక తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించాం; కర్మవిభక్తి వాక్యనిర్మాణాన్ని స్పష్టపరుస్తుంది.
- source_word: הַשָּׂדֶה
  choice: పొలంలో
  rationale: שׂדה అంటే పొలం లేదా బహిరంగ ప్రదేశం. తరువాతి אֶל־צֹאנוֹ పదబంధం ఆ పొలంలోని మరింత నిర్దిష్టమైన స్థలాన్ని సూచిస్తున్నట్లు తీసుకుని ‘పొలంలో’ అని అనువదించాం.
- source_word: אֶל צֹאנוֹ
  choice: తన మంద ఉన్న చోటికి
  rationale: צֹאן గొర్రెలు-మేకల మందను సూచిస్తుంది; אֶל దిశను లేదా సమీప గమ్యాన్ని సూచించగలదు. ఈ పదబంధం సమావేశ స్థలాన్ని స్పష్టీకరిస్తున్నట్లు సహజ తెలుగులో అందించాం; మరింత అక్షరార్థ రూపాన్ని పాదసూచికలో ఉంచాం.
