translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథనశైలిని వాడాం. హీబ్రూలోని వరుస క్రియలను ‘కబురు పంపి… పిలిపించాడు’గా సహజీకరించాం; స్థలాన్ని తెలిపే చివరి రెండు పదబంధాల మధ్య ఉన్న సంబంధంలోని స్వల్ప అస్పష్టతను పాదసూచికలో నిలిపాం.
