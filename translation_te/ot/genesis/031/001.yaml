source:
  edition: WLC
  text: וַ/יִּשְׁמַ֗ע אֶת דִּבְרֵ֤י בְנֵֽי לָבָן֙ לֵ/אמֹ֔ר לָקַ֣ח יַעֲקֹ֔ב אֵ֖ת כָּל אֲשֶׁ֣ר לְ/אָבִ֑י/נוּ וּ/מֵ/אֲשֶׁ֣ר לְ/אָבִ֔י/נוּ עָשָׂ֕ה אֵ֥ת כָּל הַ/כָּבֹ֖ד הַ/זֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/001.yaml
  text: He heard the words of Laban’s sons[a], saying, “Jacob has taken all that belonged to our father, and from what belonged to our father he has gained all this wealth.”
translation:
  language: te
  text: 'లాబాను కుమారులు ఇలా చెప్పడం అతడు విన్నాడు: “యాకోబు మన తండ్రికి చెందినదంతా తీసుకున్నాడు. మన తండ్రికి చెందినదాని నుండి అతడు ఈ సంపదంతా సంపాదించుకున్నాడు.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఈ వైభవమంతా.” హీబ్రూ పదం గౌరవం, వైభవం లేదా భౌతిక సంపదను సూచించగలదు; ఇక్కడ అది యాకోబుకు కనిపిస్తున్న ఐశ్వర్యాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: అతడు విన్నాడు
  rationale: వయ్యిక్తోల్ కథనాన్ని ముందుకు నడిపిస్తుంది. సందర్భంలో కర్త యాకోబు; హీబ్రూలో స్పష్టమైన ‘ఇప్పుడు’ అనే కాలసూచక పదం లేనందున దాన్ని చేర్చలేదు.
- source_word: דִּבְרֵי בְנֵי לָבָן לֵאמֹר
  choice: లాబాను కుమారులు ఇలా అనడం
  rationale: దిబ్రే అనే పదం మాటలు/చెప్పిన విషయం అనే భావాన్ని, లేమోర్ ప్రత్యక్ష ఉల్లేఖనాన్ని పరిచయం చేసే భావాన్ని ఇక్కడ సహజమైన తెలుగు నిర్మాణంలో కలిపి వ్యక్తం చేస్తుంది.
- source_word: לָקַח
  choice: తీసుకున్నాడు
  rationale: లాకఖ్ సాధారణంగా ‘తీసుకొను’ అని అర్థం. ‘లాక్కున్నాడు’ లేదా ‘దోచుకున్నాడు’ అనడం మూలపదం తప్పనిసరిగా సూచించని బలవంతం లేదా దొంగతనం భావాన్ని పెంచుతుంది.
- source_word: כָּל אֲשֶׁר לְאָבִינוּ
  choice: మన తండ్రికి చెందినదంతా
  rationale: లామెద్ ఇక్కడ స్వామ్యాన్ని సూచిస్తుంది. ‘చెందినదంతా’ సహజంగా ఉండి సంపూర్ణతను నిలుపుతుంది.
- source_word: וּמֵאֲשֶׁר לְאָבִינוּ
  choice: మన తండ్రికి చెందినదానితోనే
  rationale: మిన్ మూలాన్ని లేదా సాధనమైన వనరును సూచిస్తుంది. ‘తోనే’ వారి ఆరోపణలోని ఉద్ఘాటనను సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: עָשָׂה
  choice: సంపాదించుకున్నాడు
  rationale: అక్షరార్థంగా ‘చేశాడు’; సంపద అనే కర్మతో కలిసినప్పుడు సంపాదించుకున్నాడు/ఏర్పరచుకున్నాడు అనే సందర్భార్థం వస్తుంది.
- source_word: כָּל הַכָּבֹד הַזֶּה
  choice: ఈ సంపదంతా
  rationale: కావోద్ గౌరవం, వైభవం, సంపద అనే భావాలను సూచించగలదు. ఇక్కడ యాకోబు యొక్క పశుసంపదతో కూడిన కనిపించే ఐశ్వర్యమే సందర్భం; అందువల్ల ‘సంపద’ అనుకూలం. పదంలోని విస్తృత భావాన్ని పాదటిప్పణిలో ఉంచాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన ప్రత్యక్ష సంభాషణను ఉపయోగించాం. ‘మన తండ్రి’ అనేది కుమారుల మాటల్లో తెలుగుకు సహజం. ఆరోపణ స్వరాన్ని నిలిపినా, మూలంలో లేని ‘దోచుకున్నాడు’ వంటి తీవ్ర పదాన్ని చేర్చలేదు. పాదటిప్పణి గుర్తు దానికి సంబంధించిన ‘సంపదంతా’ తరువాత ఉంచబడింది.
