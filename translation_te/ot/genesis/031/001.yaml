revisions:
- from: 'లాబాను కుమారులు ఇలా అనడం అతడు విన్నాడు: “యాకోబు మన తండ్రికి చెందినదంతా తీసుకున్నాడు. మన తండ్రికి చెందినదానితోనే అతడు ఈ సంపదంతా సంపాదించుకున్నాడు.[a]”'
  to: 'లాబాను కుమారులు ఇలా చెప్పడం అతడు విన్నాడు: “యాకోబు మన తండ్రికి చెందినదంతా తీసుకున్నాడు. మన తండ్రికి చెందినదాని నుండి అతడు ఈ సంపదంతా సంపాదించుకున్నాడు.[a]”'
  rationale: 'The revision removes the added restrictive force of “తోనే” and uses “నుండి” to represent the Hebrew preposition of source. The opening is adjusted minimally for smoother Telugu while maintaining the Hebrew sequence: he heard the words of Laban’s sons, followed by their direct speech. The contextual rendering “సంపద” and its lexical footnote are retained.'
