id: GEN.31.14
reference: Genesis 31:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/תַּ֤עַן רָחֵל֙ וְ/לֵאָ֔ה וַ/תֹּאמַ֖רְנָה ל֑/וֹ הַ/ע֥וֹד לָ֛/נוּ חֵ֥לֶק וְ/נַחֲלָ֖ה בְּ/בֵ֥ית אָבִֽי/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/014.yaml
  text: Then Rachel and Leah answered and said to him[b][a], “Do we still have any share or inheritance in our father’s house?”
translation:
  language: te
  text: 'అప్పుడు రాహేలు, లేయా అతనికి జవాబిచ్చి ఇలా అన్నారు: “మా తండ్రి ఇంటిలో[a] మాకు ఇంకా వాటా[b] గానీ వారసత్వం గానీ ఉందా?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “మా తండ్రి ఇల్లు” అనేది భౌతిక గృహాన్ని మాత్రమే కాకుండా కుటుంబ వర్గాన్ని లేదా పితృఆస్తిని కూడా సూచించవచ్చు.
    reason: cultural_note
  - marker: b
    text: లేదా “భాగం.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעַן ... וַתֹּאמַרְנָה לֹו
  choice: అప్పుడు ... అతనికి ఇలా జవాబిచ్చారు
  rationale: వావ్-వరుస కథనాన్ని ముందుకు నడిపిస్తుంది; రెండు మాటల క్రియలను తెలుగులో సహజంగా ఒకే వాక్యప్రయోగంలో కలిపి, మాటలు యాకోబును ఉద్దేశించినవని స్పష్టంగా నిలిపింది.
- source_word: רָחֵל וְלֵאָה
  choice: రాహేలు, లేయా
  rationale: తెలుగు బైబిలు వాడుకకు అనుగుణమైన వ్యక్తి పేర్ల రూపాలు.
- source_word: הַעוֹד לָנוּ
  choice: మాకు ఇంకా ... ఉందా?
  rationale: కొనసాగి ఏదైనా మిగిలి ఉందా అనే ప్రశ్నార్థక, కాలసూచక భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: חֵלֶק
  choice: వాటా
  rationale: కుటుంబ ఆస్తి, వారసత్వ సందర్భంలో కేటాయించబడే భాగాన్ని ‘వాటా’ స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: וְנַחֲלָה
  choice: వారసత్వం
  rationale: వంశపారంపర్యంగా సంక్రమించే ఆస్తి లేదా హక్కు అనే అర్థాన్ని సందర్భానుకూలంగా అందిస్తుంది.
- source_word: בְּבֵית אָבִינוּ
  choice: మా తండ్రి ఇంటిలో
  rationale: మూలంలోని ‘ఇల్లు’ రూపకాన్ని నిలుపుతూ, అది కుటుంబ గృహం, కుటుంబ వర్గం లేదా పితృఆస్తిని సూచించగల విస్తృతిని కాపాడుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. రాహేలు, లేయా ఇద్దరూ కలిసి పలికినందున బహువచన క్రియ వాడబడింది. ‘వాటా గానీ వారసత్వం గానీ’ అనే నిర్మాణం ప్రతికూల సమాధానాన్ని సూచించే అలంకారిక ప్రశ్నకు తెలుగులో సహజత్వాన్ని ఇస్తుంది; మూలంలోని రెండు వేర్వేరు ఆస్తి పదాలను కూడా నిలుపుతుంది.
