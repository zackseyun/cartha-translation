  terminology: 'The original footnote’s “తంబురా” is inaccurate: a tambura is a stringed drone instrument, not the traditional equivalent of “timbrel” (תֹף). “తంబురిన్” and “లైర్” are safer, source-oriented terms; explanatory notes can provide the needed accessibility without identifying them with culturally distinct Telugu instruments.'
