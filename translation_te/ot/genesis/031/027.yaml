source:
  edition: WLC
  text: לָ֤/מָּה נַחְבֵּ֨אתָ֙ לִ/בְרֹ֔חַ וַ/תִּגְנֹ֖ב אֹתִ֑/י וְ/לֹא הִגַּ֣דְתָּ לִּ֔/י וָֽ/אֲשַׁלֵּחֲ/ךָ֛ בְּ/שִׂמְחָ֥ה וּ/בְ/שִׁרִ֖ים בְּ/תֹ֥ף וּ/בְ/כִנּֽוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/027.yaml
  text: Why did you hide yourself to flee and steal away from me[a], and not tell me, so that I might have sent you away with joy and with songs[d][c][b], with tambourine and lyre?
translation:
  language: te
  text: నువ్వు పారిపోవడానికి దాక్కొని, నాకు తెలియకుండా ఎందుకు వెళ్లిపోయావు?[a] నాకు ఎందుకు చెప్పలేదు? చెప్పి ఉంటే, సంతోషంతోను పాటలతోను, తంబురిన్‌తో[b] లైర్‌తో[c] నిన్ను సాగనంపేవాణ్ణి కదా!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “నన్ను దొంగిలించావు.” ఇది ఒకరి దగ్గరనుండి వారికి తెలియకుండా రహస్యంగా జారిపోవడాన్ని సూచించే హీబ్రూ నుడికారం.
    reason: lexical_alternative
  - marker: b
    text: లేదా “చేతి డప్పుతో”; సంప్రదాయంగా “తింబ్రెల్‌తో.” ఇది చేతితో వాయించే చర్మవాద్యం.
    reason: lexical_alternative
  - marker: c
    text: హీబ్రూ పదం ప్రత్యేకంగా లైర్-తరహా తంతివాద్యాన్ని సూచిస్తుంది; దీనిని “హార్పు” అని కూడా అనువదిస్తారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָּה
  choice: ఎందుకు
  rationale: కారణాన్ని ప్రశ్నించే సాధారణ ప్రశ్నార్థక పదం; ఆధునిక తెలుగులో సహజమైన సమానం.
- source_word: נַחְבֵּאתָ לִבְרֹחַ
  choice: పారిపోవడానికి రహస్యంగా దాక్కొని
  rationale: נחבא యొక్క ఆత్మార్థక ‘దాక్కొను’ భావాన్నీ, ברח యొక్క ‘పారిపోవు’ భావాన్నీ నిలుపుతుంది.
- source_word: וַתִּגְנֹב אֹתִי
  choice: నాకు తెలియకుండా వెళ్లిపోయావు
  rationale: అక్షరార్థంగా ‘నన్ను దొంగిలించావు’; సందర్భంలో ఎదుటివారికి తెలియకుండా జారుకోవడాన్ని సూచించే హీబ్రూ నుడికారం. సహజ తెలుగులో దాని సందర్భార్థాన్ని ఇస్తుంది.
- source_word: וְלֹא הִגַּדְתָּ לִּי
  choice: నాకు ఎందుకు చెప్పలేదు?
  rationale: נגד హిఫీల్ రూపంలోని ‘తెలియజేయు/చెప్పు’ భావాన్ని నేరుగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וָאֲשַׁלֵּחֲךָ
  choice: నిన్ను సాగనంపేవాణ్ణి కదా
  rationale: చెప్పి ఉంటే అలా చేసేవాడిననే నెరవేరని సాధ్యతను, లాబాను నిందాపూర్వక స్వరాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: בְּשִׂמְחָה וּבְשִׁרִים
  choice: సంతోషంతో, పాటలతో
  rationale: వీడ్కోలు సందర్భంలోని ఆనందాన్ని, బహువచన שירים యొక్క ‘పాటలు’ భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: בְּתֹף
  choice: కంజీరతో
  rationale: చేతితో వాయించే చిన్న చర్మవాద్యాన్ని సూచించే ఆధునిక తెలుగులో పరిచితమైన పదం; ఖచ్చిత వాద్యరూపం అనిశ్చితమైనందున గమనిక జోడించబడింది.
- source_word: וּבְכִנּוֹר
  choice: వీణతో
  rationale: ప్రాచీన తంతివాద్యానికి తెలుగులో సహజంగా అర్థమయ్యే సమీప పదం; అది ప్రత్యేకంగా లైర్ తరహా వాద్యమని గమనిక స్పష్టం చేస్తుంది.
