language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: יֶשׁ לְ/אֵ֣ל יָדִ֔/י לַ/עֲשׂ֥וֹת עִמָּ/כֶ֖ם רָ֑ע וֵֽ/אלֹהֵ֨י אֲבִי/כֶ֜ם אֶ֣מֶשׁ אָמַ֧ר אֵלַ֣/י לֵ/אמֹ֗ר הִשָּׁ֧מֶר לְ/ךָ֛ מִ/דַּבֵּ֥ר עִֽם יַעֲקֹ֖ב מִ/טּ֥וֹב עַד רָֽע־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/029.yaml
  text: It is in my power to do you harm[a], but the God of your father spoke to me last night, saying, ‘Be careful not to speak to Jacob either good or bad.’
translation:
  language: te
  text: 'మీరందరికీ హాని చేసే శక్తి నాకు ఉంది. అయితే మీ తండ్రి దేవుడు గత రాత్రి నాతో ఇలా చెప్పాడు: ‘యాకోబుతో ఏ మాటా మాట్లాడవద్దు—మంచిగానీ చెడుగానీ.’[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “మంచి నుండి చెడు వరకు.” ఇది అనుకూలమైనదైనా ప్రతికూలమైనదైనా ఏ మాటా మాట్లాడకూడదనే భావాన్ని తెలిపే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶשׁ לְאֵל יָדִי
  choice: నా చేతిలో ఉంది
  rationale: సామర్థ్యం లేదా అధికారం తనకు ఉందని తెలిపే హీబ్రూ నుడికారాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: לַעֲשׂוֹת עִמָּכֶם רָע
  choice: మీకు హాని చేయడం
  rationale: ఇక్కడ רָע నైతిక దుష్టత్వం అనే అమూర్త భావం కంటే ఎదుటివారికి కీడు లేదా హాని చేయడాన్ని సూచిస్తుంది.
- source_word: וֵאלֹהֵי אֲבִיכֶם
  choice: అయితే మీ తండ్రి దేవుడు
  rationale: וְ సందర్భంలో లాబాను సామర్థ్యానికి దేవుని అడ్డుకట్టకు మధ్య వ్యత్యాసాన్ని చూపుతుంది. אֲבִיכֶם రూపం బహువచన సంబోధనను సూచించవచ్చు కాబట్టి ‘మీ’ను అలాగే నిలిపి, ‘తండ్రి’ని మూలంలోని ఏకవచనం ప్రకారం ఉంచాం.
- source_word: אֶמֶשׁ
  choice: గత రాత్రి
  rationale: సందర్భంలో ముందు రాత్రిని సూచించే సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: הִשָּׁמֶר לְךָ
  choice: జాగ్రత్తపడు
  rationale: నిఫాల్ ఆజ్ఞారూపంలోని హెచ్చరిక భావాన్ని సంక్షిప్తంగా, సహజంగా అందిస్తుంది.
- source_word: מִדַּבֵּר עִם יַעֲקֹב
  choice: యాకోబుతో ... మాట్లాడకుండా
  rationale: הִשָּׁמֶר తో מן నిర్మాణం నిషేధాన్ని వ్యక్తం చేస్తుంది; తెలుగులో ‘మాట్లాడకుండా జాగ్రత్తపడు’ సహజంగా ఉంది.
- source_word: מִטּוֹב עַד רָע
  choice: మంచి గానీ చెడు గానీ
  rationale: ‘మంచి నుండి చెడు వరకు’ అనే ధ్రువపద నుడికారాన్ని కాపాడుతూ, అనుకూలమైనదైనా ప్రతికూలమైనదైనా ఏ మాటా చెప్పవద్దనే పరిధిని తెలుపుతుంది.
theological_decisions:
- issue: లాబానుతో మాట్లాడిన దేవునికి אֱלֹהִים పదప్రయోగం
  choice: మీ తండ్రి దేవుడు
  alternative: మీ పితరుల దేవుడు
  rationale: అֲבִיכֶם లో నామవాచకం ‘తండ్రి’ ఏకవచనంలో ఉంది; సర్వనామ ప్రత్యయం బహువచనంగా కనిపిస్తుంది. అందువల్ల పితరులు అని మార్చకుండా మూలంలోని వ్యాకరణ ఉద్రిక్తతను ‘మీ తండ్రి’గా నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్యనిర్మాణం. ‘నా చేతిలో ఉంది’ అనే సహజ నుడికారం మూలంలోని అధికార/సామర్థ్య భావాన్ని నిలుపుతుంది.
