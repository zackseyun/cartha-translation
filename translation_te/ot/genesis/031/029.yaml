    text: హీబ్రూలో అక్షరార్థంగా, “మంచి నుండి చెడు వరకు.” ఇది అనుకూలమైనదైనా ప్రతికూలమైనదైనా ఏ మాటా మాట్లాడకూడదనే భావాన్ని తెలిపే నుడికారం.
    reason: lexical_alternative
