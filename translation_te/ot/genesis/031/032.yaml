source:
  edition: WLC
  text: עִ֠ם אֲשֶׁ֨ר תִּמְצָ֣א אֶת אֱלֹהֶי/ךָ֮ לֹ֣א יִֽחְיֶה֒ נֶ֣גֶד אַחֵ֧י/נוּ הַֽכֶּר לְ/ךָ֛ מָ֥ה עִמָּדִ֖/י וְ/קַֽח לָ֑/ךְ וְ/לֹֽא יָדַ֣ע יַעֲקֹ֔ב כִּ֥י רָחֵ֖ל גְּנָבָֽתַ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/032.yaml
  text: Whoever is found with your gods shall not live[a]. In the presence of our brothers, identify what of yours is with me[c][b], and take it for yourself.” Jacob did not know that Rachel had stolen them.
translation:
  language: te
  text: “నీ దేవుళ్లు ఎవరి దగ్గర దొరికినా, అతడు బతకడు.[a] మన సహోదరుల[b] సమక్షంలో, నా దగ్గర నీది ఏముందో గుర్తించి, తీసుకో.” రాహేలు వాటిని[c] దొంగిలించిందని యాకోబుకు తెలియదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత అక్షరార్థంగా: “ఎవరి దగ్గర నీ దేవుళ్లను నువ్వు కనుగొంటావో.”'
    reason: lexical_alternative
  - marker: b
    text: “సహోదరులు” అనే మాట ఇక్కడ సొంత అన్నదమ్ములనే కాక, అక్కడ ఉన్న విస్తృత కుటుంబానికి చెందిన పురుష బంధువులను లేదా బంధుజనులను కూడా సూచించవచ్చు.
    reason: cultural_note
  - marker: c
    text: ఇవి లాబానుకు చెందిన ఇంటి దేవతల విగ్రహాలు; రాహేలు వాటిని దొంగిలించింది.
    reason: cross_reference
lexical_decisions:
- source_word: עִם אֲשֶׁר תִּמְצָא
  choice: ఎవరి దగ్గర దొరికినా
  rationale: హీబ్రూ అనిర్దిష్ట సంబంధవాచక నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; లాబాను ఎవరి దగ్గర ఆ వస్తువులను కనుగొంటాడో ఆ వ్యక్తినే సూచిస్తుంది.
- source_word: אֱלֹהֶיךָ
  choice: నీ దేవుళ్లు
  rationale: మూలంలో ఉన్న బహువచనాన్ని నేరుగా నిలుపుతుంది. సందర్భం ఇవి ఇంటి దేవతల విగ్రహాలని తెలియజేస్తున్నప్పటికీ, ఈ వాక్యభాగంలో תְּרָפִים అనే ప్రత్యేక పదం లేదు.
- source_word: לֹא יִחְיֶה
  choice: అతడు బతకడు
  rationale: ఇది మరణశిక్షా ప్రకటనో, శాపసూత్రమో, దృఢమైన హెచ్చరికో అన్న ఉద్రిక్తతను ‘బతకడు’ నిలుపుతుంది; ‘బతకకూడదు’ అని అనువదించి కేవలం ఆజ్ఞార్థంగా పరిమితం చేయదు.
- source_word: נֶגֶד אַחֵינוּ
  choice: మన సహోదరుల సమక్షంలో
  rationale: נֶגֶד యొక్క ‘ఎదుట/సమక్షంలో’ భావాన్ని, אַחֵינוּ యొక్క అక్షరార్థమైన ‘మన సహోదరులు’ అనే పదాన్ని నిలుపుతుంది.
- source_word: הַכֶּר לְךָ מָה עִמָּדִי
  choice: నా దగ్గర ఉన్న వాటిలో నీది ఏమిటో గుర్తించి
  rationale: హీబ్రూలో సంక్షిప్తంగా ఉన్న యాజమాన్య భావాన్ని సందర్భానుసారంగా స్పష్టం చేస్తూ, లాబాను పరిశీలించి తన వస్తువును గుర్తించాలనే సవాలును సహజమైన తెలుగులో అందిస్తుంది.
- source_word: וְקַח לָךְ
  choice: దాన్ని తీసుకో
  rationale: తెలుగులో ‘తీసుకో’ అనే రూపమే לְךָ లోని వ్యక్తిగత ప్రయోజన భావాన్ని సహజంగా కలిగి ఉంటుంది; అదనంగా ‘నీ కోసం’ అనడం కృత్రిమంగా ఉంటుంది.
- source_word: וְלֹא יָדַע יַעֲקֹב
  choice: అయితే … యాకోబుకు తెలియదు
  rationale: కథకుని వివరణాత్మక పక్కవాక్యాన్ని స్పష్టంగా చూపించడానికి హీబ్రూ וְ ను సందర్భోచితమైన ‘అయితే’గా అందిస్తుంది.
- source_word: גְּנָבָתַם
  choice: వాటిని దొంగిలించిందని
  rationale: బహువచన ప్రత్యయాన్ని ‘వాటిని’గా నిలుపుతుంది; ముందే జరిగిన చర్యను తెలుగు సందర్భంలో సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: לֹא יִחְיֶה అనే మాట యొక్క బలం
  choice: అతడు బతకడు
  alternative: అతడు బతకకూడదు
  rationale: ఈ రూపం మాటను కేవలం న్యాయపరమైన ఆజ్ఞగా నిర్ణయించకుండా, మరణ ప్రకటన లేదా శాపం అనే సాధ్యమైన భావాలను తెరిచి ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గంభీరంగా ఉండే శైలి వాడబడింది. ‘బతకడు’ సాధారణ పాఠకునికి స్పష్టంగా ఉండటంతో పాటు మూలంలోని ప్రకటనాత్మక బలాన్ని నిలుపుతుంది. ప్రతి పాదటిప్పణి గుర్తు ప్రధాన వచనంలో ఉంచబడింది.
