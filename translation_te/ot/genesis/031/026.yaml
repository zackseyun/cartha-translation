  text: וַ/יֹּ֤אמֶר לָבָן֙ לְ/יַעֲקֹ֔ב מֶ֣ה עָשִׂ֔יתָ וַ/תִּגְנֹ֖ב אֶת לְבָבִ֑/י וַ/תְּנַהֵג֙ אֶת בְּנֹתַ֔/י כִּ/שְׁבֻי֖וֹת חָֽרֶב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/026.yaml
  text: Then Laban said to Jacob[a], “What have you done[c][b], that you have stolen my heart and driven my daughters away like captives of the sword?”
translation:
  language: te
  text: అప్పుడు లాబాను యాకోబుతో, “నువ్వేం చేశావు? నన్ను మోసగించి[a], నా కుమార్తెలను ఖడ్గంతో చెరపట్టబడిన స్త్రీల్లా[b] తోలుకుపోయావు!” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థం, “నా హృదయాన్ని దొంగిలించి.” ఇక్కడ ఇది తనకు తెలియకుండా మోసపూరితంగా వ్యవహరించడం అనే నుడికార భావాన్ని ఇస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అంటే, యుద్ధంలో ఖడ్గంతో చెరపట్టబడిన స్త్రీల్లా.
    reason: lexical_clarification
lexical_decisions:
- source_word: מֶה עָשִׂיתָ
  choice: నువ్వు చేసిన పని ఏమిటి?
  rationale: ఇది కేవలం సమాచారం అడిగే ప్రశ్న కాకుండా నిందతో కూడిన ప్రశ్న. ఆధునిక తెలుగులో ఈ రూపం ఆ ఆరోపణ ధోరణిని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וַתִּגְנֹב אֶת־לְבָבִי
  choice: నన్ను మోసగించి
  rationale: అక్షరార్థం ‘నా హృదయాన్ని దొంగిలించి.’ అయితే ఈ హీబ్రూ నుడికారం ఇక్కడ లాబానుకు తెలియకుండా, అతణ్ణి మోసగించి వ్యవహరించడాన్ని సూచిస్తుంది. తెలుగు అక్షరానువాదం ప్రేమసంబంధమైన భావాన్ని కలిగించే అవకాశం ఉన్నందున భావాన్ని ప్రధాన పాఠ్యంలో ఇచ్చి, మూలరూపాన్ని పాదసూచికలో నిలిపాం.
- source_word: וַתְּנַהֵג
  choice: తోలుకొని వచ్చావు
  rationale: נהג బలవంతంగా నడిపించడం లేదా తోలడం అనే ఛాయను కలిగి ఉంది. తరువాతి యుద్ధఖైదీల పోలికకు అనుగుణంగా ‘తోలుకొని’ ఆ బలవంతపు దృశ్యాన్ని నిలుపుతుంది; వక్త ఉన్న చోటు దృష్ట్యా తెలుగులో ‘వచ్చావు’ సహజం.
- source_word: בְּנֹתַי
  choice: నా కుమార్తెలను
  rationale: స్వామ్యసూచక బహువచన బంధుత్వపదాన్ని నేరుగా, సహజంగా అనువదిస్తుంది.
- source_word: כִּשְׁבֻיוֹת חָרֶב
  choice: కత్తిచేత చెరపట్టబడిన స్త్రీల్లా
  rationale: שְׁבֻיוֹת స్త్రీలింగ బహువచనం; అందువల్ల ‘స్త్రీలు’ అని స్పష్టం చేశాం. ‘కత్తి’ అనే యుద్ధచిత్రాన్ని కూడా నిలిపాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, లాబాను పలికిన నిందాభరితమైన ప్రత్యక్ష సంభాషణను సహజంగా ఉంచాం. ‘మోసగించి’ అనే భావానువాదం లక్ష్యభాషలో తలెత్తగల ప్రేమసంబంధమైన అపార్థాన్ని నివారిస్తుంది; ‘తోలుకొని’ మరియు ‘కత్తిచేత చెరపట్టబడిన స్త్రీలు’ మూలంలోని బలవంతపు యుద్ధచిత్రాన్ని కాపాడుతాయి.
