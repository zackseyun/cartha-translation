- from: అప్పుడు లాబాను యాకోబుతో, “నువ్వు చేసిన పని ఏమిటి? నన్ను మోసగించి[a], నా కుమార్తెలను కత్తిచేత చెరపట్టబడిన స్త్రీల్లా[b] తోలుకొని వచ్చావేంటి?” అన్నాడు.
  to: అప్పుడు లాబాను యాకోబుతో, “నువ్వేం చేశావు? నన్ను మోసగించి[a], నా కుమార్తెలను ఖడ్గంతో చెరపట్టబడిన స్త్రీల్లా[b] తోలుకుపోయావు!” అన్నాడు.
  rationale: The revision corrects the directional implication of the movement verb, improves the natural accusatory wording, and retains both the Hebrew idiom’s meaning and the feminine war-captive imagery. The footnote anchors remain aligned with the relevant expressions.
