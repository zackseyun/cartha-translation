review_pass:
  verdict: revise
  source_fidelity: '‘నన్ను మోసగించి’ appropriately conveys the Hebrew idiom גנב לב (‘deceive/trick someone’) without importing the misleading romantic sense that a literal Telugu equivalent of ‘steal my heart’ could suggest. The war-captive comparison is retained. However, ‘తోలుకొని వచ్చావు’ reverses the deictic sense in this setting: Laban charges Jacob with taking his daughters away from him, so Telugu should say ‘తోలుకుపోయావు.’'
  naturalness: The dialogue is generally clear and modern. ‘నువ్వు చేసిన పని ఏమిటి?’ is acceptable, but ‘నువ్వేం చేశావు?’ is more idiomatic in an angry accusation. ‘ఖడ్గంతో చెరపట్టబడిన స్త్రీల్లా’ is clearer modern Telugu than ‘కత్తిచేత చెరపట్టబడిన స్త్రీల్లా,’ while preserving the sword imagery.
  terminology: ‘లాబాను,’ ‘యాకోబు,’ ‘నా కుమార్తెలను,’ and ‘మోసగించి’ are suitable. ‘చెరపట్టబడిన స్త్రీలు’ accurately reflects the feminine plural form שְׁבֻיוֹת. The note should retain the literal Hebrew image and explain the idiomatic sense without over-specifying it.
  issues:
  - severity: medium
    issue: ‘తోలుకొని వచ్చావేంటి?’ uses motion toward the speaker.
    rationale: The Hebrew verb means led/drove, and the accusation concerns Jacob’s taking Laban’s daughters away. In Telugu, ‘తోలుకుపోయావు’ correctly conveys departure from Laban and avoids an unintended directional reversal.
  - severity: low
    issue: The main interrogative is somewhat less idiomatic than necessary.
    rationale: ‘నువ్వేం చేశావు?’ more naturally expresses the sharp accusatory force of מֶה עָשִׂיתָ in contemporary standard Telugu.
  revised_text: అప్పుడు లాబాను యాకోబుతో, “నువ్వేం చేశావు? నన్ను మోసగించి[a], నా కుమార్తెలను ఖడ్గంతో చెరపట్టబడిన స్త్రీల్లా[b] తోలుకుపోయావు!” అన్నాడు.
