    reason: lexical_alternative
  revision_rationale: The revision retains the contextual kin-group rendering for מוֹלַדְתֶּךָ while making its genuine geographic alternative explicit in the footnote. It also uses a more idiomatic destination expression and renders the promise of divine presence without adding a specifically assistive nuance.
