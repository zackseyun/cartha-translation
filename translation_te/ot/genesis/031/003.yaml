id: GEN.31.3
reference: Genesis 31:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶֽל יַעֲקֹ֔ב שׁ֛וּב אֶל אֶ֥רֶץ אֲבוֹתֶ֖י/ךָ וּ/לְ/מוֹלַדְתֶּ֑/ךָ וְ/אֶֽהְיֶ֖ה עִמָּֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/003.yaml
  text: Then Yahweh said to Jacob[a], “Return to the land of your fathers and to your kindred, and I will be with you.”
translation:
  language: te
  text: 'అప్పుడు యాహ్వే యాకోబుతో ఇలా అన్నాడు: “నీ పితరుల దేశానికి, నీ స్వజనుల వద్దకు[a] తిరిగి వెళ్లు. నేను నీతో ఉంటాను.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘నీ జన్మస్థలానికి’ లేదా ‘నీ స్వదేశానికి’; హీబ్రూ పదం సందర్భాన్ని బట్టి స్వజనులను లేదా ఒకరి జన్మస్థలం/స్వదేశాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... చెప్పాడు
  rationale: వావ్-కన్సిక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది; ‘అప్పుడు’ ఆ క్రమాన్ని సహజమైన తెలుగు కథనశైలిలో తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: ఇది బిరుదు కాదు, దేవుని వ్యక్తిగత నామమైన చతురక్షర నామం; అందువల్ల దాని ఉచ్చారణాధారిత రూపాన్ని వాడాం.
- source_word: שׁוּב
  choice: తిరిగి వెళ్లు
  rationale: ఈ ఆజ్ఞారూపం మునుపటి ప్రాంతానికి తిరిగి వెళ్లడాన్ని సూచిస్తుంది; తెలుగులో ‘తిరిగి వెళ్లు’ సహజంగా దిశాభావాన్ని వ్యక్తం చేస్తుంది.
- source_word: אֶל אֶרֶץ אֲבוֹתֶיךָ
  choice: నీ పితరుల దేశానికి
  rationale: హీబ్రూ నిర్మాణాన్ని దగ్గరగా అనుసరిస్తూ, మూలంలోని పురుష పూర్వీకుల సూచనను ‘పితరులు’ నిలుపుతుంది.
- source_word: מוֹלַדְתֶּךָ
  choice: నీ స్వజనుల దగ్గరికి
  rationale: ఈ పదం బంధువర్గాన్ని లేదా జన్మస్థలం/స్వదేశాన్ని సూచించగలదు. ఇక్కడ ‘పితరుల దేశం’తో కలిసి రావడం వల్ల బంధుత్వ భావాన్ని ప్రధాన పాఠ్యంలో ఎంచుకున్నాం; పదంలోని భౌగోళిక సాధ్యతను పాదసూచికలో నిలిపాం.
- source_word: וְאֶהְיֶה עִמָּךְ
  choice: నేను నీకు తోడుగా ఉంటాను
  rationale: దైవసన్నిధి మరియు సహవాసం గురించిన వాగ్దానాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠ్యంలో సాధారణ బిరుదు కాకుండా చతురక్షర దైవనామమే ఉంది. అందువల్ల బిరుదుతో భర్తీ చేయకుండా వ్యక్తిగత నామాన్ని లిప్యంతరీకరించాం.
- issue: וְאֶהְיֶה עִמָּךְ లోని దైవసన్నిధి వాగ్దానం
  choice: నేను నీకు తోడుగా ఉంటాను
  alternative: నేను నీతో ఉంటాను
  rationale: రెండు రూపాలూ సాధ్యమే. ‘తోడుగా’ అనేది కేవలం స్థలసామీప్యానికి పరిమితం కాకుండా సహాయక సన్నిధి భావాన్ని సహజంగా అందిస్తుంది; అయినా మూలంలో అంతకంటే నిర్దిష్టమైన విధానం చెప్పబడలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన దైవవాక్య శైలిని వాడాం. ‘పితరులు’ మూలంలోని కుటుంబ-పూర్వీకుల పదప్రయోగాన్ని నిలుపుతుంది; ‘స్వజనులు’ సాధారణ పాఠకులకు అర్థమయ్యేలా ఉండి మוֹלֶדֶת పదంలోని బంధుత్వ భావాన్ని అందిస్తుంది.
