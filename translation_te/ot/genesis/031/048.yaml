  yaml_path: translation/ot/genesis/031/048.yaml
  text: And Laban said[a], “This heap is a witness between me and you today.” Therefore he called its name Galeed.
translation:
  language: te
  text: 'లాబాను ఇలా అన్నాడు: “ఈ రాళ్లకుప్ప ఈ రోజు నాకూ నీకూ మధ్య సాక్షిగా ఉంది.” అందుకే దానికి గలేద్[a] అని పేరు పెట్టాడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “గలేద్” అనే పేరు హీబ్రూలో “సాక్ష్యపు కుప్ప” అని అర్థమవుతుంది.
    reason: పేరులోని హీబ్రూ పదప్రయోగం తెలుగు లిప్యంతరీకరణలో స్పష్టంగా కనిపించదు.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అని చెప్పాడు
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది; తెలుగులో సహజమైన ప్రత్యక్ష వాక్య నిర్మాణంలో ‘అని చెప్పాడు’ క్రమాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: לָבָן
  choice: లాబాను
  rationale: వ్యక్తి పేరును ఆధునిక ప్రామాణిక తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: הַגַּל הַזֶּה
  choice: ఈ రాళ్లకుప్ప
  rationale: గల్ అంటే ‘కుప్ప’; సందర్భంలో అది రాళ్లతో చేసిన కుప్ప కావడంతో ‘రాళ్లకుప్ప’ సాధారణ పాఠకునికి స్పష్టంగా ఉంటుంది.
- source_word: עֵד
  choice: సాక్షిగా
  rationale: ఈ రాళ్లకుప్ప రెండు పక్షాల మధ్య ఒప్పందానికి సాక్ష్యసూచకంగా పనిచేస్తుంది; తెలుగు వాక్యంలో ‘సాక్షిగా ఉంది’ సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: בֵּינִי וּבֵינְךָ
  choice: నాకు నీకు మధ్య
  rationale: హీబ్రూలో రెండు పక్షాలూ ఏకవచనంగా, ప్రత్యక్షంగా పేర్కొనబడ్డాయి; ‘మన మధ్య’ అని సంక్షిప్తం చేయకుండా అదే ప్రత్యక్షతను నిలిపాం.
- source_word: הַיּוֹם
  choice: ఈ రోజు
  rationale: కాలసూచక పదానికి సహజమైన ఆధునిక తెలుగు సమానం.
- source_word: עַל כֵּן
  choice: అందుకే
  rationale: పేరుపెట్టడానికి ముందున్న కారణాన్ని సహజంగా, సంక్షిప్తంగా అనుసంధానిస్తుంది.
- source_word: קָרָא שְׁמוֹ
  choice: దానికి ... అని పేరు పెట్టాడు
  rationale: హీబ్రూ పేరుపెట్టే సూత్రంలోని 3వ పురుష ఏకవచన క్రియను నిలుపుతూ తెలుగులో సహజమైన క్రియాశీల నిర్మాణాన్ని వాడాం; ‘దానికి’ అనేది రాళ్లకుప్పను సూచిస్తుంది.
- source_word: גַּלְעֵד
  choice: గలేద్
  rationale: స్థలనామాన్ని అనువదించకుండా లిప్యంతరీకరించాం; దాని పదప్రయోగాన్ని పాదటిప్పణిలో వివరించాం.
