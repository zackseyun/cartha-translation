  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/עַתָּ֗ה לְכָ֛/ה נִכְרְתָ֥ה בְרִ֖ית אֲנִ֣י וָ/אָ֑תָּה וְ/הָיָ֥ה לְ/עֵ֖ד בֵּינִ֥/י וּ/בֵינֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/044.yaml
  text: So now[a], come, let us make a covenant, you and I, and let it be a witness between me and you.
translation:
  language: te
  text: ఇప్పుడు అయితే, రా; నువ్వూ నేనూ ఒక నిబంధన చేసుకుందాం[a]. అది నీకూ నాకూ మధ్య సాక్షిగా ఉండాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “నిబంధనను కోద్దాం.” ఇది నిబంధన చేయడం లేదా స్థాపించడం అనే అర్థమిచ్చే హీబ్రూ నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: కాబట్టి ఇప్పుడు
  rationale: సంభాషణలో తదుపరి చర్యకు మార్పును సూచించే సంధాన భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: לְכָה
  choice: రా
  rationale: הלך మూలానికి అక్షరార్థంగా ‘వెళ్లు’ అనే భావం ఉన్నా, ఇక్కడ ఆజ్ఞారూపం ఆహ్వానం లేదా పిలుపుగా వాడబడింది; అందువల్ల ‘రా’ సందర్భోచితం.
- source_word: נִכְרְתָה בְרִית
  choice: ఒక నిబంధన చేసుకుందాం
  rationale: כרת + ברית అనే హీబ్రూ నుడికారం అక్షరార్థంగా ‘నిబంధనను కోయడం’; తెలుగులో దాని ఉద్దేశార్థాన్ని సహజంగా ‘నిబంధన చేసుకోవడం’ అని తెలిపి, అక్షరార్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: בְרִית
  choice: నిబంధన
  rationale: ఇది సాధారణ ఒప్పందం కంటే అధికారికమైన పరస్పర బంధాన్ని సూచిస్తుంది; బైబిలు సందర్భంలో స్థిరమైన, భావభరితమైన పదం.
- source_word: אֲנִי וָאָתָּה
  choice: నువ్వూ నేనూ
  rationale: రెండు పక్షాలనూ స్పష్టంగా పేర్కొనే మూలపాఠంలోని ద్వైపాక్షిక ఉద్ఘాటనను సహజ తెలుగు క్రమంలో నిలుపుతుంది.
- source_word: וְהָיָה לְעֵד
  choice: అది ... సాక్షిగా ఉండాలి
  rationale: ముందున్న పరస్పర ఆహ్వానానికి అనుగుణంగా וְהָיָהను కేవలం భవిష్యదర్థంగా కాక సంకల్పార్థకంగా చూపుతుంది; לְעֵד కార్యాన్ని ‘సాక్షిగా’ స్పష్టం చేస్తుంది.
- source_word: בֵּינִי וּבֵינֶךָ
  choice: నీకూ నాకూ మధ్య
  rationale: మూలంలోని వ్యక్తిగత, పరస్పర సంబంధాన్ని సంక్షిప్తం చేయకుండా తెలుగులో సహజంగా నిలుపుతుంది.
theological_decisions:
- issue: ‘సాక్షి’గా ఉండేది దేనిని సూచిస్తుంది?
  choice: ‘అది’ అనే సర్వనామంతో మూలపాఠపు సూచనాస్పష్టతను నిలుపడం
  alternative: ‘ఈ నిబంధన సాక్షిగా ఉండాలి’ అని స్పష్టీకరించడం
  rationale: హీబ్రూలో కర్తను పేరుతో మళ్లీ పేర్కొనలేదు; అది నిబంధనను లేదా దాని ఏర్పాటును సూచించవచ్చు. అనువాదంలో దాన్ని మరీ నిర్దిష్టంగా నిర్ణయించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన సంభాషణ శైలిని వాడాం. లాబాను యాకోబుతో ఏకవచనంలో మాట్లాడుతున్నందున ‘రా’, ‘నువ్వూ’, ‘నీకూ’ రూపాలు సందర్భానికి తగినవి. పాదసూచిక గుర్తు ప్రధాన పాఠంలో ఉంచబడింది.
