  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אֵלַ֜/י מַלְאַ֧ךְ הָ/אֱלֹהִ֛ים בַּ/חֲל֖וֹם יַֽעֲקֹ֑ב וָ/אֹמַ֖ר הִנֵּֽנִ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/011.yaml
  text: Then the angel of God said to me in the dream[a], ‘Jacob,’ and I said, ‘Here I am.’
translation:
  language: te
  text: అప్పుడు దేవుని దూత ఆ కలలో[a] నాతో, “యాకోబూ!” అన్నాడు. అందుకు నేను, “ఇదిగో, నేనున్నాను” అన్నాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఒక కలలో.” హీబ్రూ పాఠంలో అక్షరార్థంగా “ఆ కలలో” అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... అన్నాడు
  rationale: వయ్యిక్తోల్ కథన క్రమాన్ని ముందుకు నడిపిస్తుంది; ‘అప్పుడు’ ఆ వరుసను సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: אֵלַי
  choice: నాతో
  rationale: దేవదూత పలికిన మాటకు లక్ష్యమైన మొదటి పురుష ఏకవచనాన్ని సహజమైన తెలుగు ప్రయోగంతో వ్యక్తం చేస్తుంది.
- source_word: מַלְאַךְ הָאֱלֹהִים
  choice: దేవుని దూత
  rationale: מַלְאָךְ కు ‘దూత’ అనే అర్థాన్ని నిలుపుతూ, ఈ సందర్భంలోని పరలోక దూతను సహజంగా సూచిస్తుంది; దేవునితో ఆ దూతకున్న సంబంధాన్ని అంతకుమించి నిర్వచించదు.
- source_word: בַּחֲלוֹם
  choice: ఆ కలలో
  rationale: హీబ్రూలో ఉన్న నిర్దిష్ట ఉపపదాన్ని ‘ఆ’ ద్వారా ప్రతిబింబిస్తుంది; సందర్భంలో ముందుగా ప్రస్తావించిన కలను సూచించగలదు.
- source_word: יַעֲקֹב
  choice: యాకోబూ
  rationale: పేరును ప్రామాణిక తెలుగు రూపంలో ఇచ్చి, ప్రత్యక్ష సంబోధనను ‘ఊ’తో సహజంగా చూపిస్తుంది.
- source_word: וָאֹמַר
  choice: అందుకు నేను ... అన్నాను
  rationale: ప్రతిస్పందన సంబంధాన్ని సహజమైన తెలుగులో స్పష్టం చేస్తూ మొదటి పురుష కథన రూపాన్ని నిలుపుతుంది.
- source_word: הִנֵּנִי
  choice: ఇదిగో, నేనున్నాను
  rationale: హీబ్రూ స్వీయ-సమర్పణ/సిద్ధత ప్రతిస్పందన సూత్రంలోని ‘ఇదిగో’ భావాన్నీ, సహజమైన తెలుగు స్పందననూ నిలుపుతుంది.
theological_decisions:
- issue: దైవంతో గుర్తింపు గురించి ప్రశ్నలు తలెత్తగల సందర్భంలో מַלְאַךְ הָאֱלֹהִים అనువాదం
  choice: దేవుని దూత
  alternative: దేవుని సందేశవాహకుడు
  rationale: వచనం ఆ వ్యక్తిని ‘దేవుని దూత’ అని మాత్రమే పేర్కొంటుంది. అతని గుర్తింపుపై విస్తృతమైన దైవశాస్త్ర ప్రశ్నలను తీర్చకుండా మూలంలోని ఉద్వేగాన్ని అలాగే ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సహజంగా, గౌరవప్రదంగా ఉండే కథన శైలి. ప్రత్యక్ష సంభాషణలో సంబోధనను సహజ తెలుగు రూపంలో ఇచ్చాం.
