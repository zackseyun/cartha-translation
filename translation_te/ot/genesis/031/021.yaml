  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּבְרַ֥ח הוּא֙ וְ/כָל אֲשֶׁר ל֔/וֹ וַ/יָּ֖קָם וַ/יַּעֲבֹ֣ר אֶת הַ/נָּהָ֑ר וַ/יָּ֥שֶׂם אֶת פָּנָ֖י/ו הַ֥ר הַ/גִּלְעָֽד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/021.yaml
  text: So he fled with all that was his[a], and he arose and crossed the River, and set his face toward the hill country of Gilead.
translation:
  language: te
  text: అప్పుడు అతడు తనకు చెందిన సమస్తంతో పారిపోయాడు. అతడు లేచి, నదిని[a] దాటి, తన ముఖాన్ని గిలాదు పర్వత ప్రాంతం వైపు తిప్పాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో కేవలం ‘నది’ అని ఉంది; ఇది బహుశా యూఫ్రటీసు నదిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבְרַח
  choice: పారిపోయాడు
  rationale: ఈ క్రియ ఒత్తిడి లేదా ప్రమాదం మధ్య తప్పించుకొని వెళ్లడాన్ని సూచిస్తుంది; కథన సందర్భంలో ‘పారిపోయాడు’ సహజంగా, ఖచ్చితంగా ఉంది.
- source_word: וְכָל אֲשֶׁר לוֹ
  choice: తనకు చెందిన సమస్తంతో
  rationale: ఈ విస్తృత పదబంధం యాకోబుకు చెందిన కుటుంబ సభ్యులు, సేవకులు, పశువులు, ఆస్తి అన్నిటినీ ఒకే వర్గానికి పరిమితం చేయకుండా కలుపుతుంది.
- source_word: וַיָּקָם
  choice: అతడు లేచి
  rationale: కొత్త చర్య మొదలైనట్లు తెలిపే హీబ్రూ కథన క్రమాన్ని నిలుపుతుంది; ‘బయలుదేరి’ అని అర్థాన్ని విస్తరించదు.
- source_word: וַיַּעֲבֹר אֶת־הַנָּהָר
  choice: నదిని దాటి
  rationale: עבר యొక్క ప్రాథమిక అర్థమైన దాటడాన్ని నేరుగా తెలియజేస్తుంది. ఏ నదో ప్రధాన పాఠ్యంలో స్పష్టంగా పేర్కొనకుండా మూలంలోని రూపాన్ని కాపాడుతుంది.
- source_word: הַנָּהָר
  choice: నది
  rationale: హీబ్రూలో నిర్దిష్ట నది ఉద్దేశించబడింది; సందర్భంలో అది యూఫ్రటీసు కావచ్చు. అయినా మూలపాఠ్యం పేరు చెప్పనందున ప్రధాన పాఠ్యంలో ‘నది’ అని ఉంచి, సాధ్యమైన గుర్తింపును పాదసూచికలో ఇచ్చాం.
- source_word: וַיָּשֶׂם אֶת־פָּנָיו
  choice: తన ముఖం తిప్పాడు
  rationale: ఒక దిశవైపు ఉద్దేశపూర్వకంగా సాగడాన్ని తెలిపే హీబ్రూ నుడికారంలోని ‘ముఖం’ రూపకాన్ని సహజమైన తెలుగులో కొంతవరకు నిలుపుతుంది.
- source_word: הַר הַגִּלְעָד
  choice: గిలాదు పర్వత ప్రాంతం
  rationale: הַר ఇక్కడ ఒకే శిఖరాన్ని కాక కొండలు లేదా పర్వతాలతో కూడిన ప్రాంతాన్ని సూచించగలదు; భౌగోళిక సందర్భానికి ‘పర్వత ప్రాంతం’ సరిపోతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథన శైలి వాడబడింది. హీబ్రూ వాక్యక్రమంలోని వరుస చర్యలను కాపాడుతూ, తెలుగులో సహజంగా ఉండేందుకు వాక్యాన్ని రెండు భాగాలుగా ఇచ్చాం.
