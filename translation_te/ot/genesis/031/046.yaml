translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. ఆజ్ఞను బహువచన గౌరవ/సామాన్య రూపంలో ఇచ్చాం; మూలంలోని సంబంధపదం మరియు స్థలసూచక విభక్తిలోని నిజమైన అర్థవిస్తృతిని పాదసూచికల్లో భద్రపరిచాం.
