  text: וַ/יֹּ֨אמֶר יַעֲקֹ֤ב לְ/אֶחָי/ו֙ לִקְט֣וּ אֲבָנִ֔ים וַ/יִּקְח֥וּ אֲבָנִ֖ים וַ/יַּֽעֲשׂוּ גָ֑ל וַ/יֹּ֥אכְלוּ שָׁ֖ם עַל הַ/גָּֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/046.yaml
  text: Then Jacob said to his brothers[a], “Gather stones.” So they took stones and made a heap[b], and they ate there by the heap.
translation:
  language: te
  text: అప్పుడు యాకోబు తన సహోదరులకు[a], “రాళ్లు ఏరండి” అని చెప్పాడు. వారు రాళ్లను తీసుకొని ఒక కుప్ప చేశారు. అక్కడ ఆ కుప్ప దగ్గర[b] వారు తిన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “సహోదరులు” అనే మాట ఇక్కడ యాకోబు సొంత అన్నదమ్ములను మాత్రమే కాక, అతనితో ఉన్న పురుష బంధువులను లేదా సహచరులను కూడా సూచించవచ్చు.
    reason: cultural_note
  - marker: b
    text: లేదా “ఆ కుప్ప మీద.” హీబ్రూ పదానికి మరింత సూటి అర్థం “మీద.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לְאֶחָיו
  choice: తన సహోదరులతో
  rationale: אָח అనే పదానికి ప్రాథమిక అర్థం ‘సహోదరుడు’; అయితే సందర్భానుసారం బంధువులు లేదా సహచరులైన పురుషులను కూడా సూచించవచ్చు. మూలానికి సమీపమైన పదాన్ని ప్రధాన వాక్యంలో ఉంచి, విస్తృత అర్థాన్ని పాదసూచికలో తెలిపాం.
- source_word: לִקְטוּ אֲבָנִים
  choice: రాళ్లు పోగుచేయండి
  rationale: לקט అనేది చెల్లాచెదురుగా ఉన్నవాటిని ఏరి సమకూర్చడాన్ని సూచిస్తుంది; ‘పోగుచేయండి’ ఆధునిక తెలుగులో సహజమైన ఆజ్ఞారూపం.
- source_word: וַיִּקְחוּ אֲבָנִים
  choice: వారు రాళ్లు తీసుకొని
  rationale: לקח యొక్క సాధారణ భావమైన ‘తీసుకొను’ను నేరుగా, సహజంగా అనువదించాం.
- source_word: וַיַּעֲשׂוּ גָל
  choice: ఒక కుప్పగా పేర్చారు
  rationale: גַּל ఇక్కడ రాళ్ల కుప్పను సూచిస్తుంది. తెలుగులో ‘కుప్పగా పేర్చారు’ అనడం రాళ్లతో నిర్మించిన గుర్తును స్పష్టంగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: וַיֹּאכְלוּ שָׁם עַל הַגָּל
  choice: ఆ కుప్ప దగ్గర వారు భోజనం చేశారు
  rationale: עַל పదానికి ‘మీద’ అనే సూటి అర్థంతో పాటు సందర్భానుసారం ‘దగ్గర/పక్కన’ అనే సంబంధార్థం ఉండవచ్చు. దృశ్యానికి సహజమైన ‘దగ్గర’ను పాఠ్యంలో ఉంచి, సూటి ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలిపాం.
