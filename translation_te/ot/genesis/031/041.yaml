source:
  edition: WLC
  text: זֶה לִּ֞/י עֶשְׂרִ֣ים שָׁנָה֮ בְּ/בֵיתֶ/ךָ֒ עֲבַדְתִּ֜י/ךָ אַרְבַּֽע עֶשְׂרֵ֤ה שָׁנָה֙ בִּ/שְׁתֵּ֣י בְנֹתֶ֔י/ךָ וְ/שֵׁ֥שׁ שָׁנִ֖ים בְּ/צֹאנֶ֑/ךָ וַ/תַּחֲלֵ֥ף אֶת מַשְׂכֻּרְתִּ֖/י עֲשֶׂ֥רֶת מֹנִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/041.yaml
  text: 'These twenty years I have been in your house: I served you fourteen years for your two daughters[a], and six years for your flock, and you changed my wages ten times.'
translation:
  language: te
  text: ఇదిగో, నేను నీ ఇంట్లో ఇరవై సంవత్సరాలు ఉన్నాను. నీ ఇద్దరు కుమార్తెల కోసం పద్నాలుగు సంవత్సరాలు, నీ మంద కోసం ఆరు సంవత్సరాలు నీకు సేవ చేశాను. నువ్వు నా జీతాన్ని పదిసార్లు మార్చావు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זֶה לִּי עֶשְׂרִים שָׁנָה בְּבֵיתֶךָ
  choice: ఇలా నేను నీ ఇంట్లో గడిపినది ఇరవై సంవత్సరాలు
  rationale: హీబ్రూ వాక్యారంభంలోని సూచనాత్మకమైన זֶה, మొదటి పురుష దత్తార్థక לִי, కాలవ్యవధి, అలాగే בְּבֵיתֶךָ అనే ‘నీ ఇంట్లో’ భావాలను సహజమైన తెలుగు వాక్యంగా వ్యక్తం చేస్తుంది.
- source_word: עֲבַדְתִּיךָ
  choice: నీకు సేవ చేశాను
  rationale: עבד ఇక్కడ లాబానుకు చేసిన శ్రమతో కూడిన సేవను సూచిస్తుంది; ‘సేవ చేశాను’ సంబంధపరమైన, శ్రమపరమైన రెండు పార్శ్వాలనూ నిలుపుతుంది.
- source_word: אַרְבַּע עֶשְׂרֵה שָׁנָה בִּשְׁתֵּי בְנֹתֶיךָ
  choice: నీ ఇద్దరు కుమార్తెల కోసం పద్నాలుగు సంవత్సరాలు
  rationale: ఇక్కడ בְּ సేవకు ప్రతిఫలంగా లేదా దృష్టిగా ఉన్న వారిని సూచిస్తుంది. వివాహసేవ నేపథ్యాన్ని అదనంగా వివరించకుండా ‘కోసం’ సహజంగా తెలియజేస్తుంది.
- source_word: וְשֵׁשׁ שָׁנִים בְּצֹאנֶךָ
  choice: నీ మంద కోసం ఆరు సంవత్సరాలు
  rationale: צֹאן గొర్రెలు, మేకలు కలిసిన చిన్న పశువుల సమూహాన్ని సూచించగలదు; అందువల్ల విస్తృతార్థాన్ని నిలిపే ‘మంద’ను ఎంచుకున్నాం.
- source_word: וַתַּחֲלֵף אֶת מַשְׂכֻּרְתִּי
  choice: నువ్వు నా జీతాన్ని మార్చావు
  rationale: Hiphil రూపంలోని חלף ‘మార్చడం/బదలాయించడం’ అని, מַשְׂכֹּרֶת శ్రమకు లభించే జీతమని నేరుగా తెలియజేస్తాయి.
- source_word: עֲשֶׂרֶת מֹנִים
  choice: పదిసార్లు
  rationale: ఈ హీబ్రూ ప్రయోగం పునరావృత మార్పును సూచించే నుడికారం; అక్షరార్థమైన ‘పది లెక్కలు’ తెలుగులో అస్పష్టంగా ఉంటుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, కుటుంబ సంభాషణకు తగిన నేరమైన ‘నీ/నువ్వు’ రూపాలతో, గంభీరతను కోల్పోకుండా సహజంగా అనువదించబడింది. మూలంలోని ఇరవై సంవత్సరాల విభజన, సేవ, జీతం మార్పు అన్నీ స్పష్టంగా నిలుపబడ్డాయి.
