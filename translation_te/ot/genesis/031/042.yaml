id: GEN.31.42
reference: Genesis 31:42
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: לוּלֵ֡י אֱלֹהֵ֣י אָבִ/י֩ אֱלֹהֵ֨י אַבְרָהָ֜ם וּ/פַ֤חַד יִצְחָק֙ הָ֣יָה לִ֔/י כִּ֥י עַתָּ֖ה רֵיקָ֣ם שִׁלַּחְתָּ֑/נִי אֶת עָנְיִ֞/י וְ/אֶת יְגִ֧יעַ כַּפַּ֛/י רָאָ֥ה אֱלֹהִ֖ים וַ/יּ֥וֹכַח אָֽמֶשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/042.yaml
  text: If the God of my father[a], the God of Abraham, and the Fear of Isaac, had not been with me, surely by now you would have sent me away empty-handed. God saw my affliction and the labor of my hands, and he judged last night.
translation:
  language: te
  text: “నా తండ్రి దేవుడు, అబ్రాహాము దేవుడు, ఇస్సాకు భయం[a] నాకు తోడుగా ఉండకపోయి ఉంటే, ఈపాటికి నువ్వు నన్ను వట్టి చేతులతో పంపివేసి ఉండేవాడివి. దేవుడు నా బాధను, నా చేతుల కష్టాన్ని చూశాడు; నిన్న రాత్రి తీర్పు చెప్పాడు.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఇస్సాకు భయపడే దేవుడు.” హీబ్రూలో అక్షరాలా “ఇస్సాకు భయం”; ఇది దేవునికి వాడిన విశిష్టమైన బిరుదు.
    reason: మూలంలోని అసాధారణ దైవబిరుదుకు సంభావ్య వివరణాత్మక అర్థాన్ని అందించడం.
lexical_decisions:
- source_word: לוּלֵי
  choice: ఉండకపోయి ఉంటే
  rationale: జరగని పరిస్థితిని సూచించే contrary-to-fact షరతును సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: אֱלֹהֵי אָבִי
  choice: నా తండ్రి దేవుడు
  rationale: హీబ్రూ సమాసాన్ని స్పష్టంగా ఉంచుతూ పితృపారంపర్య సంబంధాన్ని కాపాడుతుంది.
- source_word: אֱלֹהֵי אַבְרָהָם
  choice: అబ్రాహాము దేవుడు
  rationale: మూలంలోని సమాస పదబంధానికి సూటిగా, సహజంగా సరిపోతుంది.
- source_word: וּפַחַד יִצְחָק
  choice: ఇస్సాకు భయం
  rationale: దేవునికి వాడిన అసాధారణ హీబ్రూ బిరుదును వివరణాత్మకంగా మార్చకుండా ప్రధాన పాఠ్యంలో నిలుపుతుంది; అర్థవివరణను పాదసూచికలో ఇస్తుంది.
- source_word: הָיָה לִי
  choice: నాకు తోడుగా ఉండకపోయి ఉంటే
  rationale: ఈ సందర్భంలో దేవుని సన్నిధి, సహాయం అనే భావాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: כִּי עַתָּה
  choice: ఈపాటికి
  rationale: ఆ పరిస్థితి ఉంటే ఫలితం అప్పటికే జరిగిపోయేదనే కాలార్థాన్ని తెలియజేస్తుంది.
- source_word: רֵיקָם
  choice: వట్టి చేతులతో
  rationale: ఏమీ ఇవ్వకుండా పంపడాన్ని తెలిపే సహజమైన తెలుగు నుడికారం.
- source_word: שִׁלַּחְתָּנִי
  choice: నువ్వు నన్ను పంపివేసి ఉండేవాడివి
  rationale: జరగని షరతుకు తగిన సంభావ్య గత ఫలితాన్ని తెలుగులో స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: עָנְיִי
  choice: నా బాధను
  rationale: పేదరికానికే పరిమితం కాకుండా యాకోబు అనుభవించిన దుస్థితి, అణచివేతను విస్తృతంగా సూచిస్తుంది.
- source_word: יְגִיעַ כַּפַּי
  choice: నా చేతుల కష్టాన్ని
  rationale: శారీరక శ్రమతో కూడిన కఠినమైన పనిని తెలిపే హీబ్రూ నుడికారానికి సహజమైన తెలుగు సమానం.
- source_word: וַיּוֹכַח
  choice: తీర్పు చెప్పాడు
  rationale: יכח లోని న్యాయనిర్ణయం, గద్దింపు అనే రెండింటికీ చోటు ఉంచుతుంది; హీబ్రూలో ప్రత్యక్ష కర్మ లేకపోవడంతో ‘నిన్ను గద్దించాడు’ అని చేర్చదు.
- source_word: אָמֶשׁ
  choice: నిన్న రాత్రి
  rationale: లాబానుకు కలలో దేవుడు హెచ్చరించిన గత రాత్రిని సహజంగా సూచిస్తుంది.
theological_decisions:
- issue: וּפַחַד יִצְחָק అనే దైవబిరుదు
  choice: ఇస్సాకు భయం
  alternative: ఇస్సాకు భయపడే దేవుడు
  rationale: మూలంలోని అసాధారణమైన, అర్థసాంద్రతగల బిరుదును ప్రధాన పాఠ్యంలో నిలిపి, దాని సంభావ్య భావాన్ని పాదసూచికలో తెలియజేస్తుంది.
- issue: וַיּוֹכַח యొక్క సందర్భార్థం
  choice: తీర్పు చెప్పాడు
  alternative: గద్దించాడు; మన మధ్య తీర్పు తీర్చాడు
  rationale: లాబానుకు వచ్చిన దైవహెచ్చరికను సూచించినప్పటికీ, మూలంలోని క్రియ న్యాయనిర్ణయం లేదా గద్దింపును సూచించగలదు; ప్రత్యక్ష కర్మ కూడా లేదు. అందువల్ల ఒకే అర్థాన్ని బలవంతంగా నిర్ణయించని రూపాన్ని ఎంచుకుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథనశైలి. లాబానుతో యాకోబు నేరుగా మాట్లాడుతున్నందున ‘నువ్వు’ వాడబడింది. ‘ఇస్సాకు భయం’ అనే అసాధారణ బిరుదు ఉద్దేశపూర్వకంగా నిలుపబడింది; [a] సూచిక దానికి వెంటనే ఉంచబడింది.
