translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి. మూలంలోని స్వామ్యదావాల పునరుక్తిని ఉద్దేశపూర్వకంగా నిలిపి, వాక్య నిర్మాణాన్ని సాధారణ పాఠకులకు సహజంగా తీర్చిదిద్దాం. పాదసూచిక గుర్తును అది వివరిస్తున్న ‘పిల్లలకు’ అన్న పదం వద్ద ఉంచాం.
