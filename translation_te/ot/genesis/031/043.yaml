  text: וַ/יַּ֨עַן לָבָ֜ן וַ/יֹּ֣אמֶר אֶֽל יַעֲקֹ֗ב הַ/בָּנ֨וֹת בְּנֹתַ֜/י וְ/הַ/בָּנִ֤ים בָּנַ/י֙ וְ/הַ/צֹּ֣אן צֹאנִ֔/י וְ/כֹ֛ל אֲשֶׁר אַתָּ֥ה רֹאֶ֖ה לִ/י ה֑וּא וְ/לִ/בְנֹתַ֞/י מָֽה אֶֽעֱשֶׂ֤ה לָ/אֵ֨לֶּה֙ הַ/יּ֔וֹם א֥וֹ לִ/בְנֵי/הֶ֖ן אֲשֶׁ֥ר יָלָֽדוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/043.yaml
  text: Then Laban answered and said to Jacob[a], “The daughters are my daughters, and the sons are my sons, and the flock is my flock, and all that you see is mine. But what can I do this day for these my daughters, or for their children whom they have borne?”
translation:
  language: te
  text: 'అప్పుడు లాబాను యాకోబుకు జవాబిచ్చి ఇలా అన్నాడు: “కుమార్తెలు నా కుమార్తెలు, కుమారులు నా కుమారులు, మంద నా మంద; నువ్వు చూస్తున్నదంతా నాదే. అయితే ఈ రోజు నా ఈ కుమార్తెలకు గాని, వారు కన్న పిల్లలకు[a] గాని నేనేమి చేయగలను?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, בְּנֵיהֶן అనే పదాన్ని మగ సంతానానికే పరిమితంగా తీసుకుంటే, “వారు కన్న కుమారులకు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן לָבָן וַיֹּאמֶר אֶל יַעֲקֹב
  choice: అప్పుడు లాబాను యాకోబుకు జవాబిస్తూ ... అన్నాడు
  rationale: ‘జవాబిచ్చి చెప్పాడు’ అనే కఠిన పునరుక్తికి బదులు, రెండు హీబ్రూ క్రియల భావాన్ని సహజమైన ఆధునిక తెలుగు కథన నిర్మాణంలో నిలిపింది.
- source_word: הַבָּנוֹת בְּנֹתַי
  choice: ఈ కుమార్తెలు నా కుమార్తెలు
  rationale: నామవాచక పునరుక్తిని ఉంచి, లాబాను చేస్తున్న బంధుత్వపరమైన బలమైన హక్కుదావాను ప్రతిబింబిస్తుంది.
- source_word: וְהַבָּנִים בָּנַי
  choice: ఈ కుమారులు నా కుమారులు
  rationale: ఇక్కడి పురుష బహువచనాన్ని విస్తృతమైన ‘పిల్లలు’గా మార్చకుండా ‘కుమారులు’గా అనువదించింది.
- source_word: וְהַצֹּאן צֹאנִי
  choice: ఈ మంద నా మంద
  rationale: צֹאן సూచించే చిన్న పశువుల సమూహార్థాన్ని సహజమైన సామూహిక పదమైన ‘మంద’తో అందించింది.
- source_word: וְכֹל אֲשֶׁר אַתָּה רֹאֶה לִי הוּא
  choice: నువ్వు చూస్తున్నదంతా నాదే
  rationale: సంక్షిప్తమైన స్వామ్య ప్రకటనను, దాని బలమైన వ్యక్తిగత దావాతో సహా నిలిపింది.
- source_word: מָה אֶעֱשֶׂה ... הַיּוֹם
  choice: ఈ రోజు ... నేనేమి చేయగలను?
  rationale: అసంపూర్ణ క్రియలోని సందర్భానుగుణ సాధ్యతను అలంకారప్రశ్నగా సహజంగా వ్యక్తపరుస్తుంది.
- source_word: אוֹ לִבְנֵיהֶן אֲשֶׁר יָלָדוּ
  choice: వారు కన్న పిల్లలకు[a] గాని
  rationale: בְּנֵיהֶן ఇక్కడ సంతానాన్ని సాధారణంగా సూచించగలదు; ילד క్రియలోని మాతృప్రసవ భావాన్ని ‘కన్న’ నిలుపుతుంది.
