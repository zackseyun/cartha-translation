translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడబడింది. హీబ్రూ నుడికారాన్ని ప్రధాన పాఠంలో అర్థానుసారంగా అనువదించి, దాని అక్షర రూపాన్ని పాదటిప్పణిలో భద్రపరచాం.
