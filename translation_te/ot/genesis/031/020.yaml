  text: And Jacob deceived Laban the Aramean by not telling him that he was fleeing[a].
translation:
  language: te
  text: యాకోబు తాను పారిపోతున్నాడని అరామీయుడైన లాబానుకు చెప్పకుండా అతణ్ణి మోసగించాడు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “యాకోబు అరామీయుడైన లాబాను హృదయాన్ని దొంగిలించాడు.” ఇది అతణ్ణి మోసగించడం లేదా అతనికి తెలియకుండా వ్యవహరించడం అనే అర్థమిచ్చే హీబ్రూ నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְנֹב ... אֶת לֵב
  choice: మోసగించాడు
  rationale: “హృదయాన్ని దొంగిలించాడు” అనే అక్షరార్థం తెలుగులో ప్రేమను గెలుచుకున్నాడనే తప్పుదారి పట్టించే భావాన్ని కలిగించవచ్చు. ఇక్కడి హీబ్రూ నుడికారం లాబానుకు తెలియకుండా రహస్యంగా వ్యవహరించి అతణ్ణి మోసగించడాన్ని సూచిస్తుంది.
- source_word: הָאֲרַמִּי
  choice: అరామీయుడైన
  rationale: హీబ్రూ జాతి/ప్రాంత సూచనను నేరుగా, చారిత్రకంగా ఖచ్చితంగా వ్యక్తం చేస్తుంది.
- source_word: עַל בְּלִי הִגִּיד לוֹ
  choice: చెప్పకుండా
  rationale: యాకోబు లాబానును ఎలా మోసగించాడో తెలిపే సాధనార్థక భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: כִּי בֹרֵחַ הוּא
  choice: తాను పారిపోతున్నానని
  rationale: వర్తమాన కృదంతంలోని కొనసాగుతున్న లేదా తక్షణ చర్య భావాన్ని నిలుపుతుంది; పరోక్ష వాక్యంలో కర్త యాకోబేనని స్పష్టం చేస్తుంది.
