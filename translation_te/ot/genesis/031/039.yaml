  text: טְרֵפָה֙ לֹא הֵבֵ֣אתִי אֵלֶ֔י/ךָ אָנֹכִ֣י אֲחַטֶּ֔/נָּה מִ/יָּדִ֖/י תְּבַקְשֶׁ֑/נָּה גְּנֻֽבְתִ֣י י֔וֹם וּ/גְנֻֽבְתִ֖י לָֽיְלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/039.yaml
  text: I did not bring to you an animal torn by beasts[a]; I myself bore the loss of it. You required it from my hand[b], whether stolen by day or stolen by night.
translation:
  language: te
  text: అడవి మృగాలు చీల్చివేసిన పశువును నేను నీ దగ్గరకు తీసుకురాలేదు; దాని నష్టాన్ని నేనే భరించాను.[a] పగలు దొంగిలించబడినదానినీ, రాత్రి దొంగిలించబడినదానినీ నువ్వు నా చేతినుంచి వసూలు చేసేవాడివి.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దానికి నేనే పరిహారం చెల్లించాను’ లేదా ‘దాని నష్టాన్ని నేనే భర్తీ చేశాను.’ ఇక్కడి హీబ్రూ క్రియ, పోయిన పశువుకు బాధ్యత వహించి ఆ నష్టాన్ని భర్తీచేయడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ వాక్యంలో అక్షరార్థంగా, ‘నా చేతినుంచి దాన్ని కోరేవాడివి.’ ఇది యాకోబునే ఆ నష్టానికి బాధ్యునిగా చేసి అతని నుంచి పరిహారం కోరడాన్ని సూచించే నుడికారం.
    reason: idiom
lexical_decisions:
- source_word: טְרֵפָה
  choice: క్రూరమృగాలు చీల్చి చంపిన పశువు
  rationale: ఈ పశుపోషణ సందర్భంలో అడవి మృగం దాడిచేసి చంపిన మందలోని జంతువును సూచిస్తుంది. తెలుగు పాఠకునికి భావం స్పష్టంగా ఉండేలా పశువును ప్రత్యక్షంగా పేర్కొంటూనే మూలంలోని దృశ్యాన్ని నిలిపింది.
- source_word: הֵבֵאתִי אֵלֶיךָ
  choice: నేను నీ దగ్గరకు తీసుకురాలేదు
  rationale: ביא + אל అనే నిర్మాణం ఒకదాన్ని ఎవరి దగ్గరికైనా తీసుకురావడాన్ని సూచిస్తుంది; దాని కర్మను ముందున్న ‘చీల్చి చంపిన పశువు’ అందిస్తుంది.
- source_word: אָנֹכִי
  choice: నేనే
  rationale: స్వతంత్ర సర్వనామంలోని ఉద్ఘాటనను సహజమైన ఆధునిక తెలుగులో ‘నేనే’ నిలుపుతుంది.
- source_word: אֲחַטֶּנָּה
  choice: దాని నష్టాన్ని భరించాను
  rationale: ఇక్కడ חטא పియేల్ రూపం తప్పుచేయడం అనే సాధారణ అర్థంలో కాక, పోయిన పశువుకు బాధ్యత వహించి నష్టాన్ని తానే భర్తీచేయడం అనే భావంలో ఉంది.
- source_word: מִיָּדִי תְּבַקְשֶׁנָּה
  choice: నా చేతినుంచే వసూలు చేసేవాడివి
  rationale: בקשׁ + מידי బాధ్యతగల వ్యక్తినుంచి పరిహారం కోరడం లేదా వసూలు చేయడం అనే భావాన్ని ఇస్తుంది. ‘నా చేతినుంచే’ మూలంలోని బాధ్యతా నుడికారాన్ని, אָנֹכִיతో సరిపోలే ఉద్ఘాటనను నిలుపుతుంది.
- source_word: גְּנֻבְתִי יוֹם וּגְנֻבְתִי לָיְלָה
  choice: పగలు దొంగిలించబడినదానినీ, రాత్రి దొంగిలించబడినదానినీ
  rationale: వావ్ సంధిని సంకలితంగా చూపి, పగటి దొంగతనం మరియు రాత్రి దొంగతనం వల్ల కలిగిన నష్టాలన్నిటినీ లాబాను యాకోబు నుంచి వసూలు చేశాడనే భావాన్ని స్పష్టం చేస్తుంది.
