translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి వాడబడింది. యాకోబు తన దీర్ఘకాల సేవను నేరుగా సమర్థించుకుంటున్నందున ఏకవచన సంబోధనను, గతంలో పదేపదే జరిగిన చర్యను తెలియజేయడానికి ‘వసూలు చేసేవాడివి’ రూపాన్ని ఎంచుకున్నాం.
