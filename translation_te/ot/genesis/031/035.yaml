source:
  edition: WLC
  text: וַ/תֹּ֣אמֶר אֶל אָבִ֗י/הָ אַל יִ֨חַר֙ בְּ/עֵינֵ֣י אֲדֹנִ֔/י כִּ֣י ל֤וֹא אוּכַל֙ לָ/ק֣וּם מִ/פָּנֶ֔י/ךָ כִּי דֶ֥רֶךְ נָשִׁ֖ים לִ֑/י וַ/יְחַפֵּ֕שׂ וְ/לֹ֥א מָצָ֖א אֶת הַ/תְּרָפִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/035.yaml
  text: And she said to her father[a], “Let not my lord be angry in my sight that I cannot rise before you, for the way of women is upon me.” So he searched[b], but did not find the household idols.
translation:
  language: te
  text: ఆమె తన తండ్రితో, “నేను మీ ఎదుట లేవలేకపోతున్నాను గనుక, నా ప్రభువు నాపై కోపపడకూడదు; స్త్రీలకు వచ్చే కాలం నాకు వచ్చింది” అంది. అతడు వెదికాడు, కాని ఇంట్లో ఉంచుకునే ఆరాధనా విగ్రహాలు[a] అతనికి దొరకలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ‘తెరాఫీము’; ఇంట్లో ఉంచుకునే ఆరాధనా ప్రతిమలు లేదా విగ్రహాలు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר אֶל־אָבִיהָ
  choice: ఆమె తన తండ్రితో ... అంది
  rationale: హీబ్రూ కథన ప్రవాహాన్ని సహజమైన ఆధునిక తెలుగు వాక్యక్రమంలో వ్యక్తపరుస్తూ, సంభాషణ ఎవరిని ఉద్దేశించిందో స్పష్టంగా ఉంచుతుంది.
- source_word: אַל־יִחַר בְּעֵינֵי אֲדֹנִי
  choice: నా ప్రభువు నాపై కోపపడకూడదు
  rationale: హీబ్రూ పదబంధం అక్షరార్థంగా ‘నా ప్రభువు కళ్లలో కోపం మండకూడదు’ అనే రూపంలో ఉన్నా, ఇది అసంతృప్తి లేదా కోపాన్ని తెలిపే నుడికారం. ‘నాపై కోపపడకూడదు’ సహజమైన తెలుగు; ‘నా ప్రభువు’ రాహేలు తన తండ్రిని గౌరవంగా సంబోధించిన తీరును నిలుపుతుంది, ఇది దైవసంబోధన కాదు.
- source_word: לֹא אוּכַל לָקוּם מִפָּנֶיךָ
  choice: నేను మీ సమక్షంలో లేచి నిలబడలేకపోతున్నందుకు
  rationale: קום యొక్క శారీరక భావాన్ని ‘లేచి నిలబడడం’గా, מִפָּנֶיךָ లోని సమక్షం మరియు గౌరవ సూచనను ‘మీ సమక్షంలో’గా తెలియజేస్తుంది.
- source_word: דֶרֶךְ נָשִׁים לִי
  choice: స్త్రీలకు కలిగే సహజధర్మం నాకు కలిగింది
  rationale: ఇది నెలసరిని సూచించే హీబ్రూ సభ్యోక్తి. మూలంలోని మర్యాదపూర్వక పరోక్షతను నిలుపుతూ ఆధునిక తెలుగు పాఠకులకు అర్థమయ్యేలా అనువదించబడింది.
- source_word: וַיְחַפֵּשׂ וְלֹא מָצָא
  choice: అతడు వెదికాడు, కాని ... అతనికి దొరకలేదు
  rationale: కర్తను సందర్భానుసారంగా స్పష్టం చేసి, వెదికినా దొరకని ఫలితాన్ని తెలుగులో సహజమైన వ్యతిరేక సముచ్చయంతో వ్యక్తపరుస్తుంది.
- source_word: הַתְּרָפִים
  choice: ఇంటి దేవతా విగ్రహాలు
  rationale: תְּרָפִים అనేది గృహ సంబంధమైన ఆరాధనా ప్రతిమలను సూచిస్తుంది. ‘ఇంటి దేవతా విగ్రహాలు’ వాటి గృహ నేపథ్యాన్నీ మతపరమైన స్వభావాన్నీ సాధారణ పాఠకులకు స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: תְּרָפִים పదానికి అనువాదం
  choice: ఇంటి దేవతా విగ్రహాలు
  alternative: తెరాఫీము; ఇంటి దేవతలు
  rationale: ఇవి గృహ ఆరాధనకు సంబంధించిన ప్రతిమలని మూలపదం సూచిస్తుంది. కేవలం లిప్యంతరీకరణ చేయకుండా వాటి స్వభావాన్ని తెలుగులో తెలియజేశాం; అయితే మూలపదాన్ని పాదటిప్పణిలో భద్రపరిచాం.
- issue: אֲדֹנִי అనే గౌరవ సంబోధన
  choice: నా ప్రభువు
  alternative: అయ్యా
  rationale: ఇక్కడ రాహేలు తన తండ్రిని గౌరవంగా సంబోధిస్తోంది; దేవుణ్ణి ఉద్దేశించడం లేదు. ‘నా ప్రభువు’ మూలంలోని అధిక గౌరవాన్ని నిలుపుతుంది, అయితే దీనికి దైవార్థం ఆపాదించరాదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన కథనశైలిని ఉపయోగించాం. రాహేలు మాటల్లో గౌరవపూర్వక సంబోధనను, నెలసరి గురించిన మూలంలోని సభ్యోక్తిని నిలిపాం. ‘ప్రభువు’ ఇక్కడ తండ్రికి చెప్పిన గౌరవ సంబోధన మాత్రమే.
