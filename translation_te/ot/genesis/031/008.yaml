id: GEN.31.8
reference: Genesis 31:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אִם כֹּ֣ה יֹאמַ֗ר נְקֻדִּים֙ יִהְיֶ֣ה שְׂכָרֶ֔/ךָ וְ/יָלְד֥וּ כָל הַ/צֹּ֖אן נְקֻדִּ֑ים וְ/אִם כֹּ֣ה יֹאמַ֗ר עֲקֻדִּים֙ יִהְיֶ֣ה שְׂכָרֶ֔/ךָ וְ/יָלְד֥וּ כָל הַ/צֹּ֖אן עֲקֻדִּֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/008.yaml
  text: If he said this, ‘The speckled will be your wages,’ then all the flock bore speckled young; and if he said this, ‘The streaked will be your wages,’ then all the flock bore streaked young.
translation:
  language: te
  text: అతడు, ‘మచ్చలున్నవి నీ జీతంగా ఉంటాయి’ అని చెబితే, మందలోని ఆడవన్నీ మచ్చలున్న పిల్లలను కన్నాయి; అతడు, ‘చారలున్నవి నీ జీతంగా ఉంటాయి’ అని చెబితే, మందలోని ఆడవన్నీ చారలున్న పిల్లలను కన్నాయి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נְקֻדִּים
  choice: మచ్చలున్నవి
  rationale: ఈ పదం పశువుల ఒంటిపై చుక్కలు లేదా మచ్చలు ఉండడాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో సహజంగా ‘మచ్చలున్నవి’ అని అనువదించాం.
- source_word: עֲקֻדִּים
  choice: చారలున్నవి
  rationale: ఈ సందర్భంలో పశువులపై పట్టీలు లేదా చారలు ఉండడాన్ని సూచిస్తుంది; ‘చారలున్నవి’ స్పష్టమైన, సాధారణ తెలుగు.
- source_word: שְׂכָרֶךָ
  choice: నీ జీతంగా
  rationale: యాకోబు పనికి ప్రతిఫలంగా పొందే పశువులను సూచించే పదం; ‘జీతం’ ఈ శ్రమ-ప్రతిఫల భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וְיָלְדוּ כָל־הַצֹּאן
  choice: మందలోని ఆడవన్నీ ... పిల్లలను కన్నాయి
  rationale: హీబ్రూలో ‘మంద అంతా కన్నది’ అనే సమష్టి వాక్యాన్ని తెలుగులో జీవశాస్త్రపరంగా, సహజంగా అర్థమయ్యేలా ఆడ పశువులను స్పష్టం చేశాం; ‘young’ అనే భావం క్రియాసందర్భంలో అంతర్భూతమైనందున ‘పిల్లలను’ చేర్చాం.
- source_word: אִם כֹּה יֹאמַר
  choice: అతడు ... అని చెబితే
  rationale: כֹּה ఉటంకించబోయే మాటను పరిచయం చేస్తుంది; తెలుగులో ప్రత్యేకంగా ‘ఇలా’ అనడం అవసరం లేకుండా ప్రత్యక్ష ఉటంకణ నిర్మాణం సహజంగా ఆ భావాన్ని అందిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, కథనానికి తగిన గౌరవప్రదమైన సరళ శైలి. రెండు షరతు వాక్యాల సమాంతర నిర్మాణాన్ని నిలిపి ఉంచాం; వ్యాఖ్యానాత్మక లేదా మతసాంప్రదాయ పదజాలం చేర్చలేదు.
