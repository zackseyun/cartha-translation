id: GEN.31.5
reference: Genesis 31:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר לָ/הֶ֗ן רֹאֶ֤ה אָנֹכִי֙ אֶת פְּנֵ֣י אֲבִי/כֶ֔ן כִּֽי אֵינֶ֥/נּוּ אֵלַ֖/י כִּ/תְמֹ֣ל שִׁלְשֹׁ֑ם וֵֽ/אלֹהֵ֣י אָבִ֔/י הָיָ֖ה עִמָּדִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/005.yaml
  text: And he said to them[a], “I see that your father's face is not toward me as before, but the God of my father has been with me.”
translation:
  language: te
  text: 'అతడు వారితో ఇలా అన్నాడు: “మీ తండ్రి ముఖం మునుపటిలా నా వైపు లేదని నేను గమనిస్తున్నాను[a]. అయితే నా తండ్రి దేవుడు నాకు తోడుగా ఉన్నాడు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “నిన్నా మొన్నటిలా నా వైపు లేదు”; ఇది “మునుపటిలా లేదు” అనే అర్థమిచ్చే హీబ్రూ నానుడి.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר לָהֶן
  choice: అతడు వారితో ఇలా అన్నాడు
  rationale: కథనంలోని wayyiqtol రూపాన్ని సహజమైన తెలుగు కథనశైలిలో అందించింది; לָהֶן స్త్రీల బహువచనాన్ని సూచించినా, సందర్భంలోని ‘వారితో’ తెలుగులో సహజంగా ఉంది.
- source_word: רֹאֶה אָנֹכִי
  choice: నేను గమనిస్తున్నాను
  rationale: కృదంతంతో కూడిన స్వతంత్ర సర్వనామం యాకోబు ప్రస్తుతం గ్రహిస్తున్న విషయాన్ని బలపరుస్తుంది; ‘గమనిస్తున్నాను’ అనేది ముఖభావం ద్వారా వైఖరిని తెలుసుకోవడాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: אֶת פְּנֵי אֲבִיכֶן
  choice: మీ తండ్రి ముఖం
  rationale: ‘ముఖం’ అనే హీబ్రూ దృశ్యరూపాన్ని నిలుపుతూ, తండ్రి వైఖరి మారిందనే భావాన్ని సందర్భం ద్వారా గ్రహించనిస్తుంది.
- source_word: כִּי אֵינֶנּוּ אֵלַי
  choice: నా వైపు లేదని
  rationale: ముఖం యాకోబు వైపు లేకపోవడం అనే స్థలసంబంధ రూపకాన్ని నిలుపుతుంది; ‘నాపట్ల అనుకూలంగా లేడు’ అని వ్యాఖ్యానాత్మకంగా విప్పలేదు.
- source_word: כִּתְמֹל שִׁלְשֹׁם
  choice: మునుపటిలా
  rationale: అక్షరార్థంగా ‘నిన్నా మొన్నటిలా’ అనే హీబ్రూ నానుడి గతంలో ఉన్న స్థితిని సూచిస్తుంది; ఆధునిక తెలుగులో ‘మునుపటిలా’ సహజ సమానార్థకం.
- source_word: וֵאלֹהֵי אָבִי
  choice: అయితే నా తండ్రి దేవుడు
  rationale: 'వావ్‌ను సందర్భానుసారమైన వ్యతిరేక సంబంధంతో ‘అయితే’గా ఇచ్చింది: లాబాను వైఖరి మారినా దేవుని తోడు కొనసాగింది. ‘నా తండ్రి దేవుడు’ హీబ్రూ నిర్మాణాన్ని దగ్గరగా అనుసరిస్తుంది.'
- source_word: הָיָה עִמָּדִי
  choice: నాకు తోడుగా ఉన్నాడు
  rationale: దేవుని సహవాసం మరియు సహాయాన్ని సహజమైన తెలుగు వ్యక్తీకరణలో తెలియజేస్తుంది; సందర్భంలో గతం నుంచి ప్రస్తుతానికి కొనసాగుతున్న తోడు స్పష్టంగా ఉంది.
theological_decisions:
- issue: אֱלֹהֵי אָבִי అనే దైవసూచన అనువాదం
  choice: నా తండ్రి దేవుడు
  alternative: నా తండ్రియొక్క దేవుడు
  rationale: ఎంచుకున్న రూపం హీబ్రూ సంబంధ నిర్మాణాన్ని, కుటుంబ-నిబంధన సూచనను నిలుపుతూ ఆధునిక తెలుగులో సహజంగా ఉంటుంది; అదనపు సిద్ధాంతార్థాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు స్పష్టమైన శైలి. ‘ముఖం నా వైపు లేదు’ అనే మూలభాష రూపకాన్ని నిలుపుతూ, నానుడి అర్థాన్ని ప్రధాన పాఠ్యంలో సహజంగా ఇచ్చి అక్షరార్థాన్ని పాదటిప్పణిలో తెలిపింది.
