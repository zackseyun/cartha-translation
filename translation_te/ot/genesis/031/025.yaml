translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా ఉండే శైలి. ‘విడిది చేశాడు’ అనేది మూలంలోని సంక్షిప్త శిబిర-నిర్మాణాన్ని సహజంగా అందిస్తుంది; భౌగోళిక మరియు బంధుత్వ పదాల అస్పష్టతను పాదసూచనలో నిలిపింది.
