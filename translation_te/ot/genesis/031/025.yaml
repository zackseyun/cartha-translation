  text: וַ/יַּשֵּׂ֥ג לָבָ֖ן אֶֽת יַעֲקֹ֑ב וְ/יַעֲקֹ֗ב תָּקַ֤ע אֶֽת אָהֳל/וֹ֙ בָּ/הָ֔ר וְ/לָבָ֛ן תָּקַ֥ע אֶת אֶחָ֖י/ו בְּ/הַ֥ר הַ/גִּלְעָֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/025.yaml
  text: And Laban caught up with Jacob[a]. Now Jacob had pitched his tent in the hill country[c][b], and Laban pitched with his kinsmen in the hill country of Gilead.
translation:
  language: te
  text: లాబాను యాకోబును చేరుకున్నాడు[a]. అప్పటికే యాకోబు కొండప్రాంతంలో[b] తన గుడారం వేసుకున్నాడు; లాబాను తన బంధువులతో[c] కలిసి గిలాదు కొండప్రాంతంలో శిబిరం వేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘యాకోబును వెంబడించి చేరుకున్నాడు.’
    reason: lexical_alternative
  - marker: b
    text: ‘కొండప్రాంతం’ అనే హీబ్రూ పదబంధాన్ని ‘కొండమీద’ అని కూడా అనువదించవచ్చు; గిలాదును సూచించే పదబంధాన్ని సందర్భానుసారం ‘గిలాదు కొండమీద’ లేదా ‘గిలాదు కొండల్లో’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: హీబ్రూలో పదశః ‘అతని సోదరులు’; ఇక్కడ అది విస్తృత కుటుంబం లేదా వంశసమూహ సభ్యులను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשֵּׂג
  choice: చేరుకున్నాడు
  rationale: వెంబడించి వెళ్లి ఒకరిని చేరుకోవడం అనే נשׂג క్రియ భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; పట్టుకున్నాడనే బంధించే భావాన్ని అనవసరంగా కలిగించదు.
- source_word: תָּקַע אֶת־אָהֳלוֹ
  choice: తన గుడారం వేసుకున్నాడు
  rationale: గుడారం నిలపడం అనే హీబ్రూ నుడికారానికి సహజమైన తెలుగు సమానం. లాబాను చేరుకునే సమయానికే యాకోబు అక్కడ విడిది చేసి ఉన్నాడనే కథన క్రమాన్ని ‘అప్పటికే’ స్పష్టం చేస్తుంది.
- source_word: בָּהָר
  choice: కొండప్రాంతంలో
  rationale: הַר అనే పదం ఒక కొండను లేదా కొండల ప్రాంతాన్ని సూచించగలదు. ఇక్కడ ప్రాంతీయ భౌగోళిక సందర్భానికి ‘కొండప్రాంతం’ సరిపోతుంది.
- source_word: תָּקַע אֶת־אֶחָיו
  choice: తన బంధువులతో కలిసి ... విడిది చేశాడు
  rationale: హీబ్రూలోని సంక్షిప్త నిర్మాణాన్ని తెలుగులో సహజంగా వ్యక్తపరుస్తుంది. సమాంతర వాక్యం ఆధారంగా శిబిరం వేసిన భావం ఉన్నా, మూలంలో లేని ‘గుడారాలు’ అనే బహువచనాన్ని చేర్చలేదు.
- source_word: אֶחָיו
  choice: తన బంధువులతో
  rationale: పదశః ‘అతని సోదరులు’; అయితే אחים విస్తృత కుటుంబం లేదా వంశసమూహ సభ్యులను కూడా సూచించగలదు. ఈ కథనంలో ‘బంధువులు’ సందర్భోచితం.
- source_word: בְּהַר הַגִּלְעָד
  choice: గిలాదు కొండప్రాంతంలో
  rationale: నిర్మాణాన్ని ఒకే శిఖరంగా నిర్బంధించకుండా, గిలాదు ఎత్తైన ప్రాంతాన్ని సూచించే సహజమైన భౌగోళిక పదబంధంగా అనువదించింది.
