revisions:
- from: అతడు మమ్మల్ని పరాయి స్త్రీలుగా పరిగణిస్తున్నాడు కదా? ఎందుకంటే అతడు మమ్మల్ని అమ్మివేసి, మా సొమ్మును పూర్తిగా మింగేశాడు[a].
  to: అతడు మమ్మల్ని పరాయివారిగా భావిస్తున్నాడు కదా? ఎందుకంటే అతడు మమ్మల్ని అమ్మివేసి, మా సొమ్మును కూడా పూర్తిగా తినేశాడు[a].
  rationale: The revision improves idiomatic Telugu and removes an unnecessarily explicit gender expression while preserving the source’s feminine-speaker context, rhetorical force, economic complaint, and emphatic eating idiom. The footnote is retained with an accurate grammatical explanation.
