review_pass:
  verdict: revise
  source_fidelity: The rhetorical question, the complaint of being treated as outsiders, the sale metaphor, and the emphatic consumption idiom are retained. “పరాయి స్త్రీలుగా” is unnecessarily marked and somewhat unnatural in Telugu; the feminine plural is supplied by the immediate speakers and need not be rendered as ‘women’ in this clause. The revision uses “పరాయివారిగా,” preserving the relational sense without suggesting ethnic foreignness or adding an awkward gender label. “కూడా” reflects גַּם in the emphatic verbal expression.
  naturalness: “అతడు మమ్మల్ని పరాయివారిగా భావిస్తున్నాడు కదా?” is natural modern standard Telugu for the affirmative-expecting rhetorical question. “మా సొమ్మును కూడా పూర్తిగా తినేశాడు” deliberately retains the Hebrew eating metaphor while remaining intelligible as an accusation of total consumption.
  terminology: '“సొమ్ము” appropriately represents כֶּסֶף in this economic context, while the footnote preserves “వెండి” as the lexical alternative. The footnote’s grammatical explanation is corrected: the Hebrew construction is a finite verb with an infinitive absolute of the same root, not a reduplication of a verbal form.'
  issues:
  - severity: medium
    issue: “పరాయి స్త్రీలుగా” is overly explicit and stylistically awkward.
    rationale: Although the Hebrew form is feminine plural because Rachel and Leah are speaking, the sense is that they are treated as outsiders/non-family members. Telugu “పరాయివారిగా” conveys this naturally without introducing an unnecessary ‘women’ label.
  - severity: low
    issue: The footnote describes the Hebrew emphasis imprecisely as repetition of a verbal form.
    rationale: The emphasis comes from a finite verb followed by an infinitive absolute of the same root. The revised note states this accurately.
  - severity: low
    issue: The draft does not explicitly reflect גַּם.
    rationale: Adding “కూడా” is a safe way to retain the additional/emphatic element in the coordinated complaint.
  revised_text: అతడు మమ్మల్ని పరాయివారిగా భావిస్తున్నాడు కదా? ఎందుకంటే అతడు మమ్మల్ని అమ్మివేసి, మా సొమ్మును కూడా పూర్తిగా తినేశాడు[a].
