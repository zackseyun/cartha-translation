source:
  edition: WLC
  text: הֲ/ל֧וֹא נָכְרִיּ֛וֹת נֶחְשַׁ֥בְנוּ ל֖/וֹ כִּ֣י מְכָרָ֑/נוּ וַ/יֹּ֥אכַל גַּם אָכ֖וֹל אֶת כַּסְפֵּֽ/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/015.yaml
  text: Are we not regarded by him as foreigners? For he has sold us and has indeed completely consumed our money[a].
translation:
  language: te
  text: అతడు మమ్మల్ని పరాయివారిగా భావిస్తున్నాడు కదా? ఎందుకంటే అతడు మమ్మల్ని అమ్మివేసి, మా సొమ్మును కూడా పూర్తిగా తినేశాడు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మా వెండిని పూర్తిగా తినేశాడు.” సంపూర్ణంగా వాడేసిన భావాన్ని బలంగా చెప్పడానికి హీబ్రూలో ‘తినడం’ అనే క్రియతో పాటు అదే ధాతువుకు చెందిన అనంతరూపాన్ని వాడారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹוא
  choice: కదా?
  rationale: అవుననే సమాధానాన్ని ఆశించే అలంకారిక ప్రశ్నను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: נָכְרִיּוֹת
  choice: పరాయి స్త్రీలుగా
  rationale: ఇది స్త్రీలింగ బహువచన రూపం; తండ్రి తమను కుటుంబానికి చెందినవారిగా కాక పరాయివారిగా చూస్తున్నాడనే కుమార్తెల ఫిర్యాదును స్పష్టంగా ఉంచుతుంది.
- source_word: נֶחְשַׁבְנוּ לוֹ
  choice: అతడు మమ్మల్ని ... పరిగణిస్తున్నాడు
  rationale: హీబ్రూ నిఫాల్ రూపంలోని ‘అతని దృష్టిలో పరిగణించబడటం’ అనే భావాన్ని తెలుగులో సహజమైన కర్తరి నిర్మాణంతో వ్యక్తం చేస్తుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందున్న అలంకారిక ప్రశ్నకు కారణాన్ని పరిచయం చేస్తుంది.
- source_word: מְכָרָנוּ
  choice: అతడు మమ్మల్ని అమ్మివేసి
  rationale: పూర్తయినప్పటికీ ప్రస్తుత ఫిర్యాదుకు సంబంధించిన చర్యను తెలియజేస్తుంది; ‘అమ్మివేశాడు’ అనే తీవ్రతను సమన్వయ క్రియారూపంలో నిలుపుతుంది.
- source_word: וַיֹּאכַל גַּם אָכוֹל
  choice: పూర్తిగా మింగేశాడు
  rationale: సమాపక క్రియతో కూడిన infinitive absolute ఇచ్చే బలాన్ని ‘పూర్తిగా’ ద్వారా, మూలంలోని ‘తినడం’ రూపకాన్ని ‘మింగేశాడు’ ద్వారా నిలుపుతుంది.
- source_word: אֶת כַּסְפֵּנוּ
  choice: మా సొమ్మును
  rationale: כֶּסֶף యొక్క ‘వెండి/డబ్బు’ అర్థాలలో సందర్భానికి సరిపోయే ఆర్థిక భావాన్ని సహజంగా తెలియజేస్తుంది.
