source:
  edition: WLC
  text: הָיִ֧יתִי בַ/יּ֛וֹם אֲכָלַ֥/נִי חֹ֖רֶב וְ/קֶ֣רַח בַּ/לָּ֑יְלָה וַ/תִּדַּ֥ד שְׁנָתִ֖/י מֵֽ/עֵינָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/040.yaml
  text: By day the heat consumed me[a], and the frost by night, and my sleep fled from my eyes.
translation:
  language: te
  text: నేను పగలు ఎండకు తినివేయబడేవాడిని, రాత్రి మంచుకు కూడా; నా కళ్లనుండి నిద్ర పారిపోయేది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָיִיתִי
  choice: నేను ... మాడిపోయాను / గడ్డకట్టిపోయాను
  rationale: హీబ్రూలోని ‘నేను ఉండేవాడిని/అయ్యాను’ అనే ప్రారంభ క్రియను తెలుగులో సహజమైన పరిస్థితి వర్ణనలో కలిపి వ్యక్తం చేశాం.
- source_word: בַיּוֹם
  choice: పగటిపూట
  rationale: రాత్రిపూట అనే సమాంతర పదంతో స్పష్టమైన కాలవ్యతిరేకతను నిలుపుతుంది.
- source_word: אֲכָלַנִי חֹרֶב
  choice: ఎండకు మాడిపోయాను
  rationale: అక్షరార్థంగా ‘ఎండ నన్ను తినివేసింది’; తీవ్రమైన పొడి వేడి వల్ల కలిగిన బాధను సహజమైన ఆధునిక తెలుగులో బలంగా తెలియజేస్తుంది.
- source_word: וְקֶרַח בַּלָּיְלָה
  choice: రాత్రిపూట మంచుకు గడ్డకట్టిపోయాను
  rationale: קֶרַח మంచు లేదా గడ్డకట్టించే చలిని సూచిస్తుంది; పగటి ఎండకు సమాంతరంగా రాత్రి తీవ్ర చలిని వ్యక్తం చేస్తుంది.
- source_word: וַתִּדַּד שְׁנָתִי מֵעֵינָי
  choice: నా కళ్లకు నిద్ర లేకుండా పోయింది
  rationale: అక్షరార్థంగా ‘నా నిద్ర నా కళ్లనుండి పారిపోయింది’; తెలుగు వాడుకలో సహజంగా ఉండే నిద్రలేమి వ్యక్తీకరణను ఎంచుకున్నాం.
theological_decisions: []
translation_notes:
  register: సాధారణ ఆధునిక తెలుగు పాఠకులకు అర్థమయ్యేలా సహజమైన, గౌరవప్రదమైన శైలి. మూలంలోని పగలు–రాత్రి సమాంతరతను, తీవ్రమైన శారీరక బాధను నిలిపాం.
