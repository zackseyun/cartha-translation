revisions:
- from: నేను పగటిపూట ఎండకు మాడిపోయాను, రాత్రిపూట మంచుకు గడ్డకట్టిపోయాను; నా కళ్లకు నిద్ర లేకుండా పోయింది.
  to: నేను పగలు ఎండకు తినివేయబడేవాడిని, రాత్రి మంచుకు కూడా; నా కళ్లనుండి నిద్ర పారిపోయేది.
  rationale: The revision preserves the Hebrew introductory imperfect sense ('I was'), the active metaphor in which daytime heat and nighttime frost consume/afflict Jacob, and the ellipsis after 'frost.' It keeps the personified flight of sleep and the day–night balance in idiomatic modern Telugu. A footnote records the absorbed introductory verb and clarifies that 'మంచు' denotes frost rather than ordinary dew.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T21:04:14Z'
review_pass:
  verdict: revise
  source_fidelity: The draft conveys the day–night hardship and sleeplessness, but its first two clauses shift the Hebrew's active imagery ('the heat consumed me ... frost [consumed me]') into Jacob's resulting states ('I was scorched/froze'). The second clause also supplies 'గడ్డకట్టిపోయాను' (I froze solid), which is stronger and more specific than the Hebrew 'frost/ice' parallel. Retaining the consuming/afflicting subject and the implied verb in the second clause better reflects the source.
  naturalness: The Telugu is clear and modern. 'పగలు ... రాత్రి' gives a natural balanced cadence, and 'నా కళ్లనుండి నిద్ర పారిపోయేది' is an idiomatic, vivid equivalent of the Hebrew expression.
  terminology: Use 'ఎండ' for חֹרֶב in this exposure context and 'మంచు' for קֶרַח. 'మంచు' can mean dew in some Telugu contexts, but alongside 'ఎండ' and 'రాత్రి' it naturally denotes frost; the explanatory footnote preserves precision. No doctrinal terminology is involved.
  issues:
  - severity: medium
    issue: The active verbal imagery of heat and frost consuming Jacob is recast as 'మాడిపోయాను' and 'గడ్డకట్టిపోయాను.'
    rationale: אָכַל ('consume') governs 'heat' explicitly and is understood with 'frost' by ellipsis. The draft communicates consequence but loses the parallel personified affliction; 'గడ్డకట్టిపోయాను' additionally overstates the image.
  revised_text: నేను పగలు ఎండకు తినివేయబడేవాడిని, రాత్రి మంచుకు కూడా; నా కళ్లనుండి నిద్ర పారిపోయేది.
  revised_footnotes:
  - marker: a
    text: 'లేదా, “నేను ఇలా ఉండేవాడిని: పగలు ఎండ నన్ను తినివేసేది, రాత్రి మంచు కూడా.” హీబ్రూలో ప్రారంభంలో “నేను ఉండేవాడిని” ఉంది; తెలుగులో సహజత్వం కోసం అది వాక్యనిర్మాణంలో కలిపి చెప్పబడింది. ఇక్కడ “మంచు” అంటే రాత్రి పడే గడ్డకట్టించే చలి లేదా తుషారం.'
    reason: lexical_alternative
