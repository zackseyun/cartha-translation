id: GEN.31.49
reference: Genesis 31:49
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הַ/מִּצְפָּה֙ אֲשֶׁ֣ר אָמַ֔ר יִ֥צֶף יְהוָ֖ה בֵּינִ֣/י וּ/בֵינֶ֑/ךָ כִּ֥י נִסָּתֵ֖ר אִ֥ישׁ מֵ/רֵעֵֽ/הוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/049.yaml
  text: And Mizpah[a], because he said[b], “May Yahweh watch between me and you when we are hidden from each other.”
translation:
  language: te
  text: 'మరియు మిస్పా[a] కూడా—అతడు ఇలా అన్నాడు కాబట్టి: “మనం ఒకరికొకరం కనిపించకుండా ఉన్నప్పుడు[b] యాహ్వే నా, నీ మధ్య కాపలా కాయాలి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘మిస్పా’ అనే పేరు హీబ్రూలో ‘కాపలా స్థలం’ లేదా ‘గమనించే స్థలం’ అనే అర్థమున్న పదాన్ని పోలి ఉంటుంది; ఈ పేరుకు ‘యాహ్వే ... కాపలా కాయాలి’ అనే మాటతో పదసంబంధం ఉంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘మనం ఒకరి కంటికి మరొకరం దూరంగా ఉన్నప్పుడు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַמִּצְפָּה
  choice: మరియు మిస్పా అని కూడా పేరు పెట్టాడు
  rationale: మִצְפָּה ఇక్కడ స్థలనామంగా వాడబడింది. ముందున్న నామకరణ సందర్భాన్ని తెలుగులో సహజంగా తెలియజేయడానికి ‘పేరు పెట్టాడు’ను సందర్భార్థంగా చేర్చాం; ‘మిస్పా’ అనే రూపం తరువాతి ‘కాపలా కాయాలి’తో ఉన్న పదక్రీడను నిలుపుతుంది.
- source_word: אֲשֶׁר אָמַר
  choice: ఎందుకంటే అతడు ... అని అన్నాడు
  rationale: సాపేక్ష పదబంధం ఆ పేరుకు కారణాన్ని పరిచయం చేస్తోంది; ఆధునిక తెలుగులో ‘ఎందుకంటే’ సహజంగా ఆ వివరణాత్మక సంబంధాన్ని తెలియజేస్తుంది.
- source_word: יִצֶף
  choice: కాపలా కాయాలి
  rationale: צפה అంటే చూడటం, గమనిస్తూ ఉండటం, కాపలా కాయటం. అభిలాషార్థక రూపాన్ని ‘కాయాలి’ తెలియజేస్తుంది; ఇది మిస్పా పేరుతో ఉన్న పదక్రీడను కూడా స్పష్టంగా ప్రతిధ్వనింపజేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ దైవనామాన్ని తెలుగు బైబిలు వాడుకలో సుపరిచితమైన వ్యక్తినామ రూపమైన ‘యెహోవా’గా లిప్యంతరీకరించాం; బిరుదుతో భర్తీ చేయలేదు.
- source_word: בֵּינִי וּבֵינֶךָ
  choice: నాకు నీకు మధ్య
  rationale: మూలంలోని వ్యక్తిక్రమాన్ని నిలుపుతూ తెలుగులో సహజమైన సంబంధవాచక నిర్మాణాన్ని వాడాం.
- source_word: כִּי נִסָּתֵר אִישׁ מֵרֵעֵהוּ
  choice: మనం ఒకరికొకరం కనిపించకుండా ఉన్నప్పుడు
  rationale: నిఫాల్ రూపమైన נִסָּתֵר యొక్క ‘దాగి ఉండటం/కనిపించకపోవటం’ భావాన్ని, పరస్పర ప్రయోగమైన אִישׁ מֵרֵעֵהוּతో కలిపి సహజమైన తెలుగులో తెలిపాం. ‘ఉన్నప్పుడు’ ఇక్కడ כִּי సూచించే కాలసంబంధ పరిస్థితిని ప్రతిబింబిస్తుంది.
theological_decisions:
- issue: יְהוָה దైవనామ అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో వ్యక్తిగత దైవనామమే ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుతో మార్చకుండా లిప్యంతరీకరించాం. తెలుగు సాధారణ బైబిలు పాఠకులకు సుపరిచితమైన ‘యెహోవా’ను ఎంచుకున్నాం; ‘యాహ్వే’ మరొక సాధ్యమైన శాస్త్రీయ లిప్యంతరీకరణ.
- issue: దైవిక కాపలా యొక్క భావం
  choice: యెహోవా ... కాపలా కాయాలి
  alternative: యెహోవా ... గమనించాలి
  rationale: ఇది స్నేహపూర్వక ఆశీర్వాదమా లేక ఒడంబడికను అతిక్రమించకుండా పర్యవేక్షించాలనే హెచ్చరికా అనే సందర్భతీవ్రతను పాఠమే పూర్తిగా పరిష్కరించదు. ‘కాపలా కాయాలి’ రెండు భావసంభావ్యతలనూ నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలిని వాడాం. స్థలనామాన్ని లిప్యంతరీకరించి, హీబ్రూ పదక్రీడను పాదసూచికలో వివరించాం. మూలంలోని పరస్పర వియోగ భావాన్ని అతిగా వ్యాఖ్యానించకుండా నిలిపాం.
