  text: וְ/לֹ֣א נְטַשְׁתַּ֔/נִי לְ/נַשֵּׁ֥ק לְ/בָנַ֖/י וְ/לִ/בְנֹתָ֑/י עַתָּ֖ה הִסְכַּ֥לְתָּֽ עֲשֽׂוֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/028.yaml
  text: And you did not let me kiss my sons and my daughters[a]. Now you have acted foolishly.
translation:
  language: te
  text: నా కుమారులను, నా కుమార్తెలను ముద్దుపెట్టుకోవడానికి కూడా నువ్వు నాకు అవకాశం ఇవ్వలేదు.[a] ఇప్పుడు నువ్వు మూర్ఖంగా ప్రవర్తించావు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత అక్షరార్థంగా: “నా కుమారులను, నా కుమార్తెలను ముద్దుపెట్టుకోవడానికి నన్ను విడిచిపెట్టలేదు.”'
    reason: נטשׁ అనే క్రియ యొక్క ప్రాథమిక ‘విడిచిపెట్టు’ అర్థాన్ని చూపించే పదప్రయోగ ప్రత్యామ్నాయం.
lexical_decisions:
- source_word: נְטַשְׁתַּנִי
  choice: నువ్వు నాకు అవకాశం ఇవ్వలేదు
  rationale: נטשׁ అనే క్రియకు సాధారణంగా ‘విడిచిపెట్టు’ అనే అర్థం ఉన్నా, ‘ముద్దుపెట్టుకోవడానికి’ అనే క్రియారూపంతో కలిసి ఇక్కడ అనుమతి లేదా అవకాశం ఇవ్వకపోవడాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ఈ ఎంపిక సహజంగా ఉండి ఫిర్యాదు ధోరణిని నిలుపుతుంది.
- source_word: לְנַשֵּׁק
  choice: ముద్దుపెట్టుకోవడానికి
  rationale: మూలపదం నేరుగా ‘ముద్దుపెట్టు’ అని అర్థం. సందర్భంలో వీడ్కోలు ముద్దు భావం ఉన్నప్పటికీ, మూలంలో ‘వీడ్కోలు’ అని స్పష్టంగా లేదు కాబట్టి దాన్ని ప్రధాన పాఠ్యంలో చేర్చలేదు.
- source_word: לְבָנַי וְלִבְנֹתַי
  choice: నా కుమారులను, నా కుమార్తెలను
  rationale: హీబ్రూ పాఠ్యం కుమారులను, కుమార్తెలను విడివిడిగా పేర్కొంటుంది; అందువల్ల ‘నా పిల్లలను’ అని సంక్షిప్తం చేయకుండా ఆ భేదాన్ని నిలిపాం.
- source_word: עַתָּה
  choice: ఇప్పుడు
  rationale: యాకోబు చేసిన పనిపై లాబాను ఇచ్చే తీర్పును పరిచయం చేసే సహజ కాల/సంభాషణ సూచకం.
- source_word: הִסְכַּלְתָּ עֲשׂוֹ
  choice: నువ్వు మూర్ఖంగా ప్రవర్తించావు
  rationale: ఈ హీబ్రూ నిర్మాణం ‘మూర్ఖంగా చేయడం/ప్రవర్తించడం’ అనే భావాన్ని ఇస్తుంది. ఎంపిక చేసిన తెలుగు సహజంగా ఉండి మూలంలోని నిందను నిలుపుతుంది.
