    text: లేదా, “ఒంటెలపై కూర్చోబెట్టాడు.” ఈ సందర్భంలో హీబ్రూ పదబంధం ఈ రెండు విధాలుగా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: లేచి
  rationale: קום క్రియ యొక్క కథన క్రమాన్ని సహజమైన ఆధునిక తెలుగులో చూపుతుంది; యాకోబు చర్యకు పూనుకున్నాడనే భావం సందర్భంలో స్పష్టమవుతుంది.
- source_word: וַיִּשָּׂא
  choice: ఎక్కించాడు
  rationale: నשׂא పదానికి అక్షరార్థంగా ‘ఎత్తాడు/మోశాడు’ అనే భావం ఉన్నా, ఒంటెలతో కూడిన ఈ సందర్భంలో వారిని వాటిపై కూర్చోబెట్టడం లేదా ఎక్కించడం అనే ప్రయోజకార్థం సహజంగా వ్యక్తమవుతుంది.
- source_word: בָּנָיו
  choice: తన కుమారులను
  rationale: హీబ్రూ రూపం పుంలింగ బహువచనం; దానిని లింగనిర్దిష్టంగా నిలుపుతుంది.
- source_word: נָשָׁיו
  choice: తన భార్యలను
  rationale: ఈ సందర్భంలో אשה బహువచనం యాకోబు భార్యలను స్పష్టంగా సూచిస్తుంది.
- source_word: עַל הַגְּמַלִּים
  choice: ఒంటెల మీద
  rationale: עַל ఇక్కడ గమ్యస్థానాన్ని లేదా స్థితిని సూచించగలదు; ‘ఎక్కించాడు’తో కలిపి సహజమైన తెలుగులో ఒంటెలపైకి చేర్చిన చర్యను తెలియజేస్తుంది.
