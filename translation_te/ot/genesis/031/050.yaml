id: GEN.31.50
reference: Genesis 31:50
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אִם תְּעַנֶּ֣ה אֶת בְּנֹתַ֗/י וְ/אִם תִּקַּ֤ח נָשִׁים֙ עַל בְּנֹתַ֔/י אֵ֥ין אִ֖ישׁ עִמָּ֑/נוּ רְאֵ֕ה אֱלֹהִ֥ים עֵ֖ד בֵּינִ֥/י וּ/בֵינֶֽ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/050.yaml
  text: If you mistreat my daughters[a], or if you take wives besides my daughters—though no man is with us—see, God is witness between me and you.
translation:
  language: te
  text: నువ్వు నా కుమార్తెలను బాధిస్తే, లేదా నా కుమార్తెలతోపాటు ఇతర స్త్రీలను భార్యలుగా చేసుకుంటే—మనతో ఏ మనిషీ లేడు[a]—చూడు, దేవుడు నీకూ నాకూ మధ్య సాక్షి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అంటే, ఈ మాటలకు మానవ సాక్షిగా అక్కడ ఎవరూ లేరు.
    reason: మూలంలోని ‘మనతో ఏ మనిషీ లేడు’ అనే వాక్యభాగం, మానవ సాక్షి లేకపోయినా దేవుడు సాక్షిగా ఉన్నాడనే సందర్భార్థాన్ని వివరిస్తుంది.
lexical_decisions:
- source_word: תְּעַנֶּה
  choice: బాధిస్తే
  rationale: ఇక్కడ పియేల్ రూపం లాబాను కుమార్తెలను వివాహ జీవితంలో కష్టపెట్టడం లేదా దుర్వ్యవహారం చేయడం అనే విస్తృత భావాన్ని ఇస్తుంది. ‘బాధిస్తే’ ఆ భావాన్ని సహజమైన ఆధునిక తెలుగులో సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: בְּנֹתַי
  choice: నా కుమార్తెలను
  rationale: మూలంలోని స్వామ్యబోధక బహువచనాన్ని నేరుగా అందిస్తుంది; వాక్యంలో రెండుసార్లు ఉన్న పునరుక్తిని ఉద్దేశపూర్వకంగా నిలిపింది.
- source_word: תִּקַּח נָשִׁים עַל בְּנֹתַי
  choice: నా కుమార్తెలతోపాటు వేరే స్త్రీలను భార్యలుగా చేసుకుంటే
  rationale: ‘నా కుమార్తెల మీద/వారితోపాటు భార్యలను తీసుకోవడం’ అనే హీబ్రూ ప్రయోగం వారిని విడిచిపెట్టి మరొకరిని చేసుకోవడం కాక, వారికి అదనంగా ఇతర భార్యలను చేసుకోవడాన్ని సూచిస్తుంది.
- source_word: אֵין אִישׁ עִמָּנוּ
  choice: మనతో ఏ మనిషీ లేడు
  rationale: మూలంలోని אִישׁను ‘మనిషి’గా ఉంచుతూ, ఈ ఒడంబడిక హెచ్చరికకు మానవ సాక్షి ఎవరూ లేరనే భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: רְאֵה
  choice: చూడు
  rationale: సాక్షిగా దేవునికి చేసే గంభీర విజ్ఞాపనవైపు దృష్టి మళ్లించే ప్రత్యక్ష ఆజ్ఞను నిలుపుతుంది.
- source_word: אֱלֹהִים
  choice: దేవుడు
  rationale: ఈ ఒడంబడిక సందర్భంలో ఏకవచన దైవాన్ని సూచిస్తుంది.
- source_word: עֵד
  choice: సాక్షి
  rationale: ఒడంబడిక సంబంధమైన న్యాయసూత్రంలో దేవుడు ఇరుపక్షాల మధ్య సాక్షిగా ఉన్నాడనే విధేయార్థక నామవాచకాన్ని నేరుగా అందిస్తుంది.
- source_word: בֵּינִי וּבֵינֶךָ
  choice: నీకూ నాకూ మధ్య
  rationale: యాకోబు, లాబాను అనే రెండు పక్షాల మధ్య బాధ్యతను సూచించే సంబంధపదబంధాన్ని సహజమైన తెలుగు పదక్రమంలో ఇస్తుంది.
theological_decisions:
- issue: אִישׁ అనే పదంలోని మానవ-సాక్షి భావం
  choice: మనతో ఏ మనిషీ లేడు
  alternative: మనతో ఎవరూ లేరు
  rationale: ‘మనిషి’ అనే మూలపద భావాన్ని ప్రధాన పాఠ్యంలో నిలుపుతూ, సందర్భంలో ఉద్దేశించినది మానవ సాక్షి లేకపోవడమేనని పాదటిప్పణిలో స్పష్టం చేసింది; దేవుడే సాక్షి అనే తరువాతి మాటతో ఉన్న వ్యత్యాసాన్ని ఇది కాపాడుతుంది.
- issue: దేవుని సాక్ష్యానికి ఇచ్చిన ఉద్ఘాటన
  choice: దేవుడే సాక్షి
  alternative: దేవుడు సాక్షి
  rationale: హీబ్రూలో ప్రత్యేక ఉద్ఘాటక అవ్యయం లేకపోయినా, ముందున్న ‘ఏ మనిషీ లేడు’ అనే మాటకు విరుద్ధంగా దేవుని సాక్ష్యాన్ని తెలుగులో సహజంగా చూపేందుకు ‘దేవుడే’ వాడింది; ఇది కొత్త సిద్ధాంతార్థాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన సంభాషణ శైలి వాడబడింది. దేవుడు–మనిషి సంబంధిత గౌరవభావాన్ని నిలుపుతూ, లాబాను యాకోబుతో నేరుగా మాట్లాడుతున్నందున ఏకవచన ‘నువ్వు/నీ’ రూపాలు ఉపయోగించబడ్డాయి. మూలంలోని షరతు, అదనపు భార్యల భావం, మానవ సాక్షి లేమి మరియు దేవుని సాక్ష్యం మధ్య ఉద్రిక్తత నిలుపబడ్డాయి.
