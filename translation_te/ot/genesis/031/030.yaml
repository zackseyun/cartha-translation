review_pass:
  verdict: revise
  source_fidelity: 'The Hebrew opens with the discourse marker וְעַתָּה, then uses two infinitive-absolute-plus-finite-verb constructions: Jacob has certainly gone, because he intensely longed for his father''s house; Laban then asks why Jacob stole his gods. The draft preserves the emphases and the plain plural ''my gods,'' but its word order makes the longing sound specifically like a desire ''to go'' to the house, rather than longing for the father''s household/home itself.'
  naturalness: The draft is broadly understandable and modern, but 'నీ తండ్రి ఇంటికి వెళ్లాలని ఎంతోగా తపించావు' unnecessarily adds 'to go' and is slightly less direct than a construction with 'నీ తండ్రి ఇంటికోసం.' 'అయితే' can imply an adversative transition not explicit in the Hebrew; a simple connective ('మరి') better reflects the accusatory continuation.
  terminology: '''నా దేవుళ్లను'' accurately retains אֱלֹהָי without importing ''household gods'' into the text. The footnote''s ''నా ఇంటి దేవుళ్లను'' is understandable but less idiomatic and less precise than ''నా గృహదేవతలను'' as an alternative contextual clarification. ''లాబాను ఇంటి విగ్రహాలు'' should be phrased more naturally as ''లాబాను ఇంట్లోని విగ్రహాలు.'''
  issues:
  - severity: medium
    issue: The main text adds 'వెళ్లాలని' ('wanting to go') to the phrase 'for your father's house.'
    rationale: לְבֵית אָבִיךָ is the object of intense longing, not explicitly an infinitive of wanting to go. Telugu can preserve this directly with 'నీ తండ్రి ఇంటికోసం ఎంతోగా తపించావు.'
  - severity: low
    issue: The connective 'అయితే' introduces an adversative nuance.
    rationale: The Hebrew has a straightforward transition from concession to accusation. 'మరి' is natural in direct speech without suggesting a stronger contrast.
  revised_text: ఇప్పుడు నువ్వు నీ తండ్రి ఇంటికోసం ఎంతోగా తపించావు కాబట్టి నిజంగానే వెళ్లిపోయావు. మరి నా దేవుళ్లను[a] ఎందుకు దొంగిలించావు?
  revised_footnotes:
  - marker: a
    text: లేదా, ‘నా గృహదేవతలను.’ హీబ్రూలో ఇక్కడ నేరుగా ‘నా దేవుళ్లను’ అని ఉంది; సందర్భంలో ఇది లాబాను ఇంట్లోని విగ్రహాలను సూచిస్తుంది.
    reason: lexical_alternative
  revision_rationale: The revision removes the added purposive sense ('వెళ్లాలని') and directly renders the object of longing as 'నీ తండ్రి ఇంటికోసం.' It retains both Hebrew emphases with 'ఎంతోగా' and 'నిజంగానే,' preserves the unqualified 'నా దేవుళ్లను' in the main text, and improves the contextual alternative in the footnote. 'మరి' gives a natural non-adversative transition into Laban's accusation.
