  yaml_path: translation/ot/genesis/031/030.yaml
  text: And now[a], you have indeed gone away, because you longed greatly for your father's house. Why did you steal my gods?
translation:
  language: te
  text: ఇప్పుడు నువ్వు నీ తండ్రి ఇంటికోసం ఎంతోగా తపించావు కాబట్టి నిజంగానే వెళ్లిపోయావు. మరి నా దేవుళ్లను[a] ఎందుకు దొంగిలించావు?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నా గృహదేవతలను.’ హీబ్రూలో ఇక్కడ నేరుగా ‘నా దేవుళ్లను’ అని ఉంది; సందర్భంలో ఇది లాబాను ఇంట్లోని విగ్రహాలను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: ఇప్పుడు
  rationale: లాబాను తన ఆరోపణలో తదుపరి అంశాన్ని ప్రవేశపెట్టే సంభాషణ సూచకం; ఆధునిక తెలుగులో సహజంగా ఉండేలా ‘ఇప్పుడు’ అని అనువదించాం.
- source_word: הָלֹךְ הָלַכְתָּ
  choice: నిజంగానే వెళ్లిపోయావు
  rationale: క్రియతో కూడిన infinitive absolute ఇచ్చే నొక్కిచెప్పే భావాన్ని ‘నిజంగానే’ ద్వారా వ్యక్తం చేశాం; ‘వెళ్లిపోయావు’ పూర్తయిన ప్రయాణాన్ని సూచిస్తుంది.
- source_word: כִּי
  choice: కాబట్టి
  rationale: యాకోబు వెళ్లిపోవడానికి లాబాను అంగీకరిస్తున్న కారణాన్ని తెలుగులో స్పష్టంగా అనుసంధానిస్తుంది.
- source_word: נִכְסֹף נִכְסַפְתָּה
  choice: ఎంతోగా తపించావు
  rationale: infinitive absolute నిర్మాణంలోని తీవ్రతను ‘ఎంతోగా’ నిలుపుతుంది; כָּסַף సూచించే బలమైన ఆకాంక్షకు ‘తపించావు’ సహజమైన, గౌరవప్రదమైన తెలుగు.
- source_word: לְבֵית אָבִיךָ
  choice: నీ తండ్రి ఇంటికి వెళ్లాలని
  rationale: ‘నీ తండ్రి ఇంటి కోసం తపించావు’ అనే మూల భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తూ కుటుంబ గృహ భావాన్ని నిలుపుతుంది.
- source_word: לָמָּה
  choice: ఎందుకు
  rationale: ఆరోపణతో కూడిన ప్రత్యక్ష ప్రశ్నను సరళంగా అందిస్తుంది.
- source_word: גָנַבְתָּ
  choice: దొంగిలించావు
  rationale: మూలంలోని పూర్తయిన చర్యను ప్రత్యక్ష ప్రశ్నలో సహజమైన తెలుగు భూతకాల క్రియగా అందిస్తుంది.
- source_word: אֶת אֱלֹהָי
  choice: నా దేవుళ్లను
  rationale: హీబ్రూ వచనం నేరుగా ‘నా దేవుళ్లు’ అని మాత్రమే చెబుతుంది; సందర్భంలోని గృహ విగ్రహాల భావాన్ని ప్రధాన పాఠ్యంలో చేర్చకుండా మూల పదబంధాన్ని నిలిపాం.
theological_decisions:
- issue: లాబాను మాటల్లో אֱלֹהָי అనువాదం
  choice: నా దేవుళ్లను
  alternative: నా ఇంటి దేవుళ్లను; నా గృహదేవతలను
  rationale: హీబ్రూ ఇక్కడ నేరుగా ‘నా దేవుళ్లు’ అని చెబుతుంది. పరిసర సందర్భంలో అవి లాబాను ఇంటి విగ్రహాలను సూచించినప్పటికీ, ఆ వివరణను ప్రధాన పాఠ్యంలోకి చేర్చి మూలాన్ని సంకుచితం చేయకుండా పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన సంభాషణ శైలిని ఉపయోగించాం. రెండు హీబ్రూ emphatic infinitive absolute నిర్మాణాల బలాన్ని వరుసగా ‘నిజంగానే,’ ‘ఎంతోగా’ అనే పదాలతో నిలిపాం. పాదసూచిక గుర్తును అది వివరిస్తున్న ‘దేవుళ్లను’ అన్న పదానికే జతచేశాం.
