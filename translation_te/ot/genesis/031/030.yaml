revisions:
- from: ఇప్పుడు నువ్వు నీ తండ్రి ఇంటికి వెళ్లాలని ఎంతోగా తపించావు కాబట్టి నిజంగానే వెళ్లిపోయావు. అయితే నా దేవుళ్లను[a] ఎందుకు దొంగిలించావు?
  to: ఇప్పుడు నువ్వు నీ తండ్రి ఇంటికోసం ఎంతోగా తపించావు కాబట్టి నిజంగానే వెళ్లిపోయావు. మరి నా దేవుళ్లను[a] ఎందుకు దొంగిలించావు?
  rationale: The revision removes the added purposive sense ('వెళ్లాలని') and directly renders the object of longing as 'నీ తండ్రి ఇంటికోసం.' It retains both Hebrew emphases with 'ఎంతోగా' and 'నిజంగానే,' preserves the unqualified 'నా దేవుళ్లను' in the main text, and improves the contextual alternative in the footnote. 'మరి' gives a natural non-adversative transition into Laban's accusation.
  reviewer_model: gpt-5.6-terra
