base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/004.yaml
  text: Esau ran to meet him[a], embraced him, fell on his neck, kissed him, and they wept.
translation:
  language: te
  text: ఏశావు అతనిని ఎదుర్కొనడానికి పరుగెత్తి వచ్చి, అతనిని కౌగిలించుకొని, అతని మెడపై పడి, అతనికి ముద్దుపెట్టాడు[a]. వారిద్దరూ ఏడ్చారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మసొరెటిక్ పాఠ్యంలో “అతనికి ముద్దుపెట్టాడు” అనే క్రియపై అసాధారణంగా చుక్కలు ఉన్నాయి. కొందరు వ్యాఖ్యాతలు ఇవి సందేహాన్ని లేదా ప్రత్యేక ఉద్ఘాటనను సూచిస్తాయని భావిస్తారు; అయితే ఇక్కడ హీబ్రూ పదానికి సూటి అర్థం “అతనికి ముద్దుపెట్టాడు.”
    reason: textual_variant
lexical_decisions:
- source_word: וַיָּרָץ
  choice: పరుగెత్తి వచ్చి
  rationale: רוּץ అనే క్రియ నేరుగా పరుగెత్తడాన్ని సూచిస్తుంది; సందర్భంలో ఏశావు యాకోబు వైపు వేగంగా రావడాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: עֵשָׂו
  choice: ఏశావు
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: לִקְרָאתוֹ
  choice: అతనిని ఎదుర్కొనడానికి
  rationale: לִקְרַאת అనే ప్రయోగం ఒకరిని కలుసుకోవడానికి ఎదురుగా వెళ్లడాన్ని సూచిస్తుంది; ఈ రూపం దిశను, భేటీని రెండింటినీ నిలుపుతుంది.
- source_word: וַיְחַבְּקֵהוּ
  choice: అతనిని కౌగిలించుకొని
  rationale: חבק అంటే కౌగిలించుకోవడం; ఆధునిక సాధారణ తెలుగులో సహజంగా ఉండి ఆప్యాయ చర్యను స్పష్టంగా తెలియజేస్తుంది.
- source_word: וַיִּפֹּל עַל צַוָּארָו
  choice: అతని మెడపై పడి
  rationale: మూలంలోని స్పష్టమైన శరీరచిత్రాన్ని వ్యాఖ్యానాత్మకంగా మార్చకుండా నిలుపుతుంది.
- source_word: וַיִּשָּׁקֵהוּ
  choice: అతనికి ముద్దుపెట్టాడు
  rationale: נשק క్రియ యొక్క సూటి అర్థం ముద్దుపెట్టడం. మసొరెటిక్ గుర్తుల అసాధారణతను ప్రధాన వాక్యంలో అనుమానార్థకంగా మార్చకుండా పాదసూచికలో తెలియజేస్తుంది.
- source_word: וַיִּבְכּוּ
  choice: వారిద్దరూ ఏడ్చారు
  rationale: బహువచన క్రియ ఇద్దరూ ఏడ్చారని సూచిస్తుంది; తెలుగులో కర్త స్పష్టత కోసం ‘వారిద్దరూ’ చేర్చబడింది.
theological_decisions:
- issue: ఏశావు యాకోబుపట్ల చేసిన చర్యల భావం
  choice: వచనంలోని ఆప్యాయ చర్యల వరుసను సూటిగా అనువదించడం
  alternative: తరువాతి వ్యాఖ్యాన సంప్రదాయాల ఆధారంగా ముద్దును అనుమానాస్పదంగా లేదా వ్యంగ్యంగా చూపించడం
  rationale: హీబ్రూ కథనం పరుగెత్తడం, కౌగిలించుకోవడం, మెడపై పడడం, ముద్దుపెట్టడం, ఏడవడం అనే వరుసను అందిస్తుంది. మూలపాఠ్యం వ్యక్తం చేయని అనుమానాన్ని అనువాదంలో చేర్చకూడదు; గుర్తుల విశేషాన్ని పాదసూచికలో ఉంచడం సముచితం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కథనానికి తగిన గౌరవప్రదమైన, సామాన్య పాఠకులకు సులభమైన శైలి. మూలంలోని వేగవంతమైన క్రియల వరుసను నిలుపుతూ, చివరి బహువచన క్రియను ‘వారిద్దరూ’ అని స్పష్టం చేసింది.
