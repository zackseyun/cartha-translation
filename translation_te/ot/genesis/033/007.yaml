source:
  edition: WLC
  text: וַ/תִּגַּ֧שׁ גַּם לֵאָ֛ה וִ/ילָדֶ֖י/הָ וַ/יִּֽשְׁתַּחֲו֑וּ וְ/אַחַ֗ר נִגַּ֥שׁ יוֹסֵ֛ף וְ/רָחֵ֖ל וַ/יִּֽשְׁתַּחֲוֽוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/007.yaml
  text: Leah also came near[a], and her children, and they bowed down. Afterward Joseph and Rachel came near[b], and they bowed down.
translation:
  language: te
  text: లేయా కూడా తన పిల్లలతో కలిసి దగ్గరకు వచ్చారు[a] మరియు వంగి నమస్కరించారు. ఆ తర్వాత యోసేపు, రాహేలు దగ్గరకు వచ్చారు మరియు వంగి నమస్కరించారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘సమీపించారు’; రెండు చోట్లా ఇదే ప్రత్యామ్నాయ అనువాదం వర్తిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘సాష్టాంగ నమస్కారం చేశారు’; హీబ్రూ క్రియ లోతైన వినయపూర్వక నమస్కారాన్ని సూచించగలదు. ఈ వచనంలోని రెండు సందర్భాలకూ ఇది వర్తిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּגַּשׁ / נִגַּשׁ
  choice: దగ్గరకు వచ్చి
  rationale: נגשׁ సమీపించడాన్ని సూచిస్తుంది. సందర్భంలో ఏశావు దగ్గరకు రావడం ఉద్దేశం; ‘దగ్గరకు వచ్చి’ సహజమైన ఆధునిక తెలుగు.
- source_word: גַּם
  choice: కూడా
  rationale: ముందుగా వచ్చిన గుంపులకు అదనంగా లేయా గుంపు వచ్చిన కథన క్రమాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: וִילָדֶיהָ
  choice: తన పిల్లలతో
  rationale: יְלָדִים లింగపరంగా కేవలం కుమారులకే పరిమితం కాదు; ‘పిల్లలు’ మూలపద విస్తృతిని నిలుపుతుంది. తెలుగు వాక్యనిర్మాణంలో ‘తన పిల్లలతో’ సహజంగా ఉంది.
- source_word: וַיִּשְׁתַּחֲוּ
  choice: వారు వంగి నమస్కరించారు
  rationale: שׁחה ఇక్కడ గౌరవసూచకంగా శరీరాన్ని వంచి నమస్కరించడాన్ని సూచిస్తుంది. ‘వంగి నమస్కరించారు’ సాధారణ పాఠకులకు స్పష్టంగా ఉండి, పూర్తిగా సాష్టాంగపడిన భంగిమను అనవసరంగా నిర్దిష్టం చేయదు.
- source_word: וְאַחַר
  choice: ఆ తర్వాత
  rationale: ఊరేగింపులో తదుపరి క్రమాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: יוֹסֵף וְרָחֵל
  choice: యోసేపు, రాహేలు
  rationale: మూల హీబ్రూ పదక్రమంలో యోసేపు ముందుగా ఉన్నాడు; అనువాదంలో అదే క్రమం నిలుపబడింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. హీబ్రూ వాక్యక్రమాన్ని సాధ్యమైనంతవరకు నిలుపుతూ, తెలుగులో అసహజంగా అనిపించకుండా రూపకల్పన చేయబడింది. రెండో పాదంలోని క్రియకూ [a], నమస్కార క్రియ రెండు సందర్భాలకూ [b] వర్తించేలా పాదటిప్పణుల పాఠ్యం స్పష్టం చేస్తుంది.
