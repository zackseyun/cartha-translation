translation:
  language: te
  text: ఆ రోజే ఏశావు తన దారిన శేయీరుకు తిరిగి వెళ్లాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: తిరిగి వెళ్లాడు
  rationale: שׁוב అనే క్రియ ఇక్కడ పూర్తయిన గత చర్యను తెలియజేస్తుంది. ప్రయాణ సందర్భంలో ‘తిరిగి వెళ్లాడు’ సహజంగా ఉండి, ఏశావు వెనుదిరిగిన భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: בַּיּוֹם הַהוּא
  choice: ఆ రోజే
  rationale: ఈ పదబంధానికి అక్షరార్థం ‘ఆ రోజున.’ తెలుగు వాక్యంలో ‘ఆ రోజే’ కాలసూచనను సహజంగా, కొద్దిగా ఉద్ఘాటనతో వ్యక్తపరుస్తుంది.
- source_word: עֵשָׂו
  choice: ఏశావు
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: לְדַרְכּוֹ
  choice: తన దారిన
  rationale: అక్షరార్థంగా ‘అతని దారికి/దారిలో.’ ప్రయాణాన్ని కొనసాగించిన భావాన్ని ఆధునిక తెలుగులో ‘తన దారిన’ సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: שֵׂעִירָה
  choice: శేయీరుకు
  rationale: స్థలనామానికి జోడించిన దిశాసూచక ה, శేయీరు వైపు కదలికను సూచిస్తుంది; తెలుగులో ‘శేయీరుకు’ దీనిని స్పష్టంగా వ్యక్తపరుస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని కాలసూచన, తిరుగు ప్రయాణం, స్వదారి, గమ్యస్థానం అన్నీ సహజమైన పదక్రమంలో నిలుపబడ్డాయి.
