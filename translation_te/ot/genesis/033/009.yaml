translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. ‘నా సహోదరా’ అనే సంబోధన మూలంలోని సంబంధపూర్వక వెచ్చదనాన్ని కాపాడుతుంది; వాక్యం మూలంలోని సంక్షిప్తతను నిలుపుతుంది.
