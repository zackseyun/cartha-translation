  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר עֵשָׂ֖ו יֶשׁ לִ֣/י רָ֑ב אָחִ֕/י יְהִ֥י לְ/ךָ֖ אֲשֶׁר לָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/009.yaml
  text: But Esau said[a], “I have plenty, my brother; let what is yours be yours.”
translation:
  language: te
  text: అయితే ఏశావు, “నా దగ్గర పుష్కలంగా ఉంది[a], నా సహోదరా; నీది నీకే ఉండనివ్వు” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తగినంత ఉంది.”
    reason: ‘רָב’కు సందర్భానుసారం ‘పుష్కలంగా’తో పాటు ‘తగినంత’ అనే అర్థం కూడా సాధ్యమే.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అయితే ... అన్నాడు
  rationale: వావ్-కన్సిక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది; సందర్భంలో ఏశావు యాకోబు కానుకను సున్నితంగా నిరాకరిస్తున్నందున ‘అయితే’ స్వల్ప వ్యతిరేకతను సహజంగా తెలియజేస్తుంది.
- source_word: עֵשָׂו
  choice: ఏశావు
  rationale: తెలుగులో స్థిరపడిన బైబిలు వ్యక్తినామ రూపాన్ని ఉపయోగించాం.
- source_word: יֶשׁ לִי רָב
  choice: నా దగ్గర పుష్కలంగా ఉంది
  rationale: హీబ్రూ స్వామ్యప్రయోగం అక్షరార్థంగా ‘నాకు చాలా ఉంది’ అని సూచిస్తుంది. ‘పుష్కలంగా ఉంది’ సమృద్ధిని సహజ ఆధునిక తెలుగులో తెలియజేస్తుంది; కేవలం సరిపడినంత అనే అర్థానికి పరిమితం చేయదు.
- source_word: אָחִי
  choice: నా సహోదరా
  rationale: మొదటి పురుష ఏకవచన ప్రత్యయంతో ఉన్న సంబోధనను నిలుపుతూ, ఏశావు మాటలోని బంధుత్వపు ఆప్యాయతను తెలియజేస్తుంది.
- source_word: יְהִי לְךָ
  choice: నీకే ఉండనివ్వు
  rationale: 'היה క్రియలోని జస్సివ్ రూపం ఇక్కడ మర్యాదపూర్వక అనుమతి లేదా నిరాకరణను వ్యక్తపరుస్తుంది: యాకోబుకు చెందినది అతని దగ్గరే ఉండాలని ఏశావు చెబుతున్నాడు.'
- source_word: אֲשֶׁר לָךְ
  choice: నీది
  rationale: ‘నీకు చెందినది’ అనే సంబంధార్థాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తపరుస్తుంది. చివరి ప్రత్యయం లేఖనరూపంలో స్త్రీలింగంలా కనిపించినా, సందర్భం మరియు సాంప్రదాయ పఠనం దాన్ని యాకోబును సూచించే రెండవ పురుష ఏకవచనంగా గ్రహిస్తాయి.
