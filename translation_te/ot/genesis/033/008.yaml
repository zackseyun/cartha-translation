  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר מִ֥י לְ/ךָ֛ כָּל הַ/מַּחֲנֶ֥ה הַ/זֶּ֖ה אֲשֶׁ֣ר פָּגָ֑שְׁתִּי וַ/יֹּ֕אמֶר לִ/מְצֹא חֵ֖ן בְּ/עֵינֵ֥י אֲדֹנִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/008.yaml
  text: And he said[a], “What do you mean by all this camp that I met?” And he said[c][b], “To find favor in the eyes of my lord.”
translation:
  language: te
  text: ఏశావు, “నాకు ఎదురైన ఈ గుంపంతా[a] దేనికి?” అని అడిగాడు. యాకోబు, “నా ప్రభువు దృష్టిలో దయ పొందడానికి[b]” అని జవాబిచ్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పదానికి అక్షరార్థంగా ‘ఈ శిబిరమంతా’ అని కూడా అనువదించవచ్చు; ఇక్కడ అది యాకోబు ముందుగా పంపిన మొత్తం పశువుల మందలు, వాటితో వచ్చిన సమూహాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ నుడికారానికి అక్షరార్థం ‘నా ప్రభువు కళ్లలో దయ పొందడానికి’; అంటే ఆయన అనుకూలతను పొందడానికి.
    reason: cultural_note
lexical_decisions:
- source_word: מִי לְךָ
  choice: దేనికి?
  rationale: ఈ సందర్భంలో ఈ హీబ్రూ ప్రయోగం గుర్తింపును కాకుండా, యాకోబు ముందుగా పంపిన సమూహం యొక్క ఉద్దేశాన్ని ప్రశ్నిస్తుంది. ‘దేనికి?’ అనేది తెలుగులో సహజంగా ఆ ఉద్దేశాన్ని అడుగుతుంది.
- source_word: כָּל הַמַּחֲנֶה הַזֶּה
  choice: ఈ గుంపంతా
  rationale: מַחֲנֶה సాధారణంగా ‘శిబిరం’ అని అర్థమిచ్చినా, ఇక్కడ ఏశావుకు ఎదురైన మొత్తం పశువుల మందలు, వాటితో వచ్చిన మనుషుల సమూహాన్ని సూచిస్తుంది. ‘గుంపంతా’ ఈ సమష్టి భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: אֲשֶׁר פָּגָשְׁתִּי
  choice: నాకు ఎదురైన
  rationale: פָּגַשְׁתִּי అంటే ‘నేను కలిసిన’ లేదా ‘నాకు ఎదురైన.’ ప్రయాణంలో ముందుకు పంపబడిన సమూహం ఏశావుకు ఎదురుపడిన సందర్భంలో ‘నాకు ఎదురైన’ సహజంగా ఉంది.
- source_word: לִמְצֹא חֵן
  choice: దయ పొందడానికి
  rationale: ఈ పదబంధం అనుకూలమైన ఆదరణను పొందాలనే ఉద్దేశాన్ని సూచిస్తుంది. ‘దయ పొందడానికి’ సామాజిక సందర్భాన్నీ, వినయపూర్వక స్వరాన్నీ నిలుపుతుంది.
- source_word: בְּעֵינֵי אֲדֹנִי
  choice: నా ప్రభువు దృష్టిలో
  rationale: హీబ్రూ మూలంలోని ‘నా ప్రభువు కళ్లలో’ అనే గౌరవప్రదమైన నుడికారాన్ని తెలుగులో సహజమైన ‘నా ప్రభువు దృష్టిలో’గా ఇచ్చాం. ఇక్కడ ‘ప్రభువు’ దేవునికి కాక, యాకోబు ఏశావును గౌరవంగా సంబోధించడానికి వాడిన మాట.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. వరుసగా వచ్చే హీబ్రూ సర్వనామాలు తెలుగులో గందరగోళం కలిగించకుండా, సందర్భం స్పష్టంగా సూచించే ఏశావు, యాకోబు పేర్లు ఉపయోగించబడ్డాయి. ‘నా ప్రభువు’ అనే సామాజిక గౌరవ సంబోధనను నిలుపుతూ, అది దైవనామం కాదనే సందర్భార్థం కాపాడబడింది.
