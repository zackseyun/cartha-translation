translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన కథన శైలి వాడబడింది. సంభాషణ సహజంగా ఉండేలా ఉంచుతూ, עָלוֹת עָלָי అనే క్లిష్ట నుడికారంలోని రెండు భావాలనూ ప్రధాన పాఠం మరియు పాదసూచిక ద్వారా సంరక్షించాం.
