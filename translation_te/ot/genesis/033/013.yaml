id: GEN.33.13
reference: Genesis 33:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֵלָ֗י/ו אֲדֹנִ֤/י יֹדֵ֨עַ֙ כִּֽי הַ/יְלָדִ֣ים רַכִּ֔ים וְ/הַ/צֹּ֥אן וְ/הַ/בָּקָ֖ר עָל֣וֹת עָלָ֑/י וּ/דְפָקוּ/ם֙ י֣וֹם אֶחָ֔ד וָ/מֵ֖תוּ כָּל הַ/צֹּֽאן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/013.yaml
  text: But he said to him[a], “My lord knows that the children are frail, and the flocks and herds nursing their young are under my care. If they are driven hard for one day, all the flock will die.”
translation:
  language: te
  text: 'కానీ అతడు ఏశావుతో ఇలా అన్నాడు: “నా ప్రభువుకు తెలుసు, పిల్లలు బలహీనంగా ఉన్నారు; పాలిచ్చే గొర్రెలూ పశువులూ నా బాధ్యతలో ఉన్నాయి.[a] వాటిని ఒక్క రోజు బాగా తొందరపెట్టి తోలితే, గొర్రెల మంద అంతా చనిపోతుంది.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తమ పిల్లలకు పాలిచ్చే గొర్రెలూ పశువులూ నా బాధ్యతలో ఉన్నాయి.” హెబ్రీ నుడికారం ఆ జంతువులు తమ పిల్లలకు పాలిచ్చే స్థితిలో ఉన్నాయనే భావాన్నీ, వాటి సంరక్షణ బాధ్యత యాకోబుపై ఉందనే భావాన్నీ కలిపి తెలియజేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנִי
  choice: నా ప్రభువు
  rationale: ఏశావును గౌరవపూర్వకంగా సంబోధించే మానవ బిరుదు; ఇది దేవుని నామం కాదు. తెలుగు కథన శైలిలో గౌరవం, సామాజిక వినయం రెండింటినీ నిలుపుతుంది.
- source_word: הַיְלָדִים רַכִּים
  choice: పిల్లలు బలహీనంగా ఉన్నారు
  rationale: רַכִּים ఇక్కడ ప్రయాణపు శ్రమను తట్టుకోలేని సున్నితత్వం, దుర్బలతను సూచిస్తుంది. ఆధునిక తెలుగులో భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: הַצֹּאן וְהַבָּקָר
  choice: గొర్రెలూ పశువులూ
  rationale: చిన్న పశువుల మందలను, పెద్ద పశువులను వేరుగా సూచించే హెబ్రీ జంటను సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: עָלוֹת עָלָי
  choice: పాలిచ్చే ... నా బాధ్యతలో ఉన్నాయి
  rationale: పాలిచ్చే తల్లి జంతువుల స్థితినీ, వాటి సంరక్షణ యాకోబుపై ఉందనే భావాన్నీ కలిపి తెలిపే క్లిష్టమైన హెబ్రీ నుడికారాన్ని వ్యక్తపరుస్తుంది.
- source_word: וּדְפָקוּם
  choice: వాటిని ... అదేపనిగా తోలితే
  rationale: జంతువులను విశ్రాంతి లేకుండా కఠినంగా నడిపించే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; హెబ్రీలోని అనిర్దిష్ట కర్తను అలాగే అనిర్దిష్టంగా ఉంచుతుంది.
- source_word: יוֹם אֶחָד
  choice: ఒక్కరోజైనా
  rationale: ఒకే రోజు అంతగా తోలినా ప్రమాదం కలుగుతుందనే హెచ్చరికను సంక్షిప్తంగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: וָמֵתוּ כָּל־הַצֹּאן
  choice: మంద అంతా చనిపోతుంది
  rationale: హెబ్రీ సమూహవాచక ఏకవచనాన్ని తెలుగు సమూహవాచక రూపంతో నిలుపుతుంది.
