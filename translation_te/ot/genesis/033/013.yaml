revisions:
- from: 'కానీ అతడు ఏశావుతో ఇలా అన్నాడు: “నా ప్రభువుకు తెలుసు, పిల్లలు బలహీనంగా ఉన్నారు; పాలిచ్చే గొర్రెలూ పశువులూ నా బాధ్యతలో ఉన్నాయి.[a] వాటిని ఒక్కరోజైనా అదేపనిగా తోలితే, మంద అంతా చనిపోతుంది.”'
  to: 'కానీ అతడు ఏశావుతో ఇలా అన్నాడు: “నా ప్రభువుకు తెలుసు, పిల్లలు బలహీనంగా ఉన్నారు; పాలిచ్చే గొర్రెలూ పశువులూ నా బాధ్యతలో ఉన్నాయి.[a] వాటిని ఒక్క రోజు బాగా తొందరపెట్టి తోలితే, గొర్రెల మంద అంతా చనిపోతుంది.”'
  rationale: The revision resolves the footnote's potentially misleading attachment, makes the overdriving sense explicit, avoids an added concessive nuance, and preserves the source's specific collective reference to the flock. It otherwise retains the draft's faithful, natural modern Telugu register.
