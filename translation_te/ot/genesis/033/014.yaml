source:
  edition: WLC
  text: יַעֲבָר נָ֥א אֲדֹנִ֖/י לִ/פְנֵ֣י עַבְדּ֑/וֹ וַ/אֲנִ֞י אֶֽתְנָהֲלָ֣ה לְ/אִטִּ֗/י לְ/רֶ֨גֶל הַ/מְּלָאכָ֤ה אֲשֶׁר לְ/פָנַ/י֙ וּ/לְ/רֶ֣גֶל הַ/יְלָדִ֔ים עַ֛ד אֲשֶׁר אָבֹ֥א אֶל אֲדֹנִ֖/י שֵׂעִֽירָ/ה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/014.yaml
  text: Please let my lord pass on ahead of his servant[a], and I will proceed slowly, at the pace of the livestock that is before me and at the pace of the children[c][b], until I come to my lord at Seir.
translation:
  language: te
  text: “నా ప్రభువు తన సేవకుని ముందుగా దయచేసి వెళ్లనివ్వండి. నేనైతే, నా ముందున్న పశువుల[a] వేగానికి, పిల్లల వేగానికి తగినట్లుగా నెమ్మదిగా[b] సాగుతాను; శేయీరులోని నా ప్రభువు దగ్గరకు వచ్చేవరకు.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘పశువులు’గా అనువదించిన హెబ్రీ పదానికి ‘పని,’ ‘ఆస్తి,’ లేదా ‘సంపద’ అనే అర్థాలు కూడా ఉండవచ్చు; ఇక్కడ నడిపిస్తున్న జంతువులను సూచిస్తున్నట్లు కనిపిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “జాగ్రత్తగా సాగుతాను”; హెబ్రీ క్రియ కేవలం వేగాన్ని మాత్రమే కాక, మృదువుగా లేదా అదుపుతో ముందుకు కదలడాన్ని కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעֲבָר נָא
  choice: దయచేసి వెళ్లాలి
  rationale: Qal జుస్సివ్‌తో కూడిన נָא మర్యాదపూర్వక అభ్యర్థనను వ్యక్తం చేస్తుంది. తెలుగు సంభాషణలో సహజంగా ఉండేలా ‘దయచేసి వెళ్లాలి’ అని ఇచ్చాం.
- source_word: אֲדֹנִי
  choice: నా ప్రభువు
  rationale: యాకోబు ఏశావును గౌరవంగా సంబోధిస్తున్నాడు. పునరావృతమయ్యే అధీనతాభావాన్ని నిలుపుతూ, దీనిని దేవునికి సంబంధించిన బిరుదుగా నిర్బంధించకుండా ‘నా ప్రభువు’ అని అనువదించాం.
- source_word: לִפְנֵי עַבְדּוֹ
  choice: తన సేవకునికంటే ముందుగా
  rationale: అక్షరార్థంగా ‘తన సేవకుని ముందు’; సందర్భంలో ఏశావు ముందుగా ప్రయాణించాలనే భావం. మూడవ పురుషంలోని వినయపూర్వక స్వీయసూచనను నిలిపాం.
- source_word: אֶתְנָהֲלָה לְאִטִּי
  choice: నెమ్మదిగా సాగుతాను
  rationale: התפעל రూపంలోని נהל జాగ్రత్తగా లేదా అదుపుతో ముందుకు సాగడాన్ని సూచించగలదు; לְאִטִּי క్రమంగా, తొందరపడకుండా కదలడాన్ని స్పష్టం చేస్తుంది.
- source_word: לְרֶגֶל
  choice: నడకకు తగినట్లుగా
  rationale: అక్షరార్థంగా ‘పాదం ప్రకారం’ అనే జాతీయానికి, ఇతరుల లేదా మంద యొక్క వేగానికి అనుగుణంగా ప్రయాణించడం అనే భావం ఉంది.
- source_word: הַמְּלָאכָה
  choice: పశువులు
  rationale: ఈ పదానికి సాధారణంగా ‘పని,’ ‘ఆస్తి,’ ‘సంపద’ అనే అర్థాలు ఉన్నా, మందలను నడిపిస్తున్న ఈ సందర్భంలో యాకోబు సంరక్షణలోని పశువులను సూచించడం అత్యంత సంభావ్యం.
- source_word: הַיְלָדִים
  choice: పిల్లలు
  rationale: ప్రయాణిస్తున్న యాకోబు పిల్లలను సూచించే సాధారణ, సహజమైన ఆధునిక తెలుగు పదం.
- source_word: עַד אֲשֶׁר אָבֹא אֶל אֲדֹנִי שֵׂעִירָה
  choice: నా ప్రభువు దగ్గరకు, శేయీరుకు వచ్చేవరకు
  rationale: אֶל ‘దగ్గరకు/వద్దకు’ అనే గమ్యాన్ని, שֵׂעִירָה దిశను సూచించే -ָה ప్రత్యయంతో ‘శేయీరుకు’ అనే భావాన్ని ఇస్తుంది. హెబ్రీ వాక్యంలోని రెండు గమ్యసూచనల మధ్య సంబంధాన్ని అతిగా సరిచేయకుండా కామాతో నిలిపాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలిని వాడాం. యాకోబు మూడవ పురుషంలో తనను ‘తన సేవకుడు’గా పేర్కొనే వినయపూర్వక సామాజిక భంగిమను నిలిపాం. గమ్యస్థానానికి సంబంధించిన హెబ్రీ నిర్మాణంలోని స్వల్ప అస్పష్టతను ప్రధాన పాఠంలో కామాతో, పాదటిప్పణిలో ప్రత్యామ్నాయంతో సంరక్షించాం.
