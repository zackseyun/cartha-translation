revisions:
- from: “నా ప్రభువు తన సేవకునికంటే ముందుగా దయచేసి వెళ్లాలి. నేనైతే, నా ముందున్న పశువుల[a] నడకకు, పిల్లల నడకకు తగినట్లుగా నెమ్మదిగా[b] సాగుతాను; నా ప్రభువు దగ్గరకు, శేయీరుకు వచ్చేవరకు[c] అలా సాగుతాను.”
  to: “నా ప్రభువు తన సేవకుని ముందుగా దయచేసి వెళ్లనివ్వండి. నేనైతే, నా ముందున్న పశువుల[a] వేగానికి, పిల్లల వేగానికి తగినట్లుగా నెమ్మదిగా[b] సాగుతాను; శేయీరులోని నా ప్రభువు దగ్గరకు వచ్చేవరకు.”
