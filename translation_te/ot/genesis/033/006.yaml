  text: Then the female servants and their children came near and bowed down[a][b][c][d].
translation:
  language: te
  text: అప్పుడు దాసీలు మరియు వారి పిల్లలు దగ్గరికి వచ్చి వంగి నమస్కరించారు[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘సమీపించారు.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘సాగిలపడ్డారు’; గౌరవసూచకంగా లోతుగా వంగడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּגַּשְׁןָ
  choice: దగ్గరికి వచ్చి
  rationale: נגשׁ క్రియ యొక్క వరుస కథన చర్యను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; ఏశావు వైపు సమీపించడాన్ని సూచిస్తుంది.
- source_word: הַשְּׁפָחוֹת
  choice: దాసీలు
  rationale: שִׁפְחָה స్త్రీ దాసిని సూచిస్తుంది. ‘దాసీలు’ లింగ సూచనను నిలుపుతూ సంక్షిప్తంగా, సహజంగా ఉంటుంది; వారి సామాజిక స్థితిని తేలికపరచదు.
- source_word: הֵנָּה וְיַלְדֵיהֶן
  choice: తమ పిల్లలతో
  rationale: స్వతంత్ర సర్వనామం మరియు సముచ్చయ నిర్మాణం దాసీలు, వారి పిల్లలు కలిసి ముందుకు వచ్చినట్లు తెలియజేస్తాయి. తెలుగులో ‘తమ పిల్లలతో’ సహజంగా ఈ అర్థాన్ని ఇస్తుంది.
- source_word: וַתִּשְׁתַּחֲוֶיןָ
  choice: సాష్టాంగపడ్డారు
  rationale: השתחוה సూచించే గౌరవపూర్వకంగా నేలకు వంగే శరీరభంగిమను ‘సాష్టాంగపడ్డారు’ స్పష్టంగా తెలియజేస్తుంది; ఇది ఈ సందర్భంలో కేవలం తలవంచడంకన్నా సంపూర్ణమైన నమస్కార చర్య.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కథన ప్రవాహానికి అనుగుణంగా సంక్షిప్తమైన, గౌరవప్రదమైన శైలి. మూలంలోని స్త్రీలింగ బహువచన సూచనను ‘దాసీలు’ ద్వారా నిలిపి, సమూహ చర్యను సహజమైన తెలుగు వాక్యనిర్మాణంలో వ్యక్తం చేసింది.
