revisions:
- from: అప్పుడు దాసీలు తమ పిల్లలతో దగ్గరికి వచ్చి సాష్టాంగపడ్డారు[a][b].
  to: అప్పుడు దాసీలు మరియు వారి పిల్లలు దగ్గరికి వచ్చి వంగి నమస్కరించారు[a][b].
  rationale: The revision explicitly retains the servants and their children as the joint actors and uses an idiomatic, appropriately broad Telugu expression for bowing in homage. It avoids making the Hebrew gesture into the more specific act of sāshtāṅga prostration.
