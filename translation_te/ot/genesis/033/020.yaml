source:
  edition: WLC
  text: וַ/יַּצֶּב שָׁ֖ם מִזְבֵּ֑חַ וַ/יִּ֨קְרָא ל֔/וֹ אֵ֖ל אֱלֹהֵ֥י יִשְׂרָאֵֽל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/020.yaml
  text: There he set up an altar and called it El-Elohe-Israel[a][b].
translation:
  language: te
  text: అక్కడ అతడు ఒక బలిపీఠాన్ని నిలిపి, దానికి ఏల్-ఎలోహే-ఇశ్రాయేలు[a][b] అని పేరు పెట్టాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అక్కడ అతడు ఒక బలిపీఠాన్ని నిలిపి, ‘దేవా, ఇశ్రాయేలు దేవా’ అని ఆయనను పిలిచాడు”; లేదా, “దానిపై ‘దేవుడు ఇశ్రాయేలు దేవుడు’ అని ప్రకటించాడు.” హెబ్రీ వాక్యాన్ని బలిపీఠానికి పేరు పెట్టడంగానూ, దేవుణ్ణి పిలవడం లేదా ఆయన గురించి ప్రకటించడంగానూ అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
  - marker: b
    text: ఏల్-ఎలోహే-ఇశ్రాయేలు అంటే “దేవుడు, ఇశ్రాయేలు దేవుడు” లేదా “ఏల్, ఇశ్రాయేలు దేవుడు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּצֶּב
  choice: నిలిపి
  rationale: హిఫిల్ రూపంలోని נצב ఇక్కడ బలిపీఠాన్ని నెలకొల్పడం లేదా నిలపడం అనే భావాన్ని ఇస్తుంది; ‘నిలిపి’ సహజమైన ఆధునిక తెలుగు.
- source_word: שָׁם
  choice: అక్కడ
  rationale: స్థలాన్ని సూచించే క్రియావిశేషణానికి నేరమైన, సహజమైన అనువాదం.
- source_word: מִזְבֵּחַ
  choice: బలిపీఠం
  rationale: బలి అర్పించే నిర్మాణాన్ని సూచించే ప్రామాణిక తెలుగు పదం.
- source_word: וַיִּקְרָא לוֹ
  choice: దానికి … అని పేరు పెట్టాడు
  rationale: కרא + ל నిర్మాణం ఇక్కడ బలిపీఠానికి పేరు పెట్టడాన్ని సహజంగా సూచిస్తుంది. అయితే దేవుణ్ణి పిలిచాడు లేదా దానిపై ప్రకటించాడు అనే అర్థం కూడా సాధ్యమైనందున దాన్ని పాదసూచికలో ఉంచాం.
- source_word: אֵל אֱלֹהֵי יִשְׂרָאֵל
  choice: ఏల్-ఎలోహే-ఇశ్రాయేలు
  rationale: ప్రధాన పఠనంలో మొత్తం పదబంధం బలిపీఠపు పేరుగా పనిచేస్తున్నందున ధ్వన్యంతరీకరించాం; దాని అర్థాన్ని పాదసూచికలో ఇచ్చాం.
theological_decisions:
- issue: చివరి పదబంధం బలిపీఠపు పేరా, లేక దేవునికి చేసిన పిలుపు/ప్రకటనా?
  choice: యాకోబు బలిపీఠానికి పెట్టిన పేరుగా అనువదించడం
  alternative: అతడు ‘దేవా, ఇశ్రాయేలు దేవా’ అని దేవుణ్ణి పిలిచాడు; లేదా దానిపై ‘దేవుడు ఇశ్రాయేలు దేవుడు’ అని ప్రకటించాడు
  rationale: బలిపీఠాన్ని నిలిపిన వెంటనే వచ్చే వాక్యనిర్మాణం దానికి పేరు పెట్టడాన్ని సహజంగా సమర్థిస్తుంది; ఆదికాండంలోని ఇతర నామకరణ సూత్రాలతోనూ ఇది సరిపోతుంది. అయినా హెబ్రీ నిర్మాణం సంక్షిప్తంగా ఉండటం వల్ల పిలుపు లేదా ప్రకటన అనే పఠనాన్ని పూర్తిగా తొలగించలేం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. మూలంలోని నామకరణ పఠనాన్ని ప్రధాన వాక్యంలో ఉంచి, నిజమైన వ్యాకరణ–దైవశాస్త్ర సంబంధిత సందిగ్ధతను పాదసూచికల్లో నిలిపాం.
