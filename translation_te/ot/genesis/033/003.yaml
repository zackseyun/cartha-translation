  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/ה֖וּא עָבַ֣ר לִ/פְנֵי/הֶ֑ם וַ/יִּשְׁתַּ֤חוּ אַ֨רְצָ/ה֙ שֶׁ֣בַע פְּעָמִ֔ים עַד גִּשְׁתּ֖/וֹ עַד אָחִֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/003.yaml
  text: And he himself went on ahead of them and bowed down to the ground seven times[a], until he came near to his brother.
translation:
  language: te
  text: అతడే వారికంటే ముందుగా వెళ్లి, తన సోదరుని సమీపించేవరకు ఏడుసార్లు నేలవరకు వంగి నమస్కరించాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సాష్టాంగ నమస్కారం చేశాడు”; హీబ్రూ క్రియ సంపూర్ణంగా నేలపై వంగి గౌరవం చూపే చర్యను సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּא
  choice: అతడే
  rationale: క్రియలో అంతర్లీనంగా ఉన్న కర్తకు అదనంగా స్వతంత్ర సర్వనామం రావడం యాకోబు స్వయంగా ముందుకు వెళ్లాడనే ఉద్ఘాటనను సూచిస్తుంది.
- source_word: עָבַר לִפְנֵיהֶם
  choice: వారికి ముందుగా వెళ్లి
  rationale: సందర్భంలో ఇది కేవలం వారి ఎదుటుగా దాటడాన్ని కాకుండా, తన కుటుంబానికి ముందుగా వెళ్లి నాయకత్వం వహించడాన్ని సూచిస్తుంది.
- source_word: וַיִּשְׁתַּחוּ אַרְצָה
  choice: నేలవరకు వంగి నమస్కరించాడు
  rationale: హీబ్రూ క్రియ లోతుగా వంగడం లేదా సాష్టాంగపడడం వంటి గౌరవప్రదర్శనను సూచించగలదు; ‘నేలవరకు’ శరీర భంగిమను స్పష్టంగా ఉంచుతుంది, ‘నమస్కరించాడు’ ఆ చర్యలోని గౌరవార్థాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: שֶׁבַע פְּעָמִים
  choice: ఏడుసార్లు
  rationale: మూలంలోని నిర్దిష్ట సంఖ్యను యథాతథంగా, సహజమైన తెలుగు రూపంలో అందిస్తుంది.
- source_word: עַד גִּשְׁתּוֹ עַד אָחִיו
  choice: తన సోదరుని సమీపించేవరకు
  rationale: עַד తరువాతి infinitive construct పునరావృత నమస్కారాల ముగింపు హద్దును సూచిస్తుంది; రెండవ עַדను తెలుగు వాక్యనిర్మాణంలో విడిగా పునరావృతం చేయకుండా సంబంధాన్ని సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. ‘సోదరుడు’ అనే పదం కథన గాంభీర్యాన్ని నిలుపుతుంది. ప్రధాన పాఠంలో శారీరక చర్యనూ గౌరవప్రదర్శననూ కలిపి తెలిపి, మరింత బలమైన ‘సాష్టాంగపడడం’ అనే సాధ్యార్థాన్ని పాదటిప్పణిలో ఉంచాం.
