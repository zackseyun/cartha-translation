    issue: ‘వారికి ముందుగా’ can be read less precisely than intended.
    rationale: The Hebrew לִפְנֵיהֶם means that Jacob went ahead of them. ‘వారికంటే ముందుగా’ makes this relationship explicit in idiomatic Telugu.
  - severity: low
    issue: Footnote wording ‘సాష్టాంగపడ్డాడు’ is stylistically awkward.
    rationale: ‘సాష్టాంగ నమస్కారం చేశాడు’ is more standard Telugu and still presents the lexical alternative without asserting it as the sole sense.
  revised_text: అతడే వారికంటే ముందుగా వెళ్లి, తన సోదరుని సమీపించేవరకు ఏడుసార్లు నేలవరకు వంగి నమస్కరించాడు.[a]
