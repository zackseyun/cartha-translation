source:
  edition: WLC
  text: וַ/יָּבֹא֩ יַעֲקֹ֨ב שָׁלֵ֜ם עִ֣יר שְׁכֶ֗ם אֲשֶׁר֙ בְּ/אֶ֣רֶץ כְּנַ֔עַן בְּ/בֹא֖/וֹ מִ/פַּדַּ֣ן אֲרָ֑ם וַ/יִּ֖חַן אֶת פְּנֵ֥י הָ/עִֽיר־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/018.yaml
  text: Jacob came safely to the city of Shechem[a], which is in the land of Canaan, when he came from Paddan-aram[b], and he camped before the city.
translation:
  language: te
  text: యాకోబు పద్దన్-అరాము నుండి వచ్చినప్పుడు కనాను దేశంలోని షెకెము పట్టణానికి క్షేమంగా[a] చేరుకొని, ఆ పట్టణానికి ఎదురుగా గుడారాలు వేసుకున్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “షెకెము పట్టణమైన షాలేముకు చేరుకొని.” హీబ్రూ పదమైన שָׁלֵם (షాలేమ్)కు ‘క్షేమంగా’ అనే అర్థం ఉండవచ్చు; లేదా దాన్ని ‘షాలేము’ అనే స్థలనామంగా చదవవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּבֹא
  choice: చేరుకొని
  rationale: בוא అనే క్రియ ఇక్కడ యాకోబు ఒక ప్రదేశానికి చేరడాన్ని తెలిపే కథన రూపం. తెలుగు వాక్యప్రవాహంలో తరువాతి క్రియతో సహజంగా అనుసంధానించేందుకు ‘చేరుకొని’ అని అనువదించాం.
- source_word: שָׁלֵם
  choice: క్షేమంగా
  rationale: ఇక్కడ ఈ పదం యాకోబు సురక్షితంగా, క్షేమంగా చేరుకున్నాడనే క్రియావిశేషణ భావాన్ని సహజంగా ఇస్తుంది. అయితే ‘షాలేము’ అనే స్థలనామంగా చదివే అవకాశం ఉన్నందున దాన్ని పాదసూచికలో ఉంచాం.
- source_word: עִיר שְׁכֶם
  choice: షెకెము పట్టణానికి
  rationale: עִיר שְׁכֶם నిర్మాణాన్ని ఆధునిక తెలుగులో సహజంగా ‘షెకెము పట్టణం’ అని వ్యక్తం చేశాం.
- source_word: אֲשֶׁר בְּאֶרֶץ כְּנַעַן
  choice: కనాను దేశంలోని
  rationale: షెకెము ఉన్న భౌగోళిక ప్రాంతాన్ని తెలిపే సంబంధ వాక్యాన్ని తెలుగులో సంక్షిప్తమైన విశేషణ నిర్మాణంగా ఇచ్చాం.
- source_word: בְּבֹאוֹ מִפַּדַּן אֲרָם
  choice: పద్దన్-అరాము నుండి వచ్చినప్పుడు
  rationale: ב + infinitive construct కాలసంబంధ భావాన్ని, అంటే ‘అతడు వచ్చినప్పుడు’ అనే అర్థాన్ని ఇస్తుంది. మూలంలోని కాలసంబంధాన్ని స్పష్టంగా నిలిపాం.
- source_word: פַּדַּן אֲרָם
  choice: పద్దన్-అరాము
  rationale: హీబ్రూ స్థలనామాన్ని తెలుగు ధ్వని-లిప్యంతరీకరణ ప్రకారం అందించాం.
- source_word: וַיִּחַן
  choice: గుడారాలు వేసుకున్నాడు
  rationale: ఈ సందర్భంలో חנה శిబిరం వేయడం లేదా బసచేయడానికి గుడారాలు వేయడం అనే అర్థం. ‘గుడారాలు వేసుకున్నాడు’ సాధారణ ఆధునిక తెలుగు పాఠకునికి స్పష్టంగా ఉంటుంది.
- source_word: אֶת־פְּנֵי הָעִיר
  choice: ఆ పట్టణానికి ఎదురుగా
  rationale: ‘పట్టణపు ముఖం ఎదుట’ అనే హీబ్రూ స్థలసూచక నుడికారాన్ని సహజమైన తెలుగులో ‘పట్టణానికి ఎదురుగా’ అని ఇచ్చాం.
theological_decisions:
- issue: שָׁלֵם పదపు వ్యాకరణార్థం లేదా స్థలనామార్థం
  choice: ప్రధాన పాఠ్యంలో ‘క్షేమంగా’
  alternative: ‘షాలేము అనే చోటుకు; అది షెకెము పట్టణం’
  rationale: సందర్భంలో שָׁלֵם యాకోబు చేరుకున్న స్థితిని తెలిపే పదంగా చదవడం సహజం; అయినప్పటికీ స్థలనామంగా అర్థం చేసుకునే నిజమైన పాఠ్య సందిగ్ధతను పాదసూచికలో నిలిపాం. ఇది ప్రత్యేకమైన సిద్ధాంత నిర్ణయం కాదు, పాఠ్య-వ్యాకరణ నిర్ణయం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే కథన శైలిని ఉపయోగించాం. మూలంలోని సమాచార క్రమాన్ని సాధ్యమైనంతవరకు నిలుపుతూ, తెలుగులో సహజమైన వాక్యనిర్మాణం కోసం సంబంధ వాక్యాన్ని ‘కనాను దేశంలోని’గా మార్చాం.
