id: GEN.33.5
reference: Genesis 33:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּשָּׂ֣א אֶת עֵינָ֗י/ו וַ/יַּ֤רְא אֶת הַ/נָּשִׁים֙ וְ/אֶת הַ/יְלָדִ֔ים וַ/יֹּ֖אמֶר מִי אֵ֣לֶּה לָּ֑/ךְ וַ/יֹּאמַ֕ר הַ/יְלָדִ֕ים אֲשֶׁר חָנַ֥ן אֱלֹהִ֖ים אֶת עַבְדֶּֽ/ךָ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/005.yaml
  text: He lifted up his eyes and saw the women and the children[a], and he said, “Who are these with you?” And he said[b], “The children whom God has graciously given to your servant.”
translation:
  language: te
  text: అతడు కన్నులెత్తి స్త్రీలను, పిల్లలను చూసి, “నీతో ఉన్న వీరెవరు?[a]” అని అడిగాడు. అందుకు అతడు, “దేవుడు నీ సేవకునికి దయతో అనుగ్రహించిన[b] పిల్లలు” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీకు వీరు ఎవరు?” హీబ్రూ నుడికారం యాకోబుతో ఉన్నవారి గుర్తింపు లేదా అతనితో వారి సంబంధం గురించి అడుగుతోంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా సరళంగా, “ఇచ్చిన.” హీబ్రూ క్రియలో దయ లేదా అనుకూలత చూపి ఇవ్వడం అనే భావం కూడా ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא אֶת־עֵינָיו
  choice: కన్నులెత్తి
  rationale: ‘తన కన్నులను పైకెత్తాడు’ అనే హీబ్రూ నుడికారాన్ని సహజమైన తెలుగు కథనశైలిలో నిలుపుతూ, పైకి చూసిన భావాన్ని తెలియజేస్తుంది.
- source_word: וַיַּרְא
  choice: చూసి
  rationale: ראה అనే క్రియకు సందర్భానుకూలమైన సాధారణ అర్థం; ముందున్న నుడికారంతో సహజంగా కలుస్తుంది.
- source_word: הַנָּשִׁים
  choice: స్త్రీలను
  rationale: మూలపాఠంలోని విస్తృతార్థకమైన ‘స్త్రీలు’ అనే పదాన్నే ప్రతిబింబిస్తుంది; సందర్భం ఆధారంగా ‘భార్యలు’ అని మరింత నిర్దిష్టం చేయదు.
- source_word: הַיְלָדִים
  choice: పిల్లలను / పిల్లలు
  rationale: ఈ సందర్భంలో ילדים కు సహజమైన ఆధునిక తెలుగు సమానార్థకం; రెండు సందర్భాల్లోనూ ఒకే భావాన్ని నిలుపుతుంది.
- source_word: מִי אֵלֶּה לָּךְ
  choice: నీతో ఉన్న వీరెవరు?
  rationale: అక్షరార్థంగా ‘నీకు వీరు ఎవరు?’ అయినప్పటికీ, యాకోబుతో వచ్చినవారి గుర్తింపును అడిగే హీబ్రూ నుడికారాన్ని తెలుగులో సహజంగా వ్యక్తపరుస్తుంది; అక్షరార్థ రూపాన్ని పాదసూచికలో ఉంచింది.
- source_word: חָנַן
  choice: దయతో అనుగ్రహించిన
  rationale: కేవలం ‘ఇచ్చిన’ అనే భావమే కాక, దయచూపి ప్రసాదించిన భావాన్ని కూడా ఈ క్రియ కలిగి ఉంది; ‘దయతో అనుగ్రహించిన’ ఆ సూక్ష్మార్థాన్ని సహజంగా నిలుపుతుంది.
- source_word: אֱלֹהִים
  choice: దేవుడు
  rationale: ఇక్కడ ఏకవచన దైవసూచకంగా వాడిన אֱלֹהִים కు ప్రామాణిక తెలుగు రూపం.
- source_word: עַבְדֶּךָ
  choice: నీ సేవకునికి
  rationale: ఏశావుతో మాట్లాడేటప్పుడు యాకోబు వినయపూర్వకంగా తనను తాను సూచించుకునే సామాజిక ప్రయోగాన్ని వ్యక్తపరుస్తుంది; ‘బానిస’ అని అనవసరంగా కఠినార్థం చేయదు.
theological_decisions:
- issue: యాకోబు జవాబులో దేవుని దయాభావం
  choice: పిల్లలను దేవుడు దయతో అనుగ్రహించినవారిగా పేర్కొనడం
  alternative: దేవుడు నీ సేవకునికి ఇచ్చిన పిల్లలు
  rationale: חנן అనే క్రియలో దయ లేదా అనుకూలత చూపి ఇవ్వడం అనే భావం ఉంది. అందువల్ల అదనపు సిద్ధాంతార్థాన్ని చేర్చకుండా దైవానుగ్రహపు సూక్ష్మతను అనువాదం నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే సహజమైన, గౌరవప్రదమైన కథనశైలి. మూలంలోని ‘స్త్రీలు’ అనే విస్తృత పదాన్ని, ఇద్దరు వక్తలకూ వాడిన ‘అతడు’ అనే సూచనను మార్చకుండా ఉంచి, హీబ్రూ నుడికారంలోని సందిగ్ధతను పాదసూచికలో తెలిపింది.
