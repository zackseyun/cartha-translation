  source_fidelity: హీబ్రూ వాక్యనిర్మాణంలోని క్రమాన్ని, రెండు సార్లు వచ్చిన ‘పిల్లలు’ను, ‘స్త్రీలు’ అనే విస్తృత పదాన్ని, అలాగే ఏశావుకు యాకోబు చేసుకున్న వినయపూర్వక స్వీయసూచనను అనువాదం విశ్వసనీయంగా ప్రతిబింబిస్తుంది. ‘కన్నులెత్తి … చూసి’ వాడుక וַיִּשָּׂא אֶת־עֵינָיו וַיַּרְא అనే క్రమానికి తగినది. ‘దయతో అనుగ్రహించిన’ חָנַן లోని అనుగ్రహ/కృప భావాన్ని సముచితంగా తెలియజేస్తుంది.
