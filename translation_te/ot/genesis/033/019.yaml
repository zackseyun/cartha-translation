id: GEN.33.19
reference: Genesis 33:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּ֜קֶן אֶת חֶלְקַ֣ת הַ/שָּׂדֶ֗ה אֲשֶׁ֤ר נָֽטָה שָׁם֙ אָהֳל֔/וֹ מִ/יַּ֥ד בְּנֵֽי חֲמ֖וֹר אֲבִ֣י שְׁכֶ֑ם בְּ/מֵאָ֖ה קְשִׂיטָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/019.yaml
  text: And he bought the portion of the field where he had pitched his tent[a], from the hand of the sons of Hamor, the father of Shechem, for a hundred qesitahs.
translation:
  language: te
  text: అతడు తన గుడారం వేసిన పొలంలోని భాగాన్ని షెకెము తండ్రియైన హమోరు కుమారుల నుండి నూరు కెసీతాలు[a] చెల్లించి కొన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీలో “కెసీతా”; ఇది ఖచ్చితమైన విలువ తెలియని ప్రాచీన చెల్లింపు ప్రమాణం లేదా చెల్లింపు వస్తువు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקֶן
  choice: కొన్నాడు
  rationale: భూమి లావాదేవీ సందర్భంలో קנה అనే క్రియకు ‘కొను’ అనే అర్థమే సహజమైనది; ధర ప్రస్తావన కూడా దీనిని బలపరుస్తుంది.
- source_word: חֶלְקַת הַשָּׂדֶה
  choice: పొలంలోని భాగాన్ని
  rationale: חֶלְקָה అనేది పొలంలో నిర్వచితమైన భాగం లేదా భూభాగాన్ని సూచిస్తుంది; ఈ అనువాదం మూలార్థాన్ని అతిగా నిర్దిష్టం చేయకుండా సహజంగా తెలియజేస్తుంది.
- source_word: אֲשֶׁר נָטָה שָׁם אָהֳלוֹ
  choice: తన గుడారం వేసిన
  rationale: נטה మరియు אֹהֶל కలయిక గుడారం వేయడాన్ని సూచించే సాధారణ హెబ్రీ నుడికారం. తెలుగులో ‘గుడారం వేసిన’ సహజంగా ఉంటుంది.
- source_word: מִיַּד
  choice: దగ్గర
  rationale: అక్షరార్థంగా ‘చేతినుండి’ అయినప్పటికీ, ఇక్కడ యాజమాన్యదారుల నుండి కొనుగోలు చేయడమే భావం. ఆధునిక తెలుగులో వ్యక్తి దగ్గర కొనడం అనే ప్రయోగం స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: בְּנֵי חֲמוֹר
  choice: హమోరు కుమారులు
  rationale: నిర్మాణాన్ని నేరుగా అనుసరించి హమోరు కుమారులను విక్రేతలుగా గుర్తిస్తుంది.
- source_word: אֲבִי שְׁכֶם
  choice: షెకెము తండ్రి
  rationale: ఈ అనుబంధ పదబంధం హమోరును షెకెము తండ్రిగా గుర్తిస్తుంది; మూలంలోని సంబంధాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: בְּמֵאָה קְשִׂיטָה
  choice: నూరు కెసీటాలకు
  rationale: קְשִׂיטָה యొక్క ఖచ్చితమైన విలువ తెలియదు కాబట్టి ఊహాత్మక ఆధునిక ద్రవ్యపదాన్ని వాడకుండా మూలపదాన్ని లిప్యంతరీకరించాం. ధరను తెలుగులో సహజంగా సూచించేందుకు బహువచన విభక్తి వాడాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన కథన శైలి. భూమి కొనుగోలు భావాన్ని సహజంగా వ్యక్తం చేస్తూనే, తెలియని ప్రాచీన ద్రవ్యపదాన్ని లిప్యంతరీకరణలో నిలిపాం.
