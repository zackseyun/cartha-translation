revisions:
- from: అప్పుడు ఏశావు, “నాతో ఉన్న కొందరిని నీ దగ్గర ఉంచిపోనివ్వు” అన్నాడు. అందుకు యాకోబు, “అదెందుకు? నా ప్రభువు దృష్టిలో నాకు దయ దొరికితే చాలు” అన్నాడు.
  to: అప్పుడు ఏశావు, “నాతో ఉన్నవారిలో కొందరిని నీతో ఉంచిపోనివ్వు” అన్నాడు. అందుకు యాకోబు, “అదెందుకు? నా ప్రభువు దృష్టిలో నాకు దయ దొరకుగాక” అన్నాడు.
  rationale: The revision replaces ‘నీ దగ్గర’ with ‘నీతో’ to reflect עִמְּךָ and removes the interpretive conditional and ‘చాలు.’ The optative ‘దొరకుగాక’ represents אֶמְצָא while preserving the Hebrew’s brevity and contextual ambiguity.
