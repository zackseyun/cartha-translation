source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר עֵשָׂ֔ו אַצִּֽיגָה נָּ֣א עִמְּ/ךָ֔ מִן הָ/עָ֖ם אֲשֶׁ֣ר אִתִּ֑/י וַ/יֹּ֨אמֶר֙ לָ֣/מָּה זֶּ֔ה אֶמְצָא חֵ֖ן בְּ/עֵינֵ֥י אֲדֹנִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/015.yaml
  text: Then Esau said, “Please let me leave with you some of the people who are with me.” But he said, “Why is this? Let me find favor in the eyes of my lord.”
translation:
  language: te
  text: అప్పుడు ఏశావు, “నాతో ఉన్నవారిలో కొందరిని నీతో ఉంచిపోనివ్వు” అన్నాడు. అందుకు యాకోబు, “అదెందుకు? నా ప్రభువు దృష్టిలో నాకు దయ దొరకుగాక” అన్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַצִּיגָה נָּא
  choice: ఉంచిపోనివ్వు
  rationale: హిఫీల్ రూపంలోని ‘నిలబెట్టు/ఉంచు’ భావాన్ని, ప్రయాణ సందర్భంలో కొందరిని యాకోబుతో విడిచిపెట్టి వెళ్లాలనే సహజ తెలుగు భావంతో వ్యక్తపరుస్తుంది.
- source_word: מִן הָעָם אֲשֶׁר אִתִּי
  choice: నాతో ఉన్న కొందరిని
  rationale: מן ఇక్కడ సమూహంలో కొంత భాగాన్ని సూచిస్తుంది; అందువల్ల ‘నాతో ఉన్న ప్రజలలో కొందరిని’ అనే భావాన్ని సంక్షిప్తంగా అందిస్తుంది.
- source_word: לָמָּה זֶּה
  choice: అదెందుకు?
  rationale: అక్షరార్థంగా ‘ఇది ఎందుకు?’; ఏశావు ప్రతిపాదన అవసరం లేదని మర్యాదగా ప్రశ్నించే సహజ తెలుగు రూపం.
- source_word: אֶמְצָא חֵן בְּעֵינֵי אֲדֹנִי
  choice: నా ప్రభువు దృష్టిలో నాకు దయ దొరికితే చాలు
  rationale: ‘దృష్టిలో దయ పొందు’ అనే హీబ్రూ మర్యాదా ప్రయోగాన్ని నిలుపుతూ, సందర్భంలో ప్రతిపాదనను వినయంగా తిరస్కరించే అంతర్భావాన్ని ‘చాలు’ ద్వారా సహజంగా తెలుపుతుంది.
theological_decisions:
- issue: ‘నా ప్రభువు’ అనే సంబోధన
  choice: మానవ గౌరవసూచక సంబోధనగా చిన్న అక్షరార్థంలోని ‘నా ప్రభువు’
  alternative: దైవనామం లేదా దేవునికి ఉద్దేశించిన ‘ప్రభువు’గా అర్థం చేయడం
  rationale: సందర్భంలో యాకోబు ఏశావును గౌరవంగా సంబోధిస్తున్నాడు; אֲדֹנִי ఇక్కడ ఏకవచన స్వామ్యప్రత్యయంతో ఉన్న మానవ సంబోధన.
- issue: చివరి వాక్యపు భావసంబంధం
  choice: దయ లభిస్తే అదే చాలన్న వినయపూర్వక నిరాకరణ
  alternative: భవిష్యత్తులో దయ పొందాలనే స్వతంత్ర అభ్యర్థన
  rationale: హీబ్రూ వాక్యం సంక్షిప్తంగా ఉండి కొంత అంతర్భావాన్ని వదిలిపెడుతుంది. సందర్భం నిరాకరణను సూచించినా, అనవసరమైన కారణాన్ని జోడించకుండా మూలంలోని మర్యాదా ప్రయోగాన్ని కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన సంభాషణా శైలి. రెండవ వక్తను స్పష్టత కోసం ‘యాకోబు’గా పేర్కొన్నాం; మూలంలో కేవలం ‘అతడు అన్నాడు’ అని ఉంది. పాదటిప్పణులు లేవు.
