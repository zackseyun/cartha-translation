  yaml_path: translation/ot/genesis/033/012.yaml
  text: Then he said[a], “Let us set out and go, and I will go before you.”
translation:
  language: te
  text: అప్పుడు అతడు, “మనం బయలుదేరి వెళ్దాం; నేను నీ ముందు[a] వెళ్తాను” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీతో పాటు.”
    reason: לְנֶגְדֶּךָ అనే పదబంధం ఈ సందర్భంలో ‘నీ ముందు’ లేదా ‘నీతో పాటు’ అనే భావాలను ఇవ్వగలదు.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు అతడు … అన్నాడు
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది. ఆధునిక తెలుగులో సహజమైన వాక్యనిర్మాణం కోసం పలుకును ఉద్ధరణలో ఉంచి ‘అన్నాడు’ను చివర పెట్టాం.
- source_word: נִסְעָה
  choice: మనం బయలుదేరి
  rationale: נסע యొక్క మొదటి పురుష బహువచన కోహోర్టేటివ్ రూపం కలిసి ప్రయాణం ప్రారంభిద్దామనే ప్రతిపాదనను వ్యక్తం చేస్తుంది; ‘బయలుదేరి’ ప్రయాణ సందర్భంలో సహజంగా ఉంది.
- source_word: וְנֵלֵכָה
  choice: వెళ్దాం
  rationale: הלך ఇక్కడ నడవడం కంటే ప్రయాణిస్తూ ముందుకు సాగడాన్ని సూచిస్తుంది. ముందున్న కోహోర్టేటివ్‌తో కలిసి ప్రతిపాదన భావాన్ని స్పష్టంగా ఇస్తుంది.
- source_word: וְאֵלְכָה
  choice: నేను … వెళ్తాను
  rationale: మొదటి పురుష ఏకవచన రూపం ఏశావు తాను కూడా వెళ్లనున్నట్లు చేసిన ప్రతిపాదనను సూచిస్తుంది; ‘వెళ్తాను’ ఆధునిక తెలుగులో సహజం.
- source_word: לְנֶגְדֶּךָ
  choice: నీకు ముందుగా
  rationale: נגד ఎదుట, ముందుగా, సమాంతరంగా అనే భావాలను కలిగి ఉండవచ్చు. ఈ ప్రయాణ సందర్భంలో ‘నీకు ముందుగా’ ప్రాథమిక అర్థాన్ని నేరుగా వ్యక్తం చేస్తుంది; తోడుగా వెళ్లే భావాన్ని పాదటిప్పణిలో ఉంచాం.
