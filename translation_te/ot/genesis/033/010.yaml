reference: Genesis 33:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יַעֲקֹ֗ב אַל נָא֙ אִם נָ֨א מָצָ֤אתִי חֵן֙ בְּ/עֵינֶ֔י/ךָ וְ/לָקַחְתָּ֥ מִנְחָתִ֖/י מִ/יָּדִ֑/י כִּ֣י עַל כֵּ֞ן רָאִ֣יתִי פָנֶ֗י/ךָ כִּ/רְאֹ֛ת פְּנֵ֥י אֱלֹהִ֖ים וַ/תִּרְצֵֽ/נִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/010.yaml
  text: Jacob said[a], “No, please. If I have found favor in your eyes, then take my gift from my hand, because seeing your face is like seeing the face of God[c][b], and you have received me favorably.”
translation:
  language: te
  text: 'యాకోబు ఇలా అన్నాడు: “కాదు, దయచేసి. నీ దృష్టిలో నాకు ఆదరణ లభించి ఉంటే, నా కానుకను[a] నా చేతినుండి స్వీకరించు. అందుకే నేను నీ ముఖాన్ని దేవుని ముఖాన్ని చూసినట్లుగా చూశాను[c]; నీవు నన్ను అనుకూలంగా స్వీకరించావు[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నా బహుమతిని’ అని కూడా అనువదించవచ్చు. హీబ్రూ מִנְחָה అనే పదం కానుక, కప్పం లేదా అర్పణను సూచించగలదు; ఇక్కడ ఏశావును ప్రసన్నం చేసేందుకు యాకోబు తెచ్చిన కానుకను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘నీవు నన్ను అంగీకరించావు’ లేదా ‘నాపట్ల సంతోషించావు’ అని కూడా అనువదించవచ్చు. హీబ్రూ క్రియ అనుకూలంగా స్వీకరించడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: ‘ఒక దేవుని ముఖాన్ని’ అని కూడా అనువదించే అవకాశం ఉంది. అయితే యాకోబు పెనీయేలులో దేవునితో ఎదుర్కొన్న అనుభవం (ఆది 32:30) కారణంగా ఇక్కడ ‘దేవుని’ అనే అర్థమే సందర్భానికి బాగా సరిపోతుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: חֵן
  choice: ఆదరణ
  rationale: ‘నీ దృష్టిలో ఆదరణ లభించడం’ అనే సహజమైన వ్యక్తుల మధ్య అంగీకార భావాన్ని ఇస్తుంది; ప్రత్యేకమైన సిద్ధాంతార్థాన్ని మోపగల ‘కృప’ను నివారిస్తుంది.
- source_word: בְּעֵינֶיךָ
  choice: నీ దృష్టిలో
  rationale: హీబ్రూ నుడికారంలోని భావాన్ని ఆధునిక తెలుగులో సహజంగా, స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: מִנְחָתִי
  choice: నా కానుక
  rationale: ఇక్కడ ఏశావును ప్రసన్నం చేసేందుకు యాకోబు ఇచ్చే బహుమతిని సూచిస్తుంది; ‘అర్పణ’ అనడం ఆరాధనా సంబంధమైన అర్థాన్ని తప్పుగా సూచించవచ్చు.
- source_word: מִיָּדִי
  choice: నా చేతిలోనుండి
  rationale: వ్యక్తిగతంగా అందిస్తున్న దృశ్యాన్ని నిలుపుతూ హీబ్రూ భాషలోని స్పష్టమైన రూపకాన్ని కాపాడుతుంది.
- source_word: עַל־כֵּן
  choice: ఎందుకంటే
  rationale: కానుకను స్వీకరించమని యాకోబు కోరడానికి గల కారణాన్ని తెలుగులో సహజంగా పరిచయం చేస్తుంది.
- source_word: רָאִיתִי פָנֶיךָ
  choice: నీ ముఖాన్ని చూశాను
  rationale: మూలంలోని ప్రత్యక్ష వాక్యనిర్మాణాన్ని, తరువాతి పోలికను స్పష్టంగా నిలుపుతుంది.
- source_word: כִּרְאֹת פְּנֵי אֱלֹהִים
  choice: దేవుని ముఖాన్ని చూసినట్లు
  rationale: పెనీయేలు సంఘటనతో ఉన్న కథన సంబంధాన్ని నిలుపుతూ, మూలంలోని బలమైన దైవసంబంధ పోలికను తగ్గించకుండా అందిస్తుంది.
- source_word: וַתִּרְצֵנִי
  choice: నీవు నన్ను ఆదరంగా స్వీకరించావు
  rationale: ఏశావు యాకోబును అనుకూలంగా అంగీకరించిన భావాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: אַל נָא אִם נָא
  choice: వద్దు, దయచేసి. … లభించినట్లయితే
  rationale: మర్యాదతో కూడిన యాకోబు పట్టుదలైన నిరాకరణను, దాని వెంట వచ్చే విజ్ఞప్తిని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ‘దేవుని ముఖాన్ని చూసినట్లు’ అనే పోలికలో אֱלֹהִים ఎవరిని సూచిస్తుంది?
  choice: దేవుడు
  alternative: ఒక దేవుడు / దైవిక జీవి
  rationale: ఈ పదానికి విస్తృత అర్థపరిధి ఉన్నప్పటికీ, యాకోబు పెనీయేలులో దేవుని ముఖాముఖిగా చూశానని చెప్పిన సమీప కథన సందర్భం ఇక్కడ ఏకవచనంగా ‘దేవుడు’ అనే అర్థానికే బలంగా మద్దతిస్తుంది. పోలికలోని ఉద్దేశపూర్వకమైన దైవసంబంధ ఉద్వేగాన్ని అనువాదం తగ్గించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ‘కృప’ వంటి అధిక సిద్ధాంతభారం కలిగిన పదానికి బదులుగా వ్యక్తుల మధ్య అనుకూలతను తెలిపే ‘ఆదరణ’ వాడబడింది. మూలంలోని ‘ముఖం చూడడం’ మరియు ‘చేతిలోనుండి’ అనే స్పష్టమైన చిత్రణలు నిలుపబడ్డాయి.
