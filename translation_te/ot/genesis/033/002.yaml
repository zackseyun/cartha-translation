  yaml_path: translation/ot/genesis/033/002.yaml
  text: And he put the female servants and their children first[a], and Leah and her children behind them, and Rachel and Joseph last.
translation:
  language: te
  text: అతడు దాసీలను, వారి పిల్లలను ముందు[a] ఉంచాడు; లేయాను, ఆమె పిల్లలను వారి వెనుక ఉంచాడు; రాహేలును, యోసేపును చివర ఉంచాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘దాసీలు’ అనే హెబ్రీ పదం తక్కువ హోదాలోని స్త్రీ గృహసేవకులను సూచించవచ్చు; కొన్ని సందర్భాల్లో దాని అర్థం ‘బానిస స్త్రీలు’ అనే భావంతో కలిసివుండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: ఉంచాడు
  rationale: שׂוּם అనే క్రియకు ‘పెట్టు, ఉంచు, అమర్చు’ అనే అర్థాలున్నాయి. ఇక్కడ సమూహాలను వరుసగా అమర్చడాన్ని ‘ఉంచాడు’ సహజంగా తెలియజేస్తుంది.
- source_word: הַשְּׁפָחוֹת
  choice: దాసీలను
  rationale: שִׁפְחָה తక్కువ సామాజిక హోదాలోని స్త్రీ సేవకురాలిని లేదా బానిస స్త్రీని సూచించగలదు. ఆధునిక తెలుగు వాడుకలో ‘దాసీలు’ సంక్షిప్తంగా ఉండి, మూలంలోని గృహహోదాను నిలుపుతుంది; ‘ఉపపత్నులు’ అనడం ఈ సందర్భంలో అతివ్యాఖ్యానం అవుతుంది.
- source_word: יַלְדֵיהֶן
  choice: వారి పిల్లలను
  rationale: יֶלֶד ఇక్కడ కేవలం కుమారులనే కాక పిల్లలను సాధారణంగా సూచిస్తుంది.
- source_word: רִאשֹׁנָה
  choice: ముందు
  rationale: ఈ క్రియావిశేషణ రూపం అమరికలో తొలి స్థానాన్ని సూచిస్తుంది. సందర్భం స్థలపరమైన వరుసను వర్ణిస్తున్నందున ‘ముందు’ సహజంగా సరిపోతుంది.
- source_word: לֵאָה
  choice: లేయా
  rationale: తెలుగు బైబిలు వాడుకకు అనుగుణమైన పేరురూపం.
- source_word: וִילָדֶיהָ
  choice: ఆమె పిల్లలను
  rationale: మూలంలోని విస్తృతార్థాన్ని నిలుపుతూ, తెలుగులో సహజమైన కర్మరూపం వాడబడింది.
- source_word: אַחֲרֹנִים
  choice: వారి వెనుక
  rationale: మూడు సమూహాల అమరికలో మధ్య సమూహం మొదటి సమూహం తరువాత ఉందని ఇది సూచిస్తుంది; ‘వారి వెనుక’ స్థలపరమైన క్రమాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: רָחֵל
  choice: రాహేలు
  rationale: తెలుగు బైబిలు వాడుకకు అనుగుణమైన పేరురూపం.
- source_word: יוֹסֵף
  choice: యోసేపు
  rationale: తెలుగు బైబిలు వాడుకకు అనుగుణమైన పేరురూపం.
- source_word: אַחֲרֹנִים
  choice: చివర
  rationale: చివరి సమూహం వరుసలో వెనుక భాగంలో ఉందని సహజంగా, ఖచ్చితంగా తెలియజేస్తుంది.
