  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. హెబ్రీ వాక్యంలోని మూడు సమూహాల క్రమాన్ని అర్ధవిరామాలతో స్పష్టంగా నిలిపి, మొదటి אַחֲרֹנִים‌ను ‘వారి వెనుక’గా, చివరిదాన్ని ‘చివర’గా అనువదించాం.
