reference: Genesis 33:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: קַח נָ֤א אֶת בִּרְכָתִ/י֙ אֲשֶׁ֣ר הֻבָ֣את לָ֔/ךְ כִּֽי חַנַּ֥/נִי אֱלֹהִ֖ים וְ/כִ֣י יֶשׁ לִ/י כֹ֑ל וַ/יִּפְצַר בּ֖/וֹ וַ/יִּקָּֽח־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/011.yaml
  text: Please take my gift that has been brought to you, because God has dealt graciously with me, and because I have everything. And he urged him, and he took it.
translation:
  language: te
  text: “దయచేసి నీ దగ్గరికి తీసుకొచ్చిన నా కానుకను స్వీకరించు[a]. ఎందుకంటే దేవుడు నాపట్ల కృప చూపించాడు; నాకు అన్నీ ఉన్నాయి.” యాకోబు ఏశావును పట్టుబట్టి కోరగా, ఏశావు దాన్ని స్వీకరించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “నా దీవెనను.” ఇక్కడ ఈ పదం కానుకను సూచిస్తుంది.
    reason: హీబ్రూ పదంలోని అక్షరార్థమైన ‘దీవెన’ను, సందర్భార్థమైన ‘కానుక’తో పాటు పాఠకుడికి అందించడానికి.
lexical_decisions:
- source_word: בִּרְכָתִי (birkhati)
  choice: నా కానుకను
  rationale: మూలపదానికి అక్షరార్థం ‘నా దీవెన’; అయితే ఈ సందర్భంలో అది ఏశావుకు తీసుకొచ్చిన వస్తు కానుకను సూచిస్తుంది. సహజమైన తెలుగులో సందర్భార్థాన్ని ప్రధాన పాఠ్యంలో ఉంచి, అక్షరార్థాన్ని పాదటిప్పణిలో తెలిపాం.
- source_word: חַנַּנִי (ḥannani)
  choice: నాపట్ల కృప చూపించాడు
  rationale: దేవుడు యాకోబును అనుగ్రహంతో ఆదరించాడనే భావాన్ని సహజంగా, మూలంలోని కృపా భాషను నిలుపుతూ వ్యక్తపరుస్తుంది.
- source_word: יֶשׁ לִי כֹל (yesh li khol)
  choice: నాకు కావాల్సినదంతా ఉంది
  rationale: అక్షరార్థంగా ‘నాకు అన్నీ ఉన్నాయి.’ ఈ సందర్భంలో తనకు సమృద్ధిగా, అవసరమైనదంతా ఉందని యాకోబు చెప్పే భావాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: וַיִּפְצַר בּוֹ (vayyiftzar bo)
  choice: పట్టుబట్టి కోరగా
  rationale: సాధారణంగా అడగడం కంటే పదేపదే లేదా బలంగా ఒత్తిడి చేసి కోరడాన్ని సూచిస్తుంది.
- source_word: וַיִּקָּח (vayyiqqaḥ)
  choice: స్వీకరించాడు
  rationale: కానుకను కేవలం చేతితో తీసుకోవడం కాక, దాన్ని అంగీకరించడం ఈ సందర్భంలోని భావం.
theological_decisions:
- issue: בִּרְכָתִי అనే పదంలోని ‘దీవెన/కానుక’ భావసాంద్రత
  choice: ప్రధాన పాఠ్యంలో ‘నా కానుకను’; పాదటిప్పణిలో ‘నా దీవెనను’ అనే అక్షరార్థం
  alternative: ప్రధాన పాఠ్యంలో ‘నా దీవెనను’
  rationale: వస్తు బహుమతిని సూచించే తక్షణ సందర్భాన్ని స్పష్టంగా ఉంచుతూనే, యాకోబు–ఏశావు కథలో ‘దీవెన’ అనే పదానికి ఉండగల ప్రతిధ్వనిని తొలగించకుండా పాదటిప్పణిలో భద్రపరుస్తుంది.
- issue: చివరి రెండు క్రియల కర్తల గుర్తింపు
  choice: సందర్భానుసారం యాకోబు కోరాడు, ఏశావు స్వీకరించాడు అని పేర్లతో స్పష్టం చేయడం
  alternative: ‘అతడు అతణ్ణి కోరాడు; అతడు తీసుకున్నాడు’ అని మూలంలోని సర్వనామ నిర్మాణాన్ని అనుసరించడం
  rationale: హీబ్రూ సందర్భంలో కర్తలు స్పష్టమే; తెలుగులో వరుసగా ‘అతడు’ వాడితే అనవసరమైన అయోమయం కలుగుతుంది. పేర్లను చేర్చడం భావాన్ని మార్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. ప్రత్యక్ష సంభాషణ సహజంగా ఉండేలా ‘దయచేసి’ మరియు ‘స్వీకరించు’ వాడాం; కథన భాగంలో కర్తలను పేర్లతో స్పష్టం చేశాం.
