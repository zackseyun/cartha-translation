source:
  edition: WLC
  text: וְ/יַעֲקֹב֙ נָסַ֣ע סֻכֹּ֔תָ/ה וַ/יִּ֥בֶן ל֖/וֹ בָּ֑יִת וּ/לְ/מִקְנֵ֨/הוּ֙ עָשָׂ֣ה סֻכֹּ֔ת עַל כֵּ֛ן קָרָ֥א שֵׁם הַ/מָּק֖וֹם סֻכּֽוֹת־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/017.yaml
  text: And Jacob traveled to Succoth[a], and he built a house for himself and made shelters for his livestock. Therefore he called the name of the place Succoth.
translation:
  language: te
  text: యాకోబు సుక్కోతుకు[a] వెళ్లి, తన కోసం ఒక ఇల్లు కట్టుకున్నాడు; తన పశువుల కోసం పాకలు వేశాడు. అందుకే ఆ స్థలానికి సుక్కోతు అని పేరు పెట్టాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “సుక్కోతు” అనే పేరు, “పాకలు” లేదా “గుడారాలు” అని అర్థమిచ్చే హీబ్రూ పదంలా ధ్వనిస్తుంది.
    reason: స్థలనామానికీ దానికి కారణమైన సాధారణ నామవాచకానికీ మధ్య ఉన్న హీబ్రూ పదప్రయోగాన్ని తెలియజేయడానికి.
lexical_decisions:
- source_word: נָסַע
  choice: వెళ్లి
  rationale: ఈ క్రియ ఒక చోటు నుండి బయలుదేరి మరొక చోటుకు ప్రయాణించడాన్ని సూచిస్తుంది. కథన సందర్భంలో ‘వెళ్లి’ సహజమైన ఆధునిక తెలుగు.
- source_word: סֻכֹּתָה
  choice: సుక్కోతుకు
  rationale: దిశను సూచించే -ה ప్రత్యయం ఆ స్థలం వైపు గమనాన్ని తెలియజేస్తుంది. స్థలనామాన్ని అనువదించకుండా తెలుగు లిపిలో ధ్వన్యనుకరణగా ఇచ్చాం.
- source_word: וַיִּבֶן לוֹ בָּיִת
  choice: తన కోసం ఒక ఇల్లు కట్టుకున్నాడు
  rationale: לוֹ లోని ప్రయోజనార్థక భావాన్ని సహజమైన తెలుగులో ‘తన కోసం’ అని వ్యక్తం చేశాం; ‘కట్టుకున్నాడు’ అతడు తన ఉపయోగం కోసం నిర్మించుకున్నాడనే భావాన్ని ఇస్తుంది.
- source_word: מִקְנֵהוּ
  choice: తన పశువులు
  rationale: ఈ నామవాచకం సంపాదిత పశుసంపదను లేదా మందలను సూచిస్తుంది. ‘పశువులు’ అనేది ‘గోవులు’ కంటే విస్తృతమైన, సందర్భోచితమైన తెలుగు పదం.
- source_word: עָשָׂה סֻכֹּת
  choice: పాకలు వేశాడు
  rationale: సֻכּוֹת తాత్కాలిక కప్పులు లేదా ఆశ్రయాలను సూచిస్తుంది. పశువుల సందర్భంలో ‘పాకలు’ సాధారణ పాఠకులకు సహజంగా ఉండి, వాటి ఉపయోగాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: עַל כֵּן
  choice: అందుకే
  rationale: ఈ సూత్రవాక్యం స్థలనామానికి కారణాన్ని పరిచయం చేస్తుంది. ‘అందుకే’ కారణ-ఫల సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: קָרָא שֵׁם הַמָּקוֹם
  choice: ఆ స్థలానికి ... అని పేరు పెట్టాడు
  rationale: హీబ్రూ వాక్యరీతి అక్షరార్థంగా ‘ఆ స్థలం పేరును పిలిచాడు.’ ఆధునిక తెలుగులో ‘పేరు పెట్టాడు’ అదే నామకరణ భావాన్ని స్పష్టంగా, సహజంగా అందిస్తుంది.
- source_word: סֻכּוֹת
  choice: సుక్కోతు
  rationale: ఇది స్థలనామం కాబట్టి ధ్వన్యనుకరణగా ఉంచాం. అదే పదం ‘పాకలు/గుడారాలు’ అనే సాధారణ నామవాచకంతో కలిగిన పదప్రయోగాన్ని పాదసూచికలో వివరించాం.
