  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే గౌరవప్రదమైన కథన శైలి. స్థలనామాన్ని ధ్వన్యనుకరణగా ఉంచి, హీబ్రూ పదప్రయోగాన్ని పాదసూచికలో సంరక్షించాం.
