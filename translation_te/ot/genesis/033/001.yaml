  text: וַ/יִּשָּׂ֨א יַעֲקֹ֜ב עֵינָ֗י/ו וַ/יַּרְא֙ וְ/הִנֵּ֣ה עֵשָׂ֣ו בָּ֔א וְ/עִמּ֕/וֹ אַרְבַּ֥ע מֵא֖וֹת אִ֑ישׁ וַ/יַּ֣חַץ אֶת הַ/יְלָדִ֗ים עַל לֵאָה֙ וְ/עַל רָחֵ֔ל וְ/עַ֖ל שְׁתֵּ֥י הַ/שְּׁפָחֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/001.yaml
  text: Then Jacob lifted up his eyes and looked[a], and behold, Esau was coming, and with him were four hundred men. So he divided the children among Leah, Rachel[c][b], and the two female servants.
translation:
  language: te
  text: యాకోబు కళ్లెత్తి చూశాడు; ఇదిగో, ఏశావు వస్తున్నాడు, అతనితోపాటు నాలుగు వందల మంది ఉన్నారు. అప్పుడు యాకోబు పిల్లలను లేయాకు, రాహేలుకు, ఇద్దరు దాసీలకు పంచాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשָּׂא יַעֲקֹב עֵינָיו וַיַּרְא
  choice: యాకోబు తలెత్తి చూసినప్పుడు
  rationale: ‘కళ్లెత్తి చూశాడు’ అనే హెబ్రీయ వ్యక్తీకరణకు సహజమైన ఆధునిక తెలుగు రూపం. వరుస క్రియలను కాలసంబంధ ఉపవాక్యంగా మలచడం ద్వారా కథనం సాఫీగా ఉంటుంది.
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: ఏశావు సమీపిస్తున్న దృశ్యంపై అకస్మాత్తుగా దృష్టి నిలిపే హెబ్రీయ కథన సూచికను నిలుపుతుంది.
- source_word: בָּא
  choice: వస్తున్నాడు
  rationale: హెబ్రీయ కృదంతం ఏశావు అప్పుడే సమీపిస్తున్న కొనసాగుతున్న చర్యను సూచిస్తుంది.
- source_word: וְעִמּוֹ אַרְבַּע מֵאוֹת אִישׁ
  choice: అతనితోపాటు నాలుగు వందల మంది ఉన్నారు
  rationale: ఏశావుతో పెద్ద సమూహం ఉందనే భావాన్ని స్పష్టమైన సహజ తెలుగులో అందిస్తుంది.
- source_word: וַיַּחַץ אֶת הַיְלָדִים
  choice: పిల్లలను ... వేర్వేరుగా ఉంచాడు
  rationale: חצה ఇక్కడ పిల్లలను ఆయా తల్లులవద్ద గుంపులుగా విభజించడాన్ని సూచిస్తుంది; తెలుగులో ‘వేర్వేరుగా ఉంచాడు’ సందర్భార్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: עַל לֵאָה וְעַל רָחֵל וְעַל שְׁתֵּי הַשְּׁפָחוֹת
  choice: లేయా, రాహేలు, ఇద్దరు దాసీల దగ్గర
  rationale: పునరుక్త עַל పిల్లలను ఆయా స్త్రీలతో గుంపులుగా ఉంచడాన్ని సూచిస్తుంది. שְׁפָחוֹת‌కు ‘దాసీలు’ గృహసేవతోపాటు వారి అధీనస్థ సామాజిక స్థితినీ సంక్షిప్తంగా ప్రతిబింబిస్తుంది.
