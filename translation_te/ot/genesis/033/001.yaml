translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘ఇదిగో’ ద్వారా మూలంలోని సజీవ దృష్టి సూచికను నిలిపి, అతిగా ప్రాచీనంగా వినిపించే పదబంధాలను నివారించాం.
