  yaml_path: translation/ot/genesis/026/015.yaml
  text: All the wells that his father's servants had dug in the days of Abraham his father[c][b][a], the Philistines stopped up and filled them with earth.
translation:
  language: te
  text: అతని తండ్రియైన అబ్రాహాము కాలంలో అతని తండ్రి సేవకులు[b] తవ్విన బావులన్నిటినీ ఫిలిష్తీయులు మూసివేసి, మట్టితో[a][c] నింపేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘మట్టి’ అని అనువదించిన హీబ్రూ పదం עָפָר సందర్భానుసారం మట్టి, దుమ్ము లేదా నేల అని అర్థమివ్వగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘అతని తండ్రి దాసులు.’ హీబ్రూ עֶבֶד అనే పదం సేవకుడిని లేదా దాసుడిని సూచించగలదు; ఇక్కడ బానిసత్వ స్థితిని ప్రత్యేకంగా నొక్కిచెప్పడం లేదు.
    reason: lexical_alternative
  - marker: c
    text: లేదా ‘మన్నుతో నింపేశారు.’
    reason: previous_rendering
lexical_decisions:
- source_word: וְכָל הַבְּאֵרֹת
  choice: బావులన్నిటినీ
  rationale: כָל యొక్క సమగ్ర భావాన్ని ‘అన్నిటినీ’ తెలియజేస్తుంది; בְּאֵרֹת‌కు సహజమైన తెలుగు పదం ‘బావులు’. ప్రారంభ וְ కథన అనుసంధానాన్ని సూచించినా, తెలుగులో ప్రత్యేక సంధానపదం లేకుండానే సందర్భం ఆ సంబంధాన్ని సహజంగా మోస్తుంది.
- source_word: אֲשֶׁר חָפְרוּ
  choice: తవ్విన
  rationale: బావులను విశేషించే సంబంధ ఉపవాక్యాన్ని తెలుగులో సహజమైన కృదంత రూపంతో వ్యక్తం చేస్తుంది; తవ్వడం ముందుగా జరిగినదనే కాలసంబంధం సందర్భంలో స్పష్టంగా ఉంటుంది.
- source_word: עַבְדֵי אָבִיו
  choice: అతని తండ్రి సేవకులు
  rationale: עֶבֶד సేవకుడు లేదా దాసుడు అనే అర్థాలు ఇవ్వగలదు. ఈ సందర్భంలో బానిసత్వ స్థితిని ప్రత్యేకంగా నొక్కిచెప్పనందున ‘సేవకులు’ ప్రధాన పాఠంలో సహజంగా ఉంది; ప్రత్యామ్నాయం పాదసూచికలో ఉంచబడింది.
- source_word: בִּימֵי אַבְרָהָם אָבִיו
  choice: అతని తండ్రి అబ్రాహాము కాలంలో
  rationale: ‘అబ్రాహాము అతని తండ్రి’ అనే మూలంలోని పునరుక్త బంధాన్ని నిలుపుతూ, בִּימֵי అనే కాలసూచక నుడికారాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: סִתְּמוּם
  choice: మూసివేసి
  rationale: బావులను ఉపయోగించలేనట్లు అడ్డగించడం లేదా మూసివేయడం అనే క్రియ యొక్క సందర్భార్థాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: פְּלִשְׁתִּים
  choice: ఫిలిష్తీయులు
  rationale: ఈ ప్రజాసమూహానికి ప్రామాణిక తెలుగు లిప్యంతరీకరణ.
- source_word: וַיְמַלְאוּם עָפָר
  choice: మట్టితో నింపేశారు
  rationale: క్రియపై ఉన్న బహువచన కర్మప్రత్యయం బావులను సూచిస్తుంది; తెలుగులో ‘బావులన్నిటినీ’ అనే ముందస్తు కర్మ రెండు క్రియలకూ సహజంగా వర్తిస్తుంది. עָפָר ఇక్కడ బావుల్లో వేసిన మట్టి/నేల పదార్థాన్ని సూచిస్తుంది.
