translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు స్పష్టంగా, గౌరవప్రదంగా ఉండే వాక్యనిర్మాణం వాడబడింది. మూలంలోని ‘అతని తండ్రి’ అనే ద్విగుణ సూచనను తొలగించకుండా నిలుపుకున్నాం; అయితే తెలుగులో సహజమైన పదక్రమం కోసం కాలసూచక భాగాన్ని ముందుకు తెచ్చాం.
