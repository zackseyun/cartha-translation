source:
  edition: WLC
  text: וַ/יָּרִ֜יבוּ רֹעֵ֣י גְרָ֗ר עִם רֹעֵ֥י יִצְחָ֛ק לֵ/אמֹ֖ר לָ֣/נוּ הַ/מָּ֑יִם וַ/יִּקְרָ֤א שֵֽׁם הַ/בְּאֵר֙ עֵ֔שֶׂק כִּ֥י הִֽתְעַשְּׂק֖וּ עִמּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/020.yaml
  text: Then the shepherds of Gerar quarreled with Isaac’s shepherds[a], saying, “The water is ours.” So he named the well Esek, because they had quarreled with him.
translation:
  language: te
  text: అప్పుడు గెరారు కాపరులు ఇస్సాకు కాపరులతో గొడవపడ్డారు. “ఈ నీళ్లు మావే” అని అన్నారు. అందుచేత అతడు ఆ బావికి ఏశెక్[a] అని పేరు పెట్టాడు, ఎందుకంటే వారు అతనితో వివాదపడ్డారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ఏశెక్” అనే పేరు హీబ్రూలో “వివాదం” లేదా “తగాదా” అని అర్థమిచ్చే పదంతో సంబంధం కలిగి ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּרִיבוּ
  choice: గొడవపడి
  rationale: ריב ఇక్కడ నీటి హక్కు విషయంగా జరిగిన వాగ్వివాదాన్ని సూచిస్తుంది. ‘గొడవపడ్డారు’ ఆధునిక తెలుగులో సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: רֹעֵי גְרָר
  choice: గెరారు కాపరులు
  rationale: רֹעִים మందలను మేపేవారిని సూచిస్తుంది. ‘కాపరులు’ సాధారణ పాఠకులకు సహజమైన విస్తృత పదం.
- source_word: עִם רֹעֵי יִצְחָק
  choice: ఇస్సాకు కాపరులతో
  rationale: మొదటి పదబంధంతో సమాంతరతను నిలుపుతూ, సంబంధాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לֵאמֹר לָנוּ הַמָּיִם
  choice: “ఈ నీళ్లు మావే” అన్నారు
  rationale: హీబ్రూ వాక్యం అక్షరార్థంగా ‘నీళ్లు మాకు’ అనే సంక్షిప్త స్వామ్య ప్రకటన. సందర్భంలోని నిర్దిష్ట బావి నీటిని తెలుగులో సహజంగా చూపేందుకు ‘ఈ నీళ్లు మావే’ ఎంచుకున్నాం.
- source_word: וַיִּקְרָא שֵׁם הַבְּאֵר
  choice: అందుచేత అతడు ఆ బావికి ... అని పేరు పెట్టాడు
  rationale: ‘పేరును పిలిచాడు’ అనే హీబ్రూ నుడికారాన్ని సహజ తెలుగులో ‘పేరు పెట్టాడు’గా ఇచ్చాం. సందర్భ ఫలిత సంబంధాన్ని ‘అందుచేత’ తెలియజేస్తుంది.
- source_word: עֵשֶׂק
  choice: ఏశెకు
  rationale: బావి పేరును అనువదించకుండా లిప్యంతరీకరించాం; దాని పదార్థ సంబంధాన్ని పాదసూచిక వివరిస్తుంది.
- source_word: כִּי הִתְעַשְּׂקוּ עִמּוֹ
  choice: ఎందుకంటే వారు అతనితో వివాదపడ్డారు
  rationale: ఈ క్రియ עֵשֶׂק అనే పేరుకు సజాతీయం. ‘వివాదపడ్డారు’ పేరు వెనుకనున్న భావాన్ని స్పష్టంగా తెలియజేస్తూ, ముందు వచ్చిన ‘గొడవపడి’కి యాంత్రిక పునరుక్తిని నివారిస్తుంది. ఏకవచన ‘అతనితో’ ఇస్సాకును సూచిస్తుంది.
