source:
  edition: WLC
  text: וַ/יְצַ֣ו אֲבִימֶ֔לֶךְ אֶת כָּל הָ/עָ֖ם לֵ/אמֹ֑ר הַ/נֹּגֵ֜עַ בָּ/אִ֥ישׁ הַ/זֶּ֛ה וּ/בְ/אִשְׁתּ֖/וֹ מ֥וֹת יוּמָֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/011.yaml
  text: Then Abimelech commanded all the people[a], saying, “Whoever touches this man or his wife shall surely be put to death.”
translation:
  language: te
  text: 'అప్పుడు అబీమెలెకు ప్రజలందరికీ ఇలా ఆజ్ఞాపించాడు: “ఈ మనిషినిగాని అతని భార్యనుగాని తాకేవాడు తప్పకుండా చంపబడతాడు.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְצַו
  choice: ఆజ్ఞాపించాడు
  rationale: పియేల్ రూపం అధికారపూర్వకమైన ఆజ్ఞను జారీ చేయడాన్ని సూచిస్తుంది; ‘ఆజ్ఞాపించాడు’ దాని బలాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: כָּל הָעָם
  choice: ప్రజలందరికీ
  rationale: ఇక్కడ עַם అనేది అబీమెలెకు అధికారంలో ఉన్న ప్రజలను సాధారణంగా సూచిస్తుంది; ‘ప్రజలందరికీ’ సమగ్రతను సహజంగా తెలియజేస్తుంది.
- source_word: לֵאמֹר
  choice: ఇలా
  rationale: ఉల్లేఖన విషయాన్ని పరిచయం చేసే ఈ రూపాన్ని తెలుగులో ‘ఇలా ఆజ్ఞాపించాడు’ అని సహజంగా వ్యక్తం చేయవచ్చు.
- source_word: הַנֹּגֵעַ
  choice: తాకేవాడు
  rationale: నిర్దిష్ట ఉపపదంతో ఉన్న కృదంతం సాధారణ నియమంగా ‘తాకే వ్యక్తి/ఎవరైతే తాకుతారో’ అనే భావం ఇస్తుంది. ‘తాకేవాడు’ మూలంలోని సాధారణ పదార్థాన్ని నిలుపుతుంది; హాని చేయడం అనే బలమైన భావాన్ని అనవసరంగా చేర్చదు.
- source_word: בָּאִישׁ הַזֶּה
  choice: ఈ మనిషిని
  rationale: נגעతో ב తాకబడే కర్మను సూచిస్తుంది; తెలుగులో ద్వితీయావిభక్తితో ‘ఈ మనిషిని’ అనడం సహజం.
- source_word: וּבְאִשְׁתּוֹ
  choice: గాని అతని భార్యనుగాని
  rationale: రెండవ రక్షిత వ్యక్తిని ప్రత్యామ్నాయ సముచ్చయంగా తెలుగులో సహజంగా కలుపుతుంది; אִשָּׁהకు ఈ సందర్భంలో ‘భార్య’ సరైన అర్థం.
- source_word: מוֹת יוּמָת
  choice: తప్పకుండా చంపబడతాడు
  rationale: క్రియానామం మరియు హోఫాల్ అసంపూర్ణ క్రియ కలయిక శిక్ష యొక్క నిశ్చయాన్ని బలపరుస్తుంది. కర్మణి రూపాన్ని ‘చంపబడతాడు’ నిలుపుతుంది; ‘తప్పకుండా’ తీవ్రతను తెలియజేస్తుంది.
