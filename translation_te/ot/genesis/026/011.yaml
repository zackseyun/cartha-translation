translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకులకు స్పష్టమైన శైలి. మూలంలోని అధికారపూర్వక ఆజ్ఞ, సాధారణ నిషేధం, నిశ్చిత మరణశిక్ష అన్నీ నిలుపబడ్డాయి. ఈ వాక్యంలో అవసరమైన పాఠాంతర లేదా వ్యాఖ్యానాత్మక పాదటిప్పణి లేదు; ఇంగ్లీషు పాదటిప్పణిలోని అక్షరార్థ ప్రత్యామ్నాయం తెలుగులో ప్రధాన పాఠమైన ‘తాకేవాడు’ ద్వారానే ప్రతిఫలించింది.
