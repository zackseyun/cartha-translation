    text: లేదా, ‘విందు’; హీబ్రూ పదం పానీయానికి ముఖ్య స్థానం ఉన్న విందును కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: సిద్ధం చేశాడు
  rationale: עשה అనే క్రియకు అక్షరార్థంగా ‘చేశాడు’ అని అర్థం; అయితే מִשְׁתֶּה దాని కర్మగా ఉన్నందున, విందును ఏర్పాటు చేసిన భావాన్ని సహజమైన తెలుగులో ‘సిద్ధం చేశాడు’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: לָהֶם
  choice: వారి కోసం
  rationale: ఇక్కడ ל ఉపసర్గ క్రియ వల్ల ప్రయోజనం పొందినవారిని సూచిస్తుంది; ఆధునిక తెలుగులో ‘వారి కోసం’ సహజమైన అనువాదం.
- source_word: מִשְׁתֶּה
  choice: విందు
  rationale: ఈ పదం పానీయం ముఖ్య భాగంగా ఉండే విందు లేదా భోజన వేడుకను సూచించగలదు. తరువాత ‘తిని తాగారు’ అని స్పష్టంగా ఉన్నందున ‘విందు’ సహజంగా, సమగ్రంగా సరిపోతుంది.
- source_word: וַיֹּאכְלוּ
  choice: వారు తిని
  rationale: אכל క్రియను నేరుగా ప్రతిబింబిస్తుంది; తరువాతి సమన్వయ క్రియతో కలిపి ‘తిని తాగారు’ అనడం సహజమైన తెలుగు.
- source_word: וַיִּשְׁתּוּ
  choice: తాగారు
  rationale: שתה క్రియకు నేరమైన అనువాదం; ఒకే కర్తకు చెందిన వరుస చర్యలను తెలుగులో ‘తిని తాగారు’ అని సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions: []
translation_notes:
  register: సాధారణ ఆధునిక పాఠకులకు అర్థమయ్యే, గౌరవప్రదమైన ప్రామాణిక తెలుగు వాడబడింది. హీబ్రూ కథన క్రమాన్ని ‘అప్పుడు’తో సూచించి, ‘తిని తాగారు’ అనే సహజమైన తెలుగు క్రియా సమన్వయాన్ని ఎంచుకున్నాం.
