  text: And they were a bitterness of spirit to Isaac and Rebekah[a][b][c].
translation:
  language: te
  text: వారు ఇస్సాకుకూ రిబ్కాకూ మనోవేదనకు కారణమయ్యారు.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారు ఇస్సాకుకూ రిబ్కాకూ మనోవేదనగా ఉన్నారు.”
    reason: హీబ్రూ క్రియను ‘ఉన్నారు’ లేదా సందర్భానుసారం ‘అయ్యారు’ అని అర్థం చేసుకోవచ్చు; మూలంలోని నామవాచక విధానాన్ని ఇది దగ్గరగా ప్రతిబింబిస్తుంది.
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా, “ఆత్మకు చేదు” అని ఉంది; ఈ నానుడి లోతైన బాధను, చికాకును లేదా దుఃఖాన్ని సూచిస్తుంది.
    reason: మూలభాషలోని నానుడి రూపాన్ని మరియు దాని భావవ్యాప్తిని తెలియజేస్తుంది.
lexical_decisions:
- source_word: וַתִּהְיֶיןָ
  choice: వారు … ఉన్నారు
  rationale: హయా అనే క్రియ యొక్క స్త్రీలింగ బహువచన రూపం ముందటి వచనంలో చెప్పిన ఏశావు భార్యలను సూచిస్తుంది. సందర్భంలో కొనసాగుతున్న స్థితిని సహజమైన తెలుగులో తెలియజేయడానికి ‘ఉన్నారు’ అని అనువదించాం; ‘అయ్యారు’ అనే భావం కూడా సాధ్యమే.
- source_word: מֹרַת רוּחַ
  choice: తీవ్ర మనోవేదన
  rationale: అక్షరార్థంగా ‘ఆత్మకు చేదు’ అనే హీబ్రూ నానుడి లోతైన బాధ, చికాకు లేదా దుఃఖాన్ని వ్యక్తం చేస్తుంది. ఆధునిక తెలుగులో భావం స్పష్టంగా ఉండేలా ‘తీవ్ర మనోవేదన’ అని ఇచ్చాం; నానుడి రూపాన్ని పాదసూచికలో ఉంచాం.
- source_word: לְיִצְחָק וּלְרִבְקָה
  choice: ఇస్సాకుకు, రిబ్కాకు
  rationale: రెండు పేర్ల ముందు ఉన్న לְ ఉపసర్గ ప్రభావితులైన వారిని సూచిస్తుంది. హీబ్రూలోని పునరుక్తిని తెలుగులో సహజంగా ‘ఇస్సాకుకు, రిబ్కాకు’ అని నిలిపాం.
theological_decisions: []
translation_notes:
  register: సాధారణ ఆధునిక ప్రామాణిక తెలుగులో, గంభీరమైనప్పటికీ సులభంగా అర్థమయ్యే శైలిని వాడాం. ‘మనోవేదన’ మూలంలోని అంతరంగిక బాధను సహజంగా వ్యక్తం చేస్తుంది; ‘తీవ్ర’ అనే పదం హీబ్రూ నానుడి బలాన్ని తెలియజేస్తుంది.
