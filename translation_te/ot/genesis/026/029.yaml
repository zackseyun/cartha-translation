  text: אִם תַּעֲשֵׂ֨ה עִמָּ֜/נוּ רָעָ֗ה כַּ/אֲשֶׁר֙ לֹ֣א נְגַֽעֲנ֔וּ/ךָ וְ/כַ/אֲשֶׁ֨ר עָשִׂ֤ינוּ עִמְּ/ךָ֙ רַק ט֔וֹב וַ/נְּשַׁלֵּֽחֲ/ךָ֖ בְּ/שָׁל֑וֹם אַתָּ֥ה עַתָּ֖ה בְּר֥וּךְ יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/029.yaml
  text: that you will do us no harm[a], just as we have not touched you and just as we have done to you only good and sent you away in peace[c][b]. You are now blessed by Yahweh.”
translation:
  language: te
  text: నువ్వు మాకు ఏ హానీ చేయవని[a]—మేము నిన్ను ముట్టుకోలేదు[b], నీకు మేలు మాత్రమే చేశాం, నిన్ను శాంతితో పంపించాం[c]. ఇప్పుడు నువ్వు యెహోవాచేత ఆశీర్వదింపబడినవాడివి.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “ఒకవేళ నువ్వు మాకు హాని చేస్తే.” హీబ్రూ పదాన్ని అక్షరార్థంగా “ఒకవేళ” అని అనువదించవచ్చు; ఇక్కడ అది ఇస్సాకు నుంచి వారు కోరుతున్న ప్రమాణంలోని విషయాన్ని సూచిస్తున్నట్లు కనిపిస్తుంది.'
    reason: lexical_alternative
  - marker: b
    text: “ముట్టుకోలేదు” అనే మాటకు ఈ సందర్భంలో “హాని చేయలేదు” అనే భావం కూడా ఉండవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: 'లేదా: “నిన్ను క్షేమంగా పంపించాం.”'
    reason: translation_alternative
lexical_decisions:
- source_word: אִם
  choice: చేయవని
  rationale: మునుపటి వచనంలో కోరిన ఒడంబడిక ప్రమాణంలోని విషయాన్ని ఇది పరిచయం చేస్తుంది. తెలుగులో ‘చేయవని’ అని చెప్పడం ఆ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది; షరతుగా చదివే అవకాశాన్ని పాదసూచికలో ఉంచాం.
- source_word: תַּעֲשֵׂה עִמָּנוּ רָעָה
  choice: మాకు ఏ హానీ చేయవని
  rationale: ఒడంబడిక, పరస్పర హాని చేయకపోవడం అనే సందర్భంలో רָעָהను ‘హాని’గా అనువదించడం సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: נְגַעֲנוּךָ
  choice: మేము నిన్ను ముట్టుకోకుండా
  rationale: נגע యొక్క ప్రాథమికమైన స్పష్టార్థం ‘ముట్టుకొను’. సందర్భంలో ‘హాని చేయు’ అనే విస్తృత భావం ఉండవచ్చని పాదసూచికలో తెలియజేశాం.
- source_word: עָשִׂינוּ עִמְּךָ רַק טוֹב
  choice: నీకు మేలే చేసి
  rationale: רַק ఇచ్చే ‘మాత్రమే’ అనే ఉద్ఘాటనను తెలుగులో ‘మేలే’ సహజంగా నిలుపుతుంది.
- source_word: וַנְּשַׁלֵּחֲךָ בְּשָׁלוֹם
  choice: నిన్ను శాంతిగా పంపించినట్లే
  rationale: שָׁלוֹםలోని శాంతియుత సంబంధం, క్షేమంగా వెళ్లనివ్వడం అనే రెండు ఛాయలనూ ‘శాంతిగా’ కొంతవరకు నిలుపుతుంది.
- source_word: בְּרוּךְ יְהוָה
  choice: యెహోవా ఆశీర్వాదం పొందినవాడివి
  rationale: בְּרוּךְ అనే నిష్క్రియార్థక విశేషణ భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తూ, దైవనామాన్ని ‘యెహోవా’గా ప్రత్యక్షంగా ఉంచుతుంది.
theological_decisions:
- issue: אִם ఉన్న ప్రమాణ సూత్రాన్ని అర్థం చేసుకోవడం
  choice: హాని చేయబోననే మాటగా ప్రధాన పాఠంలో అనువదించడం
  alternative: ‘ఒకవేళ నువ్వు మాకు హాని చేస్తే’ అనే షరతు లేదా ప్రమాణ-శాప సూత్రంగా అనువదించడం
  rationale: మునుపటి వచనంలోని ఒడంబడిక అభ్యర్థన ఈ వాక్యానికి వ్యాకరణ నేపథ్యాన్ని ఇస్తుంది. అయినా אִם యొక్క యథార్థ షరతు భావాన్ని పాదసూచికలో భద్రపరిచాం.
- issue: יהוה దైవనామం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: హీబ్రూ మూలంలో ఉన్న ఒడంబడిక దైవనామాన్ని బిరుదుతో మార్చకుండా పేరుగానే అందించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి వాడబడింది. ‘మాట ఇవ్వు’ మునుపటి వచనంలో అంతర్భూతమైన ఒడంబడిక అభ్యర్థనను తెలుగులో వాక్యపూర్ణత కోసం స్పష్టం చేస్తుంది; అర్థసందిగ్ధత పాదసూచిక [a]లో నిలుపబడింది.
