revisions:
- from: మేము నిన్ను ముట్టుకోకుండా[b], నీకు మేలే చేసి, నిన్ను శాంతిగా పంపించినట్లే[c], నువ్వు మాకు ఏ హానీ చేయవని[a] మాట ఇవ్వు. ఇప్పుడు నువ్వు యెహోవా ఆశీర్వాదం పొందినవాడివి.”
  to: నువ్వు మాకు ఏ హానీ చేయవని[a]—మేము నిన్ను ముట్టుకోలేదు[b], నీకు మేలు మాత్రమే చేశాం, నిన్ను శాంతితో పంపించాం[c]. ఇప్పుడు నువ్వు యెహోవాచేత ఆశీర్వదింపబడినవాడివి.”
  rationale: The revision restores the finite past negative required by נְגַעֲנוּךָ, maintains the Hebrew clause order and emphatic ‘only good,’ and leaves the oath formula elliptical rather than adding a new imperative. It retains the contextual reading of אִם in the main text while preserving the conditional alternative in a footnote.
