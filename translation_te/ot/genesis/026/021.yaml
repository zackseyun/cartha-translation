source:
  edition: WLC
  text: וַֽ/יַּחְפְּרוּ֙ בְּאֵ֣ר אַחֶ֔רֶת וַ/יָּרִ֖יבוּ גַּם עָלֶ֑י/הָ וַ/יִּקְרָ֥א שְׁמָ֖/הּ שִׂטְנָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/021.yaml
  text: Then they dug another well[a], and they also quarreled over it, so he called its name Sitnah.
translation:
  language: te
  text: తరువాత వారు మరో బావి తవ్వారు. దాని విషయంలో కూడా వారు గొడవపడ్డారు. అందుచేత అతడు దానికి “సిత్నా”[a] అని పేరు పెట్టాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “సిత్నా” అనే పేరు శత్రుత్వం లేదా వ్యతిరేకతను సూచించే హెబ్రీ పదంతో సంబంధం కలిగి ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחְפְּרוּ
  choice: వారు తవ్వారు
  rationale: חפר అనే సాధారణ క్రియ యొక్క ఖల్ వయిక్తోల్ బహువచన రూపం; కథన క్రమంలో ‘తవ్వారు’ సహజమైన ఆధునిక తెలుగు.
- source_word: בְּאֵר אַחֶרֶת
  choice: మరో బావి
  rationale: בְּאֵר అంటే ‘బావి’; אַחֶרֶת ఇక్కడ ముందున్న బావికి భిన్నంగా తరువాత తవ్విన ఇంకొక బావిని సూచిస్తుంది.
- source_word: וַיָּרִיבוּ גַּם עָלֶיהָ
  choice: దాని విషయంలో కూడా వారు గొడవపడ్డారు
  rationale: ריב వాదించడం, కలహించడం అనే భావాన్ని ఇస్తుంది; גַּםను ‘కూడా’గా, עָלֶיהָను ఈ సందర్భంలో ‘దాని విషయంలో’గా సహజంగా వ్యక్తం చేసింది.
- source_word: וַיִּקְרָא שְׁמָהּ
  choice: అతడు దానికి … అని పేరు పెట్టాడు
  rationale: అక్షరార్థంగా ‘దాని పేరును పిలిచాడు’; తెలుగు నామకరణ సందర్భంలో ‘దానికి … అని పేరు పెట్టాడు’ సహజంగా ఉండి మూల భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: שִׂטְנָה
  choice: సిత్నా
  rationale: బావికి పెట్టిన పేరుగా అనువదించకుండా హెబ్రీ ఉచ్చారణకు సమీపంగా లిప్యంతరీకరించబడింది; దాని పదసంబంధ భావం పాదటిప్పణిలో ఇవ్వబడింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. హెబ్రీ నామకరణ సూత్రాన్ని సహజ తెలుగు వాక్యనిర్మాణంలో వ్యక్తం చేసి, పేరులోని పదసంబంధాన్ని పాదటిప్పణిలో నిలిపాం.
