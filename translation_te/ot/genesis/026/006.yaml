  register: సంక్షిప్తమైన హీబ్రూ కథన శైలిని కాపాడుతూ, సాధారణ ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదంగా అనువదించబడింది. పాదసూచికలు అవసరం లేదు.
