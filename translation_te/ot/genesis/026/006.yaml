  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: నివసించాడు
  rationale: ישׁב అనే క్రియ ఇక్కడ వరుస కథనాన్ని తెలిపే రూపంలో ఉంది. ముందటి ఆజ్ఞకు అనుగుణంగా ఇస్సాకు గెరారులో ఉండి నివసించినట్లు సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; ‘స్థిరపడ్డాడు’ అనేది మూలంలో లేని శాశ్వతత్వ భావాన్ని ఎక్కువగా సూచించవచ్చు.
- source_word: יִצְחָק
  choice: ఇస్సాకు
  rationale: హీబ్రూ వ్యక్తిపేరును తెలుగులో స్థిరపడిన బైబిలు నామరూపంలో లిప్యంతరీకరించాం.
- source_word: בִּגְרָר
  choice: గెరారులో
  rationale: בְּ అనే ఉపసర్గ ఇక్కడ స్థలాన్ని సూచిస్తుంది. తెలుగు స్థలవాచక విభక్తితో ‘గెరారులో’ అని సహజంగా అనువదించాం.
- source_word: וַ
  choice: కాబట్టి
  rationale: వావ్ కథనాన్ని ముందుకు నడిపిస్తూ, ముందటి వచనంలో దేవుడు ఇచ్చిన ఆజ్ఞకు ఇస్సాకు స్పందించిన ఫలిత సంబంధాన్ని ఇక్కడ సూచిస్తుంది.
