source:
  edition: WLC
  text: וַ/יִּקְרָ֥א אֹתָ֖/הּ שִׁבְעָ֑ה עַל כֵּ֤ן שֵׁם הָ/עִיר֙ בְּאֵ֣ר שֶׁ֔בַע עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/033.yaml
  text: And he called it Shibah[a]; therefore the name of the city is Beersheba to this day.
translation:
  language: te
  text: అతడు దానికి షిబా[a] అని పేరు పెట్టాడు. అందువల్ల ఆ పట్టణం పేరు నేటివరకు బెయేర్షెబానే ఉంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘షిబా’ అనే పేరు హీబ్రూలో ‘ఏడు’ అనే పదంలా వినిపిస్తుంది; ఇది బెయేర్షెబా పేరులోని పదప్రయోగంతో సంబంధం కలిగి ఉంది. ‘బెయేర్షెబా’ను ‘ఏడు బావి’ లేదా ‘ప్రమాణపు బావి’ అని అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא אֹתָהּ
  choice: అతడు దానికి ... అని పేరు పెట్టాడు
  rationale: కרא అనే క్రియ నామకరణ సందర్భంలో ‘పేరు పెట్టు’ అనే అర్థాన్ని ఇస్తుంది. స్త్రీలింగ ఏకవచన సర్వనామం ముందటి సందర్భంలోని బావిని సూచిస్తుంది; తెలుగులో దానికి ‘దానికి’ సహజంగా ఉంటుంది.
- source_word: שִׁבְעָה
  choice: షిబా
  rationale: ఇది బావికి పెట్టిన పేరుగా ఉన్నందున అనువదించకుండా లిప్యంతరీకరించాం. ‘ఏడు,’ ‘ప్రమాణం’ అనే హీబ్రూ పదాలతో ఉన్న శబ్దార్థ సంబంధాన్ని పాదటిప్పణిలో నిలిపాం.
- source_word: עַל כֵּן
  choice: అందువల్ల
  rationale: బావి నామకరణానికి పట్టణం పేరుతో ఉన్న వివరణాత్మక సంబంధాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: שֵׁם הָעִיר
  choice: ఆ పట్టణానికి ... అనే పేరు
  rationale: హీబ్రూ నిర్మాణంలోని భావాన్ని తెలుగులో సహజమైన స్వామ్య-నామకరణ వాక్యనిర్మాణంతో అందిస్తుంది.
- source_word: בְּאֵר שֶׁבַע
  choice: బెయేరు-షెబా
  rationale: స్థలనామాన్ని అనువదించకుండా, హీబ్రూ ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించాం; పేరులోని పదప్రయోగాన్ని పాదటిప్పణిలో వివరించాం.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: నేటివరకు
  rationale: మూలంలోని కాలవ్యాప్తిని సంక్షిప్తంగా, సహజంగా తెలిపే ఆధునిక తెలుగు ప్రయోగం.
theological_decisions:
- issue: בְּאֵר שֶׁבַע అనే పేరులోని ద్వంద్వ పదప్రయోగం
  choice: ప్రధాన పాఠ్యంలో స్థలనామాన్ని ‘బెయేరు-షెబా’గా ఉంచి, ‘ఏడు’ మరియు ‘ప్రమాణం’ అనే రెండు సాధ్య భావాలను పాదటిప్పణిలో ఇవ్వడం
  alternative: ‘ఏడుగురి బావి’ లేదా ‘ప్రమాణపు బావి’ అని ఒకే అర్థంతో అనువదించడం
  rationale: హీబ్రూ పేరులో రెండు భావాలతోనూ పదప్రయోగం ఉండవచ్చు. ఒకదాన్ని మాత్రమే ఎంచుకోవడం మూలంలోని ఉద్దేశపూర్వక భావసాంద్రతను తగ్గిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని వాడాం. పేర్లను మూల హీబ్రూకు దగ్గరగా లిప్యంతరీకరించి, పదప్రయోగంలోని నిజమైన ద్వంద్వార్థాన్ని పాదటిప్పణిలో కాపాడాం.
