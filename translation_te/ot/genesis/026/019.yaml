  text: וַ/יַּחְפְּר֥וּ עַבְדֵֽי יִצְחָ֖ק בַּ/נָּ֑חַל וַ/יִּ֨מְצְאוּ שָׁ֔ם בְּאֵ֖ר מַ֥יִם חַיִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/019.yaml
  text: Then Isaac’s servants dug in the wadi and found there a well of living water[a][b].
translation:
  language: te
  text: అప్పుడు ఇస్సాకు సేవకులు ఆ వాగులో[a] తవ్వి, అక్కడ జీవజలాల[b] బావిని కనుగొన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “లోయలో” లేదా “వాగుపాత్రలో”; హీబ్రూ పదం తరచుగా ఋతువులనుబట్టి నీరు ప్రవహించే వాగును లేదా దాని పాత్రను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా “జీవజలాలు”; అంటే నిలిచి కదలని నీరు కాకుండా, తాజా నీరు లేదా ఊట నుండి ప్రవహించే నీరు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחְפְּרוּ
  choice: తవ్వి
  rationale: חפר అనే సాధారణ ‘తవ్వు’ క్రియను సహజమైన తెలుగు కథన క్రమంలో క్రియావిశేషణ రూపంగా అనువదించాం.
- source_word: עַבְדֵי יִצְחָק
  choice: ఇస్సాకు సేవకులు
  rationale: ఈ సందర్భంలో ఇస్సాకు సేవలో ఉన్నవారిని సూచిస్తుంది; వారి బానిస స్థితిని వాక్యం ప్రత్యేకంగా నొక్కిచెప్పదు కాబట్టి ‘సేవకులు’ సహజంగా సరిపోతుంది.
- source_word: בַּנָּחַל
  choice: ఆ వాగులో
  rationale: נחל సాధారణంగా కాలానుగుణంగా నీరు ప్రవహించే వాగు లేదా దాని పాతను సూచిస్తుంది. ఆధునిక తెలుగు పాఠకులకు ‘వాగు’ సహజంగా అర్థమవుతుంది.
- source_word: וַיִּמְצְאוּ שָׁם
  choice: అక్కడ ... కనుగొన్నారు
  rationale: שָׁם లోని స్థల సూచనను ‘అక్కడ’గా నిలిపి, హీబ్రూ కథన క్రమాన్ని సహజమైన తెలుగులో వ్యక్తం చేశాం.
- source_word: בְּאֵר
  choice: ఒక బావి
  rationale: באר యొక్క సాధారణ అర్థం ‘బావి’; నీటి స్వభావాన్ని తరువాతి పదబంధం వివరిస్తుంది.
- source_word: מַיִם חַיִּים
  choice: జీవజలమున్న
  rationale: అక్షరార్థమైన ‘జీవజలం’ అనే రూపాన్ని నిలిపి, అది బావిలో ఉన్న నీరని తెలుగులో సహజంగా తెలిపాం; తాజా లేదా ఊటగా ప్రవహించే నీరు అనే నుడికారార్థాన్ని పాదసూచికలో వివరించాం.
theological_decisions:
- issue: מַיִם חַיִּים పదబంధంలోని అక్షరార్థం మరియు నుడికారార్థం
  choice: ప్రధాన పాఠ్యంలో ‘జీవజలం’ను నిలిపివేయడం
  alternative: ‘తాజా నీరు,’ ‘ప్రవహించే నీరు,’ లేదా ‘ఊటనీరు’
  rationale: అక్షరార్థాన్ని నిలిపితే హీబ్రూ రూపకం మరియు తరువాతి బైబిలు ప్రతిధ్వనులు కాపాడబడతాయి; ఈ సందర్భంలోని భౌతిక అర్థాన్ని పాదసూచిక స్పష్టం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. ‘వాడి’ అనే అరువు భౌగోళిక పదం బదులు సాధారణ పాఠకులకు సులభమైన ‘వాగు’ వాడాం; ప్రత్యామ్నాయ భౌగోళిక అర్థాలను పాదసూచికలో ఇచ్చాం.
