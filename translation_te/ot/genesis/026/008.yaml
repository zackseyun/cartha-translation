  text: וַ/יְהִ֗י כִּ֣י אָֽרְכוּ ל֥/וֹ שָׁם֙ הַ/יָּמִ֔ים וַ/יַּשְׁקֵ֗ף אֲבִימֶ֨לֶךְ֙ מֶ֣לֶךְ פְּלִשְׁתִּ֔ים בְּעַ֖ד הַֽ/חַלּ֑וֹן וַ/יַּ֗רְא וְ/הִנֵּ֤ה יִצְחָק֙ מְצַחֵ֔ק אֵ֖ת רִבְקָ֥ה אִשְׁתּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/008.yaml
  text: And it happened[a], when he had been there a long time, that Abimelech king of the Philistines looked out through the window and saw, and behold, Isaac was laughing with Rebekah his wife.
translation:
  language: te
  text: అతడు అక్కడ చాలాకాలం ఉన్నప్పుడు, ఫిలిష్తీయుల రాజైన అబీమెలెకు కిటికీలోనుంచి బయటికి చూసి, ఇదిగో, ఇస్సాకు తన భార్య రిబ్కాతో సరసమాడుతూ ఉండడం చూశాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నవ్వుతూ,’ ‘ఆటలాడుతూ,’ లేక ‘ముద్దు చేస్తూ.’ ఇక్కడి హీబ్రూ క్రియ ఇస్సాకు పేరుతో సంబంధం కలిగి ఉంది; అది ఆటపాటనో సన్నిహిత ప్రవర్తననో సూచించగలదు. ఈ సందర్భంలో రిబ్కా అతని భార్య అని వెల్లడించే ప్రవర్తనను సూచిస్తోంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּי אָרְכוּ לוֹ שָׁם הַיָּמִים
  choice: అతడు అక్కడ చాలాకాలం ఉన్న తర్వాత, ఒకరోజు
  rationale: హీబ్రూ కథనారంభ సూత్రాన్నీ, అక్కడ అతని నివాసకాలం దీర్ఘమైందనే కాలసందర్భాన్నీ సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: וַיַּשְׁקֵף ... בְּעַד הַחַלּוֹן
  choice: కిటికీలోనుంచి బయటికి చూశాడు
  rationale: ఎత్తైన లేదా లోపలి స్థానం నుంచి కిటికీ గుండా బయటకు చూడడాన్ని సహజంగా తెలియజేస్తుంది; మూలంలో తప్పనిసరిగా లేని ‘జాలకం’ అనే భావాన్ని చేర్చదు.
- source_word: וַיַּרְא וְהִנֵּה
  choice: ఇదిగో, ... కనిపించాడు
  rationale: הִנֵּה సూచించే ఆకస్మిక గమనింపును ‘ఇదిగో’ నిలుపుతుంది; తెలుగు వాక్యనిర్మాణంలో చూడడం వల్ల అతనికి ఆ దృశ్యం కనిపించిందనే భావాన్ని సహజంగా అందిస్తుంది.
- source_word: מְצַחֵק אֵת רִבְקָה אִשְׁתּוֹ
  choice: తన భార్య రిబ్కాతో సరసమాడుతూ
  rationale: צחק ధాతువుతో ఉన్న పదప్రయోగంలోని నవ్వు, ఆటపాటు, సన్నిహిత ప్రవర్తనల మధ్య ఉద్దేశపూర్వక అస్పష్టతను ‘సరసమాడుతూ’ కొంతవరకు నిలుపుతూ, ఆమె అతని భార్యని వెల్లడించిన దాంపత్య సాన్నిహిత్యాన్ని అతిశయింపకుండా సూచిస్తుంది.
theological_decisions:
- issue: ఇస్సాకు ప్రవర్తన ఎంత సన్నిహితమైనదో నిర్ణయించడం
  choice: సరసమాడుతూ
  alternative: నవ్వుతూ / ముద్దుచేస్తూ / కౌగిలించుకుంటూ
  rationale: మూల క్రియకు విస్తృతార్థం ఉంది; సందర్భం దాంపత్య సంబంధాన్ని వెల్లడించే ప్రవర్తనను సూచించినా, నిర్దిష్ట శారీరక చర్యను పేర్కొనదు. అందువల్ల భావాన్ని అతిగా నిర్ధారించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. ‘ఇదిగో’ ద్వారా హీబ్రూ కథనంలోని ఆకస్మిక గమనింపును నిలిపి, ‘సరసమాడుతూ’ ద్వారా మూలంలోని అర్థవిస్తృతిని ప్రధాన పాఠ్యంలో సాధ్యమైనంతవరకు కాపాడాం.
