reference: Genesis 26:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הִרְבֵּיתִ֤י אֶֽת זַרְעֲ/ךָ֙ כְּ/כוֹכְבֵ֣י הַ/שָּׁמַ֔יִם וְ/נָתַתִּ֣י לְ/זַרְעֲ/ךָ֔ אֵ֥ת כָּל הָ/אֲרָצֹ֖ת הָ/אֵ֑ל וְ/הִתְבָּרֲכ֣וּ בְ/זַרְעֲ/ךָ֔ כֹּ֖ל גּוֹיֵ֥י הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/004.yaml
  text: And I will multiply your offspring like the stars of the heavens[a], and I will give to your offspring all these lands, and in your offspring all the nations of the earth will be blessed.
translation:
  language: te
  text: నేను నీ సంతానాన్ని ఆకాశంలోని నక్షత్రాలవలె అనేకంగా పెంచుతాను. ఈ భూభాగాలన్నిటినీ నీ సంతానానికి ఇస్తాను. నీ సంతానంలో భూమిమీదనున్న జాతులన్నీ ఆశీర్వదించబడతాయి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీ సంతానం ద్వారా భూమిమీదనున్న జాతులన్నీ తమను తాము ఆశీర్వదించుకుంటాయి.” హీబ్రూ క్రియను ఆత్మనేపద భావంలో కూడా అర్థం చేసుకోవచ్చు; అయితే నిబంధన వాగ్దాన సందర్భానికి కర్మణి భావం చక్కగా సరిపోతుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִרְבֵּיתִי
  choice: నేను … విస్తరింపజేస్తాను
  rationale: רבה యొక్క హిఫిల్ రూపం సంఖ్యాపరంగా అధికం చేయడాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘విస్తరింపజేస్తాను’ అనేది సంతానం అసంఖ్యాకంగా పెరిగే భావాన్ని సహజంగా తెలియజేస్తూ, దేవుని ప్రత్యక్ష కార్యాన్ని నిలుపుతుంది.
- source_word: זַרְעֲךָ
  choice: నీ సంతానం
  rationale: זֶרַע సమూహార్థక ఏకవచనంగా వారసులను సూచించగలదు. ‘సంతానం’ ఆ సమూహార్థాన్ని తెలుగులో సహజంగా నిలుపుతుంది; పద్యంలో మూడు చోట్లా ఒకే పదాన్ని వాడడం మూలంలోని పునరుక్తిని కాపాడుతుంది.
- source_word: כְּכוֹכְבֵי הַשָּׁמַיִם
  choice: ఆకాశ నక్షత్రాలవలె
  rationale: כְּ ఉపమానాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది. ‘ఆకాశ నక్షత్రాలు’ ఆధునిక తెలుగులో సహజంగా ఉండి, వాగ్దానంలోని ఉన్నతమైన శైలిని కూడా నిలుపుతుంది.
- source_word: וְנָתַתִּי
  choice: ఇస్తాను
  rationale: נתן యొక్క సూటి అర్థం ‘ఇవ్వడం.’ ‘ఇస్తాను’ నిబంధన వాగ్దానంలోని ప్రత్యక్షతను కాపాడుతుంది.
- source_word: כָּל הָאֲרָצֹת הָאֵל
  choice: ఈ దేశాలన్నిటినీ
  rationale: אֲרָצוֹת ఇక్కడ వాగ్దానం చేయబడిన భూభాగాలను సూచించే బహువచనం; הָאֵל సమీపసూచకం. ‘ఈ దేశాలన్నీ’ సాధారణ పాఠకులకు సహజంగా ఉండి ప్రాంతీయ వాగ్దానాన్ని తెలియజేస్తుంది.
- source_word: וְהִתְבָּרֲכוּ
  choice: ఆశీర్వదించబడతాయి
  rationale: పితృపురుషుల వాగ్దాన సూత్రంలో ఈ రూపానికి కర్మణి అర్థం సందర్భోచితంగా ఉంది. అయితే ఆత్మనేపద అర్థం కూడా వ్యాకరణపరంగా సాధ్యమైనందున దానిని పాదసూచికలో ఉంచాం.
- source_word: בְזַרְעֲךָ
  choice: నీ సంతానంలో
  rationale: בְּ యొక్క ప్రాథమిక ‘లో’ భావాన్ని నిలుపుతూ, ఆశీర్వాదం సంతానం ద్వారా కలుగుతుందా లేదా సంతానంతో సంబంధంలో కలుగుతుందా అనే మూలంలోని భావవిస్తృతిని అనవసరంగా కుదించదు.
- source_word: כֹּל גּוֹיֵי הָאָרֶץ
  choice: భూమిపై ఉన్న జాతులన్నీ
  rationale: גּוֹיִם సమూహాత్మక ప్రజాజాతులను సూచిస్తుంది. ‘జాతులు’ తెలుగులో ప్రామాణికమైన సమానార్థకం; ‘భూమిపై ఉన్న’ అనేది మొత్తం భూలోక పరిధిని సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: וְהִתְבָּרֲכוּ בְזַרְעֲךָ అనే ఆశీర్వాద సూత్రం యొక్క భావం
  choice: నీ సంతానంలో … ఆశీర్వదించబడతాయి
  alternative: నీ సంతానాన్ని బట్టి … తమకు తాము ఆశీర్వాదం కోరుకుంటాయి
  rationale: అబ్రాహామీయ వాగ్దాన సందర్భంలో కర్మణి భావం బలంగా సరిపోతుంది. అయినా హిత్పయేల్ రూపానికి ఆత్మనేపద భావం సాధ్యమైనందున దానిని పాదసూచికలో ఇచ్చి మూలంలోని నిజమైన సందిగ్ధతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన వాగ్దాన శైలిని వాడాం. పొడవైన హీబ్రూ సమన్వయ వాక్యాన్ని తెలుగులో స్పష్టత కోసం మూడు వాక్యాలుగా విభజించాం; భావ క్రమాన్ని మార్చలేదు.
