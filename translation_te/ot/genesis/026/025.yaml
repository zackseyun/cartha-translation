id: GEN.26.25
reference: Genesis 26:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּ֧בֶן שָׁ֣ם מִזְבֵּ֗חַ וַ/יִּקְרָא֙ בְּ/שֵׁ֣ם יְהוָ֔ה וַ/יֶּט שָׁ֖ם אָהֳל֑/וֹ וַ/יִּכְרוּ שָׁ֥ם עַבְדֵי יִצְחָ֖ק בְּאֵֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/025.yaml
  text: So he built an altar there and called on the name of Yahweh[a], and he pitched his tent there[b]. And Isaac’s servants dug a well there.
translation:
  language: te
  text: అతడు అక్కడ ఒక బలిపీఠం కట్టి, యాహ్వే నామాన్ని ప్రార్థనలో పిలిచాడు[a]. అక్కడే తన గుడారం వేసుకున్నాడు. ఇస్సాకు సేవకులు అక్కడ ఒక బావి తవ్వారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యాహ్వే నామాన్ని ప్రకటించాడు.” ఈ హీబ్రూ నుడికారం ప్రార్థనలో పిలవడాన్ని లేదా ప్రకటించడాన్ని సూచించగలదు; ఇక్కడ బలిపీఠ సందర్భం ప్రార్థనలో పిలవడం అనే భావానికి మొగ్గుచూపుతుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּבֶן
  choice: కట్టి
  rationale: కథన సందర్భంలో בנה కు సహజమైన తెలుగు సమానం; బలిపీఠ నిర్మాణాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: מִזְבֵּחַ
  choice: బలిపీఠం
  rationale: బలి లేదా ఆరాధన కోసం నిర్మించిన స్థలానికి ప్రామాణికమైన తెలుగు పదం.
- source_word: וַיִּקְרָא בְּשֵׁם יְהוָה
  choice: యెహోవా నామాన్ని ప్రార్థనలో పిలిచాడు
  rationale: ఈ హీబ్రూ నుడికారం ప్రార్థనతో కూడిన ఆహ్వానాన్ని లేదా నామ ప్రకటనను సూచించగలదు. బలిపీఠ సందర్భంలో ఆరాధనాత్మక ఆహ్వానం ప్రధానంగా కనిపిస్తుంది; 'ప్రార్థనలో' అనేది తెలుగులో భావాన్ని సహజంగా స్పష్టం చేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో స్థిరపడిన లిప్యంతరీకరణతో వ్యక్తిగత నామంగా ఉంచింది.
- source_word: וַיֶּט שָׁם אָהֳלוֹ
  choice: అక్కడే తన గుడారం వేసుకున్నాడు
  rationale: נטה అనే క్రియ గుడారంతో వచ్చినప్పుడు దాన్ని వేయడం లేదా నిలపడం అనే నుడికారార్థం ఇస్తుంది; 'వేసుకున్నాడు' సహజమైన ఆధునిక తెలుగు.
- source_word: וַיִּכְרוּ
  choice: తవ్వారు
  rationale: బావి తవ్వడాన్ని సూచించే సాధారణ, సహజమైన తెలుగు క్రియ.
- source_word: עַבְדֵי יִצְחָק
  choice: ఇస్సాకు సేవకులు
  rationale: ఇక్కడ עבד అనేది ఇంటివారికి పని చేసే వారిని సూచిస్తుంది; వారి చట్టపరమైన బానిస స్థితి సందర్భంలో నిర్దిష్టంగా చెప్పబడనందున 'సేవకులు' తగినది.
- source_word: בְּאֵר
  choice: ఒక బావి
  rationale: పితృపురుషుల కథనాల్లో באר కు సాధారణ అర్థం 'బావి'; తెలుగు కథనంలో అనిర్దిష్టతను 'ఒక' సహజంగా వ్యక్తం చేస్తుంది.
- source_word: שָׁם
  choice: అక్కడ / అక్కడే
  rationale: స్థలంపై హీబ్రూ పాఠ్యంలోని పునరుక్తి దృష్టిని సాధ్యమైనంతవరకు నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో బిరుదు కాకుండా టెట్రాగ్రామటన్ నేరుగా ఉంది. అందువల్ల దైవనామాన్ని తెలుగులో స్థిరపడిన రూపంలో ఉంచి, 'ప్రభువు' అనే బిరుదుతో భర్తీ చేయలేదు.
- issue: וַיִּקְרָא בְּשֵׁם יְהוָה యొక్క భావం
  choice: యెహోవా నామాన్ని ప్రార్థనలో పిలిచాడు
  alternative: యెహోవా నామాన్ని ప్రకటించాడు
  rationale: నుడికారం ఆహ్వానం లేదా ప్రకటన రెండింటినీ సూచించగలదు. ఇక్కడ బలిపీఠ నిర్మాణ సందర్భం ప్రార్థనాపూర్వక ఆహ్వానానికి మొగ్గుచూపుతుంది; ప్రత్యామ్నాయ భావాన్ని పాదటిప్పణిలో నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన కథన శైలి. హీబ్రూ క్రియల క్రమాన్ని నిలుపుతూ, తెలుగులో భారంగా అనిపించకుండా వాక్యాలను విభజించాం. שָׁם యొక్క స్థాన ప్రాధాన్యాన్ని 'అక్కడ/అక్కడే' పునరుక్తితో కాపాడాం.
