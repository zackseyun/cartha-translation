translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. ‘తో కలిసి’ అనే నిర్మాణం అబీమెలెకుతో వచ్చిన ఇద్దరినీ సహజంగా అనుసంధానిస్తుంది; మూలంలోని సర్వనామాన్ని పేరుతో భర్తీ చేయకుండా నిలిపాం.
