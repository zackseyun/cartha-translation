  yaml_path: translation/ot/genesis/026/026.yaml
  text: Then Abimelech went to him from Gerar[a], with Ahuzzath his friend and Phicol the commander of his army.
translation:
  language: te
  text: అప్పుడు అబీమెలెకు తన మిత్రుడైన[a] అహుజ్జతుతో, తన సైన్యాధిపతి ఫీకోలుతో కలిసి గెరారు నుండి అతని దగ్గరికి వెళ్లాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “సహచరుడు”; రాజసభ సందర్భంలో “సలహాదారు” అనే భావం కూడా ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲבִימֶלֶךְ
  choice: అప్పుడు అబీమెలెకు
  rationale: కథన క్రమాన్ని సూచించే వావ్‌ను సహజమైన ఆధునిక తెలుగులో ‘అప్పుడు’గా వ్యక్తపరిచి, పేరును ప్రామాణికంగా లిప్యంతరీకరించాం.
- source_word: הָלַךְ אֵלָיו
  choice: అతని దగ్గరికి వెళ్లాడు
  rationale: הלך యొక్క సాధారణ అర్థమైన ‘వెళ్లడం’ను, אֵלָיו లోని సర్వనామాన్ని అలాగే నిలుపుతూ సహజమైన తెలుగులో అనువదించాం; సందర్భంలో ‘అతను’ ఇస్సాకును సూచిస్తుంది.
- source_word: מִגְּרָר
  choice: గెరారు నుండి
  rationale: מן ఉపసర్గలోని మూలస్థాన భావాన్ని ‘నుండి’తో తెలిపి, స్థలనామాన్ని లిప్యంతరీకరించాం.
- source_word: וַאֲחֻזַּת מֵרֵעֵהוּ
  choice: తన మిత్రుడైన[a] అహుజ్జతుతో
  rationale: מֵרֵעֵהוּ ప్రాథమికంగా వ్యక్తిగత సహచరుణ్ణి లేదా మిత్రుణ్ణి సూచించగలదు. రాజసభ సంబంధమైన సలహాదారు అనే భావం సాధ్యమైనా నిర్ధారితం కానందున ప్రధాన పాఠంలో ‘మిత్రుడు’ను ఉంచి, ప్రత్యామ్నాయాలను పాదసూచికలో ఇచ్చాం.
- source_word: וּפִיכֹל שַׂר צְבָאוֹ
  choice: తన సైన్యాధిపతి ఫీకోలుతో
  rationale: שַׂר צְבָא సైనిక దళాలకు అధిపతిని సూచిస్తుంది; ‘సైన్యాధిపతి’ సంక్షిప్తమైన, స్పష్టమైన ఆధునిక తెలుగు పదం.
