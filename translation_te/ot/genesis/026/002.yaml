id: GEN.26.2
reference: Genesis 26:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֵּרָ֤א אֵלָי/ו֙ יְהוָ֔ה וַ/יֹּ֖אמֶר אַל תֵּרֵ֣ד מִצְרָ֑יְמָ/ה שְׁכֹ֣ן בָּ/אָ֔רֶץ אֲשֶׁ֖ר אֹמַ֥ר אֵלֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/002.yaml
  text: Then Yahweh appeared to him and said[a], “Do not go down to Egypt. Dwell in the land that I will tell you.”
translation:
  language: te
  text: 'అప్పుడు యహ్వే అతనికి ప్రత్యక్షమై ఇలా అన్నాడు: “ఈజిప్టుకు దిగిపోవద్దు. నేను నీకు చెప్పే దేశంలో నివసించు.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּרָא
  choice: ప్రత్యక్షమై
  rationale: నిఫాల్ రూపం ఇక్కడ దేవుడు తనను ప్రత్యక్షపరచుకోవడాన్ని సూచిస్తుంది; ప్రత్యక్షమైన విధానాన్ని అనవసరంగా నిర్దిష్టం చేయకుండా సహజంగా తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగులో దాని సాధారణ లిప్యంతరీకరణను ఉపయోగించింది.
- source_word: אַל תֵּרֵד
  choice: దిగిపోవద్దు
  rationale: אַל‌తో కూడిన అసంపూర్ణ క్రియ నిషేధ ఆజ్ఞను వ్యక్తం చేస్తుంది; ఈజిప్టుకు ప్రయాణించడాన్ని ‘దిగిపోవడం’గా చెప్పే హీబ్రూ దిశాభావాన్ని నిలుపుతుంది.
- source_word: מִצְרָיְמָה
  choice: ఈజిప్టుకు
  rationale: దిశను సూచించే ప్రత్యయం ఈజిప్టు వైపు కదలికను తెలియజేస్తుంది; తెలుగులో ‘ఈజిప్టుకు’ సహజమైన రూపం.
- source_word: שְׁכֹן
  choice: నివసించు
  rationale: שׁכן ఆజ్ఞారూపం ఒక ప్రదేశంలో ఉండడం లేదా నివాసం ఏర్పరచుకోవడం అనే భావం ఇస్తుంది; ‘నివసించు’ ఆధునిక, గౌరవప్రదమైన తెలుగు.
- source_word: בָּאָרֶץ
  choice: దేశంలో
  rationale: ఇక్కడ אֶרֶץ భూమండలాన్ని కాక ఒక ప్రాంతం లేదా దేశాన్ని సూచిస్తుంది; సందర్భానికి ‘దేశం’ సహజంగా సరిపోతుంది.
- source_word: אֲשֶׁר אֹמַר אֵלֶיךָ
  choice: నేను నీకు చెప్పే
  rationale: హీబ్రూ అసంపూర్ణ క్రియ రాబోయే దైవనిర్దేశాన్ని సూచించగలదు; తెలుగు సంబంధక క్రియారూపం భవిష్య సూచనను సహజంగా వ్యక్తం చేస్తుంది, అయితే ‘చెప్పే’ అనే మూల భావాన్ని కాపాడుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది. దానిని బిరుదుగా మార్చకుండా ‘యహ్వే’ అని లిప్యంతరీకరించడం మూలంలోని భేదాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం. ‘దిగిపోవద్దు’ హీబ్రూ ప్రయాణ దిశాభావాన్ని కాపాడుతుంది; ‘నివసించు’ ఆజ్ఞ యొక్క స్థిర నివాస భావాన్ని తెలియజేస్తుంది.
