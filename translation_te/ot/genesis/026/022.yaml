  source_fidelity: 'హీబ్రూ మూలపాఠంలోని క్రమాన్ని, ప్రధానార్థాలను అనువాదం విశ్వసనీయంగా అందిస్తుంది: ఇస్సాకు అక్కడి నుండి వెళ్లడం, మరో బావి తవ్వడం, దానిపై వివాదం లేకపోవడం, రెహోబోతు అని పేరు పెట్టడం, యాహ్వే స్థలం కల్పించాడనే మాట, దేశంలో ఫలవంతులు కావడం అన్నీ నిలిచాయి. “విశాలమైన స్థలం కల్పించాడు” హిఫీల్ הִרְחִיב యొక్క భావాన్ని, అలాగే పేరుతోనున్న పదప్రయోగాన్ని తగినంతగా ప్రతిఫలిస్తుంది.'
