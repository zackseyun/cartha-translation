reference: Genesis 26:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּעְתֵּ֣ק מִ/שָּׁ֗ם וַ/יַּחְפֹּר֙ בְּאֵ֣ר אַחֶ֔רֶת וְ/לֹ֥א רָב֖וּ עָלֶ֑י/הָ וַ/יִּקְרָ֤א שְׁמָ/הּ֙ רְחֹב֔וֹת וַ/יֹּ֗אמֶר כִּֽי עַתָּ֞ה הִרְחִ֧יב יְהוָ֛ה לָ֖/נוּ וּ/פָרִ֥ינוּ בָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/022.yaml
  text: He moved from there and dug another well[a], and they did not quarrel over it. So he called its name Rehoboth, and said, “For now Yahweh has made room for us, and we will be fruitful in the land.”
translation:
  language: te
  text: అతడు అక్కడి నుండి వెళ్లి మరో బావి తవ్వాడు. దాని విషయంలో వారు గొడవపడలేదు. కాబట్టి అతడు దానికి రెహోబోతు[a] అని పేరు పెట్టి, “ఇప్పుడు యాహ్వే మనకు విశాలమైన స్థలం కల్పించాడు; మనం ఈ దేశంలో ఫలవంతులమవుతాం” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “రెహోబోతు” అనే పేరు హీబ్రూలో “విశాలమైన స్థలాలు” అనే మాటలా వినిపిస్తుంది. “యాహ్వే మనకు విశాలమైన స్థలం కల్పించాడు” అనే ఇస్సాకు వివరణ ఆ పేరుతో పదప్రయోగం చేస్తుంది.
    reason: స్థలనామం యొక్క అర్థాన్ని, మూలపాఠంలోని పదప్రయోగాన్ని వివరించడానికి.
lexical_decisions:
- source_word: וַיַּעְתֵּק מִשָּׁם
  choice: అతడు అక్కడి నుండి వెళ్లి
  rationale: עתק ఇక్కడ ఒక ప్రదేశాన్ని విడిచి మరోచోటికి వెళ్లడాన్ని సూచిస్తుంది. ‘వెళ్లి’ సహజమైన ఆధునిక తెలుగు; ప్రయాణ విధానాన్ని అనవసరంగా నిర్దిష్టం చేయదు.
- source_word: בְּאֵר אַחֶרֶת
  choice: మరో బావి
  rationale: హీబ్రూ నామవాచక పదబంధానికి సహజమైన, సూటియైన తెలుగు సమానం.
- source_word: וְלֹא רָבוּ עָלֶיהָ
  choice: దాని విషయంలో వారు గొడవపడలేదు
  rationale: ריב వివాదం లేదా గొడవను సూచిస్తుంది. బావుల విషయంలో సాగిన మునుపటి కలహాల సందర్భానికి ఈ రూపం సరిపోతుంది.
- source_word: וַיִּקְרָא שְׁמָהּ רְחֹבוֹת
  choice: అతడు దానికి రెహోబోతు అని పేరు పెట్టి
  rationale: హీబ్రూ నామకరణ సూత్రాన్ని సహజమైన తెలుగులో అందిస్తూ, స్థలనామాన్ని అనువదించకుండా లిప్యంతరీకరించింది.
- source_word: רְחֹבוֹת
  choice: రెహోబోతు
  rationale: ఇది స్థలనామం కనుక లిప్యంతరీకరించబడింది; దాని అర్థం మరియు తరువాతి పదప్రయోగం పాదసూచికలో వివరించబడ్డాయి.
- source_word: כִּי עַתָּה הִרְחִיב יְהוָה לָנוּ
  choice: ఇప్పుడు యాహ్వే మనకు విశాలమైన స్థలం కల్పించాడు
  rationale: רחב యొక్క హిఫీల్ రూపం ఇక్కడ స్థలం కల్పించడం లేదా విస్తారాన్ని ఇవ్వడం అనే భావాన్ని ఇస్తుంది. ‘విశాలమైన స్థలం’ అనే పదప్రయోగం రెహోబోతు పేరుతో ఉన్న సంబంధాన్ని నిలుపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: మూలపాఠంలోని దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో గుర్తించదగిన రీతిలో లిప్యంతరీకరించింది.
- source_word: וּפָרִינוּ בָאָרֶץ
  choice: మనం ఈ దేశంలో ఫలవంతులమవుతాం
  rationale: פרה యొక్క ‘ఫలించడం, విస్తరించడం’ అనే ప్రాథమిక భావాన్ని, ఆశీర్వాద వాగ్దాన ప్రతిధ్వనిని కాపాడుతుంది. సందర్భంలోని నిర్దిష్ట భూభాగాన్ని సూచించేందుకు ‘ఈ దేశంలో’ వాడబడింది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: వచనంలో చతురక్షర దైవనామం ప్రత్యక్షంగా ఉంది. దాన్ని బిరుదుగా మార్చకుండా మూలంలోని వ్యక్తిగత దైవనామాన్ని నిలిపింది.
- issue: וּפָרִינוּ లోని ఫలించే భావం
  choice: ఫలవంతులమవుతాం
  alternative: విస్తరిస్తాం; వర్ధిల్లుతాం
  rationale: ‘ఫలవంతులు కావడం’ అనే మూలార్థాన్ని మరియు ఆదికాండంలోని ఆశీర్వాద భాషతో ఉండగల సంబంధాన్ని కాపాడుతుంది; దానిని కేవలం ఆర్థిక సౌభాగ్యంగా పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘బావి,’ ‘గొడవపడలేదు,’ ‘విశాలమైన స్థలం కల్పించాడు’ వంటి సాధారణంగా అర్థమయ్యే పదాలతో మూలంలోని చర్య, నామకరణం, పదప్రయోగం నిలుపబడ్డాయి.
