  text: וַ/יְהִ֤י עֵשָׂו֙ בֶּן אַרְבָּעִ֣ים שָׁנָ֔ה וַ/יִּקַּ֤ח אִשָּׁה֙ אֶת יְהוּדִ֔ית בַּת בְּאֵרִ֖י הַֽ/חִתִּ֑י וְ/אֶת בָּ֣שְׂמַ֔ת בַּת אֵילֹ֖ן הַֽ/חִתִּֽי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/034.yaml
  text: When Esau was forty years old[a], he took as wives Judith daughter of Beeri the Hittite, and Basemath daughter of Elon the Hittite.
translation:
  language: te
  text: ఏశావుకు నలభై ఏళ్లు వచ్చినప్పుడు, అతడు హిత్తీయుడైన బేయేరి కుమార్తె యెహూదీతును, హిత్తీయుడైన ఏలోను కుమార్తె బాశెమతును భార్యలుగా చేసుకున్నాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత అక్షరార్థంగా, “అతడు ఒక భార్యను చేసుకున్నాడు: యెహూదీతును ... బాశెమతును ...” అని ఉంటుంది. హీబ్రూలో ఇద్దరు స్త్రీల పేర్లు ఉన్నప్పటికీ, “స్త్రీ/భార్య” అనే పదం ఏకవచనంలో ఉంది.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי עֵשָׂו בֶּן אַרְבָּעִים שָׁנָה
  choice: ఏశావుకు నలభై ఏళ్లు వచ్చినప్పుడు
  rationale: హీబ్రూ కథనారంభాన్ని, వయస్సును తెలిపే ప్రయోగాన్ని సహజమైన ఆధునిక తెలుగు కాలవాక్యంగా వ్యక్తపరుస్తుంది.
- source_word: וַיִּקַּח אִשָּׁה
  choice: భార్యలుగా చేసుకున్నాడు
  rationale: మూలంలో ‘స్త్రీ/భార్య’ ఏకవచనంగా ఉన్నా, వెంటనే ఇద్దరు స్త్రీల పేర్లు వస్తాయి. తెలుగులో ఉద్దేశించిన వివాహార్థాన్ని సహజంగా తెలియజేయడానికి బహువచనం వాడి, మూలంలోని వ్యాకరణ అసమానతను పాదసూచికలో ఉంచాం.
- source_word: יְהוּדִית
  choice: యెహూదీతు
  rationale: హీబ్రూ పేరుకు సమీపంగా ఉండే తెలుగు లిప్యంతరీకరణ.
- source_word: בַּת
  choice: కుమార్తె
  rationale: నిర్మాణ సంబంధాన్ని తెలుగులో సహజమైన వంశపరిచయ రూపంలో అందిస్తుంది.
- source_word: בְּאֵרִי
  choice: బేయేరి
  rationale: హీబ్రూ ఉచ్చారణకు సమీపమైన తెలుగు లిప్యంతరీకరణ.
- source_word: הַחִתִּי
  choice: హిత్తీయుడైన
  rationale: నిర్దిష్ట జాతి గుర్తింపును వ్యక్తి పరిచయంతో సహజంగా అనుసంధానిస్తుంది.
- source_word: בָּשְׂמַת
  choice: బాశెమతు
  rationale: హీబ్రూ పేరుకు సమీపమైన తెలుగు లిప్యంతరీకరణ.
- source_word: אֵילֹן
  choice: ఏలోను
  rationale: హీబ్రూ పేరుకు సమీపమైన తెలుగు లిప్యంతరీకరణ.
