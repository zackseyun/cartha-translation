  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֵּ֥לֶךְ מִ/שָּׁ֖ם יִצְחָ֑ק וַ/יִּ֥חַן בְּ/נַֽחַל גְּרָ֖ר וַ/יֵּ֥שֶׁב שָֽׁם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/017.yaml
  text: So Isaac went away from there and camped in the Valley of Gerar[a], and settled there.
translation:
  language: te
  text: అప్పుడు ఇస్సాకు అక్కడి నుండి వెళ్లి గెరారు లోయలో[a] శిబిరం వేసుకొని, అక్కడే నివసించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “గెరారు వాగుపడగలో.” హీబ్రూ పదం కాలానుగుణంగా నీరు ప్రవహించే వాగుపడగను, కనుమను లేదా లోయను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ מִשָּׁם
  choice: అక్కడి నుండి వెళ్లి
  rationale: క్రియతో కూడిన స్థలవాచక పదబంధం మునుపటి ప్రదేశం నుండి బయలుదేరడాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: וַיִּחַן
  choice: శిబిరం వేసుకొని
  rationale: חנה తాత్కాలికంగా మకాం ఏర్పాటు చేయడాన్ని సూచిస్తుంది; ఈ ప్రయోగం ఆధునిక తెలుగులో సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: בְּנַחַל גְּרָר
  choice: గెరారు లోయలో
  rationale: נחל అనే పదం కాలానుగుణ వాగు ప్రవహించే లోయను, వాగుపడగను లేదా కనుమను సూచించగలదు. సాధారణ పాఠకులకు అందుబాటులో ఉండే ప్రధాన అనువాదంగా ‘లోయ’ను ఎంచుకొని, ఇతర భావవ్యాప్తిని పాదటిప్పణిలో ఉంచాం.
- source_word: וַיֵּשֶׁב שָׁם
  choice: అక్కడే నివసించాడు
  rationale: ישב ఇక్కడ ఉండడం లేదా నివాసం ఏర్పరచుకోవడం అనే భావాన్ని ఇస్తుంది. ‘అక్కడే’ ఆ ప్రదేశంలోనే అతడు కొనసాగి నివసించాడనే కథన క్రమాన్ని సహజంగా చూపిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘శిబిరం వేసుకొని’ మరియు ‘నివసించాడు’ అనే వరుస ప్రయోగాలు తాత్కాలిక మకాం నుండి అక్కడ ఉండిపోవడం వరకు ఉన్న కథన ప్రగతిని నిలుపుతాయి.
