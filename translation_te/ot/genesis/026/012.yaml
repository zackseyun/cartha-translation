revisions:
- from: ఇస్సాకు ఆ దేశంలో విత్తనం వేశాడు. ఆ సంవత్సరంలోనే అతనికి నూరంతల దిగుబడి వచ్చింది[a]. యాహ్వే అతన్ని ఆశీర్వదించాడు.
  to: ఇస్సాకు ఆ దేశంలో విత్తనం వేశాడు. ఆ సంవత్సరంలో అతనికి వంద రెట్ల దిగుబడి వచ్చింది[a]. యాహ్వే అతన్ని ఆశీర్వదించాడు.
  rationale: The revision makes the yield expression idiomatic and unambiguous in modern Telugu, removes an unwarranted emphasis from the temporal phrase, and corrects the footnote’s characterization of the literal Hebrew verb. It preserves the source’s agricultural idiom and its genuine uncertainty between a hundredfold yield and a hundred measures.
