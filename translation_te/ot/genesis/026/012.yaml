  yaml_path: translation/ot/genesis/026/012.yaml
  text: Isaac sowed in that land[a], and in that year he found a hundredfold, and Yahweh blessed him.
translation:
  language: te
  text: ఇస్సాకు ఆ దేశంలో విత్తనం వేశాడు. ఆ సంవత్సరంలో అతనికి వంద రెట్ల దిగుబడి వచ్చింది[a]. యాహ్వే అతన్ని ఆశీర్వదించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నూరు కొలతలు పొందాడు.” హెబ్రీలో అక్షరార్థంగా, “అతడు నూరు శెఆరీమ్ కనుగొన్నాడు” అని ఉంది; ఇది అసాధారణంగా సమృద్ధిగా వచ్చిన పంట దిగుబడిని సూచించే వ్యవసాయ ప్రయోగం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְרַע
  choice: విత్తనం వేశాడు
  rationale: వ్యవసాయ సందర్భంలో זרע అంటే విత్తనాన్ని చల్లడం లేదా విత్తడం. ఆధునిక తెలుగులో ‘విత్తనం వేశాడు’ సహజంగా ఉండి వ్యవసాయ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: בָּאָרֶץ הַהִוא
  choice: ఆ దేశంలో
  rationale: אֶרֶץ అనే పదానికి ‘దేశం’ లేదా ‘భూమి’ అనే అర్థాలు ఉండవచ్చు. ఇక్కడ ఇస్సాకు నివసిస్తున్న ప్రాంతాన్ని సూచిస్తున్నందున ‘ఆ దేశంలో’ సహజమైన సందర్భోచిత అనువాదం.
- source_word: וַיִּמְצָא
  choice: అతనికి ... దిగుబడి వచ్చింది
  rationale: מצא యొక్క ప్రాథమిక అర్థం ‘కనుగొను’; అయితే పంట దిగుబడి సందర్భంలో అది పొందిన ఫలితాన్ని సూచిస్తుంది. ‘దిగుబడి వచ్చింది’ అనే రూపం మూలంలోని వ్యవసాయ భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: בַּשָּׁנָה הַהִוא
  choice: ఆ సంవత్సరంలోనే
  rationale: కాల సూచనను స్పష్టంగా నిలుపుతూ, విత్తడం మరియు సమృద్ధిగా పంట రావడం ఒకే సంవత్సరంలో జరిగాయని తెలుగు వాక్యంలో సహజంగా తెలియజేస్తుంది.
- source_word: מֵאָה שְׁעָרִים
  choice: నూరంతల దిగుబడి
  rationale: ఈ హెబ్రీ వ్యవసాయ ప్రయోగం అసాధారణంగా సమృద్ధియైన పంటను సూచిస్తుంది. ‘నూరంతల దిగుబడి’ విత్తిన దానితో పోల్చిన ఫలాన్ని స్పష్టంగా తెలియజేస్తుంది; ‘నూరు కొలతలు’ అనే పదశః అవకాశాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: וַיְבָרֲכֵהוּ
  choice: అతన్ని ఆశీర్వదించాడు
  rationale: ברך అనే సాధారణ దైవశాస్త్రీయ పదానికి ‘ఆశీర్వదించు’ నేరమైన సమానార్థకం; దీనిని కేవలం భౌతిక సౌభాగ్యానికి పరిమితం చేయదు.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హెబ్రీ దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పండిత లిప్యంతరీకరణకు అనుగుణంగా ‘యాహ్వే’గా ఇచ్చాం.
theological_decisions:
- issue: יהוה అనే దైవనామాన్ని ఎలా ఇవ్వాలి
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుతో మార్చకుండా ‘యాహ్వే’గా ఇవ్వడం మూలభాషా రూపభేదాన్ని కాపాడుతుంది.
- issue: ఇస్సాకు పొందిన వ్యవసాయ ఫలితాన్ని ఎలా వ్యక్తం చేయాలి
  choice: అతనికి నూరంతల దిగుబడి వచ్చింది
  alternative: అతడు నూరు కొలతలు పొందాడు; అతడు నూరంతలు కనుగొన్నాడు
  rationale: మూలంలోని ‘కనుగొన్నాడు’ అనే క్రియను తెలుగులో యథాతథంగా ఇస్తే వ్యవసాయ సందర్భంలో అసహజంగా ఉంటుంది. ‘దిగుబడి వచ్చింది’ సందర్భార్థాన్ని స్పష్టం చేస్తుంది; శతగుణ ఫలమా లేక నూరు కొలతలా అన్న పదబంధంలోని నిజమైన అనిశ్చితిని పాదటిప్పణి నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన శైలి వాడాం. ‘విత్తనం వేశాడు,’ ‘దిగుబడి వచ్చింది’ వంటి సాధారణ వ్యవసాయ పదబంధాలు పాఠకులకు సహజంగా ఉంటాయి. మూలంలోని ప్రతి ప్రధాన వాక్యభాగాన్ని నిలిపి, భావాన్ని అతిగా విపులీకరించలేదు.
