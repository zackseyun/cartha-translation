  text: וַֽ/יִּשְׁאֲל֞וּ אַנְשֵׁ֤י הַ/מָּקוֹם֙ לְ/אִשְׁתּ֔/וֹ וַ/יֹּ֖אמֶר אֲחֹ֣תִ/י הִ֑וא כִּ֤י יָרֵא֙ לֵ/אמֹ֣ר אִשְׁתִּ֔/י פֶּן יַֽהַרְגֻ֜/נִי אַנְשֵׁ֤י הַ/מָּקוֹם֙ עַל רִבְקָ֔ה כִּֽי טוֹבַ֥ת מַרְאֶ֖ה הִֽיא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/007.yaml
  text: When the men of the place asked about his wife[a], he said, “She is my sister,” because he was afraid to say, “She is my wife,” lest the men of the place kill me because of Rebekah, because she was beautiful in appearance.
translation:
  language: te
  text: ఆ స్థలంలోని పురుషులు అతని భార్య గురించి అడిగినప్పుడు, అతడు, “ఆమె నా సోదరి” అన్నాడు. ఎందుకంటే, “ఆమె నా భార్య” అని చెప్పడానికి అతడు భయపడ్డాడు; రిబ్కా కారణంగా ఆ స్థలంలోని పురుషులు తనను చంపుతారేమోనని అతడు భయపడ్డాడు, ఎందుకంటే ఆమె చూడటానికి అందంగా ఉండేది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁאֲלוּ
  choice: అడిగినప్పుడు
  rationale: שׁאל అనే సాధారణ విచారణ క్రియను సహజమైన ఆధునిక తెలుగులో ‘అడిగారు’ అనే భావంతో, కథన సంబంధాన్ని చూపేందుకు ‘అడిగినప్పుడు’గా అందించాం.
- source_word: אַנְשֵׁי הַמָּקוֹם
  choice: ఆ స్థలంలోని పురుషులు
  rationale: אַנְשֵׁי పదంలోని పురుష లింగ సూచనను నిలుపుతూ, ‘స్థలంలోని పురుషులు’ అని మూలానికి దగ్గరగా అనువదించాం.
- source_word: לְאִשְׁתּוֹ
  choice: అతని భార్య గురించి
  rationale: ఇక్కడ לְ ఉపసర్గ విచారణకు సంబంధించిన విషయాన్ని సూచిస్తుంది; తెలుగులో ‘గురించి’ సహజంగా ఉంటుంది.
- source_word: אֲחֹתִי הִוא
  choice: ఆమె నా సోదరి
  rationale: హీబ్రూ గుర్తింపు వాక్యాన్ని సహజ తెలుగు పదక్రమంలో ఇచ్చాం; ‘సోదరి’ వయస్సు పెద్దదా చిన్నదా అని మూలంలో లేని వివరాన్ని చేర్చదు.
- source_word: כִּי יָרֵא
  choice: ఎందుకంటే … అతడు భయపడ్డాడు
  rationale: כִּי కారణాన్ని పరిచయం చేస్తుంది; יָרֵא భయాన్ని తెలియజేస్తుంది. తెలుగు వాక్య నిర్మాణం కోసం కారణ వాక్యాన్ని సహజంగా పునర్వ్యవస్థీకరించాం.
- source_word: פֶּן יַהַרְגֻנִי
  choice: నన్ను చంపుతారేమో
  rationale: פֶּן సూచించే భయపడిన సంభావ్య పరిణామాన్ని ‘-తారేమో’ సహజంగా వ్యక్తం చేస్తుంది; הרגకు అదనపు న్యాయార్థం జోడించకుండా ‘చంపు’ వాడాం.
- source_word: עַל רִבְקָה
  choice: రిబ్కా కారణంగా
  rationale: עַל ఇక్కడ కారణం లేదా సందర్భాన్ని సూచిస్తుంది; ‘కారణంగా’ ఆ సంబంధాన్ని స్పష్టంగా, తటస్థంగా తెలియజేస్తుంది.
- source_word: טוֹבַת מַרְאֶה
  choice: చూడటానికి అందంగా
  rationale: ఆమె రూపం చూడటానికి మనోహరంగా ఉందనే హీబ్రూ భావాన్ని ఆధునిక, సహజ తెలుగులో అందిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలిని వాడాం. హీబ్రూలోని ‘నన్ను’ అనే ప్రథమ పురుష భావాన్ని ఇస్సాకు అంతరంగ భయంగా ఉద్ధరణలో నిలిపాం. ఆంగ్ల సంప్రదింపు పాఠంలోని [a] గమనిక మూల హీబ్రూలోని ప్రత్యేక పాఠాంతరాన్ని సూచించకపోవడం మరియు దాని స్థానం/విషయం సరిపోకపోవడం వల్ల ప్రచురణ ముసాయిదాలో చేర్చలేదు.
