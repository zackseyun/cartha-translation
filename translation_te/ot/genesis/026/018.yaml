  text: וַ/יָּ֨שָׁב יִצְחָ֜ק וַ/יַּחְפֹּ֣ר אֶת בְּאֵרֹ֣ת הַ/מַּ֗יִם אֲשֶׁ֤ר חָֽפְרוּ֙ בִּ/ימֵי֙ אַבְרָהָ֣ם אָבִ֔י/ו וַ/יְסַתְּמ֣וּ/ם פְּלִשְׁתִּ֔ים אַחֲרֵ֖י מ֣וֹת אַבְרָהָ֑ם וַ/יִּקְרָ֤א לָ/הֶן֙ שֵׁמ֔וֹת כַּ/שֵּׁמֹ֕ת אֲשֶׁר קָרָ֥א לָ/הֶ֖ן אָבִֽי/ו׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/018.yaml
  text: Then Isaac dug again the wells of water that had been dug in the days of Abraham his father[a], which the Philistines had stopped up after Abraham's death, and he called them by the names that his father had given them.
translation:
  language: te
  text: తరువాత ఇస్సాకు తన తండ్రియైన అబ్రాహాము కాలంలో తవ్వబడిన నీటి బావులను మళ్లీ[a] తవ్వాడు. అబ్రాహాము మరణించిన తర్వాత ఫిలిష్తీయులు వాటిని పూడ్చివేశారు. ఇస్సాకు తన తండ్రి వాటికి పెట్టిన పేర్లనే పెట్టాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత పదశః: “ఇస్సాకు తిరిగి వచ్చి తవ్వాడు.” అయితే ఇక్కడ హీబ్రూ క్రియ, తవ్వే పనిని మళ్లీ చేపట్టాడనే భావాన్ని సూచిస్తుండవచ్చు.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב ... וַיַּחְפֹּר
  choice: మళ్లీ తవ్వించాడు
  rationale: שׁוב తరువాత మరో క్రియ వచ్చినప్పుడు పని తిరిగి చేపట్టడాన్ని సూచించగలదు. సందర్భంలో పూడ్చివేయబడిన పాత బావులను పునరుద్ధరించడం ఉద్దేశం. חפר యొక్క causative కాని హీబ్రూ రూపాన్ని తెలుగులో సహజ కథనశైలికి అనుగుణంగా ‘తవ్వించాడు’ అని ఇచ్చాం; ఇస్సాకు స్వయంగా తవ్వాడనే భావాన్ని బలవంతంగా రుద్దదు.
- source_word: בְּאֵרֹת הַמַּיִם
  choice: నీటి బావులను
  rationale: హీబ్రూ పదబంధంలోని నీటి వనరులనే స్పష్టతను సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: אֲשֶׁר חָפְרוּ בִּימֵי אַבְרָהָם אָבִיו
  choice: తన తండ్రి అబ్రాహాము కాలంలో తవ్విన
  rationale: బహువచన క్రియలో కర్త నిర్దిష్టంగా లేదు. తెలుగులో కర్తరహిత సంబంధ వాక్యం ఆ అనిశ్చితిని సహజంగా కాపాడుతుంది.
- source_word: וַיְסַתְּמוּם
  choice: వాటిని పూడ్చివేశారు
  rationale: סתם అంటే మూసివేయడం లేదా అడ్డుపెట్టడం. బావుల సందర్భంలో ‘పూడ్చివేశారు’ సహజంగా ఉండి, అవి ఉపయోగించలేనివిగా చేయబడిన భావాన్ని తెలియజేస్తుంది.
- source_word: פְּלִשְׁתִּים
  choice: ఫిలిష్తీయులు
  rationale: ఈ ప్రజాసమూహానికి ప్రామాణిక తెలుగు రూపం.
- source_word: אַחֲרֵי מוֹת אַבְרָהָם
  choice: అబ్రాహాము చనిపోయిన తర్వాత
  rationale: మూలంలోని కాలసంబంధాన్ని సరళమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וַיִּקְרָא לָהֶן שֵׁמוֹת כַּשֵּׁמֹת אֲשֶׁר קָרָא לָהֶן אָבִיו
  choice: తన తండ్రి వాటికి పెట్టిన పేర్లనే మళ్లీ పెట్టాడు
  rationale: కרא ... שמות అనేది పేర్లు పెట్టడాన్ని సూచిస్తుంది; כ పోలిక లేదా సరిపోలికను తెలియజేస్తుంది. ‘పేర్లనే’ అవే పేర్లు అని స్పష్టం చేస్తుంది. చివరి ‘మళ్లీ’ పేర్లు తిరిగి వినియోగించిన భావాన్ని సహజంగా తెలియజేస్తుంది.
