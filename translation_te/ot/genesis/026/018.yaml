translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన కథనశైలి. పొడవైన హీబ్రూ వాక్యాన్ని మూడు సహజ తెలుగు వాక్యాలుగా విభజించాం. ‘తవ్వించాడు’ సామాజిక సందర్భంలో నాయకుడు పని చేయించడాన్ని సహజంగా వ్యక్తం చేస్తుంది; మూలంలోని క్రియ వ్యాకరణపరంగా causative కాదనే విషయాన్ని lexical rationaleలో గుర్తించాం.
