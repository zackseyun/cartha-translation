    text: 'మరింత పదశః: “ఇస్సాకు తిరిగి వచ్చి తవ్వాడు.” అయితే ఇక్కడ హీబ్రూ క్రియ, తవ్వే పనిని మళ్లీ చేపట్టాడనే భావాన్ని సూచిస్తుండవచ్చు.'
    reason: lexical_alternative
