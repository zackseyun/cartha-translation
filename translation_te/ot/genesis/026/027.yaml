source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֲלֵ/הֶם֙ יִצְחָ֔ק מַדּ֖וּעַ בָּאתֶ֣ם אֵלָ֑/י וְ/אַתֶּם֙ שְׂנֵאתֶ֣ם אֹתִ֔/י וַ/תְּשַׁלְּח֖וּ/נִי מֵ/אִתְּ/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/027.yaml
  text: Isaac said to them[a], “Why have you come to me, since you hated me and sent me away from among you?”
translation:
  language: te
  text: 'ఇస్సాకు వారితో ఇలా అన్నాడు: “మీరు నన్ను ద్వేషించి, మీ మధ్యనుండి నన్ను పంపివేశారు కదా; మరి నా దగ్గరకు ఎందుకు వచ్చారు?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵהֶם יִצְחָק
  choice: ఇస్సాకు వారితో ఇలా అన్నాడు
  rationale: హీబ్రూ కథన పరిచయంలోని ‘అన్నాడు’ అనే సాధారణ భావాన్ని, సంభాషణకు సహజమైన తెలుగు పదక్రమంలో అందిస్తుంది.
- source_word: מַדּוּעַ בָּאתֶם אֵלָי
  choice: మరి ఇప్పుడు నా దగ్గరికి ఎందుకు వచ్చారు?
  rationale: מַדּוּעַ యొక్క కారణార్థక ప్రశ్నను ‘ఎందుకు’గా సహజంగా అందించింది. వారి ప్రస్తుత రాకను సందర్భానుసారంగా స్పష్టం చేయడానికి ‘ఇప్పుడు’ వాడబడింది; ‘మరి’ ముందరి చర్యలకు విరుద్ధంగా ఉన్న రాకను సూచిస్తుంది.
- source_word: וְאַתֶּם
  choice: …కదా; మరి
  rationale: వావ్ సంధికి ఇక్కడ సందర్భాత్మక/వ్యతిరేక సంబంధం ఉంది. తెలుగు సహజ వాక్యనిర్మాణంలో ముందరి వాస్తవాన్ని ‘కదా’తో గుర్తుచేసి, ప్రశ్నను ‘మరి’తో అనుసంధానించడం ఆ సంబంధాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: שְׂנֵאתֶם אֹתִי
  choice: మీరు నన్ను ద్వేషించి
  rationale: שנא యొక్క బలమైన సాధారణ అర్థమైన ‘ద్వేషించు’ను మృదువుపరచకుండా నిలుపుతుంది.
- source_word: וַתְּשַׁלְּחוּנִי
  choice: నన్ను పంపివేశారు
  rationale: ఈ సందర్భంలో שׁלח అంటే ఒకరిని వెళ్లగొట్టడం లేదా పంపివేయడం. ‘పంపివేశారు’ మూలానికి దగ్గరగా ఉండి, అవసరానికి మించిన బలాన్ని చేర్చదు.
- source_word: מֵאִתְּכֶם
  choice: మీ మధ్యనుండి
  rationale: వారి సమూహం లేదా సన్నిధి నుండి వేరుచేయబడిన సామాజిక భావాన్ని ‘మీ మధ్యనుండి’ సహజంగా కాపాడుతుంది.
