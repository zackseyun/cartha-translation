translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవభరితమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే ప్రత్యక్ష సంభాషణ. హీబ్రూ సంధి యొక్క వ్యతిరేక/సందర్భాత్మక సంబంధాన్ని తెలుగు వాక్యక్రమం, ‘కదా; మరి’ ద్వారా సహజంగా వ్యక్తం చేసింది.
