id: GEN.26.24
reference: Genesis 26:24
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֵּרָ֨א אֵלָ֤י/ו יְהוָה֙ בַּ/לַּ֣יְלָה הַ/ה֔וּא וַ/יֹּ֕אמֶר אָנֹכִ֕י אֱלֹהֵ֖י אַבְרָהָ֣ם אָבִ֑י/ךָ אַל תִּירָא֙ כִּֽי אִתְּ/ךָ֣ אָנֹ֔כִי וּ/בֵֽרַכְתִּ֨י/ךָ֙ וְ/הִרְבֵּיתִ֣י אֶֽת זַרְעֲ/ךָ֔ בַּ/עֲב֖וּר אַבְרָהָ֥ם עַבְדִּֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/024.yaml
  text: And Yahweh appeared to him that night and said[a], “I am the God of Abraham your father. Do not fear, for I am with you[b], and I will bless you and multiply your offspring for the sake of Abraham my servant.”
translation:
  language: te
  text: 'ఆ రాత్రి యాహ్వే అతనికి ప్రత్యక్షమై ఇలా అన్నాడు: “నేను నీ తండ్రియైన అబ్రాహాము దేవుణ్ణి. భయపడకు; ఎందుకంటే నేను నీతో ఉన్నాను. నేను నిన్ను ఆశీర్వదిస్తాను, నా సేవకుడైన అబ్రాహాము నిమిత్తం నీ సంతానాన్ని[a] వృద్ధి చేస్తాను.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా “నీ విత్తనాన్ని”; ఇక్కడ హెబ్రీ పదం సమూహవాచకంగా సంతానాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవ నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగు లిపిలో ‘యాహ్వే’గా లిప్యంతరీకరించాం.
- source_word: וַיֵּרָא אֵלָיו
  choice: అతనికి ప్రత్యక్షమై
  rationale: ראה క్రియ నిఫాల్ రూపం ఇక్కడ దైవ ప్రత్యక్షతను సూచిస్తుంది; ‘ప్రత్యక్షమై’ అనేది సహజమైన, నేరమైన తెలుగు వ్యక్తీకరణ.
- source_word: בַּלַּיְלָה הַהוּא
  choice: ఆ రాత్రి
  rationale: నిర్దేశక భావాన్ని నిలుపుతూ కాలసూచక పదబంధాన్ని సహజ తెలుగులో అందిస్తుంది.
- source_word: אָנֹכִי אֱלֹהֵי אַבְרָהָם אָבִיךָ
  choice: నేను నీ తండ్రి అబ్రాహాము దేవుణ్ణి
  rationale: అబ్రాహాము ఇస్సాకు తండ్రి అనే సంబంధాన్ని, దేవుని నిబంధనాత్మక స్వపరిచయాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: אַל תִּירָא
  choice: భయపడకు
  rationale: నిషేధ ఆజ్ఞను సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: כִּי אִתְּךָ אָנֹכִי
  choice: ఎందుకంటే నేను నీతో ఉన్నాను
  rationale: כִּי భయపడవద్దనే ఆజ్ఞకు కారణాన్ని పరిచయం చేస్తుంది; ‘ఎందుకంటే’ ఆ తార్కిక సంబంధాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: וּבֵרַכְתִּיךָ
  choice: నేను నిన్ను ఆశీర్వదించి
  rationale: వాగ్దాన సందర్భంలోని భవిష్యత్ భావాన్ని తరువాతి సమాపక క్రియతో కలిపి సహజ తెలుగు వాక్యనిర్మాణంలో అందిస్తుంది.
- source_word: וְהִרְבֵּיתִי אֶת זַרְעֲךָ
  choice: నీ సంతానాన్ని విస్తరింపజేస్తాను
  rationale: רבה హిఫిల్ రూపంలోని ‘అధికం చేయడం’ అనే భావాన్ని, זֶרַע యొక్క సమూహవాచక వంశార్థంతో కలిపి వ్యక్తం చేస్తుంది.
- source_word: בַּעֲבוּר אַבְרָהָם עַבְדִּי
  choice: నా సేవకుడైన అబ్రాహాము నిమిత్తం
  rationale: బַּעֲבוּר సూచించే కారణాత్మక/హితార్థ సంబంధాన్ని అతిగా వివరించకుండా నిలుపుతుంది; עֶבֶד ఇక్కడ నిబంధనాత్మక సేవక సంబంధానికి తగినట్లు ‘సేవకుడు’గా అనువదించబడింది.
theological_decisions:
- issue: יְהוָה అనే దైవ నామం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవ నామమే ఉంది. అందువల్ల దాన్ని బిరుదైన ‘ప్రభువు’తో భర్తీ చేయకుండా లిప్యంతరీకరించాం.
- issue: בַּעֲבוּר אַבְרָהָם עַבְדִּיలో వాగ్దానానికి ఆధారం
  choice: నా సేవకుడైన అబ్రాహాము నిమిత్తం
  alternative: నా సేవకుడైన అబ్రాహాము కారణంగా
  rationale: దేవుడు ఇస్సాకుకు ఇచ్చిన వాగ్దానాన్ని అబ్రాహాముతో ఉన్న సంబంధానికి అనుసంధానించే మూలపాఠ భావాన్ని నిలుపుతుంది; ఆ సంబంధ స్వరూపాన్ని పాఠానికి మించి వివరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనా సులభంగా అర్థమయ్యే శైలిని వాడాం. దైవవాక్యానికి తగిన గౌరవభావాన్ని ఉంచుతూ పాతబడిన లేదా అతిగా సంస్కృతీకృత పదప్రయోగాన్ని నివారించాం.
