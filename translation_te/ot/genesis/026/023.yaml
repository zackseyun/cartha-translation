  text: From there he went up to Beersheba[a].
translation:
  language: te
  text: అక్కడి నుండి అతడు బెయేర్షెబాకు పైకి వెళ్లాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో, “పైకి వెళ్లాడు.” ఇది ప్రయాణాన్ని తెలిపే సాధారణ ప్రయోగం; ఎత్తైన ప్రదేశం వైపు వెళ్లడాన్ని కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: వెళ్లాడు
  rationale: עלה అనే క్రియ ప్రాథమికంగా ‘పైకి వెళ్లడం’ అని అర్థమిచ్చినా, ప్రయాణ వర్ణనలో ఒక స్థలం నుండి మరొక స్థలానికి వెళ్లడాన్ని కూడా సూచిస్తుంది. బెయేర్షెబా వైపు భౌగోళికంగా పైకి వెళ్లే భావసూచన ఉండవచ్చు కాబట్టి దానిని పాదసూచికలో నిలిపాం; ప్రధాన వాక్యంలో సహజమైన ఆధునిక తెలుగు కోసం ‘వెళ్లాడు’ వాడాం.
- source_word: מִשָּׁם
  choice: అక్కడి నుండి
  rationale: మునుపటి ప్రదేశం నుండి బయలుదేరిన భావాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: בְּאֵר שָׁבַע
  choice: బెయేర్షెబా
  rationale: ఇది స్థలనామం; అనువదించకుండా తెలుగు లిపిలో హీబ్రూ ఉచ్చారణకు సమీపంగా లిప్యంతరీకరించాం.
theological_decisions: []
translation_notes:
  register: సాధారణ పాఠకులకు అర్థమయ్యే ఆధునిక ప్రామాణిక తెలుగు; సంక్షిప్తమైన కథన శైలిని, మూలంలోని దిశాసూచక సందిగ్ధతను పాదసూచిక ద్వారా కాపాడాం.
