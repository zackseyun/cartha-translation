revisions:
- from: అబ్రాహాము కాలంలో వచ్చిన మొదటి కరవు కాక, దేశంలో మరో కరవు వచ్చింది. అప్పుడు ఇస్సాకు గెరారులోని[a] ఫిలిష్తీయుల రాజు అబీమెలెకు దగ్గరకు వెళ్లాడు.
  to: అబ్రాహాము కాలంలో వచ్చిన మొదటి కరువుకు అదనంగా దేశంలో మరో కరవు వచ్చింది. అప్పుడు ఇస్సాకు గెరారులో ఉన్న[a] ఫిలిష్తీయుల రాజు అబీమెలెకు వద్దకు వెళ్లాడు.
  rationale: The revision explicitly conveys the additive force of מִלְּבַד (“besides/in addition to”) and improves Telugu idiom for Isaac’s movement to Abimelech, while preserving the source’s narrative sequence, the location reading, and the directional-Gerarah alternative in the footnote.
