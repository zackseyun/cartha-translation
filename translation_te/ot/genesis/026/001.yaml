  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְהִ֤י רָעָב֙ בָּ/אָ֔רֶץ מִ/לְּ/בַד֙ הָ/רָעָ֣ב הָ/רִאשׁ֔וֹן אֲשֶׁ֥ר הָיָ֖ה בִּ/ימֵ֣י אַבְרָהָ֑ם וַ/יֵּ֧לֶךְ יִצְחָ֛ק אֶל אֲבִימֶּ֥לֶךְ מֶֽלֶךְ פְּלִשְׁתִּ֖ים גְּרָֽרָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/001.yaml
  text: There was a famine in the land[a], besides the first famine that had been in the days of Abraham. So Isaac went to Abimelech king of the Philistines at Gerar.
translation:
  language: te
  text: అబ్రాహాము కాలంలో వచ్చిన మొదటి కరువుకు అదనంగా దేశంలో మరో కరవు వచ్చింది. అప్పుడు ఇస్సాకు గెరారులో ఉన్న[a] ఫిలిష్తీయుల రాజు అబీమెలెకు వద్దకు వెళ్లాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “గెరారుకు.” హీబ్రూ పదరూపంలోని దిశాసూచక అంత్యప్రత్యయం గెరారు వైపుకు వెళ్లడాన్ని స్పష్టంగా సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי רָעָב בָּאָרֶץ
  choice: దేశంలో మరో కరవు వచ్చింది
  rationale: హీబ్రూ కథన ఆరంభాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది. తరువాతి מִלְּבַד పదబంధంతో ఉన్న పోలికను స్పష్టంగా చూపేందుకు ‘మరో’ చేర్చబడింది; ఇది కొత్త కరవు పూర్వ కరవుకు భిన్నమని సందర్భం ద్వారా సూచితమైన భావం.
- source_word: מִלְּבַד הָרָעָב הָרִאשׁוֹן
  choice: మొదటి కరవు కాక
  rationale: మునుపటి కరవును మినహాయించి లేదా దానికి అదనంగా వచ్చిన కరవు అనే מִלְּבַד భావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: אֲשֶׁר הָיָה בִּימֵי אַבְרָהָם
  choice: అబ్రాహాము కాలంలో వచ్చిన
  rationale: ‘అబ్రాహాము దినాల్లో’ అనే హీబ్రూ ప్రయోగాన్ని సాధారణ ఆధునిక తెలుగు వాడుకలో ‘అబ్రాహాము కాలంలో’గా అందిస్తుంది.
- source_word: וַיֵּלֶךְ יִצְחָק
  choice: అప్పుడు ఇస్సాకు ... వెళ్లాడు
  rationale: wayyiqtol యొక్క కథన కొనసాగింపును ‘అప్పుడు’ సహజంగా సూచిస్తుంది; కరవే నేరుగా కారణమని ‘కాబట్టి’తో అతిగా నిర్ధారించదు.
- source_word: אֲבִימֶּלֶךְ מֶלֶךְ פְּלִשְׁתִּים
  choice: ఫిలిష్తీయుల రాజు అబీమెలెకు
  rationale: హీబ్రూ సంబంధ నిర్మాణాన్ని స్పష్టమైన తెలుగు నామవాచక పదబంధంగా అందిస్తుంది; వ్యక్తి, జాతి పేర్లు తెలుగు బైబిలు సంప్రదాయానికి అనుగుణంగా లిప్యంతరీకరించబడ్డాయి.
- source_word: גְּרָרָה
  choice: గెరారులోని[a]
  rationale: ప్రధాన వాక్యంలో అబీమెలెకు ఉన్న స్థలాన్ని సహజ తెలుగులో తెలుపుతుంది. అయితే హీబ్రూ రూపంలోని దిశాసూచక అంత్యప్రత్యయం గెరారు వైపు ప్రయాణాన్ని ప్రత్యక్షంగా సూచించగలదని పాదసూచికలో నిలుపబడింది.
theological_decisions:
- issue: פְּלִשְׁתִּים అనే చారిత్రక-జాతి సూచన
  choice: ఫిలిష్తీయులు
  alternative: ఫిలిష్తీయ ప్రజలు
  rationale: ఇది కథనంలోని జాతి-రాజకీయ పేరు మాత్రమే; దానికి అదనపు వేదాంతార్థం జోడించకుండా సంప్రదాయ తెలుగు రూపాన్ని వాడింది.
- issue: కరవు వల్లనే ఇస్సాకు వెళ్లాడా అనే కారణ సంబంధం
  choice: అప్పుడు
  alternative: కాబట్టి
  rationale: హీబ్రూ వావ్ కథన క్రమాన్ని స్పష్టంగా చూపుతుంది గాని కారణ సంబంధాన్ని తప్పనిసరిగా నిర్ధారించదు. అందువల్ల వేదాంత లేదా కథన కారణాన్ని అతిగా నిర్ణయించకుండా ‘అప్పుడు’ ఎంచుకుంది.
translation_notes:
  register: సాధారణ పాఠకులకు అర్థమయ్యే ఆధునిక ప్రామాణిక తెలుగు; కథన గౌరవాన్ని నిలుపుతూ అతిపురాతన లేదా కృత్రిమ పదక్రమాన్ని నివారించింది. ‘గెరారులోని ... దగ్గరకు’ అనే నిర్మాణం తెలుగులో సహజంగా ఉండగా, మూలంలోని దిశార్థం పాదసూచికలో భద్రపరచబడింది.
