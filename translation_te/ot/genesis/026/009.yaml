id: GEN.26.9
reference: Genesis 26:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּקְרָ֨א אֲבִימֶ֜לֶךְ לְ/יִצְחָ֗ק וַ/יֹּ֨אמֶר֙ אַ֣ךְ הִנֵּ֤ה אִשְׁתְּ/ךָ֙ הִ֔וא וְ/אֵ֥יךְ אָמַ֖רְתָּ אֲחֹ֣תִ/י הִ֑וא וַ/יֹּ֤אמֶר אֵלָי/ו֙ יִצְחָ֔ק כִּ֣י אָמַ֔רְתִּי פֶּן אָמ֖וּת עָלֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/009.yaml
  text: So Abimelech called Isaac and said[a], “Surely, she is your wife! So how could you say, ‘She is my sister’?” And Isaac said to him, “Because I said[c][b], ‘Lest I die because of her.’”
translation:
  language: te
  text: అబీమెలెకు ఇస్సాకును పిలిచి, “ఆమె నిజంగా నీ భార్యే! మరి, ‘ఆమె నా సోదరి’ అని నువ్వెలా చెప్పావు?” అన్నాడు. ఇస్సాకు అతనితో, “ఎందుకంటే, ‘ఆమె కారణంగా నేను చనిపోతానేమో’ అని చెప్పాను” అన్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרָא ... לְיִצְחָק
  choice: ఇస్సాకును పిలిపించి
  rationale: קרא with לְ and a person can mean calling or summoning someone. In this royal setting, “పిలిపించి” is natural Telugu and conveys that Abimelech had Isaac called before speaking to him.
- source_word: אַךְ הִנֵּה
  choice: నిజంగా
  rationale: The two particles together emphatically draw attention to Abimelech’s now-certain realization. “నిజంగా” preserves the emphatic assertion without introducing a question or using an awkward stack of interjections.
- source_word: אִשְׁתְּךָ הִוא
  choice: ఆమె నీ భార్యే
  rationale: The emphatic Telugu suffix ఏ naturally reinforces the identification expressed in the Hebrew clause.
- source_word: וְאֵיךְ אָמַרְתָּ
  choice: మరి ... అని నువ్వెలా చెప్పావు?
  rationale: “మరి” connects the declaration to the reproachful question, while “నువ్వెలా చెప్పావు?” preserves the incredulous force of וְאֵיךְ.
- source_word: אֲחֹתִי הִוא
  choice: ఆమె నా సహోదరి
  rationale: “సహోదరి” gives the ordinary sense “sister” in dignified modern Telugu without broadening it to a generic female relative.
- source_word: כִּי אָמַרְתִּי
  choice: ఎందుకంటే ... అని అనుకున్నాను
  rationale: כִּי introduces Isaac’s reason. In context, אָמַרְתִּי reports inward reasoning rather than words addressed to Abimelech, so idiomatic Telugu uses “అనుకున్నాను”; the footnote preserves the literal wording.
- source_word: פֶּן אָמוּת
  choice: నేను చనిపోతానేమో
  rationale: The construction expresses apprehension about a possible outcome. The Telugu form “చనిపోతానేమో” naturally conveys “lest I die / for fear that I might die.”
- source_word: עָלֶיהָ
  choice: ఆమె కారణంగా
  rationale: Here עַל indicates the cause or occasion of Isaac’s feared death. “ఆమె కారణంగా” is concise and retains the Hebrew’s implicit wording without adding the men who might kill him.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన కథన శైలిని వాడుతూ, సంభాషణకు తగిన గౌరవప్రదమైన సరళతను నిలిపాం. “నిజంగా ... భార్యే” అనే రూపం אַךְ הִנֵּה యొక్క బలమైన నిర్ధారణను తెలుపుతుంది; దానిని ప్రశ్నార్థకంగా మార్చలేదు. ఇస్సాకు భయం వెనుక ఉన్న హత్యాభిప్రాయాన్ని సందర్భం సూచించినప్పటికీ, మూలంలో స్పష్టంగా లేని “వారు నన్ను చంపుతారు” అనే మాటలను ప్రధాన పాఠ్యంలో చేర్చలేదు.
