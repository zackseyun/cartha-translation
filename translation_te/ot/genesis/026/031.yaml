  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּשְׁכִּ֣ימוּ בַ/בֹּ֔קֶר וַ/יִּשָּׁבְע֖וּ אִ֣ישׁ לְ/אָחִ֑י/ו וַ/יְשַׁלְּחֵ֣/ם יִצְחָ֔ק וַ/יֵּלְכ֥וּ מֵ/אִתּ֖/וֹ בְּ/שָׁלֽוֹם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/031.yaml
  text: And they rose early in the morning and swore an oath, each man to his brother; then Isaac sent them away[a], and they departed from him in peace.
translation:
  language: te
  text: వారు తెల్లవారగానే లేచి, ఒక్కొక్కరు తమ సహోదరునితో ప్రమాణం చేసుకున్నారు[a]. తరువాత ఇస్సాకు వారిని సాగనంపాడు; వారు అతని దగ్గరనుంచి శాంతితో వెళ్లిపోయారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, ‘ఒక్కొక్క పురుషుడు తన సహోదరునితో’; ఇక్కడ ఇది వారు పరస్పరం ప్రమాణం చేసుకోవడాన్ని తెలిపే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכִּימוּ בַבֹּקֶר
  choice: తెల్లవారగానే లేచి
  rationale: שׁכם యొక్క హిఫీల్ రూపం పొద్దున్నే లేవడాన్ని సూచిస్తుంది; בַבֹּקֶרతో కలిపి తెలుగులో సహజంగా ‘తెల్లవారగానే లేచి’ అని అనువదించబడింది.
- source_word: וַיִּשָּׁבְעוּ
  choice: ప్రమాణం చేసుకున్నారు
  rationale: שׁבע నిఫాల్ రూపం ప్రమాణం చేయడాన్ని సూచిస్తుంది. పరస్పర చర్యను సందర్భానుసారంగా ‘చేసుకున్నారు’ తెలియజేస్తుంది.
- source_word: אִישׁ לְאָחִיו
  choice: ఒక్కొక్కరు తమ సహోదరునితో
  rationale: ‘ఒక పురుషుడు తన సహోదరునితో’ అనే హీబ్రూ సంబంధపదాన్ని పూర్తిగా సాధారణీకరించకుండా, పరస్పర ప్రమాణ స్వభావం అర్థమయ్యేలా తెలుగులో వ్యక్తీకరించబడింది.
- source_word: וַיְשַׁלְּחֵם
  choice: వారిని సాగనంపాడు
  rationale: పీయేల్ రూపంలోని שׁלח ఇక్కడ వారిని పంపివేయడం లేదా వీడ్కోలు పలికి పంపడాన్ని సూచిస్తుంది; ‘సాగనంపాడు’ సందర్భానికి సహజంగా సరిపోతుంది.
- source_word: וַיֵּלְכוּ מֵאִתּוֹ
  choice: వారు అతని దగ్గరనుంచి ... వెళ్లిపోయారు
  rationale: הלךతో కూడిన מֵאִתּוֹ అతని సన్నిధి నుంచి దూరంగా వెళ్లడాన్ని సూచిస్తుంది.
- source_word: בְּשָׁלוֹם
  choice: సమాధానంతో
  rationale: שָׁלוֹם ఇక్కడ ఒప్పందం తరువాతి శాంతియుత సంబంధాన్నీ, క్షేమంగా వెళ్లడాన్నీ సూచించగలదు; ‘సమాధానంతో’ ఈ భావ విస్తృతిని నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. హీబ్రూ సంబంధపదంలోని పురుషలింగ రూపాన్ని ‘సహోదరునితో’ అని నిలిపి, దాని పరస్పరార్థాన్ని పాదటిప్పణిలో వివరించాం.
