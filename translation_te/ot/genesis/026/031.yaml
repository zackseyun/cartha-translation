  naturalness: The narrative is natural modern standard Telugu. Replacing ‘సమాధానంతో’ with ‘శాంతితో’ makes the final clause both idiomatic and semantically clear in this treaty context.
  terminology: ‘ప్రమాణం చేసుకున్నారు’ appropriately renders the oath. ‘సహోదరునితో’ preserves the masculine relational wording of the Hebrew idiom, while the footnote correctly explains its reciprocal contextual force. ‘శాంతితో’ is the suitable rendering for the relational/safe-departure sense of שָׁלוֹם.
