language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֲבִימֶ֔לֶךְ מַה זֹּ֖את עָשִׂ֣יתָ לָּ֑/נוּ כִּ֠/מְעַט שָׁכַ֞ב אַחַ֤ד הָ/עָם֙ אֶת אִשְׁתֶּ֔/ךָ וְ/הֵבֵאתָ֥ עָלֵ֖י/נוּ אָשָֽׁם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/010.yaml
  text: And Abimelech said[a], “What is this you have done to us? One of the people might easily have lain with your wife, and you would have brought guilt upon us.”
translation:
  language: te
  text: 'అబీమెలెకు ఇలా అన్నాడు: “నువ్వు మాకు చేసిన ఈ పని ఏమిటి? ప్రజల్లో ఎవరో ఒకరు నీ భార్యతో సులభంగానే శయనించి ఉండేవారు; అప్పుడు నువ్వు మాపై దోషాన్ని తెచ్చి ఉండేవాడివి.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַה זֹּאת עָשִׂיתָ לָּנוּ
  choice: నువ్వు మాకు చేసిన ఈ పని ఏమిటి?
  rationale: మַה זֹּאת అనే ఆశ్చర్యం, గద్దింపు కలిగిన నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతూ, לָּנוּలోని సమూహార్థాన్ని ‘మాకు’గా స్పష్టంగా ఉంచుతుంది.
- source_word: כִּמְעַט
  choice: దాదాపు ... శయనించేవారే
  rationale: ఇది జరగడానికి చాలా దగ్గరగా వచ్చిన ప్రమాదాన్ని సూచిస్తుంది. ‘దాదాపు’ మూలంలోని సమీప-సంభవ భావాన్ని నేరుగా నిలుపుతుంది; తెలుగు వాక్యంలోని ‘-వారే’ ఆ ప్రమాదం ఎంత సులభంగా జరిగి ఉండేదో తెలియజేస్తుంది.
- source_word: שָׁכַב ... אֶת אִשְׁתֶּךָ
  choice: నీ భార్యతో ... శయనించేవారే
  rationale: లైంగిక సంబంధాన్ని సూచించే హీబ్రూ నుడికారానికి ‘శయనించు’ గౌరవప్రదమైన, సూటిగా అర్థమయ్యే తెలుగు సమానం; మరీ వైద్యపరంగా గానీ వాడుకభాషగా గానీ మారదు.
- source_word: אַחַד הָעָם
  choice: ప్రజల్లో ఎవరో ఒకరు
  rationale: అక్షరార్థమైన ‘ప్రజల్లో ఒకరు’ అనే సమూహ-ఏకవచన భావాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది; మూలం స్పష్టంగా చెప్పనిది ‘పురుషుడు’ అని ప్రధాన పాఠ్యంలో చేర్చదు.
- source_word: וְהֵבֵאתָ עָלֵינוּ אָשָׁם
  choice: నువ్వు మా మీదికి అపరాధాన్ని తెచ్చి ఉండేవాడివి
  rationale: אָשָׁם ఇక్కడ కేవలం నిందను కాక, కార్యం వల్ల కలిగే నైతిక దోషబాధ్యతను సూచిస్తుంది. ‘అపరాధం’ ఆ బలాన్ని నిలుపుతూ, తరువాతి బలుల సంబంధ సాంకేతిక అర్థాన్ని అనవసరంగా రుద్దదు.
- source_word: וַיֹּאמֶר אֲבִימֶלֶךְ
  choice: అబీమెలెకు ఇలా అన్నాడు
  rationale: హీబ్రూ కథన ప్రవాహాన్ని సహజమైన తెలుగు సంభాషణ ప్రవేశంతో అందిస్తుంది; ‘ఇలా’ తరువాత వచ్చే ప్రత్యక్ష మాటకు సరళంగా దారి తీస్తుంది.
theological_decisions:
- issue: ఈ సందర్భంలో אָשָׁם స్వభావం
  choice: అపరాధం
  alternative: నింద / దోషం
  rationale: సంభవించగల లైంగిక పాపం వల్ల సమాజంపై వచ్చే వాస్తవ నైతిక బాధ్యత ఇక్కడ ప్రధాన భావం. ‘అపరాధం’ ఆ నైతిక-మతపరమైన బలాన్ని నిలుపుతుంది; కేవలం సామాజిక నిందగా కుదించదు, బలి సంబంధ సాంకేతిక పదంగా కూడా మార్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి. ‘శయనించు’ లైంగిక నుడికారాన్ని అసభ్యంగా కాకుండా స్పష్టంగా తెలియజేస్తుంది. మూలంలోని సామూహిక బాధ్యతను ‘మాకు/మా మీదికి’ ద్వారా నిలిపాం; כִּמְעַטలోని నిజమైన భావసంభావ్యతను పాదసూచికలో ఉంచాం.
