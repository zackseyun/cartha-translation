id: GEN.26.32
reference: Genesis 26:32
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְהִ֣י בַּ/יּ֣וֹם הַ/ה֗וּא וַ/יָּבֹ֨אוּ֙ עַבְדֵ֣י יִצְחָ֔ק וַ/יַּגִּ֣דוּ ל֔/וֹ עַל אֹד֥וֹת הַ/בְּאֵ֖ר אֲשֶׁ֣ר חָפָ֑רוּ וַ/יֹּ֥אמְרוּ ל֖/וֹ מָצָ֥אנוּ מָֽיִם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/032.yaml
  text: And it happened on that day that Isaac’s servants came and told him about the well that they had dug[a], and they said to him[b], “We have found water.”
translation:
  language: te
  text: ఆ రోజున[a] ఇస్సాకు సేవకులు[b] వచ్చి, వారు తవ్విన బావి గురించి అతనికి తెలియజేశారు. వారు అతనితో, “మాకు నీళ్లు దొరికాయి” అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “అదే రోజున”; అంటే, ముందటి నిబంధన సంఘటనలు జరిగిన రోజునే ఈ సమాచారం వచ్చిందని నొక్కిచెప్పవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “సేవకులు” అనే పదాన్ని “దాసులు” అని కూడా అనువదించవచ్చు. హీబ్రూ పదం యజమాని ఇంటికి బంధితులై పనిచేసేవారిని సూచించగలదు; అయితే ఇక్కడ ఆ సామాజిక అర్థ ఛాయ ప్రధానంగా లేదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: ఆ రోజున … వచ్చి
  rationale: హీబ్రూ కథన సూత్రాన్ని తెలుగులో విడిగా ‘జరిగింది’ అని అనవసరంగా చేర్చకుండా, సంఘటనల వరుసను సహజమైన కథన వాక్య నిర్మాణంతో వ్యక్తం చేస్తుంది.
- source_word: בַּיּוֹם הַהוּא
  choice: ఆ రోజున
  rationale: ముందటి సంఘటనలకు సంబంధించిన నిర్దిష్టమైన రోజును సూచించే ప్రదర్శక భావాన్ని నిలుపుతుంది; ‘అదే రోజున’ అనే సాధ్యమైన నొక్కిచెప్పే అర్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: עַבְדֵי יִצְחָק
  choice: ఇస్సాకు సేవకులు
  rationale: עבד అనే పదం సేవకులను లేదా దాసులను సూచించగలదు. ఈ సందర్భంలో వారి గృహసంబంధ పని పాత్రే ప్రధానంగా కనిపిస్తున్నందున సహజమైన ‘సేవకులు’ ఎంచుకున్నాం; సామాజిక అర్థ ఛాయను పాదసూచికలో తెలిపాం.
- source_word: וַיַּגִּדוּ לוֹ
  choice: అతనికి తెలియజేశారు
  rationale: నגד హిఫీల్ రూపంలోని తెలియజేయడం లేదా నివేదించడం అనే భావాన్ని ఆధునిక ప్రామాణిక తెలుగులో స్పష్టంగా ఇస్తుంది.
- source_word: עַל אֹדוֹת הַבְּאֵר אֲשֶׁר חָפָרוּ
  choice: వారు తవ్విన బావి గురించి
  rationale: సంబంధ వాక్యాన్ని, ‘గురించి’ అనే భావాన్ని నేరుగా మరియు సహజంగా నిలుపుతుంది.
- source_word: וַיֹּאמְרוּ לוֹ
  choice: వారు అతనితో … అన్నారు
  rationale: మూలంలోని స్పష్టమైన ప్రత్యక్ష వాక్య పరిచయాన్ని నిలుపుతుంది.
- source_word: מָצָאנוּ מָיִם
  choice: మాకు నీళ్లు దొరికాయి
  rationale: బావి తవ్వడంలో నీరు లభించిందనే ఫలితాన్ని సాధారణ ఆధునిక తెలుగులో సహజంగా ప్రకటిస్తుంది; హీబ్రూలోని మొదటి పురుష బహువచన దృష్టికోణం ‘మాకు’ ద్వారా నిలుస్తుంది.
