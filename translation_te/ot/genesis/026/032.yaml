translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని పునరుక్తమైన నివేదిక-ప్రత్యక్ష వాక్య నిర్మాణం నిలుపబడింది.
