  yaml_path: translation/ot/genesis/026/005.yaml
  text: because Abraham obeyed my voice and kept my charge[a], my commandments, my statutes[b], and my laws.
translation:
  language: te
  text: ఎందుకంటే అబ్రాహాము నా మాట విని[a], నేను అతనికి అప్పగించిన బాధ్యతను, నా ఆజ్ఞలను, నా శాసనాలను, నా ధర్మనియమాలను[b] పాటించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘నా మాటకు లోబడ్డాడు.’ ‘నా మాట వినడం’ అనే హీబ్రూ నుడికారం తరచుగా విధేయతతో వినడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘నా ఉపదేశాలను.’ ‘తోరా’ అనే హీబ్రూ పదానికి సందర్భానుసారంగా ‘ధర్మనియమం,’ ‘ఉపదేశం,’ లేదా ‘బోధ’ అనే అర్థాలు ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵקֶב
  choice: ఎందుకంటే
  rationale: ఈ పదం ముందున్న వాగ్దానానికి అబ్రాహాము విధేయతను కారణంగా చూపుతోంది; ఆధునిక తెలుగులో కారణార్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: שָׁמַע ... בְּקֹלִי
  choice: నా మాట విని
  rationale: హీబ్రూ నుడికారంలోని వినికిడి రూపకాన్ని నిలుపుతూ, సందర్భంలో విధేయంగా స్పందించాడనే భావాన్ని కూడా సహజంగా సూచిస్తుంది.
- source_word: וַיִּשְׁמֹר
  choice: పాటించాడు
  rationale: చట్టపరమైన, ఒడంబడిక సంబంధమైన అంశాలను కాపాడడం లేదా ఆచరించడం అనే భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: מִשְׁמַרְתִּי
  choice: నేను అతనికి అప్పగించిన బాధ్యతను
  rationale: కాపాడవలసిందిగా అప్పగించిన బాధ్యత లేదా విధి అనే ప్రత్యేక భావాన్ని తరువాతి ఆజ్ఞలు, శాసనాలు అనే పదాల్లో కలిపివేయకుండా నిలుపుతుంది.
- source_word: מִצְוֺתַי
  choice: నా ఆజ్ఞలను
  rationale: ఒడంబడిక, న్యాయ సందర్భాల్లో ఈ హీబ్రూ పదానికి స్పష్టమైన, సాధారణ తెలుగు సమానార్థకం.
- source_word: חֻקּוֹתַי
  choice: నా శాసనాలను
  rationale: నిర్దేశించబడిన కట్టడలు లేదా విధుల భావాన్ని తెలియజేస్తూ, ఆజ్ఞలు మరియు ధర్మనియమాలు అనే సమీపార్థక పదాలనుంచి తగిన భేదాన్ని ఉంచుతుంది.
- source_word: וְתוֹרֹתָי
  choice: నా ధర్మనియమాలను
  rationale: ఈ న్యాయపరమైన పదాల జాబితాలో తోరా పదానికి ఉన్న నియమ లేదా ధర్మశాస్త్ర భావాన్ని తెలియజేస్తుంది; దాని విస్తృతమైన ఉపదేశం అనే భావాన్ని పాదసూచికలో నిలుపుతుంది.
theological_decisions:
- issue: సీనాయి ధర్మశాస్త్రానికి ముందే వాడిన ఒడంబడిక-న్యాయ పదాల సమూహం
  choice: బాధ్యత, ఆజ్ఞలు, శాసనాలు, ధర్మనియమాలు అనే వేర్వేరు పదాలను నిలుపడం
  alternative: ఈ జాబితాను ‘నా నియమాలన్నిటినీ’ వంటి ఒకే సరళ పదబంధంగా కుదించడం లేదా తోరా పదాన్ని కేవలం ‘ఉపదేశాలు’గా అనువదించడం
  rationale: మూలపాఠం అబ్రాహాము సంపూర్ణ విధేయతను నొక్కిచెప్పేందుకు సమీపార్థక పదాలను వరుసగా పేర్చుతుంది. వాటిని విడిగా ఉంచడం ద్వారా సీనాయికి ముందున్న విధేయతకు తరువాతి తోరా వర్గాలతో ఉన్న సంబంధం గురించిన పాఠ్య ఉద్రిక్తతను సిద్ధాంతపరంగా పరిష్కరించకుండా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనదీ గౌరవప్రదమైనదీ అయిన శైలిని ఉపయోగించాం. ‘నా మాట విని’ అనే రూపం హీబ్రూ శ్రవణ రూపకాన్ని నిలుపుతుంది; ‘అప్పగించిన బాధ్యత’ మిష్మెరెత్ పదాన్ని అస్పష్టమైన లేదా అతిగా సంప్రదాయబద్ధమైన పదంతో కాకుండా సాధారణ పాఠకునికి అర్థమయ్యేలా చేస్తుంది.
