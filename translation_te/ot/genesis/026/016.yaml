source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר אֲבִימֶ֖לֶךְ אֶל יִצְחָ֑ק לֵ֚ךְ מֵֽ/עִמָּ֔/נוּ כִּֽי עָצַֽמְתָּ מִמֶּ֖/נּוּ מְאֹֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/016.yaml
  text: Then Abimelech said to Isaac[a], “Go away from us, because you have become much stronger than we are.”
translation:
  language: te
  text: అప్పుడు అబీమెలెకు ఇస్సాకుతో, “మమ్మల్ని విడిచి వెళ్లిపో; ఎందుకంటే నీవు మాకంటే ఎంతో బలవంతుడివయ్యావు[a]” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీవు మాతో పోలిస్తే ఎంతో శక్తిమంతుడివయ్యావు.”
    reason: עָצַם అనే క్రియ బలం లేదా శక్తిలో గొప్పవాడవడం అనే భావాన్ని ఇస్తుంది; తులనను ‘మాకంటే’ లేదా ‘మాతో పోలిస్తే’ అని వ్యక్తపరచవచ్చు.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... అన్నాడు
  rationale: వావ్-వరుస కథనాన్ని ముందుకు నడిపిస్తుంది; ఆధునిక తెలుగులో ‘అప్పుడు’ ఆ క్రమాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: אֲבִימֶלֶךְ
  choice: అబీమెలెకు
  rationale: వ్యక్తి పేరును ప్రామాణిక తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: אֶל יִצְחָק
  choice: ఇస్సాకుతో
  rationale: మాట్లాడబడిన వ్యక్తిని తెలుగులో సహజంగా సూచించే రూపం.
- source_word: לֵךְ מֵעִמָּנוּ
  choice: మా దగ్గర నుండి వెళ్లిపో
  rationale: ‘మాతో ఉన్న స్థలం నుండి దూరంగా వెళ్లు’ అనే ఆజ్ఞార్థక భావాన్ని సహజంగా, స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: అబీమెలెకు ఇచ్చిన ఆజ్ఞకు కారణాన్ని పరిచయం చేస్తుంది; ఆధునిక తెలుగులో స్పష్టమైన కారణసూచకం.
- source_word: עָצַמְתָּ
  choice: బలవంతుడివయ్యావు
  rationale: ఈ సందర్భంలో బలవంతుడు/శక్తిమంతుడు కావడం అనే భావం ఉంది; పరిమితికి మించి శక్తిమంతుడయ్యాడనే అదనపు భావాన్ని చేర్చలేదు.
- source_word: מִמֶּנּוּ מְאֹד
  choice: మాకంటే ఎంతో
  rationale: מִן యొక్క తులనార్థక ప్రయోగాన్నీ, מְאֹד ఇచ్చే తీవ్రతనూ తెలుగులో నేరుగా నిలుపుతుంది.
