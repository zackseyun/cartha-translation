translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘గొర్రెలు-మేకల మందలు’ ద్వారా צֹאן యొక్క పరిధిని స్పష్టంచేశాం; עֲבֻדָּה רַבָּה లోని నిజమైన పదార్థ అనిశ్చితిని పాదసూచికలో నిలిపాం.
