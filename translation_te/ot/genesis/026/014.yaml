id: GEN.26.14
reference: Genesis 26:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַֽ/יְהִי ל֤/וֹ מִקְנֵה צֹאן֙ וּ/מִקְנֵ֣ה בָקָ֔ר וַ/עֲבֻדָּ֖ה רַבָּ֑ה וַ/יְקַנְא֥וּ אֹת֖/וֹ פְּלִשְׁתִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/014.yaml
  text: He had flocks[a], herds, and a large household[b], and the Philistines envied him.
translation:
  language: te
  text: అతనికి గొర్రెలు-మేకల మందలు, పశువుల మందలు, విస్తారమైన పనివర్గం[a] ఉండేవి; ఫిలిష్తీయులు అతనిపై అసూయపడ్డారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూలభాషలో, ‘విస్తారమైన సేవ/శ్రమ’; ఇది పెద్ద సంఖ్యలో సేవకులు లేదా పనివారిని సూచించే అవకాశం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי לוֹ
  choice: అతనికి ... ఉండేవి
  rationale: హీబ్రూ היה + ל నిర్మాణం స్వామ్యాన్ని సూచిస్తుంది; తెలుగులో ‘అతనికి ... ఉండేవి’ సహజమైన సమానార్థక నిర్మాణం.
- source_word: מִקְנֵה צֹאן
  choice: గొర్రెలు-మేకల మందలు
  rationale: צֹאן చిన్న పశువులను, ముఖ్యంగా గొర్రెలు మరియు మేకలను సూచించగలదు; ‘మందలు’ సమూహ సంపద భావాన్ని నిలుపుతుంది.
- source_word: וּמִקְנֵה בָקָר
  choice: పశువుల మందలు
  rationale: בָקָר ప్రధానంగా గోవులవంటి పెద్ద పశువులను సూచిస్తుంది; ఆధునిక తెలుగులో ‘పశువుల మందలు’ సహజంగా ఉంది.
- source_word: וַעֲבֻדָּה רַבָּה
  choice: విస్తారమైన పనివర్గం
  rationale: עֲבֻדָּה సేవ, శ్రమ లేదా ఆ సేవను చేసే పనివర్గాన్ని సూచించవచ్చు. పశుసంపదతో కూడిన ఈ సందర్భంలో పెద్ద సంఖ్యలో సేవకులు/పనివారు అనే భావం సంభావ్యమైనది; అయితే మూలంలోని విస్తృతార్థాన్ని పాదసూచికలో నిలిపాం.
- source_word: וַיְקַנְאוּ אֹתוֹ
  choice: అతనిపై అసూయపడ్డారు
  rationale: קנא ఇక్కడ ఇస్సాకు సమృద్ధిని చూసి కలిగిన అసూయను సూచిస్తుంది; ఈ సందర్భంలో ఇది సహజమైన తెలుగు ప్రయోగం.
- source_word: פְּלִשְׁתִּים
  choice: ఫిలిష్తీయులు
  rationale: ఈ ప్రజాసమూహానికి ప్రామాణిక తెలుగు రూపం.
