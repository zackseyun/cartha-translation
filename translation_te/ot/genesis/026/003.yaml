  text: גּ֚וּר בָּ/אָ֣רֶץ הַ/זֹּ֔את וְ/אֶֽהְיֶ֥ה עִמְּ/ךָ֖ וַ/אֲבָרְכֶ֑/ךָּ כִּֽי לְ/ךָ֣ וּֽ/לְ/זַרְעֲ/ךָ֗ אֶתֵּן֙ אֶת כָּל הָֽ/אֲרָצֹ֣ת הָ/אֵ֔ל וַ/הֲקִֽמֹתִי֙ אֶת הַ/שְּׁבֻעָ֔ה אֲשֶׁ֥ר נִשְׁבַּ֖עְתִּי לְ/אַבְרָהָ֥ם אָבִֽי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/003.yaml
  text: Stay in this land[a], and I will be with you and bless you, for to you and to your offspring I will give all these lands[c][b], and I will establish the oath that I swore to Abraham your father.
translation:
  language: te
  text: ఈ దేశంలో పరదేశిగా నివసించు[a]. నేను నీకు తోడుగా ఉండి నిన్ను ఆశీర్వదిస్తాను. ఎందుకంటే నీకూ నీ సంతానానికీ[b] ఈ దేశాలన్నిటినీ ఇస్తాను; నీ తండ్రి అబ్రాహాముకు నేను చేసిన ప్రమాణాన్ని స్థిరపరుస్తాను[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఈ దేశంలో తాత్కాలిక నివాసిగా ఉండు.” హీబ్రూ క్రియ పరదేశిగా లేదా తాత్కాలిక నివాసిగా ఉండడాన్ని సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా “విత్తనం”; ఇక్కడ అది సమష్టిగా సంతానాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: లేదా, “ధృవపరుస్తాను” లేదా “నెరవేరుస్తాను.”
    reason: alternative_reading
lexical_decisions:
- source_word: גּוּר
  choice: పరదేశిగా నివసించు
  rationale: גור అనే క్రియ తాత్కాలిక నివాసిగా లేదా పరదేశిగా ఉండడాన్ని సూచిస్తుంది. కేవలం ‘ఉండు’ అనడం కంటే మూలంలోని సామాజిక స్థితిని ఇది స్పష్టంగా నిలుపుతుంది.
- source_word: בָּאָרֶץ הַזֹּאת
  choice: ఈ దేశంలో
  rationale: ఇక్కడ אֶרֶץ నిర్దిష్ట భూభాగాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘ఈ దేశంలో’ సహజంగా ఉండి, తరువాతి బహువచన ప్రయోగంతోనూ సరిపోతుంది.
- source_word: וְאֶהְיֶה עִמְּךָ
  choice: నేను నీకు తోడుగా ఉండి
  rationale: దైవసాన్నిధ్యాన్ని తెలిపే సూటి వాగ్దాన సూత్రాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: וַאֲבָרְכֶךָ
  choice: నిన్ను ఆశీర్వదిస్తాను
  rationale: హీబ్రూ వాగ్దాన క్రమాన్ని తెలుగులో స్పష్టమైన భవిష్యత్ వాక్యంగా అందిస్తుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ఆజ్ఞకు మరియు దైవసాన్నిధ్య వాగ్దానానికి ఆధారాన్ని పరిచయం చేసే వివరణాత్మక భావాన్ని తెలియజేస్తుంది.
- source_word: לְךָ וּלְזַרְעֲךָ
  choice: నీకూ నీ సంతానానికీ
  rationale: זֶרַע ఇక్కడ సమష్టివాచకంగా ఇస్సాకు వంశాన్ని సూచిస్తుంది. ‘సంతానం’ తెలుగులో సమష్టి భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: כָּל הָאֲרָצֹת הָאֵל
  choice: ఈ దేశాలన్నిటినీ
  rationale: అనేక భూభాగాలను సూచించే బహువచనాన్ని కాపాడుతూ, ముందున్న ‘దేశం’తో పదసంబంధాన్ని నిలుపుతుంది.
- source_word: וַהֲקִמֹתִי
  choice: స్థిరపరుస్తాను
  rationale: קום హిఫీల్ రూపం ప్రమాణాన్ని అమలులో నిలబెట్టడం లేదా ధృవపరచడం అనే భావాన్ని కలిగిస్తుంది. ‘స్థిరపరుస్తాను’ మూలరూపకాన్ని, దాని గంభీరతను కాపాడుతుంది.
- source_word: הַשְּׁבֻעָה אֲשֶׁר נִשְׁבַּעְתִּי
  choice: నేను చేసిన ప్రమాణాన్ని
  rationale: తెలుగులో ‘ప్రమాణం చేయడం’ సహజమైన ప్రయోగం. హీబ్రూలోని నామవాచకం-క్రియ పునరుక్తిని అసహజంగా నకలు చేయకుండా ప్రమాణ స్వభావాన్ని ఖచ్చితంగా అందిస్తుంది.
- source_word: לְאַבְרָהָם אָבִיךָ
  choice: నీ తండ్రి అబ్రాహాముతో
  rationale: లְ ఇక్కడ ప్రమాణం ఎవరికి/ఎవరితో చేయబడిందో సూచిస్తుంది. తెలుగులో ‘అబ్రాహాముతో చేసిన ప్రమాణం’ సహజంగా, స్పష్టంగా ఉంటుంది.
theological_decisions:
- issue: ప్రమాణాన్ని స్థాపించడం అనే నిబంధనాత్మక వాగ్దాన భాష
  choice: ప్రమాణాన్ని స్థిరపరుస్తాను
  alternative: ప్రమాణాన్ని ధృవపరుస్తాను / నెరవేరుస్తాను
  rationale: మూలపాఠం ప్రమాణాన్ని ‘నిలబెట్టడం/స్థాపించడం’ అని చెబుతుంది; అది కేవలం కొత్తగా ధృవీకరించడమా లేక పూర్తిగా నెరవేర్చడమా అని నిర్దిష్టం చేయదు. అందువల్ల ‘స్థిరపరుస్తాను’ ఆ భావవ్యాప్తిని కాపాడుతుంది.
- issue: זֶרַע యొక్క సమష్టి భావం
  choice: సంతానం
  alternative: విత్తనం / వంశస్థులు
  rationale: తక్షణ సందర్భంలో ఇస్సాకు నుండి వచ్చే వంశం ప్రధానంగా ఉద్దేశించబడింది. ‘సంతానం’ సమష్టి భావాన్ని నిలుపుతూ, పదాన్ని అనవసరంగా ఏకవచన వ్యక్తికి పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘పరదేశిగా నివసించు’ మూలంలోని తాత్కాలిక నివాస భావాన్ని ప్రధాన పాఠ్యంలో నిలుపుతుంది; ‘ప్రమాణాన్ని స్థిరపరుస్తాను’ నిబంధనాత్మక గంభీరతను అతివ్యాఖ్యానం లేకుండా కాపాడుతుంది.
