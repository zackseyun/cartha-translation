    reason: lexical_alternative
  revision_rationale: The revision replaces the potentially misleading singular imperative with the polite plural/impersonal Telugu optative “ఉండనివ్వండి,” clarifies the bilateral phrase with idiomatic coordination, and uses “ఒడంబడిక” as a natural rendering of covenant in a treaty setting. It retains the source’s emphasis, repetition, divine name, and the footnoted lexical ambiguity.
