id: GEN.26.28
reference: Genesis 26:28
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּאמְר֗וּ רָא֣וֹ רָאִינוּ֮ כִּֽי הָיָ֣ה יְהוָ֣ה עִמָּ/ךְ֒ וַ/נֹּ֗אמֶר תְּהִ֨י נָ֥א אָלָ֛ה בֵּינוֹתֵ֖י/נוּ בֵּינֵ֣י/נוּ וּ/בֵינֶ֑/ךָ וְ/נִכְרְתָ֥ה בְרִ֖ית עִמָּֽ/ךְ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/028.yaml
  text: And they said[a], “We have clearly seen that Yahweh has been with you. So we said, ‘Please let there be an oath between us, between you and us[b], and let us make a covenant with you.’”
translation:
  language: te
  text: 'వారు ఇలా అన్నారు: “యెహోవా నీకు తోడుగా ఉన్నాడని మేము స్పష్టంగా చూశాం. అందుకే, ‘మన రెండు పక్షాల మధ్య—అంటే మాకూ నీకూ మధ్య—ఒక ప్రమాణం ఉండనివ్వండి[a]; నీతో ఒక ఒడంబడిక చేసుకుందాం’ అని మేము చెప్పుకున్నాం.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పదం, ప్రమాణాన్ని ఉల్లంఘిస్తే శాపం కలగాలని ఆహ్వానించే “శాప ప్రమాణం”ను కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: వారు ఇలా అన్నారు
  rationale: వావ్-కన్సిక్యూటివ్ కథన ప్రవాహాన్ని సహజమైన ఆధునిక తెలుగులో కొనసాగిస్తుంది.
- source_word: רָאוֹ רָאִינוּ
  choice: మేము స్పష్టంగా చూశాం
  rationale: ఇన్ఫినిటివ్ అబ్సల్యూట్‌తో కూడిన క్రియలోని బలాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: כִּי הָיָה יְהוָה עִמָּךְ
  choice: యెహోవా నీకు తోడుగా ఉన్నాడని
  rationale: הָיָה సూచించే గమనించిన స్థితిని తెలుగు సందర్భంలో సహజంగా తెలియజేస్తుంది; అది ప్రస్తుతం పూర్తిగా ముగిసిందని అనవసరంగా సూచించదు.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో స్థిరపడిన లిప్యంతరీకరణతో నిలుపుతుంది.
- source_word: וַנֹּאמֶר
  choice: అందుకే ... అని అనుకున్నాం
  rationale: ముందటి పరిశీలన నుంచి వచ్చిన నిర్ణయాన్ని ‘అందుకే’ తెలియజేస్తుంది; బహువచన వక్తల అంతర్గత నిర్ణయానికి ‘అనుకున్నాం’ సహజంగా సరిపోతుంది.
- source_word: תְּהִי נָא
  choice: ఉండనివ్వు
  rationale: జస్సివ్‌తో נָא కలిగిన విజ్ఞాపన భావాన్ని గౌరవపూర్వకమైన తెలుగు ఆజ్ఞార్థ రూపంలో వ్యక్తం చేస్తుంది.
- source_word: אָלָה
  choice: ప్రమాణం
  rationale: ఒడంబడిక సందర్భంలో సాధారణంగా అర్థమయ్యే పదం; ఉల్లంఘనకు శాపాన్ని ఆహ్వానించే ప్రమాణం అనే సాధ్యమైన బలమైన భావాన్ని పాదసూచికలో ఉంచింది.
- source_word: בֵּינוֹתֵינוּ בֵּינֵינוּ וּבֵינֶךָ
  choice: మన మధ్య—మాకు నీకు మధ్య
  rationale: హీబ్రూలోని ఉద్దేశపూర్వక పునరుక్తిని పూర్తిగా తొలగించకుండా, రెండు పక్షాల మధ్య ఒప్పందమనే భావాన్ని తెలుగులో స్పష్టంగా ఉంచుతుంది.
- source_word: וְנִכְרְתָה בְרִית
  choice: మేము ... ఒక నిబంధన చేసుకుందాం
  rationale: అక్షరార్థంగా ‘నిబంధనను కోయడం’ అనే హీబ్రూ నుడికారానికి సహజమైన తెలుగు సమానార్థక ప్రయోగం.
- source_word: עִמָּךְ
  choice: నీతో
  rationale: ఇస్సాకును ఉద్దేశించిన ఏకవచన ప్రత్యక్ష సంబోధనను నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה దైవనామాన్ని ఎలా అనువదించాలి
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉన్నందున దానిని బిరుదుతో భర్తీ చేయకుండా తెలుగులో పరిచితమైన రూపంలో ఇచ్చింది.
- issue: אָלָה లోని శాపసహిత ప్రమాణ భావం
  choice: ప్రధాన పాఠంలో ‘ప్రమాణం’; పాదసూచికలో శాప ప్రమాణ భావం
  alternative: ప్రధాన పాఠంలో ‘శాప ప్రమాణం’
  rationale: ఈ పదం సాధారణ ప్రమాణాన్ని సూచించగలిగినా, దాన్ని ఉల్లంఘిస్తే శాపం కలగాలని ఆహ్వానించే భావమూ ఉండవచ్చు. ప్రధాన పాఠంలో ఒకే అర్థాన్ని బలవంతంగా నిర్ణయించకుండా సందిగ్ధతను పాదసూచికలో భద్రపరిచింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. మూలంలోని గట్టి పునరుక్తిని డాష్ సహాయంతో చదవదగిన రూపంలో నిలిపింది.
