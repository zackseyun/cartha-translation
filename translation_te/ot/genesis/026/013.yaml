  text: וַ/יִּגְדַּ֖ל הָ/אִ֑ישׁ וַ/יֵּ֤לֶךְ הָלוֹךְ֙ וְ/גָדֵ֔ל עַ֥ד כִּֽי גָדַ֖ל מְאֹֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/013.yaml
  text: And the man became great[a], and he continued to grow greater until he became very great.
translation:
  language: te
  text: ఆ మనిషి గొప్పవాడయ్యాడు; అతడు అంతకంతకు వృద్ధి చెందుతూ చివరకు ఎంతో గొప్పవాడయ్యాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతడు మరింత మరింతగా ఎదుగుతూ పోయాడు.” కొనసాగుతున్న పెరుగుదలను బలంగా తెలియజేయడానికి హెబ్రీలో క్రియారూపాలు వరుసగా ఉపయోగించబడ్డాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְדַּל
  choice: గొప్పవాడయ్యాడు
  rationale: גדל ఇక్కడ హోదా, ప్రాభవం, సంపదలలో వృద్ధి చెంది గొప్పవాడవడాన్ని సూచిస్తుంది. సందర్భంలో ఐశ్వర్యం ఉన్నప్పటికీ, అర్థాన్ని కేవలం ధనవంతుడవడానికి పరిమితం చేయకుండా మూలంలోని విస్తృత భావాన్నీ పదపునరుక్తినీ నిలుపుతుంది.
- source_word: הָאִישׁ
  choice: ఆ మనిషి
  rationale: איש ఇక్కడ ముందుగా ప్రస్తావించబడిన ఇస్సాకును సూచించే నిర్దిష్ట పురుష ఏకవచనం. తెలుగు వచనప్రవాహంలో ‘ఆ మనిషి’ సహజంగా ఆ సూచనను తెలియజేస్తుంది.
- source_word: וַיֵּלֶךְ הָלוֹךְ וְגָדֵל
  choice: అంతకంతకు వృద్ధి చెందుతూ
  rationale: సమాపక క్రియ, క్రియానామం, కృదంతం కలిసిన హెబ్రీ నిర్మాణం నిరంతరంగా, క్రమంగా పెరుగుతున్న చర్యను బలపరుస్తుంది. హెబ్రీలోని ‘వెళ్లడం’ అనే క్రియను తెలుగులో యథాతథంగా ఉంచితే అపార్థం కలగవచ్చు; ‘అంతకంతకు’ దాని ప్రగతిశీల బలాన్ని సహజంగా అందిస్తుంది.
- source_word: עַד כִּי
  choice: చివరకు
  rationale: కొనసాగిన వృద్ధి చేరుకున్న పరాకాష్ఠను ఈ సందర్భంలో సహజంగా వ్యక్తం చేస్తుంది; కారణార్థాన్ని అనవసరంగా చేర్చదు.
- source_word: גָדַל מְאֹד
  choice: ఎంతో గొప్పవాడయ్యాడు
  rationale: מאד యొక్క తీవ్రతను ‘ఎంతో’ తెలియజేస్తుంది; גדל పునరావృతాన్ని ‘గొప్పవాడయ్యాడు’గా నిలుపుతూ అర్థాన్ని సంపదకే పరిమితం చేయదు.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘అంతకంతకు వృద్ధి చెందుతూ’ అనే ప్రయోగం మూలంలోని ప్రగతిశీల హెబ్రీ నుడికారాన్ని పదశః అనుకరించకుండా స్పష్టంగా అందిస్తుంది. ప్రధాన పాఠంలోని [a] సూచిక సంబంధిత పాదటిప్పణితో సరిపోలుతుంది.
