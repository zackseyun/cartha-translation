revisions:
- from: కాబట్టి అబ్రాము తన గుడారాన్ని తరలించి, హెబ్రోనులో ఉన్న మమ్రే సింధూర వృక్షాల[a] దగ్గరికి వచ్చి నివసించాడు. అక్కడ అతడు యెహోవాకు[b] ఒక బలిపీఠాన్ని కట్టాడు.
  to: అప్పుడు అబ్రాము తన గుడారాన్ని మార్చి, హెబ్రోనులో ఉన్న మమ్రే పెద్ద చెట్ల[a] వద్దకు వచ్చి అక్కడ నివసించాడు. అక్కడ అతడు యాహ్వేకు[b] ఒక బలిపీఠాన్ని కట్టాడు.
  rationale: The revision corrects the narrative connective, avoids over-specifying the uncertain tree species, and aligns the rendering of the Tetragrammaton with the supplied POB policy. It retains the Hebrew narrative progression and the location-specific force of “there.”
