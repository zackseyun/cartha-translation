source:
  edition: WLC
  text: וַ/יֶּאֱהַ֣ל אַבְרָ֗ם וַ/יָּבֹ֛א וַ/יֵּ֛שֶׁב בְּ/אֵלֹנֵ֥י מַמְרֵ֖א אֲשֶׁ֣ר בְּ/חֶבְר֑וֹן וַ/יִּֽבֶן שָׁ֥ם מִזְבֵּ֖חַ לַֽ/יהוָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/018.yaml
  text: So Abram moved his tent and came and settled by the oaks of Mamre[a], which are at Hebron[b], and there he built an altar to Yahweh.
translation:
  language: te
  text: అప్పుడు అబ్రాము తన గుడారాన్ని మార్చి, హెబ్రోనులో ఉన్న మమ్రే పెద్ద చెట్ల[a] వద్దకు వచ్చి అక్కడ నివసించాడు. అక్కడ అతడు యాహ్వేకు[b] ఒక బలిపీఠాన్ని కట్టాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మమ్రే ఓక్ చెట్లు” లేదా “మమ్రే టెరెబింతు చెట్లు”; హీబ్రూ పదం ఓక్, టెరెబింతు, లేదా ఇతర పెద్ద చెట్లను సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: 'హీబ్రూ: יהוה (YHWH). ఈ దైవనామానికి “యెహోవా” అనే సంప్రదాయ రూపం కూడా వాడబడుతుంది.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֶּאֱהַל
  choice: తన గుడారాన్ని తరలించి
  rationale: אהל క్రియ గుడారంతో మకాం మార్చడాన్ని సూచిస్తుంది. తరువాత వచ్చే ‘వచ్చి నివసించాడు’ అనే క్రమాన్ని పునరుక్తి చేయకుండా, ప్రయాణ చర్యను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וַיָּבֹא וַיֵּשֶׁב
  choice: వచ్చి నివసించాడు
  rationale: రెండు హీబ్రూ క్రియల కథన క్రమాన్ని నిలుపుతూ, చేరుకోవడం మరియు అక్కడ స్థిరంగా ఉండడం అనే భావాలను స్పష్టంగా తెలియజేస్తుంది.
- source_word: בְּאֵלֹנֵי מַמְרֵא
  choice: మమ్రే సింధూర వృక్షాల దగ్గరికి
  rationale: אֵלֹנֵי అనే పదం ఓక్ లేదా టెరెబింతు వంటి పెద్ద వృక్షాలను సూచించవచ్చు. ‘సింధూర వృక్షాలు’ టెరెబింతును తెలుగులో గుర్తించదగిన విధంగా అందిస్తుంది; జాతి అనిశ్చితిని పాదసూచికలో ఉంచింది.
- source_word: אֲשֶׁר בְּחֶבְרוֹן
  choice: హెబ్రోనులో ఉన్న
  rationale: సంబంధవాచక ఉపవాక్యం మమ్రే వృక్షాలున్న ప్రదేశాన్ని సూచిస్తుంది. తెలుగులో సహజమైన పదక్రమం కోసం ఇది నామవాచక పదబంధానికి ముందు ఉంచబడింది.
- source_word: וַיִּבֶן שָׁם מִזְבֵּחַ
  choice: అక్కడ అతడు ఒక బలిపీఠాన్ని కట్టాడు
  rationale: שָׁם అనే స్థల సూచనను స్పష్టంగా నిలుపుతూ, מִזְבֵּחַకు సాధారణ తెలుగు బైబిలు పదమైన ‘బలిపీఠం’ వాడబడింది.
- source_word: לַיהוָה
  choice: యెహోవాకు
  rationale: హీబ్రూ వ్యక్తిగత దైవనామం יהוהను బిరుదుతో భర్తీ చేయకుండా పేరుగా అందిస్తుంది. ‘యెహోవా’ ఆధునిక తెలుగు పాఠకులకు విస్తృతంగా పరిచితమైన రూపం.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: మూలపాఠంలో ఉన్న నాలుగు అక్షరాల దైవనామాన్ని సాధారణ బిరుదైన ‘ప్రభువు’తో భర్తీ చేయకుండా వ్యక్తిగత పేరుగా ఉంచబడింది. ఖచ్చితమైన ప్రాచీన ఉచ్చారణ నిర్ధారితం కానందున ‘యాహ్వే’ ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- issue: אֵלֹנֵי సూచించే వృక్షజాతి
  choice: సింధూర వృక్షాలు
  alternative: సిందూర వృక్షాలు; ఓక్ వృక్షాలు; పెద్ద వృక్షాలు
  rationale: హీబ్రూ పదం సూచించే ఖచ్చితమైన వృక్షజాతి అనిశ్చితమైనది. ప్రధాన పాఠంలో ఒక సాధ్యమైన నిర్దిష్ట అర్థాన్ని ఇచ్చి, నిజమైన పదార్థ అనిశ్చితిని పాదసూచికలో స్పష్టంగా నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన కథన శైలి వాడబడింది. హీబ్రూ వాక్యంలోని వరుస చర్యలు మరియు ‘అక్కడ’ అనే స్థల ప్రాధాన్యం నిలుపబడ్డాయి.
