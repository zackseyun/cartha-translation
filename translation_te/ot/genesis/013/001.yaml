revisions:
- from: అబ్రాము ఈజిప్టు నుండి పైకి బయలుదేరి, తన భార్యతో, తనకు ఉన్న సమస్తంతో, తనతో ఉన్న లోతుతో కలిసి నెగెబుకు[a] వెళ్లాడు.
  to: అబ్రాము తన భార్యతోను, తనకు ఉన్నదంతటితోను, లోతుతోను ఈజిప్టు నుండి నెగెబుకు[a] పైకి వెళ్లాడు.
  rationale: The revision directly renders the Hebrew ascent verb with ‘పైకి వెళ్లాడు’ and simplifies Lot’s accompaniment without loss of meaning. It keeps the broad scope of ‘all that he had,’ preserves the Negev as a geographic name in the text, and retains the lexical alternative in the footnote.
  reviewer_model: gpt-5.6-terra
