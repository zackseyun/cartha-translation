source:
  edition: WLC
  text: וַ/יַּעַל֩ אַבְרָ֨ם מִ/מִּצְרַ֜יִם ה֠וּא וְ/אִשְׁתּ֧/וֹ וְ/כָל אֲשֶׁר ל֛/וֹ וְ/ל֥וֹט עִמּ֖/וֹ הַ/נֶּֽגְבָּ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/001.yaml
  text: So Abram went up from Egypt[a], he and his wife and all that he had, and Lot with him, to the Negev.
translation:
  language: te
  text: అబ్రాము తన భార్యతోను, తనకు ఉన్నదంతటితోను, లోతుతోను ఈజిప్టు నుండి నెగెబుకు[a] పైకి వెళ్లాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దక్షిణం వైపు.’ హీబ్రూ ‘నెగెబ్’ నెగెబు అనే దక్షిణ ప్రాంతాన్నిగానీ, సాధారణంగా దక్షిణ దిశనిగానీ సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: పైకి బయలుదేరి … వెళ్లాడు
  rationale: עלה అనే క్రియలోని ‘పైకి వెళ్లడం’ భావాన్ని నిలుపుతూ, ఈజిప్టు నుండి దేశంలోకి సాగిన ప్రయాణాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: מִמִּצְרַיִם
  choice: ఈజిప్టు నుండి
  rationale: מן పూర్వప్రత్యయం మరియు స్థలనామానికి నేరమైన, సహజమైన అనువాదం.
- source_word: הוּא וְאִשְׁתּוֹ
  choice: తన భార్యతో
  rationale: స్వతంత్ర సర్వనామంతో కూడిన సహప్రయాణ భావాన్ని తెలుగులో అనవసర పునరుక్తి లేకుండా సహజంగా అందిస్తుంది.
- source_word: וְכָל אֲשֶׁר לוֹ
  choice: తనకు ఉన్న సమస్తంతో
  rationale: ఈ విస్తృత పదబంధాన్ని కేవలం వస్తుసంపదకే పరిమితం చేయకుండా, అబ్రాముకు చెందినదంతా అనే భావంలో ఉంచుతుంది.
- source_word: וְלוֹט עִמּוֹ
  choice: తనతో ఉన్న లోతుతో కలిసి
  rationale: లోతు అబ్రాముతో ప్రయాణించాడనే అనుబంధ సూచనను స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: הַנֶּגְבָּה
  choice: నెగెబుకు
  rationale: దిశను సూచించే అంత్యప్రత్యయాన్ని ‘కు’తో వ్యక్తం చేస్తూ, נֶגֶב ను ఇక్కడ భౌగోళిక ప్రాంతనామంగా నిలుపుతుంది; సాధారణ ‘దక్షిణం’ అనే అర్థసాధ్యతను పాదసూచికలో భద్రపరుస్తుంది.
