translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి. మూలంలోని ‘పైకి వెళ్లాడు’ అనే భౌగోళిక ప్రయాణ నుడికారాన్ని సహజత కోసం ‘పైకి బయలుదేరి … వెళ్లాడు’గా వ్యక్తం చేసి, నెగెబు అనే పదంలోని స్థలనామ/దిశా సందిగ్ధతను పాదసూచికలో నిలిపాం.
