    text: హెబ్రీయ మూలంలో ‘కనానీయుడు, పెరిజ్జీయుడు’ అని ఏకవచన జాతిపేర్లు ఉన్నా, అవి ఇక్కడ సమూహార్థంలో వాడబడ్డాయి.
    reason: lexical_alternative
  revision_rationale: The revision makes only idiomatic Telugu improvements. It retains the source’s two-party structure, the conflict sense, the temporal marker, the collective sense of the ethnic terms, and the definite geographic reference. No theological interpretation has been added.
