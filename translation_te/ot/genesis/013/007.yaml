id: GEN.13.7
reference: Genesis 13:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַֽ/יְהִי רִ֗יב בֵּ֚ין רֹעֵ֣י מִקְנֵֽה אַבְרָ֔ם וּ/בֵ֖ין רֹעֵ֣י מִקְנֵה ל֑וֹט וְ/הַֽ/כְּנַעֲנִי֙ וְ/הַ/פְּרִזִּ֔י אָ֖ז יֹשֵׁ֥ב בָּ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/007.yaml
  text: And there was strife between the herdsmen of Abram’s livestock and the herdsmen of Lot’s livestock[b][a]. Now the Canaanite and the Perizzite were dwelling in the land at that time.
translation:
  language: te
  text: అబ్రాము పశువుల కాపరులకు, లోతు పశువుల కాపరులకు మధ్య కలహం జరిగింది. ఆ సమయంలో కనానీయులు, పెరిజ్జీయులు[a] ఆ దేశంలో నివసించేవారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీయ మూలంలో ‘కనానీయుడు, పెరిజ్జీయుడు’ అని ఏకవచన జాతిపేర్లు ఉన్నా, అవి ఇక్కడ సమూహార్థంలో వాడబడ్డాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי רִיב
  choice: కలహం ఏర్పడింది
  rationale: కథనాన్ని ముందుకు నడిపించే וַיְהִיతో పాటు, רִיב సూచించే నిజమైన వివాదాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: רֹעֵי מִקְנֵה
  choice: పశువులను కాచేవారు
  rationale: מִקְנֶה గొర్రెలకే పరిమితం కాకుండా విస్తృతమైన పశుసంపదను సూచిస్తుంది; అందువల్ల ‘గొర్రెల కాపరులు’ కంటే ఈ ప్రయోగం సందర్భానికి విస్తృతంగా సరిపోతుంది.
- source_word: בֵּין ... וּבֵין
  choice: '...కి, ...కి మధ్య'
  rationale: వివాదంలో ఉన్న రెండు వేర్వేరు వర్గాలను హెబ్రీయ మూలంలోని ద్విపాక్షిక నిర్మాణానికి అనుగుణంగా చూపుతుంది.
- source_word: וְהַכְּנַעֲנִי וְהַפְּרִזִּי
  choice: కనానీయులు, పెరిజ్జీయులు
  rationale: హెబ్రీయలో జాతిపేర్లు ఏకవచన రూపంలో సమూహార్థకంగా ఉన్నప్పటికీ, తెలుగులో ప్రజాసమూహాలను సూచించడానికి బహువచనం సహజం.
- source_word: אָז יֹשֵׁב
  choice: ఆ సమయంలో ... నివసిస్తూ ఉన్నారు
  rationale: אָז యొక్క కాలసూచనను స్పష్టంగా ఉంచి, יֹשֵׁב అనే కృదంతం సూచించే కొనసాగుతున్న నివాస స్థితిని నిలుపుతుంది.
- source_word: בָּאָרֶץ
  choice: ఆ దేశంలో
  rationale: నిర్దిష్టమైన ఆ భూభాగాన్ని సూచిస్తూ, ఆదికాండంలోని ‘దేశం’ అనే విస్తృత కథనార్థాన్ని నిలుపుతుంది.
theological_decisions:
- issue: הָאָרֶץ లో ఉండగల దేశ/వాగ్దానభూమి భావసూచన
  choice: ఆ దేశంలో
  alternative: ఆ ప్రాంతంలో
  rationale: ‘దేశం’ మూలపదంలోని భౌగోళిక విస్తృతిని, ఆదికాండ కథనంలో ఉండగల నిబంధనాత్మక ప్రతిధ్వనిని తొలగించదు; అయితే వాక్యంలో అదనపు సిద్ధాంతార్థాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గంభీరంగా రూపొందించబడింది. ‘పశువులను కాచేవారు’ సాధారణ పాఠకులకు స్పష్టంగా ఉండి, గొర్రెలకే పరిమితమైన భావాన్ని నివారిస్తుంది. కాలసూచకమైన ‘ఆ సమయంలో’ రెండవ వాక్య ఆరంభంలో ఉంచబడింది.
