revisions:
- from: అబ్రాము పశువులను కాచేవారికి, లోతు పశువులను కాచేవారికి మధ్య కలహం ఏర్పడింది. ఆ సమయంలో కనానీయులు, పెరిజ్జీయులు[a] ఆ దేశంలో నివసిస్తూ ఉన్నారు.
  to: అబ్రాము పశువుల కాపరులకు, లోతు పశువుల కాపరులకు మధ్య కలహం జరిగింది. ఆ సమయంలో కనానీయులు, పెరిజ్జీయులు[a] ఆ దేశంలో నివసించేవారు.
