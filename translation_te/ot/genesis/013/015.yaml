id: GEN.13.15
reference: Genesis 13:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּ֧י אֶת כָּל הָ/אָ֛רֶץ אֲשֶׁר אַתָּ֥ה רֹאֶ֖ה לְ/ךָ֣ אֶתְּנֶ֑/נָּה וּֽ/לְ/זַרְעֲ/ךָ֖ עַד עוֹלָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/015.yaml
  text: For all the land that you see[a], I will give to you and to your offspring forever.
translation:
  language: te
  text: ఎందుకంటే, నీవు చూస్తున్న భూమి అంతటినీ నీకూ నీ సంతానానికీ శాశ్వతంగా ఇస్తాను.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘నీ విత్తనానికి.’ హీబ్రూ זֶרַע (జెరా) అనేది ‘విత్తనం,’ ‘సంతానం,’ లేదా ‘సంతతివారు’ అనే అర్థాలు ఇవ్వగల సమూహార్థక నామవాచకం.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందున్న ఆజ్ఞకు అనుసంధానంగా దైవ వాగ్దానాన్ని వివరిస్తున్న కారణార్థక/అనుసంధాన భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: כָּל הָאָרֶץ
  choice: ఈ భూమంతటినీ
  rationale: అబ్రాము చూస్తున్న భూభాగమంతటినీ సూచిస్తుంది; తెలుగు సందర్భంలో ‘ఈ’ దృశ్యసంబంధాన్ని సహజంగా స్పష్టం చేస్తుంది.
- source_word: אֲשֶׁר אַתָּה רֹאֶה
  choice: నువ్వు చూస్తున్న
  rationale: హీబ్రూ సంబంధవాక్యాన్ని, వర్తమాన క్రియాభావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: לְךָ אֶתְּנֶנָּה
  choice: నీకు ... ఇస్తాను
  rationale: లబ్ధిదారుని సూచించే לְను, భవిష్యత్ వాగ్దానంగా ఉన్న נתן క్రియను నేరుగా వ్యక్తం చేస్తుంది.
- source_word: וּלְזַרְעֲךָ
  choice: నీ సంతానానికి
  rationale: זֶרַע యొక్క సమూహార్థక స్వభావాన్ని ‘సంతానం’ సహజంగా నిలుపుతుంది; ఏకవచన-సమూహ భావాన్ని అనవసరంగా బహువచనంగా నిర్ధారించదు.
- source_word: עַד עוֹלָם
  choice: శాశ్వతంగా
  rationale: దీర్ఘమైన, నిరవధిక లేదా నిత్య కాలవ్యాప్తిని గంభీరమైన సహజ తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: భూమి వాగ్దాన సందర్భంలో עַד עוֹלָם కాలవ్యాప్తి
  choice: శాశ్వతంగా
  alternative: యుగాంతం వరకు; ఎల్లకాలం
  rationale: వాక్యంలోని బలమైన నిరంతర కాలభావాన్ని నిలుపుతూ, దాని నిబంధనాత్మక లేదా అంత్యకాల సంబంధిత నెరవేర్పును ఏ ప్రత్యేక సిద్ధాంతం ప్రకారం నిర్ణయించదు.
- issue: זֶרַע యొక్క ఏకవచన-సమూహార్థక ఉద్రిక్తత
  choice: సంతానం
  alternative: విత్తనం; సంతతివారు
  rationale: ‘సంతానం’ వ్యక్తిగతమా సమూహమా అనే మూలపదంలోని సాధ్యమైన విస్తృతిని కొంతవరకు నిలుపుతుంది; వ్యాఖ్యానపరంగా ఒకే అర్థాన్ని బలవంతంగా నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలి. దేవుడు అబ్రాముతో నేరుగా మాట్లాడుతున్న సందర్భానికి అనుగుణంగా ఏకవచన సన్నిహిత సంబోధన ‘నువ్వు/నీకు’ వాడబడింది; మూలంలో లేని గౌరవ బహువచనం చేర్చలేదు.
