id: GEN.13.14
reference: Genesis 13:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַֽ/יהוָ֞ה אָמַ֣ר אֶל אַבְרָ֗ם אַחֲרֵי֙ הִפָּֽרֶד ל֣וֹט מֵֽ/עִמּ֔/וֹ שָׂ֣א נָ֤א עֵינֶ֨י/ךָ֙ וּ/רְאֵ֔ה מִן הַ/מָּק֖וֹם אֲשֶׁר אַתָּ֣ה שָׁ֑ם צָפֹ֥נָ/ה וָ/נֶ֖גְבָּ/ה וָ/קֵ֥דְמָ/ה וָ/יָֽמָּ/ה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/014.yaml
  text: 'And Yahweh said to Abram[a], after Lot had separated from him, “Please lift up your eyes and look from the place where you are: northward and southward and eastward and westward.”'
translation:
  language: te
  text: 'లోతు అబ్రాము నుండి విడిపోయిన తరువాత, యహ్వే[a] అబ్రాముతో ఇలా చెప్పాడు: “నీవు ఉన్న చోటు నుండి దయచేసి నీ కళ్లను పైకెత్తి, ఉత్తరం వైపు, దక్షిణం వైపు, తూర్పు వైపు, పడమర వైపు చూడు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో יהוה (YHWH) అనే దైవనామం ఉంది; తెలుగులో దీనికి సంప్రదాయ ప్రత్యామ్నాయ రూపం “యెహోవా” కూడా వాడబడుతుంది.
    reason: దైవనామానికి వాడుకలో ఉన్న ప్రత్యామ్నాయ తెలుగు రూపాన్ని తెలియజేయడం.
lexical_decisions:
- source_word: וַיהוָה
  choice: యహ్వే
  rationale: וַ అనే కథన సంధిని తెలుగులో వాక్య నిర్మాణం సహజంగా తెలియజేస్తుంది; יהוה అనే దైవనామాన్ని దాని సాధారణ శాస్త్రీయ ఉచ్చారణకు దగ్గరగా ‘యహ్వే’గా లిప్యంతరీకరించాం.
- source_word: אָמַר אֶל־אַבְרָם
  choice: అబ్రాముతో ఇలా అన్నాడు
  rationale: తెలుగులో మాటను పరిచయం చేసే సహజ నిర్మాణం; אֶל యొక్క దిశార్థాన్ని ‘తో’ సరిపడా వ్యక్తం చేస్తుంది.
- source_word: אַחֲרֵי הִפָּרֶד לוֹט מֵעִמּוֹ
  choice: లోతు అబ్రాము నుండి విడిపోయిన తరువాత
  rationale: אַחֲרֵי కాలానంతర సంబంధాన్ని సూచిస్తుంది; నిఫాల్ రూపమైన הִפָּרֶד ఇక్కడ అకర్మకంగా ‘విడిపోవడం’ అనే భావాన్నిస్తుంది. సర్వనామ సూచనను తెలుగులో స్పష్టత కోసం ‘అబ్రాము’గా తెలిపాం.
- source_word: שָׂא נָא עֵינֶיךָ
  choice: దయచేసి నీ కళ్లు పైకెత్తి
  rationale: శరీరాంగాన్ని నేరుగా పేర్కొనే హీబ్రూ నుడికారాన్ని నిలిపాం; נָא ఆజ్ఞను మృదువుగా చేసే భావాన్ని ‘దయచేసి’ తెలియజేస్తుంది.
- source_word: וּרְאֵה
  choice: చూడు
  rationale: దృష్టిని చుట్టూ ఉన్న దేశంపై మళ్లించమనే ఏకవచన ఆజ్ఞను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: מִן־הַמָּקוֹם אֲשֶׁר־אַתָּה שָׁם
  choice: నీవు ఉన్న చోటు నుండి
  rationale: שָׁם యొక్క స్థలార్థం తెలుగులో ‘ఉన్న చోటు’ అనే నిర్మాణంలో సహజంగా ఇమిడిపోతుంది; ‘నిలబడి ఉన్న’ అని మూలంలో లేని వివరాన్ని చేర్చలేదు.
- source_word: צָפֹנָה וָנֶגְבָּה וָקֵדְמָה וָיָמָּה
  choice: ఉత్తరం వైపు, దక్షిణం వైపు, తూర్పు వైపు, పడమర వైపు
  rationale: దిశను సూచించే -ה రూపాల బలాన్ని ‘వైపు’తో నిలిపాం; హీబ్రూ క్రమాన్ని యథాతథంగా ఉంచాం.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠంలో సాధారణ బిరుదు కాకుండా నాలుగు అక్షరాల ప్రత్యేక దైవనామం ఉంది. దానిని బిరుదుతో మార్చకుండా, విస్తృతంగా అంగీకరించిన ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించడం మూలంలోని ప్రత్యేకతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలిని వాడాం. హీబ్రూ వాక్యక్రమాన్ని యాంత్రికంగా అనుసరించకుండా, కాలసూచక ఉపవాక్యాన్ని ముందుంచి తెలుగు సహజత్వాన్ని కాపాడాం; నాలుగు దిశల క్రమం మరియు పునరుక్తిని మాత్రం నిలిపాం.
