revisions:
- from: 'లోతు అబ్రాము నుండి విడిపోయిన తరువాత, యహ్వే[a] అబ్రాముతో ఇలా అన్నాడు: “నీవు ఉన్న చోటు నుండి దయచేసి నీ కళ్లు పైకెత్తి ఉత్తరం వైపు, దక్షిణం వైపు, తూర్పు వైపు, పడమర వైపు చూడు.”'
