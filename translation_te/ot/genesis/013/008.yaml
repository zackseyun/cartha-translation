id: GEN.13.8
reference: Genesis 13:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אַבְרָ֜ם אֶל ל֗וֹט אַל נָ֨א תְהִ֤י מְרִיבָה֙ בֵּינִ֣/י וּ/בֵינֶ֔י/ךָ וּ/בֵ֥ין רֹעַ֖/י וּ/בֵ֣ין רֹעֶ֑י/ךָ כִּֽי אֲנָשִׁ֥ים אַחִ֖ים אֲנָֽחְנוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/008.yaml
  text: So Abram said to Lot[a], “Please, let there be no strife between me and you, and between my herdsmen and your herdsmen[b], for we are kinsmen.”
translation:
  language: te
  text: అప్పుడు అబ్రాము లోతుతో, “దయచేసి, నాకూ నీకూ మధ్య, నా పశువుల కాపరులకూ నీ పశువుల కాపరులకూ మధ్య ఎటువంటి గొడవా ఉండకూడదు. ఎందుకంటే మనం బంధువులం[a]” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “మనం సోదరులైన మనుష్యులం.” ఇక్కడ “సోదరులు” అనే హెబ్రీ పదం ఒకే తల్లిదండ్రుల కుమారులను మాత్రమే కాక, విస్తృత కుటుంబ బంధుత్వాన్ని కూడా సూచించగలదు.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు అబ్రాము … అన్నాడు
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది; ఆధునిక తెలుగు కథనశైలిలో “అప్పుడు” సహజంగా ఆ క్రమాన్ని తెలియజేస్తుంది.
- source_word: אַל נָא תְהִי
  choice: దయచేసి … ఉండకూడదు
  rationale: אַל తో కూడిన జస్సివ్ నిషేధాత్మక విజ్ఞప్తిని, נָא దాని మర్యాదపూర్వక స్వరాన్ని సూచిస్తాయి. “దయచేసి” ఆ మృదువైన అభ్యర్థనను నిలుపుతుంది.
- source_word: מְרִיבָה
  choice: గొడవ
  rationale: ఈ సందర్భంలో వ్యక్తుల మధ్య తలెత్తే వివాదం లేదా కలహాన్ని సాధారణ పాఠకులకు సహజంగా అర్థమయ్యే పదంతో వ్యక్తం చేస్తుంది.
- source_word: בֵּינִי וּבֵינֶיךָ … וּבֵין רֹעַי וּבֵין רֹעֶיךָ
  choice: నా మధ్యా నీ మధ్యా, నా పశువుల కాపరుల మధ్యా నీ పశువుల కాపరుల మధ్యా
  rationale: హెబ్రీలోని జతజతగా పునరావృతమయ్యే “మధ్య” నిర్మాణాన్ని తెలుగులోనూ స్పష్టంగా నిలుపుతుంది.
- source_word: רֹעַי … רֹעֶיךָ
  choice: నా పశువుల కాపరులు … నీ పశువుల కాపరులు
  rationale: רעה అనే మూలం ఇక్కడ పశుసంపదను మేపి సంరక్షించేవారిని సూచిస్తుంది; సందర్భంలో వివిధ రకాల పశువులు ఉన్నందున “పశువుల కాపరులు” సముచితం.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: అబ్రాము చేసిన విజ్ఞప్తికి కారణాన్ని స్పష్టంగా పరిచయం చేస్తుంది.
- source_word: אֲנָשִׁים אַחִים אֲנָחְנוּ
  choice: మనం బంధువులం
  rationale: אַבְרָם లోతుకు మేనమామ అయినప్పటికీ, אַחִים విస్తృత కుటుంబ బంధుత్వాన్ని సూచించగలదు. “బంధువులం” సందర్భానుసారంగా సహజమైన తెలుగు; మూలంలోని అక్షరార్థ రూపం పాదసూచికలో ఇవ్వబడింది.
theological_decisions:
- issue: అబ్రాము, లోతు సంబంధంలో אַחִים అర్థం
  choice: ప్రధాన పాఠ్యంలో “బంధువులం”
  alternative: “సహోదరులం” లేదా అక్షరార్థంగా “మనం సహోదరులైన మనుష్యులం”
  rationale: లోతు అబ్రాముకు సొంత సహోదరుడు కాదు; హెబ్రీలో “సహోదరులు” అనే పదం విస్తృత బంధుత్వాన్నీ సూచిస్తుంది. అందువల్ల ప్రధాన పాఠ్యం సంబంధాన్ని తప్పుగా సంకుచితం చేయకుండా భావాన్ని అందిస్తుంది; మూలపదాల రూపం పాదసూచికలో సంరక్షించబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి ఉపయోగించబడింది. అబ్రాము విజ్ఞప్తిలోని మర్యాదను “దయచేసి” నిలుపుతుంది; హెబ్రీ పునరుక్తిని సాధ్యమైనంతవరకు కాపాడుతూ అతిగా కృత్రిమమైన పదక్రమాన్ని నివారించబడింది.
