source:
  edition: WLC
  text: וְ/שַׂמְתִּ֥י אֶֽת זַרְעֲ/ךָ֖ כַּ/עֲפַ֣ר הָ/אָ֑רֶץ אֲשֶׁ֣ר אִם יוּכַ֣ל אִ֗ישׁ לִ/מְנוֹת֙ אֶת עֲפַ֣ר הָ/אָ֔רֶץ גַּֽם זַרְעֲ/ךָ֖ יִמָּנֶֽה־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/016.yaml
  text: And I will make your offspring like the dust of the earth[a], so that if a man can count the dust of the earth[b], then your offspring also can be counted.
translation:
  language: te
  text: నేను నీ సంతానాన్ని[a] భూమి ధూళివలె లెక్కలేనంతగా చేస్తాను. ఒక మనిషి[b] భూమి ధూళిని లెక్కించగలిగితే, నీ సంతానాన్ని కూడా లెక్కించవచ్చు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘నీ వంశస్థులను’ లేదా ‘నీ విత్తనాన్ని’; హీబ్రూ זֶרַע ఇక్కడ సమష్టిగా సంతానాన్ని లేదా వంశాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అంటే ‘ఎవరైనా’; హీబ్రూలో ‘మనిషి’ అనే పురుష ఏకవచన రూపం ఇక్కడ సాధారణార్థంలో వాడబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתִּי
  choice: నేను ... చేస్తాను
  rationale: שׂוּם యొక్క ప్రాథమిక అర్థం ‘ఉంచు’; అయితే సంతానం అనే కర్మతో, ‘భూమి ధూళివలె’ అనే ఉపమానంతో వచ్చినప్పుడు ‘చేస్తాను’ అనేది సందర్భానుగుణమైన సహజ తెలుగు.
- source_word: זַרְעֲךָ
  choice: నీ సంతానం
  rationale: זֶרַע ఇక్కడ అబ్రాము వంశాన్ని సమష్టిగా సూచిస్తుంది. ‘సంతానం’ ఏకవచన సమష్టి భావాన్ని నిలుపుతుంది; ‘విత్తనం’ అనే అక్షరార్థం ఈ సందర్భంలో సహజంగా ఉండదు.
- source_word: כַּעֲפַר הָאָרֶץ
  choice: భూమి ధూళివలె
  rationale: హీబ్రూ ఉపమానాన్ని, సంతానం లెక్కకు అందనంత విస్తరించబోతుందనే దృశ్యాన్ని నేరుగా నిలుపుతుంది.
- source_word: אֲשֶׁר אִם
  choice: '...లెక్కించగలిగితే, అప్పుడు'
  rationale: ఇది షరతుతో కూడిన పోలికను పరిచయం చేస్తుంది. తెలుగు ‘అయితే—అప్పుడు’ నిర్మాణం ఆ ఊహాత్మక సంబంధాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: אִישׁ
  choice: ఒక మనిషి
  rationale: మూలంలో పురుష ఏకవచన రూపం ఉన్నప్పటికీ ఇక్కడ అది సాధారణ మానవుని సూచిస్తుంది. ‘ఒక మనిషి’ రూపాన్ని నిలుపుతూ సాధారణార్థాన్ని పాదసూచికలో వెల్లడించాం.
- source_word: לִמְנוֹת
  choice: లెక్కించు
  rationale: מנה ఇక్కడ ఒక్కొక్కటిగా లెక్కించడం లేదా సంఖ్య నిర్ధారించడం అనే సాధారణ అర్థంలో ఉంది; ‘లెక్కించు’ ఆధునిక తెలుగులో సహజమైన పదం.
- source_word: גַּם
  choice: కూడా
  rationale: భూమి ధూళిని లెక్కించగలగడం, అబ్రాము సంతానాన్ని లెక్కించగలగడం మధ్య సమాంతర సంబంధాన్ని తెలియజేస్తుంది.
- source_word: יִמָּנֶה
  choice: లెక్కించబడగలదు
  rationale: నిఫాల్ రూపంలోని కర్మణి భావాన్నీ, షరతు వాక్యంలో ఉన్న సాధ్యతనూ ఈ రూపం నిలుపుతుంది; కేవలం భవిష్యత్ ప్రవచనంగా మార్చదు.
theological_decisions:
- issue: అబ్రాహాము వాగ్దానంలో זֶרַע అనే సమష్టి నామవాచకం
  choice: నీ సంతానం
  alternative: నీ వంశస్థులు; నీ విత్తనం
  rationale: ఈ వచనంలో అబ్రాము నుంచి ఉద్భవించే లెక్కలేనంత సమష్టి సంతతి ఉద్దేశించబడింది. ‘సంతానం’ సమష్టి ఏకవచన స్వభావాన్ని నిలుపుతుంది; ఈ వచనంలోనే ప్రత్యేకంగా ఒకే వ్యక్తిని సూచించే మెస్సీయ సంబంధ వ్యాఖ్యానాన్ని చేర్చదు.
- issue: אִישׁ లోని పురుష ఏకవచన సాధారణ ప్రయోగం
  choice: ఒక మనిషి
  alternative: ఎవరైనా; ఒకరు
  rationale: మూలంలోని వ్యాకరణ రూపాన్ని ప్రధాన పాఠ్యంలో ప్రతిబింబిస్తూ, అది కేవలం ఒక నిర్దిష్ట పురుషునికే పరిమితం కాదని పాదసూచికలో స్పష్టం చేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన శైలి. ‘భూమి ధూళివలె’ అనే మూల దృశ్యాన్ని అలాగే ఉంచాం. చివరి కర్మణి రూపం కొద్దిగా గంభీరమైనదైనా, హీబ్రూ నిఫాల్ రూపాన్నీ ఊహాత్మక సాధ్యతనూ ఖచ్చితంగా ప్రతిబింబిస్తుంది.
