id: GEN.13.4
reference: Genesis 13:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אֶל מְקוֹם֙ הַ/מִּזְבֵּ֔חַ אֲשֶׁר עָ֥שָׂה שָׁ֖ם בָּ/רִאשֹׁנָ֑ה וַ/יִּקְרָ֥א שָׁ֛ם אַבְרָ֖ם בְּ/שֵׁ֥ם יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/004.yaml
  text: to the place of the altar that he had made there at first[b][a]. And there Abram called on the name of Yahweh.
translation:
  language: te
  text: అక్కడ మునుపు తాను కట్టిన బలిపీఠం ఉన్న స్థలానికి వచ్చాడు. అక్కడ అబ్రాము యాహ్వే[a] నామాన్ని పిలిచాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ: ‘YHWH’. దీనిని సంప్రదాయంగా ‘ప్రభువు’ అని అనువదిస్తారు; ‘యెహోవా’ అనేది మరో ప్రాచుర్యమైన రూపం.'
    reason: alternative_reading
  - marker: b
    text: 'ఇలా కూడా అనువదించవచ్చు: ‘యాహ్వే నామాన్ని ప్రకటించాడు’ లేదా ‘యాహ్వేను పేరుపెట్టి వేడుకున్నాడు.’ హీబ్రూ నుడికారం ప్రార్థనాపూర్వక ఆహ్వానం, ప్రకటన—రెండు భావాలనూ మోయగలదు.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶל מְקוֹם הַמִּזְבֵּחַ
  choice: బలిపీఠం ఉన్న చోటికి
  rationale: మునుపు కట్టిన నిర్దిష్ట బలిపీఠాన్ని సూచించే సహజమైన ఆధునిక తెలుగు వ్యక్తీకరణ.
- source_word: אֲשֶׁר עָשָׂה שָׁם
  choice: తాను అక్కడ కట్టిన
  rationale: עָשָׂה అక్షరార్థంగా ‘చేసిన’ అయినా, బలిపీఠం సందర్భంలో ‘కట్టిన’ అనడం తెలుగులో సహజంగా, సందర్భానికి కచ్చితంగా ఉంటుంది.
- source_word: בָּרִאשֹׁנָה
  choice: మొదట
  rationale: అబ్రాము అంతకుముందు ఈ ప్రదేశానికి వచ్చి బలిపీఠం కట్టిన సందర్భాన్ని సంక్షిప్తంగా సూచిస్తుంది.
- source_word: שָׁם
  choice: అక్కడ
  rationale: మూలంలోని స్థల సూచనను నిలుపుతూ, రెండో ప్రయోగాన్ని కూడా వాక్యంలో స్పష్టంగా ఉంచింది.
- source_word: וַיִּקְרָא ... בְּשֵׁם
  choice: నామాన్ని పిలిచి ప్రార్థించాడు
  rationale: ఈ హీబ్రూ నుడికారం ప్రార్థనాపూర్వకంగా మొరపెట్టుకోవడం, నామాన్ని ప్రకటించడం అనే భావాలను మోయగలదు. ప్రధాన పాఠంలో ఆరాధనాపూర్వక ఆహ్వాన భావాన్ని సహజ తెలుగులో తెలిపి, విస్తృతార్థాన్ని పాదసూచికలో నిలిపింది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హీబ్రూ దైవనామం YHWHను బిరుదుతో మార్చకుండా, సాధారణంగా పునర్నిర్మించబడిన ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించింది.
- source_word: אַבְרָם
  choice: అబ్రాము
  rationale: తెలుగులో స్థిరపడిన బైబిలు వ్యక్తినామ రూపాన్ని ఉపయోగించింది.
theological_decisions:
- issue: יְהוָה దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలంలో ఉన్న వ్యక్తిగత దైవనామాన్ని ప్రధాన పాఠంలో ప్రత్యక్షంగా నిలుపుతుంది; సంప్రదాయ బిరుదు మరియు మరో లిప్యంతరీకరణను పాదసూచికలో తెలియజేస్తుంది.
- issue: קרא בשם יהוה నుడికారం యొక్క భావం
  choice: యాహ్వే నామాన్ని పిలిచి ప్రార్థించాడు
  alternative: యాహ్వే నామాన్ని ప్రకటించాడు; యాహ్వేను పేరుపెట్టి వేడుకున్నాడు
  rationale: ఈ నుడికారం ఆహ్వానం, ప్రార్థన, బహిరంగ ప్రకటన అనే భావాలకు వీలు ఇస్తుంది. ప్రధాన పాఠం సందర్భంలోని ఆరాధనాపూర్వక ఆహ్వానాన్ని సహజంగా ఇస్తూ, ఇతర సాధ్యార్థాలను పాదసూచికలో సంరక్షిస్తుంది.
- issue: వచనారంభంలోని אֶל పదబంధానికి క్రియ
  choice: వచ్చాడు అని సందర్భం నుంచి పూరించడం
  alternative: ‘...చోటికి’ అని మునుపటి వచనంతో కలిసే అసంపూర్ణ పదబంధంగా ఉంచడం
  rationale: హీబ్రూలో ఈ వచనం 13:3లోని ప్రయాణ క్రియకు కొనసాగింపు. విడిగా చదివే తెలుగు వచనం సహజంగా ఉండేందుకు సందర్భంలో స్పష్టంగా ఉన్న ‘వచ్చాడు’ను పూరించింది; కొత్త భావాన్ని చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన వాక్యనిర్మాణం. ‘బలిపీఠం,’ ‘నామం’ వంటి స్థిరమైన బైబిలు పదజాలాన్ని నిలిపి, పాతకాలపు క్రియారూపాలను నివారించింది. విడిగా చదివినప్పుడు వాక్యం సంపూర్ణంగా ఉండేందుకు సందర్భసిద్ధమైన ‘వచ్చాడు’ను పూరించింది.
