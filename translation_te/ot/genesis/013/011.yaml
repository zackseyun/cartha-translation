id: GEN.13.11
reference: Genesis 13:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּבְחַר ל֣/וֹ ל֗וֹט אֵ֚ת כָּל כִּכַּ֣ר הַ/יַּרְדֵּ֔ן וַ/יִּסַּ֥ע ל֖וֹט מִ/קֶּ֑דֶם וַ/יִּפָּ֣רְד֔וּ אִ֖ישׁ מֵ/עַ֥ל אָחִֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/011.yaml
  text: So Lot chose for himself all the plain of the Jordan[a], and Lot journeyed eastward; and they separated from each other.
translation:
  language: te
  text: అప్పుడు లోతు యొర్దాను మైదాన ప్రాంతమంతటినీ తనకోసం ఎంచుకొని, తూర్పువైపుగా[a] బయలుదేరాడు. అలా వారిద్దరూ ఒకరి నుండి ఒకరు విడిపోయారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తూర్పు నుండి.” హీబ్రూ పదబంధం ప్రయాణించిన దిశను గానీ, బయలుదేరిన ప్రాంతాన్ని గానీ సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּבְחַר לוֹ
  choice: తనకోసం ఎంచుకొని
  rationale: בחר అంటే ‘ఎంచుకొను’; לוֹ అనే దత్తివాచక సర్వనామం లోతు తన ప్రయోజనం కోసం ఎంపిక చేసుకున్నాడనే భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: כָּל כִּכַּר הַיַּרְדֵּן
  choice: యొర్దాను మైదాన ప్రాంతమంతటినీ
  rationale: כִּכָּר అక్షరార్థంగా వృత్తాకార ప్రాంతాన్ని సూచించగలిగినా, ఇక్కడ యొర్దాను చుట్టుపక్కల ఉన్న సమతల భౌగోళిక ప్రాంతాన్ని సూచిస్తుంది. ‘మైదాన ప్రాంతం’ ఆధునిక తెలుగులో సహజంగా ఉండి భౌగోళిక భావాన్ని నిలుపుతుంది.
- source_word: וַיִּסַּע
  choice: బయలుదేరాడు
  rationale: נסע సాధారణంగా శిబిరాన్ని ఎత్తి ప్రయాణం ప్రారంభించడాన్ని సూచిస్తుంది. ‘బయలుదేరాడు’ కథన గమనాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: מִקֶּדֶם
  choice: తూర్పువైపుగా
  rationale: ఈ పదబంధం ప్రయాణ దిశగా ‘తూర్పువైపుగా’ లేదా బయలుదేరిన స్థానంగా ‘తూర్పు నుండి’ అని అర్థం కావచ్చు. సందర్భానికి తూర్పువైపు ప్రయాణం సరిపోతుంది; ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: וַיִּפָּרְדוּ
  choice: విడిపోయారు
  rationale: פרד యొక్క నిఫాల్ రూపం పరస్పర విభజనను సూచిస్తుంది; ‘విడిపోయారు’ తెలుగులో స్పష్టంగా, సహజంగా ఉంది.
- source_word: אִישׁ מֵעַל אָחִיו
  choice: ఒకరి నుండి ఒకరు
  rationale: హీబ్రూలో అక్షరార్థంగా ‘ఒక మనిషి తన సహోదరుని నుండి’ అనే పంపిణీ ఏకవచన నిర్మాణం ఉంది. ఇక్కడ అబ్రాము, లోతు పరస్పరం విడిపోవడమే ఉద్దేశం; ‘ఒకరి నుండి ఒకరు’ ఆ పరస్పర భావాన్ని సహజమైన తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: బంధుత్వాన్ని సూచించే లింగవాచక భాష
  choice: ఒకరి నుండి ఒకరు
  alternative: ఒకడు తన సహోదరుని నుండి
  rationale: אָחִיו అనే పదం అక్షరార్థంగా ‘అతని సహోదరుడు’ అయినా, ఈ సందర్భంలో బంధువులైన ఇద్దరు పురుషులు పరస్పరం విడిపోవడాన్ని సూచించే హీబ్రూ ప్రయోగం. సహజమైన తెలుగు కోసం పరస్పరార్థాన్ని ప్రధాన పాఠ్యంలో ఇచ్చాం; ఎలాంటి సిద్ధాంతపరమైన ప్రత్యేక అర్థాన్నీ జోడించలేదు.
- issue: מִקֶּדֶם యొక్క దిశాసంబంధ అనిశ్చితి
  choice: తూర్పువైపుగా
  alternative: తూర్పు నుండి
  rationale: హీబ్రూ రూపం ప్రయాణ దిశను గానీ, బయలుదేరిన ప్రాంతాన్ని గానీ సూచించవచ్చు. సందర్భానికి అనుగుణంగా ‘తూర్పువైపుగా’ ప్రధాన పాఠ్యంలో ఉంచి, నిజమైన భాషాపరమైన అనిశ్చితిని పాదసూచికలో సంరక్షించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనప్పటికీ గౌరవప్రదమైన కథన శైలి. మూలంలోని దిశాసంబంధ అనిశ్చితి పాదసూచికలో నిలుపబడింది.
