  source_fidelity: 'హీబ్రూ వాక్యంలోని ప్రధాన అంశాలు నమ్మకంగా ప్రతిఫలించాయి: లోతు తనకోసం యొర్దాను యొక్క సమతల ప్రాంతమంతటినీ ఎంచుకున్నాడు; అతడు తూర్పువైపుగా ప్రయాణించాడు; తరువాత వారు పరస్పరం విడిపోయారు. מִקֶּדֶם లోని దిశ/మూలస్థాన అనిశ్చితిని ప్రధాన పాఠ్యం మరియు పాదసూచిక సరిగా కాపాడుతున్నాయి.'
