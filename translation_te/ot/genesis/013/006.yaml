source:
  edition: WLC
  text: וְ/לֹא נָשָׂ֥א אֹתָ֛/ם הָ/אָ֖רֶץ לָ/שֶׁ֣בֶת יַחְדָּ֑ו כִּֽי הָיָ֤ה רְכוּשָׁ/ם֙ רָ֔ב וְ/לֹ֥א יָֽכְל֖וּ לָ/שֶׁ֥בֶת יַחְדָּֽו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/006.yaml
  text: And the land could not support them living together, because their possessions were too great for them to live together.
translation:
  language: te
  text: వారు కలిసి నివసించడానికి ఆ దేశం వారిని భరించలేకపోయింది; ఎందుకంటే వారి సంపద చాలా ఎక్కువగా ఉండడం వల్ల వారు కలిసి నివసించలేకపోయారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נָשָׂא
  choice: భరించలేకపోయింది
  rationale: ఈ సందర్భంలో భూమి/దేశం వారి పశుసంపదతో కూడిన జీవనాన్ని పోషించగల లేదా మోయగల సామర్థ్యాన్ని సూచిస్తుంది; ‘భరించు’ మూలపాఠంలోని రూపకాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: הָאָרֶץ
  choice: ఆ దేశం
  rationale: ఇక్కడ కనాను ప్రాంతంలోని వారు నివసిస్తున్న భూభాగం ఉద్దేశం; సందర్భానుగుణంగా ‘దేశం’ సహజంగా ఉంది.
- source_word: לָשֶׁבֶת יַחְדָּו
  choice: కలిసి నివసించడానికి
  rationale: ישב అనే క్రియ ఇక్కడ స్థిరంగా నివసించడాన్ని సూచిస్తుంది; ‘కలిసి నివసించు’ ఆధునిక తెలుగులో స్పష్టంగా ఉంటుంది.
- source_word: רְכוּשָׁם רָב
  choice: వారి ఆస్తి ఎంతో విస్తారంగా
  rationale: רְכוּשׁ అనేది సందర్భంలో పశువులతో సహా సమకూర్చుకున్న ఆస్తిని సూచిస్తుంది; ‘ఆస్తి’ విస్తృత అర్థాన్ని కాపాడుతుంది, רָב పరిమాణాధిక్యాన్ని తెలియజేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. మూలంలోని ‘కలిసి నివసించు’ అనే పునరుక్తిని ఉద్దేశపూర్వకంగా నిలుపుకున్నాం; అది భూమి సామర్థ్యలేమి మరియు వారి వాస్తవ సహనివాస అసాధ్యత అనే రెండు అనుసంధానిత అంశాలను బలపరుస్తుంది.
