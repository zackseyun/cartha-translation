  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలి. ‘బరువైనవాడు’ అనే అక్షరార్థాన్ని కాక, సందర్భానుసారమైన ఆర్థిక సమృద్ధి భావాన్ని వ్యక్తపరచడానికి ‘సంపన్నుడు’ వాడబడింది.
