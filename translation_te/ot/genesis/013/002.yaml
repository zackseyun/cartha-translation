source:
  edition: WLC
  text: וְ/אַבְרָ֖ם כָּבֵ֣ד מְאֹ֑ד בַּ/מִּקְנֶ֕ה בַּ/כֶּ֖סֶף וּ/בַ/זָּהָֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/002.yaml
  text: Abram was very wealthy in livestock[a], silver, and gold.
translation:
  language: te
  text: అబ్రాము[a] పశుసంపదలో, వెండిలో, బంగారంలో ఎంతో సంపన్నుడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ వాక్యం ‘మరియు’ అనే అనుసంధాన పదంతో మొదలవుతుంది.
    reason: మూలంలోని కథన అనుసంధానాన్ని తెలుగులో ప్రత్యక్షంగా ఉంచితే అసహజంగా ఉండవచ్చు; ఈ పాదటిప్పణి ఆ రూపాన్ని తెలియజేస్తుంది.
lexical_decisions:
- source_word: וְ/אַבְרָם
  choice: అబ్రాము
  rationale: వְ కథనాన్ని ముందున్న వాక్యంతో అనుసంధానిస్తుంది. ఆధునిక తెలుగులో వాక్యారంభంలో ‘మరియు’ను తప్పించడం సహజంగా ఉంటుంది; పేరును సంప్రదాయ తెలుగు రూపమైన ‘అబ్రాము’గా ఇచ్చాం.
- source_word: כָּבֵד
  choice: సంపన్నుడు
  rationale: మూల అర్థం ‘బరువైనవాడు’; అయితే పశుసంపద, వెండి, బంగారం అనే సందర్భంలో ఇది అత్యధిక ఆస్తి కలిగి ఉండడాన్ని సూచించే హీబ్రూ నుడికారం. ‘సంపన్నుడు’ ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: מְאֹד
  choice: ఎంతో
  rationale: సంపద పరిమాణాన్ని బలంగా సూచించే తీవ్రతార్థక క్రియావిశేషణం; ‘ఎంతో’ ఆధునిక, సహజ తెలుగు.
- source_word: בַּ/מִּקְנֶה
  choice: పశుసంపదలో
  rationale: מִקְנֶה సంపాదించిన ఆస్తిని, ముఖ్యంగా మందలు మరియు పెంపుడు జంతువులను సూచిస్తుంది. ఈ పితృకథల సందర్భంలో ‘పశుసంపద’ ఖచ్చితమైనది.
- source_word: בַּ/כֶּסֶף
  choice: వెండిలో
  rationale: בְּ ఇక్కడ సంపద ఉన్న విభాగాన్ని సూచిస్తుంది. సమాంతర హీబ్రూ నిర్మాణాన్ని తెలుగులో స్పష్టంగా నిలుపుతుంది.
- source_word: וּ/בַ/זָּהָב
  choice: బంగారంలో
  rationale: ఇది సంపదకు చెందిన చివరి విభాగం. తెలుగు జాబితా నిర్మాణంలో అంతర్లీనమైన ‘మరియు’ భావం ఉండటం వల్ల ప్రత్యేక సంధాన పదం లేకుండానే సహజంగా ఉంటుంది.
