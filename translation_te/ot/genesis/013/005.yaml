  text: And Lot[a], who went with Abram, also had flocks and herds and tents.
translation:
  language: te
  text: అబ్రాముతో కలిసి వెళ్తున్న లోతుకు కూడా గొర్రెలు, మేకలు వంటి చిన్న పశువుల మందలు[a], పశువుల మందలు, గుడారాలు ఉండేవి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పదం సాధారణంగా గొర్రెలు, మేకలు వంటి చిన్న పశువులను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: కూడా
  rationale: సందర్భాన్ని ముందటి వచనంతో కలుపుతూ, అబ్రాముతో పాటు లోతుకూ ఆస్తి ఉందనే సంకలన భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: לְלוֹט ... הָיָה
  choice: లోతుకు ... ఉండేవి
  rationale: హీబ్రూలోని అస్తిత్వ-స్వామ్య నిర్మాణాన్ని తెలుగులో సహజంగా ‘లోతుకు ... ఉండేవి’ అని వ్యక్తం చేస్తుంది.
- source_word: הַהֹלֵךְ אֶת אַבְרָם
  choice: అబ్రాముతో కలిసి వెళ్తున్న
  rationale: వర్తమాన కృదంతం సూచించే కొనసాగుతున్న సహప్రయాణ భావాన్ని నిలుపుతుంది.
- source_word: צֹאן
  choice: గొర్రెలు, మేకల మందలు
  rationale: ఈ హీబ్రూ సామూహిక పదం ప్రధానంగా గొర్రెలు, మేకలు వంటి చిన్న పశువులను సూచిస్తుంది; తెలుగులో స్పష్టత కోసం రెండింటినీ పేర్కొనడం సహజం.
- source_word: וּבָקָר
  choice: పశువుల మందలు
  rationale: ఈ పదం గోవుల వంటి పెద్ద పశుసంపదను సూచిస్తుంది; ‘పశువుల మందలు’ సాధారణ ఆధునిక తెలుగులో సహజమైన సామూహిక పదబంధం.
- source_word: וְאֹהָלִים
  choice: గుడారాలు
  rationale: హీబ్రూ బహువచన నామవాచకానికి నేరమైన, సహజమైన తెలుగు సమానం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. స్వామ్యాన్ని ‘లోతుకు ... ఉండేవి’ అనే తెలుగు నిర్మాణంతో వ్యక్తం చేసి, మూలంలోని సహప్రయాణ భావాన్ని ‘కలిసి వెళ్తున్న’ ద్వారా నిలిపింది.
