translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనప్పటికీ గౌరవప్రదమైన శైలి. రెండు సమాంతర నివాస వాక్యాలను నిలుపుతూ, చివరి క్రియలోని స్థల విస్తృతి సంబంధమైన అస్పష్టతను పాదసూచికలో సంరక్షించింది.
