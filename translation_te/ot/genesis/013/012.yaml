  variant: modern standard Telugu
source:
  edition: WLC
  text: אַבְרָ֖ם יָשַׁ֣ב בְּ/אֶֽרֶץ כְּנָ֑עַן וְ/ל֗וֹט יָשַׁב֙ בְּ/עָרֵ֣י הַ/כִּכָּ֔ר וַ/יֶּאֱהַ֖ל עַד סְדֹֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/012.yaml
  text: Abram lived in the land of Canaan[a], and Lot lived in the cities of the plain and pitched his tents as far as Sodom.
translation:
  language: te
  text: అబ్రాము కనాను దేశంలో నివసించాడు; లోతు మైదానంలోని పట్టణాల్లో నివసించాడు, సొదొము వరకు తన గుడారాలు వేసుకున్నాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘సొదొము వరకు తన గుడారాన్ని వేశాడు.’ హీబ్రూ క్రియ గుడారం వేయడం లేదా గుడారాల్లో మకాం చేయడం అనే అర్థాన్ని ఇవ్వగలదు. ఇక్కడ లోతు తన మకాంను సొదొము దిశగా అంతవరకు విస్తరించాడనే భావం ఉంది; ఈ దశలోనే అతడు ఆ పట్టణంలోకి వెళ్లి నివసించాడని తప్పనిసరిగా చెప్పడం లేదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשַׁב
  choice: నివసించాడు / నివసిస్తూ
  rationale: ఈ క్రియ ఇక్కడ ఒక చోట ఉండడం లేదా నివాసం ఏర్పరచుకోవడం అనే స్థితిని సూచిస్తుంది. ఆధునిక ప్రామాణిక తెలుగులో ‘నివసించాడు’ సహజంగా, గౌరవప్రదంగా ఉంది.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: కనాను దేశంలో
  rationale: హీబ్రూలోని אֶרֶץ (‘దేశం/భూమి’) అనే నామవాచకాన్ని స్పష్టంగా నిలుపుతూ తెలుగులో సహజమైన పదక్రమాన్ని వాడింది.
- source_word: בְּעָרֵי הַכִּכָּר
  choice: మైదానంలోని పట్టణాల్లో
  rationale: כִּכָּר ఈ సందర్భంలో యొర్దాను పరిసర సమతల ప్రాంతాన్ని సూచిస్తుంది. ‘మైదానం’ సాధారణ పాఠకులకు స్పష్టంగా ఉండి, బహువచన నిర్మాణాన్ని కూడా నిలుపుతుంది.
- source_word: וַיֶּאֱהַל
  choice: తన గుడారాలు వేసుకున్నాడు
  rationale: אהל క్రియ గుడారం వేయడం లేదా గుడారాల్లో మకాం చేయడం అనే భావాన్ని ఇస్తుంది. పశుపోషక కుటుంబ సమూహపు మకాంను సహజ తెలుగులో తెలిపేందుకు ‘గుడారాలు’ అనే బహువచనం వాడింది.
- source_word: עַד סְדֹם
  choice: సొదొము వరకు
  rationale: עַד విస్తృతి లేదా హద్దును సూచిస్తుంది. ఈ పదబంధం లోతు మకాం సొదొము దిశగా అంతవరకు విస్తరించిందని తెలుపుతుంది; అతడు అప్పుడే పట్టణంలో నివసించాడని తప్పనిసరిగా చెప్పదు.
- source_word: אַבְרָם
  choice: అబ్రాము
  rationale: తెలుగు బైబిలు వాడుకలో సుపరిచితమైన పేరురూపం.
- source_word: לוֹט
  choice: లోతు
  rationale: తెలుగు బైబిలు వాడుకలో సుపరిచితమైన పేరురూపం.
- source_word: סְדֹם
  choice: సొదొము
  rationale: తెలుగు బైబిలు వాడుకలో సుపరిచితమైన స్థలనామ రూపం.
