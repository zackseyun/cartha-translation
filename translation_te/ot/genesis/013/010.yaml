- from: లోతు తన కళ్లు పైకెత్తి చూసినప్పుడు, యొర్దాను మైదానమంతా[a] నీటి సమృద్ధితో ఉండడం అతనికి కనిపించింది. యాహ్వే సొదొమను, గొమొర్రాను నాశనం చేయకముందు, సోయరు దిశగా[c] ఉన్న ఆ ప్రాంతం యాహ్వే తోటలా[b], ఐగుప్తు దేశంలా ఉండేది.
  to: లోతు తన కళ్లను పైకెత్తి, యొర్దాను మైదానమంతా[a] చూశాడు. అది అంతా సమృద్ధిగా నీరున్నది. యాహ్వే సొదొమను, గొమొర్రాను నాశనం చేయకముందు, అది యాహ్వే తోటలా[b], ఐగుప్తు దేశంలా ఉండేది—సోయరు వైపు వెళ్లేటప్పుడు[c].
  rationale: The revision restores the Hebrew sequence of Lot’s actions, uses a natural Telugu predication for the well-watered plain, and renders the final Hebrew directional/approach idiom without converting it into a more specific geographic claim. The footnotes retain the lexical alternatives and clarify the final phrase’s range without imposing a single disputed syntactic attachment.
