id: GEN.13.10
reference: Genesis 13:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּשָּׂא ל֣וֹט אֶת עֵינָ֗י/ו וַ/יַּרְא֙ אֶת כָּל כִּכַּ֣ר הַ/יַּרְדֵּ֔ן כִּ֥י כֻלָּ֖/הּ מַשְׁקֶ֑ה לִ/פְנֵ֣י שַׁחֵ֣ת יְהוָ֗ה אֶת סְדֹם֙ וְ/אֶת עֲמֹרָ֔ה כְּ/גַן יְהוָה֙ כְּ/אֶ֣רֶץ מִצְרַ֔יִם בֹּאֲ/כָ֖ה צֹֽעַר־־־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/010.yaml
  text: Lot lifted up his eyes and saw all the plain of the Jordan[a], that all of it was well watered before Yahweh destroyed Sodom and Gomorrah, like the garden of Yahweh, like the land of Egypt[d][c][b], as you go toward Zoar.
translation:
  language: te
  text: లోతు తన కళ్లను పైకెత్తి, యొర్దాను మైదానమంతా[a] చూశాడు. అది అంతా సమృద్ధిగా నీరున్నది. యాహ్వే సొదొమను, గొమొర్రాను నాశనం చేయకముందు, అది యాహ్వే తోటలా[b], ఐగుప్తు దేశంలా ఉండేది—సోయరు వైపు వెళ్లేటప్పుడు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యొర్దాను లోయ అంతా”; అక్షరార్థంగా, “యొర్దాను వలయ ప్రాంతమంతా.”
    reason: lexical_alternative
  - marker: b
    text: “యాహ్వే తోట” అనే మాట సస్యసమృద్ధిగా ఉన్న ఏదేను తోటను జ్ఞాపకం చేస్తుండవచ్చు.
    reason: cross_reference
  - marker: c
    text: లేదా, “సోయరు వైపునకు వచ్చేటప్పుడు.” ఈ హీబ్రూ నుడికారం సోయరు వైపు దిశను లేదా అక్కడికి చేరువను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא ... עֵינָיו
  choice: తన కళ్లు పైకెత్తి చూసినప్పుడు
  rationale: కళ్లను పైకెత్తడం అనే హీబ్రూ కథన నుడికారాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: כָּל כִּכַּר הַיַּרְדֵּן
  choice: యొర్దాను మైదానమంతా
  rationale: כִּכָּר ఇక్కడ యొర్దాను పరిసరాల్లోని విశాలమైన మైదాన ప్రాంతాన్ని సూచిస్తుంది; ‘వృత్తం’ అనే అక్షరార్థం తెలుగులో భౌగోళిక భావాన్ని అస్పష్టం చేస్తుంది.
- source_word: כִּי כֻלָּהּ מַשְׁקֶה
  choice: నీటి సమృద్ధితో ఉండడం
  rationale: మొత్తం ప్రాంతం బాగా నీరున్నదనే భావాన్ని సహజంగా వ్యక్తం చేస్తుంది; నీరు సహజంగా లభించిందా లేక సాగునీరు అందించబడిందా అన్నది నిర్దిష్టంగా తేల్చదు.
- source_word: לִפְנֵי שַׁחֵת יְהוָה
  choice: యాహ్వే ... నాశనం చేయకముందు
  rationale: לִפְנֵי యొక్క కాలార్థాన్ని, שׁחת యొక్క విధ్వంస భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హీబ్రూ దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా తెలుగులో లిప్యంతరీకరిస్తుంది.
- source_word: כְּגַן יְהוָה
  choice: యాహ్వే తోటలా
  rationale: హీబ్రూ ఉపమానాన్ని సంక్షిప్తంగా నిలిపి, ఏదేను తోటను జ్ఞాపకం చేసే అంతర్గ్రంథ సంబంధాన్ని తెరిచి ఉంచుతుంది.
- source_word: כְּאֶרֶץ מִצְרַיִם
  choice: ఐగుప్తు దేశంలా
  rationale: אֶרֶץ అనే భౌగోళిక పదాన్ని నిలిపి, సస్యసమృద్ధి గల ప్రాంతంతో చేసిన పోలికను అందిస్తుంది.
- source_word: בֹּאֲכָה צֹעַר
  choice: సోయరు దిశగా
  rationale: ఈ హీబ్రూ దిశాసూచక నుడికారం సోయరు వైపు ఉన్న ప్రాంతాన్ని సూచిస్తుంది; తెలుగులో సంక్షిప్తంగా, సహజంగా అనువదించబడింది.
theological_decisions:
- issue: దైవనామం יהוה అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది. ‘యాహ్వే’ దానిని బిరుదుగా మార్చకుండా, సాధారణంగా అంగీకరించిన ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరిస్తుంది.
- issue: ‘యాహ్వే తోట’ దేనిని సూచిస్తుంది
  choice: ప్రధాన పాఠంలో ‘యాహ్వే తోట’ అనే రూపాన్నే ఉంచడం
  alternative: ‘ఏదేను తోట’ అని స్పష్టీకరించడం
  rationale: ఇది ఏదేను తోటను సూచించే అవకాశం బలంగా ఉన్నా, హీబ్రూ పాఠంలో ‘ఏదేను’ అనే పేరు లేదు. అందువల్ల సూచనను పాదసూచికలో తెలిపి, ప్రధాన పాఠంలోని పదబంధాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి వాడబడింది. పొడవైన హీబ్రూ వాక్యాన్ని రెండు తెలుగు వాక్యాలుగా విభజించినా, దృష్టి, నీటి సమృద్ధి, విధ్వంసానికి ముందున్న స్థితి, రెండు ఉపమానాలు, సోయరు దిశ అనే అంశాలన్నీ నిలుపబడ్డాయి.
