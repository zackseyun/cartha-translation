  text: וַ/יֵּ֨לֶךְ֙ לְ/מַסָּעָ֔י/ו מִ/נֶּ֖גֶב וְ/עַד בֵּֽית אֵ֑ל עַד הַ/מָּק֗וֹם אֲשֶׁר הָ֨יָה שָׁ֤ם אהל/ה בַּ/תְּחִלָּ֔ה בֵּ֥ין בֵּֽית אֵ֖ל וּ/בֵ֥ין הָ/עָֽי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/003.yaml
  text: And he journeyed by stages from the Negev as far as Bethel[a], to the place where his tent had been at the beginning, between Bethel and Ai.
translation:
  language: te
  text: అతడు నెగెబు నుండి మజిలీ మజిలీగా[a] బేతేలు వరకు—అదే, ఆదిలో తన గుడారం ఉన్న, బేతేలు మరియు హాయి మధ్యనున్న చోటు వరకు—ప్రయాణించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తన ప్రయాణాల క్రమం ప్రకారం”; అంటే ఒక శిబిరస్థలం నుండి మరొక శిబిరస్థలానికి వరుస దశలుగా వెళ్లాడు.
    reason: లְמַסָּעָיוకు ఉన్న పదానువాద ప్రత్యామ్నాయాన్ని మరియు వరుస ప్రయాణదశల భావాన్ని తెలియజేస్తుంది.
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: ప్రయాణించాడు
  rationale: ప్రయాణ మార్గాన్ని వివరించే సందర్భంలో הלך అనే సాధారణ ‘వెళ్లు’ క్రియను దూరప్రయాణ భావాన్ని సహజంగా తెలిపే ‘ప్రయాణించాడు’గా అనువదించాం.
- source_word: לְמַסָּעָיו
  choice: మజిలీలవారీగా
  rationale: מַסָּע అనేది శిబిరం ఎత్తి ప్రయాణించే దశను లేదా మజిలీని సూచిస్తుంది; బహువచన రూపం వరుస మజిలీలుగా సాగిన ప్రయాణ విధానాన్ని తెలుపుతుంది.
- source_word: מִנֶּגֶב
  choice: నెగెబు నుండి
  rationale: ఇక్కడ נֶגֶב సాధారణంగా ‘దక్షిణం’ అనే దిశకన్నా పితరుల కథనంలోని నెగెబు ప్రాంతాన్ని సూచిస్తుంది.
- source_word: וְעַד בֵּית אֵל
  choice: బేతేలు వరకు
  rationale: עַד ప్రయాణం చేరిన హద్దును సూచిస్తుంది; తెలుగులో ‘వరకు’ దానిని స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: עַד הַמָּקוֹם
  choice: చోటుకు
  rationale: రెండవ עַד గమ్యస్థానాన్ని మరింత నిర్దిష్టంగా చెబుతుంది; తెలుగులో ‘చోటుకు’ అని చెప్పడం అనవసర పునరుక్తిని నివారిస్తుంది.
- source_word: אֲשֶׁר הָיָה שָׁם אהלֹה
  choice: తన గుడారం ఉన్న
  rationale: ఈ ఉపవాక్యం అబ్రాము గుడారం ఇంతకు ముందు ఉన్న స్థలాన్ని గుర్తిస్తుంది; שָׁם భావం తెలుగులో ‘ఉన్న చోటు’ అనే నిర్మాణంలో సహజంగా ఇమిడింది.
- source_word: בַּתְּחִלָּה
  choice: మొదట
  rationale: ఇది కథలో అబ్రాము పూర్వం శిబిరం వేసిన సందర్భాన్ని వెనక్కి సూచిస్తుంది; ‘మొదట’ సంక్షిప్తంగా, సహజంగా ఆ కాలసూచనను నిలుపుతుంది.
- source_word: בֵּין בֵּית אֵל וּבֵין הָעָי
  choice: బేతేలు, హాయి మధ్యనున్న
  rationale: בֵּין ... וּבֵין రెండు ప్రదేశాల మధ్యనున్న స్థానాన్ని సూచిస్తుంది; స్థలనామాలను ఆధునిక ప్రామాణిక తెలుగు రూపాల్లో ఇచ్చాం.
