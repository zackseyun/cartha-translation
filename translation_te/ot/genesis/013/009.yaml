id: GEN.13.9
reference: Genesis 13:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: הֲ/לֹ֤א כָל הָ/אָ֨רֶץ֙ לְ/פָנֶ֔י/ךָ הִפָּ֥רֶד נָ֖א מֵ/עָלָ֑/י אִם הַ/שְּׂמֹ֣אל וְ/אֵימִ֔נָה וְ/אִם הַ/יָּמִ֖ין וְ/אַשְׂמְאִֽילָה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/009.yaml
  text: Is not the whole land before you? Please separate from me. If you go to the left[a], then I will go to the right; and if you go to the right, then I will go to the left.
translation:
  language: te
  text: దేశమంతా నీ ముందే ఉంది కదా? దయచేసి నన్ను విడిచి వేరుగా వెళ్లు. నీవు ఎడమవైపుకు వెళ్తే[a], నేను కుడివైపుకు వెళ్తాను; నీవు కుడివైపుకు వెళ్తే, నేను ఎడమవైపుకు వెళ్తాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ షరతు వాక్యాల్లో క్రియ చెప్పకుండా వదిలివేయబడింది. అక్షరార్థంగా, “ఎడమవైపు అయితే, నేను కుడివైపుకు వెళ్తాను; కుడివైపు అయితే, నేను ఎడమవైపుకు వెళ్తాను.” స్పష్టత కోసం అనువాదంలో “వెళ్తే” అని చేర్చబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: ఉంది కదా?
  rationale: సమ్మతిని ఆశించే హీబ్రూ అలంకార ప్రశ్నను ఆధునిక సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: כָל הָאָרֶץ
  choice: దేశమంతా
  rationale: ఇక్కడ אָרֶץ భూమండలాన్ని కాక, నివాసానికి అందుబాటులో ఉన్న దేశాన్ని లేదా ప్రాంతాన్ని సూచిస్తుంది.
- source_word: לְפָנֶיךָ
  choice: నీ ముందే
  rationale: లోతు ఎదుట దేశమంతా అందుబాటులో ఉందనే హీబ్రూ స్థలరూపకాన్ని నిలుపుతుంది.
- source_word: הִפָּרֶד נָא מֵעָלַי
  choice: దయచేసి నన్ను విడిచి వేరుగా వెళ్లు
  rationale: నిఫాల్ ఆజ్ఞారూపంలోని విడిపోవడం అనే భావాన్నీ, נָא తెలిపే మర్యాదపూర్వక అభ్యర్థననూ సహజ తెలుగులో అందిస్తుంది.
- source_word: אִם הַשְּׂמֹאל
  choice: నీవు ఎడమవైపుకు వెళ్తే
  rationale: హీబ్రూలో క్రియ లుప్తంగా ఉంది; తెలుగులో స్పష్టత కోసం సందర్భం సూచించే ‘వెళ్తే’ను చేర్చాం.
- source_word: וְאֵימִנָה
  choice: నేను కుడివైపుకు వెళ్తాను
  rationale: ימין నుండి వచ్చిన దిశాసూచక రూపం కుడివైపు కదలికను తెలుపుతుంది.
- source_word: וְאִם הַיָּמִין
  choice: నీవు కుడివైపుకు వెళ్తే
  rationale: సమాంతరమైన లుప్త వాక్యాన్ని తెలుగులో సహజంగా పూర్తి చేస్తుంది.
- source_word: וְאַשְׂמְאִילָה
  choice: నేను ఎడమవైపుకు వెళ్తాను
  rationale: שׂמאל నుండి వచ్చిన దిశాసూచక రూపం అబ్రాము ఎదురుదిశలో వెళ్లడాన్ని సూచిస్తుంది.
