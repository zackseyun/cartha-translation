id: GEN.13.17
reference: Genesis 13:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: ק֚וּם הִתְהַלֵּ֣ךְ בָּ/אָ֔רֶץ לְ/אָרְכָּ֖/הּ וּ/לְ/רָחְבָּ֑/הּ כִּ֥י לְ/ךָ֖ אֶתְּנֶֽ/נָּה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/017.yaml
  text: Get up[a], walk through the land, through its length and its width[b], for I will give it to you.
translation:
  language: te
  text: లేచి, ఆ దేశమంతటా—దాని పొడవునా, వెడల్పునా—నడువు; ఎందుకంటే దాన్ని నీకు ఇస్తాను.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ק֚וּם
  choice: లేచి
  rationale: קום ఆజ్ఞారూపం లేవడం లేదా నిలబడడాన్ని సూచిస్తుంది; తదుపరి ఆజ్ఞతో సహజంగా కలవడానికి ‘లేచి’ అనువైన ఆధునిక తెలుగు రూపం.
- source_word: הִתְהַלֵּ֣ךְ
  choice: నడువు
  rationale: הלך హిత్పయేల్ ఆజ్ఞారూపం అటూ ఇటూ నడవడం లేదా సంచరించడం అనే భావాన్ని ఇస్తుంది; పొడవు, వెడల్పు అనే విస్తృతి పదాలతో కలిసి ‘నడువు’ ఆ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: בָּאָרֶץ
  choice: ఆ దేశమంతటా
  rationale: ఇక్కడ אֶרֶץ సాధారణ భూమిని కాక అబ్రాముకు చూపబడిన ప్రాంతాన్ని సూచిస్తుంది. హీబ్రూ స్థానార్థక నిర్మాణాన్నీ, తదుపరి విస్తృతి భావాన్నీ తెలుగులో సహజంగా తెలియజేయడానికి ‘ఆ దేశమంతటా’ ఎంచుకున్నాం.
- source_word: לְאָרְכָּהּ וּלְרָחְבָּהּ
  choice: దాని పొడవునా, వెడల్పునా
  rationale: పొడవు మరియు వెడల్పు అనే జంట ఆ దేశపు పూర్తి విస్తృతిని సూచిస్తుంది; రెండు దిశలలో సంచరించాలనే భావాన్ని ఈ రూపం స్పష్టంగా నిలుపుతుంది.
- source_word: כִּ֥י
  choice: ఎందుకంటే
  rationale: ముందున్న ఆజ్ఞకు కారణాన్ని పరిచయం చేస్తుంది; ‘ఎందుకంటే’ ఆ వివరణాత్మక సంబంధాన్ని స్పష్టంగా చూపుతుంది.
- source_word: לְךָ֖ אֶתְּנֶֽנָּה
  choice: దాన్ని నీకు ఇస్తాను
  rationale: נתן అసంపూర్ణ క్రియ ఇక్కడ వాగ్దానాత్మక భవిష్యత్తును సూచిస్తుంది; స్త్రీలింగ ఏకవచన ప్రత్యయం ముందున్న దేశాన్ని సూచిస్తున్నందున ‘దాన్ని’ అని అనువదించాం.
theological_decisions:
- issue: אֶתְּנֶנָּה లోని స్త్రీలింగ ప్రత్యయ సూచ్యం
  choice: ‘దాన్ని’ అనేది ఆ దేశాన్ని సూచిస్తుంది.
  alternative: ప్రత్యయ సూచ్యాన్ని స్పష్టంగా పునరుక్తి చేసి ‘ఆ దేశాన్ని’ అనడం.
  rationale: స్త్రీలింగ ఏకవచన ప్రత్యయం సహజంగా אֶרֶץ వైపు తిరిగి సూచిస్తుంది. ‘దాన్ని’ మూలంలోని సర్వనామ నిర్మాణాన్ని నిలుపుతూ దేవుని వాగ్దానాన్ని అదనపు వ్యాఖ్యానం లేకుండా వ్యక్తం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; నేరుగా పలికిన ఆజ్ఞకు తగిన గంభీరతను ఉంచి, సాధారణ పాఠకులకు సహజంగా వినిపించే నిర్మాణం. ‘దేశమంతటా—దాని పొడవునా, వెడల్పునా—’ అనే రూపం మూలంలోని స్థలం మరియు పూర్తి విస్తృతి రెండింటినీ నిలుపుతుంది.
