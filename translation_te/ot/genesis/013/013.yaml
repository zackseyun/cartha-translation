id: GEN.13.13
reference: Genesis 13:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אַנְשֵׁ֣י סְדֹ֔ם רָעִ֖ים וְ/חַטָּאִ֑ים לַ/יהוָ֖ה מְאֹֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/013.yaml
  text: The men of Sodom were exceedingly wicked and sinful against Yahweh[a].
translation:
  language: te
  text: సొదొమలోని పురుషులు యాహ్వేకు విరోధంగా అత్యంత దుర్మార్గులుగా, పాపులుగా ఉన్నారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యాహ్వే దృష్టిలో.”
    reason: לַיהוָה అనే పదబంధానికి సాధ్యమైన ప్రత్యామ్నాయ భావాన్ని సంరక్షించడానికి.
lexical_decisions:
- source_word: וְ/אַנְשֵׁי סְדֹם
  choice: సొదొమలోని పురుషులు
  rationale: אַנְשֵׁי అనేది אִישׁ పదానికి బహువచన సంయుక్త రూపం; ఇక్కడ సొదొమకు చెందిన పురుషులను సూచిస్తుంది. తెలుగు సహజ వాక్యనిర్మాణం కోసం ‘సొదొమలోని’ అని ఇచ్చాం. ప్రారంభ וְ సందర్భాన్ని అనుసంధానించినా, ఈ వివరణాత్మక వాక్యంలో ప్రత్యేక పదంగా అనువదించాల్సిన అవసరం లేదు.
- source_word: רָעִים
  choice: దుర్మార్గులు
  rationale: ఇక్కడ ఈ పదం సాధారణంగా ‘చెడ్డవారు’ అనే అర్థం కంటే నైతిక దుష్టత్వాన్ని బలంగా సూచిస్తుంది.
- source_word: וְ/חַטָּאִים
  choice: పాపులు
  rationale: רָעִיםకు సమాంతరంగా ఉన్న బహువచన విధేయ నామరూపం; వారిని పాపం చేత లక్షణీకరించబడినవారిగా వర్ణిస్తుంది.
- source_word: לַ/יהוָה
  choice: యాహ్వేకు విరోధంగా
  rationale: חַטָּאִיםతో వచ్చిన לְ, ఎవరి పట్ల పాపం చేయబడిందో సూచించగలదు. יהוה అనే దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా ‘యాహ్వే’గా లిప్యంతరీకరించాం.
- source_word: מְאֹד
  choice: ఎంతో
  rationale: వారి దుర్మార్గతను, పాపస్థితిని బలంగా తీవ్రపరిచే సహజమైన ఆధునిక తెలుగు పదం.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠంలో ఉన్న ఒడంబడిక దైవనామాన్ని బిరుదుగా మార్చకుండా, సాధ్యమైన మూల ఉచ్చారణకు దగ్గరగా తెలుగులో లిప్యంతరీకరించాం.
- issue: לַיהוָה యొక్క భావం
  choice: యాహ్వేకు విరోధంగా
  alternative: యాహ్వే దృష్టిలో
  rationale: חטאతో కూడిన לְ, యాహ్వేకు వ్యతిరేకంగా చేసిన అపరాధాన్ని సూచించవచ్చు. అయితే ‘ఆయన దృష్టిలో’ అనే భావమూ వ్యాకరణపరంగా సాధ్యమే కాబట్టి దాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గంభీరమైన శైలిని ఉపయోగించాం. ‘దుర్మార్గులూ పాపులూ’ అనే సమాంతర నిర్మాణం మూలంలోని రెండు నైతిక విశేషణాల బలాన్ని నిలుపుతుంది.
