translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని వాడాం. మూలంలోని రాజాస్థాన సందర్భాన్ని స్పష్టంగా ఉంచుతూ, ‘నిర్బంధం’ స్వరూపం మరియు అధికార పదవి అక్షరార్థం గురించిన అనిశ్చితిని పాదసూచికల్లో సంరక్షించాం.
