source:
  edition: WLC
  text: פַּרְעֹ֖ה קָצַ֣ף עַל עֲבָדָ֑י/ו וַ/יִּתֵּ֨ן אֹתִ֜/י בְּ/מִשְׁמַ֗ר בֵּ֚ית שַׂ֣ר הַ/טַּבָּחִ֔ים אֹתִ֕/י וְ/אֵ֖ת שַׂ֥ר הָ/אֹפִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/010.yaml
  text: Pharaoh was angry with his servants[a], and he put me in custody in the house of the captain of the guard[b], me and the chief baker.
translation:
  language: te
  text: ఫరో తన సేవకులపై కోపగించాడు, మరియు నన్నూ ప్రధాన రొట్టెల తయారీదారునూ అంగరక్షక దళాధిపతి[b] ఇంట్లో నిర్బంధంలో[a] ఉంచాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘కాపలా కింద’; హీబ్రూ పదం కాపలాతో కూడిన నిర్బంధాన్ని సూచిస్తుంది, కాని అది తప్పనిసరిగా ప్రత్యేక కారాగార భవనాన్ని సూచించదు.
    reason: lexical_alternative
  - marker: b
    text: ‘అంగరక్షక దళాధిపతి’ అనేది ఒక రాజాస్థాన పదవి. హీబ్రూలో మరింత అక్షరార్థంగా ‘వధించేవారి/శిక్ష అమలు చేసేవారి అధిపతి’ అని ఉంటుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: קָצַף
  choice: కోపగించి
  rationale: హీబ్రూ క్రియ కోపాన్ని సూచిస్తుంది. తీవ్రతను అనవసరంగా పెంచకుండా, ఆధునిక తెలుగులో సహజంగా ‘కోపగించి’ అని అనువదించాం.
- source_word: עֲבָדָיו
  choice: తన సేవకుల మీద
  rationale: ఈ రాజాస్థాన సందర్భంలో పానదాయకుడు, రొట్టెల తయారీదారుడు వంటి రాజసేవలో ఉన్నవారు ఉద్దేశించబడ్డారు. ‘సేవకులు’ అనే పదం హీబ్రూ పదంలోని సంబంధ భావాన్ని నిలుపుతుంది; ‘బానిసలు’ అని చెప్పడం సందర్భం నొక్కిచెప్పని భావాన్ని చేర్చవచ్చు.
- source_word: בְּמִשְׁמַר
  choice: నిర్బంధంలో
  rationale: ఈ పదం కాపలా కింద ఉంచబడిన నిర్బంధాన్ని సూచిస్తుంది; ప్రత్యేకమైన కారాగార భవనాన్ని తప్పనిసరిగా సూచించదు.
- source_word: בֵּית שַׂר הַטַּבָּחִים
  choice: అంగరక్షక దళాధిపతి ఇంట్లో
  rationale: యోసేపు కథనంలోని రాజాస్థాన పదవిని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది. మూలపదబంధంలోని ‘వధించేవారు/శిక్ష అమలు చేసేవారు’ అనే అక్షరార్థాన్ని పాదసూచికలో నిలిపాం.
- source_word: שַׂר הָאֹפִים
  choice: ప్రధాన రొట్టెల తయారీదారు
  rationale: రాజాస్థానంలో రొట్టెలు తయారుచేసేవారికి అధిపతిగా ఉన్న వ్యక్తిని స్పష్టంగా, సాధారణ పాఠకులకు అర్థమయ్యే రీతిలో తెలియజేస్తుంది.
- source_word: אֹתִי ... וְאֵת שַׂר הָאֹפִים
  choice: నన్నూ ప్రధాన రొట్టెల తయారీదారుణ్ణీ
  rationale: హీబ్రూలోని రెండు కర్మలను తెలుగు సహజ సముచ్చయ నిర్మాణంతో వ్యక్తం చేస్తూ, ఇద్దరూ నిర్బంధించబడ్డారనే భావాన్ని నిలుపుతుంది.
