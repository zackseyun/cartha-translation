  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/יִקְבְּצ֗וּ אֶת כָּל אֹ֨כֶל֙ הַ/שָּׁנִ֣ים הַ/טֹּבֹ֔ת הַ/בָּאֹ֖ת הָ/אֵ֑לֶּה וְ/יִצְבְּרוּ בָ֞ר תַּ֧חַת יַד פַּרְעֹ֛ה אֹ֥כֶל בֶּ/עָרִ֖ים וְ/שָׁמָֽרוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/035.yaml
  text: Let them gather all the food of these coming good years[a], and let them store up grain under Pharaoh’s authority as food in the cities[b], and let them keep it.
translation:
  language: te
  text: వారు రాబోయే ఈ మంచి సంవత్సరాల ఆహారమంతటినీ సమకూర్చాలి; ఫరో అధికారం కింద[a] ధాన్యాన్ని పట్టణాల్లో ఆహార నిల్వగా పోగుచేసి, దాన్ని భద్రపరచాలి[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా ‘ఫరో చేతి కింద’; ఇది ఫరో అధికారం లేదా నియంత్రణలో ఉండడాన్ని తెలిపే హీబ్రూ నుడికారం.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘దాన్ని కాపాడాలి/సంరక్షించాలి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִקְבְּצוּ
  choice: వారు ... సమకూర్చాలి
  rationale: యోసేపు ప్రతిపాదిస్తున్న కార్యాచరణలో ఈ అసంపూర్ణ క్రియ ఆజ్ఞార్థక సూచనను వ్యక్తం చేస్తుంది; ఆధునిక తెలుగులో ‘సమకూర్చాలి’ ఆ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: כָּל אֹכֶל
  choice: ఆహారమంతటినీ
  rationale: אֹכֶל అనేది విస్తృతంగా ఆహారం లేదా ఆహార సామగ్రిని సూచిస్తుంది; సందర్భంలో సమృద్ధి సంవత్సరాల్లో సేకరించాల్సిన పంట దిగుబడిని సమగ్రంగా సూచించడానికి ఈ పదబంధం సరిపోతుంది.
- source_word: הַשָּׁנִים הַטֹּבוֹת הַבָּאֹת הָאֵלֶּה
  choice: రాబోయే ఈ మంచి సంవత్సరాల
  rationale: హీబ్రూలోని ‘రాబోయే’ అనే భావాన్నీ, ‘ఈ’ అనే నిర్దేశక బలాన్నీ నిలుపుతూ తెలుగులో సహజమైన పదక్రమాన్ని ఉపయోగించింది.
- source_word: וְיִצְבְּרוּ
  choice: పోగుచేసి
  rationale: ఈ క్రియ పెద్ద మొత్తంలో కూడబెట్టడం లేదా నిల్వ చేయడం అనే భావం ఇస్తుంది; ధాన్య సేకరణ సందర్భంలో ‘పోగుచేయడం’ స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: בָר
  choice: ధాన్యం
  rationale: בָר సాధారణంగా నూర్చిన లేదా సిద్ధం చేసిన ధాన్యాన్ని సూచిస్తుంది; ఒక నిర్దిష్ట పంటకు పరిమితం చేయకుండా ‘ధాన్యం’ మూలంలోని విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: תַּחַת יַד פַּרְעֹה
  choice: ఫరో అధికారం కింద
  rationale: అక్షరార్థంగా ‘ఫరో చేతి కింద’ అనే హీబ్రూ నుడికారం ఇక్కడ ఫరో నియంత్రణ లేదా అధికారాన్ని సూచిస్తుంది; భావాన్ని స్పష్టంగా తెలియజేసే సహజ తెలుగు రూపం ఎంచుకుంది.
- source_word: אֹכֶל בֶּעָרִים
  choice: పట్టణాల్లో ఆహార నిల్వగా
  rationale: పోగుచేసిన ధాన్యం పట్టణాల్లో భవిష్యత్తు ఆహారంగా ఉండాలనే స్థానిక, ప్రయోజనాత్మక భావాలను రెండింటినీ ఈ రూపం తెలియజేస్తుంది.
- source_word: וְשָׁמָרוּ
  choice: దాన్ని భద్రపరచాలి
  rationale: שׁמר ఇక్కడ నిల్వ చేసిన ధాన్యాన్ని భవిష్యత్తు కోసం ఉంచడం, కాపాడడం లేదా సంరక్షించడం అనే భావం ఇస్తుంది; ‘భద్రపరచాలి’ ఈ సందర్భానికి తగిన సమగ్ర పదం.
