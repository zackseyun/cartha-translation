translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని ఉపయోగించింది. హీబ్రూ వాక్యంలోని సూచనాత్మక ఆజ్ఞలను ‘చాలి’ రూపాలతో, పరిపాలనా సందర్భాన్ని స్పష్టంగా ఉంచుతూ అందించింది.
