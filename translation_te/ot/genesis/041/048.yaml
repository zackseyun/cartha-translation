id: GEN.41.48
reference: Genesis 41:48
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּקְבֹּ֞ץ אֶת כָּל אֹ֣כֶל שֶׁ֣בַע שָׁנִ֗ים אֲשֶׁ֤ר הָיוּ֙ בְּ/אֶ֣רֶץ מִצְרַ֔יִם וַ/יִּתֶּן אֹ֖כֶל בֶּ/עָרִ֑ים אֹ֧כֶל שְׂדֵה הָ/עִ֛יר אֲשֶׁ֥ר סְבִיבֹתֶ֖י/הָ נָתַ֥ן בְּ/תוֹכָֽ/הּ־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/048.yaml
  text: And he gathered all the food of the seven years that were in the land of Egypt[a], and he put the food in the cities. In each city he put the food from the fields around it.
translation:
  language: te
  text: అతడు ఐగుప్తు దేశంలో ఉన్న ఆ ఏడు సంవత్సరాల ఆహారమంతటినీ కూడబెట్టి, ఆహారాన్ని పట్టణాల్లో ఉంచాడు. ప్రతి పట్టణం చుట్టూ ఉన్న పొలాల ఆహారాన్ని ఆ పట్టణంలో ఉంచాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత అక్షరార్థంగా: “ఆ పట్టణం చుట్టూ ఉన్న పొలాల ఆహారాన్ని దాని మధ్యలో ఉంచాడు.” హీబ్రూ పాఠంలో ‘ఆహారం’ అనే పదం మళ్లీ వస్తుంది; ఉద్ఘాటన కోసం పునఃప్రస్తావన నిర్మాణం వాడబడింది.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְבֹּץ
  choice: సమకూర్చి
  rationale: קבץ అంటే చెల్లాచెదురుగా ఉన్నదాన్ని ఒకచోట కూడబెట్టడం. కథన సందర్భంలో ‘సమకూర్చి’ సహజంగా ఉండి మూలార్థాన్ని నిలుపుతుంది.
- source_word: כָּל אֹכֶל
  choice: ఆహారమంతా
  rationale: אֹכֶל విస్తృతంగా ‘ఆహారం’ అని అర్థం; సందర్భం ధాన్యసేకరణను సూచించినా, ‘ధాన్యం’ అని పరిమితం చేయకుండా మూలంలోని విస్తృతతను కాపాడుతుంది.
- source_word: שֶׁבַע שָׁנִים אֲשֶׁר הָיוּ בְּאֶרֶץ מִצְרַיִם
  choice: ఐగుప్తు దేశంలో కలిగిన ఆ ఏడు సంవత్సరాల
  rationale: హీబ్రూలో అక్షరార్థంగా ‘ఐగుప్తు దేశంలో ఉన్న ఏడు సంవత్సరాలు.’ తెలుగులో సంవత్సరాల గురించి ‘కలిగిన’ అనడం సహజంగా ఉండి, ముందుగా ప్రస్తావించిన సమృద్ధి సంవత్సరాలను ‘ఆ’ సూచిస్తుంది.
- source_word: וַיִּתֶּן אֹכֶל בֶּעָרִים
  choice: పట్టణాల్లో ఉంచాడు
  rationale: נתן యొక్క ప్రాథమిక భావం ‘పెట్టడం/ఉంచడం.’ నిల్వ సందర్భం స్పష్టమైనప్పటికీ, మూలంలో లేని ప్రత్యేక క్రియను చేర్చకుండా ‘ఉంచాడు’ అని అనువదించబడింది.
- source_word: אֹכֶל שְׂדֵה הָעִיר אֲשֶׁר סְבִיבֹתֶיהָ
  choice: ప్రతి పట్టణం చుట్టూ ఉన్న పొలాల ఆహారాన్ని
  rationale: నిర్మాణం ఆయా పట్టణాల చుట్టుపక్కల పొలాల నుంచి వచ్చిన ఆహారాన్ని సూచిస్తుంది. ‘ప్రతి’ అనే పంపిణీ భావం సందర్భానుసారంగా స్పష్టీకరించబడింది.
- source_word: נָתַן בְּתוֹכָהּ
  choice: ఆ పట్టణంలోనే ఉంచాడు
  rationale: ‘దాని మధ్యలో ఉంచాడు’ అనే భావాన్ని సహజ తెలుగులో ‘ఆ పట్టణంలోనే’ అని ఇచ్చి, ప్రతి ప్రాంతపు ఆహారం దాని పట్టణంలోనే ఉంచబడిందనే ఉద్ఘాటనను నిలిపింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రద కథనశైలి. ‘ఆహారం’ అనే విస్తృత పదాన్ని నిలిపి, హీబ్రూ పునరారంభ నిర్మాణాన్ని ప్రధాన పాఠంలో సహజమైన పంపిణీ వాక్యంగా ఇచ్చి, అక్షర నిర్మాణాన్ని పాదసూచికలో నమోదు చేశాం.
