translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘ఇదిగో’ ద్వారా మూలంలోని దృశ్యాత్మక ఉద్ఘాటనను, ‘వస్తున్నాయి’ ద్వారా కొనసాగుతున్న చర్యను నిలుపుకున్నాం. మూలంలోని పదక్రమాన్ని యాంత్రికంగా అనుసరించకుండా, తెలుగు వాక్యనిర్మాణానికి తగిన విధంగా లక్షణాలను తరువాతి ఉపవాక్యంలో ఉంచాం.
