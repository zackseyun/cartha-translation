  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּישָׁ֕ן וַֽ/יַּחֲלֹ֖ם שֵׁנִ֑ית וְ/הִנֵּ֣ה שֶׁ֣בַע שִׁבֳּלִ֗ים עֹל֛וֹת בְּ/קָנֶ֥ה אֶחָ֖ד בְּרִיא֥וֹת וְ/טֹבֽוֹת׀׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/005.yaml
  text: Then he slept and dreamed a second time[a], and behold, seven ears of grain were coming up on one stalk[b], plump and good.
translation:
  language: te
  text: తర్వాత అతడు నిద్రపోయి రెండోసారి కల కన్నాడు. ఇదిగో, ఒకే కాండం మీద ఏడు ధాన్యపు కంకులు[a] పైకి వస్తున్నాయి; అవి పుష్టిగా ఉన్న[b], మంచి కంకులు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఏడు ధాన్యపు వెన్నులు.’ హీబ్రూ పదం ధాన్యపు గింజలు ఉండే కంకును లేదా వెన్నును సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘బలిసినవి’ లేదా ‘నిండినవి.’ ఈ విశేషణం కంకులు గింజలతో బాగా నిండి ఉన్నాయని వివరిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּישָׁן
  choice: తర్వాత అతడు నిద్రపోయి
  rationale: కథనాన్ని ముందుకు నడిపించే హీబ్రూ క్రియారూపాన్ని సహజమైన తెలుగు క్రమసూచకంతో వ్యక్తం చేస్తుంది; నిద్రపోవడం అనే సాధారణ అర్థాన్ని నిలుపుతుంది.
- source_word: וַיַּחֲלֹם שֵׁנִית
  choice: రెండోసారి కల కన్నాడు
  rationale: שֵׁנִית యొక్క ‘రెండోసారి’ అనే క్రియావిశేషణ భావాన్ని నేరుగా, సహజంగా అందిస్తుంది.
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: కలలోని దృశ్యాన్ని సజీవంగా చూపించే הִנֵּה యొక్క సంభాషణాత్మక బలాన్ని నిలుపుతుంది.
- source_word: שֶׁבַע שִׁבֳּלִים
  choice: ఏడు ధాన్యపు కంకులు
  rationale: שִׁבֳּלִים ధాన్యం గింజలు ఉండే కంకులను సూచిస్తుంది; ‘ధాన్యపు కంకులు’ ఆధునిక తెలుగులో స్పష్టమైన వ్యవసాయ పదబంధం.
- source_word: עֹלֹת
  choice: పైకి వస్తున్నాయి
  rationale: హీబ్రూ కృదంతంలోని కొనసాగుతున్న, కంటికి కనిపిస్తున్న చర్య భావాన్ని నిలుపుతుంది.
- source_word: בְּקָנֶה אֶחָד
  choice: ఒకే కాండం మీద
  rationale: ఒకే కాడ లేదా కాండం మీద అనేక కంకులు కనిపిస్తున్న దృశ్యాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בְּרִיאוֹת
  choice: బలిసినవిగా
  rationale: ఈ విశేషణం లావుగా, నిండుగా, పుష్టిగా ఉండడాన్ని సూచిస్తుంది; ధాన్యపు కంకుల సందర్భంలో ‘బలిసినవి’ గింజలు బాగా పట్టిన స్థితిని సహజంగా తెలియజేస్తుంది.
- source_word: וְטֹבוֹת
  choice: మంచివిగా
  rationale: טוֹב యొక్క విస్తృతమైన ‘మంచి, శ్రేష్ఠమైన’ భావాన్ని అనవసరంగా కుదించకుండా నేరుగా నిలుపుతుంది.
