  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/תִּבְלַ֨עְנָה֙ הַ/שִּׁבֳּלִ֣ים הַ/דַּקּ֔וֹת אֵ֚ת שֶׁ֣בַע הַֽ/שִּׁבֳּלִ֔ים הַ/בְּרִיא֖וֹת וְ/הַ/מְּלֵא֑וֹת וַ/יִּיקַ֥ץ פַּרְעֹ֖ה וְ/הִנֵּ֥ה חֲלֽוֹם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/007.yaml
  text: And the thin ears swallowed up the seven healthy and full ears[a]. Then Pharaoh awoke, and behold[b], it was a dream.
translation:
  language: te
  text: ఆ సన్నని కంకులు[a] పుష్టమైనవి[b], నిండినవి అయిన ఏడు కంకులను మింగివేశాయి. అప్పుడు ఫరో మేల్కొన్నాడు; ఇదిగో, అది కలే.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘కంకులు’ అంటే మొత్తం కాండాలు కాదు; గింజలు ఉండే ధాన్యపు పైభాగాలు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘ఆరోగ్యకరమైనవి’ లేదా ‘బలిసినవి.’ హీబ్రూ పదం పుష్టమైన, దృఢమైన స్థితిని కూడా సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּבְלַעְנָה
  choice: మింగివేశాయి
  rationale: ‘మింగు’ అనే మూలార్థాన్ని నిలుపుతూ, కలలోని అసహజమైన సజీవ చిత్రణను సహజమైన తెలుగులో బలంగా వ్యక్తం చేస్తుంది.
- source_word: הַשִּׁבֳּלִים
  choice: కంకులు
  rationale: ఇక్కడ ఈ పదం మొత్తం కాండాన్ని కాక, గింజలు ఉండే ధాన్యపు పైభాగాన్ని సూచిస్తుంది; ‘కంకులు’ ఆధునిక తెలుగులో ఖచ్చితమైన, సంక్షిప్తమైన పదం.
- source_word: הַדַּקּוֹת
  choice: సన్నని
  rationale: ధాన్యపు కంకుల పలుచని, ఎదగని రూపాన్ని నేరుగా తెలియజేస్తుంది.
- source_word: שֶׁבַע
  choice: ఏడు
  rationale: మూలంలోని సంఖ్యను నేరుగా అనువదిస్తుంది.
- source_word: הַבְּרִיאוֹת
  choice: పుష్టిగా
  rationale: ఈ విశేషణం ఆరోగ్యకరమైన, బలిసిన లేదా దృఢమైన స్థితిని సూచించగలదు; ధాన్యపు కంకుల సందర్భంలో ‘పుష్టిగా’ సహజంగా ఉంటుంది.
- source_word: וְהַמְּלֵאוֹת
  choice: నిండుగా ఉన్న
  rationale: కంకులు గింజలతో నిండి ఉన్నాయనే మూలార్థాన్ని అనవసర వివరణ లేకుండా నిలుపుతుంది.
- source_word: וַיִּיקַץ
  choice: మేల్కొన్నాడు
  rationale: నిద్ర నుండి మేల్కొనడాన్ని తెలిపే గౌరవప్రదమైన, సహజమైన కథన రూపం.
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: ఆకస్మిక గ్రహింపుపై దృష్టి నిలిపే హీబ్రూ సంభాషణ సూచకపు సాహిత్య బలాన్ని కాపాడుతుంది.
- source_word: חֲלוֹם
  choice: అది ఒక కల
  rationale: హీబ్రూలోని సంక్షిప్తమైన ‘ఇదిగో—కల’ అనే నిర్మాణానికి అవసరమైన క్రియను తెలుగులో సహజంగా పూరిస్తూ, ఫరో గ్రహించిన ఆకస్మికతను నిలుపుతుంది.
