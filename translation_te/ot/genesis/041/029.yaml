translation:
  language: te
  text: ఇదిగో, ఐగుప్తు దేశమంతటా గొప్ప సమృద్ధి ఉండే ఏడు సంవత్సరాలు రాబోతున్నాయి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: ఇదిగో
  rationale: తరువాత చెప్పబోయే విషయంపై దృష్టి నిలిపే హీబ్రూ సూచనాత్మక బలాన్ని సహజమైన, గౌరవప్రదమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: שֶׁבַע שָׁנִים
  choice: ఏడు సంవత్సరాలు
  rationale: సంఖ్యతో కూడిన కాలవ్యవధిని నేరుగా, సహజంగా అనువదిస్తుంది.
- source_word: בָּאוֹת
  choice: రాబోతున్నాయి
  rationale: ‘సంవత్సరాలు’తో సరిపడే స్త్రీలింగ బహువచన కృదంతం సమీప భవిష్యత్తును సజీవంగా సూచిస్తుంది; తెలుగు వాక్యంలో ‘రాబోతున్నాయి’ ఆ భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: שָׂבָע גָּדוֹל
  choice: గొప్ప సమృద్ధి
  rationale: ఈ కథా సందర్భంలో ఆహారం, పంటలు విస్తారంగా లభించే స్థితిని సూచిస్తుంది; ‘గొప్ప’ మూలంలోని తీవ్రతను నిలుపుతుంది.
- source_word: בְּכָל אֶרֶץ מִצְרָיִם
  choice: ఐగుప్తు దేశమంతటా
  rationale: ఐగుప్తు భూభాగమంతటా వ్యాపించే పరిధిని సంక్షిప్తంగా, సహజమైన తెలుగులో తెలియజేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయితే ప్రవచన ప్రకటనకు తగిన గౌరవప్రదమైన శైలిని పాటించాం. హీబ్రూ పదక్రమాన్ని యాంత్రికంగా అనుసరించకుండా, ‘గొప్ప సమృద్ధి ఉండే’ అనే సహజ తెలుగు విశేషణ నిర్మాణంతో భావాన్ని నిలిపాం.
