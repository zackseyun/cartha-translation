id: GEN.41.32
reference: Genesis 41:32
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/עַ֨ל הִשָּׁנ֧וֹת הַ/חֲל֛וֹם אֶל פַּרְעֹ֖ה פַּעֲמָ֑יִם כִּֽי נָכ֤וֹן הַ/דָּבָר֙ מֵ/עִ֣ם הָ/אֱלֹהִ֔ים וּ/מְמַהֵ֥ר הָ/אֱלֹהִ֖ים לַ/עֲשֹׂתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/032.yaml
  text: And as for the dream being repeated to Pharaoh twice[a], it is because the matter is fixed by God[b], and God is hastening to do it.
translation:
  language: te
  text: ఫరోకు ఆ కల రెండుసార్లు రావడానికి కారణం ఏమిటంటే, ఆ విషయం దేవునిచేత స్థిరపరచబడింది[a], దేవుడు ఆ విషయాన్ని నెరవేర్చడానికి త్వరపడుతున్నాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆ విషయం దేవునివద్ద స్థిరపరచబడింది.”
    reason: מֵעִם అనే పదబంధం దేవుని నుండి/దేవునివద్ద అనే భావాన్ని కూడా సూచించగలదని చూపే పదార్థ ప్రత్యామ్నాయం.
  - marker: b
    text: లేదా, “దేవుడు ఆ విషయాన్ని త్వరగా చేయబోతున్నాడు” లేదా “దేవుడు దాన్ని త్వరలో చేయబోతున్నాడు.”
    reason: מְמַהֵר అనే కృదంతం కొనసాగుతున్న త్వరిత చర్యను గానీ, సమీప భవిష్యత్తులో జరిగే కార్యాన్ని గానీ సూచించగలదు.
lexical_decisions:
- source_word: וְעַל
  choice: విషయానికొస్తే
  rationale: పునరావృతమైన కల గురించి యోసేపు వివరణకు మారుతున్న సంభాషణాత్మక భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: הִשָּׁנוֹת הַחֲלוֹם
  choice: ఆ కల రెండుసార్లు రావడం
  rationale: కల పునరావృతమైందనే కర్మణి భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; తరువాతి פַּעֲמָיִםతో కలిసి రెండుసార్లు వచ్చినట్లు స్పష్టం చేస్తుంది.
- source_word: אֶל־פַּרְעֹה
  choice: ఫరోకు
  rationale: కల పునరావృతం ఫరోకు సంభవించిందనే దిశ/సంబంధ భావాన్ని సంక్షిప్తంగా అందిస్తుంది.
- source_word: פַּעֲמָיִם
  choice: రెండుసార్లు
  rationale: హీబ్రూ ద్వివచన రూపానికి సహజమైన తెలుగు సమానం.
- source_word: כִּי
  choice: కారణాన్ని తెలిపే వాక్య నిర్మాణం
  rationale: తరువాతి రెండు వాక్యాంశాలు కల ఎందుకు పునరావృతమైందో వివరిస్తున్న కారణార్థాన్ని తెలుగులో విరామచిహ్నం మరియు వాక్యక్రమం ద్వారా స్పష్టం చేస్తుంది.
- source_word: נָכוֹן הַדָּבָר
  choice: ఆ విషయం స్థిరపరచబడింది
  rationale: ప్రకటించబడిన విషయం నిశ్చయంగా నిర్ణయించబడిందనే స్థిరత్వ భావాన్ని నిలుపుతుంది.
- source_word: מֵעִם הָאֱלֹהִים
  choice: దేవునిచేత
  rationale: ఈ నిర్ణయానికి మూలం మరియు దాన్ని స్థిరపరిచిన కర్త దేవుడనే సందర్భార్థాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: וּמְמַהֵר
  choice: త్వరపడుతున్నాడు
  rationale: హీబ్రూ కృదంతంలోని కొనసాగుతున్న తక్షణత/సమీప కార్య భావాన్ని నేరుగా నిలుపుతుంది.
- source_word: לַעֲשֹׂתוֹ
  choice: దాన్ని చేయడానికి
  rationale: ప్రకటించిన విషయాన్ని దేవుడు కార్యరూపంలోకి తేవడాన్ని మూలంలోని సాధారణ క్రియకు దగ్గరగా అనువదిస్తుంది.
theological_decisions:
- issue: הָאֱלֹהִים అనే పదానికి ఏకవచన లేదా బహువచన అర్థం
  choice: దేవుడు
  alternative: దేవతలు
  rationale: రూపపరంగా אֱלֹהִים బహువచనాకారంలో ఉన్నా, ఏకవచన క్రియాసంబంధం మరియు యోసేపు మాటల సందర్భం ఒక్క దేవుణ్ణే సూచిస్తున్నాయి.
- issue: దేవుని నిర్ణయం మరియు కార్యసమీపత మధ్య సంబంధం
  choice: విషయం దేవునిచేత స్థిరపరచబడింది; దేవుడు దాన్ని చేయడానికి త్వరపడుతున్నాడు
  alternative: విషయం కేవలం సంభవించే అవకాశం ఉంది; దేవుడు దాన్ని తరువాత చేయవచ్చు
  rationale: మూలంలోని נָכוֹן నిర్ణయ స్థిరత్వాన్ని, מְמַהֵר కార్యం త్వరగా జరగబోతున్న భావాన్ని తెలియజేస్తాయి; రెండింటినీ తగ్గించకుండా ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, అయితే గౌరవప్రదంగా ఉంచబడింది. మూలంలోని నిర్ణయ స్థిరత్వం మరియు తక్షణ కార్య భావం రెండూ నిలుపబడ్డాయి.
