base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/053.yaml
  text: Then the seven years of abundance that had been in the land of Egypt came to an end.
translation:
  language: te
  text: అప్పుడు ఐగుప్తు దేశంలో ఉన్న ఏడు సమృద్ధి సంవత్సరాలు ముగిశాయి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּכְלֶינָה
  choice: ముగిశాయి
  rationale: כלה ధాతువు ఇక్కడ పూర్తికావడం లేదా అంతానికి రావడం అనే భావాన్ని ఇస్తుంది. స్త్రీలింగ బహువచన క్రియ ‘సంవత్సరాలు’తో సరిపోతుంది; ‘ముగిశాయి’ సహజమైన ఆధునిక తెలుగు.
- source_word: שֶׁבַע שְׁנֵי הַשָּׂבָע
  choice: ఏడు సమృద్ధి సంవత్సరాలు
  rationale: నిర్మాణ సంబంధాన్ని తెలుగులో సహజమైన నామవాచక సమాసంగా వ్యక్తం చేస్తుంది. הַשָּׂבָע సూచించే పంటల సమృద్ధి కాలానికి ‘సమృద్ధి’ స్పష్టమైన, గౌరవప్రదమైన పదం.
- source_word: אֲשֶׁר הָיָה
  choice: ఉన్న
  rationale: సమృద్ధి సంవత్సరాలను ఐగుప్తు దేశంతో అనుసంధానించే సంబంధ ఉపవాక్యాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది; కాలక్రమం ప్రధాన క్రియ ‘ముగిశాయి’ ద్వారా స్పష్టమవుతుంది.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: ఐగుప్తు దేశంలో
  rationale: אֶרֶץ‌ను ‘దేశం’గా స్పష్టంగా నిలుపుతూ తెలుగు బైబిలు వాడుకలో సుపరిచితమైన ‘ఐగుప్తు’ రూపాన్ని ఉపయోగిస్తుంది.
