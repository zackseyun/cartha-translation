  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని ‘దేశం’ అంశాన్ని నిలిపి, అనవసరమైన వివరణను చేర్చలేదు.
