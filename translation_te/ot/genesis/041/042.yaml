  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּ֨סַר פַּרְעֹ֤ה אֶת טַבַּעְתּ/וֹ֙ מֵ/עַ֣ל יָד֔/וֹ וַ/יִּתֵּ֥ן אֹתָ֖/הּ עַל יַ֣ד יוֹסֵ֑ף וַ/יַּלְבֵּ֤שׁ אֹת/וֹ֙ בִּגְדֵי שֵׁ֔שׁ וַ/יָּ֛שֶׂם רְבִ֥ד הַ/זָּהָ֖ב עַל צַוָּארֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/042.yaml
  text: Then Pharaoh removed his signet ring from his hand and put it on Joseph’s hand[c][b][a], and he clothed him in garments of fine linen and put a gold chain around his neck.
translation:
  language: te
  text: అప్పుడు ఫరో తన చేతి నుండి తన ముద్ర ఉంగరాన్ని[a] తీసి యోసేపు చేతికి పెట్టాడు. అతనికి సన్నని నారబట్టతో చేసిన వస్త్రాలు[b] తొడిగించి, అతని మెడలో బంగారు గొలుసు[c] వేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఉంగరం.’ హీబ్రూ పదం సాధారణంగా ఉంగరాన్ని కూడా సూచించగలదు; అయితే ఈ రాజసంబంధ సందర్భంలో ఇది ఫరో అధికారాన్ని అప్పగించడానికి ఉపయోగించిన ముద్ర ఉంగరమై ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘సన్నని నారబట్ట’ అనేది హీబ్రూ שֵׁשׁ (షేష్) అనే పదానికి అనువాదం. అది సంపద, గౌరవాలతో ముడిపడిన ఉన్నత నాణ్యతగల నారబట్టను సూచిస్తుంది.
    reason: cultural_note
  - marker: c
    text: లేదా ‘బంగారు హారం,’ ‘బంగారు కంఠాభరణం.’ ఈ హీబ్రూ పదం సూచించే మెడ ఆభరణం ఖచ్చితంగా ఏ రూపంలో ఉండేదో స్పష్టంగా తెలియదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּסַר
  choice: తీసి
  rationale: ఈ క్రియకు ‘తొలగించడం, తీసివేయడం’ అనే అర్థం ఉంది. చేతి నుండి ఉంగరాన్ని తీసే చర్యకు ‘తీసి’ సహజమైన ఆధునిక తెలుగు.
- source_word: טַבַּעְתּוֹ
  choice: తన ముద్ర ఉంగరాన్ని
  rationale: טַבַּעַת సాధారణంగా ‘ఉంగరం’ అనవచ్చు; అయితే రాజసభా సందర్భంలో ఇది అధికారాన్ని అప్పగించడానికి ఉపయోగించే ఫరో ముద్ర ఉంగరమని సందర్భం సూచిస్తుంది.
- source_word: מֵעַל יָדוֹ
  choice: తన చేతి నుండి
  rationale: హీబ్రూ స్థలార్థాన్ని తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: וַיִּתֵּן אֹתָהּ עַל יַד יוֹסֵף
  choice: యోసేపు చేతికి పెట్టాడు
  rationale: נתן సాధారణంగా ‘ఇచ్చాడు’ అయినా, ఉంగరాన్ని ‘చేతిమీద’ ఉంచినట్లు చెప్పే ఈ నిర్మాణంలో భౌతికంగా పెట్టడం ఉద్దేశం. ‘చేతికి పెట్టాడు’ సహజంగా ఉండి మూలంలోని చర్యను కాపాడుతుంది.
- source_word: וַיַּלְבֵּשׁ אֹתוֹ
  choice: అతనికి … వస్త్రాలు తొడిగించి
  rationale: ఈ రూపం మరొకరికి వస్త్రాలు ధరింపజేయడాన్ని సూచిస్తుంది; ‘తొడిగించి’ రాజపదవిలో నియమించే లాంఛనప్రాయ చర్యను సహజంగా తెలియజేస్తుంది.
- source_word: בִּגְדֵי שֵׁשׁ
  choice: సన్నని నారబట్టతో చేసిన వస్త్రాలు
  rationale: שֵׁשׁ ఉన్నత నాణ్యతగల సన్నని నారబట్టను సూచిస్తుంది; ఈ అనువాదం పదార్థాన్నీ గౌరవప్రతిష్ఠల సందర్భాన్నీ స్పష్టంగా ఉంచుతుంది.
- source_word: רְבִד הַזָּהָב
  choice: బంగారు గొలుసు
  rationale: רְבִד మెడపై ధరించే ఆభరణాన్ని సూచిస్తుంది. దాని ఖచ్చితమైన రూపం నిర్ధారించడం కష్టం; ‘బంగారు గొలుసు’ సందర్భానికి సరిపోయే సహజమైన తెలుగు.
- source_word: עַל צַוָּארוֹ
  choice: అతని మెడలో
  rationale: హీబ్రూలో అక్షరార్థంగా ‘అతని మెడపై’ ఉంది; మెడ ఆభరణాన్ని ధరింపజేయడాన్ని తెలుగులో ‘మెడలో … వేశాడు’ అని సహజంగా అంటారు.
