translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన కథనశైలి వాడబడింది. వరుస రాజలాంఛన చర్యలు స్పష్టంగా ఉండేందుకు రెండు వాక్యాలుగా విభజించబడినప్పటికీ, హీబ్రూ వాక్యక్రమం నిలుపబడింది. ప్రతి పాదసూచిక గుర్తు సంబంధిత పదబంధం వెంట ఉంచబడింది.
