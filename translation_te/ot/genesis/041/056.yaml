id: GEN.41.56
reference: Genesis 41:56
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הָ/רָעָ֣ב הָיָ֔ה עַ֖ל כָּל פְּנֵ֣י הָ/אָ֑רֶץ וַ/יִּפְתַּ֨ח יוֹסֵ֜ף אֶֽת כָּל אֲשֶׁ֤ר בָּ/הֶם֙ וַ/יִּשְׁבֹּ֣ר לְ/מִצְרַ֔יִם וַ/יֶּחֱזַ֥ק הָֽ/רָעָ֖ב בְּ/אֶ֥רֶץ מִצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/056.yaml
  text: And the famine was over all the face of the earth[a], and Joseph opened all that was in them and sold grain to Egypt[b], and the famine grew severe in the land of Egypt.
translation:
  language: te
  text: కరవు దేశమంతటా[a] వ్యాపించింది. యోసేపు ధాన్యం నిల్వచేసిన గిడ్డంగులన్నిటినీ తెరిచి, ఐగుప్తీయులకు ధాన్యం అమ్మాడు. ఐగుప్తు దేశంలో కరవు మరింత తీవ్రమైంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “భూమి అంతటా.” హీబ్రూ పదబద్ధంగా, “దేశం/భూమి ముఖమంతటా.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרָעָב
  choice: కరవు
  rationale: רָעָב ఇక్కడ వ్యక్తిగత ఆకలిని కాక, విస్తృతమైన ఆహార కొరతను సూచిస్తుంది; అందువల్ల ‘కరవు’ సందర్భానుకూలమైన సహజ తెలుగు పదం.
- source_word: עַל כָּל פְּנֵי הָאָרֶץ
  choice: దేశమంతటా
  rationale: పదబద్ధంగా ‘దేశం/భూమి ముఖమంతటా.’ ఈ సందర్భంలో సహజ తెలుగులో ‘దేశమంతటా’ అని ఇచ్చాం; הָאָרֶץ కు ఉన్న ‘భూమి’ అనే విస్తృత అర్థాన్ని పాదటిప్పణిలో నిలిపాం.
- source_word: וַיִּפְתַּח ... אֶת כָּל אֲשֶׁר בָּהֶם
  choice: ధాన్యం నిల్వచేసిన గిడ్డంగులన్నిటినీ తెరిపించి
  rationale: మసొరా పాఠం పదబద్ధంగా ‘వాటిలో ఉన్నదంతటినీ తెరిచాడు’ అని ఉన్నా, ‘వాటి’కి ప్రత్యక్ష పూర్వపదం లేదు. సందర్భం ధాన్య నిల్వలను ప్రజలకు తెరవడాన్ని సూచిస్తుంది. తెలుగులో అయోమయం రాకుండా భావాన్ని ప్రధాన పాఠంలో ఇచ్చి, మూలంలోని సంక్షిప్త నిర్మాణాన్ని పాదటిప్పణిలో తెలిపాం. యోసేపు స్వయంగా ప్రతి గిడ్డంగినీ తెరిచాడనే అనవసర భావం రాకుండా ‘తెరిపించి’ వాడాం.
- source_word: וַיִּשְׁבֹּר לְמִצְרַיִם
  choice: ఐగుప్తీయులకు ధాన్యం అమ్మాడు
  rationale: שׁבר అనే క్రియ ఈ సందర్భంలో ధాన్యం లేదా ఆహార పదార్థాలు అమ్మడాన్ని సూచిస్తుంది. לְמִצְרַיִם లోని ‘ఐగుప్తుకు’ అనే సమష్టి భావాన్ని సహజ తెలుగులో ‘ఐగుప్తీయులకు’ అని వ్యక్తం చేశాం.
- source_word: וַיֶּחֱזַק הָרָעָב
  choice: కరవు మరింత తీవ్రమైంది
  rationale: חזק పదబద్ధంగా ‘బలపడింది’; కరవు గురించి వాడినప్పుడు అది తీవ్రత పెరగడాన్ని సూచిస్తుంది.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: ఐగుప్తు దేశంలో
  rationale: ‘ఐగుప్తు దేశంలో’ అనే రూపం మూలంలోని אֶרֶץ ను ప్రతిబింబిస్తూ తెలుగు కథనశైలికి సరిపోతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కానీ సులభంగా అర్థమయ్యే కథనశైలిని వాడాం. వాక్యాన్ని సహజ తెలుగు ప్రవాహం కోసం మూడు భాగాలుగా విభజించాం. ‘గిడ్డంగులు’ సాధారణ పాఠకులకు ‘ధాన్యాగారాలు’ కంటే సులభమైన పదం; మూలంలో అంతర్లీనంగా ఉన్న ధాన్య నిల్వల భావాన్ని స్పష్టం చేశాం.
