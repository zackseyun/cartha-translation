source:
  edition: WLC
  text: וַ/יִּשְׁלַ֤ח פַּרְעֹה֙ וַ/יִּקְרָ֣א אֶת יוֹסֵ֔ף וַ/יְרִיצֻ֖/הוּ מִן הַ/בּ֑וֹר וַ/יְגַלַּח֙ וַ/יְחַלֵּ֣ף שִׂמְלֹתָ֔י/ו וַ/יָּבֹ֖א אֶל פַּרְעֹֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/014.yaml
  text: Then Pharaoh sent and called for Joseph[a], and they quickly brought him out of the pit. He shaved, changed his clothes[c][b], and came to Pharaoh.
translation:
  language: te
  text: అప్పుడు ఫరో యోసేపును పిలిపించడానికి పంపాడు. వారు అతణ్ణి గుంటలోనుండి[a] హడావిడిగా బయటికి తీసుకొచ్చారు. అతడు క్షౌరం చేసుకొని, తన బట్టలు మార్చుకొని, ఫరో దగ్గరికి వచ్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ అనువదించిన హీబ్రూ పదానికి అక్షరార్థం “గుంట”; అది నీటి తొట్టి వంటి గుంటనూ, ఖైదీలను ఉంచే గుంటనూ సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח ... וַיִּקְרָא אֶת־יוֹסֵף
  choice: యోసేపును పిలిపించడానికి మనుషులను పంపాడు
  rationale: రెండు హీబ్రూ క్రియలనూ ప్రతిబింబిస్తూ, ఫరో ఆజ్ఞతో దూతలు వెళ్లి యోసేపును రప్పించిన భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וַיְרִיצֻהוּ
  choice: వారు అతణ్ణి ... త్వరగా బయటికి తీసుకొచ్చారు
  rationale: కారణార్థక రూపంలో ఉన్న వేగం, అత్యవసరతను నిలుపుతుంది; అంతర్లీన కర్తలైన సేవకులను తెలుగులో స్పష్టంగా చూపుతుంది.
- source_word: מִן־הַבּוֹר
  choice: చెరగుంటలోనుండి
  rationale: בּוֹר అనే పదంలోని అక్షరార్థమైన 'గుంట' భావాన్నీ, ఈ సందర్భంలోని నిర్బంధ స్థల భావాన్నీ కలిపి నిలుపుతుంది.
- source_word: וַיְגַלַּח
  choice: అతడు గడ్డం చేసుకొని
  rationale: క్రియ క్రియాశీల రూపంలో ఉంది. రాజసన్నిధికి వెళ్లే ముందు చేసుకున్న శరీర శుభ్రతను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: וַיְחַלֵּף שִׂמְלֹתָיו
  choice: బట్టలు మార్చుకొని
  rationale: తన వస్త్రాలను మార్చుకున్నాడనే భావానికి సరళమైన, ప్రస్తుత వాడుకలోని తెలుగు.
- source_word: וַיָּבֹא אֶל־פַּרְעֹה
  choice: ఫరో దగ్గరికి వచ్చాడు
  rationale: హీబ్రూలోని 'ఫరో వద్దకు వచ్చాడు' అనే సరళ భావాన్ని అతిగా రాజసభా పరిభాషలోకి మార్చకుండా నిలుపుతుంది.
