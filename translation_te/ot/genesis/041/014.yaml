translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన కథనశైలి. హీబ్రూ క్రియల క్రమాన్ని సాధ్యమైనంత వరకు నిలుపుతూ సహజమైన తెలుగు వాక్య నిర్మాణాన్ని ఉపయోగించాం.
