  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వచనం. ‘అబ్రేక్’ అనే అస్పష్ట పదాన్ని ప్రధాన పాఠ్యంలో లిప్యంతరీకరించి మూలంలోని అనిశ్చితిని కాపాడాం; పాదసూచిక గుర్తు [a] ప్రధాన పాఠ్యంలో పొందుపరచబడింది.
