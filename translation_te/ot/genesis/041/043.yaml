revisions:
- from: ఫరో తనకున్న రెండవ రథంలో యోసేపును ఎక్కించి ఊరేగించాడు. అతని ముందు వెళ్తున్నవారు, “అబ్రేక్!”[a] అని కేకలు వేశారు. ఈ విధంగా ఫరో అతన్ని ఐగుప్తు దేశమంతటి మీద నియమించాడు.
  to: ఫరో యోసేపును తనకున్న రెండవ రథంలో ఎక్కించాడు. వారు అతని ముందు, “అబ్రేక్!”[a] అని కేకలు వేశారు. ఇలా అతన్ని ఐగుప్తు దేశమంతటిపై అధిపతిగా నియమించాడు.
  rationale: The revision removes interpretive additions (“ఊరేగించాడు” and “ముందు వెళ్తున్నవారు”), retains the causative force of the Hebrew, and renders Joseph’s authority in idiomatic Telugu. The uncertain acclamation remains transliterated in the text, and its possible interpretation remains confined to the footnote.
