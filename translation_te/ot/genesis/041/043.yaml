  text: וַ/יַּרְכֵּ֣ב אֹת֗/וֹ בְּ/מִרְכֶּ֤בֶת הַ/מִּשְׁנֶה֙ אֲשֶׁר ל֔/וֹ וַ/יִּקְרְא֥וּ לְ/פָנָ֖י/ו אַבְרֵ֑ךְ וְ/נָת֣וֹן אֹת֔/וֹ עַ֖ל כָּל אֶ֥רֶץ מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/043.yaml
  text: He had him ride in the second chariot that he had[a], and they cried out before him, “Abrek!” And he set him over all the land of Egypt.
translation:
  language: te
  text: ఫరో యోసేపును తనకున్న రెండవ రథంలో ఎక్కించాడు. వారు అతని ముందు, “అబ్రేక్!”[a] అని కేకలు వేశారు. ఇలా అతన్ని ఐగుప్తు దేశమంతటిపై అధిపతిగా నియమించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “అబ్రేక్” అనేది ఖచ్చితమైన అర్థం తెలియని పదం. ఇది ఐగుప్తీయ లేదా హీబ్రూ గౌరవ ప్రకటన కావచ్చు. చాలామంది దీన్ని “మోకాళ్లు వంచండి!” అనే భావంలో అర్థం చేసుకుంటారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְכֵּב
  choice: ఎక్కించి ఊరేగించాడు
  rationale: హిఫిల్ రూపంలోని కారణార్థాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; సందర్భంలో రథంపై ఎక్కించి ప్రజల మధ్య తీసుకెళ్లడం ఉద్దేశం.
- source_word: בְּמִרְכֶּבֶת הַמִּשְׁנֶה אֲשֶׁר־לוֹ
  choice: తనకున్న రెండవ రథంలో
  rationale: మִשְׁנֶה అనే పదంలోని ‘రెండవది/తర్వాతి హోదా’ భావాన్ని, అలాగే אֲשֶׁר־לוֹ సంబంధవాక్యాన్ని నిలుపుతుంది. ఇది ఫరో రథం తర్వాతి స్థాయి రథాన్ని సూచించే అవకాశముంది.
- source_word: וַיִּקְרְאוּ לְפָנָיו
  choice: అతని ముందు వెళ్తున్నవారు ... అని కేకలు వేశారు
  rationale: యోసేపు ఊరేగింపునకు ముందుగా సాగుతూ బహిరంగంగా చాటించిన దృశ్యాన్ని సహజంగా తెలియజేస్తుంది; బహువచన కర్తను తెలుగులో స్పష్టం చేస్తుంది.
- source_word: אַבְרֵךְ
  choice: అబ్రేక్
  rationale: పదార్థం అనిశ్చితమైనందున ఊహాత్మక అనువాదాన్ని ప్రధాన పాఠ్యంలో పెట్టకుండా లిప్యంతరీకరించి, సాధ్యమైన అర్థాన్ని పాదసూచికలో ఇస్తుంది.
- source_word: וְנָתוֹן אֹתוֹ
  choice: ఈ విధంగా ఫరో అతన్ని ... నియమించాడు
  rationale: నిరపేక్ష క్రియారూపం కలిగిన అసాధారణ నిర్మాణాన్ని సందర్భానుసార ఫలితంగా తెలుగులో అందిస్తుంది. కర్తను స్పష్టత కోసం ‘ఫరో’ అని పునరుక్తి చేసింది.
- source_word: עַל כָּל אֶרֶץ מִצְרָיִם
  choice: ఐగుప్తు దేశమంతటి మీద
  rationale: עַל లోని అధికార భావాన్ని ‘మీద’తోను, אֶרֶץ లోని భూభాగ భావాన్ని ‘దేశం’తోను నిలుపుతుంది.
