  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. הִנְנִי యొక్క దృశ్యసజీవత కోసం ‘ఇదిగో’ను, కలవివరణలోని హీబ్రూ సజీవ వర్తమానాన్ని కాపాడటానికి ‘నిలబడి ఉన్నాను’ను ఉపయోగించాం.
