source:
  edition: WLC
  text: וַ/יְדַבֵּ֥ר פַּרְעֹ֖ה אֶל יוֹסֵ֑ף בַּ/חֲלֹמִ֕/י הִנְ/נִ֥י עֹמֵ֖ד עַל שְׂפַ֥ת הַ/יְאֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/017.yaml
  text: Then Pharaoh said to Joseph[a], “In my dream, behold, I was standing on the bank of the Nile.”
translation:
  language: te
  text: అప్పుడు ఫరో యోసేపుతో, “నా కలలో, ఇదిగో, నేను నది[a] ఒడ్డున నిలబడి ఉన్నాను” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ‘నది.’ ఆదికాండంలోని ఈజిప్టు సందర్భంలో ఈ పదం సాధారణంగా నైలు నదిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: అన్నాడు
  rationale: ప్రత్యక్ష సంభాషణను పరిచయం చేసే ఈ క్రియకు ఆధునిక తెలుగు కథనంలో ‘అన్నాడు’ సహజమైన సమానం.
- source_word: פַּרְעֹה
  choice: ఫరో
  rationale: ఈజిప్టు రాజబిరుదుకు తెలుగులో స్థిరపడిన రూపం.
- source_word: אֶל יוֹסֵף
  choice: యోసేపుతో
  rationale: మాటకు సంబోధితుడిని తెలుగులో సహజంగా సూచిస్తుంది; అర్థపరంగా ‘యోసేపుతో అన్నాడు’.
- source_word: בַּחֲלֹמִי
  choice: నా కలలో
  rationale: ఉపసర్గతో కూడిన ప్రథమ పురుష ఏకవచన ప్రత్యయాన్ని నేరుగా, సహజంగా అందిస్తుంది.
- source_word: הִנְנִי
  choice: ఇదిగో, నేను
  rationale: కలలోని దృశ్యాన్ని సజీవంగా చూపించే హీబ్రూ సూచనాత్మక పదం యొక్క బలాన్ని నిలుపుతుంది.
- source_word: עֹמֵד
  choice: నిలబడి ఉన్నాను
  rationale: వర్తమాన కృదంతపు కొనసాగుతున్న స్థితిని ప్రతిబింబిస్తుంది; హీబ్రూ కలవివరణలోని సజీవ వర్తమానాన్ని తెలుగులో నిలుపుతుంది.
- source_word: עַל שְׂפַת
  choice: ఒడ్డున
  rationale: అక్షరార్థంగా ‘అంచు/పెదవి మీద’; నది సందర్భంలో ‘ఒడ్డున’ సహజమైన భౌగోళిక సమానం.
- source_word: הַיְאֹר
  choice: నది
  rationale: మూలపదం రూపపరంగా ‘నది’ అని సూచిస్తుంది; ఈజిప్టు సందర్భంలో అది నైలు నదిని సూచిస్తుందనే విషయాన్ని పాదటిప్పణిలో స్పష్టం చేసి మూలంలోని పదప్రయోగాన్ని కాపాడింది.
