translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని వాడాం. యోసేపు ఇచ్చిన పరిపాలనా సలహా తెలుగులో సహజంగా వినిపించేందుకు వరుస క్రియలను అనుసంధానించాం; మూలంలోని חמשׁ క్రియకు ఉన్న భావసంభావ్యతను పాదసూచికలో భద్రపరిచాం.
