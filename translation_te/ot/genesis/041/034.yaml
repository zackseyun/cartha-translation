source:
  edition: WLC
  text: יַעֲשֶׂ֣ה פַרְעֹ֔ה וְ/יַפְקֵ֥ד פְּקִדִ֖ים עַל הָ/אָ֑רֶץ וְ/חִמֵּשׁ֙ אֶת אֶ֣רֶץ מִצְרַ֔יִם בְּ/שֶׁ֖בַע שְׁנֵ֥י הַ/שָּׂבָֽע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/034.yaml
  text: 'Let Pharaoh do this: let him appoint overseers over the land and take a fifth of the produce of the land of Egypt during the seven years of abundance[a].'
translation:
  language: te
  text: 'ఫరో ఇలా చేయాలి: దేశమంతటా పర్యవేక్షకులను నియమించి, సమృద్ధిగా పండే ఆ ఏడు సంవత్సరాల్లో ఐగుప్తు దేశపు పంటలో ఐదవ వంతును సేకరించాలి.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘సమృద్ధి గల సంవత్సరాల్లో ఐగుప్తు దేశం నుండి ఐదవ వంతును వసూలు చేయాలి.’ హీబ్రూ క్రియను ఐదవ భాగాన్ని విధించడం లేదా తీసుకోవడం అనే అర్థంలో గ్రహించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעֲשֶׂה
  choice: ఫరో ఇలా చేయాలి
  rationale: עָשָׂה అనే విస్తృతార్థక క్రియ ఇక్కడ యోసేపు ఇస్తున్న సలహాను సూచిస్తుంది. తెలుగులో ‘ఇలా చేయాలి’ సహజంగా ఉండి, సందర్భంలో అంతర్భూతమైన కర్మను స్పష్టం చేస్తుంది.
- source_word: וְיַפְקֵד
  choice: నియమించి
  rationale: פקד హిఫీల్ రూపం బాధ్యతగల వ్యక్తులను నియమించడాన్ని సూచిస్తుంది; పరిపాలనా సందర్భానికి ‘నియమించి’ సరిపోతుంది.
- source_word: פְּקִדִים
  choice: పర్యవేక్షకులను
  rationale: ఈ నామవాచకం నియమించబడిన అధికారులను సూచిస్తుంది. వారి పర్యవేక్షణ బాధ్యతను ఆధునిక తెలుగులో స్పష్టంగా తెలియజేయడానికి ఈ పదాన్ని ఎంచుకున్నాం.
- source_word: עַל הָאָרֶץ
  choice: దేశమంతటా
  rationale: ఇక్కడ אֶרֶץ భూమండలాన్ని కాక ఫరో పాలనలోని దేశాన్ని సూచిస్తుంది. עַל యొక్క పరిపాలనా పరిధిని తెలుగులో సహజంగా ‘దేశమంతటా’ వ్యక్తం చేస్తుంది.
- source_word: וְחִמֵּשׁ
  choice: ఐదవ వంతును సేకరించాలి
  rationale: חמשׁ పియేల్ రూపం ఈ సందర్భంలో ఐదవ భాగాన్ని విధించడం లేదా తీసుకోవడం అనే భావాన్ని కలిగిస్తుంది. ‘సేకరించాలి’ ధాన్యనిల్వ సందర్భానికి సహజం; క్రియలోని సాధ్యమైన పన్ను/వసూలు భావాన్ని పాదసూచికలో నిలిపాం.
- source_word: אֶת אֶרֶץ מִצְרַיִם
  choice: ఐగుప్తు దేశపు పంటలో
  rationale: హీబ్రూలో ప్రత్యక్ష కర్మగా ‘ఐగుప్తు దేశం’ ఉన్నా, సందర్భం ప్రకారం దేశపు దిగుబడిలో ఐదవ వంతు ఉద్దేశించబడింది. భూమినే విభజిస్తున్నట్లు అపార్థం కాకుండా ‘పంటలో’ చేర్చాం.
- source_word: בְּשֶׁבַע שְׁנֵי הַשָּׂבָע
  choice: సమృద్ధిగా పండే ఆ ఏడు సంవత్సరాల్లో
  rationale: שָׂבָע సంపూర్ణత లేదా సమృద్ధిని సూచిస్తుంది; ఈ కథనంలో అది విస్తారమైన పంట దిగుబడి గల సంవత్సరాలను సూచిస్తున్నందున ఈ సహజమైన తెలుగు రూపాన్ని వాడాం.
