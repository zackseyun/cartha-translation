  yaml_path: translation/ot/genesis/041/001.yaml
  text: At the end of two full years[a], Pharaoh dreamed, and behold[b], he was standing by the Nile.
translation:
  language: te
  text: రెండు పూర్తి సంవత్సరాలు గడిచిన తరువాత[a], ఫరో కల కంటున్నాడు; ఇదిగో, అతడు నైలు నది ఒడ్డున నిలబడి ఉన్నాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘రెండు సంవత్సరాల దినాలు’; ఇది సంపూర్ణమైన రెండేళ్ల కాలాన్ని సూచించే హీబ్రూ నుడికారం.
    reason: lexical_alternative
  - marker: b
    text: ‘నది’ అని కూడా అనువదించవచ్చు; ఈజిప్టు సందర్భంలో ఇది నైలు నదిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי מִקֵּץ
  choice: గడిచిన తరువాత
  rationale: కథనాన్ని ముందుకు నడిపించే וַיְהִיతో కూడిన מִקֵּץ, ఆ కాలవ్యవధి ముగిసినప్పుడు జరిగిన కొత్త పరిణామాన్ని సూచిస్తుంది. తెలుగులో ‘గడిచిన తరువాత’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: שְׁנָתַיִם יָמִים
  choice: రెండు పూర్తి సంవత్సరాలు
  rationale: అక్షరార్థంగా ‘రెండు సంవత్సరాల దినాలు’ అనే హీబ్రూ ప్రయోగం సంపూర్ణమైన రెండేళ్ల కాలాన్ని నొక్కిచెబుతుంది.
- source_word: פַרְעֹה
  choice: ఫరో
  rationale: ఈజిప్టు రాజ బిరుదుకు తెలుగులో స్థిరపడిన రూపం.
- source_word: חֹלֵם
  choice: ఒక కల వచ్చింది
  rationale: వర్తమాన కృదంతం కల జరుగుతున్న దృశ్యాన్ని చూపుతుంది; అయితే కథన తెలుగులో ‘ఫరోకు ఒక కల వచ్చింది’ సహజంగా ఉండి భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: కలలో ప్రత్యక్షమయ్యే దృశ్యంపై పాఠకుని దృష్టిని హఠాత్తుగా కేంద్రీకరించే సూచనను నిలుపుతుంది.
- source_word: עֹמֵד
  choice: నిలబడి ఉన్నాడు
  rationale: కృదంత రూపంలోని కొనసాగుతున్న దృశ్యభావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: עַל הַיְאֹר
  choice: నైలు నది ఒడ్డున
  rationale: ఈజిప్టు సందర్భంలో יְאֹר నైలు నదినే సూచిస్తుంది; עַל ఇక్కడ నది పక్కన లేదా ఒడ్డున ఉన్న స్థానాన్ని తెలియజేస్తుంది.
