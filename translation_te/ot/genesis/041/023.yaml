source:
  edition: WLC
  text: וְ/הִנֵּה֙ שֶׁ֣בַע שִׁבֳּלִ֔ים צְנֻמ֥וֹת דַּקּ֖וֹת שְׁדֻפ֣וֹת קָדִ֑ים צֹמְח֖וֹת אַחֲרֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/023.yaml
  text: And behold[a], seven ears, thin and scorched by the east wind[b], were sprouting after them.
translation:
  language: te
  text: ఇదిగో, వాడిపోయిన, సన్నని, తూర్పుగాలికి మాడిపోయిన ఏడు ధాన్యపు కంకులు వాటి తర్వాత మొలుస్తున్నాయి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִנֵּה
  choice: అప్పుడు ఇదిగో
  rationale: కలలో కొత్త దృశ్యం ప్రత్యక్షమైన భావాన్ని, కథనంలోని ఉత్కంఠను నిలుపుతుంది.
- source_word: שִׁבֳּלִים
  choice: ధాన్యపు కంకులు
  rationale: ఇది ధాన్యపు మొక్కల కంకులను సూచిస్తుంది; సాధారణ ఆధునిక తెలుగు పాఠకులకు స్పష్టంగా ఉంటుంది.
- source_word: צְנֻמוֹת
  choice: వాడిపోయి
  rationale: చిక్కిపోయిన లేదా శుష్కించిన స్థితిని తెలియజేసి, తరువాతి דַּקּוֹת అనే వేరొక విశేషణం అర్థాన్ని మింగివేయకుండా కాపాడుతుంది.
- source_word: דַּקּוֹת
  choice: సన్నగా ఉండి
  rationale: కంకుల పలుచని, బలహీనమైన రూపాన్ని నేరుగా తెలియజేస్తుంది.
- source_word: שְׁדֻפוֹת קָדִים
  choice: తూర్పుగాలికి మాడిపోయిన
  rationale: వేడి తూర్పుగాలి వల్ల ధాన్యం దెబ్బతిన్న భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: צֹמְחוֹת
  choice: మొలుస్తున్నాయి
  rationale: హీబ్రూ వర్తమాన కృదంతంలోని కొనసాగుతున్న దృశ్యాత్మక చర్యను నిలుపుతుంది.
- source_word: אַחֲרֵיהֶם
  choice: వాటి తర్వాత
  rationale: ముందు వచ్చిన మంచి కంకుల తరువాత ఇవి వచ్చిన క్రమాన్ని సహజంగా సూచిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, కలను మళ్లీ వివరిస్తున్న సజీవ కథనశైలిని నిలిపాం. צְנֻמוֹת మరియు דַּקּוֹת అనే రెండు వేర్వేరు విశేషణాలను వరుసగా ‘వాడిపోయి’ మరియు ‘సన్నగా ఉండి’ అని అనువదించి మూలంలోని గుణవర్ణనల సముచ్చయాన్ని కాపాడాం.
