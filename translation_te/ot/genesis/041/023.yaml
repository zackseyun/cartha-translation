- from: అప్పుడు ఇదిగో, వాడిపోయి, సన్నగా ఉండి, తూర్పుగాలికి మాడిపోయిన ఏడు ధాన్యపు కంకులు వాటి తర్వాత మొలుస్తున్నాయి.
  to: ఇదిగో, వాడిపోయిన, సన్నని, తూర్పుగాలికి మాడిపోయిన ఏడు ధాన్యపు కంకులు వాటి తర్వాత మొలుస్తున్నాయి.
