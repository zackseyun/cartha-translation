  text: וְ/הִנֵּה֙ שֶׁ֣בַע שִׁבֳּלִ֔ים דַּקּ֖וֹת וּ/שְׁדוּפֹ֣ת קָדִ֑ים צֹמְח֖וֹת אַחֲרֵי/הֶֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/006.yaml
  text: And behold[a], seven thin ears of grain, scorched by the east wind, were sprouting up after them.
translation:
  language: te
  text: ఇదిగో, తూర్పుగాలికి మాడిపోయిన[a] ఏడు సన్నని ధాన్యపు వెన్నులు వాటి తరువాత మొలుస్తూ వచ్చాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తూర్పుగాలికి వాడిపోయిన.”
    reason: హీబ్రూ పదం వేడి గాలివల్ల మాడిపోవడం లేదా వాడిపోవడం అనే సమీప భావాలను కలిగి ఉండగలదు.
lexical_decisions:
- source_word: וְהִנֵּה
  choice: అప్పుడు ఇదిగో
  rationale: కలలో అకస్మాత్తుగా కనిపించిన కొత్త దృశ్యాన్ని సజీవంగా పరిచయం చేసే కథన సూచికను నిలుపుతుంది.
- source_word: שֶׁבַע
  choice: ఏడు
  rationale: మూలంలోని సంఖ్యకు నేరమైన, సహజమైన అనువాదం.
- source_word: שִׁבֳּלִים
  choice: ధాన్యపు వెన్నులు
  rationale: మొత్తం కాండాలను కాకుండా ధాన్యపు గింజలు ఉండే వెన్నులను సూచిస్తుంది.
- source_word: דַּקּוֹת
  choice: సన్నని
  rationale: పుష్టిలేక పలుచగా ఉన్న ధాన్యపు వెన్నుల రూపాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: וּשְׁדוּפֹת קָדִים
  choice: తూర్పుగాలికి మాడిపోయిన
  rationale: వేడి, హానికరమైన తూర్పుగాలి వల్ల వెన్నులు దెబ్బతిని ఎండిపోయిన భావాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: צֹמְחוֹת
  choice: మొలుస్తున్నాయి
  rationale: కలలో కొనసాగుతున్న చర్యను చూపే హీబ్రూ కృదంత రూపంలోని దృశ్య సజీవతను నిలుపుతుంది.
- source_word: אַחֲרֵיהֶן
  choice: వాటి తరువాత
  rationale: మునుపటి వచనంలోని ఏడు మంచి వెన్నుల తరువాత ఇవి వచ్చిన క్రమాన్ని తెలియజేస్తుంది; మూలంలోని కాలిక లేదా స్థానిక సంబంధాన్ని అతిగా నిర్ధారించదు.
