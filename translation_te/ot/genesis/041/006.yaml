  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. “ఇదిగో” ద్వారా మూలంలోని ఆకస్మిక దృశ్య సూచనను, “మొలుస్తున్నాయి” ద్వారా కొనసాగుతున్న దృశ్యాన్ని నిలిపాం.
