  text: וַ/תֹּאכַ֨לְנָה֙ הַ/פָּר֔וֹת הָ/רַקּ֖וֹת וְ/הָ/רָע֑וֹת אֵ֣ת שֶׁ֧בַע הַ/פָּר֛וֹת הָ/רִאשֹׁנ֖וֹת הַ/בְּרִיאֹֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/020.yaml
  text: And the thin and ugly cows ate up the first seven healthy cows[a].
translation:
  language: te
  text: అప్పుడు సన్నగా, చూడటానికి బాగాలేని ఆవులు మొదటి ఏడు బలిసిన ఆవులను తినివేశాయి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘చిక్కిపోయి, చూడటానికి బాగాలేని ఆవులు ... మొదటి ఏడు కొవ్విన ఆవులను.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאכַלְנָה
  choice: తినివేశాయి
  rationale: אכל అనే క్రియకు ‘తిన్నాయి’ అని అర్థం; కలలో ఆ ఆవులను పూర్తిగా తినేయడాన్ని సహజమైన ఆధునిక తెలుగులో ‘తినివేశాయి’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: הַפָּרוֹת
  choice: ఆవులు
  rationale: మూలంలోని స్త్రీలింగ బహువచనం ఆడ పశువులను ప్రత్యేకంగా సూచిస్తుంది; అందువల్ల విస్తృతార్థకమైన ‘పశువులు’ కంటే ‘ఆవులు’ ఖచ్చితం.
- source_word: הָרַקּוֹת
  choice: సన్నగా
  rationale: ఈ విశేషణం కృశించిన శరీరాకృతిని సూచిస్తుంది; ‘సన్నగా’ సాధారణ ఆధునిక తెలుగులో సహజంగా ఉంటుంది.
- source_word: וְהָרָעוֹת
  choice: వికారంగా
  rationale: ఇక్కడ רעות నైతిక చెడును కాక, చూడటానికి బాగాలేని రూపాన్ని సూచిస్తుంది; ‘వికారంగా’ ఆ దృశ్యార్థాన్ని తెలియజేస్తుంది.
- source_word: אֵת שֶׁבַע הַפָּרוֹת
  choice: ఏడు ఆవులను
  rationale: ప్రత్యక్ష కర్మ సూచికతో కూడిన సంఖ్యా-నామ పదబంధాన్ని తెలుగులో సహజంగా ‘ఏడు ఆవులను’ అని అనువదించాం.
- source_word: הָרִאשֹׁנוֹת
  choice: మొదట వచ్చిన
  rationale: కలలో ముందుగా కనిపించిన ఆవుల సమూహాన్ని సూచిస్తున్నందున, కేవలం ‘మొదటి’ కంటే ‘మొదట వచ్చిన’ సందర్భాన్ని స్పష్టంగా తెలుపుతుంది.
- source_word: הַבְּרִיאֹת
  choice: బలిసిన
  rationale: ఈ సందర్భంలో పదం దృఢంగా, మంచి పోషణతో ఉన్న శరీరస్థితిని సూచిస్తుంది; సన్నని ఆవులకు వ్యతిరేకంగా ‘బలిసిన’ సహజమైన ఎంపిక. ‘ఆరోగ్యంగా ఉన్న’ అనేదీ సాధ్యమే.
