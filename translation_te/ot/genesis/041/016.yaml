  yaml_path: translation/ot/genesis/041/016.yaml
  text: Joseph answered Pharaoh[a], saying, “It is not in me[b]; God will answer for Pharaoh’s well-being.”
translation:
  language: te
  text: 'యోసేపు ఫరోకు ఇలా జవాబిచ్చాడు: “అది నా వల్ల కాదు; దేవుడే ఫరోకు క్షేమకరమైన జవాబు ఇస్తాడు[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “దేవుడు ఫరో క్షేమానికి సంబంధించిన జవాబు ఇస్తాడు.” ఇక్కడ “క్షేమం” అనే పదం మేలు లేదా అనుకూల ఫలితం అనే భావాన్నీ కలిగి ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן יוֹסֵף אֶת־פַּרְעֹה לֵאמֹר
  choice: యోసేపు ఫరోకు ఇలా జవాబిచ్చాడు
  rationale: హీబ్రూ కథనంలోని జవాబిచ్చి-మాట్లాడే సూత్రాన్ని సహజమైన ఆధునిక తెలుగులో సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: בִּלְעָדָי
  choice: అది నా వల్ల కాదు
  rationale: జవాబు లేదా వివరణ తన సామర్థ్యం నుంచి రాదని యోసేపు నిరాకరిస్తున్న భావాన్ని సహజంగా తెలియజేస్తుంది; ‘నేను కాదు’ అనే ప్రత్యామ్నాయ భావాన్నీ సందర్భానుసారంగా కలిగి ఉంటుంది.
- source_word: אֱלֹהִים
  choice: దేవుడు
  rationale: ఏకవచన క్రియతో ఉన్నందున ఇక్కడ ఏకవచనంగా అనువదించడం సముచితం.
- source_word: יַעֲנֶה
  choice: జవాబు ఇస్తాడు
  rationale: కల యొక్క అర్థాన్ని తెలియజేసే సందర్భంలో ‘జవాబు ఇస్తాడు’ సహజంగా ఉండి, దేవుడే సమాధానానికి మూలమని స్పష్టం చేస్తుంది.
- source_word: אֶת־שְׁלוֹם פַּרְעֹה
  choice: ఫరోకు క్షేమకరమైన జవాబు
  rationale: שָׁלוֹם పదంలోని క్షేమం, మేలు, అనుకూల ఫలితం అనే విస్తృత భావాన్ని తెలుగులో సంక్షిప్తంగా అందిస్తుంది; ఖచ్చితమైన హీబ్రూ నిర్మాణంలోని అస్పష్టతను పాదటిప్పణిలో ఉంచుతుంది.
theological_decisions:
- issue: కల వివరణకు మూలం ఎవరు?
  choice: యోసేపు అది తన వల్ల కాదని చెప్పి, జవాబును దేవునికే ఆపాదిస్తున్నాడు.
  alternative: ‘నేను కాదు; దేవుడు ఫరోకు క్షేమానికి సంబంధించిన జవాబు ఇస్తాడు’ అని మరింత అక్షరార్థంగా అనువదించవచ్చు.
  rationale: בִּלְעָדָי మరియు אֱלֹהִים יַעֲנֶה మధ్య ఉన్న వ్యత్యాసాన్ని నిలుపుతూ, అదనపు సిద్ధాంత వివరణను చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. ‘క్షేమకరమైన’ అనే పదం మూలంలోని שָׁלוֹם భావవిస్తృతిని నిలుపుతుంది.
