source:
  edition: WLC
  text: וַ/יְהִ֤י בַ/בֹּ֨קֶר֙ וַ/תִּפָּ֣עֶם רוּח֔/וֹ וַ/יִּשְׁלַ֗ח וַ/יִּקְרָ֛א אֶת כָּל חַרְטֻמֵּ֥י מִצְרַ֖יִם וְ/אֶת כָּל חֲכָמֶ֑י/הָ וַ/יְסַפֵּ֨ר פַּרְעֹ֤ה לָ/הֶם֙ אֶת חֲלֹמ֔/וֹ וְ/אֵין פּוֹתֵ֥ר אוֹתָ֖/ם לְ/פַרְעֹֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/008.yaml
  text: In the morning[a], his spirit was troubled, so he sent and called all the magicians of Egypt and all its wise men. Pharaoh told them his dreams, but there was no one who could interpret them for Pharaoh.
translation:
  language: te
  text: ఉదయం కాగానే అతని మనస్సు కలవరపడింది. అందువల్ల అతడు మనుషులను పంపి ఐగుప్తులోని మాంత్రికులందరినీ, జ్ఞానులందరినీ పిలిపించాడు. ఫరో తన కలను వారికి వివరించాడు; కానీ ఫరోకు వాటిని[a] అర్థం చెప్పగలవాడు ఎవ్వరూ లేరు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ముందు ఉన్న ‘తన కల’ అనే నామవాచకం ఏకవచనంలో ఉంది; అయితే ఇక్కడ దానిని సూచించే సర్వనామం బహువచనంలో (‘వాటిని’) ఉంది. అది కలలోని వేర్వేరు భాగాలను సూచించి ఉండవచ్చు. కొన్ని అనువాదాలు దీనిని ‘దానిని’ అని ఏకవచనంగా సరళీకరిస్తాయి.
    reason: మూలపాఠంలోని ఏకవచన నామవాచకం–బహువచన సర్వనామం మధ్య ఉన్న నిజమైన వ్యాకరణ ఉద్రిక్తతను తెలియజేయడం.
lexical_decisions:
- source_word: וַיְהִי בַבֹּקֶר
  choice: ఉదయం కాగానే
  rationale: హీబ్రూ కథనంలోని కాలక్రమాన్ని సహజమైన ఆధునిక తెలుగు కాలవాచక ఉపవాక్యంతో వ్యక్తపరుస్తుంది.
- source_word: וַתִּפָּעֶם רוּחוֹ
  choice: అతని మనస్సు కలవరపడింది
  rationale: רוּחַ అక్షరార్థంగా ‘ఆత్మ/శ్వాస’ అయినప్పటికీ, ఇక్కడ פעמతో కలిసి అంతర్గత మానసిక ఆందోళనను సూచిస్తుంది; ‘మనస్సు కలవరపడింది’ సాధారణ తెలుగు పాఠకునికి సహజంగా అదే భావాన్ని అందిస్తుంది.
- source_word: וַיִּשְׁלַח וַיִּקְרָא
  choice: పిలిపించాడు
  rationale: రాజు మనుషులను పంపి వారిని రప్పించాడనే రెండు హీబ్రూ క్రియల సందర్భార్థాన్ని సంక్షిప్తమైన సహజ తెలుగు ప్రయోగం వ్యక్తపరుస్తుంది.
- source_word: חַרְטֻמֵּי מִצְרַיִם
  choice: ఐగుప్తులోని మాంత్రికులు
  rationale: ఈజిప్టు రాజసభలో రహస్య విద్యలు, కలల వ్యాఖ్యానంతో సంబంధమున్న ప్రత్యేక నిపుణులను సూచించే పదానికి ‘మాంత్రికులు’ స్పష్టమైన ఆధునిక సమానార్థకం.
- source_word: כָּל חֲכָמֶיהָ
  choice: జ్ఞానులందరూ
  rationale: ఈజిప్టుకు చెందిన రాజసభా జ్ఞానులను సూచిస్తుంది; మాంత్రికులకంటే విస్తృతమైన వర్గంగా తేడాను నిలుపుతుంది.
- source_word: וַיְסַפֵּר פַּרְעֹה לָהֶם אֶת חֲלֹמוֹ
  choice: ఫరో తన కలను వారికి వివరించాడు
  rationale: మసొరెటిక్ పాఠంలోని ఏకవచన ‘తన కలను’ నిలుపుతూ, ספר యొక్క కలను వర్ణించడం/వివరించడం అనే సందర్భార్థాన్ని సహజంగా తెలుపుతుంది.
- source_word: וְאֵין פֹּתֵר אֹתָם לְפַרְעֹה
  choice: కానీ వాటిని ఫరోకు అర్థం చెప్పగలవాడు ఎవ్వరూ లేరు
  rationale: פתר యొక్క కలకు అర్థం చెప్పడం అనే భావాన్ని అందిస్తూ, ముందు ‘కల’ ఏకవచనంగా ఉన్నప్పటికీ మూలంలోని బహువచన కర్మ సర్వనామాన్ని ‘వాటిని’గా ఉద్దేశపూర్వకంగా నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కథన శైలి. ‘ఐగుప్తు’ అనే సాంప్రదాయ తెలుగు బైబిలు స్థలనామాన్ని ఉంచి, పాతకాలపు క్రియారూపాలను నివారించాం. మూలంలోని ఏకవచన ‘కల’ మరియు బహువచన ‘వాటిని’ మధ్య భేదాన్ని పాఠ్యంలోనూ పాదటిప్పణిలోనూ నిలిపాం.
