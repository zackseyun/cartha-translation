language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/תֹּאכַ֣לְנָה הַ/פָּר֗וֹת רָע֤וֹת הַ/מַּרְאֶה֙ וְ/דַקֹּ֣ת הַ/בָּשָׂ֔ר אֵ֚ת שֶׁ֣בַע הַ/פָּר֔וֹת יְפֹ֥ת הַ/מַּרְאֶ֖ה וְ/הַ/בְּרִיאֹ֑ת וַ/יִּיקַ֖ץ פַּרְעֹֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/004.yaml
  text: Then the cows ugly in appearance and thin in flesh ate the seven cows beautiful in appearance and fat[a], and Pharaoh awoke.
translation:
  language: te
  text: చూడటానికి వికారంగా, ఒళ్లు చిక్కిపోయిన ఆవులు చూడటానికి అందంగా, బలిసిన ఆ ఏడు ఆవులను తిన్నాయి.[a] ఫరో మేల్కొన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘చూడటానికి చెడ్డగా ... ఆరోగ్యంగా ఉన్న’; హీబ్రూ పదాలకు అక్షరార్థంగా ‘చెడ్డ’ మరియు ‘ఆరోగ్యంగా/బొద్దుగా’ అనే భావాలు రావచ్చు. అయితే ఈ సందర్భంలో వికారంగా, చిక్కిపోయిన ఆవులకు అందంగా, బలిసిన ఆవులకు మధ్య ఉన్న శారీరక వ్యత్యాసమే ప్రధానంగా కనిపిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאכַלְנָה
  choice: తినేశాయి
  rationale: אכל యొక్క సాధారణ అర్థం ‘తినడం’. తెలుగు కథనంలో సంఘటన పూర్తయిన భావాన్ని సహజంగా తెలియజేయడానికి ‘తినేశాయి’ అని అనువదించాం; ‘మింగివేశాయి’ మూలపదం కంటే బలమైనది.
- source_word: הַפָּרוֹת
  choice: ఆవులు
  rationale: פָּרוֹת అనేది ‘ఆవు’ అనే పదానికి స్త్రీలింగ బహువచనం; విస్తృతార్థకమైన ‘పశువులు’ కంటే ‘ఆవులు’ నిర్దిష్టంగా ఉంది.
- source_word: רָעוֹת הַמַּרְאֶה
  choice: చూడటానికి వికారంగా
  rationale: రָעוֹת అక్షరార్థంగా ‘చెడ్డ’ అని అర్థమివ్వగలిగినా, מַרְאֶהతో కలిసి ఇక్కడ ఆకర్షణలేని రూపాన్ని సూచిస్తుంది. ‘చూడటానికి వికారంగా’ ఆధునిక తెలుగులో సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: וְדַקֹּת הַבָּשָׂר
  choice: ఒళ్లు చిక్కిపోయి
  rationale: దీనికి అక్షరార్థం ‘మాంసంలో సన్నగా’. ఆవుల క్షీణించిన శరీరస్థితిని సహజమైన ఆధునిక తెలుగులో ‘ఒళ్లు చిక్కిపోయి’ స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: אֵת שֶׁבַע הַפָּרוֹת
  choice: ఆ ఏడు ఆవులను
  rationale: నిర్దిష్ట కర్మను సూచించే నిర్మాణాన్ని తెలుగులో ‘ఆ ఏడు ఆవులను’ అని సహజంగా అందించాం.
- source_word: יְפֹת הַמַּרְאֶה
  choice: చూడటానికి అందంగా
  rationale: ఈ పదబంధం ‘చూడటానికి వికారంగా’ అన్న దానికి ప్రత్యక్ష వ్యతిరేక సమాంతరంగా ఉంది; అదే నిర్మాణాన్ని తెలుగులో నిలిపాం.
- source_word: וְהַבְּרִיאֹת
  choice: బలిసిన
  rationale: בְּרִיאֹת అంటే ‘ఆరోగ్యంగా/బొద్దుగా/బలిసి’ అని అర్థమవుతుంది. సన్నగా ఉన్న ఆవులతో శారీరక వ్యత్యాసం చూపే సందర్భంలో ‘బలిసిన’ అనేది సహజమైన, స్పష్టమైన ఎంపిక.
- source_word: וַיִּיקַץ פַּרְעֹה
  choice: అప్పుడు ఫరో మేల్కొన్నాడు
  rationale: קיץ అంటే నిద్రనుండి మేల్కొనడం. వాక్యాంతంలోని తదుపరి సంఘటనను సహజ తెలుగు కథనశైలిలో ‘అప్పుడు’తో తెలిపాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే, గౌరవప్రదమైన కథనశైలి. హీబ్రూ పదబంధాల సమాంతరతను ‘చూడటానికి వికారంగా/అందంగా’ ద్వారా నిలిపి, శరీరస్థితి వ్యత్యాసాన్ని సహజ తెలుగు ప్రయోగాలతో తెలిపాం.
