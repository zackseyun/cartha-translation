  to: చూడటానికి వికారంగా, ఒళ్లు చిక్కిపోయిన ఆవులు చూడటానికి అందంగా, బలిసిన ఆ ఏడు ఆవులను తిన్నాయి.[a] ఫరో మేల్కొన్నాడు.
