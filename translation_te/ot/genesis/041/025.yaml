id: GEN.41.25
reference: Genesis 41:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יוֹסֵף֙ אֶל פַּרְעֹ֔ה חֲל֥וֹם פַּרְעֹ֖ה אֶחָ֣ד ה֑וּא אֵ֣ת אֲשֶׁ֧ר הָ/אֱלֹהִ֛ים עֹשֶׂ֖ה הִגִּ֥יד לְ/פַרְעֹֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/025.yaml
  text: Then Joseph said to Pharaoh[a], “Pharaoh’s dreams are one[b]; what God is doing he has declared to Pharaoh.”
translation:
  language: te
  text: 'అప్పుడు యోసేపు ఫరోతో ఇలా అన్నాడు: “ఫరో కలలు ఒక్కటే[a]; దేవుడు చేస్తున్నదాన్ని[b] ఫరోకు తెలియజేశాడు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “ఫరో కల ఒక్కటే.” సందర్భంలో ఫరో చూసిన రెండు కలలు ఒకే సందేశాన్ని ఇస్తున్నాయని యోసేపు చెబుతున్నాడు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “దేవుడు చేయబోతున్నదాన్ని.” హీబ్రూ కృదంతాన్ని నేరుగా “చేస్తున్న” అని అనువదించవచ్చు; ఈ సందర్భంలో అది దేవుడు త్వరలో చేయబోయేదాన్ని కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... అన్నాడు
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది. ఆధునిక తెలుగులో ‘అప్పుడు ... అన్నాడు’ ఆ క్రమాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: יוֹסֵף
  choice: యోసేపు
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: אֶל־פַּרְעֹה
  choice: ఫరోతో
  rationale: మాట్లాడటాన్ని పరిచయం చేసే సందర్భంలో ‘ఫరోతో ... అన్నాడు’ సహజమైన తెలుగు ప్రయోగం.
- source_word: חֲלוֹם פַּרְעֹה אֶחָד הוּא
  choice: ఫరో కలలు ఒక్కటే
  rationale: హీబ్రూలో ‘కల’ ఏకవచనంలో ఉన్నా, సందర్భంలో ఫరో చూసిన రెండు కలలు ఒకే సందేశమని యోసేపు చెబుతున్నాడు. ‘ఒక్కటే’ అనే మూలంలోని ప్రతిపాదనను వివరణాత్మకంగా మార్చకుండా నిలిపింది.
- source_word: אֵת אֲשֶׁר
  choice: '...దాన్ని'
  rationale: తదుపరి క్రియకు కర్మగా ఉన్న విషయవాక్యాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: הָאֱלֹהִים
  choice: దేవుడు
  rationale: ఇక్కడ నిర్దిష్టంగా దేవుణ్ణి సూచిస్తుంది; తెలుగులో ‘దేవుడు’ సహజమైన రూపం.
- source_word: עֹשֶׂה
  choice: చేస్తున్న
  rationale: హీబ్రూ వర్తమాన కృదంతాన్ని నేరుగా ప్రతిబింబిస్తూ, అది ప్రస్తుతం జరుగుతున్నదా, సమీప భవిష్యత్తులో దేవుడు చేయబోయేదా అనే సందర్భసిద్ధ భావాన్ని బలవంతంగా నిర్ణయించదు.
- source_word: הִגִּיד
  choice: తెలియజేశాడు
  rationale: నגד హిఫీల్ రూపంలోని ‘చెప్పడం, తెలియజేయడం’ అనే భావాన్ని స్పష్టంగా, గౌరవప్రదంగా అందిస్తుంది.
- source_word: לְפַרְעֹה
  choice: ఫరోకు
  rationale: పరోక్ష కర్మను సూచించే לְ ఉపసర్గకు సహజమైన తెలుగు సమానం.
theological_decisions:
- issue: הָאֱלֹהִים పదానికి అనువాదం
  choice: దేవుడు
  alternative: ఆ దేవుడు
  rationale: హీబ్రూ పదానికి నిర్దిష్ట ఉపపదం ఉన్నప్పటికీ, ఈ సందర్భంలో ఏకైక దేవుణ్ణి సూచించడానికి తెలుగులో ‘దేవుడు’ సహజం; అదనపు సిద్ధాంతార్థాన్ని చేర్చదు.
- issue: עֹשֶׂה కృదంతంలోని కాలభావం
  choice: చేస్తున్న
  alternative: చేయబోతున్న
  rationale: మూలంలోని కృదంతం కార్యాన్ని జరుగుతున్నదిగా లేదా సందర్భానుసారం సమీప భవిష్యత్తుకు చెందినదిగా గ్రహించవచ్చు. ప్రధాన పాఠంలో ‘చేస్తున్న’ అని ఉంచి, భవిష్యత్ భావాన్ని పాదసూచికలో ప్రత్యామ్నాయంగా ఇచ్చి మూలంలోని ఉద్వేగాన్ని కాపాడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. మూలంలోని ‘ఒక్కటే’ అనే వాక్య నిర్మాణాన్ని నిలిపి, కాలభావంలోని నిజమైన సందిగ్ధతను పాదసూచికలో సంరక్షించాం.
