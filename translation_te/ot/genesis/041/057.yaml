  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. హీబ్రూ వాక్యారంభంలోని సమష్టివాచక ‘భూమంతా’ తెలుగులో వ్యక్తులను సూచించేలా ‘లోకమంతటి నుండి ప్రజలు’గా ఇచ్చి, దాని అక్షరార్థాన్ని పాదసూచికలో భద్రపరచాం.
