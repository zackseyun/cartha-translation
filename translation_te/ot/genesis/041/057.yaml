source:
  edition: WLC
  text: וְ/כָל הָ/אָ֨רֶץ֙ בָּ֣אוּ מִצְרַ֔יְמָ/ה לִ/שְׁבֹּ֖ר אֶל יוֹסֵ֑ף כִּֽי חָזַ֥ק הָ/רָעָ֖ב בְּ/כָל הָ/אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/057.yaml
  text: And all the earth came to Egypt to Joseph to buy grain[a], because the famine was severe in all the earth.
translation:
  language: te
  text: కరవు భూమంతటా తీవ్రంగా ఉండడంతో, ధాన్యం కొనడానికి లోకమంతటి నుండి ప్రజలు[a] ఐగుప్తుకు యోసేపు దగ్గరికి వచ్చారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా “భూమంతా.” హీబ్రూ אֶרֶץ అనే పదానికి “భూమి,” “దేశం,” లేదా “ప్రాంతం” అనే అర్థాలు రావచ్చు. ఇక్కడ అది కరవు ప్రభావానికి లోనైన దేశాలను విస్తృతంగా సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל הָאָרֶץ
  choice: లోకమంతటి నుండి ప్రజలు
  rationale: అక్షరార్థంగా ‘భూమంతా’; అయితే బָּאוּ అనే బహువచన క్రియతో కలిసి ఇది వివిధ దేశాల ప్రజలను సమష్టిగా సూచిస్తుంది. ఆధునిక తెలుగులో సహజంగా ఉండేందుకు ‘ప్రజలు’ స్పష్టపరచబడింది; విస్తృతమైన కథన పరిధి ‘లోకమంతటి నుండి’ ద్వారా నిలిచింది.
- source_word: בָּאוּ מִצְרַיְמָה
  choice: ఐగుప్తుకు ... వచ్చారు
  rationale: దిశను సూచించే మִצְרַיְמָהకు ‘ఐగుప్తుకు’ సరిపోతుంది; గమ్యస్థానాన్ని దృష్టిలో ఉంచిన בואకు ‘వచ్చారు’ సహజమైన అనువాదం.
- source_word: לִשְׁבֹּר
  choice: ధాన్యం కొనడానికి
  rationale: కరవు సందర్భంలో שׁבר సాధారణ కొనుగోలును కాక ధాన్యం సంపాదించడాన్ని సూచించే ప్రయోగం; అందువల్ల అంతర్నిహిత కర్మను తెలుగులో స్పష్టంగా ఇచ్చాం.
- source_word: אֶל יוֹסֵף
  choice: యోసేపు దగ్గరికి
  rationale: అక్షరార్థంగా ‘యోసేపు వద్దకు/వైపు.’ ధాన్య పంపిణీ అధికారిగా ఉన్న యోసేపును సంప్రదించడానికి వచ్చారనే భావాన్ని అతిగా విప్పకుండా సహజ తెలుగులో తెలుపుతుంది.
- source_word: כִּי חָזַק הָרָעָב
  choice: కరవు ... తీవ్రంగా ఉండడంతో
  rationale: חָזַק అక్షరార్థంగా ‘బలంగా అయింది’; కరవుతో వాడినప్పుడు ‘తీవ్రంగా ఉంది’ సహజమైన తెలుగు. כִּי యొక్క కారణార్థం ‘ఉండడంతో’ ద్వారా వ్యక్తమైంది.
- source_word: בְּכָל הָאָרֶץ
  choice: భూమంతటా
  rationale: אָרֶץకు ‘భూమి,’ ‘దేశం,’ ‘ప్రాంతం’ అనే అర్థాలు ఉండవచ్చు. ఇక్కడ కరవు వ్యాపించిన విస్తృత పరిధిని నిలుపుతూ, మొదటి పదబంధానికి భిన్నమైన సహజ తెలుగు రూపంలో ‘భూమంతటా’ అని ఇచ్చాం.
