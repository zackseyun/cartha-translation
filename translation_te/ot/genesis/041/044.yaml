id: GEN.41.44
reference: Genesis 41:44
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֧אמֶר פַּרְעֹ֛ה אֶל יוֹסֵ֖ף אֲנִ֣י פַרְעֹ֑ה וּ/בִלְעָדֶ֗י/ךָ לֹֽא יָרִ֨ים אִ֧ישׁ אֶת יָד֛/וֹ וְ/אֶת רַגְל֖/וֹ בְּ/כָל אֶ֥רֶץ מִצְרָֽיִם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/044.yaml
  text: Then Pharaoh said to Joseph[a], “I am Pharaoh[b], and without you no man will lift up his hand or his foot in all the land of Egypt.”
translation:
  language: te
  text: అప్పుడు ఫరో యోసేపుతో, “నేను ఫరోను. నీవు లేకుండా[a] ఐగుప్తు దేశమంతటిలో ఎవరూ తమ చెయ్యి గానీ కాలు గానీ ఎత్తకూడదు[b]” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీ అనుమతి లేకుండా.” అంటే, ఐగుప్తులో ఎవరూ యోసేపు అధికారానికి స్వతంత్రంగా వ్యవహరించలేరు.
    reason: lexical_alternative
  - marker: b
    text: హెబ్రీలో అక్షరార్థంగా, “తన చెయ్యిని లేదా తన కాలిని ఎత్తకూడదు.” ఇది ఏ పని చేయడానికైనా లేదా ఏ కదలిక చేయడానికైనా సూచించే నానుడి.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... అన్నాడు
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది; ఆధునిక తెలుగు కథనశైలిలో ‘అప్పుడు ... అన్నాడు’ క్రమాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: אֲנִי פַרְעֹה
  choice: నేను ఫరోను
  rationale: క్రియలేని ఈ హెబ్రీ వాక్యం ఫరో తన సార్వభౌమ అధికారాన్ని గట్టిగా ప్రకటించడాన్ని నేరుగా నిలుపుతుంది; అదనపు భావాన్ని చేర్చదు.
- source_word: וּבִלְעָדֶיךָ
  choice: నీవు లేకుండా
  rationale: ఈ పదబంధం యోసేపును మినహాయించి లేదా అతని అధికారానికి వెలుపల ఏదీ జరగకూడదనే భావాన్ని సూచిస్తుంది. సంక్షిప్తమైన ప్రధాన అనువాదంతో పాటు అధికార సంబంధిత భావాన్ని పాదసూచిక వివరిస్తుంది.
- source_word: לֹא יָרִים אִישׁ
  choice: ఎవడూ ... ఎత్తకూడదు
  rationale: రాజాజ్ఞ సందర్భంలో నిషేధాత్మక యిక్తోల్‌ను తెలుగులో సహజమైన అధికార ప్రకటనగా అందిస్తుంది. ‘ఎవడూ’ ఇక్కడ సాధారణ మానవ సూచనగా వాడబడింది.
- source_word: אֶת יָדוֹ וְאֶת רַגְלוֹ
  choice: తన చెయ్యినైనా కాలినైనా
  rationale: మూలంలోని శరీరాంగ రూపకాన్ని నిలుపుతూ, నిషేధ వాక్యంలో హెబ్రీ ‘మరియు’ యొక్క సమగ్ర భావాన్ని తెలుగు ‘అయినా ... అయినా’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בְּכָל אֶרֶץ מִצְרָיִם
  choice: ఐగుప్తు దేశమంతటిలో
  rationale: మొత్తం దేశవ్యాప్త పరిధిని మూలానికి దగ్గరగా, సహజమైన తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: ఫరో అధికారానికి, యోసేపుకు అప్పగించిన అధికారానికి మధ్య సంబంధం
  choice: ‘నేను ఫరోను. నీవు లేకుండా’ అనే మూల నిర్మాణాన్ని అలాగే ఉంచడం
  alternative: ‘నేను ఫరోనైనప్పటికీ, నీ అనుమతి లేకుండా’ అని సంబంధాన్ని స్పష్టీకరించడం
  rationale: మూలంలో ఉన్న సంక్షిప్తతను, ఉద్దేశపూర్వక ఒత్తిడిని నిలుపుతూ, ‘అయినప్పటికీ’ వంటి వ్యాఖ్యాత్మక అనుసంధానాన్ని చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. మూలంలోని ‘చెయ్యి/కాలు ఎత్తడం’ అనే స్పష్టమైన నానుడిని ప్రధాన పాఠ్యంలో నిలిపి, దాని భావాన్ని పాదసూచికలో వివరించాం. ‘ఐగుప్తు’ అనే స్థిరమైన తెలుగు బైబిలు భౌగోళిక రూపం ఉపయోగించబడింది.
