id: GEN.41.33
reference: Genesis 41:33
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/עַתָּה֙ יֵרֶ֣א פַרְעֹ֔ה אִ֖ישׁ נָב֣וֹן וְ/חָכָ֑ם וִ/ישִׁיתֵ֖/הוּ עַל אֶ֥רֶץ מִצְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/033.yaml
  text: Now let Pharaoh look for a discerning and wise man[a], and appoint him over the land of Egypt.
translation:
  language: te
  text: ఇప్పుడు ఫరో వివేచనగల, జ్ఞానవంతుడైన ఒక మనిషిని వెదకాలి[a]; అతణ్ణి ఐగుప్తు దేశంపై నియమించాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “చూడాలి” లేదా “ఎంపిక చేయాలి.” హీబ్రూ క్రియ సందర్భానుసారంగా చూడడం, కనుగొనడం లేదా ఎంపిక చేయడం అనే అర్థాలను ఇవ్వగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: ఇప్పుడు
  rationale: యోసేపు కలల వివరణ నుంచి ఆచరణాత్మక సలహాకు మారుతున్న సందర్భాన్ని సహజమైన ఆధునిక తెలుగులో సూచిస్తుంది.
- source_word: יֵרֶא
  choice: వెదకి
  rationale: ఇక్కడ ראה క్రియ కేవలం చూడడం కాక, తగిన వ్యక్తిని గుర్తించడం లేదా ఎంపిక చేయడం అనే సందర్భార్థాన్ని కలిగి ఉంది; ‘వెదకి’ ఆ ఉద్దేశాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: פַרְעֹה
  choice: ఫరో
  rationale: ఈజిప్టు రాజుకు వాడే బిరుదుకు తెలుగులో స్థిరపడిన రూపం.
- source_word: אִישׁ
  choice: ఒక మనిషిని
  rationale: హీబ్రూ పదంలోని పుంలింగ ఏకవచన రూపాన్ని, సందర్భంలోని పురుష అధికారిని యథాతథంగా ప్రతిబింబిస్తుంది.
- source_word: נָבוֹן
  choice: వివేచనగల
  rationale: పరిపాలనా సందర్భానికి తగిన గ్రహింపు, విచక్షణ, సముచిత నిర్ణయశక్తి అనే భావాన్ని తెలియజేస్తుంది.
- source_word: וְחָכָם
  choice: జ్ఞానవంతుడైన
  rationale: తీర్పు, ప్రాయోగిక జ్ఞానం, సామర్థ్యం అనే חכם పదార్థాన్ని సహజంగా అందిస్తుంది.
- source_word: וִישִׁיתֵהוּ
  choice: అతణ్ణి ... నియమించాలి
  rationale: ‘ఉంచు/నిలుపు’ అనే మూలభావం ఈ ప్రభుత్వ పరిపాలనా సందర్భంలో అధికారిగా నియమించడాన్ని సూచిస్తుంది.
- source_word: עַל אֶרֶץ מִצְרָיִם
  choice: ఐగుప్తు దేశం మీద
  rationale: עַל లోని అధికార పరిధి భావాన్ని, ‘ఐగుప్తు దేశం’ అనే హీబ్రూ వ్యక్తీకరణను నిలుపుతుంది.
