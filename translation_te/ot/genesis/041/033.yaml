translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. హీబ్రూ ఆజ్ఞార్థక భావాన్ని తెలుగులో ‘నియమించాలి’తో వ్యక్తం చేసి, మొదటి క్రియను అనుసంధాన క్రియారూపంగా ఉంచాం. పాదసూచిక గుర్తు [a] ప్రధాన పాఠ్యంలో చేర్చబడింది.
