  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయితే గంభీరతను నిలుపుతూ అనువదించబడింది. ‘ఆ తర్వాత వచ్చే ఆ కరవు’ అనే రూపం మూలంలోని నిర్దేశకత, కాలక్రమం రెండింటినీ కాపాడుతుంది.
