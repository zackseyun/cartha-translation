- from: ఆ తర్వాత వచ్చే ఆ కరవు కారణంగా దేశంలో సమృద్ధి ఉండేదన్న సంగతే తెలియకుండా పోతుంది[a]. ఎందుకంటే ఆ కరవు చాలా తీవ్రంగా ఉంటుంది.
  to: ఆ తరువాత వచ్చే ఆ కరవు వల్ల దేశంలోని సమృద్ధి ఇక తెలియదు[a]; ఎందుకంటే ఆ కరవు చాలా తీవ్రంగా ఉంటుంది.
  rationale: 'The revision removes the added past-existence paraphrase and renders the Hebrew passive/generic prediction directly: the abundance will no longer be known because of the subsequent famine. It retains the demonstrative-temporal sense of “that famine afterward,” the causal relation, and the emphatic severity of the famine.'
