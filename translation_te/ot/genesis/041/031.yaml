id: GEN.41.31
reference: Genesis 41:31
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/לֹֽא יִוָּדַ֤ע הַ/שָּׂבָע֙ בָּ/אָ֔רֶץ מִ/פְּנֵ֛י הָ/רָעָ֥ב הַ/ה֖וּא אַחֲרֵי כֵ֑ן כִּֽי כָבֵ֥ד ה֖וּא מְאֹֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/031.yaml
  text: And the abundance in the land will not be known because of that famine afterward[b][a], for it will be very severe.
translation:
  language: te
  text: ఆ తరువాత వచ్చే ఆ కరవు వల్ల దేశంలోని సమృద్ధి ఇక తెలియదు[a]; ఎందుకంటే ఆ కరవు చాలా తీవ్రంగా ఉంటుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దేశంలోని సమృద్ధి ఇక గుర్తింపబడదు.” హీబ్రూ క్రియకు తెలియబడడం, గుర్తింపబడడం లేదా గమనింపబడడం అనే అర్థాలు రావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִוָּדַע
  choice: తెలియకుండా పోతుంది
  rationale: ידע నిఫాల్ రూపం ఇక్కడ ‘తెలియబడడం, గుర్తింపబడడం, గమనింపబడడం’ అనే అర్థపరిధిని కలిగి ఉంది. ముందున్న సమృద్ధి తరువాతి కరవువల్ల జ్ఞాపకానికే రానంతగా కనుమరుగవుతుందనే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: הַשָּׂבָע
  choice: సమృద్ధి
  rationale: యోసేపు కథా సందర్భంలో ఇది విస్తారమైన పంటలూ ఆహార సమృద్ధినీ సూచిస్తుంది; ‘సమృద్ధి’ ఆధునిక తెలుగులో సహజంగా, విస్తృత అర్థంతో ఉంటుంది.
- source_word: בָּאָרֶץ
  choice: దేశంలో
  rationale: ఇక్కడ ప్రపంచమంతటినీ కాక, కరవు ప్రభావిత ప్రాంతాన్ని—ప్రధానంగా ఐగుప్తు దేశాన్ని—సూచించే ప్రాంతీయ భావం ఉంది.
- source_word: מִפְּנֵי
  choice: కారణంగా
  rationale: 'ఈ ఉపసర్గ ఇక్కడ కారణాన్ని తెలియజేస్తుంది: తరువాతి కరవు కారణంగా ముందటి సమృద్ధి తెలియకుండా పోతుంది.'
- source_word: הָרָעָב הַהוּא אַחֲרֵי כֵן
  choice: ఆ తర్వాత వచ్చే ఆ కరవు
  rationale: హీబ్రూలోని కాలక్రమ భావాన్నీ నిర్దేశక పదం ‘ఆ’ భావాన్నీ రెండింటినీ సహజమైన తెలుగు పదక్రమంలో నిలుపుతుంది.
- source_word: כִּי כָבֵד הוּא מְאֹד
  choice: ఎందుకంటే ఆ కరవు చాలా తీవ్రంగా ఉంటుంది
  rationale: כבד అక్షరార్థంగా ‘బరువైనది’; కరవుతో వాడినప్పుడు ‘అత్యంత తీవ్రమైనది’ అనే నుడికారార్థం వస్తుంది. భవిష్యత్ సందర్భానికి అనుగుణంగా ‘ఉంటుంది’ వాడబడింది.
