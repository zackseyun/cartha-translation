source:
  edition: WLC
  text: ה֣וּא הַ/דָּבָ֔ר אֲשֶׁ֥ר דִּבַּ֖רְתִּי אֶל פַּרְעֹ֑ה אֲשֶׁ֧ר הָ/אֱלֹהִ֛ים עֹשֶׂ֖ה הֶרְאָ֥ה אֶת פַּרְעֹֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/028.yaml
  text: 'This is the matter that I spoke to Pharaoh: what God is doing he has shown to Pharaoh[a].'
translation:
  language: te
  text: 'నేను ఫరోకు చెప్పిన విషయం ఇదే: దేవుడు చేయబోయేదాన్ని ఫరోకు చూపించాడు.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దేవుడు చేస్తున్న దానిని.” హీబ్రూ కృదంతం ప్రస్తుత చర్యను గానీ సమీప భవిష్యత్ చర్యను గానీ సూచించవచ్చు; కలలో వెల్లడైన రాబోయే సంఘటనల సందర్భంలో “చేయబోతున్న” అనే భావం సరిపోతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוּא הַדָּבָר
  choice: విషయం ఇదే
  rationale: హీబ్రూ గుర్తింపు వాక్య నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తూ, דָּבָר ఇక్కడ కల యొక్క భావం లేదా విషయాన్ని సూచిస్తుందని తెలియజేస్తుంది.
- source_word: אֲשֶׁר דִּבַּרְתִּי אֶל־פַרְעֹה
  choice: నేను ఫరోతో చెప్పిన
  rationale: దేవుడు వెల్లడించిన విషయాన్ని యోసేపు ఫరోకు ముందుగా వివరించిన సందర్భానికి అనుగుణంగా సహజమైన తెలుగు సంబంధవాక్యంగా అనువదించబడింది.
- source_word: הָאֱלֹהִים
  choice: దేవుడు
  rationale: నిర్దిష్ట దైవ సూచనను తెలుగులో సహజంగా, అదనపు సిద్ధాంతార్థం చేర్చకుండా వ్యక్తపరుస్తుంది.
- source_word: עֹשֶׂה
  choice: చేయబోతున్న
  rationale: హీబ్రూ వర్తమాన కృదంతం ప్రస్తుత లేదా సమీప భవిష్యత్ చర్యను సూచించగలదు; రాబోయే సంఘటనలను తెలిపే కల వివరణలో సమీప భవిష్యత్ భావం సందర్భానికి సరిపోతుంది.
- source_word: הֶרְאָה אֶת־פַרְעֹה
  choice: ఫరోకు చూపించాడు
  rationale: ראה హిఫిల్ రూపంలోని ‘చూపించాడు/చూడేలా చేశాడు’ అనే కారణార్థాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: యోసేపు మాటల్లో הָאֱלֹהִים అనువాదం
  choice: దేవుడు
  alternative: ఆ దేవుడు
  rationale: హీబ్రూలో నిర్దిష్ట ఉపపదం ఉన్నప్పటికీ, ఇక్కడ నిజ దేవునికి సాధారణ నిర్దిష్ట సూచనగా ఉంది; తెలుగులో ‘దేవుడు’ సహజంగా ఉండి అదనపు సిద్ధాంత వివరణను చేర్చదు.
- issue: עֹשֶׂה యొక్క కాలభావం
  choice: చేయబోతున్న
  alternative: చేస్తున్న
  rationale: కృదంతంలోని నిజమైన కాల అస్పష్టతను పాదటిప్పణిలో నిలుపుతూ, రాబోయే సమృద్ధి మరియు కరవును ముందుగా వెల్లడించే ఈ సందర్భంలో సమీప భవిష్యత్ భావాన్ని ప్రధాన పాఠ్యంలో ఉపయోగించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన శైలి. మూలంలోని గుర్తింపు వాక్య నిర్మాణాన్ని సహజంగా ఉంచి, కృదంత కాలభావంలోని అస్పష్టతను పాదటిప్పణిలో సంరక్షించాం.
