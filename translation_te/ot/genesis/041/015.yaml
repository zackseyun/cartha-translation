  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר פַּרְעֹה֙ אֶל יוֹסֵ֔ף חֲל֣וֹם חָלַ֔מְתִּי וּ/פֹתֵ֖ר אֵ֣ין אֹת֑/וֹ וַ/אֲנִ֗י שָׁמַ֤עְתִּי עָלֶ֨י/ךָ֙ לֵ/אמֹ֔ר תִּשְׁמַ֥ע חֲל֖וֹם לִ/פְתֹּ֥ר אֹתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/015.yaml
  text: And Pharaoh said to Joseph, “I have dreamed a dream, and there is no one to interpret it. But I have heard it said about you that when you hear a dream, you can interpret it.”
translation:
  language: te
  text: 'ఫరో యోసేపుతో ఇలా అన్నాడు: “నేను ఒక కల కన్నాను. దానికి అర్థం చెప్పగలవారు ఎవరూ లేరు. అయితే నువ్వు ఒక కల వింటే దానికి అర్థం చెప్పగలవని నీ గురించి విన్నాను.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֲלוֹם חָלַמְתִּי
  choice: నేను ఒక కల కన్నాను
  rationale: హీబ్రూ ధాతు-నామ పునరుక్తిని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; అసలు భావాన్ని అనవసరంగా బలపరచదు.
- source_word: וּפֹתֵר אֵין אֹתוֹ
  choice: దానికి అర్థం చెప్పగలవారు ఎవరూ లేరు
  rationale: ఇక్కడ פָּתַר అంటే కలను వివరించడం లేదా దాని అర్థం చెప్పడం. తెలుగులో ‘అర్థం చెప్పడం’ సాధారణ పాఠకులకు సహజం.
- source_word: שָׁמַעְתִּי עָלֶיךָ לֵאמֹר
  choice: నీ గురించి విన్నాను
  rationale: ‘నీ గురించి ఇలా చెప్పడం విన్నాను’ అనే హీబ్రూ నిర్మాణాన్ని సంక్షిప్తమైన, సహజమైన తెలుగులో అందిస్తుంది.
- source_word: תִּשְׁמַע חֲלוֹם לִפְתֹּר אֹתוֹ
  choice: నువ్వు ఒక కల వింటే దానికి అర్థం చెప్పగలవని
  rationale: అక్షరార్థంగా ‘కలను విని దానిని వివరించుటకు’ అనే అసాధారణ నిర్మాణం సామర్థ్యాన్ని సూచిస్తుంది. ‘వింటే ... చెప్పగలవు’ అని అనువదించడం ఆ భావాన్ని, ఆంగ్ల సంప్రదింపుల పాఠంలోని నిర్మాణాన్ని కాపాడుతుంది.
theological_decisions:
- issue: యోసేపుకు కలల అర్థం చెప్పే సామర్థ్యం స్వతంత్రంగా ఉందా అనే సూచన
  choice: ఫరో చెప్పిన అభిప్రాయంగానే ‘చెప్పగలవని’ ఉంచడం
  alternative: దేవుడు నీకు అర్థం తెలియజేస్తాడని
  rationale: ఈ వచనం ఫరో విన్న నివేదికను మాత్రమే తెలియజేస్తుంది. దేవుని పాత్రను యోసేపు తదుపరి వచనంలో స్పష్టం చేస్తాడు; దాన్ని ఇక్కడ ముందుగానే చేర్చకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సంభాషణ సహజంగా, గౌరవప్రదంగా ఉంది. ‘భాష్యం చెప్పడం’ కంటే సాధారణ పాఠకులకు స్పష్టమైన ‘అర్థం చెప్పడం’ వాడబడింది.
