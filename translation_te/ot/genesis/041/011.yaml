  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. మూలంలోని కొంత అసాధారణమైన ‘కల అర్థానికి తగినట్లుగా కల కనడం’ అనే భావ సంబంధాన్ని సరళీకరించి తొలగించకుండా నిలుపుకున్నాం.
