  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/נַּֽחַלְמָ֥/ה חֲל֛וֹם בְּ/לַ֥יְלָה אֶחָ֖ד אֲנִ֣י וָ/ה֑וּא אִ֛ישׁ כְּ/פִתְר֥וֹן חֲלֹמ֖/וֹ חָלָֽמְנוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/011.yaml
  text: And we dreamed a dream in one night[a], I and he; each man dreamed according to the interpretation of his dream.
translation:
  language: te
  text: ఒకే రాత్రిలో[a] నేనూ అతడూ కలలు కన్నాము; మాలో ప్రతి ఒక్కరం తన కల అర్థానికి తగినట్లుగా కల కన్నాము.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'అక్షరార్థం: ‘ఒక రాత్రిలో.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנַּחַלְמָה חֲלוֹם
  choice: కలలు కన్నాము
  rationale: హీబ్రూలో క్రియతో అదే మూలానికి చెందిన నామవాచకం వాడబడింది. తెలుగులో ‘కలలు కన్నాము’ అనేది సహజంగా ఉండి, ఇద్దరూ కలలు కన్నారనే భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: בְּלַיְלָה אֶחָד
  choice: ఒకే రాత్రిలో
  rationale: అక్షరార్థం ‘ఒక రాత్రిలో.’ సందర్భంలో ఇద్దరికీ అదే రాత్రి కలలు వచ్చాయనే కాలసామ్యాన్ని ‘ఒకే రాత్రిలో’ సహజంగా తెలియజేస్తుంది; అక్షరార్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: אֲנִי וָהוּא
  choice: నేనూ అతడూ
  rationale: మూలంలోని వ్యక్తుల క్రమాన్ని నిలుపుతూ, తెలుగు సంయుక్త కర్త నిర్మాణంలో సహజంగా అనువదించబడింది.
- source_word: אִישׁ
  choice: మాలో ప్రతి ఒక్కరం
  rationale: ఇక్కడ אִישׁ పంపిణీ భావంలో ఉండి, ఇద్దరిలో ఒక్కొక్కరిని సూచిస్తుంది. ‘మాలో ప్రతి ఒక్కరం’ ఆ భావాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: כְּפִתְרוֹן חֲלֹמוֹ
  choice: తన కల అర్థానికి తగినట్లుగా
  rationale: כְּ ఇక్కడ కలకూ దాని అర్థానికీ ఉన్న అనురూపతను సూచిస్తుంది. ‘తగినట్లుగా’ ఆ సంబంధాన్ని పరిష్కరించి చెప్పకుండా నిలుపుతుంది.
- source_word: חָלָמְנוּ
  choice: కల కన్నాము
  rationale: వాక్యాంతంలోని పునరుక్త క్రియ పంపిణీ వాక్యాన్ని పూర్తిచేస్తుంది; తెలుగులో దానిని ఉంచడం మూల నిర్మాణాన్నీ భావాన్నీ కాపాడుతుంది.
