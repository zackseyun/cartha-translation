lexical_decisions:
- source_word: וַתַּעַשׂ
  choice: పంటనిచ్చింది
  rationale: עשה అనే క్రియకు సాధారణంగా ‘చేయడం’ అనే అర్థం ఉన్నా, వ్యవసాయ సందర్భంలో הארץ కర్తగా ఉన్నందున భూమి పంటను ఉత్పత్తి చేయడాన్ని ఇది సూచిస్తుంది. ‘పంటనిచ్చింది’ సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: הָאָרֶץ
  choice: దేశం
  rationale: యోసేపు కథా సందర్భంలో ఇది భూమి అంతటినీ కాక ఐగుప్తు దేశాన్ని, ముఖ్యంగా దాని సాగుభూమిని సూచిస్తుంది. ‘దేశం’ ఈ సందర్భాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: בְּשֶׁבַע שְׁנֵי הַשָּׂבָע
  choice: ఆ ఏడు సమృద్ధి సంవత్సరాల్లో
  rationale: ఈ మాట ఫరో కలల్లో ముందుగా ప్రకటించబడిన సమృద్ధికాలాన్ని సూచిస్తుంది. ‘ఆ’ అనే సూచన సందర్భ సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: לִקְמָצִים
  choice: గుప్పెళ్లకొద్దీ
  rationale: קְמָץ అంటే చేతితో పట్టగల గుప్పెడు లేదా పిడికెడు. ‘గుప్పెళ్లకొద్దీ’ మూలంలోని దృశ్యరూపాన్ని నిలుపుతూ విస్తారమైన దిగుబడిని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
