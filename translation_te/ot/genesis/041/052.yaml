source:
  edition: WLC
  text: וְ/אֵ֛ת שֵׁ֥ם הַ/שֵּׁנִ֖י קָרָ֣א אֶפְרָ֑יִם כִּֽי הִפְרַ֥/נִי אֱלֹהִ֖ים בְּ/אֶ֥רֶץ עָנְיִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/052.yaml
  text: And he named the second Ephraim[a], for God has made me fruitful in the land of my affliction.
translation:
  language: te
  text: రెండవ కుమారునికి ఎఫ్రాయిము[a] అని పేరు పెట్టాడు; ఎందుకంటే, దేవుడు నా బాధల దేశంలో నన్ను ఫలవంతుణ్ణి చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ఎఫ్రాయిము” అనే పేరు, “నన్ను ఫలవంతుణ్ణి చేశాడు” అనే హీబ్రూ మాటతో ధ్వనిసామ్యాన్ని కలిగి ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵת שֵׁם הַשֵּׁנִי קָרָא
  choice: రెండవవాడికి ... అని పేరు పెట్టాడు
  rationale: పేరుపెట్టే సందర్భంలోని హీబ్రూ వాక్యనిర్మాణాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది; ప్రారంభ וְ కథన కొనసాగింపును సూచించినా, తెలుగులో ప్రత్యేకంగా ‘మరియు’ అనడం అవసరం లేదు.
- source_word: אֶפְרָיִם
  choice: ఎఫ్రాయిము
  rationale: హీబ్రూ వ్యక్తిపేరును తెలుగులో సుపరిచితమైన లిప్యంతరీకరణతో అందించింది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: పేరుకు యోసేపు ఇచ్చిన కారణాన్ని స్పష్టంగా పరిచయం చేస్తుంది.
- source_word: הִפְרַנִי
  choice: నన్ను ఫలవంతుణ్ణి చేశాడు
  rationale: פרה అనే ధాతువు హిఫీల్ రూపంలోని ‘ఫలవంతునిగా చేయడం’ అనే కారక భావాన్ని నిలుపుతూ, ఎఫ్రాయిము పేరుతో ఉన్న పదప్రయోగ సంబంధాన్ని సాధ్యమైనంతవరకు కాపాడుతుంది.
- source_word: אֱלֹהִים
  choice: దేవుడు
  rationale: రూపపరంగా బహువచనమైనా, వాక్యంలోని ఏకవచన క్రియ మరియు సందర్భం ఇశ్రాయేలు దేవుణ్ణి సూచిస్తున్నందున ఏకవచనంగా అనువదించింది.
- source_word: בְּאֶרֶץ עָנְיִי
  choice: నా బాధల దేశంలో
  rationale: ‘నా బాధ/శ్రమ ఉన్న దేశంలో’ అనే భావాన్ని సహజంగా వ్యక్తపరుస్తూ, స్థల సూచనను మరియు యోసేపు అనుభవించిన కష్టాల జ్ఞాపకాన్ని నిలుపుతుంది.
theological_decisions:
- issue: యోసేపు పేరుపెట్టడానికి ఇచ్చిన వివరణ
  choice: దేవుడు తనను ఫలవంతుణ్ణి చేశాడని యోసేపు ఒప్పుకుంటూనే, ఆ దేశాన్ని తన బాధల దేశంగా పేర్కొంటాడు.
  alternative: యోసేపు ఐగుప్తుకు రాకముందటి బాధలను మాత్రమే ఉద్దేశించాడు; లేదా కుటుంబానికి దూరమైన ప్రవాసబాధతో సహా విస్తృతమైన కష్టాన్ని ఉద్దేశించాడు.
  rationale: మూలవాక్యం దేవుని అనుగ్రహాన్నీ బాధ జ్ఞాపకాన్నీ పక్కపక్కనే ఉంచుతుంది. ‘నా బాధల దేశంలో’ అనే అనువాదం బాధ ఏ కాలానికి పరిమితమో నిర్ణయించకుండా ఆ ఉద్వేగాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. నేరుగా పలికిన వివరణను ఉద్ధరణలో ఉంచి, పేరుతో ముడిపడిన హీబ్రూ పదప్రయోగాన్ని పాదటిప్పణిలో వివరించింది.
