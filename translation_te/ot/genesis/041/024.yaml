id: GEN.41.24
reference: Genesis 41:24
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/תִּבְלַ֨עְןָ֙ הָ/שִׁבֳּלִ֣ים הַ/דַּקֹּ֔ת אֵ֛ת שֶׁ֥בַע הַֽ/שִׁבֳּלִ֖ים הַ/טֹּב֑וֹת וָֽ/אֹמַר֙ אֶל הַֽ/חַרְטֻמִּ֔ים וְ/אֵ֥ין מַגִּ֖יד לִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/024.yaml
  text: And the thin ears swallowed up the seven good ears[a]. Then I told the magicians[c][b], but there was no one who could explain it to me.
translation:
  language: te
  text: ఆ సన్నని కంకులు మంచి ఏడు కంకులన్నిటినీ మింగివేశాయి.[a] అప్పుడు నేను ఆ కలను మంత్రజ్ఞులకు చెప్పాను; కానీ దానికి అర్థం చెప్పేవాడు ఎవరూ లేడు.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘కంకులు’కు బదులు ‘ధాన్యపు తలలు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘మంత్రజ్ఞులు’ అని అనువదించిన హీబ్రూ పదం ఈజిప్టు ఆచార నిపుణులను లేదా కలలకు అర్థం చెప్పేవారిని సూచిస్తుంది.
    reason: cultural_note
  - marker: c
    text: లేదా, ‘దానిని నాకు వివరించేవాడు ఎవరూ లేడు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּבְלַעְןָ
  choice: మింగివేశాయి
  rationale: בלע అనే క్రియ కలలో ఒక సమూహం కంకులను మరొక సమూహం పూర్తిగా మింగిన స్పష్టమైన దృశ్యాన్ని తెలియజేస్తుంది; ‘మింగివేశాయి’ ఆధునిక తెలుగులో సహజంగా ఆ బలాన్ని నిలుపుతుంది.
- source_word: שִׁבֳּלִים
  choice: కంకులు
  rationale: ఈ వ్యవసాయ సందర్భంలో ఈ పదం ధాన్యపు కంకులను సూచిస్తుంది; ‘కంకులు’ సంక్షిప్తంగా, సహజంగా ఉంది.
- source_word: הַדַּקֹּת
  choice: సన్నని
  rationale: דק అనే విశేషణంలోని ‘సన్నని/పలుచని’ భావాన్ని అదనపు వ్యాఖ్యానం లేకుండా తెలియజేస్తుంది.
- source_word: הַטֹּבוֹת
  choice: మంచి
  rationale: טוב యొక్క విస్తృతమైన ‘మంచి’ అనే భావాన్ని నేరుగా నిలుపుతుంది; ‘నిండైన’ లేదా ‘ఆరోగ్యమైన’ అని వ్యాఖ్యానాత్మకంగా విస్తరించదు.
- source_word: וָאֹמַר אֶל
  choice: అప్పుడు నేను ... చెప్పాను
  rationale: మూలంలో ప్రత్యక్ష కర్మ పేర్కొనబడలేదు. సందర్భంలో కలను వారికి చెప్పినట్లు అర్థమైనా, తెలుగులో అనవసరంగా ‘దానిని’ చేర్చకుండా సహజమైన వాక్యంగా ఇచ్చాం.
- source_word: הַחַרְטֻמִּים
  choice: మంత్రజ్ఞులు
  rationale: ఈజిప్టు రాజసభలో ఆచారాలు, శకునాలు, కలల వివరణలో నిపుణులైన వారిని సూచించే సంప్రదాయపరమైన, సంక్షిప్త తెలుగు పదం; సాంస్కృతిక పరిధిని పాదటిప్పణి వివరిస్తుంది.
- source_word: וְאֵין מַגִּיד לִי
  choice: దాని అర్థం నాకు తెలియజేసేవాడు ఎవరూ లేడు
  rationale: נגד యొక్క ప్రాథమిక ‘తెలియజేయు’ భావాన్ని ఉంచుతూ, ఈ సందర్భంలో కల అర్థాన్ని వెల్లడించడం ఉద్దేశమని సహజ తెలుగులో స్పష్టం చేస్తుంది; సామర్థ్యాన్ని సూచించే ‘చేయగల’ అనే పదాన్ని మూలానికి మించి చేర్చదు.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. కలలోని అసాధారణ దృశ్యాన్ని స్పష్టంగా ఉంచి, చివరి ఉపవాక్యంలో ‘తెలియజేయడం’ మరియు ‘వివరించడం/అర్థం చెప్పడం’ మధ్యనున్న భావవ్యాప్తిని ప్రధాన పాఠం మరియు పాదటిప్పణిలో నిలిపాం.
