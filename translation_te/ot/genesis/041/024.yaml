- from: ఆ సన్నని కంకులు మంచి కంకులు ఏడింటినీ మింగివేశాయి.[a] అప్పుడు నేను మంత్రజ్ఞులకు[b] చెప్పాను; కానీ దాని అర్థం నాకు తెలియజేసేవాడు ఎవరూ లేడు.[c]
  to: ఆ సన్నని కంకులు మంచి ఏడు కంకులన్నిటినీ మింగివేశాయి.[a] అప్పుడు నేను ఆ కలను మంత్రజ్ఞులకు చెప్పాను; కానీ దానికి అర్థం చెప్పేవాడు ఎవరూ లేడు.[b][c]
