source:
  edition: WLC
  text: וְ/שֶׁ֣בַע הַ֠/פָּרוֹת הָֽ/רַקּ֨וֹת וְ/הָ/רָעֹ֜ת הָ/עֹלֹ֣ת אַחֲרֵי/הֶ֗ן שֶׁ֤בַע שָׁנִים֙ הֵ֔נָּה וְ/שֶׁ֤בַע הַֽ/שִׁבֳּלִים֙ הָ/רֵק֔וֹת שְׁדֻפ֖וֹת הַ/קָּדִ֑ים יִהְי֕וּ שֶׁ֖בַע שְׁנֵ֥י רָעָֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/027.yaml
  text: And the seven thin and bad cows that came up after them are seven years[a], and the seven empty heads of grain, scorched by the east wind[b], will be seven years of famine.
translation:
  language: te
  text: వాటి తర్వాత పైకి వచ్చిన సన్నగా, దయనీయంగా ఉన్న ఏడు ఆవులు ఏడు సంవత్సరాలు; అవి ఏడు సంవత్సరాలు. గింజలు నిండని, తూర్పుగాలిచేత మాడిపోయిన[a] ఏడు ధాన్యపు వెన్నులు ఏడు కరవు సంవత్సరాలు అవుతాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తూర్పుగాలిచేత వాడిపోయిన.”
    reason: శְׁדֻפוֹת అనే పదం వేడి తూర్పుగాలి వల్ల ధాన్యపు వెన్నులు దెబ్బతిని మాడిపోవడం లేదా వాడిపోవడం అనే సమీప భావాలను అనుమతిస్తుంది.
lexical_decisions:
- source_word: הָרַקּוֹת וְהָרָעֹת
  choice: సన్నగా, వికారంగా ఉన్న
  rationale: ఆవుల శుష్కమైన శరీరస్థితినీ చూడటానికి అసహ్యంగా ఉన్న రూపాన్నీ సూచిస్తుంది; ఇక్కడ רַע నైతిక చెడును సూచించదు.
- source_word: הָעֹלֹת אַחֲרֵיהֶן
  choice: వాటి తర్వాత పైకి వచ్చిన
  rationale: కలలో ఆ ఆవులు మొదటి ఆవుల తర్వాత కనిపించిన క్రమాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: שֶׁבַע שָׁנִים הֵנָּה
  choice: ఏడు సంవత్సరాలు
  rationale: కలలోని ఏడు ఆవులను ఏడు సంవత్సరాలతో యోసేపు గుర్తిస్తున్న ప్రతీకాత్మక సమానతను నేరుగా వ్యక్తం చేస్తుంది.
- source_word: הַשִׁבֳּלִים הָרֵקוֹת
  choice: గింజలు లేనివిగా ఉన్న ఏడు వెన్నులు
  rationale: שִׁבֹּלֶת ధాన్యపు వెన్నును, רֵיק దానిలో గింజలు నిండక ఖాళీగా ఉండటాన్ని సూచిస్తాయి.
- source_word: שְׁדֻפוֹת הַקָּדִים
  choice: తూర్పుగాలి వల్ల మాడిపోయినవిగా
  rationale: వేడి తూర్పుగాలి ధాన్యపు వెన్నులను దెబ్బతీసి ఎండబెట్టిన భావాన్ని స్పష్టమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: שְׁנֵי רָעָב
  choice: కరవు సంవత్సరాలు
  rationale: ఈ కథనంలో ఆహార కొరతతో కూడిన విస్తృత కరవును సూచించే సహజమైన తెలుగు పదబంధం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన కథనశైలి ఉపయోగించబడింది. మూలంలోని మొదటి గుర్తింపుకు వర్తమాన సమానతను, రెండవదానికి భవిష్య సూచనను నిలుపుతూ “ఏడు సంవత్సరాలు” మరియు “అవుతాయి” అని వేరు చేయబడింది.
