- from: వాటి తరువాత ఏడు సంవత్సరాల కరవు వస్తుంది. అప్పుడు ఐగుప్తు దేశంలోని సమృద్ధి అంతా మరచిపోబడుతుంది[a]; ఆ కరవు దేశాన్ని కబళిస్తుంది[b].
  to: వాటి తరువాత ఏడు సంవత్సరాల కరవు వస్తుంది. అప్పుడు ఐగుప్తు దేశంలోని సమృద్ధి అంతటినీ మరచిపోతారు[a]; ఆ కరవు దేశాన్ని కబళిస్తుంది[b].
  rationale: The revision replaces only the awkward Telugu passive with an idiomatic agent-unspecified construction. It retains the source’s sense that the previous abundance will pass from memory, preserves the scope of ‘all the abundance,’ and leaves the famine’s consuming effect appropriately broad.
