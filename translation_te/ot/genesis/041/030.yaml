source:
  edition: WLC
  text: וְ֠/קָמוּ שֶׁ֜בַע שְׁנֵ֤י רָעָב֙ אַחֲרֵי/הֶ֔ן וְ/נִשְׁכַּ֥ח כָּל הַ/שָּׂבָ֖ע בְּ/אֶ֣רֶץ מִצְרָ֑יִם וְ/כִלָּ֥ה הָ/רָעָ֖ב אֶת הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/030.yaml
  text: Then seven years of famine will arise after them[a], and all the abundance in the land of Egypt will be forgotten[b], and the famine will consume the land.
translation:
  language: te
  text: వాటి తరువాత ఏడు సంవత్సరాల కరవు వస్తుంది. అప్పుడు ఐగుప్తు దేశంలోని సమృద్ధి అంతటినీ మరచిపోతారు[a]; ఆ కరవు దేశాన్ని కబళిస్తుంది[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘పుష్కలత అంతా.’ హీబ్రూ పదం నిండుదనాన్ని లేదా సమృద్ధిని సూచిస్తుంది; ఇక్కడ అది కరవుకు వ్యతిరేకమైన స్థితిని తెలియజేస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘ఆ కరవు దేశాన్ని నాశనం చేస్తుంది.’ ఈ క్రియ పూర్తిగా తీరిపోయేలా చేయడం లేదా పాడుచేయడం అనే భావాన్ని కూడా ఇవ్వగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקָמוּ
  choice: వస్తుంది
  rationale: భవిష్యద్వాణి సందర్భంలో ఈ క్రియ రాబోయే కాలాన్ని సూచిస్తుంది. తెలుగులో కరవు ‘వస్తుంది’ అనడం సహజంగా ఉండి, క్రమానుసార భావాన్ని ముందున్న ‘వాటి తరువాత’ తెలియజేస్తుంది.
- source_word: שֶׁבַע שְׁנֵי רָעָב
  choice: ఏడు సంవత్సరాల కరవు
  rationale: హీబ్రూ సమాసంలోని కాలవ్యవధి, కరవు అనే భావాలు రెండింటినీ సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: אַחֲרֵיהֶן
  choice: వాటి తరువాత
  rationale: స్త్రీలింగ బహువచన ప్రత్యయం ముందటి వచనంలోని సమృద్ధిగల ఏడు సంవత్సరాలను సూచిస్తుంది; ‘వాటి తరువాత’ ఆ సూచనను అస్పష్టత లేకుండా సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וְנִשְׁכַּח
  choice: మరచిపోబడుతుంది
  rationale: నిఫల్ రూపంలోని కర్మణి భావాన్ని నిలుపుతూ, తీవ్రమైన కరవువల్ల పూర్వపు సమృద్ధి జ్ఞాపకం నుంచి తొలగిపోతుందనే అర్థాన్ని తెలియజేస్తుంది.
- source_word: כָּל הַשָּׂבָע
  choice: సమృద్ధి అంతా
  rationale: שָׂבָע అనేది నిండుదనం, పుష్కలత, సమృద్ధిని సూచిస్తుంది. దాన్ని కేవలం నిల్వధాన్యానికి పరిమితం చేయకుండా విస్తృత భావాన్ని ‘సమృద్ధి’ నిలుపుతుంది.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: ఐగుప్తు దేశంలోని
  rationale: హీబ్రూ భౌగోళిక పదబంధాన్ని పూర్తిగా ప్రతిబింబిస్తూ తెలుగులో సహజమైన సంబంధ రూపాన్ని ఉపయోగిస్తుంది.
- source_word: וְכִלָּה
  choice: కబళిస్తుంది
  rationale: כלה ఇక్కడ పూర్తిగా తీరిపోయేలా చేయడం లేదా నాశనం చేయడం అనే తీవ్రమైన భావాన్ని కలిగి ఉంది. ‘కబళిస్తుంది’ కరవు దేశాన్ని పూర్తిగా పాడుచేసే చిత్రాన్ని సహజంగా నిలుపుతుంది.
- source_word: הָרָעָב
  choice: ఆ కరవు
  rationale: ఇప్పటికే ప్రస్తావించిన నిర్దిష్ట కరవునే సూచిస్తున్నందున తెలుగు అనుసంధానానికి ‘ఆ’ ఉపయోగించబడింది.
- source_word: אֶת הָאָרֶץ
  choice: దేశాన్ని
  rationale: ఈ సందర్భంలో אָרֶץ ఐగుప్తు దేశాన్ని సూచిస్తుంది. ‘దేశాన్ని’ అనే పదం మొత్తం ప్రాంతంపై కరవు ప్రభావాన్ని తెలియజేస్తుంది.
