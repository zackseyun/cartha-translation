translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన వాక్య నిర్మాణం ఉపయోగించబడింది. ‘సమృద్ధి’ విస్తృత వ్యవసాయ-ఆర్థిక పుష్కలతను నిలుపుతుంది; ‘కబళిస్తుంది’ మూలంలోని తీవ్ర వినాశక చిత్రాన్ని సహజంగా వ్యక్తం చేస్తుంది. అన్ని పాదసూచిక గుర్తులు సంబంధిత పదబంధాల వెంట ప్రధాన పాఠ్యంలో ఉంచబడ్డాయి.
