  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/תְּחִלֶּ֜ינָה שֶׁ֣בַע שְׁנֵ֤י הָ/רָעָב֙ לָ/ב֔וֹא כַּ/אֲשֶׁ֖ר אָמַ֣ר יוֹסֵ֑ף וַ/יְהִ֤י רָעָב֙ בְּ/כָל הָ֣/אֲרָצ֔וֹת וּ/בְ/כָל אֶ֥רֶץ מִצְרַ֖יִם הָ֥יָה לָֽחֶם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/054.yaml
  text: And the seven years of famine began to come[a], just as Joseph had said. And there was famine in all the lands, but in all the land of Egypt there was bread.
translation:
  language: te
  text: యోసేపు చెప్పినట్లుగానే ఏడు కరవు సంవత్సరాలు రావడం మొదలైంది. దేశాలన్నిటిలో కరవు వచ్చింది; అయితే ఐగుప్తు దేశమంతటా ఆహారం[a] ఉంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “రొట్టె.” హీబ్రూ పదం సాధారణంగా ఆహారం లేదా ఆహార సరఫరాను కూడా సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּחִלֶּינָה שֶׁבַע שְׁנֵי הָרָעָב לָבוֹא
  choice: ఏడు కరవు సంవత్సరాలు రావడం మొదలైంది
  rationale: హీబ్రూ వాక్యంలోని ఆరంభార్థాన్ని, ‘రావడం’ అనే గమనార్థక భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: כַּאֲשֶׁר אָמַר יוֹסֵף
  choice: యోసేపు చెప్పినట్లుగానే
  rationale: כַּאֲשֶׁר తెలిపే ఖచ్చితమైన అనుగుణ్యతను ‘చెప్పినట్లుగానే’ స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: וַיְהִי רָעָב
  choice: కరవు వచ్చింది
  rationale: హీబ్రూ అస్తిత్వ నిర్మాణాన్ని తెలుగులో సహజమైన కథన ప్రయోగంతో వ్యక్తం చేస్తుంది.
- source_word: בְּכָל הָאֲרָצוֹת
  choice: దేశాలన్నిటిలో
  rationale: అֲרָצוֹת బహువచనాన్ని నిలుపుతూ, ఆధునిక తెలుగు పాఠకులకు సహజంగా అర్థమయ్యే పదబంధం.
- source_word: וּבְכָל אֶרֶץ מִצְרַיִם
  choice: అయితే ఐగుప్తు దేశమంతటా
  rationale: וְ రూపపరంగా ‘మరియు’ అయినా, మిగతా దేశాల్లోని కరవుకూ ఐగుప్తులోని ఆహార లభ్యతకూ మధ్య ఉన్న సందర్భసిద్ధమైన వ్యత్యాసాన్ని ‘అయితే’ తెలుగులో సహజంగా చూపిస్తుంది.
- source_word: הָיָה לָחֶם
  choice: ఆహారం ఉంది
  rationale: לֶחֶם అక్షరార్థంగా ‘రొట్టె’ అయినప్పటికీ, ఇక్కడ ఆహారం లేదా ధాన్య సరఫరా అనే విస్తృతార్థంలో వాడబడింది; సందర్భంలో ‘ఆహారం’ అపార్థాన్ని నివారిస్తుంది, అక్షరార్థాన్ని పాదసూచికలో నిలుపుతుంది.
