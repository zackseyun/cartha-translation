translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, మూలంలోని సమాంతర నిర్మాణాన్ని సాధ్యమైనంతవరకు నిలుపుతూ సహజమైన నామవాక్యాలు వాడబడ్డాయి. రెండో భాగంలోని וְ ను ‘కూడా’గా వ్యక్తం చేసి రెండు కలచిత్రాల సమాన వ్యాఖ్యానాన్ని స్పష్టం చేశాం.
