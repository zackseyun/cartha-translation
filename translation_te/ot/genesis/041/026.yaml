  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: שֶׁ֧בַע פָּרֹ֣ת הַ/טֹּבֹ֗ת שֶׁ֤בַע שָׁנִים֙ הֵ֔נָּה וְ/שֶׁ֤בַע הַֽ/שִּׁבֳּלִים֙ הַ/טֹּבֹ֔ת שֶׁ֥בַע שָׁנִ֖ים הֵ֑נָּה חֲל֖וֹם אֶחָ֥ד הֽוּא׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/026.yaml
  text: The seven good cows are seven years[a], and the seven good ears of grain are seven years; it is one dream.
translation:
  language: te
  text: ఆ ఏడు మంచి ఆవులు ఏడు సంవత్సరాలు; మరియు ఆ ఏడు మంచి ధాన్యపు వెన్నులు[a] ఏడు సంవత్సరాలు. అది ఒకే కల.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ధాన్యపు తలలు.” హెబ్రీ పదం కాండం పైభాగంలో ఉండే ధాన్యపు భాగాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּרֹת
  choice: ఆవులు
  rationale: ఈజిప్టు రాజు కలలో కనిపించినవి ప్రత్యేకంగా ఆడ పశువులు; ‘ఆవులు’ సహజమైన, నిర్దిష్టమైన తెలుగు సమానార్థకం.
- source_word: הַטֹּבֹת
  choice: మంచి
  rationale: విస్తృతార్థమున్న హెబ్రీ విశేషణానికి నేరుగా సరిపోతుంది; వాటిని కేవలం ఆరోగ్యవంతమైనవిగా లేదా అందమైనవిగా పరిమితం చేయదు.
- source_word: שָׁנִים
  choice: సంవత్సరాలు
  rationale: కలలోని సూచకాలకు ఇవ్వబడిన స్పష్టమైన అర్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: שִׁבֳּלִים
  choice: వెన్నులు
  rationale: ధాన్యపు కంకి/గింజలు ఉండే కాండపు పైభాగాన్ని సూచించే సాధారణ తెలుగు పదం; సందర్భంలో ధాన్యపు వెన్నులని స్పష్టంగా గ్రహించవచ్చు.
- source_word: חֲלוֹם אֶחָד הוּא
  choice: కల ఒక్కటే
  rationale: రెండు సూచక దృశ్యాలు ఒకే కలసందేశంగా ఉన్నాయనే హెబ్రీ ఏకవచన ఉద్ఘాటనను సంక్షిప్తంగా, సహజంగా నిలుపుతుంది.
- source_word: הֵנָּה
  choice: సంవత్సరాలు
  rationale: హెబ్రీ స్త్రీలింగ బహువచన సర్వనామం ఇక్కడ సంధానక క్రియలా పనిచేస్తుంది; తెలుగులో ప్రత్యేకంగా ‘అవి’ లేదా ‘ఉన్నాయి’ చేర్చకుండా నామవాక్యంగా చెప్పడం సహజం.
