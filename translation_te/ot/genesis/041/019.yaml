id: GEN.41.19
reference: Genesis 41:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הִנֵּ֞ה שֶֽׁבַע פָּר֤וֹת אֲחֵרוֹת֙ עֹל֣וֹת אַחֲרֵי/הֶ֔ן דַּלּ֨וֹת וְ/רָע֥וֹת תֹּ֛אַר מְאֹ֖ד וְ/רַקּ֣וֹת בָּשָׂ֑ר לֹֽא רָאִ֧יתִי כָ/הֵ֛נָּה בְּ/כָל אֶ֥רֶץ מִצְרַ֖יִם לָ/רֹֽעַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/019.yaml
  text: And behold[a], seven other cows came up after them, poor and very ugly in appearance and thin in flesh[b]. I had not seen any like them in all the land of Egypt for ugliness.
translation:
  language: te
  text: అప్పుడు ఇదిగో, వాటి వెనుక మరో ఏడు ఆవులు పైకి వచ్చాయి. అవి బలహీనంగా, చూడడానికి చాలా వికారంగా, ఒంటిమీద బాగా చిక్కిపోయినవిగా ఉన్నాయి. అంత అసహ్యంగా ఉన్న ఆవులను ఐగుప్తు దేశమంతటిలో నేనెప్పుడూ చూడలేదు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִנֵּה
  choice: అప్పుడు ఇదిగో
  rationale: కలలో తరువాత కనిపించిన దృశ్యాన్ని సజీవంగా పరిచయం చేసే హీబ్రూ సంభాషణా సూచకాన్ని సహజమైన తెలుగు కథన శైలిలో నిలుపుతుంది.
- source_word: שֶׁבַע פָּרוֹת אֲחֵרוֹת
  choice: మరో ఏడు ఆవులు
  rationale: פָּרוֹת ఆడ పశువులను సూచిస్తుంది; సందర్భంలో ‘ఆవులు’ ఖచ్చితమైనది. אֲחֵרוֹת సూచించే రెండవ సమూహాన్ని ‘మరో’ సహజంగా తెలియజేస్తుంది.
- source_word: עֹלֹת אַחֲרֵיהֶן
  choice: వాటి వెనుక ... పైకి వచ్చాయి
  rationale: నైలు నది నుండి పైకి రావడం అనే కలలోని కదలికను, ముందటి ఆవుల తరువాత రావడాన్ని రెండింటినీ నిలుపుతుంది.
- source_word: דַּלּוֹת
  choice: బలహీనంగా
  rationale: ఈ పదం శక్తిలేని, క్షీణించిన స్థితిని సూచిస్తుంది. తరువాతి ‘ఒంటిమీద మాంసం లేకుండా’ అనే వర్ణనతో అనవసర పునరుక్తి రాకుండా ‘బలహీనంగా’ ఎంచుకున్నాం.
- source_word: וְרָעוֹת תֹּאַר מְאֹד
  choice: చూడడానికి చాలా వికారంగా
  rationale: ఇక్కడ רָעוֹת నైతిక చెడును కాక రూపంలోని అసహ్యకరతను సూచిస్తుంది; ఈ తెలుగు ప్రయోగం దృశ్య భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: וְרַקּוֹת בָּשָׂר
  choice: ఒంటిమీద మాంసం లేకుండా
  rationale: అక్షరార్థంలోని ‘మాంసంలో సన్నగా’ అనే భావాన్ని సాధారణ పాఠకులకు సహజంగా అర్థమయ్యే విధంగా, ఆవుల అత్యంత కృశత్వాన్ని తెలియజేస్తూ అనువదిస్తుంది.
- source_word: לֹא רָאִיתִי כָהֵנָּה בְּכָל אֶרֶץ מִצְרַיִם
  choice: అలాంటి ఆవులను ఐగుప్తు దేశమంతటిలో నేనెప్పుడూ చూడలేదు
  rationale: ఫరో గతంలో ఎన్నడూ వాటికి సాటివాటిని చూడలేదనే బలమైన పోలికను సహజమైన తెలుగు వాక్యనిర్మాణంలో వ్యక్తం చేస్తుంది.
- source_word: לָרֹעַ
  choice: అంత దయనీయంగా ఉన్న
  rationale: చివరి హీబ్రూ పదబంధం ఆ ఆవుల రూపం, శారీరక స్థితి రెండింటి అసాధారణ అధ్వానతను సంక్షిప్తంగా బలపరుస్తుంది. ‘దయనీయంగా’ దానిని నైతిక చెడుగా తప్పుగా అర్థం చేసుకోకుండా విస్తృత భావాన్ని నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన కథన శైలి. మూలంలోని మూడు వరుస శారీరక వర్ణనల భేదాన్ని నిలుపుతూ కృత్రిమమైన అక్షరానువాదాన్ని నివారించాం.
