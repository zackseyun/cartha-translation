review_pass:
  verdict: revise
  source_fidelity: The draft accurately retains the second group of seven cows, their emergence after the first group, their weakness, extreme ugliness, and Pharaoh's unmatched comparison across Egypt. However, ‘ఒంటిమీద మాంసం లేకుండా’ (“with no flesh on their bodies”) overstates וְרַקּוֹת בָּשָׂר, which describes emaciation/thin flesh rather than a literal total absence of flesh. The final ‘అంత దయనీయంగా’ is broadly possible, but ‘అంత అసహ్యంగా’ more directly preserves the evaluative force in this appearance-focused context without suggesting merely pitiable circumstances.
  naturalness: The Telugu is generally fluent and appropriately narrative. ‘బాగా చిక్కిపోయినవిగా’ is a natural modern expression for the visibly emaciated condition of animals and avoids the draft's absolute formulation.
  terminology: ‘ఆవులు’ correctly renders the female bovines. ‘ఐగుప్తు దేశమంతటిలో’ is standard biblical-register Telugu. No theological terminology is at issue.
  issues:
  - severity: medium
    issue: ‘ఒంటిమీద మాంసం లేకుండా’ is too absolute for וְרַקּוֹת בָּשָׂר.
    rationale: The Hebrew depicts cows thin/emaciated in flesh, not literally fleshless. ‘బాగా చిక్కిపోయినవిగా’ conveys severe emaciation without adding an absolute claim.
  - severity: low
    issue: The final evaluative phrase ‘అంత దయనీయంగా’ is less specific than the immediate context of exceptionally bad-looking cows.
    rationale: While the Hebrew expression can carry a broad sense of wretched badness, the surrounding descriptors concern appearance and bodily condition. ‘అంత అసహ్యంగా’ gives a more direct contextual rendering.
  revised_text: అప్పుడు ఇదిగో, వాటి వెనుక మరో ఏడు ఆవులు పైకి వచ్చాయి. అవి బలహీనంగా, చూడడానికి చాలా వికారంగా, ఒంటిమీద బాగా చిక్కిపోయినవిగా ఉన్నాయి. అంత అసహ్యంగా ఉన్న ఆవులను ఐగుప్తు దేశమంతటిలో నేనెప్పుడూ చూడలేదు.
