id: GEN.41.39
reference: Genesis 41:39
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר פַּרְעֹה֙ אֶל יוֹסֵ֔ף אַחֲרֵ֨י הוֹדִ֧יעַ אֱלֹהִ֛ים אוֹתְ/ךָ֖ אֶת כָּל זֹ֑את אֵין נָב֥וֹן וְ/חָכָ֖ם כָּמֽוֹ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/039.yaml
  text: Then Pharaoh said to Joseph[a], “Since God has made all this known to you, there is no one as discerning and wise as you.”
translation:
  language: te
  text: అప్పుడు ఫరో యోసేపుతో, “దేవుడు నీకు ఇదంతా తెలియజేశాడు కనుక, నీలాగా వివేచనగలవాడూ జ్ఞానవంతుడూ మరెవ్వరూ లేరు” అన్నాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దేవుడు నీకు ఇదంతా తెలియజేసిన తర్వాత.” హీబ్రూ పదాన్ని మరింత అక్షరార్థంగా “తర్వాత” అని అనువదించవచ్చు; ఇక్కడ అది ఫరో చేసిన నిర్ధారణకు ఆధారాన్ని కూడా సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... అన్నాడు
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది; ఆధునిక తెలుగు కథన ప్రవాహంలో ‘అప్పుడు ... అన్నాడు’ సహజంగా క్రమాన్ని తెలియజేస్తుంది.
- source_word: פַּרְעֹה
  choice: ఫరో
  rationale: ఈజిప్టు రాజుకు వాడే ప్రామాణిక తెలుగు బైబిలు రూపం.
- source_word: אַחֲרֵי
  choice: కనుక
  rationale: మూలార్థం ‘తర్వాత’ అయినప్పటికీ, ఇక్కడ దేవుడు యోసేపుకు వెల్లడించిన సంగతిని ఫరో తాను చేసే నిర్ధారణకు ఆధారంగా చూపుతున్నాడు; ‘కనుక’ ఆ తార్కిక సంబంధాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: הוֹדִיעַ
  choice: తెలియజేశాడు
  rationale: ידע హిఫీల్ రూపంలోని ‘తెలిసేలా చేయడం, తెలియజేయడం’ అనే causative భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: אֱלֹהִים
  choice: దేవుడు
  rationale: క్రియారూపం మరియు సందర్భం ఏకవచన దైవసూచనను బలపరుస్తాయి.
- source_word: אֶת כָּל זֹאת
  choice: ఇదంతా
  rationale: యోసేపు వివరించిన మొత్తం విషయాన్ని సూచించే సంక్షిప్తమైన, సహజమైన తెలుగు రూపం.
- source_word: אֵין
  choice: మరెవ్వరూ లేరు
  rationale: ప్రతికూల అస్తిత్వ వాక్యాన్ని పోలికతో కలిపి ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: נָבוֹן
  choice: వివేచనగలవాడు
  rationale: పరిస్థితిని గ్రహించి తగిన నిర్ణయానికి వచ్చే అంతర్దృష్టిని సూచిస్తుంది; యోసేపు చూపిన గ్రహణశక్తికి సరిపోతుంది.
- source_word: וְחָכָם
  choice: జ్ఞానవంతుడు
  rationale: חכם యొక్క సాధారణ భావమైన జ్ఞానం, సమర్థమైన ఆలోచనను గౌరవప్రదమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: כָּמוֹךָ
  choice: నీలాగా
  rationale: ప్రతికూల అస్తిత్వ పోలికలో ‘నీ వంటి’ అనే భావాన్ని సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ఫరో మాటల్లో אֱלֹהִים యొక్క సూచన
  choice: దేవుడు
  alternative: దేవతలు
  rationale: אֱלֹהִים కొన్ని సందర్భాల్లో బహువచనార్థం ఇవ్వగలిగినా, ఇక్కడ ఏకవచన క్రియ మరియు యోసేపుకు వివరణను వెల్లడించిన దైవాన్ని సూచించే సమీప సందర్భం కారణంగా ‘దేవుడు’ సరైనది.
- issue: אַחֲרֵי యొక్క కాలార్థం లేదా కారణార్థం
  choice: కనుక
  alternative: తర్వాత
  rationale: మూలపదానికి ‘తర్వాత’ అనే కాలార్థం ఉన్నప్పటికీ, ఈ వాక్యంలో దేవుని వెల్లడి ఆధారంగా ఫరో యోసేపు వివేచనను నిర్ధారిస్తున్నాడు. కారణ/ఆధార సంబంధాన్ని ప్రధాన పాఠంలో సహజంగా చూపించి, మరింత రూపసామ్యమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలుపుతున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘వివేచనగలవాడు, జ్ఞానవంతుడు’ అనే జోడీ మూలంలోని נָבוֹן וְחָכָם భావభేదాన్ని నిలుపుతుంది. పాదసూచిక గుర్తు ప్రధాన వాక్యం చివర ఉంచబడింది.
