  to: యోసేపు తన జ్యేష్ఠ కుమారునికి మనష్షే[a] అని పేరు పెట్టాడు. ఎందుకంటే, “దేవుడు నన్ను నా కష్టమంతటినీ, నా తండ్రి ఇంటినంతటినీ మరచిపోయేలా చేశాడు” అని అతడు చెప్పాడు.[b]
