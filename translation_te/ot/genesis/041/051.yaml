source:
  edition: WLC
  text: וַ/יִּקְרָ֥א יוֹסֵ֛ף אֶת שֵׁ֥ם הַ/בְּכ֖וֹר מְנַשֶּׁ֑ה כִּֽי נַשַּׁ֤/נִי אֱלֹהִים֙ אֶת כָּל עֲמָלִ֔/י וְ/אֵ֖ת כָּל בֵּ֥ית אָבִֽ/י־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/051.yaml
  text: Joseph called the name of the firstborn Manasseh[a], for he said[c][b], “God has made me forget all my hardship and all my father’s house.”
translation:
  language: te
  text: యోసేపు తన జ్యేష్ఠ కుమారునికి మనష్షే[a] అని పేరు పెట్టాడు. ఎందుకంటే, “దేవుడు నన్ను నా కష్టమంతటినీ, నా తండ్రి ఇంటినంతటినీ మరచిపోయేలా చేశాడు” అని అతడు చెప్పాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘మనష్షే’ అనే పేరు హీబ్రూలో ‘మరచిపోయేలా చేయడం’ అనే అర్థమున్న పదంతో శబ్దసామ్యం కలిగివుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘నా తండ్రి ఇల్లు’ అనేది ఒకరి పితృకుటుంబాన్ని లేదా కుటుంబగృహాన్ని సూచించే హీబ్రూ నుడికారం.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּקְרָא יוֹסֵף אֶת שֵׁם הַבְּכוֹר
  choice: యోసేపు తన జ్యేష్ఠ కుమారునికి ... అని పేరు పెట్టాడు
  rationale: హీబ్రూ వాక్యనిర్మాణం అక్షరార్థంగా ‘జ్యేష్ఠుని పేరును పిలిచాడు’ అయినా, ఆధునిక తెలుగులో ‘తన జ్యేష్ఠ కుమారునికి ... అని పేరు పెట్టాడు’ సహజంగా ఉండి, మూలంలోని ‘జ్యేష్ఠుడు’ అనే స్పష్టమైన వివరాన్ని నిలుపుతుంది.
- source_word: מְנַשֶּׁה
  choice: మనష్షే
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు ధ్వన్యనుసారంగా లిప్యంతరీకరించాం. తరువాత వచ్చే נַשַּׁנִי (‘మరచిపోయేలా చేశాడు’) అనే క్రియతో ఉన్న శబ్దసామ్యాన్ని పాదసూచిక వివరిస్తుంది.
- source_word: כִּי
  choice: ఎందుకంటే ... అని అతడు అన్నాడు
  rationale: ఈ సంధిపదం పేరుకు కారణాన్ని పరిచయం చేస్తుంది. తెలుగులో ఉద్ధరణతో కారణవివరణ స్పష్టంగా, సహజంగా ఉండేందుకు మూలంలో అంతర్లీనంగా ఉన్న మాటల సూచనను ‘అని అతడు అన్నాడు’గా వ్యక్తం చేశాం.
- source_word: נַשַּׁנִי
  choice: నేను మరచిపోయేలా చేశాడు
  rationale: נשה అనే ధాతువు ఇక్కడ కారణార్థక భావాన్ని ఇస్తుంది; అందువల్ల ‘నన్ను మరపింపజేశాడు’ కంటే ప్రస్తుత వాడుకలో సహజమైన ‘నేను మరచిపోయేలా చేశాడు’ ఎంచుకున్నాం.
- source_word: אֱלֹהִים
  choice: దేవుడు
  rationale: రూపపరంగా బహువచన ఆకృతి ఉన్నా, సందర్భం మరియు ఏకవచన క్రియ ఆధారంగా ఇక్కడ ఏకవచన ‘దేవుడు’ సరైనది.
- source_word: כָּל עֲמָלִי
  choice: నా కష్టమంతటినీ
  rationale: עָמָל కష్టం, బాధ, శ్రమ అనే విస్తృత భావాలను కలిగి ఉంటుంది. యోసేపు అనుభవించిన బాధాకర పరిస్థితుల మొత్తాన్ని ‘కష్టమంతటినీ’ సహజంగా తెలియజేస్తుంది.
- source_word: וְאֵת כָּל בֵּית אָבִי
  choice: నా తండ్రి ఇంటివారందరినీ
  rationale: ‘తండ్రి ఇల్లు’ అనేది పితృవంశ కుటుంబం లేదా కుటుంబగృహాన్ని సూచించే హీబ్రూ బంధుత్వ నుడికారం. ఆధునిక తెలుగులో ‘నా తండ్రి ఇంటివారందరినీ’ దాని కుటుంబార్థాన్ని స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: యోసేపు తన తండ్రి ఇంటివారిని ‘మరచిపోయాడు’ అనే మాటలోని ఉద్రిక్తత
  choice: దేవుడు తన కష్టాన్నీ తండ్రి ఇంటివారినీ తాను మరచిపోయేలా చేశాడనే యోసేపు వివరణను నేరుగా నిలిపాం.
  alternative: తండ్రి ఇంటికి సంబంధించిన బాధను దేవుడు తగ్గించాడని లేదా ఇది కేవలం అతిశయోక్తి అని వ్యాఖ్యానాత్మకంగా మార్చడం.
  rationale: హీబ్రూ పాఠం ‘నా కష్టమంతటినీ, నా తండ్రి ఇంటినంతటినీ’ మరచేలా చేశాడని సూటిగా చెబుతుంది. ఆ వేదాంతపరమైన, భావోద్వేగపరమైన ఉద్రిక్తతను అనువాదంలో సవరించకుండా నిలుపడం సముచితం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలిని వాడాం. ‘జ్యేష్ఠ కుమారుడు’ బైబిలు సందర్భానికి తగిన గంభీరతతో పాటు సాధారణ పాఠకుడికి అర్థమయ్యే పదం. మూలంలోని నామకరణ పదప్రయోగాన్ని పాదసూచికలో ఉంచి, ప్రధాన వాక్యాన్ని సహజంగా తీర్చిదిద్దాం.
