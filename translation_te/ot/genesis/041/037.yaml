  yaml_path: translation/ot/genesis/041/037.yaml
  text: The matter seemed good in the eyes of Pharaoh and in the eyes of all his servants[a][b].
translation:
  language: te
  text: ఆ విషయం ఫరో దృష్టిలోనూ, అతని సేవకులందరి దృష్టిలోనూ మంచిదిగా అనిపించింది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּיטַב
  choice: మంచిదిగా అనిపించింది
  rationale: יטב అనే క్రియ בְּעֵינֵי అనే ప్రయోగంతో కలిసినప్పుడు ఒక విషయం ఎవరికైనా మంచిదిగా, ఆమోదయోగ్యంగా తోచిందనే మూల్యాంకన భావాన్ని వ్యక్తం చేస్తుంది. ఈ అనువాదం కర్తగా ఉన్న ‘విషయం’ను అలాగే ఉంచుతుంది.
- source_word: הַדָּבָר
  choice: ఆ విషయం
  rationale: דָּבָר విస్తృతార్థక పదం. ఇక్కడ ముందుగా చెప్పబడిన యోసేపు సలహాను సూచిస్తున్నప్పటికీ, మూలంలోని సాధారణ పదాన్ని అనవసరంగా ‘ప్రతిపాదన’గా కుదించకుండా ‘ఆ విషయం’గా అనువదించాం.
- source_word: בְּעֵינֵי
  choice: దృష్టిలో
  rationale: ‘కళ్లలో’ అనే అక్షరార్థ రూపం ఆధునిక తెలుగులో అసహజంగా ఉంటుంది. ‘దృష్టిలో’ మూలంలోని దృశ్యరూపకాన్ని కొంత నిలుపుతూ, ఎవరి అంచనాలోనైనా లేదా అభిప్రాయంలోనైనా అనే భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: פַרְעֹה
  choice: ఫరో
  rationale: ఈజిప్టు రాజబిరుదుకు తెలుగులో ప్రామాణికంగా వాడే రూపం.
- source_word: כָּל עֲבָדָיו
  choice: అతని సేవకులందరి
  rationale: עֲבָדִים అనే పదానికి సేవకులు, దాసులు, రాజోద్యోగులు అనే అర్థాలు సందర్భానుసారం ఉండవచ్చు. రాజసభ సందర్భంలో హోదాను అతిగా నిర్దిష్టం చేయకుండా ‘సేవకులు’ మూలంలోని విస్తృతిని కాపాడుతుంది.
