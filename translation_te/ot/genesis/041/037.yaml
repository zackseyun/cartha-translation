translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవభరితమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. మూలంలోని ‘ఫరో దృష్టిలోనూ … సేవకులందరి దృష్టిలోనూ’ అనే సమాంతర నిర్మాణాన్ని నిలిపి ఉంచాం.
