  yaml_path: translation/ot/genesis/041/018.yaml
  text: And behold[a], seven cows were coming up from the Nile, healthy in flesh and beautiful in form[c][b], and they grazed in the reeds.
translation:
  language: te
  text: ఇదిగో, నైలు నదినుండి పుష్టిగా, చక్కని ఆకారమున్న ఏడు ఆవులు పైకి వచ్చాయి; అవి చిత్తడి పచ్చికలో మేస్తున్నాయి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: కలలోని దృశ్యాన్ని సజీవంగా పరిచయం చేసే హీబ్రూ సూచనార్థక సంభాషణా పదాన్ని సహజమైన, గౌరవప్రదమైన తెలుగులో నిలుపుతుంది.
- source_word: מִן הַיְאֹר
  choice: నైలు నదిలోనుండి
  rationale: ఐగుప్తు నేపథ్యంలోని יְאֹר సాధారణ నదికన్నా ప్రత్యేకంగా నైలు నదినే సూచిస్తుంది.
- source_word: עֹלֹת
  choice: పైకి వచ్చి
  rationale: స్త్రీలింగ బహువచన కృదంతం చూపించే దృశ్యమాన గమనాన్ని తెలుగులో సహజమైన వరుసక్రియగా వ్యక్తం చేస్తుంది.
- source_word: שֶׁבַע פָּרוֹת
  choice: ఏడు ఆవులు
  rationale: פָּרוֹת ఆడ పశువులను స్పష్టంగా సూచిస్తుంది; ‘ఆవులు’ ఖచ్చితమైన సాధారణ తెలుగు పదం.
- source_word: בְּרִיאוֹת בָּשָׂר
  choice: దేహదారుఢ్యంగల
  rationale: శరీరంలో పుష్టిగా, బలంగా ఉన్నాయనే భావాన్ని ‘లావైన’ అని మాత్రమే కుదించకుండా సహజంగా అందిస్తుంది.
- source_word: וִיפֹת תֹּאַר
  choice: అందమైన ఆకారంగల
  rationale: ఆకృతి లేదా రూపం అందంగా ఉందనే హీబ్రూ భావాన్ని దగ్గరగా నిలుపుతుంది.
- source_word: וַתִּרְעֶינָה
  choice: మేస్తున్నాయి
  rationale: జంతువులు గడ్డి తినడాన్ని సూచించే רעה క్రియకు సహజమైన తెలుగు సమానార్థకం; దృశ్యంలో కొనసాగుతున్న క్రియను కూడా తెలియజేస్తుంది.
- source_word: בָּאָחוּ
  choice: రెల్లుగడ్డిలో
  rationale: నైలు తీరంలోని చిత్తడి నేల వృక్షసంపదను సూచిస్తుంది; సాధారణ ‘పచ్చికబయలు’ కంటే నీటితీర నేపథ్యాన్ని మెరుగ్గా నిలుపుతుంది.
