  register: ఆధునిక ప్రామాణిక తెలుగులో సులభంగా అర్థమయ్యే, గౌరవప్రదమైన కథన శైలి. మూలంలోని దృశ్యాత్మకతను నిలుపుతూ కృత్రిమ పదక్షర అనువాదాన్ని నివారించింది.
