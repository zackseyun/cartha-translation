source:
  edition: WLC
  text: וַ/תָּבֹ֣אנָה אֶל קִרְבֶּ֗/נָה וְ/לֹ֤א נוֹדַע֙ כִּי בָ֣אוּ אֶל קִרְבֶּ֔/נָה וּ/מַרְאֵי/הֶ֣ן רַ֔ע כַּ/אֲשֶׁ֖ר בַּ/תְּחִלָּ֑ה וָ/אִיקָֽץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/021.yaml
  text: And they went into their bellies[a], but it was not known that they had gone into their bellies, and their appearance was bad, just as at the beginning[b]. Then I awoke.
translation:
  language: te
  text: ఆ లావైన ఆవులు ఆ సన్నని, చెడ్డ ఆవుల కడుపుల్లోకి చేరిపోయాయి; అయినా అవి వాటి కడుపుల్లోకి చేరాయని తెలియలేదు. ఆ సన్నని ఆవులు మొదట్లో ఉన్నట్లే చెడుగా కనిపించాయి. అప్పుడు నేను మేల్కొన్నాను.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పదబంధానికి అక్షరార్థం ‘వాటి లోపలి భాగంలోకి’ లేదా ‘వాటి మధ్యలోకి’; ఈ స్వప్న సందర్భంలో ‘వాటి కడుపుల్లోకి’ అని అనువదించబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּבֹאנָה
  choice: వెళ్లిపోయాయి
  rationale: בוא అనే క్రియ యొక్క కథన క్రమంలోని రూపం. కడుపుల లోపలికి ప్రవేశించడాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: אֶל קִרְבֶּנָה
  choice: వాటి కడుపుల్లోకి
  rationale: קֶרֶב అక్షరార్థంగా ‘లోపలి భాగం/మధ్య’ అని అర్థమిస్తుంది; ఆవులు ఆవులను మింగిన స్వప్న సందర్భంలో ‘కడుపుల్లోకి’ అనే రూపం దృశ్యాన్ని స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וְלֹא נוֹדַע
  choice: తెలియనేలేదు
  rationale: ידע నిఫాల్ రూపంలోని గ్రహించలేకపోవడం లేదా బయటికి కనబడకపోవడం అనే భావాన్ని, నిష్క్రియాత్మకతను అతిగా కృత్రిమంగా చేయకుండా తెలుగులో తెలియజేస్తుంది.
- source_word: כִּי בָאוּ אֶל קִרְבֶּנָה
  choice: అవి వాటి కడుపుల్లోకి వెళ్లినట్టు
  rationale: మూలంలోని పునరుక్తిని నిలిపి, ఏమి తెలియలేదో స్పష్టంగా తెలియజేస్తుంది.
- source_word: וּמַרְאֵיהֶן רַע
  choice: వాటి రూపం … వికారంగా ఉంది
  rationale: מַרְאֶה కనిపించే రూపాన్ని సూచిస్తుంది; ఈ సందర్భంలోని רַע ను ‘వికారంగా’ అనడం క్షీణించి చెడ్డగా కనిపించిన భావాన్ని సహజంగా అందిస్తుంది.
- source_word: כַּאֲשֶׁר בַּתְּחִלָּה
  choice: మొదట్లో ఉన్నట్టే
  rationale: తిన్న తరువాత కూడా వాటి రూపం స్వప్నం ఆరంభంలో ఉన్న స్థితితో మారలేదనే కాలసంబంధ పోలికను కాపాడుతుంది.
- source_word: וָאִיקָץ
  choice: అప్పుడు నేను మేల్కొన్నాను
  rationale: స్వప్న వర్ణనను ముగించే కథన క్రమాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
