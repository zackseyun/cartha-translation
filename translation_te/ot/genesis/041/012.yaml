id: GEN.41.12
reference: Genesis 41:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/שָׁ֨ם אִתָּ֜/נוּ נַ֣עַר עִבְרִ֗י עֶ֚בֶד לְ/שַׂ֣ר הַ/טַּבָּחִ֔ים וַ/נְּ֨סַפֶּר ל֔/וֹ וַ/יִּפְתָּר לָ֖/נוּ אֶת חֲלֹמֹתֵ֑י/נוּ אִ֥ישׁ כַּ/חֲלֹמ֖/וֹ פָּתָֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/012.yaml
  text: And there with us was a young Hebrew man[a], a servant of the captain of the guard, and we told him, and he interpreted our dreams for us[c][b]; he interpreted each man's dream according to his dream.
translation:
  language: te
  text: అక్కడ మాతోపాటు కాపలాదళాధిపతికి చెందిన బానిస అయిన ఒక హీబ్రూ యువకుడు ఉన్నాడు.[a] మేము అతనికి మా కలలు చెప్పాము, అతడు మా కలలకు అర్థం చెప్పాడు; ప్రతి ఒక్కరి కలకు తగినట్లుగా అర్థం చెప్పాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'అక్షరార్థంగా: “కాపలాదళాధిపతికి చెందిన ఒక హీబ్రూ యువకుడు, ఒక బానిస.”'
    reason: హీబ్రూ వాక్యంలోని వరుస విశేషణాలు మరియు బానిస అనే అప్పోజిషన్‌ను చూపించేందుకు.
  - marker: b
    text: 'హీబ్రూ అక్షరార్థానికి దగ్గరగా: “ప్రతి వ్యక్తికి అతని కల ప్రకారం అతడు అర్థం చెప్పాడు.”'
    reason: చివరి మాటలలోని వ్యక్తివ్యక్తికి అనుగుణమైన పంపిణీ భావాన్ని వెల్లడించేందుకు.
lexical_decisions:
- source_word: נַעַר עִבְרִי
  choice: ఒక హీబ్రూ యువకుడు
  rationale: נַעַר ఇక్కడ బాలుడు అనే అర్థం కంటే యువకుడిని సూచిస్తుంది; עִבְרִי జాతి గుర్తింపును సహజమైన తెలుగు క్రమంలో ‘హీబ్రూ యువకుడు’గా ఇచ్చాం.
- source_word: עֶבֶד לְשַׂר הַטַּבָּחִים
  choice: కాపలాదళాధిపతికి చెందిన దాసుడు
  rationale: עֶבֶדలోని బానిసత్వ స్థితిని ‘దాసుడు’ నిలుపుతుంది; לְ సంబంధం/చెందుదల భావాన్ని వ్యక్తం చేస్తుంది. שַׂר הַטַּבָּחִיםను సందర్భానుగుణ అధికార బిరుదుగా ‘కాపలాదళాధిపతి’ అని అనువదించాం.
- source_word: וַנְּסַפֶּר לוֹ
  choice: మేము అతనికి మా కలలు చెప్పగా
  rationale: ספר ఇక్కడ కలలను వివరించి చెప్పడాన్ని సూచిస్తుంది; తరువాతి క్రియతో సహజంగా అనుసంధానించేందుకు ‘చెప్పగా’ వాడాం.
- source_word: וַיִּפְתָּר לָנוּ אֶת חֲלֹמֹתֵינוּ
  choice: అతడు వాటికి అర్థం చెప్పాడు
  rationale: פתר కలల సందర్భంలో వాటి భావాన్ని వ్యాఖ్యానించడం. ‘అర్థం చెప్పాడు’ సాధారణ ఆధునిక తెలుగులో స్పష్టంగా ఉంటుంది; לָנוּ భావం తరువాతి పంపిణీ వాక్యంలోనూ వ్యక్తమవుతుంది.
- source_word: אִישׁ כַּחֲלֹמוֹ פָּתָר
  choice: ఎవరి కలకు తగిన అర్థాన్ని వారికి చెప్పాడు
  rationale: హీబ్రూ వాక్యంలోని వ్యక్తివ్యక్తికి అనుగుణమైన వ్యాఖ్యాన భావాన్ని సహజమైన తెలుగులో నిలిపాం; పునరుక్తిని తగ్గించినా పంపిణీ బలం కోల్పోలేదు.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. దీర్ఘమైన హీబ్రూ సమన్వయ వాక్యాన్ని తెలుగులో సహజంగా రెండు వాక్యాలుగా విభజించాం. ‘దాసుడు’ ద్వారా సామాజిక స్థితిని మృదువుపరచకుండా నిలిపాం.
