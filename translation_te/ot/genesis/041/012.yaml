review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the setting, Joseph’s Hebrew identity and youth, the official title, the reporting of dreams, and the individualized character of the interpretations. However, దాసుడు can be understood broadly as a servant or attendant in modern Telugu; బానిస more explicitly preserves the bonded status of עֶבֶד in this context. The final clause is best expressed with a direct distributive construction tied to each person’s dream.
  naturalness: The draft is generally fluent modern Telugu. Recasting the final clause as “ప్రతి ఒక్కరి కలకు తగినట్లుగా” is more idiomatic than “ఎవరి కలకు తగిన అర్థాన్ని వారికి,” while retaining the Hebrew’s individualized emphasis.
  terminology: Use బానిస for עֶבֶד to preserve the socially bonded sense without euphemism. Retain హీబ్రూ యువకుడు, కాపలాదళాధిపతి, and కలలకు అర్థం చెప్పాడు as clear, standard renderings.
  issues:
  - severity: medium
    issue: దాసుడు may understate עֶבֶד.
    rationale: Although దాసుడు can denote a slave, in current Telugu it can also function as a broad or deferential term for servant/devotee. Here the phrase identifies Joseph as belonging to the captain of the guard, so బానిస communicates the source’s bonded-status sense more clearly.
  - severity: low
    issue: The final distributive clause is slightly cumbersome.
    rationale: “ఎవరి కలకు తగిన అర్థాన్ని వారికి చెప్పాడు” is understandable, but the double reference to the individual is less natural. “ప్రతి ఒక్కరి కలకు తగినట్లుగా అర్థం చెప్పాడు” directly conveys איש כחלמו פתר.
