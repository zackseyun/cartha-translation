revisions:
- from: అక్కడ మాతోపాటు కాపలాదళాధిపతికి చెందిన దాసుడైన ఒక హీబ్రూ యువకుడు ఉన్నాడు.[a] మేము అతనికి మా కలలు చెప్పగా, అతడు వాటికి అర్థం చెప్పాడు; ఎవరి కలకు తగిన అర్థాన్ని వారికి చెప్పాడు.[b]
  to: అక్కడ మాతోపాటు కాపలాదళాధిపతికి చెందిన బానిస అయిన ఒక హీబ్రూ యువకుడు ఉన్నాడు.[a] మేము అతనికి మా కలలు చెప్పాము, అతడు మా కలలకు అర్థం చెప్పాడు; ప్రతి ఒక్కరి కలకు తగినట్లుగా అర్థం చెప్పాడు.[b]
  rationale: బానిస అనే పదం עֶבֶד యొక్క సందర్భోచితమైన బంధిత స్థితిని మరింత స్పష్టంగా నిలుపుతుంది. చివరి ఉపవాక్యాన్ని సహజమైన ఆధునిక తెలుగులో మార్చి, ప్రతి వ్యక్తి కలకు సరిపోయే వివరణ ఇచ్చాడనే హీబ్రూ ఉద్దేశాన్ని కాపాడాం. ఫుట్‌నోట్లు అనువాదంలోని తేడాలకు అనుగుణంగా నవీకరించబడ్డాయి.
