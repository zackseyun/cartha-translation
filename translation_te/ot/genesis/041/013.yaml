  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְהִ֛י כַּ/אֲשֶׁ֥ר פָּֽתַר לָ֖/נוּ כֵּ֣ן הָיָ֑ה אֹתִ֛/י הֵשִׁ֥יב עַל כַּנִּ֖/י וְ/אֹת֥/וֹ תָלָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/013.yaml
  text: 'And it happened just as he interpreted for us[a], so it was: me he restored to my office[b], but him he hanged.'
translation:
  language: te
  text: 'అతడు మాకు కలల అర్థం చెప్పినట్లుగానే జరిగింది: నన్నైతే నా పదవిలో తిరిగి నియమించాడు[a]; అతన్నైతే ఉరి తీశాడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నా మునుపటి స్థానంలో తిరిగి ఉంచాడు.’ హీబ్రూ నుడికారం అతడు తన పూర్వ అధికార స్థానానికి తిరిగి నియమించబడినట్లు సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר ... כֵּן הָיָה
  choice: చెప్పినట్లుగానే జరిగింది
  rationale: ఈ రెండు హీబ్రూ పదబంధాలు వివరణకూ ఫలితానికీ మధ్య ఉన్న ఖచ్చితమైన సరిపోలికను నొక్కిచెబుతాయి. తెలుగులో అనవసరమైన పునరుక్తి లేకుండా అదే భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: פָּתַר לָנוּ
  choice: మా కలలకు అర్థం చెప్పిన
  rationale: פתר అనేది ఈ సందర్భంలో కలను వివరించడం లేదా దాని అర్థం తెలియజేయడం. తెలుగులో కర్మను స్పష్టంగా పేర్కొనడం సందర్భానుగుణంగా సహజంగా ఉంటుంది.
- source_word: אֹתִי הֵשִׁיב
  choice: నన్నైతే ... తిరిగి నియమించాడు
  rationale: ముందుకు తెచ్చిన אֹתִי వల్ల కలిగే వ్యత్యాస ప్రాధాన్యాన్ని ‘నన్నైతే’ నిలుపుతుంది. ‘తిరిగి నియమించాడు’ పూర్వ అధికార స్థానంలో పునఃస్థాపనను సహజంగా తెలియజేస్తుంది.
- source_word: עַל כַּנִּי
  choice: నా పదవిలో
  rationale: ఇక్కడ כֵּן అనేది స్థిరమైన అధికార స్థానం లేదా బాధ్యతను సూచించే నుడికారం; ‘నా పదవిలో’ ఆ భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: וְאֹתוֹ תָלָה
  choice: అతన్నేమో ఉరితీయించాడు
  rationale: ‘అతన్నేమో’ రెండవ వ్యక్తికి వచ్చిన విరుద్ధ ఫలితాన్ని, హీబ్రూలోని కర్మ-ప్రాధాన్యాన్ని నిలుపుతుంది. న్యాయశిక్ష సందర్భంలో תלהను ‘ఉరితీయించాడు’ అని అనువదించడం సహజం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘నన్నైతే ... అతన్నేమో’ అనే నిర్మాణం హీబ్రూ వాక్యంలో ఉన్న రెండు విరుద్ధ ఫలితాల ప్రాధాన్యాన్ని నిలుపుతుంది.
