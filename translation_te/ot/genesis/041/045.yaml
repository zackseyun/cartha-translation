source:
  edition: WLC
  text: וַ/יִּקְרָ֨א פַרְעֹ֣ה שֵׁם יוֹסֵף֮ צָֽפְנַ֣ת פַּעְנֵחַ֒ וַ/יִּתֶּן ל֣/וֹ אֶת אָֽסְנַ֗ת בַּת פּ֥וֹטִי פֶ֛רַע כֹּהֵ֥ן אֹ֖ן לְ/אִשָּׁ֑ה וַ/יֵּצֵ֥א יוֹסֵ֖ף עַל אֶ֥רֶץ מִצְרָֽיִם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/045.yaml
  text: And Pharaoh called Joseph’s name Zaphenath-paneah[a], and he gave him Asenath, the daughter of Potiphera, the priest of On, as a wife[d][c][b]. And Joseph went out over the land of Egypt.
translation:
  language: te
  text: ఫరో యోసేపుకు “త్సాఫ్నతు-పానేయహు”[a] అని పేరు పెట్టాడు. ఓను[c] పట్టణపు యాజకుడైన పోతీఫెర కుమార్తె ఆసెనతును అతనికి భార్యగా ఇచ్చాడు. ఆ తరువాత యోసేపు ఐగుప్తు దేశమంతటా వెళ్లాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఈ ఐగుప్తీయ పేరుకు అర్థం నిశ్చయంగా తెలియదు; దీని లిప్యంతరీకరణకు, అర్థానికి వివిధ ప్రతిపాదనలు ఉన్నాయి.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “యోసేపు ఐగుప్తు దేశం మీదుగా బయలుదేరాడు.”
    reason: alternative_reading
  - marker: c
    text: ఓను అనేది ఐగుప్తీయ నగరం; గ్రీకు భాషలో అది తరువాత హెలియోపొలిస్‌గా ప్రసిద్ధి చెందింది.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּקְרָא ... שֵׁם יוֹסֵף
  choice: యోసేపుకు ... అని పేరు పెట్టాడు
  rationale: קרא + שׁם అనే హెబ్రీ నామకరణ ప్రయోగాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: צָפְנַת פַּעְנֵחַ
  choice: సాపెనతు-పానేయహు
  rationale: అర్థం అనిశ్చితమైన ఐగుప్తీయ పేరును అనువదించకుండా, హెబ్రీ రూపానికి దగ్గరగా లిప్యంతరీకరించాం.
- source_word: אָסְנַת בַּת פּוֹטִי פֶרַע
  choice: పోతీఫెర కుమార్తె ఆసెనతు
  rationale: వ్యక్తి పేర్లను తెలుగు ధ్వన్యనుసారంగా అందించి, సంబంధాన్ని సహజ తెలుగు పదక్రమంలో ఉంచాం.
- source_word: כֹּהֵן אֹן
  choice: ఓను పట్టణపు యాజకుడు
  rationale: כֹּהֵן ను ‘యాజకుడు’గా, אֹן ను హెబ్రీ స్థలనామ రూపంలో ఉంచాం; అది నగరమని పాఠ్యంలో స్పష్టం చేశాం.
- source_word: לְאִשָּׁה
  choice: భార్యగా
  rationale: వివాహ ఏర్పాటును సూచించే హెబ్రీ ప్రయోగానికి సంక్షిప్తమైన సహజ తెలుగు సమానం.
- source_word: וַיֵּצֵא יוֹסֵף עַל אֶרֶץ מִצְרָיִם
  choice: యోసేపు ఐగుప్తు దేశమంతటా పర్యటించాడు
  rationale: יצא మరియు עַל కలయిక ఇక్కడ దేశవ్యాప్త సంచారాన్ని సూచిస్తుంది; ‘పర్యటించాడు’ సహజంగా భావాన్ని అందిస్తుంది, అయితే ‘దేశం మీదుగా బయలుదేరాడు’ అనే మరింత రూపసన్నిహిత అర్థం కూడా సాధ్యం.
theological_decisions:
- issue: עַל אֶרֶץ מִצְרָיִם లో అధికార భావమా, భౌగోళిక సంచార భావమా
  choice: ఐగుప్తు దేశమంతటా పర్యటించాడు
  alternative: ఐగుప్తు దేశం మీదుగా బయలుదేరాడు
  rationale: సందర్భంలో యోసేపు దేశవ్యాప్తంగా తన బాధ్యతను నిర్వహించడానికి వెళ్లడం ప్రధానంగా కనిపిస్తుంది. అయినా עַל యొక్క సంక్షిప్త నిర్మాణం ప్రయాణం, పరిధి, పర్యవేక్షణ అనే భావాల మధ్య కొంత అనిశ్చితిని ఉంచుతుంది; ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే శైలి. పేర్లు మూల హెబ్రీ ధ్వనిరూపానికి దగ్గరగా లిప్యంతరీకరించబడ్డాయి. ‘ఓను’ తరువాత గ్రీకులో హెలియోపొలిస్‌గా ప్రసిద్ధి చెందిన ఐగుప్తీయ నగరం.
