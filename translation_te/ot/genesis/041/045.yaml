  to: ఫరో యోసేపుకు “త్సాఫ్నతు-పానేయహు”[a] అని పేరు పెట్టాడు. ఓను[c] పట్టణపు యాజకుడైన పోతీఫెర కుమార్తె ఆసెనతును అతనికి భార్యగా ఇచ్చాడు. ఆ తరువాత యోసేపు ఐగుప్తు దేశమంతటా వెళ్లాడు.[b]
