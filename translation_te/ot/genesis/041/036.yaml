source:
  edition: WLC
  text: וְ/הָיָ֨ה הָ/אֹ֤כֶל לְ/פִקָּדוֹן֙ לָ/אָ֔רֶץ לְ/שֶׁ֨בַע֙ שְׁנֵ֣י הָ/רָעָ֔ב אֲשֶׁ֥ר תִּהְיֶ֖יןָ בְּ/אֶ֣רֶץ מִצְרָ֑יִם וְ/לֹֽא תִכָּרֵ֥ת הָ/אָ֖רֶץ בָּ/רָעָֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/036.yaml
  text: That food shall be a reserve for the land for the seven years of famine that will be in the land of Egypt[c][b][a], so that the land may not be cut off by the famine.
translation:
  language: te
  text: ఆ ఆహారం ఐగుప్తు దేశంలో రానున్న ఏడు కరవు సంవత్సరాల కోసం దేశానికి నిల్వగా[a][c] ఉంటుంది; తద్వారా కరవువల్ల దేశం తుడిచిపెట్టుకుపోదు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘భద్ర నిల్వగా’ / ‘నిల్వ కోసం’.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘దేశం తెగిపోకుండా’; సందర్భంలో కరవువల్ల దేశం నాశనం కాకుండా లేదా అంతరించిపోకుండా ఉండడమే భావం.
    reason: lexical_alternative
  - marker: c
    text: లేదా ‘దేశం కోసం, ఏడు కరవు సంవత్సరాలకు’.
    reason: previous_rendering
lexical_decisions:
- source_word: וְהָיָה
  choice: ఉంటుంది
  rationale: ఈ సూచనాత్మక, భవిష్యత్ సందర్భంలో సంయుక్త పరిపూర్ణ క్రియ ఉద్దేశించిన భవిష్యత్ ఫలితాన్ని తెలియజేస్తుంది.
- source_word: הָאֹכֶל
  choice: ఆ ఆహారం
  rationale: ఈ నామవాచకం విస్తృతంగా ‘ఆహారం’ అని అర్థమిస్తుంది; ‘ఆ’ అనేది ముందటి వచనంలో సమకూర్చిన పంటను తిరిగి సూచిస్తుంది.
- source_word: לְפִקָּדוֹן
  choice: నిల్వగా
  rationale: భవిష్యత్ అవసరానికి భద్రంగా ఉంచిన సరుకును సూచించే ఈ పదానికి ఆధునిక తెలుగులో ‘నిల్వ’ సహజంగా సరిపోతుంది.
- source_word: לָאָרֶץ
  choice: దేశానికి
  rationale: ఇక్కడ אֶרֶץ భూభాగం కంటే ఐగుప్తు దేశాన్ని, దాని ప్రజలను సమష్టిగా సూచిస్తుంది.
- source_word: לְשֶׁבַע שְׁנֵי הָרָעָב
  choice: ఏడు కరవు సంవత్సరాల కోసం
  rationale: ఇప్పటికే కలలోనూ దాని వివరణలోనూ ప్రస్తావించిన నిర్దిష్టమైన ఏడు సంవత్సరాలను సూచిస్తుంది.
- source_word: אֲשֶׁר תִּהְיֶיןָ בְּאֶרֶץ מִצְרָיִם
  choice: ఐగుప్తు దేశంలో రానున్న
  rationale: సంబంధ వాక్యం భవిష్యత్తులో ఐగుప్తులో సంభవించబోయే కరవు సంవత్సరాలను వివరిస్తుంది.
- source_word: וְלֹא תִכָּרֵת הָאָרֶץ
  choice: దేశం తుడిచిపెట్టుకుపోకుండా ఉంటుంది
  rationale: כרת నిఫాల్ రూపంలోని ‘తెగగొట్టబడడం/నిర్మూలం కావడం’ అనే బలమైన రూపకాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది; ఇక్కడ భావం దేశం కరవుచేత నాశనం కాకపోవడం.
- source_word: בָּרָעָב
  choice: కరవువల్ల
  rationale: బే అనే ఉపసర్గ ఇక్కడ దేశం నాశనం కావడానికి కారణం లేదా సాధనాన్ని సూచిస్తుంది.
