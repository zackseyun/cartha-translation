translation_notes:
  register: సాధారణ ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, స్పష్టమైన వాక్య నిర్మాణం వాడబడింది. ‘ఆహారం’ మూలపదపు విస్తృత అర్థాన్ని నిలుపుతుంది; ‘తుడిచిపెట్టుకుపోకుండా’ అనే రూపం כרת యొక్క బలమైన చిత్రాన్ని తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
