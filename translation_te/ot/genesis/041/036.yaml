revisions:
- from: ఆ ఆహారం ఐగుప్తు దేశంలో రానున్న ఏడు కరవు సంవత్సరాల కోసం దేశానికి నిల్వగా[a][c] ఉంటుంది. అప్పుడు కరవువల్ల దేశం తుడిచిపెట్టుకుపోకుండా[b] ఉంటుంది.
  to: ఆ ఆహారం ఐగుప్తు దేశంలో రానున్న ఏడు కరవు సంవత్సరాల కోసం దేశానికి నిల్వగా[a][c] ఉంటుంది; తద్వారా కరవువల్ల దేశం తుడిచిపెట్టుకుపోదు[b].
