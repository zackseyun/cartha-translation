translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘ఇదిగో’ ద్వారా కల దృశ్యంలోని సజీవత్వం నిలుపబడింది. మూలంలో ఒకే వాక్యంగా ఉన్న నిర్మాణాన్ని తెలుగులో సులభంగా చదవడానికి రెండు వాక్యాలుగా విభజించాం.
