source:
  edition: WLC
  text: וְ/הִנֵּ֞ה שֶׁ֧בַע פָּר֣וֹת אֲחֵר֗וֹת עֹל֤וֹת אַחֲרֵי/הֶן֙ מִן הַ/יְאֹ֔ר רָע֥וֹת מַרְאֶ֖ה וְ/דַקּ֣וֹת בָּשָׂ֑ר וַֽ/תַּעֲמֹ֛דְנָה אֵ֥צֶל הַ/פָּר֖וֹת עַל שְׂפַ֥ת הַ/יְאֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/003.yaml
  text: And behold[a], seven other cows came up after them from the Nile, ugly in appearance and thin in flesh[b], and they stood beside the cows on the bank of the Nile.
translation:
  language: te
  text: 'ఇదిగో, చూడటానికి వికారంగా, బక్కచిక్కిన వేరే ఏడు ఆవులు వాటి తరువాత నైలు నది[a]లోనుండి పైకి వచ్చాయి. అవి నైలు నది ఒడ్డున ఆ ఆవుల పక్కన నిలిచాయి.[b]


    [a] హీబ్రూలో “నది”; ఐగుప్తు నేపథ్యాన్ని బట్టి ఇక్కడ నైలు నదిని సూచిస్తుంది.


    [b] లేదా, “రూపంలో చెడ్డవిగా, మాంసం సన్నగా ఉన్నవిగా.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో “నది”; ఐగుప్తు నేపథ్యాన్ని బట్టి ఇక్కడ నైలు నదిని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “రూపంలో చెడ్డవిగా, మాంసం సన్నగా ఉన్నవిగా.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: అప్పుడు ఇదిగో
  rationale: కలలో అకస్మాత్తుగా కనిపించిన దృశ్యాన్ని సజీవంగా చూపించే హీబ్రూ సూచనాత్మక కథన పదబంధాన్ని నిలుపుతుంది.
- source_word: פָּרוֹת
  choice: ఆవులు
  rationale: స్త్రీలింగ బహువచనం కావడంతో సాధారణ ‘పశువులు’ కంటే ‘ఆవులు’ స్పష్టమైనది; వయస్సు తెలియనందున ‘పెయ్యలు’ అని ప్రత్యేకీకరించలేదు.
- source_word: אֲחֵרוֹת
  choice: వేరే
  rationale: మొదటి ఏడు ఆవులకంటే భిన్నమైన రెండవ సమూహాన్ని సహజమైన తెలుగులో సూచిస్తుంది.
- source_word: עֹלוֹת ... מִן הַיְאֹר
  choice: నైలు నదిలోనుంచి పైకి వచ్చాయి
  rationale: నదిలోనుంచి జంతువులు బయటికి రావడాన్ని సహజంగా తెలియజేస్తూ మూలంలోని ‘పైకి రావడం’ భావాన్ని కాపాడుతుంది.
- source_word: אַחֲרֵיהֶן
  choice: వాటి వెనుక
  rationale: ఈ సందర్భంలో క్రమాన్నీ, వాటి తరువాత రావడాన్నీ రెండింటినీ సూచించగల మూలభాషా భావాన్ని నిలుపుతుంది.
- source_word: הַיְאֹר
  choice: నైలు నది
  rationale: ఆదికాండంలోని ఐగుప్తు నేపథ్యంలో יְאֹר ప్రత్యేకంగా నైలు నదిని సూచిస్తుంది; మూలంలోని సాధారణ రూపం ‘నది’ అని పాదటిప్పణిలో తెలిపింది.
- source_word: רָעוֹת מַרְאֶה
  choice: చూడడానికి వికారంగా
  rationale: ఇది నైతిక చెడును కాక ఆకర్షణలేని రూపాన్ని వర్ణిస్తుంది; ఆధునిక తెలుగులో స్పష్టంగా, సహజంగా ఉంది.
- source_word: דַקּוֹת בָּשָׂר
  choice: శరీరాలు చిక్కిపోయి ఉన్న
  rationale: శారీరక కృశత్వాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; ‘మాంసం చిక్కినవి’ అనే మూలానికి దగ్గరైన రూపాన్ని పాదటిప్పణిలో ఉంచింది.
- source_word: וַתַּעֲמֹדְנָה
  choice: నిలిచాయి
  rationale: సరళమైన కథన క్రియకు నేరుగా సరిపడే తెలుగు రూపం.
- source_word: אֵצֶל
  choice: పక్కన
  rationale: సమీపంగా నిలవడాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: שְׂפַת הַיְאֹר
  choice: నైలు నది ఒడ్డున
  rationale: నది సందర్భంలో שָׂפָה అనే ‘అంచు/పెదవి’ రూపకానికి ‘ఒడ్డు’ సహజమైన తెలుగు సమానం.
