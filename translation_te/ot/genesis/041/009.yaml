source:
  edition: WLC
  text: וַ/יְדַבֵּר֙ שַׂ֣ר הַ/מַּשְׁקִ֔ים אֶת פַּרְעֹ֖ה לֵ/אמֹ֑ר אֶת חֲטָאַ֕/י אֲנִ֖י מַזְכִּ֥יר הַ/יּֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/009.yaml
  text: Then the chief cupbearer spoke to Pharaoh[a], saying, “Today I remember my offenses.”
translation:
  language: te
  text: 'అప్పుడు ముఖ్య పానదాయకుడు ఫరోతో ఇలా అన్నాడు: “ఈ రోజు నా అపరాధాలను[a] జ్ఞాపకం చేసుకుంటున్నాను.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “పాపాలను,” లేదా “తప్పులను.” హీబ్రూ పదం నైతికమైనదైనా, అధికార బాధ్యతకు సంబంధించినదైనా తప్పు ప్రవర్తనను విస్తృతంగా సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: అప్పుడు ... అన్నాడు
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది. తెలుగులో సహజమైన కథన క్రమాన్ని చూపడానికి ‘అప్పుడు’ వాడి, మాటను పరిచయం చేసే דברను ‘అన్నాడు’గా అనువదించాం.
- source_word: שַׂר הַמַּשְׁקִים
  choice: ముఖ్య పానదాయకుడు
  rationale: ఇది ఫరోకు పానీయాలు అందించే సేవపై బాధ్యతగల రాజసభ అధికారిని సూచిస్తుంది. ‘ముఖ్య పానదాయకుడు’ ఆధునిక తెలుగులో సంక్షిప్తంగా, స్పష్టంగా ఆ పదవిని తెలియజేస్తుంది.
- source_word: אֶת־פַּרְעֹה
  choice: ఫరోతో
  rationale: హీబ్రూలో ప్రత్యక్ష కర్మ సూచిక ఉన్నప్పటికీ, דבר అనే మాటలాడే క్రియతో తెలుగులో సంబోధిత వ్యక్తిని ‘తో’ ద్వారా సహజంగా వ్యక్తం చేస్తారు.
- source_word: לֵאמֹר
  choice: ఇలా అన్నాడు
  rationale: మాటలను పరిచయం చేసే హీబ్రూ క్రియారూపాన్ని తెలుగులో సహజమైన ప్రత్యక్ష వాక్య పరిచయంగా వ్యక్తం చేశాం.
- source_word: אֶת חֲטָאַי
  choice: నా అపరాధాలను
  rationale: חטא అనే పదం పాపాలు, అపరాధాలు, తప్పులు అనే విస్తృత భావాలను కలిగి ఉంటుంది. ఫరోకు వ్యతిరేకంగా జరిగిన రాజసభ సంబంధిత తప్పిదాన్ని గుర్తుచేసే సందర్భంలో ‘అపరాధాలు’ నైతిక, అధికారిక పార్శ్వాలు రెండింటినీ నిలుపుతుంది.
- source_word: אֲנִי מַזְכִּיר
  choice: జ్ఞాపకం చేసుకుంటున్నాను
  rationale: זכר యొక్క హిఫీల్ రూపానికి ‘జ్ఞాపకం చేయడం,’ ‘ప్రస్తావించడం,’ ‘మనసుకు తెచ్చుకోవడం’ అనే భావాలు ఉండవచ్చు. ఇక్కడ వక్త తన గత అపరాధాలను ఇప్పుడు మనసుకు తెచ్చుకొని ప్రస్తావిస్తున్నందున ఈ రూపం సహజంగా సరిపోతుంది.
- source_word: הַיּוֹם
  choice: ఈ రోజు
  rationale: కాల ప్రాధాన్యాన్ని నిలుపుతూ ఆధునిక ప్రామాణిక తెలుగులో సహజమైన రూపాన్ని ఎంచుకున్నాం.
theological_decisions:
- issue: חֲטָאַי అనే పదంలోని నైతిక మరియు అధికారిక తప్పిద భావాల పరిధి
  choice: అపరాధాలను
  alternative: పాపాలను; తప్పులను
  rationale: ‘పాపాలు’ అనే పదం భావాన్ని పూర్తిగా నైతిక-మతపరమైన దిశలో పరిమితం చేయవచ్చు; ‘తప్పులు’ తీవ్రతను తగ్గించవచ్చు. ‘అపరాధాలు’ సందర్భంలోని ఫరోకు వ్యతిరేకమైన తప్పిదాన్ని తెలియజేస్తూనే మూలపదంలోని విస్తృతిని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, రాజసభ సందర్భానికి తగిన గౌరవప్రదమైన శైలి. ప్రత్యక్ష వాక్య పరిచయాన్ని తెలుగులో సహజంగా కుదించాం; మూలంలోని పదార్థ పరిధిని పాదసూచికలో నిలిపాం.
