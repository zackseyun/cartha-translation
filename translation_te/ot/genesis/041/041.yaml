source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר פַּרְעֹ֖ה אֶל יוֹסֵ֑ף רְאֵה֙ נָתַ֣תִּי אֹֽתְ/ךָ֔ עַ֖ל כָּל אֶ֥רֶץ מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/041.yaml
  text: And Pharaoh said to Joseph, “See, I have set you over all the land of Egypt.”
translation:
  language: te
  text: 'ఫరో యోసేపుతో ఇలా అన్నాడు: “చూడు, ఐగుప్తు దేశమంతటిమీద నిన్ను నియమించాను.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... అన్నాడు
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది; ఆధునిక తెలుగులో ‘అప్పుడు’ సహజంగా కథన క్రమాన్ని తెలియజేస్తుంది.
- source_word: פַּרְעֹה
  choice: ఫరో
  rationale: ఈజిప్టు రాజుకు వాడే బిరుదుకు తెలుగులో స్థిరపడిన రూపం.
- source_word: אֶל יוֹסֵף
  choice: యోసేపుతో
  rationale: మాట్లాడే వ్యక్తి ఎవరిని ఉద్దేశించాడో తెలుగులో సహజంగా తెలిపే రూపం; వ్యక్తినామానికి ప్రాచుర్యంలో ఉన్న తెలుగు రూపం వాడబడింది.
- source_word: רְאֵה
  choice: చూడు
  rationale: ఈ ఆజ్ఞార్థక రూపం ప్రకటనపై శ్రద్ధ నిలపమని సూచిస్తుంది; ‘చూడు’ దాని సంభాషణాత్మక బలాన్ని నిలుపుతుంది.
- source_word: נָתַתִּי אֹתְךָ עַל
  choice: నిన్ను ... మీద నియమించాను
  rationale: נתן యొక్క మూలార్థం ‘ఇచ్చాను’ అయినప్పటికీ, עַל‌తో కూడిన ఈ పరిపాలనా సందర్భంలో అధికార స్థానంలో ఉంచడాన్ని సూచిస్తుంది; ‘నియమించాను’ తెలుగులో ఆ భావాన్ని స్పష్టంగా, సహజంగా అందిస్తుంది.
- source_word: כָּל אֶרֶץ מִצְרָיִם
  choice: ఐగుప్తు దేశమంతటిమీద
  rationale: כָּל యొక్క సమగ్ర పరిధినీ, אֶרֶץ యొక్క భూభాగం/రాజ్య భావాన్నీ నిలుపుతూ యోసేపు అధికార పరిధిని తెలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకునికి సులభంగా అర్థమయ్యే కథన శైలి. హెబ్రీ వాక్యంలోని గంభీర ప్రకటనను సహజ తెలుగు పదక్రమంతో అందించబడింది.
