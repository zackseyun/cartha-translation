  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/תִּרְעַב֙ כָּל אֶ֣רֶץ מִצְרַ֔יִם וַ/יִּצְעַ֥ק הָ/עָ֛ם אֶל פַּרְעֹ֖ה לַ/לָּ֑חֶם וַ/יֹּ֨אמֶר פַּרְעֹ֤ה לְ/כָל מִצְרַ֨יִם֙ לְכ֣וּ אֶל יוֹסֵ֔ף אֲשֶׁר יֹאמַ֥ר לָ/כֶ֖ם תַּעֲשֽׂוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/055.yaml
  text: And all the land of Egypt became hungry[a], and the people cried out to Pharaoh for bread. Pharaoh said to all Egypt, “Go to Joseph. What he says to you, do.”
translation:
  language: te
  text: ఈజిప్టు దేశమంతా ఆకలికి గురైంది. ప్రజలు రొట్టె కోసం ఫరోకు మొరపెట్టుకున్నారు. అప్పుడు ఫరో ఈజిప్టు వారందరితో, “యోసేపు దగ్గరికి వెళ్లండి. అతడు మీకు ఏమి చెబుతాడో, అది చేయండి.[a]” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, మరింత సహజంగా, “అతడు మీకు ఏమి చెబితే అది చేయండి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּרְעַב
  choice: ఆకలికి గురైంది
  rationale: רעב అనే క్రియ ఆకలి ఏర్పడడం లేదా దాన్ని అనుభవించడం అనే భావాన్ని ఇస్తుంది. ఈ ఎంపిక కథనంలోని పరిణామాన్ని నిలుపుతూ, ‘కరవు వచ్చింది’ అని సందర్భాన్ని అతిగా వివరించదు.
- source_word: כָּל אֶרֶץ מִצְרַיִם
  choice: ఈజిప్టు దేశమంతా
  rationale: హీబ్రూలో స్పష్టంగా ఉన్న ‘దేశం’ అనే అంశాన్ని నిలుపుతూ, ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: וַיִּצְעַק הָעָם
  choice: ప్రజలు ... మొరపెట్టుకున్నారు
  rationale: צעק ఆపదలో సహాయం కోసం చేసే తీవ్రమైన విన్నపాన్ని సూచిస్తుంది; ‘మొరపెట్టుకున్నారు’ ఆ భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: לַלָּחֶם
  choice: రొట్టె కోసం
  rationale: לֶחֶם అక్షరార్థంగా ‘రొట్టె’; సందర్భంలో ఆహారం లేదా ధాన్యానికి విస్తృత సూచన కావచ్చుగానీ, మూలపాఠానికి పారదర్శకంగా ఉండేందుకు ‘రొట్టె’ను ఉంచాం.
- source_word: לְכָל מִצְרַיִם
  choice: ఈజిప్టు వారందరితో
  rationale: స్థలనామాన్ని ప్రజలను సూచించే సమష్టి ప్రయోగంగా హీబ్రూ వాడింది. తెలుగులో అర్థం స్పష్టంగా ఉండేందుకు దాన్ని ‘ఈజిప్టు వారందరితో’ అని సహజంగా విప్పి చెప్పాం.
- source_word: לְכוּ אֶל יוֹסֵף
  choice: యోసేపు దగ్గరికి వెళ్లండి
  rationale: ఆజ్ఞార్థక రూపాన్ని నేరుగా, సహజంగా అనువదించాం; వ్యక్తిపేరుకు స్థిరపడిన తెలుగు రూపమైన ‘యోసేపు’ను వాడాం.
- source_word: אֲשֶׁר יֹאמַר לָכֶם תַּעֲשׂוּ
  choice: అతడు మీకు ఏమి చెబుతాడో అది చేయండి
  rationale: మూలంలోని సంబంధవాచక భాగాన్ని ముందుంచిన నిర్మాణం, దానిపై ఉన్న స్వల్ప ఉద్ఘాటన రెండింటినీ తెలుగులో అర్థవంతంగా నిలిపాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలిని అనుసరించాం. ‘ఆకలికి గురైంది,’ ‘మొరపెట్టుకున్నారు’ వంటి పదాలు సామాన్య పాఠకులకు స్పష్టంగా ఉండటంతో పాటు మూలంలోని తీవ్రతను నిలుపుతాయి. ప్రత్యామ్నాయ వాక్యనిర్మాణానికి సంబంధించిన [a] గుర్తును అది వర్తించే చివరి ఆజ్ఞ దగ్గర ఉంచాం.
