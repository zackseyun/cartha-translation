review_pass:
  verdict: revise
  source_fidelity: The main rendering accurately represents the narrative sequence, Egypt as a whole experiencing hunger, the people's urgent appeal to Pharaoh for bread, and Pharaoh's command to go to Joseph and do what he says. The footnote alternative, however, uses the past form “చెప్పినట్లు” (“as he told”), whereas the Hebrew imperfect יֹאמַר refers to what Joseph says/will say in the directive.
  naturalness: The translation is clear and natural modern standard Telugu. “ఆకలికి గురైంది” and “మొరపెట్టుకున్నారు” appropriately convey the progression and urgency without overstating the famine. A comma in the final quoted directive improves readability.
  terminology: “ఈజిప్టు,” “ఫరో,” and “యోసేపు” are standard and suitable. “రొట్టె” retains the literal sense of לֶחֶם; no explanatory expansion is required.
  issues:
  - severity: medium
    issue: Footnote [a] changes the time reference of Joseph's speech.
    rationale: “అతడు మీకు చెప్పినట్లు చేయండి” can mean “Do as he told you,” implying a completed prior instruction. It should instead retain the prospective/general sense of “what he says/will say to you.”
