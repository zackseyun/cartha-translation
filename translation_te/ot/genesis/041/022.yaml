translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘ఇదిగో’ ద్వారా హీబ్రూ వాక్యంలోని సజీవ దృశ్యప్రదర్శన నిలుపబడింది; కృదంతపు కొనసాగుతున్న చర్యను ‘వస్తున్నాయి’తో వ్యక్తం చేశాం.
