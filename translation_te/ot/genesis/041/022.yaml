id: GEN.41.22
reference: Genesis 41:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וָ/אֵ֖רֶא בַּ/חֲלֹמִ֑/י וְ/הִנֵּ֣ה שֶׁ֣בַע שִׁבֳּלִ֗ים עֹלֹ֛ת בְּ/קָנֶ֥ה אֶחָ֖ד מְלֵאֹ֥ת וְ/טֹבֽוֹת׀׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/022.yaml
  text: And I saw in my dream[a], and behold, seven ears of grain were coming up on one stalk, full and good.
translation:
  language: te
  text: “నా కలలో నేను చూశాను. ఇదిగో, ఒకే కాండం మీద నిండినవి, మంచివైనవి అయిన ఏడు ధాన్యపు కంకులు పైకి వస్తున్నాయి.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאֵרֶא
  choice: నేను చూశాను
  rationale: ראה అనే క్రియ యొక్క ప్రథమ పురుష ఏకవచన కథన రూపం; ఫరో కొనసాగిస్తున్న స్వీయ వర్ణనను సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: בַּחֲלֹמִי
  choice: నా కలలో
  rationale: పూర్వప్రత్యయం, నామవాచకం, ప్రథమ పురుష ఏకవచన ప్రత్యయం కలిసి నేరుగా ‘నా కలలో’ అనే అర్థాన్నిస్తాయి.
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: హిన్నే కలలో కనిపించిన దృశ్యాన్ని సజీవంగా, హఠాత్తుగా పాఠకుని ముందుంచుతుంది; ‘ఇదిగో’ ఆ ఉద్ఘాటనను నిలుపుతుంది.
- source_word: שֶׁבַע שִׁבֳּלִים
  choice: ఏడు ధాన్యపు వెన్నులు
  rationale: שִׁבֹּלֶת ఇక్కడ ధాన్యపు గింజలు ఉండే పై భాగాన్ని సూచిస్తుంది. ‘ధాన్యపు వెన్నులు’ వ్యవసాయ సందర్భానికి సరిపోయే సహజ తెలుగు పదబంధం.
- source_word: עֹלֹת
  choice: పైకి వస్తున్నాయి
  rationale: స్త్రీలింగ బహువచన కృదంతం దృశ్యంలో కొనసాగుతున్న చర్యను తెలియజేస్తుంది. ‘పైకి వస్తున్నాయి’ ఆ గమనాన్ని నిలుపుతూ, ‘మొలుస్తున్నాయి’ అని అర్థాన్ని మరీ నిర్దిష్టం చేయదు.
- source_word: בְּקָנֶה אֶחָד
  choice: ఒకే కాండం మీద
  rationale: קָנֶה ఇక్కడ ధాన్యాన్ని మోసే కాండాన్ని సూచిస్తుంది; אֶחָד వాటన్నిటికీ ఒకటే కాండమని నొక్కిచెబుతుంది.
- source_word: מְלֵאֹת
  choice: నిండుగా ఉన్న
  rationale: మూల విశేషణానికి నేరుగా సరిపోతుంది; ధాన్యపు వెన్నులు గింజలతో నిండివున్న దృశ్యాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וְטֹבוֹת
  choice: మంచిగా ఉన్న
  rationale: טוֹב యొక్క విస్తృతమైన ‘మంచి’ భావాన్ని నిలుపుతుంది; ‘ఆరోగ్యంగా’ లేదా ‘శ్రేష్ఠంగా’ అని అనవసరంగా కుదించదు.
