translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. మూలంలోని ఏకవచన ‘కరవు సంవత్సరం’ను నిలిపి, తెలుగు పాఠకునికి ఓన్ స్థలమని స్పష్టంగా ఉండేందుకు ‘పట్టణపు’ అని చేర్చబడింది. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
