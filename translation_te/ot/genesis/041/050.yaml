source:
  edition: WLC
  text: וּ/לְ/יוֹסֵ֤ף יֻלַּד֙ שְׁנֵ֣י בָנִ֔ים בְּ/טֶ֥רֶם תָּב֖וֹא שְׁנַ֣ת הָ/רָעָ֑ב אֲשֶׁ֤ר יָֽלְדָה לּ/וֹ֙ אָֽסְנַ֔ת בַּת פּ֥וֹטִי פֶ֖רַע כֹּהֵ֥ן אֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/050.yaml
  text: Before the year of famine came[a], two sons were born to Joseph, whom Asenath daughter of Potiphera, priest of On[b], bore to him.
translation:
  language: te
  text: కరవు సంవత్సరం రాకముందే[a] యోసేపుకు ఇద్దరు కుమారులు పుట్టారు. ఓన్ యాజకుడైన పోతీఫెరా కుమార్తె ఆసెనతు వారిని అతనికి కనింది.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ‘సంవత్సరం’ ఏకవచనంలో ఉంది; ఇది కరవు కాలం ప్రారంభాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ఓన్ ఐగుప్తులోని ఒక పట్టణం; తరువాత గ్రీకులో దీనిని హెలియోపొలిస్ అని పిలిచారు.
    reason: cultural_note
lexical_decisions:
- source_word: יֻלַּד ... שְׁנֵי בָנִים
  choice: ఇద్దరు కుమారులు పుట్టారు
  rationale: బహువచన కర్తతో ఉన్న ילד క్రియ యొక్క కర్మణి రూపాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: וּלְיוֹסֵף
  choice: యోసేపుకు
  rationale: జననాన్ని సూచించే కర్మణి వాక్యంలో ל సంబంధాన్ని తెలుగులో సహజంగా ‘యోసేపుకు’ అని అందిస్తుంది.
- source_word: בְּטֶרֶם תָּבוֹא שְׁנַת הָרָעָב
  choice: కరవు సంవత్సరం రాకముందే
  rationale: మూలంలోని ఏకవచన ‘సంవత్సరం’ను, ‘రావడం’ అనే క్రియా చిత్రణను నిలుపుతూ కాలసంబంధాన్ని స్పష్టంగా తెలుపుతుంది.
- source_word: אֲשֶׁר יָלְדָה לּוֹ
  choice: వారిని ... అతనికి కనింది
  rationale: సంబంధవాచక భాగం సూచించే ఇద్దరు కుమారులను ‘వారిని’తో స్పష్టం చేసి, לּוֹను ‘అతనికి’గా నిలుపుతుంది.
- source_word: אָסְנַת בַּת פּוֹטִי פֶרַע
  choice: పోతీఫెర కుమార్తె ఆసెనతు
  rationale: హీబ్రూ పేర్లను తెలుగు ధ్వన్యనుసారంగా లిప్యంతరీకరించి, వంశసంబంధాన్ని సహజమైన తెలుగు క్రమంలో తెలుపుతుంది.
- source_word: כֹּהֵן אֹן
  choice: ఓన్ పట్టణపు యాజకుడు
  rationale: כֹּהֵןకు సాధారణమైన ‘యాజకుడు’ను వాడి, ఓన్ ఒక స్థలమని పాఠ్యంలో సహజంగా స్పష్టం చేస్తుంది.
