  text: וְ/הִנֵּ֣ה מִן הַ/יְאֹ֗ר עֹלֹת֙ שֶׁ֣בַע פָּר֔וֹת יְפ֥וֹת מַרְאֶ֖ה וּ/בְרִיאֹ֣ת בָּשָׂ֑ר וַ/תִּרְעֶ֖ינָה בָּ/אָֽחוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/002.yaml
  text: And behold[a], seven cows were coming up from the Nile, beautiful in appearance and fat in flesh[c][b], and they were grazing in the reed grass.
translation:
  language: te
  text: ఇదిగో, చూడటానికి అందంగా, బలిసిన శరీరాలతో ఉన్న ఏడు ఆవులు నైలు నది నుండి పైకి వస్తున్నాయి; అవి రెల్లు గడ్డిలో మేస్తున్నాయి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “రెల్లు గడ్డిలో” అనే మాటకు “రెల్ల మధ్య” లేదా “చిత్తడి నేలలోని గడ్డిలో” అని కూడా అర్థం కావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: అప్పుడు ఇదిగో
  rationale: కలలోని దృశ్యాన్ని సజీవంగా చూపించే అవధాన సూచకాన్ని సహజమైన తెలుగు కథనశైలిలో నిలుపుతుంది.
- source_word: הַיְאֹר
  choice: నైలు నది
  rationale: ఐగుప్తు సందర్భంలో ఈ హీబ్రూ పదం సాధారణ నదిని కాక ప్రత్యేకంగా నైలు నదిని సూచిస్తుంది.
- source_word: עֹלֹת
  choice: పైకి వస్తూ
  rationale: హీబ్రూ వర్తమాన కృదంతంలోని కొనసాగుతున్న దృశ్య చర్యను ప్రతిబింబిస్తుంది.
- source_word: פָּרוֹת
  choice: ఆవులు
  rationale: ఆడ పశువులను సూచించే పదానికి సూటిగా, సహజంగా సరిపోతుంది.
- source_word: יְפוֹת מַרְאֶה
  choice: చూడటానికి అందంగా
  rationale: బాహ్య రూపం ఆహ్లాదకరంగా ఉందనే భావాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וּבְרִיאֹת בָּשָׂר
  choice: బలిసిన శరీరాలతో ఉన్న
  rationale: సాధారణ ఆరోగ్యాన్ని మాత్రమే కాక శరీరపు పుష్టి, కొవ్వును సూచించే మూలభాష చిత్రణను సహజ తెలుగులో నిలుపుతుంది.
- source_word: וַתִּרְעֶינָה
  choice: మేస్తున్నాయి
  rationale: పశువులు గడ్డి మేయడాన్ని తెలిపే సహజ తెలుగు క్రియ; దృశ్యంలో కొనసాగుతున్న చర్యను కూడా చూపుతుంది.
- source_word: בָּאָחוּ
  choice: రెల్లు గడ్డిలో
  rationale: నైలు తీరంలోని చిత్తడి ప్రాంతపు రెల్లు లేదా నీటిగడ్డిని సూచించే సందర్భోచిత పదప్రయోగం.
