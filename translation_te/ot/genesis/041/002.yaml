  to: ఇదిగో, చూడటానికి అందంగా, బలిసిన శరీరాలతో ఉన్న ఏడు ఆవులు నైలు నది నుండి పైకి వస్తున్నాయి; అవి రెల్లు గడ్డిలో మేస్తున్నాయి.[a]
