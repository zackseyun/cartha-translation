revisions:
- from: “నువ్వు నా ఇంటిమీద అధికారిగా ఉంటావు; నీ ఆజ్ఞ ప్రకారం నా ప్రజలందరూ నడుచుకోవాలి.[a] సింహాసనం విషయంలో మాత్రమే నేను నీకంటే గొప్పవాడిగా ఉంటాను.”
  to: “నీవు నా ఇంటికి అధిపతిగా ఉంటావు; నీ ఆజ్ఞకు నా ప్రజలందరూ లోబడతారు.[a] సింహాసనం విషయంలో మాత్రమే నేను నీకంటే గొప్పవాడిగా ఉంటాను.”
