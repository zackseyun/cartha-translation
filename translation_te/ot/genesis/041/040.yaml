  text: אַתָּה֙ תִּהְיֶ֣ה עַל בֵּיתִ֔/י וְ/עַל פִּ֖י/ךָ יִשַּׁ֣ק כָּל עַמִּ֑/י רַ֥ק הַ/כִּסֵּ֖א אֶגְדַּ֥ל מִמֶּֽ/ךָּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/040.yaml
  text: You shall be over my house[a], and all my people shall obey your command. Only with respect to the throne will I be greater than you.
translation:
  language: te
  text: “నీవు నా ఇంటికి అధిపతిగా ఉంటావు; నీ ఆజ్ఞకు నా ప్రజలందరూ లోబడతారు.[a] సింహాసనం విషయంలో మాత్రమే నేను నీకంటే గొప్పవాడిగా ఉంటాను.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో పదశః, “నీ నోటి వద్ద నా ప్రజలందరూ ముద్దుపెడతారు.” ఈ మాటను ఇక్కడ సాధారణంగా నీ ఆజ్ఞకు లోబడడం లేదా నీకు గౌరవసూచకంగా విధేయత చూపడం అనే అర్థంలో గ్రహిస్తారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל בֵּיתִי
  choice: నా ఇంటిమీద అధికారిగా
  rationale: עַל בֵּיתִי ఇక్కడ ఫరో ఇంటి వ్యవహారాలపై పర్యవేక్షణ, అధికారం అనే భావాన్ని ఇస్తుంది. ‘ఇంటిమీద అధికారిగా’ మూలంలోని ‘ఇల్లు’ రూపకాన్ని ఉంచుతూ భావాన్ని స్పష్టం చేస్తుంది.
- source_word: וְעַל־פִּיךָ יִשַּׁק כָּל־עַמִּי
  choice: నీ ఆజ్ఞ ప్రకారం నా ప్రజలందరూ నడుచుకోవాలి
  rationale: పదశః ‘నీ నోటి వద్ద నా ప్రజలందరూ ముద్దుపెట్టాలి.’ పరిపాలనా సందర్భంలో ఇది యోసేపు పలికే ఆజ్ఞకు లోబడడం లేదా అతనికి విధేయత చూపడం అనే భావాన్ని సూచిస్తుంది. సహజమైన ఆధునిక తెలుగులో ఆ భావాన్ని ‘నీ ఆజ్ఞ ప్రకారం ... నడుచుకోవాలి’ అని తెలిపి, పదశః రూపాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: כָּל עַמִּי
  choice: నా ప్రజలందరూ
  rationale: עַם అనే సామూహిక పదానికి సందర్భానుగుణమైన నేరమైన తెలుగు రూపం.
- source_word: רַק הַכִּסֵּא
  choice: సింహాసనం విషయంలో మాత్రమే
  rationale: רַק పరిమితిని సూచిస్తుంది; הַכִּסֵּא ఫరో రాజపదవిని సూచించే ‘సింహాసనం.’ ‘విషయంలో మాత్రమే’ అనేది యోసేపుపై ఫరోకు మిగిలే ఏకైక ఆధిక్యాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: אֶגְדַּל מִמֶּךָּ
  choice: నేను నీకంటే గొప్పవాడిగా ఉంటాను
  rationale: גדל מן నిర్మాణం తులనాత్మక ఆధిక్యాన్ని తెలియజేస్తుంది. మూలంలోని రూపాన్ని దగ్గరగా ఉంచుతూ, ముందున్న సింహాసన ప్రస్తావన దీనిని హోదాపరమైన ఆధిక్యంగా నిర్దేశిస్తుంది.
theological_decisions:
- issue: יִשַּׁק అనే క్రియ యొక్క అసాధారణ ప్రయోగం
  choice: ప్రధాన వచనంలో ఆజ్ఞకు అనుగుణంగా నడుచుకోవడం; పాదటిప్పణిలో ‘ముద్దుపెట్టాలి’ అనే పదశః అర్థం
  alternative: నా ప్రజలందరూ నీ నోటిని ముద్దుపెట్టాలి / నీకు విధేయులై ఉండాలి
  rationale: క్రియ సాధారణంగా ‘ముద్దుపెట్టు’ అని అర్థమిచ్చినా, ఈ అధికార బదలాయింపు సందర్భంలో విధేయత లేదా గౌరవసూచక సమర్పణ భావం సాధారణంగా గ్రహించబడుతుంది. పాదటిప్పణి మూలంలోని నిజమైన భాషా ఉద్రిక్తతను దాచదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సామాన్య పాఠకులకు స్పష్టంగా ఉండే శైలి. ఫరో యోసేపుతో ఏకవచన సన్నిహిత సంబోధన చేస్తున్నందున ‘నువ్వు/నీ’ వాడాం. మూలంలోని అధికార భావాన్ని స్పష్టం చేయడానికి ‘అధికారిగా’ చేర్చాం; సింహాసనానికి సంబంధించిన పరిమితిని యథాతథంగా నిలిపాం.
