review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys Pharaoh's delegation of authority over his house, the people's obedience to Joseph's directive, and Pharaoh's sole superiority in relation to the throne. The main-text rendering of the unusual Hebrew idiom is defensible, but the future/assertive force is better represented by 'లోబడతారు' than by the deontic 'నడుచుకోవాలి.'
  naturalness: ‘నా ఇంటిమీద అధికారిగా’ is understandable but less idiomatic than ‘నా ఇంటికి అధిపతిగా.’ ‘నీవు/నీ’ gives the speech an appropriately elevated modern-standard register, whereas ‘నువ్వు/నీ’ is comparatively colloquial in this royal declaration.
  terminology: ‘అధిపతి,’ ‘ఆజ్ఞకు లోబడటం,’ and ‘సింహాసనం’ are clear, suitably formal terms. The footnote should retain the Hebrew's deliberately awkward literal image while identifying the usual contextual sense without making that interpretation appear certain.
  issues:
  - severity: low
    issue: Register of second-person pronoun
    rationale: ‘నువ్వు’ is colloquial for this formal royal appointment speech; ‘నీవు’ is more appropriate in modern standard Telugu.
  - severity: medium
    issue: Main-text verb has a shifted modality
    rationale: ‘నడుచుకోవాలి’ means ‘must conduct themselves,’ while יִשַּׁק is a future statement in Pharaoh's decree. ‘లోబడతారు’ represents the intended future consequence more directly.
  - severity: low
    issue: Footnote wording and tense
    rationale: The note's ‘ముద్దుపెట్టాలి’ introduces a ‘must’ sense absent from the Hebrew. A future form and wording closer to ‘at/by your mouth’ better preserve the source expression's unusual character.
  revised_text: “నీవు నా ఇంటికి అధిపతిగా ఉంటావు; నీ ఆజ్ఞకు నా ప్రజలందరూ లోబడతారు.[a] సింహాసనం విషయంలో మాత్రమే నేను నీకంటే గొప్పవాడిగా ఉంటాను.”
