review_pass:
  verdict: revise
  source_fidelity: 'The Hebrew gives a past-state age notice: Joseph was thirty years old when he stood before Pharaoh, king of Egypt. The draft''s predicate omission (''అతనికి ముప్పై ఏళ్లు'') is understandable but leaves the past-tense assertion incomplete in this narrative context. The remaining clauses faithfully convey Joseph''s appearance before Pharaoh, departure from his presence, and movement throughout Egypt.'
  naturalness: The Telugu is generally clear and modern. Adding 'ఉన్నాడు' produces a complete, natural past-tense first sentence. 'దేశమంతటా పర్యటించాడు' is acceptable for עבר in context and does not overstate a specific administrative purpose.
  terminology: '''యోసేపు,'' ''ఫరో,'' and ''ఈజిప్టు'' are standard forms. ''సమక్షంలో'' appropriately represents courtly presence. No theological terminology or footnotes are involved.'
  issues:
