source:
  edition: WLC
  text: וְ/יוֹסֵף֙ בֶּן שְׁלֹשִׁ֣ים שָׁנָ֔ה בְּ/עָמְד֕/וֹ לִ/פְנֵ֖י פַּרְעֹ֣ה מֶֽלֶךְ מִצְרָ֑יִם וַ/יֵּצֵ֤א יוֹסֵף֙ מִ/לִּ/פְנֵ֣י פַרְעֹ֔ה וַֽ/יַּעְבֹ֖ר בְּ/כָל אֶ֥רֶץ מִצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/046.yaml
  text: Joseph was thirty years old when he stood before Pharaoh king of Egypt. And Joseph went out from before Pharaoh and traveled through all the land of Egypt.
translation:
  language: te
  text: యోసేపు ఈజిప్టు రాజైన ఫరో సమక్షంలో నిలిచినప్పుడు అతనికి ముప్పై సంవత్సరాల వయస్సు ఉన్నాడు. యోసేపు ఫరో సమక్షం నుండి బయలుదేరి ఈజిప్టు దేశమంతటా పర్యటించాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן שְׁלֹשִׁים שָׁנָה
  choice: అతనికి ముప్పై ఏళ్లు
  rationale: హీబ్రూ వయస్సు సూచించే నుడికారాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: בְּעָמְדוֹ לִפְנֵי פַּרְעֹה
  choice: ఫరో సమక్షంలో నిలిచినప్పుడు
  rationale: בְּ + క్రియానామ రూపం కాలాన్ని సూచిస్తుంది; לִפְנֵי ఇక్కడ రాజసన్నిధిని సూచించేలా ‘సమక్షంలో’ అని సహజంగా అనువదించబడింది.
- source_word: מֶלֶךְ מִצְרָיִם
  choice: ఈజిప్టు రాజైన
  rationale: ఫరోను ఈజిప్టు రాజుగా వివరిస్తున్న సమాస సంబంధాన్ని తెలుగులో స్పష్టమైన విశేషణ నిర్మాణంతో అందిస్తుంది.
- source_word: וַיֵּצֵא יוֹסֵף מִלִּפְנֵי פַרְעֹה
  choice: యోసేపు ఫరో సమక్షం నుండి బయలుదేరి
  rationale: יצא యొక్క బయలుదేరే భావాన్ని, לפני యొక్క సన్నిధి భావాన్ని రెండింటినీ నిలుపుతుంది.
- source_word: וַיַּעְבֹר בְּכָל אֶרֶץ מִצְרָיִם
  choice: ఈజిప్టు దేశమంతటా పర్యటించాడు
  rationale: עבר ఇక్కడ దేశమంతటా సంచరించడాన్ని సూచిస్తుంది; ‘పర్యటించాడు’ పరిపాలనా ఉద్దేశాన్ని అతిగా చేర్చకుండా విస్తృత ప్రయాణ భావాన్ని ఇస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే కథన శైలి. హీబ్రూలోని వాక్యారంభ וְ కు ప్రత్యేకమైన ‘ఇప్పుడు’ అనే కాలపదం చేర్చలేదు; తెలుగు కథన ప్రవాహంలో రెండో వాక్యానికి అదనపు ‘మరియు’ అవసరం లేకుండా సహజంగా నిర్మించబడింది.
