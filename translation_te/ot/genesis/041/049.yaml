reference: Genesis 41:49
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּצְבֹּ֨ר יוֹסֵ֥ף בָּ֛ר כְּ/ח֥וֹל הַ/יָּ֖ם הַרְבֵּ֣ה מְאֹ֑ד עַ֛ד כִּי חָדַ֥ל לִ/סְפֹּ֖ר כִּי אֵ֥ין מִסְפָּֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/049.yaml
  text: And Yoseph stored up grain[a], like the sand of the sea, in very great abundance, until he stopped counting[c][b], because there was no number.
translation:
  language: te
  text: యోసేపు సముద్రపు ఇసుకంతగా, ఎంతో అధికంగా ధాన్యాన్ని పోగుచేశాడు; లెక్కపెట్టడం మానేసేంతగా పోగుచేశాడు, ఎందుకంటే దానికి లెక్కే లేకపోయింది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּצְבֹּר
  choice: పోగుచేశాడు
  rationale: צבר అనే క్రియకు కుప్పగా కూడబెట్టడం లేదా నిల్వ కోసం సమకూర్చడం అనే భావం ఉంది. సమృద్ధి సంవత్సరాల్లో ధాన్యాన్ని సేకరించిన పరిపాలనా సందర్భంలో ‘పోగుచేశాడు’ సహజంగా సరిపోతుంది.
- source_word: יוֹסֵף
  choice: యోసేపు
  rationale: హీబ్రూ పేరైన יוֹסֵף‌కు తెలుగులో విస్తృతంగా వాడుకలో ఉన్న, మూల ఉచ్చారణకు దగ్గరైన రూపం.
- source_word: בָּר
  choice: ధాన్యం
  rationale: ఇక్కడ בָּר ఒక నిర్దిష్ట పంటను కాక సాధారణంగా ఆహార ధాన్యాన్ని సూచిస్తుంది.
- source_word: כְּחוֹל הַיָּם
  choice: సముద్రపు ఇసుకంత విస్తారంగా
  rationale: అపారమైన పరిమాణాన్ని తెలిపే హీబ్రూ ఉపమానాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: הַרְבֵּה מְאֹד
  choice: ఎంతో అధికంగా
  rationale: ఉపమానానికి అదనంగా ఉన్న బలమైన పరిమాణ సూచనను విడిచిపెట్టకుండా తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: עַד כִּי חָדַל לִסְפֹּר
  choice: చివరికి అతడు లెక్కపెట్టడమే మానేశాడు
  rationale: పోగుచేయడం ఏ స్థాయికి చేరిందో తెలిపే ఫలిత భావాన్ని, అలాగే ఏకవచన క్రియకు యోసేపే కర్త అనే సహజ పఠనాన్ని నిలుపుతుంది.
- source_word: כִּי אֵין מִסְפָּר
  choice: ఎందుకంటే దానికి లెక్కే లేకపోయింది
  rationale: ‘సంఖ్య లేదు’ అనే హీబ్రూ నుడికారాన్ని, లెక్కకు అందని పరిమాణం అనే భావంతో సహజమైన తెలుగులో అందిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు స్పష్టంగా, గౌరవప్రదంగా అనువదించబడింది. మూలంలోని సముద్రపు ఇసుక ఉపమానాన్నీ, దానికి తోడైన తీవ్ర పరిమాణ సూచననూ రెండింటినీ నిలుపుకుంది.
