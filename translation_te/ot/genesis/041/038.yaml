id: GEN.41.38
reference: Genesis 41:38
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר פַּרְעֹ֖ה אֶל עֲבָדָ֑י/ו הֲ/נִמְצָ֣א כָ/זֶ֔ה אִ֕ישׁ אֲשֶׁ֛ר ר֥וּחַ אֱלֹהִ֖ים בּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/038.yaml
  text: Then Pharaoh said to his servants[a], “Can we find a man like this[b], in whom is the spirit of God?”
translation:
  language: te
  text: 'అప్పుడు ఫరో తన సేవకులతో ఇలా అన్నాడు: “దేవుని ఆత్మ[a] తనలో ఉన్న ఇలాంటి మనిషి[b] మనకు దొరుకుతాడా?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “దైవిక ఆత్మ.” רוּחַ אֱלֹהִים అనే హీబ్రూ పదబంధాన్ని ఒకటి కంటే ఎక్కువ విధాలుగా అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
  - marker: b
    text: లేదా “ఇలాంటి వాడు—దేవుని ఆత్మ తనలో ఉన్నవాడు.”
    reason: alternative_rendering
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... అన్నాడు
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది; ఆధునిక తెలుగులో ‘అప్పుడు’ దాని క్రమానుసార భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: עֲבָדָיו
  choice: తన సేవకులతో
  rationale: עֶבֶד రాజసభ సందర్భంలో సేవకులను లేదా అధికారులను సూచించవచ్చు. మూలపదానికి నేరుగా సరిపోయే ‘సేవకులు’ను ఎంచుకున్నాం; ‘తో’ అనేది తెలుగులో చెప్పడం/మాట్లాడడం క్రియతో సహజ ప్రయోగం.
- source_word: הֲנִמְצָא
  choice: మనకు దొరుకుతాడా?
  rationale: ప్రశ్నార్థక అవ్యయంతో ఉన్న ప్రథమ పురుష బహువచన రూపం అలంకారిక ప్రశ్నను వ్యక్తం చేస్తుంది. ‘మనకు దొరుకుతాడా?’ తెలుగులో సహజంగా ఉండి, ‘మనం కనుగొనగలమా?’ అనే భావాన్ని నిలుపుతుంది.
- source_word: כָזֶה אִישׁ
  choice: ఇలాంటి మనిషి
  rationale: సూచనాత్మక భావాన్ని, పురుష ఏకవచన నామాన్ని రెండింటినీ నిలుపుతుంది; సందర్భంలో ఇది యోసేపును సూచిస్తుంది.
- source_word: רוּחַ אֱלֹהִים
  choice: దేవుని ఆత్మ
  rationale: హీబ్రూ సమాసపదబంధానికి ఇది నేరమైన, సహజమైన తెలుగు అనువాదం. నిర్దిష్టతను తెలుగు తప్పనిసరిగా వ్యాకరణపరంగా గుర్తించదు కాబట్టి, సాధ్యమైన అర్థభేదాలను పాదసూచికలో ఉంచాం.
- source_word: בּוֹ
  choice: తనలో ఉన్న
  rationale: ‘అతనిలో’ అనే స్థానార్థక భావాన్ని నిలుపుతూ, సంబంధవాక్యాన్ని ఆధునిక తెలుగులో సహజంగా నిర్మిస్తుంది.
theological_decisions:
- issue: רוּחַ אֱלֹהִים నిర్దిష్టంగా దేవుని ఆత్మను సూచిస్తుందా, లేక సాధారణంగా దైవిక ఆత్మను సూచిస్తుందా
  choice: దేవుని ఆత్మ
  alternative: ఒక దేవుని ఆత్మ; దైవిక ఆత్మ
  rationale: హీబ్రూ పదబంధంలో నిర్దిష్ట ఉపపదం లేకపోవడం వల్ల, ముఖ్యంగా ఫరో మాటలుగా ఇది కొంత అర్థసందిగ్ధంగా ఉంది. ప్రధాన పాఠంలో నేరమైన ‘దేవుని ఆత్మ’ను వాడి, ఇతర సాధ్యార్థాలను పాదసూచికలో ఇచ్చాం; తద్వారా కథనంలోని దైవిక మూలాన్ని తగ్గించకుండానే సందిగ్ధతను కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. ‘వ్యక్తి’ కంటే మూలంలోని אִישׁకు దగ్గరగా ఉండే ‘మనిషి’ని ఎంచుకున్నాం. ‘ఆత్మ’కు పెద్ద/చిన్న అక్షర భేదం తెలుగులో లేకపోవడం వల్ల, హీబ్రూ పదబంధంలోని నిర్దిష్టతను ప్రధాన పాఠం కృత్రిమంగా తీర్మానించదు.
