  yaml_path: translation/ot/genesis/032/009.yaml
  text: He said[a], “If Esau comes to the one camp and strikes it, then the camp that remains will escape.”
translation:
  language: te
  text: అతడు, “ఏశావు ఒక శిబిరం వద్దకు వచ్చి దానిపై దాడి చేస్తే, మిగిలిన శిబిరం తప్పించుకుంటుంది[a]” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మిగిలిన శిబిరం రక్షణ కోసం మిగులుతుంది”; అంటే అది నాశనం కాకుండా ప్రాణాలతో మిగులుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అతడు … అన్నాడు
  rationale: సాధారణ హీబ్రూ కథన రూపాన్ని సహజమైన తెలుగు భూతకాల వాక్యంగా అనువదించింది; మూలంలో లేని ‘అనుకున్నాడు’ అనే భావాన్ని చేర్చలేదు.
- source_word: אִם
  choice: చేస్తే
  rationale: యాకోబు అంచనాలోని షరతును తెలుగు షరతార్థక క్రియారూపం సహజంగా తెలియజేస్తుంది.
- source_word: יָבֹא
  choice: వచ్చి
  rationale: בוא అనే క్రియ యొక్క ప్రాథమిక ‘రావడం’ భావాన్ని నిలిపింది; దాడి భావాన్ని ఈ క్రియలోనే కలపలేదు.
- source_word: אֶל־הַמַּחֲנֶה הָאַחַת
  choice: ఒక శిబిరం దగ్గరికి
  rationale: ముందుగా విభజించిన రెండు శిబిరాల్లో ఒకదాన్ని సూచిస్తుంది; אֶל యొక్క దిశార్థాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וְהִכָּהוּ
  choice: దానిపై దాడి చేస్తే
  rationale: ‘దానిని కొడితే’ అనేది శిబిరం అనే సమూహ నామంతో తెలుగులో అసహజంగా ఉంటుంది; సందర్భంలో נכה తెలిపే హింసాత్మక దెబ్బను ‘దాడి చేయడం’ స్పష్టంగా, అతిశయోక్తి లేకుండా తెలియజేస్తుంది.
- source_word: הַמַּחֲנֶה הַנִּשְׁאָר
  choice: మిగిలిన శిబిరం
  rationale: נשאר యొక్క ‘మిగిలి ఉండడం’ అనే భావాన్ని సంక్షిప్తమైన, సహజమైన తెలుగులో నిలిపింది.
- source_word: לִפְלֵיטָה
  choice: తప్పించుకుంటుంది
  rationale: פְלֵיטָה అనే నామవాచక పదబంధం తెలిపే తప్పించుకోవడం లేదా ప్రాణాలతో మిగలడం అనే ఫలితాన్ని సహజమైన తెలుగు క్రియగా వ్యక్తం చేసింది.
