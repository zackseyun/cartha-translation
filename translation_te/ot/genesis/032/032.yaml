id: GEN.32.32
reference: Genesis 32:32
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּֽזְרַֽח ל֣/וֹ הַ/שֶּׁ֔מֶשׁ כַּ/אֲשֶׁ֥ר עָבַ֖ר אֶת פְּנוּאֵ֑ל וְ/ה֥וּא צֹלֵ֖עַ עַל יְרֵכֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/032.yaml
  text: The sun rose upon him as he passed Penuel[c][b][a], and he was limping on his thigh.
translation:
  language: te
  text: అతడు పెనూయేలు[a] దాటి వెళ్తుండగా సూర్యుడు అతనిపై ఉదయించాడు. అతడు తన తొడవల్ల కుంటుతూ నడిచాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఈ వచనంలో హెబ్రీయ స్థలనామం ‘పెనూయేలు’ అని ఉంది; ఇతర చోట్ల ‘పెనీయేలు’ అనే రూపం కూడా కనిపిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘తన తొడమీద కుంటుతూ నడిచాడు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְרַח
  choice: ఉదయించాడు
  rationale: זָרַח అనే క్రియ సూర్యుని గురించి వాడినప్పుడు ‘ఉదయించు’ అనే సహజమైన అర్థాన్ని ఇస్తుంది.
- source_word: לוֹ
  choice: అతనిపై
  rationale: సూర్యుడు ఒక వ్యక్తిపై ఉదయించాడనే హెబ్రీయ దృక్కోణాన్ని నిలుపుతుంది; ‘అతని కోసం’ అని అనువదిస్తే మూలంలో లేని ప్రయోజన భావం కలగవచ్చు.
- source_word: כַּאֲשֶׁר עָבַר
  choice: దాటి వెళ్తుండగా
  rationale: כַּאֲשֶׁר కాలసంబంధాన్ని, עָבַר ఆ స్థలాన్ని దాటడాన్ని సూచిస్తాయి. తెలుగు వాక్యంలో ఏకకాలికత సహజంగా వ్యక్తమవుతుంది.
- source_word: פְּנוּאֵל
  choice: పెనూయేలు
  rationale: ఈ వచనంలోని פְּנוּאֵל రూపాన్ని అనుసరించిన తెలుగు లిప్యంతరీకరణ; వేరే చోట కనిపించే పెనీయేలు రూపంతో సమన్వయం చేయలేదు.
- source_word: וְהוּא צֹלֵעַ
  choice: అతడు … కుంటుతూ నడిచాడు
  rationale: వర్తమాన కృదంతం కొనసాగుతున్న శారీరక స్థితి లేదా చర్యను సూచిస్తుంది. తెలుగులో ‘కుంటుతూ నడిచాడు’ స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: עַל יְרֵכוֹ
  choice: తన తొడవల్ల
  rationale: יָרֵךְ ఇక్కడ తొడ లేదా పైకాలు ప్రాంతాన్ని సూచిస్తుంది. עַל‌ను సందర్భానుసారంగా కారణార్థంలో పలకడం తెలుగులో సహజం; మూలంలోని మరింత అక్షరార్థమైన రూపాన్ని పాదసూచికలో నిలిపాం.
theological_decisions:
- issue: עַל יְרֵכוֹలోని సంబంధం—స్థానార్థమా, కారణార్థమా
  choice: తన తొడవల్ల
  alternative: తన తొడమీద
  rationale: ‘తొడమీద కుంటాడు’ అనేది ఆధునిక తెలుగులో అసహజంగా, అస్పష్టంగా ఉంటుంది. సందర్భం గాయపడిన తొడ/తుంటి ప్రాంతం వల్ల అతడు కుంటున్నాడని సూచిస్తుంది; అయినా హెబ్రీయ పదబంధపు అక్షరార్థాన్ని పాదసూచికలో ఇచ్చి దాని అస్పష్టతను దాచలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన కథనశైలి వాడబడింది. స్థలనామ రూపభేదాన్ని సమన్వయం చేయకుండా మూలపాఠాన్నే అనుసరించాం; అసహజమైన అక్షరానువాదానికి బదులు కారణార్థాన్ని ప్రధాన పాఠ్యంలో ఉంచి, అక్షరార్థాన్ని పాదసూచికలో ఇచ్చాం.
