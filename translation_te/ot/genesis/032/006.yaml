    reason: lexical_alternative
  revision_rationale: The revision removes the added, unspecified ‘ఈ సంగతి,’ restores the Hebrew’s deferential ‘my lord’ as the recipient of the report, and uses ‘దూతలను’ for the messengers supplied by the immediate narrative context. It keeps the respectful second-person form for ‘your eyes’ and preserves the existing footnote anchor and lexical ambiguity.
