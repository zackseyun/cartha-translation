  variant: modern standard Telugu
source:
  edition: WLC
  text: וַֽ/יְהִי לִ/י֙ שׁ֣וֹר וַ/חֲמ֔וֹר צֹ֖אן וְ/עֶ֣בֶד וְ/שִׁפְחָ֑ה וָֽ/אֶשְׁלְחָ/ה֙ לְ/הַגִּ֣יד לַֽ/אדֹנִ֔/י לִ/מְצֹא חֵ֖ן בְּ/עֵינֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/006.yaml
  text: I have oxen and donkeys[a], flocks, male servants and female servants, and I have sent to tell my lord, so that I may find favor in your eyes.
translation:
  language: te
  text: నాకు ఎద్దులు, గాడిదలు, మందలు, దాసులు, దాసీలు[a] ఉన్నారు. నా ప్రభువుకు తెలియజేయడానికి దూతలను పంపాను; మీ దృష్టిలో నాకు అనుగ్రహం కలగాలని.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పురుష బానిసలు, స్త్రీ బానిసలు.” హీబ్రూ పదాలు యజమాని ఆధీనంలోని గృహసేవకులను లేదా బానిసలను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי לִי
  choice: నాకు ... ఉన్నారు
  rationale: היה + ל అనే హీబ్రూ ప్రయోగం స్వాధీనాన్ని సూచిస్తుంది; తెలుగులో ‘నాకు ... ఉన్నాయి/ఉన్నారు’ సహజంగా వర్తమాన స్వాధీనాన్ని తెలియజేస్తుంది.
- source_word: שׁוֹר וַחֲמוֹר
  choice: ఎద్దులు, గాడిదలు
  rationale: ఏకవచన రూపాలు ఇక్కడ ఆస్తి వర్గాలను సమూహార్థంలో సూచిస్తున్నాయి; తెలుగులో బహువచనం సహజం.
- source_word: צֹאן
  choice: మందలు
  rationale: ఈ సమూహవాచకం ముఖ్యంగా గొర్రెలు, మేకలు వంటి చిన్న పశువులను సూచిస్తుంది; ‘మందలు’ ఆ సమూహార్థాన్ని అతిగా నిర్దిష్టం చేయకుండా నిలుపుతుంది.
- source_word: עֶבֶד וְשִׁפְחָה
  choice: దాసులు, దాసీలు
  rationale: పురుష, స్త్రీ గృహసేవకుల లింగభేదాన్ని నిలుపుతూ, వారి ఆధీన సామాజిక స్థితిని ఆధునిక తెలుగులో సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: וָאֶשְׁלְחָה לְהַגִּיד
  choice: తెలియజేయడానికి మనుష్యులను పంపాను
  rationale: హీబ్రూలో కర్మ ప్రత్యక్షంగా లేకపోయినా సందర్భంలో యాకోబు పంపిన దూతలు ఉద్దేశించబడ్డారు; తెలుగులో ‘మనుష్యులను పంపాను’ సహజంగా అర్థాన్ని పూర్తి చేస్తుంది.
- source_word: לַאדֹנִי
  choice: నా ప్రభువు
  rationale: ఇది ఏశావుకు వినయపూర్వక సామాజిక సంబోధన; దైవనామం కాదు. ‘నా ప్రభువు’ ఆ గౌరవభావాన్ని నిలుపుతుంది.
- source_word: לִמְצֹא חֵן בְּעֵינֶיךָ
  choice: మీ దృష్టిలో నాకు దయ కలగాలని
  rationale: ‘నీ కళ్లలో కృప కనుగొనడం’ అనే హీబ్రూ నుడికారాన్ని అర్థవంతమైన, గౌరవపూర్వక తెలుగులో వ్యక్తం చేస్తూ ‘దృష్టిలో’ అనే దృశ్యరూపాన్ని కొంతవరకు నిలుపుతుంది.
theological_decisions:
- issue: עֶבֶד / שִׁפְחָה పదాల సామాజిక స్థితి
  choice: దాసులు, దాసీలు
  alternative: సేవకులు, సేవకురాళ్లు; బానిసలు, బానిస స్త్రీలు
  rationale: ఈ పదాలు కేవలం వేతన సేవకులనే కాక ఆధీన గృహసభ్యులను కూడా సూచించగలవు. ఆస్తుల జాబితా సందర్భంలో ‘దాసులు, దాసీలు’ లింగభేదాన్నీ ఆధీన స్థితినీ నిలుపుతుంది; అయితే ఖచ్చితమైన చట్టపరమైన బానిసత్వ రూపాన్ని పాఠ్యం వివరించదు కాబట్టి ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవపూర్వక, కథనానికి తగిన శైలి. ఏశావును ఉద్దేశించిన ఏకవచన హీబ్రూ రూపాలకు తెలుగులో గౌరవార్థక ‘మీకు/మీ దృష్టిలో’ వాడబడింది. ప్రధాన పాఠ్యంలో [a] సూచిక సంబంధిత పదజంట తరువాత ఉంచబడింది.
