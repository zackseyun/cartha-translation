  revised_text: ఆ దూతలు[a] యాకోబు దగ్గరకు తిరిగి వచ్చి, “మేము నీ సోదరుడైన ఏశావు దగ్గరకు వెళ్లాము. అతడు కూడా నిన్ను కలవడానికి వస్తున్నాడు; నాలుగు వందల మంది పురుషులు అతనితో ఉన్నారు” అని చెప్పారు.
