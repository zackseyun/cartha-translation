revisions:
- from: ఆ దూతలు యాకోబు దగ్గరకు తిరిగి వచ్చి[a], “మేము నీ సహోదరుడైన ఏశావు దగ్గరకు వెళ్లాము. అతడు కూడా నిన్ను ఎదుర్కోవడానికి వస్తున్నాడు; అతనితో నాలుగు వందల మంది ఉన్నారు” అని చెప్పారు.
  to: ఆ దూతలు[a] యాకోబు దగ్గరకు తిరిగి వచ్చి, “మేము నీ సోదరుడైన ఏశావు దగ్గరకు వెళ్లాము. అతడు కూడా నిన్ను కలవడానికి వస్తున్నాడు; నాలుగు వందల మంది పురుషులు అతనితో ఉన్నారు” అని చెప్పారు.
  rationale: భేటీ స్వభావం గురించి మూలపాఠం ఉంచిన అస్పష్టతను కాపాడడానికి “ఎదుర్కోవడానికి” స్థానంలో “కలవడానికి” వాడబడింది. పదార్థ ప్రత్యామ్నాయ పాదటిప్పణి సూచికను “దూతలు” మీద ఉంచి, అִישׁ యొక్క పురుష-సూచక భావాన్ని “పురుషులు” ద్వారా స్పష్టం చేశాం. ఇతరత్రా ముసాయిదా యొక్క సహజమైన తెలుగు నిర్మాణం, పేర్లు, మరియు సందర్భానుసారమైన ‘దూతలు’ ఎంపిక నిలుపబడ్డాయి.
