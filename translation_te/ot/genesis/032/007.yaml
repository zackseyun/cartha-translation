id: GEN.32.7
reference: Genesis 32:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּשֻׁ֨בוּ֙ הַ/מַּלְאָכִ֔ים אֶֽל יַעֲקֹ֖ב לֵ/אמֹ֑ר בָּ֤אנוּ אֶל אָחִ֨י/ךָ֙ אֶל עֵשָׂ֔ו וְ/גַם֙ הֹלֵ֣ךְ לִ/קְרָֽאתְ/ךָ֔ וְ/אַרְבַּע מֵא֥וֹת אִ֖ישׁ עִמּֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/007.yaml
  text: The messengers returned to Jacob[a], saying, “We came to your brother, to Esau, and he is also coming to meet you, and four hundred men are with him.”
translation:
  language: te
  text: ఆ దూతలు[a] యాకోబు దగ్గరకు తిరిగి వచ్చి, “మేము నీ సోదరుడైన ఏశావు దగ్గరకు వెళ్లాము. అతడు కూడా నిన్ను కలవడానికి వస్తున్నాడు; నాలుగు వందల మంది పురుషులు అతనితో ఉన్నారు” అని చెప్పారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ఈ సందర్భంలో తక్కువ సంభావ్యతతో, “ఆ దేవదూతలు యాకోబు దగ్గరకు తిరిగి వచ్చారు.” హెబ్రీ పదం מַלְאָכִיםకు “దూతలు,” “దేవదూతలు” అనే రెండు అర్థాలూ ఉన్నాయి; ఇక్కడ అది యాకోబు ఏశావు దగ్గరకు పంపిన దూతలను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֻׁבוּ
  choice: తిరిగి వచ్చి
  rationale: שוב యొక్క వయ్యిక్తోల్ రూపం పూర్తయిన గత చర్యను తెలియజేస్తుంది; పంపబడినవారు యాకోబు దగ్గరకు తిరిగి రావడాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: הַמַּלְאָכִים
  choice: ఆ దూతలు
  rationale: מַלְאָך అనే పదానికి ‘దూత’ లేదా ‘దేవదూత’ అనే అర్థాలు ఉండవచ్చు. ముందరి సందర్భంలో యాకోబు ఏశావు దగ్గరకు పంపిన మానవ దూతలే వీరు.
- source_word: לֵאמֹר
  choice: అని చెప్పారు
  rationale: ప్రత్యక్ష సంభాషణను పరిచయం చేసే హెబ్రీ నిర్మాణాన్ని తెలుగులో సహజమైన వాక్యాంత క్రియగా వ్యక్తం చేసింది.
- source_word: בָּאנוּ
  choice: మేము ... దగ్గరకు వెళ్లాము
  rationale: בוא ప్రథమ పురుష బహువచన సంపూర్ణ రూపం. హెబ్రీలో ‘వచ్చాము’ అనే దృష్టికోణం ఉన్నా, యాకోబు వద్దకు తిరిగి వచ్చి ఏశావు వద్దకు చేసిన ప్రయాణాన్ని నివేదిస్తున్న తెలుగులో ‘వెళ్లాము’ సహజంగా ఉంటుంది.
- source_word: אֶל אָחִיךָ אֶל עֵשָׂו
  choice: నీ సహోదరుడైన ఏశావు దగ్గరకు
  rationale: రెండవ אֶל ‘నీ సహోదరుడు’ ఎవరో ఏశావుగా వివరిస్తుంది. తెలుగులో సంబంధాన్ని, గుర్తింపును రెండింటినీ స్పష్టంగా నిలుపుతుంది.
- source_word: וְגַם הֹלֵךְ לִקְרָאתְךָ
  choice: అతడు కూడా నిన్ను ఎదుర్కోవడానికి వస్తున్నాడు
  rationale: גם యొక్క అదనపు బలాన్ని ‘కూడా’ నిలుపుతుంది; participle కొనసాగుతున్న కదలికను ‘వస్తున్నాడు’గా చూపుతుంది. לִקְרָאתְךָ సందర్భాన్ని ముందే ప్రతికూలంగా తీర్మానించకుండా ఎదురుగా రావడాన్ని సూచిస్తుంది.
- source_word: וְאַרְבַּע מֵאוֹת אִישׁ עִמּוֹ
  choice: అతనితో నాలుగు వందల మంది ఉన్నారు
  rationale: ఏశావుతో పాటు ఉన్న పురుషుల సంఖ్యను స్పష్టమైన తెలుగు వాక్యంగా అందిస్తుంది; ‘మంది’ మనుషుల సంఖ్యకు సహజమైన వాడుక.
theological_decisions:
- issue: מַלְאָכִים అనే పదం మానవ దూతలా, దేవదూతలా
  choice: దూతలు
  alternative: దేవదూతలు
  rationale: ఈ సందర్భంలో యాకోబు ముందుగా ఏశావు దగ్గరకు పంపిన మనుషులే తిరిగి వస్తున్నారు. అయినప్పటికీ మూలపదంలోని సాధ్యమైన మరొక అర్థాన్ని పాదటిప్పణిలో నిలిపింది.
- issue: לִקְרָאתְךָ లోని భేటీ ఉద్దేశం
  choice: నిన్ను ఎదుర్కోవడానికి
  alternative: నిన్ను కలుసుకోవడానికి
  rationale: హెబ్రీ పదబంధం ఎదురుగా రావడాన్ని తెలుపుతుంది గాని స్నేహపూర్వకమా శత్రుత్వపూర్వకమా అని స్వతహాగా నిర్ణయించదు. ‘ఎదుర్కోవడానికి’ ఆ ఉద్విగ్నతను నిలుపుతూ ఉద్దేశాన్ని ఖరారు చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘సహోదరుడు’ సంబంధానికి కథనంలోని ప్రాధాన్యాన్ని నిలుపుతుంది; ‘నాలుగు వందల మంది’ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే రూపం.
