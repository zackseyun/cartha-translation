  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּקְרָ֧א יַעֲקֹ֛ב שֵׁ֥ם הַ/מָּק֖וֹם פְּנִיאֵ֑ל כִּֽי רָאִ֤יתִי אֱלֹהִים֙ פָּנִ֣ים אֶל פָּנִ֔ים וַ/תִּנָּצֵ֖ל נַפְשִֽׁ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/031.yaml
  text: And Jacob called the name of the place Peniel[a], for I have seen God face to face[c][b], and my life has been delivered.
translation:
  language: te
  text: యాకోబు ఆ స్థలానికి పెనీయేలు[a] అని పేరు పెట్టాడు; ఎందుకంటే, “నేను దేవుణ్ణి[c] ముఖాముఖిగా చూశాను, నా ప్రాణం[b] కాపాడబడింది.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘పెనీయేలు’ అనే పేరు ‘దేవుని ముఖం’ అనే మాటలా వినిపిస్తుంది; “దేవుణ్ణి ముఖాముఖిగా చూశాను” అనే యాకోబు వివరణతో ఇది సరిపోతుంది.
    reason: cultural_note
  - marker: b
    text: లేదా “నా జీవితం కాపాడబడింది.” ఇక్కడ “ప్రాణం” అంటే జీవితం లేదా వ్యక్తి తానే.
    reason: lexical_alternative
  - marker: c
    text: “దేవుడు” అనే పదాన్ని మరింత విస్తృతంగా “ఒక దైవిక జీవి” అని కూడా అర్థం చేసుకోవచ్చు; అయితే సందర్భం “దేవుడు” అనే అర్థానికే ఎక్కువగా అనుకూలిస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקְרָא ... שֵׁם הַמָּקוֹם
  choice: ఆ స్థలానికి ... అని పేరు పెట్టాడు
  rationale: తెలుగులో సహజమైన నామకరణ ప్రయోగాన్ని ఉపయోగిస్తూ, స్థలానికి పేరు పెట్టిన భావాన్ని పూర్తిగా నిలుపుతుంది.
- source_word: פְּנִיאֵל
  choice: పెనీయేలు
  rationale: ఈ వచనంలోని హీబ్రూ రూపాన్ని లిప్యంతరీకరిస్తుంది; ‘ముఖం’ మరియు ‘దేవుడు’ అనే పదాలతో ఉన్న పేరులోని సంబంధాన్ని పాదటిప్పణి వివరిస్తుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: స్థలానికి ఆ పేరు పెట్టడానికి యాకోబు ఇచ్చిన కారణాన్ని స్పష్టంగా సూచిస్తుంది.
- source_word: רָאִיתִי אֱלֹהִים
  choice: నేను దేవుణ్ణి చూశాను
  rationale: సందర్భంలో אֱלֹהִים దేవుణ్ణే సూచించడం అత్యంత సహజం; మొదటి పురుష రూపాన్ని యథాతథంగా ఉంచింది.
- source_word: פָּנִים אֶל־פָּנִים
  choice: ముఖాముఖిగా
  rationale: ప్రత్యక్ష వ్యక్తిగత సమాగమాన్ని తెలిపే సహజమైన తెలుగు నుడికారం; పెనీయేలు అనే పేరుతో ఉన్న పదసంబంధాన్ని కూడా నిలుపుతుంది.
- source_word: וַתִּנָּצֵל נַפְשִׁי
  choice: నా ప్రాణం కాపాడబడింది
  rationale: נֶפֶשׁ ఇక్కడ అమూర్తమైన ‘ఆత్మ’ కంటే జీవితం లేదా ప్రాణాన్ని సూచిస్తుంది; నిష్క్రియాత్మకమైన రక్షణ భావాన్ని కూడా నిలుపుతుంది.
theological_decisions:
- issue: אֱלֹהִים పదానికి అనువాదం
  choice: దేవుడు
  alternative: ఒక దైవిక జీవి
  rationale: యాకోబు స్థలానికి పెట్టిన పేరు మరియు పోరాట సంఘటన సందర్భం దేవుణ్ణి సూచిస్తున్నాయి. అయినప్పటికీ హీబ్రూ పదానికి ఉండగల విస్తృత అర్థాన్ని పాదటిప్పణిలో నిలిపాం.
- issue: దేవుణ్ణి ముఖాముఖిగా చూసి జీవించి ఉండడంలోని ఉద్రిక్తత
  choice: ‘ముఖాముఖిగా చూశాను; నా ప్రాణం కాపాడబడింది’ అని రెండింటినీ పక్కపక్కనే ఉంచడం
  alternative: ‘చూసినప్పటికీ నేను బతికాను’ అని వివరణాత్మకంగా మార్చడం
  rationale: మూలంలోని వాక్య నిర్మాణం ఈ రెండు వాస్తవాలను స్పష్టమైన వివరణ లేకుండా కలిపి ఉంచుతుంది; అందువల్ల theological tension‌ను పరిష్కరించకుండా నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన శైలి. మూలంలో ఉటంకింపు సూచిక లేకపోయినా, మొదటి పురుష వాక్యాన్ని సహజంగా చూపించేందుకు ప్రత్యక్ష వాక్యంగా అమర్చాం; ‘అన్నాడు’ తెలుగులో ఉటంకింపును ముగించడానికి అవసరమైన సాధారణ నిర్మాణ సహాయకం.
