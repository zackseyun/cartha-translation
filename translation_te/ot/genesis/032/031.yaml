  to: యాకోబు ఆ స్థలానికి పెనీయేలు[a] అని పేరు పెట్టాడు; ఎందుకంటే, “నేను దేవుణ్ణి[c] ముఖాముఖిగా చూశాను, నా ప్రాణం[b] కాపాడబడింది.”
