revisions:
- from: “దయచేసి నా అన్న చేతిలోనుండి, ఏశావు చేతిలోనుండి నన్ను రక్షించు.[a] ఎందుకంటే అతడంటే నాకు భయంగా ఉంది—అతడు వచ్చి నన్నూ, తల్లిని పిల్లలతో సహా హతమారుస్తాడేమో.[b]”
  to: “దయచేసి నా అన్న చేతిలోనుండి[a]—అంటే ఏశావు చేతిలోనుండి—నన్ను రక్షించు. అతనంటే నాకు భయంగా ఉంది; అతడు వచ్చి నన్ను కొడతాడేమో, తల్లిని పిల్లలతో కూడ.[b]”
  rationale: The revision keeps the prayerful tone and the repeated “from the hand of” wording while avoiding a premature decision that the verb itself means “kill.” The final Hebrew idiom is retained in a concise Telugu form and clarified in the footnote, preserving both its violent force and its syntactic compactness without implying that Jacob is being identified as the mother.
