  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: הַצִּילֵ֥/נִי נָ֛א מִ/יַּ֥ד אָחִ֖/י מִ/יַּ֣ד עֵשָׂ֑ו כִּֽי יָרֵ֤א אָנֹכִי֙ אֹת֔/וֹ פֶּן יָב֣וֹא וְ/הִכַּ֔/נִי אֵ֖ם עַל בָּנִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/012.yaml
  text: Please deliver me from the hand of my brother[a], from the hand of Esau, for I am afraid of him, lest he come and strike me[b], the mother with the children.
translation:
  language: te
  text: “దయచేసి నా అన్న చేతిలోనుండి[a]—అంటే ఏశావు చేతిలోనుండి—నన్ను రక్షించు. అతనంటే నాకు భయంగా ఉంది; అతడు వచ్చి నన్ను కొడతాడేమో, తల్లిని పిల్లలతో కూడ.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “చేతిలోనుండి” ఇక్కడ ఒకరి అధికారం లేదా దాడి నుండి అని అర్థం.
    reason: idiom_clarification
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా “పిల్లల మీద తల్లి.” ఇది తల్లిని ఆమె పిల్లలతోపాటు దాడి చేయడం లేదా సంహరించడాన్ని సూచించే ప్రయోగం. “కొడతాడు” అని అనువదించిన హీబ్రూ క్రియకు “దాడి చేయు” లేదా, సందర్భాన్ని బట్టి, “హతమార్చు” అనే అర్థాలూ ఉండవచ్చు.
    reason: lexical_and_syntactic_ambiguity
lexical_decisions:
- source_word: הַצִּילֵנִי נָא
  choice: దయచేసి … నన్ను రక్షించు
  rationale: నצל హిఫిల్ ఆజ్ఞారూపం ప్రమాదం లేదా మరొకరి ఆధీనంనుంచి విడిపించి కాపాడమనే అర్థం ఇస్తుంది; נָא ప్రార్థనలోని వినయపూర్వక వేడుకోలును తెలియజేస్తుంది.
- source_word: מִיַּד אָחִי מִיַּד עֵשָׂו
  choice: నా అన్న చేతిలోనుండి, ఏశావు చేతిలోనుండి
  rationale: מִיַּד అనే స్పష్టమైన హీబ్రూ రూపకాన్ని తెలుగులో అర్థమయ్యే ‘చేతిలోనుండి’గా నిలిపి, ఒకే వ్యక్తిని బంధుత్వంతోను పేరుతోను రెండుసార్లు పేర్కొన్న మూలపాఠపు భావోద్వేగ ఒత్తిడిని కాపాడుతుంది.
- source_word: כִּי יָרֵא אָנֹכִי אֹתוֹ
  choice: ఎందుకంటే అతడంటే నాకు భయంగా ఉంది
  rationale: כִּי కారణాన్ని పరిచయం చేస్తుంది; స్పష్టంగా ఉన్న אָנֹכִי యాకోబు అనుభవిస్తున్న ప్రస్తుత భయాన్ని నొక్కిచెబుతుంది. ఆధునిక తెలుగులో ‘అతడంటే నాకు భయంగా ఉంది’ సహజంగా వినిపిస్తుంది.
- source_word: פֶּן יָבוֹא
  choice: అతడు వచ్చి … ఏమో
  rationale: פֶּן భయపడుతున్న సంభావ్యతను సూచిస్తుంది. తెలుగు ‘ఏమో’ నిర్మాణం దానిని సహజంగా, అతిశయ నిర్ధారణ లేకుండా వ్యక్తపరుస్తుంది.
- source_word: וְהִכַּנִי
  choice: నన్నూ … హతమారుస్తాడేమో
  rationale: נכה సందర్భానుసారం కొట్టడం, దాడిచేయడం లేదా ఘోరంగా సంహరించడం అనే పరిధి కలిగి ఉంటుంది. వెంటనే వచ్చే తల్లి-పిల్లల వినాశన సూత్రవాక్యం వల్ల ఇక్కడ ప్రాణాంతక దాడి ఉద్దేశం స్పష్టంగా ఉన్నందున ‘హతమారుస్తాడు’ ఎంచుకోబడింది.
- source_word: אֵם עַל בָּנִים
  choice: తల్లిని పిల్లలతో సహా
  rationale: అక్షరార్థంగా ‘పిల్లల మీద తల్లి’ అనే ఈ హీబ్రూ ప్రయోగం తల్లిని ఆమె పిల్లలతోపాటు విచక్షణ లేకుండా సంహరించడాన్ని సూచిస్తుంది. తెలుగు రూపం ఏకవచన చిత్రాన్ని కాపాడుతూ భావాన్ని సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: אֵם עַל בָּנִים అనే హింసాత్మక ప్రయోగపు సంబంధం
  choice: నన్నూ, తల్లిని పిల్లలతో సహా హతమారుస్తాడేమో
  alternative: నన్ను కొడతాడేమో—పిల్లల మీద తల్లిని
  rationale: మూలంలోని అసాధారణ సంక్షిప్త నిర్మాణాన్ని అక్షరాలా తెలుగులో ఉంచితే యాకోబునే ‘తల్లి’గా గుర్తిస్తున్నట్టు అపార్థం కలగవచ్చు. ఎంచుకున్న పాఠం యాకోబుతోపాటు అతని కుటుంబమంతా నాశనం కావచ్చన్న భయాన్ని తెలియజేస్తుంది; అయితే మూలపదబంధపు రూపాన్ని పాదసూచికలో ఉంచి దాని వ్యాఖ్యాన సంబంధాన్ని పూర్తిగా మూసివేయదు.
- issue: וְהִכַּנִיలోని హింస తీవ్రత
  choice: హతమారుస్తాడేమో
  alternative: నన్ను కొడతాడేమో / నాపై దాడి చేస్తాడేమో
  rationale: נכהకు విస్తృత అర్థపరిధి ఉన్నప్పటికీ, తల్లి-పిల్లలను కలిపి సంహరించే ప్రయోగం ఈ సందర్భంలో ప్రాణాంతక దాడిని సూచిస్తుంది. అందుచేత సందర్భార్థాన్ని స్పష్టం చేస్తూ, పాదసూచికలో విస్తృత పదార్థాన్ని తెలియజేయబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన ప్రార్థనా శైలి వాడబడింది. ‘దయచేసి’ వినయపూర్వక వేడుకోలును, ‘చేతిలోనుండి’ మూలపాఠపు స్పష్టమైన రూపకాన్ని నిలుపుతాయి. హింసాత్మక చివరి పదబంధం గౌరవప్రదంగా కానీ దాని తీవ్రతను తగ్గించకుండా ఇవ్వబడింది.
