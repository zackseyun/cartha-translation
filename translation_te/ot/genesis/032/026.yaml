  text: וַ/יַּ֗רְא כִּ֣י לֹ֤א יָכֹל֙ ל֔/וֹ וַ/יִּגַּ֖ע בְּ/כַף יְרֵכ֑/וֹ וַ/תֵּ֨קַע֙ כַּף יֶ֣רֶךְ יַעֲקֹ֔ב בְּ/הֵֽאָבְק֖/וֹ עִמּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/026.yaml
  text: When he saw that he could not prevail against him[a], he touched the socket of his thigh[c][b], and the socket of Jacob’s thigh was dislocated as he wrestled with him.
translation:
  language: te
  text: అతడు అతనిపై పైచేయి సాధించలేకపోయాడని[a] చూసి, అతని తొడ కీలు గూటిని[b][c] తాకాడు. అతడు అతనితో పెనుగులాడుతుండగా యాకోబు తొడ కీలు గూటి స్థానభ్రంశమైంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అతణ్ణి లోబరచుకోలేకపోయాడని.’
    reason: lexical_alternative
  - marker: b
    text: హెబ్రీలో అక్షరార్థంగా, ‘అతని తొడ కీలు గూటి/గుంట’; సాంప్రదాయంగా, ‘అతని తొడ గుంట.’
    reason: lexical_alternative
  - marker: c
    text: హెబ్రీ సర్వనామాలు ఎవెవరిని సూచిస్తున్నాయో సందిగ్ధంగానే ఉన్నాయి; యాకోబు ప్రత్యర్థి ఎవరో ఈ వచనం స్పష్టంగా మళ్లీ చెప్పదు.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּרְא
  choice: చూసి
  rationale: వావ్-కన్సిక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది; ఇక్కడ తరువాతి చర్యకు కారణమైన గ్రహింపును సహజమైన తెలుగు వాక్యనిర్మాణంలో ‘చూసి’ తెలియజేస్తుంది.
- source_word: לֹא יָכֹל לוֹ
  choice: అతనిపై పైచేయి సాధించలేకపోయాడు
  rationale: יכל + ל ప్రత్యర్థిని అధిగమించలేకపోవడాన్ని సూచిస్తుంది. పెనుగులాట సందర్భంలో ‘పైచేయి సాధించు’ సహజంగా ఉండి, సంపూర్ణ అశక్తత అనే అతిశయార్థాన్ని రుద్దదు.
- source_word: וַיִּגַּע
  choice: తాకాడు
  rationale: נגע యొక్క సాధారణ అర్థం ‘తాకు.’ ఫలితం తీవ్రంగా ఉన్నప్పటికీ మూలపాఠంలోని మృదువైన స్పర్శక్రియనే నిలుపుతుంది.
- source_word: בְּכַף יְרֵכוֹ
  choice: అతని తొడ కీలు గుంటను
  rationale: כף + ירך ఇక్కడ తొడ ఎముక కలిసే పుటాకార కీలు భాగాన్ని సూచిస్తుంది. ‘తొడ కీలు గుంట’ ఆధునిక పాఠకునికి శరీర నిర్మాణాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: וַתֵּקַע
  choice: స్థానభ్రంశమైంది
  rationale: ఈ సందర్భంలో క్రియ కీలు తన స్థానం నుంచి తప్పిపోవడాన్ని సూచిస్తుంది; ఫలితస్థితిని తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: כַּף יֶרֶךְ יַעֲקֹב
  choice: యాకోబు తొడ కీలు గుంట
  rationale: ముందటి పదబంధంతో పదసామ్యాన్ని నిలుపుతూ, హెబ్రీలో స్పష్టంగా ఉన్న యాకోబు పేరును ఉంచుతుంది.
- source_word: בְּהֵאָבְקוֹ עִמּוֹ
  choice: అతడు అతనితో పెనుగులాడుతుండగా
  rationale: בְּ + క్రియార్థక నామరూపం సమకాలీన చర్యను సూచిస్తుంది. ‘పెనుగులాడుతుండగా’ కుస్తీ సందర్భానికి సహజంగా ఉండి, సర్వనామాల సందిగ్ధతను నిలుపుతుంది.
theological_decisions:
- issue: పెనుగులాటలోని ‘అతడు,’ ‘అతనిని/అతనితో’ అనే సర్వనామాల నిర్దేశ్యం
  choice: యాకోబు ప్రత్యర్థి ఎవరో ఈ వచనంలో పేరుపెట్టి చెప్పకుండా, మూలంలోని సర్వనామ సందిగ్ధతను నిలిపాము.
  alternative: తాకినవాణ్ణి ‘ఆ మనిషి,’ ‘దూత,’ లేదా దేవునిగా స్పష్టంగా గుర్తించడం.
  rationale: హెబ్రీ వచనం ఈ చోట ప్రత్యర్థి గుర్తింపును మళ్లీ స్పష్టంగా చెప్పదు. విస్తృత కథనం ఆ వ్యక్తి ప్రాముఖ్యతను క్రమంగా వెల్లడిస్తుంది కాబట్టి అనువాదం వచనం కన్నా ముందుకు వెళ్లకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన కథనశైలి. ‘పైచేయి సాధించు,’ ‘పెనుగులాడు’ వంటి సాధారణంగా అర్థమయ్యే పదాలను వాడి, శరీర నిర్మాణానికి ‘తొడ కీలు గుంట’ అనే స్పష్టమైన పదబంధాన్ని ఎంచుకున్నాం. సర్వనామాల పునరుక్తి కొంత ఉద్దేశపూర్వకం; అది మూలపాఠంలోని నిర్దేశ్య సందిగ్ధతను కాపాడుతుంది.
