source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר שַׁלְּחֵ֔/נִי כִּ֥י עָלָ֖ה הַ/שָּׁ֑חַר וַ/יֹּ֨אמֶר֙ לֹ֣א אֲשַֽׁלֵּחֲ/ךָ֔ כִּ֖י אִם בֵּרַכְתָּֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/027.yaml
  text: And he said[a], “Let me go, for the dawn has risen.” But he said[c][b], “I will not let you go unless you bless me.”
translation:
  language: te
  text: అతడు, “నన్ను వెళ్లనివ్వు[a], ఎందుకంటే వేకువ ఉదయించింది[b],” అన్నాడు. కాని అతడు[c], “నీవు నన్ను ఆశీర్వదిస్తే తప్ప నిన్ను వెళ్లనివ్వను,” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నన్ను విడిచిపెట్టు” లేదా “నన్ను పంపివేయి.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “పగలు పొడుస్తోంది.”
    reason: lexical_alternative
  - marker: c
    text: ఈ వచనంలో వక్తలు ఎవరో హీబ్రూ పాఠం స్పష్టంగా చెప్పదు; పరిసర కథనం ఆధారంగానే వారి గుర్తింపును గ్రహించాలి.
    reason: cultural_note
lexical_decisions:
- source_word: שַׁלְּחֵנִי
  choice: నన్ను వెళ్లనివ్వు
  rationale: שׁלח అనే క్రియకు ఇక్కడ ‘పంపు/విడుదల చేయి’ అనే ప్రాథమిక భావం ఉంది. పెనుగులాట సందర్భంలో ‘నన్ను వెళ్లనివ్వు’ అనేది సహజమైన ఆధునిక తెలుగు; అభ్యర్థనలోని ఉద్దేశాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: כִּי עָלָה הַשָּׁחַר
  choice: తెల్లవారింది
  rationale: עָלָה הַשָּׁחַר అక్షరార్థంగా ‘వేకువ పైకి వచ్చింది/ఉదయించింది.’ తెలుగులో ‘తెల్లవారింది’ అదే కాలసూచనను సహజంగా వ్యక్తం చేస్తుంది; సందర్భంలో כִּי తెలిపే కారణ సంబంధాన్ని విరామచిహ్నంతో నిలుపుతుంది.
- source_word: לֹא אֲשַׁלֵּחֲךָ
  choice: నిన్ను వెళ్లనివ్వను
  rationale: నిషేధంతో కూడిన అసంపూర్ణ క్రియారూపం దృఢమైన నిరాకరణను తెలియజేస్తుంది. మొదటి మాటలోని שׁלח క్రియను మళ్లీ అదే విధంగా అనువదించడం సంభాషణలోని పదపునరుక్తిని కాపాడుతుంది.
- source_word: כִּי אִם
  choice: తప్ప
  rationale: ఈ పదబంధం మినహాయింపు లేదా షరతును ప్రవేశపెడుతుంది. ‘ఆశీర్వదిస్తే తప్ప’ అనేది తెలుగులో సంక్షిప్తంగా, సహజంగా ‘unless’ భావాన్ని అందిస్తుంది.
- source_word: בֵּרַכְתָּנִי
  choice: నీవు నన్ను ఆశీర్వదిస్తే
  rationale: హీబ్రూ సంపూర్ణ క్రియారూపం ఇక్కడ విడుదలకు ముందు నెరవేరవలసిన షరతుగా పనిచేస్తుంది. తెలుగు షరతార్థక రూపం ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וַיֹּאמֶר ... וַיֹּאמֶר
  choice: అతడు ... అన్నాడు. కాని అతడు ... అన్నాడు
  rationale: హీబ్రూలో రెండు మాటలకూ ఒకే కథన సూత్రం ఉంది. రెండవ వాక్యంలో ‘కాని’ వాడటం ప్రతిస్పందనలోని వ్యతిరేకతను సహజ తెలుగులో చూపుతుంది; వక్తల పేర్లను మాత్రం చేర్చదు.
theological_decisions:
- issue: వక్తల గుర్తింపు
  choice: వచనంలో ఇద్దరినీ పేర్లతో గుర్తించకుండా ‘అతడు’ అనే సాధారణ సర్వనామాన్నే ఉంచడం
  alternative: మొదటి వక్తను ‘ఆ మనిషి/దూత/దేవుడు’గా, రెండవ వక్తను ‘యాకోబు’గా స్పష్టంగా పేర్కొనడం
  rationale: హీబ్రూ వచనంలో కర్తలు పేర్లతో చెప్పబడలేదు; మూడవ పురుష ఏకవచన క్రియారూపాల ద్వారానే సూచించబడ్డారు. పేర్లు చేర్చడం పరిసర కథనం ఆధారంగా వ్యాఖ్యానాన్ని వచనంలోకి తీసుకురావడమే అవుతుంది. సాధారణ సర్వనామాలు మూలంలోని కథన, ధార్మిక ఉద్వేగాన్ని నిలుపుతాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన సంభాషణ శైలిని వాడాం. ‘వెళ్లనివ్వు/వెళ్లనివ్వను’ అనే పునరుక్తి మూలంలోని శబ్ద సంబంధాన్ని నిలుపుతుంది. వక్తల పేర్లను చేర్చకుండా మూలపాఠంలోని అస్పష్టతను కాపాడాం.
