  source_fidelity: 'ముసాయిదా ప్రధానంగా హీబ్రూ వాక్య నిర్మాణాన్నీ భావాన్నీ విశ్వసనీయంగా ఇస్తుంది: రెండవవాడు, మూడవవాడు, మందల వెనుక వెళ్తున్న వారందరూ; ఏశావును ఎదుర్కొన్నప్పుడు చెప్పవలసిన నిర్దేశం. అయితే כַּדָּבָר הַזֶּה యొక్క ‘ఈ మాట ప్రకారం’ అనే నిర్దిష్ట సూచనను ‘ఇదే విధంగా’ కొంత సాధారణీకరిస్తుంది. ‘ఈ మాట ప్రకారమే’ మూలంతో మరింత సన్నిహితంగా ఉంటుంది. బְּמֹצַאֲכֶם אֹתוֹకు ‘మీకు ఏశావు ఎదురైనప్పుడు’ సందర్భోచితంగా సహజమైనది; అది కేవలం యాదృచ్ఛికంగా కలవడం కంటే మూలంలోని ఎదురుపడే సందర్భాన్ని బాగా ప్రతిబింబిస్తుంది.'
  naturalness: ‘రెండవవానికీ, మూడవవానికీ’ అర్థమయ్యే ప్రామాణిక రూపాలే. సవరించిన వచనంలో ‘ఆజ్ఞాపించాడు’ మరియు ‘చెప్పాలి’ కథనానికి, నిర్దేశానికి తగిన సహజమైన ఆధునిక తెలుగు. ‘ఈ మాట ప్రకారమే’ కొద్దిగా అధికారికమైనా, ఇక్కడ ముందుగా నిర్దేశించిన మాటలను సూచిస్తున్నందున తగినది.
