  text: And he commanded the second also[a], and the third also, and all those going behind the droves, saying, “According to this word you shall speak to Esau when you find him.”
translation:
  language: te
  text: 'అతడు రెండవవానికీ[a], మూడవవానికీ, మందల వెనుక వెళ్తున్న వారందరికీ ఆజ్ఞాపించాడు: “మీకు ఏశావు ఎదురైనప్పుడు, ఈ మాట ప్రకారమే అతనితో చెప్పాలి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీకు ఏశావు ఎదురైనప్పుడు, ఇలా అతనితో చెప్పాలి.” మూలంలో అక్షరార్థంగా “ఈ మాట ప్రకారం” అని ఉంది; ఇది యాకోబు ముందుగా నిర్దేశించిన సందేశాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: ఆజ్ఞాపించాడు
  rationale: צוה పియేల్ రూపంలోని నిర్దేశక బలాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: הַשֵּׁנִי / הַשְּׁלִישִׁי
  choice: రెండవవానికీ / మూడవవానికీ
  rationale: మూలంలో నామవాచకంగా వాడిన క్రమసంఖ్యలను అలాగే ఉంచి, అక్కడ లేని ‘సేవకుడు’ అనే పదాన్ని చేర్చలేదు.
- source_word: כָּל הַהֹלְכִים אַחֲרֵי הָעֲדָרִים
  choice: మందల వెనుక వెళ్తున్న వారందరికీ
  rationale: వర్తమాన కృదంత భావాన్నీ, జంతువుల గుంపుల వెనుక సాగుతున్న మొత్తం సమూహాన్నీ స్పష్టంగా తెలియజేస్తుంది.
- source_word: לֵאמֹר
  choice: ఇలా
  rationale: ప్రత్యక్ష ఆదేశాన్ని పరిచయం చేసే హీబ్రూ సూత్రాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: כַּדָּבָר הַזֶּה תְּדַבְּרוּן
  choice: ఇదే విధంగా అతనితో చెప్పాలి
  rationale: అక్షరార్థంగా ‘ఈ మాట ప్రకారం మీరు మాట్లాడాలి’; సందర్భంలో ముందుగా నిర్దేశించిన సందేశాన్ని అదే విధంగా చెప్పాలనే భావాన్ని సహజంగా అందిస్తుంది.
- source_word: בְּמֹצַאֲכֶם אֹתוֹ
  choice: మీరు ఏశావును కలిసినప్పుడు
  rationale: מצא ఇక్కడ ఎదురుపడటం లేదా కలవటం అనే సందర్భార్థాన్ని కలిగి ఉంది; తెలుగు వాక్యంలో సర్వనామ అస్పష్టతను నివారించేందుకు ఏశావు పేరును పునరుక్తి చేసింది.
