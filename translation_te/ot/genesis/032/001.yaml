source:
  edition: WLC
  text: וַ/יַּשְׁכֵּ֨ם לָבָ֜ן בַּ/בֹּ֗קֶר וַ/יְנַשֵּׁ֧ק לְ/בָנָ֛י/ו וְ/לִ/בְנוֹתָ֖י/ו וַ/יְבָ֣רֶךְ אֶתְ/הֶ֑ם וַ/יֵּ֛לֶךְ וַ/יָּ֥שָׁב לָבָ֖ן לִ/מְקֹמֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/001.yaml
  text: Laban rose early in the morning[a], kissed his sons and his daughters, and blessed them. Then Laban departed and returned to his place.
translation:
  language: te
  text: లాబాను తెల్లవారగానే లేచి, తన కుమారులను, కుమార్తెలను[a] ముద్దుపెట్టుకొని వారిని ఆశీర్వదించాడు. ఆ తరువాత లాబాను బయలుదేరి తన చోటికి తిరిగి వెళ్లాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ మూలంలో ‘తన కుమారులను, తన కుమార్తెలను’ అని ఉంది. ఇక్కడ వీరు లాబాను వంశస్థులను, అంటే అతని మనుమలను, మనుమరాళ్లను సూచించే అవకాశం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכֵּם בַּבֹּקֶר
  choice: తెల్లవారగానే లేచి
  rationale: שׁכם హిఫిల్ రూపం పెందలకడనే లేవడం లేదా త్వరగా బయలుదేరడం అనే భావాన్ని ఇస్తుంది; בַּבֹּקֶרతో కలిపి ‘తెల్లవారగానే లేచి’ సహజమైన ఆధునిక తెలుగులో కాలభావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: וַיְנַשֵּׁק
  choice: ముద్దుపెట్టుకొని
  rationale: ఇక్కడ נשׁק కుటుంబసంబంధమైన వీడ్కోలు ముద్దును సూచిస్తుంది; ‘ముద్దుపెట్టుకొని’ ప్రత్యక్షమైన, సహజమైన అనువాదం.
- source_word: לְבָנָיו וְלִבְנוֹתָיו
  choice: తన కుమారులను, కుమార్తెలను
  rationale: మూలంలో పురుష, స్త్రీ బంధుత్వ పదాలు విడివిడిగా ఉన్నాయి. వారు లాబాను వంశస్థులను, సందర్భానుసారం మనుమలను సూచించే అవకాశం ఉన్నా, ప్రధాన పాఠంలో మూలపదాల రూపాన్ని నిలుపుకున్నాం.
- source_word: וַיְבָרֶךְ אֶתְהֶם
  choice: వారిని ఆశీర్వదించాడు
  rationale: ברך యొక్క సాధారణ అర్థం ‘ఆశీర్వదించు.’ వీడ్కోలు సందర్భం ఉన్నప్పటికీ దానిని కేవలం ‘వీడ్కోలు పలికాడు’గా మార్చకుండా మూలార్థాన్ని నిలుపుతుంది.
- source_word: וַיֵּלֶךְ
  choice: బయలుదేరి
  rationale: తరువాత వచ్చే ‘తిరిగి వెళ్లాడు’తో సహజమైన కథన క్రమం ఏర్పడేలా, వెళ్లిపోవడాన్ని సూచించే ఈ క్రియను ‘బయలుదేరి’గా అనువదించాం.
- source_word: וַיָּשָׁב
  choice: తిరిగి వెళ్లాడు
  rationale: שׁוב యొక్క ప్రధాన భావం తిరిగి పోవడం; తెలుగు కథనంలో ‘తిరిగి వెళ్లాడు’ సహజంగా ఉంటుంది.
- source_word: לִמְקֹמוֹ
  choice: తన చోటికి
  rationale: מקום అక్షరార్థంగా ‘చోటు.’ ‘ఇంటికి’ అని నిర్దిష్టం చేయకుండా మూలంలోని విస్తృత భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: లింగాన్ని సూచించే బంధుత్వ పదాలు మరియు వాటి సందర్భార్థం
  choice: తన కుమారులను, కుమార్తెలను
  alternative: తన పిల్లలను / తన మనుమలను, మనుమరాళ్లను
  rationale: హీబ్రూ పాఠం కుమారులు, కుమార్తెలు అనే రెండు నిర్దిష్ట పదాలను వాడుతుంది. అవి విస్తృతంగా వంశస్థులను సూచించవచ్చు; ఆ సందర్భార్థాన్ని ప్రధాన పాఠంలో ఖరారు చేయకుండా పాదటిప్పణిలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే కథనశైలి వాడబడింది. మూలంలోని వరుస క్రియలను సహజ తెలుగు వాక్యప్రవాహంలో కృదంతాలతో అనుసంధానించాం; బంధుత్వ పదాల అసలు రూపం మరియు వాటి సందర్భసందిగ్ధత రెండూ కాపాడబడ్డాయి.
