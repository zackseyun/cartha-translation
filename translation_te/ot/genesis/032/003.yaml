  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. మూలంలోని సంక్షిప్తతను కాపాడుతూ, ‘పేరు పెట్టాడు’ వంటి సహజ తెలుగు నుడికారానికి ప్రాధాన్యం ఇచ్చాం.
