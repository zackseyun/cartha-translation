  text: וַ/יֹּ֤אמֶר יַעֲקֹב֙ כַּ/אֲשֶׁ֣ר רָאָ֔/ם מַחֲנֵ֥ה אֱלֹהִ֖ים זֶ֑ה וַ/יִּקְרָ֛א שֵֽׁם הַ/מָּק֥וֹם הַ/ה֖וּא מַֽחֲנָֽיִם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/003.yaml
  text: When Jacob saw them[a], he said, “This is God’s camp.” So he called the name of that place Mahanaim.
translation:
  language: te
  text: యాకోబు వారిని చూసినప్పుడు, “ఇది దేవుని శిబిరం” అన్నాడు. అందువల్ల అతడు ఆ ప్రదేశానికి మహనయీము[a] అని పేరు పెట్టాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “మహనయీము” అనే పేరు “రెండు శిబిరాలు” లేదా “జంట శిబిరం” అనే భావాన్ని ధ్వనింపజేస్తుంది; ఇది “ఇది దేవుని శిబిరం” అన్న యాకోబు మాటలను ప్రతిధ్వనిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר רָאָם
  choice: వారిని చూసినప్పుడు
  rationale: כַּאֲשֶׁר ఇక్కడ కాలసంబంధాన్ని తెలియజేస్తుంది; רָאָם లోని మూడవ పురుష బహువచన ప్రత్యయం మునుపటి వచనంలోని దేవుని దూతలను సూచిస్తుంది.
- source_word: מַחֲנֵה אֱלֹהִים
  choice: దేవుని శిబిరం
  rationale: నిర్మాణ సంబంధాన్ని సహజమైన తెలుగు షష్ఠీ రూపంతో వ్యక్తం చేస్తూ, מַחֲנֶה కు సాధారణంగా అర్థమయ్యే ‘శిబిరం’ వాడబడింది; ఇది స్థలనామంతో ఉన్న పదప్రయోగాన్ని కూడా నిలుపుతుంది.
- source_word: זֶה
  choice: ఇది
  rationale: ప్రదర్శక సర్వనామం వాక్యంలో విధేయంగా పనిచేస్తోంది; తెలుగులో ‘ఇది దేవుని శిబిరం’ సహజంగా పూర్తి భావాన్ని ఇస్తుంది.
- source_word: וַיִּקְרָא שֵׁם
  choice: పేరు పెట్టాడు
  rationale: హీబ్రూ నుడికారానికి తెలుగులో సహజమైన సమానార్థక ప్రయోగం ఇది; అక్షరార్థమైన ‘పేరును పిలిచాడు’ కంటే స్థలనామకరణ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: הַמָּקוֹם הַהוּא
  choice: ఆ ప్రదేశానికి
  rationale: నిర్దిష్టంగా అప్పుడే ఎదురైన స్థలాన్ని సూచించే హీబ్రూ నిర్దేశక భావాన్ని ‘ఆ ప్రదేశం’ సహజంగా ప్రతిబింబిస్తుంది.
- source_word: מַחֲנָיִם
  choice: మహనయీము
  rationale: ఇది స్థలనామం కాబట్టి అర్థానువాదం చేయకుండా లిప్యంతరీకరించబడింది; దాని ద్వివచనసదృశ పదప్రయోగం పాదసూచికలో వివరించబడింది.
