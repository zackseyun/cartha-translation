  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని కానుక–యాకోబు వ్యత్యాసాన్ని ‘అయితే’ మరియు ‘శిబిరంలోనే’ ద్వారా స్పష్టంగా ఉంచింది.
