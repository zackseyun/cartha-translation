source:
  edition: WLC
  text: וַ/תַּעֲבֹ֥ר הַ/מִּנְחָ֖ה עַל פָּנָ֑י/ו וְ/ה֛וּא לָ֥ן בַּ/לַּֽיְלָה הַ/ה֖וּא בַּֽ/מַּחֲנֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/022.yaml
  text: So the gift passed on ahead of him[a], but he himself stayed that night in the camp.
translation:
  language: te
  text: కాబట్టి ఆ కానుక అతనికంటే ముందుగా వెళ్లింది[a]. అయితే అతడు ఆ రాత్రి శిబిరంలోనే బస చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘కానుక’కు బదులుగా ‘బహుమతి’ అని కూడా అనువదించవచ్చు. హీబ్రూ מִנְחָה అనే పదం కానుక, కప్పం లేదా అర్పణను సూచించగలదు; ఇక్కడ అది యాకోబు ఏశావుకు ముందుగా పంపిన కానుకను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעֲבֹר
  choice: వెళ్లింది
  rationale: עבר అనే క్రియ ఇక్కడ కథన క్రమంలో ముందుకు సాగడాన్ని సూచిస్తుంది. ఈ వాక్యంలో దాటవలసిన నిర్దిష్ట సరిహద్దు లేదా ప్రవాహం ప్రస్తావించబడనందున ‘దాటింది’ కంటే ‘వెళ్లింది’ సహజంగా ఉంది.
- source_word: הַמִּנְחָה
  choice: ఆ కానుక
  rationale: ఈ సందర్భంలో מִנְחָה యాకోబు ఏశావుకు ముందుగా పంపిన కానుకను సూచిస్తుంది; ఆరాధనా అర్పణను కాదు. తెలుగు పాఠకులకు ‘కానుక’ స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: עַל־פָּנָיו
  choice: అతనికంటే ముందుగా
  rationale: అక్షరార్థంగా ‘అతని ముఖానికి ముందు’ అనే ఈ హీబ్రూ నుడికారం, సందర్భంలో యాకోబుకు ముందుగా వెళ్లడాన్ని సూచిస్తుంది.
- source_word: וְהוּא
  choice: అయితే అతడు
  rationale: వ్యక్తివాచక సర్వనామం స్పష్టంగా వాడబడటం, ముందుకు వెళ్లిన కానుకకూ అక్కడే ఉన్న యాకోబుకూ మధ్య వ్యత్యాసాన్ని నొక్కిచెబుతుంది.
- source_word: לָן
  choice: బస చేశాడు
  rationale: לון/לין అంటే రాత్రి ఉండడం లేదా బస చేయడం. ‘ఆ రాత్రి’ అనే కాలపదంతో ‘బస చేశాడు’ సహజమైన, గౌరవప్రదమైన తెలుగు.
- source_word: בַּלַּיְלָה הַהוּא
  choice: ఆ రాత్రి
  rationale: కాలాన్ని సూచించే ఈ పదబంధానికి నేరుగా, సహజంగా సరిపోయే ఆధునిక తెలుగు రూపం.
- source_word: בַּמַּחֲנֶה
  choice: శిబిరంలోనే
  rationale: מַחֲנֶה అంటే శిబిరం. ‘నే’ అనే నొక్కింపు కానుక ముందుకు వెళ్లగా యాకోబు శిబిరంలో ఉండిపోయాడనే సందర్భోచిత వ్యత్యాసాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
