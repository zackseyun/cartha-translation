- from: 'అతడు వారికి ఇలా ఆజ్ఞాపించాడు: “మీరు నా ప్రభువైన ఏశావుతో ఇలా చెప్పాలి: ‘నీ సేవకుడైన యాకోబు ఇలా అంటున్నాడు: నేను లాబాను దగ్గర పరదేశిగా నివసిస్తూ[a] ఇప్పటివరకు అక్కడే ఉండిపోయాను.’”[b]'
  to: 'అతడు వారికి ఇలా ఆజ్ఞాపించాడు: “మీరు నా ప్రభువైన ఏశావుకు ఇలా చెప్పాలి: ‘నీ సేవకుడైన యాకోబు ఇలా అంటున్నాడు: నేను లాబాను వద్ద పరదేశిగా నివసించాను[a], అక్కడే ఇప్పటివరకు ఉండిపోయాను.’”[b]'
  rationale: The revision corrects the recipient marking and resolves the awkward aspectual construction while preserving the Hebrew’s messenger formula, deferential social language, and the distinction between sojourning with Laban and remaining there until the present. Footnote anchors remain valid and the footnotes retain their intended scope.
