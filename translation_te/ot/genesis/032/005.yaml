source:
  edition: WLC
  text: וַ/יְצַ֤ו אֹתָ/ם֙ לֵ/אמֹ֔ר כֹּ֣ה תֹאמְר֔וּ/ן לַֽ/אדֹנִ֖/י לְ/עֵשָׂ֑ו כֹּ֤ה אָמַר֙ עַבְדְּ/ךָ֣ יַעֲקֹ֔ב עִם לָבָ֣ן גַּ֔רְתִּי וָ/אֵחַ֖ר עַד עָֽתָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/005.yaml
  text: 'And he commanded them[a], saying[c][b], “Thus you shall say to my lord Esau: ‘Thus says your servant Jacob: I have sojourned with Laban and have stayed until now.’”'
translation:
  language: te
  text: 'అతడు వారికి ఇలా ఆజ్ఞాపించాడు: “మీరు నా ప్రభువైన ఏశావుకు ఇలా చెప్పాలి: ‘నీ సేవకుడైన యాకోబు ఇలా అంటున్నాడు: నేను లాబాను వద్ద పరదేశిగా నివసించాను[a], అక్కడే ఇప్పటివరకు ఉండిపోయాను.’”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నేను లాబాను వద్ద విదేశీయుడిగా నివసించాను.” మూలపదం బయటివాడిగా లేదా తాత్కాలిక నివాసిగా జీవించడాన్ని సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: “ప్రభువు,” “సేవకుడు” అనే మాటలు ఇక్కడ యాకోబు ఏశావుతో మాట్లాడేటప్పుడు చూపిన వినయపూర్వక గౌరవాన్ని సూచిస్తాయి; అవి తప్పనిసరిగా యజమాని-బానిస సంబంధాన్ని సూచించవు.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְצַו
  choice: ఆజ్ఞాపించాడు
  rationale: צוה పదంలోని నిర్దేశాత్మక బలాన్ని నిలుపుతుంది; సాధారణ ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: לֵאמֹר
  choice: ఇలా
  rationale: హీబ్రూ మాట-పరిచయ సూత్రాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది; ‘అని చెప్పుతూ’ అనే భారమైన పునరుక్తిని నివారిస్తుంది.
- source_word: כֹּה תֹאמְרוּן
  choice: ఇలా చెప్పాలి
  rationale: దూతలు యథాతథంగా అందించవలసిన సందేశాన్ని, ఆజ్ఞార్థక భావాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: לַאדֹנִי לְעֵשָׂו
  choice: నా ప్రభువైన ఏశావుతో
  rationale: ‘ప్రభువు’ ఇక్కడ దైవపదవి కాదు, గౌరవసూచక సామాజిక సంబోధన; ఏశావు అనే పేరు దానికి అన్వయంగా ఉంది.
- source_word: כֹּה אָמַר
  choice: ఇలా అంటున్నాడు
  rationale: దూత సందేశ సూత్రాన్ని ఆధునిక తెలుగులో సహజ వర్తమాన రూపంతో అందిస్తుంది.
- source_word: עַבְדְּךָ
  choice: నీ సేవకుడైన
  rationale: ఇది ఏశావు ఎదుట యాకోబు ఉపయోగించిన వినయపూర్వక స్వీయసూచన; తప్పనిసరిగా అక్షరార్థ దాసత్వాన్ని సూచించదు.
- source_word: גַּרְתִּי
  choice: పరదేశిగా నివసిస్తూ
  rationale: גור లోని బయటి వ్యక్తిగా లేదా తాత్కాలిక నివాసిగా ఉండే భావాన్ని స్పష్టంగా కాపాడుతుంది.
- source_word: וָאֵחַר
  choice: అక్కడే ఉండిపోయాను
  rationale: ఇప్పటివరకు అక్కడ కొనసాగి ఉండడాన్ని సందర్భానుసారంగా తెలుపుతుంది; కేవలం ‘ఆలస్యమయ్యాను’ అనే భావానికి పరిమితం చేయదు.
- source_word: עַד עָתָּה
  choice: ఇప్పటివరకు
  rationale: కాలపరిమితిని సహజమైన ఆధునిక తెలుగులో ఖచ్చితంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: עַבְדְּךָ యొక్క సామాజిక భావం
  choice: నీ సేవకుడైన
  alternative: నీ దాసుడైన
  rationale: సందర్భంలో ఇది దౌత్యపూర్వక వినయ భాష; యాకోబు నిజంగా ఏశావుకు బానిస అని నిర్ణయించకుండా మూలంలోని గౌరవసూచక స్వీయహీనతను నిలుపుతుంది.
- issue: לַאדֹנִי లోని אדון
  choice: నా ప్రభువైన
  alternative: నా యజమానియైన
  rationale: ఇక్కడ దైవసూచన లేదు. ‘ప్రభువు’ను సామాజిక గౌరవపదంగా వాడి, పాదటిప్పణిలో దాని అర్థాన్ని స్పష్టం చేయడం మూలంలోని మర్యాదను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరతతో కూడిన సాధారణ పఠనశైలి. హీబ్రూ దూత-సందేశ నిర్మాణాన్ని నిలుపుతూ, తెలుగులో అసహజమైన పలుమార్లు ‘అని చెప్పి’ పునరుక్తిని తగ్గించాం. ‘పరదేశిగా’ అనే రూపం גור యొక్క ముఖ్య భావాన్ని ప్రధాన పాఠ్యంలోనే ఉంచుతుంది.
