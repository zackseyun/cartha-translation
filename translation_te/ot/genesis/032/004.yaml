  yaml_path: translation/ot/genesis/032/004.yaml
  text: Jacob sent messengers ahead of him to Esau his brother[a], to the land of Seir, the country of Edom.
translation:
  language: te
  text: యాకోబు తనకంటే ముందుగా దూతలను తన సోదరుడైన ఏశావు దగ్గరికి పంపాడు; అతడు శేయీరు దేశంలోని ఎదోము ప్రాంతంలో[a] ఉన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా ‘ఎదోము పొలం’ లేదా ‘ఎదోము మైదానం.’ ఇక్కడ అది ఎదోము దేశప్రాంతాన్ని సూచించే భౌగోళిక పదబంధంగా ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: పంపాడు
  rationale: שלח క్రియ ఇక్కడ వరుస కథనంలోని గత చర్యను సూచిస్తుంది; ‘పంపాడు’ సహజమైన, నేరమైన తెలుగు సమానం.
- source_word: מַלְאָכִים
  choice: దూతలను
  rationale: מַלְאָכִים అనే పదానికి ‘దూతలు’ లేదా ‘దేవదూతలు’ అనే అర్థాలు ఉండవచ్చు. ఇక్కడ యాకోబు ఏశావు దగ్గరికి పంపిన మానవ ప్రతినిధులు ఉద్దేశించబడ్డారు; ‘దూతలు’ ఆ అర్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: לְפָנָיו
  choice: తనకంటే ముందుగా
  rationale: అక్షరార్థంగా ‘అతని ముఖానికి/సన్నిధికి ముందు’; సందర్భంలో యాకోబు తాను వెళ్లకముందే వారిని ముందుగా పంపాడనే భావాన్ని ఇది స్పష్టంగా అందిస్తుంది.
- source_word: אֶל עֵשָׂו אָחִיו
  choice: తన సోదరుడైన ఏశావు దగ్గరికి
  rationale: గమ్యాన్ని సూచించే אֶל ను ‘దగ్గరికి’గా, బంధుత్వాన్ని సహజమైన తెలుగు పదక్రమంలో అందించింది.
- source_word: אַרְצָה שֵׂעִיר
  choice: శేయీరు దేశానికి
  rationale: దిశను సూచించే הָ ముగింపుతో ఉన్న אַרְצָה కదలికను తెలియజేస్తుంది; ‘దేశానికి’ మూలంలోని ‘దేశం/భూమి’ అనే నామవాచకాన్ని నిలుపుతుంది.
- source_word: שְׂדֵה אֱדֹם
  choice: ఎదోము ప్రాంతమైన
  rationale: అక్షరార్థంగా ‘ఎదోము పొలం/మైదానం’; ఇక్కడ అది భౌగోళిక ప్రాంతనామంగా పనిచేస్తుంది. ‘ప్రాంతం’ ఆధునిక తెలుగులో సందర్భానుకూలంగా, సహజంగా ఉంటుంది.
