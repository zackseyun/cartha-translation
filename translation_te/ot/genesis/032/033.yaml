- from: అందుచేత, నేటివరకు ఇశ్రాయేలు కుమారులు[a] తొడ గూటిమీద ఉండే తుంటి స్నాయువును[b] తినరు. ఎందుకంటే ఆయన యాకోబు తొడ గూటిని తుంటి స్నాయువు దగ్గర తాకాడు.
  to: అందుచేత, నేటివరకు ఇశ్రాయేలు కుమారులు[a] తొడ కీలు గూటిమీద ఉండే తుంటి స్నాయువును[b] తినరు. ఎందుకంటే యాకోబు తొడ కీలు గూటిని తుంటి స్నాయువు వద్ద తాకినందువల్ల.
