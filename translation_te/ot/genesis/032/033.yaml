source:
  edition: WLC
  text: עַל כֵּ֡ן לֹֽא יֹאכְל֨וּ בְנֵֽי יִשְׂרָאֵ֜ל אֶת גִּ֣יד הַ/נָּשֶׁ֗ה אֲשֶׁר֙ עַל כַּ֣ף הַ/יָּרֵ֔ךְ עַ֖ד הַ/יּ֣וֹם הַ/זֶּ֑ה כִּ֤י נָגַע֙ בְּ/כַף יֶ֣רֶךְ יַעֲקֹ֔ב בְּ/גִ֖יד הַ/נָּשֶֽׁה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/033.yaml
  text: Therefore[a], to this day the sons of Israel do not eat the sinew of the hip, which is on the socket of the thigh[d][c][b], because he touched the socket of Jacob’s thigh at the sinew of the hip.
translation:
  language: te
  text: అందుచేత, నేటివరకు ఇశ్రాయేలు కుమారులు[a] తొడ కీలు గూటిమీద ఉండే తుంటి స్నాయువును[b] తినరు. ఎందుకంటే యాకోబు తొడ కీలు గూటిని తుంటి స్నాయువు వద్ద తాకినందువల్ల.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఇశ్రాయేలీయులు”; హీబ్రూలో అక్షరార్థంగా “ఇశ్రాయేలు కుమారులు.”
    reason: lexical_alternative
  - marker: b
    text: ఈ హీబ్రూ పదబంధం తుంటి లేదా తొడ దగ్గర ఉన్న ఒక ప్రత్యేక స్నాయువును సూచిస్తుంది. కొందరు దీన్ని మరింత నిర్దిష్టంగా సయాటిక్ నరం లేదా దాని స్నాయువుగా గుర్తిస్తారు.
    reason: cultural_note
lexical_decisions:
- source_word: עַל כֵּן
  choice: అందుచేత
  rationale: కొనసాగుతున్న ఆచారానికి ముందున్న సంఘటనే కారణమని తెలిపే సహజమైన కారణార్థక అనుసంధానం.
- source_word: לֹא יֹאכְלוּ
  choice: తినరు
  rationale: నిషేధార్థక అసంపూర్ణ క్రియ ఇక్కడ కొనసాగుతున్న సాధారణ ఆచారాన్ని సూచిస్తుంది; తెలుగు వర్తమాన రూపం దానిని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: హీబ్రూ కుటుంబసంబంధ పదబంధాన్ని నిలుపుతుంది; భావార్థమైన ‘ఇశ్రాయేలీయులు’ను పాదటిప్పణిలో ఇచ్చాం.
- source_word: גִּיד הַנָּשֶׁה
  choice: తుంటి స్నాయువు
  rationale: גִּיד సూచించే నరం/స్నాయువు వంటి తాడురూప కణజాలాన్ని అతిగా శరీరశాస్త్రీయంగా నిర్ధారించకుండా, సందర్భంలోని తుంటి ప్రాంతంతో కలిపి తెలుగులో స్పష్టంగా తెలిపే రూపం.
- source_word: אֲשֶׁר עַל כַּף הַיָּרֵךְ
  choice: తొడ గూటిమీద ఉండే
  rationale: כַּף యొక్క గుంట లేదా కీలు-గూటి భావాన్నీ, יָרֵךְ యొక్క తొడ/తుంటి ప్రాంతాన్నీ సహజమైన శరీర నిర్మాణ భాషలో వ్యక్తం చేస్తుంది.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: నేటివరకు
  rationale: ఆ ఆచారం వాక్యకర్త కాలం వరకు కొనసాగిందని తెలిపే సహజమైన తెలుగు కాలవ్యక్తీకరణ.
- source_word: כִּי נָגַע
  choice: ఎందుకంటే ఆయన ... తాకాడు
  rationale: נגע యొక్క ప్రాథమిక అర్థమైన ‘తాకు’ను నిలుపుతుంది; సందర్భంలో ఆ స్పర్శకు గాయపరిచే శక్తి ఉన్నప్పటికీ ‘కొట్టాడు’ అని అతిగా నిర్ధారించదు.
- source_word: בְּכַף יֶרֶךְ יַעֲקֹב
  choice: యాకోబు తొడ గూటిని
  rationale: ముందటి శరీర నిర్మాణ పదబంధంతో ఏకరీతిని కాపాడుతుంది.
- source_word: בְּגִיד הַנָּשֶׁה
  choice: తుంటి స్నాయువు దగ్గర
  rationale: בְను స్పర్శ జరిగిన స్థానాన్ని సూచించే అవ్యయంగా తీసుకొని, పునరావృతమైన పదబంధాన్ని ఒకే విధంగా అనువదించింది.
