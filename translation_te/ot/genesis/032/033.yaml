translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. మూలంలోని శరీర నిర్మాణ అనిశ్చితిని ప్రధాన పాఠంలో అతిగా సాంకేతికంగా నిర్ధారించకుండా, పాదటిప్పణిలో ప్రత్యామ్నాయ గుర్తింపులను తెలిపింది.
