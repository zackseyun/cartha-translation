source:
  edition: WLC
  text: וַ/יָּ֣קָם בַּ/לַּ֣יְלָה ה֗וּא וַ/יִּקַּ֞ח אֶת שְׁתֵּ֤י נָשָׁי/ו֙ וְ/אֶת שְׁתֵּ֣י שִׁפְחֹתָ֔י/ו וְ/אֶת אַחַ֥ד עָשָׂ֖ר יְלָדָ֑י/ו וַֽ/יַּעֲבֹ֔ר אֵ֖ת מַעֲבַ֥ר יַבֹּֽק׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/023.yaml
  text: That night he arose and took his two wives[a], his two female servants, and his eleven children, and crossed the ford of the Jabbok.
translation:
  language: te
  text: ఆ రాత్రి అతడు లేచి, తన ఇద్దరు భార్యలను, తన ఇద్దరు దాసీలను[a], తన పదకొండు మంది పిల్లలను తీసుకొని, యబ్బోకు నది రేవును దాటాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేక ‘తన ఇద్దరు బానిస స్త్రీలను.’ హీబ్రూ పదం ఇంటి ఆధీన సేవకులుగా ఉన్న స్త్రీలను సూచిస్తుంది; వారి స్థితిలో బానిసత్వం కూడా ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: అతడు లేచి
  rationale: קום అనే క్రియ ఇక్కడ లేవడం అనే అర్థంలో కథనాన్ని ముందుకు నడిపిస్తుంది; ‘లేచి’ ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: בַּלַּיְלָה הוּא
  choice: ఆ రాత్రి
  rationale: కాలసూచక భావాన్ని, హీబ్రూలోని సూచనాత్మక ఉద్ఘాటనను సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: וַיִּקַּח
  choice: తీసుకొని
  rationale: לקח యొక్క ప్రాథమిక అర్థమైన ‘తీసుకోవడం’ను నిలుపుతూ, కుటుంబాన్ని వెంటబెట్టుకొని వెళ్లిన సందర్భానికి సరిపోతుంది.
- source_word: שְׁתֵּי נָשָׁיו
  choice: తన ఇద్దరు భార్యలను
  rationale: ఈ సందర్భంలో נָשִׁים యాకోబు భార్యలను స్పష్టంగా సూచిస్తుంది.
- source_word: שְׁתֵּי שִׁפְחֹתָיו
  choice: తన ఇద్దరు దాసీలను[a]
  rationale: שִׁפְחָה అధీన గృహస్థితిలో ఉన్న స్త్రీ సేవకురాలు లేదా బానిసను సూచిస్తుంది. ‘దాసీలు’ సంక్షిప్తమైన, గౌరవప్రదమైన తెలుగు; బానిసత్వ భావాన్ని ప్రత్యామ్నాయంగా పాదటిప్పణిలో ఉంచాం.
- source_word: אַחַד עָשָׂר יְלָדָיו
  choice: తన పదకొండు మంది పిల్లలను
  rationale: יְלָדִים అనే పదం ‘పిల్లలు/సంతానం’ అని అర్థం; సందర్భాన్ని బట్టి ‘కుమారులు’గా మార్చకుండా మూలంలోని విస్తృత పదాన్ని నిలిపాం.
- source_word: וַיַּעֲבֹר
  choice: దాటాడు
  rationale: ప్రయాణ సందర్భంలో עבר ఒక ప్రదేశాన్ని లేదా జలప్రవాహాన్ని దాటడాన్ని సూచిస్తుంది.
- source_word: אֵת מַעֲבַר יַבֹּק
  choice: యబ్బోకు రేవు
  rationale: מַעֲבַר నదిని దాటగల స్థలాన్ని, అంటే రేవును, సూచిస్తుంది; ‘యబ్బోకు రేవు’ తెలుగులో సహజమైన స్థలనామ ప్రయోగం.
- source_word: יַבֹּק
  choice: యబ్బోకు
  rationale: హీబ్రూ స్థలనామానికి తెలుగు లిప్యంతరీకరణ.
