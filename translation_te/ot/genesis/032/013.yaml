  register: ఆధునిక ప్రామాణిక తెలుగులో, ప్రార్థనలోని గౌరవభరితమైన ప్రత్యక్ష సంబోధనను నిలుపుతూ సాధారణ పాఠకులకు స్పష్టంగా ఉండే పదజాలం వాడబడింది. ‘తప్పకుండా’ ద్వారా హెబ్రీ బలప్రయోగం, ‘సంతానం’ ద్వారా సమూహవాచక ఏకవచనం సంరక్షించబడ్డాయి.
