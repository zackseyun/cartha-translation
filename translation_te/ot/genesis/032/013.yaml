source:
  edition: WLC
  text: וְ/אַתָּ֣ה אָמַ֔רְתָּ הֵיטֵ֥ב אֵיטִ֖יב עִמָּ֑/ךְ וְ/שַׂמְתִּ֤י אֶֽת זַרְעֲ/ךָ֙ כְּ/ח֣וֹל הַ/יָּ֔ם אֲשֶׁ֥ר לֹא יִסָּפֵ֖ר מֵ/רֹֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/013.yaml
  text: But you said[a], ‘I will surely do you good, and I will make your offspring like the sand of the sea[c][b], which cannot be counted because of its abundance.’
translation:
  language: te
  text: 'అయితే నీవు ఇలా చెప్పావు: “నేను నీకు తప్పకుండా మేలు చేస్తాను[a]; నీ సంతానాన్ని[b] సముద్రపు ఇసుకవలె చేస్తాను—అది విస్తారంగా ఉండడం వల్ల లెక్కించలేనిది[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘తప్పకుండా మేలు చేస్తాను’ అనే మాటలో హెబ్రీ ఒకే ధాతువుకు చెందిన ప్రత్యేక బలప్రయోగ రూపాన్ని క్రియతో కలిపి ఉపయోగించి వాగ్దానాన్ని బలంగా నొక్కిచెబుతుంది.
    reason: source_emphasis
  - marker: b
    text: ‘నీ వంశస్థులను’ అని కూడా అనువదించవచ్చు. హెబ్రీలోని זֶרַע అనే పదం సంతానమంతటినీ ఒక సమూహంగా సూచించే ఏకవచన పదం.
    reason: lexical_alternative
  - marker: c
    text: ‘సంఖ్యించలేనిది’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: అయితే నీవు
  rationale: స్వతంత్ర సర్వనామంతో కూడిన సంధి పదం, ప్రస్తుత ప్రమాదానికి దేవుని వాగ్దానాన్ని ఎదురుగా ఉంచుతూ యాకోబు చేస్తున్న విజ్ఞప్తిలోని వ్యత్యాసాన్ని వ్యక్తం చేస్తుంది.
- source_word: הֵיטֵב אֵיטִיב עִמָּךְ
  choice: నేను నీకు తప్పకుండా మేలు చేస్తాను
  rationale: అదే ధాతువుకు చెందిన సంపూర్ణ క్రియారూపం, క్రియావిశేష రూపం కలిసి వాగ్దానాన్ని బలంగా నొక్కిచెబుతున్నాయి. עִם ఇక్కడ ఒకరిపట్ల మేలుగా వ్యవహరించడాన్ని సూచిస్తుంది.
- source_word: וְשַׂמְתִּי
  choice: చేస్తాను
  rationale: సంతానాన్ని ఇసుకవలె విస్తారంగా చేయడం అనే సందర్భంలో שׂים అనే క్రియకు ‘చేయు’ అనేది సహజమైన సందర్భార్థం.
- source_word: זַרְעֲךָ
  choice: నీ సంతానాన్ని
  rationale: זֶרַע ఏకవచన రూపంలో ఉన్న సమూహవాచకం. ‘సంతానం’ తెలుగు భాషలో ఈ సమూహ భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: כְּחוֹל הַיָּם
  choice: సముద్రపు ఇసుకలా
  rationale: మూలంలోని ఉపమానాన్ని సరళంగా, సహజమైన తెలుగు పదక్రమంలో నిలుపుతుంది.
- source_word: אֲשֶׁר לֹא יִסָּפֵר מֵרֹב
  choice: విస్తారంగా ఉండడం వల్ల లెక్కించలేని
  rationale: Niphal అసంపూర్ణ క్రియ ఆచరణలో లెక్కించలేని స్థితిని సూచిస్తుంది; מֵרֹב ఆ అసాధ్యతకు కారణమైన విస్తారాన్ని తెలియజేస్తుంది.
