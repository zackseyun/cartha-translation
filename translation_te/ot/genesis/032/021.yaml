    rationale: ‘అతని ముఖాన్ని చూస్తాను’ ప్రామాణిక ప్రయోగం. יִשָּׂא פָנַי అనేది అనుకూల స్వీకరణ లేదా అనుగ్రహాన్ని సూచిస్తుంది; ‘నన్ను అనుకూలంగా స్వీకరిస్తాడేమో’ దానికి మరింత సమీపం.
  revised_text: 'మీరు ఇలా కూడా చెప్పాలి: ‘ఇదిగో, నీ సేవకుడైన యాకోబు మా వెనుక ఉన్నాడు.’ ఎందుకంటే యాకోబు, ‘నా ముందుగా వెళ్తున్న కానుకతో అతణ్ణి ప్రసన్నం చేసుకుంటాను[a]; ఆ తర్వాత అతని ముఖాన్ని చూస్తాను. బహుశా అతడు నన్ను అనుకూలంగా స్వీకరిస్తాడేమో[b]’ అని అనుకున్నాడు.'
