revisions:
- from: “ఇంకా మీరు, ‘ఇదిగో, నీ సేవకుడైన యాకోబు మా వెనుక వస్తున్నాడు’ అని చెప్పాలి.” ఎందుకంటే యాకోబు, “నా ముందుగా వెళ్తున్న ఈ కానుకతో అతణ్ణి శాంతింపజేస్తాను[a]. ఆ తర్వాత అతని ముఖం చూస్తాను; బహుశా అతడు నన్ను ఆదరిస్తాడేమో[b]” అని అనుకున్నాడు.
  to: 'మీరు ఇలా కూడా చెప్పాలి: ‘ఇదిగో, నీ సేవకుడైన యాకోబు మా వెనుక ఉన్నాడు.’ ఎందుకంటే యాకోబు, ‘నా ముందుగా వెళ్తున్న కానుకతో అతణ్ణి ప్రసన్నం చేసుకుంటాను[a]; ఆ తర్వాత అతని ముఖాన్ని చూస్తాను. బహుశా అతడు నన్ను అనుకూలంగా స్వీకరిస్తాడేమో[b]’ అని అనుకున్నాడు.'
  rationale: వాక్య నిర్మాణాన్ని తెలుగు ప్రత్యక్ష ఉద్ధరణ పద్ధతికి అనుగుణంగా సవరించాం. ‘మా వెనుక ఉన్నాడు’ ద్వారా మూలంలోని స్థానార్థాన్ని, ‘అతని ముఖాన్ని చూస్తాను’ ద్వారా ముఖం-పదప్రయోగాన్ని నిలిపాం. చివరి హీబ్రూ నుడికారాన్ని అర్థవంతమైన తెలుగులో అనువదించి, అక్షరార్థం మరియు సాధ్యమైన భావాలను పాదసూచికలో భద్రపరిచాం. ఈ సవరణలు అర్థాన్ని మార్చవు.
