id: GEN.32.21
reference: Genesis 32:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/אֲמַרְתֶּ֕ם גַּ֗ם הִנֵּ֛ה עַבְדְּ/ךָ֥ יַעֲקֹ֖ב אַחֲרֵ֑י/נוּ כִּֽי אָמַ֞ר אֲכַפְּרָ֣ה פָנָ֗י/ו בַּ/מִּנְחָה֙ הַ/הֹלֶ֣כֶת לְ/פָנָ֔/י וְ/אַחֲרֵי כֵן֙ אֶרְאֶ֣ה פָנָ֔י/ו אוּלַ֖י יִשָּׂ֥א פָנָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/021.yaml
  text: And you shall also say[a], ‘Look, your servant Jacob is behind us,’ for he said, ‘I will appease him with the gift that is going ahead of me, and afterward I will see his face[b]; perhaps he will accept me.’
translation:
  language: te
  text: 'మీరు ఇలా కూడా చెప్పాలి: ‘ఇదిగో, నీ సేవకుడైన యాకోబు మా వెనుక ఉన్నాడు.’ ఎందుకంటే యాకోబు, ‘నా ముందుగా వెళ్తున్న కానుకతో అతణ్ణి ప్రసన్నం చేసుకుంటాను[a]; ఆ తర్వాత అతని ముఖాన్ని చూస్తాను. బహుశా అతడు నన్ను అనుకూలంగా స్వీకరిస్తాడేమో[b]’ అని అనుకున్నాడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “అతని ముఖాన్ని ప్రసన్నం చేసుకుంటాను.” ఇక్కడ వాడిన హీబ్రూ క్రియ ప్రాయశ్చిత్తాన్ని సూచించే పదజాలంతో సంబంధం కలిగి ఉంది; అయితే ఈ సందర్భంలో కానుకతో ఏశావును ప్రసన్నం చేసుకోవడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ నుడికారం అక్షరార్థంగా, “అతడు నా ముఖాన్ని ఎత్తుతాడు”; అంటే, “అతడు నన్ను అంగీకరిస్తాడు” లేదా “నాపై అనుగ్రహం చూపుతాడు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עַבְדְּךָ
  choice: నీ సేవకుడైన
  rationale: ఏశావుతో వినయపూర్వకంగా, తనను తాను తక్కువ చేసుకొని మాట్లాడే సందర్భం ఇది. అందువల్ల ఆధునిక తెలుగులో ‘సేవకుడు’ సహజంగాను, సందర్భోచితంగాను ఉంది.
- source_word: הִנֵּה
  choice: ఇదిగో
  rationale: శ్రోత దృష్టిని ఆకర్షించే హీబ్రూ సంభాషణ అవ్యయానికి ‘ఇదిగో’ సహజమైన, గౌరవప్రదమైన తెలుగు సమానం.
- source_word: אַחֲרֵינוּ
  choice: మా వెనుక వస్తున్నాడు
  rationale: యాకోబు దూతల వెనుకనున్నాడనే స్థానార్థంతో పాటు అతడు వారిని అనుసరించి వస్తున్న భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: אֲכַפְּרָה פָנָיו
  choice: అతణ్ణి శాంతింపజేస్తాను
  rationale: כפר ఇక్కడ ఆరాధనా లేదా బలిపరమైన ప్రాయశ్చిత్తాన్ని కాక, కానుక ద్వారా ఏశావు కోపాన్ని చల్లార్చడాన్ని సూచిస్తుంది. తెలుగు సహజత్వం కోసం ‘ముఖం’ అనే పదబంధాన్ని ప్రధాన పాఠ్యంలో అక్షరార్థంగా ఉంచలేదు.
- source_word: מִנְחָה
  choice: కానుక
  rationale: ఈ కథనంలో ఇది ఏశావును ప్రసన్నం చేయడానికి పంపిన బహుమతి. ‘అర్పణ’ ఆరాధనా భావాన్ని అనవసరంగా కలిగించవచ్చు; ‘కానుక’ సందర్భానికి స్పష్టంగా సరిపోతుంది.
- source_word: הַהֹלֶכֶת לְפָנַי
  choice: నా ముందుగా వెళ్తున్న
  rationale: కానుకల మందలు యాకోబుకంటే ముందుగా ప్రయాణిస్తున్న కొనసాగుతున్న చర్యను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אֶרְאֶה פָנָיו
  choice: అతని ముఖం చూస్తాను
  rationale: హీబ్రూలోని ‘ముఖం’ పునరుక్తిలో కొంత భాగాన్ని నిలుపుతూ, తెలుగులో సహజంగా ‘అతణ్ణి ఎదుర్కొంటాను/కలుస్తాను’ అనే భావాన్ని కూడా అందిస్తుంది.
- source_word: יִשָּׂא פָנַי
  choice: అతడు నన్ను ఆదరిస్తాడు
  rationale: అక్షరార్థంగా ‘నా ముఖాన్ని ఎత్తుతాడు’ అనే హీబ్రూ నుడికారం అనుకూలంగా స్వీకరించడం లేదా దయ చూపడాన్ని సూచిస్తుంది. ‘ఆదరిస్తాడు’ ఆ అనుకూల స్వీకరణను సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: אוּלַי
  choice: బహుశా … ఏమో
  rationale: యాకోబు ఆశతో కూడిన అనిశ్చితిని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: వ్యక్తుల మధ్య సందర్భంలో כפר పదాన్ని అనువదించడం
  choice: అతణ్ణి శాంతింపజేస్తాను
  alternative: అతని ముఖానికి ప్రాయశ్చిత్తం చేస్తాను
  rationale: ఇక్కడ యాకోబు కానుకతో ఏశావును ప్రసన్నం చేసుకోవాలని చూస్తున్నాడు; ఆచారపరమైన ప్రాయశ్చిత్తం గురించి పాఠ్యం చెప్పడం లేదు. మూలపదానికి ప్రాయశ్చిత్త భాషతో సంబంధం ఉన్నప్పటికీ, సందర్భార్థాన్ని ప్రధాన పాఠ్యంలో ఉంచి ఆ సంబంధాన్ని పాదసూచికలో తెలియజేశాం.
- issue: יִשָּׂא פָנַי అనే నుడికారంలోని అనుకూల స్వీకరణ
  choice: అతడు నన్ను ఆదరిస్తాడు
  alternative: అతడు నా ముఖాన్ని ఎత్తుతాడు
  rationale: నుడికారాన్ని అక్షరార్థంగా తెలుగులో ఉంచితే అర్థం అస్పష్టమవుతుంది. ‘ఆదరిస్తాడు’ అనేది స్వీకరించడం, అనుగ్రహం చూపడం అనే భావపరిధిని పూర్తిగా ఒకే అర్థానికి కుదించకుండా అందిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘ఇదిగో,’ ‘సేవకుడు,’ ‘కానుక’ వంటి పదాలు సామాన్య పాఠకులకు స్పష్టంగా ఉంటూనే మూలంలోని దౌత్యపూర్వక వినయాన్ని నిలుపుతాయి. హీబ్రూలో మూడుసార్లు వచ్చే ‘ముఖం’ పదప్రయోగాన్ని తెలుగులో పూర్తిగా అక్షరానువాదం చేయడం అసహజం కావడంతో, మధ్యనున్న ‘అతని ముఖం చూస్తాను’ను నిలిపి మిగతా నుడికారాలను భావానువాదం చేసి పాదసూచికల్లో వివరించాం.
