  text: And he said to him, “What is your name?” And he said, “Jacob.”
translation:
  language: te
  text: అతడు అతనితో, “నీ పేరేమిటి?” అన్నాడు. అతడు, “యాకోబు” అన్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అన్నాడు
  rationale: వావ్-కన్సిక్యూటివ్‌తో ఉన్న אמר కథనాన్ని ముందుకు నడిపిస్తుంది. ఆధునిక తెలుగులో ‘అన్నాడు’ సహజంగా ఉండి, హీబ్రూ కథన ప్రవాహాన్ని కాపాడుతుంది.
- source_word: אֵלָיו
  choice: అతనితో
  rationale: אֶל అనే విభక్త్యర్థక పదం, మూడవ పురుష ఏకవచన పుంలింగ ప్రత్యయంతో, మాట ఎవరిని ఉద్దేశించి చెప్పబడిందో సూచిస్తుంది; తెలుగులో ‘అతనితో’ సహజమైన సమానార్థకం.
- source_word: מַה שְּׁמֶךָ
  choice: నీ పేరేమిటి?
  rationale: అక్షరార్థంగా ‘నీ పేరు ఏమి?’ అనే ప్రశ్నను ఆధునిక ప్రామాణిక తెలుగులో సహజంగా ‘నీ పేరేమిటి?’ అని వ్యక్తం చేస్తారు.
- source_word: וַיֹּאמֶר
  choice: అన్నాడు
  rationale: రెండవ సందర్భంలోనూ సాధారణ ‘చెప్పు/అను’ అనే అర్థాన్నే నిలుపుతూ ‘అన్నాడు’ అని అనువదించబడింది; సందర్భం జవాబును సూచించినా మూలంలో ప్రత్యేకంగా ‘జవాబిచ్చాడు’ అనే క్రియ లేదు.
- source_word: יַעֲקֹב
  choice: యాకోబు
  rationale: వ్యక్తి పేరును తెలుగు బైబిలు వాడుకలో స్థిరపడిన రూపంలో లిప్యంతరీకరించబడింది.
theological_decisions: []
translation_notes:
  register: సరళమైన, గౌరవప్రదమైన ఆధునిక ప్రామాణిక తెలుగు ఉపయోగించబడింది. మూలంలోని పుంలింగ సర్వనామాల అస్పష్టతను అదనపు వ్యక్తి పేర్లు చేర్చి పరిష్కరించలేదు.
