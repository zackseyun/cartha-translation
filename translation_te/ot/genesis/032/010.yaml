id: GEN.32.10
reference: Genesis 32:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּאמֶר֮ יַעֲקֹב֒ אֱלֹהֵי֙ אָבִ֣/י אַבְרָהָ֔ם וֵ/אלֹהֵ֖י אָבִ֣/י יִצְחָ֑ק יְהוָ֞ה הָ/אֹמֵ֣ר אֵלַ֗/י שׁ֧וּב לְ/אַרְצְ/ךָ֛ וּ/לְ/מוֹלַדְתְּ/ךָ֖ וְ/אֵיטִ֥יבָה עִמָּֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/010.yaml
  text: And Jacob said[a], “O God of my father Abraham and God of my father Isaac, O Yahweh, who said to me, ‘Return to your land and to your kindred[b], and I will do you good,’”
translation:
  language: te
  text: 'అప్పుడు యాకోబు ఇలా అన్నాడు: “నా పితరుడైన అబ్రాహాము దేవా, నా పితరుడైన ఇస్సాకు దేవా, ‘నీ దేశానికి, నీ స్వదేశానికి[a] తిరిగి వెళ్లు; నేను నీకు మేలు చేస్తాను[b]’ అని నాతో చెప్పిన యహ్వే,”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: ‘నీ బంధువుల దగ్గరికి.’ హీబ్రూ పదం బంధువుల సమూహాన్ని గానీ, ఒకరి పుట్టిన లేదా స్వదేశ ప్రాంతాన్ని గానీ సూచించవచ్చు.'
    reason: lexical_ambiguity
  - marker: b
    text: 'లేదా: ‘నేను నీతో మంచిగా వ్యవహరిస్తాను.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר יַעֲקֹב
  choice: అప్పుడు యాకోబు ఇలా అన్నాడు
  rationale: వావ్-వరుస కథనాన్ని ముందుకు నడిపిస్తుంది. తెలుగులో సహజమైన కథన ప్రవాహం కోసం ‘అప్పుడు’ వాడి, ప్రత్యక్ష వాక్యం మొదలవుతుందని స్పష్టం చేయడానికి ‘ఇలా’ చేర్చబడింది.
- source_word: אֱלֹהֵי אָבִי אַבְרָהָם וֵאלֹהֵי אָבִי יִצְחָק
  choice: నా తండ్రి అబ్రాహాము దేవా, నా తండ్రి ఇస్సాకు దేవా
  rationale: హీబ్రూ నిర్మాణాన్ని, ప్రార్థనలోని ప్రత్యక్ష సంబోధనను కాపాడుతూ తెలుగులో సహజమైన సంబోధనారూపం వాడబడింది. అబ్రాహాము యాకోబుకు తాత అయినప్పటికీ, మూలంలోని אָבִי (‘నా తండ్రి’) విస్తృత పితృపురుషార్థాన్ని మార్చకుండా ఉంచబడింది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవిక వ్యక్తినామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో లిప్యంతరీకరించబడింది.
- source_word: הָאֹמֵר אֵלַי
  choice: అని నాతో చెప్పిన
  rationale: ఆర్టికల్‌తో ఉన్న కృదంతం దేవుణ్ణి గతంలో మాట్లాడిన వ్యక్తిగా వివరిస్తుంది; తెలుగు సంబంధవాక్య నిర్మాణంలో ఇది సహజంగా వ్యక్తమవుతుంది.
- source_word: שׁוּב לְאַרְצְךָ
  choice: నీ దేశానికి ... తిరిగి వెళ్లు
  rationale: שׁוּב యొక్క తిరిగి వెళ్లడం అనే భౌగోళిక భావాన్ని, אֶרֶץ యొక్క దేశం/భూభాగం భావాన్ని స్పష్టంగా మరియు సహజంగా అందిస్తుంది.
- source_word: וּלְמוֹלַדְתְּךָ
  choice: నీ బంధువుల దగ్గరికి
  rationale: מוֹלֶדֶת కుటుంబ లేదా వంశసంబంధ సమూహాన్ని సూచించగలదు. సందర్భంలో ‘బంధువులు’ సహజమైన ప్రధాన పఠనం; స్వస్థలం లేదా జన్మభూమి అనే భావసంభావ్యతను పాదటిప్పణిలో ఉంచబడింది.
- source_word: וְאֵיטִיבָה עִמָּךְ
  choice: నేను నీకు మేలు చేస్తాను
  rationale: యיטב హిఫిల్ రూపం עִם తో కలిసి అనుగ్రహపూర్వకంగా మేలు చేయడం లేదా మంచిగా వ్యవహరించడం అనే భావం ఇస్తుంది. ‘నీకు మేలు చేస్తాను’ తెలుగులో సహజంగా ఉండి మూలార్థాన్ని నేరుగా అందిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవిక నామం అనువాదం
  choice: యహ్వే
  alternative: ప్రభువు
  rationale: మూలపాఠంలో సాధారణ బిరుదు కాకుండా దేవుని వ్యక్తినామం ప్రత్యక్షంగా ఉంది; అందువల్ల దానిని ‘యహ్వే’గా లిప్యంతరీకరించడం మూలంలోని నామాన్ని కాపాడుతుంది.
- issue: అబ్రాహామును ‘నా తండ్రి’ అని పిలవడం
  choice: నా తండ్రి అబ్రాహాము
  alternative: నా పితరుడైన అబ్రాహాము
  rationale: אָבִי అనే మూలపదాన్ని సవరించి బంధుత్వాన్ని వివరణాత్మకంగా మార్చకుండా, హీబ్రూ పితృపురుష వాడుకలోని ఉద్వేగాన్ని అలాగే ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ప్రార్థనకు తగిన గౌరవభరితమైన సంబోధన, సాధారణ పాఠకులకు సహజమైన వాక్యనిర్మాణం. వాక్యం తరువాతి వచనంలో కొనసాగుతున్నందున ముగింపులో విరామచిహ్నంగా కామా ఉంచబడింది.
