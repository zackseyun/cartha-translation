revisions:
- from: అప్పుడు యాకోబు చాలా భయపడి, తీవ్రంగా కలతచెందాడు. తనతో ఉన్న ప్రజలను, గొర్రెలు-మేకల మందలను, పశువుల మందలను, ఒంటెలను రెండు శిబిరాలుగా[a] విభజించాడు.
  to: అప్పుడు యాకోబు చాలా భయపడి, కలతచెందాడు. తనతో ఉన్న ప్రజలను, గొర్రెలు-మేకల మందలను, పశువుల మందలను, ఒంటెలను రెండు శిబిరాలుగా[a] విభజించాడు.
