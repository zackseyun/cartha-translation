  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּירָ֧א יַעֲקֹ֛ב מְאֹ֖ד וַ/יֵּ֣צֶר ל֑/וֹ וַ/יַּ֜חַץ אֶת הָ/עָ֣ם אֲשֶׁר אִתּ֗/וֹ וְ/אֶת הַ/צֹּ֧אן וְ/אֶת הַ/בָּקָ֛ר וְ/הַ/גְּמַלִּ֖ים לִ/שְׁנֵ֥י מַחֲנֽוֹת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/008.yaml
  text: Then Jacob was very afraid and distressed[a], and he divided the people who were with him, and the flocks, and the herds, and the camels, into two camps.
translation:
  language: te
  text: అప్పుడు యాకోబు చాలా భయపడి, కలతచెందాడు. తనతో ఉన్న ప్రజలను, గొర్రెలు-మేకల మందలను, పశువుల మందలను, ఒంటెలను రెండు శిబిరాలుగా[a] విభజించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘రెండు గుంపులుగా.’ హీబ్రూ పదం శిబిరాన్ని లేదా వ్యవస్థీకృత గుంపును సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּירָא ... מְאֹד
  choice: చాలా భయపడి
  rationale: ירא భయాన్ని సూచిస్తుంది; מְאֹד దాని తీవ్రతను పెంచుతుంది. ఈ రెండింటినీ సహజమైన ఆధునిక తెలుగులో కలిపి అనువదించాం.
- source_word: וַיֵּצֶר לוֹ
  choice: తీవ్రంగా కలతచెందాడు
  rationale: ఈ హీబ్రూ ప్రయోగం అంతరంగిక ఇబ్బంది, ఆందోళన లేదా వేదనను వ్యక్తం చేస్తుంది. ‘కలతచెందాడు’ సహజమైన తెలుగు; ‘తీవ్రంగా’ సందర్భంలోని బలాన్ని తెలియజేస్తుంది.
- source_word: וַיַּחַץ
  choice: విభజించాడు
  rationale: חצה ఉద్దేశపూర్వకంగా విభజించడం లేదా రెండుగా చేయడం అనే అర్థాన్నిస్తుంది.
- source_word: הָעָם אֲשֶׁר אִתּוֹ
  choice: తనతో ఉన్న ప్రజలను
  rationale: ఇక్కడ עָם ఒక జాతిని కాక యాకోబుతో ప్రయాణిస్తున్న మనుషులను సూచిస్తుంది.
- source_word: הַצֹּאן
  choice: గొర్రెలు-మేకల మందలను
  rationale: צֹאן సాధారణంగా గొర్రెలు, మేకలు వంటి చిన్న పశువుల సమూహాన్ని సూచిస్తుంది; తెలుగు పాఠకునికి పరిధి స్పష్టంగా ఉండేందుకు రెండింటినీ పేర్కొన్నాం.
- source_word: הַבָּקָר
  choice: పశువుల మందలను
  rationale: בָּקָר ప్రధానంగా గోవుల వంటి పెద్ద పశువులను సమూహార్థంలో సూచిస్తుంది; ముందు పదంలోని చిన్న పశువుల మందలతో తేడా నిలిచేలా అనువదించాం.
- source_word: הַגְּמַלִּים
  choice: ఒంటెలను
  rationale: మూలపదానికి నేరమైన, సహజమైన తెలుగు సమానం.
- source_word: לִשְׁנֵי מַחֲנוֹת
  choice: రెండు శిబిరాలుగా
  rationale: מַחֲנֶה శిబిరాన్ని లేదా వ్యవస్థీకృత ప్రయాణ గుంపును సూచించగలదు. తరువాతి వచనంలోని కథన పదజాలంతో అనుసంధానం నిలిచేలా ‘శిబిరాలు’ ఎంచుకున్నాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి పాటించబడింది. మూలంలోని వరుస జాబితా నిర్మాణం తెలుగు వాక్యప్రవాహానికి అనుగుణంగా నిలుపబడింది; మַחֲנוֹת పదంలోని ‘శిబిరాలు/గుంపులు’ అనే అర్థవిస్తృతిని పాదసూచికలో భద్రపరచాం.
