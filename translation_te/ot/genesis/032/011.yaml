revisions:
- from: నీవు నీ సేవకునికి చూపిన కృపలన్నిటికీ, విశ్వసనీయత అంతటికీ నేను తగినవాడిని కాను.[a] నా చేతికర్రతోనే ఈ యొర్దాను దాటాను; ఇప్పుడైతే రెండు శిబిరాలుగా అయ్యాను.
  to: నీవు నీ సేవకునికి చూపిన కృపలన్నిటికీ, సమస్త విశ్వసనీయతకూ నేను అర్హుడిని కాను.[a] నా చేతికర్రతో ఈ యొర్దానును దాటాను; ఇప్పుడు నేను రెండు శిబిరాలుగా అయ్యాను.
  rationale: The revision removes the unsupported emphasis in చేతికర్రతోనే, retains the demonstrative ‘this Jordan,’ and keeps the deliberately concrete ‘two camps.’ It also makes the humility idiom more direct and natural while preserving the distinction between God’s acts of kindness and faithfulness. The footnote is adjusted to match the revised wording and source scope.
