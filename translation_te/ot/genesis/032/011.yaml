  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: קָטֹ֜נְתִּי מִ/כֹּ֤ל הַ/חֲסָדִים֙ וּ/מִ/כָּל הָ֣/אֱמֶ֔ת אֲשֶׁ֥ר עָשִׂ֖יתָ אֶת עַבְדֶּ֑/ךָ כִּ֣י בְ/מַקְלִ֗/י עָבַ֨רְתִּי֙ אֶת הַ/יַּרְדֵּ֣ן הַ/זֶּ֔ה וְ/עַתָּ֥ה הָיִ֖יתִי לִ/שְׁנֵ֥י מַחֲנֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/011.yaml
  text: I am unworthy of all the steadfast love and all the faithfulness that you have shown to your servant[a], for with my staff I crossed this Jordan[c][b], and now I have become two camps.
translation:
  language: te
  text: నీవు నీ సేవకునికి చూపిన కృపలన్నిటికీ, సమస్త విశ్వసనీయతకూ నేను అర్హుడిని కాను.[a] నా చేతికర్రతో ఈ యొర్దానును దాటాను; ఇప్పుడు నేను రెండు శిబిరాలుగా అయ్యాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “నీ కృపలన్నిటికంటే, సమస్త విశ్వసనీయతకంటే నేను అల్పుడిని.” ఇది దేవుని ఔదార్యం ఎదుట వినయాన్ని తెలిపే హీబ్రూ ప్రయోగం.
    reason: lexical_alternative
lexical_decisions:
- source_word: קָטֹנְתִּי
  choice: నేను తగినవాడిని కాను
  rationale: అక్షరార్థంగా ‘నేను చిన్నవాడిని/అల్పుడిని’ అనే భావం ఉన్నా, దేవుడు చూపిన ఔదార్యంతో పోల్చుకొని యాకోబు తన అయోగ్యతను వినయంగా ఒప్పుకుంటున్న సందర్భార్థాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: הַחֲסָדִים
  choice: కృపలన్నిటికీ
  rationale: חסד దేవుని స్థిరమైన, నిబద్ధమైన దయను సూచిస్తుంది. ఇక్కడి బహువచనం ఆయన చేసిన అనేక కృపాకార్యాలను సూచిస్తున్నందున తెలుగు బహువచనం నిలుపబడింది.
- source_word: הָאֱמֶת
  choice: విశ్వసనీయత అంతటికీ
  rationale: חסדతో జతగా ఉన్న אמת ఇక్కడ నైరూప్యమైన ‘సత్యం’ కంటే నమ్మదగిన స్థిరత్వం, నమ్మకత్వం అనే సంబంధపరమైన భావాన్ని ఇస్తుంది.
- source_word: עָשִׂיתָ אֶת עַבְדֶּךָ
  choice: నీవు నీ సేవకునికి చూపిన
  rationale: అక్షరార్థంగా ‘నీ సేవకునితో/నీ సేవకునికి చేసిన’ అని ఉన్నా, కృప మరియు విశ్వసనీయతకు సంబంధించి ‘చూపిన’ అనేది సహజమైన తెలుగు ప్రయోగం.
- source_word: בְמַקְלִי
  choice: నా చేతికర్రతోనే
  rationale: ‘నా కర్రతో’ అనే మూల భావాన్ని నిలుపుతూ, తెలుగు వాక్యంలో ‘నే’ సందర్భంలో సూచితమైన యాకోబు నిరాడంబర స్థితిని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: עָבַרְתִּי אֶת הַיַּרְדֵּן הַזֶּה
  choice: ఈ యొర్దాను దాటాను
  rationale: హీబ్రూ నిర్దేశక పదమైన ‘ఈ’ని నిలుపుతూ, క్రియను సహజమైన తెలుగులో సరళ భూతకాలంగా అనువదిస్తుంది.
- source_word: הָיִיתִי לִשְׁנֵי מַחֲנוֹת
  choice: రెండు శిబిరాలుగా అయ్యాను
  rationale: యాకోబు కుటుంబసమూహం ఇప్పుడు రెండు శిబిరాలుగా ఏర్పడిందనే హీబ్రూ రూపకాన్ని నేరుగా నిలుపుతుంది.
theological_decisions:
- issue: חסד మరియు אמת అనే జంటను దేవుని కార్యాలకు వర్తింపజేయడం
  choice: కృపలు / విశ్వసనీయత
  alternative: స్థిరమైన ప్రేమ / సత్యం
  rationale: ఈ జంట దేవుని నిబద్ధమైన దయను, నమ్మదగిన స్థిరత్వాన్ని తెలియజేస్తుంది. రెండింటినీ ఒకే భావంగా కలపకుండా వాటి ప్రత్యేకతను నిలుపుతూ, మతశాఖాపరమైన ప్రత్యేక వ్యాఖ్యానాన్ని నివారిస్తుంది.
- issue: קָטֹנְתִּיలోని యాకోబు వినయ ప్రకటన
  choice: నేను తగినవాడిని కాను
  alternative: నేను అల్పుడిని
  rationale: ఇది మానవ విలువ గురించి సంపూర్ణ సిద్ధాంత ప్రకటనగా కాక, దేవుని సమృద్ధిగల కృపల ఎదుట యాకోబు వ్యక్తం చేసిన వినయపూర్వక అయోగ్యతగా అనువదించబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ప్రార్థనకు తగిన గౌరవభావంతో, సాధారణ పాఠకులకు స్పష్టంగా ఉంటుంది. ‘కృపలు’ ద్వారా హీబ్రూ బహువచనాన్ని, ‘రెండు శిబిరాలు’ ద్వారా కథనంలోని దృశ్యరూపాన్ని నిలుపుకుంది.
