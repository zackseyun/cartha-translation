  text: גְּמַלִּ֧ים מֵינִיק֛וֹת וּ/בְנֵי/הֶ֖ם שְׁלֹשִׁ֑ים פָּר֤וֹת אַרְבָּעִים֙ וּ/פָרִ֣ים עֲשָׂרָ֔ה אֲתֹנֹ֣ת עֶשְׂרִ֔ים וַ/עְיָרִ֖ם עֲשָׂרָֽה׃
