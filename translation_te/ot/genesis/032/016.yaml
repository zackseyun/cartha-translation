  yaml_path: translation/ot/genesis/032/016.yaml
  text: thirty nursing camels and their young[a], forty cows and ten bulls, twenty female donkeys and ten foals.
translation:
  language: te
  text: పిల్లలకు పాలిచ్చే ఒంటెలు, వాటి పిల్లలు—మొత్తం ముప్పై; ఆవులు నలభై, ఎద్దులు పది; ఆడ గాడిదలు ఇరవై, మగ గాడిదలు[a] పది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘గాడిద పిల్లలు’ లేదా ‘చిన్న గాడిదలు.’ హీబ్రూ పదం చిన్న గాడిదను లేదా గాడిద పిల్లను సూచించగలదు; అయితే ఈ పశువుల జాబితాలో ఆడ గాడిదలకు జతగా ఉన్న మగ గాడిదలను సూచించే అవకాశం కూడా ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: גְּמַלִּים מֵינִיקוֹת וּבְנֵיהֶם
  choice: పాలు ఇస్తున్న ఒంటెలు, వాటి పిల్లలు
  rationale: מֵינִיקוֹת అనేది పిల్లలకు పాలిచ్చే ఆడ ఒంటెలను సూచిస్తుంది; וּבְנֵיהֶם జంతువుల సందర్భంలో సహజంగా ‘వాటి పిల్లలు’ అవుతుంది.
- source_word: שְׁלֹשִׁים
  choice: మొత్తం ముప్పై
  rationale: హీబ్రూ వాక్యనిర్మాణంలో సంఖ్య ఒంటెలను, వాటి పిల్లలను కలిపిన సమూహాన్ని లెక్కిస్తున్నట్లు సహజంగా అర్థమవుతుంది; తెలుగులో అపార్థం రాకుండా ‘మొత్తం’ చేర్చబడింది.
- source_word: פָּרוֹת
  choice: ఆవులు
  rationale: ఆడ పశువులను సూచించే సాధారణ, సహజ తెలుగు పదం.
- source_word: וּפָרִים
  choice: ఎద్దులు
  rationale: ఇక్కడ ఆవులకు జతగా మగ పశువులను సూచిస్తుంది; ఆధునిక సాధారణ తెలుగులో ‘ఎద్దులు’ సహజంగా ఉంటుంది.
- source_word: אֲתֹנֹת
  choice: ఆడ గాడిదలు
  rationale: మూలపదం ఆడ గాడిదలను స్పష్టంగా సూచిస్తుంది.
- source_word: וַעְיָרִם
  choice: మగ గాడిదలు
  rationale: עַיִר యువ గాడిదను లేదా మగ గాడిదను సూచించగలదు; పశువుల జాబితాలో ఆడ గాడిదలకు జతగా ఉన్నందున ‘మగ గాడిదలు’ సందర్భోచిత ప్రధాన అనువాదం.
