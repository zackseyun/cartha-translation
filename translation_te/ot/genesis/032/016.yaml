  to: పిల్లలకు పాలిచ్చే ఒంటెలు, వాటి పిల్లలు—మొత్తం ముప్పై; ఆవులు నలభై, ఎద్దులు పది; ఆడ గాడిదలు ఇరవై, మగ గాడిదలు[a] పది.
