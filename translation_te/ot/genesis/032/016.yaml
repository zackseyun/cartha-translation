translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన జాబితా శైలి. సంఖ్యా సమూహాలను సెమీకోలన్‌లతో వేరు చేసి పఠనసౌలభ్యం కల్పించబడింది.
