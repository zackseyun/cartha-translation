language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּ֥לֶן שָׁ֖ם בַּ/לַּ֣יְלָה הַ/ה֑וּא וַ/יִּקַּ֞ח מִן הַ/בָּ֧א בְ/יָד֛/וֹ מִנְחָ֖ה לְ/עֵשָׂ֥ו אָחִֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/014.yaml
  text: 'So he spent that night there[a], and he took from what came to his hand a gift for Esau his brother:'
translation:
  language: te
  text: 'అతడు ఆ రాత్రి అక్కడే బస చేశాడు; తన దగ్గర ఉన్న వాటిలోనుండి తన సోదరుడైన ఏశావుకు కానుకగా తీసుకున్నాడు:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּלֶן
  choice: గడిపాడు
  rationale: לון ఇక్కడ రాత్రి అక్కడే ఉండడాన్ని సూచిస్తుంది. ‘ఆ రాత్రి అక్కడే గడిపాడు’ అనేది ఆధునిక తెలుగులో సహజంగా ఉండి కాలసూచనను స్పష్టంగా నిలుపుతుంది.
- source_word: שָׁם
  choice: అక్కడే
  rationale: స్థలాన్ని సూచించే שָׁםకు ‘అక్కడే’ ప్రత్యక్షమైన, సహజమైన సమానం.
- source_word: בַּלַּיְלָה הַהוּא
  choice: ఆ రాత్రి
  rationale: అక్షరార్థంగా ‘ఆ రాత్రిలో’; తెలుగులో ‘ఆ రాత్రి’ సహజమైన కాలప్రయోగం.
- source_word: וַיִּקַּח
  choice: తీసుకున్నాడు
  rationale: לקח యొక్క సాధారణ అర్థమైన ‘తీసుకొను’ను నిలుపుతుంది; కానుక కోసం వాటిని ఎంపిక చేసి తీసుకున్న భావం సందర్భం ద్వారా తెలుస్తుంది.
- source_word: מִן הַבָּא בְיָדוֹ
  choice: తన చేతికి వచ్చినదానిలోనుంచి
  rationale: హీబ్రూ నుడికారపు రూపాన్ని సాధ్యమైనంత దగ్గరగా నిలుపుతూ తెలుగులో అర్థమయ్యేలా అనువదించబడింది. ఇది అతని వద్ద అందుబాటులో ఉన్నదాన్ని సూచించవచ్చు; ఆ సహజార్థం పాదసూచికలో ఇవ్వబడింది.
- source_word: מִנְחָה
  choice: ఒక కానుక
  rationale: ఇది ఆరాధనా అర్పణ కంటే ఏశావుకు పంపే బహుమతిని సూచిస్తుంది. ‘కానుక’ సందర్భానికి తగిన, సాధారణ తెలుగు పదం.
- source_word: לְעֵשָׂו אָחִיו
  choice: తన సహోదరుడైన ఏశావు కోసం
  rationale: לְ గ్రహీతను సూచిస్తుంది; ఏశావుతో ఉన్న సహోదర సంబంధాన్ని కూడా స్పష్టంగా నిలుపుతుంది.
