translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన శైలి వాడబడింది. హీబ్రూ నుడికారాన్ని ప్రధాన పాఠ్యంలో నిలిపి, దాని సహజ తెలుగు అర్థాన్ని పాదసూచికలో ఇచ్చాం. తరువాత వచ్చే కానుకల జాబితాను పరిచయం చేయడానికి చివర ద్విబిందువు ఉంచబడింది.
