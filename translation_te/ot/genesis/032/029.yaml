source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר לֹ֤א יַעֲקֹב֙ יֵאָמֵ֥ר עוֹד֙ שִׁמְ/ךָ֔ כִּ֖י אִם יִשְׂרָאֵ֑ל כִּֽי שָׂרִ֧יתָ עִם אֱלֹהִ֛ים וְ/עִם אֲנָשִׁ֖ים וַ/תּוּכָֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/029.yaml
  text: And he said[a], “Your name shall no longer be called Jacob, but Israel, because you have striven with God and with men[b], and have prevailed.”
translation:
  language: te
  text: అప్పుడు అతడు, “ఇకపై నిన్ను యాకోబు అని పిలవరు; ఇశ్రాయేలు అని పిలుస్తారు. ఎందుకంటే నీవు దేవునితోను[a] మనుష్యులతోను[b] పోరాడి నెగ్గావు” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “దైవిక జీవులతో.” హీబ్రూ పదం אֱלֹהִים కొన్ని సందర్భాల్లో దేవుణ్ణి, దేవతలను, లేదా పరలోక జీవులను సూచించవచ్చు. ఈ కథా సందర్భాన్ని బట్టి ప్రధాన పాఠంలో “దేవుడు” అని అనువదించబడింది.
    reason: alternative_reading
  - marker: b
    text: లేదా “ప్రజలతో” లేదా “మానవులతో.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵאָמֵר
  choice: అని పిలువబడదు / అని పిలువబడుతుంది
  rationale: పేరు పెట్టే ప్రకటనలో אמר యొక్క కర్మణి రూపాన్ని తెలుగులో సహజంగా, మూలంలోని అధికారిక ప్రకటన భావాన్ని నిలుపుతూ వ్యక్తపరుస్తుంది.
- source_word: עוֹד
  choice: ఇకపై
  rationale: పాత పేరు ఇక కొనసాగదనే భావాన్ని సంక్షిప్తంగా, సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: כִּי אִם
  choice: అయితే ... అని పిలువబడుతుంది
  rationale: ‘యాకోబు కాదు, ఇశ్రాయేలు’ అనే వ్యతిరేక నామకరణ నిర్మాణాన్ని తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: יִשְׂרָאֵל
  choice: ఇశ్రాయేలు
  rationale: వ్యక్తి పేరును ప్రామాణిక తెలుగు లిప్యంతరీకరణలో ఉంచి, పేరుకు సంబంధించిన పదచమత్కారాన్ని తరువాతి కారణవాక్యం ద్వారా సూచిస్తుంది.
- source_word: שָׂרִיתָ
  choice: పోరాడి
  rationale: ఈ క్రియలోని పోరాటం/పెనుగులాట భావాన్ని స్పష్టంగా ఉంచుతూ, ఇశ్రాయేలు అనే పేరుతో ఉన్న పదచమత్కారాన్ని సాధ్యమైనంతవరకు నిలుపుతుంది.
- source_word: אֱלֹהִים
  choice: దేవునితో
  rationale: తక్షణ కథా సందర్భంలో ఏకవచనంగా దేవుడే ఉద్దేశించబడ్డాడని ప్రధాన పాఠం సూచిస్తుంది; ఇతర సాధ్యార్థాన్ని పాదసూచికలో నిలిపాం.
- source_word: אֲנָשִׁים
  choice: మనుష్యులతో
  rationale: దేవునితో–మనుష్యులతో అనే వ్యత్యాసాన్ని సహజమైన తెలుగులో ఉంచుతుంది; ‘ప్రజలు’ లేదా ‘మానవులు’ అనే విస్తృత ప్రత్యామ్నాయాలు పాదసూచికలో ఇవ్వబడ్డాయి.
- source_word: וַתּוּכָל
  choice: నెగ్గావు
  rationale: పోరాటంలో సఫలమైన ఫలితాన్ని తెలుపుతుంది; ‘పూర్తిగా ఓడించావు’ అనే అతిశయార్థాన్ని రాకుండా ‘prevailed’ భావాన్ని సంక్షిప్తంగా అందిస్తుంది.
theological_decisions:
- issue: నామకరణ వివరణలో אֱלֹהִים పదానికి సూచితుడు
  choice: దేవుడు
  alternative: దైవిక జీవి లేదా దైవిక జీవులు
  rationale: సందర్భం యాకోబు అనుభవాన్ని దేవునితో జరిగిన సన్నిహితమైన, మర్మమైన సంఘటనగా చూపుతుంది. ప్రధాన పాఠంలో ‘దేవుడు’ అని ఉంచి, ఆ వ్యక్తి స్వరూపం చుట్టూ ఉన్న కథనపు సందిగ్ధతను పాదసూచికలో కాపాడాం.
- issue: אֲנָשִׁים పదం యొక్క పరిధి
  choice: మనుష్యులు
  alternative: ప్రజలు, మానవులు, లేదా సందర్భాన్ని బట్టి పురుషులు
  rationale: తెలుగులో ‘మనుష్యులు’ దేవుడు–మానవులు అనే వాక్య వ్యత్యాసాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది; మూలపదానికి ఉండగల ఇతర పరిధులను పాదసూచిక సూచిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన కానీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ప్రత్యక్ష సంభాషణలో సహజమైన ‘నువ్వు’ రూపం వాడబడింది. మూలంలోని నామకరణ ప్రకటన, దేవుడు–మనుష్యులు అనే వ్యత్యాసం, మరియు పోరాడి నెగ్గిన భావం కాపాడబడ్డాయి.
