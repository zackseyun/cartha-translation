revisions:
- from: 'అప్పుడు ఆయన, “ఇకపై నీ పేరు యాకోబు అని పిలువబడదు; ఇశ్రాయేలు అని పిలువబడుతుంది. ఎందుకంటే నువ్వు దేవునితోనూ[a], మనుష్యులతోనూ[b] పోరాడి నెగ్గావు” అన్నాడు.


