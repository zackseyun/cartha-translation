  text: וְ/אָֽמַרְתָּ֙ לְ/עַבְדְּ/ךָ֣ לְ/יַעֲקֹ֔ב מִנְחָ֥ה הִוא֙ שְׁלוּחָ֔ה לַֽ/אדֹנִ֖/י לְ/עֵשָׂ֑ו וְ/הִנֵּ֥ה גַם ה֖וּא אַחֲרֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/019.yaml
  text: Then you shall say[a], ‘Your servant Jacob's gift is sent to my lord, to Esau; and look[b], he also is behind us.’
translation:
  language: te
  text: 'అప్పుడు నీవు ఇలా చెప్పాలి: “ఇది మీ సేవకుడైన యాకోబు నుండి నా ప్రభువైన ఏశావుకు పంపబడిన కానుక[a]. ఇదిగో, అతడు కూడా మా వెనుక ఉన్నాడు[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “బహుమతి” లేదా “నజరానా.” హెబ్రీ పదం మిన్‌హా (minḥā) ఇక్కడ ఏశావును ప్రసన్నం చేసుకోవడానికి పంపిన కానుకను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా “అతడు కూడా మా తర్వాత వస్తున్నాడు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתָ
  choice: అప్పుడు నీవు … అని చెప్పాలి
  rationale: వావ్‌తో కూడిన పరిపూర్ణ క్రియ ఇక్కడ యాకోబు ఇస్తున్న వరుస ఆదేశాన్ని సూచిస్తుంది. ‘అప్పుడు … చెప్పాలి’ అనేది ఆ క్రమాన్నీ ఆదేశ భావాన్నీ సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: לְעַבְדְּךָ לְיַעֲקֹב
  choice: మీ సేవకుడైన యాకోబు
  rationale: ఏశావు ఎదుట యాకోబు తనను తాను వినయంగా పేర్కొనే సామాజిక మర్యాదాసూత్రాన్ని ఇది నిలుపుతుంది. సందర్భానుసారం ఈ పదబంధాన్ని కానుకకు సంబంధించినదిగా నిర్మించాం.
- source_word: מִנְחָה
  choice: కానుక
  rationale: ఈ కథన సందర్భంలో ఇది ఏశావును ప్రసన్నం చేసుకోవడానికి పంపిన బహుమతిని సూచిస్తుంది; ఆరాధనా అర్పణను తప్పనిసరిగా సూచించదు. ‘కానుక’ సాధారణ పాఠకులకు స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: שְׁלוּחָה
  choice: పంపిన
  rationale: స్త్రీలింగ నిష్క్రియాత్మక కృదంతం కానుక పంపబడినదని తెలియజేస్తుంది. తెలుగులో ‘యాకోబు … పంపిన కానుక’ అనే కర్తృవాచక నిర్మాణం అదే సమాచారాన్ని సహజంగా అందిస్తుంది.
- source_word: לַאדֹנִי לְעֵשָׂו
  choice: నా ప్రభువైన ఏశావుకు
  rationale: ‘ప్రభువు’ ఇక్కడ దేవునికి సంబంధించిన బిరుదు కాదు; ఏశావు పట్ల యాకోబు చూపుతున్న గౌరవపూర్వక సామాజిక సంబోధన. ‘అయిన’ అనే నిర్మాణం హెబ్రీయులోని వివరణాత్మక సమాసాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: తరువాతి విషయంపై దృష్టి నిలిపే హెబ్రీయు సంభాషణ సూచికను గౌరవప్రదమైన, ఇంకా వాడుకలో ఉన్న తెలుగు పదంతో అందించాం.
- source_word: גַּם הוּא
  choice: అతడు కూడా
  rationale: కానుకతో పాటు యాకోబు స్వయంగా వెనుక వస్తున్నాడనే అదనపు ఉద్ఘాటనను నిలుపుతుంది.
- source_word: אַחֲרֵינוּ
  choice: మా వెనుక ఉన్నాడు
  rationale: మందలను పంపిన సేవకుల వెనుక యాకోబు ఉన్న స్థానాన్ని నేరుగా తెలియజేస్తుంది; ‘మా తర్వాత వస్తున్నాడు’ అనే గమనార్థక పఠనం కూడా సాధ్యమేనని పాదటిప్పణిలో సూచించాం.
