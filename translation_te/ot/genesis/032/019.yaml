translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. ‘మీ సేవకుడు,’ ‘నా ప్రభువు’ అనే వినయపూర్వక సామాజిక భాషను నిలిపి, దేవునికి సంబంధించిన ప్రత్యేక అర్థాన్ని ఇందులో కలపలేదు. మూలంలోని పదక్రమాన్ని యథాతథంగా అనుకరించకుండా, దాని భావసంబంధాలను సహజమైన తెలుగు వాక్యనిర్మాణంలో వ్యక్తం చేశాం.
