  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּשְׁאַ֣ל יַעֲקֹ֗ב וַ/יֹּ֨אמֶר֙ הַגִּֽידָ/ה נָּ֣א שְׁמֶ֔/ךָ וַ/יֹּ֕אמֶר לָ֥/מָּה זֶּ֖ה תִּשְׁאַ֣ל לִ/שְׁמִ֑/י וַ/יְבָ֥רֶךְ אֹת֖/וֹ שָֽׁם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/030.yaml
  text: Then Jacob asked[a], “Please tell me your name.” But he said[c][b], “Why is it that you ask my name?” And he blessed him there.
translation:
  language: te
  text: అప్పుడు యాకోబు, “దయచేసి నీ పేరు నాకు చెప్పు” అని అడిగాడు. అందుకు అతడు, “నువ్వు నా పేరు ఎందుకు అడుగుతున్నావు?” అన్నాడు. అక్కడ అతన్ని ఆశీర్వదించాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁאַל ... וַיֹּאמֶר
  choice: అని అడిగాడు
  rationale: హీబ్రూ కథనంలోని ‘అడిగి, అన్నాడు’ అనే జత నిర్మాణాన్ని ఆధునిక తెలుగులో సహజంగా ఒకే మాటల క్రియగా వ్యక్తపరుస్తుంది; ప్రశ్నించడం, పలకడం రెండింటి భావం సందర్భంలో నిలుస్తుంది.
- source_word: הַגִּידָה נָּא
  choice: దయచేసి ... నాకు చెప్పు
  rationale: נגד అనే హిఫీల్ ఆజ్ఞారూపం ‘చెప్పు/తెలియజేయి’ అని, נָא అభ్యర్థనను మృదువుగా చేస్తుందని చూపేందుకు ‘దయచేసి’ వాడబడింది.
- source_word: שְׁמֶךָ
  choice: నీ పేరు
  rationale: మూలంలోని రెండవ పురుష ఏకవచన రూపాన్ని నేరుగా, సహజంగా అందిస్తుంది; ‘పేరు’కు సందర్భంలో ఉన్న గుర్తింపు ప్రాధాన్యాన్ని వివరణగా విస్తరించదు.
- source_word: לָמָּה זֶּה תִּשְׁאַל לִשְׁמִי
  choice: నువ్వు నా పేరు ఎందుకు అడుగుతున్నావు?
  rationale: לָמָּה זֶּה అనే హీబ్రూ ప్రశ్నార్థక ప్రయోగాన్ని తెలుగులో కృత్రిమ పదానువాదం చేయకుండా సహజమైన ప్రశ్నగా అందిస్తుంది; ‘నువ్వు’ను ఉంచడం ప్రశ్నలోని ప్రత్యక్షతను నిలుపుతుంది.
- source_word: וַיְבָרֶךְ אֹתוֹ שָׁם
  choice: అక్కడే అతన్ని ఆశీర్వదించాడు
  rationale: ברךను ‘ఆశీర్వదించాడు’గా, שָׁםను స్థల ప్రాధాన్యంతో ‘అక్కడే’గా అందిస్తుంది. తెలుగు క్రియలో కర్తను మళ్లీ పేర్కొనకపోవడం సహజం మరియు మూలంలోని అంతర్లీన కర్తను అలాగే ఉంచుతుంది.
theological_decisions:
- issue: తన పేరు చెప్పడానికి నిరాకరించిన వక్త యొక్క గుర్తింపు
  choice: ‘అతడు’ అనే సర్వనామంతోనే ఉంచడం; దేవుడు, మనిషి లేదా దూత అని నిర్దిష్టంగా పేర్కొనకపోవడం
  alternative: ‘ఆ మనిషి అన్నాడు’, ‘దేవుడు అన్నాడు’ లేదా ‘దూత అన్నాడు’
  rationale: ఈ వచనంలోని హీబ్రూ వక్తను పేరుతో నిర్దిష్టం చేయదు. విస్తృత సందర్భం అతని గుర్తింపుపై theological సూచనలు ఇచ్చినా, మూలవచనం ఉంచిన అస్పష్టతను అనువాదం పరిష్కరించకూడదు.
- issue: ఆశీర్వదించినవాని కర్త
  choice: చివరి వాక్యంలో కర్తను అంతర్లీనంగా ఉంచడం
  alternative: ‘అతడు అక్కడ యాకోబును ఆశీర్వదించాడు’
  rationale: హీబ్రూలో కర్త క్రియారూపంలో అంతర్లీనంగా ఉండి ముందున్న వక్తనే సూచిస్తుంది. తెలుగు కూడా కర్తను సహజంగా విడిచిపెట్టగలదు; ఈ రూపం వక్త గుర్తింపును అనవసరంగా స్పష్టం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. సంభాషణలో ఏకవచన ‘నీ/నువ్వు’ మూలంలోని రూపానికి అనుగుణంగా ఉంది. పదేపదే సర్వనామాలు వాడకుండా తెలుగు సహజ వాక్యనిర్మాణాన్ని అనుసరించబడింది.
