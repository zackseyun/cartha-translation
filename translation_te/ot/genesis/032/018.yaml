  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְצַ֥ו אֶת הָ/רִאשׁ֖וֹן לֵ/אמֹ֑ר כִּ֣י יִֽפְגָּשְׁ/ךָ֞ עֵשָׂ֣ו אָחִ֗/י וִ/שְׁאֵֽלְ/ךָ֙ לֵ/אמֹ֔ר לְ/מִי אַ֨תָּה֙ וְ/אָ֣נָה תֵלֵ֔ךְ וּ/לְ/מִ֖י אֵ֥לֶּה לְ/פָנֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/018.yaml
  text: And he commanded the first one, saying, “When Esau my brother meets you and asks you, ‘Whose are you, and where are you going, and whose are these before you?’...”
translation:
  language: te
  text: 'అతడు మొదటివానికి ఇలా ఆజ్ఞ ఇచ్చాడు: “నా సోదరుడు ఏశావు నిన్ను కలుసుకొని, ‘నీవు ఎవరివాడివి? ఎక్కడికి వెళ్తున్నావు? నీ ముందున్నవి ఎవరివి?’ అని నిన్ను అడిగితే...”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָרִאשׁוֹן
  choice: ముందుగా వెళ్తున్నవాణ్ణి
  rationale: సందర్భంలో మందలను నడిపిస్తున్న సేవకులలో మొదటివాణ్ణి సూచిస్తుంది; తెలుగులో కేవలం ‘మొదటివాణ్ణి’ కంటే ఇది సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: כִּי יִפְגָּשְׁךָ
  choice: నిన్ను కలుసుకొని
  rationale: כִּי ఇక్కడ సంభావ్య సందర్భాన్ని పరిచయం చేస్తుంది; తెలుగు వాక్య నిర్మాణంలో ‘కలుసుకొని ... అడిగితే’ సహజంగా ఆ భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: לְמִי אַתָּה
  choice: నీవు ఎవరివాడివి?
  rationale: పదశః ‘నీవు ఎవరికి చెందినవాడివి?’ అనే యజమాని/సంబంధ విచారణను సంక్షిప్తమైన సహజ తెలుగులో నిలుపుతుంది.
- source_word: וְאָנָה תֵלֵךְ
  choice: ఎక్కడికి వెళ్తున్నావు?
  rationale: గమ్యస్థానాన్ని అడిగే సాధారణ ప్రశ్నకు సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: וּלְמִי אֵלֶּה לְפָנֶיךָ
  choice: నీ ముందున్న ఇవి ఎవరివి?
  rationale: ముందుగా నడిపించబడుతున్న మందలను సూచించే మూలంలోని సంక్షిప్తతను, స్వామ్య ప్రశ్నను అలాగే ఉంచుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన కథనశైలి. మూలంలోని అసంపూర్ణంగా కొనసాగే ప్రత్యక్ష వాక్యాన్ని చివర మూడు చుక్కలతో నిలిపాం. יְצַו లోని ఆజ్ఞ భావాన్ని ‘ఆజ్ఞాపించాడు’గా స్పష్టంగా వ్యక్తం చేశాం.
