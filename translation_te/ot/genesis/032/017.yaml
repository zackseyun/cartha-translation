source:
  edition: WLC
  text: וַ/יִּתֵּן֙ בְּ/יַד עֲבָדָ֔י/ו עֵ֥דֶר עֵ֖דֶר לְ/בַדּ֑/וֹ וַ֤/יֹּאמֶר אֶל עֲבָדָי/ו֙ עִבְר֣וּ לְ/פָנַ֔/י וְ/רֶ֣וַח תָּשִׂ֔ימוּ בֵּ֥ין עֵ֖דֶר וּ/בֵ֥ין עֵֽדֶר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/017.yaml
  text: He put each herd by itself into the hand of his servants[a], and said to his servants, “Pass on ahead of me[d][c][b], and put a space between herd and herd.”
translation:
  language: te
  text: అతడు ప్రతి మందను విడిగా తన సేవకుల చేతికి అప్పగించి,[a] తన సేవకులతో, “మీరు నాకు ముందుగా వెళ్లండి; ఒక మందకు మరో మందకు మధ్య అంతరం ఉంచండి” అన్నాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “తన సేవకుల చేతిలో పెట్టాడు.” ఇది వారి ఆధీనానికి లేదా సంరక్షణకు అప్పగించడాన్ని తెలిపే హీబ్రూ నుడికారం.
    reason: lexical_alternative
  - marker: b
    text: “ఒక మందకు మరో మందకు మధ్య కొంత ఖాళీ ఉంచండి” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן בְּיַד עֲבָדָיו
  choice: తన సేవకుల చేతికి అప్పగించి
  rationale: ‘చేతిలో/చేతికి ఇవ్వడం’ అనే హీబ్రూ నుడికారం ఒకరి ఆధీనానికి లేదా సంరక్షణకు అప్పగించడాన్ని సూచిస్తుంది. ‘చేతికి అప్పగించి’ మూలంలోని రూపకాన్ని, సందర్భార్థాన్ని రెండింటినీ సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: עֲבָדָיו
  choice: తన సేవకులు
  rationale: עבד అనే పదానికి ‘దాసుడు’ అనే అర్థం సాధ్యమైనా, ఇక్కడ యాకోబు ఆదేశాలను అమలు చేసే ఇంటి పరివార సేవకుల పాత్రే ప్రధానమైనది; అందువల్ల ‘సేవకులు’ సందర్భోచితం.
- source_word: עֵדֶר עֵדֶר לְבַדּוֹ
  choice: మంద మందను విడివిడిగా
  rationale: పదపునరుక్తి పంపిణీ భావాన్ని—ప్రతి మందను వేరుగా—తెలియజేస్తుంది. ‘మంద మందను విడివిడిగా’ ఆ పునరుక్తి బలాన్నీ לְבַדּוֹలోని వేర్పాటు భావాన్నీ కాపాడుతుంది.
- source_word: עִבְרוּ לְפָנַי
  choice: నాకు ముందుగా వెళ్లి
  rationale: עבר యొక్క మూలభావం ‘దాటి/ముందుకు సాగడం’; ఈ ప్రయాణ సందర్భంలో సేవకులు యాకోబుకు ముందుగా వెళ్లాలన్న ఆదేశాన్ని సహజంగా వ్యక్తం చేస్తుంది, నిర్దిష్టమైన దాటును అనవసరంగా సూచించదు.
- source_word: וְרֶוַח תָּשִׂימוּ
  choice: కొంత దూరం ఉంచండి
  rationale: רֶוַח ఇక్కడ ఖాళీ లేదా అంతరాన్ని సూచిస్తుంది. జంతు మందల మధ్య విరామం ఉంచాలనే భావానికి ‘కొంత దూరం’ స్పష్టమైన, సహజమైన తెలుగు.
- source_word: בֵּין עֵדֶר וּבֵין עֵדֶר
  choice: ఒక మందకు మరో మందకు మధ్య
  rationale: హీబ్రూలోని పునరావృత నిర్మాణం ప్రతి రెండు వరుస మందల మధ్య వేర్పాటును నొక్కిచెబుతుంది. ఈ తెలుగు రూపం ఆ పంపిణీ భావాన్ని సహజంగా అందిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన కథన శైలి. ‘మంద మందను’ అనే స్వల్ప పునరుక్తి హీబ్రూ పంపిణీ నిర్మాణాన్ని ఉద్దేశపూర్వకంగా ప్రతిబింబిస్తుంది.
