  terminology: యాకోబు, ‘ఒక మనిషి,’ ‘పెనుగులాడాడు’ అనే పదప్రయోగాలు సరైనవి. ‘ఒక మనిషి’కి ఉన్న b సూచిక, ‘తెల్లవారే వరకు’కి ఉన్న a సూచికలు సరైన స్థానాల్లో ఉన్నాయి. పాదటిప్పణులు ప్రధానపాఠ్యానికి అనుగుణంగా ఉండి, వ్యక్తి గుర్తింపును సిద్ధాంతపరంగా ముందే నిర్ధారించవు.
