id: GEN.32.25
reference: Genesis 32:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּוָּתֵ֥ר יַעֲקֹ֖ב לְ/בַדּ֑/וֹ וַ/יֵּאָבֵ֥ק אִישׁ֙ עִמּ֔/וֹ עַ֖ד עֲל֥וֹת הַ/שָּֽׁחַר׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/025.yaml
  text: And Jacob was left alone[b][a], and a man wrestled with him until the dawn came up.
translation:
  language: te
  text: యాకోబు ఒంటరిగా మిగిలిపోయాడు. ఒక మనిషి[b] తెల్లవారే వరకు[a] అతనితో పెనుగులాడాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఉషోదయం పైకి వచ్చే వరకు’; హీబ్రూలో అక్షరార్థం ఇదే.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ పాఠం ‘ఒక మనిషి’ అని చెబుతుంది; తరువాతి సందర్భం, హోషేయ 12:4 ఈ వ్యక్తి గుర్తింపును మరింతగా తెలియజేస్తాయి.
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּוָּתֵר
  choice: మిగిలిపోయాడు
  rationale: నిఫాల్ రూపంలోని ‘మిగిలి ఉండడం/విడిచిపెట్టబడడం’ అనే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; ఇతరులందరూ దాటిపోయిన తర్వాత యాకోబు ఒక్కడే మిగిలిన కథా సందర్భాన్నీ నిలుపుతుంది.
- source_word: לְבַדּוֹ
  choice: ఒంటరిగా
  rationale: యాకోబు తనంతట తానే, మరెవరూ లేకుండా ఉన్నాడనే కథన ప్రాధాన్యాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וַיֵּאָבֵק
  choice: పెనుగులాడాడు
  rationale: ఇది సాధారణ పోరాటం కంటే శరీరంతో పట్టుకొని చేసే కుస్తీ లేదా పెనుగులాటను సూచించే అరుదైన క్రియ; ‘పెనుగులాడాడు’ సందర్భానికి సరిపోయే స్పష్టమైన తెలుగు పదం.
- source_word: אִישׁ
  choice: ఒక మనిషి
  rationale: హీబ్రూ వచనం ఈ దశలో ఆ వ్యక్తిని కేవలం ‘ఒక మనిషి’గానే పరిచయం చేస్తుంది. అతని గుర్తింపును ముందుగానే దేవదూతగా లేదా దేవునిగా నిర్ధారించకుండా కథలోని ఉత్కంఠను కాపాడుతుంది.
- source_word: עִמּוֹ
  choice: అతనితో
  rationale: ఆ మనిషి యాకోబుతో పెనుగులాడాడని తెలిపే సూటి సంబంధార్థక ప్రయోగం.
- source_word: עַד עֲלוֹת הַשָּׁחַר
  choice: తెల్లవారే వరకు
  rationale: అక్షరార్థంగా ‘ఉషోదయం పైకి వచ్చే వరకు’ అనే భావాన్ని ఆధునిక సాధారణ తెలుగులో సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: పెనుగులాడిన אִישׁ గుర్తింపు
  choice: ప్రధాన పాఠ్యంలో ‘ఒక మనిషి’ అని అనువదించడం
  alternative: ‘ఒక దేవదూత’ లేదా ‘మనిషి రూపంలో వచ్చిన దేవుడు/యెహోవా’ అని స్పష్టీకరించడం
  rationale: ఈ వచనం స్వయంగా అతన్ని ‘ఒక మనిషి’ అని మాత్రమే పేర్కొంటుంది. తరువాతి సందర్భం, హోషేయ 12:4 అతని గుర్తింపుపై మరింత వెలుగు ప్రసరించినా, వాటి ఆధారంగా ఈ వచనంలోని కథన ఉత్కంఠను ముందుగానే పరిష్కరించకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యేలా గంభీరమైన కథన శైలి వాడబడింది. ‘పెనుగులాడాడు’ శారీరకంగా పట్టుకొని పోరాడే భావాన్ని నిలుపుతుంది; ‘ఒక మనిషి’ అనే అనిర్ణీత పరిచయం ఉద్దేశపూర్వకంగా కాపాడబడింది.
