  text: He took them and brought them across the stream[b][a], and he brought across what belonged to him.
translation:
  language: te
  text: అతడు వారిని తీసుకొని వాగు[a] అవతలికి దాటించాడు; తనకు చెందినవాటినన్నిటినీ[b] అవతలికి దాటించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘నీటివాగు,’ ‘లోయలోని వాగు.’ హీబ్రూ పదం נחל ప్రవహించే వాగును, లోయను, లేదా కాలానుగుణంగా నీరు ప్రవహించే జలమార్గాన్ని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘తనకు ఉన్నది’; అంటే తనకు చెందినవాటిని లేదా తన ఆస్తిని.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקָּחֵם
  choice: అతడు వారిని తీసుకొని
  rationale: לקח అనే క్రియకు సాధారణ అర్థమైన ‘తీసుకొను’ను నేరుగా ఉంచుతూ, ముందరి సందర్భంలో ప్రస్తావించిన వ్యక్తులనే ‘వారిని’ సూచిస్తుంది.
- source_word: וַיַּעֲבִרֵם
  choice: వారిని ... దాటించాడు
  rationale: עבר క్రియ హిఫీల్ రూపంలో కారణార్థకంగా ఉంది; యాకోబు వారిని దాటేలా చేశాడనే భావాన్ని సహజమైన ఆధునిక తెలుగులో ‘దాటించాడు’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: הַנָּחַל
  choice: వాగు
  rationale: נחל ప్రవహించే వాగును, లోయలోని నీటిమార్గాన్ని, లేదా కాలానుగుణంగా నీరు ప్రవహించే వాగుపడగను సూచించవచ్చు. ఈ సందర్భంలో ‘వాగు’ సంక్షిప్తంగా, సహజంగా ఉండి దాటే చర్యకు సరిపోతుంది; విస్తృత అర్థపరిధిని పాదటిప్పణిలో ఉంచాం.
- source_word: וַיַּעֲבֵר
  choice: దాటించాడు
  rationale: ఇక్కడ కూడా עבר హిఫీల్ రూపం కారణార్థకమే. వస్తువులను అవతలికి చేర్చాడనే భావాన్ని ‘దాటించాడు’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אֲשֶׁר לוֹ
  choice: తనకు చెందినవాటిని
  rationale: ఈ పదబంధం అక్షరార్థంగా ‘అతనికి ఉన్నది/అతనిదైనది’ అని ఉండి, సందర్భంలో యాకోబుకు చెందిన వస్తువులను సూచిస్తుంది. ‘తనకు చెందినవాటిని’ మూలంలోని సంబంధ నిర్మాణాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
