  - marker: b
    text: లేదా “అతన్ని కలుసుకున్నారు,” “అతనికి ఎదురుపడ్డారు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיַעֲקֹב
  choice: యాకోబు
  rationale: వావ్ సంధిని ప్రత్యేకంగా ‘మరియు’ అని అనువదించకుండా, తెలుగు కథన ప్రవాహంలో సహజంగా వాక్య నిర్మాణం ద్వారా వ్యక్తం చేశాం.
- source_word: הָלַךְ לְדַרְכּוֹ
  choice: తన దారిన వెళ్లగా
  rationale: అక్షరార్థమైన ‘తన దారికి వెళ్లాడు’ కంటే, ప్రయాణాన్ని కొనసాగించాడనే భావాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: וַיִּפְגְּעוּ בוֹ
  choice: అతనికి ఎదురయ్యారు
  rationale: פגע + ב అనే నిర్మాణం ‘కలుసుకోవడం, ఎదురుపడడం’ అనే భావాలను ఇవ్వగలదు. ‘ఎదురయ్యారు’ అనేది శత్రుత్వాన్నిగానీ యాదృచ్ఛికతనుగానీ అనవసరంగా బలపరచకుండా మూలంలోని విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: מַלְאֲכֵי אֱלֹהִים
  choice: దేవుని దూతలు
  rationale: హీబ్రూ సమాసాన్ని పారదర్శకంగా నిలుపుతూ, సందర్భంలో వీరు పరలోక దూతలని సూచిస్తుంది. ‘దేవదూతలు’ అనే సహజ ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
theological_decisions:
- issue: מַלְאֲכֵי אֱלֹהִים ఎవరిని సూచిస్తుంది?
  choice: పరలోక దూతలు
  alternative: దేవుని మానవ సందేశకులు
  rationale: מַלְאָךְ అనే పదం మానవ సందేశకునికీ పరలోక దూతకీ వాడవచ్చు. అయితే తరువాతి వచనంలో యాకోబు ఆ స్థలాన్ని ‘దేవుని శిబిరం’ అని పిలవడం వల్ల ఇక్కడ పరలోక దూతలే ఉద్దేశించబడ్డారని సందర్భం బలంగా సూచిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘వెళ్లగా’ అనే రూపం రెండు హీబ్రూ క్రియలను సహజంగా అనుసంధానిస్తుంది; ‘దేవుని దూతలు’ మూలంలోని నిర్మాణాన్ని నిలుపుతుంది.
