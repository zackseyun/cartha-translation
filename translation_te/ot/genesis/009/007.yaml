- from: మీరైతే ఫలించి విస్తరించండి; భూమిపై విపరీతంగా పెరిగిపొంగండి[a], దానిపై విస్తరించండి.
  to: మీరైతే సంతానవంతులై విస్తరించండి; భూమిపై సమృద్ధిగా వృద్ధి చెందండి[a], దానిలో విస్తరించండి.
  rationale: The revision retains the Hebrew imperatives, their order, the emphatic “మీరైతే,” and the deliberate repetition of רבה. It replaces wording that is overly colloquial or semantically inflated with modern standard Telugu appropriate to a solemn biblical command, and it renders the final locative suffix more closely.
