  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אַתֶּ֖ם פְּר֣וּ וּ/רְב֑וּ שִׁרְצ֥וּ בָ/אָ֖רֶץ וּ/רְבוּ בָֽ/הּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/007.yaml
  text: And as for you[a], be fruitful and multiply; swarm in the earth and multiply in it.
translation:
  language: te
  text: మీరైతే సంతానవంతులై విస్తరించండి; భూమిపై సమృద్ధిగా వృద్ధి చెందండి[a], దానిలో విస్తరించండి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “భూమిపై గుంపులుగుంపులుగా వృద్ధి చెందండి.” హీబ్రూ క్రియ సమృద్ధిగా, గుంపులుగా పెరుగుతూ విస్తరించే భావాన్ని తెలియజేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתֶּם
  choice: మీరైతే
  rationale: సంయోజక అవ్యయంతో కూడిన స్వతంత్ర సర్వనామం సందర్భంలోని నొక్కిచెప్పడాన్ని, పునఃప్రారంభాన్ని సూచిస్తుంది; ‘మీరైతే’ దానిని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: פְּרוּ
  choice: ఫలించండి
  rationale: ప్రజోత్పత్తి ఆశీర్వాద-ఆజ్ఞ సందర్భంలో פרהకు ఉన్న ప్రామాణిక భావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: וּרְבוּ
  choice: విస్తరించండి
  rationale: רבה సూచించే సంఖ్యాపరమైన పెరుగుదలను తెలియజేస్తుంది; వచనం చివరనున్న అదే క్రియను కూడా ఇదే పదంతో అనువదించి పునరుక్తిని నిలిపింది.
- source_word: שִׁרְצוּ
  choice: విపరీతంగా పెరిగిపొంగండి
  rationale: שׁרץలోని గుంపులుగా, అపారంగా వృద్ధిచెందే బలమైన చిత్రాన్ని మనుషులకు వర్తించే సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בָאָרֶץ
  choice: భూమిపై
  rationale: ఇక్కడ אֶרֶץ జలప్రళయం తరువాత మానవులు విస్తరించవలసిన భూమిని సూచిస్తుంది; తెలుగు వాడుకలో ‘భూమిపై’ సహజం.
- source_word: וּרְבוּ בָהּ
  choice: దానిపై విస్తరించండి
  rationale: స్త్రీలింగ ప్రత్యయానికి పూర్వపదమైన ‘భూమి’నే సూచిస్తూ, רבה క్రియ పునరావృతిని నిలుపుతుంది.
theological_decisions:
- issue: సృష్టి ఆజ్ఞతోనూ జలప్రళయానంతర ఆశీర్వాదంతోనూ ఈ వాక్యానికి ఉన్న సంబంధం
  choice: నోవహుకు, అతని కుమారులకు ఇవ్వబడిన పునరుద్ధరిత దైవిక ఆజ్ఞ-ఆశీర్వాద భాషగానే అనువదించడం
  alternative: దీనిని కేవలం ఆదికాండము 1:28 పునరుక్తిగా చూపడం లేదా అదనపు నిబంధనాత్మక సిద్ధాంత పదజాలాన్ని చేర్చడం
  rationale: హీబ్రూ ఆదికాండము 1:28తో సమాంతరమైన ఆజ్ఞారూప ఆశీర్వాద భాషను వాడుతుంది; అనువాదం ఆ ప్రతిధ్వనిని నిలుపుతూ మూలపాఠానికి మించిన సిద్ధాంత వివరణను చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే గంభీరతను కాపాడే ఆజ్ఞారూప శైలి. רבה పునరుక్తి ఉద్దేశపూర్వకంగా నిలుపబడింది; שׁרץ యొక్క అసాధారణమైన బలమైన రూపకం ప్రధాన పాఠంలోనూ పాదటీపులోనూ ప్రతిఫలించింది.
