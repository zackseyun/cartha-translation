id: GEN.9.12
reference: Genesis 9:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֱלֹהִ֗ים זֹ֤את אֽוֹת הַ/בְּרִית֙ אֲשֶׁר אֲנִ֣י נֹתֵ֗ן בֵּינִ/י֙ וּ/בֵ֣ינֵי/כֶ֔ם וּ/בֵ֛ין כָּל נֶ֥פֶשׁ חַיָּ֖ה אֲשֶׁ֣ר אִתְּ/כֶ֑ם לְ/דֹרֹ֖ת עוֹלָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/012.yaml
  text: And God said[a], “This is the sign of the covenant that I am giving between me and you and every living creature that is with you[b], for perpetual generations:”
translation:
  language: te
  text: 'దేవుడు ఇలా అన్నాడు: “నాకూ మీకూ, మీతో ఉన్న ప్రతి జీవికీ మధ్య నేను ఇస్తున్న, తరతరాలపాటు ఉండే నిబంధనకు సూచన ఇదే:”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: ఇలా అన్నాడు
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది; తెలుగులో సందర్భానుసారంగా సహజమైన కథన అనుసంధానం సరిపోతుంది.
- source_word: אֱלֹהִים
  choice: దేవుడు
  rationale: నోవహుతో మాట్లాడుతున్న ఏకైక దేవుణ్ణి సూచించే ప్రామాణిక తెలుగు పదం.
- source_word: זֹאת אוֹת הַבְּרִית
  choice: నిబంధనకు సూచన ఇదే
  rationale: אוֹת అనేది కనిపించే గుర్తు లేదా సూచన; తరువాతి ఇంద్రధనుస్సు సందర్భానికి ‘సూచన’ సహజంగా సరిపోతుంది. సంబంధం స్పష్టంగా ఉండేందుకు తెలుగు వాక్యక్రమాన్ని మార్చాం.
- source_word: אֲשֶׁר אֲנִי נֹתֵן
  choice: నేను ఉంచుతున్న
  rationale: נֹתֵן అక్షరార్థంగా ‘ఇస్తున్న’; అయితే నిబంధనకు సూచనను పక్షాల మధ్య ‘ఉంచడం’ తెలుగులో సహజంగా ఉండి, వర్తమాన/కొనసాగుతున్న భావాన్ని నిలుపుతుంది.
- source_word: בֵּינִי וּבֵינֵיכֶם וּבֵין
  choice: నాకూ మీకూ ... మధ్య
  rationale: పునరుక్త בֵּין సూచించే సంబంధిత పక్షాలన్నిటినీ సహజమైన తెలుగు సముచ్చయ నిర్మాణంలో నిలుపుతుంది.
- source_word: כָּל נֶפֶשׁ חַיָּה
  choice: ప్రతి ప్రాణి
  rationale: ఈ సందర్భంలో మనుషులతోపాటు జంతుజీవులనూ సూచిస్తుంది; ‘ఆత్మ’ అనే అనవసర మానవశాస్త్రీయ లేదా సిద్ధాంతార్థాన్ని దిగుమతి చేయకుండా విస్తృత జీవార్థాన్ని తెలియజేస్తుంది.
- source_word: אֲשֶׁר אִתְּכֶם
  choice: మీతో ఉన్న
  rationale: నోవహు కుటుంబంతో ఉన్న ప్రాణులను గుర్తించే సంబంధవాచక ఉపవాక్యాన్ని సంక్షిప్తంగా, సహజంగా అందిస్తుంది.
- source_word: לְדֹרֹת עוֹלָם
  choice: తరతరాలపాటు
  rationale: דֹרֹת యొక్క తరాల భావాన్నీ עוֹלָם యొక్క నిరంతర కాలవ్యాప్తినీ ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: నిబంధన సంబంధంలో נֹתֵן క్రియ
  choice: నేను ఉంచుతున్న
  alternative: నేను ఇస్తున్న
  rationale: మూలంలోని ‘ఇవ్వడం’ భావాన్ని పూర్తిగా ‘చేయడం/ఏర్పరచడం’గా మార్చకుండా, నిబంధన సూచనను పక్షాల మధ్య ఉంచుతున్న భావంగా అందిస్తుంది. ఇది సిద్ధాంతపరమైన విస్తరణ కాదు; తెలుగు సహజత్వం కోసం చేసిన సందర్భోచిత ఎంపిక.
- issue: נֶפֶשׁ חַיָּה పరిధి
  choice: ప్రతి ప్రాణి
  alternative: ప్రతి జీవాత్మ
  rationale: నోవహు నిబంధన సందర్భంలో జంతువులు కూడా పరిధిలో ఉన్నాయి. ‘జీవాత్మ’ అనడం మూలంలో అవసరం లేని ప్రత్యేక ఆత్మసంబంధ సిద్ధాంత భావాన్ని కలిగించవచ్చు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్యనిర్మాణం. ఈ వచనానికి పాఠ్యార్థాన్ని స్పష్టపరచేందుకు తప్పనిసరి కాని అడుగుటిప్పణులు జోడించలేదు.
