source:
  edition: WLC
  text: וַ/אֲנִ֕י הִנְנִ֥/י מֵקִ֛ים אֶת בְּרִיתִ֖/י אִתְּ/כֶ֑ם וְ/אֶֽת זַרְעֲ/כֶ֖ם אַֽחֲרֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/009.yaml
  text: And as for me[a], behold, I am establishing my covenant with you and with your offspring after you.
translation:
  language: te
  text: ఇక నేనైతే, ఇదిగో, మీతోనూ మీ తరువాత మీ సంతానంతోనూ[a] నా నిబంధనను స్థాపిస్తున్నాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘మీ విత్తనంతోనూ.’ హెబ్రీ పదం సమూహార్థక నామవాచకం; అది సంతానాన్ని లేదా వంశస్థులను సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: ఇక నేనైతే
  rationale: సంయోజక అవ్యయంతో కూడిన స్వతంత్ర సర్వనామం సందర్భంలో విషయమార్పును, స్వల్ప ఉద్ఘాటనను సూచిస్తుంది. ‘ఇక నేనైతే’ ఆ భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: הִנְנִי
  choice: ఇదిగో
  rationale: ఈ పదం గంభీరమైన శ్రద్ధను, ఉద్ఘాటనను సూచిస్తుంది. ‘ఇదిగో’ అదనపు భావాన్ని చేర్చకుండా ఒడంబడిక ప్రకటనలోని గంభీర స్వరాన్ని నిలుపుతుంది.
- source_word: מֵקִים
  choice: స్థాపిస్తున్నాను
  rationale: קום ధాతువు హిఫీల్ రూపంలోని ఈ కృదంతం ఒడంబడికను నెలకొల్పే కార్యాన్ని సూచిస్తుంది. వర్తమాన కొనసాగింపు రూపం కృదంత నిర్మాణాన్నీ, ఈ గంభీర ప్రకటనలోని కార్యసాధక బలాన్నీ ప్రతిబింబిస్తుంది.
- source_word: בְּרִיתִי
  choice: నా నిబంధనను
  rationale: దేవునికీ మనుషులకీ మధ్య అధికారిక బంధాన్ని సూచించే בְּרִית పదానికి ‘నిబంధన’ సాధారణంగా అర్థమయ్యే, గౌరవప్రదమైన బైబిలు పదం.
- source_word: אִתְּכֶם
  choice: మీతోనూ
  rationale: ఈ విభక్తి నోవహుతోను అతనితో ఉన్నవారితోను నిబంధన సంబంధాన్ని నేరుగా సూచిస్తుంది. ‘మీతోనూ’ సమాంతర వాక్యనిర్మాణాన్ని స్పష్టంగా చూపుతుంది.
- source_word: וְאֶת זַרְעֲכֶם
  choice: మీ సంతానంతోనూ
  rationale: זֶרַע అనేది సమూహార్థక ఏకవచన నామవాచకం; అది సంతానాన్ని లేదా వంశస్థులను సూచించగలదు. ‘సంతానం’ ఈ సమూహార్థాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: אַחֲרֵיכֶם
  choice: మీ తరువాత
  rationale: ఈ పదబంధం తరువాతి తరాలను సూచిస్తుంది. ‘మీ తరువాత’ సంక్షిప్తంగా ఉండి మూలంలోని నిర్మాణానికి నమ్మకంగా ఉంటుంది.
theological_decisions:
- issue: దేవుడు-మానవుల సంబంధంలో ఒడంబడిక పదజాలం
  choice: నా నిబంధనను
  alternative: నా ఒడంబడికను
  rationale: ఈ వచనం దేవుడు నోవహుతోను అతని తరువాతి సంతానంతోను నెలకొల్పుతున్న అధికారిక సంబంధాన్ని సూచిస్తుంది. ‘నిబంధన’ హెబ్రీ పదంలోని బైబిలు-దైవశాస్త్ర వర్గాన్ని నిలుపుతూ, మూలంలో లేని అదనపు సిద్ధాంత వివరాన్ని చేర్చదు. ‘ఒడంబడిక’ కూడా సాధ్యమైన సాంప్రదాయ ప్రత్యామ్నాయం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన ఒడంబడిక ప్రకటన శైలిని ఉపయోగించాం. ‘ఇక నేనైతే, ఇదిగో’ అనే క్రమం మూలంలోని విషయమార్పు, ఉద్ఘాటన రెండింటినీ నిలుపుతుంది; వాక్యంలోని ‘తోనూ…తోనూ’ సమాంతరత సంబంధిత రెండు వర్గాలను స్పష్టంగా కలుపుతుంది.
