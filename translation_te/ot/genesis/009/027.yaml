id: GEN.9.27
reference: Genesis 9:27
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: יַ֤פְתְּ אֱלֹהִים֙ לְ/יֶ֔פֶת וְ/יִשְׁכֹּ֖ן בְּ/אָֽהֳלֵי שֵׁ֑ם וִ/יהִ֥י כְנַ֖עַן עֶ֥בֶד לָֽ/מוֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/027.yaml
  text: May God enlarge Japheth[a], and may he dwell in the tents of Shem, and let Canaan be a servant to them.
translation:
  language: te
  text: దేవుడు యాఫెతుకు విస్తారాన్ని కలుగజేయుగాక; షేము గుడారాలలో అతడు నివసించుగాక[a]; కనాను వారికి బానిసగా ఉండుగాక.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దేవుడు షేము గుడారాలలో నివసించుగాక”; మరొక విధంగా, “యాఫెతు షేము గుడారాలలో నివసించుగాక.” ‘నివసించుగాక’ అనే క్రియకు కర్త ఎవరో హీబ్రూ పాఠం స్పష్టంగా చెప్పదు.
    reason: alternative_reading
lexical_decisions:
- source_word: יַפְתְּ
  choice: విస్తరింపజేయుగాక
  rationale: ఈ ఆశీర్వాద సందర్భంలో ‘విశాలపరచడం/స్థలం విస్తరింపజేయడం’ అనే భావాన్ని తెలియజేస్తుంది. యాఫెతు పేరుతో ఉన్న హీబ్రూ శబ్దక్రీడను తెలుగులో సహజంగా పునరుత్పత్తి చేయడం సాధ్యం కాదు.
- source_word: אֱלֹהִים
  choice: దేవుడు
  rationale: రూపరీత్యా బహువచన ఆకారం ఉన్నా, ఇక్కడ క్రియ ఏకవచనంలో ఉంది; సూచించబడుతున్నది ఏక దేవుడే.
- source_word: לְיֶפֶת
  choice: యాఫెతును
  rationale: לְ ఉపసర్గను తెలుగు వాక్యనిర్మాణానికి అనుగుణంగా ‘విస్తరింపజేయు’ క్రియకు కర్మగా వ్యక్తపరిచాం.
- source_word: וְיִשְׁכֹּן
  choice: అతడు నివసించుగాక
  rationale: క్రియలోని ఆకాంక్షార్థాన్ని ‘నివసించుగాక’ నిలుపుతుంది. కర్త దేవుడా, యాఫెతా అనేది హీబ్రూలో స్పష్టంగా చెప్పబడలేదు; ‘అతడు’ ఆ సందిగ్ధతను నిలుపుతుంది.
- source_word: בְּאָהֳלֵי שֵׁם
  choice: షేము గుడారాలలో
  rationale: స్థానార్థాన్ని, అలాగే ‘గుడారాలు’ అనే మూల దృశ్యరూపాన్ని యథాతథంగా నిలుపుతుంది.
- source_word: וִיהִי
  choice: ఉండుగాక
  rationale: నోవహు పలికిన ఆశీర్వాదం/శాపంలోని ఆకాంక్షార్థ శైలిని సహజమైన తెలుగులో కొనసాగిస్తుంది.
- source_word: כְנַעַן
  choice: కనాను
  rationale: వ్యక్తిని లేదా అతని వంశాన్ని సూచించే పేరును ప్రామాణిక తెలుగు రూపంలో ఉంచాం.
- source_word: עֶבֶד
  choice: బానిస
  rationale: ఈ ప్రకటనలో అధీనస్థితి ప్రధానంగా ఉన్నందున, దానిని మృదువుపరచకుండా ‘బానిస’ అని అనువదించాం.
- source_word: לָמוֹ
  choice: వారికి
  rationale: ఈ రూపం ఇక్కడ సహజంగా బహువచనార్థంలో ఉండి, సందర్భంలో షేము మరియు యాఫెతు ఇద్దరినీ సూచిస్తుంది.
theological_decisions:
- issue: ‘షేము గుడారాలలో నివసించుగాక’ అనే మాటలో కర్త ఎవరు?
  choice: ప్రధాన పాఠంలో ‘అతడు’ అని ఉంచి, కర్తను నిర్దిష్టంగా తేల్చలేదు.
  alternative: ‘దేవుడు షేము గుడారాలలో నివసించుగాక’ లేదా ‘యాఫెతు షేము గుడారాలలో నివసించుగాక.’
  rationale: హీబ్రూ ఏకవచన క్రియకు కర్తను స్పష్టంగా పేర్కొనలేదు; సందర్భంలో దేవుడు లేదా యాఫెతు అనే రెండు పఠనాలూ సాధ్యమే. అందువల్ల నిజమైన భాషాత్మక, వ్యాఖ్యానాత్మక సందిగ్ధతను పాఠంలో నిలిపి, ప్రత్యామ్నాయాలను పాదసూచికలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన ఆశీర్వాద/ప్రకటన శైలిని నిలుపుతూ ‘-గాక’ రూపాలు వాడాం. పేర్లకు యాఫెతు, షేము, కనాను అనే సుపరిచిత తెలుగు రూపాలు ఎంచుకున్నాం. హీబ్రూ శబ్దక్రీడను బలవంతంగా అనుకరించకుండా అర్థాన్ని స్పష్టంగా అందించాం.
