  yaml_path: translation/ot/genesis/009/022.yaml
  text: And Ham[a], the father of Canaan, saw his father's nakedness and told his two brothers outside.
translation:
  language: te
  text: కనానుకు తండ్రి అయిన హాము తన తండ్రి నగ్నత్వాన్ని[a] చూసి, బయట ఉన్న తన ఇద్దరు సోదరులకు ఆ సంగతి చెప్పాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘తన తండ్రి యొక్క నగ్నత్వం.’ పాత నిబంధనలోని కొన్ని సందర్భాల్లో ఈ మాట లైంగిక విషయాన్ని సూచించే సభ్యోక్తిగా ఉపయోగించబడవచ్చు. ఇక్కడ అనువాదం అక్షరార్థపు పదప్రయోగాన్ని నిలిపి, ఆ వ్యాఖ్యాన ప్రశ్నను తెరిచి ఉంచుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: చూసి
  rationale: ראה అనే క్రియకు ఇక్కడ సాధారణ అర్థం ‘చూశాడు.’ కేవలం ఈ క్రియ ఆధారంగా ఉద్దేశపూర్వకంగా తదేకంగా చూశాడనే బలమైన భావాన్ని చేర్చలేదు; తరువాతి క్రియతో సహజమైన తెలుగు కథన క్రమం కోసం ‘చూసి’ అని అనువదించాం.
- source_word: חָם
  choice: హాము
  rationale: వ్యక్తి పేరును తెలుగులో సాధారణంగా గుర్తించదగిన రూపంలో లిప్యంతరీకరించాం.
- source_word: אֲבִי כְנַעַן
  choice: కనానుకు తండ్రి అయిన
  rationale: హామును ‘కనానుకు తండ్రి’గా గుర్తించే హీబ్రూ సమాస నిర్మాణాన్ని సహజమైన తెలుగు విశేషణ పదబంధంగా నిలిపాం.
- source_word: עֶרְוַת אָבִיו
  choice: తన తండ్రి నగ్నత్వాన్ని
  rationale: హీబ్రూ పదబంధాన్ని సన్నిహితంగా అనువదించి, ఈ సందర్భంలో పేర్కొనబడని నిర్దిష్ట లైంగిక చర్యను పాఠ్యంలోకి చేర్చలేదు. అదే సమయంలో ఇతర సందర్భాల్లో ఈ మాటకు ఉండగల సూచనార్థాన్ని పూర్తిగా మూసివేయలేదు.
- source_word: וַיַּגֵּד
  choice: ఆ సంగతి చెప్పాడు
  rationale: נגד హిఫీల్ రూపం ‘చెప్పు, తెలియజేయు’ అనే అర్థం ఇస్తుంది. తెలుగులో కర్మను స్పష్టంగా సూచించేందుకు సందర్భసిద్ధమైన ‘ఆ సంగతి’ని ఉపయోగించాం.
- source_word: לִשְׁנֵי אֶחָיו
  choice: తన ఇద్దరు సోదరులకు
  rationale: మూలంలోని ‘ఇద్దరు’ అనే సంఖ్యను స్పష్టంగా నిలిపి, సహజమైన తెలుగు బంధుత్వ పదాన్ని వాడాం.
- source_word: בַּחוּץ
  choice: బయట ఉన్న
  rationale: ‘బయట’ అనే అర్థాన్ని నిలిపి, అది సోదరుల స్థానాన్ని సూచించేలా తెలుగులో సహజమైన నిర్మాణంగా ఇచ్చాం; ఇది నోవహు గుడారం లోపల ఉన్న సందర్భానికి విరుద్ధంగా ఉంది.
theological_decisions:
- issue: ఈ కథనంలో ‘తన తండ్రి నగ్నత్వం’ అనే పదబంధం యొక్క భావం
  choice: హాము నోవహు నగ్నంగా ఉండడాన్ని చూశాడనే ప్రత్యక్ష వాక్యార్థాన్ని నిలిపేలా ‘తన తండ్రి నగ్నత్వాన్ని’ అని అనువదించాం; అంతకుమించిన నిర్దిష్ట లైంగిక చర్యను ప్రధాన పాఠ్యంలో పేర్కొనలేదు.
  alternative: ఈ పదబంధాన్ని మరింత తీవ్రమైన లైంగిక అపరాధానికి సూచనగా లేదా తరువాతి ధర్మశాస్త్ర ప్రయోగం ఆధారంగా తల్లితో అక్రమ సంబంధానికి సభ్యోక్తిగా అర్థం చేసుకోవడం.
  rationale: కొన్ని పాత నిబంధన సందర్భాల్లో ఈ హీబ్రూ పదబంధానికి లైంగిక సభ్యోక్తి భావం ఉండవచ్చు. అయితే ఈ వచనం హాము ‘చూశాడు,’ తరువాత తన సోదరులకు ‘చెప్పాడు’ అని మాత్రమే పేర్కొంటుంది; సమీప సందర్భం నోవహు వస్త్రరహితంగా ఉండడంపై కేంద్రీకృతమై ఉంది. అందువల్ల ప్రధాన పాఠ్యం అక్షరార్థాన్ని నిలిపి, విస్తృత వ్యాఖ్యాన అవకాశాన్ని పాదసూచికలో తెరిచి ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనా గౌరవప్రదమైన కథన శైలిని వాడాం. ‘నగ్నత్వం’ అనే పదం కొంత సాహిత్య గంభీరత కలిగినప్పటికీ మూలంలోని కీలక పదబంధాన్ని, దాని వ్యాఖ్యాన ఉద్రిక్తతను కచ్చితంగా నిలుపుతుంది.
