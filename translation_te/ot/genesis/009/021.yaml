  text: וַ/יֵּ֥שְׁתְּ מִן הַ/יַּ֖יִן וַ/יִּשְׁכָּ֑ר וַ/יִּתְגַּ֖ל בְּ/ת֥וֹךְ אָהֳלֹֽ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/021.yaml
  text: He drank some of the wine[a], became drunk[b], and uncovered himself inside his tent.
translation:
  language: te
  text: అతడు ఆ ద్రాక్షారసాన్ని కొంత తాగి[a], మత్తెక్కి, తన గుడారం లోపల తన బట్టలు విప్పుకున్నాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘ఆ ద్రాక్షారసం నుండి.’ ఇక్కడ ఈ హీబ్రూ ప్రయోగం సాధారణంగా దానిలో కొంత తాగాడనే భాగార్థాన్ని ఇస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘నగ్నంగా ఉన్నాడు’ లేదా ‘బట్టలు లేకుండా ఉన్నాడు.’ హీబ్రూ క్రియను స్థితిని సూచించే విధంగానూ అనువదించవచ్చు; అయితే ఇక్కడి రూపానికి ‘తన బట్టలు విప్పుకున్నాడు’ అనే ప్రతిఫలార్థం బాగా సరిపోతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשְׁתְּ מִן הַיַּיִן
  choice: ఆ ద్రాక్షారసంలో కొంత తాగి
  rationale: מִן הַיַּיִן ఇక్కడ భాగార్థకంగా ఉంది; సహజమైన ఆధునిక తెలుగులో ‘ఆ ద్రాక్షారసంలో కొంత’ ఆ భావాన్ని స్పష్టంగా తెలియజేస్తుంది. వరుస కథన క్రియను ‘తాగి’తో సహజంగా కలిపాం.
- source_word: וַיִּשְׁכָּר
  choice: మత్తెక్కి
  rationale: שׁכר Qal రూపం మత్తు స్థితిలోకి ప్రవేశించడాన్ని సూచిస్తుంది; ‘మత్తెక్కి’ సంక్షిప్తంగా, సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: וַיִּתְגַּל
  choice: తనను తాను బయలుపరచుకున్నాడు
  rationale: גלה Hitpael రూపంలోని ప్రతిఫలార్థాన్ని నిలుపుతుంది; కేవలం స్థితిని సూచించే ‘బయటపడి ఉన్నాడు’ కంటే కర్త తనను తాను కప్పులేకుండా చేసుకున్నాడనే భావానికి ఇది దగ్గరగా ఉంది.
- source_word: בְּתוֹךְ אָהֳלֹה
  choice: తన గుడారం లోపల
  rationale: בְּתוֹךְ ఒక ప్రదేశపు అంతర్భాగాన్ని సూచిస్తుంది; ‘గుడారం లోపల’ సాధారణ ఆధునిక తెలుగులో స్పష్టంగా ఉంది.
theological_decisions:
- issue: నోవహు మత్తు మరియు బయలుపడిన స్థితికి నైతిక లేదా లైంగిక వ్యాఖ్యానాన్ని జోడించడం
  choice: హీబ్రూ వచనం తెలిపిన తాగడం, మత్తెక్కడం, తనను తాను బయలుపరచుకోవడం అనే చర్యలను మాత్రమే వర్ణనాత్మకంగా అనువదించడం
  alternative: ‘తన గుడారంలో నగ్నంగా పడుకున్నాడు’ లేదా ‘తన గుడారంలో బయలుపడి ఉన్నాడు’
  rationale: ఈ వచనం ప్రత్యక్ష నైతిక వ్యాఖ్యను చేయదు. ప్రతిఫలార్థాన్ని ప్రధాన పాఠ్యంలో ఉంచుతూ, స్థితివాచక ప్రత్యామ్నాయాలను పాదసూచికలో చూపడం ద్వారా తరువాతి సందర్భం అర్థాన్ని స్పష్టం చేయడానికి అవకాశం నిలుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘ద్రాక్షారసం’ సందర్భానుగుణంగా יין‌ను స్పష్టంగా తెలుపుతుంది; ‘తనను తాను బయలుపరచుకున్నాడు’ మూలంలోని అస్పష్టతను అతిగా లైంగికీకరించకుండా ప్రతిఫలార్థాన్ని నిలుపుతుంది. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
