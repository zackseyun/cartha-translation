    issue: The phrase ‘ఆ ద్రాక్షారసంలో కొంత తాగి’ is syntactically awkward for a partitive object.
    rationale: 'For ‘some of the wine,’ Telugu naturally uses the wine as the object and places కొంత with it: ‘ఆ ద్రాక్షారసాన్ని కొంత తాగి.’'
  - severity: medium
    issue: ‘తనను తాను బయలుపరచుకున్నాడు’ is unnatural and potentially vague in modern Telugu.
    rationale: It can suggest revealing oneself rather than becoming unclothed. ‘తన బట్టలు విప్పుకున్నాడు’ naturally expresses the reflexive, actional sense of the Hebrew Hitpael without importing further interpretation.
  revised_text: అతడు ఆ ద్రాక్షారసాన్ని కొంత తాగి[a], మత్తెక్కి, తన గుడారం లోపల తన బట్టలు విప్పుకున్నాడు[b].
