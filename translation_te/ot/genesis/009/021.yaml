  verdict: revise
  source_fidelity: The sequence of drinking, becoming intoxicated, and self-uncovering inside his tent is retained. ‘తన బట్టలు విప్పుకున్నాడు’ gives the Hitpael verb’s reflexive/actional force more naturally than the draft’s ‘తనను తాను బయలుపరచుకున్నాడు.’
  naturalness: ‘ఆ ద్రాక్షారసంలో కొంత తాగి’ is less idiomatic because the quantity is construed as though it were within the drink. ‘ఆ ద్రాక్షారసాన్ని కొంత తాగి’ clearly means that he drank some of it. ‘తన బట్టలు విప్పుకున్నాడు’ is natural modern Telugu narrative usage.
  terminology: ‘ద్రాక్షారసం’ is retained for יַיִן, while ‘మత్తెక్కి’ explicitly preserves the intoxicating result. The revision does not add moral or sexual interpretation.
