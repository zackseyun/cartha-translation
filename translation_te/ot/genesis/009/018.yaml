source:
  edition: WLC
  text: וַ/יִּֽהְי֣וּ בְנֵי נֹ֗חַ הַ/יֹּֽצְאִים֙ מִן הַ/תֵּבָ֔ה שֵׁ֖ם וְ/חָ֣ם וָ/יָ֑פֶת וְ/חָ֕ם ה֖וּא אֲבִ֥י כְנָֽעַן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/018.yaml
  text: The sons of Noah who came out of the ark were Shem, Ham, and Japheth; and Ham was the father of Canaan.
translation:
  language: te
  text: ఓడనుండి బయటికి వచ్చిన నోవహు కుమారులు షేము, హాము, యాపెతు; మరియు హాము కనాను తండ్రి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: కుమారులు ... షేము, హాము, యాఫెతు
  rationale: ఇక్కడ היה రూపం సాధారణ భూతకాల సంబంధాన్ని పరిచయం చేస్తుంది. తెలుగులో సహజమైన నామవాక్యంలో ప్రత్యేకంగా ‘ఉండిరి’ అని చేర్చకుండా ఆ భావాన్ని వ్యక్తం చేయవచ్చు.
- source_word: בְנֵי נֹחַ
  choice: నోవహు కుమారులు
  rationale: హీబ్రూ సమాసంలోని కుటుంబ సంబంధాన్ని ఆధునిక తెలుగులో సహజంగా, స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: הַיֹּצְאִים מִן הַתֵּבָה
  choice: ఓడలోనుండి బయటికి వచ్చిన
  rationale: నిర్దేశక అవ్యయకృదంతం నోవహు కుమారులను విశేషిస్తుంది; מן భావాన్ని ‘లోనుండి’, יצא భావాన్ని ‘బయటికి వచ్చిన’గా స్పష్టంగా నిలుపుతుంది.
- source_word: שֵׁם וְחָם וָיָפֶת
  choice: షేము, హాము, యాఫెతు
  rationale: మూల హీబ్రూ పేర్ల ఉచ్చారణకు సమీపంగా ఉండే తెలుగు లిప్యంతరీకరణలు; జాబితాను సహజ తెలుగు విరామచిహ్నాలతో అందించాం.
- source_word: וְחָם הוּא אֲבִי כְנָעַן
  choice: హాము కనానుకు తండ్రి
  rationale: నామవాక్య నిర్మాణాన్ని సహజ తెలుగులో ఉంచుతూ, హాము–కనాను సంబంధాన్ని తరువాతి కథనానికి అవసరమైన నేపథ్య సమాచారంగా స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: హాము మరియు కనాను గురించిన వంశసంబంధ గమనిక
  choice: ‘హాము కనానుకు తండ్రి’ అనే వాక్యాన్ని ప్రధాన పాఠ్యంలో స్పష్టంగా ఉంచడం
  alternative: దీనిని కేవలం ఉపప్రాసంగిక సమాచారంగా శైలీపరంగా తగ్గించడం
  rationale: హీబ్రూ పాఠ్యం ఈ సంబంధాన్ని ప్రత్యక్షంగా పేర్కొని తరువాతి సంఘటనకు నేపథ్యం సిద్ధం చేస్తుంది. పాఠ్యానికి మించిన జాతి లేదా సిద్ధాంత సంబంధమైన నిర్ధారణలను అనువాదం చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనప్పటికీ గౌరవప్రదమైన శైలి. ‘ఓడ’ సందర్భంలో నోవహు నిర్మించిన పెద్ద నౌకను సూచిస్తుంది. మూలంలో లేని వివరణాత్మక లేదా సిద్ధాంతపరమైన పదాలను చేర్చలేదు.
