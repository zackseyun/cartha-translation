  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֖אמֶר אָר֣וּר כְּנָ֑עַן עֶ֥בֶד עֲבָדִ֖ים יִֽהְיֶ֥ה לְ/אֶחָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/025.yaml
  text: And he said[a], “Canaan is cursed[c][b]; he shall be a servant of servants to his brothers.”
translation:
  language: te
  text: 'అప్పుడు అతడు ఇలా అన్నాడు: “కనాను[a] శాపగ్రస్తుడు! అతడు తన సహోదరులకు బానిసల బానిసగా[b] ఉంటాడు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూలపాఠం ఇక్కడ హామును కాదు, కనానునే స్పష్టంగా పేర్కొంటుంది.
    reason: alternative_reading
  - marker: b
    text: ‘బానిసల బానిస’ అనే హీబ్రూ ప్రయోగం అత్యంత హీనమైన బానిస స్థితిని బలంగా సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు అతడు ఇలా అన్నాడు
  rationale: హీబ్రూ కథన క్రమాన్ని సహజమైన ఆధునిక తెలుగులో చూపుతూ, తరువాత వచ్చే ప్రత్యక్ష వాక్యాన్ని పరిచయం చేస్తుంది.
- source_word: אָרוּר
  choice: శాపగ్రస్తుడు
  rationale: ఇది క్రియలేని విధేయ విశేషణ ప్రయోగం. ‘శపించబడుగాక’ అనే కోరికార్థాన్ని బలవంతంగా చేర్చకుండా, ప్రకటనాత్మక భావాన్ని నిలుపుతుంది.
- source_word: כְּנָעַן
  choice: కనాను
  rationale: మూలపాఠంలో శాపానికి గురైన వ్యక్తిగా స్పష్టంగా కనానునే పేర్కొంది.
- source_word: עֶבֶד עֲבָדִים
  choice: బానిసలకు బానిసగా
  rationale: బానిసత్వపు తీవ్రతను తెలియజేసే హీబ్రూ పునరుక్త నిర్మాణాన్ని సాధ్యమైనంతవరకు నిలుపుతూ, ‘సేవకుడు’ కంటే బంధిత అధీనస్థితిని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: יִהְיֶה
  choice: ఉంటాడు
  rationale: శాపవాక్యంలో రాబోయే స్థితిని సూచించే అపూర్ణ క్రియారూపాన్ని సహజమైన తెలుగు భవిష్యత్ అర్థంతో అందిస్తుంది.
- source_word: לְאֶחָיו
  choice: తన సహోదరులకు
  rationale: అక్షరార్థంగా ‘అతని సహోదరులకు’; పుంలింగ బహువచన కుటుంబ సంబంధాన్ని నిలుపుతుంది.
theological_decisions:
- issue: నోవహు శాపానికి గురైన వ్యక్తి
  choice: కనాను అని నేరుగా పేర్కొనడం
  alternative: శాపం నేరుగా హాముపై ఉందని అనువదించడం
  rationale: హీబ్రూ పాఠం కనానునే స్పష్టంగా పేర్కొంటుంది; వ్యాఖ్యాన సంప్రదాయం ఆధారంగా పేరును మార్చకూడదు.
- issue: బానిసత్వ భాష తీవ్రత
  choice: ‘బానిసలకు బానిసగా’ అని అనువదించడం
  alternative: ‘సేవకులకు సేవకుడిగా’ లేదా ‘అత్యల్ప సేవకుడిగా’
  rationale: ఈ సందర్భంలో עבד బంధిత అధీనస్థితిని సూచిస్తుంది. మూలంలోని పునరుక్తి తీవ్రమైన అణచివేతను తెలియజేస్తుంది; దానిని వ్యాఖ్యానాత్మకంగా పూర్తిగా విప్పకుండా నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన శాపవాక్య ధోరణి పాటించబడింది. ‘బానిసలకు బానిసగా’ అనే నిర్మాణం కొంత హెబ్రాయిక్ స్వరూపాన్ని ఉద్దేశపూర్వకంగా నిలుపుతుంది; వివరణ పాదటిప్పణిలో ఇవ్వబడింది.
