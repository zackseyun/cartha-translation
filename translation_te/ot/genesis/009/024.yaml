  yaml_path: translation/ot/genesis/009/024.yaml
  text: When Noah awoke from his wine[a], he knew what his youngest son had done to him.
translation:
  language: te
  text: నోవహు తాను తాగిన ద్రాక్షారసం మత్తు నుండి మేల్కొన్నప్పుడు, తన చిన్న కుమారుడు[a] తనకు ఏమి చేశాడో తెలుసుకున్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తన కుమారుల్లో వయసులో చిన్నవాడు” లేదా “అందరికంటే చిన్నవాడు.” హీబ్రూ విశేషణానికి సందర్భాన్ని బట్టి ‘చిన్న,’ ‘వయసులో చిన్న,’ లేదా ‘అందరికంటే చిన్న’ అనే అర్థాలు రావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּיקֶץ
  choice: మేల్కొన్నప్పుడు
  rationale: יקץ అనే క్రియకు ప్రాథమిక అర్థం నిద్రనుండి మేల్కొనడం. ‘మత్తు దిగినప్పుడు’ అని మాత్రమే అనువదిస్తే మూలంలోని నిద్రనుండి మేల్కొనే భావం తగ్గిపోతుంది.
- source_word: מִיֵּינוֹ
  choice: ద్రాక్షారసం మత్తునుండి
  rationale: అక్షరార్థంగా ‘తన ద్రాక్షారసం నుండి.’ ఆధునిక తెలుగులో ఆ హీబ్రూ ప్రయోగం సూచించే ద్రాక్షారసం వల్ల కలిగిన మత్తు స్థితిని సహజంగా తెలియజేయడానికి ‘ద్రాక్షారసం మత్తునుండి’ అని ఇచ్చాం.
- source_word: וַיֵּדַע
  choice: తెలుసుకున్నాడు
  rationale: ידע అంటే ‘తెలుసుకొను/ఎరుగును.’ ఇక్కడ నోవహు మేల్కొన్న తరువాత జరిగినదాన్ని గ్రహించిన క్రమాన్ని ‘తెలుసుకున్నాడు’ సహజంగా తెలియజేస్తుంది.
- source_word: אֵת אֲשֶׁר עָשָׂה לוֹ
  choice: తనకు ఏమి చేశాడో
  rationale: చర్య ఏమిటో మూలవచనం వివరించదు. కాబట్టి దానిని నిర్దిష్టంగా వ్యాఖ్యానించకుండా సాధారణంగానే ఉంచాం.
- source_word: בְּנוֹ הַקָּטָן
  choice: తన కుమారుల్లో చిన్నవాడు[a]
  rationale: קָטָן సందర్భానుసారం చిన్నవాడు, వయసులో చిన్నవాడు, లేదా అందరికంటే చిన్నవాడు అని అర్థమవుతుంది. కుటుంబంలోని వయోక్రమ భావాన్ని ప్రధాన పాఠం సహజంగా వ్యక్తం చేస్తుంది; సాధ్యమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
theological_decisions:
- issue: నోవహుకు చేయబడిన చర్య స్వభావం
  choice: ‘తనకు ఏమి చేశాడో’ అని చర్యను నిర్దిష్టంగా చెప్పకుండా ఉంచడం
  alternative: హాము నోవహు నగ్నత్వాన్ని చూసి ఇతరులకు చెప్పాడని, లేదా మరింత తీవ్రమైన లైంగిక అపరాధం జరిగిందని స్పష్టీకరించడం
  rationale: హీబ్రూ వచనం నోవహుకు ఏమి చేయబడిందో ఈ వాక్యంలో నిర్వచించదు. అందువల్ల అనువాదం ఆ ఉద్దేశపూర్వక అస్పష్టతను కాపాడుతుంది.
- issue: ‘చిన్నవాడైన కుమారుడు’ ఎవరిని సూచిస్తున్నాడు
  choice: హీబ్రూ బంధుత్వ పదబంధాన్ని మాత్రమే అనువదించి, వ్యక్తిని అదనంగా గుర్తించకపోవడం
  alternative: అతడు హాము లేదా కనాను అని అనువాదంలోనే స్పష్టీకరించడం
  rationale: విస్తృత కథనం సూచిత వ్యక్తి గురించి వ్యాఖ్యాన సంబంధమైన ప్రశ్నలను లేవనెత్తినా, ఈ వచనం పేరు చెప్పదు. కాబట్టి మూలంలో లేని గుర్తింపును చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథన శైలి. మూలంలోని చర్యకు సంబంధించిన అస్పష్టతను నిలిపి ఉంచి, కָטָן పదంలోని వయోక్రమ భేదాన్ని పాదసూచికలో సూచించాం.
