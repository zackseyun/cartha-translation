- from: నోవహు ద్రాక్షారసం మత్తునుండి మేల్కొన్నప్పుడు, తన కుమారుల్లో చిన్నవాడు[a] తనకు ఏమి చేశాడో తెలుసుకున్నాడు.
  to: నోవహు తాను తాగిన ద్రాక్షారసం మత్తు నుండి మేల్కొన్నప్పుడు, తన చిన్న కుమారుడు[a] తనకు ఏమి చేశాడో తెలుసుకున్నాడు.
  rationale: The revision retains the Hebrew narrative sequence and the deliberate ambiguity concerning the action done to Noah. It explicitly links the intoxication to Noah’s wine, while preserving awakening rather than interpreting the verb as merely becoming sober. It also avoids making “youngest” more definite than the Hebrew adjective warrants in this context; the possible comparative and superlative senses are supplied in the footnote.
