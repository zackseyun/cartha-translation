revisions:
- from: నేను, నాకూ మీకూ సమస్త శరీరులలోని ప్రతి ప్రాణికీ మధ్య ఉన్న నా నిబంధనను జ్ఞాపకం చేసుకుంటాను; సమస్త శరీరులను నాశనం చేయడానికి జలాలు ఇక ఎన్నడూ ప్రళయంగా మారవు.
  to: నేను నాకూ మీకూ, సమస్త జీవరాశిలోని ప్రతి ప్రాణికీ మధ్య ఉన్న నా నిబంధనను జ్ఞాపకం చేసుకుంటాను; సమస్త జీవరాశిని నాశనం చేయడానికి జలాలు ఇక ఎన్నడూ ప్రళయంగా మారవు.
