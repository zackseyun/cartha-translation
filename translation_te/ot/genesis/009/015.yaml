id: GEN.9.15
reference: Genesis 9:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/זָכַרְתִּ֣י אֶת בְּרִיתִ֗/י אֲשֶׁ֤ר בֵּינִ/י֙ וּ/בֵ֣ינֵי/כֶ֔ם וּ/בֵ֛ין כָּל נֶ֥פֶשׁ חַיָּ֖ה בְּ/כָל בָּשָׂ֑ר וְ/לֹֽא יִֽהְיֶ֨ה ע֤וֹד הַ/מַּ֨יִם֙ לְ/מַבּ֔וּל לְ/שַׁחֵ֖ת כָּל בָּשָֽׂר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/015.yaml
  text: and I will remember my covenant that is between me and you and every living creature among all flesh[b][a], and the waters will never again become a flood to destroy all flesh.
translation:
  language: te
  text: నేను నాకూ మీకూ, సమస్త జీవరాశిలోని ప్రతి ప్రాణికీ మధ్య ఉన్న నా నిబంధనను జ్ఞాపకం చేసుకుంటాను; సమస్త జీవరాశిని నాశనం చేయడానికి జలాలు ఇక ఎన్నడూ ప్రళయంగా మారవు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְזָכַרְתִּי
  choice: నేను ... జ్ఞాపకం చేసుకుంటాను
  rationale: Qal perfect 1cs ఇక్కడ దేవుని భవిష్యత్ వాగ్దానంగా పనిచేస్తుంది. నిబంధన సంబంధమైన ‘జ్ఞాపకం చేసుకోవడం’ అనే భావాన్ని వివరణాత్మకంగా మార్చకుండా నిలిపింది.
- source_word: בְּרִיתִי
  choice: నా నిబంధనను
  rationale: దేవుడు స్థాపించిన అధికారిక సంబంధం, వాగ్దానం రెండింటినీ సూచించే ప్రామాణిక తెలుగు పదం.
- source_word: כָּל נֶפֶשׁ חַיָּה בְּכָל בָּשָׂר
  choice: సమస్త శరీరులలోని ప్రతి ప్రాణికీ
  rationale: נֶפֶשׁ חַיָּה ను సందర్భానుసారంగా ‘ప్రాణి’గా, בְּכָל בָּשָׂר ను ఆ ప్రాణులు చెందిన సమగ్ర వర్గాన్ని సూచించేలా అనువదించింది; మనుషులతోపాటు జంతువులనూ చేర్చుతుంది.
- source_word: וְלֹא יִהְיֶה עוֹד הַמַּיִם לְמַבּוּל
  choice: జలాలు ఇక ఎన్నడూ ప్రళయంగా మారవు
  rationale: עוֹד తో కూడిన నిషేధం పునరావృతం కానిదాన్ని సూచిస్తుంది; לְמַבּוּל ను సహజ తెలుగులో ఫలితార్థకంగా ‘ప్రళయంగా మారవు’ అని ఇచ్చింది.
- source_word: לְשַׁחֵת כָּל בָּשָׂר
  choice: సమస్త శరీరులను నాశనం చేయడానికి
  rationale: Infinitive ఉద్దేశం/ఫలితాన్ని తెలియజేస్తుంది. כָּל בָּשָׂר యొక్క విస్తృతమైన శరీరధారుల పరిధిని పునరుక్తితో సహా నిలిపింది.
theological_decisions:
- issue: దేవుడు జ్ఞాపకం చేసుకోవడం అనే మానవరూపక భాష
  choice: ‘నేను ... జ్ఞాపకం చేసుకుంటాను’ అని యథార్థంగా నిలిపివేయడం
  alternative: ‘నా నిబంధన ప్రకారం కార్యం చేస్తాను’
  rationale: హీబ్రూ పాఠం స్పష్టంగా జ్ఞాపక భాషనే వాడుతుంది. దాన్ని వివరణాత్మకంగా పరిష్కరించకుండా ఉంచడం నిబంధనాత్మక భావాన్నీ మూలపాఠంలోని దైవశాస్త్ర ఉద్వేగాన్నీ కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక, గౌరవప్రదమైన తెలుగు. ‘జలాలు,’ ‘నిబంధన,’ ‘ప్రళయం’ వంటి సుపరిచిత బైబిలు పదాలను నిలిపి, వాక్యనిర్మాణాన్ని సాధారణ పాఠకునికి స్పష్టంగా ఉంచింది. పాదసూచికలు అవసరం లేదు.
