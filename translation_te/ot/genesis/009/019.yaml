  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: שְׁלֹשָׁ֥ה אֵ֖לֶּה בְּנֵי נֹ֑חַ וּ/מֵ/אֵ֖לֶּה נָֽפְצָ֥ה כָל הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/019.yaml
  text: These three were the sons of Noah[a], and from these the whole earth was populated.
translation:
  language: te
  text: వీరు ముగ్గురూ నోవహు కుమారులు. వీరి నుంచే భూమి అంతటా ప్రజలు విస్తరించారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “వీరి నుంచే భూమి అంతా చెదరిపోయింది” లేదా “వ్యాపించింది.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁלֹשָׁה אֵלֶּה
  choice: వీరు ముగ్గురూ
  rationale: ముందుంచబడిన హెబ్రీ నామవాచక పదబంధంలోని ‘ఈ ముగ్గురు’ అనే ఉద్ఘాటనను సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: בְּנֵי נֹחַ
  choice: నోవహు కుమారులు
  rationale: ఇది సరళమైన సంబంధార్థక నిర్మాణం. హెబ్రీలో క్రియ లేకపోవడంతో తెలుగులో సహజమైన నామవాచక వాక్యంగా అనువదించబడింది.
- source_word: וּמֵאֵלֶּה
  choice: వీరి నుంచే
  rationale: מִן అనే విభక్తి ‘నుండి’ అనే మూలార్థాన్ని ఇస్తుంది; ‘ఏ’ చేర్చడం ద్వారా ఈ ముగ్గురితో రెండో వాక్యభాగానికి ఉన్న స్పష్టమైన సంబంధం నిలుస్తుంది.
- source_word: נָפְצָה
  choice: ప్రజలు విస్తరించారు
  rationale: נפץ క్రియకు చెదరిపోవడం లేదా వ్యాపించడం అనే భావం ఉంది. వంశావళి సందర్భంలో ఈ కుమారుల నుంచి ప్రజలు భూమంతటా వ్యాపించారనే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; మరింత అక్షరార్థ రూపం పాదసూచికలో ఉంచబడింది.
- source_word: כָל הָאָרֶץ
  choice: భూమి అంతటా
  rationale: జలప్రళయం తరువాత మానవజాతి వ్యాప్తిని సంగ్రహించే సందర్భంలో אֶרֶץకు విశ్వవ్యాప్తమైన ‘భూమి’ భావం తగినది. తెలుగులో స్థలవ్యాప్తిని సహజంగా చెప్పడానికి ‘భూమి అంతటా’ వాడబడింది.
theological_decisions:
- issue: జలప్రళయం తరువాతి జనాంగాల సందర్భంలో הָאָרֶץ పరిధి
  choice: భూమి అంతటా
  alternative: దేశమంతటా
  rationale: ఈ వాక్యం నోవహు కుమారుల నుంచి మానవజాతి వ్యాప్తిని సంగ్రహిస్తోంది; అందువల్ల స్థానిక ‘దేశం’ కంటే ‘భూమి’ అనే విశాలార్థం సందర్భానికి తగినది.
- issue: נָפְצָהలోని చెదరిపోవడం/వ్యాపించడం అనే ఉద్రిక్తత
  choice: ప్రజలు విస్తరించారు
  alternative: భూమి అంతా చెదరిపోయింది
  rationale: హెబ్రీలో ‘భూమి’ వ్యాకరణ కర్తగా ఉన్నప్పటికీ, సందర్భార్థం దాని ప్రజలు ఈ ముగ్గురి నుంచి వ్యాపించారని సూచిస్తుంది. ప్రధాన పాఠం సహజమైన అర్థాన్ని ఇస్తూ, అక్షరార్థంలోని అసాధారణ రూపాన్ని పాదసూచికలో సంరక్షిస్తుంది.
translation_notes:
  register: సాధారణ ఆధునిక పాఠకులకు అర్థమయ్యేలా, గంభీరమైనప్పటికీ సహజమైన ప్రామాణిక తెలుగు వాడబడింది. ‘వీరు ముగ్గురూ’ అనే రూపం హెబ్రీ ఉద్ఘాటనను నిలుపుతుంది; రెండు చిన్న వాక్యాలు మూలంలోని రెండు వాక్యభాగాలను స్పష్టంగా తెలియజేస్తాయి.
