id: GEN.9.10
reference: Genesis 9:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אֵ֨ת כָּל נֶ֤פֶשׁ הַֽ/חַיָּה֙ אֲשֶׁ֣ר אִתְּ/כֶ֔ם בָּ/ע֧וֹף בַּ/בְּהֵמָ֛ה וּֽ/בְ/כָל חַיַּ֥ת הָ/אָ֖רֶץ אִתְּ/כֶ֑ם מִ/כֹּל֙ יֹצְאֵ֣י הַ/תֵּבָ֔ה לְ/כֹ֖ל חַיַּ֥ת הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/010.yaml
  text: 'and with every living creature that is with you: the birds[a], the livestock, and every beast of the earth with you, from all that came out of the ark[d][c][b], every beast of the earth.'
translation:
  language: te
  text: మీతో ఉన్న ప్రాణమున్న ప్రతి జీవితోనూ[b]—పక్షులతో, పశువులతో, మీతో ఉన్న భూమిమీద ప్రతి అడవి జంతువుతోనూ—ఓడలో నుంచి బయటికి వచ్చిన వాటన్నిటితో, భూమిమీద ఉన్న ప్రతి అడవి జంతువుతోనూ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: వాక్యంలోని చివరి పదబంధం హీబ్రూలో క్లిష్టంగా ఉంది. మరింత అక్షరార్థంగా, ‘భూమిమీద ఉన్న ప్రతి అడవి జంతువు కొరకు’ అని అనువదించవచ్చు.
    reason: alternative_reading
  - marker: b
    text: అక్షరార్థంగా, ‘ప్రతి జీవప్రాణితోనూ’; ఈ హీబ్రూ పదబంధం ఇక్కడ ప్రాణమున్న జీవులను, ముఖ్యంగా జంతువులను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶפֶשׁ הַחַיָּה
  choice: ప్రాణమున్న ప్రతి జీవి
  rationale: ఈ సందర్భంలో ఈ పదబంధం జంతుజీవులన్నిటినీ విస్తృతంగా సూచిస్తుంది. ‘ప్రాణమున్న ప్రతి జీవి’ అనేది ‘జీవప్రాణి’ అనే మరింత అక్షరార్థ రూపం కంటే సహజమైన ఆధునిక తెలుగు.
- source_word: בָּעוֹף
  choice: పక్షులు
  rationale: עוֹף సాధారణంగా ఎగిరే జీవులను సూచించగలిగినా, ఈ జంతువుల జాబితాలో ‘పక్షులు’ సహజంగా, తగినంత విస్తృతంగా అర్థాన్ని అందిస్తుంది.
- source_word: בַּבְּהֵמָה
  choice: పశువులు
  rationale: ఇక్కడ בְּהֵמָה పెంపుడు భూజంతువులను సూచిస్తుంది. ‘పశువులు’ సాధారణ తెలుగు పాఠకులకు స్పష్టమైన వర్గపదం.
- source_word: חַיַּת הָאָרֶץ
  choice: భూమి మీద అడవి జంతువు
  rationale: ఈ పదబంధం పక్షులు, పశువుల నుంచి వేరుగా అడవి భూజంతువులను సూచిస్తుంది. ‘మృగం’ కంటే ‘అడవి జంతువు’ ఈ వర్గభేదాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: מִכֹּל יֹצְאֵי הַתֵּבָה
  choice: ఓడలో నుంచి బయటికి వచ్చిన వాటన్నిటితో
  rationale: מִן‌ను ఇక్కడ ఓడ నుంచి బయటికి వచ్చిన జంతువులను నిర్దిష్టంగా సూచించే విభాగార్థక ప్రయోగంగా తీసుకున్నాం. తెలుగు విభక్తి నిర్మాణం ముందున్న ‘తో’ శ్రేణిని సహజంగా కొనసాగిస్తుంది.
- source_word: לְכֹל חַיַּת הָאָרֶץ
  choice: భూమి మీద ప్రతి అడవి జంతువుతోనూ
  rationale: ముగింపు పదబంధం వ్యాకరణపరంగా క్లిష్టమైనది. దాన్ని ముందున్న పరిధిని మళ్లీ పేర్కొనే పదబంధంగా ప్రధాన పాఠ్యంలో ఉంచి, హీబ్రూలోని לְకు సాధ్యమైన మరింత అక్షరార్థ రూపాన్ని పాదసూచికలో తెలిపాం.
theological_decisions:
- issue: నిబంధనలో భాగమైన జంతుజీవుల పరిధి మరియు వాక్యాంతపు పునరుక్తి
  choice: పక్షులు, పశువులు, అడవి జంతువులు సహా నోవహుతో ఉన్న జంతుజీవులన్నిటినీ చేర్చి, చివరి పదబంధాన్ని పునర్నిర్దేశకంగా అనువదించడం
  alternative: చివరి పదబంధాన్ని ‘భూమి మీద ఉన్న ప్రతి అడవి జంతువు కొరకు’ అని మరింత అక్షరార్థంగా అనువదించడం
  rationale: హీబ్రూ వాక్యనిర్మాణం సంక్షిప్తంగానూ పునరుక్తితోనూ ఉంది. ప్రధాన అనువాదం జంతుజీవుల సంపూర్ణ పరిధిని నిలుపుతూ, చివరి לְ పదబంధంపై ఉన్న నిజమైన సందిగ్ధతను పాదసూచికలో సంరక్షిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. మూలవాక్యం 9వ వచనంలోని క్రియకు అనుసంధానమైన భాగం కావడంతో, మూలంలో లేని క్రియను ఈ వచనంలో చేర్చలేదు. హీబ్రూ పునరుక్తిని పూర్తిగా తొలగించకుండా నిలిపి, వాక్యాంతపు వ్యాకరణ సందిగ్ధతను పాదసూచిక ద్వారా స్పష్టం చేశాం.
