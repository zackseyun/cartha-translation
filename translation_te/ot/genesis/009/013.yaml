  text: אֶת קַשְׁתִּ֕/י נָתַ֖תִּי בֶּֽ/עָנָ֑ן וְ/הָֽיְתָה֙ לְ/א֣וֹת בְּרִ֔ית בֵּינִ֖/י וּ/בֵ֥ין הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/013.yaml
  text: I have set my bow in the cloud[a], and it will be a sign of the covenant between me and the earth.
translation:
  language: te
  text: నా విల్లును మేఘంలో ఉంచాను[a]. అది నాకూ భూమికీ మధ్యనున్న నిబంధనకు గుర్తుగా ఉంటుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నా ఇంద్రధనుస్సును.’ హీబ్రూలో అక్షరార్థంగా ‘నా విల్లు’ అని ఉంది; ‘విల్లు’ అనేది సాధారణంగా ఆయుధమైన విల్లుకు వాడే పదం. ఈ సందర్భంలో అది మేఘంలో కనిపించే ఇంద్రధనుస్సును సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: קַשְׁתִּי
  choice: నా విల్లును
  rationale: קֶשֶׁת సాధారణంగా ఆయుధమైన ‘విల్లు’ను సూచిస్తుంది. మేఘం అనే సందర్భంలో ఇది ఇంద్రధనుస్సును సూచించినా, హీబ్రూ మూలంలోని విల్లు చిత్రణను ప్రధాన పాఠంలో నిలుపుకున్నాం.
- source_word: נָתַתִּי
  choice: ఉంచాను
  rationale: נתןకు ‘ఇవ్వు, ఉంచు, నెలకొల్పు’ అనే అర్థాలున్నాయి. మేఘంలో విల్లును ఉంచడాన్ని తెలుగులో సహజంగా తెలియజేయడానికి ‘ఉంచాను’ ఎంచుకున్నాం.
- source_word: בֶּעָנָן
  choice: మేఘంలో
  rationale: మూలంలో ఏకవచన రూపం ఉంది; అందువల్ల ‘మేఘంలో’ అని నేరుగా అనువదించాం.
- source_word: וְהָיְתָה
  choice: అది ... ఉంటుంది
  rationale: 'సందర్భంలో ఈ రూపం భవిష్యత్తు లేదా ఫలిత భావాన్ని వ్యక్తం చేస్తుంది: ఉంచబడిన విల్లు నిబంధన సూచనగా పనిచేస్తుంది.'
- source_word: לְאוֹת בְּרִית
  choice: నిబంధనకు సూచనగా
  rationale: אוֹת అనేది ‘సూచన, గుర్తు’ అని అర్థం. తెలుగు వాక్య నిర్మాణంలో ‘నిబంధనకు సూచనగా’ సహజంగా ఉండి, నిబంధనను తెలియజేసే గుర్తు అనే భావాన్ని కాపాడుతుంది.
- source_word: בֵּינִי וּבֵין הָאָרֶץ
  choice: నాకు, భూమికి మధ్య
  rationale: אֶרֶץకు ‘దేశం/నేల/భూమి’ అనే అర్థాలుండవచ్చు. జలప్రళయ కథనపు విశ్వవ్యాప్త సందర్భంలో ‘భూమి’ సముచితం.
theological_decisions:
- issue: నిబంధన సందర్భంలో קַשְׁתִּי సూచించే విషయం
  choice: ప్రధాన పాఠంలో ‘నా విల్లు’; సందర్భార్థంగా ఇంద్రధనుస్సు
  alternative: నా ఇంద్రధనుస్సు
  rationale: హీబ్రూలో ఆయుధమైన విల్లుకు వాడే సాధారణ పదమే ఉంది. కాబట్టి మూలంలోని చిత్రణను ప్రధాన పాఠంలో నిలిపి, సందర్భంలో అది ఇంద్రధనుస్సును సూచిస్తుందని పాదసూచికలో స్పష్టం చేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని ఉపయోగించాం. మూలంలోని ‘విల్లు’ చిత్రణను నిలిపి, ఆధునిక పాఠకునికి సందర్భార్థాన్ని పాదసూచికలో అందించాం.
