  yaml_path: translation/ot/genesis/009/016.yaml
  text: The bow will be in the cloud[b][a], and I will see it and remember the everlasting covenant between God and every living creature among all flesh that is on the earth.
translation:
  language: te
  text: ఆ విల్లు[a] మేఘంలో ఉంటుంది. నేను దాన్ని చూసి, దేవునికీ భూమిమీద ఉన్న సమస్త జీవరాశులకూ మధ్యనున్న నిత్య నిబంధనను జ్ఞాపకం చేసుకుంటాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఇంద్రధనుస్సు.’ హీబ్రూ పదానికి అక్షరార్థం ‘విల్లు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה
  choice: ఉంటుంది
  rationale: సందర్భంలోని భవిష్యదర్థక దైవవాక్యాన్ని సహజమైన తెలుగు భవిష్యదర్థంతో వ్యక్తం చేస్తుంది.
- source_word: הַקֶּשֶׁת
  choice: ఆ విల్లు
  rationale: హీబ్రూ పదం ప్రాథమికంగా ‘విల్లు’ అని అర్థం; సందర్భంలో అది ఆకాశంలో కనిపించే ఇంద్రధనుస్సు. మూలంలోని ప్రతిరూపాన్ని ప్రధాన పాఠ్యంలో ఉంచి, సందర్భార్థాన్ని పాదటిప్పణిలో తెలిపాం.
- source_word: בֶּעָנָן
  choice: మేఘంలో
  rationale: హీబ్రూలోని ఏకవచన రూపాన్ని నేరుగా, సహజంగా ప్రతిబింబిస్తుంది.
- source_word: וּרְאִיתִיהָ לִזְכֹּר
  choice: నేను దాన్ని చూసి … జ్ఞాపకం చేసుకుంటాను
  rationale: స్త్రీలింగ ప్రత్యయం ‘విల్లు’ను సూచిస్తుంది. తెలుగు క్రియాసంబంధ రూపం చూడటానికీ జ్ఞాపకం చేసుకోవటానికీ మధ్య ఉన్న ఉద్దేశ్య/ఫలిత సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: בְּרִית עוֹלָם
  choice: నిత్య నిబంధన
  rationale: కాలకాలాలపాటు నిలిచే ఒడంబడిక అనే భావాన్ని తెలుగులో స్థిరమైన, గౌరవప్రదమైన పదబంధంతో తెలియజేస్తుంది.
- source_word: כָּל נֶפֶשׁ חַיָּה בְּכָל בָּשָׂר
  choice: సమస్త శరీరధారులలో ప్రతి జీవి
  rationale: נֶפֶשׁ חַיָּהను మానవ ‘ఆత్మ’కు పరిమితం చేయకుండా ప్రతి జీవిగా అనువదిస్తుంది; בָּשָׂרలోని శరీర సంబంధ భావాన్ని ‘శరీరధారులు’ నిలుపుతుంది.
- source_word: אֲשֶׁר עַל הָאָרֶץ
  choice: భూమిమీద ఉన్న
  rationale: ఈ విశ్వవ్యాప్త సందర్భంలో הָאָרֶץకు ‘భూమి’ సరైన అర్థం; సంబంధవాక్యాన్ని తెలుగులో సహజ స్థానంలో ఉంచాం.
theological_decisions:
- issue: దేవుడు జ్ఞాపకం చేసుకోవడం అనే మానవరూప వర్ణన
  choice: ‘నేను … జ్ఞాపకం చేసుకుంటాను’ అని యథాతథంగా నిలుపడం
  alternative: ‘నా నిబంధన ప్రకారం కార్యం చేస్తాను’ అని వివరణాత్మకంగా చెప్పడం
  rationale: మూలపాఠం దేవుని నిబంధనాత్మక జ్ఞాపకాన్ని మానవరూప భాషలోనే చెబుతుంది. దానిలోని దైవశాస్త్రీయ ఉద్వేగాన్ని వివరణతో తొలగించకుండా నిలిపాం.
- issue: మొదటి పురుష వక్త తనను ‘దేవుడు’ అని మూడవ పురుషంలో పేర్కొనడం
  choice: ‘దేవునికీ … ప్రతి జీవికీ మధ్యనున్న’ అని మూలంలోని మూడవ పురుష రూపాన్ని నిలుపడం
  alternative: ‘నాకూ … ప్రతి జీవికీ మధ్యనున్న’ అని సాధారణ తెలుగు వక్తృరూపానికి మార్చడం
  rationale: హీబ్రూ పాఠ్యంలో ఉన్న ఉద్దేశపూర్వక రూపాంతరాన్ని సమతలీకరించకుండా, దాని సాహిత్య మరియు దైవశాస్త్రీయ ప్రత్యేకతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలిని ఉపయోగించాం. ‘శరీరధారులు’ మూలంలోని ‘మాంసం/శరీరం’ భావాన్ని నిలుపుతూనే ఇక్కడి సమస్త జీవుల పరిధిని తెలియజేస్తుంది.
