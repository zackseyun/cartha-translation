  source_fidelity: The clause order, future sense, first-person divine speech, and the third-person reference to God are accurately retained. However, “సమస్త శరీరధారులలో ప్రతి జీవి” renders the appositional/distributive Hebrew phrase awkwardly and can suggest that a living creature is merely one member within a separate class of ‘body-bearers.’
