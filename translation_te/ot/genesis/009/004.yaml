source:
  edition: WLC
  text: אַךְ בָּשָׂ֕ר בְּ/נַפְשׁ֥/וֹ דָמ֖/וֹ לֹ֥א תֹאכֵֽלוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/004.yaml
  text: But you shall not eat flesh with its life[a], that is[b], its blood.
translation:
  language: te
  text: అయితే మాంసాన్ని దాని ప్రాణంతో—అంటే, దాని రక్తంతో—మీరు తినకూడదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “అయితే దాని ప్రాణమైన రక్తంతో కూడిన మాంసాన్ని మీరు తినకూడదు.”'
    reason: మూలంలోని ‘దాని ప్రాణం—దాని రక్తం’ అనే సంక్షిప్త పదబంధాన్ని తెలుగులో మరో సహజ విధంగా వ్యక్తం చేయవచ్చు.
lexical_decisions:
- source_word: אַךְ
  choice: అయితే
  rationale: మునుపటి వచనంలో జంతువులను ఆహారంగా అనుమతించిన తర్వాత ఇక్కడ విధించిన పరిమితిని సహజమైన తెలుగులో సూచిస్తుంది.
- source_word: בָּשָׂר
  choice: మాంసం
  rationale: ఈ ఆహార సందర్భంలో ఆధునిక తెలుగులో సహజంగా ఉండి, శరీర మాంసం అనే మూలభావాన్ని కూడా నిలుపుతుంది.
- source_word: בְּנַפְשׁוֹ
  choice: దాని ప్రాణంతో
  rationale: ఇక్కడ נֶפֶשׁ అనేది అమూర్తమైన ‘ఆత్మ’కన్నా జీవప్రాణాన్ని సూచిస్తుంది; בְּ యొక్క సహచర్య భావాన్ని ‘తో’ తెలియజేస్తుంది.
- source_word: דָמוֹ
  choice: దాని రక్తంతో
  rationale: మూలంలోని ‘రక్తం’ అనే ప్రత్యక్ష పదాన్ని ఉంచి, దానిని ‘ప్రాణరక్తం’గా వ్యాఖ్యానాత్మకంగా కుదించదు.
- source_word: בְּנַפְשׁוֹ דָמוֹ
  choice: దాని ప్రాణంతో, అంటే దాని రక్తంతో
  rationale: హీబ్రూ పదబంధంలోని సంక్షిప్త సమానాధికార సంబంధాన్ని చదవడానికి స్పష్టమైన తెలుగులో వ్యక్తం చేస్తుంది; ‘ప్రాణం’ మరియు ‘రక్తం’ రెండింటినీ విడిగా నిలుపుతుంది.
- source_word: לֹא תֹאכֵלוּ
  choice: మీరు తినకూడదు
  rationale: చట్టపరమైన నిషేధాన్ని ఆధునిక, గంభీరమైన తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; క్రియ బహువచన సంబోధనను ‘మీరు’తో చూపిస్తుంది.
theological_decisions:
- issue: నֶפֶשׁకు రక్తంతో ఉన్న సంబంధం
  choice: ‘ఆత్మ’గా కాక ‘ప్రాణం’గా అనువదించడం
  alternative: ‘ఆత్మ’ అని అనువదించడం
  rationale: ఈ సందర్భంలో పదం జీవికి ప్రాణమిచ్చే జీవాన్ని సూచిస్తుంది. ‘ఆత్మ’ అనడం మూలవచనం తప్పనిసరిగా చెప్పని తరువాతి తాత్త్విక లేదా సిద్ధాంతపరమైన భావాన్ని చేర్చవచ్చు.
- issue: נַפְשׁוֹ דָמוֹ మధ్య సంబంధం
  choice: ‘అంటే’ ద్వారా సమానాధికార వివరణగా చూపించడం
  alternative: విరామచిహ్నంతో మాత్రమే ‘దాని ప్రాణం—దాని రక్తం’ అని ఉంచడం
  rationale: మూలంలోని సంక్షిప్తతను పూర్తిగా పరిష్కరించకుండా, సాధారణ తెలుగు పాఠకునికి రక్తమే ఇక్కడ ప్రాణంగా పేర్కొనబడుతోందనే సంబంధాన్ని స్పష్టం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే దైవశాసనానికి తగిన గంభీరతతో. ‘ప్రాణం’ అనే పదం మూలంలోని జీవార్థాన్ని నిలుపుతుంది; ‘తినకూడదు’ నిషేధాన్ని సహజంగా తెలియజేస్తుంది.
