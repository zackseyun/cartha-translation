translation:
  language: te
  text: జలప్రళయం తర్వాత నోవహు మూడువందల యాభై సంవత్సరాలు జీవించాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: జీవించాడు
  rationale: חיה ధాతువు యొక్క వయ్యిక్తోల్ రూపం; జలప్రళయం తర్వాత నోవహు జీవించిన కాలవ్యవధిని కథనరీతిలో తెలియజేస్తుంది. ‘జీవించాడు’ అనేది ఆయుష్కాల సందర్భంలో సహజమైన తెలుగు ప్రయోగం.
- source_word: נֹחַ
  choice: నోవహు
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగులో స్థిరపడిన బైబిలు రూపం.
- source_word: אַחַר
  choice: తర్వాత
  rationale: తరువాతి కాలాన్ని సూచించే కాలసంబంధ అవ్యయం; ఆధునిక తెలుగులో స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: הַמַּבּוּל
  choice: జలప్రళయం
  rationale: ఆదికాండంలోని ప్రసిద్ధ మహాప్రవాహాన్ని సూచించే నిర్దిష్ట నామవాచకం. ‘జలప్రళయం’ స్పష్టమైన, స్థిరపడిన తెలుగు పదం.
- source_word: שְׁלֹשׁ מֵאוֹת שָׁנָה וַחֲמִשִּׁים שָׁנָה
  choice: మూడువందల యాభై సంవత్సరాలు
  rationale: హీబ్రూలోని ‘మూడు వందల సంవత్సరాలు మరియు యాభై సంవత్సరాలు’ అనే సంఖ్యా నిర్మాణాన్ని సహజమైన తెలుగు సమష్టి సంఖ్యగా అందిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని కాలక్రమం మరియు ఆయుష్కాల సంఖ్య యథాతథంగా నిలుపబడ్డాయి.
