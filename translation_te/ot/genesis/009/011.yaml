id: GEN.9.11
reference: Genesis 9:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/הֲקִמֹתִ֤י אֶת בְּרִיתִ/י֙ אִתְּ/כֶ֔ם וְ/לֹֽא יִכָּרֵ֧ת כָּל בָּשָׂ֛ר ע֖וֹד מִ/מֵּ֣י הַ/מַּבּ֑וּל וְ/לֹֽא יִהְיֶ֥ה ע֛וֹד מַבּ֖וּל לְ/שַׁחֵ֥ת הָ/אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/011.yaml
  text: 'And I will establish my covenant with you: never again will all flesh be cut off by the waters of the flood[b][a], and never again will there be a flood to destroy the earth.'
translation:
  language: te
  text: 'నేను మీతో నా నిబంధనను స్థిరపరుస్తాను: జలప్రళయపు నీళ్లవల్ల సమస్త ప్రాణులు[a] ఇక ఎన్నడూ నిర్మూలించబడవు[b]; భూమిని నాశనం చేయడానికి ఇక ఎన్నడూ జలప్రళయం రాదు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘సమస్త ప్రాణులు’ అనే మాట మనుషులకు మాత్రమే కాకుండా జంతువులతో సహా జీవులన్నిటినీ విస్తృతంగా సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘తొలగించబడవు’; హీబ్రూ క్రియకు అక్షరార్థంగా ‘నరికివేయబడవు’ అనే భావం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲקִמֹתִי
  choice: నేను ... స్థిరపరుస్తాను
  rationale: קום హిఫిల్ రూపం నిబంధన సందర్భంలో దానిని స్థాపించడం లేదా దృఢపరచడం అనే భావాన్ని ఇస్తుంది. వాగ్దాన సందర్భానికి భవిష్యత్ రూపం సరిపోతుంది; ‘స్థిరపరుస్తాను’ మూలంలోని గంభీరమైన నిబంధనా శైలిని నిలుపుతుంది.
- source_word: בְּרִיתִי
  choice: నా నిబంధనను
  rationale: బְּרִית్‌కు ఆదికాండమంతటా ప్రామాణికమైన, వేదాంతపరంగా మరియు సాహిత్యపరంగా తగిన తెలుగు పదం ‘నిబంధన’.
- source_word: אִתְּכֶם
  choice: మీతో
  rationale: బహువచన సంబోధితులతో నిబంధనా సంబంధాన్ని సహజమైన తెలుగులో నేరుగా వ్యక్తం చేస్తుంది.
- source_word: יִכָּרֵת
  choice: నిర్మూలించబడవు
  rationale: כרת నిఫాల్ అక్షరార్థంగా ‘నరికివేయబడుట/తొలగించబడుట’. ఈ జలప్రళయ తీర్పు సందర్భంలో ‘నిర్మూలించబడవు’ సహజంగా అర్థాన్ని అందిస్తుంది; అక్షరార్థాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: כָּל בָּשָׂר
  choice: సమస్త ప్రాణులు
  rationale: ఈ పదబంధం ఇక్కడ మనుషులకు మాత్రమే కాక జంతువులతో సహా జీవులన్నిటినీ విస్తృతంగా సూచిస్తుంది. తెలుగు ‘సమస్త శరీరులు’ అసహజంగా ఉండటంతో, సందర్భానుగుణంగా స్పష్టమైన ‘సమస్త ప్రాణులు’ ఎంచుకున్నాం.
- source_word: עוֹד
  choice: ఇక ఎన్నడూ
  rationale: నిరాకరణతో కూడిన వాగ్దాన సందర్భంలో עוֹד ‘మళ్లీ ఎన్నటికీ కాదు’ అనే బలాన్ని కలిగిస్తుంది.
- source_word: מִמֵּי הַמַּבּוּל
  choice: జలప్రళయపు నీళ్లవల్ల
  rationale: מן ఇక్కడ నాశనానికి కారణమైన సాధనాన్ని లేదా మూలాన్ని సూచిస్తుంది. ఈ భావాన్ని తెలుగు ‘నీళ్లవల్ల’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: מַבּוּל
  choice: జలప్రళయం
  rationale: నోవహు కథనంలోని మహా వరదను సూచించే מַבּוּל‌కు ఆధునిక తెలుగు బైబిలు శైలిలో స్పష్టమైన, గంభీరమైన పదం.
- source_word: לְשַׁחֵת
  choice: నాశనం చేయడానికి
  rationale: שׁחת ఈ సందర్భంలో వినాశకర తీర్పును సూచిస్తుంది; ‘నాశనం చేయడానికి’ ప్రత్యక్షమైన సహజ అనువాదం.
- source_word: הָאָרֶץ
  choice: భూమిని
  rationale: జలప్రళయ కథనంలోని విశ్వవ్యాప్త సందర్భంలో ‘దేశం’ కంటే ‘భూమి’ తగినది; మూలంలోని విస్తృత పరిధిని కాపాడుతుంది.
theological_decisions:
- issue: ‘సమస్త శరీరం’ అనే పదబంధపు పరిధి
  choice: మనుషులు, జంతువులు సహా జీవులను సూచించేలా ‘సమస్త ప్రాణులు’
  alternative: ‘సమస్త మానవజాతి’ లేదా అక్షరార్థంగా ‘సమస్త శరీరం’
  rationale: ఆదికాండం 9 సందర్భం నిబంధన పరిధిలో మనుషులతో పాటు జంతువులనూ చేర్చుతుంది. అందువల్ల దానిని మానవులకు మాత్రమే పరిమితం చేయలేదు.
- issue: קוםతో కూడిన నిబంధనా సూత్రీకరణ
  choice: ‘నా నిబంధనను స్థిరపరుస్తాను’
  alternative: ‘నా నిబంధనను నిర్ధారిస్తాను’ లేదా ‘నా నిబంధనను నిలబెడతాను’
  rationale: ఈ రూపం నిబంధన కొత్తగా స్థాపించబడుతోందా లేక ముందే ప్రకటించినది ధృవీకరించబడుతోందా అనే సూక్ష్మతను అతిగా నిర్ణయించకుండా మూలంలోని గంభీరతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన నిబంధనా శైలిని నిలుపుతూ, సాధారణ పాఠకులకు సహజంగా అర్థమయ్యే పదాలను వాడాం. ప్రతి పాదటిప్పణి సూచిక ప్రధాన వచనంలో ఉంది.
