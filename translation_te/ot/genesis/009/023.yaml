id: GEN.9.23
reference: Genesis 9:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּקַּח֩ שֵׁ֨ם וָ/יֶ֜פֶת אֶת הַ/שִּׂמְלָ֗ה וַ/יָּשִׂ֨ימוּ֙ עַל שְׁכֶ֣ם שְׁנֵי/הֶ֔ם וַ/יֵּֽלְכוּ֙ אֲחֹ֣רַנִּ֔ית וַ/יְכַסּ֕וּ אֵ֖ת עֶרְוַ֣ת אֲבִי/הֶ֑ם וּ/פְנֵי/הֶם֙ אֲחֹ֣רַנִּ֔ית וְ/עֶרְוַ֥ת אֲבִי/הֶ֖ם לֹ֥א רָאֽוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/023.yaml
  text: Then Shem and Japheth took the garment and laid it on both their shoulders[a], and they walked backward and covered their father's nakedness. Their faces were turned backward, so they did not see their father's nakedness.
translation:
  language: te
  text: అప్పుడు షేము, యాపెతు ఆ వస్త్రాన్ని[a] తీసుకొని, దాన్ని తమ ఇద్దరి భుజాల మీద వేసుకున్నారు. వారు వెనుకకు నడుచుకుంటూ తమ తండ్రి నగ్నత్వాన్ని కప్పారు. వారి ముఖాలు వెనక్కి తిరిగి ఉన్నాయి; కాబట్టి వారు తమ తండ్రి నగ్నత్వాన్ని చూడలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పైవస్త్రాన్ని.’ హీబ్రూ పదం బయటి వస్త్రాన్ని సూచిస్తుంది; ఇక్కడ అది నోవహును కప్పడానికి ఉపయోగించబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח שֵׁם וָיֶפֶת
  choice: షేము, యెఫెతు ... తీసుకొని
  rationale: ఏకవచన క్రియ ఉన్నప్పటికీ ఇద్దరు పేర్లు కర్తలుగా వచ్చి, తరువాత బహువచన క్రియలు కొనసాగుతాయి. తెలుగు సహజ వాక్యనిర్మాణంలో సంయుక్త కర్తతో భావాన్ని స్పష్టంగా అందించాం.
- source_word: הַשִּׂמְלָה
  choice: ఆ వస్త్రాన్ని
  rationale: שׂמלה బయటి వస్త్రం లేదా కప్పుకునే వస్త్రాన్ని సూచిస్తుంది. సందర్భంలో ముందే తెలిసిన నిర్దిష్ట వస్తువును సూచించే הַ భావాన్ని ‘ఆ’ ద్వారా తెలిపాం; అతిగా నిర్దిష్టం చేయకుండా ‘వస్త్రం’ వాడాం.
- source_word: וַיָּשִׂימוּ עַל שְׁכֶם שְׁנֵיהֶם
  choice: దాన్ని తమ ఇద్దరి భుజాల మీద వేసుకున్నారు
  rationale: అక్షరార్థంగా ‘వారిద్దరి భుజం మీద ఉంచారు.’ ఇద్దరూ కలిసి వస్త్రాన్ని మోసిన భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలిపాం.
- source_word: אֲחֹרַנִּית
  choice: వెనక్కి / వెనక్కి తిరిగి
  rationale: మొదటి సందర్భంలో వెనుకకు నడవడాన్ని, రెండవ సందర్భంలో ముఖాల దిశను సూచిస్తుంది. మూలంలోని పునరుక్తిని తెలుగు వాక్యసందర్భానికి తగిన రూపాల్లో నిలిపాం.
- source_word: וַיְכַסּוּ
  choice: కప్పారు
  rationale: כסה క్రియకు సందర్భానుగుణమైన సూటి తెలుగు సమానం.
- source_word: עֶרְוַת אֲבִיהֶם
  choice: తమ తండ్రి నగ్నత్వాన్ని
  rationale: మూలంలోని స్పష్టమైన పదబంధాన్ని, దాని అవమానం-గౌరవం సంబంధిత భావ ఛాయను తగ్గించకుండా నిలిపాం.
- source_word: וּפְנֵיהֶם אֲחֹרַנִּית
  choice: వారి ముఖాలు వెనక్కి తిరిగి ఉండడంతో
  rationale: హీబ్రూలో ఇది క్రియలేని వాక్యభాగం. తెలుగులో సహజంగా ఉండేందుకు ‘తిరిగి ఉండడంతో’ చేర్చి, తరువాతి ఫలిత వాక్యంతో అనుసంధానించాం.
- source_word: לֹא רָאוּ
  choice: చూడలేదు
  rationale: ראה యొక్క సాధారణ అర్థాన్ని నిలిపాం; ‘చూడటానికి ప్రయత్నించలేదు’ వంటి అదనపు ఉద్దేశార్థాన్ని చేర్చలేదు.
theological_decisions:
- issue: ‘తమ తండ్రి నగ్నత్వం’ అనే పదబంధపు అర్థం
  choice: నోవహు బయటపడిన శరీరాన్ని కుమారులు గౌరవపూర్వకంగా కప్పడం
  alternative: తరువాతి లేవీయకాండ ప్రయోగాల ఆధారంగా దీనిని లైంగిక సభ్యోక్తిగా అర్థం చేసుకోవడం
  rationale: ఈ వచనంలోని వస్త్రం, వెనక్కి నడవడం, చూడకుండా కప్పడం అనే స్పష్టమైన చర్యలు శరీర నగ్నత్వాన్నే ప్రత్యక్షంగా సూచిస్తున్నాయి. అయినా వ్యాఖ్యానాన్ని పాఠ్యంలో బలవంతంగా నిర్ణయించకుండా మూలంలోని ‘నగ్నత్వం’ అనే పదాన్నే ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. ‘నగ్నత్వం’ అనే పదం మూలపాఠ్యంలోని ప్రత్యక్షతను, గౌరవం-అవమానం భావ ఛాయను నిలుపుతుంది. షేము, యెఫెతు అనే రూపాలు సాధారణ తెలుగు బైబిలు నామరూపాలకు అనుగుణంగా ఉన్నాయి.
