id: GEN.9.3
reference: Genesis 9:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כָּל רֶ֨מֶשׂ֙ אֲשֶׁ֣ר הוּא חַ֔י לָ/כֶ֥ם יִהְיֶ֖ה לְ/אָכְלָ֑ה כְּ/יֶ֣רֶק עֵ֔שֶׂב נָתַ֥תִּי לָ/כֶ֖ם אֶת כֹּֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/003.yaml
  text: Every moving thing that is alive shall be food for you. As I gave you the green plants[a], I have given you everything.
translation:
  language: te
  text: ప్రాణమున్న ప్రతి కదిలే జీవి మీకు ఆహారంగా ఉంటుంది. పచ్చని మొక్కలను మీకు ఇచ్చినట్లే, నేను మీకు సమస్తాన్నీ ఇచ్చాను.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “బతికియున్న ప్రతి పాకే జీవి మీకు ఆహారంగా ఉంటుంది.” హీబ్రూ רֶמֶשׂ పదం తరచుగా పాకే లేదా గుంపులుగా కదిలే జీవులను సూచిస్తుంది; అయితే ఇక్కడ సందర్భంలో అది విస్తృతార్థంలో ఉండవచ్చు.
    reason: రֶמֶשׂ పదానికి సాధ్యమైన సంకుచిత పదార్థ ప్రత్యామ్నాయాన్ని, సందర్భానుసార విస్తృతార్థాన్ని సూచిస్తుంది.
lexical_decisions:
- source_word: כָּל רֶמֶשׂ אֲשֶׁר הוּא חַי
  choice: సజీవంగా కదిలే ప్రతిదీ
  rationale: రֶמֶשׂ కొన్నిచోట్ల పాకే లేదా గుంపులుగా కదిలే జీవులను సూచించినా, ఈ సందర్భంలో విస్తృత భావంలో ఉంది. ఈ అనువాదం כָּל యొక్క సమగ్రతను, חַי యొక్క జీవస్థితిని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: לָכֶם יִהְיֶה לְאָכְלָה
  choice: మీకు ఆహారంగా ఉంటుంది
  rationale: హీబ్రూ దత్తివు-విధేయ నిర్మాణాన్ని సహజంగా అందిస్తూ, దేవుడు ఇచ్చే అనుమతి మరియు ఆహార సమకూర్పు రెండింటినీ వ్యక్తం చేస్తుంది.
- source_word: כְּיֶרֶק עֵשֶׂב
  choice: పచ్చని మొక్కలను ఇచ్చినట్లే
  rationale: יֶרֶק עֵשֶׂב అనేది పచ్చని వృక్షజాలాన్ని సమూహార్థంలో సూచిస్తుంది; ఆదికాండం 1:29లోని మునుపటి ఆహార అనుగ్రహంతో పోలికను స్పష్టంగా ఉంచుతుంది.
- source_word: נָתַתִּי לָכֶם אֶת כֹּל
  choice: ఇప్పుడు సమస్తాన్నీ మీకు ఇస్తున్నాను
  rationale: హీబ్రూ సంపూర్ణ క్రియ దేవుని అనుగ్రహం అమల్లోకి వచ్చిన స్థితిని తెలియజేస్తుంది. తెలుగు వర్తమాన ప్రకటన ఆ ఫలితస్థితిని సహజంగా వ్యక్తం చేస్తుంది; 'సమస్తాన్నీ' כֹּל యొక్క సమగ్ర బలాన్ని కాపాడుతుంది.
theological_decisions:
- issue: జలప్రళయం తరువాత ఆహార అనుమతి పరిధి
  choice: ఈ వచనం సజీవంగా కదిలే జీవులన్నిటినీ మానవులకు ఆహారంగా ఇచ్చే విస్తృత అనుమతిని ప్రకటిస్తుంది.
  alternative: రֶמֶשׂ అనే పదాన్ని కేవలం పాకే లేదా చిన్న జీవులకు పరిమితం చేయడం.
  rationale: రֶמֶשׂకు సన్నని అర్థం సాధ్యమైనా, כָּל మరియు చివరి אֶת כֹּל ఈ సందర్భంలో సమగ్ర పరిధిని బలపరుస్తాయి. అయితే మూలపదంలోని కదలిక భావాన్ని అనువాదంలో ఉంచాం.
- issue: నָתַתִּי యొక్క కాలభావం
  choice: కొత్తగా అమల్లోకి వచ్చే అనుగ్రహంగా 'ఇప్పుడు ... ఇస్తున్నాను' అని అనువదించడం.
  alternative: గతకాలంగా 'నేను ... ఇచ్చాను' అని అనువదించడం.
  rationale: హీబ్రూ perfect పూర్తయిన కార్యాన్ని లేదా దాని ప్రస్తుత ఫలితాన్ని సూచించగలదు. ఇక్కడ దేవుని ప్రత్యక్ష ప్రకటనలో కొత్త ఆహార అనుమతి ప్రధానంగా ఉన్నందున ప్రస్తుత ఫలితభావాన్ని ఎంచుకున్నాం; పూర్వపు మొక్కల అనుగ్రహంతో పోలికను 'ఇచ్చినట్లే' నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయినా దైవ ప్రకటనకు తగిన గంభీరతతో రూపొందించబడింది. 'ప్రతిదీ/సమస్తాన్నీ' ద్వారా మూలంలోని సమగ్రత, 'కదిలే' ద్వారా రֶמֶשׂ యొక్క పదార్థ ఛాయ నిలుపబడ్డాయి.
