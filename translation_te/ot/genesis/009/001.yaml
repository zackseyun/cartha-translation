  terminology: “దేవుడు,” “నోవహు,” “కుమారులు,” “ఆశీర్వదించి,” “భూమి” అనే పదాలు స్థిరమైన తెలుగు బైబిలు వాడుకకు, అలాగే మూలపాఠంలోని భావానికి తగినవి. “విస్తరించి” ఇక్కడ సంఖ్యలో పెరగడం అనే సందర్భానుకూల భావాన్ని సముచితంగా మోస్తుంది. పాదటిప్పణి הָאָרֶץ‌కు ఉండే ‘దేశం’ అనే సాధ్యమైన ప్రత్యామ్నాయాన్ని నమోదు చేస్తూ, ఈ సందర్భంలో ‘భూమి’ ఎందుకు ఎంచుకున్నారో స్పష్టం చేస్తుంది.
