id: GEN.9.1
reference: Genesis 9:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְבָ֣רֶךְ אֱלֹהִ֔ים אֶת נֹ֖חַ וְ/אֶת בָּנָ֑י/ו וַ/יֹּ֧אמֶר לָ/הֶ֛ם פְּר֥וּ וּ/רְב֖וּ וּ/מִלְא֥וּ אֶת הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/001.yaml
  text: And God blessed Noah and his sons[a], and said to them, “Be fruitful and multiply and fill the earth.”
translation:
  language: te
  text: 'దేవుడు నోవహును, అతని కుమారులను ఆశీర్వదించి, వారితో ఇలా అన్నాడు: “మీరు ఫలించి, విస్తరించి, భూమిని[a] నింపండి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘దేశాన్ని.’ అయితే జలప్రళయం అనంతర సందర్భం, అలాగే ఆదికాండము 1:28తో ఉన్న ప్రతిధ్వని దృష్ట్యా ఇక్కడ ‘భూమిని’ అన్నదే బాగా సరిపోతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבָרֶךְ
  choice: ఆశీర్వదించి
  rationale: పీయేల్ రూపం ఆశీర్వాదాన్ని అనుగ్రహించడాన్ని సూచిస్తుంది; ‘ఆశీర్వదించాడు’ అనే సాధారణ తెలుగు భావాన్ని సహజమైన వాక్యనిర్మాణంలో ఉంచాం.
- source_word: אֱלֹהִים
  choice: దేవుడు
  rationale: ఈ కథన సందర్భంలో ఇది ఏకైక దేవుణ్ణి సూచిస్తుంది.
- source_word: נֹחַ
  choice: నోవహు
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన పేరురూపాన్ని అనుసరించాం.
- source_word: בָּנָיו
  choice: అతని కుమారులను
  rationale: హీబ్రూ పదం సాధారణంగా పిల్లలను కాక ప్రత్యేకంగా కుమారులను సూచిస్తుంది.
- source_word: וַיֹּאמֶר לָהֶם
  choice: వారితో ఇలా అన్నాడు
  rationale: మాటల పరిచయాన్ని సహజమైన ఆధునిక తెలుగు కథనశైలిలో, అదనపు వ్యాఖ్యానం లేకుండా తెలిపింది.
- source_word: פְּרוּ
  choice: మీరు ఫలించి
  rationale: సంతానోత్పత్తి భావాన్ని మోసే ఆజ్ఞ; ఆదికాండము 1:28తో ఉన్న పదప్రతిధ్వనిని నిలుపుతుంది.
- source_word: וּרְבוּ
  choice: విస్తరించి
  rationale: సంఖ్యలో అధికమవ్వడం అనే భావాన్ని సహజంగా తెలియజేస్తూ సృష్టి ఆజ్ఞతో సంబంధాన్ని నిలుపుతుంది.
- source_word: וּמִלְאוּ
  choice: నింపండి
  rationale: మూల క్రియ యొక్క ప్రత్యక్ష అర్థం ‘నింపడం’; ‘మళ్లీ నింపడం’ అనే అదనపు భావాన్ని చేర్చలేదు.
- source_word: הָאָרֶץ
  choice: భూమిని
  rationale: జలప్రళయం అనంతర విశ్వవ్యాప్త సందర్భం మరియు ఆదికాండము 1:28 ప్రతిధ్వని దృష్ట్యా ‘భూమి’ సరిపోతుంది; ‘దేశం’ అనే అర్థసాధ్యతను పాదటిప్పణిలో ఉంచాం.
theological_decisions:
- issue: ఆదికాండము 1:28లోని సృష్టి ఆజ్ఞతో సంబంధం
  choice: “ఫలించి, విస్తరించి, భూమిని నింపండి” అనే సమాంతర పదబంధాన్ని నిలుపడం
  alternative: “ఎక్కువమంది పిల్లలను కని భూమంతటా నివసించండి” వంటి వివరణాత్మక రూపం
  rationale: హీబ్రూ మూలం సృష్టి ఆశీర్వాదంలోని భాషను ఉద్దేశపూర్వకంగా పునరావృతం చేస్తుంది. వివరణాత్మక విస్తరణ చేయకుండా ఆ పదప్రతిధ్వనిని నిలపడం వల్ల సృష్టి అనంతర మానవాళికి, జలప్రళయం అనంతర మానవాళికి మధ్య ఉన్న ధార్మిక కొనసాగింపు స్పష్టంగా ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలిని ఉపయోగించాం. మూలంలోని బహువచన ఆజ్ఞను ‘మీరు’తో స్పష్టం చేశాం; సృష్టి ఆజ్ఞకు చెందిన సంక్షిప్త లయను కాపాడాం.
