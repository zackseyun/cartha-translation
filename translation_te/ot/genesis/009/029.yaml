  yaml_path: translation/ot/genesis/009/029.yaml
  text: So all the days of Noah were nine hundred and fifty years, and he died.
translation:
  language: te
  text: నోవహు జీవించిన మొత్తం కాలం తొమ్మిది వందల యాభై సంవత్సరాలు; అతడు చనిపోయాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ כָּל יְמֵי נֹחַ
  choice: నోవహు జీవించిన మొత్తం కాలం
  rationale: హీబ్రూ పదబంధం నోవహు జీవితకాలం మొత్తాన్ని సూచించే వంశావళి సారాంశ సూత్రం. పదానువాదమైన ‘నోవహు దినాలన్నీ’ కంటే ఈ రూపం ఆధునిక తెలుగులో సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: תְּשַׁע מֵאוֹת שָׁנָה וַחֲמִשִּׁים שָׁנָה
  choice: తొమ్మిది వందల యాభై సంవత్సరాలు
  rationale: హీబ్రూలో సంఖ్య రెండు సమన్విత భాగాలుగా ఉన్నప్పటికీ, తెలుగులో మొత్తం సంఖ్యను ఈ విధంగా చెప్పడం సహజం.
- source_word: וַיָּמֹת
  choice: ఆ తర్వాత అతడు చనిపోయాడు
  rationale: వావ్‌తో కూడిన క్రియ కథన ముగింపును తెలియజేస్తుంది; ‘అతడు’ నోవహును స్పష్టంగా సూచిస్తుంది. ‘చనిపోయాడు’ సాధారణ ఆధునిక తెలుగులో సహజమైన, గౌరవభంగం లేని ప్రయోగం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; వంశావళి సారాంశ భావాన్ని కాపాడుతూ సాధారణ పాఠకులకు సహజంగా ఉండే నిర్మాణం. మూలంలో లేని వివరణాత్మక లేదా మతశాస్త్రీయ అంశాలు చేర్చలేదు.
