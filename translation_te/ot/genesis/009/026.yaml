source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר בָּר֥וּךְ יְהֹוָ֖ה אֱלֹ֣הֵי שֵׁ֑ם וִ/יהִ֥י כְנַ֖עַן עֶ֥בֶד לָֽ/מוֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/026.yaml
  text: And he said, “Blessed be the LORD, the God of Shem, and let Canaan be their servant.”
translation:
  language: te
  text: 'అతడు ఇలా అన్నాడు: “షేము యొక్క దేవుడైన యెహోవా స్తుతించబడుగాక! కనాను వారికి[a] దాసుడై ఉండుగాక.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా “వారికి.” ఇది ఎవరిని సూచిస్తుందో ఇక్కడ స్పష్టంగా లేదు.
    reason: మూలపాఠంలోని బహువచన ప్రత్యయాన్ని, దాని అస్పష్ట సూచ్యార్థాన్ని పాఠకునికి తెలియజేయడానికి.
lexical_decisions:
- source_word: בָּרוּךְ
  choice: స్తుతించబడుగాక
  rationale: దేవుని గురించి వాడినప్పుడు ఇది కేవలం ‘ధన్యుడు’ అనే స్థితిని కాక, ఆయనను స్తుతించాలనే ఆశీర్వచన భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: మూలంలోని దేవుని ప్రత్యేక నామమైన చతురక్షర నామాన్ని సాధారణ బిరుదైన ‘ప్రభువు’గా మార్చకుండా తెలుగులో సుపరిచిత రూపంతో ఉంచింది.
- source_word: עֶבֶד
  choice: దాసుడు
  rationale: ఇక్కడ సూచించబడిన అధీన సేవాస్థితిని ‘సేవకుడు’ కంటే స్పష్టంగా వ్యక్తం చేస్తుంది; అయినా ఆధునిక జాతివర్గీకరణను వచనంలోకి దిగుమతి చేయదు.
theological_decisions:
- issue: לָמוֹ అనే ప్రత్యయపు సంఖ్య మరియు దాని సూచ్యార్థం
  choice: వారికి
  alternative: అతనికి
  rationale: మసొరెటిక్ పాఠంలో ప్రత్యయం బహువచన రూపంలో ఉంది. అది ఎవరిని సూచిస్తుందో వచనం స్పష్టంగా చెప్పనందున ఏకవచనంగా మార్చి షేమును మాత్రమే సూచిస్తున్నట్లు నిర్ణయించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన ఆశీర్వచన శైలిని ఉంచుతూ, వాక్య నిర్మాణాన్ని సాధారణ పాఠకులకు సహజంగా తీర్చిదిద్దాం. ‘వారికి’ అనే అస్పష్టతను మూలానికి అనుగుణంగా అలాగే నిలిపాం.
