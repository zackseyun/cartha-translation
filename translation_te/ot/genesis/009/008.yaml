  text: וַ/יֹּ֤אמֶר אֱלֹהִים֙ אֶל נֹ֔חַ וְ/אֶל בָּנָ֥י/ו אִתּ֖/וֹ לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/008.yaml
  text: Then God said to Noah and to his sons with him, saying,
translation:
  language: te
  text: 'అప్పుడు దేవుడు నోవహుతోను, అతనితో ఉన్న అతని కుమారులతోను ఇలా అన్నాడు:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... అన్నాడు
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది. ఆధునిక తెలుగు కథనంలో ‘అప్పుడు ... అన్నాడు’ దాని క్రమసూచక భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: אֱלֹהִים
  choice: దేవుడు
  rationale: ఈ సందర్భంలో ఈ పదం నోవహుతో మాట్లాడుతున్న ఏకైక దేవుణ్ణి సూచిస్తుంది; ‘దేవుడు’ ప్రామాణిక తెలుగు అనువాదం.
- source_word: אֶל־נֹחַ
  choice: నోవహుతో
  rationale: మాట్లాడే క్రియతో కూడిన אֶל సంబోధితుణ్ణి సూచిస్తుంది. తెలుగులో ‘నోవహుతో ... అన్నాడు’ సహజమైన నిర్మాణం.
- source_word: וְאֶל־בָּנָיו
  choice: అతని కుమారులతో
  rationale: בָּנִים ఇక్కడ మగ సంతానాన్ని నిర్దిష్టంగా సూచిస్తుంది; అందువల్ల సాధారణ ‘పిల్లలు’కు బదులు ‘కుమారులు’ వాడబడింది. సమన్వయమైన రెండవ సంబోధిత వర్గం తెలుగులో ‘తో’ ద్వారా వ్యక్తమవుతుంది.
- source_word: אִתּוֹ
  choice: అతనితో ఉన్న
  rationale: నోవహు కుమారులు అతనితో ఉన్నారని ఈ పదబంధం తెలియజేస్తుంది. తెలుగు పదక్రమంలో సంబంధాన్ని స్పష్టంగా చూపడానికి ‘అతనితో ఉన్న అతని కుమారులతో’ అని అమర్చబడింది.
- source_word: לֵאמֹר
  choice: ఇలా అన్నాడు
  rationale: ఈ రూపం తరువాత వచ్చే ప్రత్యక్ష వాక్యాన్ని పరిచయం చేస్తుంది. తెలుగులో ‘ఇలా అన్నాడు:’ అనే సహజమైన ఉక్తి-పరిచయ నిర్మాణం దాని కార్యాన్ని కాపాడుతుంది; ‘అని చెప్పుతూ’ అనే పదానువాదం ఇక్కడ అనవసరంగా భారంగా ఉంటుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవభరితమైనప్పటికీ సాధారణ పాఠకులకు సహజంగా వినిపించే కథన శైలి. హెబ్రీ వాక్యంలోని సంబోధితులు మరియు తరువాతి ప్రత్యక్ష ప్రసంగానికి చేసే పరిచయం స్పష్టంగా నిలుపబడ్డాయి.
