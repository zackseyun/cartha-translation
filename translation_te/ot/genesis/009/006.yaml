  variant: modern standard Telugu
source:
  edition: WLC
  text: שֹׁפֵךְ֙ דַּ֣ם הָֽ/אָדָ֔ם בָּֽ/אָדָ֖ם דָּמ֣/וֹ יִשָּׁפֵ֑ךְ כִּ֚י בְּ/צֶ֣לֶם אֱלֹהִ֔ים עָשָׂ֖ה אֶת הָ/אָדָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/006.yaml
  text: Whoever sheds the blood of man[a], by man shall his blood be shed[b], for God made man in his image.
translation:
  language: te
  text: ఎవరైనా మనిషి రక్తాన్ని చిందిస్తే, అతని రక్తం మనిషి చేత చిందించబడుతుంది[a]; ఎందుకంటే దేవుడు మనిషిని తన స్వరూపంలో చేశాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘మనిషి చేత’ అని అనువదించిన హీబ్రూ పదబంధాన్ని ‘మానవుల మధ్య’ అని కూడా అర్థం చేసుకోవచ్చు; ఇక్కడ సాధనకర్త భావం సందర్భానికి మరింత సహజం.
    reason: textual_ambiguity
  - marker: b
    text: 'హీబ్రూ పదక్రమం మరింత అక్షరార్థంగా: ‘ఎందుకంటే దేవుని స్వరూపంలో ఆయన మనిషిని చేశాడు.’ ఇక్కడ ‘మనిషి’ పురుషులను మాత్రమే కాక, సాధారణంగా మానవుణ్ణి సూచిస్తుంది.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׁפֵךְ
  choice: ఎవరైనా … చిందిస్తే
  rationale: హీబ్రూ వర్తమాన కృదంతం ఇక్కడ సాధారణంగా వర్తించే సామెతాత్మక-న్యాయ నియమాన్ని వ్యక్తం చేస్తుంది. ఈ తెలుగు నిర్మాణం దానిని సహజంగా తెలియజేస్తుంది.
- source_word: דַּם
  choice: రక్తం
  rationale: ఇది ప్రాణరక్తాన్ని, సందర్భంలో హింసాత్మకంగా ప్రాణం తీయడాన్ని సూచించే సాధారణ సమానార్థకం.
- source_word: הָאָדָם
  choice: మనిషి
  rationale: אָדָם ఇక్కడ పురుషులను మాత్రమే కాక సాధారణంగా మానవుణ్ణి సూచిస్తుంది. ‘మనిషి’ సహజమైన తెలుగు ఏకవచన రూపంగా ఆ సాధారణ భావాన్ని నిలుపుతుంది.
- source_word: בָּאָדָם
  choice: మనిషి చేతనే
  rationale: בְּ ఉపసర్గను ఇక్కడ సాధనకర్తను సూచించేదిగా తీసుకున్నాం. ‘చేతనే’ మానవుడే కార్యసాధకుడని స్పష్టంగా చూపి, హీబ్రూ వాక్యంలోని నొక్కిచెప్పే సమాంతరతను నిలుపుతుంది.
- source_word: דָּמוֹ
  choice: ఆ వ్యక్తి రక్తం
  rationale: ముందు చెప్పిన రక్తం చిందించిన వ్యక్తినే సహజమైన ఆధునిక తెలుగులో తిరిగి సూచిస్తుంది.
- source_word: יִשָּׁפֵךְ
  choice: చిందించబడుతుంది
  rationale: నిఫాల్ అసంపూర్ణ క్రియారూపంలోని కర్మణి భావాన్ని నిలుపుతూ, దానిని తప్పనిసరి ఆజ్ఞగా అతిగా నిర్దిష్టీకరించకుండా న్యాయపరమైన ఫలితాన్ని తెలుపుతుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి నియమానికి కారణాన్ని పరిచయం చేస్తుంది.
- source_word: בְּצֶלֶם אֱלֹהִים
  choice: తన స్వరూపంలో
  rationale: వాక్యంలోని స్పష్టమైన కర్త దేవుడే కాబట్టి ‘తన’ ఎవరిని సూచిస్తుందో స్పష్టంగా ఉంది; దేవుని స్వరూపంలో మానవుడు చేయబడ్డాడనే భావం పూర్తిగా నిలుస్తుంది.
- source_word: עָשָׂה
  choice: చేశాడు
  rationale: עָשָׂה యొక్క నేరమైన అర్థం ‘చేయడం/తయారుచేయడం.’ మూలంలో లేని ప్రత్యేక ‘సృష్టించు’ క్రియను దిగుమతి చేయకుండా ‘చేశాడు’ అని అనువదించాం.
theological_decisions:
- issue: אָדָם అనే పదం సాధారణ మానవుణ్ణి సూచించడం
  choice: మనిషి
  alternative: మానవజాతి / మానవుడు
  rationale: ఏకవచన, ప్రతినిధిత్వ భావాన్ని మరియు వచనంలోని పునరుక్తిని సాధ్యమైనంతవరకు నిలుపుతూ, ఇది పురుషులకు మాత్రమే పరిమితం కాదని పాదటిప్పణిలో స్పష్టం చేశాం.
- issue: בָּאָדָם మానవ కార్యసాధకుణ్ణి సూచిస్తుందా లేక మానవుల మధ్య జరిగేదాన్ని సూచిస్తుందా
  choice: మనిషి చేతనే
  alternative: మానవుల మధ్య / మానవజాతి ద్వారా
  rationale: సందర్భం, సమాంతర వాక్య నిర్మాణం ప్రకారం సాధనకర్త భావమే సహజమైనది. అయితే ఈ ఒక్క వచనాన్ని విస్తరించి సంపూర్ణ శిక్షాసిద్ధాంతంగా వ్యాఖ్యానించలేదు.
- issue: יִשָּׁפֵךְ యొక్క న్యాయపరమైన బలం
  choice: చిందించబడుతుంది
  alternative: చిందించబడాలి
  rationale: హీబ్రూ అసంపూర్ణ క్రియారూపం గంభీరమైన నియమం లేదా నిర్ధారిత ఫలితాన్ని తెలియజేయగలదు; ‘చిందించబడాలి’ అని పెడితే ఆజ్ఞార్థక బలాన్ని మూలరూపం కంటే ఎక్కువగా నిర్దిష్టం చేసే ప్రమాదం ఉంది.
- issue: దేవుని స్వరూపం అనే వాక్యభాగం
  choice: దేవుడు మనిషిని తన స్వరూపంలో చేశాడు
  alternative: దేవుని స్వరూపంలో ఆయన మనిషిని చేశాడు
  rationale: సహజమైన తెలుగు పదక్రమాన్ని వాడినా, మానవ ప్రాణానికి ఆధారం దేవుని స్వరూపంలో చేయబడటమే అనే మూలవాక్య భావాన్ని మార్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన న్యాయ-సామెతాత్మక శైలి వాడబడింది. పాతకాలపు ‘చిందింపబడును’ వంటి రూపాలను నివారించి, సాధారణ పాఠకులకు అర్థమయ్యే కర్మణి నిర్మాణాన్ని ఎంచుకున్నాం.
