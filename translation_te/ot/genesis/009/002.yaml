id: GEN.9.2
reference: Genesis 9:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/מוֹרַאֲ/כֶ֤ם וְ/חִתְּ/כֶם֙ יִֽהְיֶ֔ה עַ֚ל כָּל חַיַּ֣ת הָ/אָ֔רֶץ וְ/עַ֖ל כָּל ע֣וֹף הַ/שָּׁמָ֑יִם בְּ/כֹל֩ אֲשֶׁ֨ר תִּרְמֹ֧שׂ הָֽ/אֲדָמָ֛ה וּֽ/בְ/כָל דְּגֵ֥י הַ/יָּ֖ם בְּ/יֶדְ/כֶ֥ם נִתָּֽנוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/002.yaml
  text: And the fear of you and the dread of you shall be upon every beast of the earth and upon every bird of the heavens[a], on everything that creeps on the ground, and on all the fish of the sea[c][b]; into your hand they are given.
translation:
  language: te
  text: మీ పట్ల భయమూ, భీతియూ భూమిమీద ఉన్న ప్రతి జంతువుమీద, ఆకాశంలోని ప్రతి పక్షిమీద, నేలమీద పాకే ప్రతిదానిమీద, సముద్రంలోని చేపలన్నిటిమీద ఉంటాయి. అవన్నీ మీ చేతికి అప్పగించబడ్డాయి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘మీ చేతికి అప్పగించబడ్డాయి’ అనేది అవి మీ అధికారానికి లేదా నియంత్రణకు ఇవ్వబడ్డాయని తెలిపే హీబ్రూ నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: מוֹרַאֲכֶם וְחִתְּכֶם
  choice: మీరంటే భయం, మీరంటే బెదురు
  rationale: ఈ రెండు పదాలు మనుషులు జంతువుల్లో కలిగించే భయాన్నీ తీవ్రమైన బెదురునీ సూచిస్తాయి. తెలుగులో సహజంగా ఉండేలా, అలాగే మూలంలోని జోడింపు బలాన్ని నిలుపుతూ రెండింటినీ వేరువేరు పదాలతో అనువదించాం.
- source_word: חַיַּת הָאָרֶץ
  choice: భూమిమీదున్న ప్రతి జంతువు
  rationale: ఈ సందర్భంలో חַיָּה భూజంతువులను సమగ్రంగా సూచిస్తుంది. కేవలం అడవి జంతువులకే పరిమితం చేయకుండా ‘జంతువు’ అని అనువదించాం.
- source_word: עוֹף הַשָּׁמָיִם
  choice: ఆకాశంలోని ప్రతి పక్షి
  rationale: עוֹף ఇక్కడ సాధారణంగా పక్షులను సూచిస్తుంది; שָׁמַיִם అనే పదానికి ఈ సందర్భంలో సహజమైన తెలుగు రూపం ‘ఆకాశం’.
- source_word: בְּכֹל אֲשֶׁר תִּרְמֹשׂ הָאֲדָמָה
  choice: నేలమీద పాకే ప్రతిదాని
  rationale: רמשׂ చిన్నగా కదలడం లేదా పాకడాన్ని సూచిస్తుంది. אֲדָמָהను ముందున్న אֶרֶץ నుండి వేరు చూపేందుకు ‘నేల’ అని అనువదించాం.
- source_word: דְּגֵי הַיָּם
  choice: సముద్రంలోని చేపలన్నీ
  rationale: మూలంలోని సమగ్ర పరిధిని సహజమైన తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: בְּיֶדְכֶם נִתָּנוּ
  choice: మీ చేతికి అప్పగించబడ్డాయి
  rationale: అధికారం లేదా నియంత్రణ కింద ఉంచడాన్ని తెలిపే హీబ్రూ రూపకాన్ని తెలుగులోనూ ‘చేతికి అప్పగించడం’ అనే సహజమైన ప్రయోగంతో నిలిపాం.
theological_decisions:
- issue: జలప్రళయం తరువాత జంతువులపై మానవుల అధికారం
  choice: జంతువులు మనుషుల చేతికి అప్పగించబడ్డాయని తెలిపే మూల రూపకాన్ని నిలిపాం.
  alternative: ‘అవన్నీ మీకు లోబడి ఉంటాయి’ అని భావాన్ని విస్తరించి చెప్పడం.
  rationale: వచనం నిజమైన మానవ నియంత్రణను సూచించినా, దాని పరిధిని సిద్ధాంతపరంగా విస్తరించకుండా మూలంలోని రూపకాన్నీ ఉద్రిక్తతనూ అలాగే ఉంచడం సముచితం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గంభీరంగా ఉండే వాక్య నిర్మాణాన్ని వాడాం. ‘మీరంటే భయం, మీరంటే బెదురు’ అనే పునరుక్తి మూలంలోని సమాంతర బలాన్ని సామాన్య పాఠకునికి స్పష్టంగా అందిస్తుంది.
