source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר אֱלֹהִ֖ים אֶל נֹ֑חַ זֹ֤את אֽוֹת הַ/בְּרִית֙ אֲשֶׁ֣ר הֲקִמֹ֔תִי בֵּינִ֕/י וּ/בֵ֥ין כָּל בָּשָׂ֖ר אֲשֶׁ֥ר עַל הָ/אָֽרֶץ־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/017.yaml
  text: And God said to Noah[a], “This is the sign of the covenant that I have established between me and all flesh that is on the earth.”
translation:
  language: te
  text: 'దేవుడు నోవహుతో ఇలా అన్నాడు: “నాకూ భూమిమీద ఉన్న సమస్త ప్రాణులకూ మధ్య నేను స్థాపించిన నిబంధనకు ఇదే సూచన.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “సమస్త శరీరం.” ఈ సందర్భంలో భూమిమీదనున్న సమస్త ప్రాణిజీవాన్ని సూచించే విస్తృతమైన పదబంధం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: ఇలా అన్నాడు
  rationale: వావ్-కన్సిక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది. తెలుగులో సహజమైన కథన ప్రవాహం కోసం ‘ఇలా అన్నాడు’ అని అనువదించాం.
- source_word: אֱלֹהִים
  choice: దేవుడు
  rationale: ఇక్కడ నోవహుతో మాట్లాడుతున్న ఏకైక దేవుణ్ణి సూచిస్తుంది; ‘దేవుడు’ ఆధునిక ప్రామాణిక తెలుగు రూపం.
- source_word: אֶל נֹחַ
  choice: నోవహుతో
  rationale: మాట ఎవరిని ఉద్దేశించి చెప్పబడిందో సూచిస్తుంది. ‘నోవహు’ తెలుగులో స్థిరపడిన పేరురూపం.
- source_word: זֹאת אוֹת הַבְּרִית
  choice: నిబంధనకు ఇదే సూచన
  rationale: హీబ్రూ గుర్తింపువాక్యాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది. אוֹתకు ‘సూచన’ అనేది సందర్భానుకూలమైన స్పష్టమైన పదం.
- source_word: הֲקִמֹתִי
  choice: నేను స్థిరపరచిన
  rationale: బ్రిత్‌తో కూడిన קום హిఫిల్ రూపం నిబంధనను స్థాపించడం లేదా ధృవపరచడం అనే భావం ఇస్తుంది. ‘స్థిరపరచిన’ పూర్తయిన చర్యను, దాని కొనసాగుతున్న ప్రాముఖ్యతను తెలియజేస్తుంది.
- source_word: בֵּינִי וּבֵין
  choice: నాకూ ... మధ్య
  rationale: నిబంధనలోని రెండు పక్షాల మధ్య సంబంధాన్ని తెలుగులో సహజంగా తెలుపుతుంది.
- source_word: כָּל בָּשָׂר
  choice: సమస్త జీవరాశి
  rationale: అక్షరార్థంగా ‘సమస్త శరీరం/మాంసం’ అయినా, ఆదికాండము 9 సందర్భంలో ఇది మనుషులకు మాత్రమే కాక భూమిమీద జీవించే ప్రాణులన్నిటికీ వర్తిస్తుంది. ‘సమస్త జీవరాశి’ ఆ విస్తృతిని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: אֲשֶׁר עַל הָאָרֶץ
  choice: భూమిమీద ఉన్న
  rationale: ఈ సంబంధవాచక భాగం సమస్త జీవరాశిని విశేషిస్తుంది; విశ్వవ్యాప్త సందర్భంలో ‘భూమిమీద’ సరైన అర్థాన్ని ఇస్తుంది.
theological_decisions:
- issue: నోవహు నిబంధనలో כָּל בָּשָׂר పరిధి
  choice: సమస్త జీవరాశి
  alternative: సమస్త శరీరం; మానవులందరూ
  rationale: ఆదికాండము 9లో ఈ హీబ్రూ పదబంధం మానవులను మించి జంతుజీవాన్ని కూడా కలుపుకునే విస్తృత అర్థం కలిగి ఉంది. ‘మానవులందరూ’ అని అనడం పరిధిని అనవసరంగా కుదిస్తుంది; అక్షరానువాదమైన ‘సమస్త శరీరం’ ఆధునిక తెలుగులో అసహజంగా, అస్పష్టంగా ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘నిబంధన’ అనే స్థిరమైన బైబిలు-తాత్త్విక పదాన్ని కొనసాగిస్తూ, כָּל בָּשָׂרను సందర్భార్థానుసారం ‘సమస్త జీవరాశి’గా అందించాం.
