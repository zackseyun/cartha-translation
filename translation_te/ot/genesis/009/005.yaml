id: GEN.9.5
reference: Genesis 9:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אַ֨ךְ אֶת דִּמְ/כֶ֤ם לְ/נַפְשֹֽׁתֵי/כֶם֙ אֶדְרֹ֔שׁ מִ/יַּ֥ד כָּל חַיָּ֖ה אֶדְרְשֶׁ֑/נּוּ וּ/מִ/יַּ֣ד הָֽ/אָדָ֗ם מִ/יַּד֙ אִ֣ישׁ אָחִ֔י/ו אֶדְרֹ֖שׁ אֶת נֶ֥פֶשׁ הָֽ/אָדָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/005.yaml
  text: And surely I will require your blood for your lives[a]. From the hand of every beast I will require it[e][d][c][b], and from the hand of man—from the hand of each man's brother—I will require the life of the man.
translation:
  language: te
  text: అయితే మీ ప్రాణరక్తం విషయంలో నేను తప్పక లెక్క అడుగుతాను.[a] ప్రతి జంతువు చేతినుండి దాని గురించి లెక్క అడుగుతాను; మనిషి చేతినుండి కూడా—ప్రతి మనిషి తన సోదరుని చేతినుండి కూడా—మనిషి ప్రాణం విషయంలో లెక్క అడుగుతాను.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “మీ ప్రాణాల కొరకు మీ రక్తాన్ని నేను అడుగుతాను.” ఇక్కడ “రక్తం” జీవంతో ముడిపడిన రక్తాన్ని సూచిస్తుంది; “మీ ప్రాణరక్తం విషయంలో” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “చేతినుండి” అనేది చేసినవాని బాధ్యతను సూచించే హీబ్రూ నుడికారం. “ప్రతి జంతువునూ ... ప్రతి మనిషినీ లెక్క అడుగుతాను” అని భావానువాదం చేయవచ్చు.
    reason: idiom_clarification
  - marker: c
    text: అక్షరార్థంగా, “ఒక మనిషి చేతినుండి, అతని సోదరుని చేతినుండి.” ఇక్కడ “సోదరుడు” తోటి మానవుని సూచించవచ్చు; అయితే మూలంలోని బంధుత్వ భాషను ప్రధాన పాఠ్యంలో నిలిపాము.
    reason: ambiguity_preservation
lexical_decisions:
- source_word: וְאַךְ
  choice: అయితే ... తప్పక
  rationale: וְ యొక్క అనుసంధానాన్ని ‘అయితే’ తెలియజేస్తుంది; אַךְ లోని నిశ్చయార్థక బలాన్ని ‘తప్పక’ సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: דִּמְכֶם לְנַפְשֹׁתֵיכֶם
  choice: మీ ప్రాణాల నిమిత్తం మీ రక్తానికి
  rationale: దָּם ‘రక్తం’, נֶפֶשׁ ‘ప్రాణం’ అనే రెండు వేరు మూలపదాలను నిలుపుతూ, לְ సంబంధాన్ని ‘నిమిత్తం’తో వ్యక్తం చేసింది. ‘ప్రాణరక్తం’ కంటే ఇది మూలంలోని పదభేదాన్ని స్పష్టంగా కాపాడుతుంది.
- source_word: אֶדְרֹשׁ
  choice: లెక్క అడుగుతాను
  rationale: ఈ రక్తపాత సందర్భంలో דרשׁ న్యాయపరంగా జవాబు లేదా లెక్క కోరడాన్ని సూచిస్తుంది. ‘కోరుతాను’ కంటే ‘లెక్క అడుగుతాను’ ఉద్దేశాన్ని సాధారణ పాఠకునికి స్పష్టంగా అందిస్తుంది.
- source_word: מִיַּד
  choice: చేతినుండి
  rationale: హీబ్రూ నుడికారంలోని ‘చేతినుండి’ అనే రూపాన్ని, అలాగే బాధ్యతను సూచించే పునరుక్త నిర్మాణాన్ని నిలిపింది.
- source_word: כָּל חַיָּה
  choice: ప్రతి జంతువు
  rationale: ఇక్కడ חַיָּה మనిషికి భిన్నమైన జంతువును సూచిస్తుంది. ‘ప్రతి జీవి’ అనడం వల్ల మనుషులు కూడా అర్థంలో చేరే అవకాశం ఉండటంతో ‘ప్రతి జంతువు’ ఎంచుకుంది.
- source_word: אִישׁ אָחִיו
  choice: ప్రతి మనిషి సోదరుడు
  rationale: ‘ఒక మనిషి—అతని సోదరుడు’ అనే బంధుత్వ భాషను కాపాడుతూ దాని పంపిణీయ భావాన్ని ‘ప్రతి మనిషి సోదరుడు’గా తెలిపింది; ‘తోటి మనిషి’ అనేది సాధ్యమైన భావానువాదం అయినా మూలంలోని సోదరత్వ రూపకాన్ని తొలగిస్తుంది.
- source_word: נֶפֶשׁ הָאָדָם
  choice: మనిషి ప్రాణం
  rationale: రక్తపాత సందర్భంలో נֶפֶשׁ శరీరానికి వేరైన ‘ఆత్మ’ను ప్రధానంగా సూచించకుండా జీవప్రాణాన్ని సూచిస్తుంది; అందువల్ల ‘ప్రాణం’ ఎంచుకుంది.
theological_decisions:
- issue: రక్తపాత సందర్భంలో נֶפֶשׁ అర్థం
  choice: ప్రాణం
  alternative: ఆత్మ
  rationale: ఈ వాక్యంలో రక్తం, ప్రాణం పరస్పర సంబంధంలో ఉండి మానవజీవాన్ని తీసినందుకు బాధ్యతను పేర్కొంటాయి. ‘ఆత్మ’ అనడం మూలం ఇక్కడ ముందుకు తేవని శరీర–ఆత్మ విభజన భావాన్ని కలిగించవచ్చు.
- issue: אִישׁ אָחִיו లోని సోదరత్వ భాష
  choice: ప్రతి మనిషి సోదరుడు
  alternative: తోటి మనిషి
  rationale: బాధ్యత మానవులందరికీ వర్తించవచ్చనే భావాన్ని మూసివేయకుండా, మూలంలోని ‘సోదరుడు’ అనే ఉద్దేశపూర్వక బంధుత్వ పదాన్ని ప్రధాన పాఠ్యంలో నిలిపింది; విస్తృత భావాన్ని పాదటిప్పణిలో తెలిపింది.
- issue: జంతువుకు, మనిషికి రక్తపాత బాధ్యత
  choice: రెండింటి విషయంలోనూ ‘లెక్క అడుగుతాను’ అనే న్యాయపరమైన భాష
  alternative: ప్రతీకారం తీర్చుకుంటాను
  rationale: דרשׁ లెక్క కోరడాన్ని తెలియజేస్తుంది; శిక్ష స్వరూపాన్ని వాక్యం స్పష్టంగా నిర్దేశించదు. కాబట్టి ‘ప్రతీకారం’ వంటి అదనపు నిర్ధారణను చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన న్యాయపరమైన ధోరణి పాటించబడింది. ‘లెక్క అడుగుతాను’ సాధారణ పాఠకునికి సహజంగా ఉండి, హీబ్రూ క్రియలోని బాధ్యత కోరే భావాన్ని అందిస్తుంది. మూలంలోని ‘చేతినుండి’ అనే పునరుక్తి మరియు ‘సోదరుడు’ అనే బంధుత్వ భాష ఉద్దేశపూర్వకంగా నిలిపబడ్డాయి.
