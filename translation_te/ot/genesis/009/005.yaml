    text: అక్షరార్థంగా, “మీ ప్రాణాల కొరకు మీ రక్తాన్ని నేను అడుగుతాను.” ఇక్కడ “రక్తం” జీవంతో ముడిపడిన రక్తాన్ని సూచిస్తుంది; “మీ ప్రాణరక్తం విషయంలో” అని కూడా అనువదించవచ్చు.
