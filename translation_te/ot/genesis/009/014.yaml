  text: וְ/הָיָ֕ה בְּ/עַֽנְנִ֥/י עָנָ֖ן עַל הָ/אָ֑רֶץ וְ/נִרְאֲתָ֥ה הַ/קֶּ֖שֶׁת בֶּ/עָנָֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/014.yaml
  text: And when I bring clouds over the earth[a], the bow will be seen in the cloud,
translation:
  language: te
  text: నేను భూమిమీద మేఘాలను కమ్మించినప్పుడు, మేఘంలో ఆ విల్లు[a] కనిపిస్తుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వానవిల్లు.’ హీబ్రూలో ఇక్కడ సాధారణంగా ఆయుధమైన విల్లుకు వాడే పదమే ఉంది; ఈ సందర్భంలో అది నిబంధనకు సూచకమైన వానవిల్లును సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: చేసినప్పుడు
  rationale: ఈ నిర్మాణం భవిష్యత్తులో సంభవించే కాలసంబంధ పరిస్థితిని పరిచయం చేస్తుంది; తెలుగులో ‘చేసినప్పుడు’ సహజంగా ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: בְּעַנְנִי עָנָן
  choice: నేను ... మేఘాలు కమ్మేలా చేసినప్పుడు
  rationale: ענן క్రియకు ఇక్కడ మేఘాలతో కమ్మడం అనే causative/denominative భావం ఉంది. ఏకవచన నామవాచకం సమూహార్థకంగా ఉండగలదు కాబట్టి సహజ తెలుగులో ‘మేఘాలు’ అని ఇచ్చాం.
- source_word: עַל הָאָרֶץ
  choice: భూమిమీద
  rationale: ప్రళయ నిబంధన యొక్క విశ్వవ్యాప్త సందర్భానికి ‘భూమి’ సరిపోతుంది; ‘దేశం’ అనే పరిమిత భావాన్ని నివారిస్తుంది.
- source_word: וְנִרְאֲתָה
  choice: కనిపిస్తుంది
  rationale: ראה యొక్క నిఫాల్ రూపంలోని ‘కనిపించు/చూడబడుట’ భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: הַקֶּשֶׁת
  choice: ఆ విల్లు
  rationale: קשת యొక్క సాధారణ అర్థం ‘విల్లు.’ నిర్దిష్టతను ‘ఆ’ తెలియజేస్తుంది; సందర్భంలో ఇది నిబంధన సూచకమైన వానవిల్లును సూచిస్తుంది.
- source_word: בֶּעָנָן
  choice: మేఘంలో
  rationale: మూలంలోని నిర్దిష్ట ఏకవచనాన్ని నేరుగా నిలుపుతుంది.
theological_decisions:
- issue: నోవహు నిబంధన సందర్భంలో קשת అనువాదం
  choice: ఆ విల్లు
  alternative: వానవిల్లు
  rationale: మూల హీబ్రూ ఆయుధమైన విల్లుకు వాడే సాధారణ పదాన్నే ఉపయోగిస్తుంది. ‘విల్లు’ అని ఉంచడం ఆ పదచిత్రాన్ని కాపాడుతుంది; సందర్భార్థమైన ‘వానవిల్లు’ను పాదసూచిక స్పష్టం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. మూలంలోని విల్లు అనే పదచిత్రం నిలుపుతూ, దాని సందర్భార్థాన్ని పాదసూచికలో వివరించాం.
