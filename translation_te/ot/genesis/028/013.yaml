revisions:
- from: 'ఇదిగో, యెహోవా దాని పైన నిలబడి[a] ఇలా అన్నాడు: “నేను యెహోవాను, నీ తండ్రి అబ్రాహాము దేవుణ్ణి, ఇస్సాకు దేవుణ్ణి. నీవు పడుకొని ఉన్న ఈ దేశాన్ని నీకూ నీ సంతానానికీ[b] ఇస్తాను.”'
  to: 'ఇదిగో, యాహ్వే దాని పైన నిలిచి ఉన్నాడు[a]; ఆయన ఇలా అన్నాడు: “నేను యాహ్వేను, నీ తండ్రియైన అబ్రాహాము దేవుడను, ఇస్సాకు దేవుడను. నీవు పడుకొని ఉన్న భూమిని నీకూ నీ సంతానానికీ[b] ఇస్తాను.”'
  rationale: The revision aligns the divine-name transliteration with the POB audit trail, corrects the Telugu predicate grammar, uses “భూమి” for the promised land, and keeps the source ambiguity concerning the referent of עָלָיו in footnote a. It does not introduce doctrinal interpretation or resolve Abraham’s designation beyond the Hebrew wording.
