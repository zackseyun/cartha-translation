id: GEN.28.13
reference: Genesis 28:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הִנֵּ֨ה יְהוָ֜ה נִצָּ֣ב עָלָי/ו֮ וַ/יֹּאמַר֒ אֲנִ֣י יְהוָ֗ה אֱלֹהֵי֙ אַבְרָהָ֣ם אָבִ֔י/ךָ וֵ/אלֹהֵ֖י יִצְחָ֑ק הָ/אָ֗רֶץ אֲשֶׁ֤ר אַתָּה֙ שֹׁכֵ֣ב עָלֶ֔י/הָ לְ/ךָ֥ אֶתְּנֶ֖/נָּה וּ/לְ/זַרְעֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/013.yaml
  text: And behold[a], Yahweh was standing above it, and he said, “I am Yahweh, the God of Abraham your father and the God of Isaac[b]. The land on which you are lying I will give to you and to your offspring.”
translation:
  language: te
  text: 'ఇదిగో, యాహ్వే దాని పైన నిలిచి ఉన్నాడు[a]; ఆయన ఇలా అన్నాడు: “నేను యాహ్వేను, నీ తండ్రియైన అబ్రాహాము దేవుడను, ఇస్సాకు దేవుడను. నీవు పడుకొని ఉన్న భూమిని నీకూ నీ సంతానానికీ[b] ఇస్తాను.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “అతని పక్కన” లేదా “అతని పైన.” ఇక్కడి సర్వనామం మెట్లదారిని కాక యాకోబును సూచిస్తే ఈ అర్థం వస్తుంది.
    reason: alternative_reading
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా “నీ విత్తనానికి”; ఇది సమష్టిగా సంతానాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: హీబ్రూ కథనంలోని దృష్టిని ఆకర్షించే, దృశ్యానికి సజీవతనిచ్చే సూచనను సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దేవుని వ్యక్తిగత నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో స్థిరంగా వాడుకలో ఉన్న లిప్యంతరీకరణతో అందిస్తుంది.
- source_word: נִצָּב
  choice: నిలబడి
  rationale: దర్శనంలో కొనసాగుతున్న స్థితిని సూచించే హీబ్రూ కృదంత భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: עָלָיו
  choice: దాని పైన
  rationale: సమీప సందర్భంలోని మెట్లదారిని సర్వనామ సూచ్యంగా తీసుకుంటుంది; యాకోబును సూచించే అవకాశాన్ని పాదసూచికలో ఉంచి అస్పష్టతను కాపాడుతుంది.
- source_word: אֱלֹהֵי אַבְרָהָם אָבִיךָ
  choice: నీ తండ్రి అబ్రాహాము దేవుణ్ణి
  rationale: ‘తండ్రి’ అనే హీబ్రూ బంధుత్వ పదాన్ని పితరుడు అనే విస్తృత వంశార్థంలోనూ అర్థం చేసుకోగలిగేలా, మూల నిర్మాణానికి దగ్గరగా ఉంచుతుంది.
- source_word: הָאָרֶץ
  choice: ఈ దేశాన్ని
  rationale: పితరులకు చేసిన వాగ్దాన సందర్భంలో הָאָרֶץ కేవలం కిందనున్న నేలను కాక వాగ్దాన దేశాన్ని సూచిస్తుంది; తెలుగు వాక్యంలో సూచిత భూమిని సహజంగా గుర్తించేందుకు ‘ఈ’ వాడబడింది.
- source_word: שֹׁכֵב עָלֶיהָ
  choice: నీవు పడుకొని ఉన్న
  rationale: ప్రస్తుతం కొనసాగుతున్న చర్యను, అలాగే ఆ దేశంతో ఉన్న స్థానిక సంబంధాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: לְךָ אֶתְּנֶנָּה
  choice: నీకూ … ఇస్తాను
  rationale: వాగ్దాన సందర్భంలోని అసంపూర్ణ క్రియకు భవిష్యత్ భావాన్ని ఇస్తుంది; కర్మ ముందే స్పష్టంగా ఉన్నందున అదనపు సర్వనామం అవసరం లేదు.
- source_word: וּלְזַרְעֶךָ
  choice: నీ సంతానానికీ
  rationale: זֶרַע లోని సమష్టి ఏకవచన భావాన్ని సహజ తెలుగులో ‘సంతానం’ నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠం దైవనామాన్ని నేరుగా వాడుతుంది; దానిని బిరుదుగా మార్చకుండా వ్యక్తిగత నామంగా ఉంచబడింది.
- issue: עָלָיו సర్వనామం సూచించేది
  choice: మెట్లదారి—‘దాని పైన’
  alternative: యాకోబు—‘అతని పక్కన’ లేదా ‘అతనికి పైన’
  rationale: తక్షణ పూర్వపదం మెట్లదారి కావడం వల్ల ప్రధాన పాఠంలో దానినే తీసుకున్నాం; అయితే హీబ్రూ రూపం యాకోబును సూచించే అవకాశాన్నీ అనుమతిస్తుంది కాబట్టి పాదసూచికలో భద్రపరిచాం.
- issue: אָבִיךָ ద్వారా అబ్రాహాముకు ఇచ్చిన బంధుత్వ వర్ణన
  choice: నీ తండ్రి అబ్రాహాము
  alternative: నీ పితరుడైన అబ్రాహాము
  rationale: హీబ్రూ ‘నీ తండ్రి’ అని నేరుగా చెబుతుంది; వంశపూర్వికుని ‘తండ్రి’గా పిలిచే విస్తృత సెమిటిక్ ప్రయోగాన్ని వివరణతో భర్తీ చేయకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘ఇదిగో’ మూలంలోని దృశ్య సజీవతను నిలుపుతుంది; ‘నీవు’ సాధారణ సంభాషణకన్నా కొద్దిగా ఉన్నతమైనా సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే రూపం.
