id: GEN.28.4
reference: Genesis 28:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/יִֽתֶּן לְ/ךָ֙ אֶת בִּרְכַּ֣ת אַבְרָהָ֔ם לְ/ךָ֖ וּ/לְ/זַרְעֲ/ךָ֣ אִתָּ֑/ךְ לְ/רִשְׁתְּ/ךָ֙ אֶת אֶ֣רֶץ מְגֻרֶ֔י/ךָ אֲשֶׁר נָתַ֥ן אֱלֹהִ֖ים לְ/אַבְרָהָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/004.yaml
  text: May he give you the blessing of Abraham[a], to you and to your offspring with you, so that you may possess the land of your sojournings[b], which God gave to Abraham.
translation:
  language: te
  text: ఆయన అబ్రాహాము ఆశీర్వాదాన్ని నీకూ, నీతోపాటు నీ సంతానానికీ అనుగ్రహించుగాక. దేవుడు అబ్రాహాముకు ఇచ్చిన, నీవు పరదేశిగా నివసించే దేశాన్ని నీవు స్వాధీనం చేసుకోవడానికి ఆయన దానిని నీకు అనుగ్రహించుగాక.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: లేదా “వారసత్వంగా పొందడానికి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִתֶּן
  choice: అనుగ్రహించుగాక
  rationale: ఆశీర్వాద సందర్భంలోని జుస్సివ్ భావాన్ని కోరిక లేదా ప్రార్థనగా సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בִּרְכַּת אַבְרָהָם
  choice: అబ్రాహాము ఆశీర్వాదం
  rationale: హీబ్రూ నిర్మాణాన్ని స్పష్టంగా నిలుపుతూ అబ్రాహాముతో ముడిపడిన నిబంధనా వాగ్దాన ప్రతిధ్వనిని కాపాడుతుంది.
- source_word: לְךָ וּלְזַרְעֲךָ אִתָּךְ
  choice: నీకూ, నీతో ఉన్న నీ సంతానానికీ
  rationale: ‘నీతో’ అనే హీబ్రూ పదబంధాన్ని తొలగించకుండా ఉంచి, זֶרַע యొక్క సమూహార్థాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לְרִשְׁתְּךָ
  choice: నీవు స్వాధీనం చేసుకునేలా
  rationale: לְ ఉపసర్గతో ఉన్న క్రియానామం తెలిపే ఉద్దేశం లేదా ఫలితాన్ని చూపుతుంది; భూమి సందర్భంలో ‘స్వాధీనం చేసుకోవడం’ ప్రత్యక్ష భావాన్ని ఇస్తుంది.
- source_word: אֶרֶץ מְגֻרֶיךָ
  choice: నీవు పరదేశిగా నివసిస్తున్న దేశం
  rationale: మాగూర్‌లోని తాత్కాలిక నివాసం లేదా పరదేశ నివాస భావాన్ని అసహజమైన పదశః రూపం లేకుండా స్పష్టంగా తెలియజేస్తుంది.
- source_word: אֲשֶׁר נָתַן אֱלֹהִים לְאַבְרָהָם
  choice: దేవుడు అబ్రాహాముకు ఇచ్చిన
  rationale: సంబంధవాచక ఉపవాక్యాన్ని నేరుగా, సహజంగా అనువదిస్తుంది.
theological_decisions:
- issue: అబ్రాహామీయ వాగ్దానంలోని నిబంధనా భావం
  choice: ‘అబ్రాహాము ఆశీర్వాదం’ అనే స్పష్టమైన పదబంధాన్నీ, దేశాన్ని స్వాధీనం చేసుకునే భాషనూ నిలుపుకోవడం
  alternative: ‘అబ్రాహాముకు వాగ్దానం చేసిన ఆశీర్వాదం’ అని విపులీకరించడం లేదా ‘వారసత్వంగా పొందడం’ అని అనువదించడం
  rationale: వచనం అబ్రాహాముతో సంబంధమున్న ఆశీర్వాదాన్నీ దేశ వాగ్దానాన్నీ నేరుగా కలుపుతుంది. అనువాదం ఆ సంబంధాన్ని నిలుపుతుంది; అయితే ירש‌కు సాధ్యమైన వారసత్వ భావాన్ని ప్రధాన పాఠ్యంలో బలవంతంగా నిర్ధారించకుండా పాదసూచికలో సూచిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన ఆశీర్వాద శైలిని ఉపయోగించాం. తెలుగు వాక్యప్రవాహం సహజంగా ఉండేందుకు ఉద్దేశ ఉపవాక్యాన్ని ముందుకు మార్చాం; మూలంలోని ‘నీతో’ మరియు పరదేశ నివాస భావాలను నిలిపాం.
