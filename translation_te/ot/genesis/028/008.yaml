lexical_decisions:
- source_word: וַיַּרְא
  choice: గ్రహించాడు
  rationale: మూల క్రియకు ప్రాథమిక అర్థం ‘చూశాడు’; అయితే ఇక్కడ ముందున్న సంఘటనలనుబట్టి ఏశావు ఒక విషయాన్ని తెలుసుకున్నాడనే భావం ఉంది. సహజమైన ఆధునిక తెలుగులో ‘గ్రహించాడు’ ఆ సందర్భార్థాన్ని స్పష్టంగా తెలియజేస్తుంది.
