- source_word: בְּעֵינֵי
  choice: దృష్టిలో
  rationale: ‘కళ్లలో’ అనే పదశః రూపం కంటే, అభిప్రాయం లేదా అంచనాను సూచించే ఈ హీబ్రూ నుడికారానికి ‘దృష్టిలో’ సహజమైన తెలుగు సమానం.
- source_word: יִצְחָק אָבִיו
  choice: తన తండ్రి ఇస్సాకు
  rationale: సంబంధాన్ని అసందిగ్ధంగా ఉంచుతూ తెలుగులో సహజమైన పదక్రమాన్ని అనుసరించాం.
