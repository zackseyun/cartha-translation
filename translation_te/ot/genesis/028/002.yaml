language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: ק֥וּם לֵךְ֙ פַּדֶּ֣נָֽ/ה אֲרָ֔ם בֵּ֥יתָ/ה בְתוּאֵ֖ל אֲבִ֣י אִמֶּ֑/ךָ וְ/קַח לְ/ךָ֤ מִ/שָּׁם֙ אִשָּׁ֔ה מִ/בְּנ֥וֹת לָבָ֖ן אֲחִ֥י אִמֶּֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/002.yaml
  text: Arise[a], go to Paddan-aram, to the house of Bethuel, your mother's father, and take for yourself from there a wife from the daughters of Laban, your mother's brother.
translation:
  language: te
  text: లేచి, పద్దన్-అరాముకు, నీ తల్లి తండ్రియైన బెతూయేలు ఇంటికి వెళ్లి, అక్కడి నుండి నీ తల్లి సహోదరుడైన లాబాను కుమార్తెలలో ఒకరిని నీ కోసం భార్యగా తీసుకో.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత సహజంగా, ‘నీ మాతామహుడైన బెతూయేలు ఇంటికి’ మరియు ‘నీ మేనమామ లాబాను కుమార్తెలలో ఒకరిని’ అని అనువదించవచ్చు. ప్రధాన పాఠ్యం హీబ్రూలోని బంధుత్వ వ్యక్తీకరణలను మరింత స్పష్టంగా నిలుపుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֥וּם
  choice: లేచి
  rationale: קום ఆజ్ఞారూపం ‘లేచు/లేచి’ అనే భావాన్ని ఇస్తుంది. తరువాతి ‘వెళ్లి’తో సహజమైన తెలుగు ఆజ్ఞా క్రమంగా ఉంటుంది.
- source_word: לֵךְ֙
  choice: వెళ్లి
  rationale: הלך ఆజ్ఞారూపానికి సాధారణమైన, సహజమైన తెలుగు పదం.
- source_word: פַּדֶּ֣נָֽה אֲרָ֔ם
  choice: పద్దన్-అరాముకు
  rationale: స్థలనామాన్ని లిప్యంతరీకరించి, దిశను సూచించే ה־కు తెలుగు ‘కు’తో వ్యక్తపరిచాం.
- source_word: בֵּ֥יתָ/ה בְתוּאֵ֖ל
  choice: బెతూయేలు ఇంటికి
  rationale: దిశార్థక రూపంతో కూడిన בית నిర్మాణాన్ని సహజ తెలుగులో గమ్యస్థానంగా తెలిపింది.
- source_word: אֲבִ֣י אִמֶּ֑/ךָ
  choice: నీ తల్లి తండ్రియైన
  rationale: హీబ్రూ బంధుత్వ వ్యక్తీకరణను ‘నీ తల్లి తండ్రి’గా స్పష్టంగా నిలుపుతుంది; ‘మాతామహుడు’ అనే సంక్షిప్త ప్రత్యామ్నాయాన్ని ప్రధాన పాఠ్యంలో పెట్టలేదు.
- source_word: וְ/קַח לְ/ךָ֤
  choice: నీ కోసం ... తీసుకో
  rationale: לקחకు ‘తీసుకో’; לְךָలోని వ్యక్తిగత ప్రయోజన భావాన్ని ‘నీ కోసం’గా నిలిపాం.
- source_word: מִ/שָּׁם֙
  choice: అక్కడ
  rationale: తెలుగు వాక్యనిర్మాణంలో వివాహ భాగస్వామిని ఆ స్థలంలోనుంచి ఎంచుకోవడం ‘అక్కడ ... కుమార్తెలలో’ ద్వారా సహజంగా వ్యక్తమవుతుంది.
- source_word: אִשָּׁ֔ה
  choice: భార్యగా
  rationale: వివాహ సందర్భంలో אשהకు ‘భార్య’ సరైన సందర్భార్థం; ‘గా’ తీసుకోవడం వల్ల ఏర్పడే సంబంధాన్ని తెలుపుతుంది.
- source_word: מִ/בְּנ֥וֹת לָבָ֖ן
  choice: లాబాను కుమార్తెలలో ఒకరిని
  rationale: מן యొక్క విభాగార్థాన్ని తెలుగులో ‘కుమార్తెలలో ఒకరిని’గా స్పష్టంగా, సహజంగా తెలిపాం.
- source_word: אֲחִ֥י אִמֶּֽ/ךָ
  choice: నీ తల్లి సహోదరుడైన
  rationale: హీబ్రూ ‘నీ తల్లి సహోదరుడు’ అనే బంధుత్వ నిర్మాణాన్ని ప్రధాన పాఠ్యంలో నిలిపాం; ‘మేనమామ’ను పాదటిప్పణిలో సహజ ప్రత్యామ్నాయంగా ఇచ్చాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి. హీబ్రూ ఆజ్ఞల క్రమాన్ని నిలుపుతూ, తెలుగు సహజత్వం కోసం అనుసంధాన క్రియారూపాలు వాడబడ్డాయి. బంధుత్వ పదబంధాలు మూలానికి దగ్గరగా ఉంచి, సహజ సంక్షిప్త పదాలను పాదటిప్పణిలో ఇచ్చాం.
