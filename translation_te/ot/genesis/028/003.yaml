source:
  edition: WLC
  text: וְ/אֵ֤ל שַׁדַּי֙ יְבָרֵ֣ךְ אֹֽתְ/ךָ֔ וְ/יַפְרְ/ךָ֖ וְ/יַרְבֶּ֑/ךָ וְ/הָיִ֖יתָ לִ/קְהַ֥ל עַמִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/003.yaml
  text: And may God Almighty bless you[a], and make you fruitful, and multiply you[b], so that you may become an assembly of peoples.
translation:
  language: te
  text: సర్వశక్తిమంతుడైన దేవుడు నిన్ను ఆశీర్వదించి,[a] నిన్ను ఫలవంతునిగా చేసి, విస్తరింపజేసి, నిన్ను జనాంగాల సమాజంగా చేయుగాక.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హెబ్రీలో: “ఏల్ షద్దాయి.” సంప్రదాయంగా “సర్వశక్తిమంతుడైన దేవుడు” అని అనువదిస్తారు.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵל שַׁדַּי
  choice: సర్వశక్తిమంతుడైన దేవుడు
  rationale: దైవ బిరుదును లిప్యంతరీకరించకుండా అర్థానువాదం చేశాం. ఇది ఆధునిక తెలుగులో సహజంగా ఉండి, אֵל (‘దేవుడు’), שַׁדַּי అనే బిరుదు రెండింటినీ ప్రతిబింబిస్తుంది.
- source_word: יְבָרֵךְ
  choice: ఆశీర్వదించుగాక
  rationale: ఆశీర్వాద సందర్భంలోని జస్సివ్ భావాన్ని సాధారణ భవిష్యత్తుగా కాక, కోరిక-ప్రార్థనగా తెలియజేస్తుంది.
- source_word: וְיַפְרְךָ
  choice: నీవు ఫలించేలా చేయుగాక
  rationale: פרה యొక్క హిఫీల్ causative భావాన్ని తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: וְיַרְבֶּךָ
  choice: నీవు విస్తరించేలా చేయుగాక
  rationale: సంఖ్యలో, ముఖ్యంగా సంతానంలో, పెరుగుదల అనే causative భావాన్ని సందర్భానుగుణంగా తెలియజేస్తుంది.
- source_word: וְהָיִיתָ
  choice: అవుదువుగాక
  rationale: ఆశీర్వాద క్రమంలో కొనసాగుతున్న ఆశాభావాన్ని నిలుపుతుంది; మూలంలోని సంబంధాన్ని కఠినంగా ఉద్దేశార్థంగా మాత్రమే నిర్ణయించదు.
- source_word: לִקְהַל עַמִּים
  choice: అనేక జనసమూహాలకు సమాజంగా
  rationale: קהל లోని సమీకృత సమాజ భావాన్ని ‘సమాజం’ తెలియజేస్తుంది; עַמִּים బహువచనాన్ని ‘జనసమూహాలు’గా నిలుపుతుంది.
theological_decisions:
- issue: אֵל שַׁדַּי అనే దైవ బిరుదు అనువాదం
  choice: సర్వశక్తిమంతుడైన దేవుడు
  alternative: ఏల్ షద్దాయి
  rationale: ఇది వ్యక్తినామం కంటే దైవ బిరుదుగా పనిచేస్తున్నందున ప్రధాన పాఠ్యంలో అర్థానువాదం చేశాం; మూల హెబ్రీ రూపాన్ని పాదసూచికలో ఉంచాం.
- issue: וְהָיִיתָ యొక్క సంబంధం
  choice: అవుదువుగాక
  alternative: తద్వారా నీవు ... అవుదువుగాక
  rationale: మూలంలోని వావ్-కతల్ ఆశీర్వాద ఫలితాన్ని సూచించవచ్చు; అయితే స్పష్టమైన ఉద్దేశార్థాన్ని బలవంతంగా చేర్చకుండా సమన్వయార్థాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన ఆశీర్వాద శైలిని ఉపయోగించాం. ‘చేయుగాక’, ‘అవుదువుగాక’ రూపాలు జస్సివ్/ఆశాభావాన్ని స్పష్టంగా తెలియజేస్తాయి. పాఠ్యంలో ఉన్న [a] గుర్తు సంబంధిత పాదసూచికతో సరిపోతుంది.
