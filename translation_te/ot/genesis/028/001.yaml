translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభమైన కథన శైలి. ‘కనాను కుమార్తెలు’ అనే మూలభాషా జాతీయ/వంశీయ ప్రయోగం తెలుగులో అర్థవంతంగా ఉండటంతో ప్రధాన పాఠ్యంలో నిలుపబడింది; అదనపు పాదటిప్పణి అవసరం లేదు.
