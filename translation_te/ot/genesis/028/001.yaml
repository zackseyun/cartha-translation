  text: וַ/יִּקְרָ֥א יִצְחָ֛ק אֶֽל יַעֲקֹ֖ב וַ/יְבָ֣רֶךְ אֹת֑/וֹ וַ/יְצַוֵּ֨/הוּ֙ וַ/יֹּ֣אמֶר ל֔/וֹ לֹֽא תִקַּ֥ח אִשָּׁ֖ה מִ/בְּנ֥וֹת כְּנָֽעַן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/001.yaml
  text: Then Isaac called Jacob and blessed him and commanded him[a], saying, “You shall not take a wife from the daughters of Canaan.”
translation:
  language: te
  text: 'అప్పుడు ఇస్సాకు యాకోబును పిలిచి, అతణ్ణి ఆశీర్వదించి, అతనికి ఇలా ఆజ్ఞాపించాడు: “నీవు కనాను కుమార్తెలలో ఎవరినీ పెళ్లి చేసుకోకూడదు.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: పిలిచి
  rationale: קרא + אֶל ఇక్కడ ఒక వ్యక్తిని పిలవడాన్ని సూచిస్తుంది. ‘పిలిచి’ సహజమైన ఆధునిక తెలుగు కథన రూపం; సందర్భం కోరనంత అధికారిక భావాన్ని జోడించదు.
- source_word: וַיְבָרֶךְ
  choice: ఆశీర్వదించి
  rationale: ברך అనే ప్రామాణిక ‘ఆశీర్వదించు’ అర్థాన్ని నేరుగా నిలుపుతుంది.
- source_word: וַיְצַוֵּהוּ
  choice: అతనికి ... ఆజ్ఞాపించాడు
  rationale: צוה అధికారంతో ఆదేశించడాన్ని సూచిస్తుంది. తండ్రి ఇచ్చిన నిషేధాత్మక ఆజ్ఞ బలాన్ని ‘ఆజ్ఞాపించాడు’ స్పష్టంగా నిలుపుతుంది.
- source_word: וַיֹּאמֶר לוֹ
  choice: ఇలా
  rationale: తెలుగులో ‘అతనితో చెప్పి’ అని మరో సమాన క్రియను చేర్చకుండా, ప్రత్యక్ష వాక్యాన్ని సహజంగా ప్రవేశపెట్టేందుకు ‘ఇలా’ వాడబడింది; చెప్పిన విషయం తరువాతి ఉద్ధరణలో స్పష్టంగా ఉంది.
- source_word: לֹא תִקַּח
  choice: పెళ్లి చేసుకోకూడదు
  rationale: నిషేధార్థక అసంపూర్ణ క్రియారూపంలోని ఆజ్ఞ బలాన్ని ఆధునిక తెలుగులో ‘చేసుకోకూడదు’ సహజంగా తెలియజేస్తుంది.
- source_word: אִשָּׁה
  choice: పెళ్లి చేసుకో
  rationale: ఈ వివాహ సందర్భంలో אִשָּׁה ‘భార్య’ అనే భావంలో ఉంది. ‘భార్యగా తీసుకో’ కంటే ‘పెళ్లి చేసుకో’ ఆధునిక తెలుగులో సహజంగా అదే అర్థాన్ని ఇస్తుంది.
- source_word: מִבְּנוֹת כְּנָעַן
  choice: కనాను కుమార్తెలలో ఎవరినీ
  rationale: హీబ్రూ పదబంధంలోని ‘కనాను కుమార్తెలు’ అనే మూల రూపకల్పనను నిలుపుతూ, מִן యొక్క ఎంపిక/సమూహార్థాన్ని మరియు నిషేధ పరిధిని తెలుగులో సహజంగా ‘లో ఎవరినీ’తో వ్యక్తం చేస్తుంది.
- source_word: וַ
  choice: అప్పుడు
  rationale: కథన క్రమాన్ని సూచించే ప్రారంభ waw-consecutive ను ఆధునిక తెలుగులో ‘అప్పుడు’ సహజంగా వ్యక్తం చేస్తుంది.
