translation:
  language: te
  text: యాకోబు తన తండ్రి, తల్లి మాట విని పద్దన్-అరాముకు వెళ్లాడనీ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: మాటను విని
  rationale: שׁמע అనే క్రియ אֶל తో వచ్చినప్పుడు ఒకరి మాట వినడం, దాన్ని ఆలకించి అనుసరించడం అనే భావాలను కలిగి ఉంటుంది. సందర్భంలో యాకోబు తల్లిదండ్రుల ఆదేశాన్ని పాటిస్తున్నాడు; ‘మాటను విని’ అనే రూపం వినడం, విధేయత చూపడం అనే రెండు ఛాయలనూ సహజంగా నిలుపుతుంది.
- source_word: אֶל אָבִיו וְאֶל אִמּוֹ
  choice: తన తండ్రి మాటను, తన తల్లి మాటను
  rationale: హీబ్రూలో ప్రతి తల్లిదండ్రి ముందు אֶל పునరావృతమై, ఇద్దరినీ విడివిడిగా స్పష్టపరుస్తుంది. తెలుగులో క్రియతో సహజ అన్వయం కోసం ‘మాటను’ చేర్చి, రెండు స్వామ్యరూపాలనూ నిలిపాం.
- source_word: וַיֵּלֶךְ
  choice: వెళ్లాడనీ
  rationale: הלך యొక్క సాధారణ అర్థం ‘వెళ్లు’. ఈ వచనం ముందరి వాక్య నిర్మాణంపై ఆధారపడినందున, అనుసంధానాన్ని తెలుగులో ‘-నీ’ రూపంతో నిలిపాం.
- source_word: פַּדֶּנָה אֲרָם
  choice: పద్దన్-అరాముకు
  rationale: ఇది స్థలనామం కాబట్టి అనువదించకుండా లిప్యంతరీకరించాం. פַּדֶּנָה లోని దిశాసూచక ప్రత్యయాన్ని తెలుగు చతుర్థీ విభక్తి ‘-కు’ ద్వారా వ్యక్తం చేశాం.
- source_word: וַ
  choice: -నీ / సంయోజక అనుసంధానం
  rationale: ఈ వాక్యం ముందరి సందర్భంలో వరుసగా పేర్కొనబడే విషయాల్లో ఒకటి. తెలుగు సహజ వాక్యనిర్మాణంలో ఆ అనుసంధానం ‘అనీ/నీ’ ద్వారా వ్యక్తమవుతుంది.
