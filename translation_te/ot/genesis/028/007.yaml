translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. మూల వచనం ముందరి వాక్యంపై వ్యాకరణపరంగా ఆధారపడుతున్నందున చివర ‘వెళ్లాడనీ’ అని ఉంచి ఆ అసంపూర్ణ అనుసంధానాన్ని నిలిపాం. స్థలనామాన్ని ‘పద్దన్-అరాము’గా లిప్యంతరీకరించాం.
