translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి వాడబడింది. హెబ్రీ వాక్యంలోని వంశసంబంధ అన్వయాలు నిలుపుతూ, పఠన సౌలభ్యం కోసం ప్రధాన క్రియలను రెండు వాక్యాలుగా విభజించాం. ‘అరామీయుడైన’ అనే విశేషణం మూలంలో ఉన్నట్లే బెతూయేలును సూచించే స్థానంలో ఉంచబడింది.
