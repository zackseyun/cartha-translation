source:
  edition: WLC
  text: וַ/יִּשְׁלַ֤ח יִצְחָק֙ אֶֽת יַעֲקֹ֔ב וַ/יֵּ֖לֶךְ פַּדֶּ֣נָֽ/ה אֲרָ֑ם אֶל לָבָ֤ן בֶּן בְּתוּאֵל֙ הָֽ/אֲרַמִּ֔י אֲחִ֣י רִבְקָ֔ה אֵ֥ם יַעֲקֹ֖ב וְ/עֵשָֽׂו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/005.yaml
  text: So Isaac sent Jacob away[a], and he went to Paddan-aram, to Laban son of Bethuel the Aramean, the brother of Rebekah, the mother of Jacob and Esau.
translation:
  language: te
  text: అప్పుడు ఇస్సాకు యాకోబును పంపివేశాడు. అతడు పద్దన్-అరాముకు, అరామీయుడైన[a] బెతూయేలు కుమారుడైన లాబాను వద్దకు వెళ్లాడు. ఆ లాబాను యాకోబు, ఏశావుల తల్లి రిబ్కా సోదరుడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, పాత అనువాద సంప్రదాయం ప్రకారం, ‘సిరియనుడైన.’ హెబ్రీ పదం మరింత నిర్దిష్టంగా అరామీయుడిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: పంపివేశాడు
  rationale: ఈ సందర్భంలో שׁלח ఒకరిని ప్రయాణానికి పంపడాన్ని సూచిస్తుంది; ‘పంపివేశాడు’ పంపడం మరియు బయలుదేరే భావం రెండింటినీ సహజంగా తెలియజేస్తుంది.
- source_word: וַיֵּלֶךְ
  choice: అతడు ... వెళ్లాడు
  rationale: הלך అనే సాధారణ ‘వెళ్లు’ క్రియను కథన క్రమం స్పష్టంగా ఉండే ఆధునిక తెలుగులో అనువదించింది.
- source_word: פַּדֶּנָה אֲרָם
  choice: పద్దన్-అరాముకు
  rationale: స్థలనామాన్ని లిప్యంతరీకరించి, హెబ్రీ దిశార్థక ప్రత్యయాన్ని తెలుగు ‘-కు’ ద్వారా తెలిపింది.
- source_word: בֶּן בְּתוּאֵל
  choice: బెతూయేలు కుమారుడు
  rationale: హెబ్రీ పుత్రసంబంధ నిర్మాణానికి సహజమైన, సూటియైన తెలుగు రూపం.
- source_word: הָאֲרַמִּי
  choice: అరామీయుడైన
  rationale: అరామీయ జాతి/ప్రాంత సంబంధాన్ని చారిత్రకంగా ఖచ్చితంగా సూచిస్తుంది; సంప్రదాయ ‘సిరియనుడు’ కంటే మూలపదానికి దగ్గరగా ఉంది.
- source_word: אֲחִי רִבְקָה
  choice: రిబ్కా సోదరుడు
  rationale: సంబంధాన్ని స్పష్టంగా, సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אֵם יַעֲקֹב וְעֵשָׂו
  choice: యాకోబు ఏశావుల తల్లి
  rationale: రిబ్కాను గుర్తించే హెబ్రీ వివరణాత్మక అన్వయాన్ని సంక్షిప్తంగా, స్పష్టంగా నిలుపుతుంది.
