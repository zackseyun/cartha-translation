id: GEN.28.18
reference: Genesis 28:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּשְׁכֵּ֨ם יַעֲקֹ֜ב בַּ/בֹּ֗קֶר וַ/יִּקַּ֤ח אֶת הָ/אֶ֨בֶן֙ אֲשֶׁר שָׂ֣ם מְרַֽאֲשֹׁתָ֔י/ו וַ/יָּ֥שֶׂם אֹתָ֖/הּ מַצֵּבָ֑ה וַ/יִּצֹ֥ק שֶׁ֖מֶן עַל רֹאשָֽׁ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/018.yaml
  text: Jacob rose early in the morning[a], took the stone that he had placed at his head, set it up as a pillar[c][b], and poured oil on its top.
translation:
  language: te
  text: యాకోబు తెల్లవారుజామునే లేచి, తాను తల దగ్గర పెట్టుకున్న రాయిని తీసి, దాన్ని స్తంభంగా నిలబెట్టి[a], దాని పైభాగం మీద[b] నూనె పోశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నిలువురాయిగా నిలబెట్టి.”
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “దాని తల మీద.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכֵּם ... בַּבֹּקֶר
  choice: తెల్లవారుజామునే లేచి
  rationale: క్రియలోని ‘పెందలకడనే లేవడం’ అనే భావాన్ని, בַּבֹּקֶר అనే కాలసూచనను సహజమైన ఆధునిక తెలుగులో కలిపి వ్యక్తం చేస్తుంది.
- source_word: הָאֶבֶן
  choice: రాయిని
  rationale: నిర్దిష్ట ఏకవచన నామవాచకాన్ని నేరుగా అనువదిస్తుంది.
- source_word: אֲשֶׁר שָׂם מְרַאֲשֹׁתָיו
  choice: తాను తల దగ్గర పెట్టుకున్న
  rationale: మునుపటి రాత్రి యాకోబు తన తలవైపు ఉంచుకున్న రాయిని సూచిస్తుంది. మూలంలో స్పష్టంగా లేని ‘తలకింద’ అనే భావాన్ని చేర్చకుండా ‘తల దగ్గర’ అని అనువదించబడింది.
- source_word: וַיָּשֶׂם אֹתָהּ מַצֵּבָה
  choice: దాన్ని స్తంభంగా నిలబెట్టి
  rationale: రాయిని నిలువుగా ఉంచిన చర్యను, అది స్తంభంగా ఏర్పడిన ఫలితాన్ని రెండింటినీ స్పష్టంగా తెలియజేస్తుంది.
- source_word: מַצֵּבָה
  choice: స్తంభం
  rationale: నిలబెట్టిన రాయి లేదా రాతి స్తంభం అనే అర్థాన్ని సంక్షిప్తంగా ఇస్తుంది; ‘నిలువురాయి’ అనే ప్రత్యామ్నాయం పాదసూచికలో ఉంచబడింది.
- source_word: וַיִּצֹק שֶׁמֶן
  choice: నూనె పోశాడు
  rationale: మూలపాఠంలోని చర్యను నేరుగా వర్ణిస్తుంది. ‘అభిషేకించాడు’ అని అనువదిస్తే మూలంలో ప్రత్యక్షంగా లేని ఆచారపరమైన వ్యాఖ్యానం చేరుతుంది.
- source_word: עַל רֹאשָׁהּ
  choice: దాని పైభాగం మీద
  rationale: అక్షరార్థంగా ‘దాని తల మీద’; నిర్జీవ వస్తువును గురించి సహజ తెలుగులో ‘పైభాగం మీద’ అని చెప్పడం భావాన్ని స్పష్టంగా కాపాడుతుంది.
theological_decisions:
- issue: מַצֵּבָהను నిలబెట్టడం, దానిపై నూనె పోయడం అనే చర్యల ఆచారపరమైన ప్రాధాన్యం
  choice: తరువాతి ధార్మిక మూల్యాంకనాన్ని చేర్చకుండా చర్యలను వర్ణనాత్మకంగా అనువదించడం
  alternative: ‘జ్ఞాపకార్థ రాయి’ లేదా ‘దాన్ని అభిషేకించాడు’ అని వ్యాఖ్యానాత్మకంగా అనువదించడం
  rationale: ఈ వచనం యాకోబు చేసిన పనులను మాత్రమే వివరిస్తుంది. నిలువురాళ్ల గురించి ఇతర సందర్భాల్లో కనిపించే అనుకూల లేదా ప్రతికూల మూల్యాంకనాన్ని ఇక్కడ ముందుగానే మోపకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. హెబ్రీలోని వరుస క్రియల వేగాన్ని తెలుగులో ఒకే కర్తకు అనుసంధానించిన క్రియల శ్రేణితో నిలుపుకుంది.
