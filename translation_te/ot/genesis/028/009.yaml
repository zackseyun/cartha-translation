  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֵּ֥לֶךְ עֵשָׂ֖ו אֶל יִשְׁמָעֵ֑אל וַ/יִּקַּ֡ח אֶֽת מָחֲלַ֣ת בַּת יִשְׁמָעֵ֨אל בֶּן אַבְרָהָ֜ם אֲח֧וֹת נְבָי֛וֹת עַל נָשָׁ֖י/ו ל֥/וֹ לְ/אִשָּֽׁה־־׀־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/009.yaml
  text: So Esau went to Ishmael and took Mahalath[a], the daughter of Ishmael son of Abraham, the sister of Nebaioth, as a wife for himself in addition to his wives.
translation:
  language: te
  text: ఏశావు ఇష్మాయేలు వద్దకు వెళ్లి, అబ్రాహాము కుమారుడైన ఇష్మాయేలు కుమార్తెను, నెబాయోతు సహోదరియైన మహలతును, తన భార్యలకు అదనంగా తనకు భార్యగా తీసుకున్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלֶךְ עֵשָׂו אֶל־יִשְׁמָעֵאל
  choice: ఏశావు ఇష్మాయేలు దగ్గరికి వెళ్లి
  rationale: הלך అనే క్రియ కథనంలోని తదుపరి చర్యను సూచిస్తుంది; వ్యక్తి వద్దకు వెళ్లడాన్ని తెలుగులో సహజంగా చెప్పేందుకు ‘దగ్గరికి వెళ్లి’ అని అనువదించాం.
- source_word: וַיִּקַּח
  choice: తీసుకున్నాడు
  rationale: לקח అనే క్రియ యొక్క ప్రాథమిక అర్థాన్ని నిలిపి ఉంచుతూ, తరువాత వచ్చే ‘భార్యగా’ అనే మాట వివాహ భావాన్ని స్పష్టం చేస్తుంది.
- source_word: מָחֲלַת
  choice: మహలతు
  rationale: వ్యక్తి పేరును ఆధునిక ప్రామాణిక తెలుగు లిప్యంతరీకరణలో ఇచ్చాం.
- source_word: בַּת יִשְׁמָעֵאל בֶּן־אַבְרָהָם אֲחוֹת נְבָיוֹת
  choice: అబ్రాహాము కుమారుడైన ఇష్మాయేలు కుమార్తె, నెబాయోతు సహోదరి అయిన
  rationale: మహలతు వంశసంబంధాన్ని, సహోదర సంబంధాన్ని మూలంలోని అన్వయక్రమానికి దగ్గరగా, తెలుగులో స్పష్టంగా తెలిపాం.
- source_word: עַל נָשָׁיו
  choice: తన భార్యలతోపాటు
  rationale: ఇక్కడ עַל స్థలార్థంలో కాక, అప్పటికే ఉన్న భార్యలకు అదనంగా మరొకరిని భార్యగా తీసుకున్న భావాన్ని తెలియజేస్తుంది.
- source_word: לוֹ לְאִשָּׁה
  choice: తనకు భార్యగా
  rationale: ఈ హీబ్రూ ప్రయోగం వివాహ ఉద్దేశం లేదా ఫలితాన్ని, అలాగే לוֹ లోని ‘తనకోసం/తనకు’ భావాన్ని వ్యక్తం చేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలిని ఉపయోగించాం. ‘భార్యగా తీసుకున్నాడు’ అనే ప్రయోగం మూలంలోని ‘తీసుకున్నాడు’ అనే క్రియను నిలిపి ఉంచుతూ వివాహార్థాన్ని స్పష్టం చేస్తుంది.
