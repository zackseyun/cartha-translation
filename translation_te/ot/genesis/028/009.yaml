- from: అందుచేత ఏశావు ఇష్మాయేలు దగ్గరికి వెళ్లి, అబ్రాహాము కుమారుడైన ఇష్మాయేలు కుమార్తె, నెబాయోతు సహోదరి అయిన మహలతును తన భార్యలతోపాటు[a] తనకు భార్యగా తీసుకున్నాడు.
  to: ఏశావు ఇష్మాయేలు వద్దకు వెళ్లి, అబ్రాహాము కుమారుడైన ఇష్మాయేలు కుమార్తెను, నెబాయోతు సహోదరియైన మహలతును, తన భార్యలకు అదనంగా తనకు భార్యగా తీసుకున్నాడు.
