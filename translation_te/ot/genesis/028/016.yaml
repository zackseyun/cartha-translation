id: GEN.28.16
reference: Genesis 28:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּיקַ֣ץ יַעֲקֹב֮ מִ/שְּׁנָת/וֹ֒ וַ/יֹּ֕אמֶר אָכֵן֙ יֵ֣שׁ יְהוָ֔ה בַּ/מָּק֖וֹם הַ/זֶּ֑ה וְ/אָנֹכִ֖י לֹ֥א יָדָֽעְתִּי׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/016.yaml
  text: Then Jacob awoke from his sleep and said[a], “Surely Yahweh is in this place, and I did not know it.”
translation:
  language: te
  text: అప్పుడు యాకోబు తన నిద్రనుండి మేల్కొని, “నిజంగా, యాహ్వే ఈ స్థలంలో ఉన్నాడు; నేను ఇది తెలియకుండిపోయాను” అని అన్నాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూలో: “నిజంగా యాహ్వే ఈ స్థలంలో ఉన్నాడు.” ఈ మాట ఈ స్థలంలో యాహ్వే సన్నిధిని యాకోబు అకస్మాత్తుగా గ్రహించినట్లు తెలియజేస్తుంది.'
    reason: The source audit trail includes a note anchored to Jacob’s speech. This Telugu note preserves its limited explanatory function and anchor without adding doctrinal interpretation.
lexical_decisions:
- source_word: וַיִּיקַץ
  choice: మేలుకొని
  rationale: ఈ క్రియ నిద్రనుండి మేల్కొనడాన్ని సూచిస్తుంది; కథన ప్రవాహంలో ‘నిద్ర మేలుకొని’ సహజంగా ఉంటుంది.
- source_word: מִשְּׁנָתוֹ
  choice: నిద్ర
  rationale: ప్రత్యయం యాకోబు నిద్రను సూచిస్తుంది; తెలుగులో ‘నిద్ర మేలుకొని’ అనే నిర్మాణంలో స్వామ్యార్థం సందర్భం నుంచే స్పష్టమవుతుంది.
- source_word: אָכֵן
  choice: నిజంగా
  rationale: ఈ నిశ్చయార్థక అవ్యయం యాకోబుకు అకస్మాత్తుగా కలిగిన దృఢమైన గ్రహింపును వ్యక్తం చేస్తుంది.
- source_word: יֵשׁ
  choice: ఉన్నాడు
  rationale: అస్తిత్వం లేదా సన్నిధిని తెలిపే పదాన్ని, వ్యక్తిగత దైవనామానికి అనుగుణంగా సహజమైన తెలుగు క్రియతో అనువదించాం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే వ్యక్తినామ రూపంలో ఉంచాం.
- source_word: בַּמָּקוֹם הַזֶּה
  choice: ఈ స్థలంలో
  rationale: యాకోబు నిద్రించి దర్శనం పొందిన నిర్దిష్ట ప్రదేశాన్ని నేరుగా, సహజంగా సూచిస్తుంది.
- source_word: וְאָנֹכִי
  choice: అది నాకు
  rationale: స్వతంత్ర సర్వనామంలోని వ్యక్తిగత ఉద్ఘాటనను తెలుగులో ‘నాకు’ ద్వారా సహజంగా వ్యక్తం చేశాం; సంధిని విరామచిహ్నంతో చూపించాం.
- source_word: לֹא יָדָעְתִּי
  choice: తెలియలేదు
  rationale: యాకోబుకు అప్పటివరకు ఆ వాస్తవం తెలియకపోవడాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; ‘అది’ మునుపటి వాక్యంలోని యెహోవా సన్నిధిని సూచిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామ అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో వ్యక్తిగత దైవనామమే ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుగా మార్చకుండా ఉంచాం; ఆధునిక ప్రామాణిక తెలుగులో సుపరిచితమైన లిప్యంతరీకరణ ‘యెహోవా’ను ఎంచుకున్నాం.
- issue: యెహోవా ఈ స్థలంలో ‘ఉన్నాడు’ అనే ప్రకటన స్వభావం
  choice: సూటిగా సన్నిధిని ప్రకటించడం
  alternative: ‘యెహోవా సన్నిధి ఈ స్థలంలో ఉంది’ అని వివరణాత్మకంగా చెప్పడం
  rationale: హీబ్రూ వాక్యం יֵשׁ יְהוָה అని నేరుగా చెబుతుంది. దాని భావాన్ని ఏదైనా నిర్దిష్ట సర్వవ్యాప్తి సిద్ధాంతంతో వివరించకుండా, యాకోబు అకస్మాత్తు గ్రహింపుగా అలాగే నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండే, గౌరవప్రదమైన కథన శైలి. మూలంలోని ఆకస్మిక గ్రహింపు మరియు ‘యెహోవా సన్నిధి—యాకోబు అజ్ఞానం’ మధ్య వ్యత్యాసం నిలుపబడింది.
