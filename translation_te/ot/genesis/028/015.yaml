id: GEN.28.15
reference: Genesis 28:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הִנֵּ֨ה אָנֹכִ֜י עִמָּ֗/ךְ וּ/שְׁמַרְתִּ֨י/ךָ֙ בְּ/כֹ֣ל אֲשֶׁר תֵּלֵ֔ךְ וַ/הֲשִׁ֣בֹתִ֔י/ךָ אֶל הָ/אֲדָמָ֖ה הַ/זֹּ֑את כִּ֚י לֹ֣א אֶֽעֱזָבְ/ךָ֔ עַ֚ד אֲשֶׁ֣ר אִם עָשִׂ֔יתִי אֵ֥ת אֲשֶׁר דִּבַּ֖רְתִּי לָֽ/ךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/015.yaml
  text: And behold[a], I am with you, and I will keep you wherever you go, and I will bring you back to this land[c][b]. For I will not leave you until I have done what I have spoken to you.
translation:
  language: te
  text: ఇదిగో, నేను నీతో ఉన్నాను. నీవు ఎక్కడికి వెళ్లినా నిన్ను కాపాడుతాను[a]. ఈ దేశానికి నిన్ను తిరిగి తీసుకొస్తాను. ఎందుకంటే, నేను నీతో చెప్పినది చేసేవరకు[b] నిన్ను విడిచిపెట్టను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నిన్ను కనిపెట్టుకొని కాపాడుతాను.”
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా, “నేను నీతో చెప్పినదాన్ని చేసేవరకు.”
    reason: literal_rendering
lexical_decisions:
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: దైవిక ప్రకటనలోని శ్రద్ధాకర్షకమైన, సజీవమైన సంభాషణ సూచనను సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: אָנֹכִי עִמָּךְ
  choice: నేను నీకు తోడుగా ఉన్నాను
  rationale: దేవుని వ్యక్తిగత సన్నిధి, సహవాసం అనే భావాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది; స్వతంత్ర సర్వనామంలోని ఉద్ఘాటనను ‘నేను’ సహజంగా మోస్తుంది.
- source_word: וּשְׁמַרְתִּיךָ
  choice: నిన్ను కాపాడుతాను
  rationale: שׁמר లోని కాపాడటం, సంరక్షించడం, కనిపెట్టుకొని ఉండటం అనే భావపరిధిని సాధారణ పాఠకునికి సహజంగా అందిస్తుంది.
- source_word: בְּכֹל אֲשֶׁר תֵּלֵךְ
  choice: నీవు ఎక్కడికి వెళ్లినా
  rationale: యాకోబు వెళ్లే ప్రతి చోటా దేవుని కాపుదల ఉంటుందనే హీబ్రూ నుడికారాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וַהֲשִׁבֹתִיךָ
  choice: నిన్ను తిరిగి తీసుకొస్తాను
  rationale: שׁוב హిఫీల్ రూపంలోని కారణార్థక భావాన్ని—తిరిగి వచ్చేలా చేయడం—తెలుగులో సహజంగా నిలుపుతుంది.
- source_word: אֶל הָאֲדָמָה הַזֹּאת
  choice: ఈ నేలకు
  rationale: אֲדָמָה ప్రాథమికంగా నేల/భూమిని సూచిస్తుంది; సందర్భంలో యాకోబు పడుకున్న ఈ ప్రదేశాన్నీ వాగ్దాన భూభాగాన్నీ సూచించే విస్తృతతను ‘నేల’ నిలుపుతుంది.
- source_word: לֹא אֶעֱזָבְךָ
  choice: నిన్ను విడిచిపెట్టను
  rationale: עזב లోని విడిచిపెట్టడం లేదా పరిత్యజించడం అనే భావాన్ని అతిగా మతపరమైన పదజాలం లేకుండా సహజంగా తెలియజేస్తుంది.
- source_word: עַד אֲשֶׁר אִם עָשִׂיתִי
  choice: నెరవేర్చేవరకు
  rationale: భవిష్యత్తులో దేవుడు తన మాటను పూర్తిగా కార్యరూపంలోకి తేవడాన్ని తెలుగులో సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אֵת אֲשֶׁר דִּבַּרְתִּי לָךְ
  choice: నేను నీతో చెప్పినదంతా
  rationale: మూలంలోని ‘చెప్పినది’ అనే పదాన్ని నిలుపుతూ, దాని వాగ్దాన సందర్భాన్ని ప్రధాన వాక్యంలోని ‘నెరవేర్చు’ ద్వారా సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: దేవుని సన్నిధి, కాపుదల, తిరిగి తీసుకురావడం, తన మాటను నెరవేర్చడం
  choice: ఈ నాలుగు హామీలను నేరుగా, వ్యక్తిగత వాగ్దానాలుగా అనువదించడం
  alternative: తరువాతి బైబిలు వాక్యాలతో పదసామ్యాన్ని పెంచేందుకు మరింత సాంప్రదాయికమైన ‘పరిత్యజించను’ వంటి పదాలను వాడడం
  rationale: వాక్యం యాకోబుకు ఇచ్చిన నిర్దిష్ట హామీలను చెబుతుంది. తరువాతి సిద్ధాంతపరమైన ప్రయోగాలను ముందుగానే చొప్పించకుండా, మూలంలోని నిబంధనాత్మక ప్రతిధ్వనిని నిలుపుతుంది.
- issue: ‘వరకు’ అనే కాలపరిమితి తర్వాత దేవుడు విడిచిపెడతాడా అనే సంభావ్య భావం
  choice: మూలంలోని עַד నిర్మాణాన్ని ‘వరకు’గా నిలుపడం
  alternative: తర్వాత కూడా దేవుడు విడిచిపెట్టడని ప్రధాన వాక్యంలో వివరణాత్మకంగా చేర్చడం
  rationale: హీబ్రూ వాక్యం హామీ నెరవేరే దాకా దేవుని నిరంతర విశ్వసనీయతను ఉద్ఘాటిస్తుంది; ఆ తర్వాతి పరిస్థితిపై అదనపు ప్రకటన చేయదు. కాబట్టి మూలంలోని ఉద్వేగాన్ని వివరణతో మార్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కానీ సాధారణ పాఠకునికి సులభమైన శైలి. ‘ఇదిగో’ మూలంలోని ప్రకటనాత్మక ఉత్సాహాన్ని నిలుపుతుంది; మిగతా వాక్యం అతిగా ప్రాచీనమైన లేదా మతశాఖాపరమైన పదజాలాన్ని నివారిస్తుంది.
