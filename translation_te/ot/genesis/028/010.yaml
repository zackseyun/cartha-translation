translation:
  language: te
  text: యాకోబు బెయేర్షెబా నుండి బయలుదేరి హారాను వైపు[a] వెళ్లాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ‘హారాను’ అనే స్థలనామానికి దిశను సూచించే ప్రత్యయం జతచేయబడింది; దీనిని ‘హారానుకు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: బయలుదేరి
  rationale: יצא ఇక్కడ ఒక స్థలం నుండి వెళ్లిపోవడాన్ని సూచిస్తుంది. ‘బయలుదేరి’ అనేది సహజమైన ఆధునిక తెలుగు ప్రయోగం; ప్రయాణం ఆరంభించిన భావాన్ని సందర్భానుగుణంగా తెలియజేస్తుంది.
- source_word: יַעֲקֹב
  choice: యాకోబు
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగులో స్థిరపడిన రూపం.
- source_word: מִבְּאֵר שָׁבַע
  choice: బెయేర్షెబా నుండి
  rationale: מִן మూలస్థానాన్ని సూచిస్తుంది; ‘నుండి’ ఆ భావాన్ని నేరుగా వ్యక్తం చేస్తుంది. בְּאֵר שֶׁבַע అనే స్థలనామాన్ని ‘బెయేర్షెబా’గా లిప్యంతరీకరించాం.
- source_word: וַיֵּלֶךְ
  choice: వెళ్లాడు
  rationale: הלך అనే సాధారణ గమన క్రియకు ‘వెళ్లాడు’ నేరమైన, సహజమైన తెలుగు సమానం; ‘ప్రయాణించాడు’ వంటి అదనపు భావాన్ని చేర్చదు.
- source_word: חָרָנָה
  choice: హారాను వైపు
  rationale: స్థలనామానికి జతైన దిశాసూచక ה ప్రత్యయం హారాను దిశగా కదలికను సూచిస్తుంది. ‘హారాను వైపు’ ఆ సూక్ష్మార్థాన్ని స్పష్టంగా నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సహజంగా అర్థమయ్యే గౌరవప్రదమైన కథనశైలి. హీబ్రూ వాక్యంలోని రెండు క్రమానుగత క్రియలను ‘బయలుదేరి … వెళ్లాడు’గా సహజంగా ప్రతిబింబించాం.
