  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/שַׁבְתִּ֥י בְ/שָׁל֖וֹם אֶל בֵּ֣ית אָבִ֑/י וְ/הָיָ֧ה יְהוָ֛ה לִ֖/י לֵ/אלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/021.yaml
  text: and I return in peace to my father's house[a], and Yahweh will be my God.
translation:
  language: te
  text: నేను క్షేమంగా నా తండ్రి ఇంటికి తిరిగి వస్తే[a], యాహ్వే నాకు దేవుడుగా ఉంటాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘శాంతితో నా తండ్రి ఇంటికి తిరిగి వస్తే.’ హీబ్రూ పదబంధం శాంతి, క్షేమం, భద్రతతో తిరిగి రావడం అనే భావాలను కలిగి ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׁבְתִּי
  choice: నేను … తిరిగి వస్తే
  rationale: שׁוב అంటే ‘తిరిగి రావడం.’ ఈ వాక్యం ముందరి వచనంలో ప్రారంభమైన షరతుతో కొనసాగుతున్నందున, తెలుగులో ‘తిరిగి వస్తే’ అని అనడం భవిష్యదర్థక షరతును సహజంగా తెలియజేస్తుంది.
- source_word: בְשָׁלוֹם
  choice: క్షేమంగా
  rationale: שָׁלוֹם అనే పదంలో శాంతి, క్షేమం, భద్రత అనే భావాలు ఉన్నాయి. ప్రయాణం ముగించి సురక్షితంగా తిరిగి రావడం అనే సందర్భార్థాన్ని ‘క్షేమంగా’ సహజంగా వ్యక్తం చేస్తుంది; విస్తృతమైన భావాన్ని పాదటిప్పణి సూచిస్తుంది.
- source_word: אֶל בֵּית אָבִי
  choice: నా తండ్రి ఇంటికి
  rationale: కుటుంబ గృహాన్ని సూచించే హీబ్రూ నిర్మాణానికి ఇది సహజమైన, సూటి తెలుగు రూపం.
- source_word: וְהָיָה
  choice: ఉంటాడు
  rationale: היה ఇక్కడ యాకోబు చేసిన ప్రమాణంలోని ఫలితాన్ని సూచిస్తుంది. తెలుగు షరతు వాక్య నిర్మాణంలో ‘ఉంటాడు’ ఆ సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పునర్నిర్మిత ఉచ్చారణను తెలుగులో లిప్యంతరీకరించింది.
- source_word: לִי לֵאלֹהִים
  choice: నాకు దేవుడై
  rationale: అక్షరార్థంగా ‘నాకు దేవునిగా’ అనే సంబంధార్థక వాక్యాన్ని సహజమైన తెలుగులో ‘నాకు దేవుడై’ అని వ్యక్తం చేసింది.
theological_decisions:
- issue: యాకోబు మాటలు యాహ్వేను షరతుతో తన దేవునిగా అంగీకరిస్తున్నాయా, లేక ప్రమాణంలో ఆయనను గుర్తిస్తున్నాయా?
  choice: ముందరి వచనాల నుంచి కొనసాగుతున్న షరతు–ఫలిత సంబంధాన్ని నిలుపుతూ ‘తిరిగి వస్తే … దేవుడై ఉంటాడు’ అని అనువదించడం.
  alternative: ‘నేను తిరిగి వస్తాను; యాహ్వే నాకు దేవుడై ఉంటాడు’ అని షరతును స్పష్టంగా చూపకుండా అనువదించడం.
  rationale: హీబ్రూ వాక్యక్రమం యాకోబు ప్రమాణంలోని షరతును కొనసాగించి, చివరి భాగాన్ని దాని ఫలితంగా చదవడానికి సహజంగా వీలు కల్పిస్తుంది. ఈ రూపం వాక్యంలోని అసౌకర్యకరమైన ధార్మిక ఉద్రిక్తతను మెత్తబరచదు; అదే సమయంలో యాకోబు అంతరంగ ఉద్దేశాన్ని మించిన నిర్ణయాన్ని ప్రకటించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘క్షేమంగా’ సాధారణ పాఠకులకు స్పష్టంగా ఉండి ప్రయాణ సందర్భానికి సరిపోతుంది. దైవనామం ‘యాహ్వే’గా లిప్యంతరీకరించబడింది. పాదటిప్పణి సూచిక ప్రధాన పాఠ్యంలో ఉంచబడింది.
