    issue: Aspect of “మొక్కుబడి చేసుకుంటూ”
    rationale: The Hebrew wayyiqtol plus cognate noun presents Jacob’s vow-making act before/with the quoted content. Telugu “చేసుకుంటూ” can imply an ongoing accompanying action; “చేసి” more naturally introduces his vow without changing its conditional content.
  - severity: low
    issue: Footnote alternative for שׁמר
    rationale: “నన్ను కనిపెట్టుకొని ఉండి” is less suitable for the passage’s elevated register. “నన్ను సంరక్షించి” gives a standard Telugu lexical alternative while preserving the protective sense.
