id: GEN.28.20
reference: Genesis 28:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּדַּ֥ר יַעֲקֹ֖ב נֶ֣דֶר לֵ/אמֹ֑ר אִם יִהְיֶ֨ה אֱלֹהִ֜ים עִמָּדִ֗/י וּ/שְׁמָרַ֨/נִי֙ בַּ/דֶּ֤רֶךְ הַ/זֶּה֙ אֲשֶׁ֣ר אָנֹכִ֣י הוֹלֵ֔ךְ וְ/נָֽתַן לִ֥/י לֶ֛חֶם לֶ/אֱכֹ֖ל וּ/בֶ֥גֶד לִ/לְבֹּֽשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/020.yaml
  text: Then Jacob made a vow[a], saying, “If God will be with me and will keep me on this way that I am going[d][c][b], and will give me bread to eat and clothing to wear,”
translation:
  language: te
  text: 'అప్పుడు యాకోబు ఒక మొక్కుబడి చేసి ఇలా అన్నాడు: “దేవుడు నాకు తోడుగా ఉండి, నేను వెళ్తున్న ఈ ప్రయాణంలో నన్ను కాపాడి[a], తినడానికి ఆహారం[b], ధరించడానికి వస్త్రం నాకు ఇస్తే—”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నన్ను సంరక్షించి.”
    reason: שׁמר అనే పదానికి కాపాడడం, సంరక్షించడం అనే సమీప భావాలు ఉన్నాయి.
  - marker: b
    text: అక్షరార్థంగా, “రొట్టె.” ఇక్కడ అది సాధారణంగా ఆహారాన్ని సూచించవచ్చు.
    reason: לֶחֶם యొక్క అక్షరార్థాన్నీ, సందర్భంలోని విస్తృత ప్రయోగాన్నీ తెలియజేస్తుంది.
lexical_decisions:
- source_word: וַיִּדַּר יַעֲקֹב נֶדֶר
  choice: యాకోబు ఒక మొక్కుబడి చేసుకుంటూ
  rationale: నדר క్రియతో దాని సమజాత నామవాచకం נֶדֶר కలిసి గంభీరమైన ప్రమాణబద్ధ ప్రతిజ్ఞను సూచిస్తాయి. ఆధునిక సాధారణ తెలుగులో ‘మొక్కుబడి చేసుకోవడం’ సహజంగా ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: לֵאמֹר
  choice: ఇలా అన్నాడు
  rationale: మొక్కుబడి మాటలను పరిచయం చేసే సహజ తెలుగు ప్రయోగం.
- source_word: אִם
  choice: ఇస్తే
  rationale: హీబ్రూ షరతును తెలుగు వాక్యనిర్మాణానికి అనుగుణంగా చివరి క్రియకు జోడించిన ‘-తే’ రూపంతో వ్యక్తం చేశాం; దాన్ని ‘ఎప్పుడు’ లేదా ‘నిశ్చయంగా’ అని మార్చలేదు.
- source_word: אֱלֹהִים עִמָּדִי
  choice: దేవుడు నాకు తోడుగా ఉండి
  rationale: దైవసాన్నిధ్యాన్ని సహజంగా, నేరుగా తెలియజేస్తుంది.
- source_word: וּשְׁמָרַנִי
  choice: నన్ను కాపాడి
  rationale: שׁמר ఇక్కడ కాపుదల, సంరక్షణ భావాలను కలిగి ఉంది; ‘కాపాడు’ సాధారణ తెలుగులో రెండింటినీ సహజంగా అందిస్తుంది.
- source_word: בַּדֶּרֶךְ הַזֶּה אֲשֶׁר אָנֹכִי הוֹלֵךְ
  choice: నేను వెళ్తున్న ఈ ప్రయాణంలో
  rationale: దారి అనే మూలచిత్రాన్ని పూర్తిగా విస్మరించకుండా, సందర్భంలో యాకోబు చేస్తున్న ప్రయాణాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: וְנָתַן לִי
  choice: నాకు ఇస్తే
  rationale: షరతు వాక్యంలోని వరుస క్రియలను తెలుగులో సహజంగా ముగిస్తూ మూలంలోని conditional forceను నిలుపుతుంది.
- source_word: לֶחֶם לֶאֱכֹל
  choice: తినడానికి ఆహారం
  rationale: לֶחֶם అక్షరార్థంగా ‘రొట్టె’; అయితే ఈ సందర్భంలో జీవనావసరమైన ఆహారాన్ని విస్తృతంగా సూచించగలదు. తెలుగు పాఠకునికి ‘ఆహారం’ సహజంగా ఉద్దేశాన్ని అందిస్తుంది.
- source_word: וּבֶגֶד לִלְבֹּשׁ
  choice: ధరించడానికి వస్త్రం
  rationale: మూలంలోని వస్త్రం–ధరించడం నిర్మాణాన్ని గౌరవప్రదమైన, స్పష్టమైన తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: యాకోబు మొక్కుబడిలోని షరతు స్వభావం
  choice: తెలుగులో ‘ఇస్తే’తో షరతును యథాతథంగా నిలుపడం
  alternative: ‘దేవుడు తప్పక తోడుగా ఉంటాడు గనుక’ లేదా ‘దేవుడు తోడుగా ఉన్నప్పుడు’
  rationale: אִם స్పష్టంగా షరతును పరిచయం చేస్తుంది. యాకోబు అనిశ్చితితో అన్నాడా, విశ్వాసంతో అన్నాడా అనే ఉద్రిక్తతను అనువాదం పరిష్కరించకుండా ఉంచాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయినా వచనానికి తగిన గౌరవప్రదమైన శైలి. ఇది తరువాతి వచనంలో కొనసాగుతున్న అసంపూర్ణ షరతు వాక్యం కాబట్టి చివర ఎమ్ డ్యాష్ ఉంచబడింది. అన్ని పాదటిప్పణి సూచికలు ప్రధాన పాఠ్యంలో ఉన్నాయి.
