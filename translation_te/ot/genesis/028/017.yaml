source:
  edition: WLC
  text: וַ/יִּירָא֙ וַ/יֹּאמַ֔ר מַה נּוֹרָ֖א הַ/מָּק֣וֹם הַ/זֶּ֑ה אֵ֣ין זֶ֗ה כִּ֚י אִם בֵּ֣ית אֱלֹהִ֔ים וְ/זֶ֖ה שַׁ֥עַר הַ/שָּׁמָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/017.yaml
  text: And he was afraid and said[a], “How awesome this place is! This is none other than the house of God[b], and this is the gate of heaven.”
translation:
  language: te
  text: 'అతడు భయపడి ఇలా అన్నాడు: “ఈ స్థలం ఎంత భయభక్తులను కలిగిస్తుందో![a] ఇది దేవుని ఇల్లు తప్ప మరొకటి కాదు; ఇదే ఆకాశ ద్వారం.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఈ స్థలం ఎంత భయంకరమైనది!” హీబ్రూ పదం భయం, బెదురు, లేదా భక్తిపూర్వక విస్మయాన్ని వ్యక్తం చేయగలదు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో, “ఆకాశాల ద్వారం.” దైవిక లోకాన్ని సూచించడానికి తెలుగులో “ఆకాశం” అనే ఏకవచన రూపం సహజంగా వాడబడుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּירָא
  choice: అతడు భయపడి
  rationale: ירא అనే క్రియ యాకోబు స్పందనలోని నిజమైన భయాన్ని తెలియజేస్తుంది. ‘భయపడి’ అనేది సహజమైన ఆధునిక తెలుగు; దానిని కేవలం భక్తిగా మార్చదు.
- source_word: מַה נּוֹרָא
  choice: ఎంత భయభక్తులు పుట్టించేదిగా ఉంది
  rationale: נוֹרָאలో భయం, విస్మయం, భక్తిపూర్వక గౌరవం అనే పరస్పర సంబంధిత భావాలు ఉన్నాయి. ఈ అనువాదం పరిశుద్ధ సన్నిధి కలిగించే భయాన్నీ భక్తినీ కలిపి ఉంచుతుంది.
- source_word: הַמָּקוֹם הַזֶּה
  choice: ఈ స్థలం
  rationale: సూచక పదబంధానికి సూటిగా, సహజమైన తెలుగు రూపం.
- source_word: אֵין זֶה כִּי אִם
  choice: ఇది ... తప్ప మరొకటి కాదు
  rationale: హీబ్రూ నుడికారం బలమైన నిర్దిష్ట గుర్తింపును సూచిస్తుంది; ఈ తెలుగు నిర్మాణం ఆ ఉద్ఘాటనను నిలుపుతుంది.
- source_word: בֵּית אֱלֹהִים
  choice: దేవుని మందిరం
  rationale: בַּיִת యొక్క ప్రాథమిక భావం ‘ఇల్లు’ అయినా, దేవునికి సంబంధించిన పవిత్ర నివాసస్థల భావాన్ని గౌరవప్రదమైన సహజ తెలుగులో ‘మందిరం’ తెలియజేస్తుంది; పాదసూచికలో అక్షరార్థం ఇవ్వబడింది.
- source_word: שַׁעַר הַשָּׁמָיִם
  choice: ఆకాశ ద్వారం
  rationale: ‘ద్వారం’ రూపకాన్ని కాపాడుతూ שָׁמַיִםను తెలుగు బైబిలు వాడుకకు సహజమైన ‘ఆకాశం’గా అందిస్తుంది; హీబ్రూలోని రూపం పాదసూచికలో సూచించబడింది.
theological_decisions:
- issue: ఏకవచన సూచనలో אֱלֹהִים అనువాదం
  choice: దేవుడు
  alternative: దేవుళ్లు
  rationale: రూపపరంగా బహువచనాకృతి ఉన్నప్పటికీ, దర్శనం మరియు నిబంధన సందర్భంలో ఇది యాకోబు దేవుణ్ణి ఏకవచనంగా సూచిస్తుంది.
- issue: పవిత్ర స్థల సందర్భంలో נוֹרָא భావఛాయ
  choice: భయభక్తులు పుట్టించేది
  alternative: భయంకరమైనది
  rationale: ఇక్కడ కేవలం ప్రమాదభీతి గానీ, సాధారణ ఆశ్చర్యం గానీ కాదు; దైవసన్నిధి కలిగించే భయం మరియు భక్తిపూర్వక విస్మయం రెండూ ఉన్నాయి. ఎంపిక చేసిన పదబంధం ఆ ఉద్వేగాన్ని నిలుపుతుంది.
- issue: בֵּית אֱלֹהִיםలో בַּיִת యొక్క రూపకం
  choice: దేవుని మందిరం
  alternative: దేవుని ఇల్లు
  rationale: ‘మందిరం’ పవిత్ర నివాసస్థల భావాన్ని సహజంగా తెలియజేస్తుంది; అయితే తరువాతి కాలపు నిర్మిత దేవాలయం ఇక్కడే ఉందని నిర్ధారించకుండా, అక్షరార్థమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి. ‘భయభక్తులు పుట్టించేది’ ద్వారా భయం–విస్మయం మధ్యనున్న హీబ్రూ భావ ఉద్వేగం నిలుపబడింది. ప్రధాన వాక్యంలో రెండు పాదసూచిక గుర్తులూ చేర్చబడ్డాయి.
