    text: బేతేలు అంటే ‘దేవుని ఇల్లు.’
    reason: స్థలనామంలోని హీబ్రూ అర్థాన్ని తెలియజేయడానికి.
lexical_decisions:
- source_word: וַיִּקְרָא אֶת שֵׁם
  choice: పేరు పెట్టాడు
  rationale: ‘పేరును పిలిచాడు’ అనే హీబ్రూ నిర్మాణం తెలుగులో సహజంగా ‘పేరు పెట్టాడు’ అని వ్యక్తమవుతుంది; నామకరణ చర్యను స్పష్టంగా తెలియజేస్తుంది.
- source_word: הַמָּקוֹם הַהוּא
  choice: ఆ స్థలానికి
  rationale: מקום అంటే ‘స్థలం’; నిర్దేశక పదాన్ని ‘ఆ’ ద్వారా నిలిపి, తెలుగు వాక్యనిర్మాణానికి అనుగుణంగా చతుర్థీ విభక్తిని ఉపయోగించాం.
- source_word: בֵּית אֵל
  choice: బేతేలు
  rationale: స్థలనామాన్ని అనువదించకుండా ప్రామాణిక తెలుగు లిప్యంతరీకరణలో ఇచ్చాం; దాని అర్థాన్ని పాదసూచికలో తెలిపాం.
- source_word: וְאוּלָם
  choice: అయితే
  rationale: ఇది తరువాత వచ్చే చారిత్రక వివరణను వ్యత్యాసంగా పరిచయం చేసే పదం; ‘అయితే’ ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: לוּז
  choice: లూజు
  rationale: స్థలనామాన్ని తెలుగు ఉచ్చారణకు అనుకూలంగా లిప్యంతరీకరించాం.
- source_word: שֵׁם הָעִיר
  choice: ఆ పట్టణం పేరు
  rationale: హీబ్రూ సంబంధ నిర్మాణాన్ని తెలుగులో సహజమైన పదక్రమంతో వ్యక్తం చేశాం.
- source_word: לָרִאשֹׁנָה
  choice: పూర్వం
  rationale: ఇక్కడ పట్టణానికి అంతకుముందున్న పేరును సూచిస్తుంది; ‘పూర్వం’ సంక్షిప్తంగా, సహజంగా ఆ కాలార్థాన్ని ఇస్తుంది.
