translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే గౌరవప్రదమైన శైలిని వాడాం. హీబ్రూ వాక్యంలోని నామకరణ భావాన్ని పదశః అసహజంగా కాకుండా సహజ తెలుగు రూపంలో ఇచ్చాం.
