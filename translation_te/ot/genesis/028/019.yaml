  text: And he called the name of that place Bethel[a], but formerly the name of the city was Luz.
translation:
  language: te
  text: అతడు ఆ స్థలానికి బేతేలు[a] అని పేరు పెట్టాడు. అయితే, ఆ పట్టణానికి పూర్వం లూజు అనే పేరు ఉండేది.
  philosophy: optimal-equivalence
  footnotes:
