id: GEN.28.22
reference: Genesis 28:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הָ/אֶ֣בֶן הַ/זֹּ֗את אֲשֶׁר שַׂ֨מְתִּי֙ מַצֵּבָ֔ה יִהְיֶ֖ה בֵּ֣ית אֱלֹהִ֑ים וְ/כֹל֙ אֲשֶׁ֣ר תִּתֶּן לִ֔/י עַשֵּׂ֖ר אֲעַשְּׂרֶ֥/נּוּ לָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/022.yaml
  text: And this stone[a], which I have set up as a pillar, will be God’s house[b], and of all that you give me I will surely give a tenth to you.
translation:
  language: te
  text: నేను నిలువురాయిగా నిలబెట్టిన ఈ రాయి దేవుని ఇల్లు[a] అవుతుంది. నీవు నాకు ఇచ్చే సమస్తంలో పదోవంతును తప్పకుండా నీకు ఇస్తాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ ‘దేవుని ఇల్లు’ అనేది దేవునికి చెందిన ఇల్లు లేదా దేవుని సన్నిధితో గుర్తింపబడిన పవిత్ర స్థలం అనే భావాన్ని కలిగి ఉండవచ్చు.
    reason: హీబ్రూ בֵּית אֱלֹהִים అనే నిర్మాణం ‘దేవుని ఇల్లు’ అని నేరుగా చెబుతుంది; ఈ సందర్భంలో రాయి, స్థలం, పవిత్ర స్థానం మధ్య సంబంధాన్ని మరింత నిర్దిష్టంగా నిర్ణయించదు.
lexical_decisions:
- source_word: מַצֵּבָה
  choice: నిలువురాయి
  rationale: నిలబెట్టబడిన రాతి స్తంభం లేదా గుర్తురాయి అనే స్పష్టమైన రూపాన్ని సహజమైన తెలుగులో నిలుపుతుంది; ‘జ్ఞాపకార్థ రాయి’ అని ఉద్దేశాన్ని అదనంగా నిర్ణయించదు.
- source_word: יִהְיֶה בֵּית אֱלֹהִים
  choice: దేవుని ఇల్లు అవుతుంది
  rationale: ‘దేవుని ఇల్లు’ అనే మూలంలోని ప్రత్యక్ష రూపకాన్ని కాపాడుతుంది; ‘మందిరం’ లేదా ‘దేవాలయం’ అని అనువదించి తరువాతి ఆలయవ్యవస్థను ఈ వచనంలోకి తీసుకురాదు.
- source_word: אֱלֹהִים
  choice: దేవుడు / దేవుని
  rationale: ముందరి సందర్భంలో యాకోబుకు ప్రత్యక్షమైన ఏకైక దేవుడే ఉద్దేశించబడ్డాడు.
- source_word: תִּתֶּן לִי
  choice: నీవు నాకు ఇచ్చే
  rationale: మొక్కుబడి సందర్భంలోని అసంపూర్ణ క్రియను సహజమైన తెలుగు సంబంధవాక్యంగా వ్యక్తపరుస్తుంది; దేవుడు ఇచ్చేదంతా అనే భావాన్ని నేరుగా నిలుపుతుంది.
- source_word: עַשֵּׂר אֲעַשְּׂרֶנּוּ
  choice: పదోవంతును తప్పకుండా ఇస్తాను
  rationale: క్రియానామం మరియు సమాపక క్రియ కలయికలోని ఉద్ఘాటనను ‘తప్పకుండా’ ద్వారా వ్యక్తపరుస్తుంది; సంస్థాగత భావం కలిగే సాంకేతిక పదాన్ని అవసరం లేకుండా నివారిస్తుంది.
- source_word: לָךְ
  choice: నీకు
  rationale: మొక్కుబడిగా ఇచ్చే పదోవంతుకు దేవుడే స్వీకర్త అని నేరుగా తెలుపుతుంది.
- source_word: הָאֶבֶן הַזֹּאת אֲשֶׁר שַׂמְתִּי
  choice: నేను ... నిలబెట్టిన ఈ రాయి
  rationale: రాయిని కేవలం ఉంచడం కాక దాన్ని నిలువుగా ప్రతిష్ఠించిన సందర్భాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: రాయి ‘దేవుని ఇల్లు’ కావడం
  choice: మూలంలోని ‘దేవుని ఇల్లు’ అనే మాటనే ఉంచి, పవిత్ర స్థలం లేదా గుర్తురాయి అనే భావాన్ని పాఠకుడే సందర్భం నుంచి గ్రహించేలా చేయడం
  alternative: రాయి స్వయంగా దేవాలయమవుతుంది; లేదా ఇది తరువాతి ఆలయాన్ని నేరుగా ప్రవచిస్తుంది
  rationale: హీబ్రూ వాక్యం బలమైన, కొంత ఉద్రిక్తతగల రూపకాన్ని వాడుతుంది. ‘మందిరం’ వంటి వివరణాత్మక పదంతో దాని అర్థాన్ని ముందే పరిమితం చేయకుండా, తరువాతి ఆలయ సిద్ధాంతాన్ని కూడా చేర్చకుండా మూలభావాన్ని నిలుపుతుంది.
- issue: పదోవంతు ఇవ్వాలనే మొక్కుబడి
  choice: దేవుడు ఇచ్చే సమస్తంలో పదోవంతును ఆయనకు తప్పకుండా ఇస్తాననే వ్యక్తిగత మొక్కుబడిగా అనువదించడం
  alternative: తరువాతి మోషే ధర్మశాస్త్రంలోని లేదా సంఘపరమైన దశమభాగ నియమంగా వివరించడం
  rationale: ఈ సందర్భం యాకోబు చేసిన మొక్కుబడిని మాత్రమే చెబుతుంది. అందువల్ల పదోవంతు మరియు ఉద్ఘాటనను నిలిపి, తరువాతి సంస్థాగత ఆచారాన్ని వెనక్కి దిగుమతి చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనా సాధారణ పాఠకునికి సులభమైన వాక్యనిర్మాణం. ‘నిలువురాయి’ concrete image‌ను, ‘దేవుని ఇల్లు’ మూలంలోని ధార్మిక ఉద్రిక్తతను కాపాడుతాయి. ‘పదోవంతు’ పారదర్శకంగా ఉండి, ‘తప్పకుండా’ హీబ్రూ ఉద్ఘాటనను తెలియజేస్తుంది.
