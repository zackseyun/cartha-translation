  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הָיָ֤ה זַרְעֲ/ךָ֙ כַּ/עֲפַ֣ר הָ/אָ֔רֶץ וּ/פָרַצְתָּ֛ יָ֥מָּ/ה וָ/קֵ֖דְמָ/ה וְ/צָפֹ֣נָ/ה וָ/נֶ֑גְבָּ/ה וְ/נִבְרֲכ֥וּ בְ/ךָ֛ כָּל מִשְׁפְּחֹ֥ת הָ/אֲדָמָ֖ה וּ/בְ/זַרְעֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/014.yaml
  text: Your offspring will be like the dust of the earth[a], and you will spread out to the west and to the east and to the north and to the south; and in you and in your offspring all the families of the earth will be blessed.
translation:
  language: te
  text: నీ సంతానం భూమి ధూళిలా ఉంటుంది. నీవు పడమటికి, తూర్పుకు, ఉత్తరానికి, దక్షిణానికి విస్తరిస్తావు. నీలోను నీ సంతానంలోను భూమిలోని కుటుంబాలన్నీ ఆశీర్వదించబడతాయి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీలోను నీ సంతానంలోను భూమిలోని కుటుంబాలన్నీ తమను తాము ఆశీర్వదించుకుంటాయి.” హెబ్రీ క్రియకు ఆత్మార్థక లేదా మధ్యమ అర్థం కూడా ఉండవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה זַרְעֲךָ
  choice: నీ సంతానం ... విస్తారమవుతుంది
  rationale: זֶרַע సమూహార్థక ఏకవచనంగా సంతతిని సూచిస్తుంది. ధూళితో చేసిన ఉపమానం సంఖ్యాపరమైన విస్తారాన్ని సూచించేందున, తెలుగులో సహజంగా అర్థమయ్యేలా ‘విస్తారమవుతుంది’ అని వ్యక్తం చేశాం.
- source_word: כַּעֲפַר הָאָרֶץ
  choice: భూమి ధూళిలా
  rationale: ఉపమానాన్ని నిలుపుతూ, הָאָרֶץ ను ఈ విశ్వవ్యాప్త వాగ్దాన సందర్భంలో ‘భూమి’గా అనువదించాం.
- source_word: וּפָרַצְתָּ
  choice: నీవు ... విస్తరిస్తావు
  rationale: פרץ లోని బయటికి చొచ్చుకొని వ్యాపించే భావాన్ని భౌగోళిక విస్తరణ సందర్భానికి తగిన సహజ తెలుగు పదంతో అందించాం.
- source_word: יָמָּה וָקֵדְמָה וְצָפֹנָה וָנֶגְבָּה
  choice: పడమటికి, తూర్పుకు, ఉత్తరానికి, దక్షిణానికి
  rationale: దిశను సూచించే హెబ్రీ ప్రత్యయాల భావాన్ని స్పష్టమైన ఆధునిక తెలుగు దిశారూపాలతో ఇచ్చాం; ఈ వరుసలో נֶגֶב దక్షిణ దిశను సూచిస్తుంది.
- source_word: וְנִבְרֲכוּ
  choice: ఆశీర్వదించబడతాయి
  rationale: Niphal రూపాన్ని ప్రధాన పాఠ్యంలో కర్మణి అర్థంగా తీసుకున్నాం. ఆత్మార్థక/మధ్యమ అర్థసాధ్యతను పాదసూచికలో నిలిపాం.
- source_word: בְךָ ... וּבְזַרְעֶךָ
  choice: నీలోనూ నీ సంతానంలోనూ
  rationale: בְ ఉపసర్గాన్ని ‘లో’తో సన్నిహితంగా ప్రతిబింబించి, ‘ద్వారా’ అనే వ్యాఖ్యానాత్మక పరిష్కారాన్ని ప్రధాన పాఠ్యంలో చేర్చలేదు.
- source_word: כָּל מִשְׁפְּחֹת הָאֲדָמָה
  choice: భూమిమీద ఉన్న కుటుంబాలన్నీ
  rationale: מִשְׁפְּחֹת ను సాధారణ పాఠకులకు సహజమైన ‘కుటుంబాలు’గా, విశ్వవ్యాప్త పరిధిని సూచించే הָאֲדָמָה ను ‘భూమిమీద ఉన్న’గా అందించాం.
theological_decisions:
- issue: పితృపురుషుల వాగ్దాన సూత్రంలో ברך యొక్క Niphal రూపం
  choice: 'కర్మణి అర్థం: ‘కుటుంబాలన్నీ ఆశీర్వదించబడతాయి’'
  alternative: 'ఆత్మార్థక/మధ్యమ అర్థం: ‘కుటుంబాలన్నీ ... తమకు ఆశీర్వాదం కలగాలని కోరుకుంటాయి’ లేదా ‘తమను తాము ఆశీర్వదించుకుంటాయి’'
  rationale: వాగ్దాన సందర్భంలో కర్మణి అర్థం సూటిగా సరిపోతుంది. అయితే హెబ్రీ రూపానికి ఆత్మార్థక లేదా మధ్యమ అర్థం కూడా సాధ్యమైనందున ఆ నిజమైన సందిగ్ధతను పాదసూచికలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. మూలంలోని సమూహార్థక ‘సంతానం,’ నాలుగు దిశలు, בְ ఉపసర్గంలోని ‘లో’ భావం నిలుపబడ్డాయి. మొదటి వాక్యంలో ఉపమానం సూచించే సంఖ్యాపరమైన విస్తారాన్ని తెలుగులో స్పష్టంగా వ్యక్తం చేశాం.
