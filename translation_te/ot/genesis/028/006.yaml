  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּ֣רְא עֵשָׂ֗ו כִּֽי בֵרַ֣ךְ יִצְחָק֮ אֶֽת יַעֲקֹב֒ וְ/שִׁלַּ֤ח אֹת/וֹ֙ פַּדֶּ֣נָֽ/ה אֲרָ֔ם לָ/קַֽחַת ל֥/וֹ מִ/שָּׁ֖ם אִשָּׁ֑ה בְּ/בָרֲכ֣/וֹ אֹת֔/וֹ וַ/יְצַ֤ו עָלָי/ו֙ לֵ/אמֹ֔ר לֹֽא תִקַּ֥ח אִשָּׁ֖ה מִ/בְּנ֥וֹת כְּנָֽעַן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/006.yaml
  text: Esau saw that Isaac had blessed Jacob and sent him to Paddan-aram to take a wife for himself from there[a], and that when he blessed him, he commanded him, saying, “You shall not take a wife from the daughters of Canaan.”
translation:
  language: te
  text: ఇస్సాకు యాకోబును ఆశీర్వదించి, అక్కడి నుంచి తనకోసం భార్యను తీసుకోవడానికి అతన్ని పద్దన్-అరాముకు పంపాడనీ, అతన్ని ఆశీర్వదించినప్పుడు, “నువ్వు కనాను కుమార్తెలలో[a] ఎవరినీ భార్యగా తీసుకోకూడదు” అని అతనికి ఆజ్ఞాపించాడనీ ఏశావు చూశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “కనానీయ స్త్రీలలో.” హీబ్రూ మూలంలో అక్షరార్థంగా “కనాను కుమార్తెలలో” అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא עֵשָׂו
  choice: ఏశావు చూశాడు
  rationale: ראה అనే క్రియ యొక్క ప్రాథమిక గ్రహణార్థాన్ని నిలుపుతూ, వాక్యంలోని విషయవాచక ఉపవాక్యాలన్నిటికీ ప్రధాన క్రియగా సహజమైన తెలుగు క్రమంలో చివర ఉంచబడింది.
- source_word: כִּי בֵרַךְ יִצְחָק אֶת־יַעֲקֹב
  choice: ఇస్సాకు యాకోబును ఆశీర్వదించాడనీ
  rationale: כִּי ఇక్కడ ఏశావు చూసిన విషయాన్ని పరిచయం చేస్తుంది; తెలుగు పరోక్ష విషయ నిర్మాణానికి అనుగుణంగా ‘అనీ’ ఉపయోగించబడింది.
- source_word: וְשִׁלַּח אֹתוֹ פַּדֶּנָה אֲרָם
  choice: అతన్ని పద్దన్-అరాముకు పంపాడనీ
  rationale: పంపడం ఆశీర్వాదంతో సమన్వయంగా ఏశావు గమనించిన గత కార్యం; గమ్యస్థాన హే భావం ‘-కు’ ద్వారా వ్యక్తమైంది.
- source_word: לָקַחַת לוֹ מִשָּׁם אִשָּׁה
  choice: అక్కడి నుంచి తనకోసం భార్యను తీసుకోవడానికి
  rationale: ఉద్దేశార్థక infinitive ను ‘-డానికి’తో, לוֹ లోని స్వప్రయోజన భావాన్ని ‘తనకోసం’తో నిలుపుతుంది.
- source_word: בְּבָרֲכוֹ אֹתוֹ
  choice: అతన్ని ఆశీర్వదించినప్పుడు
  rationale: ב prefixed infinitive construct ఇక్కడ సందర్భం లేదా సమయాన్ని సూచిస్తుంది; ‘అప్పుడు’ ఆ సంబంధాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וַיְצַו עָלָיו לֵאמֹר
  choice: ‘…’ అని అతనికి ఆజ్ఞాపించాడనీ
  rationale: צוה యొక్క ఆజ్ఞార్థాన్ని నిలుపుతూ, לֵאמֹר అనే ఉటంకింపు నిర్మాణం తెలుగులో ‘అని’ ద్వారా సహజంగా ఇవ్వబడింది.
- source_word: לֹא תִקַּח אִשָּׁה
  choice: నువ్వు … ఎవరినీ భార్యగా తీసుకోకూడదు
  rationale: రెండవ పురుష ఏకవచన నిషేధాన్ని స్పష్టంగా తెలియజేస్తుంది; ‘భార్యగా తీసుకోవడం’ వివాహ సందర్భంలో సహజమైన ఆధునిక తెలుగు.
- source_word: מִבְּנוֹת כְּנָעַן
  choice: కనాను కుమార్తెలలో ఎవరినీ
  rationale: హీబ్రూ ‘కనాను కుమార్తెలు’ అనే రూపకల్పనను నిలుపుతుంది; ‘ఎవరినీ’ నిషేధ వాక్యాన్ని తెలుగులో సంపూర్ణంగా, సహజంగా చేస్తుంది.
