translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. మూలంలోని దీర్ఘ వాక్య సంబంధం, ఆశీర్వాదం గురించిన పునరుక్తి, ప్రత్యక్ష ఆజ్ఞ అన్నీ నిలుపబడ్డాయి. స్థలనామం ‘పద్దన్-అరాము’గా లిప్యంతరీకరించబడింది.
