source:
  edition: WLC
  text: וַ/יִּפְגַּ֨ע בַּ/מָּק֜וֹם וַ/יָּ֤לֶן שָׁם֙ כִּי בָ֣א הַ/שֶּׁ֔מֶשׁ וַ/יִּקַּח֙ מֵ/אַבְנֵ֣י הַ/מָּק֔וֹם וַ/יָּ֖שֶׂם מְרַֽאֲשֹׁתָ֑י/ו וַ/יִּשְׁכַּ֖ב בַּ/מָּק֥וֹם הַ/הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/011.yaml
  text: He came to a certain place and spent the night there[a], because the sun had set. He took one of the stones of the place, put it under his head[c][b], and lay down in that place.
translation:
  language: te
  text: అతడు ఒకానొక చోటికి[a] చేరుకొని, సూర్యుడు అస్తమించినందువల్ల అక్కడ రాత్రి గడిపాడు. ఆ స్థలంలోని రాళ్లలో ఒకదాన్ని[b] తీసుకొని, దాన్ని తన తల కింద[c] పెట్టుకుని, ఆ స్థలంలో పడుకున్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూల హీబ్రూలో మొదటి ప్రస్తావనలోనే ‘ఆ స్థలం’ అని ఉంది. తెలుగులో సహజంగా ఉండటంతోపాటు ఆ ప్రదేశానికి తరువాత కలిగే ప్రాముఖ్యతను సూచించడానికి ‘ఒకానొక చోటు’ అని అనువదించాం.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘ఆ స్థలంలోని కొన్ని రాళ్లను తీసుకొని.’ బహువచనమైన ‘రాళ్లు’తో ఉన్న హీబ్రూ నిర్మాణం ఈ అర్థాన్ని కూడా అనుమతిస్తుంది; అయితే సందర్భాన్ని సాధారణంగా ఒకే రాయిని సూచించేదిగా అర్థం చేసుకుంటారు.
    reason: alternative_reading
  - marker: c
    text: ‘తల కింద’ అని అనువదించిన హీబ్రూ పదం తల ఉండే ప్రదేశాన్ని లేదా తలకు ఆధారంగా ఉండే చోటును సూచిస్తుంది; ‘తలవైపు’ అని కూడా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְגַּע
  choice: చేరుకొని
  rationale: פגע అనే క్రియకు ‘కలుసుకొను, తారసపడు, చేరుకొను’ అనే అర్థాలు ఉండవచ్చు. ప్రయాణ సందర్భంలో ఒక స్థలానికి చేరుకోవడమే ప్రధాన భావం; అనుకోకుండా తారసపడినట్టు అనవసరంగా బలపరచలేదు.
- source_word: בַּמָּקוֹם
  choice: ఒకానొక చోటికి
  rationale: హీబ్రూలో నిర్దిష్ట ఉపపదంతో ‘ఆ స్థలం’ అని ఉన్నా, ఇది కథనంలో ఆ స్థలపు మొదటి ప్రస్తావన. తరువాత దానికి కలిగే ప్రాముఖ్యతను స్వల్పంగా సూచిస్తూ సహజమైన తెలుగులో ‘ఒకానొక చోటికి’ అని అనువదించాం.
- source_word: וַיָּלֶן
  choice: రాత్రి గడిపాడు
  rationale: לון అంటే ఒక చోట రాత్రిపూట బస చేయడం. ‘రాత్రి గడిపాడు’ ఆధునిక తెలుగులో సహజంగా ఉండి, మూలభావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: כִּי בָא הַשֶּׁמֶשׁ
  choice: సూర్యుడు అస్తమించినందువల్ల
  rationale: సూర్యునితో వాడిన בוא ఇక్కడ సూర్యాస్తమయాన్ని సూచించే హీబ్రూ ప్రయోగం. כִּי ఆగి బస చేయడానికి కారణాన్ని తెలియజేస్తుంది.
- source_word: וַיִּקַּח מֵאַבְנֵי הַמָּקוֹם
  choice: ఆ స్థలంలోని రాళ్లలో ఒకదాన్ని తీసుకొని
  rationale: బహువచన నామవాచకంతో ఉన్న partitive מִן ను సందర్భానుసారం ‘రాళ్లలో ఒకదాన్ని’ అని సహజంగా అనువదించాం. అయితే ‘కొన్ని రాళ్లను’ అనే వ్యాకరణసాధ్యమైన అవగాహనను పాదసూచికలో ఉంచాం.
- source_word: מְרַאֲשֹׁתָיו
  choice: తన తల కింద
  rationale: ఈ పదం తల ఉండే ప్రదేశాన్ని లేదా తలవైపు అమర్చిన ఆధారాన్ని సూచిస్తుంది. ఈ సందర్భంలో ‘తన తల కింద’ సహజంగా ఉంది; మూలంలోని స్థలసూచక విస్తృతిని పాదసూచికలో తెలిపాం.
- source_word: וַיִּשְׁכַּב
  choice: పడుకున్నాడు
  rationale: שכב ఇక్కడ విశ్రమించడానికి ఒరిగి పడుకోవడాన్ని సూచిస్తుంది. వెంటనే నిద్రపోయాడని మూలం చెప్పేదానికంటే ముందుకు వెళ్లకుండా ‘పడుకున్నాడు’ అని ఉంచాం.
- source_word: בַּמָּקוֹם הַהוּא
  choice: ఆ స్థలంలో
  rationale: మూలంలో ‘స్థలం’ అనే పదం పునరుక్తమై, ఆ ప్రదేశపు కథన ప్రాముఖ్యతను బలపరుస్తుంది. కేవలం ‘అక్కడ’ అని కాకుండా ఈ పునరుక్తిని నిలిపాం.
