  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే, గౌరవప్రదమైన కథన శైలి. ‘స్థలం’ అనే మూలపదపు పునరుక్తిని కథన ప్రాముఖ్యత కోసం నిలిపి, నిజమైన పదార్థ సందిగ్ధతలను పాదసూచికల్లో సంరక్షించాం.
