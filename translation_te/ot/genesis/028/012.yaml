source:
  edition: WLC
  text: וַֽ/יַּחֲלֹ֗ם וְ/הִנֵּ֤ה סֻלָּם֙ מֻצָּ֣ב אַ֔רְצָ/ה וְ/רֹאשׁ֖/וֹ מַגִּ֣יעַ הַ/שָּׁמָ֑יְמָ/ה וְ/הִנֵּה֙ מַלְאֲכֵ֣י אֱלֹהִ֔ים עֹלִ֥ים וְ/יֹרְדִ֖ים בּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/012.yaml
  text: And he dreamed[a], and behold, a ladder was set up on the earth, and its top reached to heaven; and behold[b], the angels of God were ascending and descending on it.
translation:
  language: te
  text: అతడు కలగన్నాడు; ఇదిగో, భూమిపై ఒక మెట్లదారి స్థాపించబడి ఉంది, దాని పైభాగం ఆకాశం వరకు చేరుతోంది. ఇదిగో, దేవుని దూతలు దానిపై ఎక్కుతూ దిగుతూ ఉన్నారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “దానిపై” అని అనువదించిన హెబ్రీ పదబంధాన్ని “అతనిపై” అని కూడా అర్థం చేసుకోవచ్చు, అంటే యాకోబును సూచించవచ్చు. అయితే ఈ సందర్భంలో అది మెట్లదారినే సూచించడం అత్యంత సహజం. “మెట్లదారి”ని “నిచ్చెన” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative_and_alternative_reading
lexical_decisions:
- source_word: וַיַּחֲלֹם
  choice: అతడు కల కన్నాడు
  rationale: కథనాన్ని ముందుకు నడిపించే wayyiqtol రూపాన్ని సహజమైన ఆధునిక తెలుగు కథనశైలిలో వ్యక్తపరుస్తుంది.
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: కలలో అకస్మాత్తుగా ప్రత్యక్షమయ్యే దృశ్యానికి ఉన్న సజీవమైన చూపింపు బలాన్ని నిలుపుతుంది.
- source_word: סֻלָּם
  choice: మెట్లదారి
  rationale: ఈ అరుదైన హెబ్రీ పదం ఎక్కడానికి ఉపయోగించే నిర్మాణాన్ని సూచిస్తుంది; తప్పనిసరిగా కడ్డీల నిచ్చెననే నిర్దేశించదు. అనేక దూతలు ఎక్కుతూ దిగుతున్న దృశ్యానికి ‘మెట్లదారి’ సహజంగా సరిపోతుంది.
- source_word: מֻצָּב אַרְצָה
  choice: భూమి మీద ... నిలిపి ఉంది
  rationale: నిర్మాణం భూమిపై స్థిరంగా ఉంచబడిన స్థితిని, భూమి–ఆకాశం మధ్య వ్యత్యాసాన్ని వ్యక్తపరుస్తుంది.
- source_word: וְרֹאשׁוֹ מַגִּיעַ הַשָּׁמָיְמָה
  choice: దాని పైభాగం ఆకాశాన్ని చేరుతోంది
  rationale: వస్తువు యొక్క ‘తల’ అనే హెబ్రీ రూపకాన్ని సహజ తెలుగులో ‘పైభాగం’గా, కొనసాగుతున్న దృశ్యాన్ని వర్తమాన ప్రగతిశీల రూపంలో అందిస్తుంది.
- source_word: מַלְאֲכֵי אֱלֹהִים
  choice: దేవుని దూతలు
  rationale: దర్శన సందర్భంలో దేవునికి చెందిన పరలోక దూతలను సూచిస్తుంది; తెలుగు బైబిలు భాషలో స్పష్టమైన, సహజమైన పదబంధం.
- source_word: עֹלִים וְיֹרְדִים
  choice: ఎక్కుతూ దిగుతూ ఉన్నారు
  rationale: హెబ్రీ participles సూచించే కొనసాగుతున్న చలనాన్ని సజీవంగా వ్యక్తపరుస్తుంది.
- source_word: בּוֹ
  choice: దానిపై
  rationale: సమీపంలోని సహజ పూర్వపదమైన మెట్లదారినే సూచిస్తుంది; అయినా వ్యాకరణపరంగా ‘అతనిపై’ అనే భావం సాధ్యమని పాదటిప్పణిలో నిలుపబడింది.
theological_decisions:
- issue: סֻלָּם యొక్క దృశ్యరూపం
  choice: మెట్లదారి
  alternative: నిచ్చెన
  rationale: హెబ్రీ పదం ఎక్కడానికి ఉపయోగించే నిర్మాణాన్ని సూచించినా కడ్డీలతో కూడిన సన్నని నిచ్చెనకే పరిమితం చేయదు. కాబట్టి ప్రధాన పాఠ్యంలో విస్తృతమైన అర్థాన్ని ఉంచి, సంప్రదాయ ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇవ్వడం సముచితం.
- issue: בּוֹ యొక్క నిర్దేశ్యం
  choice: దానిపై
  alternative: అతనిపై
  rationale: సమీపమైన, సందర్భానికి అత్యంత సహజమైన పూర్వపదం మెట్లదారి. అయితే పుంలింగ ఏకవచన ప్రత్యయం వల్ల ‘అతనిపై’ అనే వ్యాకరణసాధ్యతను మౌనంగా తొలగించకుండా పాదటిప్పణిలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. ‘ఇదిగో’ అనే పదాన్ని దర్శనంలోని సజీవత కోసం రెండుసార్లు నిలిపాం. ప్రధాన పాఠ్యాన్ని భారంగా చేయకుండా రెండు నిజమైన అనిశ్చితులను ఒకే [a] పాదటిప్పణిలో స్పష్టం చేశాం.
