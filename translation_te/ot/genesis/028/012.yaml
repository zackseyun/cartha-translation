revisions:
- from: అతడు కల కన్నాడు. ఇదిగో, భూమి మీద ఒక మెట్లదారి నిలిపి ఉంది; దాని పైభాగం ఆకాశాన్ని చేరుతోంది. ఇదిగో, దేవుని దూతలు దానిపై ఎక్కుతూ దిగుతూ ఉన్నారు.[a]
  to: అతడు కలగన్నాడు; ఇదిగో, భూమిపై ఒక మెట్లదారి స్థాపించబడి ఉంది, దాని పైభాగం ఆకాశం వరకు చేరుతోంది. ఇదిగో, దేవుని దూతలు దానిపై ఎక్కుతూ దిగుతూ ఉన్నారు.[a]
  rationale: ప్రధాన సవరణ మֻצָּב యొక్క స్థాపిత నిష్క్రియ స్థితిని సహజ తెలుగులో తెలియజేయడానికే. మిగిలిన సవరణలు ఆధునిక ప్రామాణిక వాడుకను మెరుగుపరుస్తూ, మెట్లదారి/నిచ్చెన అనే పదార్థ పరిధిని మరియు בּוֹ యొక్క ప్రత్యామ్నాయ నిర్దేశ్యాన్ని పాదటిప్పణిలో నిలుపుతాయి. ఎటువంటి సిద్ధాంతపరమైన వివరణను చేర్చలేదు.
