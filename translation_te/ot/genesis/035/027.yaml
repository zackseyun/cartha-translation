    text: లేదా, ‘తాత్కాలిక నివాసులుగా ఉండేవారు.’ ఇక్కడి హీబ్రూ క్రియ కేవలం ఒక చోట నివసించడాన్ని కాకుండా, పరదేశిగా లేదా తాత్కాలిక నివాసిగా ఉండడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  revision_rationale: The revision corrects the appositional handling of the place names, while retaining the source's identification of Kiriath-arba with Hebron. It also makes the arrival construction more natural in modern standard Telugu and lightly streamlines the footnote without weakening its lexical explanation.
