  text: וַ/יָּבֹ֤א יַעֲקֹב֙ אֶל יִצְחָ֣ק אָבִ֔י/ו מַמְרֵ֖א קִרְיַ֣ת הָֽאַרְבַּ֑ע הִ֣וא חֶבְר֔וֹן אֲשֶׁר גָּֽר שָׁ֥ם אַבְרָהָ֖ם וְ/יִצְחָֽק־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/027.yaml
  text: And Jacob came to Isaac his father at Mamre[a], Kiriath-arba (that is, Hebron), where Abraham and Isaac had sojourned.
translation:
  language: te
  text: యాకోబు మమ్రేలోని కిర్యత్-అర్బాకు, అంటే హెబ్రోనుకు, తన తండ్రియైన ఇస్సాకు వద్దకు వచ్చాడు. అక్కడ అబ్రాహాము, ఇస్సాకు పరదేశులుగా నివసించారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘తాత్కాలిక నివాసులుగా ఉండేవారు.’ ఇక్కడి హీబ్రూ క్రియ కేవలం ఒక చోట నివసించడాన్ని కాకుండా, పరదేశిగా లేదా తాత్కాలిక నివాసిగా ఉండడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: వచ్చాడు
  rationale: בוא అనే సాధారణ గమన క్రియ ఇక్కడ ఇస్సాకు ఉన్న స్థలానికి యాకోబు చేరడాన్ని సూచిస్తుంది; సందర్భానుసారంగా ‘వచ్చాడు’ సహజంగా ఉంది.
- source_word: אֶל יִצְחָק אָבִיו
  choice: తన తండ్రి ఇస్సాకు దగ్గరికి
  rationale: దిశను, తండ్రి-కొడుకు సంబంధాన్ని స్పష్టంగా ఉంచుతూ ఆధునిక తెలుగులో సహజమైన నిర్మాణం.
- source_word: מַמְרֵא
  choice: మమ్రేకు
  rationale: స్థలనామాన్ని లిప్యంతరీకరించి, గమ్యార్థక విభక్తిని జోడించాం.
- source_word: קִרְיַת הָאַרְבַּע
  choice: కిర్యత్-అర్బాకు
  rationale: ఇది స్థలనామం కాబట్టి అనువదించకుండా లిప్యంతరీకరించాం; తరువాతి వాక్యభాగమే దానిని హెబ్రోనుగా గుర్తిస్తుంది.
- source_word: הִוא חֶבְרוֹן
  choice: అదే హెబ్రోను
  rationale: హీబ్రూ సర్వనామం మరియు స్థలనామం కిర్యత్-అర్బాను హెబ్రోనుతో గుర్తిస్తున్నాయి; ‘అదే’ ఈ వివరణాత్మక సమానత్వాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: אֲשֶׁר ... שָׁם
  choice: అక్కడ
  rationale: స్థలాన్ని సూచించే సంబంధ వాక్యాన్ని తెలుగులో సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: גָּר
  choice: పరదేశులుగా నివసించారు
  rationale: גור కేవలం నివసించడమే కాక, సొంత దేశం కాని చోట తాత్కాలిక లేదా పరదేశ నివాసిగా ఉండే భావాన్ని మోస్తుంది.
- source_word: אַבְרָהָם וְיִצְחָק
  choice: అబ్రాహాము, ఇస్సాకు
  rationale: వ్యక్తినామాలను ప్రామాణిక తెలుగు బైబిలు రూపాలకు అనుగుణంగా లిప్యంతరీకరించాం.
