translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి. స్థలనామాల మధ్య సంబంధాన్ని స్పష్టంగా ఉంచి, גור లోని పరదేశ నివాస భావాన్ని ప్రధాన పాఠ్యంలో నిలిపాం.
