translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. మూలంలోని స్థల గుర్తింపును డ్యాష్‌ల మధ్య ఉంచి, చివరి సముచ్చయ నిర్మాణాన్ని తెలుగులో అస్పష్టత లేకుండా రెండు క్రియాభాగాలతో వ్యక్తం చేశాం.
