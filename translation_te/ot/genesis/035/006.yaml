  yaml_path: translation/ot/genesis/035/006.yaml
  text: So Jacob came to Luz (that is[a], Bethel), which is in the land of Canaan, he and all the people who were with him.
translation:
  language: te
  text: యాకోబు కనాను దేశంలో ఉన్న లూజుకు—అంటే బేతేలుకు[a]—అతనితో ఉన్న వారందరితో కలిసి చేరుకున్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పాఠంలోని ‘లూజు ... అంటే బేతేలు’ అనే మాటలు ఆ స్థలపు పాత పేరునూ, తరువాత ఎక్కువగా తెలిసిన పేరునూ రెండింటినీ నిలుపుతున్నాయి.
    reason: cross_reference
lexical_decisions:
- source_word: וַיָּבֹא
  choice: చేరుకున్నాడు
  rationale: בוא అనే క్రియ ఇక్కడ గమ్యస్థానానికి రావడం లేదా చేరడాన్ని సూచిస్తుంది. తెలుగు కథనంలో ‘చేరుకున్నాడు’ గమ్యకేంద్రిత కదలికను సహజంగా తెలియజేస్తుంది.
- source_word: לוּזָה
  choice: లూజుకు
  rationale: לוז అనే స్థలనామానికి దిశను సూచించే ה జతైంది; తెలుగులో దానిని ‘-కు’ విభక్తితో వ్యక్తం చేశాం.
- source_word: אֲשֶׁר בְּאֶרֶץ כְּנַעַן
  choice: కనాను దేశంలో ఉన్న
  rationale: లూజు ఎక్కడ ఉందో తెలిపే సంబంధ వాక్యభాగాన్ని సహజమైన తెలుగు పదక్రమంలో స్థలనామానికి ముందు ఉంచాం.
- source_word: הִוא בֵּית אֵל
  choice: అంటే బేతేలు
  rationale: లూజు అనే పాత పేరుగల స్థలమే బేతేలు అని గుర్తించే వివరణాత్మక సమానాధికరణాన్ని ‘అంటే’తో స్పష్టంగా, సంక్షిప్తంగా వ్యక్తం చేశాం.
- source_word: הוּא
  choice: అతడూ
  rationale: యాకోబును తిరిగి సూచించే సర్వనామం అతనితో వచ్చిన సమూహాన్ని జతచేస్తుంది; ‘అతడూ’ ఆ పునరుక్తి మరియు సముచ్చయ భావాన్ని నిలుపుతుంది.
- source_word: וְכָל הָעָם אֲשֶׁר עִמּוֹ
  choice: అతనితో ఉన్న ప్రజలందరూ
  rationale: עָם ఇక్కడ జాతిని కాక యాకోబుతో ప్రయాణిస్తున్న మొత్తం సమూహాన్ని సూచిస్తుంది. ‘ప్రజలందరూ’ సాధారణ పాఠకులకు సహజంగా ఉండి సమూహ సంపూర్ణతను నిలుపుతుంది.
