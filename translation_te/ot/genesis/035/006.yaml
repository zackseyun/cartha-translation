revisions:
- from: కాబట్టి యాకోబు కనాను దేశంలో ఉన్న లూజుకు—అంటే బేతేలుకు[a]—చేరుకున్నాడు; అతడూ అతనితో ఉన్న ప్రజలందరూ అక్కడికి వచ్చారు.
  to: యాకోబు కనాను దేశంలో ఉన్న లూజుకు—అంటే బేతేలుకు[a]—అతనితో ఉన్న వారందరితో కలిసి చేరుకున్నాడు.
