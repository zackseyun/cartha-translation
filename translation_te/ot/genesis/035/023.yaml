source:
  edition: WLC
  text: בְּנֵ֣י לֵאָ֔ה בְּכ֥וֹר יַעֲקֹ֖ב רְאוּבֵ֑ן וְ/שִׁמְעוֹן֙ וְ/לֵוִ֣י וִֽ/יהוּדָ֔ה וְ/יִשָּׂשכָ֖ר וּ/זְבוּלֻֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/023.yaml
  text: 'The sons of Leah: Jacob’s firstborn[a], Reuben, Simeon, Levi, Judah, Issachar, and Zebulun.'
translation:
  language: te
  text: 'లేయా కుమారులు: యాకోబు తొలిపుట్టినవాడు రూబేను, సిమ్యోను, లేవి, యూదా, ఇశ్శాఖారు, జెబూలూను.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי לֵאָה
  choice: లేయా కుమారులు
  rationale: ఈ నిర్మాణబద్ధ బహువచన పదబంధం లేయాకు పుట్టిన ఆరుగురు మగ సంతానాన్ని పరిచయం చేస్తోంది; ‘కుమారులు’ సందర్భానికి నేరుగా సరిపోతుంది.
- source_word: בְּכֹר יַעֲקֹב
  choice: యాకోబు తొలిపుట్టినవాడు
  rationale: ఈ నిర్మాణ పదబంధం రూబేనును యాకోబుకు మొదట పుట్టిన కుమారునిగా గుర్తిస్తుంది. ‘తొలిపుట్టినవాడు’ మూలపదంలోని జననక్రమ భావాన్ని కాపాడుతుంది.
- source_word: רְאוּבֵן
  choice: రూబేను
  rationale: తెలుగు బైబిలు వాడుకకు అనుగుణంగా వ్యక్తినామాన్ని లిప్యంతరీకరించాం.
- source_word: שִׁמְעוֹן
  choice: షిమ్యోను
  rationale: హీబ్రూ ఉచ్చారణకు సమీపంగా వ్యక్తినామాన్ని లిప్యంతరీకరించాం.
- source_word: לֵוִי
  choice: లేవి
  rationale: తెలుగులో సుపరిచితమైన బైబిలు నామరూపాన్ని ఉపయోగించాం.
- source_word: יְהוּדָה
  choice: యూదా
  rationale: తెలుగులో సుపరిచితమైన బైబిలు నామరూపాన్ని ఉపయోగించాం.
- source_word: יִשָּׂשכָר
  choice: ఇశ్శాఖారు
  rationale: హీబ్రూ వ్యక్తినామానికి సమీపమైన, తెలుగు బైబిలు సంప్రదాయంలో గుర్తించదగిన రూపాన్ని ఉపయోగించాం.
- source_word: זְבוּלֻן
  choice: జెబూలూను
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు ఉచ్చారణకు అనుకూలంగా లిప్యంతరీకరించాం.
- source_word: וְ
  choice: జాబితాలో విరామచిహ్నాలు
  rationale: హీబ్రూలో ప్రతి పేరుకు ముందు ఉన్న సంధికారకాన్ని తెలుగులో యథాతథంగా పునరావృతం చేస్తే అసహజంగా ఉంటుంది; స్పష్టమైన జాబితా నిర్మాణంతో దాని అనుసంధాన భావాన్ని తెలిపాం.
