translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన జాబితా శైలిని పాటిస్తూ, మూలంలోని ‘యాకోబు తొలిపుట్టినవాడు—రూబేను’ అనే సమానాధికార సంబంధాన్ని నిలిపాం. వాక్యాన్ని అనవసరంగా వ్యాఖ్యానించకుండా గంభీరమైన సాధారణ భాషలో ఉంచాం.
