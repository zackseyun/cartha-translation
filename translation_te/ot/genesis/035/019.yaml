  text: So Rachel died and was buried on the way to Ephrath (that is[a], Bethlehem).
translation:
  language: te
  text: రాహేలు మరణించింది; ఎఫ్రాతాకు[a] వెళ్లే దారిలో ఆమెను పాతిపెట్టారు (అంటే, బేత్లెహేము).
  philosophy: optimal-equivalence
