    text: ఎఫ్రాతా అనే పేరును ‘ఎఫ్రాతాహ్’ అని కూడా లిప్యంతరీకరించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּמָת
  choice: చనిపోయింది
  rationale: מות అనే మూలపదం ఇక్కడ భౌతిక మరణాన్ని సూటిగా సూచిస్తుంది; ఆధునిక సాధారణ తెలుగులో ‘చనిపోయింది’ సహజమైన, స్పష్టమైన రూపం.
- source_word: רָחֵל
  choice: రాహేలు
  rationale: వ్యక్తి పేరును తెలుగులో స్థిరపడిన బైబిలు రూపంలో లిప్యంతరీకరించాం.
- source_word: וַתִּקָּבֵר
  choice: ఆమెను పాతిపెట్టారు
  rationale: קבר క్రియ యొక్క నిఫాల్ రూపం కర్మణి భావాన్ని ఇస్తుంది. తెలుగులో సహజంగా వినిపించేందుకు వ్యక్తిని తెలియని బహువచన కర్తతో ఈ భావాన్ని వ్యక్తం చేశాం; మూలంలో లేని ‘అక్కడ’ను చేర్చలేదు.
- source_word: בְּדֶרֶךְ
  choice: వెళ్లే మార్గంలో
  rationale: בְּద్వారా ఇక్కడ ప్రయాణ మార్గంలోని స్థానాన్ని సూచిస్తుంది. గమ్యస్థానంతో కలిపి ‘ఎఫ్రాతాకు వెళ్లే మార్గంలో’ అనడం సహజమైన ఆధునిక తెలుగు.
- source_word: אֶפְרָתָה
  choice: ఎఫ్రాతా
  rationale: చివరి ה దిశాసూచక ప్రత్యయంగా అర్థమవుతుంది; అందువల్ల వాక్యంలో ‘ఎఫ్రాతాకు’ అని ఇచ్చాం. ‘ఎఫ్రాతా’ అనే స్థలనామ రూపాన్ని నిలిపాం.
- source_word: הִוא
  choice: అదే
  rationale: ఈ సర్వనామం ఎఫ్రాతాను బేత్లెహేముతో గుర్తించే వివరణాత్మక సమానత్వాన్ని సూచిస్తుంది; ‘అదే’ దీనిని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: בֵּית לָחֶם
  choice: బేత్లెహేము
  rationale: స్థలనామానికి తెలుగులో విస్తృతంగా స్థిరపడిన లిప్యంతరీకరణను వాడాం.
