  source_fidelity: 'The Telugu accurately preserves the Hebrew structure and sense: the land formerly given to Abraham and Isaac is promised to Jacob, and subsequently to Jacob''s collective offspring. It retains the deliberate past-versus-future tension of נָתַתִּי followed by אֶתְּנֶנָּה/אֶתֵּן, and repeats both “land” and “give” in the final clause.'
