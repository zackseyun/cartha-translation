id: GEN.35.12
reference: Genesis 35:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אֶת הָ/אָ֗רֶץ אֲשֶׁ֥ר נָתַ֛תִּי לְ/אַבְרָהָ֥ם וּ/לְ/יִצְחָ֖ק לְ/ךָ֣ אֶתְּנֶ֑/נָּה וּֽ/לְ/זַרְעֲ/ךָ֥ אַחֲרֶ֖י/ךָ אֶתֵּ֥ן אֶת הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/012.yaml
  text: And the land that I gave to Abraham and to Isaac[a], I will give to you[b]; and to your offspring after you I will give the land.
translation:
  language: te
  text: నేను అబ్రాహాముకు, ఇస్సాకుకు ఇచ్చిన[a] దేశాన్ని నీకు ఇస్తాను; నీ తరువాత నీ సంతానానికి[b] ఆ దేశాన్ని ఇస్తాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఇప్పటికే ఇచ్చిన.”
    reason: lexical_alternative
  - marker: b
    text: “సంతానం” అని అనువదించిన హీబ్రూ పదం సమూహార్థక ఏకవచనం; దాన్ని “విత్తనం” లేదా “వంశస్థులు” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאָרֶץ
  choice: దేశం
  rationale: పితృపురుషులకు చేసిన వాగ్దాన సందర్భంలో אֶרֶץ ఒక నిర్దిష్ట భూభాగాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘దేశం’ సహజంగా ఉండి, ‘భూమి’ అనే పదానికి ఉండగల మొత్తం భూమండలం అనే అస్పష్టతను నివారిస్తుంది.
- source_word: אֲשֶׁר נָתַתִּי
  choice: ఇచ్చిన
  rationale: తెలుగు సంబంధ వాక్య నిర్మాణానికి అనుగుణంగా హీబ్రూ పరిపూర్ణ క్రియను ‘ఇచ్చిన’ అని అనువదించాం. ఇది అబ్రాహాము, ఇస్సాకులకు దేవుడు మునుపే ఇచ్చిన వాగ్దానాన్ని సూచిస్తుంది.
- source_word: לְאַבְרָהָם וּלְיִצְחָק
  choice: అబ్రాహాముకు, ఇస్సాకుకు
  rationale: హీబ్రూలో ఇద్దరి పేర్ల ముందు పునరుక్తమైన విభక్తి సూచనను తెలుగులోనూ ప్రతి పేరుకు ‘కు’ జోడించి నిలిపాం.
- source_word: לְךָ אֶתְּנֶנָּה
  choice: నీకు ఇస్తాను
  rationale: స్త్రీలింగ ఏకవచన ప్రత్యయం ముందున్న ‘దేశం’ను తిరిగి సూచిస్తుంది. తెలుగులో అనవసర పునరుక్తి లేకుండా, నిర్దిష్టమైన వ్యక్తిగత వాగ్దానాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: זַרְעֲךָ
  choice: నీ సంతానానికి
  rationale: זֶרַע సమూహార్థక ఏకవచనం. ‘సంతానం’ దాని సమూహార్థాన్ని నిలుపుతూ ఆధునిక తెలుగులో ‘విత్తనం’ కంటే సహజంగా ఉంటుంది; ‘వంశస్థులు’ అనే బహువచనం కంటే మూలంలోని ఏకవచన రూపానికి దగ్గరగా ఉంటుంది.
- source_word: אַחֲרֶיךָ
  choice: నీ తరువాత
  rationale: ఇది కాలపరంగానూ తరాల పరంపర పరంగానూ ఉన్న భావాన్ని సరళంగా నిలుపుతుంది.
- source_word: אֶתֵּן אֶת הָאָרֶץ
  choice: ఆ దేశాన్ని ఇస్తాను
  rationale: మూలంలోని ‘ఇస్తాను’, ‘దేశం’ అనే పునరుక్తిని నిలిపాం. తెలుగులో ముందే పేర్కొన్న నిర్దిష్ట దేశాన్ని సూచించేందుకు ‘ఆ’ వాడటం సహజం.
theological_decisions:
- issue: పితృపురుషులకు దేశాన్ని గతంలో ఇచ్చినట్టు చెప్పడం, యాకోబుకు మరియు అతని సంతానానికి భవిష్యత్తులో ఇస్తానని చెప్పడం మధ్య సంబంధం
  choice: మొదటి క్రియను గతకాల భావంతో ‘ఇచ్చిన’ అని, తరువాతి క్రియలను భవిష్యత్తు భావంతో ‘ఇస్తాను’ అని అనువదించాం.
  alternative: మొదటి క్రియను కొనసాగుతున్న ఫలితాన్ని నొక్కిచెప్పేలా ‘ఇప్పటికే ఇచ్చిన’ లేదా ‘ఇచ్చి ఉన్న’ అని అనువదించడం.
  rationale: హీబ్రూ వాక్యం మునుపటి దైవిక అనుగ్రహాన్ని, ఇంకా నెరవేరబోయే భవిష్యత్తు అనుగ్రహాన్ని పక్కపక్కనే ఉంచుతుంది. ఆ కాలభేదాన్ని, దానిలోని దైవశాస్త్ర సంబంధమైన ఉద్రిక్తతను అనువాదం పరిష్కరించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని ఉపయోగించాం. మూలంలోని ‘దేశం’ మరియు ‘ఇస్తాను’ పునరుక్తులను నిలిపి, తెలుగు వాక్యనిర్మాణానికి తగిన సంబంధ క్రియారూపాన్ని వాడాం.
