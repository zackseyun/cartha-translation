language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּסְעוּ֙ מִ/בֵּ֣ית אֵ֔ל וַֽ/יְהִי ע֥וֹד כִּבְרַת הָ/אָ֖רֶץ לָ/ב֣וֹא אֶפְרָ֑תָה וַ/תֵּ֥לֶד רָחֵ֖ל וַ/תְּקַ֥שׁ בְּ/לִדְתָּֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/016.yaml
  text: Then they journeyed from Bethel[a], and when there was still some distance to go before reaching Ephrath, Rachel gave birth, and she had difficulty in childbirth.
translation:
  language: te
  text: తర్వాత వారు బేతేలు నుండి బయలుదేరారు. ఎఫ్రాతుకు[a] చేరుకోవడానికి ఇంకా కొంత దూరం ఉండగా, రాహేలు ప్రసవించింది; ప్రసవం ఆమెకు కష్టమైంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఎఫ్రాతా.’
    reason: హీబ్రూ స్థలనామాన్ని ‘ఎఫ్రాతు’ అని లేదా దాని రూపాన్ని అనుసరించి ‘ఎఫ్రాతా’ అని లిప్యంతరీకరించవచ్చు.
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: ప్రయాణమై వెళ్లారు
  rationale: נסע అనే క్రియ ఇక్కడ శిబిరం విడిచి తదుపరి ప్రదేశానికి ప్రయాణించడం సూచిస్తుంది; ఈ తెలుగు రూపం కథన ప్రవాహంలో సహజంగా ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: מִבֵּית אֵל
  choice: బేతేలు నుండి
  rationale: בֵּית־אֵל అనే స్థలనామానికి ఆధునిక తెలుగు బైబిలు వాడుకకు అనుగుణమైన లిప్యంతరీకరణను ఉపయోగించాం.
- source_word: וַיְהִי עוֹד כִּבְרַת הָאָרֶץ
  choice: ఇంకా కొంత దూరం ఉండగా
  rationale: అరుదైన כִּבְרַת הָאָרֶץ పదబంధం ఖచ్చితమైన కొలతను తెలియజేయదు; అందువల్ల దాని అనిశ్చితిని కాపాడుతూ మిగిలి ఉన్న ప్రయాణ దూరాన్ని సహజంగా వ్యక్తం చేశాం.
- source_word: לָבוֹא אֶפְרָתָה
  choice: ఎఫ్రాతుకు చేరుకోవడానికి
  rationale: לָבוֹא గమ్యస్థానానికి చేరడాన్ని సూచిస్తుంది; אֶפְרָתָה లోని దిశాసూచక రూపాన్ని తెలుగులో ‘కు’ ద్వారా వ్యక్తం చేశాం.
- source_word: וַתֵּלֶד רָחֵל
  choice: రాహేలు ప్రసవించింది
  rationale: స్త్రీ కర్తతో వాడిన ילד క్రియకు ‘ప్రసవించింది’ అనేది స్పష్టమైన, సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: וַתְּקַשׁ בְּלִדְתָּהּ
  choice: ఆమెకు ప్రసవం చాలా కష్టమైంది
  rationale: קשה ఇక్కడ ప్రసవ ప్రక్రియలోని తీవ్రమైన కష్టాన్ని సూచిస్తుంది; ‘చాలా కష్టమైంది’ ఆ తీవ్రతను సహజంగా తెలుపుతుంది, మూలంలో లేని వైద్య వివరాలను చేర్చదు.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన కథన శైలిని వాడాం. అరుదైన దూరసూచక హీబ్రూ పదబంధానికి ఖచ్చితమైన కొలతను ఆపాదించకుండా దాని అస్పష్టతను నిలిపాం.
