  revision_rationale: The revision replaces an unnatural, redundant departure expression with idiomatic Telugu while retaining the source sense. It also removes a nonessential degree intensifier, preserving the Hebrew’s concise description of difficult childbirth. The uncertain remaining distance and the Ephrath/Ephrathah name alternative remain intact.
