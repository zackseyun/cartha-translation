- from: తర్వాత వారు బేతేలు నుండి ప్రయాణమై వెళ్లారు. ఎఫ్రాతుకు[a] చేరుకోవడానికి ఇంకా కొంత దూరం ఉండగా, రాహేలు ప్రసవించింది; ఆమెకు ప్రసవం చాలా కష్టమైంది.
  to: తర్వాత వారు బేతేలు నుండి బయలుదేరారు. ఎఫ్రాతుకు[a] చేరుకోవడానికి ఇంకా కొంత దూరం ఉండగా, రాహేలు ప్రసవించింది; ప్రసవం ఆమెకు కష్టమైంది.
