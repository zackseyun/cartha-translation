id: GEN.35.5
reference: Genesis 35:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּסָּ֑עוּ וַ/יְהִ֣י חִתַּ֣ת אֱלֹהִ֗ים עַל הֶֽ/עָרִים֙ אֲשֶׁר֙ סְבִיבֹ֣תֵי/הֶ֔ם וְ/לֹ֣א רָֽדְפ֔וּ אַחֲרֵ֖י בְּנֵ֥י יַעֲקֹֽב׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/005.yaml
  text: Then they set out[a], and a terror from God fell on the cities that were around them, so that they did not pursue the sons of Jacob.
translation:
  language: te
  text: వారు బయలుదేరారు. అప్పుడు వారి చుట్టుపక్కల ఉన్న పట్టణాల మీద దేవుని నుండి వచ్చిన భీతి[a] ఆవరించింది. అందువల్ల ఆ పట్టణాల ప్రజలు యాకోబు కుమారులను వెంబడించలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “దేవుని భీతి.”
    reason: חִתַּת אֱלֹהִים అనే హీబ్రూ సంయుక్త నిర్మాణానికి ఉన్న మరింత రూపసన్నిహిత ప్రత్యామ్నాయాన్ని చూపిస్తుంది.
lexical_decisions:
- source_word: וַיִּסָּעוּ
  choice: వారు బయలుదేరారు
  rationale: נסע ప్రయాణం కోసం ఒక ప్రదేశం నుండి కదలడాన్ని సూచిస్తుంది. కథన క్రమాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేయడానికి ‘బయలుదేరారు’ అనువైనది.
- source_word: וַיְהִי חִתַּת אֱלֹהִים עַל הֶעָרִים
  choice: పట్టణాల మీద దేవుని నుండి వచ్చిన భీతి ఆవరించింది
  rationale: היה + עַל యొక్క సంఘటనాత్మక భావాన్ని ‘ఆవరించింది’ సహజంగా వ్యక్తం చేస్తుంది. חִתַּת అర్థాన్ని ‘భీతి’గా, אֱלֹהִיםను ఆ భీతికి మూలంగా ప్రధాన పాఠంలో చూపిస్తుంది.
- source_word: אֲשֶׁר סְבִיבֹתֵיהֶם
  choice: వారి చుట్టుపక్కల ఉన్న
  rationale: యాకోబు బృందాన్ని చుట్టుముట్టిన సమీప పట్టణాలను స్పష్టంగా, సహజంగా గుర్తిస్తుంది.
- source_word: וְלֹא רָדְפוּ אַחֲרֵי
  choice: అందువల్ల ... వెంబడించలేదు
  rationale: רדף אחרי అనే ‘వెంటబడి తరుము’ భావాన్ని ‘వెంబడించు’ సంక్షిప్తంగా అందిస్తుంది. ముందున్న భీతికి ఫలితంగా వెంబడింపు జరగలేదనే సందర్భ సంబంధాన్ని ‘అందువల్ల’ స్పష్టం చేస్తుంది.
- source_word: הֶעָרִים ... וְלֹא רָדְפוּ
  choice: ఆ పట్టణాల ప్రజలు ... వెంబడించలేదు
  rationale: హీబ్రూలో పట్టణాలు వాటి నివాసులకు పర్యాయంగా వాడబడ్డాయి. తెలుగులో అసహజమైన ‘పట్టణాలు వెంబడించలేదు’ అనే రూపాన్ని నివారిస్తూ ఉద్దేశిత కర్తను స్పష్టం చేస్తుంది.
- source_word: בְּנֵי יַעֲקֹב
  choice: యాకోబు కుమారులను
  rationale: హీబ్రూ పదబంధంలోని స్పష్టమైన పుంలింగ కుటుంబ సంబంధాన్ని యథాతథంగా కాపాడుతుంది.
theological_decisions:
- issue: חִתַּת אֱלֹהִים అనే సంయుక్త పదబంధం యొక్క భావం
  choice: దేవుని నుండి వచ్చిన భీతి
  alternative: దేవుని భీతి; తీవ్రమైన భీతి
  rationale: సందర్భంలో ఈ భీతి దేవుని నుండి వచ్చి యాకోబు కుటుంబాన్ని కాపాడిందనే భావం సహజంగా ఉంది. అయితే హీబ్రూ సంయుక్త నిర్మాణం ‘దేవుని భీతి’ అని కూడా నేరుగా అర్థమవుతుంది; ఆ నిజమైన సందిగ్ధతను పాదసూచికలో నిలుపుతున్నాం. ‘తీవ్రమైన భీతి’ అనే అధికతార్థం సాధ్యమైనా, ఇక్కడ దేవుని కార్యాన్ని అస్పష్టం చేస్తుంది.
- issue: בְּנֵי יַעֲקֹב యొక్క లింగ సూచన
  choice: యాకోబు కుమారులు
  alternative: యాకోబు పిల్లలు
  rationale: మూలపాఠం పురుష సంతానాన్ని స్పష్టంగా సూచిస్తుంది; అందువల్ల లింగతటస్థ పదంతో దాన్ని మార్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, అయినా గంభీరతను నిలుపుతూ అనువదించబడింది. ‘భీతి’ కథనంలోని తీవ్రతకు తగిన సాహిత్యపరమైనప్పటికీ సులభంగా అర్థమయ్యే పదం. హీబ్రూలోని పట్టణాలు–నివాసులు అనే పర్యాయప్రయోగాన్ని తెలుగులో ‘ఆ పట్టణాల ప్రజలు’ అని స్పష్టం చేశాం.
