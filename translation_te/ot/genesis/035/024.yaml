  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: కుమారులు
  rationale: ఇది בֵּן అనే పదం యొక్క బహువచన నిర్మాణరూపం; ఇక్కడ వంశావళి జాబితాలో రాహేలుకు పుట్టిన ఇద్దరు మగ సంతానాన్ని పరిచయం చేస్తోంది. కాబట్టి ‘పిల్లలు’ కంటే ‘కుమారులు’ మరింత ఖచ్చితమైనది.
- source_word: רָחֵל
  choice: రాహేలు
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగులో ప్రాచుర్యంలో ఉన్న బైబిలు రూపానికి అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: יוֹסֵף
  choice: యోసేపు
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగులో ప్రాచుర్యంలో ఉన్న బైబిలు రూపానికి అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: וּבִנְיָמִן
  choice: బెన్యామీను
  rationale: ו conjunction జాబితాలో చివరి పేరును కలుపుతుంది. తెలుగులో రెండు పేర్ల జాబితాలో విరామచిహ్నంతో సహజంగా సంబంధం స్పష్టమవుతున్నందున ప్రత్యేకంగా ‘మరియు’ చేర్చలేదు; పేరును ప్రాచుర్యంలో ఉన్న తెలుగు బైబిలు రూపంలో లిప్యంతరీకరించాం.
