id: GEN.35.29
reference: Genesis 35:29
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּגְוַ֨ע יִצְחָ֤ק וַ/יָּ֨מָת֙ וַ/יֵּאָ֣סֶף אֶל עַמָּ֔י/ו זָקֵ֖ן וּ/שְׂבַ֣ע יָמִ֑ים וַ/יִּקְבְּר֣וּ אֹת֔/וֹ עֵשָׂ֥ו וְ/יַעֲקֹ֖ב בָּנָֽי/ו־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/029.yaml
  text: Then Isaac breathed his last and died[a], and was gathered to his people, old and full of days. And Esau and Jacob, his sons, buried him.
translation:
  language: te
  text: ఇస్సాకు ప్రాణం విడిచి చనిపోయాడు; వృద్ధుడై, నిండు దినాలు గడిపినవాడిగా తన ప్రజల దగ్గరికి చేర్చబడ్డాడు.[a] అతని కుమారులైన ఏశావు, యాకోబు అతన్ని పాతిపెట్టారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘తన పూర్వికుల/బంధువుల దగ్గరికి చేర్చబడ్డాడు.’ ఈ హెబ్రీ పదబంధం సంప్రదాయ మరణసూత్రం; ఇది కేవలం శరీరాన్ని పాతిపెట్టడంకంటే ఎక్కువ భావాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְוַע
  choice: ప్రాణం విడిచి
  rationale: మరణవార్తల్లో גוע ప్రాణం విడవడాన్ని సూచిస్తుంది. తరువాత వచ్చే ‘చనిపోయాడు’ అనే స్పష్టమైన క్రియతో తేడాను నిలుపుతూ, తెలుగులో సహజంగా ఉండే రూపం ఇది.
- source_word: וַיָּמָת
  choice: చనిపోయాడు
  rationale: מות మరణాన్ని తెలిపే సాధారణ క్రియ. హెబ్రీ క్రమాన్ని అనవసర వ్యాఖ్యానం లేకుండా సూటిగా నిలుపుతుంది.
- source_word: וַיֵּאָסֶף אֶל־עַמָּיו
  choice: తన ప్రజల దగ్గరికి చేర్చబడ్డాడు
  rationale: ఇది హెబ్రీలో సంప్రదాయ మరణసూత్రం. ‘తన ప్రజలు’ అనే ప్రత్యక్ష సమానార్థాన్ని నిలుపుతూ, ఇది సమాధిని, పూర్వికులతో కలయికను, లేక మరణానంతర స్థితిని సూచిస్తుందా అనే ఉద్దేశపూర్వక అస్పష్టతను పరిష్కరించకుండా ఉంచుతుంది.
- source_word: זָקֵן
  choice: వృద్ధుడై
  rationale: మరణసందర్భంలో వయస్సును గౌరవప్రదంగా, సహజమైన ఆధునిక తెలుగులో తెలిపే సూటి రూపం.
- source_word: וּשְׂבַע יָמִים
  choice: నిండు దినాలు గడిపినవాడిగా
  rationale: ‘దినాలతో నిండిన/తృప్తి చెందిన’ అనే పితృపురుషుల మరణవార్తల్లోని హెబ్రీ నుడికారాన్ని, తెలుగులో అర్థమయ్యే విధంగా దాని సాహిత్య భావాన్ని నిలుపుతూ వ్యక్తపరుస్తుంది.
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: అతన్ని పాతిపెట్టారు
  rationale: קברకు సూటిగా సరిపోయే, సాధారణ ఆధునిక తెలుగు ప్రయోగం.
- source_word: עֵשָׂו וְיַעֲקֹב בָּנָיו
  choice: అతని కుమారులైన ఏశావు, యాకోబు
  rationale: పాతిపెట్టినవారు ఎవరో స్పష్టంగా తెలుపుతూ, పేర్ల హెబ్రీ క్రమాన్ని మరియు కుమారులనే గుర్తింపును నిలుపుతుంది.
theological_decisions:
- issue: ‘తన ప్రజల దగ్గరికి చేర్చబడ్డాడు’ అనే మరణసూత్రం అర్థం
  choice: సమాధి, పూర్వికులతో కలయిక, లేదా మరణానంతర స్థితి అని నిర్దిష్టంగా చెప్పకుండా సూత్రాన్ని సాపేక్షంగా యథాతథంగా నిలుపడం.
  alternative: కుటుంబ సమాధిలో పాతిపెట్టబడ్డాడని లేదా మరణానంతరం పూర్వికులతో కలిశాడని స్పష్టంగా వ్యాఖ్యానించడం.
  rationale: హెబ్రీ వాక్యప్రయోగం కుటుంబపరమైన మరియు మతతాత్త్విక ప్రతిధ్వనులు కలిగి ఉన్నప్పటికీ వాటిలో ఒక్కదానినే నిర్బంధంగా నిర్ధారించదు. అందువల్ల మూలంలోని మతతాత్త్విక ఉద్వేగం, అస్పష్టత కాపాడబడ్డాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన మరణవార్త శైలిని ఉపయోగించాం. ‘ప్రాణం విడిచి చనిపోయాడు’ అనే రెండు క్రియలను ఉద్దేశపూర్వకంగా నిలిపి, మూలంలోని వరుసను కాపాడాం. ‘నిండు దినాలు’ అనే సాహిత్య నుడికారాన్ని సాధారణ పాఠకుడికి అర్థమయ్యేలా ‘గడిపినవాడిగా’తో కలిపాం.
