  text: Then Israel journeyed on and pitched his tent beyond Migdal-eder[a].
translation:
  language: te
  text: తరువాత ఇశ్రాయేలు ప్రయాణం కొనసాగించి, మిగ్దల్-ఏదెర్‌కు[a] అవతల తన గుడారం వేసుకున్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మిగ్దల్-ఏదెర్ అంటే ‘మంద యొక్క గోపురం.’
    reason: స్థలనామంలోని హీబ్రూ పదార్థాన్ని తెలియజేయడానికి.
lexical_decisions:
- source_word: וַיִּסַּע
  choice: అక్కడి నుండి ప్రయాణం సాగించి
  rationale: נסע అనే క్రియ శిబిరం ఎత్తి ముందుకు ప్రయాణించడాన్ని సూచిస్తుంది. కథనంలోని వరుస చర్యను సహజమైన తెలుగులో తెలియజేయడానికి ఈ రూపాన్ని ఎంచుకున్నాం.
- source_word: יִשְׂרָאֵל
  choice: ఇశ్రాయేలు
  rationale: హీబ్రూ మూలపాఠం ‘యాకోబు’కు బదులు ‘ఇశ్రాయేలు’ అనే పేరునే ఉపయోగిస్తుంది; అందువల్ల అదే పేరును నిలిపాం.
- source_word: וַיֵּט
  choice: వేసుకున్నాడు
  rationale: ‘గుడారం’తో కలిసినప్పుడు נטה అంటే గుడారం వేయడం లేదా నిలపడం. ఆధునిక తెలుగులో ‘గుడారం వేసుకున్నాడు’ సహజమైన ప్రయోగం.
- source_word: אָהֳלֹה
  choice: తన గుడారం
  rationale: אֹהֶל అంటే ‘గుడారం’; మూడవ పురుష ఏకవచన పుంలింగ ప్రత్యయం స్వామ్యాన్ని సూచిస్తుంది.
- source_word: מֵהָלְאָה
  choice: అవతల
  rationale: הלאה ఒక ప్రదేశానికి మించి లేదా మరింత ముందున్న స్థానాన్ని సూచిస్తుంది. ఇక్కడ పేర్కొన్న స్థలానికి ఆవల అనే భావాన్ని ‘అవతల’ సంక్షిప్తంగా, సహజంగా అందిస్తుంది.
- source_word: לְמִגְדַּל עֵדֶר
  choice: మిగ్దల్-ఏదెర్‌కు
  rationale: ఈ పదబంధం ఇక్కడ స్థలనామంగా పనిచేస్తుంది కాబట్టి దాన్ని లిప్యంతరీకరించాం; దాని పదార్థాన్ని పాదసూచికలో ఇచ్చాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. మూలంలోని ‘ఇశ్రాయేలు’ పేరును అలాగే నిలిపి, స్థలనామాన్ని లిప్యంతరీకరించాం.
