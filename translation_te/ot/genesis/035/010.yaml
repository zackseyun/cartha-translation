  yaml_path: translation/ot/genesis/035/010.yaml
  text: And God said to him[a], “Your name is Jacob. Your name will no longer be called Jacob, but Israel will be your name.” So he called his name Israel.
translation:
  language: te
  text: దేవుడు అతనితో, “నీ పేరు యాకోబు. ఇకపై నీ పేరు యాకోబు అని పిలువబడదు; ఇశ్రాయేలు నీ పేరు అవుతుంది” అని చెప్పాడు. అలా ఆయన అతనికి ఇశ్రాయేలు అని పేరు పెట్టాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “ఆయన అతని పేరును ఇశ్రాయేలు అని పిలిచాడు.” హెబ్రీలో అక్షరార్థంగా, “ఆయన అతని పేరును ఇశ్రాయేలు అని పిలిచాడు” అని ఉంది.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהִים
  choice: దేవుడు
  rationale: ఏకవచన క్రియారూపంతో ఉన్న ఈ సందర్భంలో ఇది ఏకైక దేవుణ్ణే సూచిస్తుంది; ఆధునిక ప్రామాణిక తెలుగులో ‘దేవుడు’ సహజమైన సమానార్థకం.
- source_word: שִׁמְךָ
  choice: నీ పేరు
  rationale: రెండవ పురుష ఏకవచన ప్రత్యయంతో ఉన్న నామవాచకానికి నేరమైన అనువాదం; మూలంలోని పునరుక్తిని భావప్రాధాన్యం కోసం నిలిపింది.
- source_word: לֹא יִקָּרֵא ... עוֹד
  choice: ఇకమీదట ... అని పిలవరు
  rationale: ‘ఇకపై అలా పిలువబడదు’ అనే నిషేధం మరియు ముగింపు భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: כִּי אִם
  choice: ; ... అనేదే
  rationale: ‘యాకోబు కాదు, ఇశ్రాయేలు’ అనే వ్యతిరేకత మరియు పేరు-మార్పు బలాన్ని తెలుగులో సహజంగా చూపిస్తుంది.
- source_word: יִשְׂרָאֵל יִהְיֶה שְׁמֶךָ
  choice: ఇశ్రాయేలు అనేదే నీ పేరు అవుతుంది
  rationale: కొత్త పేరుపై హెబ్రీ వాక్యంలో ఉన్న ప్రాధాన్యాన్ని నిలుపుతూ తెలుగులో స్పష్టంగా ఉంటుంది.
- source_word: וַיִּקְרָא אֶת־שְׁמוֹ יִשְׂרָאֵל
  choice: అలా ఆయన అతనికి ఇశ్రాయేలు అని పేరు పెట్టాడు
  rationale: హెబ్రీ నామకరణ సూత్రాన్ని సహజమైన తెలుగులో అందిస్తుంది; ‘అలా’ ముందున్న దేవుని ప్రకటనకు అనుసంధానంగా నామకరణ చర్యను చూపిస్తుంది.
- source_word: יַעֲקֹב
  choice: యాకోబు
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: יִשְׂרָאֵל
  choice: ఇశ్రాయేలు
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
theological_decisions:
- issue: పాత పేరు తరువాతి కథనంలో మళ్లీ కనిపించినప్పటికీ, దేవుని పేరు-మార్పు ప్రకటన బలాన్ని ఎలా అనువదించాలి
  choice: ఇకమీదట నీ పేరును యాకోబు అని పిలవరు; ఇశ్రాయేలు అనేదే నీ పేరు అవుతుంది
  alternative: ఇకమీదట నీ పేరు యాకోబు కాదు; నీ పేరు ఇశ్రాయేలు
  rationale: హెబ్రీ ప్రకటనలోని సంపూర్ణ పేరు-మార్పు బలాన్ని తగ్గించకుండా ఉంచుతుంది; తరువాతి కథనంలో ‘యాకోబు’ పేరు కొనసాగడాన్ని సమన్వయపరచే వివరణను వాక్యంలో చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయినా దైవిక నామకరణ ప్రకటనకు తగిన గంభీరతతో రూపొందించబడింది. ‘పిలువబడదు’ అనే భారమైన కర్మణి రూపానికి బదులు సహజమైన అనిర్దిష్ట కర్త రూపం ‘పిలవరు’ వాడబడింది.
