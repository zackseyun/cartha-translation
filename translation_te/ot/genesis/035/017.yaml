translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన కథనశైలిని ఉపయోగించాం. మూలంలోని ‘ఇతడు కూడా’ అనే చేర్పు భావాన్ని ‘మరొక కుమారుడు’గా విస్తరించకుండా అలాగే ఉంచాం.
