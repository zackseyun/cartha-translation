  yaml_path: translation/ot/genesis/035/017.yaml
  text: And when her labor was hard[a], the midwife said to her, “Do not fear[b], for this also is a son for you.”
translation:
  language: te
  text: ఆమె ప్రసవవేదన తీవ్రమవుతున్నప్పుడు, మంత్రసాని ఆమెతో, “భయపడకు; ఎందుకంటే ఇతడు కూడా నీకు కుమారుడే” అని చెప్పింది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי בְהַקְשֹׁתָהּ בְלִדְתָּהּ
  choice: ఆమె ప్రసవం కష్టమవుతున్నప్పుడు
  rationale: ఈ నిర్మాణం ప్రసవ సమయంలో ఎదురైన తీవ్ర కష్టాన్ని సూచిస్తుంది. తెలుగు సహజ వాక్యనిర్మాణంలో కాలసంబంధాన్ని, ప్రసవ కష్టాన్ని రెండింటినీ స్పష్టంగా తెలియజేస్తుంది.
- source_word: הַמְיַלֶּדֶת
  choice: మంత్రసాని
  rationale: ప్రసవంలో సహాయం చేసే స్త్రీని సూచించే మూలపదానికి ఇది ప్రామాణికమైన, సంక్షిప్తమైన తెలుగు పదం.
- source_word: אַל תִּירְאִי
  choice: భయపడకు
  rationale: స్త్రీని ఉద్దేశించిన నేరమైన నిషేధార్థక ఓదార్పును సహజ తెలుగులో నిలుపుతుంది.
- source_word: כִּי
  choice: ;
  rationale: ఇక్కడ כִּי ముందున్న ఓదార్పుకు కారణాన్ని పరిచయం చేస్తుంది. తెలుగులో అర్ధవిరామంతో అనుసంధానించిన రెండవ వాక్యభాగం ఆ కారణసంబంధాన్ని సహజంగా వ్యక్తం చేస్తుంది; ‘ఎందుకంటే’ అని తప్పనిసరిగా చేర్చడం సంభాషణను బరువుగా చేస్తుంది.
- source_word: גַּם זֶה לָךְ בֵּן
  choice: నీకు ఇతడు కూడా కుమారుడే
  rationale: זֶה సూచించే మగ శిశువును ‘ఇతడు’గా, גַּם యొక్క చేర్పు భావాన్ని ‘కూడా’గా నిలుపుతూ, לָךְ בֵּן యొక్క ‘నీకు కుమారుడు’ భావాన్ని మూలానికి దగ్గరగా వ్యక్తం చేస్తుంది.
