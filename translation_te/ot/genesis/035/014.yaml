  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּצֵּ֨ב יַעֲקֹ֜ב מַצֵּבָ֗ה בַּ/מָּק֛וֹם אֲשֶׁר דִּבֶּ֥ר אִתּ֖/וֹ מַצֶּ֣בֶת אָ֑בֶן וַ/יַּסֵּ֤ךְ עָלֶ֨י/הָ֙ נֶ֔סֶךְ וַ/יִּצֹ֥ק עָלֶ֖י/הָ שָֽׁמֶן־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/014.yaml
  text: And Jacob set up a pillar in the place where he had spoken with him[a], a pillar of stone; and he poured out a drink offering on it[b], and he poured oil on it.
translation:
  language: te
  text: అతనితో మాట్లాడిన స్థలంలో యాకోబు ఒక స్తంభాన్ని—రాతి స్తంభాన్ని—నిలబెట్టాడు. దానిమీద పానార్పణను[a] పోసి, నూనెను పోశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అంటే, అర్పణగా ద్రవాన్ని పోయడం.
    reason: ‘పానార్పణ’ అనే ఆచారపదాన్ని సాధారణ పాఠకులకు సంక్షిప్తంగా వివరిస్తుంది.
lexical_decisions:
- source_word: וַיַּצֵּב
  choice: నిలబెట్టాడు
  rationale: హిఫిల్ రూపం ఒక వస్తువును నిటారుగా నిలిపే చర్యను సూచిస్తుంది. ‘నిలబెట్టాడు’ ఆధునిక తెలుగులో సహజంగా ఉండి, స్పష్టమైన భౌతిక చర్యను తెలియజేస్తుంది.
- source_word: מַצֵּבָה / מַצֶּבֶת אָבֶן
  choice: ఒక స్తంభాన్ని—రాతి స్తంభాన్ని—
  rationale: מַצֵּבָה నిలబెట్టిన రాతి స్మారకాన్ని లేదా స్తంభాన్ని సూచిస్తుంది. తరువాతి ‘రాతి స్తంభం’ అనే పునరుక్త వివరణను తొలగించకుండా, తెలుగులో స్పష్టమైన వివరణగా డాష్‌ల మధ్య ఉంచాం.
- source_word: בַּמָּקוֹם אֲשֶׁר דִּבֶּר אִתּוֹ
  choice: తనతో మాట్లాడిన స్థలంలో
  rationale: హీబ్రూ వాక్యంలో మాట్లాడిన వ్యక్తి పేరు ఇక్కడ ప్రత్యక్షంగా లేదు; సందర్భంలో అది దేవుడని తెలుస్తుంది. తెలుగు అనువాదం కూడా కర్తను చేర్చకుండా మూలంలోని పరోక్షతను నిలుపుతుంది.
- source_word: וַיַּסֵּךְ ... נֶסֶךְ
  choice: పానార్పణను పోసి
  rationale: క్రియ, నామవాచకం కలసి ద్రవ అర్పణను పోసే ఆచార చర్యను సూచిస్తాయి. ‘పానార్పణ’ సంక్షిప్తమైన, ఖచ్చితమైన తెలుగు పదం; అర్థసౌలభ్యం కోసం పాదసూచిక ఇచ్చాం.
- source_word: וַיִּצֹק ... שָׁמֶן
  choice: నూనెను కూడా పోశాడు
  rationale: שָׁמֶן సాధారణంగా ‘నూనె’; మూలంలో స్పష్టంగా లేని ‘ఒలీవ నూనె’ను చేర్చలేదు. ‘కూడా’ వరుసగా జరిగిన రెండవ పోయడాన్ని తెలుగులో సహజంగా కలుపుతుంది.
theological_decisions:
- issue: స్తంభం, పానార్పణ, నూనెకు సంబంధించిన యాకోబు చర్యల ఉద్దేశం
  choice: చర్యలను మాత్రమే వర్ణించడం
  alternative: స్తంభాన్ని ప్రతిష్ఠించాడని లేదా దైవసందర్శనకు జ్ఞాపకచిహ్నంగా ఏర్పాటు చేశాడని స్పష్టంగా వ్యాఖ్యానించడం
  rationale: ఈ వచనం ఆచార చర్యలను చెబుతుంది గాని వాటి theological ఉద్దేశాన్ని ప్రత్యక్షంగా వివరించదు. అందువల్ల మూలానికి మించిన వ్యాఖ్యానాన్ని అనువాదంలో చేర్చలేదు.
- issue: ‘తనతో మాట్లాడిన’ అనే ఉపవాక్యంలో మాట్లాడినవారి గుర్తింపు
  choice: కర్తను పేరుతో చేర్చకుండా ఉంచడం
  alternative: ‘దేవుడు తనతో మాట్లాడిన స్థలంలో’ అని స్పష్టీకరించడం
  rationale: ముందటి సందర్భం దేవుణ్ణి సూచించినా, ఈ హీబ్రూ ఉపవాక్యంలో కర్త పేరు లేదు. మూలంలోని వ్యాకరణ పరోక్షతను కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన కానీ సులభంగా అర్థమయ్యే శైలి. హీబ్రూలోని ‘స్తంభం—రాతి స్తంభం’ అనే పునర్వివరణను సహజ తెలుగు విరామచిహ్నాలతో నిలిపాం.
