lexical_decisions:
- source_word: וַיִּהְיוּ יְמֵי יִצְחָק
  choice: ఇస్సాకు జీవించిన కాలం
  rationale: హీబ్రూ ‘ఇస్సాకు దినాలు’ అనే నుడికారం అతని మొత్తం జీవితకాలాన్ని సూచిస్తుంది. పదశః రూపాన్ని కాకుండా దాని భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: יִצְחָק
  choice: ఇస్సాకు
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: מְאַת שָׁנָה וּשְׁמֹנִים שָׁנָה
  choice: నూట ఎనభై సంవత్సరాలు
  rationale: హీబ్రూలో ‘వంద సంవత్సరం, ఎనభై సంవత్సరం’ అనే సంఖ్యా నిర్మాణాన్ని సహజమైన తెలుగు సంఖ్యా ప్రయోగంలో అందిస్తుంది.
