id: GEN.35.9
reference: Genesis 35:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֵּרָ֨א אֱלֹהִ֤ים אֶֽל יַעֲקֹב֙ ע֔וֹד בְּ/בֹא֖/וֹ מִ/פַּדַּ֣ן אֲרָ֑ם וַ/יְבָ֖רֶךְ אֹתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/009.yaml
  text: God appeared to Jacob again when he came from Paddan-aram[a], and he blessed him.
translation:
  language: te
  text: యాకోబు పద్దన్-అరాము నుండి వచ్చినప్పుడు దేవుడు అతనికి మళ్లీ ప్రత్యక్షమై,[a] అతన్ని ఆశీర్వదించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దేవుడు యాకోబుకు తనను తాను మళ్లీ బయలుపరచుకున్నాడు.’ హీబ్రూ క్రియ కనిపించడం లేదా తనను తాను కనిపించేలా చేసుకోవడం అనే భావాలను సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרָא
  choice: ప్రత్యక్షమై
  rationale: ראה అనే క్రియ నిఫాల్ రూపంలో ఇక్కడ కనిపించడం లేదా తనను కనిపించేలా చేసుకోవడం అనే భావాన్ని సూచిస్తుంది. ‘ప్రత్యక్షమై’ అనేది దైవ ప్రత్యక్షతను సహజంగా తెలియజేస్తుంది; అది జరిగిన విధానాన్ని అనవసరంగా నిర్దిష్టపరచదు.
- source_word: אֱלֹהִים
  choice: దేవుడు
  rationale: క్రియ ఏకవచనంలో ఉండటం, కథన సందర్భం ఒకే దేవుణ్ణి సూచించడం వల్ల ‘దేవుడు’ సరైన అనువాదం.
- source_word: עוֹד
  choice: మళ్లీ
  rationale: ఇక్కడ ఈ పదం ఇంతకుముందు జరిగిన దైవ ప్రత్యక్షత పునరావృతమైందని సూచిస్తుంది.
- source_word: בְּבֹאוֹ
  choice: వచ్చినప్పుడు
  rationale: ב ఉపసర్గతో కూడిన క్రియానామ రూపం ఇక్కడ కాలసంబంధ భావాన్ని ఇస్తుంది. ‘వచ్చినప్పుడు’ ఆధునిక తెలుగులో సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: מִפַּדַּן אֲרָם
  choice: పద్దన్-అరాము నుండి
  rationale: ఇది స్థలనామం కాబట్టి అనువదించకుండా లిప్యంతరీకరించబడింది; מִן ఉపసర్గను ‘నుండి’గా అందించాం.
- source_word: וַיְבָרֶךְ אֹתוֹ
  choice: అతన్ని ఆశీర్వదించాడు
  rationale: ברך పియేల్ రూపానికి ‘ఆశీర్వదించు’ అనే అర్థం. కర్త దేవుడని సందర్భం స్పష్టం చేస్తుంది; కర్మను ‘అతన్ని’ అని నిలిపాం.
theological_decisions:
- issue: దైవ ప్రత్యక్షత స్వభావం
  choice: దేవుడు అతనికి ప్రత్యక్షమయ్యాడని నేరుగా అనువదించడం
  alternative: దేవుడు తనను అతనికి బయలుపరచుకున్నాడు; దేవుడు అతనికి కనిపించాడు
  rationale: వాక్యం నిజమైన దైవ ప్రత్యక్షతను తెలియజేస్తుంది గాని అది ఏ విధంగా జరిగిందో చెప్పదు. ‘ప్రత్యక్షమై’ అనే పదం ఆ అనిశ్చితిని నిలుపుతుంది; దానిని కేవలం దర్శనంగా గానీ, నైరూప్య బయలుపాటుగా గానీ పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. హీబ్రూ వాక్యంలోని కాలసంబంధ నిర్మాణం, పునరావృత భావం, దైవ ప్రత్యక్షతలోని ఉద్దేశపూర్వక అనిర్దిష్టత నిలుపబడ్డాయి.
