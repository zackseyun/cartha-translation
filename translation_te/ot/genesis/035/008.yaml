  text: וַ/תָּ֤מָת דְּבֹרָה֙ מֵינֶ֣קֶת רִבְקָ֔ה וַ/תִּקָּבֵ֛ר מִ/תַּ֥חַת לְ/בֵֽית אֵ֖ל תַּ֣חַת הָֽ/אַלּ֑וֹן וַ/יִּקְרָ֥א שְׁמ֖/וֹ אַלּ֥וֹן בָּכֽוּת־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/008.yaml
  text: And Deborah[a], Rebekah’s nurse, died, and she was buried below Bethel, under the oak[b]. So he called its name Allon-bacuth.
translation:
  language: te
  text: రిబ్కాకు పాలిచ్చిన దాది దెబోరా చనిపోయింది. ఆమెను బేతేలుకు దిగువన, ఓక్ చెట్టు[a] కింద పాతిపెట్టారు. దానికి అల్లోన్-బాకూత్[b] అని పేరు పెట్టాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడి హీబ్రూ వృక్షపదం ఓక్ చెట్టు లేదా టెరెబింతు చెట్టును సూచించవచ్చు; ఖచ్చితమైన జాతి తెలియదు.
    reason: lexical_alternative
  - marker: b
    text: “అల్లోన్-బాకూత్” అంటే బహుశా “ఏడ్పు ఓక్ చెట్టు”; אַלּוֹן‌ను టెరెబింతుగా తీసుకుంటే “ఏడ్పు టెరెబింతు చెట్టు” అని అర్థం.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵינֶקֶת
  choice: దాది
  rationale: పిల్లకు పాలిచ్చి సంరక్షించే స్త్రీని సూచించే పదం. ఆధునిక తెలుగులో సహజమైన ‘దాది’ పాత్రను తెలియజేస్తుంది; ‘పాలిచ్చిన దాది’ అని మరింత నిర్దిష్టంగా చేయడం సందర్భానికి అవసరం లేదు.
- source_word: מִתַּחַת לְבֵית אֵל
  choice: బేతేలుకు దిగువన
  rationale: బేతేలు కంటే తక్కువ ఎత్తులో లేదా దాని కిందనున్న ప్రదేశమనే స్థానిక భావాన్ని నిలుపుతుంది; ‘దక్షిణాన’ అనే దిక్కును అనవసరంగా చేర్చదు.
- source_word: תַּחַת הָאַלּוֹן
  choice: సింధూర వృక్షం కింద
  rationale: תַּחַת అంటే ‘కింద’. אַלּוֹן ఒక పెద్ద వృక్షాన్ని, బహుశా ఓక్ లేదా టెరెబింతును సూచిస్తుంది; జాతి అనిశ్చితిని పాదటిప్పణిలో ఉంచుతూ తెలుగులో వాడుకలో ఉన్న వృక్షనామాన్ని ఎంచుకున్నాం.
- source_word: וַיִּקְרָא שְׁמוֹ
  choice: దానికి … అని పేరు పెట్టాడు
  rationale: హీబ్రూలో క్రియ కర్తృవాచక ఏకవచన పుంలింగంలో ఉంది, కాని కర్త స్పష్టంగా చెప్పబడలేదు. దానిని కర్తృవాచకంగానే ఉంచి, సర్వనామాన్ని ముందున్న వృక్షం లేదా స్థలానికి అన్వయించాం.
- source_word: אַלּוֹן בָּכוּת
  choice: అల్లోన్-బాకూత్
  rationale: స్థల/వృక్ష నామాన్ని ప్రధాన పాఠ్యంలో లిప్యంతరీకరించాం; దాని అర్థాన్ని, వృక్షజాతి ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
- source_word: וַתִּקָּבֵר
  choice: ఆమెను … పాతిపెట్టారు
  rationale: నిఫాల్ రూపంలోని కర్మణి భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; పాతిపెట్టినవారు ఎవరో పాఠ్యంలో లేనందున వారిని పేర్కొనదు.
- source_word: וַתָּמָת
  choice: చనిపోయింది
  rationale: హీబ్రూ క్రియలోని సూటి ‘మరణించింది’ అనే భావాన్ని సాధారణ ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది; మరణాన్ని మృదూకరించే నుడికారాన్ని చేర్చదు.
theological_decisions:
- issue: పేరు పెట్టిన కర్త ఎవరు?
  choice: ‘పేరు పెట్టాడు’ అని కర్తృవాచక క్రియను ఉంచి, కర్తను పేరుతో గుర్తించలేదు.
  alternative: ‘దానికి … అనే పేరు వచ్చింది’ లేదా ‘పేరు పెట్టబడింది.’
  rationale: మూలంలోని וַיִּקְרָא క్రియ 3వ పురుష ఏకవచన పుంలింగ కర్తృవాచక రూపంలో ఉంది; అయితే కర్త ప్రత్యక్షంగా పేర్కొనబడలేదు. కాబట్టి యాకోబు అని చేర్చకుండా మూల వ్యాకరణాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. హీబ్రూ వాక్యక్రమాన్ని బలవంతంగా అనుకరించకుండా సహజ తెలుగు క్రమాన్ని వాడాం. వృక్షజాతి అనిశ్చితిని మరియు పేరు పెట్టిన కర్త స్పష్టంగా లేకపోవడాన్ని పరిష్కరించకుండా నిలిపాం.
