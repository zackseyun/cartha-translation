- from: రిబ్కా దాదియైన దెబోరా చనిపోయింది. ఆమెను బేతేలుకు దిగువన ఉన్న సింధూర వృక్షం[a] కింద పాతిపెట్టారు. దానికి అల్లోన్-బాకూత్[b] అని పేరు పెట్టాడు.
