  to: 'అప్పుడు దేవుడు యాకోబుతో ఇలా చెప్పాడు: “లేచి, బేతేలుకు పైకి వెళ్లి అక్కడ నివసించు. నీవు నీ సహోదరుడైన ఏశావు నుండి[a] పారిపోతున్నప్పుడు నీకు ప్రత్యక్షమైన ఆ దేవునికి అక్కడ ఒక బలిపీఠం కట్టు.”'
