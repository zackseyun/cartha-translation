id: GEN.35.1
reference: Genesis 35:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֱלֹהִים֙ אֶֽל יַעֲקֹ֔ב ק֛וּם עֲלֵ֥ה בֵֽית אֵ֖ל וְ/שֶׁב שָׁ֑ם וַ/עֲשֵׂה שָׁ֣ם מִזְבֵּ֔חַ לָ/אֵל֙ הַ/נִּרְאֶ֣ה אֵלֶ֔י/ךָ בְּ/בָרְחֲ/ךָ֔ מִ/פְּנֵ֖י עֵשָׂ֥ו אָחִֽי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/001.yaml
  text: Then God said to Jacob[a], “Arise, go up to Bethel and dwell there, and make there an altar to the God who appeared to you when you fled from the presence of Esau your brother.”
translation:
  language: te
  text: 'అప్పుడు దేవుడు యాకోబుతో ఇలా చెప్పాడు: “లేచి, బేతేలుకు పైకి వెళ్లి అక్కడ నివసించు. నీవు నీ సహోదరుడైన ఏశావు నుండి[a] పారిపోతున్నప్పుడు నీకు ప్రత్యక్షమైన ఆ దేవునికి అక్కడ ఒక బలిపీఠం కట్టు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “నీ సహోదరుడైన ఏశావు ముఖము/సన్నిధి నుండి.”
    reason: మִפְּנֵי యొక్క అక్షరార్థమైన ‘ముఖము/సన్నిధి’ భావాన్ని సూచిస్తూ, ప్రధాన పాఠ్యంలో సహజమైన తెలుగు ప్రయోగాన్ని ఉంచుతుంది.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... చెప్పాడు
  rationale: వావ్-కాన్సిక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది; ఆధునిక తెలుగులో ‘అప్పుడు’ దాని క్రమసూచక భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: אֱלֹהִים
  choice: దేవుడు
  rationale: రూపంలో బహువచనమైనా, ఇక్కడ ఏకవచన క్రియతో వచ్చి ఒకే దేవుణ్ణి సూచిస్తుంది.
- source_word: קוּם עֲלֵה
  choice: లేచి ... వెళ్లి
  rationale: రెండు ఆజ్ఞల కదలికను సహజమైన తెలుగులో నిలుపుతుంది. עֲלֵה లోని ‘పైకి వెళ్లడం’ అనే భావం సందర్భంలో ప్రయాణాన్ని సూచిస్తుంది; తెలుగులో ‘బేతేలుకు పైకి వెళ్లు’ అనడం అసహజంగా ఉండవచ్చు.
- source_word: בֵּית אֵל
  choice: బేతేలు
  rationale: స్థలనామాన్ని అర్థానువాదం చేయకుండా తెలుగులో స్థిరపడిన రూపంలో లిప్యంతరీకరించబడింది.
- source_word: וְשֶׁב שָׁם
  choice: అక్కడ నివసించు
  rationale: ישב ఇక్కడ ఉండడం లేదా నివసించడం అనే భావాన్ని ఇస్తుంది; ‘నివసించు’ ఆజ్ఞ యొక్క గంభీరతను, కాలవ్యాప్తిని నిలుపుతుంది.
- source_word: וַעֲשֵׂה שָׁם מִזְבֵּחַ
  choice: అక్కడ ఒక బలిపీఠం కట్టు
  rationale: עשה అక్షరార్థంగా ‘చేయు’ అయినా, బలిపీఠం సందర్భంలో ‘కట్టు’ ఆధునిక తెలుగులో సహజమైన ప్రయోగం.
- source_word: לָאֵל
  choice: దేవునికి
  rationale: ל ఉపసర్గ బలిపీఠం ఎవరికోసం లేదా ఎవరికీ అంకితంగా నిర్మించబడుతుందో సూచిస్తుంది.
- source_word: הַנִּרְאֶה אֵלֶיךָ
  choice: నీకు ప్రత్యక్షమైన
  rationale: נראה దైవదర్శన సందర్భంలో ‘ప్రత్యక్షమయ్యాడు’ అనే భావాన్ని స్పష్టంగా, సాంప్రదాయబద్ధంగా తెలియజేస్తుంది.
- source_word: בְּבָרְחֲךָ
  choice: నీవు ... పారిపోయినప్పుడు
  rationale: ב తో కూడిన క్రియానామం కాలసంబంధ పరిస్థితిని సూచిస్తుంది; తెలుగులో ‘పారిపోయినప్పుడు’ సహజమైన సమానార్థకం.
- source_word: מִפְּנֵי
  choice: సముఖం నుండి
  rationale: హీబ్రూ పదబంధంలోని ‘ముఖం/సన్నిధి నుండి’ అనే రూపకాన్ని ప్రధాన పాఠ్యంలో నిలుపుతూ, సరళమైన అర్థాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: עֵשָׂו אָחִיךָ
  choice: నీ సహోదరుడైన ఏశావు
  rationale: హీబ్రూలో ‘ఏశావు, నీ సహోదరుడు’ అనే క్రమం ఉన్నా, ఈ తెలుగు నిర్మాణం సంబంధాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ఈ వాక్యంలో אֱלֹהִים యొక్క సూచన
  choice: యాకోబుతో మాట్లాడే ఏకైక దేవుడు
  alternative: దేవతలు
  rationale: పదరూపం బహువచనంగా కనిపించినా, ఏకవచన క్రియ మరియు కథన సందర్భం ఒకే దేవుణ్ణి స్పష్టంగా సూచిస్తాయి.
- issue: బేతేలు అనే స్థలనామం
  choice: బేతేలు అని లిప్యంతరీకరణ
  alternative: దేవుని ఇల్లు అని అర్థానువాదం
  rationale: ఇక్కడ అది స్థలనామంగా పనిచేస్తోంది; అర్థానువాదం చేస్తే పేరుగా ఉన్న పాత్ర మసకబారుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, దైవాజ్ఞకు తగిన గంభీరతతో రూపొందించబడింది. వాక్య నిర్మాణం సహజంగా ఉండేందుకు ఒక దీర్ఘ ఆజ్ఞను రెండు వాక్యాలుగా విభజించాం; భావక్రమం మార్చలేదు.
