review_pass:
  verdict: revise
  source_fidelity: The draft conveys the principal command accurately, but it omits the directional nuance of עֲלֵה (“go up”). Its rendering “సముఖం నుండి” is not a natural modern Telugu equivalent for מִפְּנֵי in this idiom and can suggest physical position rather than fleeing from Esau. The revision restores “పైకి” and uses the natural idiom “ఏశావు నుండి పారిపోతున్నప్పుడు,” with the literal ‘face/presence’ nuance retained in a footnote.
  naturalness: “బేతేలుకు పైకి వెళ్లి” is clear and natural enough in a command involving travel to a place, while “ఏశావు నుండి పారిపోతున్నప్పుడు” is substantially more idiomatic than “ఏశావు సముఖం నుండి పారిపోయినప్పుడు.” The revised punctuation also makes the divine speech clear in modern standard Telugu.
  terminology: “దేవుడు,” “బేతేలు,” “నివసించు,” “ప్రత్యక్షమైన,” and “బలిపీఠం” are appropriate. “ఆ దేవునికి” properly represents the definite article in לָאֵל הַנִּרְאֶה and identifies the God by the following relative clause without importing doctrinal interpretation.
  issues:
  - severity: medium
    issue: The directional force of עֲלֵה is omitted.
    rationale: “బేతేలుకు వెళ్లి” translates travel but not the explicit ‘go up/ascend’ element. “బేతేలుకు పైకి వెళ్లి” retains this source feature.
  - severity: medium
    issue: “సముఖం నుండి” is unnatural and potentially misleading in this context.
    rationale: For מִפְּנֵי with the verb ‘flee,’ Telugu normally says ‘X నుండి పారిపోవు.’ The Hebrew’s literal face/presence imagery is best preserved in an explanatory footnote rather than by an awkward main-text expression.
  revised_text: 'అప్పుడు దేవుడు యాకోబుతో ఇలా చెప్పాడు: “లేచి, బేతేలుకు పైకి వెళ్లి అక్కడ నివసించు. నీవు నీ సహోదరుడైన ఏశావు నుండి[a] పారిపోతున్నప్పుడు నీకు ప్రత్యక్షమైన ఆ దేవునికి అక్కడ ఒక బలిపీఠం కట్టు.”'
