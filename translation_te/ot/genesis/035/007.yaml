  yaml_path: translation/ot/genesis/035/007.yaml
  text: There he built an altar and called the place El-bethel[a], because there God had revealed himself to him when he fled from his brother.
translation:
  language: te
  text: అక్కడ అతడు ఒక బలిపీఠం కట్టి, ఆ స్థలానికి ఏల్-బేతేలు[a] అని పేరు పెట్టాడు. ఎందుకంటే అతడు తన సహోదరుని నుండి పారిపోయినప్పుడు అక్కడ దేవుడు అతనికి ప్రత్యక్షమయ్యాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ఏల్-బేతేలు” అనే పేరుకు బహుశా “బేతేలు దేవుడు” అని అర్థం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן שָׁם מִזְבֵּחַ
  choice: అక్కడ అతడు ఒక బలిపీఠం కట్టి
  rationale: కథన క్రమాన్ని సహజమైన ఆధునిక తెలుగులో కొనసాగిస్తూ, בנה మరియు מזבח పదాల సాధారణ అర్థాలను నేరుగా నిలుపుతుంది.
- source_word: וַיִּקְרָא לַמָּקוֹם
  choice: ఆ స్థలానికి ... అని పేరు పెట్టాడు
  rationale: పేరు పెట్టే సందర్భంలో קרא ל־ అనే హీబ్రూ నిర్మాణానికి ఇది సహజమైన తెలుగు ప్రయోగం.
- source_word: אֵל בֵּית אֵל
  choice: ఏల్-బేతేలు
  rationale: ఇది స్థలానికి పెట్టిన పేరుగా పనిచేస్తున్నందున ప్రధాన పాఠ్యంలో లిప్యంతరీకరించబడింది; దాని సంభావ్య అర్థం పాదసూచికలో ఇవ్వబడింది.
- source_word: נִגְלוּ אֵלָיו הָאֱלֹהִים
  choice: దేవుడు అతనికి ప్రత్యక్షమయ్యాడు
  rationale: నిఫల్ రూపంలోని ప్రత్యక్షత భావాన్ని సహజంగా తెలుపుతుంది. రూపపరంగా క్రియ బహువచనమైనా, సందర్భంలో సూచించబడినవాడు ఇశ్రాయేలు దేవుడే కాబట్టి తెలుగులో ఏకవచనం వాడబడింది.
- source_word: בְּבָרְחוֹ מִפְּנֵי אָחִיו
  choice: అతడు తన సహోదరుని నుండి పారిపోయినప్పుడు
  rationale: కాలసూచక infinitive నిర్మాణాన్ని ‘పారిపోయినప్పుడు’గా, מִפְּנֵי యొక్క సందర్భార్థాన్ని ‘నుండి’గా సహజంగా అందిస్తుంది.
theological_decisions:
- issue: אֱלֹהִים అనే రూపంతో נִגְלוּ అనే బహువచన క్రియ రావడం
  choice: దేవుడు ... ప్రత్యక్షమయ్యాడు అని ఏకవచనంలో అనువదించడం
  alternative: దేవుళ్లు ... ప్రత్యక్షమయ్యారు; లేదా రూపపరమైన బహువచనాన్ని అసహజంగా నిలుపడం
  rationale: బేతేలులో యాకోబుకు ప్రత్యక్షమైన ఒకే దేవుని కథన సందర్భం స్పష్టంగా ఉంది. హీబ్రూ రూపంలోని వ్యాకరణ ఉద్రిక్తతను బహుదేవతార్థంగా మార్చకుండా, ఉద్దేశించిన ఏకవచన సూచ్యార్థాన్ని తెలుగులో వ్యక్తం చేస్తుంది.
- issue: אֵל בֵּית אֵל ను అనువదించాలా లేక లిప్యంతరీకరించాలా
  choice: ప్రధాన పాఠ్యంలో ‘ఏల్-బేతేలు’ అని లిప్యంతరీకరించడం
  alternative: ‘బేతేలు దేవుడు’ అని అర్థానువాదం చేయడం
  rationale: ఈ పదబంధం యాకోబు ఆ స్థలానికి పెట్టిన పేరుగా వస్తుంది. పేరును ప్రధాన పాఠ్యంలో నిలిపి, దాని సంభావ్య అర్థాన్ని పాదసూచికలో ఇవ్వడం పేరు పెట్టే చర్యనూ పదార్థాన్నీ రెండింటినీ కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన వాక్యనిర్మాణం, అయితే బైబిలు కథనానికి తగిన గౌరవప్రదమైన శైలి. ‘సహోదరుడు’ అనే పదం ‘సోదరుడు’ కంటే కొద్దిగా గ్రంథోచితమైనదైనా సులభంగా అర్థమవుతుంది.
