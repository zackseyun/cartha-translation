  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/בְנֵ֥י זִלְפָּ֛ה שִׁפְחַ֥ת לֵאָ֖ה גָּ֣ד וְ/אָשֵׁ֑ר אֵ֚לֶּה בְּנֵ֣י יַעֲקֹ֔ב אֲשֶׁ֥ר יֻלַּד ל֖/וֹ בְּ/פַדַּ֥ן אֲרָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/026.yaml
  text: 'And the sons of Zilpah[a], Leah’s servant: Gad and Asher[b]. These are the sons of Jacob who were born to him in Paddan-aram.'
translation:
  language: te
  text: 'లేయా దాసి అయిన జిల్పా కుమారులు[a]: గాదు, ఆషేరు[b]. వీరే పద్దనరాములో యాకోబుకు పుట్టిన కుమారులు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “దాసి” అని అనువదించిన హీబ్రూ పదం స్త్రీ సేవకురాలిని సూచిస్తుంది; అప్పటి సామాజిక స్థితిని మరింత స్పష్టంగా చూపేందుకు దీనిని “బానిస స్త్రీ” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ఈ వాక్యం యాకోబు కుమారులు పద్దనరాములో అతనికి పుట్టారని చెబుతున్నప్పటికీ, బెన్యామీను తరువాత కనాను దేశంలో పుట్టాడు (16–18 వచనాలు). ఇక్కడి మాట యాకోబు పద్దనరాములో ఉన్న కాలానికి సంబంధించిన కుటుంబ జాబితాను సమగ్రంగా ముగిస్తున్నట్లు ఉంది.
    reason: cross_reference
lexical_decisions:
- source_word: וּבְנֵי
  choice: కుమారులు
  rationale: בְּנֵי అనే పదం పుంలింగ బహువచనంలో ‘కుమారులు’ అని స్పష్టంగా సూచిస్తుంది; వంశావళి సందర్భంలో ఇదే సహజమైన అనువాదం.
- source_word: זִלְפָּה
  choice: జిల్పా
  rationale: వ్యక్తి పేరును ఆధునిక తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: שִׁפְחַת לֵאָה
  choice: లేయా దాసి అయిన
  rationale: నిర్మాణ సంబంధాన్ని సహజ తెలుగులో తెలిపింది. שִׁפְחָה స్త్రీ సేవకురాలు లేదా బానిస స్త్రీ అనే సామాజిక స్థితిని సూచించగలదు; ‘దాసి’ సంక్షిప్తంగా ఆ భావాన్ని నిలుపుతుంది.
- source_word: גָּד וְאָשֵׁר
  choice: గాదు, ఆషేరు
  rationale: వ్యక్తి పేర్లను తెలుగు బైబిలు సంప్రదాయానికి అనుగుణంగా లిప్యంతరీకరించి, జాబితాలో సహజంగా విరామచిహ్నంతో కలిపాం.
- source_word: אֵלֶּה בְּנֵי יַעֲקֹב
  choice: వీరే ... యాకోబుకు ... కుమారులు
  rationale: אֵלֶּה యొక్క సూచనాత్మక బలాన్ని ‘వీరే’ నిలుపుతుంది; తెలుగులో సహజ వాక్యక్రమం కోసం ‘యాకోబు కుమారులు’ భావాన్ని వాక్యమంతటా అమర్చాం.
- source_word: אֲשֶׁר יֻלַּד לוֹ
  choice: యాకోబుకు పుట్టిన
  rationale: హీబ్రూ నిష్క్రియ రూపాన్ని, స్త్రీ కర్తను చేర్చకుండా, ‘అతనికి పుట్టిన’ అనే భావంతో సహజ తెలుగులో అందించాం.
- source_word: בְּפַדַּן אֲרָם
  choice: పద్దనరాములో
  rationale: స్థలనామాన్ని అనువదించకుండా తెలుగు బైబిలు వాడుకలో ప్రసిద్ధమైన రూపంలో లిప్యంతరీకరించాం.
theological_decisions:
- issue: పద్దనరాములో పుట్టిన కుమారులనే సమగ్రంగా పేర్కొనడం మరియు బెన్యామీను కనానులో పుట్టడం మధ్య కనిపించే ఉద్రిక్తత
  choice: మూల వాక్యంలోని స్థల సూచనను యథాతథంగా ఉంచి వివరణను పాదసూచికలో ఇచ్చాం.
  alternative: బెన్యామీనును మినహాయిస్తున్నట్లు ప్రధాన వాక్యంలో స్పష్టీకరించడం.
  rationale: మూల హీబ్రూ అలాంటి మినహాయింపును వాక్యంలో ప్రత్యక్షంగా చెప్పదు. అందువల్ల భావసంబంధ ఉద్రిక్తతను సవరించకుండా నిలిపి, సందర్భ సమాచారాన్ని పాదసూచికకు పరిమితం చేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళికి తగిన సంక్షిప్తమైన గౌరవప్రద శైలిని వాడాం. ‘దాసి’ సాధారణ పాఠకులకు అర్థమయ్యేలా ఉండి, మూలంలోని స్త్రీ సేవకురాలు/బానిస అనే సామాజిక భావాన్ని పూర్తిగా మృదువుపరచకుండా నిలుపుతుంది. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
