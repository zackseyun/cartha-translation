  terminology: “బేతేలు” స్థలనామంగా సరిగ్గా లిప్యంతరీకరించబడింది. “బలిపీఠం,” “దేవునికి,” “జవాబిచ్చిన” అనే పదప్రయోగాలు అర్థవిశ్వసనీయంగాను, తటస్థమైన బైబిలు రిజిస్టర్లోనూ ఉన్నాయి. నిర్దిష్ట హీబ్రూ అర్థాన్ని సంబంధ వాక్యాల ద్వారా సహజంగా సూచించారు.
