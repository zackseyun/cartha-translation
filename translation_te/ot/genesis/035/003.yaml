id: GEN.35.3
reference: Genesis 35:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/נָק֥וּמָה וְ/נַעֲלֶ֖ה בֵּֽית אֵ֑ל וְ/אֶֽעֱשֶׂה שָּׁ֣ם מִזְבֵּ֗חַ לָ/אֵ֞ל הָ/עֹנֶ֤ה אֹתִ/י֙ בְּ/י֣וֹם צָֽרָתִ֔/י וַ/יְהִי֙ עִמָּדִ֔/י בַּ/דֶּ֖רֶךְ אֲשֶׁ֥ר הָלָֽכְתִּי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/003.yaml
  text: Let us rise and go up to Bethel[a], and there I will make an altar to the God who answered me in the day of my distress and was with me on the way that I went.
translation:
  language: te
  text: మనం లేచి బేతేలుకు పైకి వెళ్దాం. నా కష్టకాలంలో నాకు జవాబిచ్చిన[a], నేను వెళ్లిన మార్గంలో నాకు తోడుగా ఉన్న దేవునికి అక్కడ ఒక బలిపీఠం కడతాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నాకు జవాబిచ్చే.” హీబ్రూ కృదంతం దేవుడు సాధారణంగా లేదా నిరంతరం జవాబిచ్చేవాడనే భావాన్ని కూడా సూచించవచ్చు.
    reason: హీబ్రూ కృదంతంలోని గత సంఘటన మరియు సాధారణ/కొనసాగుతున్న లక్షణం మధ్య ఉన్న నిజమైన కాలార్థ అస్పష్టతను నిలుపుతుంది.
lexical_decisions:
- source_word: וְנָקוּמָה
  choice: మనం లేచి
  rationale: మొదటి పురుష బహువచన కోహోర్టేటివ్‌లోని ప్రోత్సాహక భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וְנַעֲלֶה
  choice: పైకి వెళ్దాం
  rationale: עלה లోని ఎక్కి వెళ్లడం అనే స్థలసంబంధ భావాన్ని, బేతేలుకు ప్రయాణ సందర్భంలో, స్పష్టంగా నిలుపుతుంది.
- source_word: בֵּית אֵל
  choice: బేతేలు
  rationale: ఇది స్థలనామం కాబట్టి అర్థానువాదం చేయకుండా తెలుగులో లిప్యంతరీకరించబడింది.
- source_word: וְאֶעֱשֶׂה שָּׁם מִזְבֵּחַ
  choice: అక్కడ ఒక బలిపీఠం కడతాను
  rationale: עשה అక్షరార్థంగా ‘చేయడం’ అయినా, బలిపీఠం సందర్భంలో ‘కట్టడం’ సహజమైన తెలుగు ప్రయోగం; క్రియ యొక్క ఉద్దేశాన్ని మార్చదు.
- source_word: לָאֵל
  choice: దేవునికి
  rationale: ל ఉపసర్గలోని సమర్పణ లేదా ఉద్దేశ దిశను ‘దేవునికి’ సహజంగా తెలియజేస్తుంది; తరువాతి విశేషణ వాక్యాలు దేవుణ్ణి నిర్దిష్టంగా గుర్తిస్తాయి.
- source_word: הָעֹנֶה אֹתִי
  choice: నాకు జవాబిచ్చిన
  rationale: భూతకాలంలోని నిర్దిష్ట కష్టసందర్భాన్ని వెనక్కి చూసే వాక్యప్రసంగానికి ఇది సరిపోతుంది; హీబ్రూ వర్తమాన కృదంతంలోని సాధారణ లేదా కొనసాగుతున్న భావసాధ్యతను పాదటిప్పణిలో నిలిపాం.
- source_word: בְּיוֹם צָרָתִי
  choice: నా కష్టకాలంలో
  rationale: ‘నా కష్టపు దినంలో’ అనే హీబ్రూ నుడికారాన్ని పదశః కాకుండా, దాని కాలసంబంధ మరియు బాధాసంబంధ భావాన్ని సహజ తెలుగులో అందిస్తుంది.
- source_word: וַיְהִי עִמָּדִי
  choice: నాకు తోడుగా ఉన్న
  rationale: దేవుని సన్నిధి మరియు సహవాసాన్ని సందర్భానుగుణంగా, అతిగా వ్యాఖ్యానించకుండా వ్యక్తం చేస్తుంది.
- source_word: בַּדֶּרֶךְ אֲשֶׁר הָלָכְתִּי
  choice: నేను వెళ్లిన మార్గంలో
  rationale: דרך మరియు הלך లోని స్పష్టమైన మార్గం–ప్రయాణం చిత్రాన్ని సహజమైన తెలుగు నిర్మాణంలో నిలుపుతుంది.
theological_decisions:
- issue: యాకోబు మాటల్లో אֵל యొక్క నిర్దిష్ట సూచన
  choice: తరువాతి సంబంధ వాక్యాలతో నిర్దిష్టమైన ‘దేవునికి’
  alternative: ‘ఆ దేవునికి’
  rationale: హీబ్రూలోని నిర్దిష్టతను ‘నాకు జవాబిచ్చిన… నాకు తోడుగా ఉన్న దేవునికి’ అనే మొత్తం నిర్మాణం తెలుగులో సహజంగా తెలియజేస్తుంది. ‘ఆ దేవునికి’ అని చేర్చడం సాధ్యమైనా, తెలుగులో అనవసరంగా దూరసూచక భావం కలిగించవచ్చు.
- issue: הָעֹנֶה అనే కృదంతం యొక్క కాలార్థం
  choice: నాకు జవాబిచ్చిన
  alternative: నాకు జవాబిచ్చే
  rationale: తక్షణ సందర్భం గతంలోని నిర్దిష్ట కష్టసమయంలో దేవుడు స్పందించిన సంగతిని జ్ఞాపకం చేస్తుంది. అయినా కృదంతం దేవుని సాధారణ లేదా కొనసాగుతున్న లక్షణాన్ని కూడా సూచించగలదు కాబట్టి ఆ ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలి వాడబడింది. ‘పైకి వెళ్దాం’ భౌగోళిక ఎక్కుదల భావాన్ని నిలుపుతుంది; ‘బలిపీఠం కడతాను’ సహజ తెలుగు ప్రయోగం. పాదటిప్పణి గుర్తు అది వివరిస్తున్న ‘జవాబిచ్చిన’ పదానికే జతచేయబడింది.
