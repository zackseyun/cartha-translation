lexical_decisions:
- source_word: וּ/בְנֵי
  choice: కుమారులు
  rationale: בְנֵי అనేది בֵּן పదానికి construct బహువచనం; వంశావళి జాబితాలో బిల్హాకు పుట్టిన మగ సంతానాన్ని సూచిస్తున్నందున ‘కుమారులు’ సహజమైన, ఖచ్చితమైన అనువాదం. ముందున్న జాబితాతో అనుసంధానం తెలుగులో విరామచిహ్నం మరియు వాక్యనిర్మాణం ద్వారా స్పష్టమవుతున్నందున וּ ను విడిగా ‘మరియు’ అని పెట్టలేదు.
- source_word: בִלְהָה
  choice: బిల్హా
  rationale: వ్యక్తి పేరును ఆధునిక ప్రామాణిక తెలుగు లిప్యంతరీకరణలో ఇచ్చాం.
- source_word: שִׁפְחַת
  choice: దాసి
  rationale: שִׁפְחָה తక్కువ సామాజిక హోదాలోని స్త్రీ సేవకురాలిని, కొన్ని సందర్భాల్లో బానిస స్త్రీని సూచించగలదు. ‘దాసి’ సంక్షిప్తంగా, గౌరవప్రదమైన బైబిలు శైలిలో ఉండి స్త్రీలింగాన్ని నిలుపుతుంది; భావవ్యాప్తిని పాదసూచిక వివరిస్తుంది.
- source_word: רָחֵל
  choice: రాహేలు
  rationale: వ్యక్తి పేరును తెలుగులో సుపరిచితమైన రూపంలో ఇచ్చాం; ‘రాహేలు దాసి’ అనే నిర్మాణం హీబ్రూ construct సంబంధాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: דָּן
  choice: దాను
  rationale: వ్యక్తి పేరుకు తెలుగులో సుపరిచితమైన రూపాన్ని వాడాం.
- source_word: וְ/נַפְתָּלִי
  choice: నఫ్తాలి
  rationale: వ్యక్తి పేరును సుపరిచిత తెలుగు రూపంలో ఇచ్చాం. పేర్ల జాబితాలో హీబ్రూ וְ కలిపే సంబంధాన్ని తెలుగులో కామా సహజంగా వ్యక్తం చేస్తుంది.
