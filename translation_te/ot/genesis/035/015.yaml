reference: Genesis 35:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּקְרָ֨א יַעֲקֹ֜ב אֶת שֵׁ֣ם הַ/מָּק֗וֹם אֲשֶׁר֩ דִּבֶּ֨ר אִתּ֥/וֹ שָׁ֛ם אֱלֹהִ֖ים בֵּֽית אֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/015.yaml
  text: And Jacob called the name of the place where God had spoken with him there[b][a], Bethel.
translation:
  language: te
  text: దేవుడు యాకోబుతో అక్కడ మాట్లాడిన ఆ స్థలానికి యాకోబు బేతేలు[a] అని పేరు పెట్టాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “బేతేలు” అంటే “దేవుని ఇల్లు.”
    reason: స్థలనామంలోని హీబ్రూ పదార్థాన్ని తెలియజేయడానికి.
lexical_decisions:
- source_word: וַיִּקְרָא ... אֶת שֵׁם
  choice: పేరు పెట్టాడు
  rationale: ‘పేరు పిలిచాడు’ అనే హీబ్రూ నుడికారానికి సహజమైన ఆధునిక తెలుగు రూపం; స్థలానికి నామకరణం చేశాడనే భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: הַמָּקוֹם
  choice: ఆ స్థలం
  rationale: నిర్దిష్ట ఉపపదంతో ఉన్న పదాన్ని సందర్భానికి సహజంగా ‘ఆ స్థలం’ అని అనువదించాం.
- source_word: אֲשֶׁר דִּבֶּר אִתּוֹ שָׁם אֱלֹהִים
  choice: దేవుడు తనతో అక్కడ మాట్లాడిన
  rationale: אִתּוֹ లోని ‘అతనితో’ భావాన్నీ, שָׁם లోని ‘అక్కడ’ భావాన్నీ నిలిపి, తెలుగులో సహజమైన సంబంధ వాక్యంగా ఇచ్చాం.
- source_word: אֱלֹהִים
  choice: దేవుడు
  rationale: ఇక్కడ క్రియ, సందర్భం ఏకవచన సూచనతో యాకోబుతో మాట్లాడిన దేవుణ్ణి సూచిస్తున్నాయి.
- source_word: בֵּית אֵל
  choice: బేతేలు
  rationale: స్థలనామాన్ని అనువదించకుండా తెలుగులో ప్రాచుర్యంలో ఉన్న లిప్యంతరీకరణతో ఇచ్చాం; పదార్థాన్ని పాదటిప్పణిలో తెలిపాం.
theological_decisions:
- issue: אֱלֹהִים పదానికి ఏకవచన అర్థం
  choice: దేవుడు
  alternative: దేవతలు
  rationale: కథన సందర్భం మరియు ఏకవచన క్రియాత్మక భావం ఒకే దేవుణ్ణి సూచిస్తున్నాయి; బహువచనంగా అనువదించడం మూలార్థాన్ని వక్రీకరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని ‘అక్కడ’ను విడిచిపెట్టకుండా ఉంచాం; హీబ్రూ నుడికారమైన ‘పేరు పిలిచాడు’ను తెలుగులో సహజమైన ‘పేరు పెట్టాడు’గా మలిచాం.
