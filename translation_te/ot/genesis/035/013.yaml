  yaml_path: translation/ot/genesis/035/013.yaml
  text: Then God went up from him in the place where he had spoken with him[a].
translation:
  language: te
  text: అప్పుడు దేవుడు అతనితో మాట్లాడిన స్థలంలో అతని దగ్గరనుండి పైకి వెళ్లాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అతని దగ్గరనుండి పైకి ఎక్కాడు.’ దేవుడు ఆ దర్శనసందర్భం నుండి వెళ్లడాన్ని హీబ్రూ పైదిశ కదలికగా వర్ణిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: పైకి వెళ్లిపోయాడు
  rationale: עלה అనే క్రియ యొక్క సాధారణ అర్థమైన ‘పైకి వెళ్లడం’ను నిలుపుతూ, ఈ సందర్భంలో దర్శనాంతర నిష్క్రమణ భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: מֵעָלָיו
  choice: అతని దగ్గరనుండి
  rationale: అక్షరార్థంలో ‘అతని మీదనుండి/అతని పైనుండి’ అనే స్థలార్థం ఉన్నప్పటికీ, ఈ సందర్భంలో ‘అతని దగ్గరనుండి’ అనేది సంబంధిత నిష్క్రమణను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אֱלֹהִים
  choice: దేవుడు
  rationale: రూపంలో బహువచనంలా ఉన్నా, ఇక్కడ ఏకవచన క్రియతో వచ్చి కథనంలో ఏకైక దేవుణ్ణి సూచిస్తుంది.
- source_word: בַּמָּקוֹם
  choice: స్థలంలోనే
  rationale: בְּ + מקום ఇక్కడ సంఘటన జరిగిన ప్రదేశాన్ని సూచిస్తుంది. ‘లోనే’ ఆ స్థలంతో వాక్యాన్ని సహజంగా అనుసంధానిస్తుంది; ‘నే’ మూలంలోని నొక్కిచెప్పడాన్ని వ్యాకరణపరంగా తప్పనిసరిగా సూచించదు, కానీ తెలుగు ప్రవాహాన్ని మెరుగుపరుస్తుంది.
- source_word: אֲשֶׁר
  choice: …న
  rationale: ‘స్థలం’ను విశేషించే సంబంధవాచక ఉపవాక్యాన్ని తెలుగులో సహజమైన క్రియావిశేషణ రూపంతో వ్యక్తం చేస్తుంది.
- source_word: דִּבֶּר אִתּוֹ
  choice: అతనితో మాట్లాడిన
  rationale: דבר పియేల్ క్రియ אֵת తో కలిసి ‘అతనితో మాట్లాడాడు’ అనే భావాన్ని ఇస్తుంది; ‘తో’ పరస్పర సంభాషణకు వీలున్న మూల నిర్మాణాన్ని కాపాడుతుంది.
theological_decisions:
- issue: దేవుని నిష్క్రమణకు సంబంధించిన స్థలాత్మక/మానవరూప వర్ణన
  choice: ‘అతని దగ్గరనుండి పైకి వెళ్లిపోయాడు’ అని పైదిశ కదలికను నిలుపడం
  alternative: ‘అతని దగ్గరనుండి వెళ్లిపోయాడు’ లేదా ‘అతనినుండి తొలగిపోయాడు’
  rationale: హీబ్రూ సాధారణ ఆరోహణ భాషను ఉపయోగిస్తుంది. దానిని నిలుపడం దర్శనానికి సంబంధించిన కథన చిత్రణను కాపాడుతుంది; దేవుని సన్నిధి స్వభావంపై వాక్యం చెప్పనిదాన్ని అనువాదం నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన కథన శైలి. మూలంలోని పైదిశ కదలికను కాపాడుతూ, ‘అతని మీదనుండి’ అనే అసహజ అక్షరానువాదాన్ని నివారించాం.
