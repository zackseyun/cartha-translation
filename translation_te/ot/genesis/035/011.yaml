revisions:
- from: 'దేవుడు అతనితో ఇలా అన్నాడు: “నేను సర్వశక్తిమంతుడైన దేవుణ్ణి[a]. నీవు ఫలించి విస్తరించు. ఒక జనమూ, జనాల సమూహమూ[b] నీ నుండి పుడతాయి; రాజులు నీ నడుము నుండి[c] వస్తారు.”'
  to: 'దేవుడు అతనితో ఇలా అన్నాడు: “నేను సర్వశక్తిమంతుడైన దేవుణ్ణి[a]. నీవు ఫలించి విస్తరించు. ఒక జనమూ, జనముల సమూహమూ[b] నీ నుండి ఉద్భవిస్తాయి; రాజులు నీ నడుము నుండి[c] వస్తారు.”'
  rationale: వాగ్దానంలోని జనము మరియు జనముల సమూహం ‘పుట్టడం’ కాక, యాకోబు నుండి వంశపరంగా ఉద్భవించడం అని చెప్పేందుకు ప్రధాన పాఠ్యాన్ని స్వల్పంగా సవరించాం. పాదటిప్పణి బి లోని పదరూపాన్ని ప్రధాన పాఠ్యంతో సరిపోల్చాం. మిగిలిన పదప్రయోగాలు మూలపాఠ్య భావం, గంభీర రిజిస్టర్, మరియు పాదటిప్పణుల ఉద్దేశాన్ని సరిగా నిలుపుతున్నాయి.
