id: GEN.35.11
reference: Genesis 35:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ ל֨/וֹ אֱלֹהִ֜ים אֲנִ֨י אֵ֤ל שַׁדַּי֙ פְּרֵ֣ה וּ/רְבֵ֔ה גּ֛וֹי וּ/קְהַ֥ל גּוֹיִ֖ם יִהְיֶ֣ה מִמֶּ֑/ךָּ וּ/מְלָכִ֖ים מֵ/חֲלָצֶ֥י/ךָ יֵצֵֽאוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/011.yaml
  text: And God said to him[a], “I am God Almighty. Be fruitful and multiply. A nation and an assembly of nations shall come from you[c][b], and kings shall come from your loins.”
translation:
  language: te
  text: 'దేవుడు అతనితో ఇలా అన్నాడు: “నేను సర్వశక్తిమంతుడైన దేవుణ్ణి[a]. నీవు ఫలించి విస్తరించు. ఒక జనమూ, జనముల సమూహమూ[b] నీ నుండి ఉద్భవిస్తాయి; రాజులు నీ నడుము నుండి[c] వస్తారు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో “ఎల్ షద్దయి”; సంప్రదాయంగా “సర్వశక్తిమంతుడైన దేవుడు” అని అనువదిస్తారు.
    reason: lexical_alternative
  - marker: b
    text: “జనముల సమూహము” అనే హీబ్రూ పదబంధానికి “జనముల సభ” లేదా “జనముల సమాజం” అనే భావమూ ఉండవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: అక్షరార్థంగా “నీ నడుము నుండి”; ఇది ఒకరి సొంత శరీరం నుండి కలిగే సంతానాన్ని సూచించే నుడికారం.
    reason: cultural_note
lexical_decisions:
- source_word: אֱלֹהִים
  choice: దేవుడు
  rationale: ఏకవచన క్రియతోను, ఇశ్రాయేలు దేవుడే మాట్లాడుతున్న కథన సందర్భంతోను ఇది ఏకవచన దైవబిరుదుగా అర్థమవుతుంది.
- source_word: אֵל שַׁדַּי
  choice: సర్వశక్తిమంతుడైన దేవుడు
  rationale: దైవబిరుదును లిప్యంతరీకరించకుండా అర్థవంతంగా అందించే సంప్రదాయ తెలుగు రూపం; మూలంలోని ‘ఎల్ షద్దయి’ రూపాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: פְּרֵה וּרְבֵה
  choice: ఫలించి విస్తరించు
  rationale: సృష్టి మరియు పితృపురుషుల ఆశీర్వాద సూత్రాన్ని ప్రతిధ్వనించే రెండు ఏకవచన ఆజ్ఞలను సహజమైన, స్థిరపడిన తెలుగు పదబంధంతో అందిస్తుంది.
- source_word: גּוֹי
  choice: జనము
  rationale: ఇక్కడ వాగ్దాన సందర్భంలో ఒక సమగ్ర ప్రజావర్గాన్ని సూచిస్తుంది; ‘జనము’ ప్రత్యక్షమైన, గంభీరమైన తెలుగు సమానం.
- source_word: קְהַל גּוֹיִם
  choice: జనాల సమూహము
  rationale: קהל లోని కూడిన సమూహం లేదా సభ భావాన్ని నిలుపుతూ ఆధునిక పాఠకులకు సహజంగా అర్థమయ్యే రూపం.
- source_word: יִהְיֶה מִמֶּךָּ
  choice: నీ నుండి పుడతాయి
  rationale: అక్షరార్థంగా ‘నీ నుండి అవుతుంది’; ఈ వంశావళి సందర్భంలో ‘పుడతాయి’ భౌతిక సంతతి భావాన్ని సహజ తెలుగులో స్పష్టం చేస్తుంది.
- source_word: מְלָכִים
  choice: రాజులు
  rationale: మూల నామవాచకానికి నేరమైన, సందర్భోచితమైన సమానం.
- source_word: מֵחֲלָצֶיךָ
  choice: నీ నడుము నుండి
  rationale: వ్యక్తి శరీరం నుండే కలిగే సంతానాన్ని సూచించే హీబ్రూ శరీరాధారిత నుడికారాన్ని సాధ్యమైనంత దగ్గరగా నిలుపుతుంది.
- source_word: יֵצֵאוּ
  choice: వస్తారు
  rationale: రాజులు అతని వంశంలో ఉద్భవిస్తారనే భావాన్ని సహజంగా తెలియజేస్తుంది; స్థలచలనాన్ని సూచించే అక్షరార్థ రూపాన్ని నివారిస్తుంది.
theological_decisions:
- issue: אֵל שַׁדַּי అనే దైవబిరుదు అనువాదం
  choice: సర్వశక్తిమంతుడైన దేవుడు
  alternative: ఎల్ షద్దయి
  rationale: బిరుదును అర్థంతో అనువదించడం సాధారణ పాఠకునికి స్పష్టతనిస్తుంది; హీబ్రూ రూపాన్ని పాదటిప్పణిలో ఇవ్వడం ద్వారా పదరూపం మరియు దాని అర్థంపై ఉన్న పరిమిత అనిశ్చితి రెండూ కనిపించేలా చేశాం.
- issue: వాగ్దానంలోని శారీరక వంశపారంపర్య భాష
  choice: నీ నుండి పుడతాయి / నీ నడుము నుండి వస్తారు
  alternative: నీ నుండి అవుతాయి / నీ సంతానంలో రాజులు ఉంటారు
  rationale: మొదటి భాగంలో సహజ తెలుగు వంశార్థాన్ని వాడుతూ, రెండో భాగంలో మూలంలోని స్పష్టమైన శరీర నుడికారాన్ని నిలిపాం; దీనివల్ల వాగ్దానపు భౌతిక వంశపారంపర్య కోణం మసకబారదు.
- issue: గּוֹי וּקְהַל גּוֹיִם లో ఏకవచన క్రియ
  choice: ఒక జనమూ, జనాల సమూహమూ నీ నుండి పుడతాయి
  alternative: ఒక జనమూ, జనాల సమూహమూ నీ నుండి పుడుతుంది
  rationale: హీబ్రూలో క్రియ ఏకవచనంలో ఉన్నప్పటికీ రెండు సమన్విత అంశాలు ఉన్నాయి. తెలుగులో బహువచన క్రియ సహజంగా ఉండి రెండింటినీ వాగ్దాన ఫలాలుగా చూపుతుంది; మూలంలోని భావసంబంధాన్ని మార్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజతతో కూడిన గంభీర శైలిని అనుసరించాం. ‘ఫలించి విస్తరించు’ అనే పరిచిత ఆశీర్వాద సూత్రాన్ని నిలిపి, ‘నీ నడుము నుండి’ అనే మూలంలోని శరీర నుడికారాన్ని పాదటిప్పణితో స్పష్టం చేశాం. అన్ని పాదటిప్పణి గుర్తులు ప్రధాన పాఠ్యంలో వరుసగా ఉన్నాయి.
