  revised_text: 'దేవుడు అతనితో ఇలా అన్నాడు: “నేను సర్వశక్తిమంతుడైన దేవుణ్ణి[a]. నీవు ఫలించి విస్తరించు. ఒక జనమూ, జనముల సమూహమూ[b] నీ నుండి ఉద్భవిస్తాయి; రాజులు నీ నడుము నుండి[c] వస్తారు.”'
