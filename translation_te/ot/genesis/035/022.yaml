id: GEN.35.22
reference: Genesis 35:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְהִ֗י בִּ/שְׁכֹּ֤ן יִשְׂרָאֵל֙ בָּ/אָ֣רֶץ הַ/הִ֔וא וַ/יֵּ֣לֶךְ רְאוּבֵ֔ן וַ/יִּשְׁכַּב֙ אֶת בִּלְהָה֙ פִּילֶ֣גֶשׁ אָבִ֔י/ו וַ/יִּשְׁמַ֖ע יִשְׂרָאֵ֑ל וַ/יִּֽהְי֥וּ בְנֵֽי יַעֲקֹ֖ב שְׁנֵ֥ים עָשָֽׂר־פ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/022.yaml
  text: And it happened[a], while Israel was dwelling in that land, that Reuben went and lay with Bilhah, his father's concubine, and Israel heard of it[b]. Now the sons of Jacob were twelve.
translation:
  language: te
  text: 'ఇశ్రాయేలు ఆ దేశంలో నివసిస్తున్నప్పుడు ఇలా జరిగింది: రూబేను వెళ్లి తన తండ్రి ఉపపత్ని బిల్హాతో శయనించాడు. ఇశ్రాయేలు ఆ సంగతి విన్నాడు[a]. యాకోబు కుమారులు పన్నెండుగురు[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “ఇశ్రాయేలు విన్నాడు.” కర్మ చెప్పబడలేదు; సందర్భంలో అది రూబేను చేసిన పనిని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: మరింత అక్షరార్థంగా, “మరియు యాకోబు కుమారులు పన్నెండుగురు.” ఈ వాక్యం తరువాతి వచనాల్లోని కుమారుల జాబితాకు మార్పుగా పనిచేస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: ఇలా జరిగింది
  rationale: సాధారణ హీబ్రూ కథన పరిణామ సూచనను పాతకాలపు తెలుగు ప్రయోగం లేకుండా సహజంగా తెలియజేస్తుంది.
- source_word: בִּשְׁכֹּן יִשְׂרָאֵל
  choice: ఇశ్రాయేలు ... నివసిస్తున్నప్పుడు
  rationale: בְּతో కూడిన infinitive construct నేపథ్యంగా కొనసాగుతున్న కాలసంబంధ పరిస్థితిని సూచిస్తుంది.
- source_word: בָּאָרֶץ הַהִוא
  choice: ఆ దేశంలో
  rationale: ఇక్కడ אָרֶץ భూమి మొత్తాన్ని కాక స్థానిక దేశాన్ని లేదా ప్రాంతాన్ని సూచిస్తుంది.
- source_word: וַיֵּלֶךְ
  choice: వెళ్లి
  rationale: రూబేను చేసిన చర్యకు ముందు మూలంలో ఉన్న ప్రత్యేక కథన క్రియను నిలుపుతుంది.
- source_word: וַיִּשְׁכַּב אֶת
  choice: తో శయనించాడు
  rationale: వ్యక్తితో వాడిన שׁכב లైంగిక సంబంధాన్ని సూచించే హీబ్రూ ప్రయోగం; ఈ అనువాదం మరీ అస్పష్టంగానో వైద్యపరంగా విస్తరించినట్టుగానో కాకుండా గంభీరంగా, నేరుగా ఉంటుంది.
- source_word: פִּילֶגֶשׁ
  choice: ఉపపత్ని
  rationale: ప్రాచీన కుటుంబ వ్యవస్థలో గుర్తింపు ఉన్నప్పటికీ భార్యకన్నా తక్కువ హోదా గల స్త్రీని సూచించే సంక్షిప్తమైన, స్థిరపడిన తెలుగు పదం.
- source_word: אָבִיו
  choice: తన తండ్రి
  rationale: రూబేనుతో సంబంధాన్ని తెలుగులో సహజమైన ఆత్మార్థక స్వామ్యరూపంతో స్పష్టం చేస్తుంది.
- source_word: וַיִּשְׁמַע יִשְׂרָאֵל
  choice: ఇశ్రాయేలు ఆ సంగతి విన్నాడు
  rationale: హీబ్రూలో కర్మ చెప్పకపోయినా అది రూబేను చేసిన పనినే సూచిస్తుంది; తెలుగులో సహజత కోసం ‘ఆ సంగతి’ చేర్చబడింది.
- source_word: וַיִּהְיוּ בְנֵי יַעֲקֹב שְׁנֵים עָשָׂר
  choice: యాకోబు కుమారులు పన్నెండుగురు
  rationale: తదుపరి కుమారుల జాబితాకు మార్పుగా ఉన్న సంఖ్యా ప్రకటనను సహజమైన తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: లైంగిక ప్రయోగాన్ని మరుగుపరచకుండా, అతిగా స్పష్టీకరించకుండా అనువదించడం
  choice: బిల్హాతో శయనించాడు
  alternative: బిల్హాతో పడుకున్నాడు; బిల్హాతో లైంగిక సంబంధం పెట్టుకున్నాడు
  rationale: మూలంలోని గంభీరతను, ప్రత్యక్షతను నిలుపుతూ సామాన్య నిద్ర అనే అపార్థాన్ని తగ్గిస్తుంది; అదే సమయంలో మూలం కంటే వైద్యపరంగా లేదా వివరణాత్మకంగా విస్తరించదు.
- issue: ఇశ్రాయేలు విన్నాడనే ప్రకటన తర్వాత అతని ప్రతిస్పందనను ఊహించకపోవడం
  choice: ఇశ్రాయేలు ఆ సంగతి విన్నాడు; ఆపై కుమారుల సంఖ్యను ప్రత్యేక పరివర్తన వాక్యంగా ఉంచడం
  alternative: ఇశ్రాయేలు మౌనానికి నైతిక, న్యాయపరమైన లేదా సిద్ధాంతపరమైన అర్థాన్ని జోడించడం
  rationale: మూలపాఠం ఇశ్రాయేలు విన్నాడని మాత్రమే చెబుతుంది; అతని ప్రతిస్పందనను పేర్కొనదు. కాబట్టి అనువాదం చెప్పని భావాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన కథన నిర్మాణాన్ని ఉపయోగించాం. ‘ఉపపత్ని,’ ‘శయనించాడు’ అనే పదాలు గంభీరమైన బైబిలు సందర్భానికి తగినవిగా ఉండి, సాధారణ పాఠకుడికి అర్థమయ్యే స్థాయిలో ఉన్నాయి. మూలంలోని ఆకస్మికంగా ముగిసే ‘ఇశ్రాయేలు విన్నాడు’ అనే ప్రకటనను ఎలాంటి ఊహాత్మక ప్రతిస్పందన లేకుండా నిలిపాం.
