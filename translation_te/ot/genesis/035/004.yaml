source:
  edition: WLC
  text: וַ/יִּתְּנ֣וּ אֶֽל יַעֲקֹ֗ב אֵ֣ת כָּל אֱלֹהֵ֤י הַ/נֵּכָר֙ אֲשֶׁ֣ר בְּ/יָדָ֔/ם וְ/אֶת הַ/נְּזָמִ֖ים אֲשֶׁ֣ר בְּ/אָזְנֵי/הֶ֑ם וַ/יִּטְמֹ֤ן אֹתָ/ם֙ יַעֲקֹ֔ב תַּ֥חַת הָ/אֵלָ֖ה אֲשֶׁ֥ר עִם שְׁכֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/004.yaml
  text: So they gave Jacob all the foreign gods that were in their hands[a], and the rings that were in their ears[b], and Jacob hid them under the terebinth that was near Shechem.
translation:
  language: te
  text: అప్పుడు వారు తమ దగ్గర ఉన్న అన్య దేవతలన్నిటినీ, తమ చెవుల్లో ఉన్న ఉంగరాలనూ[a] యాకోబుకు ఇచ్చారు. యాకోబు వాటిని షెకెము దగ్గర ఉన్న టెరెబింత్ చెట్టు[b] కింద దాచిపెట్టాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పదం ముక్కులోగానీ చెవుల్లోగానీ ధరించే ఉంగరాలను సూచించగలదు; ఇక్కడ తరువాతి పదబంధం అవి చెవుల్లో ఉన్నవని స్పష్టం చేస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘ఓకు చెట్టు’; హీబ్రూ పదం బహుశా మరింత నిర్దిష్టంగా టెరెబింత్ చెట్టును సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ אֶל־יַעֲקֹב
  choice: యాకోబుకు ఇచ్చారు
  rationale: נתן క్రియతో వచ్చిన אֶל పరోక్ష కర్మను సూచిస్తుంది. ‘యాకోబుకు ఇచ్చారు’ అనేది మూల భావాన్ని సహజమైన తెలుగు వాక్యనిర్మాణంలో అందిస్తుంది.
- source_word: כָּל־אֱלֹהֵי הַנֵּכָר
  choice: అన్య దేవతలన్నిటినీ
  rationale: ఈ పదబంధం ఇశ్రాయేలు దేవునికి చెందని ఇతర దేవతలను లేదా వాటి విగ్రహాలను సూచిస్తుంది. ‘అన్య దేవతలు’ అనేది స్పష్టమైన, సంప్రదాయభారం అధికంగా లేని సహజ తెలుగు ప్రయోగం.
- source_word: אֲשֶׁר בְּיָדָם
  choice: తమ దగ్గర ఉన్న
  rationale: అక్షరార్థంగా ‘వారి చేతిలో ఉన్న.’ ఇక్కడ స్వాధీనాన్ని సూచిస్తున్నందున ‘తమ దగ్గర ఉన్న’ అనేది ఆధునిక తెలుగులో సహజంగా ఉండి భావాన్ని కాపాడుతుంది.
- source_word: הַנְּזָמִים אֲשֶׁר בְּאָזְנֵיהֶם
  choice: తమ చెవుల్లో ఉన్న పోగులు
  rationale: נְזָמִים సాధారణంగా వివిధ చోట్ల ధరించే ఉంగరాలను సూచించగలదు; అయితే వెంటనే వచ్చే ‘వారి చెవుల్లో’ అనే మాట ఇక్కడ చెవి ఆభరణాలని నిర్దిష్టం చేస్తుంది.
- source_word: וַיִּטְמֹן אֹתָם
  choice: వాటిని దాచిపెట్టాడు
  rationale: טמן అంటే దాచడం, మరుగుపరచడం; కొన్ని సందర్భాల్లో పాతిపెట్టడం కూడా కావచ్చు. మూలంలోని విస్తృత అర్థాన్ని కాపాడటానికి ‘దాచిపెట్టాడు’ ఎంచుకోబడింది.
- source_word: תַּחַת הָאֵלָה
  choice: మస్తకి చెట్టు కింద
  rationale: אֵלָה సాధారణంగా టెరెబింత్ లేదా మస్తకి జాతి చెట్టును సూచిస్తుంది. ‘సిందూర వృక్షం/ఓకు’ కంటే వృక్షాన్ని మరింత నిర్దిష్టంగా తెలియజేయడానికి ‘మస్తకి చెట్టు’ వాడబడింది.
- source_word: אֲשֶׁר עִם שְׁכֶם
  choice: షెకెము దగ్గర ఉన్న
  rationale: స్థలనామంతో עִם ఇక్కడ సమీపాన్ని సూచిస్తుంది. ‘షెకెము దగ్గర’ అనేది ఆ స్థాన సంబంధాన్ని సహజంగా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: అప్పగించి దాచిన వస్తువుల స్వభావం
  choice: ‘అన్య దేవతలు’ మరియు చెవి పోగులను వేర్వేరు వస్తువులుగా పేర్కొని, పోగులకు విగ్రహారాధన సంబంధం ఉందని అదనంగా చెప్పలేదు.
  alternative: చెవి పోగులు తాయెత్తులు లేదా విగ్రహారాధనకు సంబంధించిన వస్తువులని స్పష్టీకరించడం.
  rationale: వచనం అన్య దేవతలను స్పష్టంగా గుర్తిస్తుంది; పోగులను మాత్రం విడిగా ప్రస్తావించి వాటి మతపరమైన ఉపయోగాన్ని వివరించదు. అందువల్ల మూలపాఠంలోని నియంత్రణను, సాధ్యమైన ఉద్విగ్నతను అలాగే ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన కథనశైలిని వాడాం. ‘అప్పుడు’ కథన క్రమాన్ని ముందుకు తీసుకువెళ్తుంది. ‘మస్తకి చెట్టు’ సాధారణ పాఠకుడికి కొంత అపరిచితమయ్యే అవకాశం ఉన్నందున పాదటిప్పణి ఇచ్చాం; ఆభరణాల స్వభావం లేదా ఆచారపరమైన పాత్ర గురించి మూలపాఠం చెప్పనిదాన్ని అనువాదంలో చేర్చలేదు.
