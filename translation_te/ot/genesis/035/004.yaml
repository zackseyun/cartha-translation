- from: అప్పుడు వారు తమ దగ్గర ఉన్న అన్య దేవతలన్నిటినీ, తమ చెవుల్లో ఉన్న పోగులనూ[a] యాకోబుకు ఇచ్చారు. యాకోబు వాటిని షెకెము దగ్గర ఉన్న మస్తకి చెట్టు[b] కింద దాచిపెట్టాడు.
