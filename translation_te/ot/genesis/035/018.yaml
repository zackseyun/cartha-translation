source:
  edition: WLC
  text: וַ/יְהִ֞י בְּ/צֵ֤את נַפְשָׁ/הּ֙ כִּ֣י מֵ֔תָה וַ/תִּקְרָ֥א שְׁמ֖/וֹ בֶּן אוֹנִ֑י וְ/אָבִ֖י/ו קָֽרָא ל֥/וֹ בִנְיָמִֽין־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/018.yaml
  text: And as her life was departing—for she was dying—she called his name Ben-oni[b][a]; but his father called him Benjamin.
translation:
  language: te
  text: ఆమె ప్రాణం విడిచిపోతుండగా—ఎందుకంటే ఆమె చనిపోతూ ఉంది—ఆమె అతనికి బెనోనీ[a] అని పేరు పెట్టింది; అయితే అతని తండ్రి అతనికి బెన్యామీను[b] అని పేరు పెట్టాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: బెనోనీ అనే పేరుకు బహుశా ‘నా దుఃఖపు కుమారుడు’ లేదా ‘నా వేదన కుమారుడు’ అని అర్థం.
    reason: lexical_alternative
  - marker: b
    text: బెన్యామీను అనే పేరుకు బహుశా ‘కుడిచేతి కుమారుడు’ అని అర్థం; కొందరు దాన్ని ‘దక్షిణ దిక్కు కుమారుడు’ అని అర్థం చేసుకుంటారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּצֵאת נַפְשָׁהּ
  choice: ఆమె ప్రాణం విడిచిపోతుండగా
  rationale: נֶפֶשׁ ఇక్కడ మరణ సందర్భంలో ‘ప్రాణం/జీవం’ అనే భావాన్ని ఇస్తుంది. సాంకేతిక మానవశాస్త్ర భావనను రుద్దకుండా, తెలుగులో సహజమైన ‘ప్రాణం విడిచిపోవడం’ అనే ప్రయోగం మూలంలోని కొనసాగుతున్న క్రియను కూడా నిలుపుతుంది.
- source_word: כִּי מֵתָה
  choice: ఎందుకంటే ఆమె చనిపోతూ ఉంది
  rationale: ఈ వాక్యభాగం ముందున్న ‘ప్రాణం విడిచిపోవడం’ను వివరిస్తుంది. పేరు పెట్టడం మరణం సంభవిస్తున్న సమయంలోనే జరిగినట్లు కథన ప్రవాహం సూచిస్తున్నందున కొనసాగుతున్న స్థితిగా అనువదించబడింది.
- source_word: וַתִּקְרָא שְׁמוֹ
  choice: ఆమె అతనికి ... అని పేరు పెట్టింది
  rationale: హీబ్రూ నామకరణ నుడికారాన్ని ఆధునిక తెలుగులో సహజంగా, స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: בֶּן אוֹנִי
  choice: బెనోనీ
  rationale: వ్యక్తి పేరును ప్రధాన పాఠ్యంలో లిప్యంతరీకరించి, కథనానికి ప్రాముఖ్యమైన దాని సంభావ్య అర్థాలను పాదసూచికలో ఇచ్చాం.
- source_word: וְאָבִיו קָרָא לוֹ
  choice: అయితే అతని తండ్రి అతనికి ... అని పేరు పెట్టాడు
  rationale: וְ ఇక్కడ తల్లి పెట్టిన పేరుకు తండ్రి పెట్టిన పేరు విరుద్ధంగా ఉండటాన్ని సూచిస్తుంది; ‘అయితే’ ఆ వ్యత్యాసాన్ని సహజ తెలుగులో స్పష్టం చేస్తుంది.
- source_word: בִנְיָמִין
  choice: బెన్యామీను
  rationale: తెలుగులో సుపరిచితమైన బైబిలు నామరూపాన్ని ఉపయోగించి, దాని సంభావ్య వ్యుత్పత్తి అర్థాలను పాదసూచికలో నిలిపాం.
theological_decisions:
- issue: మరణ సందర్భంలో נֶפֶשׁ పదానికి మానవ స్వభావ సంబంధమైన అర్థం
  choice: ప్రధాన పాఠ్యంలో ‘ప్రాణం’ అని అనువదించడం
  alternative: ‘ఆత్మ’
  rationale: נֶפֶשׁ జీవం, ప్రాణం లేదా జీవించి ఉన్న వ్యక్తిని సూచించగలదు; అది తప్పనిసరిగా శరీరాన్ని విడిచే అభౌతిక ఆత్మను గురించి సాంకేతిక ప్రకటన చేయదు. ‘ప్రాణం’ కథన భావాన్ని నిలుపుతూ వేదాంతపరమైన ప్రశ్నను అనవసరంగా పరిష్కరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. మూలంలోని వివరణాత్మక పునరుక్తిని దీర్ఘవిరామాలతో నిలిపి, రెండు నామకరణాల మధ్య వ్యత్యాసాన్ని ‘అయితే’తో స్పష్టం చేశాం.
