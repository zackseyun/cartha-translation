    rationale: యాకోబు ఎవరితో మాట్లాడాడో చెప్పే సందర్భంలో ‘ఇంటివారికీ ... వారందరికీ’ మరింత సహజమైన తెలుగు. ఇది మూలంలోని אֶל ... וְאֶל (‘కు/వద్దకు’) భావానికి కూడా దగ్గరగా ఉంటుంది.
