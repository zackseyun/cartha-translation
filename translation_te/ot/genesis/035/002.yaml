id: GEN.35.2
reference: Genesis 35:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יַעֲקֹב֙ אֶל בֵּית֔/וֹ וְ/אֶ֖ל כָּל אֲשֶׁ֣ר עִמּ֑/וֹ הָסִ֜רוּ אֶת אֱלֹהֵ֤י הַ/נֵּכָר֙ אֲשֶׁ֣ר בְּ/תֹכְ/כֶ֔ם וְ/הִֽטַּהֲר֔וּ וְ/הַחֲלִ֖יפוּ שִׂמְלֹתֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/002.yaml
  text: Then Jacob said to his household and to all who were with him[a], “Put away the foreign gods that are among you, purify yourselves[b], and change your clothes.”
translation:
  language: te
  text: 'అప్పుడు యాకోబు తన ఇంటివారికీ, తనతో ఉన్న వారందరికీ[a] ఇలా అన్నాడు: “మీ మధ్య ఉన్న అన్య దేవుళ్లను తొలగించండి; మిమ్మల్ని మీరు శుద్ధి చేసుకోండి[b], మీ బట్టలు మార్చుకోండి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘తనతో ఉన్న వారందరు’ అంటే యాకోబు వెంట ఉన్న ఇతర వ్యక్తులందరినీ సూచిస్తుంది.
    reason: contextual_note
  - marker: b
    text: ‘మిమ్మల్ని మీరు శుద్ధి చేసుకోండి’ అనేది దేవుని సమీపించడానికి సిద్ధపడే ఆచారపరమైన శుద్ధిని సూచించవచ్చు.
    reason: cultural_note
lexical_decisions:
- source_word: בֵּיתוֹ
  choice: తన ఇంటివారితో
  rationale: అక్షరార్థంగా ‘అతని ఇల్లు’ అయినా, ఇక్కడ భవనం కాక యాకోబు కుటుంబం మరియు గృహసమూహంలోని వ్యక్తులను సూచిస్తుంది; ‘ఇంటివారు’ ఆధునిక తెలుగులో సహజమైన సామాజిక అర్థాన్ని ఇస్తుంది.
- source_word: כָּל אֲשֶׁר עִמּוֹ
  choice: తనతో ఉన్న వారందరితో
  rationale: యాకోబుతో ప్రయాణిస్తున్న లేదా అతని సమూహంలో ఉన్న వ్యక్తులందరినీ సూచిస్తుంది; ఈ రూపం మూలంలోని విస్తృతిని సహజంగా నిలుపుతుంది.
- source_word: הָסִרוּ
  choice: తొలగించండి
  rationale: వారి మధ్య లేదా ఆధీనంలో ఉన్న దేవతా వస్తువులను తీసివేయాలనే ఆజ్ఞను నేరుగా, గౌరవప్రదంగా వ్యక్తపరుస్తుంది.
- source_word: אֱלֹהֵי הַנֵּכָר
  choice: అన్య దేవుళ్లు
  rationale: ఈ నిర్మాణం విదేశీయులకు చెందిన లేదా యెహోవా ఆరాధనకు పరమైన దేవుళ్లను సూచిస్తుంది. ‘అన్య దేవుళ్లు’ తెలుగు బైబిలు సందర్భంలో స్పష్టంగా, సంక్షిప్తంగా ఉంటుంది; ప్రత్యామ్నాయ భావాలను పాదసూచికలో ఉంచాం.
- source_word: בְּתֹכְכֶם
  choice: మీ మధ్య ఉన్న
  rationale: అక్షరార్థమైన ‘మీ మధ్య’ అనే భావాన్ని నిలుపుతూ, వారి సమాజంలో ఉండటం మరియు వారి ఆధీనంలో ఉండటం రెండింటినీ నిర్దిష్టం చేయకుండా అనుమతిస్తుంది.
- source_word: וְהִטַּהֲרוּ
  choice: మిమ్మల్ని మీరు శుద్ధి చేసుకొని
  rationale: హిత్పయేల్ రూపంలోని స్వప్రత్యావర్తక బలాన్ని నిలుపుతుంది. దేవుని సమీపించడానికి సిద్ధపడే ఆచార సంబంధ శుద్ధి కావచ్చనే భావాన్ని మితంగా సూచిస్తుంది.
- source_word: וְהַחֲלִיפוּ
  choice: మార్చుకోండి
  rationale: దుస్తుల సందర్భంలో ‘మార్చుకోవడం’ సహజమైన ఆధునిక తెలుగు; ఆజ్ఞార్థక బలాన్ని నిలుపుతుంది.
- source_word: שִׂמְלֹתֵיכֶם
  choice: మీ బట్టలు
  rationale: బాహ్య వస్త్రాలు లేదా దుస్తులను సూచించే సాధారణ, సులభంగా అర్థమయ్యే ఆధునిక తెలుగు పదబంధం.
theological_decisions:
- issue: శుద్ధి ఆజ్ఞ స్వభావం
  choice: ఆచారపరమైన లేదా నిబంధన సంబంధమైన శుద్ధి అయ్యే అవకాశాన్ని నిలుపుతూ ‘మిమ్మల్ని మీరు శుద్ధి చేసుకొని’ అని అనువదించడం.
  alternative: సాధారణ పరిశుభ్రతను ఎక్కువగా సూచించేలా ‘మిమ్మల్ని మీరు శుభ్రం చేసుకొని’ అని అనువదించడం.
  rationale: విగ్రహాలను తొలగించడం మరియు దేవుని దగ్గరకు వెళ్లడానికి సిద్ధపడటం అనే సందర్భం ఆచారపరమైన ప్రాధాన్యాన్ని సూచిస్తుంది. అయితే వచనం నిర్దిష్ట శుద్ధి విధానాన్ని చెప్పదు కాబట్టి అనువాదం అదనపు వివరాలను చేర్చదు.
- issue: אֱלֹהֵי הַנֵּכָר యొక్క సంబంధ భావం
  choice: ప్రధాన పాఠ్యంలో ‘అన్య దేవుళ్లు’ అని ఉంచి, భావంలోని ఇతర అవకాశాలను పాదసూచికలో తెలపడం.
  alternative: ‘విదేశీయుల దేవుళ్లు’ అని స్పష్టమైన స్వామ్య సంబంధంతో అనువదించడం.
  rationale: హెబ్రీ నిర్మాణం ‘అన్యమైన దేవుళ్లు,’ ‘విదేశీయుల దేవుళ్లు’ అనే సంబంధిత భావాలను అనుమతిస్తుంది. ప్రధాన అనువాదం సహజంగా ఉండగా పాదసూచిక నిజమైన పదార్థ వైవిధ్యాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ఆజ్ఞారూపాలు వాడబడ్డాయి. ‘ఇంటివారు,’ ‘బట్టలు’ సాధారణ పాఠకులకు సులభమైన పదాలు; ‘శుద్ధి’ సందర్భంలోని ఆచారపరమైన గంభీరతను నిలుపుతుంది. ప్రధాన పాఠ్యంలో [a], [b] గుర్తులు రెండూ వాటి సంబంధిత పదబంధాల వెంట ఉంచబడ్డాయి.
