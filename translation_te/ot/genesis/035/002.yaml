- from: 'అప్పుడు యాకోబు తన ఇంటివారితో, తనతో ఉన్న వారందరితో[a] ఇలా అన్నాడు: “మీ మధ్య ఉన్న అన్య దేవుళ్లను తొలగించండి; మిమ్మల్ని మీరు శుద్ధి చేసుకొని[b], మీ బట్టలు మార్చుకోండి.”'
  to: 'అప్పుడు యాకోబు తన ఇంటివారికీ, తనతో ఉన్న వారందరికీ[a] ఇలా అన్నాడు: “మీ మధ్య ఉన్న అన్య దేవుళ్లను తొలగించండి; మిమ్మల్ని మీరు శుద్ధి చేసుకోండి[b], మీ బట్టలు మార్చుకోండి.”'
  rationale: మూలంలోని మూడు ఆజ్ఞార్థక క్రియల సమాంతర బలాన్ని కాపాడటానికి ‘శుద్ధి చేసుకొని’ని ‘శుద్ధి చేసుకోండి’గా మార్చాం. సంబోధిత సమూహాన్ని సూచించే విభక్తిని ఆధునిక తెలుగుకు సహజంగా సవరించాం. పాదసూచిక aలో మూలంలో లేని ప్రయాణ-నిర్దిష్టతను తొలగించాం; మిగతా అర్థం, రిజిస్టర్, మరియు పాదసూచిక లంగర్లు యథాతథంగా కాపాడబడ్డాయి.
