  yaml_path: translation/ot/genesis/035/020.yaml
  text: And Jacob set up a pillar over her grave[a]. It is the pillar of Rachel’s grave to this day.
translation:
  language: te
  text: యాకోబు ఆమె సమాధిమీద ఒక స్తంభాన్ని నిలబెట్టాడు[a]. అది నేటివరకు రాహేలు సమాధి స్తంభమే.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘రాహేలు సమాధిని గుర్తించే రాయి’ లేదా ‘రాహేలు సమాధిని సూచించే స్తంభం.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּצֵּב
  choice: నిలబెట్టాడు
  rationale: హిఫిల్ రూపంలోని క్రియ ఇక్కడ ఒక నిలువురాయిని ఏర్పాటు చేయడం లేదా నిలబెట్టడం అనే భావాన్ని ఇస్తుంది; ఆధునిక తెలుగులో ‘నిలబెట్టాడు’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: מַצֵּבָה
  choice: ఒక స్తంభం
  rationale: ఈ నామవాచకం నిలువుగా ఉంచిన రాయి లేదా స్తంభాన్ని సూచిస్తుంది. ‘స్తంభం’ మూలంలోని స్పష్టమైన భౌతిక రూపాన్ని నిలుపుతుంది; ‘స్మారక రాయి’ ఉద్దేశాన్ని కొంత వ్యాఖ్యానాత్మకంగా తెలుపుతుంది.
- source_word: עַל קְבֻרָתָהּ
  choice: ఆమె సమాధిమీద
  rationale: עַל ఇక్కడ సమాధికి సంబంధించి స్తంభం ఉంచిన స్థానాన్ని సూచిస్తుంది; ‘సమాధిమీద’ సంక్షిప్తమైన, సహజమైన తెలుగు ప్రయోగం.
- source_word: קְבֻרָתָהּ
  choice: ఆమె సమాధి
  rationale: קבורה సమాధి లేదా పాతిపెట్టిన స్థలాన్ని సూచిస్తుంది. ‘సమాధి’ అనవసరంగా నిర్మితమైన పెద్ద గోరీ భావాన్ని చేర్చకుండా సాధారణంగా అర్థమవుతుంది.
- source_word: הִוא
  choice: అది
  rationale: ఈ సర్వనామం ముందున్న స్తంభాన్ని తిరిగి సూచిస్తుంది; తెలుగులో ‘అది’ నేరుగా ఆ సూచనను నిలుపుతుంది.
- source_word: מַצֶּבֶת קְבֻרַת רָחֵל
  choice: రాహేలు సమాధి స్తంభం
  rationale: హీబ్రూ సంయుక్త నామపదబంధంలోని సంబంధాన్ని సాధ్యమైనంత పారదర్శకంగా నిలుపుతూ తెలుగులో సహజంగా ఉండే రూపం.
- source_word: עַד הַיּוֹם
  choice: నేటివరకు
  rationale: కథకుని కాలం వరకు కొనసాగిన ఉనికిని తెలిపే హీబ్రూ నానుడికి ‘నేటివరకు’ సహజమైన తెలుగు సమానార్థకం.
