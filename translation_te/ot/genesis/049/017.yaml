source:
  edition: WLC
  text: יְהִי דָן֙ נָחָ֣שׁ עֲלֵי דֶ֔רֶךְ שְׁפִיפֹ֖ן עֲלֵי אֹ֑רַח הַ/נֹּשֵׁךְ֙ עִקְּבֵי ס֔וּס וַ/יִּפֹּ֥ל רֹכְב֖/וֹ אָחֽוֹר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/017.yaml
  text: Let Dan be a serpent by the road[a], a viper by the path, that bites the horse’s heels so that its rider falls backward.
translation:
  language: te
  text: 'దాను దారి పక్కన పాములా,

    బాట పక్కన విషసర్పంలా[a] ఉండుగాక;

    అది గుర్రపు మడమలను కరచి,

    గుర్రపు స్వారీవాడు వెనుకకు పడిపోతాడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘విషసర్పం’ అని అనువదించిన שְׁפִיפֹן అనే హెబ్రీ పదం అరుదైనది. ఇది ఏ పాముజాతిని సూచిస్తుందో ఖచ్చితంగా తెలియదు; సందర్భంలో మాత్రం ప్రమాదకరమైన పామును సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהִי
  choice: ఉండుగాక
  rationale: ఇది היה ధాతువు యొక్క ఆజ్ఞార్థక/కోరికను తెలిపే రూపం. యాకోబు ఆశీర్వాదంలోని కోరికతో కూడిన ప్రకటన భావాన్ని ‘ఉండుగాక’ సహజంగా నిలుపుతుంది.
- source_word: דָן
  choice: దాను
  rationale: యాకోబు కుమారుడు, తరువాత అతని గోత్రానికి సంబంధించిన వ్యక్తినామం; తెలుగులో స్థిరపడిన రూపాన్ని వాడాం.
- source_word: נָחָשׁ
  choice: పాము
  rationale: సాధారణంగా పామును సూచించే పదం. తరువాత వచ్చే మరింత నిర్దిష్టమైన అరుదైన సర్పపదంతో ఉన్న కవితాత్మక సమాంతరతను ఇది నిలుపుతుంది.
- source_word: עֲלֵי דֶרֶךְ
  choice: దారి పక్కన
  rationale: పాము దారికి ఆనుకొని మాటువేసి ఉన్న దృశ్యాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: שְׁפִיפֹן
  choice: విషసర్పం
  rationale: ఇది అరుదైన హెబ్రీ పదం; ఖచ్చితమైన సర్పజాతి తెలియదు. ప్రమాదకరమైన పాము అనే సందర్భార్థాన్ని ‘విషసర్పం’ స్పష్టంగా తెలియజేస్తుంది; జాతిని అతిగా నిర్దిష్టీకరించకుండా పాదటిప్పణి అనిశ్చితిని వెల్లడిస్తుంది.
- source_word: עֲלֵי אֹרַח
  choice: బాట పక్కన
  rationale: ముందున్న ‘దారి పక్కన’ అనే పదబంధానికి సమాంతరంగా ఉండి, דֶרֶךְ మరియు אֹרַח మధ్య ఉన్న కవితాత్మక పర్యాయభేదాన్ని ‘దారి/బాట’గా నిలుపుతుంది.
- source_word: הַנֹּשֵׁךְ
  choice: అది ... కరిస్తే
  rationale: సర్పాన్ని దాని చర్య ద్వారా వర్ణించే కృదంత భావాన్ని తెలుగులో సహజమైన షరతు-ఫలిత నిర్మాణంతో వ్యక్తపరుస్తుంది.
- source_word: עִקְּבֵי סוּס
  choice: గుర్రపు మడమలను
  rationale: గుర్రం వెనుక కాళ్ల మడమ భాగాన్ని సూచించే సమాసాన్ని సంక్షిప్తంగా, స్పష్టంగా అందిస్తుంది; ఏకవచన గుర్రం జాత్యర్థకంగా ఉంది.
- source_word: וַיִּפֹּל
  choice: పడిపోతాడు
  rationale: కాటు వల్ల కలిగే ఫలితాన్ని సహజంగా తెలియజేస్తుంది. ముందు ఉన్న ‘కరిస్తే’తో కారణ-ఫలిత సంబంధం స్పష్టమవుతుంది.
- source_word: רֹכְבוֹ
  choice: దాని రౌతు
  rationale: ప్రత్యయం సమీపంలోని గుర్రాన్ని సూచిస్తుంది. ‘దాని’ ఆ సంబంధాన్ని నిలుపుతుంది; ‘రౌతు’ గుర్రంపై స్వారీ చేసేవాణ్ణి సంక్షిప్తంగా సూచిస్తుంది.
- source_word: אָחוֹר
  choice: వెనక్కి
  rationale: రౌతు పడే దిశను ఆధునిక తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
