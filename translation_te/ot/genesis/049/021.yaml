source:
  edition: WLC
  text: נַפְתָּלִ֖י אַיָּלָ֣ה שְׁלֻחָ֑ה הַ/נֹּתֵ֖ן אִמְרֵי שָֽׁפֶר־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/021.yaml
  text: Naphtali is a doe let loose[b][a], giving beautiful words.
translation:
  language: te
  text: నఫ్తాలి స్వేచ్ఛగా విడిచిపెట్టబడిన ఆడజింక[a]; అతడు అందమైన మాటలు పలుకుతాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘విడిచిపెట్టబడిన ఆడలేడి’; హీబ్రూ రూపకం స్వేచ్ఛగా పరుగెత్తడానికి విడిచిన ఆడ జింకను చిత్రిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: చివరి వాక్యభాగానికి ప్రాచీన, ఆధునిక వ్యాఖ్యానాల్లో ఇతర అర్థాలూ ఉన్నాయి. వాటిలో ‘అందమైన పలుకులు పలికేవాడు’ అనే భావం, లేదా చివరి పదాలను వేరే అర్థంలో తీసుకొని ‘అందమైన పిల్లలను కంటుంది’ అనే భావం ఉన్నాయి.
    reason: alternative_reading
lexical_decisions:
- source_word: נַפְתָּלִי
  choice: నఫ్తాలి
  rationale: వ్యక్తి/గోత్ర నామాన్ని ఆధునిక ప్రామాణిక తెలుగు లిప్యంతరీకరణలో ఇచ్చాం.
- source_word: אַיָּלָה
  choice: ఆడజింక
  rationale: ఈ పదం ఆడ జింకను సూచిస్తుంది; స్త్రీలింగ జంతు రూపకాన్ని స్పష్టంగా, సహజంగా నిలుపుతుంది.
- source_word: שְׁלֻחָה
  choice: స్వేచ్ఛగా విడిచిపెట్టబడిన
  rationale: שלח ధాతువు నుంచి వచ్చిన నిష్క్రియ రూపం; పరుగెత్తడానికి విడిచిన జింక చిత్రాన్ని ‘స్వేచ్ఛగా’ అనే పదంతో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: הַנֹּתֵן
  choice: అతడు … పలుకుతాడు
  rationale: హీబ్రూలోని పుంలింగ ఏకవచన కృదంతం ‘నఫ్తాలి’ని సూచించవచ్చు. తెలుగులో కర్తను స్పష్టపరుస్తూనే, ఆడజింకతో ఉన్న వ్యాకరణ లింగ భేదాన్ని దాచలేదు.
- source_word: אִמְרֵי
  choice: మాటలు
  rationale: אמר పదపు బహువచన నిర్మాణరూపం పలికిన మాటలు లేదా వాక్కులను సూచిస్తుంది; ‘మాటలు’ సాధారణ పాఠకులకు సహజమైన విస్తృత పదం.
- source_word: שָׁפֶר
  choice: అందమైన
  rationale: అందం, శోభ లేదా మనోహరత్వాన్ని సూచించే కవితాత్మక భావాన్ని సులభమైన ఆధునిక తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: చివరి కృదంత వాక్యభాగపు కర్త
  choice: ‘అతడు అందమైన మాటలు పలుకుతాడు’ అని నఫ్తాలిని కర్తగా స్పష్టపరచడం
  alternative: ఆ వాక్యభాగాన్ని ఆడజింక రూపకానికే అన్వయించడం; లేదా చివరి పదాలకు వేరొక అర్థం ప్రతిపాదించి ‘అందమైన పిల్లలను కంటుంది’ అని చదవడం
  rationale: మసొరేటిక్ స్వరచిహ్నాలతో ఉన్న పాఠం ‘అందమైన మాటలు ఇచ్చేవాడు’ అనే భావానికి మద్దతిస్తుంది; పుంలింగ కృదంతం నఫ్తాలిని సూచించగలదు. అయితే కవితా వాక్యనిర్మాణం సంక్షిప్తంగా, కొంత సందిగ్ధంగా ఉన్నందున ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన కవితా ధోరణితో పాటు సాధారణ పాఠకుడికి అర్థమయ్యే పదజాలం. హీబ్రూ పుంలింగ కృదంతం వల్ల చివరి భాగంలో ‘అతడు’ వాడి, రూపకంలోని ఆడజింకతో దానిని వ్యాకరణపరంగా కలిపివేయకుండా చూశాం.
