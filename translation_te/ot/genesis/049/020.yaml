  yaml_path: translation/ot/genesis/049/020.yaml
  text: Asher's food will be rich[a], and he will provide royal delicacies.
translation:
  language: te
  text: ఆషేరు ఆహారం సమృద్ధిగా ఉంటుంది[a]; అతడు రాజుకు తగిన రుచికరమైన వంటకాలను అందిస్తాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆషేరు రొట్టె సమృద్ధిగా ఉంటుంది; అతడు రాజు యొక్క రుచికరమైన పదార్థాలను ఇస్తాడు.”
    reason: לֶחֶםకు ‘రొట్టె,’ שְׁמֵנָהకు ‘కొవ్వుగా/సమృద్ధిగా,’ మరియు మַעֲדַנֵּי מֶלֶךְకు ‘రాజు యొక్క రుచికరమైన పదార్థాలు’ అనే అక్షరార్థానికి దగ్గరైన ప్రత్యామ్నాయాలను సూచిస్తుంది.
lexical_decisions:
- source_word: מֵאָשֵׁר
  choice: ఆషేరు ఆహారం
  rationale: מִן ఉపసర్గ మూలం లేదా ప్రాంతాన్ని సూచించినా, క్రియలేని ఈ కవితా వాక్యంలో ఆషేరు గోత్రపు భూభాగం నుండి లభించే ఆహారాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: שְׁמֵנָה
  choice: పుష్టిగా
  rationale: మూలపదం అక్షరార్థంగా కొవ్వుదనం, సమృద్ధి, శ్రేష్ఠతను సూచిస్తుంది. ఆహార సందర్భంలో ‘పుష్టిగా’ సహజంగా ఉండి, సమృద్ధమైన నాణ్యతను తెలియజేస్తుంది.
- source_word: לַחְמוֹ
  choice: ఆహారం
  rationale: לֶחֶם ప్రాథమికంగా ‘రొట్టె’ అయినా, విస్తృతంగా ఆహారం లేదా జీవనోపాధిని సూచించగలదు; తరువాతి పాదంలోని విందుపదార్థాలకు సమాంతరంగా ఇక్కడ ‘ఆహారం’ సముచితం.
- source_word: וְהוּא
  choice: అతడు
  rationale: స్వతంత్ర సర్వనామం ఆషేరును ఉద్ఘాటిస్తూ తిరిగి విషయంగా చూపుతుంది; ‘అతడు’ ఆ వ్యక్తీకరణను నిలుపుతుంది.
- source_word: יִתֵּן
  choice: అందిస్తాడు
  rationale: נָתַן అక్షరార్థంగా ‘ఇస్తాడు’; శ్రేష్ఠ ఆహారాన్ని సమకూర్చే సందర్భంలో ‘అందిస్తాడు’ సహజమైన తెలుగు.
- source_word: מַעֲדַנֵּי מֶלֶךְ
  choice: రాజభోగమైన విందుపదార్థాలను
  rationale: నిర్మాణం అక్షరార్థంగా ‘రాజు యొక్క రుచికర పదార్థాలు’; ‘రాజభోగమైన విందుపదార్థాలు’ రాజుకు తగిన శ్రేష్ఠమైన ఆహారాన్ని స్పష్టంగా తెలియజేస్తుంది.
