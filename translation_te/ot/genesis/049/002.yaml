  yaml_path: translation/ot/genesis/049/002.yaml
  text: Gather yourselves and listen[a], sons of Jacob; listen to Israel your father.
translation:
  language: te
  text: 'యాకోబు కుమారులారా, సమకూడి వినండి;

    మీ తండ్రియైన ఇశ్రాయేలును వినండి.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “యాకోబు కుమారులారా, కూడి రండి, ఆలకించండి; మీ తండ్రియైన ఇశ్రాయేలును ఆలకించండి.” హీబ్రూలో ‘వినండి’ అనే ఆజ్ఞ రెండుసార్లు వచ్చి ఉద్ఘాటనను కలిగిస్తుంది; ‘ఆలకించండి’ అనేది మరింత అధికారికమైన ప్రత్యామ్నాయం.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִקָּבְצוּ
  choice: కూడి రండి
  rationale: קבץ అనే ధాతువు నిఫల్ ఆజ్ఞార్థక బహువచనంలో ఉంది; కుమారులు ఒకచోట సమకూడాలని పిలుస్తోంది. ఆధునిక తెలుగులో ‘కూడి రండి’ సహజంగా ఉండి ఆ సమాహ్వాన భావాన్ని తెలియజేస్తుంది.
- source_word: שִׁמְעוּ
  choice: వినండి
  rationale: ఇక్కడ ఆజ్ఞ కేవలం శబ్దం వినడాన్ని కాక శ్రద్ధగా ఆలకించడాన్ని సూచిస్తుంది. ‘వినండి’ తెలుగు సందర్భంలో ఆ రెండింటినీ సహజంగా మోస్తుంది.
- source_word: בְּנֵי יַעֲקֹב
  choice: యాకోబు కుమారులారా
  rationale: హీబ్రూ పదబంధం స్పష్టంగా పురుష బహువచనంలో యాకోబు కుమారులను సంబోధిస్తుంది; సంబోధన విభక్తి తెలుగు వాక్యానికి సహజత్వం ఇస్తుంది.
- source_word: שִׁמְעוּ אֶל
  choice: మాట వినండి
  rationale: שׁמע + אֶל ఇక్కడ వ్యక్తి చెప్పేదాన్ని శ్రద్ధగా ఆలకించమనే భావం ఇస్తుంది. తెలుగులో ‘ఇశ్రాయేలు మాట వినండి’ అనే రూపం ఆ వ్యక్తివైపు శ్రద్ధ మళ్లించడాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: יִשְׂרָאֵל
  choice: ఇశ్రాయేలు
  rationale: యాకోబుకు సంబంధించిన రెండవ పేరును ప్రత్యేకంగా నిలుపుతూ, తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించబడింది.
- source_word: אֲבִיכֶם
  choice: మీ తండ్రి
  rationale: రెండవ పురుష బహువచన స్వామ్యార్థాన్ని నేరుగా తెలియజేస్తుంది; ‘ఇశ్రాయేలు’కు విశేషణసమాన వివరణగా ఉంచబడింది.
theological_decisions:
- issue: యాకోబు / ఇశ్రాయేలు అనే సమాంతర పేర్ల అనువాదం
  choice: ‘యాకోబు కుమారులారా ... మీ తండ్రి ఇశ్రాయేలు’ అంటూ రెండు పేర్లనూ వేరువేరుగా నిలుపుట
  alternative: సరళత కోసం రెండింటినీ ఒకే పేరుగా మార్చుట
  rationale: మూల హీబ్రూ కవితాత్మక సమాంతర నిర్మాణంలో రెండు పేర్లను ఉద్దేశపూర్వకంగా వాడింది. వాటిని ఏకరీకరించకుండా ఉంచడం ఆ అలంకారాన్నీ సంధి-సంబంధ ప్రతిధ్వనినీ కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన సంబోధనను ఉపయోగించాం. మూలంలోని కవితాత్మక పునరుక్తిని ప్రధాన వాక్యంలో రెండుసార్లు ‘వినండి’ అని నిలిపి, యాకోబు–ఇశ్రాయేలు పేర్ల సమాంతరతను కాపాడాం.
