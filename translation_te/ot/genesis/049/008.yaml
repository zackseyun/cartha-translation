source:
  edition: WLC
  text: יְהוּדָ֗ה אַתָּה֙ יוֹד֣וּ/ךָ אַחֶ֔י/ךָ יָדְ/ךָ֖ בְּ/עֹ֣רֶף אֹיְבֶ֑י/ךָ יִשְׁתַּחֲוּ֥וּ לְ/ךָ֖ בְּנֵ֥י אָבִֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/008.yaml
  text: Judah[a], your brothers will praise you; your hand will be on the neck of your enemies[b]; the sons of your father will bow down to you.
translation:
  language: te
  text: యూదా,[a] నీ సహోదరులు నిన్ను స్తుతిస్తారు; నీ చెయ్యి నీ శత్రువుల మెడపై ఉంటుంది; నీ తండ్రి కుమారులు నీకు వంగి నమస్కరిస్తారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నిన్ను స్తుతిస్తారు’ అనే హీబ్రూ క్రియకు ‘నీకు కృతజ్ఞత తెలుపుతారు’ లేదా ‘నిన్ను ఘనంగా అంగీకరిస్తారు’ అనే భావాలు కూడా ఉండవచ్చు. ఇక్కడ అది ‘యూదా’ అనే పేరుతో పదప్రయోగాన్ని ఏర్పరుస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוּדָה
  choice: యూదా
  rationale: వ్యక్తి పేరును ఆధునిక ప్రామాణిక తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించాం; పేరుకూ తరువాతి క్రియకూ ఉన్న హీబ్రూ పదప్రయోగ సంబంధాన్ని పాదసూచికలో సూచించాం.
- source_word: יוֹדוּךָ
  choice: నిన్ను స్తుతిస్తారు
  rationale: ידה అనే క్రియకు కృతజ్ఞత చెప్పడం, అంగీకరించడం, స్తుతించడం వంటి భావాలు ఉండగలవు. ఆశీర్వాద సందర్భంలోనూ యూదా పేరుతో ఉన్న పదప్రయోగంలోనూ ‘స్తుతిస్తారు’ సహజంగా సరిపోతుంది.
- source_word: אַחֶיךָ
  choice: నీ సహోదరులు
  rationale: హీబ్రూలోని పురుష బహువచన రూపాన్ని, యాకోబు కుమారుల తక్షణ కుటుంబ సందర్భాన్ని నిలిపే గౌరవప్రదమైన ఆధునిక పదబంధం.
- source_word: יָדְךָ
  choice: నీ చెయ్యి
  rationale: అధికారాన్ని, జయాన్ని సూచించే స్పష్టమైన శరీర రూపకాన్ని వ్యాఖ్యానంగా మార్చకుండా యథాతథంగా ఉంచాం.
- source_word: בְּעֹרֶף אֹיְבֶיךָ
  choice: నీ శత్రువుల మెడపై
  rationale: עֹרֶף అంటే మెడ లేదా మెడ వెనుక భాగం. శత్రువులపై విజయం, ఆధిపత్యం అనే చిత్రాన్ని ‘మెడపై’ స్పష్టంగా నిలుపుతుంది.
- source_word: יִשְׁתַּחֲווּ לְךָ
  choice: నీకు వంగి నమస్కరిస్తారు
  rationale: ఈ క్రియ సందర్భానుసారం సాష్టాంగపడడం, గౌరవంతో వంగడం, ఆరాధించడం అని సూచించగలదు. ఇక్కడ మానవ పాలకునికి కుటుంబ సభ్యులు చూపే విధేయ గౌరవమే సందర్భోచితం; ‘వంగి నమస్కరిస్తారు’ శారీరక చర్యనూ గౌరవాన్నీ నిలుపుతుంది.
- source_word: בְּנֵי אָבִיךָ
  choice: నీ తండ్రి కుమారులు
  rationale: ‘నీ తండ్రి కుమారులు’ అనే మూలంలోని నిర్దిష్ట కుటుంబ భాషను సహజమైన తెలుగులో నేరుగా నిలిపాం.
theological_decisions:
- issue: יִשְׁתַּחֲווּ לְךָ లోని నమస్కార భాష స్వరూపం
  choice: మానవునికి విధేయతతో, గౌరవంతో వంగి నమస్కరించడం
  alternative: దైవారాధన భావంలో ఆరాధించడం
  rationale: యాకోబు ఆశీర్వాదంలో సంబోధించబడుతున్నవాడు యూదా. కాబట్టి ఇక్కడి క్రియను దైవారాధనగా నిర్ధారించకుండా, రాజసంబంధమైన గౌరవం మరియు విధేయతను తెలిపేలా అనువదించాం; క్రియలోని బలమైన శారీరక వంగడాన్ని మాత్రం నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే ఆశీర్వాద వాక్యానికి తగిన గౌరవప్రదమైన శైలిలో అనువదించాం. ‘చెయ్యి’, ‘మెడపై’ అనే స్పష్టమైన రూపకాలను నిలిపి, ‘వంగి నమస్కరిస్తారు’ ద్వారా ఆరాధన అనే అనవసర సిద్ధాంతార్థాన్ని మోపకుండా విధేయ గౌరవాన్ని వ్యక్తపరిచాం.
