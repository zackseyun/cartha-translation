source:
  edition: WLC
  text: חַכְלִילִ֥י עֵינַ֖יִם מִ/יָּ֑יִן וּ/לְבֶן שִׁנַּ֖יִם מֵ/חָלָֽב־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/012.yaml
  text: His eyes are darker than wine[b][a], and his teeth whiter than milk.
translation:
  language: te
  text: ద్రాక్షారసం వల్ల అతని కళ్లు ఎర్రగా ఉంటాయి; పాలు వల్ల అతని పళ్లు తెల్లగా ఉంటాయి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతని కళ్లు ద్రాక్షారసం కంటే ముదురుగా ఉంటాయి; అతని పళ్లు పాల కంటే తెల్లగా ఉంటాయి.” అరుదైన హీబ్రూ విశేషణం חַכְלִילִי అనే పదాన్నీ, מִן అనే ఉపసర్గనూ తులనార్థంలో కూడా అర్థం చేసుకోవచ్చు.
    reason: lexical_and_grammatical_alternative
lexical_decisions:
- source_word: חַכְלִילִי
  choice: ఎర్రగా
  rationale: ఈ అరుదైన విశేషణం కళ్ల వర్ణాన్ని సూచిస్తుంది. సామెతలు 23:29లోని సంబంధిత రూపం, ముందటి వచనంలోని ద్రాక్షారస సమృద్ధి, అలాగే ఇక్కడి సమాంతర నిర్మాణం దృష్ట్యా ‘ఎర్రగా’ అనే అర్థాన్ని ప్రధాన పాఠ్యంలో ఎంచుకున్నాం; ‘ముదురుగా/మెరుస్తూ’ అనే భావాలు కూడా సాధ్యమే.
- source_word: עֵינַיִם
  choice: కళ్లు
  rationale: కళ్లను సూచించే ద్వివచన నామవాచకానికి సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: מִיָּיִן
  choice: ద్రాక్షారసం వల్ల
  rationale: מִן అనే ఉపసర్గ మూలం లేదా కారణాన్ని సూచించగలదు. 11వ వచనంలోని ద్రాక్షారస సమృద్ధి నేపథ్యం, חַכְלִילִיతో దాని అనుబంధం వల్ల ఇక్కడ కారణార్థాన్ని ప్రధానంగా తీసుకున్నాం; తులనార్థం కూడా సాధ్యమని పాదటీకలో ఉంచాం.
- source_word: וּלְבֶן
  choice: తెల్లగా ఉంటాయి
  rationale: ‘తెల్లని’ అనే విశేషణాత్మక భావాన్ని తెలుగులో పూర్తి, సహజమైన వాక్యంగా వ్యక్తం చేయడానికి ‘తెల్లగా ఉంటాయి’ అని ఇచ్చాం.
- source_word: שִׁנַּיִם
  choice: పళ్లు
  rationale: దంతాలను సూచించే ద్వివచన నామవాచకానికి సాధారణ ఆధునిక తెలుగు పదం.
- source_word: מֵחָלָב
  choice: పాలు వల్ల
  rationale: మొదటి పాదానికి సమాంతరంగా מִן‌ను కారణం లేదా మూలాన్ని సూచించేదిగా అనువదించాం. తులనార్థ పఠనాన్ని పాదటీకలో సంరక్షించాం.
theological_decisions:
- issue: ఈ పద్యం మత్తును వర్ణిస్తుందా, లేక సమృద్ధిని వర్ణిస్తుందా?
  choice: ద్రాక్షారసం, పాలు సమృద్ధిగా ఉండడం వల్ల కలిగే వర్ణచిత్రంగా అనువదించాం.
  alternative: కేవలం మత్తు లేదా వ్యక్తిగత శారీరక లక్షణాన్ని సూచించే వర్ణనగా చదవవచ్చు.
  rationale: 49:11లోని ద్రాక్షారస సమృద్ధి ఈ వచనానికి తక్షణ నేపథ్యం. అయితే అనువాదంలో అదనపు వ్యాఖ్యానాన్ని చేర్చకుండా, మూలంలోని చిత్రణనే ఉంచాం.
translation_notes:
  register: సామాన్య పాఠకులకు అర్థమయ్యే ఆధునిక ప్రామాణిక తెలుగును, కవితాత్మక సమాంతరతను కాపాడే సంక్షిప్త వాక్య నిర్మాణాన్ని ఉపయోగించాం. ‘వైన్’ బదులు బైబిలు సందర్భానికి స్పష్టమైన ‘ద్రాక్షారసం’ వాడాం.
