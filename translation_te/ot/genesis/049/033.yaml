revisions:
- from: యాకోబు తన కుమారులకు ఆజ్ఞలు ఇవ్వడం ముగించిన తరువాత, తన కాళ్లను మంచం మీదికి లాక్కొని[a], తుదిశ్వాస విడిచాడు; తన ప్రజల దగ్గరకు చేర్చబడ్డాడు[b].
  to: యాకోబు తన కుమారులకు ఆజ్ఞాపించడం ముగించిన తరువాత, తన కాళ్లను మంచంపైకి చేర్చుకుని[a], తుదిశ్వాస విడిచాడు; తన ప్రజలతో కూడి చేర్చబడ్డాడు[b].
  rationale: ప్రధాన సవరణలు హీబ్రూ దిశా-భావాన్ని, స్థిర మరణ-నుడికారాన్ని మరింత స్పష్టంగా నిలుపుతాయి. ‘మంచంపైకి చేర్చుకుని’ אָסַף యొక్క మృదువైన సేకరణ/చేర్పు భావాన్ని కాపాడుతుంది. చివరి పదబంధంలో ‘తన ప్రజలతో కూడి చేర్చబడ్డాడు’ అనేది וַיֵּאָסֶף אֶל עַמָּיו యొక్క నిష్క్రియత, నుడికార స్వభావం, మరియు మరణానంతర భావంలోని నిర్వచించని ఉద్రిక్తతను నిలుపుతుంది. పాదసూచిక aలో ఉన్న అస్పష్టమైన ‘దగ్గరకు’ ప్రత్యామ్నాయాన్ని తొలగించాం.
