id: GEN.49.33
reference: Genesis 49:33
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְכַ֤ל יַעֲקֹב֙ לְ/צַוֺּ֣ת אֶת בָּנָ֔י/ו וַ/יֶּאֱסֹ֥ף רַגְלָ֖י/ו אֶל הַ/מִּטָּ֑ה וַ/יִּגְוַ֖ע וַ/יֵּאָ֥סֶף אֶל עַמָּֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/033.yaml
  text: When Jacob finished commanding his sons[a], he drew his feet up into the bed, breathed his last[b], and was gathered to his people.
translation:
  language: te
  text: యాకోబు తన కుమారులకు ఆజ్ఞాపించడం ముగించిన తరువాత, తన కాళ్లను మంచంపైకి చేర్చుకుని[a], తుదిశ్వాస విడిచాడు; తన ప్రజలతో కూడి చేర్చబడ్డాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “తన కాళ్లను మంచంపైకి చేర్చుకున్నాడు.” హీబ్రూలో ఇక్కడ ‘చేర్చు/సమకూర్చు’ అనే క్రియ వాడబడింది.
    reason: lexical_alternative
  - marker: b
    text: “తన ప్రజలతో కూడి చేర్చబడటం” అనేది మరణంతోనూ తనవారితో కలయికతోనూ ముడిపడిన హీబ్రూ నుడికారం. ఇది కేవలం సమాధి చేయబడ్డాడనే ప్రకటన కాదు.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְכַל
  choice: ముగించిన తరువాత
  rationale: כלה క్రియ యాకోబు తన కుమారులకు చెప్పవలసినదాన్ని పూర్తిచేసిన తరువాత జరిగిన వరుస చర్యలను సూచిస్తుంది; ఆధునిక తెలుగులో ఈ రూపం సహజంగా ఆ కథన క్రమాన్ని తెలియజేస్తుంది.
- source_word: לְצַוֹּת
  choice: ఆజ్ఞలు ఇవ్వడం
  rationale: צוה అంటే ఆజ్ఞాపించడం లేదా గంభీరంగా నిర్దేశించడం. ఇక్కడ యాకోబు తన కుమారులకు ఇచ్చిన చివరి నిర్దేశాలను సూచించేలా, మూలానికి దగ్గరగా ఉండే సహజ తెలుగు ప్రయోగాన్ని ఎంచుకున్నాం.
- source_word: בָּנָיו
  choice: తన కుమారులకు
  rationale: హీబ్రూ పదం స్పష్టంగా కుమారులను సూచిస్తుంది; సందర్భంలోనూ యాకోబు కుమారులే ఉద్దేశించబడ్డారు.
- source_word: וַיֶּאֱסֹף רַגְלָיו אֶל הַמִּטָּה
  choice: తన కాళ్లను మంచం మీదికి లాక్కొని
  rationale: אָסַף అక్షరార్థంగా ‘సమకూర్చు/చేర్చు’ అయినా, ఇక్కడ మంచం పక్కన లేదా అంచున ఉన్న కాళ్లను తిరిగి మంచం మీదికి తీసుకునే శారీరక చర్యను సూచిస్తుంది. ‘లాక్కొని’ ఆధునిక తెలుగులో ఆ కదలికను సహజంగా తెలియజేస్తుంది; అక్షరార్థ రూపాన్ని పాదసూచికలో ఉంచాం.
- source_word: הַמִּטָּה
  choice: మంచం
  rationale: מִטָּה మంచం లేదా పడకను సూచించగలదు. మరణశయ్య సందర్భంలో ‘మంచం’ సూటిగా, సాధారణ పాఠకులకు సహజంగా ఉంటుంది.
- source_word: וַיִּגְוַע
  choice: తుదిశ్వాస విడిచాడు
  rationale: גוע మరణించడం, ప్రాణం విడవడం అనే భావాన్ని కలిగిస్తుంది. ‘తుదిశ్వాస విడిచాడు’ దాని ప్రత్యేక భావాన్ని నిలుపుతూ, తరువాతి ‘చేర్చబడ్డాడు’ అనే వాక్యభాగంతో కలిపివేయకుండా ఉంచుతుంది.
- source_word: וַיֵּאָסֶף אֶל עַמָּיו
  choice: తన ప్రజల దగ్గరకు చేర్చబడ్డాడు
  rationale: ఈ సంప్రదాయ హీబ్రూ నుడికారం మరణాన్నీ, తనవారి వద్దకు చేర్చబడటాన్నీ సూచిస్తుంది. దాన్ని కేవలం సమాధి చేయడంగా లేదా స్పష్టంగా ‘పూర్వీకులను చేరుకోవడం’గా వ్యాఖ్యానించకుండా, మూలంలోని రూపకాన్నీ అనిశ్చితినీ నిలిపాం.
theological_decisions:
- issue: ‘తన ప్రజల దగ్గరకు చేర్చబడ్డాడు’ అనే మాట యొక్క అర్థం
  choice: దాన్ని కేవలం సమాధి సూచనగా మార్చకుండా హీబ్రూ నుడికారాన్ని నిలుపుట
  alternative: తన పూర్వీకులతో సమాధి చేయబడ్డాడు; తన పితరులను చేరుకున్నాడు
  rationale: యాకోబు సమాధి చేయబడటం తరువాతి అధ్యాయంలో జరుగుతుంది. కాబట్టి ఈ మాటను సమాధి చేయడమేనని కుదించడం పాఠ్య క్రమానికి సరిపోదు. అలాగే మరణానంతర స్థితిని అవసరానికి మించి నిర్వచించకుండా, మరణం, తనవారు, వారితో చేర్చబడటం మధ్య ఉన్న మూలపాఠ్య భావ ఉద్రిక్తతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే కథనశైలిని వాడాం. వరుస హీబ్రూ క్రియల ప్రవాహాన్ని ‘తరువాత… లాక్కొని… విడిచాడు; … చేర్చబడ్డాడు’ అనే నిర్మాణంతో నిలిపాం. రెండు పాదసూచిక గుర్తులూ అవి వివరిస్తున్న పదబంధాల వెంటనే ఉంచబడ్డాయి.
