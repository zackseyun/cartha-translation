source:
  edition: WLC
  text: מֵ/אֵ֨ל אָבִ֜י/ךָ וְ/יַעְזְרֶ֗/ךָּ וְ/אֵ֤ת שַׁדַּי֙ וִ/יבָ֣רְכֶ֔/ךָּ בִּרְכֹ֤ת שָׁמַ֨יִם֙ מֵ/עָ֔ל בִּרְכֹ֥ת תְּה֖וֹם רֹבֶ֣צֶת תָּ֑חַת בִּרְכֹ֥ת שָׁדַ֖יִם וָ/רָֽחַם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/025.yaml
  text: by the God of your father[a], who will help you, and by the Almighty, who will bless you with blessings of heaven above, blessings of the deep lying beneath[b], blessings of breasts and womb.
translation:
  language: te
  text: 'నీ తండ్రియైన దేవునివల్ల—ఆయన నీకు సహాయం చేస్తాడు—

    సర్వశక్తిమంతునివల్ల—ఆయన నిన్ను ఆశీర్వదిస్తాడు—[a]

    పైనున్న ఆకాశపు ఆశీర్వాదాలతో,

    కింద పడి ఉన్న అగాధపు ఆశీర్వాదాలతో,[b]

    స్తనాల, గర్భాశయపు ఆశీర్వాదాలతో.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీ తండ్రియైన దేవుని నుండి … సర్వశక్తిమంతునితో.” ‘సర్వశక్తిమంతుడు’ అనే మాటను ‘నీ తండ్రియైన దేవుడు’ అనే మాటకు సమీప అన్వయంగా కూడా గ్రహించవచ్చు. హీబ్రూలోని ఉపసర్గలు, దాని ముందున్న కణం సంక్షిప్తంగా ఉండడం వల్ల మూలం, కార్యసాధకత్వం లేదా సమీప అన్వయం సాధ్యమవుతాయి.
    reason: alternative_reading
  - marker: b
    text: లేదా, “కింద పొంచివున్న అగాధపు.” హీబ్రూ క్రియకు ‘పడి ఉండడం’ లేదా ‘పొంచివుండడం’ అనే అర్థాలు రావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵאֵל
  choice: దేవునివల్ల
  rationale: מִן ఉపసర్గ ఇక్కడ మూలం లేదా కార్యసాధకత్వాన్ని సూచించగలదు. ‘దేవునివల్ల’ అనే రూపం వాక్యంలోని సహాయం, ఆశీర్వాదం రెండింటికీ సహజంగా అనుసంధానమవుతూ హీబ్రూ సంక్షిప్తతను కొంత నిలుపుతుంది.
- source_word: אָבִיךָ
  choice: నీ తండ్రి
  rationale: ఏకవచన ద్వితీయ పురుష ప్రత్యయం యోసేపు తండ్రిని సహజంగా సూచిస్తుంది; అందువల్ల సూటి అర్థాన్ని ఉంచాం.
- source_word: יַעְזְרֶךָ
  choice: ఆయన నీకు సహాయం చేస్తాడు
  rationale: ఇది తృతీయ పురుష ఏకవచన క్రియ, ద్వితీయ పురుష ఏకవచన కర్మప్రత్యయంతో ఉంది. దేవుడే కర్త అని స్పష్టమవుతూ ఆశీర్వాద సందర్భంలోని భవిష్యత్ భావం నిలుస్తుంది.
- source_word: אֵת
  choice: సర్వశక్తిమంతునివల్ల
  rationale: שַׁדַּי ముందు ఉన్న אֵת అసాధారణమైనది; సమన్వయం లేదా సమీప సమానార్థక అన్వయాన్ని సూచించవచ్చు. పూర్వపు ‘దేవునివల్ల’కు సమాంతరంగా ‘సర్వశక్తిమంతునివల్ల’ అని ఇచ్చాం; ఇతర అన్వయాన్ని పాదటీకలో నిలిపాం.
- source_word: שַׁדַּי
  choice: సర్వశక్తిమంతుడు
  rationale: దైవ బిరుదును లిప్యంతరీకరించకుండా అర్థానువాదం చేశాం. ఆధునిక తెలుగు బైబిలు శైలిలో ఇది స్పష్టమైన, గౌరవప్రదమైన రూపం.
- source_word: וִיבָרְכֶךָ
  choice: ఆయన నిన్ను ఆశీర్వదిస్తాడు
  rationale: తృతీయ పురుష ఏకవచన కర్తను స్పష్టంచేస్తూ హీబ్రూ అసంపూర్ణ క్రియలోని ఆశీర్వాదాత్మక భవిష్యత్ భావాన్ని నిలిపాం.
- source_word: בִּרְכֹת שָׁמַיִם מֵעָל
  choice: పైనున్న ఆకాశపు ఆశీర్వాదాలు
  rationale: ‘పై/కింద’ కవితాత్మక సమాంతరాన్ని కాపాడుతూ construct సంబంధాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: תְּהוֹם רֹבֶצֶת תָּחַת
  choice: కింద పరుండివున్న అగాధం
  rationale: תְּהוֹם భూగర్భ జలాల అగాధాన్ని సూచిస్తుంది. רֹבֶצֶתకు ‘పరుండివున్న’ అని ఇవ్వడం ‘పడుకొని ఉండడం’ అనే చిత్రాన్ని నిలుపుతుంది; ‘పొంచివున్న’ అనే ప్రత్యామ్నాయాన్ని పాదటీకలో ఇచ్చాం.
- source_word: שָׁדַיִם
  choice: స్తనాలు
  rationale: పోషణ, సంతాన సమృద్ధి చిత్రంలో ఉన్న బహువచనాన్ని యథాతథంగా నిలిపాం.
- source_word: רָחַם
  choice: గర్భం
  rationale: స్తనాలతో జతగా ఇది సంతానోత్పత్తి, ఫలవంతతను సూచించే గర్భాన్ని తెలియజేస్తుంది; ఆధునిక తెలుగులో సహజమైన పదాన్ని ఎంచుకున్నాం.
theological_decisions:
- issue: שַׁדַּי అనే దైవ బిరుదు అనువాదం
  choice: సర్వశక్తిమంతుడు
  alternative: షద్దయి
  rationale: ఇది పేరుకన్నా దైవ బిరుదుగా పనిచేస్తున్నందున అర్థాన్ని తెలిపే అనువాదాన్ని ఎంచుకున్నాం; అదనపు సిద్ధాంతార్థాన్ని చేర్చలేదు.
- issue: మొదటి రెండు పాదాల్లో దేవునితో వ్యాకరణ సంబంధం
  choice: ‘దేవునివల్ల … సర్వశక్తిమంతునివల్ల’ అని మూలం/కార్యసాధకత్వంగా అనువదించడం
  alternative: ‘నీ తండ్రి దేవుని నుండి … సర్వశక్తిమంతునితో’ లేదా సమీప సమానార్థక అన్వయం
  rationale: హీబ్రూ ఉపసర్గలు, אֵת కణం సంక్షిప్తమైన అస్పష్ట నిర్మాణాన్ని కలిగిస్తాయి. ప్రధాన పాఠ్యంలో సహజమైన కార్యసాధక అన్వయాన్ని ఇచ్చి, నిజమైన ప్రత్యామ్నాయాన్ని పాదటీకలో సంరక్షించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కవితాత్మక ‘పైన/కింద’ సమాంతరాన్ని పాద విభజనతో నిలిపాం. భాష గౌరవప్రదంగా, సాధారణ పాఠకులకు అర్థమయ్యేలా ఉంది. ‘స్తనాలు, గర్భం’ అనే శరీర సంబంధ చిత్రాలను మృదూకరించకుండా మూలానికి నిబద్ధంగా ఉంచాం.
