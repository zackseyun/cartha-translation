  yaml_path: translation/ot/genesis/049/022.yaml
  text: Joseph is a fruitful son[a], a fruitful son by a spring[b]; daughters step over the wall.
translation:
  language: te
  text: యోసేపు ఫలవంతమైన కుమారుడు[a], నీటి ఊట పక్కన ఉన్న ఫలవంతమైన కుమారుడు; కుమార్తెలు[b] గోడమీదుగా అడుగులు వేస్తారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యోసేపు ఫలభరితమైన కొమ్మ, నీటి ఊట పక్కన ఉన్న ఫలభరితమైన కొమ్మ.” హీబ్రూ కవిత్వం సంక్షిప్తంగా ఉంది; సంప్రదాయంగా వచ్చే “కొమ్మ” అనే అనువాదం చిత్రణను మరింత స్పష్టంగా వ్యాఖ్యానిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: పదశః, “కుమార్తెలు.” ఇక్కడ ఈ మాట గోడమీదుగా విస్తరించే కొమ్మలు లేదా చిగుళ్లను రూపకంగా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּן פֹּרָת
  choice: ఫలవంతమైన కుమారుడు
  rationale: בֵּן అనే పదానికి సహజమైన అర్థం ‘కుమారుడు’; פֹּרָת ఫలించడం అనే భావాన్ని తెలియజేస్తుంది. హీబ్రూ కవిత్వంలోని సంక్షిప్తతను నిలుపుతూ రెండింటినీ ప్రత్యక్షంగా అనువదించాం.
- source_word: עֲלֵי עָיִן
  choice: నీటి ఊట పక్కన
  rationale: עַיִן ఇక్కడ సారవంతతను సూచించే సందర్భంలో ‘ఊట’ అని అర్థం చేసుకోవడం సహజం; తెలుగులో స్థలసంబంధాన్ని స్పష్టంగా చెప్పేందుకు ‘పక్కన’ వాడాం.
- source_word: בָּנוֹת
  choice: కుమార్తెలు
  rationale: పదశః అర్థం ‘కుమార్తెలు’. ఇది కొమ్మలు లేదా చిగుళ్లకు రూపకం కావచ్చు; అయితే మూలంలోని కవితాత్మక అనిశ్చితిని పరిష్కరించకుండా ప్రధాన పాఠ్యంలో ప్రత్యక్ష అర్థాన్నే ఉంచాం.
- source_word: צָעֲדָה
  choice: అడుగులు వేస్తారు
  rationale: క్రియ అడుగు వేయడం లేదా ముందుకు సాగడం అనే భావాన్ని ఇస్తుంది. సమూహవాచకమైన ‘కుమార్తెలు’కు అనుగుణంగా తెలుగులో బహువచన క్రియను వాడాం.
- source_word: עֲלֵי שׁוּר
  choice: గోడమీదుగా
  rationale: שׁוּר ఇక్కడ ‘గోడ’; עֲלֵיతో కలిసి గోడను దాటి లేదా దాని మీదుగా విస్తరించే చిత్రాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
