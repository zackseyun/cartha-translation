translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కవితాత్మక శైలి. హీబ్రూ మూలంలోని ‘కుమారుడు/కుమార్తెలు’ అనే ఉద్దేశపూర్వకంగా సంక్షిప్తమైన చిత్రణను ప్రధాన పాఠ్యంలో నిలిపి, వృక్షరూపక వ్యాఖ్యానాన్ని పాదసూచికల్లో ఇచ్చాం. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
