id: GEN.49.10
reference: Genesis 49:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: לֹֽא יָס֥וּר שֵׁ֨בֶט֙ מִֽ/יהוּדָ֔ה וּ/מְחֹקֵ֖ק מִ/בֵּ֣ין רַגְלָ֑י/ו עַ֚ד כִּֽי יָבֹ֣א שילה וְ/ל֖/וֹ יִקְּהַ֥ת עַמִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/010.yaml
  text: The scepter will not depart from Judah[a], nor the ruler’s staff from between his feet, until Shiloh comes[b]; and to him will be the obedience of the peoples.
translation:
  language: te
  text: 'రాజదండం యూదా నుండి తొలగిపోదు;


    పాలకుని దండం అతని కాళ్ల మధ్యనుండి తొలగిపోదు—


    షిలో వచ్చేవరకు[a];


    ప్రజల విధేయత అతనికే ఉంటుంది[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘హక్కు ఎవరిదో అతడు వచ్చేవరకు.’ שילה (షిలో) అనే హీబ్రూ పదం అర్థం నిర్ధారించడం కష్టం; దీనిని బిరుదుగా, స్థల నామంగా, లేదా కానుకను సూచించే పదంగా కూడా అర్థం చేసుకున్నారు.
    reason: alternative_reading
  - marker: b
    text: లేదా, ‘ప్రజలు అతని దగ్గర సమకూడుతారు,’ లేదా ‘ప్రజలు అతనికి లోబడతారు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׁבֶט
  choice: రాజదండం
  rationale: మְחֹקֵק‌తో ఉన్న రాజసంబంధ కవితాత్మక సమాంతరతలో ఇది సాధారణ కర్రను లేదా గోత్రాన్ని కాక, పాలనకు చిహ్నమైన దండాన్ని సూచిస్తుంది.
- source_word: מִיהוּדָה
  choice: యూదా నుండి
  rationale: מִן విభక్తి విడిపోవడం లేదా తొలగిపోవడం అనే భావాన్ని ఇస్తుంది; యూదా అనే ప్రామాణిక తెలుగు నామరూపం వాడబడింది.
- source_word: מְחֹקֵק
  choice: పాలకుని దండం
  rationale: ఈ పదం శాసించే వ్యక్తిని లేదా అతని అధికార చిహ్నాన్ని సూచించగలదు. ‘అతని పాదాల మధ్యనుండి’ అనే సందర్భం, రాజదండంతో సమాంతరత కలిపి అధికారదండం అనే అర్థానికి అనుకూలంగా ఉన్నాయి.
- source_word: מִבֵּין רַגְלָיו
  choice: అతని పాదాల మధ్యనుండి
  rationale: కూర్చొని పాలించడం లేదా సంతానం అనే సూచనలు ఉండవచ్చుగాని, హీబ్రూ కవితలోని స్పష్టమైన శరీరాత్మక రూపకాన్ని వ్యాఖ్యానాత్మకంగా మార్చకుండా నిలిపింది.
- source_word: עַד כִּי
  choice: వచ్చేవరకు
  rationale: ముందున్న వాక్యానికి కాలపరమైన అంత్యబిందువును సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: שילה
  choice: షిలో
  rationale: ఈ హీబ్రూ రూపం అత్యంత వివాదాస్పదమైనది. మసొరేటిక్ పఠనాన్ని అనుసరించి ప్రధాన పాఠ్యంలో నామంగా లిప్యంతరీకరించి, ముఖ్య ప్రత్యామ్నాయాలను పాదటిప్పణిలో ఉంచింది.
- source_word: וְלוֹ
  choice: అతనికే
  rationale: ప్రధాన పాఠ్యంలో షిలోను వ్యక్తిగత సూచనగా తీసుకున్నందున పుంలింగ ఏకవచన సర్వనామ భావాన్ని నిలిపింది; ‘కే’ గమ్యంతోపాటు కవితాత్మక ఉద్ఘాటనను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: יִקְּהַת
  choice: విధేయత
  rationale: అరుదైన, వివాదాస్పదమైన ఈ పదానికి రాజసంబంధ సందర్భంలో ప్రజలు పాలకునికి లోబడే భావం సరిపోతుంది; ‘సమకూడడం’, ‘లోబడడం’ అనే ప్రత్యామ్నాయాలు పాదటిప్పణిలో ఇవ్వబడ్డాయి.
- source_word: עַמִּים
  choice: ప్రజలు
  rationale: బహువచన రూపంలోని విస్తృత జనసమూహ భావాన్ని ‘దేశాలు’ అని మరింత వ్యాఖ్యానించకుండా సహజ తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: దీర్ఘకాలిక మెస్సీయ సంబంధ వ్యాఖ్యానమున్న שילה పదపు గుర్తింపు, అనువాదం
  choice: ప్రధాన పాఠ్యంలో ‘షిలో’ అనే లిప్యంతరీకృత నామాన్ని ఉంచి, ఆ వ్యక్తిని మెస్సీయగా అనువాదంలో ప్రత్యక్షంగా గుర్తించలేదు.
  alternative: ‘హక్కుగలవాడు వచ్చేవరకు’; ‘కానుక అతనికి వచ్చేవరకు’; ‘అతడు షిలోకు వచ్చేవరకు’
  rationale: కఠినమైన హీబ్రూ పాఠభేదాన్ని ప్రధాన పాఠ్యంలో సిద్ధాంతపరంగా పరిష్కరించకుండా, మూలపాఠ్యంలోని అస్పష్టతను మరియు రాజ/మెస్సీయ సంబంధ ఉద్వేగాన్ని కాపాడుతుంది.
- issue: వచనంలోని రాజసంబంధ లేదా మెస్సీయ సంబంధ బలం
  choice: ‘రాజదండం’, ‘పాలకుని దండం’, ‘ప్రజల విధేయత’ అనే రాజసంబంధ భాషను ఉపయోగించింది; అయితే పాఠ్యం చెప్పినదానికంటే మించిన స్పష్టమైన సిద్ధాంత వాదనను చేర్చలేదు.
  alternative: మెస్సీయ సూచనలేని కేవలం రాజకీయ-వంశపారంపర్య పఠనం; లేదా మెస్సీయను స్పష్టంగా పేర్కొనే వ్యాఖ్యానాత్మక అనువాదం
  rationale: వచనం యూదాతో ముడిపడిన రాజాధికార రూపకాలను స్పష్టంగా కలిగివుంది. వాటిని నిలిపి, ప్రధాన పాఠ్యంలో అదనపు సిద్ధాంత వివరణను నివారించింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ, పితృదీవెనలోని గంభీరమైన కవితా శైలిని నిలిపింది. పంక్తి విభజన హీబ్రూ సమాంతర నిర్మాణాన్ని స్పష్టపరుస్తుంది. వివాదాస్పద పదాలకు ప్రధాన పాఠ్యంలో అతివ్యాఖ్యానం చేయకుండా పాదటిప్పణులు ఇచ్చింది.
