  text: They bitterly attacked him[a], and shot at him, and hated him—the archers.
translation:
  language: te
  text: వారు అతణ్ణి తీవ్రంగా వేధించారు, అతనిపై బాణాలు సంధించారు[a], అతణ్ణి ద్వేషించారు—ఆ విలుకాళ్లు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వారు అతనికి చేదు కలిగించారు, అతనితో పోరాడారు, అతణ్ణి ద్వేషించారు—ఆ విలుకాళ్లు.’ మధ్యనున్న హీబ్రూ క్రియ అర్థనిర్ణయంలో కఠినమైనది; దాన్ని మరింత సాధారణంగా ‘అతనితో పోరాడారు’ లేదా ‘అతనిపై దాడిచేశారు’ అని కూడా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמָרֲרֻהוּ
  choice: వారు అతణ్ణి తీవ్రంగా వేధించారు
  rationale: מרר అనే ధాతువు పియేల్ రూపంలో ‘చేదు కలిగించడం, తీవ్రంగా బాధించడం’ అనే భావాన్ని ఇస్తుంది. శత్రుత్వాన్ని తెలిపే తరువాతి క్రియల సందర్భంలో ‘తీవ్రంగా వేధించారు’ అనేది చేదుతనపు తీవ్రతను నిలుపుతూ సహజమైన ఆధునిక తెలుగులో hostile treatmentను వ్యక్తం చేస్తుంది.
- source_word: וָרֹבּוּ
  choice: అతనిపై బాణాలు సంధించారు
  rationale: ఈ కవితా రూపం అర్థనిర్ణయంలో కఠినమైనది. చివరనున్న ‘బాణాలవారు/విలుకాళ్లు’ అనే చిత్రణతో సమాంతరంగా చదివినప్పుడు ‘బాణాలు సంధించారు’ అనే సంప్రదాయ భావం సందర్భానికి చక్కగా సరిపోతుంది; అయితే ‘పోరాడారు’ లేదా ‘దాడిచేశారు’ అనే విస్తృత అర్థం కూడా సాధ్యమని పాదటిప్పణి తెలియజేస్తుంది.
- source_word: וַיִּשְׂטְמֻהוּ
  choice: అతణ్ణి ద్వేషించారు
  rationale: שטם శత్రుత్వం, పగ, ద్వేషం అనే భావాలను సూచిస్తుంది. ‘ద్వేషించారు’ సంక్షిప్తంగా, స్పష్టంగా ఉండి వాక్యంలోని పెరుగుతున్న శత్రుత్వాన్ని నిలుపుతుంది.
- source_word: בַּעֲלֵי חִצִּים
  choice: విలుకాళ్లు
  rationale: అక్షరార్థంగా ‘బాణాల యజమానులు/ధారులు’; ఇది బాణాలు ప్రయోగించేవారిని సూచించే నుడికారం. తెలుగులో సహజమైన సమానార్థకం ‘విలుకాళ్లు’.
