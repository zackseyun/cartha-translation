  to: రూబేనా, నీవు నా తొలిపుట్టినవాడివి, నా బలం, నా పౌరుషానికి తొలి ఫలానివి[a]; ఘనతలో శ్రేష్ఠుడివి, శక్తిలో శ్రేష్ఠుడివి.
