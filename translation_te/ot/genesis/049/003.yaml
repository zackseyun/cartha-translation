id: GEN.49.3
reference: Genesis 49:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: רְאוּבֵן֙ בְּכֹ֣רִ/י אַ֔תָּה כֹּחִ֖/י וְ/רֵאשִׁ֣ית אוֹנִ֑/י יֶ֥תֶר שְׂאֵ֖ת וְ/יֶ֥תֶר עָֽז׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/003.yaml
  text: Reuben[a], you are my firstborn, my strength and the firstfruits of my vigor[b], excelling in honor and excelling in power.
translation:
  language: te
  text: రూబేనా, నీవు నా తొలిపుట్టినవాడివి, నా బలం, నా పౌరుషానికి తొలి ఫలానివి[a]; ఘనతలో శ్రేష్ఠుడివి, శక్తిలో శ్రేష్ఠుడివి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నా పౌరుషానికి ఆరంభం.” ఇక్కడి హీబ్రూ పదబంధం తండ్రి సంతానోత్పత్తి శక్తి తొలిసారిగా వ్యక్తమైనదాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּכֹרִי
  choice: నా తొలిపుట్టినవాడివి
  rationale: జన్మక్రమంతోపాటు మొదటి కుమారుని హోదా, వారసత్వ సూచనలను కూడా నిలుపుతుంది.
- source_word: כֹּחִי
  choice: నా బలానికీ ... ప్రతిరూపానివి
  rationale: כח యొక్క ప్రాథమిక భావమైన ‘బలం’ను నిలుపుతూ, తెలుగులో నేరుగా ‘నీవు నా బలము’ అనే అసహజ నిర్మాణాన్ని నివారిస్తుంది.
- source_word: רֵאשִׁית אוֹנִי
  choice: నా పౌరుషపు తొలి ఫలానికీ
  rationale: ראשית యొక్క ప్రథమత్వాన్నీ, און లోని జననసామర్థ్యంతో కూడిన శక్తి/పౌరుష భావాన్నీ సహజమైన కవితాత్మక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: יֶתֶר שְׂאֵת
  choice: ఘనతలో శ్రేష్ఠుడివి
  rationale: יתר లోని ఆధిక్యాన్ని, שׂאת లోని ఉన్నతి/గౌరవ భావాన్ని నిలుపుతుంది.
- source_word: יֶתֶר עָז
  choice: శక్తిలో శ్రేష్ఠుడివి
  rationale: יתר యొక్క ఆధిక్య భావాన్ని, עז యొక్క బలశక్తి భావాన్ని ముందరి పదబంధంతో సమాంతరంగా అందిస్తుంది.
- source_word: אַתָּה
  choice: నీవు
  rationale: హీబ్రూలోని స్పష్టమైన, ఉద్ఘాటనాత్మక ప్రత్యక్ష సంబోధనను నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కవితాత్మక సంబోధన. ‘పౌరుషం’ జననసామర్థ్యంతో కూడిన און భావాన్ని అతిగా వైద్యపరంగా కాకుండా తెలియజేస్తుంది; చివరి రెండు భాగాల్లో సమాంతర నిర్మాణం ఉంచబడింది.
