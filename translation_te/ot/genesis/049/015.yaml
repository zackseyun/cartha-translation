  text: וַ/יַּ֤רְא מְנֻחָה֙ כִּ֣י ט֔וֹב וְ/אֶת הָ/אָ֖רֶץ כִּ֣י נָעֵ֑מָה וַ/יֵּ֤ט שִׁכְמ/וֹ֙ לִ/סְבֹּ֔ל וַ/יְהִ֖י לְ/מַס עֹבֵֽד־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/015.yaml
  text: He saw that the resting place was good[a], and that the land was pleasant, so he bent his shoulder to bear[c][b], and became a servant for forced labor.
translation:
  language: te
  text: అతడు విశ్రాంతి స్థలం మంచిదని[a], ఆ దేశం ఆహ్లాదకరమైనదని చూశాడు. అందుచేత బరువు మోయడానికి తన భుజాన్ని వంచి, బలవంతపు శ్రమ చేసే సేవకుడయ్యాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘విశ్రాంతి మంచిదని.’ హీబ్రూ పదం విశ్రాంతినిగానీ విశ్రాంతి స్థలాన్నిగానీ సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘వెట్టి పని చేసే కూలివాడయ్యాడు,’ లేక ‘కప్పం చెల్లించే సేవకుడయ్యాడు.’ హీబ్రూ పదబంధం బలవంతపు శ్రమను, రాజవెట్టి పనిని, లేదా అధీన సేవను సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: מְנֻחָה
  choice: విశ్రాంతి స్థలం
  rationale: ఈ నామవాచకానికి ‘విశ్రాంతి’ లేదా ‘విశ్రాంతి స్థలం’ అనే రెండు అర్థాలు సాధ్యమే. సమాంతరంగా వచ్చే ‘దేశం’తో concrete sense బాగా సరిపోతుంది; ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: טוֹב
  choice: మంచిది
  rationale: హీబ్రూ విశేషణంలోని సరళమైన, విస్తృతమైన సానుకూల భావాన్ని నిలుపుతుంది.
- source_word: הָאָרֶץ
  choice: ఆ దేశం
  rationale: గోత్ర ఆశీర్వాద సందర్భంలో ఇది సాధారణంగా భూమి మొత్తాన్ని కాక ఇశ్శాఖారు పొందే ప్రాంతాన్ని సూచిస్తుంది.
- source_word: נָעֵמָה
  choice: ఆహ్లాదకరమైనది
  rationale: దేశం ఆకర్షణీయంగా, సుఖకరంగా ఉందనే మితమైన భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: וַיֵּט שִׁכְמוֹ
  choice: తన భుజాన్ని వంచి
  rationale: భారానికి లోబడుతున్న శారీరక చిత్రాన్ని హీబ్రూ వాక్యరీతికి దగ్గరగా నిలుపుతుంది.
- source_word: לִסְבֹּל
  choice: బరువు మోయడానికి
  rationale: కేవలం ‘మోయడానికి’ కంటే అంతర్లీనమైన భారాన్ని తెలుగులో స్పష్టంగా చేస్తూ భుజం అనే చిత్రంతో సహజంగా కలుస్తుంది.
- source_word: לְמַס עֹבֵד
  choice: బలవంతపు పనికి సేవకుడయ్యాడు
  rationale: מַס సాధారణంగా నిర్బంధిత శ్రమ లేదా రాజవెట్టి పనిని సూచిస్తుంది; עֹבֵד సేవచేసేవాడిని సూచిస్తుంది. ఈ అనువాదం దాస్యపు నిర్దిష్ట రూపాన్ని అతిగా నిర్ణయించకుండా రెండింటినీ ప్రతిబింబిస్తుంది.
theological_decisions:
- issue: చివరి పదబంధంలో ఇశ్శాఖారు లోబడిన సేవ స్వభావం
  choice: బలవంతపు పనికి సేవకుడయ్యాడు
  alternative: వెట్టి పని చేసే కూలివాడయ్యాడు; కప్పం చెల్లించే సేవకుడయ్యాడు
  rationale: מַס అనే పదం ఇక్కడ బలవంతపు శ్రమను ఎక్కువగా సూచించినా, కప్పం లేదా అధీన సేవ అనే సామాజిక భావం కూడా సాధ్యమే. ప్రధాన పాఠం సంభావ్యమైన అర్థాన్ని ఇస్తూ, నిజమైన సందిగ్ధతను పాదటిప్పణిలో కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కవితాత్మక గద్యాన్ని ఉపయోగించాం. ‘భుజాన్ని వంచి’ అనే మూలచిత్రాన్ని నిలిపి, చివరి సామాజిక స్థితిని ఏకపక్షంగా ‘బానిసత్వం’గా నిర్ణయించలేదు. ప్రతి పాదటిప్పణి సూచిక ప్రధాన పాఠంలో ఉంది.
