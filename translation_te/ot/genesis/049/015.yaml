  source_fidelity: 'మొత్తంగా మూల హీబ్రూ భావాన్ని నమ్మకంగా ప్రతిబింబిస్తుంది: מְנֻחָהకు ‘విశ్రాంతి స్థలం’ అనే సందర్భోచిత అర్థాన్ని తీసుకొని ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచింది; ‘తన భుజాన్ని వంచి’ మరియు ‘బరువు మోయడానికి’ మూలంలోని శారీరక రూపకాన్ని కాపాడుతున్నాయి. చివరి పదబంధంలోని మַס యొక్క నిర్బంధిత శ్రమ/వెట్టి పని భావాన్ని ప్రధాన పాఠం, పాదటిప్పణి రెండూ సముచితంగా తెలియజేస్తాయి.'
