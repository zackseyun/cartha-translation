base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/014.yaml
  text: Issachar is a strong-boned donkey[a], lying down between the sheepfolds.
translation:
  language: te
  text: ఇశ్శాఖారు బలమైన ఎముకలుగల గాడిద; గొర్రెల దొడ్ల మధ్య పడుకొని ఉంది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘జీను సంచుల మధ్య.’ ఈ హీబ్రూ పదం అరుదైనది; దాని అర్థంపై భిన్నాభిప్రాయాలు ఉన్నాయి. ఈ పశుపోషణ నేపథ్య ఆశీర్వాదంలో ‘గొర్రెల దొడ్లు’ అనేది సంప్రదాయ అర్థం, సందర్భానికి కూడా తగినదిగా కనిపిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשָּׂשכָר
  choice: ఇశ్శాఖారు
  rationale: హీబ్రూ వ్యక్తినామాన్ని ఆధునిక ప్రామాణిక తెలుగు బైబిలు శైలికి అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: חֲמֹר
  choice: గాడిద
  rationale: మూలపదపు సాధారణ అర్థాన్ని సహజమైన ఆధునిక తెలుగు పదంతో ఇచ్చాం; మగ గాడిద అని మూలంలో లేని స్పష్టీకరణ చేయలేదు.
- source_word: גָּרֶם
  choice: బలమైన ఎముకలుగల
  rationale: అక్షరార్థంగా ‘ఎముక’ అనే నామవాచకం ఇక్కడ గాడిద దృఢమైన శరీర నిర్మాణాన్ని వర్ణిస్తుంది; కేవలం ‘ఎముకలు కనిపించే’ అనే భావం రాకుండా బలాన్ని వ్యక్తం చేశాం.
- source_word: רֹבֵץ
  choice: పండుకొని ఉంది
  rationale: జంతువు నేలపై కాళ్లు ముడుచుకొని పడివుండే భంగిమను సహజమైన తెలుగులో సూచిస్తుంది; ‘విశ్రాంతి తీసుకుంటోంది’ అని ఉద్దేశాన్ని అదనంగా నిర్ణయించలేదు.
- source_word: בֵּין
  choice: మధ్య
  rationale: రెండు లేదా అంతకంటే ఎక్కువ ప్రదేశాల నడుమ అనే మూలపదపు సూటి భావాన్ని ఇస్తుంది.
- source_word: הַמִּשְׁפְּתָיִם
  choice: గొర్రెల దొడ్లు
  rationale: అరుదైన ఈ హీబ్రూ రూపానికి సంప్రదాయంగా, పశుపోషణ సందర్భానికి తగినట్లుగా ‘గొర్రెల దొడ్లు’ అనే అర్థాన్ని ప్రధాన పాఠ్యంలో ఉంచాం; పదార్థంలోని అనిశ్చితిని పాదసూచికలో తెలిపాం.
