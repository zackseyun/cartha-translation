  to: నీ తండ్రి దీవెనలు నా తల్లిదండ్రుల దీవెనలకంటే గొప్పవిగా ఉన్నాయి[a]; అవి ప్రాచీన కొండల అత్యంత సుదూర హద్దుల వరకు విస్తరించాయి[b]. అవి యోసేపు తలమీద, తన సోదరుల నుండి ప్రత్యేకంగా ఉంచబడినవాని తలపై భాగం మీద నిలిచియుండుగాక[c].
  rationale: ప్రధాన పాఠంలోని భావాన్ని మార్చకుండా తులనాత్మక సంబంధాన్ని స్పష్టపరిచాం. తప్పుదారి పట్టించే పాదసూచిక aను మొత్తం కష్టమైన హీబ్రూ పదబంధానికి వర్తించే నిజమైన ప్రత్యామ్నాయ అవగాహనగా సవరించాం. תַּאֲוַת గిబ్అోత్ ఓలాం యొక్క అనిశ్చితిని పాదసూచికలో నిలిపి, నְזִיר ఎఖావ్‌కు ఉన్న ‘ప్రత్యేకంగా ఉంచబడిన’ ప్రధాన భావాన్ని మరియు ‘అధిపతి’ ప్రత్యామ్నాయాన్ని రెండింటినీ కాపాడాం.
