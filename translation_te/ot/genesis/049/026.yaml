id: GEN.49.26
reference: Genesis 49:26
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: בִּרְכֹ֣ת אָבִ֗י/ךָ גָּֽבְרוּ֙ עַל בִּרְכֹ֣ת הוֹרַ֔/י עַֽד תַּאֲוַ֖ת גִּבְעֹ֣ת עוֹלָ֑ם תִּֽהְיֶ֨ין֙ לְ/רֹ֣אשׁ יוֹסֵ֔ף וּ/לְ/קָדְקֹ֖ד נְזִ֥יר אֶחָֽי/ו־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/026.yaml
  text: The blessings of your father have prevailed beyond the blessings of my parents[a], to the utmost bounds of the ancient hills. May they be on the head of Joseph[b], and on the crown of the head of the one set apart from his brothers.
translation:
  language: te
  text: నీ తండ్రి దీవెనలు నా తల్లిదండ్రుల దీవెనలకంటే గొప్పవిగా ఉన్నాయి[a]; అవి ప్రాచీన కొండల అత్యంత సుదూర హద్దుల వరకు విస్తరించాయి[b]. అవి యోసేపు తలమీద, తన సోదరుల నుండి ప్రత్యేకంగా ఉంచబడినవాని తలపై భాగం మీద నిలిచియుండుగాక[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పదబంధాన్ని మరో విధంగా అర్థం చేసుకుంటే, ‘నా పూర్వికుల దీవెనలకన్నా నిత్యమైన కొండల దీవెనలు గొప్పవి’ అని అనువదించవచ్చు.
    reason: textual_and_lexical_alternative
  - marker: b
    text: హీబ్రూ పదబంధం కష్టమైనది; ‘నిత్యమైన కొండల కోరదగిన సంపదల వరకు’ లేదా ‘నిత్యమైన కొండల శ్రేష్ఠత వరకు’ అని కూడా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘తన సోదరులలో అధిపతిగా ఉన్నవాని తలపై భాగం మీద’; హీబ్రూ పదానికి ‘ప్రత్యేకంగా ఉంచబడినవాడు’ లేదా ‘ప్రతిష్ఠించబడినవాడు’ అనే భావమూ ఉంది.
    reason: alternative_reading
lexical_decisions:
- source_word: בִּרְכֹת אָבִיךָ
  choice: నీ తండ్రి దీవెనలు
  rationale: బహువచన రూపాన్ని నిలిపి, యాకోబు యోసేపుతో నేరుగా మాట్లాడుతున్న సందర్భానికి అనుగుణంగా రెండవ పురుష ఏకవచనాన్ని స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: גָּבְרוּ עַל
  choice: మించి
  rationale: ఇక్కడ క్రియ మరియు విభక్తి కలసి బలం లేదా గొప్పతనంలో అధిగమించడాన్ని సూచిస్తాయి; ‘మించి’ ఆధునిక తెలుగులో సహజంగా ఆ తులనను తెలియజేస్తుంది.
- source_word: הוֹרַי
  choice: నా తల్లిదండ్రుల
  rationale: మసొరెటిక్ స్వరచిహ్నాల ప్రకారం ఇది ‘నన్ను కన్నవారు’ అనే బహువచన భావాన్ని ఇస్తుంది. అయితే స్వరచిహ్నాలు లేని వ్యంజన పాఠానికి మరో పఠనం సాధ్యమైనందున దానిని పాదసూచికలో ఉంచాం.
- source_word: תַּאֲוַת גִּבְעֹת עוֹלָם
  choice: ప్రాచీన కొండల అత్యంత సుదూర హద్దులదాకా
  rationale: కష్టమైన ఈ కవితా పదబంధాన్ని ఆశీర్వాదాల విస్తృతి లేదా పరాకాష్ఠను సూచించేదిగా ప్రధాన పాఠంలో అందించాం. תאות అనే పదానికి ‘కాంక్షించదగిన సంపద/శ్రేష్ఠత’ అనే భావం కూడా ఉండగలదని పాదసూచికలో తెలిపాం.
- source_word: תִּהְיֶיןָ
  choice: నిలిచియుండుగాక
  rationale: ఆశీర్వాద సందర్భంలోని విధ్యర్థక లేదా ఆకాంక్షార్థక బలాన్ని తెలుగులో సహజమైన ఆశీర్వచన రూపంతో తెలియజేస్తుంది.
- source_word: לְרֹאשׁ ... וּלְקָדְקֹד
  choice: తలమీద ... నడినెత్తిమీద
  rationale: హీబ్రూ సమాంతర కవితా నిర్మాణాన్ని నిలుపుతూ, קָדְקֹד సూచించే తలపై భాగాన్ని స్పష్టమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: נְזִיר אֶחָיו
  choice: తన సోదరుల నుండి ప్రత్యేకంగా ఉంచబడినవాడు
  rationale: נְזִיר యొక్క వేరుచేయబడిన లేదా ప్రతిష్ఠించబడిన వ్యక్తి అనే ప్రాథమిక భావాన్ని కాపాడుతుంది; తరువాతి కాలపు సాంకేతిక ‘నాజీరు’ వ్యవస్థను ఈ పాఠంలోకి అనవసరంగా దిగుమతి చేయదు.
theological_decisions:
- issue: నְזִיר אֶחָיו అనే యోసేపు విశేషణం యొక్క భావం
  choice: తన సోదరుల నుండి ప్రత్యేకంగా ఉంచబడినవాడు
  alternative: తన సోదరులలో అధిపతి; తన సోదరులలో ప్రతిష్ఠించబడినవాడు
  rationale: ఈ అనువాదం యోసేపు సోదరులనుండి వేరుగా నిలబెట్టబడిన స్థితిని, అలాగే అతని ప్రత్యేక గౌరవాన్ని సూచిస్తుంది. దానిని కేవలం రాజకీయ బిరుదుగా లేదా తరువాతి నాజీరు ఆచారానికి సంబంధించిన సాంకేతిక పదంగా పరిమితం చేయకుండా మూలంలోని భావ ఉద్రిక్తతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా వినిపించేలా వాక్యాన్ని నిర్మించాం; కవితాత్మక సమాంతరత కోసం ‘తలమీద—నడినెత్తిమీద’ జంటను నిలిపాం. ‘నిలిచియుండుగాక’ అనే గౌరవప్రదమైన ఆశీర్వచన రూపం వచనపు గంభీరతను కాపాడుతుంది.
