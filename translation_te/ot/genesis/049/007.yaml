id: GEN.49.7
reference: Genesis 49:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אָר֤וּר אַפָּ/ם֙ כִּ֣י עָ֔ז וְ/עֶבְרָתָ֖/ם כִּ֣י קָשָׁ֑תָה אֲחַלְּקֵ֣/ם בְּ/יַעֲקֹ֔ב וַ/אֲפִיצֵ֖/ם בְּ/יִשְׂרָאֵֽל׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/007.yaml
  text: Cursed be their anger[a], for it is fierce, and their wrath, for it is harsh. I will divide them in Jacob and scatter them in Israel.
translation:
  language: te
  text: వారి కోపం శపించబడుగాక, అది ఉగ్రం కాబట్టి; వారి ఆగ్రహం కూడా, అది కఠినమైనది కాబట్టి. యాకోబులో వారిని విభజిస్తాను; ఇశ్రాయేలులో వారిని చెదరగొడతాను.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָרוּר
  choice: శపించబడుగాక
  rationale: శాప ప్రకటనలో విధేయార్థక బలాన్ని సహజమైన, గంభీరమైన తెలుగులో నిలుపుతుంది.
- source_word: אַפָּם
  choice: వారి కోపం
  rationale: మూలపదానికి శరీరార్థంగా ‘ముక్కు/నాసిక’ ఉన్నప్పటికీ, ఇక్కడ స్థిరమైన నుడికారార్థం ‘కోపం’.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: శాపానికి కారణాన్ని పరిచయం చేసే సంబంధాన్ని స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: עָז
  choice: ఉగ్రంగా
  rationale: కోపపు తీవ్రమైన, హింసాత్మక బలాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: וְעֶבְרָתָם
  choice: వారి ఆగ్రహం
  rationale: పొంగిపొర్లే తీవ్ర రోషాన్ని సూచిస్తూ, ‘కోపం’తో ఉన్న కవితాత్మక సమాంతరతలో పదభేదాన్ని కాపాడుతుంది.
- source_word: קָשָׁתָה
  choice: కఠినంగా ఉంది
  rationale: పదంలోని కాఠిన్యం/తీవ్రత భావాన్ని నేరుగా ఉంచుతుంది; ‘క్రూరమైనది’ అనే సందర్భోచిత ప్రత్యామ్నాయాన్ని పాఠ్యంలో ఏకైక అర్థంగా నిర్ణయించదు.
- source_word: אֲחַלְּקֵם
  choice: వారిని విభజిస్తాను
  rationale: మొదటి పురుష ఏకవచన క్రియను, తరువాతి ‘చెదరగొడతాను’తో ఉన్న పదభేదాన్ని కాపాడుతుంది.
- source_word: בְּיַעֲקֹב
  choice: యాకోబులో
  rationale: యాకోబు సంతాన సమాజాన్ని సూచించే సామూహిక ప్రయోగాన్ని, ఇశ్రాయేలుతో సమాంతరతను నిలుపుతుంది.
- source_word: וַאֲפִיצֵם
  choice: వారిని చెదరగొడతాను
  rationale: కారణక క్రియారూపంలోని చెల్లాచెదురు చేయడం అనే తీర్పు భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בְּיִשְׂרָאֵל
  choice: ఇశ్రాయేలులో
  rationale: దేశసమాజాన్ని సూచించే పేరును అలాగే ఉంచి, ‘యాకోబులో’తో కవితాత్మక సమాంతరతను కాపాడుతుంది.
theological_decisions:
- issue: శాపానికి గురయ్యేది ఎవరు లేదా ఏమిటి?
  choice: శాపం నేరుగా సహోదరులపై కాక, వారి కోపం మరియు ఆగ్రహంపై ప్రకటించబడింది.
  alternative: శాపం శిమ్యోను, లేవి వ్యక్తులపైనే పడుతుంది.
  rationale: హీబ్రూ వాక్యం ‘వారి కోపం’ మరియు ‘వారి ఆగ్రహం’నే వ్యాకరణపరంగా శాపానికి అంశాలుగా పేర్కొంటుంది; అందువల్ల ఆ భేదాన్ని అనువాదం నిలుపుతుంది.
- issue: קָשָׁתָה యొక్క భావ ఛాయ
  choice: కఠినంగా ఉంది
  alternative: క్రూరంగా ఉంది
  rationale: మూలంలోని ‘కఠినం/తీవ్రం’ అనే విస్తృత భావాన్ని నిలిపి, సందర్భం వల్ల సాధ్యమైన నైతిక ‘క్రూరత్వం’ భావాన్ని తప్పనిసరి అర్థంగా ముద్రించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా ఉండి, పితృవాక్యపు కవితాత్మక గాంభీర్యాన్ని కాపాడే శైలి. రెండు సమాంతర పాదాల్లో శాపక్రియను తెలుగులో పునరుక్తి చేయడం ద్వారా వ్యాకరణ స్పష్టతను నిలిపాం; యాకోబు/ఇశ్రాయేలు అనే రెండు పేర్లను కలపకుండా మూల సమాంతరతను ఉంచాం.
