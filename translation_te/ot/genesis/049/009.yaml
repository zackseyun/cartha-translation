source:
  edition: WLC
  text: גּ֤וּר אַרְיֵה֙ יְהוּדָ֔ה מִ/טֶּ֖רֶף בְּנִ֣/י עָלִ֑יתָ כָּרַ֨ע רָבַ֧ץ כְּ/אַרְיֵ֛ה וּ/כְ/לָבִ֖יא מִ֥י יְקִימֶֽ/נּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/009.yaml
  text: Judah is a lion’s cub[a]; from the prey, my son, you have gone up. He crouched, he lay down like a lion[b], and like a lioness—who will rouse him?
translation:
  language: te
  text: యూదా సింహపు పిల్ల; నా కుమారుడా, నీవు ఎరనుండి పైకి ఎక్కావు. అతడు సింహంలా వంగి పడుకున్నాడు; ఆడ సింహంలా[a]—అతణ్ణి ఎవడు లేపగలడు?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘బలమైన సింహంలా’ లేదా ‘పరిపక్వ సింహంలా.’ ఇక్కడి హీబ్రూ పదం ముందున్న ‘సింహం’ అనే పదానికి భిన్నమైనది. కొన్ని అనువాదాలు దీనిని ‘ఆడ సింహం’గా ఇస్తాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: גּוּר אַרְיֵה
  choice: సింహపు పిల్ల
  rationale: గּוּר అనేది చిన్న వయస్సున్న జంతువును సూచిస్తుంది; אַרְיֵהతో కలిసి సహజమైన తెలుగు రూపం ‘సింహపు పిల్ల’ అవుతుంది.
- source_word: יְהוּדָה
  choice: యూదా
  rationale: వ్యక్తి/గోత్ర నామాన్ని ప్రామాణిక తెలుగు లిప్యంతరీకరణలో ఉంచాం.
- source_word: מִטֶּרֶף
  choice: వేటనుంచి
  rationale: טֶרֶף వేటాడి పట్టుకున్న లేదా చీల్చిన ఆహారాన్ని సూచిస్తుంది. ‘వేటనుంచి’ సింహ రూపకాన్ని సంక్షిప్తంగా, సహజంగా నిలుపుతుంది.
- source_word: בְּנִי
  choice: నా కుమారుడా
  rationale: యాకోబు యూదాను నేరుగా సంబోధిస్తున్న భావాన్ని తెలుగు సంబోధన రూపం స్పష్టంగా తెలియజేస్తుంది.
- source_word: עָלִיתָ
  choice: పైకి వచ్చావు
  rationale: పైకి కదలడమనే మూల భావాన్ని నిలుపుతూ, సింహం వేటనుంచి సురక్షిత స్థలానికి వెళ్లే చిత్రాన్ని అతిగా వివరించకుండా ఉంచుతుంది.
- source_word: כָּרַע רָבַץ
  choice: ముడుచుకొని పడుకున్నాడు ... పండుకున్నాడు
  rationale: జంతువు శరీరాన్ని వంచుకొని విశ్రమించడాన్ని సూచించే రెండు వరుస క్రియల భేదాన్ని సహజమైన తెలుగులో సాధ్యమైనంతవరకు నిలిపాం.
- source_word: כְּאַרְיֵה
  choice: సింహంలా
  rationale: כְּ ఉపసర్గతో ఉన్న సరళమైన ఉపమానం.
- source_word: וּכְלָבִיא
  choice: బలమైన సింహంలా
  rationale: לָבִיא సాధారణంగా పరిపక్వమైన, శక్తిమంతమైన సింహాన్ని సూచించగలదు. జీవశాస్త్రీయ లింగాన్ని అనిశ్చితంగా నిర్ణయించకుండా, אַרְיֵהతో ఉన్న పదభేదాన్ని ‘బలమైన’ అనే విశేషణంతో తెలియజేశాం.
- source_word: מִי יְקִימֶנּוּ
  choice: అతణ్ణి లేపేవాడెవడు?
  rationale: קום హిఫీల్ రూపం ఇక్కడ పడుకున్న సింహాన్ని లేవదీయడం లేదా కదిలించడం అనే భావాన్ని ఇస్తుంది; ప్రశ్నలో అంతర్లీనమైన భయానక సవాలును అదనంగా ‘ధైర్యం చేసేవాడు’ అని చేర్చకుండా నిలిపాం.
theological_decisions:
- issue: యూదా సింహ రూపకానికి మెస్సీయ సంబంధమైన అర్థం
  choice: ప్రధాన పాఠంలో ఇది యాకోబు యూదా/యూదా గోత్రం గురించి పలికిన ఆశీర్వాదంగానే అనువదించబడింది.
  alternative: తరువాతి రాజవంశీయ, మెస్సీయ నిరీక్షణతో దీనిని సాదృశ్యార్థంగా అనుసంధానించడం.
  rationale: ఈ వచనం నేరుగా యూదాను సింహబలం, నిర్భయ విశ్రాంతితో చిత్రిస్తుంది. తరువాతి బైబిలు పరిణామాలను ప్రధాన అనువాదంలోకి ముందుగానే చేర్చకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కవితాత్మక గంభీరతను నిలుపుతూ సాధారణ పాఠకుడికి స్పష్టంగా ఉండే పదాలు వాడాం. హీబ్రూలో పురుష ఏకవచన రూపాలు ఉన్నందున ‘అతడు/అతణ్ణి’ ఉంచాం. ప్రధాన పాఠంలో మెస్సీయ వ్యాఖ్యానాన్ని చేర్చలేదు; לָבִיאలోని లింగ/బల సూచన అనిశ్చితిని పాదటిప్పణిలో నిలిపాం.
