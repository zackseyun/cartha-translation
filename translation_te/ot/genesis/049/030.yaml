translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా ఉండే వాక్యనిర్మాణం. మూలంలోని పొడవైన సంబంధ వాక్యాల వరుసను రెండు వాక్యాలుగా విభజించి, ‘పొలం’ ప్రత్యక్ష కర్మ అనే హెబ్రీ వ్యాకరణాన్ని కాపాడింది. స్థలనామాలు సాధారణ తెలుగు బైబిలు రూపాలకు దగ్గరగా లిప్యంతరీకరించబడ్డాయి.
