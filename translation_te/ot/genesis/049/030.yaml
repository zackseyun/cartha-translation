source:
  edition: WLC
  text: בַּ/מְּעָרָ֞ה אֲשֶׁ֨ר בִּ/שְׂדֵ֧ה הַ/מַּכְפֵּלָ֛ה אֲשֶׁ֥ר עַל פְּנֵי מַמְרֵ֖א בְּ/אֶ֣רֶץ כְּנָ֑עַן אֲשֶׁר֩ קָנָ֨ה אַבְרָהָ֜ם אֶת הַ/שָּׂדֶ֗ה מֵ/אֵ֛ת עֶפְרֹ֥ן הַ/חִתִּ֖י לַ/אֲחֻזַּת קָֽבֶר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/030.yaml
  text: in the cave that is in the field of Machpelah[a], which is opposite Mamre, in the land of Canaan[d][c][b], which Abraham bought with the field from Ephron the Hittite as a burial property.
translation:
  language: te
  text: కనాను దేశంలో మమ్రేకు ఎదురుగా[a] ఉన్న మక్ఫేలా పొలంలోని గుహలో. ఆ పొలాన్ని అబ్రాహాము హిత్తీయుడైన ఎఫ్రోను దగ్గర సమాధి కోసం సొంత ఆస్తిగా[b] కొన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘మమ్రేకు ముఖంగా’ లేదా ‘మమ్రే ఎదుట’. హెబ్రీ పదబంధం మమ్రేతో పోల్చి ఆ స్థలపు స్థానాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘సమాధి స్వాస్థ్యంగా’. ఇక్కడి హెబ్రీ పదబంధం సమాధి కోసం ప్రత్యేకించబడిన, చట్టబద్ధంగా సొంతమైన ఆస్తిని నొక్కి చెబుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּמְּעָרָה
  choice: గుహలో
  rationale: בְּ ఉపసర్గ స్థలాన్ని సూచిస్తుంది; מְעָרָהకు సహజమైన ఆధునిక తెలుగు సమానార్థకం ‘గుహ’.
- source_word: אֲשֶׁר בִּשְׂדֵה הַמַּכְפֵּלָה
  choice: మక్ఫేలా పొలంలోని
  rationale: సంబంధ వాక్యాన్ని సహజమైన తెలుగు విశేషణ నిర్మాణంగా మార్చి, గుహ ఆ పొలంలో ఉందనే భావాన్ని నిలిపింది; మక్ఫేలా స్థలనామంగా లిప్యంతరీకరించబడింది.
- source_word: אֲשֶׁר עַל פְּנֵי מַמְרֵא
  choice: మమ్రేకు ఎదురుగా ఉన్న
  rationale: עַל־פְּנֵי ఇక్కడ మమ్రేతో పోల్చిన ప్రాదేశిక సంబంధాన్ని సూచిస్తుంది; ‘ఎదురుగా’ ప్రధాన భావాన్ని ఇస్తూ, ఇతర సాధ్యార్థాన్ని పాదటిప్పణిలో ఉంచుతుంది.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: కనాను దేశంలో
  rationale: భౌగోళిక పదబంధానికి నేరుగా, సహజంగా ఉన్న తెలుగు అనువాదం.
- source_word: אֲשֶׁר קָנָה אַבְרָהָם אֶת הַשָּׂדֶה
  choice: ఆ పొలాన్ని అబ్రాహాము ... కొన్నాడు
  rationale: אֶת గుర్తించిన ప్రత్యక్ష కర్మ ‘పొలం’; హెబ్రీలోని సంబంధసూచక–పునరుక్త నిర్మాణాన్ని తెలుగులో కొత్త వాక్యంగా సహజంగా వ్యక్తం చేసి, అబ్రాహాము కొన్నది పొలమేనని స్పష్టంగా నిలిపింది.
- source_word: מֵאֵת עֶפְרֹן הַחִתִּי
  choice: హిత్తీయుడైన ఎఫ్రోను దగ్గర
  rationale: מֵאֵת కొనుగోలు జరిగిన వ్యక్తి/మూలాన్ని సూచిస్తుంది; ‘దగ్గర ... కొన్నాడు’ ఆధునిక తెలుగులో సహజమైన లావాదేవీ నిర్మాణం.
- source_word: לַאֲחֻזַּת קָבֶר
  choice: సమాధి కోసం సొంత ఆస్తిగా
  rationale: אֲחֻזָּהలోని చట్టబద్ధమైన స్వాధీన ఆస్తి భావాన్నీ, קֶבֶרలోని సమాధి ప్రయోజనాన్నీ రెండింటినీ చదవదగిన తెలుగులో నిలిపింది.
