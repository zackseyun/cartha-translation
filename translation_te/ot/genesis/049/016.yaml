source:
  edition: WLC
  text: דָּ֖ן יָדִ֣ין עַמּ֑/וֹ כְּ/אַחַ֖ד שִׁבְטֵ֥י יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/016.yaml
  text: Dan will judge his people as one of the tribes of Israel[a].
translation:
  language: te
  text: దాను తన ప్రజలకు తీర్పు తీరుస్తాడు, ఇశ్రాయేలు గోత్రాల్లో ఒక గోత్రంలా.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దాను తన ప్రజల పక్షాన న్యాయం సాధిస్తాడు.” హీబ్రూ క్రియకు తీర్పు చెప్పడం మాత్రమే కాకుండా, సమర్థించడం లేదా న్యాయం జరిగేలా చేయడం అనే భావం కూడా ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: דָּן
  choice: దాను
  rationale: యాకోబు కుమారుని, అతని గోత్రాన్ని సూచించే పేరును తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించాం. ఈ పేరుకు తరువాతి ‘న్యాయం తీర్చు’ అనే క్రియతో పదప్రయోగ సంబంధం ఉంది.
- source_word: יָדִין
  choice: న్యాయం తీరుస్తాడు
  rationale: దין ధాతువు ఇక్కడ భవిష్యత్ భావంతో న్యాయం చేయడం లేదా పాలనాపరంగా తీర్పు తీర్చడం సూచిస్తుంది. ‘న్యాయం తీరుస్తాడు’ అనే రూపం సహజమైన తెలుగులో ప్రధాన భావాన్ని, దాను పేరుతో ఉన్న పదప్రయోగాన్ని సాధ్యమైనంతవరకు నిలుపుతుంది.
- source_word: עַמּוֹ
  choice: తన ప్రజలకు
  rationale: ‘అతని ప్రజలు’ అనే అర్థాన్ని సందర్భానుగుణమైన ప్రతిఫల సర్వనామంతో సహజ తెలుగులో తెలిపాం; ఇది దానుతో సంబంధం ఉన్న గోత్ర ప్రజలను సూచిస్తుంది.
- source_word: כְּאַחַד
  choice: ఒక గోత్రంలా
  rationale: తులనార్థక כ మరియు אחד కలయిక ‘ఒకదానిలా/ఒకటిగా’ అనే భావం ఇస్తుంది. తరువాతి ‘గోత్రాలు’తో కలిపి తెలుగులో స్పష్టంగా వ్యక్తపరిచాం.
- source_word: שִׁבְטֵי
  choice: గోత్రాలలో ... గోత్రం
  rationale: ఈ సందర్భంలో שׁבט యొక్క బహువచనం ఇశ్రాయేలు గోత్రాలనే సూచిస్తుంది; ‘రాజదండాలు’ అనే మూలార్థం ఇక్కడ ఉద్దేశం కాదు.
- source_word: יִשְׂרָאֵל
  choice: ఇశ్రాయేలు
  rationale: ప్రజను లేదా దేశాన్ని సూచించే పేరును స్థిరమైన తెలుగు బైబిలు రూపంలో ఇచ్చాం.
theological_decisions:
- issue: దాను పాత్రలోని דין క్రియ భావం
  choice: ఇశ్రాయేలు గోత్రాలలో పూర్తి స్థానం కలిగిన గోత్రంగా దాను తన ప్రజలకు న్యాయం తీర్చడం లేదా పాలనాపరమైన తీర్పు చేయడం
  alternative: దాను తన ప్రజల పక్షాన న్యాయం సాధిస్తాడు లేదా వారిని సమర్థిస్తాడు
  rationale: దין క్రియ తీర్పు తీర్చడం, పాలించడం, ఒకరి పక్షాన న్యాయం సాధించడం వంటి భావాలను కలిగి ఉండగలదు. ‘ఇశ్రాయేలు గోత్రాలలో ఒక గోత్రంలా’ అనే పోలిక తీర్పు లేదా పాలనా పాత్రను ప్రధానంగా సూచిస్తుంది; ఇతర సాధ్యమైన భావాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడాం. ‘న్యాయం తీరుస్తాడు’ అనేది న్యాయనిర్ణయం, పాలన అనే భావాలను మోస్తూ సాధారణ పాఠకులకు అర్థమయ్యే రూపం. ప్రధాన పాఠంలోని [a] సూచిక సంబంధిత పాదసూచికతో సరిపోలుతుంది.
