id: GEN.49.27
reference: Genesis 49:27
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: בִּנְיָמִין֙ זְאֵ֣ב יִטְרָ֔ף בַּ/בֹּ֖קֶר יֹ֣אכַל עַ֑ד וְ/לָ/עֶ֖רֶב יְחַלֵּ֥ק שָׁלָֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/027.yaml
  text: Benjamin is a ravenous wolf[a]; in the morning he devours the prey[d][c][b], and in the evening he divides the spoil.
translation:
  language: te
  text: బెన్యామీను చీల్చివేసే తోడేలు[a]; ఉదయాన అతడు ఎరను[b] తింటాడు, సాయంకాలాన దోపుడు సొమ్మును[c] పంచుతాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వేటను చీల్చే తోడేలు.” హీబ్రూ క్రియ వేటను పట్టి చీల్చడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడి హీబ్రూ పదానికి సందర్భానుసారం “వేట,” “కొల్లసొమ్ము,” లేదా “దోపుడు సొమ్ము” అనే అర్థాలు కూడా రావచ్చు.
    reason: lexical_alternative
  - marker: c
    text: లేదా, “కొల్లసొమ్మును.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּנְיָמִין
  choice: బెన్యామీను
  rationale: వ్యక్తి పేరును ఆధునిక ప్రామాణిక తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: זְאֵב
  choice: తోడేలు
  rationale: హీబ్రూ నామవాచకానికి సహజమైన, స్పష్టమైన తెలుగు సమానార్థకం.
- source_word: יִטְרָף
  choice: చీల్చివేసే
  rationale: טרף అనే క్రియలో వేటను పట్టి చీల్చే మృగస్వభావం ఉంది. వస్తువును అదనంగా చేర్చకుండా హీబ్రూ కవిత్వపు సంక్షిప్తతను నిలిపాం.
- source_word: בַּבֹּקֶר
  choice: ఉదయాన
  rationale: కాలాన్ని తెలిపే పదబంధానికి సహజమైన, సంక్షిప్తమైన తెలుగు రూపం.
- source_word: יֹאכַל
  choice: తింటాడు
  rationale: మూలంలోని సాధారణ ‘తిను’ అనే క్రియను నేరుగా ఉంచాం; తోడేలు రూపకమే దాని తీవ్రతను తెలియజేస్తుంది.
- source_word: עַד
  choice: ఎరను
  rationale: తోడేలు రూపకంలో తినబడేది వేటగా లేదా ఎరగా అర్థమవుతుంది. ‘ఎర’ సాధారణ పాఠకునికి సహజంగా ఉండి, తరువాతి యుద్ధ-దోపుడు చిత్రానికి భిన్నతను నిలుపుతుంది.
- source_word: וְלָעֶרֶב
  choice: సాయంకాలాన
  rationale: ‘ఉదయాన’ అనే సమాంతర కాలపదంతో కవితా సమతుల్యతను కాపాడుతుంది.
- source_word: יְחַלֵּק
  choice: పంచుతాడు
  rationale: ఇక్కడ పీయేల్ రూపం దోపుడు సొమ్మును విభజించి పంచడాన్ని సూచిస్తుంది; తెలుగు వాడుకలో ‘పంచుతాడు’ సహజం.
- source_word: שָׁלָל
  choice: దోపుడు సొమ్మును
  rationale: యుద్ధంలో స్వాధీనం చేసుకున్న సొమ్ము అనే భావాన్ని సాధారణ ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: బెన్యామీనును గూర్చిన యాకోబు ఆశీర్వాదంలోని రూపక భావం
  choice: బలంగా వేటాడి, సాధించిన దానిని పంచే తోడేలు అనే సజీవ రూపకాన్ని మాత్రమే అనువాదంలో ఉంచాం.
  alternative: దీనిని బెన్యామీను గోత్రపు తరువాతి యుద్ధచరిత్రకు ప్రత్యక్ష ప్రవచనంగా వివరించడం.
  rationale: హీబ్రూ వచనం ఒక నిర్దిష్ట చారిత్రక నెరవేర్పును పేర్కొనదు. అందువల్ల అనువాదం రూపకంలోని బలాన్ని నిలిపి, చారిత్రక లేదా సిద్ధాంతపరమైన అన్వయాన్ని పాఠ్యంలోకి చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కవితాత్మకమైనప్పటికీ సాధారణ పాఠకునికి స్పష్టమైన, గౌరవప్రదమైన శైలి. ఉదయం–సాయంకాలం సమాంతర నిర్మాణాన్ని, తోడేలు నుంచి దోపుడు సొమ్ము పంచే విజేతవరకు సాగే రూపక ఉద్వేగాన్ని నిలిపాం.
