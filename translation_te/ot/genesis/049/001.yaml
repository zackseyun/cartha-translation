id: GEN.49.1
reference: Genesis 49:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּקְרָ֥א יַעֲקֹ֖ב אֶל בָּנָ֑י/ו וַ/יֹּ֗אמֶר הֵאָֽסְפוּ֙ וְ/אַגִּ֣ידָה לָ/כֶ֔ם אֵ֛ת אֲשֶׁר יִקְרָ֥א אֶתְ/כֶ֖ם בְּ/אַחֲרִ֥ית הַ/יָּמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/001.yaml
  text: Then Jacob called his sons and said[a], “Gather yourselves, and I will tell you what will happen to you in the latter days.”
translation:
  language: te
  text: 'అప్పుడు యాకోబు తన కుమారులను పిలిచి ఇలా అన్నాడు: “మీరందరూ కూడివచ్చండి; రాబోయే రోజుల్లో మీకు ఏమి జరుగుతుందో నేను మీకు తెలియజేస్తాను.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అంత్యదినాల్లో.” హెబ్రీ పదబంధం కొన్ని సందర్భాల్లో అంత్యకాల భావాన్ని కూడా కలిగి ఉండవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: పిలిచి
  rationale: కרא అనే క్రియ ఈ కథన సందర్భంలో పిలవడం లేదా సమక్షానికి రమ్మని ఆహ్వానించడం అనే అర్థం ఇస్తుంది; ‘పిలిచి’ సహజమైన ఆధునిక తెలుగు.
- source_word: בָּנָיו
  choice: తన కుమారులను
  rationale: తదుపరి సందర్భంలో పేరు పేరున ప్రస్తావించబడే యాకోబు మగ సంతానాన్నే సూచిస్తుంది.
- source_word: הֵאָסְפוּ
  choice: మీరందరూ కూడివచ్చండి
  rationale: నిఫాల్ ఆజ్ఞారూపంలోని సమకూరడం అనే భావాన్ని, సంబోధితులందరూ కలిసి రావాలనే ఉద్దేశాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וְאַגִּידָה לָכֶם
  choice: నేను మీకు తెలియజేస్తాను
  rationale: కోహోర్టేటివ్ రూపం యాకోబు ఉద్దేశాన్ని వ్యక్తం చేస్తుంది; ‘తెలియజేస్తాను’ ప్రకటనలోని గంభీరతను కాపాడుతుంది.
- source_word: אֵת אֲשֶׁר יִקְרָא אֶתְכֶם
  choice: మీకు ఏమి జరుగుతుందో
  rationale: ఇక్కడ קרה అనేది ఒక సంఘటన ఎవరికైనా సంభవించడం అనే నుడికారార్థంలో ఉంది; ‘జరుగుతుందో’ స్పష్టమైన సహజ తెలుగు.
- source_word: בְּאַחֲרִית הַיָּמִים
  choice: రాబోయే రోజుల్లో
  rationale: ఈ పదబంధం భవిష్య కాలాన్ని సూచిస్తుంది; కొన్ని సందర్భాల్లో అంత్యకాల భావాన్ని కూడా కలిగి ఉండవచ్చు. ప్రధాన పాఠంలో విస్తృతమైన భవిష్యదర్థాన్ని నిలుపుతుంది.
theological_decisions:
- issue: בְּאַחֲרִית הַיָּמִים అనే పదబంధాన్ని స్పష్టమైన అంత్యకాల పదబంధంగా అనువదించాలా
  choice: రాబోయే రోజుల్లో
  alternative: అంత్యదినాల్లో
  rationale: ఆదికాండము 49 సందర్భంలో యాకోబు తన కుమారులు మరియు వారి గోత్రాలకు భవిష్యత్తులో సంభవించబోయే వాటి గురించి మాట్లాడుతున్నాడు. హెబ్రీ పదబంధానికి సాధారణ భవిష్యదర్థమూ, కొన్ని సందర్భాల్లో అంత్యకాల భావమూ ఉండగలవు; అందువల్ల ప్రధాన పాఠంలో సాధారణ భావాన్ని, పాదసూచికలో ప్రత్యామ్నాయాన్ని ఉంచడం ఆ భావసందిగ్ధతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరమైన కథన శైలి. ‘కూడివచ్చండి,’ ‘తెలియజేస్తాను’ అనే పదాలు సందర్భంలోని అధికారపూర్వక కుటుంబ ప్రకటన స్వరాన్ని నిలుపుతాయి.
