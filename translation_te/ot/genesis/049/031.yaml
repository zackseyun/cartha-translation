translation_notes:
  register: సామాన్య ఆధునిక ప్రామాణిక తెలుగులో, గంభీరతను కోల్పోకుండా నేరుగా అనువదించబడింది. హీబ్రూ వాక్యంలోని మూడు సమాంతర భాగాలు, ‘అక్కడ’ మరియు ‘పాతిపెట్టు’ పునరావృతులు సాధ్యమైనంతవరకు నిలుపబడ్డాయి. చివరి భాగంలో וְשָׁמָּה యొక్క సంయోజక బలాన్ని సహజ తెలుగులో ‘అక్కడే’ ద్వారా వ్యక్తం చేశాం.
