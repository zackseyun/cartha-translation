  text: There they buried Abraham and Sarah his wife; there they buried Isaac and Rebekah his wife; and there I buried Leah.
translation:
  language: te
  text: అక్కడ అబ్రాహామును, అతని భార్య శారాను పాతిపెట్టారు; అక్కడ ఇస్సాకును, అతని భార్య రిబ్కాను పాతిపెట్టారు; మరియు అక్కడ నేను లేయాను పాతిపెట్టాను.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׁמָּה
  choice: అక్కడ
  rationale: ఈ స్థలవాచక క్రియావిశేషణం ముందుగా పేర్కొన్న సమాధి గుహను లేదా స్థలాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘అక్కడ’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: קָבְרוּ
  choice: పాతిపెట్టారు
  rationale: ఇది ఖల్ పరిపూర్ణ క్రియ, తృతీయ పురుష బహువచనం; కర్త పేర్కొనబడకపోయినా హీబ్రూ క్రియారూపంలోని క్రియాశీల భావాన్ని తెలుగు బహువచన గౌరవ/అనిర్దిష్ట రూపం సహజంగా నిలుపుతుంది.
- source_word: אִשְׁתּוֹ
  choice: అతని భార్య
  rationale: తృతీయ పురుష ఏకవచన ప్రత్యయంతో ఉన్న నామరూపానికి ఇది సహజమైన తెలుగు అనువాదం. శారా, రిబ్కా ఇద్దరి విషయంలోనూ ఈ పదబంధాన్ని పునరావృతం చేయడం మూల నిర్మాణాన్ని నిలుపుతుంది.
- source_word: קָבַרְתִּי
  choice: నేను ... పాతిపెట్టాను
  rationale: ఖల్ పరిపూర్ణ క్రియ, ఉత్తమ పురుష ఏకవచనం; లేయాను పాతిపెట్టిన తన గత చర్యను యాకోబు స్వయంగా చెబుతున్నాడు.
- source_word: קָבְרוּ ... קָבְרוּ ... קָבַרְתִּי
  choice: పాతిపెట్టారు ... పాతిపెట్టారు ... పాతిపెట్టాను
  rationale: మూలంలోని קבר క్రియ పునరావృతిని ఒకే తెలుగు క్రియతో నిలిపి, వాక్య లయను మరియు పదసంబంధాన్ని కాపాడింది.
- source_word: לֵאָה
  choice: లేయా
  rationale: తెలుగు బైబిలు వాడుకకు అనుగుణంగా వ్యక్తినామాన్ని లిప్యంతరీకరించింది.
