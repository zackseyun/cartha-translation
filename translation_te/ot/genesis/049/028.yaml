id: GEN.49.28
reference: Genesis 49:28
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כָּל אֵ֛לֶּה שִׁבְטֵ֥י יִשְׂרָאֵ֖ל שְׁנֵ֣ים עָשָׂ֑ר וְ֠/זֹאת אֲשֶׁר דִּבֶּ֨ר לָ/הֶ֤ם אֲבִי/הֶם֙ וַ/יְבָ֣רֶךְ אוֹתָ֔/ם אִ֛ישׁ אֲשֶׁ֥ר כְּ/בִרְכָת֖/וֹ בֵּרַ֥ךְ אֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/028.yaml
  text: 'All these are the twelve tribes of Israel[a], and this is what their father spoke to them when he blessed them: he blessed each one with the blessing appropriate to him.'
translation:
  language: te
  text: వీరందరూ ఇశ్రాయేలు పన్నెండు గోత్రాలు. వారి తండ్రి వారితో చెప్పినది ఇదే; అతడు వారిని ఆశీర్వదించాడు—ప్రతి ఒక్కరినీ వారి వారి ఆశీర్వాదం ప్రకారం ఆశీర్వదించాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూలో ‘ఆశీర్వదించాడు’ అనే క్రియ రెండుసార్లు వస్తుంది: అక్షరార్థానికి దగ్గరగా, “ప్రతి ఒక్కరి ఆశీర్వాదం ప్రకారం ఆయన వారిని ఆశీర్వదించాడు.”'
    reason: మూలంలోని ברך క్రియ పునరుక్తిని, అలాగే వ్యక్తివ్యక్తికి వర్తించే ఏకవచన ప్రయోగంతో పాటు ఉన్న బహువచన కర్మసూచనను తెలియజేయడానికి.
lexical_decisions:
- source_word: כָּל אֵלֶּה
  choice: వీరందరూ
  rationale: ఈ మాట యాకోబు కుమారులను సమష్టిగా సూచిస్తుంది. వ్యక్తులను సూచించే ఆధునిక సహజ తెలుగు రూపంగా ‘వీరందరూ’ ఎంచుకోబడింది.
- source_word: שִׁבְטֵי יִשְׂרָאֵל שְׁנֵים עָשָׂר
  choice: ఇశ్రాయేలు పన్నెండు గోత్రాలు
  rationale: హీబ్రూ సమాస సంబంధాన్ని, పన్నెండు అనే సంఖ్యను సూటిగా నిలుపుతుంది.
- source_word: וְזֹאת אֲשֶׁר דִּבֶּר לָהֶם אֲבִיהֶם
  choice: వారి తండ్రి వారితో చెప్పినది ఇదే
  rationale: దేవర్ క్రియకు సందర్భానుగుణమైన సహజ తెలుగు ‘చెప్పినది’; సంభాషణ దిశను ‘వారితో’ నిలుపుతుంది.
- source_word: וַיְבָרֶךְ אֹתָם
  choice: అతడు వారిని ఆశీర్వదించాడు
  rationale: వావ్-క్రమాన్ని కాలసంబంధ ఉపవాక్యంగా మార్చకుండా, హీబ్రూలోని స్వతంత్ర సమన్వయ భావాన్ని నిలుపుతుంది.
- source_word: אִישׁ אֲשֶׁר כְּבִרְכָתוֹ
  choice: ఒక్కొక్కరినీ అతని ఆశీర్వాదం ప్రకారం
  rationale: אִישׁ యొక్క విభజక భావాన్ని ‘ఒక్కొక్కరినీ’గా, כְּ యొక్క ప్రమాణార్థాన్ని ‘ప్రకారం’గా ఉంచింది; ‘తగిన’ వంటి వివరణాత్మక పదాన్ని ప్రధాన పాఠ్యంలో చేర్చలేదు.
- source_word: בֵּרַךְ אֹתָם
  choice: ఆశీర్వదించాడు
  rationale: ברך ధాతువు పునరుక్తిని తెలుగులోనూ నిలిపి, వాక్యపు గంభీరమైన సారాంశ శైలిని కాపాడుతుంది.
theological_decisions:
- issue: ప్రతి కుమారునికి వచ్చిన ‘అతని ఆశీర్వాదం’ స్వరూపం
  choice: అతని ఆశీర్వాదం ప్రకారం
  alternative: అతనికి తగిన ఆశీర్వాదంతో
  rationale: హీబ్రూ వాక్యం ఆశీర్వాదం ‘తగినది’ అని స్పష్టంగా వ్యాఖ్యానించదు. అందువల్ల సందర్భోచితతను ముందుగానే నిర్ణయించకుండా మూలంలోని సంక్షిప్తతను, భావవిస్తృతిని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా ఉండే గంభీర శైలి. మూలంలోని పునరుక్తి, సమన్వయ నిర్మాణం, ‘అతని ఆశీర్వాదం ప్రకారం’ అనే తెరచిన భావం నిలుపబడ్డాయి.
