  text: Simeon and Levi are brothers[a]; weapons of violence are their swords.
translation:
  language: te
  text: షిమ్యోను, లేవి అన్నదమ్ములు; హింసా సాధనాలే వారి కత్తులు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “హింసా ఆయుధాలే వారి పనిముట్లు.” “వారి కత్తులు” అని అనువదించిన హీబ్రూ పదం అరుదైనది; దాని అర్థం అనిశ్చితం. కొన్ని పాత అనువాదాలు “వారి నివాసాలు” అని ఇస్తాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוֹן
  choice: షిమ్యోను
  rationale: హీబ్రూ వ్యక్తిపేరును ఆధునిక ప్రామాణిక తెలుగు బైబిలు వాడుకకు తగినట్లు లిప్యంతరీకరించాం.
- source_word: וְלֵוִי
  choice: లేవి
  rationale: సంధానార్థం తెలుగులో విరామచిహ్నంతో సహజంగా వ్యక్తమవుతుంది; వ్యక్తిపేరును ప్రాచుర్యంలో ఉన్న తెలుగు రూపంలో ఇచ్చాం.
- source_word: אַחִים
  choice: అన్నదమ్ములు
  rationale: ఇక్కడ వారు నిజమైన సోదరులు కావడంతో, సాధారణ ‘సోదరులు’ కంటే సహజమైన కుటుంబసంబంధ పదాన్ని ఎంచుకున్నాం; హీబ్రూ నామవాక్యాన్ని తెలుగులో క్రియ లేకుండానే సహజంగా ఉంచాం.
- source_word: כְּלֵי חָמָס
  choice: హింసా సాధనాలు
  rationale: כְּלֵי అనే పదానికి సాధనాలు, పనిముట్లు, ఆయుధాలు వంటి విస్తృత అర్థాలున్నాయి. חָמָס తో కలిసి హింసకు ఉపయోగపడే సాధనాలనే సూచిస్తుంది; తరువాతి అరుదైన పదం విషయంలోని అనిశ్చితిని ముందుగానే అతిగా నిర్దిష్టం చేయకుండా ‘సాధనాలు’గా ఇచ్చాం.
- source_word: מְכֵרֹתֵיהֶם
  choice: వారి కత్తులు
  rationale: ఈ అరుదైన హీబ్రూ పదం అర్థం అనిశ్చితం. సందర్భంలోని హింసాత్మక భావానికి సరిపోయే ‘కత్తులు’ను ప్రధాన పాఠంలో ఉంచి, మరింత సాధారణమైన భావాన్నీ ప్రాచీన అనువాద సంప్రదాయంలోని భిన్న పఠనాన్నీ పాదసూచికలో తెలిపాం.
