revisions:
- from: 'తరువాత అతడు వారికి ఆజ్ఞాపిస్తూ ఇలా అన్నాడు: “నేను నా ప్రజల దగ్గరికి చేర్చబడబోతున్నాను.[a] హిత్తీయుడైన ఎఫ్రోను పొలంలో ఉన్న గుహలో, నా పితరులతో పాటు నన్ను పాతిపెట్టండి.”'
  to: 'తరువాత అతడు వారికి ఆజ్ఞాపించి ఇలా అన్నాడు: “నేను నా ప్రజల దగ్గరకు చేర్చబడబోతున్నాను.[a] నా పితరులతో పాటు నన్ను హిత్తీయుడైన ఎఫ్రోను పొలంలోని గుహలో పాతిపెట్టండి.”'
  rationale: The revision corrects the verbal sequence in the opening and improves Telugu clause order, while retaining every substantive element of the Hebrew and preserving the deliberately metaphorical death idiom.
