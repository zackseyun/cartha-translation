source:
  edition: WLC
  text: וַ/יְצַ֣ו אוֹתָ֗/ם וַ/יֹּ֤אמֶר אֲלֵ/הֶם֙ אֲנִי֙ נֶאֱסָ֣ף אֶל עַמִּ֔/י קִבְר֥וּ אֹתִ֖/י אֶל אֲבֹתָ֑/י אֶל הַ֨/מְּעָרָ֔ה אֲשֶׁ֥ר בִּ/שְׂדֵ֖ה עֶפְר֥וֹן הַֽ/חִתִּֽי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/029.yaml
  text: Then he commanded them and said to them[a], “I am about to be gathered to my people. Bury me with my fathers in the cave that is in the field of Ephron the Hittite,”
translation:
  language: te
  text: 'తరువాత అతడు వారికి ఆజ్ఞాపించి ఇలా అన్నాడు: “నేను నా ప్రజల దగ్గరకు చేర్చబడబోతున్నాను.[a] నా పితరులతో పాటు నన్ను హిత్తీయుడైన ఎఫ్రోను పొలంలోని గుహలో పాతిపెట్టండి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నేను నా ప్రజల దగ్గరకు చేర్చబడుతున్నాను.” ఈ హీబ్రూ నుడికారం సమీపిస్తున్న మరణాన్ని, మరణంలో తన ప్రజలతో లేదా పితరులతో కలయికను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: ఆజ్ఞాపిస్తూ
  rationale: צוה అనే క్రియలో ఉన్న గంభీరమైన ఆదేశ భావాన్ని నిలుపుతూ, వెంట వచ్చే ‘ఇలా అన్నాడు’ అనే మాటతో సహజమైన తెలుగు వాక్య నిర్మాణాన్ని ఇస్తుంది.
- source_word: וַיֹּאמֶר אֲלֵהֶם
  choice: వారికి ఇలా అన్నాడు
  rationale: సాధారణ హీబ్రూ సంభాషణ సూత్రాన్ని స్పష్టమైన, సహజమైన ఆధునిక తెలుగులో ప్రతిబింబిస్తుంది.
- source_word: נֶאֱסָף אֶל־עַמִּי
  choice: నేను నా ప్రజల దగ్గరికి చేర్చబడబోతున్నాను
  rationale: మరణం సమీపించిందనే సందర్భార్థాన్ని తెలియజేస్తూనే, ‘తన ప్రజల దగ్గరికి చేర్చబడటం’ అనే హీబ్రూ రూపకాన్ని తొలగించకుండా ఉంచుతుంది.
- source_word: עַמִּי
  choice: నా ప్రజలు
  rationale: ‘నా బంధువులు’ అని పరిమితం చేయకుండా, మూలంలోని ‘నా ప్రజలు’ అనే కుటుంబ, సమూహ మరియు ధార్మిక ప్రతిధ్వనులను నిలుపుతుంది.
- source_word: קִבְרוּ אֹתִי
  choice: నన్ను పాతిపెట్టండి
  rationale: బహువచన ఆజ్ఞను ఆధునిక ప్రామాణిక తెలుగులో నేరుగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: אֶל־אֲבֹתָי
  choice: నా పితరులతో పాటు
  rationale: అక్షరార్థమైన ‘నా పితరుల దగ్గరికి’ కంటే సమాధి సందర్భంలో వారితో కలిపి పాతిపెట్టాలనే భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: הַמְּעָרָה
  choice: గుహ
  rationale: మూలంలోని సాధారణ నామవాచకాన్ని అనవసరంగా ‘సమాధి గుహ’ అని విస్తరించకుండా అనువదిస్తుంది.
- source_word: אֲשֶׁר בִּשְׂדֵה עֶפְרוֹן
  choice: ఎఫ్రోను పొలంలో ఉన్న
  rationale: సంబంధ వాక్య భావాన్ని సహజమైన తెలుగు పదక్రమంలో నిలుపుతుంది.
- source_word: הַחִתִּי
  choice: హిత్తీయుడైన
  rationale: ఎఫ్రోను జాతి గుర్తింపును స్పష్టంగా తెలిపే ప్రామాణిక తెలుగు రూపం.
theological_decisions:
- issue: ‘నా ప్రజల దగ్గరికి చేర్చబడటం’ అనే మరణ సంబంధిత నుడికారం
  choice: రూపకాన్ని నిలుపుతూ ‘నేను నా ప్రజల దగ్గరికి చేర్చబడబోతున్నాను’ అని అనువదించడం
  alternative: ‘నేను చనిపోబోతున్నాను’
  rationale: ఈ హీబ్రూ నుడికారం కేవలం జీవశాస్త్రీయ మరణాన్ని చెప్పడానికంటే పితరులతో లేదా తన ప్రజలతో మరణంలో కలయికను సూచిస్తుంది. మరణానంతర స్థితిపై ఒక నిర్దిష్ట సిద్ధాంతాన్ని బలవంతంగా చొప్పించకుండా మూలంలోని ధార్మిక ఉద్వేగాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైన కుటుంబ ఆదేశ స్వరాన్ని నిలుపుతూ సాధారణ పాఠకులకు అర్థమయ్యే పదజాలం వాడబడింది. ‘పితరులు’ అనే గౌరవప్రదమైన బైబిలీయ పదం సందర్భానికి తగినదిగా ఉంచబడింది.
