review_pass:
  verdict: revise
  source_fidelity: The draft preserves the command, the idiom of being gathered to one's people, the burial directive, the ancestral association, and Ephron's Hittite identity. However, “ఆజ్ఞాపిస్తూ” makes the commanding sound simultaneous with the speaking, whereas the Hebrew sequentially says that he commanded them and then spoke.
  naturalness: The wording is generally clear and appropriately solemn. Recasting the opening as “ఆజ్ఞాపించి ఇలా అన్నాడు” is more idiomatic and accurately sequential. Moving the cave phrase nearer to “పాతిపెట్టండి” also produces smoother Telugu.
  terminology: “పితరులు,” “గుహ,” “హిత్తీయుడు,” and “ఎఫ్రోను” are suitable. The death idiom is retained without reducing it to merely dying or imposing a detailed afterlife doctrine.
  issues:
  - severity: low
    issue: Sequential narrative action is rendered as simultaneous action.
    rationale: వַיְצַו ... וַיֹּאמֶר means “he commanded ... and said”; “ఆజ్ఞాపిస్తూ ఇలా అన్నాడు” can mean “while commanding, he said.”
  - severity: low
    issue: The burial-location phrase is fronted before the burial command’s object and ancestral association.
    rationale: This is not inaccurate, but placing “హిత్తీయుడైన ఎఫ్రోను పొలంలోని గుహలో” directly before “పాతిపెట్టండి” is smoother and keeps the Hebrew’s burial-site specification clear.
  revised_text: 'తరువాత అతడు వారికి ఆజ్ఞాపించి ఇలా అన్నాడు: “నేను నా ప్రజల దగ్గరకు చేర్చబడబోతున్నాను.[a] నా పితరులతో పాటు నన్ను హిత్తీయుడైన ఎఫ్రోను పొలంలోని గుహలో పాతిపెట్టండి.”'
