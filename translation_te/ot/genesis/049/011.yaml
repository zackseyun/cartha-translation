  text: אֹסְרִ֤י לַ/גֶּ֨פֶן֙ עיר/ה וְ/לַ/שֹּׂרֵקָ֖ה בְּנִ֣י אֲתֹנ֑/וֹ כִּבֵּ֤ס בַּ/יַּ֨יִן֙ לְבֻשׁ֔/וֹ וּ/בְ/דַם עֲנָבִ֖ים סות/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/011.yaml
  text: Binding his donkey to the vine[a], and his donkey’s colt to the choice vine, he washes his garments in wine[c][b], and his robe in the blood of grapes.
translation:
  language: te
  text: 'తన గాడిదపిల్లను[a] ద్రాక్షతీగకు,

    తన ఆడగాడిద కోడెపిల్లను మేలురకం ద్రాక్షతీగకు[b] కట్టి,

    అతడు తన వస్త్రాలను ద్రాక్షామద్యంలో ఉతుకుతాడు;

    తన పైవస్త్రాన్ని ద్రాక్షపండ్ల రక్తంలో[c] ఉతుకుతాడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘తన యువ గాడిదను’; హీబ్రూ עַיִר అనే పదం యువ గాడిదను లేదా గాడిదపిల్లను సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘ఎంపికైన ద్రాక్షతీగకు’; హీబ్రూ שֹׂרֵקָה మేలురకం లేదా ఎంపికైన ద్రాక్షతీగను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: ‘ద్రాక్షపండ్ల రక్తం’ అనేది ద్రాక్షరసం లేదా ద్రాక్షామద్యాన్ని సూచించే హీబ్రూ కవితాత్మక ప్రయోగం; మూలంలోని చిత్రణను ఇక్కడ నిలిపాం.
    reason: cultural_note
lexical_decisions:
- source_word: אֹסְרִי
  choice: కట్టి
  rationale: ఇది אסר ధాతువు నుంచి వచ్చిన కర్తరి వర్తమాన కృదంత రూపం. తెలుగు వాక్యనిర్మాణంలో ‘కట్టి’ అని క్రియావిశేషణ రూపంలో ఇవ్వడం ద్వారా తరువాతి ప్రధాన క్రియతో అనుసంధానిస్తూ హీబ్రూ కవితాత్మక వర్ణనను సహజంగా నిలుపుతుంది.
- source_word: לַגֶּפֶן
  choice: ద్రాక్షతీగకు
  rationale: גֶּפֶן అనే ఏకవచన నామవాచకానికి ‘ద్రాక్షతీగ’ స్పష్టమైన, సాధారణ తెలుగు సమానం. ל ఉపసర్గలోని దిశ/అనుసంధాన భావాన్ని ‘కు’ తెలియజేస్తుంది.
- source_word: עִירֹה
  choice: తన గాడిదపిల్లను
  rationale: עַיִר యువ గాడిదను లేదా గాడిదపిల్లను సూచిస్తుంది. ‘గాడిదపిల్ల’ ఆధునిక తెలుగులో సహజంగా ఉండి, స్వామ్య ప్రత్యయాన్ని ‘తన’గా వ్యక్తం చేస్తుంది.
- source_word: וְלַשֹּׂרֵקָה
  choice: శ్రేష్ఠమైన ద్రాక్షతీగకు
  rationale: שֹׂרֵקָה ఎంపికైన, మేలురకం ద్రాక్షతీగను సూచిస్తుంది. ‘శ్రేష్ఠమైన’ దాని నాణ్యతాభావాన్ని స్పష్టంగా, గౌరవప్రదంగా అందిస్తుంది.
- source_word: בְּנִי אֲתֹנוֹ
  choice: తన ఆడగాడిద పిల్లను
  rationale: అక్షరార్థంగా ‘తన ఆడగాడిద కుమారుణ్ణి.’ జంతువుకు సంబంధించి ‘పిల్ల’ అనడం తెలుగులో సహజం; אֲתוֹן లోని ఆడజాతి సూచనను ‘ఆడగాడిద’గా నిలిపింది.
- source_word: כִּבֵּס
  choice: ఉతుకుతాడు
  rationale: పూర్తిక్రియా రూపం ఈ కవితాత్మక ఆశీర్వాదంలో సజీవమైన లక్షణాత్మక లేదా ముందుచూపుగల చర్యను చిత్రించగలదు. తెలుగు వర్తమాన రూపం ఆ దృశ్యాత్మకతను నిలుపుతూ కాలార్థాన్ని అనవసరంగా ఖరారు చేయదు.
- source_word: בַּיַּיִן
  choice: ద్రాక్షారసంలో
  rationale: יַיִן ఇక్కడ wine; ‘ద్రాక్షారసం’ సాధారణ పాఠకునికి స్పష్టంగా ఉంటుంది. ב ఉపసర్గలోని అంతర్భావాన్ని ‘లో’ నిలుపుతుంది—దానితో కడగడం మాత్రమే కాక, దానిలో ఉతకడం అనే సమృద్ధి చిత్రణను కాపాడుతుంది.
- source_word: לְבֻשׁוֹ
  choice: తన వస్త్రాలను
  rationale: రూపపరంగా ఏకవచనమైనా, לְבוּשׁ సమష్టిగా దుస్తులను సూచించగలదు. ‘వస్త్రాలను’ తెలుగు ప్రయోగంలో సహజంగా ఉండి తరువాతి సమాంతర పాదంతో సరిపోతుంది.
- source_word: וּבְדַם עֲנָבִים
  choice: ద్రాక్షపండ్ల రక్తంలో
  rationale: ‘ద్రాక్షపండ్ల రక్తం’ అనేది ద్రాక్షరసం లేదా ద్రాక్షారసానికి హీబ్రూ కవితాత్మక రూపకం. మూలంలోని బలమైన చిత్రణను సరళీకరించకుండా యథాతథ భావంతో నిలిపింది.
- source_word: סוּתוֹ
  choice: తన పైవస్త్రాన్ని
  rationale: ఇది לְבוּשׁ కు సమాంతరంగా ఉన్న వస్త్రపదం. ఖచ్చితమైన వస్త్రరకాన్ని అతిగా నిర్ధారించకుండా, బయటి కప్పుకునే వస్త్రం అనే భావాన్ని ‘పైవస్త్రం’ సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: యూదాపై యాకోబు పలికిన ఆశీర్వాదంలోని రాజసంబంధమైన లేదా మెస్సీయ సంబంధమైన చిత్రణ
  choice: అసాధారణ ద్రాక్షసమృద్ధి, వైభవాన్ని తెలిపే కవితాత్మక చిత్రణగా వచనాన్ని అనువదించడం; ప్రధాన పాఠ్యంలో మెస్సీయ వ్యాఖ్యానాన్ని ప్రత్యక్షంగా చేర్చకపోవడం.
  alternative: దీనిని ప్రత్యక్ష మెస్సీయ ప్రవచనంగా అనువాదంలోనే స్పష్టం చేయడం; లేదా యూదా గోత్రపు చారిత్రక సౌభాగ్యానికే పరిమితం చేయడం.
  rationale: విస్తృత యూదా ఆశీర్వాదం క్రైస్తవ సంప్రదాయంలో మెస్సీయ సంబంధంగా చదవబడినప్పటికీ, ఈ వచనంలోని హీబ్రూ పాఠ్యం ద్రాక్షతోటల అపార సమృద్ధిని కవితాత్మకంగా చిత్రిస్తుంది. అందువల్ల మూలం స్పష్టంగా చెప్పనిదాన్ని అనువాదం సిద్ధాంతపరంగా నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ ఆశీర్వాద కవిత్వానికి తగిన గౌరవప్రదమైన శైలి వాడబడింది. మొదటి రెండు పాదాలను ‘కట్టి’ అనే రూపంతో తరువాతి ప్రధాన క్రియకు అనుసంధానించి హీబ్రూ కవితా ప్రవాహం నిలుపబడింది. ‘ద్రాక్షపండ్ల రక్తం’ అనే అసాధారణ రూపకాన్ని వివరణాత్మకంగా మార్చకుండా ప్రధాన పాఠ్యంలో ఉంచి, పాదసూచికలో దాని భావాన్ని తెలిపాం.
