reference: Genesis 49:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: בְּ/סֹדָ/ם֙ אַל תָּבֹ֣א נַפְשִׁ֔/י בִּ/קְהָלָ֖/ם אַל תֵּחַ֣ד כְּבֹדִ֑/י כִּ֤י בְ/אַפָּ/ם֙ הָ֣רְגוּ אִ֔ישׁ וּ/בִ/רְצֹנָ֖/ם עִקְּרוּ שֽׁוֹר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/006.yaml
  text: Let my soul not enter their council[a]; let my honor not be joined to their assembly. For in their anger they killed a man[c][b], and in their self-will they hamstrung an ox.
translation:
  language: te
  text: 'వారి సమాలోచనలోకి[a] నా ప్రాణం ప్రవేశించకూడదు;

    వారి సభలో నా ఘనత[b] కలవకూడదు.

    ఎందుకంటే తమ కోపంలో వారు ఒక మనిషిని చంపారు;

    తమ ఇష్టానుసారం ఒక ఎద్దు కాలి నరాలు కోశారు[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వారి రహస్య సమాలోచనలోకి.’ סוֹד అనే హెబ్రీ పదం సన్నిహితమైన లేదా గోప్యమైన సమాలోచనను కూడా సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘వారి సభలో నా మహిమ ఏకం కాకూడదు.’
    reason: lexical_alternative
  - marker: c
    text: మసొరెటిక్ పాఠంలో שׁוֹר అనే పదం ‘ఎద్దు’ అని చదవబడుతుంది. కొందరు ఇదే వ్యంజనరూపాన్ని భిన్నంగా అర్థం చేసుకుని, ‘వారు ఒక గోడను పడగొట్టారు’ అని అనువదిస్తారు.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּסֹדָם
  choice: వారి ఆలోచనాసభలోకి
  rationale: סוֹד అనేది సన్నిహితుల లేదా విశ్వసనీయుల ఆలోచనాసభను, కొన్నిసార్లు రహస్య సమాలోచనను సూచిస్తుంది. కָהָל‌తో ఉన్న సమాంతరతను నిలుపుతూ, రహస్యత్వాన్ని ప్రధాన పాఠంలో అతిగా నిర్ధారించకుండా ‘ఆలోచనాసభ’గా అనువదించబడింది.
- source_word: תָּבֹא נַפְשִׁי
  choice: నా ప్రాణం ప్రవేశించకూడదు
  rationale: אַל‌తో కూడిన క్రియ ఇక్కడ బలమైన కోరిక లేదా నిరాకరణను వ్యక్తం చేస్తుంది. ‘నా ప్రాణం’ అని ఉంచడం ద్వారా נֶפֶשׁ అనే హెబ్రీ కవితాత్మక స్వీయసూచన నిలుస్తుంది.
- source_word: בִּקְהָלָם
  choice: వారి సమాజంతో
  rationale: קָהָל అంటే కూడిన సమూహం లేదా సభ. మొదటి పాదంలోని ఆలోచనాసభతో సమాంతరతను నిలుపుతూ, తెలుగులో సహజంగా ‘సమాజం’ ఎంచుకోబడింది.
- source_word: תֵּחַד כְּבֹדִי
  choice: నా ఘనత కలవకూడదు
  rationale: יחד ఇక్కడ కలవడం లేదా ఏకం కావడం అనే భావాన్ని ఇస్తుంది. כָּבוֹדִיకి ‘నా ఘనత’ అని ఇవ్వడం యాకోబు తన గౌరవాన్ని వారి హింసాత్మక చర్యనుంచి వేరుచేసుకోవడాన్ని వ్యక్తం చేస్తుంది; ‘నా మహిమ’ కూడా సాధ్యమే.
- source_word: בְאַפָּם
  choice: తమ కోపంలో
  rationale: אַף ఇక్కడ రూపకంగా కోపాన్ని సూచిస్తుంది. ‘తమ కోపంలో’ ఆధునిక తెలుగులో స్పష్టంగా, సహజంగా ఉంది.
- source_word: הָרְגוּ אִישׁ
  choice: వారు ఒక మనిషిని చంపారు
  rationale: אִישׁ ఏకవచనాన్ని సాధారణీకరించకుండా ‘ఒక మనిషి’గా నిలుపుకుంది; ఇది షెకెము సంఘటనను సూచించే అవకాశం ఉంది.
- source_word: וּבִרְצֹנָם
  choice: తమ ఇష్టానుసారం
  rationale: רָצוֹןకు ఇష్టం, సంకల్పం, సంతోషం అనే భావాలు ఉన్నాయి. ప్రతికూల సందర్భంలో ‘తమ ఇష్టానుసారం’ వారి అదుపులేని స్వచ్ఛంద చర్యను సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: עִקְּרוּ
  choice: కాలి నరాలు కోశారు
  rationale: עקר ఇక్కడ జంతువును కుంటిదానిగా చేయడానికి దాని వెనుక కాలి నరాలను కోయడాన్ని సూచిస్తుంది. తెలుగు పాఠకులకు చర్య స్పష్టంగా ఉండేందుకు ‘కాలి నరాలు కోశారు’ అని ఇవ్వబడింది.
- source_word: שׁוֹר
  choice: ఒక ఎద్దు
  rationale: మసొరెటిక్ స్వరచిహ్నాల ప్రకారం שׁוֹר అంటే ఎద్దు. עקרతో దాని కలయిక జంతువు కాలి నరాలు కోయడం అనే సాంప్రదాయ పఠనానికి మద్దతిస్తుంది.
theological_decisions:
- issue: స్వీయసూచక కవితాత్మక నిరాకరణలో כָּבוֹדִי అనువాదం
  choice: నా ఘనత
  alternative: నా మహిమ
  rationale: ఈ పాదంలో యాకోబు తన గౌరవాన్ని, వ్యక్తిగత ప్రతిష్ఠను వారి హింసనుంచి వేరుచేస్తున్నాడు. ‘ఘనత’ ఈ భావాన్ని తెలియజేస్తూ, ‘మహిమ’కు తరువాతి వేదాంతార్థాలను అనవసరంగా దిగుమతి చేయదు; ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచుతుంది.
- issue: చివరి పాదంలోని שׁוֹר పఠనం
  choice: ఒక ఎద్దు
  alternative: ఒక గోడ
  rationale: కొంతమంది అదే వ్యంజనాలను వేరుగా అర్థం చేసుకుని ‘గోడ’గా చదివినా, మసొరెటిక్ స్వరచిహ్నాలు ‘ఎద్దు’ అని సూచిస్తాయి; עקרతో ఉన్న పదబంధం జంతువును కుంటిదానిగా చేయడం అనే అర్థానికి మద్దతిస్తుంది. గమనించదగిన ప్రత్యామ్నాయాన్ని పాదసూచికలో భద్రపరచబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కవితాత్మక స్వరం ఉంచబడింది. ‘నా ప్రాణం’ అనే హెబ్రీ భావవ్యక్తీకరణను సమతలీకరించకుండా నిలిపి, హింసను తెలిపే చివరి క్రియను సాధారణ పాఠకులకు స్పష్టమైన రూపంలో ఇచ్చాం.
