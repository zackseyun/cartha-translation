  text: לִֽ/ישׁוּעָתְ/ךָ֖ קִוִּ֥יתִי יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/018.yaml
  text: For your salvation I wait[a], O Yahweh.
translation:
  language: te
  text: నీ రక్షణ కోసం నేను ఎదురుచూస్తున్నాను[a], యాహ్వే.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీ విమోచన కోసం నేను ఎదురుచూశాను, యాహ్వే.” హీబ్రూ పదాన్ని “రక్షణ” లేదా “విమోచన” అని అనువదించవచ్చు; క్రియారూపాన్ని “ఎదురుచూశాను” అని కూడా అర్థం చేసుకోవచ్చు.
    reason: lexical_and_aspectual_alternative
lexical_decisions:
- source_word: לִישׁוּעָתְךָ
  choice: నీ రక్షణ కోసం
  rationale: יְשׁוּעָה అనే నామవాచకం ‘రక్షణ’ లేదా ‘విమోచన’ను సూచిస్తుంది. ఈ కవితాత్మక సందర్భంలో ‘రక్షణ’ దాని విస్తృత భావాన్ని నిలుపుతుంది; לְ ఉపసర్గను తెలుగులో సహజంగా ‘కోసం’తో వ్యక్తపరిచాం.
- source_word: קִוִּיתִי
  choice: నేను ఎదురుచూస్తున్నాను
  rationale: קוה ఆశతో, నిరీక్షణతో ఎదురుచూడడాన్ని సూచిస్తుంది. హీబ్రూ సంపూర్ణ క్రియారూపం ఇక్కడ కొనసాగుతున్న నమ్మకభరిత నిరీక్షణను ప్రకటించగలదు; అందువల్ల సహజమైన తెలుగు వర్తమాన కొనసాగింపు రూపాన్ని వాడాం. ‘ఎదురుచూశాను’ అనే భావసాధ్యతను పాదటిప్పణిలో ఉంచాం.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన יהוהను బిరుదుతో మార్చకుండా, సాధారణంగా పునర్నిర్మించబడిన ఉచ్చారణకు దగ్గరగా తెలుగులో ‘యాహ్వే’గా లిప్యంతరీకరించాం.
theological_decisions:
- issue: క్రియాకాలం మరియు నిరీక్షణ స్వభావం
  choice: నేను ఎదురుచూస్తున్నాను
  alternative: నేను ఎదురుచూశాను
  rationale: קִוִּיתִי రూపం వ్యాకరణపరంగా సంపూర్ణ క్రియ అయినప్పటికీ, కవితాత్మక ప్రకటనలో స్థిరమైన లేదా కొనసాగుతున్న ఆశాభరిత నిరీక్షణను వ్యక్తపరచవచ్చు. ప్రధాన పాఠం ఆ కొనసాగింపు భావాన్ని ఇస్తుంది; గతకాల పఠనాన్ని పాదటిప్పణి కాపాడుతుంది.
- issue: יהוה దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా
  rationale: మూలంలో వ్యక్తిగత దైవనామమే ఉంది. దానిని ‘ప్రభువు’ వంటి బిరుదుతో భర్తీ చేయకుండా లిప్యంతరీకరించాం; ‘యాహ్వే’ హీబ్రూ నామానికి ఆధునిక పునర్నిర్మిత ఉచ్చారణను దగ్గరగా ప్రతిబింబిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన, గంభీరమైన కవితాత్మక ప్రార్థనగా మలిచాం. మూలంలోని ‘నీ రక్షణ కోసం’ అనే ముందస్తు ఉద్ఘాటనను నిలిపాం; సంబోధనను చివర ఉంచి హీబ్రూ పదక్రమాన్ని సాధ్యమైనంతవరకు ప్రతిబింబించాం.
