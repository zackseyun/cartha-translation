lexical_decisions:
- source_word: מִקְנֵה
  choice: కొనుగోలు చేశారు
  rationale: ఈ నామవాచకం కొనుగోలు ద్వారా సంపాదించినదానిని లేదా ఆ కొనుగోలు లావాదేవీని సూచిస్తుంది. సందర్భంలో పొలం, గుహ కొనుగోలు చేయబడిన విషయాన్ని సహజమైన ఆధునిక తెలుగులో క్రియారూపంగా వ్యక్తం చేశాం; కర్తను పేర్కొనకుండా మూలంలోని సంక్షిప్తతను నిలిపాం.
- source_word: הַשָּׂדֶה
  choice: ఆ పొలాన్ని
  rationale: భూమి యాజమాన్య సందర్భంలో שָׂדֶהకు సాధారణమైన, సహజమైన తెలుగు సమానం.
- source_word: וְהַמְּעָרָה
  choice: అందులోని గుహను
  rationale: సంబంధ వాక్యభాగాన్ని తెలుగులో సహజంగా కలిపి, పొలంలో ఉన్న గుహనే సూచిస్తున్నట్లు స్పష్టం చేస్తుంది.
- source_word: אֲשֶׁר בּוֹ
  choice: అందులోని
  rationale: ‘దానిలో ఉన్న’ అనే సంబంధాన్ని సంక్షిప్తమైన సహజ తెలుగు విశేషణ రూపంలో తెలియజేస్తుంది.
- source_word: מֵאֵת
  choice: దగ్గర
  rationale: కొనుగోలు ఎవరినుంచి జరిగిందో సూచించే మూలార్థాన్ని తెలుగు వాడుకలో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בְּנֵי חֵת
  choice: హేతు కుమారులు
  rationale: హీబ్రూ కుటుంబాధారిత జాతినామాన్ని పారదర్శకంగా నిలుపుతుంది; సందర్భానుసారమైన ‘హిత్తీయులు’ అనే రూపాన్ని పాదసూచికలో ఇస్తుంది.
