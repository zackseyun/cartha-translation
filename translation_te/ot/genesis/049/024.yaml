source:
  edition: WLC
  text: וַ/תֵּ֤שֶׁב בְּ/אֵיתָן֙ קַשְׁתּ֔/וֹ וַ/יָּפֹ֖זּוּ זְרֹעֵ֣י יָדָ֑י/ו מִ/ידֵי֙ אֲבִ֣יר יַעֲקֹ֔ב מִ/שָּׁ֥ם רֹעֶ֖ה אֶ֥בֶן יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/024.yaml
  text: Yet his bow remained steady, and his arms were made agile by the hands of the Mighty One of Jacob; from there is the Shepherd, the Stone of Israel.
translation:
  language: te
  text: 'అయినా అతని విల్లు దృఢంగా నిలిచింది;


    అతని బాహువులు చురుకుదనం పొందాయి,


    యాకోబు మహాబలవంతుని చేతులవల్ల.


    అక్కడి నుండి—కాపరి,


    ఇశ్రాయేలు శిల.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ చివరి మాటలు క్రియ లేకుండా చాలా సంక్షిప్తంగా ఉన్నాయి; పదశః: “అక్కడి నుండి—కాపరి, ఇశ్రాయేలు శిల.”'
    reason: మూలంలోని వ్యాకరణ సంక్షిప్తతను, ‘అక్కడి నుండి’ అనే పదబంధానికి తరువాతి బిరుదులతో ఉన్న సంబంధంలోని అస్పష్టతను తెలియజేయడానికి.
lexical_decisions:
- source_word: בְּאֵיתָן
  choice: దృఢంగా
  rationale: విల్లు బలంగా, స్థిరంగా నిలిచి ఉండడాన్ని సూచించే సహజమైన తెలుగు పదం.
- source_word: וַיָּפֹזּוּ
  choice: చురుకయ్యాయి
  rationale: బాహువులు బలహీనపడకుండా చురుకుగా, వడిగా పనిచేయగల స్థితిని వ్యక్తం చేస్తుంది; కేవలం ‘బలపడ్డాయి’ అని అర్థాన్ని కుదించదు.
- source_word: אֲבִיר יַעֲקֹב
  choice: యాకోబు పరాక్రమశాలి
  rationale: אֲבִיר అనే దైవబిరుదులోని శక్తి, పరాక్రమ భావాన్ని నిలుపుతుంది.
- source_word: רֹעֶה
  choice: కాపరి
  rationale: మసొరేటిక్ పాఠంలోని ‘కాపరి’ అనే బిరుదును నేరుగా నిలుపుతుంది.
- source_word: אֶבֶן יִשְׂרָאֵל
  choice: ఇశ్రాయేలు శిల
  rationale: ‘శిల’ అనే రూపకాన్ని వివరణతో భర్తీ చేయకుండా యథాతథంగా ఉంచుతుంది.
theological_decisions:
- issue: చివరి పాదంలోని ‘కాపరి’ మరియు ‘శిల’ ఎవరికో సూచిస్తున్నాయనే ప్రశ్న
  choice: బిరుదులను మూలంలోని సంక్షిప్త రూపంలోనే ఉంచడం
  alternative: వాటిని ‘యాకోబు పరాక్రమశాలి’కి స్పష్టంగా అన్వయించడం లేదా రాబోయే వ్యక్తిని సూచించేలా ‘వచ్చాడు’ అని చేర్చడం
  rationale: హీబ్రూ వాక్యం క్రియ లేకుండా సంక్షిప్తంగా ఉండి, సంబంధాన్ని పూర్తిగా స్పష్టం చేయదు. ఒక నిర్దిష్ట సిద్ధాంతపరమైన గుర్తింపును అనువాదంలో బలవంతంగా చేర్చకుండా అసలు ఉద్వేగాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కవితా ధోరణి పాటించబడింది. మొదటి మూడు పాదాలు సహజంగా చదవబడేలా ఉండగా, చివరి పాదంలోని మూల హీబ్రూ సంక్షిప్తతను డాష్ మరియు పాద విభజనతో నిలిపాం.
