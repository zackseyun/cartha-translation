id: GEN.49.4
reference: Genesis 49:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: פַּ֤חַז כַּ/מַּ֨יִם֙ אַל תּוֹתַ֔ר כִּ֥י עָלִ֖יתָ מִשְׁכְּבֵ֣י אָבִ֑י/ךָ אָ֥ז חִלַּ֖לְתָּ יְצוּעִ֥/י עָלָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/004.yaml
  text: Unstable as water[a], you shall not excel, because you went up to your father’s bed; then you defiled it—he went up to my couch.
translation:
  language: te
  text: నీళ్లలా అదుపులేనివాడివి; నీకు ఆధిక్యం ఉండదు, ఎందుకంటే నీవు నీ తండ్రి పడకపైకి ఎక్కావు. అప్పుడు నా పరుపును అపవిత్రం చేశావు—అతడు దానిపైకి ఎక్కాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, మరింత సాఫీగా: “అప్పుడు నీవు నా పరుపును అపవిత్రం చేశావు—దానిపైకి ఎక్కావు.” హీబ్రూ చివరి పదబంధంలో అకస్మాత్తుగా తృతీయ పురుషానికి మారి, “అతడు ఎక్కాడు” అని ఉంది; ఇది రూబేనును ఉద్దేశించిన ఆశ్చర్యోక్తితో కూడిన పునరుక్తి కావచ్చు.'
    reason: alternative_reading
lexical_decisions:
- source_word: פַּחַז
  choice: అదుపులేనివాడా
  rationale: ఈ పదం అస్థిరత, తొందరపాటు, నియంత్రణలేని ప్రవర్తన అనే భావాలను కలిగి ఉంది. నీటితో చేసిన ఉపమానంలో ‘అదుపులేని’ అనేది సహజంగా ఉండి నైతిక భావాన్ని కూడా నిలుపుతుంది.
- source_word: כַּמַּיִם
  choice: నీళ్లలా
  rationale: నీటి నియంత్రణలేని ప్రవాహాన్ని సూచించే సూటి ఉపమానం; ఆధునిక తెలుగులో సహజమైన రూపం.
- source_word: אַל תּוֹתַר
  choice: నీకు ఆధిక్యం ఉండదు
  rationale: ఇక్కడ יתר ధాతువు జ్యేష్ఠపుత్రుని అగ్రస్థానం లేదా ప్రాధాన్యాన్ని సూచిస్తుంది. నిషేధార్థక రూపాన్ని సందర్భానుసారంగా ఫలితాన్ని తెలిపే వాక్యంగా అనువదించాం.
- source_word: כִּי עָלִיתָ
  choice: ఎందుకంటే నీవు ... పైకి ఎక్కావు
  rationale: כִּי యొక్క కారణార్థాన్ని, అలాగే లైంగిక దోషాన్ని సూచించే మూలంలోని మృదూక్తి ‘ఎక్కావు’ను నిలుపుతుంది.
- source_word: מִשְׁכְּבֵי אָבִיךָ
  choice: నీ తండ్రి పడక
  rationale: హీబ్రూలో బహువచన రూపం ఉన్నప్పటికీ, ఇది తండ్రి వివాహశయ్యను సూచిస్తుంది; తెలుగులో ఏకవచనం సహజంగా భావాన్ని అందిస్తుంది.
- source_word: אָז
  choice: అప్పుడు
  rationale: చర్య తరువాతి పరిణామాన్ని సంక్షిప్తంగా సూచిస్తుంది.
- source_word: חִלַּלְתָּ
  choice: అపవిత్రం చేశావు
  rationale: కుటుంబ, లైంగిక సందర్భంలో జరిగిన అవమానకర అపవిత్రతను గంభీరంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: יְצוּעִי
  choice: నా పరుపు
  rationale: మొదటి పురుషంలోని ‘నా’ను నిలుపుతూ, ముందున్న ‘పడక’ను యాంత్రికంగా పునరావృతం చేయకుండా శయ్య అనే భావాన్ని సహజంగా ఇస్తుంది.
- source_word: עָלָה
  choice: అతడు ... పైకి ఎక్కాడు
  rationale: మసొరెటిక్ పాఠంలోని తృతీయ పురుష ఏకవచన రూపాన్ని యథాతథంగా నిలుపుతుంది; ఆకస్మిక పురుష మార్పును పాదటిప్పణిలో వివరిస్తాం.
theological_decisions:
- issue: రూబేను చేసిన లైంగిక దోషాన్ని సూచించే మృదూక్తి, దానిపై నైతిక తీర్పు
  choice: ‘నీ తండ్రి పడకపైకి ఎక్కావు’ అనే మృదూక్తిని, ‘అపవిత్రం చేశావు’ అనే నైతిక మూల్యాంకనాన్ని నిలుపడం
  alternative: ‘నీ తండ్రి ఉపపత్నితో శయనించావు’ అని ప్రత్యక్షంగా విపులీకరించడం లేదా ‘అపవిత్రపరిచావు’కు బదులు మరింత ఆరాధనాసంబంధ పదం వాడడం
  rationale: మూల హీబ్రూ స్పష్టంగా అర్థమయ్యే మృదూక్తినే వాడుతుంది. ఆదికాండము 35:22లోని వివరాన్ని ఈ వాక్యంలో చేర్చకుండా, ఆరోపణ యొక్క గంభీరతను నిలుపుతుంది.
- issue: చివరి పదబంధంలోని עָלָה వల్ల కలిగే పురుష మార్పు
  choice: ప్రధాన పాఠంలో మసొరెటిక్ తృతీయ పురుషాన్ని ‘అతడు ... ఎక్కాడు’గా నిలుపడం
  alternative: వాక్యాన్ని సాఫీ చేయడానికి ‘నీవు నా పరుపుపైకి ఎక్కావు’ లేదా ‘నా పరుపును అపవిత్రం చేశావు—దానిపైకి ఎక్కావు’ అని అనువదించడం
  rationale: హీబ్రూ చివర అకస్మాత్తుగా తృతీయ పురుషానికి మారుతుంది. నిజమైన పాఠ్య సందిగ్ధతను మౌనంగా పరిష్కరించకుండా ప్రధాన పాఠంలో దానిని నిలిపి, సహజీకరించిన పఠనాన్ని పాదటిప్పణిలో ఇస్తాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కుటుంబ-ఆశీర్వాద/తీర్పు శైలిని పాటించాం. ‘నీళ్లలా’ సాధారణ పాఠకులకు సహజం; ‘ఆధిక్యం’ జ్యేష్ఠపుత్రుని ప్రాధాన్యాన్ని తెలియజేస్తుంది. మూలంలోని లైంగిక మృదూక్తినీ, చివరి తృతీయ పురుష మార్పునీ ఉద్దేశపూర్వకంగా నిలుపుకున్నాం.
