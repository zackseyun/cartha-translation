revisions:
- from: నీళ్లలా అదుపులేనివాడా, నీకు ఆధిక్యం ఉండదు; ఎందుకంటే నీవు నీ తండ్రి పడకపైకి ఎక్కావు. అప్పుడు దానిని అపవిత్రం చేశావు—అతడు నా పరుపుపైకి ఎక్కాడు.[a]
  to: నీళ్లలా అదుపులేనివాడివి; నీకు ఆధిక్యం ఉండదు, ఎందుకంటే నీవు నీ తండ్రి పడకపైకి ఎక్కావు. అప్పుడు నా పరుపును అపవిత్రం చేశావు—అతడు దానిపైకి ఎక్కాడు.[a]
  rationale: The revision restores ‘నా పరుపు’ for יְצוּעִי while retaining the Masoretic third-person ‘అతడు’ in the final abrupt clause. It also changes the opening from an isolated vocative to a natural predicative statement without reducing the force of the oracle. The footnote continues to identify, rather than silently resolve, the final-clause ambiguity.
