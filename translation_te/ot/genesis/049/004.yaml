review_pass:
  verdict: revise
  source_fidelity: The draft correctly retains the causal charge, the euphemistic ‘went up,’ the loss of preeminence, and the abrupt final third-person verb. However, ‘దానిని అపవిత్రం చేశావు’ makes the object the father’s bed, whereas the Hebrew explicitly shifts to ‘my couch’ (יְצוּעִי). That first-person possessive should be retained in the main text.
  naturalness: ‘నీళ్లలా అదుపులేనివాడా’ is understandable but functions as an isolated vocative. ‘నీళ్లలా అదుపులేనివాడివి’ is a more natural Telugu predicate and better reflects the Hebrew characterization. The revised final clauses preserve the deliberate abruptness while making the referents grammatically clear.
  terminology: ‘ఆధిక్యం ఉండదు,’ ‘పడకపైకి ఎక్కావు,’ and ‘అపవిత్రం చేశావు’ are suitable modern-standard Telugu renderings in this solemn context. ‘నా పరుపు’ appropriately renders the first-person ‘my couch.’
  issues:
  - severity: medium
    issue: The main text omits the first-person possessive in the object of ‘you defiled.’
    rationale: Hebrew reads חִלַּלְתָּ יְצוּעִי, ‘you defiled my couch.’ The draft instead says ‘you defiled it,’ referring back to the father’s bed. This loses a marked feature of the source and conflicts with the supplied footnote.
  - severity: low
    issue: The opening uses a vocative rather than a predicative characterization.
    rationale: פַּחַז כַּמַּיִם introduces Jacob’s characterization of Reuben. ‘నీళ్లలా అదుపులేనివాడివి’ is both more idiomatic in this sentence and closer to that predicative force.
  revised_text: నీళ్లలా అదుపులేనివాడివి; నీకు ఆధిక్యం ఉండదు, ఎందుకంటే నీవు నీ తండ్రి పడకపైకి ఎక్కావు. అప్పుడు నా పరుపును అపవిత్రం చేశావు—అతడు దానిపైకి ఎక్కాడు.[a]
