base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/013.yaml
  text: Zebulun will dwell by the shore of the seas[a]; he will be by the shore of ships[c][b], and his flank will be toward Sidon.
translation:
  language: te
  text: జెబూలూను సముద్రాల తీరాన నివసిస్తాడు; అతడు ఓడల తీరాన ఉంటాడు, అతని పార్శ్వం సీదోను వైపు ఉంటుంది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “అతని పార్శ్వం” అనే మాటను “అతని సరిహద్దు,” “అతని అంచు,” లేదా “అతని చివరి ప్రాంతం” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: זְבוּלֻן
  choice: జెబూలూను
  rationale: వ్యక్తి పేరును ఆధునిక ప్రామాణిక తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: לְחוֹף יַמִּים
  choice: సముద్రతీరాల దగ్గర
  rationale: חֹוף అనే పదంలోని తీరం అనే ప్రాదేశిక భావాన్ని, יַמִּים అనే బహువచన రూపాన్ని నిలిపి, తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: יִשְׁכֹּן
  choice: నివసిస్తాడు
  rationale: שכן క్రియలోని నివసించడం లేదా స్థిరపడడం అనే భావానికి సహజమైన, గౌరవప్రదమైన తెలుగు రూపం.
- source_word: לְחוֹף אֳנִיּוֹת
  choice: ఓడల తీరాన
  rationale: ‘ఓడరేవు’ అనే సాధ్యమైన వ్యాఖ్యానాన్ని ప్రధాన పాఠ్యంలో చేర్చకుండా, హెబ్రీ చిత్రణను సన్నిహితంగా నిలుపుతుంది.
- source_word: וְיַרְכָתוֹ
  choice: అతని పార్శ్వం
  rationale: יַרְכָה పదానికి పార్శ్వం, అంచు, సరిహద్దు లేదా చివరి భాగం అనే భౌగోళిక భావాలు ఉండవచ్చు; ‘పార్శ్వం’ దాని concrete metaphorను అతిగా నిర్దిష్టం చేయకుండా నిలుపుతుంది.
- source_word: עַל צִידֹן
  choice: సీదోను వైపు
  rationale: ఇక్కడ עַל స్థలదిశను లేదా విస్తరణను సూచిస్తున్నదని జాగ్రత్తగా వ్యక్తం చేస్తుంది.
