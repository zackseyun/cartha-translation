  yaml_path: translation/ot/genesis/049/019.yaml
  text: Gad—a raiding band will raid him[b][a], but he will raid at their heels.
translation:
  language: te
  text: 'గాదు—ఒక దోపిడీ దండు అతనిపై దాడి చేస్తుంది[a];

    కాని అతడు వారి మడమ వద్ద దాడి చేస్తాడు[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ‘గాదు,’ ‘దోపిడీ దండు,’ ‘దాడి చేయడం’ అనే మాటల మధ్య పదక్రీడ ఉంది (గాద్ / గెదూద్ / యాగూద్). తెలుగులో దాన్ని పూర్తిగా పునరుత్పత్తి చేయడం సాధ్యం కాదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “గాదు, దోపిడిదారులు అతనిపై దాడి చేస్తారు; కాని అతడు వారి మడమ వద్ద దాడి చేస్తాడు.” చివరి మాటలు వెనుకనుంచి దాడి చేయడాన్ని లేదా వెనుకే తరుమడాన్ని సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: גָּד
  choice: గాదు
  rationale: యాకోబు కుమారుని, అతని గోత్రపు పేరు; ఆధునిక ప్రామాణిక తెలుగు రూపంగా లిప్యంతరీకరించబడింది.
- source_word: גְּדוּד
  choice: దోపిడిదండు
  rationale: దోచుకునే సాయుధ గుంపు అనే భావాన్ని స్పష్టంగా తెలియజేస్తుంది; చుట్టుపక్కల ఉన్న גדד మూలపు క్రియలతో హీబ్రూలోని పదప్రయోగాన్ని తెలుగులో సాధ్యమైనంతవరకు ప్రతిధ్వనింపజేస్తుంది.
- source_word: יְגוּדֶנּוּ
  choice: దోచుకుంటుంది
  rationale: మూడవ పురుష ఏకవచన ప్రత్యయంతో ఉన్న క్రియ; ఈ సందర్భంలో శత్రుసైన్యపు దోపిడిని సూచిస్తుంది. ‘దోపిడిదండు—దోచుకుంటుంది’ అనే అనుసంధానం మూలంలోని పదప్రయోగాన్ని కొంత నిలుపుతుంది.
- source_word: וְהוּא
  choice: కాని అతడు
  rationale: వావ్ సాధారణంగా ‘మరియు’ అని కూడా అర్థమవుతుంది; ఇక్కడ గాదు మొదట దాడికి గురై, తరువాత ఎదురు దాడి చేయడం వల్ల వ్యతిరేక మలుపును ‘కాని’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: יָגֻד
  choice: దాడి చేస్తాడు
  rationale: ముందటి క్రియతో ఒకే హీబ్రూ మూలానికి చెందినది. తెలుగులో ‘దోచుకుంటాడు’ అనడం ఇక్కడ వెంటాడి వెనుకనుంచి కొట్టే భావాన్ని తగ్గించవచ్చు కాబట్టి సహజమైన ‘దాడి చేస్తాడు’ ఎంచుకోబడింది; మూల పదప్రయోగ నష్టం పాదసూచికలో తెలిపబడింది.
- source_word: עָקֵב
  choice: దాని మడమలపై
  rationale: అక్షరార్థం ‘మడమ’; దోపిడిదండును సమూహ ఏకవచనంగా తీసుకొని, వెనుకనుంచి వెంటాడటం లేదా దాడి చేయటం అనే ఉద్దేశపూర్వకంగా అస్పష్టమైన రూపకాన్ని నిలుపుతుంది.
