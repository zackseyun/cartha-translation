  yaml_path: translation/ot/genesis/027/003.yaml
  text: Now then[b][a], please take your equipment—your quiver and your bow—and go out to the field and hunt game for me.
translation:
  language: te
  text: ఇప్పుడు, దయచేసి నీ సామగ్రిని[a]—నీ అమ్ములపొదిని, నీ విల్లును—తీసుకొని బయలుకు వెళ్లి నా కోసం వేటమాంసాన్ని వేటాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘నీ పనిముట్లను.’ ఇక్కడి హీబ్రూ పదం విస్తృతార్థకమైనది; తరువాత ‘నీ అమ్ములపొది, నీ విల్లు’ అని దానిని ప్రత్యేకంగా వివరిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: ఇప్పుడు
  rationale: ముందున్న మాట నుంచి తదుపరి ఆదేశానికి మార్పును సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; హీబ్రూ సంధాన భావం సందర్భంలో అంతర్లీనంగా ఉంది.
- source_word: שָׂא נָא
  choice: దయచేసి ... తీసుకొని
  rationale: ఈ సందర్భంలో שׂא అంటే ఆయుధ సామగ్రిని ‘తీసుకోవడం’; נָא లోని వినయపూర్వకమైన లేదా అభ్యర్థనాత్మకమైన భావాన్ని ‘దయచేసి’ తెలియజేస్తుంది.
- source_word: כֵלֶיךָ
  choice: నీ సామగ్రిని
  rationale: כְּלִי పాత్ర, పనిముట్టు, సామగ్రి లేదా ఆయుధం వంటి విస్తృత అర్థాలున్న పదం. తరువాత అమ్ములపొది, విల్లు అని వివరించబడుతున్నందున ‘సామగ్రి’ దాని విస్తృతతను కాపాడుతుంది.
- source_word: תֶּלְיְךָ
  choice: నీ అమ్ములపొదిని
  rationale: బాణాలను ఉంచే పొదిని సూచించే పదానికి సహజమైన, స్థిరమైన తెలుగు సమానం.
- source_word: וְקַשְׁתֶּךָ
  choice: నీ విల్లును
  rationale: కֶשֶׁת అనే సాధారణ హీబ్రూ పదానికి నేరమైన తెలుగు సమానం.
- source_word: וְצֵא הַשָּׂדֶה
  choice: బయలుకు వెళ్లి
  rationale: שָׂדֶה ఇక్కడ సాగుభూమి మాత్రమే కాక బహిరంగ ప్రదేశం లేదా పల్లెబయలును సూచించగలదు; వేట సందర్భంలో ‘బయలు’ సహజంగా సరిపోతుంది.
- source_word: וְצוּדָה
  choice: వేటాడి
  rationale: విల్లు, అమ్ములపొది ఉన్న సందర్భంలో జంతువును పట్టుకోవడం కోసం వేటాడడమే ఉద్దేశం.
- source_word: לִּי
  choice: నా కోసం
  rationale: ఇస్సాకు ప్రయోజనం కోసం వేట సంపాదించాలని సూచించే దాత్యర్థాన్ని నేరుగా తెలియజేస్తుంది.
- source_word: צידה
  choice: వేటమాంసం
  rationale: ఈ సందర్భంలో వేట ద్వారా సంపాదించిన ఆహారాన్ని సూచిస్తుంది; ఏ ప్రత్యేక జంతువునూ అనవసరంగా నిర్దేశించదు.
