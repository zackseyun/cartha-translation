  yaml_path: translation/ot/genesis/027/044.yaml
  text: And stay with him for a few days[a], until your brother's fury turns away.
translation:
  language: te
  text: నీ అన్న కోపం చల్లారే వరకు నువ్వు కొన్ని రోజులు అతనితో ఉండు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיָשַׁבְתָּ
  choice: నువ్వు ... ఉండు
  rationale: ישׁב ఇక్కడ తాత్కాలికంగా ఒకరి దగ్గర నివసించడం లేదా ఉండడం అనే భావాన్ని ఇస్తుంది; ఆధునిక తెలుగులో ‘ఉండు’ సహజంగా ఉంది.
- source_word: עִמּוֹ
  choice: అతనితో
  rationale: עם + మూడవ పురుష ఏకవచన ప్రత్యయం నేరుగా ‘అతనితో’ అని అర్థం; సందర్భంలో ఇది లాబానును సూచిస్తుంది.
- source_word: יָמִים אֲחָדִים
  choice: కొన్ని రోజులు
  rationale: అక్షరార్థంగా ‘కొద్ది రోజులు’; మాట్లాడే వ్యక్తి ఊహించిన తాత్కాలిక వ్యవధిని సహజంగా తెలియజేస్తుంది.
- source_word: עַד אֲשֶׁר
  choice: '... వరకు'
  rationale: చర్య ముగిసే కాలపరిమితిని సూచించే సాధారణ కాలసంబంధ నిర్మాణం.
- source_word: תָּשׁוּב
  choice: చల్లారే
  rationale: שׁוב అక్షరార్థంగా ‘తిరుగు’; తీవ్రమైన కోపం కర్తగా ఉన్నప్పుడు అది తగ్గిపోవడం అనే నుడికార భావం వస్తుంది. తెలుగులో ‘కోపం చల్లారడం’ అదే భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: חֲמַת
  choice: కోపం
  rationale: ఈ పదం తీవ్రమైన, మండే ఆగ్రహాన్ని సూచిస్తుంది. ‘కోపం చల్లారడం’ అనే తెలుగు నుడికారం తీవ్రతను సందర్భానుసారంగా వ్యక్తం చేస్తుంది.
- source_word: אָחִיךָ
  choice: నీ అన్న
  rationale: పదానికి సాధారణంగా ‘నీ సోదరుడు’ అని అర్థం; సందర్భంలో ఏశావు యాకోబుకు అన్న కాబట్టి ‘నీ అన్న’ మరింత సహజం మరియు నిర్దిష్టం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన వాక్య నిర్మాణం. హీబ్రూ ‘తిరుగు’ రూపకాన్ని యాంత్రికంగా అనువదించకుండా, కోపం తగ్గడాన్ని తెలిపే సహజ తెలుగు నుడికారం ‘కోపం చల్లారడం’ ఉపయోగించబడింది.
