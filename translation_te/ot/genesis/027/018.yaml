  text: So he went in to his father and said[a], “My father.” And he said, “Here I am. Who are you, my son?”
translation:
  language: te
  text: అప్పుడు అతడు తన తండ్రి దగ్గరికి వెళ్లి, “నా తండ్రీ!” అన్నాడు. ఆయన, “ఇదిగో, నేనున్నాను. నా కుమారుడా, నువ్వెవరు?” అని అడిగాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  choice: దగ్గరికి వెళ్లి
  rationale: בוא అనే క్రియ ఇక్కడ యాకోబు తన తండ్రి ఉన్న చోటికి ప్రవేశించి సమీపించడాన్ని సూచిస్తుంది. తెలుగు కథనంలో ‘దగ్గరికి వెళ్లి’ సహజంగా ఆ దిశను వ్యక్తం చేస్తుంది.
- source_word: אֶל אָבִיו
  choice: తన తండ్రి దగ్గరికి
  rationale: אֶל దిశను, אָבִיו ‘అతని తండ్రి’ని సూచిస్తాయి. మూలంలో లేని ఇస్సాకు అనే పేరును చేర్చలేదు.
- source_word: וַיֹּאמֶר
  choice: అన్నాడు / అని అడిగాడు
  rationale: మొదటి సందర్భంలో సాధారణ పలుకును ‘అన్నాడు’గా, రెండవ సందర్భంలో తరువాత వచ్చే ప్రశ్నను దృష్టిలో ఉంచుకొని సహజమైన తెలుగులో ‘అని అడిగాడు’గా అనువదించాం.
- source_word: אָבִי
  choice: నా తండ్రీ
  rationale: మొదటి పురుష ఏకవచన ప్రత్యయాన్ని నిలుపుతూ, సంబోధనను తెలుగులో ‘నా తండ్రీ’గా వ్యక్తం చేశాం.
- source_word: הִנֶּנִּי
  choice: ఇదిగో, నేనున్నాను
  rationale: హీబ్రూ ప్రత్యుత్తర సూత్రంలోని సమక్షత, స్పందించడానికి సిద్ధంగా ఉండే భావం రెండింటినీ కాపాడుతుంది.
- source_word: מִי אַתָּה
  choice: నువ్వెవరు
  rationale: ప్రశ్నార్థక పదం మరియు రెండవ పురుష ఏకవచన సర్వనామం నేరుగా ఎదుటివాని గుర్తింపును ప్రశ్నిస్తాయి.
- source_word: בְּנִי
  choice: నా కుమారుడా
  rationale: మొదటి పురుష ఏకవచన ప్రత్యయంతో కూడిన సంబోధనను స్పష్టంగా నిలిపింది.
