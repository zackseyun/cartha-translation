  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘నా తండ్రీ,’ ‘నా కుమారుడా’ అనే రూపాలు మూలంలోని ఆప్యాయ సంబోధనలను నిలుపుతాయి; మూలంలో లేని వ్యక్తి పేర్లు లేదా వ్యాఖ్యానాత్మక వివరాలు చేర్చలేదు.
