  yaml_path: translation/ot/genesis/027/016.yaml
  text: And she put the skins of the young goats on his hands and on the smooth part of his neck.
translation:
  language: te
  text: ఆమె మేకపిల్లల చర్మాలను అతని చేతులపైనా, అతని మెడలోని నునుపైన భాగంపైనా కప్పింది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֹרֹת
  choice: చర్మాలను
  rationale: బహువచన నిర్మాణరూపం ఇక్కడ కప్పడానికి ఉపయోగించిన జంతు చర్మాలను సూచిస్తుంది; ఆధునిక తెలుగులో ‘చర్మాలు’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: גְּדָיֵי הָעִזִּים
  choice: మేకపిల్లల
  rationale: ఈ పదబంధం మేకల చిన్న పిల్లలను సూచిస్తుంది; ‘మేకపిల్లలు’ తెలుగులో సహజమైన, నిర్దిష్టమైన పదం.
- source_word: הִלְבִּישָׁה
  choice: కప్పింది
  rationale: לבש ధాతువు హిఫీల్ రూపం ‘తొడిగించింది/వేసింది’ అనే భావం ఇస్తుంది. చేతులు, మెడపై చర్మాలను అమర్చిన సందర్భంలో ‘కప్పింది’ సహజంగా ఆ చర్యను తెలియజేస్తుంది.
- source_word: עַל יָדָיו
  choice: అతని చేతుల మీద
  rationale: మూలంలోని ఉపసర్గ పదబంధాన్ని నేరుగా, సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: חֶלְקַת צַוָּארָיו
  choice: అతని మెడలోని నునుపైన భాగం
  rationale: חֶלְקַת అనేది నునుపుదనాన్ని లేదా నునుపైన భాగాన్ని సూచిస్తుంది. ఇక్కడ ఏశావు రోమాలతో ఉన్నట్లు కనిపించేలా కప్పిన మెడ భాగాన్ని స్పష్టంగా వ్యక్తపరుస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం. హీబ్రూ వాక్యంలోని శరీర భాగాలపై చర్మాలను ఉంచిన స్పష్టమైన దృశ్యాన్ని నిలుపుతూ, తెలుగులో అసహజంగా ఉండే అతి అక్షరానువాదాన్ని నివారించింది.
