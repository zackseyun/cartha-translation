source:
  edition: WLC
  text: וַ/יֶּחֱרַ֨ד יִצְחָ֣ק חֲרָדָה֮ גְּדֹלָ֣ה עַד מְאֹד֒ וַ/יֹּ֡אמֶר מִֽי אֵפ֡וֹא ה֣וּא הַ/צָּֽד צַיִד֩ וַ/יָּ֨בֵא לִ֜/י וָ/אֹכַ֥ל מִ/כֹּ֛ל בְּ/טֶ֥רֶם תָּב֖וֹא וָ/אֲבָרֲכֵ֑/הוּ גַּם בָּר֖וּךְ יִהְיֶֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/033.yaml
  text: Then Isaac trembled with a very great trembling and said[a], “Who then was it who hunted game and brought it to me, and I ate from all of it before you came and blessed him? Yes, and he will be blessed.”
translation:
  language: te
  text: అప్పుడు ఇస్సాకు అత్యంతంగా వణికాడు. అతడు, “అయితే వేటాడి వేటమాంసాన్ని నా దగ్గరికి తెచ్చినవాడు ఎవరు? నువ్వు రాకముందే నేను వాటన్నిటిలోనుంచి తిని, అతన్ని ఆశీర్వదించాను. అవును, అతడు ఆశీర్వదించబడతాడు[a]” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నిజమే, అతడు ఆశీర్వదించబడతాడు.”
    reason: గַּם ఇక్కడ ‘అవును’ అనే ధృవీకరణగా లేదా ‘నిజమే/నిశ్చయంగా’ అనే ఉద్ఘాటనగా అర్థమవవచ్చు.
lexical_decisions:
- source_word: וַיֶּחֱרַד ... חֲרָדָה גְּדֹלָה עַד מְאֹד
  choice: చాలా తీవ్రంగా వణికిపోయి
  rationale: మూలంలోని క్రియ–నామ cognate construction ఇచ్చే తీవ్రమైన శారీరక, భావోద్వేగ స్పందనను సహజమైన ఆధునిక తెలుగులో బలంగా వ్యక్తం చేస్తుంది.
- source_word: מִי אֵפוֹא הוּא
  choice: అయితే ... ఎవరు?
  rationale: אֵפוֹא లోని నిర్ధారణాత్మక/అనుమానానంతర భావాన్ని ‘అయితే’ సహజంగా తెలియజేస్తుంది.
- source_word: הַצָּד צַיִד
  choice: వేటాడి, వేటమాంసాన్ని
  rationale: క్రియతో దాని cognate noun ఉన్న హీబ్రూ నిర్మాణాన్ని సాధ్యమైనంతవరకు నిలుపుతూ, צַיִדను ఒక నిర్దిష్ట జంతువు మాంసంగా పరిమితం చేయదు.
- source_word: וָאֹכַל מִכֹּל
  choice: అతడు తెచ్చిన వాటన్నిటిలోనుంచి నేను తిని
  rationale: מִן యొక్క partitive భావాన్ని ‘అన్నిటిలోనుంచి’ ద్వారా కాపాడి, సూచిత సందర్భాన్ని స్పష్టత కోసం ‘అతడు తెచ్చిన’ అని వెల్లడిస్తుంది.
- source_word: בְּטֶרֶם תָּבוֹא
  choice: నువ్వు రాకముందే
  rationale: కాలసంబంధ వాక్యాన్ని సరళంగా అనువదిస్తూ, ‘ముందే’ ద్వారా సంఘటన ఇప్పటికే జరిగిపోయిందనే బలాన్ని తెలియజేస్తుంది.
- source_word: וָאֲבָרֲכֵהוּ
  choice: అతన్ని ఆశీర్వదించాను
  rationale: మొదటి పురుష కర్తను తెలుగులో స్పష్టంగా ఉంచి, పూర్తయిన కార్యాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: גַּם בָּרוּךְ יִהְיֶה
  choice: అవును, అతడు ఆశీర్వదించబడినవాడిగానే ఉంటాడు
  rationale: גַּם లోని ధృవీకరణను ‘అవును’తో, בָּרוּךְ יִהְיֶה లోని కొనసాగనున్న ఫలిత స్థితిని ‘గానే ఉంటాడు’తో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ఇప్పటికే పలికిన ఆశీర్వాదం గురించి ఇస్సాకు చివరగా చేసిన ప్రకటన బలం
  choice: ఆ ఆశీర్వాదం నిలిచే ఉంటుందని బలంగా ధృవీకరించే ప్రకటన
  alternative: కేవలం అయిష్టంగా అంగీకరించిన మాట
  rationale: גַּם בָּרוּךְ יִהְיֶה సాధారణ రాజీనామా భావం కంటే ధృవీకరణాత్మక బలాన్ని కలిగి ఉంది. అనువాదం పితృపూర్విక ఆశీర్వాదం కథనంలో కలిగిన బరువును నిలుపుతుంది; అయితే దాని కార్యవిధానాన్ని వివరించే తరువాతి సిద్ధాంతాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, అయితే కథన గాంభీర్యం మరియు మూలంలోని తీవ్రత నిలిచేలా రూపొందించబడింది.
