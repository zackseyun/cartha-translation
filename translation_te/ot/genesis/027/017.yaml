  yaml_path: translation/ot/genesis/027/017.yaml
  text: Then she put the tasty food and the bread that she had made into the hand of Jacob her son[a].
translation:
  language: te
  text: అప్పుడు ఆమె తాను చేసిన రుచికరమైన వంటకాలను, రొట్టెను తన కుమారుడైన యాకోబు చేతిలో పెట్టింది[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ: “తన కుమారుడైన యాకోబు చేతిలో”; అంటే ఆమె వాటిని నేరుగా అతనికి అందించింది.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּתֵּן
  choice: అప్పుడు ... పెట్టింది
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది; נתן అనే క్రియ בְּיַדతో కలిసి ఒకరి చేతిలో పెట్టడం లేదా నేరుగా అందించడం అనే భావాన్ని ఇస్తుంది.
- source_word: הַמַּטְעַמִּים
  choice: రుచికరమైన వంటకాలను
  rationale: ఈ సందర్భంలో ఈ బహువచన నామవాచకం ప్రత్యేకంగా తయారుచేసిన రుచికరమైన ఆహారాన్ని సూచిస్తుంది. ‘వంటకాలు’ బహువచన రూపాన్నీ, సిద్ధం చేసిన ఆహార భావాన్నీ సహజంగా తెలియజేస్తుంది.
- source_word: הַלֶּחֶם
  choice: రొట్టెను
  rationale: לֶחֶםకు ఈ సందర్భంలో నేరమైన, సహజమైన తెలుగు సమానం ‘రొట్టె’.
- source_word: אֲשֶׁר עָשָׂתָה
  choice: తాను చేసిన
  rationale: עשהను నేరుగా ‘చేసిన’ అని అనువదించి, ప్రధాన చర్యకు ముందే ఆహారం సిద్ధమైందనే క్రమాన్ని తెలుగు అసమాపక క్రియారూపం సహజంగా తెలియజేస్తుంది.
- source_word: בְּיַד
  choice: చేతిలో
  rationale: హీబ్రూ ఏకవచన శరీరాంగ రూపకాన్ని నిలుపుతుంది; ఇక్కడ అది నేరుగా అతనికి అందించిందనే వ్యవహారిక భావాన్ని కలిగి ఉంది.
- source_word: יַעֲקֹב בְּנָהּ
  choice: తన కుమారుడైన యాకోబు
  rationale: హీబ్రూలోని పేరు-బంధుత్వ సంబంధాన్ని స్పష్టంగా, ఆధునిక తెలుగులో సహజమైన క్రమంలో వ్యక్తపరుస్తుంది.
