id: GEN.27.13
reference: Genesis 27:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/תֹּ֤אמֶר ל/וֹ֙ אִמּ֔/וֹ עָלַ֥/י קִלְלָתְ/ךָ֖ בְּנִ֑/י אַ֛ךְ שְׁמַ֥ע בְּ/קֹלִ֖/י וְ/לֵ֥ךְ קַֽח לִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/013.yaml
  text: His mother said to him[a], “Your curse be on me, my son. Only listen to my voice, and go[b], get them for me.”
translation:
  language: te
  text: అతని తల్లి అతనితో, “నా కుమారుడా, నీ శాపం నా మీద పడనీ. నీవు మాత్రం నా మాట విను[a]; వెళ్లి, వాటిని[b] నా కోసం తీసుకురా” అంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “నా స్వరం విను”; ఈ నుడికారం “నాకు విధేయుడవు” అనే భావాన్ని కూడా ఇవ్వగలదు.
    reason: lexical_alternative
  - marker: b
    text: “వాటిని” అనే కర్మ హీబ్రూ వాక్యంలో స్పష్టంగా లేదు; ముందు వచనంలో చెప్పిన మేకపిల్లలను ఇది సూచిస్తుంది.
    reason: cross_reference
lexical_decisions:
- source_word: וַתֹּאמֶר לֹו אִמּוֹ
  choice: అతని తల్లి అతనితో … అంది
  rationale: హీబ్రూ కథనంలోని సాధారణ ‘చెప్పింది’ నిర్మాణాన్ని సహజమైన తెలుగు ప్రత్యక్ష సంభాషణ క్రమంలో అందిస్తుంది.
- source_word: עָלַי קִלְלָתְךָ
  choice: నీ శాపం నా మీద పడనీ
  rationale: శాపపు పర్యవసానాన్ని తల్లి తానే భరిస్తాననే భావాన్ని తెలియజేస్తూ, ‘నీ శాపం’ అనే ద్వితీయ పురుష సంబంధాన్ని నిలుపుతుంది.
- source_word: בְּנִי
  choice: నా కుమారుడా
  rationale: ఆప్యాయతతో కూడిన సంబోధనను గౌరవప్రదమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: אַךְ
  choice: మాత్రం
  rationale: యాకోబు చేయవలసినదాన్ని తల్లి ఆజ్ఞ వినడానికే పరిమితం చేసే నిర్బంధక ఉద్ఘాటనను వ్యక్తం చేస్తుంది.
- source_word: שְׁמַע בְּקֹלִי
  choice: నా మాట విను
  rationale: అక్షరార్థంగా ‘నా స్వరం విను’; సందర్భంలో విధేయతను కూడా సూచించే హీబ్రూ నుడికారాన్ని సహజమైన తెలుగు నుడికారంతో అందిస్తుంది.
- source_word: וְלֵךְ קַח לִי
  choice: వెళ్లి, వాటిని నా కోసం తీసుకురా
  rationale: వరుస ఆజ్ఞలను సహజంగా అందిస్తుంది. క్రియకు హీబ్రూలో స్పష్టమైన కర్మ లేకపోయినా, ముందు వచనంలోని మేకపిల్లలే ఉద్దేశమని సందర్భం తెలియజేస్తుంది.
theological_decisions:
- issue: రిబ్కా శాపాన్ని భరించడాన్ని తెలిపే మాట యొక్క స్వరూపం
  choice: నీ శాపం నా మీద పడనీ
  alternative: నీకు వచ్చే శాపాన్ని నేను భరిస్తాను
  rationale: మొదటి రూపం హీబ్రూ మాటలోని సంక్షిప్తతను, గంభీరతను కాపాడుతుంది; దాన్ని వివరణాత్మక హామీగా పూర్తిగా విప్పి చెప్పకుండా మూలంలోని ఉద్వేగాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘నా మాట విను’ సాధారణ పాఠకునికి స్పష్టంగా ఉండటంతో పాటు హీబ్రూ నుడికారంలోని వినడం/విధేయత భావద్వంద్వాన్ని పాదటిప్పణితో నిలుపుతుంది.
