translation:
  language: te
  text: ఇప్పుడు, నా కుమారుడా, నేను నీకు ఆజ్ఞాపిస్తున్నదాని ప్రకారం నా మాట విను.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “నా స్వరం విను.” ఇక్కడ ఈ హీబ్రూ నుడికారం చెప్పిన మాటను శ్రద్ధగా విని అనుసరించడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: ఇప్పుడు
  rationale: ఇది తదుపరి ఆదేశాన్ని పరిచయం చేసే కాలసూచక సంభాషణ పదబంధం. తెలుగులో ‘ఇప్పుడు’ సహజంగా ఉండి సందర్భంలోని తక్షణతను నిలుపుతుంది; ప్రారంభంలోని וְ భావం ఇక్కడ ప్రత్యేకంగా ‘మరియు’ అని అనువదించకపోయినా కొనసాగింపు సందర్భంలో స్పష్టంగా ఉంటుంది.
- source_word: בְּנִי
  choice: నా కుమారుడా
  rationale: మొదటి పురుష ఏకవచన స్వామ్యప్రత్యయంతో ఉన్న సంబోధన. ‘నా కుమారుడా’ తల్లి తన కుమారుణ్ణి నేరుగా సంబోధిస్తున్న భావాన్ని గౌరవప్రదంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: שְׁמַע בְּקֹלִי
  choice: నా మాట విను
  rationale: అక్షరార్థంగా ‘నా స్వరం విను’; అయితే ఈ హీబ్రూ నుడికారం చెప్పినదాన్ని శ్రద్ధగా విని అనుసరించమనే భావాన్ని ఇస్తుంది. ‘నా మాట విను’ తెలుగులో సహజమైన సమానార్థక నుడికారం; ‘నాకు విధేయుడవు’ అని అనడం సందర్భంలో సూచితమైన విధేయతను అతిగా స్పష్టీకరిస్తుంది.
- source_word: לַאֲשֶׁר
  choice: విషయంలో
  rationale: తరువాత వచ్చే ఆజ్ఞను వినవలసిన నిర్దిష్ట విషయంగా అనుసంధానిస్తుంది. ‘విషయంలో’ మూలంలోని సంబంధాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: אֲנִי מְצַוָּה אֹתָךְ
  choice: నేను నీకు ఆజ్ఞాపిస్తున్న
  rationale: కర్తను తెలిపే స్పష్టమైన אֲנִיని ‘నేను’గా ఉంచి, వర్తమాన/తక్షణ చర్యను సూచించే participle‌ను ‘ఆజ్ఞాపిస్తున్న’గా అనువదించాం. צוה యొక్క బలాన్ని ‘ఉపదేశిస్తున్న’ వంటి మృదువైన పదంతో తగ్గించలేదు.
