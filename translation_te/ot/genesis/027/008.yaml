revisions:
- from: ఇప్పుడు, నా కుమారుడా, నేను నీకు ఆజ్ఞాపిస్తున్న విషయంలో నా మాట విను.[a]
  to: ఇప్పుడు, నా కుమారుడా, నేను నీకు ఆజ్ఞాపిస్తున్నదాని ప్రకారం నా మాట విను.[a]
  rationale: The revision replaces the less precise ‘విషయంలో’ with ‘దాని ప్రకారం,’ preserving the relationship conveyed by לַאֲשֶׁר while retaining the natural Telugu idiom ‘నా మాట విను.’ No theological interpretation has been added.
