source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר הַגִּ֤שָׁ/ה לִּ/י֙ וְ/אֹֽכְלָה֙ מִ/צֵּ֣יד בְּנִ֔/י לְמַ֥עַן תְּבָֽרֶכְ/ךָ֖ נַפְשִׁ֑/י וַ/יַּגֶּשׁ ל/וֹ֙ וַ/יֹּאכַ֔ל וַ/יָּ֧בֵא ל֦/וֹ יַ֖יִן וַ/יֵּֽשְׁתְּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/025.yaml
  text: And he said[a], “Bring it near to me, and I will eat of my son’s game, so that my soul may bless you.” So he brought it near to him, and he ate; and he brought him wine, and he drank.
translation:
  language: te
  text: అప్పుడు అతడు, “దాన్ని నా దగ్గరికి తీసుకురా. నా కుమారుని వేటమాంసంలో కొంత నేను తింటాను; తద్వారా నా ప్రాణం నిన్ను ఆశీర్వదిస్తుంది[a]” అన్నాడు. అతడు దాన్ని తన తండ్రి దగ్గరికి తీసుకొచ్చాడు; అతడు తిన్నాడు. తరువాత అతనికి ద్రాక్షామద్యం తీసుకొచ్చాడు; అతడు తాగాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత సహజంగా, “నేను నిన్ను ఆశీర్వదిస్తాను.” హీబ్రూలో, “నా ప్రాణం నిన్ను ఆశీర్వదిస్తుంది.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַגִּשָׁה
  choice: దాన్ని నా దగ్గరికి తీసుకురా
  rationale: హిఫీల్ ఆజ్ఞారూపం ‘దగ్గరికి తీసుకురా/సమర్పించు’ అనే భావాన్ని ఇస్తుంది. సందర్భం ద్వారా స్పష్టమైన కర్మను తెలుగులో ‘దాన్ని’ అని వ్యక్తం చేశాం.
- source_word: וְאֹכְלָה
  choice: నేను తింటాను
  rationale: మొదటి పురుష కోహోర్టేటివ్ ఇస్సాకు ఉద్దేశాన్ని సూచిస్తుంది; ఆజ్ఞ తరువాత సహజమైన తెలుగు క్రమంలో ‘నేను తింటాను’ అని అనువదించాం.
- source_word: מִצֵּיד בְּנִי
  choice: నా కుమారుడు వేటాడి తెచ్చిన మాంసంలో కొంత
  rationale: צַיִד వేటలో సంపాదించిన ఆహారాన్ని సూచిస్తుంది. తెలుగులో ‘వేటమాంసం’ కంటే ఈ విస్తృత రూపం సామాన్య పాఠకునికి సహజంగా ఉంటుంది; מִן యొక్క భాగార్థాన్ని ‘కొంత’ ద్వారా స్పష్టం చేశాం.
- source_word: לְמַעַן
  choice: అప్పుడు
  rationale: ఇక్కడ ఉద్దేశం/ఫలితం మధ్య సంబంధాన్ని చూపుతుంది. ముందున్న చర్య అనంతరం ఆశీర్వాదం జరగాలనే ఉద్దేశాన్ని సహజమైన తెలుగు వాక్యక్రమంలో ‘అప్పుడు’ తెలియజేస్తుంది.
- source_word: תְּבָרֶכְךָ נַפְשִׁי
  choice: నా ప్రాణం నిన్ను ఆశీర్వదిస్తుంది
  rationale: హీబ్రూలో נַפְשִׁי (‘నా ప్రాణం/నా అంతరంగ స్వయం’) వ్యాకరణపరంగా కర్తగా ఉంది. సాధారణ ‘నేను’గా కుదించకుండా మూలంలోని గంభీరమైన వ్యక్తిగత ప్రయోగాన్ని నిలిపాం.
- source_word: וַיַּגֶּשׁ לוֹ
  choice: దాన్ని తన తండ్రి దగ్గరికి తీసుకొచ్చాడు
  rationale: ముందటి ఆజ్ఞలోని נגשׁ క్రియ పునరావృతాన్ని ‘దగ్గరికి తీసుకొచ్చాడు’ ద్వారా నిలిపాం. తెలుగులో సూచన స్పష్టత కోసం ‘తన తండ్రి’ అని సంబంధాన్ని తెలిపాం.
- source_word: יַיִן
  choice: ద్రాక్షారసం
  rationale: יַיִן ద్రాక్షతో చేసిన మద్యపానీయాన్ని సూచిస్తుంది. ఆధునిక తెలుగు బైబిలు సందర్భంలో ‘ద్రాక్షారసం’ సహజమైన, గౌరవప్రదమైన పదం.
- source_word: וַיֵּשְׁתְּ
  choice: అతడు తాగాడు
  rationale: שׁתה యొక్క సాధారణ కథనరూపాన్ని నేరుగా, సహజంగా అనువదించాం.
theological_decisions:
- issue: ఆశీర్వదించే కర్తగా ‘నా ప్రాణం’ అనే హీబ్రూ ప్రయోగం
  choice: నా ప్రాణం నిన్ను ఆశీర్వదిస్తుంది
  alternative: నేను నిన్ను ఆశీర్వదిస్తాను
  rationale: ‘నేను’ అనేది సహజమైన భావానువాదమైనా, మూలపాఠం ‘నా ప్రాణం’ను స్పష్టంగా ఉంచుతుంది. ఆ వ్యక్తీకరణలోని సంపూర్ణ వ్యక్తిగత నిబద్ధతను, గంభీరతను తొలగించకుండా ప్రధాన పాఠ్యంలో నిలిపి, సహజ ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కథనశైలి సరళంగా, గౌరవప్రదంగా ఉంది. హీబ్రూ పదక్రమాన్ని యాంత్రికంగా అనుసరించకుండా తెలుగు సహజ వాక్యక్రమాన్ని వాడాం; అయితే ‘నా ప్రాణం’ అనే మూలంలోని ఉద్దేశపూర్వకమైన అసాధారణ ప్రయోగాన్ని పాదటిప్పణితో సహా నిలిపాం.
