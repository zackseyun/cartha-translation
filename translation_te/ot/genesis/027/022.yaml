  yaml_path: translation/ot/genesis/027/022.yaml
  text: So Jacob went near to Isaac his father[a], and he felt him and said, “The voice is Jacob’s voice, but the hands are Esau’s hands.”
translation:
  language: te
  text: అప్పుడు యాకోబు తన తండ్రి ఇస్సాకు దగ్గరికి వెళ్లాడు. ఇస్సాకు అతణ్ణి తడిమి చూసి, “స్వరం యాకోబు స్వరం; కానీ చేతులు ఏశావు చేతులు” అన్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּגַּשׁ
  choice: దగ్గరికి వెళ్లాడు
  rationale: Qal రూపంలోని נגשׁ దగ్గరకు రావడం లేదా సమీపించడం అనే భావాన్ని ఇస్తుంది; కథన గమనాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וַיְמֻשֵּׁהוּ
  choice: అతణ్ణి తడిమి చూసి
  rationale: ముట్టుకోవడం మాత్రమే కాక, గుర్తింపును నిర్ధారించడానికి స్పర్శ ద్వారా పరిశీలించడాన్ని ఈ సందర్భంలో సూచిస్తుంది.
- source_word: הַקֹּל
  choice: స్వరం
  rationale: ఇక్కడ ఇస్సాకు మాట్లాడుతున్న వ్యక్తి స్వరాన్ని స్పర్శ ద్వారా లభించిన ఆధారంతో పోలుస్తున్నాడు; అందువల్ల 'స్వరం' సందర్భానికి సరిపోతుంది.
- source_word: קוֹל יַעֲקֹב
  choice: యాకోబు స్వరం
  rationale: హీబ్రూ construct పదబంధాన్ని తెలుగులో సహజమైన స్వామ్య సంబంధంతో, దాని పునరుక్తి బలాన్ని నిలుపుతూ అనువదిస్తుంది.
- source_word: וְהַיָּדַיִם יְדֵי עֵשָׂו
  choice: కానీ చేతులు ఏశావు చేతులు
  rationale: హీబ్రూలోని క్రియలేని వాక్యాన్ని, పునరుక్తిని నిలుపుతుంది. וְ సాధారణంగా 'మరియు' అయినా, ఇక్కడ రెండు ఆధారాల మధ్య స్పష్టమైన వ్యత్యాసం ఉన్నందున 'కానీ' సహజమైన సమానార్థక ప్రయోగం.
- source_word: אָבִיו
  choice: తన తండ్రి
  rationale: హీబ్రూ పాఠంలోని బంధుత్వ సూచనను స్పష్టంగా నిలుపుతుంది.
