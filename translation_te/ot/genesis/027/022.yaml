  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథన శైలి. హీబ్రూ వాక్యంలోని 'స్వరం... స్వరం; చేతులు... చేతులు' అనే సమాంతర పునరుక్తిని ఉద్దేశపూర్వకంగా నిలిపాం.
