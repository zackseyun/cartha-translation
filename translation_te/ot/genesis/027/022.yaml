  terminology: యాకోబు, ఇస్సాకు, ఏశావు అనే పేర్ల రూపాలు స్థిరమైన తెలుగు బైబిలు వాడుకకు అనుగుణంగా ఉన్నాయి. ‘స్వరం,’ ‘చేతులు,’ ‘తండ్రి’ వంటి పదాలు సందర్భానుకూలమైనవి. ‘కానీ’ హీబ్రూ వావ్‌లో అంతర్లీనంగా ఉన్న విరుద్ధ ఆధారాల భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
