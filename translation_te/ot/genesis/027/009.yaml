source:
  edition: WLC
  text: לֶךְ נָא֙ אֶל הַ/צֹּ֔אן וְ/קַֽח לִ֣/י מִ/שָּׁ֗ם שְׁנֵ֛י גְּדָיֵ֥י עִזִּ֖ים טֹבִ֑ים וְ/אֶֽעֱשֶׂ֨ה אֹתָ֧/ם מַטְעַמִּ֛ים לְ/אָבִ֖י/ךָ כַּ/אֲשֶׁ֥ר אָהֵֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/009.yaml
  text: Please go to the flock and get for me from there two good young goats[a], and I will make them into tasty food for your father, just as he loves.
translation:
  language: te
  text: దయచేసి మంద దగ్గరికి వెళ్లి, అక్కడి నుంచి మంచి మేకపిల్లలు రెండింటిని నా కోసం తీసుకురా. వాటితో నీ తండ్రికి ఇష్టమైనట్టుగా రుచికరమైన వంటకాలు చేస్తాను.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֶךְ נָא
  choice: దయచేసి ... వెళ్లి
  rationale: לֶךְ అనేది ఏకవచన పురుష ఆజ్ఞారూపం; נָא ఆజ్ఞను మృదువైన అభ్యర్థనగా లేదా ప్రోత్సాహక విజ్ఞప్తిగా చేస్తుంది. ఆధునిక తెలుగులో ‘దయచేసి ... వెళ్లి’ ఈ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: הַצֹּאן
  choice: మంద
  rationale: צֹאן గొర్రెలు, మేకలు వంటి చిన్న పశువుల సమూహాన్ని సూచిస్తుంది. తరువాత మేకపిల్లలను ప్రత్యేకంగా పేర్కొనడం వల్ల ‘మంద’ సహజమైన విస్తృత పదం.
- source_word: וְקַח לִי מִשָּׁם
  choice: అక్కడి నుంచి ... నా కోసం తీసుకురా
  rationale: לקח అంటే ‘తీసుకోవడం/తెచ్చుకోవడం’. సందర్భంలో రిబ్కా వద్దకు వాటిని తీసుకురావడం ఉద్దేశం కాబట్టి, ‘తీసుకురా’ తెలుగులో సహజంగా గమ్యాన్ని సూచిస్తుంది; לִי భావాన్ని ‘నా కోసం’ నిలుపుతుంది.
- source_word: שְׁנֵי גְּדָיֵי עִזִּים טֹבִים
  choice: మంచి మేకపిల్లలు రెండింటిని
  rationale: ఈ నిర్మాణం అక్షరార్థంగా ‘మేకల పిల్లలు రెండు’ అని, అంటే రెండు చిన్న మేకలను సూచిస్తుంది. טֹבִים వాటి నాణ్యత లేదా వంటకు అనుకూలతను ‘మంచి’గా తెలియజేస్తుంది.
- source_word: וְאֶעֱשֶׂה אֹתָם מַטְעַמִּים
  choice: వాటితో ... రుచికరమైన వంటకాలు చేస్తాను
  rationale: מַטְעַמִּים రుచికరంగా సిద్ధం చేసిన వంటకాలు లేదా రుచికరమైన పదార్థాలను సూచిస్తుంది. ‘వాటితో’ అనేది మేకపిల్లలను వంటకు ఉపయోగించే సహజ తెలుగు వ్యక్తీకరణ; బహువచనాన్ని ‘వంటకాలు’ నిలుపుతుంది.
- source_word: לְאָבִיךָ כַּאֲשֶׁר אָהֵב
  choice: నీ తండ్రికి ఇష్టమైనట్టుగా
  rationale: אָהֵב అక్షరార్థంగా ‘అతడు ప్రేమించు’ అయినా, ఆహార సందర్భంలో ఇష్టాన్ని సూచిస్తుంది. ‘నీ తండ్రికి ఇష్టమైనట్టుగా’ తెలుగులో సహజంగా ఉండి, అతని అభిరుచికి అనుగుణంగా వంట చేయాలనే భావాన్ని నిలుపుతుంది.
