  text: וַ/יֹּ֨אמֶר עֵשָׂ֜ו אֶל אָבִ֗י/ו הַֽ/בְרָכָ֨ה אַחַ֤ת הִֽוא לְ/ךָ֙ אָבִ֔/י בָּרֲכֵ֥/נִי גַם אָ֖נִי אָבִ֑/י וַ/יִּשָּׂ֥א עֵשָׂ֛ו קֹל֖/וֹ וַ/יֵּֽבְךְּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/038.yaml
  text: Esau said to his father[a], “Do you have only one blessing, my father? Bless me too, my father!” Then Esau raised his voice and wept.
translation:
  language: te
  text: ఏశావు తన తండ్రితో[a], “నా తండ్రీ, నీ దగ్గర ఉన్నది ఒక్క ఆశీర్వాదమేనా? నా తండ్రీ, నన్ను కూడా ఆశీర్వదించు!” అన్నాడు. అప్పుడు ఏశావు తన స్వరాన్ని ఎత్తి ఏడ్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “ఆశీర్వాదం నీకు ఒక్కటేనా, నా తండ్రీ?” ఇస్సాకు ఇవ్వగలిగిన ఆశీర్వాదం ఒక్కటే ఉన్నట్లు కనిపించడంతో ఏశావు అనుభవించిన వేదనను హీబ్రూ వ్యక్తం చేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבְּרָכָה אַחַת הִוא לְךָ
  choice: నీ దగ్గర ఉన్నది ఒక్క ఆశీర్వాదమేనా?
  rationale: హీబ్రూలో ఇది క్రియలేని వాక్యం; అక్షరార్థంగా ‘ఆశీర్వాదం—ఒక్కటే—నీకు ఉందా?’ అనే భావం. ఇస్సాకు ఇవ్వగలిగిన ఆశీర్వాదం ఒక్కటేనా అన్న ఏశావు వేదనను సహజమైన ఆధునిక తెలుగులో ప్రశ్నగా వ్యక్తం చేస్తుంది.
- source_word: אָבִי
  choice: నా తండ్రీ
  rationale: ఏకవచన ప్రథమ పురుష ప్రత్యయం ‘నా’ అనే భావాన్ని స్పష్టంగా ఇస్తుంది. రెండు చోట్లా ఈ సంబోధనను ఉంచడం ఏశావు భావోద్వేగపూరిత వేడుకోలును, మూలంలోని పునరుక్తిని నిలుపుతుంది.
- source_word: בָּרֲכֵנִי
  choice: నన్ను ఆశీర్వదించు
  rationale: ברך అనే క్రియకు ఏకవచన ప్రథమ పురుష కర్మ ప్రత్యయం కలిసిన ప్రత్యక్ష ఆజ్ఞ; ఈ అనువాదం రూపానికీ భావానికీ నేరుగా సరిపోతుంది.
- source_word: גַּם אָֽנִי
  choice: నన్ను కూడా
  rationale: యాకోబుతోపాటు తానూ ఆశీర్వాదం పొందాలని ఏశావు కోరుతున్న చేర్పు భావాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: וַיִּשָּׂא ... קֹלוֹ
  choice: బిగ్గరగా
  rationale: అక్షరార్థంగా ‘తన స్వరాన్ని ఎత్తాడు’ అనే హీబ్రూ నుడికారం. ఏడుపుతో కలిసిన గట్టిస్వర విలాపాన్ని తెలుగులో సహజంగా ‘బిగ్గరగా’ తెలియజేస్తుంది.
- source_word: וַיֵּבְךְּ
  choice: ఏడ్చాడు
  rationale: ఈ క్రియ కన్నీటితో కూడిన ఏడుపు లేదా విలాపాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘ఏడ్చాడు’ స్పష్టమైన, సహజమైన సమానార్థకం.
- source_word: עֵשָׂו
  choice: ఏశావు
  rationale: తెలుగు బైబిలు వాడుకలో సుపరిచితమైన వ్యక్తినామ రూపం.
theological_decisions:
- issue: ఇస్సాకు వద్ద నిజంగా ఒక్క ఆశీర్వాదమే ఉందా, లేక ఏశావు అలా వేదనతో ప్రశ్నిస్తున్నాడా?
  choice: ప్రశ్నను ఏశావు పలికినట్లుగానే ఉంచడం
  alternative: ఇస్సాకు ఇవ్వడానికి ఒక్క ఆశీర్వాదమే మిగిలిందని వివరణాత్మకంగా చెప్పడం
  rationale: మూల హీబ్రూ ఏశావు వేదనతో వేసిన ప్రశ్నను ఇస్తుంది; ఆశీర్వాద స్వభావం గురించి అదనపు సిద్ధాంత నిర్ణయాన్ని వాక్యంలో చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘నా తండ్రీ’ అనే పునరుక్తి మూలంలోని భావోద్వేగ వేడుకోలును నిలుపుతుంది; ‘బిగ్గరగా ఏడ్చాడు’ హీబ్రూ నుడికారాన్ని సహజ తెలుగులో అందిస్తుంది.
