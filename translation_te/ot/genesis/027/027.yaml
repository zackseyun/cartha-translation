id: GEN.27.27
reference: Genesis 27:27
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּגַּשׁ֙ וַ/יִּשַּׁק ל֔/וֹ וַ/יָּ֛רַח אֶת רֵ֥יחַ בְּגָדָ֖י/ו וַֽ/יְבָרֲכֵ֑/הוּ וַ/יֹּ֗אמֶר רְאֵה֙ רֵ֣יחַ בְּנִ֔/י כְּ/רֵ֣יחַ שָׂדֶ֔ה אֲשֶׁ֥ר בֵּרֲכ֖/וֹ יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/027.yaml
  text: So he came near and kissed him[a], and he smelled the smell of his garments and blessed him and said, “See[b], the smell of my son is like the smell of a field that Yahweh has blessed.”
translation:
  language: te
  text: 'అప్పుడు అతడు దగ్గరకు వచ్చి అతనికి ముద్దుపెట్టాడు. అతడు అతని వస్త్రాల వాసన చూసి,[a] అతన్ని ఆశీర్వదించి ఇలా అన్నాడు: “ఇదిగో, నా కుమారుని వాసన యాహ్వే ఆశీర్వదించిన పొలం వాసనలా ఉంది.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూల హీబ్రూలో అక్షరార్థంగా, “అతని వస్త్రాల వాసనను వాసన చూశాడు.” ఈ వచనమంతటా ‘వాసన’ అనే ఒకే నామవాచకం పునరావృతమవుతుంది.
    reason: మూలంలోని సమానమూల పదప్రయోగం మరియు పదపునరుక్తిని తెలియజేయడం
lexical_decisions:
- source_word: וַיִּגַּשׁ
  choice: అప్పుడు అతడు దగ్గరకు వచ్చి
  rationale: నిరంతర కథన క్రమాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తూ, נגשׁ సూచించే దగ్గరకు రావడాన్ని నేరుగా నిలుపుతుంది.
- source_word: וַיִּשַּׁק לוֹ
  choice: అతనికి ముద్దుపెట్టాడు
  rationale: మూలంలో ఉన్న ముద్దుపెట్టే చర్యను అదనపు భావోద్వేగ వివరణ లేకుండా అనువదిస్తుంది.
- source_word: וַיָּרַח אֶת רֵיחַ בְּגָדָיו
  choice: అతని వస్త్రాల వాసన చూసి
  rationale: తెలుగులో ‘వాసన చూడడం’ సహజమైన ప్రయోగం. ‘వాసన’ అనే నామవాచకాన్ని ఉంచడం ద్వారా ఈ వచనంలోని רֵיחַ పదపునరుక్తి కూడా సాధ్యమైనంతవరకు నిలుస్తుంది.
- source_word: בְּגָדָיו
  choice: అతని వస్త్రాలు
  rationale: బహువచనాన్ని, ఆశీర్వాద దృశ్యానికి తగిన గౌరవప్రదమైన శైలిని కాపాడుతుంది.
- source_word: וַיְבָרֲכֵהוּ
  choice: అతన్ని ఆశీర్వదిస్తూ
  rationale: ఆశీర్వాదం పలికిన వెంటనే దాని మాటలు వస్తున్నందున తెలుగులో సహజంగా క్రియను ఉటంకింపుతో అనుసంధానిస్తుంది.
- source_word: רְאֵה
  choice: ఇదిగో
  rationale: ఇక్కడి ఆజ్ఞారూపం దృష్టిని ఆకర్షించే ఉద్ఘాటనగా పనిచేస్తుంది; ‘ఇదిగో’ ఆధునిక తెలుగులో సహజంగా అదే సంభాషణాత్మక పనిని చేస్తుంది.
- source_word: רֵיחַ בְּנִי
  choice: నా కుమారుని వాసన
  rationale: సంబంధ నిర్మాణాన్ని నేరుగా నిలుపుతూ, ముందున్న ‘వాసన’ పదాన్ని మళ్లీ ఉపయోగిస్తుంది.
- source_word: כְּרֵיחַ שָׂדֶה
  choice: పొలం వాసనలా
  rationale: כְּ సూచించే ఉపమానాన్ని, שָׂדֶה యొక్క సాధారణ అర్థమైన ‘పొలం’ను సంక్షిప్తంగా కాపాడుతుంది.
- source_word: אֲשֶׁר בֵּרֲכוֹ יְהוָה
  choice: యాహ్వే ఆశీర్వదించిన
  rationale: పొలం యాహ్వే ఆశీర్వాదాన్ని పొందినదనే ఫలితస్థితిని సహజమైన తెలుగు సంబంధ క్రియారూపంలో తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, ‘Yahweh’ ఉచ్చారణకు దగ్గరైన తెలుగు లిప్యంతరీకరణగా ఇస్తుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. కాబట్టి బిరుదైన ‘ప్రభువు’తో మార్చకుండా, ‘Yahweh’కు దగ్గరైన ‘యాహ్వే’ రూపాన్ని ఉపయోగించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా ఉండేలా, అయితే ఆశీర్వాద సందర్భానికి తగిన గౌరవప్రదమైన శైలి. ‘వాసన చూసి’ సహజ తెలుగు ప్రయోగం; పదపునరుక్తి ప్రధాన వచనంలోనూ సాధ్యమైనంతవరకు నిలుపబడింది.
