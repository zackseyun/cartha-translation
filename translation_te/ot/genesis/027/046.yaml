  to: 'అప్పుడు రిబ్కా ఇస్సాకుతో ఇలా అంది: “హేతు కుమార్తెల[a] వల్ల నా జీవితం పట్ల నాకు విసుగు కలిగింది. యాకోబు ఈ దేశపు కుమార్తెలైన ఇలాంటివారైన హేతు కుమార్తెలలో ఒకరిని భార్యగా తీసుకుంటే, ఇక నాకు జీవితం ఎందుకు?”'
  rationale: The revision corrects the misplaced footnote anchor, more accurately represents Rebekah’s weariness with her life, and improves register. ‘భార్యగా తీసుకుంటే’ reflects the Hebrew marriage idiom without adding interpretive content. The final rhetorical question remains concise and does not expand the sense into an explicit statement of self-harm or utility.
