id: GEN.27.46
reference: Genesis 27:46
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/תֹּ֤אמֶר רִבְקָה֙ אֶל יִצְחָ֔ק קַ֣צְתִּי בְ/חַיַּ֔/י מִ/פְּנֵ֖י בְּנ֣וֹת חֵ֑ת אִם לֹקֵ֣חַ יַ֠עֲקֹב אִשָּׁ֨ה מִ/בְּנֽוֹת חֵ֤ת כָּ/אֵ֨לֶּה֙ מִ/בְּנ֣וֹת הָ/אָ֔רֶץ לָ֥/מָּה לִּ֖/י חַיִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/046.yaml
  text: Then Rebekah said to Isaac[a], “I am weary of my life because of the daughters of Heth. If Jacob takes a wife from the daughters of Heth like these, from the daughters of the land, what is life to me?”
translation:
  language: te
  text: 'అప్పుడు రిబ్కా ఇస్సాకుతో ఇలా అంది: “హేతు కుమార్తెల[a] వల్ల నా జీవితం పట్ల నాకు విసుగు కలిగింది. యాకోబు ఈ దేశపు కుమార్తెలైన ఇలాంటివారైన హేతు కుమార్తెలలో ఒకరిని భార్యగా తీసుకుంటే, ఇక నాకు జీవితం ఎందుకు?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘హేతు కుమార్తెలు’ అంటే ‘హిత్తీయ స్త్రీలు’ లేదా ‘హిత్తీయుల కుమార్తెలు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: קַצְתִּי בְחַיַּי
  choice: నా జీవితం నాకు విసుగెత్తిపోయింది
  rationale: కוץ అనే క్రియ ఇక్కడ జీవితంపట్ల కలిగిన తీవ్రమైన విసుగు, వేదన, ఏవగింపును సూచిస్తుంది. ఆధునిక తెలుగులో ఈ భావాన్ని సహజంగా, అతిశయింపకుండా తెలియజేస్తుంది.
- source_word: מִפְּנֵי
  choice: కారణంగా
  rationale: ఇక్కడ ఈ విభక్తిపూర్వకం స్థలార్థం కాక కారణార్థాన్ని వ్యక్తం చేస్తుంది.
- source_word: בְּנוֹת חֵת
  choice: హేతు కుమార్తెలు
  rationale: మూలంలోని కుటుంబ-జాతి రూపకల్పనను నిలుపుతూ חֵת అనే పేరును లిప్యంతరీకరించింది.
- source_word: אִם לֹקֵחַ יַעֲקֹב אִשָּׁה
  choice: యాకోబు ... ఒకరిని పెళ్లి చేసుకుంటే
  rationale: ‘భార్యగా తీసుకోవడం’ అనే హెబ్రీ వివాహవ్యవహారాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: כָּאֵלֶּה
  choice: వీళ్లలాంటి
  rationale: ఇప్పటికే సందర్భంలో ఉన్న ఏశావు భార్యలలాంటి స్త్రీలను సూచించే సమీప సూచనను నిలుపుతుంది.
- source_word: מִבְּנוֹת הָאָרֶץ
  choice: ఈ దేశపు కుమార్తెలలో ఒకరిని
  rationale: మూలంలోని ‘దేశపు కుమార్తెలు’ అనే సమాంతర సామాజిక-జాతి వ్యక్తీకరణను నిలుపుతుంది; సందర్భానుసారంగా ‘ఈ’ చేర్చడం తెలుగులో సూచనను స్పష్టం చేస్తుంది.
- source_word: לָמָּה לִּי חַיִּים
  choice: ఇక నాకు ఈ జీవితం ఎందుకు?
  rationale: అక్షరార్థ ప్రశ్నలోని జీవితం వ్యర్థమనే వాక్చాతుర్య బలాన్ని సహజమైన తెలుగులో ఇస్తుంది; ‘బతికి ఏమి లాభం?’ అని అర్థాన్ని పూర్తిగా విప్పి చెప్పదు.
theological_decisions:
- issue: חֵת అనే జాతి సూచన
  choice: ప్రధాన పాఠ్యంలో ‘హేతు కుమార్తెలు’ అని ఉంచడం
  alternative: ‘హిత్తీయ స్త్రీలు’ లేదా ‘హిత్తీయుల కుమార్తెలు’
  rationale: మూలంలోని వంశపరమైన వ్యక్తీకరణను, హేతు అనే పేరును ప్రధాన పాఠ్యంలో కాపాడుతూ, పాఠకులకు సుపరిచితమైన జాతి పేరును పాదటిప్పణిలో ఇస్తుంది.
- issue: לָמָּה לִּי חַיִּים అనే ప్రశ్న బలం
  choice: ‘ఇక నాకు ఈ జీవితం ఎందుకు?’
  alternative: ‘ఇక నేను బతికి ఏమి లాభం?’
  rationale: మూలంలోని సంక్షిప్తమైన, భావోద్వేగభరితమైన ప్రశ్నను నిలుపుతుంది; ‘లాభం’ అనే భావాన్ని స్పష్టంగా చేర్చి సందిగ్ధతను తొలగించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘వీళ్లలాంటి’ సంభాషణలో సహజంగా ఉండి రిబ్కా మాటల భావోద్వేగ తక్షణత్వాన్ని నిలుపుతుంది; ‘దేశపు కుమార్తెలు’ మూలంలోని సామాజిక-వంశపరమైన సమాంతరతను కాపాడుతుంది.
