translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయితే కుటుంబ సంబంధానికి తగిన గౌరవభరితమైన కథన శైలిని ఉపయోగించాం. మూలంలో ప్రత్యేక పాఠభేదం లేదా వేదాంతపరమైన అస్పష్టత లేదు.
