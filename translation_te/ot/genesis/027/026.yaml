revisions:
- from: అప్పుడు అతని తండ్రి ఇస్సాకు అతనితో, “నా కుమారుడా, దయచేసి దగ్గరకు వచ్చి నన్ను ముద్దుపెట్టుకో” అన్నాడు.
  to: అప్పుడు అతని తండ్రియైన ఇస్సాకు అతనితో ఇలా అన్నాడు, “దయచేసి దగ్గరకు రా, నన్ను ముద్దుపెట్టు, నా కుమారుడా.”
