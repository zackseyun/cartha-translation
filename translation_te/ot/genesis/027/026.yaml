  yaml_path: translation/ot/genesis/027/026.yaml
  text: Then his father Isaac said to him[a], “Come near, please, and kiss me, my son.”
translation:
  language: te
  text: అప్పుడు అతని తండ్రియైన ఇస్సాకు అతనితో ఇలా అన్నాడు, “దయచేసి దగ్గరకు రా, నన్ను ముద్దుపెట్టు, నా కుమారుడా.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... అన్నాడు
  rationale: వావ్-కన్సిక్యూటివ్ కథనాన్ని ముందుకు తీసుకెళ్తుంది; ఆధునిక తెలుగు కథనశైలిలో ‘అప్పుడు’ వరుస క్రమాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: אֵלָיו
  choice: అతనితో
  rationale: మాట్లాడే క్రియతో కూడిన పరోక్ష కర్మను తెలుగులో సహజంగా ‘అతనితో’ అని వ్యక్తపరుస్తుంది.
- source_word: יִצְחָק אָבִיו
  choice: అతని తండ్రి ఇస్సాకు
  rationale: హీబ్రూ పదబంధంలోని బంధుత్వ ప్రాధాన్యాన్ని, ఇస్సాకు అనే వ్యక్తి గుర్తింపును రెండింటినీ నిలుపుతుంది.
- source_word: גְּשָׁה
  choice: దగ్గరకు వచ్చి
  rationale: భౌతికంగా సమీపించమనే ఆజ్ఞను సందర్భానుగుణంగా, సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: נָא
  choice: దయచేసి
  rationale: ఆజ్ఞను మృదువుచేసే వినయసూచక అవ్యయానికి ఆధునిక తెలుగులో సహజ సమానార్థకం.
- source_word: וּשְׁקָה לִּי
  choice: నన్ను ముద్దుపెట్టుకో
  rationale: హీబ్రూలోని ఆజ్ఞను, לִי సూచించే మొదటి పురుష సంబంధాన్ని తెలుగులో సహజమైన ప్రత్యక్ష కర్మ నిర్మాణంతో అందిస్తుంది.
- source_word: בְּנִי
  choice: నా కుమారుడా
  rationale: సంబోధన రూపాన్ని, తండ్రీకొడుకుల సంబంధాన్ని మరియు వాక్యంలోని ఆప్యాయ స్వరాన్ని నిలుపుతుంది.
