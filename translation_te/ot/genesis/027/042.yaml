review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the passive report to Rebekah, the elder/younger-son designations, and Esau’s self-consoling in relation to killing Jacob. However, it does not explicitly represent וַתִּשְׁלַח (“she sent”), which precedes and is distinct from her calling Jacob.
  naturalness: The Telugu is clear and suitably modern. Adding “కబురు పంపి” naturally conveys the otherwise omitted action without requiring an unspecified messenger.
  terminology: Names, kinship terms, and the rendering of מִתְנַחֵם ... לְהָרְגֶךָ are appropriate. “తనను తాను ఓదార్చుకుంటున్నాడు” retains the reflexive/self-consoling sense; “నిన్ను చంపాలని అనుకుంటూ” suitably expresses the killing purpose.
  issues:
  - severity: medium
    issue: The action וַתִּשְׁלַח is omitted.
    rationale: The Hebrew states that Rebekah sent before she called Jacob. “పిలిపించి” conveys calling/summoning but does not explicitly retain the preceding sending action.
  revised_text: ఏశావు—ఆమె పెద్ద కుమారుడు—చెప్పిన మాటలు రిబ్కాకు తెలియజేయబడ్డాయి. అప్పుడు ఆమె కబురు పంపి, తన చిన్న కుమారుడైన యాకోబును పిలిపించి అతనితో, “ఇదిగో, నీ అన్న ఏశావు నిన్ను చంపాలని అనుకుంటూ తనను తాను ఓదార్చుకుంటున్నాడు” అని చెప్పింది.
