  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֻּגַּ֣ד לְ/רִבְקָ֔ה אֶת דִּבְרֵ֥י עֵשָׂ֖ו בְּנָ֣/הּ הַ/גָּדֹ֑ל וַ/תִּשְׁלַ֞ח וַ/תִּקְרָ֤א לְ/יַעֲקֹב֙ בְּנָ֣/הּ הַ/קָּטָ֔ן וַ/תֹּ֣אמֶר אֵלָ֔י/ו הִנֵּה֙ עֵשָׂ֣ו אָחִ֔י/ךָ מִתְנַחֵ֥ם לְ/ךָ֖ לְ/הָרְגֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/042.yaml
  text: And the words of Esau, her older son, were told to Rebekah. So she sent and called Jacob, her younger son, and said to him, “Look, Esau your brother is consoling himself about you by planning to kill you.”
translation:
  language: te
  text: ఏశావు—ఆమె పెద్ద కుమారుడు—చెప్పిన మాటలు రిబ్కాకు తెలియజేయబడ్డాయి. అప్పుడు ఆమె కబురు పంపి, తన చిన్న కుమారుడైన యాకోబును పిలిపించి అతనితో, “ఇదిగో, నీ అన్న ఏశావు నిన్ను చంపాలని అనుకుంటూ తనను తాను ఓదార్చుకుంటున్నాడు” అని చెప్పింది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֻּגַּד
  choice: తెలియజేయబడ్డాయి
  rationale: హీబ్రూ నిష్క్రియ రూపాన్ని నిలుపుతూ, ఎవరు తెలియజేశారో మూలపాఠం చెప్పని భావాన్ని కాపాడుతుంది.
- source_word: בְּנָהּ הַגָּדֹל / בְּנָהּ הַקָּטָן
  choice: ఆమె పెద్ద కుమారుడు / తన చిన్న కుమారుడు
  rationale: కుటుంబ సంబంధాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: מִתְנַחֵם לְךָ
  choice: నిన్ను చంపాలని అనుకుంటూ తనను తాను ఓదార్చుకుంటున్నాడు
  rationale: מִתְנַחֵם యొక్క ఆత్మనేపద భావమైన ‘తనను తాను ఓదార్చుకోవడం’ను నిలుపుతుంది; לְךָ మరియు తరువాతి ఉద్దేశ్య క్రియను తెలుగులో సహజంగా కలుపుతుంది.
- source_word: לְהָרְגֶךָ
  choice: నిన్ను చంపాలని
  rationale: לְ ఉపసర్గతో కూడిన క్రియారూపంలోని ఉద్దేశ్య భావాన్ని సహజంగా అందిస్తుంది.
theological_decisions:
- issue: ఏశావు మనస్థితి మరియు హత్యా సంకల్పం మధ్య సంబంధం
  choice: “నిన్ను చంపాలని అనుకుంటూ తనను తాను ఓదార్చుకుంటున్నాడు”
  alternative: “నిన్ను చంపే ఆలోచనతో తనను తాను ఓదార్చుకుంటున్నాడు”
  rationale: హత్యను తలచుకోవడమే అతనికి ఓదార్పుగా ఉందనే కఠినమైన మూలభావాన్ని నిలుపుతుంది; దానిని కేవలం కోపం తగ్గించుకోవడం లేదా పశ్చాత్తాపపడడం అని మార్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కథనానికి తగిన గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. ‘ఇదిగో’ ద్వారా הִנֵּה యొక్క దృష్టి ఆకర్షణ భావం నిలుపబడింది.
