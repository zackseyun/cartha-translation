source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יַעֲקֹ֔ב אֶל רִבְקָ֖ה אִמּ֑/וֹ הֵ֣ן עֵשָׂ֤ו אָחִ/י֙ אִ֣ישׁ שָׂעִ֔ר וְ/אָנֹכִ֖י אִ֥ישׁ חָלָֽק־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/011.yaml
  text: But Jacob said to Rebekah his mother[a], “Look, Esau my brother is a hairy man[b], and I am a smooth man.”
translation:
  language: te
  text: అయితే యాకోబు తన తల్లి రిబ్కాతో, “చూడు[a], నా సోదరుడైన ఏశావు ఒంటి మీద వెంట్రుకలు గలవాడు; నేను మాత్రం నునుపైన వాణ్ణి[b],” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఇదిగో” లేదా “చూడండి”; ఈ పదం యాకోబు చెప్పబోయే అభ్యంతరంపై శ్రద్ధ నిలిపేలా చేస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ “నునుపైన” అనేది ఏశావుకు భిన్నంగా యాకోబు శరీరంపై వెంట్రుకలు లేకపోవడాన్ని సూచిస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అయితే ... అన్నాడు
  rationale: వావ్-క్రమకారకం కథనాన్ని ముందుకు నడిపిస్తుంది; సందర్భంలో యాకోబు తన తల్లి పథకానికి అభ్యంతరం చెబుతున్నందున ‘అయితే’ సహజంగా ఆ వ్యతిరేక మలుపును తెలియజేస్తుంది.
- source_word: אִמּוֹ
  choice: తన తల్లి
  rationale: రిబ్కా యాకోబుకు తల్లి అని మూలంలోని సంబంధ సూచనను పేరుతో పాటు నిలుపుతుంది.
- source_word: הֵן
  choice: చూడు
  rationale: యాకోబు తన ఆందోళనను ముందుకు తెచ్చే శ్రద్ధాకర్షక అవ్యయానికి ఆధునిక, సహజమైన సమానం.
- source_word: עֵשָׂו אָחִי
  choice: నా అన్న ఏశావు
  rationale: אָחִי అంటే సాధారణంగా ‘నా సహోదరుడు’; ఈ కథన సందర్భంలో ఏశావు పెద్దవాడని తెలిసినందున సహజమైన తెలుగు బంధుత్వ పదం ‘అన్న’ వాడబడింది.
- source_word: אִישׁ שָׂעִר
  choice: ఒంటినిండా వెంట్రుకలున్నవాడు
  rationale: అక్షరార్థంగా ‘వెంట్రుకలుగల మనిషి’; శరీరంపై దట్టంగా వెంట్రుకలు ఉండడమే భావమని సహజ తెలుగులో స్పష్టం చేస్తుంది.
- source_word: וְאָנֹכִי
  choice: నేనేమో
  rationale: స్వతంత్ర సర్వనామంలోని ఉద్ఘాటనను, ఏశావుతో ఉన్న స్పష్టమైన వ్యత్యాసాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אִישׁ חָלָק
  choice: నున్నని ఒంటివాణ్ణి
  rationale: ఏశావు వెంట్రుకల ఒంటికి విరుద్ధంగా యాకోబు ఒంటిపై వెంట్రుకలు లేక నున్నగా ఉండడాన్ని సూచిస్తుంది; వ్యక్తిత్వం లేదా మాటతీరును సూచిస్తున్నట్టు అపార్థం కాకుండా ‘ఒంటి’ని చేర్చింది.
