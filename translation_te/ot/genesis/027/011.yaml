  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సహజంగా వినిపించే గౌరవప్రద కథనశైలి. ‘ఒంటినిండా వెంట్రుకలున్నవాడు’—‘నున్నని ఒంటివాణ్ణి’ అనే సమాంతర వ్యత్యాసంతో హెబ్రీ మూలంలోని భావాన్ని స్పష్టంగా ఉంచింది.
