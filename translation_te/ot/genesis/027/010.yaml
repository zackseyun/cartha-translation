  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הֵבֵאתָ֥ לְ/אָבִ֖י/ךָ וְ/אָכָ֑ל בַּ/עֲבֻ֛ר אֲשֶׁ֥ר יְבָרֶכְ/ךָ֖ לִ/פְנֵ֥י מוֹתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/010.yaml
  text: Then you shall bring it to your father, and he will eat, so that he may bless you before his death.
translation:
  language: te
  text: నీ తండ్రి దాన్ని తిని, తాను చనిపోకముందు నిన్ను ఆశీర్వదించేలా దాన్ని ఆయన దగ్గరకు తీసుకెళ్లు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהֵבֵאתָ
  choice: తీసుకువెళ్లు
  rationale: సూచనల వరుసలో ఉన్న సంయుక్త క్రియారూపం ఆజ్ఞ భావాన్ని కలిగిస్తుంది; ఆధునిక తెలుగులో సహజమైన ప్రత్యక్ష ఆజ్ఞగా అనువదించబడింది.
- source_word: לְאָבִיךָ
  choice: నీ తండ్రి దగ్గరికి
  rationale: లక్ష్యాన్ని సూచించే לְ మరియు రెండవ పురుష ఏకవచన ప్రత్యయాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וְאָכָל
  choice: ఆయన దాన్ని తిని
  rationale: తదుపరి చర్యను సూచించే రూపం; తెలుగు వాక్యనిర్మాణంలో ఆశీర్వాదానికి ముందరి చర్యగా అసమాపక క్రియతో సహజంగా అనుసంధానించబడింది.
- source_word: בַּעֲבוּר אֲשֶׁר
  choice: … ఆశీర్వదిస్తాడు
  rationale: ఈ సంయుక్త పదబంధం ఉద్దేశాన్ని తెలియజేస్తుంది. తెలుగులో చర్యల క్రమం మరియు సందర్భం ద్వారా—ఆయన తిని, ఆపై ఆశీర్వదించడం—ఆ ఉద్దేశ భావం సహజంగా వ్యక్తమవుతుంది.
- source_word: יְבָרֶכְךָ
  choice: నిన్ను ఆశీర్వదిస్తాడు
  rationale: పియేల్ అసంపూర్ణ క్రియారూపం మరియు రెండవ పురుష ఏకవచన కర్మ ప్రత్యయాన్ని నేరుగా, ప్రామాణికంగా వ్యక్తం చేస్తుంది.
- source_word: לִפְנֵי מוֹתוֹ
  choice: తాను చనిపోకముందే
  rationale: అక్షరార్థంగా ‘అతని మరణానికి ముందు’; తెలుగులో కర్తను స్పష్టంగా ఉంచుతూ సహజమైన క్రియారూపంలో అనువదించబడింది. ‘ఏ’ సమీపిస్తున్న మరణానికి ముందే జరగాలనే సందర్భోచిత తక్షణతను తెలియజేస్తుంది.
