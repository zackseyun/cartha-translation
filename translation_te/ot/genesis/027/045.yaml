source:
  edition: WLC
  text: עַד שׁ֨וּב אַף אָחִ֜י/ךָ מִמְּ/ךָ֗ וְ/שָׁכַח֙ אֵ֣ת אֲשֶׁר עָשִׂ֣יתָ לּ֔/וֹ וְ/שָׁלַחְתִּ֖י וּ/לְקַחְתִּ֣י/ךָ מִ/שָּׁ֑ם לָ/מָ֥ה אֶשְׁכַּ֛ל גַּם שְׁנֵי/כֶ֖ם י֥וֹם אֶחָֽד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/045.yaml
  text: until your brother’s anger turns away from you[a], and he forgets what you have done to him. Then I will send and bring you from there[c][b]. Why should I be bereaved of both of you in one day?
translation:
  language: te
  text: నీ అన్న కోపం నీ మీద నుంచి తగ్గిపోయి,[a] నువ్వు అతనికి చేసినదాన్ని అతడు మరిచిపోయే వరకు అక్కడే ఉండు. అప్పుడు నేను పంపించి నిన్ను అక్కడి నుంచి రప్పిస్తాను.[b] ఒకే రోజున మీ ఇద్దరినీ నేను ఎందుకు కోల్పోవాలి?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత అక్షరార్థంగా: “నీ అన్న కోపం నీ మీద నుంచి తిరిగిపోయే వరకు.” హీబ్రూలో ‘తిరుగు’ అనే క్రియ కోపంతో కలసి ప్రయోగించబడింది.'
    reason: lexical_alternative
  - marker: b
    text: 'హీబ్రూలో అక్షరార్థం: “నేను పంపి నిన్ను అక్కడి నుంచి తీసుకుంటాను.” సందర్భంలో రిబ్కా యాకోబును అక్కడి నుంచి తన దగ్గరకు రప్పించడాన్ని ఇది సూచిస్తుంది.'
    reason: lexical_alternative
  - marker: c
    text: రిబ్కా ఇద్దరు కుమారులను ఒకే రోజున కోల్పోతానని భయపడుతోంది. అయితే వారిద్దరినీ ఎలా కోల్పోతుందో హీబ్రూ పాఠ్యం నిర్దిష్టంగా చెప్పదు.
    reason: cultural_note
lexical_decisions:
- source_word: עַד שׁוּב אַף אָחִיךָ מִמְּךָ
  choice: నీ అన్న కోపం నీ మీద నుంచి తగ్గిపోయే వరకు
  rationale: שׁוב + אַף అనే హీబ్రూ ప్రయోగం కోపం ఒకరి మీద నుంచి తొలగిపోవడాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘కోపం తగ్గిపోవడం’ సహజంగా ఉండి, מִמְּךָ లోని ‘నీ మీద నుంచి’ అనే సంబంధాన్ని నిలుపుతుంది.
- source_word: וְשָׁכַח אֵת אֲשֶׁר עָשִׂיתָ לוֹ
  choice: నువ్వు అతనికి చేసినదాన్ని అతడు మరిచిపోయే వరకు
  rationale: గతంలో యాకోబు ఏశావుకు చేసిన కార్యాన్ని నేరుగా, సహజమైన తెలుగు వాక్యనిర్మాణంలో వ్యక్తం చేస్తుంది.
- source_word: וְשָׁלַחְתִּי
  choice: అప్పుడు నేను కబురు పంపి
  rationale: వావ్ రూపం తరువాతి చర్యను ముందుకు నడిపిస్తుంది. ఇక్కడ పంపబడేది వ్యక్తి లేదా సందేశమా అని స్పష్టంగా చెప్పబడలేదు; తెలుగు సందర్భంలో ‘కబురు పంపి’ రిబ్కా యాకోబును పిలిపించడాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וּלְקַחְתִּיךָ מִשָּׁם
  choice: నిన్ను అక్కడి నుంచి రప్పిస్తాను
  rationale: לקח ప్రాథమికంగా ‘తీసుకోవడం’; అయితే మాట్లాడుతున్న రిబ్కా దృష్టికోణంలో దూరంలోని యాకోబును తన వద్దకు తీసుకురావడం ఉద్దేశం. ‘రప్పిస్తాను’ ఈ దిశాసంబంధ భావాన్ని తెలుగులో సహజంగా ఇస్తుంది; ‘తిరిగి’ అని మూలంలో లేని పదాన్ని చేర్చదు.
- source_word: לָמָה אֶשְׁכַּל גַּם שְׁנֵיכֶם יוֹם אֶחָד
  choice: ఒకే రోజున మీ ఇద్దరినీ నేను ఎందుకు కోల్పోవాలి?
  rationale: שכל సంతానాన్ని కోల్పోయి దుఃఖించే భావాన్ని కలిగి ఉంది. తెలుగులో ‘మీ ఇద్దరినీ కోల్పోవాలి’ తల్లి పలికే వేదనను స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది; יוֹם אֶחָד ను ‘ఒకే రోజున’గా ఇస్తుంది.
theological_decisions:
- issue: ‘ఒకే రోజున మీ ఇద్దరినీ కోల్పోవడం’ యొక్క విధానం
  choice: ఇద్దరినీ కోల్పోవడం అని మాత్రమే అనువదించి, అది ఎలా జరుగుతుందో ప్రధాన పాఠ్యంలో నిర్దిష్టం చేయలేదు.
  alternative: ఏశావు యాకోబును చంపి, దాని ఫలితంగా ఏశావు కూడా మరణిస్తాడని స్పష్టీకరించడం.
  rationale: హీబ్రూ పాఠ్యం రిబ్కా ఇద్దరు కుమారులను కోల్పోతాననే భయాన్ని మాత్రమే చెబుతుంది; ఇద్దరినీ ఒకే విధంగా లేదా ఏ నిర్దిష్ట పరిణామం వల్ల కోల్పోతుందో చెప్పదు. అందువల్ల మూలంలోని ఉద్వేగం, అనిశ్చితి నిలుపబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, కుటుంబ సంభాషణకు తగిన సహజమైనప్పటికీ గౌరవప్రదమైన శైలి వాడబడింది. ‘నీ అన్న,’ ‘నువ్వు’ రూపాలు సందర్భంలోని తల్లి-కొడుకు సంభాషణకు సరిపోతాయి. ప్రతి పాదటిప్పణి సూచిక ప్రధాన పాఠ్యంలో ఉంచబడింది.
