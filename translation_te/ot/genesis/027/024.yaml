  yaml_path: translation/ot/genesis/027/024.yaml
  text: He said[a], “Are you really my son Esau?” And he said, “I am.”
translation:
  language: te
  text: అతడు, “నువ్వే నిజంగా నా కుమారుడైన ఏశావువా?” అని అడిగాడు.[a] అతడు, “నేనే” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “నువ్వు ఈ వాడివా, నా కుమారుడైన ఏశావువా?” ఈ అసాధారణ పదబంధం వ్యక్తి గుర్తింపును ఉద్ఘాటిస్తూ అడిగే ప్రశ్న.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అతడు … అని అడిగాడు
  rationale: אמר సాధారణంగా ‘అన్నాడు’ అని అర్థమైనా, ఇక్కడ ప్రశ్నను పరిచయం చేస్తున్నందున సహజమైన ఆధునిక తెలుగులో ‘అడిగాడు’ అని సందర్భానుసారంగా అనువదించాం.
- source_word: אַתָּה זֶה
  choice: నువ్వే నిజంగా
  rationale: స్వతంత్ర సర్వనామం, సూచక పదం కలిసి వ్యక్తి గుర్తింపును నొక్కి అడుగుతున్నాయి; ‘నువ్వే నిజంగా’ ఆ ఉద్ఘాటనను సహజంగా తెలియజేస్తుంది.
- source_word: בְּנִי
  choice: నా కుమారుడైన
  rationale: మొదటి పురుష ఏకవచన స్వామ్య ప్రత్యయాన్ని స్పష్టంగా నిలుపుతూ, ఏశావును ‘నా కుమారుడు’గా గుర్తించే నిర్మాణాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: עֵשָׂו
  choice: ఏశావు
  rationale: హీబ్రూ వ్యక్తినామానికి ప్రాచుర్యంలో ఉన్న తెలుగు లిప్యంతరీకరణ.
- source_word: וַיֹּאמֶר
  choice: అతడు … అన్నాడు
  rationale: రెండవ אמרను సాధారణ సంభాషణ క్రియగా సరళంగా అనువదించాం.
- source_word: אָנִי
  choice: నేనే
  rationale: ఈ సంక్షిప్త స్వీయ-గుర్తింపు జవాబులో స్వతంత్ర సర్వనామం కలిగిన ఉద్ఘాటనను ‘నేనే’ సహజంగా ప్రతిబింబిస్తుంది.
