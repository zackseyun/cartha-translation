translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. సంభాషణలో సందర్భోచితమైన ‘నువ్వు’ రూపాన్ని వాడి, ప్రశ్నలోని అనుమానం మరియు గుర్తింపు ఉద్ఘాటనను నిలిపాం.
