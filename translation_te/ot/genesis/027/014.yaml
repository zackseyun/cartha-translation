  to: అప్పుడు అతడు వెళ్లి వాటిని తీసుకొని తన తల్లి వద్దకు తెచ్చాడు. అతని తల్లి అతని తండ్రికి ఇష్టమైన రుచికరమైన వంటకాలు[a] తయారుచేసింది.
