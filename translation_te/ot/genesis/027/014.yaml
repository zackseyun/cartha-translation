  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֵּ֨לֶךְ֙ וַ/יִּקַּ֔ח וַ/יָּבֵ֖א לְ/אִמּ֑/וֹ וַ/תַּ֤עַשׂ אִמּ/וֹ֙ מַטְעַמִּ֔ים כַּ/אֲשֶׁ֖ר אָהֵ֥ב אָבִֽי/ו׃
base_translation:
