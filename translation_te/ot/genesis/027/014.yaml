translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. మూలంలోని వరుస క్రియలను సహజ తెలుగు వాక్యప్రవాహంలో నిలిపి, మַטְעַמִּים బహువచనాన్ని ‘వంటకాలు’గా ప్రతిబింబించాం. పాదసూచిక గుర్తును అది వివరిస్తున్న పదబంధం వెంట ఉంచాం.
