  yaml_path: translation/ot/genesis/027/014.yaml
  text: So he went and took them and brought them to his mother[a], and his mother prepared tasty food, just as his father loved.
translation:
  language: te
  text: అప్పుడు అతడు వెళ్లి వాటిని తీసుకొని తన తల్లి వద్దకు తెచ్చాడు. అతని తల్లి అతని తండ్రికి ఇష్టమైన రుచికరమైన వంటకాలు[a] తయారుచేసింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘రుచికరమైన ఆహార పదార్థాలు’; హీబ్రూ పదం బహువచనంలో ఉండి, ప్రత్యేకంగా తయారుచేసిన రుచిగల వంటకాలను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: అప్పుడు అతడు వెళ్లి
  rationale: వావ్-క్రమరూపం కథనాన్ని ముందుకు నడిపిస్తుంది; ఆధునిక తెలుగు కథన ప్రవాహంలో ‘అప్పుడు’ సహజంగా కాలక్రమాన్ని తెలియజేస్తుంది.
- source_word: וַיִּקַּח
  choice: వాటిని పట్టుకొని
  rationale: క్రియకు మూలార్థం ‘తీసుకొను/పట్టుకొను’; ముందటి వచనంలోని మేకపిల్లలే కర్మ అని సందర్భం స్పష్టం చేస్తుంది. జీవులను సూచిస్తున్నందున ‘పట్టుకొని’ సహజమైన తెలుగు ప్రయోగం.
- source_word: וַיָּבֵא לְאִמּוֹ
  choice: తన తల్లి దగ్గరికి తీసుకొచ్చాడు
  rationale: בוא హిఫీల్ రూపం ‘తీసుకురావడం’ను, לְ గమ్యాన్ని సూచిస్తుంది. తెలుగులో కర్మను సందర్భానుసారంగా కొనసాగిస్తూ ఈ భావం సహజంగా వ్యక్తమవుతుంది.
- source_word: וַתַּעַשׂ אִמּוֹ
  choice: అతని తల్లి … తయారుచేసింది
  rationale: עשה సాధారణంగా ‘చేయు/తయారుచేయు’; ఆహారం కర్మగా ఉన్నందున ‘తయారుచేసింది’ ఖచ్చితమైన సహజ ప్రయోగం.
- source_word: מַטְעַמִּים
  choice: రుచికరమైన వంటకాలు
  rationale: ఈ బహువచన నామవాచకం ప్రత్యేకంగా తయారుచేసిన రుచికరమైన ఆహార పదార్థాలను సూచిస్తుంది; ‘వంటకాలు’ బహువచనాన్ని నిలుపుతుంది.
- source_word: כַּאֲשֶׁר אָהֵב אָבִיו
  choice: అతని తండ్రికి ఇష్టమైన విధంగా
  rationale: ఈ పదబంధం ఇస్సాకు తెలిసిన ఆహార అభిరుచికి అనుగుణంగా వంటకాలు చేసినట్లు చెబుతుంది. తెలుగులో ‘ఇష్టమైన విధంగా’ తులనాత్మక భావాన్ని సహజంగా అందిస్తుంది.
