  yaml_path: translation/ot/genesis/027/023.yaml
  text: And he did not recognize him[a], because his hands were hairy like the hands of his brother Esau; so he blessed him.
translation:
  language: te
  text: అతడు అతనిని గుర్తుపట్టలేదు; ఎందుకంటే అతని చేతులు అతని అన్న ఏశావు చేతులవలె వెంట్రుకలతో ఉన్నాయి. కాబట్టి అతడు అతనిని ఆశీర్వదించాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అతడు అతనిని ఆశీర్వదించాడు.’ హీబ్రూ కథన రూపం కేవలం సంఘటనల క్రమాన్ని సూచించవచ్చు; ఇక్కడ అది ఫలిత భావాన్ని కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִכִּירוֹ
  choice: అతణ్ణి గుర్తుపట్టలేదు
  rationale: హిఫిల్ రూపంలోని נכר ఇక్కడ స్పర్శ ద్వారా వ్యక్తిని గుర్తించడం అనే భావాన్ని ఇస్తుంది; ఆధునిక తెలుగులో ‘గుర్తుపట్టలేదు’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ఇది ఇస్సాకు యాకోబును గుర్తుపట్టకపోవడానికి కారణాన్ని పరిచయం చేస్తుంది.
- source_word: יָדָיו
  choice: అతని చేతులు
  rationale: మూడవ పురుష ఏకవచన ప్రత్యయంతో ఉన్న బహువచన నామానికి నేరమైన అనువాదం; సందర్భంలో యాకోబు చేతులను సూచిస్తుంది.
- source_word: כִּידֵי
  choice: చేతుల్లా
  rationale: ఉపసర్గ כ పోలికను సూచిస్తుంది; ‘చేతుల్లా’ తెలుగులో సహజంగా ఆ ఉపమానాన్ని నిలుపుతుంది.
- source_word: אָחִיו
  choice: అతని అన్న
  rationale: עֵשָׂו యాకోబుకు పెద్ద సోదరుడు కాబట్టి, సందర్భానుగుణమైన తెలుగు బంధుత్వ పదం ‘అన్న’ ఉపయోగించబడింది.
- source_word: שְׂעִרֹת
  choice: వెంట్రుకలతో నిండి ఉన్నాయి
  rationale: చేతుల స్పర్శసంబంధ లక్షణాన్ని తెలిపే స్త్రీలింగ బహువచన విశేషణం; తెలుగులో చేతులను ‘వెంట్రుకలతో నిండి ఉన్నాయి’ అని చెప్పడం స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: וַיְבָרְכֵהוּ
  choice: అందుచేత అతడు అతణ్ణి ఆశీర్వదించాడు
  rationale: వావ్-కన్సెక్యూటివ్ కథన క్రమాన్ని ముందుకు తీసుకెళ్తుంది; సందర్భంలో ఫలిత భావం కూడా ఉండటంతో ‘అందుచేత’ ఎంచుకోబడింది, కాగా సాధారణ క్రమార్థం పాదసూచికలో నిలుపబడింది.
