  text: וַ/יֹּ֕אמֶר הִנֵּה נָ֖א זָקַ֑נְתִּי לֹ֥א יָדַ֖עְתִּי י֥וֹם מוֹתִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/002.yaml
  text: And he said, “Look now, I have grown old; I do not know the day of my death.”
translation:
  language: te
  text: 'అతడు ఇలా అన్నాడు: “చూడు, నేను ఇప్పుడు ముసలివాడినయ్యాను; నేను ఎప్పుడు చనిపోతానో నాకు తెలియదు.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה נָא
  choice: చూడు
  rationale: హిన్నే దృష్టిని ఆకర్షించే మాట; నా ఇక్కడ విజ్ఞాపనాత్మక మృదుత్వాన్ని ఇస్తుంది. ఆధునిక తెలుగులో సందర్భానికి సహజంగా ‘చూడు’ అని ఇచ్చాం.
- source_word: זָקַנְתִּי
  choice: నేను ఇప్పుడు ముసలివాడినయ్యాను
  rationale: మూలంలోని సంపూర్ణ క్రియ వృద్ధాప్య స్థితికి చేరిన భావాన్ని తెలియజేస్తుంది; ‘ఇప్పుడు’ అనేది נָא యొక్క సందర్భసూచక నుడికారాన్ని సహజంగా ప్రతిబింబిస్తుంది.
- source_word: לֹא יָדַעְתִּי יוֹם מוֹתִי
  choice: నేను ఎప్పుడు చనిపోతానో నాకు తెలియదు
  rationale: అక్షరార్థంగా ‘నా మరణ దినం నాకు తెలియదు’; ఆధునిక తెలుగులో అదే భావాన్ని సహజంగా, స్పష్టంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: మరణ సమయంపై ఇస్సాకు మాట
  choice: నాకు తెలియదు
  alternative: నేను నా మరణ దినాన్ని ఎరుగను
  rationale: ఇది ప్రవచనం లేదా ప్రత్యేక సిద్ధాంత ప్రకటనగా కాక, తన మరణ సమయం తెలియదనే మూలంలోని సరళమైన అనిశ్చితిని అలాగే ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. సంభాషణలో సాధారణ పాఠకులకు అర్థమయ్యే ‘చూడు’ వాడబడింది; మూలంలోని భావాన్ని కాపాడుతూ అసహజమైన పదక్షర నిర్మాణాన్ని నివారించాం.
