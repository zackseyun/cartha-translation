  text: וַ/יֹּ֨אמֶר יַעֲקֹ֜ב אֶל אָבִ֗י/ו אָנֹכִי֙ עֵשָׂ֣ו בְּכֹרֶ֔/ךָ עָשִׂ֕יתִי כַּ/אֲשֶׁ֥ר דִּבַּ֖רְתָּ אֵלָ֑/י קֽוּם נָ֣א שְׁבָ֗/ה וְ/אָכְלָ/ה֙ מִ/צֵּידִ֔/י בַּ/עֲב֖וּר תְּבָרֲכַ֥/נִּי נַפְשֶֽׁ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/019.yaml
  text: And Jacob said to his father[a], “I am Esau your firstborn. I have done as you told me. Please rise, sit, and eat from my game[b], so that your soul may bless me.”
translation:
  language: te
  text: యాకోబు తన తండ్రితో, “నేనే మీ పెద్ద కుమారుడైన ఏశావును. మీరు నాతో చెప్పినట్టే చేశాను. దయచేసి లేచి కూర్చొని, నా వేటమాంసం తినండి; మీరే[a] నన్ను ఆశీర్వదించేలా” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “మీ ప్రాణం నన్ను ఆశీర్వదించునట్లు.” ఇక్కడ “ప్రాణం” అనే హీబ్రూ పదం వ్యక్తిని లేదా స్వయాన్ని సూచించే ప్రయోగం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר יַעֲקֹב אֶל־אָבִיו
  choice: యాకోబు తన తండ్రితో ... అన్నాడు
  rationale: హీబ్రూ కథన క్రమాన్ని సహజమైన తెలుగు ప్రత్యక్ష వాక్య నిర్మాణంలో వ్యక్తపరుస్తుంది.
- source_word: אָנֹכִי עֵשָׂו בְּכֹרֶךָ
  choice: నేనే మీ పెద్ద కుమారుడైన ఏశావును
  rationale: אָנֹכִי లోని వ్యక్తి ఉద్ఘాటనను ‘నేనే’ తెలియజేస్తుంది; בְּכֹרֶךָను సాధారణ పాఠకులకు స్పష్టంగా ‘మీ పెద్ద కుమారుడు’ అని అనువదించింది. యాకోబు చేసిన మోసపూరిత స్వపరిచయాన్ని యథాతథంగా ఉంచుతుంది.
- source_word: עָשִׂיתִי כַּאֲשֶׁר דִּבַּרְתָּ אֵלָי
  choice: మీరు నాతో చెప్పినట్టే చేశాను
  rationale: మూలంలోని భావాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది; ‘మాట్లాడినట్టే’ అనే కృత్రిమ పదబంధాన్ని నివారిస్తుంది.
- source_word: קוּם נָא שְׁבָה
  choice: దయచేసి లేచి కూర్చొని
  rationale: నָא లోని వినయపూర్వక అభ్యర్థనను ‘దయచేసి’ తెలియజేస్తుంది; వరుస ఆజ్ఞలను తెలుగులో సహజంగా కలుపుతుంది.
- source_word: וְאָכְלָה מִצֵּידִי
  choice: నేను వేటాడి తెచ్చిన మాంసం తినండి
  rationale: צַיִד ఇక్కడ వేటలో సంపాదించిన ఆహారం/మాంసాన్ని సూచిస్తుంది. యాకోబు దాన్ని తానే వేటాడి తెచ్చినదిగా చూపిస్తున్న సందర్భాన్ని ఈ పదబంధం స్పష్టం చేస్తుంది.
- source_word: בַּעֲבוּר תְּבָרֲכַנִּי נַפְשֶׁךָ
  choice: అప్పుడు మీరే నన్ను ఆశీర్వదించవచ్చు
  rationale: בַּעֲבוּר లోని ఉద్దేశాన్ని సందర్భానుసారమైన ఫలిత-ఉద్దేశ సంబంధంగా తెలియజేస్తుంది. נֶפֶשׁ‌ను వేరైన ఆత్మసంబంధ సిద్ధాంత ప్రకటనగా కాక, వ్యక్తినే ఉద్ఘాటించే హీబ్రూ ప్రయోగంగా ‘మీరే’ అని అందిస్తుంది.
theological_decisions:
- issue: תְּבָרֲכַנִּי נַפְשֶׁךָలో נֶפֶשׁ అనువాదం
  choice: మీరే నన్ను ఆశీర్వదించవచ్చు
  alternative: మీ ప్రాణం నన్ను ఆశీర్వదించవచ్చు
  rationale: ఈ సందర్భంలో נֶפֶשׁ వ్యక్తిని/స్వయాన్ని సూచించే హీబ్రూ ప్రయోగం. అక్షరార్థంగా ‘ప్రాణం’ అని ప్రధాన పాఠంలో ఉంచితే పాఠ్యంలో లేని మానవ స్వభావ సంబంధ సిద్ధాంత భావం కలగవచ్చు. ‘మీరే’ వ్యక్తి ఉద్ఘాటనను కాపాడుతుంది; అక్షర రూపం పాదసూచికలో నమోదు చేయబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవసూచక బహువచనాన్ని ఉపయోగించింది, ఎందుకంటే యాకోబు తన తండ్రితో మాట్లాడుతున్నాడు. భాష సహజంగా, గంభీరంగా ఉండేలా చూసి, మోసపూరిత వాదనను మృదువుచేయలేదు. పాదసూచిక గుర్తు [a] ప్రధాన పాఠంలో సంబంధిత పదం వెంట ఉంచబడింది.
