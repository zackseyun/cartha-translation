  to: యాకోబు తన తండ్రితో, “నేనే మీ పెద్ద కుమారుడైన ఏశావును. మీరు నాతో చెప్పినట్టే చేశాను. దయచేసి లేచి కూర్చొని, నా వేటమాంసం తినండి; మీరే[a] నన్ను ఆశీర్వదించేలా” అన్నాడు.
