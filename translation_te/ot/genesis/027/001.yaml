    rationale: కాలవాచక ఉపవాక్యం మాత్రమే ఉన్నప్పుడు ‘ఇస్సాకు ముసలివాడై…అప్పుడు’ అనే వాక్యం ప్రధాన సంఘటనకు ముందు అసంపూర్ణంగా అనిపిస్తుంది. ‘ఇలా జరిగింది:’ లేదా సమానమైన కథనారంభం మూల నిర్మాణాన్ని, తెలుగు వాక్యనిర్మాణాన్ని రెండింటినీ మెరుగుపరుస్తుంది.
