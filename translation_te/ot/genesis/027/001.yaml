id: GEN.27.1
reference: Genesis 27:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְהִי֙ כִּֽי זָקֵ֣ן יִצְחָ֔ק וַ/תִּכְהֶ֥יןָ עֵינָ֖י/ו מֵ/רְאֹ֑ת וַ/יִּקְרָ֞א אֶת עֵשָׂ֣ו בְּנ֣/וֹ הַ/גָּדֹ֗ל וַ/יֹּ֤אמֶר אֵלָי/ו֙ בְּנִ֔/י וַ/יֹּ֥אמֶר אֵלָ֖י/ו הִנֵּֽנִ/י־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/001.yaml
  text: It happened that when Isaac was old and his eyes were too dim to see[a], he called Esau his older son and said to him, “My son,” and he said to him, “Here I am.”
translation:
  language: te
  text: 'ఇలా జరిగింది: ఇస్సాకు ముసలివాడై, అతని కళ్ల చూపు మందగించినప్పుడు, అతడు తన పెద్ద కుమారుడైన[a] ఏశావును పిలిచి, “నా కుమారుడా,” అన్నాడు. అతడు అతనితో, “ఇదిగో, నేను ఉన్నాను,” అన్నాడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తన జ్యేష్ఠ కుమారుడైన.”
    reason: הַגָּדֹל అనే పదం ఈ సందర్భంలో ‘పెద్ద’ లేదా ‘జ్యేష్ఠ’ కుమారుడిని సూచించవచ్చు.
lexical_decisions:
- source_word: וַיְהִי כִּי
  choice: …అప్పుడు
  rationale: కొత్త కథాఘట్టాన్ని ప్రారంభిస్తూ కాలసంబంధ పరిస్థితిని తెలిపే హీబ్రూ నిర్మాణం. తెలుగులో ప్రత్యేకంగా ‘ఇలా జరిగింది’ అని జోడించకుండా కాలవాచక ఉపవాక్యంతో ప్రారంభించడం సహజంగా ఉండి మూల భావాన్ని నిలుపుతుంది.
- source_word: זָקֵן
  choice: ముసలివాడై
  rationale: ఇస్సాకు వృద్ధాప్య స్థితికి చేరినట్టు తెలిపే సాధారణ, స్పష్టమైన తెలుగు పదప్రయోగం.
- source_word: וַתִּכְהֶיןָ עֵינָיו מֵרְאֹת
  choice: చూడలేనంతగా అతని కళ్ల చూపు మందగించింది
  rationale: కళ్ల చూపు క్షీణించి చూడలేని స్థితిని సూచించే మూలపాఠ భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: וַיִּקְרָא
  choice: పిలిచి
  rationale: ఈ సందర్భంలో దగ్గరకు పిలవడం లేదా సంబోధించడం అనే సాధారణ అర్థాన్ని ఇస్తుంది; ‘రప్పించాడు’ అనడం మూలంలో లేని అధికారిక భావాన్ని పెంచవచ్చు.
- source_word: אֶת־עֵשָׂו בְּנוֹ הַגָּדֹל
  choice: తన పెద్ద కుమారుడైన ఏశావును
  rationale: הַגָּדֹל ఇక్కడ యాకోబుతో పోలిస్తే వయసులో పెద్దవాడైన కుమారుణ్ణి సూచిస్తుంది. ‘పెద్ద కుమారుడు’ సాధారణ తెలుగు; ‘జ్యేష్ఠ కుమారుడు’ కూడా సాధ్యమైన ప్రత్యామ్నాయం.
- source_word: בְּנִי
  choice: నా కుమారుడా!
  rationale: స్వామ్య ప్రత్యయాన్నీ తండ్రి ప్రేమతో చేసే ప్రత్యక్ష సంబోధననూ నిలుపుతుంది.
- source_word: הִנֵּנִי
  choice: ఇదిగో, నేనున్నాను
  rationale: తాను అక్కడ ఉన్నాననీ స్పందించడానికి సిద్ధంగా ఉన్నాననీ తెలిపే హీబ్రూ ప్రతిస్పందన సూత్రానికి సన్నిహితమైన, గౌరవప్రదమైన తెలుగు రూపం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన కథనశైలిని ఉపయోగించాం. పునరుక్త సర్వనామాల వల్ల కలిగే అయోమయాన్ని తగ్గించడానికి చివరి వాక్యంలో ‘అతడు’ బదులు ‘ఏశావు’ అని స్పష్టంగా పేర్కొన్నాం. భాష గౌరవప్రదంగానూ సాధారణ పాఠకులకు సులభంగానూ ఉంచబడింది.
