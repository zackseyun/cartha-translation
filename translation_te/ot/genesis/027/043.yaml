translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; తల్లి కుమారునితో మాట్లాడే సన్నిహితత్వం, ఆదేశంలోని అత్యవసరత నిలుపబడ్డాయి. ‘సహోదరుడు’ గౌరవప్రదమైన గ్రంథశైలిని ఇస్తూనే సాధారణ పాఠకునికి అర్థమయ్యే పదం.
