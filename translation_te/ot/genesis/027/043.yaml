source:
  edition: WLC
  text: וְ/עַתָּ֥ה בְנִ֖/י שְׁמַ֣ע בְּ/קֹלִ֑/י וְ/ק֧וּם בְּרַח לְ/ךָ֛ אֶל לָבָ֥ן אָחִ֖/י חָרָֽנָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/043.yaml
  text: Now[a], my son, listen to my voice, and arise, flee to my brother Laban in Haran.
translation:
  language: te
  text: ఇప్పుడు[a] నా కుమారుడా, నా మాట విను; లేచి, హారానులో ఉన్న నా సహోదరుడు లాబాను దగ్గరికి పారిపో.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మరి ఇప్పుడు నా కుమారుడా, నా మాట విను; లేచి, హారానులో ఉన్న నా సహోదరుడు లాబాను దగ్గరికి పారిపో.”
    reason: וְעַתָּה లోని సంధాయక וְ ను ‘మరి’ అని ప్రత్యేకంగా అనువదించే ప్రత్యామ్నాయం.
lexical_decisions:
- source_word: וְעַתָּה
  choice: ఇప్పుడు
  rationale: తక్షణంగా ఇవ్వబోయే ఆదేశాన్ని పరిచయం చేసే సంభాషణ సూచకం. ముందున్న וְ ను తెలుగులో ప్రత్యేకంగా ‘మరి’ అని చూపకపోయినా భావం సహజంగా వ్యక్తమవుతుంది.
- source_word: בְנִי
  choice: నా కుమారుడా
  rationale: రిబ్కా యాకోబును నేరుగా సంబోధిస్తోంది; కుటుంబ సంబంధాన్నీ పుంలింగ సూచననూ నిలుపుతుంది.
- source_word: שְׁמַע בְּקֹלִי
  choice: నా మాట విను
  rationale: అక్షరార్థంగా ‘నా స్వరం విను’; హెబ్రీయ భాషాప్రయోగంలో విధేయత భావం ఉన్నప్పటికీ, ఆధునిక తెలుగులో సహజమైన ‘నా మాట విను’ మూలంలోని వినడం-పాటించడం భావాన్ని రెండింటినీ మోస్తుంది.
- source_word: וְקוּם
  choice: లేచి
  rationale: קום ఆజ్ఞారూపాన్ని తదుపరి ఆజ్ఞతో సహజమైన తెలుగు క్రమంలో కలుపుతుంది.
- source_word: בְּרַח לְךָ
  choice: పారిపో
  rationale: ברח యొక్క అత్యవసరంగా తప్పించుకొని వెళ్లే భావాన్ని ఇస్తుంది. לְךָ ను విడిగా అనువదించడం తెలుగులో కృత్రిమంగా ఉంటుంది.
- source_word: אֶל לָבָן אָחִי
  choice: నా సహోదరుడు లాబాను దగ్గరికి
  rationale: లాబాను రిబ్కా సహోదరుడని స్పష్టంగా ఉంచి, వ్యక్తి వద్దకు వెళ్లే గమ్యాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: חָרָנָה
  choice: హారానులో ఉన్న
  rationale: స్థలనామానికి ఉన్న దిశాసూచక ה హారాను వైపు కదలికను సూచిస్తుంది; ఆ కదలిక ఇప్పటికే ‘దగ్గరికి పారిపో’లో వ్యక్తమైనందున, తెలుగులో లాబాను ఉన్న ప్రదేశంగా చెప్పడం పునరుక్తిని నివారిస్తుంది.
