id: GEN.27.28
reference: Genesis 27:28
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/יִֽתֶּן לְ/ךָ֙ הָ/אֱלֹהִ֔ים מִ/טַּל֙ הַ/שָּׁמַ֔יִם וּ/מִ/שְׁמַנֵּ֖י הָ/אָ֑רֶץ וְ/רֹ֥ב דָּגָ֖ן וְ/תִירֹֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/028.yaml
  text: May God give you some of the dew of heaven[a], and some of the richness of the earth, and an abundance of grain and new wine.
translation:
  language: te
  text: దేవుడు నీకు ఆకాశపు మంచును[a], భూమి సారసంపదను, ధాన్యాన్నీ కొత్త ద్రాక్షారసాన్నీ సమృద్ధిగా అనుగ్రహించుగాక.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూలభాషను మరింత అక్షరార్థంగా అనువదిస్తే, “ఆకాశపు మంచులోనుండి, భూమి పుష్టిలోనుండి” లేదా “ఆకాశపు మంచులో కొంత, భూమి సారసంపదలో కొంత.” ఇక్కడి రూపకం భూమి సారవంతతను, పంటల సమృద్ధిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִתֶּן
  choice: అనుగ్రహించుగాక
  rationale: ఆశీర్వాద సందర్భంలోని యుస్సివ్ భావాన్ని సహజమైన, గౌరవప్రదమైన తెలుగు ఆశీర్వచన రూపంలో వ్యక్తం చేస్తుంది.
- source_word: הָאֱלֹהִים
  choice: దేవుడు
  rationale: ఇక్కడి నిర్దిష్ట దైవనామ బిరుదుకు ఆధునిక ప్రామాణిక తెలుగులో సహజమైన సమానం.
- source_word: מִטַּל הַשָּׁמַיִם
  choice: ఆకాశపు మంచును
  rationale: వ్యవసాయ సఫలతను సూచించే మూలభాషా చిత్రాన్ని నిలుపుతుంది. מִן ఇక్కడ భాగార్థం లేదా ప్రసాద మూలాన్ని సూచించవచ్చు; తెలుగులో కృత్రిమంగా ‘కొంత’ అని చేర్చకుండా నేరుగా కర్మరూపం వాడబడింది.
- source_word: וּמִשְׁמַנֵּי הָאָרֶץ
  choice: భూమి సారసంపదను
  rationale: ‘కొవ్వు/పుష్టి’ అనే మూలరూపకంలోని సారవంతత, సమృద్ధి భావాలను సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: וְרֹב
  choice: సమృద్ధిగా
  rationale: తరువాతి రెండు వ్యవసాయ ఉత్పత్తుల విస్తార పరిమాణాన్ని సహజంగా సూచిస్తుంది.
- source_word: דָּגָן
  choice: ధాన్యం
  rationale: వివిధ ధాన్య పంటలను సూచించే సాధారణ మూలపదానికి స్పష్టమైన తెలుగు సమానం.
- source_word: וְתִירֹשׁ
  choice: కొత్త ద్రాక్షారసం
  rationale: సాధారణ ద్రాక్షారసం కంటే తాజా లేదా కొత్త ద్రాక్షారసాన్ని సూచించే మూలపద భేదాన్ని నిలుపుతుంది.
theological_decisions:
- issue: వాక్య స్వభావం
  choice: ‘దేవుడు ... అనుగ్రహించుగాక’ అనే ఆశీర్వచనాత్మక ఆకాంక్ష
  alternative: ‘దేవుడు ... అనుగ్రహిస్తాడు’ అనే సాధారణ భవిష్యద్వాక్యం
  rationale: క్రియారూపమూ ఇస్సాకు పలుకుతున్న ఆశీర్వాద సందర్భమూ దీనిని కేవలం ముందస్తు ప్రకటనగా కాక, పలికిన ఆశీర్వచనంగా గ్రహించడానికి మద్దతిస్తాయి.
- issue: מִן అనే విభక్తి భావం
  choice: ప్రధాన వాక్యంలో సహజమైన తెలుగు కర్మరూపం; పాదసూచికలో భాగార్థం/మూలార్థం వెల్లడించడం
  alternative: ‘ఆకాశపు మంచులో కొంత, భూమి సారసంపదలో కొంత’ అని స్పష్టంగా భాగార్థం చేర్చడం
  rationale: మూలంలోని מִן భాగాన్ని లేదా మూలాన్ని సూచించగలదు. ‘కొంత’ అని ప్రధాన వాక్యంలో పెట్టడం అవసరానికి మించిన పరిమితి భావాన్ని కలిగించవచ్చు; సందిగ్ధతను పాదసూచికలో కాపాడడం మెరుగైనది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ ఆశీర్వచనానికి తగిన గౌరవప్రద శైలి వాడబడింది. ‘సారసంపద’ మూలంలోని ‘పుష్టి/కొవ్వు’ వ్యవసాయ రూపకాన్ని అసహజమైన అక్షరానువాదం లేకుండా నిలుపుతుంది. పాదసూచిక గుర్తు [a] ప్రధాన పాఠ్యంలో ఉంచబడింది.
