  source_fidelity: The translation accurately represents Isaac's surprised question and the reply. ‘నా కుమారుడా’ preserves בְּנִי, ‘నీ దేవుడైన యాహ్వే’ faithfully retains both the divine name and the significant second-person possessive in אֱלֹהֶיךָ, and ‘అది నాకు ఎదురయ్యేలా చేశాడు’ naturally conveys the causative הִקְרָה together with the contextual force of לְפָנַי without overstating it as success or physical bringing.
