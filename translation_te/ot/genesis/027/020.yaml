id: GEN.27.20
reference: Genesis 27:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יִצְחָק֙ אֶל בְּנ֔/וֹ מַה זֶּ֛ה מִהַ֥רְתָּ לִ/מְצֹ֖א בְּנִ֑/י וַ/יֹּ֕אמֶר כִּ֥י הִקְרָ֛ה יְהוָ֥ה אֱלֹהֶ֖י/ךָ לְ/פָנָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/020.yaml
  text: Then Isaac said to his son[a], “How is it that you found it so quickly, my son?” And he said[b], “Because Yahweh your God caused it to happen before me.”
translation:
  language: te
  text: అప్పుడు ఇస్సాకు తన కుమారునితో, “నా కుమారుడా, అది నీకు ఇంత త్వరగా ఎలా దొరికింది?” అని అడిగాడు. అతడు, “నీ దేవుడైన యాహ్వే అది నాకు ఎదురయ్యేలా చేశాడు[a]” అని జవాబిచ్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అది నాకు దొరికేలా చేశాడు”; అక్షరార్థానికి దగ్గరగా, “అది నా ముందు సంభవించేలా చేశాడు.”
    reason: హִקְרָה ... לְפָנַי అనే హీబ్రూ పదబంధం దేవుడు అది అతనికి ఎదురుపడేలా లేదా దొరికేలా చేశాడనే భావాన్ని ఇస్తుంది.
lexical_decisions:
- source_word: מַה זֶּה
  choice: ఎలా
  rationale: ఈ హీబ్రూ ప్రయోగం ఆశ్చర్యంతో కూడిన ప్రశ్నను పరిచయం చేస్తుంది. ఆధునిక తెలుగులో ‘ఎలా’ ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: מִהַרְתָּ לִמְצֹא
  choice: అది నీకు ఇంత త్వరగా దొరికింది
  rationale: మూలంలోని ‘కనుగొనడానికి తొందరపడ్డావు’ అనే నిర్మాణాన్ని తెలుగులో సహజమైన ఫలితార్థక ప్రశ్నగా వ్యక్తపరుస్తూ, వేగంపై ఇస్సాకు ఆశ్చర్యాన్ని నిలుపుతుంది.
- source_word: בְּנִי
  choice: నా కుమారుడా
  rationale: ప్రథమ పురుష ఏకవచన స్వామ్యప్రత్యయాన్ని, ఆప్యాయమైన ప్రత్యక్ష సంబోధనను స్పష్టంగా నిలుపుతుంది.
- source_word: כִּי
  choice: '[ప్రత్యక్ష సమాధానంగా]'
  rationale: తెలుగులో ప్రశ్నకు నేరుగా కారణాన్ని చెప్పేటప్పుడు ప్రత్యేకంగా ‘ఎందుకంటే’ అనడం అవసరం లేదు; తరువాతి వాక్యమే కారణార్థాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: הִקְרָה
  choice: ఎదురయ్యేలా చేశాడు
  rationale: హిఫిల్ రూపంలోని కారణార్థాన్ని నిలుపుతూ, ‘విజయం ఇచ్చాడు’ అని అర్థాన్ని విస్తరించకుండా సందర్భానికి సరిపోయే సహజమైన తెలుగు ప్రయోగాన్ని ఇస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా వ్యక్తినామంగా లిప్యంతరీకరిస్తుంది.
- source_word: אֱלֹהֶיךָ
  choice: నీ దేవుడు
  rationale: ద్వితీయ పురుష ఏకవచన ప్రత్యయాన్ని కచ్చితంగా నిలుపుతుంది; యాకోబు ‘నా దేవుడు’ అని కాక ‘నీ దేవుడు’ అని చెప్పడంలోని కథన ఉద్రిక్తతను పరిష్కరించదు.
- source_word: לְפָנַי
  choice: నాకు
  rationale: ‘నా ముందు’ అనే మూలభావం הִקְרָהతో కలిసి ఒకటి తనకు ఎదురుపడడాన్ని సూచిస్తుంది. ‘నాకు ఎదురయ్యేలా’ అనే సమగ్ర ప్రయోగం తెలుగులో సహజంగా ఉండి ఆ భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో ఉన్న వ్యక్తిగత దైవనామాన్ని బిరుదుగా మార్చకుండా, సాధ్యమైన ఉచ్చారణకు దగ్గరగా తెలుగులో లిప్యంతరీకరించబడింది.
- issue: הִקְרָה లోని దైవిక కారణత్వం
  choice: అది నాకు ఎదురయ్యేలా చేశాడు
  alternative: నాకు విజయం ఇచ్చాడు / దాన్ని నా దగ్గరకు తీసుకొచ్చాడు
  rationale: వేగంగా దొరకడానికి దేవుడే కారణమని యాకోబు చెప్పిన భావాన్ని నిలుపుతుంది; అయితే మూలక్రియ చెప్పేదానికంటే ఎక్కువగా ‘విజయం’ లేదా ప్రత్యక్షంగా ‘తీసుకురావడం’ అనే భావాలను చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథనశైలి వాడబడింది. ‘నా కుమారుడా’ అనే సంబోధనలోని ఆప్యాయతను, ‘నీ దేవుడు’ అనే మాటలోని కథనపరమైన ఉద్రిక్తతను యథాతథంగా ఉంచింది.
