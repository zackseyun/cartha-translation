translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభమైన కథన శైలి. హీబ్రూ participle మరియు రెండవ לֵאמֹר వల్ల ఏర్పడే nested quotation నిర్మాణం నిలుపబడింది.
