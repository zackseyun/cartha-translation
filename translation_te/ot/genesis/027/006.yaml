  yaml_path: translation/ot/genesis/027/006.yaml
  text: And Rebekah said to Jacob her son[a], “Look, I heard your father speaking to Esau your brother, saying,”
translation:
  language: te
  text: 'రిబ్కా తన కుమారుడైన యాకోబుతో ఇలా చెప్పింది: “చూడు, నీ తండ్రి నీ సహోదరుడైన ఏశావుతో ఇలా మాట్లాడటం నేను విన్నాను:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/רִבְקָה
  choice: రిబ్కా
  rationale: వావ్ కథన ప్రవాహాన్ని కొనసాగిస్తుంది; ఆధునిక తెలుగులో వాక్యారంభంలో ప్రత్యేకంగా ‘మరియు’ చేర్చకపోయినా ఆ సంబంధం సహజంగా వ్యక్తమవుతుంది.
- source_word: אָמְרָה אֶל יַעֲקֹב בְּנָהּ
  choice: తన కుమారుడైన యాకోబుతో ఇలా చెప్పింది
  rationale: ‘ఆమె కుమారుడు’ అనే అనుబంధ గుర్తింపును నిలుపుతూ, אֶל‌తో కూడిన మాటల క్రియకు సహజమైన తెలుగు ‘తో చెప్పింది’ వాడబడింది.
- source_word: הִנֵּה
  choice: చూడు
  rationale: తరువాతి విషయంపై శ్రద్ధను ఆకర్షించే సంభాషణాత్మక సూచన; ‘ఇదిగో’ కూడా సాధ్యమే కానీ ఇక్కడ వినబడిన విషయాన్ని పరిచయం చేయడానికి ‘చూడు’ సహజంగా ఉంది.
- source_word: שָׁמַעְתִּי
  choice: నేను విన్నాను
  rationale: పూర్తయిన వినికిడి సంఘటనను సరళ భూతార్థంలో తెలియజేస్తుంది.
- source_word: אֶת אָבִיךָ מְדַבֵּר
  choice: నీ తండ్రి ... మాట్లాడుతూ
  rationale: మְדַבֵּר participle సూచించే కొనసాగుతున్న చర్యను ‘మాట్లాడుతూ’ నిలుపుతుంది.
- source_word: אֶל עֵשָׂו אָחִיךָ
  choice: నీ సహోదరుడైన ఏశావుతో
  rationale: ఏశావును ‘నీ సహోదరుడు’గా పేర్కొనే apposition‌ను స్పష్టంగా నిలుపుతుంది; తెలుగు వాడుకలో వ్యక్తితో మాట్లాడటానికి ‘తో’ సహజం.
- source_word: לֵאמֹר
  choice: ఇలా చెప్పడం
  rationale: తదుపరి వచనంలో వచ్చే అంతర్గత ఉటంకింపును పరిచయం చేసే మూలపదాన్ని స్పష్టంగా ప్రతిబింబిస్తుంది.
