source:
  edition: WLC
  text: וַ/יִּשְׂטֹ֤ם עֵשָׂו֙ אֶֽת יַעֲקֹ֔ב עַל הַ֨/בְּרָכָ֔ה אֲשֶׁ֥ר בֵּרֲכ֖/וֹ אָבִ֑י/ו וַ/יֹּ֨אמֶר עֵשָׂ֜ו בְּ/לִבּ֗/וֹ יִקְרְבוּ֙ יְמֵי֙ אֵ֣בֶל אָבִ֔/י וְ/אַֽהַרְגָ֖ה אֶת יַעֲקֹ֥ב אָחִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/041.yaml
  text: And Esau hated Jacob because of the blessing with which his father had blessed him[a], and Esau said in his heart, “The days of mourning for my father are drawing near[c][b]; then I will kill Jacob my brother.”
translation:
  language: te
  text: తన తండ్రి యాకోబును దీవించిన దీవెన కారణంగా ఏశావు యాకోబుపై పగబట్టాడు[a]. ఏశావు తన హృదయంలో[b], “నా తండ్రి కోసం దుఃఖించే రోజులు దగ్గరపడుతున్నాయి[c]; అప్పుడు నా సోదరుడైన యాకోబును చంపుతాను” అనుకున్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యాకోబును ద్వేషించాడు.” హీబ్రూ క్రియ కేవలం క్షణిక భావాన్ని కాక, కొనసాగుతున్న శత్రుత్వాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “తన హృదయంలో చెప్పుకున్నాడు.”
    reason: lexical_alternative
  - marker: c
    text: లేదా, “నా తండ్రి దుఃఖించే రోజులు దగ్గరపడుతున్నాయి.” హీబ్రూ పదబంధం ఇస్సాకు మరణించిన తరువాత అతని కోసం దుఃఖించడాన్ని గానీ, ఇస్సాకు స్వయంగా దుఃఖించే కాలాన్ని గానీ సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂטֹם
  choice: పగబట్టాడు
  rationale: שׂטם క్షణికమైన కోపం కంటే కొనసాగుతున్న శత్రుత్వాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘పగబట్టాడు’ ఆ దీర్ఘకాలిక విరోధభావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: עַל הַבְּרָכָה
  choice: ఆ దీవెనను బట్టి
  rationale: ఇక్కడ עַל కారణాన్ని సూచిస్తుంది. ‘దీవెనను బట్టి’ అనే రూపం యాకోబుకు లభించిన దీవెనే ఏశావు పగకు కారణమని స్పష్టం చేస్తుంది.
- source_word: אֲשֶׁר בֵּרֲכוֹ אָבִיו
  choice: తన తండ్రి యాకోబును దీవించిన
  rationale: హీబ్రూలోని సర్వనామం సందర్భానుసారం యాకోబును సూచిస్తుంది. తెలుగులో అస్పష్టత రాకుండా పేరును ఉంచి, మూలంలోని దీవించు క్రియను నిలిపాం.
- source_word: בְּלִבּוֹ
  choice: తన హృదయంలో … అనుకున్నాడు
  rationale: అక్షరార్థమైన ‘తన హృదయంలో’ అనే బైబిలీయ నుడికారాన్ని నిలిపి, తెలుగులో అంతరంగ ఆలోచన అని సహజంగా తెలియడానికి ‘అనుకున్నాడు’ వాడాం.
- source_word: יִקְרְבוּ יְמֵי אֵבֶל אָבִי
  choice: నా తండ్రి కోసం దుఃఖించే రోజులు దగ్గరపడుతున్నాయి
  rationale: ఈ పదబంధాన్ని ఇస్సాకు మరణించిన తరువాత అతని కోసం జరిగే దుఃఖకాలంగా ప్రధాన పాఠంలో ఇచ్చాం; మూలంలోని నిర్మాణాత్మక సందిగ్ధతను పాదసూచికలో నిలిపాం.
- source_word: וְאַהַרְגָה
  choice: అప్పుడు … చంపుతాను
  rationale: ఈ రూపం ఏశావు యొక్క దృఢ సంకల్పాన్ని తెలియజేస్తుంది. ‘అప్పుడు’ ముందున్న దుఃఖకాలం తరువాత చర్య తీసుకోవాలనే సందర్భార్థాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אָחִי
  choice: నా తమ్ముడు
  rationale: ‘నా’ అనే స్వామ్యార్థాన్ని నిలిపి, కుటుంబ సంబంధాన్ని తెలుగులో సహజంగా మరియు నిర్దిష్టంగా తెలిపేందుకు వయస్సులో చిన్నవాడైన యాకోబును ‘తమ్ముడు’గా పేర్కొన్నాం.
theological_decisions:
- issue: ఇస్సాకు దుఃఖదినాల అర్థం
  choice: ఇస్సాకు మరణించిన తరువాత అతని కోసం దుఃఖించే రోజులు
  alternative: ఇస్సాకు స్వయంగా దుఃఖించే రోజులు
  rationale: సందర్భంలో ఏశావు తండ్రి మరణం సమీపించిందని భావించి, దుఃఖకాలం తరువాత యాకోబును చంపాలని సంకల్పిస్తున్నట్లు ప్రధాన అర్థం కనిపిస్తుంది. అయితే హీబ్రూ నిర్మాణం మరో అర్థానికీ అవకాశం ఇస్తుంది; దాన్ని పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. ‘పగబట్టాడు’ నిరంతర శత్రుత్వాన్ని, ‘తన హృదయంలో … అనుకున్నాడు’ అంతరంగ నిర్ణయాన్ని స్పష్టంగా తెలియజేస్తాయి. మూలంలోని నిజమైన సందిగ్ధతను పాదసూచికలో కాపాడాం.
