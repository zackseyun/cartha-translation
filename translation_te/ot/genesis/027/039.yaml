id: GEN.27.39
reference: Genesis 27:39
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּ֛עַן יִצְחָ֥ק אָבִ֖י/ו וַ/יֹּ֣אמֶר אֵלָ֑י/ו הִנֵּ֞ה מִ/שְׁמַנֵּ֤י הָ/אָ֨רֶץ֙ יִהְיֶ֣ה מֽוֹשָׁבֶ֔/ךָ וּ/מִ/טַּ֥ל הַ/שָּׁמַ֖יִם מֵ/עָֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/039.yaml
  text: Then his father Isaac answered and said to him[a], “Behold, your dwelling shall be away from the richness of the earth, and away from the dew of heaven above.”
translation:
  language: te
  text: 'అప్పుడు అతని తండ్రియైన ఇస్సాకు అతనికి ఇలా జవాబిచ్చాడు: “ఇదిగో, నీ నివాసం సారవంతమైన భూమికి దూరంగా, పైనున్న ఆకాశపు మంచుకు దూరంగా ఉంటుంది.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “భూమి సారవంతతతో నీ నివాసం ఉంటుంది; పైనున్న ఆకాశపు మంచు నీకు ఉంటుంది.” హీబ్రూ ఉపసర్గను మూలం/భాగస్వామ్యార్థంలో (‘నుండి/తో’) గానీ, వియోజనార్థంలో (‘దూరంగా’) గానీ అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: ఇలా జవాబిచ్చాడు
  rationale: హీబ్రూ కథనంలో మాటను పరిచయం చేసే ‘జవాబిచ్చి చెప్పాడు’ అనే నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగులో సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: הִנֵּה
  choice: ఇదిగో
  rationale: గంభీరమైన ప్రకటనవైపు శ్రద్ధను మళ్లించే మూలభాషా సంభాషణ సూచకాన్ని నిలుపుతుంది.
- source_word: מִשְׁמַנֵּי הָאָרֶץ
  choice: సారవంతమైన భూమికి దూరంగా
  rationale: שְׁמַנִּים యొక్క రూపకాల అర్థమైన భూసారాన్ని సహజంగా తెలియజేస్తూ, מִן‌ను సందర్భానుసారంగా వియోజనార్థంలో అనువదిస్తుంది.
- source_word: מוֹשָׁבֶךָ
  choice: నీ నివాసం
  rationale: నివసించే స్థలం అనే స్థానార్థాన్ని గౌరవప్రదమైన, సాధారణ తెలుగులో కాపాడుతుంది.
- source_word: וּמִטַּל הַשָּׁמַיִם מֵעָל
  choice: పైనుండే ఆకాశపు మంచుకు దూరంగా
  rationale: మంచును సూచించే טַלను, పై ఆకాశం అనే ప్రాదేశిక భావాన్ని నిలుపుతూ రెండవ מִן‌ను కూడా వియోజనార్థంలో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ఇస్సాకు ఏశావుతో పలికిన మాటలో מִן ఉపసర్గ అర్థం
  choice: భూమి సారానికి, ఆకాశపు మంచుకు ‘దూరంగా’ అనే వియోజనార్థం
  alternative: భూమి సారంలోనుండి/భూమి సారంతో, ఆకాశపు మంచులోనుండి/మంచుతో అనే అనుకూల మూలం లేదా భాగస్వామ్యార్థం
  rationale: 27:28లో యాకోబుకు ఇచ్చిన ఆశీర్వాదంతో ఉన్న సందర్భోచిత వ్యత్యాసం వియోజనార్థానికి బలం ఇస్తుంది. అయితే హీబ్రూ ఉపసర్గ రెండు విధాలుగా అర్థమయ్యే అవకాశం ఉన్నందున ప్రత్యామ్నాయ అనుకూల పఠనాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన వాక్య నిర్మాణం వాడబడింది. మూలంలోని నిజమైన ద్వంద్వార్థాన్ని ప్రధాన పాఠం మరియు పాదసూచిక ద్వారా భద్రపరిచాం.
