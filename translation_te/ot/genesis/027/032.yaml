  terminology: “ఇస్సాకు” and “ఏశావు” are appropriate familiar Telugu biblical name forms. “తొలిపుట్టిన కుమారుడు” clearly retains the birth-order emphasis of בְּכוֹרְךָ without adding interpretive claims.
