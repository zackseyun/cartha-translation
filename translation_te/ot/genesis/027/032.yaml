base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/032.yaml
  text: His father Isaac said to him[a], “Who are you?” And he said, “I am your son, your firstborn[b], Esau.”
translation:
  language: te
  text: అతని తండ్రి ఇస్సాకు[a] అతనిని, “నువ్వెవరు?” అని అడిగాడు. అతడు, “నేను నీ కుమారుణ్ణి, నీ తొలిపుట్టిన కుమారుణ్ణి[b], ఏశావును” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూలో పదక్రమం: “ఇస్సాకు, అతని తండ్రి.”'
    reason: lexical_alternative
  - marker: b
    text: లేదా “నీ పెద్ద కుమారుణ్ణి”; హీబ్రూలో అక్షరార్థంగా “నీ తొలిపుట్టిన కుమారుణ్ణి” అని ఉంది. ఇది పరిసర కథనంలో ముఖ్యమైన జననక్రమాన్ని నొక్కిచెబుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר לֹו
  choice: అతనితో ... అని అడిగాడు
  rationale: אמר సాధారణంగా ‘అన్నాడు’ అని అర్థం; ఇక్కడ పలికిన మాట ప్రశ్న కావడంతో సహజమైన ఆధునిక తెలుగులో ‘అడిగాడు’ అని అనువదించడం సందర్భానుకూలం. לֹו ను ‘అతనితో’గా నిలిపాం.
- source_word: יִצְחָק אָבִיו
  choice: అతని తండ్రి ఇస్సాకు
  rationale: హీబ్రూ పదక్రమం అక్షరార్థంగా ‘ఇస్సాకు, అతని తండ్రి’; తెలుగులో సంబంధాన్ని స్పష్టంగా, సహజంగా తెలిపే రూపం ‘అతని తండ్రి ఇస్సాకు’.
- source_word: מִי אַתָּה
  choice: నువ్వెవరు?
  rationale: సూటి ప్రశ్నకు సహజమైన ఆధునిక తెలుగు సమానార్థకం.
- source_word: אֲנִי בִּנְךָ
  choice: నేను నీ కుమారుణ్ణి
  rationale: క్రియలేని హీబ్రూ నామవాక్యాన్ని తెలుగులో సహజమైన విధేయ రూపంతో అనువదించాం.
- source_word: בְכֹרְךָ
  choice: నీ తొలిచూలు కుమారుణ్ణి
  rationale: בכור జనన క్రమంతోపాటు పరిసర కథనంలో ముఖ్యమైన జ్యేష్ఠత్వపు భావాన్ని సూచిస్తుంది. ‘తొలిచూలు కుమారుడు’ ఆ భావాన్ని ‘పెద్ద కుమారుడు’ కంటే స్పష్టంగా నిలుపుతుంది.
- source_word: עֵשָׂו
  choice: ఏశావు
  rationale: తెలుగు బైబిలు సంప్రదాయంలో సుపరిచితమైన వ్యక్తినామ రూపం.
theological_decisions:
- issue: בְכֹרְךָ లోని జననక్రమం మరియు జ్యేష్ఠత్వపు ప్రాధాన్యం
  choice: తొలిచూలు కుమారుడు
  alternative: పెద్ద కుమారుడు
  rationale: ఈ కథనంలో జన్మహక్కు, ఆశీర్వాదం కీలకమైనందున మూలంలోని ‘మొదట పుట్టినవాడు’ అనే బలాన్ని తగ్గించకుండా ఉంచాం; అదనపు సిద్ధాంతార్థాన్ని చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. సంభాషణలో తండ్రి కుమారునితో మాట్లాడే సహజ ఏకవచన రూపం ‘నువ్వు/నీ’ వాడబడింది. ‘తొలిచూలు’ కొంత సాహిత్యగంభీరత కలిగినా సాధారణ పాఠకునికి అర్థమయ్యేలా ‘కుమారుడు’తో కలిపి ఇచ్చాం.
