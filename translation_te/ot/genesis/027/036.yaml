  terminology: “మొదటి కుమారునిగా నాకున్న హక్కు,” “ఆశీర్వాదం,” మరియు “మిగిల్చి ఉంచలేదా?” సందర్భానుకూలంగా, అర్థవంతంగా ఉన్నాయి. యాకోబు పేరుకు క్రియకు ఉన్న హీబ్రూ పదప్రయోగాన్ని పాదసూచిక స్పష్టంగా కాపాడుతుంది.
