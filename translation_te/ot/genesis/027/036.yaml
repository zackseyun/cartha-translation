  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథన శైలి. హీబ్రూ పేరుతో ఉన్న పదప్రయోగం తెలుగులో నేరుగా పునరుత్పత్తి కావడం సాధ్యం కానందున పాదసూచికలో వివరించబడింది.
