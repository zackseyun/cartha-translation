source:
  edition: WLC
  text: וַ/יֹּ֡אמֶר הֲ/כִי֩ קָרָ֨א שְׁמ֜/וֹ יַעֲקֹ֗ב וַֽ/יַּעְקְבֵ֨/נִי֙ זֶ֣ה פַעֲמַ֔יִם אֶת בְּכֹרָתִ֣/י לָקָ֔ח וְ/הִנֵּ֥ה עַתָּ֖ה לָקַ֣ח בִּרְכָתִ֑/י וַ/יֹּאמַ֕ר הֲ/לֹא אָצַ֥לְתָּ לִּ֖/י בְּרָכָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/036.yaml
  text: 'And he said[a], “Is he not rightly named Jacob? For he has supplanted me these two times: he took my birthright, and look, now he has taken my blessing.” And he said, “Have you not reserved a blessing for me?”'
translation:
  language: te
  text: 'అతడు, “అతనికి ‘యాకోబు’ అనే పేరు సరిగ్గానే పెట్టారు కదా? అతడు నన్ను ఈ రెండుసార్లు మోసగించాడు[a]: మొదటి కుమారునిగా నాకున్న హక్కును తీసుకున్నాడు; ఇదిగో, ఇప్పుడు నా ఆశీర్వాదాన్ని కూడా తీసుకున్నాడు” అన్నాడు. అతడు, “నా కోసం ఒక ఆశీర్వాదాన్ని మిగిల్చి ఉంచలేదా?” అన్నాడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ‘యాకోబు’ అనే పేరుకూ ఇక్కడ ‘నన్ను మోసగించాడు’ అని అనువదించిన క్రియకూ పదప్రయోగ సంబంధం ఉంది. ఈ క్రియకు ‘నన్ను అధిగమించాడు’ లేదా ‘నన్ను వెనక్కి నెట్టి నా స్థానాన్ని తీసుకున్నాడు’ అని కూడా అర్థం చెప్పవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲכִי קָרָא שְׁמוֹ יַעֲקֹב
  choice: అతనికి ‘యాకోబు’ అని పేరు పెట్టడం సరిగ్గానే ఉంది కదా?
  rationale: ప్రశ్నలోని వ్యంగ్యాన్ని, పేరుతో ముడిపడిన చేదైన వ్యాఖ్యను సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: וַיַּעְקְבֵנִי
  choice: నన్ను పక్కకు నెట్టి నా స్థానాన్ని తీసుకున్నాడు
  rationale: కేవలం ‘మోసం చేశాడు’ అని అర్థాన్ని పరిమితం చేయకుండా, మరొకరిని వెనక్కి నెట్టి అతని స్థానం లేదా ప్రయోజనం పొందడమనే భావాన్ని వ్యక్తం చేస్తుంది; పేరుతో ఉన్న హీబ్రూ పదప్రయోగం పాదసూచికలో వివరించబడింది.
- source_word: זֶה פַעֲמַיִם
  choice: ఈ రెండుసార్లు
  rationale: హీబ్రూ మాటలోని సూచనాత్మక ఉద్ఘాటనను దగ్గరగా నిలుపుతుంది.
- source_word: בְּכֹרָתִי
  choice: మొదటి కుమారునిగా నాకున్న హక్కు
  rationale: ‘జ్యేష్ఠత్వం’ కంటే సాధారణ పాఠకులకు స్పష్టంగా ఉండి, మొదట పుట్టిన కుమారునికి చెందిన కుటుంబపరమైన, న్యాయపరమైన హక్కును తెలియజేస్తుంది.
- source_word: וְהִנֵּה עַתָּה
  choice: ఇదిగో, ఇప్పుడు
  rationale: ఏశావు ఆవేదనతో చేస్తున్న ఆకస్మిక సూచనను సమకాలీనమైనప్పటికీ గౌరవప్రదమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בִּרְכָתִי
  choice: నా ఆశీర్వాదం
  rationale: ఇస్సాకు ఇచ్చిన పితృసంబంధ ఆశీర్వాదాన్ని నేరుగా, సందర్భానికి తగిన విధంగా సూచిస్తుంది.
- source_word: הֲלֹא אָצַלְתָּ לִּי בְּרָכָה
  choice: నా కోసం ఒక ఆశీర్వాదాన్ని మిగిల్చి ఉంచలేదా?
  rationale: తనకు ఇంకా ఏదైనా ఆశీర్వాదం మిగిలి ఉందేమో అని ఏశావు చేస్తున్న విజ్ఞప్తిని, אָצַל లోని ‘మిగిల్చి ఉంచు’ భావంతో సహజంగా అందిస్తుంది.
