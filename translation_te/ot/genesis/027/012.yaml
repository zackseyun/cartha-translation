source:
  edition: WLC
  text: אוּלַ֤י יְמֻשֵּׁ֨/נִי֙ אָבִ֔/י וְ/הָיִ֥יתִי בְ/עֵינָ֖י/ו כִּ/מְתַעְתֵּ֑עַ וְ/הֵבֵאתִ֥י עָלַ֛/י קְלָלָ֖ה וְ/לֹ֥א בְרָכָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/012.yaml
  text: Perhaps my father will feel me[a], and I will seem to him like a deceiver[b], and I will bring a curse on myself and not a blessing.
translation:
  language: te
  text: నా తండ్రి నన్ను తడిమి చూస్తారేమో[a]; అప్పుడు నేను ఆయనకు మోసగాడిలా[b] కనిపిస్తాను. నేను ఆశీర్వాదానికి బదులు శాపాన్ని నా మీదికి తెచ్చుకుంటాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నన్ను తాకుతారేమో.’ హీబ్రూ క్రియ చేతితో తాకి తెలుసుకోవడాన్ని సూచిస్తుంది; ఇస్సాకు యాకోబు గుర్తింపును స్పర్శ ద్వారా పరీక్షించే సందర్భానికి ఇది సరిపోతుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘ఎగతాళి చేసేవాడిలా,’ ‘మాయ చేసేవాడిలా.’ హీబ్రూ పదం మరొకరిని తప్పుదారి పట్టించే లేదా అతనిని వెర్రివాణ్ణి చేసేలా ప్రవర్తించే వ్యక్తిని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אוּלַי
  choice: ఒకవేళ
  rationale: యాకోబు భయపడుతున్న సంభావ్యతను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: יְמֻשֵּׁנִי
  choice: నన్ను తడిమి చూస్తే
  rationale: משש అనే క్రియ చేతితో తాకి గుర్తించడం లేదా పరీక్షించడం అనే భావాన్ని ఇస్తుంది; ఇస్సాకు యాకోబు గుర్తింపును స్పర్శ ద్వారా నిర్ధారించుకునే సందర్భానికి ఇది సరిపోతుంది.
- source_word: אָבִי
  choice: నా తండ్రి
  rationale: హీబ్రూ స్వామ్య సంబంధాన్ని నేరుగా, సహజంగా అందిస్తుంది.
- source_word: וְהָיִיתִי בְעֵינָיו
  choice: నేను ఆయనకు ... కనిపిస్తాను
  rationale: ‘అతని కళ్లలో’ అనే హీబ్రూ నుడికారానికి ‘అతని అంచనాలో/దృష్టిలో’ అనే భావం ఉంది; తెలుగులో ‘ఆయనకు ... కనిపిస్తాను’ సహజంగా ఉంటుంది.
- source_word: כִּמְתַעְתֵּעַ
  choice: మోసం చేసేవాడిలా
  rationale: ఈ రూపం తప్పుదారి పట్టించే లేదా ఎదుటివాణ్ణి మోసగించే వ్యక్తిని సూచిస్తుంది; ‘ఎగతాళి చేసేవాడిలా’ అనే సాధ్యమైన భావాన్ని పాదసూచికలో ఉంచి మూలంలోని అర్థ పరిధిని కాపాడాం.
- source_word: וְהֵבֵאתִי עָלַי
  choice: నా మీదికి తెచ్చుకుంటాను
  rationale: హిఫిల్ క్రియతో עלי కలయిక తనపైకి ఫలితాన్ని తెచ్చుకోవడం అనే కార్యార్థాన్ని ఇస్తుంది.
- source_word: קְלָלָה
  choice: శాపాన్ని
  rationale: తక్షణ సందర్భంలోని ఆశీర్వాదానికి వ్యతిరేకమైన ప్రామాణిక సమానార్థకం.
- source_word: וְלֹא בְרָכָה
  choice: ఆశీర్వాదానికి బదులు
  rationale: హీబ్రూలోని శాపం–ఆశీర్వాదం వ్యత్యాసాన్ని సహజమైన తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: యాకోబు భయం నైతికంగా మోసంపట్లనా లేక దాని పరిణామంపట్లనా అన్న సూచన
  choice: వచనంలోని మాటలను మాత్రమే అనువదించి, అతని ఉద్దేశాన్ని అదనంగా వ్యాఖ్యానించలేదు.
  alternative: యాకోబు మోసం చేయడంకన్నా పట్టుబడటానికే భయపడ్డాడని స్పష్టీకరించడం.
  rationale: మూల వచనం అతని భయాన్ని శాపం–ఆశీర్వాదం ఫలితాలతో అనుసంధానిస్తుంది గాని, విస్తృత నైతిక తీర్పును ప్రత్యక్షంగా చెప్పదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కుటుంబ సంభాషణ శైలిని ఉపయోగించాం. ‘తడిమి చూస్తే’ స్పర్శ ద్వారా పరీక్షించే చర్యను సాధారణ పాఠకుడికి స్పష్టంగా తెలియజేస్తుంది. రెండు పాదసూచిక గుర్తులూ ప్రధాన పాఠ్యంలో ఉంచబడ్డాయి.
