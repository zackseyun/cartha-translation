revisions:
- from: ఒకవేళ నా తండ్రి నన్ను తడిమి చూస్తే[a], నేను ఆయనకు మోసం చేసేవాడిలా[b] కనిపిస్తాను. అప్పుడు నేను ఆశీర్వాదానికి బదులు శాపాన్ని నా మీదికి తెచ్చుకుంటాను.
