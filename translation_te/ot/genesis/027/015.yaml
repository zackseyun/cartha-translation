translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. మూలంలోని ‘పెద్ద కుమారుడు/చిన్న కుమారుడు’ వ్యత్యాసం స్పష్టంగా నిలుపబడింది; పొడవైన సంబంధ ఉపవాక్యాన్ని తెలుగు పఠన సౌలభ్యం కోసం రెండు వాక్యాలుగా విభజించాం.
