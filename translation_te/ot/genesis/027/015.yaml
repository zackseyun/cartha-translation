revisions:
- from: అప్పుడు రిబ్కా తన పెద్ద కుమారుడైన ఏశావుకు చెందిన శ్రేష్ఠమైన వస్త్రాలను[a] తీసుకుంది. అవి ఇంట్లో ఆమె దగ్గరే ఉన్నాయి[b]. వాటిని తన చిన్న కుమారుడైన యాకోబుకు తొడిగించింది.
  to: అప్పుడు రిబ్కా తన పెద్ద కుమారుడైన ఏశావుకు చెందిన శ్రేష్ఠమైన వస్త్రాలను[a] తీసుకుని, ఇంట్లో ఆమె దగ్గర ఉన్న వాటిని తన చిన్న కుమారుడైన యాకోబుకు తొడిగించింది.
  rationale: The revision removes unwarranted emphasis from the main text and adjusts footnote b to avoid implying that Rebekah stored the garments. The footnote anchor is retained at the garment phrase; because the Hebrew relative clause directly qualifies ‘garments,’ this placement remains unambiguous in Telugu.
