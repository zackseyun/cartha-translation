source:
  edition: WLC
  text: וַ/תִּקַּ֣ח רִ֠בְקָה אֶת בִּגְדֵ֨י עֵשָׂ֜ו בְּנָ֤/הּ הַ/גָּדֹל֙ הַ/חֲמֻדֹ֔ת אֲשֶׁ֥ר אִתָּ֖/הּ בַּ/בָּ֑יִת וַ/תַּלְבֵּ֥שׁ אֶֽת יַעֲקֹ֖ב בְּנָ֥/הּ הַ/קָּטָֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/015.yaml
  text: Then Rebekah took the choice garments of Esau her older son[a], which were with her in the house[b], and put them on Jacob her younger son.
translation:
  language: te
  text: అప్పుడు రిబ్కా తన పెద్ద కుమారుడైన ఏశావుకు చెందిన శ్రేష్ఠమైన వస్త్రాలను[a] తీసుకుని, ఇంట్లో ఆమె దగ్గర ఉన్న వాటిని తన చిన్న కుమారుడైన యాకోబుకు తొడిగించింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఏశావుకు చెందిన అత్యుత్తమ వస్త్రాలను.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּקַּח
  choice: అప్పుడు ... తీసుకుంది
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది; ఆధునిక తెలుగు కథన ప్రవాహంలో ‘అప్పుడు’ సహజంగా కాలక్రమాన్ని తెలియజేస్తుంది.
- source_word: בִּגְדֵי
  choice: వస్త్రాలను
  rationale: ఇది దుస్తులను సూచించే బహువచన నిర్మాణం; ‘వస్త్రాలు’ కథన సందర్భానికి తగిన గౌరవప్రదమైన సాధారణ పదం.
- source_word: הַחֲמֻדֹת
  choice: శ్రేష్ఠమైన
  rationale: హీబ్రూ పదం కోరదగినవి, విలువైనవి, ఎంపికైనవి అనే భావాలను కలిగి ఉంది. వస్త్రాల సందర్భంలో ‘శ్రేష్ఠమైన’ వాటి ప్రత్యేక విలువను అతిశయోక్తి లేకుండా తెలియజేస్తుంది.
- source_word: בְּנָהּ הַגָּדֹל
  choice: తన పెద్ద కుమారుడైన
  rationale: కుటుంబ సందర్భంలో גָּדוֹל వయస్సులో పెద్దవాడిని సూచిస్తూ קָטָן‌తో వ్యత్యాసంగా ఉంది.
- source_word: אֲשֶׁר אִתָּהּ בַּבָּיִת
  choice: అవి ఇంట్లో ఆమె దగ్గరే ఉన్నాయి
  rationale: మూలంలోని స్థానం/సంబంధ భావాన్ని నేరుగా నిలుపుతుంది; ఆమె వాటిని ప్రత్యేకంగా దాచిందనే అదనపు భావాన్ని చేర్చదు.
- source_word: וַתַּלְבֵּשׁ
  choice: తొడిగించింది
  rationale: ఈ క్రియ మరొకరికి దుస్తులు వేయడాన్ని సూచిస్తుంది; తెలుగులో ‘తొడిగించింది’ ఆ కారణార్థక భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בְּנָהּ הַקָּטָן
  choice: తన చిన్న కుమారుడైన
  rationale: ఇక్కడ קָטָן శరీర పరిమాణాన్ని కాకుండా ఏశావుతో పోల్చినప్పుడు వయస్సులో చిన్నవాడైన కుమారుడిని సూచిస్తుంది.
