source:
  edition: WLC
  text: וַ/יַּ֨עַן יִצְחָ֜ק וַ/יֹּ֣אמֶר לְ/עֵשָׂ֗ו הֵ֣ן גְּבִ֞יר שַׂמְתִּ֥י/ו לָ/ךְ֙ וְ/אֶת כָּל אֶחָ֗י/ו נָתַ֤תִּי ל/וֹ֙ לַ/עֲבָדִ֔ים וְ/דָגָ֥ן וְ/תִירֹ֖שׁ סְמַכְתִּ֑י/ו וּ/לְ/כָ֣ה אֵפ֔וֹא מָ֥ה אֶֽעֱשֶׂ֖ה בְּנִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/037.yaml
  text: Isaac answered and said to Esau[a], “Look, I have made him master over you, and I have given all his brothers to him as servants. I have sustained him with grain and new wine. What then can I do for you[c][b], my son?”
translation:
  language: te
  text: 'ఇస్సాకు ఏశావుకు ఇలా జవాబిచ్చాడు: “ఇదిగో, నేను అతణ్ణి నీకు యజమానిగా నియమించాను; అతని సోదరులందరినీ అతనికి సేవకులుగా ఇచ్చాను.[a] ధాన్యంతో, కొత్త ద్రాక్షారసంతో అతణ్ణి పోషించాను.[b] కాబట్టి ఇప్పుడు నీ కోసం నేనేమి చేయగలను, నా కుమారుడా?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దాసులుగా.” హీబ్రూ పదం సందర్భాన్ని బట్టి సేవకులనో దాసులనో సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ధాన్యంతో, కొత్త ద్రాక్షారసంతో అతనికి ఆసరా కల్పించాను.” హీబ్రూ క్రియ పోషించడం, ఆదుకోవడం లేదా ఆసరా కల్పించడం అనే భావాలను ఇవ్వగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: ఇలా జవాబిచ్చాడు
  rationale: హీబ్రూ కథన సూత్రంలోని ‘జవాబిచ్చి చెప్పాడు’ అనే భావాన్ని సహజమైన ఆధునిక తెలుగు సంభాషణా రూపంలో అందిస్తుంది.
- source_word: הֵן
  choice: ఇదిగో
  rationale: శ్రద్ధను ఆకర్షిస్తూ తరువాతి ప్రకటనను నొక్కిచెప్పే హీబ్రూ అవ్యయ బలాన్ని గౌరవప్రదమైన సాధారణ తెలుగులో నిలుపుతుంది.
- source_word: גְּבִיר שַׂמְתִּיו לָךְ
  choice: నేను అతణ్ణి నీకు యజమానిగా నియమించాను
  rationale: שׂים తో వచ్చిన విధేయ నామవాచకం అధికార స్థానానికి నియామకాన్ని సూచిస్తుంది; ‘నీకు యజమానిగా’ సంబంధంలోని ఆధిపత్యాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: כָּל אֶחָיו
  choice: అతని సోదరులందరినీ
  rationale: మూలంలోని కుటుంబ సంబంధ పదాన్ని విస్తరించి ‘బంధువులు’గా చేయకుండా నేరుగా అనువదిస్తుంది.
- source_word: לַעֲבָדִים
  choice: సేవకులుగా
  rationale: עבד సందర్భానుసారం సేవకులు లేదా దాసులు అని అర్థమవుతుంది; ఆశీర్వాదంలోని అధీనత ప్రధానంగా ఉన్నందున పాఠ్యంలో ‘సేవకులు’ను ఎంచుకొని ప్రత్యామ్నాయాన్ని పాదటీకలో ఉంచాం.
- source_word: דָגָן וְתִירֹשׁ
  choice: ధాన్యంతో, కొత్త ద్రాక్షారసంతో
  rationale: వ్యవసాయ ఉత్పత్తులైన ధాన్యాన్నీ తాజా/కొత్త ద్రాక్షారసాన్నీ వేర్వేరుగా నిలుపుతుంది.
- source_word: סְמַכְתִּיו
  choice: అతణ్ణి పోషించాను
  rationale: సమర్థించడం, నిలబెట్టడం, సమకూర్చడం అనే סמך భావం ఇక్కడ ధాన్యం మరియు కొత్త ద్రాక్షారసం ద్వారా జీవనాధారం కల్పించడాన్ని సూచిస్తుంది; ‘పోషించాను’ సహజంగా ఆ భావాన్ని ఇస్తుంది.
- source_word: וּלְכָה אֵפוֹא מָה אֶעֱשֶׂה
  choice: కాబట్టి ఇప్పుడు నీ కోసం నేనేమి చేయగలను
  rationale: וּ...אֵפוֹא లోని పర్యవసాన సూచనను ‘కాబట్టి ఇప్పుడు’గా, ప్రశ్నలోని వాస్తవ అసమర్థతను ‘ఏమి చేయగలను’గా సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בְּנִי
  choice: నా కుమారుడా
  rationale: ప్రత్యక్షమైన, ఆప్యాయమైన పుత్ర సంబోధనను గౌరవభరితంగా నిలుపుతుంది.
theological_decisions:
- issue: ఆశీర్వాదం ఇచ్చిన తరువాత ఇస్సాకు మరేదైనా చేయగలడా అనే ప్రశ్న
  choice: ‘నేనేమి చేయగలను’ అనే అలంకారిక ప్రశ్నను అలాగే ఉంచడం
  alternative: ‘నేను నీకు ఏమీ చేయలేను’ అని స్పష్టమైన నిరాకరణగా మార్చడం
  rationale: మూలం అసమర్థతను సూచించినప్పటికీ దాన్ని ప్రకటనగా కాక ప్రశ్నగా ఉంచుతుంది; ఆ వాక్యరూపం మరియు దానిలోని ఉద్వేగాన్ని అనువాదం నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కథనంలో సహజత్వం, సంభాషణలో గౌరవం మరియు భావోద్వేగ బరువు నిలుపబడ్డాయి. పాతకాలపు లేదా మతశాఖాపరమైన పదజాలాన్ని నివారించాం. అన్ని పాదటీక సూచికలు సంబంధిత పదబంధాల వెంట ప్రధాన పాఠ్యంలో ఉంచబడ్డాయి.
