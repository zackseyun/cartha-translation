source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר בָּ֥א אָחִ֖י/ךָ בְּ/מִרְמָ֑ה וַ/יִּקַּ֖ח בִּרְכָתֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/035.yaml
  text: And he said[a], “Your brother came with deceit and took your blessing.”
translation:
  language: te
  text: అప్పుడు అతడు, “నీ సోదరుడు మోసంతో[a] వచ్చి నీ ఆశీర్వాదాన్ని తీసుకున్నాడు” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “మోసం చేసి” లేదా “మోసపూర్వకంగా.” హీబ్రూలో ఉపసర్గతో కూడిన “మోసం” అనే నామవాచకం ఉంది; అది చర్య జరిగిన విధానాన్నో సాధనాన్నో సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు అతడు … అన్నాడు
  rationale: హీబ్రూ కథనంలోని wayyiqtol క్రమాన్ని సహజమైన ఆధునిక తెలుగు కథనశైలిలో చూపిస్తుంది; వక్తయైన ఇస్సాకు పేరును మూలంలో లేనందున చేర్చలేదు.
- source_word: בָּא
  choice: వచ్చి
  rationale: పూర్తయిన గత చర్యను తెలుపుతుంది; తరువాతి וַיִּקַּח క్రియతో సహజంగా అనుసంధానించడానికి తెలుగు సంయుక్త క్రియారూపం వాడబడింది.
- source_word: אָחִיךָ
  choice: నీ సోదరుడు
  rationale: రెండవ పురుష ఏకవచన ప్రత్యయంతో ఉన్న బంధుత్వ పదాన్ని నేరుగా అనువదిస్తుంది; మూలంలోని వాక్చాతుర్యాన్ని నిలుపుకోవడానికి యాకోబు పేరును ప్రత్యామ్నాయంగా పెట్టలేదు.
- source_word: בְּמִרְמָה
  choice: మోసంతో
  rationale: בְּ ఉపసర్గతో కూడిన מִרְמָה నామవాచకం విధానం లేదా సాధనాన్ని సూచిస్తుంది. ‘మోసంతో’ నామవాచక రూపాన్నీ దాని నైతిక బరువునీ సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: וַיִּקַּח
  choice: తీసుకున్నాడు
  rationale: కథన క్రమంలో పూర్తయిన చర్యను సహజంగా తెలియజేస్తుంది; మూలంలో లేని బలప్రయోగ భావాన్ని చేర్చదు.
- source_word: בִּרְכָתֶךָ
  choice: నీ ఆశీర్వాదాన్ని
  rationale: రెండవ పురుష ఏకవచన ప్రత్యయంతో ఉన్న పదానికి నేరమైన అనువాదం; సందర్భంలో ఏశావుకు ఉద్దేశించిన పితృ ఆశీర్వాదాన్ని సూచించినా, మూలంలోని సరళతను నిలుపుతుంది.
