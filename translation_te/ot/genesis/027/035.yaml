  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. ‘మోసంతో’ అనే రూపం హీబ్రూ నామవాచక నిర్మాణాన్ని సాధ్యమైనంతవరకు కాపాడుతుంది; పాదటిప్పణి సహజమైన ఇతర రూపాలను తెలియజేస్తుంది.
