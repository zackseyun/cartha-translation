  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: יַֽעַבְד֣וּ/ךָ עַמִּ֗ים ו/ישתחו לְ/ךָ֙ לְאֻמִּ֔ים הֱוֵ֤ה גְבִיר֙ לְ/אַחֶ֔י/ךָ וְ/יִשְׁתַּחֲוּ֥וּ לְ/ךָ֖ בְּנֵ֣י אִמֶּ֑/ךָ אֹרְרֶ֣י/ךָ אָר֔וּר וּֽ/מְבָרֲכֶ֖י/ךָ בָּרֽוּךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/029.yaml
  text: Let peoples serve you[a], and nations bow down to you. Be master over your brothers, and let your mother's sons bow down to you. Cursed be those who curse you[b], and blessed be those who bless you.
translation:
  language: te
  text: ప్రజలు నిన్ను సేవించుగాక; జాతులు నీకు వంగి నమస్కరించుగాక.[a] నీ సోదరులపై నీవు యజమానిగా[b] ఉండు; నీ తల్లి కుమారులు నీకు వంగి నమస్కరించుగాక. నిన్ను శపించేవారు శపించబడుగాక; నిన్ను దీవించేవారు దీవించబడుగాక.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నీకు ప్రణామం చేయుగాక.’ హీబ్రూ క్రియ ఉన్నతుని ఎదుట వంగడాన్ని లేదా సాష్టాంగంగా పడడాన్ని సూచించగలదు; ఆ ఉన్నతుడు మానవుడైనా దేవుడైనా కావచ్చు. ఇక్కడ సందర్భం ఆరాధనకన్నా గౌరవపూర్వక విధేయతను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘ప్రభువుగా ఉండు.’ దేవునికి కూడా వాడబడే ‘ప్రభువు’ అనే బిరుదుతో గందరగోళం రాకుండా ప్రధాన పాఠంలో ‘యజమాని’ వాడబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַֽעַבְד֣וּ/ךָ
  choice: నిన్ను సేవించుగాక
  rationale: עבד అనే క్రియ ఇక్కడ సాధారణ ఉద్యోగాన్ని కాక, ఆశీర్వాద సందర్భంలో విధేయతతో చేసే సేవను సూచిస్తుంది. ‘సేవించుగాక’ ఆ విస్తృత భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: עַמִּים
  choice: ప్రజలు
  rationale: బహువచన సమూహాలైన ప్రజలను సూచించే పదం; తరువాతి לְאֻמִּיםతో ఉన్న కవితాత్మక సమాంతరతను నిలుపుతుంది.
- source_word: ו/ישתחו לְ/ךָ
  choice: నీకు సాష్టాంగపడుగాక
  rationale: שחה/השתחוה శ్రేష్ఠుని ఎదుట నేలవంగి నమస్కరించడాన్ని సూచించగలదు. ఇక్కడ స్వీకర్త మానవుడు కాబట్టి ‘ఆరాధించుగాక’ అని అతిగా నిర్దిష్టం చేయకుండా శరీరభంగిమను వ్యక్తం చేసే అనువాదం ఎంచుకున్నాం.
- source_word: לְאֻמִּים
  choice: జనాలు
  rationale: עמיםకు సమాంతరమైన ప్రజాసమూహాల పదం. ‘జనాలు’ తెలుగు కవితాత్మక సమాంతరతలో సహజమైన వైవిధ్యాన్ని ఇస్తుంది.
- source_word: הֱוֵה גְבִיר
  choice: యజమానిగా ఉండు
  rationale: הוהతో కూడిన గెబీర్ ఆధిపత్య స్థానంలో ఉన్నవాడిని సూచిస్తుంది. ‘యజమాని’ కుటుంబ సంబంధాల్లోని అధికారాన్ని తెలియజేస్తూ దేవునికి ఉపయోగించే ‘ప్రభువు’ అనే బిరుదుతో గందరగోళాన్ని నివారిస్తుంది.
- source_word: לְ/אַחֶ֔י/ךָ
  choice: నీ సోదరులకు
  rationale: గెబీర్‌తో వచ్చే ל సంబంధపరంగా వారిపై అధికారం కలిగి ఉండడాన్ని సూచిస్తుంది. తెలుగులో ‘నీ సోదరులకు యజమానిగా’ అనే నిర్మాణం సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: בְּנֵי אִמֶּךָ
  choice: నీ తల్లి కుమారులు
  rationale: హీబ్రూ కుటుంబపరమైన నిర్దిష్ట వ్యక్తీకరణను యథాతథంగా నిలిపి, సాధారణ ‘సోదరులు’ నుంచి తల్లి కుమారుల వైపు జరిగే సంకుచితీకరణను కాపాడుతుంది.
- source_word: אֹרְרֶי/ךָ אָר֔וּר
  choice: నిన్ను శపించేవారు శపించబడుగాక
  rationale: కర్తృవాచక కృదంతం, శాపస్థితిని తెలిపే పదం కలిసిన పరస్పర శాపసూత్రాన్ని తెలుగు ఆశీర్వాద శైలిలో వ్యక్తం చేస్తుంది.
- source_word: וּֽ/מְבָרֲכֶ֖י/ךָ בָּרֽוּךְ
  choice: నిన్ను దీవించేవారు దీవించబడుగాక
  rationale: ముందటి శాపవాక్యానికి సమాంతరమైన ఆశీర్వాద సూత్రాన్ని, సమూహార్థక హీబ్రూ నిర్మాణాన్ని సహజమైన తెలుగు బహువచనంతో అందిస్తుంది.
theological_decisions:
- issue: మానవుని ఎదుట వంగడాన్ని తెలిపే భాష
  choice: నీకు సాష్టాంగపడుగాక
  alternative: నీకు ప్రణామం చేయుగాక; నిన్ను ఆరాధించుగాక
  rationale: హీబ్రూ క్రియ దేవుని లేదా మానవ అధికారి ఎదుట భక్తిపూర్వకంగా నేలవంగడాన్ని సూచించగలదు. ఇక్కడ యాకోబుకు ఇవ్వబడిన కుటుంబ, ప్రజాసంబంధ ఆధిపత్య ఆశీర్వాదమే సందర్భం. అందువల్ల దైవారాధనను నిర్బంధంగా సూచించకుండా మూలంలోని శరీరభంగిమను, గౌరవాన్ని నిలిపాం.
- issue: גְבִיר అనే అధికారపదం
  choice: యజమాని
  alternative: ప్రభువు; పాలకుడు
  rationale: ఈ పదం కుటుంబంపై ఆధిపత్యం కలిగిన వ్యక్తిని సూచిస్తుంది. ‘ప్రభువు’ దైవబిరుదుగా కూడా వినిపించవచ్చు; ‘పాలకుడు’ మూలంలో స్పష్టంగా లేని రాజకీయ భావాన్ని పెంచవచ్చు. కాబట్టి ‘యజమాని’ ఎంచుకున్నాం.
translation_notes:
  register: ఆశీర్వాద వాక్యానికి తగిన గంభీరమైన, అయినా ఆధునిక పాఠకులకు అర్థమయ్యే ప్రామాణిక తెలుగు వాడబడింది. ‘-గాక’ రూపాలు మూలంలోని కవితాత్మక ఆశీర్వాద/శాప స్వరాన్ని నిలుపుతాయి. ప్రతి పాదంలో సమాంతర నిర్మాణం కాపాడబడింది.
