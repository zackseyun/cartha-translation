  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన కథనశైలిని ఉపయోగించాం. వేగంగా వరుసగా జరిగిన సంఘటనల భావాన్ని ‘ముగించగానే’, ‘అప్పుడే’, ‘వెళ్లగా’ అనే రూపాలతో నిలిపాం; కుటుంబ సంబంధాలను మూలపాఠంలాగే స్పష్టంగా ఉంచాం.
