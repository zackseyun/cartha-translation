  text: וַ/יְהִ֗י כַּ/אֲשֶׁ֨ר כִּלָּ֣ה יִצְחָק֮ לְ/בָרֵ֣ךְ אֶֽת יַעֲקֹב֒ וַ/יְהִ֗י אַ֣ךְ יָצֹ֤א יָצָא֙ יַעֲקֹ֔ב מֵ/אֵ֥ת פְּנֵ֖י יִצְחָ֣ק אָבִ֑י/ו וְ/עֵשָׂ֣ו אָחִ֔י/ו בָּ֖א מִ/צֵּידֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/030.yaml
  text: And it happened that as soon as Isaac had finished blessing Jacob[a], and Jacob had just gone out from the presence of Isaac his father[b], Esau his brother came in from his hunting.
translation:
  language: te
  text: ఇస్సాకు యాకోబును దీవించడం ముగించగానే, యాకోబు తన తండ్రి ఇస్సాకు సమక్షం నుండి బయటికి వెళ్లాడో లేదో, అతని సోదరుడు ఏశావు తన వేట నుండి వచ్చాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ‘బయటికి వెళ్లడం—బయటికి వెళ్లాడు’ అనే బలపరిచే నిర్మాణం ఉంది. ఇది యాకోబు అప్పుడే వెళ్లిపోయాడనీ, అతని నిష్క్రమణకు ఏశావు రాకకు మధ్య దాదాపు విరామమే లేదనీ నొక్కిచెబుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: ఇలా జరిగింది
  rationale: కథనంలోని తదుపరి సంఘటనను పరిచయం చేసే హీబ్రూ రూపాన్ని, పాతకాలపు కృత్రిమ శైలి లేకుండా సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: כַּאֲשֶׁר כִּלָּה ... לְבָרֵךְ
  choice: దీవించడం ముగించగానే
  rationale: క్రియ పూర్తయినదానితోపాటు తదుపరి సంఘటన వెంటనే జరిగిన భావాన్ని సహజమైన తెలుగు కాలవాచక రూపంలో తెలియజేస్తుంది.
- source_word: אַךְ יָצֹא יָצָא
  choice: అప్పుడే బయటికి వెళ్లగా
  rationale: אַךְ మరియు ధాతురూప పునరుక్తి సూచించే అత్యంత సమీప కాలక్రమాన్ని తెలియజేస్తూ, యాకోబు వెళ్లడం పూర్తయిందనే భావాన్ని నిలుపుతుంది.
- source_word: מֵאֵת פְּנֵי
  choice: సమక్షం నుంచి
  rationale: అక్షరార్థంలోని ‘ముఖం ఎదుటి నుంచి’ అనే వ్యక్తిగత సన్నిధి భావాన్ని సహజమైన, గౌరవప్రదమైన తెలుగులో అందిస్తుంది.
- source_word: בָּא מִצֵּידוֹ
  choice: వేట నుంచి వచ్చాడు
  rationale: ציד ఇక్కడ వేట అనే కార్యకలాపాన్ని లేదా వేటాడిన దానిని సూచించగలదు; సందర్భంలో ఏశావు వేటకు వెళ్లి తిరిగి రావడం ప్రధానంగా ఉన్నందున ఈ రూపం సహజంగా ఉంటుంది.
theological_decisions: []
