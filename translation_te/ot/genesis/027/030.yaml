    issue: ‘అప్పుడే బయటికి వెళ్లగా’ కాలక్రమాన్ని అస్పష్టం చేస్తోంది.
    rationale: హీబ్రూలో infinitive absolute తో కూడిన క్రియ యాకోబు నిజంగా బయటికి వెళ్లిపోయిన చర్యను, అది ఏశావు రాకకు అత్యంత సమీపంలో జరిగిందని ఉద్ఘాటిస్తుంది. ‘వెళ్లగా’ అనేది సమకాలీన/అసంపూర్ణ చర్య భావాన్ని ఇవ్వవచ్చు.
