base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/007.yaml
  text: Bring me game and make me tasty food[b][a], so that I may eat and bless you before Yahweh before I die.’
translation:
  language: te
  text: ‘వేటమాంసం తెచ్చి, నాకు రుచికరమైన వంటకాలు[a] సిద్ధం చేయి. నేను తిని, యాహ్వే[b] సన్నిధిలో, నేను చనిపోకముందు నిన్ను ఆశీర్వదిస్తాను.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘రుచికరమైన ఆహారం.’ హీబ్రూ పదం ప్రత్యేకంగా సిద్ధం చేసిన రుచిగల వంటకాలను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: 'హీబ్రూ: ‘యాహ్వే.’ ఇది ఇశ్రాయేలు దేవుని వ్యక్తిగత నామం.'
    reason: divine_name
lexical_decisions:
- source_word: הָבִיאָה לִי צַיִד
  choice: వేటమాంసం తెచ్చి
  rationale: צַיִד వేటలో దొరికిన జంతువు లేదా దాని మాంసాన్ని సూచిస్తుంది. సందర్భంలో ఆహారం సిద్ధం చేయడం ఉద్దేశం కాబట్టి ‘వేటమాంసం’ సహజంగా, నిర్దిష్ట జంతువుకు పరిమితం కాకుండా అర్థాన్ని అందిస్తుంది.
- source_word: וַעֲשֵׂה לִי מַטְעַמִּים
  choice: నాకు రుచికరమైన వంటకాలు సిద్ధం చెయ్యి
  rationale: מַטְעַמִּים ప్రత్యేకంగా సిద్ధం చేసిన రుచికరమైన వంటకాలను సూచిస్తుంది; ఆహార సందర్భంలో עשהను ‘సిద్ధం చెయ్యి’ అని అనువదించడం సహజమైన తెలుగు.
- source_word: וְאֹכֵלָה וַאֲבָרֶכְכָה
  choice: నేను తిని ... నిన్ను ఆశీర్వదిస్తాను
  rationale: రెండు cohortative రూపాలు వక్త ఉద్దేశించిన వరుస చర్యలను తెలియజేస్తాయి. తెలుగు భాషలో ‘తిని ... ఆశీర్వదిస్తాను’ ఆ క్రమాన్నీ ఉద్దేశాన్నీ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לִפְנֵי יְהוָה
  choice: యెహోవా సన్నిధిలో
  rationale: לִפְנֵי అంటే ‘ఎదుట/సన్నిధిలో.’ ఇక్కడ ఆశీర్వాదం దేవుని సాక్షాత్ సన్నిధిలో జరుగుతుందనే భావాన్ని ‘సన్నిధిలో’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: לִפְנֵי מוֹתִי
  choice: చనిపోకముందే
  rationale: ‘నా మరణానికి ముందు’ అనే మూలార్థాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది; ‘-ఏ’ సందర్భంలోని అత్యవసరతను సున్నితంగా ప్రతిబింబిస్తుంది.
theological_decisions:
- issue: దైవనామం יהוה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: మూలపాఠంలో బిరుదు కాకుండా నాలుగు అక్షరాల దైవనామం నేరుగా ఉంది. తెలుగులో విస్తృతంగా గుర్తించదగిన నామరూపమైన ‘యెహోవా’ను ప్రధాన పాఠంలో ఉంచి, ఉచ్చారణకు దగ్గరైన ‘యాహ్వే’ను పాదటీపులో సూచించడం వ్యక్తినామ స్వభావాన్ని కాపాడుతుంది.
- issue: לִפְנֵי యొక్క భావం
  choice: సన్నిధిలో
  alternative: ఎదుట
  rationale: ఈ పదబంధం ఆశీర్వాదం దేవుని సన్నిధిలో లేదా ఆయన సాక్షిగా పలకబడుతుందనే భావాన్ని కలిగి ఉంది. మూలంలో లేనటువంటి ప్రత్యేక కర్మకాండ లేదా దేవుని ఆమోదాన్ని జోడించకుండా ‘సన్నిధిలో’ ఆ సంబంధాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడబడింది. ఇది రిబ్కా ఉటంకిస్తున్న మాటలోని ఆజ్ఞాత్మక ధోరణిని నిలుపుతూ ‘చెయ్యి’ అనే సాధారణ సంభాషణారూపాన్ని ఉపయోగిస్తుంది. అన్ని పాదటీపు గుర్తులు ప్రధాన పాఠంలో ఉన్నాయి.
