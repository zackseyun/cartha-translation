id: GEN.27.34
reference: Genesis 27:34
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּ/שְׁמֹ֤עַ עֵשָׂו֙ אֶת דִּבְרֵ֣י אָבִ֔י/ו וַ/יִּצְעַ֣ק צְעָקָ֔ה גְּדֹלָ֥ה וּ/מָרָ֖ה עַד מְאֹ֑ד וַ/יֹּ֣אמֶר לְ/אָבִ֔י/ו בָּרֲכֵ֥/נִי גַם אָ֖נִי אָבִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/034.yaml
  text: When Esau heard his father’s words[a], he cried out with an exceedingly great and bitter cry, and said to his father, “Bless me too, my father!”
translation:
  language: te
  text: ఏశావు తన తండ్రి మాటలు విన్నప్పుడు, అతడు ఎంతో పెద్దగా, చేదుగా కేక వేశాడు.[a] అప్పుడు అతడు తన తండ్రితో, “నన్ను కూడా ఆశీర్వదించు, నా తండ్రీ!” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత రూపానుగుణంగా: “అతడు అత్యంత గొప్పదైన, చేదైన కేకతో కేక వేశాడు.” హీబ్రూలో ఒకే ధాతువుకు చెందిన క్రియ, నామవాచకం కలిసి కేక తీవ్రతను నొక్కిచెబుతున్నాయి.'
    reason: హీబ్రూ సమానధాతు క్రియా-నామ నిర్మాణం మరియు దాని తీవ్రతను వివరిస్తుంది.
lexical_decisions:
- source_word: כִּשְׁמֹעַ
  choice: విన్నప్పుడు
  rationale: כִּי తో కూడిన క్రియానామ రూపం కాలసంబంధ పరిస్థితిని సూచిస్తుంది; ‘విన్నప్పుడు’ సహజంగా ఉండి తక్షణత్వాన్ని అవసరానికి మించి చేర్చదు.
- source_word: דִּבְרֵי אָבִיו
  choice: తన తండ్రి మాటలు
  rationale: דָּבָר యొక్క ‘మాటలు’ అనే ప్రాథమిక భావాన్ని నిలుపుతూ ఆధునిక తెలుగులో స్పష్టంగా ఉంది.
- source_word: וַיִּצְעַק צְעָקָה
  choice: కేక వేశాడు
  rationale: హీబ్రూలోని సమానధాతు క్రియా-నామ నిర్మాణం తీవ్రతను పెంచుతుంది. తెలుగులో ‘కేక వేశాడు’ సహజమైన సమానార్థక ప్రయోగం; తీవ్రతను అనుసరించే విశేషణాలు స్పష్టం చేస్తాయి.
- source_word: גְּדֹלָה
  choice: గొప్పదైన
  rationale: ‘గొప్ప/పెద్ద’ అనే విస్తృత తీవ్రతను నిలుపుతుంది; కేవలం శబ్దబలంగా మాత్రమే అర్థాన్ని కుదించదు.
- source_word: וּמָרָה
  choice: చేదైన
  rationale: మానసిక వేదనను వ్యక్తపరిచే ‘చేదు’ అనే మూల రూపకాన్ని నిలుపుతుంది.
- source_word: עַד מְאֹד
  choice: మిక్కిలి
  rationale: అత్యధిక తీవ్రతను సంక్షిప్తంగా, గౌరవప్రదమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: בָּרֲכֵנִי
  choice: నన్ను ఆశీర్వదించు
  rationale: ఏకవచన ఆజ్ఞారూపాన్నీ, మొదటి పురుష కర్మప్రత్యయాన్నీ నేరుగా నిలుపుతుంది.
- source_word: גַם אֲנִי
  choice: నన్ను కూడా
  rationale: ఏశావు తనకూ ఆశీర్వాదం కావాలని వేడుకుంటున్న భావాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: אָבִי
  choice: నా తండ్రీ
  rationale: హీబ్రూ స్వామ్య ప్రత్యయాన్ని, ప్రత్యక్ష సంబోధనలోని ఆర్తిని రెండింటినీ నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కథనంలో గౌరవప్రదమైన సరళ శైలి, ప్రత్యక్ష సంభాషణలో ఏశావు ఆర్తిని ప్రతిబింబించే సహజమైన సంబోధన. ప్రధాన పాఠ్యంలో సహజత్వం కోసం హీబ్రూ సమానధాతు నిర్మాణాన్ని తెలుగు నుడికారంగా ఇచ్చి, దాని రూపానుగుణ ప్రతిరూపాన్ని పాదటిప్పణిలో ఉంచాం.
