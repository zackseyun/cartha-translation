id: GEN.27.4
reference: Genesis 27:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/עֲשֵׂה לִ֨/י מַטְעַמִּ֜ים כַּ/אֲשֶׁ֥ר אָהַ֛בְתִּי וְ/הָבִ֥יאָ/ה לִּ֖/י וְ/אֹכֵ֑לָה בַּ/עֲב֛וּר תְּבָרֶכְ/ךָ֥ נַפְשִׁ֖/י בְּ/טֶ֥רֶם אָמֽוּת־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/004.yaml
  text: Prepare for me tasty food[a], just as I love, and bring it to me, that I may eat[c][b], so that my soul may bless you before I die.
translation:
  language: te
  text: నాకు ఇష్టమైన విధంగా రుచికరమైన వంటకాలు[a] సిద్ధం చేసి, నేను తినడానికి వాటిని నా దగ్గరకు తీసుకురా, నేను చనిపోకముందే నా ప్రాణం నిన్ను ఆశీర్వదించేలా[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘రుచికరమైన వంటకాలు’కు ‘రుచిగల ఆహారం’ లేదా ‘ప్రత్యేక వంటకాలు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా, “నా ప్రాణం నిన్ను ఆశీర్వదించునట్లు.” ఇది ఇస్సాకు తన సంపూర్ణ వ్యక్తిత్వంతో ఆశీర్వదించడాన్ని తెలిపే ప్రయోగం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲשֵׂה
  choice: సిద్ధం చేసి
  rationale: עָשָׂה సాధారణంగా ‘చేయు’ అని అర్థమిచ్చినా, వంట సందర్భంలో ‘సిద్ధం చేయు’ అనేది సహజమైన, సందర్భోచితమైన తెలుగు.
- source_word: מַטְעַמִּים
  choice: రుచికరమైన వంటకాలు
  rationale: ఈ బహువచన నామవాచకం ప్రత్యేకంగా తయారుచేసిన రుచిగల ఆహారాన్ని సూచిస్తుంది; ‘వంటకాలు’ బహువచన రూపాన్ని, ‘రుచికరమైన’ దాని లక్షణాన్ని స్పష్టంగా తెలియజేస్తాయి.
- source_word: כַּאֲשֶׁר אָהַבְתִּי
  choice: నాకు ఇష్టమైన విధంగా
  rationale: హీబ్రూ వాక్యం ఇస్సాకు వ్యక్తిగతంగా ఇష్టపడే రుచిని లేదా తయారీ విధానాన్ని సూచిస్తుంది. తెలుగు సహజత్వం కోసం ‘నాకు ఇష్టమైన విధంగా’ ఎంచుకోబడింది.
- source_word: וְהָבִיאָה לִּי
  choice: వాటిని నా దగ్గరికి తీసుకురా
  rationale: స్త్రీలింగ ఏకవచన ఆజ్ఞారూపం ముందున్న ఆహార సముదాయాన్ని సూచిస్తుంది; తెలుగులో ‘వాటిని’ అని బహువచన వంటకాలతో సహజ అన్వయం చేయబడింది.
- source_word: וְאֹכֵלָה
  choice: నేను తినడానికి
  rationale: కోహోర్టేటివ్ రూపం వక్త ఉద్దేశించిన తదుపరి చర్యను తెలియజేస్తుంది. ఆజ్ఞతో దాని సంబంధాన్ని తెలుగులో ఉద్దేశార్థకంగా వ్యక్తం చేశాం.
- source_word: בַּעֲבוּר
  choice: అప్పుడు
  rationale: మూలంలో ఇది అంతిమ ఉద్దేశాన్ని పరిచయం చేస్తుంది. తెలుగులో వరుసగా రెండు ఉద్దేశార్థక నిర్మాణాలు భారంగా కాకుండా ఉండేందుకు, చర్యల క్రమాన్నీ ఆశీర్వాద ఉద్దేశాన్నీ కలిపి తెలియజేసే ‘అప్పుడు’ వాడబడింది.
- source_word: תְּבָרֶכְךָ נַפְשִׁי
  choice: నా ప్రాణం నిన్ను ఆశీర్వదిస్తుంది
  rationale: נֶפֶשׁ అనే పదాన్ని తొలగించి కేవలం ‘నేను’ అని సరళీకరించకుండా, మూలంలోని స్పష్టమైన ‘నా ప్రాణం’ను నిలిపి ఉంచాం. ఇక్కడ అది ఇస్సాకు తన సంపూర్ణ వ్యక్తిత్వంతో చేసే ఆశీర్వాదాన్ని సూచిస్తుంది.
- source_word: בְּטֶרֶם אָמוּת
  choice: నేను చనిపోకముందే
  rationale: కాలసంబంధ ఉపవాక్యాన్ని నేరుగా, సహజమైన ఆధునిక తెలుగులో అందిస్తుంది; ‘ముందే’ సందర్భంలోని ఆవశ్యకతను కూడా ప్రతిబింబిస్తుంది.
theological_decisions:
- issue: ‘నా ప్రాణం’ అనే పదబంధంలో నֶפֶשׁ యొక్క భావం
  choice: మూలంలోని ‘నా ప్రాణం’ అనే వ్యక్తీకరణను ప్రధాన పాఠ్యంలో నిలిపి ఉంచడం
  alternative: ‘నేను నిన్ను ఆశీర్వదిస్తాను’ అని భావానువాదం చేయడం
  rationale: నֶפֶשׁ ఇక్కడ శరీరానికి వేరైన భాగంపై సిద్ధాంత ప్రకటన చేయడం కంటే ఇస్సాకు స్వయాన్నే, అతని సంపూర్ణ వ్యక్తిగత అస్తిత్వాన్ని సూచించే హీబ్రూ ప్రయోగం. అయినప్పటికీ మూలపదంలోని బలాన్ని చెరపకుండా దానిని నిలిపి, పాదటిప్పణిలో వివరించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, కుటుంబ సంభాషణకు తగిన ఏకవచన ఆజ్ఞారూపం ‘తీసుకురా’ వాడబడింది. భాష సాధారణ పాఠకునికి స్పష్టంగా ఉండేలా చేసినప్పటికీ, ‘నా ప్రాణం’ అనే మూలంలోని గంభీరమైన హీబ్రూ వ్యక్తీకరణను ఉద్దేశపూర్వకంగా నిలిపి ఉంచాం.
