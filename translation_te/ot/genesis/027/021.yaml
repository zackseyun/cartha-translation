source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יִצְחָק֙ אֶֽל יַעֲקֹ֔ב גְּשָׁ/ה נָּ֥א וַ/אֲמֻֽשְׁ/ךָ֖ בְּנִ֑/י הַֽ/אַתָּ֥ה זֶ֛ה בְּנִ֥/י עֵשָׂ֖ו אִם לֹֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/021.yaml
  text: Then Isaac said to Jacob[a], “Please come near, that I may feel you, my son, whether you are really my son Esau or not.”
translation:
  language: te
  text: అప్పుడు ఇస్సాకు యాకోబుతో[a], “నా కుమారుడా, దయచేసి దగ్గరికి రా; నువ్వు నిజంగా నా కుమారుడైన ఏశావువో కాదో నేను నిన్ను తడవి చూస్తాను” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దయచేసి దగ్గరికి రా; నా కుమారుడా, నువ్వు నిజంగా నా కుమారుడైన ఏశావువో కాదో నన్ను నిన్ను తడవి చూడనివ్వు.”
    reason: וַאֲמֻשְׁךָలోని సంకల్పార్థక/అనుమతి కోరే భావాన్ని మరింత ప్రత్యక్షంగా ప్రతిబింబించే నిర్మాణ ప్రత్యామ్నాయం.
lexical_decisions:
- source_word: גְּשָׁה נָּא
  choice: దయచేసి దగ్గరికి రా
  rationale: గְּשָׁה అనేది ‘దగ్గరికి రా’ అనే ఆజ్ఞ; נָּא దానికి మర్యాదపూర్వకమైన అభ్యర్థన భావాన్ని జోడిస్తుంది. ఈ రెండింటినీ సహజమైన ఆధునిక తెలుగులో ఈ పదబంధం తెలియజేస్తుంది.
- source_word: וַאֲמֻשְׁךָ
  choice: నేను నిన్ను తడవి చూస్తాను
  rationale: מושׁ అనే ధాతువు స్పర్శించి గుర్తించడం లేదా పరిశీలించడం అనే భావాన్ని ఇస్తుంది. ఇస్సాకు స్పర్శ ద్వారా గుర్తింపును పరీక్షిస్తున్న సందర్భంలో ‘తడవి చూస్తాను’ సహజంగా, స్పష్టంగా ఉంది; కేవలం ‘తాకుతాను’ కంటే పరిశీలన భావాన్ని మెరుగ్గా నిలుపుతుంది.
- source_word: בְּנִי
  choice: నా కుమారుడా
  rationale: ప్రథమ పురుష ఏకవచన ప్రత్యయంతో ఉన్న ప్రత్యక్ష సంబోధనను, దృశ్యంలోని కుటుంబ సంబంధ స్వరాన్ని కాపాడుతూ అనువదించింది.
- source_word: הַאַתָּה זֶה
  choice: నువ్వు నిజంగా … వో
  rationale: ఈ ప్రశ్నార్థక నిర్మాణం ఇస్సాకు సందేహంతో గుర్తింపును పరీక్షిస్తున్న భావాన్ని ఇస్తుంది. ‘నిజంగా’ ఆ పరిశీలనాత్మక అనిశ్చితిని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בְּנִי עֵשָׂו
  choice: నా కుమారుడు ఏశావు
  rationale: సంబంధాన్ని, ప్రశ్నించబడుతున్న నిర్దిష్ట వ్యక్తి పేరును రెండింటినీ నిలుపుతుంది.
- source_word: אִם לֹא
  choice: కాదో
  rationale: హీబ్రూ ప్రత్యామ్నాయ ప్రశ్నను తెలుగులో సహజమైన ‘…వో కాదో’ నిర్మాణంతో వ్యక్తం చేసింది.
- source_word: וַיֹּאמֶר
  choice: అప్పుడు … అన్నాడు
  rationale: వావ్-కన్సెక్యూటివ్ కథన క్రమాన్ని ముందుకు నడిపిస్తుంది; ‘అప్పుడు’ ఆ వరుసను సహజమైన తెలుగు కథనశైలిలో తెలియజేస్తుంది.
theological_decisions: []
