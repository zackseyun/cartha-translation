  source_fidelity: 'ముసాయిదా వాక్యం మొత్తం హీబ్రూ వాక్యార్థాన్ని సరిగ్గా అందిస్తుంది: ఇస్సాకు యాకోబును దగ్గరకు రమ్మని, స్పర్శ ద్వారా అతడు నిజంగా తన కుమారుడైన ఏశావేనా కాదా పరీక్షించాలనే ఉద్దేశాన్ని వ్యక్తం చేస్తున్నాడు. అయితే “నా కుమారుడు ఏశావు”కు “నా కుమారుడైన ఏశావు” అని చెప్పడం తెలుగులో మరింత స్పష్టమైన, సహజమైన అనుసంధానం.'
