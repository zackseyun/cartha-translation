base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/040.yaml
  text: And by your sword you shall live[a], and you shall serve your brother; but when you break loose, you shall break his yoke from off your neck.
translation:
  language: te
  text: 'నీ ఖడ్గం మీద ఆధారపడి నీవు జీవిస్తావు;

    నీ సహోదరునికి సేవ చేస్తావు.

    అయితే నీవు తిరగబడినప్పుడు[a],

    నీ మెడ మీదనుండి అతని కాడిని విరిచివేస్తావు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నీవు అశాంతికి లోనైనప్పుడు.’ תָּרִיד అనే హీబ్రూ క్రియ భావం క్లిష్టమైనది. తరువాత వచ్చే కాడిని విరిచివేయడం అనే సందర్భం ‘తిరగబడినప్పుడు’ అనే భావానికి మద్దతిస్తుంది; అయితే ‘అశాంతికి లోనైనప్పుడు’ అనే అర్థమూ సాధ్యమే.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל חַרְבְּךָ תִחְיֶה
  choice: నీ ఖడ్గం మీద ఆధారపడి నీవు జీవిస్తావు
  rationale: עַל ఇక్కడ సాధనార్థకంగా ఉంది—ఖడ్గం ద్వారా లేదా దానిపై ఆధారపడి జీవించడాన్ని సూచిస్తుంది. חֶרֶב అనే స్పష్టమైన ‘ఖడ్గం’ రూపకాన్ని నిలిపి ఉంచాం.
- source_word: וְאֶת אָחִיךָ תַּעֲבֹד
  choice: నీ సహోదరునికి సేవ చేస్తావు
  rationale: עבד అనే క్రియ యొక్క నేరమైన ‘సేవచేయు’ భావాన్ని ఉంచి, రాజకీయ ఆధీనత స్వరూపాన్ని అనవసరంగా మరింత నిర్దిష్టం చేయలేదు.
- source_word: וְהָיָה כַּאֲשֶׁר
  choice: అయితే ... చేసినప్పుడు
  rationale: భవిష్యత్తులో సంభవించే పరిస్థితినీ, ముందటి ఆధీనస్థితికి వ్యతిరేకమైన మలుపునీ సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: תָּרִיד
  choice: నీవు తిరగబడినప్పుడు
  rationale: ఈ క్లిష్టమైన క్రియకు, వెంటనే వచ్చే కాడిని విరిచివేయడం అనే సందర్భంలో బలవంతపు ప్రతిఘటన లేదా ఆధీనతనుండి విడిపోవడం సరిపోతుంది. ‘అశాంతికి లోనవడం’ అనే సాధ్యమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలిపాం.
- source_word: וּפָרַקְתָּ עֻלּוֹ
  choice: అతని కాడిని విరిచివేస్తావు
  rationale: פרק లోని బలంగా తొలగించే భావాన్నీ, עֹל అనే ప్రత్యక్ష ‘కాడి’ రూపకాన్నీ సంరక్షిస్తుంది.
- source_word: מֵעַל צַוָּארֶךָ
  choice: నీ మెడ మీదనుండి
  rationale: మూలంలోని భౌతిక రూపకాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా ఉంచుతుంది.
theological_decisions:
- issue: ఏశావు తన సహోదరునితో కలిగే భవిష్యత్ సంబంధ స్వభావం
  choice: మొదట సేవ లేదా ఆధీనత, తరువాత తిరుగుబాటు ద్వారా ఆ ఆధిపత్య కాడిని తొలగించడం
  alternative: దీనిని శాశ్వత దాస్యంగా గానీ, కేవలం కుటుంబపరమైన గౌరవంగా గానీ వ్యాఖ్యానించడం
  rationale: వచనం సహోదరునికి సేవచేయడాన్నీ, తరువాత అతని కాడిని విరిచివేయడాన్నీ రెండింటినీ చెబుతుంది. అందువల్ల తరువాతి ఎదోము చరిత్ర లేదా ఏదైనా విస్తృత సిద్ధాంతాన్ని వచనంలోకి తీసుకురాకుండా ఈ ఉద్రిక్తతను అలాగే ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనా సామాన్య పాఠకులకు అర్థమయ్యే శైలిని వాడాం. ‘ఖడ్గం,’ ‘కాడి’ అనే మూలంలోని స్పష్టమైన రూపకాలను నిలిపి, భావాన్ని ముందుగానే సిద్ధాంతపరంగా పరిష్కరించలేదు.
