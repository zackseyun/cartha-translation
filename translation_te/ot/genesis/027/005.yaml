  text: וְ/רִבְקָ֣ה שֹׁמַ֔עַת בְּ/דַבֵּ֣ר יִצְחָ֔ק אֶל עֵשָׂ֖ו בְּנ֑/וֹ וַ/יֵּ֤לֶךְ עֵשָׂו֙ הַ/שָּׂדֶ֔ה לָ/צ֥וּד צַ֖יִד לְ/הָבִֽיא־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/005.yaml
  text: Rebekah was listening when Isaac spoke to Esau his son[b][a], and Esau went to the field to hunt game and bring it back.
translation:
  language: te
  text: ఇస్సాకు తన కుమారుడైన ఏశావుతో మాట్లాడుతున్నప్పుడు రిబ్కా వింటూ ఉంది.[a] ఏశావు వేటాడి వేటమాంసాన్ని తీసుకురావడానికి పొలానికి వెళ్లాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఇస్సాకు తన కుమారుడైన ఏశావుతో మాట్లాడుతుండగా రిబ్కా విన్నది.” హీబ్రూ రూపం కొనసాగుతున్న వినడంగా గానీ, విన్నదిగా గానీ తెలుగులో వ్యక్తపరచవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: మరింత అక్షరార్థంగా, “వేటమాంసాన్ని వేటాడి తీసుకురావడానికి.” హీబ్రూలో ‘వేటాడడానికి,’ ‘తీసుకురావడానికి’ అనే రెండు ఉద్దేశార్థక రూపాలు ఉన్నాయి.
    reason: source_syntax
lexical_decisions:
- source_word: וְ/רִבְקָה
  choice: రిబ్కా
  rationale: వాక్యారంభంలోని וְ కథనాన్ని కొనసాగించే సంధిగా పనిచేస్తుంది. తెలుగులో ప్రత్యేకంగా ‘మరియు’ లేదా ‘ఇప్పుడు’ అని చేర్చకుండా వాక్యక్రమమే ఆ కొనసాగింపును సహజంగా తెలియజేస్తుంది.
- source_word: שֹׁמַעַת
  choice: వింటూ ఉంది
  rationale: హీబ్రూ వర్తమాన కృదంతం నేపథ్యంగా కొనసాగుతున్న వినడాన్ని సూచిస్తుంది; ‘వింటూ ఉంది’ ఆ కొనసాగుతున్న భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: בְּ/דַבֵּר
  choice: మాట్లాడుతున్నప్పుడు
  rationale: בְּ తో కూడిన క్రియార్థక నామరూపం సమకాలీన చర్యను సూచిస్తుంది. ఇస్సాకు మాట్లాడడం, రిబ్కా వినడం ఒకే సమయంలో జరుగుతున్నాయని ఈ రూపం స్పష్టం చేస్తుంది.
- source_word: בְּנ֑/וֹ
  choice: తన కుమారుడైన
  rationale: ప్రత్యయార్థమైన ‘అతని కుమారుడు’ను తెలుగులో కర్త అయిన ఇస్సాకుతో స్పష్టంగా అనుసంధానించడానికి ‘తన కుమారుడైన’ అని సహజంగా అనువదించబడింది.
- source_word: הַ/שָּׂדֶה
  choice: పొలానికి
  rationale: שׂדה కు ప్రాథమిక అర్థం ‘పొలం/బయలు’. సందర్భంలో వేట కోసం వెళ్లే బహిరంగ ప్రదేశాన్ని ‘పొలం’ నేరుగా ప్రతిబింబిస్తుంది.
- source_word: לָ/צ֥וּד צַ֖יִד
  choice: వేటాడి వేటమాంసం
  rationale: צוד క్రియ వేటాడడాన్ని, ציד వేటలో దొరికిన జంతువును లేదా దాని ఆహారాన్ని సూచిస్తుంది. తెలుగు కథన సందర్భంలో ‘వేటమాంసం’ సహజంగా ఉండి, ‘జింకమాంసం’ వంటి అనవసర జాతి పరిమితిని విధించదు.
- source_word: לְ/הָבִיא
  choice: తీసుకురావడానికి
  rationale: ఈ క్రియార్థక రూపం ఉద్దేశాన్ని సూచిస్తుంది; ఏశావు వేటలో దొరికినదాన్ని తిరిగి తీసుకురావాలనే భావాన్ని సహజంగా వ్యక్తపరుస్తుంది.
