translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. ‘వేటమాంసం’ సాధారణ పాఠకునికి అర్థమయ్యేలా ఉండి, మూలంలోని జంతుజాతి అనిర్దిష్టతను కాపాడుతుంది.
