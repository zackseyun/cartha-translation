  yaml_path: translation/ot/genesis/027/031.yaml
  text: He too prepared tasty food and brought it to his father[a], and he said to his father, “Let my father rise and eat of his son's game[b], so that your soul may bless me.”
translation:
  language: te
  text: అతడు కూడా రుచికరమైన వంటకాలు[a] సిద్ధం చేసి వాటిని తన తండ్రి దగ్గరికి తీసుకొచ్చాడు. అతడు తన తండ్రితో, “నా తండ్రి లేచి, తన కుమారుడు వేటాడి తెచ్చిన మాంసం తినాలి; తద్వారా నీ ప్రాణం[b] నన్ను ఆశీర్వదించాలి” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘రుచికరమైన ఆహారం’ అని కూడా అనువదించవచ్చు. ఇక్కడి హీబ్రూ పదం ప్రత్యేకంగా తయారుచేసిన, రుచికరమైన వంటకాలను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ అక్షరార్థం ‘నీ ప్రాణం నన్ను ఆశీర్వదించాలి.’ ఇది ‘నీవు నన్ను ఆశీర్వదించాలి’ అనే అర్థాన్నిచ్చే ప్రయోగం కావచ్చు; ప్రధాన పాఠ్యం హీబ్రూ వ్యక్తీకరణను నిలుపుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַטְעַמִּים
  choice: రుచికరమైన వంటకాలు
  rationale: ఈ సందర్భంలో ప్రత్యేకంగా తయారుచేసిన రుచికరమైన ఆహార పదార్థాలను సూచిస్తుంది. ‘వంటకాలు’ అనే బహువచనం హీబ్రూ రూపాన్ని ప్రతిబింబిస్తూ ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: גַּם הוּא
  choice: అతడు కూడా
  rationale: యాకోబు ఇంతకుముందు చేసిన పనికి ఏశావు చేసిన పనిని సమాంతరంగా చూపే అదనపు ఉద్ఘాటనను నిలుపుతుంది.
- source_word: יָקֻם אָבִי
  choice: నా తండ్రి లేచి
  rationale: జుస్సివ్ రూపంలోని మర్యాదపూర్వక అభ్యర్థనను, కుమారుడు తండ్రిని మూడవ పురుషంలో సంబోధించే హీబ్రూ విధానాన్ని నిలుపుతుంది.
- source_word: מִצֵּיד בְּנוֹ
  choice: తన కుమారుడు వేటాడి తెచ్చిన మాంసం
  rationale: צַיִד సాధారణ ఆహారం కాకుండా వేటలో సంపాదించిన జంతుమాంసాన్ని సూచిస్తుంది. తెలుగులో సందర్భం స్పష్టంగా ఉండేందుకు క్రియాత్మకంగా అనువదించబడింది.
- source_word: בַּעֲבוּר
  choice: అప్పుడు
  rationale: భోజనం చేయడం ఆశీర్వాదానికి దారితీసే ఉద్దేశాన్ని తెలుగులో సహజమైన వాక్యసంబంధంతో తెలియజేస్తుంది; భావం ‘దాంతో/ఆ ఉద్దేశంతో’ అన్నది.
- source_word: תְּבָרֲכַנִּי נַפְשֶׁךָ
  choice: నీ ప్రాణం నన్ను ఆశీర్వదించాలి
  rationale: נֶפֶשׁ అనే స్పష్టమైన మూలపదాన్ని తొలగించకుండా, కోరుకున్న ఆశీర్వాదాన్ని తెలిపే క్రియారూపాన్ని నిలుపుతుంది.
- source_word: וַיָּבֵא לְאָבִיו
  choice: తన తండ్రి దగ్గరికి తీసుకొచ్చాడు
  rationale: హీబ్రూలో కర్మ సందర్భం ద్వారా అర్థమవుతుంది; తెలుగులో ముందు పేర్కొన్న వంటకాలే కర్మగా సహజంగా గ్రహించబడతాయి.
theological_decisions:
- issue: נַפְשֶׁךָ అనే వ్యక్తీకరణను వ్యక్తివాచక సర్వనామంగా సరళీకరించాలా
  choice: ‘నీ ప్రాణం’ అని మూలంలోని రూపకాన్ని ప్రధాన పాఠ్యంలో నిలుపడం
  alternative: ‘నీవు నన్ను ఆశీర్వదించాలి’
  rationale: హీబ్రూ నేరుగా ‘నీ ప్రాణం’ అని చెబుతుంది. అది సందర్భంలో ‘నీవు’ అనే అర్థంలో వాడినప్పటికీ, ఆశీర్వాద దృశ్యంలోని గంభీరతనూ మూలభాషా ఉద్వేగాన్నీ నిలుపేందుకు అక్షరార్థ రూపాన్ని ఉంచి, ప్రయోగార్థాన్ని పాదటిప్పణిలో వివరించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. తండ్రిని మూడవ పురుషంలో సంబోధించే మూలభాషా మర్యాదా రూపం ఉద్దేశపూర్వకంగా నిలుపబడింది; అతిగా ప్రాచీనమైన పదజాలాన్ని నివారించాం.
