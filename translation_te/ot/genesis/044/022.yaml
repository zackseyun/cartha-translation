id: GEN.44.22
reference: Genesis 44:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/נֹּ֨אמֶר֙ אֶל אֲדֹנִ֔/י לֹא יוּכַ֥ל הַ/נַּ֖עַר לַ/עֲזֹ֣ב אֶת אָבִ֑י/ו וְ/עָזַ֥ב אֶת אָבִ֖י/ו וָ/מֵֽת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/022.yaml
  text: And we said to my lord[a], ‘The boy cannot leave his father, for if he should leave his father, he would die.’
translation:
  language: te
  text: మేము నా ప్రభువుతో, “ఆ బాలుడు తన తండ్రిని విడిచి వెళ్లలేడు; అతడు తన తండ్రిని విడిచి వెళితే, తండ్రి చనిపోతాడు” అని చెప్పాము.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత అక్షరార్థంగా: “అతడు తన తండ్రిని విడిచి వెళ్తాడు, మరణిస్తాడు.” హీబ్రూలో “మరణిస్తాడు” అనే క్రియకు కర్తను స్పష్టంగా పేర్కొనలేదు; సందర్భం అది తండ్రిని సూచిస్తుందని తెలియజేస్తుంది.'
    reason: మూలంలోని షరతు సంబంధం మరియు చివరి క్రియకు స్పష్టంగా పేర్కొనని కర్తను నమోదు చేయడం.
lexical_decisions:
- source_word: וַנֹּאמֶר
  choice: మేము ... చెప్పాము
  rationale: క్రమంగా సాగుతున్న కథనంలో 1వ పురుష బహువచన మాటను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אֶל אֲדֹנִי
  choice: నా ప్రభువుతో
  rationale: యోసేపును గౌరవంగా సంబోధిస్తున్న రాజసభా సందర్భానికి ‘నా ప్రభువు’ తగినది; ఇక్కడ అధిక సేవకత్వ భావాన్ని చేర్చదు.
- source_word: לֹא יוּכַל
  choice: ఉండలేడు
  rationale: יכולת లేకపోవడాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది; ‘విడిచి ఉండలేడు’ అనే మొత్తం పదబంధంలో మూలంలోని అసమర్థత భావం నిలుస్తుంది.
- source_word: הַנַּעַר
  choice: ఆ బాలుడు
  rationale: נַעַר యువకుడు లేదా బాలుడు అనే పరిధిని కలిగి ఉన్నా, తండ్రిపై ఆధారపడిన కుమారునిగా బెన్యామీను గురించి మాట్లాడుతున్న ఈ సందర్భంలో ‘బాలుడు’ కుటుంబ సంబంధిత దృక్కోణాన్ని ప్రతిబింబిస్తుంది.
- source_word: לַעֲזֹב
  choice: విడిచి ఉండడం
  rationale: ఇక్కడ עזב నైతికంగా త్యజించడం కంటే ఒకరిని విడిచి దూరంగా ఉండడాన్ని సూచిస్తుంది.
- source_word: אָבִיו
  choice: తన తండ్రి
  rationale: స్వాధీన సంబంధాన్ని స్పష్టంగా చూపుతూ, హీబ్రూలో ఉన్న పునరుక్తిని తెలుగులోనూ నిలుపుతుంది.
- source_word: וְעָזַב
  choice: విడిచిపెడితే
  rationale: ముందున్న అసమర్థత ప్రకటన తరువాత ఈ క్రియ సందర్భానుసారంగా షరతును వ్యక్తం చేస్తుంది; తెలుగులో ‘-తే’ రూపం ఆ సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וָמֵת
  choice: తండ్రి చనిపోతాడు
  rationale: క్రియలో కర్త స్పష్టంగా లేకపోయినా, సమీప సందర్భం చనిపోయేది తండ్రేనని సూచిస్తుంది. ప్రధాన పాఠ్యంలో స్పష్టతనిచ్చి, మూలంలోని కర్త-అస్పష్టతను పాదసూచికలో నిలిపాం.
theological_decisions:
- issue: וָמֵת అనే క్రియకు అంతర్లీన కర్త ఎవరు?
  choice: ప్రధాన పాఠ్యంలో ‘తండ్రి చనిపోతాడు’
  alternative: ‘అతడు చనిపోతాడు’ లేదా అక్షరార్థంగా కర్తను నిర్దిష్టం చేయని రూపం
  rationale: ఆదికాండము 44లోని సమీప సందర్భం, ముఖ్యంగా తండ్రి దుఃఖంతో చనిపోతాడనే వాదన, తండ్రినే సూచిస్తుంది. అయినప్పటికీ హీబ్రూ క్రియ కర్తను పేరుతో చెప్పనందున ఆ నిజమైన వ్యాకరణ అస్పష్టతను పాదసూచికలో తెలియజేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన, సాధారణ పాఠకులకు సులభమైన శైలి. ‘నా ప్రభువు’ రాజసభా మర్యాదను నిలుపుతుంది; ‘బాలుడు’ కుటుంబ సందర్భంలోని సాన్నిహిత్యాన్ని ప్రతిబింబిస్తుంది.
