- from: మేము నా ప్రభువుతో, “ఆ బాలుడు తన తండ్రిని విడిచి ఉండలేడు; అతడు తన తండ్రిని విడిచిపెడితే, తండ్రి చనిపోతాడు” అని చెప్పాము.[a]
  to: మేము నా ప్రభువుతో, “ఆ బాలుడు తన తండ్రిని విడిచి వెళ్లలేడు; అతడు తన తండ్రిని విడిచి వెళితే, తండ్రి చనిపోతాడు” అని చెప్పాము.[a]
  rationale: Departure is rendered with the idiomatic and semantically direct Telugu expressions ‘విడిచి వెళ్లలేడు’ and ‘విడిచి వెళితే.’ The main text retains the contextually warranted identification of the father as the one who dies, while the footnote now accurately preserves and explains the Hebrew’s grammatical non-specification of that final subject.
