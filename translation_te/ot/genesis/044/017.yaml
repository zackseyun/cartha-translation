source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר חָלִ֣ילָ/ה לִּ֔/י מֵ/עֲשׂ֖וֹת זֹ֑את הָ/אִ֡ישׁ אֲשֶׁר֩ נִמְצָ֨א הַ/גָּבִ֜יעַ בְּ/יָד֗/וֹ ה֚וּא יִהְיֶה לִּ֣/י עָ֔בֶד וְ/אַתֶּ֕ם עֲל֥וּ לְ/שָׁל֖וֹם אֶל אֲבִי/כֶֽם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/017.yaml
  text: But he said[a], "Far be it from me to do this. The man in whose hand the cup was found—he shall be my servant[b], but you may go up in peace to your father."
translation:
  language: te
  text: అయితే అతడు, “నేను అలా చేయనే చేయను! ఎవరి చేతిలో ఆ పానపాత్ర దొరికిందో అతడే నాకు బానిసగా[a] ఉంటాడు. మీరైతే క్షేమంగా మీ తండ్రి దగ్గరికి వెళ్లండి” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘సేవకుడిగా’ అని కూడా అనువదించవచ్చు. עָבֶד అనే హీబ్రూ పదం సేవకుణ్ణి లేదా బానిసను సూచించగలదు; ఇక్కడ శిక్షగా విధించే బంధిత సేవ సందర్భం వల్ల ‘బానిస’ అని అనువదించబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָלִילָה לִּי מֵעֲשׂוֹת זֹאת
  choice: నేను అలా చేయనే చేయను!
  rationale: బలమైన నిరాకరణను తెలిపే హీబ్రూ నుడికారాన్ని సహజమైన ఆధునిక తెలుగులో దాని తీవ్రత తగ్గకుండా వ్యక్తం చేస్తుంది.
- source_word: הָאִישׁ אֲשֶׁר נִמְצָא הַגָּבִיעַ בְּיָדוֹ
  choice: ఎవరి చేతిలో ఆ పాత్ర దొరికిందో
  rationale: ‘అతని చేతిలో’ అనే హీబ్రూ భాషలోని స్పష్టమైన రూపకాన్ని నిలుపుతూ, తెలుగులో సహజంగా ఉంది. సందర్భంలో גָּבִיעַ ఒక ప్రత్యేకమైన పాత్రను సూచిస్తుంది.
- source_word: הוּא יִהְיֶה לִּי עָבֶד
  choice: అతడే నాకు బానిసగా ఉంటాడు
  rationale: ఇక్కడ దొంగతనానికి శిక్షగా విధించే బంధిత సేవ ఉద్దేశించబడింది కాబట్టి ‘బానిస’ సందర్భ బలాన్ని స్పష్టంగా చూపుతుంది; అయితే మూలపదానికి ‘సేవకుడు’ అనే విస్తృత అర్థం కూడా ఉంది.
- source_word: וְאַתֶּם עֲלוּ לְשָׁלוֹם אֶל אֲבִיכֶם
  choice: మీరైతే క్షేమంగా మీ తండ్రి దగ్గరికి వెళ్లండి
  rationale: ఒక్కడు బానిసగా ఉండడానికి, మిగిలినవారు సురక్షితంగా వెళ్లిపోవడానికి మధ్యనున్న వ్యత్యాసాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది. ‘క్షేమంగా’ לְשָׁלוֹם భావాన్ని అందిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గంభీరమైన సంభాషణ శైలి ఉపయోగించబడింది. హీబ్రూ నుడికారంలోని బలమైన నిరాకరణ సహజ తెలుగు రూపంలో ఇవ్వబడింది; ‘చేతిలో’ అనే మూలభాషా రూపం అలాగే నిలుపబడింది.
