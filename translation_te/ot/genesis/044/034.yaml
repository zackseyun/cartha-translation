  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּי אֵיךְ֙ אֶֽעֱלֶ֣ה אֶל אָבִ֔/י וְ/הַ/נַּ֖עַר אֵינֶ֣/נּוּ אִתִּ֑/י פֶּ֚ן אֶרְאֶ֣ה בָ/רָ֔ע אֲשֶׁ֥ר יִמְצָ֖א אֶת אָבִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/034.yaml
  text: For how can I go up to my father if the boy is not with me? Otherwise, I would have to see the disaster that would come upon my father.
translation:
  language: te
  text: ఆ బాలుడు నాతో లేకపోతే నేను నా తండ్రి దగ్గరికి ఎలా వెళ్లగలను? లేకపోతే, నా తండ్రికి కలిగే ఆపదను నేను చూడవలసి వస్తుంది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֶעֱלֶה
  choice: వెళ్లగలను
  rationale: హీబ్రూలో అక్షరార్థంగా ‘పైకి వెళ్లడం’ ఉన్నా, ఇక్కడ తండ్రి దగ్గరికి తిరిగి వెళ్లడాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: הַנַּעַר
  choice: ఆ బాలుడు
  rationale: సందర్భంలో బెన్యామీనును సూచించే సాధారణ పదం; ‘యువకుడు’ కూడా సాధ్యమే గాని కుటుంబ సందర్భంలో ‘బాలుడు’ సహజంగా ఉంది.
- source_word: בָרָע
  choice: ఆపదను
  rationale: רָעָה ఇక్కడ నైతిక చెడుకన్నా తండ్రికి వాటిల్లే విపత్తు లేదా దురవస్థను సూచిస్తుంది.
- source_word: יִמְצָא אֶת אָבִי
  choice: నా తండ్రికి సంభవించే
  rationale: ‘నా తండ్రిని కనుగొనే/చేరే’ అనే హీబ్రూ ప్రయోగాన్ని సహజ తెలుగులో ‘సంభవించే’గా అందిస్తుంది.
theological_decisions:
- issue: פֶּן యొక్క భావం మరియు యూదా భయాన్ని వ్యక్తం చేసే విధానం
  choice: నేను చూడవలసి వస్తుందేమో
  alternative: నేను చూడకుండా ఉండేందుకు / లేకపోతే నేను చూడవలసి వస్తుంది
  rationale: פֶּן సాధారణంగా భయపడే లేదా నివారించదలచిన పరిణామాన్ని సూచిస్తుంది. ఈ సందర్భంలో యూదా తన తండ్రికి కలిగే ఆపదను చూడాల్సి వస్తుందనే భయాన్ని తెలుపుతున్నాడు; దానిని ఖచ్చిత పరిణామంగా అతిగా నిర్ణయించకుండా తెలుగు వాక్యం ఉద్వేగాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; యూదా వేడుకోలులోని ఆవేదనను గౌరవప్రదమైన, సాధారణ పాఠకులకు స్పష్టమైన భాషలో నిలుపుకుంది.
