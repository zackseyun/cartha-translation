translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ప్రత్యక్ష సంభాషణలో యాకోబు తన ఇంటివారిని కలుపుకొని చెప్పిన భావాన్ని ‘మన కోసం’ ద్వారా వ్యక్తం చేశాం; కథకుడి పరిచయంలో మాత్రం ‘మా తండ్రి’ ఉంచాం.
