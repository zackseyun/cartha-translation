base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/025.yaml
  text: Then our father said[a], ‘Go back; buy us a little food.’
translation:
  language: te
  text: అప్పుడు మా తండ్రి, “మీరు తిరిగి వెళ్లి మన కోసం కొంచెం ఆహారం కొనండి” అని చెప్పాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “తిరిగి వెళ్లి మన కోసం కొంచెం ధాన్యం కొనండి.” హీబ్రూలో సాధారణంగా ‘ఆహారం’ అనే పదం ఉంది; అయితే విస్తృత సందర్భం ధాన్యానికి సంబంధించినది.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... చెప్పాడు
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది; ‘అప్పుడు’ సంఘటనల క్రమాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: אָבִינוּ
  choice: మా తండ్రి
  rationale: ఇక్కడ ఇది సహోదరుల ప్రత్యక్ష తండ్రియైన యాకోబును సూచిస్తుంది.
- source_word: שֻׁבוּ
  choice: తిరిగి వెళ్లి
  rationale: వారు మళ్లీ ఐగుప్తుకు వెళ్లాలని ఆజ్ఞాపిస్తున్న సందర్భంలో దిశాత్మక భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: שִׁבְרוּ
  choice: కొనండి
  rationale: యోసేపు కథనంలో ఈ క్రియ ఆహారం లేదా ధాన్యం కొనడాన్ని సూచిస్తుంది; వెంటనే אֹכֶל ఉన్నందున క్రియలోనే ‘ధాన్యం’ అని చేర్చలేదు.
- source_word: לָנוּ
  choice: మన కోసం
  rationale: ప్రయోజనార్థక భావాన్ని స్పష్టమైన, సహజమైన తెలుగులో తెలియజేస్తుంది; తండ్రి తనతోపాటు కుమారులను కూడా కలుపుకొని మాట్లాడుతున్నందున ఉద్ధరణలో ‘మన’ సరిపోతుంది.
- source_word: מְעַט
  choice: కొంచెం
  rationale: తక్కువ పరిమాణాన్ని సాధారణ ఆధునిక తెలుగులో సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: אֹכֶל
  choice: ఆహారం
  rationale: హీబ్రూ పదం సాధారణంగా ‘ఆహారం’ అనే విస్తృత అర్థం కలది; సందర్భంలో ధాన్యం ఉద్దేశించబడినా ప్రధాన పాఠంలో అర్థాన్ని సంకుచితం చేయలేదు.
