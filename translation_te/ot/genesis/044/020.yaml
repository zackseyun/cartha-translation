source:
  edition: WLC
  text: וַ/נֹּ֨אמֶר֙ אֶל אֲדֹנִ֔/י יֶשׁ לָ֨/נוּ֙ אָ֣ב זָקֵ֔ן וְ/יֶ֥לֶד זְקֻנִ֖ים קָטָ֑ן וְ/אָחִ֨י/ו מֵ֜ת וַ/יִּוָּתֵ֨ר ה֧וּא לְ/בַדּ֛/וֹ לְ/אִמּ֖/וֹ וְ/אָבִ֥י/ו אֲהֵבֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/020.yaml
  text: And we said to my lord[a], ‘We have an elderly father, and a young son born in his old age. His brother is dead, so he alone is left of his mother[c][b], and his father loves him.’
translation:
  language: te
  text: మేము మా ప్రభువుతో, ‘మాకు వృద్ధుడైన తండ్రి ఉన్నాడు; ఆయన ముసలితనంలో పుట్టిన చిన్న కుమారుడు కూడా ఉన్నాడు.[a] అతని సోదరుడు చనిపోయాడు. అతని తల్లికి మిగిలిన కుమారుడు ఇతడొక్కడే; ఇతని తండ్రి ఇతన్ని ప్రేమిస్తున్నాడు’ అని చెప్పాము.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “ముసలితనపు బిడ్డ.” అంటే, తండ్రి ముదిరిన వయస్సులో పుట్టిన కుమారుడు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנִי
  choice: మా ప్రభువు
  rationale: ఉన్నత అధికారస్థానంలో ఉన్న యోసేపును గౌరవంగా సంబోధించే పదం. ‘అయ్యా’ కంటే ‘మా ప్రభువు’ మూలంలోని సామాజిక అంతరాన్ని, కథనంలో పునరావృతమయ్యే సంబోధనను స్పష్టంగా నిలుపుతుంది.
- source_word: זָקֵן
  choice: వృద్ధుడైన
  rationale: తండ్రి ముదిరిన వయస్సును సహజమైన, గౌరవప్రదమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: יֶלֶד זְקֻנִים קָטָן
  choice: ఆయన ముసలితనంలో పుట్టిన చిన్న కుమారుడు
  rationale: ‘ముసలితనపు బిడ్డ’ అనే హీబ్రూ నుడికార భావాన్ని తెలుగులో స్పష్టంగా వ్యక్తపరుస్తూ, קָטָן సూచించే చిన్న వయస్సును కూడా ‘చిన్న’ ద్వారా నిలుపుతుంది.
- source_word: וְאָחִיו מֵת
  choice: అతని సోదరుడు చనిపోయాడు
  rationale: אָחִיו వయోక్రమాన్ని స్వయంగా చెప్పదు కాబట్టి ‘అన్న’ అని విశదీకరించకుండా ‘సోదరుడు’ అని అనువదించబడింది; మరణం ప్రస్తుత పరిస్థితికి కారణమైన గత సంఘటనగా సహజ తెలుగులో చెప్పబడింది.
- source_word: וַיִּוָּתֵר הוּא לְבַדּוֹ לְאִמּוֹ
  choice: అతని తల్లికి మిగిలిన కుమారుడు ఇతడొక్కడే
  rationale: లామెద్ సంబంధార్థాన్ని సహజ తెలుగులో వ్యక్తపరుస్తూ, ఇతడు తల్లి సంరక్షణలో వదిలివేయబడ్డాడనే అపార్థాన్ని నివారించి, ఆమెకు మిగిలిన ఏకైక కుమారుడనే భావాన్ని తెలియజేస్తుంది.
- source_word: וְאָבִיו אֲהֵבוֹ
  choice: ఇతని తండ్రి ఇతన్ని ప్రేమిస్తున్నాడు
  rationale: אהב అనే క్రియలోని ప్రత్యక్ష ప్రేమభావాన్ని, కొనసాగుతున్న ప్రస్తుత సంబంధంగా సహజంగా తెలియజేస్తుంది.
