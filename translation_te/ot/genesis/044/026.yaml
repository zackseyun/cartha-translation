  text: וַ/נֹּ֕אמֶר לֹ֥א נוּכַ֖ל לָ/רֶ֑דֶת אִם יֵשׁ֩ אָחִ֨י/נוּ הַ/קָּטֹ֤ן אִתָּ֨/נוּ֙ וְ/יָרַ֔דְנוּ כִּי לֹ֣א נוּכַ֗ל לִ/רְאוֹת֙ פְּנֵ֣י הָ/אִ֔ישׁ וְ/אָחִ֥י/נוּ הַ/קָּטֹ֖ן אֵינֶ֥/נּוּ אִתָּֽ/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/026.yaml
  text: But we said[a], ‘We cannot go down. If our youngest brother is with us, then we will go down[c][b], for we cannot see the man's face unless our youngest brother is with us.’
translation:
  language: te
  text: కాని మేము, “మేము దిగివెళ్లలేము. మా చిన్న తమ్ముడు మాతో ఉంటే, మేము దిగివెళ్తాము. ఎందుకంటే మా చిన్న తమ్ముడు మాతో లేకపోతే ఆ మనిషి ముఖం చూడలేము[a]” అని చెప్పాము.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ మూలంలో అక్షరార్థంగా, “ఆ మనిషి ముఖం చూడడం.” ఇది అతని ఎదుట హాజరుకావడం లేదా అతని సన్నిధికి రావడం అనే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנֹּאמֶר
  choice: కాని మేము … అని చెప్పాము
  rationale: వావ్ కథనాన్ని కొనసాగిస్తుంది; పూర్వపు ఆజ్ఞకు వారి ప్రతిస్పందనలోని స్వల్ప వ్యతిరేకతను తెలుగులో ‘కాని’ సహజంగా తెలియజేస్తుంది.
- source_word: לֹא נוּכַל לָרֶדֶת
  choice: మేము దిగివెళ్లలేము
  rationale: יכל సామర్థ్యాన్ని సూచిస్తుంది; ירד ఐగుప్తుకు ‘దిగివెళ్లడం’ అనే భౌగోళిక భావాన్ని నిలుపుతుంది.
- source_word: אִם יֵשׁ אָחִינוּ הַקָּטֹן אִתָּנוּ וְיָרַדְנוּ
  choice: మా తమ్ముడు మాతో ఉంటేనే మేము దిగివెళ్తాము
  rationale: సానుకూల షరతు మరియు దాని ఫలితాన్ని సహజమైన తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది. కుటుంబ సందర్భంలో הַקָּטֹן అంటే చిన్నవయస్కుడైన తమ్ముడు.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: వారు దిగివెళ్లలేమని చెప్పడానికి వచ్చే కారణాన్ని స్పష్టంగా పరిచయం చేస్తుంది.
- source_word: לִרְאוֹת פְּנֵי הָאִישׁ
  choice: ఆ మనిషి ముఖం చూడడం
  rationale: హీబ్రూ మూలంలోని ‘మనిషి ముఖం చూడడం’ అనే స్పష్టమైన రూపకాన్ని నిలుపుతుంది; సందర్భంలో అతని సన్నిధికి రావడం అనే నుడికారార్థం ఉంది.
- source_word: וְאָחִינוּ הַקָּטֹן אֵינֶנּוּ אִתָּנוּ
  choice: మా తమ్ముడు మాతో లేకపోతే
  rationale: హీబ్రూలో వావ్‌తో సమన్వయమైన ఉపవాక్యం ఉన్నా, దాని పరిస్థితిజన్య భావాన్ని తెలుగులో ‘లేకపోతే’ సహజంగా తెలియజేస్తుంది.
