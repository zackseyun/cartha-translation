- from: కాని మేము, “మేము దిగివెళ్లలేము. మా తమ్ముడు మాతో ఉంటేనే మేము దిగివెళ్తాము; ఎందుకంటే మా తమ్ముడు మాతో లేకపోతే ఆ మనిషి ముఖం చూడలేము[a]” అని చెప్పాము.
