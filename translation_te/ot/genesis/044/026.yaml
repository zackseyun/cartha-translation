translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘దిగివెళ్లడం’ ద్వారా మూలంలోని భౌగోళిక దిశను, ‘ఆ మనిషి ముఖం చూడడం’ ద్వారా హీబ్రూ నుడికార చిత్రాన్ని నిలిపాం. పునరుక్తిని తొలగించకుండా మూల వాక్యంలోని షరతు–ఫలిత నిర్మాణాన్ని తెలుగులో సులభంగా వినిపించేలా తీర్చిదిద్దాం.
