  text: וַ/יֹּאמְר֣וּ אֵלָ֔י/ו לָ֚/מָּה יְדַבֵּ֣ר אֲדֹנִ֔/י כַּ/דְּבָרִ֖ים הָ/אֵ֑לֶּה חָלִ֨ילָ/ה֙ לַ/עֲבָדֶ֔י/ךָ מֵ/עֲשׂ֖וֹת כַּ/דָּבָ֥ר הַ/זֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/007.yaml
  text: And they said to him[b][a], “Why does my lord speak words like these? Far be it from your servants to do such a thing.”
translation:
  language: te
  text: వారు అతనితో, “నా యజమానీ[b], మీరు ఇలాంటి మాటలు[a] ఎందుకు మాట్లాడుతున్నారు? మీ సేవకులమైన మేము అలాంటి పని చేయడం దూరం గాక!” అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఈ విధమైన మాటలు.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “నా ప్రభువా”; ఇక్కడ ఇది ఒక మనిషిని గౌరవంగా సంబోధించే మాట.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ אֵלָיו
  choice: వారు అతనితో … అన్నారు
  rationale: కథన క్రమంలో వచ్చిన వారి ప్రత్యుత్తరాన్ని సహజమైన తెలుగు ప్రత్యక్ష వాక్య నిర్మాణంలో వ్యక్తం చేస్తుంది; אֵלָיו లోని ‘అతనితో’ భావాన్ని నిలుపుతుంది.
- source_word: לָמָּה יְדַבֵּר
  choice: ఎందుకు మాట్లాడుతున్నారు?
  rationale: ప్రశ్నలోని ప్రత్యక్షతను కాపాడుతూ, గౌరవ సంబోధనకు తగిన ఆధునిక తెలుగు బహువచన క్రియారూపాన్ని వాడుతుంది.
- source_word: אֲדֹנִי
  choice: నా యజమాని
  rationale: ఇక్కడ ఇది దేవుని బిరుదు కాదు; యోసేపు గృహనిర్వాహకునికి చేసిన గౌరవపూర్వక మానవ సంబోధన. ఏకవచన ప్రత్యయమైన ‘నా’ను కూడా నిలుపుతుంది.
- source_word: כַּדְּבָרִים הָאֵלֶּה
  choice: ఈ విధమైన మాటలు
  rationale: ‘ఈ మాటలవంటి మాటలు’ అనే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తూ, ఆరోపణ మాటలకు సంబంధించినదనే అంశాన్ని కాపాడుతుంది.
- source_word: חָלִילָה לַעֲבָדֶיךָ מֵעֲשׂוֹת
  choice: మీ సేవకులమైన మేము … చేయనే చేయము
  rationale: חָלִילָה తెలిపే బలమైన తిరస్కారాన్ని అసహజమైన పదశః ప్రయోగం లేకుండా తెలుగులో దృఢంగా వ్యక్తం చేస్తుంది.
- source_word: כַּדָּבָר הַזֶּה
  choice: అలాంటి పని
  rationale: ఆరోపించబడిన కార్యాన్ని సూచించే హీబ్రూ పదబంధాన్ని సహజంగా, స్పష్టంగా అనువదిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవపూర్వకమైన, సహజమైన సంభాషణ శైలి వాడబడింది. ‘మాట్లాడుతున్నారు’ అనే బహువచన రూపం సామాజిక గౌరవాన్ని సూచిస్తుంది; ‘చేయనే చేయము’ మూలంలోని బలమైన నిరాకరణను సాధారణ పాఠకులకు స్పష్టంగా అందిస్తుంది.
