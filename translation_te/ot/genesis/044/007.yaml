- from: వారు అతనితో, “నా యజమాని[b] ఈ విధమైన మాటలు[a] ఎందుకు మాట్లాడుతున్నారు? మీ సేవకులమైన మేము అలాంటి పని చేయనే చేయము!” అన్నారు.
  to: వారు అతనితో, “నా యజమానీ[b], మీరు ఇలాంటి మాటలు[a] ఎందుకు మాట్లాడుతున్నారు? మీ సేవకులమైన మేము అలాంటి పని చేయడం దూరం గాక!” అన్నారు.
  rationale: The revision marks the Hebrew respectful address as a Telugu vocative, retains the singular ‘my’ and honorific second-person verb, and uses an idiomatic emphatic denial that corresponds closely to חָלִילָה. It also makes the lexical footnotes accurately anchored and non-duplicative.
