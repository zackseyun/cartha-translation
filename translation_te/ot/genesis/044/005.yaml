- from: “నా యజమాని తాగేది దీనిలో నుంచే కాదా? ఆయన దీనితో తప్పక శకునం చూస్తాడు కదా? మీరు ఇలా చేసి చెడు చేశారు[a][b].”
  to: “నా యజమాని తాగే పాత్ర ఇదే కాదా? ఆయన దీనితో తప్పక శకునం చూస్తాడు కదా? మీరు ఇలా చేసి ఎంత చెడు పని చేశారు![a][b]”
  rationale: The revision makes the cup reference explicit in idiomatic Telugu and replaces an awkward literal rendering of the final accusation with a natural, morally weighty rebuke. It retains the rhetorical force, the claim that the master practices divination by means of the cup, and the two existing footnote anchors and their intended alternatives.
