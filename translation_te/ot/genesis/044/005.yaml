  variant: modern standard Telugu
source:
  edition: WLC
  text: הֲ/ל֣וֹא זֶ֗ה אֲשֶׁ֨ר יִשְׁתֶּ֤ה אֲדֹנִ/י֙ בּ֔/וֹ וְ/ה֕וּא נַחֵ֥שׁ יְנַחֵ֖שׁ בּ֑/וֹ הֲרֵעֹתֶ֖ם אֲשֶׁ֥ר עֲשִׂיתֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/005.yaml
  text: Is this not the one from which my master drinks and by which he indeed practices divination? You have done evil in doing this[a][b].
translation:
  language: te
  text: “నా యజమాని తాగే పాత్ర ఇదే కాదా? ఆయన దీనితో తప్పక శకునం చూస్తాడు కదా? మీరు ఇలా చేసి ఎంత చెడు పని చేశారు![a][b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆయన దీనితో నిశ్చయంగా శకునం చూడగలడు.” హెబ్రీలో క్రియానామంతో పాటు అదే మూలానికి చెందిన క్రియను వాడి భావాన్ని బలపరిచారు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “మీరు చేసిన దానిలో చెడు చేశారు.”
    reason: previous_rendering
lexical_decisions:
- source_word: הֲלֹא זֶה
  choice: దీనిలో నుంచే కాదా?
  rationale: הֲלֹא అంగీకారాన్ని ఆశించే అలంకారిక ప్రశ్నను సూచిస్తుంది. זֶה సందర్భంలోని పాత్రను సూచిస్తుంది; తెలుగులో ‘దీనిలో నుంచే’ అనడం తాగే పాత్రను సహజంగా సూచిస్తుంది.
- source_word: אֲשֶׁר יִשְׁתֶּה אֲדֹנִי בּוֹ
  choice: నా యజమాని తాగేది దీనిలో నుంచే
  rationale: בּוֹ ఇక్కడ పాత్రలోనుంచి తాగడాన్ని సూచిస్తుంది. అֲדֹנִי కథాసందర్భంలో సేవకుడు యోసేపును ఉద్దేశించి వాడిన సామాజిక సంబోధన కాబట్టి ‘నా యజమాని’ సరిపోతుంది.
- source_word: וְהוּא נַחֵשׁ יְנַחֵשׁ בּוֹ
  choice: ఆయన దీనితో తప్పక శకునం చూస్తాడు
  rationale: నחשׁ పియేల్ రూపం శకునం లేదా దైవజ్ఞానం తెలుసుకునే ఆచరణను సూచిస్తుంది. క్రియానామం–క్రియా నిర్మాణంలోని బలాన్ని ‘తప్పక’ తెలియజేస్తుంది; בּוֹ సాధనార్థకంగా ‘దీనితో’ అయింది.
- source_word: הֲרֵעֹתֶם
  choice: మీరు ... చెడు చేశారు
  rationale: רעע హిఫీల్ రూపంలోని నైతిక బరువును ‘చెడు చేశారు’ నిలుపుతుంది.
- source_word: אֲשֶׁר עֲשִׂיתֶם
  choice: ఇలా చేసి
  rationale: వారు చేసిన నిర్దిష్ట కార్యాన్నే సూచిస్తూ, హెబ్రీ పునరుక్తిని ఆధునిక తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: యోసేపు నిజంగానే శకునం చూశాడని చెప్పాలా, లేక ఇది అతని వేషధారణలో భాగమని మృదువుగా చెప్పాలా
  choice: సేవకుని మాటలో ఉన్న వాదనను నేరుగా ‘ఆయన దీనితో తప్పక శకునం చూస్తాడు’ అని అనువదించడం
  alternative: ‘దీనితో శకునం చూడగలడు’ అని సామర్థ్యంగా లేదా కేవలం పేరుప్రఖ్యాతిగా మృదువుగా అనువదించడం
  rationale: హెబ్రీ వాక్యం సేవకుని సంభాషణలో శకునం చూడడాన్ని స్పష్టంగా, బలంగా ప్రకటిస్తుంది. యోసేపు నిజమైన ఆచరణ గురించి కథాసందర్భం లేవనెత్తే ప్రశ్నను అనువాదం ముందుగానే పరిష్కరించకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన సంభాషణ శైలిని వాడాం. ‘శకునం చూస్తాడు’ సాధారణ పాఠకులకు అర్థమయ్యేలా ఉండి, మూలంలోని divination భావాన్ని మృదువుపరచదు. రెండు పాదాల్లో ‘కాదా/కదా’ వాడటం హెబ్రీ అలంకారిక ప్రశ్న యొక్క అంగీకారాపేక్షను తెలుగులో సహజంగా నిలుపుతుంది.
