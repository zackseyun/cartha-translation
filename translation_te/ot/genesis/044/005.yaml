review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the rhetorical question, the steward’s social designation of Joseph as “my master,” the instrumental use of the cup in divination, and the emphatic force of the infinitive absolute plus finite verb. The final clause is represented, but its Telugu wording can more directly and naturally convey the rebuke for the specific act committed.
  naturalness: “నా యజమాని తాగేది దీనిలో నుంచే కాదా?” is understandable but slightly elliptical, since the demonstrative refers to the cup rather than principally to its contents. “నా యజమాని తాగే పాత్ర ఇదే కాదా?” is more natural Telugu in this context. “మీరు ఇలా చేసి చెడు చేశారు” is comprehensible but not idiomatic; “మీరు ఇలా చేసి ఎంత చెడు పని చేశారు!” is a natural direct rebuke.
  terminology: “నా యజమాని” appropriately renders אַדֹנִי in this narrative setting. “శకునం చూస్తాడు” is a suitable modern Telugu expression for the divination claim in the steward’s speech and does not prejudge whether the claim is factually true. “తప్పక” adequately conveys the emphatic Hebrew verbal construction.
  issues:
  - severity: low
    issue: The first question uses an elliptical locative expression.
    rationale: “దీనిలో నుంచే” can be understood, but referring explicitly to the object as a drinking vessel better reflects the demonstrative’s reference to the cup and reads more smoothly in Telugu.
  - severity: medium
    issue: The final rebuke is somewhat unnatural Telugu.
    rationale: “చెడు చేశారు” is a close formal rendering but is less idiomatic than “ఎంత చెడు పని చేశారు,” which retains the moral force and specifies their just-committed action through “ఇలా చేసి.”
  revised_text: “నా యజమాని తాగే పాత్ర ఇదే కాదా? ఆయన దీనితో తప్పక శకునం చూస్తాడు కదా? మీరు ఇలా చేసి ఎంత చెడు పని చేశారు![a][b]”
