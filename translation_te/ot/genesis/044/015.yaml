  yaml_path: translation/ot/genesis/044/015.yaml
  text: And Joseph said to them[a], “What is this deed that you have done? Did you not know that a man like me indeed practices divination?”
translation:
  language: te
  text: యోసేపు వారితో, “మీరు చేసిన ఈ పని ఏమిటి? నాలాంటి మనిషి తప్పకుండా శకునాలు చూస్తాడని[a] మీకు తెలియదా?” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నిశ్చయంగా శకునం చూస్తాడు,” “శకునం చూసి తప్పకుండా తెలుసుకుంటాడు,” లేదా “ఇలాంటి విషయాలను తప్పకుండా కనిపెడతాడు.” హీబ్రూలో శకున విచారణను సూచించే ఒకే ధాతువు ఉద్ఘాటిత రూపంలో రెండుసార్లు వచ్చింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה הַמַּעֲשֶׂה הַזֶּה
  choice: మీరు చేసిన ఈ పని ఏమిటి?
  rationale: מַעֲשֶׂה అంటే పని, క్రియ లేదా చేసిన కార్యం. మందలింపులోని నైతిక బరువును నిలుపుతూ ఆధునిక తెలుగులో సహజంగా ఉండేందుకు ‘ఈ పని’ ఎంచుకున్నాం.
- source_word: עֲשִׂיתֶם
  choice: మీరు చేసిన
  rationale: సంపూర్ణమైన క్రియను, ప్రస్తుతం ఎదుర్కొంటున్న ఆరోపణతో దాని సంబంధాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: הֲלוֹא יְדַעְתֶּם
  choice: మీకు తెలియదా?
  rationale: అవును అనే సమాధానాన్ని ఆశించే ప్రతికూల అలంకార ప్రశ్న యొక్క బలాన్ని ఇది నిలుపుతుంది.
- source_word: נַחֵשׁ יְנַחֵשׁ
  choice: తప్పకుండా శకునాలు చూస్తాడు
  rationale: ఒకే ధాతువుతో వచ్చిన infinitive absolute మరియు finite verb క్రియకు గట్టి నొక్కు ఇస్తాయి. ‘తప్పకుండా’ ఆ ఉద్ఘాటనను, ‘శకునాలు చూస్తాడు’ దివ్యజ్ఞాన/శకున విచారణ భావాన్ని సాధారణ ఆధునిక తెలుగులో వ్యక్తం చేస్తాయి.
- source_word: אִישׁ אֲשֶׁר כָּמֹנִי
  choice: నాలాంటి మనిషి
  rationale: ఏకవచన పురుష రూపాన్ని నేరుగా, సహజంగా నిలుపుతుంది.
- source_word: יוֹסֵף
  choice: యోసేపు
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
theological_decisions:
- issue: యోసేపు శకునాలు చూడడం గురించి చెప్పిన మాటను యథార్థ ప్రకటనగా అనువదించాలా, లేక అది కేవలం నటన అని సూచించేలా మృదువుగా చేయాలా
  choice: యోసేపు మాటను నేరుగా ‘నాలాంటి మనిషి తప్పకుండా శకునాలు చూస్తాడు’ అని అనువదించడం
  alternative: ‘నాలాంటి మనిషి ఇలాంటి విషయాలను తప్పకుండా కనిపెడతాడు’ అని శకున విచారణ ప్రస్తావనను మృదువుగా చేయడం
  rationale: హీబ్రూ పాఠం נחש అనే శకున విచారణ ధాతువును ఉద్ఘాటిత నిర్మాణంలో స్పష్టంగా వాడుతుంది. యోసేపు నిజంగా అలా చేశాడా, లేక తన ఐగుప్తీయ అధికార పాత్రలో వ్యూహాత్మకంగా మాట్లాడాడా అన్నది పాఠం ఇక్కడ తేల్చదు; అందువల్ల ఆ ఉద్విగ్నతను అలాగే ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘శకునాలు చూస్తాడు’ సాధారణ పాఠకులకు అర్థమయ్యే రూపం; ‘తప్పకుండా’ మూలంలోని ఉద్ఘాటనను తెలియజేస్తుంది. ఫుట్‌నోట్ గుర్తు సంబంధిత పదబంధం వెంట ప్రధాన పాఠంలో ఉంచబడింది.
