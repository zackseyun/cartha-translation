  source_fidelity: హెబ్రీ వచనంలోని బహువచన క్రియలు (‘వారు త్వరపడ్డారు,’ ‘దించారు,’ ‘తెరిచారు’) మరియు రెండుసార్లు వచ్చే పంపిణీయ אִישׁ (‘ఒక్కొక్కరూ’) విశ్వసనీయంగా ప్రతిఫలించాయి. ‘నేలమీదికి దించారు’ אָרְצָה యొక్క కిందికి/నేలపైకి దించే భావాన్ని సరిగ్గా అందిస్తుంది.
