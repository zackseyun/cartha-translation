translation_notes:
  register: సాధారణ పాఠకులకు అర్థమయ్యే ఆధునిక ప్రామాణిక తెలుగు వాడబడింది. హెబ్రీలోని బహువచన ‘వారు త్వరపడ్డారు’ అనే నిర్మాణంతో పాటు రెండుసార్లు వచ్చే పంపిణీయ ‘ఒక్కొక్కరూ’ను నిలిపి, మూలంలోని వ్యక్తిగత చర్యపై ఉన్న నొక్కును సంరక్షించాం.
