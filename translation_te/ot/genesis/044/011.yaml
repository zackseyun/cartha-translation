  yaml_path: translation/ot/genesis/044/011.yaml
  text: So each man hurried and lowered his sack to the ground[b][a], and each man opened his sack.
translation:
  language: te
  text: అప్పుడు వారు త్వరపడ్డారు; ఒక్కొక్కరూ తమ గోనెసంచిని నేలమీదికి దించారు[a], ఒక్కొక్కరూ తమ గోనెసంచిని తెరిచారు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ఒక్కొక్కరూ తమ గోనెసంచిని’ అని హెబ్రీ వాక్యం ప్రతి చర్య దగ్గర విడివిడిగా చెబుతుంది; ప్రతి సోదరుడూ తన సొంత సంచిని దించి తెరిచాడనే విషయాన్ని ఇది నొక్కిచెబుతుంది.
    reason: lexical_alternative
  - marker: b
    text: హెబ్రీలో మొదటి క్రియ బహువచనంలో ఉంది. అందువల్ల దీనిని, “అప్పుడు వారు త్వరపడి, ఒక్కొక్కరూ తమ గోనెసంచిని నేలమీదికి దించారు” అని కూడా అనువదించవచ్చు.
    reason: previous_rendering
lexical_decisions:
- source_word: וַיְמַהֲרוּ
  choice: వారు త్వరపడ్డారు
  rationale: מהר అనే క్రియ సూచించే తక్షణ చర్యను సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది; హెబ్రీలోని బహువచన కర్తను కూడా నిలుపుతుంది.
- source_word: וַיּוֹרִדוּ
  choice: దించారు
  rationale: ירד హిఫీల్ రూపంలోని ‘కిందికి దిగేలా చేయడం’ అనే కారణార్థాన్ని తెలియజేస్తుంది; సందర్భంలో జంతువులపై ఉన్న సంచులను నేలమీదికి దించడాన్ని సూచిస్తుంది.
- source_word: אִישׁ ... אַמְתַּחְתּוֹ
  choice: ఒక్కొక్కరూ తమ గోనెసంచిని
  rationale: אִישׁ ఇక్కడ పంపిణీయ భావంలో ఉంది. ‘ఒక్కొక్కరూ’ ప్రతి వ్యక్తి తన సొంత సంచిపై చర్య చేసినట్లు స్పష్టంగా తెలియజేస్తుంది.
- source_word: אַמְתַּחַת
  choice: గోనెసంచి
  rationale: ధాన్యం లేదా సామగ్రిని మోసే పెద్ద సంచిని సూచించే సందర్భోచితమైన, సాధారణ తెలుగు పదం.
- source_word: אָרְצָה
  choice: నేలమీదికి
  rationale: దిశను సూచించే రూపం కిందికి, నేలవైపు జరిగిన కదలికను తెలియజేస్తుంది.
- source_word: וַיִּפְתְּחוּ
  choice: తెరిచారు
  rationale: פתח యొక్క సాధారణ అర్థమైన ‘తెరవడం’ను అదనపు వివరణ లేకుండా నేరుగా అందిస్తుంది.
