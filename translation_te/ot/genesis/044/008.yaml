id: GEN.44.8
reference: Genesis 44:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: הֵ֣ן כֶּ֗סֶף אֲשֶׁ֤ר מָצָ֨אנוּ֙ בְּ/פִ֣י אַמְתְּחֹתֵ֔י/נוּ הֱשִׁיבֹ֥נוּ אֵלֶ֖י/ךָ מֵ/אֶ֣רֶץ כְּנָ֑עַן וְ/אֵ֗יךְ נִגְנֹב֙ מִ/בֵּ֣ית אֲדֹנֶ֔י/ךָ כֶּ֖סֶף א֥וֹ זָהָֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/008.yaml
  text: Look[a], the silver that we found in the mouths of our sacks we brought back to you from the land of Canaan. So how could we steal silver or gold from your master's house?
translation:
  language: te
  text: ఇదిగో, మా సంచుల నోళ్లలో[a] మేము కనుగొన్న వెండిని కనాను దేశం నుండి మీకు తిరిగి తెచ్చాము. అలాంటప్పుడు మీ యజమాని ఇంటి నుండి వెండినైనా బంగారాన్నైనా మేమెలా దొంగిలిస్తాము?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘మా సంచుల నోళ్లలో.’ ఇది సంచి తెరుచుకునే పైభాగాన్ని సూచించే హీబ్రూ నుడికారం.
    reason: cultural_note
lexical_decisions:
- source_word: הֵן
  choice: చూడండి
  rationale: వక్త తన వాదనలోని ఆధారంపై శ్రోత దృష్టిని నిలిపే ఉద్ఘాటనార్థక అవ్యయం. ఆధునిక తెలుగులో సహజంగా, బలంగా వినిపిస్తుంది.
- source_word: כֶּסֶף
  choice: వెండి
  rationale: సందర్భంలో ఇది ధనంగా ఉపయోగించిన వెండిని సూచించినా, మూలంలోని నిర్దిష్ట లోహపదాన్ని నిలుపుతుంది; చివరలోని ‘వెండి... బంగారం’ జోడీతోనూ సరిపోతుంది.
- source_word: בְּפִי אַמְתְּחֹתֵינוּ
  choice: మా మూటల నోళ్లలో
  rationale: సంచి పైభాగం లేదా తెరుచుకునే చోటును ‘నోరు’గా చెప్పే హీబ్రూ రూపకాన్ని నిలిపింది. ధాన్యం మోసే పెద్ద సంచులకు ‘మూటలు’ సందర్భోచితం.
- source_word: הֱשִׁיבֹנוּ אֵלֶיךָ
  choice: మీ దగ్గరికి తిరిగి తీసుకొచ్చాం
  rationale: హిఫిల్ క్రియలోని ‘తిరిగి వచ్చేలా చేయడం/తీసుకురావడం’ అనే భావాన్ని సహజమైన తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: מֵאֶרֶץ כְּנָעַן
  choice: కనాను దేశం నుంచి
  rationale: భౌగోళిక మూలస్థానాన్ని సరళంగా, నేరుగా తెలియజేస్తుంది.
- source_word: וְאֵיךְ נִגְנֹב
  choice: అలాంటప్పుడు... మేమెలా దొంగిలిస్తాం?
  rationale: ముందటి చర్య ఆధారంగా దొంగతనం అసంభవమని ప్రశ్నించే వాదనాత్మక, అలంకారిక భావాన్ని సహజ తెలుగులో అందిస్తుంది.
- source_word: מִבֵּית אֲדֹנֶיךָ
  choice: మీ యజమాని ఇంట్లో నుంచి
  rationale: ఇక్కడ אֲדֹנֶיךָ దైవబిరుదు కాదు; సేవకునిపై అధికారమున్న యోసేపును సూచిస్తుంది. ‘ఇల్లు’ మూలంలోని సామాజిక గృహ/ఆస్తి పరిధిని నిలుపుతుంది.
- source_word: כֶּסֶף אוֹ זָהָב
  choice: వెండినైనా బంగారాన్నైనా
  rationale: మూలంలోని రెండు విలువైన లోహాలను నిలుపుతూ, ప్రతికూల అలంకారిక ప్రశ్నలో ‘ఏదైనా సరే’ అనే తెలుగు భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
