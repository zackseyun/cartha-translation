id: GEN.44.29
reference: Genesis 44:29
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/לְקַחְתֶּ֧ם גַּם אֶת זֶ֛ה מֵ/עִ֥ם פָּנַ֖/י וְ/קָרָ֣/הוּ אָס֑וֹן וְ/הֽוֹרַדְתֶּ֧ם אֶת שֵׂיבָתִ֛/י בְּ/רָעָ֖ה שְׁאֹֽלָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/029.yaml
  text: If you also take this one from me[a], and harm happens to him, then you will bring my gray hair down to Sheol in misery.
translation:
  language: te
  text: “మీరు ఇతణ్ణి కూడా నా దగ్గరనుంచి తీసుకెళ్లి, అతనికి ఆపద సంభవిస్తే, నెరిసిన నా తలను దుఃఖంతో షెయోలుకు[a] దింపుతారు.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘సమాధికి,’ లేదా ‘మృతుల లోకానికి.’
    reason: שְׁאוֹל పదంలోని భావ విస్తృతిని తెలియజేసే పదార్థ ప్రత్యామ్నాయాలు.
lexical_decisions:
- source_word: וּלְקַחְתֶּם גַּם אֶת־זֶה
  choice: మీరు ఇతణ్ణి కూడా ... తీసుకెళ్లి
  rationale: వావ్‌తో కూడిన సంపూర్ణ క్రియ సందర్భంలోని షరతును కొనసాగిస్తుంది. తెలుగులో తరువాతి ‘సంభవిస్తే’తో కలిపి ‘తీసుకెళ్లి’ సహజంగా ఆ షరతు భావాన్ని వ్యక్తం చేస్తుంది; גַּם కు ‘కూడా’ సరిపోతుంది.
- source_word: מֵעִם פָּנַי
  choice: నా దగ్గరనుంచి
  rationale: అక్షరార్థంగా ‘నా సన్నిధి నుండి’ అనే భావం. ఆధునిక తెలుగులో యాకోబు నుండి బెన్యామీనును దూరంగా తీసుకెళ్లడాన్ని ‘నా దగ్గరనుంచి’ సహజంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: וְקָרָהוּ אָסוֹן
  choice: అతనికి ఏదైనా ఆపద సంభవిస్తే
  rationale: קרה అంటే సంభవించడం/ఎదురవడం; אָסוֹן అంటే తీవ్రమైన అపాయం లేదా విపత్తు. ‘ఏదైనా ఆపద సంభవిస్తే’ అనేది అనిశ్చిత భయాన్ని అతిగా నిర్దిష్టం చేయకుండా నిలుపుతుంది.
- source_word: וְהוֹרַדְתֶּם
  choice: దింపుతారు
  rationale: ירד యొక్క హిఫీల్ రూపంలోని కారణార్థాన్ని, క్రిందికి దిగే మూల రూపకాన్ని ‘దింపుతారు’ కాపాడుతుంది.
- source_word: שֵׂיבָתִי
  choice: నెరిసిన నా తలను
  rationale: మూలంలో ‘నా నెరిసిన జుట్టు’ వృద్ధాప్యానికి రూపకాలంకారంగా ఉంది. తెలుగులో ‘నెరిసిన నా తలను’ ఆ హీబ్రూ చిత్రాన్ని సహజంగా నిలుపుతుంది.
- source_word: בְּרָעָה
  choice: దుఃఖంతో
  rationale: ఇక్కడ רָעָה నైతిక చెడును కాక బాధ, దురవస్థ లేదా శోకాన్ని సూచిస్తుంది. సందర్భంలో ‘దుఃఖంతో’ యాకోబు భావించిన శోకమరణాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: שְׁאֹלָה
  choice: షెయోలుకు
  rationale: దిశాసూచక ప్రత్యయంతో ఉన్న שְׁאוֹל ను ‘షెయోలుకు’గా లిప్యంతరీకరించడం, దానిని కేవలం భౌతిక సమాధిగా పరిమితం చేయకుండా హీబ్రూ భావప్రపంచాన్ని నిలుపుతుంది.
theological_decisions:
- issue: שְׁאוֹל పదానికి అనువాదం
  choice: షెయోలు
  alternative: సమాధి; మృతుల లోకం
  rationale: ఈ పదం కేవలం పాతిపెట్టే స్థలానికంటే విస్తృతంగా మృతుల లోకాన్ని సూచించగలదు. ప్రధాన పాఠ్యంలో లిప్యంతరీకరణ చేసి, అర్థ ప్రత్యామ్నాయాలను పాదసూచికలో ఇవ్వడం ద్వారా తరువాతి సిద్ధాంత భావాలను మూలంలోకి చొప్పించకుండా అసలు భావ విస్తృతిని కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. హీబ్రూ వాక్యంలోని షరతు సంబంధం, నెరిసిన తల అనే రూపకం, షెయోలుకు దిగడం అనే దిశాత్మక చిత్రం నిలుపబడ్డాయి.
