translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. మూలంలోని రెండు ప్రకటనల మధ్య ప్రధాన విరామాన్ని పూర్ణవిరామంతో నిలిపి, వాక్యంలోని సహజ ఉద్వేగాన్ని పరిష్కరించకుండా ఉంచాం.
