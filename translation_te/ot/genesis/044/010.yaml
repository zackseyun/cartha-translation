source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר גַּם עַתָּ֥ה כְ/דִבְרֵי/כֶ֖ם כֶּן ה֑וּא אֲשֶׁ֨ר יִמָּצֵ֤א אִתּ/וֹ֙ יִהְיֶה לִּ֣/י עָ֔בֶד וְ/אַתֶּ֖ם תִּהְי֥וּ נְקִיִּֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/010.yaml
  text: And he said[a], “Even now, let it be according to your words. The one with whom it is found will be my servant[b], and you will be innocent.”
translation:
  language: te
  text: 'అతడు ఇలా అన్నాడు: “ఇప్పుడు కూడా మీ మాటల ప్రకారమే అలా ఉంటుంది. ఎవరి దగ్గర అది దొరుకుతుందో అతడు నాకు బానిసగా[a] ఉంటాడు; మీరు నిర్దోషులుగా ఉంటారు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “బానిస”కు మూలంలోని హెబ్రీ పదాన్ని “దాసుడు” లేదా “సేవకుడు” అని కూడా అనువదించవచ్చు; ఇక్కడ శిక్షగా విధించే బంధిత స్థితి ఉద్దేశించబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם עַתָּה
  choice: ఇప్పుడూ
  rationale: గַּם యొక్క అదనపు లేదా ఉద్ఘాటక భావాన్నీ, עַתָּה యొక్క వర్తమాన కాలసూచననూ సంక్షిప్తమైన సహజ తెలుగు రూపంలో నిలుపుతుంది.
- source_word: כְדִבְרֵיכֶם כֶּן הוּא
  choice: మీ మాట ప్రకారమే కానివ్వండి
  rationale: వారు చెప్పిన మాటలను అంగీకరిస్తున్నట్టుగా ఉన్న హెబ్రీ వాక్యరూపాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది. తరువాతి తీర్పును వేరే వాక్యంగా ఉంచడం ద్వారా హెబ్రీలోని ప్రధాన విరామం మరియు అతడు వారి కఠిన ప్రతిపాదనను మార్చి చెప్పే సందర్భం రెండూ కనిపిస్తాయి.
- source_word: אֲשֶׁר יִמָּצֵא אִתּוֹ
  choice: ఎవరి దగ్గర అది దొరుకుతుందో
  rationale: పాత్ర ఎవరి స్వాధీనంలో దొరుకుతుందో సూచించే సంబంధ వాక్యాన్ని సహజంగా, మూలానికి దగ్గరగా అందిస్తుంది.
- source_word: יִהְיֶה לִּי עָבֶד
  choice: అతడు నాకు బానిసగా ఉంటాడు
  rationale: ఇక్కడ עָבֶד సాధారణ జీతపు సేవను కాక, శిక్షగా విధించే బంధిత స్థితిని సూచిస్తుంది. అందువల్ల ఆధునిక తెలుగులో ‘బానిస’ సందర్భార్థాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: וְאַתֶּם תִּהְיוּ נְקִיִּם
  choice: మిగతా మీరు నిర్దోషులుగా ఉంటారు
  rationale: נְקִיִּם ఇక్కడ అపరాధం లేదా బాధ్యత నుంచి విముక్తులని సూచిస్తుంది. ‘మిగతా’ అనే పదం దోషిగా తేలిన వ్యక్తిని మినహాయించి ఇతర సోదరులనే ఉద్దేశించినట్టు తెలుగులో స్పష్టం చేస్తుంది.
