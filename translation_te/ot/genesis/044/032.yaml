  text: כִּ֤י עַבְדְּ/ךָ֙ עָרַ֣ב אֶת הַ/נַּ֔עַר מֵ/עִ֥ם אָבִ֖/י לֵ/אמֹ֑ר אִם לֹ֤א אֲבִיאֶ֨/נּוּ֙ אֵלֶ֔י/ךָ וְ/חָטָ֥אתִי לְ/אָבִ֖/י כָּל הַ/יָּמִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/032.yaml
  text: For your servant became surety for the boy to my father[a], saying, ‘If I do not bring him to you[b], then I will bear the blame before my father all my days.’
translation:
  language: te
  text: ఎందుకంటే నీ సేవకుడనైన నేను ఈ అబ్బాయి కోసం నా తండ్రి వద్ద పూచీదారునిగా నిలిచాను[a], ‘నేను అతణ్ణి నీ దగ్గరికి తీసుకురాకపోతే, నా జీవితమంతా నా తండ్రి ఎదుట నింద మోస్తాను[b]’ అని చెప్పి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఈ అబ్బాయికి హామీదారునిగా నిలిచాను” లేదా “ఈ అబ్బాయి కోసం నన్ను నేను బాధ్యునిగా చేసుకున్నాను.” హీబ్రూ క్రియ హామీదారుగా బాధ్యత స్వీకరించడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “నా తండ్రి పట్ల జీవితమంతా పాపం చేసినవాడనవుతాను.” ఇక్కడ అది అతని ఎదుట నిరంతరం అపరాధం లేదా నింద మోయడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: యూదా చేస్తున్న విజ్ఞప్తికి కారణాన్ని పరిచయం చేస్తుంది; తెలుగులో సహజమైన కారణసూచక అనుసంధానం.
- source_word: עַבְדְּךָ
  choice: నీ సేవకుడనైన నేను
  rationale: ఉన్నతాధికారితో మాట్లాడేటప్పుడు తనను తాను తగ్గించుకొని చెప్పుకునే మర్యాదపూర్వక సంబోధనను నిలుపుతుంది.
- source_word: עָרַב
  choice: పూచీ పడ్డాను
  rationale: మరొకరి విషయమై హామీదారుగా బాధ్యత స్వీకరించడమనే న్యాయపరమైన భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: הַנַּעַר
  choice: ఈ అబ్బాయి
  rationale: బెన్యామీనును సూచించే కుటుంబ సందర్భంలోని సాధారణ పదం; అతడు చిన్నపిల్లవాడని తప్పనిసరిగా సూచించదు.
- source_word: מֵעִם אָבִי
  choice: నా తండ్రి దగ్గర
  rationale: యూదా ఎవరికైతే హామీ ఇచ్చాడో ఆ సంబంధాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: לֵאמֹר
  choice: అని చెప్పి
  rationale: హామీలోని మాటలను పరిచయం చేసే ఉద్ధరణ సూచక రూపం.
- source_word: אִם לֹא אֲבִיאֶנּוּ אֵלֶיךָ
  choice: నేను అతణ్ణి తిరిగి నీ దగ్గరికి తీసుకురాకపోతే
  rationale: షరతును స్పష్టంగా తెలుపుతుంది; సందర్భానుసారంగా తిరిగి తీసుకురావడమే ఉద్దేశం కాబట్టి ‘తిరిగి’ చేర్చబడింది.
- source_word: וְחָטָאתִי לְאָבִי
  choice: నా తండ్రి ఎదుట నింద మోస్తాను
  rationale: అక్షరార్థమైన ‘నా తండ్రికి/వ్యతిరేకంగా పాపం చేసినవాడనవుతాను’ అనే భావంలోని నిరంతర అపరాధబాధ్యతను సహజంగా తెలియజేస్తూ, ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచుతుంది.
- source_word: כָּל הַיָּמִים
  choice: నా జీవితమంతా
  rationale: జీవితకాలమంతటి నిరంతర బాధ్యతను తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: וְחָטָאתִי యొక్క పాపం/అపరాధం భావం
  choice: ప్రధాన పాఠ్యంలో ‘నింద మోస్తాను’
  alternative: ‘నా తండ్రికి విరోధంగా పాపం చేసినవాడనవుతాను’ లేదా ‘అపరాధిగా ఉంటాను’
  rationale: ఈ సందర్భం హామీ నెరవేర్చకపోవడం వల్ల కలిగే జీవితకాల బాధ్యతను ప్రధానంగా సూచిస్తుంది. అయినా హెబ్రీ పదంలోని నైతిక ‘పాపం’ భావాన్ని తొలగించకుండా పాదటిప్పణిలో నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, యోసేపు ఎదుట యూదా చూపుతున్న వినయపూర్వక రాజసభా శైలిని ‘నీ సేవకుడనైన నేను’ ద్వారా నిలిపాం. ‘పూచీ పడ్డాను’ సాధారణ పాఠకులకు అర్థమయ్యేలా ఉండి, మూలంలోని హామీదారు-బాధ్యత భావాన్ని కాపాడుతుంది. పాదటిప్పణి గుర్తులు రెండూ ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
