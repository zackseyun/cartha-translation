source:
  edition: WLC
  text: אֲשֶׁ֨ר יִמָּצֵ֥א אִתּ֛/וֹ מֵ/עֲבָדֶ֖י/ךָ וָ/מֵ֑ת וְ/גַם אֲנַ֕חְנוּ נִֽהְיֶ֥ה לַֽ/אדֹנִ֖/י לַ/עֲבָדִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/009.yaml
  text: Whichever of your servants it is found with[a], let him die[b], and we also will become servants to my lord.
translation:
  language: te
  text: మీ సేవకులలో[a] ఎవరి దగ్గర అది దొరుకుతుందో[b], అతడు చనిపోవాలి; మేము కూడా నా ప్రభువుకు బానిసలమవుతాము.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘సేవకులు’ మరియు ఈ వచనం చివర ఉన్న ‘బానిసలు’ అనే పదాలకు హీబ్రూలో ఒకే మూలపదం ఉంది. మొదటి సందర్భం వినయపూర్వక స్వీయసూచన; రెండవ సందర్భంలో నిజమైన బానిసత్వం ఉద్దేశించబడింది.
    reason: lexical_alternative
  - marker: b
    text: 'లేదా: ‘మీ సేవకులలో ఎవరి వద్ద అది దొరుకుతుందో.’'
    reason: previous_rendering
lexical_decisions:
- source_word: אֲשֶׁר יִמָּצֵא אִתּוֹ מֵעֲבָדֶיךָ
  choice: మీ సేవకులలో ఎవరి దగ్గర అది దొరుకుతుందో
  rationale: అనిర్దిష్ట సంబంధ వాక్యాన్ని, מן యొక్క సమూహంలోని ఒకరు అనే భావాన్ని, אִתּוֹ సూచించే స్వాధీనతను సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది. సందర్భంలో వెదుకుతున్న వస్తువు గిన్నె కాబట్టి తెలుగులో అవసరమైన ‘అది’ చేర్చబడింది.
- source_word: וָמֵת
  choice: అతడు చనిపోవాలి
  rationale: ఇక్కడ సంయుక్త పరిపూర్ణ క్రియ ప్రతిపాదిత శిక్షను తెలిపే విధ్యర్థక ఫలితంగా పనిచేస్తుంది; ‘చనిపోవాలి’ ఆ బలాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וְגַם אֲנַחְנוּ נִהְיֶה
  choice: మేము కూడా … అవుతాము
  rationale: וְגַם లోని అదనపు పరిణామ భావాన్ని ‘కూడా’ నిలుపుతుంది; נִהְיֶה ఒక కొత్త స్థితిలోకి రావడాన్ని సూచిస్తున్నందున ‘అవుతాము’ అనువైనది.
- source_word: לַאדֹנִי
  choice: నా ప్రభువుకు
  rationale: మొదటి పురుష ఏకవచన ప్రత్యయాన్ని ‘నా’గా నిలిపి, మానవ అధికారిని ఉద్దేశించిన గౌరవసూచక אדניని ‘ప్రభువు’గా అనువదించింది.
- source_word: לַעֲבָדִים
  choice: బానిసలమవుతాము
  rationale: ఇక్కడ శిక్షగా వాస్తవ బానిసత్వంలోకి వెళ్లడం ప్రధాన భావం; అందువల్ల సాధారణ గౌరవసూచక ‘సేవకులు’ కంటే ‘బానిసలు’ స్పష్టమైనది.
theological_decisions:
- issue: ఒకే עבד మూలపదాన్ని ఈ వచనంలోని రెండు సందర్భాల్లో ఎలా అనువదించాలి
  choice: మొదట ‘సేవకులు’, తరువాత ‘బానిసలు’
  alternative: రెండు చోట్లా ‘సేవకులు’ లేదా రెండు చోట్లా ‘బానిసలు’
  rationale: మొదటి ప్రయోగం అధికారిముందు సోదరులు తమను వినయంగా పేర్కొనే రాజసభా సంభాషణ; రెండవది శిక్షగా నిజమైన బానిసత్వాన్ని ప్రతిపాదిస్తుంది. మూలపద ఐక్యతను పాదటిప్పణిలో తెలియజేస్తూ సందర్భానుసార భేదాన్ని ప్రధాన పాఠ్యంలో నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన కథన శైలి. ‘ఎవరి దగ్గర’ సాధారణ పాఠకులకు సహజంగా స్వాధీనతను తెలియజేస్తుంది; ‘నా ప్రభువు’ పురాతన రాజసభా సంభాషణ గౌరవాన్ని నిలుపుతుంది.
