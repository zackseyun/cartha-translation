source:
  edition: WLC
  text: הֵ֠ם יָֽצְא֣וּ אֶת הָ/עִיר֮ לֹ֣א הִרְחִיקוּ֒ וְ/יוֹסֵ֤ף אָמַר֙ לַֽ/אֲשֶׁ֣ר עַל בֵּית֔/וֹ ק֥וּם רְדֹ֖ף אַחֲרֵ֣י הָֽ/אֲנָשִׁ֑ים וְ/הִשַּׂגְתָּ/ם֙ וְ/אָמַרְתָּ֣ אֲלֵ/הֶ֔ם לָ֛/מָּה שִׁלַּמְתֶּ֥ם רָעָ֖ה תַּ֥חַת טוֹבָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/004.yaml
  text: They had gone out of the city; they had not gone far[a], when Joseph said to the one over his house, “Get up, pursue the men, and when you overtake them, say to them, ‘Why have you repaid evil for good?’”
translation:
  language: te
  text: వారు పట్టణం నుండి బయలుదేరి ఎంతో దూరం వెళ్లకముందే, యోసేపు తన గృహనిర్వాహకునితో[a], “లేచి, ఆ మనుష్యులను వెంబడించు. నువ్వు వారిని చేరుకున్నప్పుడు, ‘మీరు మేలుకు ప్రతిగా కీడు ఎందుకు చేశారు?’ అని వారితో చెప్పు” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “తన ఇంటిమీద ఉన్నవానితో”; అంటే తన ఇంటి వ్యవహారాలను పర్యవేక్షించేవానితో.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵם יָצְאוּ אֶת הָעִיר לֹא הִרְחִיקוּ
  choice: వారు పట్టణం నుండి బయలుదేరి ఎంతో దూరం వెళ్లకముందే
  rationale: హీబ్రూ వాక్యంలోని బయలుదేరడం, ఇంకా దూరం వెళ్లకపోవడం అనే వరుస భావాలను సహజమైన తెలుగు కాలసంబంధ నిర్మాణంలో నిలిపింది.
- source_word: לַאֲשֶׁר עַל־בֵּיתוֹ
  choice: తన గృహనిర్వాహకునితో
  rationale: అక్షరార్థంగా ‘తన ఇంటిమీద ఉన్నవాడు’; సందర్భంలో ఇంటి వ్యవహారాలను పర్యవేక్షించే అధికారిని సూచిస్తుంది. ‘గృహనిర్వాహకుడు’ ఆధునిక తెలుగులో సహజంగా, సంక్షిప్తంగా ఆ బాధ్యతను తెలియజేస్తుంది.
- source_word: קוּם
  choice: లేచి
  rationale: తక్షణ చర్యకు పిలిచే ఆజ్ఞారూప బలాన్ని నిలిపే సహజ తెలుగు పదం.
- source_word: רְדֹף אַחֲרֵי הָאֲנָשִׁים
  choice: ఆ మనుష్యులను వెంబడించు
  rationale: ‘వారి వెనుక తరుముతూ వెళ్లు’ అనే మూలభావాన్ని ‘వెంబడించు’ స్పష్టంగా, గౌరవప్రదమైన ఆధునిక శైలిలో అందిస్తుంది.
- source_word: וְהִשַּׂגְתָּם
  choice: నువ్వు వారిని చేరుకున్నప్పుడు
  rationale: హిఫీల్ రూపం ఇక్కడ వెంబడించి చేరుకోవడం లేదా పట్టుకోవడం అనే భావాన్ని ఇస్తుంది; తరువాతి ఆజ్ఞకు ముందు జరిగే చర్యగా ‘చేరుకున్నప్పుడు’ సహజంగా ఉంది.
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: వారితో చెప్పు
  rationale: మూలంలోని ప్రత్యక్ష ఆజ్ఞను సూటిగా నిలిపింది.
- source_word: שִׁלַּמְתֶּם רָעָה תַּחַת טוֹבָה
  choice: మీరు మేలుకు ప్రతిగా కీడు ఎందుకు చేశారు?
  rationale: ‘మంచికి బదులుగా చెడు తిరిగి ఇవ్వడం’ అనే నైతిక ఆరోపణను ‘మేలుకు ప్రతిగా కీడు’ అనే సహజ తెలుగు జంటతో నిలిపింది.
