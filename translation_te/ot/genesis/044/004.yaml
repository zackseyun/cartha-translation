translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి ఉపయోగించబడింది. మూలంలోని ఆజ్ఞల తీవ్రతను ఉంచుతూ అనవసరమైన ప్రాచీన పదజాలాన్ని నివారించాం. ఆంగ్ల ముసాయిదాలో [a] గుర్తు ‘దూరం’ తరువాత కనిపించినా, దాని పాదసూచిక గృహనిర్వాహకునికి సంబంధించినందున తెలుగులో సంబంధిత పదం తరువాత ఉంచబడింది.
