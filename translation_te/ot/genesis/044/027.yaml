  edition: WLC
  text: וַ/יֹּ֛אמֶר עַבְדְּ/ךָ֥ אָבִ֖/י אֵלֵ֑י/נוּ אַתֶּ֣ם יְדַעְתֶּ֔ם כִּ֥י שְׁנַ֖יִם יָֽלְדָה לִּ֥/י אִשְׁתִּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/027.yaml
  text: Then your servant[a], my father, said to us, ‘You know that my wife bore me two sons.’
translation:
  language: te
  text: 'అప్పుడు నీ సేవకుడైన నా తండ్రి మాతో ఇలా అన్నాడు: ‘నా భార్య నాకు ఇద్దరిని కన్నదని మీకు తెలుసు.[a]’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీలో ‘నా భార్య నాకు ఇద్దరిని కన్నది’ అని ఉంది. సందర్భాన్ని బట్టి ఆ ఇద్దరూ కుమారులు—యోసేపు, బెన్యామీను.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... అన్నాడు
  rationale: వావ్-కన్సిక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది; ఆధునిక తెలుగు కథన ప్రవాహంలో ‘అప్పుడు’ ఆ క్రమార్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: עַבְדְּךָ אָבִי
  choice: నీ సేవకుడైన నా తండ్రి
  rationale: యూదా యోసేపుతో వినయంగా మాట్లాడుతూ తన తండ్రిని ‘నీ సేవకుడు’ అని పేర్కొంటున్నాడు; ఈ రూపం గౌరవభావాన్నీ కుటుంబ సంబంధాన్నీ రెండింటినీ నిలుపుతుంది.
- source_word: אֵלֵינוּ
  choice: మాతో
  rationale: తెలుగులో ‘మాతో అన్నాడు’ అనేది సహజమైన ప్రయోగం; హెబ్రీలోని ‘మాకు/మా వైపు’ అనే భావాన్ని సరిగ్గా అందిస్తుంది.
- source_word: אַתֶּם יְדַעְתֶּם
  choice: మీకు తెలుసు
  rationale: స్పష్టమైన బహువచన సర్వనామం వల్ల ఉన్న ఉద్ఘాటనను ‘మీకు’ నిలుపుతుంది; పలికిన సమయంలో కొనసాగుతున్న జ్ఞానాన్ని సహజమైన వర్తమాన రూపం వ్యక్తం చేస్తుంది.
- source_word: כִּי
  choice: అని
  rationale: ఇక్కడ כִּי తెలిసిన విషయపు విషయవాచక ఉపవాక్యాన్ని పరిచయం చేస్తుంది; తెలుగులో ‘అని’ సహజ సమానం.
- source_word: שְׁנַיִם
  choice: ఇద్దరిని
  rationale: హెబ్రీ మూలంలో ‘ఇద్దరు’ మాత్రమే ఉంది. వ్యక్తులను సూచించేందుకు తెలుగు ‘ఇద్దరు’ సరిపోతుంది; ‘కుమారులు’ అని సందర్భార్థాన్ని ప్రధాన వచనంలో చేర్చాల్సిన అవసరం లేదు.
- source_word: יָלְדָה לִּי
  choice: నాకు ... కన్నది
  rationale: ילד మరియు పరోక్ష కర్మప్రత్యయం కలయికకు ఇది సహజమైన, సంక్షిప్తమైన తెలుగు రూపం.
- source_word: אִשְׁתִּי
  choice: నా భార్య
  rationale: ఈ సందర్భంలో אִשָּׁה మొదటి పురుష ప్రత్యయంతో స్పష్టంగా ‘నా భార్య’ అని అర్థం.
