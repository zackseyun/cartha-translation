translation:
  language: te
  text: అతడు వారిని చేరుకొని, వారికి ఈ మాటలు చెప్పాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּשִּׂגֵם
  choice: అతడు వారిని చేరుకొని
  rationale: హిఫిల్ రూపంలోని נשׂג ఇక్కడ వెంబడించి వారిని చేరుకోవడం అనే భావాన్ని ఇస్తుంది. సందర్భానికి సహజంగా ఉండే ‘వారిని చేరుకొని’ అనే రూపం, తప్పనిసరిగా పట్టుకోవడం అనే అదనపు భావాన్ని చేర్చకుండా సంఘటనను తెలియజేస్తుంది.
- source_word: וַיְדַבֵּר
  choice: చెప్పాడు
  rationale: דבר ప్రాథమికంగా ‘మాట్లాడు’ అని అర్థమైనా, వెంటనే ‘ఈ మాటలు’ అనే కర్మ ఉన్నందున తెలుగులో ‘ఈ మాటలు మాట్లాడాడు’ కంటే ‘ఈ మాటలు చెప్పాడు’ సహజంగా, గౌరవప్రదంగా ఉంటుంది.
- source_word: אֲלֵהֶם
  choice: వారితో
  rationale: אֶל వారి వైపు ఉద్దేశించిన మాటను సూచిస్తుంది. తెలుగు మాటల సందర్భంలో ‘వారితో ... చెప్పాడు’ సహజమైన ప్రయోగం; ‘వారికి’ కూడా సాధ్యమే.
- source_word: אֶת הַדְּבָרִים הָאֵלֶּה
  choice: ఈ మాటలు
  rationale: హీబ్రూ పదబంధాన్ని నేరుగా ప్రతిబింబిస్తూ, తరువాత వచ్చే ప్రత్యక్ష సంభాషణకు పరిచయంగా ‘ఈ మాటలు’ సరిపోతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సంక్షిప్తమైన కథన శైలి. మూలంలోని వరుస క్రియలను సహజ తెలుగు ఉపవాక్య నిర్మాణంతో అందించాం. ఈ వచనంలో ప్రచురణకు అవసరమైన అర్థభేద సూచిక లేకపోవడంతో పాదటిప్పణి చేర్చలేదు.
