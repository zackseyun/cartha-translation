revisions:
- from: అప్పుడు యూదా అతని దగ్గరికి వచ్చి, “దయచేసి, నా ప్రభూ, నీ సేవకుడు నా ప్రభువు వినేలా ఒక మాట చెప్పనివ్వు.[a] నీ సేవకునిపై నీ కోపం రగలనివ్వకు; ఎందుకంటే నీవు ఫరోతో సమానమైనవాడివి” అన్నాడు.
  to: 'అప్పుడు యూదా అతని దగ్గరకు వచ్చి ఇలా అన్నాడు: “దయచేసి, నా ప్రభూ, మీ సేవకుడు నా ప్రభువు సమక్షంలో ఒక మాట మాట్లాడనివ్వండి. మీ సేవకుని మీద మీ కోపం రగలనివ్వకండి; ఎందుకంటే మీరు ఫరోవంటివారు.”'
  rationale: The revision makes the respectful mode of address consistent, renders the Hebrew hearing idiom naturally in Telugu without changing its sense, and changes “equal to Pharaoh” to “like Pharaoh,” preserving the Hebrew comparison without overstatement. The existing lexical-alternative footnote remains appropriately anchored to the opening plea.
