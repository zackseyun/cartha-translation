source:
  edition: WLC
  text: וַ/יִּגַּ֨שׁ אֵלָ֜י/ו יְהוּדָ֗ה וַ/יֹּאמֶר֮ בִּ֣י אֲדֹנִ/י֒ יְדַבֶּר נָ֨א עַבְדְּ/ךָ֤ דָבָר֙ בְּ/אָזְנֵ֣י אֲדֹנִ֔/י וְ/אַל יִ֥חַר אַפְּ/ךָ֖ בְּ/עַבְדֶּ֑/ךָ כִּ֥י כָמ֖וֹ/ךָ כְּ/פַרְעֹֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/018.yaml
  text: Then Judah came near to him and said[a], “Please, my lord, let your servant speak a word in my lord’s hearing, and do not let your anger burn against your servant[c][b], for you are like Pharaoh.”
translation:
  language: te
  text: 'అప్పుడు యూదా అతని దగ్గరకు వచ్చి ఇలా అన్నాడు: “దయచేసి, నా ప్రభూ, మీ సేవకుడు నా ప్రభువు సమక్షంలో ఒక మాట మాట్లాడనివ్వండి. మీ సేవకుని మీద మీ కోపం రగలనివ్వకండి; ఎందుకంటే మీరు ఫరోవంటివారు.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּגַּשׁ אֵלָיו
  choice: అతని దగ్గరికి వచ్చి
  rationale: యూదా యోసేపును సమీపించిన భౌతిక కదలికను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: בִּי אֲדֹנִי
  choice: దయచేసి, నా ప్రభూ
  rationale: בִּי అనే వినయపూర్వక విన్నపాన్ని ‘దయచేసి’గా, అֲדֹנִי గౌరవసూచక సంబోధనను ‘నా ప్రభూ’గా నిలుపుతుంది.
- source_word: יְדַבֶּר נָא עַבְדְּךָ דָבָר
  choice: నీ సేవకుడు ... ఒక మాట చెప్పనివ్వు
  rationale: యూదా తనను తాను ‘నీ సేవకుడు’ అని వినయంగా పేర్కొనడాన్నీ, דָבָר ఏకవచన రూపాన్నీ నిలుపుతుంది.
- source_word: בְּאָזְנֵי אֲדֹנִי
  choice: నా ప్రభువు వినేలా
  rationale: అక్షరార్థంగా ‘నా ప్రభువు చెవుల్లో’ అనే హీబ్రూ నుడికారానికి సహజమైన తెలుగు భావవ్యక్తీకరణ.
- source_word: וְאַל יִחַר אַפְּךָ בְּעַבְדֶּךָ
  choice: నీ సేవకునిపై నీ కోపం రగలనివ్వకు
  rationale: కోపం ‘రగలడం’ అనే మూలభాష రూపకాన్ని చదవదగిన తెలుగులో కాపాడుతుంది.
- source_word: כִּי כָמוֹךָ כְּפַרְעֹה
  choice: ఎందుకంటే నీవు ఫరోతో సమానమైనవాడివి
  rationale: యూదా దృష్టిలో యోసేపుకు ఫరోతో సమానమైన ప్రతినిధి అధికారం, హోదా ఉన్నాయనే సందర్భార్థాన్ని తెలుపుతుంది; స్వరూపసమానత్వాన్ని సూచించదు.
theological_decisions:
- issue: כִּי כָמוֹךָ כְּפַרְעֹה లోని పోలిక పరిధి
  choice: ఫరోతో సమానమైనవాడివి
  alternative: ఫరోవంటివాడివి
  rationale: ఈ సందర్భంలో పోలిక అధికారం, హోదాకు సంబంధించినది. ‘సమానమైనవాడివి’ బలమైన పోలికను నిలుపుతుంది; దాని సందర్భపరమైన పరిధిని అనవసరంగా సిద్ధాంతీకరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో రాజసభకు తగిన గౌరవపూర్వక, వినయపూర్వక ధోరణి ఉంచబడింది. ‘నా ప్రభూ’, ‘నీ సేవకుడు’ వంటి మూలంలోని సంబోధనలు నిలుపబడ్డాయి; ‘కోపం రగలడం’ అనే హీబ్రూ రూపకం సహజంగా సంరక్షించబడింది.
