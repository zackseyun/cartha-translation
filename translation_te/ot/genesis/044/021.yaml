review_pass:
  verdict: revise
  source_fidelity: The draft correctly retains the narrative sequence, direct second-person address, plural command, movement to Joseph, and the basic sense of the Hebrew idiom. However, “స్వయంగా” (“personally”) is not expressed in the Hebrew, and “చూడాలి” introduces an obligation/necessity nuance rather than the cohortative purpose, “that I may see/look on him.”
  naturalness: The wording is generally clear modern Telugu. Recasting the final purpose clause as “నేను అతనిని చూడగలిగేలా” is more natural and accurately expresses the intended result without added modality. “దిగివచ్చేలా” suitably preserves the descent nuance.
  terminology: “సేవకులు” is appropriate in this court context. The footnote correctly identifies the literal Hebrew imagery and appropriately preserves its semantic range without making a theological or interpretive claim.
  issues:
  - severity: medium
    issue: The main text adds “స్వయంగా” and uses “చూడాలి.”
    rationale: The Hebrew says literally, “that I may set my eye on him,” with a first-person cohortative expressing intended purpose. It does not explicitly mean “personally,” nor does it express that Joseph “must” see him. The added adverb and modal wording narrow and alter the force.
  revised_text: అప్పుడు నీవు నీ సేవకులతో, “అతనిని నా దగ్గరికి దిగివచ్చేలా తీసుకురండి; నేను అతనిని చూడగలిగేలా” అని చెప్పావు.
