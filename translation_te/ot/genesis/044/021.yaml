  yaml_path: translation/ot/genesis/044/021.yaml
  text: Then you said to your servants[a], ‘Bring him down to me, that I may set my eyes on him.’
translation:
  language: te
  text: అప్పుడు నీవు నీ సేవకులతో, “అతనిని నా దగ్గరికి దిగివచ్చేలా తీసుకురండి; నేను అతనిని చూడగలిగేలా” అని చెప్పావు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: అప్పుడు నీవు ... చెప్పావు
  rationale: కథన క్రమాన్ని సూచించే wayyiqtol రూపాన్ని సహజమైన ఆధునిక తెలుగులో ‘అప్పుడు’తో వ్యక్తపరచి, యూదా యోసేపును నేరుగా సంబోధిస్తున్న రెండవ పురుష ఏకవచనాన్ని నిలిపింది.
- source_word: עֲבָדֶיךָ
  choice: నీ సేవకులతో
  rationale: ఈ రాజసభ సందర్భంలో עבד అనేది బానిసత్వ స్థితికన్నా యోసేపుకు లోబడిన సేవకులను సూచిస్తుంది; కాబట్టి ‘సేవకులు’ సందర్భోచితం.
- source_word: הוֹרִדֻהוּ
  choice: అతణ్ణి ... దిగివచ్చేలా తీసుకురండి
  rationale: ירד యొక్క హిఫీల్ ఆజ్ఞారూపంలోని కారణార్థాన్ని, అలాగే కనానునుండి ఐగుప్తుకు ‘దిగివచ్చే’ దిశాభావాన్ని స్పష్టంగా నిలిపింది.
- source_word: אֵלַי
  choice: నా దగ్గరికి
  rationale: యోసేపు వైపు వ్యక్తిగతంగా తీసుకురావాలనే గమనాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: וְאָשִׂימָה עֵינִי עָלָיו
  choice: నేను అతణ్ణి స్వయంగా చూడాలి
  rationale: అక్షరార్థంగా ‘నా కన్ను అతనిమీద ఉంచుతాను’ అనే హెబ్రీయ నుడికారం చూడడం, పరిశీలించడం లేదా ప్రత్యేక శ్రద్ధ చూపడం అనే భావాలను కలిగి ఉండవచ్చు. ప్రధాన పాఠ్యంలో సహజమైన ‘స్వయంగా చూడాలి’ని ఎంచుకుని, విస్తృత భావాన్ని పాదటిప్పణిలో ఉంచింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన కథన శైలి. ‘దిగివచ్చేలా తీసుకురండి’ ప్రయాణ దిశను నిలుపుతుంది; అస్పష్టమైన హెబ్రీయ నుడికారాన్ని ప్రధాన పాఠ్యంలో అతిగా వ్యాఖ్యానించకుండా, పాదటిప్పణిలో దాని భావ పరిధిని తెలిపింది.
