source:
  edition: WLC
  text: וַֽ/יִּקְרְע֖וּ שִׂמְלֹתָ֑/ם וַֽ/יַּעֲמֹס֙ אִ֣ישׁ עַל חֲמֹר֔/וֹ וַ/יָּשֻׁ֖בוּ הָ/עִֽירָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/013.yaml
  text: Then they tore their clothes[a], and each man loaded his donkey, and they returned to the city.
translation:
  language: te
  text: అప్పుడు వారు తమ బట్టలు చింపుకున్నారు,[a] ప్రతి ఒక్కరూ తన గాడిదపై సామాను ఎక్కించుకొని పట్టణానికి తిరిగి వెళ్లారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘తమ వస్త్రాలు.’ హీబ్రూ పదం సాధారణంగా దుస్తులను, ముఖ్యంగా పైదుస్తులను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְעוּ
  choice: చింపుకొని
  rationale: קרע ఇక్కడ దుఃఖం, దిగ్భ్రాంతి లేదా తీవ్ర కలతను వ్యక్తం చేసే సూచక చర్యగా బట్టలు చింపుకోవడాన్ని తెలియజేస్తుంది. తెలుగు కథనంలో ‘బట్టలు చింపుకొని’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: שִׂמְלֹתָם
  choice: తమ బట్టలు
  rationale: שִׂמְלָה సాధారణంగా వస్త్రం లేదా పైదుస్తును సూచించగలదు. ఆధునిక సాధారణ తెలుగులో ‘బట్టలు’ సహజమైన విస్తృత పదం.
- source_word: וַיַּעֲמֹס אִישׁ עַל חֲמֹרוֹ
  choice: ప్రతి ఒక్కరూ తమ గాడిద మీద మళ్లీ సామాను ఎక్కించుకొని
  rationale: עמס అంటే బరువు లేదా సామాను ఎక్కించడం. אִישׁ ఇక్కడ విభజనార్థకంగా ‘ఒక్కొక్కరు’ అనే భావాన్ని ఇస్తుంది. సందర్భంలో తనిఖీ కోసం దించిన సామానును తిరిగి ఎక్కించారని ‘మళ్లీ’ సహజంగా స్పష్టం చేస్తుంది.
- source_word: אִישׁ
  choice: ప్రతి ఒక్కరూ
  rationale: సమూహంలోని ఒక్కొక్క పురుషుని సూచించే విభజనార్థక ఏకవచనం. తెలుగులో ‘ప్రతి ఒక్కరూ’ సహజంగా అదే పంపిణీ భావాన్ని అందిస్తుంది; సందర్భం వారు పురుషులని ఇప్పటికే స్పష్టం చేస్తుంది.
- source_word: חֲמֹרוֹ
  choice: తమ గాడిద
  rationale: חֲמוֹר కు ఆధునిక ప్రామాణిక తెలుగు సమానార్థకం ‘గాడిద’. పంపిణీ నిర్మాణంలో తెలుగు సహజ ప్రయోగం ప్రకారం ‘తమ’ వాడబడింది.
- source_word: וַיָּשֻׁבוּ
  choice: తిరిగి వెళ్లారు
  rationale: שׁוּב అంటే తిరిగి వెళ్లడం లేదా రావడం. వారు పట్టణం వెలుపల నుంచి పట్టణానికి వెళ్తున్నందున ‘తిరిగి వెళ్లారు’ దిశను సహజంగా తెలియజేస్తుంది.
- source_word: הָעִירָה
  choice: పట్టణానికి
  rationale: దిశార్థక הָ- పట్టణం వైపు కదలికను సూచిస్తుంది. తెలుగులో దత్తివిభక్తితో ‘పట్టణానికి’ అని సహజంగా వ్యక్తమవుతుంది.
