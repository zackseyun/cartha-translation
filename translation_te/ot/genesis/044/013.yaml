translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన, గౌరవప్రదమైన కథన శైలి. హీబ్రూ వరుస చర్యలను తెలుగు సంయుక్త క్రియలతో ప్రవాహవంతంగా అందించింది.
