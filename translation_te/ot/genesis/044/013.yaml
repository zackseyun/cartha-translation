- from: అప్పుడు వారు తమ బట్టలు చింపుకొని,[a] ప్రతి ఒక్కరూ తమ గాడిద మీద మళ్లీ సామాను ఎక్కించుకొని పట్టణానికి తిరిగి వెళ్లారు.
  to: అప్పుడు వారు తమ బట్టలు చింపుకున్నారు,[a] ప్రతి ఒక్కరూ తన గాడిదపై సామాను ఎక్కించుకొని పట్టణానికి తిరిగి వెళ్లారు.
  rationale: Removed the unsupported “మళ్లీ” while retaining the Hebrew’s concrete actions, its distributive sense (“each man”), and the directional sense of returning to the city. The finite verb “చింపుకున్నారు” presents the first action clearly in Telugu narrative style.
