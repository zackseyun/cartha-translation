  yaml_path: translation/ot/genesis/044/019.yaml
  text: My lord asked his servants, saying, ‘Do you have a father or a brother?’
translation:
  language: te
  text: “నా ప్రభువు తన సేవకులను, ‘మీకు తండ్రి గానీ సహోదరుడు గానీ ఉన్నారా?’ అని అడిగారు.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲדֹנִי
  choice: నా ప్రభువు
  rationale: ఈజిప్టు అధికారిని ఉద్దేశించిన గౌరవపూర్వక సంబోధనను నిలుపుతుంది; సందర్భంలోని ఏకవచన సంబోధ్యునికి సరిపోతుంది.
- source_word: שָׁאַל
  choice: అడిగారు
  rationale: ప్రత్యక్ష ప్రశ్న సందర్భంలో సహజమైన ఆధునిక తెలుగు; సంబోధ్యునిపట్ల గౌరవాన్ని బహువచన క్రియ సూచిస్తుంది.
- source_word: עֲבָדָיו
  choice: తన సేవకులను
  rationale: సోదరులు రాజసభా వినయంతో తమను తాము సేవకులుగా పేర్కొంటున్నారు; ఈ సందర్భంలో ‘దాసులు’ అనడం అవసరానికి మించి బానిసత్వ భావాన్ని ముందుకు తెచ్చే అవకాశం ఉంది.
- source_word: לֵאמֹר
  choice: అని
  rationale: ప్రశ్నలోని మాటలను పరిచయం చేయడానికి తెలుగులో సహజమైన ఉద్ధరణ సూచకం; ‘చెబుతూ’ అనే హెబ్రీ నిర్మాణాన్ని కృత్రిమంగా అనుకరించదు.
- source_word: הֲיֵשׁ לָכֶם
  choice: మీకు … ఉన్నారా?
  rationale: యֵשׁ + ל అనే అస్తిత్వం ద్వారా స్వామ్యాన్ని తెలిపే నిర్మాణానికి సహజమైన తెలుగు సమానం.
- source_word: אָב
  choice: తండ్రి
  rationale: ప్రశ్నలో కుటుంబ సంబంధాన్ని ఏకవచనంలో యథాతథంగా ఉంచుతుంది; తెలుగులో అనిర్దిష్ట ఉపపదం అవసరం లేదు.
- source_word: אָח
  choice: సహోదరుడు
  rationale: మూలంలోని ఏకవచన పురుష సహోదర సంబంధాన్ని స్పష్టంగా, గౌరవనీయమైన ఆధునిక శైలిలో తెలియజేస్తుంది.
- source_word: אוֹ
  choice: గానీ … గానీ
  rationale: రెండు ప్రత్యామ్నాయ కుటుంబ సంబంధాల మధ్యనున్న ‘లేదా’ భావాన్ని ప్రశ్నలో సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవపూర్వక రాజసభా సంభాషణ. యూదా తనను మరియు తన సోదరులను ‘సేవకులు’గా పేర్కొనే వినయాన్ని నిలిపి, యోసేపును ఉద్దేశించిన క్రియలో గౌరవ బహువచనం వాడబడింది.
