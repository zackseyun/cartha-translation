reference: Genesis 44:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְצַ֞ו אֶת אֲשֶׁ֣ר עַל בֵּית/וֹ֮ לֵ/אמֹר֒ מַלֵּ֞א אֶת אַמְתְּחֹ֤ת הָֽ/אֲנָשִׁים֙ אֹ֔כֶל כַּ/אֲשֶׁ֥ר יוּכְל֖וּ/ן שְׂאֵ֑ת וְ/שִׂ֥ים כֶּֽסֶף אִ֖ישׁ בְּ/פִ֥י אַמְתַּחְתּֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/001.yaml
  text: Then he commanded the one over his house[a], saying, “Fill the men's sacks with food, as much as they can carry, and put each man's silver in the mouth of his sack.”
translation:
  language: te
  text: 'అప్పుడు అతడు తన ఇంటి వ్యవహారాల బాధ్యతలో ఉన్నవానికి ఇలా ఆజ్ఞాపించాడు: “ఆ మనుష్యుల సంచులను వారు మోయగలిగినంత ఆహారంతో నింపు. ప్రతి మనిషి వెండిని అతని సంచి నోటిలో[a] పెట్టు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ‘అతని సంచి నోటిలో’; అంటే అతని సంచి తెరువు వద్ద.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: అప్పుడు అతడు ... ఆజ్ఞాపించాడు
  rationale: కథనాన్ని ముందుకు నడిపే వయ్యిక్టోల్ రూపాన్ని ‘అప్పుడు’ సహజంగా వ్యక్తం చేస్తుంది; צוה యొక్క ఆజ్ఞాపించే భావం నిలిచి ఉంటుంది.
- source_word: אֲשֶׁר עַל בֵּיתוֹ
  choice: తన ఇంటి బాధ్యతలో ఉన్నవానికి
  rationale: అక్షరార్థంగా ‘తన ఇంటి మీద ఉన్నవాడు.’ యోసేపు ఇంటి నిర్వహణ బాధ్యత వహించే వ్యక్తిని సూచిస్తుంది; ‘గృహనిర్వాహకుడు’ అనే కొంత వివరణాత్మక పదం కంటే ఈ రూపం మూలానికి దగ్గరగా, ఆధునిక తెలుగులో స్పష్టంగా ఉంది.
- source_word: מַלֵּא
  choice: నింపు
  rationale: מלא క్రియ యొక్క ఆజ్ఞార్థక రూపాన్ని సహజమైన తెలుగు ఆజ్ఞగా అందిస్తుంది.
- source_word: אַמְתְּחֹת
  choice: సంచులు
  rationale: ప్రయాణంలో ధాన్యం లేదా ఆహార పదార్థాలు మోసే పెద్ద సంచులను సూచిస్తుంది; సాధారణ ‘బ్యాగులు’ కంటే ప్రాచీన సందర్భానికి తగినది.
- source_word: הָאֲנָשִׁים
  choice: ఆ మనుష్యుల
  rationale: మూలంలోని నిర్దిష్ట బహువచన పురుషవాచకాన్ని అలాగే ఉంచుతుంది; సందర్భాన్ని బట్టి ‘సోదరులు’ అని మూలంలో లేని గుర్తింపును చేర్చదు.
- source_word: אֹכֶל
  choice: ఆహారం
  rationale: ఈ పదం సాధారణంగా తినే పదార్థాన్ని సూచిస్తుంది. సందర్భంలో ధాన్యం ఉన్నప్పటికీ, మూలపాఠంలోని విస్తృత అర్థాన్ని కాపాడుతుంది.
- source_word: כַּאֲשֶׁר יוּכְלוּן שְׂאֵת
  choice: వారు మోయగలిగినంత
  rationale: సామర్థ్యం మరియు మోయడం అనే రెండు భావాలను సహజమైన తెలుగు ప్రయోగంలో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: וְשִׂים
  choice: పెట్టు
  rationale: שים అనే సాధారణ ‘పెట్టు/ఉంచు’ భావాన్ని ఈ సందర్భంలో సహజంగా అందిస్తుంది.
- source_word: כֶּסֶף אִישׁ
  choice: ప్రతి మనిషి వెండిని
  rationale: אישׁ యొక్క పంపిణీ భావాన్ని ‘ప్రతి మనిషి’గా, כסף యొక్క ‘వెండి’ అనే పదార్థ/చెల్లింపు భావాన్ని అతిగా వివరణ చేయకుండా నిలుపుతుంది.
- source_word: בְּפִי אַמְתַּחְתּוֹ
  choice: అతని సంచి నోటిలో
  rationale: హీబ్రూ భాషలోని ‘సంచి నోరు’ అనే రూపకాన్ని నిలుపుతుంది; దాని భావాన్ని పాదసూచిక స్పష్టం చేస్తుంది.
