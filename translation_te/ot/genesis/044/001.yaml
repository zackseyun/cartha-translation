translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. మూలంలోని ఆజ్ఞల సంక్షిప్తతను నిలుపుతూ, ఇంటి అధికారి పాత్రను అతిగా నిర్దిష్టం చేయకుండా అనువదించబడింది. అందించిన ఆంగ్ల పాఠంలో [a] గుర్తు ‘house’ తర్వాత ఉన్నప్పటికీ, పాదసూచిక విషయం בְּפִי אַמְתַּחְתּוֹ (‘సంచి నోటిలో’)కి సంబంధించినందున తెలుగు ప్రధాన పాఠంలో గుర్తును సంబంధిత పదబంధం వద్ద ఉంచాం.
