  terminology: ‘చిన్న సోదరుడు’ clearly denotes the youngest brother and is suitably neutral and standard for this narrative register. ‘సేవకులు’ preserves Judah’s deferential self-reference. The footnote retains the contextual idiom without replacing the literal main-text expression.
