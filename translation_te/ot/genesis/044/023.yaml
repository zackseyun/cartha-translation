base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/023.yaml
  text: And you said to your servants[a], ‘If your youngest brother does not come down with you, you shall not continue to see my face.’
translation:
  language: te
  text: మీరు మీ సేవకులతో, “మీ చిన్న సోదరుడు మీతో కలిసి దిగిరాకపోతే, మీరు ఇకపై నా ముఖాన్ని చూడరు[a]” అని చెప్పారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, నుడికారంగా, “మీరు ఇకపై నా ఎదుటికి రారు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: అని చెప్పావు
  rationale: కథన క్రమంలోని సాధారణ భూతకాల క్రియగా సహజమైన తెలుగులో అనువదించబడింది; వాక్య నిర్మాణానికి అనుగుణంగా ఉద్ధరణ తర్వాత ఉంచబడింది.
- source_word: עֲבָדֶיךָ
  choice: నీ సేవకులతో
  rationale: యూదా యోసేపుతో వినయపూర్వకంగా మాట్లాడుతున్న రాజసభా సందర్భంలో ‘సేవకులు’ అనేది తగిన గౌరవసూచక స్వీయప్రస్తావన; ఇక్కడ బానిసత్వ స్థితిని ప్రత్యేకంగా ముందుకు తేవడం లేదు.
- source_word: אִם לֹא
  choice: రాకపోతే
  rationale: హీబ్రూ ప్రతికూల షరతును తెలుగులో సహజమైన ‘-కపోతే’ నిర్మాణంతో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: יֵרֵד
  choice: దిగిరాకపోతే
  rationale: ירד లోని ‘దిగు’ అనే దిశాభావాన్ని నిలుపుతూ, ఐగుప్తులో ఉన్న వక్త వైపు రావడాన్ని ‘దిగిరా’ అని సహజంగా తెలిపింది.
- source_word: אֲחִיכֶם הַקָּטֹן
  choice: మీ చిన్న తమ్ముడు
  rationale: సోదరులలో వయస్సులో చిన్నవాడిని సూచిస్తుంది. సందర్భంలో వారందరూ అన్నలే కనుక ఆధునిక తెలుగులో ‘చిన్న తమ్ముడు’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: אִתְּכֶם
  choice: మీతో కలిసి
  rationale: సహవాసం లేదా వెంట రావడాన్ని స్పష్టంగా తెలిపే సహజమైన తెలుగు ప్రయోగం.
- source_word: לֹא תֹסִפוּן
  choice: మీరు మళ్లీ ... చూడరు
  rationale: ఇకపై ఆ కార్యం మరొకసారి జరగదనే יסף నిర్మాణ భావాన్ని ‘మళ్లీ ... చూడరు’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לִרְאוֹת פָּנָי
  choice: నా ముఖం చూడరు
  rationale: హీబ్రూలోని సజీవమైన ‘నా ముఖం చూడడం’ అనే వ్యక్తీకరణను ప్రధాన పాఠ్యంలో నిలిపింది; దాని సందర్భోచిత నుడికార అర్థాన్ని పాదసూచికలో ఇచ్చింది.
