source:
  edition: WLC
  text: וְ/אֶת גְּבִיעִ֞/י גְּבִ֣יעַ הַ/כֶּ֗סֶף תָּשִׂים֙ בְּ/פִי֙ אַמְתַּ֣חַת הַ/קָּטֹ֔ן וְ/אֵ֖ת כֶּ֣סֶף שִׁבְר֑/וֹ וַ/יַּ֕עַשׂ כִּ/דְבַ֥ר יוֹסֵ֖ף אֲשֶׁ֥ר דִּבֵּֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/002.yaml
  text: And put my cup[a], the silver cup, in the mouth of the youngest one's sack, along with the silver for his grain purchase." And he did according to Joseph's word[b], which he had spoken.
translation:
  language: te
  text: “నా గిన్నెను, ఆ వెండి గిన్నెను, చిన్నవాడి సంచి నోటిలో[a], అతడు ధాన్యం కొనడానికి ఇచ్చిన వెండితోపాటు[b] పెట్టు” అని చెప్పాడు. యోసేపు చెప్పిన మాట ప్రకారమే అతడు చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా ‘సంచి నోటిలో’; అంటే సంచి తెరుచుకునే భాగంలో.
    reason: cultural_note
  - marker: b
    text: లేదా ‘అతని ధాన్యానికి చెల్లించిన డబ్బుతోపాటు’; ఇక్కడ హెబ్రీ పదబంధం ధాన్యం లేదా ఆహార పదార్థాలు కొనడానికి ఇచ్చిన వెండిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: גְּבִיעִי גְּבִיעַ הַכֶּסֶף
  choice: నా గిన్నెను, ఆ వెండి గిన్నెను
  rationale: גְּבִיעַ అంటే గిన్నె లేదా పానపాత్ర. ఆధునిక తెలుగులో సహజంగా అర్థమయ్యే ‘గిన్నె’ను ఎంచుకొని, హెబ్రీలోని వివరణాత్మక పునరుక్తిని నిలిపాము.
- source_word: תָּשִׂים
  choice: పెట్టు
  rationale: שׂים అనే సాధారణ క్రియకు సందర్భానుసారంగా నేరుగా, సహజంగా సరిపోయే రూపం.
- source_word: בְּפִי אַמְתַּחַת
  choice: సంచి నోటిలో
  rationale: హెబ్రీలోని ‘సంచి నోరు’ అనే స్పష్టమైన రూపకాన్ని నిలిపి, అది సంచి తెరుచుకునే భాగాన్ని సూచిస్తుందని పాదసూచికలో వివరించాము.
- source_word: הַקָּטֹן
  choice: చిన్నవాడి
  rationale: అక్షరార్థంగా ‘చిన్నవాడు/యువకుడు’; సందర్భంలో సోదరులలో చిన్నవాడిని సూచిస్తుంది. మూలంలో లేని ‘సోదరుడు’ అనే నామవాచకాన్ని చేర్చలేదు.
- source_word: כֶּסֶף שִׁבְרוֹ
  choice: అతడు ధాన్యం కొనడానికి ఇచ్చిన వెండి
  rationale: כֶּסֶף యొక్క భౌతిక అర్థమైన ‘వెండి’ని, שִׁבְרוֹ యొక్క ధాన్యం కొనుగోలు భావాన్ని రెండింటినీ సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וַיַּעַשׂ כִּדְבַר יוֹסֵף אֲשֶׁר דִּבֵּר
  choice: యోసేపు చెప్పిన మాట ప్రకారమే అతడు చేశాడు
  rationale: ‘యోసేపు మాట ప్రకారం’ అనే మూల నిర్మాణాన్ని కాపాడుతూ, హెబ్రీ సాపేక్ష వాక్యంలోని పునరుక్తిని సహజమైన తెలుగు వాక్యంగా మలిచాము; ‘ఆజ్ఞ’ అని అనువదించి భావాన్ని అధికంగా నిర్ధారించలేదు.
