  register: ఆధునిక ప్రామాణిక తెలుగు; సరళమైనప్పటికీ గౌరవప్రదమైన కథన శైలి. హీబ్రూ వాక్యంలోని మూడు భాగాలను తెలుగులో స్పష్టత కోసం మూడు చిన్న వాక్యాలుగా ఇచ్చాం; సంఘటనల క్రమం మరియు యోసేపు అక్కడే ఉన్నాడనే సందర్భస్థితి నిలుపబడ్డాయి.
