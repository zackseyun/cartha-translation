- from: యూదా, అతని సోదరులు యోసేపు ఇంటికి వచ్చారు. అతడు ఇంకా అక్కడే ఉన్నాడు. వారు అతని ఎదుట నేలమీద సాగిలపడ్డారు.
  to: యూదా మరియు అతని సోదరులు యోసేపు ఇంటిలోకి వచ్చారు. అతడు ఇంకా అక్కడే ఉన్నాడు. వారు అతని ఎదుట నేలమీద సాగిలపడ్డారు.
