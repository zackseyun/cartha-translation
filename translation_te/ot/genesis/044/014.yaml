  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּבֹ֨א יְהוּדָ֤ה וְ/אֶחָי/ו֙ בֵּ֣יתָ/ה יוֹסֵ֔ף וְ/ה֖וּא עוֹדֶ֣/נּוּ שָׁ֑ם וַ/יִּפְּל֥וּ לְ/פָנָ֖י/ו אָֽרְצָ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/014.yaml
  text: Then Judah and his brothers came into Joseph’s house[a]. He was still there[b], and they fell to the ground before him.
translation:
  language: te
  text: యూదా మరియు అతని సోదరులు యోసేపు ఇంటిలోకి వచ్చారు. అతడు ఇంకా అక్కడే ఉన్నాడు. వారు అతని ఎదుట నేలమీద సాగిలపడ్డారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  choice: వచ్చారు
  rationale: בוא కథనాన్ని సాధారణ భూతకాల చర్యగా ముందుకు నడిపిస్తుంది. యూదాతో పాటు అతని సోదరులు కర్తలుగా ఉన్నందున తెలుగులో గౌరవార్థక బహువచన క్రియ సహజంగా ఉంటుంది.
- source_word: יְהוּדָה וְאֶחָיו
  choice: యూదా, అతని సోదరులు
  rationale: యూదాను ప్రధాన వ్యక్తిగా ప్రత్యేకంగా పేర్కొంటూనే, אֶחָיו లోని కుటుంబ సంబంధాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: בֵּיתָה יוֹסֵף
  choice: యోసేపు ఇంటికి
  rationale: దిశను సూచించే ה స్థానాంతాన్ని తెలియజేస్తుంది. సందర్భంలో ఇంటి లోపలికి చేరడమే భావమైనా, ఆధునిక తెలుగులో ‘ఇంటికి వచ్చారు’ సహజంగా ఆ గమనాన్ని వ్యక్తం చేస్తుంది.
- source_word: וְהוּא עוֹדֶנּוּ שָׁם
  choice: అతడు ఇంకా అక్కడే ఉన్నాడు
  rationale: עוֹדֶנּוּ కొనసాగుతున్న స్థితిని సూచిస్తుంది; ‘ఇంకా అక్కడే’ ఆ భావాన్ని సహజంగా, స్పష్టంగా అందిస్తుంది.
- source_word: וַיִּפְּלוּ
  choice: సాగిలపడ్డారు
  rationale: మూల క్రియ యొక్క ప్రాథమిక భావం ‘పడిపోయారు’ అయినా, לְפָנָיו אָרְצָה తో కలిసినప్పుడు గౌరవపూర్వకంగా నేలపై వంగిపడటాన్ని సూచిస్తుంది. ‘సాగిలపడ్డారు’ ఈ సందర్భార్థాన్ని సహజంగా అందిస్తుంది.
- source_word: לְפָנָיו
  choice: అతని ఎదుట
  rationale: ‘అతని ముఖం ముందు’ అనే హీబ్రూ నుడికారానికి సహజమైన తెలుగు సమానం.
- source_word: אָרְצָה
  choice: నేలమీద
  rationale: కిందికి, నేలవైపు జరిగిన కదలికను సందర్భానుగుణంగా స్పష్టంగా తెలియజేస్తుంది.
