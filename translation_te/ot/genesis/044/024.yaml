  yaml_path: translation/ot/genesis/044/024.yaml
  text: And when we went up to your servant my father[a], we told him the words of my lord.
translation:
  language: te
  text: మేము నీ సేవకుడైన నా తండ్రి వద్దకు పైకి వెళ్లినప్పుడు[a], నా ప్రభువు మాటలను అతనికి తెలియజేశాము.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, ‘నా తండ్రి, నీ సేవకుడు.’ హీబ్రూ పదక్రమం: ‘నీ సేవకుడు, నా తండ్రి.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּי
  choice: వెళ్లినప్పుడు
  rationale: హీబ్రూ కథన సూత్రం తదుపరి సంఘటనను పరిచయం చేస్తుంది. తెలుగులో ప్రత్యేకంగా ‘అప్పుడు ఇలా జరిగింది’ అని చేర్చకుండా కాలసంబంధ ఉపవాక్యంతో సహజంగా వ్యక్తమవుతుంది.
- source_word: עָלִינוּ
  choice: వెళ్లినప్పుడు
  rationale: עלה అంటే అక్షరార్థంగా ‘పైకి వెళ్లడం’; ఇక్కడ ఐగుప్తు నుంచి కనానుకు ప్రయాణాన్ని సూచిస్తుంది. తెలుగులో ‘దగ్గరికి వెళ్లడం’ సహజంగా ఉంది; దిశాసూచక భావం సందర్భంలో నిలుస్తుంది.
- source_word: אֶל עַבְדְּךָ אָבִי
  choice: నీ సేవకుడైన నా తండ్రి దగ్గరికి
  rationale: ‘నీ సేవకుడు, నా తండ్రి’ అనే హీబ్రూ క్రమంలోని విధేయతా భావాన్ని కాపాడుతూ, ఆధునిక తెలుగులో సంబంధాన్ని స్పష్టంగా తెలిపేందుకు ‘సేవకుడైన’ వాడబడింది.
- source_word: וַנַּגֶּד לוֹ
  choice: అతనికి తెలియజేశాము
  rationale: נגד హిఫీల్ రూపం ‘తెలియజేయడం, చెప్పడం’ అనే భావం ఇస్తుంది. ‘తెలియజేశాము’ గౌరవభరితమైన కథన శైలికి సహజంగా సరిపోతుంది.
- source_word: אֵת דִּבְרֵי אֲדֹנִי
  choice: నా ప్రభువు చెప్పిన మాటలను
  rationale: דִּבְרֵי యొక్క ‘మాటలు’ అనే భావాన్ని నిలుపుతూ, אֲדֹנִיని దేవుని నామంగా కాక యోసేపుకు ఇచ్చిన గౌరవపూర్వక మానవ బిరుదుగా ‘నా ప్రభువు’ అని అనువదించాం. తెలుగులో సంబంధాన్ని సహజం చేయడానికి ‘చెప్పిన’ చేర్చబడింది.
