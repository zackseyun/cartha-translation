translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; యూదా మాటల్లోని గౌరవపూర్వక, విధేయ సంభాషణా ధోరణి నిలుపబడింది. హీబ్రూ పదక్రమంలోని స్వల్ప సందిగ్ధతను పాదసూచికలో ఇచ్చాం.
