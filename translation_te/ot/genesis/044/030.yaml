source:
  edition: WLC
  text: וְ/עַתָּ֗ה כְּ/בֹאִ/י֙ אֶל עַבְדְּ/ךָ֣ אָבִ֔/י וְ/הַ/נַּ֖עַר אֵינֶ֣/נּוּ אִתָּ֑/נוּ וְ/נַפְשׁ֖/וֹ קְשׁוּרָ֥ה בְ/נַפְשֽׁ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/030.yaml
  text: Now[a], when I come to your servant my father[b], and the boy is not with us—his life being bound up with the boy’s life—
translation:
  language: te
  text: ఇప్పుడు నేను నీ సేవకుడైన నా తండ్రి దగ్గరకు వచ్చినప్పుడు, ఈ అబ్బాయి మాతో లేక, ఆయన ప్రాణం ఈ అబ్బాయి ప్రాణంతో ముడిపడి ఉండగా[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “అతని నెఫెష్ అతని నెఫెష్‌తో ముడిపడి ఉంది.” ఇక్కడ హీబ్రూ נֶפֶשׁ (నెఫెష్) అనే పదం ఇద్దరి విషయంలోనూ ‘ప్రాణం/జీవితం/వ్యక్తి’ అనే భావ పరిధిలో వాడబడింది. మొదటి ‘అతని’ తండ్రిని, రెండవది సందర్భానుసారం ఈ అబ్బాయిని, అంటే బెన్యామీనును, సూచిస్తుంది. ఈ భాగాన్ని “ఆయన ప్రాణం ఈ అబ్బాయి ప్రాణంతో ముడిపడి ఉంది” అని కూడా అనువదించవచ్చు.
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: ఇప్పుడు
  rationale: యూదా విజ్ఞాపనలో తదుపరి పరిస్థితిని ప్రవేశపెడుతుంది; సంభాషణ ప్రవాహంలో וְ యొక్క అనుసంధాన భావం సహజంగా ఇమిడిపోతుంది.
- source_word: כְּבֹאִי
  choice: నేను ... వెళ్లినప్పుడు
  rationale: כְּ + క్రియానామం + ప్రథమ పురుష ఏకవచన ప్రత్యయం కాలార్థాన్ని ఇస్తుంది. గమ్యస్థానం వ్యక్తి దగ్గరికి కావడంతో తెలుగులో ‘వెళ్లినప్పుడు’ సహజం.
- source_word: אֶל־עַבְדְּךָ אָבִי
  choice: నీ సేవకుడైన నా తండ్రి దగ్గరికి
  rationale: యోసేపుతో వినయంగా మాట్లాడుతూ యాకోబును ‘నీ సేవకుడు’ అని పేర్కొనే సంబంధాన్ని స్పష్టంగా, సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: הַנַּעַר
  choice: ఈ అబ్బాయి
  rationale: נַעַר బాలుడు లేదా యువకుడిని సూచించగలదు. సందర్భంలోని కుటుంబ, భావోద్వేగ స్వరాన్ని ‘అబ్బాయి’ సహజంగా అందిస్తుంది; ప్రత్యక్ష సందర్భం వల్ల ‘ఈ’ ఉపయోగించబడింది.
- source_word: אֵינֶנּוּ אִתָּנוּ
  choice: మాతో లేకపోతే
  rationale: హీబ్రూ ప్రతికూల అస్తిత్వ వ్యక్తీకరణను సరళంగా తెలుపుతుంది; వాక్యం తదుపరి వచనంలో పూర్తయ్యే షరతును సూచిస్తున్నందున ‘లేకపోతే’ అనుకూలం.
- source_word: וְנַפְשׁוֹ
  choice: ఆయన ప్రాణం
  rationale: ఇక్కడ נֶפֶשׁ సాంకేతికంగా ‘ఆత్మ’ కంటే తండ్రి జీవితం/ప్రాణాన్ని సూచిస్తుంది. గౌరవార్థక ‘ఆయన’ తండ్రిని సూచిస్తుంది.
- source_word: קְשׁוּרָה
  choice: ముడిపడి ఉంది
  rationale: నిష్క్రియ భావంలోని ఈ పదం గాఢమైన అనుబంధాన్ని సూచిస్తుంది; ‘ముడిపడి ఉంది’ ఆధునిక తెలుగులో సహజంగా ఆ తీవ్రతను అందిస్తుంది.
- source_word: בְנַפְשׁוֹ
  choice: ఈ అబ్బాయి ప్రాణంతో
  rationale: చివరి ప్రత్యయం సందర్భానుసారం బెన్యామీనును సూచిస్తుంది. తెలుగులో సందిగ్ధత రాకుండా సూచిత వ్యక్తిని స్పష్టంగా పేర్కొనబడింది.
theological_decisions:
- issue: వְנַפְשׁוֹ కְשׁוּרָה בְנַפְשׁוֹ అనే పరిస్థితేర్పాటు భాగానికి కారణార్థం ఉందా అనే సందిగ్ధత
  choice: ప్రధాన పాఠ్యంలో ‘కాబట్టి’తో వివరణాత్మక/కారణ సంబంధాన్ని వ్యక్తం చేయడం
  alternative: ‘ఆయన ప్రాణం ఈ అబ్బాయి ప్రాణంతో ముడిపడి ఉండగా’ అని కారణార్థాన్ని స్పష్టంగా చెప్పకుండా ఉంచడం
  rationale: ఈ భాగం అబ్బాయి లేకపోవడం ఎందుకు తీవ్రమో వివరిస్తుంది; అయినా హీబ్రూలో కారణసూచక అవ్యయం ప్రత్యక్షంగా లేనందున ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో నిలుపుతాము.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. యూదా వినయాన్ని ‘నీ సేవకుడైన నా తండ్రి’ ద్వారా నిలిపి, వాక్యం 31వ వచనంలో కొనసాగుతుందనే భావాన్ని చివరి డాష్‌తో సూచించాం.
