source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוּדָ֗ה מַה נֹּאמַר֙ לַֽ/אדֹנִ֔/י מַה נְּדַבֵּ֖ר וּ/מַה נִּצְטַדָּ֑ק הָ/אֱלֹהִ֗ים מָצָא֙ אֶת עֲוֺ֣ן עֲבָדֶ֔י/ךָ הִנֶּ/נּ֤וּ עֲבָדִים֙ לַֽ/אדֹנִ֔/י גַּם אֲנַ֕חְנוּ גַּ֛ם אֲשֶׁר נִמְצָ֥א הַ/גָּבִ֖יעַ בְּ/יָדֽ/וֹ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/016.yaml
  text: And Judah said[a], “What shall we say to my lord? What shall we speak? Or how shall we justify ourselves? God has found out the guilt of your servants. Here we are, my lord’s servants[c][b], both we and the one in whose hand the cup was found.”
translation:
  language: te
  text: 'యూదా ఇలా అన్నాడు: “నా ప్రభువా, మేమేమి చెప్పగలం? ఏమని మాట్లాడగలం? లేక మమ్మల్ని మేము ఎలా సమర్థించుకోగలం?[a] దేవుడు మీ సేవకుల దోషాన్ని కనుగొన్నాడు.[b] ఇదిగో, మేమూ, ఎవరి చేతిలో ఆ గిన్నె దొరికిందో అతడూ, నా ప్రభువుకు బానిసలము.[c]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “మమ్మల్ని మేము ఎలా నిర్దోషులమని నిరూపించుకోగలం?” హీబ్రూ క్రియ తాము న్యాయపక్షంలో ఉన్నామని చూపించుకోవడం లేదా తమను తాము సమర్థించుకోవడం అనే అర్థాలను ఇవ్వగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా “దేవుడు మీ సేవకుల దోషాన్ని బయటపెట్టాడు.” ఇక్కడి హీబ్రూ నుడికారం దాచబడిన దోషం వెలుగులోకి వచ్చిందనే భావాన్నీ కలిగి ఉంది.
    reason: lexical_alternative
  - marker: c
    text: మొదటి చోట “సేవకులు” అనేది ఉన్నతాధికారి ఎదుట వినయంగా తమను తాము సూచించుకునే మాట; చివరలోని “బానిసలు” వారు అంగీకరిస్తున్న బంధిత స్థితిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַאדֹנִי
  choice: నా ప్రభువుతో / మా ప్రభువుకు
  rationale: ఇక్కడ אָדוֹן దేవుని బిరుదు కాదు; అధికారస్థానంలో ఉన్న యోసేపును గౌరవంగా సంబోధించే మాట. ‘ప్రభువు’ రాజసభా సందర్భంలోని వినయాన్ని నిలుపుతుంది.
- source_word: נֹּאמַר / נְּדַבֵּר
  choice: మేమేమి చెప్పగలం? ఏమని మాట్లాడగలం?
  rationale: రెండు సమీపార్థక క్రియలతో ఏర్పడిన అలంకారాత్మక ప్రశ్నల క్రమాన్ని తెలుగులోనూ వేర్వేరు క్రియలతో నిలిపి, తమను సమర్థించుకోలేని నిస్సహాయతను వ్యక్తం చేసింది.
- source_word: נִּצְטַדָּק
  choice: మేము నిర్దోషులమని ఎలా నిరూపించుకోగలం?
  rationale: צדק హిత్పయేల్ రూపం తాము న్యాయపక్షంలో ఉన్నామని చూపించుకోవడం లేదా తమను తాము సమర్థించుకోవడం అనే భావాన్ని ఇస్తుంది. ఈ సందర్భంలో సహజమైన ఆధునిక తెలుగు కోసం ఈ రూపం ఎంచుకోబడింది.
- source_word: מָצָא אֶת עֲוֺן
  choice: అపరాధాన్ని బయటపెట్టాడు
  rationale: మָצָא సాధారణంగా ‘కనుగొన్నాడు’ అయినా, ఇక్కడ దాచబడిన దోషాన్ని దేవుడు వెలుగులోకి తెచ్చాడనే సందర్భార్థం ఉంది. ‘బయటపెట్టాడు’ ఆ నుడికారపు శక్తిని సహజంగా అందిస్తుంది.
- source_word: עֲוֺן
  choice: అపరాధం
  rationale: ఈ పదానికి దోషం, అపరాధం, పాపం లేదా దాని ఫలితమైన శిక్ష అనే అర్థాలు ఉండవచ్చు. ఇక్కడ సహోదరుల నైతిక దోషాన్ని సూచించే విస్తృత పదంగా ‘అపరాధం’ సరిపోతుంది.
- source_word: עֲבָדֶיךָ / עֲבָדִים
  choice: తమ సేవకులు / బానిసలు
  rationale: మొదటి ప్రయోగం ఉన్నతాధికారితో మాట్లాడేటప్పుడు వినయపూర్వక స్వీయసూచన; రెండవది వారు అంగీకరిస్తున్న బంధిత స్థితి. అందువల్ల సందర్భానుసారంగా వేర్వేరు తెలుగు పదాలు వాడబడ్డాయి.
- source_word: הִנֶּנּוּ
  choice: ఇదిగో, మేము
  rationale: లొంగుబాటును పరిచయం చేసే సమర్పణాత్మక బలాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: גַּם אֲנַחְנוּ גַּם אֲשֶׁר נִמְצָא הַגָּבִיעַ בְּיָדוֹ
  choice: మేమూ, ఎవరి చేతిలో ఆ గిన్నె దొరికిందో అతడూ
  rationale: రెండుసార్లు వచ్చిన גַּם సహోదరులందరినీ, ప్రత్యేకంగా గిన్నె దొరికిన వ్యక్తినీ కలిపి సూచిస్తుంది. ‘చేతిలో’ అన్నది మూలంలోని న్యాయపరమైన కనుగొనబడిన భావాన్ని నిలుపుతుంది.
- source_word: הַגָּבִיעַ
  choice: గిన్నె
  rationale: ‘గిన్నె’ సాధారణ ఆధునిక తెలుగు పదం; మూలపదాన్ని అవసరానికి మించి అలంకారిక పాత్రగా నిర్దిష్టం చేయదు.
theological_decisions:
- issue: యూదా పలికిన הָאֱלֹהִים పదానికి సూచన
  choice: దేవుడు
  alternative: ఒక దైవశక్తి
  rationale: ఆదికాండ కథన సందర్భంలో యూదా తమ దాచిన అపరాధాన్ని వెలుగులోకి తెచ్చినవాడిగా ఏకైక దేవుణ్ణే గుర్తిస్తున్నాడు. అందువల్ల అనిర్దిష్ట లేదా బహువచన భావం ఇవ్వలేదు.
- issue: ‘అపరాధం’ ఏ సంఘటనను సూచిస్తుందనే అస్పష్టత
  choice: ఏ ప్రత్యేక అపరాధమో ప్రధాన వాక్యంలో నిర్దిష్టం చేయలేదు
  alternative: యోసేపుకు చేసిన పూర్వపు అన్యాయమే అని స్పష్టీకరించడం
  rationale: యూదా మాట ప్రస్తుత గిన్నె సంఘటనను మించి పూర్వపు దోషభావాన్ని సూచించవచ్చు; అయితే మూలవాక్యం దానిని ప్రత్యక్షంగా నిర్దిష్టం చేయదు. ఆ కథనాత్మక ఉద్వేగం, అస్పష్టత అలాగే ఉంచబడ్డాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; రాజసభా సంభాషణకు తగిన గౌరవభావంతో కూడిన, కానీ సాధారణ పాఠకులకు సులభమైన శైలి. ‘నా ప్రభువు’తో అనుసంధానంగా గౌరవార్థక ‘తమ’ వాడబడింది. అలంకారాత్మక మూడు ప్రశ్నల క్రమం, ఆపై ఒప్పుకోలు మరియు లొంగుబాటు అనే వాక్య గమనాన్ని నిలిపింది.
