id: GEN.44.31
reference: Genesis 44:31
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הָיָ֗ה כִּ/רְאוֹת֛/וֹ כִּי אֵ֥ין הַ/נַּ֖עַר וָ/מֵ֑ת וְ/הוֹרִ֨ידוּ עֲבָדֶ֜י/ךָ אֶת שֵׂיבַ֨ת עַבְדְּ/ךָ֥ אָבִ֛י/נוּ בְּ/יָג֖וֹן שְׁאֹֽלָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/031.yaml
  text: then[a], when he sees that the boy is not there, he will die, and your servants will bring down the gray hair of your servant our father to Sheol in sorrow.
translation:
  language: te
  text: అప్పుడు, మా తండ్రి ఆ బాలుడు లేడని చూసినప్పుడు, ఆయన చనిపోతాడు; మీ సేవకులమైన మేము మీ సేవకుడైన మా తండ్రి నెరిసిన వెంట్రుకలను దుఃఖంతో షియోల్‌కు[a] దింపుతాము.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘సమాధికి,’ లేదా ‘మృతుల లోకానికి.’ హీబ్రూలో ‘షియోల్.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: అప్పుడు
  rationale: ముందున్న షరతుకు కలిగే ఫలితాన్ని పరిచయం చేసే హీబ్రూ ప్రయోగాన్ని సహజమైన తెలుగు అనుసంధాన పదంతో వ్యక్తం చేస్తుంది.
- source_word: כִּרְאוֹתוֹ
  choice: అతడు చూసినప్పుడు
  rationale: כְּ ఉపసర్గతో ఉన్న క్రియానామ రూపం కాలసంబంధ పరిస్థితిని సూచిస్తుంది; సందర్భంలో ‘చూసినప్పుడు’ సహజమైన సమానార్థకం.
- source_word: כִּי אֵין הַנַּעַר
  choice: ఆ బాలుడు లేడని
  rationale: אֵין ఇక్కడ ఆశించిన వ్యక్తి అక్కడ లేకపోవడాన్ని సూచిస్తుంది. ‘వెళ్లిపోయాడు’ లేదా ‘చనిపోయాడు’ అనే అదనపు భావాలను చేర్చకుండా ఉంటుంది.
- source_word: הַנַּעַר
  choice: ఆ బాలుడు
  rationale: נַעַר యువకుడిని లేదా బాలుణ్ణి సూచించగలదు; కుటుంబ సందర్భంలో యూదా బెన్యామీనును గురించి మాట్లాడుతున్న భావోద్వేగ దృష్టికి ‘బాలుడు’ సరిపోతుంది.
- source_word: וָמֵת
  choice: అతడు చనిపోతాడు
  rationale: ఈ సందర్భంలో కలిగే భవిష్యత్ ఫలితాన్ని స్పష్టంగా తెలియజేస్తుంది; కర్త యాకోబు.
- source_word: וְהוֹרִידוּ
  choice: దింపుతాము
  rationale: ירד హిఫీల్ రూపంలోని ‘కిందికి వెళ్లేలా చేయడం’ అనే బలాన్ని నిలుపుతూ, షియోల్‌కు దిగడం అనే హీబ్రూ రూపకాన్ని కాపాడుతుంది.
- source_word: עֲבָדֶיךָ
  choice: మీ సేవకులమైన మేము
  rationale: అధికారితో వినయంగా మాట్లాడే రాజసభా సందర్భంలో עֶבֶד పదానికి ‘సేవకులు’ సహజం; తెలుగు వాక్యంలో క్రియ కర్తను స్పష్టంగా చేస్తుంది.
- source_word: שֵׂיבַת
  choice: నెరిసిన తలను
  rationale: మూలంలోని ‘నెరిసిన జుట్టు/నెరసిన స్థితి’ అనే సజీవ చిత్రాన్ని ‘వృద్ధాప్యం’గా సాధారణీకరించకుండా కాపాడుతుంది; తెలుగులో వ్యక్తిని సూచించే సహజ అవయవప్రయోగంగా ‘నెరిసిన తల’ వాడబడింది.
- source_word: עַבְדְּךָ אָבִינוּ
  choice: మీ సేవకుడైన మా తండ్రి
  rationale: యాకోబును ఒకేసారి ‘మీ సేవకుడు,’ ‘మా తండ్రి’గా పేర్కొనే మూలంలోని సంబంధాన్ని నిలుపుతుంది.
- source_word: בְּיָגוֹן
  choice: దుఃఖంతో
  rationale: יָגוֹן పదంలోని శోకం/దుఃఖం భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: שְׁאֹלָה
  choice: షియోల్‌కు
  rationale: హీబ్రూ పదాన్ని లిప్యంతరీకరించడం వల్ల దానిని కేవలం సమాధిగా సంకుచితం చేయకుండా, మృతుల లోకం అనే విస్తృత భావపరిధి నిలుస్తుంది.
theological_decisions:
- issue: שְׁאֹל పదం అనువాదం
  choice: షియోల్
  alternative: సమాధి; మృతుల లోకం
  rationale: మూలపదం కేవలం భౌతిక సమాధికన్నా విస్తృతమైన భావపరిధిని కలిగి ఉండవచ్చు. లిప్యంతరీకరణ ప్రాచీన భావప్రపంచాన్ని, వ్యాఖ్యానపరమైన ఉద్రిక్తతను నిలుపుతుంది; ప్రత్యామ్నాయ అర్థాలను పాదసూచిక అందిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. రాజసభా వినయాన్ని ‘మీ సేవకులమైన మేము’ అనే రూపంలో నిలిపి, ‘నెరిసిన తల’ మరియు ‘దింపుతాము’ అనే మూల చిత్రాలను సాధ్యమైనంత సహజంగా కాపాడింది.
