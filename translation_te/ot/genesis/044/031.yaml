- from: అప్పుడు, ఆ బాలుడు లేడని అతడు చూసినప్పుడు, అతడు చనిపోతాడు; మీ సేవకులమైన మేము మీ సేవకుడైన మా తండ్రి నెరిసిన తలను దుఃఖంతో షియోల్‌కు[a] దింపుతాము.
  to: అప్పుడు, మా తండ్రి ఆ బాలుడు లేడని చూసినప్పుడు, ఆయన చనిపోతాడు; మీ సేవకులమైన మేము మీ సేవకుడైన మా తండ్రి నెరిసిన వెంట్రుకలను దుఃఖంతో షియోల్‌కు[a] దింపుతాము.
  rationale: The revision retains the Hebrew sequence and imagery while clarifying that the one who sees the boy absent and dies is the father. It replaces “నెరిసిన తలను” with “నెరిసిన వెంట్రుకలను” to represent שֵׂיבָה more precisely. The Sheol footnote and its anchor remain intact.
