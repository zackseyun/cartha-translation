  yaml_path: translation/ot/genesis/044/028.yaml
  text: One left me, and I said, ‘Surely he has been torn to pieces,’ and I have not seen him until now.
translation:
  language: te
  text: ఒకడు నా దగ్గరనుండి వెళ్లిపోయాడు. అప్పుడు నేను, ‘నిశ్చయంగా అతడు చీల్చివేయబడ్డాడు’ అన్నాను. ఇప్పటివరకు నేను అతణ్ణి చూడలేదు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּצֵא הָאֶחָד מֵאִתִּי
  choice: ఒకడు నన్ను విడిచి వెళ్లిపోయాడు
  rationale: ‘ఒకడు నా దగ్గరనుండి బయలుదేరాడు’ అనే హీబ్రూ రూపాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తూ, అతని గతి గురించి తండ్రికి తెలియదనే భావాన్ని నిలుపుతుంది.
- source_word: אַךְ טָרֹף טֹרָף
  choice: అతడు తప్పకుండా క్రూరమృగం చేత చీల్చివేయబడ్డాడు
  rationale: ‘చీల్చబడటం’ అనే క్రియను పునరుక్తి చేసే హీబ్రూ తీవ్రతను ‘తప్పకుండా’తో తెలియజేస్తుంది. సందర్భం సూచించే మృగదాడిని తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: עַד הֵנָּה
  choice: ఇప్పటివరకు
  rationale: ఈ కాలబోధక పదబంధానికి సహజమైన, ఖచ్చితమైన తెలుగు సమానం.
