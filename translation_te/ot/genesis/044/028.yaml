translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; యూదా తన తండ్రి మాటలను ఉటంకించే సందర్భానికి తగిన సరళమైన, గంభీరమైన శైలి. మూలంలోని నిశ్చయార్థక తీవ్రతను కాపాడుతూ అనవసర సిద్ధాంత వివరణను చేర్చలేదు.
