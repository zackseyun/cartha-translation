translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి పాటించబడింది. హీబ్రూ వాక్యంలోని అన్వేషణ క్రమం మరియు ‘దొరికింది’ అనే నిష్క్రియ భావం నిలుపబడ్డాయి.
