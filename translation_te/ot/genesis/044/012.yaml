  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְחַפֵּ֕שׂ בַּ/גָּד֣וֹל הֵחֵ֔ל וּ/בַ/קָּטֹ֖ן כִּלָּ֑ה וַ/יִּמָּצֵא֙ הַ/גָּבִ֔יעַ בְּ/אַמְתַּ֖חַת בִּנְיָמִֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/012.yaml
  text: And he searched[a], beginning with the oldest and finishing with the youngest, and the cup was found in Benjamin’s sack.
translation:
  language: te
  text: అతడు వయసులో పెద్దవాని దగ్గర మొదలుపెట్టి చిన్నవాని వరకు వెదికాడు; ఆ పానపాత్ర[a] బెన్యామీను సంచిలో దొరికింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘కప్పు’ లేదా ‘గిన్నె.’ హీబ్రూ పదం కప్పు లేదా పానపాత్రను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַפֵּשׂ
  choice: అతడు ... వెదికాడు
  rationale: חפשׂ ఇక్కడ సహోదరుల సామాను క్రమంగా సోదా చేయడాన్ని సూచిస్తుంది; ఆధునిక ప్రామాణిక తెలుగులో ‘వెదికాడు’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: בַּגָּדוֹל הֵחֵל
  choice: పెద్దవాడితో మొదలుపెట్టి
  rationale: కుటుంబ సందర్భంలో גָּדוֹל వయస్సులో పెద్దవాడిని సూచిస్తుంది; הֵחֵל అన్వేషణ ప్రారంభబిందువును తెలియజేస్తుంది.
- source_word: וּבַקָּטֹן כִּלָּה
  choice: చిన్నవాడితో ముగిస్తూ
  rationale: గָּדוֹל‌కు వ్యతిరేకంగా קָטֹן ఇక్కడ వయస్సులో చిన్నవాడిని సూచిస్తుంది; כִּלָּה క్రమబద్ధమైన అన్వేషణ ముగింపును తెలియజేస్తుంది.
- source_word: וַיִּמָּצֵא
  choice: దొరికింది
  rationale: నిఫాల్ రూపంలోని నిష్క్రియ భావాన్ని తెలుగులో సహజమైన ‘దొరికింది’ ద్వారా నిలిపి, ‘అతడు కనుగొన్నాడు’ అని కర్తను స్పష్టీకరించలేదు.
- source_word: הַגָּבִיעַ
  choice: ఆ పాత్ర
  rationale: גָּבִיעַ తాగే పాత్రను—గిన్నె లేదా పానపాత్రను—సూచించగలదు. తెలుగు ప్రధాన పాఠ్యంలో సహజమైన విస్తృత పదంగా ‘పాత్ర’ను ఎంచుకుని, ప్రత్యామ్నాయాలను పాదసూచికలో ఉంచాం.
- source_word: בְּאַמְתַּחַת בִּנְיָמִן
  choice: బెన్యామీను సంచిలో
  rationale: אַמְתַּחַת ధాన్యం లేదా సరకు మోసే సంచిని సూచిస్తుంది; ప్రయాణ సందర్భంలో ‘సంచి’ సరైన ఆధునిక తెలుగు పదం. בִּנְיָמִן‌ను ప్రామాణిక తెలుగు బైబిలు నామరూపంగా లిప్యంతరీకరించాం.
