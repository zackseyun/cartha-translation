translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవపూర్వకమైన, భావోద్వేగ విజ్ఞప్తి స్వరం పాటించబడింది. ‘సేవకుడు’ అనే వినయపూర్వక స్వీయసంబోధనను, నిజమైన బంధిత స్థితిని తెలిపే ‘దాసుడు’ నుండి వేరుగా అనువదించాం. ఆంగ్ల సంప్రదింపు పాఠ్యంలో పాదసూచిక గుర్తులు వాటి విషయాలకు సరిపోని స్థానాల్లో ఉన్నందున, [a]ను ప్రతిస్థాపన పదబంధం వద్దకూ [b]ను ‘ఎక్కి వెళ్లడం’ వద్దకూ ఉంచాం.
