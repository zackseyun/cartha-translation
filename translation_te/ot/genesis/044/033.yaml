  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/עַתָּ֗ה יֵֽשֶׁב נָ֤א עַבְדְּ/ךָ֙ תַּ֣חַת הַ/נַּ֔עַר עֶ֖בֶד לַֽ/אדֹנִ֑/י וְ/הַ/נַּ֖עַר יַ֥עַל עִם אֶחָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/033.yaml
  text: So now[a], please let your servant remain instead of the boy as a servant to my lord[b], and let the boy go up with his brothers.
translation:
  language: te
  text: కాబట్టి ఇప్పుడు, దయచేసి ఈ బాలునికి బదులుగా[a] మీ సేవకుడైన నన్ను నా ప్రభువుకు దాసునిగా ఉండనివ్వండి; ఈ బాలుణ్ణి తన అన్నలతో కలిసి ఎక్కి వెళ్లనివ్వండి[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఈ బాలుని స్థానంలో.”
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో ‘పైకి వెళ్లడం.’ ఐగుప్తు నుండి కనాను వైపు ప్రయాణించడాన్ని ఇలా వర్ణించడం సాధారణం.
    reason: cultural_note
lexical_decisions:
- source_word: וְעַתָּה
  choice: కాబట్టి ఇప్పుడు
  rationale: యూదా చేస్తున్న విజ్ఞప్తిలోని ముగింపు దశను సూచించే అనుసంధాన భావాన్నీ, ‘ఇప్పుడు’ అనే కాల/ప్రసంగ భావాన్నీ సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: יֵשֶׁב נָא
  choice: దయచేసి ... ఉండనివ్వండి
  rationale: יֵשֶׁב అనే అభ్యర్థనార్థక రూపంతో నָא కలసి వినయపూర్వక విజ్ఞప్తిని వ్యక్తం చేస్తుంది. సందర్భంలో యూదా అక్కడే మిగిలి దాసునిగా ఉండడమే ఉద్దేశం.
- source_word: עַבְדְּךָ
  choice: మీ సేవకుడైన నన్ను
  rationale: ఇది యోసేపుతో వినయంగా మాట్లాడుతున్న యూదా తనను తాను సూచించుకునే గౌరవప్రయోగం. ‘నన్ను’ అని చేర్చడం తెలుగులో సూచిత వ్యక్తిని స్పష్టం చేస్తుంది.
- source_word: תַּחַת הַנַּעַר
  choice: ఈ బాలునికి బదులుగా
  rationale: תַּחַת ఇక్కడ స్థలార్థంలో ‘కింద’ అని కాక, ఒకరి స్థానాన్ని మరొకరు తీసుకునే ప్రతిస్థాపన భావంలో ఉంది.
- source_word: הַנַּעַר
  choice: ఈ బాలుడు
  rationale: సందర్భంలో బెన్యామీనును సూచిస్తుంది. అతడు చిన్న పిల్లవాడు కావాల్సిన అవసరం లేకపోయినా, యూదా చూపుతున్న రక్షణాత్మక, కుటుంబ సంబంధ స్వరాన్ని ‘బాలుడు’ నిలుపుతుంది.
- source_word: עֶבֶד
  choice: దాసుడు
  rationale: మొదటి עַבְדְּךָలోని వినయపూర్వక స్వీయసంబోధనకు భిన్నంగా, ఇక్కడ యోసేపు ఇంటిలో నిజంగా బంధిత సేవాస్థితిలో ఉండడాన్ని సూచిస్తుంది.
- source_word: לַאדֹנִי
  choice: నా ప్రభువుకు
  rationale: ఇక్కడ אדני దేవుని బిరుదు కాదు; యోసేపును ఉద్దేశించిన మానవ గౌరవ సంబోధన. ‘నా ప్రభువు’ ఆ సామాజిక గౌరవ స్థాయిని నిలుపుతుంది.
- source_word: וְהַנַּעַר יַעַל
  choice: ఈ బాలుణ్ణి ... ఎక్కి వెళ్లనివ్వండి
  rationale: కొనసాగుతున్న విజ్ఞప్తి భావాన్ని తెలుగులో ఆజ్ఞార్థక-అనుమతి నిర్మాణంతో వ్యక్తం చేస్తూ, מצרים నుండి కనాను వైపు ప్రయాణానికి వాడిన עלה యొక్క ‘ఎక్కి వెళ్లు’ రూపకాన్ని కాపాడుతుంది.
- source_word: עִם אֶחָיו
  choice: తన అన్నలతో కలిసి
  rationale: బెన్యామీను మిగిలిన వారికన్నా తమ్ముడు కాబట్టి, సాధారణ ‘సోదరులు’ కంటే ‘అన్నలు’ సందర్భంలోని కుటుంబ సంబంధాన్ని సహజంగా, కచ్చితంగా తెలియజేస్తుంది.
