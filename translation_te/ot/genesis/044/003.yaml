lexical_decisions:
- source_word: הַבֹּקֶר אוֹר
  choice: తెల్లవారగానే
  rationale: ఉదయం వెలుగు రావడాన్ని సూచించే హెబ్రీ కాలవాక్యాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; ‘గానే’ కథనంలోని తక్షణ కాలసంబంధాన్ని తెలియజేస్తుంది.
- source_word: וְהָאֲנָשִׁים
  choice: ఆ మనుష్యులను
  rationale: నిర్దిష్ట బహువచనాన్ని సందర్భానుసారంగా ‘ఆ మనుష్యులు’ అని చూపుతుంది; తెలుగు కర్మణి వాక్యనిర్మాణానికి అనుగుణంగా ద్వితీయా విభక్తి వాడబడింది.
- source_word: שֻׁלְּחוּ
  choice: పంపివేశారు
  rationale: שלח క్రియ యొక్క Pual కర్మణి భావాన్ని సహజ తెలుగు అనిర్దిష్ట కర్త నిర్మాణంతో అందిస్తుంది; బయలుదేరేలా పంపిన సందర్భార్థాన్ని ‘పంపివేశారు’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: הֵמָּה וַחֲמֹרֵיהֶם
  choice: వారి గాడిదలను
  rationale: మనుష్యులూ వారి గాడిదలూ కలిసి పంపబడిన సమూహాన్ని తెలుగులో సంక్షిప్తంగా, సహజంగా సమన్వయిస్తుంది.
