translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని వాడాం. వ్యక్తి, స్థల నామాలను మూలభాష ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించాం; హీబ్రూ నుడికారంలోని అక్షరార్థాన్ని ప్రధాన వాక్యంలో అసహజంగా పెట్టకుండా పాదసూచికలో సంరక్షించాం.
