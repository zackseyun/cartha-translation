id: GEN.21.32
reference: Genesis 21:32
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּכְרְת֥וּ בְרִ֖ית בִּ/בְאֵ֣ר שָׁ֑בַע וַ/יָּ֣קָם אֲבִימֶ֗לֶךְ וּ/פִיכֹל֙ שַׂר צְבָא֔/וֹ וַ/יָּשֻׁ֖בוּ אֶל אֶ֥רֶץ פְּלִשְׁתִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/032.yaml
  text: So they made a covenant at Beer-sheba[a], and Abimelech rose up with Phicol, the commander of his army, and they returned to the land of the Philistines.
translation:
  language: te
  text: వారు బెయేర్షెబాలో ఒడంబడిక చేసుకున్నారు[a]. తరువాత అబీమెలెకు, అతని సైన్యాధిపతి ఫీకోలు, లేచి ఫిలిష్తీయుల దేశానికి తిరిగి వెళ్లారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూలో అక్షరార్థంగా: “ఒడంబడికను కోశారు”; ఇది ఒడంబడిక చేసుకోవడాన్ని సూచించే నుడికారం.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְרְתוּ בְרִית
  choice: వారు ఒడంబడిక చేసుకున్నారు
  rationale: హీబ్రూ నుడికారం అక్షరార్థంగా ‘ఒడంబడికను కోశారు’ అని ఉన్నా, ఆధునిక తెలుగులో అర్థాన్ని సహజంగా తెలియజేయడానికి ‘ఒడంబడిక చేసుకున్నారు’ అని అనువదించాం; అక్షరార్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: בִּבְאֵר שָׁבַע
  choice: బెయేర్షెబాలో
  rationale: ב అనే విభక్తి ఈ సందర్భంలో స్థలాన్ని సూచిస్తుంది; అందువల్ల తెలుగులో సహజమైన ‘-లో’ రూపాన్ని వాడాం. స్థల నామాన్ని మూల ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించాం.
- source_word: וַיָּקָם
  choice: లేచి
  rationale: קום అనే క్రియకు ఇక్కడ ‘లేచుట/బయలుదేరుట’ అనే భావం ఉంది. తదుపరి తిరుగు ప్రయాణంతో సహజంగా అనుసంధానించడానికి ‘లేచి’ అని ఇచ్చాం.
- source_word: שַׂר צְבָאוֹ
  choice: అతని సైన్యాధిపతి
  rationale: שַׂר నాయకుడు లేదా అధిపతిని, צָבָא సైన్యాన్ని సూచిస్తాయి; ‘సైన్యాధిపతి’ సంక్షిప్తంగా, స్పష్టంగా సైనిక నాయకత్వాన్ని తెలియజేస్తుంది.
- source_word: וַיָּשֻׁבוּ
  choice: తిరిగి వెళ్లారు
  rationale: שׁוּב ఇక్కడ మునుపటి ప్రాంతానికి తిరిగి వెళ్లడాన్ని సూచిస్తుంది; ‘తిరిగి వెళ్లారు’ ఆధునిక తెలుగు కథనంలో సహజంగా ఉంటుంది.
- source_word: אֶל אֶרֶץ פְּלִשְׁתִּים
  choice: ఫిలిష్తీయుల దేశానికి
  rationale: మూలంలోని ‘ఫిలిష్తీయుల దేశం’ అనే జాతి-భౌగోళిక నిర్మాణాన్ని నేరుగా, సహజమైన తెలుగులో నిలిపాం.
- source_word: וּפִיכֹל
  choice: అబీమెలెకు, అతని సైన్యాధిపతి ఫీకోలు
  rationale: హీబ్రూలో సాధారణ సంధికారకం ఉన్నప్పటికీ, అబీమెలెకు మరియు ఫీకోలు ఇద్దరూ తరువాతి బహువచన క్రియకు కర్తలని తెలుగులో స్పష్టంగా చూపే నిర్మాణాన్ని ఎంచుకున్నాం.
