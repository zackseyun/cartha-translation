id: GEN.21.1
reference: Genesis 21:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַֽ/יהוָ֛ה פָּקַ֥ד אֶת שָׂרָ֖ה כַּ/אֲשֶׁ֣ר אָמָ֑ר וַ/יַּ֧עַשׂ יְהוָ֛ה לְ/שָׂרָ֖ה כַּ/אֲשֶׁ֥ר דִּבֵּֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/001.yaml
  text: Yahweh visited Sarah as he had said[a], and Yahweh did for Sarah as he had spoken.
translation:
  language: te
  text: యాహ్వే తాను చెప్పినట్లే శారా పట్ల శ్రద్ధ చూపించాడు[a]; తాను పలికినట్లే యాహ్వే శారా కోసం కార్యం చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “శారాను సందర్శించాడు.” ఇక్కడి హెబ్రీ క్రియ, దేవుడు ఒకరి పక్షంగా కార్యం చేయడానికి వారి వైపు దృష్టి పెట్టడాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవ నామమైన చతురక్షర నామాన్ని బిరుదుగా మార్చకుండా, ఆధునిక తెలుగులో ‘యాహ్వే’ అని లిప్యంతరీకరించాం.
- source_word: פָּקַד
  choice: శారా పట్ల శ్రద్ధ చూపించాడు
  rationale: ఈ సందర్భంలో ఈ క్రియ కేవలం సందర్శించడాన్ని కాక, దేవుడు ఒకరి వైపు దృష్టి పెట్టి వారి పక్షంగా కార్యం చేయడాన్ని సూచిస్తుంది. తరువాతి వచనంలో నెరవేరే వాగ్దానంతో దీనికి ఉన్న సంబంధాన్ని ఈ అనువాదం సహజంగా తెలియజేస్తుంది.
- source_word: כַּאֲשֶׁר אָמָר
  choice: తాను చెప్పినట్లే
  rationale: ముందుగా ఇచ్చిన దైవ వాగ్దానాన్ని వెనక్కి సూచిస్తూ, అది యథాతథంగా నెరవేరిందనే భావాన్ని నిలుపుతుంది.
- source_word: וַיַּעַשׂ ... לְשָׂרָה
  choice: శారా కోసం కార్యం చేశాడు
  rationale: עשה అనే విస్తృతార్థక క్రియను అతిగా నిర్దిష్టం చేయకుండా ‘కార్యం చేశాడు’ అని, לְ అనే ఉపసర్గలోని ప్రయోజనార్థాన్ని ‘శారా కోసం’ అని వ్యక్తం చేశాం.
- source_word: כַּאֲשֶׁר דִּבֵּר
  choice: తాను పలికినట్లే
  rationale: మొదటి భాగంలోని אָמַר (‘చెప్పాడు’)తో ఉన్న శైలీ భేదాన్ని నిలుపుతూ דִּבֵּר‌ను ‘పలికాడు’ అని అనువదించాం.
theological_decisions:
- issue: יְהוָה అనే దైవ నామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలంలో దైవ నామమే ప్రత్యక్షంగా ఉంది. కాబట్టి దానిని బిరుదుతో భర్తీ చేయకుండా, హీబ్రూ నామానికి సమీపమైన ‘యాహ్వే’ రూపంలో ఇచ్చాం.
- issue: פָּקַד క్రియలోని దైవ కార్యభావం
  choice: శారా పట్ల శ్రద్ధ చూపించాడు
  alternative: శారాను సందర్శించాడు; శారాను జ్ఞాపకం చేసుకున్నాడు
  rationale: ఈ క్రియ దేవుడు శారా పక్షంగా కార్యం చేయడానికి ఆమెపై దృష్టి పెట్టాడనే భావాన్ని కలిగి ఉంది. ‘జ్ఞాపకం చేసుకున్నాడు’ అనడం దేవుడు ముందుగా మరచిపోయాడనే అపార్థానికి దారితీయవచ్చు; ‘సందర్శించాడు’ అనేది తెలుగులో కేవలం వచ్చి కలిశాడనే భావాన్ని ఇవ్వవచ్చు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలిని వాడాం. మూలంలోని రెండు సమాంతర భాగాలను, అలాగే ‘చెప్పడం/పలకడం’ అనే స్వల్ప శైలీ భేదాన్ని నిలిపాం; మూలంలో లేని కాలసూచక పదాన్ని చేర్చలేదు.
