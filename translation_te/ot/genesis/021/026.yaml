  source_fidelity: లֹא יָדַעְתִּי అనేది గతకాలంలో అబీమెలెకు తనకు ఈ ఘటన గురించి ముందుగా తెలియలేదని చెప్పడం. ముసాయిదాలోని “నాకు తెలియదు” సాధారణంగా వర్తమాన ‘నాకు తెలియదు/I do not know’గా అర్థమవుతుంది; దానిని “నాకు తెలియలేదు”గా మార్చడం అవసరం. మిగిలిన భాగాలు—చర్య చేసిన వ్యక్తి తెలియకపోవడం, అబ్రాహాము చెప్పకపోవడం, ఆ రోజు వరకు అబీమెలెకు వినకపోవడం—హీబ్రూ వాక్యార్థాన్ని విశ్వసనీయంగా తెలియజేస్తున్నాయి.
