  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే, గౌరవప్రదమైన కథన-సంభాషణ శైలి. మూలంలోని ‘నువ్వు కూడా / నేను సైతం’ సమాంతర ఉద్ఘాటనను నిలిపాం.
