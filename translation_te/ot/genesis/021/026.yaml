id: GEN.21.26
reference: Genesis 21:26
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֲבִימֶ֔לֶךְ לֹ֣א יָדַ֔עְתִּי מִ֥י עָשָׂ֖ה אֶת הַ/דָּבָ֣ר הַ/זֶּ֑ה וְ/גַם אַתָּ֞ה לֹא הִגַּ֣דְתָּ לִּ֗/י וְ/גַ֧ם אָנֹכִ֛י לֹ֥א שָׁמַ֖עְתִּי בִּלְתִּ֥י הַ/יּֽוֹם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/026.yaml
  text: And Abimelech said[a], “I did not know who had done this thing. You also did not tell me, and I myself had not heard of it until today.”
translation:
  language: te
  text: 'అబీమెలెకు ఇలా అన్నాడు: “ఈ పని ఎవరు చేశారో నాకు తెలియలేదు. నువ్వు కూడా నాకు చెప్పలేదు; నేను సైతం ఈ రోజు వరకు దీని గురించి వినలేదు.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: ఇలా అన్నాడు
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది; తెలుగు కథన సంభాషణలో ‘ఇలా అన్నాడు’ సహజమైన సమానార్థకం.
- source_word: אֲבִימֶלֶךְ
  choice: అబీమెలెకు
  rationale: వ్యక్తి పేరును ప్రామాణిక తెలుగు బైబిలు లిప్యంతరీకరణకు అనుగుణంగా ఇచ్చాం.
- source_word: לֹא יָדַעְתִּי
  choice: నాకు తెలియదు
  rationale: మాట్లాడుతున్న సమయానికి తనకు ఆ విషయం తెలియదని అబీమెలెకు చెబుతున్నాడు; తెలుగులో ఈ స్థితిని వర్తమాన రూపంతో సహజంగా వ్యక్తం చేస్తారు.
- source_word: מִי עָשָׂה
  choice: ఎవరు చేశారో
  rationale: చర్య చేసిన తెలియని వ్యక్తిని సూచించే పరోక్ష ప్రశ్నను సహజమైన తెలుగు రూపంలో నిలిపింది.
- source_word: אֶת־הַדָּבָר הַזֶּה
  choice: ఈ పని
  rationale: דבר ఇక్కడ వివాదానికి కారణమైన చర్య లేదా సంఘటనను సూచిస్తుంది; ‘ఈ పని’ సందర్భానికి సహజంగా ఉండి, ‘విషయం’ అనే విస్తృత అర్థాన్ని అనవసరంగా ముందుకు తేవదు.
- source_word: וְגַם אַתָּה
  choice: నువ్వు కూడా
  rationale: גַם లోని చేరిక మరియు స్వల్ప ఉద్ఘాటనను ‘కూడా’ నిలుపుతుంది.
- source_word: לֹא הִגַּדְתָּ לִּי
  choice: నాకు చెప్పలేదు
  rationale: הגיד యొక్క సాధారణ సంభాషణాత్మక భావాన్ని ఆధునిక తెలుగులో నేరుగా వ్యక్తం చేస్తుంది.
- source_word: וְגַם אָנֹכִי
  choice: నేను సైతం
  rationale: אָנֹכִי అనే పూర్తి సర్వనామంలోని ఉద్ఘాటనను, మునుపటి ‘నువ్వు కూడా’తో సమాంతరంగా, ‘నేను సైతం’ సహజంగా ప్రతిబింబిస్తుంది.
- source_word: לֹא שָׁמַעְתִּי
  choice: దీని గురించి వినలేదు
  rationale: ఇక్కడ ‘వినడం’ అంటే ఈ సంఘటన గురించి సమాచారం అందుకోవడం; తెలుగులో అవసరమైన సూచ్య కర్మను ‘దీని గురించి’ స్పష్టం చేస్తుంది.
- source_word: בִּלְתִּי הַיּוֹם
  choice: ఈ రోజు వరకు
  rationale: ఈ రోజుకు ముందు తనకు వార్త అందలేదనే కాలపరిమితిని సహజంగా వ్యక్తం చేస్తుంది.
