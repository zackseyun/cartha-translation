id: GEN.21.17
reference: Genesis 21:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּשְׁמַ֣ע אֱלֹהִים֮ אֶת ק֣וֹל הַ/נַּעַר֒ וַ/יִּקְרָא֩ מַלְאַ֨ךְ אֱלֹהִ֤ים אֶל הָגָר֙ מִן הַ/שָּׁמַ֔יִם וַ/יֹּ֥אמֶר לָ֖/הּ מַה לָּ֣/ךְ הָגָ֑ר אַל תִּ֣ירְאִ֔י כִּֽי שָׁמַ֧ע אֱלֹהִ֛ים אֶל ק֥וֹל הַ/נַּ֖עַר בַּ/אֲשֶׁ֥ר הוּא שָֽׁם־׀־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/017.yaml
  text: And God heard the boy’s voice[a], and the angel of God called to Hagar from heaven and said to her, “What is the matter with you, Hagar? Do not fear, for God has heard the boy’s voice where he is.”
translation:
  language: te
  text: 'దేవుడు బాలుని స్వరాన్ని[a] విన్నాడు. అప్పుడు దేవుని దూత ఆకాశం నుండి హాగరును పిలిచి ఆమెతో ఇలా అన్నాడు: “హాగరూ, నీకేమైంది? భయపడకు; బాలుడు ఉన్న చోట దేవుడు బాలుని స్వరాన్ని విన్నాడు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “బాలుని మొర.” హీబ్రూ పదం ‘స్వరం’ను సూచిస్తుంది; ఈ సందర్భంలో అది ఆపదలో చేసిన మొరను కూడా సూచించవచ్చు. ఈ ప్రత్యామ్నాయం వచనంలోని రెండు సందర్భాలకూ వర్తిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע אֱלֹהִים
  choice: దేవుడు ... విన్నాడు
  rationale: שׁמע అనే క్రియకు ఇక్కడ సహజమైన ప్రాథమిక అర్థం ‘వినడం.’ దేవుడు స్పందించినట్లు సందర్భం చూపుతున్నా, అనువాదంలో ‘జవాబిచ్చాడు’ అని అదనపు భావాన్ని చేర్చలేదు.
- source_word: אֶת קוֹל הַנַּעַר / אֶל קוֹל הַנַּעַר
  choice: బాలుని స్వరం / అతని స్వరం
  rationale: קוֹל యొక్క మూలార్థమైన ‘స్వరం/శబ్దం’ను నిలుపుతూ, రెండవ సందర్భంలో సహజమైన తెలుగు కోసం సర్వనామం వాడబడింది. సందర్భంలో ఇది ఆపదలో చేసిన మొర కావచ్చు; ఆ ప్రత్యామ్నాయం పాదటిప్పణిలో ఇవ్వబడింది.
- source_word: הַנַּעַר
  choice: బాలుడు
  rationale: ఇక్కడ ఇష్మాయేలును సూచించే נַעַר‌కు ఆధునిక ప్రామాణిక తెలుగులో సహజమైన పదం ‘బాలుడు.’
- source_word: וַיִּקְרָא מַלְאַךְ אֱלֹהִים
  choice: దేవుని దూత ... పిలిచి
  rationale: మూలంలోని construct phrase‌ను నేరుగా నిలుపుతుంది; దూత ఎవరు అనే విస్తృత దైవశాస్త్రీయ ప్రశ్నను అనువాదం పరిష్కరించదు.
- source_word: מִן הַשָּׁמַיִם
  choice: ఆకాశం నుండి
  rationale: שׁמים రూపపరంగా బహువచనమైనా, ఈ స్థానవాచక ప్రయోగంలో ‘ఆకాశం నుండి’ సహజమైన తెలుగు సమానార్థకం.
- source_word: מַה לָּךְ
  choice: నీకేమైంది?
  rationale: ‘నీకు ఏమి?’ అనే హీబ్రూ నుడికారానికి సహజమైన, సంక్షిప్తమైన తెలుగు రూపం; నిందారోపణ భావాన్ని కలిగించదు.
- source_word: אַל תִּירְאִי
  choice: భయపడకు
  rationale: స్త్రీ ఏకవచన నిషేధ ఆజ్ఞను తెలుగులో సహజంగా, నేరుగా వ్యక్తపరుస్తుంది.
- source_word: כִּי שָׁמַע אֱלֹהִים
  choice: దేవుడు ... విన్నాడు
  rationale: כִּי ఇచ్చే కారణ సంబంధాన్ని తెలుగులో వాక్యక్రమం మరియు సందర్భం సహజంగా తెలియజేస్తాయి; ‘ఎందుకంటే’ లేకుండానే హామీ యొక్క కారణం స్పష్టంగా ఉంది.
- source_word: בַּאֲשֶׁר הוּא שָׁם
  choice: బాలుడు ఉన్న చోటనే
  rationale: ఈ స్థానవాచక పదబంధాన్ని సహజమైన తెలుగులో అందిస్తుంది. ‘నే’ మూలంలోని ప్రస్తుత స్థానం మీదున్న దృష్టిని తెలియజేస్తుంది గాని దాని భావాన్ని సిద్ధాంతపరంగా విస్తరించదు.
theological_decisions:
- issue: מַלְאַךְ אֱלֹהִים అనే వ్యక్తీకరణలో దూత దేవునితో సన్నిహితంగా గుర్తింపబడే అవకాశం
  choice: దేవుని దూత
  alternative: దేవునికి చెందిన ఒక దూత
  rationale: నిర్దిష్ట దైవదూతను సూచించే కథన సందర్భాన్ని అనుసరిస్తూనే, ఆయన ఖచ్చితమైన అస్తిత్వ గుర్తింపు గురించి మూలపాఠం కంటే ముందుకు వెళ్లదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనప్పటికీ గౌరవప్రదమైన కథన శైలి. హీబ్రూ పునరుక్తిని సాధ్యమైనంతవరకు నిలుపుతూ, రెండవ ప్రస్తావనలో అసహజత నివారించేందుకు ‘అతని స్వరం’ వాడబడింది.
