  text: And Abraham called the name of his son who was born to him[a], whom Sarah bore to him[b], Isaac.
translation:
  language: te
  text: అబ్రాహాము తనకు పుట్టిన, శారా తనకు కనిన కుమారునికి ఇస్సాకు అని పేరు పెట్టాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרָא ... אֶת שֶׁם
  choice: పేరు పెట్టాడు
  rationale: కרא + שֵׁם అనే హీబ్రూ నామకరణ ప్రయోగానికి ఆధునిక తెలుగులో సహజమైన సమానార్థక ప్రయోగం.
- source_word: בְּנוֹ
  choice: తన ... కుమారునికి
  rationale: ప్రత్యయం అబ్రాహాముతో గల స్వామ్యసంబంధాన్ని స్పష్టంగా సూచిస్తుంది.
- source_word: הַנּוֹלַד לוֹ
  choice: తనకు పుట్టిన
  rationale: నిష్క్రియార్థక కృదంతాన్ని, సంబంధసూచక לוֹను సంక్షిప్తంగా నిలుపుతుంది.
- source_word: אֲשֶׁר יָלְדָה לּוֹ שָׂרָה
  choice: శారా తనకు కనిన
  rationale: తల్లిగా శారాను గుర్తిస్తూ, పునరుక్తమైన לוֹను కూడా తెలుగులో నిలుపుతుంది.
- source_word: יִצְחָק
  choice: ఇస్సాకు
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
