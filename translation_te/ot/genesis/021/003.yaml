translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; మూలంలోని రెండు సంబంధవాక్యాలను నిలుపుతూ, హీబ్రూ ‘పేరు పిలిచాడు’ అనే నుడికారాన్ని సహజ తెలుగు ‘పేరు పెట్టాడు’గా అందించింది.
