id: GEN.21.6
reference: Genesis 21:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/תֹּ֣אמֶר שָׂרָ֔ה צְחֹ֕ק עָ֥שָׂה לִ֖/י אֱלֹהִ֑ים כָּל הַ/שֹּׁמֵ֖עַ יִֽצְחַק לִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/006.yaml
  text: And Sarah said[a], “God has made laughter for me; everyone who hears will laugh with me.”
translation:
  language: te
  text: అప్పుడు శారా, “దేవుడు నాకు నవ్వు కలిగించాడు; వినే ప్రతి ఒక్కరూ నాతో కలిసి నవ్వుతారు[a]” అని చెప్పింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నన్ను ఎగతాళి చేస్తూ నవ్వుతారు,” లేదా “నా కోసం నవ్వుతారు.” హీబ్రూ పదబంధం ఈ విభిన్న భావఛాయలను అనుమతిస్తుంది; అయితే సందర్భంలో శారా ఆనందంలో ఇతరులు పాలుపంచుకోవడమే ఎక్కువ సంభావ్యమైన భావం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: అప్పుడు ... చెప్పింది
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది. ఆధునిక తెలుగు కథనశైలిలో ‘అప్పుడు’ సహజంగా ఉండి ఆ ప్రవాహాన్ని నిలుపుతుంది.
- source_word: שָׂרָה
  choice: శారా
  rationale: వ్యక్తి పేరును ఆధునిక ప్రామాణిక తెలుగు లిప్యంతరీకరణలో ఇచ్చాం.
- source_word: צְחֹק
  choice: నవ్వు
  rationale: ఈ నామవాచకపు ప్రాథమిక అర్థాన్ని నిలుపుతూ, తరువాతి יִצְחַק క్రియతోనూ ఇస్సాకు పేరుతోనూ ఉన్న పదప్రయోగాన్ని సాధ్యమైనంతగా కాపాడుతుంది.
- source_word: עָשָׂה לִי
  choice: నాకు ... కలిగించాడు
  rationale: అక్షరార్థంగా ‘నాకోసం చేశాడు.’ తెలుగులో ‘నాకు నవ్వు కలిగించాడు’ సహజంగా ఉండి, దేవుని కార్యం వల్ల శారాకు నవ్వు కలిగిందనే భావాన్ని తెలియజేస్తుంది.
- source_word: אֱלֹהִים
  choice: దేవుడు
  rationale: ఇక్కడ ఏకైక దేవుణ్ణి సూచిస్తున్నందున ఏకవచన రూపం సరైనది.
- source_word: כָּל הַשֹּׁמֵעַ
  choice: ఇది వినే ప్రతి ఒక్కరూ
  rationale: హీబ్రూలో రూపం ఏకవచనమైనా భావం పంపిణీయమైనది. ‘ఇది’ అనేది వినబడేది శారా చెప్పిన ఈ వార్త/సంఘటన అని తెలుగులో సహజంగా స్పష్టం చేస్తుంది.
- source_word: יִצְחַק
  choice: నవ్వుతారు
  rationale: צְחֹק తో ఒకే మూలం నుంచి వచ్చిన ‘నవ్వు’ అనే అర్థాన్ని నిలుపుతుంది; తద్వారా ఇస్సాకు పేరుతో ముడిపడిన పదప్రయోగం కూడా సాధ్యమైనంతవరకు కనిపిస్తుంది.
- source_word: לִי
  choice: నాతో కలిసి
  rationale: దీనికి ‘నాతో,’ ‘నన్ను చూసి/నన్ను ఎగతాళి చేస్తూ,’ లేదా ‘నా కోసం’ అనే ఛాయలు సాధ్యమైనవి. సందర్భంలోని ఆనందాన్ని బట్టి ప్రధాన పాఠ్యంలో భాగస్వామ్య నవ్వును ఎంచుకున్నాం.
theological_decisions:
- issue: చివరి పదబంధం יִצְחַק לִי యొక్క భావం
  choice: 'ఆనందంలో భాగస్వామ్యమైన నవ్వు: ‘నాతో కలిసి నవ్వుతారు’'
  alternative: ‘నన్ను చూసి నవ్వుతారు’ లేదా ‘నా కోసం నవ్వుతారు’
  rationale: ఇస్సాకు జననం గురించి శారా వ్యక్తం చేస్తున్న ఆనందం, ముందున్న ‘దేవుడు నాకు నవ్వు కలిగించాడు’ అనే సానుకూల వాక్యం—ఇవి కలిసి ఇతరులు ఆమె ఆనందంలో పాలుపంచుకుంటారనే భావానికి మద్దతిస్తాయి. అయినప్పటికీ హీబ్రూ לִי ఇతర ఛాయలనూ అనుమతిస్తుంది; అందువల్ల వాటిని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే సహజమైన, గౌరవప్రదమైన కథనశైలి. ‘నవ్వు/నవ్వుతారు’ పునరుక్తి మూలంలోని పదప్రయోగాన్ని నిలుపుతుంది. పాదసూచిక సూచిక [a] ప్రధాన పాఠ్యంలో ఉంచబడింది.
