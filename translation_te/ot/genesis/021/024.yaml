    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... అన్నాడు
  rationale: వావ్-కన్సిక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది. ఆధునిక తెలుగు కథనశైలిలో ‘అప్పుడు ... అన్నాడు’ సహజంగా ఉండి, సంఘటనల క్రమాన్ని అనవసరంగా విశదీకరించకుండా చూపిస్తుంది.
- source_word: אַבְרָהָם
  choice: అబ్రాహాము
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపాన్ని ఉపయోగించాం.
- source_word: אָנֹכִי
  choice: నేను
  rationale: స్వతంత్ర సర్వనామం కర్తను స్పష్టంగా, కొంత నొక్కి చెబుతుంది. తెలుగులో ‘నేను’ అని ప్రత్యక్షంగా ఉంచడం ఆ స్పష్టతను సహజంగా నిలుపుతుంది.
- source_word: אִשָּׁבֵעַ
  choice: ప్రమాణం చేస్తాను
  rationale: שבע అనే ధాతువు నిఫాల్ రూపంలో ‘ప్రమాణం చేయడం/ఒట్టు పెట్టుకోవడం’ అని అర్థం. సందర్భంలో ఇది అబీమెలెకు చేసిన అభ్యర్థనకు అబ్రాహాము ఇచ్చిన సంకల్పపూర్వక సమాధానం; అందువల్ల ‘ప్రమాణం చేస్తాను’ కాలభావాన్ని, క్రియ స్వరూపాన్ని రెండింటినీ సహజంగా తెలియజేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. ‘ప్రమాణం చేస్తాను’ మూలంలోని అసంపూర్ణ క్రియారూపానికి ఈ సందర్భంలో ఉన్న సంకల్ప/భవిష్యత్ భావాన్ని నిలుపుతుంది; ప్రత్యామ్నాయ వర్తమాన భావాన్ని పాదటిప్పణిలో ఇచ్చాం.
