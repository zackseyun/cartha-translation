  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּכְל֥וּ הַ/מַּ֖יִם מִן הַ/חֵ֑מֶת וַ/תַּשְׁלֵ֣ךְ אֶת הַ/יֶּ֔לֶד תַּ֖חַת אַחַ֥ד הַ/שִּׂיחִֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/015.yaml
  text: When the water in the skin was gone[b][a], she cast the boy under one of the bushes.
translation:
  language: te
  text: తోలుతిత్తిలోని[a] నీళ్లు అయిపోయినప్పుడు, ఆమె ఆ బాలుణ్ణి పొదల్లో ఒకదాని కింద పడవేసింది[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అంటే, జంతుచర్మంతో చేసిన నీళ్ల సంచి.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘విసిరివేసింది.’ హీబ్రూ క్రియ ‘ఉంచింది’ అనే మాటకంటే బలమైనది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְלוּ
  choice: అయిపోయినప్పుడు
  rationale: כלה ఇక్కడ పూర్తిగా ఖర్చైపోవడం లేదా మిగలకపోవడం అనే భావాన్ని ఇస్తుంది. నీళ్ల సందర్భంలో ‘అయిపోయాయి’ అనేది సహజమైన ఆధునిక తెలుగు.
- source_word: הַמַּיִם
  choice: నీళ్లు
  rationale: מַיִם రూపపరంగా బహువచనమైనా, నీటిని సూచించే సామూహిక నామవాచకం. సాధారణ తెలుగు కథనంలో ‘నీళ్లు’ సహజంగా ఉంటుంది.
- source_word: מִן הַחֵמֶת
  choice: తోలుతిత్తిలోని
  rationale: חֵמֶת జంతుచర్మంతో చేసిన ద్రవపాత్రను సూచిస్తుంది; מן ఇక్కడ ఆ పాత్రలోని నీళ్లు అయిపోయాయని తెలిపే మూలార్థాన్ని కలిగి ఉంది. ‘తోలుతిత్తి’ వస్తువు స్వభావాన్ని సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: וַתַּשְׁלֵךְ
  choice: పడవేసింది
  rationale: שלך సాధారణంగా విసరడం లేదా పడవేయడం అనే బలమైన చర్యను సూచిస్తుంది. ‘ఉంచింది’ కంటే ‘పడవేసింది’ హీబ్రూ క్రియలోని ఆకస్మికతను, ఆపద తీవ్రతను మెరుగ్గా నిలుపుతుంది; ‘విసిరేసింది’ కలిగించగల అతిశయ భావాన్ని మాత్రం నివారిస్తుంది.
- source_word: אֶת הַיֶּלֶד
  choice: ఆ బాలుణ్ణి
  rationale: יֶלֶד అంటే పిల్లవాడు లేదా బాలుడు. పురుషలింగ సూచనను నిలుపుతూ, ఆధునిక తెలుగులో ‘బాలుడు’ గౌరవప్రదంగా, స్పష్టంగా ఉంటుంది.
- source_word: תַּחַת
  choice: కింద
  rationale: תַּחַת యొక్క ప్రత్యక్ష స్థలార్థం ‘కింద’; ఇదే స్పష్టమైన సహజ తెలుగు సమానం.
- source_word: אַחַד הַשִּׂיחִם
  choice: పొదల్లో ఒకదాని
  rationale: ఈ నిర్మాణం ‘పొదలలో ఒకటి’ అని అర్థం. שִׂיחַ పొదను లేదా చిన్న గుబురు మొక్కను సూచిస్తుంది; కథన తెలుగులో ‘పొద’ సులభంగా అర్థమవుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన కథన శైలి. మూలంలోని బలమైన క్రియను తగ్గించకుండా సహజమైన ‘పడవేసింది’ వాడబడింది; తోలుతో చేసిన పాత్ర అనే సాంస్కృతిక వివరాన్ని ప్రధాన పాఠం మరియు పాదసూచికలో స్పష్టం చేసింది.
