source:
  edition: WLC
  text: וַ/יָּ֤מָל אַבְרָהָם֙ אֶת יִצְחָ֣ק בְּנ֔/וֹ בֶּן שְׁמֹנַ֖ת יָמִ֑ים כַּ/אֲשֶׁ֛ר צִוָּ֥ה אֹת֖/וֹ אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/004.yaml
  text: And Abraham circumcised Isaac his son when he was eight days old[a], just as God had commanded him.
translation:
  language: te
  text: అబ్రాహాము తన కుమారుడైన ఇస్సాకుకు ఎనిమిది రోజుల వయసున్నప్పుడు, దేవుడు తనకు ఆజ్ఞాపించినట్లే, సున్నతి చేశాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘ఎనిమిది రోజుల కుమారుడు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָל
  choice: సున్నతి చేశాడు
  rationale: מול అనే క్రియ ప్రత్యేకంగా సున్నతి చేయడాన్ని సూచిస్తుంది. ఆధునిక ప్రామాణిక తెలుగులో ‘సున్నతి చేశాడు’ సహజమైనదీ ఖచ్చితమైనదీ.
- source_word: אֶת יִצְחָק
  choice: ఇస్సాకుకు
  rationale: אֶת ప్రత్యక్ష కర్మ సూచిక; יִצְחָק వ్యక్తి పేరు. తెలుగు వాక్య నిర్మాణంలో ‘సున్నతి చేయు’తో సహజంగా దత్తి విభక్తి వాడబడింది.
- source_word: בְּנוֹ
  choice: తన కుమారుడైన
  rationale: ప్రత్యయం అబ్రాహాముతో సంబంధాన్ని సూచిస్తుంది. ‘తన’ వాడకం కర్త అబ్రాహామేనని స్పష్టంగా ఉంచి, మూలంలోని కుటుంబ సంబంధ ప్రాధాన్యాన్ని నిలుపుతుంది.
- source_word: בֶּן שְׁמֹנַת יָמִים
  choice: ఎనిమిది రోజుల వయసున్నప్పుడు
  rationale: హీబ్రూ నుడికారం అక్షరార్థంగా ‘ఎనిమిది రోజుల కుమారుడు.’ ఆధునిక తెలుగులో వయస్సును సహజంగా తెలియజేయడానికి ఈ రూపం ఎంచుకోబడింది; అక్షరార్థం పాదసూచికలో ఇవ్వబడింది.
- source_word: כַּאֲשֶׁר
  choice: ఆజ్ఞాపించినట్లే
  rationale: ఈ సంధిపదం అబ్రాహాము చేసిన కార్యం దేవుని ఆజ్ఞకు అనుగుణంగా ఉందని తెలుపుతుంది. ‘అట్లే’ ఖచ్చిత అనుసరణ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: צִוָּה אֹתוֹ
  choice: తనకు ఆజ్ఞాపించిన
  rationale: దేవుడు అబ్రాహాముకు ముందుగా ఇచ్చిన ఆజ్ఞను ఇది సూచిస్తుంది. తెలుగు సంబంధకృదంత నిర్మాణంలో ముందుదనం సందర్భం ద్వారానే స్పష్టమవుతుంది; అదనపు కాల సూచన అవసరం లేదు.
- source_word: אֱלֹהִים
  choice: దేవుడు
  rationale: ఇక్కడ ఏకవచన క్రియతో ఇశ్రాయేలు దేవుణ్ణి సూచిస్తుంది; ‘దేవుడు’ సందర్భోచితమైన ప్రామాణిక తెలుగు రూపం.
theological_decisions:
- issue: దైవాజ్ఞ ముందుగా ఇవ్వబడినదనే కాలసంబంధం
  choice: దేవుడు తనకు ఆజ్ఞాపించినట్లే
  alternative: దేవుడు తనకు ముందుగా ఆజ్ఞాపించినట్లే
  rationale: హీబ్రూ వాక్యం ఆజ్ఞను సాధారణ సంపూర్ణ క్రియతో పేర్కొంటుంది; ఆదికాండము 17 సందర్భంలో అది ముందుగా ఇచ్చినదని తెలుస్తుంది. ‘ముందుగా’ అని మూలంలో లేని పదాన్ని చేర్చకుండా, సహజ తెలుగు నిర్మాణం కాలసంబంధాన్ని సందర్భానికి వదిలేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు, గౌరవప్రదమైన సాధారణ పఠన శైలి. ‘సున్నతి చేశాడు’ అనే స్థిరమైన పదబంధాన్ని ఉపయోగించి, మూలంలోని ‘తన కుమారుడు’ అనే కుటుంబ సంబంధ ప్రాధాన్యాన్ని నిలిపాం.
