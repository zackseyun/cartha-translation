  yaml_path: translation/ot/genesis/021/020.yaml
  text: God was with the boy[a], and he grew. He lived in the wilderness and became an archer.
translation:
  language: te
  text: దేవుడు ఆ బాలునికి తోడుగా ఉన్నాడు; అతడు పెరిగాడు. అతడు అరణ్యంలో నివసించాడు; విలుకాడయ్యాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “విల్లుతో బాణాలు వేసేవాడయ్యాడు.” హీబ్రూలో అక్షరార్థంగా, “విల్లును ప్రయోగించేవాడు.”
    reason: హీబ్రూ రోబెహ్ కష్షాత్ అనే పదబంధానికి ఉన్న అక్షరార్థ ప్రత్యామ్నాయాన్ని చూపడానికి.
lexical_decisions:
- source_word: וַיְהִי אֱלֹהִים אֶת הַנַּעַר
  choice: దేవుడు ఆ బాలునికి తోడుగా ఉన్నాడు
  rationale: היה את అనే హీబ్రూ ప్రయోగం ఇక్కడ దేవుని సన్నిధిని, సహాయాన్ని సూచిస్తుంది. ‘తోడుగా ఉన్నాడు’ అనేది ఆ భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తూ, కేవలం ‘సహాయం చేశాడు’ అని అర్థాన్ని కుదించదు.
- source_word: וַיִּגְדָּל
  choice: అతడు పెరిగాడు
  rationale: גדל ఇక్కడ బాలుని ఎదుగుదలను సూచిస్తుంది. ‘పెరిగాడు’ మూలంలోని సంక్షిప్తతను కాపాడుతుంది; ‘పెరిగి పెద్దవాడయ్యాడు’ కంటే తక్కువ వ్యాఖ్యానాత్మకం.
- source_word: וַיֵּשֶׁב בַּמִּדְבָּר
  choice: అతడు అరణ్యంలో నివసిస్తూ
  rationale: ישב అనేది ఇక్కడ స్థిరంగా ఉండడం లేదా నివసించడం; מִדְבָּר జనావాసం తక్కువగా ఉన్న అరణ్య ప్రదేశాన్ని సూచించగలదు. ‘నివసిస్తూ’ తరువాతి వృత్తాంతంతో సహజంగా అనుసంధానిస్తుంది.
- source_word: וַיְהִי רֹבֶה קַשָּׁת
  choice: విలుకాడయ్యాడు
  rationale: ఈ హీబ్రూ పదబంధం విల్లుతో బాణాలు వేసేవాడిగా మారడాన్ని సూచిస్తుంది. ‘విలుకాడు’ ఆధునిక తెలుగులో సంక్షిప్తమైన, సహజమైన సమానార్థకం.
theological_decisions:
- issue: ఇష్మాయేలుతో దేవుని సన్నిధి
  choice: దేవుడు ఆ బాలునికి తోడుగా ఉన్నాడు
  alternative: దేవుడు ఆ బాలునికి సహాయం చేశాడు / దేవుడు ఆ బాలుని పక్షాన ఉన్నాడు
  rationale: మూలవాక్యం దేవుని సన్నిధి లేదా ఆదరణను ప్రకటిస్తుంది గాని దాని విస్తృత సిద్ధాంతార్థాన్ని వివరించదు. ‘తోడుగా ఉన్నాడు’ ఆ ఉద్దేశపూర్వక విస్తృతిని, theological tension‌ను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయితే గౌరవప్రదమైన బైబిలు శైలిని నిలుపుతూ అనువదించబడింది. మూలంలో ప్రత్యేక పాఠభేదం అవసరం లేకపోవడంతో పాదటిప్పణి జోడించలేదు.
