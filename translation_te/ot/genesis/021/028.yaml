translation:
  language: te
  text: అబ్రాహాము మందలోని ఏడు ఆడ గొర్రెపిల్లలను విడిగా ఉంచాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మందలోని ఏడు ఆడ గొర్రెపిల్లలను ప్రత్యేకంగా వేరు చేశాడు.” హీబ్రూ క్రియ వాటిని వేరైన స్థానంలో ఉంచడాన్ని సూచించవచ్చు; ఒప్పందానికి సాక్ష్యంగా అవి ఉపయోగించబడే ఈ సందర్భంలో ఆ చర్యకు ప్రాముఖ్యత ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּצֵּב
  choice: నిలబెట్టాడు
  rationale: నצב అనే ధాతువు హిఫిల్ రూపంలో ఏదైనా ఒక నిర్దిష్ట స్థానంలో నిలిచేలా చేయడం లేదా ఉంచడం అనే భావాన్ని ఇస్తుంది. సందర్భాన్ని అతిగా వ్యాఖ్యానించకుండా ఆ స్పష్టమైన చర్యను ‘నిలబెట్టాడు’ సహజంగా తెలియజేస్తుంది.
- source_word: אַבְרָהָם
  choice: అబ్రాహాము
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: אֶת
  choice: '[కర్మ సూచిక; ప్రత్యేకంగా అనువదించలేదు]'
  rationale: హీబ్రూ నిర్దిష్ట కర్మ సూచికకు తెలుగులో విడిగా సమాన పదం అవసరం లేదు; వాక్య నిర్మాణం ద్వారా దాని పని వ్యక్తమవుతుంది.
- source_word: שֶׁבַע
  choice: ఏడు
  rationale: తరువాతి నామవాచకాన్ని విశేషించే సాధారణ సంఖ్యావాచకం.
- source_word: כִּבְשֹׂת
  choice: ఆడ గొర్రెపిల్లలను
  rationale: ఈ పదం ఆడ గొర్రెపిల్లలను ప్రత్యేకంగా సూచిస్తుంది. ఈ ఎంపిక వాటి లింగాన్నీ చిన్న వయస్సు భావాన్నీ నిలుపుతుంది.
- source_word: הַצֹּאן
  choice: మందలోని
  rationale: צֹאן చిన్న పశువుల సమూహాన్ని సూచించే సమష్టి పదం. ‘మందలోని’ అనేది దానిని అనవసరంగా కేవలం గొర్రెలకే పరిమితం చేయకుండా, ఈ వాక్యంలో ఆడ గొర్రెపిల్లల మూల సమూహాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: לְבַדְּהֶן
  choice: విడిగా
  rationale: ఆ ఏడు గొర్రెపిల్లలను మిగిలిన మంద నుంచి వేరుగా ఉంచినట్లు స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
