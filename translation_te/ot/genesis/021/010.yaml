  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/תֹּ֨אמֶר֙ לְ/אַבְרָהָ֔ם גָּרֵ֛שׁ הָ/אָמָ֥ה הַ/זֹּ֖את וְ/אֶת בְּנָ֑/הּ כִּ֣י לֹ֤א יִירַשׁ֙ בֶּן הָ/אָמָ֣ה הַ/זֹּ֔את עִם בְּנִ֖/י עִם יִצְחָֽק־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/010.yaml
  text: So she said to Abraham[a], “Drive out this servant woman and her son, for the son of this servant woman will not inherit with my son Isaac.”
translation:
  language: te
  text: 'అప్పుడు ఆమె అబ్రాహాముతో ఇలా చెప్పింది: “ఈ బానిస స్త్రీని, ఆమె కుమారుణ్ణి తరిమివేయి; ఎందుకంటే ఈ బానిస స్త్రీ కుమారుడు నా కుమారుడైన ఇస్సాకుతో కలిసి వారసత్వం పొందడు.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גָּרֵשׁ
  choice: వెళ్లగొట్టు
  rationale: ఈ ఆజ్ఞారూపం బలవంతంగా బయటకు పంపడం లేదా తరిమివేయడం అనే భావాన్ని ఇస్తుంది. ‘వెళ్లగొట్టు’ ఆ బలాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: הָאָמָה
  choice: బానిస స్త్రీ
  rationale: אָמָה తక్కువ సామాజిక, చట్టపరమైన హోదాలో ఉన్న స్త్రీ బానిసను లేదా సేవకురాలిని సూచిస్తుంది. ఈ సందర్భంలో ఆమె బంధిత హోదా ప్రాధాన్యమైనందున ‘బానిస స్త్రీ’ స్పష్టంగా ఉంది.
- source_word: בְּנָהּ
  choice: ఆమె కుమారుణ్ణి
  rationale: మూలంలోని సాధారణ స్వామ్య సంబంధాన్ని నేరుగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: כִּי לֹא יִירַשׁ
  choice: ఎందుకంటే ... వారసత్వం పొందకూడదు
  rationale: כִּי ముందున్న డిమాండుకు కారణాన్ని తెలుపుతుంది. יירשׁ వారసత్వాన్ని పొందడం లేదా వారసుడవడం అని అర్థం; సందర్భంలో వక్త నిరాకరిస్తున్న సంకల్పాన్ని తెలుగు నిషేధార్థక రూపం సహజంగా తెలియజేస్తుంది.
- source_word: בֶּן הָאָמָה הַזֹּאת
  choice: ఈ బానిస స్త్రీ కుమారుడు
  rationale: మూలంలోని పునరుక్త నామవాచక పదబంధం, సూచన సర్వనామం నిలుపబడ్డాయి; ఇవి సారా చూపుతున్న దూరీకరణను, కఠినతను వ్యక్తం చేస్తాయి.
- source_word: עִם בְּנִי עִם יִצְחָק
  choice: నా కుమారుడైన ఇస్సాకుతో కలిసి
  rationale: హీబ్రూలో עִם పునరుక్తి ఇస్సాకును ‘నా కుమారుడు’ అనే పదబంధానికి వివరణాత్మకంగా, ఉద్ఘాటనతో జతచేస్తుంది. తెలుగులో ‘నా కుమారుడైన ఇస్సాకు’ అదే సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וַתֹּאמֶר לְאַבְרָהָם
  choice: అప్పుడు ఆమె అబ్రాహాముతో ... అని చెప్పింది
  rationale: కథన క్రమాన్ని ‘అప్పుడు’ సహజంగా సూచిస్తుంది; తెలుగు ప్రత్యక్ష వాక్య నిర్మాణానికి అనుగుణంగా చెప్పే క్రియను చివర ఉంచింది.
theological_decisions:
- issue: יִירַשׁ యొక్క భావం
  choice: వారసత్వం పొందకూడదు
  alternative: వారసత్వం పొందడు
  rationale: హీబ్రూ అసంపూర్ణ క్రియారూపం భవిష్యత్ ఫలితాన్ని లేదా వక్త యొక్క దృఢ నిరాకరణను సూచించగలదు. సందర్భంలో ఇది సారా డిమాండుకు కారణంగా చెప్పిన నిషేధాత్మక సంకల్పం; అనవసరమైన సిద్ధాంత వివరణ లేకుండా తెలుగు వాక్యం ఆ బలాన్ని ప్రతిబింబిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే కథన శైలి. సారా మాటల్లోని కఠినతను మెత్తబరచకుండా, హీబ్రూ పునరుక్తిని సాధ్యమైనంతవరకు నిలిపింది.
