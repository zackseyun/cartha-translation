reference: Genesis 21:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/תֹּ֗אמֶר מִ֤י מִלֵּל֙ לְ/אַבְרָהָ֔ם הֵינִ֥יקָה בָנִ֖ים שָׂרָ֑ה כִּֽי יָלַ֥דְתִּי בֵ֖ן לִ/זְקֻנָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/007.yaml
  text: And she said[b][a], “Who would have said to Abraham that Sarah would nurse children? For I have borne a son in his old age.”
translation:
  language: te
  text: 'అప్పుడు ఆమె ఇలా అంది: “శారా పిల్లలకు పాలిస్తుందని అబ్రాహాముకు ఎవరు చెప్పి ఉండేవారు?[a] ఎందుకంటే అతని వృద్ధాప్యంలో నేను ఒక కుమారుణ్ణి కన్నాను.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “శారా కుమారులకు పాలిస్తుందని అబ్రాహాముకు ఎవరు చెప్పేవారు?” మూల హీబ్రూలో ‘కుమారులు’ అని బహువచనం ఉంది.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: అప్పుడు ఆమె ఇలా అంది
  rationale: హీబ్రూ కథనంలోని wayyiqtol వరుసను సహజమైన ఆధునిక తెలుగు కథనశైలిలో ముందుకు నడిపిస్తుంది.
- source_word: מִי מִלֵּל לְאַבְרָהָם
  choice: అబ్రాహాముతో ఎవరు చెప్పి ఉండేవారు?
  rationale: ఇది సమాచారం కోరే సాధారణ ప్రశ్న కాక, ఊహించని పరిణామంపై ఆశ్చర్యాన్ని వ్యక్తం చేసే అలంకార ప్రశ్న. ‘చెప్పి ఉండేవారు’ ఆ భావాన్ని నిలుపుతుంది.
- source_word: הֵינִיקָה
  choice: పాలిస్తుందని
  rationale: యנק్ ధాతువు హిఫీల్ రూపం ‘పాలు ఇవ్వడం/పాలించడం’ అనే తల్లి చర్యను సూచిస్తుంది; ‘పాలిస్తుందని’ సహజమైన తెలుగు.
- source_word: בָנִים
  choice: పిల్లలకు
  rationale: మూలంలో అక్షరార్థంగా ‘కుమారులకు’ అనే బహువచనం ఉన్నా, పాలిచ్చే సందర్భంలో తెలుగు వాడుకకు ‘పిల్లలకు’ సహజం; తరువాతి ఉపవాక్యంలో శిశువు కుమారుడని స్పష్టమవుతుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి ఆశ్చర్యోక్తికి కారణాన్ని లేదా వివరణను పరిచయం చేసే సంధిగా כִּיని ప్రతిబింబిస్తుంది; విరోధార్థాన్ని అనవసరంగా చేర్చదు.
- source_word: יָלַדְתִּי בֵן
  choice: నేను అతనికి ఒక కుమారుణ్ణి కన్నాను
  rationale: జననాన్ని ప్రత్యక్షంగా, సహజంగా తెలుపుతుంది; ‘అతనికి’ అనేది לִזְקֻנָיוలోని దత్తివ సంబంధాన్ని తెలుగులో స్పష్టం చేస్తుంది.
- source_word: לִזְקֻנָיו
  choice: అతని ముసలితనంలో
  rationale: అబ్రాహాము వృద్ధాప్యంలో ఈ జననం జరిగిందనే కాలార్థాన్ని సహజంగా వ్యక్తం చేస్తుంది.
