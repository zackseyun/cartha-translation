translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథనశైలి. ఆశ్చర్యాన్ని తెలిపే అలంకార ప్రశ్నను, పాలిచ్చే మాతృచిత్రాన్ని, కుమారుడి జననాన్ని యథాతథంగా నిలిపింది.
