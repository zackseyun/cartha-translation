id: GEN.21.23
reference: Genesis 21:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/עַתָּ֗ה הִשָּׁ֨בְעָ/ה לִּ֤/י בֵֽ/אלֹהִים֙ הֵ֔נָּה אִם תִּשְׁקֹ֣ר לִ֔/י וּ/לְ/נִינִ֖/י וּ/לְ/נֶכְדִּ֑/י כַּ/חֶ֜סֶד אֲשֶׁר עָשִׂ֤יתִי עִמְּ/ךָ֙ תַּעֲשֶׂ֣ה עִמָּדִ֔/י וְ/עִם הָ/אָ֖רֶץ אֲשֶׁר גַּ֥רְתָּה בָּֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/023.yaml
  text: Swear to me here by God that you will not deal falsely with me, or with my children, or with my descendants. According to the kindness that I have shown to you, you shall show to me and to the land where you have lived as a foreigner.
translation:
  language: te
  text: 'ఇప్పుడు, ఇక్కడే దేవుని పేరట నాకు ప్రమాణం చేయి: నాతో గానీ, నా పిల్లలతో గానీ, నా సంతతివారితో గానీ మోసంగా ప్రవర్తించవద్దు. నేను నీ పట్ల చూపిన దయను బట్టి, నాపట్లా నీవు పరదేశిగా నివసించిన దేశంపట్లా చూపించు.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: కాబట్టి
  rationale: ఇది కేవలం కాలార్థకమైన ‘ఇప్పుడు’ కంటే, ముందరి సందర్భం నుంచి విజ్ఞప్తికి మారే నిర్ధారణాత్మక సంధిగా పనిచేస్తుంది.
- source_word: הִשָּׁבְעָה לִּי בֵאלֹהִים
  choice: దేవుని పేరట నాకు ప్రమాణం చేయి
  rationale: హీబ్రూ ఆజ్ఞారూపాన్ని సహజమైన తెలుగు ప్రమాణభాషలో వ్యక్తం చేస్తుంది; ‘ఇక్కడే’ తరువాతి הֵנָּהను సూచిస్తుంది.
- source_word: אִם תִּשְׁקֹר לִי
  choice: నాతో ... మోసంగా ప్రవర్తించవద్దు
  rationale: ప్రమాణ సూత్రంలో אִם నిషేధాత్మక ప్రమాణ విషయాన్ని పరిచయం చేస్తుంది; שקר ఇక్కడ అబద్ధం చెప్పడం మాత్రమే కాక విశ్వాసఘాతుకంగా వ్యవహరించడాన్నీ సూచిస్తుంది.
- source_word: לְנִינִי וּלְנֶכְדִּי
  choice: నా పిల్లలతో ... నా సంతతివారితో
  rationale: రెండు వంశపారంపర్య పదాల మధ్య ఉన్న క్రమాన్ని నిలుపుతూ, సాధారణ ఆధునిక తెలుగులో తరాల విస్తృతిని తెలియజేస్తుంది.
- source_word: חֶסֶד
  choice: విశ్వసనీయమైన ప్రేమ
  rationale: సందర్భంలో ఇది కేవలం దయకంటే సంబంధపరమైన నిబద్ధత, అనుగ్రహపూర్వక విశ్వసనీయతను సూచిస్తుంది.
- source_word: גַּרְתָּה בָּהּ
  choice: నీవు పరదేశిగా నివసించిన
  rationale: גור అనే క్రియలోని స్థానికుడు కాని నివాసి/వలసవాసి భావాన్ని స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: חֶסֶד యొక్క ఒడంబడిక సంబంధిత బరువు
  choice: విశ్వసనీయమైన ప్రేమ
  alternative: దయ
  rationale: పదానికి అవసరానికి మించిన సాంకేతిక మతపరమైన అర్థం జోడించకుండా, ఈ పరస్పర సంబంధ సందర్భంలోని నిబద్ధతను నిలుపుతుంది.
- issue: אִם ప్రమాణ నిర్మాణం
  choice: ప్రత్యక్ష నిషేధంగా అనువదించడం
  alternative: ‘నీవు మోసం చేస్తే...’ అనే షరతు వాక్యం
  rationale: హీబ్రూ ప్రమాణ సూత్రంలోని అపూర్ణంగా వదిలిన శాపభావాన్ని తెలుగులో యాంత్రికంగా పునరుత్పత్తి చేయకుండా, ఉద్దేశించిన ప్రమాణ విషయాన్ని స్పష్టంగా ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనా సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే ఆజ్ఞా వాక్య నిర్మాణం. మూలంలోని మూడు లక్ష్యాలను (‘నాతో... పిల్లలతో... సంతతివారితో’) మరియు వ్యక్తి నుంచి దేశానికి విస్తరించే సమాంతరతను నిలుపుకుంది.
