revisions:
- from: 'కాబట్టి, ఇక్కడే దేవుని పేరట నాకు ప్రమాణం చేయి: నాతో గానీ, నా పిల్లలతో గానీ, నా సంతతివారితో గానీ మోసంగా ప్రవర్తించవద్దు. నేను నీ పట్ల చూపిన విశ్వసనీయమైన ప్రేమనే నాపట్ల, నీవు పరదేశిగా నివసించిన ఈ దేశంపట్ల చూపించు.'
  to: 'ఇప్పుడు, ఇక్కడే దేవుని పేరట నాకు ప్రమాణం చేయి: నాతో గానీ, నా పిల్లలతో గానీ, నా సంతతివారితో గానీ మోసంగా ప్రవర్తించవద్దు. నేను నీ పట్ల చూపిన దయను బట్టి, నాపట్లా నీవు పరదేశిగా నివసించిన దేశంపట్లా చూపించు.'
