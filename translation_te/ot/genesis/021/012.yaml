revisions:
- from: 'అయితే దేవుడు అబ్రాహాముతో ఇలా అన్నాడు: “ఆ బాలుణ్ణిబట్టి, నీ దాసినిబట్టి నీకు బాధ కలగనివ్వకు.[a] శారా నీతో చెప్పేదంతా ఆమె మాట విను.[b] ఎందుకంటే ఇస్సాకు ద్వారానే నీ సంతానం అని పిలువబడుతుంది.[c]”'
  to: 'అయితే దేవుడు అబ్రాహాముతో ఇలా అన్నాడు: “ఆ బాలుణ్ణిబట్టి, నీ దాసినిబట్టి నీకు బాధ కలగనివ్వకు.[a] శారా నీతో చెప్పేదంతా ఆమె మాట విను.[b] ఎందుకంటే ఇస్సాకు ద్వారా నీ సంతానం పిలువబడుతుంది.[c]”'
  rationale: మొదటి రెండు వాక్యాలు, వాటి పాదసూచికలు, మరియు ప్రధాన పదజాలం యథాతథంగా ఉంచబడ్డాయి. చివరి ఉపవాక్యంలో మాత్రమే పిలువబడేది ‘సంతానం’ అనే హీబ్రూ వాక్యనిర్మాణం స్పష్టంగా కనిపించేలా ‘అని’ని తొలగించి, మూలంలోని ఉపసర్గకు మించిన బలాన్ని నివారించడానికి ‘ద్వారానే’ను ‘ద్వారా’గా మార్చాం. ప్రత్యామ్నాయ ‘ఇస్సాకులో’ పఠనం పాదసూచికలో అలాగే నిలిపాం.
