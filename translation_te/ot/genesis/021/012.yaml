id: GEN.21.12
reference: Genesis 21:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אֱלֹהִ֜ים אֶל אַבְרָהָ֗ם אַל יֵרַ֤ע בְּ/עֵינֶ֨י/ךָ֙ עַל הַ/נַּ֣עַר וְ/עַל אֲמָתֶ֔/ךָ כֹּל֩ אֲשֶׁ֨ר תֹּאמַ֥ר אֵלֶ֛י/ךָ שָׂרָ֖ה שְׁמַ֣ע בְּ/קֹלָ֑/הּ כִּ֣י בְ/יִצְחָ֔ק יִקָּרֵ֥א לְ/ךָ֖ זָֽרַע־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/012.yaml
  text: But God said to Abraham[a], “Do not let it be grievous in your sight because of the boy and because of your servant woman. Whatever Sarah says to you, listen to her voice[d][c][b], for through Isaac your offspring will be called.”
translation:
  language: te
  text: 'అయితే దేవుడు అబ్రాహాముతో ఇలా అన్నాడు: “ఆ బాలుణ్ణిబట్టి, నీ దాసినిబట్టి నీకు బాధ కలగనివ్వకు.[a] శారా నీతో చెప్పేదంతా ఆమె మాట విను.[b] ఎందుకంటే ఇస్సాకు ద్వారా నీ సంతానం పిలువబడుతుంది.[c]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “ఆ బాలుణ్ణిబట్టి, నీ దాసినిబట్టి అది నీ కళ్లలో చెడ్డదిగా ఉండనివ్వకు”; అంటే, వారినిబట్టి బాధపడకు లేదా మనస్తాపపడకు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “ఆమె స్వరం విను”; అంటే, శారా చెప్పేదాన్ని ఆలకించి అనుసరించు.
    reason: lexical_alternative
  - marker: c
    text: లేదా, “ఇస్సాకులో నీ సంతానం పిలువబడుతుంది.” ఈ మాట అబ్రాహాము వాగ్దాన వంశరేఖ ఇస్సాకు ద్వారా గుర్తింపబడటాన్ని సూచిస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: יֵרַע בְּעֵינֶיךָ
  choice: నీకు బాధ కలగనివ్వకు
  rationale: ‘నీ కళ్లలో చెడ్డదిగా ఉండకూడదు’ అనే హీబ్రూ నుడికారానికి బాధపడటం లేదా మనస్తాపం చెందటం అనే భావం ఉంది. తెలుగు సహజత్వంతో ఆ భావాన్ని అందిస్తుంది.
- source_word: הַנַּעַר
  choice: ఆ బాలుడు
  rationale: సందర్భంలో ఇష్మాయేలును సూచించే נַעַר అనే సాధారణ వయోపదానికి ఆధునిక తెలుగులో సహజమైన రూపం.
- source_word: אֲמָתֶךָ
  choice: నీ దాసి
  rationale: ఆమా అనే పదం హాగరు స్వతంత్ర భార్య కాదని, బానిసత్వానికి సంబంధించిన అధీన సామాజిక స్థితిలో ఉన్న స్త్రీ అని సూచిస్తుంది. ‘దాసి’ ఆ స్థితిని సంక్షిప్తంగా, గౌరవప్రదమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: שְׁמַע בְּקֹלָהּ
  choice: ఆమె మాట విను
  rationale: అక్షరార్థంగా ‘ఆమె స్వరం విను’; సందర్భంలో ఆమె చెప్పినదాన్ని ఆలకించి అనుసరించమనే నుడికారం. ‘మాట విను’ తెలుగు నుడికారంలో అదే ద్వంద్వభావాన్ని సహజంగా నిలుపుతుంది.
- source_word: בְּיִצְחָק
  choice: ఇస్సాకు ద్వారానే
  rationale: ב ఉపసర్గ ఇక్కడ వంశరేఖ ఇస్సాకు ద్వారా గుర్తింపబడుతుందని సూచిస్తుంది. ‘ద్వారా’ దీనిని స్పష్టంగా తెలుపుతుంది; ‘నే’ సందర్భంలోని వ్యత్యాస బలాన్ని ప్రతిబింబిస్తుంది.
- source_word: יִקָּרֵא לְךָ זָרַע
  choice: నీ సంతానం అని పిలువబడుతుంది
  rationale: కרא నిఫాల్‌లో ‘పిలువబడటం/పేరు పొందటం’ అనే భావాన్ని నిలుపుతూ, לְךָ ను ‘నీ’ అనే సంబంధార్థంగా వ్యక్తం చేస్తుంది. ఇది వంశం అబ్రాహాముదిగా గుర్తింపబడటాన్ని సూచిస్తుంది; ‘లెక్కించబడుతుంది’ అని పూర్తిగా వ్యాఖ్యానించదు.
- source_word: זָרַע
  choice: సంతానం
  rationale: సామూహిక ఏకవచన భావాన్ని సహజ తెలుగులో నిలుపుతుంది; ‘వారసులు’ లేదా ‘సంతతివారు’ అని తప్పనిసరిగా బహువచనంగా మార్చదు.
- source_word: וַיֹּאמֶר אֱלֹהִים
  choice: అయితే దేవుడు ... అన్నాడు
  rationale: వావ్ కథనాన్ని ముందుకు నడిపినా, ముందు వచనంలోని అబ్రాహాము మనస్తాపానికి దేవుని మాట ప్రత్యుత్తరంగా, వ్యత్యాసంగా వస్తుంది. ‘అయితే’ ఆ ప్రసంగ సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: హాగరు సామాజిక స్థితిని సూచించే పదం
  choice: నీ దాసి
  alternative: నీ పనిమనిషి / నీ సేవకురాలు
  rationale: మూలపదంలోని అధీన, బానిస సామాజిక స్థితిని ‘పనిమనిషి’ అని మృదువుగా మార్చకుండా నిలుపుతుంది; అదే సమయంలో సందర్భానికి అనవసరమైన వివరణను ప్రధాన పాఠ్యంలో చేర్చదు.
- issue: ఇస్సాకు ద్వారా సంతానం పిలువబడటం
  choice: ఇస్సాకు ద్వారానే నీ సంతానం అని పిలువబడుతుంది
  alternative: ఇస్సాకులో నీ సంతానం పిలువబడుతుంది / ఇస్సాకు ద్వారా నీ వారసులు నీవారిగా లెక్కించబడతారు
  rationale: అబ్రాహాము వాగ్దాన వంశరేఖ ఇస్సాకు ద్వారా గుర్తింపబడుతుందనే భావాన్ని అందిస్తూ, ఇష్మాయేలుతో జీవసంబంధాన్ని నిరాకరించేలా వాక్యాన్ని సంకుచితం చేయదు. ‘పిలువబడుతుంది’ అనే మూలంలోని పిలుపు/నామకరణ భాషను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనప్పటికీ గౌరవప్రదమైన కథన శైలి. హీబ్రూ నుడికారాలను ప్రధాన పాఠ్యంలో సహజీకరించి, ముఖ్యమైన అక్షరార్థ రూపాలను పాదసూచికల్లో నిలిపాం. ‘దాసి’ ద్వారా సామాజిక అధీన స్థితిని మృదువుచేయకుండా సూచించాం.
