  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּשְׁכֵּ֣ם אַבְרָהָ֣ם בַּ/בֹּ֡קֶר וַ/יִּֽקַּֽח לֶחֶם֩ וְ/חֵ֨מַת מַ֜יִם וַ/יִּתֵּ֣ן אֶל הָ֠גָר שָׂ֧ם עַל שִׁכְמָ֛/הּ וְ/אֶת הַ/יֶּ֖לֶד וַֽ/יְשַׁלְּחֶ֑/הָ וַ/תֵּ֣לֶךְ וַ/תֵּ֔תַע בְּ/מִדְבַּ֖ר בְּאֵ֥ר שָֽׁבַע׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/014.yaml
  text: So Abraham rose early in the morning and took bread and a skin of water and gave them to Hagar[a], putting them on her shoulder, along with the boy, and sent her away. And she went and wandered in the wilderness of Beersheba.
translation:
  language: te
  text: అప్పుడు అబ్రాహాము ఉదయాన్నే లేచి, రొట్టెను, నీళ్ల తోలుతిత్తిని తీసుకొని హాగరుకు ఇచ్చాడు. వాటిని ఆమె భుజంపై ఉంచి, బాలుణ్ణి కూడా ఆమెతో పంపివేశాడు[a]. ఆమె వెళ్లి బెయేర్షెబా అరణ్యంలో అటూ ఇటూ తిరిగింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “ఆమె భుజంపై ఉంచి, బాలుణ్ణి కూడా” అని ఉంది. వాక్యనిర్మాణం కుదించబడి ఉంది. దీనిని “వాటిని ఆమె భుజంపై ఉంచి, బాలుణ్ణి కూడా ఆమెకు ఇచ్చి” అని అర్థం చేసుకోవచ్చు; కొందరు ఈ పదబంధాన్ని మరింత దగ్గరగా “ఆమె భుజంపై ఉంచి, బాలుణ్ణి కూడా” అని అనువదిస్తారు.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּשְׁכֵּם ... בַּבֹּקֶר
  choice: తెల్లవారుజామునే లేచి
  rationale: హిఫీల్ రూపంలోని ‘పొద్దున్నే లేవడం’ అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో కాల ప్రాధాన్యంతో వ్యక్తం చేస్తుంది.
- source_word: לֶחֶם
  choice: రొట్టె
  rationale: మూలపదపు ప్రత్యక్ష అర్థాన్ని నిలుపుతుంది; సందర్భం తప్పనిసరిగా విస్తృతమైన ‘ఆహారం’ అనే అర్థాన్ని కోరదు.
- source_word: חֵמַת מַיִם
  choice: నీళ్ల తోలుతిత్తి
  rationale: ద్రవాలను ఉంచే జంతుచర్మపు పాత్రను సూచిస్తుంది; ఆధునిక ‘సీసా’ అనే భౌతిక రూపాన్ని అనవసరంగా దిగుమతి చేయదు.
- source_word: וַיִּתֵּן אֶל הָגָר
  choice: హాగరుకు ఇచ్చాడు
  rationale: ముందు పేర్కొన్న రొట్టె, నీళ్ల తోలుతిత్తి ఈ క్రియకు కర్మలని తెలుగు వాక్యక్రమంలో స్పష్టంగా ఉంచుతుంది.
- source_word: שָׂם עַל שִׁכְמָהּ
  choice: వాటిని ఆమె భుజంపై పెట్టి
  rationale: ‘పెట్టి’ అనే సందర్భార్థక క్రియారూపం అబ్రాహాము సరఫరాలను ఎలా ఇచ్చాడో తెలియజేస్తుంది; ‘వాటిని’ సరఫరాలకే అన్వయిస్తుంది.
- source_word: וְאֶת הַיֶּלֶד
  choice: బాలుణ్ణి కూడా ఆమెకు అప్పగించి
  rationale: కుదించబడిన హీబ్రూ వాక్యనిర్మాణాన్ని సహజ తెలుగులో తెలియజేస్తూ, బాలుణ్ణి భుజంపై పెట్టాడనే అపార్థాన్ని నివారిస్తుంది; మూలంలోని అనిశ్చితిని పాదసూచికలో నమోదు చేస్తుంది.
- source_word: וַיְשַׁלְּחֶהָ
  choice: ఆమెను పంపివేశాడు
  rationale: ఈ సందర్భంలోని ‘విడిచిపంపడం/పంపివేయడం’ భావాన్ని గంభీరంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וַתֵּתַע
  choice: దారి తప్పి తిరిగింది
  rationale: תעה లోని దారి తప్పడం లేదా సంచరించడం అనే భావాలను తెలుగులో సహజంగా కలిపి వ్యక్తం చేస్తుంది; ఉద్దేశపూర్వక సంచారమని చెప్పదు.
- source_word: בְּמִדְבַּר בְּאֵר שָׁבַע
  choice: బెయేర్షెబా అరణ్యంలో
  rationale: מִדְבָּר ను కేవలం ఇసుక ఎడారిగా పరిమితం చేయకుండా ‘అరణ్యం’గా ఇస్తుంది; స్థలనామాన్ని హీబ్రూ ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరిస్తుంది.
theological_decisions:
- issue: ‘బాలుణ్ణి’ అనే పదబంధానికి ‘భుజంపై పెట్టి’ అనే మాటతో ఉన్న వాక్యనిర్మాణ సంబంధం
  choice: సరఫరాలను హాగరు భుజంపై పెట్టి, బాలుణ్ణి కూడా ఆమెకు అప్పగించి పంపివేశాడని ప్రధాన పాఠంలో తెలిపింది.
  alternative: హీబ్రూ పదక్రమాన్ని మరింత ప్రత్యక్షంగా అనుసరించి, ‘ఆమె భుజంపై పెట్టి, బాలుణ్ణి కూడా’ అని ఉంచవచ్చు; అది బాలుణ్ణి సైతం భుజంపై పెట్టాడనే భావాన్ని కలిగించవచ్చు.
  rationale: హీబ్రూ వాక్యనిర్మాణం కుదించబడి ఉండటం వల్ల ‘బాలుడు’ ఏ క్రియతో నేరుగా సంబంధించాడో కొంత అస్పష్టత ఉంది. ఆధునిక పాఠకునికి తప్పుదారి పట్టించకుండా సహజమైన భావాన్ని ప్రధాన పాఠంలో ఇచ్చి, నిజమైన వాక్యనిర్మాణ అస్పష్టతను పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన కథనశైలి, అయితే గౌరవప్రదమైన బైబిలు ధోరణి నిలుపబడింది. ‘తోలుతిత్తి’ వంటి వస్తుసంబంధ పదం చారిత్రక స్వరూపాన్ని కాపాడుతుంది. పాదసూచిక గుర్తు [a] ప్రధాన పాఠంలో ఉంది.
