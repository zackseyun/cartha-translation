revisions:
- from: కాబట్టి అబ్రాహాము తెల్లవారుజామునే లేచి, రొట్టెను, నీళ్ల తోలుతిత్తిని తీసుకొని హాగరుకు ఇచ్చాడు. వాటిని ఆమె భుజంపై పెట్టి, బాలుణ్ణి కూడా ఆమెకు అప్పగించి[a], ఆమెను పంపివేశాడు. ఆమె వెళ్లి బెయేర్షెబా అరణ్యంలో దారి తప్పి తిరిగింది.
  to: అప్పుడు అబ్రాహాము ఉదయాన్నే లేచి, రొట్టెను, నీళ్ల తోలుతిత్తిని తీసుకొని హాగరుకు ఇచ్చాడు. వాటిని ఆమె భుజంపై ఉంచి, బాలుణ్ణి కూడా ఆమెతో పంపివేశాడు[a]. ఆమె వెళ్లి బెయేర్షెబా అరణ్యంలో అటూ ఇటూ తిరిగింది.
  rationale: The revision removes the added notion that Abraham formally entrusted the boy to Hagar, retains the natural reading that the provisions were placed on her shoulder and the boy went with her, and documents the Hebrew's compressed syntax in the footnote. It also replaces an unwarranted inferential connector and avoids overdefining Hagar's wandering as literal loss of direction.
