id: GEN.21.2
reference: Genesis 21:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/תַּהַר֩ וַ/תֵּ֨לֶד שָׂרָ֧ה לְ/אַבְרָהָ֛ם בֵּ֖ן לִ/זְקֻנָ֑י/ו לַ/מּוֹעֵ֕ד אֲשֶׁר דִּבֶּ֥ר אֹת֖/וֹ אֱלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/002.yaml
  text: So Sarah conceived and bore a son to Abraham in his old age[b][a], at the appointed time that God had spoken to him.
translation:
  language: te
  text: అలా సారా గర్భం ధరించి, అబ్రాహాము వృద్ధాప్యంలో అతనికి ఒక కుమారుణ్ణి కన్నది, దేవుడు అతనికి చెప్పిన నిర్ణీత సమయానికి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתַּהַר
  choice: గర్భం ధరించి
  rationale: הרה గర్భవతి కావడం లేదా గర్భం ధరించడం అనే అర్థాన్ని ఇస్తుంది. ఆధునిక ప్రామాణిక తెలుగులో ఇది సహజంగా, గౌరవప్రదంగా ఉంటుంది.
- source_word: וַתֵּלֶד
  choice: కన్నది
  rationale: ילד ఇక్కడ ప్రసవాన్ని తెలిపే కథన క్రియ. ‘కుమారుణ్ణి కన్నది’ అనేది తెలుగులో స్పష్టమైన, సహజమైన ప్రయోగం.
- source_word: לְאַבְרָהָם בֵּן
  choice: అతనికి ఒక కుమారుణ్ణి
  rationale: לְ సంబంధం బిడ్డ అబ్రాహాముకు పుట్టాడని సూచిస్తుంది; בֵּן శిశువు కుమారుడని తెలియజేస్తుంది. ‘ఒక’ తెలుగు కథనంలో సహజమైన అనిర్దిష్టతను అందిస్తుంది.
- source_word: לִזְקֻנָיו
  choice: అబ్రాహాము వృద్ధాప్యంలో ఉండగా
  rationale: పురుష ఏకవచన ప్రత్యయం అబ్రాహామును సూచిస్తుంది. ఈ మాట ఉద్దేశాన్ని కాక, అతని ముసలితనంలో జరిగిన కాలపరిస్థితిని తెలియజేస్తుంది.
- source_word: לַמּוֹעֵד
  choice: నిర్ణీత సమయానికే
  rationale: מוֹעֵד ముందుగా నిర్ణయించబడిన లేదా నియమించబడిన సమయాన్ని సూచిస్తుంది. ‘-కే’ వాగ్దాన నెరవేర్పులోని ఖచ్చిత సమయాన్ని సహజంగా ప్రతిబింబిస్తుంది.
- source_word: אֲשֶׁר דִּבֶּר אֹתוֹ אֱלֹהִים
  choice: దేవుడు అతనితో చెప్పిన
  rationale: సంబంధ వాక్యం ‘నిర్ణీత సమయం’ గురించిన దేవుని మునుపటి మాటను సూచిస్తుంది. ఈ రూపం దేవుడు అదే సమయంలో మాట్లాడాడనే అపార్థాన్ని నివారిస్తూ మూల సంబంధాన్ని కాపాడుతుంది.
- source_word: וַ
  choice: అలా
  rationale: ప్రారంభ వావ్ ముందరి వాగ్దాన-నెరవేర్పు కథనాన్ని కొనసాగిస్తుంది. సందర్భానుసారంగా ‘అలా’ సహజమైన ఫలిత సంబంధాన్ని తెలియజేస్తుంది.
- source_word: אֱלֹהִים
  choice: దేవుడు
  rationale: ఇక్కడ సాధారణ దైవసూచక నామానికి ప్రామాణిక తెలుగు సమానం.
theological_decisions:
- issue: దైవ వాగ్దానం నిర్ణీత సమయంలో నెరవేరిందనే భావాన్ని అదనపు వ్యాఖ్యానం లేకుండా వ్యక్తపరచడం
  choice: దేవుడు అతనితో చెప్పిన నిర్ణీత సమయానికే
  alternative: దేవుడు అతనితో ఏ సమయం గురించి చెప్పాడో, ఆ సమయానికి
  rationale: మూలంలోని సంబంధ వాక్యం నిర్ణీత సమయాన్ని దేవుని ముందరి మాటతో అనుసంధానిస్తుంది. ఎంచుకున్న రూపం దేవుని విశ్వసనీయతపై అదనపు సిద్ధాంత వ్యాఖ్యను చేర్చకుండా ఆ నెరవేర్పు భావాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా, అయితే బైబిల్ కథనానికి తగిన గౌరవప్రద శైలిలో ఉంది. క్రియల క్రమం—గర్భం ధరించడం, కుమారుణ్ణి కనడం—మూల కథనానికి అనుగుణంగా ఉంచబడింది.
