  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר אֲבִימֶ֖לֶךְ אֶל אַבְרָהָ֑ם מָ֣ה הֵ֗נָּה שֶׁ֤בַע כְּבָשֹׂת֙ הָ/אֵ֔לֶּה אֲשֶׁ֥ר הִצַּ֖בְתָּ לְ/בַדָּֽ/נָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/029.yaml
  text: And Abimelech said to Abraham[a], “What are these seven ewe lambs that you have set apart by themselves?”
translation:
  language: te
  text: అప్పుడు అబీమెలెకు అబ్రాహాముతో, “నువ్వు విడిగా ఉంచిన ఈ ఏడు ఆడ గొర్రెపిల్లల సంగతి ఏమిటి?” అని అడిగాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... అడిగాడు
  rationale: వావ్-కన్సిక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది. వాక్యం ప్రశ్న కావడంతో, తెలుగులో సహజంగా ‘అడిగాడు’ అని అనువదించాం.
- source_word: אֲבִימֶלֶךְ
  choice: అబీమెలెకు
  rationale: వ్యక్తి పేరును హెబ్రీ ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించాం.
- source_word: אֶל־אַבְרָהָם
  choice: అబ్రాహాముతో
  rationale: మాట ఎవరిని ఉద్దేశించి చెప్పబడిందో తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: מָה הֵנָּה
  choice: సంగతి ఏమిటి?
  rationale: ఈ జంతువుల ఉద్దేశం లేదా ప్రాముఖ్యత ఏమిటని అడిగే ప్రశ్నను సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది; ‘ఎందుకు’ అని కారణాన్ని మాత్రమే నిర్దేశించదు.
- source_word: שֶׁבַע כְּבָשֹׂת הָאֵלֶּה
  choice: ఈ ఏడు ఆడ గొర్రెపిల్లలు
  rationale: כְּבָשֹׂת స్త్రీలింగ రూపం కాబట్టి, సాధారణ ‘గొర్రెపిల్లలు’కు బదులు ఆడవి అనే నిర్దిష్టతను నిలిపాం.
- source_word: הִצַּבְתָּ
  choice: ఉంచిన
  rationale: హిఫిల్ రూపానికి ‘నిలబెట్టు/ఉంచు’ అనే ప్రాథమిక భావం ఉంది; సందర్భంలోని వేరుచేయడాన్ని לְבַדָּנָה స్పష్టపరుస్తుంది.
- source_word: לְבַדָּנָה
  choice: విడిగా
  rationale: మిగిలిన వాటి నుంచి వేరుగా ఉంచబడిన సమూహాన్ని సంక్షిప్తంగా, సహజంగా సూచిస్తుంది.
