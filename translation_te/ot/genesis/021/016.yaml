  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కథన శైలి. మూలంలోని ‘ఎదురుగా’ అనే పునరుక్తి నిలుపబడింది; హెబ్రీయ నుడికారమైన ‘స్వరాన్ని ఎత్తి ఏడ్చింది’ను సాధారణ పాఠకునికి సహజంగా ‘బిగ్గరగా ఏడ్చింది’గా అందించాం.
