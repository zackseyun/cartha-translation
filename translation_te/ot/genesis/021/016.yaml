  edition: WLC
  text: וַ/תֵּלֶךְ֩ וַ/תֵּ֨שֶׁב לָ֜/הּ מִ/נֶּ֗גֶד הַרְחֵק֙ כִּ/מְטַחֲוֵ֣י קֶ֔שֶׁת כִּ֣י אָֽמְרָ֔ה אַל אֶרְאֶ֖ה בְּ/מ֣וֹת הַ/יָּ֑לֶד וַ/תֵּ֣שֶׁב מִ/נֶּ֔גֶד וַ/תִּשָּׂ֥א אֶת קֹלָ֖/הּ וַ/תֵּֽבְךְּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/016.yaml
  text: Then she went and sat down opposite him[a], at a distance, about a bowshot away, for she said, “Let me not look on the death of the boy.” So she sat opposite him and lifted up her voice and wept.
translation:
  language: te
  text: అప్పుడు ఆమె వెళ్లి, అతనికి ఎదురుగా[a] కొంత దూరంలో—దాదాపు ఒక బాణం వెళ్లేంత దూరంలో—కూర్చుంది. ఎందుకంటే, “బాలుడు చనిపోవడం నేను చూడకూడదు” అని ఆమె అనుకుంది. అలా ఆమె అతనికి ఎదురుగా కూర్చుని, తన స్వరాన్ని ఎత్తి ఏడ్చింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతనికి కొంత దూరంగా.”
    reason: מִנֶּגֶד అనే పదం ‘ఎదురుగా’ అనే స్థాన సంబంధంతోపాటు, సందర్భాన్ని బట్టి ‘కొంత దూరంగా’ అనే భావాన్నీ సూచించగలదు.
lexical_decisions:
- source_word: מִנֶּגֶד
  choice: అతనికి ఎదురుగా
  rationale: ఈ పదం ఎదుట లేదా ఎదురుగా, కొంత దూరంలో ఉండడాన్ని సూచిస్తుంది. మొదటి సందర్భంలో הַרְחֵק మరియు బాణం వెళ్లే దూరం అనే వివరణలు దూరాన్ని స్పష్టం చేస్తాయి; రెండుసార్లూ ఒకే పదబంధాన్ని ఉంచడం మూలంలోని పునరుక్తిని కాపాడుతుంది.
- source_word: הַרְחֵק
  choice: కొంత దూరంలో
  rationale: רחק నుంచి వచ్చిన ఈ క్రియావిశేషణ రూపం దూరంగా ఉండడాన్ని బలపరుస్తుంది. ఆధునిక తెలుగులో సహజంగా ఉండేలా ‘కొంత దూరంలో’ అని అనువదించబడింది.
- source_word: כִּמְטַחֲוֵי קֶשֶׁת
  choice: దాదాపు ఒక బాణం వెళ్లేంత దూరంలో
  rationale: ఇది విల్లు నుంచి విడిచిన బాణం చేరే పరిధిని ఆధారంగా చేసుకున్న సుమారు దూరాన్ని తెలిపే నుడికారం. విలువిద్య దృశ్యాన్ని నిలుపుతూ తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: הַיָּלֶד
  choice: బాలుడు
  rationale: יֶלֶד చిన్నపిల్లను మాత్రమే కాక బాలుడు లేదా యువకుణ్ణి కూడా సూచించగలదు. ఇష్మాయేలు వయస్సును అతిగా నిర్దిష్టం చేయకుండా ‘బాలుడు’ గౌరవప్రదమైన సాధారణ ఎంపిక.
- source_word: אַל אֶרְאֶה בְּמוֹת הַיָּלֶד
  choice: బాలుడు చనిపోవడం నేను చూడకూడదు
  rationale: మొదటి పురుష నిషేధాత్మక ఆకాంక్షను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది. ‘బాలుని మరణాన్ని చూడకూడదు’ అనే నామవాచక నిర్మాణం కూడా సాధ్యమని పాదసూచికలో నిలుపబడింది.
- source_word: וַתִּשָּׂא אֶת־קֹלָהּ וַתֵּבְךְּ
  choice: బిగ్గరగా ఏడ్చింది
  rationale: అక్షరార్థంగా ‘తన స్వరాన్ని ఎత్తి ఏడ్చింది’ అనే హెబ్రీయ నుడికారాన్ని తెలుగులో సహజమైన ఒకే వ్యక్తీకరణగా అందిస్తుంది; శబ్దంతో చేసిన విలాప భావం నిలుస్తుంది.
- source_word: לָהּ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ‘తనకోసం/తనంతట తాను’ అనే దత్తివాచక ఛాయ ఇక్కడ కూర్చోవడంలో అంతర్లీనంగా ఉంది. దాన్ని ‘ఒంటరిగా’ అని స్పష్టీకరిస్తే మూలంలో లేని భావాన్ని ఎక్కువగా నిర్దిష్టం చేసే అవకాశం ఉంది.
