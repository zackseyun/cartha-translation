  yaml_path: translation/ot/genesis/021/021.yaml
  text: He lived in the wilderness of Paran[b][a], and his mother took a wife for him from the land of Egypt.
translation:
  language: te
  text: అతడు పారాను అరణ్యంలో[a] నివసించాడు. అతని తల్లి ఐగుప్తు దేశం నుండి అతనికోసం ఒక భార్యను తీసుకుంది[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పారాను ఎడారిలో.”
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “అతని తల్లి ఐగుప్తు దేశం నుండి అతనికోసం ఒక స్త్రీని తీసుకుంది”; సందర్భం వివాహ ఏర్పాటును సూచిస్తున్నందున ప్రధాన పాఠంలో “భార్య” అని అనువదించబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: నివసించాడు
  rationale: ישׁב ఇక్కడ ఒక ప్రాంతంలో ఉండి జీవించడాన్ని సూచిస్తుంది. ‘నివసించాడు’ అనేది శాశ్వతంగా స్థిరపడ్డాడనే భావాన్ని అనవసరంగా బలపరచకుండా సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: בְּמִדְבַּר פָּארָן
  choice: పారాను అరణ్యంలో
  rationale: מִדְבָּר జనావాసం తక్కువైన అరణ్య/ఎడారి ప్రాంతాన్ని సూచించగలదు. విస్తృత అర్థాన్ని నిలుపుతూ బైబిలు కథనానికి సహజంగా ఉండే ‘అరణ్యం’ వాడబడింది; פָּארָן స్థలనామంగా ‘పారాను’ అని లిప్యంతరీకరించబడింది.
- source_word: וַתִּקַּח
  choice: తీసుకొచ్చింది
  rationale: לקח యొక్క ప్రాథమిక భావం ‘తీసుకోవడం.’ ఈ వివాహ సందర్భంలో తల్లి అతనికోసం వధువును సమకూర్చిన చర్యను సహజ తెలుగులో ‘తీసుకొచ్చింది’ తెలియజేస్తుంది.
- source_word: לוֹ
  choice: అతనికి
  rationale: ל సర్వనామ ప్రత్యయం ఇక్కడ ప్రయోజనం లేదా సంబంధాన్ని సూచిస్తుంది; వివాహ ఏర్పాటులో ‘అతనికి’ సహజంగా సరిపోతుంది.
- source_word: אִמּוֹ
  choice: అతని తల్లి
  rationale: మూలంలోని స్వామ్యసంబంధ నామవాచకాన్ని స్పష్టంగా, నేరుగా అనువదిస్తుంది.
- source_word: אִשָּׁה
  choice: ఒక భార్యను
  rationale: אִשָּׁה అనే పదానికి ‘స్త్రీ’ లేదా ‘భార్య’ అనే అర్థాలు ఉన్నాయి. అతనికోసం ఆమెను తీసుకోవడం అనే సందర్భం వివాహ సంబంధాన్ని సూచిస్తున్నందున ప్రధాన పాఠంలో ‘భార్య’ ఉపయోగించబడింది.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: ఐగుప్తు దేశం నుండి
  rationale: మూలంలో ఉన్న אֶרֶץ (‘దేశం’) పదాన్ని నిలుపుతూ, తెలుగులో సుపరిచితమైన బైబిలు స్థలనామ రూపం ‘ఐగుప్తు’ ఉపయోగించబడింది.
