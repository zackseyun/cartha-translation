  yaml_path: translation/ot/genesis/021/025.yaml
  text: Then Abraham reproved Abimelech about the well of water that Abimelech’s servants had seized.
translation:
  language: te
  text: అప్పుడు అబ్రాహాము, అబీమెలెకు సేవకులు లాక్కున్న నీటి బావి విషయమై, అబీమెలెకును నిలదీశాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהוֹכִחַ
  choice: నిలదీశాడు
  rationale: హిఫీల్ రూపం ఇక్కడ తప్పును నేరుగా ఎత్తిచూపి జవాబు కోరే భావాన్ని ఇస్తుంది; ఆధునిక తెలుగులో ‘నిలదీశాడు’ సహజంగా, గంభీరంగా ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: עַל אֹדוֹת
  choice: గురించి
  rationale: వివాదానికి సంబంధించిన విషయాన్ని సూచించే సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: בְּאֵר הַמַּיִם
  choice: నీటి బావి
  rationale: హీబ్రూ పదబంధాన్ని స్పష్టంగా, సహజంగా ప్రతిబింబిస్తుంది.
- source_word: גָּזְלוּ
  choice: బలవంతంగా స్వాధీనం చేసుకున్న
  rationale: గזל అన్యాయంగా లేదా బలవంతంగా లాక్కోవడాన్ని సూచిస్తుంది; కేవలం ‘తీసుకున్న’ కంటే మూలంలోని దౌర్జన్య భావాన్ని కాపాడుతుంది.
- source_word: עַבְדֵי אֲבִימֶלֶךְ
  choice: అబీమెలెకు సేవకులు
  rationale: עבדים సందర్భానుసారంగా రాజు లేదా అధికారి కింద పనిచేసే సేవకులను సూచిస్తుంది; ‘సేవకులు’ మూలార్థాన్ని విస్తృతంగా కాపాడుతుంది.
