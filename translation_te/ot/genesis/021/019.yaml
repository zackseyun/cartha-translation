source:
  edition: WLC
  text: וַ/יִּפְקַ֤ח אֱלֹהִים֙ אֶת עֵינֶ֔י/הָ וַ/תֵּ֖רֶא בְּאֵ֣ר מָ֑יִם וַ/תֵּ֜לֶךְ וַ/תְּמַלֵּ֤א אֶת הַ/חֵ֨מֶת֙ מַ֔יִם וַ/תַּ֖שְׁקְ אֶת הַ/נָּֽעַר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/019.yaml
  text: Then God opened her eyes[a], and she saw a well of water. She went and filled the skin with water and gave the boy a drink.
translation:
  language: te
  text: అప్పుడు దేవుడు ఆమె కళ్లను తెరిచాడు; ఆమె ఒక నీటి బావిని చూసింది. ఆమె వెళ్లి, తోలు సంచిని[a] నీళ్లతో నింపి, బాలునికి తాగించింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అంటే, నీళ్లు తీసుకెళ్లడానికి ఉపయోగించే జంతు చర్మంతో చేసిన సంచి.
    reason: ‘తోలు సంచి’గా అనువదించిన חֵמֶת అనే హీబ్రూ పదం సూచించే పాత్ర స్వభావాన్ని వివరిస్తుంది.
lexical_decisions:
- source_word: וַיִּפְקַח
  choice: తెరిచాడు
  rationale: פקח అనే క్రియ కళ్లను ‘తెరవడం’ అనే అర్థంలో సాధారణంగా వాడబడుతుంది. ఈ ఎంపిక హీబ్రూ భాషలోని స్పష్టమైన రూపకాన్ని, దాని ఫలితమైన దృష్టిని వివరించి పరిమితం చేయకుండా నిలుపుతుంది.
- source_word: אֱלֹהִים
  choice: దేవుడు
  rationale: ఇక్కడ ఏకవచన క్రియతో వచ్చిన אֱלֹהִים కథనంలోని ఏకైక దేవుణ్ణి సూచిస్తుంది.
- source_word: עֵינֶיהָ
  choice: ఆమె కళ్లను
  rationale: హీబ్రూ పదబంధానికి ప్రత్యక్షమైన, సహజమైన తెలుగు అనువాదం.
- source_word: וַתֵּרֶא
  choice: ఆమె ... చూసింది
  rationale: ראה అనే క్రియకు సరళమైన అనువాదం; దేవుడు ఆమె కళ్లను తెరిచిన తరువాత జరిగే కథన క్రమాన్ని కాపాడుతుంది.
- source_word: בְּאֵר מָיִם
  choice: ఒక నీటి బావిని
  rationale: ‘నీటి బావి’ అనే నిర్మాణం హీబ్రూ పదబంధంలోని రెండు అంశాలనూ నిలుపుతూ తెలుగులో సహజంగా ఉంటుంది.
- source_word: וַתֵּלֶךְ
  choice: ఆమె వెళ్లి
  rationale: కథనంలోని వరుస చర్యను తెలుగులో సహజంగా కలుపుతుంది.
- source_word: וַתְּמַלֵּא
  choice: నింపి
  rationale: מלא క్రియకు సందర్భానుకూలమైన సాధారణ తెలుగు పదం.
- source_word: הַחֵמֶת
  choice: తోలు సంచిని
  rationale: חֵמֶת ద్రవాన్ని మోసుకెళ్లే జంతు చర్మపు పాత్రను సూచిస్తుంది. ‘తోలు సంచి’ ఆధునిక పాఠకులకు అర్థమయ్యేలా ఉండి, పాత్ర స్వభావాన్ని నిలుపుతుంది.
- source_word: מַיִם
  choice: నీళ్లతో
  rationale: తెలుగులో ‘సంచిని నీళ్లతో నింపడం’ సహజమైన ప్రయోగం.
- source_word: וַתַּשְׁקְ
  choice: తాగించింది
  rationale: שׁקה హిఫీల్ రూపం ‘తాగనివ్వడం/తాగించడం’ అనే కారణార్థాన్ని కలిగి ఉంది; ‘తాగించింది’ సంక్షిప్తంగా, సహజంగా దాన్ని తెలియజేస్తుంది.
- source_word: הַנַּעַר
  choice: బాలునికి
  rationale: ఇక్కడ נַעַר హాగరు కుమారుడైన ఇష్మాయేలును సూచిస్తుంది. ‘బాలుడు’ గౌరవప్రదమైన, సులభంగా అర్థమయ్యే ఆధునిక పదం.
theological_decisions:
- issue: ‘దేవుడు ఆమె కళ్లను తెరిచాడు’ అనే మాటను ప్రత్యక్ష దైవిక చర్యగా ఉంచాలా, లేక అప్పటికే ఉన్న బావిని ఆమె గమనించేలా చేశాడని వివరించాలా
  choice: దేవుడు ఆమె కళ్లను తెరిచాడు
  alternative: దేవుడు ఆమెకు బావి కనిపించేలా చేశాడు
  rationale: హీబ్రూ వాక్యం చర్యను నేరుగా దేవునికే ఆపాదిస్తూ ‘కళ్లను తెరవడం’ అనే భాషను ఉపయోగిస్తుంది. అది ఎలా జరిగిందో నిర్ణయించకుండా, మూలంలోని దైవిక చర్యనూ భావ ఉద్రిక్తతనూ అనువాదం నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. హీబ్రూ వాక్యంలోని వరుస చర్యలను తెలుగులో సహజంగా కలిపినా, దేవుని చర్యను వివరణాత్మకంగా మార్చకుండా మూల రూపకం నిలుపబడింది. ఆంగ్ల సంప్రదింపు పాఠంలో [a] గుర్తు ‘కళ్లను’ తర్వాత కనిపించినప్పటికీ, దాని పాదటిప్పణి חֵמֶת అనే తోలు పాత్రకు సంబంధించినది కాబట్టి తెలుగులో గుర్తును ‘తోలు సంచి’ వద్ద ఉంచాం.
