  text: וַ/יִּטַּ֥ע אֶ֖שֶׁל בִּ/בְאֵ֣ר שָׁ֑בַע וַ/יִּ֨קְרָא שָׁ֔ם בְּ/שֵׁ֥ם יְהוָ֖ה אֵ֥ל עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/033.yaml
  text: And he planted a tamarisk tree in Beersheba[a], and there he called on the name of Yahweh[b], the Everlasting God.
translation:
  language: te
  text: అతడు బెయేర్షెబాలో ఒక తమరిస్కు చెట్టును నాటాడు. అక్కడ అతడు యాహ్వే, నిత్యుడైన దేవుని నామాన్ని పిలిచాడు[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “అక్కడ యాహ్వే నామాన్ని ప్రకటించాడు”; లేదా “అక్కడ యాహ్వే నామాన్ని ప్రార్థనలో ఆహ్వానించాడు.” ఈ హీబ్రూ నుడికారం ఆరాధన సందర్భంలో ప్రకటన, ప్రార్థనాత్మక పిలుపు—రెండు భావాలనూ కలిగి ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా “శాశ్వత దేవుడు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּטַּע
  choice: నాటాడు
  rationale: נטע అనే క్రియకు ఈ సందర్భంలో సహజమైన అర్థం ‘నాటు’; చెట్టును స్థాపించడాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: אֶשֶׁל
  choice: తమరిస్కు చెట్టు
  rationale: ఏకవచన నామవాచకం ఒక నిర్దిష్టమైన చెట్టు జాతిని సూచించే అవకాశమే ఎక్కువ; సాధారణ ‘చెట్టు’ లేదా పాత వ్యాఖ్యాన సంప్రదాయంలోని ‘తోపు’ కంటే ఇది మూలపద ప్రత్యేకతను నిలుపుతుంది.
- source_word: בִּבְאֵר שָׁבַע
  choice: బెయేర్షెబాలో
  rationale: స్థలాన్ని సూచించే ב ఉపసర్గను తెలుగులో ‘లో’తో సహజంగా వ్యక్తం చేశాం; స్థలనామాన్ని తెలుగు లిపిలో లిప్యంతరీకరించాం.
- source_word: וַיִּקְרָא שָׁם בְּשֵׁם
  choice: అక్కడ … నామాన్ని పిలిచాడు
  rationale: קרא בשם అనే హీబ్రూ ఆరాధనా నుడికారం ప్రార్థనలో నామాన్ని పిలవడం, ఆ నామాన్ని ప్రకటించడం అనే రెండు ఛాయలను కలిగి ఉండగలదు. ప్రధాన పాఠంలో ‘నామాన్ని పిలిచాడు’ అని ఉంచి ఆ ఉద్రిక్తతను నిలిపి, ప్రత్యామ్నాయాలను పాదసూచికలో ఇచ్చాం.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన నాలుగు హీబ్రూ అక్షరాల పేరును బిరుదుతో భర్తీ చేయకుండా, ఆధునికంగా సాధారణమైన ‘యాహ్వే’ రూపంలో లిప్యంతరీకరించాం.
- source_word: אֵל עוֹלָם
  choice: నిత్యుడైన దేవుడు
  rationale: אֵל అంటే ‘దేవుడు’; עוֹלָם ఇక్కడ అంతంలేని, శాశ్వతమైన ఉనికిని సూచిస్తుంది. ‘నిత్యుడైన దేవుడు’ తెలుగులో సహజంగా ఉండి, బిరుదు భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామాన్ని అనువదించడం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమే ఉంది. కాబట్టి దానిని ‘ప్రభువు’ అనే బిరుదుతో మార్చకుండా లిప్యంతరీకరించాం; ‘యాహ్వే’ రూపం మూలనామానికి ‘యెహోవా’ కంటే దగ్గరగా ఉంది.
- issue: קרא בשם יהוה అనే ఆరాధనా సూత్రం యొక్క భావం
  choice: యాహ్వే నామాన్ని పిలిచాడు
  alternative: యాహ్వే నామాన్ని ప్రకటించాడు; యాహ్వే నామాన్ని ప్రార్థనలో ఆహ్వానించాడు
  rationale: ఈ నుడికారం ప్రార్థనాత్మక మొరనూ బహిరంగ ప్రకటననూ సూచించగలదు. ప్రధాన పాఠం ఒక భావానికే పరిమితం కాకుండా మూలంలోని భావ ఉద్రిక్తతను నిలుపుతుంది.
- issue: אֵל עוֹלָם అనే దైవబిరుదు
  choice: నిత్యుడైన దేవుడు
  alternative: శాశ్వత దేవుడు
  rationale: దేవుని కాలాతీతమైన, అంతంలేని ఉనికిని వ్యక్తం చేస్తూ, మూలంలోని సంక్షిప్త బిరుదు స్వభావాన్ని సహజ తెలుగులో అందిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. ‘తమరిస్కు’ వంటి జాతిపేరుకు ‘చెట్టు’ను జోడించి సాధారణ పాఠకునికి స్పష్టత ఇచ్చాం. హీబ్రూ వాక్యంలోని అంతర్లీన కర్తను ‘అతడు’గా వ్యక్తం చేశాం; సందర్భం తెలిసిన పాఠకునికి ఇది అబ్రాహామును సూచిస్తుంది.
