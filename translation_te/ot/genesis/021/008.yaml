  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. మూలంలోని రెండు వరుస సంఘటనలు స్పష్టంగా ఉండేందుకు రెండు వాక్యాలుగా ఇవ్వబడ్డాయి.
