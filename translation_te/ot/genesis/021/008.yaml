id: GEN.21.8
reference: Genesis 21:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּגְדַּ֥ל הַ/יֶּ֖לֶד וַ/יִּגָּמַ֑ל וַ/יַּ֤עַשׂ אַבְרָהָם֙ מִשְׁתֶּ֣ה גָד֔וֹל בְּ/י֖וֹם הִגָּמֵ֥ל אֶת יִצְחָֽק־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/008.yaml
  text: The boy grew and was weaned[b][a], and Abraham made a great feast on the day Isaac was weaned.
translation:
  language: te
  text: బాలుడు[a] పెరిగి పాలు మానాడు. ఇస్సాకు పాలు మానిన రోజున అబ్రాహాము గొప్ప విందు[b] చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘పిల్లవాడు పెరిగి పాలు మానాడు.’
    reason: lexical_alternative
  - marker: b
    text: ‘విందు’ అనే పదాన్ని ‘భోజన విందు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְדַּל
  choice: పెరిగి
  rationale: పిల్లవాని శారీరక ఎదుగుదలను సూచించే גדל అనే క్రియకు సందర్భానుసారమైన సహజ తెలుగు రూపం.
- source_word: הַיֶּלֶד
  choice: బాలుడు
  rationale: יֶלֶד అంటే పిల్లవాడు లేదా బాలుడు; ఇక్కడ ఇస్సాకు పాలు మానే వయసులో ఉన్నందున ‘బాలుడు’ సహజంగా సరిపోతుంది.
- source_word: וַיִּגָּמַל
  choice: పాలు మానాడు
  rationale: నిఫాల్ రూపం పాలిచ్చడం ముగిసిన స్థితిని సూచిస్తుంది. తెలుగులో ‘పాలు మానాడు’ సహజంగా ఇదే భావాన్ని తెలియజేస్తుంది; కృత్రిమమైన కర్మణి నిర్మాణాన్ని నివారిస్తుంది.
- source_word: וַיַּעַשׂ
  choice: చేశాడు
  rationale: עשה యొక్క సాధారణ ‘చేయు’ భావాన్ని నిలుపుతూ, ‘విందు చేశాడు’ అనే సహజ తెలుగు ప్రయోగాన్ని ఉపయోగిస్తుంది.
- source_word: מִשְׁתֶּה גָדוֹל
  choice: గొప్ప విందు
  rationale: మִשְׁתֶּה లోని ఉత్సవ భోజన భావాన్ని ‘విందు’ తెలియజేస్తుంది; גָדוֹל ను ‘గొప్ప’గా నేరుగా ప్రతిబింబిస్తుంది.
- source_word: בְּיוֹם
  choice: రోజున
  rationale: కాలాన్ని సూచించే בְּతో కూడిన יוֹםకు ‘రోజున’ సంక్షిప్తమైన, సహజమైన సమానం.
- source_word: הִגָּמֵל אֶת יִצְחָק
  choice: ఇస్సాకు పాలు మానిన
  rationale: ఈ నిర్మాణం ఇస్సాకు పాలు మానే సంఘటనను సూచిస్తుంది. తెలుగులో సహజమైన ఉపవాక్యంగా అనువదించబడింది.
