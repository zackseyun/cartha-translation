id: GEN.21.13
reference: Genesis 21:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/גַ֥ם אֶת בֶּן הָ/אָמָ֖ה לְ/ג֣וֹי אֲשִׂימֶ֑/נּוּ כִּ֥י זַרְעֲ/ךָ֖ הֽוּא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/013.yaml
  text: And I will also make the son of the servant woman into a nation[a], because he is your offspring.
translation:
  language: te
  text: దాసి కుమారుడిని కూడా ఒక జాతిగా చేస్తాను; ఎందుకంటే అతడు నీ సంతానం.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְגַם
  choice: కూడా
  rationale: וְגַם ముందటి వాగ్దానానికి కొనసాగింపుతో పాటు చేర్పును సూచిస్తుంది. తెలుగులో క్రియకు ముందు ‘కూడా’ ఉంచడం సహజంగా ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: אֶת בֶּן הָאָמָה
  choice: దాసి కుమారుణ్ణి
  rationale: בֶּן అంటే ‘కుమారుడు’; אָמָה బానిసత్వ లేదా అధీన సేవా స్థితిలో ఉన్న స్త్రీని సూచిస్తుంది. ‘దాసి’ ఆ సామాజిక స్థితిని మృదువుపరచకుండా, సంక్షిప్తంగా తెలుపుతుంది.
- source_word: לְגוֹי
  choice: ఒక జనంగా
  rationale: 'שׂים తో కూడిన לְ ఇక్కడ ఫలిత స్థితిని సూచిస్తుంది: అతడు ఒక జనంగా ఏర్పడతాడు. ‘ఒక జనంగా చేస్తాను’ ఆధునిక తెలుగులో సహజంగా ఉంది.'
- source_word: אֲשִׂימֶנּוּ
  choice: చేస్తాను
  rationale: שׂים కు ‘ఉంచు, నియమించు, చేయు’ వంటి అర్థాలున్నాయి. ఒక జనంగా ఏర్పరచే భావానికి ‘చేస్తాను’ సరైన సహజ రూపం.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ఇక్కడ כִּי వాగ్దానానికి కారణాన్ని పరిచయం చేస్తుంది; ‘ఎందుకంటే’ ఆ కారణ సంబంధాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: זַרְעֲךָ
  choice: నీ సంతానం
  rationale: זֶרַע ‘విత్తనం, సంతానం, సంతతి’ అని అర్థమవుతుంది. ఇక్కడ అబ్రాహాము నుంచి పుట్టిన వ్యక్తిని సూచిస్తున్నందున ‘నీ సంతానం’ సహజంగా ఉండి మూలంలోని విస్తృత కుటుంబార్థాన్ని కాపాడుతుంది.
- source_word: הוּא
  choice: అతడు
  rationale: మూలంలో స్పష్టంగా ఉన్న సర్వనామాన్ని ‘అతడు’గా నిలిపి, అవసరానికి మించిన ‘అతడే’ అనే ఉద్ఘాటనను చేర్చలేదు.
theological_decisions:
- issue: אָמָה సూచించే సామాజిక స్థితి
  choice: దాసి
  alternative: పనికత్తె / సేవకురాలు
  rationale: ఈ పదం హాగరు యొక్క అధీన, బానిస సామాజిక స్థితిని సూచిస్తుంది. ‘సేవకురాలు’ ఆ వాస్తవాన్ని మృదువుపరచవచ్చు; ‘దాసి’ దానిని స్పష్టంగా, గౌరవప్రదమైన ఆధునిక బైబిలు శైలిలో తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన, గంభీరమైన వాక్య నిర్మాణం. ‘దాసి’ ద్వారా మూలంలోని సామాజిక స్థితి నిలుపబడింది; ‘జనం’ అనే పదం ఇక్కడ ప్రజాసమూహం లేదా nation అనే అర్థంలో వాడబడింది.
