  text: וַ/יֹּ֕אמֶר כִּ֚י אֶת שֶׁ֣בַע כְּבָשֹׂ֔ת תִּקַּ֖ח מִ/יָּדִ֑/י בַּ/עֲבוּר֙ תִּֽהְיֶה לִּ֣/י לְ/עֵדָ֔ה כִּ֥י חָפַ֖רְתִּי אֶת הַ/בְּאֵ֥ר הַ/זֹּֽאת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/030.yaml
  text: And he said[a], “You are to take these seven ewe lambs from my hand, so that it may serve as a witness for me that I dug this well.”
translation:
  language: te
  text: 'అప్పుడు అతడు ఇలా అన్నాడు[a]: “ఈ ఏడు ఆడ గొర్రెపిల్లలను నీవు నా చేతిలోనుంచి తీసుకోవాలి. వాటిని నీవు తీసుకోవడం నేను ఈ బావిని తవ్వాననడానికి నా పక్షాన సాక్ష్యంగా ఉంటుంది.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అవి నా పక్షాన సాక్ష్యంగా ఉంటాయి.” హీబ్రూలో క్రియ ఏకవచనంలో ఉంది; అయితే వెంటనే సూచించబడినవి ఏడు ఆడ గొర్రెపిల్లలు. ఏకవచనం వాటిని సమష్టిగా భావించి ఉండవచ్చు లేదా వాటిని తీసుకోవడాన్ని/ఈ ఏర్పాటును సాక్ష్యంగా సూచించి ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు అతడు ఇలా అన్నాడు
  rationale: వయ్యిక్తోల్ కథన ప్రవాహాన్ని సహజమైన ఆధునిక తెలుగులో ముందుకు తీసుకెళ్తుంది; ‘ఇలా’ తరువాతి ప్రత్యక్ష వాక్యాన్ని పరిచయం చేస్తుంది.
- source_word: כִּי אֶת שֶׁבַע כְּבָשֹׂת תִּקַּח
  choice: ఈ ఏడు ఆడ గొర్రెపిల్లలను నువ్వు తీసుకోవాలి
  rationale: כְּבָשֹׂת స్త్రీలింగ గొర్రెపిల్లలను సూచిస్తుంది. ఇక్కడ כִּי మాటలోని ఆదేశాత్మక విషయాన్ని పరిచయం చేస్తుంది; ‘తీసుకోవాలి’ అపూర్ణ క్రియ యొక్క నిరీక్షిత/ఆదేశాత్మక బలాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: מִיָּדִי
  choice: నా చేతిలోనుంచి
  rationale: హీబ్రూ పదబంధంలోని స్పష్టమైన ‘చేతి’ రూపకాన్ని నిలుపుతూ అధికారిక బదిలీ భావాన్ని తెలియజేస్తుంది.
- source_word: בַּעֲבוּר תִּהְיֶה לִּי לְעֵדָה
  choice: అది నా పక్షాన సాక్ష్యంగా ఉంటుంది
  rationale: בַּעֲבוּר ఉద్దేశాన్ని సూచిస్తుంది. ఏడు గొర్రెపిల్లల స్వీకరణతో ఏర్పడే మొత్తం ఏర్పాటు/చర్యను ‘అది’గా తీసుకోవడం హీబ్రూ ఏకవచన క్రియ תִּהְיֶהను గౌరవిస్తుంది; לִּיను ‘నా పక్షాన’ అని ఇవ్వడం అబ్రాహాముకు అనుకూలమైన సాక్ష్య భావాన్ని స్పష్టం చేస్తుంది.
- source_word: כִּי חָפַרְתִּי אֶת הַבְּאֵר הַזֹּאת
  choice: నేను ఈ బావిని తవ్వాననడానికి
  rationale: రెండవ כִּי సాక్ష్యం దేనికి సంబంధించినదో పరిచయం చేస్తుంది. ‘తవ్వాననడానికి’ ఆధునిక తెలుగులో ఆ సాక్ష్య విషయాన్ని సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ఏడు ఆడ గొర్రెపిల్లలకు సంబంధించిన సాక్ష్యం వద్ద హీబ్రూ ఏకవచనం
  choice: ‘అది ... సాక్ష్యంగా ఉంటుంది’ అని, స్వీకరణ చర్య లేదా మొత్తం ఏర్పాటును ఏకవచనంగా సూచించడం
  alternative: ‘అవి ... సాక్ష్యంగా ఉంటాయి’ అని గొర్రెపిల్లలను బహువచనంగా ప్రత్యక్ష కర్తగా తీసుకోవడం
  rationale: תִּהְיֶה స్త్రీలింగ ఏకవచనం. తక్షణ సందర్భంలో ఏడు ఆడ గొర్రెపిల్లలు ఉన్నప్పటికీ, వాటిని సమష్టిగా లేదా వాటి బదిలీ ఏర్పాటును ఒకే సాక్ష్యంగా భావించి ఉండవచ్చు. ప్రధాన పాఠం ఏకవచనాన్ని నిలుపుతుంది; నిజమైన సందిగ్ధతను పాదటిప్పణి తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే కథన శైలి. ‘ఆడ గొర్రెపిల్లలు’ లింగ నిర్దిష్టతను, ‘నా చేతిలోనుంచి’ మూలంలోని స్పష్ట రూపకాన్ని, ‘నా పక్షాన సాక్ష్యం’ న్యాయసంబంధ భావాన్ని నిలుపుతాయి.
