  register: ఆధునిక ప్రామాణిక తెలుగులో సామాన్య పాఠకులకు అర్థమయ్యేలా, గౌరవప్రదమైన కథన శైలిని వాడాం. హీబ్రూ స్థల నామాన్ని లిప్యంతరీకరించి, దాని పదక్రీడను పాదటిప్పణిలో నిలిపాం.
