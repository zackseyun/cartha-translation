source:
  edition: WLC
  text: עַל כֵּ֗ן קָרָ֛א לַ/מָּק֥וֹם הַ/ה֖וּא בְּאֵ֣ר שָׁ֑בַע כִּ֛י שָׁ֥ם נִשְׁבְּע֖וּ שְׁנֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/031.yaml
  text: Therefore he called that place Beersheba[a], because there the two of them swore an oath.
translation:
  language: te
  text: అందుచేత అతడు ఆ స్థలానికి బెయేర్షెబా[a] అని పేరు పెట్టాడు; ఎందుకంటే అక్కడ వారిద్దరూ ప్రమాణం చేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “బెయేర్షెబా” అనే పేరు హీబ్రూలో “ఏడు బావి” మరియు “ప్రమాణ బావి” అనే పదబంధాలను పోలి వినిపిస్తుంది; ఇక్కడి వివరణ ఈ పేరును ప్రత్యేకంగా అక్కడ చేసిన ప్రమాణంతో అనుసంధానిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: అందుచేత
  rationale: పేరు పెట్టడానికి గల కారణాన్ని ఫలితంతో కలిపే హీబ్రూ కారణ-పర్యవసాన ప్రయోగాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: קָרָא
  choice: పేరు పెట్టాడు
  rationale: మూల క్రియకు ‘పిలిచాడు’ లేదా ‘పేరు పెట్టాడు’ అనే అర్థాలు ఉన్నా, స్థల నామకరణ సందర్భంలో ‘పేరు పెట్టాడు’ ఆధునిక తెలుగులో స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: לַמָּקוֹם הַהוּא
  choice: ఆ స్థలానికి
  rationale: నిర్దిష్టంగా ముందే ప్రస్తావనలో ఉన్న స్థలాన్ని సూచించే హీబ్రూ నిర్దేశక భావాన్ని నిలుపుతుంది.
- source_word: בְּאֵר שָׁבַע
  choice: బెయేరు-షెబా
  rationale: స్థల నామాన్ని హీబ్రూ ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించింది; పేరులోని ‘బావి’, ‘ఏడు/ప్రమాణం’ పదక్రీడను ప్రధాన వాక్యంలో బలవంతంగా అనువదించకుండా పాదటిప్పణిలో వివరించింది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: పేరు పెట్టడానికి కారణాన్ని పరిచయం చేసే మూలంలోని సంబంధాన్ని ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: שָׁם
  choice: అక్కడ
  rationale: స్థలాన్ని సూచించే సరళమైన క్రియావిశేషణానికి నేరమైన, సహజమైన అనువాదం.
- source_word: נִשְׁבְּעוּ
  choice: ప్రమాణం చేశారు
  rationale: నిఫాల్ రూపంలోని ‘ప్రమాణం చేయడం’ అనే అర్థాన్ని సహజమైన తెలుగు ప్రయోగంతో వ్యక్తం చేస్తుంది; స్థల నామంలోని ప్రమాణ భావంతోనూ సంబంధాన్ని నిలుపుతుంది.
- source_word: שְׁנֵיהֶם
  choice: వారిద్దరూ
  rationale: ఇద్దరు పక్షాలనూ ప్రత్యేకంగా నొక్కిచెప్పే హీబ్రూ భావాన్ని సంక్షిప్తమైన సహజ తెలుగులో తెలియజేస్తుంది.
