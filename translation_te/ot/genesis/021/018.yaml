id: GEN.21.18
reference: Genesis 21:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: ק֚וּמִי שְׂאִ֣י אֶת הַ/נַּ֔עַר וְ/הַחֲזִ֥יקִי אֶת יָדֵ֖/ךְ בּ֑/וֹ כִּֽי לְ/ג֥וֹי גָּד֖וֹל אֲשִׂימֶֽ/נּוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/018.yaml
  text: Get up[a], lift up the boy, and hold him fast with your hand[b], for I will make him into a great nation.
translation:
  language: te
  text: లేచి, బాలుణ్ణి పైకి ఎత్తు; నీ చేతితో అతణ్ణి గట్టిగా పట్టుకో[a]. ఎందుకంటే నేను అతణ్ణి గొప్ప జనాంగంగా చేస్తాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీ చేతిని అతనిపై బలపరచు.” హీబ్రూ ప్రయోగం అతణ్ణి బలంగా పట్టుకొని ఆసరా ఇవ్వడాన్ని నొక్కి చెబుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֚וּמִי
  choice: లేచి
  rationale: హాగరును ఉద్దేశించిన స్త్రీలింగ ఏకవచన ఆజ్ఞ. ఆధునిక తెలుగులో సహజంగా ఆజ్ఞాబలాన్ని తెలియజేస్తుంది.
- source_word: שְׂאִ֣י
  choice: పైకి ఎత్తు
  rationale: కూలిపోయిన స్థితిలో ఉన్న బాలుణ్ణి లేపాలనే సందర్భార్థాన్ని, మూలంలోని ఎత్తడం అనే దృశ్యాన్ని కాపాడుతుంది; నిరంతరం మోసుకెళ్లాలని అనవసరంగా సూచించదు.
- source_word: הַנַּעַר
  choice: బాలుణ్ణి
  rationale: נַעַר ఇక్కడ బాలుడు లేదా చిన్న వయస్కుణ్ణి సూచిస్తుంది. ‘బాలుడు’ గౌరవప్రదమైన, సాధారణ ఆధునిక తెలుగు పదం.
- source_word: וְהַחֲזִיקִי אֶת יָדֵךְ בּוֹ
  choice: నీ చేతితో అతణ్ణి గట్టిగా పట్టుకో
  rationale: ఈ హీబ్రూ ప్రయోగం బలంగా పట్టుకొని ఆసరా ఇవ్వడాన్ని సూచిస్తుంది. తెలుగు అనువాదం చేతి దృశ్యాన్ని, దృఢమైన సహాయ భావాన్ని రెండింటినీ నిలుపుతుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందున్న ఆజ్ఞలకు కారణాన్ని పరిచయం చేసే సంబంధాన్ని ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: לְגוֹי גָּדוֹל
  choice: గొప్ప జనంగా
  rationale: לְ ఉపసర్గ ఇక్కడ ఫలితాన్ని సూచిస్తుంది. ఒక వ్యక్తిలో అతని సంతతి సమూహం ప్రతినిధిగా ఉన్న మూలభాషా రూపకాన్ని కాపాడుతుంది.
- source_word: אֲשִׂימֶנּוּ
  choice: నేను అతణ్ణి ... చేస్తాను
  rationale: שׂים అనే క్రియకు ఈ సందర్భంలో ‘చేయు/ఆ స్థితికి తీసుకురావు’ అనే ఫలితార్థం ఉంది; తెలుగు వాక్య నిర్మాణంలో ‘చేస్తాను’ సహజంగా సరిపోతుంది.
theological_decisions:
- issue: ఇష్మాయేలు భవిష్యత్తు గురించి దేవుని వాగ్దానం
  choice: దేవుడు అతణ్ణి గొప్ప జనంగా చేస్తానని నేరుగా వాగ్దానం చేసినట్లే అనువదించడం
  alternative: అతని సంతతిని గొప్ప జనంగా విస్తరించి వివరణాత్మకంగా అనువదించడం
  rationale: మూలవచనం బాలుణ్ణే ‘గొప్ప జనంగా’ చేస్తానని ప్రతినిధి భాషలో చెబుతుంది. ఆ వాగ్దాన స్వరూపానికి ఇతర సిద్ధాంతపరమైన పరిమితులు లేదా వివరణలు జోడించకుండా దాని ఉద్రిక్తతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయినా ఆజ్ఞల గంభీరతను నిలుపుతూ రూపొందించబడింది. ‘అతణ్ణి గొప్ప జనంగా చేస్తాను’ అనే మూలంలోని ప్రతినిధి రూపకం ఉద్దేశపూర్వకంగా నిలుపబడింది.
