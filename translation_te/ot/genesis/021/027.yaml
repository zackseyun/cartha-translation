  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּקַּ֤ח אַבְרָהָם֙ צֹ֣אן וּ/בָקָ֔ר וַ/יִּתֵּ֖ן לַ/אֲבִימֶ֑לֶךְ וַ/יִּכְרְת֥וּ שְׁנֵי/הֶ֖ם בְּרִֽית׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/027.yaml
  text: So Abraham took sheep and cattle and gave them to Abimelech[a], and the two of them made a covenant.
translation:
  language: te
  text: అప్పుడు అబ్రాహాము గొర్రెలను, పశువులను తీసుకొని అబీమెలెకుకు ఇచ్చాడు. వారిద్దరూ ఒక నిబంధన చేసుకున్నారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “నిబంధనను కోశారు.” ఇది అధికారికంగా నిబంధన చేసుకోవడాన్ని సూచించే ప్రామాణిక హీబ్రూ నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: తీసుకొని
  rationale: לקח అనే సాధారణ క్రియకు ‘తీసుకొను’ సహజమైన సమానార్థకం; వరుసగా జరిగే కథన చర్యను చూపిస్తుంది.
- source_word: צֹאן
  choice: గొర్రెలను
  rationale: ఈ పదం సాధారణంగా గొర్రెలు, మేకలు వంటి చిన్న పశువులను సూచించగలదు. ఇక్కడ בָּקָר‌తో ఉన్న వ్యత్యాసాన్ని స్పష్టంగా, సహజంగా చూపించేందుకు ‘గొర్రెలు’ ఎంచుకోబడింది.
- source_word: וּבָקָר
  choice: పశువులను
  rationale: בָּקָר పెద్ద మంద పశువులను, ముఖ్యంగా పశువర్గాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘పశువులు’ సహజమైన విస్తృత పదం.
- source_word: וַיִּתֵּן
  choice: ఇచ్చాడు
  rationale: נתן యొక్క సాధారణ అర్థమైన ‘ఇచ్చు’ను నేరుగా నిలుపుతుంది; మూలంలో లేని అదనపు ఆచార భావాన్ని చేర్చదు.
- source_word: לַאֲבִימֶלֶךְ
  choice: అబీమెలెకుకు
  rationale: ల ఉపసర్గను ‘కు’తో వ్యక్తపరచి, వ్యక్తినామాన్ని తెలుగు లిపిలో లిప్యంతరీకరించింది.
- source_word: וַיִּכְרְתוּ
  choice: చేసుకున్నారు
  rationale: כרת ברית అక్షరార్థంగా ‘నిబంధనను కోయడం’ అయినా, ఇది నిబంధనను అధికారికంగా చేయడాన్ని సూచించే హీబ్రూ నుడికారం. తెలుగులో సహజమైన భావాన్ని ప్రధాన పాఠ్యంలో ఇచ్చి, అక్షరార్థాన్ని పాదటిప్పణిలో ఉంచింది.
- source_word: שְׁנֵיהֶם
  choice: వారిద్దరూ
  rationale: నిబంధనలో పాల్గొన్న రెండు పక్షాలనూ హీబ్రూ స్పష్టంగా పేర్కొంటుంది; ‘వారిద్దరూ’ దాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: בְּרִית
  choice: నిబంధన
  rationale: బైబిలు సందర్భంలో בְּרִיתకు స్థిరమైన, గంభీరమైన తెలుగు సమానార్థకం ‘నిబంధన’; కేవలం ఒప్పందం లేదా సంధి అనే పరిమిత భావానికి కుదించదు.
theological_decisions:
- issue: כרת ברית అనే నిబంధన నుడికారపు అనువాదం
  choice: నిబంధన చేసుకున్నారు
  alternative: నిబంధనను కోశారు
  rationale: ప్రధాన పాఠ్యంలో సహజమైన ఆధునిక తెలుగు వాడబడింది. అయితే హీబ్రూ నుడికారంలోని రూపాన్ని దాచకుండా పాదటిప్పణిలో అక్షరార్థం తెలియజేయబడింది; తద్వారా నిబంధన భావం, మూలభాష పారదర్శకత రెండూ నిలుస్తాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘నిబంధన’ అనే కీలక బైబిలు పదాన్ని నిలుపుతూ, హీబ్రూ నుడికారాన్ని పాదటిప్పణిలో పారదర్శకంగా తెలిపింది.
