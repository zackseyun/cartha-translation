  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֵּ֧רַע הַ/דָּבָ֛ר מְאֹ֖ד בְּ/עֵינֵ֣י אַבְרָהָ֑ם עַ֖ל אוֹדֹ֥ת בְּנֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/011.yaml
  text: The matter was very displeasing in Abraham’s eyes on account of his son[a].
translation:
  language: te
  text: తన కుమారుని విషయమై ఆ విషయం అబ్రాహాము దృష్టికి చాలా చెడ్డదిగా అనిపించింది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తన కుమారుని గురించి ఆ విషయం అబ్రాహాము దృష్టికి చాలా చెడ్డదిగా అనిపించింది.”
    reason: עַל אֹדוֹתకు సాధ్యమైన ‘గురించి/సంబంధించి’ భావాన్ని చూపిస్తుంది; ఇది ఆంగ్ల ఆడిట్ పాదసూచికలోని lexical alternativeకు అనుగుణంగా ఉంది.
lexical_decisions:
- source_word: וַיֵּרַע
  choice: చాలా చెడ్డదిగా అనిపించింది
  rationale: רעע అనే క్రియ בְּעֵינֵי అనే ప్రయోగంతో కలిసి, ఒక విషయం ఎవరికైనా చెడ్డదిగా లేదా తీవ్రంగా అసంతృప్తికరంగా తోచిందని సూచిస్తుంది. తెలుగు సహజ ప్రయోగంలో ‘చెడ్డదిగా అనిపించింది’ మూలంలోని మూల్యాంకన భావాన్ని నిలుపుతుంది.
- source_word: הַדָּבָר
  choice: ఆ మాట
  rationale: דבר అంటే ‘మాట, విషయం, సంగతి’ అని విస్తృతార్థం. ఇక్కడ ముందటి వచనంలో శారా చెప్పిన మాటను సూచిస్తున్నందున ‘ఆ మాట’ సందర్భానికి సహజంగాను స్పష్టంగాను ఉంది.
- source_word: מְאֹד
  choice: చాలా
  rationale: మూలంలోని ప్రామాణిక తీవ్రతాసూచక పదాన్ని ఆధునిక సాధారణ తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: בְּעֵינֵי
  choice: అబ్రాహాము దృష్టికి
  rationale: అక్షరార్థంగా ‘అబ్రాహాము కళ్లలో.’ ‘దృష్టికి’ అనే తెలుగు ప్రయోగం మూలంలోని దర్శనాధారిత మూల్యాంకన నుడికారాన్ని సహజంగా నిలుపుతుంది.
- source_word: עַל אֹדוֹת
  choice: విషయమై
  rationale: ఈ పదబంధం కారణాన్ని లేదా సంబంధిత అంశాన్ని సూచించగలదు. ‘విషయమై’ ఉద్దేశపూర్వకంగా ఆ పరిధిని నిలిపి, కారణార్థాన్ని అతిగా నిర్ధారించదు.
- source_word: בְּנוֹ
  choice: తన కుమారుని
  rationale: בן ప్రత్యేకంగా ‘కుమారుడు’ అని అర్థం; ‘తన కుమారుని’ సంబంధాన్నీ లింగస్పష్టతనూ కాపాడుతుంది.
theological_decisions:
- issue: ‘తన కుమారుడు’ ఎవరిని సూచిస్తున్నాడనే గుర్తింపు
  choice: వచనంలో పేరును చేర్చకుండా ‘తన కుమారుని’ అని ఉంచడం
  alternative: ‘ఇష్మాయేలు’ అని స్పష్టీకరించడం
  rationale: సందర్భం ఇష్మాయేలును సూచించినప్పటికీ, హెబ్రీ మూలం ఇక్కడ పేరును కాక ‘తన కుమారుడు’ అనే సంబంధపదాన్నే ఉపయోగిస్తుంది. ఆ భావోద్వేగ మరియు సంబంధపరమైన బలాన్ని అలాగే నిలుపుతున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయినా గౌరవప్రదమైన వాక్యనిర్మాణం. ‘అబ్రాహాము దృష్టికి’ ద్వారా హెబ్రీ నుడికారపు రూపకాన్ని సహజ తెలుగులో నిలుపుతూ, ప్రధాన పాఠంలో ‘విషయమై’ ద్వారా కారణం/సంబంధం మధ్య స్వల్ప భావవిస్తృతిని కాపాడింది.
