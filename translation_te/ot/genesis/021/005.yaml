translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని సమాచార క్రమాన్ని వీలైనంతవరకు నిలుపుతూ, హీబ్రూ వయస్సు నుడికారాన్ని సహజ తెలుగు రూపంలో తెలిపాం.
