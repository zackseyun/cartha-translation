  terminology: ‘అబ్రాహాము’ and ‘ఇస్సాకు’ are established Telugu biblical name forms. ‘కుమారుడైన’ naturally expresses the Hebrew apposition ‘Isaac, his son’ without introducing emphasis or doctrinal interpretation.
