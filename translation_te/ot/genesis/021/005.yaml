source:
  edition: WLC
  text: וְ/אַבְרָהָ֖ם בֶּן מְאַ֣ת שָׁנָ֑ה בְּ/הִוָּ֣לֶד ל֔/וֹ אֵ֖ת יִצְחָ֥ק בְּנֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/005.yaml
  text: And Abraham was a hundred years old when Isaac his son was born to him[a].
translation:
  language: te
  text: అబ్రాహాముకు అతని కుమారుడైన ఇస్సాకు పుట్టినప్పుడు, అబ్రాహాము వంద సంవత్సరాల వయస్సులో ఉన్నాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “అబ్రాహాము నూరు సంవత్సరాల కుమారుడు, అతనికి అతని కుమారుడు ఇస్సాకు పుట్టినప్పుడు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַבְרָהָם
  choice: అబ్రాహాము
  rationale: వావ్ సంధాన అవ్యయం హీబ్రూ కథన ప్రవాహాన్ని కొనసాగిస్తుంది. తెలుగులో ఈ ఒక్క వాక్యాన్ని సహజంగా ఉంచేందుకు ప్రత్యేకంగా ‘మరియు’ అని చేర్చకుండా వాక్యక్రమం ద్వారా అనుసంధానం వ్యక్తమైంది.
- source_word: בֶּן מְאַת שָׁנָה
  choice: వయసు నూరు సంవత్సరాలు
  rationale: ‘నూరు సంవత్సరాల కుమారుడు’ అనే హీబ్రూ వయస్సు సూచక నుడికారానికి ఇది సహజమైన ఆధునిక తెలుగు సమానార్థకం.
- source_word: בְּ/הִוָּלֶד
  choice: పుట్టినప్పుడు
  rationale: బెత్ ఉపసర్గతో కూడిన యలద్ నిఫాల్ క్రియానామం కాలసంబంధ పరిస్థితిని, అలాగే పుట్టడం అనే నిష్క్రియ భావాన్ని సూచిస్తుంది.
- source_word: ל֔/וֹ
  choice: అబ్రాహాముకు
  rationale: ప్రత్యయంతో కూడిన లామెద్, కుమారుడు అబ్రాహాముకు పుట్టాడనే సంబంధాన్ని సూచిస్తుంది; తెలుగులో పేరును పునరుక్తి చేయడం సూచనను స్పష్టంగా, సహజంగా ఉంచుతుంది.
- source_word: אֵת יִצְחָק
  choice: ఇస్సాకు
  rationale: אֵת ప్రత్యక్ష కర్మ సూచిక; దానికి విడిగా అనువాదం అవసరం లేదు. יִצְחָק పేరును ప్రామాణిక తెలుగు బైబిలు రూపమైన ‘ఇస్సాకు’గా ఇచ్చాం.
- source_word: בְּנֽ/וֹ
  choice: అతని కుమారుడు
  rationale: ప్రత్యయం ఇస్సాకు అబ్రాహాము కుమారుడని తెలిపే సామానాధికార సంబంధాన్ని నిలుపుతుంది; మూలంలో లేని ప్రత్యేక ఉద్ఘాటనను చేర్చలేదు.
