  text: And Abraham stayed in the land of the Philistines for many days[a].
translation:
  language: te
  text: అబ్రాహాము ఫిలిష్తీయుల దేశంలో చాలా రోజులు నివసించాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
