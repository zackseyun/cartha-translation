    text: లేదా, ‘పరదేశిగా నివసించాడు.’ హెబ్రీ క్రియ పరదేశిగా ఉండే భావాన్ని నొక్కి చెప్పవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּגָר
  choice: నివసించాడు
  rationale: גור అనే క్రియకు పరదేశిగా లేదా తాత్కాలిక నివాసిగా ఉండడం అనే భావం ఉండవచ్చు. ప్రధాన వాక్యంలో సహజమైన ఆధునిక తెలుగు కోసం ‘నివసించాడు’ అని ఇచ్చి, పరదేశిత్వ భావాన్ని పాదటిప్పణిలో సూచించాం.
- source_word: בְּאֶרֶץ
  choice: దేశంలో
  rationale: ఈ సందర్భంలో אֶרֶץ ఒక ప్రజల ప్రాంతాన్ని సూచిస్తుంది; ‘దేశం’ ఆధునిక తెలుగులో సహజంగా, స్పష్టంగా ఉంది.
- source_word: פְּלִשְׁתִּים
  choice: ఫిలిష్తీయుల
  rationale: ప్రజాసమూహం పేరుకు తెలుగులో ప్రాచుర్యంలో ఉన్న లిప్యంతరీకరణను ఉపయోగించాం.
- source_word: יָמִים רַבִּים
  choice: చాలా రోజులు
  rationale: హెబ్రీ పదబంధంలోని ‘అనేక దినాలు’ అనే రూపాన్ని సహజమైన తెలుగులో దగ్గరగా నిలుపుతుంది; ‘చాలాకాలం’ కూడా భావపరంగా సాధ్యమే.
- source_word: וַ
  choice: తెలుగులో ప్రత్యేక సంధానపదం లేకుండా కథన కొనసాగింపు
  rationale: హెబ్రీ వావ్ కథనాన్ని కొనసాగిస్తుంది. తెలుగులో ఈ వాక్యారంభంలో ‘మరియు’ అనడం అసహజంగా ఉంటుంది కాబట్టి, వాక్యక్రమం ద్వారానే కొనసాగింపును వ్యక్తం చేశాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. మూలంలోని పరదేశిత్వ సూచనను ప్రధాన పాఠ్యంలో అతిగా స్పష్టీకరించకుండా పాదటిప్పణిలో భద్రపరిచాం.
