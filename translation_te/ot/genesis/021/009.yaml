id: GEN.21.9
reference: Genesis 21:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/תֵּ֨רֶא שָׂרָ֜ה אֶֽת בֶּן הָגָ֧ר הַ/מִּצְרִ֛ית אֲשֶׁר יָלְדָ֥ה לְ/אַבְרָהָ֖ם מְצַחֵֽק־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/009.yaml
  text: And Sarah saw the son of Hagar the Egyptian[a], whom she had borne to Abraham, mocking.
translation:
  language: te
  text: అప్పుడు సారా ఐగుప్తీయురాలైన హాగరు అబ్రాహాముకు కనిన కుమారుడు నవ్వుతుండడాన్ని[a] చూసింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఎగతాళి చేస్తూ” లేదా “ఆడుకుంటూ.” హీబ్రూ కృదంతం నవ్వడం, ఆడడం, లేదా హేళనగా ప్రవర్తించడం అనే భావాలను సూచించవచ్చు; సందర్భం ప్రతికూల భావాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּרֶא
  choice: అప్పుడు సారా ... చూసింది
  rationale: వయ్యిక్తోల్ రూపం కథనంలోని తదుపరి సంఘటనను సూచిస్తుంది. ‘అప్పుడు’ సహజమైన తెలుగు కథన క్రమాన్ని తెలియజేస్తుంది; వ్యతిరేక భావాన్ని అనవసరంగా చేర్చదు.
- source_word: בֶּן הָגָר הַמִּצְרִית
  choice: ఐగుప్తీయురాలైన హాగరు ... కుమారుడు
  rationale: మూలంలోని నిర్మాణ బంధం, అనుబంధ విశేషణం కుమారుణ్ణి అతని తల్లి హాగరు ద్వారా గుర్తిస్తాయి. ‘ఐగుప్తీయురాలైన’ అనే రూపం స్త్రీలింగ జాతివాచకాన్ని సహజంగా నిలుపుతుంది.
- source_word: אֲשֶׁר יָלְדָה לְאַבְרָהָם
  choice: అబ్రాహాముకు కనిన
  rationale: సంబంధ వాక్యం హాగరు ముందుగా అబ్రాహాముకు కుమారుణ్ణి కనిన విషయాన్ని గుర్తుచేస్తుంది. తెలుగులో ‘అబ్రాహాముకు కనిన’ సంక్షిప్తంగా, సహజంగా మూలార్థాన్ని అందిస్తుంది.
- source_word: מְצַחֵק
  choice: నవ్వుతూ ఉండడం
  rationale: צחק ధాతువు యొక్క పియేల్ వర్తమాన కృదంతం నవ్వడం, ఆడడం లేదా ఎగతాళి చేయడం వంటి భావాలకు వీలు ఇస్తుంది. కర్మను చెప్పని మూలంలోని విస్తృతార్థాన్ని ప్రధాన పాఠ్యంలో ‘నవ్వుతూ’ నిలుపుతూ, సందర్భానుసారమైన ప్రతికూల అర్థాన్ని పాదటీపులో ఇస్తున్నాం.
theological_decisions:
- issue: מְצַחֵק లో ఇష్మాయేలు చర్య యొక్క భావం
  choice: ప్రధాన పాఠ్యంలో తటస్థంగా ‘నవ్వుతూ ఉండడం’
  alternative: ‘ఎగతాళి చేస్తూ ఉండడం’ లేదా ‘ఆడుకుంటూ ఉండడం’
  rationale: హీబ్రూ కృదంతానికి స్పష్టమైన కర్మ లేదు; చర్య యొక్క ఖచ్చిత స్వభావాన్ని ఈ వచనం తేల్చదు. కథా సందర్భం లేదా తరువాతి వ్యాఖ్యానం ప్రతికూల భావాన్ని సూచించవచ్చు, కాని దాన్ని ప్రధాన పాఠ్యంలో నిర్బంధించడం మూలంలోని నిజమైన అస్పష్టతను తొలగిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘ఐగుప్తీయురాలైన’ మూలంలోని గుర్తింపును నిలుపుతుంది; ‘నవ్వుతూ ఉండడం’ ఉద్దేశపూర్వకంగా అర్థ అస్పష్టతను కాపాడుతుంది. పాదటీపు సూచిక ప్రధాన పాఠ్యంలో [a]గా పొందుపరచబడింది.
