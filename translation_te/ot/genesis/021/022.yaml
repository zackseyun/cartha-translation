id: GEN.21.22
reference: Genesis 21:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַֽ/יְהִי֙ בָּ/עֵ֣ת הַ/הִ֔וא וַ/יֹּ֣אמֶר אֲבִימֶ֗לֶךְ וּ/פִיכֹל֙ שַׂר צְבָא֔/וֹ אֶל אַבְרָהָ֖ם לֵ/אמֹ֑ר אֱלֹהִ֣ים עִמְּ/ךָ֔ בְּ/כֹ֥ל אֲשֶׁר אַתָּ֖ה עֹשֶֽׂה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/022.yaml
  text: And it happened at that time that Abimelech and Phicol[a], the commander of his army, said to Abraham[b], “God is with you in all that you do.”
translation:
  language: te
  text: 'ఆ సమయంలో అబీమెలెకు, అతని సైన్యాధిపతి ఫీకోలు అబ్రాహాముతో ఇలా అన్నారు: “నీవు చేసే ప్రతిదానిలో దేవుడు[a] నీకు తోడుగా ఉన్నాడు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ఈ సందర్భంలో తక్కువ సంభావ్యతతో, “ఒక దేవుడు.” హెబ్రీ אֱלֹהִים పదాన్ని కొన్ని సందర్భాల్లో వేరుగా అర్థం చేసుకోవచ్చు; అయితే ఇక్కడ అది అబ్రాహామును ఆశీర్వదిస్తున్న దేవుణ్ణే అత్యంత సహజంగా సూచిస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי בָּעֵת הַהִוא
  choice: ఆ సమయంలో
  rationale: కొత్త కథా సందర్భాన్ని పరిచయం చేసే సహజమైన ఆధునిక తెలుగు కాలసూచన; హెబ్రీ కథన సూత్రాన్ని విడిగా ‘జరిగింది’ అని అనువదించడం తెలుగులో అనవసరంగా భారంగా ఉంటుంది.
- source_word: אֲבִימֶלֶךְ וּפִיכֹל
  choice: అబీమెలెకు, ... ఫీకోలు
  rationale: వ్యక్తుల పేర్లను తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: שַׂר צְבָאוֹ
  choice: అతని సైన్యాధిపతి
  rationale: שַׂר ఇక్కడ అధికారిని లేదా అధిపతిని, צָבָא సైన్యాన్ని సూచిస్తున్నాయి; ‘సైన్యాధిపతి’ స్పష్టమైన, సహజమైన తెలుగు పదం.
- source_word: וַיֹּאמֶר ... אֶל־אַבְרָהָם לֵאמֹר
  choice: అబ్రాహాముతో ఇలా అన్నారు
  rationale: ప్రత్యక్ష వాక్యాన్ని పరిచయం చేసే హెబ్రీ నిర్మాణాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది. క్రియ హెబ్రీలో ఏకవచన రూపంలో ఉన్నా, దాని తరువాత ఇద్దరితో కూడిన కర్త ఉన్నందున తెలుగులో బహువచన గౌరవ/సముచ్చయ రూపం సహజం.
- source_word: אֱלֹהִים
  choice: దేవుడు
  rationale: ఈ సందర్భంలో అబ్రాహామును ఆశీర్వదిస్తూ అతనికి తోడుగా ఉన్న దేవుణ్ణే సూచించడం అత్యంత సహజం; పదానికి ఇతర సందర్భాల్లో ఉండగల రూపార్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: עִמְּךָ
  choice: నీకు తోడుగా ఉన్నాడు
  rationale: కేవలం సమీపంలో ఉండడమే కాక అనుకూల సాన్నిధ్యం, సహాయం అనే సందర్భోచిత భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: בְּכֹל אֲשֶׁר־אַתָּה עֹשֶׂה
  choice: నీవు చేసే ప్రతిదానిలో
  rationale: సమగ్ర పరిధిని తెలియజేసే בְּכֹל మరియు సాధారణంగా కొనసాగుతున్న క్రియను సూచించే participle భావాన్ని సహజంగా నిలుపుతుంది.
theological_decisions:
- issue: అబీమెలెకు మాటల్లో אֱלֹהִים పదం ఎవరిని సూచిస్తుంది
  choice: దేవుడు
  alternative: ఒక దేవుడు; దేవుళ్లు
  rationale: ఈ కథన సందర్భం అబ్రాహాముతో ఉన్న దేవుని సాన్నిధ్యాన్ని, దాని వల్ల కనిపిస్తున్న అనుగ్రహాన్ని అబీమెలెకు గుర్తించడాన్ని సూచిస్తుంది. అందువల్ల ఏకవచన నిర్దిష్ట భావమైన ‘దేవుడు’ అత్యంత సహజం; తక్కువ సంభావ్యమైన అనిర్దిష్ట పఠనాన్ని పాదసూచికలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవభరితమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే కథన శైలి. అనవసరమైన ప్రాచీన పదబంధాలను నివారించాం.
