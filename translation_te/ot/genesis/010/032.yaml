revisions:
- from: ఇవి నోవహు కుమారుల వంశాల ప్రకారం, వారి జనాల వారీగా ఉన్న కుటుంబాలు[a]. జలప్రళయం తర్వాత వీరి నుంచే జనాలు భూమిమీద వేరువేరుగా విస్తరించాయి[b].
  to: ఇవి నోవహు కుమారుల కుటుంబాలు[a]—వారి వంశావళుల ప్రకారం, వారి జాతులలో. జలప్రళయం తర్వాత వీరి నుండి జాతులు భూమిమీద వేరుపడ్డాయి[b].
  rationale: The revision preserves the Hebrew summary structure while using natural modern Telugu. It removes added emphasis and the added notion of expansion, renders the genealogical and nation-group terminology more precisely, and retains the source verb’s non-specific separation/division sense.
