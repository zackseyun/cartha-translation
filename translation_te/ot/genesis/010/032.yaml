id: GEN.10.32
reference: Genesis 10:32
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אֵ֣לֶּה מִשְׁפְּחֹ֧ת בְּנֵי נֹ֛חַ לְ/תוֹלְדֹתָ֖/ם בְּ/גוֹיֵ/הֶ֑ם וּ/מֵ/אֵ֜לֶּה נִפְרְד֧וּ הַ/גּוֹיִ֛ם בָּ/אָ֖רֶץ אַחַ֥ר הַ/מַּבּֽוּל־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/032.yaml
  text: These are the families of the sons of Noah[a], according to their generations, by their nations[c][b]; and from these the nations were separated on the earth after the flood.
translation:
  language: te
  text: ఇవి నోవహు కుమారుల కుటుంబాలు[a]—వారి వంశావళుల ప్రకారం, వారి జాతులలో. జలప్రళయం తర్వాత వీరి నుండి జాతులు భూమిమీద వేరుపడ్డాయి[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వంశ సమూహాలు.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘విడిపోయాయి’ లేదా ‘విభజించబడ్డాయి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁפְּחֹת
  choice: కుటుంబాలు
  rationale: ఈ పదం బంధుత్వంపై ఆధారపడిన కుటుంబ సమూహాలను లేదా వంశ విభాగాలను సూచిస్తుంది. ఆధునిక తెలుగులో ‘కుటుంబాలు’ సహజంగా, స్పష్టంగా ఉంటుంది; ‘వంశాలు’ కూడా సాధ్యమే గనుక పాదటిప్పణిలో ఇచ్చాం.
- source_word: לְתוֹלְדֹתָם
  choice: వంశాల ప్రకారం
  rationale: תּוֹלְדוֹת ఇక్కడ తరాలు, సంతతి వరుసలు, వంశావళులను సూచించగలదు. అధ్యాయం చివరి సారాంశంలో ‘వంశాల ప్రకారం’ అనేది వంశక్రమ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: בְּגוֹיֵהֶם
  choice: వారి జనాల వారీగా
  rationale: గోయ్ ఇక్కడ జాతి లేదా దేశంగా ఏర్పడిన ప్రజాసమూహాన్ని సూచిస్తుంది. ‘జనాల వారీగా’ అనేది ముందున్న విభజనాత్మక నిర్మాణంతో సహజంగా సరిపోతుంది.
- source_word: וּמֵאֵלֶּה
  choice: వీరి నుంచే
  rationale: ముందు పేర్కొన్న నోవహు కుమారుల కుటుంబ సమూహాలనే సూచిస్తూ మూలంలోని ‘మరియు వీరి నుండి’ అనే సంబంధాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: נִפְרְדוּ
  choice: వేరువేరుగా విస్తరించాయి
  rationale: నిఫాల్ రూపం విడిపోవడం లేదా వేరుపడడాన్ని సూచిస్తుంది; సందర్భంలో ఆ వేరుపడటం భూమిమీద ప్రజల విస్తరణగా ఫలించింది. ఈ అనువాదం రెండు భావ ఛాయలను కలిపి సహజంగా తెలియజేస్తుంది; మరింత రూపసామ్యమైన ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
- source_word: הַגּוֹיִם
  choice: జనాలు
  rationale: ఆదికాండము 10లో ఇది నోవహు కుమారుల నుండి ఉద్భవించిన ప్రత్యేక ప్రజాసమూహాలను సూచిస్తుంది. ‘జనాలు’ అనే పదం ఆధునిక తెలుగులో ‘దేశాలు’ కంటే ప్రజలనే స్పష్టంగా సూచిస్తుంది.
- source_word: בָּאָרֶץ
  choice: భూమిమీద
  rationale: ఇది ఒక ప్రత్యేక ప్రాంతాన్ని కాక, జలప్రళయం తరువాతి మానవ విస్తరణ యొక్క విశాల పరిధిని సూచిస్తుంది.
- source_word: אַחַר הַמַּבּוּל
  choice: జలప్రళయం తర్వాత
  rationale: కాలసూచక పదబంధానికి నేరుగా, సందర్భానుకూలంగా ఉన్న తెలుగు అనువాదం.
theological_decisions:
- issue: జలప్రళయం తరువాత విస్తరణ సారాంశంలో אֶרֶץ పరిధి
  choice: ప్రపంచవ్యాప్త ‘భూమి’
  alternative: ఒక నిర్దిష్ట ‘దేశం/ప్రాంతం’
  rationale: ఆదికాండము 10 నోవహు సంతతి నుండి ఏర్పడిన జనాల విస్తరణను సమగ్రంగా సంగ్రహిస్తుంది. అందువల్ల ‘భూమిమీద’ అనేది కథనంలోని విశ్వవ్యాప్త పరిధిని కాపాడుతుంది.
- issue: נִפְרְדוּలో వేరుపాటు మరియు విస్తరణ మధ్య భావసంబంధం
  choice: వేరువేరుగా విస్తరించాయి
  alternative: వేరుచేయబడ్డాయి / విడిపోయాయి
  rationale: హీబ్రూ రూపం వేరుపడటాన్ని ముందుకు తెస్తుంది; సందర్భం భూమిమీద జనాల వ్యాప్తిని సూచిస్తుంది. తెలుగులో ఎవరైనా వారిని బలవంతంగా విభజించారని అనవసరంగా నిర్ధారించకుండా రెండు భావాలను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, అయినా వంశావళి సారాంశానికి తగిన గంభీరతతో అనువదించబడింది. హీబ్రూలోని రెండు వర్గీకరణ పదబంధాలను ‘వంశాల ప్రకారం, వారి జనాల వారీగా’ అని సమాంతరంగా ఉంచాం.
