    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַרְפַּכְשַׁד
  choice: అర్పక్సదు
  rationale: హీబ్రూ אַרְפַּכְשַׁד పేరును దాని మూలరూపానికి దగ్గరగా తెలుగులో లిప్యంతరీకరించాం; గ్రీకు ప్రభావిత సంప్రదాయ రూపాన్ని ప్రధాన పాఠ్యంలో అనుసరించలేదు.
- source_word: יָלַד
  choice: తండ్రి అయ్యాడు
  rationale: పురుష కర్తతో కూడిన వంశావళి సందర్భంలో ఈ క్రియకు ‘తండ్రి అయ్యాడు’ అనే సహజమైన ఆధునిక తెలుగు ప్రయోగం సరిపోతుంది; ఇది ప్రాచీనంగా వినిపించే ‘కన్నాడు’ కంటే పితృత్వ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: אֶת
  choice: '[ప్రత్యేకంగా అనువదించలేదు]'
  rationale: ఇది ప్రత్యక్ష కర్మను సూచించే వ్యాకరణ చిహ్నం; తెలుగులో విభక్తి ప్రయోగం ద్వారా దాని పని వ్యక్తమవుతుంది.
- source_word: שָׁלַח / וְ/שֶׁלַח
  choice: షేలహు / షేలహు
  rationale: హీబ్రూ שָׁלַח/שֶׁלַח పేరులోని ధ్వనులకు దగ్గరగా, రెండు సందర్భాల్లోనూ ఒకే విధంగా లిప్యంతరీకరించాం; וְ భావం వాక్య విరామం ద్వారా సహజంగా వ్యక్తమవుతుంది.
- source_word: עֵבֶר
  choice: ఏబెరు
  rationale: హీబ్రూ עֵבֶר పేరును తెలుగులో సహజంగా ఉచ్చరించగలిగే విధంగా, మూల ధ్వనికి దగ్గరగా లిప్యంతరీకరించాం.
