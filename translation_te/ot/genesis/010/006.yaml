id: GEN.10.6
reference: Genesis 10:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/בְנֵ֖י חָ֑ם כּ֥וּשׁ וּ/מִצְרַ֖יִם וּ/פ֥וּט וּ/כְנָֽעַן׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/006.yaml
  text: 'And the sons of Ham: Cush[a], Mizraim, Put[b], and Canaan.'
translation:
  language: te
  text: 'హాము కుమారులు: కూషు, మిస్రాయిము[a], పూతు[b], కనాను.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అనేక అనువాదాలు “మిస్రాయిము” అనే హీబ్రూ నామాన్ని “ఐగుప్తు” అని అనువదిస్తాయి. ఈ వంశావళిలో అది ఒక వ్యక్తి లేదా వంశపితృ నామంగా ఇవ్వబడింది.
    reason: alternative_reading
  - marker: b
    text: “పూతు” అనే పేరును కొన్ని పాత అనువాద సంప్రదాయాల్లో “ఫూతు” అని కూడా రాశారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: కుమారులు
  rationale: వంశావళి జాబితాలోని ‘కుమారులు’ అనే నిర్మాణాన్ని నిలుపుతూ, తెలుగు వాక్యనిర్మాణానికి సహజంగా అనువదించబడింది. ఆరంభంలోని ו జాబితా కొనసాగింపును సూచించినా, ఈ ఒక్క వచనంలో తెలుగులో ప్రత్యేకంగా ‘మరియు’ చేర్చడం అసహజంగా ఉండేందున విరామచిహ్న నిర్మాణంలో వ్యక్తమైంది.
- source_word: חָם
  choice: హాము
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగులో స్థిరపడిన బైబిలు నామరూపానికి అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: כּוּשׁ
  choice: కూషు
  rationale: హీబ్రూ వ్యక్తి/వంశనామాన్ని దాని ధ్వనికి సమీపంగా, తెలుగులో పరిచితమైన రూపంలో ఇచ్చాం.
- source_word: וּ/מִצְרַיִם
  choice: మిస్రాయిము
  rationale: ఇక్కడ దేశాన్ని మాత్రమే సూచించకుండా వంశపితృ నామంగా పనిచేస్తున్నందున ‘ఐగుప్తు’ అని అనువదించకుండా నామరూపాన్ని లిప్యంతరీకరించాం.
- source_word: וּ/פוּט
  choice: పూతు
  rationale: హీబ్రూ פּוּט నామాన్ని మూల ధ్వనికి సమీపంగా లిప్యంతరీకరించాం; పాత అనువాద సంప్రదాయంలోని ‘ఫూతు’ రూపాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: וּ/כְנָעַן
  choice: కనాను
  rationale: హీబ్రూ వ్యక్తి/వంశనామాన్ని తెలుగులో స్థిరపడిన బైబిలు రూపంలో ఇచ్చాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన, గౌరవప్రదమైన వంశావళి శైలి వాడబడింది. మూలంలోని పేర్ల జాబితా నిర్మాణం నిలుపబడింది; వ్యక్తి/వంశపితృ నామాలకు అనువాదం కంటే తెలుగు లిప్యంతరీకరణకు ప్రాధాన్యం ఇచ్చాం.
