    rationale: ఇది causative రూపం; అష్షూరు ఇతరులతో కట్టింపజేశాడని సూచిస్తుంది. హీబ్రూ וַיִּבֶן యొక్క ప్రత్యక్ష అర్థమైన ‘కట్టాడు’ అవసరం.
  - severity: low
