  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: מִן הָ/אָ֥רֶץ הַ/הִ֖וא יָצָ֣א אַשּׁ֑וּר וַ/יִּ֨בֶן֙ אֶת נִ֣ינְוֵ֔ה וְ/אֶת רְחֹבֹ֥ת עִ֖יר וְ/אֶת כָּֽלַח־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/011.yaml
  text: From that land Asshur went out and built Nineveh[a], Rehoboth-Ir, and Calah.
translation:
  language: te
  text: ఆ దేశం నుండి అష్షూరు[a] బయలుదేరి నీనెవెను, రెహోబోత్-ఈరును, కాలహును కట్టాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతడు ఆ దేశం నుండి అష్షూరు దేశానికి వెళ్లి, నీనెవెను, రెహోబోత్-ఈరును, కాలహును కట్టాడు.” ఈ పఠనంలో మునుపటి వచనంలోని నిమ్రోదే కర్త; אַשּׁוּר అనే పదం అష్షూరు అనే వ్యక్తిని కాక అష్షూరు దేశాన్ని సూచిస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: מִן הָאָרֶץ הַהִוא
  choice: ఆ దేశం నుండి
  rationale: מִן మూలస్థానాన్ని సూచిస్తుంది; אֶרֶץ ఇక్కడ నేలను కాక భూభాగాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ఇది సహజమైన భౌగోళిక వ్యక్తీకరణ.
- source_word: יָצָא
  choice: బయలుదేరి
  rationale: יצא అంటే ‘బయటికి వెళ్లడం/బయలుదేరడం.’ మునుపు పేర్కొన్న దేశం నుండి జరిగిన కదలికను ‘బయలుదేరి’ సహజంగా తెలియజేస్తుంది.
- source_word: אַשּׁוּר
  choice: అష్షూరు
  rationale: ఈ నామం అష్షూరు అనే వ్యక్తినీ అష్షూరు దేశాన్నీ సూచించగలదు. తక్షణ వాక్యనిర్మాణంలో క్రియ తరువాత స్పష్టమైన కర్తగా చదవడం సహజం కాబట్టి ప్రధాన పాఠ్యంలో వ్యక్తి పేరుగా ఉంచబడింది.
- source_word: וַיִּבֶן
  choice: కట్టించాడు
  rationale: בנה ప్రాథమికంగా ‘కట్టు/నిర్మించు.’ పట్టణాల నిర్మాణాన్ని చెప్పే సందర్భంలో తెలుగు వాడుకలో ‘పట్టణాలను కట్టించాడు’ సహజంగా ఉంటుంది; ‘స్థాపించాడు’ అనడం మూలపదం కంటే మరింత వ్యాఖ్యానాత్మకం.
- source_word: נִינְוֵה
  choice: నీనెవె
  rationale: హీబ్రూ స్థలనామానికి తెలుగులో సుపరిచితమైన లిప్యంతరీకరణ.
- source_word: רְחֹבֹת עִיר
  choice: రెహోబోత్-ఈర్
  rationale: పునరుక్త אֶת తో కూడిన పట్టణాల జాబితాలో ఇది ఒక స్థలనామంగా ఉండటం అత్యంత సహజం; అందువల్ల భావానువాదం చేయకుండా లిప్యంతరీకరించబడింది.
- source_word: כָּלַח
  choice: కాలహు
  rationale: హీబ్రూ స్థలనామాన్ని తెలుగులో పలకడానికి అనుకూలంగా లిప్యంతరీకరించిన రూపం.
theological_decisions:
- issue: אַשּׁוּר యొక్క కర్తృత్వం మరియు అర్థం
  choice: 'అష్షూరే కర్త: ‘అష్షూరు బయలుదేరి’'
  alternative: 'మునుపటి వచనంలోని నిమ్రోదే అంతర్లీన కర్త: ‘అతడు ఆ దేశం నుండి అష్షూరు దేశానికి వెళ్లి’'
  rationale: హీబ్రూ పాఠంలో אַשּׁוּר వ్యక్తి పేరు ‘అష్షూరు’గానూ ప్రాంతం ‘అష్షూరు దేశం’గానూ అర్థమవుతుంది. తక్షణ వాక్యనిర్మాణం దానిని స్పష్టమైన కర్తగా చదవడానికి అనుకూలిస్తుంది; అయితే మరొక పఠనం నిజమైన పాఠ్యసంభావ్యత కాబట్టి పాదసూచికలో నిలుపబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. వ్యక్తి/ప్రాంతం అనే మూలపాఠ్య సందిగ్ధతను ప్రధాన పాఠ్యం మరియు పాదసూచిక ద్వారా నిలుపుకున్నాం. జాబితాలోని మూడు పేర్లకూ వర్తించేలా ‘పట్టణాలను’ చేర్చడం తెలుగు వాక్యసహజత కోసం చేసిన స్పష్టీకరణ.
