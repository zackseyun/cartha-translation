base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/016.yaml
  text: and the Jebusites[a], and the Amorites, and the Girgashites.
translation:
  language: te
  text: యెబూసీయులను[a], అమోరీయులను, గిర్గాషీయులను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో జాతిపేర్లు ఏకవచన రూపాల్లో ఉన్నాయి (‘యెబూసీయుడు,’ ‘అమోరీయుడు,’ ‘గిర్గాషీయుడు’); అయితే ఈ వంశావళిలో అవి ఆయా ప్రజలను సమష్టిగా సూచిస్తున్నందున తెలుగులో బహువచనం వాడబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיְבוּסִי
  choice: యెబూసీయులను
  rationale: హీబ్రూలో ఏకవచన జాతివాచక రూపం ఉన్నా, ఆదికాండం 10లో అది ఒక ప్రజాసమూహాన్ని సమష్టిగా సూచిస్తుంది. తెలుగు జాబితా సందర్భంలో బహువచన కర్మరూపం సహజంగా ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: הָאֱמֹרִי
  choice: అమోరీయులను
  rationale: చుట్టుపక్కల జాతిపేరుల మాదిరిగానే ఇది రూపంలో ఏకవచనమైనా, ఒక ప్రజాసమూహాన్ని సమష్టిగా సూచిస్తుంది; అందువల్ల తెలుగు బహువచన కర్మరూపం వాడబడింది.
- source_word: הַגִּרְגָּשִׁי
  choice: గిర్గాషీయులను
  rationale: ఏకవచన జాతివాచక రూపం ఇక్కడ సమష్టిగా ఒక ప్రజను సూచిస్తుంది. జాతుల జాబితాలో తెలుగు బహువచనం సహజమైన సమానార్థక వ్యక్తీకరణ.
- source_word: וְאֶת / וְאֵת
  choice: జాబితాలో విరామచిహ్నాల ద్వారా అనుసంధానం
  rationale: וְ జాబితాలోని అంశాలను కలుపుతుంది; אֵת ప్రత్యక్ష కర్మ సూచికగా తెలుగులో విడిగా అనువదించబడదు. ఈ వాక్యభాగం ముందటి వచనంలో మొదలైన జాబితాను కొనసాగిస్తున్నందున తెలుగులో విభక్తి మరియు కామాలు అనుసంధానాన్ని సహజంగా వ్యక్తం చేస్తాయి.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళి జాబితాకు తగిన సంక్షిప్తమైన, గౌరవప్రదమైన శైలి. ఇది ముందటి వచనం నుంచి కొనసాగుతున్న కర్మల జాబితా కాబట్టి ప్రతి జాతిపేరుకు ‘-లను’ రూపం వాడబడింది.
