  yaml_path: translation/ot/genesis/010/004.yaml
  text: 'And the sons of Javan: Elishah[a], Tarshish, Kittim, and Dodanim.'
translation:
  language: te
  text: 'యావాను కుమారులు: ఎలీషా, తర్షీషు, కిత్తీయులు, దోదానీయులు[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని ప్రతులలోను, 1 దినవృత్తాంతాలు 1:7లోను ‘దోదానీయులు’కు బదులుగా ‘రోదానీయులు’ అని ఉంది.
    reason: textual_variant
lexical_decisions:
- source_word: וּ/בְנֵי יָוָן
  choice: యావాను కుమారులు
  rationale: వంశావళి నిర్మాణంలోని בְּנֵי అనే బహువచనాన్ని నేరుగా ‘కుమారులు’ అని అనువదించడం ద్వారా హీబ్రూ రూపాన్ని నిలిపి, యావాను అనే పేరును తెలుగు ఉచ్చారణకు తగిన విధంగా లిప్యంతరీకరించాం. వచనం స్వతంత్ర జాబితాగా సహజంగా ఉండేందుకు ఆరంభ וְ ను ప్రత్యేకంగా ‘మరియు’ అని చూపలేదు.
- source_word: אֱלִישָׁה
  choice: ఎలీషా
  rationale: వ్యక్తి లేదా ప్రజా/ప్రదేశ నామాన్ని అనువదించకుండా తెలుగు ధ్వని రూపంలో లిప్యంతరీకరించాం.
- source_word: תַרְשִׁישׁ
  choice: తర్షీషు
  rationale: పేరు లేదా ప్రదేశనామంగా ఉన్న హీబ్రూ పదాన్ని తెలుగు పాఠకులకు సహజమైన రూపంలో లిప్యంతరీకరించాం.
- source_word: כִּתִּים
  choice: కిత్తీయులు
  rationale: ఇది బహువచన ప్రజానామం; అందువల్ల హీబ్రూ బహువచన భావాన్ని తెలుగులో ‘-ీయులు’ రూపంతో స్పష్టంగా వ్యక్తం చేశాం.
- source_word: דֹדָנִים
  choice: దోదానీయులు
  rationale: WLC/మసొరెటిక్ పాఠంలోని ד అక్షరాన్ని అనుసరించి ‘దోదానీయులు’ అని ఇచ్చాం; ర అక్షరంతో ఉన్న పాఠభేదాన్ని పాదసూచికలో ఉంచాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన వంశావళి శైలిని అనుసరించాం. వ్యక్తినామాలను లిప్యంతరీకరించి, బహువచన ప్రజానామాలకు సహజమైన తెలుగు రూపాలను వాడాం. పాఠభేద సూచికను అది సంబంధించిన ‘దోదానీయులు’ పదానికే జత చేశాం.
