  yaml_path: translation/ot/genesis/010/029.yaml
  text: Ophir[a], Havilah, and Jobab. All these were the sons of Joktan.
translation:
  language: te
  text: ఓఫీరు, హవీలా, యోబాబు. వీరందరూ యొక్తాను కుమారులు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యొక్తాను సంతతివారు.” వంశావళుల్లో “కుమారులు” అనే హీబ్రూ పదం కొన్నిసార్లు విస్తృతంగా సంతతివారిని కూడా సూచించవచ్చు; అయితే ఇక్కడ ఇప్పుడే పేర్కొన్న కుమారులనే సూచించడం అత్యంత సహజం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶת
  choice: '[తెలుగులో ప్రత్యక్ష కర్మ సూచికను విడిచిపెట్టి, పేర్లను జాబితాగా అందించడం]'
  rationale: పునరావృతమైన אֵת మునుపటి వచనంలో మొదలైన వంశావళి జాబితాలో ప్రతి పేరును ప్రత్యక్ష కర్మగా సూచిస్తుంది. తెలుగులో దీనికి ప్రత్యేక రూపం అవసరం లేదు; పేర్లను కామాలతో వరుసగా ఉంచడం సహజం.
- source_word: אוֹפִר
  choice: ఓఫీరు
  rationale: వ్యక్తినామాన్ని హీబ్రూ ఉచ్చారణకు సమీపంగా, తెలుగులో సులభంగా పలికే రూపంలో లిప్యంతరీకరించాం.
- source_word: חֲוִילָה
  choice: హవీలా
  rationale: వ్యక్తినామాన్ని హీబ్రూ రూపానికి సమీపంగా లిప్యంతరీకరించాం.
- source_word: יוֹבָב
  choice: యోబాబు
  rationale: వ్యక్తినామాన్ని హీబ్రూ రూపానికి సమీపంగా, సహజమైన తెలుగు రూపంలో లిప్యంతరీకరించాం.
- source_word: כָּל אֵלֶּה
  choice: వీరందరూ
  rationale: పేరుపొందిన వ్యక్తులను తిరిగి సూచించే ఈ రూపం ఆధునిక తెలుగులో సహజంగా ఉండి, హీబ్రూ సంగ్రహ వాక్యంలోని ‘వీరంతా’ అనే భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: בְּנֵי
  choice: కుమారులు
  rationale: వంశావళులలో ఈ పదం విస్తృతంగా ‘సంతానం/వారసులు’ అని కూడా సూచించగలదు; అయితే ఇక్కడ వెంటనే పేర్కొన్న పురుష సంతానాన్ని సంగ్రహిస్తున్నందున ‘కుమారులు’ అత్యంత సహజమైన అర్థం.
- source_word: יָקְטָן
  choice: యొక్తాను
  rationale: వ్యక్తినామాన్ని హీబ్రూ రూపానికి సమీపంగా లిప్యంతరీకరించాం.
