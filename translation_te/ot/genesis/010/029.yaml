translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన వంశావళి శైలిని అనుసరించాం. అసలు పాఠంలోని సంక్షిప్త జాబితా నిర్మాణాన్ని నిలిపి, ‘కుమారులు’ పదంలోని సాధ్యమైన విస్తృత వంశావళి అర్థాన్ని పాదసూచికలో భద్రపరిచాం.
