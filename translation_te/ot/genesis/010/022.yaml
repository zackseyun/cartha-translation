  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన వంశావళి శైలి. పేర్లు దేశపేర్లుగా వివరణాత్మకంగా మార్చకుండా హెబ్రీ నామరూపాలకు దగ్గరగా లిప్యంతరీకరించబడ్డాయి. ప్రతి పాదటిప్పణి సూచిక ప్రధాన పాఠ్యంలో ఉంచబడింది.
