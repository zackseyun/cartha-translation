  source_fidelity: 'ప్రధాన పాఠ్యం హెబ్రీ వంశావళి నిర్మాణాన్ని నమ్మకంగా ప్రతిబింబిస్తుంది: בְּנֵי שֵׁם ను “షేము కుమారులు”గా, ఐదు పేర్లను వ్యక్తి/వంశపూర్విక పేర్లుగా లిప్యంతరీకరించింది. పేర్ల క్రమం, జాబితా స్వరూపం, మరియు ‘కుమారులు’ అనే పురుష వంశావళి సూచన అన్నీ మూలానికి సరిపోతాయి.'
