  yaml_path: translation/ot/genesis/010/022.yaml
  text: 'The sons of Shem: Elam[a], Asshur, Arpachshad, Lud[b], and Aram.'
translation:
  language: te
  text: 'షేము కుమారులు: ఏలాము, అష్షూరు[a], అర్పక్షదు[b], లూదు, అరాము[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అష్షూరు, అరాము అనే హెబ్రీ పేర్లు తరువాత అష్షూరియా, సిరియా అని పిలువబడిన ప్రాంతాలు/ప్రజలతో తరచుగా అనుబంధించబడతాయి.
    reason: cultural_note
  - marker: b
    text: హెబ్రీ పేరు ‘అర్పక్షదు’; గ్రీకు ప్రభావిత సంప్రదాయ రూపం ‘అర్ఫక్సదు’.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: కుమారులు
  rationale: ఇది בֵּן అనే పదం యొక్క నిర్మాణ బహువచనం. వంశావళి సందర్భంలో హెబ్రీలోని పురుష వంశక్రమ రూపాన్ని నేరుగా నిలుపుతుంది.
- source_word: שֵׁם
  choice: షేము
  rationale: వ్యక్తి పేరు; హెబ్రీ ఉచ్చారణకు దగ్గరగా తెలుగులో లిప్యంతరీకరించబడింది.
- source_word: עֵילָם
  choice: ఏలాము
  rationale: వంశావళిలో వ్యక్తి/జనసమూహ పూర్వికుని పేరుగా వచ్చిన హెబ్రీ నామానికి తెలుగు లిప్యంతరీకరణ.
- source_word: אַשּׁוּר
  choice: అష్షూరు
  rationale: ఇక్కడ దేశపేరుగా అనువదించకుండా, జాబితాలోని హెబ్రీ నామరూపాన్ని నిలిపింది.
- source_word: אַרְפַּכְשַׁד
  choice: అర్పక్షదు
  rationale: గ్రీకు ప్రభావిత సంప్రదాయ రూపం కంటే హెబ్రీ వ్యంజన నిర్మాణాన్ని అనుసరించిన తెలుగు లిప్యంతరీకరణ.
- source_word: לוּד
  choice: లూదు
  rationale: వచనంలో ఉన్న ఏకవచన నామరూపాన్ని నేరుగా లిప్యంతరీకరించింది; వేరే రూపమైన ‘లూదీయులు’ అని విస్తరించలేదు.
- source_word: אֲרָם
  choice: అరాము
  rationale: తరువాతి భౌగోళిక సమానార్థకమైన ‘సిరియా’కు మార్చకుండా హెబ్రీ పేరును నిలిపింది.
