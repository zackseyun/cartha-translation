id: GEN.10.31
reference: Genesis 10:31
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אֵ֣לֶּה בְנֵי שֵׁ֔ם לְ/מִשְׁפְּחֹתָ֖/ם לִ/לְשֹׁנֹתָ֑/ם בְּ/אַרְצֹתָ֖/ם לְ/גוֹיֵ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/031.yaml
  text: These are the sons of Shem[a], by their clans, by their languages, in their lands, by their nations.
translation:
  language: te
  text: ఇవే షేము కుమారులు—వారి వంశాల ప్రకారం, వారి భాషల ప్రకారం, వారి భూభాగాల్లో, వారి జాతుల ప్రకారం.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘వారి వంశాలవారీగా ... వారి భాషలవారీగా ... వారి జాతులవారీగా’ అని కూడా అనువదించవచ్చు. హీబ్రూలో పునరావృతమయ్యే ఉపసర్గాలు ఈ వర్గీకరణను సూచిస్తాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: వీరు
  rationale: నామవాచక వాక్యాన్ని తెలుగులో సహజంగా పరిచయం చేస్తూ, వ్యక్తుల సమూహాన్ని సూచించే నిర్దేశక రూపాన్ని నిలుపుతుంది.
- source_word: בְנֵי שֵׁם
  choice: షేము కుమారులు
  rationale: వంశావళికి చెందిన హీబ్రూ నిర్మాణాన్ని, దాని పురుషవంశ పదప్రయోగాన్ని యథాతథంగా నిలుపుతుంది; విస్తృతార్థమైన ‘సంతానం’ అని మార్చదు.
- source_word: לְמִשְׁפְּחֹתָם
  choice: వారి వంశాల ప్రకారం
  rationale: מִשְׁפָּחָה ఇక్కడ వంశీయ-గోత్రీయ సమూహాన్ని సూచిస్తుంది. ‘వంశాలు’ సాధారణ ఆధునిక తెలుగులో సహజంగా ఉండి కుటుంబాలకంటే విస్తృతమైన భావాన్ని ఇస్తుంది; לְ వర్గీకరణను ‘ప్రకారం’ తెలియజేస్తుంది.
- source_word: לִלְשֹׁנֹתָם
  choice: వారి భాషల ప్రకారం
  rationale: לָשׁוֹן అక్షరార్థంగా ‘నాలుక’ అయినా ఈ సందర్భంలో భాషా సమూహాలను సూచిస్తుంది; ‘భాషలు’ స్పష్టమైన సందర్భార్థాన్ని అందిస్తుంది.
- source_word: בְּאַרְצֹתָם
  choice: వారి దేశాల్లో
  rationale: אֶרֶץ బహువచనం ఆయా సమూహాలు నివసించిన భూభాగాలను సూచిస్తుంది. ‘దేశాలు’ ఆధునిక తెలుగులో సహజం; ఇక్కడ ఆధునిక జాతీయ రాజ్యాలనే తప్పనిసరిగా సూచించదు.
- source_word: לְגוֹיֵהֶם
  choice: వారి జనాల ప్రకారం
  rationale: גּוֹי ప్రజా లేదా జాతి సమూహాన్ని సూచిస్తుంది. ‘జనాలు’ ఆధునిక రాజకీయ జాతీయతను అనవసరంగా మోపకుండా సమూహ భావాన్ని నిలుపుతుంది; పునరావృత לְ ను ‘ప్రకారం’గా చూపుతుంది.
