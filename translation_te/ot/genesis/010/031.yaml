  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వంశావళి శైలి. హీబ్రూ వాక్యంలోని వర్గీకరణ క్రమం, పునరుక్తి నిలుపబడ్డాయి; ప్రధాన పాఠంలో పాదసూచిక గుర్తు చేర్చబడింది.
