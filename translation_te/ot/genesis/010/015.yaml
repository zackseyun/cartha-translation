translation:
  language: te
  text: కనాను తన మొదటి కుమారుడైన సీదోనును, హేతును[a] కనెను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఈ వంశావళి సందర్భంలో హేతు హిత్తీయులతో సంబంధమున్న పూర్వికుడు.
    reason: cross_reference
lexical_decisions:
- source_word: וּ/כְנַעַן
  choice: కనాను
  rationale: వంశావళి వరుసలోని వావ్ సంధిని తెలుగులో ప్రత్యేకంగా ‘మరియు’ అని పలకకుండా సహజ వాక్యప్రవాహంతో వ్యక్తం చేశాం; כנען పేరును ‘కనాను’గా లిప్యంతరీకరించాం.
- source_word: יָלַד
  choice: కన్నాడు
  rationale: వంశావళి సందర్భంలో ఇది సంతానాన్ని కనడం/కనబరచడం అనే భావం ఇస్తుంది. ‘కన్నాడు’ ఆధునిక తెలుగులో సహజంగా ఉండి పురుష వంశసంబంధాన్ని నిలుపుతుంది.
- source_word: אֶת
  choice: '[అనువదించలేదు]'
  rationale: నిర్దిష్ట ప్రత్యక్ష కర్మను సూచించే హీబ్రూ వ్యాకరణ చిహ్నానికి తెలుగులో ప్రత్యేక పదసమానం లేదు.
- source_word: צִידֹן
  choice: సీదోను
  rationale: వ్యక్తినామాన్ని తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: בְּכֹר/וֹ
  choice: తన మొదటిపుట్టినవాడైన
  rationale: నామవాచకంలోని మూడవ పురుష ఏకవచన ప్రత్యయం కనానుతో సంబంధాన్ని సూచిస్తుంది; ఈ రూపం సీదోను అతని మొదటి సంతానమని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: וְ/אֶת
  choice: హేతును
  rationale: వావ్ సంధి రెండవ కర్మను కలుపుతుంది; తెలుగులో కర్మవిభక్తితో కూడిన జాబితా నిర్మాణం ద్వారా దాని పని సహజంగా వ్యక్తమవుతుంది.
- source_word: חֵת
  choice: హేతు
  rationale: హీబ్రూ వ్యక్తినామాన్ని వివరణాత్మక విస్తరణ లేకుండా లిప్యంతరీకరించాం.
