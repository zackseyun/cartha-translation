source:
  edition: WLC
  text: וְ/אֶת הָֽ/אַרְוָדִ֥י וְ/אֶת הַ/צְּמָרִ֖י וְ/אֶת הַֽ/חֲמָתִ֑י וְ/אַחַ֣ר נָפֹ֔צוּ מִשְׁפְּח֖וֹת הַֽ/כְּנַעֲנִֽי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/018.yaml
  text: and the Arvadites[a], the Zemarites, and the Hamathites. Afterward the clans of the Canaanites were scattered.
translation:
  language: te
  text: అర్వాదీయులను, సెమారీయులను, హమాతీయులను. ఆ తరువాత కనానీయుల వంశాలు[a] చెదరిపోయాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కనానీయుని వంశాలు.” హెబ్రీలో “కనానీయుడు” అనే ఏకవచన జాతివాచక రూపం మొత్తం ప్రజాసమూహాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאַרְוָדִי
  choice: అర్వాదీయులను
  rationale: ఇది ఏకవచన రూపంలోని జాతివాచక పదమైనా, ఇక్కడ ఒక ప్రజాసమూహాన్ని సమష్టిగా సూచిస్తుంది. ముందున్న వాక్యంలోని క్రియకు కర్మగా ఉన్న సంబంధాన్ని తెలుగులో ద్వితీయావిభక్తితో నిలిపాం.
- source_word: הַצְּמָרִי
  choice: సెమారీయులను
  rationale: చుట్టుపక్కల ఉన్న జాతివాచక పదాల మాదిరిగానే ఇది సమష్టిగా ఒక ప్రజాసమూహాన్ని సూచిస్తుంది; తెలుగులో బహువచనం సహజంగా ఉంటుంది.
- source_word: הַחֲמָתִי
  choice: హమాతీయులను
  rationale: జనాల జాబితాలోని సమష్టి జాతివాచక పదం కాబట్టి బహువచనంగా అనువదించాం.
- source_word: וְאַחַר
  choice: ఆ తరువాత
  rationale: జాబితాలో పేర్కొన్న ప్రజల తరువాత జరిగిన పరిణామాన్ని తెలిపే కాలసూచక ప్రయోగం.
- source_word: נָפֹצוּ
  choice: చెదరిపోయాయి
  rationale: నిఫాల్ రూపం విడిపోయి విస్తరించిన ఫలితస్థితిని తెలియజేస్తుంది; తెలుగు అకర్మక రూపం ఈ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: מִשְׁפְּחוֹת
  choice: వంశాలు
  rationale: ఈ వంశావళి-జాతుల సందర్భంలో ఇది చిన్న కుటుంబాలను కాక, విస్తృత బంధుత్వ సమూహాలను సూచిస్తుంది.
- source_word: הַכְּנַעֲנִי
  choice: కనానీయుల
  rationale: హెబ్రీ రూపం వ్యాకరణపరంగా ఏకవచన జాతివాచకమైనా, ఇక్కడ కనానీయ ప్రజాసమూహాన్ని సమష్టిగా సూచిస్తుంది; తెలుగులో బహువచన సంబంధరూపం అర్థాన్ని స్పష్టంగా ఇస్తుంది.
theological_decisions:
- issue: הַכְּנַעֲנִי అనే సమష్టి ఏకవచనాన్ని ఎలా ప్రతిబింబించాలి
  choice: కనానీయుల వంశాలు
  alternative: కనానీయుని వంశాలు
  rationale: మూలంలోని వ్యాకరణ ఏకవచనాన్ని ప్రధాన పాఠంలో యాంత్రికంగా నిలిపితే తెలుగులో ఒక వ్యక్తిని సూచించినట్టు అపార్థం కలగవచ్చు. సమష్టి ప్రజాసమూహ భావాన్ని ప్రధాన పాఠంలో ఇచ్చి, రూపపరమైన ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి వాడబడింది. వచనం ముందరి జాబితా వాక్యానికి కొనసాగింపు కావడంతో మొదటి మూడు పేర్లను ద్వితీయావిభక్తిలో ఉంచి, మూలంలో లేని క్రియను ఈ వచనంలో చేర్చలేదు.
