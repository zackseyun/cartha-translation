id: GEN.10.9
reference: Genesis 10:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: הֽוּא הָיָ֥ה גִבֹּֽר צַ֖יִד לִ/פְנֵ֣י יְהוָ֑ה עַל כֵּן֙ יֵֽאָמַ֔ר כְּ/נִמְרֹ֛ד גִּבּ֥וֹר צַ֖יִד לִ/פְנֵ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/009.yaml
  text: He was a mighty hunter before Yahweh; therefore it is said[a], “Like Nimrod, a mighty hunter before Yahweh.”
translation:
  language: te
  text: అతడు యాహ్వే సన్నిధిలో పరాక్రమశాలి వేటగాడు. అందుచేత, “నిమ్రోదులా యాహ్వే సన్నిధిలో పరాక్రమశాలి వేటగాడు” అని అంటారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: విస్తృత సందర్భంలో ఈ పదబంధాన్ని ప్రతికూల భావంలో తీసుకుంటే, “యాహ్వేను ధిక్కరించిన పరాక్రమశాలి వేటగాడు” అని కూడా అనువదించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: גִבֹּר
  choice: పరాక్రమశాలి
  rationale: צַיִדతో కలిసి వేటలో అసాధారణ బలసామర్థ్యాన్ని సూచిస్తుంది. ‘పరాక్రమశాలి వేటగాడు’ ఆధునిక తెలుగులో సహజంగా, గౌరవప్రదంగా ఉంది.
- source_word: צַיִד
  choice: వేటగాడు
  rationale: ఈ పదం ‘వేట’ లేదా ‘వేటమాంసం’ అని కూడా అర్థమివ్వగలిగినా, גִבֹּר צַיִד అనే పదబంధంలో వేట నైపుణ్యంతో పేరుపొందిన వ్యక్తిని సూచిస్తుంది.
- source_word: לִפְנֵי
  choice: సన్నిధిలో
  rationale: మూలంలోని ప్రాథమిక సంబంధార్థమైన ‘ఎదుట, సమక్షంలో’ అనే భావాన్ని నిలుపుతుంది. ప్రతికూల భావసంభావ్యతను పాదసూచికలో ఉంచడం ద్వారా సందిగ్ధతను కాపాడుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, వ్యక్తినామంగా తెలుగులో లిప్యంతరీకరించింది.
- source_word: עַל כֵּן
  choice: అందుచేత
  rationale: తరువాత వచ్చే నానుడికి కారణాన్ని పరిచయం చేసే సూత్రప్రయోగాన్ని సహజమైన, గౌరవప్రదమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: יֵאָמַר
  choice: అని అంటారు
  rationale: నిఫాల్ అసంపూర్ణ క్రియలోని వ్యక్తిరహిత భావాన్ని తెలుగులో సహజమైన సామాన్య వాడుకగా వ్యక్తపరుస్తుంది.
- source_word: כְּנִמְרֹד
  choice: నిమ్రోదులా
  rationale: כְּ ఉపసర్గలోని పోలిక భావాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: నిమ్రోదుకు సంబంధించి לִפְנֵי יְהוָה పదబంధ భావం
  choice: యాహ్వే సన్నిధిలో
  alternative: యాహ్వేను ధిక్కరించి
  rationale: హీబ్రూ పదబంధపు ప్రాథమిక భావం ‘యాహ్వే ఎదుట/సన్నిధిలో.’ విస్తృత సందర్భాన్ని ప్రతికూలంగా గ్రహిస్తే ‘యాహ్వేను ధిక్కరించి’ అనే భావం సాధ్యమైనా, దానిని ప్రధాన పాఠ్యంలో నిర్ణయించకుండా పాదసూచికలో చూపడం మూలంలోని వ్యాఖ్యాన ఉద్వేగాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడబడింది. సామెతలాంటి పునరుక్తిని మూలానుసారంగా నిలిపి, దైవనామాన్ని ‘యాహ్వే’గా లిప్యంతరీకరించాం.
