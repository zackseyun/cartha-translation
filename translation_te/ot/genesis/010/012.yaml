  text: וְֽ/אֶת רֶ֔סֶן בֵּ֥ין נִֽינְוֵ֖ה וּ/בֵ֣ין כָּ֑לַח הִ֖וא הָ/עִ֥יר הַ/גְּדֹלָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/012.yaml
  text: and Resen[a], between Nineveh and Calah[b]; that is the great city.
translation:
  language: te
  text: నినెవెకు కాలహు[a]కు మధ్యనున్న రెసెనును కూడా కట్టాడు; అదే గొప్ప నగరం.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘కల్హు’; ఇది సంప్రదాయంగా ‘కాలహు’గా అనువదించే స్థలనామానికి అష్షూరు భాషలోని రూపం.
    reason: lexical_alternative
  - marker: b
    text: ‘అదే గొప్ప నగరం’ అనే మాట ప్రత్యేకంగా రెసెనును సూచించవచ్చు; లేదా నినెవెకు కాలహుకు మధ్యనున్న విస్తృత నగర ప్రాంతాన్ని సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֶת
  choice: అలాగే … రెసెనును
  rationale: וְ అనే సంధిని ‘అలాగే’తో, ప్రత్యక్ష కర్మసూచకమైన אֵת భావాన్ని ‘రెసెనును’లోని ద్వితీయావిభక్తితో వ్యక్తం చేశాం. ముందు వచనంలోని నిర్మాణక్రియ ఈ జాబితాలో కొనసాగుతుంది కాబట్టి సహజమైన తెలుగులో ‘కట్టించాడు’ను పునరుద్ధరించాం.
- source_word: רֶסֶן
  choice: రెసెను
  rationale: హీబ్రూ స్థలనామాన్ని ఆధునిక తెలుగు ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: בֵּין ... וּבֵין
  choice: …కు …కు మధ్య ఉన్న
  rationale: రెండు స్థలాల మధ్యనున్న స్థానాన్ని తెలిపే హీబ్రూ పరస్పర సంబంధ నిర్మాణానికి సహజమైన తెలుగు రూపం.
- source_word: נִינְוֵה
  choice: నినెవె
  rationale: హీబ్రూ స్థలనామానికి స్పష్టమైన తెలుగు లిప్యంతరీకరణ.
- source_word: כָּלַח
  choice: కాలహు
  rationale: హీబ్రూ రూపాన్ని అనుసరించిన సంప్రదాయ బైబిలు స్థలనామ రూపం; అష్షూరు భాషా రూపమైన ‘కల్హు’ను పాదసూచికలో ఉంచాం.
- source_word: הִוא
  choice: అదే
  rationale: వివరణాత్మకమైన, పూర్వపదాన్ని తిరిగి సూచించే సర్వనామ భావాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: הָעִיר הַגְּדֹלָה
  choice: మహానగరం
  rationale: ‘ఆ గొప్ప/పెద్ద నగరం’ అనే భావాన్ని ప్రస్తుత ప్రామాణిక తెలుగులో గంభీరంగా, సహజంగా అందిస్తుంది; పరిమాణంతో పాటు ప్రాముఖ్యత భావాన్నీ అనుమతిస్తుంది.
theological_decisions:
- issue: ‘అదే మహానగరం’ అనే మాట దేనిని సూచిస్తుంది?
  choice: ప్రధాన పాఠంలో సూచితాన్ని నిర్దిష్టంగా నిర్ణయించకుండా ‘అదే మహానగరం’ అని ఉంచాం.
  alternative: ఇది ప్రత్యేకంగా రెసెనును సూచించవచ్చు; లేదా నినెవె–కాలహు మధ్యనున్న విస్తృత నగర ప్రాంతాన్ని సూచించవచ్చు.
  rationale: హీబ్రూ వాక్యనిర్మాణం చివరి ఉపవాక్యం దేనిని సూచిస్తుందో నిస్సందేహంగా తేల్చదు. అందువల్ల అనువాదంలో ఒకే వ్యాఖ్యానాన్ని రుద్దకుండా అస్పష్టతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని వాడాం. ఈ వచనం ముందు వచనంలోని నగర నిర్మాణ జాబితిని కొనసాగిస్తున్నందున, తెలుగులో వాక్యం సంపూర్ణంగా ఉండేందుకు సందర్భంలో అంతర్లీనంగా ఉన్న ‘కట్టించాడు’ అనే క్రియను వ్యక్తం చేశాం. పాదసూచిక [a]ను అది వివరిస్తున్న ‘కాలహు’ వద్దనే ఉంచాం.
