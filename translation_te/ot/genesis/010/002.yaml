  text: 'The sons of Japheth: Gomer[a], Magog, Madai, Javan, Tubal, Meshech, and Tiras.'
translation:
  language: te
  text: 'యాపెతు కుమారులు: గోమెరు, మాగోగు, మాదయి[a], యావాను, తూబాలు, మెషెకు, తీరసు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'తరువాతి వాడుకలో ఇవి జాతి లేదా ప్రాంత సంబంధ గుర్తింపులు కావచ్చు: ‘మాదయి’ అంటే ‘మాదీయులు’; ‘యావాను’ అంటే ‘ఐఓనియా’ లేదా ‘గ్రీకులు.’ ప్రధాన పాఠంలో హీబ్రూ వంశావళి పేర్లు లిప్యంతరీకరణలోనే ఉంచబడ్డాయి.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: కుమారులు
  rationale: బֵּן పదం యొక్క నిర్మాణ బహువచన రూపం; వంశావళిలో పురుష సంతానాన్ని నేరుగా సూచిస్తున్నందున ‘కుమారులు’ అని అనువదించబడింది.
- source_word: יֶפֶת
  choice: యాఫెతు
  rationale: వ్యక్తి పేరు; ఆధునిక తెలుగు పాఠకులకు సహజంగా ఉండే బైబిలు నామరూపంలో లిప్యంతరీకరించబడింది.
- source_word: גֹּמֶר
  choice: గోమెరు
  rationale: వంశావళిలో వ్యక్తి పేరుగా ఉన్నందున అర్థానువాదం చేయకుండా లిప్యంతరీకరించబడింది.
- source_word: מָגוֹג
  choice: మాగోగు
  rationale: తరువాతి సందర్భాల్లో జాతి లేదా ప్రాంత సంబంధం ఉండవచ్చైనా, ఇక్కడ పేరుగా పనిచేస్తున్నందున లిప్యంతరీకరించబడింది.
- source_word: מָדַי
  choice: మాదయి
  rationale: ‘మాదీయులు’ అనే జాతి గుర్తింపుతో సంబంధం ఉన్నప్పటికీ, ఈ వంశావళిలో పేరుగా ఉన్న హీబ్రూ రూపం నిలుపబడింది.
- source_word: יָוָן
  choice: యావాను
  rationale: కొన్ని సందర్భాల్లో ఐఓనియా లేదా గ్రీకులను సూచించగలిగినా, ఇక్కడ వంశావళి పేరుగా ఉన్న రూపమే నిలుపబడింది.
- source_word: תֻבָל
  choice: తూబాలు
  rationale: వ్యక్తి పేరు; హీబ్రూ ఉచ్చారణకు సమీపంగా తెలుగులో లిప్యంతరీకరించబడింది.
- source_word: מֶשֶׁךְ
  choice: మెషెకు
  rationale: వ్యక్తి పేరు; అనువదించకుండా తెలుగులో లిప్యంతరీకరించబడింది.
- source_word: תִירָס
  choice: తీరసు
  rationale: వ్యక్తి పేరు; అనువదించకుండా తెలుగులో లిప్యంతరీకరించబడింది.
