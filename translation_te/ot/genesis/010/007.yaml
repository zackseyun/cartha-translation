id: GEN.10.7
reference: Genesis 10:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/בְנֵ֣י כ֔וּשׁ סְבָא֙ וַֽ/חֲוִילָ֔ה וְ/סַבְתָּ֥ה וְ/רַעְמָ֖ה וְ/סַבְתְּכָ֑א וּ/בְנֵ֥י רַעְמָ֖ה שְׁבָ֥א וּ/דְדָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/007.yaml
  text: 'And the sons of Cush: Seba[a], Havilah, Sabtah, Raamah, and Sabteca[b]. And the sons of Raamah: Sheba and Dedan.'
translation:
  language: te
  text: 'కూషు కుమారులు: సెబా[a], హవీలా, సబ్తా, రయమా, సబ్తెకా[b]. రయమా కుమారులు: షెబా, దెదాను.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: వంశావళుల్లో హీబ్రూ భాషలోని ‘కుమారులు’ అనే మాట తక్షణ జీవసంబంధ కుమారులనే కాకుండా వంశస్థులను లేదా ఒక వంశం నుంచి వచ్చిన ప్రజావర్గాలను కూడా సూచించవచ్చు.
    reason: cultural_note
  - marker: b
    text: ఈ వచనంలోని అనేక పేర్లు వ్యక్తులను మాత్రమే కాకుండా ప్రజలను, ప్రాంతాలను లేదా తమ పేరుతో ఒక ప్రజావర్గం పిలువబడే పూర్వీకులను కూడా సూచిస్తుండవచ్చు.
    reason: cultural_note
lexical_decisions:
- source_word: וּבְנֵי כוּשׁ
  choice: కూషు కుమారులు
  rationale: వంశావళి సూత్రంలోని בְּנֵי అనే పదానికి నేరుగా ‘కుమారులు’ అని అనువదించి, సంబంధం తక్షణ జీవసంబంధ కుమారులకే పరిమితం కాకపోవచ్చనే విస్తృతిని పాదటిప్పణిలో తెలిపాం. వావ్‌ను తెలుగు జాబితా ప్రవాహంలో ప్రత్యేకంగా ‘మరియు’ అని పలకకుండా సహజంగా ప్రతిబింబించాం.
- source_word: סְבָא
  choice: సెబా
  rationale: వ్యక్తి, ప్రజావర్గం లేదా ప్రదేశాన్ని సూచించగల నామాన్ని వ్యాఖ్యానించకుండా హీబ్రూ ఉచ్చారణకు సమీపంగా లిప్యంతరీకరించాం.
- source_word: חֲוִילָה
  choice: హవీలా
  rationale: హీబ్రూ నామాన్ని ఆధునిక తెలుగు పాఠకులకు పలకడానికి అనువుగా లిప్యంతరీకరించాం.
- source_word: סַבְתָּה
  choice: సబ్తా
  rationale: మూలంలోని హల్లులు, అచ్చుల రూపాన్ని సాధ్యమైనంత సమీపంగా నిలిపే తెలుగు లిప్యంతరీకరణ.
- source_word: רַעְמָה
  choice: రయమా
  rationale: ע హల్లుకు తెలుగులో ఖచ్చిత సమానం లేనందున దానిని ‘య’తో స్వల్పంగా సూచిస్తూ, పేరును సులభంగా పలికే రూపంలో ఇచ్చాం.
- source_word: סַבְתְּכָא
  choice: సబ్తెకా
  rationale: హీబ్రూ రూపానికి సమీపమైన, సహజంగా చదవగల తెలుగు లిప్యంతరీకరణను ఎంచుకున్నాం.
- source_word: וּבְנֵי רַעְמָה
  choice: రయమా కుమారులు
  rationale: మొదటి వంశావళి సూత్రాన్ని పునరావృతం చేసి మూలంలోని నిర్మాణాన్ని నిలిపాం; ప్రారంభ వావ్ తెలుగు వాక్య విభజనలో సహజంగా అంతర్లీనమైంది.
- source_word: שְׁבָא
  choice: షెబా
  rationale: שׁ ధ్వనిని ‘ష’తో ప్రతిబింబించి పేరును లిప్యంతరీకరించాం.
- source_word: דְדָן
  choice: దెదాను
  rationale: హీబ్రూ నామాన్ని తెలుగు పదాంత ఉచ్చారణకు అనువుగా ‘దెదాను’గా లిప్యంతరీకరించాం; దీనిని జాతివాచక విశేషణంగా మార్చలేదు.
theological_decisions:
- issue: ‘కుమారులు’ అనే వంశావళి పదబంధం సూచించే సంబంధం
  choice: ప్రధాన పాఠ్యంలో ‘కుమారులు’ అని ఉంచి, విస్తృత వంశ/ప్రజావర్గ అర్థసాధ్యతను పాదటిప్పణిలో వివరించడం
  alternative: ప్రధాన పాఠ్యంలో ‘వంశస్థులు’ అని అనువదించడం
  rationale: בְּנֵי యొక్క ప్రత్యక్ష రూపాన్ని నిలిపేటప్పుడు, అది తప్పనిసరిగా తక్షణ జీవసంబంధ కుమారులనే సూచిస్తుందనే భావాన్ని రుద్దకుండా మూలంలోని విస్తృతిని కాపాడుతుంది.
- issue: జాబితాలోని పేర్ల స్వరూపం
  choice: వ్యక్తుల పేర్ల మాదిరిగా లిప్యంతరీకరించి, ప్రజలు/ప్రాంతాలు/నామమూల పూర్వీకులు కావచ్చనే అవకాశాన్ని పాదటిప్పణిలో ఉంచడం
  alternative: ప్రధాన పాఠ్యంలోనే వాటిని జాతులు లేదా ప్రాంతాలుగా గుర్తించడం
  rationale: మూలపాఠం ఈ స్థాయిలో వాటి స్వరూపాన్ని స్పష్టంగా నిర్ణయించదు; అందువల్ల నిజమైన అనిశ్చితిని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన వంశావళి శైలిని పాటించాం. మూలంలోని రెండు సమాంతర జాబితాలను రెండు వాక్యాలుగా ఇచ్చి చదవడానికి సులభం చేశాం. పేర్లను అనువదించకుండా హీబ్రూ ధ్వనులకు సమీపంగా, తెలుగు పఠనానికి అనువుగా లిప్యంతరీకరించాం; వివరణాత్మక అవకాశాలను పాదటిప్పణులకు పరిమితం చేశాం.
