base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/013.yaml
  text: And Mizraim fathered the Ludim[a], the Anamim, the Lehabim[b], and the Naphtuhim.
translation:
  language: te
  text: మిస్రాయిము లూదీయులను, అనామీయులను, లెహాబీయులను[b], నఫ్తూహీయులను కన్నాడు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “వారికి తండ్రియయ్యాడు” లేదా “వారికి మూలపురుషుడయ్యాడు”; హీబ్రూ క్రియ సంతానం లేదా వంశం ఉద్భవించడాన్ని తెలిపే సాధారణ వంశావళి పదం.
    reason: lexical_alternative
  - marker: b
    text: ఈ పేర్లు స్థలనామాలుగా అనువదించబడలేదు, తరువాతి జాతులతో గుర్తించబడలేదు; హీబ్రూలో ఉన్న ప్రజావర్గ నామాలుగా లిప్యంతరీకరించబడ్డాయి.
    reason: cultural_note
lexical_decisions:
- source_word: מִצְרַיִם
  choice: మిస్రాయిము
  rationale: జనముల వంశావళిలో ఇది ఐగుప్తుకు సంబంధించిన పేరే అయినా, ఇక్కడ మూలపురుషుని వ్యక్తినామంగా పనిచేస్తున్నందున లిప్యంతరీకరించబడింది.
- source_word: יָלַד
  choice: తండ్రి అయ్యాడు
  rationale: వంశావళి సందర్భంలో పురుషుని ద్వారా సంతానం లేదా వంశాలు ఉద్భవించడాన్ని సూచించే సాధారణ హీబ్రూ క్రియ; ఆధునిక తెలుగులో సహజంగా ఉండేలా అనువదించబడింది.
- source_word: אֶת
  choice: '[ప్రత్యేకంగా అనువదించలేదు]'
  rationale: ఇది ప్రత్యక్ష కర్మ సూచిక; తెలుగులో దీనికి స్వతంత్ర పదం అవసరం లేదు.
- source_word: לוּדִים
  choice: లూదీయులు
  rationale: హీబ్రూ బహువచన ప్రజావర్గ నామాన్ని తెలుగులో సహజమైన ప్రజావర్గ రూపంతో లిప్యంతరీకరించింది.
- source_word: עֲנָמִים
  choice: అనామీయులు
  rationale: నిశ్చితంగా గుర్తించలేని ఈ ప్రజావర్గ నామాన్ని అనువదించకుండా లిప్యంతరీకరించింది.
- source_word: לְהָבִים
  choice: లెహాబీయులు
  rationale: తరువాతి జాతులతో అనిశ్చితమైన గుర్తింపును ప్రధాన పాఠ్యంలో ప్రవేశపెట్టకుండా హీబ్రూ రూపాన్ని అనుసరించింది.
- source_word: נַפְתֻּחִים
  choice: నఫ్తూహీయులు
  rationale: వంశావళిలోని బహువచన ప్రజావర్గ నామంగా లిప్యంతరీకరించబడింది.
- source_word: וְ
  choice: మరియు/జాబితా సమన్వయం
  rationale: హీబ్రూ సంధులను తెలుగులో సహజమైన జాబితా క్రమం, విరామచిహ్నాలతో వ్యక్తపరచి చివరి అంశానికి కర్మ విభక్తిని ఉంచింది.
theological_decisions:
- issue: వంశావళి సంబంధ స్వరూపం
  choice: “తండ్రి అయ్యాడు” అని ఉంచడం
  alternative: “కన్నాడు” లేదా “పుట్టించాడు”
  rationale: పేర్లు వ్యక్తులకన్నా ప్రజావర్గాలను సూచిస్తున్న అవకాశాన్ని నిలుపుతూ, నేరుగా ఒకే తరపు శారీరక జననమని అనవసరంగా నిర్ధారించకుండా వంశోత్పత్తి భావాన్ని తెలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన వంశావళి శైలి. ప్రజావర్గ నామాలకు తెలుగు బహువచన రూపమైన “-ీయులు” వాడబడింది; మూలంలోని భావసందిగ్ధతను పాదసూచికలో నిలిపింది.
