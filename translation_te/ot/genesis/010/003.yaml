lexical_decisions:
- source_word: וּ/בְנֵי
  choice: కుమారులు
  rationale: వంశావళి సందర్భంలో בְּנֵי అనే నిర్మాణ బహువచనానికి ‘కుమారులు’ సహజమైన, ఖచ్చితమైన తెలుగు సమానం. ముందున్న వాక్యంతో అనుసంధానం తెలుగులో సందర్భం మరియు జాబితా నిర్మాణం ద్వారా స్పష్టమవుతున్నందున וּ ను ప్రత్యేకంగా ‘మరియు’ అని అనువదించలేదు.
- source_word: גֹּמֶר
  choice: గోమెరు
  rationale: వ్యక్తి పేరును ఆధునిక ప్రామాణిక తెలుగు ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: אַשְׁכֲּנַז
  choice: అష్కెనజు
  rationale: వంశావళిలోని వ్యక్తి పేరుగా అనువదించకుండా తెలుగులో లిప్యంతరీకరించాం.
- source_word: וְ/רִיפַת
  choice: రీఫతు
  rationale: WLC మసొరెటిక్ పాఠంలోని רִיפַת రూపాన్నే ప్రధాన పాఠంలో అనుసరించాం; 1 దినవృత్తాంతాలు 1:6లోని భిన్న రూపాన్ని పాదటిప్పణిలో ఇచ్చాం.
- source_word: וְ/תֹגַרְמָה
  choice: తోగర్మా
  rationale: వ్యక్తి పేరును తెలుగులో లిప్యంతరీకరించాం; జాబితాలో చివరి అంశాన్ని తెలుగులో సహజంగా విరామచిహ్నాలతో కలిపాం.
