    reason: cultural_note
lexical_decisions:
- source_word: וַתְּהִי
  choice: ప్రారంభమైంది
  rationale: ఇక్కడ היה రూపం గతకాల వర్ణనను పరిచయం చేస్తుంది. రֵאשִׁיתతో కలిపి సహజమైన ఆధునిక తెలుగులో ‘ప్రారంభమైంది’ అని వ్యక్తం చేశాం.
- source_word: רֵאשִׁית
  choice: ప్రారంభం
  rationale: ఈ పదానికి ‘ఆరంభం,’ ‘మొదటి భాగం,’ లేదా ‘ప్రధాన భాగం’ అనే అర్థాలు సాధ్యమైనా, ఇక్కడ రాజ్యపు తొలి కేంద్రం లేదా తొలి విస్తృతిని సూచించే ‘ప్రారంభం’ సందర్భానికి తగినది.
- source_word: מַמְלַכְתּוֹ
  choice: అతని రాజ్యం
  rationale: ఈ నామవాచకం రాజ్యం, రాజరికం, లేదా రాజపాలనను సూచించగలదు. ప్రదేశాల జాబితా ఉన్నందున ‘రాజ్యం’ స్పష్టంగా, సహజంగా ఉంది.
- source_word: בָּבֶל
  choice: బాబెలు
  rationale: హీబ్రూ స్థలనామాన్ని లిప్యంతరీకరించాం; ఇది ఆదికాండం 11తో ఉన్న సాహిత్య సంబంధాన్ని కూడా నిలుపుతుంది.
- source_word: אֶרֶךְ
  choice: ఎరెకు
  rationale: హీబ్రూ రూపాన్ని తెలుగులో లిప్యంతరీకరించాం; ప్రాచీన ఊరుకు నగరంతో సాధారణంగా చేసే గుర్తింపును పాదసూచికలో ఇచ్చాం.
- source_word: אַכַּד
  choice: అక్కదు
  rationale: హీబ్రూ స్థలనామాన్ని దాని ద్విత్వ క ధ్వనిని నిలుపుతూ తెలుగులో లిప్యంతరీకరించాం.
- source_word: כַלְנֵה
  choice: కల్నె
  rationale: మసొరెటిక్ పాఠంలోని స్థలనామ రూపాన్ని నేరుగా లిప్యంతరీకరించాం.
- source_word: בְּאֶרֶץ שִׁנְעָר
  choice: షినారు దేశంలోని
  rationale: אֶרֶץ యొక్క భౌగోళిక భావాన్ని ‘దేశం’తో నిలుపుతూ, తెలుగు వాక్య నిర్మాణానికి సహజంగా విశేషణ రూపంలో ఇచ్చాం.
