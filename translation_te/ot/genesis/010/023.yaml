    reason: textual_variant
lexical_decisions:
- source_word: וּבְנֵי
  choice: కుమారులు
  rationale: בֵּן పదం యొక్క బహువచన సంబంధరూపం; వంశావళి సందర్భంలో ‘కుమారులు’ అనేది నేరుగా, సహజంగా ఉంటుంది. ఆరంభంలోని וּ సంధిని జాబితా నిర్మాణం తెలుగులోనే స్పష్టం చేస్తున్నందున విడిగా అనువదించలేదు.
- source_word: אֲרָם
  choice: అరాము
  rationale: వ్యక్తినామాన్ని ఆధునిక తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: עוּץ
  choice: ఊజు
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగులో సులభంగా పలికే, ప్రాచుర్యంలో ఉన్న రూపంలో లిప్యంతరీకరించాం.
- source_word: חוּל
  choice: హూలు
  rationale: హీబ్రూ వ్యక్తినామాన్ని దాని దీర్ఘ స్వరాన్ని ప్రతిబింబించేలా లిప్యంతరీకరించాం.
- source_word: גֶתֶר
  choice: గెతెరు
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు ధ్వని, లిపి పద్ధతులకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: מַשׁ
  choice: మష్
  rationale: మసొరేటిక్ పాఠంలోని పేరును నేరుగా ప్రతిబింబించాం; 1 దినవృత్తాంతాలు 1:17లోని భిన్న రూపాన్ని ప్రధాన పాఠంలో కలపకుండా పాదసూచికలో తెలిపాం.
theological_decisions: []
