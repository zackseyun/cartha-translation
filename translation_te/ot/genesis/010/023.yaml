  register: సంక్షిప్త వంశావళి శైలిని నిలిపి, సాధారణ ఆధునిక తెలుగు పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన భాషను ఉపయోగించాం. వ్యక్తినామాలను అనువదించకుండా తెలుగు లిపిలో పలుకుబడికి అనుగుణంగా ఇచ్చాం.
