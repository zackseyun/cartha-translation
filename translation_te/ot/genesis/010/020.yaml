  verdict: revise
  source_fidelity: మొదటి మూడు వర్గీకరణలు (వంశాలు, భాషలు, దేశాలు) హీబ్రూ వాక్యనిర్మాణానికీ అర్థానికీ నమ్మకంగా ఉన్నాయి. అయితే చివరి בְּגוֹיֵהֶם లోని בְּ ప్రధానంగా స్థాన/సమూహ-సంబంధాన్ని సూచిస్తుండగా, దానిని ‘ప్రకారం’గా మార్చడం మూలంలోని చివరి రెండు బ్-ప్రయోగాల వ్యత్యాసాన్ని చెరిపివేస్తుంది. దాన్ని ‘వారి జనసమూహాల్లో’గా అనువదించడం సహజంగాను, మూలానికి సన్నిహితంగాను ఉంటుంది.
