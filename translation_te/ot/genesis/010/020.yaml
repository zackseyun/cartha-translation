translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన, గౌరవప్రదమైన వంశావళి-సారాంశ శైలి. మూలంలోని వంశం, భాష, భూభాగం, జనసమూహం అనే నాలుగు వర్గాలను వేరుగా ఉంచింది.
