  text: These are the sons of Ham[a], by their clans, by their languages, in their lands[b], by their nations.
translation:
  language: te
  text: హాము కుమారులు వీరే—వారి వంశాల ప్రకారం, వారి భాషల ప్రకారం, వారి దేశాల్లో, వారి జనసమూహాల్లో.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה בְנֵי חָם
  choice: హాము వంశస్థులు వీరే
  rationale: వంశావళి సందర్భంలో בְנֵי అనే పదం ప్రత్యక్ష కుమారులను మాత్రమే కాక విస్తృతమైన సంతతిని కూడా సూచిస్తుంది. ఆధునిక తెలుగులో ‘వంశస్థులు’ ఆ భావాన్ని సహజంగా తెలియజేస్తుంది; వాక్యాంతంలోని ‘వీరే’ హీబ్రూ గుర్తింపు వాక్య బలాన్ని నిలుపుతుంది.
- source_word: לְמִשְׁפְּחֹתָם
  choice: వారి వంశాల ప్రకారం
  rationale: לְ ఇక్కడ వర్గీకరణను సూచిస్తుంది. מִשְׁפָּחוֹת అనేవి బంధుత్వ ఆధారిత వంశ సమూహాలు; ‘వంశాల ప్రకారం’ సాధారణ పాఠకులకు స్పష్టంగా ఉంటుంది.
- source_word: לִלְשֹׁנֹתָם
  choice: వారి భాషల ప్రకారం
  rationale: לָשׁוֹן అక్షరార్థంగా ‘నాలుక’ అయినా ఇక్కడ భాషను సూచిస్తుంది. వర్గీకరణ భావాన్ని ‘ప్రకారం’ నిలుపుతుంది.
- source_word: בְאַרְצֹתָם
  choice: వారి దేశాల్లో
  rationale: בְ స్థానార్థకంగా ‘లో’ అని సూచిస్తుంది. אֶרֶץ బహువచనం ఆయా భూభాగాలు లేదా దేశాలను సూచిస్తుంది; ‘దేశాల్లో’ సహజమైన ఆధునిక తెలుగు, ఆధునిక జాతీయ-రాష్ట్ర భావాన్ని తప్పనిసరిగా మోపదు.
- source_word: בְגוֹיֵהֶם
  choice: వారి జనాల ప్రకారం
  rationale: גּוֹי ఇక్కడ జాతి/ప్రజా సమూహాన్ని సూచిస్తుంది. అధ్యాయంలోని సమాంతర వర్గీకరణ సూత్రానికి అనుగుణంగా בְ ను ‘ప్రకారం’గా వ్యక్తపరచడం సహజం; ‘జనాలు’ అనేది ‘దేశాలు’తో అనవసర కలయికను నివారిస్తుంది.
