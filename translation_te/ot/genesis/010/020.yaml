  terminology: מִשְׁפָּחוֹתకు ‘వంశాలు,’ לְשֹׁנוֹתకు ‘భాషలు,’ אֲרָצוֹתకు ‘దేశాలు’ అనుకూలమైనవి. גּוֹיִם కోసం ‘జనసమూహాలు’ వంశాలు, భాషలు, భూభాగాల నుంచి వేరైన ప్రజా/జాతి సమూహ భావాన్ని నిలుపుతుంది.
