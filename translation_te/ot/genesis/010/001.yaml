id: GEN.10.1
reference: Genesis 10:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אֵ֨לֶּה֙ תּוֹלְדֹ֣ת בְּנֵי נֹ֔חַ שֵׁ֖ם חָ֣ם וָ/יָ֑פֶת וַ/יִּוָּלְד֥וּ לָ/הֶ֛ם בָּנִ֖ים אַחַ֥ר הַ/מַּבּֽוּל־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/001.yaml
  text: 'These are the generations of the sons of Noah: Shem[a], Ham, and Japheth. And sons were born to them after the flood.'
translation:
  language: te
  text: నోవహు కుమారులైన షేము, హాము, యాఫెతుల వంశావళి[a] ఇది. జలప్రళయం తరువాత వారికి కుమారులు పుట్టారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నోవహు కుమారుల సంతతి.’ ఇక్కడ ‘వంశావళి’గా అనువదించిన హెబ్రీ శీర్షిక పదం ఒక వ్యక్తి నుంచి వచ్చిన వంశాన్ని లేదా అతనికి సంబంధించిన వంశవృత్తాంతాన్ని విస్తృతంగా సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: ఇది
  rationale: ఈ ప్రయోగం కొత్త విభాగాన్ని పరిచయం చేస్తుంది. తెలుగులో శీర్షిక వాక్యానికి సహజమైన ‘ఇది’ను వాడి, మూలంలో లేని కాలార్థక పదాన్ని చేర్చలేదు.
- source_word: תּוֹלְדֹת
  choice: వంశావళి
  rationale: ఆదికాండంలో పునరావృతమయ్యే విభాగ-శీర్షికను గుర్తించగలిగేలా ఉంచుతూ, వంశం నుంచి వచ్చినవారు లేదా దాని వృత్తాంతం అనే విస్తృత భావానికి అనువైన సహజ తెలుగు పదం.
- source_word: בְּנֵי נֹחַ
  choice: నోవహు కుమారులైన
  rationale: హెబ్రీ నిర్మాణాన్ని స్పష్టంగా తెలియజేస్తూ, వెంట వచ్చే మూడు పేర్లతో తెలుగులో సహజంగా అనుసంధానిస్తుంది.
- source_word: שֵׁם חָם וָיָפֶת
  choice: షేము, హాము, యాఫెతు
  rationale: వ్యక్తుల పేర్లను మూలభాష ఉచ్చారణకు దగ్గరగా తెలుగు లిపిలో ఇచ్చాం.
- source_word: וַיִּוָּלְדוּ לָהֶם בָּנִים
  choice: వారికి కుమారులు పుట్టారు
  rationale: నిఫాల్ క్రియారూపంలోని ‘పుట్టారు’ అనే భావాన్ని నిలుపుతూ, לָהֶם సంబంధార్థాన్ని ‘వారికి’గా సహజంగా వ్యక్తం చేస్తుంది; בָּנִיםలోని పుంలింగ నిర్దిష్టతను ‘కుమారులు’గా నిలుపుతుంది.
- source_word: אַחַר הַמַּבּוּל
  choice: జలప్రళయం తరువాత
  rationale: ఆదికాండంలోని మహాప్రళయ సందర్భాన్ని ఆధునిక తెలుగులో స్పష్టంగా సూచించే స్థిరమైన ప్రయోగం.
theological_decisions:
- issue: תּוֹלְדֹת అనే ఆదికాండపు సూత్రపదం
  choice: వంశావళి
  alternative: వంశవృత్తాంతం; సంతతి
  rationale: ఒకే అర్థానికి అతిగా కుదించకుండా, ఆదికాండంలోని వంశపరమైన నిర్మాణాన్ని కాపాడుతుంది. మూలపదంలోని విస్తృతిని పాదటిప్పణిలో తెలియజేశాం.
- issue: בָּנִיםలోని లింగ నిర్దిష్టత
  choice: కుమారులు
  alternative: పిల్లలు; సంతానం
  rationale: ఈ వంశావళి సందర్భంలో హెబ్రీ పదం పురుష సంతానాన్ని నిర్దిష్టంగా సూచిస్తుంది; అందువల్ల లింగనిరపేక్ష పదంతో దానిని చదును చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన శైలిని వాడాం. శీర్షిక వాక్యాన్ని సహజ తెలుగు పదక్రమంలో ఇచ్చి, ఆదికాండపు వంశావళి సూత్రాన్ని నిలుపుకున్నాం.
