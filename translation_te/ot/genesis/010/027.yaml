  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్త వంశావళి-జాబితా శైలి పాటించబడింది. మూలంలోని אֵת సూచించే కర్మ సంబంధాన్ని ‘-ను’ విభక్తితో నిలిపి, ముందరి వచనంలోని క్రియపై ఈ వాక్యఖండం ఆధారపడుతున్న నిర్మాణాన్ని సంరక్షించాం.
