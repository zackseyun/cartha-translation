lexical_decisions:
- source_word: וְ/אֶת
  choice: -ను; జాబితాలో కామాలతో సమన్వయం
  rationale: אֵת ప్రత్యక్ష కర్మ సూచిక; וְ జాబితాలోని పేర్లను కలుపుతుంది. తెలుగులో ప్రతి పేరుకు ‘-ను’ చేర్చడం ద్వారా మునుపటి వాక్యంలోని క్రియతో ఉన్న కర్మ సంబంధం సహజంగా వ్యక్తమవుతుంది; కామాలు జాబితా నిర్మాణాన్ని చూపుతాయి.
- source_word: הֲדוֹרָם
  choice: హదోరాము
  rationale: వంశావళిలోని నామం కనుక అర్థానువాదం చేయకుండా హీబ్రూ ఉచ్చారణకు దగ్గరగా తెలుగు లిపిలో రాయబడింది.
- source_word: אוּזָל
  choice: ఊజాలు
  rationale: హీబ్రూ నామాన్ని అర్థానువాదం చేయకుండా, దీర్ఘ ū ధ్వనిని ‘ఊ’తో సూచిస్తూ తెలుగు లిప్యంతరీకరణ చేయబడింది.
- source_word: דִּקְלָה
  choice: దిక్లా
  rationale: హీబ్రూ నామంలోని హల్లుల క్రమాన్ని నిలుపుతూ సహజమైన తెలుగు రూపంలో లిప్యంతరీకరించబడింది.
