id: GEN.10.30
reference: Genesis 10:30
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַֽ/יְהִ֥י מוֹשָׁבָ֖/ם מִ/מֵּשָׁ֑א בֹּאֲ/כָ֥ה סְפָ֖רָ/ה הַ֥ר הַ/קֶּֽדֶם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/030.yaml
  text: And their settlement was from Mesha as you go toward Sephar[a], the hill country of the east.
translation:
  language: te
  text: వారి నివాస ప్రాంతం మేషా నుండి తూర్పు కొండ ప్రాంతమైన సెఫారు[a] వైపునకు ఉండేది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారి నివాసం మేషా నుండి సెఫారు వైపు ఉండేది, తూర్పు పర్వతం వరకు.” హీబ్రూలో ‘తూర్పు పర్వతం/కొండ ప్రాంతం’ అనే పదబంధం సెఫారుకు వివరణగా కూడా అర్థమవవచ్చు.
    reason: హీబ్రూ వాక్యనిర్మాణంలోని భౌగోళిక పదబంధం సెఫారుకు వివరణగా ఉన్నదా, సరిహద్దు దిశను/చివరను సూచిస్తున్నదా అనే పరిమిత సందిగ్ధతను నిలుపుతుంది.
lexical_decisions:
- source_word: וַיְהִי
  choice: ఉండేది
  rationale: היה అనే క్రియకు సన్నిహితంగా ఉండి, ఈ భౌగోళిక వివరణను సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: מוֹשָׁבָם
  choice: వారి నివాస ప్రాంతం
  rationale: ఇక్కడ వ్యక్తిగత నివాసాన్ని కాక ఒక జనసమూహం నివసించిన భూభాగాన్ని సూచిస్తున్నందున ‘నివాస ప్రాంతం’ సందర్భోచితం.
- source_word: מִמֵּשָׁא
  choice: మేషా నుండి
  rationale: స్థలనామాన్ని తెలుగు లిపిలో లిప్యంతరీకరించి, מִן ఉపసర్గ భావాన్ని ‘నుండి’తో తెలిపింది.
- source_word: בֹּאֲכָה
  choice: వైపు వెళ్లే దిశగా
  rationale: ఒక స్థలం వైపు ప్రయాణించే భౌగోళిక దిశను సూచించే హీబ్రూ ప్రయోగాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: סְפָרָה
  choice: సెఫారు
  rationale: స్థలనామాన్ని మూల హీబ్రూ ఉచ్చారణకు దగ్గరగా తెలుగు లిపిలో ఇచ్చింది; దిశార్థక ప్రత్యయం భావం ‘వైపు’లో వ్యక్తమైంది.
- source_word: הַר
  choice: కొండ ప్రాంతం
  rationale: ఈ భౌగోళిక సందర్భంలో ఒకే కొండకన్నా పర్వతమయమైన ప్రాంతాన్ని సూచించే అవకాశం ఉన్నందున ‘కొండ ప్రాంతం’ ఎంచుకుంది.
- source_word: הַקֶּדֶם
  choice: తూర్పు
  rationale: קֶדֶם ఇక్కడ తూర్పు దిశ లేదా తూర్పు ప్రాంతాన్ని సూచిస్తుంది; ‘తూర్పు కొండ ప్రాంతం’ సహజమైన తెలుగు భౌగోళిక పదబంధం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే భౌగోళిక వర్ణన. ‘నివాస ప్రాంతం’ సామూహిక భూభాగ భావాన్ని, ‘కొండ ప్రాంతం’ הַר యొక్క ప్రాంతీయ భావాన్ని అందిస్తాయి; మూలంలోని భౌగోళిక వాక్యనిర్మాణ సందిగ్ధతను పాదటిప్పణిలో నిలిపింది.
