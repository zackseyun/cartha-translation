  text: וְ/יָקְטָ֣ן יָלַ֔ד אֶת אַלְמוֹדָ֖ד וְ/אֶת שָׁ֑לֶף וְ/אֶת חֲצַרְמָ֖וֶת וְ/אֶת יָֽרַח־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/026.yaml
  text: Joktan fathered Almodad[a], Sheleph, Hazarmaveth, and Jerah.
translation:
  language: te
  text: యొక్తాను అల్మోదాదు, షాలెఫ్, హసర్మావెత్, యెరహులకు తండ్రి అయ్యాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ మూలంలో అక్షరార్థంగా: “యొక్తాను అల్మోదాదుకు, మరియు షాలెఫ్‌కు, మరియు హసర్మావెత్‌కు, మరియు యెరహుకు తండ్రి అయ్యాడు.” ప్రతి పేరుకు ముందు పునరావృతమైన “మరియు”ను తెలుగులో సహజమైన జాబితా శైలిలో ఇవ్వలేదు.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָקְטָן
  choice: యొక్తాను
  rationale: వ్యక్తి పేరును అనువదించకుండా, హీబ్రూ ఉచ్చారణకు దగ్గరగా తెలుగు లిపిలో రాశాం. వాక్యారంభంలోని וְ ఈ వంశావళి కొనసాగింపును సూచిస్తుంది; తెలుగులో ప్రత్యేకంగా ‘మరియు’ అని పెట్టకపోయినా ఆ కొనసాగింపు సందర్భంలో స్పష్టంగా ఉంటుంది.
- source_word: יָלַד
  choice: తండ్రి అయ్యాడు
  rationale: వంశావళిలో ఈ క్రియ పురుషుని సంతాన సంబంధాన్ని సూచిస్తుంది. పాతకాలపు ‘కనెను’ కంటే ‘తండ్రి అయ్యాడు’ ఆధునిక పాఠకులకు సహజంగా, స్పష్టంగా ఉంటుంది; మూలంలోని వంశసంబంధ భావాన్ని నిలుపుతుంది.
- source_word: אֶת
  choice: ప్రత్యేకంగా అనువదించలేదు
  rationale: ఇది హీబ్రూలో ప్రత్యక్ష కర్మను సూచించే వ్యాకరణ చిహ్నం; తెలుగులో విభక్తి రూపం మరియు వాక్య నిర్మాణం ద్వారా దాని పని వ్యక్తమవుతుంది.
- source_word: אַלְמוֹדָד
  choice: అల్మోదాదు
  rationale: వ్యక్తి పేరును హీబ్రూ రూపానికి దగ్గరగా తెలుగు లిప్యంతరీకరణ చేశాం; తెలుగు విభక్తి కలపడానికి సహజమైన రూపాన్ని వాడాం.
- source_word: שָׁלֶף
  choice: షాలెఫ్
  rationale: మసొరెటిక్ స్వరచిహ్నాలతో ఉన్న హీబ్రూ ఉచ్చారణను అనుసరించి వ్యక్తి పేరును లిప్యంతరీకరించాం.
- source_word: חֲצַרְמָוֶת
  choice: హసర్మావెత్
  rationale: వ్యక్తి పేరును అనువదించకుండా తెలుగు లిపిలో రాశాం. హీబ్రూ ח ధ్వనికి దగ్గరైన సాధారణ తెలుగు ప్రతినిధిగా ‘హ’ను వాడాం.
- source_word: יָרַח
  choice: యెరహు
  rationale: వ్యక్తి పేరును హీబ్రూ ఆరంభ ధ్వనిని నిలుపుతూ తెలుగు లిపిలో రాశాం; విభక్తితో సహజంగా కలిసేలా ‘యెరహులకు’ అని ఇచ్చాం.
