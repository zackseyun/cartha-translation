source:
  edition: WLC
  text: וְ/אֶת עוֹבָ֥ל וְ/אֶת אֲבִֽימָאֵ֖ל וְ/אֶת שְׁבָֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/028.yaml
  text: and Obal[a], and Abimael, and Sheba.
translation:
  language: te
  text: మరియు ఓబాలును, అబీమాయేలును, షెబాను.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אֶת
  choice: -ను (ప్రతి పేరుతో)
  rationale: וְ అనుసంధానార్థకంగా ‘మరియు’ అనే భావాన్ని ఇస్తుంది; אֶת నిర్దిష్ట ప్రత్యక్ష కర్మ సూచకం. తెలుగు విభక్తి నిర్మాణంలో ప్రతి పేరుకు ‘-ను’ జోడించడం ద్వారా కర్మసంబంధం సహజంగా వ్యక్తమవుతుంది; జాబితాలోని అనుసంధానం విరామచిహ్నాలతో స్పష్టమవుతుంది.
- source_word: עוֹבָל
  choice: ఓబాలు
  rationale: వంశావళిలోని వ్యక్తినామం కాబట్టి అర్థానువాదం చేయకుండా హీబ్రూ ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించబడింది.
- source_word: אֲבִימָאֵל
  choice: అబీమాయేలు
  rationale: వ్యక్తినామంలోని అంతర్గత అర్థాన్ని అనువదించకుండా, హీబ్రూ రూపానికి దగ్గరగా తెలుగులో లిప్యంతరీకరించబడింది.
- source_word: שְׁבָא
  choice: షెబ
  rationale: ఇక్కడి హీబ్రూ పేరు שְׁבָא ను వేరే హీబ్రూ పేరైన సెబాతో కలపకుండా ‘షెబ’గా లిప్యంతరీకరించబడింది.
theological_decisions: []
translation_notes:
  register: ఆదికాండము 10లో కొనసాగుతున్న సంతాన జాబితాకు తగిన సంక్షిప్త, గౌరవప్రదమైన ఆధునిక ప్రామాణిక తెలుగు. మూలంలోని పునరుక్త וְאֶת ను తెలుగులో ప్రతి పేరుపై కర్మవిభక్తి ‘-ను’తో సహజంగా ప్రతిబింబించింది.
