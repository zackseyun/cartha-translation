  naturalness: Using accusative -ను on each item is natural in this continuing genealogical object list. Adding మరియు at the beginning appropriately carries the source conjunction while retaining a concise list style.
  terminology: ఓబాలు and అబీమాయేలు are suitable Telugu transliterations. שְׁבָא should be షెబా, not షెబ. No theological terminology is involved.
