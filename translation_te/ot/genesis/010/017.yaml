translation:
  language: te
  text: హివ్వీయులను[a], అర్కీయులను, మరియు సినీయులను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “హివ్వీయ వంశాన్ని, అర్కీయ వంశాన్ని, సినీయ వంశాన్ని.” హీబ్రూలో నిర్దేశక ఉపపదంతో కూడిన ఏకవచన జాతివాచక రూపాలు ఉన్నాయి; అవి ఇక్కడ ప్రజలను లేదా వంశాలను సమూహంగా సూచిస్తున్నాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת
  choice: -ను / మరియు (జాబితా క్రమంలో అంతర్భావం)
  rationale: వావ్ సంధి మరియు కర్మసూచకమైన אֶת ఈ జాబితాలో తదుపరి పేర్లను కలుపుతున్నాయి. తెలుగు వాక్యనిర్మాణంలో ప్రతి పేరుకు కర్మవిభక్తి చేర్చి, ముందరి వచనంతో కొనసాగే జాబితాగా సహజంగా వ్యక్తం చేయబడింది; చివరి ‘మరియు’ను తెలుగులో తప్పనిసరిగా పునరావృతం చేయలేదు.
- source_word: הַחִוִּי
  choice: హివ్వీయులను
  rationale: ఏకవచన జాతివాచక రూపం ఇక్కడ సమూహార్థంలో ఉంది. ‘హివ్వీయులు’ అనే బహువచన ప్రజానామం ఆ సమూహార్థాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: הָעַרְקִי
  choice: అర్కీయులను
  rationale: అర్కాతో సంబంధమున్న ప్రజలను సూచించే జాతివాచకం. పేరుని నిలుపుకుంటూ తెలుగు ప్రజానామ రూపంగా ‘అర్కీయులు’ వాడబడింది.
- source_word: הַסִּינִי
  choice: సీనీయులను
  rationale: సీను/సీన్‌తో సంబంధమున్న జాతి సమూహాన్ని సూచించే పేరు. మూలంలోని ప్రజానామ స్వభావాన్ని నిలుపుకునేందుకు ‘సీనీయులు’ అని అనువదించబడింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళి జాబితాకు తగిన సంక్షిప్తమైన, గంభీరమైన శైలి. ముందరి వచనంలోని క్రియకు అనుసంధానమయ్యేలా పేర్లకు కర్మవిభక్తి ఉపయోగించబడింది.
