id: GEN.10.14
reference: Genesis 10:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְֽ/אֶת פַּתְרֻסִ֞ים וְ/אֶת כַּסְלֻחִ֗ים אֲשֶׁ֨ר יָצְא֥וּ מִ/שָּׁ֛ם פְּלִשְׁתִּ֖ים וְ/אֶת כַּפְתֹּרִֽים־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/014.yaml
  text: and the Pathrusites[a], and the Casluhites (from whom the Philistines came), and the Caphtorites.
translation:
  language: te
  text: పత్రూసీయులను, కస్లుహీయులను—అక్కడి నుంచి ఫిలిష్తీయులు బయలుదేరారు[a]—కఫ్తోరీయులను కూడా.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూలభాషలో అక్షరార్థంగా, “అక్కడి నుంచి ఫిలిష్తీయులు బయలుదేరారు.” ఇది వెంటనే ముందు ప్రస్తావించిన కస్లుహీయులను సూచిస్తుందని అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּתְרֻסִים
  choice: పత్రుసీయులు
  rationale: పత్రోసుకు సంబంధించిన ప్రజాసమూహపు పేరును హీబ్రూ రూపానికి దగ్గరగా తెలుగులో లిప్యంతరీకరించాం.
- source_word: כַּסְלֻחִים
  choice: కస్లుహీయులు
  rationale: ఈ ప్రజాసమూహపు చారిత్రక గుర్తింపు అనిశ్చితమైనందున అర్థాన్ని ఊహించకుండా పేరును లిప్యంతరీకరించాం.
- source_word: אֲשֶׁר יָצְאוּ מִשָּׁם
  choice: అక్కడి నుంచే ... బయలుదేరారు
  rationale: హీబ్రూలోని ‘అక్కడి నుంచి బయలుదేరారు’ అనే స్థల/మూల సూచనను సహజమైన తెలుగులో ఉంచి, దాని పూర్వపదాన్ని ప్రధాన పాఠ్యంలో ఖచ్చితంగా నిర్ణయించలేదు.
- source_word: פְּלִשְׁתִּים
  choice: ఫిలిష్తీయులు
  rationale: తెలుగులో ప్రాచుర్యంలో ఉన్న ఈ ప్రజాసమూహపు పేరును ఉపయోగించాం.
- source_word: כַּפְתֹּרִים
  choice: కఫ్తోరీయులు
  rationale: కఫ్తోరుకు సంబంధించిన ప్రజాసమూహపు పేరుగా హీబ్రూ రూపాన్ని తెలుగులో లిప్యంతరీకరించాం.
- source_word: וְאֶת
  choice: …ను కూడా
  rationale: పునరావృతమయ్యే సంధి మరియు కర్మసూచకాన్ని పదేపదే అనువదించకుండా, వంశావళి జాబితాకు సహజమైన తెలుగు కర్మరూపాలతో చివర ‘కూడా’ను వాడాం.
theological_decisions:
- issue: ‘అక్కడి నుంచి ఫిలిష్తీయులు బయలుదేరారు’ అనే ఉపవాక్యం దేనిని సూచిస్తుంది?
  choice: ప్రధాన పాఠ్యంలో ‘అక్కడి నుంచి’ అని ఉంచి సూచనలోని అస్పష్టతను కాపాడాం.
  alternative: ‘కస్లుహీయుల నుంచే ఫిలిష్తీయులు వచ్చారు’ అని వెంటనే ముందున్న ప్రజాసమూహంతో స్పష్టంగా అనుసంధానించడం.
  rationale: హీబ్రూ వాక్యంలో ‘అక్కడి నుంచి’ అనే క్రియావిశేషణం ఉంది; అది వెంటనే ముందున్న కస్లుహీయులను సూచించే అవకాశం బలంగా ఉన్నా, ‘వారి నుంచి’ అని నేరుగా చెప్పదు. అందువల్ల మూలంలోని నిజమైన అస్పష్టతను తొలగించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళి జాబితా కొనసాగింపుకు తగిన సంక్షిప్తమైన, గౌరవప్రదమైన శైలిని వాడాం. మూలంలో ఈ వచనం ముందటి వాక్యంలోని కర్మల జాబితాను కొనసాగిస్తున్నందున కొత్త క్రియను చేర్చలేదు.
