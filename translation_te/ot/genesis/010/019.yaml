source:
  edition: WLC
  text: וַֽ/יְהִ֞י גְּב֤וּל הַֽ/כְּנַעֲנִי֙ מִ/צִּידֹ֔ן בֹּאֲ/כָ֥ה גְרָ֖רָ/ה עַד עַזָּ֑ה בֹּאֲ/כָ֞ה סְדֹ֧מָ/ה וַ/עֲמֹרָ֛ה וְ/אַדְמָ֥ה וּ/צְבֹיִ֖ם עַד לָֽשַׁע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/019.yaml
  text: And the border of the Canaanites was from Sidon[a], as you go toward Gerar, as far as Gaza; and as you go toward Sodom and Gomorrah and Admah and Zeboiim, as far as Lasha.
translation:
  language: te
  text: కనానీయుల సరిహద్దు సీదోను నుండి గెరారు వైపుగా గాజా వరకు, మరియు సొదొమ, గొమొర్రా, అద్మా, సెబోయీము వైపుగా లాషా[a] వరకు ఉండేది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘లెషా’ అని కూడా ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: ఉండేది
  rationale: కథనాన్ని కొనసాగించే וַיְהִי ఇక్కడ సరిహద్దు ఉనికిని, విస్తృతిని తెలియజేస్తుంది. తెలుగు భౌగోళిక వర్ణనలో ‘ఉండేది’ సహజంగా ఉంది.
- source_word: גְּבוּל
  choice: సరిహద్దు
  rationale: ఈ భౌగోళిక సందర్భంలో ఇది ప్రాంతపు హద్దును సూచిస్తుంది; ‘సరిహద్దు’ ఆధునిక ప్రామాణిక తెలుగులో స్పష్టమైన పదం.
- source_word: הַכְּנַעֲנִי
  choice: కనానీయుల
  rationale: హీబ్రూలో జాతివాచకం ఏకవచన రూపంలో ఉన్నా ఇక్కడ సమూహార్థకంగా కనాను సంతతివారిని సూచిస్తుంది; తెలుగులో బహువచన సంబంధరూపం సహజం.
- source_word: מִצִּידֹן
  choice: సీదోను నుండి
  rationale: מִן ప్రారంభ స్థానాన్ని సూచిస్తుంది. צִידֹן అనే స్థలనామాన్ని తెలుగు బైబిలు వాడుకకు అనుగుణంగా ‘సీదోను’గా లిప్యంతరీకరించాం.
- source_word: בֹּאֲכָה
  choice: వైపుగా
  rationale: సరిహద్దు వర్ణనలో ఈ ప్రయోగం ఒక స్థలం దిశగా వెళ్లడాన్ని లేదా విస్తరించడాన్ని సూచిస్తుంది. ‘వైపుగా’ దిశార్థాన్ని సంక్షిప్తంగా, సహజంగా నిలుపుతుంది.
- source_word: גְרָרָה
  choice: గెరారు
  rationale: దిశార్థక ה అంత్యప్రత్యయం ‘వైపుగా’లో వ్యక్తమైంది; స్థలనామాన్ని ‘గెరారు’గా లిప్యంతరీకరించాం.
- source_word: עַד
  choice: వరకు
  rationale: సరిహద్దు ఎంతదూరం విస్తరించిందో తెలిపే పరిమితిని ‘వరకు’ స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: עַזָּה
  choice: గాజా
  rationale: ప్రచలిత తెలుగు రూపమైన ‘గాజా’ను ఉపయోగించాం.
- source_word: סְדֹמָה וַעֲמֹרָה וְאַדְמָה וּצְבֹיִם
  choice: సొదొమ, గొమొర్రా, అద్మా, సెబోయీము
  rationale: సరిహద్దు దిశను గుర్తించే స్థలనామాల వరుసను తెలుగు ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించాం; హీబ్రూ సంధికారకాల భావం తెలుగు జాబితా నిర్మాణంలో నిలిచింది.
- source_word: לָשַׁע
  choice: లాషా
  rationale: మసొరేటిక్ స్వరచిహ్నాల ప్రకారం ‘లాషా’ సమీప లిప్యంతరీకరణ. ‘లెషా’ అనే ప్రత్యామ్నాయ రూపాన్ని పాదసూచికలో ఉంచాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన భౌగోళిక వర్ణనగా రూపొందించాం. మూలంలోని రెండు దిశా భాగాలను స్పష్టపరచడానికి ‘అలాగే’ చేర్చాం. పాదసూచిక గుర్తును అది సంబంధించిన ‘లాషా’ తరువాత ఉంచాం.
