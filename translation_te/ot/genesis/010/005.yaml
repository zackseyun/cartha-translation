source:
  edition: WLC
  text: מֵ֠/אֵלֶּה נִפְרְד֞וּ אִיֵּ֤י הַ/גּוֹיִם֙ בְּ/אַרְצֹתָ֔/ם אִ֖ישׁ לִ/לְשֹׁנ֑/וֹ לְ/מִשְׁפְּחֹתָ֖/ם בְּ/גוֹיֵ/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/005.yaml
  text: From these the coastlands of the nations were separated in their lands[a], each according to his language, by their clans[c][b], in their nations.
translation:
  language: te
  text: వీరి నుండి జనాంగాల తీరప్రాంతాలు[a] వారి దేశాలలో విడిపోయాయి—ప్రతి ఒక్కరు[b] తమ భాష ప్రకారం, తమ వంశాల ప్రకారం[c], తమ జనాంగాల్లో.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘జనాంగాల ద్వీపాలు.’ హీబ్రూ పదం ద్వీపాలను గానీ తీరప్రాంతాలను గానీ సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా, ‘మనిషి తన భాష ప్రకారం’; ఇది ‘ప్రతి ఒక్కరు తమ భాష ప్రకారం’ అనే పంపిణీ భావాన్ని తెలిపే ప్రయోగం.
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘తమ కుటుంబాల ప్రకారం.’ ఇక్కడ ఈ పదం విస్తృతమైన వంశ లేదా కుల సమూహాలను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵאֵלֶּה
  choice: వీరి నుండి
  rationale: מִן + אֵלֶּה మూలాన్ని సూచిస్తుంది; ముందుగా పేర్కొన్న యావెతు సంతతివారినే ‘వీరు’ సూచిస్తుంది.
- source_word: נִפְרְדוּ
  choice: విడిపోయాయి
  rationale: פרד ధాతువు నిఫాల్ రూపం విడిపోవడం లేదా వేరుపడడం అనే భావాన్ని ఇస్తుంది. కర్త భూభాగాలా ప్రజలా అన్న మూలపాఠంలోని ఉద్రిక్తతను తీర్చకుండా ఈ రూపం నిలుపుతుంది.
- source_word: אִיֵּי הַגּוֹיִם
  choice: జనాల తీరప్రాంతాలు
  rationale: אִיִּים అనే పదం ద్వీపాలనే కాక సముద్రతీర ప్రాంతాలను కూడా సూచించగలదు; నిర్మాణ సంబంధాన్ని కాపాడుతూ ప్రధాన పాఠంలో విస్తృత భౌగోళిక భావం తీసుకోబడింది.
- source_word: בְּאַרְצֹתָם
  choice: వారి వారి దేశాల్లో
  rationale: אֶרֶץ ఇక్కడ ఆయా సమూహాల భూభాగాలను సూచిస్తుంది; పునరుక్త ‘వారి వారి’ పంపిణీ భావాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: אִישׁ לִלְשֹׁנוֹ
  choice: ఒక్కొక్కరు తమ తమ భాష ప్రకారం
  rationale: అక్షరార్థంగా ‘ఒక్కొక్క మనిషి తన భాష ప్రకారం’; ఇది పంపిణీని తెలిపే హీబ్రూ ప్రయోగం. తెలుగులో ‘ఒక్కొక్కరు’ సహజంగా అదే భావాన్ని ఇస్తుంది.
- source_word: לְמִשְׁפְּחֹתָם
  choice: తమ వంశాల ప్రకారం
  rationale: מִשְׁפָּחָה ఈ వంశావళి సందర్భంలో అణుకుటుంబం కంటే విస్తృతమైన వంశ లేదా కుల సమూహాన్ని సూచిస్తుంది.
- source_word: בְּגוֹיֵהֶם
  choice: తమ తమ జనాల్లో
  rationale: גּוֹי జాతి లేదా ప్రజాసమూహాన్ని సూచిస్తుంది. ‘జనాల్లో’ అనే పదం ఆధునిక దేశరాజ్య భావాన్ని అనవసరంగా రుద్దకుండా మూలంలోని సామూహిక భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: אִיֵּי הַגּוֹיִם అనే పదబంధం భూభాగాలను సూచిస్తుందా, వాటిలోని ప్రజలను సూచిస్తుందా
  choice: ప్రధాన పాఠంలో ‘జనాల తీరప్రాంతాలు’ అని భౌగోళిక నిర్మాణాన్ని నిలుపడం
  alternative: ‘తీరప్రాంతాల ప్రజలు’ అని ప్రజలనే కర్తగా స్పష్టీకరించడం
  rationale: మూలపాఠం వ్యాకరణపరంగా ‘జనాల తీరప్రాంతాలు/ద్వీపాలు’ అని ఉంది; క్రియ మరియు తరువాతి ‘ఒక్కొక్కరు’ ప్రజల పంపిణీని సూచిస్తాయి. ఒక వైపునకు పూర్తిగా పరిష్కరించకుండా అసలు పాఠంలోని భావ ఉద్రిక్తతను నిలుపడం సముచితం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే పదజాలం వాడబడింది. ‘జనాల తీరప్రాంతాలు’ అనే కొంత అసాధారణ నిర్మాణం మూలంలోని భౌగోళిక-ప్రజాసంబంధ ద్వంద్వాన్ని ఉద్దేశపూర్వకంగా నిలుపుతుంది; డాష్ తరువాతి పంపిణీ పదబంధాలను స్పష్టంగా కలుపుతుంది.
