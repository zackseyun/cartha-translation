source:
  edition: WLC
  text: וְ/כ֖וּשׁ יָלַ֣ד אֶת נִמְרֹ֑ד ה֣וּא הֵחֵ֔ל לִֽ/הְי֥וֹת גִּבֹּ֖ר בָּ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/008.yaml
  text: And Cush fathered Nimrod[d][c][b][a]; he began to be a mighty man on the earth.
translation:
  language: te
  text: కూషు నిమ్రోదుకు తండ్రి అయ్యాడు. అతడు భూమిపై[a] పరాక్రమవంతుడిగా[b] ఉండడం మొదలుపెట్టాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దేశంలో.” హీబ్రూ పదం ‘భూమి’ లేదా ‘దేశం’ అనే రెండు అర్థాలనూ ఇవ్వగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “బలవంతుడు,” “వీరుడు,” లేదా “యోధుడు.” ఇక్కడి హీబ్రూ పదానికి ఈ విస్తృత భావాలు ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכּוּשׁ
  choice: కూషు
  rationale: వంశావళిని కొనసాగించే సాధారణ సంధికారకమైన וְను తెలుగులో కొత్త వాక్యారంభంలో ప్రత్యేకంగా అనువదించకుండా, కూషు అనే వ్యక్తి పేరును ప్రామాణిక రూపంలో ఉంచాం.
- source_word: יָלַד
  choice: నిమ్రోదుకు తండ్రి అయ్యాడు
  rationale: వంశావళి సందర్భంలో ఈ క్రియ పురుషుని ద్వారా సంతానం కలగడాన్ని సూచిస్తుంది. ‘కన్నాడు’ కంటే ఈ రూపం ఆధునిక తెలుగులో సహజంగా, స్పష్టంగా ఉంది.
- source_word: נִמְרֹד
  choice: నిమ్రోదు
  rationale: హీబ్రూ వ్యక్తి పేరుకు అనుగుణమైన తెలుగు లిప్యంతరీకరణ.
- source_word: הוּא הֵחֵל לִהְיוֹת
  choice: అతడు ... కావడం మొదలుపెట్టాడు
  rationale: హీబ్రూ వాక్యంలోని ‘అతడు’ అనే పునరుద్ఘాటనను, ‘కావడం మొదలుపెట్టాడు’ అనే ఆరంభ భావాన్ని నేరుగా నిలిపాం; ‘మొదటివాడయ్యాడు’ అనే పాఠ్యంలో స్పష్టంగా లేని ప్రాధాన్య భావాన్ని చేర్చలేదు.
- source_word: גִּבֹּר
  choice: పరాక్రమవంతుడు
  rationale: ఈ పదం బలవంతుడు, వీరుడు, యోధుడు వంటి విస్తృత భావాలను కలిగి ఉంది. ‘పరాక్రమవంతుడు’ ఆ విస్తృతిని ఉంచుతూ కేవలం సైనిక భావానికే పరిమితం చేయదు.
- source_word: בָּאָרֶץ
  choice: భూమిపై
  rationale: ఆదికాండము 10లోని జనాంగాల విస్తృత సందర్భంలో אֶרֶץకు ‘భూమి’ అనే భావం అనుకూలం; בְּను ఈ సందర్భంలో సహజమైన తెలుగు ప్రయోగమైన ‘పై’తో వ్యక్తపరచాం.
theological_decisions:
- issue: הֵחֵל לִהְיוֹת యొక్క భావం
  choice: కావడం మొదలుపెట్టాడు
  alternative: మొదటివాడిగా అయ్యాడు
  rationale: హీబ్రూ నిర్మాణం నేరుగా ఆరంభాన్ని సూచిస్తుంది. నిమ్రోదు చరిత్రలో అటువంటి మొదటి వ్యక్తి అనే భావం సాధ్యమైన వ్యాఖ్యానమే అయినా, దాన్ని ప్రధాన పాఠ్యంలో నిర్ధారించలేదు.
- issue: אֶרֶץ యొక్క పరిధి
  choice: భూమి
  alternative: దేశం / నేల
  rationale: జనాంగాల పట్టిక సందర్భం విశాలమైన భౌగోళిక పరిధిని సూచిస్తుంది. అయినా మూలపదానికి స్థానిక ‘దేశం’ అనే అర్థం కూడా సాధ్యమని పాదసూచికలో ఉంచాం.
- issue: גִּבֹּר యొక్క స్వభావం
  choice: పరాక్రమవంతుడు
  alternative: బలవంతుడు / వీరుడు / యోధుడు
  rationale: నిమ్రోదు శక్తి స్వరూపాన్ని ఈ వచనం మాత్రమే ఖచ్చితంగా సైనికమైనదిగా నిర్వచించదు. అందువల్ల విస్తృతమైన పదాన్ని ప్రధాన పాఠ్యంలో ఎంచుకుని ప్రత్యామ్నాయాలను పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడాం. వంశావళి భావాన్ని స్పష్టంగా చెప్పడానికి ‘తండ్రి అయ్యాడు’ అని, పాతకాలపు లేదా అసహజంగా వినిపించే ‘కనెను/కన్నాడు’ రూపాలకు బదులుగా ఎంచాం. మూలంలోని అర్థసందిగ్ధతలను పాదసూచికల్లో నిలిపాం.
