  terminology: ‘మూలపురుషుడు’ వంశావళి సందర్భంలోని אָב యొక్క విస్తృత పూర్విక/వంశస్థాపక భావాన్ని సముచితంగా ఇస్తుంది; ‘కుమారులందరు’ మూలపాఠంలోని בְּנֵי ను అనవసరంగా విస్తరించదు. పేర్ల లిప్యంతరీకరణలు స్థిరంగా ఉన్నాయి. పాదటిప్పణి הַגָּדוֹל యొక్క నిజమైన అనుసంధాన-సందిగ్ధతను కాపాడుతుంది.
