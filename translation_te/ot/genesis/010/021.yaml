  source_fidelity: 'హీబ్రూ వాక్యంలోని వంశావళి భావం సరిగ్గా ప్రతిఫలించింది: షేముకు కూడా సంతానం కలిగింది; అతడు ఏబెరు కుమారులందరికీ మూలపురుషుడు; మరియు ప్రధాన పాఠ్యం הַגָּדוֹל ను షేముతో అనుసంధానించి యాపెతుకు అన్నగా అర్థం చేసుకుంది. గַּם הוּא యొక్క సంకలన బలం ‘కూడా’ ద్వారా నిలిచింది.'
