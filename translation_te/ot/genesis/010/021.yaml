  yaml_path: translation/ot/genesis/010/021.yaml
  text: And to Shem also[a], the father of all the sons of Eber, the brother of Japheth the elder, children were born.
translation:
  language: te
  text: షేముకు కూడా సంతానం కలిగింది. అతడు ఏబెరు కుమారులందరికీ మూలపురుషుడు, యాపెతుకు అన్న.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పెద్దవాడైన యాపెతుకు సోదరుడు.” హీబ్రూ పదానికి “పెద్దవాడు/వయసులో పెద్దవాడు” అనే అర్థం ఉంది; అది షేమును గానీ యాపెతును గానీ సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: וּלְשֵׁם ... יֻלַּד
  choice: షేముకు ... సంతానం కలిగింది
  rationale: హీబ్రూ నిష్క్రియ ఏకవచన క్రియ వంశావళి సందర్భంలో పుట్టిన సంతానాన్ని సమష్టిగా సూచిస్తుంది. ఆధునిక తెలుగులో ‘సంతానం కలిగింది’ సహజంగా ఉండి భావాన్ని కాపాడుతుంది.
- source_word: גַּם הוּא
  choice: కూడా
  rationale: షేముకు సైతం సంతానం కలిగిందనే సంకలన భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אֲבִי כָּל־בְּנֵי־עֵבֶר
  choice: ఏబెరు కుమారులందరికీ మూలపురుషుడు
  rationale: వంశావళి సందర్భంలో אָב ప్రత్యక్ష తండ్రికన్నా పూర్వికుడు లేదా వంశమూలపురుషుడు అనే విస్తృత భావాన్ని కలిగి ఉంది. ‘కుమారులు’ అనే మూలరూపాన్ని నిలుపుతూ సంబంధాన్ని స్పష్టం చేస్తుంది.
- source_word: אֲחִי יֶפֶת הַגָּדוֹל
  choice: యాపెతుకు అన్న
  rationale: הַגָּדוֹל ను షేముతో అనుసంధానించి, బంధుత్వ సందర్భంలోని వయోపెద్ద భావాన్ని ‘అన్న’గా సహజంగా తెలిపింది; అయితే హీబ్రూలో అది యాపెతును విశేషించే అవకాశమూ ఉంది కాబట్టి పాదటిప్పణిలో ఉంచబడింది.
theological_decisions:
- issue: הַגָּדוֹל అనే విశేషణం షేమును సూచిస్తుందా, యాపెతును సూచిస్తుందా?
  choice: 'షేమును సూచించినట్లు: ‘యాపెతుకు అన్న’'
  alternative: 'యాపెతును సూచించినట్లు: ‘పెద్దవాడైన యాపెతుకు సోదరుడు’'
  rationale: హీబ్రూ వాక్యనిర్మాణం రెండు అనుసంధానాలకూ అవకాశం ఇస్తుంది. ప్రధాన పాఠ్యంలో ఒక సాధ్యమైన పఠనాన్ని ఎంచుకొని, నిజమైన సందిగ్ధతను పాదటిప్పణిలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వంశావళి శైలి. పొడవైన హీబ్రూ వాక్యాన్ని రెండు తెలుగు వాక్యాలుగా విభజించి స్పష్టత పెంచాం; మూలంలోని పేర్లు మరియు నిజమైన వాక్యనిర్మాణ సందిగ్ధతను నిలిపాం.
