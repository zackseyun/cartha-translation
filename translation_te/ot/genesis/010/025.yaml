id: GEN.10.25
reference: Genesis 10:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/לְ/עֵ֥בֶר יֻלַּ֖ד שְׁנֵ֣י בָנִ֑ים שֵׁ֣ם הָֽ/אֶחָ֞ד פֶּ֗לֶג כִּ֤י בְ/יָמָי/ו֙ נִפְלְגָ֣ה הָ/אָ֔רֶץ וְ/שֵׁ֥ם אָחִ֖י/ו יָקְטָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/025.yaml
  text: 'And to Eber two sons were born: the name of the one was Peleg[a], for in his days the earth was divided, and his brother''s name was Joktan.'
translation:
  language: te
  text: ఏబెరుకు ఇద్దరు కుమారులు పుట్టారు. వారిలో ఒకరి పేరు పెలెగు; ఎందుకంటే అతని కాలంలో భూమి[a] విభజించబడింది. అతని సోదరుని పేరు యొక్తాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దేశం విభజించబడింది.” హెబ్రీ పదానికి “భూమి” లేదా “దేశం” అనే అర్థం రావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/עֵבֶר
  choice: ఏబెరుకు
  rationale: సంయోజక అవ్యయంతో వచ్చే వంశావళి కొనసాగింపును తెలుగులో సహజమైన వాక్యప్రవాహం ద్వారా చూపిస్తూ, לְ అనే సంబంధార్థాన్ని ‘ఏబెరుకు’గా నిలిపింది.
- source_word: יֻלַּד שְׁנֵי בָנִים
  choice: ఇద్దరు కుమారులు పుట్టారు
  rationale: ילד యొక్క నిఫ్అల్ కర్మణి భావాన్ని ‘పుట్టారు’గా, పురుషులైన ఇద్దరిని సూచించే שְׁנֵי בָנִיםను సహజమైన తెలుగులో ‘ఇద్దరు కుమారులు’గా అనువదించింది.
- source_word: שֵׁם הָאֶחָד
  choice: ఒకని పేరు
  rationale: ‘ఒకని పేరు’ అనే హెబ్రీ నిర్మాణాన్ని ‘మొదటివాని’ అని సంఖ్యాక్రమాన్ని చేర్చకుండా సంక్షిప్తంగా నిలిపింది.
- source_word: פֶּלֶג
  choice: పెలెగు
  rationale: వ్యక్తి పేరును ఆధునిక ప్రామాణిక తెలుగు ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించింది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: పేరు వెనుకనున్న వివరణాత్మక కారణాన్ని ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: בְיָמָיו
  choice: అతని కాలంలో
  rationale: అక్షరార్థమైన ‘అతని దినాల్లో’ కంటే సహజంగా ఉండి, పెలెగు జీవించిన కాలాన్ని సూచిస్తుంది.
- source_word: נִפְלְגָה
  choice: విభజించబడింది
  rationale: నిఫ్అల్ రూపంలోని కర్మణి భావాన్ని నేరుగా నిలుపుతుంది; విభజన ఎలా జరిగిందో అదనంగా నిర్ధారించదు.
- source_word: הָאָרֶץ
  choice: భూమి
  rationale: ఆదికాండము 10లోని జనాల విస్తృత సందర్భానికి ‘భూమి’ సరిపోతుంది; ‘దేశం/నేల’ అనే సాధ్యార్థాన్ని పాదసూచికలో ఉంచింది.
- source_word: וְשֵׁם אָחִיו
  choice: అతని సహోదరుని పేరు
  rationale: పెలెగుతో ఉన్న సోదర సంబంధాన్ని స్పష్టంగా, గౌరవప్రదమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: יָקְטָן
  choice: యొక్తాను
  rationale: వ్యక్తి పేరును తెలుగు బైబిలు నామరూప సంప్రదాయానికి అనుగుణంగా లిప్యంతరీకరించింది.
theological_decisions:
- issue: పెలెగు పేరు వివరణలో הָאָרֶץ యొక్క పరిధి
  choice: భూమి
  alternative: దేశం లేదా నేల
  rationale: జనాల వంశావళి అనే విస్తృత సందర్భంలో ‘భూమి’ ప్రధాన పఠనంగా సముచితం. అయితే హెబ్రీ אֶרֶץ మొత్తం భూమినిగానీ ఒక ప్రాంతం/దేశాన్నిగానీ సూచించగలదు కాబట్టి ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలిపింది; విభజన యొక్క చారిత్రక స్వరూపాన్ని అనువాదం నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; వంశావళి శైలికి తగిన సంక్షిప్త, గౌరవప్రదమైన వాక్యనిర్మాణం. మూలంలోని కర్మణి రూపం, పేర్లు, మరియు אֶרֶץ పదంలోని నిజమైన అర్థసందిగ్ధత నిలుపబడ్డాయి.
