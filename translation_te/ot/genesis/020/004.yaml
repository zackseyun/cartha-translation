  edition: WLC
  text: וַ/אֲבִימֶ֕לֶךְ לֹ֥א קָרַ֖ב אֵלֶ֑י/הָ וַ/יֹּאמַ֕ר אֲדֹנָ֕/י הֲ/ג֥וֹי גַּם צַדִּ֖יק תַּהֲרֹֽג־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/004.yaml
  text: Abimelech had not come near her[a], so he said, “Lord[b], will you kill even a righteous nation?”
translation:
  language: te
  text: అబీమెలెకు ఆమె దగ్గరకు వెళ్లలేదు[a]. అతడు, “ప్రభువా, నీతిమంతమైన జనాన్ని[b] కూడా చంపుతావా?” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ఆమె దగ్గరకు వెళ్లలేదు’ అనేది ఈ సందర్భంలో అబీమెలెకు శారాతో లైంగిక సంబంధం పెట్టుకోలేదని సూచించే హీబ్రూ నుడికారం.
    reason: cultural_note
  - marker: b
    text: ‘జనం’ అని అనువదించిన హీబ్రూ పదం ఒక ప్రజాసమూహాన్ని లేదా దేశప్రజలను సమష్టిగా సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרַב אֵלֶיהָ
  choice: ఆమెను సమీపించలేదు
  rationale: హీబ్రూ పదబంధంలోని ‘ఆమె దగ్గరకు రాలేదు’ అనే రూపాన్ని సహజమైన తెలుగులో నిలుపుతూ, ఈ సందర్భంలో సూచితమైన లైంగిక సంబంధం అర్థాన్ని పాదటిప్పణిలో వివరిస్తుంది.
- source_word: אֲדֹנָי
  choice: ప్రభువా
  rationale: కలలో దేవుణ్ణి నేరుగా సంబోధించే గౌరవసూచక బిరుదుకు సహజమైన తెలుగు సంబోధన.
- source_word: גּוֹי
  choice: జనం
  rationale: ఒక సమూహం లేదా దేశప్రజలను సమష్టిగా సూచించే హీబ్రూ పదం. ‘జనం’ అనే రూపం నిర్దిష్ట ఆధునిక రాజ్యాన్ని సూచించకుండా సమష్టి భావాన్ని నిలుపుతుంది.
- source_word: גַּם
  choice: కూడా
  rationale: అబీమెలెకు అడిగిన ప్రశ్నలోని నొక్కిచెప్పే భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: צַדִּיק
  choice: నీతిగల
  rationale: ‘నీతిమంతమైన’ లేదా ఈ విషయంలో ‘నిర్దోషమైన’ అనే భావాలకు వీలిస్తూ, విస్తృత బైబిలు పదప్రయోగంతో సంబంధాన్ని నిలుపుతుంది.
- source_word: תַּהֲרֹג
  choice: చంపుతావా?
  rationale: హీబ్రూ అసంపూర్ణ క్రియారూపంతో ఉన్న ప్రత్యక్ష అలంకార ప్రశ్నను ఆధునిక తెలుగులో సూటిగా వ్యక్తం చేస్తుంది.
- source_word: וַאֲבִימֶלֶךְ ... וַיֹּאמַר
  choice: అబీమెలెకు ... అతడు ... అన్నాడు
  rationale: మూలంలో లేని స్పష్టమైన కాలసూచక పదాన్ని చేర్చకుండా కథన క్రమాన్ని సరళమైన తెలుగు వాక్యాలతో తెలియజేస్తుంది.
theological_decisions:
- issue: అబీమెలెకు విన్నపంలో ‘జనం’ అనే పదం యొక్క సమష్టి పరిధి
  choice: గּוֹי అనే సమష్టి పదాన్ని ‘జనం’గా అనువదించి, దాన్ని అబీమెలెకు ఒక్కడికే పరిమితం చేయలేదు.
  alternative: దేశం; ప్రజలు; ఇంటివారు
  rationale: హీబ్రూ పదం ఒక ప్రజాసమూహాన్ని సమష్టిగా సూచిస్తుంది. సందర్భంలో తీర్పు రాజు ఒక్కడికంటే ఎక్కువమందికి సంబంధించినదిగా ఉన్నప్పటికీ, ఆ సమూహం యొక్క ఖచ్చితమైన రాజకీయ లేదా కుటుంబ పరిధిని మూలవాక్యం నిర్ధారించదు.
- issue: צַדִּיק పదంలోని నీతి మరియు నిర్దోషిత్వ భావాలు
  choice: ‘నీతిగల’ అని అనువదించి విస్తృత నైతిక భావాన్ని నిలిపింది.
  alternative: నిర్దోషమైన
  rationale: ఈ సందర్భంలో అబీమెలెకు తన ప్రజలు ఈ విషయంలో నిర్దోషులని వాదిస్తున్నప్పటికీ, హీబ్రూ పదానికి ఉన్న విస్తృతమైన ‘నీతిగల’ భావాన్ని పూర్తిగా ‘నిర్దోషమైన’గా కుదించకుండా ఉద్రిక్తతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. మూలంలోని అలంకార ప్రశ్న, సమష్టి భావం, అలాగే ‘నీతిగల’ అనే పదంలోని నైతికత/నిర్దోషిత్వ ఉద్రిక్తత నిలుపబడ్డాయి. పాదటిప్పణి గుర్తులు వాటికి సంబంధించిన పదబంధాల వద్ద ఉంచబడ్డాయి.
