source:
  edition: WLC
  text: הֲ/לֹ֨א ה֤וּא אָֽמַר לִ/י֙ אֲחֹ֣תִ/י הִ֔וא וְ/הִֽיא גַם הִ֥וא אָֽמְרָ֖ה אָחִ֣/י ה֑וּא בְּ/תָם לְבָבִ֛/י וּ/בְ/נִקְיֹ֥ן כַּפַּ֖/י עָשִׂ֥יתִי זֹֽאת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/005.yaml
  text: Did he not himself say to me[a], ‘She is my sister’? And she herself also said, ‘He is my brother.’ In the integrity of my heart and the innocence of my hands I have done this.
translation:
  language: te
  text: “అతడే నాతో, ‘ఆమె నా సహోదరి’ అని చెప్పలేదా? ఆమె స్వయంగా కూడా, ‘అతడు నా సహోదరుడు’ అని చెప్పింది. నా హృదయపు యథార్థతతో, నా చేతుల నిర్దోషిత్వంతో నేను ఇది చేశాను.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యథార్థ హృదయంతో, శుభ్రమైన చేతులతో.” హీబ్రూలో ఇవి నిజాయితీని, నిర్దోషిత్వాన్ని తెలిపే నైతిక-న్యాయ నుడికారాలు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא הוּא אָמַר לִי
  choice: అతడే నాతో ... అని చెప్పలేదా?
  rationale: הֲלֹא సమ్మతిని ఆశించే ప్రశ్నను సూచిస్తుంది; స్వతంత్ర సర్వనామమైన הוּא ఇచ్చే ఉద్ఘాటనను ‘అతడే’ నిలుపుతుంది.
- source_word: אֲחֹתִי הִוא
  choice: ఆమె నా సహోదరి
  rationale: బంధుత్వ ప్రకటనను అదనపు భావం చేర్చకుండా నేరుగా అనువదిస్తుంది.
- source_word: וְהִיא גַם הִוא אָמְרָה
  choice: ఆమె కూడా స్వయంగా ... అని చెప్పింది
  rationale: גַם లోని ‘కూడా’ భావాన్నీ, స్వతంత్ర సర్వనామం ఇచ్చే ఉద్ఘాటననూ సహజమైన తెలుగులో కాపాడుతుంది.
- source_word: אָחִי הוּא
  choice: అతడు నా సహోదరుడు
  rationale: హీబ్రూ బంధుత్వ ప్రకటనకు నేరమైన, గౌరవప్రదమైన ఆధునిక తెలుగు రూపం.
- source_word: בְּתָם לְבָבִי
  choice: నా హృదయ యథార్థతతో
  rationale: תָם ఇక్కడ సంపూర్ణ పాపరాహిత్యాన్ని కాక, ఈ చర్యలోని నిజాయితీ లేదా నైతిక సమగ్రతను సూచిస్తుంది; ‘యథార్థత’ ఆ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: וּבְנִקְיֹן כַּפַּי
  choice: నా చేతుల నిర్దోషిత్వంతో
  rationale: చేతులు చర్యలకు సంకేతంగా ఉండే హీబ్రూ నైతిక-న్యాయ రూపకాన్ని నిలుపుతూ, נִקְיֹן లోని నిర్దోషిత్వ భావాన్ని స్పష్టం చేస్తుంది.
- source_word: עָשִׂיתִי זֹאת
  choice: నేను ఇది చేశాను
  rationale: సందర్భంలోని అబీమెలెకు స్వీయసమర్థనకు సరిపోయే సరళ భూతకాల రూపం.
theological_decisions:
- issue: అబీమెలెకు స్వీయసమర్థనలోని నైతిక-న్యాయ నుడికారం
  choice: ‘నా హృదయ యథార్థతతో, నా చేతుల నిర్దోషిత్వంతో’ అని అనువదించి, ఈ నిర్దిష్ట చర్య విషయంలో అతని నిజాయితీ మరియు నిర్దోషిత్వ వాదనగా ఉంచడం.
  alternative: ‘నిర్దోష హృదయంతో, శుభ్రమైన చేతులతో’ అని మరింత పదశః అనువదించడం.
  rationale: వాక్యం అబీమెలెకు సంపూర్ణంగా పాపరహితుడని బోధించడం లేదు; ఈ ఘటనలో తన ఉద్దేశం మరియు చర్య నిర్దోషమని అతడు వాదిస్తున్నాడు. హీబ్రూ రూపకాన్నీ దాని పరిమిత సందర్భాన్నీ అనువాదం కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలి. ‘సహోదరి/సహోదరుడు’ మూలంలోని బంధుత్వ పదాలకు స్పష్టమైన రూపాలు; ‘హృదయ యథార్థత’ మరియు ‘చేతుల నిర్దోషిత్వం’ మూల రూపకాన్నీ న్యాయపరమైన స్వీయసమర్థన ధోరణినీ కాపాడుతాయి.
