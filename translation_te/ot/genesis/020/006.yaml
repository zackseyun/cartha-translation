source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ אֵלָ֨י/ו הָֽ/אֱלֹהִ֜ים בַּ/חֲלֹ֗ם גַּ֣ם אָנֹכִ֤י יָדַ֨עְתִּי֙ כִּ֤י בְ/תָם לְבָבְ/ךָ֙ עָשִׂ֣יתָ זֹּ֔את וָ/אֶחְשֹׂ֧ךְ גַּם אָנֹכִ֛י אֽוֹתְ/ךָ֖ מֵ/חֲטוֹ לִ֑/י עַל כֵּ֥ן לֹא נְתַתִּ֖י/ךָ לִ/נְגֹּ֥עַ אֵלֶֽי/הָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/006.yaml
  text: Then God said to him in the dream[a], “Yes, I know that you did this in the integrity of your heart, and I also kept you from sinning against me[b]. Therefore I did not let you touch her.”
translation:
  language: te
  text: 'అప్పుడు దేవుడు ఆ కలలో[a] అతనితో ఇలా అన్నాడు: “అవును, నీవు హృదయ యథార్థతతో ఇలా చేశావని నాకు తెలుసు. నీవు నాకు విరోధంగా పాపం చేయకుండా నేను కూడా నిన్ను అడ్డుకున్నాను. అందుకే నేను నిన్ను ఆమెను తాకనివ్వలేదు[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఒక కలలో.” హీబ్రూ రూపాన్ని అనిర్దిష్టంగా కూడా అర్థం చేసుకోవచ్చు; అయితే ఇక్కడి నిర్దిష్ట రూపం ఈ సందర్భంలోని ప్రత్యేకమైన కలను సూచించడానికి అనుకూలంగా ఉంది.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ “తాకడం” అనేది లైంగిక సంబంధాన్ని సూచించే నిగూఢమైన వ్యక్తీకరణ.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחֲלֹום
  choice: ఆ కలలో
  rationale: నిర్దిష్ట సూచన కలిగిన హీబ్రూ రూపం, కథనంలో ఇప్పటికే కొనసాగుతున్న ప్రత్యేకమైన కలను సూచిస్తుంది.
- source_word: גַּם אָנֹכִי יָדַעְתִּי
  choice: అవును, ... నాకు తెలుసు
  rationale: మొదటి గַּם אָנֹכִי దేవుని మాటలోని ధృవీకరణను, ఉద్ఘాటనను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בְתָם לְבָבְךָ
  choice: యథార్థ హృదయంతో
  rationale: תֹּם లోని నిష్కపటత, సమగ్రత, యథార్థత భావాన్ని న్యాయపరమైన సంపూర్ణ నిర్దోషిత్వంగా అతిశయింపకుండా తెలియజేస్తుంది.
- source_word: וָאֶחְשֹׂךְ גַּם אָנֹכִי אוֹתְךָ
  choice: నేనే నిన్ను అడ్డుకున్నాను
  rationale: చర్య జరగకుండా దేవుడు నిలువరించాడనే חָשַׂךְ భావాన్ని, రెండవ אָנֹכִי యొక్క ఉద్ఘాటనతో సహా స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: מֵחֲטוֹ לִי
  choice: నాకు విరోధంగా పాపం చేయకుండా
  rationale: מן తో ఉన్న క్రియారూపం నిరోధాన్ని సూచిస్తుంది; לִי ఈ కార్యం దేవునికి విరోధమైన పాపమని తెలియజేస్తుంది.
- source_word: עַל כֵּן
  choice: అందుకే
  rationale: ముందు చెప్పిన దేవుని నిరోధానికి ఫలితాన్ని సహజంగా అనుసంధానిస్తుంది.
- source_word: לֹא נְתַתִּיךָ לִנְגֹּעַ אֵלֶיהָ
  choice: ఆమెను తాకనివ్వలేదు
  rationale: נָתַן తో కూడిన infinitive అనుమతించడాన్ని సూచిస్తుంది; ‘తాకడం’ మూలంలోని మర్యాదాపూర్వక, నిగూఢ వ్యక్తీకరణను కాపాడుతుంది.
theological_decisions:
- issue: ‘నాకు విరోధంగా పాపం చేయడం’ అనే దైవవాక్య భావం
  choice: ఆలోచిత కార్యం దేవునికి విరోధమైన పాపంగా వర్ణించబడింది.
  alternative: దేవుని సాధారణంగా నొప్పించడం లేదా ఆయన ఎదుట అపరాధిగా నిలవడం.
  rationale: హీబ్రూ לִי దేవునినే పాపానికి వ్యతిరేక పక్షంగా చూపుతుంది; ఇది శారా లేదా అబ్రాహాముపట్ల ఉండే అపరాధాన్ని నిరాకరించకుండా మూలపాఠంలోని దైవసంబంధ నైతిక భావాన్ని నిలుపుతుంది.
- issue: అబీమెలెకు హృదయ యథార్థత మరియు దేవుని నిరోధం మధ్య ఉద్రిక్తత
  choice: అతని ఉద్దేశంలోని యథార్థతను అంగీకరిస్తూనే, పాపకార్యం జరగకపోవడానికి దేవుని నిరోధమే కారణమని రెండింటినీ నిలుపుతుంది.
  alternative: అతని యథార్థతను సంపూర్ణ నిర్దోషిత్వంగా తీసుకోవడం లేదా దేవుని నిరోధాన్ని కేవలం హెచ్చరికగా పరిమితం చేయడం.
  rationale: వచనం మానవ ఉద్దేశాన్ని మరియు దైవిక నిరోధాన్ని పక్కపక్కనే ఉంచుతుంది; వాటి సంబంధాన్ని అదనపు సిద్ధాంతంతో పరిష్కరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు స్పష్టమైన శైలి. ‘యథార్థ హృదయం’ మూలంలోని నైతిక సమగ్రతను అతిశయింపకుండా అందిస్తుంది; ‘తాకడం’ మూలపాఠపు సంయమనభరిత భాషను కాపాడుతుంది. ప్రతి పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో చేర్చబడింది.
