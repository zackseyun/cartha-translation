source:
  edition: WLC
  text: וַ/יָּבֹ֧א אֱלֹהִ֛ים אֶל אֲבִימֶ֖לֶךְ בַּ/חֲל֣וֹם הַ/לָּ֑יְלָה וַ/יֹּ֣אמֶר ל֗/וֹ הִנְּ/ךָ֥ מֵת֙ עַל הָ/אִשָּׁ֣ה אֲשֶׁר לָקַ֔חְתָּ וְ/הִ֖וא בְּעֻ֥לַת בָּֽעַל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/003.yaml
  text: But God came to Abimelech in a dream by night and said to him[a], “Behold, you are a dead man because of the woman whom you have taken[c][b], for she is married.”
translation:
  language: te
  text: అయితే దేవుడు రాత్రి కలలో అబీమెలెకు దగ్గరకు వచ్చి అతనితో, “ఇదిగో, నీవు తీసుకున్న ఆ స్త్రీ కారణంగా నీవు చావడం ఖాయం[a]. ఆమెకు భర్త ఉన్నాడు[b]” అని చెప్పాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత పదశః: “నీవు చనిపోయినవాడివి.” ఈ హీబ్రూ మాట నిశ్చితమైన, ఆసన్నమైన మరణాన్ని సూచిస్తుంది; “నీవు చనిపోతావు” అని కూడా అర్థం చేసుకోవచ్చు.'
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ పదబంధం పదశః, “భర్తగలది”; అంటే ఆమెకు ఇప్పటికే భర్త ఉన్నాడు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא אֱלֹהִים אֶל אֲבִימֶלֶךְ
  choice: దేవుడు అబీమెలెకు దగ్గరకు వచ్చి
  rationale: בוא אל అనే ప్రయోగాన్ని కలలో జరిగిన దైవిక సమీపింపుగా సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; భౌతికంగా ఒక స్థలంలోకి ప్రవేశించాడనే అదనపు భావాన్ని చేర్చదు.
- source_word: בַּחֲלוֹם הַלָּיְלָה
  choice: రాత్రి కలలో
  rationale: రాత్రివేళ కలలో జరిగిన ప్రకటన అనే హీబ్రూ భావాన్ని సంక్షిప్తంగా, సహజంగా నిలుపుతుంది.
- source_word: הִנְּךָ מֵת
  choice: ఇదిగో, ... నీవు చావడం ఖాయం
  rationale: הִנְּךָ యొక్క హెచ్చరికాత్మక బలాన్ని ‘ఇదిగో’ నిలుపుతుంది. מֵת ఇక్కడ నిశ్చితమైన, సమీపిస్తున్న మరణాన్ని సూచిస్తుంది; తెలుగులో ‘చావడం ఖాయం’ ఆ బలాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: עַל הָאִשָּׁה אֲשֶׁר לָקַחְתָּ
  choice: నీవు తీసుకున్న ఆ స్త్రీ కారణంగా
  rationale: עַל ను కారణార్థకంగా అనువదించి, לקח లో స్పష్టంగా లేని బలవంతం లేదా లైంగిక సంబంధం వంటి భావాలను చేర్చకుండా ‘తీసుకున్న’ అని ఉంచుతుంది.
- source_word: בְּעֻלַת בָּעַל
  choice: ఆమెకు భర్త ఉన్నాడు
  rationale: ఈ హీబ్రూ ప్రయోగం ఆమె ఇప్పటికే ఒక భర్తతో వివాహబంధంలో ఉందని సూచిస్తుంది. పదశః నిర్మాణం తెలుగులో అసహజంగా ఉండటంతో సంబంధసత్యాన్ని స్పష్టంగా, సహజంగా వ్యక్తం చేసింది.
theological_decisions:
- issue: הִנְּךָ מֵת లో మరణ తీర్పు యొక్క కాలం మరియు నిశ్చితత్వం
  choice: నీవు చావడం ఖాయం
  alternative: నీవు చనిపోయినవాడివి / నీవు చనిపోతావు
  rationale: హీబ్రూ నిర్మాణం వర్తమాన స్థితి రూపంలో నిశ్చితమైన, ఆసన్నమైన మరణాన్ని ప్రకటిస్తుంది. ప్రధాన పాఠం దాని హెచ్చరిక బలాన్ని తెలుగులో సహజంగా ఇస్తూ, వర్తమాన-భవిష్యత్ మధ్యనున్న భావ ఉద్రిక్తతను పాదటిప్పణిలో నిలుపుతుంది.
- issue: בְּעֻלַת בָּעַל సూచించే వివాహ స్థితి
  choice: ఆమెకు భర్త ఉన్నాడు
  alternative: 'ఆమె వివాహిత / పదశః: ఆమె భర్తకు చెందినది'
  rationale: ఆమెకు ఇప్పటికే భర్త ఉన్నాడనే మూలపాఠంలోని వివాహబంధాన్ని స్పష్టంగా తెలియజేస్తుంది; స్త్రీని ఆస్తిగా పరిగణించే భావాన్ని అనువాదమే అదనంగా బలపరచదు. పదశః రూపాన్ని పాదటిప్పణిలో అందిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కథనశైలి వాడబడింది. ‘అబీమెలెకు’ అనే రూపం విభక్తి సందర్భంలోనూ పేరును స్పష్టంగా ఉంచుతుంది. ‘అయితే’ ముందరి చర్యకు విరుద్ధంగా దేవుని జోక్యాన్ని సూచిస్తుంది. పాదటిప్పణి గుర్తులు [a], [b] రెండూ ప్రధాన పాఠంలో ఉన్నాయి.
