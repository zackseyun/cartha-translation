  text: וַ/יֹּ֥אמֶר אֲבִימֶ֖לֶךְ אֶל אַבְרָהָ֑ם מָ֣ה רָאִ֔יתָ כִּ֥י עָשִׂ֖יתָ אֶת הַ/דָּבָ֥ר הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/010.yaml
  text: Then Abimelech said to Abraham[a], “What did you see, that you did this thing?”
translation:
  language: te
  text: 'అప్పుడు అబీమెలెకు అబ్రాహాముతో ఇలా అన్నాడు: “నీవు ఏమి చూసి ఈ పని చేశావు?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీవు ఏమి ఉద్దేశించి ఈ పని చేశావు?” హీబ్రూలో అక్షరార్థంగా, “నీవు ఏమి చూశావు...?” అని ఉంది. ఇక్కడ ‘చూడు’ అనే మాట ఒకరు గ్రహించినదాన్ని లేదా మనసులో ఉంచుకున్నదాన్ని సూచించే నానుడిగా వాడబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... అడిగాడు
  rationale: వావ్-క్రమరూపం కథనాన్ని ముందుకు నడిపిస్తుంది. సందర్భంలో మాట ప్రశ్న కావడం వల్ల సహజమైన తెలుగులో ‘అడిగాడు’ అని ఇచ్చాం.
- source_word: אֲבִימֶלֶךְ
  choice: అబీమెలెకు
  rationale: వ్యక్తి పేరును ప్రామాణిక తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: אֶל־אַבְרָהָם
  choice: అబ్రాహాముతో
  rationale: మాట ఎవరిని ఉద్దేశించి చెప్పబడిందో సహజమైన తెలుగు విభక్తితో వ్యక్తం చేశాం.
- source_word: מָה רָאִיתָ
  choice: నీవేమి చూశావని
  rationale: హీబ్రూలోని ‘ఏమి చూశావు?’ అనే చిత్రాన్ని నిలిపి, అది గ్రహించినది లేదా మనసులో ఉంచుకున్నది అనే భావాన్ని సూచించగల అస్పష్టతను కాపాడాం.
- source_word: כִּי
  choice: అని
  rationale: ముందున్న ప్రశ్నను తరువాతి చర్యతో కలిపే సంబంధాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: עָשִׂיתָ
  choice: చేశావు
  rationale: సాధారణ భూతకాల రూపం; హీబ్రూ క్రియకు సన్నిహితంగా ఉండి అదనపు నైతిక వ్యాఖ్యానాన్ని చేర్చదు.
- source_word: אֶת־הַדָּבָר הַזֶּה
  choice: ఈ పని
  rationale: דָּבָר ఇక్కడ అబ్రాహాము చేసిన కార్యాన్ని సూచిస్తుంది. ‘ఈ పని’ ఆధునిక తెలుగులో సహజంగా ఉండి ‘దుష్కార్యం’ వంటి అదనపు నైతిక బరువును మోపదు.
