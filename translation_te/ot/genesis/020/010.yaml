translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సహజంగా, గౌరవప్రదంగా ఉండే శైలి. మూలంలోని ‘చూడు’ రూపకాన్ని ప్రధాన పాఠ్యంలో నిలిపి, దాని నానుడి భావాన్ని పాదసూచికలో వివరించాం.
