  to: 'అప్పుడు అబీమెలెకు అబ్రాహాముతో ఇలా అన్నాడు: “నీవు ఏమి చూసి ఈ పని చేశావు?”[a]'
  rationale: ‘అడిగాడు’ స్థానంలో ‘ఇలా అన్నాడు’ అని మార్చి, హీబ్రూ וַיֹּאמֶר యొక్క సాధారణ ‘అన్నాడు’ అర్థాన్ని కాపాడాం. ప్రశ్నలోని ‘చూడు’ రూపకాన్ని ఆధునిక తెలుగులో సహజంగా నిలిపేందుకు ‘ఏమి చూసి’ అని ఇచ్చాం; పాదసూచికలోని ప్రత్యామ్నాయం, అక్షరార్థ వివరణ రెండూ మూలంలోని ఉద్దేశ్య-సంబంధిత అస్పష్టతను కాపాడుతున్నాయి.
