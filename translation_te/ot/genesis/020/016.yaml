id: GEN.20.16
reference: Genesis 20:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/לְ/שָׂרָ֣ה אָמַ֗ר הִנֵּ֨ה נָתַ֜תִּי אֶ֤לֶף כֶּ֨סֶף֙ לְ/אָחִ֔י/ךְ הִנֵּ֤ה הוּא לָ/ךְ֙ כְּס֣וּת עֵינַ֔יִם לְ/כֹ֖ל אֲשֶׁ֣ר אִתָּ֑/ךְ וְ/אֵ֥ת כֹּ֖ל וְ/נֹכָֽחַת־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/016.yaml
  text: And to Sarah he said[a], “Look, I have given a thousand pieces of silver to your brother. Look, it is for you a covering of the eyes to all who are with you[b], and before everyone you are vindicated.”
translation:
  language: te
  text: 'సారాతో అతడు ఇలా అన్నాడు: “ఇదిగో, నీ సోదరునికి వెయ్యి వెండి ముక్కలు ఇచ్చాను. ఇదిగో, అది నీ కళ్లకు కప్పుగా, నీతో ఉన్న వారందరికీ ఉంది[a]; అందరి ఎదుట నీవు నిర్దోషిగా నిరూపించబడ్డావు[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “కళ్లకు కప్పు” అనేది అర్థనిర్ణయం కష్టమైన హీబ్రూ రూపకం. ఇది జరిగిన అవమానాన్ని కప్పి, సారా గౌరవాన్ని బహిరంగంగా పునరుద్ధరించే పరిహారాన్ని సూచించి ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: చివరి హీబ్రూ పదబంధం క్లిష్టమైనది. దీనిని “నీవు తప్పులేనిదానివని వెల్లడైంది,” “విషయం అందరి ఎదుట పరిష్కారమైంది,” లేదా “నీవు మందలించబడ్డావు” అని కూడా అర్థం చేసుకున్నారు.
    reason: alternative_reading
lexical_decisions:
- source_word: אֶלֶף כֶּסֶף
  choice: వెయ్యి వెండి ముక్కలు
  rationale: మూలంలో అక్షరార్థంగా ‘వెయ్యి వెండి’ అని ఉంది; కొలమానం లేదా నాణెం స్పష్టంగా చెప్పబడలేదు. అందువల్ల ‘షెకెల్లు’ లేదా నిర్దిష్ట నాణెం అని చేర్చకుండా సహజమైన తెలుగు ప్రయోగాన్ని ఎంచుకున్నాం.
- source_word: לְאָחִיךְ
  choice: నీ సహోదరునికి
  rationale: అబ్రాహామును సారా తన సహోదరుడిగా చెప్పిన కథన సంబంధాన్నీ, అబీమెలెకు మాటల్లోని వ్యంగ్య ఛాయనూ నిలుపుతుంది.
- source_word: כְּסוּת עֵינַיִם
  choice: కళ్లకు కప్పు
  rationale: ఇది అర్థనిర్ణయం కష్టమైన హీబ్రూ రూపకం. దానిని నేరుగా ‘పరిహారం’ లేదా ‘గౌరవ పునరుద్ధరణ’గా మార్చకుండా ప్రధాన పాఠ్యంలో రూపకాన్ని నిలిపి, సాధ్యమైన భావాన్ని పాదసూచికలో వివరించాం.
- source_word: לְכֹל אֲשֶׁר אִתָּךְ
  choice: నీతో ఉన్న వారందరి ఎదుట
  rationale: హీబ్రూ ఉపసర్గ అక్షరార్థంగా ‘వారందరికీ’ అనే భావం ఇవ్వగలిగినా, ఇక్కడ చెల్లింపునకు ఉన్న బహిరంగ సామాజిక ఉద్దేశాన్ని తెలుగులో స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: וְאֵת כֹּל
  choice: అందరి ఎదుట
  rationale: సంక్షిప్తంగా, క్లిష్టంగా ఉన్న ఈ పదబంధం సారా వెంట ఉన్నవారి పరిధిని దాటి అందరి సమక్షాన్ని సూచిస్తున్నట్లు గ్రహించబడింది.
- source_word: וְנֹכָחַת
  choice: నీవు నిర్దోషివని తేలింది
  rationale: నిఫాల్ రూపానికి ఇక్కడ ‘నిర్దోషిగా నిరూపించబడడం/సమర్థించబడడం’ అనే భావాన్ని తీసుకున్నాం. అయితే వాక్యనిర్మాణం క్లిష్టమైనందున ఇతర అర్థసాధ్యతలను పాదసూచికలో ఉంచాం.
theological_decisions:
- issue: సారా స్థితిని తెలిపే చివరి క్లిష్టమైన హీబ్రూ క్రియ
  choice: నీవు నిర్దోషివని తేలింది
  alternative: నీవు తప్పులేనిదానివని వెల్లడైంది; విషయం అందరి ఎదుట పరిష్కారమైంది; లేదా నీవు మందలించబడ్డావు
  rationale: సందర్భంలో అబీమెలెకు బహిరంగంగా పరిహారం చెల్లించడం సారా గౌరవం పునరుద్ధరించబడిన భావానికి మద్దతిస్తుంది. అయినప్పటికీ మూలపాఠంలోని నిజమైన అస్పష్టతను పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలిని వాడాం. ‘ఇదిగో’ అనే పునరుక్తిని మూలంలోని הִנֵּה పునరావృతికి అనుగుణంగా నిలిపాం; క్లిష్టమైన రూపకాన్నీ చివరి వాక్యంలోని అస్పష్టతనూ అతిగా వివరణాత్మకంగా మార్చకుండా సంరక్షించాం.
