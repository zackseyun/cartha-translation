revisions:
- from: 'సారాతో అతడు ఇలా అన్నాడు: “ఇదిగో, నీ సహోదరునికి వెయ్యి వెండి ముక్కలు ఇచ్చాను. ఇదిగో, నీతో ఉన్న వారందరి ఎదుట అది నీకు కళ్లకు కప్పుగా ఉంది[a]. అందరి ఎదుట నీవు నిర్దోషివని తేలింది[b].”'
  to: 'సారాతో అతడు ఇలా అన్నాడు: “ఇదిగో, నీ సోదరునికి వెయ్యి వెండి ముక్కలు ఇచ్చాను. ఇదిగో, అది నీ కళ్లకు కప్పుగా, నీతో ఉన్న వారందరికీ ఉంది[a]; అందరి ఎదుట నీవు నిర్దోషిగా నిరూపించబడ్డావు[b].”'
  rationale: 'సవరణలు రెండు పరిమిత అంశాలకే చేయబడ్డాయి: לְכֹל అర్థాన్ని ‘ఎదుట’గా అతిగా నిర్దిష్టం చేయకుండా ‘వారందరికీ’గా నిలిపాం; అలాగే కళ్ల-కప్పు రూపకాన్ని తెలుగులో కొద్దిగా సహజమైన పదక్రమంలో ఉంచాం. చివరి క్లిష్ట క్రియకు సందర్భోచితమైన నిష్క్రియ అనువాదాన్ని వాడుతూ, ప్రత్యామ్నాయ పఠనాలను పాదసూచికలో భద్రపరిచాం.'
  reviewer_model: gpt-5.6-terra
