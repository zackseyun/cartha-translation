source:
  edition: WLC
  text: וַ/יִּתְפַּלֵּ֥ל אַבְרָהָ֖ם אֶל הָ/אֱלֹהִ֑ים וַ/יִּרְפָּ֨א אֱלֹהִ֜ים אֶת אֲבִימֶ֧לֶךְ וְ/אֶת אִשְׁתּ֛/וֹ וְ/אַמְהֹתָ֖י/ו וַ/יֵּלֵֽדוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/017.yaml
  text: Then Abraham prayed to God[a], and God healed Abimelech, his wife, and his female servants[b], and they gave birth.
translation:
  language: te
  text: అప్పుడు అబ్రాహాము దేవునికి ప్రార్థించాడు; దేవుడు అబీమెలెకును, అతని భార్యను, అతని దాసీలను[a] స్వస్థపరిచాడు, మరియు ఆ స్త్రీలు ప్రసవించారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూల హీబ్రూ పదం స్త్రీ సేవకులను లేదా బానిస స్త్రీలను సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “మరియు వారు ప్రసవించారు.” సందర్భంలో ఇది దేవుడు స్వస్థపరిచిన ఫలితాన్ని తెలియజేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְפַּלֵּל
  choice: ప్రార్థించాడు
  rationale: פלל యొక్క హిత్పయేల్ రూపానికి సాధారణ అర్థం ‘ప్రార్థించు.’ సందర్భంలో మధ్యవర్తిత్వ ప్రార్థన భావం ఉన్నప్పటికీ, క్రియ దానిని ప్రత్యేకంగా చెప్పదు.
- source_word: אֶל הָאֱלֹהִים / אֱלֹהִים
  choice: దేవునికి / దేవుడు
  rationale: ఇక్కడ אֱלֹהִים ఏకైక దేవునినే సూచిస్తుంది; తెలుగు విభక్తులతో సహజంగా అనువదించబడింది.
- source_word: וַיִּרְפָּא
  choice: స్వస్థపరిచాడు
  rationale: רפא యొక్క ప్రత్యక్ష భావం ‘స్వస్థపరచు/నయం చేయు.’ తరువాతి వచనం వివరించే బాధను దేవుడు తొలగించాడనే భావాన్ని అతిగా నిర్దిష్టం చేయకుండా తెలియజేస్తుంది.
- source_word: אֶת אֲבִימֶלֶךְ
  choice: అబీమెలెకును
  rationale: వ్యక్తి పేరును ప్రామాణిక తెలుగు లిప్యంతరీకరణతో, కర్మ విభక్తితో ఇచ్చాం.
- source_word: אִשְׁתּוֹ
  choice: అతని భార్యను
  rationale: అబీమెలెకు భార్యను సూచించే సరళమైన స్వామ్య నామబంధం.
- source_word: אַמְהֹתָיו
  choice: అతని దాసీలను
  rationale: אָמָה స్త్రీ సేవకురాలు లేదా బానిస స్త్రీని సూచించగలదు. ‘దాసీలు’ స్త్రీలనే సూచిస్తూ వారి అధీన సామాజిక స్థితిని పూర్తిగా చెరపదు; భావ పరిధిని పాదటిప్పణిలో తెలిపాం.
- source_word: וַיֵּלֵדוּ
  choice: వారు ప్రసవించారు
  rationale: ילד యొక్క ఈ రూపం ‘ప్రసవించారు’ అని అర్థం. కర్త స్త్రీల సమూహం; తెలుగులో సహజంగా ఉండేందుకు అంతర్భూతమైన ‘పిల్లలను’ ప్రధాన వాక్యంలో చేర్చలేదు.
theological_decisions:
- issue: చివరి క్రియకు స్వస్థపరచడంతో ఉన్న సంబంధం
  choice: ‘వారు ప్రసవించారు’ అని సమన్వయ/క్రమ సంబంధాన్ని ఉంచడం
  alternative: ‘దాంతో వారు ప్రసవించారు’ అని స్పష్టమైన ఫలిత సంబంధంగా అనువదించడం
  rationale: హీబ్రూ వావ్ కథన క్రమాన్ని తెలియజేస్తుంది; సందర్భం దీన్ని దేవుని స్వస్థపరిచే కార్య ఫలితంగా అర్థం చేసుకునేలా చేస్తుంది. అయితే మూలపాఠంలో లేని స్పష్టమైన కారణ–ఫలిత అనుసంధానాన్ని ప్రధాన వాక్యంలో చేర్చకుండా, ఆ సందర్భార్థాన్ని పాదటిప్పణిలో తెలిపాం.
- issue: אָמָה అనే పదంలోని సామాజిక స్థితి
  choice: ‘దాసీలు’
  alternative: ‘పనికత్తెలు’ లేదా ‘బానిస స్త్రీలు’
  rationale: మూలపదం సేవకత్వం మరియు బానిసత్వం రెండింటినీ సూచించగలదు. ‘దాసీలు’ ఈ రెండు భావాల మధ్య ఉన్న చారిత్రక పరిధిని కొంతవరకు నిలుపుతుంది; ఒకే స్థితిని ఖచ్చితంగా నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. మూలంలోని రెండు వరుస క్రియలను తెలుగులో స్పష్టంగా చదవడానికి రెండు వాక్యాలుగా అమర్చాం; చివరి ఖండంలోని క్రమ/ఫలిత సందిగ్ధతను ప్రధాన పాఠంలో పరిష్కరించకుండా ఉంచాం.
