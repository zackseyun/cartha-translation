  terminology: ‘దేవుడు,’ ‘ప్రార్థించాడు,’ ‘స్వస్థపరిచాడు,’ ‘అబ్రాహాము,’ ‘అబీమెలెకును,’ మరియు ‘దాసీలు’ ఆధునిక ప్రామాణిక తెలుగు బైబిల్ కథనానికి తగిన పదాలే. ‘దాసీలు’కి ఉన్న సేవక/బానిస స్త్రీల అర్థపరిధిని పాదటిప్పణి సరిగా కాపాడుతుంది.
