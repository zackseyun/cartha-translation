language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּקְרָ֨א אֲבִימֶ֜לֶךְ לְ/אַבְרָהָ֗ם וַ/יֹּ֨אמֶר ל֜/וֹ מֶֽה עָשִׂ֤יתָ לָּ֨/נוּ֙ וּ/מֶֽה חָטָ֣אתִי לָ֔/ךְ כִּֽי הֵבֵ֧אתָ עָלַ֛/י וְ/עַל מַמְלַכְתִּ֖/י חֲטָאָ֣ה גְדֹלָ֑ה מַעֲשִׂים֙ אֲשֶׁ֣ר לֹא יֵֽעָשׂ֔וּ עָשִׂ֖יתָ עִמָּדִֽ/י־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/009.yaml
  text: Then Abimelech called Abraham and said to him[a], “What have you done to us? And how have I sinned against you[b], that you have brought a great sin on me and on my kingdom? You have done to me things that should not be done.”
translation:
  language: te
  text: 'అప్పుడు అబీమెలెకు అబ్రాహామును పిలిచి అతనితో ఇలా అన్నాడు: “నీవు మాకు ఏమి చేశావు? నేను నీకు వ్యతిరేకంగా ఏ పాపం చేశానని నామీద, నా రాజ్యంమీద గొప్ప పాపం తెచ్చావు? నాతో చేయకూడని పనులు చేశావు.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרָא אֲבִימֶלֶךְ לְאַבְרָהָם
  choice: అబీమెలెకు అబ్రాహామును పిలిపించి
  rationale: קרא ל־ ఇక్కడ ఒకరిని తన వద్దకు పిలవడం అనే భావాన్ని ఇస్తుంది. రాజు సందర్భంలో ‘పిలిపించి’ సహజంగా ఉండి, అధికారికంగా ‘రప్పించాడు’ అనే అధిక బలాన్ని అనవసరంగా మోపదు.
- source_word: מֶה עָשִׂיתָ לָּנוּ
  choice: నీవు మాకు ఏమి చేశావు?
  rationale: హీబ్రూ ప్రశ్నను నేరుగా, సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది; అబ్రాహాము చర్య వల్ల కలిగిన ప్రస్తుత పరిణామాన్ని సందర్భం తెలియజేస్తుంది.
- source_word: וּמֶה חָטָאתִי לָךְ
  choice: నేను నీకు వ్యతిరేకంగా ఏ పాపం చేశానని
  rationale: חטא యొక్క నైతిక, మతపరమైన బలాన్ని ‘పాపం’ నిలుపుతుంది. לָךְ వ్యక్తికి వ్యతిరేకంగా చేసిన అపరాధాన్ని సూచిస్తున్నందున ‘నీకు వ్యతిరేకంగా’ అని అనువదించబడింది.
- source_word: כִּי
  choice: అని
  rationale: 'ముందున్న అలంకారిక ప్రశ్నను దాని ఫలితమైన ఆరోపణతో సహజంగా కలుపుతుంది: ‘ఏ పాపం చేశానని... తీసుకొచ్చావు?’'
- source_word: הֵבֵאתָ עָלַי וְעַל מַמְלַכְתִּי
  choice: నామీదికి, నా రాజ్యంమీదికి ... తీసుకొచ్చావు
  rationale: బוא యొక్క హిఫీల్ రూపం ఏదో ఒకటి ఎవరి మీదికి వచ్చేలా చేయడం అనే కారణార్థాన్ని కలిగి ఉంది. తెలుగు వాక్యనిర్మాణంలో ‘మీదికి ... తీసుకొచ్చావు’ ఆ భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: חֲטָאָה גְדֹלָה
  choice: ఇంత గొప్ప పాపాన్ని
  rationale: חֲטָאָה ఇక్కడ తీవ్రమైన నైతిక అపరాధాన్ని సూచిస్తుంది. ‘గొప్ప పాపం’ మూలంలోని తీవ్రతను నిలుపుతుంది; సందర్భానుగుణంగా ‘ఇంత’ ఆరోపణ యొక్క బలాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: מַמְלַכְתִּי
  choice: నా రాజ్యం
  rationale: מַמְלָכָה రాజాధీన ప్రాంతం లేదా రాజ్యాన్ని సూచిస్తుంది; ‘రాజ్యం’ స్పష్టమైన, ప్రామాణిక తెలుగు పదం.
- source_word: מַעֲשִׂים אֲשֶׁר לֹא יֵעָשׂוּ
  choice: చేయకూడని పనులు
  rationale: పదశః ‘చేయబడని పనులు’ అని ఉండగలిగినా, ఈ నిషేధాత్మక నిష్క్రియ నిర్మాణం సామాజిక-నైతిక అనుచితతను తెలియజేస్తుంది. ‘చేయకూడని’ ఆ నియామక భావాన్ని సహజంగా అందిస్తుంది.
- source_word: עָשִׂיתָ עִמָּדִי
  choice: నీవు నాకు చేశావు
  rationale: עשה עם/עמד అనే ప్రయోగం ఎవరికైనా ఏదో చేయడం లేదా వారితో ఒక విధంగా ప్రవర్తించడం అనే భావాన్ని ఇస్తుంది. ముందున్న ‘పనులను’ స్వీకరించేలా ‘నాకు చేశావు’ సూటిగా ఉంటుంది.
theological_decisions:
- issue: חטא / חטאה పదాల నైతిక-మతపరమైన బలం
  choice: ‘పాపం’ అనే పదాన్ని రెండుచోట్లా నిలుపడం
  alternative: ‘అపరాధం’ లేదా ‘అన్యాయం’
  rationale: వచనం మానవ సంబంధంలోని తప్పును మాత్రమే కాక తీవ్రమైన నైతిక దోషాన్ని కూడా సూచిస్తుంది. ‘పాపం’ మూలపదాల బలాన్ని నిలుపుతుంది; దాని ఖచ్చితమైన పరిధిని వ్యాఖ్యానంతో పరిమితం చేయదు.
- issue: מַעֲשִׂים אֲשֶׁר לֹא יֵעָשׂוּ యొక్క వివరణ
  choice: నైతిక నియామక భావంతో ‘చేయకూడని పనులు’
  alternative: ఆచారాన్ని సూచించేలా ‘ఎవరూ చేయని పనులు’
  rationale: హీబ్రూ రూపం పదశః సాధారణ ఆచారాన్ని సూచించగలిగినా, సందర్భంలోని గద్దింపు స్పష్టంగా అనుచితతను వ్యక్తపరుస్తుంది. ‘చేయకూడని’ భావాన్ని తెలియజేస్తూ ప్రత్యేక సిద్ధాంత వ్యాఖ్యానాన్ని జోడించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. ప్రత్యక్ష సంభాషణలో ఆరోపణాత్మక తీవ్రతను నిలుపుతూ, సాధారణ పాఠకునికి సహజంగా వినిపించే పదక్రమం ఎంచుకోబడింది. ఈ వచనానికి అవసరమైన పాఠ్య లేదా అర్థసందిగ్ధతను సూచించే పాదటిప్పణి లేదు; అందువల్ల ప్రధాన పాఠ్యంలో పాదటిప్పణి గుర్తులు చేర్చలేదు.
