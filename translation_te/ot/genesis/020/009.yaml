revisions:
- from: 'అప్పుడు అబీమెలెకు అబ్రాహామును పిలిపించి అతనితో ఇలా అన్నాడు: “నీవు మాకు ఏమి చేశావు? నేను నీకు వ్యతిరేకంగా ఏ పాపం చేశానని, నామీదికి, నా రాజ్యంమీదికి ఇంత గొప్ప పాపాన్ని తీసుకొచ్చావు? చేయకూడని పనులను నీవు నాకు చేశావు.”'
  to: 'అప్పుడు అబీమెలెకు అబ్రాహామును పిలిచి అతనితో ఇలా అన్నాడు: “నీవు మాకు ఏమి చేశావు? నేను నీకు వ్యతిరేకంగా ఏ పాపం చేశానని నామీద, నా రాజ్యంమీద గొప్ప పాపం తెచ్చావు? నాతో చేయకూడని పనులు చేశావు.”'
  rationale: The revision removes an unsupported intensifier, uses a direct and natural equivalent for the calling action, and recasts the final idiom into idiomatic modern Telugu. It retains the source’s rhetorical questions, moral terminology, and accusation directed both at Abimelech and his kingdom. No footnotes are needed for the Telugu rendering; the English audit-trail anchor mismatch is noted for correction in that separate layer.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T19:57:39Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the sequence, the double accusation, the moral force of חטא/חטאה, and the normative force of מַעֲשִׂים אֲשֶׁר לֹא יֵעָשׂוּ. However, ‘ఇంత గొప్ప’ adds an intensifier not present in the Hebrew, and ‘పనులను నీవు నాకు చేశావు’ is an unnatural rendering of עָשִׂיתָ עִמָּדִי (‘you have done/dealt with me’).
  naturalness: The narrative and questions are generally clear in modern standard Telugu. Revising ‘పిలిపించి’ to ‘పిలిచి’ avoids a mildly causative/indirect nuance, and ‘నాతో చేయకూడని పనులు చేశావు’ is a natural Telugu expression that retains the Hebrew idiom’s personal force.
  terminology: ‘పాపం’ appropriately preserves the ethical and religious weight of both Hebrew terms. ‘రాజ్యం’ and ‘చేయకూడని పనులు’ are accurate, standard choices. No theological interpretation has been introduced.
  issues:
  - severity: low
    issue: Added intensifier in ‘ఇంత గొప్ప పాపాన్ని’
    rationale: חֲטָאָה גְדֹלָה means ‘a great sin’; the demonstrative/intensifying ‘ఇంత’ is not expressed in the source.
  - severity: medium
    issue: Unnatural and less idiomatic final clause
    rationale: ‘చేయకూడని పనులను నీవు నాకు చేశావు’ is grammatically understandable but unnatural in Telugu. The Hebrew עשה עם means to do/deal with someone; ‘నాతో చేయకూడని పనులు చేశావు’ conveys this naturally without weakening the accusation.
  - severity: low
    issue: English audit-trail footnote anchors are mismatched
    rationale: In the supplied English text, marker a follows ‘him’ although its note concerns ‘what sin have I committed,’ while marker b follows ‘against you’ although its note concerns ‘things that ought not to be done.’ The Telugu text does not require these optional lexical-alternative notes, so no Telugu anchors are supplied.
  revised_text: 'అప్పుడు అబీమెలెకు అబ్రాహామును పిలిచి అతనితో ఇలా అన్నాడు: “నీవు మాకు ఏమి చేశావు? నేను నీకు వ్యతిరేకంగా ఏ పాపం చేశానని నామీద, నా రాజ్యంమీద గొప్ప పాపం తెచ్చావు? నాతో చేయకూడని పనులు చేశావు.”'
  revised_footnotes: []
