id: GEN.20.12
reference: Genesis 20:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/גַם אָמְנָ֗ה אֲחֹתִ֤/י בַת אָבִ/י֙ הִ֔וא אַ֖ךְ לֹ֣א בַת אִמִּ֑/י וַ/תְּהִי לִ֖/י לְ/אִשָּֽׁה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/012.yaml
  text: Besides[a], she really is my sister—the daughter of my father, though not the daughter of my mother—and she became my wife.
translation:
  language: te
  text: అంతేకాదు[a], ఆమె నిజంగానే నా సహోదరి—నా తండ్రి కుమార్తె, అయితే నా తల్లి కుమార్తె కాదు—ఆమె నాకు భార్య అయింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత అక్షరార్థంగా: “అలాగే, నిజానికి ఆమె నా సహోదరి; ఆమె నా తండ్రి కుమార్తె, కానీ నా తల్లి కుమార్తె కాదు.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: అంతేకాదు
  rationale: సంభాషణలో అబ్రాహాము తన వివరణకు మరొక సమర్థనను జోడిస్తున్న భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: אָמְנָה
  choice: నిజంగానే
  rationale: చెప్పిన బంధుత్వ వాదన నిజమేనని బలంగా నిర్ధారించే క్రియావిశేషణ భావాన్ని అందిస్తుంది.
- source_word: אֲחֹתִי
  choice: నా సహోదరి
  rationale: స్త్రీ సహోదరిని సూచించే బంధుత్వ పదాన్ని స్పష్టంగా, గౌరవప్రదమైన ఆధునిక తెలుగులో ఇస్తుంది.
- source_word: בַת אָבִי
  choice: నా తండ్రి కుమార్తె
  rationale: ఆమె ఏ భావంలో తన సహోదరో వివరించే మూలంలోని సమాసార్థాన్ని నేరుగా నిలుపుతుంది.
- source_word: הִוא
  choice: ఆమె ...
  rationale: హీబ్రూ నామవాక్యంలో స్వతంత్ర సర్వనామాన్ని తెలుగులో సహజమైన వర్తమాన నిర్ధారణగా వ్యక్తపరుస్తుంది.
- source_word: אַךְ לֹא
  choice: అయితే ... కాదు
  rationale: కఠినమైన ప్రత్యేకతకన్నా ముందటి వాదనకు పరిమితి లేదా అర్హత విధించే వ్యతిరేక భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: בַת אִמִּי
  choice: నా తల్లి కుమార్తె
  rationale: ముందటి ‘నా తండ్రి కుమార్తె’ అనే సమాంతర నిర్మాణాన్ని కాపాడుతుంది.
- source_word: וַתְּהִי לִי לְאִשָּׁה
  choice: ఆమె నాకు భార్య అయింది
  rationale: היה క్రియతో కూడిన לְאִשָּׁה నిర్మాణంలోని వివాహస్థితిలోకి ప్రవేశించిన సంఘటనాత్మక భావాన్ని నిలుపుతుంది.
