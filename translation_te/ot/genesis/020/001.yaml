source:
  edition: WLC
  text: וַ/יִּסַּ֨ע מִ/שָּׁ֤ם אַבְרָהָם֙ אַ֣רְצָ/ה הַ/נֶּ֔גֶב וַ/יֵּ֥שֶׁב בֵּין קָדֵ֖שׁ וּ/בֵ֣ין שׁ֑וּר וַ/יָּ֖גָר בִּ/גְרָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/001.yaml
  text: From there Abraham journeyed toward the Negev and settled between Kadesh and Shur[a]; he sojourned in Gerar.
translation:
  language: te
  text: అబ్రాహాము అక్కడి నుంచి నెగెబు ప్రాంతం వైపు ప్రయాణించి, కాదేషు మరియు షూరు మధ్య నివసించాడు[a]; గెరారులో పరదేశిగా ఉన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దక్షిణం వైపు.” హీబ్రూ పదం నెగెబు అనే దక్షిణ ప్రాంతాన్ని లేదా సాధారణంగా దక్షిణ దిశగా వెళ్లడాన్ని సూచించగలదు; ప్రధాన పాఠ్యంలో ఎక్కువగా సంభావ్యమైన భౌగోళిక అర్థాన్ని ఉంచాం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסַּע מִשָּׁם
  choice: అక్కడి నుంచి ... ప్రయాణించి
  rationale: נסע ప్రయాణం కోసం ఒక స్థలం నుంచి బయలుదేరి ముందుకు సాగడాన్ని సూచిస్తుంది; ఈ రూపం కథన గమనాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אַרְצָה הַנֶּגֶב
  choice: నెగెబు ప్రాంతం వైపు
  rationale: אַרְצָה లోని దిశార్థక ה కదలికను సూచిస్తుంది; הַנֶּגֶב సాధారణంగా దక్షిణ దిశను గానీ, నెగెబు అనే భౌగోళిక ప్రాంతాన్ని గానీ సూచించగలదు. సందర్భంలో భౌగోళిక భావమే ఎక్కువగా సంభావ్యమైనందున ప్రధాన పాఠ్యంలో దాన్ని ఉంచాం.
- source_word: וַיֵּשֶׁב
  choice: నివసించాడు
  rationale: ישב ఇక్కడ ఒక ప్రాంతంలో ఉండడం లేదా నివాసం ఏర్పరచుకోవడం అనే భావాన్ని ఇస్తుంది. తెలుగు వాక్యంలో 'నివసించాడు' సహజంగా, అతిగా నిర్దిష్టత లేకుండా ఉంటుంది.
- source_word: בֵּין קָדֵשׁ וּבֵין שׁוּר
  choice: కాదేషుకు షూరుకు మధ్య
  rationale: రెండు భౌగోళిక స్థలాల మధ్యనున్న ప్రాంతాన్ని నేరుగా సూచించే నిర్మాణం; స్థలనామాలు తెలుగు లిప్యంతరీకరణలో ఇవ్వబడ్డాయి.
- source_word: וַיָּגָר
  choice: పరదేశిగా నివసించాడు
  rationale: גור కేవలం ఉండడం కాకుండా, స్థానిక హక్కులు సంపూర్ణంగా లేని పరదేశి లేదా తాత్కాలిక నివాసిగా ఉండే భావాన్ని కలిగి ఉంది; తెలుగు పదబంధం ఆ ప్రత్యేకతను స్పష్టంగా నిలుపుతుంది.
- source_word: בִּגְרָר
  choice: గెరారులో
  rationale: స్థలార్థక בְּ ను సహజమైన తెలుగు సప్తమీ విభక్తితో అనువదించాం.
