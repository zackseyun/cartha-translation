translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. גור లోని పరదేశి నివాస భావాన్ని 'పరదేశిగా నివసించాడు' అని స్పష్టంగా నిలుపుతూ, నెగెబు పదంలోని నిజమైన భౌగోళిక/దిశార్థక సందిగ్ధతను పాదటిప్పణిలో సంరక్షించాం.
