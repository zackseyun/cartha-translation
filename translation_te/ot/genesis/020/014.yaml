translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. మూలంలోని వరుస కార్యాలు నిలుపబడ్డాయి; సర్వనామ సంబంధంలో తలెత్తే అనిశ్చితిని నివారించేందుకు ‘అబ్రాహాము భార్య’ అని స్పష్టం చేయబడింది.
