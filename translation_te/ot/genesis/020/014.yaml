  to: అప్పుడు అబీమెలెకు గొర్రెలను[a], పశువులను, పురుష బానిసలను, స్త్రీ బానిసలను[b] తీసుకొని అబ్రాహాముకు ఇచ్చాడు; అబ్రాహాము భార్యయైన శారాను అతనికి తిరిగి ఇచ్చాడు[c].
