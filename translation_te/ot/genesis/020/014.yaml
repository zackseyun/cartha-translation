  text: וַ/יִּקַּ֨ח אֲבִימֶ֜לֶךְ צֹ֣אן וּ/בָקָ֗ר וַ/עֲבָדִים֙ וּ/שְׁפָחֹ֔ת וַ/יִּתֵּ֖ן לְ/אַבְרָהָ֑ם וַ/יָּ֣שֶׁב ל֔/וֹ אֵ֖ת שָׂרָ֥ה אִשְׁתּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/014.yaml
  text: Then Abimelech took sheep and cattle[a], and male servants and female servants, and gave them to Abraham[c][b]; and he returned Sarah his wife to him.
translation:
  language: te
  text: అప్పుడు అబీమెలెకు గొర్రెలను[a], పశువులను, పురుష బానిసలను, స్త్రీ బానిసలను[b] తీసుకొని అబ్రాహాముకు ఇచ్చాడు; అబ్రాహాము భార్యయైన శారాను అతనికి తిరిగి ఇచ్చాడు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘చిన్న పశువుల మందలను’; హీబ్రూ పదం గొర్రెలతోపాటు మేకలను కూడా సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో, ‘పురుష బానిసలను, స్త్రీ బానిసలను.’ కొన్నిసార్లు ఈ పదాలను ‘సేవకులు, సేవకురాళ్లు’ అని అనువదించవచ్చు; అయితే ఇక్కడ వారిని ఆస్తితోపాటు బదిలీ చేయడం వారి బానిస స్థితిని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘అతనికి పునరుద్ధరించాడు’; హీబ్రూ క్రియకు ‘తిరిగి వచ్చేలా చేశాడు’ అనే భావం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: తీసుకొని
  rationale: לקח అనే క్రియకు సాధారణ అర్థమైన ‘తీసుకొను’ను నిలుపుతూ, వరుసగా జరిగిన కార్యాలను తెలుగులో సహజంగా కలుపుతుంది.
- source_word: צֹאן
  choice: గొర్రెలు
  rationale: ఈ పదం గొర్రెలు, మేకలు వంటి చిన్న పశువులను సమష్టిగా సూచించగలిగినా, בָקָרతో జతగా ఉన్న ఈ జాబితాలో ‘గొర్రెలు’ సంక్షిప్తమైన సహజ తెలుగు రూపం; విస్తృత అర్థాన్ని పాదసూచికలో తెలిపాం.
- source_word: בָקָר
  choice: పశువులు
  rationale: ఇక్కడ ఈ పదం ప్రధానంగా ఆవులు, ఎద్దులు వంటి పెద్ద పశుసంపదను సూచిస్తుంది; ‘పశువులు’ ఆధునిక సాధారణ తెలుగులో సహజమైన సమష్టి పదం.
- source_word: עֲבָדִים / שְׁפָחוֹת
  choice: దాసులు, దాసీలు
  rationale: పశువులతోపాటు వ్యక్తులను కూడా బహుమతిగా బదిలీ చేస్తున్న సందర్భం వారి బానిస స్థితిని స్పష్టపరుస్తుంది. ఈ జంట మూలంలోని పురుష–స్త్రీ భేదాన్ని కూడా నిలుపుతుంది.
- source_word: וַיִּתֵּן
  choice: ఇచ్చాడు
  rationale: మూల క్రియ యొక్క సరళమైన అర్థాన్ని సహజ తెలుగులో అందిస్తుంది; కర్మలు ముందే జాబితాలో ఉన్నందున అదనపు సర్వనామం అవసరం లేదు.
- source_word: וַיָּשֶׁב
  choice: తిరిగి అప్పగించాడు
  rationale: שוב హిఫిల్ రూపంలోని ‘తిరిగి వచ్చేలా చేయడం/తిరిగి ఇవ్వడం’ అనే కారణార్థాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אִשְׁתּוֹ
  choice: అబ్రాహాము భార్య
  rationale: మూలంలోని ‘అతని భార్య’ అబ్రాహామునే సూచిస్తుంది. తెలుగులో ‘అతని’ అన్నది అబీమెలెకును సూచిస్తున్నట్లు అపార్థం కాకుండా పేరును స్పష్టంగా వాడాం.
- source_word: לּוֹ
  choice: అతనికి
  rationale: ఈ సర్వనామం అబ్రాహామును సూచిస్తుంది; అదే వాక్యంలో ‘అబ్రాహాము భార్య’ అని ఉండటం వల్ల సూచన స్పష్టంగా ఉంటుంది.
