source:
  edition: WLC
  text: כִּֽי עָצֹ֤ר עָצַר֙ יְהוָ֔ה בְּעַ֥ד כָּל רֶ֖חֶם לְ/בֵ֣ית אֲבִימֶ֑לֶךְ עַל דְּבַ֥ר שָׂרָ֖ה אֵ֥שֶׁת אַבְרָהָֽם־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/018.yaml
  text: For Yahweh had completely closed every womb in Abimelech’s household because of Sarah[a], Abraham’s wife.
translation:
  language: te
  text: ఎందుకంటే అబీమెలెకు ఇంటివారిలోని ప్రతి గర్భాశయాన్ని యాహ్వే పూర్తిగా మూసివేశాడు; అది అబ్రాహాము భార్య అయిన శారా కారణంగా జరిగింది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నిశ్చయంగా మూసివేశాడు’ లేదా ‘బొత్తిగా మూసివేశాడు.’ హీబ్రూలో క్రియను ఉద్ఘాటించడానికి అదే మూలానికి చెందిన క్రియానామరూపాన్ని క్రియతో కలిపి వాడారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి వచనంలో చెప్పిన స్వస్థతకు నేపథ్య కారణాన్ని ఈ వాక్యం వివరిస్తోంది; తెలుగులో ‘ఎందుకంటే’ ఈ వివరణాత్మక సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: עָצֹר עָצַר
  choice: పూర్తిగా మూసివేశాడు
  rationale: క్రియకు ముందు అదే మూలానికి చెందిన infinitive absolute ఉండటం చర్యను బలపరుస్తుంది; ‘పూర్తిగా’ ఆ ఉద్ఘాటనను తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ దైవనామమైన టెట్రాగ్రామాటన్‌ను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో వ్యక్తిగత నామంగా అందించాం.
- source_word: בְּעַד כָּל רֶחֶם לְבֵית אֲבִימֶלֶךְ
  choice: అబీమెలెకు ఇంటివారిలోని ప్రతి గర్భాన్ని
  rationale: ‘ఇల్లు’ ఇక్కడ భవనాన్ని కాక కుటుంబం లేదా గృహసముదాయాన్ని సూచిస్తుంది. ‘ప్రతి గర్భం’ అనే మూర్తమైన శరీర రూపకాన్ని నిలిపి, ప్రభావిత పరిధిని సహజమైన తెలుగులో తెలిపాం.
- source_word: עַל דְּבַר שָׂרָה
  choice: శారా కారణంగానే
  rationale: ఈ సందర్భంలో עַל דְּבַר తీర్పుకు కారణాన్ని సూచిస్తుంది. ‘కారణంగానే’ కారణార్థంతో పాటు మూలంలోని కేంద్రీకరణను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אֵשֶׁת אַבְרָהָם
  choice: అబ్రాహాము భార్య అయిన
  rationale: శారా ఎవరో గుర్తించే నిర్మాణాన్ని సహజమైన తెలుగు సంబంధ వాక్యరూపంలో అందిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామ అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో వ్యక్తిగత దైవనామమే ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుగా మార్చకుండా నామరూపంలో నిలిపాం; ఆధునిక తెలుగు బైబిలు పాఠకులకు విస్తృతంగా పరిచితమైన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం.
- issue: గర్భాలను మూసివేయడం అనే వాక్యరూపం
  choice: ప్రతి గర్భాన్ని ... పూర్తిగా మూసివేశాడు
  alternative: స్త్రీలందరినీ సంతానహీనులుగా చేశాడు
  rationale: మూలంలోని శరీర సంబంధమైన మూర్త భాషను నిలిపి, దానిని వైద్య లేదా సిద్ధాంతపరమైన వివరణగా విస్తరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. పొడవైన హీబ్రూ వాక్యాన్ని రెండు తెలుగు వాక్యాలుగా విభజించడం ద్వారా కారణ సంబంధం మరియు శారా గుర్తింపు స్పష్టమయ్యాయి; [a] గుర్తు ప్రధాన పాఠ్యంలో ఉంచబడింది.
