    text: లేదా, ‘నిశ్చయంగా మూసివేశాడు’ లేదా ‘బొత్తిగా మూసివేశాడు.’ హీబ్రూలో క్రియను ఉద్ఘాటించడానికి అదే మూలానికి చెందిన క్రియానామరూపాన్ని క్రియతో కలిపి వాడారు.
    reason: lexical_alternative
