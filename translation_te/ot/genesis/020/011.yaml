- from: 'అబ్రాహాము ఇలా అన్నాడు: “ఎందుకంటే, ‘ఈ స్థలంలో దేవుని పట్ల భయం[a] ఏమాత్రం లేదు; నా భార్య కారణంగా నన్ను చంపేస్తారు’ అని నేను అనుకున్నాను.”'
  to: 'అబ్రాహాము ఇలా అన్నాడు: “ఎందుకంటే నేను ఇలా అన్నాను: ‘ఈ స్థలంలో దేవుని భయం[a] ఏమాత్రం లేదు; నా భార్య కారణంగా వారు నన్ను చంపుతారు.’”'
  rationale: The revision more closely follows the Hebrew wording and syntax while remaining natural in modern standard Telugu. It preserves the causal force of כִּי, the plain sense of אָמַרְתִּי, the emphasis of רַק with “ఏమాత్రం లేదు,” the plural force of וַהֲרָגוּנִי, and the biblical idiom “దేవుని భయం.”
