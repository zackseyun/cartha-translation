  text: וַ/יֹּ֨אמֶר֙ אַבְרָהָ֔ם כִּ֣י אָמַ֗רְתִּי רַ֚ק אֵין יִרְאַ֣ת אֱלֹהִ֔ים בַּ/מָּק֖וֹם הַ/זֶּ֑ה וַ/הֲרָג֖וּ/נִי עַל דְּבַ֥ר אִשְׁתִּֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/011.yaml
  text: And Abraham said[a], “Because I said, ‘Surely there is no fear of God in this place, and they will kill me because of my wife.’”
translation:
  language: te
  text: 'అబ్రాహాము ఇలా అన్నాడు: “ఎందుకంటే నేను ఇలా అన్నాను: ‘ఈ స్థలంలో దేవుని భయం[a] ఏమాత్రం లేదు; నా భార్య కారణంగా వారు నన్ను చంపుతారు.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దేవుని పట్ల భక్తిపూర్వక గౌరవం.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: అబ్రాహాము తాను ముందుగా చేసిన పనికి కారణాన్ని వివరిస్తున్నందున, హీబ్రూ కారణార్థాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: אָמַרְתִּי
  choice: అని నేను అనుకున్నాను
  rationale: మూల క్రియకు అక్షరార్థంగా ‘అన్నాను’ అనే భావం ఉన్నా, ఇక్కడ అది అబ్రాహాము తనలో తాను చేసుకున్న ఆలోచనను సూచిస్తుంది; తెలుగు సందర్భంలో ‘అనుకున్నాను’ సహజంగా ఉంది.
- source_word: רַק
  choice: ఏమాత్రం
  rationale: ఈ సందర్భంలో రַק అబ్రాహాము ఊహకు గట్టి నొక్కును ఇస్తుంది; నిరాకరణతో కలిసి ‘ఏమాత్రం లేదు’ దాని బలాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אֵין יִרְאַת אֱלֹהִים
  choice: దేవుని పట్ల భయం లేదు
  rationale: ‘దేవుని భయం’ అనే బైబిలు నుడికారాన్ని, దానిలోని నైతిక-ఆధ్యాత్మిక గంభీరతను నిలుపుతుంది; తెలుగులో సంబంధాన్ని స్పష్టం చేయడానికి ‘పట్ల’ చేర్చబడింది.
- source_word: בַּמָּקוֹם הַזֶּה
  choice: ఈ స్థలంలో
  rationale: స్థలాన్ని సూచించే మూల పదబంధానికి నేరుగా, సహజంగా సరిపోతుంది.
- source_word: וַהֲרָגוּנִי
  choice: నన్ను చంపేస్తారు
  rationale: అబ్రాహాము ఎదురుచూసిన పరిణామాన్ని తెలుగులో సహజమైన భవిష్యదర్థంతో, భావంలోని తీవ్రతను నిలుపుతూ వ్యక్తం చేస్తుంది.
- source_word: עַל דְּבַר אִשְׁתִּי
  choice: నా భార్య కారణంగా
  rationale: ‘కారణంగా/నిమిత్తంగా’ అనే హీబ్రూ నుడికారార్థాన్ని ఆధునిక తెలుగులో స్పష్టంగా అందిస్తుంది.
theological_decisions:
- issue: יִרְאַת אֱלֹהִים అనువాదం
  choice: దేవుని పట్ల భయం
  alternative: దేవుని పట్ల భక్తిపూర్వక గౌరవం
  rationale: హీబ్రూ పదంలోని ‘భయం’ అనే ప్రత్యక్ష భావాన్ని, దేవుని ఎదుట నైతిక జవాబుదారీతనాన్ని సూచించే బైబిలు నుడికారాన్ని ప్రధాన పాఠ్యంలో నిలిపింది; ‘భక్తిపూర్వక గౌరవం’ అనే భావసూచక ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు సహజంగా, గౌరవప్రదంగా ఉండే శైలి. ‘దేవుని పట్ల భయం’ అనే బైబిలు నుడికారాన్ని సరళీకరించకుండా నిలిపి, దాని భావవ్యాప్తిని పాదటిప్పణిలో సూచించాం.
