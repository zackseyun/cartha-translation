base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/002.yaml
  text: And Abraham said of Sarah his wife[b][a], “She is my sister.” So Abimelech king of Gerar sent and took Sarah.
translation:
  language: te
  text: అబ్రాహాము తన భార్య శారా గురించి[a], “ఆమె నా సహోదరి” అని చెప్పాడు. అప్పుడు గెరారు రాజు అబీమెలెకు పంపించి శారాను తీసుకున్నాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తన భార్య శారాతో.” హీబ్రూ ఉపసర్గను మరింత అక్షరార్థంగా అలా అనువదించవచ్చు; అయితే “ఆమె నా సహోదరి” అనే మాటను బట్టి అబ్రాహాము శారా గురించి చెప్పాడనే భావం సందర్భానికి బాగా సరిపోతుంది.
    reason: lexical_alternative
  - marker: b
    text: అంటే, అబీమెలెకు శారాను తన దగ్గరకు తీసుకురప్పించాడు. హీబ్రూ పాఠ్యం సరళంగా “పంపించి శారాను తీసుకున్నాడు” అని చెబుతుంది.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: చెప్పాడు
  rationale: אמר క్రియకు కథన సందర్భంలో సహజమైన ఆధునిక తెలుగు సమానార్థకం.
- source_word: אֶל שָׂרָה אִשְׁתּוֹ
  choice: తన భార్యయైన శారా గురించి
  rationale: אֶל సాధారణంగా ‘కు/తో’ అని అర్థమిచ్చినా, వెంట వచ్చే ‘ఆమె నా సహోదరి’ అనే వాక్యం శారాను ఉద్దేశించి కాక ఆమె గురించి చెప్పిన భావాన్ని సందర్భంలో బలపరుస్తుంది.
- source_word: אֲחֹתִי הִוא
  choice: ఆమె నా సహోదరి
  rationale: క్రియలేని హీబ్రూ వాక్యాన్ని నేరుగా, గౌరవప్రదమైన ప్రామాణిక తెలుగులో అందిస్తుంది.
- source_word: וַיִּשְׁלַח
  choice: మనుషులను పంపించి
  rationale: హీబ్రూలో పంపబడినవారు స్పష్టంగా లేకపోయినా, తరువాతి ‘తీసుకున్నాడు’ అనే చర్యను తెలుగులో సహజంగా అనుసంధానించేందుకు సూచిత ప్రతినిధులను ‘మనుషులను’ అని వ్యక్తం చేసింది.
- source_word: מֶלֶךְ גְּרָר
  choice: గెరారు రాజైన
  rationale: నిర్మాణ సంబంధాన్ని తెలుగు విశేషణ రూపంలో సహజంగా తెలియజేస్తుంది.
- source_word: וַיִּקַּח אֶת שָׂרָה
  choice: శారాను తీసుకెళ్లాడు
  rationale: לקח యొక్క సాధారణ ‘తీసుకున్నాడు/తీసుకెళ్లాడు’ భావాన్ని నిలుపుతూ, ‘భార్యగా చేసుకున్నాడు’ వంటి సందర్భానుమానాన్ని ప్రధాన పాఠ్యంలో చేర్చదు.
theological_decisions:
- issue: అబీమెలెకు చేసిన చర్యను ఎంతవరకు విస్తరించి చెప్పాలి
  choice: శారాను తీసుకెళ్లాడు
  alternative: శారాను తన ఇంటికి తెప్పించుకున్నాడు / శారాను భార్యగా తీసుకున్నాడు
  rationale: ఈ వచనం ‘పంపించి తీసుకున్నాడు’ అని మాత్రమే చెబుతుంది; వివాహ ఉద్దేశాన్ని స్పష్టంగా చేర్చడం మూలపాఠ్యాన్ని మించిన వ్యాఖ్యానం అవుతుంది.
- issue: అబ్రాహాము శారాతో మాట్లాడాడా లేక శారా గురించి చెప్పాడా
  choice: శారా గురించి
  alternative: తన భార్యయైన శారాతో
  rationale: אֶל యొక్క సాధారణ అర్థం ‘తో/కు’ అయినప్పటికీ, ‘ఆమె నా సహోదరి’ అనే తృతీయ పురుష ప్రకటన సందర్భంలో ‘గురించి’ అనే పఠనం బలంగా సరిపోతుంది; ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కథనానికి తగిన సరళమైన, గౌరవప్రదమైన శైలి. ‘సహోదరి’ బైబిలు సందర్భానికి తగిన గంభీరతను ఉంచుతుంది. మూలంలోని సంక్షిప్తతను సాధ్యమైనంతవరకు కాపాడుతూ, తెలుగులో చర్య సహజంగా అర్థమయ్యేలా సూచిత ప్రతినిధులను ప్రధాన పాఠ్యంలో వ్యక్తం చేసింది.
