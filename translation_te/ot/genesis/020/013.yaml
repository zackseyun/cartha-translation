  edition: WLC
  text: וַ/יְהִ֞י כַּ/אֲשֶׁ֧ר הִתְע֣וּ אֹתִ֗/י אֱלֹהִים֮ מִ/בֵּ֣ית אָבִ/י֒ וָ/אֹמַ֣ר לָ֔/הּ זֶ֣ה חַסְדֵּ֔/ךְ אֲשֶׁ֥ר תַּעֲשִׂ֖י עִמָּדִ֑/י אֶ֤ל כָּל הַ/מָּקוֹם֙ אֲשֶׁ֣ר נָב֣וֹא שָׁ֔מָּ/ה אִמְרִי לִ֖/י אָחִ֥/י הֽוּא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/013.yaml
  text: 'And when God caused me to wander from my father’s house[a], I said to her, ‘This is the kindness you must show me: at every place we come to, say of me[b], “He is my brother.”’'
translation:
  language: te
  text: 'దేవుడు నన్ను నా తండ్రి ఇంటి నుంచి సంచరించేలా చేసినప్పుడు[a], నేను ఆమెతో ఇలా అన్నాను: “నీవు నాకు చూపవలసిన దయ[b] ఇదే: మనం చేరే ప్రతి చోటా నా గురించి, ‘ఇతడు నా సోదరుడు’ అని చెప్పు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నన్ను తిరిగేలా చేసినప్పుడు,” “నన్ను సంచరింపజేసినప్పుడు.” హీబ్రూ క్రియ కారణార్థకమైనది; అది తిరగడం లేదా దారి తప్పడం అనే భావాన్ని ఇవ్వగలదు. ఇక్కడ నైతికంగా తప్పిపోవడం తప్పనిసరి భావం కాదు; పితృగృహాన్ని విడిచి స్థిరనివాసం లేకుండా సంచరించడం ప్రధాన భావం.
    reason: lexical_alternative
  - marker: b
    text: “దయ” అని అనువదించిన హీబ్రూ పదం హెసెద్ (חֶסֶד). సందర్భాన్ని బట్టి దీనికి నిబద్ధ ప్రేమ, విశ్వసనీయమైన దయ అనే భావాలు కూడా ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִתְעוּ
  choice: సంచరించేలా చేసినప్పుడు
  rationale: హిఫీల్ రూపంలోని కారణార్థక భావాన్ని నిలుపుతూ, నైతికంగా తప్పుదారి పట్టించాడనే అవసరం లేని భావాన్ని రానివ్వకుండా ‘సంచరించేలా చేశాడు’ అని అనువదించాం.
- source_word: אֱלֹהִים
  choice: దేవుడు
  rationale: రూపపరంగా బహువచనంగా కనిపించినా, సందర్భంలో అబ్రాహాము దేవుడే ఏకవచన కర్తగా ఉద్దేశించబడ్డాడు.
- source_word: מִבֵּית אָבִי
  choice: నా తండ్రి ఇంటి నుంచి
  rationale: కుటుంబ నివాసం లేదా పితృగృహం అనే సామాజిక-కుటుంబ భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: חַסְדֵּךְ
  choice: నువ్వు నాకు చూపవలసిన దయ
  rationale: ఈ వ్యక్తిగత విజ్ఞప్తి సందర్భంలో חסד పదానికి ‘దయ’ సహజంగా సరిపోతుంది; ఆ పదంలో విశ్వసనీయమైన ప్రేమ లేదా నిబద్ధ దయ అనే ఛాయలు కూడా ఉండవచ్చు.
- source_word: תַּעֲשִׂי עִמָּדִי
  choice: నాకు చూపవలసిన
  rationale: అక్షరార్థంగా ‘నాతో చేయవలసిన’ అయినా, ‘దయ’తో కలిసి తెలుగులో ‘నాకు చూపవలసిన’ అనడం సహజం మరియు ఆజ్ఞాత్మక భావాన్ని నిలుపుతుంది.
- source_word: אֶל כָּל הַמָּקוֹם אֲשֶׁר נָבוֹא שָׁמָּה
  choice: మనం వెళ్లే ప్రతి చోటా
  rationale: వారు చేరే ప్రతి స్థలాన్నీ సూచించే విభాజక భావాన్ని సంక్షిప్తమైన, సహజమైన తెలుగులో అందిస్తుంది.
- source_word: אִמְרִי לִי
  choice: నా గురించి ... చెప్పు
  rationale: హీబ్రూలో అక్షరార్థంగా ‘నాకు/నా పక్షంగా చెప్పు’; సందర్భంలో ఇతరులతో అబ్రాహాము గురించి చెప్పడమే ఉద్దేశం.
- source_word: אָחִי הוּא
  choice: ఇతడు నా సోదరుడు
  rationale: ‘సోదరుడు’ అనేది వయస్సు ఆధారంగా ‘అన్న’ లేదా ‘తమ్ముడు’ అని నిర్ధారించకుండా మూలంలోని సంబంధ పదాన్ని కాపాడుతుంది.
theological_decisions:
- issue: అబ్రాహాము సంచారానికి కర్త
  choice: దేవుడు అబ్రాహామును తన తండ్రి ఇంటి నుంచి సంచరించేలా చేశాడు
  alternative: దేవుడు అబ్రాహాము సంచరించడానికి అనుమతించాడు; దేవతలు అతన్ని సంచరించేలా చేశారు
  rationale: హీబ్రూ వాక్యం దేవుణ్ణి కారణార్థక క్రియకు వ్యాకరణ కర్తగా చూపుతుంది. దైవ కార్యసాధకత్వాన్ని ‘అనుమతించాడు’ అని మృదువుచేయకుండా నిలిపి, అదే సమయంలో నైతిక తప్పుదారి అనే భావాన్ని అనవసరంగా చేర్చలేదు. సందర్భం బహువచన ‘దేవతలు’ అనే పఠనానికి మద్దతివ్వదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. ‘సోదరుడు’ అనే పదం మూలంలోని వయస్సు-నిర్దిష్టతలేని సంబంధాన్ని కాపాడుతుంది. మూలంలోని దైవ కారణత్వాన్ని వివరణాత్మకంగా మృదువుచేయలేదు.
