translation:
  language: te
  text: 'అబీమెలెకు ఇలా అన్నాడు: “చూడు, నా దేశం నీ ముందు ఉంది. నీకు నచ్చిన చోట నివసించు.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: చూడు
  rationale: శ్రోత దృష్టిని ఆకర్షించే హీబ్రూ సూచనార్థక పదానికి సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: אַרְצִי לְפָנֶיךָ
  choice: నా దేశం నీ ముందు ఉంది
  rationale: భూమి అందుబాటులో ఉందనే భావాన్ని మూలంలోని రూపకాన్ని నిలుపుతూ వ్యక్తపరుస్తుంది.
- source_word: שֵׁב
  choice: నివసించు
  rationale: ఈ సందర్భంలో కేవలం కూర్చోవడం కాదు, ఒక చోట స్థిరపడి ఉండడం అనే భావం.
- source_word: בַּטּוֹב בְּעֵינֶיךָ
  choice: నీకు నచ్చిన చోట
  rationale: అక్షరార్థంగా ‘నీ కళ్లకు మంచిదైన దానిలో’; తెలుగులో సహజంగా స్థల ఎంపికను తెలియజేసే రూపం.
