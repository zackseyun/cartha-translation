  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/עַתָּ֗ה הָשֵׁ֤ב אֵֽשֶׁת הָ/אִישׁ֙ כִּֽי נָבִ֣יא ה֔וּא וְ/יִתְפַּלֵּ֥ל בַּֽעַדְ/ךָ֖ וֶֽ/חְיֵ֑ה וְ/אִם אֵֽינְ/ךָ֣ מֵשִׁ֗יב דַּ֚ע כִּי מ֣וֹת תָּמ֔וּת אַתָּ֖ה וְ/כָל אֲשֶׁר לָֽ/ךְ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/007.yaml
  text: Now then[a], return the man's wife, for he is a prophet, and he will pray for you, and you will live. But if you do not return her, know that you will surely die—you and all who are yours.
translation:
  language: te
  text: ఇప్పుడైతే ఆ మనిషి భార్యను అతనికి తిరిగి అప్పగించు; ఎందుకంటే అతడు ప్రవక్త. అతడు నీ కోసం ప్రార్థిస్తాడు, అప్పుడు నీవు బ్రతుకుతావు. కానీ నీవు ఆమెను తిరిగి అప్పగించకపోతే, నీవూ నీకు చెందినవారందరూ తప్పకుండా చనిపోతారని తెలుసుకో.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీవూ నీకు చెందినదంతా” లేదా “నీవూ నీకున్నదంతా.” హెబ్రీ పదబంధం విస్తృతమైనది; అది అబీమెలెకు ఇంటివారితో పాటు అతనికి చెందిన సమస్తాన్నీ సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: కాబట్టి ఇప్పుడు
  rationale: ఈ సంభాషణ సూచకం కాలభావంతో పాటు ముందున్న విషయాలనుంచి వచ్చే తక్షణ ఆజ్ఞను పరిచయం చేస్తుంది.
- source_word: הָשֵׁב אֵשֶׁת הָאִישׁ
  choice: ఆ మనిషి భార్యను అతనికి తిరిగి అప్పగించు
  rationale: హిఫీల్ ఆజ్ఞారూపం ఆమెను భర్తకు తిరిగి ఇవ్వడాన్ని సూచిస్తుంది; తెలుగులో లక్ష్యాన్ని స్పష్టపరచడానికి ‘అతనికి’ సందర్భానుసారంగా చేర్చబడింది.
- source_word: כִּי נָבִיא הוּא
  choice: అతడు ప్రవక్త
  rationale: נָבִיא కు సహజమైన, స్థిరమైన తెలుగు సమానార్థకం ‘ప్రవక్త’; ఈ వాక్యం ఆజ్ఞకు కారణాన్ని తెలియజేస్తుంది.
- source_word: וְיִתְפַּלֵּל בַּעַדְךָ
  choice: అతడు నీ కోసం ప్రార్థిస్తాడు
  rationale: בַּעַדְךָ లోని పక్షాన చేసే ప్రార్థన భావాన్ని సాధారణ పాఠకులకు స్పష్టంగా ‘నీ కోసం’ తెలియజేస్తుంది.
- source_word: וֶחְיֵה
  choice: అప్పుడు నీవు బ్రతుకుతావు
  rationale: రూపరీత్యా ఆజ్ఞార్థకమైనప్పటికీ సందర్భంలో ఇది ప్రవక్త ప్రార్థన వల్ల కలిగే ఫలితాన్ని సూచిస్తుంది; ‘అప్పుడు’ ఆ సంబంధాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וְאִם אֵינְךָ מֵשִׁיב
  choice: అయితే నీవు ఆమెను తిరిగి అప్పగించకపోతే
  rationale: నిరాకరణతో కూడిన కృదంత నిర్మాణం తిరిగి ఇవ్వడానికి నిరాకరించే షరతును సూచిస్తుంది; ప్రత్యక్ష కర్మ సందర్భం నుంచి ‘ఆమెను’గా స్పష్టం చేయబడింది.
- source_word: מוֹת תָּמוּת
  choice: తప్పకుండా చనిపోతారని
  rationale: క్రియానామం మరియు సమాప్త క్రియ కలయిక మరణం యొక్క నిశ్చయాన్ని బలపరుస్తుంది; ‘తప్పకుండా’ ఆ తీవ్రతను సహజ తెలుగులో నిలుపుతుంది.
- source_word: אַתָּה וְכָל אֲשֶׁר לָךְ
  choice: నీవూ నీకు చెందినవారంతా
  rationale: హెబ్రీ విస్తృత పదబంధం అబీమెలెకుకు చెందిన ఇంటివారిని, ఆధారపడినవారిని, సాధ్యంగా అతని ఆస్తిని కూడా కలుపుకోవచ్చు; ప్రధాన వాక్యంలో వ్యక్తులపై ఉన్న మరణ హెచ్చరికను ముందుకు తెస్తుంది.
theological_decisions:
- issue: ‘నీవూ నీకు చెందినదంతా’ అనే హెచ్చరిక పరిధి
  choice: నీవూ నీకు చెందినవారంతా
  alternative: నీవూ నీకు చెందినదంతా / నీకున్నదంతా
  rationale: మరణ హెచ్చరిక మరియు ఇంటివారందరినీ తాకిన తీర్పు అనే సమీప సందర్భం వ్యక్తులను ప్రధానంగా సూచిస్తుంది. అయితే హెబ్రీ పదబంధపు విస్తృతతను పాదసూచికలో నిలిపాం; ఆస్తిని పూర్తిగా మినహాయించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కానీ సాధారణ పాఠకులకు సులభమైన కథన శైలి. ‘తిరిగి అప్పగించు,’ ‘ప్రవక్త,’ ‘తప్పకుండా’ వంటి పదాలు మూలంలోని ఆజ్ఞ, పాత్ర, హెచ్చరిక తీవ్రతలను సహజంగా వ్యక్తం చేస్తాయి.
