source:
  edition: WLC
  text: וַ/יַּשְׁכֵּ֨ם אֲבִימֶ֜לֶךְ בַּ/בֹּ֗קֶר וַ/יִּקְרָא֙ לְ/כָל עֲבָדָ֔י/ו וַ/יְדַבֵּ֛ר אֶת כָּל הַ/דְּבָרִ֥ים הָ/אֵ֖לֶּה בְּ/אָזְנֵי/הֶ֑ם וַ/יִּֽירְא֥וּ הָ/אֲנָשִׁ֖ים מְאֹֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/008.yaml
  text: So Abimelech rose early in the morning and called all his servants and spoke all these things in their hearing[b][a], and the men were very afraid.
translation:
  language: te
  text: అబీమెలెకు ఉదయాన్నే లేచి, తన సేవకులందరినీ పిలిచి[a], ఈ సంగతులన్నిటినీ వారికి వినిపించేలా చెప్పాడు. అప్పుడు ఆ మనుషులు ఎంతో భయపడ్డారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘తన సేవకులందరినీ రప్పించి.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘ఆ మనుషులు మిక్కిలి భయపడ్డారు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכֵּם בַּבֹּקֶר
  choice: ఉదయాన్నే లేచి
  rationale: ‘తెల్లవారగానే/ఉదయాన్నే లేవడం’ అనే హెబ్రీయ భాషాప్రయోగాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; కార్యంలోని తొందరను కూడా నిలుపుతుంది.
- source_word: וַיִּקְרָא לְכָל עֲבָדָיו
  choice: తన సేవకులందరినీ పిలిచి
  rationale: ఈ రాజగృహ సందర్భంలో עֲבָדִים అనేది సేవకులు లేదా పరివార అధికారులను సూచిస్తుంది; బానిసత్వ స్థితిని ప్రత్యేకంగా నొక్కిచెప్పడం లేదు. קרא యొక్క సాధారణ అర్థమైన ‘పిలిచాడు’ను నిలుపుతుంది.
- source_word: וַיְדַבֵּר אֶת כָּל הַדְּבָרִים הָאֵלֶּה
  choice: ఈ సంగతులన్నిటినీ ... చెప్పాడు
  rationale: ఇక్కడ ‘మాటలు’ కంటే ముందు జరిగిన విషయాల నివేదిక అనే భావంలో ‘సంగతులు’ సహజంగా ఉంటుంది; דבר యొక్క మాట్లాడి తెలియజేయడం అనే భావాన్ని ‘చెప్పాడు’ స్పష్టంగా అందిస్తుంది.
- source_word: בְּאָזְנֵיהֶם
  choice: వారికి వినిపించేలా
  rationale: అక్షరార్థంగా ‘వారి చెవుల్లో’ అయినా, ఇది వారు వినేటట్లు ప్రత్యక్షంగా చెప్పాడనే హెబ్రీయ నుడికారం. తెలుగు నుడికారానికి అనుగుణంగా అర్థాన్ని నిలుపుతుంది.
- source_word: וַיִּירְאוּ הָאֲנָשִׁים מְאֹד
  choice: ఆ మనుషులు ఎంతో భయపడ్డారు
  rationale: ఇక్కడ ירא భక్తిపూర్వక భయం కాక, అబీమెలెకు తెలిపిన విషయాలు విని కలిగిన తీవ్రమైన భయాన్ని సూచిస్తుంది. הָאֲנָשִׁים యొక్క పురుష బహువచనాన్ని ‘మనుషులు’గా, מְאֹד తీవ్రతను ‘ఎంతో’గా నిలుపుతుంది.
