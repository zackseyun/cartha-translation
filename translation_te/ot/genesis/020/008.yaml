translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కథనానికి తగిన గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన శైలి. హెబ్రీయ నుడికారాలను చెక్కుచెదరని అక్షరానువాదంగా కాక, వాటి భావం స్పష్టంగా ఉండే సహజ తెలుగులో అందించబడింది.
