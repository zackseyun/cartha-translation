  text: וְ/הָיָה֙ בַּ/תְּבוּאֹ֔ת וּ/נְתַתֶּ֥ם חֲמִישִׁ֖ית לְ/פַרְעֹ֑ה וְ/אַרְבַּ֣ע הַ/יָּדֹ֡ת יִהְיֶ֣ה לָ/כֶם֩ לְ/זֶ֨רַע הַ/שָּׂדֶ֧ה וּֽ/לְ/אָכְלְ/כֶ֛ם וְ/לַ/אֲשֶׁ֥ר בְּ/בָתֵּי/כֶ֖ם וְ/לֶ/אֱכֹ֥ל לְ/טַפְּ/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/024.yaml
  text: And at the harvest[a], you shall give a fifth to Pharaoh, and four-fifths shall be yours for seed for the field, for your food, for those in your households, and for food for your little ones.
translation:
  language: te
  text: పంట చేతికి వచ్చినప్పుడు, మీరు ఐదో వంతు ఫరోకు ఇవ్వాలి. మిగిలిన ఐదింట నాలుగు వంతులు[a] పొలంలో విత్తడానికి, మీ ఆహారానికి, మీ ఇళ్లలో ఉన్నవారికి, మీ చిన్నపిల్లల ఆహారానికి మీవిగా ఉంటాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా ‘నాలుగు చేతులు’; ఇది ఐదు భాగాల్లో మిగిలిన నాలుగు భాగాలను, అంటే ఐదింట నాలుగు వంతులను సూచించే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּתְּבוּאֹת
  choice: పంట చేతికి వచ్చినప్పుడు
  rationale: תְּבוּאָה పంట దిగుబడిని సూచిస్తుంది. ఈ పరిపాలనా సందర్భంలో בְּ ఉపసర్గతో కూడిన పదబంధం పంట లభించే సమయాన్ని సూచిస్తున్నందున, ఆధునిక తెలుగులో సహజమైన కాలార్థక ప్రయోగాన్ని ఎంచుకున్నాం.
- source_word: וּנְתַתֶּם חֲמִישִׁית לְפַרְעֹה
  choice: మీరు ఐదో వంతు ఫరోకు ఇవ్వాలి
  rationale: חֲמִישִׁית అంటే ఐదింట ఒక వంతు. నిర్దేశిత ఏర్పాటును సహజంగా తెలియజేయడానికి ‘ఇవ్వాలి’ వాడాం.
- source_word: וְאַרְבַּע הַיָּדֹת
  choice: మిగిలిన నాలుగైదొంతులు[a]
  rationale: అక్షరార్థంగా ‘నాలుగు చేతులు’ అయిన ఈ హీబ్రూ నుడికారం ఐదు భాగాల్లో మిగిలిన నాలుగు భాగాలను సూచిస్తుంది. తెలుగులో అర్థం స్పష్టంగా ఉండేందుకు ‘నాలుగైదొంతులు’ అని అనువదించి, మూల నుడికారాన్ని పాదసూచికలో ఉంచాం.
- source_word: יִהְיֶה לָכֶם
  choice: మీవిగా ఉంటాయి
  rationale: మిగిలిన దిగుబడి వారికి చెందుతుందని, దాని వినియోగ హక్కు వారిదని ఈ పదబంధం తెలియజేస్తుంది.
- source_word: לְזֶרַע הַשָּׂדֶה
  choice: పొలంలో విత్తడానికి
  rationale: לְ ఇక్కడ ప్రయోజనార్థకంగా ఉంది; తదుపరి సాగు కోసం దాచే విత్తనాన్ని సహజమైన తెలుగులో క్రియాత్మకంగా వ్యక్తం చేశాం.
- source_word: וּלְאָכְלְכֶם
  choice: మీ ఆహారానికి
  rationale: אכל మూలం నుంచి వచ్చిన రూపం ఇక్కడ తినడానికి ఉంచే ఆహారాన్ని సూచిస్తుంది.
- source_word: וְלַאֲשֶׁר בְּבָתֵּיכֶם
  choice: మీ ఇళ్లలో ఉన్నవారికి
  rationale: ఈ సంబంధవాచక పదబంధం ఇంటి వస్తువులను కాకుండా గృహాల్లో ఉన్న వ్యక్తులను సూచిస్తుంది. మూలంలోని విస్తృత సూచనను నిలుపుకోవడానికి ‘ఉన్నవారు’ అని వాడాం.
- source_word: וְלֶאֱכֹל לְטַפְּכֶם
  choice: మీ చిన్నపిల్లల ఆహారానికి
  rationale: טַף సాధారణంగా చిన్నపిల్లలను, సందర్భానుసారంగా ఆధారపడిన కుటుంబ సభ్యులను సూచించవచ్చు. ఇక్కడ కుటుంబ జాబితాలో ఉన్నందున ‘చిన్నపిల్లలు’ సహజమైన ఎంపిక.
