translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన శైలిని వాడాం. మూలంలోని వ్యవసాయ, గృహ సంబంధ పదాలను సహజంగా వ్యక్తం చేస్తూనే ‘నాలుగు చేతులు’ అనే హీబ్రూ నుడికారాన్ని పాదసూచికలో సంరక్షించాం.
