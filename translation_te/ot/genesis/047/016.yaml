  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథన శైలి. హీబ్రూ షరతు రూపాన్ని ప్రధాన పాఠ్యంలో నిలిపి, సందర్భానుసారంగా అవసరమైన కర్మను పాదటిప్పణితో వెల్లడించింది.
