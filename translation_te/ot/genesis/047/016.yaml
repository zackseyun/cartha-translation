  text: וַ/יֹּ֤אמֶר יוֹסֵף֙ הָב֣וּ מִקְנֵי/כֶ֔ם וְ/אֶתְּנָ֥ה לָ/כֶ֖ם בְּ/מִקְנֵי/כֶ֑ם אִם אָפֵ֖ס כָּֽסֶף־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/016.yaml
  text: And Joseph said[a], “Bring your livestock, and I will give to you in exchange for your livestock[b], if the money is gone.”
translation:
  language: te
  text: అప్పుడు యోసేపు, “మీ పశువులను తీసుకురండి. డబ్బు అయిపోయి ఉంటే, మీ పశువులకు బదులుగా నేను మీకు ఆహారం[a] ఇస్తాను” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “మీ పశువులకు బదులుగా నేను మీకు ఇస్తాను”; ఇచ్చేది ‘ఆహారం’ అని సమీప కరవు సందర్భాన్ని బట్టి చేర్చబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָבוּ
  choice: తీసుకురండి
  rationale: ఈ బహువచన ఆజ్ఞారూపం పశువులను అప్పగించడానికి తీసుకురావాలని సూచిస్తుంది; పరిపాలనా లావాదేవీ సందర్భంలో ఇది సహజమైన తెలుగు.
- source_word: מִקְנֵיכֶם
  choice: మీ పశువులు
  rationale: מִקְנֶה అనేది విస్తృతంగా పెంపుడు మందజంతువులను సూచిస్తుంది; ‘పశువులు’ ఆధునిక తెలుగులో సహజంగా ఉండి, ‘ఆవులు’ కంటే విస్తృతార్థాన్ని కాపాడుతుంది.
- source_word: וְאֶתְּנָה לָכֶם
  choice: నేను మీకు ఆహారం ఇస్తాను
  rationale: హీబ్రూలో ఇచ్చే వస్తువు స్పష్టంగా లేదు. అయితే తక్షణ కరవు సందర్భం ఆహారం/ధాన్యాన్ని సూచిస్తున్నందున, తెలుగులో వాక్యం సహజంగా మరియు స్పష్టంగా ఉండేందుకు ‘ఆహారం’ సందర్భానుసారంగా చేర్చబడింది.
- source_word: בְּמִקְנֵיכֶם
  choice: మీ పశువులకు బదులుగా
  rationale: ఇక్కడ בְ సాధనం లేదా మార్పిడిని సూచిస్తుంది; ఈ పదబంధం లావాదేవీ భావాన్ని సహజమైన తెలుగులో స్పష్టం చేస్తుంది.
- source_word: אִם
  choice: అయిపోయి ఉంటే
  rationale: אִם యొక్క ప్రాథమిక షరతు భావాన్ని నిలుపుతూ, పూర్తయిన పరిస్థితిని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; సందర్భంలో దీనికి ‘అయిపోయింది కాబట్టి’ అనే కారణార్థ ఛాయ కూడా ఉండవచ్చు.
- source_word: אָפֵס כָּסֶף
  choice: డబ్బు అయిపోయి
  rationale: אָפֵס పూర్తిగా తరిగిపోవడం లేదా అంతమవడం అనే భావాన్ని ఇస్తుంది; ‘డబ్బు అయిపోయి’ సంక్షిప్తమైన, సాధారణ తెలుగు.
