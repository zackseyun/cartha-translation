source:
  edition: WLC
  text: רַ֛ק אַדְמַ֥ת הַ/כֹּהֲנִ֖ים לֹ֣א קָנָ֑ה כִּי֩ חֹ֨ק לַ/כֹּהֲנִ֜ים מֵ/אֵ֣ת פַּרְעֹ֗ה וְ/אָֽכְל֤וּ אֶת חֻקָּ/ם֙ אֲשֶׁ֨ר נָתַ֤ן לָ/הֶם֙ פַּרְעֹ֔ה עַל כֵּ֕ן לֹ֥א מָכְר֖וּ אֶת אַדְמָתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/022.yaml
  text: Only the land of the priests he did not buy[a], because the priests had an allotment from Pharaoh, and they ate their allotment that Pharaoh gave them. Therefore they did not sell their land.
translation:
  language: te
  text: యాజకుల భూమిని మాత్రం అతడు కొనలేదు. ఎందుకంటే యాజకులకు ఫరో నుండి నిర్ణయించిన ఆహారభాగం[a] ఉండేది; ఫరో తమకు ఇచ్చిన ఆ భాగాన్ని వారు తినేవారు. అందుచేత వారు తమ భూమిని అమ్మలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘నిర్ణీత భృతి,’ ‘కేటాయించిన భాగం,’ లేదా ‘ఆహార రేషన్.’ ఇక్కడి హీబ్రూ పదం חֹק / חֻקָּם ప్రధానంగా చట్టాన్ని కాక, అధికారికంగా కేటాయించిన పోషణను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: మాత్రం
  rationale: ముందటి సాధారణ ప్రకటనకు యాజకుల భూమి మినహాయింపు అని తెలిపే నిర్బంధ భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אַדְמַת הַכֹּהֲנִים
  choice: యాజకుల భూమి
  rationale: యాజకులకు చెందిన భూసంపత్తిని స్పష్టంగా, సంక్షిప్తంగా సూచిస్తుంది.
- source_word: קָנָה
  choice: కొనలేదు
  rationale: కరవు సందర్భంలో యోసేపు భూమిని ధర చెల్లించి స్వాధీనం చేసుకోవడాన్ని తెలిపే సాధారణ వాణిజ్య పదం.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: యాజకుల భూమి ఎందుకు కొనబడలేదో తెలిపే కారణ వాక్యాన్ని స్పష్టంగా పరిచయం చేస్తుంది.
- source_word: חֹק / חֻקָּם
  choice: నిర్ణయించిన ఆహారభాగం / ఆ భాగం
  rationale: ఈ సందర్భంలో చట్టం అనే భావం కంటే అధికారికంగా కేటాయించిన జీవనోపాధి భాగాన్ని సూచిస్తుంది; తరువాతి ‘తినేవారు’ అనే క్రియతో ‘ఆహారభాగం’ సహజంగా సరిపోతుంది.
- source_word: מֵאֵת פַּרְעֹה
  choice: ఫరో నుండి
  rationale: కేటాయింపుకు మూలం ఫరో అని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: וְאָכְלוּ אֶת חֻקָּם
  choice: ఆ భాగాన్ని వారు తినేవారు
  rationale: హీబ్రూలోని ‘తిను’ అనే స్పష్టమైన క్రియను నిలుపుతూ, ముందుగా పేర్కొన్న కేటాయింపును సూచిస్తుంది.
- source_word: אֲשֶׁר נָתַן לָהֶם פַּרְעֹה
  choice: ఫరో తమకు ఇచ్చిన
  rationale: ఆహారభాగాన్ని ఇచ్చినవాడు ఫరో అని సరళమైన సంబంధ వాక్యంతో తెలియజేస్తుంది; ‘తమకు’ యాజకులనే తిరిగి సూచిస్తుంది.
- source_word: עַל כֵּן
  choice: అందుచేత
  rationale: ముందు చెప్పిన కారణం నుండి వచ్చిన ఫలితాన్ని గంభీరమైనప్పటికీ సాధారణంగా అర్థమయ్యే తెలుగులో సూచిస్తుంది.
- source_word: מָכְרוּ אֶת אַדְמָתָם
  choice: వారు తమ భూమిని అమ్మలేదు
  rationale: వాణిజ్య చర్యను, భూమి యాజకులదేనన్న భావాన్ని నేరుగా వ్యక్తం చేస్తుంది.
