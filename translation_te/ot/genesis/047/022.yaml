translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. హీబ్రూ వాక్యంలోని కారణ–ఫలిత క్రమం, ‘తినేవారు’ అనే స్పష్టమైన రూపకం నిలుపబడ్డాయి; అస్పష్టమైన కేటాయింపు స్వరూపాన్ని పాదటీపులో ప్రత్యామ్నాయాలతో సంరక్షించాం.
