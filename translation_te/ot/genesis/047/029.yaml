source:
  edition: WLC
  text: וַ/יִּקְרְב֣וּ יְמֵֽי יִשְׂרָאֵ֘ל לָ/מוּת֒ וַ/יִּקְרָ֣א לִ/בְנ֣/וֹ לְ/יוֹסֵ֗ף וַ/יֹּ֤אמֶר ל/וֹ֙ אִם נָ֨א מָצָ֤אתִי חֵן֙ בְּ/עֵינֶ֔י/ךָ שִֽׂים נָ֥א יָדְ/ךָ֖ תַּ֣חַת יְרֵכִ֑/י וְ/עָשִׂ֤יתָ עִמָּדִ/י֙ חֶ֣סֶד וֶ/אֱמֶ֔ת אַל נָ֥א תִקְבְּרֵ֖/נִי בְּ/מִצְרָֽיִם־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/029.yaml
  text: When the days of Israel drew near for him to die[a], he called his son Yosef and said to him, “If now I have found favor in your eyes, please put your hand under my thigh, and deal with me in steadfast love and faithfulness[b]. Please do not bury me in Egypt.”
translation:
  language: te
  text: 'ఇశ్రాయేలు మరణించే సమయం సమీపించినప్పుడు, అతడు తన కుమారుడైన యోసేపును పిలిచి అతనితో ఇలా అన్నాడు: “నీ దృష్టిలో నాకు అనుగ్రహం లభించి ఉంటే, దయచేసి నీ చెయ్యి నా తొడ కింద పెట్టి[a], నాపట్ల నిబద్ధమైన ప్రేమను, విశ్వసనీయతను చూపించు[b]. దయచేసి నన్ను ఐగుప్తులో పాతిపెట్టవద్దు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “నీ చెయ్యి నా తొడ కింద పెట్టి” అనేది పితరుల కథనాల్లో గంభీరమైన ప్రమాణానికి సంబంధించిన చర్య; ఆదికాండము 24:2తో పోల్చండి.
    reason: cultural_note
  - marker: b
    text: లేదా “విశ్వాసపాత్రమైన ప్రేమను, నమ్మకత్వాన్ని.” హీబ్రూ పదజంట חֶסֶד וֶאֱמֶת స్థిరమైన, నమ్మదగిన దయను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְבוּ יְמֵי יִשְׂרָאֵל לָמוּת
  choice: ఇశ్రాయేలు మరణించే సమయం సమీపించినప్పుడు
  rationale: హీబ్రూ నుడికారం అక్షరార్థంగా ‘ఇశ్రాయేలు చనిపోవడానికి రోజులు దగ్గరపడ్డాయి’ అని ఉన్నా, ఆధునిక తెలుగులో అదే భావాన్ని సహజంగా, గంభీరంగా వ్యక్తం చేయడానికి ‘మరణించే సమయం సమీపించింది’ అని అనువదించబడింది.
- source_word: יִשְׂרָאֵל
  choice: ఇశ్రాయేలు
  rationale: మూలపాఠంలో ‘యాకోబు’ కాక ‘ఇశ్రాయేలు’ అనే పేరు ఉంది; అందువల్ల అదే పేరు నిలుపబడింది.
- source_word: לִבְנוֹ לְיוֹסֵף
  choice: తన కుమారుడైన యోసేపును
  rationale: యోసేపు ఇశ్రాయేలు కుమారుడని స్పష్టంగా, సహజమైన తెలుగు నిర్మాణంలో తెలిపింది.
- source_word: אִם נָא מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: నీ దృష్టిలో నాకు దయ దొరికితే
  rationale: ఇది వినయపూర్వక అభ్యర్థనను పరిచయం చేసే హీబ్రూ నుడికారం. ‘నీ దృష్టిలో’ మూలంలోని దృశ్యరూపాన్ని ఉంచుతూ తెలుగులో అర్థమయ్యేలా ఉంది.
- source_word: שִׂים נָא יָדְךָ תַּחַת יְרֵכִי
  choice: దయచేసి నీ చెయ్యి నా తొడ కింద పెట్టి
  rationale: పితరుల కథనాల్లోని ప్రమాణ సూచక చర్యను మూలంలోని స్పష్టతతో నిలిపి, దాని సాంస్కృతిక అర్థాన్ని పాదసూచికలో వివరించింది.
- source_word: וְעָשִׂיתָ עִמָּדִי חֶסֶד וֶאֱמֶת
  choice: నాపట్ల నిబద్ధమైన ప్రేమతో, విశ్వసనీయతతో వ్యవహరించు
  rationale: חֶסֶד లోని స్థిరమైన, విశ్వాసపాత్రమైన ప్రేమను ‘నిబద్ధమైన ప్రేమ’ తెలియజేస్తుంది; אֱמֶת ఇక్కడ నమ్మదగిన నిజాయితీ లేదా విశ్వసనీయతను సూచిస్తుంది. ‘వ్యవహరించు’ అనేది עשה עם అనే నుడికారానికి సహజ తెలుగు సమానం.
- source_word: אַל נָא תִקְבְּרֵנִי בְּמִצְרָיִם
  choice: దయచేసి నన్ను ఐగుప్తులో పాతిపెట్టవద్దు
  rationale: నిషేధాత్మక అభ్యర్థనలోని נָא పదం ఇచ్చే వినయపూర్వక వేడుకోలును ‘దయచేసి’ ద్వారా నిలిపింది.
theological_decisions:
- issue: חֶסֶד וֶאֱמֶת అనే పదజంట యొక్క భావవ్యాప్తి
  choice: నిబద్ధమైన ప్రేమతో, విశ్వసనీయతతో
  alternative: కృపతో, సత్యంతో; విశ్వాసపాత్రమైన ప్రేమతో, నమ్మకత్వంతో
  rationale: ఈ సందర్భంలో పదజంట కేవలం భావోద్వేగ ప్రేమను కాక, కుటుంబ బాధ్యతలో స్థిరమైన దయను మరియు నమ్మదగిన చర్యను సూచిస్తుంది. ‘నిబంధన’ అనే పదాన్ని మూలంలో ప్రత్యక్షంగా లేకుండానే చేర్చి భావాన్ని అతిగా నిర్దిష్టం చేయకుండా, దాని సంబంధపరమైన నిబద్ధతను నిలిపింది.
- issue: ‘చెయ్యి నా తొడ కింద పెట్టు’ అనే ప్రమాణ చర్య
  choice: ప్రధాన పాఠంలో అక్షరార్థానికి దగ్గరగా ఉంచి పాదసూచికలో వివరించడం
  alternative: ‘నాతో ప్రమాణం చేయి’ అని భావానువాదం చేయడం
  rationale: మూలంలోని శరీరచర్య కథనానికి సాంస్కృతిక స్పష్టతను, గంభీరతను ఇస్తుంది. దానిని కేవలం ‘ప్రమాణం చేయి’గా మార్చితే మూలపాఠపు ప్రత్యేక రూపం కనుమరుగవుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరమైన కథనశైలి ఉపయోగించబడింది. ‘ఇశ్రాయేలు,’ ‘యోసేపు,’ ‘ఐగుప్తు’ అనే రూపాలు తెలుగు బైబిలు వాడుకలో సుపరిచితమైన పేర్లుగా నిలుపబడ్డాయి. రెండు נָא పదాల వినయపూర్వక అభ్యర్థన శక్తిని రెండుసార్లు ‘దయచేసి’ అని వ్యక్తం చేసింది.
