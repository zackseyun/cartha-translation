  to: 'ఇశ్రాయేలు మరణించే సమయం సమీపించినప్పుడు, అతడు తన కుమారుడైన యోసేపును పిలిచి అతనితో ఇలా అన్నాడు: “నీ దృష్టిలో నాకు అనుగ్రహం లభించి ఉంటే, దయచేసి నీ చెయ్యి నా తొడ కింద పెట్టి[a], నాపట్ల నిబద్ధమైన ప్రేమను, విశ్వసనీయతను చూపించు[b]. దయచేసి నన్ను ఐగుప్తులో పాతిపెట్టవద్దు.”'
  rationale: The revision improves two Telugu idioms while retaining all source-text elements and the existing anchors. “అనుగ్రహం లభించి ఉంటే” better represents the respectful Hebrew favor formula, and “ప్రేమను, విశ్వసనీయతను చూపించు” is a natural equivalent for the request to act toward Israel with חֶסֶד וֶאֱמֶת.
