source:
  edition: WLC
  text: וַ/יְבָ֥רֶךְ יַעֲקֹ֖ב אֶת פַּרְעֹ֑ה וַ/יֵּצֵ֖א מִ/לִּ/פְנֵ֥י פַרְעֹֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/010.yaml
  text: Then Jacob blessed Pharaoh and went out from Pharaoh’s presence[a].
translation:
  language: te
  text: అప్పుడు యాకోబు ఫరోను ఆశీర్వదించి, ఫరో సన్నిధి నుండి బయలుదేరాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఫరోకు అభివాదం చేసి’ / ‘ఫరో వద్ద సెలవు తీసుకొని’; హీబ్రూ క్రియకు సాధారణంగా ‘ఆశీర్వదించాడు’ అని అర్థం, అయితే రాజసభ సందర్భాల్లో అది మర్యాదపూర్వక అభివాదం లేదా వీడ్కోలుతో కలిసిన భావాన్ని కలిగి ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבָרֶךְ
  choice: ఆశీర్వదించి
  rationale: ברך అనే క్రియకు సాధారణ అర్థం ‘ఆశీర్వదించు.’ రాజసభ సందర్భంలో ఇది మర్యాదపూర్వక అభివాదం లేదా వీడ్కోలును కూడా సూచించవచ్చు; అయినా 7, 10 వచనాల్లోని ఒకే క్రియకు ప్రధానమైన సహజ అర్థాన్ని నిలుపుకున్నాం.
- source_word: יַעֲקֹב
  choice: యాకోబు
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తి పేరు.
- source_word: אֶת
  choice: '[ప్రత్యక్ష కర్మ సూచిక—అనువదించలేదు]'
  rationale: హీబ్రూ ప్రత్యక్ష కర్మ సూచికకు తెలుగులో ప్రత్యేక పదరూపం అవసరం లేదు.
- source_word: פַּרְעֹה
  choice: ఫరో
  rationale: ఈజిప్టు రాజబిరుదుకు తెలుగులో ప్రాచుర్యంలో ఉన్న రూపం.
- source_word: וַיֵּצֵא
  choice: బయలుదేరాడు
  rationale: יצא అంటే ‘బయటికి వెళ్లు/వచ్చు.’ రాజసన్నిధిలోని భేటీ ముగించి వెళ్లడాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: מִלִּפְנֵי
  choice: ఫరో సన్నిధి నుండి
  rationale: అక్షరార్థంగా ‘ఫరో ఎదుటి నుండి’; రాజు సమక్షం నుండి వెళ్లడాన్ని ‘సన్నిధి నుండి’ గౌరవప్రదంగా, సహజంగా తెలియజేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం. ‘సన్నిధి’ రాజసభ సందర్భానికి తగిన మర్యాదా స్థాయిని ఇస్తుంది; మూలంలోని ‘ఆశీర్వదించాడు’ అనే ప్రధాన భావాన్ని పాదసూచికలోని సందర్భానుగుణ ప్రత్యామ్నాయాలతో సమతుల్యం చేశాం.
