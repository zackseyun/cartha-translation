id: GEN.47.26
reference: Genesis 47:26
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּ֣שֶׂם אֹתָ֣/הּ יוֹסֵ֡ף לְ/חֹק֩ עַד הַ/יּ֨וֹם הַ/זֶּ֜ה עַל אַדְמַ֥ת מִצְרַ֛יִם לְ/פַרְעֹ֖ה לַ/חֹ֑מֶשׁ רַ֞ק אַדְמַ֤ת הַ/כֹּֽהֲנִים֙ לְ/בַדָּ֔/ם לֹ֥א הָיְתָ֖ה לְ/פַרְעֹֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/026.yaml
  text: 'So Joseph made it a statute that stands to this day concerning the land of Egypt: the fifth is for Pharaoh[d][c][b][a]. Only the land of the priests alone did not become Pharaoh’s.'
translation:
  language: te
  text: 'కాబట్టి యోసేపు దానిని ఈజిప్టు భూమికి సంబంధించిన, ఈనాటివరకు అమలులో ఉన్న శాసనంగా స్థాపించాడు: అయిదింట ఒక వంతు ఫరోకు చెందాలి.[a] యాజకుల భూమి ఒక్కటే ఫరోది కాలేదు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అంటే, అయిదింట ఒక వంతు (20 శాతం) ఫరోకు చెందాలి.
    reason: lexical_clarification
lexical_decisions:
- source_word: וַיָּשֶׂם אֹתָהּ לְחֹק
  choice: దానిని … శాసనంగా స్థాపించాడు
  rationale: שׂוּם అనే క్రియకు ప్రాథమికంగా ‘పెట్టడం/నియమించడం’ అనే అర్థం ఉన్నా, חֹקతో కూడిన ఈ న్యాయపరమైన సందర్భంలో ఒక నియమాన్ని అధికారికంగా స్థాపించడాన్ని సూచిస్తుంది. אֹתָהּ ముందటి వచనంలో వివరించిన విధానాన్ని సూచిస్తున్నందున ‘దానిని’ అని అనువదించాం.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: ఈనాటివరకు అమలులో ఉన్న
  rationale: ఈ శాసనం కథకుని కాలంవరకు కొనసాగిందనే భావాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టం చేస్తుంది; ఇది శాసనానికే అన్వయించేలా వాక్యనిర్మాణం చేశాం.
- source_word: עַל אַדְמַת מִצְרַיִם
  choice: ఈజిప్టు భూమికి సంబంధించిన
  rationale: ఇక్కడ עַל శాసనం వర్తించే పరిధిని సూచిస్తుంది. ‘సంబంధించిన’ అనే రూపం ఈజిప్టు భూమిపై అమలైన నియమమనే భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: לְפַרְעֹה לַחֹמֶשׁ
  choice: ఐదవ వంతు ఫరోకు చెందాలి
  rationale: సంక్షిప్తమైన హీబ్రూ పదబంధంలోని గ్రహీతను, నిర్ణీత వాటాను తెలుగులో స్పష్టమైన నియమవాక్యంగా వ్యక్తం చేస్తుంది. לַחֹמֶשׁ నిర్ణీత ఐదవ భాగాన్ని సూచిస్తుంది.
- source_word: רַק אַדְמַת הַכֹּהֲנִים לְבַדָּם
  choice: యాజకుల భూమి మాత్రమే
  rationale: רַק మరియు לְבַדָּם రెండూ మినహాయింపును బలపరుస్తాయి. తెలుగులో ‘మాత్రమే’ ఈ సంయుక్త నిర్దిష్టతను సహజంగా వ్యక్తం చేస్తూ అనవసర పునరుక్తిని నివారిస్తుంది.
- source_word: לֹא הָיְתָה לְפַרְעֹה
  choice: ఫరోది కాలేదు
  rationale: היה + ל నిర్మాణం ఇక్కడ యాజకుల భూమి ఫరో యాజమాన్యంలోకి రాలేదనే ఫలితస్థితిని సూచిస్తుంది. ‘ఫరోది కాలేదు’ ఆ మార్పు జరగలేదనే భావాన్ని సంక్షిప్తంగా కాపాడుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, న్యాయపరమైన సందర్భానికి తగిన గౌరవప్రదమైన శైలిని ఉపయోగించాం. ‘శాసనం’, ‘స్థాపించాడు’ అనే పదాలు అధికారికతను నిలుపుతాయి; మిగతా వాక్యనిర్మాణం సాధారణ పాఠకులకు సులభంగా ఉండేలా ఉంచాం.
