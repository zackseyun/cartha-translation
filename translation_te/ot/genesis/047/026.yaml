  to: 'కాబట్టి యోసేపు దానిని ఈజిప్టు భూమికి సంబంధించిన, ఈనాటివరకు అమలులో ఉన్న శాసనంగా స్థాపించాడు: అయిదింట ఒక వంతు ఫరోకు చెందాలి.[a] యాజకుల భూమి ఒక్కటే ఫరోది కాలేదు.'
