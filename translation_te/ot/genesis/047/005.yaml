    text: 'మరింత పదరూపంగా: “ఫరో యోసేపుతో ఇలా అన్నాడు: ‘నీ తండ్రి, నీ సోదరులు నీ దగ్గరికి వచ్చారు.’”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... అన్నాడు
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది. ఆధునిక తెలుగులో సహజంగా ఉండే ‘అప్పుడు ... అన్నాడు’ క్రమానుగత భావాన్ని నిలుపుతుంది.
- source_word: פַּרְעֹה
  choice: ఫరో
  rationale: ఈజిప్టు రాజుకు వాడిన బిరుదుకు తెలుగులో స్థిరపడిన రూపం.
- source_word: אֶל יוֹסֵף
  choice: యోసేపుతో
  rationale: אֶל ఇక్కడ మాట ఎవరిని ఉద్దేశించి చెప్పబడిందో సూచిస్తుంది; తెలుగులో ‘యోసేపుతో’ సహజమైన సమానార్థకం.
- source_word: לֵאמֹר
  choice: ప్రధాన వాక్యంలో ప్రత్యేకంగా అనువదించలేదు
  rationale: మాటల క్రియ తర్వాత ప్రత్యక్ష సంభాషణను పరిచయం చేసే హెబ్రీయ సంప్రదాయ ప్రయోగం. ‘అన్నాడు’తో తెలుగులో దాని పని ఇప్పటికే వ్యక్తమవుతుంది; పాదటిప్పణిలో పదరూప అనువాదం ఇవ్వబడింది.
- source_word: אָבִיךָ
  choice: నీ తండ్రి
  rationale: యోసేపును నేరుగా ఉద్దేశించిన ఏకవచన ద్వితీయ పురుష స్వామ్యరూపం.
- source_word: וְאַחֶיךָ
  choice: నీ సోదరులు
  rationale: אַחִים యొక్క పురుష బంధుత్వార్థాన్ని ‘కుటుంబం’గా సాధారణీకరించకుండా నిలుపుతుంది; ‘సోదరులు’ ఆధునిక ప్రామాణిక తెలుగుకు తగిన గౌరవప్రద రూపం.
- source_word: בָּאוּ
  choice: వచ్చారు
  rationale: పూర్తయిన రాకను, సంభాషణ సమయానికి ఉన్న ఫలితంతో సహా, తెలుగు భూతకాల రూపం సహజంగా తెలియజేస్తుంది.
- source_word: אֵלֶיךָ
  choice: నీ దగ్గరికి
  rationale: యోసేపు వైపు జరిగిన గమనాన్ని సహజ తెలుగులో వ్యక్తపరుస్తుంది; మూలంలో లేని ‘ఇక్కడికి’ అనే పదాన్ని చేర్చదు.
