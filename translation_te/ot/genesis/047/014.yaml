- from: ఐగుప్తు దేశంలోనూ కనాను దేశంలోనూ ఉన్న వెండి అంతటినీ[a], వారు కొంటున్న ధాన్యానికి చెల్లింపుగా యోసేపు సేకరించాడు. ఆ వెండిని యోసేపు ఫరో ఇంట్లోకి[b] తీసుకొచ్చాడు.
