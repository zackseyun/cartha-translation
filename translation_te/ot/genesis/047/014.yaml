translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలిని వాడాం. మూలంలోని ‘వారు’ అనే అస్పష్ట కర్తను స్పష్టీకరించకుండా అలాగే నిలిపాం. ‘వెండి’ మరియు ‘ఫరో ఇల్లు’ అనే సాంస్కృతికంగా విస్తృతార్థం కలిగిన పదాలను ప్రధాన వచనంలో ఉంచి, ప్రత్యామ్నాయ అర్థాలను పాదసూచికల్లో ఇచ్చాం.
