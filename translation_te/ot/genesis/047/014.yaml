source:
  edition: WLC
  text: וַ/יְלַקֵּ֣ט יוֹסֵ֗ף אֶת כָּל הַ/כֶּ֨סֶף֙ הַ/נִּמְצָ֤א בְ/אֶֽרֶץ מִצְרַ֨יִם֙ וּ/בְ/אֶ֣רֶץ כְּנַ֔עַן בַּ/שֶּׁ֖בֶר אֲשֶׁר הֵ֣ם שֹׁבְרִ֑ים וַ/יָּבֵ֥א יוֹסֵ֛ף אֶת הַ/כֶּ֖סֶף בֵּ֥יתָ/ה פַרְעֹֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/014.yaml
  text: And Joseph gathered up all the silver found in the land of Egypt and in the land of Canaan for the grain that they were buying[b][a], and Joseph brought the silver into Pharaoh’s house.
translation:
  language: te
  text: ఐగుప్తు దేశంలోనూ కనాను దేశంలోనూ లభ్యమైన వెండి అంతటినీ[a], వారు కొంటున్న ధాన్యానికి చెల్లింపుగా యోసేపు సేకరించాడు. ఆ వెండిని యోసేపు ఫరో ఇంట్లోకి[b] తీసుకొచ్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘డబ్బు అంతటినీ.’ హీబ్రూ మూలంలో అక్షరార్థంగా ‘వెండి అంతటినీ’ అని ఉంది; ఇక్కడ వెండిని చెల్లింపు సాధనంగా పేర్కొన్నారు.
    reason: lexical_alternative
  - marker: b
    text: ‘ఫరో ఇల్లు’ అనేది రాజనివాసాన్ని మాత్రమే కాక, ఫరో రాజగృహాన్ని లేదా ఖజానాను కూడా సూచించవచ్చు.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְלַקֵּט
  choice: సేకరించాడు
  rationale: לָקַט అనే క్రియకు ‘ఏరడం, పోగుచేయడం, సేకరించడం’ అనే భావం ఉంది. అనేక ధాన్య లావాదేవీల ద్వారా వచ్చిన వెండిని కూడబెట్టడాన్ని ‘సేకరించాడు’ సహజంగా తెలియజేస్తుంది.
- source_word: כָּל הַכֶּסֶף
  choice: వెండి అంతటినీ
  rationale: כֶּסֶף ప్రాథమికంగా ‘వెండి’ని, విస్తృతార్థంలో ‘డబ్బు’ను సూచిస్తుంది. మూలపాఠంలోని స్పష్టమైన లోహపదాన్ని ప్రధాన వచనంలో నిలిపి, దాని ద్రవ్యార్థాన్ని పాదసూచికలో తెలిపాం.
- source_word: הַנִּמְצָא
  choice: ఉన్న
  rationale: מצא ధాతువు నుంచి వచ్చిన ఈ రూపం ‘కనబడినది/అందుబాటులో ఉన్నది’ అనే భావాన్ని ఇస్తుంది. ఆధునిక తెలుగులో ‘ఆ దేశాల్లో ఉన్న వెండి’ సహజంగా ఉండి, అక్కడ లభ్యమైన వెండి మొత్తాన్ని సూచిస్తుంది.
- source_word: בְאֶרֶץ מִצְרַיִם וּבְאֶרֶץ כְּנַעַן
  choice: ఐగుప్తు దేశంలోనూ కనాను దేశంలోనూ
  rationale: రెండు భూభాగాలనూ సమాంతరంగా పేర్కొనే హీబ్రూ నిర్మాణాన్ని నిలిపి, తెలుగులో సహజమైన ‘లోనూ…లోనూ’ రూపాన్ని వాడాం.
- source_word: בַּשֶּׁבֶר
  choice: ధాన్యానికి చెల్లింపుగా
  rationale: యోసేపు కథా సందర్భంలో שֶׁבֶר కరవు సమయంలో కొనబడే ధాన్యాన్ని సూచిస్తుంది. ב ఉపసర్గంలోని లావాదేవీ భావాన్ని ‘చెల్లింపుగా’ స్పష్టం చేస్తుంది.
- source_word: אֲשֶׁר הֵם שֹׁבְרִים
  choice: వారు కొంటున్న
  rationale: ఈ సందర్భంలో שׁבר అంటే ధాన్యం కొనడం. కర్తను మూలంలోని అస్పష్టమైన ‘వారు’గానే ఉంచి, కృదంత రూపంలోని కొనసాగుతున్న చర్యను ‘కొంటున్న’తో ప్రతిబింబించాం.
- source_word: וַיָּבֵא ... בֵּיתָה פַרְעֹה
  choice: ఫరో ఇంట్లోకి తీసుకొచ్చాడు
  rationale: בֵּיתָה లోని దిశాసూచక అంత్యం లోపలికి కదలికను తెలియజేస్తుంది; అందుకే ‘ఇంట్లోకి’ అని అనువదించాం. ‘ఇల్లు’ అనే పదంలోని రాజగృహం, రాజకుటుంబ వ్యవస్థ లేదా ఖజానా అనే విస్తృత అవకాశాన్ని పాదసూచికలో నిలిపాం.
