  register: ఆధునిక ప్రామాణిక తెలుగులో సామాన్య పాఠకులకు అర్థమయ్యేలా, అయితే గంభీరతను నిలుపుతూ అనువదించబడింది. ‘వారిలో ప్రతి ఒక్కరూ తమ పొలాన్ని’ అనే రూపం హీబ్రూలోని సమూహవాచక-విభజన నిర్మాణాన్ని సహజ తెలుగులో అందిస్తుంది; [a], [b] సూచికలు ప్రధాన పాఠ్యంలో ఉంచబడ్డాయి.
