source:
  edition: WLC
  text: וַ/יִּ֨קֶן יוֹסֵ֜ף אֶת כָּל אַדְמַ֤ת מִצְרַ֨יִם֙ לְ/פַרְעֹ֔ה כִּֽי מָכְר֤וּ מִצְרַ֨יִם֙ אִ֣ישׁ שָׂדֵ֔/הוּ כִּֽי חָזַ֥ק עֲלֵ/הֶ֖ם הָ/רָעָ֑ב וַ/תְּהִ֥י הָ/אָ֖רֶץ לְ/פַרְעֹֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/020.yaml
  text: So Joseph bought all the land of Egypt for Pharaoh[a], because every Egyptian sold his field, for the famine was severe upon them[b]; and the land became Pharaoh’s.
translation:
  language: te
  text: అప్పుడు యోసేపు ఫరో కోసం[a] ఐగుప్తు దేశంలోని భూమినంతటినీ కొన్నాడు; కరవు వారి మీద తీవ్రంగా ఉండడంతో[b], ఐగుప్తీయులలో ప్రతి ఒక్కరూ తన పొలాన్ని అమ్మాడు. అలా ఆ భూమి ఫరోది అయింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఫరోకు ఐగుప్తు దేశంలోని భూమినంతటినీ సంపాదించి పెట్టాడు.’
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘కరవు వారి మీద బలంగా ఉంది.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקֶן
  choice: కొన్నాడు
  rationale: కנה అనే క్రియ ఈ అమ్మకం సందర్భంలో ధర చెల్లించి ఆస్తిని సంపాదించడాన్ని సూచిస్తుంది; అందువల్ల ‘కొన్నాడు’ సహజమైన, నేరమైన అనువాదం.
- source_word: כָּל אַדְמַת מִצְרַיִם
  choice: ఐగుప్తు దేశంలోని భూమినంతటినీ
  rationale: אַדְמָה ఇక్కడ మట్టి కంటే యాజమాన్యానికి లోబడిన వ్యవసాయ భూమిని సూచిస్తుంది; כָּל యొక్క సమగ్ర భావాన్ని ‘భూమినంతటినీ’ తెలియజేస్తుంది.
- source_word: לְפַרְעֹה
  choice: ఫరో కోసం
  rationale: לְ ఉపసర్గ కొనుగోలు వల్ల లాభం పొందే వ్యక్తిని లేదా దాని స్వీకర్తను సూచిస్తుంది; యోసేపు ఫరో తరఫున అతని యాజమాన్యానికి భూమిని కొన్నాడనే భావాన్ని ఇది నిలుపుతుంది.
- source_word: מָכְרוּ מִצְרַיִם אִישׁ שָׂדֵהוּ
  choice: ఐగుప్తీయులలో ప్రతి ఒక్కరూ తమ పొలాన్ని అమ్మేశారు
  rationale: సమూహవాచకమైన ‘ఐగుప్తీయులు’తో పాటు אִישׁ שָׂדֵהוּ ఇచ్చే వ్యక్తిగత విభజన భావాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: כִּי חָזַק עֲלֵהֶם הָרָעָב
  choice: కరవు ఐగుప్తీయుల మీద తీవ్రంగా ఉండడంతో
  rationale: חָזַק పదశః ‘బలంగా ఉంది’ అయినా కరవుతో వాడినప్పుడు దాని తీవ్రతను సూచిస్తుంది. ‘మీద’ మూలంలోని עֲלֵהֶם రూపకాన్ని నిలుపుతుంది.
- source_word: וַתְּהִי הָאָרֶץ לְפַרְעֹה
  choice: ఆ భూమి ఫరోది అయింది
  rationale: ఈ వాక్యం యాజమాన్యం ఫరోకు బదిలీ అయిన ఫలితాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
