revisions:
- from: “మేమూ మా భూమీ నీ కళ్లముందే ఎందుకు నశించాలి?[a] ఆహారం కోసం[b] మమ్మల్నీ మా భూమినీ కొనుగోలు చేయి. అప్పుడు మేమూ మా భూమీ ఫరోకు బానిసలమవుతాం.[c] మాకు విత్తనాలు ఇవ్వు; అప్పుడు మేము చనిపోకుండా బతుకుతాం, భూమి పాడుబడదు.”[d]
  to: “మేమూ మా భూమీ నీ కళ్లముందే ఎందుకు నశించిపోవాలి?[a] ఆహారం కోసం[b] మమ్మల్నీ మా భూమినీ కొనుగోలు చేయి. అప్పుడు మేము ఫరోకు బానిసలమవుతాం,[c] మా భూమి ఫరో సొత్తవుతుంది. మేము బతికి చనిపోకుండా ఉండేందుకు, భూమి పాడుబడిపోకుండా ఉండేందుకు మాకు విత్తనం ఇవ్వు.”[d]
  rationale: సవరణ భూమిని వ్యక్తిగత బానిసత్వానికి నేరుగా కట్టిపెట్టే అసహజ ప్రయోగాన్ని తొలగించి, మూలంలోని ఆర్థిక సమర్పణ భావాన్ని—ప్రజలు ఫరోకు బానిసలు కావడం, భూమి ఫరో ఆధీనంలోకి వెళ్లడం—స్పష్టంగా ఉంచుతుంది. చివరి వాక్యాన్ని విత్తనం ఇవ్వాలనే అభ్యర్థనకు సంబంధించిన ఉద్దేశ్యంగా పునర్నిర్మించింది. పాదసూచిక గుర్తులు వాటి సంబంధిత పదబంధాల వద్దనే ఉంచబడ్డాయి.
