id: GEN.47.19
reference: Genesis 47:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: לָ֧/מָּה נָמ֣וּת לְ/עֵינֶ֗י/ךָ גַּם אֲנַ֨חְנוּ֙ גַּ֣ם אַדְמָתֵ֔/נוּ קְנֵֽה אֹתָ֥/נוּ וְ/אֶת אַדְמָתֵ֖/נוּ בַּ/לָּ֑חֶם וְ/נִֽהְיֶ֞ה אֲנַ֤חְנוּ וְ/אַדְמָתֵ֨/נוּ֙ עֲבָדִ֣ים לְ/פַרְעֹ֔ה וְ/תֶן זֶ֗רַע וְ/נִֽחְיֶה֙ וְ/לֹ֣א נָמ֔וּת וְ/הָ/אֲדָמָ֖ה לֹ֥א תֵשָֽׁם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/019.yaml
  text: Why should we die before your eyes[a], both we and our land? Buy us and our land for bread, and we and our land will be servants to Pharaoh. Give seed, so that we may live and not die[e][d][c][b], and the land may not become desolate.
translation:
  language: te
  text: “మేమూ మా భూమీ నీ కళ్లముందే ఎందుకు నశించిపోవాలి?[a] ఆహారం కోసం[b] మమ్మల్నీ మా భూమినీ కొనుగోలు చేయి. అప్పుడు మేము ఫరోకు బానిసలమవుతాం,[c] మా భూమి ఫరో సొత్తవుతుంది. మేము బతికి చనిపోకుండా ఉండేందుకు, భూమి పాడుబడిపోకుండా ఉండేందుకు మాకు విత్తనం ఇవ్వు.”[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీ సమక్షంలోనే.”
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “రొట్టె కోసం.” ఇక్కడ అది ఆహారాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: లేదా, “సేవకులమవుతాం.” హీబ్రూ పదం వివిధ రకాల సేవాస్థితిని సూచించగలదు; ఇక్కడ ఆర్థిక బంధితత్వం ప్రధానంగా కనిపిస్తుంది.
    reason: lexical_alternative
  - marker: d
    text: లేదా, “భూమి నిర్జనమైపోకుండా ఉండేందుకు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָּה נָמוּת
  choice: ఎందుకు నశించాలి?
  rationale: ఇది సాధారణ సమాచార ప్రశ్న కాదు, ప్రాణరక్షణ కోసం చేసిన విన్నపం. మనుషులతోపాటు భూమి గురించీ చెప్పబడుతున్నందున ‘నశించాలి’ అనే పదం రెండింటికీ సహజంగా వర్తిస్తుంది.
- source_word: לְעֵינֶיךָ
  choice: నీ కళ్లముందే
  rationale: యోసేపు చూస్తుండగానే లేదా అతని సమక్షంలో అనే హీబ్రూ నుడికారంలోని దృశ్యబలాన్ని నిలుపుతుంది.
- source_word: גַּם אֲנַחְנוּ גַּם אַדְמָתֵנוּ
  choice: మేమూ మా భూమీ
  rationale: గమ్...గమ్ అనే జత నిర్మాణం ప్రజలనూ వారి భూమినీ సమానంగా కలుపుతుంది.
- source_word: קְנֵה אֹתָנוּ וְאֶת אַדְמָתֵנוּ
  choice: మమ్మల్నీ మా భూమినీ కొనుగోలు చేయి
  rationale: కరువు పరిస్థితిలో ఆహారానికి బదులుగా వ్యక్తులనూ భూమినీ వాణిజ్యపరంగా స్వాధీనం చేసుకోవడాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: בַּלָּחֶם
  choice: ఆహారం కోసం
  rationale: లెహెమ్ అక్షరార్థంగా ‘రొట్టె’ అయినా, ఇక్కడ జీవనాధారమైన ఆహారాన్ని సూచిస్తుంది; బేత్ మార్పిడి ధరను తెలియజేస్తుంది.
- source_word: עֲבָדִים
  choice: బానిసలు
  rationale: ఈ ఆర్థిక-న్యాయ సందర్భంలో స్వేచ్ఛ కోల్పోయి ఫరోకు చెందే బంధిత స్థితి ప్రధానంగా ఉంది; ‘సేవకులు’ ఆ తీవ్రతను తగ్గించవచ్చు.
- source_word: וְתֶן זֶרַע
  choice: మాకు విత్తనాలు ఇవ్వు
  rationale: జెరా ఇక్కడ నాటడానికి అవసరమైన విత్తన ధాన్యాన్ని సూచిస్తుంది. గ్రహీత హీబ్రూలో అంతర్భావమైనా తెలుగులో సహజత కోసం ‘మాకు’ చేర్చబడింది.
- source_word: וְהָאֲדָמָה לֹא תֵשָׁם
  choice: భూమి పాడుబడదు
  rationale: తేషామ్ సాగులేక నిర్జనంగా లేదా పాడుగా మారడాన్ని సూచిస్తుంది; వ్యవసాయ సందర్భంలో ‘పాడుబడదు’ సహజంగా ఉంది.
theological_decisions:
- issue: עֲבָדִים సూచించే సేవాస్థితి తీవ్రత
  choice: బానిసలు
  alternative: సేవకులు
  rationale: ప్రజలు ఆహారం కోసం తమనుతాము, తమ భూమిని ఫరోకు అమ్ముకోవాలని ప్రతిపాదిస్తున్నారు. అందువల్ల కేవలం ఉద్యోగసేవకన్నా బంధిత ఆధీనస్థితిని తెలిపే పదం సందర్భానికి తగినది; అయితే పదానికి విస్తృతార్థం ఉన్నదని పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే గౌరవప్రదమైన విన్నప స్వరం వాడబడింది. ‘నీ కళ్లముందే’ అనే హీబ్రూ నుడికారం నిలుపబడింది. వాక్యాంతంలోని ఉద్దేశ్య-ఫలిత సంబంధాన్ని తెలుగులో సహజంగా చూపేందుకు ‘అప్పుడు’ వాడబడింది.
