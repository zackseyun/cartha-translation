source:
  edition: WLC
  text: וַ/יָּבֹ֣א יוֹסֵף֮ וַ/יַּגֵּ֣ד לְ/פַרְעֹה֒ וַ/יֹּ֗אמֶר אָבִ֨/י וְ/אַחַ֜/י וְ/צֹאנָ֤/ם וּ/בְקָרָ/ם֙ וְ/כָל אֲשֶׁ֣ר לָ/הֶ֔ם בָּ֖אוּ מֵ/אֶ֣רֶץ כְּנָ֑עַן וְ/הִנָּ֖/ם בְּ/אֶ֥רֶץ גֹּֽשֶׁן־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/001.yaml
  text: Then Joseph went in and told Pharaoh[a], “My father and my brothers, with their flocks and their herds and all that they have, have come from the land of Canaan; and behold[c][b], they are in the land of Goshen.”
translation:
  language: te
  text: 'అప్పుడు యోసేపు ఫరో దగ్గరికి వెళ్లి ఇలా తెలియజేశాడు: “నా తండ్రి, నా సహోదరులు తమ మందలతో, పశువులతో, తమకు ఉన్నదంతటితో కనాను దేశం నుంచి వచ్చారు. ఇదిగో, వారు గోషెను దేశంలో ఉన్నారు.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא יוֹסֵף
  choice: అప్పుడు యోసేపు ఫరో దగ్గరికి వెళ్లి
  rationale: בוא సందర్భానుసారంగా రావడం, వెళ్లడం, ప్రవేశించడం అనే అర్థాలు ఇస్తుంది. రాజసన్నిధికి యోసేపు వెళ్లిన భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וַיַּגֵּד לְפַרְעֹה וַיֹּאמֶר
  choice: ఫరో దగ్గరికి వెళ్లి ఇలా తెలియజేశాడు
  rationale: హీబ్రూలోని ‘తెలియజేశాడు, అన్నాడు’ అనే వరుస క్రియలు మాటను పరిచయం చేసే సాధారణ కథన నిర్మాణం. తెలుగులో అనవసర పునరుక్తి లేకుండా నివేదిక భావాన్నీ ప్రత్యక్ష వాక్య పరిచయాన్నీ ‘ఇలా తెలియజేశాడు’ అందిస్తుంది.
- source_word: אָבִי וְאַחַי
  choice: నా తండ్రి, నా సహోదరులు
  rationale: మూలంలోని స్వామ్యార్థాన్ని నేరుగా నిలుపుతుంది; אַחַי ఇక్కడ యోసేపు మగ తోబుట్టువులను సూచిస్తుంది.
- source_word: וְצֹאנָם וּבְקָרָם
  choice: తమ మందలతో, పశువులతో
  rationale: צאן గొర్రెలు-మేకలు వంటి చిన్న పశువుల మందలను, בקר పెద్ద పశువులను సూచిస్తుంది. జాతులను అవసరానికి మించి నిర్దిష్టం చేయకుండా వ్యత్యాసాన్ని నిలుపుతుంది.
- source_word: וְכָל אֲשֶׁר לָהֶם
  choice: తమకు ఉన్నదంతటితో
  rationale: వారికి చెందిన సమస్త ఆస్తిని సంక్షిప్తంగా, మూలానికి సమీపంగా వ్యక్తం చేస్తుంది.
- source_word: בָּאוּ מֵאֶרֶץ כְּנָעַן
  choice: కనాను దేశం నుంచి వచ్చారు
  rationale: హీబ్రూ పరిపూర్ణ క్రియ పూర్తయిన రాకను సూచిస్తుంది. తెలుగు భూతకాల రూపం ప్రస్తుత సందర్భంలో వారి చేరికను సహజంగా తెలియజేస్తుంది.
- source_word: וְהִנָּם
  choice: ఇదిగో, వారు
  rationale: הנה ప్రస్తుత స్థితిపై దృష్టి నిలిపే సూచనాత్మక బలాన్ని ‘ఇదిగో’ కాపాడుతుంది.
- source_word: בְּאֶרֶץ גֹּשֶׁן
  choice: గోషెను దేశంలో
  rationale: మూలంలో ఉన్న ‘దేశం/ప్రాంతం’ అనే భౌగోళిక పదాన్ని నిలుపుతుంది.
