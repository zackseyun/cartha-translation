  terminology: యోసేపు, ఫరో, కనాను, గోషెను అనే పేర్లు స్థిరమైన తెలుగు బైబిలు వాడుకకు అనుగుణంగా ఉన్నాయి. ‘మందలు’ మరియు ‘పశువులు’ వరుసగా צֹאן మరియు בָּקָר మధ్యనున్న విభేదాన్ని జాతులను అతిగా నిర్దిష్టపరచకుండా తగినంతగా వ్యక్తం చేస్తున్నాయి. ‘తమకు ఉన్నదంతటితో’ మూలంలోని సమస్త స్వాస్థ్య భావాన్ని కాపాడుతుంది.
