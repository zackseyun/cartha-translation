  source_fidelity: 'హీబ్రూ కథనంలోని క్రమం, సమాచారమంతా సరిగ్గా ప్రతిఫలించింది: యోసేపు ఫరో వద్దకు వెళ్లడం, తండ్రి మరియు సోదరులు తమ మందలు, పశువులు, సమస్త ఆస్తితో కనాను నుంచి రావడం, గోషెను దేశంలో ఉండడం. וְהִנָּם యొక్క దృష్టి ఆకర్షించే బలం ‘ఇదిగో’ ద్వారా నిలిచింది. ‘వచ్చారు’ హీబ్రూ పరిపూర్ణ క్రియకు సందర్భానుగుణమైన సహజ తెలుగు రూపం.'
