source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר הִשָּֽׁבְעָ/ה֙ לִ֔/י וַ/יִּשָּׁבַ֖ע ל֑/וֹ וַ/יִּשְׁתַּ֥חוּ יִשְׂרָאֵ֖ל עַל רֹ֥אשׁ הַ/מִּטָּֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/031.yaml
  text: He said[a], “Swear to me,” and he swore to him. Then Israel bowed himself on the head of the bed.
translation:
  language: te
  text: అతడు, “నాకు ప్రమాణం చేయి” అన్నాడు. అతడు అతనికి ప్రమాణం చేశాడు. అప్పుడు ఇశ్రాయేలు మంచం[a] తలవైపు వంగి నమస్కరించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తన చేతికర్ర పైభాగం మీద వంగి నమస్కరించాడు.” హెబ్రీ హల్లుల పాఠాన్ని ఈ విధంగానూ చదవవచ్చు. సెప్టువజింట్‌లోను హెబ్రీయులు 11:21లోను ఈ భావమే కనిపిస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: הִשָּׁבְעָה
  choice: ప్రమాణం చేయి
  rationale: ఆజ్ఞార్థక ప్రమాణ సూత్రాన్ని సహజమైన, నేరైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: וַיִּשָּׁבַע
  choice: ప్రమాణం చేశాడు
  rationale: ముందున్న ఆజ్ఞలోని అదే ప్రమాణ క్రియతో పదసామ్యాన్ని నిలుపుతుంది.
- source_word: וַיִּשְׁתַּחוּ
  choice: వంగి నమస్కరించాడు
  rationale: ఈ క్రియ శారీరకంగా వంగడాన్నీ, ఆరాధనాత్మక నమస్కారాన్నీ సూచించగలదు. ఇక్కడ కర్మ స్పష్టంగా పేర్కొనబడనందున ‘వంగి నమస్కరించాడు’ అని అనువదించడం చర్యను తెలియజేస్తూ, అది దేవునికి చేసిన ఆరాధనే అని ప్రధాన పాఠ్యంలో తేల్చదు.
- source_word: יִשְׂרָאֵל
  choice: ఇశ్రాయేలు
  rationale: మూలపాఠం ఎంచుకున్న వ్యక్తినామాన్ని ‘యాకోబు’గా సమన్వయపరచకుండా యథాతథంగా ఉంచుతుంది.
- source_word: עַל רֹאשׁ הַמִּטָּה
  choice: మంచం తలవైపు
  rationale: మసొరేటిక్ పఠనంలోని స్థలసంబంధ భావాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది; అసహజమైన ‘మంచం తల మీద’ అనే భావాన్ని నివారిస్తుంది.
- source_word: הַמִּטָּה
  choice: మంచం
  rationale: మసొరేటిక్ స్వరచిహ్నాల ప్రకారం పదం ‘మంచం’ అని చదవబడుతుంది; సందర్భానికీ ఇది సరిపోతుంది.
theological_decisions:
- issue: హెబ్రీయులు 11:21లో సెప్టువజింట్‌కు సంబంధించిన ‘చేతికర్ర’ పఠనం కనిపిస్తుండగా, మసొరేటిక్ పాఠం ‘మంచం’ అని చదువుతుంది.
  choice: మంచం
  alternative: చేతికర్ర
  rationale: ఆదికాండం ప్రధాన పాఠ్యంలో అందుబాటులో ఉన్న మసొరేటిక్ హెబ్రీ పఠనానికి ప్రాధాన్యం ఇచ్చాం. అయితే స్వరచిహ్నాలు లేని హల్లుల పాఠాన్ని ‘చేతికర్ర’గానూ చదవవచ్చు; ఆ పఠనం సెప్టువజింట్‌లోను హెబ్రీయులు 11:21లోను ప్రతిఫలించినందున దానిని పాదటిప్పణిలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయినా గంభీరమైన కథనశైలిని కాపాడాం. ‘వంగి నమస్కరించాడు’ అనే ప్రయోగం శారీరక చర్యను తెలియజేస్తూ ఆరాధనకు సంబంధించిన సాధ్యమైన భావాన్ని పూర్తిగా తొలగించదు.
