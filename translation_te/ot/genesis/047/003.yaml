- from: ఫరో యోసేపు సహోదరులతో, “మీ వృత్తి[a] ఏమిటి?” అని అడిగాడు. వారు ఫరోతో, “నీ సేవకులమైన మేము మందలను కాసేవాళ్లం[b]; మేమూ మా పితరులూ అంతే” అన్నారు.
  to: ఫరో అతని సోదరులతో, “మీ వృత్తి[a] ఏమిటి?” అని అడిగాడు. వారు ఫరోతో, “మీ సేవకులమైన మేము మందల కాపరులము[b]; మేము, మా పితరులూ అలాగే ఉన్నాము” అన్నారు.
