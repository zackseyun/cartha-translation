translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే గౌరవప్రదమైన కథన శైలి వాడబడింది. ఫరోను ఉద్దేశించిన మాటలో ఏకవచన ‘నీ’ వాడటం హెబ్రీయు రూపాన్నీ, తెలుగు బైబిలు కథన సంప్రదాయాన్నీ అనుసరిస్తుంది; ఇది అవమాన సూచకం కాదు.
