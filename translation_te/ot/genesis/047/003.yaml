  yaml_path: translation/ot/genesis/047/003.yaml
  text: And Pharaoh said to his brothers[a], “What is your occupation?” And they said to Pharaoh, “Your servants are shepherds of flocks[b], both we and our fathers.”
translation:
  language: te
  text: ఫరో అతని సోదరులతో, “మీ వృత్తి[a] ఏమిటి?” అని అడిగాడు. వారు ఫరోతో, “మీ సేవకులమైన మేము మందల కాపరులము[b]; మేము, మా పితరులూ అలాగే ఉన్నాము” అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీ పని ఏమిటి?”
    reason: lexical_alternative
  - marker: b
    text: హెబ్రీయులో, “మందల కాపరులు”; అంటే, ముఖ్యంగా గొర్రెలు, మేకల మందలను కాచేవారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה מַּעֲשֵׂיכֶם
  choice: మీ వృత్తి ఏమిటి?
  rationale: מַעֲשֶׂה సాధారణంగా పని, కార్యం అనే అర్థాలను ఇస్తుంది; ఇక్కడ ఫరో వారి జీవనోపాధి లేదా వృత్తిని అడుగుతున్నాడు. ఆధునిక తెలుగులో ‘వృత్తి’ ఈ సందర్భాన్ని సహజంగా, సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: רֹעֵה צֹאן
  choice: మందలను కాసేవాళ్లం
  rationale: ఈ పదబంధం గొర్రెలు, మేకలు వంటి చిన్న పశువుల మందలను కాచే వృత్తిని సూచిస్తుంది. ‘మందలను కాసేవాళ్లం’ తెలుగులో సహజంగా ఉండి, క్రియాత్మకమైన హెబ్రీయు రూపాన్ని ప్రతిబింబిస్తుంది.
- source_word: עֲבָדֶיךָ
  choice: నీ సేవకులమైన మేము
  rationale: עֶבֶד దాసుడు లేదా సేవకుడు అనే విస్తృత అర్థం కలిగినప్పటికీ, ఇక్కడ రాజైన ఫరోను సంబోధించే వినయపూర్వక స్వీయనిర్దేశం. అందువల్ల ‘నీ సేవకులు’ సందర్భోచితం.
- source_word: גַּם אֲנַחְנוּ גַּם אֲבוֹתֵינוּ
  choice: మేమూ మా పితరులూ అంతే
  rationale: రెండుసార్లు వచ్చిన גַּם తరతరాల కొనసాగింపును నొక్కిచెబుతుంది. ‘మేమూ మా పితరులూ’ ఆ సమాంతర ఉద్ఘాటనను నిలుపుతుంది; ‘అంతే’ ముందున్న వృత్తి వర్ణనను సహజంగా వర్తింపజేస్తుంది.
- source_word: אֶל אֶחָיו
  choice: యోసేపు సహోదరులతో
  rationale: హెబ్రీయులో అక్షరార్థంగా ‘అతని సహోదరులతో’ ఉంది; సందర్భంలో ఆ సర్వనామం యోసేపును సూచిస్తుంది. తెలుగులో సంభావ్య గందరగోళాన్ని నివారించడానికి పేరును స్పష్టంగా ఇచ్చాం.
