  yaml_path: translation/ot/genesis/047/002.yaml
  text: From among his brothers he took five men and presented them before Pharaoh[a].
translation:
  language: te
  text: అతడు తన సహోదరులలోనుండి ఐదుగురిని తీసుకొని ఫరో ఎదుట నిలబెట్టాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తన సహోదరుల చివరనుండి” లేదా “తన సహోదరులలో శ్రేష్ఠులైనవారిలోనుండి.” హీబ్రూ మాటకు అక్షరార్థంగా “అంచు/చివర నుండి” అనే భావం ఉంది; అయితే ఇక్కడ యోసేపు తన సహోదరులలోనుండి ఐదుగురిని ఎంపిక చేశాడనే విభాగార్థం ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִקְצֵה
  choice: లోనుండి
  rationale: מִקְצֵה అనే పదబంధం అక్షరార్థంగా ‘అంచు/చివర నుండి’ అని ఉన్నా, ఈ సందర్భంలో పెద్ద సమూహంలోనుండి కొందరిని తీసుకోవడాన్ని సూచించే విభాగార్థక ప్రయోగంగా సహజంగా అర్థమవుతుంది.
- source_word: אֶחָיו
  choice: తన సహోదరులు
  rationale: ఇక్కడ אָח పదం యోసేపు సొంత అన్నదమ్ములను సూచిస్తుంది; అందువల్ల విస్తృతార్థమున్న ‘బంధువులు’ కంటే ‘సహోదరులు’ ఖచ్చితమైనది.
- source_word: לָקַח
  choice: తీసుకొని
  rationale: לָקַח యొక్క సాధారణ అర్థమైన ‘తీసుకొను’ను నిలుపుతూ, ఐదుగురిని ఎంపిక చేసిన సందర్భార్థం కూడా స్పష్టంగా ఉంటుంది.
- source_word: חֲמִשָּׁה אֲנָשִׁים
  choice: ఐదుగురిని
  rationale: తెలుగులో వీరు ఇప్పటికే ‘సహోదరులు’గా పేర్కొనబడినందున ‘ఐదుగురు మనుష్యులను’ అనే అసహజ పునరుక్తికి బదులు వ్యక్తులను సూచించే ‘ఐదుగురిని’ సహజంగా ఉంటుంది.
- source_word: וַיַּצִּגֵם
  choice: వారిని నిలబెట్టాడు
  rationale: యָצַג హిఫీల్ రూపం ‘నిలబెట్టు/ఉంచు/సమక్షంలో ప్రవేశపెట్టు’ అనే భావాన్ని ఇస్తుంది. ఫరో సమక్షంలో వారిని అధికారికంగా ఉంచిన భావాన్ని ‘నిలబెట్టాడు’ ప్రత్యక్షంగా నిలుపుతుంది.
- source_word: לִפְנֵי פַרְעֹה
  choice: ఫరో ఎదుట
  rationale: לִפְנֵי అంటే ‘ఎదుట/సమక్షంలో’; కథన శైలిలో ‘ఫరో ఎదుట’ సంక్షిప్తంగా, సహజంగా ఉంది.
