  yaml_path: translation/ot/genesis/047/008.yaml
  text: And Pharaoh said to Jacob[b][a], “How many are the days of the years of your life?”
translation:
  language: te
  text: 'అప్పుడు ఫరో యాకోబుతో ఇలా అన్నాడు: “నీ జీవితపు సంవత్సరాల రోజులు ఎన్ని?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అంటే, “నీ వయసెంత?” హీబ్రూలో ఈ ప్రశ్న అక్షరార్థంగా, “నీ జీవితపు సంవత్సరాల రోజులు ఎన్ని?” అని ఉంది.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... అడిగాడు
  rationale: వావ్-క్రమరూపం కథనాన్ని ముందుకు నడిపిస్తుంది. మాట ప్రశ్నరూపంలో ఉన్నందున తెలుగులో సహజంగా ‘అడిగాడు’ అని అనువదించాం.
- source_word: פַּרְעֹה
  choice: ఫరో
  rationale: రాజబిరుదుకు తెలుగులో స్థిరపడిన బైబిలు రూపం.
- source_word: אֶל יַעֲקֹב
  choice: యాకోబుతో
  rationale: సంబోధితుని సూచించే אֶל‌ను తెలుగు సంభాషణలో సహజమైన ‘తో’ విభక్తితో వ్యక్తపరిచాం.
- source_word: כַּמָּה
  choice: ఎన్ని
  rationale: రోజులు/సంవత్సరాల సంఖ్యను అడిగే పరిమాణ ప్రశ్నను నేరుగా వ్యక్తపరుస్తుంది.
- source_word: יְמֵי שְׁנֵי חַיֶּיךָ
  choice: నీ జీవిత సంవత్సరాల రోజులు
  rationale: హీబ్రూ మూలంలోని ‘నీ జీవిత సంవత్సరాల రోజులు’ అనే పొరలుగల కాలవ్యక్తీకరణను నిలుపుతూ, అర్థమయ్యే తెలుగు పదక్రమాన్ని వాడాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథనశైలి. మూలంలోని ప్రత్యేక హీబ్రూ కాలవ్యక్తీకరణను ప్రధాన పాఠ్యంలో నిలిపి, దాని సహజార్థాన్ని పాదటిప్పణిలో ఇచ్చాం.
