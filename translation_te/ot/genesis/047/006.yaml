translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘నీ ముందే ఉంది’ అనే హీబ్రూ రూపకాన్ని పాఠ్యంలో నిలిపి దాని సందర్భార్థాన్ని పాదటిప్పణిలో వివరించాం; పరిపాలనా సందర్భానికి సరిపోయేలా ‘సమర్థులు,’ ‘పర్యవేక్షకులు’ అనే సాధారణంగా అర్థమయ్యే పదాలను వాడాం.
