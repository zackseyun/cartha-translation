source:
  edition: WLC
  text: אֶ֤רֶץ מִצְרַ֨יִם֙ לְ/פָנֶ֣י/ךָ הִ֔וא בְּ/מֵיטַ֣ב הָ/אָ֔רֶץ הוֹשֵׁ֥ב אֶת אָבִ֖י/ךָ וְ/אֶת אַחֶ֑י/ךָ יֵשְׁבוּ֙ בְּ/אֶ֣רֶץ גֹּ֔שֶׁן וְ/אִם יָדַ֗עְתָּ וְ/יֶשׁ בָּ/ם֙ אַנְשֵׁי חַ֔יִל וְ/שַׂמְתָּ֛/ם שָׂרֵ֥י מִקְנֶ֖ה עַל אֲשֶׁר לִֽ/י־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/006.yaml
  text: The land of Egypt is before you[a]. Settle your father and your brothers in the best of the land; let them live in the land of Goshen. And if you know that there are capable men among them[b], then appoint them as overseers of the livestock that belongs to me.
translation:
  language: te
  text: ఐగుప్తు దేశం నీ ముందే ఉంది.[a] నీ తండ్రినీ నీ సోదరులనీ దేశంలోని అత్యుత్తమ ప్రాంతంలో స్థిరపరచు; వారు గోషెను దేశంలో నివసించనివ్వు. వారిలో సమర్థులైన పురుషులు[b] ఉన్నారని నీకు తెలిస్తే, నా పశుసంపదకు పర్యవేక్షకులుగా వారిని నియమించు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నీ ముందే ఉంది’ అనేది హీబ్రూ నుడికారం. ఇక్కడ ఐగుప్తు దేశంలో తగిన స్థలాన్ని ఎంచుకునే అవకాశం లేదా స్వేచ్ఛ నీకు ఉందనే భావాన్ని ఇది సూచించవచ్చు.
    reason: cultural_note
  - marker: b
    text: లేదా ‘సామర్థ్యవంతులు,’ ‘యోగ్యులు’; మరింత అక్షరార్థంగా ‘బలం/సామర్థ్యం గల పురుషులు.’ ఇక్కడ ఈ మాట తప్పనిసరిగా సైనిక పరాక్రమాన్ని సూచించదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶרֶץ מִצְרַיִם לְפָנֶיךָ הִוא
  choice: ఐగుప్తు దేశం నీ ముందే ఉంది
  rationale: לְפָנֶיךָ అనే ‘నీ ముందు’ రూపకాన్ని నిలుపుతూ, సందర్భంలో ఐగుప్తులో స్థలాన్ని ఎంచుకునే స్వేచ్ఛ యోసేపుకు ఉందనే భావాన్ని సూచిస్తుంది.
- source_word: בְּמֵיטַב הָאָרֶץ
  choice: దేశంలోని అత్యుత్తమ ప్రాంతంలో
  rationale: מֵיטַב దేశంలోని శ్రేష్ఠమైన లేదా ఎంపికైన భాగాన్ని సూచిస్తుంది; ‘అత్యుత్తమ ప్రాంతం’ ఆధునిక తెలుగులో సహజంగా, స్పష్టంగా ఉంది.
- source_word: הוֹשֵׁב
  choice: స్థిరపరచు
  rationale: ישׁב హిఫిల్ ఆజ్ఞారూపంలోని కారణార్థాన్ని—వారిని అక్కడ నివసించేలా చేయడం—సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: יֵשְׁבוּ
  choice: నివసించనివ్వు
  rationale: ఇక్కడ ישׁב స్థిరంగా నివసించడాన్ని సూచిస్తుంది; అనుమతి లేదా ఏర్పాటును తెలిపే సందర్భానుకూల రూపం.
- source_word: בְּאֶרֶץ גֹּשֶׁן
  choice: గోషెను దేశంలో
  rationale: మూలంలోని אֶרֶץ (‘దేశం/ప్రాంతం’) పదాన్ని పారదర్శకత కోసం నిలిపింది.
- source_word: וְאִם יָדַעְתָּ
  choice: ఉన్నారని నీకు తెలిస్తే
  rationale: యోసేపుకు వారి సామర్థ్యం తెలిసి ఉండడంపై ఆధారపడిన షరతును సహజమైన తెలుగు వాక్యక్రమంలో వ్యక్తం చేస్తుంది.
- source_word: אַנְשֵׁי חַיִל
  choice: సమర్థులైన పురుషులు
  rationale: חַיִל బలం, సామర్థ్యం, యోగ్యత వంటి భావాలను కలిగి ఉంటుంది. పశుసంపద నిర్వహణ సందర్భంలో సైనిక పరాక్రమం కంటే కార్యసామర్థ్యమే ప్రధాన భావం.
- source_word: וְשַׂמְתָּם
  choice: వారిని నియమించు
  rationale: שׂים అక్షరార్థంగా ‘ఉంచు/పెట్టు’; బాధ్యత అప్పగించే ఈ సందర్భంలో ‘నియమించు’ ఉద్దేశాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: שָׂרֵי מִקְנֶה
  choice: పశుసంపదకు పర్యవేక్షకులు
  rationale: שָׂרֵי నాయకులు లేదా అధికారులను, מִקְנֶה పశుసంపదను సూచిస్తాయి; ఈ కలయిక నిర్వహణ బాధ్యతను స్పష్టంగా తెలుపుతుంది.
- source_word: עַל אֲשֶׁר לִי
  choice: నా పశుసంపదకు
  rationale: ‘నాకు చెందినదాని మీద’ అనే మూలభావాన్ని సందర్భంలోని పశుసంపదతో సహజంగా అనుసంధానిస్తుంది.
