  source_fidelity: 'హీబ్రూ వచనంలోని ప్రధాన భావాలన్నీ విశ్వసనీయంగా ప్రతిఫలించాయి: ఐగుప్తు దేశం యోసేపు ముందున్నదనే అందుబాటు-సూచక నుడికారం, దేశంలోని శ్రేష్ఠ భాగంలో కుటుంబాన్ని నివసింపజేయమనే ఆజ్ఞ, గోషెను దేశంలో నివాసం, సమర్థులైన వారిని ఫరో పశుసంపదపై అధికారులుగా నియమించమనే షరతు అన్నీ సక్రమంగా ఉన్నాయి.'
