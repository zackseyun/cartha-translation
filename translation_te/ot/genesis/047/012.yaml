  to: యోసేపు తన తండ్రికి, తన సహోదరులకు, తన తండ్రి ఇంటివారందరికీ ఆహారాన్ని[a] సమకూర్చాడు—వారి చిన్నపిల్లల సంఖ్యను బట్టి[b].
