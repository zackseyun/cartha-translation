translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడబడింది. హీబ్రూ వాక్యంలోని సరఫరా భావం స్పష్టంగా ఉంచబడింది; ‘రొట్టె/ఆహారం’ మరియు לְפִי הַטָּף నుడికారంలోని భావ పరిధులు పాదసూచికల్లో నిలుపబడ్డాయి.
