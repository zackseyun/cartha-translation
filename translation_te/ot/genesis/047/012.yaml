  edition: WLC
  text: וַ/יְכַלְכֵּ֤ל יוֹסֵף֙ אֶת אָבִ֣י/ו וְ/אֶת אֶחָ֔י/ו וְ/אֵ֖ת כָּל בֵּ֣ית אָבִ֑י/ו לֶ֖חֶם לְ/פִ֥י הַ/טָּֽף־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/012.yaml
  text: And Joseph provided his father[a], his brothers, and all his father's household with food[b], according to the number of their little ones.
translation:
  language: te
  text: యోసేపు తన తండ్రికి, తన సహోదరులకు, తన తండ్రి ఇంటివారందరికీ ఆహారాన్ని[a] సమకూర్చాడు—వారి చిన్నపిల్లల సంఖ్యను బట్టి[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘రొట్టె.’ హీబ్రూ పదానికి తరచుగా అక్షరార్థంగా ‘రొట్టె’ అని అర్థం; అయితే ఇక్కడ అది విస్తృతంగా ఆహార సరఫరాను సూచిస్తున్నట్లు ఉంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘చిన్నపిల్లల నోటిని బట్టి.’ ఇది పిల్లల సంఖ్యను లేదా వారి అవసరాలను బట్టి అని సూచించే హీబ్రూ నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְכַלְכֵּל
  choice: సమకూర్చాడు
  rationale: పియేల్ రూపంలోని כלכל ఇక్కడ కరవు సమయంలో భౌతికంగా పోషించడం లేదా అవసరమైన సరఫరా చేయడం అనే అర్థం ఇస్తుంది. ‘సమకూర్చాడు’ ఆహార సరఫరాను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: לֶחֶם
  choice: ఆహారం
  rationale: ఈ పదానికి ప్రాథమిక అర్థం ‘రొట్టె’ అయినప్పటికీ, ఈ కరవు సందర్భంలో అది విస్తృతంగా ఆహార సరఫరాను సూచిస్తుంది.
- source_word: כָּל בֵּית אָבִיו
  choice: తన తండ్రి ఇంటివారందరికీ
  rationale: ఇక్కడ ‘ఇల్లు’ భవనాన్ని కాకుండా కుటుంబ గృహసముదాయాన్ని సూచిస్తుంది. ‘ఇంటివారందరికీ’ సాధారణ ఆధునిక తెలుగులో ఆ సామాజిక భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: לְפִי
  choice: సంఖ్యకు తగినంతగా
  rationale: అక్షరార్థంగా ‘నోటికి అనుగుణంగా’ ఉండే ఈ హీబ్రూ ప్రయోగం పరిమాణం లేదా నిష్పత్తిని సూచిస్తుంది. చిన్నపిల్లల సంఖ్యను బట్టి సరఫరా చేసిన భావాన్ని ఈ ఎంపిక సహజంగా వ్యక్తపరుస్తుంది.
- source_word: הַטָּף
  choice: వారి చిన్నపిల్లలు
  rationale: טַף కుటుంబంలోని చిన్న పిల్లలను సూచిస్తుంది. ‘వారి చిన్నపిల్లలు’ కుటుంబ సంబంధాన్ని నిలుపుతుంది.
- source_word: אָבִיו ... אֶחָיו
  choice: తన తండ్రి, తన సహోదరులు
  rationale: ఇవి నేరుగా బంధుత్వాన్ని సూచించే పదాలు. తక్షణ సందర్భంలోని యోసేపు మగ తోబుట్టువులను సూచించేందుకు ‘సహోదరులు’ వాడబడింది.
