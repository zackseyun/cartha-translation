source:
  edition: WLC
  text: וַ/יֵּ֧שֶׁב יִשְׂרָאֵ֛ל בְּ/אֶ֥רֶץ מִצְרַ֖יִם בְּ/אֶ֣רֶץ גֹּ֑שֶׁן וַ/יֵּאָחֲז֣וּ בָ֔/הּ וַ/יִּפְר֥וּ וַ/יִּרְבּ֖וּ מְאֹֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/027.yaml
  text: So Israel settled in the land of Egypt[a], in the land of Goshen, and they gained possessions in it and were fruitful and multiplied greatly.
translation:
  language: te
  text: ఇశ్రాయేలు ఐగుప్తు దేశంలో, గోషెను ప్రాంతంలో స్థిరపడ్డాడు. వారు అందులో ఆస్తులను సంపాదించుకున్నారు[a], ఫలించి, ఎంతో విస్తరించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “వారు అందులో స్థిరంగా నెలకొనిపోయారు”; మరింత అక్షరార్థంగా, “వారు దానిలో పట్టు పొందారు/స్థిరపడ్డారు.” హీబ్రూ క్రియ ఆ ప్రాంతంలో హక్కు లేదా ఆస్తి సంపాదించడం, లేదా అక్కడ దృఢంగా స్థిరపడడం అనే భావాలను సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: స్థిరపడ్డాడు
  rationale: ישׁב ఇక్కడ కేవలం తాత్కాలికంగా నివసించడాన్ని కాక, ఒక ప్రాంతంలో స్థిర నివాసం ఏర్పరచుకోవడాన్ని సూచిస్తుంది.
- source_word: יִשְׂרָאֵל
  choice: ఇశ్రాయేలు
  rationale: మూలపాఠంలోని పేరును యథాతథంగా ఉంచి, తరువాత వచ్చే బహువచన క్రియలు అతని కుటుంబాన్ని సూచించే ప్రతినిధి భావాన్ని నిలిపాయి.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: ఐగుప్తు దేశంలో
  rationale: మూలంలోని אֶרֶץ అనే ‘దేశం/భూమి’ భావాన్ని, కథనంలోని ప్రాదేశిక ప్రాధాన్యాన్ని నిలుపుతుంది.
- source_word: בְּאֶרֶץ גֹּשֶׁן
  choice: గోషెను ప్రాంతంలో
  rationale: గోషెను ఐగుప్తులోని నిర్దిష్ట భూభాగమని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; రెండుసార్లు ‘దేశం’ అనడం వల్ల కలిగే అసహజతను నివారిస్తుంది.
- source_word: וַיֵּאָחֲזוּ בָהּ
  choice: వారు అక్కడ భూములను సంపాదించుకొని
  rationale: אחז నిఫల్ రూపం ఇక్కడ భూమిలో హక్కు లేదా పట్టును పొంది స్థిరపడటాన్ని సూచించగలదు. ‘భూములను సంపాదించుకొని’ అనే రూపం ఆ సాధ్యమైన ఆస్తి-స్వాధీన భావాన్ని స్పష్టంగా, సహజంగా అందిస్తుంది; పదంలోని విస్తృతార్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: וַיִּפְרוּ
  choice: ఫలించి
  rationale: ఆదికాండమంతటా వినిపించే ఫలవంతత అనే ఆశీర్వాద ఇతివృత్తాన్ని నిలుపుతుంది.
- source_word: וַיִּרְבּוּ מְאֹד
  choice: ఎంతో విస్తరించారు
  rationale: רבה యొక్క సంఖ్యాపరమైన పెరుగుదల భావాన్ని, מְאֹד యొక్క తీవ్రతను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ‘ఇశ్రాయేలు’ అనే ఏకవచన కర్త తరువాత బహువచన క్రియలకు మారడం
  choice: ‘ఇశ్రాయేలు ... స్థిరపడ్డాడు. వారు ...’ అని మూలంలోని సంఖ్యా మార్పును నిలపడం
  alternative: వాక్యమంతటా ‘ఇశ్రాయేలీయులు’ అని బహువచనంగా అనువదించడం లేదా ‘ఇశ్రాయేలు’కు బదులు ‘యాకోబు’ అని పెట్టడం
  rationale: హీబ్రూ పాఠం మొదట పితరుడైన ఇశ్రాయేలును ఏకవచనంగా పేర్కొని, తరువాత అతని కుటుంబాన్ని బహువచనంగా సూచిస్తుంది. ఈ రూపం పితరుడు తన కుటుంబానికి ప్రతినిధిగా నిలిచే కథనపరమైన ఉద్వేగాన్ని సంరక్షిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే కథన శైలి. ‘స్థిరపడ్డాడు’ మరియు ‘ఫలించి, ఎంతో విస్తరించారు’ అనే పదబంధాలు మూలంలోని స్థిర నివాసం, ఆదికాండపు ఫలవంతత-విస్తరణ ఇతివృత్తాలను నిలుపుతాయి. ప్రధాన పాఠంలోని [a] గుర్తు సంబంధిత సందిగ్ధ క్రియపదబంధం వెంటనే ఉంచబడింది.
