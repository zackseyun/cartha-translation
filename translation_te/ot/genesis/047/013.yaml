translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే గౌరవప్రదమైన బైబిలు కథన శైలిలో రూపొందించబడింది. ‘దేశాలు నీరసించిపోయాయి’ అనే వ్యక్తీకరణ మూలంలోని రూపకాలంకారాన్ని ఉద్దేశపూర్వకంగా నిలుపుతుంది.
