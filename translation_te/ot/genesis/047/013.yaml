id: GEN.47.13
reference: Genesis 47:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/לֶ֤חֶם אֵין֙ בְּ/כָל הָ/אָ֔רֶץ כִּֽי כָבֵ֥ד הָ/רָעָ֖ב מְאֹ֑ד וַ/תֵּ֜לַהּ אֶ֤רֶץ מִצְרַ֨יִם֙ וְ/אֶ֣רֶץ כְּנַ֔עַן מִ/פְּנֵ֖י הָ/רָעָֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/013.yaml
  text: There was no food in all the land[a], because the famine was very severe[b]; and the land of Egypt and the land of Canaan languished because of the famine.
translation:
  language: te
  text: దేశమంతటా ఆహారం[a] లేకపోయింది; ఎందుకంటే కరువు చాలా తీవ్రంగా ఉంది. కరువు కారణంగా ఐగుప్తు దేశమూ కనాను దేశమూ నీరసించిపోయాయి[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూలభాషలో ‘రొట్టె’; ఇక్కడ సాధారణంగా ఆహారం మొత్తాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘సొమ్మసిల్లిపోయాయి’ లేదా ‘క్షీణించిపోయాయి.’ కరువు వల్ల ఐగుప్తు, కనాను దేశాలు బలహీనపడిన స్థితిని మూలభాషా క్రియ రూపకాలంకారంగా వర్ణిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶחֶם
  choice: ఆహారం
  rationale: మూలార్థం ‘రొట్టె’ అయినా, కరువు సందర్భంలో ఇది సాధారణంగా ఆహారం మొత్తాన్ని సూచించే లక్షణార్థక ప్రయోగం.
- source_word: אֵין
  choice: లేకపోయింది
  rationale: గతకాల కథన సందర్భంలో అస్తిత్వ నిరాకరణను సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: בְּכָל הָאָרֶץ
  choice: దేశమంతటా
  rationale: సందర్భంలోని ప్రభావిత ప్రాంతమంతటినీ సూచిస్తుంది; మొత్తం భూగోళాన్ని కాదు.
- source_word: כִּי כָבֵד הָרָעָב מְאֹד
  choice: ఎందుకంటే కరువు చాలా తీవ్రంగా ఉంది
  rationale: ‘భారీగా’ అనే అక్షరార్థం కంటే, కరువు తీవ్రతను తెలిపే సహజమైన తెలుగు ప్రయోగం.
- source_word: וַתֵּלַהּ
  choice: నీరసించిపోయాయి
  rationale: కరువు వల్ల శక్తి క్షీణించి సొమ్మసిల్లిన స్థితిని తెలిపే రూపకాలంకార భావాన్ని నిలుపుతుంది.
- source_word: אֶרֶץ מִצְרַיִם וְאֶרֶץ כְּנַעַן
  choice: ఐగుప్తు దేశమూ కనాను దేశమూ
  rationale: రెండు భూభాగాలపై ఉన్న భౌగోళిక దృష్టిని నిలుపుతూ తెలుగులో సహజంగా ఉంటుంది.
- source_word: מִפְּנֵי הָרָעָב
  choice: కరువు కారణంగా
  rationale: హేతువును తెలిపే మూలభాషా పదబంధానికి స్పష్టమైన తెలుగు అనువాదం.
