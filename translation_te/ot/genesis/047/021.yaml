id: GEN.47.21
reference: Genesis 47:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אֶ֨ת הָ/עָ֔ם הֶעֱבִ֥יר אֹת֖/וֹ לֶ/עָרִ֑ים מִ/קְצֵ֥ה גְבוּל מִצְרַ֖יִם וְ/עַד קָצֵֽ/הוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/021.yaml
  text: As for the people[a], he moved them to the cities, from one end of the territory of Egypt to the other.
translation:
  language: te
  text: ప్రజల విషయానికి వస్తే, అతడు ఐగుప్తు భూభాగపు ఒక చివర నుండి మరో చివరి వరకు వారిని పట్టణాలకు తరలించాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారిని పట్టణాలకు మార్చాడు.” కొన్ని అనువాదాలు భిన్నమైన పాఠ అవగాహనను అనుసరించి, యోసేపు ప్రజలను దాసులుగా చేశాడని అనువదిస్తాయి. అయితే ఇక్కడి హెబ్రీ పాఠం మరింత నేరుగా వారిని వేరే చోటికి తరలించడం గురించి చెబుతుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: הָעָם
  choice: ప్రజలు
  rationale: ఈ పదం యోసేపు విధానం ప్రభావానికి లోనైన ఐగుప్తు జనసమూహాన్ని సమష్టిగా సూచిస్తుంది. ఆధునిక తెలుగులో ‘ప్రజలు’ సహజమైన, గౌరవప్రదమైన సమానార్థకం.
- source_word: הֶעֱבִיר אֹתוֹ
  choice: వారిని తరలించాడు
  rationale: עבר ధాతువు హిఫీల్ రూపం ఇక్కడ ఒకచోటినుండి మరొకచోటికి కదిలించడం లేదా తరలించడం అనే భావాన్ని ఇస్తుంది. సమష్టివాచక ఏకవచనమైన ‘ప్రజలు’ను తెలుగులో సహజంగా ‘వారిని’ అని తిరిగి సూచించాం.
- source_word: לֶעָרִים
  choice: పట్టణాలకు
  rationale: ל ఉపసర్గను గమ్యాన్ని సూచించేదిగా తీసుకున్నాం. ‘పట్టణాలకు’ అనేది మూలంలోని దిశార్థాన్ని సహజంగా వ్యక్తపరుస్తుంది; ‘పట్టణాల్లోకి’ కంటే మూలానికి కొద్దిగా దగ్గరగా ఉండి, అనవసరమైన స్పష్టీకరణను నివారిస్తుంది.
- source_word: מִקְצֵה גְבוּל מִצְרַיִם וְעַד קָצֵהוּ
  choice: ఐగుప్తు ప్రాంతపు ఒక చివరనుండి మరో చివరివరకు
  rationale: ఇది దేశమంతటినీ సూచించే విస్తృతి ప్రయోగం. גְבוּל ఇక్కడ కేవలం సరిహద్దు రేఖకంటే భూభాగం/ప్రాంతం అనే భావంలో ఉండడంతో ‘ప్రాంతం’ అని అనువదించాం.
theological_decisions:
- issue: ఐగుప్తు ప్రజల పట్ల యోసేపు చేసిన చర్య
  choice: వారిని పట్టణాలకు తరలించాడు
  alternative: వారిని దాసులుగా చేశాడు; వారిని పట్టణం నుండి పట్టణానికి మార్చాడు
  rationale: మసొరెటిక్ హెబ్రీ పాఠం ప్రజలను కదిలించడం లేదా తరలించడం గురించే నేరుగా చెబుతుంది; దాసత్వంలోకి మార్చాడని ఈ పదబంధం స్పష్టంగా చెప్పదు. అందువల్ల మూలపాఠంలో లేని కఠినమైన విధానార్థాన్ని చేర్చకుండా, నిజమైన ప్రత్యామ్నాయ పాఠ అవగాహనను పాదటీకలో పేర్కొన్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘ప్రజల విషయానికొస్తే’ అనే నిర్మాణం וְאֶת־הָעָם లోని అంశ-ప్రాధాన్యాన్ని నిలుపుతుంది. ‘పట్టణాలకు’ అనే రూపం గమ్యార్థాన్ని కాపాడుతూ, మూలంలో లేని అదనపు స్థలార్థాన్ని చేర్చదు.
