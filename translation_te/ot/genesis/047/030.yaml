  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/שָֽׁכַבְתִּי֙ עִם אֲבֹתַ֔/י וּ/נְשָׂאתַ֨/נִי֙ מִ/מִּצְרַ֔יִם וּ/קְבַרְתַּ֖/נִי בִּ/קְבֻרָתָ֑/ם וַ/יֹּאמַ֕ר אָנֹכִ֖י אֶֽעֱשֶׂ֥ה כִ/דְבָרֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/030.yaml
  text: When I lie down with my fathers[a], carry me out of Egypt and bury me in their burial place.” And he said[c][b], “I will do as you have said.”
translation:
  language: te
  text: నేను నా పితరులతో నిద్రించినప్పుడు[a], నన్ను ఐగుప్తు నుండి మోసుకెళ్లి వారి సమాధి స్థలంలో[b] పాతిపెట్టు.” అందుకు అతడు, “నీ మాట ప్రకారమే నేను చేస్తాను” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “నేను నా పితరులతో పడుకున్నప్పుడు.” ఇది మరణం, సమాధికి సంబంధించిన హీబ్రూ సాంప్రదాయ ప్రయోగం. “పితరులు” అనే మాటకు “పూర్వీకులు” అని కూడా అర్థం కావచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “వారి సమాధిలో” లేదా “వారి సమాధి గృహంలో.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁכַבְתִּי
  choice: నేను ... నిద్రించినప్పుడు
  rationale: శׁכב అనే క్రియకు అక్షరార్థంగా ‘పడుకోవడం/నిద్రించడం’ అనే భావం ఉంది; ఇక్కడ అది మరణానికి సంబంధించిన సాంప్రదాయ ప్రయోగం. తెలుగు సహజత్వం కోసం సంధిని కాలార్థకంగా ‘అప్పుడు’ అని వ్యక్తం చేస్తూ, మూలంలోని రూపకాన్ని నిలిపాం.
- source_word: עִם אֲבֹתַי
  choice: నా పితరులతో
  rationale: אָבוֹתַי పూర్వీకులను సూచిస్తుంది. ‘పితరులు’ మరణం, కుటుంబ సమాధి సందర్భంలో గౌరవప్రదంగా ఉండి, మూలంలోని కుటుంబ సంబంధిత సాంప్రదాయ భావాన్ని కాపాడుతుంది.
- source_word: וּנְשָׂאתַנִי
  choice: నన్ను ... తీసుకెళ్లి
  rationale: נשׂא ఇక్కడ మృతదేహాన్ని మోసుకొని/తరలించి వెళ్లడాన్ని సూచిస్తుంది. ‘తీసుకెళ్లి’ ఆధునిక తెలుగులో సహజంగా గమ్యదిశతో కూడిన తరలింపును తెలియజేస్తుంది; ‘మోసుకెళ్లి’ కూడా సాధ్యమే కాని కాస్త భౌతిక విధానాన్ని ముందుకు తెస్తుంది.
- source_word: מִמִּצְרַיִם
  choice: ఐగుప్తు నుండి
  rationale: מן మూలస్థానం నుండి బయటకు తరలింపును సూచిస్తుంది. ‘నుండి’ తెలుగులో ఆ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: וּקְבַרְתַּנִי
  choice: నన్ను ... పాతిపెట్టు
  rationale: קבר అంటే సమాధి చేయడం/పాతిపెట్టడం. ప్రత్యక్ష అభ్యర్థనలో ‘పాతిపెట్టు’ సాధారణ ఆధునిక తెలుగులో స్పష్టంగా ఉంటుంది.
- source_word: בִּקְבֻרָתָם
  choice: వారి సమాధి స్థలంలో
  rationale: קְבֻרָה ఇక్కడ పాతిపెట్టే స్థలం లేదా సమాధి స్థలాన్ని సూచిస్తుంది. ‘సమాధి స్థలం’ గోరి లేదా గుహ వంటి నిర్దిష్ట రూపాన్ని అనవసరంగా నిర్ణయించదు.
- source_word: וַיֹּאמַר
  choice: అందుకు అతడు ... అన్నాడు
  rationale: కథనంలోని ప్రతిస్పందనను సహజ తెలుగులో అనుసంధానించేందుకు ‘అందుకు’ వాడాం; ‘అతడు అన్నాడు’ మూలంలోని సరళమైన వాక్యప్రవాహాన్ని నిలుపుతుంది.
- source_word: אָנֹכִי אֶעֱשֶׂה
  choice: నేను చేస్తాను
  rationale: స్వతంత్ర సర్వనామం אָנֹכִי కొంత ఉద్ఘాటన కలిగించవచ్చు. తెలుగులో వ్యక్తమైన ‘నేను’ ఆ ఉద్ఘాటనను తగినంతగా తెలియజేస్తుంది.
- source_word: כִדְבָרֶךָ
  choice: నీ మాట ప్రకారమే
  rationale: అక్షరార్థం ‘నీ మాట ప్రకారం.’ ‘ప్రకారమే’ అనే నిశ్చయార్థక రూపం యాకోబు కోరినట్లే చేస్తాననే యోసేపు అంగీకారాన్ని సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ‘పితరులతో నిద్రించడం’ అనే మరణసంబంధిత ప్రయోగం
  choice: రూపకాన్ని ‘నా పితరులతో నిద్రించినప్పుడు’గా నిలిపివేయడం
  alternative: ‘నేను చనిపోయినప్పుడు’ లేదా ‘నా పూర్వీకులవలె మరణించినప్పుడు’
  rationale: మూలం మరణాన్ని నేరుగా చెప్పకుండా ‘నిద్రించడం’ అనే సాంప్రదాయ రూపకాన్ని ఉపయోగిస్తుంది. దాన్ని ‘చనిపోయినప్పుడు’గా విప్పి చెప్పడం మూలంలోని ఉద్దేశపూర్వక చిత్రణను తొలగిస్తుంది; రూపకాన్ని నిలిపి పాదటిప్పణిలో భావాన్ని వివరిస్తాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి పాటించబడింది. మరణానికి సంబంధించిన హీబ్రూ రూపకం నిలుపబడింది. ‘పితరులు’ బైబిలు సందర్భానికి తగిన గంభీరతను ఇస్తుంది; దాని సాధారణ అర్థమైన ‘పూర్వీకులు’ పాదటిప్పణిలో ఇవ్వబడింది. ప్రధాన పాఠంలోని ప్రతి పాదటిప్పణి సూచిక సంబంధిత పదబంధం వెంట ఉంచబడింది.
