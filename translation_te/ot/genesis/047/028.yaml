translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథనశైలిని ఉపయోగించింది. మూలంలోని సమానాధికార నిర్మాణాన్ని ‘అంటే’తో స్పష్టం చేస్తూనే, ‘యాకోబు దినాలు’ అనే హీబ్రూ నుడికారాన్ని నిలుపుకుంది.
