  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְחִ֤י יַעֲקֹב֙ בְּ/אֶ֣רֶץ מִצְרַ֔יִם שְׁבַ֥ע עֶשְׂרֵ֖ה שָׁנָ֑ה וַ/יְהִ֤י יְמֵֽי יַעֲקֹב֙ שְׁנֵ֣י חַיָּ֔י/ו שֶׁ֣בַע שָׁנִ֔ים וְ/אַרְבָּעִ֥ים וּ/מְאַ֖ת שָׁנָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/028.yaml
  text: Jacob lived in the land of Egypt seventeen years[a], and the days of Jacob, the years of his life, were one hundred forty-seven years.
translation:
  language: te
  text: యాకోబు ఐగుప్తు దేశంలో పదిహేడు సంవత్సరాలు జీవించాడు. యాకోబు దినాలు, అంటే అతని జీవిత సంవత్సరాలు[a], మొత్తం నూట నలభై ఏడు సంవత్సరాలు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ మూలంలో ‘యాకోబు దినాలు, అతని జీవిత సంవత్సరాలు’ అని ఉంది; ఇది అతని మొత్తం జీవితకాలాన్ని సూచించే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחִי
  choice: జీవించాడు
  rationale: חיה క్రియ ఇక్కడ యాకోబు ఆ కాలమంతా జీవించి ఉన్నాడనే సూటి కథనార్థాన్ని ఇస్తుంది; ఆధునిక తెలుగులో ‘జీవించాడు’ సహజంగా ఉంది.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: ఐగుప్తు దేశంలో
  rationale: హీబ్రూలో స్పష్టంగా ఉన్న אֶרֶץ (‘దేశం’)ను నిలుపుతూ, సహజమైన తెలుగు రూపాన్ని ఉపయోగించింది.
- source_word: שְׁבַע עֶשְׂרֵה שָׁנָה
  choice: పదిహేడు సంవత్సరాలు
  rationale: హీబ్రూ సంఖ్యా వ్యక్తీకరణకు ప్రామాణికమైన తెలుగు సమానం.
- source_word: יְמֵי יַעֲקֹב
  choice: యాకోబు దినాలు
  rationale: హీబ్రూ ‘ఫలానివారి దినాలు’ అనే జీవితకాల సూచక నుడికారాన్ని వెంటనే ‘జీవితకాలం’గా సపాటుగా మార్చకుండా నిలుపుతుంది.
- source_word: שְׁנֵי חַיָּיו
  choice: అతని జీవిత సంవత్సరాలు
  rationale: ముందున్న ‘యాకోబు దినాలు’ అనే నుడికారాన్ని వివరించే సమానాధికార పదబంధాన్ని తెలుగులో స్పష్టంగా అందిస్తుంది.
- source_word: שֶׁבַע שָׁנִים וְאַרְבָּעִים וּמְאַת שָׁנָה
  choice: నూట నలభై ఏడు సంవత్సరాలు
  rationale: హీబ్రూ సంఖ్యా క్రమాన్ని సహజమైన తెలుగు క్రమంలో అమర్చి, మొత్తం సంఖ్యను యథాతథంగా నిలుపుతుంది.
