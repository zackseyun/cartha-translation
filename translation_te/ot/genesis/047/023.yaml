revisions:
- from: అప్పుడు యోసేపు ప్రజలతో, “చూడండి, ఈ రోజు మిమ్మల్ని, మీ భూమిని ఫరో కోసం నేను కొనుగోలు చేశాను.[a] ఇదిగో, మీకు విత్తనం; మీరు భూమిని విత్తాలి” అన్నాడు.
  to: 'అప్పుడు యోసేపు ప్రజలతో ఇలా అన్నాడు: “చూడండి, ఈ రోజు మిమ్మల్ని, మీ భూమిని ఫరో కోసం నేను కొనుగోలు చేశాను.[a] ఇదిగో, మీకు విత్తనం ఉంది; భూమిలో విత్తండి.”'
  rationale: The revision retains the direct and historically difficult statement that the people and their land were bought for Pharaoh. It improves Telugu idiom in the agricultural command and refines the lexical-alternative footnote without weakening the primary sense of purchase.
