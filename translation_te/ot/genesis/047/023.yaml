source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יוֹסֵף֙ אֶל הָ/עָ֔ם הֵן֩ קָנִ֨יתִי אֶתְ/כֶ֥ם הַ/יּ֛וֹם וְ/אֶת אַדְמַתְ/כֶ֖ם לְ/פַרְעֹ֑ה הֵֽא לָ/כֶ֣ם זֶ֔רַע וּ/זְרַעְתֶּ֖ם אֶת הָ/אֲדָמָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/023.yaml
  text: Then Joseph said to the people[a], “Look, today I have bought you and your land for Pharaoh. Here is seed for you, and you shall sow the land.”
translation:
  language: te
  text: 'అప్పుడు యోసేపు ప్రజలతో ఇలా అన్నాడు: “చూడండి, ఈ రోజు మిమ్మల్ని, మీ భూమిని ఫరో కోసం నేను కొనుగోలు చేశాను.[a] ఇదిగో, మీకు విత్తనం ఉంది; భూమిలో విత్తండి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “సంపాదించుకున్నాను.” హీబ్రూ క్రియకు కొనడం లేదా కొనుగోలు చేయడం అనే అర్థంతో పాటు, మరింత సాధారణంగా సంపాదించడం అనే అర్థం కూడా ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... అన్నాడు
  rationale: వావ్-క్రమరూపం కథనాన్ని ముందుకు నడిపిస్తుంది; ఆధునిక తెలుగు కథనంలో ‘అప్పుడు’ సహజంగా క్రమాన్ని తెలియజేస్తుంది.
- source_word: הָעָם
  choice: ప్రజలు
  rationale: ఇక్కడ సమష్టిగా సంబోధించబడుతున్న ఐగుప్తు ప్రజలను సూచిస్తుంది.
- source_word: הֵן
  choice: చూడండి
  rationale: ప్రకటనపై దృష్టి పెట్టించే ఉద్ఘాటక అవ్యయానికి సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: קָנִיתִי
  choice: కొనుగోలు చేశాను
  rationale: קנה ఇక్కడ కరువు నేపథ్యంలో జరిగిన ఆర్థిక-చట్టబద్ధ బదిలీని సూచిస్తుంది; ‘కొనుగోలు చేశాను’ దాని ప్రాథమిక భావాన్ని నేరుగా నిలుపుతుంది.
- source_word: אֶתְכֶם
  choice: మిమ్మల్ని
  rationale: ప్రజలనే ప్రత్యక్ష కర్మగా పేర్కొంటున్న హీబ్రూ రూపాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: הַיּוֹם
  choice: ఈ రోజు
  rationale: ప్రస్తుత లావాదేవీ జరిగిన సమయాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: אַדְמַתְכֶם
  choice: మీ భూమి
  rationale: వారి వ్యవసాయ భూహక్కులను సూచించే సందర్భోచితమైన సాధారణ పదం.
- source_word: לְפַרְעֹה
  choice: ఫరో కోసం
  rationale: యోసేపు ఫరో తరఫున కొనుగోలు చేసిన భావాన్ని לְ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: הֵא
  choice: ఇదిగో
  rationale: ఇవ్వబడుతున్న విత్తనాన్ని ప్రత్యక్షంగా చూపించే సూచనార్థక బలాన్ని నిలుపుతుంది.
- source_word: זֶרַע
  choice: విత్తనం
  rationale: నాటడానికి ఇచ్చే విత్తనాన్ని నేరుగా సూచిస్తుంది.
- source_word: וּזְרַעְתֶּם
  choice: మీరు ... విత్తాలి
  rationale: వావ్‌తో కూడిన సంపూర్ణ క్రియ ఇక్కడ ముందుకు చేయవలసిన కార్యాన్ని ఆదేశాత్మకంగా సూచిస్తుంది; ‘విత్తాలి’ సంధిని, విధేయత భావాన్ని నిలుపుతుంది.
- source_word: הָאֲדָמָה
  choice: భూమి
  rationale: సాగు చేయాల్సిన నేలను సూచిస్తుంది; ముందున్న ‘మీ భూమి’తో పదసంబంధాన్ని నిలుపుతుంది.
theological_decisions:
- issue: ప్రజలే ఫరోకు కొనబడినట్లు చెప్పే కఠినమైన సామాజిక-చట్టబద్ధ భావం
  choice: ‘మిమ్మల్ని, మీ భూమిని ... కొనుగోలు చేశాను’ అని నేరుగా అనువదించబడింది
  alternative: ‘మిమ్మల్ని, మీ భూమిని ... సంపాదించాను’
  rationale: మూలపాఠంలోని వ్యక్తులూ భూమీ రెండూ లావాదేవీకి కర్మలుగా ఉన్న ఉద్రిక్తతను మృదువుచేయకుండా నిలుపుతుంది; అయితే קנה యొక్క విస్తృతార్థాన్ని పాదసూచిక తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే కథన శైలి. ‘చూడండి’, ‘ఇదిగో’ ద్వారా మూలంలోని రెండు సూచనార్థక అవ్యయాల బలం వేరువేరుగా నిలుపబడింది.
