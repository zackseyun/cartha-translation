id: GEN.47.9
reference: Genesis 47:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יַעֲקֹב֙ אֶל פַּרְעֹ֔ה יְמֵי֙ שְׁנֵ֣י מְגוּרַ֔/י שְׁלֹשִׁ֥ים וּ/מְאַ֖ת שָׁנָ֑ה מְעַ֣ט וְ/רָעִ֗ים הָיוּ֙ יְמֵי֙ שְׁנֵ֣י חַיַּ֔/י וְ/לֹ֣א הִשִּׂ֗יגוּ אֶת יְמֵי֙ שְׁנֵי֙ חַיֵּ֣י אֲבֹתַ֔/י בִּ/ימֵ֖י מְגוּרֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/009.yaml
  text: And Jacob said to Pharaoh[a], “The days of the years of my sojourning are one hundred thirty years. Few and evil have been the days of the years of my life[b], and they have not attained to the days of the years of the lives of my fathers in the days of their sojourning.”
translation:
  language: te
  text: 'యాకోబు ఫరోతో ఇలా అన్నాడు: “నేను పరదేశిగా నివసించిన సంవత్సరాల కాలం నూట ముప్పై సంవత్సరాలు. నా జీవిత సంవత్సరాల రోజులు కొద్దిగాను కష్టభరితంగాను ఉన్నాయి[a]; అవి నా పితరులు పరదేశులుగా నివసించిన కాలంలోని వారి జీవిత సంవత్సరాల రోజులను చేరుకోలేదు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూలభాషలో అక్షరార్థంగా, “నా జీవిత సంవత్సరాల రోజులు కొద్దిగాను చెడ్డవిగాను ఉన్నాయి.” ఇక్కడ “చెడ్డవి” అంటే కష్టాలు, బాధలు నిండినవి.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְגוּרַי / מְגוּרֵיהֶם
  choice: నేను పరదేశిగా నివసించిన / పరదేశులుగా నివసించిన
  rationale: ఈ పదాలు సాధారణ నివాసాన్ని మాత్రమే కాక, పరాయి దేశంలో తాత్కాలిక నివాసిగా జీవించడాన్ని సూచిస్తాయి. తెలుగు పాఠకులకు సహజంగా ఉండేలా ‘పరదేశిగా నివసించిన’ అని అనువదించాం.
- source_word: יְמֵי שְׁנֵי
  choice: సంవత్సరాల కాలం / జీవిత సంవత్సరాల రోజులు
  rationale: హీబ్రూలోని ‘రోజులు—సంవత్సరాలు’ అనే గంభీరమైన ఆయుష్కాల నుడికారాన్ని సాధ్యమైనంతవరకు నిలిపి, మొదటి సందర్భంలో సహజమైన తెలుగు కోసం ‘సంవత్సరాల కాలం’ వాడాం.
- source_word: שְׁלֹשִׁים וּמְאַת שָׁנָה
  choice: నూట ముప్పై సంవత్సరాలు
  rationale: హీబ్రూ సంఖ్యకు సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: מְעַט
  choice: కొద్దిగా
  rationale: యాకోబు తన ఆయుష్షును పితరుల ఆయుష్షుతో పోల్చి తక్కువగా పేర్కొంటున్న భావాన్ని నేరుగా తెలియజేస్తుంది.
- source_word: רָעִים
  choice: కష్టభరితంగా
  rationale: ఇక్కడ నైతిక దుష్టత్వం కంటే బాధలు, విపత్తులు నిండిన జీవనానుభవం ఉద్దేశించబడింది; ‘కష్టభరితంగా’ ఆ సందర్భార్థాన్ని సహజంగా అందిస్తుంది.
- source_word: הִשִּׂיגוּ
  choice: చేరలేదు
  rationale: ‘చేరడం, అందుకోవడం’ అనే మూలభావాన్ని, యాకోబు ఆయుష్షు తన పితరుల ఆయుష్షుకు సరిపోలలేదనే పోలికను నిలుపుతుంది.
- source_word: אֲבֹתַי
  choice: నా పితరులు
  rationale: ఇక్కడ అబ్రాహాము, ఇస్సాకు వంటి పూర్వపితరులను సూచించే కుటుంబ సంబంధాన్ని నిలుపుతుంది.
theological_decisions:
- issue: పితరులు పరదేశ నివాసులని తెలిపే స్వీయవర్ణన
  choice: పరదేశిగా నివసించిన కాలం
  alternative: యాత్రిక జీవితం
  rationale: మూలపదం పరాయి దేశంలో తాత్కాలిక నివాసిగా ఉండడాన్ని నేరుగా సూచిస్తుంది; ‘యాత్రిక జీవితం’ అనడం తరువాతి ఆధ్యాత్మిక భావాన్ని అనవసరంగా చేర్చవచ్చు.
- issue: רָעִים అనే పదంలోని ‘చెడు/కష్టం’ భావ ఉద్రిక్తత
  choice: కష్టభరితంగా
  alternative: చెడుగా
  rationale: ఈ సందర్భంలో యాకోబు తన రోజుల నైతిక స్వభావాన్ని కాక వాటిలో అనుభవించిన బాధలను వివరిస్తున్నాడు. అందువల్ల సందర్భార్థాన్ని స్పష్టపరిచే రూపాన్ని ఎంచుకున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కాని సులభంగా అర్థమయ్యే శైలి. హీబ్రూ వాక్యంలోని ‘రోజులు—సంవత్సరాలు’ పునరుక్తిని కొంత నిలిపి, తెలుగులో అతిగా కృత్రిమంగా మారకుండా సమతుల్యం పాటించాం.
