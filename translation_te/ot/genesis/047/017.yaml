  text: וַ/יָּבִ֣יאוּ אֶת מִקְנֵי/הֶם֮ אֶל יוֹסֵף֒ וַ/יִּתֵּ֣ן לָ/הֶם֩ יוֹסֵ֨ף לֶ֜חֶם בַּ/סּוּסִ֗ים וּ/בְ/מִקְנֵ֥ה הַ/צֹּ֛אן וּ/בְ/מִקְנֵ֥ה הַ/בָּקָ֖ר וּ/בַ/חֲמֹרִ֑ים וַ/יְנַהֲלֵ֤/ם בַּ/לֶּ֨חֶם֙ בְּ/כָל מִקְנֵ/הֶ֔ם בַּ/שָּׁנָ֖ה הַ/הִֽוא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/017.yaml
  text: So they brought their livestock to Joseph[a], and Joseph gave them bread in exchange for the horses, the flocks, the herds, and the donkeys[b]; and he provided for them with bread in exchange for all their livestock during that year.
translation:
  language: te
  text: వారు తమ పశుసంపద మొత్తాన్ని యోసేపు దగ్గరికి తీసుకొచ్చారు. యోసేపు గుర్రాలకు, గొర్రెలు, మేకల మందలకు, పశువుల మందలకు, గాడిదలకు బదులుగా వారికి రొట్టె ఇచ్చాడు. ఆ సంవత్సరమంతా వారి పశుసంపద మొత్తానికి బదులుగా రొట్టె ఇచ్చి వారిని పోషించాడు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూల హీబ్రూలో దీనిని మరింత అక్షరార్థంగా అనువదిస్తే, ‘రొట్టెతో వారిని నడిపించాడు’ అని ఉంటుంది. ఇక్కడ వాడిన క్రియకు ‘నడిపించు, నిర్వహించు’ అనే అర్థాలు ఉండగలవు; ఈ సందర్భంలో అది కరవు కాలంలో వారికి రొట్టె అందించి పోషించడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקְנֵיהֶם / מִקְנֵהֶם
  choice: వారి పశుసంపద / వారి పశుసంపద అంతా
  rationale: ఈ పదం కేవలం పశువులను మాత్రమే కాకుండా సంపాదించుకున్న పెంపుడు జంతువులన్నిటినీ సమగ్రంగా సూచిస్తుంది.
- source_word: לֶחֶם
  choice: ఆహారం
  rationale: మూలపదానికి అక్షరార్థంగా ‘రొట్టె’ అనే భావం ఉన్నప్పటికీ, కరవు సందర్భంలో అది జీవనాధారమైన ఆహారాన్ని విస్తృతంగా సూచిస్తుంది; ఆధునిక తెలుగులో ‘ఆహారం’ సహజంగా అర్థమవుతుంది.
- source_word: בַּסּוּסִים ... וּבַחֲמֹרִים
  choice: గుర్రాలకు ... గాడిదలకు బదులుగా
  rationale: ఇక్కడ ב అనే ఉపసర్గ మార్పిడి ధరను సూచిస్తుంది; అందువల్ల ‘బదులుగా’ అని స్పష్టం చేయడం తెలుగు వాక్యానికి సహజం.
- source_word: מִקְנֵה הַצֹּאן
  choice: గొర్రెలు మేకల మందలు
  rationale: צֹאן గొర్రెలతో పాటు మేకలను కూడా సూచించగల సమూహపదం; ‘గొర్రెలు మేకల మందలు’ దాని పరిధిని స్పష్టంగా నిలుపుతుంది.
- source_word: מִקְנֵה הַבָּקָר
  choice: పశువుల మందలు
  rationale: ఈ పదబంధం ప్రధానంగా ఎద్దులు, ఆవులు వంటి పెద్ద పశువుల సమూహాన్ని సూచిస్తుంది; తెలుగు వాడుకలో ‘పశువుల మందలు’ సహజం.
- source_word: וַיְנַהֲלֵם
  choice: వారిని పోషించాడు
  rationale: נהל అనే క్రియకు ‘నడిపించు, నిర్వహించు’ అనే అర్థాలు ఉన్నాయి; అయితే ఆహారం ద్వారా కరవు కాలంలో వారిని సంరక్షించిన ఈ సందర్భంలో ‘పోషించాడు’ సందర్భార్థాన్ని సహజంగా తెలియజేస్తుంది, కాగా అక్షరార్థపు రూపాన్ని పాదసూచికలో ఉంచాం.
- source_word: בְּכָל מִקְנֵהֶם
  choice: వారి పశుసంపద అంతటికీ బదులుగా
  rationale: మొత్తం పశుసంపదను ఆహారానికి మార్పిడి చేసిన లావాదేవీని ఈ సమగ్ర పదబంధం సూచిస్తుంది.
- source_word: בַּשָּׁנָה הַהִוא
  choice: ఆ సంవత్సరమంతా
  rationale: ఈ ఏర్పాటు ఆ సంవత్సర కాలవ్యాప్తంగా కొనసాగిందనే భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
