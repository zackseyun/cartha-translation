  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన కథనశైలిని వాడాం. జంతువుల వర్గాలను సమూహపదాలతో సహజంగా వ్యక్తం చేసి, మార్పిడి భావాన్ని ‘బదులుగా’ అని స్పష్టం చేశాం.
