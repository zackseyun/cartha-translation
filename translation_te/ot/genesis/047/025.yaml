id: GEN.47.25
reference: Genesis 47:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּאמְר֖וּ הֶחֱיִתָ֑/נוּ נִמְצָא חֵן֙ בְּ/עֵינֵ֣י אֲדֹנִ֔/י וְ/הָיִ֥ינוּ עֲבָדִ֖ים לְ/פַרְעֹֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/025.yaml
  text: And they said[a], “You have kept us alive. May we find favor in the eyes of my lord, and we will be servants to Pharaoh.”
translation:
  language: te
  text: 'అప్పుడు వారు ఇలా అన్నారు: “మీరు మా ప్రాణాలను కాపాడారు. నా ప్రభువు దృష్టిలో మాకు అనుగ్రహం లభించుగాక; మేము ఫరోకు దాసులమవుతాము.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: అప్పుడు వారు ... అన్నారు
  rationale: వావ్-కన్సిక్యూటివ్ కథన ప్రవాహాన్ని సహజమైన ఆధునిక తెలుగు వాక్యనిర్మాణంలో చూపుతుంది.
- source_word: הֶחֱיִתָנוּ
  choice: మీరు మా ప్రాణాలను కాపాడారు
  rationale: חיה హిఫిల్ రూపంలోని ‘బతికించారు/సజీవంగా నిలిపారు’ అనే కారణార్థాన్ని సహజంగా వ్యక్తం చేస్తుంది; ఆధ్యాత్మిక రక్షణ భావాన్ని అనవసరంగా చేర్చదు.
- source_word: נִמְצָא חֵן
  choice: మాకు అనుగ్రహం లభించుగాక
  rationale: మొదటి పురుష బహువచన యిక్టోల్ ఇక్కడ వినయపూర్వక అభ్యర్థనగా పనిచేస్తుంది; ‘లభించుగాక’ ఆ ఆశీర్వచనాత్మక-విన్నప భావాన్ని నిలుపుతుంది.
- source_word: בְּעֵינֵי אֲדֹנִי
  choice: మా ప్రభువు దృష్టిలో
  rationale: ‘కళ్లలో’ అనే హీబ్రూ నుడికారాన్ని తెలుగులో సహజమైన ‘దృష్టిలో’తో అందిస్తుంది. ఏకవచన గౌరవ సంబోధనను సమూహ వక్తలకు అనుగుణంగా ‘మా ప్రభువు’గా వ్యక్తం చేసింది.
- source_word: וְהָיִינוּ
  choice: మేము ... అయి ఉంటాం
  rationale: సందర్భంలో కృతజ్ఞతకు ఫలితంగా చేసే భవిష్యత్ నిబద్ధతను సూచిస్తుంది.
- source_word: עֲבָדִים
  choice: దాసులు
  rationale: ఆర్థిక సంక్షోభంలో ఫరోకు బంధిత సేవలోకి వెళ్లే స్థితిని ‘దాసులు’ స్పష్టంగా తెలియజేస్తుంది; సాధారణ స్వచ్ఛంద సేవకులనే భావాన్ని నివారిస్తుంది.
- source_word: לְפַרְעֹה
  choice: ఫరోకు
  rationale: సేవా-అధీన సంబంధాన్ని తెలిపే לְ ఉపసర్గకు సంక్షిప్తమైన, సహజమైన తెలుగు రూపం.
theological_decisions:
- issue: עֲבָדִים యొక్క సామాజిక స్థితి
  choice: దాసులు
  alternative: సేవకులు
  rationale: ఈ సందర్భంలో ప్రజలు భూమితో పాటు తమను ఫరో అధీనానికి అప్పగించుకుంటున్నారు; అందువల్ల బంధిత స్థితిని సూచించే పదాన్ని ఉపయోగించడం మూలంలోని ఉద్రిక్తతను నిలుపుతుంది, అయితే ఆధునిక జాతి-ఆధారిత బానిసత్వపు అన్ని భావాలను దానిలోకి దిగుమతి చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకులకు సులభమైన శైలి. హీబ్రూ వినయపూర్వక అభ్యర్థనను ‘అనుగ్రహం లభించుగాక’గా, బంధిత సేవను ‘దాసులు’గా నిలిపింది.
