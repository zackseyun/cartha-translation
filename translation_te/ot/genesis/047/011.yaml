  yaml_path: translation/ot/genesis/047/011.yaml
  text: So Joseph settled his father and his brothers[a], and gave them a possession in the land of Egypt, in the best part of the land, in the land of Rameses, just as Pharaoh had commanded.
translation:
  language: te
  text: యోసేపు తన తండ్రినీ తన సోదరులనూ నివసింపజేసి, ఫరో ఆజ్ఞాపించినట్లే, ఐగుప్తు దేశంలో, దేశంలోని అత్యుత్తమ భాగమైన రామెసేసు ప్రాంతంలో వారికి భూమిని స్వాధీనంగా ఇచ్చాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיּוֹשֵׁב
  choice: నివసింపజేశాడు
  rationale: ישׁב ధాతువు హిఫీల్ రూపంలో ఉండి ‘నివసించేలా చేశాడు’ అనే కారణార్థాన్ని ఇస్తుంది. ‘నివసింపజేశాడు’ ఆ భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: אָבִיו וְאֶת־אֶחָיו
  choice: తన తండ్రిని, తన సోదరులను
  rationale: హీబ్రూ మూలం తండ్రిని, సోదరులను స్పష్టంగా పేర్కొంటుంది; అందువల్ల విస్తృతార్థమున్న ‘కుటుంబాన్ని’ అనే పదాన్ని ఉపయోగించలేదు.
- source_word: וַיִּתֵּן לָהֶם אֲחֻזָּה
  choice: వారికి భూమిని స్వాస్థ్యంగా ఇచ్చాడు
  rationale: אֲחֻזָּה అనేది స్వాధీనంలో ఉంచుకునే భూమి లేదా భూస్వాస్థ్యాన్ని సూచిస్తుంది. ‘భూమిని స్వాస్థ్యంగా’ అనేది భూహక్కు భావాన్ని తెలియజేస్తూ, అనవసరమైన నిబంధనాత్మక వారసత్వ భావాన్ని రుద్దదు.
- source_word: בְּמֵיטַב הָאָרֶץ
  choice: ఆ దేశంలోని అత్యుత్తమ భాగమైన
  rationale: מֵיטַב అనేది ఉత్తమమైన లేదా మేలైన భాగాన్ని సూచిస్తుంది. వాక్యంలోని రామెసేసు ప్రాంతాన్ని ఇది వివరిస్తున్నట్లు సహజమైన తెలుగులో వ్యక్తం చేయబడింది.
- source_word: בְּאֶרֶץ רַעְמְסֵס
  choice: రామెసేసు ప్రాంతంలో
  rationale: ఇక్కడ אֶרֶץ ఒక దేశం కంటే రామెసేసుతో సంబంధమున్న భూభాగం లేదా ప్రాంతాన్ని సూచిస్తుంది; అందువల్ల తెలుగులో ‘ప్రాంతం’ స్పష్టంగా, సహజంగా ఉంది.
- source_word: כַּאֲשֶׁר צִוָּה פַרְעֹה
  choice: ఫరో ఆజ్ఞాపించినట్లే
  rationale: యోసేపు చేసినది ఫరో ముందుగా ఇచ్చిన ఆజ్ఞకు సరిగ్గా అనుగుణంగా ఉందనే భావాన్ని ‘ఆజ్ఞాపించినట్లే’ నిలుపుతుంది.
