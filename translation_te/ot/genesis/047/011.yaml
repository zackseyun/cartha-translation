translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే కథన శైలి ఉపయోగించబడింది. హీబ్రూలోని కారణార్థక క్రియను నిలుపుతూ, אֶרֶץ పదపు పునరుక్తిని తెలుగులో భారంగా కాకుండా ‘దేశం/ప్రాంతం’ భేదంతో సహజీకరించాం.
