  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּתֹּ֣ם הַ/כֶּ֗סֶף מֵ/אֶ֣רֶץ מִצְרַיִם֮ וּ/מֵ/אֶ֣רֶץ כְּנַעַן֒ וַ/יָּבֹאוּ֩ כָל מִצְרַ֨יִם אֶל יוֹסֵ֤ף לֵ/אמֹר֙ הָֽבָ/ה לָּ֣/נוּ לֶ֔חֶם וְ/לָ֥/מָּה נָמ֖וּת נֶגְדֶּ֑/ךָ כִּ֥י אָפֵ֖ס כָּֽסֶף־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/015.yaml
  text: When the money from the land of Egypt and from the land of Canaan was gone[a], all the Egyptians came to Joseph, saying, "Give us bread[c][b]. Why should we die before you? For the money is gone."
translation:
  language: te
  text: ఈజిప్టు దేశంలోనూ కనాను దేశంలోనూ డబ్బు అంతా అయిపోయినప్పుడు,[a] ఈజిప్టువారందరూ[b] యోసేపు దగ్గరికి వచ్చి, “మాకు ఆహారం[c] ఇవ్వు. నీ ఎదుట మేమెందుకు చనిపోవాలి? డబ్బు అయిపోయింది” అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పదమైన כֶּסֶף‌కు ‘వెండి’ అనే అర్థం కూడా ఉంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “ఈజిప్టు అంతా యోసేపు దగ్గరికి వచ్చింది.”
    reason: lexical_alternative
  - marker: c
    text: అక్షరార్థంగా, “రొట్టె”; కరవు సందర్భంలో ఈ పదం ఆహారాన్ని విస్తృతంగా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֹּם הַכֶּסֶף
  choice: డబ్బు అంతా అయిపోయినప్పుడు
  rationale: תמם పూర్తిగా తీరిపోవడం లేదా అయిపోవడం అనే భావాన్ని ఇస్తుంది. కరవులో కొనుగోలు సాధనంగా ఉన్న כֶּסֶף‌ను ఆధునిక తెలుగులో సహజంగా ‘డబ్బు’ అని అనువదించాం.
- source_word: מֵאֶרֶץ מִצְרַיִם וּמֵאֶרֶץ כְּנַעַן
  choice: ఈజిప్టు దేశంలోనూ కనాను దేశంలోనూ
  rationale: హీబ్రూ מן మూలంగా ‘నుండి’ అని రావచ్చుగానీ, ఇక్కడ ఆ రెండు దేశాల్లో అందుబాటులో ఉన్న డబ్బు తీరిపోయిందనే భావాన్ని సహజమైన తెలుగులో తెలియజేయడానికి స్థానార్థక ప్రయోగం ఎంచుకున్నాం.
- source_word: וַיָּבֹאוּ כָל מִצְרַיִם
  choice: ఈజిప్టువారందరూ వచ్చి
  rationale: అక్షరార్థంగా ‘ఈజిప్టు అంతా వచ్చింది’; ఇది దేశ ప్రజలను సూచించే సమష్టి ప్రయోగం. తెలుగులో అర్థస్పష్టత కోసం ‘ఈజిప్టువారందరూ’ అని ఇచ్చాం.
- source_word: הָבָה לָּנוּ לֶחֶם
  choice: మాకు ఆహారం ఇవ్వు
  rationale: לֶחֶם ప్రాథమికంగా ‘రొట్టె’ అయినా, కరవు సందర్భంలో జీవనాధారమైన ఆహారాన్ని విస్తృతంగా సూచిస్తుంది. ఆధునిక తెలుగు పాఠకునికి ఉద్దేశం వెంటనే స్పష్టమయ్యేలా ‘ఆహారం’ ఎంచుకున్నాం; అక్షరార్థాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: וְלָמָּה נָמוּת נֶגְדֶּךָ
  choice: నీ ఎదుట మేమెందుకు చనిపోవాలి?
  rationale: נֶגְדֶּךָ అంటే ‘నీ ఎదుట/నీ సమక్షంలో.’ విజ్ఞాపనలోని తీవ్రతను కాపాడుతూ సహజమైన తెలుగు ప్రశ్నగా అనువదించాం.
- source_word: כִּי אָפֵס כָּסֶף
  choice: మా డబ్బు అయిపోయింది
  rationale: אָפֵס ఇక్కడ ఇక మిగలకపోవడాన్ని సూచిస్తుంది. హీబ్రూలో సర్వనామం లేకపోయినా, మాట్లాడేవారి పరిస్థితిని తెలుగులో సహజంగా వ్యక్తం చేయడానికి ‘మా’ చేర్చాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన కథన శైలి. ప్రత్యక్ష సంభాషణలో అత్యవసరతను నిలిపి, మూలంలోని ‘డబ్బు/వెండి,’ ‘ఈజిప్టు అంతా,’ ‘రొట్టె/ఆహారం’ భేదాలను పాదటిప్పణుల్లో కాపాడాం.
