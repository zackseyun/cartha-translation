  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּאמְר֣וּ אֶל פַּרְעֹ֗ה לָ/ג֣וּר בָּ/אָרֶץ֮ בָּאנוּ֒ כִּי אֵ֣ין מִרְעֶ֗ה לַ/צֹּאן֙ אֲשֶׁ֣ר לַ/עֲבָדֶ֔י/ךָ כִּֽי כָבֵ֥ד הָ/רָעָ֖ב בְּ/אֶ֣רֶץ כְּנָ֑עַן וְ/עַתָּ֛ה יֵֽשְׁבוּ נָ֥א עֲבָדֶ֖י/ךָ בְּ/אֶ֥רֶץ גֹּֽשֶׁן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/004.yaml
  text: They said to Pharaoh[a], “We have come to sojourn in the land, because there is no pasture for the flocks that belong to your servants, for the famine is severe in the land of Canaan. And now, please let your servants dwell in the land of Goshen.”
translation:
  language: te
  text: వారు ఫరోతో, “ఈ దేశంలో పరదేశులుగా నివసించడానికి[a] మేము వచ్చాము. మీ సేవకుల మందలకు మేతభూమి లేదు; ఎందుకంటే కనాను దేశంలో కరవు తీవ్రంగా ఉంది. ఇప్పుడు దయచేసి మీ సేవకులను గోషెను దేశంలో నివసించనివ్వండి” అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఈ దేశంలో తాత్కాలిక నివాసులుగా ఉండడానికి.”
    reason: גור అనే క్రియ విదేశీయులుగా లేదా తాత్కాలిక నివాసులుగా ఉండే భావాన్ని కలిగి ఉండవచ్చు; ప్రధాన పాఠం విదేశీయ నివాస స్థితిని ముందుకు తెస్తుండగా, ఈ ప్రత్యామ్నాయం కాలపరిమితి నుడికారాన్ని చూపుతుంది.
lexical_decisions:
- source_word: לָגוּר
  choice: పరదేశులుగా నివసించడానికి
  rationale: גור ఇక్కడ స్వదేశం కాని చోట నివసించడాన్ని సూచిస్తుంది. ‘పరదేశులుగా నివసించడానికి’ అనే రూపం శాశ్వతంగా స్థిరపడటం అనే భావాన్ని చేర్చకుండా, విదేశీయ నివాస స్థితిని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: בָּאָרֶץ
  choice: ఈ దేశంలో
  rationale: ఇక్కడ אֶרֶץ ఫరో పాలించే ఐగుప్తు దేశాన్ని సందర్భానుసారంగా సూచిస్తుంది. తెలుగులో ‘ఈ దేశంలో’ అనడం సంభాషణలో సహజంగా ఉండి భౌగోళిక భావాన్ని నిలుపుతుంది.
- source_word: מִרְעֶה
  choice: మేత
  rationale: מִרְעֶה పశువులు మేసే గడ్డి లేదా మేతభూమిని సూచిస్తుంది. ‘మేత’ సంక్షిప్తంగా, సహజంగా ఉండి సందర్భానికి సరిపోతుంది.
- source_word: לַצֹּאן
  choice: మందలకు
  rationale: צֹאן సాధారణంగా గొర్రెలు, మేకలు వంటి చిన్న పశువుల సమూహాన్ని సమష్టిగా సూచిస్తుంది. ‘మందలకు’ జాతిని అనవసరంగా నిర్దిష్టం చేయకుండా ఆ సమష్టి భావాన్ని అందిస్తుంది.
- source_word: אֲשֶׁר לַעֲבָדֶיךָ
  choice: మీ సేవకుల మందలకు
  rationale: హీబ్రూ పదబంధం మందలు ఫరో ఎదుట తమను ‘మీ సేవకులు’గా పేర్కొంటున్నవారికి చెందినవని తెలియజేస్తుంది. తెలుగులో సంబంధ విభక్తితో చెప్పడం సహజంగా ఉంటుంది.
- source_word: כָבֵד הָרָעָב
  choice: కరవు తీవ్రంగా ఉంది
  rationale: כָבֵד అక్షరార్థంగా ‘బరువైనది’ అయినా, కరవుతో వాడినప్పుడు దాని తీవ్రతను సూచిస్తుంది. ‘తీవ్రంగా ఉంది’ ఆ నుడికార భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: יֵשְׁבוּ נָא
  choice: దయచేసి ... నివసించనివ్వండి
  rationale: נָא కలిసిన ఈ అభ్యర్థన వినయపూర్వకమైన మనవిని వ్యక్తం చేస్తుంది. ‘దయచేసి ... నివసించనివ్వండి’ దాని అభ్యర్థన స్వరాన్ని ఆధునిక తెలుగులో సహజంగా నిలుపుతుంది.
- source_word: עֲבָדֶיךָ
  choice: మీ సేవకులను
  rationale: రాజసభ సందర్భంలో עבד బానిసత్వ స్థితిని తప్పనిసరిగా నొక్కిచెప్పకుండా వినయపూర్వక స్వీయసంబోధనగా పనిచేస్తుంది. అందువల్ల ‘మీ సేవకులు’ సందర్భోచితం.
- source_word: אֶרֶץ גֹּשֶׁן
  choice: గోషెను దేశంలో
  rationale: ‘గోషెను దేశం’ అనే రూపం హీబ్రూ భౌగోళిక నిర్మాణాన్ని స్పష్టంగా నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన కానీ సాధారణ పాఠకులకు సులభమైన శైలి వాడబడింది. ఫరో ఎదుటి వినయపూర్వక రాజసభ సంభాషణను ‘మీ సేవకులు’, ‘దయచేసి’ అనే రూపాలు నిలుపుతున్నాయి.
