  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. ‘మా ప్రభువు’ అనే పునరుక్తి హీబ్రూ సంభాషణలోని వినయపూర్వక సంబోధనను నిలుపుతుంది; ప్రధాన పాఠంలో ‘డబ్బు,’ ‘దేహాలు’ ఉంచి అక్షరార్థ ప్రత్యామ్నాయాలను పాదసూచికల్లో ఇచ్చాం.
