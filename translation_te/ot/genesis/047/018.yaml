base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/018.yaml
  text: 'When that year ended[a], they came to him in the second year and said to him, “We will not hide it from my lord: the money is gone, and the livestock of the herds belongs to my lord[b]. Nothing is left before my lord except our bodies and our land.”'
translation:
  language: te
  text: 'ఆ సంవత్సరం ముగిసినప్పుడు, వారు రెండవ సంవత్సరంలో ఆయన దగ్గరకు వచ్చి ఆయనతో ఇలా అన్నారు: “ప్రభువుగారికి మేము దాచిపెట్టలేము: డబ్బు[a] అయిపోయింది, పశుసంపద ప్రభువుగారి వశమైంది. మా దేహాలు[b], మా భూమి తప్ప ప్రభువుగారి ఎదుట ఇంకేమీ మిగలలేదు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వెండి.’ హీబ్రూలో ‘వెండి’ అనే పదం తరచుగా డబ్బును సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘మా వ్యక్తులు.’ హీబ్రూలో అక్షరార్థంగా ‘మా దేహాలు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּתֹּם הַשָּׁנָה הַהִוא
  choice: ఆ సంవత్సరం ముగిసిన తరువాత
  rationale: תמם సూచించే పూర్తికావడం లేదా అంతమవడం అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בַּשָּׁנָה הַשֵּׁנִית
  choice: రెండవ సంవత్సరంలో
  rationale: సందర్భంలో ఇది తరువాతి సంవత్సరాన్ని సూచించినా, హీబ్రూ పాఠంలోని ‘రెండవ సంవత్సరం’ అనే రూపాన్ని నిలుపుతుంది.
- source_word: לֹא נְכַחֵד מֵאֲדֹנִי
  choice: మా ప్రభువైన మీ దగ్గర మేము దాచేదేమీ లేదు
  rationale: כחד యొక్క ‘దాచడం/మరుగుపరచడం’ భావాన్ని సహజమైన ప్రత్యక్ష సంబోధనగా అందిస్తుంది; హీబ్రూలోని గౌరవసూచక ‘నా ప్రభువు’ను తెలుగులో సమూహ వక్తలకు సహజమైన ‘మా ప్రభువు’గా వ్యక్తం చేసింది.
- source_word: תַּם הַכֶּסֶף
  choice: డబ్బు అయిపోయింది
  rationale: כֶּסֶף అక్షరార్థంగా వెండి అయినా, ఇక్కడ చెల్లింపు సాధనమైన ధనాన్ని సూచిస్తుంది; ‘అయిపోయింది’ దాని పూర్తిగా ఖర్చైపోయిన భావాన్ని తెలియజేస్తుంది.
- source_word: וּמִקְנֵה הַבְּהֵמָה אֶל אֲדֹנִי
  choice: పశుసంపద కూడా మా ప్రభువు వశమైంది
  rationale: జంతువుల రూపంలోని ఆస్తి యోసేపుకు బదిలీ అయిందనే సందర్భార్థాన్ని స్పష్టంగా, సంక్షిప్తంగా తెలుపుతుంది.
- source_word: לֹא נִשְׁאַר לִפְנֵי אֲדֹנִי
  choice: మా ప్రభువు ఎదుట ఇంకేమీ మిగలలేదు
  rationale: נשאר యొక్క ‘మిగిలి ఉండడం’ భావాన్నీ, לִפְנֵי లోని ‘ఎదుట’ అనే హీబ్రూ రూపకాన్నీ నిలుపుతుంది.
- source_word: בִּלְתִּי אִם גְּוִיָּתֵנוּ וְאַדְמָתֵנוּ
  choice: మా దేహాలు, మా భూమి తప్ప
  rationale: మినహాయింపును స్పష్టంగా చూపుతూ, גְּוִיָּה యొక్క దేహసంబంధమైన concrete భావాన్ని కాపాడుతుంది.
