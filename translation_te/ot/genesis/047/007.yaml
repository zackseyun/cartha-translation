  text: Then Joseph brought in Jacob his father and presented him before Pharaoh[b][a], and Jacob blessed Pharaoh.
translation:
  language: te
  text: అప్పుడు యోసేపు తన తండ్రి యాకోబును లోపలికి తీసుకొచ్చి, ఫరో ఎదుట నిలబెట్టాడు[a]. యాకోబు ఫరోను ఆశీర్వదించాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘ఫరో ఎదుట అతడు నిలబడేలా చేశాడు.’
    reason: lexical_alternative
  - marker: b
    text: ‘ఆశీర్వదించాడు’ అనేది కేవలం మర్యాదపూర్వక పలకరింపే కాక, మాటలతో పలికిన అధికారిక ఆశీర్వాదాన్ని కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֵא
  choice: లోపలికి తీసుకొచ్చి
  rationale: בוא హిఫీల్ రూపంలోని కారణార్థాన్ని, అలాగే ఫరో సభలోకి ప్రవేశపెట్టిన సందర్భాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: אָבִיו
  choice: తన తండ్రి
  rationale: మూడవ పురుష ఏకవచన ప్రత్యయం యోసేపును సూచిస్తుంది; తెలుగులో కర్తను తిరిగి సూచించడానికి ‘తన తండ్రి’ సహజంగా ఉంటుంది.
- source_word: וַיַּעֲמִדֵהוּ לִפְנֵי
  choice: ఎదుట నిలబెట్టాడు
  rationale: עמד హిఫీల్‌కు అక్షరార్థంగా ‘నిలబడేలా చేశాడు’; రాజసభ సందర్భంలో ‘ఎదుట నిలబెట్టాడు’ కారణార్థాన్నీ అధికారిక సమక్షాన్నీ నిలుపుతుంది.
- source_word: לִפְנֵי פַרְעֹה
  choice: ఫరో ఎదుట
  rationale: לִפְנֵי అనే పదబంధంలోని ‘ఎదుట/సమక్షంలో’ భావాన్ని సంక్షిప్తంగా, సహజంగా అందిస్తుంది.
- source_word: וַיְבָרֶךְ
  choice: ఆశీర్వదించాడు
  rationale: ברך యొక్క సాధారణ అర్థం ‘ఆశీర్వదించు’; దీనిని కేవలం మర్యాదపూర్వక పలకరింపుగా బలహీనపరచకుండా మూలంలోని భావాన్ని నిలుపుతుంది.
- source_word: פַרְעֹה
  choice: ఫరో
  rationale: ఈజిప్టు రాజబిరుదుకు తెలుగులో స్థిరపడిన రూపం.
- source_word: וַ
  choice: అప్పుడు
  rationale: కథనాన్ని ముందుకు నడిపే వరుస చర్యను ఆధునిక తెలుగులో సహజంగా సూచిస్తుంది.
theological_decisions:
- issue: యాకోబు ఫరో పట్ల చేసిన చర్య అర్థం
  choice: యాకోబు ఫరోను నిజంగా ఆశీర్వదించాడు
  alternative: యాకోబు ఫరోను మర్యాదగా పలకరించాడు
  rationale: ברך అనే క్రియ యొక్క సాధారణ అర్థం ‘ఆశీర్వదించు.’ సామాజికంగా తక్కువ స్థితిలో కనిపించే పితృపురుషుడు మహారాజును ఆశీర్వదిస్తున్న మూలపాఠంలోని ఉద్దేశపూర్వక ఉద్వేగాన్ని అనువాదం నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయితే రాజసభ సందర్భానికి తగిన గౌరవభరిత శైలి పాటించబడింది. మూలంలోని కారణార్థక క్రియలు మరియు ‘ఆశీర్వదించాడు’ అనే వేదాంతపరమైన ఉద్వేగం నిలుపబడ్డాయి.
