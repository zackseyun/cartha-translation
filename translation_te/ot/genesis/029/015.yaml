base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/015.yaml
  text: Then Laban said to Jacob[a], “Because you are my relative, should you work for me for nothing? Tell me, what your wages should be.”
translation:
  language: te
  text: అప్పుడు లాబాను యాకోబుతో[a], “కేవలం నువ్వు నా బంధువువని మాత్రాన నాకు ఉచితంగా పని చేయాలా? నీ జీతం ఎంత కావాలో నాకు చెప్పు” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ‘నా సహోదరుడు’; ఇక్కడ ఈ పదం విస్తృతంగా ‘బంధువు’ అనే అర్థంలో ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲכִי
  choice: వైనంత మాత్రాన
  rationale: బంధుత్వమే జీతం లేకుండా పని చేయడానికి కారణం కాకూడదనే అలంకారప్రశ్న భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: אָחִי
  choice: నా బంధువు
  rationale: పదశః ‘నా సహోదరుడు’; అయితే ఇక్కడ లాబాను మేనల్లుడైన యాకోబును విస్తృత బంధుత్వార్థంలో సంబోధిస్తున్నాడు.
- source_word: וַעֲבַדְתַּנִי
  choice: నాకు ... పని చేయాలా
  rationale: עבד అనే క్రియ ఇక్కడ లాబాను కోసం చేసే శ్రమను సూచిస్తుంది; తరువాత జీతం ప్రస్తావన రావడం వల్ల ‘పని చేయడం’ సందర్భోచితం.
- source_word: חִנָּם
  choice: ఉచితంగా
  rationale: ప్రతిఫలం లేదా జీతం లేకుండా పని చేయడాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: הַגִּידָה לִּי
  choice: నాకు చెప్పు
  rationale: ఆజ్ఞార్థక క్రియను ఆధునిక తెలుగులో నేరుగా, సహజంగా అందిస్తుంది.
- source_word: מַה מַשְׂכֻּרְתֶּךָ
  choice: నీకు జీతం ఎంత ఉండాలో
  rationale: ఇంకా నిర్ణయించవలసిన ప్రతిఫలాన్ని యాకోబే పేర్కొనాలని లాబాను అడుగుతున్న చర్చా సందర్భాన్ని ప్రతిబింబిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన కథన శైలి. హీబ్రూ అలంకారప్రశ్న నిర్మాణం సహజ తెలుగులో నిలుపబడింది.
