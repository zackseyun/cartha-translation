  edition: WLC
  text: וַ/יִּתֵּ֤ן לָבָן֙ לָ֔/הּ אֶת זִלְפָּ֖ה שִׁפְחָת֑/וֹ לְ/לֵאָ֥ה בִתּ֖/וֹ שִׁפְחָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/024.yaml
  text: And Laban gave Zilpah his female servant to Leah his daughter as a female servant[a][b].
translation:
  language: te
  text: లాబాను తన కుమార్తె లేయాకు తన దాసియైన జిల్పాను దాసిగా ఇచ్చాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘దాసి’ అనే హీబ్రూ పదం ఆధారపడిన, బహుశా బానిసత్వంలో ఉన్న స్త్రీ సేవకురాలిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: ఇచ్చాడు
  rationale: נתן అనే క్రియకు కథన సందర్భంలో సహజమైన ప్రత్యక్ష అర్థం ‘ఇచ్చాడు’; ఇది లావాదేవీ స్వభావాన్ని అనవసరంగా విస్తరించదు.
- source_word: לָהּ ... לְלֵאָה בִתּוֹ
  choice: తన కుమార్తె లేయాకు
  rationale: לָהּ అక్షరార్థంగా ‘ఆమెకు’; తరువాతి ‘తన కుమార్తె లేయాకు’ అనే పదబంధమే ఆ సర్వనామ సూచ్యాన్ని స్పష్టం చేస్తుంది. తెలుగులో రెండింటినీ పునరుక్తి చేయకుండా గ్రహీతను సహజంగా వ్యక్తం చేశాం.
- source_word: זִלְפָּה
  choice: జిల్పా
  rationale: వ్యక్తి పేరును తెలుగులో ప్రామాణికంగా లిప్యంతరీకరించాం.
- source_word: שִׁפְחָתוֹ
  choice: తన దాసియైన
  rationale: שִׁפְחָה స్త్రీ సేవకురాలి అధీన, బానిస స్థితిని సూచిస్తుంది. ‘దాసి’ లింగాన్ని, సామాజిక స్థితిని సంక్షిప్తంగా నిలుపుతుంది; ‘అయిన’ జిల్పాను లాబాను దాసిగా గుర్తిస్తుంది.
- source_word: שִׁפְחָה
  choice: దాసిగా
  rationale: చివరి నామవాచకం జిల్పాను ఏ హోదాలో ఇచ్చాడో తెలియజేస్తుంది. ‘దాసిగా’ ఆ పాత్రను నేరుగా, సహజమైన తెలుగులో తెలుపుతుంది; మూలంలో స్పష్టంగా లేని ‘ఆమె దాసిగా’ అనే స్వామ్యార్థాన్ని ప్రధాన పాఠ్యంలో చేర్చలేదు.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని שִׁפְחָה పునరుక్తిని ‘తన దాసియైన … దాసిగా’ అని నిలిపి, తెలుగులో వ్యాకరణసహజంగా మలిచాం.
