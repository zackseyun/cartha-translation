  yaml_path: translation/ot/genesis/029/012.yaml
  text: Jacob told Rachel that he was her father's relative and that he was Rebekah's son[a]. Then she ran and told her father.
translation:
  language: te
  text: యాకోబు రాహేలుతో తాను ఆమె తండ్రికి బంధువుననీ, రిబ్కా కుమారుడననీ చెప్పాడు.[a] అప్పుడు ఆమె పరుగెత్తి వెళ్లి తన తండ్రికి ఈ విషయం చెప్పింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ మూలంలో అక్షరార్థంగా ‘ఆమె తండ్రి సహోదరుడు’ అని ఉంది. ఇక్కడ ‘సహోదరుడు’ అనే పదం సమీప పురుష బంధువు అనే విస్తృత అర్థంలో వాడబడింది; యాకోబు ప్రత్యేకంగా లాబాను మేనల్లుడు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגֵּד
  choice: చెప్పాడు
  rationale: נגד అనే క్రియ హిఫిల్ రూపంలో సాధారణంగా ‘తెలియజేయడం/చెప్పడం’ అనే అర్థమిస్తుంది; కథన సందర్భంలో ‘చెప్పాడు’ సహజమైన ఆధునిక తెలుగు.
- source_word: כִּי
  choice: అని / అనీ
  rationale: ఇక్కడ ‘చెప్పాడు’ అనే క్రియ తరువాత చెప్పబడిన విషయాన్ని పరిచయం చేస్తుంది; తెలుగులో పరోక్ష వాక్యానికి ‘అని/అనీ’ సహజం.
- source_word: אֲחִי אָבִיהָ
  choice: ఆమె తండ్రికి బంధువు
  rationale: అక్షరార్థంగా ‘ఆమె తండ్రి సహోదరుడు’; అయితే אָח సమీప పురుష బంధువును కూడా సూచించగలదు. యాకోబు లాబాను మేనల్లుడు కాబట్టి ‘బంధువు’ సందర్భార్థాన్ని స్పష్టంగా అందిస్తుంది; మూలంలోని రూపాన్ని పాదసూచికలో నిలుపుతుంది.
- source_word: בֶן רִבְקָה
  choice: రిబ్కా కుమారుడు
  rationale: సరళమైన పుత్రసంబంధ వ్యక్తీకరణ; ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: וַתָּרָץ
  choice: పరుగెత్తి వెళ్లి
  rationale: רץ నేరుగా పరుగెత్తడాన్ని సూచిస్తుంది; తరువాతి చర్యతో కలిపి ‘పరుగెత్తి వెళ్లి’ కథన గమనాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וַתַּגֵּד לְאָבִיהָ
  choice: తన తండ్రికి ఈ విషయం చెప్పింది
  rationale: ‘తన తండ్రికి చెప్పింది’ అనే మూలార్థాన్ని నిలుపుతూ, తెలుగులో చెప్పబడిన విషయాన్ని సూచించేందుకు ‘ఈ విషయం’ చేర్చడం సహజమైన అన్వయాన్ని ఇస్తుంది.
