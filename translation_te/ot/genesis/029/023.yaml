  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְהִ֣י בָ/עֶ֔רֶב וַ/יִּקַּח֙ אֶת לֵאָ֣ה בִתּ֔/וֹ וַ/יָּבֵ֥א אֹתָ֖/הּ אֵלָ֑י/ו וַ/יָּבֹ֖א אֵלֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/023.yaml
  text: And in the evening he took Leah his daughter and brought her to him[a], and he went in to her.
translation:
  language: te
  text: సాయంకాలం అతడు తన కుమార్తె లేయాను తీసుకొని యాకోబు దగ్గరకు తీసుకొచ్చాడు; యాకోబు ఆమె దగ్గరకు వెళ్లాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో, ‘ఆమె దగ్గరకు వెళ్లాడు’; ఇది లైంగిక సంబంధాన్ని సూచించే సాంప్రదాయ సభ్యోక్తి.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בָעֶרֶב
  choice: సాయంకాలం
  rationale: హీబ్రూ కథన సూత్రంలోని వַיְהִיని తెలుగులో విడిగా అనువదించకుండానే, కాలసూచక పదంతో సహజంగా తదుపరి సంఘటనను ప్రారంభించవచ్చు.
- source_word: וַיִּקַּח
  choice: తీసుకువచ్చి
  rationale: לקח యొక్క ప్రాథమిక భావం ‘తీసుకోవడం’; వెంటనే వచ్చే ‘తీసుకెళ్లడం/తీసుకురావడం’ క్రియతో కలిపి తెలుగులో సహజమైన సంఘటన క్రమంగా వ్యక్తీకరించబడింది.
- source_word: לֵאָה בִתּוֹ
  choice: తన కుమార్తె లేయాను
  rationale: హీబ్రూలో ‘లేయా, తన కుమార్తె’ అని ఉన్న సమానాధికార సంబంధాన్ని ఆధునిక తెలుగులో సహజమైన పదక్రమంతో తెలిపింది.
- source_word: וַיָּבֵא אֹתָהּ אֵלָיו
  choice: యాకోబు దగ్గరకు పంపాడు
  rationale: హిఫిల్ בוא అంటే ‘తీసుకురావడం’; ముందున్న ‘తీసుకున్నాడు’తో తెలుగులో భారమైన పునరుక్తిని నివారించేందుకు ‘తీసుకువచ్చి ... పంపాడు’ అని సహజీకరించబడింది. సందర్భం వల్ల ‘అతని దగ్గరకు’ అనేది యాకోబును సూచిస్తుంది.
- source_word: וַיָּבֹא אֵלֶיהָ
  choice: యాకోబు ఆమెతో శయనించాడు
  rationale: בוא אל ఇక్కడ లైంగిక సంబంధాన్ని సూచించే సాంప్రదాయ హీబ్రూ సభ్యోక్తి. పదశః తెలుగు రూపం అర్థాన్ని స్పష్టంగా అందించదు కాబట్టి, గౌరవప్రదమైన తెలుగు సభ్యోక్తి ఉపయోగించబడింది.
