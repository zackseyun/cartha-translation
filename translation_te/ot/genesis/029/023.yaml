translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కథన శైలి సరళంగా, గౌరవప్రదంగా ఉంది. మూలంలోని లైంగిక సభ్యోక్తి అసభ్యత లేకుండా అర్థమయ్యే తెలుగు సభ్యోక్తితో ఇవ్వబడింది.
