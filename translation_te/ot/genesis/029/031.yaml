  yaml_path: translation/ot/genesis/029/031.yaml
  text: When the LORD saw that Leah was hated, he opened her womb, but Rachel was barren.
translation:
  language: te
  text: యెహోవా లేయా ద్వేషించబడిందని చూసి, ఆమె గర్భాన్ని తెరిచాడు; అయితే రాహేలు గొడ్రాలిగా ఉంది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన టెట్రాగ్రామటన్‌ను సాధారణ బిరుదుతో భర్తీ చేయకుండా, తెలుగులో సుపరిచితమైన రూపంలో ఉంచాం.
- source_word: שְׂנוּאָה
  choice: ద్వేషించబడిందని
  rationale: ఈ పదానికి ఉన్న బలమైన మూలార్థాన్ని నిలబెట్టాం; సందర్భాన్ని బట్టి ‘ప్రేమించబడలేదు’ అని మృదువుగా మార్చలేదు.
- source_word: וַיִּפְתַּח אֶת־רַחְמָהּ
  choice: ఆమె గర్భాన్ని తెరిచాడు
  rationale: హీబ్రూ నుడికారాన్ని స్పష్టంగా, గౌరవప్రదంగా నిలబెట్టి సంతానోత్పత్తి సామర్థ్యం కలిగించడాన్ని సూచించాం.
- source_word: עֲקָרָה
  choice: గొడ్రాలిగా
  rationale: సంతానం కనలేని స్థితిని సూచించే, తెలుగు బైబిలు వాడుకలో సుపరిచితమైన విశేషణాన్ని ఎంచుకున్నాం.
theological_decisions:
- issue: లేయా స్థితిని తెలిపే שְׂנוּאָה పద తీవ్రత
  choice: ద్వేషించబడిందని
  alternative: ప్రేమించబడలేదని
  rationale: మూలపాఠంలోని పదబలాన్ని, అలాగే కథనంలోని ఉద్రిక్తతను మృదువుపరచకుండా నిలబెట్టాం.
- issue: యెహోవా చేసిన కార్యానికి ప్రత్యక్ష భాష
  choice: ఆమె గర్భాన్ని తెరిచాడు
  alternative: ఆమెకు సంతానం కలిగేలా చేశాడు
  rationale: మూలంలోని దేవుని ప్రత్యక్ష కార్యాన్ని, దాని శరీరసంబంధ నుడికారాన్ని వ్యాఖ్యానాత్మకంగా విస్తరించకుండా అనువదించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. మూలంలోని ‘ద్వేషించబడింది’ అనే కఠిన భావాన్ని అలాగే నిలబెట్టాం; వాక్యంలోని లేయా–రాహేలు వ్యత్యాసాన్ని ‘అయితే’తో స్పష్టంగా చూపించాం.
