  yaml_path: translation/ot/genesis/029/011.yaml
  text: Then Jacob kissed Rachel[a], and he lifted up his voice and wept.
translation:
  language: te
  text: అప్పుడు యాకోబు రాహేలును ముద్దుపెట్టాడు; గొంతెత్తి ఏడ్చాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשַּׁק
  choice: ముద్దుపెట్టుకొని
  rationale: נשק అనే క్రియకు సాధారణ అర్థం ‘ముద్దుపెట్టు’. ఈ సందర్భంలో అది బంధుత్వపూర్వక పలకరింపుగా కూడా పనిచేసి ఉండవచ్చు; అయినా మూలంలోని స్పష్టమైన చర్యను ప్రధాన పాఠంలో నిలిపాం.
- source_word: לְרָחֵל
  choice: రాహేలును
  rationale: ‘ముద్దుపెట్టు’ అనే తెలుగు క్రియతో వ్యక్తిని కర్మగా చూపడం సహజం; לְ సూచించే సంబంధాన్ని తెలుగులో ద్వితీయా విభక్తితో వ్యక్తం చేశాం.
- source_word: וַיִּשָּׂא אֶת־קֹלוֹ
  choice: గొంతెత్తి
  rationale: అక్షరార్థంగా ‘తన స్వరాన్ని ఎత్తాడు’ అనే హీబ్రూ నుడికారానికి, బిగ్గరగా ఏడవడాన్ని సహజంగా తెలిపే ఆధునిక తెలుగు రూపం ‘గొంతెత్తి’.
- source_word: וַיֵּבְךְּ
  choice: ఏడ్చాడు
  rationale: בכה అంటే ‘ఏడుచు/రోదించు’. సాధారణ పాఠకులకు సహజంగా, గౌరవప్రద కథనశైలిలో ఉండే ‘ఏడ్చాడు’ను ఎంచుకున్నాం.
- source_word: וַ
  choice: అప్పుడు
  rationale: వావ్-కన్సిక్యూటివ్ కథనంలోని తదుపరి చర్యను ముందుకు నడిపిస్తుంది; తెలుగులో ‘అప్పుడు’ ఆ క్రమాన్ని సహజంగా తెలియజేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. ‘గొంతెత్తి ఏడ్చాడు’ అనే రూపం హీబ్రూ నుడికారంలోని బిగ్గరగా రోదించిన భావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
