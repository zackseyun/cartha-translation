revisions:
- from: అప్పుడు యాకోబు రాహేలును ముద్దుపెట్టుకొని[a], గొంతెత్తి ఏడ్చాడు.
  to: అప్పుడు యాకోబు రాహేలును ముద్దుపెట్టాడు; గొంతెత్తి ఏడ్చాడు.
  rationale: The revision changes the first verb to a finite past form so that both Hebrew waw-consecutive actions are represented as sequential narrative events. It retains the natural Telugu idiom “గొంతెత్తి ఏడ్చాడు,” which adequately conveys “he lifted up his voice and wept.” The footnote is adjusted only for grammatical completeness and clarity.
