  language: en
  yaml_path: translation/ot/genesis/029/028.yaml
  text: And Jacob did so[a], and he completed this week; then Laban gave him Rachel his daughter as his wife.
translation:
  language: te
  text: యాకోబు అలాగే చేశాడు, ఈ వారాన్ని పూర్తి చేశాడు. అప్పుడు లాబాను తన కుమార్తె రాహేలును అతనికి భార్యగా ఇచ్చాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ יַעֲקֹב כֵּן
  choice: యాకోబు అలాగే చేసి
  rationale: עשה తో కలిసిన כֵּן మునుపటి వచనంలో లాబాను చెప్పినదాని ప్రకారం యాకోబు చేశాడని సూచిస్తుంది. ‘అలాగే చేసి’ ఈ అనుసంధానాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: וַיְמַלֵּא
  choice: పూర్తి చేశాడు
  rationale: מלא యొక్క పియేల్ రూపం ఇక్కడ ఒక కాలవ్యవధిని పూర్తి చేయడాన్ని సూచిస్తుంది.
- source_word: שְׁבֻעַ זֹאת
  choice: ఈ వారం[a]
  rationale: שְׁבֻעַ ఏడు రోజుల కాలాన్ని సూచిస్తుంది; వివాహ సందర్భంలో ఇది పెళ్లి వేడుకల వారమై ఉండవచ్చు. ప్రధాన పాఠంలో మూలంలోని సంక్షిప్తతను ఉంచి, సందర్భార్థాన్ని పాదసూచికలో తెలిపాం.
- source_word: וַיִּתֶּן לוֹ
  choice: అప్పుడు లాబాను ... అతనికి ... ఇచ్చాడు
  rationale: కర్తను పూర్వసందర్భం నుంచి లాబానుగా స్పష్టం చేయడం తెలుగులో సందిగ్ధతను నివారిస్తుంది; ‘అప్పుడు’ కథన క్రమాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: אֶת רָחֵל בִּתּוֹ לוֹ לְאִשָּׁה
  choice: తన కుమార్తె రాహేలును అతనికి భార్యగా
  rationale: బంధుత్వ సంబంధాన్నీ, వివాహార్థాన్నీ మూలానికి దగ్గరగా, సహజమైన తెలుగు పదక్రమంలో వ్యక్తం చేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన కథన శైలి వాడబడింది. మూలంలోని కాలసూచక సంక్షిప్తతను ప్రధాన పాఠంలో ఉంచి, సాంస్కృతిక సందర్భాన్ని పాదసూచికలో వివరించాం.
