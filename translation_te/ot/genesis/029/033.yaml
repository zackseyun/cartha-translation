  text: וַ/תַּ֣הַר עוֹד֮ וַ/תֵּ֣לֶד בֵּן֒ וַ/תֹּ֗אמֶר כִּֽי שָׁמַ֤ע יְהוָה֙ כִּֽי שְׂנוּאָ֣ה אָנֹ֔כִי וַ/יִּתֶּן לִ֖/י גַּם אֶת זֶ֑ה וַ/תִּקְרָ֥א שְׁמ֖/וֹ שִׁמְעֽוֹן־־־־־׃
base_translation:
