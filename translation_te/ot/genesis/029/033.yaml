  yaml_path: translation/ot/genesis/029/033.yaml
  text: Then she conceived again and bore a son[a], and said, “Because Yahweh has heard that I am hated[b], he has given me this one also.” So she called his name Simeon.
translation:
  language: te
  text: ఆమె మళ్లీ గర్భవతియై ఒక కుమారునికి జన్మనిచ్చి, “నేను ద్వేషించబడుతున్నానని[a] యహ్వే విన్నాడు కాబట్టి, ఈ కుమారుణ్ణి కూడా నాకు ఇచ్చాడు” అంది. కాబట్టి ఆమె అతనికి షిమ్యోను[b] అని పేరు పెట్టింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “నేను ప్రేమించబడడం లేదని” లేదా “నేను తక్కువగా ప్రేమించబడుతున్నానని” అని కూడా అనువదించవచ్చు. హీబ్రూ పదానికి అక్షరార్థం “ద్వేషించబడుతున్నాను”; అయితే సందర్భంలో అది తిరస్కరించబడడాన్ని లేదా మరొకరితో పోలిస్తే తక్కువగా ప్రేమించబడడాన్ని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “షిమ్యోను” అనే పేరు హీబ్రూలో “విన్నాడు” అనే అర్థమిచ్చే పదంతో ధ్వనిసామ్యం కలిగి ఉంది.
    reason: wordplay
lexical_decisions:
- source_word: וַתַּהַר עוֹד
  choice: ఆమె మళ్లీ గర్భవతియై
  rationale: עוֹד లోని పునరావృత భావాన్ని “మళ్లీ” స్పష్టంగా తెలియజేస్తుంది; తెలుగు కథనశైలికి సహజంగా ఉండే క్రియారూపాన్ని వాడింది.
- source_word: וַתֵּלֶד בֵּן
  choice: కుమారుణ్ణి కని
  rationale: హీబ్రూ జనన వర్ణనను సంక్షిప్తంగా, సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: כִּי שָׁמַע יְהוָה
  choice: యహ్వే విన్నాడు కాబట్టి
  rationale: כִּי కారణాన్ని సూచిస్తుంది; שָׁמַע ను పూర్తి జరిగిన చర్యగా అనువదించింది; יְהוָה అనే దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా “యహ్వే”గా లిప్యంతరీకరించింది.
- source_word: כִּי שְׂנוּאָה אָנֹכִי
  choice: నేను ద్వేషించబడుతున్నానని
  rationale: שְׂנוּאָה యొక్క బలమైన ప్రత్యక్ష అర్థాన్ని నిలుపుతుంది. ద్వేషించే వ్యక్తిని మూలపాఠం ఈ వాక్యంలో పేర్కొననందున అనువాదంలో చేర్చలేదు; సందర్భానుసార ప్రత్యామ్నాయాలను పాదటిప్పణిలో ఇచ్చింది.
- source_word: וַיִּתֶּן לִי גַּם אֶת זֶה
  choice: ఇతణ్ణి కూడా నాకు ఇచ్చాడు
  rationale: זֶה అప్పుడే పుట్టిన కుమారుణ్ణి సూచిస్తుండగా, גַּם లోని అదనపు భావాన్ని “కూడా” నిలుపుతుంది.
- source_word: וַתִּקְרָא שְׁמוֹ
  choice: అతనికి ... అని పేరు పెట్టింది
  rationale: హీబ్రూ నామకరణ సూత్రాన్ని పదశః అసహజంగా మార్చకుండా ప్రస్తుత తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: שִׁמְעוֹן
  choice: షిమ్యోను
  rationale: హీబ్రూ పేరుకు సమీపమైన తెలుగు లిప్యంతరీకరణ; שָׁמַע (“విన్నాడు”)తో ఉన్న శబ్దసామ్యాన్ని పాదటిప్పణిలో వివరిస్తుంది.
theological_decisions:
- issue: లేయా తన స్థితిని వర్ణించిన మాట
  choice: నేను ద్వేషించబడుతున్నాను
  alternative: నేను ప్రేమించబడడం లేదు / నేను తక్కువగా ప్రేమించబడుతున్నాను
  rationale: మూలంలోని שְׂנוּאָה పదబలాన్ని ప్రధాన పాఠంలో నిలిపి, సందర్భంలో ఉండగల తులనాత్మక లేదా తిరస్కార భావాన్ని పాదటిప్పణిలో ఉంచడం ద్వారా కథనంలోని ఉద్రిక్తతను పరిష్కరించకుండా కాపాడింది.
- issue: יְהוָה దైవనామం
  choice: యహ్వే
  alternative: యెహోవా / ప్రభువు
  rationale: మూలపాఠంలోని వ్యక్తిగత దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక పండిత లోకంలో సాధారణమైన ఉచ్చారణకు దగ్గరగా తెలుగులో లిప్యంతరీకరించింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలిని వాడింది. మూలంలోని బలమైన “ద్వేషించబడుతున్నాను” అనే భావాన్ని తగ్గించకుండా ఉంచి, అవసరమైన సందర్భ వివరణను పాదటిప్పణికి పరిమితం చేసింది. అందించిన ఆంగ్ల సంప్రదింపు పాఠ్యంలో పాదటిప్పణి సూచికలు విషయాలతో తారుమారుగా కనిపించినందున, తెలుగులో “ద్వేషించబడుతున్నానని” వద్ద [a], “షిమ్యోను” వద్ద [b] ఉంచి ప్రతి సూచికను సరైన పాదటిప్పణితో జత చేసింది.
