translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన సంభాషణ శైలి వాడబడింది. ‘బావి నోరు’ అనే హెబ్రీ దృశ్యరూపం నిలుపబడింది; రాయిని దొర్లించే కర్తను అనవసరంగా నిర్దిష్టం చేయలేదు.
