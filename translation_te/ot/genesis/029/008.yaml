- from: వారు, “మందలన్నీ సమకూడి, బావి నోటిమీద నుంచి రాయిని దొర్లించే వరకు మేము చేయలేం; ఆ తర్వాత మందకు[a] నీళ్లు పెడతాం” అన్నారు.
  to: వారు, “మందలన్నీ సమకూడి, బావి నోటి మీదున్న రాయిని దొర్లించే వరకు మేము మందకు నీళ్లు పెట్టలేం; అప్పుడు మందకు[a] నీళ్లు పెడతాం” అన్నారు.
  rationale: The revision supplies the contextually implied action, ‘water the flock,’ to make the Telugu idiomatic and fully intelligible without changing the Hebrew sense. It also uses a more natural Telugu expression for the stone lying over the mouth of the well. The collective livestock terminology and its footnote are retained.
