  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּאמְרוּ֮ לֹ֣א נוּכַל֒ עַ֣ד אֲשֶׁ֤ר יֵאָֽסְפוּ֙ כָּל הָ֣/עֲדָרִ֔ים וְ/גָֽלֲלוּ֙ אֶת הָ/אֶ֔בֶן מֵ/עַ֖ל פִּ֣י הַ/בְּאֵ֑ר וְ/הִשְׁקִ֖ינוּ הַ/צֹּֽאן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/008.yaml
  text: They said[a], “We cannot until all the flocks are gathered and they roll the stone away from the mouth of the well[b]; then we water the sheep.”
translation:
  language: te
  text: వారు, “మందలన్నీ సమకూడి, బావి నోటి మీదున్న రాయిని దొర్లించే వరకు మేము మందకు నీళ్లు పెట్టలేం; అప్పుడు మందకు[a] నీళ్లు పెడతాం” అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘గొర్రెలకు’; హెబ్రీ పదం గొర్రెలు, మేకలు వంటి చిన్న పశువులను సమష్టిగా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: נוּכַל
  choice: మేము చేయలేం
  rationale: יכל అనే క్రియ ఇక్కడ అసమర్థతను తెలియజేస్తుంది. సందర్భంలో చేయలేని పని మందకు నీళ్లు పెట్టడం; తెలుగు వాక్యంలో సహజంగా ఉండేందుకు కర్మను పునరుక్తి చేయలేదు.
- source_word: יֵאָסְפוּ
  choice: సమకూడి
  rationale: אסף యొక్క నిఫాల్ రూపం మందలన్నీ ఒకచోటికి చేరడాన్ని సూచిస్తుంది. ‘సమకూడి’ సహజమైన తెలుగులో ఆ భావాన్ని నిలుపుతుంది.
- source_word: הָעֲדָרִים
  choice: మందలన్నీ
  rationale: עדר పశువుల మందను, ఈ సందర్భంలో ప్రధానంగా చిన్న పశువుల మందను సూచిస్తుంది. ‘మందలు’ అనవసరంగా ఒక జాతికే పరిమితం చేయదు.
- source_word: וְגָלֲלוּ אֶת־הָאֶבֶן
  choice: రాయిని దొర్లించే వరకు
  rationale: גלל అంటే ‘దొర్లించడం.’ రాయిని ఎవరు దొర్లిస్తారో తెలుగులో ప్రత్యేకంగా పేర్కొనకుండా హెబ్రీ వాక్యంలోని సందర్భాధారిత కర్తను అలాగే ఉంచింది.
- source_word: מֵעַל פִּי הַבְּאֵר
  choice: బావి నోటిమీద నుంచి
  rationale: פִּי యొక్క ‘నోరు’ అనే స్పష్టమైన రూపకాన్ని నిలుపుతూ, מֵעַל సూచించే పైభాగం నుంచి తొలగింపును సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וְהִשְׁקִינוּ
  choice: ఆ తర్వాత ... నీళ్లు పెడతాం
  rationale: שקה యొక్క హిఫీల్ రూపం ‘నీళ్లు తాగించడం/పెట్టడం’ అని అర్థం. ‘ఆ తర్వాత’ చర్యల క్రమాన్ని స్పష్టం చేస్తుంది.
- source_word: הַצֹּאן
  choice: మందకు
  rationale: צאן అనేది గొర్రెలు, మేకలు వంటి చిన్న పశువులను సమష్టిగా సూచించగలదు. ‘మంద’ మూలంలోని సమష్టి భావాన్నీ విస్తృత అర్థాన్నీ కాపాడుతుంది.
