  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּ֞רְא וְ/הִנֵּ֧ה בְאֵ֣ר בַּ/שָּׂדֶ֗ה וְ/הִנֵּה שָׁ֞ם שְׁלֹשָׁ֤ה עֶדְרֵי צֹאן֙ רֹבְצִ֣ים עָלֶ֔י/הָ כִּ֚י מִן הַ/בְּאֵ֣ר הַ/הִ֔וא יַשְׁק֖וּ הָ/עֲדָרִ֑ים וְ/הָ/אֶ֥בֶן גְּדֹלָ֖ה עַל פִּ֥י הַ/בְּאֵֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/002.yaml
  text: He looked[a], and behold, there was a well in the field, and behold, three flocks of sheep were lying there beside it, because from that well they watered the flocks[e][d][c][b]. And the stone on the mouth of the well was large.
translation:
  language: te
  text: అతడు చూశాడు[a]. ఇదిగో, పొలంలో ఒక బావి ఉంది. ఇదిగో, దాని దగ్గర[b] మూడు గొర్రెల మందలు పడుకొని ఉన్నాయి; ఎందుకంటే ఆ బావిలోనుంచి మందలకు నీళ్లు పెట్టేవారు[c]. బావి నోటిమీద[d] ఉన్న రాయి పెద్దది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతడు చూడగా.”
    reason: ראה కథన రూపాన్ని పూర్తి క్రియగా లేదా తరువాతి దృశ్యంతో అనుసంధానించే క్రియారూపంగా తెలుగులో వ్యక్తపరచవచ్చు.
  - marker: b
    text: అక్షరార్థంగా, “దానిమీద”; ఇక్కడ భావం బావి దగ్గర లేదా పక్కన అని.
    reason: עָלֶיהָ యొక్క అక్షరార్థాన్ని, సందర్భానుసార స్థలార్థాన్ని రెండింటినీ తెలియజేస్తుంది.
  - marker: c
    text: లేదా, “ఆ బావిలోనుంచి వారు మందలకు నీళ్లు పెట్టేవారు.”
    reason: హీబ్రూలో కర్త నిర్దిష్టంగా చెప్పని బహువచన క్రియ ఉంది; తెలుగులో కర్తను వదలవచ్చు లేదా ‘వారు’ అని చేర్చవచ్చు.
  - marker: d
    text: “బావి నోరు” అంటే బావి తెరుచుకున్న పైభాగం.
    reason: మూలంలోని עַל פִּי הַבְּאֵר అనే శరీరాంగ రూపకాన్ని పాఠకునికి స్పష్టం చేస్తుంది.
lexical_decisions:
- source_word: וַיַּרְא
  choice: అతడు చూశాడు
  rationale: ראה క్రియ యొక్క కథన రూపం తదుపరి దృశ్యాన్ని పరిచయం చేస్తుంది. ‘చూశాడు’ సహజంగా ఉండి మూలంలోని దృష్టి చర్యను నేరుగా తెలియజేస్తుంది.
- source_word: וְהִנֵּה ... וְהִנֵּה
  choice: ఇదిగో ... ఇదిగో
  rationale: הִנֵּה దృశ్యంపై శ్రద్ధను ఆకర్షించే పదం. దాని పునరుక్తిని ఉంచడం మూలంలోని సజీవమైన కథనశైలిని కాపాడుతుంది.
- source_word: בְאֵר בַּשָּׂדֶה
  choice: పొలంలో ఒక బావి
  rationale: בְאֵר కు ‘బావి,’ שׂדה కు సందర్భానుసారంగా ‘పొలం’ అనే సాధారణ, స్పష్టమైన అర్థాలు సరిపోతాయి.
- source_word: שְׁלֹשָׁה עֶדְרֵי צֹאן
  choice: మూడు గొర్రెల మందలు
  rationale: עֵדֶר మందను సూచిస్తుంది; צֹאן చిన్న పశువులను, ముఖ్యంగా గొర్రెలు లేదా మేకలను సూచించగలదు. ఈ కాపరి సందర్భంలో ‘గొర్రెల మందలు’ సహజమైన ప్రతినిధి అనువాదం.
- source_word: רֹבְצִים
  choice: పడుకొని ఉన్నాయి
  rationale: רבץ జంతువులు పడుకొని ఉండడం లేదా విశ్రమించడాన్ని సూచిస్తుంది. ‘పడుకొని ఉన్నాయి’ మూలానికి దగ్గరగా, తెలుగులో సహజంగా ఉంది.
- source_word: עָלֶיהָ
  choice: దాని దగ్గర
  rationale: అక్షరార్థంగా ‘దానిమీద’ అయినా, బావితో ఉన్న స్థలసంబంధంలో మందలు బావి పక్కన లేదా దగ్గర ఉన్నాయని భావించడం సహజం.
- source_word: יַשְׁקוּ
  choice: నీళ్లు పెట్టేవారు
  rationale: שׁקה హిఫీల్ రూపం ‘త్రాగించడం/నీళ్లు పెట్టడం’ అని అర్థం. ఇక్కడ అసంపూర్ణ క్రియారూపం అలవాటుగా జరిగే చర్యను సూచించగలదు; తెలుగులో ‘పెట్టేవారు’ దాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: וְהָאֶבֶן גְּדֹלָה עַל פִּי הַבְּאֵר
  choice: బావి నోటిమీద ఉన్న రాయి పెద్దది
  rationale: మూలంలోని వర్ణనాత్మక వాక్య నిర్మాణాన్ని, ‘బావి నోరు’ అనే రూపకాన్ని కాపాడుతూ ఆధునిక తెలుగులో స్పష్టంగా అందిస్తుంది.
