  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా అనువదించబడింది. ‘ఇదిగో’ అనే పదాన్ని రెండుసార్లు ఉంచి హీబ్రూ కథనంలోని సజీవతను నిలిపాం; ‘బావి నోరు’ అనే మూల రూపకాన్ని కూడా సహజమైన తెలుగు రూపంలో కాపాడాం.
