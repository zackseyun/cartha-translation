id: GEN.29.35
reference: Genesis 29:35
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/תַּ֨הַר ע֜וֹד וַ/תֵּ֣לֶד בֵּ֗ן וַ/תֹּ֨אמֶר֙ הַ/פַּ֨עַם֙ אוֹדֶ֣ה אֶת יְהוָ֔ה עַל כֵּ֛ן קָרְאָ֥ה שְׁמ֖/וֹ יְהוּדָ֑ה וַֽ/תַּעֲמֹ֖ד מִ/לֶּֽדֶת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/035.yaml
  text: And she conceived again and bore a son[a], and she said, “This time I will praise Yahweh.” Therefore she named him Judah. Then she stopped bearing children.
translation:
  language: te
  text: ఆమె మళ్లీ గర్భవతియై ఒక కుమారుణ్ణి కన్నది. అప్పుడు ఆమె, “ఈసారి నేను యహ్వేను స్తుతిస్తాను” అంది. అందుచేత అతనికి యూదా[a] అని పేరు పెట్టింది. ఆ తర్వాత ఆమె పిల్లలను కనడం ఆగిపోయింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘యూదా’ అనే పేరు, ‘స్తుతించు’ లేదా ‘కృతజ్ఞత చెల్లించు’ అనే అర్థమున్న హీబ్రూ క్రియతో ధ్వనిసామ్యం కలిగి ఉంది.
    reason: పేరుకూ אוֹדֶה అనే క్రియకూ ఉన్న హీబ్రూ పదసంబంధాన్ని తెలుగులో నేరుగా పునరుత్పత్తి చేయలేము.
lexical_decisions:
- source_word: וַתַּהַר עוֹד
  choice: ఆమె మళ్లీ గర్భవతియై
  rationale: הרה గర్భం ధరించడాన్ని, עוֹד ఈ జనన పరంపరలో పునరావృతిని సూచిస్తాయి; ఈ రూపం ఆధునిక తెలుగు కథనంలో సహజంగా ఉంది.
- source_word: וַתֵּלֶד בֵּן
  choice: ఒక కుమారుణ్ణి కన్నది
  rationale: ילד + בן అనే ప్రసవ సంబంధమైన సాధారణ హీబ్రూ ప్రయోగాన్ని సహజమైన, గౌరవప్రదమైన తెలుగులో అందిస్తుంది.
- source_word: הַפַּעַם
  choice: ఈసారి
  rationale: మునుపటి ప్రసవాలతో ప్రస్తుత సందర్భాన్ని వ్యత్యాసపరచే సూచనార్థాన్ని అదనపు భావవ్యాఖ్య లేకుండా నిలుపుతుంది.
- source_word: אוֹדֶה
  choice: నేను స్తుతిస్తాను
  rationale: ידה యొక్క హిఫిల్ రూపం స్తుతించడం లేదా కృతజ్ఞత చెల్లించడం అనే అర్థాలను కలిగి ఉంది; ఇక్కడ యూదా పేరుతో ఉన్న పదసంబంధాన్ని తెలుపడానికి ‘స్తుతిస్తాను’ అనుకూలంగా ఉంది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, సాధారణంగా పునర్నిర్మించబడిన ఉచ్చారణకు దగ్గరగా తెలుగులో లిప్యంతరీకరించింది.
- source_word: עַל כֵּן
  choice: అందుచేత
  rationale: లేయా మాటకు, శిశువుకు పెట్టిన పేరుకు మధ్య ఉన్న కారణ సంబంధాన్ని స్పష్టంగా చూపుతుంది.
- source_word: קָרְאָה שְׁמוֹ יְהוּדָה
  choice: అతనికి యూదా అని పేరు పెట్టింది
  rationale: ‘అతని పేరును పిలిచింది’ అనే హీబ్రూ నుడికారాన్ని అర్థనిష్ఠంగా, సహజమైన తెలుగులో అందిస్తుంది.
- source_word: וַתַּעֲמֹד מִלֶּדֶת
  choice: ఆ తర్వాత ఆమె పిల్లలను కనడం ఆగిపోయింది
  rationale: עמד + מן + క్రియానామ రూపం ఒక కార్యం నిలిచిపోవడాన్ని సూచిస్తుంది; ఉద్దేశపూర్వకంగా మానేసిందని చెప్పకుండా మూలంలోని భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామాన్ని అనువదించడం
  choice: యహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమే ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా ‘యహ్వే’గా లిప్యంతరీకరించడం మూలంలోని ప్రత్యేకతను నిలుపుతుంది; ‘యెహోవా’ తరువాతి మిశ్రిత ఉచ్చారణ సంప్రదాయాన్ని ప్రతిబింబిస్తుంది.
- issue: אוֹדֶה లోని స్తుతి/కృతజ్ఞత అర్థ పరిధి
  choice: స్తుతిస్తాను
  alternative: కృతజ్ఞత చెల్లిస్తాను
  rationale: రెండు అర్థాలూ సాధ్యమే. అయితే తరువాతి ‘యూదా’ నామవ్యాఖ్యతో పదసంబంధాన్ని తెలుగులో కొంత స్పష్టంగా చూపడానికి ‘స్తుతిస్తాను’ ఎంచుకోబడింది; ప్రత్యామ్నాయ భావాన్ని పాదటిప్పణి గుర్తిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. హీబ్రూ వాక్య నిర్మాణాన్ని యాంత్రికంగా అనుకరించకుండా దాని క్రమం, కారణ సంబంధం, నామకరణ పదప్రయోగం నిలుపబడ్డాయి.
