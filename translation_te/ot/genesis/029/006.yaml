id: GEN.29.6
reference: Genesis 29:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר לָ/הֶ֖ם הֲ/שָׁל֣וֹם ל֑/וֹ וַ/יֹּאמְר֣וּ שָׁל֔וֹם וְ/הִנֵּה֙ רָחֵ֣ל בִּתּ֔/וֹ בָּאָ֖ה עִם הַ/צֹּֽאן־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/006.yaml
  text: He said to them[a], “Is he well?” And they said, “He is well. And look, Rachel his daughter is coming with the flock.”
translation:
  language: te
  text: అతడు వారిని, “అతడు క్షేమంగా ఉన్నాడా?[a]” అని అడిగాడు. వారు, “క్షేమంగానే ఉన్నాడు. ఇదిగో, అతని కుమార్తె రాహేలు మందతో వస్తోంది” అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతనికి క్షేమమేనా?” హీబ్రూ పదం ఇక్కడ శాంతి అనే భావం కంటే క్షేమం లేదా బాగోగులను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲשָׁלוֹם לוֹ
  choice: అతడు క్షేమంగా ఉన్నాడా?
  rationale: שָׁלוֹם ఇక్కడ సాధారణ ‘శాంతి’ కంటే లాబాను క్షేమం, బాగోగులను గురించి అడిగే భావంలో ఉంది. ఆధునిక తెలుగులో ఈ ప్రశ్న సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: שָׁלוֹם
  choice: క్షేమంగానే ఉన్నాడు
  rationale: మూలంలోని సంక్షిప్త ప్రత్యుత్తరం ముందున్న ప్రశ్నను ప్రతిధ్వనిస్తుంది. తెలుగులో ఉద్దేశిత కర్తను చేర్చడం స్పష్టతనిస్తుంది; ‘గానే’ ధృవీకరణ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: కంటికి కనిపిస్తున్న దృశ్యంపై వెంటనే దృష్టి మళ్లించే הִנֵּה పదబలాన్ని ‘ఇదిగో’ సహజంగా నిలుపుతుంది.
- source_word: רָחֵל
  choice: రాహేలు
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: בִּתּוֹ
  choice: అతని కుమార్తె
  rationale: ఏకవచన ప్రత్యయం లాబానును సూచిస్తుంది; బంధుత్వ గుర్తింపును మూలానికి అనుగుణంగా స్పష్టంగా ఉంచుతుంది.
- source_word: בָּאָה
  choice: వస్తోంది
  rationale: הִנֵּהతో కలసి ప్రస్తుతం కంటికి కనిపిస్తున్న రాకను సూచిస్తుంది; తెలుగు వర్తమాన ప్రగతిశీల రూపం ఈ దృశ్యత్వాన్ని సహజంగా అందిస్తుంది.
- source_word: עִם הַצֹּאן
  choice: మందతో
  rationale: צֹאן గొర్రెలు, మేకలు వంటి చిన్న పశువుల సమూహాన్ని సూచించగల సమష్టి పదం. ‘మంద’ ఈ విస్తృతతను ‘గొర్రెలు’ కంటే మెరుగ్గా నిలుపుతుంది.
