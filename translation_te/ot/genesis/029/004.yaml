base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/004.yaml
  text: Jacob said to them[a], “My brothers, where are you from?” They said[b], “We are from Haran.”
translation:
  language: te
  text: యాకోబు వారితో, “నా సహోదరులారా,[a] మీరు ఎక్కడివారు?[b]” అన్నాడు. వారు, “మేము హారానువాళ్లం” అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ “నా సహోదరులారా” అనేది మర్యాదతో కూడిన సోదరభావ సంబోధన; వారు నిజంగా తన సొంత సహోదరులని యాకోబు చెబుతున్నాడని తప్పనిసరిగా అర్థం కాదు.
    reason: cultural_note
  - marker: b
    text: మరింత అక్షరార్థంగా, “మీరు ఎక్కడి నుండి?”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר לָהֶם
  choice: వారితో ... అన్నాడు
  rationale: אמר అనే సాధారణ మాట్లాడే క్రియను ‘అన్నాడు’గా అనువదించాం; לָהֶם సూచించే సంబోధితులను ‘వారితో’ ద్వారా తెలిపాం. ప్రశ్న ఉన్నప్పటికీ మూలంలో ప్రత్యేకంగా ‘అడిగాడు’ అనే క్రియ లేదు.
- source_word: אַחַי
  choice: నా సహోదరులారా
  rationale: అక్షరార్థంగా ‘నా సహోదరులు.’ తెలియని పురుష గొర్రెల కాపరులను మర్యాదపూర్వకంగా సోదరభావంతో సంబోధిస్తున్న సందర్భం కావడంతో సంబోధన రూపాన్ని నిలిపాం.
- source_word: מֵאַיִן אַתֶּם
  choice: మీరు ఎక్కడివారు?
  rationale: מֵאַיִן మూలస్థానాన్ని అడుగుతుంది. ఆధునిక తెలుగులో ‘మీరు ఎక్కడివారు?’ సహజంగా అదే భావాన్ని తెలియజేస్తుంది.
- source_word: וַיֹּאמְרוּ
  choice: వారు ... అన్నారు
  rationale: אמר అనే సాధారణ మాట్లాడే క్రియకు దగ్గరగా ‘అన్నారు’ వాడాం; సందర్భానుసారంగా సాధ్యమైన ‘జవాబిచ్చారు’ అనే వివరణాత్మక భావాన్ని చేర్చలేదు.
- source_word: מֵחָרָן אֲנָחְנוּ
  choice: మేము హారానువాళ్లం
  rationale: מִן మూలస్థానాన్ని సూచిస్తుంది; స్వతంత్ర సర్వనామమైన ‘మేము’తో కూడిన సంక్షిప్త హీబ్రూ జవాబును సహజ తెలుగులో ‘హారానువాళ్లం’గా వ్యక్తం చేశాం.
