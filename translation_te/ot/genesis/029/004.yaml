  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన సంభాషణ శైలిని వాడాం. హీబ్రూ వాక్యంలోని సాధారణ ‘అన్నాడు/అన్నారు’ క్రియలను నిలిపి, ప్రశ్న-జవాబు స్వభావాన్ని అతిగా వివరణాత్మకంగా మార్చలేదు.
