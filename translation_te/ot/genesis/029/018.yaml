translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, గౌరవప్రదమైన కథన శైలిని వాడాం. మూలంలోని ప్రారంభ וַ־కు తెలుగులో అసహజంగా ఉండే ‘మరియు’ను ప్రధాన పాఠ్యంలో చేర్చకుండా, దాని కథన-కొనసాగింపు విధిని పాదటిప్పణిలో తెలిపాం. ‘రాహేలు కోసం’ అనే పదబంధం మూలంలోని మార్పిడి/ఉద్దేశ్య సంబంధాన్ని అతిగా వివరణ చేయకుండా నిలుపుతుంది.
