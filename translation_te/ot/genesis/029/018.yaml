source:
  edition: WLC
  text: וַ/יֶּאֱהַ֥ב יַעֲקֹ֖ב אֶת רָחֵ֑ל וַ/יֹּ֗אמֶר אֶֽעֱבָדְ/ךָ֙ שֶׁ֣בַע שָׁנִ֔ים בְּ/רָחֵ֥ל בִּתְּ/ךָ֖ הַ/קְּטַנָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/018.yaml
  text: Jacob loved Rachel[a], and he said, “I will serve you seven years for Rachel your younger daughter.”
translation:
  language: te
  text: 'యాకోబు రాహేలును ప్రేమించాడు[a], అతడు ఇలా అన్నాడు: “నీ చిన్న కుమార్తె రాహేలు కోసం నేను నీకు ఏడు సంవత్సరాలు సేవ చేస్తాను.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత రూపనిష్ఠంగా, “యాకోబు రాహేలును ప్రేమించాడు” అనే వాక్యానికి ముందు “మరియు” అని చేర్చవచ్చు. ప్రారంభంలోని సంధిపదం కథనాన్ని కొనసాగిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּאֱהַב
  choice: ప్రేమించాడు
  rationale: אָהַב అనే క్రియకు నేరమైన అర్థం ‘ప్రేమించు’. సందర్భానుసారంగా ‘ప్రేమలో పడ్డాడు’ అనవచ్చుగానీ, అది మూలంలోని సాధారణ క్రియకంటే అదనపు భావాన్ని చేర్చుతుంది.
- source_word: יַעֲקֹב אֶת־רָחֵל
  choice: యాకోబు రాహేలును
  rationale: కర్తను, ప్రత్యక్ష కర్మను తెలుగులో సహజమైన క్రమంలో ఉంచి, אֶת సూచించే నిర్దిష్ట ప్రత్యక్ష కర్మను ‘ను’ విభక్తితో వ్యక్తం చేశాం.
- source_word: וַיֹּאמֶר
  choice: అతడు … అన్నాడు
  rationale: אמר ప్రత్యక్ష సంభాషణను పరిచయం చేసే సాధారణ క్రియ. ఆధునిక తెలుగులో ఉల్లేఖనం తర్వాత ‘అన్నాడు’ సహజంగా ఉంటుంది; ‘చెప్పాడు’ కూడా సాధ్యమే.
- source_word: אֶעֱבָדְךָ
  choice: నేను నీకు … సేవ చేస్తాను
  rationale: עבד ఇక్కడ లాబాను కోసం చేసే శ్రమను సూచిస్తుంది. ‘సేవ చేస్తాను’ అనే అనువాదం పని మరియు వ్యక్తిగత ఆధీనత అనే రెండు భావాలను నిలుపుతుంది; ‘పని చేస్తాను’ మరింత వాణిజ్య ధోరణిని కలిగించవచ్చు.
- source_word: שֶׁבַע שָׁנִים
  choice: ఏడు సంవత్సరాలు
  rationale: సంఖ్యా-నామ పదబంధానికి నేరమైన, స్పష్టమైన అనువాదం.
- source_word: בְּרָחֵל
  choice: రాహేలు కోసం
  rationale: ఇక్కడ ב యాకోబు సేవకు ప్రతిఫలంగా లేదా ఉద్దేశ్యంగా రాహేలును సూచిస్తుంది. ‘కోసం’ తెలుగులో సంక్షిప్తంగా, సహజంగా ఉండి సందర్భార్థాన్ని తెలియజేస్తుంది.
- source_word: בִּתְּךָ
  choice: నీ … కుమార్తె
  rationale: రెండవ పురుష ఏకవచన ప్రత్యయంతో కూడిన ‘కుమార్తె’ అనే పదానికి నేరమైన అనువాదం.
- source_word: הַקְּטַנָּה
  choice: చిన్న
  rationale: ఈ విశేషణానికి అక్షరార్థంగా ‘చిన్న’ అని అర్థం; కుటుంబ సందర్భంలో ఇది ‘చిన్నవయస్కురాలు/చిన్న కుమార్తె’, అంటే ‘younger’, అనే తులనాత్మక భావాన్ని ఇస్తుంది. తెలుగులో ‘చిన్న కుమార్తె’ సహజంగా ఆ బంధుత్వ భేదాన్ని వ్యక్తం చేస్తుంది.
