  register: ఆధునిక ప్రామాణిక తెలుగు; గ్రామీణ పశుపోషణ సందర్భానికి తగిన సాధారణ పదజాలం వాడబడింది. యాకోబు పలువురితో మాట్లాడుతున్నందున బహువచన ఆజ్ఞారూపాలు నిలుపబడ్డాయి.
