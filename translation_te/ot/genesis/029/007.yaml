  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר הֵ֥ן עוֹד֙ הַ/יּ֣וֹם גָּד֔וֹל לֹא עֵ֖ת הֵאָסֵ֣ף הַ/מִּקְנֶ֑ה הַשְׁק֥וּ הַ/צֹּ֖אן וּ/לְכ֥וּ רְעֽוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/007.yaml
  text: Then he said[a], “Look, the day is still long; it is not time for the livestock to be gathered. Water the flock[b], then go and pasture them.”
translation:
  language: te
  text: 'అప్పుడు అతడు ఇలా అన్నాడు: “చూడండి, ఇంకా చాలా పగలు మిగిలి ఉంది[a]. పశువులను సమకూర్చే సమయం కాదు. మందకు[b] నీళ్లు పెట్టి, వెళ్లి వాటిని మేపండి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఇంకా పట్టపగలే ఉంది.” హీబ్రూ నుడికారం పదశః “రోజు ఇంకా పెద్దది/పొడవుగా ఉంది” అని ఉంటుంది; అంటే రోజులో ఇంకా చాలాసమయం మిగిలి ఉందని అర్థం.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ ముందుగా వాడిన “పశువులు” అనే పదానికి మూలంలోని సమూహవాచకం పెంపుడు పశువులను విస్తృతంగా సూచించగలదు; “మంద”కు మూలంలోని పదం గొర్రెలు, మేకలు వంటి చిన్న పశువులను మరింత ప్రత్యేకంగా సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: చూడండి
  rationale: సంభాషణలో శ్రోతల దృష్టిని ఆకర్షించే అవ్యయంగా ఉంది; ఆధునిక తెలుగులో సహజంగా, గౌరవప్రదంగా బహువచన సంబోధనను నిలుపుతుంది.
- source_word: עוֹד הַיּוֹם גָּדוֹל
  choice: ఇంకా చాలా పగలు మిగిలి ఉంది
  rationale: హీబ్రూ నుడికారం రోజులో ఇంకా చాలాభాగం, వెలుతురు మిగిలి ఉందని సూచిస్తుంది. పదశః రూపాన్ని బలవంతంగా రుద్దకుండా దాని కాలసంబంధ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: לֹא עֵת הֵאָסֵף הַמִּקְנֶה
  choice: పశువులను ఒకచోట చేర్చే సమయం ఇంకా కాలేదు
  rationale: עֵת తగిన సమయాన్ని, הֵאָסֵף పశువులు సమకూర్చబడటాన్ని, מִקְנֶה విస్తృతార్థంలో పెంపుడు పశువుల సమూహాన్ని సూచిస్తాయి. తెలుగు వాక్యనిర్మాణంలో సహజంగా ఉండేందుకు భావసమాన రూపం వాడబడింది.
- source_word: הַשְׁקוּ
  choice: నీళ్లు పెట్టి
  rationale: שׁקה హిఫీల్ ఆజ్ఞారూపం ‘తాగించండి/నీరు ఇవ్వండి’ అనే భావం కలిగి ఉంది. పశువుల సందర్భంలో ‘నీళ్లు పెట్టండి’ ఆధునిక తెలుగులో సహజమైన ప్రయోగం.
- source_word: הַצֹּאן
  choice: మంద
  rationale: צֹאן ప్రధానంగా గొర్రెలు, మేకలు వంటి చిన్న పశువుల సమూహాన్ని సూచిస్తుంది. సందర్భంలో ‘మంద’ సహజమైన సమూహవాచకం; కేవలం గొర్రెలకే అర్థాన్ని పరిమితం చేయదు.
- source_word: וּלְכוּ
  choice: వెళ్లి
  rationale: సంయోజకంతో కూడిన బహువచన ఆజ్ఞ; నీళ్లు పెట్టిన తరువాత వెళ్లి మేపాలనే కార్యక్రమాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: רְעוּ
  choice: వాటిని మేపండి
  rationale: רעה ఇక్కడ పశువులను మేతకు తీసుకెళ్లి మేపడాన్ని సూచిస్తుంది. ‘మేపండి’ సందర్భానికి స్పష్టమైన, సాధారణ తెలుగు పదం.
