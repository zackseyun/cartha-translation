translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి పాటించబడింది. ‘మంద’ అనే పదం హీబ్రూ צֹאן యొక్క విస్తృత అర్థాన్ని నిలుపుతుంది; ‘కాపరి’ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వృత్తి/పాత్ర పదం.
