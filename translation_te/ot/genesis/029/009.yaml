  text: עוֹדֶ֖/נּוּ מְדַבֵּ֣ר עִמָּ֑/ם וְ/רָחֵ֣ל בָּ֗אָה עִם הַ/צֹּאן֙ אֲשֶׁ֣ר לְ/אָבִ֔י/הָ כִּ֥י רֹעָ֖ה הִֽוא׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/009.yaml
  text: While he was still speaking with them[a], Rachel came with her father’s flock, for she was a shepherdess.
translation:
  language: te
  text: అతడు ఇంకా వారితో మాట్లాడుతుండగా, రాహేలు తన తండ్రికి చెందిన మందతో వచ్చింది; ఎందుకంటే ఆమె కాపరిగా ఉండేది[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆమె మందను కాసేది.’ హీబ్రూలో స్త్రీలింగ రూపం రాహేలు మందను కాసే వ్యక్తి అని తెలియజేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: עוֹדֶנּוּ מְדַבֵּר
  choice: అతడు ఇంకా … మాట్లాడుతుండగానే
  rationale: ఈ హీబ్రూ నిర్మాణం మాటలు కొనసాగుతున్న సమయంలోనే తదుపరి సంఘటన జరిగిందని సూచిస్తుంది. ‘మాట్లాడుతుండగానే’ కాలసమాంతరతను సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: עִמָּם
  choice: వారితో
  rationale: ఇది యాకోబు మాట్లాడుతున్న కాపరులను సూచించే మూడవ పురుష బహువచన ప్రత్యయంతో కూడిన సరళమైన విభక్తి రూపం.
- source_word: וְרָחֵל בָּאָה
  choice: రాహేలు … వచ్చింది
  rationale: రాహేలు అనే పేరును ప్రామాణిక తెలుగు రూపంలో ఇచ్చి, בוא క్రియను కథన సందర్భానికి సహజమైన ‘వచ్చింది’గా అనువదించాం.
- source_word: עִם הַצֹּאן אֲשֶׁר לְאָבִיהָ
  choice: తన తండ్రికి చెందిన మందతో
  rationale: צֹאן గొర్రెలు లేదా మేకలతో కూడిన మందను సూచించగలదు కాబట్టి ‘మంద’ అనే విస్తృత పదాన్ని ఎంచుకున్నాం. సంబంధ వాక్యం తెలిపే యాజమాన్యాన్ని ‘తన తండ్రికి చెందిన’ అని స్పష్టంగా నిలిపాం.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: రాహేలు మందతో రావడానికి గల వివరణను ఈ సంధిపదం పరిచయం చేస్తుంది.
- source_word: רֹעָה הִוא
  choice: ఆమె ఆ మందకు కాపరి
  rationale: స్త్రీలింగ క్రియాత్మక నామరూపం రాహేలు మందను కాసే బాధ్యతగల వ్యక్తి అని గుర్తిస్తుంది. తెలుగులో ‘కాపరి’ సహజంగా స్త్రీకీ పురుషునికీ వాడబడుతుంది; ‘ఆమె’ అనే సర్వనామం లింగాన్ని స్పష్టపరుస్తుంది.
