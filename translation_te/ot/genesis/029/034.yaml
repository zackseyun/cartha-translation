  yaml_path: translation/ot/genesis/029/034.yaml
  text: And she conceived again and bore a son[a], and said, “Now this time my husband will be attached to me, because I have borne him three sons.” Therefore his name was called Levi.
translation:
  language: te
  text: ఆమె మళ్లీ గర్భవతియై ఒక కుమారుణ్ణి కనింది. అప్పుడు ఆమె, “ఇప్పుడు, ఈసారి నా భర్త నాతో జతపడతాడు[a]; ఎందుకంటే నేను అతనికి ముగ్గురు కుమారులను కన్నాను” అంది. అందుచేత అతనికి ‘లేవి’ అని పేరు పెట్టారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నా భర్త నాతో అనుబంధం కలిగి ఉంటాడు.” హీబ్రూలో “జతపడతాడు” అనే క్రియకు, “లేవి” అనే పేరుకు మధ్య పదప్రయోగం ఉంది.
    reason: יִלָּוֶה యొక్క సమీప అర్థాన్ని సూచిస్తూ, לוה–לֵוִי నామకరణ పదప్రయోగాన్ని కచ్చితంగా తెలియజేస్తుంది.
lexical_decisions:
- source_word: וַתַּהַר עוֹד
  choice: ఆమె మళ్లీ గర్భవతియై
  rationale: הרה గర్భం ధరించడాన్ని సూచిస్తుంది; עוֹד లోని పునరావృత్తి భావాన్ని “మళ్లీ” సహజంగా తెలియజేస్తుంది.
- source_word: וַתֵּלֶד בֵּן
  choice: ఒక కుమారుణ్ణి కనింది
  rationale: తెలుగు జనన కథనంలో ילד עם בן అనే సాధారణ హీబ్రూ ప్రయోగానికి ఇది సహజమైన, స్పష్టమైన సమానార్థకం.
- source_word: עַתָּה הַפַּעַם
  choice: ఇప్పుడు, ఈసారి
  rationale: రెండు హీబ్రూ అవ్యయాలనూ నిలుపుతూ లేయా ఆశలోని ఉద్ఘాటనను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: יִלָּוֶה אִישִׁי אֵלַי
  choice: నా భర్త నాతో కలిసి ఉంటాడు
  rationale: నిఫాల్ రూపంలోని ‘జతపడు/కలిసివుండు’ భావాన్ని వైవాహిక సందర్భంలో సహజంగా అందిస్తుంది; కేవలం శారీరక సమీపతగా అర్థాన్ని పరిమితం చేయదు.
- source_word: כִּי יָלַדְתִּי לוֹ שְׁלֹשָׁה בָנִים
  choice: ఎందుకంటే నేను అతనికి ముగ్గురు కుమారులను కన్నాను
  rationale: כִּי లోని కారణార్థాన్ని, לוֹ లోని సంబంధాన్ని, సంఖ్యను నేరుగా నిలుపుతుంది.
- source_word: עַל כֵּן קָרָא שְׁמוֹ לֵוִי
  choice: అందుచేత అతనికి ‘లేవి’ అని పేరు పెట్టారు
  rationale: పేరు పెట్టడానికి గల కారణాన్ని స్పష్టంగా తెలుపుతుంది. హీబ్రూలో క్రియ పుంలింగ ఏకవచనంలో ఉన్నా కర్తను పేరుతో చెప్పలేదు; తెలుగు అనిర్దిష్ట కర్త ప్రయోగం ఎవరు పేరు పెట్టారో అదనంగా నిర్ణయించకుండా ఉంచుతుంది.
theological_decisions:
- issue: יִלָּוֶה మరియు לֵוִי మధ్య ఉన్న నామకరణ పదప్రయోగం
  choice: ప్రధాన పాఠంలో “నాతో కలిసి ఉంటాడు” అని, పాదసూచికలో “నాతో జతకూడతాడు” అనే ప్రత్యామ్నాయాన్ని ఇచ్చి హీబ్రూ ధ్వనిసామ్యాన్ని వివరించడం
  alternative: “నాకు హత్తుకొని ఉంటాడు”
  rationale: హీబ్రూ క్రియలోని అనుబంధం/జతపడడం భావాన్ని ప్రధాన పాఠం సహజమైన ఆధునిక తెలుగులో అందిస్తుంది. ప్రత్యామ్నాయం మరియు ధ్వనిసామ్య వివరణ మూలంలోని నామకరణ సంబంధాన్ని కాపాడుతాయి; ‘హత్తుకొను’ అనేది అవసరానికి మించి శారీరక భావాన్ని కలిగించవచ్చు.
- issue: קָרָא అనే క్రియకు స్పష్టంగా పేర్కొనని కర్త
  choice: “పేరు పెట్టారు” అనే అనిర్దిష్ట కర్త నిర్మాణం
  alternative: “అతడు అతనికి పేరు పెట్టాడు”
  rationale: మూలంలో వ్యాకరణపరంగా పుంలింగ ఏకవచన క్రియ ఉన్నప్పటికీ కర్త ఎవరో స్పష్టంగా పేర్కొనలేదు. తెలుగు అనిర్దిష్ట నిర్మాణం యాకోబు లేదా మరొక వ్యక్తిని పేరు పెట్టినవాడిగా మౌనంగా నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే గౌరవప్రదమైన కథన శైలి. లేయా మాటలలోని ఆశను నిలుపుతూ అతిగా వ్యాఖ్యానించే పదాలను నివారించాం.
