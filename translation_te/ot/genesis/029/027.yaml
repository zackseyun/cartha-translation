  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: מַלֵּ֖א שְׁבֻ֣עַ זֹ֑את וְ/נִתְּנָ֨ה לְ/ךָ֜ גַּם אֶת זֹ֗את בַּ/עֲבֹדָה֙ אֲשֶׁ֣ר תַּעֲבֹ֣ד עִמָּדִ֔/י ע֖וֹד שֶֽׁבַע שָׁנִ֥ים אֲחֵרֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/027.yaml
  text: Complete this woman's bridal week[c][b][a], and we will give you this one also in return for the work that you will do with me for another seven years.
translation:
  language: te
  text: ఈమె పెళ్లి వారాన్ని పూర్తి చేయి[a]. నువ్వు నా దగ్గర మరో ఏడు సంవత్సరాలు చేసే పనికి ప్రతిగా[c] ఈమెను కూడా నీకు ఇస్తాం[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీలో పదశః, ‘ఈమె వారం పూర్తి చేయి.’ ఇక్కడ అది ఆచారం ప్రకారం జరిగే పెళ్లి వారాన్ని సూచిస్తుంది.
    reason: cultural_note
  - marker: b
    text: లేదా, ‘ఈమె కూడా నీకు ఇవ్వబడుతుంది.’ హెబ్రీ క్రియారూపం మూడవ పురుష ఏకవచన స్త్రీలింగంలో ఉంది; సందర్భంలో మాత్రం లాబాను మరో కుమార్తెను కూడా ఇస్తానని వాగ్దానం చేస్తున్నాడు.
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘నువ్వు నా కోసం పని చేస్తావు’ లేదా ‘సేవ చేస్తావు.’ హెబ్రీ క్రియకు ‘పని చేయు’ మరియు ‘సేవ చేయు’ అనే అర్థాలు ఉన్నాయి; ఇక్కడ అది లాబాను వద్ద చేసే పనిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלֵּא
  choice: పూర్తి చెయ్యి
  rationale: מלא అనే ఆజ్ఞారూపం నిర్ణీత కాలాన్ని ముగించమని చెబుతుంది. ఆధునిక తెలుగులో ‘పూర్తి చెయ్యి’ సహజంగా ఉండి ఆజ్ఞ భావాన్ని నిలుపుతుంది.
- source_word: שְׁבֻעַ זֹאת
  choice: ఈమె పెళ్లివారం
  rationale: పదశః ‘ఈమె యొక్క వారం’; సందర్భంలో זֹאת లేయాను సూచిస్తుంది, שְׁבֻעַ వివాహానంతర ఆచారబద్ధమైన ఏడు రోజుల కాలాన్ని సూచిస్తుంది. ‘పెళ్లివారం’ ఆ సాంస్కృతిక భావాన్ని సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: וְנִתְּנָה לְךָ
  choice: నీకు ఇస్తాం
  rationale: రూపపరంగా ఇది మూడవ పురుష ఏకవచన స్త్రీలింగ రూపమైనా, సందర్భంలో లాబాను తన వర్గం తరఫున మరో కుమార్తెను ఇస్తాననే వాగ్దానాన్ని తెలియజేస్తున్నాడు. తెలుగులో ‘ఇస్తాం’ సహజమైన సందర్భార్థాన్ని ఇస్తుంది; రూపపరమైన ప్రత్యామ్నాయం పాదసూచికలో ఉంచబడింది.
- source_word: גַּם אֶת זֹאת
  choice: ఈమెను కూడా
  rationale: ఇది మరో కుమార్తె రాహేలును సూచిస్తుంది. స్త్రీలింగ సర్వనామం తెలుగులో సూచ్యవ్యక్తిని స్పష్టంగా ఉంచుతుంది.
- source_word: בַּעֲבֹדָה אֲשֶׁר תַּעֲבֹד עִמָּדִי
  choice: నువ్వు నా దగ్గర ... చేసే పనికి ప్రతిగా
  rationale: עבד పని చేయడం లేదా సేవ చేయడం అనే రెండు భావాలు కలిగి ఉంది. ఇక్కడ లాబాను వద్ద యాకోబు చేసే శ్రమకు బదులుగా కుమార్తెను ఇవ్వడం అనే ఒప్పంద భావం ఉంది. ‘నా దగ్గర చేసే పని’ తెలుగు వాడుకలో పని సంబంధాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: עוֹד שֶׁבַע שָׁנִים אֲחֵרוֹת
  choice: మరో ఏడు సంవత్సరాలు
  rationale: עוֹד మరియు אֲחֵרוֹת కలిగిన అదనపు కాల భావాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: וְנִתְּנָה యొక్క కర్త మరియు వాచ్యం
  choice: ‘ఇస్తాం’ అని ప్రధాన పాఠ్యంలో క్రియాశీల బహువచనంగా అనువదించడం
  alternative: ‘ఈమె కూడా నీకు ఇవ్వబడుతుంది’ అని రూపానికి దగ్గరగా అనువదించడం
  rationale: ఈ వాక్యం లాబాను చేస్తున్న వాగ్దానం కనుక క్రియాశీల బహువచనం సందర్భంలో సహజం. అయితే హెబ్రీ రూపంలోని అనిశ్చితిని తొలగించకుండా ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా, గౌరవప్రదంగా ఉండే శైలి. ‘పెళ్లివారం’ సాంస్కృతిక సందర్భాన్ని సహజంగా తెలియజేస్తుంది. ‘నా దగ్గర పని చేయడం’ అనే ప్రయోగం ఆధునిక తెలుగులో యజమాని వద్ద చేసే పనిని సూచిస్తుంది; హెబ్రీలోని ‘పని/సేవ’ భావ పరిధిని నిర్ణయాత్మకంగా సంకుచితం చేయదు.
