  yaml_path: translation/ot/genesis/029/016.yaml
  text: Laban had two daughters; the name of the older was Leah[a], and the name of the younger was Rachel.
translation:
  language: te
  text: లాబానుకు ఇద్దరు కుమార్తెలు ఉండేవారు.[a] పెద్ద కుమార్తె పేరు లేయా, చిన్న కుమార్తె పేరు రాహేలు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “లాబానుకు ఇద్దరు కుమార్తెలు”; ఇది లాబానుకు ఇద్దరు కుమార్తెలు ఉన్నారని తెలిపే స్వామ్య ప్రయోగం.
    reason: మూలభాషలోని దత్తివాచక స్వామ్య నిర్మాణాన్ని వివరించడానికి.
lexical_decisions:
- source_word: וּלְלָבָן
  choice: లాబానుకు … ఉండేవారు
  rationale: హీబ్రూ దత్తివాచక స్వామ్య నిర్మాణాన్ని తెలుగులో సహజమైన ‘లాబానుకు … ఉండేవారు’ అనే నిర్మాణంతో వ్యక్తం చేశాం. ప్రారంభ וּ־కు ప్రత్యేకంగా ‘మరియు/ఇప్పుడు’ అని చేర్చలేదు; అది కథన అనుసంధానాన్ని సూచిస్తుంది.
- source_word: שְׁתֵּי בָנוֹת
  choice: ఇద్దరు కుమార్తెలు
  rationale: వ్యక్తులను లెక్కించే సహజ తెలుగు సంఖ్యారూపమైన ‘ఇద్దరు’తో పాటు మూలంలోని ‘కుమార్తెలు’ అనే బంధాన్ని స్పష్టంగా నిలిపాం.
- source_word: שֵׁם
  choice: పేరు
  rationale: రెండు సమాంతర భాగాల్లోనూ మూలంలోని ‘పేరు’ సూత్రాన్ని నిలిపి, సహజ తెలుగు వాక్యక్రమాన్ని వాడాం.
- source_word: הַגְּדֹלָה
  choice: పెద్ద కుమార్తె
  rationale: ఇద్దరు అక్కచెల్లెళ్ల సందర్భంలో ఇది శరీర పరిమాణం కాక వయస్సులో పెద్దదాన్ని సూచిస్తుంది; ‘పెద్ద కుమార్తె’ సాధారణ ఆధునిక తెలుగు.
- source_word: לֵאָה
  choice: లేయా
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగులో ప్రాచుర్యంలో ఉన్న రూపంలో లిప్యంతరీకరించాం.
- source_word: הַקְּטַנָּה
  choice: చిన్న కుమార్తె
  rationale: ఈ సహోదరీల సందర్భంలో వయస్సులో చిన్నదాన్ని సూచించే సహజ తెలుగు ప్రయోగం.
- source_word: רָחֵל
  choice: రాహేలు
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగులో ప్రాచుర్యంలో ఉన్న రూపంలో లిప్యంతరీకరించాం.
