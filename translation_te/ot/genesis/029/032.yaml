id: GEN.29.32
reference: Genesis 29:32
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/תַּ֤הַר לֵאָה֙ וַ/תֵּ֣לֶד בֵּ֔ן וַ/תִּקְרָ֥א שְׁמ֖/וֹ רְאוּבֵ֑ן כִּ֣י אָֽמְרָ֗ה כִּֽי רָאָ֤ה יְהוָה֙ בְּ/עָנְיִ֔/י כִּ֥י עַתָּ֖ה יֶאֱהָבַ֥/נִי אִישִֽׁ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/032.yaml
  text: Leah conceived and bore a son[a], and she called his name Reuben, for she said, “Because Yahweh has seen my affliction, now my husband will love me.”
translation:
  language: te
  text: 'లేయా గర్భం దాల్చి ఒక కుమారుణ్ణి కనింది. ఆమె అతనికి రూబేను[a] అని పేరు పెట్టింది, ఎందుకంటే ఆమె ఇలా చెప్పింది: “యాహ్వే నా బాధను చూశాడు; ఇప్పుడు నా భర్త నన్ను ప్రేమిస్తాడు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “రూబేను” అనే పేరు హీబ్రూలో “చూడండి, ఒక కుమారుడు” అనే మాటలా వినిపిస్తుంది; “యాహ్వే నా బాధను చూశాడు” అనే లేయా మాటలతో కూడా దీనికి పదసంబంధం ఉంది.
    reason: పేరులోని హీబ్రూ పదచమత్కారం తెలుగులో నేరుగా కనిపించదు కాబట్టి.
lexical_decisions:
- source_word: וַתַּהַר
  choice: గర్భవతియై
  rationale: הרה గర్భం ధరించడాన్ని సూచిస్తుంది; జనన వృత్తాంతంలో ‘గర్భవతియై’ సహజమైన, సంక్షిప్తమైన తెలుగు ప్రయోగం.
- source_word: וַתֵּלֶד בֵּן
  choice: ఒక కుమారుణ్ణి కనింది
  rationale: ילד + בן అనే ప్రసవ సంబంధిత సాధారణ హీబ్రూ ప్రయోగాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: וַתִּקְרָא שְׁמוֹ
  choice: అతనికి … అని పేరు పెట్టింది
  rationale: హీబ్రూ నామకరణ సూత్రాన్ని తెలుగులో స్పష్టంగా, సహజంగా అందిస్తుంది.
- source_word: רְאוּבֵן
  choice: రూబేను
  rationale: వ్యక్తి పేరును ప్రామాణిక తెలుగు బైబిలు రూపానికి సమీపంగా లిప్యంతరీకరించాం; పేరులోని హీబ్రూ పదచమత్కారాన్ని పాదటిప్పణిలో వివరించాం.
- source_word: כִּי אָמְרָה
  choice: అని చెప్పి
  rationale: పేరు పెట్టడానికి లేయా చెప్పిన కారణాన్ని తెలుగు వాక్య నిర్మాణంలో సహజంగా అనుసంధానిస్తుంది.
- source_word: כִּי רָאָה יְהוָה
  choice: యెహోవా … చూశాడు
  rationale: సందర్భంలో మొదటి כִּי పేరు పెట్టడానికి కారణాన్ని పరిచయం చేస్తుంది; తెలుగులో ఉద్ధరణ మరియు ‘అని చెప్పి’ నిర్మాణం ఆ కారణ సంబంధాన్ని సహజంగా తెలియజేస్తాయి.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన టెట్రాగ్రామటన్‌ను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే వ్యక్తినామ రూపంలో అందించాం.
- source_word: בְּעָנְיִי
  choice: నా బాధను
  rationale: עֳנִי దుఃఖం, దీనస్థితి, బాధ అనే భావాలను కలిగి ఉంది; భర్త ప్రేమ లేని లేయా స్థితిని ‘బాధ’ సాధారణ పాఠకునికి సహజంగా తెలియజేస్తుంది.
- source_word: כִּי עַתָּה
  choice: ఇప్పుడు
  rationale: లేయా కుమారుణ్ణి కన్న ఫలితంగా ఏర్పడుతుందని ఆశించిన మార్పును עַתָּה స్పష్టంగా సూచిస్తుంది.
- source_word: יֶאֱהָבַנִי אִישִׁי
  choice: నా భర్త నన్ను ప్రేమిస్తాడు
  rationale: వైవాహిక సందర్భంలో אִישִׁי అంటే ‘నా భర్త’; אהב యొక్క భావోద్వేగ, సంబంధపరమైన బలాన్ని ‘ప్రేమిస్తాడు’ నేరుగా నిలుపుతుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: మూలంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా పేరు రూపంలో ఉంచాం; ఆధునిక ప్రామాణిక తెలుగులో విస్తృతంగా తెలిసిన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం.
- issue: లేయా మాటల్లోని రెండు כִּי పదాల సంబంధం
  choice: మొదటిదాన్ని నామకరణ కారణంగా, రెండవదాన్ని ఆశకు ఆధారంగా సందర్భానుసారంగా వ్యక్తపరచడం
  alternative: రెండింటినీ ‘ఎందుకంటే’ అని స్పష్టంగా అనువదించడం
  rationale: హీబ్రూలో కారణ సంబంధం ఉన్నప్పటికీ, రెండింటినీ పదేపదే తెలుగులో చూపితే వాక్యం కృత్రిమంగా ఉంటుంది. ఉద్ధరణ నిర్మాణం మొదటి కారణాన్ని, అర్ధవిరామం రెండవ భావసంబంధాన్ని నిలుపుతున్నాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన కథన శైలి, అయితే నామకరణం మరియు లేయా ఆశలోని భావోద్వేగ గంభీరతను నిలిపింది. ప్రధాన పాఠంలోని [a] సూచిక పాదటిప్పణితో సరిపోలుతుంది.
