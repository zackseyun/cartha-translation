revisions:
- from: లేయా గర్భవతియై ఒక కుమారుణ్ణి కనింది. “యెహోవా నా బాధను చూశాడు; ఇప్పుడు నా భర్త నన్ను ప్రేమిస్తాడు” అని చెప్పి, అతనికి రూబేను[a] అని పేరు పెట్టింది.
  to: 'లేయా గర్భం దాల్చి ఒక కుమారుణ్ణి కనింది. ఆమె అతనికి రూబేను[a] అని పేరు పెట్టింది, ఎందుకంటే ఆమె ఇలా చెప్పింది: “యాహ్వే నా బాధను చూశాడు; ఇప్పుడు నా భర్త నన్ను ప్రేమిస్తాడు.”'
