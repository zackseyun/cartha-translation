  yaml_path: translation/ot/genesis/029/029.yaml
  text: And Laban gave Bilhah[a], his female servant, to Rachel his daughter as her female servant.
translation:
  language: te
  text: లాబాను తన కుమార్తె రాహేలుకు తన దాసి బిల్హాను ఆమె దాసిగా ఇచ్చాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ שִׁפְחָה పదం వచ్చిన రెండు చోట్లా “పనికత్తె” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: ఇచ్చాడు
  rationale: נתן క్రియ యొక్క వావ్-కన్సెక్యూటివ్ రూపం గతంలో జరిగిన కార్యాన్ని కథనంగా తెలియజేస్తుంది; సందర్భంలో ‘ఇచ్చాడు’ సహజమైన, నేరమైన అనువాదం.
- source_word: לָבָן
  choice: లాబాను
  rationale: వ్యక్తి పేరును తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: לְרָחֵל
  choice: రాహేలుకు
  rationale: ל ఉపసర్గ ఇక్కడ స్వీకర్తను సూచిస్తుంది; తెలుగు విభక్తి ‘కు’ ఆ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בִּתּוֹ
  choice: తన కుమార్తె
  rationale: మూడవ పురుష ఏకవచన పుంలింగ ప్రత్యయం లాబానును సూచిస్తుంది. ఒకే కర్తను తిరిగి సూచించేందుకు తెలుగులో ‘తన’ సహజం.
- source_word: אֶת
  choice: '[ప్రత్యేకంగా అనువదించలేదు]'
  rationale: ఇది నిర్దిష్ట ప్రత్యక్ష కర్మ సూచకం; తెలుగులో దీనికి ప్రత్యేక పదం అవసరం లేదు.
- source_word: בִּלְהָה
  choice: బిల్హాను
  rationale: వ్యక్తి పేరును మూల ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించి, ప్రత్యక్ష కర్మను సూచించేందుకు ‘ను’ చేర్చాం.
- source_word: שִׁפְחָתוֹ
  choice: తన దాసి
  rationale: שִׁפְחָה స్త్రీ సేవకురాలు లేదా బానిస స్త్రీని సూచిస్తుంది. ‘దాసి’ లింగాన్ని, ఆధీన సేవా స్థితిని సంక్షిప్తంగా నిలుపుతుంది; వయస్సును అనవసరంగా నిర్దేశించదు.
- source_word: לָהּ לְשִׁפְחָה
  choice: ఆమె దాసిగా
  rationale: לָהּ రాహేలును సూచిస్తుంది; తరువాతి పాత్రవాచక ప్రయోగంతో కలిపి తెలుగులో ‘ఆమె దాసిగా’ సహజంగా ఉంటుంది.
- source_word: לְשִׁפְחָה
  choice: దాసిగా
  rationale: మొదటి שִׁפְחָהతో ఉన్న పదపునరుక్తిని నిలుపుతూ, బిల్హా రాహేలుకు ఏ హోదాలో ఇవ్వబడిందో తెలియజేస్తుంది.
