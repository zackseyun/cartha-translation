source:
  edition: WLC
  text: וַ/יְהִ֣י בַ/בֹּ֔קֶר וְ/הִנֵּה הִ֖וא לֵאָ֑ה וַ/יֹּ֣אמֶר אֶל לָבָ֗ן מַה זֹּאת֙ עָשִׂ֣יתָ לִּ֔/י הֲ/לֹ֤א בְ/רָחֵל֙ עָבַ֣דְתִּי עִמָּ֔/ךְ וְ/לָ֖/מָּה רִמִּיתָֽ/נִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/025.yaml
  text: In the morning, behold, it was Leah. And he said to Laban, “What is this you have done to me? Was it not for Rachel that I worked with you? So why have you deceived me?”
translation:
  language: te
  text: ఉదయం అయ్యేసరికి, ఇదిగో, ఆమె లేయా! అప్పుడు అతడు లాబానుతో, “నీవు నాకు చేసినదేమిటి? రాహేలు కోసమే కదా నేను నీ దగ్గర పనిచేశాను? మరి నన్నెందుకు మోసం చేశావు?” అన్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי בַבֹּקֶר
  choice: ఉదయం అయ్యేసరికి
  rationale: హీబ్రూ కథనంలోని కాలమార్పును సహజమైన ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: וְהִנֵּה הִוא לֵאָה
  choice: ఇదిగో, ఆమె లేయా!
  rationale: הִנֵּה వ్యక్తపరచే ఆకస్మిక గుర్తింపు, ఆశ్చర్యాన్ని నిలుపుతుంది; హీబ్రూ వాక్యంలోని నాటకీయ ఉద్వేగాన్ని ఆశ్చర్యార్థక చిహ్నంతో సహజంగా అందిస్తుంది.
- source_word: עָבַדְתִּי עִמָּךְ
  choice: నేను నీ దగ్గర పనిచేశాను
  rationale: ఇక్కడ עִם కు సేవా సంబంధ సందర్భంలో సహజమైన తెలుగు రూపం; యాకోబు లాబాను వద్ద చేసిన పనిని సూచిస్తుంది.
- source_word: רִמִּיתָנִי
  choice: నన్ను మోసం చేశావు
  rationale: רמה అనే క్రియలోని ఉద్దేశపూర్వక వంచన భావాన్ని నేరుగా తెలియజేస్తుంది.
theological_decisions:
- issue: హీబ్రూ ప్రశ్న הֲלֹא లోని బలమైన నిరీక్షణ
  choice: రాహేలు కోసమే కదా
  alternative: నేను రాహేలు కోసం పని చేయలేదా?
  rationale: ప్రశ్నకు ఆశించబడే ‘అవును’ అనే సమాధానాన్ని, యాకోబు అభ్యంతరంలోని బలాన్ని సహజ తెలుగులో నిలుపుతుంది.
- issue: וְלָמָּה లోని అనుసంధానం
  choice: మరి నన్నెందుకు
  alternative: అయితే నన్నెందుకు
  rationale: ముందటి వాస్తవం ఆధారంగా వచ్చే నిరసనాత్మక ప్రశ్నను చూపుతుంది; కారణ సంబంధాన్ని అతిగా నిర్ధారించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన కథన శైలి. సంభాషణలో యాకోబు ఆశ్చర్యం మరియు అభియోగం నేరుగా నిలుపబడ్డాయి.
