id: GEN.29.10
reference: Genesis 29:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְהִ֡י כַּ/אֲשֶׁר֩ רָאָ֨ה יַעֲקֹ֜ב אֶת רָחֵ֗ל בַּת לָבָן֙ אֲחִ֣י אִמּ֔/וֹ וְ/אֶת צֹ֥אן לָבָ֖ן אֲחִ֣י אִמּ֑/וֹ וַ/יִּגַּ֣שׁ יַעֲקֹ֗ב וַ/יָּ֤גֶל אֶת הָ/אֶ֨בֶן֙ מֵ/עַל֙ פִּ֣י הַ/בְּאֵ֔ר וַ/יַּ֕שְׁקְ אֶת צֹ֥אן לָבָ֖ן אֲחִ֥י אִמּֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/010.yaml
  text: And when Jacob saw Rachel[a], the daughter of Laban, his mother’s brother, and the flock of Laban, his mother’s brother, Jacob came near and rolled the stone from the mouth of the well, and watered the flock of Laban, his mother’s brother.
translation:
  language: te
  text: తన తల్లి సోదరుడైన లాబాను కుమార్తె రాహేలును, తన తల్లి సోదరుడైన లాబాను మందను యాకోబు చూసినప్పుడు, యాకోబు సమీపించి బావి నోటిమీదున్న రాయిని దొర్లించి, తన తల్లి సోదరుడైన లాబాను మందకు నీళ్లు తాగించాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: చూసినప్పుడు
  rationale: హీబ్రూ కథన సూత్రంలోని కాలసంబంధ భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది; ‘అప్పుడు ఇలా జరిగింది’ అనే మరింత శాబ్దిక రూపం ఇక్కడ భారంగా ఉంటుంది.
- source_word: רָאָה
  choice: చూసినప్పుడు
  rationale: ఈ సందర్భంలో క్రియ సాధారణ దృశ్యగ్రహణాన్ని సూచిస్తుంది; ‘చూశాడు’ అనే మూలార్థం కాలవాచక ఉపవాక్య రూపంలో నిలుపబడింది.
- source_word: בַּת לָבָן
  choice: లాబాను కుమార్తె
  rationale: రాహేలును ఆమె కుటుంబ సంబంధంతో స్పష్టంగా గుర్తించే నిర్మాణాన్ని సంక్షిప్తంగా, సహజంగా నిలుపుతుంది.
- source_word: אֲחִי אִמּוֹ
  choice: తన తల్లి సోదరుడైన
  rationale: ‘మేనమామ’ అని సంక్షిప్తం చేయకుండా హీబ్రూలోని స్పష్టమైన బంధుత్వ పదబంధాన్ని, అలాగే దాని మూడుసార్ల పునరుక్తిని నిలుపుతుంది.
- source_word: צֹאן
  choice: మంద
  rationale: ఈ సమూహవాచక పదం గొర్రెలు లేదా మేకలుగా అనవసరంగా పరిమితం చేయకుండా చిన్న పశువుల గుంపును సూచిస్తుంది.
- source_word: וַיִּגַּשׁ
  choice: దగ్గరకు వెళ్లి
  rationale: చర్య జరిగే స్థలానికి యాకోబు సమీపించిన భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: וַיָּגֶל
  choice: దొర్లించి
  rationale: రాయిని కేవలం తొలగించాడనే సాధారణ భావం కాకుండా, దొర్లించిన నిర్దిష్ట చర్యను నిలుపుతుంది.
- source_word: מֵעַל פִּי הַבְּאֵר
  choice: బావి నోటిమీద నుండి
  rationale: פֶּה అనే ‘నోరు’ రూపకాన్ని నిలుపుతూ, రాయి బావి పైభాగం నుండి తొలగించబడిన సంబంధాన్ని తెలుగులో స్పష్టంగా చెబుతుంది.
- source_word: וַיַּשְׁקְ
  choice: నీళ్లు తాగించాడు
  rationale: שׁקה హిఫీల్ రూపంలోని ‘నీరు తాగించు’ అనే కారక భావాన్ని పశువుల సందర్భంలో సహజంగా వ్యక్తపరుస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన కథన శైలి వాడబడింది. హీబ్రూ మూలంలోని బంధుత్వ పదబంధం మూడుసార్ల పునరుక్తిని ఉద్దేశపూర్వకంగా నిలుపుతూ, ‘మేనమామ’ అనే సంక్షిప్త రూపాన్ని నివారించాం.
