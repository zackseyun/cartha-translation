- from: తన తల్లి సోదరుడైన లాబాను కుమార్తె రాహేలును[a], తన తల్లి సోదరుడైన లాబాను మందను యాకోబు చూసినప్పుడు, యాకోబు దగ్గరకు వెళ్లి బావి నోటిమీద నుండి రాయిని దొర్లించి, తన తల్లి సోదరుడైన లాబాను మందకు నీళ్లు తాగించాడు.
