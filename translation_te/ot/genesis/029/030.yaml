  source_fidelity: మూలంలోని וַיָּבֹא אֶל అనే వివాహ-సందర్భపు సౌమ్యప్రయోగాన్ని “రాహేలుతో కూడా కాపురం చేశాడు” సముచితంగా తెలియజేస్తుంది. రాహేలుపట్ల లేయాకంటే ఎక్కువ ప్రేమ, లాబాను వద్ద అదనంగా ఏడు సంవత్సరాల పని అన్న మూడు ప్రధాన భావాలూ సరిగ్గా ఉన్నాయి. עִמּוֹకు “లాబాను దగ్గర” అనేది అక్షరానువాదం కాకపోయినా, ఈ సందర్భంలో అతని సేవలో పనిచేయడాన్ని సహజంగా, సరిగ్గా వ్యక్తపరుస్తుంది.
