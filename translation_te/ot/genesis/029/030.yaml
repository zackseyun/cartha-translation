source:
  edition: WLC
  text: וַ/יָּבֹא֙ גַּ֣ם אֶל רָחֵ֔ל וַ/יֶּאֱהַ֥ב גַּֽם אֶת רָחֵ֖ל מִ/לֵּאָ֑ה וַ/יַּעֲבֹ֣ד עִמּ֔/וֹ ע֖וֹד שֶֽׁבַע שָׁנִ֥ים אֲחֵרֽוֹת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/030.yaml
  text: So he went in to Rachel also[a], and he loved Rachel more than Leah; and he served with him for another seven years.
translation:
  language: te
  text: అతడు రాహేలుతో కూడా కాపురం చేశాడు. అతడు లేయాకంటే రాహేలును ఎక్కువగా ప్రేమించాడు[a]. తరువాత అతడు లాబాను దగ్గర మరో ఏడు సంవత్సరాలు పనిచేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “లేయాను కాకుండా రాహేలును ప్రేమించాడు.” హెబ్రీ పూర్వప్రత్యయం ఇక్కడ తులనను సూచించవచ్చు; ఈ సందర్భంలో “లేయాకంటే ఎక్కువగా” అనేదే అత్యంత సహజమైన భావం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא גַּם אֶל־רָחֵל
  choice: అతడు రాహేలుతో కూడా కాపురం చేశాడు
  rationale: ఈ వివాహ సందర్భంలో בוא אֶל దాంపత్య సంబంధాన్ని సూచించే సంప్రదాయ ప్రయోగం. ఆధునిక తెలుగులో ‘కాపురం చేశాడు’ అనేది అతిగా స్పష్టీకరించకుండా దాని భావాన్ని సహజంగా తెలియజేస్తుంది; גַּם భావాన్ని ‘కూడా’ నిలుపుతుంది.
- source_word: וַיֶּאֱהַב גַּם אֶת־רָחֵל
  choice: అతడు ... రాహేలును ... ప్రేమించాడు
  rationale: אָהַב సాధారణంగా ‘ప్రేమించు’; మూలంలో ప్రత్యేక తీవ్రతను తెలిపే క్రియావిశేషణం లేదు.
- source_word: מִלֵּאָה
  choice: లేయాకంటే ... ఎక్కువగా
  rationale: ప్రేమను తెలిపే క్రియ తరువాత מִן ఇక్కడ సహజంగా తులనను సూచిస్తుంది.
- source_word: וַיַּעֲבֹד עִמּוֹ
  choice: లాబాను దగ్గర ... పనిచేశాడు
  rationale: עבד పని/సేవ చేయడాన్ని సూచిస్తుంది. עִמּוֹ అక్షరార్థంగా ‘అతనితో’; తెలుగులో యజమాని ఆధీనంలో కొనసాగిన పనిని ‘దగ్గర పనిచేశాడు’ సహజంగా వ్యక్తం చేస్తుంది. సందర్భస్పష్టత కోసం సర్వనామానికి బదులు ‘లాబాను’ వాడబడింది.
- source_word: עוֹד שֶׁבַע שָׁנִים אֲחֵרוֹת
  choice: మరో ఏడు సంవత్సరాలు
  rationale: עוֹד మరియు אֲחֵרוֹת కలిసి అదనపు కాలాన్ని సూచిస్తాయి; ‘మరో ఏడు సంవత్సరాలు’ సహజమైన ఆధునిక తెలుగు.
theological_decisions:
- issue: מִן యొక్క తులనాత్మక లేదా ప్రత్యామ్నాయ భావం
  choice: లేయాకంటే రాహేలును ఎక్కువగా ప్రేమించాడు
  alternative: లేయాను కాకుండా రాహేలును ప్రేమించాడు
  rationale: సందర్భంలో ఇద్దరితోనూ వివాహ సంబంధం ఉన్నందున తులనాత్మక భావమే అత్యంత సహజం; అయినా హెబ్రీ పూర్వప్రత్యయానికి ప్రత్యామ్నాయ భావసాధ్యత ఉండటంతో దాన్ని పాదటిప్పణిలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘కాపురం చేశాడు’ వివాహ పరిపూర్తిని మర్యాదగా సూచిస్తుంది; ‘సేవ చేశాడు’ కంటే ‘పనిచేశాడు’ సాధారణ పాఠకులకు ఈ శ్రమసందర్భంలో స్పష్టంగా ఉంటుంది.
