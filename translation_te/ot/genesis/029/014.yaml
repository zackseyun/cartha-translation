    issue: The expression “నీవు నిజంగా నా ఎముకవు, నా మాంసానివి” is grammatically uneven and stylistically awkward.
    rationale: The two coordinated predicates receive mismatched forms. “నీవు నిజంగా నా ఎముక, నా మాంసం” preserves the Hebrew idiom directly and is a natural Telugu nominal-predicate construction in this context.
