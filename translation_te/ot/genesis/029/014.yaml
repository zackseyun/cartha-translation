id: GEN.29.14
reference: Genesis 29:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר ל/וֹ֙ לָבָ֔ן אַ֛ךְ עַצְמִ֥/י וּ/בְשָׂרִ֖/י אָ֑תָּה וַ/יֵּ֥שֶׁב עִמּ֖/וֹ חֹ֥דֶשׁ יָמִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/014.yaml
  text: Then Laban said to him[b][a], “Surely you are my bone and my flesh.” And he stayed with him for a month.
translation:
  language: te
  text: అప్పుడు లాబాను అతనితో, “నీవు నిజంగా నా ఎముక, నా మాంసం[a]” అన్నాడు. యాకోబు అతనితో ఒక నెల రోజులపాటు[b] ఉన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “నా ఎముక, నా మాంసం” అనేది దగ్గరి రక్తసంబంధాన్ని లేదా బంధుత్వాన్ని తెలిపే హీబ్రూ నుడికారం.
    reason: cultural_note
  - marker: b
    text: హీబ్రూ పదబంధాన్ని అక్షరార్థంగా “ఒక నెల రోజులు” అని అనవచ్చు; భావం “ఒక నెలపాటు” లేదా “పూర్తి నెలపాటు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... అన్నాడు
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది; ఆధునిక తెలుగు కథన ప్రవాహంలో ‘అప్పుడు’ సహజంగా క్రమాన్ని తెలియజేస్తుంది.
- source_word: אַךְ
  choice: నిజంగా
  rationale: ఇక్కడ ఇది పరిమితిని సూచించకుండా బంధుత్వాన్ని బలంగా ధృవీకరించే అవ్యయంగా పనిచేస్తుంది.
- source_word: עַצְמִי וּבְשָׂרִי
  choice: నా ఎముకవు, నా మాంసానివి
  rationale: రక్తసంబంధాన్ని తెలిపే హీబ్రూ నుడికారంలోని దృశ్యరూపాన్ని, ఇతర వచనాలతో దాని ప్రతిధ్వనిని నిలుపుతుంది.
- source_word: אָתָּה
  choice: నీవు ... వు/వి
  rationale: స్వతంత్ర సర్వనామంలోని ఉద్ఘాటనను ‘నీవు’ నిలుపుతుంది; తెలుగులో విధేయ ప్రత్యయాలతో అర్థం సహజంగా వ్యక్తమవుతుంది.
- source_word: וַיֵּשֶׁב
  choice: ఉన్నాడు
  rationale: ఈ సందర్భంలో తాత్కాలికంగా లాబానుతో ఉండడాన్ని సూచిస్తుంది; ‘ఉన్నాడు’ సాధారణ ఆధునిక తెలుగులో సహజమైనది.
- source_word: עִמּוֹ
  choice: అతనితో
  rationale: లాబానుతో యాకోబు ఉండడాన్ని నేరుగా తెలియజేస్తుంది.
- source_word: חֹדֶשׁ יָמִים
  choice: ఒక నెల రోజులపాటు
  rationale: హీబ్రూ వ్యక్తీకరణలోని ‘నెల—రోజులు’ రూపాన్ని తెలుగులో సహజంగా ఉంచుతూ, పూర్తి నెల వ్యవధిని తెలియజేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన, సామాన్య పాఠకులకు సులభమైన కథన శైలి. మూలంలోని బంధుత్వ నుడికారాన్ని ప్రధాన వచనంలో నిలిపి, దాని భావాన్ని పాదటిప్పణిలో వివరించాం. అస్పష్టత నివారించేందుకు చివరి వాక్యంలో కర్తను ‘యాకోబు’ అని స్పష్టంచేశాం.
