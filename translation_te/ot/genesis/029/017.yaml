id: GEN.29.17
reference: Genesis 29:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/עֵינֵ֥י לֵאָ֖ה רַכּ֑וֹת וְ/רָחֵל֙ הָֽיְתָ֔ה יְפַת תֹּ֖אַר וִ/יפַ֥ת מַרְאֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/017.yaml
  text: Leah’s eyes were soft[a], but Rachel was beautiful in form and appearance.
translation:
  language: te
  text: లేయా కళ్ళు సున్నితమైనవి[a]; రాహేలు మాత్రం చక్కని దేహాకృతితో, అందమైన రూపంతో ఉండేది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘మృదువైనవి,’ ‘నాజూకైనవి,’ లేదా ‘బలహీనమైనవి.’ హీబ్రూ విశేషణం మృదుత్వాన్ని లేదా సున్నితత్వాన్ని సూచించవచ్చు; ఇక్కడి ఖచ్చితమైన భావఛాయ అనిశ్చితం.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵינֵי
  choice: కళ్ళు
  rationale: ఈ నిర్మాణరూప బహువచనం లేయా కళ్ళనే స్పష్టంగా సూచిస్తుంది; సాధారణ చూపు లేదా మొత్తం రూపాన్ని కాదు.
- source_word: רַכּוֹת
  choice: సున్నితంగా
  rationale: ఈ విశేషణం మృదుత్వం లేదా సున్నితత్వాన్ని సూచించగలదు. ప్రతికూల భావాన్ని తప్పనిసరిగా చేర్చే ‘బలహీనంగా’ కంటే ‘సున్నితంగా’ మూలంలోని అనిశ్చితిని మెరుగ్గా నిలుపుతుంది.
- source_word: יְפַת תֹּאַר
  choice: చక్కని శరీరాకారంతో
  rationale: ఈ పదబంధం శారీరక ఆకృతి లేదా దేహనిర్మాణాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో సహజంగా ఉండేలా, తదుపరి ‘రూపం’తో తేడాను నిలిపే అనువాదం.
- source_word: וִיפַת מַרְאֶה
  choice: అందమైన రూపంతో
  rationale: מַרְאֶה కనబడే రూపాన్ని సూచిస్తుంది. శరీరాకారం, కనిపించే రూపం అనే మూలంలోని ద్వంద్వ వర్ణనను వేర్వేరుగా ఉంచుతుంది.
- source_word: וְ
  choice: మాత్రం
  rationale: హీబ్రూలో సాధారణ సంధాయకం ఉన్నప్పటికీ, సందర్భంలో లేయా–రాహేలు వర్ణనల మధ్య వ్యత్యాసం ఉంది; తెలుగులో ‘మాత్రం’ ఆ వ్యత్యాసాన్ని సహజంగా తెలియజేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘శరీరాకారం’ మరియు ‘రూపం’ ద్వారా హీబ్రూ వచనంలోని రెండు వేర్వేరు శారీరక వర్ణనలను నిలిపాం; రַכּוֹת యొక్క సందిగ్ధ భావాన్ని పాదటిప్పణిలో భద్రపరిచాం.
