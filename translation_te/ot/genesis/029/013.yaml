translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా గౌరవప్రదమైన కథనశైలి వాడబడింది. హీబ్రూ వరుస వావ్-క్రియలను తెలుగులో సహజమైన సంయుక్త క్రియలు మరియు వాక్య విభజనతో అందించాం. మూలంలో గణనీయమైన పాఠాంతర లేదా తాత్త్విక సందిగ్ధత లేకపోవడంతో పాదటిప్పణులు అవసరం కాలేదు.
