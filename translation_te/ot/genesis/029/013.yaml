id: GEN.29.13
reference: Genesis 29:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְהִי֩ כִ/שְׁמֹ֨עַ לָבָ֜ן אֶת שֵׁ֣מַע יַעֲקֹ֣ב בֶּן אֲחֹת֗/וֹ וַ/יָּ֤רָץ לִ/קְרָאת/וֹ֙ וַ/יְחַבֶּק ל/וֹ֙ וַ/יְנַשֶּׁק ל֔/וֹ וַ/יְבִיאֵ֖/הוּ אֶל בֵּית֑/וֹ וַ/יְסַפֵּ֣ר לְ/לָבָ֔ן אֵ֥ת כָּל הַ/דְּבָרִ֖ים הָ/אֵֽלֶּה־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/013.yaml
  text: And when Laban heard the news about Jacob[a], his sister’s son, he ran to meet him and embraced him and kissed him and brought him to his house[c][b]. Then Jacob told Laban all these things.
translation:
  language: te
  text: లాబాను తన సహోదరి కుమారుడైన యాకోబును గురించిన వార్త విన్నప్పుడు, అతనిని కలుసుకోవడానికి పరుగెత్తి వెళ్లి, అతనిని కౌగిలించుకొని ముద్దుపెట్టుకున్నాడు. తరువాత అతనిని తన ఇంటికి తీసుకువచ్చాడు. యాకోబు ఈ సంగతులన్నిటినీ లాబానుకు వివరించాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִשְׁמֹעַ
  choice: విన్నప్పుడు
  rationale: כ + infinitive construct ఇక్కడ కాలసూచక ఉపవాక్యాన్ని ప్రవేశపెడుతుంది. ‘విన్నప్పుడు’ సహజమైన ఆధునిక తెలుగు; తక్షణత్వాన్ని అతిగా సూచించదు.
- source_word: שֵׁמַע יַעֲקֹב
  choice: యాకోబును గురించిన వార్త
  rationale: שֵׁמַע ఇక్కడ వినికిడి క్రియను కాక, యాకోబుకు సంబంధించిన వార్త లేదా సమాచారాన్ని సూచిస్తుంది.
- source_word: בֶּן אֲחֹתוֹ
  choice: తన సహోదరి కుమారుడైన
  rationale: హీబ్రూ బంధుత్వ వ్యక్తీకరణను స్పష్టంగా నిలుపుతుంది; ‘మేనల్లుడు’ కంటే మూలంలోని ‘సహోదరి కుమారుడు’ అనే నిర్మాణానికి దగ్గరగా ఉంటుంది.
- source_word: וַיָּרָץ לִקְרָאתוֹ
  choice: అతనిని కలుసుకోవడానికి పరుగెత్తి వెళ్లి
  rationale: לִקְרָאתוֹ అంటే అతనిని ఎదుర్కొని కలుసుకోవడానికి వెళ్లడం. తెలుగు వాక్యప్రవాహంలో ‘పరుగెత్తి వెళ్లి’ సహజంగా ఉంటుంది.
- source_word: וַיְחַבֶּק לוֹ
  choice: అతనిని కౌగిలించుకొని
  rationale: חבק యొక్క ప్రత్యక్ష అర్థం కౌగిలించుకోవడం; కుటుంబ స్వాగత సందర్భానికి తగిన గౌరవప్రదమైన సాధారణ పదప్రయోగం.
- source_word: וַיְנַשֶּׁק לוֹ
  choice: ముద్దుపెట్టుకున్నాడు
  rationale: נשׁק యొక్క సరళ అర్థాన్ని కుటుంబ పలకరింపు సందర్భంలో అదనపు భావార్థం చేర్చకుండా అందిస్తుంది.
- source_word: וַיְבִיאֵהוּ אֶל־בֵּיתוֹ
  choice: అతనిని తన ఇంటికి తీసుకువచ్చాడు
  rationale: హిఫిల్ రూపం ‘తీసుకురావడం’ అనే భావాన్ని ఇస్తుంది; אֶל־בֵּיתוֹను సహజంగా ‘తన ఇంటికి’గా అనువదించాం.
- source_word: וַיְסַפֵּר לְלָבָן
  choice: యాకోబు ... లాబానుకు వివరించాడు
  rationale: వ్యాకరణపరంగా కర్త వ్యక్తంగా లేకపోయినా సందర్భంలో యాకోబే కర్త. ముందరి క్రియల కర్త లాబాను కావడంతో తెలుగులో పేరును మళ్లీ పేర్కొనడం కర్త మార్పును స్పష్టం చేస్తుంది.
- source_word: אֵת כָּל־הַדְּבָרִים הָאֵלֶּה
  choice: జరిగిన విషయాలన్నిటినీ
  rationale: דְּבָרִים సందర్భానుసారంగా మాటలు, సంగతులు, విషయాలు అని అర్థమవుతుంది. ఇక్కడ యాకోబు వివరించిన పరిణామాలను సూచిస్తున్నందున ‘జరిగిన విషయాలన్నిటినీ’ సహజంగా ఉంటుంది.
