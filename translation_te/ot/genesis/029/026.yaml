id: GEN.29.26
reference: Genesis 29:26
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר לָבָ֔ן לֹא יֵעָשֶׂ֥ה כֵ֖ן בִּ/מְקוֹמֵ֑/נוּ לָ/תֵ֥ת הַ/צְּעִירָ֖ה לִ/פְנֵ֥י הַ/בְּכִירָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/026.yaml
  text: Laban said[a], “It is not done this way in our place[c][b], to give the younger before the older.”
translation:
  language: te
  text: 'లాబాను ఇలా అన్నాడు: “మా ప్రాంతంలో[a] పెద్దదానికి[c] ముందుగా చిన్నదానిని ఇవ్వడం[b] ఆచారం కాదు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “మా మధ్య”; హీబ్రూలో అక్షరార్థంగా “మా స్థలంలో,” అంటే స్థానిక ఆచారంలో అని భావం.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ “ఇవ్వడం” అంటే వివాహానికి ఇవ్వడం; హీబ్రూ పాఠ్యంలో “వివాహానికి” అనే మాట స్పష్టంగా లేదు.
    reason: lexical_alternative
  - marker: c
    text: లేదా “మొదట పుట్టినదాని”; హీబ్రూ పదం జననక్రమంలో మొదట పుట్టిన కుమార్తెను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: ఇలా అన్నాడు
  rationale: హీబ్రూ కథనంలో אמר అనే క్రియకు సహజమైన ఆధునిక తెలుగు సమానం; ఉల్లేఖనం రాబోతున్నందున ‘ఇలా’ చేర్చడం తెలుగులో సాఫీగా ఉంటుంది.
- source_word: לָבָן
  choice: లాబాను
  rationale: వ్యక్తి పేరును తెలుగులో స్థిరంగా, మూల ఉచ్చారణకు సమీపంగా లిప్యంతరీకరించింది.
- source_word: לֹא יֵעָשֶׂה כֵן
  choice: ఆచారం కాదు
  rationale: ఇక్కడ నిఫాల్ క్రియారూపం కేవలం సాధ్యతను కాక స్థానికంగా అనుసరించే సామాజిక పద్ధతిని సూచిస్తుంది; ‘ఆచారం కాదు’ ఆ భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: בִּמְקוֹמֵנוּ
  choice: మా ప్రాంతంలో
  rationale: మూలంలో అక్షరార్థంగా ‘మా స్థలంలో’ ఉన్నా, సందర్భంలో స్థానిక సమాజపు పద్ధతి ఉద్దేశం; ‘మా ప్రాంతంలో’ ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: לָתֵת
  choice: ఇవ్వడం
  rationale: נתן అనే క్రియ యొక్క సరళ అర్థాన్ని నిలుపుతుంది; వివాహానికి ఇవ్వడం అనే భావం సందర్భంలో అంతర్లీనంగా ఉంది.
- source_word: הַצְּעִירָה
  choice: చిన్నదానిని
  rationale: స్త్రీలింగ విశేషణం నామవాచకంగా వాడబడింది; మూలంలో ‘కుమార్తె’ స్పష్టంగా లేకపోవడంతో దానిని ప్రధాన పాఠ్యంలో చేర్చలేదు.
- source_word: לִפְנֵי
  choice: కంటే ముందు
  rationale: ఇక్కడ స్థలాన్ని కాక క్రమంలోని ప్రాధాన్యాన్ని సూచిస్తుంది; తెలుగు పోలిక నిర్మాణంలో ఇది స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: הַבְּכִירָה
  choice: పెద్దదాని
  rationale: మొదట పుట్టిన స్త్రీని సూచించే పదాన్ని సందర్భానికి సహజమైన తెలుగులో అందిస్తుంది; ‘జ్యేష్ఠురాలు’ కంటే సాధారణ పాఠకులకు సులభంగా అర్థమవుతుంది.
