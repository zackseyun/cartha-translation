lexical_decisions:
- source_word: וַיִּשָּׂא יַעֲקֹב רַגְלָיו
  choice: యాకోబు బయలుదేరి
  rationale: అక్షరార్థంగా ‘యాకోబు తన పాదాలను ఎత్తాడు’; ఇది ప్రయాణాన్ని ఉత్సాహంగా కొనసాగించడాన్ని సూచించే హీబ్రూ ప్రయోగం. సహజమైన ఆధునిక తెలుగులో ‘బయలుదేరి’ అని అందించాం.
- source_word: אַרְצָה בְנֵי־קֶדֶם
  choice: తూర్పు ప్రజల దేశానికి
  rationale: בְּנֵי־קֶדֶם అక్షరార్థంగా ‘తూర్పు కుమారులు’; సందర్భంలో తూర్పు ప్రాంత ప్రజలను సూచిస్తుంది. తెలుగులో సహజంగా, మూల భావాన్ని నిలుపుతూ ‘తూర్పు ప్రజలు’ అని అనువదించాం.
