translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. హీబ్రూ నుడికారాన్ని పదేపదే అనువదించకుండా దాని సహజ భావాన్ని వ్యక్తం చేశాం.
