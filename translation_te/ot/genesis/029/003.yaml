translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే గౌరవప్రదమైన కథన శైలి వాడబడింది. హీబ్రూ వాక్యంలో వరుసగా ఉన్న క్రియల అలవాటు భూతార్థాన్ని ‘చేరేవి/పెట్టేవారు/ఉంచేవారు’ ద్వారా చూపించాం. తెలుగు స్పష్టత కోసం సందర్భంలో అంతర్లీనంగా ఉన్న కర్తను ‘కాపరులు’గా వ్యక్తం చేశాం.
