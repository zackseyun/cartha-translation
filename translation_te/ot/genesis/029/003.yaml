source:
  edition: WLC
  text: וְ/נֶאֶסְפוּ שָׁ֣מָּ/ה כָל הָ/עֲדָרִ֗ים וְ/גָלֲל֤וּ אֶת הָ/אֶ֨בֶן֙ מֵ/עַל֙ פִּ֣י הַ/בְּאֵ֔ר וְ/הִשְׁק֖וּ אֶת הַ/צֹּ֑אן וְ/הֵשִׁ֧יבוּ אֶת הָ/אֶ֛בֶן עַל פִּ֥י הַ/בְּאֵ֖ר לִ/מְקֹמָֽ/הּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/003.yaml
  text: And all the flocks would gather there[a], and they would roll the stone away from the mouth of the well and water the flock[b], and then put the stone back in its place over the mouth of the well.
translation:
  language: te
  text: మందలన్నీ అక్కడికి చేరేవి. అప్పుడు కాపరులు బావి నోటి[a] మీద నుంచి రాయిని దొర్లించి తొలగించి, మందకు[b] నీళ్లు పెట్టేవారు. ఆ తర్వాత ఆ రాయిని తిరిగి బావి నోటి మీద దాని స్థానంలో ఉంచేవారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా ‘బావి నోరు’; అంటే బావి తెరుచుకున్న భాగం.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ పదం గొర్రెలు, మేకలు వంటి చిన్న పశువుల మందను సామూహికంగా సూచించగలదు.
    reason: lexical_scope
lexical_decisions:
- source_word: וְנֶאֶסְפוּ
  choice: చేరేవి
  rationale: నిఫల్ అసంపూర్ణ క్రియ ఇక్కడ గతంలో పదేపదే జరిగే ఆచారాన్ని వర్ణిస్తుంది. తెలుగు అలవాటు భూతార్థానికి ‘చేరేవి’ సహజంగా సరిపోతుంది; కర్మణి భావాన్ని బలవంతంగా చూపదు.
- source_word: כָל הָעֲדָרִים
  choice: మందలన్నీ
  rationale: עדרים ఈ పశుపోషణ సందర్భంలో చిన్న పశువుల సమూహాలను సూచిస్తుంది. ‘మందలు’ గొర్రెలు లేదా మేకలను అనవసరంగా ప్రత్యేకించకుండా సామూహిక భావాన్ని నిలుపుతుంది.
- source_word: וְגָלֲלוּ אֶת הָאֶבֶן
  choice: కాపరులు ... రాయిని దొర్లించి
  rationale: גלל రాయిని దొర్లించి తొలగించే స్పష్టమైన చిత్రాన్ని ఇస్తుంది. హీబ్రూలో కర్త సందర్భం ద్వారా అర్థమవుతుంది; మందలే రాయిని కదిలించాయనే అసహజ భావం రాకుండా తెలుగులో ‘కాపరులు’ స్పష్టపరచబడింది.
- source_word: מֵעַל פִּי הַבְּאֵר
  choice: బావి నోటి మీద ఉన్న
  rationale: פי הבאר అక్షరార్థంగా ‘బావి నోరు’; అది బావి తెరుచుకున్న భాగాన్ని సూచించే హీబ్రూ నుడికారం. ‘మీద ఉన్న’ అనే రూపం מֵעַל సంబంధాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: וְהִשְׁקוּ
  choice: నీళ్లు పెట్టేవారు
  rationale: שקה హిఫిల్ రూపం ‘త్రాగించు/నీరు ఇవ్వు’ అని అర్థం. పశువుల సందర్భంలో ‘నీళ్లు పెట్టు’ ఆధునిక సాధారణ తెలుగులో సహజమైనది.
- source_word: אֶת הַצֹּאן
  choice: మందకు
  rationale: צאן ఒక సామూహిక ఏకవచనం; గొర్రెలు, మేకలు వంటి చిన్న పశువులను సూచించగలదు. ‘మంద’ ఆ సామూహికతను, పదంలోని విస్తృతిని నిలుపుతుంది.
- source_word: וְהֵשִׁיבוּ
  choice: తిరిగి ... ఉంచేవారు
  rationale: שוב హిఫిల్ రూపం ‘తిరిగి చేర్చడం’ అనే కారణార్థాన్ని ఇస్తుంది. రాయి విషయంలో ‘తిరిగి ఉంచు’ సహజ తెలుగు.
- source_word: לִמְקֹמָהּ
  choice: దాని స్థానంలో
  rationale: స్త్రీలింగ ఏకవచన ప్రత్యయం రాయిని సూచిస్తుంది. ‘దాని స్థానంలో’ రాయిని మునుపటి సరైన చోట తిరిగి పెట్టడాన్ని తెలియజేస్తుంది.
