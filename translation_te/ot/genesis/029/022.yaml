translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే గౌరవప్రదమైన కథనశైలిని ఉపయోగించాం. మూలంలోని వరుస చర్యలను ‘సమకూర్చి ... ఏర్పాటు చేశాడు’ అనే సహజ తెలుగు నిర్మాణంలో నిలిపాం.
