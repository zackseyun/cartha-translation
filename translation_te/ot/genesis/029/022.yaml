  text: וַ/יֶּאֱסֹ֥ף לָבָ֛ן אֶת כָּל אַנְשֵׁ֥י הַ/מָּק֖וֹם וַ/יַּ֥עַשׂ מִשְׁתֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/022.yaml
  text: So Laban gathered all the men of the place and made a feast[a][b].
translation:
  language: te
  text: అప్పుడు లాబాను ఆ స్థలంలోని పురుషులందరినీ సమకూర్చి, ఒక విందు ఏర్పాటు చేశాడు.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఆ స్థలంలోని ప్రజలందరినీ.’ హీబ్రూలో అక్షరార్థంగా ‘ఆ స్థలంలోని పురుషులందరినీ’ అని ఉంది; వివాహ వేడుకకు ఆహ్వానించబడిన స్థానిక పురుషులను ఇది సూచించే అవకాశం ఉంది.
    reason: lexical_alternative
  - marker: b
    text: ‘విందు’ అని అనువదించిన హీబ్రూ పదం సంబరంగా జరిగే భోజనాన్ని సూచిస్తుంది; ఆ సందర్భంలో మద్యపానం కూడా భాగంగా ఉండవచ్చు.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֶּאֱסֹף
  choice: సమకూర్చి
  rationale: אסף ఇక్కడ ప్రజలను ఒకచోట చేర్చడాన్ని సూచిస్తుంది. ‘సమకూర్చి’ అనేది సహజమైన ఆధునిక తెలుగు ప్రయోగం; కథనంలోని చర్యను స్పష్టంగా తెలియజేస్తుంది.
- source_word: לָבָן
  choice: లాబాను
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగులో ప్రాచుర్యంలో ఉన్న బైబిలు రూపానికి అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: אֶת כָּל אַנְשֵׁי הַמָּקוֹם
  choice: ఆ స్థలంలోని పురుషులందరినీ
  rationale: אַנְשֵׁי అనేది אִישׁ పదానికి పుంలింగ బహువచన సమాసరూపం; అక్షరార్థంగా ‘ఆ స్థలపు పురుషులు.’ వివాహ విందుకు పిలువబడిన స్థానిక పురుషులను సూచించే అవకాశం ఉన్నందున పుంలింగాన్ని నిలిపాం.
- source_word: וַיַּעַשׂ
  choice: ఏర్పాటు చేశాడు
  rationale: עשה విస్తృతార్థంలో ‘చేయు/నిర్వహించు.’ విందుతో కలిసినప్పుడు తెలుగులో ‘విందు ఏర్పాటు చేశాడు’ అనేది మూలభావాన్ని సహజంగా అందిస్తుంది.
- source_word: מִשְׁתֶּה
  choice: ఒక విందు
  rationale: מִשְׁתֶּה ఉత్సవ సందర్భంలోని భోజన విందును, తరచుగా పానీయాలతో కూడిన సంబరాన్ని సూచిస్తుంది. ‘విందు’ సంక్షిప్తంగా, సహజంగా ఉండి వివాహ సందర్భానికి సరిపోతుంది.
