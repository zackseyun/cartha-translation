translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని తులనాత్మక నిర్మాణం నిలిపి, వివాహ సందర్భం కారణంగా ‘భర్త’ అనే వ్యాఖ్యాన పదాన్ని చేర్చకుండా ‘పురుషుడు’ వాడబడింది.
