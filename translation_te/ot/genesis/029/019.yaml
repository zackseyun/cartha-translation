  text: Laban said[a], “It is better that I give her to you than that I give her to another man. Stay with me.”
translation:
  language: te
  text: 'లాబాను ఇలా అన్నాడు: “నేను ఆమెను వేరొక పురుషునికి ఇవ్వడం కంటే నీకు ఇవ్వడమే మంచిది. నాతో ఉండు.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: ఇలా అన్నాడు
  rationale: אמר అనే సాధారణ కథన క్రియ ప్రత్యక్ష మాటలను పరిచయం చేస్తోంది; ఆధునిక తెలుగు కథనశైలిలో ‘ఇలా అన్నాడు’ సహజంగా ఉంటుంది.
- source_word: טוֹב
  choice: మంచిది
  rationale: מִן‌తో ఉన్న తులనాత్మక నిర్మాణంలో ‘...కంటే ... మంచిది’ అనే తెలుగు ప్రయోగం ‘better than’ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: תִּתִּי אֹתָהּ לָךְ
  choice: నేను ఆమెను నీకు ఇవ్వడమే
  rationale: మొదటి పురుష ఏకవచన ప్రత్యయంతో ఉన్న infinitive construct భావాన్ని తెలుగు క్రియానామ నిర్మాణంతో స్పష్టంగా, సహజంగా వ్యక్తం చేసింది.
- source_word: מִתִּתִּי אֹתָהּ לְאִישׁ אַחֵר
  choice: నేను ఆమెను వేరొక పురుషునికి ఇవ్వడం కంటే
  rationale: తులనను సూచించే מִן మరియు infinitive construct‌ను ‘...ఇవ్వడం కంటే’గా అనువదించి మూలంలోని పోలికను నిలిపింది.
- source_word: אִישׁ אַחֵר
  choice: వేరొక పురుషుడు
  rationale: అక్షరార్థమైన ‘another man’ను కాపాడుతుంది; ‘వేరొక భర్త’ అని సందర్భార్థాన్ని అదనంగా చేర్చదు.
- source_word: שְׁבָה
  choice: ఉండు
  rationale: ישׁב ఆజ్ఞారూపం ఇక్కడ ఉండిపోవడం లేదా నివసించడం అనే భావం ఇస్తుంది; ‘ఉండు’ సరళమైన ఆధునిక తెలుగు.
- source_word: עִמָּדִי
  choice: నాతోనే
  rationale: ‘నాతో’ అనే ప్రత్యక్ష అర్థాన్ని ఇస్తుంది; ‘నే’ సందర్భంలోని లాబాను ఆహ్వానాన్ని సహజ తెలుగులో బలపరుస్తుంది, కొత్త సమాచారాన్ని చేర్చదు.
