  yaml_path: translation/ot/genesis/029/005.yaml
  text: He said to them[a], “Do you know Laban son of Nahor?” They said, “We know him.”
translation:
  language: te
  text: అతడు వారితో ఇలా అన్నాడు, “నాహోరు కుమారుడైన లాబానును మీకు తెలుసా?” వారు, “మాకు తెలుసు[a],” అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీలో, ‘మేము తెలుసు’ అని మాత్రమే ఉంది; ‘అతనిని’ అనే కర్మ సందర్భం నుంచి అర్థమవుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר לָהֶם
  choice: అతడు వారితో … అని అడిగాడు
  rationale: సంభాషణలో ప్రశ్నను పరిచయం చేస్తున్నందున, తెలుగు కథనశైలిలో సహజమైన ‘అని అడిగాడు’ వాడబడింది; לָהֶם ‘వారితో’గా నిలుపబడింది.
- source_word: הֲיְדַעְתֶּם
  choice: మీకు తెలుసా
  rationale: ఇక్కడ יָדַע ఒక వ్యక్తితో పరిచయం ఉందా అని అడుగుతోంది. ఆధునిక తెలుగులో ‘మీకు తెలుసా?’ సహజంగా ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: לָבָן
  choice: లాబాను
  rationale: వ్యక్తి పేరును తెలుగు ధ్వన్యనుసారం లిప్యంతరీకరించి, వాక్యంలో కర్మరూపానికి అనుగుణంగా వాడబడింది.
- source_word: בֶּן נָחוֹר
  choice: నాహోరు కుమారుడైన
  rationale: בֶּן యొక్క ప్రత్యక్ష అర్థమైన ‘కుమారుడు’ను నిలుపుతూ, తెలుగులో వ్యక్తిని గుర్తించే సహజ నిర్మాణం వాడబడింది.
- source_word: וַיֹּאמְרוּ
  choice: అందుకు వారు … అన్నారు
  rationale: వావ్ కథన క్రమాన్ని ముందుకు తీసుకెళ్తుంది; ‘అందుకు’ సమాధాన సంబంధాన్ని సహజంగా చూపిస్తుంది.
- source_word: יָדָעְנוּ
  choice: తెలుసు
  rationale: ప్రశ్నలోని יָדַע మూలపద పునరుక్తిని ‘తెలుసా/తెలుసు’గా నిలుపుతుంది. హెబ్రీలో కర్మసర్వనామం వ్యక్తంగా లేదు.
