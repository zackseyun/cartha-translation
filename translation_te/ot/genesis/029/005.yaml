  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. మూలంలోని సంక్షిప్త సమాధానాన్ని ప్రధాన పాఠ్యంలో నిలుపుతూ, అంతర్భావిత కర్మను పాదసూచికలో వివరించాం.
