  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. హీబ్రూ సభ్యోక్తిని ప్రధాన పాఠ్యంలో నిలిపి, దాని భావాన్ని పాదసూచికలో వివరించాం.
