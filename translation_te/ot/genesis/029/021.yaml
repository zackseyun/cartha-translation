  text: Then Jacob said to Laban[a], “Give me my wife, for my days are fulfilled, that I may go in to her.”
translation:
  language: te
  text: అప్పుడు యాకోబు లాబానుతో, “నా భార్యను నాకు ఇవ్వు; ఎందుకంటే నా గడువు పూర్తయింది. నేను ఆమె దగ్గరకు వెళ్లేందుకు[a]” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ఆమె దగ్గరకు వెళ్లేందుకు” అనేది వివాహాన్ని శారీరక కలయిక ద్వారా సంపూర్ణం చేయడాన్ని సూచించే హీబ్రూ సభ్యోక్తి.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָבָה
  choice: నాకు ఇవ్వు
  rationale: లాబానును ఉద్దేశించిన అభ్యర్థనాత్మక ఆజ్ఞ. వివాహ సందర్భంలో అంతర్లీన పరోక్ష కర్మను తెలుగులో సహజంగా స్పష్టం చేస్తుంది.
- source_word: אֶת אִשְׁתִּי
  choice: నా భార్యను
  rationale: אִשָּׁהకు ‘స్త్రీ/భార్య’ అనే అర్థాలున్నాయి; ఒప్పుకున్న సేవాకాలం ముగిసిన ఈ వివాహ సందర్భంలో ‘నా భార్య’ తగినది.
- source_word: כִּי מָלְאוּ יָמָי
  choice: ఎందుకంటే నా గడువు పూర్తయింది
  rationale: అక్షరార్థంగా ‘నా రోజులు నిండాయి’; ఇక్కడ ఒప్పుకున్న సేవాకాలం ముగిసిందని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: וְאָבוֹאָה אֵלֶיהָ
  choice: నేను ఆమె దగ్గరకు వెళ్లాలి
  rationale: בוא אל అనేది వివాహాన్ని శారీరకంగా సంపూర్ణం చేయడాన్ని సూచించే హీబ్రూ సభ్యోక్తి. తెలుగు వాక్యం సభ్యతను, ఉద్దేశ్య/కోహోర్టేటివ్ భావాన్ని నిలుపుతుంది; పాదసూచిక అసలు భావాన్ని స్పష్టం చేస్తుంది.
