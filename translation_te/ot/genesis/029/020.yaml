  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. హీబ్రూ నుడికారాన్ని ప్రధాన పాఠ్యంలో అర్థసహజంగా ఇచ్చి, దాని అక్షరార్థ రూపాన్ని పాదటిప్పణిలో ఉంచాం.
