  text: וַ/יַּעֲבֹ֧ד יַעֲקֹ֛ב בְּ/רָחֵ֖ל שֶׁ֣בַע שָׁנִ֑ים וַ/יִּהְי֤וּ בְ/עֵינָי/ו֙ כְּ/יָמִ֣ים אֲחָדִ֔ים בְּ/אַהֲבָת֖/וֹ אֹתָֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/020.yaml
  text: So Jacob served seven years for Rachel[a], and they seemed like only a few days to him because of his love for her.
translation:
  language: te
  text: యాకోబు రాహేలు కోసం ఏడు సంవత్సరాలు సేవ చేశాడు. ఆమెపై అతనికున్న ప్రేమవల్ల అవి అతనికి కొద్ది రోజుల్లా అనిపించాయి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత అక్షరార్థంగా: “అవి అతని దృష్టిలో కొద్ది రోజుల్లా ఉన్నాయి.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבֹד
  choice: సేవచేశాడు
  rationale: עבד అనే క్రియకు ‘సేవచేయడం’ లేదా ‘పనిచేయడం’ అనే అర్థాలు ఉన్నాయి. ఇక్కడ యాకోబు రాహేలును వివాహం చేసుకోవడానికి లాబాను కింద చేసిన ఒప్పందబద్ధమైన శ్రమను ‘సేవచేశాడు’ సూచిస్తుంది.
- source_word: בְּרָחֵל
  choice: రాహేలు కోసం
  rationale: ఈ సందర్భంలో ב అనే విభక్తి రాహేలును వివాహం చేసుకునే ఉద్దేశంతో చేసిన సేవను సూచిస్తుంది. ‘రాహేలు కోసం’ అనేది సహజంగా ఉండి, మూలంలోని సంబంధాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: שֶׁבַע שָׁנִים
  choice: ఏడు సంవత్సరాలు
  rationale: సంఖ్యను, కాలవ్యవధిని నేరుగా మరియు సహజంగా అనువదిస్తుంది.
- source_word: וַיִּהְיוּ בְעֵינָיו
  choice: అవి అతనికి … అనిపించాయి
  rationale: ‘అతని కళ్లలో అవి … ఉన్నాయి’ అనే హీబ్రూ నుడికారానికి ఇది సహజమైన ఆధునిక తెలుగు రూపం; యాకోబు వ్యక్తిగత అనుభూతిని నిలుపుతుంది.
- source_word: כְּיָמִים אֲחָדִים
  choice: కొద్ది రోజుల్లాగే
  rationale: అక్షరార్థంగా ‘కొద్ది రోజులవలె’ అనే భావాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది; ఏడు సంవత్సరాలు అతనికి చాలా తక్కువ కాలంలా తోచాయని సూచిస్తుంది.
- source_word: בְּאַהֲבָתוֹ אֹתָהּ
  choice: ఆమెపై అతనికున్న ప్రేమవల్ల
  rationale: ב ఇక్కడ కారణాన్ని లేదా పరిస్థితిని సూచిస్తుంది. ఈ రూపం అతని ప్రేమ కారణంగానే ఆ సంవత్సరాలు కొద్ది రోజుల్లా అనిపించాయని సహజంగా తెలియజేస్తుంది.
