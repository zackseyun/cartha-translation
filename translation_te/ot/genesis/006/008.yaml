source:
  edition: WLC
  text: וְ/נֹ֕חַ מָ֥צָא חֵ֖ן בְּ/עֵינֵ֥י יְהוָֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/008.yaml
  text: But Noah found favor in the eyes of Yahweh[a].
translation:
  language: te
  text: అయితే నోవహు యాహ్వే దృష్టిలో అనుగ్రహం పొందాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నోవహు యాహ్వే దృష్టిలో కృప పొందాడు.”
    reason: חֵן అనే పదాన్ని ‘అనుగ్రహం’తో పాటు ‘కృప’ అని కూడా అనువదించవచ్చు; וְను ‘మరియు’గా తీసుకోవడం సాధ్యమైనా, తెలుగులో ఈ ప్రత్యామ్నాయ వాక్యంలో దాన్ని విడిచిపెట్టడం సహజంగా ఉంటుంది.
lexical_decisions:
- source_word: וְ/נֹחַ
  choice: అయితే నోవహు
  rationale: וְ సాధారణంగా ‘మరియు’ అని అర్థమైనా, ముందున్న విస్తృత అవినీతి మరియు తీర్పు ప్రకటనకు నోవహును భిన్నంగా చూపే సందర్భంలో ‘అయితే’ అనే వ్యతిరేక భావం సహజంగా సరిపోతుంది. נֹחַ అనే పేరును తెలుగులో ప్రాచుర్యంలో ఉన్న ‘నోవహు’గా లిప్యంతరీకరించాం.
- source_word: מָצָא
  choice: పొందాడు
  rationale: מָצָא యొక్క ప్రాథమిక అర్థం ‘కనుగొను.’ అయితే חֵן מָצָא అనే హీబ్రూ నుడికారాన్ని ఆధునిక తెలుగులో సహజంగా ‘అనుగ్రహం పొందాడు’ అని చెప్పడం భావాన్ని కచ్చితంగా అందిస్తుంది; ‘కనుగొన్నాడు’ అనడం తెలుగులో కృత్రిమంగా ఉంటుంది.
- source_word: חֵן
  choice: అనుగ్రహం
  rationale: חֵןకు ‘అనుగ్రహం,’ ‘కృప,’ ‘ఆదరణ’ వంటి అర్థాలు ఉన్నాయి. ఇక్కడ దేవుని అనుకూల దృష్టిని తెలియజేయడానికి ‘అనుగ్రహం’ సహజంగా ఉండి, తరువాతి సిద్ధాంతపరమైన అర్థాన్ని అనవసరంగా రుద్దదు.
- source_word: בְּ/עֵינֵי
  choice: దృష్టిలో
  rationale: అక్షరార్థంగా ‘కళ్లలో’ అయిన ఈ హీబ్రూ నుడికారం ఒకరి చూపులో లేదా అంచనాలో అనే అర్థం ఇస్తుంది. ‘దృష్టిలో’ తెలుగు వాడుకలో సహజంగా ఉండి మూలంలోని దృశ్యరూపకాన్ని తగినంతగా నిలుపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవ నామమైన יהוהను బిరుదుతో మార్చకుండా, దాని సాధారణ పండిత లిప్యంతరీకరణ Yahwehకు అనుగుణంగా తెలుగులో ‘యాహ్వే’గా ఇచ్చాం.
theological_decisions:
- issue: నోవహుపట్ల దేవుని వైఖరిని తెలిపే חֵן పదం
  choice: అనుగ్రహం
  alternative: కృప
  rationale: ‘అనుగ్రహం’ హీబ్రూ నుడికారంలోని దేవుని అనుకూల వైఖరిని తెలియజేస్తుంది; అదే సమయంలో ఈ పదాన్ని తరువాతి కాలపు నిర్దిష్ట సిద్ధాంత సూత్రానికి మాత్రమే పరిమితం చేయదు. ‘కృప’ కూడా సాధ్యమైన అనువాదం కావడంతో పాదసూచికలో ఉంచాం.
- issue: దైవ నామం יהוה అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా
  rationale: మూలపాఠంలో ఉన్న వ్యక్తిగత దైవ నామాన్ని ‘ప్రభువు’ వంటి బిరుదుతో భర్తీ చేయకుండా ఉంచాం. ‘యాహ్వే’ అనేది Yahweh ఉచ్చారణకు నేరమైన తెలుగు లిప్యంతరీకరణ.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే గౌరవప్రదమైన శైలి. హీబ్రూ నుడికారాన్ని యాంత్రికంగా అనుసరించకుండా ‘దృష్టిలో అనుగ్రహం పొందాడు’ అనే సహజ తెలుగు రూపం వాడబడింది; మూలంలోని సందర్భ విరుద్ధతను ‘అయితే’ నిలుపుతుంది.
