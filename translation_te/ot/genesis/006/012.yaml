source:
  edition: WLC
  text: וַ/יַּ֧רְא אֱלֹהִ֛ים אֶת הָ/אָ֖רֶץ וְ/הִנֵּ֣ה נִשְׁחָ֑תָה כִּֽי הִשְׁחִ֧ית כָּל בָּשָׂ֛ר אֶת דַּרְכּ֖/וֹ עַל הָ/אָֽרֶץ־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/012.yaml
  text: And God saw the earth[a], and behold, it was corrupted[b], because all flesh had corrupted its way on the earth.
translation:
  language: te
  text: దేవుడు భూమిని చూశాడు. ఇదిగో, అది చెడిపోయింది[a], ఎందుకంటే సకల శరీరులు భూమిమీద తమ మార్గాన్ని చెడగొట్టారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘చెడిపోయింది’ అని అనువదించిన హీబ్రూ పదం నైతిక భ్రష్టతను మాత్రమే కాదు, పాడైపోవడం లేదా నాశనస్థితికి చేరడాన్ని కూడా సూచించగలదు. ఇదే పదమూలం తరువాత ‘చెడగొట్టారు’ అనే మాటలోనూ ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: చూశాడు
  rationale: ראה అనే సాధారణ దర్శనక్రియను కథనశైలిలో సహజంగా తెలియజేస్తుంది; అదనపు మూల్యాంకన భావాన్ని చేర్చదు.
- source_word: אֱלֹהִים
  choice: దేవుడు
  rationale: ఈ సందర్భంలో ఏకైక దేవుణ్ణి సూచిస్తున్నందున ఆధునిక ప్రామాణిక తెలుగులో సహజమైన రూపం.
- source_word: הָאָרֶץ
  choice: భూమి
  rationale: జలప్రళయ కథనంలోని విస్తృత సందర్భానికి సరిపోతుంది; ‘దేశం’ లేదా ‘నేల’ అని కుదించదు.
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: చూసిన స్థితిపై అకస్మాత్తుగా, సజీవంగా దృష్టి నిలిపే హీబ్రూ ఉద్ఘాటనను నిలుపుతుంది.
- source_word: נִשְׁחָתָה
  choice: చెడిపోయింది
  rationale: שׁחת ధాతువులోని నైతిక భ్రష్టతతో పాటు పాడైపోవడం లేదా నాశనస్థితికి చేరడం అనే విస్తృత భావాన్ని తెలుగులో సాధ్యమైనంతవరకు తెరిచి ఉంచుతుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందు చెప్పిన భూమి స్థితికి కారణాన్ని స్పష్టంగా పరిచయం చేస్తుంది.
- source_word: הִשְׁחִית
  choice: చెడగొట్టుకున్నారు
  rationale: అదే שׁחת ధాతువుతో ఉన్న సంబంధాన్ని ‘చెడు’ అనే పదమూలం ద్వారా చూపుతూ, హిఫీల్ రూపంలోని కారక భావాన్ని వ్యక్తం చేస్తుంది. ఆ క్రియ ఫలితం తిరిగి వారి మార్గంపైనే పడిందనే తెలుగు సహజప్రయోగాన్ని కూడా అందిస్తుంది.
- source_word: כָּל בָּשָׂר
  choice: శరీరధారులందరూ
  rationale: ‘సర్వశరీరం’ అనే అసహజ పదశః రూపాన్ని తప్పిస్తూ, ‘సమస్త శరీరం/మాంసం’ అనే హీబ్రూ విస్తృత నుడికారాన్ని ‘మనుషులందరూ’ లేదా ‘ప్రాణులన్నీ’ అని ముందే నిర్ధారించకుండా నిలుపుతుంది.
- source_word: דַּרְכּוֹ
  choice: తమ మార్గాన్ని
  rationale: ‘మార్గం’ అనే రూపకాన్ని నిలుపుతుంది; సమూహవాచక ఏకవచన ప్రత్యయాన్ని తెలుగులో సహజమైన పంపిణీబద్ధ బహువచనంగా అందిస్తుంది.
- source_word: עַל הָאָרֶץ
  choice: భూమిమీద
  rationale: స్థలసంబంధాన్ని సహజమైన ఆధునిక తెలుగు రూపంలో తెలియజేస్తుంది.
theological_decisions:
- issue: שׁחת అనే ధాతువు రెండు ఉపవాక్యాల్లో కలిగిన భావవ్యాప్తి
  choice: ‘చెడిపోయింది … చెడగొట్టుకున్నారు’ అని ఒకే తెలుగు పదమూలంతో అనువదించడం
  alternative: ‘భ్రష్టమైంది … భ్రష్టపరిచారు’ లేదా ‘పాడైంది … పాడుచేశారు’
  rationale: హీబ్రూ పదం నైతిక చెడును, దాని వల్ల కలిగిన పాడుదల లేదా వినాశాన్ని రెండింటినీ సూచించగలదు. ‘చెడు’ పదమూలం ఈ భావాల మధ్యనున్న ఉద్రిక్తతను పూర్తిగా ఒకవైపు కుదించకుండా, రెండు ఉపవాక్యాల మధ్య ధాతుసంబంధాన్ని కనిపించేలా చేస్తుంది.
- issue: כָּל בָּשָׂר పరిధి
  choice: ‘శరీరధారులందరూ’ అనే విస్తృత రూపాన్ని ఉంచడం
  alternative: ‘మనుషులందరూ’ లేదా ‘ప్రాణులన్నీ’
  rationale: ఈ నుడికారం సందర్భంలో మానవజాతిపై ప్రత్యేక దృష్టి పెట్టవచ్చుగానీ, దాని పదార్థం మరింత విస్తృతంగా ఉండగలదు. ప్రధాన పాఠంలో దాని పరిధిని ముందే నిర్ణయించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కానీ సులభంగా అర్థమయ్యే కథనశైలి. ‘ఇదిగో’ ద్వారా హీబ్రూ వాక్యంలోని సజీవ ఉద్ఘాటనను, ‘మార్గం’ ద్వారా దాని నైతిక జీవనరూపకాన్ని నిలిపాం. ‘శరీరధారులందరూ’ కొంత గ్రంథశైలిని కలిగి ఉన్నప్పటికీ, మూలంలోని విస్తృతమైన כָּל בָּשָׂר నుడికారాన్ని వ్యాఖ్యానాత్మకంగా కుదించకుండా తెలుగులో అర్థమయ్యే సమతుల్య రూపం.
