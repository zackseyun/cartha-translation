revisions:
- from: దేవుడు భూమిని చూశాడు. ఇదిగో, అది చెడిపోయింది[a]; ఎందుకంటే శరీరధారులందరూ భూమిమీద తమ మార్గాన్ని చెడగొట్టుకున్నారు.
  to: దేవుడు భూమిని చూశాడు. ఇదిగో, అది చెడిపోయింది[a], ఎందుకంటే సకల శరీరులు భూమిమీద తమ మార్గాన్ని చెడగొట్టారు.
  rationale: The revision removes the unnecessarily reflexive verb form and replaces a technical expression with a conventional, comprehensible biblical Telugu idiom. It preserves the Hebrew’s scope and ambiguity for כָּל־בָּשָׂר, the repeated שׁחת wordplay, and the modern yet dignified narrative register.
