base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/020.yaml
  text: From the birds according to their kinds[a], and from the livestock according to their kinds, from every creeping thing of the ground according to its kind, two of each will come to you to keep them alive.
translation:
  language: te
  text: పక్షులలో నుండి వాటివాటి జాతుల ప్రకారం, పశువులలో నుండి వాటివాటి జాతుల ప్రకారం, నేలమీద పాకే ప్రతి ప్రాణిలో నుండి దాని జాతి ప్రకారం—ప్రతి వర్గం నుండి రెండేసి, వాటిని సజీవంగా ఉంచడానికి నీ దగ్గరకు వస్తాయి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָעוֹף
  choice: పక్షులు
  rationale: עוֹף ఎగిరే ప్రాణులను సూచించగలిగినా, ఈ జంతు వర్గాల సందర్భంలో ఆధునిక తెలుగులో ‘పక్షులు’ సహజమైనది, స్పష్టమైనది.
- source_word: לְמִינֵהוּ / לְמִינָהּ
  choice: వాటివాటి జాతుల ప్రకారం / దాని జాతి ప్రకారం
  rationale: מִין వర్గం లేదా రకాన్ని సూచిస్తుంది. ‘జాతి’ ఇక్కడ ఆధునిక జీవశాస్త్రంలోని కచ్చితమైన species స్థాయిని నిర్బంధంగా సూచించకుండా వర్గీకరణ భావాన్ని తెలియజేస్తుంది.
- source_word: הַבְּהֵמָה
  choice: పశువులు
  rationale: בְּהֵמָה ఇక్కడ పక్షులు, పాకే ప్రాణుల నుంచి వేరుగా చెప్పబడిన భూజంతువుల, ముఖ్యంగా గృహపశువుల వర్గాన్ని సూచిస్తుంది; ‘పశువులు’ సహజమైన తెలుగు పదం.
- source_word: רֶמֶשׂ הָאֲדָמָה
  choice: నేలపై పాకే ప్రతి ప్రాణి
  rationale: רֶמֶשׂ చిన్నగా కదిలే లేదా పాకే ప్రాణులను, הָאֲדָמָה నేలను సూచిస్తాయి. ‘నేలపై పాకే’ తెలుగు వాక్యంలో సహజంగా ఉండి మూలంలోని వర్గాన్ని ప్రతిబింబిస్తుంది.
- source_word: שְׁנַיִם מִכֹּל
  choice: ప్రతి దానిలో రెండేసి
  rationale: ఈ పదబంధంలోని పంపిణీ భావాన్ని ‘ప్రతి దానిలో రెండేసి’ స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: יָבֹאוּ אֵלֶיךָ
  choice: నీ దగ్గరకు వస్తాయి
  rationale: בוא + אֶל నోవహు వైపు రావడాన్ని మాత్రమే నేరుగా చెబుతుంది; ఓడలోకి ప్రవేశించడం సందర్భంలో సూచితమైనా ఈ ఉపవాక్యంలో స్పష్టంగా లేదు.
- source_word: לְהַחֲיוֹת
  choice: వాటిని సజీవంగా ఉంచడానికి
  rationale: חיה హిఫీల్ రూపం ప్రాణంతో కాపాడడం లేదా సజీవంగా ఉంచడం అనే ఉద్దేశ్యాన్ని తెలియజేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. జంతు వర్గాల పునరుక్తిని మూలానికి అనుగుణంగా నిలిపి, తెలుగులో సహజంగా వినిపించేందుకు ‘వాటివాటి’ మరియు ‘రెండేసి’ వాడబడ్డాయి.
