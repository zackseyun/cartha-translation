revisions:
- from: ఇదిగో, నేనే భూమిమీదికి జలప్రళయాన్ని రప్పిస్తున్నాను. ఆకాశం కింద జీవశ్వాస[a] ఉన్న సమస్త శరీరాన్ని నాశనం చేయడానికి దాన్ని రప్పిస్తున్నాను. భూమిమీద ఉన్నదంతా ప్రాణం విడుస్తుంది.
  to: ఇదిగో, నేనే భూమిమీదికి జలప్రళయాన్ని తీసుకువస్తున్నాను—ఆకాశం కింద జీవశ్వాస[a] ఉన్న సమస్త శరీరాన్ని నాశనం చేయడానికి. భూమిమీద ఉన్నదంతా ప్రాణం విడుస్తుంది.
  rationale: 'The revision preserves the source''s solemn emphasis and all major lexical choices, while restoring the Hebrew syntactic relation: God brings the flood for the purpose of destroying all flesh with the breath of life. The footnote is corrected for transliteration and states the lexical alternative without imposing a theological interpretation.'
