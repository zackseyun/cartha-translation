id: GEN.6.17
reference: Genesis 6:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/אֲנִ֗י הִנְ/נִי֩ מֵבִ֨יא אֶת הַ/מַּבּ֥וּל מַ֨יִם֙ עַל הָ/אָ֔רֶץ לְ/שַׁחֵ֣ת כָּל בָּשָׂ֗ר אֲשֶׁר בּ/וֹ֙ ר֣וּחַ חַיִּ֔ים מִ/תַּ֖חַת הַ/שָּׁמָ֑יִם כֹּ֥ל אֲשֶׁר בָּ/אָ֖רֶץ יִגְוָֽע־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/017.yaml
  text: And I—behold[a], I am bringing the flood of waters upon the earth to destroy all flesh in which is the breath of life from under heaven. Everything that is on the earth will perish.
translation:
  language: te
  text: ఇదిగో, నేనే భూమిమీదికి జలప్రళయాన్ని తీసుకువస్తున్నాను—ఆకాశం కింద జీవశ్వాస[a] ఉన్న సమస్త శరీరాన్ని నాశనం చేయడానికి. భూమిమీద ఉన్నదంతా ప్రాణం విడుస్తుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “జీవపు ఆత్మ.” హెబ్రీ పదం רוּחַ (రూఅఖ్)కు “శ్వాస,” “గాలి,” లేదా “ఆత్మ” అనే అర్థాలు రావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי הִנְנִי
  choice: ఇదిగో, నేనే
  rationale: స్వతంత్ర సర్వనామంలోని కర్తృత్వ ఉద్ఘాటనను ‘నేనే’ చూపుతుంది; הִנְנִי యొక్క గంభీరమైన దృష్టి-ఆహ్వానాన్ని ‘ఇదిగో’ సహజంగా నిలుపుతుంది.
- source_word: מֵבִיא
  choice: రప్పిస్తున్నాను
  rationale: హిఫిల్ వర్తమాన కృదంతం సమీపిస్తున్న, వక్తే కలుగజేస్తున్న చర్యను సూచిస్తుంది. తెలుగు సందర్భంలో ‘రప్పిస్తున్నాను’ ఆ causative భావాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: הַמַּבּוּל מַיִם
  choice: జలప్రళయాన్ని
  rationale: מַבּוּל అనే ప్రత్యేక ప్రళయపదాన్నీ, מַיִם అనే నీటి అంశాన్నీ సంక్షిప్తంగా, సహజంగా కలిపే ఆధునిక తెలుగు రూపం.
- source_word: עַל הָאָרֶץ
  choice: భూమిమీదికి
  rationale: ప్రళయజలాలు భూమిపైకి తీసుకురాబడుతున్న దిశను తెలుగులో సహజంగా తెలియజేస్తుంది; విస్తృత భౌమ పరిధిని నిలుపుతుంది.
- source_word: לְשַׁחֵת כָּל בָּשָׂר
  choice: సమస్త శరీరాన్ని నాశనం చేయడానికి
  rationale: ఉద్దేశార్థక infinitive ను స్పష్టంగా చూపుతూ, కీలకమైన ‘సమస్త శరీరం’ అనే హెబ్రీయ సామూహిక అభివ్యక్తిని వ్యాఖ్యానాత్మకంగా ‘ప్రాణులన్నీ’ అని మార్చకుండా నిలుపుతుంది.
- source_word: אֲשֶׁר בּוֹ רוּחַ חַיִּים
  choice: జీవశ్వాస ఉన్న
  rationale: רוּחַ యొక్క సందర్భోచిత అర్థమైన శ్వాసను ఎంచుకుని, జీవాన్ని నిలిపే శ్వాస అనే భావాన్ని సహజ తెలుగులో అందిస్తుంది; ‘ఆత్మ’ అనే సాధ్యార్థాన్ని పాదసూచికలో ఉంచుతుంది.
- source_word: מִתַּחַת הַשָּׁמָיִם
  choice: ఆకాశం కింద
  rationale: ఆకాశం క్రిందనున్న సమస్త పరిధిని సూచించే హెబ్రీయ నుడికారానికి స్పష్టమైన సహజ తెలుగు సమానం.
- source_word: כֹּל אֲשֶׁר בָּאָרֶץ יִגְוָע
  choice: భూమిమీద ఉన్నదంతా ప్రాణం విడుస్తుంది
  rationale: גוע సాధారణ ‘చనిపోవడం’ కంటే ‘ప్రాణం విడవడం/చివరి శ్వాస విడవడం’ అనే భావాన్ని కలిగి ఉంది; ఈ ఎంపిక మూలంలోని గంభీరతను, శ్వాసతో ఉన్న అంతర్గత అనుసంధానాన్ని నిలుపుతుంది.
theological_decisions:
- issue: רוּחַ חַיִּים లో רוּחַ అర్థం
  choice: జీవశ్వాస
  alternative: జీవాత్మ
  rationale: ప్రళయ సందర్భంలో ఇది జీవుల ప్రాణవాయువును లేదా జీవింపజేసే శ్వాసను ప్రధానంగా సూచిస్తుంది. ‘జీవాత్మ’ అనువాదం సాధ్యమే అయినా, అది మూలం నిర్దిష్టంగా చెప్పని మానవ స్వభావశాస్త్ర భావాన్ని ముందుకు తేవచ్చు; అందువల్ల ప్రత్యామ్నాయాన్ని పాదసూచికలో సంరక్షించాం.
- issue: כָּל בָּשָׂר యొక్క పరిధి
  choice: సమస్త శరీరం
  alternative: సమస్త ప్రాణులు
  rationale: మూలంలోని విస్తృతమైన, సామూహిక ‘సర్వ శరీరం’ నుడికారాన్ని అలాగే ఉంచడం వల్ల దాని సృష్టి-వ్యాప్త పరిధి మరియు ఉద్దేశపూర్వక అస్పష్టత నిలుస్తాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన ప్రకటన శైలిని అనుసరించాం. ‘ఇదిగో, నేనే’ అనే రూపం మూలంలోని ద్విగుణ ఉద్ఘాటనను నిలుపుతుంది. పొడవైన హెబ్రీ వాక్యాన్ని తెలుగు పఠన సౌలభ్యం కోసం రెండు వాక్యాలుగా చేసి, ఉద్దేశ సంబంధాన్ని ‘దాన్ని రప్పిస్తున్నాను’ ద్వారా స్పష్టంగా కొనసాగించాం.
