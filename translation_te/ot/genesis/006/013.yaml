id: GEN.6.13
reference: Genesis 6:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אֱלֹהִ֜ים לְ/נֹ֗חַ קֵ֤ץ כָּל בָּשָׂר֙ בָּ֣א לְ/פָנַ֔/י כִּֽי מָלְאָ֥ה הָ/אָ֛רֶץ חָמָ֖ס מִ/פְּנֵי/הֶ֑ם וְ/הִנְ/נִ֥י מַשְׁחִיתָ֖/ם אֶת הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/013.yaml
  text: Then God said to Noah[a], “The end of all flesh has come before me, for the earth is filled with violence because of them. And behold[d][c][b], I am about to destroy them with the earth.”
translation:
  language: te
  text: 'అప్పుడు దేవుడు నోవహుతో ఇలా అన్నాడు: “సకల జీవుల అంతం నా సన్నిధికి వచ్చింది[a]. ఎందుకంటే వారి కారణంగా భూమి హింసతో నిండిపోయింది[b]. ఇదిగో, నేను వారిని భూమితోపాటు నాశనం చేయబోతున్నాను[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘సకల జీవుల అంతం’కు బదులుగా, “సకల జీవులకు ఒక అంతం నా సన్నిధికి వచ్చింది” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘భూమి’ అని అనువదించిన హీబ్రూ పదానికి ‘దేశం’ లేదా ‘నేల’ అనే అర్థం కూడా రావచ్చు.
    reason: lexical_alternative
  - marker: c
    text: హీబ్రూ అక్షరార్థంగా, “నేను వారిని భూమితో నాశనం చేస్తున్నాను.” ఈ నిర్మాణాన్ని “వారిని భూమితోపాటు” అని లేదా “వారిని, భూమిని” అని అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: קֵץ כָּל־בָּשָׂר
  choice: సకల జీవుల అంతం
  rationale: కֵץ అంటే అంతం లేదా ముగింపు. כָּל־בָּשָׂר అక్షరార్థంగా ‘సకల శరీరం/మాంసం’; జలప్రళయ సందర్భంలో ఇది మనుషులకు మాత్రమే పరిమితం కాకుండా జీవరాశిని విస్తృతంగా సూచిస్తుంది. ‘సకల జీవులు’ ఆధునిక తెలుగులో సహజంగా ఉండి ఆ విస్తృతిని కాపాడుతుంది.
- source_word: בָּא לְפָנַי
  choice: నా సన్నిధికి వచ్చింది
  rationale: దేవుని ఎదుట తీర్పు కోసం విషయం వచ్చిందనే న్యాయపరమైన ఛాయను, హీబ్రూ దృశ్యరూపాన్ని ఈ పదబంధం నిలుపుతుంది.
- source_word: מָלְאָה הָאָרֶץ חָמָס
  choice: భూమి హింసతో నిండిపోయింది
  rationale: חָמָס ఇక్కడ హింస, దౌర్జన్యం, అన్యాయం అనే భావాలను కలిగి ఉంది; సందర్భంలో ‘హింస’ నేరుగా సరిపోతుంది. הָאָרֶץకు జలప్రళయ వృత్తాంతంలోని విశ్వవ్యాప్త పరిధిని దృష్టిలో ఉంచి ‘భూమి’ ఎంచుకున్నాం.
- source_word: מִפְּנֵיהֶם
  choice: వారి కారణంగా
  rationale: మִפְּנֵי ఇక్కడ కారణార్థకంగా వాడబడింది. ‘వారి కారణంగా’ అనేది సహజమైన తెలుగు రూపం.
- source_word: וְהִנְנִי
  choice: ఇదిగో, నేను
  rationale: హִנְנִי దేవుని చర్యపై దృష్టి పెట్టే ఉద్ఘాటన. ‘ఇదిగో’ ఆ బలాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: מַשְׁחִיתָם
  choice: వారిని ... నాశనం చేయబోతున్నాను
  rationale: שׁחת హిఫీల్ రూపం తీర్పు సందర్భంలో ‘నాశనం చేయడం’ అని అర్థం. హీబ్రూ కృదంతంలో ఉన్న సమీప భవిష్యత్ భావాన్ని తెలుగులో ‘చేయబోతున్నాను’ సహజంగా వ్యక్తపరుస్తుంది.
- source_word: אֶת־הָאָרֶץ
  choice: భూమితోపాటు
  rationale: ఇప్పటికే ‘వారిని’ అనే కర్మ ఉన్న తరువాత אֶת־הָאָרֶץ రావడం వాక్యనిర్మాణపరంగా క్లిష్టం. ‘భూమితోపాటు’ అనేది భూమిని సాధనంగా చూపకుండా, వారితో కూడ భూమి తీర్పుకు లోనవుతుందనే ప్రధాన భావాన్ని స్పష్టంగా ఇస్తుంది.
theological_decisions:
- issue: ‘సకల శరీరం’ (כָּל־בָּשָׂר) యొక్క పరిధి
  choice: మనుషులకు మాత్రమే పరిమితం కాకుండా జీవరాశిని విస్తృతంగా సూచించే ‘సకల జీవులు’
  alternative: మనుషులందరూ; లేదా అక్షరార్థంగా ‘సకల శరీరం’
  rationale: జలప్రళయ వృత్తాంతంలో ఈ పదబంధం సాధారణంగా మనుషులకంటే విస్తృతమైన జీవరాశిని సూచిస్తుంది. అనువాదం ఆ పరిధిని సంకుచితం చేయదు.
- issue: הָאָרֶץ యొక్క అర్థం
  choice: భూమి
  alternative: దేశం/నేల
  rationale: జలప్రళయ వృత్తాంతంలోని విస్తృత సందర్భానికి ‘భూమి’ సరిపోతుంది; అయినా హీబ్రూ పదానికి ‘దేశం’ లేదా ‘నేల’ అనే అర్థాలు కూడా సాధ్యమని పాదసూచికలో తెలియజేశాం.
- issue: אֶת־הָאָרֶץ యొక్క వాక్యనిర్మాణ సంబంధం
  choice: వారిని భూమితోపాటు నాశనం చేయడం
  alternative: వారిని, భూమిని నాశనం చేయడం; లేదా అక్షరరూపానికి దగ్గరగా ‘వారిని భూమితో నాశనం చేయడం’
  rationale: హీబ్రూ నిర్మాణంలోని ఉద్రిక్తతను పూర్తిగా తొలగించకుండా, ఆధునిక తెలుగులో భూమి నాశన సాధనమనే అపార్థం రాకుండా ‘భూమితోపాటు’ ఎంచుకున్నాం; ఇతర విశ్లేషణలను పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కథనశైలిని వాడాం. ‘నా సన్నిధికి వచ్చింది’, ‘ఇదిగో’ వంటి రూపాలు మూలంలోని న్యాయపరమైన ఛాయను, ఉద్ఘాటనను నిలుపుతాయి; క్లిష్టమైన హీబ్రూ వాక్యనిర్మాణాన్ని పాదసూచికలో వెల్లడించాం.
