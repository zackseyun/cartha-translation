  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/הֲקִמֹתִ֥י אֶת בְּרִיתִ֖/י אִתָּ֑/ךְ וּ/בָאתָ֙ אֶל הַ/תֵּבָ֔ה אַתָּ֕ה וּ/בָנֶ֛י/ךָ וְ/אִשְׁתְּ/ךָ֥ וּ/נְשֵֽׁי בָנֶ֖י/ךָ אִתָּֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/018.yaml
  text: But I will establish my covenant with you[a], and you shall enter the ark—you, your sons, your wife, and your sons’ wives with you.
translation:
  language: te
  text: కానీ నేను నీతో నా నిబంధనను స్థాపిస్తాను[a]. నీవు ఓడలోకి ప్రవేశిస్తావు—నీవు, నీ కుమారులు, నీ భార్య, నీతోపాటు నీ కుమారుల భార్యలు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నేను నీతో నా నిబంధనను ధృవపరుస్తాను.’ నిబంధన సందర్భాల్లో హీబ్రూ క్రియ ఈ రెండు భావాలనూ ఇవ్వగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲקִמֹתִי
  choice: కానీ నేను … స్థాపిస్తాను
  rationale: హిఫిల్ రూపంలోని קום, בְּרִית తో కలిసి వచ్చినప్పుడు నిబంధనను స్థాపించడం లేదా ధృవపరచడం అనే భావాలను ఇవ్వగలదు. ముందున్న నాశన ప్రకటనకు వ్యతిరేకంగా ఇక్కడ రక్షణ వాగ్దానం రావడం వల్ల וַ కు సందర్భానుసారంగా ‘కానీ’ వాడబడింది.
- source_word: בְּרִיתִי
  choice: నా నిబంధనను
  rationale: בְּרִית కు స్థిరమైన, ధార్మిక ప్రాముఖ్యతను నిలుపుకునే సహజ తెలుగు సమానార్థకం ‘నిబంధన’.
- source_word: אִתָּךְ
  choice: నీతో / నీతోపాటు
  rationale: మొదటి సందర్భంలో నిబంధన సంబంధాన్ని ‘నీతో’ సూచిస్తుంది; చివరి సందర్భంలో సహచర్యాన్ని సహజంగా తెలియజేయడానికి ‘నీతోపాటు’ వాడబడింది.
- source_word: וּבָאתָ
  choice: ప్రవేశించాలి
  rationale: בוא అంటే రావడం, వెళ్లడం, లోనికి ప్రవేశించడం. ఓడ గమ్యస్థానంగా ఉన్నందున ‘ప్రవేశించాలి’ స్పష్టంగా, సహజంగా ఉంది; సందర్భంలోని దైవ ఆదేశ భావాన్ని కూడా తెలియజేస్తుంది.
- source_word: הַתֵּבָה
  choice: ఓడలోకి
  rationale: నోవహు వృత్తాంతంలో תֵּבָה ను ఆధునిక సాధారణ తెలుగులో సహజంగా ‘ఓడ’ అని అనువదిస్తారు.
- source_word: אַתָּה
  choice: నీవు
  rationale: క్రియ తరువాత విడిగా ఉన్న సర్వనామం నోవహును కుటుంబ సభ్యుల జాబితాలో ప్రత్యేకంగా ఉద్ఘాటిస్తుంది; తెలుగులో పునరుక్త ‘నీవు’ ద్వారా అది నిలుపబడింది.
- source_word: וּבָנֶיךָ
  choice: నీ కుమారులు
  rationale: בָּנִים ఇక్కడ ప్రత్యేకంగా కుమారులను సూచిస్తుంది; లింగతటస్థమైన ‘పిల్లలు’ అని విస్తరించలేదు.
- source_word: וְאִשְׁתְּךָ
  choice: నీ భార్య
  rationale: కుటుంబ సందర్భంలోని אִשָּׁה కు సూటి, సహజమైన అనువాదం.
- source_word: וּנְשֵׁי בָנֶיךָ
  choice: నీ కుమారుల భార్యలు
  rationale: హీబ్రూ సమాస పదబంధాన్ని సూటిగా నిలుపుతుంది; ‘కోడళ్లు’ కంటే మూలంలోని సంబంధ నిర్మాణానికి దగ్గరగా ఉంది.
theological_decisions:
- issue: నిబంధన పదబంధం స్వభావం
  choice: ‘నేను నీతో నా నిబంధనను స్థాపిస్తాను’ అనే భవిష్యదభిముఖ వాగ్దానం
  alternative: ‘నేను నీతో నా నిబంధనను ధృవపరుస్తాను’
  rationale: הֲקִים בְּרִית అనే హీబ్రూ పదబంధం నిబంధనను స్థాపించడం లేదా ఇప్పటికే ఉన్న నిబంధనను ధృవపరచడం అనే రెండు భావాలను అనుమతిస్తుంది. ఈ వచనం మాత్రమే విస్తృతమైన ధార్మిక ప్రశ్నను తేల్చదు; అందువల్ల ప్రధాన పాఠంలో ప్రామాణిక పదప్రయోగాన్ని ఉంచి, ప్రత్యామ్నాయాన్ని పాదసూచికలో భద్రపరచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రద శైలి. జాబితా నిర్మాణం మరియు ‘నీవు’ అనే ఉద్ఘాటన మూలానికి అనుగుణంగా నిలుపబడ్డాయి.
