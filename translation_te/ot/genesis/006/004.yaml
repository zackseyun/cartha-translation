id: GEN.6.4
reference: Genesis 6:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: הַ/נְּפִלִ֞ים הָי֣וּ בָ/אָרֶץ֮ בַּ/יָּמִ֣ים הָ/הֵם֒ וְ/גַ֣ם אַֽחֲרֵי כֵ֗ן אֲשֶׁ֨ר יָבֹ֜אוּ בְּנֵ֤י הָֽ/אֱלֹהִים֙ אֶל בְּנ֣וֹת הָֽ/אָדָ֔ם וְ/יָלְד֖וּ לָ/הֶ֑ם הֵ֧מָּה הַ/גִּבֹּרִ֛ים אֲשֶׁ֥ר מֵ/עוֹלָ֖ם אַנְשֵׁ֥י הַ/שֵּֽׁם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/004.yaml
  text: The Nephilim were on the earth in those days—and also afterward—when the sons of God came in to the daughters of man[a], and they bore children to them. Those were the mighty men who were of old[c][b], men of renown.
translation:
  language: te
  text: ఆ రోజుల్లో నెఫీలులు[a] భూమిమీద ఉన్నారు; ఆ తర్వాత కూడా ఉన్నారు. దేవుని కుమారులు[b] మానవుల కుమార్తెల[c]తో కలిసినప్పుడు, ఆ కుమార్తెలు వారికి పిల్లలను కన్నారు. వీరే ప్రాచీనకాలపు పరాక్రమవంతులు, పేరుపొందిన పురుషులు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: సాంప్రదాయంగా ‘దైత్యులు’ అని కూడా అనువదిస్తారు. ‘నెఫీలులు’ అనే హీబ్రూ పదం అరుదైనది; దాని ఖచ్చితమైన అర్థం అనిశ్చితం.
    reason: alternative_reading
  - marker: b
    text: ‘దేవుని కుమారులు’ అనే పదబంధాన్ని ‘దివ్యజీవులు’ అని కూడా అర్థం చేసుకోవచ్చు; మరికొన్ని వ్యాఖ్యానాల్లో అది మానవ పాలకులను లేదా షేతు భక్తివంశానికి చెందినవారిని సూచిస్తుంది.
    reason: alternative_reading
  - marker: c
    text: అక్షరార్థంగా ‘మనుష్యుని కుమార్తెలు’; ఇక్కడ ‘మనుష్యుడు’ అనే పదం సమష్టిగా మానవజాతిని, అంటే మానవ స్త్రీలను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנְּפִלִים
  choice: నెఫీలులు
  rationale: ఈ అరుదైన హీబ్రూ పదానికి ఖచ్చితమైన అర్థం వివాదాస్పదం. ‘దైత్యులు’ లేదా ‘పడిపోయినవారు’ అని అర్థాన్ని ముందే నిర్ణయించకుండా లిప్యంతరీకరించబడింది.
- source_word: בָאָרֶץ
  choice: భూమిమీద
  rationale: ఆదికాండంలోని ఆదిచరిత్ర సందర్భంలో ‘దేశంలో’ కంటే విస్తృతమైన ‘భూమిమీద’ సహజంగా సరిపోతుంది.
- source_word: וְגַם אַחֲרֵי כֵן
  choice: ఆ తర్వాత కూడా
  rationale: హీబ్రూలోని చేర్పు భావాన్నీ కాలసూచననూ సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: אֲשֶׁר יָבֹאוּ ... אֶל
  choice: దగ్గరకు వెళ్లినప్పుడు
  rationale: సందర్భంలోని కాలపరిస్థితిని తెలియజేస్తూ, లైంగిక సంబంధాన్ని సూచించే హీబ్రూ నుడికారాన్ని అతిగా విప్పకుండా తెలుగులో అందిస్తుంది.
- source_word: בְּנֵי הָאֱלֹהִים
  choice: దేవుని కుమారులు
  rationale: హీబ్రూ పదబంధానికి సన్నిహితంగా ఉండి, వారు దివ్యజీవులా, పాలకులా, లేక భక్తివంశానికి చెందినవారా అనే వివాదాన్ని ప్రధాన పాఠ్యంలో పరిష్కరించదు.
- source_word: בְּנוֹת הָאָדָם
  choice: మానవుల కుమార్తెలు
  rationale: אָדָם యొక్క సమష్టి మానవజాతి భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: וְיָלְדוּ לָהֶם
  choice: వారు వారికి పిల్లలను కన్నారు
  rationale: హీబ్రూలో అంతర్లీనంగా ఉన్న ‘పిల్లలు’ అనే కర్మను తెలుగులో స్పష్టం చేస్తూ, ‘వారికి’ అనే సంబంధాన్ని నిలుపుతుంది.
- source_word: הַגִּבֹּרִים
  choice: పరాక్రమవంతులు
  rationale: యోధులు లేదా వీరులు అనే సన్నని అర్థానికి పరిమితం చేయకుండా బలం, శౌర్యం, ప్రాబల్యం అనే విస్తృత భావాన్ని అందిస్తుంది.
- source_word: מֵעוֹלָם
  choice: ప్రాచీనకాలపు
  rationale: ఈ సందర్భంలో పురాతన కాలానికి చెందినవారు అనే భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: אַנְשֵׁי הַשֵּׁם
  choice: పేరుపొందిన పురుషులు
  rationale: పేరు, ఖ్యాతి అనే హీబ్రూ నుడికార భావాన్ని గౌరవప్రదమైన ఆధునిక తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: ‘దేవుని కుమారులు’ ఎవరు?
  choice: ‘దేవుని కుమారులు’ అనే సన్నిహిత రూపాన్నే ఉంచడం
  alternative: దివ్యజీవులు; మానవ పాలకులు; షేతు భక్తివంశానికి చెందినవారు
  rationale: ఈ సందర్భంలో సూచితుల గుర్తింపు అనిశ్చితం. ప్రధాన పాఠ్యం ఏ ఒక్క సిద్ధాంతపరమైన వ్యాఖ్యానాన్నీ నిర్ణయించకూడదు.
- issue: הַנְּפִלִים అర్థం
  choice: ‘నెఫీలులు’ అని లిప్యంతరీకరించడం
  alternative: దైత్యులు; పడిపోయినవారు
  rationale: పదం అరుదైనది; దాని ఖచ్చితమైన వ్యుత్పత్తి, అర్థం స్పష్టం కాదు. లిప్యంతరీకరణ నిజమైన అస్పష్టతను కాపాడుతుంది.
- issue: בְּנוֹת הָאָדָם లోని אָדָם
  choice: ‘మానవుల కుమార్తెలు’
  alternative: మనుష్యుని కుమార్తెలు; మనుష్యుల కుమార్తెలు
  rationale: ఏకవచన సమష్టి పదమైన אָדָם ఇక్కడ మానవజాతిని సూచిస్తుంది; తెలుగు వాక్యంలో అదే భావాన్ని స్పష్టంగా, సహజంగా అందించబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథనశైలి. వివాదాస్పద పదాలను ప్రధాన పాఠ్యంలో వ్యాఖ్యానాత్మకంగా పరిష్కరించకుండా, అవసరమైన ప్రత్యామ్నాయాలను పాదసూచికల్లో ఉంచాం.
