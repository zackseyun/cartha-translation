id: GEN.6.15
reference: Genesis 6:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/זֶ֕ה אֲשֶׁ֥ר תַּֽעֲשֶׂ֖ה אֹתָ֑/הּ שְׁלֹ֧שׁ מֵא֣וֹת אַמָּ֗ה אֹ֚רֶךְ הַ/תֵּבָ֔ה חֲמִשִּׁ֤ים אַמָּה֙ רָחְבָּ֔/הּ וּ/שְׁלֹשִׁ֥ים אַמָּ֖ה קוֹמָתָֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/015.yaml
  text: 'And this is how you shall make it: the length of the ark shall be three hundred cubits[a], its width fifty cubits, and its height thirty cubits.'
translation:
  language: te
  text: 'దాన్ని నీవు ఇలా చేయాలి: ఓడ పొడవు మూడు వందల మూరలు[a], దాని వెడల్పు యాభై మూరలు, దాని ఎత్తు ముప్పై మూరలు ఉండాలి.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూర అనేది మోచేతి నుండి చేతివేళ్ల కొనల వరకు ఉండే దూరం ఆధారంగా ఏర్పడిన ప్రాచీన పొడవు కొలమానం.
    reason: cultural_note
lexical_decisions:
- source_word: וְזֶה אֲשֶׁר תַּעֲשֶׂה אֹתָהּ
  choice: దాన్ని నీవు ఇలా చేయాలి
  rationale: నిర్మాణానికి సంబంధించిన నిర్దేశాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; עשה యొక్క ‘చేయు/నిర్మించు’ భావాన్ని సందర్భానుసారంగా నిలుపుతుంది.
- source_word: הַתֵּבָה
  choice: ఓడ
  rationale: నోవహు నిర్మించవలసిన జలవాహనాన్ని సాధారణ తెలుగు పాఠకులకు స్పష్టంగా సూచించే స్థిరమైన సందర్భోచిత పదం.
- source_word: שְׁלֹשׁ מֵאוֹת אַמָּה
  choice: మూడు వందల మూరలు
  rationale: ప్రాచీన కొలమానాన్ని ఆధునిక కొలతగా మార్చకుండా, తెలుగులో సంప్రదాయంగా అర్థమయ్యే ‘మూర’ అనే పదంతో మూలపాఠ ప్రత్యేకతను కాపాడుతుంది.
- source_word: אֹרֶךְ הַתֵּבָה
  choice: ఓడ పొడవు
  rationale: నిర్మాణ కొలతల సందర్భంలో సహజమైన, నేరుగా అర్థమయ్యే తెలుగు పదబంధం.
- source_word: חֲמִשִּׁים אַמָּה רָחְבָּהּ
  choice: దాని వెడల్పు యాభై మూరలు
  rationale: רָחְבָּהּ లోని స్వామ్యసూచక భావాన్ని ‘దాని’తో, పరిమాణాన్ని సహజ తెలుగు పదక్రమంలో వ్యక్తం చేస్తుంది.
- source_word: וּשְׁלֹשִׁים אַמָּה קוֹמָתָהּ
  choice: దాని ఎత్తు ముప్పై మూరలు
  rationale: నిర్మాణ సందర్భంలో קוֹמָה కు ‘ఎత్తు’ సరైన సమానార్థకం; సంధానార్థక וְ భావం వాక్యంలోని వరుస జాబితా ద్వారా సహజంగా వ్యక్తమవుతుంది.
