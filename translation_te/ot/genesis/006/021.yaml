  yaml_path: translation/ot/genesis/006/021.yaml
  text: And you[a], take for yourself some of every kind of food that is edible, and gather it to yourself[b]; and it shall be food for you and for them.
translation:
  language: te
  text: నీవైతే, తినదగిన[a] ప్రతి రకమైన ఆహారంలో కొంత తీసుకొని, దానిని నీ దగ్గరకు పోగుచేసుకో[b]. అది నీకూ వాటికీ ఆహారంగా ఉంటుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘తినబడే’ లేదా ‘తినగలిగే.’ హీబ్రూ సంబంధ వాక్యం తినడానికి అనువైన ఆహారాన్ని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘దానిని నీ వద్ద సమకూర్చుకో.’
    reason: translation_alternative
lexical_decisions:
- source_word: קַח לְךָ
  choice: నీ కోసం తీసుకొని
  rationale: లָקַח్ ఆజ్ఞార్థకం నేరుగా ‘తీసుకో’ అనే భావాన్ని ఇస్తుంది; לְךָ ఇక్కడ ప్రయోజనార్థకంగా ఉండి నోవహు బాధ్యతను సూచిస్తుంది. సహజమైన తెలుగు వాక్యనిర్మాణంలో ఈ భావం ‘తీసుకొని’ మరియు తరువాతి ‘నీ దగ్గర’ ద్వారా వ్యక్తమవుతుంది.
- source_word: מִכָּל מַאֲכָל
  choice: ప్రతి రకమైన ఆహారంలో కొంత
  rationale: מִן + כָּל అన్నది అందుబాటులోని ప్రతి ఆహార రకం నుండి కొంత తీసుకోవాలని సూచిస్తుంది; ఉన్న ఆహారమంతటినీ తీసుకోవాలనే అపార్థాన్ని ఇది నివారిస్తుంది.
- source_word: אֲשֶׁר יֵאָכֵל
  choice: తినదగిన
  rationale: אָכַל నిఫాల్ రూపంలోని సంబంధ వాక్యం తినడానికి అనువైన ఆహారాన్ని వర్గీకరిస్తోంది. ‘తినదగిన’ ఆధునిక తెలుగులో సహజంగా ఉండి, ‘తినబడే’ అనే మరింత రూపానుసార అర్థాన్నీ పాదసూచికలో నిలుపుతుంది.
- source_word: וְאָסַפְתָּ אֵלֶיךָ
  choice: దాన్ని నీ దగ్గర సమకూర్చుకో
  rationale: אָסַף యొక్క ‘సమకూర్చు/పోగుచేయు’ భావాన్నీ, אֵלֶיךָ యొక్క ‘నీ దగ్గరకు’ భావాన్నీ సహజమైన తెలుగులో కలిపి వ్యక్తం చేస్తుంది.
- source_word: וְהָיָה לְךָ וְלָהֶם לְאָכְלָה
  choice: అది నీకూ వాటికీ ఆహారంగా ఉంటుంది
  rationale: వావ్‌తో వచ్చిన పరిపూర్ణ క్రియ ఇక్కడ ఆజ్ఞ ఫలితంగా ఏర్పడే భవిష్య స్థితిని సూచిస్తుంది. పునరుక్త ప్రయోజనార్థక విభక్తులు నోవహునూ జంతువులనూ స్పష్టంగా వేరు చేస్తాయి.
