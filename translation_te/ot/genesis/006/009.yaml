  yaml_path: translation/ot/genesis/006/009.yaml
  text: These are the generations of Noah. Noah was a righteous man[a], blameless in his generation. Noah walked with God.
translation:
  language: te
  text: నోవహు వంశవృత్తాంతం ఇది. నోవహు నీతిమంతుడు; తన తరాలలో[a] నిందలేనివాడిగా ఉన్నాడు. నోవహు దేవునితో నడిచాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తన సమకాలికులలో”; లేదా, “తన కాలంలో.”
    reason: בְּדֹרֹתָיו అనే పదబంధం నోవహు జీవించిన కాలాన్ని లేదా అతని సమకాలికుల మధ్య అతని స్థితిని సూచించవచ్చు.
lexical_decisions:
- source_word: אֵלֶּה תּוֹלְדֹת
  choice: వంశవృత్తాంతం ఇది
  rationale: ఆదికాండంలోని విభాగాలను పరిచయం చేసే స్థిర పదబంధం. ‘తరాలు’ అనే యథారూప అనువాదం తెలుగులో ఇక్కడ సహజంగా లేక వంశజుల జాబితా మాత్రమే అన్న భావం కలిగించవచ్చు; ‘వంశవృత్తాంతం’ వంశపరంపరతో పాటు దానికి సంబంధించిన కథనాన్ని కూడా సూచిస్తుంది.
- source_word: נֹחַ
  choice: నోవహు
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: אִישׁ צַדִּיק
  choice: నీతిమంతుడు
  rationale: నోవహు పురుషుడని తెలుగు పుంలింగ రూపమే స్పష్టం చేస్తుంది; ‘నీతిమంతుడు’ צַדִּיק యొక్క నైతిక, ధార్మిక బరువును సహజంగా వ్యక్తం చేస్తుంది.
- source_word: תָּמִים
  choice: నిందలేనివాడు
  rationale: వ్యక్తి స్వభావాన్ని వర్ణించే సందర్భంలో సంపూర్ణ పాపరాహిత్యంకన్నా యథార్థత, సమగ్ర నడవడి, నిందకు తావులేని జీవితం అనే భావాన్ని ఇస్తుంది.
- source_word: בְּדֹרֹתָיו
  choice: తన తరాలలో
  rationale: హీబ్రూ బహువచన రూపాన్ని, అది సూచించగల కాలపరమైన లేదా సమకాలికుల మధ్య అనే భావాల మధ్య ఉన్న సందిగ్ధతను ప్రధాన పాఠంలో సాధ్యమైనంతవరకు నిలుపుతుంది.
- source_word: אֶת־הָאֱלֹהִים הִתְהַלֶּךְ
  choice: దేవునితో నడిచాడు
  rationale: దేవునితో సన్నిహిత సంబంధంలో జీవించడాన్ని సూచించే హీబ్రూ రూపకాన్ని, దాని గ్రంథాంతర ప్రతిధ్వనితో సహా నిలుపుతుంది.
theological_decisions:
- issue: నోవహును వర్ణించే תָּמִים అర్థం
  choice: నిందలేనివాడు—నడవడిలో సమగ్రతను సూచించే వర్ణన
  alternative: పరిపూర్ణుడు; మచ్చలేనివాడు
  rationale: ఈ పదం నోవహును అవినీతిగల తరానికి భిన్నంగా చూపిస్తుంది; అయితే అతడు సంపూర్ణంగా పాపరహితుడు అనే సిద్ధాంతార్థాన్ని హీబ్రూ తప్పనిసరిగా కోరదు.
- issue: בְּדֹרֹתָיו యొక్క పరిధి
  choice: ప్రధాన పాఠంలో ‘తన తరాలలో’ అని ఉంచడం
  alternative: తన సమకాలికులలో; తన కాలంలో
  rationale: మూలంలోని బహువచన నిర్మాణం కాలపరమైన భావానికీ, నోవహు సమకాలికులతో పోలికకీ అవకాశం ఇస్తుంది. ఒక భావాన్ని మాత్రమే ఖరారు చేయకుండా ప్రత్యామ్నాయాలను పాదసూచికలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనా సులభంగా అర్థమయ్యే శైలి. ‘వంశవృత్తాంతం’ ఆదికాండంలోని విభాగ-శీర్షిక స్వభావాన్ని సహజంగా తెలియజేస్తుంది. ‘దేవునితో నడిచాడు’ అనే బైబిలీయ రూపకాన్ని వివరణగా మార్చకుండా నిలిపింది.
