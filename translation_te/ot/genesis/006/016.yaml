  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: צֹ֣הַר תַּֽעֲשֶׂ֣ה לַ/תֵּבָ֗ה וְ/אֶל אַמָּה֙ תְּכַלֶ֣/נָּה מִ/לְ/מַ֔עְלָ/ה וּ/פֶ֥תַח הַ/תֵּבָ֖ה בְּ/צִדָּ֣/הּ תָּשִׂ֑ים תַּחְתִּיִּ֛ם שְׁנִיִּ֥ם וּ/שְׁלִשִׁ֖ים תַּֽעֲשֶֽׂ/הָ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/016.yaml
  text: You shall make a roof for the ark[a], and finish it to within a cubit from above. And you shall set the ark’s door in its side. You shall make it with lower, second[d][c][b], and third levels.
translation:
  language: te
  text: ఓడకు పైకప్పు[a] చేయాలి; పైభాగంలో దాన్ని ఒక మూరకు ముగించాలి[b]. ఓడ తలుపును దాని ప్రక్క భాగంలో అమర్చాలి. దానిలో కింది, రెండో, మూడో అంతస్తులు[c] చేయాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘కిటికీ’ లేదా ‘వెలుతురు వచ్చే రంధ్రం.’ ఇక్కడి హీబ్రూ పదం అరుదైనది; అది పూర్తి పైకప్పును సూచిస్తుందా, వెలుతురు కోసం చేసిన తెరువును సూచిస్తుందా అనేది స్పష్టంగా లేదు.
    reason: lexical_alternative
  - marker: b
    text: ‘పైభాగంలో దాన్ని ఒక మూరకు ముగించాలి’ అనే హీబ్రూ మాట అర్థం చేసుకోవడం కష్టం. ఇది పైభాగం ఒక మూర కొలతకు వచ్చేటట్లు పూర్తిచేయడాన్ని సూచించవచ్చు; నిర్మాణం యొక్క ఖచ్చితమైన రూపం స్పష్టంగా లేదు.
    reason: textual_ambiguity
  - marker: c
    text: లేదా ‘తళ్లు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: צֹהַר
  choice: పైకప్పు
  rationale: ఈ అరుదైన హీబ్రూ పదం ఖచ్చితంగా దేనిని సూచిస్తుందో స్పష్టంగా లేదు. తరువాతి పైభాగ నిర్మాణ సూచనతో కలిపి చూస్తే ‘పైకప్పు’ సందర్భానికి సరిపోతుంది; ‘కిటికీ’ లేదా ‘వెలుతురు వచ్చే రంధ్రం’ అనే అవకాశాలను పాదసూచికలో ఉంచాం.
- source_word: תֵּבָה
  choice: ఓడ
  rationale: జలప్రళయ సందర్భంలో నోవహు నిర్మించిన పెద్ద తేలియాడే నిర్మాణానికి సహజమైన, ప్రాచుర్యంలో ఉన్న తెలుగు పదం.
- source_word: וְאֶל־אַמָּה תְּכַלֶנָּה מִלְמַעְלָה
  choice: పైభాగంలో దాన్ని ఒక మూరకు ముగించాలి
  rationale: ‘ముగించు/పూర్తిచేయు,’ ‘ఒక మూరకు,’ ‘పై నుండి/పైభాగంలో’ అనే హీబ్రూ అంశాలను ఉంచుతూ, వాక్యంలోని నిర్మాణపరమైన అస్పష్టతను నిర్దిష్టమైన ఆకారంగా పరిష్కరించకుండా అనువదించాం.
- source_word: פֶּתַח
  choice: తలుపు
  rationale: ఓడలోకి ప్రవేశించే పక్కనున్న తెరువును ఈ నిర్మాణ సందర్భంలో ‘తలుపు’ సహజంగా తెలియజేస్తుంది.
- source_word: בְּצִדָּהּ
  choice: దాని పక్కన
  rationale: తలుపు ఓడ పక్క భాగంలో ఉండాలని సూచించే స్థలార్థాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: תַּחְתִּיִּם שְׁנִיִּם וּשְׁלִשִׁים
  choice: కింది, రెండో, మూడో అంతస్తులు
  rationale: హీబ్రూ పదబంధం ఓడలోని మూడు నిలువు స్థాయులను సూచిస్తుంది. ‘అంతస్తులు’ సాధారణ పాఠకులకు స్పష్టంగా ఉంటుంది; ‘తళ్లు’ కూడా సాధ్యమే.
