translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకుడికి అర్థమయ్యేలా సంక్షిప్త నిర్మాణ సూచనల శైలిని వాడాం. దేవుని ప్రత్యక్ష ఆజ్ఞలో తెలుగులో సహజంగా కర్తను విడిచిపెట్టి ‘చేయాలి’ రూపాన్ని ఉపయోగించాం. అరుదైన צֹהַר పదాన్నీ, ఒక మూరకు ముగించాలనే క్లిష్ట వాక్యాన్నీ పాదసూచికలతో అస్పష్టత సహా నిలిపాం.
