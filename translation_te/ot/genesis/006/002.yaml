source:
  edition: WLC
  text: וַ/יִּרְא֤וּ בְנֵי הָֽ/אֱלֹהִים֙ אֶת בְּנ֣וֹת הָֽ/אָדָ֔ם כִּ֥י טֹבֹ֖ת הֵ֑נָּה וַ/יִּקְח֤וּ לָ/הֶם֙ נָשִׁ֔ים מִ/כֹּ֖ל אֲשֶׁ֥ר בָּחָֽרוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/002.yaml
  text: the sons of God saw that the daughters of man were beautiful[b][a], and they took wives for themselves from any they chose.
translation:
  language: te
  text: దేవుని కుమారులు[a] మనుష్యుల కుమార్తెలు అందంగా ఉన్నారని చూసి, తాము ఎంచుకున్న వారిలో ఎవరినైనా తమకు భార్యలుగా చేసుకున్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘దివ్య జీవులు.’ ‘దేవుని కుమారులు’ ఎవరు అనే విషయంలో భిన్నాభిప్రాయాలు ఉన్నాయి. ప్రధాన వివరణల్లో పరలోక జీవులు, మానవ పాలకులు, లేదా షేతు వంశస్థులు అనే అభిప్రాయాలు ఉన్నాయి.
    reason: alternative_reading
lexical_decisions:
- source_word: בְנֵי הָאֱלֹהִים
  choice: దేవుని కుమారులు
  rationale: హీబ్రూ పదబంధానికి సన్నిహితమైన అనువాదం. వీరు పరలోక జీవులా, మానవ పాలకులా, లేక షేతు వంశస్థులా అనే వివాదాన్ని వాక్యంలోనే పరిష్కరించకుండా ఉంచుతుంది.
- source_word: בְּנוֹת הָאָדָם
  choice: మనుష్యుల కుమార్తెలు
  rationale: ఆదాం అనే ఏకవచన సమష్టివాచక పదాన్ని సహజమైన ఆధునిక తెలుగులో మానవజాతిని సూచించేలా అనువదిస్తూ, ముందున్న ‘దేవుని కుమారులు’తో సాహిత్యపరమైన వ్యత్యాసాన్ని నిలుపుతుంది.
- source_word: כִּי טֹבֹת הֵנָּה
  choice: అందంగా ఉన్నారని
  rationale: ఈ సందర్భంలో טוֹב స్త్రీల ఆకర్షణీయమైన రూపాన్ని సూచిస్తుంది. ‘అందంగా’ అనేది నైతిక మంచితనాన్ని సూచించకుండా భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וַיִּקְחוּ לָהֶם נָשִׁים
  choice: తమకు భార్యలుగా చేసుకున్నారు
  rationale: నָשִׁיםకు ‘స్త్రీలు’ లేదా ‘భార్యలు’ అనే అర్థాలు ఉండవచ్చు; לקח ל־ అనే వివాహసంబంధ ప్రయోగంలో ‘భార్యలుగా చేసుకున్నారు’ సహజమైన సందర్భార్థం, అలాగే לָהֶםలోని స్వప్రయోజన భావాన్ని నిలుపుతుంది.
- source_word: מִכֹּל אֲשֶׁר בָּחָרוּ
  choice: తాము ఎంచుకున్న వారిలో ఎవరినైనా
  rationale: מִכֹּלలోని పరిమితిలేని ఎంపిక భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; మూలంలో లేని అదనపు వ్యాఖ్యానాన్ని చేర్చదు.
theological_decisions:
- issue: ‘దేవుని కుమారులు’ ఎవరు?
  choice: వారి గుర్తింపును నిర్ణయించకుండా ‘దేవుని కుమారులు’ అనే మూలానికి సన్నిహితమైన పదబంధాన్ని ఉంచడం.
  alternative: దివ్య జీవులు లేదా పరలోక జీవులు; మానవ పాలకులు లేదా ప్రభువులు; షేతు వంశస్థులు.
  rationale: ఈ హీబ్రూ పదబంధం వివాదాస్పదమైనది; ఈ వచనం వారి గుర్తింపును స్పష్టంగా నిర్ణయించదు. అందువల్ల వ్యాఖ్యానపరమైన ఉద్రిక్తతను అనువాదంలో నిలిపి, ప్రధాన అభిప్రాయాలను పాదటిప్పణిలో సూచించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన వాక్యనిర్మాణం. ‘భార్యలుగా చేసుకున్నారు’ వివాహార్థాన్ని తెలియజేస్తూనే, ఎంపికలోని స్వేచ్ఛా/ఏకపక్ష భావాన్ని మృదువుగా చెరపదు. పాదటిప్పణి గుర్తు [a] ప్రధాన పాఠ్యంలో సంబంధిత పదబంధం వెంట ఉంచబడింది.
