  yaml_path: translation/ot/genesis/006/019.yaml
  text: And from every living thing of all flesh[a], you shall bring two of each into the ark to keep them alive with you[b]; they shall be male and female.
translation:
  language: te
  text: ప్రాణమున్న ప్రతిదానిలోనుంచి[a]—శరీరముగల సమస్త జీవుల్లోనుంచి[b]—ప్రతి రకానికి రెండేసి నీతోపాటు సజీవంగా ఉంచడానికి ఓడలోకి తీసుకురావాలి; అవి మగవీ ఆడవీ అయి ఉండాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ప్రాణమున్న ప్రతి జీవిలోనుంచి.’
    reason: lexical_alternative
  - marker: b
    text: హెబ్రీలో అక్షరార్థంగా ‘సమస్త శరీరంలోనుంచి’; ఇది శరీరముగల జీవులన్నిటినీ సూచించే నుడికారం.
    reason: cultural_note
lexical_decisions:
- source_word: וּמִכָּל הַחַי
  choice: ప్రాణమున్న ప్రతిదానిలోనుంచి
  rationale: విస్తృతంగా జీవమున్నదంతటినీ సూచించే హెబ్రీ పదబంధంలోని సమగ్రతను, ఆధునిక తెలుగులో సహజంగా నిలుపుతుంది.
- source_word: מִכָּל בָּשָׂר
  choice: శరీరముగల సమస్త జీవుల్లోనుంచి
  rationale: ‘సమస్త శరీరం’ అనే హెబ్రీ నుడికారాన్ని పదశః అసహజంగా చేయకుండా, శరీరధారులైన జీవులనే దాని భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: שְׁנַיִם מִכֹּל
  choice: ప్రతి రకానికి రెండేసి
  rationale: ప్రతి వర్గం లేదా రకం నుంచి రెండు అనే విభజనార్థాన్ని తెలుగులో స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: תָּבִיא אֶל הַתֵּבָה
  choice: ఓడలోకి తీసుకురావాలి
  rationale: ఆదేశ సందర్భంలోని క్రియాబలాన్ని ‘తీసుకురావాలి’ నిలుపుతుంది; గమనం ఓడ లోపలికి అని ‘ఓడలోకి’ స్పష్టం చేస్తుంది.
- source_word: לְהַחֲיֹת אִתָּךְ
  choice: నీతోపాటు సజీవంగా ఉంచడానికి
  rationale: హిఫీల్ క్రియలోని ‘బతికించి ఉంచడం/ప్రాణం కాపాడడం’ అనే కారణార్థాన్ని, నోవహుతో సహవాసాన్ని సహజ తెలుగులో అందిస్తుంది.
- source_word: זָכָר וּנְקֵבָה יִהְיוּ
  choice: అవి మగదీ ఆడదీ అయి ఉండాలి
  rationale: జంటలో జీవశాస్త్రీయ లింగాల కూర్పును, ఆదేశాత్మక సందర్భాన్ని నేరుగా వ్యక్తం చేస్తుంది.
