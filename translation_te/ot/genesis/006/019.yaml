translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే ఆదేశ శైలిని వాడాం. మూలంలోని ‘ప్రాణమున్న ప్రతిదీ / సమస్త శరీరం’ అనే పునరుక్తి-సదృశ నిర్మాణాన్ని డాష్‌లతో నిలిపి, దాని విస్తృత భావాన్ని సంకుచితం చేయలేదు.
