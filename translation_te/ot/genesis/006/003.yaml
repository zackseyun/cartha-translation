id: GEN.6.3
reference: Genesis 6:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוָ֗ה לֹֽא יָד֨וֹן רוּחִ֤/י בָֽ/אָדָם֙ לְ/עֹלָ֔ם בְּ/שַׁ/גַּ֖ם ה֣וּא בָשָׂ֑ר וְ/הָי֣וּ יָמָ֔י/ו מֵאָ֥ה וְ/עֶשְׂרִ֖ים שָׁנָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/003.yaml
  text: Then Yahweh said[a], “My Spirit will not contend with man forever, for he is flesh[c][b]; therefore his days will be one hundred and twenty years.”
translation:
  language: te
  text: 'అప్పుడు యాహ్వే ఇలా అన్నాడు: “నా ఆత్మ మనిషితో[b] ఎప్పటికీ పోరాడదు[a], ఎందుకంటే అతడు శరీరమే[c]; కాబట్టి అతని రోజులు నూట ఇరవై సంవత్సరాలు అవుతాయి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నా ఆత్మ మనిషిలో ఎప్పటికీ నిలిచి ఉండదు.” ఇక్కడి హీబ్రూ క్రియ అర్థం వివాదాస్పదం; అది పోరాడటాన్ని కాక నిలిచి ఉండటాన్ని సూచించవచ్చు.
    reason: alternative_reading
  - marker: b
    text: “మనిషి” అని అనువదించిన హీబ్రూ పదం ఆదామ్; ఇది ఏకవచనంలో ఉన్నా ఇక్కడ మానవజాతిని సాధారణంగా సూచిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: లేదా, “ఎందుకంటే అతడూ శరీరమే.”
    reason: previous_rendering
lexical_decisions:
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవ నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగులో సహజమైన లిప్యంతరీకరణగా ఉంచింది.
- source_word: יָדוֹן
  choice: పోరాడదు
  rationale: వివాదాస్పదమైన ఈ క్రియకు ‘వాదించు/పోరాడు’ అనే భావాన్ని ప్రధాన పాఠంలో ఉంచి, ‘నిలిచి ఉండదు’ అనే నిజమైన ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో తెలిపింది.
- source_word: רוּחִי
  choice: నా ఆత్మ
  rationale: దేవుడే వక్త కావడం వల్ల ‘నా ఆత్మ’ సహజమైన అర్థం; ‘ప్రాణవాయువు’ అని పరిమితం చేయకుండా మూలంలోని విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: בָאָדָם
  choice: మనిషితో
  rationale: אָדָם ఇక్కడ మానవజాతిని సూచించే ఏకవచన సామాన్య పదం; ఎంచుకున్న ‘పోరాడు’ అనే క్రియతో ‘మనిషితో’ సహజంగా సరిపోతుంది.
- source_word: לְעֹלָם
  choice: ఎప్పటికీ
  rationale: ఈ సందర్భంలో శాశ్వత లేదా నిరవధిక కాలాన్ని తెలిపే సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: בְּשַׁגַּם הוּא בָשָׂר
  choice: అతడు శరీరస్వభావి
  rationale: మూలంలోని ఏకవచన ప్రతినిధి ప్రయోగాన్ని నిలుపుతూ, בָשָׂר యొక్క మానవ బలహీనత/మర్త్యత్వ భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది; గַּם ప్రతిఫలించే ‘కూడా’ అనే ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచింది.
- source_word: וְהָיוּ יָמָיו
  choice: కాబట్టి అతని రోజులు ... అవుతాయి
  rationale: హీబ్రూ వావ్ సూచించగల ఫలిత సంబంధాన్ని తెలుగులో స్పష్టంగా చూపిస్తుంది; ‘రోజులు’ అనే మూల రూపకాన్ని నిలుపుతుంది.
- source_word: מֵאָה וְעֶשְׂרִים שָׁנָה
  choice: నూట ఇరవై సంవత్సరాలు
  rationale: సంఖ్యను సహజమైన సాహిత్య తెలుగు రూపంలో పూర్తిగా రాసింది.
theological_decisions:
- issue: దేవుని ఆత్మకు మానవునితో ఉన్న సంబంధం
  choice: ‘నా ఆత్మ’ అని అనువదించడం
  alternative: ‘నా ఊపిరి’ లేదా ‘నా ప్రాణవాయువు’
  rationale: רוּחַ పదానికి ఆత్మ, గాలి, ఊపిరి అనే అర్థాలు ఉన్నా, దేవుని ప్రత్యక్ష వాక్యంలో మొదటి పురుష స్వామ్యరూపం ‘నా ఆత్మ’ వైపు మొగ్గుచూపుతుంది; తరువాతి త్రిత్వ సిద్ధాంతాన్ని వచనంలోకి బలవంతంగా చేర్చదు.
- issue: יָדוֹן క్రియ అర్థం
  choice: ‘మనిషితో ... పోరాడదు’
  alternative: ‘మనిషిలో ... నిలిచి ఉండదు’
  rationale: క్రియ వ్యుత్పత్తి, అర్థం వివాదాస్పదం. ప్రధాన పాఠం దైవ ప్రతిఘటన/నిగ్రహ భావాన్ని ఉంచుతుంది; నివాసం లేదా నిలిచి ఉండటం అనే పఠనాన్ని పాదటిప్పణి కాపాడుతుంది.
- issue: నూట ఇరవై సంవత్సరాల స్వభావం
  choice: మూలంలోని ‘అతని రోజులు’ అనే అస్పష్టతను నిలుపడం
  alternative: జలప్రళయం వరకు మిగిలిన గడువు లేదా వ్యక్తిగత మానవ ఆయుష్షు అని స్పష్టీకరించడం
  rationale: వచనం ఈ సంఖ్యను మానవ ఆయుష్షుగా లేదా తీర్పు వరకు గడువుగా నేరుగా నిర్వచించదు; అందువల్ల ఏ వ్యాఖ్యానాన్నీ ప్రధాన పాఠంలో నిర్ణయంగా చేర్చలేదు.
- issue: אָדָם పరిధి
  choice: మానవజాతికి ప్రతినిధిగా ‘మనిషి/అతడు’ అనే ఏకవచనం
  alternative: ‘మానవజాతి/వారు’
  rationale: హీబ్రూ వ్యాకరణ ఏకవచనాన్ని, దాని సామాన్య మానవ సూచనను రెండింటినీ కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనా సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘యాహ్వే’ అనే వ్యక్తినామం, ‘నా ఆత్మ’, ‘అతని రోజులు’ వంటి మూలపాఠ రూపకాలు నిలుపబడ్డాయి. వివాదాస్పద క్రియార్థం మరియు ‘కూడా’ భావం పాదటిప్పణుల్లో భద్రపరచబడ్డాయి.
