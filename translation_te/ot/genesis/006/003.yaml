- from: 'అప్పుడు యాహ్వే ఇలా అన్నాడు: “నా ఆత్మ మనిషితో ఎప్పటికీ పోరాడదు[a]; అతడు శరీరస్వభావి[b][c]. కాబట్టి అతని రోజులు నూట ఇరవై సంవత్సరాలు అవుతాయి.”'
  to: 'అప్పుడు యాహ్వే ఇలా అన్నాడు: “నా ఆత్మ మనిషితో[b] ఎప్పటికీ పోరాడదు[a], ఎందుకంటే అతడు శరీరమే[c]; కాబట్టి అతని రోజులు నూట ఇరవై సంవత్సరాలు అవుతాయి.”'
  rationale: “శరీరస్వభావి” స్థానంలో “శరీరమే” ఉంచి בָשָׂר యొక్క ప్రత్యక్ష, విస్తృత భావాన్ని కాపాడాము; తద్వారా తరువాతి నైతిక లేదా సిద్ధాంతపరమైన అర్థాన్ని వచనంలోకి చేర్చలేదు. బְּשַׁגַּם యొక్క కారణార్థాన్ని ప్రధాన పాఠంలో “ఎందుకంటే” ద్వారా చూపి, గַּם యొక్క సాధ్యమైన “కూడా” భావాన్ని పాదటిప్పణిలో నిలిపాము. ఇతర వివాదాస్పద అంశాలు, ముఖ్యంగా יָדוֹן యొక్క ప్రత్యామ్నాయ అర్థం మరియు 120 సంవత్సరాల అస్పష్ట పరిధి, యథాతథంగా భద్రపరచబడ్డాయి.
