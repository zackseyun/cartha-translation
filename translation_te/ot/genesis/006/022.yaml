  yaml_path: translation/ot/genesis/006/022.yaml
  text: Thus Noah did[a]; according to all that God commanded him[b], so he did.
translation:
  language: te
  text: నోవహు అలా చేశాడు; దేవుడు అతనికి ఆజ్ఞాపించిన ప్రతిదాని ప్రకారం అతడు అలాగే చేశాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూలో ‘చేశాడు’ అనే క్రియ ఉద్ఘాటన కోసం రెండుసార్లు వస్తుంది: ‘నోవహు చేశాడు ... అలాగే చేశాడు.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: చేశాడు
  rationale: עשה అనే విస్తృతార్థక క్రియ ఇక్కడ ముందుగా ఇచ్చిన ఆదేశాలకు నోవహు విధేయంగా చేసిన కార్యాన్ని సంక్షిప్తంగా సూచిస్తుంది.
- source_word: נֹחַ
  choice: నోవహు
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: כְּכֹל אֲשֶׁר
  choice: ఆజ్ఞాపించినదంతా
  rationale: כְּ యొక్క అనుగుణత భావాన్నీ כֹל యొక్క సంపూర్ణతనూ సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; ‘అలాగే’తో కలిసి పూర్తి అనుసరణను చూపుతుంది.
- source_word: צִוָּה
  choice: ఆజ్ఞాపించిన
  rationale: దైవిక అధికారంతో ఇచ్చిన ఆదేశాన్ని సూచించే צוה క్రియకు ‘ఆజ్ఞాపించు’ తగిన సమానార్థకం.
- source_word: אֹתוֹ
  choice: అతనికి
  rationale: హీబ్రూలో ప్రత్యక్ష కర్మ సూచకంతో ఉన్న తృతీయ పురుష ఏకవచన ప్రత్యయం నోవహును సూచిస్తుంది; ‘ఆజ్ఞాపించు’ అనే తెలుగు క్రియతో గ్రహీతను ‘అతనికి’ అని సహజంగా తెలుపుతారు.
- source_word: אֱלֹהִים
  choice: దేవుడు
  rationale: రూపరీత్యా బహువచనమైనప్పటికీ ఇక్కడ ఏకవచన క్రియతో వచ్చి ఏక దేవుణ్ణి సూచిస్తుంది.
- source_word: כֵּן
  choice: అలాగే
  rationale: ముందున్న ఆజ్ఞలకు నోవహు చేసినది సరిగ్గా అనుగుణంగా ఉందని పునరుద్ఘాటిస్తుంది.
- source_word: עָשָׂה
  choice: అతడు అలాగే చేశాడు
  rationale: మూలంలోని עשה క్రియా పునరుక్తిని నిలిపి, నోవహు సంపూర్ణ విధేయతపై ఉన్న ఉద్ఘాటనను కాపాడుతుంది.
theological_decisions:
- issue: విధేయతను తెలిపే עשה క్రియ పునరుక్తి
  choice: రెండు క్రియల్నీ నిలిపి, ‘నోవహు అలాగే చేశాడు ... అతడు అలాగే చేశాడు’ అని అనువదించడం
  alternative: ‘దేవుడు ఆజ్ఞాపించినదంతా నోవహు చేశాడు’ అని ఒకే వాక్యంగా సంక్షిప్తం చేయడం
  rationale: హీబ్రూ ఉద్దేశపూర్వకంగా עשה క్రియను రెండుసార్లు ఉపయోగించి నోవహు ఆజ్ఞలను పూర్తిగా పాటించాడని నొక్కి చెబుతుంది. పునరుక్తిని తొలగిస్తే ఆ వాక్య నిర్మాణంలోని ఉద్ఘాటన తగ్గిపోతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. హీబ్రూ పునరుక్తిని నిలిపినా తెలుగు ప్రవాహం కోసం כֵּן ను ‘అలాగే’గా రెండవ క్రియతో జతచేశాం. పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో చేర్చబడింది.
