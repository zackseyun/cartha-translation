- from: 'అప్పుడు యెహోవా ఇలా అన్నాడు: “నేను సృష్టించిన మనుష్యజాతిని[a] నేల ముఖం మీద నుండి తుడిచివేస్తాను—మనుషులతోపాటు పశువులను, నేలపై పాకే జీవులను, ఆకాశ పక్షులను[c] కూడా తుడిచివేస్తాను. ఎందుకంటే నేను వాటిని చేసినందుకు చింతిస్తున్నాను[b].”'
  to: 'అప్పుడు యెహోవా ఇలా అన్నాడు: “నేను సృష్టించిన మనుష్యజాతిని[a] నేల ముఖం మీద నుండి తుడిచివేస్తాను—మనుష్యుల నుండి పశువుల వరకు, నేలపై పాకే జీవుల వరకు, ఆకాశ పక్షుల వరకు[c]—ఎందుకంటే వాటిని చేసినందుకు నేను విచారిస్తున్నాను[b].”'
