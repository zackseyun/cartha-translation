id: GEN.6.7
reference: Genesis 6:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוָ֗ה אֶמְחֶ֨ה אֶת הָ/אָדָ֤ם אֲשֶׁר בָּרָ֨אתִי֙ מֵ/עַל֙ פְּנֵ֣י הָֽ/אֲדָמָ֔ה מֵֽ/אָדָם֙ עַד בְּהֵמָ֔ה עַד רֶ֖מֶשׂ וְ/עַד ע֣וֹף הַ/שָּׁמָ֑יִם כִּ֥י נִחַ֖מְתִּי כִּ֥י עֲשִׂיתִֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/007.yaml
  text: So Yahweh said[a], “I will blot out man, whom I have created[c], from the face of the ground—from man to livestock to creeping things and to the birds of the heavens—for I regret that I have made them[b].”
translation:
  language: te
  text: 'అప్పుడు యెహోవా ఇలా అన్నాడు: “నేను సృష్టించిన మనుష్యజాతిని[a] నేల ముఖం మీద నుండి తుడిచివేస్తాను—మనుష్యుల నుండి పశువుల వరకు, నేలపై పాకే జీవుల వరకు, ఆకాశ పక్షుల వరకు[c]—ఎందుకంటే వాటిని చేసినందుకు నేను విచారిస్తున్నాను[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “మనిషిని.” హీబ్రూ ఆదామ్ అనే పదం ఇక్కడ మనుష్యజాతిని సమష్టిగా సూచించగలదు; తరువాతి “మనుష్యుల నుండి” అనే పదబంధంలో అదే పదం మళ్లీ వస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా “నేను వాటిని చేసినందుకు పశ్చాత్తాపపడుతున్నాను,” లేదా “వాటిని చేసినందుకు నేను దుఃఖిస్తున్నాను.” హీబ్రూ క్రియ గత కార్యాన్ని గురించిన విచారం లేదా దుఃఖాన్ని వ్యక్తం చేస్తుంది; దేవుడు ఆశ్చర్యపోయాడని, ముందుగా తెలియదని, లేదా నైతిక తప్పు చేశాడని ఆ పదం స్వయంగా చెప్పదు.
    reason: alternative_reading
  - marker: c
    text: “ఆకాశ పక్షులు” అనేది హీబ్రూలో అక్షరార్థ వ్యక్తీకరణ; దీనిని “ఆకాశంలోని పక్షులు” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన YHWHను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే రూపంలో నిలుపుతుంది.
- source_word: אֶמְחֶה
  choice: తుడిచివేస్తాను
  rationale: మחה క్రియలోని తుడిచివేయడం లేదా పూర్తిగా తొలగించడం అనే స్పష్టమైన చిత్రాన్ని, ‘నేల ముఖం మీద నుండి’ అనే పదబంధంతో సహజంగా కలుపుతుంది.
- source_word: הָאָדָם
  choice: మనుష్యజాతి
  rationale: ఇక్కడ אדם ఒక వ్యక్తిని కాక సమష్టిగా మానవాళిని సూచిస్తుంది; ఆధునిక తెలుగులో ఈ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: אֲשֶׁר בָּרָאתִי
  choice: నేను సృష్టించిన
  rationale: పూర్తయిన దైవిక సృష్టికార్యాన్ని సహజమైన తెలుగు సంబంధ వాక్యంగా వ్యక్తపరుస్తుంది.
- source_word: מֵעַל פְּנֵי הָאֲדָמָה
  choice: నేల ముఖం మీద నుండి
  rationale: אדמהకు ‘నేల’ అనే నిర్దిష్ట భావాన్నీ, פני అనే హీబ్రూ రూపకాన్నీ నిలుపుతుంది.
- source_word: מֵאָדָם עַד בְּהֵמָה עַד רֶמֶשׂ וְעַד עוֹף הַשָּׁמַיִם
  choice: మనుషులతోపాటు పశువులను, నేలపై పాకే జీవులను, ఆకాశ పక్షులను కూడా
  rationale: మానవులనుండి వివిధ జీవవర్గాల వరకు విస్తరించే హీబ్రూ వరుసను సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: נִחַמְתִּי
  choice: చింతిస్తున్నాను
  rationale: గత కార్యాన్ని గురించి కలిగిన పశ్చాత్తాపభరితమైన విచారం లేదా దుఃఖాన్ని తెలుపుతూ, ఆశ్చర్యం, అజ్ఞానం లేదా నైతిక తప్పు అనే భావాలను అదనంగా చేర్చదు.
- source_word: כִּי עֲשִׂיתִם
  choice: నేను వాటిని చేసినందుకు
  rationale: బహువచన ప్రత్యయాన్ని ముందున్న సృష్టిజీవులన్నిటికి అన్వయిస్తూ, కారణార్థకమైన כי వాక్యాన్ని సహజంగా అందిస్తుంది.
theological_decisions:
- issue: నִחַמְתִּיలో దేవుని విచారం
  choice: నేను వాటిని చేసినందుకు చింతిస్తున్నాను
  alternative: నేను వాటిని చేసినందుకు పశ్చాత్తాపపడుతున్నాను; నేను వాటిని చేసినందుకు దుఃఖిస్తున్నాను
  rationale: మూలంలోని గత కార్యాన్ని వెనుదిరిగి చూసే విచారం మరియు దుఃఖం మధ్య ఉన్న భావవిస్తృతిని ‘చింతిస్తున్నాను’ సహజంగా నిలుపుతుంది. దేవుడు ఆశ్చర్యపోయాడని, ముందుగా తెలియదని, లేదా నైతిక తప్పు చేశాడని మూలం చెప్పని నిర్ధారణను అనువాదం చేర్చదు.
- issue: הָאָדָם యొక్క సమష్టి భావం
  choice: మనుష్యజాతి
  alternative: మనిషి; మానవాళి
  rationale: ఈ సందర్భంలో పదం సమస్త మానవులను సమష్టిగా సూచిస్తుంది. ‘మనుష్యజాతి’ ఆధునిక పాఠకునికి ఆ పరిధిని స్పష్టంగా తెలియజేస్తుంది; గమనిక మూలపదానికి ‘మనిషి’ అనే రూపమూ సాధ్యమని సూచిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు స్పష్టంగా ఉండే శైలి. ‘నేల ముఖం’ అనే మూలభాషా చిత్రాన్ని నిలుపుతూ, జంతువుల వరుసను తెలుగు వాక్యనిర్మాణానికి అనుగుణంగా సహజీకరించాం. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
