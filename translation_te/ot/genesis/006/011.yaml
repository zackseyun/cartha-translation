id: GEN.6.11
reference: Genesis 6:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/תִּשָּׁחֵ֥ת הָ/אָ֖רֶץ לִ/פְנֵ֣י הָֽ/אֱלֹהִ֑ים וַ/תִּמָּלֵ֥א הָ/אָ֖רֶץ חָמָֽס׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/011.yaml
  text: The earth was corrupt before God[a], and the earth was filled with violence.
translation:
  language: te
  text: భూమి దేవుని సన్నిధిలో[a] చెడిపోయింది; భూమి హింసతో నిండిపోయింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దేవుని దృష్టిలో.”
    reason: లִפְנֵי הָאֱלֹהִים కు సహజమైన ప్రత్యామ్నాయ అనువాదం.
lexical_decisions:
- source_word: וַתִּשָּׁחֵת
  choice: చెడిపోయింది
  rationale: నిఫాల్ రూపం భూమి పాడై, భ్రష్టమైన స్థితికి చేరడాన్ని సూచిస్తుంది. సమీప సందర్భంలోని మానవ దుష్టత్వానికి అనుగుణంగా, సహజమైన తెలుగులో నైతిక చెడును వ్యక్తం చేస్తుంది; భౌతిక నాశనానికే పరిమితం చేయదు.
- source_word: הָאָרֶץ
  choice: భూమి
  rationale: אֶרֶץ అనే పదానికి ‘భూమి’ లేదా ‘దేశం/నేల’ అనే అర్థాలు ఉండవచ్చు. జలప్రళయ కథనంలోని విస్తృత పరిధిని దృష్టిలో ఉంచుకొని ‘భూమి’ని ప్రధాన పాఠంలో ఎంచుకున్నాం; మూలంలోని పునరుక్తిని నిలిపాం.
- source_word: לִפְנֵי הָאֱלֹהִים
  choice: దేవుని సన్నిధిలో
  rationale: לִפְנֵי యొక్క ‘ఎదుట/సన్నిధిలో’ అనే భావాన్ని సహజమైన, గౌరవప్రదమైన తెలుగులో నిలుపుతుంది. ఇది దేవుని దృష్టికి, సమక్షానికి సంబంధించిన భావాన్ని అనవసరంగా విస్తరించదు.
- source_word: וַתִּמָּלֵא
  choice: నిండిపోయింది
  rationale: నిఫాల్ కథన రూపం భూమి నిండిన స్థితికి చేరడాన్ని సూచిస్తుంది. ‘నిండిపోయింది’ ఆ ఫలితస్థితినీ కథన పురోగతినీ సహజంగా తెలియజేస్తుంది.
- source_word: חָמָס
  choice: హింస
  rationale: ఈ పదం హింస, క్రూరత్వం, హింసాత్మక అన్యాయాన్ని సూచిస్తుంది. ‘హింస’ సంక్షిప్తంగా దాని తీవ్రతను నిలుపుతుంది.
- source_word: וַ
  choice: కథన అనుసంధానం; ప్రత్యేక పదంగా అనువదించలేదు
  rationale: తెలుగులో మొదటి వాక్యానికి అదనంగా ‘ఇప్పుడు’ లేదా ‘మరియు’ పెట్టకుండానే కథన కొనసాగింపు సహజంగా తెలుస్తుంది; మూలంలో స్పష్టమైన కాలసూచక ‘ఇప్పుడు’ లేదు.
theological_decisions:
- issue: చెడిపోవడం యొక్క స్వభావం
  choice: భూమి/మానవ సమాజం దేవుని సన్నిధిలో నైతికంగా చెడిపోవడం
  alternative: భూమి భౌతికంగా పాడవడం లేదా నాశనమవడం
  rationale: తక్షణ సందర్భం మానవ దుష్టత్వాన్నీ హింసనూ ప్రధానంగా చూపుతుంది. అయినా ‘చెడిపోయింది’ అనే పదం మూలంలోని విస్తృత భావాన్ని పూర్తిగా మూసివేయదు.
- issue: הָאָרֶץ యొక్క పరిధి
  choice: భూమి
  alternative: దేశం లేదా నేల
  rationale: జలప్రళయ కథనం విస్తృత పరిధిని సూచిస్తుంది; అయితే పదానికి ఉన్న ‘దేశం/నేల’ ప్రత్యామ్నాయాన్ని పాదసూచికలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని ‘భూమి’ పునరుక్తిని ఉద్దేశపూర్వకంగా నిలిపి, రెండు సమాంతర వాక్యభాగాలను అర్ధవిరామంతో అనుసంధానించాం.
