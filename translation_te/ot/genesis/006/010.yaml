  rationale: The verb has been revised to preserve the Hebrew Hiphil's specifically paternal sense in idiomatic modern Telugu. The number, male kinship term, and conventional Telugu forms of the names are retained. No footnote is needed because the rendering is direct and does not introduce an unresolved ambiguity.
