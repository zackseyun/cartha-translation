  text: 'And Noah fathered three sons: Shem[a], Ham, and Japheth.'
translation:
  language: te
  text: 'నోవహు ముగ్గురు కుమారులకు తండ్రి అయ్యాడు: షేము, హాము, యాపెతు.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיּוֹלֶד
  choice: పుట్టారు
  rationale: ילד హిఫిల్ రూపం ఇక్కడ నోవహు తండ్రిగా ముగ్గురు కుమారులను కనాడనే అర్థాన్ని ఇస్తుంది. తెలుగులో ‘నోవహుకు ... పుట్టారు’ అనేది సహజంగా ఉండి, సంతానం కలిగిన భావాన్ని స్పష్టంగా తెలియజేస్తుంది; ‘కన్నాడు’ ఆధునిక వాడుకలో పురుషుని గురించి అసహజంగా లేదా ద్వ్యర్థంగా అనిపించవచ్చు.
- source_word: שְׁלֹשָׁה בָנִים
  choice: ముగ్గురు కుమారులు
  rationale: בָנִים ప్రత్యేకంగా పురుష సంతానాన్ని సూచిస్తుంది. వ్యక్తులను లెక్కించడానికి సహజమైన తెలుగు సంఖ్యారూపం ‘ముగ్గురు’ వాడబడింది.
- source_word: אֶת שֵׁם אֶת חָם וְאֶת יָפֶת
  choice: షేము, హాము, యాపెతు
  rationale: אֶת అనే ప్రత్యక్ష కర్మ సూచికలను తెలుగులో విడిగా అనువదించాల్సిన అవసరం లేదు. పేర్లను హీబ్రూ ఉచ్చారణకు సమీపంగా, తెలుగులో సులభంగా చదవగల రూపాల్లో లిప్యంతరీకరించాం.
- source_word: נֹחַ
  choice: నోవహు
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు బైబిలు పాఠకులకు గుర్తుపట్టదగిన, మూల ఉచ్చారణకు సమీపమైన రూపంగా ఇచ్చాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. మూలంలోని వంశావళి సమాచారాన్ని సంక్షిప్తంగా, పేర్ల జాబితాకు కోలన్ ఉపయోగించి అందించింది.
