id: GEN.6.5
reference: Genesis 6:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּ֣רְא יְהוָ֔ה כִּ֥י רַבָּ֛ה רָעַ֥ת הָ/אָדָ֖ם בָּ/אָ֑רֶץ וְ/כָל יֵ֨צֶר֙ מַחְשְׁבֹ֣ת לִבּ֔/וֹ רַ֥ק רַ֖ע כָּל הַ/יּֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/005.yaml
  text: And Yahweh saw that the wickedness of man was great on the earth[b][a], and that every inclination of the thoughts of his heart was only evil all the day.
translation:
  language: te
  text: యాహ్వే భూమిమీద మానవుల దుష్టత్వం ఎంతో గొప్పదై ఉందని, వారి హృదయ ఆలోచనల ప్రతి ఉద్దేశమూ రోజంతా కేవలం చెడేనని చూశాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఎల్లప్పుడూ కేవలం చెడే.” హిబ్రూలో అక్షరార్థంగా, “రోజంతా కేవలం చెడే” అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: చూశాడు
  rationale: కథనాన్ని ముందుకు నడిపించే హిబ్రూ రూపాన్ని సహజమైన తెలుగు భూతకాల క్రియతో వ్యక్తం చేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన టెట్రాగ్రామటన్‌ను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా పరిచయమైన రూపంలో ఉంచుతుంది.
- source_word: רַבָּה רָעַת הָאָדָם
  choice: మానవుల దుష్టత్వం ఎంతో పెరిగిపోయింది
  rationale: ఆదికాండపు ఈ సందర్భంలో אָדָם సమస్త మానవాళిని సమష్టిగా సూచిస్తుంది; רַבָּה దుష్టత్వపు విస్తారాన్ని లేదా తీవ్రతను తెలియజేస్తుంది.
- source_word: בָּאָרֶץ
  choice: భూమిమీద
  rationale: ఆదికాండం 6 యొక్క ఆదిచరిత్ర సందర్భంలో నిర్దిష్ట దేశం కాక సమస్త భూమి ఉద్దేశించబడింది.
- source_word: כָל יֵצֶר מַחְשְׁבֹת לִבּוֹ
  choice: వారి హృదయాలోచనల ప్రతి ఉద్దేశం
  rationale: יֵצֶר యొక్క రూపుదిద్దే అంతర్గత ప్రేరణ లేదా సంకల్ప భావాన్ని ‘ఉద్దేశం’ తెలియజేస్తుంది; ‘హృదయం’ అనే బైబిలీయ అంతరంగ వ్యక్తీకరణను నిలుపుతుంది.
- source_word: רַק רַע כָּל הַיּוֹם
  choice: రోజంతా కేవలం చెడే
  rationale: రַק యొక్క నిర్బంధ భావాన్నీ, כָּל הַיּוֹם యొక్క అక్షరార్థ కాలవ్యాప్తినీ సహజమైన తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు; యాహ్వే
  rationale: మూలంలోని వ్యక్తిగత దైవనామాన్ని బిరుదుగా మార్చకుండా ఉంచాలి. ‘యెహోవా’ ఆధునిక తెలుగు బైబిల్ పాఠకులకు సుపరిచితమైన లిప్యంతరీకరణ; ‘యాహ్వే’ మూల ఉచ్చారణకు దగ్గరైన ప్రత్యామ్నాయం.
- issue: הָאָדָם యొక్క సమష్టి భావం
  choice: మానవులు
  alternative: మనిషి; మానవజాతి
  rationale: ఇక్కడ ఒక్క పురుష వ్యక్తి కాక మానవాళి సమష్టిగా ఉద్దేశించబడింది; తెలుగు బహువచనం ఆ భావాన్ని సహజంగా, లింగ సమగ్రంగా తెలియజేస్తుంది.
- issue: כָּל הַיּוֹם యొక్క కాలార్థం
  choice: రోజంతా
  alternative: ఎల్లప్పుడూ
  rationale: అక్షరార్థమైన కాలవ్యాప్తిని ప్రధాన పాఠంలో నిలుపుతూ, నిరంతరత్వ భావాన్ని పాదటిప్పణిలో ప్రత్యామ్నాయంగా చూపుతుంది.
translation_notes:
  register: సహజమైన ఆధునిక ప్రామాణిక తెలుగు; గంభీరతను కాపాడుతూ సాధారణ పాఠకులకు అర్థమయ్యే పదజాలం. సమష్టి אָדָם కారణంగా ఏకవచన ‘అతని’ బదులు తెలుగు భావానుసారంగా ‘వారి’ వాడబడింది.
