id: GEN.6.1
reference: Genesis 6:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַֽ/יְהִי֙ כִּֽי הֵחֵ֣ל הָֽ/אָדָ֔ם לָ/רֹ֖ב עַל פְּנֵ֣י הָֽ/אֲדָמָ֑ה וּ/בָנ֖וֹת יֻלְּד֥וּ לָ/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/001.yaml
  text: And it happened[a], when man began to multiply on the face of the ground, and daughters were born to them,
translation:
  language: te
  text: మనుష్యులు నేలమీద సంఖ్యలో పెరగడం మొదలై, వారికి కుమార్తెలు పుట్టినప్పుడు,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כִּי
  choice: …మొదలైనప్పుడు
  rationale: ఈ కలయిక కథనంలో కొత్త పరిణామాన్ని కాలసూచక ఉపవాక్యంతో పరిచయం చేస్తుంది. తెలుగులో ప్రత్యేకంగా ‘జరిగింది’ అని చేర్చడం కంటే ‘…అప్పుడు’ నిర్మాణం సహజంగా అదే కథన కార్యాన్ని తెలియజేస్తుంది.
- source_word: הֵחֵל
  choice: మొదలైనప్పుడు
  rationale: ఇక్కడ హిఫిల్ రూపం ‘మొదలగు/ప్రారంభించు’ అనే అర్థాన్ని ఇస్తుంది.
- source_word: הָאָדָם
  choice: మనుష్యులు
  rationale: వ్యాకరణపరంగా ఏకవచనమైనా, ఈ సందర్భంలో ఇది ఆదాము అనే ఒక్క వ్యక్తిని కాక మానవ సమూహాన్ని సూచిస్తుంది; ‘మనుష్యులు’ ఆధునిక తెలుగులో ఆ సమష్టి భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: לָרֹב
  choice: విస్తరించడం
  rationale: జనాభా సంఖ్యాపరంగా పెరగడాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది; ‘అనేకులవడం’ కంటే ప్రవాహవంతంగా ఉంది.
- source_word: עַל פְּנֵי הָאֲדָמָה
  choice: నేలమీద
  rationale: ‘నేల ఉపరితలమంతట’ అనే హీబ్రూ భావచిత్రాన్ని సంక్షిప్తమైన సహజ తెలుగు ప్రయోగంతో అందిస్తుంది; אֲדָמָה యొక్క ‘నేల’ భావాన్ని కాపాడుతుంది.
- source_word: וּבָנוֹת יֻלְּדוּ לָהֶם
  choice: వారికి కుమార్తెలు పుట్టారు
  rationale: యలద్ క్రియ యొక్క కర్మణి భావాన్నీ, לָהֶם ద్వారా వ్యక్తమయ్యే సంబంధాన్నీ సహజ తెలుగులో నేరుగా తెలియజేస్తుంది.
theological_decisions:
- issue: הָאָדָם యొక్క సమష్టి మానవార్థం
  choice: మనుష్యులు
  alternative: మానవజాతి
  rationale: ఇక్కడ పదం ఒక్క పురుషుణ్ణి లేదా ప్రత్యేకంగా ఆదామును సూచించదు; సాధారణంగా మానవులను సమష్టిగా సూచిస్తుంది. ‘మనుష్యులు’ లింగపరంగా తప్పుదారి పట్టించకుండా మూలంలోని సమష్టి భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సరళమైనప్పటికీ గౌరవప్రదమైన కథన శైలి. హీబ్రూ వాక్యంలోని కొనసాగింపు భావాన్ని తెలుగు ‘…అప్పుడు’ నిర్మాణంతో సహజంగా నిలిపింది.
