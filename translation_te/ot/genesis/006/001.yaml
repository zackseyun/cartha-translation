revisions:
- from: మనుష్యులు నేలమీద విస్తరించడం మొదలైనప్పుడు, వారికి కుమార్తెలు పుట్టారు.
  to: మనుష్యులు నేలమీద సంఖ్యలో పెరగడం మొదలై, వారికి కుమార్తెలు పుట్టినప్పుడు,
  rationale: The revision preserves the collective reference to humanity, the numerical sense of population growth, and the passive birth statement. It also retains the verse's unfinished temporal construction with a final comma, so that it naturally continues into verse 2, as in the Hebrew.
  reviewer_model: gpt-5.6-terra
