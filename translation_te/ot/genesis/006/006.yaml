id: GEN.6.6
reference: Genesis 6:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּנָּ֣חֶם יְהוָ֔ה כִּֽי עָשָׂ֥ה אֶת הָֽ/אָדָ֖ם בָּ/אָ֑רֶץ וַ/יִּתְעַצֵּ֖ב אֶל לִבּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/006.yaml
  text: And Yahweh regretted having made man on the earth[c][b][a], and he was pained in his heart.
translation:
  language: te
  text: యెహోవా భూమిమీద మానవజాతిని[b] చేసినందుకు విచారించాడు[a]; ఆయన తన హృదయంలో వేదనపడ్డాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘విచారించాడు’ అనే హీబ్రూ క్రియను ‘చేసినందుకు బాధపడ్డాడు’ లేదా ‘పశ్చాత్తాపభావం పొందాడు’ అని కూడా అనువదించవచ్చు. ఈ పదం మాత్రమే దేవుడు ఆశ్చర్యపోయాడని, ముందుగా తెలియదని, లేదా నైతిక తప్పు చేశాడని చెప్పదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘మనిషిని.’ ఇక్కడ హీబ్రూ ‘ఆదామ్’ అనే పదం సమష్టిగా మానవాళిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּנָּחֶם
  choice: విచారించాడు
  rationale: నిఫాల్ రూపంలోని נחם ఇక్కడ గతంలో చేసిన కార్యాన్ని గురించి కలిగిన విచారాన్ని లేదా పశ్చాత్తాపభావాన్ని తెలియజేస్తుంది. తెలుగు ‘విచారించాడు’ ఆ భావాన్ని సహజంగా తెలియజేస్తూనే, దేవుడు నైతిక తప్పు చేశాడని గాని కొత్త సమాచారం తెలుసుకున్నాడని గాని అదనంగా సూచించదు. తరువాతి וַיִּתְעַצֵּב‌ను ‘వేదనపడ్డాడు’ అని వేరుగా అనువదించడం ద్వారా రెండు హీబ్రూ క్రియల భేదం నిలుస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన יהוהను ఆధునిక తెలుగు బైబిలు వాడుకలో సుపరిచితమైన ‘యెహోవా’గా లిప్యంతరీకరించాం.
- source_word: כִּי עָשָׂה
  choice: చేసినందుకు
  rationale: כִּי ఇక్కడ విచారానికి సంబంధించిన విషయం లేదా కారణాన్ని పరిచయం చేస్తుంది. ‘చేసినందుకు’ అనే నిర్మాణం దేవుని మునుపటి కార్యంతో ఈ విచారాన్ని సహజమైన తెలుగులో అనుసంధానిస్తుంది.
- source_word: הָאָדָם
  choice: మానవజాతిని
  rationale: ఈ సందర్భంలో אָדָם ఒక్క ఆదాము వ్యక్తిని కాక సమష్టిగా మానవాళిని సూచిస్తుంది. ‘మానవజాతిని’ ఆ సమష్టి అర్థాన్ని సందిగ్ధత లేకుండా తెలియజేస్తుంది.
- source_word: בָּאָרֶץ
  choice: భూమిమీద
  rationale: ఇక్కడ אֶרֶץ ఒక ప్రత్యేక దేశాన్ని కాక భూమిని లేదా లోకాన్ని సూచిస్తుంది; ‘భూమిమీద’ సహజమైన తెలుగు రూపం.
- source_word: וַיִּתְעַצֵּב
  choice: వేదనపడ్డాడు
  rationale: హిత్పయేల్ రూపంలోని עצב అంతరంగంలో కలిగిన బాధను సూచిస్తుంది. ‘వేదనపడ్డాడు’ ముందున్న ‘విచారించాడు’తో కలపకుండా ఆ లోతైన అంతరంగ బాధను వ్యక్తం చేస్తుంది.
- source_word: אֶל־לִבּוֹ
  choice: తన హృదయంలో
  rationale: అక్షరార్థంగా ‘తన హృదయానికి’ అయినప్పటికీ, ఈ సందర్భంలో అంతరంగ వేదనను తెలుగులో సహజంగా ‘తన హృదయంలో’ అంటారు.
theological_decisions:
- issue: దేవుని గురించి ‘విచారించాడు’, ‘వేదనపడ్డాడు’ అని చెప్పే మానవరూప భావభాష
  choice: యెహోవా మానవజాతిని చేసినందుకు విచారించి తన హృదయంలో వేదనపడ్డాడని పాఠం నేరుగా చెప్పే విధంగానే నిలుపుకోవడం
  alternative: ‘యెహోవా దుఃఖించాడు’ అని మాత్రమే చెప్పడం లేదా ‘తీర్పు విషయంలో మనసు మార్చుకున్నాడు’ అని అనువదించడం
  rationale: హీబ్రూ పాఠం దేవుని గత కార్యానికి సంబంధించిన విచారాన్ని, తరువాత అంతరంగ వేదనను రెండు వేరు క్రియలతో తెలియజేస్తుంది. ఇది దేవుని పూర్వజ్ఞానంతో ఎలా సంబంధించిందో పాఠం వివరించదు; అందువల్ల ఆ ధార్మిక ఉద్రిక్తతను అనువాదంలో తొలగించలేదు.
- issue: הָאָדָם యొక్క సమష్టి అర్థం
  choice: మానవజాతిని
  alternative: మనిషిని
  rationale: సందర్భం మొత్తం మానవాళిని గూర్చినది. ‘మానవజాతిని’ అనే రూపం హీబ్రూ పదంలోని సమష్టి సూచనను ఆధునిక తెలుగులో స్పష్టంగా అందిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన వాక్యనిర్మాణం వాడబడింది. ‘విచారించాడు’ మరియు ‘వేదనపడ్డాడు’ అనే రెండు పదాలతో మూలంలోని విచారం—అంతరంగ బాధ అనే రెండు దశలను వేరుగా నిలిపాం; ‘పశ్చాత్తాపపడ్డాడు’కు తెలుగులో ఉండగల నైతిక అపరాధార్థాన్ని ప్రధాన పాఠంలో నివారించాం.
