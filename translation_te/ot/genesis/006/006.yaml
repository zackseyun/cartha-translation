  to: యెహోవా భూమిమీద మానవజాతిని[b] చేసినందుకు విచారించాడు[a]; ఆయన తన హృదయంలో వేదనపడ్డాడు.
  rationale: స్వల్ప పదక్రమ సవరణ ద్వారా మూలంలో లేని ‘తాను’ అనే ఉద్ఘాటన తొలగించబడింది. దీనివల్ల హీబ్రూ పాఠంలోని గత కార్యాన్ని గూర్చిన విచారం మరియు హృదయాంతర వేదన అనే రెండు-క్రియా నిర్మాణం యథాతథంగా నిలుస్తుంది. గమనికను కూడా ఆధునిక, స్పష్టమైన తెలుగు ప్రయోగంతో మెరుగుపరిచాం; ధార్మిక ఉద్రిక్తతను పరిష్కరించకుండా మూలపాఠం చెప్పినదానికే పరిమితం చేశాం.
