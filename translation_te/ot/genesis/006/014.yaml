  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరతను నిలుపుతూ, సాధారణ పాఠకునికి సులభంగా అర్థమయ్యే ఆజ్ఞారూపం వాడబడింది. అరుదైన కలపపేరు లిప్యంతరీకరించబడింది; దాని అనిశ్చితి, ‘అరలు’ పదంలోని రూపకం, పూత పదార్థపు ప్రత్యామ్నాయాలు పాదసూచికల్లో పారదర్శకంగా ఇవ్వబడ్డాయి.
