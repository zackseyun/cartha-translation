source:
  edition: WLC
  text: עֲשֵׂ֤ה לְ/ךָ֙ תֵּבַ֣ת עֲצֵי גֹ֔פֶר קִנִּ֖ים תַּֽעֲשֶׂ֣ה אֶת הַ/תֵּבָ֑ה וְ/כָֽפַרְתָּ֥ אֹתָ֛/הּ מִ/בַּ֥יִת וּ/מִ/ח֖וּץ בַּ/כֹּֽפֶר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/014.yaml
  text: Make yourself an ark of gopher wood[a]; make rooms in the ark[c][b], and cover it inside and outside with pitch.
translation:
  language: te
  text: “నీ కోసం గోఫెరు కలపతో[a] ఒక ఓడను చేసుకో. ఆ ఓడలో అరలు[b] ఏర్పాటు చేసి, దానికి లోపలా బయటా తారు పూయి[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘గోఫెరు’ అనే హెబ్రీ పదం ఇక్కడ మాత్రమే కనిపిస్తుంది; అది ఏ రకమైన కలపో ఖచ్చితంగా తెలియదు. ‘సైప్రస్ కలప’ అని కూడా భావించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘విభాగాలు’ అని కూడా అనువదించవచ్చు; అక్షరార్థంగా ‘గూళ్లు.’
    reason: lexical_alternative
  - marker: c
    text: ‘దానికి లోపలా బయటా పిచ్ లేదా బిటుమెన్ పూయి’ అని కూడా అనువదించవచ్చు. పూయడం అనే క్రియకూ పూత పదార్థానికీ హెబ్రీలో పరస్పర సంబంధమున్న పదాలు వాడబడ్డాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲשֵׂה לְךָ
  choice: నీ కోసం ... చేసుకో
  rationale: ఆజ్ఞతో కూడిన לְךָ భావాన్ని సహజమైన ఆధునిక తెలుగులో ‘నీ కోసం ... చేసుకో’ అని వ్యక్తం చేస్తుంది; సందర్భానుసారంగా ‘నిర్మించు’ అనవచ్చుగానీ, మూలంలోని సాధారణ క్రియ עשהను అనవసరంగా సంకుచితం చేయదు.
- source_word: תֵּבַת
  choice: ఓడ
  rationale: תֵּבָה సాధారణ నౌకకు వాడే పదం కాకపోయినా, ఆదికాండం 6–9లో నోవహు నిర్మించిన పెద్ద జలవాహనానికి తెలుగులో స్థిరమైన, సులభంగా అర్థమయ్యే పదం ‘ఓడ’.
- source_word: עֲצֵי גֹפֶר
  choice: గోఫేరు కలప
  rationale: גֹפֶר బైబిలు హెబ్రీలో ఇక్కడ మాత్రమే కనిపిస్తుంది; చెట్టు జాతి ఖచ్చితంగా తెలియనందున ఊహాత్మకంగా ‘సరళమాను’ వంటి నిర్దిష్ట జాతిని ఎంచుకోకుండా పదాన్ని లిప్యంతరీకరించాం.
- source_word: קִנִּים
  choice: అరలు
  rationale: ఈ బహువచన పదానికి అక్షరార్థంగా ‘గూళ్లు’ అనే సంబంధం ఉంది; ఇక్కడ ఓడలో విభజించి చేసిన అంతర్గత స్థలాలను సూచిస్తుంది. ‘అరలు’ సాధారణ పాఠకునికి సహజంగా ఉండి, ‘గదులు’ కంటే చిన్న విభాగాల భావాన్ని మెరుగ్గా ఇస్తుంది.
- source_word: תַּעֲשֶׂה אֶת־הַתֵּבָה
  choice: ఆ ఓడలో అరలు ఏర్పాటు చేసి
  rationale: హెబ్రీ వాక్యనిర్మాణం అక్షరాలా ‘గూళ్లుగా/అరలుగా ఓడను చేయాలి’ అన్నట్లుంది. తెలుగులో ఉద్దేశం స్పష్టంగా ఉండేందుకు స్వల్పంగా పునర్వ్యవస్థీకరించబడింది.
- source_word: וְכָפַרְתָּ ... בַּכֹּפֶר
  choice: తారు పూయి
  rationale: ఈ అకర్మకేతర సందర్భంలో כפר పూత పూయడం లేదా కప్పడం అనే భావాన్ని, כֹּפֶר నీరు చొరబడకుండా చేసే పూత పదార్థాన్ని సూచిస్తాయి. ‘తారు పూయి’ సహజమైన తెలుగు; పదార్థపు ఖచ్చిత స్వరూపంపై ఉన్న అనిశ్చితిని పాదసూచికలో ఉంచాం.
- source_word: מִבַּיִת וּמִחוּץ
  choice: లోపలా బయటా
  rationale: ఓడ అంతర్గత, బాహ్య ఉపరితలాలు రెండింటినీ పూతతో కప్పాలని చెప్పే జత పదబంధానికి ఇది సహజమైన ఆధునిక తెలుగు రూపం.
