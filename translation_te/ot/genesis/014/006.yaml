  yaml_path: translation/ot/genesis/014/006.yaml
  text: and the Horites in their hill country of Seir[a], as far as El-paran, which is by the wilderness.
translation:
  language: te
  text: శేయీరు కొండప్రాంతంలో ఉన్న హోరీయులను ఓడించి, అరణ్యానికి ఆనుకుని ఉన్న ఏల్-పారాను[a] వరకు వెళ్లారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఏల్ పారాను”; దీనిని స్థిరమైన స్థలనామంగా కాక వ్యుత్పత్తి ప్రకారం అర్థం చేసుకుంటే, “పారాను యొక్క ఓకు/తెరెబింతు చెట్టు” అని కూడా కావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת
  choice: హోరీయులను ... ఓడిస్తూ
  rationale: ఇది ముందటి వచనంలో ఉన్న క్రియకు కొనసాగింపుగా, మరొక కర్మను సూచిస్తుంది. తెలుగు వాక్యం స్వతంత్రంగా సహజంగా ఉండేందుకు సందర్భంలోని ‘ఓడించారు’ అనే భావాన్ని అందించాం.
- source_word: הַחֹרִי
  choice: హోరీయులను
  rationale: ఇది హోరీయులుగా ప్రసిద్ధి చెందిన ప్రజలను సూచించే సామూహిక జాతినామం.
- source_word: בְּהַרְרָם
  choice: వారి కొండప్రాంతమైన
  rationale: అక్షరార్థంగా ‘వారి కొండలలో’; ఒక ప్రజలు నివసించే పర్వత ప్రాంతాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేయడానికి ‘వారి కొండప్రాంతం’ అని ఇచ్చాం.
- source_word: שֵׂעִיר
  choice: శేయీరు
  rationale: ఇది స్థలనామం. ‘వారి కొండప్రాంతమైన శేయీరు’ అనే నిర్మాణం హీబ్రూ పదబంధంలోని అనుబంధాన్ని సహజంగా ప్రతిబింబిస్తుంది.
- source_word: עַד
  choice: వరకు
  rationale: దండయాత్ర చేరిన భౌగోళిక హద్దును స్పష్టంగా సూచిస్తుంది.
- source_word: אֵיל פָּארָן
  choice: ఏల్-పారాను
  rationale: ఇది స్థిరమైన స్థలనామంగా లిప్యంతరీకరించబడింది. אֵיל అనే పదానికి పెద్ద చెట్టు లేదా మస్తకి చెట్టు అనే వ్యుత్పత్తి అర్థం ఉండవచ్చు; దానిని ప్రధాన పాఠ్యంలో నిర్బంధంగా నిర్ణయించలేదు.
- source_word: אֲשֶׁר עַל הַמִּדְבָּר
  choice: అరణ్యం పక్కన ఉన్న
  rationale: ఏల్-పారాను భౌగోళికంగా ఎక్కడ ఉందో తెలిపే సంబంధ వాక్యం. עַל ఇక్కడ కలిగిన విస్తృత స్థానార్థాన్ని ‘పక్కన’ సహజంగా తెలియజేస్తుంది.
