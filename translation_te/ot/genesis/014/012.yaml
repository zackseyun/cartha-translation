id: GEN.14.12
reference: Genesis 14:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּקְח֨וּ אֶת ל֧וֹט וְ/אֶת רְכֻשׁ֛/וֹ בֶּן אֲחִ֥י אַבְרָ֖ם וַ/יֵּלֵ֑כוּ וְ/ה֥וּא יֹשֵׁ֖ב בִּ/סְדֹֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/012.yaml
  text: They took Lot[a], Abram’s nephew, and his possessions, and went away[b]. Now he was dwelling in Sodom.
translation:
  language: te
  text: వారు అబ్రాము సోదరుని కుమారుడైన లోతును[a], అతని ఆస్తిని తీసుకొని వెళ్లిపోయారు. అతడు సొదొమలో నివసిస్తూ ఉన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అంటే, లోతు అబ్రాము మేనల్లుడు.
    reason: మూల హీబ్రూ బంధుత్వ పదబంధానికి ఆధునిక తెలుగు వివరణ.
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: వారు తీసుకొని
  rationale: לקח అనే సాధారణ క్రియకు ‘తీసుకొను’ సరైన సమానార్థకం. దోపిడీ సందర్భం ఉన్నప్పటికీ, మూలపదం స్వయంగా సూచించని బలవంతపు భావాన్ని ‘పట్టుకొన్నారు’ వంటి పదంతో చేర్చలేదు.
- source_word: רְכֻשׁוֹ
  choice: అతని ఆస్తిని
  rationale: רְכוּשׁ అనేది వ్యక్తికి చెందిన సంపద లేదా సొత్తును సూచిస్తుంది; ‘ఆస్తి’ ఆధునిక తెలుగులో సహజంగా, స్పష్టంగా ఉంది.
- source_word: בֶּן אֲחִי אַבְרָם
  choice: అబ్రాము సోదరుని కుమారుడైన
  rationale: మూలంలోని బంధుత్వ వ్యక్తీకరణను నేరుగా నిలుపుతూ, తెలుగులో లోతును విశేషించే సహజమైన రూపంగా ఇచ్చాం.
- source_word: וַיֵּלֵכוּ
  choice: వెళ్లిపోయారు
  rationale: הלך యొక్క సాధారణ ‘వెళ్లారు’ భావానికి, ఈ సందర్భంలో అక్కడి నుంచి బయలుదేరిన భావాన్ని సహజంగా తెలిపే ‘వెళ్లిపోయారు’ సరిపోతుంది.
- source_word: וְהוּא יֹשֵׁב בִּסְדֹם
  choice: అతడు సొదొమలో నివసిస్తూ ఉన్నాడు
  rationale: ఈ ఉపవాక్యం లోతు ఎక్కడ నివసించేవాడో నేపథ్యంగా వివరిస్తుంది; కొనసాగుతున్న నివాసాన్ని ‘నివసిస్తూ ఉన్నాడు’ స్పష్టంగా తెలియజేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే కథన శైలి. మూలంలోని ‘అబ్రాము సోదరుని కుమారుడు’ అనే బంధుత్వ నిర్మాణాన్ని ప్రధాన పాఠ్యంలో నిలిపి, సహజమైన సంక్షిప్త బంధుత్వ పదాన్ని పాదసూచికలో ఇచ్చాం.
