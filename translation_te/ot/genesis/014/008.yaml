id: GEN.14.8
reference: Genesis 14:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֵּצֵ֨א מֶֽלֶךְ סְדֹ֜ם וּ/מֶ֣לֶךְ עֲמֹרָ֗ה וּ/מֶ֤לֶךְ אַדְמָה֙ וּ/מֶ֣לֶךְ צביים וּ/מֶ֥לֶךְ בֶּ֖לַע הִוא צֹ֑עַר וַ/יַּֽעַרְכ֤וּ אִתָּ/ם֙ מִלְחָמָ֔ה בְּ/עֵ֖מֶק הַ/שִּׂדִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/008.yaml
  text: Then the king of Sodom[a], the king of Gomorrah, the king of Admah, the king of Zeboiim, and the king of Bela (that is, Zoar) went out, and they drew up for battle with them in the Valley of Siddim.
translation:
  language: te
  text: అప్పుడు సొదొము రాజు, గొమొర్రా రాజు, అద్మా రాజు, సెబోయీము రాజు, బెలా రాజు (అదే సోయరు) బయలుదేరి, సిద్దీము లోయలో వారితో[a] యుద్ధానికి బారులు తీర్చారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారికి వ్యతిరేకంగా యుద్ధానికి.” హెబ్రీలో ఈ వ్యక్తీకరణ అక్షరార్థంగా “వారితో యుద్ధం” అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: అప్పుడు ... బయలుదేరి
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది; ఏకవచన క్రియ తరువాత రాజుల సంయుక్త జాబితా రావడంతో తెలుగులో సహజంగా వారందరి చర్యగా వ్యక్తం చేశాం.
- source_word: מֶלֶךְ
  choice: రాజు
  rationale: ప్రతి పట్టణ పాలకునికి వాడిన సాధారణ బిరుదును హెబ్రీ పునరుక్తికి అనుగుణంగా ప్రతి పేరుతో పునరావృతం చేశాం.
- source_word: סְדֹם / עֲמֹרָה / אַדְמָה / צביים
  choice: సొదొము / గొమొర్రా / అద్మా / సెబోయీము
  rationale: స్థలనామాలను ఆధునిక ప్రామాణిక తెలుగు బైబిలు శైలికి తగిన లిప్యంతరీకరణలుగా ఇచ్చాం.
- source_word: בֶּלַע הִוא צֹעַר
  choice: బెల రాజు (బెల అంటే సోయరు)
  rationale: బెల అనే స్థలమే సోయరు అని తెలిపే వివరణాత్మక సమానాధికార వాక్యభాగాన్ని కుండలీకరణలో స్పష్టంగా నిలిపాం.
- source_word: וַיַּעַרְכוּ ... מִלְחָמָה
  choice: యుద్ధానికి బారులు తీర్చారు
  rationale: సైనిక సందర్భంలో ערך దళాలను యుద్ధక్రమంలో అమర్చడాన్ని సూచిస్తుంది; ‘బారులు తీర్చారు’ ఆ భావాన్ని సహజమైన, గంభీరమైన తెలుగులో నిలుపుతుంది.
- source_word: אִתָּם
  choice: వారితో
  rationale: את అనే పూర్వప్రత్యయపు ప్రాథమిక ‘తో’ భావాన్ని నిలిపి, శత్రుత్వ భావాన్ని ‘యుద్ధానికి’ అనే సందర్భం ద్వారా పాఠకుడు గ్రహించేలా చేశాం; ‘వారికి వ్యతిరేకంగా’ అనేది సాధ్యమైన వివరణాత్మక ప్రత్యామ్నాయం.
- source_word: בְּעֵמֶק הַשִּׂדִּים
  choice: సిద్దీము లోయలో
  rationale: עֵמֶקను ఆధునిక తెలుగులో సహజమైన ‘లోయ’గా అనువదించి, సిద్దీము అనే స్థలనామాన్ని లిప్యంతరీకరించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీర కథనశైలి. రాజుల జాబితాలోని హెబ్రీ పునరుక్తిని నిలిపి, సైనిక పదబంధాన్ని సహజంగా వ్యక్తం చేశాం.
