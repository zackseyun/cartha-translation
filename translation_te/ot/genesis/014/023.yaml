source:
  edition: WLC
  text: אִם מִ/חוּט֙ וְ/עַ֣ד שְׂרֽוֹךְ נַ֔עַל וְ/אִם אֶקַּ֖ח מִ/כָּל אֲשֶׁר לָ֑/ךְ וְ/לֹ֣א תֹאמַ֔ר אֲנִ֖י הֶעֱשַׁ֥רְתִּי אֶת אַבְרָֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/023.yaml
  text: that I would not take from a thread to a sandal strap[a], or anything that is yours, lest you say, ‘I have made Abram rich.’
translation:
  language: te
  text: దారం మొదలుకొని చెప్పు పట్టీ వరకైనా, నీకు చెందిన దేనినైనా నేను తీసుకోను[a]—‘నేనే అబ్రామును ధనవంతుణ్ణి చేశాను’ అని నీవు అనకుండా ఉండటానికి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ఇది సంక్షిప్త ప్రమాణ సూత్రం. పదక్షరంగా, “ఒకవేళ దారం మొదలుకొని చెప్పు పట్టీ వరకు, మరియు నీకు చెందిన దేనినైనా నేను తీసుకుంటే...” అని ఉంటుంది; భావం మాత్రం ప్రమాణపూర్వక నిరాకరణ.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם ... וְאִם
  choice: నేను తీసుకోను
  rationale: మునుపటి వచనంలోని ప్రమాణ సందర్భంలో ఇది సాధారణ షరతు కాదు; పలకకుండా వదిలిన శాపభాగం గల ప్రమాణ సూత్రం. అందువల్ల తెలుగు పాఠకునికి అర్థమయ్యేలా ప్రమాణపూర్వక నిరాకరణను స్పష్టంగా వ్యక్తం చేశాం.
- source_word: מִחוּט
  choice: దారం మొదలుకొని
  rationale: חוּט అంటే దారం లేదా సన్నని తాడు. מִן యొక్క ఆరంభబిందు భావాన్ని తదుపరి וְעַד తో కలిపి సహజ తెలుగులో నిలిపాం.
- source_word: וְעַד שְׂרֹוךְ נַעַל
  choice: చెప్పుల పట్టీ వరకైనా
  rationale: שְׂרוֹךְ נַעַל అనేది పాదరక్షను బిగించే పట్టీ. ప్రాచీన సందర్భాన్ని నిలుపుతూ ఆధునిక తెలుగులో సులభంగా అర్థమయ్యే రూపాన్ని ఎంచుకున్నాం.
- source_word: אֶקַּח
  choice: నేను తీసుకోను
  rationale: ప్రమాణ సూత్రంలోని సూచిత నిషేధాన్ని తెలుగులో సహజంగా వ్యక్తం చేయడానికి సూటి భవిష్యత్ నిరాకరణ వాడాం.
- source_word: מִכָּל אֲשֶׁר לָךְ
  choice: నీకు చెందిన దేనినైనా
  rationale: כָּל యొక్క సమగ్రతను, לָךְ యొక్క స్వామ్య భావాన్ని సహజ తెలుగులో కాపాడుతుంది.
- source_word: וְלֹא תֹאמַר
  choice: నీవు అనకుండా ఉండటానికి
  rationale: అబ్రాము నిరాకరణ వెనుకనున్న ప్రతికూల ఉద్దేశాన్ని ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: הֶעֱשַׁרְתִּי
  choice: ధనవంతుణ్ణి చేశాను
  rationale: עשר హిఫిల్ రూపంలోని ‘ధనవంతునిగా చేయడం’ అనే కారక భావాన్ని నేరుగా నిలుపుతుంది.
- source_word: אַבְרָם
  choice: అబ్రాము
  rationale: తెలుగు బైబిలు వినియోగంలో స్థిరపడిన వ్యక్తినామ రూపం.
theological_decisions:
- issue: సంక్షిప్త ప్రమాణ సూత్రం
  choice: సూచిత శాపభాగాన్ని చేర్చకుండా, ప్రమాణపూర్వక నిరాకరణగా ‘నేను తీసుకోను’ అని అనువదించడం
  alternative: ‘ఒకవేళ దారం మొదలుకొని... ఒకవేళ నేను తీసుకుంటే...’ అని పదక్షర షరతుగా ఉంచడం
  rationale: హీబ్రూ אִם ప్రమాణ సందర్భంలో నిరాకరణను సూచిస్తుంది; మునుపటి వచనంలో చేయి ఎత్తిన చర్య దీనిని నిర్ధారిస్తుంది. తెలుగులో పదక్షర షరతు అసంపూర్ణంగా, తప్పుదారి పట్టించేలా ఉంటుంది.
- issue: నిరాకరణ యొక్క ఉద్దేశం
  choice: ‘నేనే అబ్రామును ధనవంతుణ్ణి చేశాను’ అని రాజు చెప్పకుండా ఉండటమే కారణమని చూపడం
  alternative: దీనిని కేవలం తరువాతి ఫలితంగా అనువదించడం
  rationale: וְלֹא תֹאמַר సందర్భంలో ప్రతికూల ఉద్దేశం లేదా నివారించదలచిన ఫలితాన్ని సూచిస్తుంది; రెండింటి మధ్య స్వల్ప భావసందిగ్ధతను తెలుగు నిర్మాణం అతిగా సిద్ధాంతీకరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరతను నిలుపుతూ సాధారణ పాఠకునికి స్పష్టంగా ఉండే నిర్మాణం. ‘చెప్పుల పట్టీ’ ప్రాచీన పాదరక్ష సందర్భాన్ని సహజంగా తెలియజేస్తుంది. ప్రధాన పాఠంలోని [a] సూచిక పాదటిప్పణితో సరిపోలుతుంది.
