id: GEN.14.18
reference: Genesis 14:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/מַלְכִּי צֶ֨דֶק֙ מֶ֣לֶךְ שָׁלֵ֔ם הוֹצִ֖יא לֶ֣חֶם וָ/יָ֑יִן וְ/ה֥וּא כֹהֵ֖ן לְ/אֵ֥ל עֶלְיֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/018.yaml
  text: And Melchizedek king of Salem brought out bread and wine[b][a]. He was a priest of God Most High.
translation:
  language: te
  text: షాలేము రాజైన మెల్కీసెదెకు రొట్టెను, ద్రాక్షారసాన్ని బయటకు తీసుకొచ్చాడు.[a] అతడు సర్వోన్నతుడైన దేవుని యాజకుడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘రొట్టెను, ద్రాక్షారసాన్ని తీసుకొచ్చాడు.’
    reason: హెబ్రీ క్రియకు ‘బయటకు తీసుకొచ్చాడు’ అనే స్పష్టమైన భావంతో పాటు సందర్భానుసారంగా సాధారణ ‘తీసుకొచ్చాడు’ అనే అనువాదం కూడా సాధ్యమని తెలియజేయడానికి.
  - marker: b
    text: 'హెబ్రీ: ‘ఏల్ ఎల్యోన్’; అంటే ‘సర్వోన్నతుడైన దేవుడు.’'
    reason: మూలంలోని దైవ designation ను, దాని అనువాదార్థాన్ని తెలియజేయడానికి.
lexical_decisions:
- source_word: מַלְכִּי צֶדֶק
  choice: మెల్కీసెదెకు
  rationale: వ్యక్తి పేరును అనువదించకుండా, తెలుగులో స్థిరపడిన బైబిలు రూపానికి అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: מֶלֶךְ שָׁלֵם
  choice: షాలేము రాజు
  rationale: מֶלֶךְ కు సహజమైన తెలుగు పదం ‘రాజు’; స్థలనామమైన שָׁלֵם ను ‘షాలేము’గా లిప్యంతరీకరించాం.
- source_word: הוֹצִיא
  choice: బయటకు తీసుకొచ్చాడు
  rationale: హిఫీల్ రూపంలోని ‘బయటకు వచ్చేలా చేయడం/బయటకు తీసుకురావడం’ అనే స్పష్టమైన చర్యను సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: לֶחֶם
  choice: రొట్టె
  rationale: ఈ సందర్భంలో సాధారణ ఆహారం అనే విస్తృతార్థం కంటే నిర్దిష్టమైన ‘రొట్టె’ భావమే తగినది.
- source_word: יָיִן
  choice: ద్రాక్షారసం
  rationale: ద్రాక్షతో చేసిన మద్యపానీయాన్ని సూచించే పదానికి తెలుగులో సుపరిచితమైన బైబిలు పదాన్ని వాడాం; దాని స్వభావాన్ని మృదువుగా మార్చలేదు.
- source_word: כֹהֵן
  choice: యాజకుడు
  rationale: ఆరాధనా సేవకుని పదవిని సూచించే ప్రామాణిక తెలుగు పదం; తరువాతి ఇశ్రాయేలీయ యాజక వ్యవస్థకు చెందిన అదనపు భావాలను చేర్చదు.
- source_word: אֵל עֶלְיוֹן
  choice: సర్వోన్నతుడైన దేవుడు
  rationale: దైవ బిరుదును అపారదర్శకంగా లిప్యంతరీకరించకుండా అర్థవంతంగా అనువదించాం; עֶלְיוֹן లోని అత్యున్నత స్థానం భావాన్ని ‘సర్వోన్నతుడు’ తెలియజేస్తుంది.
- source_word: וְהוּא
  choice: అతడు
  rationale: కొత్త వాక్యంగా సహజంగా చదివేలా చేసి, మెల్కీసెదెకు గుర్తింపుపై ఉన్న హెబ్రీ వాక్యపు దృష్టిని నిలిపాం.
theological_decisions:
- issue: రొట్టె, ద్రాక్షారసం ప్రస్తావనలో తరువాతి సంస్కార సంబంధ భావాలను ముందుకు తేవాలా
  choice: చారిత్రక చర్యను మాత్రమే సరళంగా పేర్కొనడం
  alternative: ప్రభుభోజనం లేదా యూకరిస్టును ముందుగా సూచించేలా వ్యాఖ్యానాత్మక పదజాలం చేర్చడం
  rationale: ఆదికాండము 14:18 అతడు వాటిని తీసుకొచ్చాడని మాత్రమే చెబుతుంది. తరువాతి ధార్మిక వ్యాఖ్యానాన్ని మూల వాక్యంలోకి దిగుమతి చేయకుండా దాని ఉద్వేగాన్ని అలాగే ఉంచాం.
- issue: אֵל עֶלְיוֹן ను ‘ఏల్ ఎల్యోన్’ అనే పేరుగా ఉంచాలా, బిరుదుగా అనువదించాలా
  choice: సర్వోన్నతుడైన దేవుడు
  alternative: ఏల్ ఎల్యోన్
  rationale: ఇక్కడ ఈ పదబంధం దైవ designation/బిరుదుగా పనిచేస్తుంది. దాని అర్థాన్ని సాధారణ తెలుగు పాఠకునికి స్పష్టంగా తెలియజేస్తూ, అది నిర్దిష్ట దేవుని పేరు మాత్రమే అన్న నిర్ణయాన్ని బలవంతంగా రుద్దకుండా అనువదించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదంగా, సాధారణ పాఠకులకు సులభంగా ఉండే వాక్య నిర్మాణం. ‘మెల్కీసెదెకు,’ ‘షాలేము,’ ‘యాజకుడు’ వంటి స్థిరమైన బైబిలు పదరూపాలను వాడుతూ, మూలంలోని సంక్షిప్తతను కాపాడాం. ప్రతి పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో చేర్చబడింది.
