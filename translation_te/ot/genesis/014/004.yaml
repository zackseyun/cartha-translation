  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: שְׁתֵּ֤ים עֶשְׂרֵה֙ שָׁנָ֔ה עָבְד֖וּ אֶת כְּדָרְלָעֹ֑מֶר וּ/שְׁלֹשׁ עֶשְׂרֵ֥ה שָׁנָ֖ה מָרָֽדוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/004.yaml
  text: For twelve years they had served Kedorlaomer[a], but in the thirteenth year they rebelled.
translation:
  language: te
  text: పన్నెండు సంవత్సరాలు వారు కెదొర్లాయోమెరుకు లోబడి సేవ చేశారు; పదమూడవ సంవత్సరంలో వారు తిరుగుబాటు చేశారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׁתֵּים עֶשְׂרֵה שָׁנָה
  choice: పన్నెండు సంవత్సరాలు
  rationale: హీబ్రూ కాలవ్యవధిని నేరుగా తెలుపుతుంది; తెలుగులో ఈ రూపం సహజంగా ఉంది.
- source_word: עָבְדוּ
  choice: లోబడి సేవచేశారు
  rationale: עבד సాధారణంగా ‘సేవచేయు’ అని అర్థమిచ్చినా, ఇక్కడ రాజుకు సామంతులుగా లోబడిన రాజకీయ సంబంధాన్ని సూచిస్తుంది. ‘లోబడి సేవచేశారు’ అనే రూపం సేవ మరియు అధీనత అనే రెండు భావాలనూ నిలుపుతుంది.
- source_word: אֶת כְּדָרְלָעֹמֶר
  choice: కెదొర్లాయోమెరుకు
  rationale: వ్యక్తి పేరును హీబ్రూ ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించి, సేవకు గ్రహీతను చూపేందుకు తెలుగు చతుర్థీ విభక్తి చేర్చబడింది.
- source_word: וּשְׁלֹשׁ עֶשְׂרֵה שָׁנָה
  choice: పదమూడవ సంవత్సరంలో
  rationale: పదక్షరార్థంగా ‘మరియు పదమూడు సంవత్సరం’; సందర్భంలో ఇది పన్నెండేళ్ల అధీన సేవ తరువాత వచ్చిన పదమూడవ సంవత్సరాన్ని సూచిస్తుంది. తెలుగు కాలసూచక రూపం ఆ భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: מָרָדוּ
  choice: తిరుగుబాటు చేశారు
  rationale: מרד రాజకీయ అధికారానికి వ్యతిరేకంగా తిరుగుబాటు చేయడాన్ని సూచిస్తుంది; ఆధునిక ప్రామాణిక తెలుగులో ఇదే సహజమైన పదబంధం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే గౌరవప్రదమైన కథన శైలి. మూలంలోని రాజకీయ అధీనతను అతిగా వ్యాఖ్యానించకుండా స్పష్టం చేయడానికి ‘లోబడి సేవచేశారు’ వాడబడింది.
