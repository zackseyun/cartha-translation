  source_fidelity: హీబ్రూ వచనంలోని యుద్ధక్రియ, ఐదుగురు ప్రత్యర్థి రాజుల జాబితా, అలాగే బెలా సోయరు అనే గుర్తింపును ముసాయిదా మొత్తం నిలుపుతుంది. అయితే ప్రత్యర్థి భావానికి ‘తో’ వాడకం తెలుగులో యుద్ధంలో కలిసి ఉన్నారనే అర్థాన్నీ కలిగించగలదు. ‘పై’ ఈ సందర్భంలో మూలంలోని adversative సంబంధాన్ని స్పష్టంగా తెలియజేస్తుంది.
  naturalness: పేర్లన్నిటికీ సమాంతరంగా ‘రాజైన …పై’ నిర్మాణం ఆధునిక ప్రామాణిక తెలుగులో స్పష్టంగా, సహజంగా ఉంటుంది. ‘బెలా (అంటే సోయరు) రాజు’ అనే నిర్మాణం బెలా/సోయరు నగరాల గుర్తింపేనని చూపిస్తుంది; సోయరు రాజు వ్యక్తిపేరు అన్న అపార్థాన్ని తొలగిస్తుంది.
