id: GEN.14.2
reference: Genesis 14:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: עָשׂ֣וּ מִלְחָמָ֗ה אֶת בֶּ֨רַע֙ מֶ֣לֶךְ סְדֹ֔ם וְ/אֶת בִּרְשַׁ֖ע מֶ֣לֶךְ עֲמֹרָ֑ה שִׁנְאָ֣ב מֶ֣לֶךְ אַדְמָ֗ה וְ/שֶׁמְאֵ֨בֶר֙ מֶ֣לֶךְ צביים וּ/מֶ֥לֶךְ בֶּ֖לַע הִיא צֹֽעַר־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/002.yaml
  text: they made war against Bera king of Sodom[a], Birsha king of Gomorrah, Shinab king of Admah, Shemeber king of Zeboiim, and the king of Bela (that is[c][b], Zoar).
translation:
  language: te
  text: వారు సొదొము రాజైన బెరాపై, గొమొర్రా రాజైన బిర్షాపై, అద్మా రాజైన షినాబుపై, సెబోయీము రాజైన షెమేబెరుపై, బెలా (అంటే సోయరు) రాజుపై యుద్ధం చేశారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עָשׂוּ מִלְחָמָה
  choice: యుద్ధం చేశారు
  rationale: హీబ్రూ పదబంధంలోని ‘యుద్ధం చేయడం’ అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో నేరుగా వ్యక్తపరుస్తుంది.
- source_word: אֶת ... וְאֶת
  choice: …తో
  rationale: ఈ సందర్భంలో యుద్ధం ఎవరికి ఎదిరిగా జరిగిందో తెలుగులో సహజంగా తెలియజేయడానికి రాజుల పేర్లకు ‘తో’ విభక్తిని వాడాం; జాబితాలోని వారందరూ యుద్ధానికి ప్రత్యర్థులేనని వాక్య నిర్మాణం స్పష్టం చేస్తుంది.
- source_word: בֶּרַע
  choice: బెరా
  rationale: వ్యక్తి పేరును హీబ్రూ ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించాం.
- source_word: מֶלֶךְ סְדֹם
  choice: సొదొము రాజు
  rationale: సంబంధ నిర్మాణాన్ని తెలుగులో సహజమైన స్థలనామం + రాజు రూపంలో ఇచ్చాం.
- source_word: בִּרְשַׁע
  choice: బిర్షా
  rationale: వ్యక్తి పేరును లిప్యంతరీకరించాం.
- source_word: עֲמֹרָה
  choice: గొమొర్రా
  rationale: తెలుగు బైబిలు వాడుకకు సుపరిచితంగా ఉండే రూపాన్ని, మూల ఉచ్చారణతో తగిన సమీపతను ఉంచి ఉపయోగించాం.
- source_word: שִׁנְאָב
  choice: షినాబు
  rationale: వ్యక్తి పేరును తెలుగు ధ్వని విధానానికి అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: אַדְמָה
  choice: అద్మా
  rationale: స్థలనామాన్ని మూల రూపానికి దగ్గరగా లిప్యంతరీకరించాం.
- source_word: שֶׁמְאֵבֶר
  choice: షెమేబెరు
  rationale: వ్యక్తి పేరును మూల హీబ్రూ రూపానికి దగ్గరగా లిప్యంతరీకరించాం.
- source_word: צביים
  choice: సెబోయీము
  rationale: హీబ్రూ వ్యంజన, స్వర రూపాన్ని తెలుగులో స్పష్టంగా ప్రతిబింబించే లిప్యంతరీకరణ.
- source_word: מֶלֶךְ בֶּלַע
  choice: బెల రాజు
  rationale: చివరి వ్యక్తికి స్వపేరు ఇవ్వబడలేదు; అతణ్ని నగర రాజుగా మాత్రమే మూలం గుర్తిస్తున్నందున అదే నిర్మాణాన్ని నిలిపాం.
- source_word: הִיא צֹעַר
  choice: అంటే సోయరు
  rationale: బెల అనే స్థలమే సోయరు అని గుర్తించే మూలంలోని వివరణాత్మక భావాన్ని సహజ తెలుగులో అందిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి. హీబ్రూలో కర్మసూచకం మొదటి రెండు పేర్ల ముందు మాత్రమే ఉన్నప్పటికీ, సందర్భానుసారం ఐదుగురు రాజులందరినీ ఒకే ప్రత్యర్థుల జాబితాగా తెలుగులో స్పష్టంగా నిర్మించాం. ‘బెల రాజు—అంటే సోయరు రాజు’ అని చెప్పడం ద్వారా ‘సోయరు’ రాజు పేరు అన్న అపార్థం కలగవచ్చు కాబట్టి, ప్రధాన పాఠ్యంలో ‘బెల రాజుతో—అంటే సోయరు రాజుతో’ అని నగర సమానత్వాన్ని రాజు బిరుదులో సహజంగా ప్రతిబింబించాం.
