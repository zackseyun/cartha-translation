  yaml_path: translation/ot/genesis/014/021.yaml
  text: Then the king of Sodom said to Abram[a], “Give me the people[b], and take the possessions for yourself.”
translation:
  language: te
  text: అప్పుడు సొదొమ రాజు అబ్రాముతో ఇలా అన్నాడు, “మనుషులను నాకు ఇవ్వు[a]; ఆస్తిని తీసుకో[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా ‘ప్రాణాన్ని’ అని ఏకవచనంలో ఉంది; ఇక్కడ అది సమష్టిగా మనుషులను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘ఆస్తిని’ అనే పదాన్ని ‘సొత్తును’ లేదా ‘వస్తువులను’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... అన్నాడు
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది; ఆధునిక తెలుగులో ‘అప్పుడు’ క్రమాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: מֶלֶךְ סְדֹם
  choice: సొదొమ రాజు
  rationale: హీబ్రూ నిర్మిత పదబంధాన్ని తెలుగులో సహజమైన సంబంధ నిర్మాణంతో అనువదించాం.
- source_word: אֶל אַבְרָם
  choice: అబ్రాముతో
  rationale: మాట్లాడటాన్ని సూచించే సందర్భంలో אֶל‌ను తెలుగులో సహజంగా ‘తో’ అని వ్యక్తపరచాం.
- source_word: תֶּן לִי
  choice: నాకు అప్పగించు
  rationale: తిరిగి సంపాదించిన మనుషులను రాజుకు ఇవ్వాలనే సందర్భంలో ‘అప్పగించు’ స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: הַנֶּפֶשׁ
  choice: మనుషులను
  rationale: నֶפֶשׁ ఏకవచన రూపంలో ఉన్నా ఇక్కడ సమష్టిగా తిరిగి సంపాదించిన వ్యక్తులను సూచిస్తుంది; ‘ఆత్మ’ అనే అక్షరార్థం సందర్భాన్ని తప్పుదోవ పట్టించవచ్చు.
- source_word: וְהָרְכֻשׁ
  choice: ఆస్తిని
  rationale: רְכוּשׁ చరాస్తి, సామగ్రి, సొత్తు అనే పరిధిని కలిగి ఉంది; ‘ఆస్తి’ మనుషులకు విరుద్ధంగా ఉన్న సంపదను సహజంగా సూచిస్తుంది.
- source_word: קַח לָךְ
  choice: నువ్వే తీసుకో
  rationale: לָךְలోని వ్యక్తిగత ప్రయోజన భావాన్ని తెలుగు ఉద్ఘాటక ‘ఏ’ సహజంగా వ్యక్తపరుస్తుంది.
