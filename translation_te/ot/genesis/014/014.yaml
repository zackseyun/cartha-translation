  source_fidelity: 'మూల హెబ్రీ భావం మొత్తంగా సరిగానే ప్రతిఫలించింది: చెరగా పట్టబడటం, אָחִיו అనే ఉపరితల బంధుత్వ పదం, వివాదాస్పదమైన וַיָּרֶק‌కు ‘సమీకరించు’ అనే జాగ్రత్తైన ఎంపిక, ఇంట పుట్టిన శిక్షణ పొందినవారు, సంఖ్య, దాను వరకు వెంబడింపు అన్నీ నిలిచాయి. అయితే ‘తన ఇంట పుట్టిన శిక్షణ పొందిన తన మనుషులను—మూడువందల పద్దెనిమిది మందిని—’ అనే నిర్మాణం తెలుగులో పునరుక్తి మరియు వాక్యనిర్మాణ అస్పష్టతను కలిగిస్తుంది.'
  naturalness: ఆధునిక ప్రామాణిక తెలుగులో సంఖ్యను నామవాచకంతో నేరుగా కలిపి ‘తన ఇంట పుట్టి శిక్షణ పొందిన మూడు వందల పద్దెనిమిది మంది మనుషులను’ అని చెప్పడం సహజం. దీనివల్ల ‘తన’ అనే అనవసర పునరుక్తి తొలగి, సంఖ్య ఎవరిని సూచిస్తుందో స్పష్టమవుతుంది.
  terminology: ‘చెరపట్టబడ్డాడు,’ ‘సోదరుడు,’ ‘సమీకరించి,’ ‘వెంబడించాడు’ సరైన, గంభీరమైన ఆధునిక పదాలు. אָחִיו కోసం ప్రధాన పాఠంలో ‘సోదరుడు’ ఉంచి, విస్తృత బంధుత్వార్థాన్ని పాదసూచికలో ఇవ్వడం మూలపాఠానికి విశ్వసనీయంగా ఉంది. పాదసూచికలో లోతు సంబంధాన్ని పదార్థార్థంగా కాక సందర్భానుసార సమాచారంగా కొంచెం స్పష్టంగా చెప్పాలి.
