id: GEN.14.14
reference: Genesis 14:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּשְׁמַ֣ע אַבְרָ֔ם כִּ֥י נִשְׁבָּ֖ה אָחִ֑י/ו וַ/יָּ֨רֶק אֶת חֲנִיכָ֜י/ו יְלִידֵ֣י בֵית֗/וֹ שְׁמֹנָ֤ה עָשָׂר֙ וּ/שְׁלֹ֣שׁ מֵא֔וֹת וַ/יִּרְדֹּ֖ף עַד דָּֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/014.yaml
  text: When Abram heard that his kinsman had been taken captive[a], he led out his trained men, born in his household, three hundred and eighteen[b], and pursued them as far as Dan.
translation:
  language: te
  text: అబ్రాము తన సోదరుడు[a] చెరపట్టబడ్డాడని విన్నప్పుడు, తన ఇంట పుట్టి శిక్షణ పొందిన మూడు వందల పద్దెనిమిది మంది మనుషులను సమీకరించి[b], దాను వరకు వారిని వెంబడించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీలో ‘అతని సోదరుడు.’ ఈ పదం సమీప పురుష బంధువునూ సూచించవచ్చు; ఇక్కడ లోతు అబ్రాముకు సోదరుని కుమారుడు.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ ‘సమీకరించి’ అని అనువదించిన హెబ్రీ క్రియను ‘బయటికి నడిపించి,’ ‘బయటికి తీసుకువచ్చి,’ లేదా బహుశా ‘ఆయుధాలు ఇచ్చి’ అని కూడా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִשְׁבָּה
  choice: చెరపట్టబడ్డాడు
  rationale: שׁבה యొక్క నిఫాల్ రూపం యుద్ధంలో చెరగా పట్టబడడాన్ని సూచిస్తుంది; ఈ తెలుగు పదం ఆ సైనిక సందర్భాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: אָחִיו
  choice: తన సోదరుడు
  rationale: లోతు అబ్రాముకు సోదరుని కుమారుడైనప్పటికీ, మూలపాఠం אָחִיו (‘అతని సోదరుడు’) అని చెబుతుంది. హెబ్రీలో ఈ పదం సమీప పురుష బంధువును కూడా సూచించగలదు; అందువల్ల మూలంలోని బంధుత్వ పదాన్ని ప్రధాన పాఠంలో నిలిపి, విస్తృత అర్థాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: וַיָּרֶק
  choice: సమీకరించి
  rationale: ఈ అరుదైన క్రియకు ‘బయటికి నడిపించాడు,’ ‘సిద్ధం చేశాడు/ఆయుధాలు ఇచ్చాడు,’ లేదా ‘సమీకరించాడు’ అనే భావాలు ప్రతిపాదించబడ్డాయి. సైనిక చర్యను సహజంగా తెలిపే ‘సమీకరించి’ని ఎంచుకొని, వివాదాస్పదమైన ఖచ్చిత ఛాయను పాదసూచికలో ఉంచాం.
- source_word: חֲנִיכָיו
  choice: శిక్షణ పొందిన తన మనుషులను
  rationale: ఈ నామవాచకం అబ్రాము అధీనంలో శిక్షణ పొందినవారిని సూచిస్తుంది. ‘మనుషులు’ సందర్భంలో సహజంగా ఉండి, వారిని అవసరం లేకుండా ‘సేవకులు’గా నిర్దిష్టం చేయదు.
- source_word: יְלִידֵי בֵיתוֹ
  choice: తన ఇంట పుట్టిన
  rationale: ఈ పదబంధం అబ్రాము గృహవర్గంలో పుట్టినవారిని సూచిస్తుంది; సంక్షిప్తమైన ఈ తెలుగు రూపం సామాజిక నేపథ్యాన్ని నిలుపుతుంది.
- source_word: שְׁמֹנָה עָשָׂר וּשְׁלֹשׁ מֵאוֹת
  choice: మూడువందల పద్దెనిమిది మందిని
  rationale: మూలంలోని పూర్తి సంఖ్యను తెలుగు వచనశైలిలో అక్షరాలతో ఇచ్చి, అది మనుషుల సంఖ్య అని ‘మందిని’ ద్వారా స్పష్టం చేశాం.
- source_word: וַיִּרְדֹּף
  choice: వెంబడించాడు
  rationale: ఈ సందర్భంలో רדף సైనికంగా వెంబడించడాన్ని సూచిస్తుంది. తెలుగు వాక్యానికి అవసరమైన కర్మ ‘వారిని’ సందర్భం నుంచి సహజంగా చేర్చబడింది.
- source_word: עַד דָּן
  choice: దాను వరకు
  rationale: עַד ప్రయాణం లేదా వెంబడింపు చేరిన హద్దును సూచిస్తుంది; ‘వరకు’ ఆ భావాన్ని నేరుగా తెలియజేస్తుంది.
theological_decisions:
- issue: లోతును సూచించే బంధుత్వ పదం
  choice: ప్రధాన పాఠంలో ‘తన సోదరుడు’ అని నిలుపుట
  alternative: తన బంధువు / తన సోదరుని కుమారుడు
  rationale: మూలపాఠంలోని אָחִיו అనే పదం అక్షరార్థంగా ‘అతని సోదరుడు,’ అయితే విస్తృతంగా సమీప పురుష బంధువునూ సూచించగలదు. లోతు అబ్రాముకు సోదరుని కుమారుడని సందర్భం తెలిపినా, దానిని ప్రధాన పాఠంలోనే వ్యాఖ్యానించి మూలంలోని ఉద్రిక్తతను తొలగించకుండా పాదసూచికలో వివరించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనా సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే కథనశైలి వాడబడింది. పొడవైన కర్త-కర్మ నిర్మాణాన్ని స్పష్టంచేయడానికి సంఖ్యను డాష్‌ల మధ్య సమానాధికార పదబంధంగా ఉంచాం; మూలంలోని వరుస చర్యలను ‘విన్నప్పుడు … సమీకరించి … వెంబడించాడు’ అనే సహజ తెలుగు నిర్మాణంలో తెలిపాం.
