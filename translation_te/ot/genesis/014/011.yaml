id: GEN.14.11
reference: Genesis 14:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ֠/יִּקְחוּ אֶת כָּל רְכֻ֨שׁ סְדֹ֧ם וַ/עֲמֹרָ֛ה וְ/אֶת כָּל אָכְלָ֖/ם וַ/יֵּלֵֽכוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/011.yaml
  text: Then they took all the possessions of Sodom and Gomorrah[a], and all their food, and went away.
translation:
  language: te
  text: అప్పుడు వారు సొదొమ, గొమొర్రాల ఆస్తులన్నిటినీ, వారి ఆహారమంతటినీ[a] తీసుకొని వెళ్లిపోయారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారి సరఫరాలన్నిటినీ.” హీబ్రూ పదానికి సాధారణ ఆహారం లేదా ప్రయాణం/యుద్ధయాత్రకు కావలసిన సరఫరాలు అనే అర్థం ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: తీసుకొని
  rationale: לקח అనే క్రియకు ప్రాథమిక అర్థమైన ‘తీసుకొను’ను నిలుపుతూ, దోపిడీ సందర్భాన్ని అదనంగా తీవ్రతరం చేయకుండా సహజమైన తెలుగు రూపాన్ని ఎంచుకున్నాం.
- source_word: כָּל
  choice: అంతటినీ / అంతటినీ
  rationale: హీబ్రూలో రెండుసార్లు వచ్చిన సమగ్రతా సూచకాన్ని ఆస్తి, ఆహారం రెండింటికీ తెలుగులో స్పష్టంగా పునరావృతం చేశాం.
- source_word: רְכֻשׁ
  choice: ఆస్తి
  rationale: చరాస్తులు, సామగ్రి, సంపద వంటి విస్తృత భావాన్ని ఆధునిక సాధారణ తెలుగులో సంక్షిప్తంగా తెలిపే పదం.
- source_word: סְדֹם וַעֲמֹרָה
  choice: సొదొమ, గొమొర్రా
  rationale: స్థలనామాలను ఆధునిక తెలుగు లిప్యంతరీకరణలో ఇచ్చాం; సంయుక్త సంబంధార్థం కోసం ‘సొదొమ, గొమొర్రాల’ అని విభక్తి కలిపాం.
- source_word: אָכְלָם
  choice: వారి ఆహారం
  rationale: నామవాచక రూపం మరియు తృతీయ పురుష బహువచన ప్రత్యయాన్ని నేరుగా ప్రతిబింబిస్తుంది; సందర్భానుసారం ‘సరఫరాలు’ అనే అర్థం సాధ్యమైనా, మూలంలోని సాధారణ భావాన్ని ‘ఆహారం’ మెరుగ్గా నిలుపుతుంది.
- source_word: וַיֵּלֵכוּ
  choice: వెళ్లిపోయారు
  rationale: సొమ్మును తీసుకున్న తరువాత అక్కడి నుంచి బయలుదేరిన భావాన్ని సహజమైన కథన తెలుగులో తెలియజేస్తుంది.
