translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే గౌరవప్రదమైన కథన శైలి. మూలంలోని వరుస క్రియాక్రమం మరియు ‘అంతటినీ’ అనే ద్విగుణ సమగ్రతను నిలిపాం.
