  yaml_path: translation/ot/genesis/014/013.yaml
  text: Then a fugitive came and told Abram the Hebrew[a]. Now he was dwelling by the oaks of Mamre the Amorite, brother of Eshcol and brother of Aner[c][b]; these were allies of Abram.
translation:
  language: te
  text: అప్పుడు తప్పించుకున్న ఒకడు వచ్చి హెబ్రీయుడైన అబ్రాముకు వార్త తెలియజేశాడు. ఆ సమయంలో అబ్రాము అమోరీయుడైన మమ్రేకు చెందిన మహావృక్షాల దగ్గర[a] నివసిస్తున్నాడు. మమ్రే ఎష్కోలు సోదరుడు, ఆనేరు సోదరుడు[b]. వీరు అబ్రాముతో ఒడంబడిక చేసుకున్న మిత్రులు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మమ్రే ఓక్ వృక్షాల దగ్గర’; లేదా, ‘మమ్రే టెరెబింతు వృక్షాల దగ్గర.’ హీబ్రూ పదం ఈ విధమైన పెద్ద వృక్షాలను సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘ఎష్కోలు బంధువు, ఆనేరు బంధువు.’ ‘సోదరుడు’ అనే హీబ్రూ పదం విస్తృత కుటుంబ బంధాన్ని కూడా సూచించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: పదశః, ‘అబ్రాము ఒడంబడికలో భాగస్వాములు’ లేదా ‘ఒడంబడిక యజమానులు.’ అంటే, ఒప్పందం ద్వారా అబ్రాముతో బంధం కలిగినవారు.
    reason: cultural_note
lexical_decisions:
- source_word: הַפָּלִיט
  choice: తప్పించుకున్న ఒకడు
  rationale: ప్రమాదం లేదా యుద్ధం నుంచి తప్పించుకొని వచ్చిన వ్యక్తిని సూచిస్తుంది. ‘పరారీవాడు’ అనే పదానికి నేర సంబంధమైన భావఛాయ ఉండవచ్చు కాబట్టి దాన్ని నివారించాం.
- source_word: וַיַּגֵּד
  choice: ఈ సంగతి తెలియజేశాడు
  rationale: చెప్పడం లేదా సమాచారం అందించడం అనే సాధారణ కథనార్థాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: הָעִבְרִי
  choice: హెబ్రీయుడైన
  rationale: అబ్రాముకు వాడిన జాతి లేదా సామాజిక గుర్తింపును యథాతథంగా నిలుపుతుంది.
- source_word: שֹׁכֵן
  choice: నివసిస్తున్నాడు
  rationale: హీబ్రూ వర్తమాన కృదంతంలోని కొనసాగుతున్న నివాస భావాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: בְּאֵלֹנֵי מַמְרֵא
  choice: మమ్రేకు చెందిన మహావృక్షాల దగ్గర
  rationale: אֵלוֹן పదం ఓక్ లేదా టెరెబింతు వంటి పెద్ద వృక్షాన్ని సూచించవచ్చు. ప్రధాన పాఠంలో వృక్షజాతిని అనవసరంగా నిర్ధారించకుండా సాధారణ అర్థాన్ని ఉంచి, ప్రత్యామ్నాయాలను పాదసూచికలో ఇచ్చాం.
- source_word: הָאֱמֹרִי
  choice: అమోరీయుడైన
  rationale: మమ్రేను విశేషించే ప్రామాణిక జాతి నామాన్ని నేరుగా అనువదిస్తుంది.
- source_word: אֲחִי אֶשְׁכֹּל וַאֲחִי עָנֵר
  choice: ఎష్కోలు సోదరుడు, ఆనేరుకు కూడా సోదరుడు
  rationale: אָח యొక్క ప్రాథమిక అర్థమైన ‘సోదరుడు’ను ప్రధాన పాఠంలో ఉంచాం; విస్తృత బంధుత్వార్థం సాధ్యమని పాదసూచికలో తెలిపాం.
- source_word: בַּעֲלֵי בְרִית אַבְרָם
  choice: అబ్రాముతో ఒడంబడిక చేసుకున్న మిత్రులు
  rationale: పదశః ‘ఒడంబడిక యజమానులు’ అనే హీబ్రూ నుడికారాన్ని, ఒప్పందంతో బద్ధులైన మిత్రులు అనే సందర్భార్థంతో స్పష్టమైన ఆధునిక తెలుగులో అందిస్తుంది.
