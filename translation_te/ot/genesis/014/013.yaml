translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలిని వాడాం. మూలంలోని వరుస సమాచారాన్ని చిన్న వాక్యాలుగా విభజించి సాధారణ పాఠకులకు స్పష్టత కలిగించాం. వృక్షజాతి మరియు కుటుంబ బంధంలోని నిజమైన అనిశ్చితిని పాదసూచికల్లో నిలిపాం.
