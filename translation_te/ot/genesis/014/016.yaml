  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּ֕שֶׁב אֵ֖ת כָּל הָ/רְכֻ֑שׁ וְ/גַם֩ אֶת ל֨וֹט אָחִ֤י/ו וּ/רְכֻשׁ/וֹ֙ הֵשִׁ֔יב וְ/גַ֥ם אֶת הַ/נָּשִׁ֖ים וְ/אֶת הָ/עָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/016.yaml
  text: He brought back all the possessions[a]; he also brought back Lot his kinsman, and his possessions[d][c][b], and also the women and the people.
translation:
  language: te
  text: అతడు ఆస్తినంతటినీ తిరిగి తీసుకొచ్చాడు; తన బంధువైన లోతును కూడా, అతని ఆస్తిని, అలాగే స్త్రీలను, ప్రజలను కూడా తిరిగి తీసుకొచ్చాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “తన బంధువైన లోతు” అని అనువదించిన హెబ్రీ పదబంధానికి అక్షరార్థం “తన సహోదరుడైన లోతు.” ఇక్కడ “సహోదరుడు” అనే మాట సమీప బంధువు అనే విస్తృత అర్థంలో ఉంది; ఈ కథనం ప్రకారం లోతు అబ్రాముకు మేనల్లుడు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׁב / הֵשִׁיב
  choice: తిరిగి తీసుకొచ్చాడు
  rationale: שׁוב హిఫీల్ రూపాలు ఇక్కడ మనుషులను, వస్తువులను తిరిగి వచ్చేలా చేయడం అనే భావంలో ఉన్నాయి. ‘తిరిగి తీసుకొచ్చాడు’ సహజమైన ఆధునిక తెలుగు; హెబ్రీ పాఠంలోని క్రియ పునరుక్తిని కూడా నిలుపుతుంది.
- source_word: כָּל הָרְכֻשׁ / וּרְכֻשׁוֹ
  choice: ఆస్తినంతటినీ / అతని ఆస్తిని
  rationale: רְכוּשׁ చరాస్తి, సామగ్రి, సంపద అనే విస్తృత భావాన్ని కలిగి ఉంది. ‘ఆస్తి’ సాధారణ పాఠకులకు సహజంగా ఉండి ఆ విస్తృతిని కాపాడుతుంది.
- source_word: וְגַם
  choice: కూడా / అలాగే ... కూడా
  rationale: పాఠంలో రెండుసార్లు కనిపించే యోజక-ఉద్ఘాటక బలాన్ని తెలుగులో సహజమైన విధంగా వ్యక్తం చేస్తుంది.
- source_word: לוֹט אָחִיו
  choice: తన బంధువైన లోతును
  rationale: אָחִיו అక్షరార్థంగా ‘అతని సహోదరుడు’ అయినా, విస్తృత బంధుత్వార్థంలోనూ వాడబడుతుంది; కథనంలో లోతు అబ్రాము సోదరుని కుమారుడు. ‘బంధువు’ మూలపద విస్తృతిని సందర్భానుకూలంగా అందిస్తుంది.
- source_word: הַנָּשִׁים
  choice: స్త్రీలను
  rationale: మూలపదం సాధారణంగా ‘స్త్రీలు’ అని అర్థం; సందర్భం దాన్ని ‘భార్యలు’ అనే సన్నని అర్థానికి పరిమితం చేయదు.
- source_word: הָעָם
  choice: ప్రజలను
  rationale: עָם ఇక్కడ తిరిగి తీసుకొచ్చిన ప్రజాసమూహాన్ని సూచిస్తుంది; లింగపరంగా ‘పురుషులు’ అని సంకుచితం చేయకుండా ‘ప్రజలు’ విస్తృతిని నిలుపుతుంది.
