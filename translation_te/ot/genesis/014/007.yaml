source:
  edition: WLC
  text: וַ֠/יָּשֻׁבוּ וַ/יָּבֹ֜אוּ אֶל עֵ֤ין מִשְׁפָּט֙ הִ֣וא קָדֵ֔שׁ וַ/יַּכּ֕וּ אֶֽת כָּל שְׂדֵ֖ה הָ/עֲמָלֵקִ֑י וְ/גַם֙ אֶת הָ֣/אֱמֹרִ֔י הַ/יֹּשֵׁ֖ב בְּ/חַֽצְצֹ֥ן תָּמָֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/007.yaml
  text: Then they turned back and came to En-mishpat (that is[a], Kadesh), and struck all the country of the Amalekites[c][b], and also the Amorites who were living in Hazazon-tamar.
translation:
  language: te
  text: తర్వాత వారు వెనుదిరిగి ఏన్‌-మిష్పాతుకు[a] వచ్చారు—అదే కాదేషు. వారు అమాలేకీయుల ప్రాంతమంతటినీ[b], హజజోను-తామారులో[c] నివసిస్తున్న అమోరీయులను కూడా దెబ్బతీశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఏన్‌-మిష్పాతు అనే పేరుకు ‘తీర్పు ఊట’ అని అర్థం.
    reason: cultural_note
  - marker: b
    text: లేదా, ‘అమాలేకీయుల పొలమంతటినీ/దేశమంతటినీ.’ హీబ్రూ వాక్యం అక్షరార్థంగా ‘అమాలేకీయుని పొలమంతటినీ’ అని ఉంది; ఇది అమాలేకీయులు నివసించిన ప్రాంతాన్ని సూచిస్తుండవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: 2 దినవృత్తాంతాలు 20:2లో హజజోను-తామారు ఏన్‌-గెదీగా గుర్తించబడింది.
    reason: cross_reference
lexical_decisions:
- source_word: וַיָּשֻׁבוּ
  choice: తర్వాత వారు వెనుదిరిగి
  rationale: שׁוב యొక్క దిశాపరమైన భావాన్ని ‘వెనుదిరిగి’ సహజంగా తెలియజేస్తుంది; వయిక్తోల్ కథన క్రమాన్ని ‘తర్వాత’ సూచిస్తుంది.
- source_word: וַיָּבֹאוּ אֶל
  choice: వచ్చారు
  rationale: בוא + אֶל ఇక్కడ ఒక ప్రదేశానికి చేరడాన్ని సూచిస్తుంది; గమ్యాన్ని తెలుగులో ‘కు’ విభక్తితో వ్యక్తం చేశాం.
- source_word: עֵין מִשְׁפָּט
  choice: ఏన్‌-మిష్పాతు
  rationale: ఇది స్థలనామం కాబట్టి అర్థానువాదం చేయకుండా లిప్యంతరీకరించాం; దాని అర్థాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: הִוא קָדֵשׁ
  choice: అంటే కాదేషు
  rationale: సర్వనామం, స్థలనామం కలిసి ఏన్‌-మిష్పాతును కాదేషుతో గుర్తిస్తున్నాయి; ‘అంటే’ ఆధునిక తెలుగులో ఈ వివరణాత్మక భావాన్ని స్పష్టంగా ఇస్తుంది.
- source_word: וַיַּכּוּ
  choice: దెబ్బతీశారు
  rationale: נכה అనే క్రియలో కొట్టడం, దెబ్బతీయడం, ఓడించడం వంటి విస్తృత భావాలు ఉన్నాయి. ‘దెబ్బతీశారు’ యుద్ధపరమైన సందర్భానికి సరిపోతూ, సంపూర్ణంగా నాశనం చేశారనే అదనపు భావాన్ని చేర్చదు.
- source_word: כָּל שְׂדֵה הָעֲמָלֵקִי
  choice: అమాలేకీయుల ప్రాంతమంతటినీ
  rationale: שָׂדֶה అక్షరార్థంగా ‘పొలం’ అయినా, ఇక్కడ ప్రజావర్గ నామంతో కలిసి వారు నివసించిన దేశం లేదా ప్రాంతాన్ని సూచించే అవకాశం ఎక్కువ. సమూహార్థక ఏకవచన జాతినామాన్ని తెలుగులో సహజమైన బహువచనంగా ఇచ్చాం.
- source_word: וְגַם אֶת הָאֱמֹרִי
  choice: అమోరీయులను కూడా
  rationale: וְגַם లోని అదనపు ఉద్ఘాటనను ‘కూడా’ తెలియజేస్తుంది; ఏకవచన జాతినామాన్ని సమూహాన్ని సూచించే తెలుగు బహువచనంగా అనువదించాం.
- source_word: הַיֹּשֵׁב
  choice: నివసిస్తున్న
  rationale: ఈ కర్తరి వర్తమాన కృదంతం ఆ ప్రదేశంలో కొనసాగుతున్న నివాసాన్ని వర్ణిస్తుంది.
- source_word: בְּחַצְצֹן תָּמָר
  choice: హససోన్‌-తామారులో
  rationale: స్థలనామాన్ని లిప్యంతరీకరించి, בְּ యొక్క స్థానార్థాన్ని తెలుగు ‘లో’తో వ్యక్తం చేశాం.
