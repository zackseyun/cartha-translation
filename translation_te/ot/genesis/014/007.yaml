translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. స్థలనామాలను లిప్యంతరీకరించాం. נכה యొక్క విస్తృత భావాన్ని అతిగా నిర్దిష్టం చేయకుండా ‘దెబ్బతీశారు’గా ఉంచాం; שְׂדֵה యొక్క అక్షరార్థం మరియు ప్రాంతార్థం మధ్య ఉన్న భేదాన్ని పాదసూచికలో నిలిపాం.
