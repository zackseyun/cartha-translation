source:
  edition: WLC
  text: וּ/בְ/אַרְבַּע֩ עֶשְׂרֵ֨ה שָׁנָ֜ה בָּ֣א כְדָרְלָעֹ֗מֶר וְ/הַ/מְּלָכִים֙ אֲשֶׁ֣ר אִתּ֔/וֹ וַ/יַּכּ֤וּ אֶת רְפָאִים֙ בְּ/עַשְׁתְּרֹ֣ת קַרְנַ֔יִם וְ/אֶת הַ/זּוּזִ֖ים בְּ/הָ֑ם וְ/אֵת֙ הָֽ/אֵימִ֔ים בְּ/שָׁוֵ֖ה קִרְיָתָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/005.yaml
  text: In the fourteenth year[a], Kedorlaomer came, along with the kings who were with him, and they defeated the Rephaim at Ashteroth-karnaim, the Zuzim at Ham[c][b], and the Emim at Shaveh-kiriathaim.
translation:
  language: te
  text: పద్నాలుగో సంవత్సరంలో కెదొర్లాయోమెరు[a] అతనితో ఉన్న రాజులతో కలిసి వచ్చి, అష్టెరోత్-కర్ణయీములో రెఫాయీయులను[b], హాములో జూజీయులను, షావే-కిర్యాతయీములో[c] ఏమీయులను ఓడించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని అనువాద సంప్రదాయాల్లో ఈ పేరు వేరే అక్షరరూపంలో కనిపిస్తుంది; “కెదొర్లాయోమెరు” హీబ్రూ రూపాన్ని నేరుగా అనుసరిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: “రెఫాయీయులు” అనే పేరును కొందరు “దైత్యులు” అని అనువదిస్తారు; ఇక్కడ హీబ్రూలో ఉన్న ప్రజాసమూహం పేరు అలాగే నిలిపాం.
    reason: lexical_alternative
  - marker: c
    text: “షావే-కిర్యాతయీము”ను “కిర్యాతయీము మైదానం” అని కూడా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְאַרְבַּע עֶשְׂרֵה שָׁנָה
  choice: పద్నాలుగో సంవత్సరంలో
  rationale: వావ్ సంధిని తెలుగు కథన ప్రవాహంలో ప్రత్యేకంగా అనువదించకుండా, కాలాన్ని సూచించే పదబంధంగా సహజంగా అందిస్తుంది.
- source_word: בָּא
  choice: వచ్చి
  rationale: בוא అనే సాధారణ ‘రావు’ అర్థాన్ని నిలుపుతుంది; సైనిక సందర్భాన్ని బట్టి ‘దండెత్తి వచ్చి’ అని అధికంగా వ్యాఖ్యానించదు.
- source_word: כְדָרְלָעֹמֶר
  choice: కెదొర్లాయోమెరు
  rationale: హీబ్రూ పేరును తెలుగు ధ్వనివ్యవస్థకు అనుగుణంగా లిప్యంతరీకరించింది.
- source_word: וְהַמְּלָכִים אֲשֶׁר אִתּוֹ
  choice: అతనితో ఉన్న రాజులు
  rationale: కెదొర్లాయోమెరుతో కలిసి వచ్చిన మిత్రరాజులను సరళంగా, మూల నిర్మాణానికి దగ్గరగా సూచిస్తుంది.
- source_word: וַיַּכּוּ
  choice: ఓడించారు
  rationale: נכה యొక్క మౌలిక భావం ‘కొట్టు’; ఇక్కడ యుద్ధంలో ప్రజాసమూహాలను జయించిన సందర్భంలో ‘ఓడించారు’ ఆధునిక తెలుగులో సహజంగా అర్థాన్ని అందిస్తుంది.
- source_word: רְפָאִים
  choice: రెఫాయీయులు
  rationale: దీనిని ‘దైత్యులు’ అని వ్యాఖ్యానించకుండా ప్రజాసమూహం పేరుగా లిప్యంతరీకరించింది.
- source_word: בְּעַשְׁתְּרֹת קַרְנַיִם
  choice: అష్తెరోత్-కర్ణయీములో
  rationale: యుద్ధస్థలాన్ని సూచించే సంయుక్త స్థలనామంగా లిప్యంతరీకరించింది.
- source_word: הַזּוּזִים
  choice: జూజీయులు
  rationale: నిర్దిష్ట ప్రజాసమూహం పేరుగా తెలుగు బహువచన రూపంలో అందించింది.
- source_word: בְּהָם
  choice: హాములో
  rationale: הם ను ఇక్కడ స్థలనామంగా గ్రహించి లిప్యంతరీకరించింది.
- source_word: הָאֵימִים
  choice: ఏమీయులు
  rationale: ప్రజాసమూహం పేరును తెలుగు బహువచన రూపంలో లిప్యంతరీకరించింది.
- source_word: בְּשָׁוֵה קִרְיָתָיִם
  choice: షావే-కిర్యాతయీములో
  rationale: שָׁוֵה ను తప్పనిసరిగా ‘మైదానం’ అని అనువదించకుండా, మొత్తం పదబంధాన్ని స్థలనామంగా నిలిపింది.
theological_decisions:
- issue: רְפָאִים ను సాధారణ నామంగా లేదా ప్రజానామంగా చూపడం
  choice: ప్రజానామమైన ‘రెఫాయీయులు’గా ఉంచడం
  alternative: ‘దైత్యులు’ అని అనువదించడం
  rationale: ఈ వాక్యంలోని భౌగోళిక-జాతి జాబితా సందర్భం ప్రజానామాన్ని సమర్థిస్తుంది; వారి స్వభావం గురించి అదనపు వ్యాఖ్యానాన్ని వచనంలోకి తేవదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా చదవగల కథన శైలి. పేర్లను హీబ్రూ ధ్వనులకు దగ్గరగా ఉంచి, ప్రజానామాలకు సహజమైన తెలుగు బహువచన రూపం వాడబడింది. మూలంలోని ఒకే వరుస సైనిక చర్యను ‘వచ్చి ... ఓడించారు’ అనే సహజ తెలుగు నిర్మాణంలో నిలిపాం.
