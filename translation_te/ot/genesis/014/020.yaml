id: GEN.14.20
reference: Genesis 14:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/בָרוּךְ֙ אֵ֣ל עֶלְי֔וֹן אֲשֶׁר מִגֵּ֥ן צָרֶ֖י/ךָ בְּ/יָדֶ֑/ךָ וַ/יִּתֶּן ל֥/וֹ מַעֲשֵׂ֖ר מִ/כֹּֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/020.yaml
  text: And blessed be God Most High[a], who delivered your enemies into your hand[b]. And he gave him a tenth of everything.
translation:
  language: te
  text: నీ శత్రువులను నీ చేతికి అప్పగించిన సర్వోన్నత దేవుడు స్తుతింపబడుగాక! మరియు అతడు అతనికి అన్నిటిలోనుండి పదోవంతు ఇచ్చాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీలో ‘ఇచ్చాడు’ అనే క్రియకు కర్తను మళ్లీ పేర్కొనలేదు. సందర్భం ప్రకారం అబ్రాము మెల్కీసెదెకుకు అన్నిటిలోనుండి పదోవంతు ఇచ్చాడని అర్థం చేసుకోవడం అత్యంత సహజం.
    reason: alternative_reading
lexical_decisions:
- source_word: וּבָרוּךְ
  choice: స్తుతింపబడుగాక
  rationale: ఆశీర్వాద ప్రకటనగా ఉన్న నిష్క్రియార్థక రూపాన్ని సహజమైన, గౌరవప్రదమైన తెలుగు స్తుతి సూత్రంతో వ్యక్తం చేస్తుంది.
- source_word: אֵל עֶלְיוֹן
  choice: సర్వోన్నత దేవుడు
  rationale: దైవ బిరుదులోని ‘అత్యున్నతుడు’ అనే భావాన్ని ఆధునిక ప్రామాణిక తెలుగులో స్పష్టంగా అందిస్తుంది.
- source_word: מִגֵּן
  choice: అప్పగించిన
  rationale: ఈ క్రియకు ఇక్కడ ‘రక్షించిన’ కంటే ‘చేతికి అప్పగించిన/లోబరచిన’ అనే సైనిక సందర్భార్థమే తగినది.
- source_word: צָרֶיךָ
  choice: నీ శత్రువులను
  rationale: రెండవ పురుష ఏకవచన ప్రత్యయంతో కూడిన బహువచనాన్ని స్పష్టంగా అనువదిస్తుంది.
- source_word: בְּיָדֶךָ
  choice: నీ చేతికి
  rationale: ఎవరి అధికారంలోకైనా అప్పగించడం అనే హెబ్రీ నుడికారాన్ని తెలుగులో సహజంగా నిలుపుతుంది.
- source_word: וַיִּתֶּן
  choice: అప్పుడు అతడు ... ఇచ్చాడు
  rationale: కథన క్రమాన్ని చూపుతూ, మూలంలో తిరిగి చెప్పని కర్తను సర్వనామంగానే ఉంచుతుంది.
- source_word: מַעֲשֵׂר
  choice: పదోవంతు
  rationale: పదానికి నేరమైన పరిమాణార్థం; తరువాతి మతపరమైన సంస్థాగత భావాలను అనవసరంగా చేర్చదు.
- source_word: מִכֹּל
  choice: సమస్తంలో
  rationale: మొత్తం వస్తువులు లేదా దోపుడుసొమ్ములోనుండి పదోవంతు అనే సమగ్ర భావాన్ని సంక్షిప్తంగా అందిస్తుంది.
theological_decisions:
- issue: וַיִּתֶּן లో చెప్పబడని కర్త ఎవరు?
  choice: అబ్రాము మెల్కీసెదెకుకు ఇచ్చాడనే సందర్భానుకూల పఠనాన్ని ‘అతడు అతనికి’ అని ఉంచడం
  alternative: మెల్కీసెదెకు అబ్రాముకు ఇచ్చాడని పఠించడం
  rationale: సందర్భం అబ్రామే ఇచ్చినవాడని బలంగా సూచించినా, హెబ్రీ వాక్యం కర్తను మళ్లీ స్పష్టంగా పేర్కొనదు. అందువల్ల పేర్లను చేర్చి సందిగ్ధతను పూర్తిగా తొలగించకుండా సర్వనామాలను నిలిపాం; వివరణను పాదటిప్పణిలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; స్తుతి వాక్యంలో గౌరవప్రదమైన బైబిలీయ ధోరణి, కథన భాగంలో సాధారణంగా అర్థమయ్యే పదజాలం. మూలంలో లేని వ్యక్తి పేర్లను ప్రధాన వచనంలో చేర్చలేదు.
