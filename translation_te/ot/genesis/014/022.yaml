  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר אַבְרָ֖ם אֶל מֶ֣לֶךְ סְדֹ֑ם הֲרִימֹ֨תִי יָדִ֤/י אֶל יְהוָה֙ אֵ֣ל עֶלְי֔וֹן קֹנֵ֖ה שָׁמַ֥יִם וָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/022.yaml
  text: But Abram said to the king of Sodom[a], “I have raised my hand to Yahweh, God Most High[c][b], possessor of heaven and earth.”
translation:
  language: te
  text: 'అయితే అబ్రాము సొదొము రాజుతో ఇలా అన్నాడు: “నేను ఆకాశానికీ భూమికీ యజమానియైన[b] సర్వోన్నత దేవుడైన యాహ్వేకు నా చెయ్యి ఎత్తాను[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “నా చెయ్యి ఎత్తాను” అనేది ప్రమాణం చేసేటప్పుడు చెయ్యి ఎత్తే హీబ్రూ ఆచారాన్ని సూచిస్తుంది; అంటే, అబ్రాము ప్రమాణం చేస్తున్నాడు.
    reason: cultural_note
  - marker: b
    text: లేదా, “సృష్టికర్త.” హీబ్రూ పదానికి “కలిగియున్నవాడు,” “యజమాని,” లేదా సందర్భానుసారం “సృష్టికర్త” అనే అర్థాలు ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అయితే ... అన్నాడు
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది; ఇక్కడ ముందున్న సొదొము రాజు ప్రతిపాదనకు అబ్రాము ఇచ్చిన విరుద్ధ స్పందనను ‘అయితే’ సహజంగా తెలియజేస్తుంది.
- source_word: אַבְרָם
  choice: అబ్రాము
  rationale: తెలుగులో స్థిరపడిన బైబిలు వ్యక్తినామ రూపం.
- source_word: מֶלֶךְ סְדֹם
  choice: సొదొము రాజు
  rationale: మూలంలోని సమాస సంబంధాన్ని సహజమైన తెలుగులో నేరుగా వ్యక్తం చేస్తుంది.
- source_word: הֲרִימֹתִי יָדִי
  choice: నా చెయ్యి ఎత్తాను
  rationale: ‘నా చెయ్యి ఎత్తాను’ అనే మూర్తమైన హీబ్రూ జాతీయాన్ని నిలుపుతుంది; ఇది ప్రమాణం చేసే సంకేతమని పాదటిప్పణి వివరిస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా స్థిరపడిన ప్రత్యక్ష లిప్యంతరీకరణ రూపాన్ని ఉపయోగిస్తుంది.
- source_word: אֵל עֶלְיוֹן
  choice: సర్వోన్నత దేవుడు
  rationale: ‘అత్యున్నతుడైన దేవుడు’ అనే భావాన్ని సహజమైన, గౌరవప్రదమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: קֹנֵה
  choice: అధిపతి
  rationale: קנה అనే పదంలోని స్వాధీనత/యాజమాన్య భావాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది; ‘సృష్టికర్త’ అనే సాధ్యమైన అర్థాన్ని పాదటిప్పణిలో ఉంచి సందిగ్ధతను కాపాడుతుంది.
- source_word: שָׁמַיִם וָאָרֶץ
  choice: ఆకాశానికీ భూమికీ
  rationale: సృష్టి సమస్తాన్ని సూచించే హీబ్రూ ద్వంద్వవ్యక్తీకరణను తెలుగులో సహజంగా నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో ఉన్న వ్యక్తిగత దైవనామాన్ని ‘ప్రభువు’ వంటి బిరుదుతో భర్తీ చేయకుండా కాపాడుతుంది. ఆధునిక తెలుగు బైబిలు వాడుకలో ‘యెహోవా’ ఎక్కువగా గుర్తించదగిన రూపం; ‘యాహ్వే’ మూల ఉచ్చారణకు దగ్గరైన ప్రత్యామ్నాయం.
- issue: קֹנֵה שָׁמַיִם וָאָרֶץ యొక్క భావ పరిధి
  choice: ఆకాశానికీ భూమికీ అధిపతి
  alternative: ఆకాశానికీ భూమికీ సృష్టికర్త
  rationale: హీబ్రూ పదం స్వాధీనపరచుకోవడం, కలిగియుండడం లేదా సందర్భానుసారం సృష్టించడం అనే భావాలను అనుమతిస్తుంది. ప్రధాన పాఠంలో యాజమాన్య భావాన్ని ఉంచి, సృష్టి భావాన్ని పాదటిప్పణిలో చూపడం ద్వారా మూలంలోని అర్థ ఉద్రిక్తతను అతిగా పరిష్కరించకుండా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. హీబ్రూ ప్రమాణ సంకేతాన్ని ప్రధాన పాఠంలో నిలిపి వివరణను పాదటిప్పణిలో ఇచ్చాం. ప్రతి పాదటిప్పణి సూచిక ప్రధాన పాఠంలో ఉంది.
