revisions:
- from: అయితే అబ్రాము సొదొము రాజుతో, “ఆకాశానికీ భూమికీ అధిపతియైన సర్వోన్నత దేవుడు యెహోవా వైపు నా చెయ్యి ఎత్తాను[a].” అన్నాడు.
  to: 'అయితే అబ్రాము సొదొము రాజుతో ఇలా అన్నాడు: “నేను ఆకాశానికీ భూమికీ యజమానియైన[b] సర్వోన్నత దేవుడైన యాహ్వేకు నా చెయ్యి ఎత్తాను[a].”'
  rationale: The revision corrects the possessive terminology for קֹנֵה, aligns the rendering of יהוה with the stated Yahweh policy, and repairs the Telugu quotation structure. It retains the concrete oath gesture in the main text and preserves the possible ‘creator’ sense in a clearly anchored footnote without overresolving the Hebrew ambiguity.
