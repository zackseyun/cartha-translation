source:
  edition: WLC
  text: וַ/יְהִ֗י בִּ/ימֵי֙ אַמְרָפֶ֣ל מֶֽלֶךְ שִׁנְעָ֔ר אַרְי֖וֹךְ מֶ֣לֶךְ אֶלָּסָ֑ר כְּדָרְלָעֹ֨מֶר֙ מֶ֣לֶךְ עֵילָ֔ם וְ/תִדְעָ֖ל מֶ֥לֶךְ גּוֹיִֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/001.yaml
  text: 'And it happened in the days of Amraphel king of Shinar[a], Arioch king of Ellasar, Chedorlaomer king of Elam, and Tidal king of nations:'
translation:
  language: te
  text: 'షీనారు రాజైన అమ్రాఫెలు, ఎల్లాసారు రాజైన అర్యోకు, ఏలాము రాజైన కదొర్లాయోమెరు, గోయీము[a] రాజైన తిదాలు కాలంలో ఇలా జరిగింది:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “జనాల రాజు.” హీబ్రూ పదం సాధారణంగా “జనాలు” లేదా “దేశాలు” అని అర్థం; అయితే ఇక్కడ మిగతా రాజుల బిరుదుల మాదిరిగా అది ఒక ప్రాంతనామంగా కూడా ఉండవచ్చు.
    reason: గּוֹיִם అనే పదం సాధారణ నామమా, ప్రాంతనామమా అన్న నిజమైన పదార్థ సందిగ్ధతను నిలుపుతుంది.
lexical_decisions:
- source_word: וַיְהִי
  choice: ఇలా జరిగింది
  rationale: హీబ్రూ కథనారంభ సూత్రాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది; పాతకాలపు కృత్రిమ ప్రయోగాన్ని నివారిస్తుంది.
- source_word: בִּימֵי
  choice: కాలంలో
  rationale: అక్షరార్థంగా ‘రోజుల్లో’ అయినా, రాజుల పాలనకాలాన్ని సూచించే ఈ కాలవాచక నిర్మాణానికి ‘కాలంలో’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: אַמְרָפֶל / אַרְיוֹךְ / כְּדָרְלָעֹמֶר / תִדְעָל
  choice: అమ్రాఫెలు / అర్యోకు / కదొర్లాయోమెరు / తిదాలు
  rationale: హీబ్రూ వ్యక్తినామాలను తెలుగులో సులభంగా పలికే విధంగా లిప్యంతరీకరించాం.
- source_word: שִׁנְעָר / אֶלָּסָר / עֵילָם
  choice: షీనారు / ఎల్లాసారు / ఏలాము
  rationale: రాజ్యాల లేదా ప్రాంతాల పేర్లను అనువదించకుండా తెలుగు ధ్వనిరూపంలో ఇచ్చాం.
- source_word: מֶלֶךְ
  choice: రాజైన
  rationale: ప్రతి వ్యక్తిని అతడు పాలించే ప్రాంతంతో సహజమైన తెలుగు సంబంధవాచక నిర్మాణంలో కలుపుతుంది.
- source_word: גּוֹיִם
  choice: గోయీము
  rationale: ఈ సందర్భంలో మిగతా రాజబిరుదులకు సమాంతరంగా ప్రాంతనామంగా ఉండే అవకాశాన్ని ప్రధాన పాఠ్యంలో నిలిపి, సాధారణ అర్థమైన ‘జనాలు/దేశాలు’ను పాదసూచికలో ఉంచాం.
