  text: וַ/יֵּחָלֵ֨ק עֲלֵי/הֶ֧ם לַ֛יְלָה ה֥וּא וַ/עֲבָדָ֖י/ו וַ/יַּכֵּ֑/ם וַֽ/יִּרְדְּפֵ/ם֙ עַד חוֹבָ֔ה אֲשֶׁ֥ר מִ/שְּׂמֹ֖אל לְ/דַמָּֽשֶׂק׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/015.yaml
  text: By night he and his servants divided themselves against them, struck them down, and pursued them as far as Hobah, which is north of Damascus.
translation:
  language: te
  text: రాత్రివేళ అతడు తన సేవకులతో కలిసి వారిమీద దాడి చేయడానికి దళాలుగా విడిపోయి, వారిని కొట్టి, దమస్కుకు ఉత్తరాన ఉన్న హోబా వరకు వారిని తరిమాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּחָלֵק עֲלֵיהֶם
  choice: వారిమీద దాడిచేయడానికి వేర్వేరు దళాలుగా విడిపోయి
  rationale: ఈ క్రియ యొక్క పదశః భావం ‘విభజించుకున్నాడు’; యుద్ధ సందర్భంలో అబ్రాము తన మనుషులను దళాలుగా విభజించి శత్రువుపై దాడి చేశాడనే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: עֲבָדָיו
  choice: అతని సేవకులు
  rationale: עֶבֶד అనే పదానికి సేవకుడు లేదా దాసుడు అనే అర్థాలు ఉండవచ్చు; ఇక్కడ అబ్రాముతో యుద్ధానికి వెళ్లిన అతని గృహస్థులను సూచించడానికి ‘సేవకులు’ సహజంగా ఉంది.
- source_word: וַיַּכֵּם
  choice: వారిని హతమార్చి
  rationale: נכה హిఫీల్ రూపం శత్రువును కొట్టడం లేదా సంహరించడం సూచిస్తుంది; యుద్ధ సందర్భంలో ‘హతమార్చి’ తగిన బలాన్ని నిలుపుతుంది.
- source_word: מִשְּׂמֹאל לְדַמָּשֶׂק
  choice: దమస్కుకు ఉత్తరాన
  rationale: పురాతన దిశాభిముఖతలో ‘ఎడమవైపు’ అంటే ఉత్తరం; లక్ష్యభాషలో భౌగోళిక అర్థాన్ని స్పష్టంగా అందిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, కథనానికి తగిన గంభీరతతో, సాధారణ పాఠకులకు స్పష్టంగా రూపొందించబడింది. మూలంలోని రాత్రి దాడి, దళవిభజన, వెంబడింపు క్రమం నిలుపబడింది.
