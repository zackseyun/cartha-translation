revisions:
- from: రాత్రివేళ అతడు, అతని సేవకులు వారిమీద దాడిచేయడానికి వేర్వేరు దళాలుగా విడిపోయి, వారిని హతమార్చి, దమస్కుకు ఉత్తరాన ఉన్న హోబా వరకు వారిని తరిమారు.
  to: రాత్రివేళ అతడు తన సేవకులతో కలిసి వారిమీద దాడి చేయడానికి దళాలుగా విడిపోయి, వారిని కొట్టి, దమస్కుకు ఉత్తరాన ఉన్న హోబా వరకు వారిని తరిమాడు.
  rationale: The revision restores Abraham as the singular narrative subject, retains his servants' participation in the tactical division, and renders the combat verb without adding an explicit claim of killing. The geographical identification remains clear and faithful.
