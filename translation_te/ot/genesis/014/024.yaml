id: GEN.14.24
reference: Genesis 14:24
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: בִּלְעָדַ֗/י רַ֚ק אֲשֶׁ֣ר אָֽכְל֣וּ הַ/נְּעָרִ֔ים וְ/חֵ֨לֶק֙ הָֽ/אֲנָשִׁ֔ים אֲשֶׁ֥ר הָלְכ֖וּ אִתִּ֑/י עָנֵר֙ אֶשְׁכֹּ֣ל וּ/מַמְרֵ֔א הֵ֖ם יִקְח֥וּ חֶלְקָֽ/ם׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/024.yaml
  text: I will take nothing except only what the young men have eaten[a], and the share of the men who went with me—Aner, Eshcol, and Mamre[c][b]. Let them take their share.
translation:
  language: te
  text: యువకులు[a] తిన్నది, నాతో వెళ్లిన మనుషులైన ఆనేరు, ఎష్కోలు, మమ్రేల వాటా తప్ప నేను ఏమీ తీసుకోను. వారు తమ వాటా తీసుకోనివ్వండి[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సేవకులు” లేదా “పరివారికులు.” హీబ్రూ పదం సందర్భానుసారం యువకులను లేదా సేవచేసే అనుచరులను సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “వారు తమ వాటా తీసుకుంటారు.” హీబ్రూ రూపాన్ని సాధారణ భవిష్యత్తుగా కూడా అర్థం చేసుకోవచ్చు; ఈ సందర్భంలో అనుమతి భావం ఎక్కువగా సరిపోతుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: בִּלְעָדַי רַק
  choice: తప్ప నేను ఏమీ తీసుకోను
  rationale: ఈ మినహాయింపు పదబంధం ముందటి వచనంలోని అబ్రాము నిరాకరణను కొనసాగిస్తుంది. తెలుగులో పూర్తి, సహజ వాక్యంగా ఉండేందుకు సూచిత క్రియాభావాన్ని స్పష్టంగా తెలిపింది; רַק ఇచ్చే కఠిన పరిమితిని ‘తప్ప’ ద్వారా నిలిపింది.
- source_word: אֲשֶׁר אָכְלוּ הַנְּעָרִים
  choice: యువకులు తిన్నది
  rationale: נְעָרִים అనే పదం సందర్భానుసారం యువకులను లేదా సేవకులు/పరివారికులను సూచించగలదు. ప్రధాన పాఠంలో మూలపదానికి పారదర్శకమైన ‘యువకులు’ ఉంచి, ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో తెలిపింది.
- source_word: וְחֵלֶק הָאֲנָשִׁים אֲשֶׁר הָלְכוּ אִתִּי
  choice: నాతో వెళ్లిన ... మనుషుల వాటా
  rationale: חֵלֶק కు దోపుడు సొమ్ము పంపక సందర్భంలో సహజమైన ‘వాటా’ను వాడింది; הלך యొక్క గమన భావాన్ని ‘వెళ్లిన’ నిలుపుతుంది.
- source_word: עָנֵר אֶשְׁכֹּל וּמַמְרֵא
  choice: ఆనֵరు, ఎష్కోలు, మమ్రే
  rationale: వ్యక్తినామాలను హీబ్రూ ఉచ్చారణకు సమీపంగా తెలుగు లిప్యంతరీకరణ చేసింది.
- source_word: הֵם יִקְחוּ חֶלְקָם
  choice: వారు తమ వాటా తీసుకోనివ్వు
  rationale: ఈ సందర్భంలో అసంపూర్ణ క్రియారూపం సాధారణ భవిష్యత్తుకన్నా అనుమతి లేదా సమ్మతిని వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: ముందటి వచనంలోని ప్రమాణం మరియు నిరాకరణకు సూచిత కొనసాగింపు
  choice: ‘నేను ఏమీ తీసుకోను’ అని సూచిత భావాన్ని తెలుగులో స్పష్టపరచడం
  alternative: ‘...తప్ప’ అనే క్రియలేని వాక్యఖండంగా ఉంచడం
  rationale: హీబ్రూ వాక్యం 23వ వచనంపై ఆధారపడుతుంది. తెలుగులో అర్థం సహజంగా, సంపూర్ణంగా ఉండేందుకు సూచిత నిరాకరణను చేర్చడం అనువాదపరమైన అవసరం; ఇది కొత్త సిద్ధాంతార్థాన్ని జోడించదు.
- issue: יִקְחוּ యొక్క విధార్థం
  choice: అనుమతిగా ‘తీసుకోనివ్వు’
  alternative: సాధారణ భవిష్యత్తుగా ‘వారు తమ వాటా తీసుకుంటారు’
  rationale: అబ్రాము తన మిత్రుల హక్కును మినహాయిస్తున్న సందర్భం అనుమతి భావానికి బలం ఇస్తుంది; రూపంలోని భవిష్యత్ సాధ్యతను పాదటిప్పణిలో నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలి. ‘వాటా’ సాధారణ పాఠకునికి స్పష్టంగా ఉండి పంపక సందర్భానికి సరిపోతుంది. మూలంలోని పునరుక్త పరిమితిని తెలుగులో అసహజంగా ‘తప్ప కేవలం’ అని చేయకుండా, ‘తప్ప నేను ఏమీ తీసుకోను’ అనే నిర్మాణంతో బలమైన మినహాయింపుగా తెలిపింది.
