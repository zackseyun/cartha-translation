id: GEN.14.9
reference: Genesis 14:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אֵ֣ת כְּדָרְלָעֹ֜מֶר מֶ֣לֶךְ עֵילָ֗ם וְ/תִדְעָל֙ מֶ֣לֶךְ גּוֹיִ֔ם וְ/אַמְרָפֶל֙ מֶ֣לֶךְ שִׁנְעָ֔ר וְ/אַרְי֖וֹךְ מֶ֣לֶךְ אֶלָּסָ֑ר אַרְבָּעָ֥ה מְלָכִ֖ים אֶת הַ/חֲמִשָּֽׁה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/009.yaml
  text: Chedorlaomer king of Elam[a], Tidal king of Goiim, Amraphel king of Shinar, and Arioch king of Ellasar—four kings against the five.
translation:
  language: te
  text: ఏలాము రాజైన కదొర్లాయోమెరు, గోయీము[a] రాజైన తిదాలు, షినారు రాజైన అమ్రాఫెలు, ఎల్లాసారు రాజైన అర్యోకు—నలుగురు రాజులు ఐదుగురు రాజులకు వ్యతిరేకంగా యుద్ధం చేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దేశాల రాజైన తిదాలు.’ హీబ్రూ పదం גּוֹיִם సాధారణంగా ‘దేశాలు’ అని అర్థమవుతుంది; అయితే ఇక్కడ అది ‘గోయీము’ అనే స్థలనామం కూడా కావచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: אֵת ... אֶת
  choice: ఎదురు నిలిచారు
  rationale: ఈ యుద్ధ జాబితా నిర్మాణంలో אֵת పక్షాల మధ్య ప్రతిఘటనను సూచిస్తుంది. తెలుగులో సంబంధాన్ని స్పష్టంగా, సహజంగా తెలియజేయడానికి ‘ఎదురు నిలిచారు’ అని ఇచ్చాం.
- source_word: כְּדָרְלָעֹמֶר
  choice: కదొర్లాయోమెరు
  rationale: వ్యక్తి పేరును అనువదించకుండా హీబ్రూ ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించాం.
- source_word: מֶלֶךְ עֵילָם
  choice: ఏలాము రాజు
  rationale: హీబ్రూ సంబంధ నిర్మాణాన్ని సహజమైన తెలుగు పదక్రమంలో అందించాం.
- source_word: תִדְעָל
  choice: తిదాలు
  rationale: వ్యక్తి పేరును హీబ్రూ రూపానికి దగ్గరగా లిప్యంతరీకరించాం.
- source_word: גּוֹיִם
  choice: గోయీము
  rationale: ఇక్కడ ఇది రాజ బిరుదులోని ప్రాంతనామంగా ఉండే అవకాశం ఉన్నందున ప్రధాన పాఠ్యంలో స్థలనామంగా లిప్యంతరీకరించాం; ‘జనాలు/దేశాలు’ అనే సాధారణ నామవాచక పఠనాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: אַמְרָפֶל
  choice: అమ్రాఫెలు
  rationale: వ్యక్తి పేరును లిప్యంతరీకరించాం.
- source_word: שִׁנְעָר
  choice: షినారు
  rationale: చారిత్రక ప్రాంతంతో గుర్తించి అర్థానువాదం చేయకుండా మూలంలోని స్థలనామాన్ని నిలిపాం.
- source_word: אַרְיוֹךְ
  choice: అర్యోకు
  rationale: వ్యక్తి పేరును లిప్యంతరీకరించాం.
- source_word: אֶלָּסָר
  choice: ఎల్లాసారు
  rationale: ఊహాత్మక భౌగోళిక గుర్తింపును చేర్చకుండా స్థలనామాన్ని లిప్యంతరీకరించాం.
- source_word: אַרְבָּעָה מְלָכִים
  choice: ఈ నలుగురు రాజులు
  rationale: సంఖ్యా-నామవాచక పదబంధాన్ని నేరుగా అందిస్తూ, ముందున్న పేర్లను సూచించడానికి సహజమైన తెలుగు నిర్దేశకాన్ని వాడాం.
- source_word: הַחֲמִשָּׁה
  choice: ఆ ఐదుగురు రాజులు
  rationale: హీబ్రూలో ‘ఆ ఐదుగురు’ అని మాత్రమే ఉన్నా, తెలుగులో వ్యక్తుల సంఖ్యకు తగిన రూపాన్ని వాడి, సందర్భంలో అంతర్లీనంగా ఉన్న ‘రాజులు’ను స్పష్టం చేశాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలిని వాడాం. మూలంలో క్రియ లేకుండా మునుపటి వాక్యానికి కొనసాగింపుగా ఉన్న యుద్ధ జాబితాను, స్వతంత్ర వచనంగా సహజంగా చదవడానికి ‘ఎదురు నిలిచారు’ అనే క్రియతో పూర్తి చేశాం. పాదటిప్పణి గుర్తు సందిగ్ధ పదమైన ‘గోయీము’ వద్దనే ఉంచాం.
