    rationale: אֵת యుద్ధ-జాబితాలో పక్షవిరోధాన్ని సూచిస్తుంది. ‘వ్యతిరేకంగా యుద్ధం చేశారు’ తెలుగులో ఆ సంబంధాన్ని స్పష్టంగా, సహజంగా చెబుతుంది.
