    rationale: సందర్భంలో సూచన అర్థమైనప్పటికీ, ‘నలుగురు రాజులు ఐదుగురు రాజులకు’ అని చెప్పడం మూలంలోని సంక్షిప్తతను, అర్థాన్ని మరింత దగ్గరగా నిలుపుతుంది.
  - severity: low
