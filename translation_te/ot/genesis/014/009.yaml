- from: ఏలాము రాజు కదొర్లాయోమెరు, గోయీము[a] రాజు తిదాలు, షినారు రాజు అమ్రాఫెలు, ఎల్లాసారు రాజు అర్యోకు—ఈ నలుగురు రాజులు ఆ ఐదుగురు రాజులకు ఎదురు నిలిచారు.
  to: ఏలాము రాజైన కదొర్లాయోమెరు, గోయీము[a] రాజైన తిదాలు, షినారు రాజైన అమ్రాఫెలు, ఎల్లాసారు రాజైన అర్యోకు—నలుగురు రాజులు ఐదుగురు రాజులకు వ్యతిరేకంగా యుద్ధం చేశారు.
  rationale: రాజుల పేర్లు మరియు ప్రదేశాల పేర్లను యథాతథంగా లిప్యంతరీకరించి, గోయీము గురించిన మూలసందిగ్ధతను పాదటిప్పణిలో కాపాడాం. మూలంలో లేని నిర్దేశకాలను తొలగించాం; రాజు-ప్రాంత సంబంధాన్ని స్పష్టంగా చూపడానికి ‘రాజైన’ వాడాం. యుద్ధ-జాబితాలోని ప్రతిఘటనను సహజమైన తెలుగు క్రియతో వ్యక్తం చేశాం.
