id: GEN.14.17
reference: Genesis 14:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֵּצֵ֣א מֶֽלֶךְ סְדֹם֮ לִ/קְרָאת/וֹ֒ אַחֲרֵ֣י שׁוּב֗/וֹ מֵֽ/הַכּוֹת֙ אֶת כְּדָרלָעֹ֔מֶר וְ/אֶת הַ/מְּלָכִ֖ים אֲשֶׁ֣ר אִתּ֑/וֹ אֶל עֵ֣מֶק שָׁוֵ֔ה ה֖וּא עֵ֥מֶק הַ/מֶּֽלֶךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/017.yaml
  text: Then the king of Sodom went out to meet him after his return from defeating Kedorlaomer and the kings who were with him[a], to the Valley of Shaveh (that is[b], the King's Valley).
translation:
  language: te
  text: కెదొర్లాయోమెరును, అతనితో ఉన్న రాజులను ఓడించి తిరిగి వచ్చిన అతనిని కలుసుకోవడానికి సొదొమ రాజు షావే లోయకు బయలుదేరాడు (అదే రాజు లోయ).
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: బయలుదేరాడు
  rationale: కథనాన్ని ముందుకు నడిపించే క్రియను సహజమైన ఆధునిక తెలుగు కథనశైలిలో వ్యక్తపరుస్తుంది.
- source_word: מֶלֶךְ סְדֹם
  choice: సొదొమ రాజు
  rationale: హీబ్రూ సంబంధ నిర్మాణాన్ని సహజమైన తెలుగు పదక్రమంలో అందిస్తుంది; స్థలనామాన్ని లిప్యంతరీకరించింది.
- source_word: לִקְרָאתוֹ
  choice: అతనిని కలుసుకోవడానికి
  rationale: ఎదురుగా వెళ్లి కలుసుకోవడం అనే హీబ్రూ నుడికారానికి స్పష్టమైన, సహజమైన తెలుగు సమానం.
- source_word: אַחֲרֵי שׁוּבוֹ
  choice: అతడు తిరిగి వచ్చిన తర్వాత
  rationale: సంబంధిత వ్యక్తిని వచనం పేరుతో నిర్ధారించకుండా, మూలంలోని పురుష ఏకవచన సూచనను నిలుపుతుంది.
- source_word: מֵהַכּוֹת
  choice: ఓడించి
  rationale: ఈ యుద్ధ సందర్భంలో נכה హిఫీల్ రూపం కొట్టడం మాత్రమే కాక సైనికంగా జయించడాన్ని సూచిస్తుంది.
- source_word: כְּדָרלָעֹמֶר
  choice: కెదొర్లాయోమెరు
  rationale: హీబ్రూ పేరును తెలుగు ధ్వన్యనుకూలంగా నేరుగా లిప్యంతరీకరిస్తుంది.
- source_word: וְאֶת הַמְּלָכִים אֲשֶׁר אִתּוֹ
  choice: అతనితో ఉన్న రాజులను
  rationale: సంబంధ వాక్యాన్ని సహజమైన తెలుగులో అందిస్తూ, ఇక్కడి ‘అతను’ కెదొర్లాయోమెరును సూచించే విధంగా సమీప సంబంధాన్ని కాపాడుతుంది.
- source_word: אֶל עֵמֶק שָׁוֵה
  choice: షావే లోయకు
  rationale: אֶל లోని దిశార్థాన్ని ‘లోయకు’ ద్వారా కాపాడి, స్థలనామాన్ని లిప్యంతరీకరిస్తుంది.
- source_word: הוּא עֵמֶק הַמֶּלֶךְ
  choice: అదే రాజు లోయ
  rationale: ముందు పేర్కొన్న ప్రదేశాన్ని గుర్తించే హీబ్రూ వివరణాత్మక వాక్యాన్ని సంక్షిప్తంగా, సహజంగా అందిస్తుంది.
theological_decisions:
- issue: שׁוּבוֹ లోని ‘అతడు’ ఎవరిని సూచిస్తాడు?
  choice: ‘అతడు’ అనే సర్వనామాన్నే ఉంచడం
  alternative: ‘అబ్రాము తిరిగి వచ్చిన తర్వాత’ అని పేరును చేర్చడం
  rationale: సందర్భంలో అబ్రామే ఉద్దేశించబడినప్పటికీ, ఈ వచనంలోని హీబ్రూ మూలం పేరును చెప్పదు. కాబట్టి అనవసరంగా స్పష్టీకరించకుండా మూలంలోని సూచనను నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథనశైలి ఉపయోగించబడింది. పొడవైన హీబ్రూ వాక్యాన్ని చదవడానికి సులభంగా ఉంచుతూ, సంఘటనల క్రమం, దిశార్థం, సర్వనామంలోని స్వల్ప అస్పష్టత కాపాడబడ్డాయి.
