translation:
  language: te
  text: వీరందరూ సిద్దీము లోయకు కలిసారు; అదే ఉప్పు సముద్రం[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: తరువాతి కాలపు పేరుతో, మృత సముద్రం.
    reason: హెబ్రీ మూలంలోని ‘ఉప్పు సముద్రం’ అనే పేరును ప్రధాన పాఠ్యంలో నిలుపుతూ, ప్రసిద్ధ తరువాతి భౌగోళిక పేరును ప్రత్యామ్నాయ గుర్తింపుగా తెలియజేస్తుంది.
lexical_decisions:
- source_word: כָּל אֵלֶּה
  choice: వీరందరూ
  rationale: సూచక సర్వనామంతో కూడిన సమూహార్థాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; సందర్భంలోని ‘రాజులు’ అనే నామవాచకాన్ని మూలంలో లేకపోవడంతో చేర్చలేదు.
- source_word: חָבְרוּ
  choice: ఒక్కటయ్యారు
  rationale: Qal రూపంలోని చేరడం, కలవడం అనే ప్రాథమిక భావాన్ని తెలియజేస్తుంది; ‘కూటమి కట్టారు’ అనేది మూలం కంటే ఎక్కువ రాజకీయ-సైనిక అర్థాన్ని నిర్దిష్టం చేస్తుంది.
- source_word: אֶל
  choice: వద్ద
  rationale: చేరడాన్ని సూచించే క్రియతో స్థలాన్ని తెలిపే ఈ సందర్భంలో ‘వద్ద’ సహజమైన తెలుగు; హెబ్రీలోని దిశార్థక పూర్వప్రత్యయాన్ని యాంత్రికంగా ‘కు’ అని అనువదించలేదు.
- source_word: עֵמֶק הַשִּׂדִּים
  choice: సిద్దీము లోయ
  rationale: עֵמֶק ను ‘లోయ’గా అనువదించి, సిద్దీము అనే స్థలనామాన్ని లిప్యంతరీకరించింది.
- source_word: הוּא
  choice: అంటే
  rationale: ముందు చెప్పిన ప్రదేశాన్ని మరో పేరుతో గుర్తించే వివరణాత్మక సమానాధికార భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: יָם הַמֶּלַח
  choice: ఉప్పు సముద్రం
  rationale: హెబ్రీ పదబంధంలోని ‘ఉప్పు సముద్రం’ అనే ప్రత్యక్ష అర్థాన్ని నిలుపుతుంది; తరువాతి కాలంలో ప్రసిద్ధమైన ‘మృత సముద్రం’ పేరును పాదసూచికలో ఇచ్చింది.
