  text: וַֽ/יְבָרְכֵ֖/הוּ וַ/יֹּאמַ֑ר בָּר֤וּךְ אַבְרָם֙ לְ/אֵ֣ל עֶלְי֔וֹן קֹנֵ֖ה שָׁמַ֥יִם וָ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/019.yaml
  text: And he blessed him and said[a], “Blessed be Abram by God Most High[b], possessor of heaven and earth.”
translation:
  language: te
  text: 'అతడు అబ్రామును ఆశీర్వదించి ఇలా అన్నాడు: “ఆకాశానికీ[b] భూమికీ యజమానియైన[a] సర్వోన్నత దేవునిచేత అబ్రాము ఆశీర్వదించబడుగాక.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఆకాశానికీ భూమికీ సృష్టికర్త.” హీబ్రూ పదానికి “యజమాని,” “స్వామి,” లేదా సందర్భాన్ని బట్టి “సృష్టికర్త” అనే అర్థాలు ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా “ఆకాశాలకూ భూమికీ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבָרְכֵהוּ וַיֹּאמַר
  choice: అతడు అబ్రామును ఆశీర్వదిస్తూ ఇలా అన్నాడు
  rationale: హీబ్రూ వరుస కథన క్రియలను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది. కర్మ సర్వనామం సందర్భానుసారం అబ్రామును సూచిస్తున్నందున పేరు స్పష్టంగా ఇవ్వబడింది.
- source_word: בָּרוּךְ אַבְרָם
  choice: అబ్రాము ఆశీర్వదించబడుగాక
  rationale: ఇది ఆశీర్వాద సూత్రంలోని విధ్యర్థక భావాన్ని గౌరవప్రదమైన, సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: לְאֵל עֶלְיוֹן
  choice: సర్వోన్నత దేవునిచేత
  rationale: లామెద్ విభక్తి ఇక్కడ ఆశీర్వాదానికి దేవుడే మూలమని సూచించే పఠనాన్ని సహజంగా తెలియజేస్తుంది; עֶלְיוֹן అనే దైవ బిరుదును ‘సర్వోన్నత’గా నిలుపుతుంది.
- source_word: קֹנֵה
  choice: అధిపతి
  rationale: ఈ పదానికి సొంతదారుడు, అధిపతి, సంపాదించినవాడు, సందర్భానుసారం సృష్టికర్త అనే భావాలు ఉండవచ్చు. ‘అధిపతి’ ప్రధాన పాఠ్యంలో స్వాధీనత/యాజమాన్య భావాన్ని సహజంగా ఉంచుతుంది; ‘సృష్టికర్త’ అనే సాధ్యమైన అర్థం పాదసూచికలో భద్రపరచబడింది.
- source_word: שָׁמַיִם וָאָרֶץ
  choice: ఆకాశానికీ భూమికీ
  rationale: సమస్త సృష్టిని సూచించే ప్రామాణిక ద్వంద్వప్రయోగాన్ని తెలుగులో సహజంగా అందిస్తుంది. שָׁמַיִם రూపపరంగా బహువచనం కావడం పాదసూచికలో సూచించబడింది.
theological_decisions:
- issue: దైవ బిరుదులో קֹנֵה పదం యొక్క అర్థం
  choice: ఆకాశానికీ భూమికీ అధిపతి
  alternative: ఆకాశానికీ భూమికీ సృష్టికర్త
  rationale: קנה అనే మూలపదం సంపాదించడం, కలిగి ఉండడం లేదా స్వాధీనపరచుకోవడం అనే భావాలను, కొన్ని సందర్భాల్లో సృష్టించడం అనే భావాన్ని కూడా ఇవ్వగలదు. ప్రధాన పాఠ్యం యాజమాన్య/అధికార భావాన్ని నిలుపుతూ, సృష్టికర్త అనే ముఖ్యమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచి అసలు భాషలోని అర్థ విస్తృతిని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా ఉండి, ఆశీర్వాద వాక్యానికి తగిన గౌరవప్రదమైన శైలి నిలుపబడింది. అసలు హీబ్రూలోని క్రమాన్ని యాంత్రికంగా అనుకరించకుండా తెలుగులో సహజమైన వాక్యక్రమం వాడబడింది.
