  to: 'అతడు అబ్రామును ఆశీర్వదించి ఇలా అన్నాడు: “ఆకాశానికీ[b] భూమికీ యజమానియైన[a] సర్వోన్నత దేవునిచేత అబ్రాము ఆశీర్వదించబడుగాక.”'
