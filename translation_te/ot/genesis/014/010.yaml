  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/עֵ֣מֶק הַ/שִׂדִּ֗ים בֶּֽאֱרֹ֤ת בֶּאֱרֹת֙ חֵמָ֔ר וַ/יָּנֻ֛סוּ מֶֽלֶךְ סְדֹ֥ם וַ/עֲמֹרָ֖ה וַ/יִּפְּלוּ שָׁ֑מָּ/ה וְ/הַ/נִּשְׁאָרִ֖ים הֶ֥רָ/ה נָּֽסוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/010.yaml
  text: The Valley of Siddim was full of bitumen pits[a], and the kings of Sodom and Gomorrah fled and fell there[c][b], while the rest fled to the hill country.
translation:
  language: te
  text: సిద్దీము లోయ తారు గుంటలతో నిండి ఉంది[a], సొదొమ, గొమొర్రాల రాజులు పారిపోయి అక్కడ పడిపోయారు[b]; మిగిలినవారు కొండప్రాంతానికి[c] పారిపోయారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘బిటుమెన్ గుంటలు’ లేదా ‘ఆస్ఫాల్ట్ గుంటలు’; హీబ్రూ పదం బిటుమెన్‌ను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అంటే, వారు సిద్దీము లోయలో అక్కడ పడిపోయారు; బహుశా తారు గుంటల్లో పడ్డారనే భావం కావచ్చు. అయితే హీబ్రూ పాఠం గుంటలను స్పష్టంగా పేర్కొనదు.
    reason: ambiguity_preservation
  - marker: c
    text: లేదా ‘కొండలకు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵמֶק הַשִּׂדִּים
  choice: సిద్దీము లోయ
  rationale: עֵמֶק అంటే ‘లోయ’; הַשִּׂדִּים ఆ లోయను గుర్తించే స్థలనామం. ఆధునిక తెలుగులో సహజమైన స్థలనామ నిర్మాణాన్ని వాడాం.
- source_word: בֶּאֱרֹת בֶּאֱרֹת חֵמָר
  choice: తారు గుంటలతో నిండివుంది
  rationale: ‘గుంటలు’ అనే పదం పునరుక్తి కావడం అక్కడ అవి విస్తారంగా ఉన్నాయని సూచిస్తుంది. חֵמָר ఖనిజ తారు లేదా బిటుమెన్‌ను సూచిస్తుంది; సాధారణ పాఠకునికి ‘తారు’ సహజంగా అర్థమవుతుంది.
- source_word: וַיָּנֻסוּ
  choice: పారిపోయి
  rationale: యుద్ధం నుంచి తప్పించుకొని పోవడాన్ని తెలిపే נוס క్రియకు సందర్భానుకూలమైన సహజ తెలుగు రూపం.
- source_word: מֶלֶךְ סְדֹם וַעֲמֹרָה
  choice: సొదొమ, గొమొర్రాల రాజులు
  rationale: מֶלֶךְ ఏకవచన రూపంలో ఉన్నా, దానికి సంబంధించిన క్రియలు బహువచనంలో ఉన్నాయి; కథా సందర్భంలో రెండు పట్టణాలకు వేర్వేరు రాజులు ఉన్నారు.
- source_word: וַיִּפְּלוּ שָׁמָּה
  choice: అక్కడ పడిపోయారు
  rationale: נפל యొక్క ప్రాథమిక అర్థమైన ‘పడిపోవడం’ను నిలిపాం. వారు గుంటల్లో పడ్డారని సందర్భం సూచించవచ్చు గాని, హీబ్రూ వాక్యంలో గుంటలను ప్రత్యక్ష కర్మగా పేర్కొనలేదు.
- source_word: וְהַנִּשְׁאָרִים
  choice: మిగిలినవారు
  rationale: ఇతరుల తరువాత మిగిలిన వారిని సూచించే స్పష్టమైన, సహజమైన తెలుగు పదం.
- source_word: הֶרָה
  choice: కొండప్రాంతానికి
  rationale: הַר పదానికి దిశను తెలిపే ప్రత్యయం జతైంది. సందర్భంలో ‘కొండప్రాంతానికి’ సహజంగా ఉంటుంది; ‘కొండలకు’ అనే అర్థమూ సాధ్యమే.
- source_word: נָסוּ
  choice: పారిపోయారు
  rationale: ముందటి נוס క్రియతో ఏకరీతిని కాపాడుతూ సహజమైన కథన శైలిని అందిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథన శైలిని వాడాం. ‘అక్కడ పడిపోయారు’ అనే మాటలోని మూలపాఠపు అస్పష్టతను ప్రధాన పాఠంలో అలాగే నిలిపాం; సందర్భం సూచించే అవకాశాన్ని పాదసూచికలో మాత్రమే తెలిపాం.
