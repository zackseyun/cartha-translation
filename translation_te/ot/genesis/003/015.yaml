  naturalness: ‘నీకూ స్త్రీకీ మధ్య, నీ సంతానానికీ ఆమె సంతానానికీ మధ్య’ అనే రూపం స్పష్టంగా, గంభీరంగా, సహజంగా ఉంటుంది. ‘నలిపివేస్తాడు’ సాధారణ ఆధునిక తెలుగులో ‘crush’ భావాన్ని సరిగా అందిస్తుంది.
