  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אֵיבָ֣ה אָשִׁ֗ית בֵּֽינְ/ךָ֙ וּ/בֵ֣ין הָֽ/אִשָּׁ֔ה וּ/בֵ֥ין זַרְעֲ/ךָ֖ וּ/בֵ֣ין זַרְעָ֑/הּ ה֚וּא יְשׁוּפְ/ךָ֣ רֹ֔אשׁ וְ/אַתָּ֖ה תְּשׁוּפֶ֥/נּוּ עָקֵֽב׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/015.yaml
  text: And I will put enmity[a] between you and the woman, and between your seed[b] and her seed; he will crush your head[c][d], and you will bruise his heel.
translation:
  language: te
  text: నీకూ స్త్రీకీ మధ్య, నీ సంతానానికీ ఆమె సంతానానికీ మధ్య నేను వైరం[a] కలిగిస్తాను. అతడు[c] నీ తలను నలిపివేస్తాడు[d]; నీవు అతని మడమను గాయపరుస్తావు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘శత్రుత్వం.’
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘అది.’ సమష్టి నామవాచకమైన ‘విత్తనం’ తరువాత హీబ్రూలో పుంలింగ ఏకవచన సర్వనామం ఉంది.
    reason: alternative_reading
  - marker: d
    text: రెండు భాగాల్లోనూ హీబ్రూలో ఒకే క్రియ ఉంది. దానిని ‘గాయపరచు’ లేదా ‘కొట్టు’ అని కూడా అనువదించవచ్చు; తలకు తగిలే దెబ్బ మరింత తీవ్రమని సందర్భం సూచిస్తున్నందున మొదటి భాగంలో ‘నలిపివేయు’ అని అనువదించాం.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵיבָה
  choice: వైరం
  rationale: ఈ పదం క్రియాశీలమైన, కొనసాగుతున్న విరోధాన్ని సూచిస్తుంది. ఆధునిక ప్రామాణిక తెలుగులో ‘వైరం’ సహజంగా, గంభీరంగా ఉండి మూలపద బలాన్ని నిలుపుతుంది.
- source_word: אָשִׁית
  choice: కలిగిస్తాను
  rationale: మూలంలో అక్షరార్థంగా ‘ఉంచుతాను/నియమిస్తాను’ అనే భావం ఉంది. ‘వైరం ఉంచుతాను’ కంటే ‘వైరం కలిగిస్తాను’ తెలుగులో సహజంగా ఉండి, దేవుడే ఆ విరోధాన్ని ఏర్పరుస్తాడనే భావాన్ని తెలియజేస్తుంది.
- source_word: בֵּינְךָ ... וּבֵין הָאִשָּׁה
  choice: నీకు స్త్రీకి మధ్య
  rationale: సంబంధాన్ని చూపే మూల నిర్మాణాన్ని స్పష్టమైన తెలుగు రూపంలో నిలుపుతుంది.
- source_word: זַרְעֲךָ ... זַרְעָהּ
  choice: నీ సంతానం ... ఆమె సంతానం
  rationale: తెలుగులో ‘సంతానం’ సహజంగా వంశాన్ని లేదా వారసులను సమష్టిగా సూచించగలదు; సందర్భానుసారంగా ప్రతినిధియైన ఒక వ్యక్తినీ సూచించగల మూలంలోని విస్తృతిని పాదటిప్పణి వివరిస్తుంది.
- source_word: הוּא
  choice: అతడు
  rationale: మూల హీబ్రూలో సమష్టి నామవాచకమైన ‘విత్తనం/సంతానం’ తరువాత పుంలింగ ఏకవచన సర్వనామం ఉంది. ‘అతడు’ ఆ రూపాన్ని నిలిపి, ఒక ప్రతినిధి వ్యక్తి అనే సాధ్యతను బలవంతంగా సిద్ధాంతీకరించకుండా కనిపించేలా చేస్తుంది.
- source_word: יְשׁוּפְךָ ... תְּשׁוּפֶנּוּ
  choice: నలగగొడతాడు ... గాయపరుస్తావు
  rationale: హీబ్రూలో రెండుచోట్లా ఒకే అరుదైన క్రియ ఉన్నప్పటికీ, తల మరియు మడమ అనే కర్మలు గాయాల తీవ్రతలో అసమానతను సూచిస్తాయి. ప్రధాన పాఠంలో ఆ అసమానతను సహజమైన తెలుగులో వ్యక్తం చేసి, క్రియా పునరావృతాన్ని పాదటిప్పణిలో పారదర్శకంగా తెలిపాం.
- source_word: רֹאשׁ
  choice: తల
  rationale: మూలంలోని శరీరభాగాన్ని నేరుగా, సహజంగా అనువదిస్తుంది.
- source_word: עָקֵב
  choice: మడమ
  rationale: మూలంలోని శరీరభాగాన్ని నేరుగా, సహజంగా అనువదిస్తుంది.
theological_decisions:
- issue: స్త్రీ సంతానం సమష్టిగానూ ఒక ప్రతినిధి వ్యక్తిగానూ అర్థమయ్యే అవకాశాన్ని ఎలా నిలుపాలి
  choice: రెండుచోట్లా ‘సంతానం’ అని అనువదించి, తరువాతి పుంలింగ ఏకవచన సర్వనామాన్ని ‘అతడు’గా ఉంచాం.
  alternative: ‘వారు’ లేదా ‘అది’ అని సమష్టి భావంతో అనువదించడం; లేదా ‘వారసులు’ అని పూర్తిగా బహువచనంగా చేయడం.
  rationale: హీబ్రూలో ఒకే సమష్టి నామవాచకం రెండుసార్లు వచ్చి, తరువాత పుంలింగ ఏకవచన సర్వనామం వస్తుంది. ఈ అనువాదం సమష్టి భావాన్నీ ప్రతినిధి వ్యక్తి సాధ్యతనూ నిలుపుతుంది; నిర్దిష్టమైన మెస్సీయ వ్యాఖ్యానాన్ని అనువాదంలోకి నేరుగా చేర్చదు.
- issue: שׁוּף అనే ఒకే క్రియను రెండు భాగాల్లో ఎంత భిన్నంగా అనువదించాలి
  choice: తల విషయంలో ‘నలగగొడతాడు’, మడమ విషయంలో ‘గాయపరుస్తావు’ అని అనువదించాం.
  alternative: రెండుచోట్లా ‘కొడతాడు/కొడతావు’ లేదా ‘గాయపరుస్తాడు/గాయపరుస్తావు’ అని ఒకే పదంతో అనువదించడం.
  rationale: మూలంలో ఒకే అరుదైన క్రియ పునరావృతమైనా, తలకు తగిలే దెబ్బ మరియు మడమకు తగిలే దెబ్బ ఫలితాల్లోని అసమానత స్పష్టంగా ఉంది. ప్రధాన పాఠం ఆ సందర్భార్థాన్ని చూపుతుంది; పాదటిప్పణి మూలంలోని ఒకే క్రియను దాచదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన వాక్య నిర్మాణం వాడబడింది. ‘నీకు స్త్రీకి మధ్య’ అనే సమాంతర నిర్మాణం మూలంలోని సంబంధ వ్యతిరేకతను నిలుపుతుంది. ‘సంతానం’ సాధారణ పాఠకులకు అర్థమయ్యేలా ఉండి, హీబ్రూ సమష్టి నామవాచకపు విస్తృతిని పాదటిప్పణితో సంరక్షిస్తుంది.
