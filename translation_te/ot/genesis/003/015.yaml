  to: నీకూ స్త్రీకీ మధ్య, నీ సంతానానికీ ఆమె సంతానానికీ మధ్య నేను వైరం[a] కలిగిస్తాను. అతడు[c] నీ తలను నలిపివేస్తాడు[d]; నీవు అతని మడమను గాయపరుస్తావు.
