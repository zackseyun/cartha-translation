id: GEN.3.14
reference: Genesis 3:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ יְהֹוָ֨ה אֱלֹהִ֥ים אֶֽל הַ/נָּחָשׁ֮ כִּ֣י עָשִׂ֣יתָ זֹּאת֒ אָר֤וּר אַתָּה֙ מִ/כָּל הַ/בְּהֵמָ֔ה וּ/מִ/כֹּ֖ל חַיַּ֣ת הַ/שָּׂדֶ֑ה עַל גְּחֹנְ/ךָ֣ תֵלֵ֔ךְ וְ/עָפָ֥ר תֹּאכַ֖ל כָּל יְמֵ֥י חַיֶּֽי/ךָ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/014.yaml
  text: Then Yahweh God said to the serpent[a], “Because you have done this, cursed are you above all livestock and above every beast of the field. On your belly you shall go[b], and dust you shall eat all the days of your life.”
translation:
  language: te
  text: 'అప్పుడు యెహోవా దేవుడు సర్పంతో[a] ఇలా అన్నాడు: “నీవు ఇలా చేసినందువల్ల, పశువులన్నిటికంటే, అడవి జంతువులన్నిటికంటే నీవు ఎక్కువగా శపించబడ్డావు. నీ కడుపుమీద నీవు వెళ్తావు; నీ జీవితకాలమంతా ధూళి తింటావు[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “పాముతో.”'
    reason: lexical_alternative
  - marker: b
    text: “ధూళి తినడం” అవమానం, పరాజయం అనే భావాలకు కూడా చిత్రంగా వాడబడవచ్చు; ఇది కేవలం ఆహారం గురించిన అక్షరార్థ ప్రకటన మాత్రమే కావలసిన అవసరం లేదు.
    reason: cultural_note
lexical_decisions:
- source_word: יְהֹוָה אֱלֹהִים
  choice: యెహోవా దేవుడు
  rationale: దైవనామం–బిరుదు జతను స్పష్టంగా నిలుపుతూ, ఆధునిక తెలుగు బైబిలు పాఠకులకు సహజమైన రూపాన్ని ఉపయోగిస్తుంది.
- source_word: הַנָּחָשׁ
  choice: సర్పం
  rationale: పాము అనే అర్థాన్ని ఇస్తూనే కథనంలోని గంభీరమైన సాహిత్య శైలిని కాపాడుతుంది; ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో తెలిపాం.
- source_word: כִּי עָשִׂיתָ זֹּאת
  choice: నీవు ఇలా చేసినందువల్ల
  rationale: తదుపరి తీర్పుకు కారణాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: אָרוּר אַתָּה מִכָּל הַבְּהֵמָה וּמִכֹּל חַיַּת הַשָּׂדֶה
  choice: పశువులన్నిటికంటే, అడవిలోని జంతువులన్నిటికంటే నీవు ఎక్కువగా శపించబడ్డావు
  rationale: מן యొక్క తులనాత్మక భావాన్ని ‘కంటే’ ద్వారా వ్యక్తం చేసి, పెంపుడు పశువులు–అడవి జంతువులు అనే భేదాన్ని నిలుపుతుంది.
- source_word: עַל גְּחֹנְךָ תֵלֵךְ
  choice: నీ కడుపుతోనే నీవు సాగుతావు
  rationale: మూలంలోని ‘వెళ్లు/సాగు’ అనే సాధారణ క్రియను ‘పాకుతావు’గా సంకుచితం చేయకుండా, కడుపు మీద కదలడాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: וְעָפָר תֹּאכַל
  choice: ధూళి తింటావు
  rationale: మూలంలోని స్పష్టమైన చిత్రణను వ్యాఖ్యానంతో మార్చకుండా నిలుపుతుంది; అవమానం, ఓటమి అనే రూపకసంభావనను పాదటిప్పణిలో సూచిస్తుంది.
- source_word: כָּל יְמֵי חַיֶּיךָ
  choice: నీ జీవితకాలమంతా
  rationale: మొత్తం జీవితం అనే భావాన్ని సంక్షిప్తంగా, గంభీరంగా, సహజ తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: సర్పానికి విధించిన శాపం యొక్క స్వభావం
  choice: ఈ వచనం నేరుగా సంబోధించే సర్పాన్నే ప్రధాన పాఠ్యంలో ఉంచి, శాపాన్ని జీవికి సంబంధించిన స్పష్టమైన పదాలతో అనువదించడం.
  alternative: సర్పాన్ని ప్రధాన పాఠ్యంలోనే సాతానుగా గుర్తిస్తూ వ్యాఖ్యానాత్మక విస్తరణ చేయడం.
  rationale: తరువాతి లేఖనాలు సర్పాన్ని సాతానుతో అనుసంధానించినప్పటికీ, ఈ వచనం స్వయంగా ‘సర్పం’తో మాట్లాడుతుంది. అందువల్ల తరువాతి దైవశాస్త్రీయ గుర్తింపును ప్రధాన పాఠ్యంలోకి ముందుగానే చేర్చకుండా కథనంలోని తక్షణ సూచ్యాన్ని, దాని ఉద్వేగాన్ని కాపాడాం.
- issue: ‘ధూళి తినడం’ యొక్క అర్థం
  choice: ప్రధాన పాఠ్యంలో స్పష్టమైన చిత్రభాషను యథాతథంగా ఉంచడం.
  alternative: ‘నీవు అవమానానికి, ఓటమికి లోనవుతావు’ అని అర్థవివరణతో అనువదించడం.
  rationale: ఈ మాటను శారీరక చిత్రణగా కూడా, అవమానం లేదా పరాజయానికి రూపకంగా కూడా గ్రహించవచ్చు. అనువాదం ఈ సాధ్యార్థాలలో ఒకదానికే పరిమితం చేయకుండా, వివరణను పాదటిప్పణిలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరమైన కథన శైలిని అనుసరించాం. ‘సర్పం’ సాహిత్య గౌరవాన్ని నిలుపుతుంది; ‘పశువులు’ మరియు ‘అడవిలోని జంతువులు’ మూలంలోని వర్గభేదాన్ని స్పష్టంగా చూపుతాయి. వాక్యలయాన్ని తెలుగు సహజత్వానికి అనుగుణంగా మార్చినా, శాపప్రకటనలోని తులనాత్మక బలాన్ని మరియు చిత్రభాషను కాపాడాం.
