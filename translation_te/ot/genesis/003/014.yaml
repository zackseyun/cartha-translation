review_pass:
  verdict: revise
  source_fidelity: The causal clause, comparative curse, and life-long duration are represented accurately. However, “అడవిలోని జంతువులు” specifically suggests animals located in a forest, whereas חַיַּת הַשָּׂדֶה denotes wild animals of the field/open country. “నీ కడుపుతోనే” means ‘with your belly’ rather than the Hebrew locative ‘on your belly.’
  naturalness: The draft has a suitably solemn modern Telugu register. “నీ కడుపుమీద నీవు వెళ్తావు” is both more idiomatic and more exact than “నీ కడుపుతోనే నీవు సాగుతావు.”
  terminology: యెహోవా దేవుడు and సర్పం are established, intelligible Telugu biblical terms and preserve the name-title pairing and elevated narrative register. “అడవి జంతువులు” retains the domestic-animal/wild-animal contrast without introducing the unwarranted setting of a forest.
  issues:
  - severity: medium
    issue: “అడవిలోని జంతువులన్నిటికంటే” narrows the referent.
    rationale: The Hebrew expression refers to wild animals of the field/open country, not specifically animals in a forest. “అడవి జంతువులన్నిటికంటే” expresses the intended category without that spatial restriction.
  - severity: medium
    issue: “నీ కడుపుతోనే” does not convey ‘on your belly.’
    rationale: The preposition עַל is locative. Telugu “నీ కడుపుమీద” accurately conveys this, while retaining the source’s general verb ‘go’ rather than adding ‘crawl.’
