  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּקְרָ֧א הָֽ/אָדָ֛ם שֵׁ֥ם אִשְׁתּ֖/וֹ חַוָּ֑ה כִּ֛י הִ֥וא הָֽיְתָ֖ה אֵ֥ם כָּל חָֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/020.yaml
  text: And the man called his wife's name Eve[b][a], because she was the mother of all the living.
translation:
  language: te
  text: ఆ మనిషి[a] తన భార్యకు హవ్వ అని పేరు పెట్టాడు; ఎందుకంటే ఆమె సజీవులందరికీ తల్లి[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆదాము తన భార్యకు హవ్వ అని పేరు పెట్టాడు.” హెబ్రీయ మూలంలో నిర్దిష్ట ఉపపదంతో “ఆ మనిషి” అని ఉంది.
    reason: alternative_reading
  - marker: b
    text: లేదా, “జీవించి ఉన్న వారందరికీ తల్లి,” లేదా “సమస్త సజీవులకు తల్లి.” హెబ్రీయ మూలంలో అక్షరార్థంగా “అందరు సజీవుల తల్లి” అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: పేరు పెట్టాడు
  rationale: ఈ సందర్భంలో קרא పేరు పెట్టే క్రియను సూచిస్తుంది. తెలుగులో ‘పేరు పెట్టాడు’ సహజంగా ఉండి హెబ్రీయ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: הָאָדָם
  choice: ఆ మనిషి
  rationale: హెబ్రీయ పదానికి నిర్దిష్ట ఉపపదం ఉంది; అందువల్ల ఇక్కడ దాన్ని వ్యక్తినామమైన ‘ఆదాము’గా కాక వర్ణనాత్మకంగా అనువదించాం.
- source_word: אִשְׁתּוֹ
  choice: తన భార్యకు
  rationale: ఈ సందర్భంలో אִשָּׁה ఆ మనిషి భార్యను సూచిస్తుంది; తెలుగు పేరు పెట్టే వాక్యనిర్మాణంలో చతుర్థీ విభక్తి సహజం.
- source_word: חַוָּה
  choice: హవ్వ
  rationale: మూల హెబ్రీయ పేరుకు దగ్గరగా ఉండే, తెలుగులో స్థిరపడిన రూపం.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: పేరు పెట్టడానికి గల కారణాన్ని తెలిపే కారణార్థక సంబంధాన్ని స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: אֵם כָּל חָי
  choice: సజీవులందరికీ తల్లి
  rationale: ‘జీవించి ఉన్న వారందరికీ/సమస్త సజీవులకు తల్లి’ అనే సంక్షిప్త హెబ్రీయ వ్యక్తీకరణను దాని విస్తృతిని అనవసరంగా కుదించకుండా సహజమైన తెలుగులో ఉంచుతుంది.
theological_decisions:
- issue: הָאָדָםను వ్యక్తినామంగా ‘ఆదాము’ అని అనువదించాలా, లేక ‘ఆ మనిషి’ అని అనువదించాలా
  choice: ఆ మనిషి
  alternative: ఆదాము
  rationale: మూలంలో אָדָם ముందు నిర్దిష్ట ఉపపదం ఉండడం వర్ణనాత్మక అర్థానికి బలమిస్తుంది. అయినా ఇది ముందుగా పరిచయమైన అదే వ్యక్తిని సూచిస్తుంది; ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- issue: ‘సజీవులందరికీ తల్లి’ అనే మాట పరిధి
  choice: మూలంలోని విస్తృతమైన పదబంధాన్ని అలాగే నిలిపి ఉంచడం
  alternative: జీవించే మనుషులందరికీ తల్లి / సమస్త జీవరాశులకు తల్లి
  rationale: హెబ్రీయ పదబంధం పరిధిని స్పష్టంగా పరిమితం చేయదు. అందువల్ల అనువాదంలో దాన్ని కేవలం మనుషులకు గానీ అన్ని జీవరాశులకు గానీ నిర్బంధించలేదు.
- issue: הָיְתָה యొక్క స్థితి భావం
  choice: తెలుగు నామవాచక విధేయ వాక్యంలో ‘ఆమె ... తల్లి’ అని వ్యక్తపరచడం
  alternative: తల్లి అయింది
  rationale: ‘తల్లి అయింది’ పరివర్తన భావాన్ని బలంగా సూచించవచ్చు; మూలంలోని היה ఇక్కడ ప్రధానంగా స్థితిని తెలియజేస్తుంది. సహజమైన తెలుగులో సహాయక క్రియ లేకుండానే ఆ స్థితిని వ్యక్తపరచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘ఆ మనిషి’ మూలంలోని నిర్దిష్ట రూపాన్ని నిలుపుతుంది; ‘సజీవులందరికీ’ మూలపదబంధంలోని ఉద్దేశపూర్వక విస్తృతిని కాపాడుతుంది.
