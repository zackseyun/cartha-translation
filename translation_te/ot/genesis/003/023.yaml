  variant: modern standard Telugu
source:
  edition: WLC
  text: וַֽ/יְשַׁלְּחֵ֛/הוּ יְהוָ֥ה אֱלֹהִ֖ים מִ/גַּן עֵ֑דֶן לַֽ/עֲבֹד֙ אֶת הָ֣/אֲדָמָ֔ה אֲשֶׁ֥ר לֻקַּ֖ח מִ/שָּֽׁם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/023.yaml
  text: So Yahweh God sent him out from the garden of Eden to work the ground from which he had been taken[a].
translation:
  language: te
  text: అప్పుడు యాహ్వే దేవుడు అతన్ని ఏదెను తోటలోనుండి పంపివేశాడు—అతడు దేనినుండి తీయబడ్డాడో ఆ నేలను సాగు చేయడానికి[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆ నేలపై పని చేయడానికి.’ హీబ్రూ క్రియకు ‘పనిచేయు,’ ‘సేవచేయు,’ లేదా ఈ సందర్భంలో ‘సాగు చేయు’ అనే అర్థాలు ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְשַׁלְּחֵהוּ
  choice: అతన్ని ... పంపివేశాడు
  rationale: పీయేల్ రూపంలోని שׁלח ఇక్కడ ‘పంపివేయడం/బయటకు పంపడం’ అనే తొలగింపు భావాన్ని ఇస్తుంది. తరువాతి వచనంలోని גרשׁకు తగిన బలమైన ‘తరిమివేశాడు’ అనే భావాన్ని ముందుగానే దిగుమతి చేయకుండా ఈ ఎంపిక మూలపద భేదాన్ని కాపాడుతుంది.
- source_word: יְהוָה אֱלֹהִים
  choice: యెహోవా దేవుడు
  rationale: దైవనామమైన יהוהను ‘యెహోవా’గా లిప్యంతరీకరించి, אֱלֹהִיםను ‘దేవుడు’గా అనువదించడం ద్వారా హీబ్రూ సంయుక్త నామాన్ని నిలుపుతుంది.
- source_word: מִגַּן עֵדֶן
  choice: ఏదేను తోటలోనుండి
  rationale: מִן సూచించే స్థలవియోగాన్ని సహజమైన తెలుగులో ‘తోటలోనుండి’ అని వ్యక్తపరుస్తుంది; עֵדֶןను సంప్రదాయ తెలుగు రూపమైన ‘ఏదేను’గా ఇస్తుంది.
- source_word: לַעֲבֹד
  choice: సాగుచేయడానికి
  rationale: עבדకు ‘పనిచేయు,’ ‘సేవచేయు,’ ‘సాగుచేయు’ అనే అర్థాలు ఉన్నాయి. ‘నేల’ కర్మగా ఉన్న వ్యవసాయ సందర్భంలో ‘సాగుచేయు’ సహజంగా ఉండి ఉద్దేశించిన పనిని స్పష్టపరుస్తుంది; విస్తృతమైన ‘పనిచేయు’ అర్థాన్ని పాదసూచికలో నిలుపుతుంది.
- source_word: אֶת הָאֲדָמָה
  choice: ఆ నేలను
  rationale: אֲדָמָה ఆదికాండము 2–3లో మనిషి తీయబడిన మట్టినేలతో కథన సంబంధాన్ని కలిగి ఉంది. ‘నేల’ సాధారణ ఆధునిక తెలుగులో సహజంగా ఉండి ఆ సంబంధాన్ని కాపాడుతుంది.
- source_word: אֲשֶׁר לֻקַּח מִשָּׁם
  choice: అతడు దేనినుండి తీయబడ్డాడో
  rationale: నిష్క్రియ రూపమైన לֻקַּחను ‘తీయబడ్డాడు’గా నిలిపి, מִשָּׁםను సంబంధవాక్యంతో ‘దేనినుండి’గా అనుసంధానిస్తుంది. ఇది మనిషి ముందుగా నేలనుండి తీయబడిన విషయాన్ని సూచిస్తుంది.
theological_decisions:
- issue: దైవనామం יהוה యొక్క అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే / ప్రభువు
  rationale: మూలపాఠంలో ఉన్న వ్యక్తిగత దైవనామాన్ని సాధారణ బిరుదుతో భర్తీ చేయకుండా స్పష్టంగా ఉంచుతుంది. ఆధునిక తెలుగు బైబిలు పాఠకులకు విస్తృతంగా పరిచయమైన ‘యెహోవా’ రూపాన్ని ఎంచుకుంది.
- issue: మనిషి పనికి అతని మొదటి బాధ్యతతో ఉన్న సంబంధం
  choice: ఆ నేలను సాగుచేయడానికి
  alternative: ఆ నేలపై పనిచేయడానికి / ఆ నేలకు సేవచేయడానికి
  rationale: వచనం చెప్పిన వ్యవసాయ పనిని మాత్రమే వ్యక్తపరుస్తూ, శాపం లేదా విమోచనం గురించి అదనపు సిద్ధాంతార్థాన్ని చేర్చదు. అదే సమయంలో עבד పదంలోని విస్తృత అర్థాన్ని పాదసూచిక గుర్తిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. ‘పంపివేశాడు’ అనే రూపం తొలగింపును తెలియజేస్తూనే తదుపరి వచనంలోని మరింత బలమైన ‘తరిమివేయు’ భావంతో పదభేదాన్ని కాపాడుతుంది. పాదసూచిక గుర్తు [a] ప్రధాన పాఠ్యంలో ఉంచబడింది.
