  terminology: ‘స్త్రీ,’ ‘సర్పం,’ ‘తోట,’ and ‘తినవచ్చు’ are suitable modern-standard Telugu choices. The footnote should state the literal singular more idiomatically as ‘చెట్టు ఫలం నుండి,’ rather than the awkward ‘చెట్టు పండులోనుండి.’
