id: GEN.3.2
reference: Genesis 3:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/תֹּ֥אמֶר הָֽ/אִשָּׁ֖ה אֶל הַ/נָּחָ֑שׁ מִ/פְּרִ֥י עֵֽץ הַ/גָּ֖ן נֹאכֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/002.yaml
  text: And the woman said to the serpent[a], “We may eat from the fruit of the trees of the garden,”
translation:
  language: te
  text: 'ఆ స్త్రీ సర్పంతో ఇలా చెప్పింది: “తోటలోని చెట్ల పండ్లను మేము తినవచ్చు[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “తోటలోని చెట్టు ఫలం నుండి మేము తినవచ్చు.” ఇక్కడ “చెట్టు” సమష్టి అర్థంలో ఉంది; అందువల్ల “చెట్లు” అని అనువదించబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: అప్పుడు ... చెప్పింది
  rationale: వావ్-కన్సిక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది; ఆధునిక తెలుగులో ‘అప్పుడు’ సహజంగా ఆ కథన క్రమాన్ని తెలియజేస్తుంది.
- source_word: הָאִשָּׁה
  choice: స్త్రీ
  rationale: ఇక్కడ పదం ఆమె వైవాహిక పాత్రకన్నా కథలోని స్త్రీని సూచిస్తుంది.
- source_word: אֶל הַנָּחָשׁ
  choice: సర్పంతో
  rationale: తెలుగులో మాట్లాడే వ్యక్తిని సూచించడానికి ‘సర్పంతో ... చెప్పింది’ సహజమైన నిర్మాణం; נָחָשׁకు గంభీర కథన శైలిలో ‘సర్పం’ తగిన సమానార్థకం.
- source_word: מִפְּרִי
  choice: పండ్లు
  rationale: מן మూలం/నుండి అనే భావాన్ని కలిగించినా, ‘తిను’తో ఆధునిక తెలుగులో విభక్తిరహిత కర్మరూపం సహజం; ‘తోటలోని చెట్ల పండ్లు’ మూల సంబంధాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: עֵץ הַגָּן
  choice: తోటలోని చెట్ల
  rationale: עֵץ రూపరీత్యా ఏకవచనమైనా సందర్భంలో సమష్టి/వితరణార్థకంగా ఉంది; తెలుగు బహువచనం ఉద్దేశించిన సాధారణ అనుమతిని స్పష్టపరుస్తుంది.
- source_word: נֹאכֵל
  choice: మేము తినవచ్చు
  rationale: సందర్భంలో అసంపూర్ణ క్రియ అనుమతిని వ్యక్తపరుస్తోంది; ‘తినవచ్చు’ సామర్థ్యంకన్నా అనుమతి భావాన్ని సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: స్త్రీ సమాధానంలో తినడానికి అనుమతించబడిన చెట్లు/పండ్ల పరిధి
  choice: ‘తోటలోని చెట్ల పండ్లు’ అని సాధారణ అనుమతిగా అనువదించడం
  alternative: ‘తోటలోని చెట్టు పండు’
  rationale: హీబ్రూలో עֵץ ఏకవచన రూపంలో ఉన్నప్పటికీ, ఆదికాండం 2:16 నేపథ్యంతో ఇక్కడ సమష్టి/వితరణార్థకం సహజం. బహువచనం వాడటం తరువాతి వచనంలో చెప్పే మినహాయింపుకు ముందు ఒక్క చెట్టే ఉద్దేశించబడిందనే తప్పుదారి పట్టించే భావాన్ని నివారిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే, గౌరవప్రదమైన కథన శైలి. ప్రత్యక్ష సంభాషణలో సహజ తెలుగు పదక్రమం వాడబడింది.
