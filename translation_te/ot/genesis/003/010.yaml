source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר אֶת קֹלְ/ךָ֥ שָׁמַ֖עְתִּי בַּ/גָּ֑ן וָ/אִירָ֛א כִּֽי עֵירֹ֥ם אָנֹ֖כִי וָ/אֵחָבֵֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/010.yaml
  text: And he said[a], “I heard your voice in the garden, and I was afraid because I was naked, so I hid myself.”
translation:
  language: te
  text: అప్పుడు అతడు, “తోటలో నీ శబ్దాన్ని[a] విన్నాను. నేను నగ్నంగా ఉన్నందువల్ల భయపడి దాక్కున్నాను” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేక, “నీ స్వరాన్ని.” హీబ్రూ పదం ‘శబ్దం’ లేదా ‘స్వరం’ అనే రెండు అర్థాలనూ ఇవ్వగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు అతడు ... అన్నాడు
  rationale: హీబ్రూ కథనంలోని wayyiqtol క్రమాన్ని సహజమైన ఆధునిక తెలుగు కథనశైలిలో తెలియజేస్తుంది.
- source_word: אֶת קֹלְךָ
  choice: నీ శబ్దాన్ని
  rationale: קוֹל అనే పదానికి ‘శబ్దం’ లేదా ‘స్వరం’ అనే అర్థాలు ఉండవచ్చు. ఇక్కడ మాటలాడిన స్వరమే అని నిర్బంధించకుండా విస్తృత అర్థాన్ని ప్రధాన పాఠ్యంలో ఉంచుతుంది.
- source_word: שָׁמַעְתִּי
  choice: విన్నాను
  rationale: qal perfect 1cs రూపానికి నేరమైన, సహజమైన తెలుగు అనువాదం.
- source_word: בַּגָּן
  choice: తోటలో
  rationale: ఇప్పటికే సందర్భంలో పరిచయమైన తోటను సూచిస్తుంది; తెలుగులో సందర్భం వల్ల నిర్దిష్టత స్పష్టంగా ఉంటుంది.
- source_word: וָאִירָא
  choice: భయపడి
  rationale: ఆదాము అనుభవించిన భయాన్ని సహజమైన తెలుగు క్రియారూపంలో తెలియజేస్తుంది.
- source_word: כִּי
  choice: ఉన్నందువల్ల
  rationale: నగ్నత్వమే భయానికి కారణమని తెలిపే కారణార్థక సంబంధాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: עֵירֹם אָנֹכִי
  choice: నేను నగ్నంగా ఉన్నందువల్ల
  rationale: హీబ్రూ నామవాచక వాక్యం కాలాన్ని స్వయంగా నిర్దేశించదు; తెలుగు రూపం గత కథన సందర్భానికి సహజంగా సరిపోతూ ‘నగ్నంగా’ అనే అర్థాన్ని నిలుపుతుంది.
- source_word: וָאֵחָבֵא
  choice: దాక్కున్నాను
  rationale: హీబ్రూ క్రియలోని ‘తన్ను తాను దాచుకోవడం’ అనే భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: దేవుని సన్నిధికి సంబంధించి קוֹל పదాన్ని అనువదించడం
  choice: నీ శబ్దాన్ని
  alternative: నీ స్వరాన్ని
  rationale: ఈ హీబ్రూ పదం సాధారణ శబ్దాన్నీ స్వరాన్నీ సూచించగలదు. ఈ చోట పలికిన మాటల స్వరమే అని మూలపాఠ్యం స్పష్టంగా చెప్పదు కాబట్టి విస్తృతమైన పదాన్ని ప్రధాన పాఠ్యంలో ఉంచి, సంప్రదాయ ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనదిగా, అయితే గౌరవప్రదమైన కథనశైలితో రూపొందించబడింది. హీబ్రూ వాక్యక్రమాన్ని యాంత్రికంగా అనుకరించకుండా దాని కారణ–ఫల సంబంధం మరియు పదార్థ సందిగ్ధతను నిలిపింది.
