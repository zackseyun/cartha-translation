reference: Genesis 3:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/תֵּ֣רֶא הָֽ/אִשָּׁ֡ה כִּ֣י טוֹב֩ הָ/עֵ֨ץ לְ/מַאֲכָ֜ל וְ/כִ֧י תַֽאֲוָה ה֣וּא לָ/עֵינַ֗יִם וְ/נֶחְמָ֤ד הָ/עֵץ֙ לְ/הַשְׂכִּ֔יל וַ/תִּקַּ֥ח מִ/פִּרְי֖/וֹ וַ/תֹּאכַ֑ל וַ/תִּתֵּ֧ן גַּם לְ/אִישָׁ֛/הּ עִמָּ֖/הּ וַ/יֹּאכַֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/006.yaml
  text: So the woman saw that the tree was good for food[a], and that it was a delight to the eyes, and that the tree was desirable to make one wise. So she took from its fruit and ate, and she also gave some to her husband, who was with her[b], and he ate.
translation:
  language: te
  text: ఆ స్త్రీ ఆ చెట్టు ఆహారానికి మంచిదనీ, కంటికి ఆకర్షణీయంగా ఉందనీ[a], వివేకం పొందడానికి కోరదగినదనీ[b] చూసింది. అప్పుడు ఆమె దాని ఫలంలో కొంత తీసుకొని తిన్నది. తనతో ఉన్న తన భర్తకు కూడా కొంత ఇచ్చింది; అతడూ తిన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, అక్షరార్థంగా ‘కళ్లకు వాంఛనీయంగా ఉంది.’ హీబ్రూ పదబంధం ఆ చెట్టు చూడడానికి ఆకర్షణీయంగా ఉందనే భావాన్ని నొక్కి చెబుతుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘జ్ఞానిగా చేయడానికి.’ హీబ్రూ పదం వివేకం పొందడం లేదా వివేకవంతునిగా చేయడం అనే భావాన్ని వ్యక్తం చేయగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּרֶא
  choice: చూసింది
  rationale: సాధారణంగా చూడడాన్ని, అలాగే చూసి గ్రహించిన విషయాన్ని తెలిపే కథన క్రియ; అదనపు వ్యాఖ్యానాన్ని చేర్చదు.
- source_word: הָאִשָּׁה
  choice: ఆ స్త్రీ
  rationale: హీబ్రూ కథనంలోని స్త్రీ అనే సూచనను అలాగే ఉంచుతుంది; ఈ దశలో పేరును లేదా కేవలం వైవాహిక పాత్రను ముందుకు తేవదు.
- source_word: טוֹב ... לְמַאֲכָל
  choice: ఆహారానికి మంచిది
  rationale: చెట్టు పండు తినడానికి అనుకూలమని స్త్రీ చేసిన అంచనాను సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: תַאֲוָה הוּא לָעֵינַיִם
  choice: కంటికి ఆకర్షణీయంగా ఉంది
  rationale: హీబ్రూ పదబంధంలోని దృశ్య ఆకర్షణను సహజంగా తెలుపుతుంది; ‘దురాశ’ వంటి ముందస్తు నైతిక రంగును చేర్చదు.
- source_word: וְנֶחְמָד הָעֵץ לְהַשְׂכִּיל
  choice: వివేకం పొందడానికి కోరదగినది
  rationale: చెట్టు కోరదగినదనే భావాన్నీ, שכל హిఫీల్ రూపం సూచించే వివేకం లేదా అవగాహన పొందడాన్నీ నిలుపుతుంది.
- source_word: מִפִּרְיוֹ
  choice: దాని పండులో కొంత
  rationale: מן భావాన్ని సందర్భానుసారంగా సహజ తెలుగులో వ్యక్తం చేస్తూ, ‘పండు’ అనే ఏకవచన సమూహార్థాన్ని నిలుపుతుంది.
- source_word: וַתִּתֵּן גַּם לְאִישָׁהּ עִמָּהּ
  choice: తనతో ఉన్న తన భర్తకు కూడా కొంత ఇచ్చింది
  rationale: ‘ఆమె భర్త/పురుషుడు’ మరియు ‘ఆమెతో’ అనే రెండు వివరాలను స్పష్టంగా, సహజమైన తెలుగు వాక్యనిర్మాణంలో ఉంచుతుంది.
theological_decisions:
- issue: స్త్రీ చెట్టును చూసిన విధానానికి నైతిక రంగు ఇవ్వడం
  choice: ‘మంచిది,’ ‘ఆకర్షణీయంగా,’ ‘కోరదగినది’ అనే తటస్థ మూల్యాంకన పదాలను వాడటం
  alternative: ‘దురాశ పుట్టించేది,’ ‘మోహింపజేసేది’ వంటి బలమైన ప్రతికూల పదాలను వాడటం
  rationale: హీబ్రూ వచనం ముందుగా స్త్రీ దృష్టిలో చెట్టు ఎలా కనిపించిందో సానుకూల మూల్యాంకన పదాలతో వర్ణిస్తుంది. అవిధేయతపై తీర్పును అనువాద పదాల్లో ముందుగానే చొప్పించకూడదు.
- issue: לְהַשְׂכִּיל యొక్క భావం
  choice: ‘వివేకం పొందడానికి’
  alternative: ‘ఒకరిని జ్ఞానిగా చేయడానికి’
  rationale: హీబ్రూ రూపం వివేకం పొందడం లేదా వివేకవంతునిగా చేయడం అనే భావాలకు వీలు కల్పిస్తుంది. ప్రధాన పాఠంలో సహజమైన తెలుగు రూపాన్ని ఎంచుకుని, ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలుపుతున్నాం.
- issue: భర్త అక్కడ ఉన్నాడనే కథన వివరము
  choice: ‘తనతో ఉన్న తన భర్తకు’ అని స్పష్టంగా అనువదించడం
  alternative: ‘తన భర్తకు కూడా’ అని మాత్రమే అనువదించడం
  rationale: עִמָּהּ స్పష్టంగా ‘ఆమెతో’ అని చెబుతుంది; దాన్ని వదలకుండా సహజమైన తెలుగు పదక్రమంలో ఉంచడం కథనంలోని ఉద్రిక్తతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథన శైలి. ‘కంటికి ఆకర్షణీయంగా’ అనే ఏకవచన తెలుగు నుడికారం హీబ్రూ ద్వివచన ‘కళ్లకు’ భావాన్ని సహజంగా అందిస్తుంది. వరుస మూల్యాంకన ఉపవాక్యాలకు ‘అనీ’ నిర్మాణం వాడి హీబ్రూ పునరుక్త నిర్మాణాన్ని చదవదగిన రీతిలో నిలిపాం.
