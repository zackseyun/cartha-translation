  edition: WLC
  text: וַ/יֹּ֥אמֶר הַ/נָּחָ֖שׁ אֶל הָֽ/אִשָּׁ֑ה לֹֽא מ֖וֹת תְּמֻתֽוּ/ן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/004.yaml
  text: But the serpent said to the woman[b][a], “You will not surely die.”
translation:
  language: te
  text: అయితే సర్పం ఆ స్త్రీతో, “మీరు ఎంతమాత్రమూ చనిపోరు.[a]” అని చెప్పింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీలో అక్షరార్థంగా, “చనిపోవడం—మీరు చనిపోరు”; ఈ బలమైన నిర్మాణం ఇక్కడ “మీరు ఎంతమాత్రమూ చనిపోరు” అనే అర్థాన్ని ఇస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అయితే ... చెప్పింది
  rationale: వావ్-కన్సిక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది; ఇక్కడ సర్పం దేవుని హెచ్చరికను నేరుగా వ్యతిరేకిస్తున్నందున ‘అయితే’ సందర్భంలోని విరోధ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: הַנָּחָשׁ
  choice: సర్పం
  rationale: נָחָשׁ అంటే పాము/సర్పం. ఈ కథనంలోని సాహిత్య, ధార్మిక గంభీరతను నిలుపుతూ ఆధునిక ప్రామాణిక తెలుగులో ‘సర్పం’ సహజంగా ఉంది.
- source_word: אֶל הָאִשָּׁה
  choice: ఆ స్త్రీతో
  rationale: మాట్లాడే వ్యక్తి ఎవరితో అన్నది తెలుగులో ‘తో’ సహజంగా వ్యక్తపరుస్తుంది. אִשָּׁה ఇక్కడ ‘భార్య’ కంటే కథనంలో ముందుగా పరిచయమైన ‘ఆ స్త్రీ’ని సూచిస్తుంది.
- source_word: לֹא מוֹת תְּמֻתוּן
  choice: మీరు ఎంతమాత్రమూ చనిపోరు
  rationale: ఇన్ఫినిటివ్ అబ్సల్యూట్‌తో కూడిన క్రియారూపం మరణించడాన్ని బలంగా నొక్కిచెబుతుంది; לֹא మొత్తం నిర్మాణాన్ని నిరాకరిస్తుంది. ‘ఎంతమాత్రమూ ... పోరు’ సర్పం చేసిన సంపూర్ణ, emphatic denialను అస్పష్టత లేకుండా సహజ తెలుగులో ఇస్తుంది. బహువచన ద్వితీయ పురుషాన్ని ‘మీరు’ నిలుపుతుంది.
theological_decisions:
- issue: సర్పం చేసిన నిరాకరణ బలం
  choice: “మీరు ఎంతమాత్రమూ చనిపోరు” అనే ప్రత్యక్షమైన, సంపూర్ణ నిరాకరణ
  alternative: “మీరు తప్పకుండా చనిపోరు” లేదా కేవలం “మీరు చనిపోరు”
  rationale: లֹא + ఇన్ఫినిటివ్ అబ్సల్యూట్ + సమాపక క్రియ నిర్మాణం ఆదికాండం 2:17లోని హెచ్చరికను బలంగా తలకిందులు చేస్తుంది. ‘ఎంతమాత్రమూ’ ఆ విరోధాన్ని స్పష్టంగా ఉంచుతుంది; మరణం తక్షణమా, తరువాతిదా అనే వ్యాఖ్యానాన్ని వాక్యంలోకి చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక, గౌరవప్రదమైన తెలుగు. ‘ఆ స్త్రీ’ కథన సంబంధాన్ని నిలుపుతుంది; ‘మీరు’ మూలంలోని ద్వితీయ పురుష బహువచనాన్ని ప్రతిబింబిస్తుంది. పాదసూచిక గుర్తు సంబంధిత వాక్యం చివర ఉంచబడింది.
