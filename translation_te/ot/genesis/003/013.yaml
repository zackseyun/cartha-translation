  text: וַ/יֹּ֨אמֶר יְהוָ֧ה אֱלֹהִ֛ים לָ/אִשָּׁ֖ה מַה זֹּ֣את עָשִׂ֑ית וַ/תֹּ֨אמֶר֙ הָֽ/אִשָּׁ֔ה הַ/נָּחָ֥שׁ הִשִּׁיאַ֖/נִי וָ/אֹכֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/013.yaml
  text: Then Yahweh God said to the woman[a], “What is this you have done?” And the woman said, “The serpent deceived me, and I ate.”
translation:
  language: te
  text: అప్పుడు యాహ్వే దేవుడు స్త్రీతో, “నువ్వు చేసిన ఈ పని ఏమిటి?” అన్నాడు. స్త్రీ, “సర్పం నన్ను మోసగించింది[a]; నేను తిన్నాను” అని చెప్పింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నన్ను తప్పుదారి పట్టించింది.” హీబ్రూ క్రియ మోసం చేయడం లేదా తప్పుదారి పట్టించడం అనే భావాలను సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పండితపర ఉచ్చారణకు దగ్గరగా తెలుగులో లిప్యంతరీకరించబడింది.
- source_word: אֱלֹהִים
  choice: దేవుడు
  rationale: יְהוָה אֱלֹהִים అనే సంయుక్త ప్రయోగంలో దైవనామంతో సహజంగా జతకట్టే ప్రామాణిక తెలుగు పదం.
- source_word: לָאִשָּׁה
  choice: స్త్రీతో
  rationale: אִשָּׁהకు ‘స్త్రీ’ లేదా ‘భార్య’ అనే అర్థాలు ఉండవచ్చు; ఈ సంభాషణలో కథనం ఆమెను ‘స్త్రీ’గా సూచిస్తున్నందున అదే ఎంచుకోబడింది.
- source_word: מַה זֹּאת עָשִׂית
  choice: నువ్వు చేసిన ఈ పని ఏమిటి?
  rationale: ప్రశ్నార్థక పదం మరియు సూచనార్థక పదం రెండింటి బలాన్ని నిలుపుతూ, ‘ఎందుకు’ అనే కారణార్థాన్ని అనవసరంగా చేర్చని సహజమైన తెలుగు ప్రశ్న.
- source_word: הַנָּחָשׁ
  choice: సర్పం
  rationale: ‘పాము’ కూడా సాధ్యమే; అయితే ఆదికాండము 3లోని సాహిత్య, ధార్మిక సందర్భబలాన్ని ‘సర్పం’ మరింత సముచితంగా నిలుపుతుంది.
- source_word: הִשִּׁיאַנִי
  choice: నన్ను మోసగించింది
  rationale: ఈ క్రియ మోసం చేయడం లేదా తప్పుదారి పట్టించడం అనే భావాన్ని ఇస్తుంది; ‘మోసగించింది’ ఆధునిక పాఠకులకు స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: וָאֹכֵל
  choice: నేను తిన్నాను
  rationale: ముందటి వాక్యంతో అర్ధవిరామం ద్వారా అనుసంధానించి, హీబ్రూ వాక్యక్రమాన్ని నిలుపుతూ ‘అందుకే’ వంటి స్పష్టమైన కారణార్థాన్ని అదనంగా చేర్చలేదు.
theological_decisions:
- issue: స్త్రీ చెప్పిన ప్రకారం సర్పం చేసిన చర్యను ఎలా వ్యక్తపరచాలి
  choice: సర్పం నన్ను మోసగించింది
  alternative: సర్పం నన్ను తప్పుదారి పట్టించింది
  rationale: ‘మోసగించింది’ అనేది హీబ్రూ క్రియలోని మోసం లేదా తప్పుదారి పట్టింపు భావాన్ని స్పష్టంగా తెలియజేస్తుంది; దీనికి మించిన సిద్ధాంతపర వ్యాఖ్యానాన్ని వాక్యంలో చేర్చదు.
- issue: స్త్రీ సమాధానంలోని రెండవ భాగానికి కారణార్థం ఇవ్వాలా
  choice: అర్ధవిరామంతో ‘నేను తిన్నాను’
  alternative: ‘అందుకే నేను తిన్నాను’
  rationale: హీబ్రూలో సంధి ఉంది గాని స్పష్టమైన కారణ సూచిక లేదు. అందువల్ల సంఘటనల సంబంధాన్ని పాఠకుడే గ్రహించేలా ఉంచి, కారణార్థాన్ని బలవంతంగా నిర్ణయించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన కథనశైలి వాడబడింది. సంభాషణలో సహజమైన ఏకవచన ‘నువ్వు’ ఉపయోగించబడింది. మూలంలోని వరుస సంబంధాన్ని అతిగా కారణార్థకంగా మార్చకుండా అర్ధవిరామంతో నిలుపబడింది.
