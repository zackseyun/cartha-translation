id: GEN.3.11
reference: Genesis 3:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר מִ֚י הִגִּ֣יד לְ/ךָ֔ כִּ֥י עֵירֹ֖ם אָ֑תָּה הֲ/מִן הָ/עֵ֗ץ אֲשֶׁ֧ר צִוִּיתִ֛י/ךָ לְ/בִלְתִּ֥י אֲכָל מִמֶּ֖/נּוּ אָכָֽלְתָּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/011.yaml
  text: And he said[b][a], “Who told you that you were naked? Have you eaten from the tree from which I commanded you not to eat?”
translation:
  language: te
  text: 'ఆయన ఇలా అన్నాడు: “నువ్వు నగ్నంగా ఉన్నావని నీకు ఎవరు చెప్పారు? తినవద్దని నేను నీకు ఆజ్ఞాపించిన ఆ చెట్టు నుంచి నువ్వు తిన్నావా?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ వాక్యం చివర అక్షరార్థంగా, “దానినుంచి తిన్నావా?” అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: ఆయన ఇలా అన్నాడు
  rationale: వావ్-క్రమ కథన ప్రవాహాన్ని సహజమైన తెలుగు కథన శైలిలో తెలియజేస్తుంది; ఈ వచనంలో స్పష్టంగా లేని కర్త పేరును చేర్చకుండా పుంలింగ ఏకవచన కర్తను ‘ఆయన’గా ఉంచింది.
- source_word: מִי הִגִּיד לְךָ
  choice: నీకు ఎవరు చెప్పారు?
  rationale: హిఫిల్ రూపంలోని נגד ఇక్కడ ‘తెలియజేయు/చెప్పు’ అనే సాధారణ అర్థంలో ఉంది; ఆధునిక తెలుగులో ‘చెప్పారు’ సహజంగా ఉంటుంది.
- source_word: כִּי עֵירֹם אָתָּה
  choice: నువ్వు నగ్నంగా ఉన్నావని
  rationale: כִּי తెలిపిన విషయాన్ని పరిచయం చేస్తుంది; עֵירֹם బట్టలు లేని స్థితిని సూచిస్తుంది. ‘నగ్నంగా’ ఖచ్చితమైన, గౌరవప్రదమైన పదం.
- source_word: הֲמִן הָעֵץ
  choice: ఆ చెట్టు నుంచి నువ్వు తిన్నావా?
  rationale: ప్రశ్నార్థక ה మరియు מן సంబంధాన్ని తెలుగులో ప్రశ్నా రూపంతో, ‘నుంచి’తో నిలిపింది.
- source_word: אֲשֶׁר צִוִּיתִיךָ לְבִלְתִּי אֲכָל
  choice: తినవద్దని నేను నీకు ఆజ్ఞాపించిన
  rationale: לְבִלְתִּי మరియు క్రియానామం వ్యక్తం చేసే నిషేధాన్ని సహజమైన తెలుగు పరోక్ష వాక్య నిర్మాణంలో అందిస్తుంది.
- source_word: מִמֶּנּוּ אָכָלְתָּ
  choice: ఆ చెట్టు నుంచి నువ్వు తిన్నావా?
  rationale: మూలంలోని ‘దానినుంచి తిన్నావా?’ అనే భావాన్ని తెలుగులో సూచ్యవస్తువైన చెట్టును పునరుద్ఘాటిస్తూ స్పష్టంగా తెలిపింది; మూలంలో లేని ‘పండు’ అనే పదాన్ని చేర్చలేదు.
theological_decisions:
- issue: పుంలింగ ఏకవచన కర్తను గుర్తించడం
  choice: ‘ఆయన’ అని మాత్రమే అనువదించడం
  alternative: ‘యెహోవా దేవుడు’ అని స్పష్టంగా చేర్చడం
  rationale: ముందటి సందర్భంలో కర్త దేవుడే అయినప్పటికీ, ఈ వచనంలోని హీబ్రూ క్రియకు స్పష్టమైన నామకర్త లేదు. అందువల్ల మూలంలో లేని దైవనామాన్ని ఈ వాక్యంలో చేర్చలేదు.
- issue: చెట్టు నుంచి తినడం అనే ప్రయోగం
  choice: ‘ఆ చెట్టు నుంచి ... తిన్నావా?’
  alternative: ‘ఆ చెట్టు పండు తిన్నావా?’
  rationale: ‘పండు’ సందర్భానికి అనుగుణంగా అనిపించినా ఈ వచనంలో ఆ నామవాచకం లేదు. మూలంలోని מן (‘నుంచి’) సంబంధాన్ని నిలిపి, అదనపు వివరాన్ని చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ప్రత్యక్ష సంభాషణ. ఏకవచన ‘నువ్వు/నీకు’ రూపాలు హీబ్రూలోని ద్వితీయ పురుష పుంలింగ ఏకవచనాన్ని ప్రతిబింబిస్తాయి. మూలంలో లేని ‘పండు’ అనే పదాన్ని చేర్చలేదు.
