revisions:
- from: కానీ తోట మధ్యలో ఉన్న చెట్టు పండు గురించి[a] దేవుడు, ‘మీరు దానిలోనిది తినకూడదు; దానిని ముట్టుకోకూడదు; లేకపోతే మీరు చనిపోతారు’ అని చెప్పాడు.
  to: 'కానీ తోట మధ్యలో ఉన్న చెట్టు పండు గురించి[a] దేవుడు ఇలా చెప్పాడు: ‘మీరు దాని నుండి తినకూడదు; దానిని ముట్టుకోకూడదు; లేకపోతే మీరు చనిపోతారు.’'
  rationale: The revision corrects the only substantive Telugu idiom/fidelity issue by rendering מִמֶּנּוּ as ‘దాని నుండి.’ It preserves the contrastive opening, the tree’s location, Eve’s unharmonized added prohibition, the plural address, and the warning force of פֶּן.
