reference: Genesis 3:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/מִ/פְּרִ֣י הָ/עֵץ֮ אֲשֶׁ֣ר בְּ/תוֹךְ הַ/גָּן֒ אָמַ֣ר אֱלֹהִ֗ים לֹ֤א תֹֽאכְלוּ֙ מִמֶּ֔/נּוּ וְ/לֹ֥א תִגְּע֖וּ בּ֑/וֹ פֶּן תְּמֻתֽוּ/ן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/003.yaml
  text: But from the fruit of the tree that is in the middle of the garden[a], God said, ‘You shall not eat from it, and you shall not touch it, lest you die.’
translation:
  language: te
  text: 'కానీ తోట మధ్యలో ఉన్న చెట్టు పండు గురించి[a] దేవుడు ఇలా చెప్పాడు: ‘మీరు దాని నుండి తినకూడదు; దానిని ముట్టుకోకూడదు; లేకపోతే మీరు చనిపోతారు.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘తోట నడుమ ఉన్న చెట్టు పండు గురించి.’
    reason: בְּתוֹךְ కు ‘మధ్యలో’తో పాటు ‘నడుమ’ అనే సహజమైన పదప్రత్యామ్నాయం ఉంది.
lexical_decisions:
- source_word: וּ/מִ/פְּרִי
  choice: కానీ ... పండు గురించి
  rationale: వావ్ సంధి సందర్భంలో 2వ వచనంలోని అనుమతికి వ్యతిరేకమైన భావాన్ని చూపుతుంది; מִן ఉన్న నిర్మాణం తెలుగులో సహజంగా ఉండేందుకు ‘పండు గురించి’ అని ఇచ్చి, తరువాత ‘దానిలోనిది’ ద్వారా మూలంలోని విభక్తి భావాన్ని నిలిపాము.
- source_word: הָעֵץ
  choice: చెట్టు
  rationale: నిర్దిష్టమైన చెట్టును సూచించే సరళమైన సమానార్థకం.
- source_word: אֲשֶׁר בְּתוֹךְ הַגָּן
  choice: తోట మధ్యలో ఉన్న
  rationale: בְּתוֹךְ తోట అంతర్భాగం లేదా మధ్యను సూచిస్తుంది; ఇది ఆధునిక తెలుగులో సహజమైన స్థానవాచక ప్రయోగం.
- source_word: אָמַר אֱלֹהִים
  choice: దేవుడు ... అని చెప్పాడు
  rationale: పూర్వంలో పలికిన మాటను నివేదిస్తున్న qatal రూపాన్ని సహజ తెలుగు ప్రత్యక్ష ఉల్లేఖన నిర్మాణంలో ఇచ్చాము.
- source_word: לֹא תֹאכְלוּ מִמֶּנּוּ
  choice: మీరు దానిలోనిది తినకూడదు
  rationale: నిషేధ ఆజ్ఞ బలాన్ని ‘తినకూడదు’ స్పష్టంగా తెలుపుతుంది; מִן యొక్క ‘నుండి/లోనిది’ భావాన్ని కూడా నిలుపుతుంది.
- source_word: וְלֹא תִגְּעוּ בוֹ
  choice: దానిని ముట్టుకోకూడదు
  rationale: נגע యొక్క సాధారణ అర్థం ‘ముట్టుకొను’; సంధి కలిపే రెండవ నిషేధాన్ని తెలుగులో సహజంగా సెమికోలన్‌తో సమన్వయించాము.
- source_word: פֶּן תְּמֻתוּן
  choice: లేకపోతే మీరు చనిపోతారు
  rationale: פֶּן ఇక్కడ నివారించవలసిన ప్రతికూల పర్యవసానాన్ని సూచిస్తుంది. ‘లేకపోతే’ ఆధునిక పాఠకులకు సహజంగా ఉండి, పర్యవసాన భావాన్ని తెలియజేస్తుంది; మాటలను నేరుగా ఖచ్చితమైన దైవ ప్రకటనగా మార్చకుండా హవ్వ నివేదించిన హెచ్చరికగానే ఉంచుతుంది.
theological_decisions:
- issue: ఆదికాండం 2:17లోని దేవుని ఆజ్ఞతో పోలిస్తే హవ్వ చెప్పిన మాటల్లో ‘దానిని ముట్టుకోకూడదు’ అనే అదనపు నిషేధం ఉంది.
  choice: ఈ వచనంలో హవ్వ చెప్పినట్లుగానే ‘దానిని ముట్టుకోకూడదు’ అని అనువదించాము.
  alternative: ఆదికాండం 2:17కు సరిపోల్చి ఈ మాటలను తొలగించడం లేదా బలహీనపరచడం.
  rationale: హీబ్రూ పాఠంలోని కథనపరమైన, వేదాంతపరమైన ఉద్రిక్తతను సమన్వయం చేసి తొలగించకుండా యథాతథంగా నిలుపాలి.
- issue: פֶּן תְּמֻתוּן లోని పర్యవసాన/నివారణ ఛాయ.
  choice: ‘లేకపోతే మీరు చనిపోతారు’
  alternative: ‘మీరు చనిపోకుండా’ లేదా మరింత ప్రాచీన శైలిలో ‘చనిపోదురేమో’
  rationale: ‘లేకపోతే’ ప్రతికూల పర్యవసానాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది. ఇది హవ్వ నివేదించిన మాటలలోని హెచ్చరికను స్పష్టపరుస్తుంది; అనవసరంగా వాక్యాన్ని అస్పష్టమూ చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలిని వాడాము. ‘ముట్టుకోకూడదు’ అనే హవ్వ అదనపు మాటను సమన్వయం చేయకుండా నిలిపాము. ఉల్లేఖనంలో బహువచన సంబోధనను ‘మీరు’తో ప్రతిబింబించాము.
