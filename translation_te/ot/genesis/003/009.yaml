source:
  edition: WLC
  text: וַ/יִּקְרָ֛א יְהוָ֥ה אֱלֹהִ֖ים אֶל הָֽ/אָדָ֑ם וַ/יֹּ֥אמֶר ל֖/וֹ אַיֶּֽ/כָּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/009.yaml
  text: Then Yahweh God called to the man and said to him[a], “Where are you?”
translation:
  language: te
  text: 'అప్పుడు యాహ్వే[a] దేవుడు ఆ మనిషిని పిలిచి అతనితో ఇలా అన్నాడు: “నువ్వు ఎక్కడ ఉన్నావు?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యెహోవా.”
    reason: తెలుగు బైబిలు సంప్రదాయంలో విస్తృతంగా వాడే దైవనామ రూపాన్ని ప్రత్యామ్నాయంగా తెలియజేయడం.
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: పిలిచి
  rationale: קרא అనే క్రియ యొక్క Qal wayyiqtol రూపం కథన క్రమాన్ని కొనసాగిస్తుంది. సందర్భంలో ‘పిలిచి’ సహజంగా ఉండి, పిలుపు చర్యను స్పష్టంగా తెలియజేస్తుంది.
- source_word: יְהוָה אֱלֹהִים
  choice: యాహ్వే దేవుడు
  rationale: יְהוָה అనే వ్యక్తిగత దైవనామాన్ని దాని సాధారణ పునర్నిర్మిత ఉచ్చారణకు దగ్గరగా ‘యాహ్వే’ అని లిప్యంతరీకరించి, אֱלֹהִים ను ‘దేవుడు’గా అనువదించాం.
- source_word: הָאָדָם
  choice: ఆ మనిషిని
  rationale: ఈ సందర్భంలో הָאָדָם మానవజాతిని సాధారణంగా కాక, తోటలో దేవుడు సంబోధిస్తున్న నిర్దిష్ట పురుషుణ్ణి సూచిస్తుంది. కర్మవిభక్తితో ‘ఆ మనిషిని’ అని ఇచ్చాం.
- source_word: וַיֹּאמֶר לוֹ
  choice: అతనితో … అన్నాడు
  rationale: హీబ్రూ పాఠంలో ఉన్న ‘అతనితో’ అనే పరోక్ష కర్మను నిలిపి, తెలుగు ప్రత్యక్ష సంభాషణకు సహజమైన వాక్యనిర్మాణాన్ని వాడాం.
- source_word: אַיֶּכָּה
  choice: నువ్వు ఎక్కడ ఉన్నావు?
  rationale: ఇది రెండవ పురుష ఏకవచన పుంలింగ సంబోధనతో కూడిన ప్రత్యక్ష స్థానప్రశ్న. ‘నువ్వు’ ఈ వ్యక్తిగత సంబోధనను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: וַ
  choice: అప్పుడు
  rationale: ఆరంభ waw కథనంలోని తదుపరి సంఘటనను సూచిస్తుంది; ‘అప్పుడు’ దాని క్రమబద్ధతను సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా
  rationale: మూలపాఠంలోని నాలుగు అక్షరాల వ్యక్తిగత దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, సాధారణంగా పునర్నిర్మించిన ‘Yahweh’ ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించాం. తెలుగులో సంప్రదాయంగా వాడే ‘యెహోవా’ను పాదసూచికలో ఇచ్చాం.
- issue: הָאָדָם యొక్క సూచిత వ్యక్తి
  choice: ఆ మనిషి
  alternative: మానవుడు / మానవజాతి
  rationale: ఈ కథన సందర్భంలో దేవుడు పాపం చేసిన తర్వాత తోటలోని నిర్దిష్ట పురుషుణ్ణి పిలుస్తున్నాడు; అందువల్ల సాధారణ మానవజాతి అర్థాన్ని ఇక్కడ ఎంచుకోలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన కథనశైలిని వాడాం. దేవుడు మనిషిని నేరుగా సంబోధిస్తున్నందున ‘నువ్వు’ సహజంగా ఉంది; ఇది అవమానార్థకం కాదు. మూలంలోని ‘అతనితో’ అనే అంశాన్ని విడిచిపెట్టకుండా ఉంచాం.
