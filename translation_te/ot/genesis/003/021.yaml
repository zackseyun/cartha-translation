id: GEN.3.21
reference: Genesis 3:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּעַשׂ֩ יְהוָ֨ה אֱלֹהִ֜ים לְ/אָדָ֧ם וּ/לְ/אִשְׁתּ֛/וֹ כָּתְנ֥וֹת ע֖וֹר וַ/יַּלְבִּשֵֽׁ/ם׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/021.yaml
  text: And Yahweh God made garments of skin for the man and for his wife[b][a], and clothed them.
translation:
  language: te
  text: యాహ్వే దేవుడు ఆ మనిషికి[a], అతని భార్యకు చర్మపు వస్త్రాలు[b] చేసి, వారికి తొడిగాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆదాముకు.” హీబ్రూ אָדָם సందర్భాన్ని బట్టి “మనిషి” అనే సామాన్య నామవాచకంగానూ, “ఆదాము” అనే వ్యక్తినామంగానూ వాడవచ్చు.
    reason: alternative_reading
  - marker: b
    text: లేదా, “చర్మపు అంగీలు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, సాధారణంగా పునర్నిర్మించబడిన ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: אֱלֹהִים
  choice: దేవుడు
  rationale: יְהוָהతో కలిసి ఇక్కడ దేవుని గుర్తింపును తెలిపే సహప్రయోగంగా ఉంది.
- source_word: לְאָדָם
  choice: ఆ మనిషికి
  rationale: ఈ సందర్భంలో తన భార్యతో జతగా ప్రస్తావించబడిన పురుష మానవుణ్ణి సూచిస్తుంది; అయితే ‘ఆదాము’ అనే పేరుగా చదివే అవకాశాన్ని పాదసూచికలో ఉంచాం.
- source_word: וּלְאִשְׁתּוֹ
  choice: అతని భార్యకు
  rationale: మూడవ పురుష ఏకవచన ప్రత్యయంతో ఉన్న אִשָּׁה ఈ వైవాహిక సందర్భంలో సహజంగా ‘అతని భార్య’ అని అర్థమిస్తుంది.
- source_word: כָּתְנוֹת
  choice: వస్త్రాలు
  rationale: శరీరాన్ని కప్పే అంగీలు లేదా వస్త్రాలను సూచించే పదం; ప్రధాన పాఠంలో సహజమైన విస్తృత పదాన్ని, మరింత నిర్దిష్టమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: עוֹר
  choice: చర్మపు
  rationale: עוֹר అంటే చర్మం లేదా తోలు; పదార్థాన్ని నేరుగా తెలియజేస్తూ అది ఏ జీవి చర్మమో పాఠంలో లేని వివరాన్ని చేర్చదు.
- source_word: וַיַּעַשׂ
  choice: చేసి
  rationale: עשה అనే సాధారణ ‘చేయు/తయారుచేయు’ క్రియను సందర్భానుసారంగా సహజంగా అనువదించాం.
- source_word: וַיַּלְבִּשֵׁם
  choice: వారికి తొడిగాడు
  rationale: לבש హిఫీల్ రూపం ‘ధరింపజేయడం/తొడగడం’ అనే భావాన్ని ఇస్తుంది; యాహ్వే వారిని వస్త్రధారులుగా చేసిన చర్యను తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: אָדָםను వ్యక్తినామంగా అనువదించాలా, సామాన్య నామవాచకంగా అనువదించాలా
  choice: ‘ఆ మనిషి’ అనే సామాన్య నామవాచక పఠనం
  alternative: ‘ఆదాము’ అనే వ్యక్తినామ పఠనం
  rationale: ఈ కథన దశలో ఆ పదం ‘అతని భార్య’కు ఎదురుగా నిర్దిష్ట పురుషుణ్ణి సూచిస్తూ సామాన్య నామవాచక భావాన్ని నిలుపుతుంది. అయినా హీబ్రూ రూపం వ్యక్తినామంగా కూడా అర్థమయ్యే సాహిత్యపరమైన సందిగ్ధతను పాదసూచికలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనా గౌరవప్రదమైన కథన శైలిని వాడాం. మూలంలోని రెండు వరుస క్రియలను ‘చేసి, ... తొడిగాడు’గా సహజంగా కలిపి, దైవనామాన్ని ‘యాహ్వే’గా నిలిపాం.
