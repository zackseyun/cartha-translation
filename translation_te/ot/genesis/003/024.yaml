source:
  edition: WLC
  text: וַ/יְגָ֖רֶשׁ אֶת הָֽ/אָדָ֑ם וַ/יַּשְׁכֵּן֩ מִ/קֶּ֨דֶם לְ/גַן עֵ֜דֶן אֶת הַ/כְּרֻבִ֗ים וְ/אֵ֨ת לַ֤הַט הַ/חֶ֨רֶב֙ הַ/מִּתְהַפֶּ֔כֶת לִ/שְׁמֹ֕ר אֶת דֶּ֖רֶךְ עֵ֥ץ הַֽ/חַיִּֽים־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/024.yaml
  text: So he drove out the man[a], and to the east of the garden of Eden he stationed the cherubim and the flame of the sword that turns every way[b], to guard the way to the tree of life.
translation:
  language: te
  text: ఆ విధంగా ఆయన ఆ మనిషిని వెళ్లగొట్టాడు. జీవవృక్షానికి వెళ్లే మార్గాన్ని కాపాడడానికి ఏదెన్ తోటకు తూర్పున కెరూబులను, అన్ని వైపులకూ తిరిగే ఖడ్గజ్వాలను[a] నిలిపాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: సాంప్రదాయంగా ‘అన్ని వైపులకూ తిరిగే అగ్నిఖడ్గం’ అని అనువదిస్తారు. హెబ్రీలో మరింత అక్షరార్థంగా ‘తనంతట తాను తిరిగే ఖడ్గపు జ్వాల’ అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְגָרֶשׁ
  choice: వెళ్లగొట్టాడు
  rationale: גרשׁ బలవంతంగా బయటకు పంపడాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘వెళ్లగొట్టాడు’ సహజంగా ఉండి ఆ బలాన్ని నిలుపుతుంది.
- source_word: הָאָדָם
  choice: ఆ మనిషిని
  rationale: ఇక్కడ సాధారణ మానవజాతి కాక, ముందటి కథనంలో సృష్టించి తోటలో ఉంచబడిన నిర్దిష్ట వ్యక్తిని సూచిస్తుంది.
- source_word: וַיַּשְׁכֵּן
  choice: నిలిపాడు
  rationale: హిఫిల్ రూపం అక్కడ నివసింపజేయడం లేదా ఒక స్థానంలో ఉంచడాన్ని సూచిస్తుంది; కాపలా సందర్భంలో ‘నిలిపాడు’ సహజంగా సరిపోతుంది.
- source_word: מִקֶּדֶם לְגַן־עֵדֶן
  choice: ఏదెన్ తోటకు తూర్పున
  rationale: ఈ స్థలసూచక పదబంధం తోట తూర్పు వైపు లేదా తూర్పు భాగాన్ని సూచిస్తుంది; తెలుగు పదబంధం ఆ స్వల్ప సందిగ్ధతను అతిగా నిర్ధారించకుండా సహజంగా తెలియజేస్తుంది.
- source_word: הַכְּרֻבִים
  choice: కెరూబులను
  rationale: ప్రత్యేకమైన పరలోక జీవులకు వాడిన హెబ్రీ పదానికి స్థిరమైన లిప్యంతరీకరణ; బహువచనాన్ని తెలుగు విభక్తి ద్వారా తెలియజేస్తుంది.
- source_word: לַהַט הַחֶרֶב הַמִּתְהַפֶּכֶת
  choice: అన్ని వైపులకూ తిరిగే ఖడ్గజ్వాలను
  rationale: ‘ఖడ్గపు జ్వాల, తిరుగుతూ ఉన్నది’ అనే హెబ్రీ నిర్మాణాన్ని సంక్షిప్తంగా, సహజంగా అందిస్తూ జ్వాలకూ ఖడ్గానికీ మధ్యనున్న భావసంబంధాన్ని పూర్తిగా సమతలీకరించదు.
- source_word: לִשְׁמֹר
  choice: కాపాడడానికి
  rationale: שׁמר ఇక్కడ ప్రవేశాన్ని నిరోధిస్తూ కాపలా కాయడాన్ని సూచిస్తుంది.
- source_word: דֶּרֶךְ עֵץ הַחַיִּים
  choice: జీవవృక్షానికి వెళ్లే మార్గాన్ని
  rationale: అక్షరార్థంగా ‘జీవవృక్షపు మార్గం’; తెలుగులో గమ్యాన్ని స్పష్టంగా చెప్పే ఈ రూపం సహజంగా ఉండి భావాన్ని కాపాడుతుంది.
theological_decisions:
- issue: אָדָם పదం ఈ కథన సందర్భంలో ఎవరిని సూచిస్తుంది
  choice: ఆ మనిషి
  alternative: మానవుడు / మానవజాతి
  rationale: ఏదెన్ నుంచి వెళ్లగొట్టబడిన నిర్దిష్ట వ్యక్తినే ఈ వాక్యం తిరిగి సూచిస్తుంది; మానవజాతి అనే సామూహిక భావాన్ని ఇక్కడ చేర్చకూడదు.
- issue: లַהַט הַחֶרֶב నిర్మాణం
  choice: ఖడ్గజ్వాల
  alternative: మండుతున్న ఖడ్గం
  rationale: ‘మండుతున్న ఖడ్గం’ అని మార్చితే హెబ్రీలో ప్రధానంగా ఉన్న ‘జ్వాల’ నామవాచకాన్ని విశేషణంగా మార్చినట్లవుతుంది; ‘ఖడ్గజ్వాల’ అసలు నిర్మాణంలోని ఉద్రిక్తతను ఎక్కువగా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన వాక్యనిర్మాణం, అయితే ‘కెరూబులు,’ ‘ఖడ్గజ్వాల,’ ‘జీవవృక్షం’ వంటి గౌరవప్రదమైన బైబిలు పదజాలం నిలుపబడింది. ప్రధాన వాక్యాన్ని రెండు వాక్యాలుగా విభజించడం తెలుగు పఠనసౌలభ్యానికి ఉపయోగపడుతుంది.
