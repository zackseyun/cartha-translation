id: GEN.3.7
reference: Genesis 3:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/תִּפָּקַ֨חְנָה֙ עֵינֵ֣י שְׁנֵי/הֶ֔ם וַ/יֵּ֣דְע֔וּ כִּ֥י עֵֽירֻמִּ֖ם הֵ֑ם וַֽ/יִּתְפְּרוּ֙ עֲלֵ֣ה תְאֵנָ֔ה וַ/יַּעֲשׂ֥וּ לָ/הֶ֖ם חֲגֹרֹֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/007.yaml
  text: Then the eyes of both of them were opened[a], and they knew that they were naked[b]. So they sewed fig leaves together and made coverings for themselves.
translation:
  language: te
  text: అప్పుడు వారిద్దరి కళ్లూ తెరుచుకున్నాయి; తాము నగ్నంగా ఉన్నామని వారు తెలుసుకున్నారు. వారు అంజూరపు ఆకులను కలిపి కుట్టి, తమ కోసం నడుము కప్పుకునే వస్త్రాలు చేసుకున్నారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నడుము వస్త్రాలు”; హీబ్రూ పదం నడుము చుట్టూ కట్టుకునే కప్పును సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּפָּקַחְנָה
  choice: తెరుచుకున్నాయి
  rationale: కళ్లను ఉద్దేశించిన నిఫాల్ రూపంలోని హీబ్రూ నుడికారాన్ని సహజమైన తెలుగు అకర్మక క్రియతో అందిస్తుంది; వారికి కలిగిన అవగాహన స్వభావాన్ని అదనంగా వ్యాఖ్యానించదు.
- source_word: עֵינֵי שְׁנֵיהֶם
  choice: వారిద్దరి కళ్లూ
  rationale: ఇద్దరికీ ఇది సంభవించిందనే హీబ్రూ ఉద్ఘాటనను సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: וַיֵּדְעוּ
  choice: తెలుసుకున్నారు
  rationale: ידע అనే క్రియ యొక్క ప్రాథమిక అర్థమైన ‘తెలుసుకొను’ను నిలుపుతూ, ‘సిగ్గుపడ్డారు’ లేదా ‘మనస్సాక్షి మేల్కొంది’ వంటి వ్యాఖ్యానాన్ని చేర్చదు.
- source_word: כִּי
  choice: అని
  rationale: వారు తెలుసుకున్న విషయం ఏమిటో తెలిపే ఉపవాక్యాన్ని తెలుగులో సహజంగా పరిచయం చేస్తుంది.
- source_word: עֵירֻמִּם
  choice: నగ్నంగా
  rationale: హీబ్రూ విశేషణానికి నేరమైన, ప్రస్తుత ప్రామాణిక తెలుగు సమానార్థకం; ఆదికాండం 2:25తో ఉన్న కథన సంబంధాన్ని కూడా నిలుపుతుంది.
- source_word: וַיִּתְפְּרוּ
  choice: కుట్టి
  rationale: ఆకులను ఒకదానితో ఒకటి జతచేసే చర్యను సరళంగా, నేరుగా వ్యక్తపరుస్తుంది.
- source_word: עֲלֵה תְאֵנָה
  choice: అంజూరపు ఆకులను
  rationale: హీబ్రూ నిర్మాణానికి సహజమైన తెలుగు రూపం; ‘అంజూరం’ ఆధునిక ప్రామాణిక తెలుగులో fig చెట్టుకు స్పష్టమైన పేరు.
- source_word: וַיַּעֲשׂוּ לָהֶם
  choice: తమ కోసం ... చేసుకున్నారు
  rationale: హీబ్రూలోని ‘తమ కోసం’ అనే స్వప్రయోజన భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: חֲגֹרֹת
  choice: నడుముకు కట్టుకునే కప్పులు
  rationale: ఈ నామవాచకం శరీరం చుట్టూ, ముఖ్యంగా నడుము వద్ద, కట్టుకునే వస్తువులను సూచిస్తుంది. ఖచ్చితమైన వస్త్రరూపాన్ని నిర్ణయించకుండా దాని పని విధానాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: కొత్తగా కలిగిన జ్ఞానానికి సిగ్గు లేదా నైతిక చైతన్యంతో ఉన్న సంబంధం
  choice: కళ్లు తెరుచుకోవడం, తాము నగ్నంగా ఉన్నామని తెలుసుకోవడం, కప్పులు చేసుకోవడం అనే కథన క్రమాన్నే అనువదించడం
  alternative: ‘వారు సిగ్గుపడ్డారు’ లేదా ‘వారి మనస్సాక్షి మేల్కొంది’ అని వ్యాఖ్యానాత్మకంగా అనువదించడం
  rationale: సందర్భం మారిన స్వీయ అవగాహనను, సిగ్గును సూచించినా ఈ వచనం వాటిని ప్రత్యక్షంగా చెప్పదు. అందువల్ల వేదాంతపరమైన ప్రక్రియను అనువాదంలో ముందుగానే నిర్ణయించలేదు.
- issue: חֲגֹרֹת యొక్క ఖచ్చితమైన వస్త్రరూపం
  choice: నడుముకు కట్టుకునే కప్పులు
  alternative: కచ్చలు; నడుము వస్త్రాలు; మొలత్రాళ్లు
  rationale: హీబ్రూ పదం నడుము చుట్టూ కట్టుకునే కప్పును సూచిస్తుంది గాని దాని ఖచ్చితమైన ఆకారాన్ని నిర్దేశించదు. ఎంపిక చేసిన రూపం ఆధునిక పాఠకునికి స్పష్టంగా ఉండి, అతినిర్దిష్టతను నివారిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘మొలత్రాళ్లు’ వంటి పాతకాలపు పదాన్ని నివారించి, మూలంలోని శరీర-కప్పు భావాన్ని వివరణాత్మకమైనప్పటికీ సంక్షిప్తమైన రూపంలో అందించాం.
