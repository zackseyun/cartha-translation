id: GEN.3.5
reference: Genesis 3:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּ֚י יֹדֵ֣עַ אֱלֹהִ֔ים כִּ֗י בְּ/יוֹם֙ אֲכָלְ/כֶ֣ם מִמֶּ֔/נּוּ וְ/נִפְקְח֖וּ עֵֽינֵי/כֶ֑ם וִ/הְיִיתֶם֙ כֵּֽ/אלֹהִ֔ים יֹדְעֵ֖י ט֥וֹב וָ/רָֽע׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/005.yaml
  text: For God knows that on the day you eat from it[a], your eyes will be opened, and you will be like God, knowing good and evil.
translation:
  language: te
  text: ఎందుకంటే, మీరు దాని నుండి తినే రోజున మీ కళ్లు తెరవబడతాయని, మీరు మంచి చెడులను తెలిసినవారై దేవునిలా[a] ఉంటారని దేవునికి తెలుసు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “దేవతల్లా,” లేదా “దైవిక జీవుల్లా.” హీబ్రూ אֱלֹהִים పదానికి కొన్ని సందర్భాల్లో ఈ అర్థాలు కూడా ఉండవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: మునుపటి మాటకు సర్పం ఇస్తున్న కారణాన్ని సహజమైన ఆధునిక తెలుగులో సూచిస్తుంది.
- source_word: יֹדֵעַ אֱלֹהִים
  choice: దేవునికి తెలుసు
  rationale: హీబ్రూ కర్తతో కూడిన వర్తమానార్థక కృదంతాన్ని సహజమైన తెలుగు ప్రయోగంతో వ్యక్తపరుస్తుంది.
- source_word: בְּיוֹם אֲכָלְכֶם מִמֶּנּוּ
  choice: మీరు దాని నుండి తినే రోజున
  rationale: హీబ్రూ కాలసూచక నుడికారాన్ని నిలుపుతుంది; ఇక్కడ ‘రోజు’ అనేది తప్పనిసరిగా 24 గంటల కాలాన్ని కాక, తినే సమయాన్ని సూచించవచ్చు.
- source_word: וְנִפְקְחוּ עֵינֵיכֶם
  choice: మీ కళ్లు తెరవబడతాయని
  rationale: నిఫల్ రూపంలోని కర్మణి భావాన్నీ, గ్రహింపు లేదా అవగాహనకు సంబంధించిన రూపకాన్నీ కాపాడుతుంది.
- source_word: וִהְיִיתֶם
  choice: ఉంటారని
  rationale: ఫలితంగా కలిగే స్థితిని నేరుగా వ్యక్తపరుస్తుంది; ‘అవుతారని’ కూడా సాధ్యమే అయినా, ఈ సందర్భంలో ‘ఉంటారని’ హీబ్రూ వాక్యానికి దగ్గరగా ఉంటుంది.
- source_word: כֵּאלֹהִים
  choice: దేవునిలా
  rationale: సమీప సందర్భంలో אֱלֹהִים ఏకైక దేవుణ్ణి సూచించడం వల్ల ఇది ప్రధాన పాఠ్యానికి అత్యంత సంభావ్యమైన అర్థం; ఇతర నిజమైన అవకాశాలను పాదసూచికలో ఉంచాం.
- source_word: יֹדְעֵי טוֹב וָרָע
  choice: మంచి చెడులను తెలిసినవారై
  rationale: ‘తెలిసినవారు’ అనే కృదంత భావాన్ని కాపాడుతూ, טוֹב וָרָע అనే జంటను సహజమైన, గంభీరమైన తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: כֵּאלֹהִים లోని אֱלֹהִים పదానికి సూచన
  choice: దేవునిలా
  alternative: దేవతల్లా; దైవిక జీవుల్లా
  rationale: తక్షణ సందర్భం దేవుణ్ణి సూచిస్తుంది; అలాగే మంచి చెడులను తెలుసుకోవడం అనే మాట కథనంలో దైవిక జ్ఞానంతో ముడిపడి ఉంది. అయితే హీబ్రూ పదానికి ఇతర సందర్భాల్లో బహువచన లేదా దైవిక జీవుల అర్థం ఉండగలదు కాబట్టి ఆ సందిగ్ధతను పాదసూచికలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గంభీరమైన కానీ సహజమైన శైలి వాడబడింది. హీబ్రూ కాలనుడికారం మరియు కర్మణి రూపకం సాధ్యమైనంతవరకు నిలుపబడ్డాయి; אֱלֹהִים లోని నిజమైన అర్థసందిగ్ధత పాదసూచికలో భద్రపరచబడింది.
