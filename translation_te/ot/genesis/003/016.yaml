id: GEN.3.16
reference: Genesis 3:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אֶֽל הָ/אִשָּׁ֣ה אָמַ֗ר הַרְבָּ֤ה אַרְבֶּה֙ עִצְּבוֹנֵ֣/ךְ וְ/הֵֽרֹנֵ֔/ךְ בְּ/עֶ֖צֶב תֵּֽלְדִ֣י בָנִ֑ים וְ/אֶל אִישֵׁ/ךְ֙ תְּשׁ֣וּקָתֵ֔/ךְ וְ/ה֖וּא יִמְשָׁל בָּֽ/ךְ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/016.yaml
  text: To the woman he said[a], “I will greatly multiply your pain and your conception; in pain you will bear children. Your desire will be for your husband[c][b], and he will rule over you.”
translation:
  language: te
  text: 'ఆ స్త్రీతో ఆయన ఇలా అన్నాడు: “నీ వేదనను, నీ గర్భధారణను నేను ఎంతో అధికం చేస్తాను[a]. వేదనతో నీవు పిల్లలను కంటావు[b]. నీ కోరిక నీ భర్తవైపు ఉంటుంది[c]; అతడు నిన్ను ఏలుతాడు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నీ గర్భావస్థను’ అని కూడా అనువదించవచ్చు. హీబ్రూ పదం గర్భం ధరించడాన్ని లేదా గర్భావస్థను సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థం ‘కుమారులను’; ఇక్కడ సాధారణంగా పిల్లలు లేదా సంతానం అనే భావం ఉండవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: ‘ఆకాంక్ష’ అని కూడా అనువదించవచ్చు. ఈ అరుదైన హీబ్రూ పదం విస్తృతమైన కోరికను సూచించవచ్చు. కొందరు దీన్ని నియంత్రించాలనే కోరికగా (ఆది 4:7తో పోల్చండి), మరికొందరు సంబంధపరమైన లేదా లైంగిక ఆకాంక్షగా అర్థం చేసుకుంటారు.
    reason: alternative_reading
lexical_decisions:
- source_word: הָאִשָּׁה
  choice: ఆ స్త్రీతో
  rationale: తీర్పు సందర్భంలో స్త్రీ మానవిని ఉద్దేశిస్తోంది; తరువాతి אִישֵׁךְ మాత్రం వైవాహిక సంబంధాన్ని స్పష్టంగా సూచిస్తుంది.
- source_word: הַרְבָּה אַרְבֶּה
  choice: నేను ఎంతో అధికం చేస్తాను
  rationale: క్రియావిశేషక అవ్యయరూపం మరియు పరిమిత క్రియ కలయికలోని బలాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: עִצְּבוֹנֵךְ
  choice: నీ ప్రసవ వేదనను
  rationale: పదానికి వేదన, శ్రమ, కష్టం అనే పరిధి ఉంది; పిల్లలను కనడం అనే తక్షణ సందర్భంలో ‘ప్రసవ వేదన’ అర్థాన్ని స్పష్టం చేస్తుంది.
- source_word: וְהֵרֹנֵךְ
  choice: నీ గర్భధారణను
  rationale: హీబ్రూ నామవాచకం గర్భం ధరించడం లేదా గర్భావస్థను సూచించగలదు; ‘గర్భధారణ’ మూలరూపానికి దగ్గరగా ఉండి అస్పష్టతను పాదసూచికలో నిలుపుతుంది.
- source_word: בְּעֶצֶב
  choice: వేదనతో
  rationale: పిల్లలను కనడం ఏ పరిస్థితిలో జరుగుతుందో సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: תֵּלְדִי בָנִים
  choice: నీవు పిల్లలను కంటావు
  rationale: בָנִים అక్షరార్థంగా ‘కుమారులు’; ఇక్కడ సంతానం మొత్తాన్ని సాధారణంగా సూచించడం వల్ల ‘పిల్లలు’ సందర్భోచితం.
- source_word: אִישֵׁךְ
  choice: నీ భర్త
  rationale: స్త్రీతో ఉన్న సంబంధంలో אִישׁ ఇక్కడ సహజంగా ‘భర్త’ అని అర్థమవుతుంది.
- source_word: תְּשׁוּקָתֵךְ
  choice: నీ కోరిక ... వైపు ఉంటుంది
  rationale: అరుదైన ఈ పదంలోని లైంగిక, సంబంధపరమైన లేదా ఆధిపత్య సంబంధిత సాధ్యార్థాలలో ఏదీ ప్రధాన పాఠ్యంలో బలవంతంగా నిర్ణయించకుండా విస్తృత అర్థాన్ని నిలుపుతుంది.
- source_word: יִמְשָׁל בָּךְ
  choice: అతడు నిన్ను ఏలుతాడు
  rationale: పాలించడం లేదా ఏలడం అనే క్రియార్థాన్ని నేరుగా ఇస్తుంది; ‘అణచివేస్తాడు’ వంటి మరింత వ్యాఖ్యానాత్మక పదాన్ని నివారిస్తుంది.
theological_decisions:
- issue: భర్త విషయంలో స్త్రీ ‘కోరిక’కు ఉన్న భావం
  choice: ‘కోరిక’ అనే విస్తృత పదంతో అస్పష్టతను నిలుపడం
  alternative: లైంగిక కోరిక; సంబంధపరమైన ఆకాంక్ష; నియంత్రించాలనే కోరిక
  rationale: תְּשׁוּקָה అరుదైన పదం; సందర్భం ఒక్క భావాన్ని నిర్బంధించదు. అందువల్ల ప్రత్యామ్నాయాలను పాదసూచికలో ఉంచి ప్రధాన పాఠ్యంలో ఉద్రిక్తతను కాపాడాం.
- issue: పురుషుని ఏలుబడి ఆజ్ఞా లేక పతనానంతర పరిస్థితి వర్ణనా
  choice: ‘అతడు నిన్ను ఏలుతాడు’ అని జరగబోయేదాని వర్ణనగా అనువదించడం
  alternative: పురుషాధికారాన్ని విధించే పరోక్ష ఆజ్ఞ
  rationale: హీబ్రూ క్రియారూపం జరగబోయేదాన్ని చెబుతుంది; అది జరగాలి అనే నియమాన్ని స్వతహాగా ప్రకటించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన వాక్యనిర్మాణం వాడబడింది. ‘ఏలుతాడు’ మూలంలోని పాలనా భావాన్ని నిలుపుతూ, ఆజ్ఞాత్మక లేదా సంప్రదాయపరమైన సిద్ధాంతాన్ని అదనంగా చేర్చదు. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
