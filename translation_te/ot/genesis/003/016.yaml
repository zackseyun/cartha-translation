  naturalness: The Telugu is clear, modern, and suitably dignified. ‘నీ వేదనను’ is equally natural and better preserves the source’s breadth. ‘అతడు నిన్ను ఏలుతాడు’ is acceptable in a biblical register and directly conveys rule without adding the stronger sense of oppression.
  terminology: ‘స్త్రీ,’ ‘గర్భధారణ,’ ‘పిల్లలు,’ ‘భర్త,’ and ‘కోరిక’ are appropriate. Retaining ‘కోరిక’ and explaining its possible nuances only in the note properly avoids resolving a disputed interpretation. The footnote markers are all present and correctly attached.
