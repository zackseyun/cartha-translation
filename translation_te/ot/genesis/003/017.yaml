- from: 'ఆదాముతో[a] ఆయన ఇలా అన్నాడు: “నువ్వు నీ భార్య మాట విని, ‘దాని పండు తినకూడదు’ అని నేను నీకు ఆజ్ఞాపించిన చెట్టు పండు తిన్నావు. కాబట్టి నీ కారణంగా నేల శాపానికి గురైంది. నీ జీవితకాలమంతా కష్టప్రయాసతో[b] దాని నుంచి ఆహారం తింటావు.”'
  to: 'ఆదాముతో[a] ఆయన ఇలా అన్నాడు: “నువ్వు నీ భార్య మాట విని, ‘దాని నుండి తినకూడదు’ అని నేను నీకు ఆజ్ఞాపించిన చెట్టు నుండి తిన్నావు కాబట్టి, నీ కారణంగా నేల శపించబడింది. నీ జీవితకాలమంతా కష్టప్రయాసతో[b] దాని నుండి ఆహారం తింటావు.”'
  rationale: The revision removes the unsupported explicit reference to fruit while retaining idiomatic Telugu. It preserves the Hebrew’s causal sequence, the agricultural sense of “ground,” and the contextual implication that food is obtained from the ground. The existing footnotes remain correctly anchored and sufficient for the retained textual alternatives.
