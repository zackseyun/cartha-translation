source:
  edition: WLC
  text: וּ/לְ/אָדָ֣ם אָמַ֗ר כִּֽי שָׁמַעְתָּ֮ לְ/ק֣וֹל אִשְׁתֶּ/ךָ֒ וַ/תֹּ֨אכַל֙ מִן הָ/עֵ֔ץ אֲשֶׁ֤ר צִוִּיתִ֨י/ךָ֙ לֵ/אמֹ֔ר לֹ֥א תֹאכַ֖ל מִמֶּ֑/נּוּ אֲרוּרָ֤ה הָֽ/אֲדָמָה֙ בַּֽ/עֲבוּרֶ֔/ךָ בְּ/עִצָּבוֹן֙ תֹּֽאכֲלֶ֔/נָּה כֹּ֖ל יְמֵ֥י חַיֶּֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/017.yaml
  text: And to Adam he said[a], “Because you listened to the voice of your wife and ate from the tree about which I commanded you, saying, ‘You shall not eat from it,’ the ground is cursed because of you[f][e][d][c][b]; in painful toil you shall eat from it all the days of your life.”
translation:
  language: te
  text: 'ఆదాముతో[a] ఆయన ఇలా అన్నాడు: “నువ్వు నీ భార్య మాట విని, ‘దాని నుండి తినకూడదు’ అని నేను నీకు ఆజ్ఞాపించిన చెట్టు నుండి తిన్నావు కాబట్టి, నీ కారణంగా నేల శపించబడింది. నీ జీవితకాలమంతా కష్టప్రయాసతో[b] దాని నుండి ఆహారం తింటావు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “మనిషితో.”
    reason: alternative_reading
  - marker: b
    text: ఈ హీబ్రూ పదాన్ని “వేదనతో” లేదా “దుఃఖంతో” అని కూడా అనువదించవచ్చు; ఇక్కడ ఆహారం కోసం చేసే కఠిన శ్రమ ప్రధానంగా ఉద్దేశించబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְאָדָם
  choice: ఆదాముతో
  rationale: ఈ కథన సందర్భంలో אָדָם ఒక నిర్దిష్ట వ్యక్తిని సూచిస్తోంది. అయితే ‘మనిషితో’ అనే అర్థసాధ్యతను పాదటిప్పణిలో ఉంచాం.
- source_word: שָׁמַעְתָּ לְקוֹל אִשְׁתֶּךָ
  choice: నీ భార్య మాట విని
  rationale: అక్షరార్థంగా ‘నీ భార్య స్వరాన్ని విన్నావు’ అయినా, ఇక్కడ ఆమె చెప్పిన మాటకు లోబడిన భావం ఉంది. ‘మాట విని’ అనేది సహజమైన తెలుగు; ‘లోబడ్డావు’ అని పెట్టి భావాన్ని మరీ బలంగా నిర్ణయించదు.
- source_word: וַתֹּאכַל מִן הָעֵץ
  choice: చెట్టు పండు తిన్నావు
  rationale: హీబ్రూలో ‘చెట్టు నుంచి తిన్నావు’ అని ఉన్నా, తెలుగులో చెట్టునే తిన్నట్టు అపార్థం రాకుండా సందర్భంలో సూచితమైన పండును స్పష్టం చేశాం.
- source_word: אֲשֶׁר צִוִּיתִיךָ לֵאמֹר לֹא תֹאכַל מִמֶּנּוּ
  choice: ‘దాని పండు తినకూడదు’ అని నేను నీకు ఆజ్ఞాపించిన
  rationale: לֵאמֹר పరిచయం చేసే ఆజ్ఞలోని మాటలను ప్రత్యక్ష ఉక్తిగా ఉంచి, తెలుగు వాక్యనిర్మాణానికి సహజంగా మార్చాం.
- source_word: אֲרוּרָה הָאֲדָמָה
  choice: నేల శాపానికి గురైంది
  rationale: వ్యవసాయ సందర్భంలో אֲדָמָהకు ‘నేల’ సరైనది. హీబ్రూ విధేయ నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేశాం.
- source_word: בַּעֲבוּרֶךָ
  choice: నీ కారణంగా
  rationale: ఇది ఆదాము నిమిత్తంగా లేదా అతని కారణంగా నేలకు వచ్చిన శాపాన్ని సూచిస్తుంది; ప్రయోజనార్థకంగా వినిపించే ‘నీ కోసము’ అనే రూపాన్ని నివారించాం.
- source_word: בְּעִצָּבוֹן
  choice: కష్టప్రయాసతో
  rationale: ఈ పదానికి వేదన, దుఃఖం, కఠిన శ్రమ అనే భావపరిధి ఉంది. ఆహారం కోసం నేలను సాగుచేసే సందర్భంలో ‘కష్టప్రయాసతో’ సహజంగా ప్రధాన భావాన్ని అందిస్తుంది; ప్రత్యామ్నాయ భావాలను పాదటిప్పణిలో పేర్కొన్నాం.
- source_word: תֹּאכֲלֶנָּה
  choice: దాని నుంచి ఆహారం తింటావు
  rationale: స్త్రీలింగ ప్రత్యయం ‘నేల’ను తిరిగి సూచిస్తుంది. మట్టినే తింటాడనే అపార్థం లేకుండా, నేల నుంచి లభించే ఆహారాన్ని తినే భావాన్ని సహజంగా తెలిపాం.
- source_word: כֹּל יְמֵי חַיֶּיךָ
  choice: నీ జీవితకాలమంతా
  rationale: ‘నీ జీవితం యొక్క రోజులన్నీ’ అనే హీబ్రూ నుడికారానికి ఇది సహజమైన, గంభీరమైన తెలుగు సమానార్థకం.
theological_decisions:
- issue: కథనంలో אָדָם అనే పదం వ్యక్తిపేరా, సాధారణ నామవాచకమా
  choice: ఆదాము
  alternative: మనిషి
  rationale: ఈ వాక్యంలో దేవుడు ఏదెనులోని నిర్దిష్ట పురుషుణ్ణి ఉద్దేశించి మాట్లాడుతున్నాడు. వ్యక్తిపేరు ప్రధాన పాఠ్యంలో సరిపోతుంది; మూలపదంలోని సాధారణ నామవాచక సాధ్యతను పాదటిప్పణిలో నిలిపాం.
- issue: నేలకు వచ్చిన శాపానికి ఆదాముతో ఉన్న సంబంధం
  choice: నీ కారణంగా
  alternative: నీ నిమిత్తం / నీ విషయమై
  rationale: בַּעֲבוּרֶךָ కారణం లేదా సంబంధాన్ని సూచించగలదు. ఈ తీర్పు సందర్భంలో కారణార్థం స్పష్టంగా ఉన్నా, దేవుడు ఆదాముకు మేలు చేయడానికి నేలను శపించాడనే భావాన్ని అనవసరంగా రానివ్వదు.
- issue: בְּעִצָּבוֹן లోని వేదన–శ్రమ భావసంబంధం
  choice: కష్టప్రయాసతో
  alternative: వేదనతో / దుఃఖంతో
  rationale: తదుపరి వచనాల్లో నేల సాగుకు సంబంధించిన కఠినత ప్రధానంగా ఉన్నందున శ్రమ భావాన్ని పాఠ్యంలో ఉంచాం; అయితే ముందు వచనంలోని ప్రసవవేదనతో పదసంబంధం పూర్తిగా కనుమరుగుకాకుండా ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గంభీరమైన కథన శైలిని పాటించాం. ‘మాట విని,’ ‘నేల,’ ‘కష్టప్రయాసతో’ వంటి సహజ పదబంధాలను వాడి, మూలంలోని కారణ–తీర్పు నిర్మాణాన్ని నిలిపాం.
