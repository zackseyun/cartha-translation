  terminology: ‘రొట్టె,’ ‘నేల,’ ‘ధూళి’ సరైన ఎంపికలు. ‘తీయబడ్డావు’ హీబ్రూ కర్మణి రూపాన్ని సముచితంగా తెలియజేస్తుంది. నేలతో సంబంధం చూపే సర్వనామానికి ‘దానినుండి’ సరిపోతుంది; అనవసరమైన ఉద్ఘాటనను తొలగించాలి.
