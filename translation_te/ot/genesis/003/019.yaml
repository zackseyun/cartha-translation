id: GEN.3.19
reference: Genesis 3:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: בְּ/זֵעַ֤ת אַפֶּ֨י/ךָ֙ תֹּ֣אכַל לֶ֔חֶם עַ֤ד שֽׁוּבְ/ךָ֙ אֶל הָ֣/אֲדָמָ֔ה כִּ֥י מִמֶּ֖/נָּה לֻקָּ֑חְתָּ כִּֽי עָפָ֣ר אַ֔תָּה וְ/אֶל עָפָ֖ר תָּשֽׁוּב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/019.yaml
  text: By the sweat of your face you will eat bread until you return to the ground[a], because from it you were taken; for you are dust, and to dust you will return.
translation:
  language: te
  text: నీ ముఖపు చెమటతో[a] నీవు రొట్టె తింటావు—నీవు నేలకు తిరిగి వచ్చేవరకు. ఎందుకంటే దానినుండి నీవు తీయబడ్డావు; నీవు ధూళివి, ధూళికే తిరిగి వస్తావు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత నానుడిగా: ‘నీ నుదుటి చెమటతో.’ హీబ్రూ పాఠంలో అక్షరార్థంగా ‘నీ ముఖపు చెమటతో’ అని ఉంది.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּזֵעַת אַפֶּיךָ
  choice: నీ ముఖపు చెమటతో
  rationale: హీబ్రూ పదబంధంలోని ‘ముఖం’ అనే ప్రత్యక్ష చిత్రాన్ని నిలుపుతూ, సాధనార్థక భావాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది. మరింత నానుడిరూపమైన ‘నీ నుదుటి చెమటతో’ను పాదసూచికలో ఉంచాం.
- source_word: תֹּאכַל לֶחֶם
  choice: నీవు రొట్టె తింటావు
  rationale: לֶחֶם పదానికి ప్రత్యక్ష అర్థం ‘రొట్టె’; సందర్భంలో అది సాధారణ ఆహారాన్ని కూడా సూచించగలిగినా, మూలంలోని నిర్దిష్ట రూపకాన్ని ప్రధాన పాఠంలో నిలిపాం.
- source_word: עַד שׁוּבְךָ אֶל הָאֲדָמָה
  choice: నీవు నేలకు తిరిగి చేరేవరకు
  rationale: אֲדָמָה అంటే నేల లేదా మట్టి. ‘నేల’ ఆధునిక తెలుగులో సహజంగా ఉండి, మనిషి నేలనుండి తీసుకోబడినవాడనే సందర్భ సంబంధాన్ని నిలుపుతుంది.
- source_word: כִּי מִמֶּנָּה לֻקָּחְתָּ
  choice: ఎందుకంటే దానిలోనుండే నీవు తీయబడ్డావు
  rationale: స్త్రీలింగ ఏకవచన సర్వనామం ముందున్న אֲדָמָהను సూచిస్తుంది. ‘తీయబడ్డావు’ అనే కర్మణి రూపం హీబ్రూ పుయల్ రూపాన్ని ప్రతిబింబిస్తుంది; ‘-ఏ’ మూలస్థానాన్ని ఉద్ఘాటిస్తుంది.
- source_word: עָפָר
  choice: ధూళి
  rationale: עָפָרకు ఇక్కడ సంప్రదాయబద్ధమైన, సందర్భోచితమైన అర్థం ‘ధూళి’; ఇది మానవుని భౌతిక మూలం మరియు మరణశీలతను తెలిపే పునరుక్తిని కాపాడుతుంది.
- source_word: תָּשׁוּב
  choice: తిరిగి చేరుతావు
  rationale: హీబ్రూ అసంపూర్ణ క్రియ ఇక్కడ ప్రకటితమైన భవిష్యత్ పరిణామాన్ని సూచిస్తుంది. ‘తిరిగి చేరుతావు’ ఆధునిక తెలుగులో సహజంగా ఉండి, నేల/ధూళి వద్దకు చేరే భావాన్ని స్పష్టంగా ఇస్తుంది.
theological_decisions:
- issue: మానవ మరణశీలత మరియు భౌతిక మూలం
  choice: మనిషి తాను తీసుకోబడిన నేలకు, అంటే ధూళికి, శారీరకంగా తిరిగి చేరుతాడనే ప్రకటనగా అనువదించాం.
  alternative: దీనిని ప్రధానంగా అవమానం లేదా అణకువకు సంబంధించిన రూపకంగా అనువదించడం.
  rationale: సమీప సందర్భమూ, אֲדָמָה (‘నేల’) మరియు עָפָר (‘ధూళి’) పదాల జతయూ భౌతిక మరణం మరియు భూమికి తిరిగి చేరడాన్ని బలంగా సూచిస్తున్నాయి. అయితే పాఠం చెప్పినదానికంటే మించిన తదనంతర సిద్ధాంత వివరణను అనువాదంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘ముఖపు చెమట,’ ‘రొట్టె,’ ‘నేల,’ ‘ధూళి’ వంటి మూల చిత్రాలను సాధ్యమైనంత పారదర్శకంగా నిలిపి, వాక్య విరామానికి దీర్ఘవిరామ చిహ్నాన్ని ఉపయోగించాం.
