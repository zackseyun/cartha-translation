  source_fidelity: 'మూల హీబ్రూ భావం మొత్తంగా సరిగా ఉంది: చెమటతో ఆహారం సంపాదించడం, నేలకు తిరిగి వెళ్లడం, నేలనుండి తీసుకోబడడం, ధూళి నుండి ధూళికి తిరిగిపోవడం అన్న క్రమం కాపాడబడింది. అయితే ‘తిరిగి చేరడం’ కంటే שׁוּב యొక్క ‘తిరిగి రావడం/వెళ్లడం’ భావాన్ని నేరుగా నిలిపే ‘తిరిగి వస్తావు’ ఇక్కడ మరింత నమ్మకమైనది. అలాగే ‘దానిలోనుండే’లోని ‘-ఏ’ ఉద్ఘాటన హీబ్రూలో లేదు.'
