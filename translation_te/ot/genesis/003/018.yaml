id: GEN.3.18
reference: Genesis 3:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/ק֥וֹץ וְ/דַרְדַּ֖ר תַּצְמִ֣יחַֽ לָ֑/ךְ וְ/אָכַלְתָּ֖ אֶת עֵ֥שֶׂב הַ/שָּׂדֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/018.yaml
  text: It will produce thorns and thistles for you[c][b][a], and you will eat the plants of the field.
translation:
  language: te
  text: నేల నీకు ముళ్లను, ముళ్ల కలుపుమొక్కలను మొలిపిస్తుంది[a]; నీవు పొలంలోని మొక్కలను[b] తింటావు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీకు ముళ్లను, ముళ్ల కలుపుమొక్కలను పుట్టిస్తుంది.” హీబ్రూ క్రియ కారణార్థకంగా ఉండి, మునుపటి వచనంలోని నేలను కర్తగా సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: “పొలంలోని మొక్కలు” అనే మాటను “పొలంలోని వృక్షజాలం” లేదా సాంప్రదాయికంగా “పొలంలోని శాకము” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקֹוץ
  choice: ముళ్లను
  rationale: קוֹץ ముళ్లతో కూడిన పెరుగుదలను సూచిస్తుంది. జతగా ఉన్న పదానికి భిన్నంగా, సహజమైన తెలుగు సామూహిక బహువచన భావాన్ని ‘ముళ్లు’ తెలియజేస్తుంది.
- source_word: וְדַרְדַּר
  choice: ముళ్ల కలుపుమొక్కలను
  rationale: דַּרְדַּר అనేది קוֹץ‌కు భిన్నమైన గుచ్చుకునే కలుపుమొక్కను సూచిస్తుంది. నిర్దిష్ట వృక్షజాతిని అనవసరంగా నిర్ణయించకుండా ఈ భేదాన్ని తెలుగు పదబంధం నిలుపుతుంది.
- source_word: תַּצְמִיחַ לָךְ
  choice: నీకు ... మొలిపిస్తుంది
  rationale: צמח హిఫీల్ రూపంలోని కారణార్థాన్ని ‘మొలిపిస్తుంది’ నిలుపుతుంది. לָךְ‌ను ‘నీకు’ అని స్పష్టంగా ఉంచడం వల్ల, ఈ ఉత్పత్తి మనిషికి సంబంధించినదనీ, సందర్భంలో అది భారమైన ఫలితమనీ తెలుస్తుంది.
- source_word: וְאָכַלְתָּ
  choice: నీవు ... తింటావు
  rationale: సంయోజకంతో వచ్చిన ఈ క్రియ ముందున్న పర్యవసానాన్ని కొనసాగిస్తుంది; సందర్భానుసారమైన భవిష్యత్ భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: עֵשֶׂב הַשָּׂדֶה
  choice: పొలంలోని మొక్కలను
  rationale: עֵשֶׂב సాధారణంగా తినదగిన పచ్చని వృక్షజాలాన్ని సూచిస్తుంది; కేవలం గడ్డి అనే సంకుచిత భావం కాదు. ‘పొలంలోని మొక్కలు’ ఆధునిక పాఠకులకు స్పష్టంగా ఉండి మూలంలోని సంబంధాన్ని నిలుపుతుంది.
theological_decisions:
- issue: תַּצְמִיחַ అనే స్త్రీలింగ ఏకవచన క్రియకు కర్త
  choice: మునుపటి వచనంలోని నేలనే కర్తగా స్పష్టంగా పేర్కొనడం
  alternative: కర్తను వెల్లడించకుండా ‘అది’ అని అనువదించడం
  rationale: హీబ్రూ స్త్రీలింగ ఏకవచన క్రియ 3:17లోని הָאֲדָמָה (నేల) వైపు సహజంగా తిరిగి సూచిస్తుంది. తెలుగులో ‘నేల’ అని చెప్పడం ఆ సంబంధాన్ని స్పష్టం చేస్తుంది; కొత్త వ్యాఖ్యానాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే గౌరవప్రదమైన వచనశైలి. ‘మొలిపిస్తుంది’ ద్వారా హీబ్రూ కారణార్థం నిలుపబడింది; ‘ముళ్ల కలుపుమొక్కలు’ ద్వారా రెండు సమీపార్థక హీబ్రూ పదాల మధ్య ఉన్న భేదం అతిగా వృక్షశాస్త్రీయంగా కాకుండా వ్యక్తమైంది.
