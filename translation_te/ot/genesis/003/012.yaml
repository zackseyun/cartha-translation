id: GEN.3.12
reference: Genesis 3:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֖אמֶר הָֽ/אָדָ֑ם הָֽ/אִשָּׁה֙ אֲשֶׁ֣ר נָתַ֣תָּה עִמָּדִ֔/י הִ֛וא נָֽתְנָה לִּ֥/י מִן הָ/עֵ֖ץ וָ/אֹכֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/012.yaml
  text: And the man said[a], “The woman whom you gave to be with me—she gave me from the tree, and I ate.”
translation:
  language: te
  text: అప్పుడు ఆ మనిషి, “నాతో ఉండడానికి నువ్వు ఇచ్చిన స్త్రీ—ఆమే ఆ చెట్టు పండును[a] నాకు ఇచ్చింది; నేను తిన్నాను” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా “ఆ చెట్టు నుండి.” ఇచ్చిన వస్తువు పండు అని సందర్భం సూచిస్తున్నందున తెలుగులో “పండు” చేర్చబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאָדָם
  choice: ఆ మనిషి
  rationale: ఈ సందర్భంలో మానవజాతి మొత్తాన్ని కాక, స్త్రీతో మాట్లాడుతున్న నిర్దిష్ట పురుషుణ్ణి సూచిస్తోంది.
- source_word: הָאִשָּׁה
  choice: స్త్రీ
  rationale: హీబ్రూ పదాన్ని నేరుగా నిలుపుతుంది; ఇక్కడ ‘భార్య’ అని అనువదించడం సాధ్యమైనా, అది మూలంలో లేని సంబంధపదాన్ని ముందుకు తెస్తుంది.
- source_word: אֲשֶׁר נָתַתָּה עִמָּדִי
  choice: నాతో ఉండడానికి నువ్వు ఇచ్చిన
  rationale: עִמָּדִי లోని సహవాస భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; దేవుడు ఆమెను ఇచ్చాడనే మూల వాక్యంలోని ఉద్రిక్తతను తగ్గించదు.
- source_word: הִוא
  choice: ఆమే
  rationale: స్వతంత్ర సర్వనామంలోని ఉద్ఘాటనను తెలుగులో సహజంగా నిలుపుతుంది.
- source_word: נָתְנָה לִי
  choice: నాకు ఇచ్చింది
  rationale: హీబ్రూ కథనంలోని సాధారణ భూతకాల చర్యను సహజంగా అందిస్తుంది.
- source_word: מִן הָעֵץ
  choice: ఆ చెట్టు పండును నాకు
  rationale: మూలంలో అక్షరార్థంగా ‘ఆ చెట్టు నుండి’ మాత్రమే ఉంది; అయితే ఇచ్చిన వస్తువు సందర్భం ద్వారా పండు అని స్పష్టంగా సూచించబడుతోంది. తెలుగులో వాక్యం సహజంగా, సంపూర్ణంగా ఉండేందుకు ‘పండు’ చేర్చి పాదసూచికలో తెలియజేశారు.
- source_word: וָאֹכֵל
  choice: నేను తిన్నాను
  rationale: చర్యల క్రమాన్ని నేరుగా నిలుపుతుంది; ‘అందుకే’ వంటి అదనపు కారణార్థాన్ని చేర్చదు.
theological_decisions:
- issue: మనిషి తన నిందను స్త్రీపైనా దేవునిపైనా మళ్లిస్తున్నాడనే అంతర్భావం
  choice: “నాతో ఉండడానికి నువ్వు ఇచ్చిన స్త్రీ” అనే నిర్మాణాన్ని యథాతథ భావంతో నిలుపడం
  alternative: “నాతో ఉన్న స్త్రీ” అని మృదువుగా చెప్పడం లేదా “నువ్వే నాకు ఇచ్చిన స్త్రీ” అని మరింత తీవ్రం చేయడం
  rationale: మూల వాక్యం దేవుడు ఇచ్చాడనే విషయాన్ని స్పష్టంగా ప్రస్తావించి బాధ్యతను మళ్లించే ఉద్రిక్తతను కలిగిస్తుంది. అనువాదం దాన్ని తగ్గించకూడదు, అతిశయింపకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యే, గౌరవప్రదమైన కథనశైలి. ‘ఆమే’ ద్వారా హీబ్రూ ఉద్ఘాటనను, డాష్ ద్వారా వాక్యంలోని నింద మళ్లింపు ఉద్రిక్తతను నిలిపాం.
