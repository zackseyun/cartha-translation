  source_fidelity: 'హీబ్రూ వాక్యంలోని ప్రధాన అంశాలు విశ్వసనీయంగా ప్రతిఫలించాయి: నిర్దిష్టమైన ‘మనిషి,’ దేవుడు ‘నాతో ఉండడానికి’ ఇచ్చిన స్త్రీ, ఉద్ఘాటనతో కూడిన ‘ఆమే,’ ఆమె ఇచ్చినది, మరియు మనిషి తిన్న చర్య. ‘ఆ చెట్టు పండు’ అనేది మִן־הָעֵץ (‘ఆ చెట్టు నుండి’)లో సందర్భం ద్వారా సూచింపబడిన కర్మను సహజ తెలుగుకోసం పూరించిన రూపం; దీనిని పాదసూచిక స్పష్టంగా తెలియజేస్తుంది.'
