id: GEN.3.22
reference: Genesis 3:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוָ֣ה אֱלֹהִ֗ים הֵ֤ן הָֽ/אָדָם֙ הָיָה֙ כְּ/אַחַ֣ד מִמֶּ֔/נּוּ לָ/דַ֖עַת ט֣וֹב וָ/רָ֑ע וְ/עַתָּ֣ה פֶּן יִשְׁלַ֣ח יָד֗/וֹ וְ/לָקַח֙ גַּ֚ם מֵ/עֵ֣ץ הַֽ/חַיִּ֔ים וְ/אָכַ֖ל וָ/חַ֥י לְ/עֹלָֽם׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/022.yaml
  text: Then Yahweh God said[a], “Behold, the man has become like one of us, knowing good and evil. And now, lest he reach out his hand and also take from the tree of life and eat, and live forever—”
translation:
  language: te
  text: 'అప్పుడు యాహ్వే దేవుడు ఇలా అన్నాడు: “ఇదిగో, మంచి చెడులను తెలిసిన మనలో ఒకరిలా మనిషి అయ్యాడు.[a] ఇప్పుడు అతడు తన చెయ్యి చాపి, జీవవృక్షం నుండి కూడా తీసుకొని తిని, ఎప్పటికీ జీవిస్తాడేమో అని—”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ మూలంలో ‘మనలో’ అనే బహువచనం ఉంది. దీనిని దైవసభకు సంబంధించిన భాషగా, ఆత్మాలోచనా బహువచనంగా, లేదా దేవత్వంలోని అంతర్గత బహుత్వానికి ముందస్తు సూచనగా వివిధ రీతుల్లో అర్థం చేసుకున్నారు; అనువాదం వీటిలో ఏ ఒక్క అర్థాన్నీ నిర్బంధంగా నిర్ణయించదు.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה אֱלֹהִים
  choice: యాహ్వే దేవుడు
  rationale: దేవుని వ్యక్తిగత నామమైన యాహ్వేను బిరుదుతో భర్తీ చేయకుండా, אֱלֹהִיםను సహజంగా ‘దేవుడు’ అని అనువదించాం.
- source_word: הֵן
  choice: ఇదిగో
  rationale: హీబ్రూ పదంలోని దృష్టిని ఆకర్షించే, గంభీరమైన ఉద్ఘాటనను సహజమైన తెలుగు కథన శైలిలో నిలుపుతుంది.
- source_word: הָאָדָם
  choice: మనిషి
  rationale: ఈ సందర్భంలో ఇంతకుముందు ప్రస్తావించిన నిర్దిష్ట మానవుణ్ణి సూచిస్తుంది; మానవజాతి మొత్తాన్ని కాదు.
- source_word: הָיָה
  choice: అయ్యాడు
  rationale: అతిక్రమణ తరువాత ఏర్పడిన ఫలిత స్థితిని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: כְּאַחַד מִמֶּנּוּ
  choice: మనలో ఒకనివలె
  rationale: మూలంలోని పోలికను, ప్రథమ పురుష బహువచనాన్ని వ్యాఖ్యానాత్మకంగా పరిష్కరించకుండా నిలుపుతుంది.
- source_word: לָדַעַת טוֹב וָרָע
  choice: మంచి చెడ్డలను తెలుసుకోవడంలో
  rationale: ‘మనలో ఒకనివలె’ అనే పోలిక ఏ విషయంలోనో సహజమైన తెలుగులో వివరిస్తూ, మంచి-చెడు అనే జత యొక్క నైతిక-జ్ఞాన సంబంధ పరిధిని నిలుపుతుంది.
- source_word: פֶּן
  choice: జీవిస్తాడేమో
  rationale: నివారణకు కారణమైన భయాన్ని లేదా సంభావ్యతను తెలుగులో సహజంగా వ్యక్తం చేస్తూ, అసంపూర్ణంగా నిలిచిపోయే వాక్య నిర్మాణాన్ని కాపాడుతుంది.
- source_word: יִשְׁלַח יָדוֹ
  choice: తన చెయ్యి చాపి
  rationale: మూలంలోని స్పష్టమైన శారీరక చిత్రణను సహజమైన తెలుగు నుడికారంలో నిలుపుతుంది.
- source_word: עֵץ הַחַיִּים
  choice: జీవవృక్షం
  rationale: నిర్మాణబద్ధమైన హీబ్రూ పదబంధానికి సంక్షిప్తమైన, సుపరిచితమైన తెలుగు సమానార్థకం.
- source_word: לְעֹלָם
  choice: ఎప్పటికీ
  rationale: అంతం లేని జీవన భావాన్ని సాధారణ ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ‘మనలో ఒకనివలె’ అనే మాటలోని బహువచనం
  choice: ‘మనలో’ అనే బహువచనాన్ని యథాతథంగా ఉంచడం
  alternative: దైవసభ, ఆత్మాలోచనా బహువచనం, లేదా దేవునిలోని అంతర్గత బహుత్వం అని ప్రధాన వచనంలోనే నిర్దిష్టీకరించడం
  rationale: హీబ్రూ మూలం ప్రథమ పురుష బహువచనాన్ని స్పష్టంగా ఉపయోగిస్తుంది; అనువాదం దాని భావాన్ని ఏకైక వేదాంత వివరణకు పరిమితం చేయకూడదు.
- issue: దేవుని మాట అకస్మాత్తుగా ఆగిపోవడం
  choice: చివర దీర్ఘ విరామచిహ్నంతో అసంపూర్ణతను నిలుపడం
  alternative: అర్థాన్ని పూర్తి చేసే ఫలిత వాక్యాన్ని చేర్చడం
  rationale: మూలంలోని నివారణార్థక వాక్యం పూర్తి ఫలితాన్ని చెప్పకుండానే ఆగిపోతుంది; లేని పదాలను చేర్చకుండా ఆ ఉద్వేగాన్ని నిలుపుతున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కథన శైలిని వాడాం. ‘ఇదిగో’ మూలంలోని ఉద్ఘాటనను నిలుపుతుంది; చివరి దీర్ఘ విరామచిహ్నం హీబ్రూ వాక్యంలోని అకస్మాత్తు విరామాన్ని సూచిస్తుంది.
