  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הַ/נָּחָשׁ֙ הָיָ֣ה עָר֔וּם מִ/כֹּל֙ חַיַּ֣ת הַ/שָּׂדֶ֔ה אֲשֶׁ֥ר עָשָׂ֖ה יְהוָ֣ה אֱלֹהִ֑ים וַ/יֹּ֨אמֶר֙ אֶל הָ֣/אִשָּׁ֔ה אַ֚ף כִּֽי אָמַ֣ר אֱלֹהִ֔ים לֹ֣א תֹֽאכְל֔וּ מִ/כֹּ֖ל עֵ֥ץ הַ/גָּֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/001.yaml
  text: The serpent was more crafty than any beast of the field that Yahweh God had made[a]. And he said to the woman, “Indeed, has God said[c][b], ‘You shall not eat from any tree of the garden’?”
translation:
  language: te
  text: యెహోవా దేవుడు చేసిన పొలంలోని ఏ జంతువుకంటె సర్పం ఎక్కువ చతురమైనది[a]. అది స్త్రీతో ఇలా అంది, “తోటలోని ఏ చెట్టునుండీ మీరు తినకూడదని దేవుడు[b] నిజంగానే చెప్పాడా?[c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఎక్కువ జిత్తులమారైనది,” “ఎక్కువ సూక్ష్మబుద్ధిగలది.” హీబ్రూ పదం కొన్ని సందర్భాల్లో వివేకాన్ని సూచించగలదు; ఇక్కడ సందర్భం దానికి మోసపూరిత ఛాయను ఇస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: కథకుడు “యెహోవా దేవుడు” అంటాడు; సర్పం మాత్రం “దేవుడు” అని మాత్రమే అంటుంది. హీబ్రూ పాఠంలోని ఈ మార్పు అనువాదంలో నిలుపబడింది.
    reason: alternative_reading
  - marker: c
    text: లేదా “తోటలోని ప్రతి చెట్టు నుండి.” నిషేధంతో కూడిన ఈ ప్రశ్నలో “ఏ చెట్టునుండీ” అనేది దేవుని ఆజ్ఞను సర్పం అతిశయోక్తిగా చూపడాన్ని సహజంగా తెలియజేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַנָּחָשׁ
  choice: సర్పం
  rationale: הַנָּחָשׁకు సహజమైన, గౌరవప్రదమైన తెలుగు సమానం ‘సర్పం.’ వావ్ సంధిని ప్రత్యేకంగా ‘మరియు’ అని పెట్టకుండా తెలుగు కథన ప్రవాహంలో సహజంగా వ్యక్తీకరించాం.
- source_word: עָרוּם
  choice: ఎక్కువ కపటయుక్తిగలది
  rationale: ఈ పదం సందర్భానుసారం వివేకం, చాతుర్యం లేదా మోసపూరిత కపటం అనే భావాలు ఇవ్వగలదు. వెంటనే వచ్చే వంచనాత్మక ప్రశ్న దృష్ట్యా ఇక్కడ ప్రతికూల ఛాయను వ్యక్తం చేస్తూ, పదంలోని చాతుర్య భావాన్నీ నిలిపాం.
- source_word: מִכֹּל חַיַּת הַשָּׂדֶה
  choice: పొలంలోని జంతువులన్నిటికంటే
  rationale: מִן + כֹּל నిర్మాణంలోని తులనాత్మక భావాన్ని ‘అన్నిటికంటే’ స్పష్టంగా తెలియజేస్తుంది; חַיַּת הַשָּׂדֶהను సహజ తెలుగులో ‘పొలంలోని జంతువులు’గా ఇచ్చాం.
- source_word: אֲשֶׁר עָשָׂה יְהוָה אֱלֹהִים
  choice: యెహోవా దేవుడు చేసిన
  rationale: సంబంధ వాక్యాన్ని సంక్షిప్తమైన సహజ తెలుగు రూపంలో ఇచ్చి, יְהוָה אֱלֹהִים అనే సంయుక్త దైవనామాన్ని నిలిపాం.
- source_word: וַיֹּאמֶר אֶל הָאִשָּׁה
  choice: అది స్త్రీతో ... అంది
  rationale: కర్త సర్పమే. తెలుగులో లింగనిరపేక్ష జడసర్వనామం ‘అది’ సహజం; ‘స్త్రీ’ అని మూలంలోని నిర్దేశాన్ని ఉంచి, ఇంకా ఇవ్వని ‘హవ్వ’ పేరును చేర్చలేదు.
- source_word: אַף כִּי אָמַר
  choice: ఏమిటి, ... నిజంగా చెప్పాడా?
  rationale: אַף כִּי యొక్క ఆశ్చర్యం, అనుమానం, రెచ్చగొట్టే ప్రశ్నార్థక ధోరణిని సహజ ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; కేవలం సమ్మతి సూచించే పదంగా సన్నగిల్లనివ్వలేదు.
- source_word: אֱלֹהִים
  choice: దేవుడు
  rationale: సర్పం పలికిన మాటలో మూలం יְהוָה אֱלֹהִים కాకుండా కేవలం אֱלֹהִים అంటుంది; ఆ గమనించదగిన మార్పును నిలిపాం.
- source_word: לֹא תֹאכְלוּ
  choice: మీరు తినకూడదు
  rationale: బహువచన ద్వితీయ పురుష నిషేధాన్ని ఆధునిక తెలుగులో స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: מִכֹּל עֵץ הַגָּן
  choice: తోటలోని ఏ చెట్టు పండునూ
  rationale: నిషేధ ప్రశ్నలో ‘ఏ ... నూ’ అనే నిర్మాణం ‘ఏ ఒక్క చెట్టునుంచీ తినకూడదు’ అనే సర్పపు అతిశయోక్తిని సహజంగా తెలియజేస్తుంది. తెలుగులో ‘చెట్టును తినడం’ అసహజం కాబట్టి సందర్భంలో అంతర్లీనమైన ఫలాన్ని ‘పండు’గా స్పష్టీకరించాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలంలో ఉన్న ప్రత్యేక దైవనామాన్ని సాధారణ బిరుదుతో భర్తీ చేయకుండా తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన రూపంలో లిప్యంతరీకరించాం.
- issue: עָרוּם యొక్క నైతిక ఛాయ
  choice: కపటయుక్తిగలది
  alternative: చతురమైనది
  rationale: ఈ పదానికి సందర్భానుసారం సానుకూల వివేక భావం ఉండవచ్చు; అయితే ఇక్కడ వెంటనే వచ్చే వక్రీకరణతో కూడిన ప్రశ్న ప్రతికూల, మోసపూరిత ఛాయను బలపరుస్తుంది. అయినప్పటికీ ‘కపటయుక్తి’ పదం చాతుర్యాంశాన్నీ ఉంచుతుంది.
- issue: కథకుని దైవసంబోధనకు, సర్పం పలికిన సంబోధనకు మధ్య భేదం
  choice: కథకుని మాటలో ‘యెహోవా దేవుడు’; సర్పం మాటలో ‘దేవుడు’
  alternative: రెండు చోట్లా ‘యెహోవా దేవుడు’
  rationale: హీబ్రూ పాఠంలోని ఉద్దేశపూర్వక పదమార్పును సమన్వయపరచకుండా యథాతథంగా నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనప్పటికీ గౌరవప్రదమైన కథన శైలి. ‘యెహోవా దేవుడు’/‘దేవుడు’ భేదం, ప్రశ్నలోని అనుమానపూర్వక ధోరణి, עָרוּם పదంలోని నైతిక ఉద్వేగం కాపాడబడ్డాయి. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
