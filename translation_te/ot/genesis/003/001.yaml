revisions:
- from: యెహోవా దేవుడు చేసిన పొలంలోని జంతువులన్నిటికంటే సర్పం ఎక్కువ కపటయుక్తిగలది[a]. అది స్త్రీతో, “ఏమిటి, ‘తోటలోని ఏ చెట్టు పండునూ మీరు తినకూడదు’ అని దేవుడు నిజంగా చెప్పాడా?[b][c]” అంది.
  to: యెహోవా దేవుడు చేసిన పొలంలోని ఏ జంతువుకంటె సర్పం ఎక్కువ చతురమైనది[a]. అది స్త్రీతో ఇలా అంది, “తోటలోని ఏ చెట్టునుండీ మీరు తినకూడదని దేవుడు[b] నిజంగానే చెప్పాడా?[c]”
  rationale: The revision removes the unexpressed ‘fruit,’ uses a more natural and lexically restrained rendering of עָרוּם, and relocates the footnote anchors so that the divine-name shift and the ‘any/every tree’ alternative are each attached to the relevant wording. It retains the serpent’s insinuating question through ‘నిజంగానే ... చెప్పాడా?’ without imposing a doctrinal interpretation.
