id: GEN.3.8
reference: Genesis 3:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַֽ/יִּשְׁמְע֞וּ אֶת ק֨וֹל יְהוָ֧ה אֱלֹהִ֛ים מִתְהַלֵּ֥ךְ בַּ/גָּ֖ן לְ/ר֣וּחַ הַ/יּ֑וֹם וַ/יִּתְחַבֵּ֨א הָֽ/אָדָ֜ם וְ/אִשְׁתּ֗/וֹ מִ/פְּנֵי֙ יְהוָ֣ה אֱלֹהִ֔ים בְּ/ת֖וֹךְ עֵ֥ץ הַ/גָּֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/008.yaml
  text: And they heard the sound of Yahweh God walking in the garden in the breeze of the day[c][b][a], and the man and his wife hid themselves from the presence of Yahweh God among the trees of the garden.
translation:
  language: te
  text: అప్పుడు వారు, పగటి గాలి వీచే వేళ తోటలో నడుస్తున్న యాహ్వే దేవుని శబ్దాన్ని[a][b] విన్నారు. ఆ మనిషి[c] మరియు అతని భార్య యాహ్వే దేవుని సన్నిధి నుండి తోటలోని చెట్ల మధ్య దాక్కున్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘యాహ్వే దేవుని స్వరాన్ని.’ హెబ్రీ పదానికి ‘శబ్దం’ లేదా ‘స్వరం’ అనే అర్థాలు ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘పగటి చల్లని వేళ.’ అక్షరార్థంగా, ‘పగటి గాలి/వాయువు సమయంలో.’
    reason: lexical_alternative
  - marker: c
    text: హెబ్రీలో, ‘ఆ మనిషి’; మరో విధంగా, ‘ఆదాము.’
    reason: alternative_reading
lexical_decisions:
- source_word: קוֹל
  choice: శబ్దం
  rationale: ఈ హెబ్రీ పదానికి ‘శబ్దం’ లేదా ‘స్వరం’ అనే అర్థాలు ఉండవచ్చు. ఈ సందర్భంలో దేవుడు మాట్లాడినట్లు స్పష్టంగా చెప్పకపోవడం వల్ల ‘శబ్దం’ మూలంలోని అస్పష్టతను బాగా నిలుపుతుంది.
- source_word: יְהוָה אֱלֹהִים
  choice: యెహోవా దేవుడు
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా ‘యెహోవా’గా లిప్యంతరీకరించి, אֱלֹהִים ను సహజమైన తెలుగు పదం ‘దేవుడు’గా అనువదించాం.
- source_word: מִתְהַלֵּךְ
  choice: నడుస్తున్న
  rationale: తోటలో సంచరించే కదలికను సూచించే హిత్పయేల్ వర్తమాన కృదంతాన్ని సహజంగా అనువదిస్తూ, మానవరూప వర్ణనను సవరించకుండా నిలుపుతుంది.
- source_word: לְרוּחַ הַיּוֹם
  choice: పగటి గాలి వీచే వేళ
  rationale: అక్షరార్థంగా ‘పగటి గాలి/వాయువు’ అనే భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; ‘చల్లని వేళ’ అని దాని ప్రభావాన్ని మాత్రమే వ్యాఖ్యానించదు.
- source_word: הָאָדָם
  choice: ఆ మనిషి
  rationale: ‘అతని భార్య’ అనే తక్షణ సందర్భంలో నిర్దిష్ట పురుషుణ్ణి సూచిస్తుంది; అయినా ‘ఆదాము’ అనే వ్యక్తినామాన్ని ప్రధాన పాఠ్యంలో బలవంతంగా ప్రవేశపెట్టదు.
- source_word: מִפְּנֵי
  choice: సన్నిధి నుండి తప్పించుకొని
  rationale: ‘ముఖం/సన్నిధి నుండి’ అనే సంబంధాత్మక, స్థలాత్మక భావాన్ని నిలుపుతూ, దాక్కోవడం యొక్క ఉద్దేశాన్ని తెలుగులో సహజంగా కలుపుతుంది.
- source_word: בְּתוֹךְ עֵץ הַגָּן
  choice: తోటలోని చెట్ల మధ్య
  rationale: హెబ్రీ ఏకవచన రూపం ఇక్కడ సమూహార్థకంగా వాడబడింది; దాక్కునే సందర్భంలో తెలుగు బహువచనం సహజమైనది.
theological_decisions:
- issue: దేవుడు తోటలో ‘నడవడం’ అనే మానవరూప వర్ణన
  choice: నడుస్తున్న
  alternative: సంచరిస్తున్న; దేవుని సన్నిధి కదులుతున్న
  rationale: మూలపాఠంలోని సజీవమైన, స్పష్టమైన మానవరూప వర్ణనను మృదువుచేయకుండా లేదా రూపకాలంకారంగా వివరణ ఇవ్వకుండా అలాగే నిలిపాం.
- issue: הָאָדָם పదం వ్యక్తినామమా లేక సాధారణ నామమా
  choice: ఆ మనిషి
  alternative: ఆదాము; ఆ మానవుడు
  rationale: ‘అతని భార్య’ అనే సందర్భం వ్యక్తిగత పురుషుణ్ణి సూచించినా, హెబ్రీలో ఉన్న సాధారణ నామపద స్వరూపాన్ని ప్రధాన పాఠ్యంలో నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథనశైలి. ‘యెహోవా’ అనే దైవనామం నిలుపబడింది. మూలంలోని శబ్దం/స్వరం, పగటి గాలి/చల్లని వేళ, మనిషి/ఆదాము అనే ప్రత్యామ్నాయాలను పాదటిప్పణుల్లో స్పష్టంగా ఇచ్చాం.
