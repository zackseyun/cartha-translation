id: GEN.40.9
reference: Genesis 40:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְסַפֵּ֧ר שַֽׂר הַ/מַּשְׁקִ֛ים אֶת חֲלֹמ֖/וֹ לְ/יוֹסֵ֑ף וַ/יֹּ֣אמֶר ל֔/וֹ בַּ/חֲלוֹמִ֕/י וְ/הִנֵּה גֶ֖פֶן לְ/פָנָֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/009.yaml
  text: So the chief cupbearer told his dream to Joseph and said to him[a], “In my dream, behold, a vine was before me.”
translation:
  language: te
  text: 'అప్పుడు పానదాయకుల అధిపతి తన కలను యోసేపుకు చెప్పి, అతనితో ఇలా అన్నాడు: “నా కలలో, ఇదిగో, నా ఎదుట ఒక ద్రాక్షతీగ ఉంది.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నా ఎదుట ఒక ద్రాక్షతీగ కనిపించింది.” హీబ్రూలోని וְהִנֵּה (‘ఇదిగో’) కలలోని దృశ్యాన్ని సజీవంగా పరిచయం చేసే అవధాన సూచకం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְסַפֵּר
  choice: వివరించి
  rationale: పీయేల్ రూపంలోని ספר ఇక్కడ కలను చెప్పడం లేదా వివరించడం అనే అర్థం ఇస్తుంది; ‘వివరించి’ కలను క్రమంగా తెలియజేసే భావాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: שַׂר הַמַּשְׁקִים
  choice: పానదాయకుల అధిపతి
  rationale: ఫరోకు పానీయం అందించే సేవకులపై అధికారమున్న రాజోద్యోగిని సూచించే నిర్మాణం; ఈ ఎంపిక పదవిని స్పష్టంగా, గౌరవప్రదంగా తెలియజేస్తుంది.
- source_word: אֶת חֲלֹמוֹ
  choice: తన కలను
  rationale: ప్రత్యక్ష కర్మ సూచికతో కూడిన నామవాచకంలోని తృతీయ పురుష ఏకవచన ప్రత్యయం సందర్భానుసారం ‘తన కలను’ అవుతుంది.
- source_word: לְיוֹסֵף
  choice: యోసేపుకు
  rationale: לְ పరోక్ష కర్మను సూచిస్తుంది; వ్యక్తి పేరును తెలుగులో ప్రాచుర్యంలో ఉన్న ‘యోసేపు’ రూపంలో ఇచ్చాం.
- source_word: וַיֹּאמֶר לוֹ
  choice: అతనితో ఇలా అన్నాడు
  rationale: హీబ్రూలోని ‘అతనికి’ అనే సర్వనామ సూచనను నిలుపుతూ, ప్రత్యక్ష వాక్యాన్ని సహజంగా ప్రవేశపెట్టడానికి ‘ఇలా’ చేర్చబడింది.
- source_word: בַּחֲלוֹמִי
  choice: నా కలలో
  rationale: కలలో కనిపించిన దృశ్యాన్ని పరిచయం చేసే పదబంధానికి ఇది సహజమైన ప్రత్యక్ష సమానం.
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: הִנֵּה కల దృశ్యాన్ని సజీవంగా, అకస్మాత్తుగా పాఠకుని దృష్టికి తెచ్చే అవధాన సూచకం; ‘ఇదిగో’ ఆ వాక్యప్రభావాన్ని నిలుపుతుంది.
- source_word: גֶפֶן
  choice: ఒక ద్రాక్షతీగ
  rationale: సందర్భంలో ఇది ద్రాక్ష పండే తీగను సూచిస్తుంది; సాధారణ తెలుగు పాఠకునికి ‘ద్రాక్షతీగ’ స్పష్టంగా ఉంటుంది.
- source_word: לְפָנַי
  choice: నా ఎదుట
  rationale: ‘నా ముందు/ఎదుట’ అనే స్థల సంబంధాన్ని సూచిస్తుంది; దృశ్య వర్ణనలో ‘నా ఎదుట’ సహజంగా ఉంటుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. ‘ఇదిగో’ అనే పదంతో మూలంలోని దృశ్య సజీవతను నిలిపి, ‘పానదాయకుల అధిపతి’ ద్వారా రాజాస్థాన పదవిని స్పష్టంగా తెలిపాం.
