- from: ఫరో తన ఇద్దరు అధికారుల మీద[a]—పానీయాలు అందించేవారి అధిపతి మీద, రొట్టెలు కాల్చేవారి అధిపతి మీద—కోపపడ్డాడు.
  to: ఫరో తన ఇద్దరు అధికారులపై—పానదాయకుల అధిపతిపై, రొట్టెలు కాల్చేవారి అధిపతిపై—కోపపడ్డాడు.
