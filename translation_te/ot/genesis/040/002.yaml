  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. మూలంలోని సాధారణ పదం తరువాత రెండు పదవులతో వివరించబడే నిర్మాణాన్ని దీర్ఘవిరామాలతో, ‘మీద’ పునరుక్తితో నిలిపాం.
