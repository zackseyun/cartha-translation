  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּקְצֹ֣ף פַּרְעֹ֔ה עַ֖ל שְׁנֵ֣י סָרִיסָ֑י/ו עַ֚ל שַׂ֣ר הַ/מַּשְׁקִ֔ים וְ/עַ֖ל שַׂ֥ר הָ/אוֹפִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/002.yaml
  text: And Pharaoh was angry with his two officials[b][a], with the chief cupbearer and with the chief baker.
translation:
  language: te
  text: ఫరో తన ఇద్దరు అధికారులపై—పానదాయకుల అధిపతిపై, రొట్టెలు కాల్చేవారి అధిపతిపై—కోపపడ్డాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְצֹף
  choice: కోపపడ్డాడు
  rationale: קצף కోపాన్ని సూచిస్తుంది. తీవ్రతను అతిగా పెంచకుండా, కథన సందర్భంలో సహజమైన ఆధునిక తెలుగు రూపాన్ని ఎంచుకున్నాం.
- source_word: פַּרְעֹה
  choice: ఫరో
  rationale: హీబ్రూ రాజబిరుదుకు తెలుగులో స్థిరపడిన రూపం.
- source_word: שְׁנֵי סָרִיסָיו
  choice: తన ఇద్దరు అధికారులు
  rationale: סָרִיסִים అనే పదం రాజాస్థాన అధికారులను లేదా కొన్ని సందర్భాల్లో నపుంసకులను సూచించవచ్చు. ఇక్కడ వారి రాజసేవా పదవులు పేర్కొనబడినందున శారీరక స్థితిని నిర్ధారించకుండా ‘అధికారులు’ అని అనువదించాం.
- source_word: שַׂר הַמַּשְׁקִים
  choice: పానీయాలు అందించేవారి అధిపతి
  rationale: שַׂר అంటే అధిపతి; הַמַּשְׁקִים అంటే పానీయాలు అందించేవారు. రాజాస్థాన బాధ్యతను సాధారణ పాఠకులకు స్పష్టంగా తెలిపే సహజ తెలుగు రూపం.
- source_word: שַׂר הָאֹפִים
  choice: రొట్టెలు కాల్చేవారి అధిపతి
  rationale: שַׂר నాయకుడిని, הָאֹפִים రొట్టెలు కాల్చేవారిని సూచిస్తాయి. వృత్తిపరమైన పదవిని స్పష్టంగా నిలుపుతుంది.
- source_word: עַל ... עַל ... וְעַל
  choice: మీద ... మీద, ... మీద
  rationale: కోపానికి గురైన వారిని సూచించే עַל పునరుక్తిని తెలుగులో ‘మీద’ అని పునరావృతం చేశాం; విరామచిహ్నాలతో తరువాతి ఇద్దరూ ముందుగా చెప్పిన ఇద్దరు అధికారులేనని స్పష్టం చేశాం.
