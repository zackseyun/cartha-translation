base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/006.yaml
  text: Joseph came to them in the morning and saw them[a], and behold, they were troubled.
translation:
  language: te
  text: ఉదయం యోసేపు వారి దగ్గరికి వచ్చి వారిని చూశాడు; ఇదిగో, వారు కలతచెంది ఉన్నారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘దిగులుగా,’ ‘ముఖం వాడిపోయి,’ లేదా ‘విచారంగా’ ఉన్నారు. హీబ్రూ పదం బయటికి కనిపించే కలతతో కూడిన లేదా దిగులైన స్థితిని వర్ణిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא אֲלֵיהֶם
  choice: వారి దగ్గరికి వచ్చి
  rationale: בואతో కూడిన אֲלֵיהֶם వారి వైపు కదలికను సూచిస్తుంది. ఆధునిక తెలుగులో ‘వారి దగ్గరికి వచ్చి’ సహజంగా ఉండి మూలంలోని దిశాభావాన్ని నిలుపుతుంది.
- source_word: בַּבֹּקֶר
  choice: ఉదయం
  rationale: నిర్దిష్ట కాలసూచనను తెలుగులో సహజమైన కథన శైలిలో ‘ఉదయం’ అని అందించింది.
- source_word: וַיַּרְא אֹתָם
  choice: వారిని చూశాడు
  rationale: ראה ప్రత్యక్ష కర్మతో సాధారణ దృష్టిగ్రహణాన్ని తెలియజేస్తుంది; ‘గమనించాడు’ అని అర్థాన్ని విస్తరించకుండా నేరుగా అనువదించబడింది.
- source_word: וְהִנָּם
  choice: ఇదిగో
  rationale: הִנֵּה యొక్క ప్రదర్శనాత్మక, దృష్టిని ఆకర్షించే కథన బలాన్ని ‘ఇదిగో’ నిలుపుతుంది.
- source_word: זֹעֲפִים
  choice: కలతచెంది ఉన్నారు
  rationale: ఈ పదం బయటికి కనిపించే మానసిక వ్యాకులత లేదా దిగులైన స్థితిని సూచిస్తుంది. సందర్భాన్ని కేవలం కోపం లేదా విషాదంగా పరిమితం చేయకుండా ‘కలతచెంది’ విస్తృత భావాన్ని అందిస్తుంది.
