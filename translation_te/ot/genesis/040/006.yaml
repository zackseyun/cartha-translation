translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘ఇదిగో’ ద్వారా మూలంలోని దృష్టి-ఆకర్షణ బలం నిలుపబడింది; అరుదైన లేదా మతశాఖాపరమైన పదజాలం నివారించబడింది.
