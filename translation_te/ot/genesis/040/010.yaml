  text: and on the vine were three branches[a]. As it was budding, its blossoms came up[b], and its clusters ripened into grapes.
translation:
  language: te
  text: ఆ ద్రాక్షతీగపై మూడు కొమ్మలు[a] ఉన్నాయి. అది చిగురిస్తున్నప్పుడు దాని పువ్వులు వికసించాయి[b]; దాని ద్రాక్షగుత్తులలోని పండ్లు పక్వమయ్యాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మూడు చిగుళ్లు’ లేదా ‘మూడు రెమ్మలు.’
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా, ‘అది చిగురిస్తున్నట్లుండగా, దాని పువ్వు పైకి వచ్చింది.’ ఈ వాక్యం తీగ చిగురించడం నుంచి పుష్పించి ద్రాక్షలు పక్వమయ్యే వరకు వేగంగా సాగిన క్రమాన్ని వర్ణిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַגֶּפֶן
  choice: ఆ ద్రాక్షతీగకు
  rationale: సందర్భంలోని కలవర్ణనను కొనసాగిస్తూ, తీగపై కొమ్మలు ఉండటాన్ని తెలుగులో సహజంగా ‘తీగకు’ అని వ్యక్తం చేశాం.
- source_word: שְׁלֹשָׁה שָׂרִיגִם
  choice: మూడు కొమ్మలు
  rationale: שָׂרִיגִם ద్రాక్షతీగ నుంచి పెరిగే కొమ్మలు లేదా చిగుళ్లను సూచిస్తుంది; సాధారణ పాఠకునికి ‘కొమ్మలు’ అత్యంత సహజమైన పదం.
- source_word: כְפֹרַחַת
  choice: అది చిగురిస్తుండగానే
  rationale: כְ ఉపసర్గతో కూడిన కృదంతం ఎదుగుదల జరుగుతున్న దశను సూచిస్తుంది; ‘చిగురిస్తుండగానే’ ఆ ప్రగతిశీల, కాలసంబంధ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: עָלְתָה נִצָּהּ
  choice: దాని పువ్వులు వికసించాయి
  rationale: పుష్పం బయటికి రావడం లేదా పైకి ఉద్భవించడం అనే చిత్రాన్ని ఆధునిక తెలుగులో సహజంగా ‘పువ్వులు వికసించాయి’ అని తెలిపాం; హీబ్రూలో ఏకవచనం సమూహార్థకంగా ఉండవచ్చు.
- source_word: הִבְשִׁילוּ אַשְׁכְּלֹתֶיהָ עֲנָבִים
  choice: దాని గెలలు ద్రాక్షపండ్లుగా పండాయి
  rationale: అక్షరార్థ నిర్మాణంలోని ఫలితార్థాన్ని నిలుపుతూ, గెలలు పండిన ద్రాక్షపండ్లతో నిండిన దశకు చేరినట్లు తెలుగులో స్పష్టంగా తెలిపాం.
