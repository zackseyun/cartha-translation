  text: But he hanged the chief baker[a], just as Joseph had interpreted to them.
translation:
  language: te
  text: అయితే, రొట్టెలు కాల్చేవారి అధిపతిని వేలాడదీయించాడు[a]; యోసేపు వారికి అర్థం చెప్పినట్లుగానే జరిగింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఉరితీయించాడు.” హీబ్రూ క్రియ ప్రాథమికంగా వేలాడదీయడాన్ని సూచిస్తుంది; కొన్ని సందర్భాల్లో దీనిని కొయ్యకు గుచ్చడం లేదా చంపిన తర్వాత శరీరాన్ని వేలాడదీసి ప్రదర్శించడం అని కూడా అర్థం చేసుకుంటారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵת
  choice: అయితే ... ని
  rationale: וְ సందర్భంలో ముందరి వచనంలోని పానదాయకుల అధిపతి పునర్నియామకానికి వ్యతిరేకమైన పరిణామాన్ని సూచిస్తుంది; אֵת ప్రత్యక్ష కర్మను తెలుగులో ‘ని’తో వ్యక్తం చేశాం.
- source_word: שַׂר הָאֹפִים
  choice: రొట్టెలు కాల్చేవారి అధిపతి
  rationale: שַׂר రాజసభలోని ప్రధాన అధికారిని సూచిస్తుంది; אֹפִים ఆహారాన్ని, ముఖ్యంగా రొట్టెలను కాల్చేవారు. సాధారణ పాఠకులకు స్పష్టంగా ఉండే సహజ తెలుగు రూపం ఎంచుకున్నాం.
- source_word: תָּלָה
  choice: ఉరితీయించాడు
  rationale: క్రియ యొక్క ప్రాథమిక భావం వేలాడదీయడం. ఈ కథనంలో శిక్షను సూచించేందుకు ‘ఉరితీయించాడు’ సహజంగా ఉంటుంది; అయితే మరణవిధానం లేదా మరణానంతర ప్రదర్శన గురించిన అస్పష్టతను పాదసూచికలో నిలిపాం.
- source_word: כַּאֲשֶׁר
  choice: అర్థం చెప్పినట్లుగానే
  rationale: సంఘటన యోసేపు ముందుగా తెలిపిన స్వప్నార్థానికి కచ్చితంగా అనుగుణంగా జరిగిందని తెలియజేస్తుంది.
- source_word: פָּתַר
  choice: అర్థం చెప్పిన
  rationale: స్వప్న సందర్భంలో פתר అంటే స్వప్నానికి అర్థం వివరించడం. ఆధునిక సాధారణ తెలుగులో ‘అర్థం చెప్పడం’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: לָהֶם
  choice: వారికి
  rationale: బహువచన సర్వనామం ఇద్దరు అధికారులను సూచిస్తుంది; తెలుగు విభక్తి సహజంగా వ్యక్తమైంది.
- source_word: יוֹסֵף
  choice: యోసేపు
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
theological_decisions:
- issue: תָּלָה సూచించే శిక్షావిధానం
  choice: ప్రధాన పాఠంలో ‘ఉరితీయించాడు’
  alternative: ‘వేలాడదీయించాడు’ లేదా ‘కొయ్యకు గుచ్చించాడు’
  rationale: మూల క్రియ వేలాడదీయడాన్ని సూచించినా, ప్రక్రియ ఉరితీయడమా, గుచ్చడమా, లేక మరణానంతరం శరీరాన్ని ప్రదర్శించడమా అన్నది క్రియ ఒక్కటే ఖచ్చితంగా నిర్ణయించదు. అందువల్ల ప్రధాన పాఠం సహజమైన రూపాన్ని వాడుతూ, ప్రత్యామ్నాయాన్ని పాదసూచికలో తెలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. మూలంలోని వ్యతిరేకతను ‘అయితే’తో, నెరవేర్పు భావాన్ని ‘అర్థం చెప్పినట్లుగానే జరిగింది’తో సహజంగా వ్యక్తం చేశాం.
