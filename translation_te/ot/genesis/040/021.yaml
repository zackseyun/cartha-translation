source:
  edition: WLC
  text: וַ/יָּ֛שֶׁב אֶת שַׂ֥ר הַ/מַּשְׁקִ֖ים עַל מַשְׁקֵ֑/הוּ וַ/יִּתֵּ֥ן הַ/כּ֖וֹס עַל כַּ֥ף פַּרְעֹֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/021.yaml
  text: He restored the chief cupbearer to his office[b][a], and he put the cup into Pharaoh’s hand.
translation:
  language: te
  text: అతడు పానదాయకుల అధిపతిని తిరిగి అతని పదవిలో నియమించాడు; పానదాయకుల అధిపతి ఫరో చేతికి పానపాత్రను అందించాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשֶׁב
  choice: మళ్లీ ... నియమించాడు
  rationale: שׁוב యొక్క హిఫిల్ రూపం ఇక్కడ పూర్వపు స్థితికి లేదా బాధ్యతకు తిరిగి చేర్చడాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ఈ భావాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: שַׂר הַמַּשְׁקִים
  choice: పానదాయకుల అధిపతి
  rationale: שַׂר అధికారిని లేదా అధిపతిని, מַשְׁקִים రాజసభలో పానీయాలు అందించేవారిని సూచిస్తాయి; ఈ పదబంధం హోదాను స్పష్టంగా తెలియజేస్తుంది.
- source_word: עַל מַשְׁקֵהוּ
  choice: అతని పదవిలో
  rationale: అక్షరార్థంగా అతని పానీయాలు అందించే సేవకు అని ఉన్నా, సందర్భంలో ఇది అతని మునుపటి రాజసభ పదవిని సూచిస్తుంది.
- source_word: וַיִּתֵּן
  choice: అందించాడు
  rationale: נתן యొక్క మూలార్థం ఇవ్వడం; పాత్రను ఫరో చేతికి ఇచ్చే రాజసభ సేవను తెలుగులో ‘అందించాడు’ సహజంగా వ్యక్తపరుస్తుంది.
- source_word: הַכּוֹס
  choice: పాత్రను
  rationale: כּוֹס అనేది తాగే పాత్ర లేదా గిన్నె; రాజసభ సందర్భంలో ‘పాత్ర’ గౌరవప్రదమైన, సహజమైన పదం.
- source_word: עַל כַּף פַּרְעֹה
  choice: ఫరో చేతికి
  rationale: כַּף అక్షరార్థంగా అరచేయి అయినా, ఈ ప్రయోగంలో చేతికి ఇవ్వడం అనే సహజ తెలుగు రూపం తగినది.
theological_decisions:
- issue: రెండవ క్రియలో కర్త ఎవరు
  choice: హీబ్రూ పాఠంలోని ‘అతడు’ అనే అనిర్దిష్టతను ప్రధాన వాక్యంలో నిలిపివేయడం
  alternative: ‘పానదాయకుల అధిపతి ఫరో చేతికి పాత్రను అందించాడు’ అని కర్తను స్పష్టం చేయడం
  rationale: וַיִּתֵּן లో కర్త సర్వనామంగా అంతర్లీనంగా ఉంది; సమీప సందర్భం పానదాయకుడిని సూచించినప్పటికీ, మూలపాఠం పేరును మళ్లీ చెప్పదు. అందువల్ల నిజమైన వ్యాకరణ అనిర్దిష్టతను తొలగించకుండా, పాదటిప్పణిలో సందర్భార్థాన్ని తెలియజేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. ‘పానదాయకుల అధిపతి’ రాజసభ హోదాను స్పష్టంగా ఉంచుతుంది; ‘అతని పదవిలో’ అక్షరార్థంలోని పానీయ సేవ భావాన్ని సందర్భానుగుణంగా వ్యక్తపరుస్తుంది.
