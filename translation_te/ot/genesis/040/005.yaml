translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకుడికి అర్థమయ్యే, గౌరవప్రదమైన కథనశైలి. హీబ్రూ వాక్యంలోని పునరుక్త విభజనాత్మక నిర్మాణాన్ని ‘ఒక్కొక్కరు/ఒక్కొక్కరి’ ద్వారా నిలుపుతూ, తెలుగులో భారంగా మారే చోట విరామచిహ్నాలు మరియు వివరణాత్మక వాక్య విభజన ఉపయోగించబడ్డాయి.
