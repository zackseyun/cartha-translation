  text: וַ/יַּֽחַלְמוּ֩ חֲל֨וֹם שְׁנֵי/הֶ֜ם אִ֤ישׁ חֲלֹמ/וֹ֙ בְּ/לַ֣יְלָה אֶחָ֔ד אִ֖ישׁ כְּ/פִתְר֣וֹן חֲלֹמ֑/וֹ הַ/מַּשְׁקֶ֣ה וְ/הָ/אֹפֶ֗ה אֲשֶׁר֙ לְ/מֶ֣לֶךְ מִצְרַ֔יִם אֲשֶׁ֥ר אֲסוּרִ֖ים בְּ/בֵ֥ית הַ/סֹּֽהַר׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/005.yaml
  text: And the two of them dreamed a dream[a], each man his own dream, in one night, each according to the interpretation of his dream—the cupbearer and the baker who belonged to the king of Egypt[d][c][b], who were confined in the prison house.
translation:
  language: te
  text: ఆ ఇద్దరూ ఒకే రాత్రిలో కలలు కన్నారు[a]—ప్రతి ఒక్కరూ తనతన కలను, తన కలకు తగిన అర్థం గల కలను[b]. వారు ఐగుప్తు రాజు సేవలో ఉన్న[c] పానదాయకుడూ రొట్టెలు కాల్చేవాడూ; చెరసాలలో నిర్బంధించబడి ఉన్నారు[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా ‘ఒక కలను కలగన్నారు’ అనే ఒకే మూలపదంతో ఏర్పడిన ప్రయోగం ఉంది. ‘ఆ ఇద్దరికీ ఒకే రాత్రిలో ఒక్కొక్క కల వచ్చింది’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘ఒక్కొక్క కలకు దాని సొంత అర్థం ఉండేలా.’ ప్రతి కలకు దానితో సరిపోలే ప్రత్యేక అర్థం ఉందని హీబ్రూ నొక్కి చెబుతుంది.
    reason: lexical_alternative
  - marker: c
    text: అక్షరార్థంగా ‘ఐగుప్తు రాజుకు చెందిన.’ ఇది రాజు సేవకు అధికారికంగా అనుబంధమైనవారిని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: d
    text: లేదా ‘చెరసాలలో బంధించబడి ఉన్నారు.’ హీబ్రూ పదం బంధించబడడం లేదా ఖైదులో ఉంచబడడం అనే భావాలను ఇవ్వగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחַלְמוּ חֲלוֹם
  choice: కలలు కన్నారు
  rationale: హీబ్రూలో ఒకే మూలానికి చెందిన క్రియ-నామవాచక ప్రయోగం అక్షరార్థంగా ఉన్నా, తెలుగులో ‘కలను కలగన్నారు’ అసహజంగా ఉంటుంది. సహజమైన ‘కలలు కన్నారు’ భావాన్ని స్పష్టంగా అందిస్తుంది; మూల నిర్మాణాన్ని పాదటిప్పణి తెలియజేస్తుంది.
- source_word: שְׁנֵיהֶם
  choice: ఆ ఇద్దరూ
  rationale: ముందటి సందర్భంలోని ఇద్దరు అధికారులను సూచిస్తూ, హీబ్రూ ద్వివచన భావాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: אִישׁ חֲלֹמוֹ
  choice: ఒక్కొక్కరు తమతమ కలను
  rationale: אִישׁ యొక్క విభజనాత్మక బలాన్ని, ప్రతి వ్యక్తికి వేరొక కల ఉన్నదనే భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: בְּלַיְלָה אֶחָד
  choice: ఒకే రాత్రిలో
  rationale: అక్షరార్థమైన ‘ఒక రాత్రిలో’ కంటే, ఇద్దరికీ అదే రాత్రి కలలు వచ్చాయనే సందర్భార్థాన్ని తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: אִישׁ כְּפִתְרוֹן חֲלֹמוֹ
  choice: ఒక్కొక్కరి కలకు తగిన అర్థంతో
  rationale: כְּ సూచించే సరిపోలికను ‘తగిన’ ద్వారా వ్యక్తం చేస్తూ, ప్రతి కలలో దానికి అనుగుణమైన అర్థం ఉందనే మూలంలోని భావాన్ని నిలుపుతుంది.
- source_word: הַמַּשְׁקֶה
  choice: పానదాయకుడు
  rationale: రాజుకు పానీయం అందించే అధికారిని సూచించే సంక్షిప్తమైన, గౌరవప్రదమైన తెలుగు పదం; ఈ వచనంలో లేని ‘ప్రధాన’ అనే విశేషణాన్ని చేర్చదు.
- source_word: הָאֹפֶה
  choice: రొట్టెలవాడు
  rationale: రాజభవనంలో కాల్చిన ఆహార పదార్థాలు సిద్ధం చేసే వ్యక్తిని సాధారణ పాఠకుడికి అర్థమయ్యేలా సూచిస్తుంది; మూలంలో లేని ‘ప్రధాన’ అనే పదాన్ని చేర్చదు.
- source_word: אֲשֶׁר לְמֶלֶךְ מִצְרַיִם
  choice: ఐగుప్తు రాజు సేవలో ఉన్న
  rationale: לְ సూచించే రాజుతో వారి అధికారిక అనుబంధాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; అక్షరార్థమైన ‘రాజుకు చెందిన’ అనేది వ్యక్తుల యాజమాన్య భావాన్ని అనవసరంగా ముందుకు తెచ్చే అవకాశం ఉంది.
- source_word: אֲסוּרִים בְּבֵית הַסֹּהַר
  choice: చెరసాలలో నిర్బంధించబడి ఉన్నారు
  rationale: אסר యొక్క బంధించబడిన/ఖైదు చేయబడిన భావాన్నీ, בֵּית הַסֹּהַר అనే నిర్బంధ స్థలాన్నీ స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
