  text: וַ/יַּ֥רְא שַׂר הָ/אֹפִ֖ים כִּ֣י ט֣וֹב פָּתָ֑ר וַ/יֹּ֨אמֶר֙ אֶל יוֹסֵ֔ף אַף אֲנִי֙ בַּ/חֲלוֹמִ֔/י וְ/הִנֵּ֗ה שְׁלֹשָׁ֛ה סַלֵּ֥י חֹרִ֖י עַל רֹאשִֽׁ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/016.yaml
  text: When the chief baker saw that he had interpreted well[a], he said to Yoseph, “I also had a dream, and behold, three baskets of white bread were on my head.”
translation:
  language: te
  text: 'రొట్టెలు కాల్చేవారి అధికారి యోసేపు చక్కగా అర్థం చెప్పాడని చూసి, యోసేపుతో ఇలా అన్నాడు: “నాకూ ఒక కల వచ్చింది. ఇదిగో, నా తల మీద తెల్లని రొట్టెలున్న మూడు గంపలు ఉన్నాయి[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “కాల్చిన ఆహార పదార్థాలున్న మూడు గంపలు.” హీబ్రూ పదం חֹרִי అర్థం అనిశ్చితం; అది గంపల్లో ఉన్న తెల్లని రొట్టెలను లేదా పిండివంటలను సూచించవచ్చు, లేక గంపలు రంధ్రాలున్నవని లేదా అల్లినవని వర్ణించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׂר הָאֹפִים
  choice: రొట్టెలు కాల్చేవారి అధికారి
  rationale: שַׂר ఒక ముఖ్య అధికారిని, הָאֹפִים రొట్టెలు కాల్చే వృత్తివారిని సూచిస్తాయి. ఈ రూపం ఆధునిక తెలుగులో పదవి భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: כִּי טוֹב פָּתָר
  choice: చక్కగా అర్థం చెప్పాడని
  rationale: טוֹב ఇక్కడ క్రియావిశేషణ భావంతో యోసేపు కలకు అర్థం చెప్పిన తీరు మంచిదని సూచిస్తుంది. ‘అనుకూలమైన అర్థం’ అని చెప్పకుండా మూలంలోని విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: אַף אֲנִי בַּחֲלוֹמִי
  choice: నాకూ ఒక కల వచ్చింది
  rationale: ఈ హీబ్రూ ప్రయోగం సంక్షిప్తమైన, క్రియలేని కలవివరణ ఆరంభం. తెలుగులో సహజంగా ఉండేలా చేసి, אַף אֲנִי లోని ‘నేనూ’ అనే అదనపు భావాన్ని నిలిపింది.
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: కలలో కనిపించిన దృశ్యాన్ని సజీవంగా పరిచయం చేసే సూచక పదంగా הִנֵּה యొక్క వాక్యప్రయోగాన్ని నిలుపుతుంది.
- source_word: שְׁלֹשָׁה סַלֵּי חֹרִי
  choice: తెల్లని రొట్టెలున్న మూడు గంపలు
  rationale: חֹרִי అర్థం అనిశ్చితం. సందర్భానుసారంగా ‘తెల్లని రొట్టె’ అనే సాంప్రదాయిక అవగాహనను ప్రధాన పాఠంలో స్వీకరించి, ఇతర సాధ్యార్థాలను పాదసూచికలో ఉంచింది.
- source_word: עַל רֹאשִׁי
  choice: నా తల మీద
  rationale: సరళమైన స్థానార్థక పదబంధాన్ని సహజమైన ఆధునిక తెలుగులో నేరుగా అందిస్తుంది.
- source_word: יוֹסֵף
  choice: యోసేపు
  rationale: హీబ్రూ יוֹסֵף పేరుకు దగ్గరగా ఉండి, తెలుగు బైబిలు పఠనంలో సుపరిచితమైన రూపం.
