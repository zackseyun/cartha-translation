source:
  edition: WLC
  text: וּ/בַ/סַּ֣ל הָֽ/עֶלְי֔וֹן מִ/כֹּ֛ל מַאֲכַ֥ל פַּרְעֹ֖ה מַעֲשֵׂ֣ה אֹפֶ֑ה וְ/הָ/ע֗וֹף אֹכֵ֥ל אֹתָ֛/ם מִן הַ/סַּ֖ל מֵ/עַ֥ל רֹאשִֽׁ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/017.yaml
  text: and in the top basket were all kinds of food for Pharaoh[a], the work of a baker, and the birds were eating them from the basket above my head.
translation:
  language: te
  text: పై బుట్టలో ఫరో కోసం రొట్టెలు కాల్చేవాడు తయారుచేసిన రకరకాల ఆహార పదార్థాలు ఉన్నాయి[a]. నా తలపై ఉన్న ఆ బుట్టలోనుంచి పక్షులు వాటిని తింటూ ఉన్నాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఫరో కోసం రకరకాల ఆహార పదార్థాలు—రొట్టెలు కాల్చేవాని పని.’ అంటే, రొట్టెలు కాల్చేవాడు తయారుచేసిన పదార్థాలు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַסַּל הָעֶלְיוֹן
  choice: పై బుట్టలో
  rationale: עֶלְיוֹן ఇక్కడ బుట్టలలో పైభాగాన ఉన్నదాన్ని సూచిస్తుంది; ‘పై బుట్ట’ సహజమైన ఆధునిక తెలుగు.
- source_word: מִכֹּל מַאֲכַל פַּרְעֹה
  choice: ఫరో కోసం రకరకాల ఆహార పదార్థాలు
  rationale: מִכֹּל మరియు సమూహార్థక మַאֲכַל కలయిక వైవిధ్యాన్ని సూచిస్తుంది; ‘రకరకాల’ ఆ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: מַעֲשֵׂה אֹפֶה
  choice: రొట్టెలు కాల్చేవాని పనివి
  rationale: మూలంలో అక్షరార్థంగా ‘కాల్చేవాని పని’; సందర్భంలో అతడు తయారుచేసిన కాల్చిన ఆహార పదార్థాలను సూచిస్తుంది. ప్రధాన పాఠం మూల రూపకల్పనకు దగ్గరగా ఉంటుంది.
- source_word: וְהָעוֹף
  choice: పక్షులు
  rationale: עוֹף ఏకవచన రూపంలో ఉన్నా సమూహార్థకంగా పక్షులను సూచించగలదు; సందర్భానికి తెలుగు బహువచనం సహజం.
- source_word: אֹכֵל
  choice: తింటూ ఉన్నాయి
  rationale: వర్తమాన కృదంతం కలలో కొనసాగుతున్న చర్యను చూపిస్తుంది; తెలుగు కొనసాగింపు రూపం దాన్ని నిలుపుతుంది.
- source_word: אֹתָם
  choice: వాటిని
  rationale: పుంలింగ బహువచన ప్రత్యయం బుట్టలోని ఆహార పదార్థాలను తిరిగి సూచిస్తుంది.
- source_word: מִן הַסַּל
  choice: ఆ బుట్టలోనుంచి
  rationale: מִן మూలస్థానాన్ని సూచిస్తుంది; ‘లోనుంచి’ తెలుగులో స్పష్టమైన, సహజమైన రూపం.
- source_word: מֵעַל רֹאשִׁי
  choice: నా తలపైన ఉన్న
  rationale: מֵעַל తలకు పైగా ఉన్న స్థానాన్ని సూచిస్తుంది; బుట్ట తలను తాకిందని తప్పనిసరిగా నిర్ధారించకుండా స్థాన సంబంధాన్ని నిలుపుతుంది.
