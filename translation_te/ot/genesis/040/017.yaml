translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడబడింది. ‘రొట్టెలు కాల్చేవాడు’ సాధారణ పాఠకునికి ‘బేకర్’ కంటే సులభంగా అర్థమవుతుంది; మూలంలోని సంక్షిప్తమైన ‘కాల్చేవాని పని’ భావాన్ని ప్రధాన పాఠంలో నిలిపి, సందర్భానుగుణ అర్థాన్ని పాదటీకాలో ఇచ్చాం.
