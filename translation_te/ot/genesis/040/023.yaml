  text: But the chief cupbearer did not remember Joseph[a], but forgot him.
translation:
  language: te
  text: అయితే ప్రధాన పానదాయకుడు యోసేపును గుర్తుంచుకోలేదు[a]; అతన్ని మరచిపోయాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ప్రధాన పానదాయకుడు యోసేపును గుర్తుంచుకోలేదు; అతన్ని మరచిపోయాడు.”
    reason: హీబ్రూ וְ సందర్భంలో వ్యతిరేక భావాన్ని సూచించవచ్చు; సాధారణ సంధానార్థంలో దానిని అనువదించకుండా కూడా వాక్యాన్ని చదవవచ్చు.
lexical_decisions:
- source_word: וְ/לֹא
  choice: కానీ ... లేదు
  rationale: ముందటి వచనంలో యోసేపు చెప్పినది నెరవేరినప్పటికీ అతనికి మేలు జరగకపోవడాన్ని వ్యతిరేక మలుపుగా సహజంగా తెలియజేస్తుంది.
- source_word: זָכַר
  choice: జ్ఞాపకం చేసుకోలేదు
  rationale: మూల క్రియ యొక్క సాధారణ అర్థమైన ‘గుర్తుంచుకోవడం/జ్ఞాపకం చేసుకోవడం’ను కాపాడుతుంది; అతని తరఫున చర్య తీసుకోలేదనే భావాన్ని అనవసరంగా పదంలో చేర్చదు.
- source_word: שַׂר הַמַּשְׁקִים
  choice: పానదాయకుల అధిపతి
  rationale: ఫరో పానీయ సేవకు బాధ్యత వహించిన ఉన్నత రాజోద్యోగి అనే హోదాను గౌరవప్రదంగా, స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: אֶת יוֹסֵף
  choice: యోసేపును
  rationale: హీబ్రూ ప్రత్యక్ష కర్మ సూచికను తెలుగు ద్వితీయా విభక్తితో సహజంగా వ్యక్తపరుస్తుంది; పేరును ప్రాజెక్టు పద్ధతికి అనుగుణంగా లిప్యంతరీకరిస్తుంది.
- source_word: וַיִּשְׁכָּחֵהוּ
  choice: అతన్ని మరచిపోయాడు
  rationale: క్రియలోని ‘మరచిపోవడం’ అనే అర్థాన్నీ, యోసేపును సూచించే ఏకవచన కర్మ ప్రత్యయాన్నీ కాపాడుతుంది; ముందటి ప్రతికూల వాక్యాన్ని బలంగా పునరుద్ఘాటిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. ‘జ్ఞాపకం చేసుకోలేదు ... మరచిపోయాడు’ అనే హీబ్రూ పునరుక్తి ఉద్దేశపూర్వకంగా నిలుపబడింది; ప్రధాన వాక్యంలో సెమీకోలన్ ద్వారా రెండో భాగం బలమైన పునరుద్ఘాటనగా వినిపిస్తుంది.
