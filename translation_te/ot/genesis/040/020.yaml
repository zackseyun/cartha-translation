  text: וַ/יְהִ֣י בַּ/יּ֣וֹם הַ/שְּׁלִישִׁ֗י י֚וֹם הֻלֶּ֣דֶת אֶת פַּרְעֹ֔ה וַ/יַּ֥עַשׂ מִשְׁתֶּ֖ה לְ/כָל עֲבָדָ֑י/ו וַ/יִּשָּׂ֞א אֶת רֹ֣אשׁ שַׂ֣ר הַ/מַּשְׁקִ֗ים וְ/אֶת רֹ֛אשׁ שַׂ֥ר הָ/אֹפִ֖ים בְּ/ת֥וֹךְ עֲבָדָֽי/ו׀־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/020.yaml
  text: And on the third day[a], Pharaoh’s birthday, he made a feast for all his servants, and he lifted up the head of the chief cupbearer and the head of the chief baker among his servants.
translation:
  language: te
  text: మూడవ రోజున, ఫరో పుట్టినరోజున, అతడు తన సేవకులందరికీ విందు ఏర్పాటు చేశాడు. అప్పుడు తన సేవకుల మధ్య పానదాయకుల అధిపతి తలనూ, రొట్టెలు కాల్చేవారి అధిపతి తలనూ పైకెత్తాడు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, భావానువాదంగా, “వారిని ప్రత్యేకంగా గుర్తించాడు” లేదా “వారి సంగతి విచారించాడు.” హీబ్రూలో అక్షరార్థంగా “తలను పైకెత్తాడు” అని ఉంది. చుట్టుపక్కల కథనంలో ఇదే పదప్రయోగం ఆ ఇద్దరు అధికారులకు వచ్చిన వేర్వేరు ఫలితాలతో ముడిపడి ఉన్నందున దానిని ఇక్కడ నిలిపాము.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַּיּוֹם הַשְּׁלִישִׁי
  choice: మూడవ రోజున
  rationale: హీబ్రూ కథన క్రమాన్ని సహజమైన ఆధునిక తెలుగు కాలవాచక నిర్మాణంతో వ్యక్తపరుస్తుంది; וַיְהִיని విడిగా కృత్రిమంగా అనువదించలేదు.
- source_word: יוֹם הֻלֶּדֶת אֶת־פַּרְעֹה
  choice: అంటే ఫరో పుట్టినరోజున
  rationale: ‘ఫరో పుట్టిన రోజు’ అనే భావాన్ని సహజంగా తెలుపుతూ, మూడవ రోజు ఏ సందర్భమో స్పష్టం చేస్తుంది.
- source_word: וַיַּעַשׂ מִשְׁתֶּה
  choice: విందు ఏర్పాటు చేశాడు
  rationale: విందును నిర్వహించడం లేదా సిద్ధం చేయడం అనే క్రియార్థాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: לְכָל עֲבָדָיו
  choice: తన సేవకులందరికీ
  rationale: రాజసభ పరిధిలోని సేవకులు, పరివారం, అధికారులు అన్న విస్తృత భావాన్ని ‘సేవకులు’ తటస్థంగా నిలుపుతుంది.
- source_word: וַיִּשָּׂא אֶת־רֹאשׁ
  choice: తలను ... పైకెత్తాడు
  rationale: 13, 19 వచనాల్లో భిన్న ఫలితాలతో వాడిన హీబ్రూ పదప్రయోగాన్ని ఉద్దేశపూర్వకంగా నిలుపుతుంది; భావాన్ని ‘గుర్తించాడు’ అని ఏకార్థం చేయదు.
- source_word: שַׂר הַמַּשְׁקִים
  choice: పానదాయకుల అధిపతి
  rationale: రాజుకు పానీయాలు అందించే వారి మీదున్న అధికారిని సూచించే సభాపదవిని సంక్షిప్తంగా, గౌరవప్రదంగా తెలుపుతుంది.
- source_word: שַׂר הָאֹפִים
  choice: రొట్టెలు కాల్చేవారి అధిపతి
  rationale: ‘బేకర్ల అధిపతి’ అనే రాజసభ పదవిని సాధారణ ఆధునిక తెలుగు పాఠకునికి అర్థమయ్యేలా అందిస్తుంది.
- source_word: בְּתוֹךְ עֲבָדָיו
  choice: తన సేవకుల మధ్య
  rationale: ఈ చర్య రాజసేవకుల సమక్షంలో జరిగిందనే స్థానార్థాన్ని నేరుగా నిలుపుతుంది.
