id: GEN.40.8
reference: Genesis 40:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּאמְר֣וּ אֵלָ֔י/ו חֲל֣וֹם חָלַ֔מְנוּ וּ/פֹתֵ֖ר אֵ֣ין אֹת֑/וֹ וַ/יֹּ֨אמֶר אֲלֵ/הֶ֜ם יוֹסֵ֗ף הֲ/ל֤וֹא לֵֽ/אלֹהִים֙ פִּתְרֹנִ֔ים סַפְּרוּ נָ֖א לִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/008.yaml
  text: They said to him[a], “We have dreamed a dream, and there is no one to interpret it.” Joseph said to them[b], “Do not interpretations belong to God? Please tell them to me.”
translation:
  language: te
  text: వారు అతనితో[a], “మేము ఒక కల కన్నాం; దానికి అర్థం చెప్పేవారెవరూ లేరు” అన్నారు. అప్పుడు యోసేపు వారితో[b], “కలల అర్థాలు దేవునికే చెందుతాయి కదా? దయచేసి మీ కలలను నాకు చెప్పండి” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ వాక్యం అక్షరార్థంగా, “ఒక కలను మేము కన్నాం” అని ఉంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “కలల అర్థాలు దేవునికి చెందినవే కావా?”
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲלוֹם חָלַמְנוּ
  choice: మేము ఒక కల కన్నాం
  rationale: హీబ్రూలో ఒకే మూలపదంతో వచ్చిన ‘కల—కన్నాం’ అనే cognate accusative నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: וּפֹתֵר אֵין אֹתוֹ
  choice: దానికి అర్థం చెప్పేవారెవరూ లేరు
  rationale: פֹתֵר అనే క్రియాత్మక కృదంతం ‘అర్థం చెప్పే వ్యక్తి’ని సూచిస్తుంది; అందుబాటులో వ్యాఖ్యాత లేడనే భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: הֲלוֹא
  choice: కదా?
  rationale: సమ్మతిని ఆశించే అలంకారిక ప్రశ్నను తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: לֵאלֹהִים פִּתְרֹנִים
  choice: కలల అర్థాలు దేవునికే చెందుతాయి
  rationale: לְ ద్వారా వ్యక్తమయ్యే అధికారం లేదా మూలాన్ని ‘దేవునికే చెందుతాయి’గా ఉంచి, బహువచనమైన פִּתְרֹנִיםను ‘అర్థాలు’గా ప్రతిబింబిస్తుంది.
- source_word: סַפְּרוּ נָא לִי
  choice: దయచేసి మీ కలలను నాకు చెప్పండి
  rationale: נָאలోని మర్యాదపూర్వక అభ్యర్థనను ‘దయచేసి’గా చూపుతుంది. ప్రత్యక్ష కర్మ మూలపాఠంలో వ్యక్తంగా లేకపోయినా, ఇద్దరు వ్యక్తులు తమ తమ కలలను చెప్పబోతున్న సందర్భం వల్ల ‘మీ కలలను’ సహజంగా స్పష్టం చేయబడింది.
- source_word: יוֹסֵף
  choice: యోసేపు
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
theological_decisions:
- issue: యోసేపు మాటలో אֱלֹהִים యొక్క సూచన
  choice: దేవుడు
  alternative: ఒక దేవుడు / దేవతలు
  rationale: యోసేపు కథన సందర్భంలో కలల అర్థాన్ని వెల్లడించే అధికారానికి మూలమైన నిజ దేవునినే ఇది సూచిస్తుంది; బహుదేవతా భావాన్ని సందర్భం సమర్థించదు.
- issue: కలల అర్థాలపై దేవుని సంబంధం
  choice: దేవునికే చెందుతాయి
  alternative: దేవుడే అర్థం చెబుతాడు
  rationale: మూలంలోని స్వామ్య/మూల భావాన్ని కాపాడుతుంది; దేవుడు ఏ విధంగా అర్థాన్ని తెలియజేస్తాడో మూలం చెప్పనందున అదనపు వివరణను చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. హీబ్రూ అలంకారిక ప్రశ్నను ‘కదా?’తో నిలిపి, బహువచన ‘అర్థాలు’ను కాపాడింది. ప్రధాన పాఠంలోని [a], [b] గుర్తులు సంబంధిత పాదటిప్పణులకు సరిపోతాయి.
