id: GEN.40.14
reference: Genesis 40:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּ֧י אִם זְכַרְתַּ֣/נִי אִתְּ/ךָ֗ כַּ/אֲשֶׁר֙ יִ֣יטַב לָ֔/ךְ וְ/עָשִֽׂיתָ נָּ֥א עִמָּדִ֖/י חָ֑סֶד וְ/הִזְכַּרְתַּ֨/נִי֙ אֶל פַּרְעֹ֔ה וְ/הוֹצֵאתַ֖/נִי מִן הַ/בַּ֥יִת הַ/זֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/014.yaml
  text: But if you remember me when it goes well for you[a], please show kindness to me, and mention me to Pharaoh[b], and bring me out of this house.
translation:
  language: te
  text: అయితే నీకు మేలు జరిగినప్పుడు నన్ను జ్ఞాపకం చేసుకొని, దయచేసి నా పట్ల దయ చూపు. ఫరోకు నా సంగతి చెప్పి, ఈ ఇంటి నుండి[a] నన్ను బయటికి రప్పించు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ ‘ఇల్లు’ అనేది యోసేపును నిర్బంధించిన స్థలాన్ని సూచిస్తుంది.
    reason: lexical_clarification
lexical_decisions:
- source_word: כִּי אִם
  choice: అయితే
  rationale: ముందటి మాటకు కొనసాగింపుగా యోసేపు చేస్తున్న బలమైన విజ్ఞప్తిని సహజమైన తెలుగులో తెలియజేస్తుంది; సందర్భంలో షరతు భావం తరువాతి కాలవాచక ఉపవాక్యంతో స్పష్టమవుతుంది.
- source_word: זְכַרְתַּנִי אִתְּךָ
  choice: నన్ను జ్ఞాపకం చేసుకొని
  rationale: זכר అంటే జ్ఞాపకం చేసుకోవడం. אִתְּךָను అక్షరార్థంగా ‘నీతో’ అని చేర్చితే తెలుగులో అసహజంగా ఉంటుంది; వ్యక్తిగతంగా యోసేపును మనసులో ఉంచుకోవాలనే భావం ఈ సహజ ప్రయోగంలో నిలుస్తుంది.
- source_word: כַּאֲשֶׁר יִיטַב לָךְ
  choice: నీకు మేలు జరిగినప్పుడు
  rationale: పానదాయకుడు తిరిగి మంచి స్థితికి చేరే సమయాన్ని సూచించే కాలవాచక భావాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: וְעָשִׂיתָ נָּא עִמָּדִי חָסֶד
  choice: దయచేసి నా పట్ల దయ చూపు
  rationale: נָאలోని వినయపూర్వక విజ్ఞప్తిని ‘దయచేసి’ తెలియజేస్తుంది; ఈ వ్యక్తిగత సందర్భంలో חֶסֶדను ఒడంబడికకు పరిమితం చేయకుండా కార్యరూపమైన దయగా అనువదిస్తుంది.
- source_word: וְהִזְכַּרְתַּנִי אֶל פַּרְעֹה
  choice: ఫరోకు నా సంగతి చెప్పి
  rationale: హిఫిల్ రూపం యోసేపును ఫరో దృష్టికి తీసుకురావడాన్ని సూచిస్తుంది. ‘నా సంగతి చెప్పి’ అనేది ఆధునిక తెలుగులో సహజంగా ఆ కార్యాన్ని వ్యక్తపరుస్తుంది.
- source_word: וְהוֹצֵאתַנִי
  choice: నన్ను బయటికి రప్పించు
  rationale: יצא హిఫిల్‌లో ఉన్న కారణార్థక భావాన్ని ‘రప్పించు’ స్పష్టంగా నిలుపుతుంది; ఫరో అధికారంతో యోసేపు విడుదల కావడానికి చర్య తీసుకోవాలనే భావానికి సరిపోతుంది.
- source_word: מִן הַבַּיִת הַזֶּה
  choice: ఈ ఇంటి నుండి
  rationale: మూలంలోని ‘ఇల్లు’ అనే పదాన్ని వ్యాఖ్యానాత్మకంగా ‘చెరసాల’గా మార్చకుండా ప్రధాన పాఠ్యంలో నిలుపుతుంది.
