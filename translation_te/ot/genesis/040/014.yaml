translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా వినయపూర్వకమైనప్పటికీ అత్యవసరత గల విజ్ఞప్తి స్వరాన్ని నిలిపాం. ‘దయ చూపు,’ ‘నా సంగతి చెప్పి’ వంటి సహజ ప్రయోగాలను వాడుతూ మూలంలోని ‘ఇల్లు’ అనే రూపకాన్ని కాపాడాం.
