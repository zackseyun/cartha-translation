id: GEN.40.13
reference: Genesis 40:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: בְּ/ע֣וֹד שְׁלֹ֣שֶׁת יָמִ֗ים יִשָּׂ֤א פַרְעֹה֙ אֶת רֹאשֶׁ֔/ךָ וַ/הֲשִֽׁיבְ/ךָ֖ עַל כַּנֶּ֑/ךָ וְ/נָתַתָּ֤ כוֹס פַּרְעֹה֙ בְּ/יָד֔/וֹ כַּ/מִּשְׁפָּט֙ הָֽ/רִאשׁ֔וֹן אֲשֶׁ֥ר הָיִ֖יתָ מַשְׁקֵֽ/הוּ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/013.yaml
  text: In three more days Pharaoh will lift up your head and restore you to your position[a], and you will place Pharaoh’s cup into his hand, according to the former custom when you were his cupbearer.
translation:
  language: te
  text: ఇంకా మూడు రోజుల్లో ఫరో నీ తలను పైకెత్తి[a], నిన్ను నీ పదవిలో తిరిగి నియమిస్తాడు. నీవు అతనికి పానదాయకుడిగా ఉన్నప్పుడు పాటించిన మునుపటి పద్ధతి ప్రకారం, ఫరో పానపాత్రను అతని చేతికి అందిస్తావు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “నీ తలను పైకెత్తి.” ఇక్కడ ఈ నుడికారం అనుకూలంగా గుర్తించి పదవిలో తిరిగి నియమించడాన్ని సూచిస్తుంది; ఇదే మాటలు 19వ వచనంలో విరుద్ధమైన భావంతో ప్రయోగించబడ్డాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעוֹד שְׁלֹשֶׁת יָמִים
  choice: ఇంకా మూడు రోజుల్లో
  rationale: మిగిలి ఉన్న కాలవ్యవధి ముగిసినప్పుడు సంఘటన జరుగుతుందనే ముందుచూపును సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: יִשָּׂא ... אֶת רֹאשֶׁךָ
  choice: నీ తలను పైకెత్తి
  rationale: హీబ్రూ నుడికారపు అక్షరార్థ చిత్రాన్ని నిలుపుతుంది; ఇక్కడ అది అనుకూలంగా గుర్తించి పునర్నియమించడాన్ని సూచిస్తుంది, అలాగే 19వ వచనంలోని విరుద్ధ ప్రయోగంతో సాహిత్య సంబంధాన్ని కాపాడుతుంది.
- source_word: וַהֲשִׁיבְךָ עַל כַּנֶּךָ
  choice: నిన్ను నీ పదవిలో తిరిగి నియమిస్తాడు
  rationale: כֵּן ఇక్కడ రాజాస్థానంలోని స్థానం లేదా అధికార పదవిని సూచిస్తుంది; ‘తిరిగి నియమిస్తాడు’ పునరుద్ధరణ భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: וְנָתַתָּ כוֹס פַּרְעֹה בְּיָדוֹ
  choice: ఫరో పానపాత్రను అతని చేతికి అందిస్తావు
  rationale: נתן యొక్క ఇవ్వడం/ఉంచడం భావాన్ని రాజసేవలోని కార్యానికి సహజంగా సరిపోయే ‘అందిస్తావు’తో వ్యక్తం చేస్తూ, చేతికి అనే స్పష్ట చిత్రాన్ని నిలుపుతుంది.
- source_word: כַּמִּשְׁפָּט הָרִאשׁוֹן
  choice: పాటించిన మునుపటి పద్ధతి ప్రకారం
  rationale: מִשְׁפָּט ఇక్కడ తీర్పు లేదా శాసనం కాక, గతంలో స్థిరంగా పాటించిన సేవా పద్ధతిని సూచిస్తుంది.
- source_word: אֲשֶׁר הָיִיתָ מַשְׁקֵהוּ
  choice: నీవు అతనికి పానదాయకుడిగా ఉన్నప్పుడు
  rationale: מַשְׁקֶה రాజుకు పానపాత్ర అందించే అధికార పదవిని సూచిస్తుంది; ‘పానదాయకుడు’ సంక్షిప్తంగా ఆ పాత్రను తెలియజేస్తుంది.
