  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే వాక్య నిర్మాణం వాడబడింది. హీబ్రూ నుడికారాన్ని ప్రధాన పాఠ్యంలో నిలిపి, అపార్థం నివారించేందుకు పాదసూచికలో వివరించబడింది.
