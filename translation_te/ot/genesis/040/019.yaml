id: GEN.40.19
reference: Genesis 40:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: בְּ/ע֣וֹד שְׁלֹ֣שֶׁת יָמִ֗ים יִשָּׂ֨א פַרְעֹ֤ה אֶת רֹֽאשְׁ/ךָ֙ מֵֽ/עָלֶ֔י/ךָ וְ/תָלָ֥ה אוֹתְ/ךָ֖ עַל עֵ֑ץ וְ/אָכַ֥ל הָ/ע֛וֹף אֶת בְּשָׂרְ/ךָ֖ מֵ/עָלֶֽי/ךָ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/019.yaml
  text: In three more days Pharaoh will lift up your head from upon you and hang you on a tree[b][a], and the birds will eat your flesh from upon you.
translation:
  language: te
  text: ఇంకా మూడు రోజుల్లో ఫరో నీ తలను నీ మీదనుండి ఎత్తి[a], నిన్ను ఒక చెట్టుకు[b] వేలాడదీస్తాడు; పక్షులు నీ మాంసాన్ని నీ మీదనుండి తింటాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ అక్షరార్థంగా, ‘నీ తలను నీ మీదనుండి ఎత్తుతాడు.’ పానదాయకుని కల వివరణలో అనుకూలంగా వాడిన అదే మాటకు ఇది భయానక పదచమత్కారం కావచ్చు; ఇక్కడ తలను శరీరం నుండి తొలగించడం భావం.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘కొయ్యకు వేలాడదీస్తాడు’ లేదా ‘కొయ్య స్తంభంపై గుచ్చి నిలుపుతాడు.’ హీబ్రూలో అక్షరార్థంగా ‘చెట్టుపై/చెట్టుకు.’
    reason: alternative_reading
lexical_decisions:
- source_word: בְּעוֹד שְׁלֹשֶׁת יָמִים
  choice: ఇంకా మూడు రోజుల్లో
  rationale: బְּעוֹד అనే కాలవ్యవధి ప్రయోగం మిగిలి ఉన్న వ్యవధిని సూచిస్తుంది. ఈ తెలుగు రూపం ఆధునికంగా, సహజంగా ఉండి ‘మరో మూడు రోజుల తరువాత/లోగా’ అనే భావాన్ని అందిస్తుంది.
- source_word: יִשָּׂא ... אֶת רֹאשְׁךָ מֵעָלֶיךָ
  choice: నీ తలను నీ మీదనుండి ఎత్తి
  rationale: హీబ్రూ ‘నీ తలను ఎత్తడం’ అనే ప్రయోగాన్ని 13వ వచనంలోని అనుకూల ప్రయోగంతో ఉన్న భయానక పదచమత్కారంతో సహా నిలుపుతుంది. ‘నీ మీదనుండి’ అనే మాట ఇక్కడ తలను శరీరం నుండి తొలగించే ప్రతికూల భావాన్ని సూచిస్తుంది; ‘తల నరికించి’ అని స్పష్టీకరించడం మూలంలోని ఉద్దేశపూర్వక అస్పష్టతను తొలగిస్తుంది.
- source_word: וְתָלָה אֹתְךָ עַל עֵץ
  choice: నిన్ను ఒక చెట్టుకు వేలాడదీస్తాడు
  rationale: תלה కు ‘వేలాడదీయడం,’ עֵץ కు ‘చెట్టు/కలప’ ప్రాథమిక అర్థాలు. ‘చెట్టుకు’ అనేది మూలరూపాన్ని, మరణశిక్ష సందర్భంలోని దృశ్యాన్ని నిలుపుతుంది; అది స్తంభం లేదా కొయ్య నిర్మాణాన్ని కూడా సూచించి ఉండవచ్చు.
- source_word: וְאָכַל הָעוֹף
  choice: పక్షులు ... తింటాయి
  rationale: עוֹף ఏకవచన సామూహిక నామం. తెలుగులో సహజమైన సామూహిక బహువచనం ‘పక్షులు’ ఎంచుకోబడింది; אכל యొక్క సాదా భావానికి ‘తింటాయి’ సరిపోతుంది.
- source_word: אֶת בְּשָׂרְךָ מֵעָלֶיךָ
  choice: నీ మాంసాన్ని నీ మీదనుండి తింటాయి
  rationale: בשר యొక్క స్పష్టమైన ‘మాంసం’ భావాన్ని మృదువుపరచకుండా ఉంచుతుంది. మళ్లీ వచ్చిన מֵעָלֶיךָ ను ‘నీ మీదనుండి’ అని పునరావృతం చేసి, వేలాడుతున్న దేహం మీదనుండి పక్షులు మాంసాన్ని తినే తీవ్రమైన చిత్రాన్ని నిలుపుతుంది.
theological_decisions:
- issue: తీర్పు ప్రవచనంలోని మరణశిక్ష దృశ్యాన్ని, తలను ఎత్తడం అనే పదచమత్కారాన్ని ఎలా అనువదించాలి
  choice: ‘నీ తలను నీ మీదనుండి ఎత్తి’ అని హీబ్రూ రూపకాన్ని, దాని భయానక ద్వంద్వార్థాన్ని నిలుపడం
  alternative: ‘నీ తలను నరికి, నీ శరీరాన్ని కొయ్య స్తంభానికి వేలాడదీస్తాడు’ అని భావాన్ని పూర్తిగా విప్పి చెప్పడం
  rationale: స్పష్టీకరించిన ప్రత్యామ్నాయం సంఘటనను వెంటనే అర్థమయ్యేలా చేస్తుంది, కాని 13వ వచనంలోని అనుకూలమైన ‘తలను ఎత్తడం’ అనే మాటతో ఉన్న సాహిత్య ప్రతిధ్వనిని, ఉద్దేశపూర్వక ఉద్విగ్నతను తొలగిస్తుంది. ఎంపిక చేసిన రూపం క్రూరతను మృదువుపరచకుండా నిజమైన అస్పష్టతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన శైలి. మూలంలోని పునరుక్తి, కఠినమైన మరణశిక్ష దృశ్యం, 13వ వచనంతో ఉన్న పదచమత్కారం ఉద్దేశపూర్వకంగా మృదువుపరచబడలేదు.
