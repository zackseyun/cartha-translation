source:
  edition: WLC
  text: וַ/יְהִ֗י אַחַר֙ הַ/דְּבָרִ֣ים הָ/אֵ֔לֶּה חָֽטְא֛וּ מַשְׁקֵ֥ה מֶֽלֶךְ מִצְרַ֖יִם וְ/הָ/אֹפֶ֑ה לַ/אֲדֹנֵי/הֶ֖ם לְ/מֶ֥לֶךְ מִצְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/001.yaml
  text: After these things[a], the cupbearer of the king of Egypt and the baker sinned against their master, the king of Egypt.
translation:
  language: te
  text: ఈ సంగతులు జరిగిన తరువాత[a], ఐగుప్తు రాజు పానదాయకుడూ రొట్టెలు చేసేవాడూ తమ యజమానియైన ఐగుప్తు రాజుకు పాపం చేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఈ సంఘటనల తరువాత.’ హీబ్రూ కథన సూత్రాన్ని మరింత అక్షరార్థంగా, ‘ఈ సంగతుల తరువాత ఇలా జరిగింది’ అని అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַחַר הַדְּבָרִים הָאֵלֶּה
  choice: ఈ సంగతులు జరిగిన తరువాత
  rationale: సాధారణ హీబ్రూ కథన సంధిని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తూ, ‘ఈ సంగతులు’ అనే మూల నిర్మాణాన్ని నిలుపుతుంది.
- source_word: חָטְאוּ
  choice: విరోధంగా పాపం చేశారు
  rationale: ל సూచించే బాధిత పక్షాన్ని స్పష్టంగా తెలియజేస్తూ, క్రియలోని నైతిక మరియు సంబంధపరమైన బలాన్ని నిలుపుతుంది.
- source_word: מַשְׁקֵה
  choice: పానదాయకుడు
  rationale: రాజుకు పానీయం అందించే రాజసభ సేవకుని పదవిని సంక్షిప్తంగా సూచిస్తుంది; ఈ వచనంలో లేని ‘ప్రధాన’ అనే హోదాను చేర్చదు.
- source_word: הָאֹפֶה
  choice: రొట్టెలు చేసేవాడు
  rationale: నామవాచకంగా వాడిన నిర్దిష్ట కృదంతం ‘రొట్టెలు చేసేవాడు/బేకరు’ అని అర్థం; అనవసరమైన స్వామ్యసూచకాన్ని చేర్చకుండా సాధారణ పాఠకునికి స్పష్టంగా ఉంటుంది.
- source_word: לַאֲדֹנֵיהֶם
  choice: తమ యజమాని
  rationale: ఇక్కడ אדון దైవబిరుదు కాక మానవ అధిపతిని సూచిస్తుంది; రాజసభ సేవకుల సందర్భంలో ‘యజమాని’ సహజం.
- source_word: לְמֶלֶךְ מִצְרָיִם
  choice: ఐగుప్తు రాజు
  rationale: ఈ పదబంధం ‘తమ యజమాని’ ఎవరనేది వివరిస్తుంది; మూలంలోని పునరుక్తిని నిలిపి, అవమానించబడిన రాజును నొక్కిచెబుతుంది.
