id: GEN.40.7
reference: Genesis 40:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּשְׁאַ֞ל אֶת סְרִיסֵ֣י פַרְעֹ֗ה אֲשֶׁ֨ר אִתּ֧/וֹ בְ/מִשְׁמַ֛ר בֵּ֥ית אֲדֹנָ֖י/ו לֵ/אמֹ֑ר מַדּ֛וּעַ פְּנֵי/כֶ֥ם רָעִ֖ים הַ/יּֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/007.yaml
  text: So he asked Pharaoh’s officials who were with him in custody in his master’s house[a], saying[b], “Why are your faces downcast today?”
translation:
  language: te
  text: అప్పుడు యోసేపు తన యజమాని ఇంట్లో తనతోపాటు నిర్బంధంలో ఉన్న ఫరో అధికారులను[a], “ఈ రోజు మీ ముఖాలు ఎందుకు దిగులుగా కనిపిస్తున్నాయి?” అని అడిగాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఫరో నపుంసకులను.” హీబ్రూ పదం అక్షరార్థంగా నపుంసకులను లేదా సాధారణంగా రాజసభ అధికారులను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁאַל
  choice: అప్పుడు ... అడిగాడు
  rationale: వయ్యిక్తోల్ కథనాన్ని ముందుకు నడిపిస్తుంది. ఆధునిక తెలుగు కథన ప్రవాహంలో ‘అప్పుడు’ దాని క్రమబద్ధ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: סְרִיסֵי פַרְעֹה
  choice: ఫరో అధికారులు
  rationale: సָרִיס అనే పదం రాజసభ అధికారులను లేదా అక్షరార్థంగా నపుంసకులను సూచించగలదు. ఇక్కడ వారి రాజోద్యోగమే ప్రధానంగా ఉన్నందున ‘అధికారులు’ స్పష్టమైన ప్రధాన పాఠం; మరొక సాధ్యార్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: אֲשֶׁר אִתּוֹ בְמִשְׁמַר
  choice: తనతోపాటు నిర్బంధంలో ఉన్న
  rationale: ఈ మాటలు యోసేపుతో కలిసి వారు కాపలా కింద నిర్బంధించబడిన స్థితిని సూచిస్తాయి; ‘నిర్బంధం’ స్థలం కంటే ఆ స్థితిని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בֵּית אֲדֹנָיו
  choice: తన యజమాని ఇంట్లో
  rationale: సందర్భంలో యజమాని యోసేపు యజమానే. ‘ఇల్లు’ అనే పదం గృహ సముదాయంలో ఉన్న నిర్బంధ స్థలాన్నీ కలుపుకోగల హీబ్రూ ప్రయోగాన్ని నిలుపుతుంది.
- source_word: פְּנֵיכֶם רָעִים
  choice: మీ ముఖాలు ... దిగులుగా కనిపిస్తున్నాయి
  rationale: అక్షరార్థంగా ‘మీ ముఖాలు చెడ్డగా ఉన్నాయి’ అనే హీబ్రూ నుడికారం విచారంతో లేదా కలవరంతో ఉన్న ముఖకవళికలను సూచిస్తుంది. ‘దిగులుగా కనిపిస్తున్నాయి’ దానిని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: הַיּוֹם
  choice: ఈ రోజు
  rationale: కాలసూచకమైన హీబ్రూ పదానికి సాధారణ, సహజమైన తెలుగు సమానం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన కథన క్రమాన్ని ఉపయోగించాం. మూలంలోని ముఖాన్ని గురించిన నుడికారాన్ని పూర్తిగా భావానువాదం చేయకుండా ‘ముఖాలు ... దిగులుగా కనిపిస్తున్నాయి’ అని నిలిపాం. వాక్య నిర్మాణాన్ని తెలుగుకు సహజంగా చేయడానికి మూలంలోని לֵאמֹר ను ప్రత్యేకంగా ‘అంటూ’ అని పునరుక్తి చేయకుండా ప్రత్యక్ష ప్రశ్న తర్వాత ‘అని అడిగాడు’లో కలిపాం.
