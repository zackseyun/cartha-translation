translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం ఉపయోగించబడింది. మూలంలోని వరుస క్రియల నిర్మాణాన్ని సాధ్యమైనంతవరకు నిలిపి, ‘నియమించాడు’ అనే పదంలోని పర్యవేక్షణ/సేవ బాధ్యత అస్పష్టతను పాదటీకలో సంరక్షించాం.
