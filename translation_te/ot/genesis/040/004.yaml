id: GEN.40.4
reference: Genesis 40:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ֠/יִּפְקֹד שַׂ֣ר הַ/טַּבָּחִ֧ים אֶת יוֹסֵ֛ף אִתָּ֖/ם וַ/יְשָׁ֣רֶת אֹתָ֑/ם וַ/יִּהְי֥וּ יָמִ֖ים בְּ/מִשְׁמָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/004.yaml
  text: So the captain of the guard assigned Joseph to them[a], and he attended them[b]; and they were in custody for some time.
translation:
  language: te
  text: అప్పుడు అంగరక్షకుల అధిపతి యోసేపును వారి వద్ద నియమించాడు[a]; అతడు వారికి సేవ చేశాడు. వారు కొంతకాలం నిర్బంధంలో ఉన్నారు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యోసేపును వారిమీద నియమించాడు,” అంటే వారి బాధ్యతను అతనికి అప్పగించాడు. హెబ్రీయ క్రియ నియామకాన్ని లేదా బాధ్యత అప్పగించడాన్ని సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: పదశః, “వారు నిర్బంధంలో రోజులు ఉన్నారు”; ఇది వారు అక్కడ కొంతకాలం ఉన్నారని తెలిపే హెబ్రీయ నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְקֹד
  choice: నియమించాడు
  rationale: פקד ఇక్కడ ఒక బాధ్యతకు నియమించడాన్ని సూచిస్తుంది. తరువాతి ‘వారికి సేవ చేశాడు’ అనే క్రియతో కలిపి చూస్తే, యోసేపును ఆ ఖైదీల విషయంలో బాధ్యతతో నియమించిన భావం వస్తుంది.
- source_word: שַׂר הַטַּבָּחִים
  choice: అంగరక్షకుల అధిపతి
  rationale: పదశః వధకుల అధిపతి అనే అర్థం సాధ్యమైనా, ఆదికాండంలోని ఈ బిరుదు రాజభద్రతకు సంబంధించిన ఉన్నతాధికారిని సూచిస్తుంది; అందువల్ల సహజమైన సందర్భోచిత అనువాదం ఎంచుకోబడింది.
- source_word: אֶת־יוֹסֵף אִתָּם
  choice: యోసేపును వారికి
  rationale: ఈ నిర్మాణం యోసేపును ఆ ఖైదీలతో సంబంధమున్న బాధ్యతకు నియమించడాన్ని తెలియజేస్తుంది. ‘వారిమీద’ అని అనువదిస్తే పర్యవేక్షణ భావం అవసరానికి మించి బలపడవచ్చు.
- source_word: וַיְשָׁרֶת אֹתָם
  choice: అతడు వారికి సేవ చేశాడు
  rationale: שרת అంటే సేవ చేయడం లేదా పరిచర్య చేయడం. ఇక్కడ మతపరమైన ప్రత్యేకార్థం లేకుండా ఖైదీల అవసరాలు చూసుకున్న భావాన్ని ‘సేవ చేశాడు’ నేరుగా తెలియజేస్తుంది.
- source_word: וַיִּהְיוּ יָמִים
  choice: కొంతకాలం ఉన్నారు
  rationale: పదశః ‘వారు రోజులు ఉన్నారు’ అనే హెబ్రీయ నుడికారం కొంత కాలవ్యవధిని సూచిస్తుంది; తెలుగులో ‘కొంతకాలం’ సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: בְּמִשְׁמָר
  choice: నిర్బంధంలో
  rationale: מִשְׁמָר కాపలా కింద నిర్బంధం లేదా అదుపును సూచిస్తుంది. ‘చెరసాలలో’ కంటే ‘నిర్బంధంలో’ మూలపద విస్తృతిని మెరుగ్గా కాపాడుతుంది.
