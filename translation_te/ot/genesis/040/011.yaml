source:
  edition: WLC
  text: וְ/כ֥וֹס פַּרְעֹ֖ה בְּ/יָדִ֑/י וָ/אֶקַּ֣ח אֶת הָֽ/עֲנָבִ֗ים וָֽ/אֶשְׂחַ֤ט אֹתָ/ם֙ אֶל כּ֣וֹס פַּרְעֹ֔ה וָ/אֶתֵּ֥ן אֶת הַ/כּ֖וֹס עַל כַּ֥ף פַּרְעֹֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/011.yaml
  text: Pharaoh’s cup was in my hand[a], and I took the grapes and squeezed them into Pharaoh’s cup[c][b], and I placed the cup into Pharaoh’s hand.
translation:
  language: te
  text: ఫరో పానపాత్ర నా చేతిలో ఉంది. నేను ఆ ద్రాక్షపండ్లను తీసుకొని, వాటిని ఫరో పానపాత్రలోకి పిండాను[a]. తరువాత ఆ పానపాత్రను ఫరో అరచేతిపై ఉంచాను[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వాటిని ఫరో పానపాత్రలోకి నలిపి రసం తీశాను.’ ఇక్కడి హీబ్రూ క్రియ ద్రవాన్ని పిండి తీయడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘ఫరో చేతిలో పెట్టాను.’
    reason: lexical_alternative
lexical_decisions:
- source_word: כּוֹס
  choice: పానపాత్ర
  rationale: ఇది త్రాగడానికి ఉపయోగించే పాత్రను సూచిస్తుంది. రాజసభ సందర్భంలో సహజంగా, స్పష్టంగా ఉండేందుకు ‘పానపాత్ర’ను ఎంచుకున్నాం.
- source_word: בְּיָדִי
  choice: నా చేతిలో
  rationale: మూలంలోని స్పష్టమైన దృశ్యాన్ని నిలుపుతూ తెలుగులో సహజంగా ఉంది.
- source_word: וָאֶקַּח
  choice: తీసుకొని
  rationale: కథనంలోని వరుస చర్యను సరళంగా తెలియజేస్తుంది.
- source_word: הָעֲנָבִים
  choice: ఆ ద్రాక్షపండ్లను
  rationale: నిర్దిష్టంగా ముందే ప్రస్తావించిన ద్రాక్షపండ్లను సూచించే మూలంలోని నిర్దేశక భావాన్ని నిలుపుతుంది.
- source_word: וָאֶשְׂחַט אֹתָם אֶל כּוֹס פַּרְעֹה
  choice: వాటిని ఫరో పానపాత్రలోకి పిండాను
  rationale: שׂחט ఇక్కడ ద్రాక్షపండ్లను పిండి వాటి ద్రవాన్ని పాత్రలోకి తీయడాన్ని సూచిస్తుంది. ‘పిండాను’ ఆ చర్యను సహజమైన తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: וָאֶתֵּן
  choice: పెట్టాను
  rationale: נתן సాధారణంగా ‘ఇచ్చాను’ అని అర్థమయ్యే అవకాశం ఉన్నా, ఇక్కడ తరువాతి పదబంధం భౌతికంగా చేతిలో ఉంచడాన్ని సూచిస్తుంది; ‘పెట్టాను’ సందర్భానికి సహజంగా సరిపోతుంది.
- source_word: עַל כַּף פַּרְעֹה
  choice: ఫరో చేతిలో
  rationale: כַּף అక్షరార్థంగా ‘అరచేయి’ అయినా, పాత్రను ఒకరి చేతికి అందించే సందర్భంలో ‘చేతిలో’ అనేది సహజమైన తెలుగు సమానార్థకం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు స్పష్టంగా ఉండే, గౌరవప్రదమైన కథన శైలి. హీబ్రూ వావ్-వరుసను ప్రతి చోటా ‘మరియు’గా యాంత్రికంగా అనువదించకుండా, చర్యల క్రమాన్ని సహజంగా చూపేందుకు రెండవ వాక్యంలో ‘తరువాత’ వాడబడింది.
