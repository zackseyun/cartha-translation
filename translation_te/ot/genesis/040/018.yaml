  yaml_path: translation/ot/genesis/040/018.yaml
  text: 'Joseph answered and said, “This is its interpretation: the three baskets are three days.”'
translation:
  language: te
  text: 'యోసేపు జవాబిచ్చి ఇలా అన్నాడు: “దాని వివరణ ఇదే: ఆ మూడు గంపలు మూడు రోజులు.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: జవాబిస్తూ ... అన్నాడు
  rationale: హీబ్రూ సంభాషణ సూత్రంలోని ‘జవాబిచ్చి చెప్పాడు’ అనే రెండు క్రియల భావాన్ని సహజమైన ఆధునిక తెలుగు వాక్య నిర్మాణంలో నిలుపుతుంది.
- source_word: פִּתְרֹנוֹ
  choice: దాని వివరణ
  rationale: కల సందర్భంలో ఈ పదం కలకు ఇచ్చే వివరణను సూచిస్తుంది; ‘అర్థం’ కంటే ‘వివరణ’ మూలపదానికి మరింత నేరుగా సరిపోతుంది.
- source_word: שְׁלֹשֶׁת הַסַּלִּים
  choice: ఆ మూడు గంపలు
  rationale: సַל అనే సాధారణ బుట్ట/గంప పదాన్ని సందర్భానుకూలమైన తెలుగులో ‘గంపలు’గా, నిర్దిష్టార్థక ఉపపదాన్ని ‘ఆ’గా వ్యక్తం చేసింది.
- source_word: שְׁלֹשֶׁת יָמִים הֵם
  choice: మూడు రోజులు
  rationale: మూలంలోని క్రియలేని గుర్తింపు వాక్యాన్ని తెలుగులో సహజంగా ఉంచుతూ, ‘సూచిస్తున్నాయి’ వంటి అదనపు వ్యాఖ్యానాన్ని చేర్చలేదు.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని సంక్షిప్త కల-వివరణ సూత్రం మరియు ప్రతీకాత్మక సమీకరణ నేరుగా నిలుపబడ్డాయి.
