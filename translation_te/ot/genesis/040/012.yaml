  - severity: medium
    issue: The footnote marker is placed at the end of the sentence rather than at the lexical term it annotates.
    rationale: The note concerns הַשָּׂרִגִים (‘branches’), so its anchor should immediately follow ‘తీగ కొమ్మలు’.
  revised_text: 'అప్పుడు యోసేపు అతనితో ఇలా అన్నాడు: “దీనికి అర్థం ఇదే: ఆ మూడు తీగ కొమ్మలు[a] మూడు రోజులు.”'
