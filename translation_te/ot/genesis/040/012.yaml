  terminology: ‘తీగ కొమ్మలు’ communicates the vine imagery without treating a debated lexical nuance as certain. The note retains ‘ద్రాక్షతీగ కొమ్మలు’ and ‘తీగ చిగుళ్లు’ as alternatives. No theological terminology is involved.
  issues:
