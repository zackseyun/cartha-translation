source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר ל/וֹ֙ יוֹסֵ֔ף זֶ֖ה פִּתְרֹנ֑/וֹ שְׁלֹ֨שֶׁת֙ הַ/שָּׂ֣רִגִ֔ים שְׁלֹ֥שֶׁת יָמִ֖ים הֵֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/012.yaml
  text: 'Then Joseph said to him[a], “This is its interpretation: the three branches are three days.”'
translation:
  language: te
  text: 'అప్పుడు యోసేపు అతనితో ఇలా అన్నాడు: “దీనికి అర్థం ఇదే: ఆ మూడు తీగ కొమ్మలు[a] మూడు రోజులు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పదాన్ని “ద్రాక్షతీగ కొమ్మలు” లేదా “తీగ చిగుళ్లు” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... అన్నాడు
  rationale: వావ్-కన్సిక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది; ఆధునిక తెలుగులో ‘అప్పుడు’ దాని క్రమబద్ధమైన భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: לוֹ
  choice: అతనితో
  rationale: హీబ్రూలోని పురుష ఏకవచన సర్వనామాన్ని ఉంచుతూ, పాత్ర పేరును అనవసరంగా చేర్చలేదు.
- source_word: פִּתְרֹנוֹ
  choice: దాని అర్థం
  rationale: ఇది కలలోని దృశ్యానికి ఇచ్చే వివరణను సూచిస్తుంది; సాధారణ ఆధునిక తెలుగులో ‘దాని అర్థం’ స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: שְׁלֹשֶׁת
  choice: మూడు ... మూడు
  rationale: కలలోని సంకేతానికీ దాని కాలార్థానికీ మధ్య ఉన్న సమీకరణ నిర్మాణాన్ని నిలుపుటకు పునరుక్త సంఖ్యను అలాగే ఉంచాం.
- source_word: הַשָּׂרִגִים
  choice: తీగకొమ్మలు
  rationale: ఈ అరుదైన పదం ద్రాక్షతీగ కొమ్మలు, చిగుళ్లు లేదా పాకే తీగ భాగాలను సూచించవచ్చు; ‘తీగకొమ్మలు’ ద్రాక్షతీగ సందర్భాన్ని స్పష్టంగా ఉంచి అతిగా నిర్దిష్టం చేయదు.
- source_word: יָמִים
  choice: రోజులు
  rationale: కాలాన్ని సూచించే నామవాచకానికి నేరమైన, సహజమైన తెలుగు సమానార్థకం.
- source_word: הֵם
  choice: మూడు రోజులు
  rationale: హీబ్రూ స్వతంత్ర సర్వనామం సంకేతం-అర్థం సమీకరణాన్ని బలపరుస్తుంది; తెలుగులో నామవాచక విధేయ వాక్యంలో ‘అవి/ఉన్నాయి’ అవసరం లేకుండానే ఈ భావం సహజంగా వ్యక్తమవుతుంది.
