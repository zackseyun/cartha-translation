  yaml_path: translation/ot/genesis/040/003.yaml
  text: And he put them in custody in the house of the captain of the guard[a], in the prison house[c][b], the place where Joseph was confined.
translation:
  language: te
  text: అతడు వారిని అంగరక్షకుల అధిపతి[a] ఇంట్లోని చెరసాలలో[b] నిర్బంధంలో ఉంచాడు; యోసేపు బంధించబడి ఉన్న స్థలం అదే.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘అంగరక్షకుల అధిపతి’ అనే హీబ్రూ హోదాను మరింత అక్షరార్థంగా ‘వధకుల అధిపతి’ లేదా ‘మరణశిక్ష అమలుచేసేవారి అధిపతి’ అని అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా ‘చెరసాల గృహం.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן אֹתָם בְּמִשְׁמַר
  choice: అతడు వారిని ... కాపలాలో ఉంచాడు
  rationale: נתן అనే క్రియకు అక్షరార్థంగా ‘ఇచ్చాడు’ అనే భావం ఉన్నా, ఈ నిర్బంధ సందర్భంలో ‘ఉంచాడు’ సహజం. מִשְׁמָר లోని కాపలా, నిర్బంధం అనే భావాలను ‘కాపలాలో’ నిలుపుతుంది.
- source_word: בֵּית שַׂר הַטַּבָּחִים
  choice: అంగరక్షకుల అధిపతి ఇంట్లో
  rationale: సందర్భంలో ఇది పోతీఫరు హోదాను సూచిస్తుంది. ‘అంగరక్షకుల అధిపతి’ రాజసభకు సంబంధించిన అధికార హోదాగా ఆధునిక తెలుగులో సహజంగా ఉంటుంది; మూలపదంలోని ‘వధకులు/శిక్ష అమలుచేసేవారు’ అనే సాధ్యమైన అక్షరార్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: אֶל בֵּית הַסֹּהַר
  choice: చెరసాలలో
  rationale: בֵּית הַסֹּהַר నిర్బంధ స్థలమైన చెరసాలను సూచిస్తుంది. ‘చెరసాల గృహం’ అనే అక్షరానువాదం కంటే ‘చెరసాల’ సహజమైన, గౌరవప్రదమైన ఆధునిక తెలుగు.
- source_word: אֲשֶׁר יוֹסֵף אָסוּר שָׁם
  choice: యోసేపు బంధించబడి ఉన్న
  rationale: אָסוּר కు ‘కట్టబడి ఉన్న’ లేదా ‘నిర్బంధించబడి ఉన్న’ అనే భావాలు ఉన్నాయి. ‘బంధించబడి ఉన్న’ మూలంలోని బంధ భావాన్ని నిలుపుతూ చెరసాల సందర్భానికి సరిపోతుంది; שָׁם భావం సంబంధవాచక నిర్మాణంలో సహజంగా ఇమిడింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలి వాడబడింది. ‘కాపలాలో ఉంచాడు’ అనే రూపం న్యాయపరమైన నిర్బంధ భావాన్ని అతిగా సాంకేతికంగా చేయకుండా తెలియజేస్తుంది. డాష్ తరువాతి భాగాన్ని ముందున్న స్థలానికి వివరణగా చూపుతుంది; హీబ్రూ వాక్యంలోని స్థాన సంబంధ నిర్మాణానికి మరో సాధ్యమైన పఠనాన్ని పాదసూచిక [c] సంరక్షిస్తుంది.
