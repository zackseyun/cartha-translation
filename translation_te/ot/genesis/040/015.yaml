id: GEN.40.15
reference: Genesis 40:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּֽי גֻנֹּ֣ב גֻּנַּ֔בְתִּי מֵ/אֶ֖רֶץ הָ/עִבְרִ֑ים וְ/גַם פֹּה֙ לֹא עָשִׂ֣יתִֽי מְא֔וּמָה כִּֽי שָׂמ֥וּ אֹתִ֖/י בַּ/בּֽוֹר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/015.yaml
  text: For I was indeed kidnapped from the land of the Hebrews[b][a], and even here I have done nothing that they should put me in the pit.
translation:
  language: te
  text: ఎందుకంటే నేను హెబ్రీయుల దేశం నుండి నిజంగా అపహరించబడ్డాను[a]. ఇక్కడ కూడా నన్ను ఈ గోతిలో[b] వేయడానికి తగినదేదీ నేను చేయలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “నేను తప్పకుండా దొంగిలించబడ్డాను” లేదా “దొంగిలించి తీసుకుపోబడ్డాను.” హీబ్రూలో ఒకే క్రియకు చెందిన అనంత క్రియారూపం, పరిమిత క్రియారూపంతో కలిసి వచ్చి ఉద్ఘాటనను ఇస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: “గోతి” అనే పదం ఈ సందర్భంలో చెరసాలనో, చెరసాల గదినో సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: యోసేపు తన విజ్ఞప్తికి కారణాన్ని వివరిస్తున్నందున హీబ్రూ కారణార్థక భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: גֻנֹּב גֻּנַּבְתִּי
  choice: నేను నిజంగా అపహరించబడ్డాను
  rationale: అనంత క్రియారూపం, పరిమిత క్రియారూపం కలయిక ఇచ్చే బలాన్ని ‘నిజంగా’ నిలుపుతుంది; ఒక వ్యక్తిని బలవంతంగా తీసుకుపోవడాన్ని ‘అపహరించబడ్డాను’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: מֵאֶרֶץ הָעִבְרִים
  choice: హెబ్రీయుల దేశం నుండి
  rationale: జాతి సూచనను, దేశం అనే సాధారణ భౌగోళిక భావాన్ని అతిగా నిర్దిష్టం చేయకుండా నిలుపుతుంది.
- source_word: וְגַם פֹּה
  choice: ఇక్కడ కూడా
  rationale: మొదటి అన్యాయానికి తోడు ఐగుప్తులోనూ తాను నిర్దోషిననే యోసేపు ఉద్ఘాటనను తెలియజేస్తుంది.
- source_word: לֹא עָשִׂיתִי מְאוּמָה
  choice: తగినదేదీ నేను చేయలేదు
  rationale: ‘ఏదీ చేయలేదు’ అనే సంపూర్ణ నిరాకరణను తరువాతి నిర్బంధానికి కారణం లేదా సమర్థన లేదనే భావంతో సహజంగా అనుసంధానిస్తుంది.
- source_word: כִּי שָׂמוּ אֹתִי
  choice: నన్ను … వేయడానికి
  rationale: ఇక్కడ כִּי ఫలితం/ఆధారం వైపు చూపే నిర్మాణంలో ఉంది; తెలుగులో ‘వేయడానికి తగినదేదీ’ అనేది అన్యాయ నిర్బంధ భావాన్ని సహజంగా ఇస్తుంది.
- source_word: בַּבּוֹר
  choice: ఈ గోతిలో
  rationale: బּוֹר యొక్క ప్రాథమిక ‘గొయ్యి/గోతి’ చిత్రాన్ని నిలుపుతూ, సందర్భంలోని నిర్బంధ స్థలాన్ని సూచిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. హీబ్రూ ఉద్ఘాటనను ‘నిజంగా’ ద్వారా, בּוֹר యొక్క దృశ్యరూపాన్ని ‘గోతి’ ద్వారా నిలిపాం. పాదసూచిక గుర్తులు సంబంధిత పదబంధాల వెంట ప్రధాన పాఠ్యంలో ఉంచబడ్డాయి.
