source:
  edition: WLC
  text: וַ/יִּקְרָ֧א אֱלֹהִ֛ים לָֽ/רָקִ֖יעַ שָׁמָ֑יִם וַֽ/יְהִי עֶ֥רֶב וַֽ/יְהִי בֹ֖קֶר י֥וֹם שֵׁנִֽי־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/008.yaml
  text: And God called the expanse Heaven[a]. And there was evening[b], and there was morning—the second day.
translation:
  language: te
  text: దేవుడు ఆ విస్తారానికి[b] “ఆకాశం”[a] అని పేరు పెట్టాడు. సాయంకాలం అయింది, ఉదయం అయింది—రెండవ రోజు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ שָׁמַיִם పదాన్ని సందర్భాన్ని బట్టి ‘ఆకాశం’ లేదా ‘ఆకాశములు’ అని అనువదించవచ్చు; ఇక్కడ అది దేవుడు ఆ విస్తారానికి పెట్టిన పేరు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ רָקִיעַ పదానికి ‘విస్తారం’ అని అర్థం. సంప్రదాయ అనువాదాల్లో ‘గగనమండలం’ అని, కొందరు ‘గుంబజం’ అని కూడా అనువదిస్తారు; మూలపదం విస్తరింపబడిన దానిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: పేరు పెట్టాడు
  rationale: קרא అనే క్రియ ל ఉపసర్గతో ఇక్కడ పేరు పెట్టడం లేదా ఒక పేరుతో పిలవడం అనే భావాన్ని ఇస్తుంది; ఆధునిక తెలుగులో ‘పేరు పెట్టాడు’ స్పష్టంగా, సహజంగా ఉంది.
- source_word: אֱלֹהִים
  choice: దేవుడు
  rationale: బహువచన రూపంగా కనిపించినా, ఆదికాండము 1లో ఇది ఏకవచన క్రియతో వచ్చి సృష్టికర్తయైన ఒకే దేవుణ్ణి సూచిస్తుంది.
- source_word: לָרָקִיעַ
  choice: ఆ విస్తారానికి
  rationale: רָקִיעַ విస్తరింపబడినదానిని సూచిస్తుంది. ‘విస్తారం’ మూలపదంలోని భావాన్ని కాపాడుతూ, ‘గగనమండలం’ వంటి అధిక వ్యాఖ్యానభారం గల పదాన్ని నివారిస్తుంది.
- source_word: שָׁמָיִם
  choice: ఆకాశం
  rationale: ఇక్కడ దేవుడు విస్తారానికి ఇచ్చిన పేరు ఇది. ఆధునిక తెలుగులో ‘ఆకాశం’ కనిపించే గగనాన్ని సహజంగా సూచిస్తుంది; దేవుని నివాసస్థలమనే భావాన్ని తప్పనిసరిగా రుద్దదు.
- source_word: וַיְהִי
  choice: అయింది
  rationale: పునరావృతమయ్యే సృష్టి-దిన సూత్రంలో సంఘటనల క్రమాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: עֶרֶב
  choice: సాయంకాలం
  rationale: సృష్టి దినాల పునరావృత సూత్రానికి సాధారణమైన, స్పష్టమైన తెలుగు పదం.
- source_word: בֹקֶר
  choice: ఉదయం
  rationale: సృష్టి దినాల పునరావృత సూత్రానికి సాధారణమైన, స్పష్టమైన తెలుగు పదం.
- source_word: יוֹם שֵׁנִי
  choice: ఇది రెండవ రోజు
  rationale: హీబ్రూలో నిర్దిష్ట ఉపపదం లేకున్నా, దినాల వరుసలో క్రమసంఖ్యను సూచిస్తుంది. తెలుగులో ‘ఇది రెండవ రోజు’ సహజంగా ఆ ముగింపు భావాన్ని ఇస్తుంది.
theological_decisions:
- issue: שָׁמָיִםను רָקִיעַకు దేవుడు ఇచ్చిన పేరుగా అనువదించడం
  choice: ఆకాశం
  alternative: ఆకాశములు; పరలోకం
  rationale: ఈ సందర్భంలో పదం విస్తారానికి పెట్టిన పేరుగా ఉంది. ‘ఆకాశం’ సృష్టి వర్ణనలోని ప్రత్యక్ష సందర్భానికి సరిపోతుంది; ‘పరలోకం’ దేవుని నివాసమనే తరువాతి భావాన్ని ఇక్కడ ముందుగానే రుద్దవచ్చు. హీబ్రూ రూపం ఇతర సందర్భాల్లో ‘ఆకాశములు’ అని కూడా అనువదించవచ్చు.
- issue: רָקִיעַ యొక్క రూపకల్పన లేదా స్వభావం
  choice: విస్తారం
  alternative: గగనమండలం; దృఢమైన గుమ్మటం
  rationale: మూలపదం విస్తరింపబడిన దానిని సూచిస్తుంది; దాని భౌతిక నిర్మాణాన్ని వచనం ఇక్కడ స్పష్టంగా నిర్ణయించదు. అందువల్ల ‘విస్తారం’ అనిశ్చితిని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరతను నిలుపుతూ సాధారణ పాఠకులకు సహజంగా ఉండే శైలి. ‘పేరు పెట్టాడు’ naming force‌ను స్పష్టం చేస్తుంది. ప్రధాన పాఠంలోని ప్రతి పాదటిప్పణి గుర్తుకు అనుగుణమైన పాదటిప్పణి ఇవ్వబడింది.
