  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּֽ/לְ/כָל חַיַּ֣ת הָ֠/אָרֶץ וּ/לְ/כָל ע֨וֹף הַ/שָּׁמַ֜יִם וּ/לְ/כֹ֣ל רוֹמֵ֣שׂ עַל הָ/אָ֗רֶץ אֲשֶׁר בּ/וֹ֙ נֶ֣פֶשׁ חַיָּ֔ה אֶת כָּל יֶ֥רֶק עֵ֖שֶׂב לְ/אָכְלָ֑ה וַֽ/יְהִי כֵֽן־־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/030.yaml
  text: And to every beast of the earth[a], and to every bird of the heavens, and to everything that creeps on the earth in which there is a living creature, every green plant is for food[c][b]. And it was so.
translation:
  language: te
  text: భూమిమీద ఉన్న ప్రతి జంతువుకూ, ఆకాశంలో ఎగిరే ప్రతి ప్రాణికీ, భూమిమీద పాకే ప్రతి దానిలో సజీవ ప్రాణి ఉన్న ప్రతిదానికీ[a] ఆహారంగా పచ్చని మొక్కలన్నీ ఉన్నాయి. అలాగే జరిగింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూలభాషలో అక్షరార్థంగా, “దానిలో సజీవ ప్రాణి ఉంది” లేదా “దానిలో సజీవ ఆత్మ ఉంది.” ఇది “జీవశ్వాస” అని అర్థమిచ్చే వేరే హెబ్రీ పదబంధం కాదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַיַּת הָאָרֶץ
  choice: భూమిమీద ఉన్న ప్రతి జంతువు
  rationale: ఈ పదబంధం భూజంతువులను సూచిస్తుంది. ‘జంతువు’ ఆధునిక తెలుగులో సహజంగా ఉండి, ‘అడవి జంతువు’ అని మూలంలో లేని పరిమితిని విధించదు.
- source_word: עוֹף הַשָּׁמַיִם
  choice: ఆకాశంలో ఎగిరే ప్రతి ప్రాణి
  rationale: עוֹף పక్షులకే పరిమితం కాకుండా ఎగిరే ప్రాణులను విస్తృతంగా సూచించగలదు; ఈ రూపం ఆ విస్తృతిని నిలుపుతూ సహజమైన తెలుగును ఇస్తుంది.
- source_word: כֹל רוֹמֵשׂ עַל הָאָרֶץ
  choice: భూమిమీద పాకే ప్రతిదీ
  rationale: רוֹמֵשׂ లోని పాకడం లేదా నేలపై కదలడం అనే సజీవ చిత్రాన్ని నిలుపుతుంది.
- source_word: אֲשֶׁר בּוֹ נֶפֶשׁ חַיָּה
  choice: అంటే జీవప్రాణం ఉన్న ప్రతిదీ
  rationale: נֶפֶשׁ חַיָּה ను వేరైన נִשְׁמַת חַיִּים (‘జీవశ్వాస’)తో కలపకుండా, జీవమున్న ప్రాణి/జీవప్రాణం అనే భావాన్ని వ్యక్తం చేస్తుంది. సంబంధవాచక వాక్యం సమీపంలోని పాకే వాటికేనా లేక ముందున్న జంతు వర్గాలన్నిటికీనా వర్తిస్తుందనే నిర్మాణాత్మక అస్పష్టతను డాష్‌తో కొంతవరకు నిలుపుతుంది.
- source_word: אֶת כָּל יֶרֶק עֵשֶׂב
  choice: పచ్చని మొక్కలన్నిటిని
  rationale: יֶרֶק עֵשֶׂב పచ్చని వృక్షాహారాన్ని సూచిస్తుంది; ‘మొక్కలు’ సాధారణ ఆధునిక పాఠకునికి స్పష్టంగా ఉంటుంది.
- source_word: לְאָכְלָה
  choice: ఆహారంగా
  rationale: లామెడ్ ఉద్దేశం లేదా వినియోగాన్ని సూచిస్తుంది; ‘ఆహారంగా’ సంక్షిప్తమైన సహజ తెలుగు.
- source_word: וַיְהִי כֵן
  choice: అలాగే జరిగింది
  rationale: సృష్టి వృత్తాంతంలోని నెరవేర్పు సూత్రాన్ని సహజమైన, గంభీరమైన తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: జంతువుల సందర్భంలో נֶפֶשׁ חַיָּה అనువాదం
  choice: జీవప్రాణం ఉన్న ప్రతిదీ
  alternative: సజీవ ప్రాణి ఉన్న ప్రతిదీ / సజీవమైన ప్రతి ప్రాణి
  rationale: ఇది ‘జీవశ్వాస’ అనే వేరే హెబ్రీ పదబంధం కాదు. అందువల్ల జీవత్వాన్ని సూచిస్తూ, మానవ ఆత్మ లేదా జంతువుల వ్యక్తిత్వంపై మూలం కంటే అధికమైన సిద్ధాంత నిర్ణయాన్ని మోపకుండా అనువదించబడింది.
- issue: ప్రధాన క్రియ 30వ వచనంలో లుప్తంగా ఉండటం
  choice: ఇచ్చాను అని 29వ వచనం నుంచి పూరించబడింది
  alternative: పచ్చని మొక్కలన్నీ ఆహారంగా ఉన్నాయి
  rationale: హెబ్రీలో 30వ వచనం 29వ వచనంలోని נָתַתִּי (‘నేను ఇచ్చాను’) అనే క్రియను భావానువర్తనంగా కొనసాగిస్తుంది. తెలుగులో సంపూర్ణమైన, సహజమైన వాక్యానికి దానిని పూరించడం అవసరం; దీనిని పాదటిప్పణిలో పారదర్శకంగా తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే సృష్టి వృత్తాంతానికి తగిన గంభీరతతో రూపొందించబడింది. ‘ఆకాశంలోని ప్రతి పక్షి’ కంటే మూలంలోని עוֹף విస్తృతిని నిలుపడానికి ‘ఆకాశంలో ఎగిరే ప్రతి ప్రాణి’ ఎంచుకోబడింది.
