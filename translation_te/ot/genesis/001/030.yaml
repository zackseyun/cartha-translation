  to: భూమిమీద ఉన్న ప్రతి జంతువుకూ, ఆకాశంలో ఎగిరే ప్రతి ప్రాణికీ, భూమిమీద పాకే ప్రతి దానిలో సజీవ ప్రాణి ఉన్న ప్రతిదానికీ[a] ఆహారంగా పచ్చని మొక్కలన్నీ ఉన్నాయి. అలాగే జరిగింది.
