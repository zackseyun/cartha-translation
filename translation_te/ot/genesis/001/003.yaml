  to: దేవుడు, “వెలుగు కలుగుగాక[a]” అని అన్నాడు; మరియు వెలుగు కలిగింది.
  rationale: The revision removes the added temporal connector ‘అప్పుడు’ and uses a coordinating connector corresponding more closely to the Hebrew waw. The divine command, its elevated register, the repeated noun, and the existing lexical-alternative footnote are retained.
