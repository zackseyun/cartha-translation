id: GEN.1.3
reference: Genesis 1:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר אֱלֹהִ֖ים יְהִ֣י א֑וֹר וַֽ/יְהִי אֽוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/003.yaml
  text: And God said[a], “Let there be light,” and there was light.
translation:
  language: te
  text: దేవుడు, “వెలుగు కలుగుగాక[a]” అని అన్నాడు; మరియు వెలుగు కలిగింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వెలుగు కలగాలి.” హీబ్రూలో సంకల్పాన్ని లేదా ఆజ్ఞను వ్యక్తం చేసే జస్సివ్ రూపం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అని అన్నాడు
  rationale: వయ్యిక్తోల్ రూపం కథనాన్ని ముందుకు నడిపిస్తుంది. తెలుగు ప్రత్యక్ష వాక్య నిర్మాణంలో ఉద్ధరణ తర్వాత ‘అని అన్నాడు’ సహజంగా ఉండి, హీబ్రూ కథన క్రమాన్ని తెలియజేస్తుంది.
- source_word: אֱלֹהִים
  choice: దేవుడు
  rationale: బహువచన ఆకృతి ఉన్నప్పటికీ ఇక్కడ ఏకవచన క్రియతో వచ్చి ఏకైక సృష్టికర్తను సూచిస్తుంది; అందువల్ల ప్రామాణిక తెలుగు రూపం ‘దేవుడు’.
- source_word: יְהִי
  choice: కలుగుగాక
  rationale: היה ధాతువు యొక్క జస్సివ్ రూపం సంకల్పం లేదా ఆజ్ఞను వ్యక్తం చేస్తుంది. ‘కలుగుగాక’ ఆ సృష్టి ఆజ్ఞ యొక్క గంభీరతను, అర్థాన్ని సహజమైన తెలుగు బైబిలు శైలిలో నిలుపుతుంది.
- source_word: אוֹר
  choice: వెలుగు
  rationale: మూలపదపు సాధారణ అర్థం ‘వెలుగు’; ఇక్కడ దానిని నిర్దిష్ట కాంతిమూలానికి లేదా రూపకార్థానికి పరిమితం చేయడానికి సందర్భ ఆధారం లేదు.
- source_word: וַיְהִי
  choice: అప్పుడు ... కలిగింది
  rationale: היה ధాతువు యొక్క వయ్యిక్తోల్ రూపం దేవుని మాటకు వెంటనే వచ్చిన ఫలితాన్ని నివేదిస్తుంది. ‘అప్పుడు ... కలిగింది’ కథన పురోగతిని, ఫలితాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אוֹר
  choice: వెలుగు
  rationale: ఆజ్ఞ నెరవేరినదని నొక్కిచెప్పే హీబ్రూ పునరుక్తిని నిలుపడానికి రెండోసారి కూడా ‘వెలుగు’ అని అనువదించబడింది.
theological_decisions:
- issue: దైవ సృష్టి ఆజ్ఞను అనువదించడం
  choice: వెలుగు కలుగుగాక
  alternative: వెలుగు కలగాలి
  rationale: హీబ్రూ జస్సివ్ దైవ సంకల్పాన్ని లేదా ప్రభావవంతమైన ఆజ్ఞను వ్యక్తం చేస్తుంది. ‘కలుగుగాక’ దాని గంభీరమైన ఆజ్ఞార్థాన్ని నిలుపుతుంది; ‘కలగాలి’ కూడా సాధ్యమే కానీ సందర్భంలో సాధారణ ఆశ లేదా అవసర భావంలా వినిపించవచ్చు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యేలా గంభీరమైన కథన శైలి వాడబడింది. ‘కలుగుగాక’ ప్రస్తుత సాధారణ సంభాషణలో అరుదైనా, ఈ సృష్టి ఆజ్ఞకు సంక్షిప్తమైన, సుపరిచితమైన, గౌరవప్రదమైన రూపం.
