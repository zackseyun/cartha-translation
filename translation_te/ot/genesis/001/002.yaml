  to: భూమి ఆకారం లేక ఖాళీగా ఉండింది. అగాధ జలాల ఉపరితలంపై చీకటి ఉండింది; దేవుని ఆత్మ[a] జలాల ఉపరితలంపై తేలియాడుతూ ఉండింది.
