id: GEN.1.2
reference: Genesis 1:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הָ/אָ֗רֶץ הָיְתָ֥ה תֹ֨הוּ֙ וָ/בֹ֔הוּ וְ/חֹ֖שֶׁךְ עַל פְּנֵ֣י תְה֑וֹם וְ/ר֣וּחַ אֱלֹהִ֔ים מְרַחֶ֖פֶת עַל פְּנֵ֥י הַ/מָּֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/002.yaml
  text: And the earth was formless and empty[a], and darkness was over the surface of the deep, and the Spirit of God was hovering over the surface of the waters.
translation:
  language: te
  text: భూమి ఆకారం లేక ఖాళీగా ఉండింది. అగాధ జలాల ఉపరితలంపై చీకటి ఉండింది; దేవుని ఆత్మ[a] జలాల ఉపరితలంపై తేలియాడుతూ ఉండింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “దేవుని నుంచి వచ్చిన గాలి,” లేదా “దేవుని గాలి.”
    reason: רוּחַ אֱלֹהִים అనే హెబ్రీ పదబంధం ‘దేవుని ఆత్మ’ లేదా దేవునితో సంబంధమున్న గాలి అనే రెండు భావాలకు వీలు కల్పిస్తుంది.
lexical_decisions:
- source_word: וְהָאָרֶץ
  choice: భూమి
  rationale: הָאָרֶץ అంటే ‘భూమి/నేల.’ ముందున్న వాక్యంతో సంబంధాన్ని וְ చూపుతుంది; అయితే తెలుగులో వాక్యారంభంలో ‘మరియు’ చేర్చడం అసహజంగా ఉంటుంది కాబట్టి, వాక్యక్రమం ద్వారానే కొనసాగింపును తెలిపాం.
- source_word: הָיְתָה
  choice: ఉండింది
  rationale: ఇక్కడ היה క్రియ భూమి అప్పటి స్థితిని తెలియజేస్తుంది. ‘అయిపోయింది’ అనే స్థితిమార్పు భావాన్ని హెబ్రీ తప్పనిసరి చేయదు.
- source_word: תֹהוּ וָבֹהוּ
  choice: ఆకారం లేక ఖాళీగా
  rationale: ఈ జంటపదాలు ఇంకా రూపుదిద్దుకోని, నిండని స్థితిని సూచిస్తాయి. ఆధునిక పాఠకులకు స్పష్టంగా ఉండేలా ‘ఆకారం లేక ఖాళీగా’ అని అనువదించాం.
- source_word: וְחֹשֶׁךְ
  choice: చీకటి
  rationale: మూలంలోని సాధారణ నామపదార్థాన్ని నేరుగా నిలిపాం.
- source_word: עַל־פְּנֵי
  choice: ఉపరితలంపై
  rationale: అక్షరార్థంగా ‘ముఖం మీద’ అనే స్థలసూచక నుడికారాన్ని సహజమైన ఆధునిక తెలుగులో ‘ఉపరితలంపై’ అని ఇచ్చాం.
- source_word: תְהוֹם
  choice: అగాధ జలాలు
  rationale: תְהוֹם లోతైన ఆదిమ జలరాశిని సూచిస్తుంది. కేవలం ‘అగాధం’ కంటే ‘అగాధ జలాలు’ సందర్భార్థాన్ని స్పష్టం చేస్తుంది; పురాణసంబంధ భావాలను అదనంగా చేర్చదు.
- source_word: וְרוּחַ אֱלֹהִים
  choice: దేవుని ఆత్మ
  rationale: רוּחַ అంటే ‘ఆత్మ,’ ‘గాలి,’ లేదా ‘శ్వాస’ కావచ్చు. ప్రధాన పాఠంలో బలమైన సంప్రదాయ పఠనమైన ‘దేవుని ఆత్మ’ను ఉంచి, గాలి అనే సాధ్యమైన పఠనాన్ని పాదసూచికలో నిలిపాం.
- source_word: מְרַחֶפֶת
  choice: కదులుతూ ఉండింది
  rationale: ఈ కృదంతం కొనసాగుతున్న, ఉపరితలంపై తేలికగా కదిలే చర్యను సూచిస్తుంది. ‘కదులుతూ ఉండింది’ అనేది ఆత్మ లేదా గాలి అనే రెండు పఠనాలకూ సరిపోయి, మూలంలోని సందిగ్ధతను ముందే పరిష్కరించదు.
- source_word: הַמָּיִם
  choice: జలాలు
  rationale: హెబ్రీ బహువచన రూపాన్ని, సృష్టివివరణలోని విస్తార జలరాశి చిత్రాన్ని నిలిపేందుకు ‘జలాలు’ అని ఇచ్చాం.
theological_decisions:
- issue: הָיְתָה స్థితిని సూచిస్తుందా, స్థితిమార్పును సూచిస్తుందా?
  choice: ఉండింది
  alternative: అయిపోయింది
  rationale: ఈ వాక్యం భూమి అప్పటి స్థితిని వర్ణిస్తుంది. భూమి ముందుగా వేరే స్థితిలో ఉండి తరువాత ఇలా అయిందనే సిద్ధాంతాన్ని హెబ్రీ పాఠం తప్పనిసరిగా చెప్పదు.
- issue: וְרוּחַ אֱלֹהִים దేవుని ఆత్మను సూచిస్తుందా, దేవుని నుంచి వచ్చిన గాలిని సూచిస్తుందా?
  choice: దేవుని ఆత్మ
  alternative: దేవుని నుంచి వచ్చిన గాలి; దేవుని గాలి
  rationale: హెబ్రీ పదబంధం రెండు అర్థాలకూ వీలు కల్పిస్తుంది. ప్రధాన పాఠంలో ‘దేవుని ఆత్మ’ను ఉంచినా, నిజమైన భాషాపరమైన సందిగ్ధతను పాదసూచికలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యే, గౌరవప్రదమైన శైలిని వాడాం. పాతకాలపు ‘నిరాకారముగాను శూన్యముగాను,’ ‘అల్లాడుచుండెను’ వంటి రూపాలను నివారించాం. ‘అగాధ జలాలు,’ ‘జలాలు’ అనే పదాలు సృష్టివివరణకు తగిన గంభీరతను నిలుపుతాయి.
