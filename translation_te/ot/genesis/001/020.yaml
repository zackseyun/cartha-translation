id: GEN.1.20
reference: Genesis 1:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֱלֹהִ֔ים יִשְׁרְצ֣וּ הַ/מַּ֔יִם שֶׁ֖רֶץ נֶ֣פֶשׁ חַיָּ֑ה וְ/עוֹף֙ יְעוֹפֵ֣ף עַל הָ/אָ֔רֶץ עַל פְּנֵ֖י רְקִ֥יעַ הַ/שָּׁמָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/020.yaml
  text: And God said[a], “Let the waters swarm with swarms of living creatures[c][b], and let birds fly above the earth across the face of the expanse of the heavens.”
translation:
  language: te
  text: 'దేవుడు ఇలా అన్నాడు: “జలాలు జీవుల గుంపులతో కిటకిటలాడాలి[a]; పక్షులు[b] భూమికి పైన, ఆకాశ విస్తారం[c] మీదుగా ఎగరాలి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరొక విధంగా: “జలాలు జీవులతో సమృద్ధిగా నిండిపోవాలి.” హీబ్రూలో ఒకే మూలానికి చెందిన క్రియా, నామవాచకం వాడబడి, జీవసమృద్ధి నొక్కిచెప్పబడింది.'
    reason: lexical_alternative
  - marker: b
    text: “పక్షులు” అని అనువదించిన హీబ్రూ పదం ఎగిరే జీవులను మరింత విస్తృతంగా సూచించగలదు.
    reason: lexical_alternative
  - marker: c
    text: “విస్తారం” అనే పదాన్ని “గగనమండలం” లేదా “ఆకాశపు గుమ్మటం” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: ఇలా అన్నాడు
  rationale: హీబ్రూ కథన క్రమాన్ని సహజమైన ఆధునిక తెలుగులో కొనసాగిస్తుంది; వావ్-కన్సెక్యూటివ్‌కు అదనపు కారణార్థాన్ని ఆపాదించదు.
- source_word: אֱלֹהִים
  choice: దేవుడు
  rationale: ఏకవచన క్రియతో ఉన్న ఈ సందర్భంలో సృష్టికర్తయైన ఒకే దేవుణ్ణి సూచించే సహజ తెలుగు రూపం.
- source_word: יִשְׁרְצוּ ... שֶׁרֶץ
  choice: గుంపులతో కిటకిటలాడాలి
  rationale: ఒకే మూలానికి చెందిన హీబ్రూ క్రియా-నామాల జోడీ తెలిపే విస్తారమైన, కదులుతున్న జీవసమృద్ధిని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: הַמַּיִם
  choice: జలాలు
  rationale: ఆదికాండం 1లోని బహువచన రూపాన్ని, గంభీరమైన శైలిని నిలుపుతుంది.
- source_word: נֶפֶשׁ חַיָּה
  choice: జీవులు
  rationale: ఇక్కడ సజీవ ప్రాణులను సూచిస్తుంది; ‘ఆత్మలు’ అని అనువదించి తరువాతి కాలపు మానవశాస్త్రీయ లేదా సిద్ధాంతపరమైన భావాన్ని రుద్దదు.
- source_word: וְעוֹף
  choice: పక్షులు
  rationale: సందర్భంలో సహజంగా అర్థమయ్యే తెలుగు పదం; హీబ్రూ పదానికి ఉండగల విస్తృత అర్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: יְעוֹפֵף
  choice: ఎగరాలి
  rationale: జస్సివ్ భావాన్ని తెలుగులో ఆజ్ఞార్థక-ఆశార్థక రూపంతో స్పష్టంగా తెలియజేస్తుంది.
- source_word: עַל הָאָרֶץ
  choice: భూమికి పైన
  rationale: ఎగిరే క్రియతో కలిసి భూమిమీద కాక, దానికి పైభాగంలో జరిగే కదలికను సూచిస్తుంది.
- source_word: עַל פְּנֵי
  choice: ఎదుట
  rationale: విస్తారం కనిపించే ముఖభాగానికి ఎదురుగా ఎగరడం అనే స్థలసంబంధ చిత్రాన్ని సంక్షిప్తంగా, సహజంగా నిలుపుతుంది.
- source_word: רְקִיעַ הַשָּׁמָיִם
  choice: ఆకాశ విస్తారం
  rationale: విస్తరించి ఉన్న ప్రాంతం అనే చిత్రాన్ని కాపాడుతూ, నిర్దిష్టమైన ప్రాచీన విశ్వనిర్మాణ నమూనాను అనవసరంగా నిర్ణయించదు.
theological_decisions:
- issue: సృష్టి సందర్భంలో נֶפֶשׁ חַיָּה అనువాదం
  choice: జీవులు
  alternative: సజీవ ప్రాణులు; జీవాత్మలు
  rationale: ఈ పదబంధం ఇక్కడ ప్రాణమున్న జీవులను సూచిస్తుంది. ‘జీవులు’ అనే రూపం ‘ఆత్మ’ గురించిన తరువాతి సిద్ధాంతపరమైన అర్థాన్ని పాఠ్యంలోకి చేర్చకుండా మూలభావాన్ని అందిస్తుంది.
- issue: רְקִיעַ అనువాదం
  choice: విస్తారం
  alternative: గగనమండలం; ఆకాశపు పందిరి
  rationale: మూలపదం విశ్వనిర్మాణపరంగా చర్చనీయమైనది. ‘విస్తారం’ దాని స్థలసంబంధ చిత్రాన్ని నిలుపుతూ, పాఠ్యం తేల్చని నిర్మాణ నమూనాను అనువాదం ద్వారా తేల్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గంభీరంగా ఉండే శైలి వాడబడింది. ‘కిటకిటలాడాలి’ జీవుల విస్తార సమృద్ధి మరియు కదలిక రెండింటినీ సామాన్య పాఠకునికి స్పష్టంగా తెలియజేస్తుంది. ప్రతి పాదసూచిక గుర్తు సంబంధిత పదబంధం వెంట ప్రధాన పాఠ్యంలో ఉంచబడింది.
