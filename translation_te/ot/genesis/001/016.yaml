id: GEN.1.16
reference: Genesis 1:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּ֣עַשׂ אֱלֹהִ֔ים אֶת שְׁנֵ֥י הַ/מְּאֹרֹ֖ת הַ/גְּדֹלִ֑ים אֶת הַ/מָּא֤וֹר הַ/גָּדֹל֙ לְ/מֶמְשֶׁ֣לֶת הַ/יּ֔וֹם וְ/אֶת הַ/מָּא֤וֹר הַ/קָּטֹן֙ לְ/מֶמְשֶׁ֣לֶת הַ/לַּ֔יְלָה וְ/אֵ֖ת הַ/כּוֹכָבִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/016.yaml
  text: 'And God made the two great lights: the greater light to rule the day[a], and the lesser light to rule the night, and the stars.'
translation:
  language: te
  text: 'దేవుడు రెండు పెద్ద జ్యోతులను చేశాడు: పగటిని ఏలటానికి పెద్ద జ్యోతిని, రాత్రిని ఏలటానికి చిన్న జ్యోతిని, మరియు నక్షత్రాలను.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, మరింత స్పష్టంగా: “నక్షత్రాలను కూడా చేశాడు.”'
    reason: హీబ్రూలోని וְאֵת చివర అదనపు ప్రత్యక్ష కర్మను చేర్చుతుంది. ‘మరియు నక్షత్రాలను’ మూలంలోని సంక్షిప్తతను నిలుపుతుంది; ‘నక్షత్రాలను కూడా చేశాడు’ దాని సాధ్యమైన స్పష్టీకరణ.
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: చేశాడు
  rationale: עשה అనే క్రియకు సాధారణ అర్థం ‘చేయడం/తయారుచేయడం.’ సందర్భం ఆధారంగా ‘నియమించాడు’ అని విస్తరించకుండా మూలంలోని సాధారణ క్రియను నిలుపుతుంది.
- source_word: אֱלֹהִים
  choice: దేవుడు
  rationale: ఆదికాండము 1లో ఈ పదానికి ఏకవచన క్రియ ఉండడం వల్ల ఏకైక దేవుణ్ణి సూచిస్తుంది; ఆధునిక ప్రామాణిక తెలుగులో ‘దేవుడు’ సహజమైన అనువాదం.
- source_word: שְׁנֵי הַמְּאֹרֹת הַגְּדֹלִים
  choice: రెండు గొప్ప జ్యోతులు
  rationale: מָאוֹר వెలుగునిచ్చే ఖగోళ వస్తువును సూచిస్తుంది. ‘జ్యోతులు’ మూలంలోని ‘వెలుగులు/దీప్తిమంతమైన వస్తువులు’ అనే భావాన్ని నిలుపుతూ గౌరవప్రదమైన తెలుగులో సహజంగా ఉంటుంది.
- source_word: הַמָּאוֹר הַגָּדֹל
  choice: పెద్ద జ్యోతి
  rationale: జతగా ఉన్న גדול/קטן వ్యత్యాసాన్ని తెలుగులో సహజంగా ‘పెద్ద/చిన్న’ అని వ్యక్తం చేస్తుంది; ‘సూర్యుడు’ అనే మూలంలో లేని పేరును చేర్చదు.
- source_word: לְמֶמְשֶׁלֶת הַיּוֹם
  choice: పగటిని ఏలడానికి
  rationale: מֶמְשֶׁלֶת పాలన లేదా ఆధిపత్యాన్ని సూచిస్తుంది. ‘ఏలడానికి’ ఉద్దేశం/కార్యాన్ని సంక్షిప్తంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: הַמָּאוֹר הַקָּטֹן
  choice: చిన్న జ్యోతి
  rationale: קטן యొక్క ప్రాథమిక భావాన్ని మరియు పెద్ద జ్యోతితో ఉన్న సమాంతర వ్యత్యాసాన్ని నేరుగా నిలుపుతుంది.
- source_word: לְמֶמְשֶׁלֶת הַלַּיְלָה
  choice: రాత్రిని ఏలడానికి
  rationale: పగటికి సంబంధించిన ముందరి సమాంతర నిర్మాణంతో ఏకరీతిని కాపాడుతూ పాలనా భావాన్ని తెలియజేస్తుంది.
- source_word: וְאֵת הַכּוֹכָבִים
  choice: నక్షత్రాలను చేశాడు
  rationale: సంయోజకంతో కూడిన ప్రత్యక్ష కర్మను ముందున్న ‘చేశాడు’ క్రియతో కలిపి తెలుగులో పూర్తి వాక్యంగా వ్యక్తం చేస్తుంది. ‘కూడా’ అనే భావం సాధ్యమైనందున దాన్ని పాదటిప్పణిలో చూపించాం.
theological_decisions:
- issue: సూర్యచంద్రులకు పేర్లు పెట్టకుండా ఖగోళ జ్యోతులుగా పేర్కొనడం
  choice: ‘పెద్ద జ్యోతి,’ ‘చిన్న జ్యోతి’ అని నిలుపడం
  alternative: ‘సూర్యుడు,’ ‘చంద్రుడు’
  rationale: హీబ్రూ మూలం సాధారణ సూర్యచంద్ర పేర్లకు బదులుగా מָאוֹר (‘జ్యోతి/వెలుగునిచ్చేది’) అనే పదాన్ని ఉద్దేశపూర్వకంగా వాడుతుంది. మూలంలో లేని పేర్లను చేర్చకుండా దాని పదప్రయోగాన్ని నిలుపడం సముచితం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యే, గౌరవప్రదమైన శైలి. ‘జ్యోతి’ అనే పదం ‘వెలుగు’కన్నా ఇక్కడ వెలుగునిచ్చే ఖగోళ వస్తువు అనే భావాన్ని స్పష్టంగా ఇస్తుంది. మూలంలోని సమాంతర నిర్మాణం మరియు చివర నక్షత్రాల సంక్షిప్త చేర్పు సాధ్యమైనంతవరకు నిలుపబడ్డాయి.
