id: GEN.1.27
reference: Genesis 1:27
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּבְרָ֨א אֱלֹהִ֤ים אֶת הָֽ/אָדָם֙ בְּ/צַלְמ֔/וֹ בְּ/צֶ֥לֶם אֱלֹהִ֖ים בָּרָ֣א אֹת֑/וֹ זָכָ֥ר וּ/נְקֵבָ֖ה בָּרָ֥א אֹתָֽ/ם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/027.yaml
  text: So God created man in his image[a]; in the image of God he created him; male and female he created them.
translation:
  language: te
  text: దేవుడు మానవుణ్ణి తన స్వరూపంలో[a] సృష్టించాడు; దేవుని స్వరూపంలో అతణ్ణి సృష్టించాడు; మగవారిగానూ ఆడవారిగానూ వారిని సృష్టించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా ‘మానవజాతిని’: ఇక్కడి హీబ్రూ పదం ఆదామ్ ఏకవచనంలో ఉండి, సమస్త మానవత్వానికి ప్రాతినిధ్యం వహిస్తుంది.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּבְרָא / בָּרָא
  choice: సృష్టించాడు
  rationale: దేవుని సృష్టికార్యాన్ని సూచించే ప్రామాణిక పదం; మూలంలోని మూడుసార్ల పునరుక్తిని నిలుపుతుంది.
- source_word: אֱלֹהִים
  choice: దేవుడు
  rationale: రూపపరంగా బహువచనమైనా ఇక్కడ ఏకవచన క్రియతో ఇశ్రాయేలు దేవుణ్ణి సూచిస్తుంది.
- source_word: הָאָדָם
  choice: మానవుణ్ణి
  rationale: ఇక్కడ ఏకవచనం సమస్త మానవజాతికి ప్రాతినిధ్యం వహిస్తుంది; తరువాతి ‘మగవారిగా, ఆడవారిగా వారిని’ అనే బహువచనం దీనిని స్పష్టం చేస్తుంది.
- source_word: בְּצַלְמוֹ
  choice: తన స్వరూపంలో
  rationale: సర్వనామ ప్రత్యయం దేవుణ్ణి సూచిస్తుంది; ‘స్వరూపం’ צֶלֶם యొక్క భావాన్ని సహజమైన తెలుగు బైబిలు శైలిలో తెలియజేస్తుంది.
- source_word: בְּצֶלֶם אֱלֹהִים
  choice: దేవుని స్వరూపంలో
  rationale: ముందటి పదబంధాన్ని వివరిస్తూ బలపరిచే మూలంలోని సమాంతర పునరుక్తిని నిలుపుతుంది.
- source_word: אֹתוֹ
  choice: అతణ్ణి
  rationale: ప్రాతినిధ్య మానవత్వాన్ని సూచించే పుంలింగ ఏకవచన సర్వనామాన్ని, తరువాతి బహువచన మార్పుతో సహా, నిలుపుతుంది.
- source_word: זָכָר וּנְקֵבָה
  choice: మగవారిగా, ఆడవారిగా
  rationale: ఇవి אישׁ/אשׁה వంటి సంబంధపరమైన ‘పురుషుడు/స్త్రీ’ పదాలు కాక, లింగాన్ని సూచించే పదాలు; తెలుగు వాక్యంలో వ్యక్తులను సూచించే సహజ రూపం ఎంచుకోబడింది.
- source_word: אֹתָם
  choice: వారిని
  rationale: ప్రాతినిధ్య ఏకవచనం నుంచి మానవుల బహుత్వానికి జరిగే ఉద్దేశపూర్వక మార్పును నిలుపుతుంది.
theological_decisions:
- issue: ప్రాతినిధ్య మానవత్వ సందర్భంలో אָדָם అనువాదం
  choice: మానవుణ్ణి
  alternative: మానవజాతిని; ఆదామును
  rationale: నిర్దిష్ట ఉపపదంతో ఉన్న ఏకవచన הָאָדָם, ఏకవచన సర్వనామం, తరువాత ‘మగవారిగా, ఆడవారిగా వారిని’ అనే బహువచనానికి మారడం—ఇవన్నీ ఒకే పురుష వ్యక్తిని మాత్రమే కాక సమస్త మానవత్వాన్ని ప్రాతినిధ్య ఏకవచనంలో సూచిస్తున్నాయి. ‘మానవుణ్ణి’ తెలుగు భాషలో ఆ ఏకవచన రూపాన్నీ సమగ్ర భావాన్నీ కలిపి నిలుపుతుంది.
- issue: בְּ ఉపసర్గంతో צֶלֶם యొక్క భావం
  choice: స్వరూపంలో
  alternative: స్వరూపంగా
  rationale: ఉపసర్గంలోని ‘లో/అనుగుణంగా’ భావాన్ని నిర్ణయాత్మకంగా పరిష్కరించకుండా సంప్రదాయబద్ధమైన, సహజమైన ‘స్వరూపంలో’ ద్వారా మూలంలోని భావవిస్తృతిని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. మూలంలోని ‘సృష్టించాడు’ అనే మూడుసార్ల పునరుక్తినీ, ఏకవచనం నుంచి బహువచనానికి జరిగే మార్పునీ ఉద్దేశపూర్వకంగా నిలిపాం. [a] సూచిక ప్రధాన పాఠ్యంలో చేర్చబడింది.
