id: GEN.1.12
reference: Genesis 1:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/תּוֹצֵ֨א הָ/אָ֜רֶץ דֶּ֠שֶׁא עֵ֣שֶׂב מַזְרִ֤יעַ זֶ֨רַע֙ לְ/מִינֵ֔/הוּ וְ/עֵ֧ץ עֹֽשֶׂה פְּרִ֛י אֲשֶׁ֥ר זַרְע/וֹ ב֖/וֹ לְ/מִינֵ֑/הוּ וַ/יַּ֥רְא אֱלֹהִ֖ים כִּי טֽוֹב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/012.yaml
  text: And the earth brought forth vegetation[a], plants yielding seed according to their kinds, and trees bearing fruit in which is their seed, according to their kinds[b]. And God saw that it was good.
translation:
  language: te
  text: భూమి పచ్చని వృక్షసంపదను, వాటి రకాల ప్రకారం విత్తనాలు ఇచ్చే మొక్కలను, వాటి ఫలాల్లో విత్తనాలు ఉండే ఫలవృక్షాలను వాటి రకాల ప్రకారం[a] మొలిపించింది. అది మంచిదని దేవుడు చూశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘రకాలు’ అని అనువదించిన హీబ్రూ పదం సృష్టిలోని వర్గాలను సూచిస్తుంది; ఇది ఆధునిక జీవశాస్త్రంలోని సాంకేతిక ‘జాతి’ అనే పదానికి సరిగ్గా సమానం కాదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתּוֹצֵא
  choice: మొలిపించింది
  rationale: హిఫీల్ రూపం భూమి వృక్షజీవాన్ని బయటికి రప్పించడం లేదా ఉత్పత్తి చేయడం సూచిస్తుంది. మొక్కల సందర్భంలో ‘మొలిపించింది’ సహజంగా ఉండి ఆ ఉత్పాదక భావాన్ని నిలుపుతుంది.
- source_word: הָאָרֶץ
  choice: భూమి
  rationale: ఆదికాండం 1లోని విశ్వసృష్టి సందర్భానికి ‘నేల’ కంటే ‘భూమి’ అనువైనది.
- source_word: דֶּשֶׁא
  choice: పచ్చని వృక్షసంపద
  rationale: ఈ పదం కేవలం గడ్డిని కాక, తాజాగా మొలిచే పచ్చని మొక్కలన్నిటినీ సమష్టిగా సూచిస్తుంది.
- source_word: עֵשֶׂב מַזְרִיעַ זֶרַע
  choice: విత్తనాలు ఇచ్చే మొక్కలు
  rationale: విత్తనాన్ని ఉత్పత్తి చేసే మొక్కల నిరంతర సామర్థ్యాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: לְמִינֵהוּ
  choice: వాటి వాటి రకాల ప్రకారం
  rationale: מין అనే పదం సృష్టిలోని వర్గాలు లేదా రకాలను సూచిస్తుంది; ఆధునిక జీవశాస్త్రంలోని సాంకేతిక ‘జాతి’ భావాన్ని అనవసరంగా మోపదు.
- source_word: וְעֵץ עֹשֶׂה פְּרִי אֲשֶׁר זַרְעוֹ בוֹ
  choice: లోపల విత్తనం ఉండే ఫలాలు కాసే చెట్లు
  rationale: ఫలాన్ని కాసే చెట్లను, ఆ ఫలంలో విత్తనం ఉండే లక్షణంతో సహజమైన తెలుగులో వర్ణిస్తుంది; మూలంలోని ఏకవచన సమష్టి భావాన్ని తెలుగులో బహువచనంగా వ్యక్తం చేస్తుంది.
- source_word: וַיַּרְא אֱלֹהִים כִּי טוֹב
  choice: అది మంచిదని దేవుడు చూశాడు
  rationale: సృష్టి వృత్తాంతంలో పునరావృతమయ్యే దైవీయ మూల్యాంకనాన్ని సరళంగా, గౌరవప్రదంగా నిలుపుతుంది.
theological_decisions:
- issue: సృష్టిలోని వర్గాలను ఆధునిక జీవశాస్త్ర వర్గీకరణగా చూపకుండా అనువదించడం
  choice: వాటి వాటి రకాల ప్రకారం
  alternative: వాటి వాటి జాతుల ప్రకారం
  rationale: హీబ్రూ מין ప్రాచీన పాఠ్యంలో ఒక రకం లేదా వర్గాన్ని సూచిస్తుంది; అది ఆధునిక సాంకేతిక పదమైన ‘species’కు ఖచ్చితమైన సమానం కాదు. ‘రకాలు’ మూలపాఠం చెప్పిన పరిమితిలోనే అర్థాన్ని ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన వచనం. ‘పచ్చని వృక్షసంపద’ సమష్టి భావాన్ని, ‘మొక్కలు’, ‘చెట్లు’ ప్రధాన సృష్టి వర్గాలను స్పష్టంగా ఉంచాయి.
