revisions:
- from: అవి భూమిపై వెలుగు ప్రసరింపజేయడానికి ఆకాశ విశాలంలో వెలుగులుగా[a] ఉండాలి. అలాగే జరిగింది.
  to: అవి భూమిపై వెలుగు ఇవ్వడానికి ఆకాశ విశాలంలో వెలుగునిచ్చే జ్యోతులుగా[a] ఉండాలి. అది అలాగే జరిగింది.
  rationale: The revision makes the light-bearing sense of מְאֹרֹת explicit in the main text while retaining “వెలుగులుగా” as a legitimate concise alternative in the footnote. It otherwise preserves the draft’s accurate volitive, causal, locative, and fulfillment senses in modern standard Telugu.
