id: GEN.1.15
reference: Genesis 1:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הָי֤וּ לִ/מְאוֹרֹת֙ בִּ/רְקִ֣יעַ הַ/שָּׁמַ֔יִם לְ/הָאִ֖יר עַל הָ/אָ֑רֶץ וַֽ/יְהִי כֵֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/015.yaml
  text: And let them be for lights in the expanse of the heavens to give light on the earth[b][a]. And it was so.
translation:
  language: te
  text: అవి భూమిపై వెలుగు ఇవ్వడానికి ఆకాశ విశాలంలో వెలుగునిచ్చే జ్యోతులుగా[a] ఉండాలి. అది అలాగే జరిగింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వెలుగులుగా.’ హెబ్రీ పదం అమూర్తమైన వెలుగును కాక, వెలుగునిచ్చే ఖగోళ వస్తువులను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיוּ
  choice: ఉండాలి
  rationale: ముందటి వచనంలోని సృష్టి ఆజ్ఞకు కొనసాగింపుగా ఉన్న విధ్యర్థక భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: לִמְאוֹרֹת
  choice: వెలుగులుగా
  rationale: ఈ పదం అమూర్తమైన వెలుగును కాక, వెలుగు ఇచ్చే ఖగోళ వస్తువులను సూచిస్తుంది; ప్రధాన పాఠంలో సహజత్వాన్ని ఉంచి ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: בִּרְקִיעַ הַשָּׁמַיִם
  choice: ఆకాశ విశాలంలో
  rationale: רָקִיעַ యొక్క విస్తరింపబడిన ప్రదేశం అనే భావాన్ని, הַשָּׁמַיִם యొక్క ఆకాశ సంబంధాన్ని సహజంగా కలిపి వ్యక్తం చేస్తుంది.
- source_word: לְהָאִיר
  choice: వెలుగు ప్రసరింపజేయడానికి
  rationale: హిఫీల్ రూపంలోని కారణార్థక భావాన్ని—వెలుగు కలిగించడం లేదా ఇవ్వడం—స్పష్టంగా తెలియజేస్తుంది.
- source_word: עַל הָאָרֶץ
  choice: భూమిపై
  rationale: వెలుగు చేరే ప్రదేశాన్ని సంక్షిప్తంగా, సహజంగా సూచిస్తుంది.
- source_word: וַיְהִי כֵן
  choice: అలాగే జరిగింది
  rationale: ఆజ్ఞ నెరవేరినదని తెలిపే ఆదికాండం 1లోని పునరావృత సూత్రాన్ని ఆధునిక తెలుగులో సహజంగా అందిస్తుంది.
theological_decisions:
- issue: సృష్టి వాక్యంలో וְהָיוּ యొక్క విధ్యర్థక బలం
  choice: ఆజ్ఞ కొనసాగింపుగా ‘ఉండాలి’
  alternative: సాధారణ భవిష్యత్తుగా ‘ఉంటాయి’
  rationale: తక్షణ సందర్భంలో ఇది దేవుని నియామక ఆజ్ఞలో భాగం; విధ్యర్థక అనువాదం ఆజ్ఞ తరువాత నెరవేర్పు అనే సాహిత్య నిర్మాణాన్ని కాపాడుతుంది, అదనపు సిద్ధాంతార్థాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరతను కాపాడుతూ సాధారణ పాఠకులకు అర్థమయ్యే పదజాలం వాడబడింది. ‘ఆకాశ విశాలం’ ద్వారా ప్రాచీన భావాన్ని అతిగా ఆధునికీకరించకుండా సహజంగా వ్యక్తం చేశాం.
