id: GEN.1.14
reference: Genesis 1:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֱלֹהִ֗ים יְהִ֤י מְאֹרֹת֙ בִּ/רְקִ֣יעַ הַ/שָּׁמַ֔יִם לְ/הַבְדִּ֕יל בֵּ֥ין הַ/יּ֖וֹם וּ/בֵ֣ין הַ/לָּ֑יְלָה וְ/הָי֤וּ לְ/אֹתֹת֙ וּ/לְ/מ֣וֹעֲדִ֔ים וּ/לְ/יָמִ֖ים וְ/שָׁנִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/014.yaml
  text: And God said[a], “Let there be lights in the expanse of the heavens to separate the day from the night, and let them be for signs and for appointed times[d][c][b], and for days and years.”
translation:
  language: te
  text: 'అప్పుడు దేవుడు ఇలా అన్నాడు: “పగలు, రాత్రి మధ్య భేదం కలిగించడానికి ఆకాశ విస్తారంలో[a] జ్యోతులు[b] ఉండాలి. అవి సూచనల కోసం, నియమిత కాలాల[c] కోసం, రోజులు మరియు సంవత్సరాల కోసం ఉండాలి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ఆకాశ విస్తారం’కు బదులుగా ‘ఆకాశ మండలం’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అంటే వెలుగునిచ్చే ఖగోళ వస్తువులు; ‘వెలుగులు’ లేదా ‘వెలుగు మూలాలు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: ‘నియమిత కాలాలు’కు బదులుగా ‘ఋతువులు’ అని కూడా అనువదించవచ్చు. హీబ్రూ పదం ఇతర సందర్భాల్లో నియమిత పండుగ సమయాలను కూడా సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְאֹרֹת
  choice: జ్యోతులు
  rationale: ఈ నామవాచకం వెలుగునిచ్చే ఖగోళ వస్తువులను సూచిస్తుంది. ‘జ్యోతులు’ ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదంగా, సంక్షిప్తంగా ఉండి కేవలం వెలుగు అనే అమూర్త భావం కాక వెలుగు మూలాలను సూచిస్తుంది.
- source_word: רָקִיעַ
  choice: విశాలం
  rationale: విస్తరింపబడిన ప్రదేశం అనే మూలభావాన్ని ‘విశాలం’ సహజంగా తెలియజేస్తుంది; ప్రాచీన ఖగోళ నిర్మాణాన్ని అనవసరంగా నిర్దిష్టం చేయదు.
- source_word: הַשָּׁמַיִם
  choice: ఆకాశ
  rationale: ఈ సందర్భంలో పై ఆకాశ ప్రాంతాన్ని సూచిస్తుంది. ‘ఆకాశ విశాలం’ అనే సంయుక్త ప్రయోగం సహజ తెలుగు వాక్యనిర్మాణానికి సరిపోతుంది.
- source_word: לְהַבְדִּיל
  choice: తేడా చూపించడానికి
  rationale: హీబ్రూ క్రియలోని వేరుచేయడం/భేదపరచడం అనే ఉద్దేశాన్ని సహజ తెలుగులో తెలియజేస్తుంది; పగలు, రాత్రి భౌతిక వస్తువులవలె విడదీయబడుతున్నాయనే అపార్థాన్ని తగ్గిస్తుంది.
- source_word: בֵּין הַיּוֹם וּבֵין הַלַּיְלָה
  choice: పగటికి, రాత్రికి మధ్య
  rationale: హీబ్రూలోని ‘మధ్య’ నిర్మాణాన్ని స్పష్టంగా నిలుపుతూ తెలుగులో సహజంగా ఉంటుంది.
- source_word: לְאֹתֹת
  choice: సూచనల కోసం
  rationale: אות యొక్క విస్తృతమైన గుర్తులు/సూచికలు అనే అర్థాన్ని నిర్దిష్ట ఖగోళ లేదా మతపరమైన సూచనలకు పరిమితం చేయకుండా ఉంచుతుంది.
- source_word: לְמוֹעֲדִים
  choice: నియమిత కాలాల కోసం
  rationale: కాలనిర్ణయం, ఋతువులు, పండుగ సమయాలు వంటి సాధ్యమైన భావవ్యాప్తిని ఉంచుతూ, ఈ సృష్టి సందర్భంలో కేవలం ఆరాధనా పండుగలకు పరిమితం చేయదు.
- source_word: לְיָמִים וְשָׁנִים
  choice: రోజుల కోసం, సంవత్సరాల కోసం
  rationale: మూలంలోని రెండు కాల ప్రమాణాలను నేరుగా, స్పష్టంగా అనువదిస్తుంది; ప్రతి పదానికి ఉన్న לְ భావాన్ని తెలుగులో పునరుక్తి ద్వారా చూపిస్తుంది.
- source_word: יְהִי ... וְהָיוּ
  choice: ఉండాలి ... ఉండాలి
  rationale: దైవ ఆజ్ఞను తెలిపే జస్సివ్ భావాన్ని సహజ తెలుగు ఆజ్ఞార్థక శైలిలో నిలుపుతుంది.
theological_decisions:
- issue: సృష్టి సందర్భంలో מוֹעֲדִים యొక్క అర్థం
  choice: విస్తృతార్థకమైన ‘నియమిత కాలాలు’
  alternative: ఋతువులు; పండుగలు
  rationale: ఈ పదం ఇతర సందర్భాల్లో ఇశ్రాయేలు నియమిత పండుగలను సూచించగలిగినా, ఆదికాండము 1:14లో విశ్వ కాలక్రమ ఏర్పాటు ప్రధాన సందర్భం. ‘నియమిత కాలాలు’ తరువాతి ఆధ్యాత్మిక ప్రతిధ్వనిని అడ్డుకోకుండా, ఇక్కడ లేని సంకుచిత పండుగ భావాన్ని రుద్దదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే సృష్టి వృత్తాంతానికి తగిన గౌరవప్రదమైన శైలి. మూలంలోని దైవ ఆజ్ఞ, ఉద్దేశ సూచక నిర్మాణాలు, మరియు కాలాల జాబితా నిలుపబడ్డాయి.
