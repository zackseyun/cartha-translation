  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּקְרָ֨א אֱלֹהִ֤ים לַ/יַּבָּשָׁה֙ אֶ֔רֶץ וּ/לְ/מִקְוֵ֥ה הַ/מַּ֖יִם קָרָ֣א יַמִּ֑ים וַ/יַּ֥רְא אֱלֹהִ֖ים כִּי טֽוֹב׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/010.yaml
  text: And God called the dry land Earth[a], and the gathering of the waters he called Seas. And God saw that it was good.
translation:
  language: te
  text: దేవుడు పొడి నేలకు “భూమి”[a] అని పేరు పెట్టాడు; జలాల సమూహానికి “సముద్రాలు” అని పేరు పెట్టాడు. అది మంచిదని దేవుడు చూశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘నేల.’ హీబ్రూ אֶרֶץ అనే పదం సాధారణ నామవాచకంగా ‘నేల’ లేదా ‘భూమి’ అని అర్థమివ్వగలదు; ఈ నామకరణ సందర్భంలో అది పొడి నేలకు పెట్టిన పేరుగా కూడా పనిచేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא / קָרָא
  choice: పేరు పెట్టాడు
  rationale: ఈ సందర్భంలో క్రియకు పేరు పెట్టడం లేదా ఒక పేరుతో పిలవడం అనే భావం ఉంది. ఆధునిక తెలుగులో ‘పేరు పెట్టాడు’ నామకరణ చర్యను స్పష్టంగా, సహజంగా తెలియజేస్తుంది; రెండుసార్లూ అదే నిర్మాణాన్ని నిలుపుతుంది.
- source_word: אֱלֹהִים
  choice: దేవుడు
  rationale: ఆదికాండము 1లో బహువచన రూపంలోని ఈ నామవాచకంతో ఏకవచన క్రియలు వాడబడ్డాయి; ఇది ఏకైక సృష్టికర్తను సూచిస్తుంది.
- source_word: לַיַּבָּשָׁה
  choice: ఆరిన నేలకు
  rationale: ఇది సమకూడిన జలాలకు భిన్నమైన ఎండిన నేలను సూచిస్తుంది. ‘ఆరిన నేల’ సాధారణ ఆధునిక తెలుగులో సహజంగా ఉండి, సందర్భంలోని విభజనను స్పష్టం చేస్తుంది.
- source_word: אֶרֶץ
  choice: భూమి
  rationale: ఈ పదం ‘భూమి/నేల/దేశం’ వంటి అర్థాలను కలిగి ఉంటుంది. ఇక్కడ ఆరిన నేలకు పెట్టిన పేరుగా ‘భూమి’ సరిపోతుంది; తెలుగు లిపిలో పెద్ద అక్షర భేదం లేకపోవడం వల్ల నామకరణ భావాన్ని ఉల్లేఖన చిహ్నాలు తెలియజేస్తాయి.
- source_word: מִקְוֵה הַמַּיִם
  choice: సమకూడిన జలాలకు
  rationale: మִקְוֵה అనేది కూడిన సమూహం లేదా సమీకరణాన్ని సూచిస్తుంది. తెలుగు వాక్య నిర్మాణంలో ‘సమకూడిన జలాలు’ మూల భావాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: הַמַּיִם
  choice: జలాలు
  rationale: హీబ్రూ బహువచన రూపాన్ని, సృష్టి వర్ణనకు తగిన గంభీర శైలిని ‘జలాలు’ నిలుపుతుంది.
- source_word: יַמִּים
  choice: సముద్రాలు
  rationale: మూలంలోని బహువచనాన్ని నిలుపుతూ, సమకూడిన జలరాశులకు పెట్టిన పేరును సహజంగా తెలియజేస్తుంది.
- source_word: וַיַּרְא
  choice: చూశాడు
  rationale: ఆదికాండము 1లో పునరావృతమయ్యే దేవుని మూల్యాంకన సూత్రానికి సూటిగా సరిపడే సాధారణ తెలుగు క్రియ.
- source_word: כִּי טוֹב
  choice: అది మంచిదని
  rationale: ‘మంచి’ అనే పదం טוֹב యొక్క నైతిక, ప్రయోజనకర, శ్రేయస్కర విస్తృతిని అనవసరంగా కుదించకుండా నిలుపుతుంది.
theological_decisions:
- issue: אֶרֶץ‌ను సాధారణ నామవాచకంగా అనువదించాలా, నామకరణంలో ఇచ్చిన పేరుగా చూపాలా
  choice: నామకరణంలో ఇచ్చిన పేరుగా “భూమి” అని ఉల్లేఖన చిహ్నాలతో చూపడం
  alternative: సాధారణ నామవాచకంగా ‘నేల’ లేదా ‘భూమి’ అని ఉల్లేఖన చిహ్నాలు లేకుండా ఇవ్వడం
  rationale: దేవుడు ఆరిన నేలకు పేరు పెడుతున్నాడని వాక్యం స్పష్టంగా చెబుతుంది. తెలుగు లిపిలో capitalization లేకపోవడంతో ఉల్లేఖన చిహ్నాలు ఆ పేరుపెట్టే విధిని సూచిస్తాయి; ఇది ఆధునిక శాస్త్రీయ భావనను వచనంలోకి దిగుమతి చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన శైలి. ‘పేరు పెట్టాడు’ నామకరణాన్ని సహజంగా తెలుపుతుంది. మూలంలోని జలాల బహువచనం, సముద్రాల బహువచనం, పునరావృత క్రియా నిర్మాణం సాధ్యమైనంతవరకు నిలుపబడ్డాయి.
