id: GEN.1.11
reference: Genesis 1:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֱלֹהִ֗ים תַּֽדְשֵׁ֤א הָ/אָ֨רֶץ֙ דֶּ֔שֶׁא עֵ֚שֶׂב מַזְרִ֣יעַ זֶ֔רַע עֵ֣ץ פְּרִ֞י עֹ֤שֶׂה פְּרִי֙ לְ/מִינ֔/וֹ אֲשֶׁ֥ר זַרְע/וֹ ב֖/וֹ עַל הָ/אָ֑רֶץ וַֽ/יְהִי כֵֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/011.yaml
  text: 'And God said[a], “Let the earth sprout vegetation: plants yielding seed, and fruit trees bearing fruit according to their kinds, with their seed in them[c][b], on the earth.” And it was so.'
translation:
  language: te
  text: 'దేవుడు ఇలా అన్నాడు: “భూమి పచ్చని మొక్కలను మొలిపించాలి: విత్తనాలు ఇచ్చే మొక్కలను, తమ తమ జాతుల ప్రకారం ఫలాలు కాసే, వాటిలోనే విత్తనాలు ఉండే ఫలవృక్షాలను భూమి మీద మొలిపించాలి.” అలాగే జరిగింది.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תַּדְשֵׁא
  choice: భూమి ... మొలిపించాలి
  rationale: హిఫీల్ జుస్సివ్‌లోని ఆజ్ఞాత్మక-కారణార్థ భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది; భూమి నుంచి మొక్కలు మొలకెత్తే చిత్రణను నిలుపుతుంది.
- source_word: דֶּשֶׁא
  choice: పచ్చని మొక్కలు
  rationale: తాజా పచ్చని వృక్షవృద్ధిని సూచించే సమూహార్థ పదం; కేవలం ‘గడ్డి’ అని పరిమితం చేయదు.
- source_word: עֵשֶׂב
  choice: మొక్కలు
  rationale: గుల్మేతర/శాకజాతి మొక్కల విస్తృత వర్గాన్ని సాధారణ పాఠకునికి సహజంగా తెలియజేస్తుంది.
- source_word: מַזְרִיעַ זֶרַע
  choice: విత్తనాలు ఉత్పత్తి చేసే
  rationale: విత్తనాన్ని ఉత్పత్తి చేయడం అనే నిరంతర లక్షణాన్ని స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: עֵץ פְּרִי עֹשֶׂה פְּרִי
  choice: ఫలాలు కాసే ... ఫలవృక్షాలు
  rationale: ఫలవృక్షం మరియు అది ఫలాన్ని ఉత్పత్తి చేసే లక్షణం రెండింటినీ సహజమైన వ్యవసాయ వాడుకలో నిలుపుతుంది.
- source_word: לְמִינוֹ
  choice: వాటి వాటి జాతుల ప్రకారం
  rationale: హీబ్రూలో ఏకవచనం పంపిణీయార్థంలో ఉంది; తెలుగు పునరుక్తి ప్రతి వర్గం తన జాతి ప్రకారమే ఫలించడాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: אֲשֶׁר זַרְעוֹ בוֹ
  choice: వాటిలోనే విత్తనాలు ఉండే
  rationale: విత్తనం వాటిలో అంతర్భూతంగా ఉందనే సంబంధ వాక్య భావాన్ని సామూహిక బహువచనంలో సహజంగా అందిస్తుంది.
- source_word: עַל הָאָרֶץ
  choice: భూమి మీద
  rationale: సృష్టి సందర్భంలోని సాధారణ స్థానార్థాన్ని నేరుగా వ్యక్తపరుస్తుంది.
- source_word: וַיְהִי כֵן
  choice: అలాగే జరిగింది
  rationale: దైవవాక్యం నెరవేరినట్లు తెలిపే ఆదికాండపు సూత్రవాక్యాన్ని సహజమైన, గంభీరమైన తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: సృష్టించబడిన మొక్కల వర్గాల పరిధి
  choice: పాఠంలోని పచ్చని వృద్ధి, విత్తనోత్పత్తి మొక్కలు, ఫలవృక్షాలు అనే విస్తృత భేదాలను నిలుపడం
  alternative: ‘గడ్డి, విత్తనమిచ్చే ఓషధులు, ఫలవృక్షాలు’ అని మరింత సంప్రదాయబద్ధంగా అనువదించడం లేదా అన్నిటినీ ‘అన్ని రకాల మొక్కలు’గా కలిపివేయడం
  rationale: హీబ్రూ పాఠం పేర్కొన్న అనుభవాధారిత వర్గాలను ఆధునిక శాస్త్రీయ వర్గీకరణగా మార్చకుండా, అదే సమయంలో వాటి మధ్యనున్న భేదాలను చెరపకుండా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే సృష్టి వర్ణనకు తగిన గంభీరతతో రూపొందించబడింది. ‘ఓషధి’ వంటి అరుదైన పదాలకు బదులుగా ‘మొక్కలు’ వాడబడింది; హీబ్రూ ఏకవచన పంపిణీయ నిర్మాణం ప్రధాన వచనంలో సహజ తెలుగు బహువచనంగా, పాదటిప్పణిలో అక్షరార్థ రూపంగా చూపబడింది.
