  terminology: ‘దేవుడు,’ ‘వెలుగు,’ ‘చీకటి,’ ‘పగలు,’ ‘రాత్రి,’ ‘సాయంకాలం,’ ‘ఉదయం’ అన్న పదాలు సందర్భానుకూలమైన ప్రామాణిక తెలుగు పదాలే. ‘మొదటి రోజు’ అనేది ప్రధాన పాఠ్యంలో సహజమైన అనువాదం కాగా, హీబ్రూ సంఖ్యావాచక రూపం పాదసూచికలో సరియైన విధంగా భద్రపరచబడింది.
