id: GEN.1.5
reference: Genesis 1:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּקְרָ֨א אֱלֹהִ֤ים לָ/אוֹר֙ י֔וֹם וְ/לַ/חֹ֖שֶׁךְ קָ֣רָא לָ֑יְלָה וַֽ/יְהִי עֶ֥רֶב וַֽ/יְהִי בֹ֖קֶר י֥וֹם אֶחָֽד׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/005.yaml
  text: And God called the light Day[a], and the darkness he called Night. And there was evening, and there was morning—the first day.
translation:
  language: te
  text: దేవుడు వెలుగుకు “పగలు” అని పేరు పెట్టాడు; చీకటికి “రాత్రి” అని పేరు పెట్టాడు. సాయంకాలం అయింది, ఉదయం అయింది—అది మొదటి రోజు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూలో అక్షరార్థంగా: “రోజు ఒకటి.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: పేరు పెట్టాడు
  rationale: קרא అనే క్రియ పేరుపెట్టే నిర్మాణంలో ‘పిలిచాడు’ లేదా ‘పేరు పెట్టాడు’ అని అర్థమవుతుంది. ఆధునిక తెలుగులో పేరుపెట్టే చర్యను స్పష్టంగా, సహజంగా తెలియజేయడానికి ‘పేరు పెట్టాడు’ ఎంచుకున్నాం.
- source_word: אֱלֹהִים
  choice: దేవుడు
  rationale: ఈ బహువచన రూప నామవాచకానికి ఇక్కడ ఏకవచన క్రియ ఉంది; ఆదికాండము 1 సందర్భంలో ఇది ఏకైక సృష్టికర్తను సూచిస్తుంది.
- source_word: לָאוֹר
  choice: వెలుగుకు
  rationale: לְ ఉపసర్గ పేరుపెట్టబడుతున్న దానిని సూచిస్తుంది. తెలుగు పేరుపెట్టే నిర్మాణంలో ‘వెలుగుకు ... అని పేరు పెట్టాడు’ సహజంగా ఉండి, హీబ్రూ సంబంధాన్ని కూడా నిలుపుతుంది.
- source_word: יוֹם
  choice: పగలు
  rationale: ఇక్కడ יוֹם అనేది వెలుగుకు పెట్టిన పేరు; ‘పగలు’ అనడం చీకటికి పెట్టిన ‘రాత్రి’ అనే పేరుతో సహజమైన వ్యత్యాసాన్ని చూపుతుంది.
- source_word: וְלַחֹשֶׁךְ
  choice: చీకటికి
  rationale: మొదటి పేరుపెట్టే వాక్యానికి సమాంతరంగా, ఉపసర్గతో కూడిన హీబ్రూ రూపాన్ని తెలుగులో ‘చీకటికి’గా ప్రతిబింబించాం.
- source_word: לָיְלָה
  choice: రాత్రి
  rationale: చీకటికి పెట్టిన పేరుగా సాధారణమైన, నేరమైన తెలుగు పదం.
- source_word: וַיְהִי
  choice: అయింది
  rationale: సాయంకాలం, ఉదయం వరుసగా ఏర్పడిన కాలక్రమాన్ని సహజ తెలుగులో తెలియజేస్తుంది; రెండుసార్లు వాడి హీబ్రూ పునరుక్తిని నిలిపాం.
- source_word: עֶרֶב
  choice: సాయంకాలం
  rationale: మూలపదపు సాధారణ అర్థం ‘సాయంకాలం’; ‘సూర్యాస్తమయం’ అనడం అవసరానికి మించిన నిర్దిష్టత అవుతుంది.
- source_word: בֹקֶר
  choice: ఉదయం
  rationale: మూలపదానికి సాధారణ తెలుగు సమానం; ‘తెల్లవారుజాము’ కంటే విస్తృతమైన అర్థాన్ని నిలుపుతుంది.
- source_word: יוֹם אֶחָד
  choice: మొదటి రోజు
  rationale: హీబ్రూలో అక్షరార్థంగా ‘రోజు ఒకటి’ అనే సంఖ్యావాచక నిర్మాణం ఉంది. అయితే రోజుల వరుస ప్రారంభాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేయడానికి ‘మొదటి రోజు’ వాడి, అక్షరార్థ రూపాన్ని పాదసూచికలో ఉంచాం.
theological_decisions:
- issue: సృష్టి దినాల సూత్రవాక్యం చివర ఉన్న יוֹם אֶחָד అనువాదం
  choice: మొదటి రోజు
  alternative: రోజు ఒకటి
  rationale: אֶחָד అనేది ‘ఒకటి’ అనే సంఖ్యావాచకం, ‘మొదటి’ అనే క్రమసంఖ్య కాదు. అయినా కథనంలోని వరుసను తెలుగులో ‘మొదటి రోజు’ సహజంగా తెలియజేస్తుంది. అక్షరార్థ పదబంధానికి వ్యాఖ్యాన ప్రాముఖ్యత ఉండవచ్చు కాబట్టి దాన్ని పాదసూచికలో స్పష్టంగా ఇచ్చాం; దాని భావాన్ని ప్రధాన పాఠ్యంలో నిశ్శబ్దంగా నిర్ణయించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు స్పష్టంగా, గౌరవప్రదంగా ఉండే శైలి. పేరుపెట్టే రెండు భాగాల సమాంతరతను, ‘సాయంకాలం అయింది, ఉదయం అయింది’ అనే పునరుక్త లయను నిలిపాం.
