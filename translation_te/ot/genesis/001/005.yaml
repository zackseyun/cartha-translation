  source_fidelity: హీబ్రూ పేరుపెట్టే సమాంతర నిర్మాణం (వెలుగు—పగలు; చీకటి—రాత్రి), సాయంకాలం/ఉదయం పునరుక్తి, మరియు יוֹם אֶחָד యొక్క క్రమసూచక భావం అన్నీ నమ్మకంగా ప్రతిఫలించాయి. ‘పేరు పెట్టాడు’ కרא యొక్క ఈ సందర్భంలోని నామకరణార్థాన్ని సహజంగా తెలియజేస్తుంది. ‘సాయంకాలం అయింది, ఉదయం అయింది’ వాక్యం וַיְהִי యొక్క పునరావృతిని నిలుపుతూ తెలుగులో సులభంగా ఉంది.
