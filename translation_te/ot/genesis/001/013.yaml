  text: וַֽ/יְהִי עֶ֥רֶב וַֽ/יְהִי בֹ֖קֶר י֥וֹם שְׁלִישִֽׁי־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/013.yaml
  text: And there was evening[a], and there was morning—the third day.
translation:
  language: te
  text: సాయంకాలం అయింది, ఉదయం అయింది; ఇది మూడవ రోజు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: అయింది
  rationale: ఈ సృష్టి వృత్తాంతపు పునరావృత సూత్రంలో היה యొక్క కథన రూపాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది. రెండుసార్లు వాడడం మూలంలోని లయను నిలుపుతుంది.
- source_word: עֶרֶב
  choice: సాయంకాలం
  rationale: ఈ నామవాచకం సాయంకాలం లేదా సంధ్యను సూచిస్తుంది; సృష్టి దినాల పునరావృత వాక్యంలో ‘సాయంకాలం’ స్పష్టమైన సాధారణ పదం.
- source_word: בֹּקֶר
  choice: ఉదయం
  rationale: ఈ నామవాచకం ఉదయాన్ని సూచిస్తుంది; ‘సాయంకాలం’తో ఉన్న సూత్రబద్ధ సమాంతరతను సహజంగా నిలుపుతుంది.
- source_word: יוֹם
  choice: రోజు
  rationale: ఇక్కడ సృష్టి క్రమంలోని సంఖ్యాపూర్వక దినాన్ని గుర్తిస్తుంది; ఆధునిక సాధారణ తెలుగులో ‘రోజు’ సహజంగా ఉంటుంది.
- source_word: שְׁלִישִׁי
  choice: మూడవ
  rationale: క్రమసంఖ్యను నేరుగా తెలియజేస్తూ ‘రోజు’ను విశేషిస్తుంది.
- source_word: וַיְהִי עֶרֶב וַיְהִי בֹקֶר
  choice: సాయంకాలం అయింది, ఉదయం అయింది
  rationale: మూలంలోని రెండు సమాంతర క్రియలను నిలుపుతూ, తెలుగు వాక్యక్రమంలో సహజంగా మరియు లయబద్ధంగా ఉంటుంది.
theological_decisions:
- issue: సృష్టి దినాల కాలవ్యవధి లేదా సాహిత్య విధానంపై ఒక నిర్దిష్ట వ్యాఖ్యానాన్ని అనువాదంలో చేర్చకుండా పునరావృత వాక్యాన్ని అందించడం
  choice: సాయంకాలం అయింది, ఉదయం అయింది—మూడవ రోజు.
  alternative: సాయంకాలం అయింది, ఉదయం అయింది—మూడో దినం.
  rationale: ఈ రూపం హెబ్రీ వాక్యంలోని క్రమాన్ని సూటిగా తెలియజేస్తుంది; ‘రోజు’ యొక్క కాలవ్యవధి లేదా సాహిత్య పాత్రకు సంబంధించిన తరువాతి వ్యాఖ్యాన వివాదాలను అనువాదమే పరిష్కరించదు.
translation_notes:
  register: సహజమైన, ఆధునిక, గౌరవప్రదమైన ప్రామాణిక తెలుగు. హెబ్రీ పునరావృత లయను ‘అయింది’ అనే క్రియను రెండుసార్లు ఉంచడం ద్వారా కాపాడింది; ‘మూడవ రోజు’ సాధారణ పాఠకులకు స్పష్టంగా ఉంటుంది.
