source:
  edition: WLC
  text: וַ/יַּ֧רְא אֱלֹהִ֛ים אֶת הָ/א֖וֹר כִּי ט֑וֹב וַ/יַּבְדֵּ֣ל אֱלֹהִ֔ים בֵּ֥ין הָ/א֖וֹר וּ/בֵ֥ין הַ/חֹֽשֶׁךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/004.yaml
  text: And God saw that the light was good[a], and God separated the light from the darkness.
translation:
  language: te
  text: దేవుడు వెలుగు మంచిదని చూశాడు; దేవుడు వెలుగును చీకటి నుండి వేరుచేశాడు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వెలుగును చీకటి నుండి విభజించాడు’; హెబ్రీ క్రియ రెండు విషయాల మధ్య భేదం చేయడమనే అర్థాన్ని కూడా కలిగి ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: చూశాడు
  rationale: ראה అనే క్రియ యొక్క కథన రూపానికి సహజమైన అనువాదం ‘చూశాడు’. సందర్భంలోని మూల్యాంకన భావాన్ని ఇది అనవసరంగా విస్తరించకుండా నిలుపుతుంది.
- source_word: אֱלֹהִים
  choice: దేవుడు
  rationale: రూపంలో బహువచనమైనా, ఆదికాండము 1లో ఇది ఏకవచన క్రియలతో వచ్చి ఏకైక సృష్టికర్తను సూచిస్తుంది.
- source_word: אֶת
  choice: '[ప్రత్యేకంగా అనువదించలేదు]'
  rationale: ఇది ప్రత్యక్ష కర్మ సూచకం; తెలుగు విభక్తి ‘ను’ ద్వారా దాని వ్యాకరణ విధి వ్యక్తమైంది.
- source_word: הָאוֹר
  choice: వెలుగు
  rationale: ముందటి వచనంలో ఉనికిలోకి వచ్చిన నిర్దిష్ట వెలుగునే సూచిస్తుంది. తెలుగులో సందర్భం ద్వారానే నిర్దిష్టత సహజంగా తెలుస్తుంది.
- source_word: כִּי
  choice: అని
  rationale: దేవుడు గ్రహించిన విషయాన్ని పరిచయం చేసే పూరకార్థక ప్రయోగం; తెలుగులో ‘అని’ సహజంగా ఆ సంబంధాన్ని తెలియజేస్తుంది.
- source_word: טוֹב
  choice: మంచిది
  rationale: טוֹב యొక్క విస్తృతమైన మూల్యాంకన భావాన్ని ‘మంచిది’ నిలుపుతుంది; ‘ఆహ్లాదకరమైనది’ లేదా ‘ప్రయోజనకరమైనది’ వంటి ఎంపికలు భావాన్ని అనవసరంగా కుదిస్తాయి.
- source_word: וַיַּבְדֵּל
  choice: వేరుచేశాడు
  rationale: בדל అంటే వేరుచేయడం లేదా విభజించడం. ‘వేరుచేశాడు’ ఆధునిక తెలుగులో స్పష్టంగా ఉండి, వేరుచేయడం ఏ విధంగా జరిగిందో నిర్దేశించదు.
- source_word: בֵּין ... וּבֵין
  choice: నుండి
  rationale: హెబ్రీ నిర్మాణం అక్షరార్థంగా ‘వెలుగు మధ్య ... చీకటి మధ్య’ అని ఉన్నా, ‘వేరుచేశాడు’తో తెలుగులో ‘వెలుగును చీకటి నుండి’ అనడం సహజం మరియు అర్థాన్ని నిలుపుతుంది.
- source_word: הַחֹשֶׁךְ
  choice: చీకటి
  rationale: సృష్టి వృత్తాంతంలో ఇప్పటికే ప్రస్తావించిన చీకటిని సూచిస్తుంది; తెలుగులో సందర్భం ద్వారానే నిర్దిష్టత స్పష్టమవుతుంది.
theological_decisions:
- issue: రెండు ఉపవాక్యాల్లోనూ אֱלֹהִים అనే కర్త పునరావృతం
  choice: రెండవ ఉపవాక్యంలోనూ ‘దేవుడు’ అని పునరుక్తి చేయడం
  alternative: రెండవ ఉపవాక్యంలో కర్తను వదిలి ‘వేరుచేశాడు’ అని మాత్రమే అనడం
  rationale: హెబ్రీ పాఠం దైవిక కర్తను స్పష్టంగా మళ్లీ పేర్కొంటుంది. ఆ పునరుక్తి మూలపాఠపు లయను, ఉద్ఘాటనను కాపాడుతుంది.
- issue: వెలుగు మరియు చీకటి మధ్య వేరుచేయడం యొక్క స్వభావం
  choice: స్థలపరమైనదా, కాలపరమైనదా, భావపరమైనదా అని నిర్దేశించకుండా ‘వేరుచేశాడు’ అని అనువదించడం
  alternative: ‘విభజించాడు’ లేదా ‘భేదం కలిగించాడు’ అని అనువదించడం
  rationale: వేరుచేయడం ఎలా జరిగిందో మూలపాఠం వివరించదు. ఎంపిక చేసిన పదం ఆ భావసందిగ్ధతను, సృష్టి క్రమపరచబడిన విధానంపై ఉన్న విపులతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గంభీరమైన కథన శైలి. హెబ్రీలోని దైవిక కర్త పునరుక్తిని నిలిపి, తెలుగు వాక్యప్రవాహానికి సహజంగా ఉండేందుకు రెండు ఉపవాక్యాలను అర్ధవిరామంతో కలిపాం. పాదసూచిక గుర్తును దాని సంబంధిత ‘వేరుచేశాడు’ అనే పదం తర్వాత ఉంచాం.
