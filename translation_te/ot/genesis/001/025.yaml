id: GEN.1.25
reference: Genesis 1:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּ֣עַשׂ אֱלֹהִים֩ אֶת חַיַּ֨ת הָ/אָ֜רֶץ לְ/מִינָ֗/הּ וְ/אֶת הַ/בְּהֵמָה֙ לְ/מִינָ֔/הּ וְ/אֵ֛ת כָּל רֶ֥מֶשׂ הָֽ/אֲדָמָ֖ה לְ/מִינֵ֑/הוּ וַ/יַּ֥רְא אֱלֹהִ֖ים כִּי טֽוֹב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/025.yaml
  text: And God made the beasts of the earth according to their kinds[a], and the livestock according to their kinds, and every creeping thing of the ground according to its kind[c][b]. And God saw that it was good.
translation:
  language: te
  text: దేవుడు భూమిలోని మృగాలను[a] వాటి వాటి రకాల ప్రకారం, పశువులను వాటి వాటి రకాల ప్రకారం, నేలమీద పాకే ప్రతి జీవిని[c] దాని రకం ప్రకారం[b] చేశాడు. అది మంచిదని దేవుడు చూశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘భూమిలోని అడవి జంతువులను.’
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో ‘దాని రకం ప్రకారం’ / ‘వాటి వాటి రకాల ప్రకారం.’ ఇక్కడి పదం జీవుల వర్గాలను సూచిస్తుంది; దానిని ఆధునిక శాస్త్రీయ జీవవర్గీకరణలోని ఖచ్చితమైన విభాగంగా భావించకూడదు.
    reason: cultural_note
  - marker: c
    text: లేదా ‘భూమిమీద పాకే ప్రతి జీవిని.’ ఈ వచనంలో ఇంతకుముందు వాడిన ‘భూమి’ అనే హీబ్రూ పదానికి భిన్నంగా ఇక్కడ ‘నేల’ అనే పదం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: చేశాడు
  rationale: עשה అనే క్రియకు సాధారణంగా ‘చేయు/రూపొందించు’ అనే అర్థం. సృష్టి సందర్భంలో అదనపు భావాన్ని చేర్చకుండా ‘చేశాడు’ సహజంగా, నేరుగా మూలాన్ని ప్రతిబింబిస్తుంది.
- source_word: אֱלֹהִים
  choice: దేవుడు
  rationale: ఈ బహువచన రూప నామవాచకానికి ఇక్కడ ఏకవచన క్రియ ఉంది; ఆదికాండము 1లో ఇది ఏకైక సృష్టికర్తను సూచిస్తుంది.
- source_word: חַיַּת הָאָרֶץ
  choice: భూమిలోని మృగాలు
  rationale: ఈ పదబంధం పశువుల నుండి, నేలమీద పాకే జీవుల నుండి వేరుగా చెప్పబడిన అడవి భూజంతువులను సూచిస్తుంది. ‘మృగాలు’ ఈ వర్గభేదాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: לְמִינָהּ / לְמִינֵהוּ
  choice: వాటి వాటి రకాల ప్రకారం / దాని రకం ప్రకారం
  rationale: מין అనేది ఒక రకం లేదా వర్గాన్ని సూచిస్తుంది. ‘రకం’ మూల భావాన్ని కాపాడుతూ, ఆధునిక జీవశాస్త్రంలోని ‘జాతి/species’ అనే సాంకేతిక వర్గాన్ని అనవసరంగా దిగుమతి చేయదు.
- source_word: הַבְּהֵמָה
  choice: పశువులు
  rationale: בהמה ఇక్కడ మృగాల నుండి వేరుగా ఉన్న పెద్ద భూజంతువులను, ముఖ్యంగా మనుషులు పెంచే జంతువులను సూచిస్తుంది. ‘పశువులు’ సహజమైన తెలుగు వర్గపదం.
- source_word: כָּל רֶמֶשׂ הָאֲדָמָה
  choice: నేలమీద పాకే ప్రతి జీవి
  rationale: רמש నేలకు దగ్గరగా కదిలే చిన్న జీవులను సూచిస్తుంది. הָאֲדָמָהను ‘నేల’గా అనువదించడం, ఇదే వచనంలో ముందున్న הָאָרֶץ (‘భూమి’)తో గల పదభేదాన్ని నిలుపుతుంది.
- source_word: וַיַּרְא אֱלֹהִים כִּי טוֹב
  choice: అది మంచిదని దేవుడు చూశాడు
  rationale: ఇది ఆదికాండము 1లో పునరావృతమయ్యే దేవుని మదింపు వాక్యం. తెలుగు వాక్యనిర్మాణంలో ‘అది మంచిదని ... చూశాడు’ సహజంగా మూల భావాన్ని అందిస్తుంది.
theological_decisions:
- issue: సృష్టిలోని వర్గాలను ఆధునిక శాస్త్రీయ వర్గీకరణగా చూపకుండా అనువదించడం
  choice: రకాలు
  alternative: జాతులు / species
  rationale: హీబ్రూ מין ఒక రకాన్ని లేదా వర్గాన్ని సూచిస్తుంది; అది ఆధునిక జీవశాస్త్రంలోని species అనే ఖచ్చితమైన సాంకేతిక భావానికి సమానమని పాఠ్యం చెప్పదు. ‘రకాలు’ ఆ అనిశ్చితిని కాపాడుతుంది.
- issue: הָאָרֶץ మరియు הָאֲדָמָה మధ్య ఒకే వచనంలో ఉన్న పదభేదం
  choice: భూమి ... నేల
  alternative: భూమి ... భూమి
  rationale: ‘భూమి’ మరియు ‘నేల’ అనే వేర్వేరు పదాలు వాడటం మూలంలోని సంబంధితమైనా భిన్నమైన రెండు పదాలను సమతలీకరించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. హెబ్రీ వాక్యంలోని మూడు జీవవర్గాల సమాంతర నిర్మాణాన్ని నిలుపుతూ, తెలుగులో సహజంగా ఉండేందుకు ప్రధాన క్రియను చివర ఉంచాం. ‘రకం’ అనే సాధారణ పదం మూలంలోని వర్గార్థాన్ని కాపాడి ఆధునిక శాస్త్రీయ సాంకేతికతను నివారిస్తుంది.
