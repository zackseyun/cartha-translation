base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/019.yaml
  text: And there was evening[a], and there was morning—the fourth day.
translation:
  language: te
  text: సాయంకాలం అయింది, ఉదయం అయింది—నాలుగవ రోజు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత రూపానుసారంగా: “సాయంకాలం అయింది, ఉదయం అయింది—ఒక నాలుగవ రోజు.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: అయింది
  rationale: ఈ పునరావృత సృష్టి-वృత్తాంత సూత్రంలో היה యొక్క wayyiqtol రూపం ఒక స్థితి సంభవాన్ని సూచిస్తుంది. తెలుగు సహజ ప్రయోగంలో ‘అయింది’ సంక్షిప్తంగా, లయబద్ధంగా ఉండి ‘మారింది’ అనే అతివ్యాఖ్యానాన్ని నివారిస్తుంది.
- source_word: עֶרֶב
  choice: సాయంకాలం
  rationale: ఈ నామవాచకానికి నేరమైన, ఆధునిక ప్రామాణిక తెలుగు సమానార్థకం ‘సాయంకాలం’; పునరావృత దినాంత సూత్రానికి తగిన గౌరవప్రదమైన సాధారణ పదం.
- source_word: וַיְהִי
  choice: అయింది
  rationale: హీబ్రూ సూత్రంలోని పునరుక్తిని, లయను నిలుపుటకు మొదటి క్రియకు వాడిన రూపాన్నే మళ్లీ ఉపయోగించాం.
- source_word: בֹּקֶר
  choice: ఉదయం
  rationale: ‘ఉదయం’ అనేది ‘morning’ భావానికి నేరమైన, సహజమైన ఆధునిక తెలుగు పదం; ‘తెల్లవారుజాము’ వంటి మరింత నిర్దిష్ట భావాన్ని అనవసరంగా చేర్చదు.
- source_word: יוֹם רְבִיעִי
  choice: నాలుగవ రోజు
  rationale: హీబ్రూ పదబంధం దినాన్ని క్రమసంఖ్యతో గుర్తిస్తుంది. తెలుగు భాషలో ‘నాలుగవ రోజు’ సహజంగా ఉండి మూలంలోని నిర్దిష్ట ఉపపదం లేని నిర్మాణాన్ని కూడా అతిగా విస్తరించదు.
theological_decisions:
- issue: సృష్టి దినాల కాలవ్యవధి లేదా స్వభావంపై ఒక నిర్దిష్ట వ్యాఖ్యానాన్ని అనువాదంలో చేర్చకుండా దినాంత సూత్రాన్ని అందించడం
  choice: సాయంకాలం అయింది, ఉదయం అయింది—నాలుగవ రోజు.
  alternative: సాయంకాలం అయింది, ఉదయం అయింది—ఒక నాలుగవ రోజు.
  rationale: మూలంలోని సాయంకాలం–ఉదయం సూత్రాన్ని సూటిగా నిలుపుతూ, సృష్టి దినాల కాలవ్యవధిపై ఉన్న విస్తృత వ్యాఖ్యాన వివాదాన్ని పరిష్కరించేందుకు అనువాదం ప్రయత్నించదు. ‘నాలుగవ రోజు’ సహజ తెలుగు ప్రయోగం; ‘ఒక నాలుగవ రోజు’ మూల నిర్మాణాన్ని మరింత రూపపరంగా చూపినా తెలుగులో అసహజంగా ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. హీబ్రూ పునరావృత సూత్రపు లయను రెండు సార్లు ‘అయింది’ అని ఉంచి పరిరక్షించాం; విరామరేఖ దినపు క్రమసంఖ్యను స్పష్టంగా గుర్తిస్తుంది.
