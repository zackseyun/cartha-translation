id: GEN.1.18
reference: Genesis 1:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/לִ/מְשֹׁל֙ בַּ/יּ֣וֹם וּ/בַ/לַּ֔יְלָה וּֽ/לֲ/הַבְדִּ֔יל בֵּ֥ין הָ/א֖וֹר וּ/בֵ֣ין הַ/חֹ֑שֶׁךְ וַ/יַּ֥רְא אֱלֹהִ֖ים כִּי טֽוֹב־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/018.yaml
  text: and to rule over the day and over the night[a], and to separate the light from the darkness. And God saw that it was good.
translation:
  language: te
  text: పగలును, రాత్రిని ఏలడానికి, వెలుగును చీకటి నుండి వేరుచేయడానికి[a]. దేవుడు అది మంచిదని చూశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వెలుగుకూ చీకటికీ మధ్య భేదం చేయడానికి.’
    reason: בדל అనే మూలపదం సందర్భానుసారంగా వేరుచేయడం లేదా భేదాన్ని నిర్ధారించడం అనే భావాలను ఇవ్వగలదు.
lexical_decisions:
- source_word: וְ/לִ/מְשֹׁל
  choice: ఏలడానికి
  rationale: మునుపటి వచనంలో పేర్కొన్న జ్యోతుల ఉద్దేశాన్ని తెలిపే ఈ క్రియ, పగలు మరియు రాత్రిపై వాటికి అప్పగించబడిన పాలనా కార్యాన్ని సూచిస్తుంది. ‘ఏలడానికి’ అనే పదం ఆ భావాన్ని సంక్షిప్తంగా, గంభీరంగా నిలుపుతుంది.
- source_word: בַּ/יּוֹם וּ/בַ/לַּיְלָה
  choice: పగలును రాత్రిని
  rationale: హీబ్రూలోని నిర్దిష్టమైన జతను సహజమైన తెలుగు సమాంతర నిర్మాణంలో అందిస్తుంది. ‘ఏలడానికి’ అనే క్రియతో తెలుగులో కర్మవిభక్తి సహజంగా సరిపోతుంది.
- source_word: וּֽ/לֲ/הַבְדִּיל
  choice: వేరుచేయడానికి
  rationale: ఆదికాండము 1లో בדל దేవుడు ఏర్పరచిన విభజన లేదా ప్రత్యేకతను సూచిస్తుంది. ‘వేరుచేయడానికి’ అనే పదం ఆ సృష్టి క్రమాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది; ‘భేదం చూపడానికి’ అనే భావసాధ్యతను పాదసూచికలో ఉంచాం.
- source_word: בֵּין הָ/א֖וֹר וּ/בֵ֣ין הַ/חֹ֑שֶׁךְ
  choice: వెలుగును చీకటి నుండి
  rationale: హీబ్రూ ‘మధ్య ... మధ్య’ నిర్మాణాన్ని తెలుగు వాడుకకు తగిన ‘ఒకదానిని మరొకదాని నుండి వేరుచేయడం’ అనే నిర్మాణంగా మార్చింది; వెలుగు, చీకటి రెండింటి నిర్దిష్ట భావం సందర్భంలో స్పష్టంగా ఉంది.
- source_word: וַ/יַּ֥רְא אֱלֹהִ֖ים
  choice: దేవుడు చూశాడు
  rationale: హీబ్రూ కథన క్రమాన్ని నేరుగా నిలుపుతూ, ఆదికాండము 1లో పునరావృతమయ్యే మూల్యాంకన సూత్రాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: כִּי טֽוֹב
  choice: అది మంచిదని
  rationale: טוב లోని మంచితనం, తగినతనం, సృష్టి క్రమానికి అనుకూలత అనే విస్తృత భావాన్ని ‘మంచిది’ నిలుపుతుంది; దానిని కేవలం ఆహ్లాదకరమైనది లేదా ప్రయోజనకరమైనది అనే పరిమిత అర్థానికి కుదించదు.
theological_decisions:
- issue: సృష్టిలో ఆకాశజ్యోతుల కార్యం
  choice: జ్యోతులు పగలును రాత్రిని ఏలేలా, వెలుగును చీకటి నుండి వేరుచేసేలా నియమించబడ్డాయని వచనం చెబుతుంది; వాటికి దైవత్వం లేదా దేవునికి స్వతంత్రమైన అధికారాన్ని ఆపాదించదు.
  alternative: వ్యక్తీకరణను మరింత బలంగా చేస్తే, జ్యోతులు స్వతంత్ర దైవిక శక్తులుగా ఆధిపత్యం చెలాయిస్తున్నాయనే భావం కలగవచ్చు.
  rationale: మూల హీబ్రూ జ్యోతులకు సృష్టిలో ఒక కార్యాన్ని అప్పగిస్తుంది; చివరి వాక్యంలో దేవుడే దానిని పరిశీలించి మంచిదని నిర్ణయించే సార్వభౌముడిగా ఉంటాడు. ‘ఏలడానికి’ మూలంలోని పాలనా భాషను నిలుపుతుంది, కాని అదనపు పురాణ లేదా సిద్ధాంత భావాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యేలా గంభీరమైన కథన శైలిని ఉపయోగించాం. ‘ఏలడానికి’ మూలంలోని పాలనా భావాన్ని నిలుపుతుండగా, వాక్య నిర్మాణం సంక్షిప్తంగా మరియు సహజంగా ఉంది.
