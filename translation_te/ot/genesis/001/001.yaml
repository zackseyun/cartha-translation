source:
  edition: WLC
  text: בְּ/רֵאשִׁ֖ית בָּרָ֣א אֱלֹהִ֑ים אֵ֥ת הַ/שָּׁמַ֖יִם וְ/אֵ֥ת הָ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/001.yaml
  text: In the beginning, when God created the heavens and the earth[a]—
translation:
  language: te
  text: ఆదిలో దేవుడు ఆకాశాలనూ భూమినీ సృష్టించినప్పుడు[a]—
  philosophy: optimal-equivalence
  footnotes: &id001
  - marker: a
    text: 'సాంప్రదాయంగా దీన్ని పూర్తి వాక్యంగా, “ఆదిలో దేవుడు ఆకాశాలనూ భూమినీ సృష్టించాడు” అని అనువదిస్తారు. హెబ్రీలో నిర్దిష్ట ఉపపదం లేని בְּרֵאשִׁית తరువాత పూర్తి క్రియారూపమైన בָּרָא రావడం వల్ల, ఇది ఆదికాండం 2:4బిలోని నిర్మాణానికి సమాంతరంగా కాలసూచక ఆధార వాక్యభాగంగా మరింత సహజంగా చదవబడుతుంది. ప్రధాన వాక్యం 3వ వచనంలో వస్తుంది: “దేవుడు ‘వెలుగు కలుగాలి’ అన్నాడు.”'
    reason: Preserves the English POB alternative-reading note while using clear modern Telugu grammatical terminology and natural quotation punctuation.
lexical_decisions:
- source_word: בְּרֵאשִׁית
  choice: ఆదిలో, … సృష్టించినప్పుడు
  rationale: నిర్దిష్ట ఉపపదం లేని בְּרֵאשִׁית తరువాత finite verb בָּרָא రావడం వల్ల ఇది కాలాన్ని సూచించే ఆధార వాక్యభాగంగా సహజంగా చదవబడుతుంది. ‘ఆదిలో’ అనే పదం רֵאשִׁית యొక్క భావాన్ని నిలుపుతుండగా, ‘సృష్టించినప్పుడు’ ఆ వాక్యనిర్మాణాన్ని తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: בָּרָא
  choice: సృష్టించినప్పుడు
  rationale: ‘సృష్టించు’ అనేది దేవుని సృష్టికార్యాన్ని సూచించే בָּרָא కు నేరమైన, స్థిరపడిన తెలుగు సమానార్థకం. ‘-ినప్పుడు’ రూపం ఈ వచనాన్ని కాలసూచక ఆధార వాక్యభాగంగా చూపుతుంది; సృష్టి జరిగిన విధానాన్ని అదనంగా నిర్వచించదు.
- source_word: אֱלֹהִים
  choice: దేవుడు
  rationale: אֱלֹהִים రూపరీత్యా బహువచనంలా ఉన్నప్పటికీ, ఇక్కడ ఏకవచన క్రియతో వాడబడింది. కాబట్టి ఏకవచనమైన ‘దేవుడు’ సరైన అనువాదం.
- source_word: אֵת
  choice: '[ప్రత్యేక పదంగా అనువదించలేదు; కర్మను సూచించే వ్యాకరణ చిహ్నం]'
  rationale: אֵת నిర్దిష్ట ప్రత్యక్ష కర్మను గుర్తించే హెబ్రీ వ్యాకరణ చిహ్నం. తెలుగులో దాని పని ‘ఆకాశాలను, భూమిని’ అనే కర్మరూపాల ద్వారా వ్యక్తమవుతుంది.
- source_word: הַשָּׁמַיִם
  choice: ఆకాశాలను
  rationale: హెబ్రీ పదంలోని బహువచన రూపాన్ని నిలుపుతూ, విశ్వవ్యాప్త సందర్భానికి సరిపోయే సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: הָאָרֶץ
  choice: భూమిని
  rationale: ఆకాశాలతో జతగా వచ్చినప్పుడు אָרֶץ ఇక్కడ ఒక ప్రాంతీయ ‘దేశం’ లేదా ‘నేల’ కంటే విశ్వంలోని భూమిని సూచిస్తుంది.
theological_decisions:
- issue: ప్రారంభ వాక్యభాగపు వాక్యనిర్మాణం
  choice: 'కాలసూచక ఆధార వాక్యభాగం: ‘ఆదిలో, దేవుడు ఆకాశాలను, భూమిని సృష్టించినప్పుడు—’'
  alternative: 'స్వతంత్ర పూర్తి వాక్యం: ‘ఆదిలో దేవుడు ఆకాశాలను, భూమిని సృష్టించాడు.’'
  rationale: నిర్దిష్ట ఉపపదం లేని בְּרֵאשִׁית, దాని వెంట వచ్చే בָּרָא, అలాగే ఆదికాండం 2:4బి మరియు హోషేయ 1:2లోని పోలికగల ప్రారంభాలు—ఇవి కాలసూచక ఆధార వాక్యభాగ పఠనానికి మద్దతిస్తాయి. అయినప్పటికీ సంప్రదాయ పూర్తి-వాక్య పఠనం ప్రాచీన అనువాదాలు, మసొరా స్వరఘాతాలు, విస్తృత స్వీకరణలో ఉంది; అందువల్ల దాన్ని పాదసూచికలో ఉంచి నిజమైన వ్యాఖ్యాన భేదాన్ని నిలిపాము.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గంభీరంగా ఉండే పదాలను ఎంచుకున్నాము. ‘ఆకాశాలను’ అనే బహువచనం మూలరూపాన్ని ప్రతిబింబిస్తుంది. చివరి దీర్ఘ విరామచిహ్నం ఈ వచనం తరువాతి వాక్యభాగానికి దారితీస్తుందని సూచిస్తుంది.
