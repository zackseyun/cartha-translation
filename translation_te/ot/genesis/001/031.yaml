id: GEN.1.31
reference: Genesis 1:31
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּ֤רְא אֱלֹהִים֙ אֶת כָּל אֲשֶׁ֣ר עָשָׂ֔ה וְ/הִנֵּה ט֖וֹב מְאֹ֑ד וַֽ/יְהִי עֶ֥רֶב וַֽ/יְהִי בֹ֖קֶר י֥וֹם הַ/שִּׁשִּֽׁי־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/031.yaml
  text: And God saw all that he had made, and behold, it was very good. And there was evening and there was morning, the sixth day.
translation:
  language: te
  text: దేవుడు తాను చేసినదంతా చూశాడు; ఇదిగో, అది చాలా మంచిదిగా ఉంది. సాయంకాలం అయింది, ఉదయం అయింది—ఆరవ రోజు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּרְא
  choice: చూశాడు
  rationale: ראה అనే క్రియ యొక్క కథన రూపానికి సహజమైన తెలుగు సమానం ‘చూశాడు.’ సందర్భంలో పరిశీలించి అంచనా వేసిన భావం ఉన్నప్పటికీ, మూలంలోని సరళతను ఇది కాపాడుతుంది.
- source_word: אֱלֹהִים
  choice: దేవుడు
  rationale: రూపంలో బహువచనంగా ఉన్నా, ఆదికాండము 1లో ఇది ఏకవచన క్రియతో వచ్చి సృష్టికర్తయైన ఒక్క దేవుణ్ణి సూచిస్తుంది.
- source_word: כָּל אֲשֶׁר עָשָׂה
  choice: తాను చేసినదంతా
  rationale: సృష్టించబడిన సమస్తాన్ని సమగ్రంగా సూచిస్తుంది. ‘తాను’ కర్తను స్పష్టం చేస్తూ, తెలుగు భాషలో సహజంగా ఉంటుంది.
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: హిన్నే అనే అవధానార్థక పదం పాఠకుని దృష్టిని ఫలితంపై నిలిపి, వాక్యానికి సజీవతను ఇస్తుంది; ‘ఇదిగో’ ఆ వాక్చాతుర్య బలాన్ని నిలుపుతుంది.
- source_word: טוֹב מְאֹד
  choice: ఎంతో మంచిగా
  rationale: טוֹב యొక్క విస్తృతమైన ‘మంచి’ భావాన్ని, מְאֹד యొక్క తీవ్రతను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; నైతిక, సౌందర్య లేదా కార్యసంబంధ అర్థాలలో ఒక్కదానికే పరిమితం చేయదు.
- source_word: וַיְהִי עֶרֶב וַיְהִי בֹקֶר
  choice: సాయంకాలం అయింది, ఉదయం అయింది
  rationale: ఆదికాండము 1లో పునరావృతమయ్యే దినాంత సూత్రాన్ని సంక్షిప్తంగా, సహజంగా, క్రమాన్ని నిలుపుతూ అందిస్తుంది.
- source_word: יוֹם הַשִּׁשִּׁי
  choice: ఆరవ రోజు
  rationale: నామవాచకంతో కూడిన నిర్దిష్ట క్రమసంఖ్యకు సహజమైన తెలుగు రూపం; హెబ్రీలోని నిర్దిష్టత సందర్భంలో స్పష్టంగా ఉంటుంది.
theological_decisions:
- issue: טוֹב מְאֹדలో సృష్టి మంచితనం యొక్క స్వభావం
  choice: ఎంతో మంచిగా
  alternative: అత్యంత శ్రేష్ఠంగా
  rationale: మూలపాఠంలోని విస్తృతమైన మంచితన నిర్ధారణను నిలుపుతూ, దానిని ప్రత్యేకంగా నైతికమైనది, సౌందర్యాత్మకమైనది లేదా కార్యసిద్ధికి సంబంధించినదిగా కుదించదు.
- issue: సృష్టి దినాలపై వివాదాలను ముందే నిర్ణయించకుండా దిన సూత్రాన్ని అనువదించడం
  choice: సాయంకాలం అయింది, ఉదయం అయింది—ఆరవ రోజు
  alternative: సాయంకాలం, ఉదయం కలిగాయి; ఇది ఆరవ రోజు
  rationale: హెబ్రీ సూత్రంలోని క్రమాన్ని దగ్గరగా అనుసరిస్తూ, ‘దినం’ యొక్క వ్యవధి లేదా సాహిత్యపరమైన విధి గురించి అదనపు వ్యాఖ్యానాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యే సహజమైన, గౌరవప్రదమైన శైలి. ‘ఇదిగో’ ద్వారా మూలంలోని అవధానార్థక బలం నిలుపబడింది; ఎటువంటి పాదసూచికలు అవసరం లేదు.
