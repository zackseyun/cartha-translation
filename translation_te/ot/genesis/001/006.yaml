reference: Genesis 1:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֱלֹהִ֔ים יְהִ֥י רָקִ֖יעַ בְּ/ת֣וֹךְ הַ/מָּ֑יִם וִ/יהִ֣י מַבְדִּ֔יל בֵּ֥ין מַ֖יִם לָ/מָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/006.yaml
  text: And God said[a], “Let there be an expanse in the midst of the waters[b], and let it separate water from water.”
translation:
  language: te
  text: 'దేవుడు ఇలా అన్నాడు: “జలాల మధ్యలో ఒక విస్తారం[a] కలుగుగాక; అది జలాలను జలాల నుండి వేరుచేయుగాక[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘వితానం,’ ‘గుమ్మటం,’ లేదా ‘దృఢమైన ఆకాశవితానం’ అని కూడా అనువదించవచ్చు. హీబ్రూ רָקִיעַ అనే పదం విస్తరింపబడిన లేదా పరచబడిన దానిని సూచిస్తుంది; ప్రాచీన విశ్వరూప చిత్రణను ఎంత స్పష్టంగా ప్రతిబింబించాలనే దానిని బట్టి అనువాదాలు మారుతాయి.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “జలాలకూ జలాలకూ మధ్య విభజించేదిగా ఉండుగాక”; అంటే, ఒక జలసముదాయాన్ని మరొక జలసముదాయం నుండి వేరుచేయడం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... అన్నాడు
  rationale: వావ్-క్రమరూపం కథనాన్ని ముందుకు నడిపిస్తుంది. ‘అప్పుడు’ సహజమైన తెలుగు కథన ప్రవాహాన్ని ఇస్తుంది; కాలక్రమాన్ని అవసరానికి మించి నిర్దిష్టం చేయదు.
- source_word: אֱלֹהִים
  choice: దేవుడు
  rationale: రూపరీత్యా బహువచనమైనప్పటికీ ఇక్కడ ఏకవచన క్రియతో వచ్చి ఏకైక సృష్టికర్తను సూచిస్తుంది; ‘దేవుడు’ ప్రామాణిక తెలుగు రూపం.
- source_word: יְהִי
  choice: కలుగుగాక
  rationale: היה ధాతువు యొక్క జస్సివ్ రూపం దైవ ఆజ్ఞను వ్యక్తం చేస్తుంది. ‘కలుగుగాక’ ఆ సృష్ట్యాజ్ఞ బలాన్ని గౌరవప్రదమైన, సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: רָקִיעַ
  choice: విస్తారం
  rationale: ఈ పదం విస్తరింపబడిన లేదా పరచబడిన దానిని సూచిస్తుంది. ‘విస్తారం’ ప్రధాన పాఠ్యంలో నిర్దిష్ట ప్రాచీన విశ్వరూప నమూనాను బలవంతంగా చేర్చకుండా మూలపదంలోని విస్తరించిన భావాన్ని నిలుపుతుంది.
- source_word: בְּתוֹךְ
  choice: మధ్యలో
  rationale: జలాల నడుమ ఉన్న స్థానాన్ని స్పష్టంగా, ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: הַמָּיִם
  choice: జలాలు
  rationale: మూలంలోని రూపరీత్యా బహువచనమైన מַיִם ఆదిమ జలసముదాయాన్ని సూచిస్తుంది. ‘జలాలు’ దాని చిత్రణను, బహువచన రూపాన్ని నిలుపుతుంది.
- source_word: וִיהִי מַבְדִּיל
  choice: అది ... వేరుచేయుగాక
  rationale: ముందున్న జస్సివ్ భావం ఇక్కడ కొనసాగుతుంది; ‘అది’ అనే సర్వనామం విస్తారమే కర్త అని తెలుగులో స్పష్టం చేస్తుంది. ‘వేరుచేయుగాక’ హిఫిల్ రూపంలోని విభజన కలిగించే భావాన్ని అందిస్తుంది.
- source_word: בֵּין מַיִם לָמָיִם
  choice: జలాలను జలాల నుండి
  rationale: ‘జలాలకూ జలాలకూ మధ్య’ అనే మూల నిర్మాణాన్ని, ‘వేరుచేయు’ క్రియతో సహజమైన తెలుగు వాక్యనిర్మాణంలో వ్యక్తం చేస్తుంది; రెండు జలసముదాయాల మధ్య భేదాన్ని సూచిస్తుంది.
theological_decisions:
- issue: ప్రాచీన విశ్వరూప చిత్రణకు సంబంధించి רָקִיעַ అనువాదం
  choice: విస్తారం
  alternative: వితానం; గుమ్మటం; దృఢమైన ఆకాశవితానం
  rationale: వచనం జలాల మధ్య విభజన కలిగించే దానిని దేవుడు సృష్టించడాన్ని వర్ణిస్తుంది. ‘విస్తారం’ పరచబడిన దాని గురించిన హీబ్రూ చిత్రాన్ని నిలుపుతూనే, ప్రధాన పాఠ్యంలో ఒక నిర్దిష్ట విశ్వరూప పునర్నిర్మాణాన్ని నిర్ణయించదు. మరింత స్పష్టమైన భౌతిక రూపాన్ని సూచించే అనువాదాలు సాధ్యమైనందున వాటిని పాదటిప్పణిలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి ఉపయోగించబడింది. ‘కలుగుగాక,’ ‘వేరుచేయుగాక’ రూపాలు దైవ ఆజ్ఞ యొక్క గంభీరతను నిలుపుతాయి; ‘విస్తారం’ ఉద్దేశపూర్వకంగా నిర్దిష్ట విశ్వరూప వ్యాఖ్యానాన్ని ఖరారు చేయదు.
