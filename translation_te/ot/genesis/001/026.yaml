id: GEN.1.26
reference: Genesis 1:26
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֱלֹהִ֔ים נַֽעֲשֶׂ֥ה אָדָ֛ם בְּ/צַלְמֵ֖/נוּ כִּ/דְמוּתֵ֑/נוּ וְ/יִרְדּוּ֩ בִ/דְגַ֨ת הַ/יָּ֜ם וּ/בְ/ע֣וֹף הַ/שָּׁמַ֗יִם וּ/בַ/בְּהֵמָה֙ וּ/בְ/כָל הָ/אָ֔רֶץ וּ/בְ/כָל הָ/רֶ֖מֶשׂ הָֽ/רֹמֵ֥שׂ עַל הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/026.yaml
  text: Then God said[a], “Let us make man in our image, according to our likeness[d][c][b], and let them rule over the fish of the sea and over the birds of the heavens and over the livestock and over all the earth and over every creeping thing that creeps on the earth.”
translation:
  language: te
  text: అప్పుడు దేవుడు, “మన స్వరూపంలో, మన పోలిక ప్రకారం మనిషిని[a] చేద్దాం[b]. వారు సముద్రపు చేపల మీద, ఆకాశ పక్షుల[d] మీద, పశువుల మీద, భూమి అంతటి మీద, భూమిమీద పాకే ప్రతి ప్రాణి మీద ఏలాలి[c]” అని అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘మానవజాతిని,’ ‘మానవాళిని.’ హీబ్రూ אָדָם (ఆదామ్) ఇక్కడ సమష్టిని సూచించే ఏకవచనం—మానవులను ఒక జాతిగా ఏకవచనంలో పేర్కొంటుంది. అందుకే తరువాత ‘వారు ... ఏలాలి’ అని బహువచనం వస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘చేద్దాం,’ ‘మన స్వరూపం,’ ‘మన పోలిక’ అనే బహువచన రూపాలు హీబ్రూలో ఉన్నట్లే నిలుపబడ్డాయి. వీటిని దైవీయ స్వాలోచనగా, పరలోక సభను ఉద్దేశించిన మాటగా, లేదా క్రైస్తవ సంపూర్ణ లేఖన పఠనంలో తరువాత వెల్లడైన త్రిత్వ సత్యానికి అనుగుణమైన సూచనగా వివిధ రీతుల్లో అర్థం చేసుకుంటారు.
    reason: alternative_reading
  - marker: c
    text: లేదా ‘అధికారం చెలాయించాలి.’
    reason: lexical_alternative
  - marker: d
    text: అక్షరార్థంగా ‘ఆకాశాల పక్షులు’; ఈ సందర్భంలో ‘ఆకాశ పక్షులు’ సహజమైన తెలుగు ప్రయోగం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... అన్నాడు
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది. ‘అప్పుడు’ సంఘటనల క్రమాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: אֱלֹהִים
  choice: దేవుడు
  rationale: ఈ సందర్భంలో క్రియ ఏకవచనంలో ఉంది; కాబట్టి ఏకైక దేవుణ్ణి సూచించే సాధారణ తెలుగు రూపం తగినది.
- source_word: נַעֲשֶׂה
  choice: చేద్దాం
  rationale: మొదటి పురుష బహువచన సంకల్పార్థక రూపాన్ని సహజంగా నిలుపుతుంది; బహువచనానికి గల వేదాంతార్థాన్ని అనువాదంలో ముందుగానే నిర్ణయించదు.
- source_word: אָדָם
  choice: మనిషి
  rationale: ఇక్కడ ఈ పదం మానవజాతిని ఒక సమష్టిగా సూచించే ఏకవచనం. ‘మనిషి’ ప్రతినిధిక ఏకవచనాన్ని నిలుపుతుంది; తరువాతి ‘వారు’ దాని సమష్టి భావాన్ని స్పష్టం చేస్తుంది.
- source_word: בְּצַלְמֵנוּ
  choice: మన స్వరూపంలో
  rationale: צֶלֶם రూపం, ప్రతిరూపం లేదా ప్రాతినిధ్యాన్ని సూచిస్తుంది. ‘స్వరూపంలో’ అనే రూపం בְּ ఉపసర్గను, మూలపాఠంలోని భావాన్ని అతిగా వివరించకుండా నిలుపుతుంది.
- source_word: כִּדְמוּתֵנוּ
  choice: మన పోలిక ప్రకారం
  rationale: כְּ + דְּמוּת correspondence లేదా నమూనా భావాన్ని ఇస్తుంది. ఇది ‘స్వరూపం’ మరియు ‘పోలిక’ అనే రెండు పదాల మధ్య ఉన్న భేదాన్ని చెరపదు.
- source_word: וְיִרְדּוּ
  choice: వారు ... ఏలాలి
  rationale: మూడవ పురుష బహువచన జస్సివ్ భావాన్ని నిలుపుతుంది. ‘ఏలాలి’ పాలనాధికారాన్ని సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בִדְגַת הַיָּם
  choice: సముద్రపు చేపల మీద
  rationale: హీబ్రూ సమాస నిర్మాణాన్ని సహజమైన తెలుగు సంబంధరూపంలో అందిస్తుంది.
- source_word: וּבְעוֹף הַשָּׁמַיִם
  choice: ఆకాశ పక్షుల మీద
  rationale: עוֹף ఎగిరే జీవులను, ఈ సందర్భంలో పక్షులను సూచిస్తుంది; שָׁמַיִם ఇక్కడ సహజంగా ‘ఆకాశం’ అని అనువదించబడింది.
- source_word: וּבַבְּהֵמָה
  choice: పశువుల మీద
  rationale: בְּהֵמָה ఇక్కడ ప్రధానంగా పెంపుడు భూజంతువుల వర్గాన్ని సూచిస్తుంది. ‘పశువులు’ ఆధునిక తెలుగులో సంక్షిప్తంగా, సహజంగా ఉంది.
- source_word: וּבְכָל הָאָרֶץ
  choice: భూమి అంతటిమీద
  rationale: ఆదికాండము 1లో אֶרֶץ స్థానిక భూభాగం కంటే మొత్తం భూమిని సూచిస్తుంది; ఈ పదబంధం ఆ విశ్వవ్యాప్త పరిధిని నిలుపుతుంది.
- source_word: וּבְכָל הָרֶמֶשׂ
  choice: పాకే ప్రతి జీవి మీద
  rationale: רֶמֶשׂ నేలకు దగ్గరగా కదిలే చిన్న జీవులను సూచిస్తుంది. తరువాత వచ్చే רֹמֵשׂతో ఉన్న పదపునరుక్తి భావాన్ని ‘పాకే’ ద్వారా సహజంగా ప్రతిబింబిస్తుంది.
theological_decisions:
- issue: ‘చేద్దాం ... మన స్వరూపం ... మన పోలిక’లోని బహువచన వాక్కు
  choice: ఎవరిని ఉద్దేశించి అన్నాడో ప్రధాన పాఠంలో నిర్దేశించకుండా హీబ్రూలోని బహువచనాన్ని యథాతథంగా నిలుపడం.
  alternative: దైవీయ స్వాలోచన; పరలోక సభను ఉద్దేశించిన మాట; లేదా తరువాతి త్రిత్వ ప్రకటనకు అనుగుణమైన సూచనగా స్పష్టీకరించడం.
  rationale: మూలపాఠం మొదటి పురుష బహువచన రూపాలను ఉపయోగిస్తుంది; వాటి భావాన్ని అనువాదమే తేల్చకూడదు. అందువల్ల అసలు పాఠంలోని ఉద్దేశపూర్వక ఉద్వేగం, అనిశ్చితి నిలిచాయి.
- issue: సమష్టి భావమున్న אָדָם పదం
  choice: ప్రతినిధిక ఏకవచనంగా ‘మనిషి’ అని అనువదించి, తరువాత ‘వారు’తో సమష్టి భావాన్ని చూపడం.
  alternative: ‘మానవజాతి’ లేదా ‘మానవాళి’ అని నేరుగా అనువదించడం.
  rationale: హీబ్రూలో ఏకవచన పదం నుండి బహువచన క్రియకు మారే నిర్మాణం ఉద్దేశపూర్వకమైనది. ‘మనిషి ... వారు’ ఆ నిర్మాణాన్ని తెలుగులో సాధ్యమైనంతవరకు నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన శైలి వాడబడింది. ‘చేద్దాం’ మరియు ‘వారు ... ఏలాలి’ మూలంలోని వ్యాకరణ మార్పును నిలుపుతాయి. ‘స్వరూపం/పోలిక’ అనే జంట పదాలను కలిపివేయకుండా ఉంచాం; ‘ఏలాలి’ అధికార భావాన్ని సంక్షిప్తంగా తెలియజేస్తుంది.
