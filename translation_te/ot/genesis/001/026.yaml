  to: అప్పుడు దేవుడు, “మన స్వరూపంలో, మన పోలిక ప్రకారం మనిషిని[a] చేద్దాం[b]. వారు సముద్రపు చేపల మీద, ఆకాశ పక్షుల[d] మీద, పశువుల మీద, భూమి అంతటి మీద, భూమిమీద పాకే ప్రతి ప్రాణి మీద ఏలాలి[c]” అని అన్నాడు.
