id: GEN.1.9
reference: Genesis 1:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֱלֹהִ֗ים יִקָּו֨וּ הַ/מַּ֜יִם מִ/תַּ֤חַת הַ/שָּׁמַ֨יִם֙ אֶל מָק֣וֹם אֶחָ֔ד וְ/תֵרָאֶ֖ה הַ/יַּבָּשָׁ֑ה וַֽ/יְהִי כֵֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/009.yaml
  text: And God said[a], “Let the waters under the heavens be gathered into one place, and let the dry land appear.” And it was so.
translation:
  language: te
  text: 'దేవుడు ఇలా అన్నాడు: “ఆకాశం కింద[a] ఉన్న జలాలు ఒకే చోటికి సమకూడాలి; పొడి నేల కనిపించాలి.” అలా జరిగింది.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఆకాశాల కింద.” హీబ్రూ שָׁמַיִם అనే పదం సందర్భాన్ని బట్టి ఆకాశాన్ని లేదా ఆకాశాలను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: దేవుడు ఇలా అన్నాడు
  rationale: వావ్-క్రమ రూపం కథనాన్ని ముందుకు నడిపిస్తుంది. సహజమైన ఆధునిక తెలుగు కథనశైలిలో ‘ఇలా అన్నాడు’ తరువాత వచ్చే ప్రత్యక్ష వాక్యాన్ని స్పష్టంగా పరిచయం చేస్తుంది.
- source_word: אֱלֹהִים
  choice: దేవుడు
  rationale: ఆదికాండము 1లో ఏకవచన క్రియతో వచ్చిన ఈ పదం ఏకైక సృష్టికర్తను సూచిస్తుంది; ‘దేవుడు’ ప్రామాణికమైన తెలుగు సమానార్థకం.
- source_word: יִקָּווּ
  choice: సమకూడాలి
  rationale: ఈ జస్సివ్ రూపం దైవాజ్ఞను వ్యక్తం చేస్తుంది. ‘సమకూడాలి’ జలాలు ఒకచోట చేరే భావాన్నీ, ఆజ్ఞాత్మకతనూ సహజంగా తెలియజేస్తుంది.
- source_word: הַמַּיִם
  choice: జలాలు
  rationale: హీబ్రూలోని బహువచన రూపాన్ని నిలుపుతూ, సృష్టి వృత్తాంతపు గంభీర శైలికి సరిపడేలా ‘జలాలు’ ఎంచుకోబడింది.
- source_word: מִתַּחַת הַשָּׁמַיִם
  choice: ఆకాశాల కింద ఉన్న
  rationale: స్థానాన్ని సూచించే ఈ పదబంధంలో שָׁמַיִם పదానికి ఉన్న బహువచన/విస్తృత ‘heavens’ భావాన్ని ‘ఆకాశాలు’ ద్వారా నిలిపాము; ‘ఉన్న’ తెలుగులో జలాల స్థానాన్ని సహజంగా అనుసంధానిస్తుంది.
- source_word: אֶל מָקוֹם אֶחָד
  choice: ఒకే చోటికి
  rationale: אֶל సూచించే దిశను ‘చోటికి’ తెలియజేస్తుంది; אֶחָד లోని ఏకత్వాన్ని ‘ఒకే’ స్పష్టంగా నిలుపుతుంది.
- source_word: וְתֵרָאֶה
  choice: కనిపించాలి
  rationale: నిఫాల్ జస్సివ్‌ను సహజమైన తెలుగు ఆజ్ఞార్థక రూపంలో ఇచ్చి, కప్పబడి ఉన్న నేల దృశ్యమవ్వడాన్ని సూచిస్తుంది.
- source_word: הַיַּבָּשָׁה
  choice: పొడి నేల
  rationale: సమకూడిన జలాలకు భిన్నంగా బయటపడే ఎండిన భూభాగాన్ని ఆధునిక పాఠకులకు స్పష్టంగా తెలియజేస్తుంది.
- source_word: וַיְהִי כֵן
  choice: అలాగే జరిగింది
  rationale: దేవుని ఆజ్ఞ నెరవేరిందని తెలిపే పునరావృత సూత్రవాక్యాన్ని సహజమైన, సంక్షిప్తమైన తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: సృష్టి వృత్తాంతంలో שָׁמַיִם అనే విశ్వనిర్మాణ సంబంధ పదం
  choice: ఆకాశాలు
  alternative: ఆకాశం
  rationale: హీబ్రూ పదం సందర్భానుసారం ‘ఆకాశం’ లేదా ‘ఆకాశాలు/పరలోకాలు’ అని సూచించగలదు. ఇక్కడ మూలపాఠపు విస్తృత, గంభీర పదప్రయోగాన్ని ‘ఆకాశాలు’ నిలుపుతుంది; నిర్దిష్టమైన విశ్వనిర్మాణ సిద్ధాంతాన్ని అనువాదంలో చేర్చకుండా ప్రత్యామ్నాయాన్ని పాదసూచికలో చూపించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా చదవదగినప్పటికీ సృష్టి వృత్తాంతానికి తగిన గంభీరతను నిలిపాం. పాతకాలపు ‘జలములు,’ ‘కనబడవలెను’ వంటి రూపాలను నివారించి, ‘జలాలు,’ ‘కనిపించాలి’ వాడాం. మూలంలోని రెండు సమాంతర దైవాజ్ఞలను అర్ధవిరామంతో అనుసంధానించాం.
