source:
  edition: WLC
  text: וַ/יִּתֵּ֥ן אֹתָ֛/ם אֱלֹהִ֖ים בִּ/רְקִ֣יעַ הַ/שָּׁמָ֑יִם לְ/הָאִ֖יר עַל הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/017.yaml
  text: And God set them in the expanse of the heavens to give light on the earth[a].
translation:
  language: te
  text: దేవుడు వాటిని ఆకాశపు విస్తారంలో భూమిమీద వెలుగు ఇవ్వడానికి ఉంచాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆకాశపు గగనమండలంలో.’
    reason: రָקִיעַకు సంప్రదాయంగా వాడే ‘గగనమండలం’ అనే పదార్థ ప్రత్యామ్నాయాన్ని సూచిస్తుంది.
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: ఉంచాడు
  rationale: נתן అనే క్రియకు ప్రాథమికంగా ‘ఇవ్వడం/పెట్టడం’ అనే అర్థం ఉంది. ఇక్కడ జ్యోతులను నిర్దిష్ట స్థానంలో అమర్చడాన్ని సహజమైన ఆధునిక తెలుగులో ‘ఉంచాడు’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: אֹתָם
  choice: వాటిని
  rationale: మునుపటి వచనంలో చెప్పబడిన జ్యోతులను సూచించే ప్రత్యక్ష కర్మ సర్వనామం; తెలుగులో జడవస్తువులకు ‘వాటిని’ సహజం.
- source_word: אֱלֹהִים
  choice: దేవుడు
  rationale: ఆదికాండము 1లో ఈ బహువచన రూప నామవాచకం ఏకవచన క్రియార్థంతో ఏకైక సృష్టికర్తను సూచిస్తుంది; ప్రామాణిక తెలుగు రూపం ‘దేవుడు’.
- source_word: בִּרְקִיעַ הַשָּׁמַיִם
  choice: ఆకాశ విస్తారంలో
  rationale: רָקִיעַ విస్తరించబడిన విశాల ప్రదేశాన్ని సూచిస్తుంది; ‘ఆకాశ విస్తారం’ పురాతన ‘గగనమండలం’ కంటే ఆధునిక పాఠకులకు పారదర్శకంగా ఉండి, నిర్దిష్ట శాస్త్రీయ లేదా కఠిన గుమ్మట భావనను రుద్దదు.
- source_word: לְהָאִיר
  choice: వెలుగు ఇవ్వడానికి
  rationale: אור యొక్క హిఫిల్ క్రియారూపం కారణార్థకమైనది—కేవలం ప్రకాశించడం కాక వెలుగు కలిగించడం లేదా ఇవ్వడం. ‘వెలుగు ఇవ్వడానికి’ ఆ కార్యాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: עַל הָאָרֶץ
  choice: భూమికి
  rationale: ఇక్కడ עַל వెలుగు చేరే లక్ష్యాన్ని సూచిస్తుంది. తెలుగులో ‘భూమికి వెలుగు ఇవ్వడం’ సహజంగా ఉండి, భూమిమీద వెలుగు ప్రసరించడమే భావమని స్పష్టం చేస్తుంది.
theological_decisions:
- issue: సృష్టి వర్ణనలోని רָקִיעַ అనే విశ్వనిర్మాణ పదం
  choice: ఆకాశ విస్తారం
  alternative: ఆకాశ గగనమండలం; ఆకాశ గుమ్మటం
  rationale: ఈ ఎంపిక మూలపదంలోని విశాలంగా విస్తరించిన ప్రదేశం అనే భావాన్ని నిలుపుతూ, ఇటు పురాతన కఠిన గుమ్మట నమూనాన్నీ అటు ఆధునిక శాస్త్రీయ వివరణనూ పాఠ్యంలోకి రుద్దదు. ప్రత్యామ్నాయ సంప్రదాయ అర్థాన్ని పాదటిప్పణిలో ఉంచి మూలంలోని భావపరిధిని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన సృష్టి వర్ణన శైలిని ఉపయోగించాం. హీబ్రూ వాక్యక్రమాన్ని యాంత్రికంగా అనుసరించకుండా, ఉద్దేశాన్ని తెలిపే పదబంధాన్ని సహజ తెలుగు క్రమంలో ఉంచాం; భావసంబంధం మరియు మూలంలోని సంక్షిప్తత నిలిపాం.
