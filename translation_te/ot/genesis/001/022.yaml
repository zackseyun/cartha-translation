id: GEN.1.22
reference: Genesis 1:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְבָ֧רֶךְ אֹתָ֛/ם אֱלֹהִ֖ים לֵ/אמֹ֑ר פְּר֣וּ וּ/רְב֗וּ וּ/מִלְא֤וּ אֶת הַ/מַּ֨יִם֙ בַּ/יַּמִּ֔ים וְ/הָ/ע֖וֹף יִ֥רֶב בָּ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/022.yaml
  text: And God blessed them[a], saying, “Be fruitful and multiply, and fill the waters in the seas, and let the birds multiply on the earth.”
translation:
  language: te
  text: 'దేవుడు వాటిని ఆశీర్వదించి ఇలా అన్నాడు: “మీరు ఫలించి విస్తరించండి; సముద్రాల్లోని జలాలను నింపండి. పక్షులు[a] భూమిమీద విస్తరించుగాక.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఎగిరే జీవులు’; హెబ్రీ עוֹף అనే పదం పక్షులకంటే విస్తృతంగా ఎగిరే జీవులను సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבָרֶךְ
  choice: ఆశీర్వదించి
  rationale: పియేల్ రూపం దేవుడు ఆశీర్వాదాన్ని అనుగ్రహించడాన్ని సూచిస్తుంది. ‘ఆశీర్వదించి’ అనేది దైవిక క్రియను సహజంగా, సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: אֹתָם
  choice: వాటిని
  rationale: ఈ సర్వనామం ముందటి వచనంలోని సముద్ర జీవులను, ఎగిరే జీవులను సూచిస్తుంది. మానవేతర బహువచనానికి ‘వాటిని’ సహజమైన తెలుగు రూపం.
- source_word: אֱלֹהִים
  choice: దేవుడు
  rationale: ఆదికాండము 1లో ఏకవచన క్రియతో వచ్చిన ఈ పదం ఏకైక సృష్టికర్తను సూచిస్తుంది; ‘దేవుడు’ ప్రామాణిక తెలుగు అనువాదం.
- source_word: לֵאמֹר
  choice: ఇలా అన్నాడు
  rationale: ప్రత్యక్ష సంభాషణను పరిచయం చేసే హెబ్రీ నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: פְּרוּ
  choice: ఫలించి
  rationale: ప్రజనన ఫలసంపదను సూచించే హెబ్రీ నుడికారాన్ని ‘ఫలించి’ నిలుపుతుంది; దానిని కేవలం సంఖ్యాపరమైన పెరుగుదలగా కుదించదు.
- source_word: וּרְבוּ
  choice: విస్తరించండి
  rationale: సంఖ్యాపరంగా అధికమవడాన్ని సందర్భానుకూలంగా తెలియజేస్తుంది; ‘ఫలించి’తో సహజంగా జతపడుతుంది.
- source_word: וּמִלְאוּ
  choice: నింపండి
  rationale: מלא అనే క్రియ యొక్క ప్రత్యక్ష అర్థాన్ని అదనపు తీవ్రత చేర్చకుండా ఇస్తుంది.
- source_word: אֶת־הַמַּיִם בַּיַּמִּים
  choice: సముద్రాల్లోని జలాలను
  rationale: מַיִם, יַמִּים పదాల బహువచన భావాన్ని, వాటి పరస్పర సంబంధాన్ని తెలుగులో స్పష్టంగా మరియు గంభీరంగా వ్యక్తపరుస్తుంది.
- source_word: וְהָעוֹף
  choice: పక్షులు
  rationale: עוֹף విస్తృతంగా ఎగిరే జీవులను సూచించగలిగినా, ఈ సందర్భంలో ‘పక్షులు’ సహజమైన ప్రధాన పాఠం. విస్తృత అర్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: יִרֶב
  choice: విస్తరించుగాక
  rationale: హెబ్రీ జస్సివ్ రూపంలోని సంకల్పాత్మక ఆశీర్వాద-ఆజ్ఞ భావాన్ని కేవలం భవిష్యద్వాక్యంగా మార్చకుండా నిలుపుతుంది.
- source_word: בָּאָרֶץ
  choice: భూమిమీద
  rationale: పక్షులు విస్తరించే భౌమ పరిధిని ప్రత్యక్షంగా, సహజంగా సూచిస్తుంది.
theological_decisions:
- issue: ఆశీర్వాదంలో పలికిన మాటల స్వభావం
  choice: ఆజ్ఞారూప క్రియలను, చివరి జస్సివ్‌ను ఆశీర్వాదంలో వ్యక్తమైన దైవిక సంకల్పం మరియు ఆజ్ఞ కలిసిన రూపంగా అనువదించడం
  alternative: అన్ని క్రియలనూ నేరుగా ఆజ్ఞలుగా ఇవ్వడం; లేదా చివరి భాగాన్ని ‘పక్షులు విస్తరిస్తాయి’ అనే సాధారణ భవిష్యద్వాక్యంగా ఇవ్వడం
  rationale: హెబ్రీ పాఠం దేవుని ఆశీర్వాదాన్ని ప్రత్యక్ష వాక్కులో ఆజ్ఞారూపాలు మరియు జస్సివ్ ద్వారా వ్యక్తపరుస్తుంది. ‘విస్తరించండి’ మరియు ‘విస్తరించుగాక’ అనే రూపాలు ఆ ఆశీర్వాద-ఆజ్ఞ ఉద్రిక్తతను పరిష్కరించకుండా నిలుపుతాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ సృష్టి వృత్తాంతానికి తగిన గౌరవభరిత శైలిని పాటించాం. ‘ఫలించి విస్తరించండి’ అనే జంట మూలంలోని భావసామ్యాన్ని నిలుపుతుంది; ‘విస్తరించుగాక’ జస్సివ్ స్వరాన్ని గంభీరంగా వ్యక్తపరుస్తుంది.
