source:
  edition: WLC
  text: וַ/יַּ֣עַשׂ אֱלֹהִים֮ אֶת הָ/רָקִיעַ֒ וַ/יַּבְדֵּ֗ל בֵּ֤ין הַ/מַּ֨יִם֙ אֲשֶׁר֙ מִ/תַּ֣חַת לָ/רָקִ֔יעַ וּ/בֵ֣ין הַ/מַּ֔יִם אֲשֶׁ֖ר מֵ/עַ֣ל לָ/רָקִ֑יעַ וַֽ/יְהִי כֵֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/007.yaml
  text: So God made the expanse and separated the waters that were under the expanse from the waters that were above the expanse[a]. And it was so.
translation:
  language: te
  text: అప్పుడు దేవుడు విస్తారాన్ని[a] చేసి, విస్తారం కిందనున్న జలాలను విస్తారం పైనున్న జలాల నుండి వేరుచేశాడు. అది అలాగే జరిగింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆకాశమండలం’ (సంప్రదాయ ప్రయోగం); ‘గుమ్మటం’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: చేశాడు
  rationale: עשה అనే క్రియకు సాధారణ అర్థం ‘చేయడం/తయారుచేయడం.’ ఈ సృష్టి సందర్భంలో ‘చేశాడు’ సహజంగా, నేరుగా ఉంది; మూలంలో లేని ప్రత్యేక రూపకల్పన భావాన్ని జోడించదు.
- source_word: אֱלֹהִים
  choice: దేవుడు
  rationale: ఆదికాండము 1లో ఏకవచన క్రియతో వచ్చిన אֱלֹהִים ఏకైక సృష్టికర్తయైన దేవుణ్ణి సూచిస్తుంది.
- source_word: הָרָקִיעַ
  choice: విస్తారం
  rationale: רָקִיעַ విస్తరింపబడినదాన్ని లేదా వ్యాపించిన ప్రదేశాన్ని సూచిస్తుంది. ‘విస్తారం’ మూలంలోని స్థల సంబంధ భావాన్ని కాపాడుతూ, నిర్దిష్టమైన ప్రాచీన విశ్వనిర్మాణ ఆకారాన్ని బలవంతంగా నిర్ధారించదు.
- source_word: וַיַּבְדֵּל
  choice: వేరుచేశాడు
  rationale: בדל అంటే వేరుచేయడం లేదా విభజించడం. ‘వేరుచేశాడు’ ఆదికాండము 1లోని క్రమబద్ధీకరణ భావానికి సరిపోతుంది.
- source_word: בֵּין ... וּבֵין
  choice: '... నుండి ... వేరుచేశాడు'
  rationale: హీబ్రూ నిర్మాణం రెండు సమూహాల మధ్య భేదాన్ని సూచిస్తుంది. తెలుగులో ‘ఒకదాన్ని మరొకదాని నుండి వేరుచేశాడు’ సహజమైన సమానార్థక నిర్మాణం.
- source_word: הַמַּיִם
  choice: జలాలు
  rationale: מים రూపరీత్యా బహువచనమైనప్పటికీ ద్రవ్యనామంలా కూడా పనిచేస్తుంది. ‘జలాలు’ హీబ్రూ రూపాన్నీ ఈ భాగపు గంభీర సాహిత్య శైలినీ ప్రతిబింబిస్తుంది.
- source_word: אֲשֶׁר מִתַּחַת לָרָקִיעַ
  choice: విస్తారం కింద ఉన్న
  rationale: מִתַּחַת ‘కింద/అడుగున’ అనే నిలువు స్థల సంబంధాన్ని తెలియజేస్తుంది; ‘పైన’ అనే తరువాతి పదబంధానికి స్పష్టమైన వ్యతిరేక జతగా ఉంటుంది.
- source_word: אֲשֶׁר מֵעַל לָרָקִיעַ
  choice: విస్తారం పైన ఉన్న
  rationale: מֵעַל ‘పైన/పైభాగంలో’ అనే అర్థాన్ని ఇస్తుంది; ‘కింద’తో ఉన్న మూలంలోని స్థల వ్యత్యాసాన్ని కాపాడుతుంది.
- source_word: וַיְהִי כֵן
  choice: అది అలాగే జరిగింది
  rationale: ఇది దేవుని ఆజ్ఞ నెరవేరినట్లు తెలిపే ఆదికాండము 1లోని పునరావృత సూత్రవాక్యం. ఈ తెలుగు రూపం అర్థాన్ని సహజంగా కాపాడుతుంది.
theological_decisions:
- issue: సృష్టి సందర్భంలో רָקִיעַ పదానికి విశ్వనిర్మాణ సంబంధ సూచనలు
  choice: విస్తారం
  alternative: ఆకాశమండలం; గుమ్మటం
  rationale: ‘విస్తారం’ అనే పదం విస్తరించబడినదనే హీబ్రూ చిత్రాన్ని నిలుపుతుంది. ‘ఆకాశమండలం’ సంప్రదాయబద్ధమైనదైనా మరింత నిర్దిష్టంగా వినిపించవచ్చు; ‘గుమ్మటం’ ఒక ప్రత్యేక ఆకారాన్ని నిర్ణయిస్తుంది. మూలపాఠం చెప్పినదానికంటే ఎక్కువగా ప్రాచీన విశ్వనిర్మాణాన్ని నిర్ధారించకుండా ఉండేందుకు ‘విస్తారం’ ఎంచుకోబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘జలాలు’ అనే పదం సాధారణ ‘నీళ్లు’ కంటే మూలంలోని బహువచన రూపాన్నీ సృష్టివర్ణన గంభీరతనూ మెరుగ్గా నిలుపుతుంది. పాదసూచిక గుర్తు సంబంధిత ‘విస్తారం’ వాక్యభాగం ముగింపులో ఉంచబడింది.
