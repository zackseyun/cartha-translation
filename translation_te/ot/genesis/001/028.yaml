id: GEN.1.28
reference: Genesis 1:28
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְבָ֣רֶךְ אֹתָ/ם֮ אֱלֹהִים֒ וַ/יֹּ֨אמֶר לָ/הֶ֜ם אֱלֹהִ֗ים פְּר֥וּ וּ/רְב֛וּ וּ/מִלְא֥וּ אֶת הָ/אָ֖רֶץ וְ/כִבְשֻׁ֑/הָ וּ/רְד֞וּ בִּ/דְגַ֤ת הַ/יָּם֙ וּ/בְ/ע֣וֹף הַ/שָּׁמַ֔יִם וּ/בְ/כָל חַיָּ֖ה הָֽ/רֹמֶ֥שֶׂת עַל הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/028.yaml
  text: And God blessed them[a], and God said to them, “Be fruitful, and multiply, and fill the earth, and subdue it, and rule over the fish of the sea, and over the birds of the heavens[b], and over every living thing that moves on the earth.”
translation:
  language: te
  text: 'దేవుడు వారిని ఆశీర్వదించాడు. దేవుడు వారితో ఇలా అన్నాడు: “మీరు ఫలించి విస్తరించండి; భూమిని నింపి, దానిని లోబరచుకోండి. సముద్రంలోని చేపల మీద, ఆకాశంలోని పక్షుల మీద, భూమిపై కదిలే[a] ప్రతి జీవి మీద ఏలండి[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ప్రాకే’.
    reason: הָרֹמֶשֶׂת అనే పదం నేలపై కదలడం లేదా ప్రాకడం అనే భావాలను కలిగి ఉండగలదు.
  - marker: b
    text: లేదా ‘అధికారం చెలాయించండి’.
    reason: רדה పాలించడం, ఆధిపత్యం లేదా అధికారం చెలాయించడం అనే భావాన్ని సూచిస్తుంది.
lexical_decisions:
- source_word: וַיְבָרֶךְ
  choice: ఆశీర్వదించాడు
  rationale: పియేల్ రూపం ఆశీర్వాదాన్ని వాస్తవంగా అనుగ్రహించడాన్ని సూచిస్తుంది; ఆధునిక తెలుగు బైబిలు భాషలో ఇది సహజమైన, గౌరవప్రదమైన సమానార్థకం.
- source_word: אֱלֹהִים
  choice: దేవుడు
  rationale: బహువచన రూపం ఉన్నప్పటికీ ఏకవచన క్రియలతో ఇక్కడ ఇశ్రాయేలు యొక్క ఏకైక దేవుణ్ణి సూచిస్తుంది.
- source_word: פְּרוּ
  choice: ఫలించండి
  rationale: సంతానోత్పత్తి, ఫలవృద్ధి అనే ఆజ్ఞార్థ భావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: וּרְבוּ
  choice: విస్తరించండి
  rationale: సంఖ్యలో అధికమవడం అనే భావాన్ని ‘ఫలించండి’తో సహజమైన జంటగా వ్యక్తం చేస్తుంది.
- source_word: וּמִלְאוּ
  choice: నింపండి
  rationale: מלא యొక్క ప్రత్యక్ష అర్థమైన నింపడం అనే భావాన్ని యథాతథంగా ఇస్తుంది.
- source_word: הָאָרֶץ
  choice: భూమి
  rationale: ఆదికాండము 1లోని సార్వత్రిక సృష్టి సందర్భంలో ఇది ఒక నిర్దిష్ట ప్రాంతం లేదా దేశం కాక మొత్తం భూమిని సూచిస్తుంది.
- source_word: וְכִבְשֻׁהָ
  choice: దానిని లోబరచుకోండి
  rationale: כבש లోని అదుపులోకి తెచ్చే బలమైన భావాన్ని మెత్తబరచకుండా, దోపిడీ భావాన్ని అదనంగా చేర్చకుండా వ్యక్తం చేస్తుంది.
- source_word: וּרְדוּ
  choice: ఏలండి
  rationale: רדה సూచించే పాలన లేదా అధికారం చెలాయించే భావాన్ని సహజమైన, సంక్షిప్తమైన తెలుగులో నిలుపుతుంది.
- source_word: בִּדְגַת הַיָּם
  choice: సముద్రంలోని చేపలు
  rationale: సముద్ర జీవులన్నిటిగా విస్తరించకుండా, హెబ్రీ పదబంధం ప్రత్యేకంగా సూచించే చేపలను అనువదిస్తుంది.
- source_word: בְעוֹף הַשָּׁמַיִם
  choice: ఆకాశంలోని పక్షులు
  rationale: עוֹף విస్తృతంగా ఎగిరే జీవులను సూచించగలిగినా, ఈ సందర్భంలో ‘పక్షులు’ సహజమైన అర్థం; שָׁמַיִם కు ఇక్కడ ‘ఆకాశం’ సులభంగా అర్థమయ్యే తెలుగు రూపం.
- source_word: בְכָל חַיָּה
  choice: ప్రతి జీవి
  rationale: חַיָּה ను అడవి మృగాలకు మాత్రమే పరిమితం చేయకుండా దాని విస్తృత జీవి/జంతువు భావాన్ని నిలుపుతుంది.
- source_word: הָרֹמֶשֶׂת
  choice: కదిలే
  rationale: నేలపై సంచరించే జీవులను సూచించే విస్తృత భావాన్ని నిలుపుతుంది; ‘ప్రాకే’ అనేది సాధ్యమైనా కొంత సంకుచితంగా వినిపించవచ్చు.
theological_decisions:
- issue: כבש మరియు רדהలో మానవులకు సృష్టిపై ఇచ్చిన అధికారపు బలం
  choice: ‘లోబరచుకోండి’, ‘ఏలండి’ అనే బలమైన పాలనా భాషను నిలుపడం
  alternative: ‘దానిని సంరక్షించండి’, ‘దానికి నిర్వాహకులుగా ఉండండి’ లేదా ‘దానిపై అధికారం చెలాయించండి’
  rationale: మూల హెబ్రీ క్రియలు కేవలం సంరక్షణకన్నా బలమైనవి. అనువాదం వాటి బలాన్ని నిలుపుతూ, దోపిడీకి అనుమతి అనే భావాన్నిగానీ కేవలం పర్యావరణ పరిరక్షణ అనే వ్యాఖ్యానాన్నిగానీ చేర్చదు.
- issue: הָאָרֶץ యొక్క పరిధి
  choice: ‘భూమి’
  alternative: ‘దేశం’ లేదా ‘నేల’
  rationale: ఆదికాండము 1లోని విశ్వవ్యాప్త సృష్టి సందర్భం కారణంగా ఇది స్థానిక భూభాగం కాక మొత్తం భూమిని సూచిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన శైలి వాడబడింది. హెబ్రీలో ‘దేవుడు’ అనే కర్త పునరుక్తిని నిలుపుతూ రెండు వాక్యాలుగా సహజీకరించబడింది; వరుస ఆజ్ఞలను స్పష్టంగా చూపేందుకు విరామచిహ్నాలు ఉపయోగించబడ్డాయి.
