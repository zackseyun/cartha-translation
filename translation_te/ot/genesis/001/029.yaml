id: GEN.1.29
reference: Genesis 1:29
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֱלֹהִ֗ים הִנֵּה֩ נָתַ֨תִּי לָ/כֶ֜ם אֶת כָּל עֵ֣שֶׂב זֹרֵ֣עַ זֶ֗רַע אֲשֶׁר֙ עַל פְּנֵ֣י כָל הָ/אָ֔רֶץ וְ/אֶת כָּל הָ/עֵ֛ץ אֲשֶׁר בּ֥/וֹ פְרִי עֵ֖ץ זֹרֵ֣עַ זָ֑רַע לָ/כֶ֥ם יִֽהְיֶ֖ה לְ/אָכְלָֽה־־׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/029.yaml
  text: And God said[a], “Behold, I have given you every seed-bearing plant that is on the face of all the earth, and every tree in which is the fruit of a tree bearing seed[c][b]. It will be for you as food.”
translation:
  language: te
  text: 'దేవుడు ఇలా అన్నాడు: “ఇదిగో, భూమియంతటిమీద ఉన్న విత్తనాలిచ్చే ప్రతి మొక్కను, విత్తనాలిచ్చే ఫలమున్న ప్రతి చెట్టును మీకు ఇచ్చాను. అవి మీకు ఆహారంగా ఉంటాయి.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: ఇదిగో
  rationale: తరువాత చెప్పబోయే విషయంపై దృష్టి నిలిపే హీబ్రూ అవ్యయ బలాన్ని సహజమైన, గౌరవప్రదమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: נָתַתִּי
  choice: మీకు ఇచ్చాను
  rationale: పూర్తయిన కార్యానికి ప్రస్తుతం కొనసాగుతున్న ప్రాముఖ్యతను సూచించే హీబ్రూ పరిపూర్ణ క్రియను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: כָּל עֵשֶׂב זֹרֵעַ זֶרַע
  choice: విత్తనాలు పుట్టించే ప్రతి మొక్క
  rationale: עֵשֶׂב అనే విస్తృత వృక్షజాల పదాన్ని ‘మొక్క’గా, זֹרֵעַ זֶרַעను స్పష్టమైన క్రియాత్మక పదబంధంగా అందిస్తుంది.
- source_word: אֲשֶׁר עַל פְּנֵי כָל הָאָרֶץ
  choice: భూమి అంతటి ఉపరితలంపై ఉన్న
  rationale: ‘భూమి ముఖంపై’ అనే హీబ్రూ స్థలరూపకాన్ని తెలుగులో సహజంగా ఉండే ‘ఉపరితలంపై’తో వ్యక్తం చేస్తూ, సమస్త భూమి అనే విస్తృతిని నిలుపుతుంది.
- source_word: כָּל הָעֵץ
  choice: ప్రతి చెట్టు
  rationale: హీబ్రూలోని כָּל + ఏకవచన రూపానికి ఉన్న విభాజక భావాన్ని తెలుగులో ‘ప్రతి’తో స్పష్టంగా తెలియజేస్తుంది.
- source_word: אֲשֶׁר בּוֹ פְרִי עֵץ זֹרֵעַ זָרַע
  choice: విత్తనాలు పుట్టించే పండ్లు గల ప్రతి చెట్టు
  rationale: చెట్టులో విత్తనోత్పాదక ఫలం ఉందనే మూలభావాన్ని, హీబ్రూ పదక్రమాన్ని యాంత్రికంగా అనుకరించకుండా సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: לָכֶם יִהְיֶה לְאָכְלָה
  choice: అవి మీకు ఆహారంగా ఉంటాయి
  rationale: మొక్కలు, చెట్లు అనే సమిష్టి పూర్వపదాలను తెలుగులో సహజమైన బహువచనంతో తిరిగి సూచిస్తూ, ఆహారంగా ఇవ్వబడిన ప్రయోజనాన్ని స్పష్టంగా చెబుతుంది.
theological_decisions:
- issue: ఆహారంగా ఇవ్వబడిన వృక్షజాలాన్ని సూచించే చివరి క్రియలో ఏకవచనమా, బహువచనమా
  choice: అవి మీకు ఆహారంగా ఉంటాయి
  alternative: అది మీకు ఆహారంగా ఉంటుంది
  rationale: హీబ్రూ క్రియ ఏకవచనంలో ఉన్నప్పటికీ ముందున్న రెండు సమిష్టి వర్గాలను ఆధునిక తెలుగులో బహువచనంగా సూచించడం సహజం; ఇది వాక్యార్థానికి కొత్త సిద్ధాంతపరమైన భావాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు స్పష్టమైన శైలి. ‘ఇదిగో’ ద్వారా మూలంలోని దృష్టి ఆకర్షణ నిలుపబడింది; మిగతా నిర్మాణం మూలార్థానికి దగ్గరగా ఉంటూనే తెలుగు వాక్యప్రవాహానికి అనుగుణంగా సవరించబడింది.
