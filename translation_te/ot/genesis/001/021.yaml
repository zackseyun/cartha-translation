source:
  edition: WLC
  text: וַ/יִּבְרָ֣א אֱלֹהִ֔ים אֶת הַ/תַּנִּינִ֖ם הַ/גְּדֹלִ֑ים וְ/אֵ֣ת כָּל נֶ֣פֶשׁ הַֽ/חַיָּ֣ה הָֽ/רֹמֶ֡שֶׂת אֲשֶׁר֩ שָׁרְצ֨וּ הַ/מַּ֜יִם לְ/מִֽינֵ/הֶ֗ם וְ/אֵ֨ת כָּל ע֤וֹף כָּנָף֙ לְ/מִינֵ֔/הוּ וַ/יַּ֥רְא אֱלֹהִ֖ים כִּי טֽוֹב־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/021.yaml
  text: So God created the great sea creatures[a], and every living creature that moves, with which the waters swarmed, according to their kinds, and every winged bird according to its kind. And God saw that it was good.
translation:
  language: te
  text: దేవుడు మహా సముద్ర జీవులను[a], జలాలు సమృద్ధిగా నిండివున్న ప్రతి కదిలే సజీవ ప్రాణిని వాటి జాతుల ప్రకారం, అలాగే రెక్కలుగల ప్రతి పక్షిని దాని జాతి ప్రకారం సృష్టించాడు. దేవుడు అది మంచిదని చూశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “మహా సముద్ర రాక్షసులను,” లేదా “మహా నాగాలను.” హెబ్రీ పదమైన తన్నీనీమ్ పెద్ద పాము వంటి లేదా భీకరమైన జీవులను సూచించగలదు; ఇక్కడ జలసంబంధ సందర్భం “సముద్ర జీవులు” అనే అనువాదానికి మద్దతిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבְרָא
  choice: సృష్టించాడు
  rationale: ברא అనే ప్రత్యేక సృష్టి క్రియను, ఆదికాండము 1లోని ఉన్నతమైన శైలిని నిలుపుతూ సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: אֱלֹהִים
  choice: దేవుడు
  rationale: బహువచన రూపంలో ఉన్నా ఇక్కడ ఏకవచన క్రియతో వచ్చి ఒకే దేవుణ్ణి సూచిస్తుంది.
- source_word: הַתַּנִּינִם הַגְּדֹלִים
  choice: మహా సముద్ర జీవులు
  rationale: תנינים పెద్ద పాము వంటి లేదా భీకరమైన జీవులను సూచించగలదు; ఇక్కడ జలసంబంధ సందర్భంలో ఈ పదబంధం స్పష్టంగా, అతిశయమైన పురాణ భావాన్ని రుద్దకుండా ఉంటుంది.
- source_word: כָּל נֶפֶשׁ הַחַיָּה
  choice: ప్రతి ప్రాణి
  rationale: ఇక్కడ נפש חיה వేదాంతపరమైన ‘ఆత్మ’ అనే భావంకంటే సజీవ ప్రాణిని సూచిస్తుంది.
- source_word: הָרֹמֶשֶׂת
  choice: కదిలే
  rationale: רמש యొక్క విస్తృత కదలిక భావాన్ని నిలుపుతుంది; కేవలం నేలపై పాకడానికే అర్థాన్ని పరిమితం చేయదు.
- source_word: אֲשֶׁר שָׁרְצוּ הַמַּיִם
  choice: జలాలు సమృద్ధిగా పుట్టించిన
  rationale: שרץ సూచించే విస్తారమైన సమూహోత్పత్తి భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: לְמִינֵהֶם
  choice: వాటి వాటి జాతుల ప్రకారం
  rationale: బహువచన పూర్వపదానికి తగినట్లు సృష్టిలోని వర్గీకరణ భావాన్ని తెలియజేస్తుంది.
- source_word: כָּל עוֹף כָּנָף
  choice: రెక్కలుగల ప్రతి పక్షి
  rationale: עוף అనే ఎగిరే జీవి/పక్షి వర్గాన్నీ כנף అనే రెక్కల నిర్దేశాన్నీ స్పష్టంగా నిలుపుతుంది.
- source_word: לְמִינֵהוּ
  choice: దాని జాతి ప్రకారం
  rationale: సమూహార్థక ఏకవచనమైన ‘ప్రతి పక్షి’కి హెబ్రీ ఏకవచన ప్రత్యయాన్ని అనుసరిస్తుంది.
- source_word: וַיַּרְא אֱלֹהִים כִּי טוֹב
  choice: అది మంచిదని దేవుడు చూశాడు
  rationale: ఆదికాండము 1లో పునరావృతమయ్యే మూలభాషా మూల్యాంకన సూత్రాన్ని సంక్షిప్తంగా, సహజంగా నిలుపుతుంది.
theological_decisions:
- issue: సృష్టి సందర్భంలో సాధ్యమైన పురాణ సంబంధాలు కలిగిన תַּנִּינִם పదం అనువాదం
  choice: మహా సముద్ర జీవులు
  alternative: మహా సముద్ర రాక్షసులు; మహా నాగాలు
  rationale: తక్షణ సందర్భం జలజీవుల సృష్టిని వివరిస్తుంది. ప్రధాన పాఠంలో పురాణార్థాన్ని అవసరానికి మించి రుద్దకుండా, హెబ్రీ పదంలోని భీకరమైన లేదా పాము వంటి పెద్ద జీవుల సంభావ్యతను పాదటిప్పణిలో నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం. మూలంలోని వర్గీకరణ, సమృద్ధి, దైవ మూల్యాంకన భావాలు నిలుపబడ్డాయి.
