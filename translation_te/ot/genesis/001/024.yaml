id: GEN.1.24
reference: Genesis 1:24
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֱלֹהִ֗ים תּוֹצֵ֨א הָ/אָ֜רֶץ נֶ֤פֶשׁ חַיָּה֙ לְ/מִינָ֔/הּ בְּהֵמָ֥ה וָ/רֶ֛מֶשׂ וְ/חַֽיְתוֹ אֶ֖רֶץ לְ/מִינָ֑/הּ וַֽ/יְהִי כֵֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/024.yaml
  text: 'And God said[a], “Let the earth bring forth living creatures according to their kinds: livestock, creeping things, and wild animals of the earth according to their kinds.” And it was so.'
translation:
  language: te
  text: 'అప్పుడు దేవుడు, “భూమి వాటి వాటి జాతుల ప్రకారం ప్రాణమున్న జీవులను పుట్టించుగాక: పశువులను, నేలపై పాకే జీవులను, వాటి వాటి జాతుల ప్రకారం అడవి జంతువులను” అని అన్నాడు. అలా జరిగింది.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תּוֹצֵא
  choice: పుట్టించుగాక
  rationale: ఇది יצא ధాతువు యొక్క హిఫీల్ ఆజ్ఞార్థక రూపం; భూమి జీవులను బయటికి తీసుకురావాలని దేవుడు ఆజ్ఞాపిస్తున్న కారణార్థక భావాన్ని ఈ ప్రయోగం నిలుపుతుంది.
- source_word: הָאָרֶץ
  choice: భూమి
  rationale: సృష్టి సందర్భంలో ఇది భూలోక పరిధిని సూచిస్తుంది; ‘భూమి’ సహజమైనదీ, విస్తృత భావాన్ని నిలుపుకునేదీ.
- source_word: נֶפֶשׁ חַיָּה
  choice: సజీవ ప్రాణులను
  rationale: ఈ పదబంధం సాధారణంగా ప్రాణమున్న జీవులను సూచిస్తుంది. తరువాత వచ్చే అనేక జంతు వర్గాలకు అనుగుణంగా తెలుగులో బహువచనం వాడబడింది; ‘ఆత్మలు’ వంటి సిద్ధాంతభారం గల పదాన్ని నివారించింది.
- source_word: לְמִינָהּ
  choice: వాటి వాటి జాతుల ప్రకారం
  rationale: హీబ్రూలో వ్యాకరణపరంగా ఏకవచన రూపమున్నా, ఇక్కడ సమూహాలకు పంపిణీ భావం ఉంది; తెలుగు ప్రయోగం ఆ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בְּהֵמָה
  choice: పశువులను
  rationale: ఇది ముఖ్యంగా మచ్చికైన లేదా పెంపుడు పెద్ద భూజంతువుల వర్గాన్ని సూచిస్తుంది; ‘పశువులు’ ఆధునిక తెలుగులో స్పష్టంగా ఉంటుంది.
- source_word: רֶמֶשׂ
  choice: నేలపై పాకే జీవులను
  rationale: నేలమీద కదిలే చిన్న జీవుల విస్తృత వర్గాన్ని సూచించేలా అనవసరంగా నిర్దిష్ట జాతులను పేర్కొనకుండా అనువదించబడింది.
- source_word: חַיְתוֹ אֶרֶץ
  choice: అడవి జంతువులను
  rationale: పశువుల వర్గానికి భిన్నంగా మచ్చిక కాని భూజంతువులను సూచించే సందర్భార్థాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: וַיְהִי כֵן
  choice: అలా జరిగింది
  rationale: ఆజ్ఞ నెరవేరినట్లు తెలిపే ఆదికాండం 1లోని స్థిర సూత్రాన్ని సంక్షిప్తంగా, సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: נֶפֶשׁ అనే పదాన్ని సిద్ధాంతభారం గల పదంతో అనువదించాలా
  choice: సజీవ ప్రాణులను
  alternative: జీవాత్మలను
  rationale: ఈ సందర్భంలో హీబ్రూ పదబంధం జంతువుల ప్రాణస్వరూపాన్ని సాధారణంగా సూచిస్తుంది; వాటి అధిభౌతిక నిర్మాణంపై ప్రత్యేక సిద్ధాంత ప్రకటన చేయదు. అందువల్ల ‘జీవాత్మలు’ కలిగించగల తరువాతి కాలపు సిద్ధాంతార్థాన్ని పాఠ్యంలోకి చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజతతో పాటు సృష్టి వాక్యానికి తగిన గంభీరతను నిలుపుకుంది. దేవుని ఆజ్ఞను ‘పుట్టించుగాక’ అనే గౌరవప్రదమైన ఆజ్ఞార్థక రూపంతో తెలిపింది; జంతు వర్గాలను సాధారణ పాఠకులకు స్పష్టంగా ఉండే పదాలతో పేర్కొంది.
