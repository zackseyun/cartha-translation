revisions:
- from: జీవశ్వాస[a] ఉన్న సమస్త శరీరులలోనుండి రెండేసి చొప్పున అవి నోవహు దగ్గరికి ఓడలోకి వచ్చాయి.
  to: జీవశ్వాస ఉన్న సమస్త ప్రాణులలోనుండి అవి రెండేసి చొప్పున నోవహు దగ్గరకు, ఓడలోనికి వచ్చాయి.
  rationale: The revision replaces an unnatural literalism for ‘all flesh’ with a standard Telugu expression for living creatures, improves clause order, and retains the source sequence of movement to Noah and into the ark. It preserves “జీవశ్వాస” and its lexical alternative without imposing a theological interpretation.
