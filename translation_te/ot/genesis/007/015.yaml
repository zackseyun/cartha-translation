id: GEN.7.15
reference: Genesis 7:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּבֹ֥אוּ אֶל נֹ֖חַ אֶל הַ/תֵּבָ֑ה שְׁנַ֤יִם שְׁנַ֨יִם֙ מִ/כָּל הַ/בָּשָׂ֔ר אֲשֶׁר בּ֖/וֹ ר֥וּחַ חַיִּֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/015.yaml
  text: They came to Noah into the ark[a], two by two from all flesh in which was the breath of life.
translation:
  language: te
  text: జీవశ్వాస ఉన్న సమస్త ప్రాణులలోనుండి అవి రెండేసి చొప్పున నోవహు దగ్గరకు, ఓడలోనికి వచ్చాయి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: అవి వచ్చాయి
  rationale: בוא అనే క్రియ ఇక్కడ కథనంలోని గతకాల గమనాన్ని సూచిస్తుంది. సందర్భం జంతువులను ఉద్దేశిస్తున్నందున తెలుగులో సహజంగా ఉండేందుకు కర్తను ‘అవి’ అని స్పష్టంచేశాం.
- source_word: אֶל נֹחַ
  choice: నోవహు దగ్గరికి
  rationale: אֶל ఒక వ్యక్తివైపు లేదా అతని సమీపానికి జరిగే గమనాన్ని సూచిస్తుంది. ‘నోవహు దగ్గరికి’ ఈ సంబంధాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: אֶל הַתֵּבָה
  choice: ఓడలోకి
  rationale: אֶל సాధారణంగా ‘వైపుకు/దగ్గరికి’ అని అర్థమిచ్చినా, ఈ సందర్భంలో గమ్యస్థానం ఓడ లోపల కావడంతో ‘ఓడలోకి’ అనేది సందర్భోచితమైన సమానార్థకం.
- source_word: שְׁנַיִם שְׁנַיִם
  choice: రెండేసి చొప్పున
  rationale: సంఖ్యను పునరుక్తి చేయడం పంపిణీ భావాన్ని, అంటే ప్రతి జాతి నుంచి జంటగా రావడాన్ని సూచిస్తుంది. తెలుగులో ‘రెండేసి చొప్పున’ అదే భావాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: מִכָּל הַבָּשָׂר
  choice: సమస్త శరీరులలోనుండి
  rationale: בָּשָׂר అక్షరార్థంగా ‘శరీరం/మాంసం’; జలప్రళయ కథనంలో ఇది ప్రాణమున్న జీవులన్నిటినీ విస్తృతంగా సూచిస్తుంది. ‘సమస్త శరీరులు’ మూలపద చిత్రాన్ని, కథనంలోని పునరావృత పదబంధాన్ని కాపాడుతుంది.
- source_word: אֲשֶׁר בּוֹ
  choice: ఉన్న
  rationale: ‘దానిలో ఉన్న’ అనే హెబ్రీ నిర్మాణాన్ని తెలుగులో సంబంధవాచకంగా సహజంగా కలిపేందుకు ‘ఉన్న’ అని అనువదించాం.
- source_word: רוּחַ חַיִּים
  choice: జీవశ్వాస
  rationale: רוּחַ అనే పదానికి శ్వాస, గాలి, ఆత్మ అనే అర్థాలు ఉండవచ్చు. జీవుల ప్రాణస్థితిని వర్ణించే ఈ సందర్భంలో ‘జీవశ్వాస’ ప్రధాన భావాన్ని సహజంగా తెలియజేస్తుంది; ‘జీవాత్మ’ అనే సాధ్యమైన అర్థాన్ని పాదసూచికలో ఉంచాం.
theological_decisions:
- issue: רוּחַ חַיִּים అనే పదబంధంలో רוּחַ అర్థం
  choice: జీవశ్వాస
  alternative: జీవాత్మ
  rationale: ఇక్కడ జంతువులలో ఉన్న ప్రాణాన్ని వర్ణిస్తున్నందున ‘శ్వాస’ సందర్భానికి బాగా సరిపోతుంది. అయితే רוּחַ లోని ‘ఆత్మ’ భావసాధ్యతను పూర్తిగా తొలగించకుండా పాదసూచికలో నిలిపాం; దీనివల్ల నిర్దిష్ట మానవశాస్త్రీయ లేదా మతశాఖాపరమైన సిద్ధాంతాన్ని వాక్యంలోకి రుద్దడం జరగదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన కథనశైలిని వాడాం. ‘సమస్త శరీరులు’ అనే కొంత శాస్త్రగ్రంథీయ పదబంధాన్ని בָּשָׂר యొక్క మూలచిత్రం మరియు ఆదికాండంలోని ఇతివృత్త సంబంధం నిలిచేలా ఉద్దేశపూర్వకంగా ఉంచాం.
