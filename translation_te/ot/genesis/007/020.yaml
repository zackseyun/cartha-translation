  yaml_path: translation/ot/genesis/007/020.yaml
  text: The waters rose fifteen cubits higher, and the mountains were covered.
translation:
  language: te
  text: నీళ్లు పదిహేను మూరల మేర పైకి[a] పెరిగాయి; పర్వతాలు కప్పబడ్డాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పదిహేను మూరలు ఎత్తుగా.” ఈ కొలత ఎక్కడి నుంచి లెక్కించబడిందో హీబ్రూ వాక్యం స్పష్టంగా చెప్పదు.
    reason: מִלְמַעְלָה అనే పదబంధంలోని దిశ/ఎత్తు భావాన్నీ, కొలతకు సంబంధించిన నిజమైన అస్పష్టతనూ తెలియజేయడం.
lexical_decisions:
- source_word: אַמָּה
  choice: మూర
  rationale: ప్రాచీన ‘క్యూబిట్’ కొలతను తెలుగులో సాంప్రదాయంగా, సాధారణ పాఠకులకు అర్థమయ్యేలా ‘మూర’ అని అనువదించాం.
- source_word: גָּבְרוּ
  choice: పెరిగాయి
  rationale: మూలపదానికి ‘బలపడడం/పైచేయి సాధించడం’ అనే ప్రాథమిక భావం ఉన్నా, నీళ్ల సందర్భంలో అవి మట్టం పెరిగాయని సహజంగా తెలియజేయడానికి ‘పెరిగాయి’ అనేది తగిన ఎంపిక.
- source_word: מִלְמַעְלָה
  choice: పైకి
  rationale: దిశ లేదా పైస్థాయి అనే భావాన్ని నిలుపుతూ, పర్వత శిఖరాలకు పైనే పదిహేను మూరలు అని మూలంలో స్పష్టంగా లేని సంబంధాన్ని ప్రధాన వాక్యంలో చేర్చలేదు.
- source_word: וַיְכֻסּוּ
  choice: కప్పబడ్డాయి
  rationale: హీబ్రూ నిష్క్రియ రూపాన్ని నిలుపుతూ పర్వతాలు నీళ్లచేత కప్పబడినట్లు తెలిపాం.
theological_decisions:
- issue: పదిహేను మూరల కొలత ఏ స్థానం నుంచి లెక్కించబడిందన్నది
  choice: ‘పదిహేను మూరల మేర పైకి’ అని అనువదించి సంబంధాన్ని తెరిచి ఉంచడం
  alternative: ‘పర్వత శిఖరాలకు పదిహేను మూరల ఎత్తున’
  rationale: మూల వాక్యం నీళ్లు పైకి పదిహేను మూరలు పెరిగాయని చెబుతుంది; ఆ కొలత పర్వత శిఖరాల నుంచే అని వ్యాకరణపరంగా నిర్బంధంగా స్పష్టం చేయదు. అందువల్ల వివరణాత్మక నిర్ణయాన్ని పాఠ్యంలోకి దిగుమతి చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడాం. ‘మూర’ అనే సాంప్రదాయ బైబిలు కొలతపదాన్ని ఉంచి, అరుదైన ‘ప్రబలాయి’ వంటి పదానికి బదులుగా సందర్భానుకూలమైన ‘పెరిగాయి’ ఎంచుకున్నాం.
