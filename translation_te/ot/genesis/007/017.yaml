  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథన శైలి. హెబ్రీ వాక్యంలోని చర్యల క్రమాన్ని నిలుపుతూ, తెలుగు సహజత్వం కోసం రెండవ భాగాన్ని స్వతంత్ర వాక్యంగా ఇచ్చాం.
