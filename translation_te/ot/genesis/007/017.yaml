  text: וַֽ/יְהִ֧י הַ/מַּבּ֛וּל אַרְבָּעִ֥ים י֖וֹם עַל הָ/אָ֑רֶץ וַ/יִּרְבּ֣וּ הַ/מַּ֗יִם וַ/יִּשְׂאוּ֙ אֶת הַ/תֵּבָ֔ה וַ/תָּ֖רָם מֵ/עַ֥ל הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/017.yaml
  text: And the flood was on the earth forty days[a], and the waters increased and lifted up the ark, so that it rose above the earth.
translation:
  language: te
  text: జలప్రళయం భూమిమీద నలభై రోజులు కొనసాగింది[a]. నీళ్లు పెరిగి ఓడను పైకి లేపాయి; అప్పుడు అది నేలకు పైగా లేచింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “జలప్రళయం భూమిమీద నలభై రోజులు ఉంది.” హెబ్రీ మాటను మరింత రూపానుసారంగా ఇలా అనువదించవచ్చు; “కొనసాగింది” అనే అనువాదం కాలవ్యవధిని తెలుగులో మరింత సహజంగా తెలియజేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: కొనసాగింది
  rationale: కాలవ్యవధిని సూచించే ‘నలభై రోజులు’ అనే మాటతో కలిసి, జలప్రళయం ఆ కాలమంతా కొనసాగిందనే సహజమైన తెలుగు భావాన్ని ఇస్తుంది; హెబ్రీలోని ‘ఉండింది’ అనే మరింత రూపానుసారమైన అర్థాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: הַמַּבּוּל
  choice: జలప్రళయం
  rationale: నోవహు కాలంలోని ప్రత్యేక మహాప్రళయాన్ని సూచించే, తెలుగులో స్థిరపడిన స్పష్టమైన పదం.
- source_word: אַרְבָּעִים יוֹם
  choice: నలభై రోజులు
  rationale: హెబ్రీ కాలవ్యవధి పదబంధానికి నేరమైన అనువాదం; ‘కొనసాగింది’ అనే క్రియ ద్వారా వ్యవధి స్పష్టమవుతుంది.
- source_word: עַל הָאָרֶץ
  choice: భూమిమీద
  rationale: ప్రళయ సందర్భంలో אֶרֶץ అనే పదానికి ఇక్కడ ‘భూమి’ సహజమైన విస్తృతార్థం; עַל ను ‘మీద’గా తెలిపింది.
- source_word: וַיִּרְבּוּ הַמַּיִם
  choice: నీళ్లు విస్తరించి
  rationale: רבה ఇక్కడ నీటి పరిమాణం లేదా వ్యాప్తి పెరగడాన్ని సూచిస్తుంది; ‘విస్తరించి’ సందర్భానుకూలంగా ఆ పెరుగుదలను తెలియజేస్తుంది.
- source_word: וַיִּשְׂאוּ אֶת הַתֵּבָה
  choice: ఓడను పైకి లేపాయి
  rationale: నీళ్లు ఓడను నేలనుంచి పైకి ఎత్తిన భౌతిక చర్యను స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: הַתֵּבָה
  choice: ఓడ
  rationale: నోవహు నిర్మించిన నౌకను సూచించడానికి సాధారణ ఆధునిక తెలుగు పాఠకులకు సహజమైన సందర్భోచిత పదం.
- source_word: וַתָּרָם
  choice: అది ... తేలింది
  rationale: స్త్రీలింగ ఏకవచన క్రియకు కర్త ఓడే; నీళ్లు దానిని పైకి లేపిన ఫలితంగా అది నేలకు పైగా తేలిందనే సందర్భార్థాన్ని సహజ తెలుగులో అందిస్తుంది.
- source_word: מֵעַל הָאָרֶץ
  choice: నేలకు పైగా
  rationale: ఓడ భూమి ఉపరితలం నుంచి పైకి లేచిన స్థితిని సహజంగా తెలియజేస్తుంది; పునరుక్తిని తగ్గించేందుకు ఇక్కడ ‘భూమి’కి బదులు ‘నేల’ వాడబడింది.
