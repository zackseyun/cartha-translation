id: GEN.7.11
reference: Genesis 7:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: בִּ/שְׁנַ֨ת שֵׁשׁ מֵא֤וֹת שָׁנָה֙ לְ/חַיֵּי נֹ֔חַ בַּ/חֹ֨דֶשׁ֙ הַ/שֵּׁנִ֔י בְּ/שִׁבְעָֽה עָשָׂ֥ר י֖וֹם לַ/חֹ֑דֶשׁ בַּ/יּ֣וֹם הַ/זֶּ֗ה נִבְקְעוּ֙ כָּֽל מַעְיְנֹת֙ תְּה֣וֹם רַבָּ֔ה וַ/אֲרֻבֹּ֥ת הַ/שָּׁמַ֖יִם נִפְתָּֽחוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/011.yaml
  text: In the six hundredth year of Noah’s life[a], in the second month, on the seventeenth day of the month, on that day all the springs of the great deep burst open[b], and the windows of the heavens were opened.
translation:
  language: te
  text: నోవహు జీవితంలోని ఆరువందవ సంవత్సరంలో, రెండవ నెలలో, ఆ నెల పదిహేడవ రోజున—అదే రోజున—మహా అగాధంలోని ఊటలన్నీ బద్దలై తెరుచుకున్నాయి[a]; ఆకాశపు కిటికీలు తెరవబడ్డాయి[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మహా అగాధంలోని జలధారలన్నీ చీలి తెరుచుకున్నాయి.”
    reason: מַעְיָן మరియు בקע పదాలకు సాధ్యమైన మరింత శాబ్దిక ప్రత్యామ్నాయాన్ని సూచిస్తుంది.
  - marker: b
    text: లేదా, “ఆకాశపు వరద ద్వారాలు తెరవబడ్డాయి.”
    reason: אֲרֻבּוֹת అనే పదానికి సందర్భానుసారంగా సాధ్యమైన ‘వరద ద్వారాలు’ అనే ప్రత్యామ్నాయాన్ని సూచిస్తుంది.
lexical_decisions:
- source_word: בִּשְׁנַת שֵׁשׁ מֵאוֹת שָׁנָה לְחַיֵּי נֹחַ
  choice: నోవహు జీవితంలోని ఆరువందలవ సంవత్సరంలో
  rationale: నోవహు జీవితకాలాన్ని ఆధారంగా చేసుకున్న హీబ్రూ కాలసూచనను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בַּחֹדֶשׁ הַשֵּׁנִי בְּשִׁבְעָה עָשָׂר יוֹם לַחֹדֶשׁ
  choice: రెండవ నెల పదిహేడవ రోజున
  rationale: హీబ్రూలో సంఖ్యావాచక రూపంలో ఉన్న తేదీని తెలుగులో సహజమైన క్రమసంఖ్య తేదీగా అందిస్తుంది.
- source_word: בַּיּוֹם הַזֶּה
  choice: అదే రోజున
  rationale: ఇప్పుడే పేర్కొన్న నిర్దిష్ట రోజును నొక్కిచెప్పే కథన సూత్రాన్ని నిలుపుతుంది.
- source_word: נִבְקְעוּ
  choice: బద్దలై తెరుచుకున్నాయి
  rationale: בקע నిఫ్అల్ రూపంలోని చీలిపోవడం లేదా పగిలి తెరుచుకోవడం అనే విపత్కర భావాన్ని స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: כָּל מַעְיְנֹת תְּהוֹם רַבָּה
  choice: మహా అగాధంలోని ఊటలన్నీ
  rationale: מַעְיָן అనే పదానికి సాధారణమైన ‘ఊట’ భావాన్ని, תְּהוֹם רַבָּה అనే ప్రాచీన జలగర్భ చిత్రణను వ్యాఖ్యానంతో మార్చకుండా నిలుపుతుంది.
- source_word: וַאֲרֻבֹּת הַשָּׁמַיִם
  choice: ఆకాశపు కిటికీలు
  rationale: אֲרֻבּוֹת యొక్క ‘కిటికీలు/తెరుచుకునే ద్వారాలు’ అనే రూపకాన్ని కాపాడుతుంది; ‘వరద ద్వారాలు’ కంటే మూల చిత్రణకు దగ్గరగా ఉంటుంది.
- source_word: נִפְתָּחוּ
  choice: తెరవబడ్డాయి
  rationale: నిఫ్అల్ క్రియారూపంలోని కర్మణి భావాన్ని తెలుగులో స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: జలప్రళయానికి సంబంధించిన విశ్వ నిర్మాణ చిత్రణ
  choice: ‘మహా అగాధం,’ ‘ఆకాశపు కిటికీలు’ అనే మూలంలోని చిత్రభాషను యథాతథ భావంతో నిలుపడం
  alternative: ‘భూగర్భ జలాలు ఉప్పొంగాయి,’ ‘ఆకాశం నుంచి కుండపోత కురిసింది’ వంటి ఆధునిక శాస్త్రీయ లేదా వివరణాత్మక భాష
  rationale: వచనం ప్రాచీన విశ్వ చిత్రణ ద్వారా విపత్తు యొక్క విస్తృతిని చూపుతుంది. దానిని ఆధునిక వివరణగా మార్చకుండా ఉండటం మూలంలోని భావతీవ్రతను, ఉద్దేశపూర్వక అస్పష్టతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కథన శైలి ఉపయోగించబడింది. తేదీ సూత్రం సహజమైన తెలుగు క్రమంలో అమర్చబడింది; మూలంలోని సమాంతర కర్మణి ఘటనలు మరియు ప్రాచీన విశ్వ చిత్రణ నిలుపబడ్డాయి. అందించిన ఆంగ్ల సంప్రదింపుపాఠ్యంలో [a] గుర్తు స్థానభ్రంశమైనట్లు కనిపించినందున, దాని విషయానికి సరిపోయేలా ‘ఊటలన్నీ’ తర్వాత ఉంచబడింది.
