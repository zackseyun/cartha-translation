source:
  edition: WLC
  text: שְׁנַ֨יִם שְׁנַ֜יִם בָּ֧אוּ אֶל נֹ֛חַ אֶל הַ/תֵּבָ֖ה זָכָ֣ר וּ/נְקֵבָ֑ה כַּֽ/אֲשֶׁ֛ר צִוָּ֥ה אֱלֹהִ֖ים אֶת נֹֽחַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/009.yaml
  text: Two by two they came to Noah into the ark[a], male and female[b], just as God had commanded Noah.
translation:
  language: te
  text: రెండేసి చొప్పున[a] మగవీ ఆడవీగా అవి నోవహు దగ్గరకు, ఓడలోకి వచ్చాయి; దేవుడు నోవహుకు ఆజ్ఞాపించినట్టే అవి వచ్చాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూలంలో అక్షరార్థంగా ‘రెండు రెండు’; అంటే జతజతలుగా.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁנַיִם שְׁנַיִם
  choice: రెండేసి చొప్పున
  rationale: పునరుక్త సంఖ్య జంతువులు జతలుగా రావడాన్ని సూచిస్తుంది. ‘రెండేసి చొప్పున’ మూలంలోని పంపిణీ భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: בָּאוּ
  choice: వచ్చి … ప్రవేశించాయి
  rationale: בוא సాధారణంగా ‘వచ్చు/వెళ్లు/లోనికి రావు’ అనే గమనాన్ని సూచిస్తుంది. నోవహు వైపు రావడం, ఓడలోకి చేరడం అనే వరుస గమ్యాలను తెలుగులో స్పష్టంగా, సహజంగా వ్యక్తం చేయడానికి సంయుక్త క్రియారూపం వాడబడింది.
- source_word: אֶל נֹחַ
  choice: నోవహు దగ్గరికి
  rationale: אֶל ఇక్కడ నోవహు వైపు గమనాన్ని సూచిస్తుంది. ‘దగ్గరికి’ అనేది అతనిలోకి అనే అసహజ భావం రాకుండా గమ్యాన్ని స్పష్టం చేస్తుంది.
- source_word: אֶל הַתֵּבָה
  choice: ఓడలోకి
  rationale: אֶל యొక్క మూలార్థం ‘వైపు/దగ్గరికి’ అయినప్పటికీ, సందర్భం ఓడలో ప్రవేశించడాన్ని సూచిస్తుంది. అందువల్ల ‘ఓడలోకి’ సందర్భానుకూలమైన సహజ రూపం.
- source_word: זָכָר וּנְקֵבָה
  choice: మగది, ఆడది
  rationale: జంతువుల జతలోని లింగభేదాన్ని తెలుగు వాడుకకు సహజంగా, మూలానికి దగ్గరగా తెలియజేస్తుంది.
- source_word: כַּאֲשֶׁר
  choice: ఆజ్ఞాపించినట్టే
  rationale: దేవుని ముందరి ఆజ్ఞకు ఈ సంఘటన సరిగ్గా అనుగుణంగా జరిగిందనే భావాన్ని ‘అట్టే’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: צִוָּה אֱלֹהִים אֶת נֹחַ
  choice: దేవుడు నోవహుకు ఆజ్ఞాపించినట్టే
  rationale: ఆజ్ఞ పొందినవాడు నోవహు అని స్పష్టంగా ఉంచుతూ, హీబ్రూ సంపూర్ణ క్రియ సూచించే ముందరి చర్యను తెలుగు సందర్భంలో సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: జంతువులు రావడంలో కార్యసాధకత్వం
  choice: జంతువులు వచ్చాయని, అది దేవుడు నోవహుకు ఇచ్చిన ఆజ్ఞకు అనుగుణంగా జరిగిందని మాత్రమే పేర్కొనడం
  alternative: దేవుడు వాటిని అద్భుతంగా రప్పించాడని లేదా నోవహే వాటిని సమకూర్చాడని స్పష్టీకరించడం
  rationale: మూలవాక్యం జంతువులు ఎలా వచ్చాయో వివరించదు. కాబట్టి దైవ ఆజ్ఞ, జంతువుల రాక మధ్య సంబంధాన్ని నిలుపుతూ, చెప్పని కార్యవిధానాన్ని అనువాదంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. హీబ్రూ వాక్యారంభంలోని జతల ప్రాధాన్యాన్ని నిలుపుతూ ‘రెండేసి చొప్పున’ ముందుంచబడింది. ‘వచ్చి … ప్రవేశించాయి’ అనేది ఒకే హీబ్రూ క్రియను తెలుగు సహజ వాక్యనిర్మాణంలో విప్పి చెప్పిన రూపం.
