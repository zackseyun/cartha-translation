    text: మూలంలో అక్షరార్థంగా ‘రెండు రెండు’; అంటే జతజతలుగా.
    reason: lexical_alternative
  revision_rationale: The revision uses plural, natural Telugu for the male/female pairing and represents the Hebrew’s single motion verb with a single Telugu verb. The final clause is made complete by repeating “అవి వచ్చాయి”; this preserves the comparative force of כַּאֲשֶׁר and does not add a mechanism for the animals’ arrival. The former footnote b is removed because its proposed ‘more literal’ Telugu wording was not idiomatic and could misleadingly suggest that the source merely says the animals came near the ark rather than using motion toward it in its narrative context.
