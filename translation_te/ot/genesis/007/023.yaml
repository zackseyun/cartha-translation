id: GEN.7.23
reference: Genesis 7:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּ֜מַח אֶֽת כָּל הַ/יְק֣וּם אֲשֶׁ֣ר עַל פְּנֵ֣י הָֽ/אֲדָמָ֗ה מֵ/אָדָ֤ם עַד בְּהֵמָה֙ עַד רֶ֨מֶשׂ֙ וְ/עַד ע֣וֹף הַ/שָּׁמַ֔יִם וַ/יִּמָּח֖וּ מִן הָ/אָ֑רֶץ וַ/יִשָּׁ֧אֶר אַךְ נֹ֛חַ וַֽ/אֲשֶׁ֥ר אִתּ֖/וֹ בַּ/תֵּבָֽה־־׀׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/023.yaml
  text: He blotted out every living thing that was on the face of the ground[a], from man to livestock to creeping things and to the birds of the heavens. They were blotted out from the earth, and only Noah was left[c][b], and those who were with him in the ark.
translation:
  language: te
  text: ఆయన నేల ఉపరితలంపై ఉన్న ప్రతి ప్రాణినీ—మనిషి మొదలుకొని పశువుల వరకు, నేలపై పాకే జీవుల వరకు, ఆకాశ పక్షుల వరకు—తుడిచివేశాడు.[a] అవన్నీ భూమి మీద నుంచి తుడిచివేయబడ్డాయి. నోవహు, అతనితోపాటు ఓడలో ఉన్నవన్నీ మాత్రమే మిగిలాయి.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “తుడిచివేశాడు” అనే మాటకు “చెరిపివేశాడు” అని కూడా అనువదించవచ్చు; హీబ్రూ క్రియలో తుడిచి తొలగించడం లేదా చెరిపివేయడం అనే దృశ్యభావం ఉంది.
    reason: lexical_alternative
  - marker: b
    text: “అతనితోపాటు ఓడలో ఉన్నవన్నీ” అనే హీబ్రూ మాట నోవహుతో ఉన్న మనుషులనూ ఇతర జీవులనూ సూచించగలదు.
    reason: ambiguity
lexical_decisions:
- source_word: וַיִּמַח / וַיִּמָּחוּ
  choice: తుడిచివేశాడు / తుడిచివేయబడ్డాయి
  rationale: מחה అనే క్రియలో తుడిచివేయడం లేదా చెరిపివేయడం అనే దృశ్యభావం ఉంది. మొదటి రూపాన్ని కర్తరి ప్రయోగంలోను, నిఫాల్ రూపాన్ని కర్మణి ప్రయోగంలోను తెలుగులో ప్రతిబింబిస్తుంది.
- source_word: כָּל הַיְקוּם
  choice: ప్రతి ప్రాణి
  rationale: ప్రళయ సందర్భంలో יְקוּם నేలపై నిలిచి లేదా జీవించి ఉన్న సమస్త జీవరాశిని సూచిస్తుంది; అమూర్తమైన ‘ఉనికి’ కంటే ‘ప్రతి ప్రాణి’ సహజంగాను సందర్భోచితంగాను ఉంది.
- source_word: עַל פְּנֵי הָאֲדָמָה
  choice: నేల ముఖం మీద
  rationale: హీబ్రూ నుడికారంలోని ‘ముఖం’ అనే దృశ్యాన్ని నిలుపుతూ, ఆధునిక తెలుగులో అర్థమయ్యే విధంగా ఉంది.
- source_word: מֵאָדָם
  choice: మనిషి మొదలుకొని
  rationale: אָדָם ఇక్కడ మానవజాతికి ప్రతినిధిగా ఏకవచనంలో జీవవర్గాల జాబితాను ప్రారంభిస్తుంది. ‘మనిషి’ మూలరూపాన్ని నిలుపుతుంది; ‘మొదలుకొని’ מִן...עַד నిర్మాణాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בְּהֵמָה
  choice: పశువులు
  rationale: ఇది సాధారణంగా పెంపుడు భూజంతువులను సూచిస్తుంది; ‘పశువులు’ ఆధునిక తెలుగులో విస్తృతంగా అర్థమయ్యే పదం.
- source_word: רֶמֶשׂ
  choice: నేలపై పాకే జీవులు
  rationale: భూమికి దగ్గరగా కదిలే చిన్న జీవులను సూచించే భావాన్ని స్పష్టంగా అందిస్తుంది; కేవలం సరీసృపాలకు పరిమితం చేయదు.
- source_word: עוֹף הַשָּׁמַיִם
  choice: ఆకాశ పక్షులు
  rationale: ‘ఆకాశానికి చెందిన పక్షులు’ అనే హీబ్రూ సంబంధాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: מִן הָאָרֶץ
  choice: భూమి మీద నుంచి
  rationale: אֶרֶץ కు ‘భూమి’ లేదా ‘దేశం’ అనే అర్థాలు సాధ్యమైనప్పటికీ, ప్రళయ కథనంలోని విస్తృత వర్ణనకు ‘భూమి’ సరిపోతుంది; విస్తృతి గురించిన శాస్త్రీయ నిర్ణయాన్ని అదనంగా చేర్చదు.
- source_word: וַיִּשָּׁאֶר אַךְ נֹחַ
  choice: నోవహు మాత్రమే ... మిగిలాయి
  rationale: אַךְ లోని నిర్బంధార్థాన్ని ‘మాత్రమే’ స్పష్టంగా తెలియజేస్తుంది; శׁאר కు ‘మిగిలారు/మిగిలాయి’ సహజ సమానం.
- source_word: וַאֲשֶׁר אִתּוֹ בַּתֵּבָה
  choice: అతనితోపాటు ఓడలో ఉన్నవన్నీ
  rationale: హీబ్రూ సంబంధవాచకం వ్యక్తులకే పరిమితం కాదు; నోవహుతో ఓడలో ఉన్న మనుషులనూ జీవులనూ కలుపుకోగల అస్పష్టతను ‘ఉన్నవన్నీ’ కాపాడుతుంది. תֵּבָה కు నోవహు కథలో స్థిరంగా వినిపించే ‘ఓడ’ వాడబడింది.
theological_decisions:
- issue: ప్రళయ వినాశన పరిధి
  choice: వచనం పేర్కొన్న నేలపై జీవించే వర్గాలన్నీ తుడిచివేయబడ్డాయని నేరుగా అనువదించడం
  alternative: దీనిని ప్రాంతీయ అతిశయోక్తిగా లేదా స్పష్టమైన ప్రపంచవ్యాప్త శాస్త్రీయ ప్రకటనగా ముందుగానే నిర్ణయించడం
  rationale: హీబ్రూ కథన బలాన్ని తగ్గించకుండా, దాని మాటలకు మించిన భౌగోళిక లేదా శాస్త్రీయ నిర్ణయాన్ని అనువాదంలో చేర్చలేదు.
- issue: ఓడలో నోవహుతో ఉన్నవారి పరిధి
  choice: ‘ఉన్నవన్నీ’ అని వ్యక్తులనూ జంతువులనూ చేర్చగల రూపం
  alternative: ‘ఉన్నవారు’ అని కేవలం మనుషులకు పరిమితం చేయడం
  rationale: אֲשֶׁר అనే రూపం ఇక్కడ వ్యక్తులు మరియు ఇతర జీవులు రెండింటినీ సూచించగలదు; సందర్భంలోని సమగ్రతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనా సాధారణ పాఠకులకు స్పష్టమైన వాక్యనిర్మాణం. హీబ్రూ పునరుక్తి మరియు తుడిచివేయడం అనే దృశ్యాన్ని నిలిపి, జాబితాను సహజ తెలుగు లయలో అందించింది.
