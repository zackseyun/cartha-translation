revisions:
- from: ఆయన నేల ముఖం మీద ఉన్న ప్రతి ప్రాణినీ—మనిషి మొదలుకొని పశువుల వరకు, నేలపై పాకే జీవుల వరకు, ఆకాశ పక్షుల వరకు—తుడిచివేశాడు.[a] అవన్నీ భూమి మీద నుంచి తుడిచివేయబడ్డాయి. నోవహు మాత్రమే, అతనితోపాటు ఓడలో ఉన్నవన్నీ మాత్రమే మిగిలాయి.[b]
  to: ఆయన నేల ఉపరితలంపై ఉన్న ప్రతి ప్రాణినీ—మనిషి మొదలుకొని పశువుల వరకు, నేలపై పాకే జీవుల వరకు, ఆకాశ పక్షుల వరకు—తుడిచివేశాడు.[a] అవన్నీ భూమి మీద నుంచి తుడిచివేయబడ్డాయి. నోవహు, అతనితోపాటు ఓడలో ఉన్నవన్నీ మాత్రమే మిగిలాయి.[b]
  rationale: మూలంలోని ఒక్క నిర్బంధార్థక పదం אַךְను తెలుగులో ఒక్క ‘మాత్రమే’తోనే ప్రతిబింబించాను. అలాగే ‘నేల ముఖం మీద’ను ఆధునిక వాడుకకు సహజమైన ‘నేల ఉపరితలంపై’గా మార్చాను. మిగతా పదప్రయోగాలు మూలార్థాన్నీ సందర్భంలోని ఉద్దేశపూర్వక విస్తృతినీ బాగా కాపాడుతున్నాయి.
