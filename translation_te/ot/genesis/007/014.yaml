source:
  edition: WLC
  text: הֵ֜מָּה וְ/כָל הַֽ/חַיָּ֣ה לְ/מִינָ֗/הּ וְ/כָל הַ/בְּהֵמָה֙ לְ/מִינָ֔/הּ וְ/כָל הָ/רֶ֛מֶשׂ הָ/רֹמֵ֥שׂ עַל הָ/אָ֖רֶץ לְ/מִינֵ֑/הוּ וְ/כָל הָ/ע֣וֹף לְ/מִינֵ֔/הוּ כֹּ֖ל צִפּ֥וֹר כָּל כָּנָֽף־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/014.yaml
  text: they[a], and every wild animal according to its kind, and every livestock animal according to its kind, and every creeping thing that creeps on the earth according to its kind[b], and every bird according to its kind—every winged bird.
translation:
  language: te
  text: వారు, తమ తమ జాతుల ప్రకారం అడవి జంతువులన్నీ, తమ తమ జాతుల ప్రకారం పశువులన్నీ, నేల మీద ప్రాకే జీవులన్నీ తమ తమ జాతుల ప్రకారం, పక్షులన్నీ తమ తమ జాతుల ప్రకారం—రెక్కలుగల ప్రతి పక్షి[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “ప్రతి పక్షి, ప్రతి రెక్క.” రెక్కలుగల పక్షులన్నిటినీ నొక్కిచెప్పడానికి హీబ్రూలో ఒకదానిని మరొకటి వివరించే వర్గీకరణ పదబంధాలు వాడబడ్డాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵמָּה
  choice: వారు
  rationale: ఈ సర్వనామం మునుపటి వచనంలో చెప్పబడిన నోవహును, అతనితో ఉన్నవారిని సూచిస్తుంది. తెలుగు సందర్భంలో ‘వారు’ సహజంగా ఉంది.
- source_word: הַחַיָּה
  choice: అడవి జంతువులు
  rationale: ఆదికాండంలోని జంతు వర్గీకరణలో ఇది בְּהֵמָהకు భిన్నంగా అడవి జంతువులను సూచిస్తుంది.
- source_word: הַבְּהֵמָה
  choice: పశువులు
  rationale: పెంపుడు లేదా మందలుగా ఉంచే జంతువులను సూచించే సమగ్ర, సహజ తెలుగు పదం; ‘అడవి జంతువులు’ అనే వర్గానికి ఉన్న వ్యత్యాసాన్ని నిలుపుతుంది.
- source_word: לְמִינָהּ / לְמִינֵהוּ
  choice: తమ తమ జాతుల ప్రకారం
  rationale: హీబ్రూ వర్గీకరణ పదబంధాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; ప్రతి జంతు వర్గం తన జాతి ప్రకారం ఉన్నదనే భావాన్ని కాపాడుతుంది.
- source_word: הָרֶמֶשׂ הָרֹמֵשׂ עַל הָאָרֶץ
  choice: నేల మీద ప్రాకే జీవులు
  rationale: నామవాచకం, దానిని అనుసరించే క్రియారూపం రెండింటి భావాన్ని తెలుగులో అనవసర పునరుక్తి లేకుండా స్పష్టంగా అందిస్తుంది.
- source_word: הָעוֹף
  choice: పక్షులు
  rationale: ఇక్కడి చివరి వివరణతో కలిపి ఇది రెక్కలుగల పక్షులను సూచిస్తుంది; ‘పక్షులు’ సాధారణ పాఠకులకు సహజమైన పదం.
- source_word: כֹּל צִפּוֹר כָּל כָּנָף
  choice: రెక్కలుగల ప్రతి పక్షి
  rationale: అక్షరార్థ పునరుక్తిని సహజ తెలుగులో వివరణాత్మక సమానార్థక పదబంధంగా అందిస్తూ, సమస్త రెక్కల పక్షులనూ నొక్కిచెప్పే భావాన్ని నిలుపుతుంది.
