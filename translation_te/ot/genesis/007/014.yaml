  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలి. మూలంలోని వరుస జంతు వర్గీకరణను, ‘తమ తమ జాతుల ప్రకారం’ అనే పునరావృత నిర్మాణాన్ని సాధ్యమైనంతవరకు నిలుపుతూ సహజ తెలుగు వాక్యప్రవాహాన్ని పాటించింది.
