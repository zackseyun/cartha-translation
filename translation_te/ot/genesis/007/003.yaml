  variant: modern standard Telugu
source:
  edition: WLC
  text: גַּ֣ם מֵ/ע֧וֹף הַ/שָּׁמַ֛יִם שִׁבְעָ֥ה שִׁבְעָ֖ה זָכָ֣ר וּ/נְקֵבָ֑ה לְ/חַיּ֥וֹת זֶ֖רַע עַל פְּנֵ֥י כָל הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/003.yaml
  text: Also from the birds of the sky[a], seven and seven, male and female, to keep offspring alive on the face of all the earth.
translation:
  language: te
  text: ఆకాశంలోని పక్షులలోనుండి కూడా ఏడు ఏడు, మగవి, ఆడవి తీసుకో; భూమి అంతటా వాటి సంతతిని సజీవంగా ఉంచడానికి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఏడు జతలు.’ హీబ్రూలో అక్షరార్థంగా ‘ఏడు ఏడు’ అని ఉంది. ఇది విభజనార్థక ప్రయోగం; ఒక్కో రకానికి ఏడు అని గానీ, ఏడు జతలు అని గానీ అర్థం చేసుకోవచ్చు. ప్రధాన పాఠం హీబ్రూ రూపాన్ని మరింత దగ్గరగా నిలుపుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: కూడా
  rationale: మునుపటి వచనంలోని జంతువులకు పక్షులను అదనపు వర్గంగా చేర్చుతున్న భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: מֵעוֹף הַשָּׁמַיִם
  choice: ఆకాశ పక్షులలోనుండి
  rationale: עוֹף ఇక్కడ పక్షులను సూచిస్తుంది; הַשָּׁמַיִםకు సందర్భానుకూలమైన సహజ తెలుగు పదం ‘ఆకాశం’.
- source_word: שִׁבְעָה שִׁבְעָה
  choice: ఏడు ఏడు
  rationale: హీబ్రూలోని సంఖ్యా పునరుక్తిని నిలుపుతూ, అది ఒక్కో రకానికి ఏడా లేక ఏడు జతలా అన్న సందిగ్ధతను ప్రధాన పాఠంలో పరిష్కరించకుండా ఉంచుతుంది.
- source_word: זָכָר וּנְקֵבָה
  choice: మగవి ఆడవి
  rationale: పక్షులకు సంబంధించిన లింగ జతను ఆధునిక తెలుగులో సహజంగా, నేరుగా వ్యక్తం చేస్తుంది.
- source_word: לְחַיּוֹת
  choice: సజీవంగా ఉంచడానికి
  rationale: హిఫిల్ క్రియారూపంలోని ప్రాణాన్ని కాపాడి కొనసాగించే ప్రయోజన భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: זֶרַע
  choice: సంతతిని
  rationale: ‘విత్తనం’ అనే మూలరూప భావం కంటే ఈ సందర్భంలో వరద తరువాత జీవవంశం కొనసాగడాన్ని ‘సంతతి’ స్పష్టంగా సూచిస్తుంది.
- source_word: עַל פְּנֵי כָל הָאָרֶץ
  choice: భూమి అంతటి ఉపరితలంపై
  rationale: హీబ్రూ నుడికారంలోని ‘ముఖంపై’ అనే స్థలచిత్రాన్ని అర్థవంతమైన ఆధునిక తెలుగులో నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన బైబిలు శైలి. ‘ఏడు ఏడు’ అనే అసాధారణ పునరుక్తి మూలంలోని నిజమైన సందిగ్ధతను కాపాడేందుకు ఉద్దేశపూర్వకంగా నిలుపబడింది. సందర్భం వల్ల పూర్వ వచనంలోని ‘తీసుకో’ ఆజ్ఞను పూరించి వాక్యాన్ని తెలుగులో సంపూర్ణంగా చేశాం.
