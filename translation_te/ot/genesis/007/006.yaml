source:
  edition: WLC
  text: וְ/נֹ֕חַ בֶּן שֵׁ֥שׁ מֵא֖וֹת שָׁנָ֑ה וְ/הַ/מַּבּ֣וּל הָיָ֔ה מַ֖יִם עַל הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/006.yaml
  text: Noah was six hundred years old[b][a], and the flood was upon the earth.
translation:
  language: te
  text: నోవహు ఆరువందల సంవత్సరాల వయసుగలవాడు; జలప్రళయపు నీళ్లు భూమి[a]మీద ఉన్నాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘దేశం’.
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/נֹחַ
  choice: నోవహు
  rationale: వ్యక్తి పేరును తెలుగులో స్థిరంగా వాడుకలో ఉన్న రూపంలో లిప్యంతరీకరించాం. వావ్ సంధిని ప్రత్యేకంగా ‘మరియు’ అని పెట్టకుండా, తెలుగు వాక్య నిర్మాణంలో సహజంగా కలిపాం.
- source_word: בֶּן שֵׁשׁ מֵאוֹת שָׁנָה
  choice: ఆరువందల సంవత్సరాల వయసు ఉన్నప్పుడు
  rationale: ‘ఆరువందల సంవత్సరాల కుమారుడు’ అనే హీబ్రూ వయస్సు నుడికారాన్ని సహజమైన ఆధునిక తెలుగులో అర్థానుసారంగా ఇచ్చాం. తరువాతి సంఘటనతో ఉన్న కాలసంబంధాన్ని తెలుగు పాఠకునికి స్పష్టంగా చూపుతుంది.
- source_word: וְ/הַ/מַּבּוּל ... מַיִם
  choice: జలప్రళయ జలాలు
  rationale: מַבּוּל ప్రత్యేకమైన మహాప్రళయాన్ని సూచిస్తుంది; మַיִםలో స్పష్టంగా ఉన్న నీటి భావాన్ని ‘జలాలు’ ద్వారా నిలిపాం. ‘జలప్రళయ జలాలు’ గంభీరమైనదైనా సాధారణ పాఠకునికి అర్థమయ్యే రూపం.
- source_word: הָיָה
  choice: వచ్చాయి
  rationale: అక్షరార్థంగా ‘ఉన్నాయి/అయ్యాయి’ అనవచ్చు; అయితే ఆ నిర్మాణం తెలుగులో అసహజంగా ఉంటుంది. సందర్భంలోని సంఘటనాత్మక భావాన్ని సహజంగా తెలియజేయడానికి ‘వచ్చాయి’ వాడాం.
- source_word: עַל הָאָרֶץ
  choice: భూమి మీదికి
  rationale: עַל యొక్క స్థాన/దిశ భావాన్ని ‘మీదికి’ తెలియజేస్తుంది. הָאָרֶץకు సందర్భానుసారంగా ‘భూమి’ ప్రధాన పఠనం; ‘దేశం/నేల’ అనే సాధ్యమైన అర్థాన్ని పాదసూచికలో ఉంచాం.
theological_decisions:
- issue: הָאָרֶץ యొక్క పరిధి
  choice: భూమి
  alternative: దేశం లేదా నేల
  rationale: ఈ నామవాచకానికి ‘భూమి’ మరియు ‘దేశం/నేల’ అనే అర్థాలు రెండూ సాధ్యమే. ప్రళయ కథనంలోని విస్తృత సందర్భం వల్ల ప్రధాన పాఠంలో ‘భూమి’ని ఎంచుకున్నాం; మూలంలోని పదార్థ అనిశ్చితిని పాదసూచికలో నిలిపాం.
- issue: రెండు హీబ్రూ ఉపవాక్యాల సంబంధం
  choice: ‘ఉన్నప్పుడు’ అనే కాలసంబంధ నిర్మాణం
  alternative: ‘నోవహు ... వయసువాడు; జలప్రళయం ...’ అనే సమన్వయ నిర్మాణం
  rationale: హీబ్రూలో రెండు వావ్-సంబంధిత ఉపవాక్యాలు ఉన్నాయి. తెలుగులో సంఘటనల కాలసంబంధాన్ని సహజంగా చెప్పేందుకు మొదటి భాగాన్ని ‘ఉన్నప్పుడు’గా ఇచ్చాం; అక్షర నిర్మాణాన్ని ప్రత్యామ్నాయంగా పాదసూచికలో చూపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘జలప్రళయం’ బైబిలు సందర్భంలో సుపరిచితమైన పదం; ‘వచ్చాయి’ అసహజమైన అక్షరానువాదాన్ని నివారిస్తూ మూలంలోని సంఘటన భావాన్ని అందిస్తుంది.
