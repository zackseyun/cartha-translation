id: GEN.7.22
reference: Genesis 7:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כֹּ֡ל אֲשֶׁר֩ נִשְׁמַת ר֨וּחַ חַיִּ֜ים בְּ/אַפָּ֗י/ו מִ/כֹּ֛ל אֲשֶׁ֥ר בֶּ/חָֽרָבָ֖ה מֵֽתוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/022.yaml
  text: Everything on the dry land in whose nostrils was the breath of the spirit of life died[a][b].
translation:
  language: te
  text: పొడి నేలపై ఉన్నవాటిలో ముక్కుల్లో జీవశ్వాస[a] ఉన్నవన్నీ చనిపోయాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పదబంధాన్ని మరింత అక్షరార్థంగా, “జీవపు ఆత్మ యొక్క ఊపిరి” అని కూడా అనువదించవచ్చు; “ఆత్మ”కు బదులుగా “శ్వాస” అని కూడా అర్థం కావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל אֲשֶׁר ... מִכֹּל אֲשֶׁר בֶּחָרָבָה
  choice: పొడి నేల మీద ఉన్న వాటన్నిటిలో ... ఉన్నవన్నీ
  rationale: ఈ సమగ్ర నిర్మాణం పొడి నేలపై ఉన్న అర్హమైన జీవులన్నిటినీ సూచిస్తుంది. జంతువులతో పాటు మనుషులూ పరిధిలో ఉన్నందున వ్యక్తులకు మాత్రమే పరిమితమయ్యే పదాన్ని వాడలేదు.
- source_word: נִשְׁמַת רוּחַ חַיִּים
  choice: జీవప్రాణం
  rationale: ఈ సంయుక్త హీబ్రూ పదబంధం జీవాన్ని నిలిపే ఊపిరిని సూచిస్తుంది. సహజమైన ఆధునిక తెలుగులో ‘జీవప్రాణం’ ఆ భావాన్ని సంక్షిప్తంగా అందిస్తుంది; మూలంలోని విస్తృత పదరూపాన్ని పాదసూచికలో ఉంచాం.
- source_word: בְּאַפָּיו
  choice: ముక్కుల్లో
  rationale: హీబ్రూలో ‘ముక్కుల్లో’ అనే బహువచన శరీరాంగ నామానికి మూడవ పురుష ఏకవచన ప్రత్యయం ఉంది. తెలుగు సమూహసంబంధ వాక్యంలో ప్రత్యయాన్ని మళ్లీ వ్యక్తపరచకుండా చెప్పడం సహజంగా ఉంటుంది.
- source_word: חָרָבָה
  choice: పొడి నేల
  rationale: వరద సందర్భంలో నీటితో కప్పబడని భూమిని, జలావాసానికి విరుద్ధంగా, స్పష్టంగా సూచిస్తుంది.
- source_word: מֵתוּ
  choice: చనిపోయాయి
  rationale: కర్త ప్రాణుల సమూహాన్ని నపుంసక బహువచనంగా సూచిస్తున్నందున ఇది సహజమైన తెలుగు రూపం; హీబ్రూ క్రియ మరణాన్ని నేరుగా తెలియజేస్తుంది.
theological_decisions:
- issue: נִשְׁמַת רוּחַ חַיִּיםలో רוּחַను విడిగా ‘ఆత్మ’గా చూపాలా?
  choice: ప్రధాన పాఠ్యంలో ‘జీవప్రాణం’
  alternative: ‘జీవాత్మ యొక్క ఊపిరి’ లేదా అక్షరార్థంగా ‘జీవముల ఆత్మ యొక్క ఊపిరి’
  rationale: ఇక్కడి పదసమూహం జీవశ్వాసను సూచించే సమగ్ర వ్యక్తీకరణగా అర్థమవుతుంది. ‘ఆత్మ’ను విడిగా ప్రధాన పాఠ్యంలో ఉంచితే మూలంలో తప్పనిసరిగా లేని తాత్త్విక అంతరాలను పాఠకుడు ఊహించే అవకాశం ఉంది. అయినా మూల పదరూపాన్ని పాదసూచిక తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సహజంగా ఉండేలా, అయితే వరద కథనానికి తగిన గంభీరతతో అనువదించబడింది. ‘పొడి నేల’ జలజీవులను వాక్య పరిధి నుంచి వేరుచేసే మూల భావాన్ని నిలుపుతుంది.
