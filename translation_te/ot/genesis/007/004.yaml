  to: ఎందుకంటే ఇంకా ఏడు రోజులకు[a] నేను భూమిమీద నలభై పగళ్లు, నలభై రాత్రులు వర్షం కురిపిస్తాను. నేను చేసిన సమస్త జీవరాశిని[b] నేలమీదనుండి[c] తుడిచివేస్తాను[d].
