id: GEN.7.4
reference: Genesis 7:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּי֩ לְ/יָמִ֨ים ע֜וֹד שִׁבְעָ֗ה אָֽנֹכִי֙ מַמְטִ֣יר עַל הָ/אָ֔רֶץ אַרְבָּעִ֣ים י֔וֹם וְ/אַרְבָּעִ֖ים לָ֑יְלָה וּ/מָחִ֗יתִי אֶֽת כָּל הַ/יְקוּם֙ אֲשֶׁ֣ר עָשִׂ֔יתִי מֵ/עַ֖ל פְּנֵ֥י הָֽ/אֲדָמָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/004.yaml
  text: For in seven more days I will make it rain on the earth forty days and forty nights[d][c][b][a], and I will wipe out every living thing that I have made from the face of the ground.
translation:
  language: te
  text: ఎందుకంటే ఇంకా ఏడు రోజులకు[a] నేను భూమిమీద నలభై పగళ్లు, నలభై రాత్రులు వర్షం కురిపిస్తాను. నేను చేసిన సమస్త జీవరాశిని[b] నేలమీదనుండి[c] తుడిచివేస్తాను[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఇంకా ఏడు రోజుల తరువాత.” వర్షం మొదలయ్యే ముందు ఏడు రోజులు మిగిలి ఉన్నాయని హీబ్రూ నుడికారం సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా “నిలిచి ఉన్నదంతటిని” లేదా “ఉనికిలో ఉన్నదంతటిని”; ఈ సందర్భంలో సజీవ సృష్టిని సూచిస్తుంది.
    reason: source_ambiguity
  - marker: c
    text: హీబ్రూలో అక్షరార్థంగా “నేల ముఖం మీదనుండి.” ఇక్కడి “నేల” అనే పదం, ముందున్న “భూమి” అనే పదానికి భిన్నమైనది.
    reason: lexical_distinction
  - marker: d
    text: లేదా “చెరిపివేస్తాను.” హీబ్రూ క్రియ తుడిచివేయడం లేదా చెరిపివేయడం అనే చిత్రాన్ని కలిగిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి వచనంలోని ఆజ్ఞకు కారణాన్ని పరిచయం చేసే సంబంధాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: לְיָמִים עוֹד שִׁבְעָה
  choice: ఇంకా ఏడు రోజుల్లో
  rationale: వర్షం మొదలయ్యే ముందు ఇంకా ఏడు రోజులు మిగిలి ఉన్నాయని తెలిపే హీబ్రూ కాలవాచక నుడికారాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: מַמְטִיר
  choice: వర్షం కురిపిస్తాను
  rationale: హిఫీల్ రూపంలోని ‘వర్షం కురిసేలా చేయడం’ అనే కారణార్థాన్ని, దేవుని కార్యసాధకత్వాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: עַל הָאָרֶץ
  choice: భూమిమీద
  rationale: ప్రళయ సందర్భంలోని విస్తృత భావాన్ని నిలుపుతుంది; దీనిని కేవలం ప్రాంతీయ ‘దేశం’గా ముందుగానే పరిమితం చేయదు.
- source_word: אַרְבָּעִים יוֹם וְאַרְבָּעִים לָיְלָה
  choice: నలభై పగళ్లు, నలభై రాత్రులు
  rationale: మూలంలోని కాలవ్యవధిని నేరుగా, సహజమైన తెలుగు ప్రయోగంలో అందిస్తుంది.
- source_word: וּמָחִיתִי
  choice: తుడిచివేస్తాను
  rationale: తుడవడం లేదా చెరిపివేయడం అనే מחה క్రియ యొక్క సజీవ రూపకాన్ని, సంపూర్ణ తొలగింపు భావాన్ని నిలుపుతుంది.
- source_word: כָּל הַיְקוּם
  choice: సమస్త జీవరాశిని
  rationale: ఈ సందర్భంలో ప్రళయ తీర్పుకు లోనయ్యే సజీవ సృష్టి సముదాయాన్ని స్పష్టంగా తెలియజేస్తుంది; మూలపదంలోని ‘నిలిచి ఉన్నది/ఉనికిలో ఉన్నది’ అనే విస్తృత ఛాయను పాదటిప్పణిలో సంరక్షిస్తుంది.
- source_word: אֲשֶׁר עָשִׂיתִי
  choice: నేను చేసిన
  rationale: దేవుని పూర్వ సృష్టికార్యాన్ని సరళంగా, ప్రత్యక్షంగా తెలియజేస్తుంది.
- source_word: מֵעַל פְּנֵי הָאֲדָמָה
  choice: నేలమీదనుండి
  rationale: ముందటి אֶרֶץ‌కు వాడిన ‘భూమి’తో భేదాన్ని నిలుపుతూ, హీబ్రూ నుడికారాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: אֶרֶץ మరియు כָּל הַיְקוּם సూచించే ప్రళయ తీర్పు పరిధి
  choice: ‘భూమి,’ ‘సమస్త జీవరాశి’ అనే విస్తృత సృష్టి-వ్యాప్త భాషను వాడటం
  alternative: אֶרֶץ‌ను ‘దేశం/ప్రాంతం’గా అనువదించి తీర్పును ప్రాంతీయ ఘటనగా పరిమితం చేయడం
  rationale: వచనంలోని సమగ్ర తీర్పు భాషను నిలుపుతూ, ఆధునిక శాస్త్రీయ లేదా సంప్రదాయపరమైన వాదనను అనువాదంలోకి దిగుమతి చేయకుండా ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు స్పష్టంగా ఉండే, గౌరవప్రదమైన శైలి. ‘భూమి/నేల’ పదభేదాన్ని ఉద్దేశపూర్వకంగా నిలిపి, హీబ్రూ రూపకాలకూ సందర్భంలోని విస్తృత తీర్పు భాషకూ సమతుల్యత ఇచ్చాం.
