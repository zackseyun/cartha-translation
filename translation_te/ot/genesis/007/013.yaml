  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదంగా, సాధారణ పాఠకులకు సులభంగా ఉండే వాక్యనిర్మాణం ఎంచుకోబడింది. హీబ్రూ వాక్యంలో చివరనున్న ‘వారితో’ అనే బహువచన భావాన్ని ‘వారితోపాటు’గా నిలిపి, తెలుగులో అసహజమైన పునరుక్తిని తగ్గించేందుకు ముందుగా ‘అతనితోపాటు’ చేర్చబడింది.
