source:
  edition: WLC
  text: בְּ/עֶ֨צֶם הַ/יּ֤וֹם הַ/זֶּה֙ בָּ֣א נֹ֔חַ וְ/שֵׁם וְ/חָ֥ם וָ/יֶ֖פֶת בְּנֵי נֹ֑חַ וְ/אֵ֣שֶׁת נֹ֗חַ וּ/שְׁלֹ֧שֶׁת נְשֵֽׁי בָנָ֛י/ו אִתָּ֖/ם אֶל הַ/תֵּבָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/013.yaml
  text: On that very day Noah entered the ark[a], with Shem, Ham, and Japheth, Noah’s sons, and Noah’s wife[c][b], and the three wives of his sons with them.
translation:
  language: te
  text: ఆ రోజునే నోవహు, అతని కుమారులైన షేము, హాము, యాఫెతు, నోవహు భార్య, అతని కుమారుల ముగ్గురు భార్యలు వారితో కలిసి ఓడలో ప్రవేశించారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ఓడలో ప్రవేశించారు’ అనే చోట హీబ్రూలో అక్షరార్థంగా ‘ఓడలోకి వచ్చారు’ అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: అదే రోజున
  rationale: ఈ హీబ్రూ నుడికారం నిర్దిష్టంగా ‘సరిగ్గా ఆ రోజునే’ అనే నొక్కిచెప్పే భావాన్ని ఇస్తుంది. ఆధునిక తెలుగులో ‘అదే రోజున’ సహజంగా ఆ బలాన్ని తెలియజేస్తుంది.
- source_word: בָּא ... אֶל הַתֵּבָה
  choice: ఓడలో ప్రవేశించారు
  rationale: בָּא పదానికి అక్షరార్థంగా ‘వచ్చాడు’ అనే భావం ఉన్నా, אֶל הַתֵּבָהతో కలిసి ఇక్కడ ఓడ లోపలికి వెళ్లడాన్ని సూచిస్తుంది. సంయుక్త కర్తకు అనుగుణంగా తెలుగులో బహువచన క్రియ వాడబడింది.
- source_word: נֹחַ
  choice: నోవహు
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: וְשֵׁם וְחָם וָיֶפֶת בְּנֵי נֹחַ
  choice: నోవహు కుమారులైన షేము, హాము, యాఫెతు
  rationale: సమానాధికార సంబంధాన్ని సహజమైన తెలుగులో స్పష్టంగా చూపిస్తూ, ముగ్గురూ నోవహు కుమారులని మూలపాఠం తెలిపే క్రమాన్ని నిలుపుతుంది.
- source_word: וְאֵשֶׁת נֹחַ
  choice: నోవహు భార్య
  rationale: హీబ్రూ నిర్మాణాన్ని సహజమైన తెలుగు సంబంధబోధక రూపంలో అందిస్తుంది.
- source_word: וּשְׁלֹשֶׁת נְשֵׁי בָנָיו
  choice: అతని కుమారుల ముగ్గురు భార్యలు
  rationale: ముగ్గురు కుమారుల భార్యలను సూచించే సంఖ్యను, కుటుంబ సంబంధాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: אִתָּם
  choice: వారితోపాటు
  rationale: మూలంలోని పుంలింగ బహువచన సర్వనామాన్ని ప్రత్యక్షంగా ప్రతిబింబిస్తుంది; ఇది ముందుగా పేర్కొన్న కుటుంబ సమూహాన్ని సహజంగా సూచిస్తుంది.
- source_word: הַתֵּבָה
  choice: ఓడ
  rationale: నోవహు కథనంలోని תֵּבָהకు తెలుగులో విస్తృతంగా అర్థమయ్యే సంప్రదాయ పదం.
