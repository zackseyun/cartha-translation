    rationale: హీబ్రూ בֹּא ఏకవచన పుంలింగ ఆజ్ఞ; అది నోవహును ఉద్దేశిస్తుంది. తెలుగులో ‘నువ్వు’తో ‘ప్రవేశించండి’ కలపడం అసహజం. నోవహు తన ఇంటివారందరితో కలసి ప్రవేశించాలని చెప్పే ఏకవచన ఆజ్ఞ దీనిని సరిచేస్తుంది.
