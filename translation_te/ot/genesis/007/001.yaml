id: GEN.7.1
reference: Genesis 7:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ לְ/נֹ֔חַ בֹּֽא אַתָּ֥ה וְ/כָל בֵּיתְ/ךָ֖ אֶל הַ/תֵּבָ֑ה כִּֽי אֹתְ/ךָ֥ רָאִ֛יתִי צַדִּ֥יק לְ/פָנַ֖/י בַּ/דּ֥וֹר הַ/זֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/001.yaml
  text: Then Yahweh said to Noah, “Enter the ark, you and all your household, because I have seen that you are righteous before me in this generation.”
translation:
  language: te
  text: 'అప్పుడు యాహ్వే నోవహుతో ఇలా అన్నాడు: “నువ్వు నీ ఇంటివారందరితో కలిసి ఓడలోకి ప్రవేశించు; ఎందుకంటే ఈ తరంలో నా ఎదుట నువ్వు నీతిమంతుడివని నేను చూశాను.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవిక నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తింపుపొందిన వ్యక్తినామ రూపం ‘యెహోవా’గా అందించాం.
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... ఇలా అన్నాడు
  rationale: వావ్-క్రమార్థకం కథనాన్ని ముందుకు నడిపిస్తుంది; ఆధునిక తెలుగులో ‘అప్పుడు’ ఆ క్రమాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: בֹּא
  choice: ప్రవేశించండి
  rationale: ఆజ్ఞారూపానికి ‘రా/లోనికి రా’ అనే మౌలిక భావం ఉంది. ఓడ సందర్భంలో ‘ప్రవేశించండి’ స్పష్టంగా, గౌరవప్రదంగా ఉంది; తరువాత వచ్చే ఏకవచన ‘నువ్వు’ను ఉద్దేశించినప్పటికీ అతనితో పాటు ఇంటివారందరినీ కలుపుతున్న ఆజ్ఞను తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בֵּיתְךָ
  choice: నీ ఇంటివారందరూ
  rationale: ఇక్కడ ‘ఇల్లు’ భవనాన్ని కాక కుటుంబం లేదా గృహసభ్యులను సూచిస్తుంది; ‘ఇంటివారు’ ఆ సామాజిక భావాన్ని సహజంగా అందిస్తుంది.
- source_word: הַתֵּבָה
  choice: ఓడ
  rationale: నోవహు కథ సందర్భంలో תֵּבָהను తెలుగులో సంప్రదాయబద్ధంగా, సులభంగా అర్థమయ్యే ‘ఓడ’గా అందించాం.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ఈ పదం ముందున్న ఆజ్ఞకు కారణాన్ని పరిచయం చేస్తుంది.
- source_word: רָאִיתִי
  choice: నేను చూశాను
  rationale: హీబ్రూ సంపూర్ణ క్రియను దాని ప్రత్యక్ష ‘చూశాను’ భావంతో ఉంచి, దేవుని పరిశీలన లేదా నిర్ధారణను అదనపు వ్యాఖ్యానం లేకుండా వ్యక్తం చేశాం.
- source_word: צַדִּיק
  choice: నీతిమంతుడు
  rationale: צַדִּיקకు ప్రామాణికమైన, ధార్మిక బరువును నిలిపే తెలుగు సమానార్థకం.
- source_word: לְפָנַי
  choice: నా ఎదుట
  rationale: అక్షరార్థంలోని ‘నా ముఖం ముందు’ అనే హీబ్రూ నుడికారాన్ని సహజమైన తెలుగులో ఇచ్చి, దేవుని సన్నిధి మరియు దృష్టిలోని మూల్యాంకనం రెండింటినీ తెరిచి ఉంచుతుంది.
- source_word: בַּדּוֹר הַזֶּה
  choice: ఈ తరంలో
  rationale: דּוֹר ఇక్కడ నోవహు సమకాలిక తరాన్ని సూచిస్తుంది; ‘ఈ తరంలో’ సంక్షిప్తంగా, సహజంగా ఉంది.
theological_decisions:
- issue: יְהוָה అనే దైవిక నామం
  choice: యెహోవా
  alternative: ప్రభువు / యాహ్వే
  rationale: మూలపాఠంలో వ్యక్తిగత దైవిక నామమే ఉంది. దానిని బిరుదుగా మార్చకుండా తెలుగులో సుపరిచితమైన నామరూపంతో నిలిపాం; ‘యాహ్వే’ మరొక సాధ్యమైన లిప్యంతరీకరణ.
- issue: నోవహు నీతి యొక్క భావం
  choice: నా ఎదుట నువ్వు నీతిమంతుడివని నేను చూశాను
  alternative: నా దృష్టిలో నువ్వు నీతిమంతుడివని నేను నిర్ధారించాను
  rationale: పాఠం నోవహు నీతికి ఆధారం లేదా విధానాన్ని వివరించదు. అందువల్ల దేవుని మూల్యాంకనాన్ని మాత్రమే తెలిపి, ఆరోపిత నీతి వంటి ప్రత్యేక సిద్ధాంత వివరణను చేర్చలేదు.
- issue: నోవహు ఒక్కడే నీతిమంతుడా అనే ప్రశ్న
  choice: నువ్వు నీతిమంతుడివని
  alternative: నువ్వొక్కడివే నీతిమంతుడివని
  rationale: హీబ్రూ אֹתְךָ వాక్యంలో నోవహును ముందుంచుతుంది గాని ‘ఒక్కడే’ అనే ప్రత్యేక పదం లేదు; అందుచేత ప్రత్యేకతను అతిశయింపకుండా మూలంలోని ఉద్వేగాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. దేవుడు నోవహును ఏకవచన సన్నిహిత రూపమైన ‘నువ్వు’తో ఉద్దేశించిన మూల నిర్మాణాన్ని నిలిపాం. ‘ప్రవేశించండి’లోని గౌరవ/బహువచన రూపం నోవహుతో పాటు ఇంటివారందరినీ కలిపిన సమూహ ఆజ్ఞగా తెలుగులో సహజంగా పనిచేస్తుంది. వివరణ అవసరమైన పాఠాంతర భేదం లేకపోవడంతో పాదటిప్పణులు చేర్చలేదు.
