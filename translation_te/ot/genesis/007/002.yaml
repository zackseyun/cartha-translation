id: GEN.7.2
reference: Genesis 7:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: מִ/כֹּ֣ל הַ/בְּהֵמָ֣ה הַ/טְּהוֹרָ֗ה תִּֽקַּח לְ/ךָ֛ שִׁבְעָ֥ה שִׁבְעָ֖ה אִ֣ישׁ וְ/אִשְׁתּ֑/וֹ וּ/מִן הַ/בְּהֵמָ֡ה אֲ֠שֶׁר לֹ֣א טְהֹרָ֥ה הִ֛וא שְׁנַ֖יִם אִ֥ישׁ וְ/אִשְׁתּֽ/וֹ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/002.yaml
  text: From every clean animal you shall take for yourself seven pairs[a], a male and its mate; and from the animals that are not clean, two[b], a male and its mate.
translation:
  language: te
  text: శుద్ధమైన ప్రతి జంతువు నుండి ఏడు జతలను[a] నీ కోసం తీసుకో—ప్రతి జతలో ఒక మగ జంతువు, దాని ఆడ జంతువు ఉండాలి. శుద్ధం కాని జంతువుల నుండి రెండింటిని[b] తీసుకో—ఒక మగ జంతువు, దాని ఆడ జంతువు ఉండాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో పదశః “ఏడేడు—మగది, దాని ఆడది” అని ఉంది. ఇది బహుశా ఏడు జతలను సూచిస్తుంది; అయితే కొందరు దీన్ని మొత్తం ఏడు జంతువులని అర్థం చేసుకుంటారు.
    reason: alternative_reading
  - marker: b
    text: లేదా, “అశుద్ధమైన జంతువుల నుండి.” హీబ్రూలో “శుద్ధం కాని జంతువుల నుండి” అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִכֹּל הַבְּהֵמָה
  choice: ప్రతి జంతువులోనుండి
  rationale: מִן + כֹּל మూల సమూహంలోని ప్రతి రకాన్ని సూచిస్తుంది. బְּהֵמָהను సందర్భానికి తగిన విస్తృత, ఆధునిక పదమైన ‘జంతువు’గా అనువదించాం.
- source_word: הַטְּהוֹרָה
  choice: శుద్ధమైన
  rationale: טָהוֹר ఇక్కడ జంతువుల శుద్ధ–అశుద్ధ భేదాన్ని సూచిస్తుంది. ‘శుద్ధమైన’ సంక్షిప్తంగా ఉండి, ఆచార సంబంధ అర్థాన్ని ప్రధాన పాఠ్యంలో అతిగా వివరించదు.
- source_word: תִּקַּח לְךָ
  choice: నీ కోసం తీసుకో
  rationale: ఆజ్ఞార్థకంగా పనిచేసే క్రియను సహజమైన తెలుగులో ఇచ్చి, לְךָలోని ‘నీ కోసం’ భావాన్ని నిలిపాం.
- source_word: שִׁבְעָה שִׁבְעָה
  choice: ఏడు జతలను
  rationale: పునరుక్త సంఖ్య తరువాత ‘మగదానిని, దాని జతను’ రావడం వల్ల జతలుగా విభజించిన ఏడు యూనిట్లు ఉద్దేశించబడ్డాయని ప్రధాన పాఠ్యంలో స్పష్టంగా తెలిపాం; పదశః రూపంలోని సందిగ్ధతను పాదసూచికలో ఉంచాం.
- source_word: אִישׁ וְאִשְׁתּוֹ
  choice: మగదానిని, దాని జతను
  rationale: జంతువుల విషయంలో పదశః ‘పురుషుడు, అతని భార్య’ అనడం అసహజం. లింగజతను సూచించే హీబ్రూ నుడికారాన్ని సహజంగా, అయితే ‘జత’ అనే సంబంధాన్ని కాపాడుతూ అనువదించాం.
- source_word: אֲשֶׁר לֹא טְהֹרָה הִוא
  choice: శుద్ధం కాని
  rationale: హీబ్రూ ఒకే ప్రతికూల విశేషణం కాకుండా ‘శుద్ధం కానిది’ అని విశ్లేషణాత్మకంగా చెబుతుంది; అదే నిర్మాణాన్ని తెలుగులో నిలిపాం.
- source_word: שְׁנַיִם
  choice: రెండింటిని
  rationale: హీబ్రూ సంఖ్యను నేరుగా అనువదించాం. తరువాతి మగ–జత వివరణ వల్ల అవి ఒక జతగా ఉన్న రెండు జంతువులని తెలుస్తుంది.
theological_decisions:
- issue: శుద్ధమైన జంతువుల సంఖ్యను సూచించే పదబంధం
  choice: ఏడు జతలు
  alternative: మొత్తం ఏడు జంతువులు; లేదా పదశః ‘ఏడేడు’
  rationale: שִׁבְעָה שִׁבְעָה తరువాత אִישׁ וְאִשְׁתּוֹ రావడం, అలాగే శుద్ధం కాని జంతువులకు ‘రెండు—మగదాని, దాని జత’ అని ఎదురుపోలిక ఉండడం వల్ల ఏడు మగ–ఆడ జతలు అనే అర్థం బలంగా ఉంది. అయినా సంఖ్యా పునరుక్తిని కొందరు మొత్తం ఏడు జంతువులుగా అర్థం చేసుకునే అవకాశం ఉన్నందున దాన్ని పాదసూచికలో నమోదు చేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రద శైలి. సంఖ్యా సందిగ్ధతను ప్రధాన పాఠ్యంలో సహజంగా పరిష్కరించినా, ప్రత్యామ్నాయ అర్థాన్ని పాదసూచికలో భద్రపరిచాం. ఎమ్-డాష్‌లతో సంఖ్య తరువాత వచ్చే మగ–జత వివరణను స్పష్టంగా వేరు చేశాం.
