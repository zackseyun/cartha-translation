source:
  edition: WLC
  text: מִן הַ/בְּהֵמָה֙ הַ/טְּהוֹרָ֔ה וּ/מִן הַ֨/בְּהֵמָ֔ה אֲשֶׁ֥ר אֵינֶ֖נָּ/ה טְהֹרָ֑ה וּ/מִ֨ן הָ/ע֔וֹף וְ/כֹ֥ל אֲשֶׁר רֹמֵ֖שׂ עַל הָֽ/אֲדָמָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/008.yaml
  text: From the clean animals and from the animals that are not clean[a], and from the birds and everything that creeps on the ground—
translation:
  language: te
  text: శుద్ధమైన జంతువులలో నుంచీ, శుద్ధమైనవి కాని జంతువులలో నుంచీ[a], పక్షులలో నుంచీ, నేలపై పాకే ప్రతిదానిలో నుంచీ—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అశుద్ధమైన.” హెబ్రీలో అక్షరార్థంగా, “శుద్ధమైనవి కాని.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן
  choice: లో నుంచీ
  rationale: ఈ జాబితాలో ఆయా వర్గాల నుంచి తీసుకున్నవాటిని సూచిస్తుంది. హెబ్రీలోని పునరుక్త నిర్మాణాన్ని తెలుగులో సహజంగా నిలుపుతుంది.
- source_word: בְּהֵמָה
  choice: జంతువులు
  rationale: ఇక్కడ ఈ పదం పక్షులు, పాకే జీవులకు భిన్నమైన విస్తృత జంతువర్గాన్ని సూచిస్తుంది; కేవలం పశువులకే పరిమితం కాదు.
- source_word: טְּהוֹרָה
  choice: శుద్ధమైన
  rationale: ఇది ఆచారపరమైన వర్గీకరణను సూచిస్తుంది. ఆధునిక ప్రామాణిక తెలుగులో ‘శుద్ధమైన’ స్పష్టంగా, గౌరవప్రదంగా ఉంది.
- source_word: אֲשֶׁר אֵינֶנָּה טְהֹרָה
  choice: శుద్ధమైనవి కాని
  rationale: హెబ్రీలోని ‘శుద్ధమైనది కాని’ అనే విశ్లేషణాత్మక నిషేధ నిర్మాణాన్ని నిలుపుతుంది; ‘అశుద్ధమైన’ అనేది సహజమైన ప్రత్యామ్నాయం.
- source_word: עוֹף
  choice: పక్షులు
  rationale: ఈ సందర్భంలో ఎగిరే జీవుల వర్గానికి సహజమైన, తగిన తెలుగు పదం.
- source_word: כֹּל אֲשֶׁר רֹמֵשׂ
  choice: పాకే ప్రతిదానిలో
  rationale: నేలమీద పాకుతూ కదిలే జీవుల వర్గాన్ని హెబ్రీ క్రియాత్మక భావానికి దగ్గరగా తెలియజేస్తుంది.
- source_word: עַל הָאֲדָמָה
  choice: నేలపై
  rationale: పాకే జీవులు కదిలే భూఉపరితలాన్ని ఈ సందర్భంలో సహజంగా సూచిస్తుంది.
theological_decisions:
- issue: జంతువుల ఆచారపరమైన వర్గీకరణ
  choice: శుద్ధమైన / శుద్ధమైనవి కాని
  alternative: పవిత్రమైన / అపవిత్రమైన; శుద్ధమైన / అశుద్ధమైన
  rationale: ‘శుద్ధమైన’ అనే పదం నైతిక తీర్పును అనవసరంగా చేర్చకుండా ఆచారపరమైన వర్గాన్ని తెలియజేస్తుంది. ప్రతికూల వర్గానికి హెబ్రీలో ఉన్న ‘కాని’ నిర్మాణాన్ని ప్రధాన పాఠంలో నిలిపి, సహజమైన ‘అశుద్ధమైన’ రూపాన్ని పాదటిప్పణిలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలి. హెబ్రీ జాబితా లయను నిలుపడానికి ‘లో నుంచీ’ పునరావృతం చేయబడింది. వాక్యం తరువాతి వచనంలో కొనసాగుతున్నందున చివర దీర్ఘ విరామచిహ్నం ఉంచబడింది.
