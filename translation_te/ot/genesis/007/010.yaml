- from: ఏడు రోజులు గడిచిన తరువాత, జలప్రళయపు నీళ్లు భూమిమీదికి వచ్చాయి.[a][b]
  to: ఏడు రోజులు గడిచిన తరువాత, జలప్రళయపు నీళ్లు భూమిమీద ఉన్నాయి.[a][b]
