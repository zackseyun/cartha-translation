id: GEN.7.10
reference: Genesis 7:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַֽ/יְהִ֖י לְ/שִׁבְעַ֣ת הַ/יָּמִ֑ים וּ/מֵ֣י הַ/מַּבּ֔וּל הָי֖וּ עַל הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/010.yaml
  text: And after seven days[b][a], the waters of the flood came upon the earth.
translation:
  language: te
  text: ఏడు రోజులు గడిచిన తరువాత, జలప్రళయపు నీళ్లు భూమిమీద ఉన్నాయి.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దేశం మీద” లేదా “నేల మీద.” హెబ్రీ పదం సందర్భాన్ని బట్టి ‘భూమి,’ ‘దేశం,’ లేదా ‘నేల’ అని అర్థమవుతుంది.
    reason: lexical_alternative
  - marker: b
    text: 'అక్షరార్థంగా, “ఏడు రోజులు పూర్తయిన తరువాత అప్పుడు జరిగింది: జలప్రళయపు నీళ్లు భూమిమీద ఉన్నాయి.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי לְשִׁבְעַת הַיָּמִים
  choice: ఏడు రోజులు గడిచిన తరువాత
  rationale: కాలవ్యవధి పూర్తయినప్పుడు తదుపరి సంఘటన జరిగినదనే హెబ్రీ కథన భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; అక్షరార్థ నిర్మాణం పాదసూచికలో నిలుపబడింది.
- source_word: וּמֵי הַמַּבּוּל
  choice: జలప్రళయపు నీళ్లు
  rationale: מַבּוּל నోవహు కాలపు మహాప్రళయాన్ని సూచిస్తుంది. ‘జలప్రళయం’ సాధారణ తెలుగు పాఠకునికి స్పష్టంగా ఉండగా, מֵי అనే ‘నీళ్లు’ భావాన్ని కూడా విడిగా నిలుపుతుంది.
- source_word: הָיוּ עַל
  choice: మీదికి వచ్చాయి
  rationale: అక్షరార్థంగా ‘మీద ఉన్నాయి’; సందర్భంలో జలప్రళయపు నీళ్లు ప్రవేశించిన సంఘటనను తెలుగులో సహజంగా తెలియజేయడానికి ‘మీదికి వచ్చాయి’ వాడబడింది.
- source_word: הָאָרֶץ
  choice: భూమి
  rationale: אֶרֶץ సందర్భానుసారం ‘భూమి’ లేదా ‘దేశం/నేల’ అని అర్థమవుతుంది. జలప్రళయ కథనంలోని విస్తృత సందర్భానికి ‘భూమి’ ప్రధాన పాఠంగా ఎంచుకోబడింది; ప్రత్యామ్నాయం పాదసూచికలో ఇవ్వబడింది.
theological_decisions:
- issue: జలప్రళయ కథనంలో אֶרֶץ పరిధి
  choice: భూమి
  alternative: దేశం లేదా నేల
  rationale: హెబ్రీ పదం స్థానిక భూభాగాన్నీ, విస్తృతంగా భూమినీ సూచించగలదు. ఈ కథన సందర్భంలో ‘భూమి’ ప్రధాన అనువాదంగా ఉంచబడింది; అయితే మూలంలోని నిజమైన పదార్థ సందిగ్ధతను పాదసూచికలో సంరక్షించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథన శైలి. ‘వచ్చెను,’ ‘సంభవించెను’ వంటి ప్రాచీన రూపాలకు బదులుగా సహజమైన వర్తమాన ప్రమాణ రూపాలు వాడబడ్డాయి; మూలంలోని అక్షరార్థ నిర్మాణం మరియు אֶרֶץ పదంలోని సందిగ్ధత పాదసూచికల్లో నిలుపబడ్డాయి.
