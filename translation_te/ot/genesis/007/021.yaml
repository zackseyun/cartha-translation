id: GEN.7.21
reference: Genesis 7:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּגְוַ֞ע כָּל בָּשָׂ֣ר הָ/רֹמֵ֣שׂ עַל הָ/אָ֗רֶץ בָּ/ע֤וֹף וּ/בַ/בְּהֵמָה֙ וּ/בַ֣/חַיָּ֔ה וּ/בְ/כָל הַ/שֶּׁ֖רֶץ הַ/שֹּׁרֵ֣ץ עַל הָ/אָ֑רֶץ וְ/כֹ֖ל הָ/אָדָֽם־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/021.yaml
  text: 'And all flesh that moved on the earth died: birds[a], livestock, wild animals, every swarming thing that swarms on the earth, and all mankind.'
translation:
  language: te
  text: భూమిమీద కదిలే సమస్త జీవులు—పక్షులు, పశువులు, అడవి జంతువులు, భూమిమీద గుంపులుగా కదిలే ప్రతి జీవి, సమస్త మానవాళి[a]—చనిపోయారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, మనుషులందరూ. హీబ్రూలో, ‘సమస్త హా-ఆదాము’; ఇక్కడ ఇది సమష్టిగా మానవజాతిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְוַע
  choice: చనిపోయారు
  rationale: גוע మరణించడం లేదా ప్రాణం విడవడం అని సూచిస్తుంది. సందర్భంలోని సమూహ కర్తకు అనుగుణంగా సహజమైన ఆధునిక తెలుగు బహువచన రూపాన్ని వాడాం.
- source_word: כָּל בָּשָׂר
  choice: సమస్త శరీరులు
  rationale: హీబ్రూ ‘సమస్త శరీరం’ అనే నుడికారాన్ని సాధ్యమైనంత స్పష్టంగా నిలుపుతూ, ఇక్కడ జాబితా చేయబడిన ప్రాణులన్నిటినీ సూచించేలా జీవులను తెలిపే ‘శరీరులు’ అనే రూపాన్ని ఎంచుకున్నాం.
- source_word: הָרֹמֵשׂ
  choice: కదిలే
  rationale: רמש కదలడం, పాకడం, గుంపులుగా కదలడం అనే భావాలను ఇవ్వగలదు. పక్షులు మొదలైన విస్తృత జాబితాను కలుపుకోవడానికి ‘కదిలే’ సరైన విస్తృత పదం.
- source_word: עַל הָאָרֶץ
  choice: భూమిమీద
  rationale: ఈ ప్రళయ సందర్భంలో אֶרֶץ‌ను ‘భూమి’గా అనువదించడం సహజంగా ఉండి కథనపు విస్తృత పరిధిని నిలుపుతుంది.
- source_word: בָּעוֹף
  choice: పక్షులు
  rationale: עוֹף ఎగిరే జీవులను విస్తృతంగా సూచించగలిగినా, ఈ వర్గీకరణలో ‘పక్షులు’ సహజమైన, స్పష్టమైన తెలుగు పదం.
- source_word: וּבַבְּהֵמָה
  choice: పశువులు
  rationale: בְּהֵמָה ఇక్కడ మచ్చికచేసిన లేదా గృహసంబంధ జంతువుల వర్గాన్ని సూచిస్తుంది; ‘పశువులు’ సాధారణ ఆధునిక తెలుగు వాడుకకు తగినది.
- source_word: וּבַחַיָּה
  choice: అడవి జంతువులు
  rationale: పశువులకు భిన్నంగా חַיָּה ఇక్కడ మచ్చిక కాని భూజంతువులను సూచిస్తుంది.
- source_word: וּבְכָל הַשֶּׁרֶץ הַשֹּׁרֵץ
  choice: గుంపులుగా కదిలే ప్రతి చిన్న ప్రాణి
  rationale: שׁרץ చిన్న జీవులు గుంపులుగా కదలడం లేదా విస్తారంగా తిరగడం అనే భావాన్ని ఇస్తుంది. తెలుగులో మూలంలోని నామ-క్రియా పునరుక్తిని యథాతథంగా ఉంచితే కృత్రిమంగా ఉండటంతో, వర్గభావాన్ని స్పష్టంగా తెలిపాం.
- source_word: וְכֹל הָאָדָם
  choice: సమస్త మానవాళి
  rationale: הָאָדָם ఇక్కడ ఒక పురుషుణ్ణి కాక మానవజాతిని సమష్టిగా సూచిస్తుంది; ‘మానవాళి’ లింగపరంగా సమగ్రంగా, సహజంగా ఉంది.
theological_decisions:
- issue: הָאָדָם యొక్క సమష్టి అర్థం
  choice: సమస్త మానవాళి
  alternative: మనుషులందరూ
  rationale: నిర్దిష్ట ఉపపదంతో ఉన్న אָדָם ఇక్కడ ఆదాము అనే వ్యక్తిని కాక మొత్తం మానవజాతిని సమష్టిగా సూచిస్తుంది. ‘మానవాళి’ ఆ సమష్టి భావాన్ని నిలుపుతుంది.
- issue: כָּל בָּשָׂר అనే నుడికారం
  choice: సమస్త శరీరులు
  alternative: సమస్త జీవులు
  rationale: ‘సమస్త జీవులు’ మరింత వివరణాత్మకమైనా, ‘శరీరం/మాంసం’ అనే హీబ్రూ రూపకాన్ని పూర్తిగా తొలగిస్తుంది. ‘సమస్త శరీరులు’ మూలరూపాన్ని కొంత నిలుపుతూ సందర్భంలో సజీవ ప్రాణులను సూచిస్తుంది.
translation_notes:
  register: గంభీరమైన కథన శైలిని, సాధారణ ఆధునిక తెలుగు గ్రాహ్యతను సమతుల్యం చేశాం. జాబితాను డాష్‌ల మధ్య ఉంచి ‘సమస్త శరీరులు’ అనే ప్రధాన వర్గానికి వివరణగా చూపించాం. మూలంలో లేని పాదటిప్పణి అవసరం లేదు; అందువల్ల ప్రధాన పాఠ్యంలో పాదటిప్పణి గుర్తులు లేవు.
