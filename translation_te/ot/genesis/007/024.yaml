  yaml_path: translation/ot/genesis/007/024.yaml
  text: And the waters prevailed over the earth for 150 days[a].
translation:
  language: te
  text: జలాలు భూమిమీద నూట యాభై రోజులు ప్రబలాయి[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దేశం మీద’; హీబ్రూ אֶרֶץ అనే పదానికి సందర్భాన్ని బట్టి ‘భూమి’ లేదా ‘దేశం’ అనే అర్థం ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְבְּרוּ
  choice: ప్రబలంగా ఉన్నాయి
  rationale: గבר అనే క్రియ ఇక్కడ జలాలు బలంగా ఆధిపత్యం చెలాయించిన స్థితిని సూచిస్తుంది. ‘ప్రబలంగా ఉన్నాయి’ అనే ప్రయోగం కేవలం నీటిమట్టం పెరిగిందనే భావానికి పరిమితం కాకుండా, మూలంలోని బలం మరియు పైచేయి భావాలను నిలుపుతుంది.
- source_word: הַמַּיִם
  choice: జలాలు
  rationale: హీబ్రూలోని బహువచన రూపాన్ని, జలప్రళయ వృత్తాంతపు గంభీర శైలిని సహజమైన తెలుగులో ప్రతిబింబిస్తుంది.
- source_word: עַל הָאָרֶץ
  choice: భూమిమీద
  rationale: עַל కు ‘మీద’ సహజ సమానం. אֶרֶץ కు ‘భూమి’ లేదా ‘దేశం/నేల’ అనే అర్థాలు సాధ్యమైనా, ఈ వృత్తాంతంలోని విస్తృత సందర్భంలో ‘భూమి’ తగినది.
- source_word: חֲמִשִּׁים וּמְאַת יוֹם
  choice: నూట యాభై రోజులపాటు
  rationale: హీబ్రూ సంఖ్యా ప్రయోగాన్ని సహజమైన తెలుగు సంఖ్యా క్రమంలో అందించి, కాలవ్యవధిని స్పష్టపరచడానికి ‘రోజులపాటు’ ఉపయోగించబడింది.
theological_decisions:
- issue: జలప్రళయ వృత్తాంతంలో אֶרֶץ పదపు పరిధి
  choice: భూమి
  alternative: దేశం లేదా నేల
  rationale: తక్షణ సాహిత్య సందర్భం జలప్రళయాన్ని విశాలమైన పదాలతో వర్ణిస్తున్నందున ప్రధాన పాఠంలో ‘భూమి’ ఎంచుకోబడింది. అయితే మూలపదానికి ఉన్న ‘దేశం/నేల’ అర్థసాధ్యతను పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన వృత్తాంత శైలి. ‘జలాలు’ మూలంలోని బహువచనాన్ని నిలుపుతుంది; ‘ప్రబలంగా ఉన్నాయి’ జలాల ఆధిపత్య స్థితిని సహజంగా వ్యక్తం చేస్తుంది.
