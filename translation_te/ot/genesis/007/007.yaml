revisions:
- from: ప్రళయ జలాల కారణంగా నోవహు, అతని కుమారులు, అతని భార్య, అతనితోపాటు అతని కుమారుల భార్యలు ఓడలోకి ప్రవేశించారు.
  to: ప్రళయ జలాల కారణంగా నోవహు తన కుమారులతో, తన భార్యతో, తన కుమారుల భార్యలతో కలిసి ఓడలోకి ప్రవేశించాడు.
  rationale: The revision retains every person and the cause for entering, while using singular ప్రవేశించాడు to reflect the Hebrew verbal form. The phrase తన కుమారులతో, తన భార్యతో, తన కుమారుల భార్యలతో కలిసి naturally conveys the accompaniment expressed by the list and אִתּוֹ without restricting “with him” to the final group alone.
