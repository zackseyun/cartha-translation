source:
  edition: WLC
  text: וַ/יָּ֣בֹא נֹ֗חַ וּ֠/בָנָי/ו וְ/אִשְׁתּ֧/וֹ וּ/נְשֵֽׁי בָנָ֛י/ו אִתּ֖/וֹ אֶל הַ/תֵּבָ֑ה מִ/פְּנֵ֖י מֵ֥י הַ/מַּבּֽוּל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/007.yaml
  text: And Noah, with his sons, his wife, and his sons’ wives with him, entered the ark because of the waters of the flood.
translation:
  language: te
  text: ప్రళయ జలాల కారణంగా నోవహు తన కుమారులతో, తన భార్యతో, తన కుమారుల భార్యలతో కలిసి ఓడలోకి ప్రవేశించాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  choice: ప్రవేశించారు
  rationale: בוא అనే క్రియ సందర్భానుసారం రావడం, వెళ్లడం, ప్రవేశించడం అనే అర్థాలు ఇస్తుంది. אֶל הַתֵּבָהతో కలిసిన ఈ సందర్భంలో ‘ఓడలోకి ప్రవేశించారు’ అనేది గమనాన్ని సహజంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: נֹחַ
  choice: నోవహు
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగులో ప్రాచుర్యంలో ఉన్న రూపం.
- source_word: בָנָיו
  choice: అతని కుమారులు
  rationale: హీబ్రూ పదం సాధారణంగా పిల్లలను కాక ప్రత్యేకంగా కుమారులను సూచిస్తుంది.
- source_word: אִשְׁתּוֹ
  choice: అతని భార్య
  rationale: ఈ సందర్భంలో אִשָּׁה సర్వనామ ప్రత్యయంతో భార్యను స్పష్టంగా సూచిస్తుంది.
- source_word: נְשֵׁי בָנָיו
  choice: అతని కుమారుల భార్యలు
  rationale: ‘అతని కుమారుల భార్యలు’ అనే రూపం హీబ్రూ సమాస నిర్మాణాన్ని నేరుగా నిలుపుతుంది; ‘కోడళ్లు’ కూడా సాధ్యమే కానీ మూలంలోని సంబంధాన్ని అంత స్పష్టంగా చూపదు.
- source_word: אִתּוֹ
  choice: అతనితోపాటు
  rationale: నోవహుతో వారి సహగమనాన్ని మూలంలో ఉన్నట్లే స్పష్టంగా తెలియజేస్తుంది.
- source_word: אֶל הַתֵּבָה
  choice: ఓడలోకి
  rationale: దిశను సూచించే אֶלను ‘లోకి’ తెలియజేస్తుంది. నోవహు కథా సందర్భంలో תֵּבָהకు సహజమైన తెలుగు పదం ‘ఓడ’.
- source_word: מִפְּנֵי
  choice: కారణంగా
  rationale: ఇక్కడ ఈ విభక్త్యర్థక పదబంధం కారణాన్ని సూచిస్తుంది; ‘కారణంగా’ ఆధునిక తెలుగులో స్పష్టమైన, సహజమైన రూపం.
- source_word: מֵי הַמַּבּוּל
  choice: ప్రళయ జలాలు
  rationale: ‘ప్రళయపు నీళ్లు’ అనే మూల నిర్మాణాన్ని సంక్షిప్తమైన, గౌరవప్రదమైన తెలుగు పదబంధంగా వ్యక్తం చేస్తుంది; రెండు నామపదాల భావాన్నీ నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడబడింది. హీబ్రూ వాక్యంలోని వ్యక్తుల వరుసను, אִתּוֹ అనే సహగమన సూచనను స్పష్టంగా నిలుపుతూ, సమూహ కర్తకు అనుగుణంగా బహువచన క్రియ వాడబడింది.
