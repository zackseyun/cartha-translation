  text: And the waters prevailed exceedingly over the earth[b][a], and all the high mountains under all the heavens were covered.
translation:
  language: te
  text: జలాలు భూమిమీద[a] అత్యంతంగా ప్రబలాయి, ఆకాశమంతటి కింద[b] ఉన్న ఎత్తైన పర్వతాలన్నీ కప్పబడ్డాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “భూమి” అనే హీబ్రూ పదానికి “నేల” లేదా “దేశం” అనే అర్థం కూడా ఉండవచ్చు; ఇక్కడ దాని పరిధి సందర్భాన్ని ఎలా అర్థం చేసుకుంటామనే దానిపై ఆధారపడుతుంది.
    reason: alternative_reading
  - marker: b
    text: లేదా, “సమస్త ఆకాశాల కింద.”
    reason: lexical_alternative
lexical_decisions:
- source_word: גָּבְרוּ
  choice: ప్రబలంగా పెరిగాయి
  rationale: גבר బలపడడం లేదా ప్రబలడం అనే భావాన్ని ఇస్తుంది. వరద సందర్భంలో జలాలు శక్తివంతంగా పైపైకి పెరిగిన భావాన్ని సహజమైన తెలుగులో ఈ పదబంధం అందిస్తుంది.
- source_word: מְאֹד מְאֹד
  choice: అత్యంత
  rationale: రెండుసార్లు వచ్చిన מְאֹד తీవ్ర ఉద్ఘాటనను సూచిస్తుంది; ఆధునిక తెలుగులో ‘అత్యంత’ దానిని సహజంగా తెలియజేస్తుంది.
- source_word: עַל הָאָרֶץ
  choice: భూమిమీద
  rationale: עַל కు ‘మీద’; אֶרֶץ కు ఈ విశ్వవ్యాప్త వాక్య సందర్భంలో ‘భూమి’ సరిపోతాయి. ‘దేశం/నేల’ అనే భావసాధ్యతను పాదసూచికలో ఉంచాం.
- source_word: וַיְכֻסּוּ
  choice: మునిగిపోయాయి
  rationale: పర్వతాలు జలాలతో కప్పబడిన ఫలితాన్ని ఆధునిక తెలుగులో స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: כָּל הֶהָרִים הַגְּבֹהִים
  choice: ఎత్తైన పర్వతాలన్నీ
  rationale: మూలంలోని సమగ్రతను, ఎత్తును నేరుగా నిలుపుతుంది.
- source_word: תַּחַת כָּל הַשָּׁמָיִם
  choice: ఆకాశమంతటి కింద
  rationale: שָׁמַיִם రూపపరంగా బహువచనమైనా తెలుగులో ‘ఆకాశమంతటి కింద’ సహజంగా ఉండి, ‘మొత్తం ఆకాశం కింద’ అనే సమగ్ర పరిధిని నిలుపుతుంది.
theological_decisions:
- issue: వరద కథనంలో אֶרֶץ పరిధి
  choice: భూమి
  alternative: నేల లేదా దేశం
  rationale: ‘ఆకాశమంతటి కింద’ అనే తరువాతి వాక్యభాగంతో కలిసి కథనం విశ్వవ్యాప్త భాషను వాడుతోంది. ‘భూమి’ దాన్ని నిలుపుతుంది; అయితే אֶרֶץ యొక్క పరిమిత భూభాగార్థ సాధ్యతను పాదసూచికలో సంరక్షించాం.
translation_notes:
  register: సాధారణ ఆధునిక పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన ప్రామాణిక తెలుగు. హీబ్రూ ఉద్ఘాటనను సహజంగా అందిస్తూ, אֶרֶץ లోని నిజమైన అర్థసందిగ్ధతను పాదసూచికలో నిలిపాం.
