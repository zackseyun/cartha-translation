  text: The waters prevailed and increased greatly over the earth[a], and the ark moved along on the surface of the waters.
translation:
  language: te
  text: నీళ్లు ఉద్ధృతమై భూమిమీద ఎంతో పెరిగాయి; ఓడ నీళ్ల ఉపరితలంపై సాగింది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీళ్ల ఉపరితలంపై తేలుతూ సాగింది.” హీబ్రూలో అక్షరార్థంగా, “నీళ్ల ముఖం మీద వెళ్లింది” అని ఉంది; ఇది నీటి ఉపరితలంపై కదలడాన్ని సూచించే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְבְּרוּ
  choice: బలపడి
  rationale: גבר అనే క్రియ నీళ్లు శక్తిమంతమవడం లేదా పైచేయి సాధించడం అనే భావాన్ని ఇస్తుంది. సందర్భంలో సహజంగా ఉండేలా ‘బలపడి’ అని అనువదించాం.
- source_word: הַמַּיִם
  choice: నీళ్లు
  rationale: హీబ్రూలోని బహువచన రూపానికి, జలప్రళయ సందర్భంలో సాధారణ ఆధునిక తెలుగులో సహజమైన పదం.
- source_word: וַיִּרְבּוּ מְאֹד
  choice: ఎంతో విస్తరించాయి
  rationale: רבה తో కూడిన מְאֹד నీళ్ల గొప్ప పెరుగుదల లేదా వ్యాప్తిని బలంగా సూచిస్తుంది; ‘ఎంతో విస్తరించాయి’ ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: עַל הָאָרֶץ
  choice: భూమిమీద
  rationale: אֶרֶץ కు ‘భూమి’ లేదా ‘దేశం/నేల’ అనే అర్థాలు ఉండవచ్చు. జలప్రళయ కథనంలోని విస్తృత సందర్భానికి ‘భూమి’ సరిపోతుంది.
- source_word: וַתֵּלֶךְ
  choice: కదిలింది
  rationale: הלך అక్షరార్థంగా ‘వెళ్లింది’; నీళ్లపై ఓడ గురించి చెప్పినప్పుడు ‘కదిలింది’ అనేది గమనాన్ని తెలిపి, అది ఎలా కదిలిందో అనవసరంగా నిర్దిష్టం చేయదు.
- source_word: הַתֵּבָה
  choice: ఓడ
  rationale: నోవహు కథనంలో תֵּבָה కు తెలుగులో స్థిరపడిన, సందర్భోచితమైన పదం.
- source_word: עַל פְּנֵי הַמָּיִם
  choice: నీళ్ల ఉపరితలంపై
  rationale: ‘నీళ్ల ముఖంపై’ అనే హీబ్రూ నుడికారానికి స్పష్టమైన ఆధునిక తెలుగు సమానార్థకం.
