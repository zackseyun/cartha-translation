  yaml_path: translation/ot/genesis/007/016.yaml
  text: And those that entered[a], male and female from all flesh, as God had commanded him[c][b]; and Yahweh shut him in.
translation:
  language: te
  text: లోపలికి వచ్చినవి[a]—సమస్త జీవుల్లోనుండి[b] మగవి, ఆడవి—దేవుడు అతనికి ఆజ్ఞాపించిన ప్రకారం లోపలికి వచ్చాయి; యహ్వే అతన్ని లోపల బంధించాడు.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘లోపలికి వస్తున్నవి’ లేదా ‘లోపలికి వచ్చినవే’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘సకల శరీరంలోనుండి’; ఇది జీవులన్నిటినీ సమష్టిగా సూచించే హీబ్రూ వ్యక్తీకరణ.
    reason: cultural_note
  - marker: c
    text: అక్షరార్థంగా, ‘యహ్వే అతని వెనుక మూసివేశాడు.’ సందర్భంలో ఓడ తలుపు సూచితమైనా, హీబ్రూ పాఠంలో ‘తలుపు’ అనే పదం స్పష్టంగా లేదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַבָּאִים ... בָּאוּ
  choice: లోపలికి వచ్చినవి ... లోపలికి వచ్చాయి
  rationale: హీబ్రూలోని నామవాచకంగా వాడిన కృదంతాన్ని, తరువాత వచ్చే పరిమిత క్రియను రెండింటినీ నిలుపుతూ, ఓడలోకి ప్రవేశించిన జీవులను సహజమైన తెలుగులో సూచిస్తుంది.
- source_word: זָכָר וּנְקֵבָה
  choice: మగవి, ఆడవి
  rationale: జంతువుల లింగభేదాన్ని తెలుగులో సహజంగా, సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: מִכָּל בָּשָׂר
  choice: సకల శరీరజాతిలోనుంచి
  rationale: מִן అనే ‘నుంచి’ భావాన్ని, בָּשָׂר అనే ‘శరీరం/మాంసం’ సమష్టి వ్యక్తీకరణను వీలైనంతవరకు నిలుపుతుంది; సందర్భంలో ఇది జీవులన్నిటినీ సూచిస్తుంది.
- source_word: כַּאֲשֶׁר צִוָּה אֹתוֹ אֱלֹהִים
  choice: దేవుడు అతనికి ఆజ్ఞాపించిన ప్రకారం
  rationale: ప్రవేశం దేవుని ముందరి ఆజ్ఞకు అనుగుణంగా జరిగిందనే సంబంధాన్ని సహజమైన తెలుగు వాక్యనిర్మాణంలో తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: హీబ్రూ పాఠంలోని వ్యక్తిగత దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా లిప్యంతరీకరిస్తుంది.
- source_word: וַיִּסְגֹּר יְהוָה בַּעֲדוֹ
  choice: యహ్వే అతని వెనుక మూసివేశాడు
  rationale: హీబ్రూ వాక్యంలో తలుపు అనే కర్మ స్పష్టంగా లేకపోవడాన్ని నిలుపుతూ, בַּעֲדוֹ యొక్క ‘అతని వెనుక/అతన్ని లోపల ఉంచేలా’ భావాన్ని వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠం సాధారణ బిరుదును కాక నాలుగు హీబ్రూ అక్షరాల దైవనామాన్ని ఉపయోగిస్తుంది. అందువల్ల దానిని బిరుదుగా మార్చకుండా, ఆధునిక పండితుల సాధారణ ఉచ్చారణకు దగ్గరగా ‘యహ్వే’ అని ఇచ్చాం.
- issue: యహ్వే ఏమి మూసివేశాడనే విషయం
  choice: కర్మను చేర్చకుండా ‘అతని వెనుక మూసివేశాడు’
  alternative: ‘తలుపును అతని వెనుక మూసివేశాడు’ లేదా ‘అతన్ని లోపల ఉంచి మూసివేశాడు’
  rationale: సందర్భం ఓడ తలుపును సూచించినప్పటికీ, హీబ్రూ వాక్యంలో ‘తలుపు’ స్పష్టంగా లేదు. అందువల్ల మూలంలోని సంక్షిప్తతను, స్వల్ప అస్పష్టతను ప్రధాన పాఠంలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కథనశైలిని వాడాం. జీవులను సూచించడానికి ‘మగవి, ఆడవి’ అనే సహజ రూపాలను ఎంచుకున్నాం. మూలంలోని పునరుక్త నిర్మాణాన్ని, ‘సకల శరీరం’ అనే సమష్టి రూపకాన్ని, చివరి క్రియలోని అంతర్నిహిత కర్మను పూర్తిగా సున్నితంగా మార్చకుండా నిలిపాం.
