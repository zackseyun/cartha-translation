revisions:
- from: లోపలికి వచ్చినవి[a]—సకల శరీరజాతిలోనుంచి[b] మగవి, ఆడవి—దేవుడు అతనికి ఆజ్ఞాపించిన ప్రకారం లోపలికి వచ్చాయి; యహ్వే అతని వెనుక మూసివేశాడు.[c]
  to: లోపలికి వచ్చినవి[a]—సమస్త జీవుల్లోనుండి[b] మగవి, ఆడవి—దేవుడు అతనికి ఆజ్ఞాపించిన ప్రకారం లోపలికి వచ్చాయి; యహ్వే అతన్ని లోపల బంధించాడు.[c]
  rationale: The revision retains the Hebrew narrative structure and its deliberate nonmention of a door, while replacing two expressions that are awkward or incomplete in modern standard Telugu. The final wording conveys the established contextual sense of the Hebrew idiom (‘shut him in’) rather than forcing an unnatural Telugu calque.
