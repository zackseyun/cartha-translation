id: GEN.7.5
reference: Genesis 7:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּ֖עַשׂ נֹ֑חַ כְּ/כֹ֥ל אֲשֶׁר צִוָּ֖/הוּ יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/005.yaml
  text: And Noah did according to all that Yahweh had commanded him[a].
translation:
  language: te
  text: నోవహు యాహ్వే తనకు ఆజ్ఞాపించినదంతా చేశాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: చేశాడు
  rationale: עשה అనే క్రియకు ‘చేయు/నిర్వహించు’ అనే విస్తృత అర్థం ఉంది. ఆజ్ఞకు అనుగుణంగా ప్రవర్తించడాన్ని తెలుగులో సహజంగా, అతివ్యాఖ్యానం లేకుండా ‘చేశాడు’ తెలియజేస్తుంది.
- source_word: נֹחַ
  choice: నోవహు
  rationale: హీబ్రూ వ్యక్తినామం נֹחַకు తెలుగు బైబిలు వాడుకలో స్థిరపడిన లిప్యంతరీకరణ.
- source_word: כְּכֹל אֲשֶׁר
  choice: ఆజ్ఞాపించినదంతా
  rationale: כְּכֹל אֲשֶׁר నిర్మాణం ఆజ్ఞాపించబడిన సమస్తానికి పూర్తి అనుగుణతను సూచిస్తుంది. తెలుగులో ‘ఆజ్ఞాపించినదంతా’ ఆ సంపూర్ణతను సహజంగా నిలుపుతుంది.
- source_word: צִוָּהוּ
  choice: తనకు ఆజ్ఞాపించిన
  rationale: צוה అంటే ‘ఆజ్ఞాపించు’; వస్తుప్రత్యయ ప్రత్యయం ‘అతనికి/అతనిని’ సందర్భానుసారంగా తెలుగులో ‘తనకు’గా సహజంగా వ్యక్తమవుతుంది. క్రియ ముందే జరిగినదని తెలుగు సంబంధక్రియా నిర్మాణం తగినంతగా తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగు క్రైస్తవ వాడుకలో విస్తృతంగా గుర్తించబడే వ్యక్తినామ రూపంగా అందించబడింది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలపాఠంలోని వ్యక్తిగత దైవనామాన్ని ‘ప్రభువు’ వంటి బిరుదుతో మార్చలేదు. ‘యెహోవా’ తెలుగు పాఠకులకు సుపరిచితమైన లిప్యంతరీకరణ; ‘యాహ్వే’ మూల ఉచ్చారణను పునర్నిర్మించే ప్రత్యామ్నాయ రూపం.
translation_notes:
  register: సరళమైన, గౌరవప్రదమైన ఆధునిక ప్రామాణిక తెలుగు. హీబ్రూ వాక్యంలోని సంపూర్ణ విధేయత భావాన్ని ‘ఆజ్ఞాపించినదంతా’ ద్వారా నిలిపి, తెలుగులో అసహజమైన ‘అన్నిటి ప్రకారం’ అనే పదానుక్రమాన్ని నివారించాం.
