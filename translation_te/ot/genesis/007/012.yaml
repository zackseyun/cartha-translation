lexical_decisions:
- source_word: וַיְהִי הַגֶּשֶׁם
  choice: వర్షం కురిసింది
  rationale: హీబ్రూ పదబంధం అక్షరార్థంగా ‘వర్షం ఉండింది/సంభవించింది’ అనే భావాన్ని ఇస్తుంది; సహజమైన ఆధునిక తెలుగులో వర్షం కొనసాగడాన్ని ‘వర్షం కురిసింది’ అని స్పష్టంగా, మూల భావానికి నిబద్ధంగా వ్యక్తం చేస్తుంది.
- source_word: עַל הָאָרֶץ
  choice: భూమి మీద
  rationale: ‘భూమి/దేశం మీద’ అనే మూలంలోని విస్తృత అర్థాన్ని ఇక్కడి జలప్రళయ సందర్భానికి తగిన సాధారణ రూపంలో నిలుపుతుంది.
- source_word: אַרְבָּעִים יוֹם וְאַרְבָּעִים לָיְלָה
  choice: నలభై పగళ్లు, నలభై రాత్రులు
  rationale: రోజు-రాత్రి రెండింటినీ విడిగా పేర్కొనే హీబ్రూ నిర్మాణాన్ని సహజమైన తెలుగు సమాంతర పదబంధంగా కాపాడుతుంది.
