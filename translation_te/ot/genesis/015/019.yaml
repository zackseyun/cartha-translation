lexical_decisions:
- source_word: אֶת
  choice: '[విడిగా అనువదించలేదు]'
  rationale: ఇది ప్రత్యక్ష కర్మను సూచించే వ్యాకరణ చిహ్నం; తెలుగులో దీనికి విడిగా సమాన పదం అవసరం లేదు. జాబితాలోని ప్రజలను ‘లను’ అనే విభక్తి ద్వారా కర్మగా చూపించాం.
- source_word: הַקֵּינִי
  choice: కేనీయులను
  rationale: నిర్దిష్ట ఉపపదంతో ఉన్న ఈ జాతినామం ఒక ప్రజాసమూహాన్ని సమష్టిగా సూచిస్తుంది; తెలుగులో బహువచన రూపం సహజంగా ఉంటుంది.
- source_word: וְאֶת
  choice: '[జాబితా విరామంతో వ్యక్తీకరించబడింది]'
  rationale: సంయోజక అవ్యయం జాబితాలోని అంశాలను కలుపుతుంది; ఆధునిక తెలుగు జాబితా శైలిలో మొదటి అనుసంధానం అల్పవిరామంతో సహజంగా వ్యక్తమవుతుంది, కర్మచిహ్నం విడిగా అనువదించబడదు.
- source_word: הַקְּנִזִּי
  choice: కెనిజ్జీయులను
  rationale: ఇది భూభాగంలో నివసించే ఒక ప్రజాసమూహపు జాతినామం; సమష్టి భావాన్ని తెలుగులో బహువచనంతో తెలిపాం.
- source_word: וְאֵת
  choice: '[జాబితా విరామంతో వ్యక్తీకరించబడింది]'
  rationale: చివరి అంశాన్ని జాబితాతో అనుసంధానించే సంయోజకం; మూలంలోని వరుసను సహజ తెలుగు జాబితా నిర్మాణంతో తెలిపాం.
- source_word: הַקַּדְמֹנִי
  choice: కద్మోనీయులను
  rationale: ఈ పదానికి ‘తూర్పు’తో వ్యుత్పత్తి సంబంధం ఉన్నప్పటికీ, ఇక్కడ ఇతర జాతినామాలతో సమాంతరంగా ఒక ప్రజాసమూహపు పేరుగా ఉంది; అందువల్ల పేరునే లిప్యంతరీకరించాం.
