  yaml_path: translation/ot/genesis/015/006.yaml
  text: And he believed Yahweh[c][b][a], and he counted it to him as righteousness.
translation:
  language: te
  text: అతడు యెహోవాను నమ్మాడు[a]; ఆయన దానిని అతనికి నీతిగా పరిగణించాడు[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘యెహోవాపై నమ్మకం ఉంచాడు.’
    reason: lexical_alternative
  - marker: b
    text: ‘పరిగణించాడు’ అనే మాటకు ‘లెక్కించాడు’ లేదా ‘అతని ఖాతాలో చేర్చాడు’ అనే భావం కూడా ఉంది.
    reason: lexical_alternative
  - marker: c
    text: హీబ్రూ వాక్యనిర్మాణాన్ని సాధారణంగా, యెహోవా అబ్రాము నమ్మడాన్ని అతనికి నీతిగా పరిగణించాడని అర్థం చేసుకుంటారు. తక్కువ సంభావ్యమైన మరో పఠనంలో అబ్రామే ‘పరిగణించాడు’ అనే క్రియకు కర్త.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהֶאֱמִן
  choice: నమ్మాడు
  rationale: אמן హిఫీల్ రూపం ఇక్కడ ఒకరిని నమ్మడం, ఆయనపై విశ్వాసం ఉంచడం అనే భావాన్ని ఇస్తుంది. ‘నమ్మాడు’ అనేది సహజమైన ఆధునిక తెలుగు; మూలంలోని క్రియారూపాన్ని కాపాడుతూ తరువాతి గ్రంథాంతర సంబంధాలకు అనవసరమైన వివరణను జోడించదు.
- source_word: בַּיהוָה
  choice: యెహోవాను
  rationale: בְ ఇక్కడ నమ్మకానికి సంబంధించిన వ్యక్తిని సూచిస్తుంది. తెలుగు వాడుకలో ‘నమ్ము’ సకర్మకంగా సహజంగా ఉండటంతో ‘యెహోవాను నమ్మాడు’ అని అనువదించబడింది. יהוה అనే వ్యక్తిగత నామానికి తెలుగులో స్థిరపడిన ‘యెహోవా’ రూపం వాడబడింది.
- source_word: וַיַּחְשְׁבֶהָ
  choice: ఆయన దానిని … పరిగణించాడు
  rationale: חשב అంటే లెక్కించు, ఎంచు, ఒక స్థితిగా పరిగణించు. ‘పరిగణించాడు’ ఆధునిక తెలుగులో స్పష్టంగా ఉండి, ఆపాదన/లెక్కింపు భావాన్ని మితంగా నిలుపుతుంది. స్త్రీలింగ ఏకవచన ప్రత్యయం ముందున్న అబ్రాము నమ్మిన చర్యను సూచించే అమూర్త ‘దానిని’గా ఇవ్వబడింది.
- source_word: לּוֹ
  choice: అతనికి
  rationale: לְ తో కూడిన సర్వనామ ప్రత్యయం ఏ వ్యక్తికి అది లెక్కించబడిందో సూచిస్తుంది; ‘అతనికి’ ఈ సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: צְדָקָה
  choice: నీతిగా
  rationale: צְדָקָה ఇక్కడ న్యాయవితరణకన్నా నీతి లేదా నీతిమంత స్థితిని సూచిస్తుంది. ‘నీతిగా’ మూలంలోని విధేయ భావాన్ని సంక్షిప్తంగా, సంప్రదాయపరమైన అదనపు వివరణ లేకుండా అందిస్తుంది.
theological_decisions:
- issue: ‘పరిగణించాడు’ అనే క్రియకు కర్త ఎవరు?
  choice: యెహోవానే కర్త; అబ్రాము నమ్మిన దానిని ఆయన అబ్రాముకు నీతిగా పరిగణించాడు.
  alternative: అబ్రామే కర్తగా ఉండి, ఆయనను/దానిని నీతిగా పరిగణించాడు.
  rationale: సందర్భంలోను విస్తృత గ్రంథ స్వీకరణలోను యెహోవాను కర్తగా తీసుకోవడం అత్యంత సహజం. ప్రధాన పాఠంలో ‘ఆయన’ ఈ సాధారణ పఠనాన్ని ఇస్తుంది; వ్యాకరణపరంగా చర్చించబడే తక్కువ సంభావ్యమైన ప్రత్యామ్నాయం పాదసూచికలో భద్రపరచబడింది.
- issue: స్త్రీలింగ ప్రత్యయం దేనిని సూచిస్తుంది?
  choice: అబ్రాము నమ్మిన చర్య లేదా అతని నమ్మకాన్ని సూచిస్తూ ‘దానిని’ అని అనువదించడం.
  alternative: ‘ఈ స్పందనను’ లేదా ‘విశ్వాసాన్ని’ అని స్పష్టీకరించడం.
  rationale: హీబ్రూలో ప్రత్యక్షంగా స్త్రీలింగ నామవాచకం లేకపోయినా, స్త్రీలింగ ప్రత్యయం ఒక అమూర్త చర్యను సూచించగలదు. ‘దానిని’ అని ఉంచడం ద్వారా మూలంలోని సంక్షిప్తత, కొంత సూచనాత్మకత నిలుస్తాయి; ‘విశ్వాసం’ అనే నామవాచకాన్ని అనువాదంలో అదనంగా చేర్చడం నివారించబడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. ‘నమ్మాడు,’ ‘పరిగణించాడు’ వంటి ప్రస్తుతకాల పాఠకులకు స్పష్టమైన క్రియారూపాలు ఎంచుకోబడ్డాయి. దైవనామానికి తెలుగులో విస్తృతంగా పరిచయమైన ‘యెహోవా’ రూపం ఉంచబడింది; ప్రధాన పాఠాన్ని అతిగా వివరణాత్మకం చేయకుండా వ్యాకరణ, పదార్థ ప్రత్యామ్నాయాలు పాదసూచికల్లో ఇవ్వబడ్డాయి.
