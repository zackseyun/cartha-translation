revisions:
- from: నాలుగో తరంలో వారు ఇక్కడికి తిరిగి వస్తారు; ఎందుకంటే అప్పటివరకు అమోరీయుల[a] దోషం పూర్తి స్థాయికి చేరదు.[b]
  to: నాలుగో తరంలో వారు ఇక్కడికి తిరిగి వస్తారు; ఎందుకంటే అమోరీయుల[a] దోషం ఇంకా పూర్తి స్థాయికి చేరలేదు.[b]
