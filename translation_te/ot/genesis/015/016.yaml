id: GEN.15.16
reference: Genesis 15:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/ד֥וֹר רְבִיעִ֖י יָשׁ֣וּבוּ הֵ֑נָּה כִּ֧י לֹא שָׁלֵ֛ם עֲוֺ֥ן הָ/אֱמֹרִ֖י עַד הֵֽנָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/016.yaml
  text: And in the fourth generation they will return here[b][a], for the iniquity of the Amorites is not yet complete.
translation:
  language: te
  text: నాలుగో తరంలో వారు ఇక్కడికి తిరిగి వస్తారు; ఎందుకంటే అమోరీయుల[a] దోషం ఇంకా పూర్తి స్థాయికి చేరలేదు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘అమోరీయుని’; ఇక్కడ ఏకవచన రూపం అమోరీ ప్రజలను సమష్టిగా సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా ‘ఇక్కడివరకు’; సందర్భంలో, అమోరీయుల దోషం ఆ సమయం వరకు ఇంకా పూర్తి స్థాయికి చేరలేదనే భావం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְדֹור רְבִיעִי
  choice: నాలుగో తరంలో
  rationale: דּוֹר ‘తరం’ అని, רְבִיעִי ‘నాలుగో’ అని అర్థం. గమనం జరిగే కాలాన్ని సహజమైన తెలుగులో ‘నాలుగో తరంలో’ అని వ్యక్తం చేశాం; ఆరంభ సంధికారకమైన וְను తెలుగు వాక్యప్రవాహంలో ప్రత్యేకంగా అనువదించాల్సిన అవసరం లేదు.
- source_word: יָשׁוּבוּ
  choice: వారు ... తిరిగి వస్తారు
  rationale: שׁוּב ఇక్కడ ముందున్న వారి సంతానం మళ్లీ ఈ దేశానికి రావడాన్ని సూచిస్తుంది. ‘తిరిగి వస్తారు’ కదలికను, తిరిగిరావడాన్ని రెండింటినీ సహజంగా తెలియజేస్తుంది.
- source_word: הֵנָּה
  choice: ఇక్కడికి
  rationale: ఈ దిశను సూచించే అవ్యయం గమ్యస్థాన భావంలో ఉంది; అందువల్ల ‘ఇక్కడికి’ అనేది తెలుగు ప్రయోగానికి సరిపోతుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: తిరిగిరావడంలో ఆలస్యానికి కారణాన్ని పరిచయం చేస్తుంది.
- source_word: לֹא שָׁלֵם
  choice: పూర్తి స్థాయికి చేరదు
  rationale: שָׁלֵם ఇక్కడ నిండుదల లేదా పరిపూర్ణ పరిమాణాన్ని సూచిస్తుంది. ‘పూర్తి స్థాయికి చేరదు’ అనే రూపం పాపం నిర్దిష్ట పరిమాణానికి చేరడం అనే రూపకాన్ని సహజ తెలుగులో నిలుపుతుంది.
- source_word: עֲוֹן
  choice: దోషం
  rationale: עָוֹן పాపం, అపరాధం, దోషభారం వంటి అర్థాలను కలిగి ఉండగలదు. ఇక్కడ నైతిక అపరాధాన్ని సూచించే, అతిగా వ్యాఖ్యానించని ‘దోషం’ ఎంచుకున్నాం.
- source_word: הָאֱמֹרִי
  choice: అమోరీయుల
  rationale: హీబ్రూలో ఏకవచన రూపం ఉన్నా అది ప్రజాజాతిని సమష్టిగా సూచించగలదు. ఆధునిక తెలుగులో ప్రజలను సూచించడానికి బహువచన రూపం సహజం; ఏకవచన సమష్టి రూపాన్ని పాదసూచికలో ఉంచాం.
- source_word: עַד הֵנָּה
  choice: అప్పటివరకు
  rationale: అక్షరార్థంగా ‘ఇక్కడివరకు’ అనే కాలసూచక ప్రయోగం. భవిష్యత్తులో చెప్పబడిన నాలుగో తరాన్ని దృష్టిలో ఉంచుకొని ‘అప్పటివరకు’ అని అనువదించాం; అక్షరార్థాన్ని పాదసూచికలో తెలిపాం.
theological_decisions:
- issue: తీర్పు ఆలస్యం మరియు అబ్రాము సంతానం తిరిగిరావడం
  choice: అమోరీయుల దోషం పూర్తి స్థాయికి చేరని కారణంగా నాలుగో తరం వరకు తిరిగిరావడం జరగదని మాత్రమే వాక్యం చెబుతున్నట్లుగా అనువదించాం.
  alternative: ఈ ఆలస్యం దేవుని సహనాన్ని ప్రధానంగా బోధిస్తుందని, లేదా ఐగుప్తులో ఇశ్రాయేలు రూపుదిద్దుకోవడానికే ప్రధానంగా ఏర్పాటైందని స్పష్టీకరించడం.
  rationale: మూలవాక్యం సమయానికి కారణంగా అమోరీయుల దోషం ఇంకా పూర్తికాకపోవడాన్ని మాత్రమే ప్రత్యక్షంగా పేర్కొంటుంది. దాని వెనుక విస్తృతమైన దైవసంకల్ప సిద్ధాంతాన్ని అనువాదంలో చేర్చకుండా theological tension ను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకులకు స్పష్టమైన శైలి. ‘పూర్తి స్థాయికి చేరదు’ అనే ప్రయోగం మూలంలోని నిండుదల భావాన్ని సహజంగా ఉంచుతుంది. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
