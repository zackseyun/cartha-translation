review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately conveys the fourth-generation return, the destination, and the stated causal relation. However, “అప్పటివరకు ... చేరదు” is less exact in aspect and temporal viewpoint than the Hebrew perfect with its present/future-contextual force: the Amorites’ iniquity is ‘not yet complete.’ Recasting it as “ఇంకా ... చేరలేదు” preserves the completed-state idiom and the not-yet sense more naturally.'
  naturalness: The wording is generally modern and clear. “ఇంకా పూర్తి స్థాయికి చేరలేదు” is more idiomatic Telugu than “అప్పటివరకు ... చేరదు,” while retaining the image of reaching a full measure.
  terminology: “అమోరీయుల” is an appropriate plural ethnonym for the collective Hebrew singular, and “దోషం” is a suitably non-sectarian rendering of עָוֹן in this context. The footnote correctly records the collective-singular alternative. The temporal footnote should state the literal phrase and its contextual force without wording that conflicts with the revised main text.
  issues:
  - severity: medium
    issue: Aspect and temporal phrasing in the final clause
    rationale: “అప్పటివరకు అమోరీయుల దోషం పూర్తి స్థాయికి చేరదు” can sound like a simple future prediction and makes ‘until then’ the main temporal expression. The Hebrew says that the iniquity is not yet complete, with עַד־הֵנָּה supporting that temporal limitation. “ఇంకా ... చేరలేదు” better represents this.
  - severity: low
    issue: Footnote b wording
    rationale: The existing explanation says “ఆ సమయానికి ... ఇంకా పూర్తి స్థాయికి చేరదనే,” using future ‘does not reach.’ It should align with the not-yet-complete sense and identify the literal expression as a temporal/deictic idiom.
  revised_text: నాలుగో తరంలో వారు ఇక్కడికి తిరిగి వస్తారు; ఎందుకంటే అమోరీయుల[a] దోషం ఇంకా పూర్తి స్థాయికి చేరలేదు.[b]
