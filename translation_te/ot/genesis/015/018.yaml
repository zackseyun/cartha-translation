  naturalness: ప్రస్తుత భాష ఆధునిక ప్రామాణిక తెలుగులో సహజంగానే ఉంది. సవరించిన వాక్యక్రమం ‘ఈ దేశాన్ని ఇచ్చాను’ అనే ప్రధాన ప్రకటనను సులభంగా గ్రహించనిస్తుంది; ‘మహానది, యూఫ్రటీసు’ అనే విరామచిహ్నం హెబ్రీలోని సమానాధికార వివరణను సహజంగా చూపుతుంది.
  terminology: ‘యాహ్వే,’ ‘నిబంధన,’ ‘సంతానం,’ ‘దేశం’ సరైన, స్థిరమైన పదప్రయోగాలు. ‘ఐగుప్తు నది’ని ప్రధాన పాఠంలో ఉంచి, ‘వాగు’ ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచడం మూలంలోని భౌగోళిక అనిశ్చితిని తగిన విధంగా కాపాడుతుంది.
  issues:
