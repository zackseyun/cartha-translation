id: GEN.15.18
reference: Genesis 15:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: בַּ/יּ֣וֹם הַ/ה֗וּא כָּרַ֧ת יְהוָ֛ה אֶת אַבְרָ֖ם בְּרִ֣ית לֵ/אמֹ֑ר לְ/זַרְעֲ/ךָ֗ נָתַ֨תִּי֙ אֶת הָ/אָ֣רֶץ הַ/זֹּ֔את מִ/נְּהַ֣ר מִצְרַ֔יִם עַד הַ/נָּהָ֥ר הַ/גָּדֹ֖ל נְהַר פְּרָֽת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/018.yaml
  text: On that day Yahweh made a covenant with Abram[a], saying, “To your offspring I have given this land, from the river of Egypt as far as the great river[b], the Euphrates.”
translation:
  language: te
  text: 'ఆ రోజున యాహ్వే అబ్రాముతో నిబంధన చేశాడు[a]. ఆయన ఇలా అన్నాడు: “నీ సంతానానికి ఈ దేశాన్ని ఇచ్చాను—ఐగుప్తు నది[b] నుండి మహానది, యూఫ్రటీసు వరకు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీలో అక్షరార్థంగా, “నిబంధనను కోశాడు.” ఇది నిబంధన చేయడాన్ని సూచించే నుడికారం; ఈ పరిచ్ఛేదంలో కనిపించే జంతువులను కోసే ఆచారంతో దీనికి సంబంధం ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ఐగుప్తు వాగు.” హెబ్రీలో “ఐగుప్తు నది” అని ఉంది; అయితే అది సూచించే ఖచ్చితమైన భౌగోళిక స్థలం వివాదాస్పదం.
    reason: alternative_reading
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: ఆ రోజున
  rationale: ఒక నిర్దిష్ట సందర్భాన్ని సూచించే సహజమైన ఆధునిక తెలుగు కాలప్రయోగం.
- source_word: כָּרַת ... בְּרִית
  choice: నిబంధన చేశాడు
  rationale: హెబ్రీ నుడికారానికి అక్షరార్థం ‘నిబంధనను కోశాడు.’ ప్రధాన పాఠంలో దాని భావాన్ని సహజంగా తెలిపి, ఆచారపరమైన నేపథ్యాన్ని పాదసూచికలో నిలిపాం.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పండితుల ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: אֶת אַבְרָם
  choice: అబ్రాముతో
  rationale: నిబంధన చేయడంలోని సంబంధ భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לֵאמֹר
  choice: ఆయన ఇలా అన్నాడు
  rationale: తదుపరి ప్రత్యక్ష వాక్యాన్ని సహజంగా పరిచయం చేస్తుంది.
- source_word: לְזַרְעֲךָ
  choice: నీ సంతానానికి
  rationale: זֶרַע పదంలోని సమష్టి ఏకవచన భావాన్ని ‘సంతానం’ సహజంగా నిలుపుతుంది; ‘వారసులు’ అని బహువచనంగా నిర్దిష్టం చేయదు.
- source_word: נָתַתִּי
  choice: ఇచ్చాను
  rationale: హెబ్రీ సంపూర్ణ క్రియారూపాన్ని నేరుగా ప్రతిబింబిస్తూ, ఒడంబడిక ప్రకటనలో అనుగ్రహం యొక్క నిశ్చయాన్ని నిలుపుతుంది.
- source_word: הָאָרֶץ הַזֹּאת
  choice: ఈ దేశాన్ని
  rationale: ప్రాదేశిక వాగ్దాన సందర్భంలో אֶרֶץకు ‘దేశం’ సహజమైన తెలుగు సమానార్థకం.
- source_word: מִנְּהַר מִצְרַיִם
  choice: ఐగుప్తు నది మొదలుకొని
  rationale: נָהָר సాధారణంగా ‘నది’ అని అర్థమవుతుంది. భౌగోళిక గుర్తింపు అనిశ్చితంగా ఉన్నందున ‘వాగు’ అనే ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: עַד הַנָּהָר הַגָּדֹל
  choice: మహానదియైన ... నది వరకు
  rationale: עַד సూచించే సరిహద్దు భావాన్ని ‘వరకు’ స్పష్టంగా తెలియజేస్తుంది; ‘మహానది’ని తరువాతి పేరుతో అన్వయిస్తుంది.
- source_word: נְהַר פְּרָת
  choice: యూఫ్రటీసు నది
  rationale: పేరుగల నదికి ఆధునిక తెలుగులో సుపరిచితమైన రూపం; ‘మహానది’తో ఉన్న సమానాధికార సంబంధం నిలిచింది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్ని నేరుగా వాడుతుంది. ‘యాహ్వే’ దానిని బిరుదుగా మార్చకుండా, ‘యెహోవా’ అనే సంప్రదాయ సంకర ఉచ్చారణను అనుసరించకుండా నిలుపుతుంది.
- issue: נָתַתִּיలో ఒడంబడిక అనుగ్రహం యొక్క క్రియాకాలం/క్రియాదృక్కోణం
  choice: ఇచ్చాను
  alternative: ఇస్తున్నాను; ఇచ్చి ఉన్నాను
  rationale: హెబ్రీ సంపూర్ణ రూపాన్ని గతకాల ప్రకటనగా నిలుపుతూ, వాగ్దానం నిశ్చయంగా అనుగ్రహించబడిందనే బలాన్ని కాపాడుతుంది; చారిత్రక స్వాధీనం అప్పటికే పూర్తయిందని అదనంగా తీర్మానించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వచనం. ‘నిబంధన,’ ‘సంతానం,’ ‘దేశం’ వంటి సామాన్య పాఠకులకు అర్థమయ్యే పదాలను వాడాం. మూలంలోని భౌగోళిక అనిశ్చితిని పాదసూచికలో నిలిపాం; దైవనామాన్ని ‘యాహ్వే’గా లిప్యంతరీకరించాం.
