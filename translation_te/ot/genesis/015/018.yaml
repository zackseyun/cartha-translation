revisions:
- from: 'ఆ రోజున యాహ్వే అబ్రాముతో నిబంధన చేశాడు[a]. ఆయన ఇలా అన్నాడు: “ఐగుప్తు నది[b] మొదలుకొని మహానదియైన యూఫ్రటీసు నది వరకు ఉన్న ఈ దేశాన్ని నీ సంతానానికి ఇచ్చాను.”'
  to: 'ఆ రోజున యాహ్వే అబ్రాముతో నిబంధన చేశాడు[a]. ఆయన ఇలా అన్నాడు: “నీ సంతానానికి ఈ దేశాన్ని ఇచ్చాను—ఐగుప్తు నది[b] నుండి మహానది, యూఫ్రటీసు వరకు.”'
