source:
  edition: WLC
  text: וְ/אֶת הַ/חִתִּ֥י וְ/אֶת הַ/פְּרִזִּ֖י וְ/אֶת הָ/רְפָאִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/020.yaml
  text: and the Hittites[a], and the Perizzites, and the Rephaim,
translation:
  language: te
  text: హిత్తీయులను, పెరిజ్జీయులను, రెఫాయీయులను[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దైత్యులు.” హీబ్రూ పదమైన రెఫాయీమ్‌ను కొన్ని సందర్భాల్లో వర్ణనాత్మకంగా అర్థం చేసుకోవచ్చు; అయితే ఇక్కడ అది ఆ దేశంలోని ఒక జనసమూహాన్ని సూచించే అవకాశం ఎక్కువ.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת
  choice: -ను (జాబితా కొనసాగింపులో)
  rationale: וְ కలిసిన ప్రత్యక్ష కర్మ సూచిక אֵת, ముందటి వచనం నుంచి కొనసాగుతున్న జనసమూహాల జాబితాలో ప్రతి అంశాన్ని పరిచయం చేస్తుంది. తెలుగులో కర్మవిభక్తి ‘-ను’తో సంబంధం సహజంగా వ్యక్తమవుతుంది; పునరావృత ‘మరియు’ అవసరం లేదు.
- source_word: הַחִתִּי
  choice: హిత్తీయులను
  rationale: హీబ్రూలో వ్యాకరణపరంగా ఏకవచన రూపమైనా, నిర్దిష్ట ఉపపదంతో ఇది ఒక జనసమూహాన్ని సమష్టిగా సూచిస్తుంది. అందుకే తెలుగులో బహువచన జాతినామం వాడబడింది.
- source_word: הַפְּרִזִּי
  choice: పెరిజ్జీయులను
  rationale: ఈ ఏకవచన జాతివాచక రూపం ఇక్కడ సమష్టిగా ఒక జనసమూహాన్ని సూచిస్తుంది; తెలుగులో బహువచన జాతినామం ఆ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: הָרְפָאִים
  choice: రెఫాయీయులను
  rationale: ఈ భూభాగంలోని జనాల జాబితాలో רְפָאִים ఒక జనసమూహపు పేరుగా ఉండటం సందర్భానికి అత్యంత అనుకూలం. ‘దైత్యులు’ అనే వ్యాఖ్యానాన్ని ప్రధాన పాఠ్యంలో చేర్చకుండా పేరును లిప్యంతరీకరించడం మూలంలోని నామస్వరూపాన్ని కాపాడుతుంది.
theological_decisions:
- issue: רְפָאִים అనే పదాన్ని జనసమూహపు పేరుగా అనువదించాలా, లేక వర్ణనాత్మకంగా అర్థం చెప్పాలా
  choice: ‘రెఫాయీయులు’ అనే జాతినామంగా ఇవ్వబడింది
  alternative: దైత్యులు
  rationale: ఆదికాండం 15:19–21లో అబ్రాముకు వాగ్దానం చేసిన దేశంలో నివసించే జనసమూహాల పేర్లు వరుసగా ఉన్నాయి. కాబట్టి ఇక్కడ జాతినామమే సందర్భానికి బలమైన అర్థం. ఇతర సందర్భాల్లో కనిపించే ‘దైత్యులు’ అనే సాంప్రదాయ అనుబంధాన్ని పాదసూచికలో ఉంచడం ద్వారా మూలంలోని సాధ్యమైన భావభేదం నిలుపబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైన సాధారణ శైలిని ఉపయోగించాం. ఇది ముందటి వచనం నుంచి కొనసాగుతున్న జాబితా కావడంతో తెలుగు వాక్యనిర్మాణానికి సహజంగా ప్రతి జాతినామానికి కర్మవిభక్తి జోడించబడింది. పాదసూచిక గుర్తు అది వివరిస్తున్న ‘రెఫాయీయులను’ పదానికే అమర్చబడింది.
