source:
  edition: WLC
  text: וַ/יְהִ֤י הַ/שֶּׁ֨מֶשׁ֙ לָ/ב֔וֹא וְ/תַרְדֵּמָ֖ה נָפְלָ֣ה עַל אַבְרָ֑ם וְ/הִנֵּ֥ה אֵימָ֛ה חֲשֵׁכָ֥ה גְדֹלָ֖ה נֹפֶ֥לֶת עָלָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/012.yaml
  text: As the sun was going down[a], a deep sleep fell upon Abram. And behold[b], a great dark dread fell upon him.
translation:
  language: te
  text: సూర్యుడు అస్తమించబోతుండగా, అబ్రాముకు గాఢనిద్ర[a] పట్టింది. ఇదిగో, గొప్ప చీకటి భయం[b] అతని మీద పడింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘పరవశ స్థితి.’ హీబ్రూ పదం అసాధారణంగా గాఢమైన, బహుశా దైవికంగా కలిగిన నిద్రను సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘చీకటి యొక్క గొప్ప భయం’ లేదా ‘గొప్ప చీకటిమయమైన భయం.’ హీబ్రూ భయం, చీకటి అనే భావాలను సజీవమైన సంక్షిప్త పదబంధంలో కలుపుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי הַשֶּׁמֶשׁ לָבוֹא
  choice: సూర్యుడు అస్తమించబోతుండగా
  rationale: సూర్యుడు అస్తమించే సమయం సమీపిస్తున్నదనే హీబ్రూ కాలభావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; ప్రత్యేకమైన ‘ఇప్పుడు’ అనే పదాన్ని చేర్చదు.
- source_word: תַרְדֵּמָה
  choice: గాఢనిద్ర
  rationale: ఈ పదం సాధారణ నిద్రకన్నా తీవ్రమైన, సందర్భానుసారం దేవునివల్ల కలిగినదై ఉండగల నిద్రను సూచిస్తుంది. ‘మైకం’ అనే వ్యాఖ్యానాత్మక భావాన్ని ప్రధాన పాఠ్యంలో రుద్దకుండా ప్రత్యామ్నాయంగా పాదసూచికలో ఉంచాం.
- source_word: נָפְלָה עַל אַבְרָם
  choice: అబ్రాముకు ... పట్టింది
  rationale: ‘మీద పడింది’ అనే హీబ్రూ నుడికారాన్ని తెలుగులో నిద్రకు సహజంగా వినిపించే ‘నిద్ర పట్టింది’గా అందిస్తుంది.
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: ఆకస్మికంగా దృష్టిని ఆకర్షించే హీబ్రూ పదంలోని సజీవమైన కథన బలాన్ని నిలుపుతుంది.
- source_word: אֵימָה חֲשֵׁכָה גְדֹלָה
  choice: గొప్ప చీకటి భయం
  rationale: భయం, చీకటి అనే భావాలను హీబ్రూ ఒక గాఢమైన సంక్షిప్త పదబంధంగా కలుపుతుంది. వాటి సంబంధాన్ని పూర్తిగా వివరిస్తూ అర్థాన్ని ముందుగానే నిర్ణయించకుండా తెలుగులోనూ ఆ సాంద్రతను సాధ్యమైనంతవరకు నిలుపుతుంది.
- source_word: נֹפֶלֶת עָלָיו
  choice: అతని మీద పడింది
  rationale: ‘మీద పడడం’ అనే మూలపాఠ్య రూపకాన్ని నిలుపుతూ, తెలుగు కథనంలో సహజమైన పూర్తి క్రియగా అందిస్తుంది.
- source_word: אַבְרָם
  choice: అబ్రాము
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపాన్ని ఉపయోగిస్తుంది.
theological_decisions:
- issue: దర్శనాత్మక సందర్భంలో תַּרְדֵּמָה స్వభావం
  choice: గాఢనిద్ర
  alternative: మైకం
  rationale: నిబంధన-దర్శన సందర్భం అసాధారణ అనుభవాన్ని సూచించవచ్చు; అయినా మూలపదం నేరుగా గాఢనిద్రను సూచిస్తుంది. కాబట్టి బలమైన వ్యాఖ్యానాన్ని ప్రధాన పాఠ్యంలో పెట్టకుండా ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- issue: אֵימָה חֲשֵׁכָה గల సంక్షిప్త సంబంధం
  choice: గొప్ప చీకటి భయం
  alternative: మహా చీకటి కలిగించిన భయం; గొప్ప చీకటిమయమైన భయం
  rationale: చీకటి భయానికి కారణమా, దాని లక్షణమా, లేక దానితో సమాంతరంగా ఉన్న అనుభవమా అన్నది హీబ్రూ స్పష్టంగా విడదీయదు. ప్రధాన పాఠ్యం ఆ ఉద్దేశపూర్వక సాంద్రతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరమైన కథన శైలి. ‘ఇదిగో’ మూలపాఠ్యంలోని దృష్టి ఆకర్షణను నిలుపుతుంది. ప్రధాన పాఠ్యంలో రెండు పాదసూచిక గుర్తులు వాటి సంబంధిత పదబంధాల వెంట ఉంచబడ్డాయి.
