  text: And the birds of prey came down on the carcasses[a], and Abram drove them away.
translation:
  language: te
  text: మాంసాహారి పక్షులు ఆ కళేబరాల మీదికి దిగివచ్చాయి[a], మరియు అబ్రాము వాటిని తరిమివేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఒక మాంసాహారి పక్షి ఆ కళేబరాల మీదికి దిగివచ్చింది.” హీబ్రూ నామవాచకం ఏకవచన రూపంలో ఉన్నప్పటికీ, దానిని సమూహవాచకంగా కూడా అర్థం చేసుకోవచ్చు; ఇక్కడ మృత జంతువులను తినే పక్షుల సమూహం అనే భావమే ఎక్కువ సంభావ్యంగా ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: దిగివచ్చాయి
  rationale: ירד కిందికి వచ్చే కదలికను సూచిస్తుంది. సమూహార్థకంగా తీసుకున్న పక్షులకు అనుగుణంగా బహువచన క్రియను వాడటం సహజమైన ఆధునిక తెలుగు.
- source_word: הָעַיִט
  choice: మాంసాహారి పక్షులు
  rationale: עַיִט ఒకే పక్షిని సూచించగలిగినా, సమూహవాచకంగా మృతదేహాలను తినే పక్షులను కూడా సూచిస్తుంది. ‘రాబందులు’ అనడం హీబ్రూ పదం కంటే మరీ నిర్దిష్టం; ‘మాంసాహారి పక్షులు’ విస్తృతార్థాన్ని కాపాడుతుంది.
- source_word: הַפְּגָרִים
  choice: కళేబరాలు
  rationale: פֶּגֶר చనిపోయిన దేహం లేదా జంతు కళేబరాన్ని సూచిస్తుంది. ఇక్కడ బలి కోసం వధించిన జంతువుల సందర్భంలో ‘కళేబరాలు’ ఖచ్చితంగా, గౌరవప్రదంగా సరిపోతుంది.
- source_word: וַיַּשֵּׁב אֹתָם
  choice: వాటిని తరిమివేశాడు
  rationale: שוב యొక్క హిఫీల్ రూపం ఇక్కడ వెనక్కి మళ్లించడం లేదా దూరం చేయడం అనే భావాన్ని ఇస్తుంది. ‘తరిమివేశాడు’ అబ్రాము చేసిన క్రియాశీల నిరోధాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אַבְרָם
  choice: అబ్రాము
  rationale: ఈ కథన దశలో పితామహుని పేరు ఇంకా అబ్రాము; అబ్రాహాము కాదు.
