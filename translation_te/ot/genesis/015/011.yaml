translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. హీబ్రూ వావ్ సంధిని అదనపు విరోధార్థం కలపకుండా సెమికోలన్‌తో వరుస చర్యలుగా చూపించాం; సమూహవాచక పఠనాన్ని ప్రధాన పాఠ్యంలో ఉంచి నిజమైన ఏకవచన ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో నిలిపాం.
