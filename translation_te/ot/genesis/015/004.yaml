source:
  edition: WLC
  text: וְ/הִנֵּ֨ה דְבַר יְהוָ֤ה אֵלָי/ו֙ לֵ/אמֹ֔ר לֹ֥א יִֽירָשְׁ/ךָ֖ זֶ֑ה כִּי אִם֙ אֲשֶׁ֣ר יֵצֵ֣א מִ/מֵּעֶ֔י/ךָ ה֖וּא יִֽירָשֶֽׁ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/004.yaml
  text: And behold, the word of the LORD came to him, saying, “This man will not be your heir; rather, one who comes from your own body will be your heir.”
translation:
  language: te
  text: 'ఇదిగో, యెహోవా వాక్కు అతనికి వచ్చింది: “ఇతడు నీకు వారసుడు కాడు; నీ సొంత శరీరం నుండి వచ్చేవాడే నీకు వారసుడు అవుతాడు.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִנֵּה
  choice: అప్పుడు ఇదిగో
  rationale: కథనంలోని ఆకస్మిక దైవిక ప్రత్యుత్తరాన్ని, దృష్టి ఆకర్షించే హీబ్రూ ప్రయోగాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: דְבַר יְהוָה
  choice: యెహోవా వాక్కు
  rationale: దైవనామాన్ని పేరుగానే ఉంచుతూ, ప్రవచనాత్మక సందేశాన్ని సూచించే స్థిరమైన బైబిలు పదబంధాన్ని ఉపయోగిస్తుంది.
- source_word: לֹא יִירָשְׁךָ זֶה
  choice: ఇతడు నీకు వారసుడు కాడు
  rationale: זֶה అనే సమీప సూచనను ‘ఇతడు’గా, ירשׁ యొక్క సందర్భోచిత వారసత్వ భావాన్ని ‘వారసుడు’గా వ్యక్తం చేస్తుంది.
- source_word: אֲשֶׁר יֵצֵא מִמֵּעֶיךָ
  choice: నీ కడుపున పుట్టేవాడు
  rationale: అక్షరార్థంగా ‘నీ అంతర్భాగాలనుండి బయటికి వచ్చేవాడు’; సహజ తెలుగు బంధుత్వ ప్రయోగంలో అబ్రాముకు శారీరకంగా జన్మించే సంతానాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: הוּא יִירָשֶׁךָ
  choice: వాడే నీకు వారసుడు అవుతాడు
  rationale: הוּא యొక్క ఉద్ఘాటనను ‘వాడే’తో నిలుపుతూ ముందటి నిరాకరణకు బలమైన వ్యత్యాసాన్ని చూపిస్తుంది.
theological_decisions:
- issue: వారసుని గుర్తింపు మరియు శారీరక వంశసంబంధం
  choice: ‘నీ కడుపున పుట్టేవాడే’ అని అనువదించడం
  alternative: ‘నీ సొంత శరీరం నుండి వచ్చేవాడే’
  rationale: వాక్యం చెప్పేదానికంటే ముందుకు వెళ్లి తరువాతి కథనంలోని వ్యక్తిని ఇక్కడే పేరుపెట్టకుండా, అబ్రాము నుండే పుట్టే వ్యక్తి అనే మూలపాఠ భావాన్ని కాపాడుతుంది.
- issue: దైవనామం יהוה
  choice: ‘యెహోవా’
  alternative: ‘ప్రభువు’
  rationale: మూలంలోని వ్యక్తిగత దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా పారదర్శకంగా సూచిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనా సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే కథన శైలి. మూలంలోని ‘ఇదిగో’ అనే దృష్టి ఆకర్షణను, ‘వాడే’ అనే ఉద్ఘాటనను నిలుపుకుంది.
