source:
  edition: WLC
  text: וַ/יּוֹצֵ֨א אֹת֜/וֹ הַ/ח֗וּצָ/ה וַ/יֹּ֨אמֶר֙ הַבֶּט נָ֣א הַ/שָּׁמַ֗יְמָ/ה וּ/סְפֹר֙ הַ/כּ֣וֹכָבִ֔ים אִם תּוּכַ֖ל לִ/סְפֹּ֣ר אֹתָ֑/ם וַ/יֹּ֣אמֶר ל֔/וֹ כֹּ֥ה יִהְיֶ֖ה זַרְעֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/005.yaml
  text: Then he brought him outside and said[a], “Please look toward the heavens and count the stars, if you are able to count them.” Then he said to him, “So shall your offspring be.”
translation:
  language: te
  text: అప్పుడు ఆయన అతన్ని బయటికి తీసుకువచ్చి, “దయచేసి ఆకాశం వైపు చూడు; నక్షత్రాలను లెక్కపెట్టు. వాటిని లెక్కించగలవా?” అన్నాడు. తరువాత ఆయన అతనితో, “నీ సంతానం[a] అలాగే ఉంటుంది” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నీ విత్తనం.” హెబ్రీ నామవాచకం రూపంలో ఏకవచనమైనా, సమూహార్థంలో సంతానమంతటినీ సూచించగలదు.
    reason: זַרְעֶךָ అనే పదంలోని రూపక ఏకవచనం మరియు సమూహార్థం రెండింటినీ పాఠకునికి తెలియజేయడం.
lexical_decisions:
- source_word: וַיּוֹצֵא אֹתוֹ הַחוּצָה
  choice: అతన్ని బయటికి తీసుకువచ్చి
  rationale: హిఫిల్ క్రియలోని ‘బయటికి వెళ్లేలా చేయడం’ అనే కారణార్థాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: הַבֶּט נָא
  choice: దయచేసి ... చూడు
  rationale: ఆజ్ఞార్థక ‘చూడు’తో పాటు נָא సూచించే వినయపూర్వక విజ్ఞప్తి లేదా ప్రోత్సాహ స్వరాన్ని వ్యక్తపరుస్తుంది.
- source_word: הַשָּׁמַיְמָה
  choice: ఆకాశం వైపు
  rationale: దిశను సూచించే హెబ్రీ రూపాన్ని ‘వైపు’ నిలుపుతుంది; హెబ్రీ బహువచనానికి పదానువాదంగా ‘ఆకాశాలు’ అనడం కంటే ‘ఆకాశం’ ఆధునిక తెలుగులో సహజం.
- source_word: וּסְפֹר אֶת־הַכּוֹכָבִים
  choice: నక్షత్రాలను లెక్కపెట్టు
  rationale: లెక్కించడం అనే ప్రత్యక్ష భావాన్ని స్పష్టంగా, సహజంగా అందిస్తుంది.
- source_word: אִם תּוּכַל לִסְפֹּר אֹתָם
  choice: ఒకవేళ వాటిని లెక్కపెట్టగలిగితే
  rationale: నక్షత్రాలను లెక్కించే సామర్థ్యంపై ఉన్న షరతును నిలుపుతుంది; ఆశ్చర్యార్థక విరామం ఆ సవాలుతో కూడిన వాక్య స్వరాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: כֹּה יִהְיֶה
  choice: అలాగే ఉంటుంది
  rationale: ముందు చూపించిన లెక్కలేనన్ని నక్షత్రాలతో చేసే పోలికను సంక్షిప్తంగా, సహజంగా నిలుపుతుంది.
- source_word: זַרְעֶךָ
  choice: నీ సంతానం
  rationale: రూపంలో ఏకవచనమైనా సమూహార్థం కలిగిన హెబ్రీ పదాన్ని ‘సంతానం’ సహజంగా వ్యక్తపరుస్తుంది; దాన్ని తప్పనిసరిగా బహువచన వారసులకే పరిమితం చేయదు.
theological_decisions:
- issue: అబ్రాహాముకు చేసిన వాగ్దానంలో זַרְעֶךָ యొక్క ఏకవచన/సమూహార్థ అనునాదం
  choice: నీ సంతానం
  alternative: నీ విత్తనం; నీ సంతతివారు
  rationale: ‘సంతానం’ తెలుగులో వ్యక్తినీ సమూహాన్నీ సూచించగలదు. అందువల్ల హెబ్రీ పదంలోని సమూహార్థాన్ని సహజంగా తెలియజేస్తూనే, తరువాతి ధార్మిక పఠనాలకు సంబంధించిన ఏకవచన అనునాదాన్ని ముందుగానే తొలగించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. మూలంలోని సర్వనామ ఆధారిత కథనాన్ని అనవసరంగా దేవుని పేరుతో విస్తరించలేదు. దేవుడు అబ్రాముతో నేరుగా మాట్లాడే సందర్భంలో ఏకవచన ఆజ్ఞారూపాలు ‘చూడు,’ ‘లెక్కపెట్టు’ వాడబడ్డాయి.
