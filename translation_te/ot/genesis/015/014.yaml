id: GEN.15.14
reference: Genesis 15:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/גַ֧ם אֶת הַ/גּ֛וֹי אֲשֶׁ֥ר יַעֲבֹ֖דוּ דָּ֣ן אָנֹ֑כִי וְ/אַחֲרֵי כֵ֥ן יֵצְא֖וּ בִּ/רְכֻ֥שׁ גָּדֽוֹל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/014.yaml
  text: But I will also judge the nation that they serve[b][a], and afterward they will come out with great possessions.
translation:
  language: te
  text: అయితే వారు సేవచేసే ఆ దేశానికి కూడా నేను తీర్పు తీరుస్తాను; ఆ తరువాత వారు గొప్ప ఆస్తిపాస్తులతో[a] బయటకు వస్తారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఎంతో సంపదతో’ లేదా ‘ఎన్నో వస్తువులతో.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: అయితే ... కూడా
  rationale: వావ్ కొనసాగింపును, גַם అదనపు ఉద్ఘాటనను సూచిస్తున్నాయి. ముందటి శ్రమతో ఉన్న వ్యత్యాసాన్ని సహజ తెలుగులో చూపుతూ, అదనపు భావాన్ని ‘కూడా’ నిలుపుతుంది.
- source_word: הַגּוֹי
  choice: ఆ జనం
  rationale: గּוֹי అంటే ‘జనం/దేశం’. ఇక్కడ అబ్రాము సంతానం సేవచేసే విదేశీ ప్రజాసమూహాన్ని సూచిస్తున్నందున ‘ఆ జనం’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: אֲשֶׁר יַעֲבֹדוּ
  choice: వారు సేవచేసే
  rationale: עבד యొక్క ప్రత్యక్ష భావమైన ‘సేవచేయడం’ను నిలుపుతుంది. సందర్భంలో బలవంతపు సేవ సూచితమైనా, దానిని ప్రధాన పాఠ్యంలో ‘బానిసత్వం’గా విస్తరించి చెప్పలేదు.
- source_word: דָּן אָנֹכִי
  choice: నేనే తీర్పుతీరుస్తాను
  rationale: దాన్ న్యాయపరమైన ‘తీర్పుతీర్చడం’ భావాన్ని కలిగి ఉంది; ఆనోఖీతో కర్తకు ఉద్ఘాటన ఉంది. సందర్భానుసారమైన భవిష్యత్ భావాన్ని ‘తీరుస్తాను’, ఉద్ఘాటనను ‘నేనే’ తెలియజేస్తాయి.
- source_word: וְאַחֲרֵי כֵן
  choice: ఆ తరువాత
  rationale: సంఘటనల కాలక్రమాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: יֵצְאוּ
  choice: బయటకు వస్తారు
  rationale: יצא యొక్క ‘బయటకు వెళ్లడం/రావడం’ భావాన్ని, నిర్బంధ స్థితి నుండి నిష్క్రమించడాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בִּרְכֻשׁ גָּדוֹל
  choice: గొప్ప సంపదతో
  rationale: רְכוּשׁ ఆస్తి, వస్తుసంపద, స్వాధీనాలు అనే భావాలను కలిగి ఉంది. ‘గొప్ప సంపదతో’ పరిమాణాత్మక విస్తారాన్ని సహజ ఆధునిక తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: పీడించే జనంపై దేవుని చర్య స్వభావం
  choice: తీర్పుతీరుస్తాను
  alternative: శిక్షిస్తాను
  rationale: דָּן న్యాయనిర్ణయ భాష. ‘తీర్పుతీరుస్తాను’ న్యాయపరమైన, నైతిక భావాన్ని నిలుపుతూ, ఫలితాన్ని కేవలం ‘శిక్ష’గా సంకుచితం చేయదు.
- issue: వారు ఆ జనానికి చేసే సేవ స్వభావం
  choice: సేవచేసే
  alternative: బానిసలుగా ఉండే
  rationale: హీబ్రూ క్రియ ప్రత్యక్షంగా ‘సేవచేయు’ అని చెబుతుంది. సందర్భం బలవంతపు సేవను సూచించినప్పటికీ, మూలపాఠ్యంలోని పదప్రయోగాన్ని ప్రధాన వాక్యంలో నిలిపి అనవసరమైన నిర్దిష్టీకరణను నివారించింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘నేనే’ ద్వారా హీబ్రూ స్వతంత్ర సర్వనామంలోని ఉద్ఘాటనను నిలిపాం; ‘సేవచేసే’ ద్వారా మూలంలోని ఉద్దేశపూర్వక అస్పష్టతను కాపాడాం.
