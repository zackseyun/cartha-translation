source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אַבְרָ֗ם אֲדֹנָ֤/י יֱהוִה֙ מַה תִּתֶּן לִ֔/י וְ/אָנֹכִ֖י הוֹלֵ֣ךְ עֲרִירִ֑י וּ/בֶן מֶ֣שֶׁק בֵּיתִ֔/י ה֖וּא דַּמֶּ֥שֶׂק אֱלִיעֶֽזֶר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/002.yaml
  text: But Abram said[a], “Lord Yahweh, what will you give me, since I am going childless, and the heir of my house is Eliezer of Damascus?”
translation:
  language: te
  text: 'అయితే అబ్రాము ఇలా అన్నాడు: “ప్రభువైన యహ్వే, నేను సంతానం లేకుండానే చనిపోబోతున్నాను కదా; నీవు నాకు ఏమి ఇస్తావు? దమస్కుకు చెందిన ఎలీయెజెరే నా ఇంటి వారసుడు[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీలో అక్షరార్థంగా, ‘నా ఇంటి మెషెక్ కుమారుడు’ అనే అసాధారణ పదబంధం ఉంది. దీనికి ‘నా ఇంటి నిర్వాహకుడు’ లేదా ‘నా ఇంటిని స్వాధీనం చేసుకునేవాడు/వారసుడు’ అనే అర్థాలు సాధ్యమని భావిస్తారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అయితే అబ్రాము … అన్నాడు
  rationale: వావ్-క్రమరూపం కథనాన్ని ముందుకు నడిపిస్తుంది; మునుపటి వాగ్దానానికి అబ్రాము తన ఆందోళనతో ప్రతిస్పందిస్తున్నందున ‘అయితే’ సందర్భంలోని వ్యతిరేక మలుపును సహజంగా తెలియజేస్తుంది.
- source_word: אֲדֹנָי יֱהוִה
  choice: ప్రభువైన యహ్వే
  rationale: אֲדֹנָי అనే ‘ప్రభువు/యజమాని’ బిరుదును, יֱהוִה అనే దైవనామాన్ని రెండింటినీ స్పష్టంగా నిలుపుతుంది.
- source_word: מַה תִּתֶּן לִי
  choice: నీవు నాకు ఏమి ఇస్తావు?
  rationale: అసంపూర్ణ క్రియారూపం ఈ సందర్భంలో భవిష్య భావాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: וְאָנֹכִי הוֹלֵךְ עֲרִירִי
  choice: నేను సంతానం లేకుండానే వెళ్లిపోతున్నాను
  rationale: ‘వెళ్తున్నాను’ అనే మూల రూపకాన్ని నిలుపుతూ, עֲרִירִי యొక్క ‘సంతానం లేని’ భావాన్ని స్పష్టంగా తెలుపుతుంది; ఇది మరణం వైపు సాగడాన్ని సూచించవచ్చు గాని పాఠ్యంలో దానిని మరీ నిర్దిష్టం చేయదు.
- source_word: בֶן מֶשֶׁק בֵּיתִי
  choice: నా ఇంటి వారసుడు
  rationale: అత్యంత అసాధారణమైన హెబ్రీ పదబంధానికి సందర్భానుసారంగా ఆస్తిని పొందబోయే వ్యక్తి అనే భావం సరిపోతుంది. మూలపదబంధంలోని సందిగ్ధతను పాదసూచికలో ఉంచాం.
- source_word: דַּמֶּשֶׂק אֱלִיעֶזֶר
  choice: దమస్కువాడైన ఎలీయెజెరు
  rationale: ఎలీయెజెరును దమస్కుతో అతని మూలం లేదా అనుబంధం ద్వారా గుర్తించే సహజమైన తెలుగు రూపం.
theological_decisions:
- issue: אֲדֹנָי יֱהוִה అనే సంయుక్త సంబోధనలో దైవనామం
  choice: ప్రభువైన యహ్వే
  alternative: ప్రభువైన దేవుడు
  rationale: ‘యహ్వే’ అని లిప్యంతరీకరించడం దైవనామాన్ని సాధారణ బిరుదుతో భర్తీ చేయకుండా కాపాడుతుంది; ‘ప్రభువైన’ అనే పదం אֲדֹנָי ని కూడా నిలుపుతుంది.
- issue: బెన్ మెషెక్ బేతీ అనే అస్పష్ట పదబంధం
  choice: నా ఇంటి వారసుడు
  alternative: నా ఇంటి నిర్వాహకుడు / నా ఇంటి స్వాధీనకర్త
  rationale: తరువాతి వచనంలోని వారసత్వ సందర్భం ‘వారసుడు’ అనే అర్థానికి మద్దతిస్తుంది; అయినా మూలపదబంధం అసాధారణంగా ఉన్నందున ఇతర సాధ్యార్థాలను పాదసూచికలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన శైలి. మూలంలోని ‘వెళ్లిపోతున్నాను’ రూపకాన్ని అలాగే ఉంచి, మరణాన్ని నేరుగా చేర్చలేదు. అస్పష్టమైన వారసత్వ పదబంధాన్ని ప్రధాన పాఠ్యంలో సందర్భోచితంగా అనువదించి, దాని నిజమైన పదసందిగ్ధతను పాదసూచికలో కాపాడాం.
