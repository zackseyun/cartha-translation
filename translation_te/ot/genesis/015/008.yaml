source:
  edition: WLC
  text: וַ/יֹּאמַ֑ר אֲדֹנָ֣/י יֱהוִ֔ה בַּ/מָּ֥ה אֵדַ֖ע כִּ֥י אִֽירָשֶֽׁ/נָּה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/008.yaml
  text: And he said[a], “Lord Yahweh, how will I know that I will possess it?”
translation:
  language: te
  text: అప్పుడు అతడు, “ప్రభువైన యాహ్వే, నేను దానిని స్వాధీనంగా పొందుతానని నాకు దేనివల్ల తెలుస్తుంది?[a]” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నేను దానిని వారసత్వంగా పొందుతానని నాకు దేనివల్ల తెలుస్తుంది?”
    reason: ירשׁ అనే క్రియకు ఇక్కడ ‘స్వాధీనంగా పొందడం’తో పాటు ‘వారసత్వంగా పొందడం’ అనే అర్థం కూడా ఉండవచ్చు.
lexical_decisions:
- source_word: וַיֹּאמַר
  choice: అప్పుడు అతడు … అన్నాడు
  rationale: వయ్యిక్తోల్ కథన రూపం కథను ముందుకు నడిపిస్తుంది. ఆధునిక తెలుగు కథనశైలిలో ‘అప్పుడు’ సహజంగా ఆ కొనసాగింపును తెలియజేస్తుంది.
- source_word: אֲדֹנָי יֱהוִה
  choice: ప్రభువైన యాహ్వే
  rationale: אֲדֹנָי అనే బిరుదును, יהוה అనే దైవనామాన్ని రెండింటినీ స్పష్టంగా నిలుపుతూ తెలుగులో సహజమైన సంబోధనగా అందిస్తుంది.
- source_word: בַּמָּה
  choice: దేనివల్ల
  rationale: అక్షరార్థంగా ‘దేనిచేత/దేనివల్ల?’ అని, అబ్రాము కోరుతున్న నిర్ధారణకు సాధనం లేదా సూచన ఏమిటని అడుగుతుంది. ఇది మూలంలోని సాధనార్థక భావాన్ని ‘ఎలా’ కంటే స్పష్టంగా నిలుపుతుంది.
- source_word: אֵדַע
  choice: తెలుసుకోగలను
  rationale: ידע క్రియ యొక్క ప్రథమ పురుష ఏకవచన అసంపూర్ణ రూపం ఈ ప్రశ్నలో భవిష్య నిర్ధారణను సూచిస్తుంది; ‘తెలుసుకోగలను’ ఆధునిక తెలుగులో సహజమైన ప్రశ్నారూపం.
- source_word: כִּי
  choice: అని
  rationale: అబ్రాము తెలుసుకోవాలనుకున్న విషయాన్ని పరిచయం చేసే పూరక సంధిగా పనిచేస్తుంది.
- source_word: אִירָשֶׁנָּה
  choice: నేను దానిని స్వాధీనం చేసుకుంటాను
  rationale: ירשׁ ఇక్కడ ముందటి వచనంలోని దేశాన్ని వాస్తవంగా సొంతం చేసుకోవడం లేదా స్వాధీనపరచుకోవడం అనే భావాన్ని ఇస్తుంది. ‘వారసత్వంగా పొందడం’ కూడా సాధ్యమైన అర్థం కాబట్టి పాదసూచికలో ఉంచబడింది.
theological_decisions:
- issue: אֲדֹנָי יֱהוִה అనే సంయుక్త సంబోధనలో దైవనామం
  choice: ప్రభువైన యాహ్వే
  alternative: ప్రభువైన దేవా
  rationale: మూలపాఠంలోని יהוה అనే ప్రత్యేక దైవనామాన్ని సాధారణ బిరుదుతో భర్తీ చేయకుండా ‘యాహ్వే’గా నిలుపుతుంది; అదే సమయంలో אֲדֹנָי అనే ‘ప్రభువు’ బిరుదును కూడా కాపాడుతుంది.
- issue: ירשׁ యొక్క భూవాగ్దాన సంబంధ భావం
  choice: స్వాధీనం చేసుకుంటాను
  alternative: వారసత్వంగా పొందుతాను
  rationale: భూమిని వాస్తవంగా పొందే భావాన్ని ప్రధాన పాఠంలో సహజంగా తెలియజేస్తూ, వారసత్వ సంబంధమైన సాధ్యమైన నుడికారాన్ని పాదసూచికలో నిలుపుతుంది; ఏకైక సిద్ధాంతార్థాన్ని బలవంతంగా నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనదిగానూ సాధారణ పాఠకులకు సులభంగానూ ఉంది. ప్రశ్నలోని నిర్ధారణ కోరికను నిలుపుతూ, సందేహాన్ని అవిశ్వాసంగా లేదా విశ్వాసంగా అదనంగా వ్యాఖ్యానించలేదు.
