    issue: ‘స్వాధీనం చేసుకుంటాను’ may overstate ירשׁ as an act of seizure.
    rationale: In this promise context, the verb can mean inherit or possess. ‘స్వాధీనంగా పొందుతాను’ retains actual possession while avoiding an added implication of taking the land by force or unilateral appropriation.
  - severity: low
    issue: The footnote combines two distinct lexical matters although its stated function is the alternative for ירשׁ.
    rationale: The anchor follows the clause containing אִירָשֶׁנָּה, so the note should plainly give the inheritance alternative. The interpretation of בַּמָּה is already represented in the main text and need not be included in this lexical-alternative note.
