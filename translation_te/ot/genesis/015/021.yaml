  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֶת
  choice: -లను / జాబితాలో విరామచిహ్నాలు
  rationale: וְ జాబితా కొనసాగింపును సూచిస్తుంది; אֶת నిర్దిష్ట ప్రత్యక్ష కర్మ సూచకం. తెలుగులో ప్రతి ప్రజాపేరు మీద ద్వితీయా విభక్తి ‘-లను’ పెట్టడం ద్వారా కర్మసంబంధం సహజంగా వ్యక్తమవుతుంది; వరుసను కామాలతో కొనసాగించడం ఆధునిక తెలుగు శైలికి తగినది.
- source_word: הָאֱמֹרִי
  choice: అమోరీయులను
  rationale: హీబ్రూలో ఏకవచన రూపంలో ఉన్న ఈ జాతినామం సమూహార్థకమైనది. తెలుగులో ప్రజాసమూహాన్ని స్పష్టంగా తెలియజేయడానికి బహువచన కర్మరూపం వాడబడింది.
- source_word: הַכְּנַעֲנִי
  choice: కనానీయులను
  rationale: సమూహార్థక హీబ్రూ జాతినామాన్ని సహజమైన తెలుగు బహువచన కర్మరూపంలో అనువదించాం.
- source_word: הַגִּרְגָּשִׁי
  choice: గిర్గాషీయులను
  rationale: హీబ్రూ జాతినామ ధ్వనిరూపాన్ని సాధ్యమైనంత దగ్గరగా నిలుపుతూ, జాబితాలోని ప్రజాసమూహానికి తగిన బహువచన కర్మరూపాన్ని వాడాం.
- source_word: הַיְבוּסִי
  choice: యెబూసీయులను
  rationale: జాతినామాన్ని తెలుగు బైబిలు వాడుకకు అనుగుణమైన లిప్యంతరీకరణతో, సమూహాన్ని సూచించే బహువచన కర్మరూపంలో ఇచ్చాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన జాబితాగా అనువదించబడింది. ఇది ముందటి వచనంలో ప్రారంభమైన ప్రత్యక్ష కర్మల జాబితా కొనసాగింపు కాబట్టి ప్రతి పేరుకు ‘-లను’ చేర్చి వాక్యసంబంధాన్ని నిలిపాం; మూలంలోని జాతినామాల క్రమాన్ని యథాతథంగా ఉంచాం.
