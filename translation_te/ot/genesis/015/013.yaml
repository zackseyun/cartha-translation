- from: 'అప్పుడు ఆయన అబ్రాముతో ఇలా అన్నాడు: “నీ సంతానం తమది కాని దేశంలో పరదేశ నివాసులుగా[a] ఉంటారని నిశ్చయంగా తెలుసుకో. వారిని దాసులుగా చేసుకొని[b], నాలుగు వందల సంవత్సరాలు బాధిస్తారు[c].”'
  to: 'అప్పుడు ఆయన అబ్రాముతో ఇలా అన్నాడు: “నీ సంతానం తమది కాని దేశంలో పరదేశ నివాసులుగా[a] ఉంటారని నిశ్చయంగా తెలుసుకో. వారు వారికి సేవ చేస్తారు[b], వారు వారిని నాలుగు వందల సంవత్సరాలు బాధిస్తారు[c].”'
