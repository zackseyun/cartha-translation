id: GEN.15.13
reference: Genesis 15:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר לְ/אַבְרָ֗ם יָדֹ֨עַ תֵּדַ֜ע כִּי גֵ֣ר יִהְיֶ֣ה זַרְעֲ/ךָ֗ בְּ/אֶ֨רֶץ֙ לֹ֣א לָ/הֶ֔ם וַ/עֲבָד֖וּ/ם וְ/עִנּ֣וּ אֹתָ֑/ם אַרְבַּ֥ע מֵא֖וֹת שָׁנָֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/013.yaml
  text: Then he said to Abram[a], “Know for certain that your offspring will be sojourners in a land not theirs[c][b], and they will enslave them and afflict them four hundred years.”
translation:
  language: te
  text: 'అప్పుడు ఆయన అబ్రాముతో ఇలా అన్నాడు: “నీ సంతానం తమది కాని దేశంలో పరదేశ నివాసులుగా[a] ఉంటారని నిశ్చయంగా తెలుసుకో. వారు వారికి సేవ చేస్తారు[b], వారు వారిని నాలుగు వందల సంవత్సరాలు బాధిస్తారు[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పరదేశులుగా” లేదా “వలస నివాసులుగా.” హీబ్రూ పదం తమది కాని దేశంలో స్థానికులు కానివారిగా నివసించేవారిని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో, “వారు వారికి సేవ చేస్తారు.” సందర్భంలో ఇది బలవంతపు సేవ లేదా దాస్యాన్ని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: హీబ్రూ వాక్యంలో సర్వనామాల సూచన సంక్షిప్తంగా ఉంది. సందర్భానుసారంగా అనేకులు రెండవ “వారు”ను ఆ పరదేశంలోని ప్రజలుగా, “వారిని”ని అబ్రాము సంతానంగా అర్థం చేసుకుంటారు.
    reason: source_ambiguity
lexical_decisions:
- source_word: יָדֹעַ תֵּדַע
  choice: నిశ్చయంగా తెలుసుకో
  rationale: క్రియకు ముందు అదే ధాతువుతో ఉన్న infinitive absolute నిశ్చయాన్ని బలపరుస్తుంది. ఈ తెలుగు ప్రయోగం ఆ ఉద్ఘాటనను సహజంగా తెలియజేస్తుంది.
- source_word: גֵר
  choice: పరదేశ నివాసులు
  rationale: సొంతం కాని దేశంలో స్థానిక హక్కులు లేక నివసించే వారనే భావాన్ని ఇది తెలియజేస్తుంది; కేవలం ప్రయాణికులు అనే అర్థానికి పరిమితం చేయదు.
- source_word: זַרְעֲךָ
  choice: నీ సంతానం
  rationale: హీబ్రూలో ఇది సమూహార్థక ఏకవచనం. ‘సంతానం’ తెలుగులో సహజంగా ఉండి, అబ్రాము వంశస్థులందరినీ సూచిస్తుంది.
- source_word: בְּאֶרֶץ לֹא לָהֶם
  choice: తమది కాని దేశంలో
  rationale: ఆ దేశం వారి స్వాధీనంలో ఉండదనే మూలపాఠ భావాన్ని సంక్షిప్తంగా, సహజంగా నిలుపుతుంది.
- source_word: וַעֲבָדוּם
  choice: వారిని దాసులుగా చేసుకొని
  rationale: మూలంలోని సేవ/దాస్య భావాన్ని సందర్భానుసారంగా బలవంతపు సేవగా వ్యక్తం చేస్తుంది. తెలుగు వాక్యంలో కర్తను పేర్కొనకుండా ఉంచడం వల్ల హీబ్రూ సర్వనామ సంబంధంలోని కొంత అస్పష్టత నిలుస్తుంది.
- source_word: וְעִנּוּ אֹתָם
  choice: బాధిస్తారు
  rationale: పీయేల్ రూపంలోని కష్టపరచడం, అణచివేయడం అనే విస్తృత భావాన్ని ఒకే నిర్దిష్ట దౌర్జన్యానికి పరిమితం చేయకుండా తెలియజేస్తుంది.
- source_word: אַרְבַּע מֵאוֹת שָׁנָה
  choice: నాలుగు వందల సంవత్సరాలు
  rationale: మూలపాఠంలోని కాలవ్యవధిని అదనపు వివరణ లేకుండా నేరుగా అందిస్తుంది.
- source_word: וַיֹּאמֶר לְאַבְרָם
  choice: అప్పుడు ఆయన అబ్రాముతో ఇలా అన్నాడు
  rationale: వావ్-వరుస కథన పురోగతిని ‘అప్పుడు’ సహజంగా చూపిస్తుంది; ‘ఇలా’ తరువాత వచ్చే ప్రత్యక్ష వాక్యాన్ని తెలుగులో సులభంగా పరిచయం చేస్తుంది.
theological_decisions:
- issue: ‘దాసులుగా చేసుకొని, బాధిస్తారు’ అనే బహువచన క్రియల కర్త
  choice: అణచివేసేవారు ఎవరో ప్రధాన వాక్యంలో ప్రత్యేకంగా పేర్కొనలేదు; అబ్రాము సంతానమే కర్మ అని సందర్భం ద్వారా తెలియజేయబడింది.
  alternative: ‘ఆ దేశస్థులు వారిని దాసులుగా చేసుకొని బాధిస్తారు’ అని కర్తను స్పష్టంగా చేర్చడం; లేదా ‘వారు వారికి సేవ చేస్తారు’ అని రూపపరంగా మరింత దగ్గరగా అనువదించడం.
  rationale: హీబ్రూ బహువచన రూపాలు సర్వనామ సూచనలో ఉద్రిక్తతను కలిగిస్తాయి. సందర్భం అబ్రాము సంతానం దాస్యానికీ బాధకూ గురవుతుందని సూచించినా, అణచివేసేవారిని వచనం పేరుపెట్టి చెప్పదు. కర్తను సహజంగా విడిచిపెట్టగల తెలుగు నిర్మాణం అనవసరమైన నిర్ధారణను నివారిస్తుంది.
- issue: నాలుగు వందల సంవత్సరాల కాలవ్యవధి ఏ క్రియకు వర్తిస్తుంది
  choice: కాలవ్యవధిని రెండు క్రియల తరువాత ఉంచి, దాస్యం మరియు బాధ అనే సమగ్ర పరిస్థితితో అనుసంధానించబడేలా ఉంచబడింది.
  alternative: ‘నాలుగు వందల సంవత్సరాలు వారిని బాధిస్తారు’ అని కేవలం బాధకే స్పష్టంగా అనుసంధానించడం.
  rationale: మూలపాఠంలో కాలపదబంధం చివర ఉంది; దాని ఖచ్చిత పరిధిని అతిగా నిర్ణయించకుండా అదే స్థాన సంబంధాన్ని తెలుగు వాక్యం సాధ్యమైనంతవరకు నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘పరదేశ నివాసులు’ మూలపదానికి ఉన్న సామాజిక భావాన్ని కాపాడుతుంది. రెండవ వాక్యంలో కర్తను వదలడం తెలుగులో సహజమే కాక, హీబ్రూ సర్వనామాల అస్పష్టతను అతిగా పరిష్కరించకుండా ఉంచుతుంది.
