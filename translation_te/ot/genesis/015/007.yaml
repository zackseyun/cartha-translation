  text: וַ/יֹּ֖אמֶר אֵלָ֑י/ו אֲנִ֣י יְהוָ֗ה אֲשֶׁ֤ר הוֹצֵאתִ֨י/ךָ֙ מֵ/א֣וּר כַּשְׂדִּ֔ים לָ֧/תֶת לְ/ךָ֛ אֶת הָ/אָ֥רֶץ הַ/זֹּ֖את לְ/רִשְׁתָּֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/007.yaml
  text: And he said to him[a], “I am Yahweh[c][b], who brought you out from Ur of the Chaldeans to give you this land to possess.”
translation:
  language: te
  text: ఆయన అతనితో, “నేను యాహ్వేను; నీవు స్వాధీనం చేసుకోవడానికి ఈ భూమిని నీకు ఇవ్వడానికి కల్దీయుల ఊరు నుండి నిన్ను బయటికి తీసుకొచ్చినవాణ్ణి నేనే” అని అన్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלָיו
  choice: ఆయన అతనితో ... అని అన్నాడు
  rationale: హీబ్రూ కథన క్రమాన్ని సహజమైన ఆధునిక తెలుగు ప్రత్యక్ష వాక్య నిర్మాణంలో వ్యక్తపరుస్తుంది.
- source_word: אֲנִי יְהוָה
  choice: నేను యాహ్వేను
  rationale: క్రియలేని హీబ్రూ వాక్యాన్ని తెలుగులో సహజంగా వ్యక్తపరుస్తూ, దైవనామాన్ని బిరుదుగా మార్చకుండా లిప్యంతరీకరించింది.
- source_word: הוֹצֵאתִיךָ
  choice: నిన్ను బయటికి తీసుకొచ్చినవాణ్ణి
  rationale: יצא హిఫీల్ రూపంలోని ‘బయటికి రప్పించడం/తీసుకురావడం’ అనే కారణార్థక భావాన్ని నిలుపుతుంది.
- source_word: מֵאוּר כַּשְׂדִּים
  choice: కల్దీయుల ఊరు నుండి
  rationale: ఊరు అనే స్థలనామాన్ని, దానికి సంబంధించిన కల్దీయుల అనే నిర్దేశంతో సరళంగా అందిస్తుంది.
- source_word: לָתֶת לְךָ אֶת הָאָרֶץ הַזֹּאת
  choice: ఈ దేశాన్ని ... నీకు ఇవ్వడానికి
  rationale: ל తో ఉన్న క్రియానామ రూపంలోని ఉద్దేశ భావాన్ని స్పష్టంగా కాపాడుతుంది.
- source_word: לְרִשְׁתָּהּ
  choice: నీవు స్వాధీనం చేసుకునేలా
  rationale: ירשׁ ఇక్కడ సూచించే భూమిని పొందడం, తన ఆధీనంలో ఉంచుకోవడం అనే విస్తృత భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలోని వ్యక్తిగత దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పండిత లిప్యంతరీకరణకు దగ్గరగా తెలుగులో అందించింది.
- issue: ירשׁ యొక్క భావం
  choice: స్వాధీనం చేసుకోవడం
  alternative: వారసత్వంగా పొందడం
  rationale: ఈ సందర్భంలో భూమిని పొందడం మరియు దానిపై అధికారం కలిగి ఉండడం ప్రధాన భావం; ‘వారసత్వం’ అనే అనువాదం సాధ్యమైనప్పటికీ కుటుంబ వారసత్వ భావాన్ని అనవసరంగా ముందుకు తేవచ్చు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ‘దేశం’ ఇక్కడ రాజ్యాన్ని కాక భూభాగాన్ని సూచిస్తుంది; వాక్య సందర్భం ఆ అర్థాన్ని స్పష్టం చేస్తుంది.
