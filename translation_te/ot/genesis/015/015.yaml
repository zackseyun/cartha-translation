id: GEN.15.15
reference: Genesis 15:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אַתָּ֛ה תָּב֥וֹא אֶל אֲבֹתֶ֖י/ךָ בְּ/שָׁל֑וֹם תִּקָּבֵ֖ר בְּ/שֵׂיבָ֥ה טוֹבָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/015.yaml
  text: As for you[a], you will go to your fathers in peace; you will be buried at a good old age.
translation:
  language: te
  text: నీ విషయానికొస్తే, నీవు శాంతితో నీ పితరుల వద్దకు వెళ్తావు[a]; మంచి వృద్ధాప్యంలో సమాధి చేయబడతావు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘నీ పూర్వీకుల వద్దకు.’ హీబ్రూలో అక్షరార్థంగా ‘నీ పితరుల వద్దకు’ అని ఉంది; ఇది మరణించి గత తరాలవారితో చేరడాన్ని సూచించే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַתָּה
  choice: అయితే నువ్వు
  rationale: స్వతంత్ర సర్వనామంతో కూడిన సంధి, అబ్రాము సంతతి గురించిన మాటనుంచి అబ్రాము విషయానికి వ్యత్యాసపూర్వకంగా దృష్టి మళ్లిస్తుంది.
- source_word: תָּב֥וֹא
  choice: వెళ్తావు
  rationale: ‘పితరుల దగ్గరికి’ అనే పదబంధంతో కలిసినప్పుడు ఇది మరణాన్ని సూచించే నుడికారం; తెలుగులో ‘వెళ్తావు’ సహజంగా ఉంటుంది.
- source_word: אֶל אֲבֹתֶיךָ
  choice: నీ పితరుల దగ్గరికి
  rationale: హీబ్రూ పదబంధంలోని కుటుంబసంబంధ రూపకాన్ని నిలుపుతూ, గత తరాలవారితో చేరడాన్ని సూచించే మరణ నుడికారాన్ని యథాతథంగా ఉంచుతుంది.
- source_word: בְּשָׁלוֹם
  choice: ప్రశాంతంగా
  rationale: שָׁלוֹם లోని శాంతి, క్షేమం అనే భావాలను ఈ మరణ సందర్భంలో సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: תִּקָּבֵר
  choice: సమాధి చేయబడతావు
  rationale: קבר నిఫల్ రూపంలోని కర్మణి భావాన్ని స్పష్టంగా, గౌరవప్రదంగా వ్యక్తం చేస్తుంది.
- source_word: בְּשֵׂיבָה טוֹבָה
  choice: మంచి ముసలితనంలో
  rationale: ముదిమి మరియు దానితో ముడిపడిన అనుకూల భావం రెండింటినీ మూలానికి సన్నిహితంగా నిలుపుతుంది.
theological_decisions:
- issue: ‘నీ పితరుల దగ్గరికి వెళ్తావు’ అనే మాట అర్థం
  choice: అబ్రాము మరణించి గత తరాలవారితో చేరడాన్ని సూచించే నుడికారంగా అలాగే ఉంచడం
  alternative: పితరులతో భౌతికంగా ఒకే సమాధిలో పాతిపెట్టబడటం అని లేదా మరణానంతరం వారితో చైతన్యపూర్వక సహవాసం అని స్పష్టీకరించడం
  rationale: అబ్రాము తన తక్షణ పితరులతో ఒకే సమాధిలో పాతిపెట్టబడడు కాబట్టి ఇది కేవలం భౌతిక సమాధిని మించిన మరణసూత్రం. అయితే మరణానంతర స్థితి గురించి విస్తృత సిద్ధాంతాన్ని ఈ వాక్యం నిర్దిష్టంగా చెప్పదు; అందువల్ల మూలంలోని ఉద్వేగం, అస్పష్టత నిలుపబడ్డాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. దేవుడు అబ్రాముతో నేరుగా మాట్లాడుతున్నందున ఏకవచన ‘నువ్వు’ వాడబడింది; ‘పితరులు’ అనే బైబిలు కుటుంబపదం పాదటిప్పణి సహాయంతో నిలుపబడింది.
