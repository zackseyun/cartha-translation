  text: וַ/יִּֽקַּֽח ל֣/וֹ אֶת כָּל אֵ֗לֶּה וַ/יְבַתֵּ֤ר אֹתָ/ם֙ בַּ/תָּ֔וֶךְ וַ/יִּתֵּ֥ן אִישׁ בִּתְר֖/וֹ לִ/קְרַ֣את רֵעֵ֑/הוּ וְ/אֶת הַ/צִפֹּ֖ר לֹ֥א בָתָֽר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/010.yaml
  text: So he brought all these to him[a], cut them in two, and placed each half opposite the other[c][b]; but he did not cut the birds in two.
translation:
  language: te
  text: అప్పుడు అబ్రాము వాటన్నిటినీ ఆయన దగ్గరకు తీసుకువచ్చి[a], వాటిని మధ్యలో రెండుగా చీల్చి, ప్రతి భాగాన్ని దాని మరో భాగానికి ఎదురుగా ఉంచాడు[b]. అయితే పక్షులను మాత్రం చీల్చలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తనకోసం తీసుకొని.” హీబ్రూలోని לוֹ అనే పదబంధం సందర్భాన్ని బట్టి “ఆయన దగ్గరకు/ఆయన కోసం” లేదా “తనకోసం” అని అర్థం కావచ్చు; ముందరి వచనంలోని దేవుని ఆజ్ఞ సందర్భంలో “ఆయన దగ్గరకు తీసుకువచ్చి” అనేది సహజం.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “ప్రతి ముక్కను దాని తోటి ముక్కకు ఎదురుగా ఉంచాడు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח לוֹ אֶת כָּל אֵלֶּה
  choice: అబ్రాము వాటన్నిటినీ ఆయన కోసం తీసుకొని
  rationale: וַיִּקַּח అనే క్రియకు ప్రాథమికంగా ‘తీసుకొను’ అనే అర్థం ఉంది. לוֹ సందర్భంలో దేవుణ్ణి సూచించే ‘ఆయన కోసం’ అనే దాతృత్వ భావాన్ని ఇస్తుంది; అయితే అది ‘తనకోసం’ అని కూడా వ్యాకరణపరంగా అర్థం కావచ్చు కాబట్టి ఆ ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం. స్పష్టత కోసం కర్త ‘అబ్రాము’ను తెలుగులో వ్యక్తం చేశాం.
- source_word: וַיְבַתֵּר אֹתָם בַּתָּוֶךְ
  choice: వాటిని మధ్యకు రెండుగా చీల్చి
  rationale: בתר జంతువులను భాగాలుగా చీల్చడాన్ని సూచిస్తుంది; בַּתָּוֶךְ ‘మధ్యలో/మధ్యకు’ అనే భావాన్ని ఇస్తుంది. ‘మధ్యకు రెండుగా చీల్చి’ అనే రూపం చర్యను సహజమైన తెలుగులో స్పష్టంగా చూపుతుంది.
- source_word: וַיִּתֵּן אִישׁ בִּתְרוֹ לִקְרַאת רֵעֵהוּ
  choice: ప్రతి భాగాన్ని దాని జత భాగానికి ఎదురుగా ఉంచాడు
  rationale: אִישׁ ... רֵעֵהוּ ఇక్కడ ‘ప్రతి ఒక్కటి—దాని తోటి భాగం’ అనే పంపిణీ ప్రయోగం. ‘జత భాగం’ అనేది ఒకే జంతువు నుంచి చీల్చిన ఎదురుభాగాన్ని సూచిస్తుంది; అదనపు ఆధ్యాత్మిక భావాన్ని చేర్చదు.
- source_word: וְאֶת הַצִפֹּר לֹא בָתָר
  choice: అయితే పక్షులను మాత్రం చీల్చలేదు
  rationale: ఏకవచన సమూహవాచకమైన הַצִפֹּר ముందరి వచనంలో చెప్పిన పక్షులను సూచిస్తుంది. తెలుగులో బహువచనం సహజంగా ఆ సూచనను తెలియజేస్తుంది. ‘మాత్రం’ విరుద్ధతను స్పష్టం చేస్తుంది.
theological_decisions:
- issue: నిబంధన చేసేటప్పుడు జంతువులను చీల్చే ఆచారానికి సంబంధించిన భాష
  choice: జంతువులను రెండుగా చీల్చి భాగాలను ఎదురెదురుగా ఉంచిన చర్యను మాత్రమే స్పష్టంగా అనువదించడం
  alternative: వచనంలోనే దీనిని ‘నిబంధన బలి ఆచారం’ అని వివరణాత్మకంగా విస్తరించడం
  rationale: హీబ్రూ వచనం ఆచరణను వర్ణిస్తుంది గాని దాని అర్థాన్ని ఈ వాక్యంలో వివరించదు. అందువల్ల నిబంధన నేపథ్యాన్ని సూచించే స్పష్టమైన దృశ్యాన్ని నిలుపుతూ, వ్యాఖ్యానాన్ని ప్రధాన పాఠ్యంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. హీబ్రూ కథనంలోని వరుస చర్యలను సహజమైన తెలుగు వాక్య నిర్మాణంలో కలిపాం; సందర్భస్పష్టత కోసం ‘అబ్రాము’ అనే కర్తను పేర్కొన్నాం.
