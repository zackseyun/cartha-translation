id: GEN.15.1
reference: Genesis 15:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אַחַ֣ר הַ/דְּבָרִ֣ים הָ/אֵ֗לֶּה הָיָ֤ה דְבַר יְהוָה֙ אֶל אַבְרָ֔ם בַּֽ/מַּחֲזֶ֖ה לֵ/אמֹ֑ר אַל תִּירָ֣א אַבְרָ֗ם אָנֹכִי֙ מָגֵ֣ן לָ֔/ךְ שְׂכָרְ/ךָ֖ הַרְבֵּ֥ה מְאֹֽד׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/001.yaml
  text: After these things[a], the word of Yahweh came to Abram in a vision, saying, “Do not fear, Abram. I am a shield for you; your reward will be very great.”
translation:
  language: te
  text: 'ఈ సంగతుల తరువాత, దర్శనంలో యహ్వే వాక్కు అబ్రాముకు వచ్చింది: “అబ్రామూ, భయపడకు. నేను నీకు డాలును; నీ ప్రతిఫలం ఎంతో గొప్పగా ఉంటుంది.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నేను నీ డాలును; నీ ప్రతిఫలం అత్యంత గొప్పది.” ఈ సంక్షిప్త హీబ్రూ వాక్యాన్ని “నేనే నీ అత్యంత గొప్ప ప్రతిఫలం” అని కూడా అన్వయించవచ్చు.
    reason: చివరి హీబ్రూ వాక్యభాగంలో క్రియ లేకపోవడం, వాక్యవిభజనకు ఒకటి కంటే ఎక్కువ సాధ్యమైన అన్వయాలు ఉండడం వల్ల.
lexical_decisions:
- source_word: אַחַר הַדְּבָרִים הָאֵלֶּה
  choice: ఈ సంగతుల తరువాత
  rationale: דְּבָרִים అనే పదం మాటలను గానీ సంఘటనలను గానీ సూచించగలదు. ఇక్కడ ముందరి కథనాన్ని సూచించే విస్తృత అర్థాన్ని ‘సంగతులు’ సహజంగా నిలుపుతుంది.
- source_word: דְבַר יְהוָה
  choice: యహ్వే వాక్కు
  rationale: హీబ్రూ నిర్మాణాన్ని, దైవిక ప్రకటనను సూచించే స్థిరమైన భావాన్ని నిలుపుతూ, దేవుని వ్యక్తిగత నామమైన יְהוָהను ‘యహ్వే’గా లిప్యంతరీకరించింది.
- source_word: הָיָה ... אֶל אַבְרָם
  choice: అబ్రాముకు వచ్చింది
  rationale: వాక్కు ఒక వ్యక్తికి ప్రత్యక్షమై అందిన ప్రకటనను తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בַּמַּחֲזֶה
  choice: దర్శనంలో
  rationale: מַחֲזֶה ఇక్కడ దృశ్యరూప దైవిక ప్రకటనను సూచిస్తుంది; ‘దర్శనం’ ఆధునిక ప్రామాణిక తెలుగులో స్పష్టంగా, గౌరవప్రదంగా ఉంటుంది.
- source_word: אַל תִּירָא
  choice: భయపడకు
  rationale: నేరుగా పలికిన నిషేధాన్ని సరళమైన, సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: מָגֵן לָךְ
  choice: నీకు డాలుగా
  rationale: మూలంలో ‘డాలు’కు స్వామ్య ప్రత్యయం లేదు; לָךְ అక్షరార్థంగా ‘నీకు/నీ కోసం’ అని ఉంటుంది. అందువల్ల ‘నీ డాలు’గా మార్చకుండా హీబ్రూ నిర్మాణభేదాన్ని నిలిపింది.
- source_word: שְׂכָרְךָ
  choice: నీ ప్రతిఫలం
  rationale: ఈ పదానికి జీతం, చెల్లింపు, ప్రతిఫలం అనే అర్థాలు ఉన్నాయి. వాగ్దాన సందర్భంలో ‘ప్రతిఫలం’ ఆర్థిక జీతానికి మాత్రమే పరిమితం చేయకుండా విస్తృత భావాన్ని ఇస్తుంది.
- source_word: הַרְבֵּה מְאֹד
  choice: ఎంతో గొప్పగా ఉంటుంది
  rationale: హీబ్రూలో క్రియలేని సంక్షిప్త వాక్యభాగం ఉంది. వాగ్దాన సందర్భానికి అనుగుణంగా తెలుగులో అవసరమైన క్రియను చేర్చింది; మూలంలోని తీవ్రతను ‘ఎంతో’ నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠంలో నాలుగు అక్షరాల దైవనామం ప్రత్యక్షంగా ఉంది. దానిని బిరుదుతో భర్తీ చేయకుండా ‘యహ్వే’గా అందించడం వ్యక్తిగత నామాన్ని నిలుపుతుంది.
- issue: שְׂכָרְךָ הַרְבֵּה מְאֹד అనే చివరి వాగ్దాన వాక్యభాగం
  choice: నీ ప్రతిఫలం ఎంతో గొప్పగా ఉంటుంది
  alternative: నీ ప్రతిఫలం ఎంతో గొప్పది; నేనే నీ అత్యంత గొప్ప ప్రతిఫలాన్ని
  rationale: మసొరా పాఠంలోని పదక్రమం, విరామసూచనలు ‘నేను నీకు డాలుగా ఉన్నాను’ మరియు ‘నీ ప్రతిఫలం ఎంతో గొప్పగా ఉంటుంది’ అనే రెండు వాక్యభాగాలకు బలమిస్తాయి. అయితే క్రియ లేని సంక్షిప్త హీబ్రూ నిర్మాణం వల్ల వర్తమాన భావం లేదా దేవుడే ప్రతిఫలం అనే ప్రత్యామ్నాయ అన్వయం ఏర్పడవచ్చు; దానిని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథనశైలిని ఉపయోగించింది. ‘కేడెము’ వంటి పాత పదానికి బదులుగా ‘డాలు’ను, కేవలం బిరుదుకు బదులుగా ‘యహ్వే’ అనే దైవనామాన్ని వాడింది. సంబోధనలో సహజమైన ‘అబ్రామూ’ను ఉపయోగించింది.
