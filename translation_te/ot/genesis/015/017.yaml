  yaml_path: translation/ot/genesis/015/017.yaml
  text: And when the sun had gone down and it was dark[a], behold[b], a smoking firepot and a flaming torch passed between these pieces.
translation:
  language: te
  text: సూర్యుడు అస్తమించి చీకటి కమ్ముకున్నప్పుడు, ఇదిగో, పొగలు వెదజల్లుతున్న ఒక పొయ్యి, మండుతున్న ఒక కాగడా ఆ ముక్కల మధ్యగా వెళ్లింది[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పొగలు వెదజల్లుతున్న ఒక అగ్నిపాత్ర,’ ‘పొగలు వెదజల్లుతున్న ఒక కొలిమి.’ హీబ్రూ పదం పొయ్యిని లేదా అగ్ని ఉంచే పాత్రను సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘ముక్కలు’ అంటే నిబంధన ఆచారం కోసం ముందుగా రెండుగా కోసి అమర్చిన జంతువుల భాగాలు (ఆది 15:10 చూడండి). హీబ్రూలో ‘వెళ్లింది’ అనే క్రియ ఏకవచనంలో ఉంది; అది సమీపంలోని నామవాచకంతో అన్వయించవచ్చు లేదా ఈ రెండు అగ్ని చిహ్నాలను ఒకే సమగ్ర దృశ్యంగా చూపవచ్చు.
    reason: cross_reference_and_source_ambiguity
lexical_decisions:
- source_word: וַיְהִי
  choice: అప్పుడు
  rationale: కథన క్రమంలో తదుపరి సంఘటనను సహజమైన ఆధునిక తెలుగులో పరిచయం చేస్తుంది; తరువాతి కాలవాచక ఉపవాక్యంతో కలిసి హీబ్రూ నిర్మాణ భావాన్ని అందిస్తుంది.
- source_word: הַשֶּׁמֶשׁ בָּאָה
  choice: సూర్యుడు అస్తమించి
  rationale: సూర్యునితో వాడిన בוא అస్తమయాన్ని సూచించే నుడికారం. ‘అస్తమించి’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: וַעֲלָטָה הָיָה
  choice: చీకటి కమ్ముకున్నప్పుడు
  rationale: עֲלָטָה చీకటి లేదా మసకదనాన్ని సూచిస్తుంది. ‘చీకటి కమ్ముకుంది’ దృశ్య గాంభీర్యాన్ని సహజ తెలుగులో నిలుపుతుంది; ‘కటిక చీకటి’ అని అనవసరంగా తీవ్రతను పెంచదు.
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: హఠాత్తుగా దృష్టిని దృశ్యంపై కేంద్రీకరించే הִנֵּה యొక్క సాహిత్య బలాన్ని తెలుగు ‘ఇదిగో’ సహజంగా నిలుపుతుంది.
- source_word: תַנּוּר עָשָׁן
  choice: పొగ కక్కుతున్న ఒక పొయ్యి
  rationale: תַנּוּר అనేది పొయ్యి లేదా అగ్ని ఉంచే పాత్రను సూచించగలదు. ‘పొయ్యి’ సాధారణ తెలుగు పాఠకునికి స్పష్టంగా ఉండి, దాని ఖచ్చిత ఆకృతిని అతిగా నిర్ణయించదు.
- source_word: לַפִּיד אֵשׁ
  choice: మండుతున్న ఒక కాగడా
  rationale: לַפִּיד అంటే కాగడా; אֵשׁ దాని జ్వలించే స్వభావాన్ని బలపరుస్తుంది. ‘మండుతున్న కాగడా’ సహజమైన, స్పష్టమైన దృశ్యాన్ని ఇస్తుంది.
- source_word: אֲשֶׁר עָבַר
  choice: వెళ్లాయి
  rationale: సందర్భంలో పొగ కక్కే పొయ్యి, మండే కాగడా అనే రెండు దృశ్య చిహ్నాలు కలిసి ముక్కల మధ్య కదిలినట్లు తెలుగులో బహువచన క్రియ సహజంగా వ్యక్తమవుతుంది; హీబ్రూలో ఏకవచన క్రియ ఉన్నదనే అంశాన్ని పాదటిప్పణిలో సూచించాం.
- source_word: בֵּין הַגְּזָרִים הָאֵלֶּה
  choice: ఆ ముక్కల మధ్యగా
  rationale: గత సందర్భంలో రెండుగా కోసి అమర్చిన జంతువుల భాగాలను సూచిస్తుంది. తెలుగులో ‘ఆ ముక్కలు’ పూర్వప్రస్తావనను సహజంగా తిరిగి సూచిస్తుంది.
theological_decisions:
- issue: నిబంధన దృశ్యంలో కనిపించిన అగ్ని సంబంధ వస్తువుల స్వరూపం
  choice: వాటిని దేవుడే అని అనువాద పంక్తిలో స్పష్టీకరించకుండా, కనిపించిన దృశ్యాన్ని వర్ణనాత్మకంగా మాత్రమే అందించడం.
  alternative: పొగ కక్కే పొయ్యి, మండే కాగడా యెహోవా సన్నిధి ప్రత్యక్షత అని ప్రధాన పాఠ్యంలో గుర్తించడం.
  rationale: విస్తృత సందర్భం దైవిక నిబంధన ప్రత్యక్షతను బలంగా సూచించినా, ఈ వచనం కనిపించిన చిహ్నాలనే పేరుపెడుతుంది. అందువల్ల మూలపాఠంలోని వేదాంతపరమైన ఉద్వేగాన్ని నిలిపి, వ్యాఖ్యానాన్ని ప్రధాన పాఠ్యంలో చేర్చలేదు.
- issue: ఏకవచన హీబ్రూ క్రియకు తెలుగు సంఖ్యాన్వయం
  choice: రెండు దృశ్య వస్తువులను సూచించే సహజ తెలుగు బహువచనమైన ‘వెళ్లాయి’ వాడి, మూలంలోని ఏకవచనాన్ని పాదటిప్పణిలో తెలియజేయడం.
  alternative: ‘వెళ్లింది’ అని హీబ్రూ ఏకవచనాన్ని నేరుగా అనుసరించడం.
  rationale: హీబ్రూ ఏకవచనం రెండు చిహ్నాలను ఒక సమగ్ర ప్రత్యక్షతగా చూడవచ్చు లేదా సమీప నామవాచకంతో అన్వయించవచ్చు; దానిని సిద్ధాంతపరంగా తీర్చకుండా పాదటిప్పణి ద్వారా అస్పష్టతను కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కథన శైలి. ‘ఇదిగో’ ద్వారా దర్శనాత్మక దృశ్య బలం నిలుపబడింది. ‘పొయ్యి,’ ‘కాగడా’ వంటి సాధారణమైన కానీ గౌరవప్రదమైన పదాలు వాడబడ్డాయి; దైవిక గుర్తింపును ప్రధాన పాఠ్యంలో వ్యాఖ్యానంగా చేర్చలేదు.
