id: GEN.15.3
reference: Genesis 15:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אַבְרָ֔ם הֵ֣ן לִ֔/י לֹ֥א נָתַ֖תָּה זָ֑רַע וְ/הִנֵּ֥ה בֶן בֵּיתִ֖/י יוֹרֵ֥שׁ אֹתִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/003.yaml
  text: Then Abram said[a], “Behold, you have given me no offspring, and behold[b], a son of my household will inherit me.”
translation:
  language: te
  text: 'అప్పుడు అబ్రాము ఇలా అన్నాడు: “ఇదిగో, నీవు నాకు సంతానం[a] ఇవ్వలేదు; ఇదిగో, నా ఇంటివాడైన ఒకడు నాకు వారసుడవుతాడు[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “సంతానం” అనే పదానికి మూల హీబ్రూలో అక్షరార్థం “విత్తనం”; ఇక్కడ అది సంతతిని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “నన్ను వారసత్వంగా పొందుతాడు.” మూల హీబ్రూలో అక్షరార్థంగా, “నా ఇంటి కుమారుడు నన్ను వారసత్వంగా పొందుతున్నాడు” అని ఉంది.
    reason: literal_form_and_ambiguity
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... ఇలా అన్నాడు
  rationale: వావ్-కన్సిక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది. ‘అప్పుడు’ సంఘటనల క్రమాన్ని సహజమైన తెలుగు కథన శైలిలో తెలియజేస్తుంది; ‘ఇలా అన్నాడు’ ప్రత్యక్ష వాక్యాన్ని సులభంగా పరిచయం చేస్తుంది.
- source_word: הֵן / וְהִנֵּה
  choice: ఇదిగో ... ఇదిగో
  rationale: ఈ రెండు అవధానార్థక పదాల నొక్కిచెప్పే శక్తిని, వాటి వాక్చాతుర్య సమాంతరతను ఒకే తెలుగు పదంతో నిలిపింది.
- source_word: לִי לֹא נָתַתָּה
  choice: నీవు నాకు ... ఇవ్వలేదు
  rationale: దేవుడు ఇప్పటివరకు సంతానం ఇవ్వలేదనే అబ్రాము ఫిర్యాదును సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: זָרַע
  choice: సంతానం
  rationale: మూలపదానికి అక్షరార్థం ‘విత్తనం’; ఇక్కడ అది సంతతిని సూచిస్తుంది. ‘సంతానం’ తెలుగు సందర్భంలో సహజంగా ఉండి, సమూహార్థక భావాన్ని నిలుపుతుంది.
- source_word: בֶן בֵּיתִי
  choice: నా ఇంటివాడైన ఒకడు
  rationale: అక్షరార్థంగా ‘నా ఇంటి కుమారుడు.’ అయితే ఈ వచనం అతని సామాజిక స్థితిని స్పష్టంగా ‘దాసుడు’ అని చెప్పదు. ‘నా ఇంటివాడైన ఒకడు’ ఇంటికి చెందిన వ్యక్తి అనే భావాన్ని అనవసర నిర్దిష్టీకరణ లేకుండా అందిస్తుంది.
- source_word: יוֹרֵשׁ אֹתִי
  choice: నాకు వారసుడవుతాడు
  rationale: అక్షరార్థ నిర్మాణం ‘నన్ను స్వాస్థ్యంగా పొందుతున్నాడు/పొందుతాడు.’ తెలుగులో అది అపార్థానికి దారితీయవచ్చు; ‘నాకు వారసుడవుతాడు’ సందర్భార్థాన్ని స్పష్టంగా ఇస్తూ, మూలంలోని అసాధారణ నిర్మాణాన్ని పాదసూచికలో నిలుపుతుంది.
theological_decisions:
- issue: అబ్రాము ఇంటివాని సామాజిక స్థితి
  choice: ‘నా ఇంటివాడైన ఒకడు’ అని అనిర్దిష్టంగా ఉంచడం
  alternative: ‘నా ఇంట్లో పుట్టిన దాసుడు’ లేదా ‘నా దాసుడు’
  rationale: ఈ వచనంలోని בֶן בֵּיתִי అక్షరార్థంగా ‘నా ఇంటి కుమారుడు’; ఇక్కడ ‘దాసుడు’ అనే పదం లేదు. కాబట్టి మూలం చెప్పినదానికంటే నిర్దిష్టమైన సామాజిక హోదాను అనువాదం చేర్చదు.
- issue: ‘నన్ను స్వాస్థ్యంగా పొందడం’ అనే వారసత్వ ప్రయోగం
  choice: ప్రధాన పాఠ్యంలో ‘నాకు వారసుడవుతాడు,’ పాదసూచికలో అక్షరార్థం
  alternative: ‘నన్ను స్వాస్థ్యంగా పొందుతాడు’
  rationale: మూలంలోని אתי (‘నన్ను’) అనే అసాధారణ కర్మరూపాన్ని పూర్తిగా దాచకుండా పాదసూచికలో చూపుతూ, ప్రధాన పాఠ్యంలో తెలుగు పాఠకునికి అర్థమయ్యే వారసత్వ భావాన్ని ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘ఇదిగో’ అనే పదాన్ని రెండుసార్లు ఉంచి మూలంలోని నొక్కిచెప్పే సమాంతరతను నిలిపాం. ‘దాసుడు’ వంటి మూలంలో లేని నిర్దిష్ట సామాజిక గుర్తింపును చేర్చలేదు.
