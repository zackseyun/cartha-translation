  text: וַ/יֹּ֣אמֶר אֵלָ֗י/ו קְחָ֥/ה לִ/י֙ עֶגְלָ֣ה מְשֻׁלֶּ֔שֶׁת וְ/עֵ֥ז מְשֻׁלֶּ֖שֶׁת וְ/אַ֣יִל מְשֻׁלָּ֑שׁ וְ/תֹ֖ר וְ/גוֹזָֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/009.yaml
  text: And he said to him[a], “Bring me a three-year-old heifer, a three-year-old female goat, a three-year-old ram, a turtledove[b], and a young pigeon.”
translation:
  language: te
  text: ఆయన అతనితో, “నా కోసం మూడేళ్ల[b] ఆవుదూడను, మూడేళ్ల ఆడమేకను, మూడేళ్ల పొట్టేలును, ఒక గువ్వను, ఒక పావురపు పిల్లను తీసుకురా[a]” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “నా కోసం తీసుకో.” ఈ సందర్భంలో నిబంధన ఆచారానికి కావలసిన జంతువులను సమకూర్చి తీసుకురావడం భావం.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో పునరావృతమయ్యే పదాన్ని ఇక్కడ సంప్రదాయంగా జంతువుల వయస్సు, అంటే “మూడేళ్ల,” అని అర్థం చేసుకుంటారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלָיו
  choice: ఆయన అతనితో … అన్నాడు
  rationale: హీబ్రూ కథన క్రమాన్ని సహజమైన ఆధునిక తెలుగు వాక్యనిర్మాణంలో వ్యక్తపరుస్తుంది; సందర్భంలో ‘అతడు’ అబ్రామును సూచిస్తుంది.
- source_word: קְחָה לִי
  choice: నా కోసం … తీసుకురా
  rationale: అక్షరార్థంగా ‘నా కోసం తీసుకో’; అయితే నిబంధన ఆచారానికి జంతువులను సమకూర్చి తీసుకురావాలనే సందర్భార్థాన్ని ‘తీసుకురా’ సహజంగా తెలియజేస్తుంది.
- source_word: עֶגְלָה
  choice: ఆవుదూడ
  rationale: యువ ఆడ పశువును సూచిస్తుంది; సాధారణ పాఠకులకు స్పష్టమైన ఆధునిక తెలుగు పదం.
- source_word: מְשֻׁלֶּשֶׁת / מְשֻׁלָּשׁ
  choice: మూడు సంవత్సరాల
  rationale: ఈ జంతువుల జాబితాలో సాంప్రదాయకంగా వయస్సును సూచించేదిగా అర్థం చేసుకుంటారు; మూలంలోని పునరుక్తిని మూడు జంతువులకూ నిలుపుతుంది.
- source_word: עֵז
  choice: ఆడమేక
  rationale: స్త్రీలింగ మేకను స్పష్టంగా, సంక్షిప్తంగా సూచిస్తుంది.
- source_word: אַיִל
  choice: పొట్టేలు
  rationale: మగ గొర్రెకు సహజమైన తెలుగు సమానార్థకం.
- source_word: תֹר
  choice: తెల్ల గువ్వ
  rationale: సాధారణ ‘గువ్వ’ కంటే తాబేలు గువ్వ/టర్టిల్‌డవ్ జాతిని సూచించే ప్రాచుర్యమైన తెలుగు బైబిలు పదప్రయోగం.
- source_word: גוֹזָל
  choice: పావురపు పిల్ల
  rationale: ఈ బలి సంబంధిత జతలో చిన్న పావురాన్ని సూచించే సందర్భోచితమైన, స్పష్టమైన అనువాదం.
