review_pass:
  verdict: revise
  source_fidelity: The animal sequence, sex distinctions, and threefold age qualification are substantially retained. However, the added qualifier “తెల్ల” (“white”) for תֹר has no basis in the Hebrew, which specifies a turtledove but not its color. The age sense of מְשֻׁלֶּשֶׁת/מְשֻׁלָּשׁ is the conventional contextual understanding and should be footnoted as such.
  naturalness: The wording is clear and appropriate for modern standard Telugu. “మూడేళ్ల” is more idiomatic than “మూడు సంవత్సరాల” in this list. “గువ్వ” is an established Telugu Bible rendering for the specific bird in this sacrificial pairing; removing “తెల్ల” also makes the phrase more natural and accurate.
  terminology: “ఆవుదూడ,” “ఆడమేక,” “పొట్టేలు,” and “పావురపు పిల్ల” communicate the required animal categories well. “గువ్వ” is retained for תֹר, without importing an unsupported color descriptor. The imperative note correctly distinguishes the literal sense from the contextual sense.
  issues:
  - severity: medium
    issue: “తెల్ల గువ్వ” adds ‘white’ to the source.
    rationale: The Hebrew תֹר denotes a turtledove; it contains no adjective for color. The added descriptor narrows and alters the source meaning.
  - severity: low
    issue: The conventional age interpretation is left unmarked.
    rationale: The repeated term traditionally understood as ‘three-year-old’ has an interpretive history. A brief lexical footnote preserves appropriate transparency, consistent with the English audit trail.
