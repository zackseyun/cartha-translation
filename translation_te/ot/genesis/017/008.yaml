  text: וְ/נָתַתִּ֣י לְ֠/ךָ וּ/לְ/זַרְעֲ/ךָ֨ אַחֲרֶ֜י/ךָ אֵ֣ת אֶ֣רֶץ מְגֻרֶ֗י/ךָ אֵ֚ת כָּל אֶ֣רֶץ כְּנַ֔עַן לַ/אֲחֻזַּ֖ת עוֹלָ֑ם וְ/הָיִ֥יתִי לָ/הֶ֖ם לֵ/אלֹהִֽים׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/008.yaml
  text: And I will give to you and to your offspring after you the land of your sojournings—all the land of Canaan—as an everlasting possession[b][a], and I will be their God.
translation:
  language: te
  text: నీవు పరదేశిగా నివసిస్తున్న దేశాన్ని[a]—అంటే కనాను దేశమంతటినీ—నీకూ నీ తరువాత నీ సంతానానికీ శాశ్వత స్వాస్థ్యంగా[b] ఇస్తాను. నేను వారికి దేవునిగా ఉంటాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘నీ పరదేశవాసపు దేశాన్ని.’
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘శాశ్వత స్వాస్థ్యం కోసం.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: ఇస్తాను
  rationale: సంధితో కూడిన Qal perfect రూపం నిబంధన వాగ్దాన సందర్భంలో భవిష్య వాగ్దానాన్ని వ్యక్తం చేస్తుంది.
- source_word: לְךָ
  choice: నీకు
  rationale: అబ్రాహామును వ్యక్తిగతంగా గ్రహీతగా సూచించే సాధారణ సంప్రదానార్థకం.
- source_word: וּלְזַרְעֲךָ אַחֲרֶיךָ
  choice: నీ తరువాత నీ సంతానానికి
  rationale: זֶרַע సమూహార్థక నామవాచకం; ‘సంతానం’ ఏకవచన రూపంలోనే ఆ సమూహ భావాన్ని సహజంగా నిలుపుతుంది. ‘నీ తరువాత’ వారసత్వ క్రమాన్ని కాపాడుతుంది.
- source_word: אֶרֶץ מְגֻרֶיךָ
  choice: నీవు పరదేశిగా నివసిస్తున్న దేశం
  rationale: מְגוּרִים స్థిర హక్కులేని పరదేశ నివాసాన్ని సూచిస్తుంది. ఈ అనువాదం అబ్రాహాము ఆ దేశంలో నివసిస్తున్నప్పటికీ అక్కడ పరదేశిగా ఉన్న స్థితిని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: אֵת כָּל אֶרֶץ כְּנַעַן
  choice: అంటే కనాను దేశమంతటినీ
  rationale: రెండవ కర్మపద సమాసం ముందున్న ‘దేశం’ ఏదో వివరిస్తుంది; כָּל సూచించే సమగ్రతను ‘దేశమంతటినీ’ నిలుపుతుంది.
- source_word: לַאֲחֻזַּת עוֹלָם
  choice: శాశ్వత స్వాస్థ్యంగా
  rationale: אֲחֻזָּה ముఖ్యంగా భూసంబంధమైన స్వాధీన ఆస్తి లేదా హక్కుగల స్వాస్థ్యాన్ని సూచిస్తుంది; עוֹלָם దాని నిరంతర నిబంధనాత్మక స్వభావాన్ని తెలియజేస్తుంది.
- source_word: וְהָיִיתִי לָהֶם לֵאלֹהִים
  choice: నేను వారికి దేవునిగా ఉంటాను
  rationale: హీబ్రూ నిబంధన సూత్రాన్ని సహజమైన తెలుగులో నిలుపుతూ, దేవునిలో ఏదో అస్తిత్వ మార్పు కలుగుతుందనే భావాన్ని రానివ్వదు.
theological_decisions:
- issue: తరువాతి కాలపు సిద్ధాంతార్థాలను చేర్చకుండా నిబంధన సూత్రాన్ని అనువదించడం
  choice: నేను వారికి దేవునిగా ఉంటాను
  alternative: నేను వారికి దేవుడనై ఉంటాను
  rationale: హీబ్రూ వాక్యం దేవునిలో అస్తిత్వ మార్పును కాక, దేవునికీ నిబంధన ప్రజలకూ మధ్య సంబంధాన్ని వ్యక్తం చేస్తుంది. ఎంచుకున్న రూపం ఆ సంబంధ సూత్రాన్ని స్పష్టంగా నిలుపుతుంది.
- issue: עוֹלָם యొక్క కాలవ్యాప్తిని అతిగా నిర్వచించకుండా నిలుపడం
  choice: శాశ్వత
  alternative: ఎల్లకాలం ఉండే
  rationale: ‘శాశ్వత’ మూలపదంలోని దీర్ఘకాలిక, నిరంతర నిబంధనాత్మక బలాన్ని నిలుపుతుంది; దాని తాత్త్విక పరిమితులను ఈ వచనంలోనే అదనంగా నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన శైలి. ‘పరదేశిగా నివసిస్తున్న’ అనే ప్రయోగం మూలంలోని నివాసి-పరదేశి భావాన్ని సహజంగా వ్యక్తం చేస్తుంది; ‘స్వాస్థ్యం’ భూహక్కు మరియు నిబంధనాత్మక స్వాధీన భావాన్ని కాపాడుతుంది.
