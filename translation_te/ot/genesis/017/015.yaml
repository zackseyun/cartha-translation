id: GEN.17.15
reference: Genesis 17:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֱלֹהִים֙ אֶל אַבְרָהָ֔ם שָׂרַ֣י אִשְׁתְּ/ךָ֔ לֹא תִקְרָ֥א אֶת שְׁמָ֖/הּ שָׂרָ֑י כִּ֥י שָׂרָ֖ה שְׁמָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/015.yaml
  text: Then God said to Abraham[a], “As for Sarai your wife, you shall not call her name Sarai, for Sarah is her name.”
translation:
  language: te
  text: 'అప్పుడు దేవుడు అబ్రాహాముతో ఇలా అన్నాడు: “నీ భార్య శారయి విషయమైతే, ఆమె పేరును శారయి అని పిలవకూడదు; ఆమె పేరు శారా[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత సహజంగా: “ఇకపై ఆమెను శారయి అని పిలవకు; ఆమె పేరు శారా.”'
    reason: నామకరణ సూత్రానికి సహజమైన తెలుగు ప్రత్యామ్నాయం; ‘ఇకపై’ అనే భావం పేరు మార్చే సందర్భం నుంచి గ్రహించబడుతుంది.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... ఇలా అన్నాడు
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది. ‘అప్పుడు’ క్రమాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; ‘ఇలా అన్నాడు’ ప్రత్యక్ష వాక్యాన్ని సుగమంగా పరిచయం చేస్తుంది.
- source_word: אֱלֹהִים
  choice: దేవుడు
  rationale: ఈ సందర్భంలో ఏకవచనంగా ఇశ్రాయేలు దేవుణ్ణి సూచించే ప్రామాణిక తెలుగు రూపం.
- source_word: אֶל אַבְרָהָם
  choice: అబ్రాహాముతో
  rationale: మాట ఎవరిని ఉద్దేశించి చెప్పబడిందో తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: שָׂרַי אִשְׁתְּךָ
  choice: నీ భార్య శారయి
  rationale: శారయిని అబ్రాహాము భార్యగా గుర్తించే మూలపాఠ భావాన్ని నేరుగా నిలుపుతుంది; పాత పేరును కొత్త పేరుతో పోల్చడం కోసం ‘శారయి’ రూపాన్ని ప్రత్యేకంగా ఉంచుతుంది.
- source_word: לֹא תִקְרָא אֶת שְׁמָהּ שָׂרָי
  choice: ఆమె పేరును శారయి అని పిలవకూడదు
  rationale: దైవిక ఆదేశంలోని నిషేధ భావాన్ని, అలాగే ‘పేరు—పిలువు’ అనే హీబ్రూ నామకరణ సూత్రాన్ని సాధ్యమైనంతవరకు నిలుపుతుంది.
- source_word: כִּי
  choice: ;
  rationale: ఇక్కడ తరువాతి నామప్రకటన ముందున్న నిషేధానికి కారణం/వివరణగా వస్తుంది. తెలుగులో అర్ధవిరామం ఈ సంబంధాన్ని సహజంగా చూపుతుంది; స్పష్టమైన కారణార్థాన్ని పాఠ్య నిర్మాణమే అందిస్తుంది.
- source_word: שָׂרָה שְׁמָהּ
  choice: ఆమె పేరు శారా
  rationale: క్రియలేని హీబ్రూ వాక్యాన్ని నేరుగా ప్రతిబింబిస్తూ, కొత్త పేరును గంభీరంగా ప్రకటిస్తుంది. మూలంలో స్పష్టంగా లేని భవిష్యత్ సహాయక క్రియను చేర్చదు.
theological_decisions:
- issue: పేరు మార్చే సూత్రాన్ని అనువదించడం
  choice: ‘ఆమె పేరును శారయి అని పిలవకూడదు; ఆమె పేరు శారా’ అనే నిషేధం మరియు ప్రత్యక్ష నామప్రకటన
  alternative: ‘ఇకపై ఆమెను శారయి అని పిలవకు; ఆమె పేరు శారా’
  rationale: ఎంచుకున్న రూపం మూలంలోని ‘పేరు’ పదబంధాన్ని, నామకరణ ప్రకటనలోని గంభీరతను కాపాడుతుంది. ప్రత్యామ్నాయం తెలుగులో మరింత సహజమైనదైనా, మూలంలో విడిగా లేని ‘ఇకపై’ అనే కాలసూచక పదాన్ని స్పష్టంగా చేర్చుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే దైవిక నామప్రకటనకు తగిన గంభీరతతో రూపొందించబడింది. ‘శారయి/శారా’ అనే రెండు భిన్న నామరూపాలు స్పష్టంగా నిలుపబడ్డాయి.
