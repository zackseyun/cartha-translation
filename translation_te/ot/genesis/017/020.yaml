  source_fidelity: హీబ్రూలో ఇష్మాయేలు విషయంగా అబ్రాహాము చేసిన విన్నపాన్ని ఆలకించానని చెప్పి, ఆశీర్వాదం, సంతానవృద్ధి, విస్తరణ, పన్నెండు మంది నాయకులకు తండ్రి కావడం, గొప్ప జాతిగా చేయడం ప్రకటించబడింది. ముసాయిదా ఈ అంశాలను నమ్మకంగా అందిస్తుంది. అయితే ‘గొప్ప జనంగా’ కంటే గోయ్‌కు సందర్భానుగుణమైన, ఆధునిక తెలుగులో సహజమైన ‘గొప్ప జాతిగా’ ఉత్తమం; అలాగే వ్యక్తిని ‘విస్తరింపజేస్తాను’ అనడం కంటే అతని సంతానాన్ని పెంచడం స్పష్టంగా, సహజంగా ఉంటుంది.
