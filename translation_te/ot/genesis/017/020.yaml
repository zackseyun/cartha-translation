id: GEN.17.20
reference: Genesis 17:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּֽ/לְ/יִשְׁמָעֵ֘אל שְׁמַעְתִּי/ךָ֒ הִנֵּ֣ה בֵּרַ֣כְתִּי אֹת֗/וֹ וְ/הִפְרֵיתִ֥י אֹת֛/וֹ וְ/הִרְבֵּיתִ֥י אֹת֖/וֹ בִּ/מְאֹ֣ד מְאֹ֑ד שְׁנֵים עָשָׂ֤ר נְשִׂיאִם֙ יוֹלִ֔יד וּ/נְתַתִּ֖י/ו לְ/ג֥וֹי גָּדֽוֹל׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/020.yaml
  text: And as for Ishmael, I have heard you. Look, I have blessed him, and will make him fruitful, and will multiply him exceedingly. He will father twelve princes, and I will make him into a great nation.
translation:
  language: te
  text: ఇష్మాయేలు విషయమైతే, నేను నీ మాట విన్నాను. ఇదిగో, నేను అతన్ని ఆశీర్వదించాను; అతనికి సంతానం కలిగించి, అతని సంతానాన్ని అత్యధికంగా పెంచుతాను. అతడు పన్నెండు మంది అధిపతులకు తండ్రి అవుతాడు; నేను అతన్ని గొప్ప జాతిగా చేస్తాను.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּלְיִשְׁמָעֵאל
  choice: ఇష్మాయేలు విషయమైతే
  rationale: లְ ఉపసర్గం ఇక్కడ అంశాన్ని సూచిస్తోంది; ఆధునిక తెలుగులో సహజంగా వ్యక్తమయ్యేలా అనువదించబడింది.
- source_word: שְׁמַעְתִּיךָ
  choice: నేను నీ మాట విన్నాను
  rationale: అక్షరార్థంగా ‘నేను నిన్ను విన్నాను’; సందర్భంలో అబ్రాహాము చేసిన విజ్ఞప్తిని ఆలకించడాన్ని తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: הִנֵּה
  choice: ఇదిగో
  rationale: శ్రద్ధను ఆకర్షించి, తరువాతి ప్రకటనకు బలం చేకూర్చే హీబ్రూ సూచక పదాన్ని నిలుపుతుంది.
- source_word: הִפְרֵיתִי אֹתוֹ
  choice: అతన్ని సంతానవంతుణ్ణి చేసి
  rationale: פרה యొక్క సంతానవృద్ధి భావాన్ని సహజమైన తెలుగులో అందిస్తుంది; వరుస క్రియలతో అనుసంధానించబడింది.
- source_word: הִרְבֵּיתִי אֹתוֹ בִּמְאֹד מְאֹד
  choice: అత్యధికంగా విస్తరింపజేస్తాను
  rationale: מְאֹד מְאֹד అనే తీవ్రతను ‘అత్యధికంగా’ తెలియజేస్తుంది; רבה యొక్క సంఖ్యాపరమైన విస్తరణ భావాన్ని కాపాడుతుంది.
- source_word: נְשִׂיאִם
  choice: అధిపతులు
  rationale: ఈ పదం గోత్ర లేదా ప్రజా నాయకులను సూచిస్తుంది; ఆధునిక రాజకీయ అర్థం బలంగా ఉన్న ‘రాజకుమారులు’ కంటే ‘అధిపతులు’ విస్తృతమైన మూలార్థాన్ని మెరుగ్గా నిలుపుతుంది.
- source_word: לְגוֹי גָּדוֹל
  choice: గొప్ప జనంగా
  rationale: גּוֹי ఇక్కడ పెద్ద ప్రజాసమూహం లేదా జనాన్ని సూచిస్తుంది; ‘దేశం’ అనే భూభాగకేంద్రీకృత భావాన్ని రుద్దకుండా మూలాన్ని అనుసరిస్తుంది.
theological_decisions:
- issue: ఇష్మాయేలు గురించి దేవుని ఆశీర్వాద వాగ్దానం
  choice: ‘నేను అతన్ని ఆశీర్వదించాను’ అనే సంపూర్ణ క్రియారూపాన్ని అలాగే ఉంచి, తరువాతి క్రియలను భవిష్యత్ వాగ్దానాలుగా అనువదించడం
  alternative: అన్ని క్రియలను భవిష్యత్ కాలంలో ‘ఆశీర్వదిస్తాను... చేస్తాను’ అని సమరీకరించడం
  rationale: హీబ్రూ పాఠంలోని క్రియారూప భేదాన్ని నిలుపుతుంది; ఆశీర్వాదం నిశ్చయించబడినదనే భావాన్ని ఏకరీకరణ ద్వారా తొలగించదు.
- issue: ‘పన్నెండు అధిపతులకు తండ్రి అవుతాడు’ అనే వంశపారంపర్య ప్రకటన
  choice: వ్యక్తిగత పితృత్వ భాషను నిలుపడం
  alternative: ‘అతని నుండి పన్నెండు అధిపతులు వస్తారు’
  rationale: יוֹלִיד అనే హిఫిల్ రూపంలోని ‘కనజేయడం/తండ్రి కావడం’ భావాన్ని కాపాడుతుంది; తరువాతి వంశ నాయకుల స్వరూపంపై అదనపు వ్యాఖ్యానం రుద్దదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనదైనా సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్య నిర్మాణం. మూలంలోని ‘ఇదిగో’ అనే ఉద్ఘాటనను నిలిపి, ‘జనం’ మరియు ‘అధిపతులు’ వంటి పదాలతో ప్రాచీన సామాజిక సందర్భాన్ని అనవసరంగా ఆధునికీకరించలేదు.
