  naturalness: ‘అప్పుడు అబ్రాము బోర్లా పడిపోయాడు. దేవుడు అతనితో ఇలా మాట్లాడాడు:’ ఆధునిక ప్రామాణిక తెలుగులో స్పష్టంగా, సహజంగా ఉంది. రెండు చిన్న వాక్యాలు హెబ్రీ కథనంలోని వరుస క్రియలను సులభంగా ప్రతిబింబిస్తాయి; చివరి కోలన్ తరువాతి వచనంలోని ప్రత్యక్ష ప్రసంగాన్ని సహజంగా పరిచయం చేస్తుంది.
  terminology: ‘అబ్రాము’ సరైన కథన-దశ పేరు; ‘దేవుడు’ אֱלֹהִיםకు సందర్భానుసారమైన ఏకవచన అనువాదం. ‘అతనితో’ హెబ్రీ אִתּוֹను సముచితంగా ప్రతిఫలిస్తుంది. పాదటిప్పణి అవసరమయ్యే పాఠభేదం లేదా అనిశ్చితి లేదు.
