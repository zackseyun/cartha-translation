  text: Then Abram fell on his face, and God spoke with him, saying,
translation:
  language: te
  text: 'అప్పుడు అబ్రాము బోర్లా పడిపోయాడు. దేవుడు అతనితో ఇలా మాట్లాడాడు:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּפֹּל ... עַל־פָּנָיו
  choice: సాష్టాంగపడ్డాడు
  rationale: నఫల్ అనే క్రియతో పాటు ‘తన ముఖం మీద’ అనే పదబంధం ఇక్కడ భక్తిపూర్వకంగా నేలపై బోర్లపడడాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘సాష్టాంగపడ్డాడు’ ఆ చర్యను సహజంగా, సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: אַבְרָם
  choice: అబ్రాము
  rationale: కథలో ఈ దశలో అతని పేరు ఇంకా అబ్రాహాముగా మార్చబడలేదు; అందువల్ల ‘అబ్రాము’ అని లిప్యంతరీకరించబడింది.
- source_word: וַיְדַבֵּר
  choice: మాట్లాడాడు
  rationale: పియేల్ రూపంలోని דבר సాధారణంగా ‘మాట్లాడు’ అని అర్థం. తరువాతి לֵאמֹרతో కలిపి మాటలను పరిచయం చేస్తుంది.
- source_word: אִתּוֹ
  choice: అతనితో
  rationale: את అనే విభక్తి ఇక్కడ ‘తో’ అనే భావాన్ని ఇస్తుంది; అందువల్ల మూలంలోని సంబంధాత్మక నుడికారాన్ని నిలుపుతూ ‘అతనితో’ అని అనువదించబడింది.
- source_word: אֱלֹהִים
  choice: దేవుడు
  rationale: పదరూపం బహువచన ఆకారంలో ఉన్నా, ఈ సందర్భంలో ఏకవచన క్రియతో వాడబడి ఒకే దేవుణ్ణి సూచిస్తుంది.
- source_word: לֵאמֹר
  choice: ఇలా
  rationale: אמר యొక్క infinitive construct రాబోయే ప్రత్యక్ష మాటలను పరిచయం చేస్తుంది. తెలుగులో ‘ఇలా మాట్లాడాడు:’ అనే నిర్మాణం సహజంగా అదే పని చేస్తుంది.
- source_word: וַ
  choice: అప్పుడు
  rationale: కథన క్రమాన్ని తెలిపే ప్రారంభ wawను ఆధునిక తెలుగులో సహజమైన ‘అప్పుడు’గా ఇచ్చాం.
theological_decisions:
- issue: אֱלֹהִים పదం యొక్క సంఖ్య, సూచిత వ్యక్తి
  choice: ఏకవచనంగా ‘దేవుడు’
  alternative: పదరూపాన్ని మాత్రమే అనుసరించి బహువచనంగా ‘దేవుళ్లు’
  rationale: సందర్భం నిబంధన చేసే దేవుణ్ణే సూచిస్తుంది; క్రియా రూపం కూడా ఏకవచనంలో ఉంది. కాబట్టి బహువచన అనువాదం వ్యాకరణానికీ సందర్భానికీ సరిపోదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని రెండు వాక్యక్రియలను నిలుపుతూ, לֵאמֹרను తెలుగులో సహజమైన ప్రత్యక్ష వాక్య పరిచయంగా ఇచ్చాం.
