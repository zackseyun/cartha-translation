  text: וַ/יֹּ֥אמֶר אַבְרָהָ֖ם אֶל הָֽ/אֱלֹהִ֑ים ל֥וּ יִשְׁמָעֵ֖אל יִחְיֶ֥ה לְ/פָנֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/018.yaml
  text: And Abraham said to God[a], “Oh, that Ishmael might live before you!”
translation:
  language: te
  text: 'అబ్రాహాము దేవునితో ఇలా అన్నాడు: “ఇష్మాయేలు నీ సన్నిధిలో జీవిస్తే ఎంత బాగుండును![a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఇష్మాయేలు నీ ఎదుట జీవిస్తే ఎంత బాగుండును!” లేదా “ఇష్మాయేలు నీ అనుగ్రహంలో జీవిస్తే ఎంత బాగుండును!”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... అన్నాడు
  rationale: వావ్-క్రమరూపం కథనాన్ని ముందుకు నడిపిస్తుంది; ఆధునిక తెలుగు కథనంలో ‘అప్పుడు ... అన్నాడు’ సహజంగా ఉంటుంది.
- source_word: אֶל הָאֱלֹהִים
  choice: దేవునితో
  rationale: మాట్లాడే క్రియతో ఎల్ అనే విభక్త్యర్థాన్ని తెలుగులో ‘తో’ సహజంగా వ్యక్తపరుస్తుంది; నిర్దిష్ట దేవుణ్ణి సందర్భానుసారంగా ‘దేవుడు’ అని అనువదించాం.
- source_word: לוּ
  choice: '...తే చాలు'
  rationale: ఇక్కడ ఇది షరతు కాదు, బలమైన కోరికను తెలిపే ఆశార్థకం. ‘...తే చాలు’ అబ్రాహాము ఆకాంక్షను సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: יִשְׁמָעֵאל
  choice: ఇష్మాయేలు
  rationale: వ్యక్తి పేరును తెలుగులో ప్రాచుర్యంలో ఉన్న రూపంలో లిప్యంతరీకరించాం.
- source_word: יִחְיֶה
  choice: జీవిస్తే
  rationale: לוּతో కలిసి ఉన్న అసంపూర్ణ క్రియారూపం కోరుకున్న జీవనాన్ని సూచిస్తుంది; ఆశార్థక నిర్మాణంలో ‘జీవిస్తే’ దానిని సహజంగా అందిస్తుంది.
- source_word: לְפָנֶיךָ
  choice: నీ సన్నిధిలో
  rationale: అక్షరార్థంగా ‘నీ ముఖం ఎదుట’; ‘నీ సన్నిధిలో’ అనే రూపం సంబంధాత్మక భావాన్ని నిలుపుతూ కేవలం స్థలార్థానికో, స్పష్టంగా అనుగ్రహార్థానికో పరిమితం చేయదు.
theological_decisions:
- issue: దేవుని ఎదుట ఇష్మాయేలు జీవించాలని అబ్రాహాము కోరిన మాటలోని భావం
  choice: నీ సన్నిధిలో
  alternative: నీ ఎదుట; నీ అనుగ్రహంలో
  rationale: హీబ్రూ పదబంధం దేవుని సన్నిధిలో లేదా ఆయన అనుగ్రహంలో జీవించడాన్ని సూచించగలదు; అయితే ఇక్కడ ఒడంబడిక సంబంధమైన పూర్తి అర్థాన్ని వచనం స్పష్టంగా నిర్వచించదు. అందువల్ల theological tension‌ను విస్తరించి పరిష్కరించకుండా సంక్షిప్త భావాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, అయినా గౌరవప్రదమైన బైబిలు కథన శైలిలో రూపొందించాం. ఆశార్థక భావానికి ‘...తే చాలు’ వాడి భావోద్వేగాన్ని నిలిపాం.
