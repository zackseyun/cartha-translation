source:
  edition: WLC
  text: וַ/יִּקַּ֨ח אַבְרָהָ֜ם אֶת יִשְׁמָעֵ֣אל בְּנ֗/וֹ וְ/אֵ֨ת כָּל יְלִידֵ֤י בֵית/וֹ֙ וְ/אֵת֙ כָּל מִקְנַ֣ת כַּסְפּ֔/וֹ כָּל זָכָ֕ר בְּ/אַנְשֵׁ֖י בֵּ֣ית אַבְרָהָ֑ם וַ/יָּ֜מָל אֶת בְּשַׂ֣ר עָרְלָתָ֗/ם בְּ/עֶ֨צֶם֙ הַ/יּ֣וֹם הַ/זֶּ֔ה כַּ/אֲשֶׁ֛ר דִּבֶּ֥ר אִתּ֖/וֹ אֱלֹהִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/023.yaml
  text: So Abraham took Ishmael his son[a], and all those born in his house, and all those bought with his money, every male among the men of Abraham’s household, and circumcised the flesh of their foreskin on that very day[d][c][b], just as God had spoken to him.
translation:
  language: te
  text: అప్పుడు అబ్రాహాము తన కుమారుడైన ఇష్మాయేలును, తన ఇంటిలో పుట్టిన వారందరినీ, తన సొమ్ముతో కొనుగోలు చేసిన వారందరినీ[a]—అబ్రాహాము ఇంటివారిలోని ప్రతి మగవాణ్ణి—తీసుకొని, దేవుడు అతనితో మాట్లాడినట్టే[c], అదే రోజునే[b] వారి పురుషాంగాల ముందుచర్మాన్ని కోసి సున్నతి చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “తన వెండితో సంపాదించుకున్నవారు”; అబ్రాహాము ఇంటివారిగా కొనుగోలు చేయబడిన వ్యక్తులను ఇది సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో “ఈ రోజునే”; అబ్రాహాము అదే రోజు ఆలస్యం చేయకుండా చేసినట్లు ఈ నుడికారం నొక్కిచెబుతుంది.
    reason: lexical_alternative
  - marker: c
    text: లేదా, “దేవుడు అతనికి చెప్పినట్టే.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקַּח
  choice: తీసుకొని
  rationale: కథనంలో לקח అనే క్రియకు సాధారణ అర్థం ‘తీసుకొను’; ఇక్కడ సున్నతి చేయించవలసిన వారిని అబ్రాహాము సమకూర్చుకొని చర్య చేపట్టడాన్ని సూచిస్తుంది.
- source_word: יְלִידֵי בֵיתוֹ
  choice: తన ఇంట పుట్టిన వారందరినీ
  rationale: ‘తన ఇంటివారిలో పుట్టినవారు’ అనే మూలభాష చిత్రాన్ని నిలుపుతూ, వారి సామాజిక స్థితిని ప్రధాన వాక్యంలో అవసరానికి మించి నిర్దిష్టం చేయదు.
- source_word: מִקְנַת כַּסְפּוֹ
  choice: తన సొమ్ముతో కొనుగోలు చేసిన వారందరినీ
  rationale: కొనుగోలు ద్వారా అబ్రాహాము ఇంటివారిలో చేరిన వ్యక్తులనే ఈ పదబంధం సూచిస్తుంది; ‘సొమ్ము’ సహజమైన ఆధునిక తెలుగు.
- source_word: כָּל זָכָר בְּאַנְשֵׁי בֵית אַבְרָהָם
  choice: అబ్రాహాము ఇంటివారిలోని ప్రతి మగవాణ్ణి
  rationale: זָכָר అనే స్పష్టమైన లింగ సూచనను ‘ప్రతి మగవాడు’గా నిలుపుతూ, ‘మగవారిలో ప్రతి మగవాడు’ అనే తెలుగు పునరుక్తిని నివారిస్తుంది.
- source_word: וַיָּמָל אֶת בְּשַׂר עָרְלָתָם
  choice: వారి పురుషాంగపు ముందుచర్మాన్ని కోసి వారికి సున్నతి చేశాడు
  rationale: సున్నతి చర్యను స్పష్టంగా, శరీర సంబంధ మూలపదజాలాన్ని మర్యాదపూర్వకమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: అదే రోజునే
  rationale: ఆ రోజే ఆలస్యం చేయకుండా ఆజ్ఞను అమలు చేశాడనే హీబ్రూ నొక్కిచెప్పే భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: כַּאֲשֶׁר דִּבֶּר אִתּוֹ אֱלֹהִים
  choice: దేవుడు తనతో చెప్పినట్టే
  rationale: దేవుడు అబ్రాహాముతో పలికిన మాటకు అనుగుణంగా అతడు చేసినట్లు తెలుపుతుంది; אִתּוֹ లోని ‘అతనితో’ భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: אֱלֹהִים పదానికి అనువాదం
  choice: దేవుడు
  alternative: దేవత
  rationale: ఆదికాండము 17లో అబ్రాహాముతో నిబంధనగా మాట్లాడుతున్న ఏకైక దేవుడే స్పష్టమైన సూచితుడు.
- issue: ఇంటివారి వర్ణనలో లింగ సూచన
  choice: ప్రతి మగవాణ్ణి
  alternative: ప్రతి ఒక్కరినీ
  rationale: మూలంలోని זָכָר స్పష్టంగా ‘మగవాడు’ అని చెబుతుంది; లింగతటస్థ పదం ఈ సమాచారాన్ని కోల్పోయేలా చేస్తుంది.
- issue: דִּבֶּר אִתּוֹ లో ‘చెప్పు/మాట్లాడు’ భావం
  choice: దేవుడు తనతో చెప్పినట్టే
  alternative: దేవుడు తనతో మాట్లాడినట్టే
  rationale: సందర్భంలో దేవుని ఆజ్ఞకు విధేయత ప్రధానంగా ఉన్నందున ‘చెప్పినట్టే’ సహజం; అయితే ఉపసర్గ సంభాషణాత్మకమైన ‘తనతో మాట్లాడాడు’ అనే భావాన్నీ అనుమతిస్తుంది, దానిని పాదటిప్పణిలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథనశైలి వాడబడింది. ‘పురుషాంగపు ముందుచర్మం’ శరీరార్థాన్ని స్పష్టంగా తెలియజేసే సాధారణ, మర్యాదపూర్వక పదబంధం. ఇంటివారి సామాజిక స్థితిని మూలం చెప్పిన మేరకే ఉంచి, ప్రధాన వాక్యంలో ‘దాసులు’ అని అదనంగా నిర్ధారించలేదు.
