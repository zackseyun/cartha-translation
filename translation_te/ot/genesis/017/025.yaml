translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; శరీర సంబంధ విషయాన్ని మర్యాదగా, కాని మూలంలోని స్పష్టతను తగ్గించకుండా తెలిపింది. హీబ్రూ వాక్యనిర్మాణంలోని ఇష్మాయేలు సున్నతి పొందడం మరియు ముందుచర్మం కర్మగా ఉండడం రెండింటినీ సహజమైన తెలుగులో వ్యక్తం చేయడానికి రెండు సమన్విత ఉపవాక్యాలు వాడబడ్డాయి.
