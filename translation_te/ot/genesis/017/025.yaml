  yaml_path: translation/ot/genesis/017/025.yaml
  text: And Ishmael his son was thirteen years old when the flesh of his foreskin was circumcised[a].
translation:
  language: te
  text: అబ్రాహాము కుమారుడైన ఇష్మాయేలుకు తన ముందుచర్మపు మాంసానికి సున్నతి చేయబడినప్పుడు పదమూడు సంవత్సరాలు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/יִשְׁמָעֵאל בְּנ֔/וֹ
  choice: అతని కుమారుడైన ఇష్మాయేలు
  rationale: వావ్ ఇక్కడ కథన కొనసాగింపును సూచిస్తుంది; తెలుగులో ప్రత్యేకంగా ‘మరియు’ అని పెట్టకుండా వాక్యప్రవాహంలో సహజంగా వ్యక్తమవుతుంది. בנו అనే సంబంధాన్ని ‘అతని కుమారుడైన’ అని స్పష్టంగా నిలిపాం.
- source_word: בֶּן שְׁלֹשׁ עֶשְׂרֵה שָׁנָה
  choice: అతనికి పదమూడు సంవత్సరాలు
  rationale: హీబ్రూ వయస్సు ప్రయోగానికి సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: בְּ/הִמֹּל/וֹ
  choice: సున్నతి చేయబడినప్పుడు
  rationale: בְּ + నిఫ్అల్ infinitive construct + 3ms suffix కాలార్థాన్ని, ఇష్మాయేలు క్రియను పొందినవాడనే భావాన్ని ఇస్తుంది.
- source_word: בְּשַׂר עָרְלָת/וֹ
  choice: అతని పురుషాంగపు ముందుచర్మం
  rationale: ‘మాంసం’ అనే మూలపదాన్ని తెలుగులో యథాతథంగా చేర్చడం శరీర నిర్మాణపరంగా అసహజంగా ఉంటుంది; సందర్భంలోని స్పష్టమైన శరీర భాగాన్ని గౌరవప్రదమైన, సాధారణ ఆధునిక పదాలతో తెలిపాం.
- source_word: אֵת
  choice: '[ప్రత్యేకంగా అనువదించలేదు]'
  rationale: ఇది నిర్దిష్ట ప్రత్యక్ష కర్మ సూచిక; తెలుగులో దీనికి స్వతంత్ర పదసమానం అవసరం లేదు.
