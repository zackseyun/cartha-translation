source:
  edition: WLC
  text: וַ/יִּפֹּ֧ל אַבְרָהָ֛ם עַל פָּנָ֖י/ו וַ/יִּצְחָ֑ק וַ/יֹּ֣אמֶר בְּ/לִבּ֗/וֹ הַ/לְּ/בֶ֤ן מֵאָֽה שָׁנָה֙ יִוָּלֵ֔ד וְ/אִ֨ם שָׂרָ֔ה הֲ/בַת תִּשְׁעִ֥ים שָׁנָ֖ה תֵּלֵֽד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/017.yaml
  text: Then Abraham fell on his face and laughed[a], and said in his heart, “Will a child be born to a man a hundred years old? And will Sarah, who is ninety years old, give birth?”
translation:
  language: te
  text: 'అప్పుడు అబ్రాహాము సాష్టాంగపడి నవ్వాడు; తన మనసులో ఇలా అనుకున్నాడు: “వందేళ్ల వయసున్నవానికి కుమారుడు[a] పుడతాడా? తొంభై ఏళ్ల వయసున్న శారా బిడ్డను కంటుందా?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “బిడ్డ.” హీబ్రూలో ఉన్న పదం సాధారణంగా “కుమారుడు” అని అర్థం; అయితే ఈ సందర్భంలో సంతానం అనే విస్తృత భావంలో “బిడ్డ” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפֹּל אַבְרָהָם עַל־פָּנָיו
  choice: అబ్రాహాము సాష్టాంగపడి
  rationale: ‘ముఖం మీద పడడం’ అనే హీబ్రూ నుడికారం వినయపూర్వకంగా నేలపై బోర్లపడే భంగిమను సూచిస్తుంది. ఆధునిక తెలుగు వాడుకలో ‘సాష్టాంగపడి’ ఆ భావాన్ని సహజంగా, సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: וַיִּצְחָק
  choice: నవ్వుకొని
  rationale: צחק అనే క్రియకు నేరుగా ‘నవ్వు’ అని అర్థం. నవ్వు అవిశ్వాసంతోనో ఆనందంతోనో కలిగిందని అనువాదంలో అదనంగా నిర్ణయించలేదు; ఇస్సాకు పేరుతో ఉన్న పదసంబంధాన్ని కూడా ఇది నిలుపుతుంది.
- source_word: וַיֹּאמֶר בְּלִבּוֹ
  choice: తన మనసులో ఇలా అనుకున్నాడు
  rationale: అక్షరార్థంగా ‘తన హృదయంలో అన్నాడు.’ ఇది బయటకు పలకని అంతరంగ స్పందన కాబట్టి తెలుగులో ‘మనసులో అనుకున్నాడు’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: הַלְּבֶן ... יִוָּלֵד
  choice: కుమారుడు పుడతాడా?
  rationale: בן సాధారణంగా ‘కుమారుడు’ అని అర్థం; ఇక్కడ లింగాన్ని తెలిపే మూలపదాన్ని నిలుపుతూ, Niphal יִוָּלֵד ను సహజమైన ‘పుడతాడు’గా అనువదించాం.
- source_word: לְבֶן מֵאָה שָׁנָה
  choice: వందేళ్ల వయసున్నవానికి
  rationale: అక్షరార్థంగా ‘వంద సంవత్సరాలవానికి.’ తండ్రి వయస్సును సూచించే ప్రశ్నను తెలుగులో సహజమైన వయస్సు నుడికారంతో అందిస్తుంది.
- source_word: וְאִם שָׂרָה הֲבַת תִּשְׁעִים שָׁנָה
  choice: తొంభై ఏళ్ల వయసున్న శారా
  rationale: ‘తొంభై సంవత్సరాల కుమార్తె’ అనే హీబ్రూ వయస్సు నుడికారాన్ని అదనపు ‘స్త్రీ’ నామవాచకం చేర్చకుండా సహజ తెలుగులో వ్యక్తం చేస్తుంది. וְאִם ఇక్కడ జతగా వచ్చే రెండో అలంకారప్రశ్నను ప్రవేశపెడుతుంది.
- source_word: תֵּלֵד
  choice: బిడ్డను కంటుందా?
  rationale: స్త్రీ కర్తగా ఉన్న Qal ילד ప్రసవించడాన్ని సూచిస్తుంది. ‘బిడ్డను కను’ అనేది స్పష్టమైన, సహజమైన తెలుగు ప్రయోగం.
theological_decisions:
- issue: అబ్రాహాము నవ్వు స్వభావం
  choice: ‘నవ్వుకొని’ అని తటస్థంగా అనువదించడం
  alternative: ‘అవిశ్వాసంతో నవ్వాడు’ లేదా ‘ఆనందంతో నవ్వాడు’
  rationale: ఈ వచనం నవ్వును, అంతరంగ ప్రశ్నలను తెలియజేస్తుంది గాని ఆ నవ్వు యొక్క నైతిక లేదా భావోద్వేగ స్వభావాన్ని స్పష్టంగా నిర్వచించదు. అందువల్ల కథనంలోని ఉద్దేశపూర్వక ఉద్వేగాన్ని అనువాదం పరిష్కరించదు.
- issue: בן యొక్క లింగ నిర్దిష్టత
  choice: ప్రధాన పాఠంలో ‘కుమారుడు’; పాదసూచికలో ‘బిడ్డ’ ప్రత్యామ్నాయం
  alternative: ప్రధాన పాఠంలో ‘బిడ్డ’
  rationale: హీబ్రూ בן కు ఇక్కడ ‘కుమారుడు’ అనే నిర్దిష్ట అర్థం సహజమైనది; అయితే సందర్భంలో సంతానం పుట్టే సాధ్యతపై దృష్టి ఉండడం వల్ల విస్తృతమైన ‘బిడ్డ’ కూడా సాధ్యమైన అనువాదమని పాదసూచికలో సూచించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘సాష్టాంగపడి’ బైబిలు సందర్భంలో సులభంగా అర్థమయ్యే గంభీర పదం; ప్రశ్నలను అలంకారప్రశ్నలుగానే ఉంచాం. ప్రధాన పాఠంలోని [a] గుర్తు పాదసూచికతో సరిపోతుంది.
