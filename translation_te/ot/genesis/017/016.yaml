  rationale: గּוֹיִם యొక్క ‘nations’ భావాన్ని తెలుగులో ‘జాతులు’గా స్పష్టపరచి, עַמִּים కు ఉన్న ‘ప్రజలు’ అనే భేదాన్ని నిలిపాం. చివరి వాక్యంలో రాజులు శారా నుండి వంశపరంగా ఉద్భవిస్తారనే భావాన్ని, మూలంలోని సాధారణ ఉద్భవ/సంబంధ భావాన్ని మించకుండా సవరించాం. ప్రధాన వాక్యంలో ‘తల్లి’ని చేర్చలేదు; ఆ సహజ భావవ్యక్తీకరణను పాదసూచికలో మాత్రమే ఉంచాం.
