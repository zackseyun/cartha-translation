  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/בֵרַכְתִּ֣י אֹתָ֔/הּ וְ/גַ֨ם נָתַ֧תִּי מִמֶּ֛/נָּה לְ/ךָ֖ בֵּ֑ן וּ/בֵֽרַכְתִּ֨י/הָ֙ וְ/הָֽיְתָ֣ה לְ/גוֹיִ֔ם מַלְכֵ֥י עַמִּ֖ים מִמֶּ֥/נָּה יִהְיֽוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/016.yaml
  text: I will bless her[a], and moreover I will give you a son by her. I will bless her, and she will become nations[b]; kings of peoples will come from her.
translation:
  language: te
  text: నేను ఆమెను ఆశీర్వదిస్తాను. అంతేకాదు, ఆమె ద్వారా నీకు ఒక కుమారుణ్ణి ఇస్తాను. నేను ఆమెను ఆశీర్వదిస్తాను; ఆమె జాతులకు మూలమవుతుంది[a]. ప్రజల రాజులు ఆమె నుండి ఉద్భవిస్తారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “ఆమె జాతులుగా అవుతుంది.” “ఆమె జాతులకు తల్లి అవుతుంది” అని కూడా భావాన్ని వ్యక్తం చేయవచ్చు.
    reason: హీబ్రూ వాక్య నిర్మాణంలోని అసాధారణతను, దానికి సాధ్యమైన సహజ భావానువాదాన్ని తెలియజేయడానికి.
lexical_decisions:
- source_word: וּבֵרַכְתִּי / וּבֵרַכְתִּיהָ
  choice: నేను ఆమెను ఆశీర్వదిస్తాను / నేను ఆమెను ఆశీర్వదిస్తాను
  rationale: బָּרַךְ అనే పదంలోని దేవుని అనుగ్రహం, నిబంధన సంబంధమైన భావభారం నిలిచేలా ‘ఆశీర్వదిస్తాను’ అని అనువదించాం. మూలంలోని పునరుక్తిని కూడా నిలిపాం.
- source_word: וְגַם
  choice: అంతేకాదు
  rationale: ఇది కేవలం కలిపే పదం కాక, తరువాతి వాగ్దానాన్ని నొక్కిచెప్పే అదనపు భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: נָתַתִּי מִמֶּנָּה לְךָ בֵּן
  choice: ఆమె ద్వారా నీకు ఒక కుమారుణ్ణి ఇస్తాను
  rationale: క్రియారూపం qatal అయినప్పటికీ, వాగ్దాన సందర్భంలో భవిష్యత్తును సూచిస్తుంది. ‘ఆమె ద్వారా’ అనేది కుమారుడు శారా ద్వారా కలుగుతాడనే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: וְהָיְתָה לְגוֹיִם
  choice: ఆమె జనాలకు మూలమవుతుంది
  rationale: హీబ్రూ అక్షరార్థంగా ‘ఆమె జనాలుగా అవుతుంది/జనాల కొరకు అవుతుంది’ అనే అసాధారణ నిర్మాణాన్ని కలిగి ఉంది. తెలుగులో అర్థమయ్యేలా ‘జనాలకు మూలమవుతుంది’ అని ఇచ్చి, అక్షరార్థాన్ని పాదసూచికలో నిలిపాం.
- source_word: מַלְכֵי עַמִּים
  choice: ప్రజల రాజులు
  rationale: עַמִּים ను ‘ప్రజలు’గా అనువదించడం ద్వారా ముందున్న גוֹיִם (‘జనాలు’)తో ఉన్న పదభేదాన్ని నిలిపాం.
- source_word: מִמֶּנָּה יִהְיוּ
  choice: ఆమె నుండి పుట్టుకొస్తారు
  rationale: అక్షరార్థం ‘ఆమె నుండి ఉంటారు’; ఇక్కడ వంశోత్పత్తిని సూచిస్తున్నందున ‘పుట్టుకొస్తారు’ సహజంగా, స్పష్టంగా ఉంటుంది.
theological_decisions:
- issue: శారా నుండి జనాలు, రాజవంశాలు ఉద్భవిస్తాయనే వాగ్దానం
  choice: ఆమె జనాలకు మూలమవుతుంది; ప్రజల రాజులు ఆమె నుండి పుట్టుకొస్తారు
  alternative: ఆమె జనాలకు తల్లి అవుతుంది; ప్రజల రాజులు ఆమె నుండి వస్తారు
  rationale: ‘తల్లి’ అనే భావం సందర్భంలో అంతర్లీనంగా ఉన్నా హీబ్రూలో స్పష్టంగా లేదు. అందుచేత దానిని ప్రధాన వాక్యంలో చేర్చకుండా, అనేక జనాలు మరియు రాజవంశాలు శారా నుండి ఉద్భవిస్తాయనే నిబంధన వాగ్దానాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన శైలిని వాడాం. ‘ఆశీర్వదిస్తాను’ అనే పునరుక్తిని మూలంలోని నొక్కిచెప్పే ప్రభావం కోసం నిలిపాం.
