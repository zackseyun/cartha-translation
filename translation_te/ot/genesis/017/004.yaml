id: GEN.17.4
reference: Genesis 17:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אֲנִ֕י הִנֵּ֥ה בְרִיתִ֖/י אִתָּ֑/ךְ וְ/הָיִ֕יתָ לְ/אַ֖ב הֲמ֥וֹן גּוֹיִֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/004.yaml
  text: As for me[a], behold, my covenant is with you[b], and you will become the father of a multitude of nations.
translation:
  language: te
  text: నేనైతే[a]—ఇదిగో, నా నిబంధన నీతో ఉంది; నీవు అనేక జనాంగాలకు తండ్రివి అవుతావు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నేను—ఇదిగో, నా నిబంధన నీతో ఉంది.” హీబ్రూలో ప్రారంభంలోని సర్వనామం, దాని వెంట వచ్చే సూచనాత్మక పదం ఉద్ఘాటనను కలిగిస్తాయి.
    reason: lexical_alternative
  - marker: b
    text: 'మరింత పదశః: “నీవు జనాంగాల సమూహానికి తండ్రివి అవుతావు.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲנִי
  choice: నేనైతే
  rationale: స్వతంత్ర సర్వనామంలోని ఉద్ఘాటనను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: הִנֵּה
  choice: ఇదిగో
  rationale: తరువాతి ప్రకటనపై దృష్టి నిలిపే సూచనాత్మక పదం యొక్క గంభీరతను, ప్రత్యక్షతను నిలుపుతుంది.
- source_word: בְרִיתִי
  choice: నా నిబంధన
  rationale: ఆదికాండంలోని దేవుని ఒడంబడిక భావానికి స్థిరమైన, బరువైన తెలుగు పదప్రయోగం.
- source_word: אִתָּךְ
  choice: నీతో ఉంది
  rationale: హీబ్రూ పాఠంలోని ‘నీతో’ అనే సంబంధాన్ని అనవసరంగా ‘నాకూ నీకూ మధ్య’ అని విస్తరించకుండా తెలుపుతుంది.
- source_word: וְהָיִיתָ
  choice: నీవు ... అవుతావు
  rationale: ఈ వాగ్దాన ప్రకటనలోని భవిష్యత్, ఫలితార్థక భావంతో పాటు స్థితిమార్పును కూడా వ్యక్తం చేస్తుంది.
- source_word: לְאָב
  choice: తండ్రివి
  rationale: అబ్రాముకు ఇవ్వబడుతున్న పాత్రను సహజమైన తెలుగు వాక్యనిర్మాణంలో స్పష్టంగా తెలుపుతుంది.
- source_word: הֲמוֹן
  choice: అనేక
  rationale: మూలపదంలోని విస్తార సంఖ్యాభావాన్ని సాధారణ పాఠకులకు సహజంగా అందిస్తుంది; మరింత పదశః రూపాన్ని పాదటిప్పణిలో నిలిపింది.
- source_word: גּוֹיִם
  choice: జనాంగాలు
  rationale: ఇక్కడ భావం తరువాతి సాంకేతిక అర్థంలోని ‘అన్యజనులు’ కాదు; అబ్రాము నుండి ఉద్భవించే విభిన్న ప్రజాసమూహాలు.
theological_decisions:
- issue: నిబంధన ప్రకటన మరియు అబ్రాము పాత్ర
  choice: ‘నా నిబంధన నీతో ఉంది; నీవు అనేక జనాంగాలకు తండ్రివి అవుతావు’ అని సూటిగా అనువదించడం
  alternative: ‘నేను నీతో నా నిబంధన చేస్తున్నాను’ లేదా ‘నీవు అనేక జనాంగాలకు పూర్వికుడవుతావు’ అని వివరణాత్మకంగా విస్తరించడం
  rationale: మూలపాఠం నిబంధన సంబంధాన్ని, వాగ్దాన ఫలితాన్ని నేరుగా ప్రకటిస్తుంది. ‘తండ్రి’ అనే రూపకాన్ని లేదా వాక్యంలోని అస్తిత్వ నిర్మాణాన్ని తరువాతి వేదాంత వర్గాలతో భర్తీ చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గంభీరంగా రూపొందించబడింది. ‘నేనైతే—ఇదిగో’ అనే నిర్మాణం దైవిక ప్రకటనలోని ఉద్ఘాటనను నిలుపుతుంది; ‘జనాంగాలు’ అనే పదం ‘దేశాలు’ అనే భౌగోళిక భావానికీ, ‘అన్యజనులు’ అనే తరువాతి సాంకేతిక భావానికీ పరిమితం కాకుండా మూలంలోని גּוֹיִם భావాన్ని అందిస్తుంది.
