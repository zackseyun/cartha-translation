  yaml_path: translation/ot/genesis/017/021.yaml
  text: But I will establish my covenant with Isaac[a], whom Sarah will bear to you at this time next year.
translation:
  language: te
  text: అయితే, నా నిబంధనను ఇస్సాకుతో స్థిరపరుస్తాను[a]; వచ్చే సంవత్సరం ఇదే నియమిత సమయంలో శారా అతన్ని నీకు కంటుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మరియు నా నిబంధనను ఇస్సాకుతో స్థిరపరుస్తాను.” హీబ్రూలోని సంయోజక పదాన్ని సాధారణంగా “మరియు” అని కూడా అనువదించవచ్చు; అయితే, ముందటి వచనంలో ఇష్మాయేలు గురించి ఇచ్చిన వాగ్దానంతో ఇక్కడ వ్యత్యాసం ఉన్నట్లు సందర్భం సూచిస్తోంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶת
  choice: అయితే
  rationale: וְ సాధారణంగా ‘మరియు’ అని అర్థమిచ్చినా, ముందటి వచనంలో ఇష్మాయేలు గురించి ఇచ్చిన వాగ్దానానికి దీనిని వ్యత్యాసంగా సందర్భం చూపుతోంది.
- source_word: בְּרִיתִי
  choice: నా నిబంధనను
  rationale: ఆదికాండంలోని దేవుని ఒడంబడిక సందర్భంలో בְּרִיתִי కి సహజమైన, స్థిరమైన తెలుగు సమానార్థకం.
- source_word: אָקִים
  choice: స్థిరపరుస్తాను
  rationale: קום హిఫిల్ రూపం ఇక్కడ నిబంధనను దృఢంగా నెలకొల్పడం లేదా అమలులో ఉంచడం అనే భావాన్ని ఇస్తుంది.
- source_word: אֶת יִצְחָק
  choice: ఇస్సాకుతో
  rationale: హీబ్రూలో ప్రత్యక్ష కర్మ సూచిక ఉన్నప్పటికీ, నిబంధనకు సంబంధించిన పక్షాన్ని తెలుగులో ‘తో’ విభక్తితో చెప్పడం సహజం.
- source_word: אֲשֶׁר תֵּלֵד לְךָ שָׂרָה
  choice: శారా అతణ్ణి నీకు కంటుంది
  rationale: సంబంధవాచక ఉపవాక్య భావాన్నీ לְךָ అనే ‘నీకు’ భావాన్నీ సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: לַמּוֹעֵד הַזֶּה
  choice: ఇదే నియమిత సమయంలో
  rationale: מוֹעֵד అనేది నిర్ణయించబడిన లేదా నియమించబడిన సమయాన్ని సూచిస్తుంది; ‘నియమిత సమయం’ ఆ ప్రత్యేకతను కాపాడుతుంది.
- source_word: בַּשָּׁנָה הָאַחֶרֶת
  choice: వచ్చే సంవత్సరం
  rationale: అక్షరార్థంగా ‘తరువాతి సంవత్సరంలో’; ఆధునిక తెలుగులో ‘వచ్చే సంవత్సరం’ సహజంగా ఉంటుంది.
theological_decisions:
- issue: ఇష్మాయేలుతో పోలిస్తే ఇస్సాకు ద్వారా నిబంధన కొనసాగడం
  choice: దేవుడు తన నిబంధనను ఇస్సాకుతో స్థిరపరుస్తానని వచనం చెబుతున్నట్లుగానే అనువదించబడింది.
  alternative: ముందటి వచనంతో వ్యత్యాసాన్ని చూపకుండా ‘మరియు’తో ప్రారంభించడం.
  rationale: ఇస్సాకే ఈ వచనంలో నిబంధన పక్షమని స్పష్టంగా ఉంచుతూ, తరువాతి సిద్ధాంతపరమైన నిర్ణయాలను వచనంలోకి చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే వాక్య నిర్మాణం. ‘నిబంధన’, ‘స్థిరపరుస్తాను’, ‘నియమిత సమయం’ అనే పదాలు మూలంలోని ఒడంబడిక మరియు నిర్ణీత కాల భావాలను కాపాడుతాయి.
