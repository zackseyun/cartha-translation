  yaml_path: translation/ot/genesis/017/024.yaml
  text: And Abraham was ninety-nine years old when the flesh of his foreskin was circumcised.
translation:
  language: te
  text: అబ్రాహాము తన అగ్రచర్మపు మాంసానికి సున్నతి చేయబడినప్పుడు, అతనికి తొంభై తొమ్మిది సంవత్సరాలు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אַבְרָהָם
  choice: అబ్రాహాము
  rationale: ו కథన కొనసాగింపును సూచిస్తుంది; అయితే ఈ ఒక్క వచనంలో సహజమైన తెలుగు వాక్యారంభానికి ప్రత్యేకంగా ‘మరియు’ చేర్చడం అవసరం లేదు.
- source_word: בֶּן תִּשְׁעִים וָתֵשַׁע שָׁנָה
  choice: అతనికి తొంభై తొమ్మిది సంవత్సరాలు
  rationale: ‘తొంభై తొమ్మిది సంవత్సరాల కుమారుడు’ అనే హీబ్రూ వయస్సు నుడికారాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בְּ/הִמֹּלוֹ
  choice: సున్నతి చేయించుకున్నప్పుడు
  rationale: בְּ + క్రియానామ రూపం కాలసంబంధ పరిస్థితిని సూచిస్తుంది. సందర్భంలో అబ్రాహాము ఆ ఆచారాన్ని స్వీకరించాడనే భావాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: בְּשַׂר
  choice: మాంసానికి
  rationale: శరీర భాగాన్ని స్పష్టంగా సూచించే హీబ్రూ పదంలోని మూర్తమైన భావాన్ని నిలుపుతుంది.
- source_word: עָרְלָתוֹ
  choice: తన సున్నతి చర్మపు
  rationale: బְּשַׂר עָרְלָתוֹ అనే నిర్మాణాన్ని ‘తన సున్నతి చర్మపు మాంసం’గా సమీపంగా, స్పష్టంగా అందిస్తుంది.
