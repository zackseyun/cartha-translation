translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. మూలంలోని శరీరసంబంధ స్పష్టతను మృదువుగా మార్చకుండా నిలుపుతూ, తెలుగు వాక్యనిర్మాణాన్ని సహజంగా ఉంచింది.
