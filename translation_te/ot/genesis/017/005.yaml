source:
  edition: WLC
  text: וְ/לֹא יִקָּרֵ֥א ע֛וֹד אֶת שִׁמְ/ךָ֖ אַבְרָ֑ם וְ/הָיָ֤ה שִׁמְ/ךָ֙ אַבְרָהָ֔ם כִּ֛י אַב הֲמ֥וֹן גּוֹיִ֖ם נְתַתִּֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/005.yaml
  text: Your name shall no longer be called Abram[a], but your name shall be Abraham, for I have made you the father of a multitude of nations.
translation:
  language: te
  text: ఇకమీదట నీ పేరు అబ్రాము అని పిలువబడదు; నీ పేరు అబ్రాహాము అవుతుంది. ఎందుకంటే నేను నిన్ను అనేక జనాంగాలకు తండ్రిగా చేశాను[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, ‘నేను నిన్ను అనేక జనాంగాల తండ్రిగా ఇచ్చాను.’
    reason: lexical_alternative
lexical_decisions:
- source_word: יִקָּרֵא
  choice: పిలువబడదు
  rationale: קרא నిఫల్ రూపం ఇక్కడ పేరు పెట్టడాన్ని సూచించే కర్మణి ప్రయోగం. తెలుగు పేరు మార్పు సందర్భంలో ‘పిలువబడదు’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: עוֹד
  choice: ఇకమీదట
  rationale: לֹאతో కలిసి, ఇప్పటి నుంచి పాత పేరు కొనసాగదనే కాలార్థాన్ని తెలియజేస్తుంది.
- source_word: שִׁמְךָ
  choice: నీ పేరు
  rationale: రెండవ పురుష ఏకవచన ప్రత్యయంతో ఉన్న పదానికి నేరమైన, సహజమైన అనువాదం.
- source_word: אַבְרָם
  choice: అబ్రాము
  rationale: వ్యక్తి పేరును తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: וְהָיָה
  choice: నీ పేరు ... అవుతుంది
  rationale: అక్షరార్థంగా ‘మరియు ఉంటుంది’; పేరు మార్పు ప్రకటనలో కొత్త పేరు ఇక అమలులోకి వస్తుందనే భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אַבְרָהָם
  choice: అబ్రాహాము
  rationale: వ్యక్తి పేరును తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: కొత్త పేరు ఇవ్వడానికి కారణాన్ని పరిచయం చేసే వివరణాత్మక సంబంధాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: אַב
  choice: తండ్రి
  rationale: సాధారణ అర్థమైన ‘తండ్రి’ పేరు వివరణకూ నిబంధన సందర్భానికీ సరిపోతుంది; ‘పూర్వికుడు’ అని విస్తరించలేదు.
- source_word: הֲמוֹן
  choice: అనేక
  rationale: విస్తారమైన సంఖ్య లేదా సమూహం అనే భావాన్ని సహజ తెలుగులో తెలియజేస్తుంది; గంభీరతను కాపాడుతూ అసహజమైన పదబంధాన్ని నివారిస్తుంది.
- source_word: גּוֹיִם
  choice: జనాంగాలు
  rationale: ఆదికాండపు సందర్భంలో వివిధ ప్రజా సమూహాలు లేదా దేశజాతులను సూచిస్తుంది. ‘అన్యజనులు’ అనడం ఇక్కడ కాలవిరుద్ధమైన లేదా మతపరంగా పరిమితమైన భావాన్ని కలిగించవచ్చు.
- source_word: נְתַתִּיךָ
  choice: నిన్ను ... చేశాను
  rationale: అక్షరార్థంగా ‘నిన్ను ...గా ఇచ్చాను’ అయినా, ఈ విధేయ నిర్మాణంలో తెలుగు భాషలో ‘చేశాను’ సహజం. హీబ్రూ సంపూర్ణ క్రియారూపంలోని నెరవేరిన ప్రకటన భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: దైవిక వాగ్దానాన్ని సంపూర్ణ క్రియారూపంలో వ్యక్తం చేయడం
  choice: నేను నిన్ను ... తండ్రిగా చేశాను
  alternative: నేను నిన్ను ... తండ్రిగా చేస్తాను
  rationale: నְתַתִּיךָ హీబ్రూలో సంపూర్ణ రూపం. కనుక భవిష్యత్తులో జరిగేదిగా సులభీకరించకుండా, దేవుని వాక్యంలో వాగ్దానం ఇప్పటికే స్థిరపరచబడిన కార్యంగా పలకబడుతున్న ఉద్వేగాన్ని కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని వాడాం. అబ్రాము/అబ్రాహాము పేర్ల మధ్య ఉన్న ధ్వన్యాత్మక సంబంధాన్ని లిప్యంతరీకరణ ద్వారా సాధ్యమైనంతవరకు నిలిపాం.
