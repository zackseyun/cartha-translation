  text: וְ/הִפְרֵתִ֤י אֹֽתְ/ךָ֙ בִּ/מְאֹ֣ד מְאֹ֔ד וּ/נְתַתִּ֖י/ךָ לְ/גוֹיִ֑ם וּ/מְלָכִ֖ים מִמְּ/ךָ֥ יֵצֵֽאוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/006.yaml
  text: And I will make you exceedingly fruitful[a], and I will make nations from you[b], and kings will come from you.
translation:
  language: te
  text: నేను నిన్ను ఎంతో ఎంతో ఫలవంతునిగా చేస్తాను[a], నీ నుండి జాతులు ఉద్భవించేలా చేస్తాను; నీ నుండి రాజులు వస్తారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, ‘చాలా, చాలా ఎక్కువగా.’
    reason: lexical_alternative
  - marker: b
    text: మరింత అక్షరార్థంగా, ‘నీ నుండి బయటికి వస్తారు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִפְרֵתִי
  choice: ఫలింపజేస్తాను
  rationale: פרה అనే ధాతువు హిఫీల్ రూపంలో ‘ఫలించేలా చేయడం’ అనే కారణార్థాన్ని ఇస్తుంది. ‘ఫలింపజేస్తాను’ ఆ కారణార్థాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: בִּמְאֹד מְאֹד
  choice: అత్యంత సమృద్ధిగా
  rationale: מְאֹד పదం రెండుసార్లు రావడం వాగ్దాన తీవ్రతను బలపరుస్తుంది. తెలుగు వాక్యప్రవాహంలో సహజంగా ఉండేలా ఈ బలాన్ని ‘అత్యంత సమృద్ధిగా’ తెలియజేస్తుంది.
- source_word: וּנְתַתִּיךָ לְגוֹיִם
  choice: నీ నుంచి జనాలు ఉద్భవించేలా చేస్తాను
  rationale: 'נתן + ל నిర్మాణం ఇక్కడ ఫలితాన్ని సూచిస్తుంది: అబ్రాహాము నుంచి అనేక జనాలు ఏర్పడతాయి. ఈ అనువాదం వంశసంబంధ భావాన్ని స్పష్టంగా చెబుతూ, ‘నిన్ను జనాలుగా చేస్తాను’ అనే అసహజ తెలుగు నిర్మాణాన్ని నివారిస్తుంది.'
- source_word: לְגוֹיִם
  choice: జనాలు
  rationale: גּוֹיִם ఇక్కడ అబ్రాహాము నుంచి ఉద్భవించే ప్రజాసమూహాలు లేదా జనాలను సూచిస్తుంది; ప్రత్యేకంగా ‘అన్యజనులు’ అనే తరువాతి మతపరమైన భావాన్ని సూచించదు.
- source_word: וּמְלָכִים
  choice: రాజులు
  rationale: מְלָכִים కు నేరమైన, నిర్దిష్టమైన అర్థం ‘రాజులు’; ‘పాలకులు’ అనడం మూలపదం కంటే విస్తృతంగా ఉంటుంది.
- source_word: מִמְּךָ יֵצֵאוּ
  choice: నీ నుంచి ... పుట్టుకొస్తారు
  rationale: יצא అక్షరార్థంగా ‘బయటికి రావడం’ అయినా, వంశోత్పత్తి సందర్భంలో ‘పుట్టుకొస్తారు’ సహజమైన తెలుగులో మూలం లేదా సంతతిని స్పష్టంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: అబ్రాహాముకు వాగ్దానం చేయబడిన సంతతి పరిధి
  choice: అబ్రాహాము నుంచి అనేక జనాలు, రాజులు ఉద్భవిస్తారని వచనం వాగ్దానం చేస్తుంది.
  alternative: ఈ మాటను జనాల మధ్య అబ్రాహాముకు ఒక ప్రత్యేక స్థానం కల్పించడంగా మరింత భావాత్మకంగా చదవవచ్చు.
  rationale: తక్షణ నిబంధన సందర్భం సంతానం, వంశపరంపరలను ప్రధానంగా ఉంచుతుంది. అందువల్ల వంశోత్పత్తిని సూచించే అనువాదం హెబ్రీ వాక్యనిర్మాణానికి, సందర్భానికి సరిపోతుంది; అదే సమయంలో తరువాతి ప్రత్యేక సిద్ధాంత వ్యవస్థలను ఇందులో చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి వాడబడింది. ‘ఫలింపజేస్తాను’ అనే బైబిలు సంబంధ పదం కారణార్థాన్ని కాపాడుతుంది; చుట్టుపక్కల పదబంధాలు ఆధునిక సహజ వాక్యనిర్మాణంలో ఉన్నాయి. ప్రతి పాదటిప్పణి సూచిక ప్రధాన పాఠ్యంలో ఉంచబడింది.
