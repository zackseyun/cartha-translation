  text: וְ/עָרֵ֣ל זָכָ֗ר אֲשֶׁ֤ר לֹֽא יִמּוֹל֙ אֶת בְּשַׂ֣ר עָרְלָת֔/וֹ וְ/נִכְרְתָ֛ה הַ/נֶּ֥פֶשׁ הַ/הִ֖וא מֵ/עַמֶּ֑י/הָ אֶת בְּרִיתִ֖/י הֵפַֽר׀־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/014.yaml
  text: And an uncircumcised male who is not circumcised in the flesh of his foreskin—that person shall be cut off from his people[b][a]; he has broken my covenant.
translation:
  language: te
  text: సున్నతి పొందని ఏ పురుషుడైనా—అంటే, ఎవరి ముందోలు మాంసం సున్నతి చేయబడలేదో—తన ప్రజల్లోనుండి కొట్టివేయబడాలి[a][b]. అతడు నా నిబంధనను ఉల్లంఘించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “ఆ వ్యక్తి తన ప్రజల్లోనుండి కొట్టివేయబడాలి.” హీబ్రూలో נֶפֶשׁ (నెఫెష్) అనే పదం ఉంది; దానికి ‘ప్రాణము’ అనే అర్థమూ ఉండవచ్చు, కానీ ఇక్కడ అది శిక్షకు లోబడే వ్యక్తిని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: “కొట్టివేయబడాలి” అనేది తీవ్రమైన నిబంధనాత్మక తీర్పును సూచించే హీబ్రూ నుడికారం. సందర్భానుసారం అది సమాజం నుండి తొలగింపును లేదా మరణాన్ని సూచించవచ్చు; ఈ వచనం దానిని మరింత నిర్దిష్టంగా చెప్పదు.
    reason: alternative_reading
lexical_decisions:
- source_word: וְעָרֵל זָכָר
  choice: సున్నతి పొందని పురుషుడు
  rationale: עָרֵל זָכָר అనేది సున్నతి పొందని మగ వ్యక్తిని సూచిస్తుంది. ఈ అనువాదం నిబంధనకు సంబంధించిన గుర్తును స్పష్టంగా, సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: אֲשֶׁר לֹא יִמּוֹל
  choice: సున్నతి పొందనివాడు
  rationale: מול ధాతువు నిఫ్అల్ రూపం ఇక్కడ కర్మణి భావాన్ని ఇస్తుంది. అందువల్ల ‘సున్నతి పొందనివాడు’ మూలంలోని సాధారణ న్యాయపరమైన షరతును సహజంగా తెలియజేస్తుంది.
- source_word: אֶת בְּשַׂר עָרְלָתוֹ
  choice: తన ముందోలు మాంసంలో
  rationale: మూలంలోని శరీర నిర్మాణానికి సంబంధించిన నిర్దిష్టతను తొలగించకుండా ఉంచుతుంది. ‘ముందోలు’ అనేది foreskin కు స్పష్టమైన, ప్రామాణిక తెలుగు పదం.
- source_word: וְנִכְרְתָה הַנֶּפֶשׁ הַהִוא
  choice: తన ప్రజల్లోనుండి కొట్టివేయబడాలి
  rationale: נפש ఇక్కడ అమూర్తమైన ‘ఆత్మ’ కంటే శిక్షకు లోబడే వ్యక్తిని సూచిస్తుంది; తెలుగులో ముందున్న ‘పురుషుడు’నే కర్తగా కొనసాగించడం సహజం. ‘కొట్టివేయబడాలి’ అనే ప్రయోగం כרת యొక్క నిబంధనాత్మక శిక్షార్థక నుడికారాన్ని, దాని ఖచ్చిత పరిధిని నిర్ణయించకుండా, నిలుపుతుంది.
- source_word: מֵעַמֶּיהָ
  choice: తన ప్రజల్లోనుండి
  rationale: స్త్రీలింగ ప్రత్యయం נפש తో వ్యాకరణపరంగా ఏకీభవించినా, సూచించబడేది ఆ పురుషుడే. ‘తన ప్రజలు’ עם అనే నిబంధన సమాజార్థాన్ని నిలుపుతుంది.
- source_word: אֶת בְּרִיתִי
  choice: నా నిబంధనను
  rationale: ברית కు ‘నిబంధన’ తెలుగు బైబిల్ వాడుకలో స్థిరమైనది, గంభీరమైనది; ఆదికాండము 17లోని భావసంబంధాన్ని కాపాడుతుంది.
- source_word: הֵפַר
  choice: ఉల్లంఘించాడు
  rationale: הפר ఒక నిబంధనను భంగపరచడం లేదా ఉల్లంఘించడం అనే అర్థం ఇస్తుంది. ‘ఉల్లంఘించాడు’ న్యాయపరమైన సందర్భంలో సహజంగా ఉండి, నిబంధననే రద్దు చేశాడనే అనవసర భావాన్ని తగ్గిస్తుంది.
theological_decisions:
- issue: כרת (‘కొట్టివేయబడటం’) అనే నిబంధనాత్మక శిక్ష యొక్క పరిధి
  choice: ‘తన ప్రజల్లోనుండి కొట్టివేయబడాలి’ అనే నుడికారాన్ని నిలుపుట
  alternative: సమాజం నుండి బహిష్కరించబడాలి; మరణశిక్ష పొందాలి
  rationale: ఈ వచనం శిక్షను తీవ్రమైన నిబంధన తీర్పుగా చెబుతుంది గాని, అది బహిష్కరణనా, మరణమా, లేక దేవుని తీర్పులోని మరొక రూపమా అని నిర్దిష్టంగా చెప్పదు. కాబట్టి మూలంలోని ఉద్వేగాన్ని పరిష్కరించకుండా ఉంచాం.
- issue: נפש యొక్క అనువాదం
  choice: ప్రధాన వాక్యంలో ముందున్న వ్యక్తినే కర్తగా కొనసాగించి, పాదటిప్పణిలో ‘ఆ ప్రాణి/వ్యక్తి’ అనే అక్షరార్థాన్ని చూపుట
  alternative: ఆ ఆత్మ
  rationale: ఇక్కడ נפש శిక్షకు లోబడే మొత్తం వ్యక్తిని సూచిస్తుంది; ‘ఆత్మ’ అని అనువదిస్తే మూలంలో తప్పనిసరిగా లేని శరీర–ఆత్మ విభజన భావం రావచ్చు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన న్యాయ–నిబంధన శైలిని ఉపయోగించాం. ‘ముందోలు’ ద్వారా మూలంలోని శరీర సంబంధ నిర్దిష్టతను నిలిపాం. ‘కొట్టివేయబడాలి’ అనే నుడికారాన్ని వివరణాత్మకంగా మార్చకుండా ఉంచి, దాని అర్థపరిధిని పాదటిప్పణిలో తెలిపాం. ప్రధాన పాఠ్యంలో ప్రతి పాదటిప్పణి సూచిక [a], [b] చేర్చబడింది.
