  source_fidelity: 'ప్రధాన భావం హీబ్రూ మూలానికి నమ్మకంగానే ఉంది: సున్నతి లేని పురుషుడు, అతని ప్రజల నుండి ‘కొట్టివేయబడటం,’ మరియు దేవుని నిబంధనను ఉల్లంఘించడం అన్న మూడు అంశాలూ నిలిచాయి. అయితే ‘తన ముందోలు మాంసంలో సున్నతి పొందనివాడు’ అనే ప్రయోగంలో ‘లో’ విభక్తి శస్త్రక్రియకు గురయ్యే నిర్దిష్ట శరీరభాగాన్ని సరిగా వ్యక్తం చేయదు. దాన్ని కర్మణి భావంతో సవరించాలి.'
  naturalness: ‘కొట్టివేయబడాలి,’ ‘నా నిబంధనను ఉల్లంఘించాడు’ అనేవి ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన న్యాయ–నిబంధన శైలికి తగినవి. శరీరభాగాన్ని సూచించే ఉపవాక్యాన్ని ‘ఎవరి ముందోలు మాంసం సున్నతి చేయబడలేదో’గా మార్చడం మరింత సహజం మరియు స్పష్టం.
