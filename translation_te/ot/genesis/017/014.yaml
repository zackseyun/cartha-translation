  to: సున్నతి పొందని ఏ పురుషుడైనా—అంటే, ఎవరి ముందోలు మాంసం సున్నతి చేయబడలేదో—తన ప్రజల్లోనుండి కొట్టివేయబడాలి[a][b]. అతడు నా నిబంధనను ఉల్లంఘించాడు.
  rationale: సవరణ శరీరభాగానికి సంబంధించిన పదబంధాన్ని స్పష్టం చేసి, హీబ్రూ నిఫ్అల్ రూపంలోని కర్మణి భావాన్ని సహజ తెలుగు ద్వారా వ్యక్తం చేస్తుంది. ‘కొట్టివేయబడాలి’ అనే నిర్దిష్టంకాని నిబంధనాత్మక శిక్షను అలాగే ఉంచాం; దాని పరిధిని మరణమో బహిష్కరణో అని నిర్ణయించలేదు. పాదటిప్పణి aలో మానవ వ్యక్తిని సూచించడంలో అపార్థం కలిగించే ‘ప్రాణి’ని తొలగించాం. పాదటిప్పణి సూచికలు [a][b] ప్రధాన పాఠ్యంలో సరిగ్గా నిలిచాయి.
