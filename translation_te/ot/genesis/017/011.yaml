id: GEN.17.11
reference: Genesis 17:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/נְמַלְתֶּ֕ם אֵ֖ת בְּשַׂ֣ר עָרְלַתְ/כֶ֑ם וְ/הָיָה֙ לְ/א֣וֹת בְּרִ֔ית בֵּינִ֖/י וּ/בֵינֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/011.yaml
  text: You shall circumcise the flesh of your foreskin[a], and it shall be a sign of the covenant between me and you.
translation:
  language: te
  text: మీ ముందుచర్మాన్ని సున్నతి చేయాలి. అది నాకూ మీకూ మధ్య ఉన్న నిబంధనకు గుర్తుగా ఉంటుంది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּנְמַלְתֶּם
  choice: సున్నతి చేయాలి
  rationale: సంధితో కూడిన ఖల్ సంపూర్ణ క్రియ ఇక్కడ నిబంధన సంబంధమైన ఆదేశ భావాన్ని వ్యక్తం చేస్తుంది. క్రియాశీల రూపాన్ని, ఆదేశ బలాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: בְּשַׂר עָרְלַתְכֶם
  choice: మీ ముందుచర్మాన్ని
  rationale: ఈ శరీర నిర్మాణ సందర్భంలో עָרְלָה అంటే ముందుచర్మం. בָּשָׂר అనే ‘మాంసం’ భావం హీబ్రూ సమాసంలో శరీర భాగాన్ని నిర్దిష్టం చేస్తుంది; తెలుగులో ‘ముందుచర్మపు మాంసం’ అనడం అసహజం కాబట్టి అర్థనష్టం లేకుండా ‘ముందుచర్మం’ అని ఇచ్చాం.
- source_word: וְהָיָה
  choice: అది ... ఉంటుంది
  rationale: ముందు ఆదేశించిన సున్నతినే ‘అది’ సూచిస్తుంది. భవిష్యత్/నిర్దేశక భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: לְאוֹת
  choice: గుర్తుగా
  rationale: אוֹת కు ‘గుర్తు, సూచన’ అనే అర్థాలు ఉన్నాయి. నిబంధన సందర్భంలో ‘గుర్తు’ స్పష్టమైన, మతశాఖాపరమైన అదనపు భావాలు లేని తెలుగు పదం.
- source_word: בְּרִית
  choice: నిబంధన
  rationale: దేవుడు అబ్రాహాముతో స్థాపిస్తున్న నిర్దిష్ట covenant‌ను సూచించే స్థిరమైన, గౌరవప్రదమైన తెలుగు సమానం.
- source_word: בֵּינִי וּבֵינֵיכֶם
  choice: నాకూ మీకూ మధ్య
  rationale: మొదటి వ్యక్తి ఏకవచనాన్నీ, రెండవ వ్యక్తి బహువచనాన్నీ నేరుగా నిలుపుతుంది; సంతానం వంటి సందర్భార్థాన్ని ఈ వాక్యంలోకి అదనంగా చేర్చదు.
theological_decisions:
- issue: సున్నతి నిబంధన గుర్తుగా ఉండే స్వభావం
  choice: నిబంధనకు గుర్తుగా
  alternative: నిబంధనకు సూచనగా
  rationale: హీబ్రూ אוֹת בְּרִית సున్నతిని నిబంధన గుర్తుగా పేర్కొంటుంది. అది కేవలం ప్రతీక మాత్రమేనా లేక మరేదైనా ప్రభావం కలిగిస్తుందా అనే సిద్ధాంత నిర్ణయాన్ని అనువాదం చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడబడింది. శరీర నిర్మాణ పదమైన ‘ముందుచర్మం’ స్పష్టతను కాపాడుతుంది; హీబ్రూ పదబంధాన్ని అక్షరానువాదం చేసి అసహజంగా వినిపించే ‘ముందుచర్మపు మాంసం’ను నివారించాం. ఆంగ్ల సంప్రదింపు పాఠంలోని [a] గమనిక దాని స్థానంతో సరిపోలకపోవడం వల్ల, మూల హీబ్రూలో అవసరమైన పాఠాంతర లేదా అర్థసందిగ్ధత లేకపోవడంతో ఇక్కడ గమనిక చేర్చలేదు.
