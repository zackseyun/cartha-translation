id: GEN.17.10
reference: Genesis 17:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: זֹ֣את בְּרִיתִ֞/י אֲשֶׁ֣ר תִּשְׁמְר֗וּ בֵּינִ/י֙ וּ/בֵ֣ינֵי/כֶ֔ם וּ/בֵ֥ין זַרְעֲ/ךָ֖ אַחֲרֶ֑י/ךָ הִמּ֥וֹל לָ/כֶ֖ם כָּל זָכָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/010.yaml
  text: 'This is my covenant[a], which you shall keep, between me and you and your offspring after you: every male among you shall be circumcised.'
translation:
  language: te
  text: 'నాకూ మీకూ, నీ తరువాత నీ సంతానానికీ[a] మధ్య ఉన్న, మీరు పాటించవలసిన నా నిబంధన ఇదే: మీలోని ప్రతి పురుషుడూ సున్నతి పొందాలి.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నీ తరువాత నీ వంశస్థులకూ.” హెబ్రీ పదమైన זֶרַע సమూహార్థక పదం; అది సంతానాన్ని లేదా వంశస్థులను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת
  choice: ఇదే
  rationale: స్త్రీలింగ ఏకవచన సూచనార్థక పదం నిబంధనను పరిచయం చేస్తుంది; హెబ్రీలో అంతర్లీనంగా ఉన్న సంధాన క్రియ భావాన్ని తెలుగులో ‘ఇదే’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בְּרִיתִי
  choice: నా నిబంధన
  rationale: ఆదికాండమంతటా దేవుడు ఏర్పరచిన బంధాన్ని సూచించే ప్రామాణిక పదంగా ‘నిబంధన’ స్థిరమైన, గంభీరమైన సమానార్థక పదం.
- source_word: אֲשֶׁר תִּשְׁמְרוּ
  choice: మీరు పాటించవలసిన
  rationale: సంబంధవాచక ఉపవాక్యంలోని అసంపూర్ణ క్రియ నిబంధనకు సంబంధించిన బాధ్యతను తెలియజేస్తుంది; ‘పాటించవలసిన’ ఆ విధిబాధ్యతను సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: בֵּינִי וּבֵינֵיכֶם וּבֵין זַרְעֲךָ אַחֲרֶיךָ
  choice: నాకూ మీకూ, నీ తరువాత నీ సంతానానికీ మధ్య
  rationale: మూలంలో ‘మీకు’ బహువచనమూ, అబ్రాహామును ఉద్దేశించిన ‘నీ’ ఏకవచనమూ ఉన్నాయి; తెలుగు సర్వనామ భేదంతో రెండింటినీ నిలిపాం. זֶרַע యొక్క సమూహార్థాన్ని ‘సంతానం’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: הִמּוֹל
  choice: సున్నతి పొందాలి
  rationale: ఇక్కడ క్రియారూపం నిబంధనలోని ఆవశ్యకతను, ప్రతి పురుషుడు సున్నతి చేయబడటాన్ని సూచిస్తుంది; ‘పొందాలి’ కర్తరి ఆజ్ఞగా మార్చకుండా ఆ భావాన్ని నిలుపుతుంది.
- source_word: לָכֶם
  choice: మీలోని
  rationale: అక్షరార్థంగా ‘మీ కొరకు’ అయినా, సందర్భంలో ఈ నియమం వర్తించే సమూహాన్ని సూచిస్తుంది; ‘మీలోని’ తెలుగులో ఆ పంపిణీ భావాన్ని స్పష్టం చేస్తుంది.
- source_word: כָּל זָכָר
  choice: ప్రతి పురుషుడూ
  rationale: హెబ్రీ పదబంధం నిబంధన సమాజంలోని పురుష లింగానికి చెందిన ప్రతి వ్యక్తిని స్పష్టంగా సూచిస్తుంది; లింగ నిర్దిష్టతను సాధారణీకరించకుండా నిలిపాం.
theological_decisions:
- issue: సున్నతి ఆజ్ఞలో లింగ నిర్దిష్టత
  choice: మీలోని ప్రతి పురుషుడూ సున్నతి పొందాలి
  alternative: మీరందరూ సున్నతి పొందాలి
  rationale: మూలంలోని כָּל זָכָר స్పష్టంగా ‘ప్రతి పురుషుడు’ అని పేర్కొంటుంది. అందువల్ల వాక్య పరిధిని అందరికీ విస్తరించకుండా మూలంలోని పురుష-నిర్దిష్ట ఆజ్ఞను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజతతో పాటు నిబంధనాత్మక గాంభీర్యాన్ని నిలిపాం. మూలంలోని బహువచన ‘మీరు/మీకు’ మరియు అబ్రాహామును ఉద్దేశించిన ఏకవచన ‘నీ’ మధ్య భేదాన్ని ఉద్దేశపూర్వకంగా కాపాడాం.
