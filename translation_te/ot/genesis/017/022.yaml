  text: When he finished speaking with him[a], God went up from Abraham.
translation:
  language: te
  text: ఆయన అబ్రాహాముతో మాట్లాడడం ముగించినప్పుడు, దేవుడు అబ్రాహాము దగ్గరనుండి పైకి వెళ్లిపోయాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దేవుడు అబ్రాహాము దగ్గరనుండి ఆరోహించాడు.’ హీబ్రూ క్రియకు ‘పైకి వెళ్లాడు/ఆరోహించాడు’ అనే అర్థం ఉంది; దైవ ప్రత్యక్షత ముగింపును స్థలసంబంధ చిత్రణతో వర్ణిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְכַל לְדַבֵּר
  choice: మాట్లాడడం ముగించినప్పుడు
  rationale: כלה + דבר నిర్మాణం ‘మాట్లాడడం ముగించు’ అనే భావాన్ని ఇస్తుంది; వయ్యిక్తోల్ క్రమాన్ని తెలుగులో సహజమైన కాలసంబంధ ఉపవాక్యంగా వ్యక్తపరచాం.
- source_word: אִתּוֹ
  choice: అబ్రాహాముతో
  rationale: את ప్రాతిపదిక పరస్పర సంభాషణను సూచిస్తుంది. సర్వనామ సూచితుడు అబ్రాహాము అని సందర్భం స్పష్టం చేస్తున్నందున తెలుగులో పేరును పునరుక్తి చేయడం అయోమయాన్ని నివారిస్తుంది.
- source_word: וַיַּעַל
  choice: పైకి వెళ్లిపోయాడు
  rationale: עלה లోని పైకి కదిలే దృశ్యభావాన్ని నిలుపుతూ, దైవ ప్రత్యక్షత ముగిసిన సందర్భాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: אֱלֹהִים
  choice: దేవుడు
  rationale: రూపపరంగా బహువచనాకృతి ఉన్నా, ఏకవచన క్రియ మరియు సందర్భం వల్ల ఇక్కడ ఏకవచన ‘దేవుడు’ సరైనది.
- source_word: מֵעַל אַבְרָהָם
  choice: అబ్రాహాము దగ్గరనుండి
  rationale: מֵעַל అక్షరార్థంగా ‘మీదనుండి/పై నుండీ’ అయినా, ఇక్కడ అబ్రాహాము సమక్షం నుండి దైవ ప్రత్యక్షత తొలగిపోవడాన్ని తెలుగులో సహజంగా ‘దగ్గరనుండి’ అని వ్యక్తపరుస్తుంది; పైకి వెళ్లే భావం క్రియలో నిలిచింది.
- source_word: אַבְרָהָם
  choice: అబ్రాహాము
  rationale: తెలుగు బైబిలు సంప్రదాయంలో స్థిరపడిన వ్యక్తినామ రూపం.
theological_decisions:
- issue: దేవుని నిష్క్రమణను స్థలసంబంధ భాషలో వర్ణించడం
  choice: దేవుడు అబ్రాహాము దగ్గరనుండి పైకి వెళ్లిపోయాడు
  alternative: దేవుడు అబ్రాహాము దగ్గరనుండి వెళ్లిపోయాడు
  rationale: మూలంలోని עלה (‘పైకి వెళ్లు/ఆరోహించు’) అనే స్పష్టమైన నిలువు కదలికను తొలగించకుండా, దైవ ప్రత్యక్షత ముగింపును వచనం వర్ణించినట్టే నిలుపుతుంది; దేవుడు స్థలానికి పరిమితుడనే సిద్ధాంత నిర్ణయాన్ని దీనిలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా రూపొందించబడింది. ‘పైకి వెళ్లిపోయాడు’ ద్వారా మూలంలోని స్పష్టమైన ఆరోహణ భావం నిలుపబడింది; ‘ఆరోహణమయ్యాడు’ అనే మరింత సాహిత్యపూర్వక ప్రత్యామ్నాయం పాదటిప్పణిలో ఇచ్చాం.
