id: GEN.17.19
reference: Genesis 17:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֱלֹהִ֗ים אֲבָל֙ שָׂרָ֣ה אִשְׁתְּ/ךָ֗ יֹלֶ֤דֶת לְ/ךָ֙ בֵּ֔ן וְ/קָרָ֥אתָ אֶת שְׁמ֖/וֹ יִצְחָ֑ק וַ/הֲקִמֹתִ֨י אֶת בְּרִיתִ֥/י אִתּ֛/וֹ לִ/בְרִ֥ית עוֹלָ֖ם לְ/זַרְע֥/וֹ אַחֲרָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/019.yaml
  text: And God said[a], “No, but Sarah your wife shall bear you a son, and you shall call his name Isaac. And I will establish my covenant with him as an everlasting covenant for his offspring after him.”
translation:
  language: te
  text: 'దేవుడు ఇలా అన్నాడు: “కాదు; నీ భార్య శారా నీకు ఒక కుమారుణ్ణి కంటుంది. నువ్వు అతనికి ఇస్సాకు[a] అని పేరు పెట్టాలి. నేను అతనితో నా నిబంధనను, అతని తరువాత అతని సంతానానికి శాశ్వత నిబంధనగా స్థిరపరుస్తాను.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ఇస్సాకు’ అనే పేరు, ‘అతడు నవ్వుతాడు’ లేదా ‘అతడు నవ్వుతాడు’ అనే అర్థమివ్వగల హీబ్రూ క్రియారూపంలా వినిపిస్తుంది.
    reason: పేరులోని హీబ్రూ పదప్రయోగం తెలుగులో స్వయంగా కనిపించదు కాబట్టి దాన్ని వివరిస్తుంది.
lexical_decisions:
- source_word: אֲבָל
  choice: కాదు;
  rationale: ముందటి వచనంలో ఇష్మాయేలు గురించి అబ్రాహాము చేసిన మనవికి దేవుడు దిద్దుబాటుతో ఇచ్చిన జవాబును ఇది స్పష్టంగా తెలియజేస్తుంది; కేవలం ‘అయితే’ అని అనడం ఈ సందర్భంలో బలహీనంగా ఉంటుంది.
- source_word: יֹלֶדֶת
  choice: కంటుంది
  rationale: రూపరీత్యా ఇది వర్తమాన కృదంతమైనా, వాగ్దాన సందర్భంలో భవిష్యత్తు సంఘటనను సూచిస్తుంది. ‘కంటుంది’ ఆధునిక తెలుగులో సహజమైన భవిష్యదర్థాన్ని ఇస్తుంది.
- source_word: בֵּן
  choice: ఒక కుమారుణ్ణి
  rationale: వాగ్దానం చేయబడిన బిడ్డను మొదటిసారి పరిచయం చేస్తున్న భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וְקָרָאתָ אֶת שְׁמוֹ
  choice: నువ్వు అతనికి … అని పేరు పెట్టాలి
  rationale: హీబ్రూ నామకరణ సూత్రాన్ని తెలుగులో సహజంగా, స్పష్టంగా అందిస్తుంది.
- source_word: יִצְחָק
  choice: ఇస్సాకు
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపాన్ని అనుసరిస్తుంది; పేరులోని హీబ్రూ పదప్రయోగాన్ని పాదసూచిక వివరిస్తుంది.
- source_word: וַהֲקִמֹתִי
  choice: స్థిరపరుస్తాను
  rationale: నిబంధనను అమలులో నిలిపి ఉంచడం లేదా దృఢపరచడం అనే హీబ్రూ నిబంధనా భావాన్ని ప్రతిబింబిస్తుంది.
- source_word: בְּרִיתִי
  choice: నా నిబంధనను
  rationale: בְּרִית అనే నిబంధనా-సంబంధ పదానికి ఆధునిక ప్రామాణిక తెలుగులో స్థిరమైన, తగిన సమానార్థకం.
- source_word: אִתּוֹ
  choice: అతనితో
  rationale: నిబంధన ఇస్సాకుతో ఏర్పడే సంబంధమని తెలిపే హీబ్రూ పూర్వప్రత్యయ భావాన్ని నేరుగా కాపాడుతుంది.
- source_word: לִבְרִית עוֹלָם
  choice: శాశ్వత నిబంధనగా
  rationale: నిబంధన యొక్క నిరంతర స్వభావాన్ని సహజమైన తెలుగు నిబంధనా భాషలో వ్యక్తం చేస్తుంది.
- source_word: לְזַרְעוֹ אַחֲרָיו
  choice: అతని తరువాత అతని సంతానానికి
  rationale: זֶרַע యొక్క సమూహ ఏకవచన భావాన్ని ‘సంతానం’ కాపాడుతుంది; వంశపరంపర కొనసాగింపును హీబ్రూ వాక్యానికి మించి నిర్వచించదు.
theological_decisions:
- issue: నిబంధనా వాగ్దానం యొక్క పరిధి మరియు కొనసాగింపు
  choice: దేవుడు ఇస్సాకుతో నిబంధనను స్థిరపరచి, అతని తరువాత అతని సంతానానికి అది శాశ్వత నిబంధనగా ఉంటుందని వచనం చెప్పినట్లే అనువదించడం.
  alternative: దీనిని కేవలం జాతి సంబంధ వాగ్దానంగా పరిమితం చేయడం లేదా తరువాతి క్రైస్తవ నిబంధనా సిద్ధాంతాన్ని నేరుగా నిర్వచించే వాక్యంగా విస్తరించడం.
  rationale: హీబ్రూ పాఠం తెలిపే నిబంధనా సంబంధాన్ని, దాని కొనసాగింపును ఉంచుతూ, తరువాతి theological వ్యవస్థలను ఈ వచనంలోకి చేర్చకుండా ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, అయితే వచనానికి తగిన గంభీరతతో ఉంది. ‘నువ్వు’ అనే ఏకవచన సంబోధన హీబ్రూ రెండవ పురుష ఏకవచనాన్ని స్పష్టంగా నిలుపుతుంది.
