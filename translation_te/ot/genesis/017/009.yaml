id: GEN.17.9
reference: Genesis 17:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֱלֹהִים֙ אֶל אַבְרָהָ֔ם וְ/אַתָּ֖ה אֶת בְּרִיתִ֣/י תִשְׁמֹ֑ר אַתָּ֛ה וְ/זַרְעֲ/ךָ֥ אַֽחֲרֶ֖י/ךָ לְ/דֹרֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/009.yaml
  text: And God said to Abraham[a], “As for you, you shall keep my covenant, you and your offspring after you throughout their generations.”
translation:
  language: te
  text: 'దేవుడు అబ్రాహాముతో ఇలా అన్నాడు: “ఇక నీవైతే, నీవు, నీ తర్వాతి సంతానం వారి తరతరాలన్నిటిలో నా నిబంధనను పాటించాలి.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: ఇలా అన్నాడు
  rationale: వావ్-కన్సిక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది. తెలుగులో సహజమైన కథనశైలికి అనుగుణంగా ‘అన్నాడు’ అని అనువదించి, ప్రత్యక్ష వాక్యాన్ని పరిచయం చేయడానికి ‘ఇలా’ చేర్చబడింది.
- source_word: אֱלֹהִים
  choice: దేవుడు
  rationale: నిబంధన విషయంలో అబ్రాహాముతో మాట్లాడుతున్న దేవుణ్ణి సూచించే ప్రామాణిక తెలుగు పదం.
- source_word: אֶל־אַבְרָהָם
  choice: అబ్రాహాముతో
  rationale: హీబ్రూ పాఠంలో పేరు ‘అబ్రాహాము’; మాట్లాడే సందర్భంలో אֶל భావాన్ని తెలుగులో సహజంగా ‘తో’ తెలియజేస్తుంది.
- source_word: וְאַתָּה
  choice: ఇక నీవైతే
  rationale: ముందుంచబడిన సర్వనామంలోని ఉద్ఘాటనను, దేవుని వాగ్దానాలనుంచి అబ్రాహాము బాధ్యతవైపు జరిగే అంశమార్పును స్పష్టంగా తెలియజేస్తుంది.
- source_word: אֶת־בְּרִיתִי
  choice: నా నిబంధనను
  rationale: మొదటి పురుష ఏకవచన ప్రత్యయంతో ఉన్న ‘నిబంధన’ అనే కేంద్రీయ పదాన్ని నేరుగా నిలుపుతుంది.
- source_word: תִשְׁמֹר
  choice: పాటించాలి
  rationale: שׁמר అంటే కాపాడడం, గైకొనడం, పాటించడం. నిబంధన సంబంధమైన బాధ్యతను ఆధునిక తెలుగులో సహజంగా ‘పాటించాలి’ తెలియజేస్తుంది.
- source_word: אַתָּה וְזַרְעֲךָ
  choice: నీవూ, నీ సంతానమూ
  rationale: זֶרַע ఏకవచన సమూహార్థక పదం. ‘సంతానం’ దాని వంశపారంపర్య, సమూహ భావాన్ని సహజంగా నిలుపుతుంది; పునరుక్తమైన אַתָּה ఉద్ఘాటనను ‘నీవూ’ ద్వారా ప్రతిబింబిస్తుంది.
- source_word: אַחֲרֶיךָ
  choice: నీ తర్వాత
  rationale: వంశపరంగా అబ్రాహాము తర్వాత కొనసాగేవారిని సూచించే సరళమైన అనువాదం.
- source_word: לְדֹרֹתָם
  choice: వారి తరతరాలన్నిటిలో
  rationale: వరుస తరాలన్నిటిలో కొనసాగుదల అనే హీబ్రూ నుడికార భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: నిబంధన సంబంధమైన బాధ్యతను అదనపు న్యాయపరమైన లేదా ఆచారపరమైన భావం చేర్చకుండా వ్యక్తం చేయడం
  choice: నా నిబంధనను పాటించాలి
  alternative: నా నిబంధనను గైకొనాలి
  rationale: వాక్యం అబ్రాహాము మరియు అతని సంతానం మీద ఉన్న నిబంధన బాధ్యతను చెబుతుంది. ‘పాటించాలి’ ఆ బాధ్యతను స్పష్టంగా తెలియజేస్తూ, హీబ్రూలో లేని మతశాఖాపరమైన భావాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ‘నిబంధన’ అనే స్థిరమైన బైబిలు పదాన్ని నిలిపి, ‘గైకొనాలి’ కంటే నేటి వాడుకలో సహజమైన ‘పాటించాలి’ ఎంచుకోబడింది. ‘సంతానం’ హీబ్రూ ఏకవచన సమూహార్థక זֶרַע ను సరియైన విధంగా ప్రతిబింబిస్తుండటంతో పాదసూచిక అవసరం లేదు.
