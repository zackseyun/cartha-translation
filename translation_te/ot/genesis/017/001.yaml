id: GEN.17.1
reference: Genesis 17:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְהִ֣י אַבְרָ֔ם בֶּן תִּשְׁעִ֥ים שָׁנָ֖ה וְ/תֵ֣שַׁע שָׁנִ֑ים וַ/יֵּרָ֨א יְהוָ֜ה אֶל אַבְרָ֗ם וַ/יֹּ֤אמֶר אֵלָי/ו֙ אֲנִי אֵ֣ל שַׁדַּ֔י הִתְהַלֵּ֥ךְ לְ/פָנַ֖/י וֶ/הְיֵ֥ה תָמִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/001.yaml
  text: When Abram was ninety-nine years old[a], Yahweh appeared to Abram and said to him, “I am God Almighty. Walk before me, and be blameless.”
translation:
  language: te
  text: 'అబ్రాము తొంభై తొమ్మిది సంవత్సరాల వయసులో ఉన్నప్పుడు, యాహ్వే అబ్రాముకు ప్రత్యక్షమై అతనితో ఇలా అన్నాడు: “నేను సర్వశక్తిమంతుడైన దేవుణ్ణి[a]. నా సన్నిధిలో నడుచు, నిందారహితుడిగా ఉండు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూలో: ఏల్ షద్దాయి. దీన్ని సాంప్రదాయంగా అనువదించకుండా లిప్యంతరీకరిస్తారు; ‘షద్దాయి’ అనే పదం యొక్క ఖచ్చితమైన భావం వివాదాస్పదం.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי ... בֶּן תִּשְׁעִים שָׁנָה וְתֵשַׁע שָׁנִים
  choice: అబ్రాము తొంభై తొమ్మిది సంవత్సరాల వయసులో ఉన్నప్పుడు
  rationale: హీబ్రూ వయస్సు సూచించే ప్రయోగాన్ని సహజమైన ఆధునిక తెలుగు కాలవాచక వాక్యంగా అందిస్తుంది.
- source_word: וַיֵּרָא
  choice: ప్రత్యక్షమై
  rationale: యాహ్వే కర్తగా, అబ్రాము దర్శనాన్ని పొందిన వ్యక్తిగా ఉన్న ఈ నిఫాల్ కథన సందర్భంలో ‘ప్రత్యక్షమయ్యాడు’ అనే అర్థం తగినది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవిక వ్యక్తినామమైన టెట్రాగ్రామటన్‌ను బిరుదుతో భర్తీ చేయకుండా తెలుగు లిపిలో లిప్యంతరీకరించింది.
- source_word: אֵל שַׁדַּי
  choice: సర్వశక్తిమంతుడైన దేవుడు
  rationale: సాంప్రదాయంగా ప్రాచుర్యంలో ఉన్న భావానువాదాన్ని సహజమైన తెలుగులో ఇస్తూ, שַׁדַּי యొక్క ఖచ్చితమైన భావం వివాదాస్పదమని పాదసూచికలో తెలియజేస్తుంది.
- source_word: הִתְהַלֵּךְ לְפָנַי
  choice: నా సన్నిధిలో నడుచుకుంటూ
  rationale: జీవన ప్రవర్తనను సూచించే ‘నడచు’ రూపకాన్ని నిలుపుతూ, לְפָנַי యొక్క సన్నిధి భావాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: וֶהְיֵה תָמִים
  choice: నిందారహితుడిగా ఉండు
  rationale: תָמִים సూచించే సమగ్రత, యథార్థత, నిందలేని నడవడిని తెలియజేస్తుంది; సంపూర్ణ పాపరాహిత్యమనే అతిశయార్థాన్ని రుద్దదు.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్ని నేరుగా వాడుతుంది; అందువల్ల బిరుదును ప్రత్యామ్నాయంగా పెట్టకుండా దానిని లిప్యంతరీకరించాం.
- issue: אֵל שַׁדַּי అనే దైవబిరుదు
  choice: సర్వశక్తిమంతుడైన దేవుడు
  alternative: ఏల్ షద్దాయి
  rationale: ప్రధాన పాఠంలో అర్థాన్ని సులభంగా అందించే సాంప్రదాయ భావానువాదాన్ని ఇచ్చి, అనిశ్చితమైన మూలపద భావాన్ని పాదసూచికలో భద్రపరిచాం.
- issue: תָמִים యొక్క నైతిక భావం
  choice: నిందారహితుడిగా
  alternative: సంపూర్ణుడిగా; యథార్థంగా
  rationale: వాక్యంలోని నైతిక, నిబంధనాత్మక పిలుపును నిలుపుతూ, దీనిని సంపూర్ణ పాపరాహిత్యానికి సంబంధించిన తాత్త్విక ప్రకటనగా మార్చకుండా ఉంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే కథన శైలి. హీబ్రూ జీవనరూపకమైన ‘నడుచు’ను నిలిపి ఉంచింది. అందించిన ఆంగ్ల పాఠంలో [a] గుర్తు వయస్సు తర్వాత ఉన్నప్పటికీ పాదసూచిక אֵל שַׁדַּי గురించినది కావడంతో, తెలుగులో ఆ గుర్తును సంబంధిత దైవబిరుదు తర్వాత ఉంచాం.
