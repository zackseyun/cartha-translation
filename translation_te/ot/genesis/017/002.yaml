  yaml_path: translation/ot/genesis/017/002.yaml
  text: And I will make my covenant between me and you[a], and I will multiply you exceedingly.
translation:
  language: te
  text: నేను నా నిబంధనను నాకూ నీకూ మధ్య స్థాపిస్తాను[a]; నిన్ను అత్యధికంగా విస్తరింపజేస్తాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత అక్షరార్థంగా: “నా నిబంధనను నాకూ నీకూ మధ్య ఇస్తాను” లేదా “ఉంచుతాను.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶתְּנָה
  choice: స్థాపిస్తాను
  rationale: נתן అనే క్రియకు ప్రాథమికంగా ‘ఇవ్వు/ఉంచు’ అనే అర్థాలున్నా, בְּרִית తో కూడిన ఈ సందర్భంలో ‘నిబంధనను స్థాపించు’ అనే భావం సహజంగా వ్యక్తమవుతుంది; వావ్ అనుసంధానం తెలుగు వాక్యప్రవాహంలో అంతర్లీనంగా ఉంది.
- source_word: בְרִיתִי
  choice: నా నిబంధనను
  rationale: בְּרִית యొక్క అధికారికమైన, వేదాంతపరమైన బరువును ‘నిబంధన’ నిలుపుతుంది; ఏకవచన ప్రథమ పురుష ప్రత్యయం ‘నా’గా ఇవ్వబడింది.
- source_word: בֵּינִי וּבֵינֶךָ
  choice: నాకు నీకు మధ్య
  rationale: ఇరువురి మధ్యనున్న సంబంధాన్ని తెలిపే హెబ్రీయ సమాంతర నిర్మాణానికి సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: וְאַרְבֶּה
  choice: విస్తరింపజేస్తాను
  rationale: רבה హిఫీల్ రూపం సంఖ్యాపరంగా విస్తారంగా పెరిగేలా చేయడాన్ని సూచిస్తుంది; అబ్రామును నేరుగా ఉద్దేశించిన వాగ్దానాన్ని నిలుపుతుంది.
- source_word: אֹתְךָ
  choice: నిన్ను
  rationale: మూలంలో ద్వితీయ పురుష ఏకవచన కర్మ అబ్రామునే నేరుగా సూచిస్తుంది; ‘నీ సంతానాన్ని’ అని వివరణాత్మకంగా విస్తరించలేదు.
- source_word: בִּמְאֹד מְאֹד
  choice: అత్యధికంగా
  rationale: మְאֹד పునరుక్తిలోని బలమైన తీవ్రతను సహజమైన తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: נתן + ברית అనే నిబంధన సంబంధిత ప్రయోగం
  choice: నా నిబంధనను ... స్థాపిస్తాను
  alternative: నా నిబంధనను ... ఇస్తాను/ఉంచుతాను
  rationale: మూల క్రియ యొక్క ‘ఇవ్వు/ఉంచు’ పరిధిని పాదటిప్పణిలో భద్రపరుస్తూ, నిబంధన సందర్భంలో ఉద్దేశించిన కార్యాన్ని ‘స్థాపిస్తాను’ సహజంగా తెలియజేస్తుంది; నిబంధన ప్రారంభమా ధృవీకరణమా అనే అదనపు సిద్ధాంత నిర్ణయాన్ని వాక్యంలో చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. హెబ్రీయ ద్వితీయ పురుష ఏకవచనాన్ని ‘నిన్ను’గా నిలిపి, సంతానం అనే భావాన్ని ప్రధాన పాఠ్యంలో చేర్చలేదు.
