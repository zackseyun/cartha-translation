source:
  edition: WLC
  text: וּ/בֶן שְׁמֹנַ֣ת יָמִ֗ים יִמּ֥וֹל לָ/כֶ֛ם כָּל זָכָ֖ר לְ/דֹרֹתֵי/כֶ֑ם יְלִ֣יד בָּ֔יִת וּ/מִקְנַת כֶּ֨סֶף֙ מִ/כֹּ֣ל בֶּן נֵכָ֔ר אֲשֶׁ֛ר לֹ֥א מִֽ/זַּרְעֲ/ךָ֖ הֽוּא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/012.yaml
  text: And at eight days old, every male among you throughout your generations shall be circumcised—whether born in the house or bought with silver from any foreigner who is not from your offspring.
translation:
  language: te
  text: మీలోని ప్రతి మగవానికి ఎనిమిదవ రోజున మీ తరతరాల్లో సున్నతి చేయబడాలి—ఇంట్లో పుట్టినవాడైనా, నీ సంతానానికి చెందని ఏ పరదేశి దగ్గరనుంచి వెండితో కొనుగోలు చేయబడినవాడైనా.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘ఎనిమిది రోజుల కుమారుడు.’
    reason: lexical_alternative
  - marker: b
    text: ‘వెండితో’ అనే మాటకు ‘డబ్బుతో’ అని కూడా అర్థం చెప్పవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: అక్షరార్థంగా, ‘నీ విత్తనానికి చెందినవాడు కాని ప్రతి పరదేశి కుమారుని దగ్గరనుంచి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבֶן שְׁמֹנַת יָמִים
  choice: ఎనిమిది రోజుల వయసున్న
  rationale: హీబ్రూ నుడికారం అక్షరార్థంగా ‘ఎనిమిది రోజుల కుమారుడు.’ ఆధునిక తెలుగులో శిశువు వయసును సహజంగా, ఖచ్చితంగా తెలియజేయడానికి ఈ రూపాన్ని ఎంచుకున్నాం.
- source_word: יִמּוֹל
  choice: సున్నతి చేయాలి
  rationale: ఇక్కడ నిఫ్అల్ క్రియ ఆజ్ఞాత్మక నియమాన్ని సూచిస్తుంది. తెలుగులో సహజమైన విధి-ప్రయోగం ఆ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: לָכֶם כָּל זָכָר
  choice: ప్రతి మగవానికి
  rationale: ‘ప్రతి మగవాడు’ అనే విస్తృత పరిధిని నిలుపుతూ, సున్నతి చేయబడే వ్యక్తిని తెలుగులో సహజంగా కర్మసంబంధ రూపంలో తెలిపింది.
- source_word: לְדֹרֹתֵיכֶם
  choice: మీ తరతరాల్లో
  rationale: ఈ ఆదేశం వరుస తరాలన్నిటిలో కొనసాగుతుందని మూలపాఠం సూచిస్తుంది.
- source_word: יְלִיד בָּיִת
  choice: ఇంట్లో పుట్టినవాడు
  rationale: కుటుంబ గృహవ్యవస్థలో పుట్టిన వ్యక్తిని సూచించే హీబ్రూ పదబంధానికి సమీపమైన, స్పష్టమైన తెలుగు రూపం.
- source_word: וּמִקְנַת כֶּסֶף
  choice: వెండితో కొనబడినవాడు
  rationale: כֶּסֶף యొక్క స్పష్టమైన ‘వెండి’ భావాన్ని నిలుపుతూ, కొనుగోలు ద్వారా ఇంటివారిలో చేరిన వ్యక్తిని సూచిస్తుంది.
- source_word: מִכֹּל בֶּן נֵכָר
  choice: ఏ పరదేశి దగ్గరనుంచైనా
  rationale: అక్షరార్థంగా ‘ప్రతి పరదేశి కుమారుని దగ్గరనుంచి’ అయినప్పటికీ, ఇది పరదేశిని సూచించే హీబ్రూ నుడికారం. ప్రధాన పాఠంలో సహజమైన తెలుగు ఇచ్చి, అక్షరార్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: אֲשֶׁר לֹא מִזַּרְעֲךָ הוּא
  choice: నీ సంతానానికి చెందని
  rationale: זֶרַע అక్షరార్థం ‘విత్తనం’; ఇక్కడ వంశసంతతిని సూచిస్తుంది. ఏకవచన సంబోధనను ‘నీ’ ద్వారా నిలిపాం.
theological_decisions:
- issue: అబ్రాహాము నిబంధన గృహంలో సున్నతి ఆజ్ఞ పరిధి
  choice: శారీరక సంతానంతోపాటు ఇంట్లో పుట్టినవారిని, పరదేశుల దగ్గరనుంచి కొనబడిన మగవారిని కూడా వచనం చేర్చుతుంది.
  alternative: ఈ ఆజ్ఞను ప్రధానంగా అబ్రాహాము శారీరక సంతానానికే పరిమితం చేయడం.
  rationale: హీబ్రూ పాఠం ఇంట్లో పుట్టినవారినీ, అబ్రాహాము సంతానానికి చెందని పరదేశుల దగ్గరనుంచి కొనబడినవారినీ స్పష్టంగా ప్రస్తావిస్తుంది. తరువాతి సిద్ధాంత నిర్ధారణలను చేర్చకుండా ఆ విస్తృతిని అనువాదం నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలిని వాడాం. మూలంలోని బహువచన ‘మీ తరతరాల్లో’ మరియు అబ్రాహామును ఉద్దేశించిన ఏకవచన ‘నీ సంతానం’ మధ్య మార్పును ఉద్దేశపూర్వకంగా నిలిపాం. చట్టపరమైన ఆజ్ఞ స్వరాన్ని ‘చేయాలి’ ద్వారా తెలిపాం.
