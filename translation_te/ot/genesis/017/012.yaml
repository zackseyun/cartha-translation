  to: మీలోని ప్రతి మగవానికి ఎనిమిదవ రోజున మీ తరతరాల్లో సున్నతి చేయబడాలి—ఇంట్లో పుట్టినవాడైనా, నీ సంతానానికి చెందని ఏ పరదేశి దగ్గరనుంచి వెండితో కొనుగోలు చేయబడినవాడైనా.[a][b][c]
  rationale: సవరణ మూలపాఠంలోని ‘మీలోని’ అనే సమూహపరిధిని, నిష్క్రియాత్మక విధి స్వరాన్ని, ఎనిమిదవ రోజు అనే కాలనిర్దేశాన్ని స్పష్టంగా చేసింది. కొనుగోలు చేయబడిన వ్యక్తి పరదేశి నుండి పొందబడినవాడనే సాధారణ భావాన్ని ప్రధాన పాఠంలో ఉంచి, మరింత అక్షరార్థమైన ‘పరదేశి కుమారుడు’ నిర్మాణాన్ని పాదసూచికలో నిలిపింది. ఎటువంటి సిద్ధాంతపరమైన విస్తరణను చేర్చలేదు.
