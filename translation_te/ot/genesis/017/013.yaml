source:
  edition: WLC
  text: הִמּ֧וֹל יִמּ֛וֹל יְלִ֥יד בֵּֽיתְ/ךָ֖ וּ/מִקְנַ֣ת כַּסְפֶּ֑/ךָ וְ/הָיְתָ֧ה בְרִיתִ֛/י בִּ/בְשַׂרְ/כֶ֖ם לִ/בְרִ֥ית עוֹלָֽם׀׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/013.yaml
  text: The one born in your house and the one bought with your money must surely be circumcised[c][b][a], and my covenant shall be in your flesh as an everlasting covenant.
translation:
  language: te
  text: నీ ఇంట పుట్టినవానికీ, నీ డబ్బుతో కొనబడినవానికీ[b][c] తప్పకుండా సున్నతి చేయాలి[a]. నా నిబంధన మీ శరీరంలో శాశ్వత నిబంధనగా ఉంటుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నిశ్చయంగా సున్నతి చేయబడాలి’ అని కూడా అనువదించవచ్చు. హీబ్రూలో ఒకే ధాతువుకు చెందిన అవ్యయ క్రియారూపాన్ని సమాపక క్రియతో కలిపి ఉద్ఘాటన చేశారు.
    reason: lexical_alternative
  - marker: b
    text: ‘ఇంట పుట్టినవాడు’, ‘డబ్బుతో కొనబడినవాడు’ అనే హీబ్రూ పదబంధాలు అబ్రాహాము ఇంటివారిలో అక్కడే పుట్టినవారినీ, కొనుగోలు ద్వారా చేర్చబడినవారినీ సూచిస్తాయి.
    reason: cultural_note
  - marker: c
    text: 'మరొక సాధ్యమైన రూపం: ‘నీ ఇంట పుట్టినవాడూ, నీ డబ్బుతో కొనబడినవాడూ’.'
    reason: previous_rendering
lexical_decisions:
- source_word: הִמּוֹל יִמּוֹל
  choice: తప్పకుండా సున్నతి చేయాలి
  rationale: మూలంలోని క్రియావిశేషణార్థక ధాతురూపం, సమాపక క్రియ కలయిక సున్నతి ఆజ్ఞను బలంగా నొక్కి చెబుతుంది. ఈ తెలుగు రూపం ఆ బాధ్యతను, ఉద్ఘాటనను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: יְלִיד בֵּיתְךָ
  choice: నీ ఇంట పుట్టినవాడు
  rationale: అక్షరార్థంగా ‘నీ ఇంట పుట్టినవాడు’. ఇంటివారిలో అక్కడే పుట్టిన పురుషుణ్ణి సూచిస్తుంది; మూలంలో లేని దాస్యస్థితిని ప్రధాన పాఠ్యంలో అదనంగా చేర్చలేదు.
- source_word: וּמִקְנַת כַּסְפֶּךָ
  choice: నీ డబ్బుతో కొనబడినవాడు
  rationale: కొనుగోలు ద్వారా ఇంటివారిలో చేరిన వ్యక్తిని సూచిస్తుంది. כֶּסֶף అక్షరార్థంగా ‘వెండి’ అయినా, ఇక్కడ చెల్లింపు సాధనం అనే భావంలో ఆధునిక తెలుగులో ‘డబ్బు’ సహజం.
- source_word: בְרִיתִי
  choice: నా నిబంధన
  rationale: దేవుడు ఏర్పరచిన covenant సంబంధాన్ని స్పష్టంగా నిలిపే ప్రామాణిక తెలుగు పదప్రయోగం.
- source_word: בִּבְשַׂרְכֶם
  choice: మీ శరీరంలో
  rationale: בְּ ఉపసర్గంలోని ‘లో/లోపల’ భావాన్ని నిలుపుతూ, సున్నతి అనే శారీరక గుర్తులో నిబంధన ఉండటాన్ని నేరుగా వ్యక్తం చేస్తుంది.
- source_word: לִבְרִית עוֹלָם
  choice: శాశ్వత నిబంధనగా
  rationale: לְ ఇక్కడ స్థితి లేదా పాత్రను సూచిస్తుంది; עוֹלָם యొక్క నిరంతర కాలభావాన్ని ‘శాశ్వత’ కాపాడుతుంది.
theological_decisions:
- issue: శారీరక గుర్తుకు, నిబంధనకు మధ్య సంబంధం
  choice: ‘నా నిబంధన మీ శరీరంలో ... ఉంటుంది’ అని మూలంలోని ప్రత్యక్ష సంబంధాన్ని అలాగే ఉంచడం
  alternative: సున్నతి కేవలం నిబంధనకు ప్రతీక అని గానీ, ఆ గుర్తే నిబంధనను సంపూర్ణంగా ఏర్పరుస్తుందని గానీ వివరణాత్మకంగా చెప్పడం
  rationale: హీబ్రూ వాక్యం నిబంధన శరీరంలో ఉంటుందని చెబుతుంది. గుర్తు-నిబంధన సంబంధంపై తరువాతి సిద్ధాంత నిర్ణయాన్ని అనువాదంలో చేర్చకుండా మూలంలోని వేదాంతపరమైన ఉద్రిక్తతను కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. ‘సున్నతి’, ‘నిబంధన’, ‘శాశ్వత’ వంటి స్థిరమైన బైబిలు పదాలను నిలిపి, వాక్య నిర్మాణాన్ని సహజంగా ఉంచాం.
