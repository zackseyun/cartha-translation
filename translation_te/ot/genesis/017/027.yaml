  yaml_path: translation/ot/genesis/017/027.yaml
  text: And all the men of his household[a], those born in the house and those bought with money from a foreigner, were circumcised with him.
translation:
  language: te
  text: 'అతని ఇంటి పురుషులందరూ—ఇంట్లో పుట్టినవారూ, పరదేశి[a] దగ్గర డబ్బిచ్చి కొనబడినవారూ—అతనితోపాటు సున్నతి పొందారు.


    [a] హీబ్రూలో అక్షరార్థంగా “పరదేశి కుమారుడు”; ఇది “పరదేశి” లేదా “బయటివాడు” అనే అర్థమిచ్చే నుడికారం.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా “పరదేశి కుమారుడు”; ఇది “పరదేశి” లేదా “బయటివాడు” అనే అర్థమిచ్చే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל אַנְשֵׁי בֵיתוֹ
  choice: అతని ఇంటి పురుషులందరూ
  rationale: וְ ఈ వాక్యాన్ని ముందటి కథనంతో కలుపుతుంది; తెలుగులో సందర్భానుసారంగా ప్రత్యేకంగా ‘మరియు’ చేర్చకుండానే అనుసంధానం సహజంగా నిలుస్తుంది. כָל సంపూర్ణతను, אַנְשֵׁי בֵיתוֹ అతని ఇంటివర్గంలోని పురుషులను సూచిస్తాయి.
- source_word: יְלִיד בָּיִת
  choice: ఇంట్లో పుట్టినవారు
  rationale: ఇంటి పరిధిలోనే పుట్టిన వ్యక్తులను సూచించే సామాజిక-గృహ సంబంధ పదబంధాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: וּמִקְנַת כֶּסֶף
  choice: డబ్బిచ్చి కొనబడినవారు
  rationale: ధనం చెల్లించి కొనుగోలు చేయబడిన వ్యక్తులనే నిర్మాణం సూచిస్తుంది; కర్మణి రూపం మూలంలోని లావాదేవీ భావాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: מֵאֵת בֶּן נֵכָר
  choice: పరదేశి దగ్గర
  rationale: מֵאֵת మూలం లేదా ఎవరి దగ్గరనుంచి కొనుగోలు జరిగిందో సూచిస్తుంది. בֶּן נֵכָר అక్షరార్థ నిర్మాణం కంటే ‘పరదేశి/బయటివాడు’ అనే నుడికార అర్థాన్ని ఇక్కడ ఇస్తుంది.
- source_word: נִמֹּלוּ
  choice: సున్నతి పొందారు
  rationale: నిఫాల్ రూపాన్ని ఇక్కడ కర్మణి భావంతో సహజమైన తెలుగులో అందిస్తుంది; వారు తమకుతామే చేసుకున్నారని సూచించదు.
- source_word: אִתּוֹ
  choice: అతనితోపాటు
  rationale: అబ్రాహాముతో కలిసి లేదా అదే సందర్భంలో సున్నతి పొందారనే సహచర్య భావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
