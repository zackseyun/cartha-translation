  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి వాడబడింది. గృహానికి చెందిన పురుషుల రెండు వర్గాలను స్పష్టంగా చూపేందుకు విరామరేఖలు ఉపయోగించబడ్డాయి; మూలంలోని సామాజిక వాస్తవాన్ని మృదూకరించకుండా ‘డబ్బిచ్చి కొనబడినవారు’ అని అనువదించబడింది.
