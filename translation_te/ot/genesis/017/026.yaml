translation:
  language: te
  text: ఆ రోజునే అబ్రాహాము, అతని కుమారుడైన ఇష్మాయేలు సున్నతి పొందారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: సరిగ్గా అదే రోజున
  rationale: ఈ హీబ్రూ కాలసూచక నానుడి ఆ నిర్దిష్టమైన రోజునే కార్యం జరిగిందని నొక్కి చెబుతుంది; ఆధునిక తెలుగులో ‘సరిగ్గా అదే రోజున’ ఆ ఉద్ఘాటనను సహజంగా అందిస్తుంది.
- source_word: נִמּוֹל
  choice: సున్నతి చేయించుకున్నారు
  rationale: హీబ్రూలో ఇది నిఫ్అల్ రూపంలో ‘సున్నతి పొందాడు/చేయబడ్డాడు’ అనే భావాన్ని ఇస్తుంది. అబ్రాహాము, ఇష్మాయేలు అనే సంయుక్త కర్తకు తెలుగు బహువచన రూపం వాడబడింది; ‘చేయించుకున్నారు’ సహజమైన తెలుగు ప్రయోగంగా సున్నతి పొందిన భావాన్ని తెలియజేస్తుంది.
- source_word: אַבְרָהָם
  choice: అబ్రాహాము
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: וְיִשְׁמָעֵאל
  choice: ఇష్మాయేలు
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగు బైబిలు వాడుకలో స్థిరపడిన లిప్యంతరీకరణ; సంధానార్థం తెలుగు జంటకర్త నిర్మాణంలో ‘-ఊ’ ద్వారా వ్యక్తమైంది.
- source_word: בְּנוֹ
  choice: అతని కుమారుడు
  rationale: మూడవ పురుష ఏకవచన స్వామ్య ప్రత్యయం ఇష్మాయేలు అబ్రాహాము కుమారుడని సూచిస్తుంది; ‘అతని కుమారుడు’ సంబంధాన్ని స్పష్టంగా, సహజంగా నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, మూలంలోని కాల ఉద్ఘాటనను మరియు సున్నతి పొందిన నిష్క్రియ భావాన్ని సహజ తెలుగు వాక్యనిర్మాణంలో నిలిపింది.
