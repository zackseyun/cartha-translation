id: GEN.17.7
reference: Genesis 17:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/הֲקִמֹתִ֨י אֶת בְּרִיתִ֜/י בֵּינִ֣/י וּ/בֵינֶ֗/ךָ וּ/בֵ֨ין זַרְעֲ/ךָ֧ אַחֲרֶ֛י/ךָ לְ/דֹרֹתָ֖/ם לִ/בְרִ֣ית עוֹלָ֑ם לִ/הְי֤וֹת לְ/ךָ֙ לֵֽ/אלֹהִ֔ים וּֽ/לְ/זַרְעֲ/ךָ֖ אַחֲרֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/007.yaml
  text: And I will establish my covenant between me and you and your offspring after you throughout their generations as an everlasting covenant[b][a], to be God to you and to your offspring after you.
translation:
  language: te
  text: నేను నా నిబంధనను నాకూ నీకూ, నీ తర్వాత వచ్చే నీ సంతానానికీ[a] మధ్య, వారి తరతరాల పొడవునా శాశ్వత నిబంధనగా స్థాపిస్తాను; నేను నీకు దేవునిగా ఉండేలా[b], నీ తర్వాత వచ్చే నీ సంతానానికి కూడా దేవునిగా ఉండేలా.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘సంతానం’ అని అనువదించిన హెబ్రీ పదం ఏకవచన రూపంలోని సమూహవాచకం; దానిని ‘విత్తనం’ లేదా ‘సంతతివారు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: మరింత నుడికారంగా, ‘నీ దేవునిగా ఉండేలా’ అని అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲקִמֹתִי
  choice: స్థాపిస్తాను
  rationale: הקים అనే క్రియ నిబంధనతో వచ్చినప్పుడు దానిని స్థాపించడం లేదా ధృవపరచడం అనే భావం ఇస్తుంది. ఈ సందర్భంలో ‘స్థాపిస్తాను’ సహజంగా ఉండి మూలంలోని బలాన్ని నిలుపుతుంది.
- source_word: בְּרִיתִי
  choice: నా నిబంధనను
  rationale: בְּרִית అంటే నిబంధన; మొదటి పురుష ఏకవచన స్వామ్య ప్రత్యయం ‘నా’గా నేరుగా నిలుపబడింది.
- source_word: בֵּינִי וּבֵינֶךָ וּבֵין
  choice: నాకు, నీకు, … మధ్య
  rationale: పునరుక్త בין నిబంధనలోని పక్షాలను సూచిస్తుంది. తెలుగు సహజ వాక్యనిర్మాణంలో ‘మధ్య’ను చివర ఉంచి సంబంధాన్ని స్పష్టంగా తెలిపాం.
- source_word: זַרְעֲךָ
  choice: నీ సంతానానికి
  rationale: זֶרַע వ్యాకరణపరంగా ఏకవచనమైన సమూహవాచకం; ‘సంతానం’ దాని సమూహార్థాన్నీ, ఏకవచన రూపాన్నీ నిలుపుతూ ఆధునిక తెలుగులో సహజంగా ఉంటుంది.
- source_word: אַחֲרֶיךָ
  choice: నీ తర్వాత
  rationale: కాలపరమైన, వంశపరమైన కొనసాగింపును సూటిగా తెలియజేస్తుంది.
- source_word: לְדֹרֹתָם
  choice: వారి తరతరాలన్నిటిలో
  rationale: తరాల పొడవునా కొనసాగే భావాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לִבְרִית עוֹלָם
  choice: శాశ్వత నిబంధనగా
  rationale: עוֹלָם ఇక్కడ నిబంధన యొక్క నిరంతర, నిలిచే స్వభావాన్ని సూచిస్తుంది; ‘శాశ్వత’ గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సుపరిచితం.
- source_word: לִהְיוֹת לְךָ לֵאלֹהִים
  choice: నీకు దేవునిగా ఉండడానికి
  rationale: ‘నీ దేవునిగా’ అనే మరింత నుడికారమైన రూపానికి బదులు, హెబ్రీ సంబంధసూత్రానికి దగ్గరగా ‘నీకు దేవునిగా’ అని ఉంచాం.
- source_word: וּלְזַרְעֲךָ אַחֲרֶיךָ
  choice: నీ తర్వాత నీ సంతానానికి కూడా దేవునిగా ఉండడానికి
  rationale: ముందటి זרע అనువాదంతో ఏకరీతిని కాపాడుతూ, మూలంలో సందర్భం ద్వారా అర్థమయ్యే ‘దేవునిగా ఉండడం’ను తెలుగులో స్పష్టత కోసం పునరుక్తం చేశాం.
theological_decisions:
- issue: అబ్రాహాము సంతానాన్ని సూచించే సమూహవాచకం
  choice: సంతానం
  alternative: విత్తనం; సంతతివారు
  rationale: హెబ్రీ זרע ఏకవచన రూపంలో ఉన్న సమూహవాచకం. ‘సంతానం’ దానిని పూర్తిగా బహువచన వ్యక్తులకే పరిమితం చేయకుండా అసలు పదంలోని అర్థవిస్తృతిని కాపాడుతుంది.
- issue: నిబంధన సూత్రంలోని సంబంధ భాష
  choice: నీకు దేవునిగా ఉండడానికి
  alternative: నీ దేవునిగా ఉండడానికి
  rationale: ఈ రూపం హెబ్రీలోని לְךָ לֵאלֹהִים నిర్మాణానికి దగ్గరగా ఉండి, అదనపు సిద్ధాంతార్థాన్ని చేర్చకుండా నిబంధన సంబంధాన్ని నిలుపుతుంది.
- issue: עוֹלָם యొక్క కాలవ్యాప్తి
  choice: శాశ్వత
  alternative: నిరంతర; ఎల్లకాల నిబంధన
  rationale: నిబంధన సందర్భంలో పదం సూచించే నిలకడను ‘శాశ్వత’ సహజంగా తెలియజేస్తుంది; దాని కాలవ్యాప్తిపై అదనపు సిద్ధాంత పరిమితిని అనువాదం విధించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన, సులభగ్రాహ్యమైన నిబంధన భాషను వాడాం. హెబ్రీ వాక్యంలోని దీర్ఘ నిర్మాణం తెలుగులో స్పష్టంగా ఉండేందుకు చివరి ఉద్దేశ్య భాగంలో ‘దానిని స్థాపిస్తాను’ మరియు ‘దేవునిగా ఉండడానికి’ను పునరుక్తం చేశాం. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉంచబడ్డాయి.
