    issue: చివరి ఉద్దేశ్య వాక్యంలో “దానిని స్థాపిస్తాను” అనే క్రియను పునరావృతం చేశారు.
    rationale: హెబ్రీలో స్థాపించే క్రియ ఒక్కసారే ఉంది; ఆ తరువాత భాగం “నీకు దేవునిగా ఉండడానికి, నీ సంతానానికి దేవునిగా ఉండడానికి” అనే ఉద్దేశ్యాన్ని తెలియజేస్తుంది. పునరావృతం అనవసరంగా అదనపు వాక్యక్రియను ప్రవేశపెడుతుంది.
  - severity: low
