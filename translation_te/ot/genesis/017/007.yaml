revisions:
- from: నేను నా నిబంధనను నాకు, నీకు, నీ తర్వాత నీ సంతానానికి[a] మధ్య, వారి తరతరాలన్నిటిలో శాశ్వత నిబంధనగా స్థాపిస్తాను. నీకు దేవునిగా ఉండడానికి[b], నీ తర్వాత నీ సంతానానికి కూడా దేవునిగా ఉండడానికి దానిని స్థాపిస్తాను.
  to: నేను నా నిబంధనను నాకూ నీకూ, నీ తర్వాత వచ్చే నీ సంతానానికీ[a] మధ్య, వారి తరతరాల పొడవునా శాశ్వత నిబంధనగా స్థాపిస్తాను; నేను నీకు దేవునిగా ఉండేలా[b], నీ తర్వాత వచ్చే నీ సంతానానికి కూడా దేవునిగా ఉండేలా.
  rationale: సవరణ మూలంలోని ఒకే ప్రధాన క్రియ “నేను స్థాపిస్తాను”ను నిలుపుతూ, చివరి భాగాన్ని దాని ఉద్దేశ్యంగా అనువదిస్తుంది. “నీ తర్వాత వచ్చే” అనేది אַחֲרֶיךָ యొక్క వంశానుగత-కాలార్థాన్ని స్పష్టంగా తెలియజేస్తుంది. ‘సంతానం’ మరియు సంబంధాత్మకమైన ‘నీకు దేవునిగా’ అనే పదప్రయోగాలు హెబ్రీలోని సామూహికతను, నిబంధన సూత్రాన్ని ఎటువంటి సిద్ధాంతపరమైన నిర్ధారణ లేకుండా కాపాడుతాయి.
