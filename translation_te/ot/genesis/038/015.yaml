  yaml_path: translation/ot/genesis/038/015.yaml
  text: When Judah saw her[a], he thought she was a prostitute, because she had covered her face.
translation:
  language: te
  text: యూదా ఆమెను చూసినప్పుడు, ఆమె తన ముఖాన్ని కప్పుకున్నందున ఆమెను వేశ్యగా అనుకున్నాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆమెను వేశ్యగా పరిగణించాడు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְאֶהָ
  choice: యూదా ఆమెను చూసినప్పుడు
  rationale: ראה అంటే ‘చూడు.’ వరుసగా జరిగిన కథన చర్యలను సహజమైన తెలుగులో చూపేందుకు waw-consecutive సంబంధాన్ని ‘చూసినప్పుడు’ అని అనువదించాం.
- source_word: וַיַּחְשְׁבֶהָ
  choice: ఆమె ... అని అనుకున్నాడు
  rationale: חשב ఇక్కడ ఆమె ఎవరో అనే విషయంలో యూదా చేసిన మానసిక నిర్ధారణను సూచిస్తుంది. ‘అని అనుకున్నాడు’ ఆధునిక తెలుగులో సహజంగా ఉండి, అతని పొరపాటు అభిప్రాయాన్ని తెలియజేస్తుంది.
- source_word: לְזוֹנָה
  choice: వేశ్య
  rationale: זונה వ్యభిచార వృత్తిలో ఉన్న స్త్రీని సూచిస్తుంది. ‘వేశ్య’ అనేది స్పష్టమైన, ప్రామాణిక ఆధునిక తెలుగు పదం; మూలంలో లేని ఆధునిక సామాజిక భావాలను జోడించదు.
- source_word: כִּי
  choice: అందువల్ల
  rationale: כִּי యూదా చేసిన నిర్ధారణకు కారణాన్ని పరిచయం చేస్తుంది. తెలుగు వాక్య క్రమంలో కారణాన్ని ముందుగా ఉంచి ‘అందువల్ల’ అనడం సహజంగా causal సంబంధాన్ని నిలుపుతుంది.
- source_word: כִסְּתָה פָּנֶיהָ
  choice: ఆమె ముఖాన్ని కప్పుకొని ఉన్నందువల్ల
  rationale: כסה అంటే ‘కప్పు,’ פניה అంటే ‘ఆమె ముఖం.’ ఈ క్రియ యూదా అభిప్రాయానికి ముందే ఉన్న నేపథ్య పరిస్థితిని తెలుపుతుంది; ‘కప్పుకొని ఉన్న’ అనే రూపం ఆ స్థితిని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథన శైలి. హెబ్రీ వాక్యంలోని కారణ సంబంధాన్ని సహజమైన తెలుగు వాక్య క్రమంలో వ్యక్తం చేశాం.
