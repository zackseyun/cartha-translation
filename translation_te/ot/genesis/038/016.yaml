  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֵּ֨ט אֵלֶ֜י/הָ אֶל הַ/דֶּ֗רֶךְ וַ/יֹּ֨אמֶר֙ הָֽבָ/ה נָּא֙ אָב֣וֹא אֵלַ֔יִ/ךְ כִּ֚י לֹ֣א יָדַ֔ע כִּ֥י כַלָּת֖/וֹ הִ֑וא וַ/תֹּ֨אמֶר֙ מַה תִּתֶּן לִּ֔/י כִּ֥י תָב֖וֹא אֵלָֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/016.yaml
  text: So he turned aside to her by the road and said[a], “Please, let me come in to you,” for he did not know that she was his daughter-in-law. And she said, “What will you give me[b], that you may come in to me?”
translation:
  language: te
  text: అప్పుడు అతడు దారిపక్కన ఆమెవైపు తిరిగి, “దయచేసి, నీ దగ్గరకు రానిమ్ము[a]” అన్నాడు. ఆమె తన కోడలు అని అతనికి తెలియదు. అప్పుడు ఆమె, “నువ్వు నా దగ్గరకు రావడానికి నాకు ఏమి ఇస్తావు[b]?” అని అడిగింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “నీ దగ్గరకు రావడం” అనేది ఇక్కడ లైంగిక సంబంధాన్ని సూచించే హీబ్రూ సభ్యోక్తి.
    reason: lexical_alternative
  - marker: b
    text: “నాకు ఏమి చెల్లిస్తావు?” అని కూడా అనువదించవచ్చు. హీబ్రూ వాక్యం అక్షరార్థంగా, “నాకు ఏమి ఇస్తావు?” అని ఉంది.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּט אֵלֶיהָ אֶל־הַדֶּרֶךְ
  choice: దారి పక్కన ఉన్న ఆమెవైపు తిరిగి
  rationale: נטה ఇక్కడ ప్రయాణ మార్గం నుంచి ఆమెవైపు మళ్లడాన్ని సూచిస్తుంది. సందర్భంలో ఆమె దారి పక్కన కూర్చున్నందున ఈ రూపం స్థల సంబంధాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: הָבָה נָּא
  choice: దయచేసి, నన్ను ... రానివ్వు
  rationale: విన్నపం లేదా ప్రేరేపణను తెలిపే ఈ పదబంధాన్ని ఆధునిక తెలుగులో సహజమైన అభ్యర్థనగా వ్యక్తం చేసింది.
- source_word: אָבוֹא אֵלַיִךְ / תָבוֹא אֵלַי
  choice: నీ దగ్గరికి రానివ్వు / నా దగ్గరికి రావడానికి
  rationale: בוא + אל ఇక్కడ లైంగిక సంబంధానికి సభ్యోక్తి. ప్రధాన వచనంలో దాని పరోక్షతను నిలిపి, అర్థాన్ని పాదసూచికలో స్పష్టం చేసింది.
- source_word: כִּי לֹא יָדַע כִּי כַלָּתוֹ הִוא
  choice: ఎందుకంటే ఆమె తన కోడలని అతనికి తెలియదు
  rationale: మొదటి כִּי కారణాన్ని, రెండవది తెలిసిన విషయానికి సంబంధించిన ఉపవాక్యాన్ని పరిచయం చేస్తాయి. כַלָּהకు సందర్భానుసారమైన ఖచ్చితమైన బంధుత్వ పదం ‘కోడలు’.
- source_word: מַה תִּתֶּן לִּי
  choice: నాకు ఏమి ఇస్తావు
  rationale: נתן యొక్క విస్తృతమైన ‘ఇవ్వు’ భావాన్ని ప్రధాన వచనంలో నిలిపింది; సందర్భంలో ఇది చెల్లింపును సూచించవచ్చని పాదసూచిక తెలియజేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. హీబ్రూ సభ్యోక్తిని ప్రధాన వచనంలో పరోక్షంగానే ఉంచి, దాని లైంగిక భావాన్ని పాదసూచికలో వివరించింది. అన్ని పాదసూచిక సూచికలు ప్రధాన వచనంలో చేర్చబడ్డాయి.
