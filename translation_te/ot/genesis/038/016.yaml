    issue: The expression “దారి పక్కన ఉన్న ఆమెవైపు తిరిగి” is slightly cumbersome.
    rationale: It can be read as modifying the woman rather than clearly describing Judah's movement aside toward her. Recasting it as turning aside to her by the roadside is clearer and closer to וַיֵּט אֵלֶיהָ אֶל־הַדֶּרֶךְ.
  - severity: low
