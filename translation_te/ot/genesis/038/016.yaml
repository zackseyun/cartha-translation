- from: అప్పుడు అతడు దారి పక్కన ఉన్న ఆమెవైపు తిరిగి, “దయచేసి, నన్ను నీ దగ్గరికి రానివ్వు[a]” అన్నాడు. ఎందుకంటే ఆమె తన కోడలని అతనికి తెలియదు. అందుకు ఆమె, “నువ్వు నా దగ్గరికి రావడానికి నాకు ఏమి ఇస్తావు[b]?” అని అడిగింది.
