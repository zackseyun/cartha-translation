  naturalness: A small wording adjustment makes the opening movement and Judah's request more idiomatic modern standard Telugu. Separating the quoted request from the literal permissive construction avoids the somewhat awkward object form “నన్ను ... రానివ్వు.”
  terminology: “కోడలు” accurately renders כַלָּה in this context. The footnotes appropriately preserve both the Hebrew sexual euphemism and the broader literal sense of “give” rather than imposing “pay” in the main text.
  issues:
