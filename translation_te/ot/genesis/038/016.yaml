    rationale: “నీ దగ్గరకు రానిమ్ము” naturally expresses the Hebrew entreaty while retaining its euphemistic wording.
  - severity: low
    issue: “కోడలని” is colloquial contracted spelling in this narrative register.
    rationale: “కోడలు అని” is clearer modern standard Telugu while preserving the same meaning.
