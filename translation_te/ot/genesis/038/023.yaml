  yaml_path: translation/ot/genesis/038/023.yaml
  text: And Judah said[a], “Let her keep them, lest we become a laughingstock. Look, I sent this young goat, but you did not find her.”
translation:
  language: te
  text: అప్పుడు యూదా, “ఆమె వాటిని ఉంచుకోనివ్వు; లేకపోతే మనం అపహాస్యం పాలవుతాం.[a] ఇదిగో, నేను ఈ మేకపిల్లను పంపాను; కానీ నువ్వు ఆమెను కనుగొనలేదు” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “మనం అవమానం పాలవుతాం,” లేదా “మనల్ని ఎగతాళి చేస్తారు.” హెబ్రీ ప్రయోగం తృణీకారానికి లేదా ఎగతాళికి గురయ్యే భావాన్ని తెలియజేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּקַּח לָהּ
  choice: ఆమె వాటిని తన దగ్గరే ఉంచుకోనివ్వు
  rationale: ఈ సందర్భంలో 3వ పురుష ఏకవచన స్త్రీలింగ క్రియ అనుమతి లేదా సమ్మతిని తెలియజేస్తుంది. వస్తువు హెబ్రీలో స్పష్టంగా లేకపోయినా, ముందు ఇచ్చిన పూచీకత్తు వస్తువులను సూచిస్తున్నందున తెలుగులో సహజంగా ‘వాటిని’ అని వ్యక్తం చేశాం.
- source_word: פֶּן נִהְיֶה לָבוּז
  choice: లేకపోతే మనం అపహాస్యం పాలవుతాం
  rationale: בּוּז అనే పదం తృణీకారం, ఎగతాళి, అపహాస్యం అనే భావాలను కలిగిస్తుంది. సామాజిక అవమానం పట్ల యూదా భయాన్ని ‘అపహాస్యం పాలవుతాం’ సహజంగా తెలియజేస్తుంది.
- source_word: הִנֵּה
  choice: ఇదిగో
  rationale: తరువాతి మాటపై దృష్టి నిలిపే హెబ్రీ సంభాషణ సూచకాన్ని ఆధునిక, గౌరవప్రదమైన తెలుగులో ‘ఇదిగో’గా నిలిపాం.
- source_word: שָׁלַחְתִּי הַגְּדִי הַזֶּה
  choice: నేను ఈ మేకపిల్లను పంపాను
  rationale: גְּדִי అంటే చిన్న మేక లేదా మేకపిల్ల. నిర్దేశకమైన ‘ఈ’ని కూడా మూలపాఠం ప్రకారం నిలిపాం.
- source_word: וְאַתָּה לֹא מְצָאתָהּ
  choice: కానీ నువ్వు ఆమెను కనుగొనలేకపోయావు
  rationale: ו ఇక్కడ ముందున్న చర్యకూ ఫలితం లేకపోవడానికీ మధ్య వ్యత్యాసాన్ని సూచిస్తుంది; అందువల్ల ‘కానీ’ సహజం. స్త్రీలింగ ప్రత్యయం వెదికిన స్త్రీని సూచిస్తుంది.
- source_word: יְהוּדָה
  choice: యూదా
  rationale: ఆధునిక ప్రామాణిక తెలుగు బైబిలు నామరూపాన్ని ఉపయోగించాం.
