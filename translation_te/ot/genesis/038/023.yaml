  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని అనుసరించాం. మూలంలోని సంభాషణాత్మక బలాన్ని నిలిపి, సందర్భంలో అంతర్లీనంగా ఉన్న పూచీకత్తు వస్తువులను తెలుగులో ‘వాటిని’ అని స్పష్టం చేశాం.
