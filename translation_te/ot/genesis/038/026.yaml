  text: וַ/יַּכֵּ֣ר יְהוּדָ֗ה וַ/יֹּ֨אמֶר֙ צָֽדְקָ֣ה מִמֶּ֔/נִּי כִּֽי עַל כֵּ֥ן לֹא נְתַתִּ֖י/הָ לְ/שֵׁלָ֣ה בְנִ֑/י וְ/לֹֽא יָסַ֥ף ע֖וֹד לְ/דַעְתָּֽ/ה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/026.yaml
  text: Then Judah recognized them and said[a], “She is more righteous than I[b], because I did not give her to Shelah my son.” And he did not know her again.
translation:
  language: te
  text: అప్పుడు యూదా వాటిని గుర్తించి, “ఆమె నాకంటే నీతిమంతురాలు[a]. ఎందుకంటే నేను ఆమెను నా కుమారుడైన షేలాకు ఇవ్వలేదు” అన్నాడు. అతడు ఇక ఆమెను ఎరుగలేదు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఈ విషయంలో ఆమెదే నాకంటే న్యాయం.”
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో “ఆమెను ఎరుగుట”; ఇది లైంగిక సంబంధాన్ని సూచించే సభ్యోక్తి.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּכֵּר
  choice: వాటిని గుర్తించి
  rationale: మునుపటి వచనంలో చూపించిన తాకట్టు వస్తువులనే యూదా గుర్తించాడు; సహజమైన తెలుగుకోసం సందర్భం నుంచి ‘వాటిని’ చేర్చబడింది.
- source_word: צָדְקָה מִמֶּנִּי
  choice: ఆమె నాకంటే నీతిమంతురాలు
  rationale: מִן ఉన్న తులనాత్మక నిర్మాణాన్ని నిలుపుతూ, צדק పదంలోని నైతిక భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; ఇది ఈ సందర్భంలోని తులన, సంపూర్ణ నిర్దోషిత్వ ప్రకటన కాదు.
- source_word: כִּי עַל כֵּן
  choice: ఎందుకంటే
  rationale: యూదా చేసిన అంగీకారానికి కారణాన్ని పరిచయం చేసే ఈ పదబంధపు కారణార్థాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: לֹא נְתַתִּיהָ לְשֵׁלָה בְנִי
  choice: నేను ఆమెను నా కుమారుడైన షేలాకు ఇవ్వలేదు
  rationale: హీబ్రూ వాక్య నిర్మాణాన్ని దగ్గరగా అనుసరిస్తుంది; వివాహానికి ఇవ్వడం అనే భావం కథా సందర్భంలో స్పష్టంగా ఉంది.
- source_word: וְלֹא יָסַף עוֹד לְדַעְתָּהּ
  choice: ఆ తరువాత అతడు ఆమెను మళ్లీ ఎరుగలేదు
  rationale: ידע అనే హీబ్రూ సభ్యోక్తిని నిలుపుతుంది; ‘మళ్లీ’ అనేది ఇకపై లైంగిక సంబంధం పెట్టుకోలేదనే יָסַף עוֹד భావాన్ని తెలియజేస్తుంది.
- source_word: יְהוּדָה
  choice: యూదా
  rationale: వ్యక్తి పేరును ఆధునిక ప్రామాణిక తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించింది.
- source_word: שֵׁלָה
  choice: షేలా
  rationale: హీబ్రూ వ్యక్తి పేరును తెలుగులో స్పష్టంగా లిప్యంతరీకరించింది.
theological_decisions:
- issue: యూదా ఒప్పుకోలులోని నైతిక మూల్యాంకనం
  choice: ఈ విషయంలో తామారు తనకంటే నీతిమంతురాలని యూదా అంగీకరిస్తున్నట్లు తులనాత్మక భాషను నిలిపాం.
  alternative: ‘ఈ విషయంలో ఆమెదే న్యాయం’ అని కేవలం న్యాయపరమైన సమర్థనగా అనువదించడం; లేదా ఆమె పూర్తిగా నిర్దోషి అని విస్తరించడం.
  rationale: צָדְקָה מִמֶּנִּי సందర్భానుగుణమైన తులనాత్మక తీర్పు. ఇది నైతిక బలాన్ని కలిగి ఉన్నప్పటికీ, తామారు సంపూర్ణంగా పాపరహితురాలని ప్రకటించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘నీతిమంతురాలు’ మూలంలోని నైతిక పదసంబంధాన్ని నిలుపుతుంది; ప్రత్యామ్నాయ భావాన్ని పాదటిప్పణిలో ఇచ్చాం. ‘ఎరుగలేదు’ అనే కొద్దిగా సాహిత్యరూపాన్ని మూల సభ్యోక్తి కోసం ఉంచి, దాని అర్థాన్ని పాదటిప్పణిలో స్పష్టం చేశాం.
