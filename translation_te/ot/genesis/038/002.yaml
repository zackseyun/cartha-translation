  yaml_path: translation/ot/genesis/038/002.yaml
  text: There Judah saw the daughter of a Canaanite man whose name was Shua[b][a], and he took her and went in to her.
translation:
  language: te
  text: అక్కడ యూదా షూవా అనే పేరున్న ఒక కనానీయుని కుమార్తెను చూశాడు. అతడు ఆమెను తీసుకొని ఆమెతో శయనించాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “ఆమెయొద్దకు వెళ్లాడు”; ఇది లైంగిక సంబంధాన్ని సూచించే సౌమ్యోక్తి.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּרְא
  choice: చూశాడు
  rationale: ראה అనే క్రియకు కథన సందర్భంలో నేరుగా సరిపోయే అర్థం ‘చూశాడు’; ‘కలిశాడు’ అనడం మూలంలో లేని భావాన్ని చేర్చుతుంది.
- source_word: שָׁם
  choice: అక్కడ
  rationale: స్థలాన్ని సూచించే ఈ క్రియావిశేషణానికి సహజమైన, సంక్షిప్తమైన తెలుగు సమానం.
- source_word: בַּת אִישׁ כְּנַעֲנִי
  choice: కనానీయుడి కుమార్తెను
  rationale: ‘ఒక కనానీయ వ్యక్తి కుమార్తె’ అనే మూల నిర్మాణాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וּשְׁמוֹ שׁוּעַ
  choice: షూవ అనే పేరుగల
  rationale: ‘అతని పేరు షూవ’ అనే హీబ్రూ వాక్యం కుమార్తెను కాక కనానీయుడైన తండ్రినే సూచిస్తుంది; తెలుగు నిర్మాణంలోనూ ఆ సంబంధాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: וַיִּקָּחֶהָ
  choice: అతడు ఆమెను తీసుకొని
  rationale: לקח యొక్క ప్రాథమిక భావమైన ‘తీసుకొను’ను నిలుపుతుంది. సందర్భంలో వివాహార్థం ఉండవచ్చుగానీ, ‘పెళ్లి చేసుకున్నాడు’ అని స్పష్టీకరించడం మూలంలోని సాధారణ పదాన్ని సంకుచితం చేస్తుంది.
- source_word: וַיָּבֹא אֵלֶיהָ
  choice: ఆమె దగ్గరకు వెళ్లాడు
  rationale: హీబ్రూ పదబంధ రూపాన్ని గౌరవిస్తూ సహజమైన తెలుగులో ఇస్తుంది; ఇది లైంగిక సంబంధాన్ని సూచించే సౌమ్యోక్తి అని పాదసూచిక వివరిస్తుంది.
