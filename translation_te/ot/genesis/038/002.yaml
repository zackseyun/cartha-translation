  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. తండ్రి పేరు షూవ అని వాక్య నిర్మాణంలోనే స్పష్టం చేయబడింది; అందువల్ల దానికి ప్రత్యేక పాదసూచిక అవసరం లేదు.
