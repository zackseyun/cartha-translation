id: GEN.38.9
reference: Genesis 38:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֵּ֣דַע אוֹנָ֔ן כִּ֛י לֹּ֥א ל֖/וֹ יִהְיֶ֣ה הַ/זָּ֑רַע וְ/הָיָ֞ה אִם בָּ֨א אֶל אֵ֤שֶׁת אָחִי/ו֙ וְ/שִׁחֵ֣ת אַ֔רְצָ/ה לְ/בִלְתִּ֥י נְתָן זֶ֖רַע לְ/אָחִֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/009.yaml
  text: But Onan knew that the offspring would not be his[a]; so whenever he went in to his brother’s wife, he spilled it on the ground[b], so as not to give offspring to his brother.
translation:
  language: te
  text: కాని ఆ సంతానం తనకు చెందదని ఓనానుకు తెలుసు[a]. కాబట్టి అతడు తన సోదరుని భార్యతో శయనించినప్పుడల్లా, తన సోదరునికి సంతానం కలగకుండా ఉండటానికి తన వీర్యాన్ని నేలమీద కార్చేవాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ఈ వాక్యభాగంలోనూ, వచనం చివరలోనూ అక్షరార్థంగా ‘విత్తనం’ అనే పదమే ఉంది. ఈ సందర్భంలో అది మరణించిన సోదరుని పేరున లెక్కించబడే సంతానాన్ని లేదా వారసుణ్ణి సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థానికి దగ్గరగా, ‘దానిని నేలమీద పాడుచేసేవాడు’ అని కూడా అనువదించవచ్చు. గర్భధారణ కలగకుండా చేయడానికి ఓనాను చేసిన చర్యను ఈ మాట సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּדַע
  choice: తెలుసు
  rationale: కథన సందర్భంలో ידע అనే క్రియకు సహజమైన ప్రత్యక్ష అర్థం ‘తెలుసు’; ఓనాను పరిస్థితిని గ్రహించి ఉన్నాడనే భావాన్ని తెలియజేస్తుంది.
- source_word: הַזָּרַע
  choice: పుట్టబోయే సంతానం
  rationale: ఇక్కడ זרע అక్షరార్థంగా ‘విత్తనం’ అయినా, మరిది ధర్మ సందర్భంలో మరణించిన అన్న పేరున లెక్కించబడే బిడ్డ లేదా సంతానాన్ని సూచిస్తుంది.
- source_word: לֹּא לוֹ יִהְיֶה הַזָּרַע
  choice: పుట్టబోయే సంతానం తనది కాదు
  rationale: జనించే వారసుడు ఓనానుకు కాక మరణించిన అన్నకు చెందినవాడిగా పరిగణించబడతాడనే కుటుంబ-న్యాయ భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וְהָיָה אִם־בָּא
  choice: కలిసినప్పుడల్లా
  rationale: ఈ నిర్మాణం గతంలో పునరావృతమైన ఆచరణను సూచిస్తుంది; ‘అప్పుడల్లా’ ఆ భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: בָּא אֶל־אֵשֶׁת אָחִיו
  choice: తన అన్న భార్యతో కలిసినప్పుడు
  rationale: లైంగిక సంబంధాన్ని సూచించే హీబ్రూ సభ్యోక్తిని ఆధునిక, గౌరవప్రదమైన తెలుగులో స్పష్టంగా కానీ అసభ్యంగా కాకుండా అందిస్తుంది.
- source_word: וְשִׁחֵת אַרְצָה
  choice: దానిని నేలమీద వృథా చేసేవాడు
  rationale: שחת యొక్క ‘పాడుచేయు/నాశనం చేయు/వృథా చేయు’ భావాన్ని నిలుపుతూ, గర్భధారణను ఉద్దేశపూర్వకంగా అడ్డుకున్న చర్యను హీబ్రూ కంటే అతిగా స్పష్టీకరించకుండా తెలియజేస్తుంది.
- source_word: לְבִלְתִּי נְתָן זֶרַע לְאָחִיו
  choice: తన అన్నకు సంతానం కలిగించకూడదని
  rationale: ఉద్దేశాన్ని తెలిపే ఈ వాక్యభాగం, మరణించిన అన్నకు వారసుణ్ణి కలిగించే బాధ్యతను ఓనాను తప్పించుకున్నాడనే సందర్భార్థాన్ని సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ఈ వచనంలో זרע పదం మరియు ఓనాను చేసిన చర్య మధ్య సంబంధం
  choice: కుటుంబ-న్యాయ సందర్భంలోని זרע ను ‘సంతానం’గా అనువదించి, וְשִׁחֵת אַרְצָה ను ‘దానిని నేలమీద వృథా చేసేవాడు’గా ఉంచడం
  alternative: זרת ను అంతటా ‘విత్తనం’గా అనువదించడం లేదా చర్యను ‘వీర్యాన్ని నేలమీద కార్చేవాడు’ అని మరింత స్పష్టంగా చెప్పడం
  rationale: వచనం ఒకవైపు మరణించిన అన్నకు చెందవలసిన సంతానాన్ని, మరోవైపు ఆ సంతానం కలగకుండా ఓనాను చేసిన శారీరక చర్యను కలిపి చెబుతుంది. ప్రధాన పాఠ్యంలో ‘సంతానం’ న్యాయపరమైన సందర్భాన్ని స్పష్టం చేస్తుంది; ‘వృథా చేసేవాడు’ మూలంలోని ఉద్దేశపూర్వక పాడుచేయుట అనే భావాన్ని నిలుపుతూ, మూలం చెప్పిన దానికంటే ఎక్కువ శారీరక వివరాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి. లైంగిక చర్యను ‘కలిసినప్పుడు’ అనే సాధారణ సభ్యోక్తితో తెలిపి, పునరావృత చర్యను ‘అప్పుడల్లా… చేసేవాడు’తో స్పష్టంచేశాం. ‘అన్న’ అనే ఎంపిక אָחִיו ను సందర్భానుగుణంగా సహజంగా అందిస్తుంది.
