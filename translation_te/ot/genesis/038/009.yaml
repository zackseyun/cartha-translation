  to: కాని ఆ సంతానం తనకు చెందదని ఓనానుకు తెలుసు[a]. కాబట్టి అతడు తన సోదరుని భార్యతో శయనించినప్పుడల్లా, తన సోదరునికి సంతానం కలగకుండా ఉండటానికి తన వీర్యాన్ని నేలమీద కార్చేవాడు[b].
  rationale: సందర్భంలో అంతర్లీనంగా ఉన్న వస్తువును ప్రధాన పాఠ్యంలో స్పష్టం చేసి, అస్పష్టమైన సర్వనామాన్ని తొలగించాం. ‘సంతానం’ను రెండు న్యాయపరమైన వాక్యభాగాలలో నిలిపి, ఓనాను చర్యను గర్భధారణను అడ్డుకునే ఉద్దేశంతో మాత్రమే వివరించాం. సోదరుని వయోభేదాన్ని మూలపాఠ్యం ఈ వచనంలో చెప్పనందున ‘అన్న’ స్థానంలో ‘సోదరుడు’ వాడాం.
