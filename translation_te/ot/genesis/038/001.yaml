translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘దిగి వెళ్లి’ భౌగోళిక దిశాభావాన్ని నిలుపుతుంది; ‘అదుల్లామీయుడు’ ప్రాంతీయ గుర్తింపును సంక్షిప్తంగా అందిస్తుంది. అన్ని పాదసూచిక గుర్తులు ప్రధాన వచనంలో చేర్చబడ్డాయి.
