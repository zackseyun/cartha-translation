source:
  edition: WLC
  text: וַֽ/יְהִי֙ בָּ/עֵ֣ת הַ/הִ֔וא וַ/יֵּ֥רֶד יְהוּדָ֖ה מֵ/אֵ֣ת אֶחָ֑י/ו וַ/יֵּ֛ט עַד אִ֥ישׁ עֲדֻלָּמִ֖י וּ/שְׁמ֥/וֹ חִירָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/001.yaml
  text: At that time Judah went down from his brothers and turned aside to a certain Adullamite whose name was Hirah[a][b].
translation:
  language: te
  text: ఆ సమయంలో యూదా తన సోదరుల దగ్గరనుంచి దిగి వెళ్లి, హీరా అనే ఒక అదుల్లామీయుని వైపుకు తిరిగాడు.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత అక్షరార్థంగా: “ఆ సమయంలో ఇలా జరిగింది.”'
    reason: lexical_alternative
  - marker: b
    text: లేదా “అదుల్లాముకు చెందిన ఒక వ్యక్తి”; హీబ్రూ పదబంధం అతని ప్రాంతీయ గుర్తింపును మాత్రమే తెలుపవచ్చు, అయితే ఒక నిర్దిష్ట వ్యక్తిని పరిచయం చేస్తున్నట్లుగానూ అర్థం కావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בָּעֵת הַהִוא
  choice: ఆ సమయంలో
  rationale: హీబ్రూ కథన సూత్రం కొత్త ఘట్టాన్ని ప్రారంభిస్తుంది. ‘ఆ సమయంలో’ కాలసంబంధాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; וַיְהִי అనే కథన సూచకాన్ని అతిగా అక్షరానువాదం చేయదు.
- source_word: וַיֵּרֶד
  choice: దిగి వెళ్లి
  rationale: ירד లోని దిగువకు వెళ్లే దిశాభావాన్ని సహజమైన తెలుగు కథన శైలిలో నిలుపుతుంది.
- source_word: מֵאֵת אֶחָיו
  choice: తన సోదరుల దగ్గరనుంచి
  rationale: యూదా తన సోదరులనుంచి వేరై వెళ్లాడనే భావాన్ని నేరుగా తెలియజేస్తూ, మూలంలోని పురుష సహోదర సంబంధాన్ని కాపాడుతుంది.
- source_word: וַיֵּט עַד
  choice: దగ్గరికి వెళ్లాడు
  rationale: ఈ సందర్భంలో נטה ... עד ఒక వ్యక్తి వైపు మళ్లి అతని వద్దకు వెళ్లడాన్ని సూచిస్తుంది. తెలుగులో ‘దగ్గరికి వెళ్లాడు’ సహజంగా ఉండి గమ్యభావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: אִישׁ עֲדֻלָּמִי
  choice: ఒక అదుల్లామీయుని
  rationale: అతడు అదుల్లాము ప్రాంతానికి చెందినవాడని తెలిపే గుర్తింపును కాపాడుతుంది. ‘ఒక’ అనేది కథలో నిర్దిష్ట వ్యక్తిని పరిచయం చేసే అవకాశాన్ని కూడా సహజంగా ప్రతిబింబిస్తుంది.
- source_word: וּשְׁמוֹ חִירָה
  choice: హీరా అనే
  rationale: ‘అతని పేరు హీరా’ అనే నామకరణ ఉపవాక్యాన్ని సహజమైన తెలుగు విశేషణ నిర్మాణంలో కలుపుతుంది.
- source_word: חִירָה
  choice: హీరా
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించింది.
