  yaml_path: translation/ot/genesis/038/010.yaml
  text: What he did was evil in the sight of Yahweh, so he put him to death also.
translation:
  language: te
  text: అతడు చేసిన పని యాహ్వే దృష్టిలో దుష్టమైనది; కాబట్టి ఆయన అతణ్ణి కూడా చంపాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּרַע
  choice: చెడ్డది
  rationale: רעע యొక్క స్థితివాచక భావం ఆ కార్యంపై నైతిక తీర్పును తెలియజేస్తుంది. ‘చెడ్డది’ అనేది దానిని మృదువుపరచకుండా సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בְּעֵינֵי יְהוָה
  choice: యెహోవా దృష్టిలో
  rationale: అక్షరార్థంగా ‘యెహోవా కళ్లలో’ అనే హెబ్రీయ ఇడియమ్ దైవిక మదింపును సూచిస్తుంది; ‘దృష్టిలో’ తెలుగులో సహజంగా ఉండి ఆ భావాన్ని నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హెబ్రీయ మూలంలో ఉన్న దేవుని ప్రత్యేక నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో సుపరిచితమైన రూపంలో లిప్యంతరీకరించబడింది.
- source_word: אֲשֶׁר עָשָׂה
  choice: అతడు చేసినది
  rationale: ఈ సంబంధవాచక ఉపవాక్యం ముందటి సందర్భంలో ఓనాను చేసిన కార్యాన్ని సూచిస్తుంది; ఈ రూపం సంక్షిప్తంగా, సహజంగా ఉంది.
- source_word: וַיָּמֶת
  choice: ఆయన అతణ్ణి చంపాడు
  rationale: מות యొక్క హిఫీల్ రూపం కారణార్థకమైనది; యెహోవా అతని మరణానికి ప్రత్యక్ష కర్త అని స్పష్టంగా నిలుపుతుంది.
- source_word: גַּם אֹתוֹ
  choice: అతణ్ణి కూడా
  rationale: ముందు ఏరుకు జరిగిన తీర్పు ఓనానుకు కూడా జరిగిందనే అనుసంధానాన్ని ‘కూడా’ స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో ప్రత్యేక దైవనామం నేరుగా ఉంది. దాన్ని సాధారణ బిరుదుగా మార్చకుండా తెలుగులో స్థిరపడిన ‘యెహోవా’ రూపంతో అందించబడింది.
- issue: וַיָּמֶת లో దైవిక తీర్పు మరియు కర్తృత్వం
  choice: ఆయన అతణ్ణి కూడా చంపాడు
  alternative: అతడు కూడా చనిపోయేలా చేశాడు
  rationale: కారణార్థక క్రియ అతని మరణాన్ని యెహోవా చర్యగా పేర్కొంటుంది. ఎంపిక చేసిన పఠనం ఆ ప్రత్యక్ష కర్తృత్వాన్ని మృదువుపరచదు; ‘కూడా’ ముందటి తీర్పుతో సంబంధాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనప్పటికీ గంభీరమైన శైలి. అస్పష్టమైన సర్వనామాల స్థానంలో ‘అతడు/ఆయన’ భేదం ద్వారా ఓనాను మరియు యెహోవా స్పష్టంగా గుర్తించబడ్డారు.
