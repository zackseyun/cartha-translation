  yaml_path: translation/ot/genesis/038/017.yaml
  text: And he said[a], “I will send a young goat from the flock.” And she said, “If you will give a pledge until you send it.”
translation:
  language: te
  text: అతడు, “మందలోనుంచి ఒక మేకపిల్లను పంపిస్తాను” అన్నాడు. ఆమె, “నువ్వు దాన్ని పంపేంతవరకు పూచీగా ఏదైనా ఇస్తేనే” అంది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גְּדִי עִזִּים
  choice: ఒక మేకపిల్లను
  rationale: ఈ పదబంధం మేకలలోని చిన్నపిల్లను సూచిస్తుంది. ‘మేకపిల్ల’ ఆధునిక తెలుగులో సహజంగా, స్పష్టంగా ఉంది.
- source_word: מִן הַצֹּאן
  choice: మందలోనుంచి
  rationale: צֹאן ప్రధానంగా గొర్రెలు, మేకలు వంటి చిన్న పశువుల మందను సూచిస్తుంది. మేకపిల్ల అని ఇప్పటికే స్పష్టంగా ఉన్నందున ‘మందలోనుంచి’ సహజంగా ఉంటుంది.
- source_word: עֵרָבוֹן
  choice: పూచీగా
  rationale: వాగ్దానం నెరవేరేవరకు హామీగా ఉంచే వస్తువును ఈ నామవాచకం సూచిస్తుంది. సందర్భంలో ‘పూచీగా’ సంక్షిప్తంగా, సహజంగా ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: עַד שָׁלְחֶךָ
  choice: నువ్వు దాన్ని పంపేంతవరకు
  rationale: హీబ్రూ రూపం అక్షరార్థంగా ‘నువ్వు పంపేంతవరకు’ అని ఉంటుంది. సందర్భంలో పంపేది మేకపిల్ల కాబట్టి తెలుగులో అవసరమైన స్పష్టత కోసం ‘దాన్ని’ చేర్చబడింది.
- source_word: אִם תִּתֵּן
  choice: ఇస్తే
  rationale: తామారు పెట్టిన షరతును ఇది తెలియజేస్తుంది. హీబ్రూలోని అసంపూర్ణ షరతు వాక్య నిర్మాణాన్ని తెలుగులో ‘ఇస్తే’ నిలుపుతుంది.
- source_word: אָנֹכִי אֲשַׁלַּח
  choice: పంపిస్తాను
  rationale: స్వతంత్ర సర్వనామం స్వల్ప ఉద్ఘాటనను ఇస్తున్నా, తెలుగులో క్రియారూపమే కర్తను స్పష్టంగా చూపుతుంది; ‘నేనే’ అని అనవసరంగా బలపరచకుండా వాగ్దాన భావాన్ని సహజంగా అందిస్తుంది.
