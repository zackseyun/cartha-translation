translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. మూలంలోని షరతు వాక్యపు సంక్షిప్తతను ఉద్దేశపూర్వకంగా నిలిపి ఉంచాం.
