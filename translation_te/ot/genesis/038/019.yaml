  yaml_path: translation/ot/genesis/038/019.yaml
  text: Then she arose and went away[b][a], and she removed her veil from upon her and put on the garments of her widowhood.
translation:
  language: te
  text: అప్పుడు ఆమె లేచి వెళ్లిపోయింది. తన మీదున్న ముసుగును తీసివేసి, తన వితంతు వస్త్రాలను ధరించింది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתָּקָם וַתֵּלֶךְ
  choice: ఆమె లేచి వెళ్లిపోయింది
  rationale: కథన క్రమంలోని రెండు వరుస క్రియలను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; వెళ్లిపోయింది అనే రూపం అక్కడి నుంచి బయలుదేరిన భావాన్ని స్పష్టం చేస్తుంది.
- source_word: וַתָּסַר צְעִיפָהּ מֵעָלֶיהָ
  choice: తన మీదున్న ముసుగును తీసివేసి
  rationale: צָעִיףను సందర్భానుసారంగా ‘ముసుగు’గా అనువదించి, מֵעָלֶיהָలోని ‘తన మీద నుంచి’ అనే భావాన్ని సహజంగా ‘తన మీదున్న’ అని నిలిపింది.
- source_word: וַתִּלְבַּשׁ בִּגְדֵי אַלְמְנוּתָהּ
  choice: తన వితంతు వస్త్రాలను ధరించింది
  rationale: వైధవ్య స్థితికి సంబంధించిన వస్త్రాలు అనే హీబ్రూ నిర్మాణాన్ని సంక్షిప్తంగా, గౌరవప్రదంగా వ్యక్తం చేస్తుంది; మూలంలో లేని ‘మళ్లీ’ అనే పదాన్ని చేర్చలేదు.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా ఉండి, కథన గాంభీర్యాన్ని కాపాడింది. మూలంలోని చర్యల క్రమం యథాతథంగా నిలిపింది.
