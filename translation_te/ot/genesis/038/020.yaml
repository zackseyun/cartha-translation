  text: וַ/יִּשְׁלַ֨ח יְהוּדָ֜ה אֶת גְּדִ֣י הָֽ/עִזִּ֗ים בְּ/יַד֙ רֵעֵ֣/הוּ הָֽ/עֲדֻלָּמִ֔י לָ/קַ֥חַת הָ/עֵרָב֖וֹן מִ/יַּ֣ד הָ/אִשָּׁ֑ה וְ/לֹ֖א מְצָאָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/020.yaml
  text: Then Judah sent the young goat by the hand of his Adullamite friend to take back the pledge from the woman's hand[c][b][a], but he did not find her.
translation:
  language: te
  text: అప్పుడు యూదా ఆ స్త్రీ చేతిలోనుండి తాకట్టును తిరిగి తీసుకురావడానికి తన అదుల్లామీయ స్నేహితుని ద్వారా మేకపిల్లను పంపించాడు, కానీ అతడు ఆమెను కనుగొనలేదు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: అప్పుడు ... పంపించాడు
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది; ఆధునిక తెలుగు కథనంలో ‘అప్పుడు’ సహజంగా క్రమాన్ని తెలియజేస్తుంది.
- source_word: גְּדִי הָעִזִּים
  choice: మేకపిల్లను
  rationale: ఈ పదబంధం చిన్న మేకను సూచిస్తుంది; ‘మేకపిల్ల’ సహజమైన, స్పష్టమైన తెలుగు రూపం.
- source_word: בְּיַד רֵעֵהוּ הָעֲדֻלָּמִי
  choice: తన అదుల్లామీయ స్నేహితుని ద్వారా
  rationale: ‘చేతి ద్వారా’ అనే హీబ్రూ నుడికారం వ్యక్తి ద్వారా కార్యం చేయించడాన్ని సూచిస్తుంది; తెలుగులో ‘ద్వారా’ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: לָקַחַת
  choice: తిరిగి తీసుకురావడానికి
  rationale: ఇది ఉద్దేశాన్ని తెలిపే క్రియారూపం; సందర్భంలో యూదా ముందుగా ఇచ్చిన తాకట్టును తిరిగి పొందాలని పంపిస్తున్నాడు.
- source_word: הָעֵרָבוֹן
  choice: తాకట్టు వస్తువులను
  rationale: మునుపటి సందర్భంలో హామీగా ఉంచిన అనేక వస్తువులను ఈ ఏకవచన సమాహార పదం సూచిస్తుంది; తెలుగు పాఠకునికి ‘తాకట్టు వస్తువులు’ స్పష్టంగా ఉంటుంది.
- source_word: מִיַּד הָאִשָּׁה
  choice: ఆ స్త్రీ చేతిలోనుండి
  rationale: మూలంలోని ‘స్త్రీ చేతిలోనుండి’ అనే సాక్షాత్ రూపాన్ని నిలుపుతూ, ఆమె ఆధీనంలో ఉన్న వస్తువులను తీసుకోవడం అనే భావాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: וְלֹא מְצָאָהּ
  choice: అయితే అతనికి ఆమె కనిపించలేదు
  rationale: పంపిన కార్యం విఫలమైన వ్యత్యాసాన్ని ‘అయితే’ తెలియజేస్తుంది; ‘అతనికి ఆమె కనిపించలేదు’ ఆధునిక తెలుగులో సహజమైన ప్రయోగం.
