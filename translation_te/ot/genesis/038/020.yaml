  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. హీబ్రూ ‘చేతిలోనుండి’ రూపాన్ని ఈ సందర్భంలో నిలిపి, ఏజెన్సీని తెలిపే మొదటి בְיַד‌ను మాత్రం సహజమైన ‘ద్వారా’గా అనువదించాం.
