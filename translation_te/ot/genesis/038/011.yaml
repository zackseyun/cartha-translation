  text: וַ/יֹּ֣אמֶר יְהוּדָה֩ לְ/תָמָ֨ר כַּלָּת֜/וֹ שְׁבִ֧י אַלְמָנָ֣ה בֵית אָבִ֗י/ךְ עַד יִגְדַּל֙ שֵׁלָ֣ה בְנִ֔/י כִּ֣י אָמַ֔ר פֶּן יָמ֥וּת גַּם ה֖וּא כְּ/אֶחָ֑י/ו וַ/תֵּ֣לֶךְ תָּמָ֔ר וַ/תֵּ֖שֶׁב בֵּ֥ית אָבִֽי/הָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/011.yaml
  text: Then Judah said to Tamar his daughter-in-law[a], “Remain a widow in your father’s house until my son Shelah grows up,” for he said, “Lest he also die like his brothers.” So Tamar went and lived in her father’s house.
translation:
  language: te
  text: 'అప్పుడు యూదా తన కోడలైన తామారుతో, “నా కుమారుడు షేలా పెద్దవాడయ్యే వరకు నీ తండ్రి ఇంట్లో విధవరాలిగా ఉండు” అన్నాడు. ఎందుకంటే, “తన అన్నలవలె ఇతడు కూడా చనిపోతాడేమో” అని అతడు అనుకున్నాడు[a]. కాబట్టి తామారు వెళ్లి తన తండ్రి ఇంట్లో నివసించింది.


    [a] హీబ్రూలో అక్షరార్థంగా “అన్నాడు.” ఇక్కడ అది మనసులో అనుకోవడాన్ని సూచించవచ్చు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా “అన్నాడు.” ఇక్కడ అది మనసులో అనుకోవడాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁבִי אַלְמָנָה
  choice: విధవరాలిగా ఉండు
  rationale: ఆజ్ఞారూపంలోని שְׁבִי నివసించడం లేదా ఒక స్థితిలో కొనసాగడాన్ని సూచిస్తుంది; אַלְמָנָה ఆమె విధవ స్థితిని తెలియజేస్తుంది. ఈ రెండింటినీ సహజమైన ఆధునిక తెలుగులో కలిపి ఇచ్చాం.
- source_word: בֵית אָבִיךְ
  choice: నీ తండ్రి ఇంట్లో
  rationale: తండ్రి గృహంలో నివాసముండే భావాన్ని సహజంగా, మూలానికి దగ్గరగా వ్యక్తం చేస్తుంది.
- source_word: עַד יִגְדַּל שֵׁלָה בְנִי
  choice: నా కుమారుడు షేలా పెద్దవాడయ్యే వరకు
  rationale: יִגְדַּל ఇక్కడ వివాహ వయస్సుకు ఎదగడాన్ని సందర్భానుసారంగా సూచిస్తుంది; అదనపు వివరణను చేర్చకుండా ‘పెద్దవాడయ్యే’ అని అనువదించాం.
- source_word: כִּי אָמַר
  choice: ఎందుకంటే ... అని అతడు అనుకున్నాడు
  rationale: כִּי కారణాన్ని పరిచయం చేస్తుంది. אָמַר అక్షరార్థంగా ‘అన్నాడు’ అయినా, సందర్భంలో అంతరంగ ఆలోచనను పరిచయం చేయగలదు; ఈ భేదాన్ని పాదసూచికలో నిలిపాం.
- source_word: פֶּן יָמוּת גַּם הוּא
  choice: ఇతడు కూడా చనిపోతాడేమో
  rationale: פֶּן భయపడుతున్న లేదా నివారించదలచిన సంభావ్య ఫలితాన్ని సూచిస్తుంది; ‘చనిపోతాడేమో’ తెలుగులో ఆ ఆందోళనను సహజంగా తెలియజేస్తుంది.
- source_word: כְּאֶחָיו
  choice: తన అన్నలవలె
  rationale: షేలా సోదరులైన ఏరు, ఓనాను అతనికంటే పెద్దవారు కాబట్టి ‘అన్నలు’ సందర్భానికి సహజంగా సరిపోతుంది; పోలికను యథాతథంగా ఉంచుతుంది.
- source_word: וַתֵּשֶׁב בֵּית אָבִיהָ
  choice: తన తండ్రి ఇంట్లో నివసించింది
  rationale: స్థిరంగా అక్కడ ఉండడాన్ని וַתֵּשֶׁב సూచిస్తుంది; ‘నివసించింది’ కథన తెలుగులో సహజంగా ఉంది.
- source_word: כַּלָּתוֹ
  choice: తన కోడలైన
  rationale: ఈ సందర్భంలోని బంధుత్వ పదానికి సాధారణ, స్పష్టమైన తెలుగు సమానం.
theological_decisions:
- issue: యూదా మాటగా పలికాడా లేక మనసులో అనుకున్నాడా
  choice: ప్రధాన పాఠ్యంలో ‘అనుకున్నాడు’
  alternative: ‘అన్నాడు’
  rationale: హీబ్రూ אָמַר సాధారణంగా ‘అన్నాడు’ అని అర్థమైనా, ఇలాంటి కారణవాక్యంలో అంతరంగ ఉద్దేశాన్ని పరిచయం చేయవచ్చు. సందర్భంలో ఇది తామారుకు చెప్పిన మాటకన్నా యూదా భయాన్ని తెలియజేస్తుంది; అక్షరార్థ ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చి అస్పష్టతను కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘విధవరాలిగా ఉండు,’ ‘పెద్దవాడయ్యే వరకు,’ ‘చనిపోతాడేమో’ వంటి రూపాలు మూలార్థాన్ని సాధారణ పాఠకులకు స్పష్టంగా తెలియజేస్తాయి.
