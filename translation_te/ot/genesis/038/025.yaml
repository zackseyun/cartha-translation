  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనా సులభంగా అర్థమయ్యే కథనశైలి. ‘మామ’ను సందర్భం స్పష్టపరుస్తుంది. మూలంలోని ‘ఈ’ అనే సూచనను మూడు వస్తువుల ముందూ ఉంచి, అవి ప్రత్యక్ష సాక్ష్యాలుగా చూపబడుతున్న భావాన్ని నిలిపాం.
