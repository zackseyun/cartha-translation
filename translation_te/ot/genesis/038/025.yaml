  text: As she was being brought out[a], she sent word to her father-in-law, saying, “I am pregnant by the man to whom these belong.” And she said, “Please identify whose signet ring, cords, and staff these are.”
translation:
  language: te
  text: 'ఆమెను బయటికి తీసుకువెళ్తుండగా, ఆమె తన మామగారికి కబురు పంపి ఇలా చెప్పింది: “ఈ వస్తువులు ఎవరివో, ఆ మనిషివల్ల నేను గర్భవతినయ్యాను.” ఆమె ఇంకా, “ఈ ముద్ర, దారాలు, చేతికర్ర ఎవరివో దయచేసి గుర్తించండి[a]” అంది.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “దయచేసి నిర్ధారించండి.” హెబ్రీ క్రియకు గుర్తుపట్టడం లేదా గుర్తింపును నిర్ధారించడం అనే అర్థాలు ఉండవచ్చు; ఇక్కడ ఎదురుగా ఉన్న సాక్ష్యాల యజమానిని గుర్తించమనే సూటైన సవాలు ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: מוּצֵאת
  choice: బయటికి తీసుకువెళ్తుండగా
  rationale: יצא యొక్క హోఫాల్ కర్మణి అసమాపక రూపం; శిక్ష అమలు కోసం ఆమెను బయటికి తీసుకువెళ్తున్న కొనసాగుతున్న చర్యను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: שָׁלְחָה אֶל־חָמִיהָ
  choice: తన మామకు కబురు పంపిస్తూ
  rationale: శబ్దార్థంగా ‘పంపింది’; తరువాతి సందేశాన్ని దృష్టిలో ఉంచుకొని ‘కబురు పంపింది’ అనే భావం సహజం. חָמִיהָ ఇక్కడ భర్త తండ్రిని సూచించే ‘మామ’.
- source_word: לְאִישׁ אֲשֶׁר־אֵלֶּה לּוֹ אָנֹכִי הָרָה
  choice: ఇవి ఎవరివో, ఆ వ్యక్తివల్లనే నేను గర్భవతినయ్యాను
  rationale: వస్తువుల యజమానినే గర్భానికి కారణమైన పురుషునిగా చూపే హెబ్రీ నిర్మాణాన్ని స్పష్టంగా, సహజంగా అందిస్తుంది; אָנֹכִי లోని ఉద్ఘాటనను ‘నేను’ ద్వారా నిలుపుతుంది.
- source_word: הַכֶּר־נָא
  choice: దయచేసి గుర్తించండి
  rationale: נכר క్రియకు ‘గుర్తించు/గుర్తుపట్టు’ అనే అర్థం ఉంది; נָא లోని వినయపూర్వక విజ్ఞప్తిని ‘దయచేసి’ వ్యక్తం చేస్తుంది. సందర్భంలో ఇది సాక్ష్యాన్ని పరిశీలించి యజమానిని నిర్ధారించమనే సవాలుగా కూడా పనిచేస్తుంది.
- source_word: חֹתֶמֶת
  choice: ముద్ర
  rationale: వ్యక్తిగత గుర్తింపుకు, ముద్ర వేయడానికి ఉపయోగించే seal/signet‌ను సూచిస్తుంది. మూలపదం తప్పనిసరిగా ఉంగర ఆకారాన్ని నిర్దేశించదు కాబట్టి ‘ముద్ర’ను ఎంచుకున్నాం.
- source_word: פְּתִילִים
  choice: దారాలు
  rationale: బహువచన రూపాన్ని నిలుపుతూ, ముద్రకు సంబంధించిన తాళ్లు లేదా దారాలను సాధారణ ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: מַטֶּה
  choice: చేతికర్ర
  rationale: వ్యక్తి వెంట తీసుకెళ్లే staff‌ను ordinary modern Teluguలో స్పష్టంగా సూచిస్తుంది; ‘దండం’తో కలిగే అధికార లేదా శిక్షార్థ ఛాయను అనవసరంగా రానివ్వదు.
