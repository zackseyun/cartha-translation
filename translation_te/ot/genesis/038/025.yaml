  to: 'ఆమెను బయటికి తీసుకువెళ్తుండగా, ఆమె తన మామగారికి కబురు పంపి ఇలా చెప్పింది: “ఈ వస్తువులు ఎవరివో, ఆ మనిషివల్ల నేను గర్భవతినయ్యాను.” ఆమె ఇంకా, “ఈ ముద్ర, దారాలు, చేతికర్ర ఎవరివో దయచేసి గుర్తించండి[a]” అంది.'
