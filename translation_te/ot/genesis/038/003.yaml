base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/003.yaml
  text: She conceived and bore a son[a], and he called his name Er.
translation:
  language: te
  text: ఆమె గర్భవతియై ఒక కుమారుణ్ణి కనింది; అతడు అతనికి ఏరు అని పేరు పెట్టాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీయ పాఠంలో ‘పేరు పెట్టాడు’ అనే క్రియ పుంలింగ ఏకవచనంలో ఉంది; దాని కర్త సహజంగా యూదా.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתַּהַר
  choice: ఆమె గర్భవతియై
  rationale: הרה గర్భం ధరించడం లేదా గర్భవతి కావడం అనే భావాన్ని ఇస్తుంది. ఆధునిక తెలుగులో ‘గర్భవతియై’ సంక్షిప్తంగా, గౌరవప్రదమైన కథన శైలిలో సహజంగా ఉంటుంది.
- source_word: וַתֵּלֶד בֵּן
  choice: ఒక కుమారుణ్ణి కనింది
  rationale: ילד Qal రూపం ఇక్కడ ప్రసవించడాన్ని సూచిస్తుంది; בֵּן కుటుంబ సంబంధాన్ని తెలిపే ‘కుమారుడు’. ‘ఒక కుమారుణ్ణి కనింది’ సహజమైన తెలుగు కథన ప్రయోగం.
- source_word: וַיִּקְרָא אֶת־שְׁמוֹ
  choice: అతడు అతనికి ... అని పేరు పెట్టాడు
  rationale: క్రియ పుంలింగ ఏకవచనంలో ఉన్నందున కర్తను ‘అతడు’గా నిలుపుతుంది. హెబ్రీయ భాషలోని ‘అతని పేరు పిలిచాడు’ అనే నిర్మాణాన్ని తెలుగులో సహజంగా ‘అతనికి ... అని పేరు పెట్టాడు’గా వ్యక్తం చేసింది.
- source_word: עֵר
  choice: ఏరు
  rationale: హెబ్రీయ వ్యక్తినామాన్ని తెలుగు ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించింది.
theological_decisions:
- issue: וַיִּקְרָא (‘పేరు పెట్టాడు’) అనే క్రియకు కర్త
  choice: పుంలింగ ఏకవచనాన్ని అనుసరించి ‘అతడు’ అని అనువదించడం; సందర్భంలో ఇది సహజంగా యూదాను సూచిస్తుంది.
  alternative: కొన్ని అనువాదాలు ముందు ఉన్న స్త్రీలింగ క్రియలకు అనుగుణంగా ‘ఆమె పేరు పెట్టింది’ అని సవరించవచ్చు, లేదా కర్తను పేర్కొనకుండా ‘అతనికి ఏరు అనే పేరు పెట్టబడింది’ అని ఇవ్వవచ్చు.
  rationale: మూల హెబ్రీయ పాఠంలో ‘గర్భవతియైంది’, ‘కనింది’ అనే స్త్రీలింగ క్రియల తరువాత పేరు పెట్టే క్రియ స్పష్టంగా పుంలింగ ఏకవచనంలో ఉంది. ఆ వ్యాకరణ మార్పును సమన్వయపరచకుండా నిలుపుకోవడం మూలభాషకు నిబద్ధమైనది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘గర్భవతియై’, ‘కుమారుణ్ణి కనింది’, ‘పేరు పెట్టాడు’ వంటి సాధారణంగా అర్థమయ్యే పదబంధాలు వాడబడ్డాయి; మూలంలోని కర్త మార్పు పాదసూచికతో స్పష్టం చేయబడింది.
