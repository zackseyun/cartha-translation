  text: ఆమె మళ్లీ గర్భవతియై ఒక కుమారుణ్ణి కన్నది. అతనికి ఓనాను అని పేరు పెట్టింది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתַּהַר
  choice: ఆమె గర్భవతియై
  rationale: హీబ్రూ הרה గర్భం ధరించడాన్ని సూచిస్తుంది. ఆధునిక ప్రామాణిక తెలుగులో ‘గర్భవతియై’ సహజంగా, గౌరవప్రదంగా ఉంది.
- source_word: עוֹד
  choice: మళ్లీ
  rationale: ఈ జనన పరంపరలో עוֹד కొనసాగింపుకన్నా పునరావృతిని సూచిస్తుంది.
- source_word: וַתֵּלֶד בֵּן
  choice: ఒక కుమారుణ్ణి కన్నది
  rationale: ילד + בֵּן అనే ప్రసవ సంబంధ హీబ్రూ ప్రయోగాన్ని సంక్షిప్తమైన, సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וַתִּקְרָא אֶת־שְׁמוֹ
  choice: అతనికి … అని పేరు పెట్టింది
  rationale: ‘అతని పేరును పిలిచింది’ అనే హీబ్రూ నుడికారానికి ఆధునిక తెలుగులో సహజమైన సమానార్థక ప్రయోగం.
- source_word: אוֹנָן
  choice: ఓనాను
  rationale: వ్యక్తి పేరును తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించబడింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండే, గౌరవప్రదమైన కథన శైలి. మూలంలోని సంక్షిప్త సంఘటనల క్రమాన్ని రెండు సహజ తెలుగు వాక్యాల్లో అందించింది.
