translation:
  language: te
  text: ఆమె ప్రసవించే సమయం వచ్చినప్పుడు, ఇదిగో, ఆమె గర్భంలో కవలలు ఉన్నారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי בְּעֵת
  choice: సమయం వచ్చినప్పుడు
  rationale: కథనంలోని తదుపరి సంఘటనకు మార్పును, కాలసూచనను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; మూలంలో లేని ప్రత్యేకమైన ‘ఇప్పుడు’ అనే పదాన్ని చేర్చదు.
- source_word: לִדְתָּהּ
  choice: ఆమె ప్రసవించే
  rationale: ילד ధాతువు నుంచి వచ్చిన ఈ రూపం ‘ఆమె ప్రసవించడం’ అనే అర్థాన్ని ఇస్తుంది; ‘ప్రసవించే’ అనేది సందర్భానికి తగిన స్పష్టమైన తెలుగు.
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: గమనార్హమైన, ఆశ్చర్యకరమైన విషయంపై దృష్టి నిలిపే హీబ్రూ సంభాషణా బలాన్ని నిలుపుతుంది.
- source_word: תְאוֹמִים
  choice: కవలలు
  rationale: ఈ బహువచన నామవాచకం నేరుగా కవలలను సూచిస్తుంది.
- source_word: בְּבִטְנָהּ
  choice: ఆమె గర్భంలో
  rationale: בֶּטֶן అనే పదానికి ‘కడుపు’ లేదా ‘గర్భం’ అనే అర్థాలు ఉండవచ్చు; ప్రసవ సందర్భంలో ‘గర్భం’ అత్యంత సహజమైనది, ఖచ్చితమైనది.
