revisions:
- from: అతడు ఆమె ఉన్న ప్రాంతపు మనుషులను అడుగుతూ, “దారి పక్కన ఏనయిములో ఉన్న ఆ ఆరాధనా వ్యభిచారిణి[a] ఎక్కడ?” అన్నాడు. వారు, “ఇక్కడ ఆరాధనా వ్యభిచారిణి ఎవరూ ఉండలేదు” అన్నారు.[b]
  to: 'అతడు ఆ స్థలపు మనుషులను ఇలా అడిగాడు: “దారి పక్కన ఏనయిములో[b] ఉన్న ఆ ఆరాధనా వేశ్య[a] ఎక్కడ ఉంది?” వారు, “ఈ చోట ఆరాధనా వేశ్య ఉండలేదు,” అన్నారు.'
  rationale: The revision removes an unwarranted specification concerning the woman’s location, improves Telugu narrative flow, uses a more natural term for the cultically associated prostitute, and moves the place-name footnote marker to its proper anchor. It does not resolve beyond the text the historical question of a specific temple or cultic institution.
