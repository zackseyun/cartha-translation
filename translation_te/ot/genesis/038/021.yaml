source:
  edition: WLC
  text: וַ/יִּשְׁאַ֞ל אֶת אַנְשֵׁ֤י מְקֹמָ/הּ֙ לֵ/אמֹ֔ר אַיֵּ֧ה הַ/קְּדֵשָׁ֛ה הִ֥וא בָ/עֵינַ֖יִם עַל הַ/דָּ֑רֶךְ וַ/יֹּ֣אמְר֔וּ לֹא הָיְתָ֥ה בָ/זֶ֖ה קְדֵשָֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/021.yaml
  text: He asked the men of her place[a], saying, “Where is the cult prostitute who was at Enaim by the road?” But they said[b], “There has been no cult prostitute here.”
translation:
  language: te
  text: 'అతడు ఆ స్థలపు మనుషులను ఇలా అడిగాడు: “దారి పక్కన ఏనయిములో[b] ఉన్న ఆ ఆరాధనా వేశ్య[a] ఎక్కడ ఉంది?” వారు, “ఈ చోట ఆరాధనా వేశ్య ఉండలేదు,” అన్నారు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆలయ వేశ్య.” హీబ్రూ పదం ఆరాధనా ఆచారాలతో సంబంధమున్న వేశ్యను సూచిస్తుంది; అయితే ఇక్కడ నిర్దిష్టమైన ఆలయ భవనం ప్రస్తావించబడలేదు.
    reason: lexical_alternative
  - marker: b
    text: “ఏనయిము” ఒక స్థలనామం. దాని హీబ్రూ రూపానికి “కళ్లు” అనే పదంతో, లేదా బహుశా “ఊటలు” అనే భావంతో సంబంధం ఉంది.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁאַל
  choice: అడుగుతూ
  rationale: שׁאל అనే సాధారణ ప్రశ్నార్థక క్రియను సహజమైన తెలుగు కథన శైలిలో అందిస్తుంది; తరువాతి לֵאמֹרతో కలిసి ప్రత్యక్ష ప్రశ్నను పరిచయం చేస్తుంది.
- source_word: אַנְשֵׁי מְקֹמָהּ
  choice: ఆమె ఉన్న ప్రాంతపు మనుషులను
  rationale: అక్షరార్థమైన ‘ఆమె స్థలపు మనుషులు’ తెలుగులో అసహజంగా ఉంటుంది. స్త్రీలింగ ఏకవచన ప్రత్యయాన్ని పూర్తిగా తొలగించకుండా, ఆ స్త్రీతో సంబంధమున్న ప్రదేశంలోని స్థానికులను సూచించేలా అనువదించబడింది.
- source_word: הַקְּדֵשָׁה
  choice: ఆరాధనా వ్యభిచారిణి
  rationale: קְדֵשָׁה సాధారణ వేశ్యను మాత్రమే కాక ఆరాధనా ఆచారంతో సంబంధమున్న స్త్రీని సూచిస్తుంది. ‘ఆలయ’ అని అనడం వచనంలో లేని నిర్దిష్ట భవనాన్ని ఊహింపజేయవచ్చు; ‘ఆరాధనా’ అనే పదం విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: בָעֵינַיִם
  choice: ఏనయిములో
  rationale: సందర్భంలో ఇది స్థలనామంగా పనిచేస్తుంది (ఆది 38:14); అందువల్ల ‘కళ్లు’ లేదా ‘ఊటలు’ అని అనువదించకుండా లిప్యంతరీకరించబడింది.
- source_word: עַל הַדָּרֶךְ
  choice: దారి పక్కన
  rationale: ఈ సందర్భంలో עַל הַדָּרֶךְ రహదారికి ఆనుకొని ఉన్న స్థానాన్ని సూచిస్తుంది; ‘దారి పక్కన’ సహజమైన ఆధునిక తెలుగు.
- source_word: לֹא הָיְתָה בָזֶה קְדֵשָׁה
  choice: ఇక్కడ ఆరాధనా వ్యభిచారిణి ఎవరూ ఉండలేదు
  rationale: ఆ ప్రదేశంలో అలాంటి స్త్రీ ఉనికిని స్థానికులు నిరాకరించిన భావాన్ని సహజమైన తెలుగు సంభాషణలో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: קְדֵשָׁה యొక్క ఆరాధనా సంబంధ భావం
  choice: ఆరాధనా వ్యభిచారిణి
  alternative: ఆలయ వ్యభిచారిణి; వేశ్య
  rationale: మూలపదాన్ని సాధారణ זֹנָהతో కలిపివేయకుండా దాని ఆరాధనా సంబంధాన్ని నిలుపుతుంది; అదే సమయంలో నిర్దిష్ట ఆలయ నిర్మాణం ఉన్నట్లు వచనానికి మించి చెప్పదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి వాడబడింది. మూలంలోని ఆరాధనా సంబంధ పదభేదం నిలుపబడింది; స్థలనామం అనువదించకుండా తెలుగు లిపిలో ఇవ్వబడింది. రెండు పాదసూచిక గుర్తులూ ప్రధాన వచనంలో చేర్చబడ్డాయి.
