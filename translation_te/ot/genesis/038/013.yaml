translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, కథనానికి తగిన సరళమైన గౌరవప్రద శైలి వాడబడింది. మూలంలోని నిష్క్రియ నివేదిక, ప్రత్యక్ష వాక్య పరిచయం, ప్రయాణ దిశాభావం నిలుపబడ్డాయి.
