  text: And Tamar was told[a], saying, “Look, your father-in-law is going up to Timnah to shear his sheep.”
translation:
  language: te
  text: 'తామారుకు ఇలా చెప్పబడింది: “ఇదిగో, నీ మామ తన గొర్రెల బొచ్చు కత్తిరించడానికి తిమ్నాకు ఎక్కి వెళ్తున్నాడు.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֻּגַּד לְתָמָר
  choice: తామారుకు ఇలా చెప్పబడింది
  rationale: నגד్ క్రియ యొక్క హొఫాల్ రూపం నివేదికను నిష్క్రియార్థంలో తెలియజేస్తుంది; לְתָמָר ఆ సమాచారాన్ని అందుకున్న వ్యక్తిని సూచిస్తుంది. తెలుగు నిష్క్రియ నిర్మాణం మూలంలోని నివేదిక ధోరణిని నిలుపుతుంది.
- source_word: לֵאמֹר
  choice: ఇలా
  rationale: ప్రత్యక్ష మాటలను పరిచయం చేసే హెబ్రీయ సంప్రదాయ సూత్రాన్ని సహజమైన తెలుగు వాక్యనిర్మాణంలో ‘ఇలా’తో చూపించాం.
- source_word: הִנֵּה
  choice: ఇదిగో
  rationale: వినేవారి దృష్టిని రాబోయే సమాచారంపై నిలిపే ఉద్ఘాటనను ఆధునికమైనప్పటికీ గౌరవప్రదమైన తెలుగులో నిలుపుతుంది.
- source_word: חָמִיךְ
  choice: నీ మామ
  rationale: స్త్రీలింగ ఏకవచన సంబోధన తామారును ఉద్దేశిస్తుంది; సందర్భంలో ఈ బంధుత్వపదం మామను, అంటే భర్త తండ్రిని, సూచిస్తుంది.
- source_word: עֹלֶה תִמְנָתָה
  choice: తిమ్నాకు ఎక్కి వెళ్తున్నాడు
  rationale: కర్తరి వర్తమాన కృదంతం జరుగబోయే లేదా సాగుతున్న ప్రయాణాన్ని సూచిస్తుంది; עלה లోని పైకి వెళ్లే దిశాభావాన్ని ‘ఎక్కి’ నిలుపగా, దిశార్థక ה ను ‘తిమ్నాకు’గా సహజంగా అనువదించాం.
- source_word: לָגֹז צֹאנוֹ
  choice: తన గొర్రెలకు బొచ్చు కత్తిరించడానికి
  rationale: ל తో కూడిన క్రియానామం ప్రయోజనాన్ని సూచిస్తుంది. צאן చిన్న పశువుల మందను సూచించగలిగినా, బొచ్చు కత్తిరించే సందర్భంలో ‘గొర్రెలు’ సహజమైన నిర్దిష్ట అర్థం.
