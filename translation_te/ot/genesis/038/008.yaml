id: GEN.38.8
reference: Genesis 38:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוּדָה֙ לְ/אוֹנָ֔ן בֹּ֛א אֶל אֵ֥שֶׁת אָחִ֖י/ךָ וְ/יַבֵּ֣ם אֹתָ֑/הּ וְ/הָקֵ֥ם זֶ֖רַע לְ/אָחִֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/008.yaml
  text: Then Judah said to Onan[a], “Go in to your brother’s wife, perform the duty of a brother-in-law to her, and raise up offspring for your brother.”
translation:
  language: te
  text: అప్పుడు యూదా ఓనానుతో, “నీ అన్న భార్య దగ్గరికి వెళ్లి, ఆమెకు భర్త సోదరునిగా నీ కర్తవ్యాన్ని నెరవేర్చి[a], నీ అన్న కోసం సంతానాన్ని కలిగించు” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత సాంకేతికంగా, “ఆమె పట్ల లేవిరేట్ కర్తవ్యాన్ని నెరవేర్చి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... అన్నాడు
  rationale: వావ్-క్రమరూపం కథనాన్ని ముందుకు నడిపిస్తుంది; ఆధునిక తెలుగు కథన ప్రవాహంలో ‘అప్పుడు’ సహజంగా క్రమాన్ని తెలియజేస్తుంది.
- source_word: יְהוּדָה
  choice: యూదా
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: בֹּא אֶל
  choice: దగ్గరికి వెళ్లి
  rationale: ఈ హెబ్రీ ఇడియమ్ వివాహ సంబంధ సందర్భంలో లైంగిక సంయోగాన్ని సూచిస్తుంది. తెలుగు పాఠకులకు అర్థమయ్యేలా ఉండి, మూలంలోని మర్యాదపూర్వక పరోక్షతను కూడా నిలుపుతుంది.
- source_word: אֵשֶׁת אָחִיךָ
  choice: నీ అన్న భార్య
  rationale: సందర్భంలో మరణించిన ఏరు ఓనానుకు అన్న; అందువల్ల సాధారణ ‘సోదరుడు’ కంటే ‘అన్న’ సహజంగా, నిర్దిష్టంగా ఉంది.
- source_word: וְיַבֵּם אֹתָהּ
  choice: ఆమె పట్ల మరిది ధర్మాన్ని నిర్వర్తించి
  rationale: יִבֵּם అనేది మరణించిన అన్న భార్య పట్ల మరిది నెరవేర్చవలసిన కుటుంబ బాధ్యతను సూచించే సాంకేతిక క్రియ. ‘మరిది ధర్మం’ వివాహం లేదా శారీరక సంబంధం ఒక్కటిగా భావాన్ని కుదించకుండా బాధ్యతను వ్యక్తం చేస్తుంది.
- source_word: וְהָקֵם
  choice: కలిగించు
  rationale: זֶרַעతో కలిసి ఈ క్రియ మరణించిన సోదరుని వంశాన్ని కొనసాగించేందుకు సంతానాన్ని కలిగించడాన్ని సూచిస్తుంది; తెలుగులో ఇది సహజమైన ప్రయోగం.
- source_word: זֶרַע
  choice: సంతానం
  rationale: ఇక్కడ ‘విత్తనం’ అనే అక్షరార్థం కంటే, పుట్టబోయే వారసుడిని లేదా సంతతిని స్పష్టంగా సూచించే సహజ తెలుగు పదం.
- source_word: לְאָחִיךָ
  choice: నీ అన్న కోసం
  rationale: לְ ఇక్కడ ప్రయోజనం లేదా ఎవరి పేరున సంతానం లెక్కించబడుతుందో సూచిస్తుంది; ‘కోసం’ ఆ భావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
theological_decisions:
- issue: లేవిరేట్ వివాహ బాధ్యతను తరువాతి చట్టపరమైన లేదా మతపరమైన వివరణలతో విస్తరించకుండా అనువదించడం
  choice: ఆమె పట్ల మరిది ధర్మాన్ని నిర్వర్తించి
  alternative: ఆమెను మరిదిగా వివాహం చేసుకొని / ఆమె పట్ల లేవిరేట్ బాధ్యతను నిర్వర్తించి
  rationale: మూలంలోని יִבֵּם కుటుంబ-వంశ పరిరక్షణకు సంబంధించిన ప్రత్యేక బాధ్యతను సూచిస్తుంది. ఎంపిక చేసిన పదబంధం దానిని కేవలం వివాహంగా గానీ, కేవలం లైంగిక సంయోగంగా గానీ కుదించకుండా, సాధారణ పాఠకునికి అర్థమయ్యేలా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘దగ్గరికి వెళ్లి’ మూలంలోని లైంగిక ఇడియమ్ పరోక్షతను నిలుపుతుంది; ‘మరిది ధర్మం’ సాంకేతిక కుటుంబ బాధ్యతను సాధారణ పాఠకునికి అందుబాటులో ఉంచుతుంది.
