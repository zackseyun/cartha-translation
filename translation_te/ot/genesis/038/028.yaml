  yaml_path: translation/ot/genesis/038/028.yaml
  text: And when she was giving birth[a], he put out a hand, and the midwife took it and tied a scarlet thread on his hand, saying[c][b], “This one came out first.”
translation:
  language: te
  text: ఆమె ప్రసవిస్తున్నప్పుడు, ఒక బిడ్డ తన చేయి బయటికి చాచాడు.[a] మంత్రసాని ఆ చేయి పట్టుకొని, అతని చేతికి ఎర్రని దారం[b] కట్టి, “ఈ బిడ్డే మొదట బయటికి వచ్చాడు” అంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: పదశః, “ఒకడు చెయ్యి ఇచ్చాడు.” ఇది ప్రసవ సమయంలో బిడ్డ చెయ్యి బయటికి రావడాన్ని తెలిపే హెబ్రీ నుడికారం.
    reason: lexical_alternative
  - marker: b
    text: కవలల్లో మొదట కనిపించిన బిడ్డను తరువాత గుర్తించడానికి ఈ ఎర్రని దారాన్ని గుర్తుగా కట్టారు.
    reason: cultural_note
lexical_decisions:
- source_word: בְּלִדְתָּהּ
  choice: ఆమె ప్రసవిస్తున్నప్పుడు
  rationale: בְּ + ילד ధాతువు యొక్క infinitive construct, 3వ పురుష ఏకవచన స్త్రీలింగ ప్రత్యయంతో కలిసి ప్రసవం జరుగుతున్న కాలాన్ని సూచిస్తుంది. ఈ తెలుగు రూపం ఆ కొనసాగుతున్న సందర్భాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וַיִּתֶּן יָד
  choice: ఒక బిడ్డ చెయ్యి బయటికి చాచాడు
  rationale: పదశః ‘చెయ్యి ఇచ్చాడు’ అనే హెబ్రీ నుడికారం ప్రసవ సమయంలో బిడ్డ చెయ్యి బయటికి రావడాన్ని సూచిస్తుంది. ‘ఒక బిడ్డ’ అనడం ఇద్దరు కవలల్లో ఎవరో ఒకరనే అనిర్దిష్టతను నిలుపుతుంది; ‘బయటికి చాచాడు’ ఆధునిక తెలుగులో సహజంగా ఉంటుంది.
- source_word: הַמְיַלֶּדֶת
  choice: మంత్రసాని
  rationale: ילד ధాతువునుంచి వచ్చిన ఈ రూపం ప్రసవానికి సహాయం చేసే స్త్రీని సూచిస్తుంది. ‘మంత్రసాని’ ప్రామాణికమైన, సంక్షిప్త తెలుగు సమానార్థకం.
- source_word: וַתִּקְשֹׁר עַל יָדוֹ שָׁנִי
  choice: అతని చేతికి ఎర్రని దారం కట్టి
  rationale: שָׁנִי ఎర్రని వస్త్ర పదార్థాన్ని సూచిస్తుంది; సందర్భం ప్రకారం ‘దారం’ను స్పష్టంగా చేర్చడం సహజం. עַל יָדוֹ ఇక్కడ చేతికి కట్టడాన్ని సూచిస్తుంది.
- source_word: זֶה יָצָא רִאשֹׁנָה
  choice: ఈ బిడ్డే మొదట బయటికి వచ్చాడు
  rationale: זֶה నిర్దిష్ట బిడ్డను చూపుతుంది; רִאשֹׁנָה క్రియావిశేషణ భావంలో ‘మొదట’ అని అర్థం. ‘మొదట పుట్టినవాడు’ అని అనడం మూలంలో లేని జ్యేష్ఠత్వ హోదాను చేర్చే ప్రమాదం ఉంది.
theological_decisions:
- issue: మొదట బయటికి వచ్చిన బిడ్డను గుర్తించడం
  choice: ‘ఈ బిడ్డే మొదట బయటికి వచ్చాడు’ అనే మూల వాక్యాన్ని యథాతథ భావంతో ఉంచడం
  alternative: ‘ఇతడే మొదట పుట్టినవాడు’
  rationale: ఈ దశలో బయటికి వచ్చినది చెయ్యి మాత్రమే అయినప్పటికీ, మంత్రసాని పలికిన మాటను కథనం ఉద్దేశపూర్వకంగా అలాగే ఇస్తుంది. ‘మొదట పుట్టినవాడు’ అని మార్చితే జన్మహక్కు లేదా జ్యేష్ఠత్వ హోదాను ముందుగానే నిర్ధారించినట్లు అవుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన కథన శైలి వాడబడింది. ‘ఒక బిడ్డ’ మూలంలోని సందర్భానుగుణ అనిర్దిష్టతను నిలుపుతుంది; ‘మంత్రసాని’ ప్రసవ సహాయకురాలికి సహజమైన తెలుగు పదం.
