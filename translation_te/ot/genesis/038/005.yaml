source:
  edition: WLC
  text: וַ/תֹּ֤סֶף עוֹד֙ וַ/תֵּ֣לֶד בֵּ֔ן וַ/תִּקְרָ֥א אֶת שְׁמ֖/וֹ שֵׁלָ֑ה וְ/הָיָ֥ה בִ/כְזִ֖יב בְּ/לִדְתָּ֥/הּ אֹתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/005.yaml
  text: She conceived again and bore a son[a], and she called his name Shelah[b]. And he was at Chezib when she bore him.
translation:
  language: te
  text: ఆమె మళ్లీ గర్భం దాల్చి ఒక కుమారుణ్ణి కన్నది; అతనికి షేలా అని పేరు పెట్టింది. ఆమె అతణ్ణి కన్నప్పుడు అతడు కెజీబులో ఉన్నాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ పాఠంలో “అతడు” అని ఉంది; అది ఎవరిని సూచిస్తుందో స్పష్టంగా లేదు. కొన్ని ప్రాచీన పాఠసాక్ష్యాలు, వ్యాఖ్యానాల ప్రకారం: “ఆమె అతణ్ణి కన్నప్పుడు కెజీబులో ఉన్నది.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַתֹּסֶף עוֹד וַתֵּלֶד בֵּן
  choice: ఆమె మళ్లీ గర్భం దాల్చి ఒక కుమారుణ్ణి కన్నది
  rationale: יסף + עוד పునరావృత క్రియను సూచిస్తుంది; సందర్భం మరో గర్భధారణ-ప్రసవాన్ని సూచిస్తున్నందున సహజమైన ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తీకరించబడింది.
- source_word: וַתִּקְרָא אֶת־שְׁמוֹ שֵׁלָה
  choice: అతనికి షేలా అని పేరు పెట్టింది
  rationale: అక్షరార్థంగా ‘అతని పేరును పిలిచింది’ అయినా, తెలుగులో పేరు పెట్టడాన్ని సహజంగా తెలిపే సమానార్థక నిర్మాణం ఎంచుకోబడింది.
- source_word: וְהָיָה
  choice: అతడు ... ఉన్నాడు
  rationale: మసొరెటిక్ హీబ్రూ క్రియారూపం తృతీయ పురుష ఏకవచన పుంలింగంలో ఉంది; దాని వ్యాకరణ రూపాన్ని ప్రధాన పాఠ్యంలో నిలిపాం.
- source_word: בִכְזִיב
  choice: కజీబులో
  rationale: హీబ్రూ స్థలనామం כזיב ను ఆధునిక తెలుగు లిపిలో ధ్వన్యనుకరణ చేశాం.
- source_word: בְּלִדְתָּהּ אֹתוֹ
  choice: ఆమె అతణ్ణి కన్నప్పుడు
  rationale: ב + infinitive construct ఇచ్చే కాలార్థాన్ని సహజమైన తెలుగు ఉపవాక్యంతో వ్యక్తీకరించాం.
theological_decisions:
- issue: וְהָיָה అనే పుంలింగ క్రియకు కర్త ఎవరు?
  choice: ప్రధాన పాఠ్యంలో ‘అతడు’ అని ఉంచడం
  alternative: కొన్ని ప్రాచీన సాక్ష్యాల ప్రకారం ‘ఆమె కజీబులో ఉన్నది’
  rationale: MT పుంలింగ రూపాన్ని మార్చకుండా నిలిపి, సందర్భంలో కర్తపై ఉన్న నిజమైన అనిశ్చితిని పాదటిప్పణిలో తెలియజేశాం.
translation_notes:
  register: సహజమైన, గౌరవప్రదమైన ఆధునిక ప్రామాణిక తెలుగు. కథన ప్రవాహం కోసం ‘పేరు పెట్టింది’, ‘కన్నప్పుడు’ వంటి సాధారణ ప్రయోగాలు వాడబడ్డాయి; హీబ్రూ పుంలింగ కర్తలోని సందిగ్ధతను తొలగించలేదు.
