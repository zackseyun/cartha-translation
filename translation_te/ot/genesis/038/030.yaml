  yaml_path: translation/ot/genesis/038/030.yaml
  text: Afterward his brother came out[a], with the scarlet thread on his hand[b], and he called his name Zerah.
translation:
  language: te
  text: ఆ తరువాత, తన చేతిమీద ఎర్రని దారం[a] ఉన్న అతని సోదరుడు బయటికి వచ్చాడు. అతనికి “జెరహు” అని పేరు పెట్టాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, ‘అతని చేతిమీద ఎర్రనిది’ అని ఉంది. ‘దారం’ అనే పదం 28వ వచనంలోని తక్షణ సందర్భం నుంచి పూరించబడింది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘అతని పేరును జెరహు అని పిలిచాడు.’ హీబ్రూలో అక్షరార్థంగా, ‘అతని పేరును జెరహు అని పిలిచాడు’ అని ఉంది; పేరు పెట్టిన వ్యక్తి ఎవరో ఇక్కడ స్పష్టంగా చెప్పబడలేదు.
    reason: ambiguity
lexical_decisions:
- source_word: וְאַחַר
  choice: ఆ తర్వాత
  rationale: తర్వాత జరిగిన చర్యను సూచించే సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: יָצָא
  choice: బయటికి వచ్చాడు
  rationale: ప్రసవ సందర్భంలో శిశువు బయటికి రావడాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: אָחִיו
  choice: అతని సోదరుడు
  rationale: మూలంలోని 3వ పురుష ఏకవచన సంబంధసూచక ప్రత్యయంతో ఉన్న బంధుత్వ పదాన్ని నేరుగా ప్రతిబింబిస్తుంది.
- source_word: אֲשֶׁר עַל יָדוֹ הַשָּׁנִי
  choice: చేతికి ఎర్రని దారం ఉన్న
  rationale: సోదరుణ్ణి గుర్తించే సంబంధవాక్యంగా సహజ తెలుగులో ఇచ్చింది; ‘దారం’ అనే పదం 28వ వచనంలోని తక్షణ సందర్భం నుంచి పూరించబడింది.
- source_word: הַשָּׁנִי
  choice: ఎర్రని దారం
  rationale: ఇక్కడ అక్షరార్థంగా ‘ఆ ఎర్రని/ఎర్రని వస్తువు’ ఉంది; ముందటి వచనంలో పేర్కొన్న దారమే ఉద్దేశం కాబట్టి ‘దారం’ పూరించబడింది.
- source_word: וַיִּקְרָא שְׁמוֹ
  choice: అతని పేరు … అని పిలిచాడు
  rationale: ‘అతని పేరును పిలిచాడు’ అనే హీబ్రూ నుడికారాన్ని దగ్గరగా ఉంచుతూ, కర్తను మూలంలాగే పురుష ఏకవచనంగా కానీ నిర్దిష్టంగా గుర్తించకుండా ఉంచుతుంది.
- source_word: זָרַח
  choice: జెరహు
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు ధ్వన్యనుకరణలో అందించింది.
theological_decisions:
- issue: పేరు పెట్టిన వ్యక్తి గుర్తింపు
  choice: పురుష ఏకవచన క్రియను ఉంచి, కర్తను పేరుతో లేదా పాత్రతో నిర్దిష్టం చేయలేదు
  alternative: ‘అతనికి జెరహు అని పేరు పెట్టారు’ అనే కర్తలేని/బహువచన గౌరవ రూపం
  rationale: మసొరెటిక్ పాఠంలో క్రియ పురుష ఏకవచనంలో ఉంది; అయితే ఆ కర్త ఎవరో వచనం స్పష్టంగా చెప్పదు. అందువల్ల కర్తను మంత్రసాని, తండ్రి లేదా మరెవరుగా నిర్ణయించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘సోదరుడు’ సాధారణ పాఠకులకు స్పష్టంగా ఉండి, మూలంలోని బంధుత్వ భావాన్ని నిలుపుతుంది. పేరు పెట్టిన కర్త విషయంలో మూలపాఠంలోని అస్పష్టతను వ్యాఖ్యానంతో పరిష్కరించకుండా నిలిపింది.
