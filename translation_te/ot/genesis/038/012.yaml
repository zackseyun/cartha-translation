source:
  edition: WLC
  text: וַ/יִּרְבּוּ֙ הַ/יָּמִ֔ים וַ/תָּ֖מָת בַּת שׁ֣וּעַ אֵֽשֶׁת יְהוּדָ֑ה וַ/יִּנָּ֣חֶם יְהוּדָ֗ה וַ/יַּ֜עַל עַל גֹּֽזֲזֵ֤י צֹאנ/וֹ֙ ה֗וּא וְ/חִירָ֛ה רֵעֵ֥/הוּ הָ/עֲדֻלָּמִ֖י תִּמְנָֽתָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/012.yaml
  text: After many days had passed[a], the daughter of Shua, Judah’s wife, died. When Judah was comforted[c][b], he went up to Timnah to his sheep shearers—he and his friend Hirah the Adullamite.
translation:
  language: te
  text: చాలా రోజులు గడిచిన తరువాత[a], యూదా భార్య అయిన షూవా కుమార్తె[b] చనిపోయింది. యూదా ఓదార్పు పొందిన తరువాత[c], అతడు తన స్నేహితుడైన అదుల్లామీయుడు హీరాతో కలిసి, తన గొర్రెల బొచ్చు కత్తిరించే వారి వద్దకు తిమ్నాకు పైకి వెళ్లాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “చాలా కాలం గడిచిన తరువాత.” అక్షరార్థంగా, “రోజులు అధికమయ్యాయి.”
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో, “షూవా కుమార్తె”; కొందరు దీన్ని “బత్షూవా” అనే వ్యక్తినామంగా భావిస్తారు.
    reason: alternative_reading
  - marker: c
    text: లేదా, “యూదా ఓదార్పు పొందినప్పుడు” లేదా “యూదా ఓదార్పు పొందాడు.” ఇక్కడి హీబ్రూ క్రియ దుఃఖానంతరం ఓదార్పు పొందడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְבּוּ הַיָּמִים
  choice: చాలా రోజులు గడిచిన తరువాత
  rationale: ‘రోజులు అధికమయ్యాయి’ అనే హీబ్రూ నుడికారంలోని కాలగమన భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: וַתָּמָת
  choice: చనిపోయింది
  rationale: కథన సందర్భంలో מות క్రియకు సహజమైన ప్రామాణిక తెలుగు రూపం.
- source_word: בַּת שׁוּעַ
  choice: షూయ కుమార్తె
  rationale: హీబ్రూ పదబంధం ప్రత్యక్షంగా బంధుత్వాన్ని సూచిస్తుంది; దానిని వ్యక్తినామంగా మార్చకుండా మూలంలోని రూపాన్ని నిలుపుతుంది.
- source_word: אֵשֶׁת יְהוּדָה
  choice: యూదా భార్య
  rationale: హీబ్రూ సమాస సంబంధాన్ని సహజమైన తెలుగు స్వామ్య నిర్మాణంతో అందిస్తుంది.
- source_word: וַיִּנָּחֶם יְהוּדָה
  choice: యూదా ఓదార్పు పొందిన తరువాత
  rationale: ఇక్కడ נחם నిఫాల్ రూపం దుఃఖానంతరం ఓదార్పు పొందడాన్ని సూచిస్తుంది; పశ్చాత్తాప భావాన్ని దిగుమతి చేయదు.
- source_word: וַיַּעַל
  choice: వెళ్లాడు
  rationale: עלה లోని గమన భావాన్ని సహజ తెలుగులో అందిస్తుంది. ‘పైకి వెళ్లాడు’ అనే అక్షరానువాదం ఈ సందర్భంలో అసహజంగా ఉండవచ్చు; గమ్యస్థానం స్పష్టంగా చెప్పబడింది.
- source_word: עַל גֹּזֲזֵי צֹאנוֹ
  choice: తన గొర్రెల బొచ్చు కత్తిరించేవారి దగ్గరికి
  rationale: పాల్గొనే కార్మికులనే సూచించే హీబ్రూ కృదంత నిర్మాణాన్ని నిలుపుతుంది; యూదానే బొచ్చు కత్తిరించడానికి వెళ్లాడని మార్చదు.
- source_word: הוּא וְחִירָה רֵעֵהוּ
  choice: అతడు తన స్నేహితుడైన హీరాతో కలిసి
  rationale: తోడుగా వెళ్లిన వ్యక్తిని సహజ తెలుగు వాక్యనిర్మాణంలో స్పష్టంగా చూపుతుంది.
- source_word: הָעֲדֻלָּמִי
  choice: అదుల్లామీయుడు
  rationale: హీరా అదుల్లాము ప్రాంతానికి చెందినవాడని సూచించే జాతి/ప్రాంత విశేషణాన్ని నిలుపుతుంది.
- source_word: תִּמְנָתָה
  choice: తిమ్నాకు
  rationale: స్థలనామానికి జతైన దిశాసూచక ה ను తెలుగు గమ్య విభక్తితో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: וַיִּנָּחֶם అనే క్రియ యొక్క భావం
  choice: ఓదార్పు పొందిన తరువాత
  alternative: పశ్చాత్తాపపడిన తరువాత
  rationale: మరణశోక సందర్భంలో ఈ నిఫాల్ రూపం ఓదార్పు పొందడాన్ని సూచిస్తుంది; పశ్చాత్తాపం అనే వేరే భావాన్ని ఇక్కడ చేర్చడం సముచితం కాదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. మూలంలోని బంధుత్వ పదబంధం, దుఃఖానంతర ఓదార్పు, తోడుగా వెళ్లిన వ్యక్తి, గమ్యస్థానం అన్నీ స్పష్టంగా నిలుపబడ్డాయి.
