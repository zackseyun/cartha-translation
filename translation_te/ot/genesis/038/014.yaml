source:
  edition: WLC
  text: וַ/תָּסַר֩ בִּגְדֵ֨י אַלְמְנוּתָ֜/הּ מֵֽ/עָלֶ֗י/הָ וַ/תְּכַ֤ס בַּ/צָּעִיף֙ וַ/תִּתְעַלָּ֔ף וַ/תֵּ֨שֶׁב֙ בְּ/פֶ֣תַח עֵינַ֔יִם אֲשֶׁ֖ר עַל דֶּ֣רֶךְ תִּמְנָ֑תָ/ה כִּ֤י רָאֲתָה֙ כִּֽי גָדַ֣ל שֵׁלָ֔ה וְ/הִ֕וא לֹֽא נִתְּנָ֥ה ל֖/וֹ לְ/אִשָּֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/014.yaml
  text: So she took off her widow’s garments from herself, and wrapped herself in a veil, and sat at the entrance to Enaim, which is on the road to Timnah. For she saw that Shelah had grown up, yet she had not been given to him as a wife.
translation:
  language: te
  text: అప్పుడు ఆమె తాను ధరించిన విధవత్వపు వస్త్రాలను తీసివేసి, ముసుగును కప్పుకొని దానిలో తనను చుట్టుకుంది. తిమ్నాకు వెళ్లే దారిలో ఉన్న ఏనయీము ప్రవేశం దగ్గర[a] కూర్చుంది. ఎందుకంటే షేలా పెద్దవాడయ్యాడని ఆమె గమనించింది; అయినా ఆమె అతనికి భార్యగా ఇవ్వబడలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పెతహ్-ఏనయీము దగ్గర.” హీబ్రూ పదబంధాన్ని ఒకే స్థలనామంగా విభజించవచ్చా, లేక “ఏనయీము ప్రవేశం”గా అర్థం చేసుకోవాలా అనేది అనిశ్చితం.
    reason: בְּפֶתַח עֵינַיִם అనే పదబంధం స్థలనామమా లేక ‘ఏనయీము ప్రవేశం’ అనే వివరణాత్మక పదబంధమా అన్న అనిశ్చితిని నిలుపుతుంది.
lexical_decisions:
- source_word: בִּגְדֵי אַלְמְנוּתָהּ
  choice: తన మీద ఉన్న విధవరాలి దుస్తులు
  rationale: ‘ఆమె విధవత్వపు వస్త్రాలు’ అనే మూల భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తూ, מֵעָלֶיהָ (‘ఆమె మీదినుంచి’) భావాన్నీ నిలిపింది.
- source_word: וַתְּכַס בַּצָּעִיף וַתִּתְעַלָּף
  choice: ముసుగుతో తనను కప్పుకొని చుట్టుకుంది
  rationale: మూలంలోని ‘కప్పుకుంది’ మరియు ‘తనను చుట్టుకుంది’ అనే రెండు క్రియలను కలిపివేయకుండా, తెలుగులో సహజంగా ఉంచింది.
- source_word: בְּפֶתַח עֵינַיִם
  choice: ఏనయీము ప్రవేశం దగ్గర
  rationale: עֵינַיִםను స్థలనామంగా తీసుకునే సందర్భోచిత అవగాహనను అనుసరిస్తూ, פֶּתַח యొక్క ‘ప్రవేశం’ భావాన్ని నిలిపింది; పదబంధ విభజనలోని అనిశ్చితిని పాదటిప్పణిలో తెలిపింది.
- source_word: כִּי רָאֲתָה
  choice: ఆమె గమనించింది
  rationale: ఇక్కడ ‘చూసింది’ అనేది పరిస్థితిని గుర్తించడం అనే భావంలో ఉంది; ‘గమనించింది’ తెలుగులో ఆ అర్థాన్ని సహజంగా అందిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కథన శైలి సరళంగా, గౌరవప్రదంగా ఉంది. మూలంలోని క్రియల క్రమం, షేలాకు భార్యగా ఇవ్వబడకపోవడంలోని కర్మణి నిర్మాణం, స్థలనామ అనిశ్చితి నిలిపివేయబడ్డాయి.
