language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּ֨שָׁב֙ אֶל יְהוּדָ֔ה וַ/יֹּ֖אמֶר לֹ֣א מְצָאתִ֑י/הָ וְ/גַ֨ם אַנְשֵׁ֤י הַ/מָּקוֹם֙ אָֽמְר֔וּ לֹא הָיְתָ֥ה בָ/זֶ֖ה קְדֵשָֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/022.yaml
  text: So he returned to Judah and said[a], “I did not find her, and also the men of the place said[b], ‘There has been no cult prostitute here.’”
translation:
  language: te
  text: అప్పుడు అతడు యూదా దగ్గరకు తిరిగి వచ్చి, “ఆమెను నేను కనుగొనలేదు; అంతేకాక, ఆ స్థలంలోని పురుషులు కూడా, ‘ఇక్కడ ఆరాధనతో సంబంధమున్న స్త్రీ ఎవరూ లేరు’ అన్నారు” అని చెప్పాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '“ఆరాధనతో సంబంధమున్న స్త్రీ”: హీబ్రూ కְדֵשָׁה (కెదేషా). ఇది పవిత్రమైన లేదా ఆరాధనకు సంబంధించిన పాత్రతో ముడిపడిన స్త్రీని సూచించవచ్చు. సందర్భానుసారం “ఆరాధనా వేశ్య” లేదా “ఆలయ వేశ్య” అని కూడా అనువదిస్తారు; అయితే ఆ పదం తప్పనిసరిగా అధికారిక ఆలయ వ్యవస్థను లేదా నిర్దిష్ట లైంగిక ఆచారాన్ని సూచిస్తుందా అనేది అనిశ్చితం.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב אֶל־יְהוּדָה
  choice: అప్పుడు అతడు యూదా దగ్గరికి తిరిగివచ్చి
  rationale: Wayyiqtol కథన క్రమాన్ని ముందుకు నడిపిస్తుంది; ‘అప్పుడు’ సహజమైన తెలుగు కథన ప్రవాహాన్ని ఇస్తుంది. אֶל దిశను సూచిస్తుంది.
- source_word: לֹא מְצָאתִיהָ
  choice: ఆమె నాకు కనబడలేదు
  rationale: హీబ్రూ వాక్యం పూర్తయిన అన్వేషణ ఫలితాన్ని నిరాకరిస్తుంది. తెలుగు వాడుకలో ఇది ‘నేను ఆమెను కనుగొనలేదు’ కంటే సహజంగా ఉంటుంది; అసమర్థత అనే అదనపు భావాన్ని చేర్చదు.
- source_word: וְגַם אַנְשֵׁי הַמָּקוֹם
  choice: అంతేకాదు, ఆ ప్రాంతపు పురుషులు కూడా
  rationale: וְגַם లోని అదనపు ఆధార భావాన్ని ‘అంతేకాదు… కూడా’ నిలుపుతుంది. אַנְשֵׁי పురుష బహువచనం కాబట్టి సాధారణ ‘ప్రజలు’కు బదులు ‘పురుషులు’ ఎంచుకోబడింది.
- source_word: לֹא הָיְתָה בָזֶה
  choice: ఇక్కడ … ఎవరూ ఉండలేదు
  rationale: ఆ ప్రదేశంలో అలాంటి స్త్రీ ఉనికిని ఈ అస్తిత్వ వాక్యం నిరాకరిస్తుంది; בָזֶהను సహజంగా ‘ఇక్కడ’ అని అనువదించాం.
- source_word: קְדֵשָׁה
  choice: ఆలయ వేశ్య
  rationale: ఈ పదం సాధారణ వేశ్యను సూచించే זֹנָהతో భిన్నంగా, ఆరాధనా సంబంధమైన అక్రమ లైంగిక ఆచారంతో ముడిపడిన స్త్రీని సూచిస్తుంది. ‘ఆలయ వేశ్య’ సాధారణ పాఠకునికి సంక్షిప్తంగా అర్థమవుతుంది; పదంలోని ఆరాధనా సంబంధాన్ని పాదటిప్పణి వివరిస్తుంది.
theological_decisions:
- issue: קְדֵשָׁה యొక్క ఆరాధనా సంబంధిత భావం
  choice: ఆలయ వేశ్య
  alternative: ఆరాధనా వేశ్య; ప్రతిష్ఠిత స్త్రీ
  rationale: సందర్భం సాధారణ వ్యభిచారిణికంటే ఆరాధనా సంబంధిత పాత్రను వేరుచేస్తుంది. అయితే ఒక అధికారిక ఆలయ వ్యవస్థను హీబ్రూ పదం తప్పనిసరిగా నిర్ధారించదు; అందుకే ఆ పరిమితిని పాదటిప్పణిలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. ‘పురుషులు’ మూలంలోని లింగ నిర్దిష్టతను నిలుపుతుంది. ప్రధాన పాఠ్యంలో ఉన్న [a] సూచిక సంబంధిత పాదటిప్పణికి అనుగుణంగా ఉంచబడింది.
