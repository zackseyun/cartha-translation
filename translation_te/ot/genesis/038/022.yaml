revisions:
- from: అప్పుడు అతడు యూదా దగ్గరికి తిరిగివచ్చి, “ఆమె నాకు కనబడలేదు. అంతేకాదు, ఆ ప్రాంతపు పురుషులు కూడా, ‘ఇక్కడ ఆలయ వేశ్య ఎవరూ ఉండలేదు’ అని చెప్పారు” అన్నాడు.[a]
  to: అప్పుడు అతడు యూదా దగ్గరకు తిరిగి వచ్చి, “ఆమెను నేను కనుగొనలేదు; అంతేకాక, ఆ స్థలంలోని పురుషులు కూడా, ‘ఇక్కడ ఆరాధనతో సంబంధమున్న స్త్రీ ఎవరూ లేరు’ అన్నారు” అని చెప్పాడు.[a]
  rationale: The revision retains every narrative element of the Hebrew, improves the expression of the unsuccessful search and the local men’s direct statement, and avoids presenting the debated “temple prostitution” interpretation as an established fact. The footnote supplies the traditional alternatives and preserves the lexical-historical uncertainty.
