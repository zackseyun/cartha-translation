  yaml_path: translation/ot/genesis/038/018.yaml
  text: He said[a], “What pledge shall I give you?” And she said, “Your seal, your cord, and your staff that is in your hand.” So he gave them to her and went in to her[c][b], and she conceived by him.
translation:
  language: te
  text: అతడు, “నేను నీకు ఏ పూచీకత్తు ఇవ్వాలి?” అని అడిగాడు. ఆమె, “నీ ముద్రను, నీ తాడును, నీ చేతిలో ఉన్న కర్రను ఇవ్వు” అంది. అతడు వాటిని ఆమెకు ఇచ్చి, ఆమెతో శయనించాడు[a]. ఆమె అతని వల్ల గర్భం దాల్చింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ఆమెతో శయనించాడు” అనేది లైంగిక సంబంధాన్ని సూచించే గౌరవప్రదమైన సభ్యోక్తి.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֵרָבוֹן
  choice: పూచీకత్తు
  rationale: తరువాత చెల్లించాల్సిన దానికి హామీగా తాత్కాలికంగా ఇచ్చే వస్తువును సూచిస్తుంది; ఆధునిక తెలుగులో ‘పూచీకత్తు’ ఈ సందర్భాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: חֹתָמְךָ
  choice: నీ ముద్ర
  rationale: గుర్తింపుకోసం ఉపయోగించే ముద్ర లేదా ముద్రికను సూచిస్తుంది. మూలపాఠం అది ఉంగరమని చెప్పదు కాబట్టి ‘ముద్ర’ అనవసరమైన నిర్దిష్టతను నివారిస్తుంది.
- source_word: וּפְתִילֶךָ
  choice: నీ తాడు
  rationale: బహుశా ముద్రకు జోడించిన తాడును సూచిస్తుంది; ‘తాడు’ సరళంగా ఉండి మూలంలోని అనిశ్చితిని నిలుపుతుంది.
- source_word: וּמַטְּךָ
  choice: నీ కర్ర
  rationale: చేతిలో పట్టుకునే వ్యక్తిగత దండం లేదా కర్రను సూచిస్తుంది; ఈ సందర్భంలో ‘కర్ర’ సహజమైన ఆధునిక తెలుగు.
- source_word: אֲשֶׁר בְּיָדֶךָ
  choice: నీ చేతిలో ఉన్న
  rationale: కర్రను విశేషించే సంబంధ వాక్యాన్ని, మూలంలోని స్పష్టమైన దృశ్యాన్ని నిలుపుతూ సహజ తెలుగులో అందిస్తుంది.
- source_word: וַיִּתֶּן לָּהּ
  choice: అతడు వాటిని ఆమెకు ఇచ్చి
  rationale: హీబ్రూ క్రియలో ప్రత్యక్ష కర్మ వ్యక్తంగా లేకపోయినా, ముందు పేర్కొన్న మూడు వస్తువులను తెలుగు సహజంగా ‘వాటిని’ అని సూచిస్తుంది.
- source_word: וַיָּבֹא אֵלֶיהָ
  choice: ఆమె దగ్గరికి వెళ్లాడు
  rationale: హీబ్రూలో ఇది లైంగిక సంభోగానికి వాడే సభ్యోక్తి. మూలంలోని పరోక్షతను నిలుపేందుకు ప్రధాన పాఠంలో ఈ రూపాన్ని ఉంచి, అర్థాన్ని పాదసూచికలో స్పష్టం చేశాం.
- source_word: וַתַּהַר לוֹ
  choice: ఆమె అతని వల్ల గర్భం దాల్చింది
  rationale: గర్భధారణను మరియు לוֹ సూచించే అతని కారణత్వం/పితృత్వ సంబంధాన్ని స్పష్టమైన, గౌరవప్రదమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి పాటించబడింది. లైంగిక చర్యకు సంబంధించిన హీబ్రూ సభ్యోక్తి ప్రధాన పాఠంలో నిలుపబడి, సాధారణ పాఠకునికి అర్థమయ్యేలా పాదసూచికలో వివరించబడింది.
