    issue: The rendering of וַיָּבֹא אֵלֶיהָ as “ఆమె దగ్గరికి వెళ్లాడు” is overly ambiguous.
    rationale: Unlike the Hebrew idiom in this context, the Telugu phrase naturally describes merely approaching someone and does not signal sexual union. The footnote identifies the source idiom but cannot fully remedy an insufficient main-text rendering. “ఆమెతో శయనించాడు” is a respectful Telugu euphemism and preserves the narrative register.
