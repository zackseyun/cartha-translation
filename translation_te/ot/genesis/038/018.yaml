  source_fidelity: 'The sequence and referents are accurately represented: Judah asks what pledge to give, Tamar requests the three personal items, he gives them, and she conceives by him. However, “ఆమె దగ్గరికి వెళ్లాడు” ordinarily means only “he went near/to her” in Telugu and does not function as an adequate narrative euphemism for וַיָּבֹא אֵלֶיהָ.'
  naturalness: The Telugu is otherwise clear and modern. Replacing the ambiguous physical-motion expression with the established respectful literary euphemism “ఆమెతో శయనించాడు” makes the intended sense accessible while retaining non-explicit narrative register.
  terminology: “పూచీకత్తు,” “ముద్ర,” “తాడు,” and “కర్ర” are acceptable, source-sensitive choices. “ముద్ర” does not over-specify the sealing device as a ring, and “కర్ర” suitably renders the staff.
  issues:
