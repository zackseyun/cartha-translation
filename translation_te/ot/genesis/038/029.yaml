id: GEN.38.29
reference: Genesis 38:29
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְהִ֣י כְּ/מֵשִׁ֣יב יָד֗/וֹ וְ/הִנֵּה֙ יָצָ֣א אָחִ֔י/ו וַ/תֹּ֕אמֶר מַה פָּרַ֖צְתָּ עָלֶ֣י/ךָ פָּ֑רֶץ וַ/יִּקְרָ֥א שְׁמ֖/וֹ פָּֽרֶץ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/029.yaml
  text: And as he drew back his hand[a], behold, his brother came out. Then she said[b], “What a breach you have made for yourself!” So his name was called Perez.
translation:
  language: te
  text: అతడు తన చెయ్యి వెనక్కి తీసుకుంటుండగా, ఇదిగో, అతని సోదరుడు బయటికి వచ్చాడు. అప్పుడు ఆమె, “నువ్వు ఎంతగా చొచ్చుకొని దారి చేసుకున్నావు!”[a] అంది. అందుచేత అతనికి పెరెసు అని పేరు పెట్టబడింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ఈ మాటలో פרץ (పారట్స్) అనే మూలపదం రెండుసార్లు వస్తుంది; సుమారుగా, “నీకోసం నువ్వు ఎంతటి చీలిక చేశావు!” అనే భావం. ఇదే మూలపదం ‘పెరెసు’ అనే పేరుతో పదక్రీడను ఏర్పరుస్తుంది.
    reason: మూలంలోని పునరుక్తి, క్లిష్టమైన పదబంధం, పేరుతో ఉన్న పదక్రీడను వివరించడం
lexical_decisions:
- source_word: כְּמֵשִׁיב יָדוֹ
  choice: తన చెయ్యి వెనక్కి తీసుకుంటుండగా
  rationale: שוב హిఫీల్ రూపం, ‘చెయ్యి’ అనే కర్మతో కలిసి, చెయ్యిని వెనక్కి తీసుకోవడాన్ని సూచిస్తుంది. తెలుగు కథనంలో కొనసాగుతున్న చర్యను సహజంగా తెలియజేయడానికి ఈ రూపం వాడబడింది.
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: హఠాత్తుగా జరిగిన పరిణామాన్ని పాఠకుని దృష్టికి సజీవంగా తీసుకువచ్చే హీబ్రూ సూచకపద బలాన్ని నిలుపుతుంది.
- source_word: יָצָא אָחִיו
  choice: అతని సోదరుడు బయటికి వచ్చాడు
  rationale: ప్రసవ సందర్భంలో יָצָא యొక్క భౌతిక అర్థాన్ని సరళంగా, స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: מַה פָּרַצְתָּ עָלֶיךָ פָּרֶץ
  choice: నువ్వు ఎలా చొచ్చుకొని వచ్చావు!
  rationale: ప్రసవ సందర్భంలోని ఆకస్మికంగా ముందుకు రావడం అనే భావాన్ని సహజమైన తెలుగులో ఇస్తుంది. మూలంలోని פרץ పదపునరుక్తి, עָלֶיךָ యొక్క క్లిష్టత ప్రధాన వాక్యంలో పూర్తిగా ప్రతిబింబించలేనందున పాదసూచికలో వివరించబడింది.
- source_word: פָּרֶץ
  choice: పెరెసు
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగులో సుపరిచితమైన ధ్వన్యనుకరణ రూపంలో ఇస్తుంది; ఈ పేరు פרץ (‘చీల్చుకొని రావడం/చీలిక’) అనే మూలంతో సంబంధం కలిగి ఉంది.
- source_word: וַיִּקְרָא שְׁמוֹ פָּרֶץ
  choice: అతనికి పెరెసు అని పేరు పెట్టబడింది
  rationale: మూలపాఠం పేరు పెట్టిన వ్యక్తిని స్పష్టంగా పేర్కొనదు. కర్తను ఊహించి చేర్చకుండా తెలుగు కర్మణి ప్రయోగంతో ఆ అనిర్దిష్టతను నిలిపింది.
theological_decisions:
- issue: పేరు పెట్టిన వ్యక్తి ఎవరు అన్నది మూలంలో అనిర్దిష్టం
  choice: 'కర్తలేని కర్మణి రూపం: ‘పేరు పెట్టబడింది’'
  alternative: ‘ఆమె అతనికి పెరెసు అని పేరు పెట్టింది’
  rationale: וַיִּקְרָא రూపం వ్యాకరణపరంగా పుంలింగ ఏకవచనమైనా, కథనంలోని పేరు పెట్టే సూత్రప్రయోగం స్పష్టమైన వ్యక్తిని గుర్తించదు. సందర్భం ఆధారంగా ‘ఆమె’ అని నిర్ణయించకుండా మూలంలోని ఉద్రిక్తతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన కథనశైలి వాడబడింది. ‘ఇదిగో’ ద్వారా మూలంలోని సజీవ ఆశ్చర్య సూచన నిలుపబడింది. ప్రధాన వాక్యంలో అసహజమైన పదపునరుక్తిని బలవంతంగా పెట్టకుండా, హీబ్రూ పదక్రీడను పాదసూచికలో సంరక్షించాం.
