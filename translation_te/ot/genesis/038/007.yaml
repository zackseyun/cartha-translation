id: GEN.38.7
reference: Genesis 38:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְהִ֗י עֵ֚ר בְּכ֣וֹר יְהוּדָ֔ה רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה וַ/יְמִתֵ֖/הוּ יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/007.yaml
  text: Er[a], Judah’s firstborn, was evil in the sight of Yahweh, and Yahweh put him to death.
translation:
  language: te
  text: యూదా మొదటి కుమారుడైన ఏరు యెహోవా దృష్టిలో దుర్మార్గుడిగా ఉన్నాడు; యెహోవా అతణ్ణి చంపాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, మరింత అక్షరార్థంగా: “యెహోవా అతడు చనిపోయేలా చేశాడు.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: ఉన్నాడు
  rationale: వావ్-క్రమకథన రూపం కథను ముందుకు నడిపిస్తుంది; తెలుగులో ప్రత్యేకంగా ‘ఇప్పుడు’ అని చేర్చకుండా సహజ వాక్యనిర్మాణంలో భావాన్ని వ్యక్తం చేశాం.
- source_word: עֵר
  choice: ఏరు
  rationale: వ్యక్తి పేరును ఆధునిక ప్రామాణిక తెలుగు ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: בְּכוֹר יְהוּדָה
  choice: యూదా మొదటి కుమారుడు
  rationale: సంబంధాన్ని, జననక్రమాన్ని స్పష్టంగా తెలిపే సహజ తెలుగు ప్రయోగం.
- source_word: רַע
  choice: దుర్మార్గుడు
  rationale: ఇక్కడ సాధారణంగా ‘చెడ్డవాడు’ అనే భావం కంటే యెహోవా ఎదుట నైతిక దుష్టత్వాన్ని సూచిస్తుంది.
- source_word: בְּעֵינֵי יְהוָה
  choice: యెహోవా దృష్టిలో
  rationale: దేవుని మూల్యాంకనాన్ని తెలిపే హెబ్రీయ నుడికారానికి సహజమైన, సమీప తెలుగు సమానార్థకం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో స్థిరపడిన రూపంలో లిప్యంతరీకరించాం.
- source_word: וַיְמִתֵהוּ
  choice: అతణ్ణి చంపాడు
  rationale: מות అనే ధాతువు హిఫీల్ రూపంలో ప్రత్యక్ష కారణకర్తృత్వాన్ని సూచిస్తుంది; ‘చంపాడు’ ఆ భావాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు / యాహ్వే
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం ఉంది; దానిని బిరుదుగా మార్చకుండా తెలుగులో విస్తృతంగా గుర్తించబడే లిప్యంతరీకరణను వాడాం.
- issue: ఏరు మరణంలో దేవుని కార్యసాధకత్వం
  choice: యెహోవా అతణ్ణి చంపాడు
  alternative: యెహోవా అతడు చనిపోయేలా చేశాడు
  rationale: హెబ్రీయ కారణార్థక క్రియ యెహోవా ప్రత్యక్ష కార్యసాధకత్వాన్ని స్పష్టంగా పేర్కొంటుంది; దాన్ని మృదువుపరచకుండా ఉంచాం. మరణం సంభవించిన విధానాన్ని మాత్రం పాఠం చెప్పనందున జోడించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనప్పటికీ గంభీరమైన శైలి. ప్రధాన పాఠంలోని [a] గుర్తు సంబంధిత ప్రత్యామ్నాయ అనువాదాన్ని సూచిస్తుంది.
