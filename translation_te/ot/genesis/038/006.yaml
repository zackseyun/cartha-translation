  yaml_path: translation/ot/genesis/038/006.yaml
  text: And Judah took a wife for Er his firstborn, and her name was Tamar.
translation:
  language: te
  text: యూదా తన జ్యేష్ఠ కుమారుడైన ఏరుకు ఒక భార్యను తీసుకున్నాడు. ఆమె పేరు తామారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקַּח
  choice: తీసుకొచ్చాడు
  rationale: లָקַח అనే క్రియకు ప్రాథమికంగా ‘తీసుకొను’ అనే అర్థం ఉంది. ఇక్కడ యూదా తన కుమారునికి భార్యను సమకూర్చిన వివాహ సందర్భాన్ని సహజమైన తెలుగులో ‘తీసుకొచ్చాడు’ అని వ్యక్తం చేస్తుంది; ‘వివాహం ఏర్పాటు చేశాడు’ అని మూలంలో అంత స్పష్టంగా లేని వివరాన్ని చేర్చదు.
- source_word: אִשָּׁה
  choice: ఒక భార్యను
  rationale: ఏరుకు వివాహం చేసే సందర్భం కావడంతో אִשָּׁה ఇక్కడ సాధారణంగా ‘స్త్రీ’ కాకుండా ‘భార్య’ అనే సంబంధార్థాన్ని కలిగి ఉంది.
- source_word: לְעֵר
  choice: ఏరుకు
  rationale: לְ ఉపసర్గ ఇక్కడ యూదా చేసిన కార్యం ఎవరికి ఉద్దేశించబడిందో సూచిస్తుంది. తెలుగు సంప్రదాన విభక్తి ‘ఏరుకు’ దీనిని సహజంగా తెలియజేస్తుంది.
- source_word: בְּכוֹרוֹ
  choice: తన మొదటి కుమారుడైన
  rationale: בְּכוֹר అంటే మొదట పుట్టిన కుమారుడు. ‘తన మొదటి కుమారుడైన’ అనేది తెలుగు పాఠకులకు స్పష్టంగా ఉండి, ఏరు యూదా జ్యేష్ఠ కుమారుడనే భావాన్ని నిలుపుతుంది.
- source_word: וּשְׁמָהּ
  choice: ఆమె పేరు
  rationale: ఇది హీబ్రూ పేరును పరిచయం చేసే సాధారణ సూత్రప్రయోగం. ‘ఆమె పేరు తామారు’ అనేది సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: תָּמָר
  choice: తామారు
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగులో సుపరిచితమైన రూపమైన ‘తామారు’గా లిప్యంతరీకరించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. హీబ్రూ వాక్య నిర్మాణాన్ని యాంత్రికంగా అనుకరించకుండా, యూదా ఏరుకు భార్యను సమకూర్చిన భావాన్ని మూలానికి దగ్గరగా మరియు సహజంగా అందించాం.
