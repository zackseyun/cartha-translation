revisions:
- from: 'దాదాపు మూడు నెలల తర్వాత యూదాకు ఇలా తెలిసింది: “నీ కోడలు తామారు వ్యభిచరించింది; అంతేకాదు, ఇదిగో, వ్యభిచారం వల్ల ఆమె గర్భవతి అయింది.” అప్పుడు యూదా, “ఆమెను బయటికి తీసుకురండి; ఆమెను కాల్చివేయాలి,” అన్నాడు.'
  to: 'దాదాపు మూడు నెలలు గడిచిన తర్వాత యూదాకు ఇలా తెలియజేయబడింది: “నీ కోడలు తామారు వేశ్యలా ప్రవర్తించింది; అంతేకాదు, చూడండి, ఆమె వేశ్యావృత్తి వల్ల గర్భవతి అయింది.” అప్పుడు యూదా, “ఆమెను బయటకు తీసుకురండి; ఆమెను కాల్చివేయాలి,” అన్నాడు.'
  rationale: వేశ్యావృత్తిని సూచించే మూలపదజతిని తెలుగులో సమాంతర పదజాలంతో అనువదించాం. కాలసూచనలోని సుమారు భావం, నివేదిక నిష్క్రియ స్వభావం, הִנֵּה యొక్క ఉద్ఘాటన, మరియు దహన శిక్షకు సంబంధించిన నిష్క్రియ ఆజ్ఞ అన్నీ నిలుపబడ్డాయి. ఈ వచనానికి తప్పనిసరి పాదటిప్పణి అవసరం లేదు.
