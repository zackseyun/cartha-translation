    rationale: హెబ్రీ זנה మరియు זנונים వేశ్యావృత్తి లేదా వేశ్యలా ప్రవర్తించడాన్ని సూచించే పదజాలం. తెలుగు “వ్యభిచారం” సాధారణంగా వివాహేతర లైంగిక సంబంధం అనే అర్థంలో వినబడుతుంది; అందువల్ల మూలంలోని నిర్దిష్ట పదచిత్రం మరియు రెండు పదాల అనుసంధానం తగ్గిపోతాయి.
