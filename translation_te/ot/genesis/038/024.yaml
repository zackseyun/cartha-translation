source:
  edition: WLC
  text: וַ/יְהִ֣י כְּ/מִ/שְׁלֹ֣שׁ חֳדָשִׁ֗ים וַ/יֻּגַּ֨ד לִֽ/יהוּדָ֤ה לֵֽ/אמֹר֙ זָֽנְתָה֙ תָּמָ֣ר כַּלָּתֶ֔/ךָ וְ/גַ֛ם הִנֵּ֥ה הָרָ֖ה לִ/זְנוּנִ֑ים וַ/יֹּ֣אמֶר יְהוּדָ֔ה הוֹצִיא֖וּ/הָ וְ/תִשָּׂרֵֽף׀׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/024.yaml
  text: And it happened about three months later that Judah was told[a], “Tamar your daughter-in-law has acted as a prostitute, and behold, she is also pregnant by prostitution.” Then Judah said, “Bring her out[b], and let her be burned.”
translation:
  language: te
  text: 'దాదాపు మూడు నెలలు గడిచిన తర్వాత యూదాకు ఇలా తెలియజేయబడింది: “నీ కోడలు తామారు వేశ్యలా ప్రవర్తించింది; అంతేకాదు, చూడండి, ఆమె వేశ్యావృత్తి వల్ల గర్భవతి అయింది.” అప్పుడు యూదా, “ఆమెను బయటకు తీసుకురండి; ఆమెను కాల్చివేయాలి,” అన్నాడు.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כְּמִשְׁלֹשׁ חֳדָשִׁים
  choice: దాదాపు మూడు నెలల తర్వాత
  rationale: כְּ సుమారు అనే భావాన్ని ఇస్తుంది; కథనంలోని కాల పురోగతిని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וַיֻּגַּד לִיהוּדָה לֵאמֹר
  choice: యూదాకు ఇలా తెలిసింది
  rationale: నివేదిక యూదాకు తెలియజేయబడిందనే హొఫాల్ నిష్క్రియార్థాన్ని సహజమైన తెలుగు వాక్య నిర్మాణంలో నిలుపుతుంది.
- source_word: זָנְתָה
  choice: వ్యభిచరించింది
  rationale: זנה లోని వేశ్యావృత్తి/అక్రమ లైంగిక ప్రవర్తనకు సంబంధించిన ఆరోపణను సాధారణ ఆధునిక తెలుగులో స్పష్టంగా అందిస్తుంది.
- source_word: כַּלָּתֶךָ
  choice: నీ కోడలు
  rationale: సందర్భానికి సరిపోయే సహజమైన తెలుగు బంధుత్వ పదం.
- source_word: וְגַם הִנֵּה
  choice: అంతేకాదు, ఇదిగో
  rationale: וְגַם యొక్క అదనపు ఉద్ఘాటనను, הִנֵּה యొక్క ఆశ్చర్యం మరియు దృష్టి ఆకర్షించే శక్తిని నిలుపుతుంది.
- source_word: הָרָה לִזְנוּנִים
  choice: వ్యభిచారం వల్ల ఆమె గర్భవతి అయింది
  rationale: గర్భధారణను అక్రమ లైంగిక చర్యల ఫలితంగా ఆరోపిస్తున్న మూలపాఠ భావాన్ని, זנה/זנונים పదబంధ సంబంధాన్ని నిలుపుతూ తెలియజేస్తుంది.
- source_word: הוֹצִיאוּהָ
  choice: ఆమెను బయటికి తీసుకురండి
  rationale: బహువచన ఆజ్ఞారూపాన్ని నేరుగా, సహజంగా అనువదిస్తుంది.
- source_word: וְתִשָּׂרֵף
  choice: ఆమెను కాల్చివేయాలి
  rationale: నిఫాల్ రూపంలోని నిష్క్రియ శిక్షా ఆదేశాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తూ, కార్యనిర్వాహకులను నిర్దిష్టంగా పేర్కొనదు.
theological_decisions:
- issue: లైంగిక అపరాధానికి సంబంధించిన పదజాలం
  choice: వ్యభిచరించింది / వ్యభిచారం వల్ల
  alternative: వేశ్యలా ప్రవర్తించింది / లైంగిక దుర్నీతివల్ల
  rationale: మూలంలోని זנה/זנונים ఒకే మూలానికి చెందిన పదాల ప్రతిధ్వనిని వీలైనంతవరకు నిలుపుతూ, సాధారణ నైతిక పదంగా అతిగా విస్తరించకుండా ఆరోపణ యొక్క లైంగిక స్వభావాన్ని స్పష్టపరుస్తుంది.
- issue: యూదా విధించిన శిక్ష యొక్క బలం
  choice: ఆమెను బయటికి తీసుకురండి; ఆమెను కాల్చివేయాలి
  alternative: ఆమెను కాల్చివేయడానికి బయటికి తీసుకురండి / ఆమెను బయటికి తీసుకెళ్లి కాల్చివేయండి
  rationale: ఇది తక్షణ శిక్షా ఆదేశమని స్పష్టపరుస్తుంది; అదే సమయంలో నిఫాల్ నిష్క్రియ రూపాన్ని గౌరవించి శిక్షను అమలు చేసే వ్యక్తులను మూలం కంటే ఎక్కువగా నిర్దిష్టం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కథనానికి తగిన గంభీరతతో పాటు సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్య నిర్మాణం. మూలంలోని ఉద్ఘాటన కోసం ‘ఇదిగో’ నిలుపబడింది. ఈ ముసాయిదాలో పాదటిప్పణులు అవసరం లేదని నిర్ణయించబడింది.
