  rationale: వంశావళి, జనగణన జాబితా సందర్భంలో ఈ నిర్మాణ రూపం కేవలం ప్రత్యక్ష కుమారులను కాకుండా ఒక కుటుంబం లేదా వంశానికి చెందినవారిని సూచిస్తుంది; అందువల్ల ఆధునిక తెలుగులో ‘వంశస్థులు’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: בֵצָי
