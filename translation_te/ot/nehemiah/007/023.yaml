  source_fidelity: The clan designation and total accurately represent בְּנֵי and the Hebrew total 324. However, the name בֵצָי contains צ (tsade), whose primary transliteration value is /ts/, not /z/; therefore “బేజయి” follows the English conventional spelling more than the Hebrew form.
