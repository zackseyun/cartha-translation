lexical_decisions:
- source_word: בְּנֵי
  choice: వంశస్థులు
  rationale: వంశావళి, జనగణన జాబితాల సందర్భంలో ఈ నిర్మాణ రూపం కేవలం ప్రత్యక్ష కుమారులను కాకుండా ఒక కుటుంబం లేదా వంశానికి చెందినవారిని సూచిస్తుంది; అందువల్ల ఆధునిక తెలుగులో ‘వంశస్థులు’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: אִמֵּר
  choice: ఇమ్మేరు
  rationale: ఇది వ్యక్తి/వంశ నామం; హీబ్రూ ఉచ్చారణకు సమీపంగా తెలుగులో లిప్యంతరీకరించబడింది.
- source_word: אֶלֶף חֲמִשִּׁים וּשְׁנָיִם
  choice: 1,052 మంది
  rationale: హీబ్రూ సంఖ్య ‘వెయ్యి, యాభై, రెండు’ అనే ఖచ్చిత పరిమాణాన్ని తెలుపుతుంది. జనగణన జాబితాలో అంకెల రూపం స్పష్టంగా ఉంటుంది; ‘మంది’ వ్యక్తుల సంఖ్య అని సహజ తెలుగులో తెలియజేస్తుంది.
