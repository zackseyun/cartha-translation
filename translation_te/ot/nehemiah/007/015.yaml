lexical_decisions:
- source_word: בְּנֵי
  choice: కుమారులు
  rationale: జనగణన, వంశావళి సందర్భంలో కుటుంబ లేదా వంశశాఖను సూచించే మూలభాషలోని స్థిరమైన సూత్రప్రయోగాన్ని సహజమైన తెలుగులో నిలుపుతుంది; సందర్భానుసారంగా ‘వంశస్థులు’ అనే విస్తృత భావం ఉన్నప్పటికీ దానిని వివరణాత్మకంగా మార్చలేదు.
- source_word: בִנּוּי
  choice: బిన్నూయి
  rationale: వ్యక్తి లేదా కుటుంబ నామాన్ని అనువదించకుండా హీబ్రూ ఉచ్చారణకు సమీపంగా లిప్యంతరీకరించబడింది.
- source_word: שֵׁשׁ מֵאוֹת אַרְבָּעִים וּשְׁמֹנָה
  choice: ఆరువందల నలభై ఎనిమిది మంది
  rationale: హీబ్రూ సంఖ్య 648ను పదరూపంలో సహజమైన ఆధునిక తెలుగులో ఇచ్చి, ఇది వ్యక్తుల సంఖ్య అని స్పష్టత కోసం ‘మంది’ చేర్చబడింది.
