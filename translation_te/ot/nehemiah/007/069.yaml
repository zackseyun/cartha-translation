source:
  edition: WLC
  text: וּ/מִ/קְצָת֙ רָאשֵׁ֣י הָֽ/אָב֔וֹת נָתְנ֖וּ לַ/מְּלָאכָ֑ה הַ/תִּרְשָׁ֜תָא נָתַ֣ן לָ/אוֹצָ֗ר זָהָ֞ב דַּרְכְּמֹנִ֥ים אֶ֨לֶף֙ מִזְרָק֣וֹת חֲמִשִּׁ֔ים כָּתְנוֹת֙ כֹּֽהֲנִ֔ים שְׁלֹשִׁ֖ים וַ/חֲמֵ֥שׁ מֵאֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/069.yaml
  text: And some of the heads of the fathers’ houses gave to the work[a]. The governor gave to the treasury one thousand gold darics, fifty basins[c][b], and five hundred thirty-five priests’ tunics.
translation:
  language: te
  text: పూర్వీకుల కుటుంబాల పెద్దలలో కొందరు ఆ పనికి విరాళాలు ఇచ్చారు. అధిపతి[a] ఖజానాకు వెయ్యి బంగారు దరికులు[b], యాభై పాత్రలు, యాజకుల కోసం ఐదువందల ముప్పై ఐదు అంగీలు[c] ఇచ్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘తిర్షాతా’; ఇది పర్షియా పరిపాలనా బిరుదు.
    reason: lexical_alternative
  - marker: b
    text: దరికు అనేది పర్షియా బంగారు నాణెం.
    reason: cultural_note
  - marker: c
    text: హీబ్రూ పాఠంలో ‘యాజకుల అంగీలు ఐదువందల ముప్పై ఐదు’ అని ఉంది. ఎజ్రా 2:69లోని సమాంతర వాక్యంలో ‘యాజకుల అంగీలు వంద’ అని ఉంది; కొన్ని అనువాదాలు ఆ పాఠంతో సమన్వయం చేస్తాయి లేదా వేరొక పాఠసంప్రదాయాన్ని ప్రతిబింబిస్తాయి.
    reason: textual_variant
lexical_decisions:
- source_word: וּמִקְצָת רָאשֵׁי הָאָבוֹת
  choice: పూర్వీకుల కుటుంబాల పెద్దలలో కొందరు
  rationale: కְצָת లోని భాగార్థాన్ని ‘కొందరు’తో సహజంగా తెలియజేస్తూ, రָאשֵׁי הָאָבוֹת అనే వంశ-కుటుంబ నాయకత్వ పదబంధాన్ని ఆధునిక తెలుగులో స్పష్టంగా అందిస్తుంది.
- source_word: לַמְּלָאכָה
  choice: ఆ పనికి
  rationale: సందర్భంలోని పునర్నిర్మాణ కార్యాన్ని సూచిస్తూ, మూలంలోని సాధారణ ‘పని’ భావాన్ని అనవసరంగా ప్రత్యేకీకరించదు.
- source_word: הַתִּרְשָׁתָא
  choice: అధిపతి
  rationale: పర్షియా పరిపాలనా బిరుదును సామాన్య పాఠకునికి అర్థమయ్యే అధికారపదంతో అనువదించింది; మూల బిరుదును పాదసూచికలో నిలిపింది.
- source_word: לָאוֹצָר
  choice: ఖజానాకు
  rationale: విలువైన విరాళాలు జమచేసే స్థలమనే సందర్భార్థానికి ‘ఖజానా’ సరిపోతుంది.
- source_word: זָהָב דַּרְכְּמֹנִים אֶלֶף
  choice: వెయ్యి బంగారు దరికులు
  rationale: పర్షియా కాలపు బంగారు నాణేల చారిత్రక పేరును నిలిపి, זָהָב మరియు సంఖ్య రెండింటినీ స్పష్టంగా అనువదిస్తుంది.
- source_word: מִזְרָקוֹת
  choice: పాత్రలు
  rationale: ఆరాధనా సందర్భంలో వాడే గిన్నె లేదా పళ్లెం వంటి పాత్రలను సూచించే విస్తృతమైన, సహజ తెలుగు పదం; మూలం ఇక్కడ దాని ఖచ్చిత వినియోగాన్ని పేర్కొనదు.
- source_word: כָּתְנוֹת כֹּהֲנִים
  choice: యాజకుల కోసం ... అంగీలు
  rationale: כָּתְנוֹת యొక్క పొడవైన పైవస్త్ర భావానికి ‘అంగీలు’ సరిపోతుంది; యాజకులకు చెందిన లేదా వారి కోసం ఉద్దేశించిన వస్త్రాలనే సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: שְׁלֹשִׁים וַחֲמֵשׁ מֵאוֹת
  choice: ఐదువందల ముప్పై ఐదు
  rationale: మసొరెటిక్ హీబ్రూ పాఠంలోని సంఖ్యను యథాతథంగా అనుసరిస్తుంది; సమాంతర వాక్యంలోని సంఖ్యతో సమన్వయం చేయదు.
