- from: వారి దాసదాసీలు[a] కాకుండా 7,337 మంది ఉన్నారు. వారికి గాయకులు, గాయకురాళ్లు 245 మంది ఉన్నారు.
  to: వారి దాసులు, దాసీలు—ముందటి లెక్కకు అదనంగా—7,337 మంది ఉన్నారు. వారికి గాయకులు, గాయకురాళ్లు 245 మంది ఉన్నారు.
  rationale: The revision clarifies that the 7,337 are the male and female slaves and that they are additional to the immediately preceding total, matching the force and syntax of מִלְּבַד. It preserves both exact totals, the gendered singer pair, and the footnoted lexical range without imposing an interpretation beyond the census context.
