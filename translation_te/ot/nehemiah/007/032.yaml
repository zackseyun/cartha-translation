    issue: The place name is written ‘హాయి.’
    rationale: The initial ה in וְהָעָי is the Hebrew definite article, not an /h/ belonging to the proper name עַי. It should not be carried into Telugu as part of the name. ‘ఆయి’ is the appropriate form.
