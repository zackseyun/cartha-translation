lexical_decisions:
- source_word: אַנְשֵׁי
  choice: పురుషులు
  rationale: אִישׁ పదం యొక్క బహువచన సంబంధరూపం; స్థలాల ద్వారా గుర్తించబడిన సమూహాన్ని సూచిస్తుంది. మూలంలోని పురుషలింగ రూపాన్ని నేరుగా నిలుపుతుంది.
- source_word: בֵית אֵל
  choice: బేతేలు
  rationale: స్థలనామాన్ని ప్రామాణిక తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించాం; దాని వ్యుత్పత్తి అర్థమైన ‘దేవుని ఇల్లు’ అని అనువదించలేదు.
- source_word: וְהָעָי
  choice: హాయి
  rationale: సంయోజకంతో కూడిన స్థలనామం. హీబ్రూలో నిర్దేశక ఉపసర్గ ఉన్నప్పటికీ, తెలుగులో స్థలనామానికి దానిని ప్రత్యేకంగా చూపడం సహజం కాదు.
- source_word: מֵאָה עֶשְׂרִים וּשְׁלֹשָׁה
  choice: నూట ఇరవై ముగ్గురు
  rationale: జనగణనలోని ఖచ్చితమైన సంఖ్య 123ను తెలుగులో వ్యక్తులను లెక్కించే సహజ రూపంలో ఇచ్చాం.
