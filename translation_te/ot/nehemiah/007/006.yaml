id: NEH.7.6
reference: Nehemiah 7:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אֵ֣לֶּה בְּנֵ֣י הַ/מְּדִינָ֗ה הָ/עֹלִים֙ מִ/שְּׁבִ֣י הַ/גּוֹלָ֔ה אֲשֶׁ֣ר הֶגְלָ֔ה נְבוּכַדְנֶצַּ֖ר מֶ֣לֶךְ בָּבֶ֑ל וַ/יָּשׁ֧וּבוּ לִֽ/ירוּשָׁלִַ֛ם וְ/לִ/יהוּדָ֖ה אִ֥ישׁ לְ/עִירֽ/וֹ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/006.yaml
  text: 'These are the sons of the province who came up from the captivity of the exiles[a], whom Nebuchadnezzar king of Babylon had carried away, and who returned to Jerusalem and to Judah[c][b], each man to his city:'
translation:
  language: te
  text: బబులోను రాజైన నెబుకద్నెజరు చెరపట్టి తీసుకెళ్లినవారి చెరనుండి పైకి వచ్చి, యెరూషలేముకూ యూదాకూ తిరిగి వచ్చిన ఆ ప్రావిన్సుకు చెందినవారు వీరే—ప్రతి మనిషి తన పట్టణానికి:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ‘ప్రతి మనిషి తన పట్టణానికి’ అనే పంపిణీ వ్యక్తీకరణ ఉంది; ఇది తిరిగి వచ్చినవారిని వారి వారి కుటుంబ లేదా వంశ సంబంధ పట్టణాల ప్రకారం సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי הַמְּדִינָה
  choice: ఆ ప్రాంతవాసులు
  rationale: ‘ప్రాంతపు కుమారులు’ అనే అక్షరార్థ రూపం తెలుగులో అసహజంగా ఉంటుంది. పర్షియా కాలపు పరిపాలనా ప్రాంతానికి చెందిన ప్రజలు అనే భావాన్ని ‘ఆ ప్రాంతవాసులు’ సహజంగా, సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: הָעֹלִים
  choice: పైకి వచ్చి
  rationale: עלה అనే క్రియలోని ‘పైకి వెళ్లడం/రావడం’ అనే సంప్రదాయ దిశాభావాన్ని నిలుపుతూ, కథకుని దృష్టికోణానికి అనుగుణంగా ‘పైకి వచ్చి’ అని అనువదించబడింది.
- source_word: מִשְּׁבִי הַגּוֹלָה
  choice: చెరపట్టి తీసుకెళ్లినవారి చెరనుండి
  rationale: మూలంలోని ‘చెర’ మరియు ‘చెరగా తరలించబడినవారు’ అనే పరస్పర సంబంధిత రెండు భావాలను తెలుగులో సాధ్యమైనంత సహజంగా నిలుపుతుంది.
- source_word: אֲשֶׁר הֶגְלָה
  choice: బబులోను రాజు నెబుకద్నెజరు చెరపట్టి తీసుకెళ్లినవారి
  rationale: బలవంతంగా స్వదేశం నుండి తరలించిన చర్యను ‘చెరపట్టి తీసుకెళ్లిన’ అనే స్పష్టమైన, సాధారణ తెలుగు వ్యక్తీకరణతో తెలిపింది.
- source_word: נְבוּכַדְנֶצַּר
  choice: నెబుకద్నెజరు
  rationale: తెలుగు బైబిలు వాడుకలో సుపరిచితమైన నామరూపాన్ని అనుసరిస్తుంది.
- source_word: וַיָּשׁוּבוּ
  choice: తిరిగి వచ్చి
  rationale: שׁוב యొక్క ప్రాథమిక ‘తిరిగి రావడం’ భావాన్ని నిలుపుతుంది; వాక్యంలోని వర్ణనాత్మక క్రియల క్రమానికి సహజంగా సరిపోతుంది.
- source_word: לִירוּשָׁלַם וְלִיהוּדָה
  choice: యెరూషలేముకూ యూదాకూ
  rationale: మూలంలో రెండుసార్లు ఉన్న గమ్యార్థక విభక్తిని తెలుగులో ‘-కూ ... -కూ’ ద్వారా ప్రతిబింబిస్తుంది; యూదా ఇక్కడ విస్తృత ప్రాంతాన్ని సూచిస్తుంది.
- source_word: אִישׁ לְעִירוֹ
  choice: ప్రతి మనిషి తన పట్టణానికి
  rationale: మూలంలోని పుంలింగ ఏకవచన పంపిణీ వ్యక్తీకరణను నిలుపుతుంది. సందర్భంలో ఇది తిరిగి వచ్చినవారిని వారి కుటుంబ లేదా వంశ సంబంధ పట్టణాల ప్రకారం సూచిస్తుంది.
theological_decisions:
- issue: אִישׁ లోని పుంలింగ ప్రతినిధి భాష
  choice: ప్రతి మనిషి తన పట్టణానికి
  alternative: ప్రతి ఒక్కరూ తమ పట్టణానికి
  rationale: మూలంలోని పుంలింగ ఏకవచన రూపాన్ని అనవసరంగా లింగతటస్థం చేయకుండా నిలిపింది; అయితే సందర్భంలో కుటుంబాలతో కూడిన తిరిగివచ్చిన సమూహాలను కూడా ఇది పంపిణీ రీతిలో సూచించవచ్చు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన జాబితా-పరిచయ శైలిని ఉపయోగించాం. ‘ప్రాంతపు కుమారులు’ అనే అసహజ అక్షరానువాదం బదులు ‘ఆ ప్రాంతవాసులు’ అని ఇచ్చాం; చెర మరియు బలవంతపు తరలింపు అనే మూలంలోని ద్వంద్వ భావాన్ని మాత్రం నిలిపాం.
