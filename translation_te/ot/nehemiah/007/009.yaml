  rationale: నిర్బంధానంతర జనగణన జాబితాలో ఈ పదం సాధారణంగా ఒక కుటుంబ లేదా వంశ శ్రేణిని సూచిస్తుంది; ఇక్కడ ప్రత్యక్ష కుమారులు అనే అర్థం రాకుండా, సహజమైన ఆధునిక తెలుగులో ‘వంశస్థులు’ అని అనువదించాం.
