lexical_decisions:
- source_word: בְּנֵי
  choice: వంశస్థులు
  rationale: ఇది వంశావళి/జనగణన జాబితాలో ఒక కుటుంబానికి చెందిన సభ్యులను సూచించే నిర్మాణ బహువచనం. తెలుగులో ‘కుమారులు’ కంటే ‘వంశస్థులు’ ఈ సందర్భంలోని విస్తృత భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: זַכָּי
  choice: జక్కయి
  rationale: హీబ్రూ వ్యక్తినామాన్ని దాని ధ్వనికి దగ్గరగా తెలుగులో లిప్యంతరీకరించాం.
- source_word: שְׁבַע מֵאוֹת וְשִׁשִּׁים
  choice: ఏడువందల అరవై మంది
  rationale: హీబ్రూ సంఖ్యాపదబంధాన్ని సహజమైన తెలుగు పదరూపంలో ఇచ్చి, లెక్కించబడిన వ్యక్తులని స్పష్టం చేయడానికి ‘మంది’ చేర్చాం.
