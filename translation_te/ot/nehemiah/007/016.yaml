  rationale: వంశావళి, జనసంఖ్యా జాబితా సందర్భంలో בְּנֵי అనేది కేవలం ప్రత్యక్ష కుమారులను కాకుండా ఒక కుటుంబ వంశానికి చెందినవారిని సూచిస్తుంది; అందువల్ల ఆధునిక తెలుగులో ‘వంశస్థులు’ సహజంగా, స్పష్టంగా అర్థాన్ని అందిస్తుంది.
