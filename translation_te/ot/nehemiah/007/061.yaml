id: NEH.7.61
reference: Nehemiah 7:61
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אֵ֗לֶּה הָֽ/עוֹלִים֙ מִ/תֵּ֥ל מֶ֨לַח֙ תֵּ֣ל חַרְשָׁ֔א כְּר֥וּב אַדּ֖וֹן וְ/אִמֵּ֑ר וְ/לֹ֣א יָכְל֗וּ לְ/הַגִּ֤יד בֵּית אֲבוֹתָ/ם֙ וְ/זַרְעָ֔/ם אִ֥ם מִ/יִּשְׂרָאֵ֖ל הֵֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/061.yaml
  text: And these were the ones who came up from Tel-melah[a], Tel-harsha, Kerub, Addon, and Immer, but they were not able to declare their fathers’ houses or their offspring[c][b], whether they were from Israel.
translation:
  language: te
  text: తేల్-మేలహు, తేల్-హర్షా, కెరూబు, అద్దోను[a], ఇమ్మేరు నుండి వచ్చినవారు వీరే. అయితే వారు తమ పితృకుటుంబం, తమ వంశం ఏమిటో, తాము ఇశ్రాయేలు వారో కాదో[c] చెప్పలేకపోయారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఎజ్రా 2:59లో ఇక్కడి ‘అద్దోను’కు బదులుగా ‘అద్దాను’ అని ఉంది.
    reason: textual_variant
  - marker: c
    text: లేదా, “తాము ఇశ్రాయేలీయులా కాదా.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה הָעוֹלִים
  choice: వచ్చినవారు వీరే
  rationale: నిర్వాసం నుండి యూదాకు ‘పైకి రావడం’ అనే హెబ్రీయుల సందర్భోచిత భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: מִתֵּל מֶלַח תֵּל חַרְשָׁא כְּרוּב אַדּוֹן וְאִמֵּר
  choice: తేల్-మేలహు, తేల్-హర్షా, కెరూబు, అద్దోను, ఇమ్మేరు అనే ప్రాంతాల నుండి
  rationale: పేర్లను WLC హల్లుల ఆధారంగా లిప్యంతరీకరించి, జాబితా సందర్భంలో ఇవి వారు వచ్చిన ప్రాంతాలని స్పష్టం చేసింది. ఇక్కడ אַדּוֹן అద్దోను; ఎజ్రా 2:59లో భిన్న పాఠం ఉంది.
- source_word: וְלֹא יָכְלוּ לְהַגִּיד
  choice: తెలియజేయలేకపోయారు … నిరూపించుకోలేకపోయారు
  rationale: הגיד ప్రాథమికంగా ‘తెలియజేయు/ప్రకటించు.’ వంశావళి ధ్రువీకరణ సందర్భాన్ని తెలుగులో స్పష్టంగా ఉంచేందుకు చివరి ఉపవాక్యంలో ‘నిరూపించుకోలేకపోయారు’ అని సహజంగా అనుసంధానించింది.
- source_word: בֵּית אֲבוֹתָם
  choice: తమ పితృకుటుంబం
  rationale: ‘తమ తండ్రుల ఇల్లు’ అనే హెబ్రీయుల వంశావళి నుడికారానికి సహజమైన, సంక్షిప్త తెలుగు సమానార్థకం.
- source_word: וְזַרְעָם
  choice: తమ వంశం
  rationale: זֶרַע అక్షరార్థంగా ‘విత్తనం’; ఇక్కడ కుటుంబ మూలం లేదా సంతతి అనే వంశావళి భావం ఉంది. ‘వంశం’ సందర్భానికి సహజంగా సరిపోతుంది.
- source_word: אִם מִיִּשְׂרָאֵל הֵם
  choice: తాము ఇశ్రాయేలుకు చెందినవారో కాదో
  rationale: వారు ఇశ్రాయేలు వంశానికి చెందినవారా అనే అనిశ్చితిని, ‘ఇశ్రాయేలీయులు’ అని కుదించి చెప్పకుండా, మూలంలోని నిర్మాణానికి దగ్గరగా నిలుపుతుంది.
theological_decisions:
- issue: ఇశ్రాయేలుతో వారి సంబంధం జాతీయ గుర్తింపా లేక వంశ సంబంధమా
  choice: ఇశ్రాయేలుకు చెందినవారు
  alternative: ఇశ్రాయేలీయులు
  rationale: మూలంలోని מִיִּשְׂרָאֵל (‘ఇశ్రాయేలు నుండి/ఇశ్రాయేలుకు చెందిన’) అనే విస్తృతమైన పదబంధాన్ని కాపాడి, దాని భావాన్ని అవసరానికి మించి సంకుచితం చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన వచనశైలిని వాడింది. స్థలనామాలను సులభంగా చదవడానికి సంయుక్త పేర్లలో హైఫన్ ఉంచింది. నిషేధార్థక సమన్వయానికి ‘-గాని … -గాని’ వాడి, వంశావళిని తెలియజేయలేని భావాన్ని సహజంగా వ్యక్తం చేసింది.
