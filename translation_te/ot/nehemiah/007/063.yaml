translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన వంశావళి-జాబితా శైలి. ‘కుమారులు’ అనే పదం ప్రత్యక్ష సంతానంగా అపార్థమయ్యే అవకాశం ఉన్నందున ‘వంశస్థులు’ వాడబడింది. హీబ్రూలోని సంబంధవాచక ఏకవచనం ఏ బర్జిల్లయిని సూచిస్తుందో తెలుగులో స్పష్టత కోసం ‘ఈ బర్జిల్లయి’ అని పునరుక్తి చేయబడింది; భావం మాత్రం మార్చబడలేదు.
