id: NEH.7.63
reference: Nehemiah 7:63
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/מִן הַ/כֹּ֣הֲנִ֔ים בְּנֵ֥י חֳבַיָּ֖ה בְּנֵ֣י הַקּ֑וֹץ בְּנֵ֣י בַרְזִלַּ֗י אֲשֶׁ֣ר לָ֠קַח מִ/בְּנ֞וֹת בַּרְזִלַּ֤י הַ/גִּלְעָדִי֙ אִשָּׁ֔ה וַ/יִּקָּרֵ֖א עַל שְׁמָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/063.yaml
  text: 'And from the priests: the sons of Hobaiah[a], the sons of Hakkoz, the sons of Barzillai, who had taken a wife from the daughters of Barzillai the Gileadite and was called by their name.'
translation:
  language: te
  text: 'యాజకులలోనివారు: హోబయ్య[a] వంశస్థులు, హక్కోజు వంశస్థులు, గిలాదీయుడైన బర్జిల్లయి కుమార్తెలలో ఒకరిని భార్యగా చేసుకొని వారి పేరుతో పిలువబడిన బర్జిల్లయి వంశస్థులు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “గిలాదీయుడైన బర్జిల్లయి కుమార్తెలలో ఒకరిని భార్యగా చేసుకొని, వారి పేరుమీద పిలువబడిన బర్జిల్లయి వంశస్థులు.”
    reason: English POB audit-trail footnote a is retained in Telugu. It records the close alternative “took ... as a wife / was named after them” without changing the verse's sense.
lexical_decisions:
- source_word: וּמִן הַכֹּהֲנִים
  choice: యాజకులలో
  rationale: מִן యొక్క విభాగార్థాన్ని సహజమైన తెలుగు జాబితా శైలిలో తెలియజేస్తుంది; వాక్యారంభంలోని וּ సందర్భానుసారంగా ప్రత్యేకంగా అనువదించనవసరం లేదు.
- source_word: בְּנֵי
  choice: వంశస్థులు
  rationale: ఈ వంశావళి/నమోదు సందర్భంలో ఇది ప్రత్యక్ష కుమారులకంటే కుటుంబ వంశాన్ని సూచిస్తుంది; పునరావృత నిర్మాణాన్ని కూడా నిలుపుతుంది.
- source_word: חֳבַיָּה
  choice: హోబయ్య
  rationale: హీబ్రూ వ్యక్తి/వంశ నామానికి తెలుగు లిప్యంతరీకరణ.
- source_word: הַקּוֹץ
  choice: హక్కోజు
  rationale: నిర్దేశక ఉపపదం పేరులో భాగమైన సంప్రదాయ రూపాన్ని ప్రతిబింబించే తెలుగు లిప్యంతరీకరణ.
- source_word: בַרְזִלַּי
  choice: బర్జిల్లయి
  rationale: కుటుంబనామానికీ గిలాదీయుడైన పూర్వికుని పేరుకీ ఒకే రూపాన్ని నిలుపుతుంది.
- source_word: אֲשֶׁר לָקַח מִבְּנוֹת ... אִשָּׁה
  choice: కుమార్తెలలో ఒకరిని పెళ్లి చేసుకొని
  rationale: హీబ్రూ వివాహ ప్రయోగాన్ని ఆధునిక తెలుగులో సహజంగా, అర్థాన్ని జోడించకుండా వ్యక్తం చేస్తుంది.
- source_word: הַגִּלְעָדִי
  choice: గిలాదీయుడైన
  rationale: బర్జిల్లయి ప్రాంతీయ గుర్తింపును విశేషణ రూపంలో సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: וַיִּקָּרֵא עַל שְׁמָם
  choice: వారి పేరుతో పిలువబడ్డాడు
  rationale: నిఫల్ కర్మణి భావాన్ని, బహువచన ప్రత్యయాన్ని దగ్గరగా నిలుపుతుంది; పేరు ఆ కుటుంబం నుండి వచ్చిందనే భావం స్పష్టమవుతుంది.
