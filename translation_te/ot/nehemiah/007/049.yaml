lexical_decisions:
- source_word: בְּנֵי
  choice: కుమారులు
  rationale: వంశావళి జాబితాలోని హెబ్రీ నిర్మాణాన్ని సహజమైన తెలుగులో నిలుపుతుంది. ఇక్కడ ఈ పదం ప్రత్యక్ష కుమారులనే కాక వంశస్థులను లేదా కుటుంబవర్గాన్ని కూడా సూచించవచ్చు; ఆ విస్తృత అర్థాన్ని పాదసూచిక వివరిస్తుంది.
- source_word: חָנָן
  choice: హానాను
  rationale: హెబ్రీ వ్యక్తి లేదా వంశనామాన్ని తెలుగు ధ్వన్యనుసారంగా లిప్యంతరీకరించాం.
- source_word: גִדֵּל
  choice: గిద్దేలు
  rationale: హెబ్రీ నామంలోని ద్విత్వ ద ధ్వనిని, దీర్ఘ స్వరాన్ని ప్రతిబింబించేలా తెలుగు లిప్యంతరీకరణ చేశాం.
- source_word: גָחַר
  choice: గాహరు
  rationale: హెబ్రీ నామాన్ని దాని హల్లులు, అచ్చులకు దగ్గరగా తెలుగులో లిప్యంతరీకరించాం; హెబ్రీ ח ధ్వనికి సహజ తెలుగు రూపంగా హ వాడాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, జాబితా రూపంలోని సంక్షిప్తతను మరియు గౌరవప్రదమైన శైలిని నిలిపాం. పేర్లకు తెలుగు విభక్తి సహజంగా చేరేలా ఉకారాంత రూపాలను ఉపయోగించాం.
