  footnotes:
  - marker: a
    text: ఇక్కడ, అలాగే తరువాత మళ్లీ వచ్చే ప్రతి “కుమారులు” అనే మాటకు “వంశస్థులు” అని కూడా అనువదించవచ్చు. ఈ హెబ్రీ వంశావళి పదబంధం ప్రత్యక్ష కుమారులను మాత్రమే కాక ఒక వంశాన్ని లేదా కుటుంబశాఖను కూడా సూచించగలదు.
