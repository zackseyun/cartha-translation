source:
  edition: WLC
  text: ו/יאמר לָ/הֶ֗ם לֹ֣א יִפָּֽתְח֞וּ שַׁעֲרֵ֤י יְרוּשָׁלִַ֨ם֙ עַד חֹ֣ם הַ/שֶּׁ֔מֶשׁ וְ/עַ֨ד הֵ֥ם עֹמְדִ֛ים יָגִ֥יפוּ הַ/דְּלָת֖וֹת וֶ/אֱחֹ֑זוּ וְ/הַעֲמֵ֗יד מִשְׁמְרוֹת֙ יֹשְׁבֵ֣י יְרוּשָׁלִַ֔ם אִ֚ישׁ בְּ/מִשְׁמָר֔/וֹ וְ/אִ֖ישׁ נֶ֥גֶד בֵּיתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/003.yaml
  text: And I said to them[a], “The gates of Jerusalem must not be opened until the sun is hot. While they are still standing guard, let them shut the doors and fasten them. And appoint guards from the inhabitants of Jerusalem[c][b], each at his watch and each opposite his own house.”
translation:
  language: te
  text: 'అతడు వారితో ఇలా అన్నాడు[d]: “సూర్యుడు వేడెక్కే వరకు[a] యెరూషలేము ద్వారాలను తెరవకూడదు. కాపలాదారులు ఇంకా తమ స్థానాల్లో ఉండగానే, వారు ద్వారాల తలుపులను మూసి వాటిని బిగించాలి[b]. యెరూషలేము నివాసులలోనుంచి కాపలాదారులను[c] నియమించండి—ఒక్కొక్కరిని తన కాపలా స్థానంలో, ఒక్కొక్కరిని తన ఇంటి ఎదుట.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “సూర్యుని వేడి పెరిగే వరకు.” అంటే సూర్యోదయం కాగానే కాక, ఉదయం మరికొంత గడిచే వరకు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా “వాటిని పట్టి ఉంచాలి.” ఈ సందర్భంలో తలుపులను మూసిన తరువాత బిగించడం లేదా భద్రపరచడం అని అర్థం.
    reason: lexical_alternative
  - marker: c
    text: లేదా “యెరూషలేము నివాసులలోనుంచి కాపలా పాళ్లను ఏర్పాటు చేయండి.” హీబ్రూ పదం కాపలాదారులనూ, కాపలా విధులనూ లేదా పాళ్లనూ సూచించగలదు.
    reason: lexical_alternative
  - marker: d
    text: ఇక్కడ అందించిన హీబ్రూ పాఠంలో “అతడు అన్నాడు” అని ఉంది; సందర్భాన్ని అనుసరించే పాఠరూపంలో “నేను అన్నాను” అని ఉంటుంది.
    reason: textual_alternative
lexical_decisions:
- source_word: ו/יאמר לָ/הֶם
  choice: అతడు వారితో ఇలా అన్నాడు
  rationale: అందించిన హీబ్రూ పాఠంలోని ויאמר మూడవ పురుష ఏకవచన రూపం; అందువల్ల ఇంగ్లీషు consultation layer లోని “I said” కంటే మూలపాఠ రూపాన్నే ప్రధానంగా అనుసరించాం. సందర్భ సంబంధమైన పాఠభేదాన్ని పాదటిప్పణిలో తెలిపాం.
- source_word: לֹא יִפָּתְחוּ שַׁעֲרֵי יְרוּשָׁלִַם
  choice: యెరూషలేము ద్వారాలను తెరవకూడదు
  rationale: Niphal రూపంలోని నిషేధాన్ని సహజమైన తెలుగు కర్మణి-భావ ఆదేశంగా వ్యక్తం చేస్తుంది; ఇది కేవలం భవిష్యద్వాక్యం కాక బలమైన ఆదేశం.
- source_word: עַד חֹם הַשֶּׁמֶשׁ
  choice: సూర్యుడు వేడెక్కే వరకు
  rationale: హీబ్రూలోని సూర్యుని వేడి అనే స్పష్టమైన చిత్రాన్ని నిలుపుతూ, సూర్యోదయం కాగానే కాక ఉదయం మరికొంత గడిచిన తరువాత అనే భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וְעַד הֵם עֹמְדִים
  choice: కాపలాదారులు ఇంకా తమ స్థానాల్లో ఉండగానే
  rationale: עמד అక్షరార్థంగా ‘నిలుచు’; ఈ కాపలా సందర్భంలో విధి స్థానంలో ఉండడాన్ని సూచిస్తుంది. భావాన్ని స్పష్టం చేసినా మూలంలోని కాలసంబంధాన్ని నిలిపింది.
- source_word: יָגִיפוּ הַדְּלָתוֹת
  choice: వారు ద్వారాల తలుపులను మూసి
  rationale: הגיף అంటే తలుపులను మూయడం. ‘ద్వారాల తలుపులు’ అనడం నగరద్వారాల కదిలే తలుపు పలకలనే ఉద్దేశిస్తున్నట్లు తెలుగులో స్పష్టం చేస్తుంది.
- source_word: וֶאֱחֹזוּ
  choice: వాటిని బిగించాలి
  rationale: אחז అక్షరార్థంగా పట్టుకోవడం లేదా నిలిపి ఉంచడం; తలుపులు మూసిన తరువాతి సందర్భంలో వాటిని బిగించి భద్రపరచడమే భావం. నిర్దిష్టమైన గడియ పద్ధతిని మూలంలో లేనప్పుడు చేర్చలేదు.
- source_word: וְהַעֲמֵיד מִשְׁמְרוֹת יֹשְׁבֵי יְרוּשָׁלִַם
  choice: యెరూషలేము నివాసులలోనుంచి కాపలాదారులను నియమించండి
  rationale: העמיד ఇక్కడ నియమించి స్థానాల్లో నిలబెట్టడం; משמרות వ్యక్తులనో కాపలా పాళ్లనో సూచించవచ్చు. ప్రధాన పాఠంలో సహజమైన వ్యక్తి-సూచక రూపాన్ని తీసుకుని ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: אִישׁ בְּמִשְׁמָרוֹ וְאִישׁ נֶגֶד בֵּיתוֹ
  choice: ఒక్కొక్కరిని వారి వారి కాపలా స్థానంలో, ఒక్కొక్కరిని వారి వారి ఇంటి ఎదుట
  rationale: איש యొక్క పంపిణీ భావాన్ని ‘ఒక్కొక్కరిని’తో, נגד యొక్క స్థలసంబంధాన్ని ‘ఎదుట’తో నిలిపాం. పునరుక్త నిర్మాణం వేర్వేరు నియామకాల భావాన్ని పరిష్కరించకుండా ఉంచుతుంది.
theological_decisions:
- issue: మాట్లాడుతున్న వ్యక్తి మొదటి పురుషుడా, మూడవ పురుషుడా
  choice: అతడు వారితో ఇలా అన్నాడు
  alternative: నేను వారితో ఇలా అన్నాను
  rationale: అందించిన మూలపాఠం ויאמר అనే మూడవ పురుష రూపాన్ని కలిగి ఉంది; ఇంగ్లీషు POB మరియు సాధారణ సందర్భపఠనం మొదటి పురుషాన్ని ప్రతిబింబిస్తాయి. మూలంగా అందించిన రూపాన్ని ప్రధాన పాఠంలో ఉంచి వ్యత్యాసాన్ని పాదటిప్పణిలో పారదర్శకంగా తెలిపాం.
