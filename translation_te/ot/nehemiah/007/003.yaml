  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు స్పష్టంగా ఉండే ఆదేశ శైలిని వాడాం. ‘ద్వారాలు,’ ‘కాపలాదారులు,’ ‘కాపలా స్థానం’ వంటి ప్రస్తుత వాడుక పదాలను ఎంచుకున్నాం; స్థలవివరాలు మరియు కాపలా నియామకాల విషయంలో హీబ్రూ నిర్మాణంలోని అనిశ్చితిని అతిగా వివరణాత్మకంగా మార్చలేదు.
