  rationale: ఇది בֵּן పదం యొక్క బహువచన సమాసరూపం. జనగణన జాబితా సందర్భంలో ఒక కుటుంబ వంశానికి చెందినవారిని సూచిస్తుంది; మూలంలోని రూపాన్ని సహజమైన తెలుగులో నిలుపుతూ ‘కుమారులు’ అని అనువదించాం.
- source_word: חָשֻׁם
