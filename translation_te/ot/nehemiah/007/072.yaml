id: NEH.7.72
reference: Nehemiah 7:72
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֵּשְׁב֣וּ הַ/כֹּהֲנִ֣ים וְ/הַ/לְוִיִּ֡ם וְ/הַ/שּׁוֹעֲרִים֩ וְ/הַ/מְשֹׁרְרִ֨ים וּ/מִן הָ/עָ֧ם וְ/הַ/נְּתִינִ֛ים וְ/כָל יִשְׂרָאֵ֖ל בְּ/עָרֵי/הֶ֑ם וַ/יִּגַּע֙ הַ/חֹ֣דֶשׁ הַ/שְּׁבִיעִ֔י וּ/בְנֵ֥י יִשְׂרָאֵ֖ל בְּ/עָרֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/072.yaml
  text: So the priests[a], the Levites, the gatekeepers, the singers, some of the people, the temple servants, and all Israel lived in their cities. And when the seventh month arrived[b], the sons of Israel were in their cities.
translation:
  language: te
  text: ఈ విధంగా యాజకులు, లేవీయులు, ద్వారపాలకులు, గాయకులు, ప్రజల్లో కొందరు, ఆలయ సేవకులు[a], ఇశ్రాయేలీయులందరూ తమ తమ పట్టణాల్లో నివసించారు. ఏడో నెల వచ్చినప్పుడు, ఇశ్రాయేలు కుమారులు[b] తమ తమ పట్టణాల్లో ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘నెతీనీయులు’; ఇది ఆలయ సేవకులైన ఈ ప్రత్యేక వర్గానికి సంప్రదాయంగా వాడే లిప్యంతరీకరణ.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘ఇశ్రాయేలీయులు’ / ‘ఇశ్రాయేలు ప్రజలు.’ హీబ్రూలో అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులు’ అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשְׁבוּ
  choice: నివసించారు
  rationale: ישׁב ఇక్కడ పునరావాస సందర్భంలో ‘నివసించడం/స్థిరపడడం’ అనే అర్థం ఇస్తుంది; ‘నివసించారు’ సహజంగా, గౌరవప్రదంగా ఉంది.
- source_word: הַכֹּהֲנִים
  choice: యాజకులు
  rationale: כהניםకు ఆధునిక ప్రామాణిక తెలుగు బైబిలు వాడుకలో స్పష్టమైన సమానార్థకం.
- source_word: הַלְוִיִּם
  choice: లేవీయులు
  rationale: లేవి వంశానికి, ఆలయ సేవకు సంబంధించిన ఈ స్థిర నామాన్ని తెలుగు సంప్రదాయ రూపంలో ఉంచుతుంది.
- source_word: הַשּׁוֹעֲרִים
  choice: ద్వారపాలకులు
  rationale: ద్వారాలను కాపాడే బాధ్యతను స్పష్టంగా తెలిపే సహజ తెలుగు పదం.
- source_word: הַמְשֹׁרְרִים
  choice: గాయకులు
  rationale: ఈ కృదంత రూపం ముఖ్యంగా ఆలయ సేవలో పాడేవారిని సూచిస్తుంది; ‘గాయకులు’ నేరుగా మూలార్థాన్ని అందిస్తుంది.
- source_word: וּמִן הָעָם
  choice: ప్రజల్లో కొందరు
  rationale: ‘ప్రజలలోనుండి’ అనే భాగార్థక భావాన్ని సహజ తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: הַנְּתִינִים
  choice: ఆలయ సేవకులు
  rationale: ఆలయ సేవకు నియమితమైన ప్రత్యేక వర్గం యొక్క కార్యాన్ని ఆధునిక పాఠకులకు స్పష్టంగా తెలియజేస్తుంది; సంప్రదాయ లిప్యంతరీకరణను పాదటిప్పణిలో ఉంచాం.
- source_word: וְכָל יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులందరూ
  rationale: సమస్త ఇశ్రాయేలు ప్రజలను సూచించే సమూహార్థాన్ని సహజ తెలుగులో అందిస్తుంది.
- source_word: בְּעָרֵיהֶם
  choice: తమ తమ పట్టణాల్లో
  rationale: ప్రతి వర్గం లేదా కుటుంబం తమకు చెందిన నివాస పట్టణాల్లో ఉన్నదనే పంపిణీ భావాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: וַיִּגַּע
  choice: వచ్చినప్పుడు
  rationale: కాలసూచక నామంతో נגע అంటే ఆ కాలం ‘చేరడం/రావడం’; తెలుగు వాక్యంలో ‘వచ్చినప్పుడు’ సహజంగా కాలమార్పును సూచిస్తుంది.
- source_word: הַחֹדֶשׁ הַשְּׁבִיעִי
  choice: ఏడో నెల
  rationale: హీబ్రూ క్యాలెండరు వ్యక్తీకరణకు నేరమైన, సాధారణ తెలుగు అనువాదం.
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: בני అనే మూలంలోని పుంలింగ బహువచన రూపాన్ని నిలుపుతుంది; ఇది సందర్భంలో మొత్తం ఇశ్రాయేలు ప్రజలకు వాడిన సమూహనామమని పాదటిప్పణి వివరిస్తుంది.
theological_decisions:
- issue: בני ישראל అనే లింగసూచక సమూహ వ్యక్తీకరణ
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలీయులు / ఇశ్రాయేలు ప్రజలు
  rationale: హీబ్రూ పదబంధంలోని ‘కుమారులు’ అనే రూపాన్ని ప్రధాన పాఠ్యంలో నిలిపి, అది సందర్భంలో సమస్త ప్రజలను సూచించే జాతినామంగా పనిచేస్తుందని పాదటిప్పణిలో తెలియజేయడం మూలనిష్ఠతను, పాఠక స్పష్టతను రెండింటినీ కాపాడుతుంది.
- issue: הַנְּתִינִים అనే సంస్థాగత వర్గనామం
  choice: ఆలయ సేవకులు
  alternative: నెతీనీయులు
  rationale: కార్యాధారిత అనువాదం ఆధునిక పాఠకులకు వెంటనే అర్థమవుతుంది; ప్రత్యేక చారిత్రక నామాన్ని పాదటిప్పణిలో భద్రపరచడం ఆడిటబిలిటీని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. జాబితా నిర్మాణాన్ని స్పష్టంగా ఉంచి, వర్గనామాలకు సాధారణంగా అర్థమయ్యే పదాలను ఎంచుకున్నాం. మూలంలోని పునరుక్తి మరియు రెండో వాక్యపు కాలమార్పు నిలుపబడ్డాయి.
