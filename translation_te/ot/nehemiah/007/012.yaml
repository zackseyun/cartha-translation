  text: ఏలాము కుమారులు, 1,254.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: కుమారులు
  rationale: ఇది בֵּן పదానికి బహువచన నిర్మిత రూపం. వంశావళి, జాబితా సందర్భంలో ఒక కుటుంబం లేదా వంశానికి చెందినవారిని సూచిస్తుంది. ‘కుమారులు’ హెబ్రీ మూలంలోని వంశపారంపర్య నుడికారాన్ని నిలుపుతూ తెలుగులో సహజంగా ఉంటుంది.
- source_word: עֵילָם
  choice: ఏలాము
  rationale: ఇక్కడ ఇది భౌగోళిక ప్రాంతం కంటే తిరిగి వచ్చినవారి కుటుంబ లేదా వంశ నామం. అందువల్ల పేరును అనువదించకుండా తెలుగులో లిప్యంతరీకరించాం.
- source_word: אֶלֶף מָאתַיִם חֲמִשִּׁים וְאַרְבָּעָה
  choice: 1,254 మంది
  rationale: హెబ్రీ సంఖ్యా పదబంధం మొత్తం 1,254ను సూచిస్తుంది. జనగణన తరహా జాబితాలో అంకెలు చదవడానికి సులభం; తెలుగులో వ్యక్తుల సంఖ్య అని స్పష్టంగా, సహజంగా తెలియజేయడానికి ‘మంది’ చేర్చాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సంక్షిప్త జనగణన/వంశ జాబితా శైలి. మూలంలోని కుటుంబ నామం, సంఖ్య యథాతథంగా నిలుపబడ్డాయి.
