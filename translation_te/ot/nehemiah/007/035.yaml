  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: వంశస్థులు
  rationale: నిర్బంధానంతర జనగణన, వంశావళి జాబితాల్లో ఈ పదం ఒక కుటుంబ లేదా వంశ సమూహాన్ని సూచిస్తుంది. తెలుగులో ‘వంశస్థులు’ ఆ భావాన్ని సహజంగా, సంక్షిప్తంగా తెలియజేస్తుంది; ‘కుమారులు’ అన్నది కేవలం ప్రత్యక్ష కుమారులనే సూచించే అవకాశం ఉంది.
- source_word: חָרִם
  choice: హారిము
  rationale: ఇది వ్యక్తి లేదా వంశానికి చెందిన సొంత పేరు; హీబ్రూ ఉచ్చారణను అనుసరించి తెలుగులో లిప్యంతరీకరించబడింది.
- source_word: שְׁלֹשׁ מֵאוֹת וְעֶשְׂרִים
  choice: 320 మంది
  rationale: హీబ్రూ సంఖ్య ‘మూడు వందల ఇరవై’ అని స్పష్టంగా ఉంది. జనుల లెక్క కావడంతో తెలుగులో సహజంగా ఉండేందుకు ‘మంది’ చేర్చబడింది; సంఖ్యను అంకెల్లో ఇవ్వడం జాబితా పఠనాన్ని సులభం చేస్తుంది.
