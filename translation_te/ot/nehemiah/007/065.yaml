source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר הַ/תִּרְשָׁ֨תָא֙ לָ/הֶ֔ם אֲשֶׁ֥ר לֹא יֹאכְל֖וּ מִ/קֹּ֣דֶשׁ הַ/קֳּדָשִׁ֑ים עַ֛ד עֲמֹ֥ד הַ/כֹּהֵ֖ן לְ/אוּרִ֥ים וְ/תוּמִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/065.yaml
  text: And the governor said to them that they should not eat from the most holy things until a priest should arise with Urim and Thummim[a][b].
translation:
  language: te
  text: అప్పుడు అధిపతి[a] వారితో, ఊరీము, తుమ్మీములతో ఒక యాజకుడు నిలబడే వరకు వారు అతి పరిశుద్ధమైన వాటిలో[b] ఏదీ తినకూడదని చెప్పాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తిర్షాతా”; ఇది పర్షియన్ పరిపాలనా బిరుదు.
    reason: lexical_alternative
  - marker: b
    text: అంటే, యాజకులకు కేటాయించిన “అతి పరిశుద్ధమైన” పవిత్ర ఆహారభాగాలు; ఇది దేవాలయంలోని అతి పరిశుద్ధ స్థలాన్ని సూచించదు.
    reason: cultural_note
lexical_decisions:
- source_word: הַתִּרְשָׁתָא
  choice: అధిపతి
  rationale: ఇది పర్షియా పరిపాలనా బిరుదు. ఆధునిక తెలుగు పాఠకులకు పదవిని స్పష్టంగా తెలియజేయడానికి అర్థానువాదం చేశాం; మూల బిరుదును పాదసూచికలో ఉంచాం.
- source_word: אֲשֶׁר לֹא יֹאכְלוּ
  choice: వారు ... ఏదీ తినకూడదని
  rationale: ఈ సందర్భంలో అధిపతి విధించిన నిషేధాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: מִקֹּדֶשׁ הַקֳּדָשִׁים
  choice: అతి పరిశుద్ధమైన వాటిలో ఏదీ
  rationale: హీబ్రూ పదబంధంలోని అత్యుత్తమ స్థాయి భావాన్ని నిలుపుతూ, సందర్భానుసారం యాజకులకు కేటాయించిన పరిశుద్ధ ఆహారభాగాలను సూచిస్తుంది; అతి పరిశుద్ధ స్థలాన్ని సూచించదు.
- source_word: עַד עֲמֹד הַכֹּהֵן
  choice: యాజకుడు నియమించబడే వరకు
  rationale: עֲמֹד పదానికి అక్షరార్థంగా ‘నిలుచు/లేచు’ అనే భావమున్నా, ఇక్కడ ఊరీము తుమ్మీములతో అధికారికంగా సేవచేయగల యాజకుడు అందుబాటులోకి రావడాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: לְאוּרִים וְתוּמִּים
  choice: ఊరీము తుమ్మీములు గల
  rationale: ఇవి యాజక సంబంధమైన పవిత్ర నిర్ణయ సాధనాల సంప్రదాయ పేర్లు కనుక లిప్యంతరీకరించాం; ‘గల’ అనేది వాటిని కలిగి లేదా ఉపయోగించగల యాజకుడనే విస్తృత సంబంధాన్ని నిలుపుతుంది.
theological_decisions:
- issue: ‘అతి పరిశుద్ధమైనవి’ దేనిని సూచిస్తుంది?
  choice: యాజకులకు చెందిన అతి పరిశుద్ధ ఆహారభాగాలు లేదా అర్పణల భాగాలు
  alternative: దేవాలయంలోని అతి పరిశుద్ధ స్థలం
  rationale: సందర్భం వంశావళి నిర్ధారణ కాని యాజకులు పరిశుద్ధ ఆహారం తినే హక్కు గురించి మాట్లాడుతోంది; దేవాలయ అంతర్భాగంలో ప్రవేశం గురించి కాదు.
- issue: పర్షియా పరిపాలనా బిరుదు అనువాదం
  choice: అధిపతి
  alternative: తిర్షాతా
  rationale: ఇది వ్యక్తి పేరు కాక పరిపాలనా బిరుదు. ప్రధాన పాఠంలో అర్థాన్ని స్పష్టంగా ఇచ్చి, మూల రూపాన్ని పాదసూచికలో భద్రపరిచాం.
- issue: ఊరీము తుమ్మీములతో యాజకుని నిరీక్షణ
  choice: వాటి ద్వారా నిర్ణయం తెలియజేయగల యాజకుడు నియమించబడే వరకు
  alternative: ఒక నిర్దిష్ట యాజకుడు అక్షరార్థంగా లేచి నిలబడే వరకు
  rationale: భవిష్యత్తులో అవసరమైన యాజక సేవ అందుబాటులోకి వచ్చే వరకు నిషేధం కొనసాగుతుందనే సందర్భార్థాన్ని ఇస్తుంది; యాజక నిర్ణయ విధానంపై పాఠ్యంలో లేనంత వివరణను జోడించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడాం. పరిపాలనా బిరుదును అర్థానువాదం చేసి, సంప్రదాయ యాజక పదాలను లిప్యంతరీకరించాం. మూలంలోని భవిష్య నిరీక్షణను స్పష్టంగా ఉంచుతూ అనవసర సిద్ధాంత వివరణను నివారించాం.
