lexical_decisions:
- source_word: בְּנֵי
  choice: వంశస్థులు
  rationale: జనగణన జాబితా సందర్భంలో ఈ పదం ప్రత్యక్ష కుమారులను మాత్రమే కాకుండా ఒక వంశం లేదా కుటుంబ సమూహానికి చెందినవారిని సూచిస్తుంది; అందువల్ల ఆధునిక తెలుగులో ‘వంశస్థులు’ సహజంగా, స్పష్టంగా అర్థాన్ని అందిస్తుంది.
- source_word: סְנָאָה
  choice: సెనాయా
  rationale: ఇది వ్యక్తి లేదా వంశానికి సంబంధించిన సొంత పేరు; హీబ్రూ రూపాన్ని తెలుగు ధ్వన్యనుకరణలో ‘సెనాయా’గా ఇచ్చాం.
- source_word: שְׁלֹשֶׁת אֲלָפִים תְּשַׁע מֵאוֹת וּשְׁלֹשִׁים
  choice: మూడు వేల తొమ్మిది వందల ముప్పై మంది
  rationale: హీబ్రూ సంఖ్యాక్రమాన్ని సహజమైన తెలుగు పదరూపంలో ఇచ్చాం. లెక్కించబడినవారు మనుషులు కావడంతో ‘మంది’ చేర్చడం తెలుగులో అవసరమైన సహజత్వాన్ని ఇస్తుంది.
