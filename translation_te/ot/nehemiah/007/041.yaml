lexical_decisions:
- source_word: בְּנֵי
  choice: కుమారులు
  rationale: వంశావళి-జాబితా సందర్భంలో ఇది పష్హూరు కుటుంబానికి లేదా వంశానికి చెందిన వారిని సమూహంగా సూచిస్తుంది. మూలంలోని రూపాన్ని స్పష్టంగా నిలుపుతూ, తెలుగులో సహజంగా ఉండేందుకు ‘కుమారులు’ అని అనువదించబడింది.
- source_word: פַשְׁחוּר
  choice: పష్హూరు
  rationale: ఇది వ్యక్తి పేరు; అనువదించకుండా, హీబ్రూ ఉచ్చారణకు సమీపంగా లిప్యంతరీకరించబడింది.
- source_word: אֶלֶף מָאתַיִם אַרְבָּעִים וְשִׁבְעָה
  choice: 1,247 మంది
  rationale: హీబ్రూ సంఖ్యా పదబంధం మొత్తం 1,247ను సూచిస్తుంది. జనగణన జాబితాలో సులభంగా చదవడానికి అంకెలలో ఇచ్చి, లెక్కించబడిన వ్యక్తుల సంఖ్య అని సహజంగా తెలియజేయడానికి ‘మంది’ చేర్చబడింది.
