lexical_decisions:
- source_word: בְּנֵי
  choice: వంశస్థులు
  rationale: తిరిగి వచ్చినవారి ఈ జాబితాలో ఈ పదం పేరుపొందిన పూర్వికుని కుటుంబ లేదా వంశ సమూహాన్ని సూచిస్తుంది. తెలుగులో ‘కుమారులు’ కంటే ‘వంశస్థులు’ ఈ సందర్భార్థాన్ని సహజంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: אֲדֹנִיקָם
  choice: అదోనీకాము
  rationale: వ్యక్తి పేరును అనువదించకుండా, తెలుగులో సహజంగా పలికే విధంగా లిప్యంతరీకరించబడింది.
- source_word: שֵׁשׁ מֵאוֹת שִׁשִּׁים וְשִׁבְעָה
  choice: ఆరువందల అరవైఏడుగురు
  rationale: హీబ్రూ సంఖ్య 667ను ప్రామాణిక ఆధునిక తెలుగు సంఖ్యారూపంలో ఇచ్చి, వ్యక్తులను లెక్కిస్తున్నందున ‘గురు’ ప్రత్యయం వాడబడింది.
