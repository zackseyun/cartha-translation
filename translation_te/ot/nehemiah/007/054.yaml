  text: the sons of Bazlith, the sons of Mehida, the sons of Harsha—
translation:
  language: te
  text: బజ్లీతు వంశస్థులు, మెహీదా వంశస్థులు, హర్షా వంశస్థులు—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: -లు (వంశస్థుల సమూహాన్ని సూచించే బహువచన రూపం)
  rationale: ఈ తిరిగివచ్చిన వారి జాబితాలో בְּנֵי అనేది అక్షరార్థంగా ‘కుమారులు’ అయినా, కుటుంబం లేదా వంశానికి చెందిన వారిని సూచిస్తుంది. తెలుగులో ప్రతి పేరుకు ‘కుమారులు’ అని పెట్టడం కంటే, వ్యక్తినామానికి బహువచన ప్రత్యయం జోడించడం జాబితా శైలిలో సహజంగా ఉండి సమూహ సభ్యత్వాన్ని తెలియజేస్తుంది.
- source_word: בַצְלִית
  choice: బస్లీ
  rationale: ఇది వ్యక్తి లేదా వంశనామంగా పనిచేసే ప్రత్యేక నామం; అర్థానువాదం చేయకుండా హీబ్రూ రూపానికి దగ్గరగా తెలుగు లిప్యంతరీకరణ చేయబడింది. צ ను ‘స’, ת ను ‘త’గా ప్రతిబింబించే ‘బస్లీతు’ సాధ్యమైనా, వంశసమూహ బహువచనానికి అనువుగా మూలనామాన్ని ‘బస్లీ’గా ఉంచి ‘లు’ చేర్చాం.
- source_word: מְחִידָא
  choice: మెహీదా
  rationale: ప్రత్యేక నామాన్ని అనువదించకుండా హీబ్రూ వ్యంజన-స్వర నిర్మాణానికి దగ్గరగా తెలుగులో లిప్యంతరీకరించాం; ח కు సాధారణ పాఠకులకు సహజమైన ‘హ’ను వాడాం.
- source_word: חַרְשָׁא
  choice: హర్షా
  rationale: ఇక్కడ పదం పేరుగా పనిచేస్తున్నందున దానికి సాధ్యమైన నిఘంటు అర్థాన్ని రుద్దకుండా లిప్యంతరీకరించాం. ח ను ‘హ’, שׁ ను ‘ష’గా ప్రతిబింబించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, పేర్ల జాబితాకు సహజమైన సంక్షిప్త నిర్మాణం వాడబడింది. మూలంలోని వరుసగా మూడుసార్లు వచ్చే בְּנֵי భావం ప్రతి పేరుకు జోడించిన ‘-లు’ ద్వారా నిలుపబడింది. చివరి దీర్ఘ విరామచిహ్నం జాబితా తదుపరి వచనంలో కొనసాగుతుందని సూచిస్తుంది.
