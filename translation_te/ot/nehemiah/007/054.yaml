    rationale: The draft omits the name’s final ת and renders צ as స; moreover, adding -లు directly produces a modified name rather than preserving the proper name.
  - severity: medium
    issue: The repeated בני expressions are not adequately represented by name-final plural forms.
    rationale: While the list concerns family groups, a repeated Telugu group term more transparently preserves the source’s threefold בני structure.
  revised_text: బజ్లీతు వంశస్థులు, మెహీదా వంశస్థులు, హర్షా వంశస్థులు—
