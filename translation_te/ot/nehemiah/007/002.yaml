id: NEH.7.2
reference: Nehemiah 7:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וָ/אֲצַוֶּ֞ה אֶת חֲנָ֣נִי אָחִ֗/י וְ/אֶת חֲנַנְיָ֛ה שַׂ֥ר הַ/בִּירָ֖ה עַל יְרוּשָׁלִָ֑ם כִּי הוּא֙ כְּ/אִ֣ישׁ אֱמֶ֔ת וְ/יָרֵ֥א אֶת הָ/אֱלֹהִ֖ים מֵ/רַבִּֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/002.yaml
  text: Then I appointed my brother Hanani and Hananiah[a], the commander of the fortress, over Jerusalem[b], because he was a faithful man and feared God more than many.
translation:
  language: te
  text: అప్పుడు నేను నా సోదరుడు హనానీని, కోట అధిపతి హనన్యాను యెరూషలేముపై నియమించాను. ఎందుకంటే అతడు[b] నమ్మకమైన వ్యక్తి[a], మరియు అనేకులకంటే ఎక్కువగా దేవునికి భయపడేవాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సత్యవంతుడు”; లేదా, “నమ్మదగిన వ్యక్తి.”
    reason: lexical_alternative
  - marker: b
    text: “అతడు” అనే ఏకవచనం అత్యంత సహజంగా హనన్యాను సూచిస్తుంది. అయితే ఈ ప్రశంస ఇద్దరి నియామకాన్నీ సాధారణంగా సమర్థిస్తుందని కొందరు అర్థం చేసుకుంటారు.
    reason: alternative_reading
lexical_decisions:
- source_word: וָאֲצַוֶּה
  choice: నియమించాను
  rationale: צוה సాధారణంగా ‘ఆజ్ఞాపించు’ అని అర్థమైనా, ఇక్కడ వ్యక్తులను యెరూషలేముపై బాధ్యతలో ఉంచే పరిపాలనా సందర్భం ఉంది. అందువల్ల ‘నియమించాను’ సహజంగా ఆ కార్యార్థాన్ని తెలియజేస్తుంది.
- source_word: חֲנָנִי אָחִי
  choice: నా సోదరుడు హనానీని
  rationale: ఆఖి అనే 1వ పురుష ఏకవచన సంబంధరూపం హనానీ నెహెమ్యా సోదరుడని స్పష్టంగా తెలియజేస్తుంది; ఆధునిక తెలుగులో ఈ పదక్రమం సహజం.
- source_word: חֲנַנְיָה
  choice: హనన్యా
  rationale: వ్యక్తినామాన్ని తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: שַׂר הַבִּירָה
  choice: కోట అధిపతి
  rationale: שַׂר నాయకుడు లేదా అధికారి; בִּירָה రక్షణగల కోట లేదా దుర్గ సముదాయాన్ని సూచిస్తుంది. ‘కోట అధిపతి’ సంక్షిప్తంగా, సులభంగా ఆ పరిపాలనా-సైనిక పాత్రను తెలియజేస్తుంది.
- source_word: עַל יְרוּשָׁלָ͏ִם
  choice: యెరూషలేముపై
  rationale: నియామక క్రియ తర్వాత עַל ఒక స్థలంపై అధికారం లేదా బాధ్యతను సూచిస్తుంది. ‘యెరూషలేముపై నియమించాను’ మూల నిర్మాణాన్ని నిలుపుతుంది.
- source_word: כִּי הוּא
  choice: ఎందుకంటే అతడు
  rationale: כִּי నియామకానికి కారణాన్ని పరిచయం చేస్తుంది. ఏకవచన సర్వనామాన్ని బహువచనంగా మార్చకుండా మూలంలోని సూచనను నిలిపాం.
- source_word: כְּאִישׁ אֱמֶת
  choice: నమ్మకమైన వ్యక్తి
  rationale: אֱמֶת సత్యం, విశ్వసనీయత, నమ్మకత్వం అనే భావాలను కలిగి ఉంది. పదవికి తగిన గుణాన్ని వర్ణించే ఈ సందర్భంలో ‘నమ్మకమైన వ్యక్తి’ సహజమైనది; ప్రత్యామ్నాయ భావాలను పాదటిప్పణిలో ఉంచాం.
- source_word: וְיָרֵא אֶת־הָאֱלֹהִים
  choice: దేవునికి భయపడేవాడు
  rationale: ఈ పదబంధం దేవునిపట్ల భక్తిపూర్వక భయాన్ని నేరుగా వర్ణిస్తుంది. తెలుగు బైబిలు భాషలో అర్థమయ్యే సహజమైన వ్యక్తీకరణను నిలిపాం.
- source_word: מֵרַבִּים
  choice: అనేకులకంటే ఎక్కువగా
  rationale: తులనార్థక מן తో רַבִּים కలసి ‘అనేకులకంటే ఎక్కువగా’ అనే అర్థమిస్తుంది. ‘అందరికంటే’ లేదా ‘చాలామందికంటే’ అని బిగించకుండా మూలంలోని తులనను కాపాడాం.
theological_decisions:
- issue: ప్రశంసా వాక్యంలోని ఏకవచన సర్వనామం ఎవరిని సూచిస్తుంది?
  choice: ‘అతడు’ అనే ఏకవచనాన్ని నిలిపి, అది సమీప పూర్వపదమైన హనన్యాను ప్రధానంగా సూచించేలా అనువదించాం.
  alternative: ఈ ప్రశంస ఇద్దరి నియామకాన్నీ సమష్టిగా సమర్థిస్తుందని కొందరు గ్రహిస్తారు.
  rationale: హీబ్రూ ఏకవచన సర్వనామం, దాని వెంట వచ్చే ఏకవచన వర్ణనలు సహజంగా సమీపంలో ఉన్న హనన్యాను సూచిస్తాయి. అయితే సందర్భం ఇద్దరి నియామకానికి సంబంధించినది కాబట్టి ఆ ఉద్రిక్తతను ‘వారు’ అని మార్చి తొలగించకుండా పాదటిప్పణిలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడబడింది. పరిపాలనా సందర్భానికి ‘నియమించాను,’ సులభ పఠనానికి ‘కోట అధిపతి’ ఎంచుకున్నాం. మూలంలోని ఏకవచన సూచనను ఉద్దేశపూర్వకంగా నిలిపాం.
