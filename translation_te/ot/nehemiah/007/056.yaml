lexical_decisions:
- source_word: בְּנֵי
  choice: సంతతివారు
  rationale: వంశావళి జాబితాలో ఈ హెబ్రీ పదం అక్షరార్థంగా ‘కుమారులు’ అయినప్పటికీ, సాధారణంగా ఒక వ్యక్తి వంశానికి లేదా కుటుంబశాఖకు చెందినవారిని సూచిస్తుంది. ఆధునిక తెలుగులో ‘సంతతివారు’ ఈ సందర్భార్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: נְצִיחַ
  choice: నెజీయ
  rationale: ఇది వ్యక్తినామం; అనువదించకుండా హెబ్రీ ఉచ్చారణకు సమీపంగా తెలుగు లిప్యంతరీకరణ చేయబడింది.
- source_word: חֲטִיפָא
  choice: హటీఫా
  rationale: ఇది వ్యక్తినామం; అనువదించకుండా హెబ్రీ హల్లులు, అచ్చులను సాధ్యమైనంత సమీపంగా ప్రతిబింబించే తెలుగు రూపం ఎంచుకోబడింది.
