lexical_decisions:
- source_word: בְּנֵי
  choice: వంశస్థులు
  rationale: జనగణనకు సంబంధించిన ఈ వంశావళి జాబితాలో ఈ పదం ఒక వ్యక్తి కుమారులను మాత్రమే కాక అతని వంశానికి చెందినవారిని సూచిస్తుంది. అందువల్ల ఆధునిక తెలుగులో సహజంగా, సందర్భానికి తగినట్లు ‘వంశస్థులు’ అని అనువదించబడింది.
- source_word: אָרַח
  choice: ఆరహు
  rationale: ఇది వ్యక్తి లేదా వంశానికి సంబంధించిన హీబ్రూ సొంతపేరు. మూలంలోని చివరి గొంతు ధ్వనిని తెలుగులో సాధ్యమైనంత దగ్గరగా చూపిస్తూ ‘ఆరహు’ అని లిప్యంతరీకరించబడింది.
- source_word: שֵׁשׁ מֵאוֹת חֲמִשִּׁים וּשְׁנָיִם
  choice: ఆరువందల యాభై ఇద్దరు
  rationale: హీబ్రూ సంఖ్య 652ను తెలుగులో వ్యక్తులను లెక్కించే సహజమైన రూపంలో అందించింది.
