id: NEH.7.52
reference: Nehemiah 7:52
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: בְּנֵי בֵסַ֥י בְּנֵי מְעוּנִ֖ים בְּנֵ֥י נפושסים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/052.yaml
  text: the sons of Besai[a], the sons of Meunim[c][b], the sons of Nephushesim.
translation:
  language: te
  text: బేసై వంశస్థులు[a], మెయూనీము వంశస్థులు[b], నెఫూషెసీము వంశస్థులు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఈ పేరును “బెస్సై” అని కూడా రాయవచ్చు; ధ్వన్యంతరీకరణ పద్ధతులు, సమాంతర పాఠ సంప్రదాయాల వల్ల రూపభేదాలు వచ్చాయి.
    reason: lexical_alternative
  - marker: b
    text: ఇది ఒక జాతి లేదా ప్రజావర్గాన్ని సూచిస్తే, “మెయూనీయులు” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: కొన్ని పాఠ సంప్రదాయాల్లో ఈ పేరు “నెఫూషీము” అనే రూపంలో కనిపిస్తుంది; ఇక్కడి రూపం హీబ్రూ పాఠంలోని అక్షరరూపాన్ని మరింత ప్రత్యక్షంగా అనుసరిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: వంశస్థులు
  rationale: తిరిగి వచ్చినవారి వంశాల జాబితాలో ఈ పదం ప్రత్యక్ష కుమారులను మాత్రమే కాకుండా ఒక కుటుంబం లేదా వంశానికి చెందినవారిని సూచిస్తుంది. అందువల్ల ఆధునిక తెలుగులో సహజంగా, సందర్భానికి తగినట్లుగా ‘వంశస్థులు’ అని అనువదించాం.
- source_word: בֵסַי
  choice: బేసై
  rationale: హీబ్రూ వ్యక్తి/వంశనామాన్ని తెలుగు లిపిలో ధ్వన్యంతరీకరించాం.
- source_word: מְעוּנִים
  choice: మెయూనీము
  rationale: ఇది ప్రజావర్గ సూచన కావచ్చన్న సందిగ్ధతను తీర్చకుండా, జాబితాలోని పేరుగా హీబ్రూ రూపాన్ని ధ్వన్యంతరీకరించాం.
- source_word: נפושסים
  choice: నెఫూషెసీము
  rationale: WLCలో ఉన్న హీబ్రూ వ్యంజన రూపాన్ని సాధ్యమైనంత దగ్గరగా ప్రతిబింబించేలా ధ్వన్యంతరీకరించాం; సమాంతర పాఠాల్లోని రూపాన్ని ప్రధాన పాఠంలోకి దిగుమతి చేయలేదు.
