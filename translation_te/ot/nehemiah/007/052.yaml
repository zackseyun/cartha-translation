translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, జాబితా శైలికి తగిన సంక్షిప్తమైన గంభీర భాష వాడబడింది. ‘కుమారులు’ అనే అక్షరార్థం కంటే వంశజాబితా సందర్భాన్ని స్పష్టంగా తెలిపే ‘వంశస్థులు’ ఎంచుకోబడింది. అన్ని పాదటిప్పణి సూచికలు ప్రధాన పాఠంలో వరుసగా ఉంచబడ్డాయి.
