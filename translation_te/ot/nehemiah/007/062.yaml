  text: בְּנֵי דְלָיָ֥ה בְנֵֽי טוֹבִיָּ֖ה בְּנֵ֣י נְקוֹדָ֑א שֵׁ֥שׁ מֵא֖וֹת וְ/אַרְבָּעִ֥ים וּ/שְׁנָֽיִם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/062.yaml
  text: 'the sons of Delaiah, the sons of Tobiah, the sons of Nekoda: six hundred forty-two.'
translation:
  language: te
  text: దెలాయా కుమారులు, టోబీయా కుమారులు, నెకోదా కుమారులు—మొత్తం ఆరువందల నలభై ఇద్దరు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: కుమారులు
  rationale: ఈ వంశావళి-జనగణన సందర్భంలో పురుష వంశానికి చెందిన కుటుంబ సమూహాలను పరిచయం చేసే పదం. జాబితా పునరావృత నిర్మాణాన్ని నిలుపుతూ, మూలానికి సన్నిహితమైన సహజ తెలుగు రూపంగా ‘కుమారులు’ ఎంచుకున్నాం.
- source_word: דְלָיָה
  choice: దెలాయా
  rationale: వ్యక్తి పేరు; దాని హీబ్రూ ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించబడింది.
- source_word: טוֹבִיָּה
  choice: టోబీయా
  rationale: వ్యక్తి పేరు; హీబ్రూ రూపాన్ని అనుసరించి తెలుగులో లిప్యంతరీకరించబడింది.
- source_word: נְקוֹדָא
  choice: నెకోదా
  rationale: వ్యక్తి పేరు; హీబ్రూ వ్యంజన-స్వర రూపానికి దగ్గరగా లిప్యంతరీకరించబడింది.
- source_word: שֵׁשׁ מֵאוֹת וְאַרְבָּעִים וּשְׁנָיִם
  choice: ఆరువందల నలభై ఇద్దరు
  rationale: జాబితాలో పేర్కొన్న కుటుంబ సమూహాల మొత్తం 642 మంది. వ్యక్తులను లెక్కిస్తున్నందున సహజ తెలుగులో మానవవాచక సంఖ్యారూపం ‘ఇద్దరు’ ఉపయోగించబడింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైన జాబితా శైలి పాటించబడింది. హీబ్రూలో లేని ‘మొత్తం’ అనే పదం సంఖ్య ముందున్న మూడు కుటుంబ సమూహాలకు కలిపిన సంఖ్య అని తెలుగులో స్పష్టంగా, సహజంగా తెలియజేయడానికి చేర్చబడింది.
