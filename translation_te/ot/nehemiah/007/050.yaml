    text: ఈ వంశావళి జాబితాలో ప్రతిసారి వచ్చిన పదాన్ని అక్షరార్థంగా ‘కుమారులు’ అని కూడా అనువదించవచ్చు; సందర్భంలో అది ‘సంతతివారు’ లేదా ‘కుటుంబ సభ్యులు’ అనే భావాన్నిస్తుంది.
