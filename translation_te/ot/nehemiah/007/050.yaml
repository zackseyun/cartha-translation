lexical_decisions:
- source_word: בְּנֵי
  choice: వంశస్థులు
  rationale: వంశావళి జాబితాలో בְּנֵי అనే నిర్మాణరూప బహువచనం అక్షరార్థంగా ‘కుమారులు’ అని ఉన్నా, ఇక్కడ సంతతి లేదా కుటుంబవర్గ సభ్యులను సూచిస్తుంది. ఆధునిక తెలుగులో ‘వంశస్థులు’ ఆ భావాన్ని సహజంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: רְאָיָה
  choice: రెవాయా
  rationale: హీబ్రూ స్వరరూపం rəʾāyāh‌ను అనుసరించి వ్యక్తిపేరును అనువదించకుండా తెలుగు లిప్యంతరీకరణగా ఇచ్చాం.
- source_word: רְצִין
  choice: రెసీను
  rationale: హీబ్రూ rəṣîn రూపాన్ని అనుసరించిన తెలుగు లిప్యంతరీకరణ; צ ధ్వనికి సమీపంగా ‘స’ను, దీర్ఘ îకి ‘ఈ’ను వాడాం.
- source_word: נְקוֹדָא
  choice: నెకోదా
  rationale: హీబ్రూ nəqôḏāʾ స్వరరూపాన్ని అనుసరించి పేరును తెలుగు లిపిలో ఇచ్చాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్త జాబితా శైలిని నిలిపాం. ‘కుమారులు’ అనే అక్షరానువాదం కలిగించే ప్రత్యక్ష పుత్రత్వ భావాన్ని నివారిస్తూ, హీబ్రూ వంశ/కుటుంబ సంబంధార్థానికి ‘వంశస్థులు’ను ఎంచుకున్నాం. పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో మొదటి సందర్భానికే జోడించబడింది; అది మూడు సందర్భాలకూ వర్తిస్తుంది.
