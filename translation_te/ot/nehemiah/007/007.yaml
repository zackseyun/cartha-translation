source:
  edition: WLC
  text: הַ/בָּאִ֣ים עִם זְרֻבָּבֶ֗ל יֵשׁ֡וּעַ נְחֶמְיָ֡ה עֲ֠זַרְיָה רַֽעַמְיָ֨ה נַחֲמָ֜נִי מָרְדֳּכַ֥י בִּלְשָׁ֛ן מִסְפֶּ֥רֶת בִּגְוַ֖י נְח֣וּם בַּעֲנָ֑ה מִסְפַּ֕ר אַנְשֵׁ֖י עַ֥ם יִשְׂרָאֵֽל־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/007.yaml
  text: 'those who came with Zerubbabel were Jeshua[a], Nehemiah, Azariah, Raamiah, Nahamani, Mordecai, Bilshan, Mispereth, Bigvai, Nehum, and Baanah[c][b]. The number of the men of the people of Israel:'
translation:
  language: te
  text: 'జెరుబ్బాబెలుతో కలిసి వచ్చినవారు: యేషూవా, నెహెమ్యా, అజర్యా, రయమ్యా[a], నహమాని, మొర్దెకై, బిల్షాను, మిస్పెరెతు, బిగ్వయి, నెహూము[b], బానా. ఇశ్రాయేలు ప్రజల పురుషుల సంఖ్య[c]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఎజ్రా 2:2లోని సమాంతర జాబితాలో ఈ పేరు రెయేల్యా అని ఉంది.
    reason: alternative_reading
  - marker: b
    text: ఎజ్రా 2:2లోని సమాంతర జాబితాలో ఈ పేరు రెహూము అని ఉంది.
    reason: alternative_reading
  - marker: c
    text: ఈ పదబంధం తరువాతి వచనంలో కొనసాగబోయే జనగణన వివరాలను పరిచయం చేస్తుంది.
    reason: cross_reference
lexical_decisions:
- source_word: הַבָּאִים עִם
  choice: తో కలిసి వచ్చినవారు
  rationale: నిర్దిష్ట సమూహాన్ని సూచించే substantival participleను సహజమైన తెలుగు సంబంధ వాక్యరూపంలో ఇచ్చి, עִם తెలిపే సహవాస భావాన్ని ‘తో కలిసి’గా నిలిపాం.
- source_word: זְרֻבָּבֶל
  choice: జెరుబ్బాబెలు
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగులో సులభంగా చదవగల ప్రామాణిక లిప్యంతరీకరణతో ఇచ్చాం.
- source_word: יֵשׁוּעַ
  choice: యేషూవ
  rationale: నిర్బంధానంతర కాలపు ఈ వ్యక్తినామాన్ని హీబ్రూ రూపానికి సమీపంగా లిప్యంతరీకరించాం; ఇతర సందర్భాల్లోని యెహోషువతో అనవసరంగా ఏకీకరించలేదు.
- source_word: רַעַמְיָה
  choice: రయమ్యా
  rationale: నెహెమ్యా గ్రంథంలోని మసొరెటిక్ పాఠరూపాన్నే ప్రధాన పాఠ్యంలో అనుసరించాం; ఎజ్రా 2:2లోని భిన్న రూపాన్ని పాదసూచికలో ఉంచాం.
- source_word: מִסְפֶּרֶת
  choice: మిస్పెరెతు
  rationale: సందర్భం వల్ల ఇది ‘సంఖ్య’ అనే సాధారణ నామవాచకం కాదు, వ్యక్తినామం; అందువల్ల లిప్యంతరీకరించాం.
- source_word: אַנְשֵׁי עַם יִשְׂרָאֵל
  choice: ఇశ్రాయేలు ప్రజల పురుషులు
  rationale: אַנְשֵׁי అనే స్పష్టమైన పురుషవాచక బహువచన నిర్మాణాన్ని తొలగించకుండా, తెలుగులో సహజమైన సంబంధ నిర్మాణంతో అనువదించాం.
theological_decisions:
- issue: జనగణన పదబంధంలోని లింగ సూచన
  choice: ఇశ్రాయేలు ప్రజల పురుషుల సంఖ్య
  alternative: ఇశ్రాయేలు ప్రజల సంఖ్య
  rationale: మూలంలోని אַנְשֵׁי (‘పురుషులు’) అనే స్పష్టమైన పదాన్ని నిలిపాం. ఇది పాఠ్యంలోని లింగ సూచనను సంరక్షించడమే గాని, దాని పరిధిపై అదనపు సిద్ధాంత నిర్ణయం కాదు.
- issue: ఎజ్రా 2:2తో పోల్చినప్పుడు వ్యక్తినామాల భిన్న రూపాలు
  choice: ప్రధాన పాఠ్యంలో నెహెమ్యా 7:7 మసొరెటిక్ రూపాలైన రయమ్యా, నెహూములను అనుసరించడం
  alternative: ఎజ్రా 2:2 ప్రకారం రెయేల్యా, రెహూము అని సమన్వయపరచడం
  rationale: అనువదిస్తున్న వచనపు హీబ్రూ పాఠానికి ప్రాధాన్యం ఇచ్చి, సమాంతర జాబితాలోని భేదాలను తొలగించకుండా పాదసూచికల్లో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా చదవగల జాబితా శైలిని వాడాం. వ్యక్తినామాలను హీబ్రూ మూలానికి దగ్గరగా లిప్యంతరీకరించాం. చివరి ద్విబిందువు ద్వారా తరువాతి వచనంలో సంఖ్యల జాబితా కొనసాగుతుందని స్పష్టమవుతుంది.
