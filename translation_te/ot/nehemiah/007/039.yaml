  register: ఆధునిక ప్రామాణిక తెలుగులో, జనగణన జాబితాకు తగిన సంక్షిప్తమైన మరియు గౌరవప్రదమైన శైలి. ‘వంశానికి చెందిన’ అనే ప్రయోగం కుటుంబ అనుబంధాన్ని సహజంగా తెలియజేస్తుంది; మూలంలోని ‘కుమారులు’ రూపం పాదసూచికతో కలిపి నిలుపబడింది.
