base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/039.yaml
  text: 'The priests: the sons of Jedaiah[a], of the house of Jeshua[b], nine hundred seventy-three.'
translation:
  language: te
  text: 'యాజకులు: యెదయా కుమారులు[a], యేషూవా వంశానికి చెందినవారు[b]—తొమ్మిది వందల డెబ్బై ముగ్గురు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ‘కుమారులు’ అనే మాట ప్రత్యక్ష కుమారులనే కాక వంశస్థులను లేదా కుటుంబ వంశశాఖకు చెందినవారిని కూడా సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: ‘యేషూవా’ను ‘యెహోషువ’ అని కూడా అనువదించవచ్చు; అయితే చెర అనంతర కాలపు ఈ సందర్భంలో ఉన్న హీబ్రూ రూపాన్ని ‘యేషూవా’ మరింత దగ్గరగా ప్రతిబింబిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֹּהֲנִים
  choice: యాజకులు
  rationale: నిర్దిష్ట బహువచన నామవాచకంగా జనగణన జాబితాలోని ఒక వర్గాన్ని పరిచయం చేస్తుంది; తెలుగులో క్రియను చేర్చకుండా జాబితా శైలిని నిలుపుతుంది.
- source_word: בְּנֵי
  choice: కుమారులు
  rationale: హీబ్రూ రూపాన్ని సన్నిహితంగా నిలుపుతూ, వంశావళి సందర్భంలో ఇది ప్రత్యక్ష కుమారులనే కాక వంశస్థులను కూడా సూచించగలదని పాదసూచికలో స్పష్టం చేయబడింది.
- source_word: יְדַעְיָה
  choice: యెదాయా
  rationale: హీబ్రూ వ్యక్తిపేరుకు అనుగుణమైన తెలుగు లిప్యంతరీకరణ.
- source_word: לְבֵית יֵשׁוּעַ
  choice: యేషూవ వంశానికి చెందిన
  rationale: ఇక్కడ בַּיִת ఒక ఇంటివారిని లేదా కుటుంబ వంశశాఖను సూచిస్తుంది; לְ అనుబంధాన్ని తెలియజేస్తుంది. ఈ భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: יֵשׁוּעַ
  choice: యేషూవ
  rationale: చెర అనంతర కాలపు ఈ పేరులోని హీబ్రూ సంక్షిప్త రూపాన్ని ప్రతిబింబించే లిప్యంతరీకరణ.
- source_word: תְּשַׁע מֵאוֹת שִׁבְעִים וּשְׁלֹשָׁה
  choice: తొమ్మిది వందల డెబ్బై ముగ్గురు
  rationale: మొత్తం 973 అనే సంఖ్యను వ్యక్తుల లెక్కకు తగిన తెలుగు సంఖ్యారూపంలో అందిస్తుంది.
