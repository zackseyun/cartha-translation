translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన శైలిని ఉపయోగించాం. మూలంలోని కర్తరహిత నిర్మాణాలను నిలిపి, సందర్భం సూచించే ‘పునర్నిర్మాణం’ లేదా ‘ఆలయ గాయకులు’ వంటి స్పష్టీకరణలను ప్రధాన పాఠ్యంలో చేర్చలేదు. ఆంగ్ల సలహా పాఠ్యంలో అడుగుసూచిక గుర్తులు వాటి విషయాలకు సరిపోని స్థానాల్లో ఉన్నందున, మూలపదాలకు సంబంధించిన సరైన స్థానాల్లో [a], [b] ఉంచాం.
