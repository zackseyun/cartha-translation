id: NEH.7.1
reference: Nehemiah 7:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְהִ֗י כַּ/אֲשֶׁ֤ר נִבְנְתָה֙ הַ/חוֹמָ֔ה וָ/אַעֲמִ֖יד הַ/דְּלָת֑וֹת וַ/יִּפָּֽקְד֛וּ הַ/שּׁוֹעֲרִ֥ים וְ/הַ/מְשֹׁרְרִ֖ים וְ/הַ/לְוִיִּֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/001.yaml
  text: When the wall had been built and I had set up the doors[a], the gatekeepers, the singers[b], and the Levites were appointed.
translation:
  language: te
  text: గోడ నిర్మించబడి[a], నేను తలుపులు అమర్చిన తరువాత, ద్వారపాలకులు, గాయకులు, లేవీయులు నియమించబడ్డారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘గోడ నిర్మించబడినప్పుడు’ అని కూడా అనువదించవచ్చు. హీబ్రూ సంపూర్ణ క్రియారూపం కథన క్రమంలో అప్పటికే పూర్తయిన చర్యను సూచిస్తుంది; తెలుగులో ‘నిర్మించబడి’ అదే క్రమాన్ని సహజంగా తెలియజేస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘బాధ్యతలు అప్పగించబడ్డారు’ లేదా ‘నమోదు చేయబడ్డారు’ అని కూడా అనువదించవచ్చు; హీబ్రూ క్రియకు కేవలం అధికారిక నియామకాన్ని మించిన విస్తృత పరిపాలనాపరమైన భావం ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: …అమర్చినప్పుడు
  rationale: ఈ హీబ్రూ వాక్యనిర్మాణం కథనంలోని కాలసందర్భాన్ని పరిచయం చేస్తుంది. ఆధునిక తెలుగులో ‘అప్పుడు ఇలా జరిగింది’ అని కృతకంగా చేర్చకుండా, ‘అమర్చినప్పుడు’ అనే కాలవాచక నిర్మాణం దాని భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: נִבְנְתָה הַחוֹמָה
  choice: గోడ నిర్మించబడి
  rationale: נִבְנְתָה అనేది בנה ధాతువు నిఫ్అల్ సంపూర్ణరూపం; కర్తరహిత భావాన్ని ‘నిర్మించబడి’ నిలుపుతుంది. సందర్భం పునర్నిర్మాణాన్ని సూచించినా, క్రియలో ‘తిరిగి’ అనే భావం స్పష్టంగా లేదు.
- source_word: וָאַעֲמִיד הַדְּלָתוֹת
  choice: నేను తలుపులు అమర్చినప్పుడు
  rationale: עמד హిఫ్ఇల్ రూపం ఇక్కడ తలుపులను వాటి స్థానంలో నిలపడం లేదా బిగించడం అనే భావం ఇస్తుంది. ‘అమర్చడం’ ఆధునిక తెలుగులో సహజమైనది; హీబ్రూలో లేని ‘ద్వారాల తలుపులు’ అనే వివరణను చేర్చలేదు.
- source_word: וַיִּפָּקְדוּ
  choice: నియమించబడ్డారు
  rationale: פקד నిఫ్అల్ రూపం పరిపాలనాపరంగా నియమించడం, బాధ్యత అప్పగించడం, లేదా జాబితాలో నమోదు చేయడం అనే విస్తృత భావాన్ని కలిగి ఉండవచ్చు. ఈ సందర్భంలో ‘నియమించబడ్డారు’ సహజమైన ప్రధాన అనువాదం.
- source_word: הַשּׁוֹעֲרִים
  choice: ద్వారపాలకులు
  rationale: నగర లేదా ఆలయ ద్వారాల బాధ్యత వహించే వారిని సూచించే స్థిరమైన, స్పష్టమైన తెలుగు పదం.
- source_word: הַמְשֹׁרְרִים
  choice: గాయకులు
  rationale: שׁיר మూలానికి చెందిన ఈ పదం, ముఖ్యంగా ఆరాధన సంబంధమైన గాయకులను సూచిస్తుంది. ‘గాయకులు’ ప్రత్యక్షమైన అనువాదం.
- source_word: הַלְוִיִּם
  choice: లేవీయులు
  rationale: లేవి గోత్రానికి చెందిన సమూహానికి తెలుగులో ప్రాచుర్యంలో ఉన్న రూపం.
