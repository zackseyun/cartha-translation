  text: 'కిర్యత్-యెఆరీము, కెఫీరా, బెయేరోతులకు చెందిన పురుషులు: 743 మంది.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַנְשֵׁי
  choice: పట్టణాల మనుషులు
  rationale: אִישׁ పదపు నిర్మిత బహువచనం ఈ జనగణన జాబితాలో పేర్కొన్న పట్టణాలకు చెందిన పురుషులను సూచిస్తుంది. తెలుగు వాక్యనిర్మాణంలో మూడు స్థలనామాల తరువాత ‘పట్టణాల మనుషులు’ అని ఉంచడం సహజంగా ఉండి, మూలంలోని లింగసూచనను నిలుపుతుంది.
- source_word: קִרְיַת יְעָרִים
  choice: కిర్యత్-యెయారీము
  rationale: స్థలనామాన్ని అనువదించకుండా, హీబ్రూ ఉచ్చారణకు దగ్గరగా తెలుగులో లిప్యంతరీకరించాం.
- source_word: כְּפִירָה
  choice: కెఫీరా
  rationale: హీబ్రూ స్థలనామంలోని వ్యంజనాలు, స్వరాలకు దగ్గరగా ఉండే తెలుగు లిప్యంతరీకరణ.
- source_word: וּבְאֵרוֹת
  choice: బెయేరోతు
  rationale: సంయోజక అవ్యయాన్ని జాబితా నిర్మాణంలో తెలుగులో సహజంగా సూచిస్తూ, స్థలనామాన్ని హీబ్రూకు దగ్గరగా లిప్యంతరీకరించాం.
- source_word: שְׁבַע מֵאוֹת אַרְבָּעִים וּשְׁלֹשָׁה
  choice: 743 మంది
  rationale: హీబ్రూ సంఖ్యను యథాతథంగా అంకెల్లో ఇచ్చాం; లెక్కించబడినవారు మనుషులని తెలుగులో స్పష్టంగా, సహజంగా తెలియజేయడానికి ‘మంది’ చేర్చాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్త జనగణన-జాబితా శైలిని పాటించాం. స్థలనామాలను మూల హీబ్రూ ఆధారంగా లిప్యంతరీకరించాం; ఇంగ్లీషు సంప్రదాయ ప్రత్యామ్నాయం ‘Chephirah’ తెలుగులో ప్రత్యేక అర్థవంతమైన భేదాన్ని కలిగించనందున పాదటిప్పణి ఇవ్వలేదు.
