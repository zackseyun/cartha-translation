  terminology: ‘దరికులు’ and ‘మినాలు’ appropriately preserve the historical monetary/weight terms, and the notes explain them well. ‘యాజకుల అంగీలు’ is an acceptable rendering of priests’ tunics without claiming a more specific ritual function.
