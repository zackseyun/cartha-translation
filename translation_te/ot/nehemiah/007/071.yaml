  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/אֲשֶׁ֣ר נָתְנוּ֮ שְׁאֵרִ֣ית הָ/עָם֒ זָהָ֗ב דַּרְכְּמוֹנִים֙ שְׁתֵּ֣י רִבּ֔וֹא וְ/כֶ֖סֶף מָנִ֣ים אַלְפָּ֑יִם וְ/כָתְנֹ֥ת כֹּֽהֲנִ֖ים שִׁשִּׁ֥ים וְ/שִׁבְעָֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/071.yaml
  text: And what the rest of the people gave was twenty thousand gold darics[a], two thousand minas of silver[c][b], and sixty-seven priests’ tunics.
translation:
  language: te
  text: 'మిగిలిన ప్రజలు[a] ఇచ్చినవి: ఇరవై వేల బంగారు దరికులు[b], రెండు వేల వెండి మినాలు[c], అరవై ఏడు యాజకుల అంగీలు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ప్రజలలో శేషించినవారు.’ ఇక్కడ ఈ మాటకు వేదాంతపరమైన ‘శేషం’ అనే భావం తప్పనిసరి కాదు; ముందుగా పేర్కొన్న దాతలు కాకుండా మిగిలిన ప్రజలను సూచించడం సందర్భానికి మరింత సరిపోతుంది.
    reason: lexical_alternative
  - marker: b
    text: దరికు అనేది పర్షియా దేశానికి చెందిన బంగారు నాణెం.
    reason: cultural_note
  - marker: c
    text: మినా అనేది ప్రాచీన బరువు ప్రమాణం; దాని ఆధారంగా ధన విలువను కూడా లెక్కించేవారు.
    reason: cultural_note
lexical_decisions:
- source_word: וַאֲשֶׁר נָתְנוּ
  choice: ఇచ్చినవి
  rationale: ఈ సంబంధవాచక నిర్మాణం విరాళాల జాబితాలో తదుపరి అంశాన్ని పరిచయం చేస్తుంది. తెలుగులో ‘ఇచ్చినవి’ సహజంగా ఉండి, మూలంలోని సాధారణ ‘ఇవ్వడం’ అనే భావాన్ని కాపాడుతుంది.
- source_word: שְׁאֵרִית הָעָם
  choice: మిగిలిన ప్రజలు
  rationale: ఈ పరిపాలనా జాబితా సందర్భంలో ఇది ముందుగా పేర్కొన్న దాతలు కాకుండా మిగిలిన ప్రజలను సూచిస్తుంది; ‘శేషం’ అనే పదానికి కలగగల ప్రత్యేక వేదాంత భావాన్ని అనవసరంగా రుద్దదు.
- source_word: זָהָב דַּרְכְּמוֹנִים
  choice: బంగారు దరికులు
  rationale: దరికు అనే చారిత్రక పర్షియా బంగారు నాణెం పేరును నిలుపుతూ, లోహాన్ని స్పష్టంగా పేర్కొంటుంది.
- source_word: שְׁתֵּי רִבּוֹא
  choice: ఇరవై వేల
  rationale: అక్షరార్థంగా ‘రెండు పదివేలు’; ఆధునిక తెలుగులో సహజ సంఖ్యారూపం ‘ఇరవై వేల’.
- source_word: וְכֶסֶף מָנִים אַלְפָּיִם
  choice: రెండు వేల మినాల వెండి
  rationale: మినా అనే ప్రాచీన బరువు/విలువ ప్రమాణాన్ని ఆధునిక ప్రమాణంగా మార్చకుండా నిలుపుతుంది; తెలుగు పదక్రమంలో వెండి పరిమాణం స్పష్టంగా ఉంటుంది.
- source_word: וְכָתְנֹת כֹּהֲנִים
  choice: యాజకుల అంగీలు
  rationale: כָּתְנֹת పొడవైన చొక్కాలు లేదా అంగీలను సూచిస్తుంది. ‘యాజకుల అంగీలు’ మూలంలోని సంబంధాన్ని సంక్షిప్తంగా నిలుపుతూ, వాటి ఆచారపరమైన ఉపయోగాన్ని అదనంగా నిర్ధారించదు.
- source_word: שִׁשִּׁים וְשִׁבְעָה
  choice: అరవై ఏడు
  rationale: మూల సంఖ్యకు సహజమైన ఆధునిక తెలుగు రూపం.
theological_decisions:
- issue: שְׁאֵרִית అనే పదాన్ని వేదాంతపరమైన ‘శేషం’గా అర్థం చేసుకోవాలా?
  choice: మిగిలిన ప్రజలు
  alternative: ప్రజలలో శేషించినవారు
  rationale: ఇది విరాళాల పరిపాలనా జాబితా; ఇక్కడ విశ్వాసులైన ‘శేషం’ గురించిన వేదాంత ప్రకటనకన్నా, ముందుగా పేర్కొనని మిగతా ప్రజలను వేరు చేయడం సందర్భానికి సరిపోతుంది. ప్రత్యామ్నాయ అర్థాన్ని పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, జాబితా శైలిని స్పష్టంగా చూపేందుకు ద్విబిందువు ఉపయోగించబడింది. ‘దరికు,’ ‘మినా’ అనే చారిత్రక ప్రమాణాల పేర్లు అనువదించకుండా తెలుగు లిపిలో ఇచ్చి, పాదసూచికల్లో సంక్షిప్తంగా వివరించాం. భాష గంభీరంగా ఉన్నప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యేలా ఉంచబడింది.
