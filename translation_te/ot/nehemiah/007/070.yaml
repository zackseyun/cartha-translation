id: NEH.7.70
reference: Nehemiah 7:70
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/מֵֽ/רָאשֵׁ֣י הָֽ/אָב֗וֹת נָֽתְנוּ֙ לְ/אוֹצַ֣ר הַ/מְּלָאכָ֔ה זָהָ֕ב דַּרְכְּמוֹנִ֖ים שְׁתֵּ֣י רִבּ֑וֹת וְ/כֶ֕סֶף מָנִ֖ים אַלְפַּ֥יִם וּ/מָאתָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/070.yaml
  text: 'And some of the heads of the fathers’ houses gave to the treasury for the work: twenty thousand gold darics and two thousand two hundred minas of silver[a][b][c].'
translation:
  language: te
  text: పితృకుటుంబాల పెద్దలలో కొందరు[b] పని నిమిత్తం ఖజానాకు ఇరవై వేల బంగారు దారికులు[a], రెండువేల రెండువందల వెండి మినాలు[c] ఇచ్చారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: దారికు పర్షియా దేశపు బంగారు నాణెం.
    reason: cultural_note
  - marker: b
    text: మరింత అక్షరార్థంగా, “పితృకుటుంబాల పెద్దలలోనుండి.”
    reason: lexical_alternative
  - marker: c
    text: మినా ప్రాచీన కాలపు బరువు ప్రమాణం; దాని ఆధారంగా ధన విలువను కూడా లెక్కించేవారు.
    reason: cultural_note
lexical_decisions:
- source_word: וּמֵרָאשֵׁי הָאָבוֹת
  choice: పితృ కుటుంబాల పెద్దలలో కొందరు
  rationale: מִן ఉపసర్గ ‘వారిలోనుండి/వారిలో కొందరు’ అనే భావాన్ని ఇస్తుంది. ‘పితృ కుటుంబాలు’ వంశపారంపర్య కుటుంబ విభాగాన్ని సూచిస్తుండగా, ‘పెద్దలు’ רָאשֵׁי అనే పరిపాలనా నాయకత్వ భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: נָתְנוּ
  choice: ఇచ్చారు
  rationale: హీబ్రూ సాధారణ క్రియకు నేరమైన, వ్యాఖ్యాన భారం లేని తెలుగు సమానం.
- source_word: לְאוֹצַר הַמְּלָאכָה
  choice: పని నిమిత్తం ఖజానాకు
  rationale: אוֹצָר విలువైన వస్తువులు లేదా ధనం ఉంచే ఖజానాను సూచిస్తుంది; הַמְּלָאכָה ఇక్కడ నిధులు సమకూర్చబడుతున్న పనిని సూచిస్తుంది. తెలుగు వాక్యనిర్మాణంలో ఉద్దేశాన్ని స్పష్టంగా, సహజంగా తెలిపే రూపం.
- source_word: זָהָב דַּרְכְּמוֹנִים שְׁתֵּי רִבּוֹת
  choice: ఇరవై వేల బంగారు దారికులు
  rationale: దారికు అనే చారిత్రక పర్షియా బంగారు నాణెం పేరును నిలుపుతూ, ‘రెండు పదివేలు’ అనే సంఖ్యను ఆధునిక తెలుగులో ‘ఇరవై వేలు’గా అందిస్తుంది.
- source_word: וְכֶסֶף מָנִים אַלְפַּיִם וּמָאתָיִם
  choice: రెండువేల రెండువందల వెండి మినాలు
  rationale: మినా అనే ప్రాచీన బరువు/ధన ప్రమాణాన్ని ఆధునిక ప్రమాణంతో సుమారుగా మార్చకుండా చారిత్రక పేరుతోనే ఉంచి, సంఖ్యను సహజ తెలుగు క్రమంలో అందిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన శైలి వాడబడింది. ‘దారికులు,’ ‘మినాలు’ వంటి చారిత్రక ప్రమాణాలను మూల పాఠ్య ప్రత్యేకత కోసం నిలిపి, పాదసూచికల్లో వివరణ ఇచ్చాం.
