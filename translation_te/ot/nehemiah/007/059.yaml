translation:
  language: te
  text: షెఫట్యా కుమారులు[a], హట్టీల్ కుమారులు, పోకెరెత్-హత్సెబాయీమ్ కుమారులు[b], ఆమోను కుమారులు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ఈ వచనమంతటా, “వంశస్థులు.” హీబ్రూలో “కుమారులు” అనే పదం వంశావళి జాబితాల్లో ఒక కుటుంబ వంశానికి చెందినవారిని కూడా సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ఈ పేరును “జెబాయీమ్‌కు చెందిన పోకెరెత్” అని కూడా అర్థం చేసుకోవచ్చు; ఇక్కడ హీబ్రూ రూపాన్ని వ్యక్తి/కుటుంబ నామంగా నిలిపాం.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּנֵי
  choice: వంశస్థులు
  rationale: వంశావళి సంబంధమైన ఈ జాబితాలో בְּנֵי అనే పదం ప్రత్యక్ష కుమారులను మాత్రమే కాకుండా ఒక కుటుంబ వంశానికి చెందినవారిని సూచిస్తుంది. ఆధునిక తెలుగులో ‘వంశస్థులు’ ఈ భావాన్ని సహజంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: שְׁפַטְיָה
  choice: షెఫట్యా
  rationale: హీబ్రూ వ్యక్తి/కుటుంబ నామాన్ని దాని ధ్వనికి సమీపంగా లిప్యంతరీకరించాం.
- source_word: חַטִּיל
  choice: హట్టీల్
  rationale: ఇది జాబితాలోని వ్యక్తి లేదా కుటుంబ నామం కాబట్టి అనువదించకుండా హీబ్రూ ఉచ్చారణకు సమీపంగా లిప్యంతరీకరించాం.
- source_word: פֹּכֶרֶת הַצְּבָיִים
  choice: పోకెరెత్-హజ్జెబాయీమ్
  rationale: ఈ సంయుక్త వ్యక్తి/కుటుంబ నామంలోని రెండు హీబ్రూ భాగాల అనుబంధాన్ని నిలుపుతూ లిప్యంతరీకరించాం; మధ్య గీత వాటిని ఒక పేరుగా చదవడానికి సహాయపడుతుంది.
- source_word: אָמֽוֹן
  choice: ఆమోను
  rationale: ఇది సాధారణ నామవాచకం లేదా దైవశాస్త్ర పదం కాక, కుటుంబాన్ని సూచించే పేరు; తెలుగులో సహజంగా పలికేలా లిప్యంతరీకరించాం.
