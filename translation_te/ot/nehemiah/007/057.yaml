id: NEH.7.57
reference: Nehemiah 7:57
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: בְּנֵ֖י עַבְדֵ֣י שְׁלֹמֹ֑ה בְּנֵי סוֹטַ֥י בְּנֵי סוֹפֶ֖רֶת בְּנֵ֥י פְרִידָֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/057.yaml
  text: 'The sons of Solomon’s servants: the sons of Sotai[a], the sons of Sophereth[b], the sons of Perida.'
translation:
  language: te
  text: 'సొలొమోను సేవకుల సంతతివారు: సోతయి వంశస్థులు, సోఫెరెతు వంశస్థులు, పెరీదా వంశస్థులు.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: సంతతివారు / వంశస్థులు
  rationale: ఈ వంశావళి జాబితాలో בְּנֵי అనే పదం కేవలం ప్రత్యక్ష కుమారులను కాకుండా ఒక కుటుంబం లేదా వంశానికి చెందిన వారిని సూచిస్తుంది. మొదటి సమూహానికి ‘సంతతివారు’, తరువాతి కుటుంబ పేర్లతో ‘వంశస్థులు’ అని ఇవ్వడం తెలుగులో సహజంగా ఉండి హెబ్రీ భావాన్ని నిలుపుతుంది.
- source_word: עַבְדֵי
  choice: సేవకులు
  rationale: עַבְדֵי שְׁלֹמֹה ఇక్కడ తిరిగి వచ్చినవారి జాబితాలో ఒక వారసత్వ సమూహపు పేరుగా ఉంది. ‘దాసులు’ అనే అర్థం సాధ్యమైనా, ఈ సందర్భంలో బానిసత్వ భావాన్ని అనవసరంగా బలపరచకుండా ‘సేవకులు’ అనడం సముచితం.
- source_word: שְׁלֹמֹה
  choice: సొలొమోను
  rationale: తెలుగు బైబిలు వాడుకలో సుపరిచితమైన వ్యక్తినామ రూపాన్ని ఉపయోగించాం.
- source_word: סוֹטַי
  choice: సోతయి
  rationale: మసొరెటిక్ స్వరచిహ్నాలకు దగ్గరగా వ్యక్తినామాన్ని తెలుగు లిపిలో ధ్వన్యంతరీకరించాం.
- source_word: סוֹפֶרֶת
  choice: సోఫెరెతు
  rationale: ఇది ఈ సందర్భంలో సాధారణ నామవాచకం కాక కుటుంబనామం; అందువల్ల అర్థానువాదం చేయకుండా ధ్వన్యంతరీకరించాం.
- source_word: פְרִידָא
  choice: పెరీదా
  rationale: మసొరెటిక్ పఠనంలోని స్వరాలను ప్రతిబింబించేలా వ్యక్తినామాన్ని ధ్వన్యంతరీకరించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, జాబితా శైలిని సంక్షిప్తంగా మరియు గంభీరంగా ఉంచాం. హెబ్రీలో పునరావృతమయ్యే בְּנֵי నిర్మాణాన్ని తెలుగులో సహజమైన ‘సంతతివారు/వంశస్థులు’ రూపాలతో వ్యక్తం చేశాం. సంప్రదింపుల ఆంగ్ల పాఠంలోని పాదసూచిక గుర్తులు వాటి పాఠ్యంతో సరైన స్థానాల్లో సరిపోలకపోవడం వల్ల, మూల హెబ్రీ ఆధారంగా అవసరం లేని పాదసూచికలను చేర్చలేదు.
