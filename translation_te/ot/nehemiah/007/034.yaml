lexical_decisions:
- source_word: בְּנֵי
  choice: వంశస్థులు
  rationale: వంశావళి-జనగణన జాబితాలో ఈ బహువచన నిర్మాణం ఒక పూర్వికుడు లేదా కుటుంబానికి చెందిన వారిని సూచిస్తుంది. తెలుగులో ‘కుమారులు’ కంటే ‘వంశస్థులు’ ఉద్దేశాన్ని సహజంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: עֵילָם
  choice: ఏలాము
  rationale: ఇది తిరిగి వచ్చిన కుటుంబం లేదా వంశం పేరు; అనువదించకుండా తెలుగు లిపిలో ధ్వన్యంతరీకరించబడింది.
- source_word: אַחֵר
  choice: మరొక
  rationale: ఈ విశేషణానికి ‘మరొక/వేరొక’ అనే అర్థం ఉంది. ఇదే అధ్యాయంలో ఇంతకు ముందు పేర్కొన్న ఏలాము వంశం నుండి ఈ గుంపును వేరుచేస్తూ, మూలంలోని కొంత అనిశ్చితిని నిలుపుతుంది.
- source_word: אֶלֶף מָאתַיִם חֲמִשִּׁים וְאַרְבָּעָה
  choice: 1,254 మంది
  rationale: మూలంలోని ఖచ్చిత సంఖ్యను జాబితా పఠనానికి అనుకూలంగా అంకెలలో ఇచ్చి, అది వ్యక్తుల సంఖ్య అని తెలుగులో స్పష్టంచేయడానికి ‘మంది’ చేర్చబడింది.
