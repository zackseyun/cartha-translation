lexical_decisions:
- source_word: אַנְשֵׁי
  choice: పురుషులు
  rationale: אִישׁ పదపు నిర్మాణ బహువచన రూపం; ఈ జనగణన జాబితాలో తరువాత పేర్కొన్న స్థలానికి చెందిన పురుషులను సూచిస్తుంది. సహజమైన తెలుగు వాక్యనిర్మాణం కోసం స్థలనామం తరువాత ‘పురుషులు’ అని ఉంచబడింది.
- source_word: עֲנָתוֹת
  choice: అనాతోతు
  rationale: ఇది స్థలనామం; తెలుగు బైబిలు నామరూప సంప్రదాయానికి, హీబ్రూ ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించబడింది.
- source_word: מֵאָה עֶשְׂרִים וּשְׁמֹנָה
  choice: నూట ఇరవై ఎనిమిది మంది
  rationale: హీబ్రూ సంఖ్యా క్రమం మొత్తం 128ను సూచిస్తుంది. ఆధునిక సహజ తెలుగులో సంఖ్యతో మనుషులను లెక్కించే ‘మంది’ వర్గసూచకాన్ని చేర్చడం ద్వారా అర్థం స్పష్టమవుతుంది.
