lexical_decisions:
- source_word: אַנְשֵׁי
  choice: మనుషులు
  rationale: ఇది אִישׁ పదానికి నిర్మాణ బహువచన రూపం. జనగణన జాబితాలో ఒక ప్రాంతానికి చెందిన పురుషులను సూచిస్తున్నందున, సహజమైన ఆధునిక తెలుగులో ‘మనుషులు’ అని అనువదించాం.
- source_word: בֵית עַזְמָוֶת
  choice: బేత్-అజ్మావెతు
  rationale: ఈ తిరిగివచ్చినవారి జాబితాలో ఇది అజ్మావెతు ఇంటివారిని అక్షరార్థంగా సూచించడం కంటే స్థలనామంగా పనిచేస్తుంది. అందువల్ల పేరును అనువదించకుండా లిప్యంతరీకరించాం.
- source_word: אַרְבָּעִים וּשְׁנָיִם
  choice: నలభై ఇద్దరు
  rationale: వ్యక్తుల సంఖ్యను తెలిపే సహజమైన ఆధునిక తెలుగు రూపం; హీబ్రూ మూలంలోని నలభై రెండు అనే మొత్తాన్ని స్పష్టంగా తెలియజేస్తుంది.
