  register: ఆధునిక ప్రామాణిక తెలుగులో, జనగణన జాబితికి తగిన సంక్షిప్తమైన గౌరవప్రద శైలిని వాడాం. మూలంలోని మూడు సమాంతర పదబంధాల పునరావృతాన్ని నిలిపాం; పాదసూచిక గుర్తు [a] ప్రధాన పాఠంలో ఉంది.
