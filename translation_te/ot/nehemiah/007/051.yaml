  text: గజ్జాము కుమారులు[a], ఉజ్జా కుమారులు, పాసేహ్ కుమారులు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ, అలాగే ఈ వచనంలోని ప్రతి ‘కుమారులు’ అనే పదానికి ‘వంశస్థులు’ అని కూడా అనువదించవచ్చు. హీబ్రూ వంశావళి పదబంధం ప్రత్యక్ష కుమారులనే కాకుండా విస్తృత కుటుంబ వంశాన్ని కూడా సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: కుమారులు
  rationale: వంశావళి లేదా జనగణన జాబితాలో ఈ నిర్మాణ రూపం కేవలం ప్రత్యక్ష మగపిల్లలను మాత్రమే కాకుండా వంశస్థులను లేదా కుటుంబవర్గ సభ్యులను కూడా సూచించగలదు. ప్రధాన పాఠంలో మూలంలోని పునరావృత సూత్రాన్ని పారదర్శకంగా నిలుపుతూ ‘కుమారులు’ అని అనువదించాం; విస్తృతార్థాన్ని పాదసూచికలో తెలిపాం.
- source_word: גַזָּם
  choice: గజ్జాము
  rationale: వ్యక్తి లేదా పూర్వికుని పేరు; హీబ్రూ ఉచ్చారణకు సమీపంగా తెలుగులో లిప్యంతరీకరించాం.
- source_word: עֻזָּא
  choice: ఉజ్జా
  rationale: వ్యక్తి లేదా పూర్వికుని పేరు; హీబ్రూ రూపాన్ని తెలుగులో సహజంగా లిప్యంతరీకరించాం.
- source_word: פָסֵחַ
  choice: పాసేహ
  rationale: వ్యక్తి లేదా పూర్వికుని పేరు; చివరి హీబ్రూ గొంతు ధ్వనిని తెలుగులో అతిగా కృత్రిమంగా చేయకుండా ‘హ’తో సూచించాం.
