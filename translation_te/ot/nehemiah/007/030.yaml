translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, జనగణన జాబితాకు తగిన సంక్షిప్తమైన గౌరవప్రద శైలి. రెండు స్థలాలకు చెందినవారనే భావం తెలుగులో స్పష్టంగా ఉండేందుకు ‘పట్టణాల’ను సందర్భానుసారంగా చేర్చాం.
