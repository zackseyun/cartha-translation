  text: రామా, గెబా వారైన పురుషులు—ఆరువందల ఇరవై ఒక్కరు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַנְשֵׁי
  choice: పురుషులు
  rationale: ఇది אִישׁ అనే పదానికి నిర్మాణ బహువచన రూపం; జనగణన జాబితాలో ఆయా స్థలాలకు చెందిన పురుషులను సూచిస్తుంది. మూలంలోని లింగసూచనను నిలుపుతుంది.
- source_word: הָרָמָה
  choice: రామా
  rationale: స్థలనామాన్ని ఆధునిక ప్రామాణిక తెలుగు ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: וָגָבַע
  choice: గెబా
  rationale: మసొరా పాఠంలోని గבע రూపం ‘గెబా’కు సరిపోతుంది; ‘గిబియా’ అనే సమానమైన వేరొక స్థలనామంగా మార్చలేదు.
- source_word: שֵׁשׁ מֵאוֹת עֶשְׂרִים וְאֶחָד
  choice: ఆరువందల ఇరవై ఒక్కరు
  rationale: మూలంలోని సంఖ్యను సహజమైన తెలుగు పదరూపంలో ఇచ్చి, లెక్కించబడినవారు మనుషులు కాబట్టి ‘ఒక్కరు’ వాడాం.
