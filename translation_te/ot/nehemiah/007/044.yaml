  text: 'The singers: the sons of Asaph[a], one hundred forty-eight.'
translation:
  language: te
  text: 'గాయకులు: ఆసాపు కుమారులు[a] నూట నలభై ఎనిమిది మంది.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఆసాపు వంశస్థులు.’ ఇక్కడ ‘కుమారులు’ అనే హీబ్రూ పదం సొంత కుమారులను మాత్రమే కాకుండా, ఒక వంశానికి లేదా గాయక బృందానికి చెందినవారిని కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמְשֹׁרְרִים
  choice: గాయకులు
  rationale: שׁיר ధాతువు నుండి వచ్చిన ఈ కృదంత రూపం పాడేవారిని సూచిస్తుంది. జనగణన జాబితా సందర్భంలో ‘గాయకులు’ సహజంగా, నిర్దిష్టంగా ఉంది; విస్తృతార్థమున్న ‘సంగీతకారులు’ కంటే ఇది మూలానికి దగ్గరగా ఉంటుంది.
- source_word: בְּנֵי
  choice: కుమారులు
  rationale: వంశ లేదా కుటుంబ సమూహాల పేర్లలో בְּנֵי అనే పదం ‘కుమారులు’ అని అక్షరార్థంగా ఉండి, వారసులను లేదా ఆ కుటుంబ/గాయక బృంద సభ్యులను కూడా సూచించగలదు. ప్రధాన పాఠంలో మూలంలోని వంశపారంపర్య వ్యక్తీకరణను నిలిపి, విస్తృత భావాన్ని పాదసూచికలో తెలిపాం.
- source_word: אָסָף
  choice: ఆసాపు
  rationale: వ్యక్తి పేరును తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: מֵאָה אַרְבָּעִים וּשְׁמֹנָה
  choice: నూట నలభై ఎనిమిది మంది
  rationale: హీబ్రూ సంఖ్య 148ను సహజమైన ఆధునిక తెలుగు రూపంలో ఇచ్చాం. వ్యక్తుల సంఖ్య కాబట్టి స్పష్టత కోసం ‘మంది’ చేర్చాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, జనగణన జాబితాకు తగిన సంక్షిప్తమైన, గౌరవప్రదమైన శైలిని ఉపయోగించాం. మూలంలోని ‘sons of’ నిర్మాణాన్ని ప్రధాన పాఠంలో నిలిపి, దాని సంభావ్య విస్తృతార్థాన్ని పాదసూచికలో ఇచ్చాం.
