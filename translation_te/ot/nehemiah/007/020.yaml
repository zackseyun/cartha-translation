lexical_decisions:
- source_word: בְּנֵי
  choice: కుమారులు
  rationale: వంశావళి/జాబితా సందర్భంలో ఇది ఆదీను కుటుంబానికి లేదా వంశానికి చెందినవారిని సూచిస్తుంది. మూలంలోని రూపాన్ని నిలుపుతూ తెలుగులో సహజంగా ఉండేందుకు ‘కుమారులు’ అని అనువదించాం.
- source_word: עָדִין
  choice: ఆదీను
  rationale: ఇది వ్యక్తి లేదా వంశం పేరు; హీబ్రూ ఉచ్చారణను అనుసరించి లిప్యంతరీకరించాం.
- source_word: שֵׁשׁ מֵאוֹת
  choice: ఆరువందల
  rationale: హీబ్రూ సంఖ్యా నిర్మాణానికి నేరమైన, సహజమైన తెలుగు రూపం.
- source_word: חֲמִשִּׁים וַחֲמִשָּׁה
  choice: యాభై ఐదు
  rationale: మూలంలో అక్షరార్థంగా ‘యాభై మరియు ఐదు’; ఆధునిక తెలుగులో సహజమైన సంఖ్యా రూపంగా ‘యాభై ఐదు’ అని ఇచ్చాం.
