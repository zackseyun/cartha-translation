translation_notes:
  register: వంశాల జాబితాకు తగిన సంక్షిప్త, గంభీర శైలిని నిలిపి, పదేపదే వచ్చే בְּנֵי నిర్మాణాన్ని ‘కుమారులు’గా పునరావృతం చేశాం. ఆధునిక ప్రామాణిక తెలుగులో సహజంగా చదవడానికి ‘ఆలయ సేవకులు’ అనే కార్యార్థక పదబంధాన్ని వాడాం.
