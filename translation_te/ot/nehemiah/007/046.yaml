base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/046.yaml
  text: 'The temple servants: the sons of Ziha[a], the sons of Hasupha[b], the sons of Tabbaoth.'
translation:
  language: te
  text: 'ఆలయ సేవకులు[a]: సీహా కుమారులు, హసూఫా[b] కుమారులు, తబ్బాయోతు కుమారులు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ నెతీనీమ్ అనే పదం ఆలయ సేవకు నియమించబడిన ఒక ప్రత్యేక వర్గానికి సాంకేతిక నామం.
    reason: lexical_alternative
  - marker: b
    text: హసూఫా అనే పేరును ‘హషూఫా’ అని కూడా లిప్యంతరీకరించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנְּתִינִים
  choice: ఆలయ సేవకులు
  rationale: నెతీనీమ్ అనే సాంకేతిక పదం చెర అనంతర కాలంలో ఆలయ సేవకు నియమించబడిన ఒక వర్గాన్ని సూచిస్తుంది. కేవలం లిప్యంతరీకరించకుండా దాని సేవాపరమైన అర్థాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: בְּנֵי
  choice: కుమారులు
  rationale: వంశావళి జాబితాలో కుటుంబ లేదా వంశ సమూహాలను పరిచయం చేసే హీబ్రూ నిర్మాణాన్ని యథాశక్తి నేరుగా నిలుపుతుంది; సందర్భానుసారంగా వారసులు అనే విస్తృతార్థం ఉండవచ్చు.
- source_word: צִחָא
  choice: సీహా
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు ధ్వనివ్యవస్థకు అనుగుణంగా లిప్యంతరీకరించింది.
- source_word: חֲשֻׂפָא
  choice: హసూఫా
  rationale: హీబ్రూ వ్యక్తినామానికి సమీపమైన తెలుగు లిప్యంతరీకరణ; మధ్య వ్యంజనాన్ని షగా సూచించే ప్రత్యామ్నాయమూ సాధ్యమే.
- source_word: טַבָּעוֹת
  choice: తబ్బాయోతు
  rationale: హీబ్రూలోని ద్విత్వ వ్యంజనాన్ని, అచ్చుల క్రమాన్ని సాధ్యమైనంతగా ప్రతిబింబించే తెలుగు లిప్యంతరీకరణ.
