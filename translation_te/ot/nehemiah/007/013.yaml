lexical_decisions:
- source_word: בְּנֵי
  choice: కుమారులు
  rationale: నిర్గమానంతర వంశపట్టిక సందర్భంలో ఇది ఒక కుటుంబ లేదా వంశ సమూహాన్ని పరిచయం చేస్తుంది. ‘కుమారులు’ హెబ్రీ వంశావళి నుడికారాన్ని నిలుపుతూ తెలుగులో సహజంగా ఉంది; ‘వంశస్థులు’ మరింత వ్యాఖ్యానాత్మకంగా ఉంటుంది.
- source_word: זַתּוּא
  choice: జత్తూ
  rationale: వ్యక్తి పేరును అనువదించకుండా హెబ్రీ ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: שְׁמֹנֶה מֵאוֹת אַרְבָּעִים וַחֲמִשָּׁה
  choice: 845 మంది
  rationale: హెబ్రీ సంఖ్యా క్రమం ఖచ్చితంగా 845ను సూచిస్తుంది. జాబితా శైలిలో ఆధునిక పాఠకులకు సులభంగా కనిపించేందుకు అంకెలను, వ్యక్తుల సంఖ్య అని స్పష్టం చేయడానికి ‘మంది’ని ఉపయోగించాం.
