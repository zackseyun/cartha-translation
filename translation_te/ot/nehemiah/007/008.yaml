  register: ఆధునిక ప్రామాణిక తెలుగులో, జనగణన జాబితాకు తగిన సంక్షిప్తమైన, గౌరవప్రదమైన శైలి వాడబడింది. మూలంలోని వంశపట్టిక పదప్రయోగాన్ని ప్రధాన పాఠ్యంలో నిలిపి, దాని విస్తృత సామూహిక అర్థాన్ని పాదటిప్పణిలో తెలిపాం.
