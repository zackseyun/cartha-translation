  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: కుమారులు
  rationale: ఇది ‘కుమారులు’ అనే పదానికి నిర్మాణ బహువచన రూపం. జనగణన సందర్భంలో వంశస్థులను లేదా కుటుంబ సమూహాన్ని సూచించగలిగినా, మూలంలోని బంధుత్వ పదాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: עַזְגָּד
  choice: అజ్గాదు
  rationale: ఇది వ్యక్తి లేదా వంశనామం; అర్థానువాదం చేయకుండా హీబ్రూ ఉచ్చారణకు సమీపంగా లిప్యంతరీకరించబడింది.
- source_word: אַלְפַּיִם שְׁלֹשׁ מֵאוֹת עֶשְׂרִים וּשְׁנָיִם
  choice: 2,322 మంది
  rationale: హీబ్రూ సంఖ్యా క్రమం ‘రెండు వేలు, మూడు వందలు, ఇరవై మరియు రెండు’ అని ఉంది. ఆధునిక పాఠకులకు స్పష్టంగా ఉండేందుకు అంకెలలో ఇచ్చి, ఇది వ్యక్తుల సంఖ్య అని సహజంగా తెలియజేయడానికి ‘మంది’ చేర్చబడింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన జనగణన జాబితా శైలిని పాటించింది. ‘కుమారులు’ మూలరూపాన్ని కాపాడుతూనే ఇక్కడ వంశస్థులు లేదా కుటుంబ సభ్యులు అనే విస్తృత భావాన్ని కలిగి ఉండగలదు.
