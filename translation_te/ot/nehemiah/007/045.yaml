translation:
  language: te
  text: 'ద్వారపాలకులు: షల్లూము కుమారులు[a], ఆటేరు కుమారులు, తల్మోను కుమారులు, అక్కూబు కుమారులు, హటీతా కుమారులు, షోబయి కుమారులు—మొత్తం 138 మంది.'
