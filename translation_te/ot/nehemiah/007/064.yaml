revisions:
- from: వీరు వంశావళి ప్రకారం నమోదైనవారి జాబితాలో తమ వంశాధార పత్రాన్ని[a] వెదికారు; కానీ అది దొరకలేదు. కాబట్టి వారు యాజకత్వానికి అనర్హులుగా పరిగణించబడ్డారు[b].
  to: వీరు వంశావళి ప్రకారం నమోదైనవారి జాబితాలో తమ వంశపత్రాన్ని[a] వెదికారు; కానీ అది దొరకలేదు. కాబట్టి వారు యాజకత్వం నుండి తొలగించబడ్డారు[b].
  rationale: The revision retains the draft’s sound handling of the genealogical written record and the singular ‘it was not found,’ while making the final clause correspond directly to exclusion ‘from the priesthood.’ Footnote b corrects an inaccurate Telugu verb and preserves the Hebrew term’s impurity/defilement nuance as a contextual alternative.
