source:
  edition: WLC
  text: אֵ֗לֶּה בִּקְשׁ֧וּ כְתָבָ֛/ם הַ/מִּתְיַחְשִׂ֖ים וְ/לֹ֣א נִמְצָ֑א וַ/יְגֹֽאֲל֖וּ מִן הַ/כְּהֻנָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/064.yaml
  text: These sought their record among those enrolled by genealogy[a], but it was not found[b], so they were excluded from the priesthood.
translation:
  language: te
  text: వీరు వంశావళి ప్రకారం నమోదైనవారి జాబితాలో తమ వంశపత్రాన్ని[a] వెదికారు; కానీ అది దొరకలేదు. కాబట్టి వారు యాజకత్వం నుండి తొలగించబడ్డారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘తమ వంశావళి నమోదు పత్రాన్ని.’ హీబ్రూ పదబంధం వంశాన్ని నిరూపించే లిఖిత పత్రాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘వారు యాజకత్వానికి అపవిత్రులుగా పరిగణించబడ్డారు.’ వారి వంశం నిర్ధారించబడనందున, వారిని యాజకత్వం నుండి తొలగించారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: వీరు
  rationale: ముందు పేర్కొన్న సమూహాన్ని సూచించే బహువచన సర్వనామం; మూలంలో లేని ‘పురుషులు’ వంటి నామాన్ని చేర్చదు.
- source_word: בִּקְשׁוּ
  choice: వెదికారు
  rationale: בקשׁ యొక్క ‘వెదుకు/కోరు’ అనే సాధారణ అర్థాన్ని ఈ పత్రసంబంధ సందర్భంలో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: כְתָבָם
  choice: తమ వంశాధార పత్రాన్ని
  rationale: כְּתָב అంటే లిఖిత పత్రం. ఇక్కడ అది వంశసంబంధ హక్కును నిరూపించే పత్రం కాబట్టి ‘వంశాధార పత్రం’ సందర్భార్థాన్ని స్పష్టంగా, అతిగా నిర్దిష్టం చేయకుండా తెలియజేస్తుంది.
- source_word: הַמִּתְיַחְשִׂים
  choice: వంశావళి ప్రకారం నమోదైనవారి జాబితాలో
  rationale: יחשׂ హిత్పయేల్ రూపం వంశాన్ని నిర్ధారించుకోవడం లేదా వంశపరంగా నమోదు కావడాన్ని సూచిస్తుంది. పరిపాలనా-వంశావళి సందర్భాన్ని ఆధునిక తెలుగులో సహజంగా అందిస్తుంది.
- source_word: וְלֹא נִמְצָא
  choice: కానీ అది దొరకలేదు
  rationale: ఏకవచన క్రియకు ముందున్న లిఖిత పత్రమే సహజ కర్త; ప్రజలు దొరకలేదని కాక పత్రం దొరకలేదని తెలుపుతుంది.
- source_word: וַיְגֹאֲלוּ
  choice: అనర్హులుగా పరిగణించబడ్డారు
  rationale: ఈ సందర్భంలో ధృవీకరించని వంశం కారణంగా యాజక హోదాకు అపవిత్రులు లేదా అనర్హులుగా నిర్ణయించబడిన భావం ఉంది. ప్రధాన పాఠంలో ‘అనర్హులు’ కార్యసంబంధ ఫలితాన్ని స్పష్టంగా తెలియజేస్తుంది; మూలంలోని అపవిత్రత భావాన్ని పాదటిప్పణి నిలుపుతుంది.
- source_word: מִן הַכְּהֻנָּה
  choice: యాజకత్వానికి
  rationale: כְּהֻנָּה యాజకత్వం లేదా యాజక పదవిని సూచిస్తుంది. ‘యాజకత్వానికి అనర్హులు’ అనే తెలుగు నిర్మాణం మూలంలోని దూరీకరణ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: וַיְגֹאֲלוּలోని అపవిత్రత మరియు పదవినుండి మినహాయింపు మధ్య భావ ఉద్వేగం
  choice: ప్రధాన పాఠంలో ‘యాజకత్వానికి అనర్హులుగా పరిగణించబడ్డారు’
  alternative: ‘యాజకత్వం నుండి అపవిత్రులుగా తొలగించబడ్డారు’ లేదా ‘యాజకత్వానికి అపవిత్రులుగా ఎంచబడ్డారు’
  rationale: ఇక్కడ నైతిక పాపం చేశారనే భావాన్ని చేర్చకుండా, వంశాధారం నిర్ధారణ కాకపోవడం వల్ల కలిగిన యాజక హోదా నష్టాన్ని ప్రధాన పాఠం తెలియజేస్తుంది. అదే సమయంలో మూలంలోని ‘అపవిత్రులు’ అనే బలమైన పదభావాన్ని పాదటిప్పణి స్పష్టంగా సంరక్షిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన చారిత్రక-పరిపాలనా శైలి వాడబడింది. ‘వంశాధార పత్రం,’ ‘వంశావళి ప్రకారం నమోదైనవారు’ వంటి పదబంధాలు సాధారణ పాఠకులకు అర్థమయ్యేలా ఉండి, మూలంలోని లిఖిత నమోదు మరియు వంశ నిర్ధారణ భావాలను నిలుపుతాయి.
