translation:
  language: te
  text: బేత్లెహేము, నెటోఫా నివాసులైన పురుషులు[a] నూట ఎనభై ఎనిమిది మంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “బేత్లెహేము, నెటోఫా ప్రజలు.” హీబ్రూలో అక్షరార్థంగా “బేత్లెహేము మరియు నెటోఫా యొక్క పురుషులు” అని ఉంది; జనగణన, తిరిగివచ్చినవారి జాబితాల్లో ఇది సాధారణంగా వాడే ప్రయోగం.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַנְשֵׁי
  choice: పట్టణాల పురుషులు
  rationale: אִישׁ పదపు నిర్మాణ బహువచనం ఇక్కడ ప్రాంతాలవారీగా తిరిగి వచ్చినవారి జాబితాను పరిచయం చేస్తుంది. హీబ్రూలోని పుంలింగ రూపాన్ని నిలుపుతూ, సహజమైన తెలుగు జాబితా శైలిలో ‘పురుషులు’ అని అనువదించాం; ‘పట్టణాల’ అనేది రెండు స్థలనామాలతో దాని సంబంధాన్ని స్పష్టం చేస్తుంది.
- source_word: בֵית לֶחֶם
  choice: బేత్లెహేము
  rationale: స్థలనామాన్ని అర్థానువాదం చేయకుండా తెలుగులో ప్రాచుర్యంలో ఉన్న బైబిలు రూపంలో లిప్యంతరీకరించాం.
- source_word: וּנְטֹפָה
  choice: నెటోఫా
  rationale: సంయోజకంతో కూడిన స్థలనామం. బేత్లెహేము, నెటోఫా రెండింటికీ కలిపి ఒకే సంఖ్య ఇవ్వబడినందున సమన్వయ జాబితాగా అనువదించాం.
- source_word: מֵאָה שְׁמֹנִים וּשְׁמֹנָה
  choice: నూట ఎనభై ఎనిమిది మంది
  rationale: హీబ్రూ సంఖ్య 188ను సహజమైన ఆధునిక తెలుగు రూపంలో ఇచ్చాం; వ్యక్తుల లెక్క అని స్పష్టం చేయడానికి ‘మంది’ చేర్చాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళి/జనగణన జాబితాకు తగిన సంక్షిప్తమైన గంభీర శైలిని ఉపయోగించాం. రెండు స్థలాలకూ కలిపి ఒకే మొత్తం ఇవ్వబడిన నిర్మాణాన్ని నిలిపాం.
