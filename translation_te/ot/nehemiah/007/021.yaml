  text: 'the sons of Ater[a], of Hezekiah: ninety-eight.'
translation:
  language: te
  text: ఆటేరు, హిజ్కియాకు చెందిన వారి కుమారులు[a]—తొంభై ఎనిమిది మంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆటేరు వంశస్థులు, అనగా హిజ్కియా శాఖవారు.” ఇది ఆటేరు వంశంలోని హిజ్కియాతో సంబంధం ఉన్న ఒక ప్రత్యేక శాఖను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: కుమారులు
  rationale: వంశావళి, జనగణన జాబితాల్లో ఈ పదం ప్రత్యక్ష కుమారులనే కాక వంశస్థులను లేదా కుటుంబ సభ్యులను కూడా సూచించగలదు. మూలంలోని రూపాన్ని నిలుపుతూ సహజమైన తెలుగులో ‘కుమారులు’ అని ఇచ్చాం.
- source_word: אָטֵר
  choice: ఆటేరు
  rationale: వ్యక్తి లేదా కుటుంబ నామం కాబట్టి అర్థానువాదం చేయకుండా తెలుగులో లిప్యంతరీకరించాం.
- source_word: לְחִזְקִיָּה
  choice: హిజ్కియా వంశానికి చెందిన
  rationale: ఇక్కడ לְ అనుబంధాన్ని లేదా ఒక కుటుంబశాఖను సూచిస్తున్నట్లు కనిపిస్తుంది. ‘హిజ్కియా వంశానికి చెందిన’ అనే రూపం ఆ సంబంధాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: תִּשְׁעִים וּשְׁמֹנָה
  choice: తొంభై ఎనిమిది మంది
  rationale: సంఖ్యను ప్రామాణిక ఆధునిక తెలుగు రూపంలో ఇచ్చి, వ్యక్తుల లెక్క అని స్పష్టపడేందుకు ‘మంది’ చేర్చాం.
