  register: ఆధునిక ప్రామాణిక తెలుగులో, తిరిగివచ్చిన వారి జనగణన జాబితాకు తగిన సంక్షిప్తమైన, గౌరవప్రదమైన శైలిని ఉపయోగించాం. మూలంలోని వంశసంబంధ అస్పష్టతను పాదసూచికలో నిలిపాం.
