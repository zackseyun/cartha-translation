source:
  edition: WLC
  text: וַ/יִּתֵּ֤ן אֱלֹהַ/י֙ אֶל לִבִּ֔/י וָ/אֶקְבְּצָ֞/ה אֶת הַ/חֹרִ֧ים וְ/אֶת הַ/סְּגָנִ֛ים וְ/אֶת הָ/עָ֖ם לְ/הִתְיַחֵ֑שׂ וָֽ/אֶמְצָ֗א סֵ֤פֶר הַ/יַּ֨חַשׂ֙ הָ/עוֹלִ֣ים בָּ/רִאשׁוֹנָ֔ה וָ/אֶמְצָ֖א כָּת֥וּב בּֽ/וֹ־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/005.yaml
  text: 'Then my God put it into my heart to assemble the nobles[a], the officials, and the people to be enrolled by genealogy. And I found the book of the genealogy of those who came up first[b], and I found written in it:'
translation:
  language: te
  text: 'అప్పుడు వంశావళి ప్రకారం నమోదు కావడానికి[a] ప్రముఖులను, అధికారులను, ప్రజలను సమకూర్చాలనే తలంపును నా దేవుడు నా హృదయంలో ఉంచాడు. మొదట వచ్చినవారి[b] వంశావళి గ్రంథం నాకు దొరికింది; అందులో ఇలా వ్రాయబడి ఉన్నట్లు నేను కనుగొన్నాను:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వంశావళి ప్రకారం నమోదు చేయడానికి.” హెబ్రీ పదం కుటుంబ వంశం ఆధారంగా జరిగే అధికారిక నమోదును సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “మొట్టమొదట పైకి వచ్చినవారి.” ఇక్కడ ‘పైకి రావడం’ అనేది యెరూషలేము లేదా దేశానికి వెళ్లడాన్ని సూచించే హెబ్రీ నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן אֱלֹהַי אֶל־לִבִּי
  choice: తలంపును నా దేవుడు నా హృదయంలో ఉంచాడు
  rationale: హెబ్రీ నుడికారంలోని దేవుని చొరవను, అంతరంగ ప్రేరేపణను నిలుపుతూ, అది అధికారిక ప్రత్యక్షత అని మించిపోయి చెప్పకుండా సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וָאֶקְבְּצָה
  choice: సమకూర్చి
  rationale: ప్రముఖులు, అధికారులు, ప్రజలు ఒక అధికారిక కార్యం నిమిత్తం కూడే సందర్భానికి ‘సమకూర్చి’ సహజంగా సరిపోతుంది; ఈ క్రియను దేవుడు హృదయంలో ఉంచిన ఉద్దేశంలో భాగంగా చూపుతుంది.
- source_word: הַחֹרִים
  choice: ప్రముఖులు
  rationale: ఈ సందర్భంలో ఈ పదం స్వతంత్రులనే సాధారణ అర్థంలో కాక, సమాజంలోని ఉన్నతస్థాయి నాయకులను సూచిస్తుంది. ఆధునిక తెలుగులో ‘ప్రముఖులు’ స్పష్టంగా, గౌరవప్రదంగా ఉంటుంది.
- source_word: הַסְּגָנִים
  choice: అధికారులు
  rationale: పరిపాలనలోని ఉపపాలకులు లేదా నియమిత అధికారులను సూచించే విస్తృతమైన, సహజమైన ఆధునిక తెలుగు పదం.
- source_word: לְהִתְיַחֵשׂ
  choice: వంశావళి ప్రకారం నమోదు చేయించడానికి
  rationale: కుటుంబ వంశాన్ని నిర్ధారించి అధికారిక పట్టికలో నమోదు చేసే ప్రక్రియను తెలియజేస్తుంది. హిత్పయేల్ రూపంలోని నమోదు కావడం/తమ వంశాన్ని నమోదు చేయించుకోవడం అనే భావాన్ని తెలుగులో సహజంగా అందిస్తుంది.
- source_word: סֵפֶר הַיַּחַשׂ
  choice: వంశావళి గ్రంథం
  rationale: ఇది వంశపరమైన అధికారిక లిఖిత నమోదు అని సంక్షిప్తంగా, మూలానికి దగ్గరగా తెలియజేస్తుంది.
- source_word: הָעוֹלִים בָּרִאשׁוֹנָה
  choice: మొదట వచ్చినవారు
  rationale: చెరనుండి యూదా దేశానికి ముందుగా వచ్చిన సమూహాన్ని సూచిస్తుంది. ‘వచ్చినవారు’ లక్ష్యస్థాన దృష్టికోణంలో సహజంగా ఉండగా, ‘మొదట’ బָּרִאשׁוֹנָה భావాన్ని నిలుపుతుంది.
- source_word: וָאֶמְצָא כָתוּב בּוֹ
  choice: అందులో ఇలా రాసి ఉండడం నేను కనుగొన్నాను
  rationale: తరువాత వచ్చే జాబితాకు పరిచయంగా పనిచేసే హెబ్రీ వాక్యక్రమం, లిఖిత పత్ర స్వభావం రెండింటినీ నిలుపుతుంది.
theological_decisions:
- issue: నెహెమ్యా నాయకత్వంలో దేవుని అంతరంగ ప్రేరేపణ
  choice: తలంపును నా దేవుడు నా హృదయంలో ఉంచాడు
  alternative: నా దేవుడు నాకు ప్రేరణ ఇచ్చాడు
  rationale: మూలం దేవుని చొరవతో కలిగిన అంతరంగ తలంపును చెబుతుంది గాని, దాని ప్రకటన విధానాన్ని వివరించదు. ఎంచుకున్న రూపం దానిని ప్రత్యేక దైవావేశంగా అతిశయింపజేయకుండా, కేవలం వ్యక్తిగత ఆలోచనగా తగ్గించకుండా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి వాడబడింది. పరిపాలనా సందర్భానికి ‘ప్రముఖులు,’ ‘అధికారులు,’ ‘నమోదు’ అనే సులభంగా అర్థమయ్యే పదాలు ఎంచుకోబడ్డాయి. వాక్యాంతంలోని ద్విబిందువు తరువాతి వంశావళి జాబితాను పరిచయం చేస్తుంది.
