lexical_decisions:
- source_word: וְהָעִיר
  choice: పట్టణం
  rationale: הָעִיר అంటే ‘పట్టణం.’ ముందున్న וְ అనే సంధానాన్ని తెలుగు వాక్యప్రవాహంలో ప్రత్యేక పదంగా చూపకపోయినా సంబంధం స్పష్టంగానే ఉంటుంది.
- source_word: רַחֲבַת יָדַיִם
  choice: విశాలంగా
  rationale: అక్షరార్థంగా ‘చేతుల మేర వెడల్పైనది’ అనే ఈ నుడికారం విస్తారమైన స్థలాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘విశాలంగా’ సహజమైన సమానం.
- source_word: וּגְדוֹלָה
  choice: పెద్దదిగా
  rationale: ఇక్కడ גדול హోదా లేదా ప్రాముఖ్యతను కాక పట్టణ పరిమాణాన్ని సూచిస్తుంది.
- source_word: וְהָעָם מְעַט
  choice: కానీ ... ప్రజలు కొద్దిమందే ఉన్నారు
  rationale: מְעַט సంఖ్యాపరమైన కొరతను సూచిస్తుంది. విశాలమైన పట్టణానికి, కొద్దిమంది నివాసులకు మధ్య ఉన్న భావవ్యతిరేకతను ‘కానీ’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בְּתוֹכָהּ
  choice: దానిలో
  rationale: ‘దాని మధ్యలో/దానిలో’ అనే భావాన్ని సరళమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: וְאֵין בָּתִּים בְּנוּיִם
  choice: నిర్మించిన ఇళ్లు లేవు
  rationale: אֵין ఉనికి లేకపోవడాన్ని, בְּנוּיִם ‘నిర్మించబడిన’ స్థితిని సూచిస్తాయి. హీబ్రూలో ‘తిరిగి నిర్మించిన’ అనే ఉపసర్గ లేనందున పునర్నిర్మాణ భావాన్ని పాఠ్యంలో చేర్చలేదు.
