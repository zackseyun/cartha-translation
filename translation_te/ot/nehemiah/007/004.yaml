    text: లేదా, “పట్టణం విశాలంగా, పెద్దదిగా ఉంది; దానిలో ప్రజలు కొద్దిమందే ఉన్నారు, నిర్మించిన ఇళ్లు లేవు.” హీబ్రూ వాక్యంలో భాగాలు ‘మరియు’ అనే సంధానంతో వరుసగా ఉన్నాయి; ప్రధాన పాఠం వాటి మధ్యనున్న భావవ్యతిరేకతను సహజమైన తెలుగులో చూపుతుంది.
