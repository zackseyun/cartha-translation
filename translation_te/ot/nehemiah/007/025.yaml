lexical_decisions:
- source_word: בְּנֵי
  choice: కుమారులు
  rationale: ఇది בֵּן పదానికి నిర్మాణ బహువచన రూపం. వంశావళి/జనగణన జాబితాలో ఇది ప్రత్యక్ష కుమారులనే కాకుండా ఒక వంశం లేదా సమాజానికి చెందినవారిని కూడా సూచించవచ్చు. అయినప్పటికీ, జాబితాలోని పునరావృత సూత్రరూపాన్ని నిలుపుటకు ‘కుమారులు’ అని అనువదించబడింది.
- source_word: גִבְעוֹן
  choice: గిబియోను
  rationale: హీబ్రూ స్థలనామాన్ని తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించిన రూపం.
- source_word: תִּשְׁעִים וַחֲמִשָּׁה
  choice: తొంభై ఐదుగురు
  rationale: ఈ సంఖ్యాపదబంధం 95ను సూచిస్తుంది. లెక్కించబడుతున్నవారు మనుషులు కాబట్టి సహజమైన ఆధునిక తెలుగులో ‘ఐదుగురు’ అనే మానవవాచక సంఖ్యారూపం వాడబడింది.
