lexical_decisions:
- source_word: בְּנֵי
  choice: కుమారులు
  rationale: వంశావళి జాబితాలో ఇది కుటుంబం లేదా వంశశాఖకు చెందినవారిని సూచించగలిగినా, హీబ్రూ పదంలోని పుత్రసంబంధ రూపాన్ని నిలుపుతూ సహజమైన తెలుగులో ‘కుమారులు’ అని అనువదించాం.
- source_word: יַעְלָא
  choice: యాలా
  rationale: ఇది వ్యక్తినామం; అర్థానువాదం చేయకుండా హీబ్రూ ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించాం.
- source_word: דַרְקוֹן
  choice: దర్కోను
  rationale: వ్యక్తినామాన్ని హీబ్రూ రూపానికి దగ్గరగా, తెలుగు పఠనానికి అనుకూలంగా లిప్యంతరీకరించాం.
- source_word: גִדֵּל
  choice: గిద్దేలు
  rationale: ద్విత్వ ద ధ్వనిని నిలుపుతూ వ్యక్తినామాన్ని హీబ్రూ నుంచి లిప్యంతరీకరించాం.
