  yaml_path: translation/ot/nehemiah/007/055.yaml
  text: the sons of Barkos[a], the sons of Sisera, the sons of Temah.
translation:
  language: te
  text: బర్కోసు వంశస్థులు, సీసెరా వంశస్థులు, తామహు[a] వంశస్థులు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తేమహు.”
    reason: పేరు లిప్యంతరీకరణలో ఉన్న ప్రత్యామ్నాయ సంప్రదాయ రూపం.
lexical_decisions:
- source_word: בְּנֵי
  choice: వంశస్థులు
  rationale: తిరిగి వచ్చిన కుటుంబాల జాబితాలో בְּנֵי అనే పదం అక్షరార్థంగా ‘కుమారులు’ అయినప్పటికీ, ఇక్కడ ఒక కుటుంబ వంశానికి చెందినవారిని సూచిస్తుంది. అందువల్ల ఆధునిక తెలుగులో సహజంగా, సందర్భానికి ఖచ్చితంగా ఉండే ‘వంశస్థులు’ ఎంచుకున్నాం.
- source_word: בַרְקוֹס
  choice: బర్కోసు
  rationale: ఇది వ్యక్తి లేదా కుటుంబానికి చెందిన పేరు; హీబ్రూ ఉచ్చారణకు దగ్గరగా తెలుగులో లిప్యంతరీకరించాం.
- source_word: סִיסְרָא
  choice: సీసెరా
  rationale: ఇది ఈ జాబితాలో కుటుంబాన్ని గుర్తించే పేరు; హీబ్రూ రూపానికి అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: תָמַח
  choice: తామహు
  rationale: ఇచ్చిన మసొరెతిక్ పాఠంలోని תָמַח రూపాన్ని అనుసరించి ‘తామహు’ అని లిప్యంతరీకరించాం. కొన్ని అనువాద సంప్రదాయాల్లో కనిపించే ‘తేమహు’ రూపాన్ని పాదసూచికలో ఉంచాం.
theological_decisions: []
translation_notes:
  register: కుటుంబాల జాబితాకు తగిన సంక్షిప్త, గంభీర శైలిని పాటించాం. ప్రతి పేరుతో ‘వంశస్థులు’ అని పునరుక్తి చేసి హీబ్రూ వాక్య నిర్మాణాన్ని నిలిపాం. ఆంగ్ల సంప్రదింపుపాఠంలో పాదసూచిక గుర్తు ‘Barkos’ తర్వాత ఉన్నప్పటికీ, దాని విషయం תָמַח పేరుకు సంబంధించినందున తెలుగులో సరైన పేరు తర్వాత ఉంచాం.
