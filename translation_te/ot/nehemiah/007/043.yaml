  variant: modern standard Telugu
source:
  edition: WLC
  text: הַ/לְוִיִּ֑ם בְּנֵֽי יֵשׁ֧וּעַ לְ/קַדְמִיאֵ֛ל לִ/בְנֵ֥י לְ/הוֹדְוָ֖ה שִׁבְעִ֥ים וְ/אַרְבָּעָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/043.yaml
  text: 'The Levites: the sons of Jeshua[a], of Kadmiel, of the sons of Hodvah, seventy-four.'
translation:
  language: te
  text: 'లేవీయులు: యేషూవా కుమారులు, కద్మీయేలు వంశానికి చెందిన హోద్వా కుమారులు[a]—డెబ్బై నలుగురు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘హోద్వా సంతతివారు.’ ఇక్కడ ‘కుమారులు’ అనే హీబ్రూ వంశావళి పదం తక్షణ కుమారులనే కాక విస్తృత కుటుంబ వంశాన్ని కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַלְוִיִּם
  choice: లేవీయులు
  rationale: జనగణన జాబితాలోని ఈ ఉపవర్గాన్ని పరిచయం చేసే నిర్దిష్ట బహువచన నామవాచకం; మూలంలోని జాబితా శైలిని నిలుపుతూ అదనపు క్రియను చేర్చలేదు.
- source_word: בְּנֵי
  choice: కుమారులు
  rationale: వంశావళి సందర్భంలో ఇది తక్షణ కుమారులనే కాక విస్తృత సంతతి లేదా వంశ సభ్యులను కూడా సూచించగలదు. ప్రధాన పాఠంలో మూలంలోని రూపాన్ని నిలిపి, విస్తృత అర్థాన్ని పాదటిప్పణిలో తెలిపాం.
- source_word: יֵשׁוּעַ
  choice: యేషూవ
  rationale: నిర్వాసానంతర కాలపు ఈ వ్యక్తి పేరుకు హీబ్రూ ఉచ్చారణను ప్రతిబింబించే తెలుగు లిప్యంతరీకరణ.
- source_word: לְקַדְמִיאֵל
  choice: కద్మీయేలుకు చెందినవారు
  rationale: ఉపసర్గ ל ఇక్కడ వంశపరమైన లేదా సమూహ సంబంధాన్ని సూచిస్తుంది; తెలుగులో సహజంగా ఉండేలా ‘చెందినవారు’ అని అనువదించాం.
- source_word: לִבְנֵי לְהוֹדְוָה
  choice: హోద్వా కుమారులలోనివారు
  rationale: పునరుక్తమైన ל ఉపసర్గలతో ఉన్న పొరల వంశసంబంధాన్ని పూర్తిగా సాఫీ చేసి ఒకే సంబంధంగా మార్చకుండా, ‘లోనివారు’ అనే రూపంతో నిలిపాం.
- source_word: שִׁבְעִים וְאַרְבָּעָה
  choice: డెబ్బై నలుగురు
  rationale: వ్యక్తుల జనగణన మొత్తాన్ని ఆధునిక, సహజ తెలుగు సంఖ్యారూపంలో ఇచ్చాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, జనగణన జాబితాకు తగిన సంక్షిప్తమైన గంభీర శైలిని వాడాం. హీబ్రూ వాక్యంలోని వరుస వంశసంబంధాల కొంత అస్పష్టతను తొలగించకుండా ‘చెందినవారు, ...లోనివారు’ అనే నిర్మాణంతో నిలిపాం.
