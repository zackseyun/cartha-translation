lexical_decisions:
- source_word: אַנְשֵׁי
  choice: మనుషులు
  rationale: ఇది אִישׁ పదపు బహువచన సమాసరూపం. తిరిగివచ్చినవారి జాబితాలో ఒక స్థలానికి చెందిన పురుషులను సూచించే సహజమైన తెలుగు రూపంగా ‘మనుషులు’ ఎంచుకోబడింది.
- source_word: מִכְמָס
  choice: మిక్మాసు
  rationale: హీబ్రూ స్థలనామంలోని మ్־כ־מ־ס హల్లులను దగ్గరగా ప్రతిబింబించే తెలుగు లిప్యంతరీకరణ; తెలుగులో సులభంగా పలకడానికి చివర ‘ు’ చేర్చబడింది.
- source_word: מֵאָה וְעֶשְׂרִים וּשְׁנָיִם
  choice: 122 మంది
  rationale: హీబ్రూలోని ‘నూట ఇరవై ఇద్దరు’ అనే సంఖ్యను జాబితా శైలికి తగినట్లు అంకెలలో ఇచ్చి, వ్యక్తుల సంఖ్య అని స్పష్టంచేయడానికి ‘మంది’ చేర్చబడింది.
