  yaml_path: translation/ot/nehemiah/007/060.yaml
  text: All the temple servants and the sons of Solomon’s servants were three hundred ninety-two[a].
translation:
  language: te
  text: దేవాలయ సేవకులందరూ, సొలొమోను సేవకుల కుమారులందరూ కలిపి మూడు వందల తొంభై రెండు మంది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నెతీనీయులు”; ఇది దేవాలయ సేవకుల ప్రత్యేక వర్గానికి వాడే సంప్రదాయ లిప్యంతరీకరణ.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל
  choice: అందరూ ... కలిపి
  rationale: జనగణన జాబితాలో పేర్కొన్న రెండు వర్గాల మొత్తం సంఖ్యను సహజమైన తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: הַנְּתִינִים
  choice: దేవాలయ సేవకులు
  rationale: దేవాలయ సేవకు నియమించబడిన ప్రత్యేక వర్గం యొక్క విధిని ఆధునిక పాఠకులకు స్పష్టంగా తెలియజేస్తుంది; సంప్రదాయ లిప్యంతరీకరణను పాదసూచికలో ఉంచాం.
- source_word: וּבְנֵי
  choice: కుమారులు
  rationale: మూలంలోని ‘కుమారులు’ అనే రూపాన్ని, అది ఒక గుర్తింపు పొందిన వర్గనామంగా ఉండగల సందర్భాన్ని కాపాడుతుంది; సందర్భానుసారంగా వంశస్థులు అనే విస్తృత భావం ఉండవచ్చు.
- source_word: עַבְדֵי
  choice: సేవకులు
  rationale: עֶבֶד కు సేవకులు లేదా దాసులు అనే అర్థాలు ఉండవచ్చు; ఇక్కడ సామాజిక-పరిపాలనా వర్గనామంలో బానిసత్వ స్థితిని ప్రత్యేకంగా నొక్కిచెప్పడం లేదు కాబట్టి ‘సేవకులు’ సహజంగా సరిపోతుంది.
- source_word: שְׁלֹמֹה
  choice: సొలొమోను
  rationale: తెలుగు బైబిలు వాడుకకు అనుగుణమైన వ్యక్తినామ రూపం.
- source_word: שְׁלֹשׁ מֵאוֹת תִּשְׁעִים וּשְׁנָיִם
  choice: మూడు వందల తొంభై రెండు మంది
  rationale: హీబ్రూ సంఖ్యను చదవడానికి సహజమైన తెలుగు పదరూపంలో ఇచ్చి, లెక్క వ్యక్తులదని ‘మంది’తో స్పష్టం చేశాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; జాబితా శైలికి తగిన సంక్షిప్తతతో, గౌరవప్రదంగా మరియు సాధారణ పాఠకులకు సులభంగా రూపొందించబడింది. మూలంలోని రెండు పరిపాలనా వర్గాలను వేరుగా ఉంచి, మొత్తం సంఖ్యను ‘కలిపి’ అనే పదంతో సహజంగా తెలిపింది.
