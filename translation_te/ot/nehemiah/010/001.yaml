translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరతను నిలుపుకుంటూనే సాధారణ పాఠకులకు స్పష్టంగా ఉండే పరిపాలనా, ఒప్పంద పదజాలం వాడబడింది. హీబ్రూ నుడికారమైన ‘ఒప్పందం కోయడం’ ప్రధాన పాఠ్యంలో సహజీకరించి, పాదటిప్పణిలో భద్రపరచబడింది.
