  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/בְ/כָל זֹ֕את אֲנַ֛חְנוּ כֹּרְתִ֥ים אֲמָנָ֖ה וְ/כֹתְבִ֑ים וְ/עַל֙ הֶֽ/חָת֔וּם שָׂרֵ֥י/נוּ לְוִיֵּ֖/נוּ כֹּהֲנֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/001.yaml
  text: And because of all this[a], we are making a binding agreement in writing, and on the sealed document are our officials, our Levites[b], and our priests.
translation:
  language: te
  text: వీటన్నిటి కారణంగా[a] మేము ఒక స్థిరమైన ఒప్పందం కుదుర్చుకొని, దానిని వ్రాతపూర్వకంగా చేస్తున్నాం. ముద్రవేసిన ఆ పత్రంపై మా అధికారులు, మా లేవీయులు, మా యాజకులు తమ ముద్రలు వేశారు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వీటన్నిటిలో మేము ఒక స్థిరమైన ఒప్పందాన్ని కుదుర్చుకొని దానిని వ్రాస్తున్నాం.” ఒప్పందం చేయడాన్ని హీబ్రూ అక్షరార్థంగా “కోయడం” అని చెబుతుంది; ఇక్కడి నామవాచకాన్ని “స్థిరమైన ఒప్పందం” లేదా “నమ్మకమైన ప్రతిజ్ఞ” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ముద్రవేసిన పత్రంపై మా అధికారులు, మా లేవీయులు, మా యాజకులు.” హీబ్రూలో క్రియ అంతర్లీనంగా ఉంది; సందర్భంలో వీరు పత్రంపై ముద్రవేసినవారిగా సూచించబడ్డారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְכָל זֹאת
  choice: వీటన్నిటి కారణంగా
  rationale: בְּ అనే ఉపసర్గ ఇక్కడ ముందటి ఒప్పుకోలు, పరిస్థితులన్నిటినీ వెనక్కి సూచిస్తూ కారణార్థాన్ని కలిగిస్తుంది; ఆధునిక తెలుగులో ఈ రూపం సహజంగా ఉంది.
- source_word: כֹּרְתִים אֲמָנָה
  choice: ఒక స్థిరమైన ఒప్పందం చేసుకొని
  rationale: כרת అనే క్రియకు అక్షరార్థం ‘కోయడం’ అయినా, ఒప్పంద సందర్భంలో అది ‘ఒప్పందం చేయడం’ అనే స్థిరమైన హీబ్రూ నుడికారం. אֲמָנָה ఒప్పందపు దృఢత, విశ్వసనీయ బాధ్యతను సూచిస్తుంది.
- source_word: וְכֹתְבִים
  choice: దాన్ని వ్రాతపూర్వకంగా నమోదు చేస్తున్నాం
  rationale: ఒప్పందాన్ని వ్రాసి అధికారికంగా నమోదు చేస్తున్న చర్యను సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: וְעַל הֶחָתוּם
  choice: ముద్రవేసిన ఆ పత్రంపై
  rationale: הֶחָתוּם సందర్భంలో ముద్రించబడిన లిఖిత పత్రాన్ని సూచిస్తుంది; ‘పత్రం’ అనేది అంతర్లీన నామవాచకాన్ని స్పష్టంగా తెలిపే సహజ సమానార్థకం.
- source_word: שָׂרֵינוּ
  choice: మా అధికారులు
  rationale: పర్షియా అనంతర పరిపాలనా సందర్భంలో שׂרים గుర్తింపు పొందిన పౌర నాయకులు లేదా అధికారులను సూచిస్తుంది; ‘అధికారులు’ రాజవంశార్థాన్ని అనవసరంగా చేర్చదు.
- source_word: לְוִיֵּינוּ
  choice: మా లేవీయులు
  rationale: లేవి గోత్రానికి, ఆలయ సేవకు సంబంధించిన వర్గానికి వాడే స్థిరమైన తెలుగు రూపం.
- source_word: כֹּהֲנֵינוּ
  choice: మా యాజకులు
  rationale: యాజక వర్గాన్ని సూచించే స్పష్టమైన, ప్రామాణిక తెలుగు పదం.
