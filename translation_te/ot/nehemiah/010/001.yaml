- from: వీటన్నిటి కారణంగా[a] మేము ఒక స్థిరమైన ఒప్పందం చేసుకొని, దాన్ని వ్రాతపూర్వకంగా నమోదు చేస్తున్నాం. ముద్రవేసిన ఆ పత్రంపై మా అధికారులు, మా లేవీయులు, మా యాజకుల పేర్లు ఉన్నాయి.[b]
  to: వీటన్నిటి కారణంగా[a] మేము ఒక స్థిరమైన ఒప్పందం కుదుర్చుకొని, దానిని వ్రాతపూర్వకంగా చేస్తున్నాం. ముద్రవేసిన ఆ పత్రంపై మా అధికారులు, మా లేవీయులు, మా యాజకులు తమ ముద్రలు వేశారు.[b]
