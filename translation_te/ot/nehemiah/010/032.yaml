  to: ఆ దేశంలోని ప్రజలు విశ్రాంతి దినాన అమ్మడానికి సరుకులనూ అన్ని రకాల ధాన్యాన్నీ తీసుకొస్తే, విశ్రాంతి దినాన గానీ పవిత్ర దినాన గానీ మేము వారి దగ్గర కొనము. ఏడవ సంవత్సరంలో భూమిని సాగుచేయకుండా విడిచిపెడతాము; ప్రతి అప్పునూ మాఫీ చేస్తాము.[a]
