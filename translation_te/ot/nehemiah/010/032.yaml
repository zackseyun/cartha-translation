id: NEH.10.32
reference: Nehemiah 10:32
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/עַמֵּ֣י הָ/אָ֡רֶץ הַֽ/מְבִיאִים֩ אֶת הַ/מַּקָּח֨וֹת וְ/כָל שֶׁ֜בֶר בְּ/י֤וֹם הַ/שַּׁבָּת֙ לִ/מְכּ֔וֹר לֹא נִקַּ֥ח מֵ/הֶ֛ם בַּ/שַּׁבָּ֖ת וּ/בְ/י֣וֹם קֹ֑דֶשׁ וְ/נִטֹּ֛שׁ אֶת הַ/שָּׁנָ֥ה הַ/שְּׁבִיעִ֖ית וּ/מַשָּׁ֥א כָל יָֽד־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/032.yaml
  text: As for the peoples of the land who bring goods and any grain on the Sabbath day to sell[a], we will not buy from them on the Sabbath or on a holy day; and we will forego the seventh year and every debt.
translation:
  language: te
  text: ఆ దేశంలోని ప్రజలు విశ్రాంతి దినాన అమ్మడానికి సరుకులనూ అన్ని రకాల ధాన్యాన్నీ తీసుకొస్తే, విశ్రాంతి దినాన గానీ పవిత్ర దినాన గానీ మేము వారి దగ్గర కొనము. ఏడవ సంవత్సరంలో భూమిని సాగుచేయకుండా విడిచిపెడతాము; ప్రతి అప్పునూ మాఫీ చేస్తాము.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ప్రతి హక్కుదావానూ” లేదా “ప్రతి వసూలునూ వదులుకుంటాము.” హీబ్రూ నుడికారానికి అక్షరార్థం, “ప్రతి చేతి భారము/వసూలు.”
    reason: מַשָּׁא כָל יָד అనే హీబ్రూ నుడికారం క్లిష్టమైనది; సందర్భంలో అది అప్పు, హక్కుదావా, లేదా వసూలును సూచించవచ్చు.
lexical_decisions:
- source_word: עַמֵּי הָאָרֶץ
  choice: దేశ ప్రజలు
  rationale: బహువచనాన్ని నిలుపుతూ, సందర్భంలోని స్థానిక లేదా చుట్టుపక్కల యూదేతర జనసమూహాలను సహజమైన ఆధునిక తెలుగులో సూచిస్తుంది.
- source_word: הַמַּקָּחוֹת
  choice: సరుకులను
  rationale: వ్యాపారం కోసం తెచ్చే వస్తువులు లేదా వర్తక సామగ్రి అనే విస్తృత అర్థాన్ని సహజంగా అందిస్తుంది.
- source_word: שֶׁבֶר
  choice: ధాన్యాన్నైనా
  rationale: వర్తక సందర్భంలో ఈ పదానికి సాధారణంగా ధాన్యం అనే నిర్దిష్ట అర్థం ఉంది; כָל భావాన్ని ‘ఏ...నైనా’ ద్వారా వ్యక్తం చేసింది.
- source_word: לֹא נִקַּח מֵהֶם
  choice: మేము వారి దగ్గర కొనము
  rationale: לקח ప్రాథమికంగా ‘తీసుకోవడం’ అయినా, అమ్మడానికి తెచ్చిన సరుకుల సందర్భంలో ‘కొనడం’ ఉద్దేశిత వాణిజ్య భావాన్ని స్పష్టంగా తెలుపుతుంది.
- source_word: וּבְיוֹם קֹדֶשׁ
  choice: పవిత్ర దినాన గానీ
  rationale: ప్రతికూల వాక్యంలో విశ్రాంతి దినంతో పాటు ఇతర పవిత్ర దినాన్నీ చేర్చే భావాన్ని తెలుగు ‘గానీ...గానీ’ నిర్మాణం సహజంగా తెలియజేస్తుంది.
- source_word: וְנִטֹּשׁ אֶת הַשָּׁנָה הַשְּׁבִיעִית
  choice: ఏడవ సంవత్సరంలో భూమిని సాగుచేయకుండా విడిచిపెడతాము
  rationale: ‘ఏడవ సంవత్సరాన్ని విడిచిపెట్టడం’ అనే సంక్షిప్త హీబ్రూ ప్రయోగం సూచించే వ్యవసాయ విశ్రాంతిని తెలుగులో అర్థవంతంగా వ్యక్తం చేస్తుంది.
- source_word: מַשָּׁא כָל יָד
  choice: ప్రతి అప్పునూ మాఫీ చేస్తాము
  rationale: ఈ క్లిష్ట సంక్షిప్త ప్రయోగం ద్వితీయోపదేశకాండము 15లోని ఏడవ సంవత్సరపు అప్పుల విడుదలను సూచించే అవకాశముంది; ప్రధాన పాఠంలో సంభావ్య న్యాయ-ఆర్థిక భావాన్ని ఇస్తూ ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచింది.
theological_decisions:
- issue: ఏడవ సంవత్సరపు బాధ్యతలో వ్యవసాయ విశ్రాంతి మరియు ఆర్థిక విడుదల
  choice: ఏడవ సంవత్సరంలో భూమిని సాగుచేయకుండా విడిచిపెట్టి, ప్రతి అప్పును మాఫీ చేయడం
  alternative: ‘ఏడవ సంవత్సరాన్ని, ప్రతి చేతి వసూలు భారాన్ని విడిచిపెడతాము’ లేదా ‘ప్రతి హక్కుదావాను వదులుకుంటాము’
  rationale: వాక్యం ఏడవ సంవత్సరానికి సంబంధించిన వ్యవసాయ విశ్రాంతి మరియు అప్పులు లేదా హక్కుదావాల విడుదల అనే రెండు నిబంధనలను సూచిస్తున్నట్లు కనిపిస్తుంది. అయితే చివరి హీబ్రూ నుడికారం అస్పష్టమైనందున దాని ప్రత్యామ్నాయ అర్థాలను పాదసూచికలో నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన శైలి. ‘విశ్రాంతి దినం’ మరియు ‘పవిత్ర దినం’ వంటి పారదర్శక పదాలను వాడింది. హీబ్రూ వాక్యంలోని సంక్షిప్తత వల్ల అస్పష్టమయ్యే ఏడవ సంవత్సరపు వ్యవసాయ భావాన్ని పరిమితంగా స్పష్టం చేసింది; చివరి నుడికారంలోని నిజమైన సందిగ్ధతను పాదసూచికలో సంరక్షించింది.
