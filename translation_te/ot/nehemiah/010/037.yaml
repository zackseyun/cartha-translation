id: NEH.10.37
reference: Nehemiah 10:37
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אֶת בְּכֹר֤וֹת בָּנֵ֨י/נוּ֙ וּ/בְהֶמְתֵּ֔י/נוּ כַּ/כָּת֖וּב בַּ/תּוֹרָ֑ה וְ/אֶת בְּכוֹרֵ֨י בְקָרֵ֜י/נוּ וְ/צֹאנֵ֗י/נוּ לְ/הָבִיא֙ לְ/בֵ֣ית אֱלֹהֵ֔י/נוּ לַ/כֹּ֣הֲנִ֔ים הַ/מְשָׁרְתִ֖ים בְּ/בֵ֥ית אֱלֹהֵֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/037.yaml
  text: and the firstborn of our sons and of our livestock[a], as it is written in the Law, and the firstborn of our herds and of our flocks, to bring to the house of our God[b], to the priests who minister in the house of our God.
translation:
  language: te
  text: మా కుమారులలో తొలిపుట్టినవారినీ, మా పశువులలో తొలిపుట్టినవాటినీ—ధర్మశాస్త్రంలో వ్రాయబడి ఉన్న ప్రకారం—అలాగే మా పశువుల మందలలోనూ మా గొఱ్ఱెలు మేకలలోనూ తొలిపుట్టినవాటినీ, మా దేవుని మందిరానికి, మా దేవుని మందిరంలో సేవచేసే యాజకుల దగ్గరకు తీసుకురావడానికి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּכֹרוֹת בָּנֵינוּ
  choice: మా కుమారులలో తొలిపుట్టినవారిని
  rationale: ‘తొలిపుట్టినవారు’ అనే అర్థాన్ని నిలుపుతూ, కుమారులలోని మొదటివారనే సంబంధాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: וּבְהֶמְתֵּינוּ
  choice: మా పశువులలో తొలిపుట్టినవాటిని
  rationale: בְּהֵמָה ఇక్కడ పెంపుడు పశువులను సమష్టిగా సూచిస్తుంది; తరువాతి పదాలు వాటిని మరింత నిర్దిష్టంగా విభజిస్తాయి.
- source_word: כַּכָּתוּב בַּתּוֹרָה
  choice: ధర్మశాస్త్రంలో రాసి ఉన్న ప్రకారం
  rationale: ఇది లిఖిత తోరా ఆజ్ఞలను సూచించే సూత్రప్రయోగం; ‘ధర్మశాస్త్రం’ సాధారణ చట్టాన్ని కాక నిర్దిష్టమైన తోరాను సూచిస్తుంది.
- source_word: בְּכוֹרֵי בְקָרֵינוּ וְצֹאנֵינוּ
  choice: మా మందలలోనూ మా గొఱ్ఱెమేకలలోనూ తొలిపుట్టినవాటిని
  rationale: בָּקָר పెద్ద పశువుల మందలను, צֹאן గొఱ్ఱెలు-మేకల వంటి చిన్న పశువులను సూచిస్తాయి; ఈ తేడాను తెలుగు పాఠ్యంలో నిలుపుతుంది.
- source_word: לְהָבִיא
  choice: తీసుకువచ్చి
  rationale: సందర్భంలోని నిబంధనాత్మక ప్రతిజ్ఞతో సహజంగా కలుస్తూ, తీసుకురావాలనే ఉద్దేశాన్ని తెలుపుతుంది.
- source_word: לְבֵית אֱלֹהֵינוּ
  choice: మా దేవుని మందిరానికి
  rationale: హీబ్రూలో అక్షరార్థం ‘మా దేవుని ఇంటికి’; సందర్భంలో అది దేవాలయాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘మందిరం’ సహజంగా, గౌరవప్రదంగా ఉంది.
- source_word: לַכֹּהֲנִים הַמְשָׁרְתִים
  choice: అక్కడ సేవచేసే యాజకులకు
  rationale: వర్తమాన కృదంతం యాజకుల నిరంతర సేవను సూచిస్తుంది; ‘సేవచేసే’ దానిని స్పష్టంగా తెలియజేస్తుంది.
- source_word: בְּבֵית אֱלֹהֵינוּ
  choice: అక్కడ
  rationale: తెలుగులో భారమైన పునరుక్తిని తగ్గించినప్పటికీ, ‘అక్కడ’ అనేది ముందే చెప్పిన మా దేవుని మందిరాన్నే స్పష్టంగా సూచిస్తుంది.
theological_decisions:
- issue: בֵּית אֱלֹהֵינוּ ను అక్షరార్థంగా ‘మా దేవుని ఇల్లు’ అనాలా, సందర్భానుసారంగా ‘మా దేవుని మందిరం’ అనాలా
  choice: మా దేవుని మందిరం
  alternative: మా దేవుని ఇల్లు
  rationale: హీబ్రూ రూపం ‘ఇల్లు’ అయినప్పటికీ ఇక్కడ సూచిత స్థలం దేవాలయం. ‘మందిరం’ ఆధునిక తెలుగులో సహజంగా ఉండి, కొత్త సిద్ధాంతార్థాన్ని చేర్చదు.
- issue: కుమారులు మరియు పశువుల తొలిపుట్టినవారి విషయంలో విమోచన లేదా బలి విధానాన్ని ప్రధాన పాఠ్యంలో స్పష్టంగా చేర్చాలా
  choice: ‘తొలిపుట్టినవారు/తొలిపుట్టినవి’ అనే విస్తృత పదప్రయోగాన్నే నిలుపడం
  alternative: విమోచించవలసిన తొలిపుట్టినవారు / బలిగా అర్పించవలసిన తొలిపుట్టినవి
  rationale: ఈ వచనం ధర్మశాస్త్రపు ఆజ్ఞలను సూచిస్తుంది గాని, మనుష్యుల విమోచనకూ జంతువుల అర్పణకూ మధ్యనున్న చట్టపరమైన తేడాను స్వయంగా వివరించదు; అందువల్ల ఆ ఉద్వేగాన్ని పాఠ్యం మించిన వివరణతో పరిష్కరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన నిబంధనాత్మక శైలి. మూలంలోని జాబితాను సహజమైన తెలుగు వాక్యక్రమంలో అమర్చింది. ‘గొఱ్ఱెమేకలు’ అనే సమష్టి పదం צֹאן లోని గొఱ్ఱెలు/మేకలు రెండింటినీ నిలుపుతుంది.
