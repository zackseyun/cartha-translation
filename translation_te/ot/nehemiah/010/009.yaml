translation:
  language: te
  text: మయజ్యా, బిల్గయి, షెమయా—వీరే యాజకులు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַֽעַזְיָה
  choice: మయజ్యా
  rationale: హీబ్రూ వ్యక్తిపేరును దాని అర్థాన్ని అనువదించకుండా, ఆధునిక తెలుగు పాఠకులకు సహజంగా పలికే విధంగా లిప్యంతరీకరించాం.
- source_word: בִלְגַּי
  choice: బిల్గయి
  rationale: వ్యక్తిపేరు కావడంతో అనువదించకుండా, హీబ్రూ ఉచ్చారణకు దగ్గరగా తెలుగులో లిప్యంతరీకరించాం.
- source_word: שְׁמַֽעְיָה
  choice: షెమయా
  rationale: హీబ్రూ వ్యక్తిపేరును సాధారణ తెలుగు ధ్వనిరూపంలో లిప్యంతరీకరించాం; పేరులోని భావాన్ని విడిగా అనువదించలేదు.
- source_word: אֵ֖לֶּה
  choice: వీరు
  rationale: మనుషులను సూచిస్తున్న బహువచన నిర్దేశక సర్వనామానికి సహజమైన తెలుగు రూపం ‘వీరు’; ‘ఈ మనుషులు’ అని చేర్చడం మూలంలో లేని పదాన్ని అధికంగా వ్యక్తం చేస్తుంది.
- source_word: הַכֹּהֲנִֽים
  choice: యాజకులు
  rationale: ఈ పదం యాజకవర్గానికి చెందినవారిని సూచిస్తుంది. హీబ్రూలో నిర్దిష్ట ఉపపదం ఉన్నప్పటికీ, ‘వీరు యాజకులు’ అనే తెలుగు గుర్తింపు వాక్యంలో నిర్దిష్టత సందర్భం ద్వారానే సహజంగా వ్యక్తమవుతుంది.
theological_decisions: []
translation_notes:
  register: పేర్ల జాబితా స్వరూపాన్ని నిలుపుతూ, హీబ్రూ క్రియారహిత గుర్తింపు వాక్యాన్ని సహజమైన ఆధునిక ప్రామాణిక తెలుగులో ‘వీరు యాజకులు’గా ఇచ్చాం. భాష సంక్షిప్తంగా, గౌరవప్రదంగా, సాధారణ పాఠకులకు అర్థమయ్యేలా ఉంది.
