id: NEH.10.33
reference: Nehemiah 10:33
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הֶעֱמַ֤דְנוּ עָלֵ֨י/נוּ֙ מִצְוֺ֔ת לָ/תֵ֥ת עָלֵ֛י/נוּ שְׁלִשִׁ֥ית הַ/שֶּׁ֖קֶל בַּ/שָּׁנָ֑ה לַ/עֲבֹדַ֖ת בֵּ֥ית אֱלֹהֵֽי/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/033.yaml
  text: We also laid on ourselves the obligation to give yearly a third of a shekel for the service of the house of our God[a].
translation:
  language: te
  text: అంతేకాక, మన దేవుని మందిర సేవ కోసం ప్రతి సంవత్సరం షెకెలులో మూడవ వంతు ఇవ్వాలనే బాధ్యతను మేము మా మీద పెట్టుకున్నాము.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ప్రతి సంవత్సరం షెకెలులో మూడవ వంతు ఇవ్వాలనే నియమాలను మేము మా మీద విధించుకున్నాము.”
    reason: מִצְוֺת ను సమష్టి ఏకవచన భావంలో ‘బాధ్యత’గా లేదా రూపానికి దగ్గరగా బహువచనంలో ‘నియమాలు’గా అర్థం చేసుకోవచ్చు.
lexical_decisions:
- source_word: וְהֶעֱמַדְנוּ
  choice: అంతేకాక ... పెట్టుకున్నాము
  rationale: עמד హిఫీల్ రూపం ఇక్కడ ఒక బాధ్యతను తమపై తామే విధించుకోవడాన్ని సూచిస్తుంది; సందర్భంలోని וְ ను ‘అంతేకాక’గా వ్యక్తం చేశాము.
- source_word: עָלֵינוּ ... עָלֵינוּ
  choice: మా మీద
  rationale: על + ప్రథమ పురుష బహువచన ప్రత్యయం సమాజం స్వయంగా స్వీకరించిన బాధ్యతను తెలియజేస్తుంది. హెబ్రీలో రెండుసార్లు ఉన్నా, తెలుగులో అసహజమైన పునరుక్తిని నివారిస్తూ భావాన్ని ఒక్కసారి స్పష్టంగా ఉంచాము.
- source_word: מִצְוֺת
  choice: బాధ్యతను
  rationale: రూపపరంగా బహువచనంగా కనిపించినా, ఇక్కడ తరువాతి క్రియారూపం వివరించే నిర్దిష్టమైన బంధక నియమాన్ని సమష్టిగా సూచిస్తుంది. సహజ తెలుగులో ‘బాధ్యత’ సందర్భార్థాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: לָתֵת
  choice: ఇవ్వాలనే
  rationale: נתן క్రియ యొక్క సాధారణ అర్థమైన ‘ఇవ్వడం’ను నిలిపి, చెల్లింపు అని అదనంగా వ్యాఖ్యానించలేదు.
- source_word: שְׁלִשִׁית הַשֶּׁקֶל
  choice: షెకెలులో మూడవ వంతు
  rationale: హెబ్రీలోని భిన్న పరిమాణాన్ని నేరుగా, ఆధునిక తెలుగులో సహజంగా తెలిపింది.
- source_word: בַּשָּׁנָה
  choice: ప్రతి సంవత్సరం
  rationale: ఈ పదబంధం సంవత్సరానికొకసారి పునరావృతమయ్యే కానుకను సూచిస్తుంది.
- source_word: לַעֲבֹדַת
  choice: సేవ కోసం
  rationale: దేవాలయ సందర్భంలో עֲבֹדָה ఆరాధనకు సంబంధించిన సేవను లేదా పనిని సూచిస్తుంది; ‘సేవ’ ఆ భావాన్ని సంక్షిప్తంగా అందిస్తుంది.
- source_word: בֵּית אֱלֹהֵינוּ
  choice: మన దేవుని మందిర
  rationale: అక్షరార్థంగా ‘మన దేవుని ఇల్లు.’ తెలుగులో ఈ సందర్భానికి ‘మందిరం’ స్పష్టంగా, సహజంగా ఉండి దేవాలయ భావాన్ని తెలియజేస్తుంది.
theological_decisions:
- issue: מִצְוֺת సూచించే బాధ్యత స్వభావం
  choice: సమాజం తనపై తానే పెట్టుకున్న బంధక బాధ్యత
  alternative: ఆజ్ఞలు / నియమాలు
  rationale: వాక్యం దేవుని మందిర సేవ కోసం వార్షిక కానుక ఇవ్వడానికి సమాజం తనను తాను కట్టుబరచుకున్నట్లు చెబుతుంది. దీనిని కేవలం ఆచారంగా సడలించకుండా, అలాగే ఇది నేరుగా దేవుడు ఇచ్చిన కొత్త ఆజ్ఞ అని అతిశయింపకుండా అనువదించాము.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన, సాధారణ పాఠకులకు స్పష్టమైన శైలి. ‘దేవుని మందిరం,’ ‘షెకెలు’ వంటి బైబిలు సందర్భ పదాలను ఉంచి, హెబ్రీ వాక్యనిర్మాణంలోని అసహజ పునరుక్తిని తెలుగులో నివారించాము.
