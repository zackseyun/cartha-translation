id: NEH.10.29
reference: Nehemiah 10:29
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/שְׁאָ֣ר הָ/עָ֡ם הַ/כֹּהֲנִ֣ים הַ֠/לְוִיִּם הַ/שּׁוֹעֲרִ֨ים הַ/מְשֹׁרְרִ֜ים הַ/נְּתִינִ֗ים וְֽ/כָל הַ/נִּבְדָּ֞ל מֵ/עַמֵּ֤י הָ/אֲרָצוֹת֙ אֶל תּוֹרַ֣ת הָ/אֱלֹהִ֔ים נְשֵׁי/הֶ֖ם בְּנֵי/הֶ֣ם וּ/בְנֹתֵי/הֶ֑ם כֹּ֖ל יוֹדֵ֥עַ מֵבִֽין־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/029.yaml
  text: and the rest of the people—the priests[a], the Levites, the gatekeepers, the singers, the temple servants, and all who had separated themselves from the peoples of the lands to the law of God—their wives, their sons, and their daughters[b], everyone who knew and understood—
translation:
  language: te
  text: మిగిలిన ప్రజలు—యాజకులు, లేవీయులు, ద్వారపాలకులు, గాయకులు, దేవాలయ సేవకులు[a], దేవుని ధర్మశాస్త్రానికి కట్టుబడటానికి దేశదేశాల ప్రజలనుంచి తమను తాము వేరుచేసుకున్న వారందరూ—వారి భార్యలు, కుమారులు, కుమార్తెలు, తెలిసి అర్థం చేసుకునే వారందరూ—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో “నెతీనీయులు”; ఇది దేవాలయంలో సేవచేసే ఒక వర్గానికి సంప్రదాయంగా వాడే పేరు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁאָר הָעָם
  choice: మిగిలిన ప్రజలు
  rationale: שְׁאָר యొక్క ‘మిగిలినవారు’ అనే భావాన్ని, నిబంధన సమాజాన్ని సూచించే עָםను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: הַכֹּהֲנִים הַלְוִיִּם הַשּׁוֹעֲרִים הַמְשֹׁרְרִים
  choice: యాజకులు, లేవీయులు, ద్వారపాలకులు, గాయకులు
  rationale: ఆలయ సంబంధిత ఆయా వర్గాలను స్పష్టంగా, సంప్రదాయబద్ధంగా గుర్తించే పదాలు.
- source_word: הַנְּתִינִים
  choice: దేవాలయ సేవకులు
  rationale: నెతీనీయులు అనే లిప్యంతరీకరణకన్నా ఈ వర్గపు సేవా పాత్రను సాధారణ పాఠకునికి స్పష్టంగా తెలియజేస్తుంది.
- source_word: וְכָל הַנִּבְדָּל מֵעַמֵּי הָאֲרָצוֹת
  choice: దేశదేశాల ప్రజలనుంచి తమను తాము వేరుచేసుకున్న వారందరూ
  rationale: ఏకవచన పుంలింగ రూపానికి ఉన్న సమూహార్థాన్ని సహజమైన తెలుగు బహువచనంతో వ్యక్తం చేస్తూ, స్వచ్ఛందంగా వేరుపడిన భావాన్ని నిలుపుతుంది.
- source_word: אֶל תּוֹרַת הָאֱלֹהִים
  choice: దేవుని ధర్మశాస్త్రాన్ని అనుసరించడానికి
  rationale: אֶל యొక్క దిశాత్మక భావాన్ని తెలుగులో అసహజమైన పదానువాదం లేకుండా, దేవుని తోరాతో కలిసిన/దానికి కట్టుబడిన ఉద్దేశంగా తెలియజేస్తుంది.
- source_word: נְשֵׁיהֶם בְּנֵיהֶם וּבְנוֹתֵיהֶם
  choice: వారి భార్యలు, కుమారులు, కుమార్తెలు
  rationale: మూలంలోని మూడు ప్రత్యేక కుటుంబ వర్గాలను ‘కుటుంబాలు’ అని కుదించకుండా యథాతథంగా ఉంచుతుంది.
- source_word: כֹּל יוֹדֵעַ מֵבִין
  choice: జ్ఞానం, అవగాహన ఉన్న వారందరూ
  rationale: తెలుసుకొని అర్థం చేసుకోగల వివేచన కలిగినవారనే జతపదాల భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: הַנִּבְדָּל / יוֹדֵעַ מֵבִין లోని వ్యాకరణ పుంలింగ ఏకవచనం మరియు సమూహార్థం
  choice: తెలుగులో ‘వారందరూ’ అనే సమూహ బహువచనాన్ని వాడి, భార్యలు, కుమారులు, కుమార్తెలను స్పష్టంగా పేర్కొనడం
  alternative: ‘తన్ను తాను వేరుచేసుకున్న ప్రతి పురుషుడు … తెలిసి అర్థం చేసుకున్న ప్రతి పురుషుడు’ అని రూపపరంగా ఏకవచనంలో అనువదించడం
  rationale: హీబ్రూ పుంలింగ ఏకవచనం ఇక్కడ כָלతో సమూహ బలాన్ని కలిగి ఉంది. తెలుగు సహజ వాడుకలో బహువచనం ఆ సమూహార్థాన్ని మెరుగ్గా అందిస్తుంది; సందర్భంలో స్త్రీలు, కుమారులు, కుమార్తెలు కూడా స్పష్టంగా చేర్చబడ్డారు.
- issue: אֶל תּוֹרַת הָאֱלֹהִים సంబంధం
  choice: ‘దేవుని ధర్మశాస్త్రాన్ని అనుసరించడానికి’ అని దిశ/కట్టుబాటు భావాన్ని వ్యక్తం చేయడం
  alternative: ‘దేవుని ధర్మశాస్త్రం వైపుకు’ లేదా ‘దేవుని ధర్మశాస్త్రం కొరకు’
  rationale: వేరుపడటమే అంతిమ ఉద్దేశమని కాక, దేవుని ధర్మశాస్త్రంతో తమను అనుసంధానించుకోవడమే దాని దిశ అని మూలంలోని ఉద్వేగాన్ని సహజంగా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కానీ సాధారణ పాఠకులకు సులభమైన శైలి. ఈ వాక్యం తరువాతి వచనంలో కొనసాగుతున్నందున చివర దీర్ఘ విరామ చిహ్నం ఉంచబడింది. ప్రధాన పాఠంలోని [a] గుర్తు పాదసూచికతో సరిపోతుంది.
