  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్త జాబితా-ప్రారంభ శైలిని ఉపయోగించాం. వ్యక్తినామాలను తెలుగులో స్థిరపడిన బైబిలు రూపాలకు దగ్గరగా ఉంచి, అర్థం పూర్తిగా నిర్ధారించలేని పరిపాలనా బిరుదును అనువదించకుండా లిప్యంతరీకరించాం.
