  text: And on the sealed document were Nehemiah the governor[a], son of Hacaliah[b], and Zedekiah.
translation:
  language: te
  text: 'ముద్రించిన పత్రంపై పేర్లు ఉన్నవారు[a]: హకల్యా కుమారుడైన ప్రాంతాధిపతి[b] నెహెమ్యా, సిద్కీయా.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూలంలో అక్షరార్థంగా ‘ముద్రించబడినవారిపై’ అని ఉంది; సందర్భంలో ఇది ముద్రించిన నిబంధన పత్రాన్ని, లేదా ఆ పత్రంపై పేర్లు నమోదైనవారిని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో ‘తిర్షాతా’; ఇది పర్షియా పరిపాలన కాలానికి చెందిన అధికార బిరుదు, సాధారణంగా ‘ప్రాంతాధిపతి’ అని అనువదిస్తారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל הַחֲתוּמִים
  choice: ముద్ర వేసినవారు
  rationale: הַחֲתוּמִים అనేది బహువచన కృదంత రూపం; సందర్భంలో నిబంధన పత్రంపై ముద్ర వేసినవారి జాబితాను పరిచయం చేస్తోంది. తెలుగులో సహజంగా ఉండేలా జాబితా శీర్షిక రూపంలో అనువదించబడింది; పత్రాన్ని సూచించే అవకాశాన్ని పాదసూచికలో ఉంచాం.
- source_word: נְחֶמְיָה
  choice: నెహెమ్యా
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగులో ప్రాచుర్యంలో ఉన్న లిప్యంతరీకరణ.
- source_word: הַתִּרְשָׁתָא
  choice: తిర్షాతా
  rationale: పర్షియా కాలానికి చెందిన పరిపాలనా బిరుదు. దాని ఖచ్చితమైన అధికార పరిధి స్పష్టంగా లేనందున మూలరూపాన్ని లిప్యంతరీకరించి, సాధారణ అర్థాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: בֶּן חֲכַלְיָה
  choice: హకల్యా కుమారుడు
  rationale: వంశసంబంధాన్ని తెలిపే בֶּן పదానికి సహజమైన తెలుగు సమానం; వ్యక్తినామం మూలధ్వనులకు అనుగుణంగా లిప్యంతరీకరించబడింది.
- source_word: וְצִדְקִיָּה
  choice: సిద్కీయా
  rationale: జాబితాలోని తదుపరి వ్యక్తినామం; హీబ్రూ ధ్వనులకు దగ్గరగా తెలుగులో లిప్యంతరీకరించబడింది.
