lexical_decisions:
- source_word: דָּנִיֵּאל
  choice: దానియేలు
  rationale: ఇది వ్యక్తి పేరు. దాని వ్యుత్పత్తి అర్థాన్ని అనువదించకుండా, తెలుగులో స్థిరపడిన బైబిలు నామరూపమైన ‘దానియేలు’గా లిప్యంతరీకరించాం.
- source_word: גִּנְּתוֹן
  choice: గిన్నెతోను
  rationale: ఇది వ్యక్తి పేరు. హీబ్రూ ఉచ్చారణలోని ద్విత్వ నకారాన్ని ప్రతిబింబిస్తూ, తెలుగులో సహజంగా చదవదగిన ‘గిన్నెతోను’ రూపాన్ని వాడాం.
- source_word: בָּרוּךְ
  choice: బారూకు
  rationale: ఈ పేర్ల జాబితాలో ఇది విశేషణం (‘ఆశీర్వదించబడినవాడు’) కాదు, వ్యక్తి పేరు. కాబట్టి అర్థానువాదం చేయకుండా ‘బారూకు’గా లిప్యంతరీకరించాం.
