id: NEH.10.10
reference: Nehemiah 10:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְֽ/הַ/לְוִיִּ֑ם וְ/יֵשׁ֨וּעַ֙ בֶּן אֲזַנְיָ֔ה בִּנּ֕וּי מִ/בְּנֵ֥י חֵנָדָ֖ד קַדְמִיאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/010.yaml
  text: 'and the Levites: Jeshua son of Azaniah[a], Binnui from the sons of Henadad[b], Kadmiel.'
translation:
  language: te
  text: 'లేవీయులు: అజన్యా కుమారుడైన యేషూవా, హేనాదాదు కుమారులలోనివాడైన బిన్నూయి[a], కద్మీయేలు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, “హేనాదాదు కుమారులలోనివారు: బిన్నూయి, కద్మీయేలు.” హీబ్రూ పదబంధం యొక్క పరిధి అనిశ్చితం.'
    reason: The phrase מִבְּנֵי חֵנָדָד most naturally modifies Binnui, but its relation to the following name Kadmiel is not entirely certain; the note preserves this ambiguity at the relevant phrase.
lexical_decisions:
- source_word: וְהַלְוִיִּם
  choice: 'లేవీయులు:'
  rationale: ముందటి జాబితాతో సంబంధాన్ని సందర్భం తెలియజేస్తుంది; తెలుగులో జాబితా శీర్షికగా సహజంగా ఉండేందుకు సంధానకారకమైన וְ ను ప్రత్యేకంగా అనువదించకుండా, క్రియలేని హెబ్రీ నిర్మాణాన్ని అలాగే ఉంచాం.
- source_word: וְיֵשׁוּעַ
  choice: యేషూవ
  rationale: హెబ్రీ వ్యక్తినామాన్ని దాని ధ్వనిరూపానికి దగ్గరగా లిప్యంతరీకరించాం; ముందున్న וְ జాబితా నిర్మాణంలో సహజంగా అంతర్భవిస్తుంది.
- source_word: בֶּן אֲזַנְיָה
  choice: అజన్యా కుమారుడు
  rationale: వంశసంబంధాన్ని తెలిపే సాధారణ హెబ్రీ నిర్మాణాన్ని సహజమైన తెలుగు పదక్రమంలో అందించాం.
- source_word: בִּנּוּי
  choice: బిన్నూయి
  rationale: హెబ్రీ వ్యక్తినామాన్ని తెలుగు ధ్వన్యనుసారంగా లిప్యంతరీకరించాం.
- source_word: מִבְּנֵי חֵנָדָד
  choice: హేనాదాదు కుమారులలో ఒకడైన
  rationale: מִן యొక్క 'నుండి/లోనివాడు' భావాన్ని, בְּנֵי యొక్క వంశ లేదా కులసంబంధ భావాన్ని తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది; ఇది బిన్నూయిని హేనాదాదు వంశానికి చెందినవాడిగా గుర్తిస్తుంది.
- source_word: קַדְמִיאֵל
  choice: కద్మీయేలు
  rationale: హెబ్రీ వ్యక్తినామాన్ని మూల ఉచ్చారణకు దగ్గరగా తెలుగు లిపిలో అందించాం.
