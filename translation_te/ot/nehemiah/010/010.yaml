translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైన జాబితా శైలిని వాడాం. మూలంలో సమాపక క్రియ లేనందున తెలుగులోనూ క్రియను చేర్చలేదు. వ్యక్తినామాలను ఇంగ్లీషు రూపాల ద్వారా కాక హెబ్రీ రూపాల ఆధారంగా లిప్యంతరీకరించాం.
