lexical_decisions:
- source_word: מַגְפִּיעָשׁ
  choice: మగ్పీయాషు
  rationale: హీబ్రూ వ్యక్తినామాన్ని దాని వ్యంజన, స్వర రూపాలకు దగ్గరగా తెలుగులో లిప్యంతరీకరించాం. తెలుగు బైబిలు నామాల సహజ శైలికి అనుగుణంగా చివర ‘ు’ చేర్చాం.
- source_word: מְשֻׁלָּם
  choice: మెషుల్లాము
  rationale: హీబ్రూ వ్యక్తినామాన్ని అనువదించకుండా నేరుగా లిప్యంతరీకరించాం; ద్విత్వ ల ధ్వనిని ‘ల్ల’తో సూచించాం.
- source_word: חֵזִיר
  choice: హేజీరు
  rationale: ఇది నిబంధనపై ముద్ర వేసినవారి జాబితాలోని వ్యక్తి లేదా వంశ నామం. హీబ్రూ ఉచ్చారణను అనుసరించి తెలుగులో లిప్యంతరీకరించాం.
