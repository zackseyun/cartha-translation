translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైన జాబితా శైలిని పాటించాం. మూలపాఠంలో ఉన్న మూడు పేర్లను మాత్రమే ఉంచి, సంధాన పదాలు చేర్చలేదు. ఆంగ్ల సంప్రదింపుపాఠంలోని రెండో పాదసూచిక హేజీరు పేరుకు సంబంధించినదిగా కనిపించినా దాని సూచిక మెషుల్లాము తరువాత ఉంది; తెలుగులో అనవసరమైన స్వల్ప లిప్యంతరీకరణ భేదాన్ని పాదసూచికగా ఇవ్వలేదు.
