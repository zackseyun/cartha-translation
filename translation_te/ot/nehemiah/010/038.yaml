source:
  edition: WLC
  text: וְ/אֶת רֵאשִׁ֣ית עֲרִיסֹתֵ֣י/נוּ וּ֠/תְרוּמֹתֵי/נוּ וּ/פְרִ֨י כָל עֵ֜ץ תִּיר֣וֹשׁ וְ/יִצְהָ֗ר נָבִ֤יא לַ/כֹּהֲנִים֙ אֶל לִשְׁכ֣וֹת בֵּית אֱלֹהֵ֔י/נוּ וּ/מַעְשַׂ֥ר אַדְמָתֵ֖/נוּ לַ/לְוִיִּ֑ם וְ/הֵם֙ הַ/לְוִיִּ֔ם הַֽ/מְעַשְּׂרִ֔ים בְּ/כֹ֖ל עָרֵ֥י עֲבֹדָתֵֽ/נוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/038.yaml
  text: And we will bring the first of our dough[a], our contributions, the fruit of every tree, the new wine, and the oil to the priests, to the chambers of the house of our God, and the tithe of our land to the Levites; for they, the Levites[c][b], are the ones who collect the tithes in all the cities where we labor.
translation:
  language: te
  text: మరియు మా పిండి ముద్దలలో మొదటి భాగాన్ని[a], మా ప్రత్యేక అర్పణలను, ప్రతి చెట్టు ఫలాలను, కొత్త ద్రాక్షారసాన్ని, నూనెను యాజకుల దగ్గరికి, మా దేవుని మందిరంలోని గదులకు[b] తీసుకొస్తాం. మా భూమి పంటలో దశమభాగాన్ని లేవీయులకు తీసుకొస్తాం; ఎందుకంటే మా పని చేసే పట్టణాలన్నిటిలో[c] దశమభాగాలను సేకరించేవారు వారే, అంటే లేవీయులు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘పిండి ముద్దలలో మొదటి భాగం’ అంటే కలిపిన పిండి ముద్దల నుంచి యాజకుల కోసం ప్రత్యేకంగా తీసిన భాగం.
    reason: lexical_clarification
  - marker: b
    text: లేదా, ‘నిల్వ గదులకు.’ హీబ్రూ పదం మందిర ప్రాంగణంలోని గదులను సూచిస్తుంది; వాటిలో కొన్ని నిల్వ కోసం ఉపయోగించబడేవి.
    reason: lexical_alternative
  - marker: c
    text: పదశః, ‘మా పని/సేవకు చెందిన పట్టణాలన్నిటిలో.’ ఈ సంక్షిప్త హీబ్రూ వ్యక్తీకరణ ప్రజల వ్యవసాయ పనితో సంబంధమున్న పట్టణాలను సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: רֵאשִׁית עֲרִיסֹתֵינוּ
  choice: మా పిండి ముద్దలో మొదటి భాగం
  rationale: רֵאשִׁית మొదటి భాగాన్ని, עֲרִיסָה కలిపిన పిండి ముద్దను సూచిస్తాయి. ఈ అనువాదం బలిగా ప్రత్యేకించిన నిర్దిష్ట భాగాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: תְּרוּמֹתֵינוּ
  choice: మా అర్పణలు
  rationale: תְּרוּמָה దేవుని కోసం ప్రత్యేకించిన కానుక లేదా విరాళాన్ని సూచిస్తుంది. ‘అర్పణలు’ ఆధునిక తెలుగు పాఠకులకు స్పష్టంగా ఉండి పవిత్ర వినియోగ భావాన్ని నిలుపుతుంది.
- source_word: פְּרִי כָל עֵץ
  choice: ప్రతి చెట్టు పండ్లు
  rationale: כָל యొక్క పంపిణీ భావాన్ని ‘ప్రతి’ నిలుపుతుంది; ఈ పదబంధం సహజమైన తెలుగులో చెట్ల ఫలసాయాన్ని సూచిస్తుంది.
- source_word: תִּירוֹשׁ
  choice: కొత్త ద్రాక్షారసం
  rationale: תִּירוֹשׁ సాధారణంగా తాజా ద్రాక్షోత్పత్తిని, కొత్త ద్రాక్షారసాన్ని సూచిస్తుంది. ‘ద్రాక్షారసం’ మూలపదార్థాన్ని స్పష్టం చేస్తుంది; మత్తు లేదా పులియబెట్టే స్థాయిని అనవసరంగా నిర్ణయించదు.
- source_word: יִצְהָר
  choice: నూనె
  rationale: వ్యవసాయ ఉత్పత్తుల జాబితాలో ఇది సాధారణంగా ఆలివ్ నూనెను సూచించినా, హీబ్రూ ఇక్కడ చెట్టు రకాన్ని పేర్కొనదు; అందువల్ల ‘నూనె’ మూలంలోని విస్తృతతను నిలుపుతుంది.
- source_word: נָבִיא
  choice: తీసుకొస్తాం
  rationale: בוא క్రియ యొక్క హిఫిల్ మొదటి పురుష బహువచన రూపం సమాజపు నిబంధనా వాగ్దానాన్ని వ్యక్తపరుస్తుంది. ‘తీసుకొస్తాం’ ఆధునిక తెలుగులో ఆ నిబద్ధతను సహజంగా తెలియజేస్తుంది.
- source_word: לִשְׁכוֹת
  choice: గదులు
  rationale: לִשְׁכּוֹת మందిర ప్రాంగణంలోని గదులను సూచిస్తుంది. అవి నిల్వకు ఉపయోగపడవచ్చు గాని, ‘గదులు’ వాటి పనిని మూలం చెప్పినదానికంటే సంకుచితం చేయదు.
- source_word: מַעְשַׂר אַדְמָתֵנוּ
  choice: మా భూమి పంటలో దశమభాగం
  rationale: పదశః ‘మా భూమి యొక్క దశమభాగం’; సందర్భంలో భూమి విస్తీర్ణంలో పదోవంతు కాక, దాని దిగుబడిలో ఇవ్వవలసిన పదోవంతు ఉద్దేశం. ‘పంటలో’ అనే పదం తెలుగులో ఆ భావాన్ని స్పష్టం చేస్తుంది.
- source_word: הַמְעַשְּׂרִים
  choice: దశమభాగాలను సేకరించేవారు
  rationale: עשר యొక్క ఈ పియేల్ కృదంత రూపం సందర్భంలో దశమభాగాలను స్వీకరించే లేదా వసూలు చేసే లేవీయుల పాత్రను సూచిస్తుంది. ‘సేకరించేవారు’ పరిపాలనా భావాన్ని సహజంగా అందిస్తుంది.
- source_word: בְּכֹל עָרֵי עֲבֹדָתֵנוּ
  choice: మేము పని చేసే పట్టణాలన్నిటిలో
  rationale: עֲבֹדָה పని, సేవ లేదా శ్రమ అని అర్థమవుతుంది. భూమి దిగుబడి, దశమభాగాల సందర్భంలో ‘పని చేసే’ అనేది సహజమైన పఠనం; అయితే హీబ్రూ సంక్షిప్తత వల్ల ప్రత్యామ్నాయ అర్థాన్ని పాదసూచికలో నిలిపాం.
theological_decisions:
- issue: దశమభాగాలను సేకరించే కర్త ఎవరు?
  choice: లేవీయులే దశమభాగాలను సేకరిస్తారు
  alternative: ప్రజలు లేవీయులకు దశమభాగాలను అందిస్తారు అనే సాధారణీకృత వాక్యం
  rationale: הֵם הַלְוִיִּם הַמְעַשְּׂרִים అనే బలమైన నిర్మాణం లేవీయులనే సేకరించే కర్తలుగా గుర్తిస్తుంది. ఈ పరిపాలనా పాత్రను సాధారణీకరించకుండా మూలంలోని ఉద్ఘాటనను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకులకు అర్థమయ్యే శైలిని వాడాం. నిబంధనా వాగ్దాన సందర్భానికి అనుగుణంగా ‘తీసుకొస్తాం’ అనే దృఢ భవిష్యత్ రూపాన్ని ఎంచుకున్నాం. ‘దశమభాగం’ వంటి పరిచిత బైబిలు పదాన్ని ఉంచి, ‘గదులు,’ ‘సేకరించేవారు’ వంటి ప్రస్తుత వాడుక పదాలతో వాక్యాన్ని సహజంగా తీర్చిదిద్దాం.
