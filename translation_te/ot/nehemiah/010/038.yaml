revisions:
- from: అలాగే మా పిండి ముద్దలో మొదటి భాగాన్ని[a], మా అర్పణలను, ప్రతి చెట్టు పండ్లను, కొత్త ద్రాక్షారసాన్ని, నూనెను యాజకుల దగ్గరికి—మా దేవుని మందిరంలోని గదులకు[b]—తీసుకొస్తాం. మా భూమి పంటలో దశమభాగాన్ని లేవీయులకు తీసుకొస్తాం; ఎందుకంటే మేము పని చేసే పట్టణాలన్నిటిలో[c] దశమభాగాలను సేకరించేవారు లేవీయులే.
  to: మరియు మా పిండి ముద్దలలో మొదటి భాగాన్ని[a], మా ప్రత్యేక అర్పణలను, ప్రతి చెట్టు ఫలాలను, కొత్త ద్రాక్షారసాన్ని, నూనెను యాజకుల దగ్గరికి, మా దేవుని మందిరంలోని గదులకు[b] తీసుకొస్తాం. మా భూమి పంటలో దశమభాగాన్ని లేవీయులకు తీసుకొస్తాం; ఎందుకంటే మా పని చేసే పట్టణాలన్నిటిలో[c] దశమభాగాలను సేకరించేవారు వారే, అంటే లేవీయులు.
  rationale: 'The revision makes two safe, source-based adjustments only: it reflects the plural “our dough batches” and clarifies that the pledged goods are brought both to the priests and to the temple chambers. The final clause preserves the Hebrew emphasis, “they—the Levites—are the ones collecting the tithes,” without resolving the compressed phrase concerning the cities beyond what the text supports.'
