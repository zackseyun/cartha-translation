source:
  edition: WLC
  text: מַחֲזִיקִ֣ים עַל אֲחֵי/הֶם֮ אַדִּירֵי/הֶם֒ וּ/בָאִ֞ים בְּ/אָלָ֣ה וּ/בִ/שְׁבוּעָ֗ה לָ/לֶ֨כֶת֙ בְּ/תוֹרַ֣ת הָ/אֱלֹהִ֔ים אֲשֶׁ֣ר נִתְּנָ֔ה בְּ/יַ֖ד מֹשֶׁ֣ה עֶֽבֶד הָֽ/אֱלֹהִ֑ים וְ/לִ/שְׁמ֣וֹר וְ/לַ/עֲשׂ֗וֹת אֶת כָּל מִצְוֺת֙ יְהוָ֣ה אֲדֹנֵ֔י/נוּ וּ/מִשְׁפָּטָ֖י/ו וְ/חֻקָּֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/030.yaml
  text: They join with their brothers[a], their nobles, and enter into a curse and an oath, to walk in the law of God, which was given by the hand of Moses the servant of God, and to keep and to do all the commandments of Yahweh our Lord[d][c][b], and his judgments and his statutes.
translation:
  language: te
  text: వారు తమ సహోదరులతో, తమ ప్రముఖులతో దృఢంగా ఏకమై[a], దేవుని సేవకుడైన మోషే ద్వారా ఇవ్వబడిన[c] దేవుని ధర్మశాస్త్రం ప్రకారం నడుచుకోవడానికి, మన ప్రభువైన యాహ్వే ఆజ్ఞలన్నిటినీ, ఆయన న్యాయవిధులను, శాసనాలను పాటించి ఆచరించడానికి, శాపంతో కూడిన ప్రమాణంలో ప్రవేశిస్తున్నారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తమ సహోదరులతో, తమ ప్రముఖులతో తమను తాము బంధించుకొని.” ఈ హీబ్రూ నుడికారం నిబంధన ఐక్యతలో ఇతరులతో దృఢంగా అనుబంధించుకోవడాన్ని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “శాపంతో కూడిన ప్రమాణం” అంటే, వారు విధేయులుగా ఉంటామని ప్రమాణం చేసి, దాన్ని ఉల్లంఘిస్తే నిబంధనలోని శాపాన్ని తమపైకి అంగీకరించడం.
    reason: cultural_note
  - marker: c
    text: అక్షరార్థంగా, “మోషే చేతి ద్వారా ఇవ్వబడిన.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מַחֲזִיקִים עַל
  choice: దృఢంగా కలసి
  rationale: ఈ నిబంధన సందర్భంలో ఈ హీబ్రూ నుడికారం సమాజపు ప్రముఖులతో దృఢంగా అనుబంధించుకోవడాన్ని సూచిస్తుంది; కేవలం సహాయం చేయడం లేదా పట్టుకోవడం కాదు.
- source_word: אֲחֵיהֶם
  choice: తమ సహోదరులతో
  rationale: మూలంలోని పుంలింగ బహువచన బంధుత్వ పదాన్ని నిలుపుతూ, ఆధునిక గౌరవప్రదమైన తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: אַדִּירֵיהֶם
  choice: తమ ప్రముఖులతో
  rationale: ఇక్కడ సమాజంలో హోదా, ప్రజాప్రాధాన్యం కలిగినవారిని సూచిస్తుంది; 'ప్రముఖులు' ఆధునిక తెలుగులో సహజం.
- source_word: בְּאָלָה וּבִשְׁבוּעָה
  choice: శాపానికీ ప్రమాణానికీ లోబడుతున్నారు
  rationale: ఉల్లంఘిస్తే శాపాన్ని అంగీకరిస్తూ ప్రమాణబద్ధమైన నిబంధనలో ప్రవేశించడమనే భావాన్ని తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: לָלֶכֶת בְּתוֹרַת הָאֱלֹהִים
  choice: దేవుని ధర్మశాస్త్రం ప్రకారం నడుచుకోవడం
  rationale: הלך ב అనే జీవన ప్రవర్తన రూపకాన్ని 'నడుచుకోవడం'తో నిలుపుతూ, תורהకు ఈ న్యాయ-నిబంధన సందర్భంలో 'ధర్మశాస్త్రం'ను వాడుతుంది.
- source_word: אֲשֶׁר נִתְּנָה בְּיַד מֹשֶׁה
  choice: మోషే ద్వారా ఇవ్వబడిన
  rationale: హీబ్రూ 'మోషే చేతి ద్వారా' అనే మధ్యవర్తిత్వ నుడికారాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: עֶבֶד הָאֱלֹהִים
  choice: దేవుని సేవకుడు
  rationale: ఇక్కడ עבד మోషేకు గౌరవ బిరుదు; అందువల్ల 'దాసుడు' కంటే 'సేవకుడు' సందర్భోచితం.
- source_word: וְלִשְׁמוֹר וְלַעֲשׂוֹת
  choice: పాటించి ఆచరించడం
  rationale: హీబ్రూలోని రెండు క్రియల—కాపాడి పాటించడం, కార్యరూపంలో చేయడం—భేదాన్ని రెండు తెలుగు క్రియలతో నిలుపుతుంది.
- source_word: מִצְוֺת ... מִשְׁפָּטָיו וְחֻקָּיו
  choice: ఆజ్ఞలు ... న్యాయవిధులు, శాసనాలు
  rationale: మూడు న్యాయపదాల భేదాన్ని సాధ్యమైనంతవరకు నిలుపుతూ సాధారణ ఆధునిక పాఠకులకు అర్థమయ్యే పదాలను ఎంచుకుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: చతురక్షర దైవనామాన్ని బిరుదుతో మార్చకుండా తెలుగులో విస్తృతంగా గుర్తించబడే ప్రత్యక్ష రూపంలో ఇస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యెహోవా
  alternative: ప్రభువు; యాహ్వే
  rationale: మూలంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దానిని కేవలం బిరుదుగా మార్చకుండా, తెలుగు పాఠకులకు స్థిరంగా పరిచితమైన రూపాన్ని ఉపయోగించింది.
- issue: אֲחֵיהֶם లోని పుంలింగ బంధుత్వ పదం
  choice: తమ సహోదరులు
  alternative: తమ బంధువులు; తోటి ఇశ్రాయేలీయులు
  rationale: మూలంలోని వ్యాకరణ రూపాన్ని తటస్థీకరించకుండా నిలుపుతుంది; విస్తృత సమాజం సూచితమవుతుందా అనే సందర్భార్థాన్ని బలవంతంగా నిర్ణయించదు.
- issue: మోషేకు עֶבֶד అనే బిరుదు
  choice: దేవుని సేవకుడు
  alternative: దేవుని దాసుడు
  rationale: బానిస స్థితిని ప్రధానంగా చెప్పడం కాక, మోషేకు గౌరవప్రదమైన దైవసేవ బిరుదుగా ఈ పదం పనిచేస్తోంది.
- issue: శాపం మరియు ప్రమాణం యొక్క నిబంధనాత్మక స్వభావం
  choice: శాపానికీ ప్రమాణానికీ లోబడుతున్నారు
  alternative: శాపంతో కూడిన ప్రమాణం చేస్తున్నారు
  rationale: మూలంలోని రెండు నామవాచకాలను నిలుపుతూ, విధేయత తప్పితే శాపాన్ని స్వీకరించే స్వీయబద్ధతను పాఠ్యంలో అతిగా వివరించకుండా సూచిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకులకు అర్థమయ్యే శైలి. హీబ్రూ నిబంధన భాషలోని 'నడుచుకోవడం', ఆజ్ఞలు–న్యాయవిధులు–శాసనాలు అనే వరుస, శాపం–ప్రమాణం అనే ఉద్వేగాన్ని నిలిపి, అసహజమైన పదప్రతిపద నిర్మాణాన్ని తగ్గించింది.
