  terminology: వ్యక్తిపేర్లు స్థిరంగా లిప్యంతరీకరించబడ్డాయి. ‘మల్లూఖు’ పాదసూచిక రూపం హీబ్రూ చివరి కాఫ్ ధ్వనిని మరింత సన్నిహితంగా సూచించే సముచిత లెక్సికల్ ప్రత్యామ్నాయం; ఇది ఇంగ్లీషు audit trail‌లోని Malluch ప్రత్యామ్నాయంతో కూడా సారూప్యంగా ఉంది.
