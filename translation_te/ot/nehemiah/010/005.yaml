  source_fidelity: హీబ్రూ మూలంలోని మూడు వ్యక్తిపేర్లు—חַטּוּשׁ, שְׁבַנְיָה, מַלּוּךְ—అదే క్రమంలో, అనువాదం చేయకుండా లిప్యంతరీకరించబడ్డాయి. ‘హట్టూషు,’ ‘షెబన్యా,’ ‘మల్లూకు’ రూపాలు తెలుగు లిపి మరియు సాధారణ బైబిలు-పేర్ల వినియోగానికి అనుకూలంగా ఉన్నాయి. మల్లూకు యొక్క చివరి హీబ్రూ కాఫ్‌కు సంబంధించిన ‘మల్లూఖు’ ప్రత్యామ్నాయం పాదసూచికలో తగిన విధంగా ఇవ్వబడింది.
