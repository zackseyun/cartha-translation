source:
  edition: WLC
  text: כִּ֣י אֶל הַ֠/לְּשָׁכוֹת יָבִ֨יאוּ בְנֵי יִשְׂרָאֵ֜ל וּ/בְנֵ֣י הַ/לֵּוִ֗י אֶת תְּרוּמַ֣ת הַ/דָּגָן֮ הַ/תִּיר֣וֹשׁ וְ/הַ/יִּצְהָר֒ וְ/שָׁם֙ כְּלֵ֣י הַ/מִּקְדָּ֔שׁ וְ/הַ/כֹּהֲנִים֙ הַ/מְשָׁ֣רְתִ֔ים וְ/הַ/שּׁוֹעֲרִ֖ים וְ/הַ/מְשֹׁרְרִ֑ים וְ/לֹ֥א נַעֲזֹ֖ב אֶת בֵּ֥ית אֱלֹהֵֽי/נוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/040.yaml
  text: For the sons of Israel and the sons of Levi will bring the contribution of the grain[a], the new wine, and the oil to the chambers, where the vessels of the sanctuary are, and the priests who minister, and the gatekeepers, and the singers[b]. And we will not neglect the house of our God.
translation:
  language: te
  text: ఎందుకంటే ఇశ్రాయేలు ప్రజలూ లేవీయులూ ధాన్యం, కొత్త ద్రాక్షారసం, నూనె నుండి వేరుచేసిన కానుకను ఆలయపు గదుల్లోకి తీసుకొస్తారు. అక్కడ పవిత్రస్థలపు ఉపకరణాలు, సేవచేసే యాజకులు, ద్వారపాలకులు, గాయకులు ఉంటారు. మన దేవుని మందిరాన్ని మనం నిర్లక్ష్యం చేయము.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మన దేవుని మందిరాన్ని మనం విడిచిపెట్టము.”
    reason: alternative_reading
lexical_decisions:
- source_word: לְּשָׁכוֹת
  choice: ఆలయపు గదుల్లోకి
  rationale: ఆలయ సముదాయంలోని పక్కగదులు లేదా నిల్వగదులను సూచిస్తుంది. సందర్భాన్ని స్పష్టం చేస్తూనే కేవలం నిల్వగదులని అతిగా నిర్దిష్టపరచకుండా ‘ఆలయపు గదులు’ అని ఇచ్చాం.
- source_word: בְנֵי יִשְׂרָאֵל וּבְנֵי הַלֵּוִי
  choice: ఇశ్రాయేలు ప్రజలూ లేవీయులూ
  rationale: హీబ్రూ అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులు, లేవి కుమారులు’ అన్నా, ఆధునిక తెలుగులో ఆయా సమూహాలను సహజంగా, సమగ్రంగా తెలిపే రూపం ఇది.
- source_word: תְּרוּמַת
  choice: ప్రతిష్ఠిత భాగం
  rationale: దేవుని సేవ కోసం వేరుచేసి సమర్పించే పంటభాగాన్ని సూచిస్తుంది. ‘కానుక’ కంటే దాని ప్రత్యేకంగా కేటాయించిన స్వభావాన్ని ఇది బాగా చూపిస్తుంది.
- source_word: הַתִּירוֹשׁ
  choice: కొత్త ద్రాక్షారసం
  rationale: కొత్తగా ఉత్పత్తి చేసిన ద్రాక్షారసం అనే వ్యవసాయ సందర్భంలోని భావాన్ని నిలుపుతుంది.
- source_word: כְּלֵי הַמִּקְדָּשׁ
  choice: పవిత్రస్థలపు సామగ్రి
  rationale: ఆలయసేవలో ఉపయోగించే పాత్రలు, పనిముట్లు మొదలైన వాటిని కలిపి సూచించే సహజమైన ఆధునిక తెలుగు పదబంధం.
- source_word: וְלֹא נַעֲזֹב
  choice: మనము నిర్లక్ష్యం చేయము
  rationale: ఇక్కడ మందిరాన్ని విడిచిపెట్టడం మాత్రమే కాక, దాని సేవా అవసరాలను పట్టించుకోకుండా ఉండకూడదనే ఒడంబడిక భావం ప్రధానంగా ఉంది.
theological_decisions:
- issue: ఒడంబడిక సమూహాల లింగసూచక పేర్లు
  choice: ఇశ్రాయేలు ప్రజలూ లేవీయులూ
  alternative: ఇశ్రాయేలు కుమారులూ లేవి కుమారులూ
  rationale: అక్షరార్థ రూపం హీబ్రూ సమాంతరతను చూపించినా, తెలుగులో అది పురుషులకు మాత్రమే పరిమితమైనట్టు వినిపించవచ్చు. సందర్భంలో సమాజ సమూహాలనే సూచిస్తున్నందున సహజ సమూహపేర్లను వాడాం.
- issue: దేవుని మందిరాన్ని విడిచిపెట్టడం లేదా నిర్లక్ష్యం చేయడం
  choice: మన దేవుని మందిరాన్ని మనం నిర్లక్ష్యం చేయము
  alternative: మన దేవుని మందిరాన్ని మనం విడిచిపెట్టము
  rationale: పరిసర సందర్భం ఆలయ సేవకు కావలసిన సరఫరా, మద్దతు గురించి ఉంది. అందువల్ల ‘నిర్లక్ష్యం చేయము’ ఆచరణాత్మక ఒడంబడిక బాధ్యతను స్పష్టంగా వ్యక్తం చేస్తుంది; ‘విడిచిపెట్టము’ కూడా సాధ్యమైన అక్షరార్థ ప్రత్యామ్నాయం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. పొడవైన హీబ్రూ సమన్వయ వాక్యాన్ని తెలుగులో స్పష్టత కోసం రెండు వాక్యాలుగా విభజించాం; జాబితా సభ్యులన్నీ గదుల్లో ఉండే భావాన్ని ‘అక్కడే ఉంటారు’ ద్వారా వెల్లడించాం.
