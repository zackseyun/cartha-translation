lexical_decisions:
- source_word: חָרִיף
  choice: హారీఫు
  rationale: ఒడంబడికపై ముద్ర వేసినవారి జాబితాలో ఇది వ్యక్తినామం; అందువల్ల అర్థానువాదం చేయకుండా హీబ్రూ ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించబడింది.
- source_word: עֲנָתוֹת
  choice: అనాతోతు
  rationale: ఇతర సందర్భాల్లో ఇది ఒక పట్టణం పేరు అయినప్పటికీ, ఇక్కడ ఒడంబడికపై ముద్ర వేసినవారి జాబితాలో నామం లేదా గుర్తింపుగా పనిచేస్తుంది; కాబట్టి లిప్యంతరీకరణను నిలిపాం.
- source_word: נובי
  choice: నోబై
  rationale: జాబితాలోని వ్యక్తినామంగా తీసుకొని లిప్యంతరీకరించాం; చివరి యోడ్‌ను పేరులోని ‘ఐ’ ధ్వనిగా ప్రతిబింబించాం.
