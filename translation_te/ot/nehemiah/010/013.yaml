- source_word: שְׁבַנְיָה
  choice: షెబన్యా
  rationale: ఇది వ్యక్తి పేరు; అనువదించకుండా హీబ్రూ ఉచ్చారణకు సమీపంగా ‘షెబన్యా’ అని లిప్యంతరీకరించబడింది.
