source:
  edition: WLC
  text: וַ/אֲשֶׁ֛ר לֹא נִתֵּ֥ן בְּנֹתֵ֖י/נוּ לְ/עַמֵּ֣י הָ/אָ֑רֶץ וְ/אֶת בְּנֹ֣תֵי/הֶ֔ם לֹ֥א נִקַּ֖ח לְ/בָנֵֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/031.yaml
  text: and that we will not give our daughters to the peoples of the land[b][a], nor take their daughters for our sons.
translation:
  language: te
  text: మరియు దేశంలోని ప్రజలకు[a] మా కుమార్తెలను ఇవ్వము; వారి కుమార్తెలను మా కుమారుల కోసం తీసుకోము[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ‘ప్రజలు’ అనే పదం బహువచనంలో ఉంది. దీనిని ‘దేశంలోని జనసమూహాలకు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో ‘తీసుకోము.’ ఈ సందర్భంలో అది వివాహం కోసం తీసుకోవడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲשֶׁר
  choice: అలాగే
  rationale: ముందున్న ప్రమాణ నిబంధనకు మరొక అంశాన్ని జోడించే అనుసంధాన భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: לֹא נִתֵּן בְּנֹתֵינוּ
  choice: మా కుమార్తెలను ఇవ్వము
  rationale: యిక్తోల్ రూపం ఈ ప్రమాణ సందర్భంలో సమాజం చేసుకున్న భవిష్యత్ నిబద్ధతను సూచిస్తుంది; కుమార్తెలను వివాహానికి ఇవ్వడమనే సందర్భార్థాన్ని విస్తరించకుండా మూలంలోని ‘ఇవ్వు’ను నిలుపుతుంది.
- source_word: לְעַמֵּי הָאָרֶץ
  choice: దేశంలోని జనసమూహాలకు
  rationale: עַמֵּי అనే బహువచనాన్ని నిలుపుతూ, הָאָרֶץ‌ను అతిగా నిర్దిష్టీకరించకుండా ‘దేశంలోని’ అని అనువదిస్తుంది.
- source_word: וְאֶת בְּנֹתֵיהֶם לֹא נִקַּח
  choice: వారి కుమార్తెలను … తీసుకోము
  rationale: లָקַח అనే క్రియ యొక్క ‘తీసుకొను’ రూపాన్ని, మొదటి భాగంలోని ‘ఇవ్వు’తో ఉన్న సమాంతరతను నిలుపుతుంది; ఇక్కడ వివాహార్థం సందర్భం వల్ల స్పష్టమవుతుంది.
- source_word: לְבָנֵינוּ
  choice: మా కుమారుల కోసం
  rationale: మూలంలోని లింగనిర్దిష్టమైన ‘మా కుమారులు’ అనే అర్థాన్ని యథాతథంగా ఉంచుతుంది.
theological_decisions:
- issue: వివాహ నిషేధాన్ని జాతి లేదా వర్ణ సిద్ధాంతంగా విస్తరించకుండా అనువదించడం
  choice: ‘దేశంలోని జనసమూహాలు’ అనే మూలానికి దగ్గరైన సామాజిక-నిబంధనా పదబంధాన్ని ఉంచడం
  alternative: ‘అన్యజనులు,’ ‘విగ్రహారాధకులు,’ లేదా ‘విదేశీయులు’ అని స్పష్టీకరించడం
  rationale: ఈ వచనం స్వయంగా అలాంటి విశేషణాలను ఉపయోగించదు. వాటిని చేర్చడం తక్షణ పదార్థాన్ని మించి వ్యాఖ్యానించడం అవుతుంది; అందువల్ల నిబంధన సందర్భంలోని ఉద్రిక్తతను మూలరూపంలోనే నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన శైలి. మూలంలోని బహువచనం, ‘ఇవ్వు/తీసుకొను’ సమాంతర నిర్మాణం, ప్రమాణపూర్వక నిబద్ధత నిలుపబడ్డాయి.
