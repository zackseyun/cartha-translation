source:
  edition: WLC
  text: וְ/הָיָ֨ה הַ/כֹּהֵ֧ן בֶּֽן אַהֲרֹ֛ן עִם הַ/לְוִיִּ֖ם בַּ/עְשֵׂ֣ר הַ/לְוִיִּ֑ם וְ/הַ/לְוִיִּ֞ם יַעֲל֨וּ אֶת מַעֲשַׂ֤ר הַֽ/מַּעֲשֵׂר֙ לְ/בֵ֣ית אֱלֹהֵ֔י/נוּ אֶל הַ/לְּשָׁכ֖וֹת לְ/בֵ֥ית הָ/אוֹצָֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/039.yaml
  text: And the priest[a], a son of Aaron, shall be with the Levites when the Levites collect the tithe, and the Levites shall bring up the tithe of the tithe to the house of our God[b], to the chambers of the storehouse.
translation:
  language: te
  text: లేవీయులు దశమభాగాన్ని వసూలు చేసేటప్పుడు, అహరోను సంతతికి చెందిన యాజకుడు వారితో ఉండాలి. లేవీయులు ఆ దశమభాగంలో దశమభాగాన్ని[a] మన దేవుని మందిరంలోని గిడ్డంగి గదులకు[b] తీసుకెళ్లాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘దశమభాగంలో పదోవంతు.’ లేవీయులు తాము పొందిన దశమభాగం నుంచి ఇచ్చే భాగాన్ని హీబ్రూ వాచకం అక్షరార్థంగా ‘దశమభాగంలో దశమభాగం’ అని పిలుస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘ధనాగారపు గదులకు.’ ఇక్కడ డబ్బు ఉంచే ధనాగారం మాత్రమే కాకుండా, దశమభాగాలు మరియు అర్పణలు నిల్వచేసే ప్రదేశం ఉద్దేశించబడి ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: ఉండాలి
  rationale: ఒడంబడిక సంబంధమైన నియమ సందర్భంలో ఇది భవిష్యత్తులో పాటించవలసిన విధిని సూచిస్తుంది; ఆధునిక తెలుగులో ‘ఉండాలి’ ఆ నియమ స్వరాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: הַכֹּהֵן בֶּן־אַהֲרֹן
  choice: అహరోను సంతతికి చెందిన యాజకుడు
  rationale: ఇది అహరోను వంశానికి చెందిన యాజకుణ్ణి సూచిస్తుంది. ‘అహరోను కుమారుడు’ అనే అక్షరార్థం కంటే ఈ రూపం ఆధునిక పాఠకునికి ఉద్దేశాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: בַּעְשֵׂר הַלְוִיִּם
  choice: లేవీయులు దశమభాగాన్ని వసూలు చేసేటప్పుడు
  rationale: ఇక్కడ క్రియారూపం దశమభాగాన్ని స్వీకరించే లేదా సేకరించే కార్యాన్ని సూచిస్తుంది; కాలార్థక ఉపవాక్యం తెలుగులో సహజంగా ఉంటుంది.
- source_word: יַעֲלוּ
  choice: తీసుకెళ్లాలి
  rationale: హిఫిల్ రూపానికి ‘పైకి తీసుకెళ్లు/తీసుకురా’ అనే భావం ఉన్నా, గమ్యస్థానమైన దేవాలయానికి సమర్పణను చేర్చడమే ప్రధాన భావం. తెలుగులో ‘తీసుకెళ్లాలి’ సహజంగా ఆ కదలికను తెలియజేస్తుంది.
- source_word: מַעֲשַׂר הַמַּעֲשֵׂר
  choice: దశమభాగంలో దశమభాగం
  rationale: లేవీయులు తాము పొందిన దశమభాగం నుంచి ఇచ్చే భాగాన్ని సూచించే హీబ్రూ సాంకేతిక పదబంధాన్ని స్పష్టంగా, దాని పునరుక్తిని కాపాడుతూ అనువదిస్తుంది.
- source_word: לְבֵית אֱלֹהֵינוּ
  choice: మన దేవుని మందిరంలోని
  rationale: అక్షరార్థంగా ‘మన దేవుని ఇంటికి’; ఈ సందర్భంలో అది దేవాలయాన్ని సూచిస్తుంది. గిడ్డంగి గదులు ఆ మందిరంలో ఉన్నాయని తెలుగులో సహజ సంబంధంతో వ్యక్తపరుస్తుంది.
- source_word: הַלְּשָׁכוֹת לְבֵית הָאוֹצָר
  choice: గిడ్డంగి గదులకు
  rationale: ధాన్యం మరియు ఇతర దశమభాగాలను నిల్వచేసే దేవాలయ గదులు ఉద్దేశించబడ్డాయి. ‘గిడ్డంగి గదులు’ అనేది కేవలం ధనాగారం అనే అపార్థాన్ని నివారిస్తుంది.
theological_decisions:
- issue: దేవాలయ నిల్వ ప్రదేశానికి వాడిన ఆచార సంబంధ పదజాలం
  choice: గిడ్డంగి గదులు
  alternative: ధనాగారపు గదులు
  rationale: సందర్భం వ్యవసాయ దిగుబడుల దశమభాగాల నిల్వకు సంబంధించినది; అందువల్ల డబ్బు మాత్రమే ఉద్దేశించబడిందనే భావం రాకుండా ‘గిడ్డంగి’ అని అనువదించబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన నియమ శైలి ఉపయోగించబడింది. ‘దశమభాగం,’ ‘లేవీయులు,’ ‘యాజకుడు’ వంటి స్థిరమైన బైబిలు పదజాలం నిలుపబడింది; క్లిష్టమైన దేవాలయ నిర్మాణ పదజాలాన్ని సహజంగా ‘గిడ్డంగి గదులు’గా ఇచ్చాం.
