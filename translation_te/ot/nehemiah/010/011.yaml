  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళి/సంతకదారుల జాబితాకు తగిన సంక్షిప్తమైన, గౌరవప్రదమైన శైలిని ఉపయోగించాం. పేర్లను అనువదించకుండా లిప్యంతరీకరించాం.
