translation:
  language: te
  text: 'మరియు వారి సోదరులు: షెబన్యా, హోదీయా, కెలీటా, పెలాయా, హానాను.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַ/אֲחֵי/הֶם
  choice: వారి సహోదరులు
  rationale: వ conjunctionను ముందున్న జాబితాతో సహజంగా అనుసంధానిస్తూ, אֲחֵי మరియు మూడవ పురుష బహువచన ప్రత్యయాన్ని ‘వారి సహోదరులు’గా అనువదించాం. ఇక్కడ పురుష సమూహ సహచరులను సూచించే మూలార్థాన్ని నిలిపాం.
- source_word: שְׁבַנְיָה
  choice: షెబన్యా
  rationale: వ్యక్తి పేరును హీబ్రూ ఉచ్చారణకు దగ్గరగా, తెలుగులో సహజంగా లిప్యంతరీకరించాం.
- source_word: הוֹדִיָּה
  choice: హోదీయా
  rationale: వ్యక్తి పేరును హీబ్రూ రూపంలోని దీర్ఘ స్వరాన్ని ప్రతిబింబించేలా లిప్యంతరీకరించాం.
- source_word: קְלִיטָא
  choice: కెలీటా
  rationale: వ్యక్తి పేరును మూల హీబ్రూ ధ్వనులకు దగ్గరగా తెలుగులో లిప్యంతరీకరించాం.
- source_word: פְּלָאיָה
  choice: పెలాయా
  rationale: వ్యక్తి పేరును హీబ్రూ ధ్వన్యాకృతిని అనుసరించి తెలుగులో చదవడానికి అనువుగా లిప్యంతరీకరించాం.
- source_word: חָנָן
  choice: హానాను
  rationale: వ్యక్తి పేరును మూలంలోని దీర్ఘ మొదటి స్వరం మరియు తుద హల్లును గుర్తించగల సాంప్రదాయ తెలుగు బైబిలు నామరూపంలో లిప్యంతరీకరించాం.
