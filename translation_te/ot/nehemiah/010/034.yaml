  text: לְ/לֶ֣חֶם הַֽ/מַּעֲרֶ֡כֶת וּ/מִנְחַ֣ת הַ/תָּמִ֣יד וּ/לְ/עוֹלַ֣ת הַ֠/תָּמִיד הַ/שַּׁבָּת֨וֹת הֶ/חֳדָשִׁ֜ים לַ/מּוֹעֲדִ֗ים וְ/לַ/קֳּדָשִׁים֙ וְ/לַ֣/חַטָּא֔וֹת לְ/כַפֵּ֖ר עַל יִשְׂרָאֵ֑ל וְ/כֹ֖ל מְלֶ֥אכֶת בֵּית אֱלֹהֵֽי/נוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/034.yaml
  text: for the bread of the arrangement[a], and for the regular grain offering, and for the regular burnt offering, for the Sabbaths, the new moons, the appointed times, and the holy things, and for the sin offerings to make atonement for Israel[e][d][c][b], and for all the work of the house of our God.
translation:
  language: te
  text: అమర్చివుంచిన రొట్టెల కోసం[a], క్రమంగా అర్పించే ధాన్యార్పణ కోసం[b], క్రమంగా అర్పించే దహనబలి కోసం, విశ్రాంతిదినాల కోసం, అమావాస్యల కోసం, నియమిత సమయాల కోసం[c], పరిశుద్ధమైన వాటి కోసం[d], ఇశ్రాయేలు కోసం ప్రాయశ్చిత్తం చేయడానికి అర్పించే పాపపరిహార బలుల కోసం[e], ఇంకా మన దేవుని మందిరపు పనులన్నిటి కోసం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘సన్నిధి రొట్టెలు’; అక్షరార్థంగా ‘అమర్చివుంచిన రొట్టెలు.’
    reason: lexical_alternative
  - marker: b
    text: ‘క్రమంగా’ అనే పదాన్ని ఇక్కడ ‘నిత్యం’ లేదా ‘నిరంతరం’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: ‘నియమిత సమయాలు’ అనే మాటలో నిర్ణయించబడిన పండుగ సందర్భాలు కూడా ఉన్నాయి.
    reason: lexical_alternative
  - marker: d
    text: లేదా ‘పరిశుద్ధ అర్పణల కోసం’ లేదా ‘ప్రతిష్ఠితమైన వాటి కోసం.’
    reason: lexical_alternative
  - marker: e
    text: ‘పాపపరిహార బలులు’ అనే పదాన్ని కొన్ని సందర్భాల్లో ‘శుద్ధీకరణ బలులు’ అని కూడా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶחֶם הַמַּעֲרֶכֶת
  choice: సన్నిధిలో అమర్చే రొట్టెలు
  rationale: ఈ పదబంధం అక్షరార్థంగా ‘అమరికకు చెందిన రొట్టె’ అని సూచిస్తుంది. ఆలయంలో దేవుని సన్నిధిలో క్రమంగా అమర్చే రొట్టెలనే సూచించేలా, తెలుగు పాఠకులకు సహజంగా అర్థమయ్యే రూపం ఎంచుకున్నాం; సంప్రదాయ నామాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: מִנְחַת הַתָּמִיד
  choice: క్రమంగా అర్పించే ధాన్యార్పణ
  rationale: ఆరాధనా సందర్భంలో מִנְחָה ధాన్యార్పణను, תָּמִיד నిరంతరంగా లేదా నియమిత క్రమంలో పునరావృతమయ్యేదాన్ని సూచిస్తాయి. ‘క్రమంగా అర్పించే’ అనేది దాని నియమిత స్వభావాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: עֹלַת הַתָּמִיד
  choice: క్రమంగా అర్పించే దహనబలి
  rationale: עֹלָה పూర్తిగా దహనం చేసే బలికి స్థిరమైన ఆరాధనా పదం. תָּמִיד సూచించే నియమిత పునరావృతాన్ని ‘క్రమంగా అర్పించే’ అని వ్యక్తం చేశాం.
- source_word: הַשַּׁבָּתוֹת הֶחֳדָשִׁים לַמּוֹעֲדִים
  choice: విశ్రాంతిదినాలు, అమావాస్యలు, నియమిత సమయాలు
  rationale: ఈ జాబితాను ముందున్న దహనబలితో మాత్రమే కఠినంగా అనుసంధానించకుండా, హీబ్రూ క్రమానికి అనుగుణంగా వేర్వేరు అవసరాలుగా ఉంచాం. מוֹעֲדִים పండుగలతో సహా దేవుడు నిర్ణయించిన సందర్భాలను విస్తృతంగా సూచిస్తుంది.
- source_word: וְלַקֳּדָשִׁים
  choice: పరిశుద్ధమైన వాటి కోసం
  rationale: קֳדָשִׁים అనే బహువచనం పరిశుద్ధ వస్తువులు, అర్పణలు లేదా ఆలయ సంబంధ విషయాలను విస్తృతంగా సూచించవచ్చు. దాన్ని ‘పరిశుద్ధ అర్పణలు’ అని సంకుచితం చేయకుండా మూలంలోని విస్తృతిని నిలిపాం.
- source_word: וְלַחַטָּאוֹת
  choice: పాపపరిహార బలుల కోసం
  rationale: బలి సందర్భంలో חַטָּאת పాపానికి సంబంధించిన బలి లేదా శుద్ధీకరణ బలిని సూచిస్తుంది. తెలుగులో గుర్తించదగిన ఆరాధనా పదంగా ‘పాపపరిహార బలి’ని ఎంచుకుని, ప్రత్యామ్నాయ భావాన్ని పాదసూచికలో ఉంచాం.
- source_word: לְכַפֵּר עַל יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కోసం ప్రాయశ్చిత్తం చేయడానికి
  rationale: బలి సందర్భంలోని כפר పదానికి ఉన్న ఆరాధనా, ధార్మిక బలాన్ని ‘ప్రాయశ్చిత్తం చేయడం’ నిలుపుతుంది; దాని విధానాన్ని లేదా సిద్ధాంతపరమైన అర్థాన్ని పాఠ్యంలో అదనంగా నిర్వచించదు.
- source_word: וְכֹל מְלֶאכֶת בֵּית אֱלֹהֵינוּ
  choice: మన దేవుని మందిరానికి సంబంధించిన పనులన్నిటి కోసం
  rationale: מְלָאכָה విస్తృతంగా పని లేదా కార్యాన్ని సూచిస్తుంది. ‘సేవ’ అని అనువదిస్తే ఆరాధనా పరిచర్యకే పరిమితం అయ్యే అవకాశం ఉన్నందున, ఆలయ సంబంధ బాధ్యతలన్నిటినీ కలుపుకునే ఈ రూపాన్ని ఎంచుకున్నాం.
theological_decisions:
- issue: బలి సంబంధ పదజాలాన్ని అతివ్యాఖ్యానం చేయకుండా అనువదించడం
  choice: ‘ధాన్యార్పణ,’ ‘దహనబలి,’ ‘పాపపరిహార బలి,’ ‘ప్రాయశ్చిత్తం చేయడం’ వంటి స్థిరమైన ఆరాధనా పదాలను నిలిపాం.
  alternative: ‘కానుక,’ ‘సంపూర్ణ అర్పణ,’ ‘శుద్ధీకరణ బలి’ వంటి మరింత వ్యాఖ్యానాత్మక పదాలను ప్రధాన పాఠ్యంలో వాడడం.
  rationale: ఈ వచనం ఆలయ అవసరాలు, బలుల బాధ్యతలను జాబితా చేస్తుంది. మూలంలోని ఆరాధనా వర్గాలను స్పష్టంగా ఉంచుతూ, తరువాతి సిద్ధాంతపరమైన వివరణలను పాఠ్యంలోకి దిగుమతి చేయకుండా ఉండటం సముచితం.
- issue: קֳדָשִׁים పదం యొక్క పరిధి
  choice: ‘పరిశుద్ధమైన వాటి’ అని విస్తృతంగా అనువదించాం.
  alternative: ‘పరిశుద్ధ అర్పణలు’ లేదా ‘ప్రతిష్ఠిత కానుకలు’ అని నిర్దిష్టీకరించడం.
  rationale: హీబ్రూ పదం ఇక్కడ ఏ ఒక్క రకమైన వస్తువు లేదా అర్పణకే స్పష్టంగా పరిమితం కాదు. అందువల్ల మూలంలోని నిజమైన అనిశ్చితిని నిలిపాం.
- issue: విశ్రాంతిదినాలు, అమావాస్యలు, నియమిత సమయాల వాక్యసంబంధం
  choice: ప్రతి అంశానికి ‘కోసం’ను ఉపయోగించి వాటిని జాబితాలో సమాంతర అంశాలుగా చూపాం.
  alternative: వాటిని ‘క్రమంగా అర్పించే దహనబలి’ని మాత్రమే విశేషించే కాలాలుగా అనుసంధానించడం.
  rationale: హీబ్రూ నిర్మాణం ఈ అంశాల సంబంధాన్ని పూర్తిగా ఏకార్థకంగా నిర్ధారించదు. సమాంతర జాబితా రూపం మూల క్రమాన్ని కాపాడి, అనవసరంగా సంబంధాన్ని సంకుచితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే వాక్యనిర్మాణం. ఆలయ, బలి సంబంధ స్థిర పదజాలాన్ని నిలిపి, అరుదైన లేదా పాతకాలపు పదాలను వీలైనంత తగ్గించాం. జాబితా స్వరూపాన్ని స్పష్టంచేయడానికి ప్రతి అంశంతో ‘కోసం’ను పునరావృతం చేశాం.
