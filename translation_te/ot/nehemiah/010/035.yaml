source:
  edition: WLC
  text: וְ/הַ/גּוֹרָל֨וֹת הִפַּ֜לְנוּ עַל קֻרְבַּ֣ן הָ/עֵצִ֗ים הַ/כֹּהֲנִ֣ים הַ/לְוִיִּם֮ וְ/הָ/עָם֒ לְ֠/הָבִיא לְ/בֵ֨ית אֱלֹהֵ֧י/נוּ לְ/בֵית אֲבֹתֵ֛י/נוּ לְ/עִתִּ֥ים מְזֻמָּנִ֖ים שָׁנָ֣ה בְ/שָׁנָ֑ה לְ/בַעֵ֗ר עַל מִזְבַּח֙ יְהוָ֣ה אֱלֹהֵ֔י/נוּ כַּ/כָּת֖וּב בַּ/תּוֹרָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/035.yaml
  text: We cast lots concerning the wood offering—the priests[a], the Levites, and the people—to bring it to the house of our God, according to our fathers’ houses, at appointed times year by year, to burn on the altar of Yahweh our God, as it is written in the Law.
translation:
  language: te
  text: 'కట్టెల అర్పణ విషయమై[a] మేము—యాజకులు, లేవీయులు, ప్రజలు—చీట్లు వేశాం: మా పితృవంశ కుటుంబాల ప్రకారం, నియమించిన సమయాల్లో ఏటేటా ఆ కట్టెలను మా దేవుని మందిరానికి తీసుకువచ్చి, ధర్మశాస్త్రంలో వ్రాయబడి ఉన్నట్లుగా మా దేవుడైన యహ్వే బలిపీఠంపై కాల్చడానికి.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కట్టెల అర్పణ కోసం.” ఇక్కడి హీబ్రూ విభక్తిని ‘విషయమై’ లేదా ‘కోసం’ అని అనువదించవచ్చు; కట్టెలను సమకూర్చే బాధ్యతను చీట్ల ద్వారా కేటాయించారన్నదే భావం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַגּוֹרָלוֹת הִפַּלְנוּ
  choice: మేము ... చీట్లు వేశాం
  rationale: హిఫిల్ రూపంలోని נפל మరియు גּוֹרָלוֹת కలిసినప్పుడు ‘చీట్లు వేయడం’ అనే స్థిర ప్రయోగం వస్తుంది; ఆధునిక తెలుగులో ఇదే సహజమైన వ్యక్తీకరణ.
- source_word: עַל קֻרְבַּן הָעֵצִים
  choice: కట్టెల అర్పణను గురించి
  rationale: עַל ఇక్కడ చీట్ల ద్వారా నిర్ణయించిన విషయాన్ని సూచిస్తుంది. קֻרְבַּן הָעֵצִים బలిపీఠపు ఉపయోగం కోసం సమర్పించే కట్టెలను సూచిస్తుంది.
- source_word: הַכֹּהֲנִים הַלְוִיִּם וְהָעָם
  choice: యాజకులు, లేవీయులు, ప్రజలు
  rationale: బాధ్యతను పంచుకున్న మూడు వర్గాలను మూలంలోని స్పష్టతతో విడివిడిగా నిలిపింది.
- source_word: לְהָבִיא לְבֵית אֱלֹהֵינוּ
  choice: ఆ కట్టెలను మా దేవుని మందిరానికి తీసుకువచ్చి
  rationale: లక్ష్యార్థక క్రియారూపాన్ని సహజమైన తెలుగు వాక్యనిర్మాణంలో ఇచ్చింది; ‘ఆ కట్టెలను’ అనేది ముందున్న కట్టెల అర్పణను స్పష్టంగా తిరిగి సూచిస్తుంది. בֵּית אֱלֹהֵינוּ సందర్భంలో దేవాలయాన్ని సూచిస్తున్నందున ‘మందిరం’ అని అనువదించింది.
- source_word: לְבֵית אֲבֹתֵינוּ
  choice: మా పూర్వికుల వంశాల ప్రకారం
  rationale: ‘తండ్రుల ఇళ్లు’ అనే పదశః రూపం కంటే, బాధ్యత కేటాయింపుకు ఆధారమైన పితృవంశ కుటుంబ విభాగాలను ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: לְעִתִּים מְזֻמָּנִים שָׁנָה בְשָׁנָה
  choice: ప్రతి సంవత్సరం నిర్ణయించిన సమయాల్లో
  rationale: నిర్దేశిత సందర్భాలు మరియు ఏటేటా పునరావృతం అనే రెండు భావాలనూ సహజంగా కలుపుతుంది.
- source_word: לְבַעֵר עַל מִזְבַּח
  choice: బలిపీఠం మీద మండించడానికి
  rationale: בער ఇక్కడ బలిపీఠంపై కట్టెలను కాల్చడాన్ని సూచిస్తుంది; నిరంతరం మండిస్తూ ఉంచడం అనే అదనపు భావాన్ని చేర్చలేదు.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: హీబ్రూ దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో నేరుగా లిప్యంతరీకరించింది.
- source_word: כַּכָּתוּב בַּתּוֹרָה
  choice: ధర్మశాస్త్రంలో రాసి ఉన్నట్లుగా
  rationale: తోరాలోని లిఖిత ఆదేశాన్ని ప్రస్తావించే సూత్రప్రాయమైన పదబంధాన్ని సహజ తెలుగులో నిలిపింది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం ప్రత్యక్షంగా ఉంది; దానిని బిరుదుగా మార్చకుండా లిప్యంతరీకరించడం మూలానికి సమీపంగా ఉంటుంది.
- issue: కట్టెలను మండించడం యొక్క విధి
  choice: బలిపీఠం మీద మండించడానికి
  alternative: బలిపీఠం మీద నిరంతరం మండిస్తూ ఉంచడానికి
  rationale: సందర్భం నిరంతర అగ్నితో సంబంధం కలిగి ఉండవచ్చు; అయినా ఈ వాక్యంలోని לְבַעֵר స్వయంగా ‘నిరంతరం’ అని స్పష్టంగా చెప్పదు. అందువల్ల అదనపు వ్యాఖ్యానాన్ని ప్రధాన పాఠంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలిని ఉపయోగించింది. మూలంలోని పరిపాలనా-ఆరాధనా భావాన్ని నిలుపుతూ, పొడవైన హీబ్రూ వాక్యాన్ని తెలుగులో స్పష్టత కోసం రెండు వాక్యాలుగా అమర్చింది.
