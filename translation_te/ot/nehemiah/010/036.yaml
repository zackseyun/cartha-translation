source:
  edition: WLC
  text: וּ/לְ/הָבִ֞יא אֶת בִּכּוּרֵ֣י אַדְמָתֵ֗/נוּ וּ/בִכּוּרֵ֛י כָּל פְּרִ֥י כָל עֵ֖ץ שָׁנָ֣ה בְ/שָׁנָ֑ה לְ/בֵ֖ית יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/036.yaml
  text: and to bring the firstfruits of our land and the firstfruits of all the fruit of every tree[a], year by year, to the house of Yahweh[b],
translation:
  language: te
  text: మా నేలలో పండిన ప్రథమ ఫలాలను, ప్రతి చెట్టు ఇచ్చే అన్ని ఫలాల ప్రథమ ఫలాలను ఏటేటా యాహ్వే మందిరానికి[b] తీసుకురావాలని,
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: అక్షరార్థంగా ‘యాహ్వే ఇంటికి’; అంటే మందిరానికి.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/הָבִיא
  choice: తీసుకురావాలని
  rationale: సంధి సందర్భంలో వరుసగా పేర్కొంటున్న నిబంధన బాధ్యతను కొనసాగిస్తుంది. ఆరాధనా అర్పణలను ఆలయానికి తీసుకురావడాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: בִּכּוּרֵי
  choice: ప్రథమ ఫలాలు
  rationale: దేవునికి అర్పించే మొదటి పంటను సూచించే ఆరాధనా భావాన్ని నిలుపుతుంది; సాధారణ ‘మొదటి పంట’ కంటే మూలపదపు ప్రత్యేక భావానికి దగ్గరగా ఉంటుంది.
- source_word: אַדְמָתֵנוּ
  choice: మా నేల
  rationale: వ్యవసాయ సందర్భంలో אדמה సూచించే నేల/భూమి భావాన్ని సహజంగా తెలియజేస్తుంది; ప్రాదేశిక రాజ్యభూమి అనే విస్తృత భావం అనవసరంగా ముందుకు రాకుండా చూస్తుంది.
- source_word: וּ/בִכּוּרֵי כָּל פְּרִי כָל עֵץ
  choice: ప్రతి చెట్టు ఫలాలన్నిటిలోని ప్రథమ ఫలాలు
  rationale: మూలంలోని సమగ్రతను—ప్రతి చెట్టు, దాని ఫలాలన్నీ—నిలుపుతూ, తెలుగులోని అసహజమైన వరుస షష్ఠీ విభక్తులను నివారిస్తుంది.
- source_word: שָׁנָה בְ/שָׁנָה
  choice: ఏటేటా
  rationale: ప్రతి సంవత్సరం క్రమంగా పునరావృతమయ్యే బాధ్యతను సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: לְ/בֵית יְהוָה
  choice: యాహ్వే మందిరానికి
  rationale: בֵּית యొక్క అక్షరార్థం ‘ఇల్లు’ అయినప్పటికీ, ఈ సందర్భంలో అది ఆలయాన్ని సూచిస్తుంది. ‘మందిరం’ సాధారణ పాఠకుడికి సహజంగా ఉండగా, యాహ్వే అనే నిబంధన నామాన్ని ప్రత్యక్షంగా నిలుపుతుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో నాలుగు అక్షరాల దైవనామం ప్రత్యక్షంగా ఉంది. ‘యాహ్వే’ దానిని బిరుదుగా మార్చకుండా వ్యక్తినామంగా నిలుపుతుంది; ‘యెహోవా’ కంటే మూల ఉచ్చారణకు దగ్గరగా ఉంది.
- issue: בֵּית יְהוָה యొక్క రూపకం
  choice: యాహ్వే మందిరం
  alternative: యాహ్వే ఇల్లు
  rationale: అక్షరార్థమైన ‘ఇల్లు’ను పాదటిప్పణిలో తెలియజేస్తూ, చారిత్రక ఆరాధనా స్థలాన్ని ప్రధాన పాఠంలో సహజంగా ‘మందిరం’ అని వ్యక్తపరుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ఇది ముందున్న నిబంధన బాధ్యతల జాబితాను కొనసాగించే వాక్యఖండం కాబట్టి చివర కామాను ఉంచాం. ‘ప్రథమ ఫలాలు’ అనే పదబంధం ఆరాధనా అర్పణ భావాన్ని నిలుపుతుంది.
