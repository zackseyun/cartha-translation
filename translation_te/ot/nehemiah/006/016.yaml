id: NEH.6.16
reference: Nehemiah 6:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְהִ֗י כַּ/אֲשֶׁ֤ר שָֽׁמְעוּ֙ כָּל א֣וֹיְבֵ֔י/נוּ וַ/יִּֽרְא֗וּ כָּל הַ/גּוֹיִם֙ אֲשֶׁ֣ר סְבִֽיבֹתֵ֔י/נוּ וַ/יִּפְּל֥וּ מְאֹ֖ד בְּ/עֵינֵי/הֶ֑ם וַ/יֵּ֣דְע֔וּ כִּ֚י מֵ/אֵ֣ת אֱלֹהֵ֔י/נוּ נֶעֶשְׂתָ֖ה הַ/מְּלָאכָ֥ה הַ/זֹּֽאת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/016.yaml
  text: And it happened that when all our enemies heard[a], and all the nations around us saw, they fell greatly in their own eyes, and they knew that this work had been done by our God.
translation:
  language: te
  text: అప్పుడు మా శత్రువులందరూ ఈ సంగతి విని, మా చుట్టుపక్కల ఉన్న జనాంగాలన్నీ దాన్ని చూసినప్పుడు, వారు తమ దృష్టిలో తాము ఎంతో దిగజారిపోయారు[a]. ఈ పని మా దేవుని ద్వారా జరిగిందని వారు గ్రహించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారు తమపై తమకున్న నమ్మకాన్ని ఎంతో కోల్పోయారు”; అక్షరార్థంగా, “వారు తమ కళ్లలో ఎంతో పడిపోయారు.”
    reason: హీబ్రూ నుడికారం వారి స్వీయ అంచనా లేదా ఆత్మవిశ్వాసం బాగా తగ్గిపోయిందనే భావాన్ని తెలియజేస్తుంది. అక్షరార్థ రూపకం పాదటిప్పణిలో ఇవ్వబడింది.
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: విన్నప్పుడు
  rationale: హీబ్రూ కథన సంధి వַיְהִיని తెలుగులో విడిగా అనువదిస్తే వాక్యం కృత్రిమంగా ఉంటుంది; కాలార్థక כַּאֲשֶׁרను సహజమైన ‘విన్నప్పుడు’ నిర్మాణంలో వ్యక్తం చేశాం.
- source_word: שָׁמְעוּ
  choice: ఈ సంగతి విన్నప్పుడు
  rationale: మూలంలో కర్మ సూచింపబడకపోయినా, సందర్భం గోడ నిర్మాణం పూర్తయిన సంగతిని సూచిస్తుంది. తెలుగులో సహజత కోసం అస్పష్టమైన సూచనగా ‘ఈ సంగతి’ వాడాం; వివరాన్ని అతిగా విస్తరించలేదు.
- source_word: כָּל אֹיְבֵינוּ
  choice: మా శత్రువులందరూ
  rationale: స్వామ్య ప్రత్యయాన్నీ, సమగ్రతను తెలిపే כָּלనూ నేరుగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וַיִּרְאוּ כָּל הַגּוֹיִם אֲשֶׁר סְבִיבֹתֵינוּ
  choice: మా చుట్టూ ఉన్న జనాలన్నీ దాన్ని చూసినప్పుడు
  rationale: גּוֹיִםను ఈ సందర్భంలో మతపరమైన ‘అన్యజనులు’గా కాక, చుట్టుపక్కల సమూహాలను సూచించే ‘జనాలు’గా అనువదించాం. ‘దాన్ని’ అనేది పూర్తయిన పనిని సందర్భానుసారంగా సూచిస్తుంది.
- source_word: וַיִּפְּלוּ מְאֹד בְּעֵינֵיהֶם
  choice: వారు తమ దృష్టిలో తాము ఎంతో దిగజారిపోయారు
  rationale: ‘తమ కళ్లలో ఎంతో పడిపోయారు’ అనే హీబ్రూ రూపకాన్ని తెలుగులో అర్థమయ్యేలా స్వల్పంగా మృదువుచేసి, స్వీయ అంచనాలో పడిపోవడం అనే బింబాన్ని నిలిపాం. భావార్థ ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
- source_word: וַיֵּדְעוּ
  choice: వారు గ్రహించారు
  rationale: ఇక్కడ కేవలం సమాచారం తెలుసుకోవడం కంటే జరిగిన పనిలో దేవుని ప్రమేయాన్ని గుర్తించడం భావం; ‘గ్రహించారు’ ఆధునిక తెలుగులో సహజంగా ఆ గుర్తింపును తెలియజేస్తుంది.
- source_word: מֵאֵת אֱלֹהֵינוּ
  choice: మా దేవుని వల్లనే
  rationale: מֵאֵת మూలం లేదా కర్తృత్వాన్ని సూచిస్తుంది. ‘వల్లనే’ పనికి దేవుడే నిర్ణాయక మూలమని తెలుగులో సహజంగా తెలియజేస్తూ, ‘ద్వారా’ కన్నా సందర్భానికి స్పష్టంగా సరిపోతుంది.
- source_word: נֶעֶשְׂתָה הַמְּלָאכָה הַזֹּאת
  choice: ఈ పని ... జరిగిందని
  rationale: నిఫాల్ రూపంలోని నిష్పన్న/కర్మణి భావాన్ని ‘జరిగింది’ సహజంగా అందిస్తుంది; הַמְּלָאכָהను విస్తృతమైన ‘పని’గా ఉంచాం.
theological_decisions:
- issue: పని పూర్తికావడంలో దేవుని కర్తృత్వం
  choice: ఈ పని మా దేవుని వల్లనే జరిగిందని
  alternative: ఈ పని మా దేవుని నుండి జరిగిందని / మా దేవుని ద్వారా జరిగిందని
  rationale: מֵאֵת దేవుణ్ణి ఈ కార్యానికి మూలం లేదా కర్తగా చూపుతుంది. ‘వల్లనే’ ఆయన నిర్ణాయక ప్రమేయాన్ని తెలియజేస్తుంది; అయితే అది కార్యం జరిగిన విధానాన్ని మూలంలో ఉన్నదానికంటే ఎక్కువగా నిర్వచించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘అన్యజనులు’ వంటి తరువాతి మతపరమైన ప్రత్యేకార్థాన్ని రానీయకుండా ‘జనాలు’ వాడాం. వాక్య నిర్మాణాన్ని తెలుగుకు అనుగుణంగా రెండు వాక్యాలుగా విభజించాం; హీబ్రూ రూపకంలోని ఉద్దేశపూర్వక అస్పష్టతను పాదటిప్పణితో కాపాడాం.
