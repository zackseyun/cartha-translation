id: NEH.6.9
reference: Nehemiah 6:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּ֣י כֻלָּ֗/ם מְיָֽרְאִ֤ים אוֹתָ֨/נוּ֙ לֵ/אמֹ֔ר יִרְפּ֧וּ יְדֵי/הֶ֛ם מִן הַ/מְּלָאכָ֖ה וְ/לֹ֣א תֵעָשֶׂ֑ה וְ/עַתָּ֖ה חַזֵּ֥ק אֶת יָדָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/009.yaml
  text: For all of them were trying to frighten us[a], saying, “Their hands will grow weak from the work, and it will not be done.” But now[b], strengthen my hands.
translation:
  language: te
  text: ఎందుకంటే వారందరూ, “పని చేయడంలో వారి చేతులు బలహీనపడతాయి[a]; అది పూర్తికాదు” అని మమ్మల్ని భయపెట్టడానికి ప్రయత్నించారు. అయితే ఇప్పుడు, నా చేతులను బలపరచు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ నుడికారంలో అక్షరార్థంగా చేతులు సడలిపోవడం లేదా దిగిపోవడం గురించి ఉంది; భావం: పని చేయడానికి బలం లేదా ధైర్యం కోల్పోవడం.'
    reason: lexical_alternative
  - marker: b
    text: 'చివరి వాక్యం దేవునికి చేసిన సంక్షిప్త ప్రార్థనగా అర్థమవుతుంది: “అయితే ఇప్పుడు, నా చేతులను బలపరచు.” కొందరు దీన్ని వేరుగా అర్థం చేసుకున్నప్పటికీ, హీబ్రూ స్వరీకరణ ప్రత్యక్ష విజ్ఞప్తికి మద్దతిస్తుంది.'
    reason: alternative_reading
lexical_decisions:
- source_word: מְיָרְאִים
  choice: భయపెట్టడానికి ప్రయత్నించారు
  rationale: హిఫీల్ రూపం భయం కలిగించడాన్ని సూచిస్తుంది; సందర్భంలో కొనసాగిన, ఉద్దేశపూర్వక బెదిరింపు ప్రయత్నాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: אוֹתָנוּ
  choice: మమ్మల్ని
  rationale: మసొరేటిక్ పాఠంలో ప్రథమ పురుష బహువచన కర్మ ఉంది; చివరి ప్రార్థన ఏకవచనంలో ఉన్నప్పటికీ ఇక్కడి బహువచనాన్ని యథాతథంగా ఉంచుతుంది.
- source_word: לֵאמֹר
  choice: అని అంటూ
  rationale: వారి మాట లేదా ఉద్దేశంలోని విషయాన్ని పరిచయం చేసే సాధారణ ఉల్లేఖన ప్రయోగాన్ని తెలుగులో సహజంగా అందిస్తుంది.
- source_word: יִרְפּוּ יְדֵיהֶם
  choice: వారి చేతులు సడలిపోతాయి
  rationale: బలం లేదా ధైర్యం తగ్గిపోవడాన్ని తెలిపే హీబ్రూ చేతుల రూపకాన్ని నిలుపుతుంది; చివరలోని ‘నా చేతులను బలపరచు’ అనే ప్రతిధ్వనిని కూడా కాపాడుతుంది.
- source_word: מִן הַמְּלָאכָה
  choice: ఆ పని చేయడానికి
  rationale: ఇక్కడ מְלָאכָה గోడ పునర్నిర్మాణ పనిని సూచిస్తుంది; ‘ఆ పని చేయడానికి’ అనేది చేతులు సడలడం అనే రూపకంతో తెలుగులో స్పష్టంగా అనుసంధానమవుతుంది.
- source_word: וְלֹא תֵעָשֶׂה
  choice: అది పూర్తికాదు
  rationale: నిఫాల్ రూపంలోని నిష్క్రియ భావాన్ని సహజంగా వ్యక్తం చేస్తూ, సూచించబడిన నిర్మాణ పని పూర్తికాకపోవడాన్ని తెలుపుతుంది.
- source_word: וְעַתָּה
  choice: అయితే ఇప్పుడు
  rationale: శత్రువుల ఉద్దేశాన్ని నివేదించడం నుంచి నెహెమ్యా ప్రార్థనకు వచ్చే వ్యత్యాసాన్ని స్పష్టంగా చూపుతుంది.
- source_word: חַזֵּק אֶת יָדָי
  choice: నా చేతులను బలపరచు
  rationale: దేవుడు పని చేయడానికి శక్తినివ్వాలనే భావంతో ఉన్న ఆజ్ఞార్థక ప్రార్థనను, మూలంలోని చేతుల రూపకాన్ని నిలుపుతూ అనువదిస్తుంది.
theological_decisions:
- issue: కథన నివేదిక నుంచి ప్రత్యక్ష ప్రార్థనకు మార్పు
  choice: చివరి మాటలను దేవునికి నెహెమ్యా చేసిన ప్రత్యక్ష ప్రార్థనగా ‘అయితే ఇప్పుడు, నా చేతులను బలపరచు’ అని అనువదించడం.
  alternative: భిన్న స్వరీకరణ లేదా పాఠరూపాన్ని అనుసరించి ‘ఇప్పుడు నేను నా చేతులను బలపరచుకున్నాను’ అనే స్వీయ ప్రోత్సాహంగా చదవడం.
  rationale: మసొరేటిక్ స్వరీకరణ రెండవ పురుష ఏకవచన ఆజ్ఞార్థక రూపాన్ని సూచిస్తుంది; ఇది దేవునికి చేసిన సంక్షిప్త ప్రార్థనగా సహజంగా అర్థమవుతుంది మరియు నెహెమ్యా గ్రంథంలోని చిన్న ప్రార్థనల పద్ధతికి సరిపోతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి ఉపయోగించబడింది. ‘చేతులు సడలిపోవడం/బలపరచడం’ అనే మూలభాషా రూపక జంటను నిలుపుతూ, మొదటి ప్రయోగం అర్థమయ్యేలా ‘ఆ పని చేయడానికి’ అని అమర్చబడింది.
