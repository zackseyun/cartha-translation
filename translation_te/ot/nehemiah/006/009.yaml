  verdict: revise
  source_fidelity: మూల హీబ్రూలోని బహువచన కర్మ ‘మమ్మల్ని,’ ప్రత్యర్థుల ఉద్దేశాన్ని తెలిపే ఉల్లేఖనం, చేతులు బలహీనపడే రూపకం, పని పూర్తికాకపోవడం, చివరలో ఏకవచనంలో ఉన్న ప్రార్థన—అన్నీ నిలిచాయి. అయితే ‘ఆ పని చేయడానికి’ అనేది מִן הַמְּלָאכָה యొక్క ‘పని నుండి/పని విషయంలో’ భావాన్ని కొంత మార్చి ప్రయోజనార్థకంగా చేస్తుంది; ‘పని చేయడంలో’ మరింత సన్నిహితంగా, సహజంగా ఉంటుంది.
  naturalness: ‘అని అంటూ’ పునరుక్తి; ఉల్లేఖనానికి ‘అని’ చాలు. ‘పని చేయడంలో వారి చేతులు బలహీనపడతాయి’ ఆధునిక ప్రామాణిక తెలుగులో సహజంగా ఉండి, మూలంలోని చేతుల రూపకాన్నీ కాపాడుతుంది.
  terminology: ‘భయపెట్టడానికి ప్రయత్నించారు,’ ‘మమ్మల్ని,’ ‘పూర్తికాదు,’ ‘నా చేతులను బలపరచు’ సరైన ఎంపికలు. ‘బలహీనపడతాయి/బలపరచు’ జత మూలంలోని ఉద్దేశిత వ్యత్యాసాన్ని స్పష్టంగా ప్రతిధ్వనింపజేస్తుంది.
  issues:
