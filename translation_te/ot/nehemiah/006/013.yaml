translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన కథన శైలి. ‘కూలికి నియమించబడిన’ అనే పదబంధం మూలంలోని సాధారణ వేతనార్థాన్ని నిలుపుతూ, అవినీతి ఉద్దేశాన్ని సందర్భం ద్వారా గ్రహించనిస్తుంది. మూలంలోని మూడుసార్ల ఉద్దేశ సూచనను తెలుగులో సహజంగా ‘ఉద్దేశం’, ‘చేయాలని’, ‘చేయడానికి’ ద్వారా ప్రతిబింబించాం.
