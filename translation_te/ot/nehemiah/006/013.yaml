  text: לְמַ֤עַן שָׂכוּר֙ ה֔וּא לְמַֽעַן אִירָ֥א וְ/אֶֽעֱשֶׂה כֵּ֖ן וְ/חָטָ֑אתִי וְ/הָיָ֤ה לָ/הֶם֙ לְ/שֵׁ֣ם רָ֔ע לְמַ֖עַן יְחָֽרְפֽוּ/נִי־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/013.yaml
  text: 'He was hired for this purpose: that I should become afraid and act that way and sin[a], so that they would have grounds for an evil report[b], in order that they might reproach me.'
translation:
  language: te
  text: 'అతడు ఇందుకోసమే కూలికి నియమించబడ్డాడు: నేను భయపడి అలా చేసి పాపం చేయాలని, అప్పుడు వారు నన్ను దూషించడానికి చెడ్డ అపవాదుకు ఆధారం పొందాలని.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְמַעַן שָׂכוּר הוּא
  choice: అతడు కూలికి నియమించబడిన ఉద్దేశం ఇదే
  rationale: שָׂכוּר అనే కర్మణి కృదంతం ప్రాథమికంగా ‘కూలికి తీసుకోబడినవాడు/నియమించబడినవాడు’ అని సూచిస్తుంది. మొదటి לְמַעַן కుట్ర ఉద్దేశాన్ని తెలియజేస్తుంది; הוּא ఇచ్చే వ్యక్తి-ఉద్ఘాటనను ‘అతడు’తో నిలిపాం.
- source_word: לְמַעַן אִירָא
  choice: నేను భయపడి
  rationale: లక్ష్యంగా ఉద్దేశించిన ఫలితాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: וְאֶעֱשֶׂה כֵּן וְחָטָאתִי
  choice: అలా చేసి పాపం చేయాలని
  rationale: ‘అలా చేయడం’ మరియు దాని ఫలితమైన పాపం రెండింటినీ ఉద్దేశ్య శ్రేణిలో ఉంచుతుంది; సందర్భంలోని చర్యను అనవసరంగా విశదీకరించదు.
- source_word: וְהָיָה לָהֶם לְשֵׁם רָע
  choice: వారు నాపై చెడ్డ పేరు మోపడానికి వారికి అవకాశం దొరుకుతుందని
  rationale: అక్షరార్థంగా ‘అది వారికి చెడ్డ పేరుగా ఉండేది.’ సందర్భంలో నెహెమ్యా చేసిన పాపాన్ని ఆధారంగా చేసుకొని అతనికి చెడ్డ పేరు కలిగించడం భావం. తెలుగు నుడికారంలో ‘చెడ్డ పేరు మోపడం’ ఈ కార్యార్థాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: יְחָרְפוּנִי
  choice: నన్ను నిందించడానికి
  rationale: חרף లోని నింద, అవమానం, దూషణ భావాలలో ప్రజల ఎదుట అపకీర్తి కలిగించే ఈ సందర్భానికి ‘నిందించు’ సహజంగా సరిపోతుంది.
