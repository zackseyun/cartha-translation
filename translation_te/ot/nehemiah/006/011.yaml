id: NEH.6.11
reference: Nehemiah 6:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וָ/אֹמְרָ֗/ה הַ/אִ֤ישׁ כָּמ֨וֹ/נִי֙ יִבְרָ֔ח וּ/מִ֥י כָמ֛וֹ/נִי אֲשֶׁר יָב֥וֹא אֶל הַ/הֵיכָ֖ל וָ/חָ֑י לֹ֖א אָבֽוֹא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/011.yaml
  text: But I said[a], “Should a man like me flee? And who is like me, who could go into the temple and live? I will not go in.”
translation:
  language: te
  text: అయితే నేను, “నాలాంటి మనిషి పారిపోవాలా? నాలాంటివాడు ఎవడు ఆలయంలోకి[a] ప్రవేశించి ప్రాణాలతో ఉండగలడు? నేను ఆలయంలోకి వెళ్లను” అన్నాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పరిశుద్ధస్థలంలోకి.’ ఇక్కడ ఉద్దేశం కేవలం ఒక భవనంలో దాక్కోవడం కాకపోవచ్చు. నెహెమ్యా ప్రవేశించడం తగని, ప్రవేశం పరిమితమైన ఆలయ ప్రాంతంలోకి వెళ్లడమే కావచ్చు; అందుకే ‘ప్రాణాలతో ఉండగలడు’ అనే మాటకు బలం ఉంది.
    reason: హֵיכָל అనే పదానికి ‘ఆలయం,’ ‘పరిశుద్ధస్థలం,’ లేదా ఆలయ ప్రధాన భవనం అనే భావాలు ఉండవచ్చు; సందర్భంలోని ఆరాధనా సంబంధిత అంతర్భావాన్ని అతిగా నిర్ణయించకుండా తెలియజేయడం.
lexical_decisions:
- source_word: וָאֹמְרָה
  choice: అయితే నేను … అన్నాను
  rationale: వావ్ కథనాన్ని ముందుకు నడిపినా, సందర్భంలో నెహెమ్యా ముందుంచిన ప్రతిపాదనను తిరస్కరిస్తున్నందున వ్యతిరేక భావాన్ని సహజంగా తెలియజేసే ‘అయితే’ వాడబడింది.
- source_word: הָאִישׁ כָּמוֹנִי
  choice: నాలాంటి వ్యక్తి
  rationale: ఇది ఒక నిర్దిష్ట వ్యక్తిని సూచించకుండా, నెహెమ్యా తన స్థానం, బాధ్యతలకు తగిన గౌరవభావంతో వేసిన అలంకారిక ప్రశ్న. ఆధునిక తెలుగులో సహజంగా ఉండేందుకు ‘వ్యక్తి’ ఎంచుకోబడింది.
- source_word: יִבְרָח
  choice: పారిపోవాలా
  rationale: భయంతో తప్పించుకుని పోవడం అనే మూలక్రియ భావాన్ని, అలాగే నెహెమ్యా తిరస్కారంలోని నైతిక బలాన్ని నిలుపుతుంది.
- source_word: וּמִי כָמוֹנִי
  choice: నాలాంటి వాడెవడు
  rationale: మొదటి ప్రశ్నతో ఉన్న అలంకారిక సమాంతరతను, స్వీయప్రస్తావనలోని ఉద్ఘాటనను కాపాడుతుంది.
- source_word: אֲשֶׁר יָבוֹא אֶל־הַהֵיכָל
  choice: ఆలయంలోకి ప్రవేశించి
  rationale: హీబ్రూ సంబంధవాక్యంలోని కొంత సంక్షిప్తమైన నిర్మాణాన్ని సహజ తెలుగులో అందిస్తూ, ఆలయ భవనం లేదా పరిశుద్ధ ప్రదేశంలోకి ప్రవేశించే భావాన్ని నిలుపుతుంది.
- source_word: וָחָי
  choice: బతికి ఉండగలడు
  rationale: ప్రవేశించిన తరువాత జీవించి ఉండడం సాధ్యమేనా అనే అలంకారిక, సంభావ్యతా భావాన్ని తెలుగులో స్పష్టంగా తెలియజేస్తుంది; కేవలం దాక్కోవడం అనే భావానికి పరిమితం చేయదు.
- source_word: לֹא אָבוֹא
  choice: నేను లోపలికి వెళ్లను
  rationale: ముందటి ప్రవేశ భావాన్ని పునరుక్తి చేస్తూ, నెహెమ్యా దృఢమైన నిరాకరణను సహజ తెలుగులో వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: నెహెమ్యా ఆలయంలోకి ప్రవేశించడంలోని అంతర్భావం
  choice: ప్రధాన పాఠ్యంలో ‘ఆలయం’ అని విస్తృతంగా ఉంచి, అతనికి నిషిద్ధమైన ఆలయ ప్రాంతంలోకి ప్రవేశించడం కావచ్చనే భావాన్ని పాదటిప్పణిలో సూచించడం
  alternative: ఎటువంటి ఆరాధనా నియమాల అంతర్భావం లేకుండా, అక్కడ దాక్కోవడానికి మాత్రమే నెహెమ్యా నిరాకరించాడని అనువదించడం
  rationale: నెహెమ్యా 6:10–13 సందర్భంలో ఈ ప్రతిపాదన అతనిచేత పాపం చేయించి అపకీర్తి కలిగించేందుకు ఉద్దేశించినదిగా కనిపిస్తుంది. అయినా వచనం నిషిద్ధ ప్రాంతాన్ని ప్రత్యక్షంగా పేర్కొనదు. కాబట్టి ప్రధాన అనువాదం ఉద్రిక్తతను పరిష్కరించకుండా ఉంచి, సాధ్యమైన ఆరాధనా సంబంధిత భావాన్ని పాదటిప్పణిలో వివరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరత కలిగిన శైలి వాడబడింది. రెండు అలంకారిక ప్రశ్నల సమాంతరతను నిలిపి, చివరి నిరాకరణను సంక్షిప్తంగా, దృఢంగా ఉంచాం. పాదటిప్పణి గుర్తును అది వివరిస్తున్న ‘ఆలయంలోకి’ అన్న పదం దగ్గర ఉంచాం.
