source:
  edition: WLC
  text: וְ/גַם נְבִיאִ֡ים הֶעֱמַ֣דְתָּ לִ/קְרֹא֩ עָלֶ֨י/ךָ בִֽ/ירוּשָׁלִַ֜ם לֵ/אמֹ֗ר מֶ֚לֶךְ בִּֽ/יהוּדָ֔ה וְ/עַתָּה֙ יִשָּׁמַ֣ע לַ/מֶּ֔לֶךְ כַּ/דְּבָרִ֣ים הָ/אֵ֑לֶּה וְ/עַתָּ֣ה לְכָ֔/ה וְ/נִֽוָּעֲצָ֖ה יַחְדָּֽו־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/007.yaml
  text: And you have even appointed prophets to proclaim concerning you in Jerusalem[a], saying, ‘There is a king in Judah!’ And now these reports will be heard by the king. So now, come[b], and let us consult together.
translation:
  language: te
  text: 'అంతేకాదు, నీ గురించి యెరూషలేములో ఇలా ప్రకటించడానికి నువ్వు ప్రవక్తలను నియమించావు: “యూదాలో ఒక రాజు ఉన్నాడు!”[b] ఇప్పుడు ఈ వార్తలు[a] రాజు చెవిన పడతాయి. కాబట్టి ఇప్పుడు రా, మనం కలిసి సంప్రదించుకుందాం.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఈ మాటలు,” “ఈ సంగతులు.” హెబ్రీ పదం మాటలు, విషయాలు లేదా వార్తలను సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా “యూదాలో రాజు.” ఈ సంక్షిప్త హెబ్రీ ప్రకటన రాజరిక హక్కును ప్రకటిస్తున్నారనే ఆరోపణను సూచిస్తుంది; అయితే ఉల్లేఖనంలో నెహెమ్యా పేరు స్పష్టంగా లేదు.
    reason: alternative_reading
lexical_decisions:
- source_word: וְגַם
  choice: అంతేకాదు
  rationale: ఆరోపణను మరింత బలపరిచే సంధానార్థాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: נְבִיאִים
  choice: ప్రవక్తలను
  rationale: మూలపదానికి సాధారణమైన అర్థం ‘ప్రవక్తలు’; దానిని సాధారణ దూతలు లేదా ప్రతినిధులు అని బలహీనపరచడానికి సందర్భంలో ఆధారం లేదు.
- source_word: הֶעֱמַדְתָּ
  choice: నియమించావు
  rationale: ఒక నిర్దిష్ట ప్రజా బాధ్యతలో వారిని ఉంచిన భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: לִקְרֹא עָלֶיךָ
  choice: నీ గురించి ... ప్రకటించడానికి
  rationale: קרא על అనే నిర్మాణంలోని ‘ఒకరి గురించి ప్రకటించడం’ అనే భావాన్ని నిలుపుతుంది; నెహెమ్యానే రాజని ఉల్లేఖనంలో నేరుగా చేర్చదు.
- source_word: בִירוּשָׁלַם
  choice: యెరూషలేములో
  rationale: స్థలార్థాన్ని నేరుగా అనువదిస్తుంది.
- source_word: מֶלֶךְ בִּיהוּדָה
  choice: యూదాలో ఒక రాజు ఉన్నాడు!
  rationale: క్రియలేని సంక్షిప్త హెబ్రీ ప్రకటనను తెలుగులో సహజంగా అందిస్తూ, ఆ ఉల్లేఖనంలో నెహెమ్యా పేరును అదనంగా చేర్చదు.
- source_word: יִשָּׁמַע לַמֶּלֶךְ
  choice: రాజుకు వినబడతాయి
  rationale: మూలంలోని నిష్క్రియార్థాన్ని నిలుపుతూ, ఆ సమాచారం రాజుకు చేరుతుందనే బెదిరింపు భావాన్ని వ్యక్తపరుస్తుంది.
- source_word: כַּדְּבָרִים הָאֵלֶּה
  choice: ఈ వార్తలు
  rationale: דברים అనేది మాటలు, సంగతులు లేదా నివేదికలు అనే విస్తృత అర్థం కలిగి ఉంది; రాజకీయ ఆరోపణల సందర్భంలో ‘వార్తలు’ సహజంగా ఉంది.
- source_word: לְכָה
  choice: రా
  rationale: ఏకవచన పుంలింగ ఆజ్ఞను నేరుగా, సహజంగా అందిస్తుంది.
- source_word: וְנִוָּעֲצָה יַחְדָּו
  choice: మనం కలిసి ఆలోచించుకుందాం
  rationale: పరస్పరం సంప్రదించి నిర్ణయించుకోవాలనే స్వచ్ఛంద, సమిష్టి భావాన్ని ప్రస్తుత తెలుగులో సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: రాజరిక హక్కు గురించి చేసిన ఆరోపణ స్వరూపం
  choice: ‘యూదాలో ఒక రాజు ఉన్నాడు!’ అని, ఉల్లేఖనంలో నెహెమ్యా పేరును చేర్చకుండా అనువదించడం
  alternative: ‘నువ్వే యూదాకు రాజువి!’ లేదా ‘నెహెమ్యా యూదాకు రాజు!’
  rationale: హెబ్రీ ఉల్లేఖనం ‘యూదాలో రాజు’ అనే క్రియలేని సంక్షిప్త వాక్యం. సందర్భంలో ఆరోపణ నెహెమ్యాపైనే ఉన్నా, ఉల్లేఖనం స్వయంగా అతని పేరును చెప్పదు; అందువల్ల మూలంలోని సంక్షిప్తత, అస్పష్టత రెండూ నిలుపబడ్డాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కానీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి వాడబడింది. సన్బల్లటు లేఖలోని ప్రత్యక్ష, బెదిరింపు ధోరణిని నిలుపడానికి ఏకవచన సంబోధనను సహజమైన రూపాల్లో ఉంచాం.
