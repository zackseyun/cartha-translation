  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְהִ֣י כַ/אֲשֶׁ֣ר נִשְׁמַ֣ע לְ/סַנְבַלַּ֣ט וְ֠/טוֹבִיָּה וּ/לְ/גֶ֨שֶׁם הָֽ/עַרְבִ֜י וּ/לְ/יֶ֣תֶר אֹֽיְבֵ֗י/נוּ כִּ֤י בָנִ֨יתִי֙ אֶת הַ֣/חוֹמָ֔ה וְ/לֹא נ֥וֹתַר בָּ֖/הּ פָּ֑רֶץ גַּ֚ם עַד הָ/עֵ֣ת הַ/הִ֔יא דְּלָת֖וֹת לֹא הֶעֱמַ֥דְתִּי בַ/שְּׁעָרִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/001.yaml
  text: When Sanballat[a], Tobiah, Geshem the Arab[b], and the rest of our enemies heard that I had rebuilt the wall and that no breach was left in it—though up to that time I had not set up the doors in the gates—
translation:
  language: te
  text: సన్బల్లటు, టోబీయా, అరబీయుడైన గెషెము[a], మా మిగతా శత్రువులు నేను ప్రాకారాన్ని మళ్లీ కట్టానని[b], దానిలో ఏ బీటా మిగలలేదని విన్నప్పుడు—అప్పటివరకు నేను ద్వారాలలో తలుపులను ఇంకా అమర్చకపోయినప్పటికీ—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘గష్ము’; ఈ పేరు నెహెమ్యా 6:6లో గష్ము రూపంలో కనిపిస్తుంది.
    reason: name_form_clarification
  - marker: b
    text: మూల హీబ్రూలో కేవలం ‘ప్రాకారాన్ని కట్టాను’ అని ఉంది; ఇప్పటికే ఉన్న ప్రాకారాన్ని పునరుద్ధరించిన సందర్భాన్ని బట్టి ఇక్కడ ‘మళ్లీ కట్టాను’ అని అనువదించబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַאֲשֶׁר נִשְׁמַע
  choice: విన్నారు
  rationale: హీబ్రూ కథనారంభ సూత్రాన్ని తెలుగులో సహజమైన కాలవాచక నిర్మాణంలో కలిపి, నిఫాల్ రూపాన్ని పేరుపొందిన వ్యక్తులే కర్తలుగా సహజంగా వ్యక్తం చేశాం.
- source_word: סַנְבַלַּט ... טוֹבִיָּה ... גֶשֶׁם הָעַרְבִי
  choice: సన్బల్లటు, టోబీయా, అరబీయుడైన గెషెము
  rationale: వ్యక్తినామాలను తెలుగు లిపిలో లిప్యంతరీకరించి, הָעַרְבִי అనే జాతి/ప్రాంత విశేషణాన్ని సహజంగా ‘అరబీయుడైన’ అని అనువదించాం.
- source_word: יֶתֶר אֹיְבֵינוּ
  choice: మా మిగతా శత్రువులు
  rationale: יֶתֶר లోని ‘మిగిలినవారు’ అనే భావాన్ని సాధారణ ఆధునిక తెలుగులో స్పష్టంగా అందిస్తుంది.
- source_word: בָנִיתִי אֶת־הַחוֹמָה
  choice: నేను ప్రాకారాన్ని మళ్లీ కట్టాను
  rationale: క్రియ అక్షరార్థంగా ‘కట్టాను’; సందర్భం ఇప్పటికే ఉన్న యెరూషలేము ప్రాకార పునరుద్ధరణ కావడంతో ‘మళ్లీ కట్టాను’ సహజంగా సందర్భార్థాన్ని తెలియజేస్తుంది. అక్షరార్థ ప్రత్యామ్నాయం పాదసూచికలో ఉంచాం.
- source_word: לֹא נוֹתַר בָּהּ פָּרֶץ
  choice: దానిలో ఏ పగులూ మిగలలేదు
  rationale: గోడ సందర్భంలో פָּרֶץ అనేది పగులు లేదా తెరువు; ‘పగులు’ సాధారణ పాఠకులకు సహజంగా ఉండి నిర్మాణ లోపాన్ని తెలియజేస్తుంది.
- source_word: גַּם עַד הָעֵת הַהִיא
  choice: అయితే అప్పటివరకు
  rationale: ఇక్కడి గమనిక ప్రధాన వాక్యానికి ఒక పరిమితిని జోడిస్తుంది; ‘అయితే’ ఆ వ్యత్యాసాన్ని తెలుగులో స్పష్టంగా అందిస్తుంది.
- source_word: דְּלָתוֹת לֹא הֶעֱמַדְתִּי בַשְּׁעָרִים
  choice: ద్వారాల తలుపులను నేను ఇంకా అమర్చలేదు
  rationale: דְּלָתוֹת ను ద్వార నిర్మాణాల నుంచి వేరుచేసి ‘తలుపులు’గా చూపించాం; הֶעֱמַדְתִּי కి ఈ సందర్భంలో ‘అమర్చాను’ సహజమైన క్రియ.
