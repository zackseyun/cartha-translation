  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథనశైలి. వాక్యం తదుపరి వచనంలో కొనసాగుతున్నందున చివర దీర్ఘవిరామ సూచికను నిలిపాం. ప్రధాన పాఠంలోని [a], [b] గుర్తులు సంబంధిత పాదసూచికలకు సరిపోతాయి.
