revisions:
- from: 'ఆ ఉత్తరంలో ఇలా రాసి ఉంది: “జనాల మధ్య ఒక వార్త వ్యాపిస్తోంది; గష్మూ కూడా అదే చెబుతున్నాడు. నువ్వూ యూదులూ తిరుగుబాటు చేయాలని పథకం వేస్తున్నారనీ, అందుకే నువ్వు ప్రాకారాన్ని తిరిగి కడుతున్నావనీ, ఈ వార్తల ప్రకారం నువ్వు వారికి రాజు కాబోతున్నావనీ చెబుతున్నారు.”[a]'
  to: 'ఆ ఉత్తరంలో ఇలా రాసి ఉంది: “జనముల మధ్య ఇలా వార్త వ్యాపిస్తోంది, గష్మూ కూడా ఇలా అంటున్నాడు: నువ్వూ యూదులూ తిరుగుబాటు చేయాలని యోచిస్తున్నారు. అందుకే నువ్వు ప్రాకారాన్ని తిరిగి కడుతున్నావు; ఈ మాటల ప్రకారం నువ్వు వారికి రాజు కాబోతున్నావు.”[a]'
  rationale: 'సవరించిన పాఠం మూలంలోని నివేదిక నిర్మాణాన్ని స్పష్టంగా నిలుపుతుంది: జనముల మధ్య వినబడుతున్న/వ్యాపిస్తున్న సమాచారం, దానిని గష్మూ చెప్పడం, తరువాత ఆరోపణల విషయం. మూలంలో లేని అస్పష్టమైన ‘చెబుతున్నారు’ను తొలగించాం. ‘ఈ మాటల ప్రకారం’ను ప్రధాన పాఠంలో ఉంచి, సందర్భాధారిత ‘ఈ వార్తల ప్రకారం’ను పాదటిప్పణిలో భద్రపరిచాం. ‘తిరిగి కడుతున్నావు’ నెహెమ్యా సందర్భంలోని పునర్నిర్మాణాన్ని సహజంగా తెలియజేస్తుంది; అది ఆరోపణ స్వరాన్ని మార్చదు.'
  reviewer_model: gpt-5.6-terra
