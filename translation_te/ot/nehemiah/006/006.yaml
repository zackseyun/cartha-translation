  revision_rationale: 'సవరించిన పాఠం మూలంలోని నివేదిక నిర్మాణాన్ని స్పష్టంగా నిలుపుతుంది: జనముల మధ్య వినబడుతున్న/వ్యాపిస్తున్న సమాచారం, దానిని గష్మూ చెప్పడం, తరువాత ఆరోపణల విషయం. మూలంలో లేని అస్పష్టమైన ‘చెబుతున్నారు’ను తొలగించాం. ‘ఈ మాటల ప్రకారం’ను ప్రధాన పాఠంలో ఉంచి, సందర్భాధారిత ‘ఈ వార్తల ప్రకారం’ను పాదటిప్పణిలో భద్రపరిచాం. ‘తిరిగి కడుతున్నావు’ నెహెమ్యా సందర్భంలోని పునర్నిర్మాణాన్ని సహజంగా తెలియజేస్తుంది; అది ఆరోపణ స్వరాన్ని మార్చదు.'
