id: NEH.6.6
reference: Nehemiah 6:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כָּת֣וּב בָּ֗/הּ בַּ/גּוֹיִ֤ם נִשְׁמָע֙ וְ/גַשְׁמ֣וּ אֹמֵ֔ר אַתָּ֤ה וְ/הַ/יְּהוּדִים֙ חֹשְׁבִ֣ים לִ/מְר֔וֹד עַל כֵּ֛ן אַתָּ֥ה בוֹנֶ֖ה הַ/חוֹמָ֑ה וְ/אַתָּ֗ה הֹוֶ֤ה לָ/הֶם֙ לְ/מֶ֔לֶךְ כַּ/דְּבָרִ֖ים הָ/אֵֽלֶּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/006.yaml
  text: It was written in it[a], “It is being reported among the nations—and Geshem also says it—that you and the Jews are planning to rebel. Therefore you are rebuilding the wall, and according to these reports you are to become their king.”
translation:
  language: te
  text: 'ఆ ఉత్తరంలో ఇలా రాసి ఉంది: “జనముల మధ్య ఇలా వార్త వ్యాపిస్తోంది, గష్మూ కూడా ఇలా అంటున్నాడు: నువ్వూ యూదులూ తిరుగుబాటు చేయాలని యోచిస్తున్నారు. అందుకే నువ్వు ప్రాకారాన్ని తిరిగి కడుతున్నావు; ఈ మాటల ప్రకారం నువ్వు వారికి రాజు కాబోతున్నావు.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఈ వార్తల ప్రకారం.”
    reason: כַּדְּבָרִים הָאֵלֶּהకు సందర్భానుగుణ ప్రత్యామ్నాయం. ప్రధాన పాఠంలోని ‘ఈ మాటల ప్రకారం’ హీబ్రూ పదబంధానికి మరింత సన్నిహితంగా ఉంటుంది.
lexical_decisions:
- source_word: כָּתוּב בָּהּ
  choice: ఆ ఉత్తరంలో ఇలా రాసి ఉంది
  rationale: స్త్రీలింగ ప్రత్యయం సందర్భంలోని ఉత్తరాన్ని సూచిస్తుంది. తెలుగు కథనంలో సహజంగా ఉండే వర్తమాన ఫలితస్థితి ‘రాసి ఉంది’ ద్వారా నిష్క్రియ భావం నిలిచింది.
- source_word: בַּגּוֹיִם נִשְׁמָע
  choice: జనాల మధ్య ఒక వార్త వ్యాపిస్తోంది
  rationale: నిఫాల్ రూపంలోని ‘వినబడుతోంది/తెలియబడుతోంది’ అనే వదంతి వ్యాప్తి భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; גּוֹיִם ఇక్కడ మతపరమైన ‘అన్యజనులు’ కంటే రాజకీయ-జాతి సమూహాల సాధారణ భావంలో ఉంది.
- source_word: וְגַשְׁמוּ אֹמֵר
  choice: గష్మూ కూడా అదే చెబుతున్నాడు
  rationale: హీబ్రూ పేరురూపం గష్మూను నేరుగా లిప్యంతరీకరించి, וְ యొక్క అదనపు ధృవీకరణ భావాన్ని ‘కూడా’తో తెలిపింది.
- source_word: חֹשְׁבִים לִמְרוֹד
  choice: తిరుగుబాటు చేయాలని పథకం వేస్తున్నారు
  rationale: חשב + క్రియార్థక రూపం ఉద్దేశం లేదా ప్రణాళికను సూచిస్తుంది; ఆరోపణను అతిగా తీవ్రపరచకుండా ఉద్దేశపూర్వకతను నిలుపుతుంది.
- source_word: עַל כֵּן
  choice: అందుకే
  rationale: తిరుగుబాటు ఆరోపణకూ ప్రాకార నిర్మాణానికీ ఉత్తరంలో చూపిన కారణసంబంధాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בּוֹנֶה הַחוֹמָה
  choice: ప్రాకారాన్ని తిరిగి కడుతున్నావు
  rationale: בנה యొక్క ప్రాథమిక నిర్మాణ భావాన్ని నిలుపుతూ, నెహెమ్యా సందర్భంలో ధ్వంసమైన ప్రాకారం పునర్నిర్మించబడుతోందని స్పష్టం చేస్తుంది.
- source_word: וְאַתָּה הֹוֶה לָהֶם לְמֶלֶךְ
  choice: నువ్వు వారికి రాజు కాబోతున్నావు
  rationale: הוה + ל నిర్మాణంలోని ‘అవడం’ భావాన్ని, ప్రత్యర్థుల ఆరోపణగా చెప్పబడుతున్న ఉద్దేశిత ఫలితాన్ని తెలుగులో సహజంగా తెలిపింది.
- source_word: כַּדְּבָרִים הָאֵלֶּה
  choice: ఈ వార్తల ప్రకారం
  rationale: דברים అక్షరార్థంగా ‘మాటలు/విషయాలు’ అయినా, ఇక్కడ ముందున్న వదంతులు లేదా ఆరోపణలను సూచిస్తుంది; ‘వార్తలు’ సందర్భార్థాన్ని స్పష్టంగా ఇస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ఉత్తరంలోని ప్రత్యక్ష ఆరోపణకు తగిన గంభీరమైన కాని సాధారణ పాఠకులకు సులభమైన శైలి వాడబడింది. ‘ప్రాకారం’ చారిత్రక పట్టణ గోడకు తగిన పదం. హీబ్రూ పేరురూపమైన ‘గష్మూ’ మూలపాఠానుసారంగా ఉంచబడింది.
