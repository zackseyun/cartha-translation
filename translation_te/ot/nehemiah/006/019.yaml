  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయితే వృత్తాంతపు గంభీరతను నిలుపుతూ అనువదించబడింది. కొనసాగుతూ లేదా పదేపదే జరిగిన చర్యలకు ‘ఉండేవారు’ రూపం వాడబడింది.
