  text: Also they kept speaking of his good deeds in my presence[a], and they kept reporting my words to him[b]. Tobiah sent letters to frighten me.
translation:
  language: te
  text: అంతేకాక, వారు అతని మంచి విషయాలను నా ఎదుట చెబుతూ ఉండేవారు[a]; నేను చెప్పిన మాటలను అతనికి చేరవేస్తూ ఉండేవారు[b]. నన్ను భయపెట్టడానికి టోబీయా ఉత్తరాలు పంపాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అతని మంచి పనులను’ లేదా ‘అతని మంచి గుణాలను.’ హీబ్రూ పదబంధం విస్తృతమైనది; ఇక్కడ వారు నెహెమ్యా ఎదుట టోబీయా గురించి అనుకూలమైన విషయాలు చెబుతున్నారని భావం.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘నా మాటలను అతనికి బయటకు తీసుకువెళ్తూ ఉండేవారు’; అంటే నెహెమ్యా మాటలను టోబీయాకు చేరవేస్తూ ఉండేవారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: అంతేకాక
  rationale: ముందటి వృత్తాంతానికి మరో అంశాన్ని జోడించే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: טוֹבֹתָיו
  choice: అతని మంచితనం
  rationale: ఈ బహువచన విశేషణ నామీకృతంగా వాడబడి, టోబీయా గురించిన మంచి పనులు, గుణాలు లేదా అనుకూల విషయాలు అనే విస్తృత భావాన్ని ఇస్తుంది; ‘మంచితనం’ ఆ విస్తృతిని ప్రధాన పాఠ్యంలో నిలుపుతుంది.
- source_word: הָיוּ אֹמְרִים
  choice: పొగుడుతూ ఉండేవారు
  rationale: היה తో కూడిన కృదంతం కొనసాగుతూ లేదా పదేపదే జరిగిన గత చర్యను సూచిస్తుంది; సందర్భంలో వారు టోబీయా గురించి అనుకూలంగా చెప్పడం వల్ల ‘పొగుడుతూ’ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: לְפָנַי
  choice: నా సమక్షంలో
  rationale: అక్షరార్థమైన ‘నా ఎదుట’ అనే భావాన్ని గౌరవప్రదమైన, సహజమైన ఆధునిక తెలుగులో ఇస్తుంది.
- source_word: וּדְבָרַי
  choice: నేను చెప్పిన మాటలను
  rationale: దָּבָר పదానికి ‘మాటలు’ లేదా ‘విషయాలు’ అనే అర్థాలు ఉన్నప్పటికీ, ఇక్కడ నెహెమ్యా పలికిన మాటలను ఇతరులు చేరవేయడం సందర్భానికి సరిపోతుంది.
- source_word: הָיוּ מוֹצִיאִים לוֹ
  choice: అతనికి చేరవేస్తూ ఉండేవారు
  rationale: అక్షరార్థంగా ‘అతని వద్దకు బయటకు తీసుకువెళ్తూ’ అనే ప్రయోగం ఇక్కడ సమాచారాన్ని రహస్యంగా లేదా నేరుగా చేరవేయడాన్ని సూచిస్తుంది; కొనసాగుతున్న చర్యను కూడా ఈ రూపం నిలుపుతుంది.
- source_word: אִגְּרוֹת
  choice: ఉత్తరాలు
  rationale: లిఖిత సమాచారానికి సాధారణమైన, స్పష్టమైన ఆధునిక తెలుగు పదం.
- source_word: שָׁלַח
  choice: పంపాడు
  rationale: సరళమైన కథన క్రియకు నేరమైన సహజ సమానార్థకం.
- source_word: לְיָרְאֵנִי
  choice: నన్ను భయపెట్టడానికి
  rationale: לְ ఉపసర్గతో ఉన్న రూపం ఉద్దేశాన్ని సూచిస్తుంది; ఉత్తరాలు పంపిన లక్ష్యం నెహెమ్యాలో భయం కలిగించడం.
