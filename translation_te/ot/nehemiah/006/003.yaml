id: NEH.6.3
reference: Nehemiah 6:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וָ/אֶשְׁלְחָ֨/ה עֲלֵי/הֶ֤ם מַלְאָכִים֙ לֵ/אמֹ֔ר מְלָאכָ֤ה גְדוֹלָה֙ אֲנִ֣י עֹשֶׂ֔ה וְ/לֹ֥א אוּכַ֖ל לָ/רֶ֑דֶת לָ֣/מָּה תִשְׁבַּ֤ת הַ/מְּלָאכָה֙ כַּ/אֲשֶׁ֣ר אַרְפֶּ֔/הָ וְ/יָרַדְתִּ֖י אֲלֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/003.yaml
  text: So I sent messengers to them[a], saying, “I am doing a great work, and I cannot come down. Why should the work stop while I leave it and come down to you?”
translation:
  language: te
  text: 'అప్పుడు నేను వారివద్దకు సందేశవాహకులను ఈ సందేశంతో పంపాను: “నేను ఒక గొప్ప పని చేస్తున్నాను; నేను కిందికి దిగివచ్చే వీలు లేదు. నేను దానిని విడిచిపెట్టి మీ దగ్గరకు కిందికి దిగివస్తే, పని ఎందుకు ఆగిపోవాలి?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאֶשְׁלְחָה עֲלֵיהֶם
  choice: అందుకు నేను వారి దగ్గరకు పంపి
  rationale: వయ్యిక్తోల్ కథనంలోని తదుపరి చర్యను సూచిస్తుంది; సందర్భంలో עַל గమ్యాన్ని సూచిస్తుంది. ‘అందుకు’ ముందు పరిస్థితికి సహజమైన ప్రతిస్పందనను తెలియజేస్తుంది.
- source_word: מַלְאָכִים
  choice: దూతలను
  rationale: ఇక్కడ సందేశం మోసుకెళ్లే మానవ ప్రతినిధులు ఉద్దేశించబడ్డారు; తెలుగు సందర్భంలో ‘దూతలు’ సహజంగా అదే అర్థాన్ని ఇస్తుంది.
- source_word: מְלָאכָה גְדוֹלָה אֲנִי עֹשֶׂה
  choice: నేను ఒక గొప్ప పని చేస్తున్నాను
  rationale: వర్తమానంలో కొనసాగుతున్న క్రియను కృదంత నిర్మాణం సూచిస్తుంది; ‘గొప్ప పని’ పని యొక్క పరిమాణం లేదా ప్రాముఖ్యత రెండింటినీ ముందుగానే పరిమితం చేయకుండా నిలుపుతుంది.
- source_word: וְלֹא אוּכַל לָרֶדֶת
  choice: కాబట్టి నేను కిందికి రాలేను
  rationale: ירד యొక్క దిగివెళ్లే స్థలార్థాన్ని ‘కిందికి’ నిలుపుతుంది. తెలుగు ప్రత్యక్ష సంభాషణలో ఆహ్వానించిన వారి వద్దకు వెళ్లడాన్ని ‘రాలేను’ అని చెప్పడం సహజం; సంధి సందర్భంలోని ఫలిత సంబంధాన్ని వ్యక్తం చేస్తుంది.
- source_word: לָמָּה תִשְׁבַּת הַמְּלָאכָה
  choice: పని ఎందుకు ఆగిపోవాలి?
  rationale: שׁבת ఇక్కడ ‘నిలిచిపోవడం/ఆగిపోవడం’ అనే అర్థంలో ఉంది; ప్రశ్న యొక్క వాక్చాతుర్య బలాన్ని ‘ఎందుకు ... పోవాలి?’ సహజంగా అందిస్తుంది.
- source_word: כַּאֲשֶׁר אַרְפֶּהָ
  choice: నేను దాన్ని విడిచిపెట్టి ... వస్తే
  rationale: רפה హిఫిల్ రూపం పనిని వదలడం లేదా దానిపై పట్టును సడలించడం అనే భావాన్ని ఇస్తుంది; స్త్రీలింగ ప్రత్యయం ‘పని’ని సూచిస్తున్నందున ‘దాన్ని’ వాడబడింది. כַּאֲשֶׁר ఇక్కడ పరిస్థితిని సూచించే ‘వస్తే’ నిర్మాణంలో సహజంగా వ్యక్తమవుతుంది.
- source_word: וְיָרַדְתִּי אֲלֵיכֶם
  choice: మీ దగ్గరకు కిందికి వస్తే
  rationale: యెరూషలేము నుండి దిగే భౌగోళిక కదలికను ‘కిందికి’ నిలుపుతుంది; సంబోధితుల దృష్టికోణంలో ‘మీ దగ్గరకు ... వస్తే’ సహజ తెలుగు.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘దూతలు’ అనే పదం సందర్భం వల్ల మానవ సందేశవాహకులను స్పష్టంగా సూచిస్తుంది. మూలంలోని ‘దిగుట’ అనే భౌగోళిక భావాన్ని రెండుసార్లూ ‘కిందికి’తో నిలిపాం. ప్రచురణ పాఠ్యంలో పాదటిప్పణులు లేవు; అందువల్ల గుర్తులు అవసరం లేదు.
