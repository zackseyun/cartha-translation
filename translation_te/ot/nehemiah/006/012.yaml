  yaml_path: translation/ot/nehemiah/006/012.yaml
  text: Then I recognized, and behold, God had not sent him; rather, he had spoken the prophecy against me because Tobiah and Sanballat had hired him.
translation:
  language: te
  text: 'అప్పుడు నేను గ్రహించాను: ఇదిగో, దేవుడు అతనిని పంపలేదు; తోబీయా, సన్బల్లటు అతనిని డబ్బిచ్చి నియమించుకున్నందువల్ల అతడు నాకు విరోధంగా ఆ ప్రవచనం పలికాడు.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאַכִּירָה
  choice: నేను గ్రహించాను
  rationale: హీబ్రూ క్రియ ఇక్కడ పరిస్థితిని గుర్తించి అర్థం చేసుకోవడాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: అకస్మాత్తుగా స్పష్టమైన నిర్ధారణకు వచ్చిన భావాన్ని, మూలంలోని ఉద్ఘాటనను నిలుపుతుంది.
- source_word: הַנְּבוּאָה דִּבֶּר עָלַי
  choice: నాకు విరోధంగా ఆ ప్రవచనం పలికాడు
  rationale: עַל సందర్భానుసారంగా వ్యతిరేక దిశను సూచిస్తుంది; נְבוּאָה యొక్క నిర్దిష్టతను 'ఆ ప్రవచనం'గా ఉంచింది.
- source_word: שְׂכָרוֹ
  choice: అతన్ని కూలికి పెట్టుకున్నారు
  rationale: డబ్బు ఇచ్చి నియమించుకోవడం అనే భావాన్ని సాధారణ ఆధునిక తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: ప్రవక్తగా చెప్పుకున్న వ్యక్తిని దేవుడు పంపాడా అన్న వివేచన
  choice: దేవుడు అతన్ని పంపలేదు
  alternative: అతడు దేవునిచేత పంపబడలేదు
  rationale: మూలంలోని ప్రత్యక్ష కర్తృవాచక నిర్మాణాన్ని నిలిపి, నెహెమ్యా పొందిన నిర్ధారణను ఎలాంటి సిద్ధాంత విస్తరణ లేకుండా చెబుతుంది.
- issue: కారణ సంబంధం
  choice: తోబీయా, సన్బల్లటు అతన్ని కూలికి పెట్టుకున్నారు కాబట్టే
  alternative: ఎందుకంటే తోబీయా, సన్బల్లటు అతన్ని కూలికి పెట్టుకున్నారు
  rationale: כִּי యొక్క కారణార్థాన్ని నిలుపుతూ, ముందున్న ప్రకటన నిజమైన దైవప్రేరిత ప్రవచనం కాదని వాక్య సంబంధం స్పష్టపరుస్తుంది; అదనపు సిద్ధాంతార్థం చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన, సామాన్య పాఠకులకు అర్థమయ్యే శైలి. మూలంలోని గుర్తింపు, ఉద్ఘాటన, కారణ క్రమాన్ని సాధ్యమైనంత సహజంగా నిలిపింది.
