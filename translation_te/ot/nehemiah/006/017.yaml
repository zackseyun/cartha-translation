translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా, అయితే చారిత్రక కథనానికి తగిన గౌరవప్రదమైన శైలి. మూలంలోని దీర్ఘవృత్తాన్ని పూర్తిగా తొలగించకుండా పాదసూచికతో నిలిపాం.
