  edition: WLC
  text: גַּ֣ם בַּ/יָּמִ֣ים הָ/הֵ֗ם מַרְבִּ֞ים חֹרֵ֤י יְהוּדָה֙ אִגְּרֹ֣תֵי/הֶ֔ם הוֹלְכ֖וֹת עַל טוֹבִיָּ֑ה וַ/אֲשֶׁ֥ר לְ/טוֹבִיָּ֖ה בָּא֥וֹת אֲלֵי/הֶֽם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/017.yaml
  text: Also[a], in those days the nobles of Judah were sending many letters to Tobiah, and those from Tobiah were coming to them.
translation:
  language: te
  text: ఆ రోజుల్లో కూడా యూదా ప్రముఖులు తోబీయాకు అనేక ఉత్తరాలు పంపుతూ ఉండేవారు; తోబీయాకు చెందినవి[a] వారి దగ్గరికి వస్తూ ఉండేవి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “తోబీయాకు చెందినవి.” మొదటి వాక్యభాగంతో ఉన్న సమాంతరతనుబట్టి ఇక్కడ “ఉత్తరాలు” అనే మాట భావించబడుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם בַּיָּמִים הָהֵם
  choice: ఆ రోజుల్లో
  rationale: గַּם ఇక్కడ పరిసర కథనానికి మరో పరిస్థితిని జోడిస్తుంది. తెలుగులో సందర్భానుసంధానంతో ‘ఆ రోజుల్లో’ సహజంగా ఈ కొనసాగింపును తెలియజేస్తుంది; ప్రత్యేకంగా ‘కూడా’ చేర్చితే వాక్యం కొంత కృత్రిమంగా వినిపించవచ్చు.
- source_word: מַרְבִּים
  choice: అనేక ... పంపుతూ ఉండేవారు
  rationale: ఉత్తరాల సందర్భంలో ఈ రూపం పునరావృతంగా, విస్తారంగా జరిగిన పంపకాన్ని సూచిస్తుంది. అసంపూర్ణ కొనసాగింపు భావాన్ని ‘పంపుతూ ఉండేవారు’ సహజంగా అందిస్తుంది.
- source_word: חֹרֵי יְהוּדָה
  choice: యూదా ప్రముఖులు
  rationale: ఈ పదం యూదాలో సామాజికంగా, రాజకీయంగా ప్రాధాన్యం గల నాయకవర్గాన్ని సూచిస్తుంది. ‘ప్రముఖులు’ ఆధునిక సాధారణ తెలుగులో సహజంగా ఉండి, ‘అధికారులు’ అనే మరీ నిర్దిష్ట పరిపాలనా భావాన్ని రుద్దదు.
- source_word: אִגְּרֹתֵיהֶם הוֹלְכוֹת עַל טוֹבִיָּה
  choice: తోబీయాకు అనేక ఉత్తరాలు పంపుతూ ఉండేవారు
  rationale: అక్షరార్థంగా ‘వారి ఉత్తరాలు తోబీయా దగ్గరికి వెళ్తుండేవి.’ తెలుగులో ఉత్తర ప్రత్యుత్తరాల భావాన్ని సహజంగా చెప్పేందుకు ‘పంపుతూ ఉండేవారు’ అని వ్యక్తీకరించబడింది.
- source_word: וַאֲשֶׁר לְטוֹבִיָּה
  choice: తోబీయాకు చెందినవి
  rationale: మూలంలోని సంబంధవాచక నిర్మాణం ‘తోబీయాకు చెందినవి’ అని మాత్రమే చెబుతుంది; సమాంతర మొదటి భాగం వల్ల ‘ఉత్తరాలు’ అర్థమవుతుంది. ఆ దీర్ఘవృత్తాన్ని ప్రధాన పాఠ్యంలో నిలిపి, పాదసూచికలో స్పష్టం చేయబడింది.
- source_word: בָּאוֹת אֲלֵיהֶם
  choice: వారి దగ్గరికి వస్తూ ఉండేవి
  rationale: స్త్రీలింగ బహువచన కృదంతం ముందున్న ‘ఉత్తరాలు’తో సరిపడి, కొనసాగిన లేదా పునరావృతమైన రాకను సూచిస్తుంది.
