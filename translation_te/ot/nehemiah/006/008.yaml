  terminology: ‘హృదయం’ appropriately preserves the Hebrew לֵב imagery, while the footnote may offer ‘మనస్సు’ as a natural interpretive lexical alternative. ‘కల్పిస్తున్నావు’ faithfully renders the fabrication expressed by בּוֹדָאם.
