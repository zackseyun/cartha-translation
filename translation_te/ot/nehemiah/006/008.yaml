translation_notes:
  register: సాధారణ పాఠకులకు అర్థమయ్యే ఆధునిక ప్రామాణిక తెలుగును ఉపయోగించాం. నేరుగా పలికిన ఖండనకు తగిన స్పష్టతను ఉంచుతూ, ‘హృదయం’ అనే హెబ్రీయ రూపకాన్ని తొలగించలేదు.
