language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וָ/אֶשְׁלְחָ֤/ה אֵלָי/ו֙ לֵ/אמֹ֔ר לֹ֤א נִֽהְיָה֙ כַּ/דְּבָרִ֣ים הָ/אֵ֔לֶּה אֲשֶׁ֖ר אַתָּ֣ה אוֹמֵ֑ר כִּ֥י מִֽ/לִּבְּ/ךָ֖ אַתָּ֥ה בוֹדָֽא/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/008.yaml
  text: So I sent to him[a], saying, “These things that you are saying have not happened, for you are inventing them out of your own heart.”
translation:
  language: te
  text: 'అప్పుడు నేను అతనికి ఇలా సందేశం పంపాను: “నీవు చెబుతున్నట్లుగా ఈ సంగతులు ఏవీ జరగలేదు; ఎందుకంటే నీవు వాటిని నీ సొంత హృదయంలో నుంచే కల్పిస్తున్నావు[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీవు వాటిని నీ సొంత మనస్సులో నుంచే కల్పిస్తున్నావు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשְׁלְחָה אֵלָיו לֵאמֹר
  choice: అప్పుడు నేను అతనికి ఇలా కబురు పంపాను
  rationale: క్రమంగా జరిగిన తదుపరి చర్యను సూచించే వయ్యిక్తోల్ రూపాన్ని ‘అప్పుడు’ ప్రతిబింబిస్తుంది. సందర్భంలో సందేశం పంపడమే ఉద్దేశం కావడంతో ‘కబురు పంపాను’ సహజమైన ఆధునిక తెలుగు.
- source_word: לֹא נִהְיָה כַּדְּבָרִים הָאֵלֶּה
  choice: ఈ విషయాలు జరగలేదు
  rationale: היה ఇక్కడ ఆరోపించబడిన సంగతుల వాస్తవికతను నిరాకరిస్తుంది; דְּבָרִים అనే పదానికి ఈ సందర్భంలో ‘విషయాలు’ సహజంగా సరిపోతుంది.
- source_word: אֲשֶׁר אַתָּה אוֹמֵר
  choice: నువ్వు చెబుతున్న
  rationale: ఓమెర్ అనే కృదంత రూపంలోని కొనసాగుతున్న ప్రకటన భావాన్ని ‘చెబుతున్న’ నిలుపుతుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: నెహెమ్యా చేసిన నిరాకరణకు కారణాన్ని పరిచయం చేసే సంబంధాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: מִלִּבְּךָ
  choice: నీ సొంత హృదయంలోనుంచే
  rationale: לֵב ఆలోచన, సంకల్పం కలిగే అంతరంగాన్ని సూచిస్తుంది. ‘హృదయం’ అనే మూలభాషా రూపకాన్ని నిలుపుతూ, ‘సొంత’ మరియు ‘-నుంచే’ కల్పన అతనిలోనే పుట్టిందనే బలాన్ని తెలియజేస్తాయి.
- source_word: בּוֹדָאם
  choice: వాటిని ... కల్పిస్తున్నావు
  rationale: בדא అంటే లేనిదాన్ని సృష్టించడం లేదా కల్పించడం. ‘కల్పిస్తున్నావు’ స్పష్టమైన, గౌరవప్రదమైన ఆధునిక తెలుగు.
