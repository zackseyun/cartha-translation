  to: 'అప్పుడు నేను అతనికి ఇలా సందేశం పంపాను: “నీవు చెబుతున్నట్లుగా ఈ సంగతులు ఏవీ జరగలేదు; ఎందుకంటే నీవు వాటిని నీ సొంత హృదయంలో నుంచే కల్పిస్తున్నావు[a].”'
