  yaml_path: translation/ot/nehemiah/006/015.yaml
  text: So the wall was finished on the twenty-fifth day of Elul[b][a], in fifty-two days.
translation:
  language: te
  text: ఆ విధంగా, గోడ ఎలూలు నెల ఇరవై ఐదవ రోజున[a], యాభై రెండు రోజుల్లో పూర్తయింది[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఎలూలు హీబ్రూ పంచాంగంలోని ఆరవ నెల.
    reason: cultural_note
  - marker: b
    text: లేదా, ‘ముగిసింది.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּשְׁלַם
  choice: పూర్తయింది
  rationale: שלם ధాతువు ఇక్కడ గోడను కర్తగా తీసుకొని పని ముగింపుకు వచ్చిందనే సంఘటనాత్మక భావాన్ని ఇస్తుంది. ఆధునిక తెలుగులో ‘పూర్తయింది’ సహజంగా, గౌరవప్రదంగా ఉంటుంది; ‘ముగిసింది’ కూడా సాధ్యమే.
- source_word: הַחוֹמָה
  choice: గోడ
  rationale: సమీప సందర్భంలో యెరూషలేము గోడను సూచించే నిర్దిష్ట నామవాచకం.
- source_word: בְּעֶשְׂרִים וַחֲמִשָּׁה לֶאֱלוּל
  choice: ఏలూలు నెల ఇరవై ఐదవ రోజున
  rationale: హీబ్రూ తేదీ ప్రయోగాన్ని తెలుగులో స్పష్టంగా తెలియజేయడానికి ‘నెల’, ‘రోజున’ చేర్చబడ్డాయి; ఏలూలు అనే నెల పేరును లిప్యంతరీకరించాం.
- source_word: לַחֲמִשִּׁים וּשְׁנַיִם יוֹם
  choice: యాభై రెండు రోజుల్లో
  rationale: లామెద్‌తో కూడిన సంఖ్యా పదబంధం పని పూర్తవడానికి పట్టిన మొత్తం కాలవ్యవధిని సూచిస్తుంది. ‘రోజుల్లో’ ఆ వ్యవధిని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: וַ
  choice: ఆ విధంగా
  rationale: కథనంలోని ఫలితాన్ని ముందరి సంఘటనలతో కలిపే వావ్‌ను తెలుగులో సహజమైన పరిణామ సూచకంగా అందించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా తేదీ నిర్మాణాన్ని సహజీకరించి, మూలంలోని సంక్షిప్తతను మరియు గంభీర కథన శైలిని నిలుపుకున్నాం. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉంచబడ్డాయి.
