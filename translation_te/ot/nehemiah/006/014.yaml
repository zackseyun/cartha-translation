  terminology: టోబీయా, సన్బల్లట్టు, నోయద్యా అనే లిప్యంతరీకరణలు నిలుపబడ్డాయి. הַנְּבִיאָהను ‘ప్రవక్తురాలు’గా అనువదించడం స్త్రీలింగ సూచనను కాపాడుతుంది. מְיָרְאִים యొక్క కారక/భయపెట్టే భావం ‘నన్ను భయపెట్టడానికి ప్రయత్నించిన’లో సముచితంగా ఉంది.
