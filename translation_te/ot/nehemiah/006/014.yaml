source:
  edition: WLC
  text: זָכְרָ֧/ה אֱלֹהַ֛/י לְ/טוֹבִיָּ֥ה וּ/לְ/סַנְבַלַּ֖ט כְּ/מַעֲשָׂ֣י/ו אֵ֑לֶּה וְ/גַ֨ם לְ/נוֹעַדְיָ֤ה הַ/נְּבִיאָה֙ וּ/לְ/יֶ֣תֶר הַ/נְּבִיאִ֔ים אֲשֶׁ֥ר הָי֖וּ מְיָֽרְאִ֥ים אוֹתִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/014.yaml
  text: Remember Tobiah and Sanballat[a], my God, according to these deeds of theirs, and also Noadiah the prophetess and the rest of the prophets who were trying to make me afraid.
translation:
  language: te
  text: నా దేవా, టోబీయాను, సన్బల్లట్టును వారు చేసిన ఈ పనులను బట్టి జ్ఞాపకం చేసుకో. నన్ను భయపెట్టడానికి ప్రయత్నించిన ప్రవక్తురాలైన నోయద్యాను, మిగిలిన ప్రవక్తలను కూడా జ్ఞాపకం చేసుకో.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నన్ను భయపెట్టేందుకు యత్నిస్తూ ఉన్నారు.”
    reason: మూలంలోని క్రియ నన్ను భయపెట్టాలనే ఉద్దేశంతో కొనసాగిన ప్రయత్నాన్ని సూచిస్తుంది; ఇది సంక్షిప్త ప్రత్యామ్నాయ అనువాదం.
lexical_decisions:
- source_word: זָכְרָה
  choice: జ్ఞాపకం చేసుకో
  rationale: దేవునికి నేరుగా చేసే ప్రార్థనాత్మక విజ్ఞప్తి. మూలంలోని సంక్షిప్తతను, నేరుతనాన్ని నిలుపుతుంది.
- source_word: אֱלֹהַי
  choice: నా దేవా
  rationale: మొదటి పురుష ఏకవచన సంబంధాన్ని, ప్రత్యక్ష సంబోధనను సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: לְטוֹבִיָּה וּלְסַנְבַלַּט
  choice: టోబీయా, సన్బల్లటులు
  rationale: వ్యక్తుల పేర్లను తెలుగు లిపిలో లిప్యంతరీకరించి, ఇద్దరినీ కలిపి సూచించేందుకు బహువచన రూపం వాడబడింది.
- source_word: כְּמַעֲשָׂיו אֵלֶּה
  choice: చేసిన ఈ పనులను బట్టి
  rationale: כְּ యొక్క అనురూపత లేదా ప్రమాణ భావాన్ని ‘బట్టి’ సహజంగా తెలియజేస్తుంది; తీర్పు అనే భావాన్ని మూలానికి మించి చేర్చదు.
- source_word: לְנוֹעַדְיָה הַנְּבִיאָה
  choice: ప్రవక్త్రి నోయద్యాను
  rationale: స్త్రీలింగ ప్రవక్త పదాన్ని స్పష్టంగా నిలుపుతూ, పేరును తెలుగు లిపిలో లిప్యంతరీకరిస్తుంది.
- source_word: וּלְיֶתֶר הַנְּבִיאִים
  choice: మిగిలిన ప్రవక్తలను
  rationale: יֶתֶר లోని ‘మిగిలినవారు’ అనే భావాన్ని సాధారణ ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: אֲשֶׁר הָיוּ מְיָרְאִים אוֹתִי
  choice: నన్ను భయపెట్టడానికి ప్రయత్నించిన
  rationale: היה తో కూడిన కృదంత నిర్మాణంలోని గతకాల నిరంతర ప్రయత్నాన్ని, causative భయపెట్టే భావాన్ని తెలియజేస్తుంది.
theological_decisions:
- issue: విరోధులను దేవుడు జ్ఞాపకం చేసుకోవాలనే ప్రార్థన స్వరం
  choice: వారు చేసిన పనులను బట్టి వారిని జ్ఞాపకం చేసుకో
  alternative: తీర్పు కోసం వారిని జ్ఞాపకం చేసుకో / వారిని శిక్షించు
  rationale: మూలం నైతికంగా గంభీరమైన విజ్ఞప్తి చేస్తుంది గాని ‘తీర్పు’ లేదా ‘శిక్ష’ అని స్పష్టంగా చెప్పదు; అందువల్ల ఆ భావాన్ని విస్తరించకుండా ఉద్రిక్తతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ప్రార్థనకు తగిన గౌరవప్రదమైన, నేరుగా ఉండే శైలి. వ్యక్తిపేర్లు సాధారణ తెలుగు బైబిలు లిప్యంతరీకరణకు దగ్గరగా ఉంచబడ్డాయి. మూలంలోని న్యాయసూచక ఉద్రిక్తతను స్పష్టమైన శిక్షాభాషగా విస్తరించలేదు.
