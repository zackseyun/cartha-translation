  yaml_path: translation/ot/nehemiah/006/005.yaml
  text: Then Sanballat sent his servant to me a fifth time in this manner[a], with an open letter in his hand.
translation:
  language: te
  text: అప్పుడు సన్బల్లటు ఇదే విధంగా ఐదవసారి తన సేవకుణ్ణి నా దగ్గరికి పంపాడు. ఆ సేవకుని చేతిలో తెరిచి ఉన్న ఒక ఉత్తరం ఉంది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ముద్ర వేయని ఒక ఉత్తరం.’
    reason: פְּתוּחָה అంటే అక్షరార్థంగా ‘తెరిచి ఉన్నది’; ఉత్తరం సందర్భంలో అది ముద్ర వేయబడలేదని కూడా అర్థం కావచ్చు.
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: అప్పుడు ... పంపాడు
  rationale: వావ్-కన్సిక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది; ‘అప్పుడు’ సహజమైన తెలుగు కథన క్రమాన్ని తెలియజేస్తుంది.
- source_word: אֵלַי
  choice: నా దగ్గరికి
  rationale: אֶל ప్రత్యయం సందేశవాహకుడు వక్తవైపు, అతని వద్దకు పంపబడిన దిశను సూచిస్తుంది.
- source_word: סַנְבַלַּט
  choice: సన్బల్లటు
  rationale: వ్యక్తి పేరును తెలుగు ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: כַּדָּבָר הַזֶּה
  choice: ఇదే విధంగా
  rationale: ముందు వివరించిన అదే పద్ధతిలో మళ్లీ పంపడాన్ని సూచించే హీబ్రూ ప్రయోగానికి సహజమైన తెలుగు రూపం.
- source_word: פַּעַם חֲמִישִׁית
  choice: ఐదవసారి
  rationale: చర్య ఎన్నిసార్లు పునరావృతమైందో తెలిపే హీబ్రూ భావాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: אֶת נַעֲרוֹ
  choice: తన సేవకుణ్ణి
  rationale: נַעַר ప్రాథమికంగా యువకుణ్ణి సూచించగలిగినా, ఇక్కడ సందేశవాహకునిగా పనిచేసే పరిచారకుని పాత్ర ప్రధానమైనందున ‘సేవకుడు’ అనుకూలం.
- source_word: וְאִגֶּרֶת פְּתוּחָה
  choice: తెరిచి ఉన్న ఒక ఉత్తరం
  rationale: పత్రం మూసివేయబడకుండా, ఇతరులు చదవగల స్థితిలో ఉందనే ప్రత్యక్ష భావాన్ని నిలుపుతుంది.
- source_word: בְּיָדוֹ
  choice: అతని చేతిలో
  rationale: సేవకుడు ఉత్తరాన్ని భౌతికంగా చేతిలో పట్టుకొని వచ్చాడనే స్పష్టమైన చిత్రణను నిలుపుతుంది.
