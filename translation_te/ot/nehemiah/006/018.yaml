id: NEH.6.18
reference: Nehemiah 6:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּי רַבִּ֣ים בִּֽ/יהוּדָ֗ה בַּעֲלֵ֤י שְׁבוּעָה֙ ל֔/וֹ כִּי חָתָ֥ן ה֖וּא לִ/שְׁכַנְיָ֣ה בֶן אָרַ֑ח וִֽ/יהוֹחָנָ֣ן בְּנ֔/וֹ לָקַ֕ח אֶת בַּת מְשֻׁלָּ֖ם בֶּ֥ן בֶּֽרֶכְיָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/018.yaml
  text: For many in Judah were bound by oath to him[a], because he was the son-in-law of Shecaniah son of Arah[b], and Jehohanan his son had taken the daughter of Meshullam son of Berechiah as his wife.
translation:
  language: te
  text: 'ఎందుకంటే యూదాలో చాలామంది అతనికి ప్రమాణబద్ధులై ఉన్నారు: అతడు ఆరహు కుమారుడైన షెకన్యాకు అల్లుడు, మరియు షెకన్యా కుమారుడైన యెహోహానాను బెరెక్యా కుమారుడైన మెషుల్లాము కుమార్తెను పెళ్లి చేసుకున్నాడు[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: హీబ్రూలో “మెషుల్లాము కుమార్తెను తీసుకున్నాడు”; ఇది ఆమెను పెళ్లి చేసుకున్నాడని తెలిపే సాధారణ నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַבִּים בִּיהוּדָה
  choice: యూదాలో చాలామంది
  rationale: בִּיהוּדָה ఇక్కడ ప్రదేశార్థకంగా ఉంది; యూదా ప్రాంతం లేదా సమాజంలో ఉన్న అనేకమందిని సూచిస్తుంది.
- source_word: בַּעֲלֵי שְׁבוּעָה לוֹ
  choice: అతనికి ప్రమాణబద్ధులై ఉన్నారు
  rationale: అక్షరార్థంగా ‘అతనికి ప్రమాణానికి యజమానులు’ అనే ఈ హీబ్రూ నుడికారం, వారు ప్రమాణం ద్వారా అతనికి కట్టుబడి ఉన్నారని సూచిస్తుంది.
- source_word: כִּי ... כִּי
  choice: ఎందుకంటే ... [వాక్య నిర్మాణంలో కారణార్థం]
  rationale: మొదటి כִּי ముందరి వాక్యానికి వివరణను ప్రవేశపెడుతుంది; రెండవది ఆ ప్రమాణబద్ధతకు కారణమైన వివాహ బంధాన్ని తెలియజేస్తుంది. తెలుగులో పునరుక్తి భారంగా కాకుండా వాక్య విభజన ద్వారా సంబంధం స్పష్టమైంది.
- source_word: חָתָן הוּא לִשְׁכַנְיָה
  choice: అతడు ... షెకన్యాకు అల్లుడు
  rationale: חָתָן వివాహ బంధుత్వ సందర్భంలో సాధారణంగా ‘అల్లుడు’ అని అర్థం; ఇది స్పష్టమైన, సహజమైన తెలుగు రూపం.
- source_word: וִיהוֹחָנָן בְּנוֹ
  choice: అతని కుమారుడు యెహోహానాను
  rationale: בְּנוֹ లోని సర్వనామాన్ని సమీప పూర్వపదమైన షెకన్యాకు అన్వయిస్తూ హీబ్రూ నిర్మాణాన్ని సహజమైన తెలుగు పదక్రమంలో ఇచ్చాం.
- source_word: לָקַח אֶת בַּת
  choice: కుమార్తెను పెళ్లి చేసుకున్నాడు
  rationale: ‘కుమార్తెను తీసుకున్నాడు’ అనేది ఇక్కడ వివాహానికి సంబంధించిన హీబ్రూ నుడికారం; దాని ఉద్దేశిత అర్థాన్ని ఆధునిక తెలుగులో స్పష్టంగా ఇచ్చాం.
- source_word: בַּת מְשֻׁלָּם בֶּן בֶּרֶכְיָה
  choice: బెరెక్యా కుమారుడైన మెషుల్లాము కుమార్తె
  rationale: హీబ్రూ వంశపరంపర సంబంధాన్ని తెలుగులో సహజంగా, సంబంధాలు సందిగ్ధం కాకుండా చూపిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ముందరి వచనానికి కారణాన్ని తెలియజేసే మొదటి כִּי కోసం ‘ఎందుకంటే’ వాడి, దీర్ఘ వాక్యాన్ని సహజమైన రెండు వాక్యాలుగా విభజించాం. వివాహ బంధాల వివరాలు మూలంలోని క్రమం, సంబంధాలను కాపాడేలా ఇచ్చాం.
