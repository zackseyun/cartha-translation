    rationale: హీబ్రూ పాఠంలో షెమయా ‘దెలాయా కుమారుడు, మెహేతబేలు కుమారుడు’ అని ఉంది. రెండవ בֶן ను ‘మనుమడు’గా మార్చడం మూలంలోని ప్రత్యక్ష పితృసంబంధాన్ని మార్చుతుంది.
