source:
  edition: WLC
  text: וַ/אֲנִי בָ֗אתִי בֵּ֣ית שְֽׁמַֽעְיָ֧ה בֶן דְּלָיָ֛ה בֶּן מְהֵֽיטַבְאֵ֖ל וְ/ה֣וּא עָצ֑וּר וַ/יֹּ֡אמֶר נִוָּעֵד֩ אֶל בֵּ֨ית הָ/אֱלֹהִ֜ים אֶל תּ֣וֹךְ הַֽ/הֵיכָ֗ל וְ/נִסְגְּרָה֙ דַּלְת֣וֹת הַ/הֵיכָ֔ל כִּ֚י בָּאִ֣ים לְ/הָרְגֶ֔/ךָ וְ/לַ֖יְלָה בָּאִ֥ים לְ/הָרְגֶֽ/ךָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/010.yaml
  text: Then I went to the house of Shemaiah son of Delaiah[a], son of Mehetabel, who was confined, and he said, “Let us meet at the house of God, inside the temple, and let us shut the doors of the temple, for they are coming to kill you—yes, at night they are coming to kill you.”
translation:
  language: te
  text: అప్పుడు నేను దెలాయా కుమారుడూ, మెహేతబేలు కుమారుడూ అయిన షెమయా ఇంటికి వెళ్లాను. అతడు నిర్బంధంలో ఉన్నాడు. అతడు నాతో, “మనం దేవుని మందిరంలో, ఆలయం లోపల[a] కలుసుకుందాం; ఆలయ తలుపులు మూసివేద్దాం. ఎందుకంటే నిన్ను చంపడానికి వారు వస్తున్నారు—రాత్రివేళ నిన్ను చంపడానికి వారు వస్తున్నారు” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “పవిత్రస్థలం లోపల.” హీబ్రూ పదమైన హేఖాల్ విస్తారమైన దేవాలయ ప్రాంగణాన్ని మాత్రమే కాకుండా, ప్రత్యేకంగా ఆలయ కట్టడాన్ని లేదా పవిత్రస్థలాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי בָאתִי
  choice: అప్పుడు నేను ... ఇంటికి వెళ్లాను
  rationale: కథన కొనసాగింపును, కర్తపై ఉన్న స్వల్ప ఉద్ఘాటనను సహజమైన ఆధునిక తెలుగు వాక్యక్రమంలో నిలుపుతుంది; בוא సందర్భానుసారంగా ‘వెళ్లాను’గా అనువదించబడింది.
- source_word: בֵּית שְׁמַעְיָה
  choice: షెమయా ఇంటికి
  rationale: వ్యక్తి పేరుతో ఉన్న construct రూపం అతని నివాసాన్ని సూచిస్తుంది; తెలుగులో ‘ఇంటికి’ సహజంగా ఉంటుంది.
- source_word: שְׁמַעְיָה בֶן דְּלָיָה בֶּן מְהֵיטַבְאֵל
  choice: దెలాయా కుమారుడూ, మెహేతబేలు మనుమడూ అయిన షెమయా
  rationale: హీబ్రూ వంశావళి సంబంధాన్ని తెలుగులో స్పష్టంగా తెలియజేస్తుంది; రెండవ בֶן ఇక్కడ వంశపరంగా ‘మనుమడు’గా సహజీకరించబడింది.
- source_word: וְהוּא עָצוּר
  choice: అతడు బయటకు రాకుండా నిర్బంధంలో ఉన్నాడు
  rationale: עָצוּר సూచించే మూసివేయబడిన లేదా నిర్బంధిత స్థితిని నిలుపుతూ, అది నిర్బంధమా, స్వచ్ఛంద ఏకాంతమా, ఆచార సంబంధమైన వేరుపాటా అన్న కారణాన్ని నిర్ణయించదు.
- source_word: נִוָּעֵד
  choice: మనం ... కలుసుకుందాం
  rationale: ప్రతిపాదన భావమున్న నిఫ్అల్ రూపాన్ని సహజమైన తెలుగు ఆహ్వాన రూపంలో వ్యక్తపరుస్తుంది.
- source_word: בֵּית הָאֱלֹהִים
  choice: దేవుని మందిరం
  rationale: దేవాలయ సముదాయానికి వాడిన హీబ్రూ పదబంధాన్ని గౌరవప్రదమైన, సాధారణ తెలుగు రూపంలో అందిస్తుంది.
- source_word: אֶל תּוֹךְ הַהֵיכָל
  choice: ఆలయం లోపల[a]
  rationale: הֵיכָל దేవాలయపు ప్రధాన పవిత్ర కట్టడాన్ని సూచించగలదు. ప్రధాన పాఠ్యంలో సులభంగా అర్థమయ్యే రూపం ఉంచి, మరింత నిర్దిష్టమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: וְנִסְגְּרָה דַּלְתוֹת הַהֵיכָל
  choice: ఆలయ తలుపులు మూసివేద్దాం
  rationale: కొనసాగుతున్న ప్రతిపాదన భావాన్ని, తలుపులు మూయడమనే స్పష్టమైన దృశ్యాన్ని సహజంగా నిలుపుతుంది.
- source_word: כִּי בָּאִים לְהָרְגֶךָ
  choice: ఎందుకంటే నిన్ను చంపడానికి వారు వస్తున్నారు
  rationale: అనిర్దిష్ట బహువచన కర్తను ‘వారు’గా చూపి, ఉద్దేశాన్ని నేరుగా అనువదిస్తుంది.
- source_word: וְלַיְלָה בָּאִים לְהָרְגֶךָ
  choice: రాత్రివేళ నిన్ను చంపడానికి వస్తున్నారు
  rationale: రాత్రి సమయాన్ని, మూలంలో ఉద్దేశపూర్వకంగా పునరుక్తమైన హెచ్చరికను నిలుపుతుంది; ‘ఈ రాత్రే’ అని మూలం కంటే ఎక్కువ నిర్దిష్టతను చేర్చదు.
theological_decisions:
- issue: పరిమిత ప్రవేశమున్న పవిత్ర స్థల సందర్భంలో הֵיכָל అనువాదం
  choice: ప్రధాన పాఠ్యంలో ‘ఆలయం’; పాదసూచికలో ‘పవిత్రస్థలం’
  alternative: ‘అంతరాలయం’ లేదా ‘పవిత్రస్థలం’ అని ప్రధాన పాఠ్యంలోనే ఇవ్వడం
  rationale: తదుపరి వచనంలోని నెహెమ్యా అభ్యంతరం పరిమిత ప్రవేశమున్న పవిత్ర ప్రాంతాన్ని సూచించినప్పటికీ, הֵיכָל అనే పదం స్వయంగా ‘ఆలయం’ లేదా మరింత నిర్దిష్టంగా ‘పవిత్రస్థలం’ అని అర్థమవుతుంది. ప్రధాన పాఠ్యం పదార్థ పరిధిని కుదించకుండా ఉంచి, సందర్భపరంగా ముఖ్యమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో సంరక్షిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. పేర్లు సాధారణ తెలుగు లిప్యంతరీకరణలో ఇచ్చాం. బెదిరింపు తీవ్రతను నిలుపడానికి చివరి వాక్యంలోని పునరుక్తిని తొలగించలేదు.
