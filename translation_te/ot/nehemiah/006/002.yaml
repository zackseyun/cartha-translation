source:
  edition: WLC
  text: וַ/יִּשְׁלַ֨ח סַנְבַלַּ֤ט וְ/גֶ֨שֶׁם֙ אֵלַ֣/י לֵ/אמֹ֔ר לְכָ֞/ה וְ/נִֽוָּעֲדָ֥ה יַחְדָּ֛ו בַּ/כְּפִירִ֖ים בְּ/בִקְעַ֣ת אוֹנ֑וֹ וְ/הֵ֨מָּה֙ חֹֽשְׁבִ֔ים לַ/עֲשׂ֥וֹת לִ֖/י רָעָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/002.yaml
  text: So Sanballat and Geshem sent to me[a], saying, “Come[b], and let us meet together in the villages in the plain of Ono.” But they were planning to do me harm.
translation:
  language: te
  text: 'అప్పుడు సన్బల్లటు, గెషెము నాకు ఇలా కబురు పంపారు: “రా, ఓనో మైదానంలోని[b] గ్రామాల్లో[a] మనం కలిసి కలుసుకుందాం.” అయితే వారు నాకు హాని చేయాలని పన్నాగం పన్నారు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఓనో మైదానంలోని కెఫిరీము అనే చోట.” హీబ్రూ పదాన్ని “గ్రామాలు” అనే సాధారణ నామవాచకంగా కాక స్థలనామంగా కూడా అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
  - marker: b
    text: “మైదానం”ను “లోయ” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: కబురు పంపారు
  rationale: తర్వాతి ‘ఇలా’ అనే ప్రత్యక్ష సందేశ పరిచయంతో కలిసి, తెలుగులో సహజంగా సందేశం పంపడాన్ని వ్యక్తపరుస్తుంది; సంయుక్త కర్తకు అనుగుణంగా బహువచన క్రియ వాడబడింది.
- source_word: סַנְבַלַּט וְגֶשֶׁם
  choice: సన్బల్లటు, గెషెము
  rationale: వ్యక్తి పేర్లను హీబ్రూ ఉచ్చారణకు సమీపంగా, తెలుగులో చదవడానికి అనుకూలంగా లిప్యంతరీకరించాం.
- source_word: לְכָה
  choice: రా
  rationale: మూల క్రియకు ‘వెళ్లు/నడువు’ అనే ప్రాథమిక భావం ఉన్నా, ఇక్కడ ఆహ్వాన సందర్భంలో తెలుగు ప్రత్యక్ష సంభాషణకు సహజమైన ‘రా’ సరిపోతుంది.
- source_word: וְנִוָּעֲדָה יַחְדָּו
  choice: మనం కలిసి సమావేశమవుదాం
  rationale: నియమించుకొని కలుసుకోవడం అనే నిఫల్ భావాన్నీ, ‘కలిసి’ అనే క్రియావిశేషణాన్నీ నిలుపుతుంది.
- source_word: בַּכְּפִירִים
  choice: గ్రామాల్లో
  rationale: ఈ రూపాన్ని సాధారణ నామవాచకమైన ‘గ్రామాలు/కుగ్రామాలు’గా తీసుకున్నాం; స్థలనామంగా తీసుకునే అవకాశాన్ని పాదసూచికలో ఉంచాం.
- source_word: בְּבִקְעַת אוֹנוֹ
  choice: ఓనో మైదానంలోని
  rationale: בִּקְעָה విశాలమైన లోయ లేదా మైదానాన్ని సూచిస్తుంది; ఈ భౌగోళిక సందర్భంలో ‘మైదానం’ సహజంగా ఉంది, ‘లోయ’ ప్రత్యామ్నాయాన్ని పాదసూచికలో తెలిపాం.
- source_word: וְהֵמָּה חֹשְׁבִים
  choice: అయితే వారు ... పన్నాగం పన్నుతున్నారు
  rationale: ఆహ్వానానికి విరుద్ధంగా ఉన్న వారి రహస్య ఉద్దేశాన్ని ‘అయితే’ స్పష్టం చేస్తుంది; חֹשְׁבִים ఇక్కడ కేవలం ఆలోచించడం కాక హాని తలపెట్టడం లేదా పథకం వేయడం.
- source_word: לַעֲשׂוֹת לִי רָעָה
  choice: నాకు హాని చేయాలని
  rationale: ఈ సందర్భంలో רָעָה నెహెమ్యాకు చేయదలచిన కీడు లేదా హానిని సూచిస్తుంది; హాని ఏ రూపంలో ఉండేదో అనవసరంగా నిర్దిష్టం చేయదు.
