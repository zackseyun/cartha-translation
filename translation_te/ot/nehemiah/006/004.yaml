translation:
  language: te
  text: వారు ఈ విధంగానే నాలుగుసార్లు నాకు సందేశం పంపారు[a]; నేను కూడా వారికి ఈ విధంగానే జవాబిచ్చాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: రెండు చోట్లా అక్షరార్థం ‘ఈ మాట ప్రకారం’ లేదా ‘ఈ విషయం ప్రకారం.’ సందర్భంలో, వారు ఇదే రీతిగా మళ్లీ సందేశం పంపడాన్ని, నెహెమ్యా కూడా ఇదే రీతిగా జవాబివ్వడాన్ని ఈ పదబంధం సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלְחוּ אֵלַי
  choice: వారు … నాకు పంపారు
  rationale: שׁלח అనే క్రియకు ‘పంపు’ అని అర్థం. పంపబడినది హీబ్రూలో స్పష్టంగా చెప్పకపోయినా, తరువాతి పదబంధం సమాచార మార్పిడిని సూచిస్తున్నందున తెలుగులో సహజంగా ‘సందేశాన్ని … పంపారు’ అని వ్యక్తీకరించబడింది.
- source_word: כַּדָּבָר הַזֶּה
  choice: ఇదే సందేశాన్ని
  rationale: ఈ పదబంధానికి అక్షరార్థంగా ‘ఈ మాట ప్రకారం’ అని అర్థం. సందర్భంలో ఇది ముందుగా పంపిన ఆహ్వానంలోని విషయాన్నే సూచిస్తుంది; అందువల్ల ‘ఇదే సందేశాన్ని’ అనేది సహజమైన సందర్భోచిత అనువాదం.
- source_word: אַרְבַּע פְּעָמִים
  choice: నాలుగుసార్లు
  rationale: నాలుగు సందర్భాల్లో పునరావృతమైన చర్యను తెలుగులో నేరుగా, సహజంగా తెలియజేస్తుంది.
- source_word: וָאָשִׁיב אוֹתָם
  choice: నేను వారికి … జవాబు ఇచ్చాను
  rationale: שׁוב క్రియ హిఫిల్ రూపంలో సమాచార సందర్భంలో ‘తిరిగి జవాబివ్వడం’ అనే భావాన్ని ఇస్తుంది. ‘జవాబు ఇచ్చాను’ ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: כַּדָּבָר הַזֶּה
  choice: ప్రతిసారీ అదే జవాబు
  rationale: మొదటి పదబంధం పునరావృతం కావడం ద్వారా నెహెమ్యా ప్రతి ప్రయత్నానికీ ముందటిలాగే సమాధానమిచ్చాడనే భావం వస్తుంది. ‘ప్రతిసారీ అదే జవాబు’ ఆ పునరావృత భావాన్ని స్పష్టంగా, సహజంగా అందిస్తుంది.
