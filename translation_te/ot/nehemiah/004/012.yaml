translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ఆయుధాన్ని నడుముకు కట్టుకొని నిర్మాణ పని కొనసాగించిన భావం స్పష్టంగా ఉంచబడింది; ‘షోఫారు’ అనే సాంస్కృతికంగా నిర్దిష్టమైన పదానికి పాదటిప్పణి జోడించబడింది.
