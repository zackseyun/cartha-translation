  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הַ֨/בּוֹנִ֔ים אִ֥ישׁ חַרְבּ֛/וֹ אֲסוּרִ֥ים עַל מָתְנָ֖י/ו וּ/בוֹנִ֑ים וְ/הַ/תּוֹקֵ֥עַ בַּ/שּׁוֹפָ֖ר אֶצְלִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/012.yaml
  text: And the builders each had his sword strapped at his side while they built[a], and the one blowing the trumpet was beside me.
translation:
  language: te
  text: కట్టే పనివారిలో ప్రతి ఒక్కరూ తమ కత్తిని నడుముకు బిగించుకొని నిర్మాణం చేసేవారు; బాకా[a] ఊదేవాడు నా పక్కనే ఉండేవాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హెబ్రూ: “షోఫారు”; సాధారణంగా పొట్టేలు కొమ్ముతో చేసిన సంకేత వాద్యం.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבּוֹנִים / וּבוֹנִים
  choice: కట్టే పనివారు / పని చేసేవారు
  rationale: మొదటి కృదంతం వ్యక్తులను సూచిస్తూ ‘కట్టే పనివారు’ అనే అర్థమిస్తుంది; రెండవది వారు నిర్మాణ పనిని కొనసాగిస్తున్నారని తెలుపుతుంది. తెలుగులో సహజంగా ఉండేందుకు రెండవదాన్ని ‘పని చేసేవారు’గా ఇచ్చాం.
- source_word: אִישׁ
  choice: ప్రతి ఒక్కరూ
  rationale: ఇక్కడ ఈ పదం పనివారిలో ఒక్కొక్కరినీ విడివిడిగా సూచించే పంపిణీ భావంలో ఉంది.
- source_word: חַרְבּוֹ
  choice: తమ కత్తిని
  rationale: హెబ్రూ ఏకవచన పంపిణీ నిర్మాణాన్ని తెలుగులో సహజంగా వ్యక్తపరచడానికి ‘ప్రతి ఒక్కరూ తమ కత్తిని’ అని ఇచ్చాం.
- source_word: אֲסוּרִים עַל מָתְנָיו
  choice: నడుముకు బిగించుకొని
  rationale: అక్షరార్థంగా ‘నడుము మీద బంధించబడినది.’ కత్తిని ధరించి సిద్ధంగా ఉన్న దృశ్యాన్ని ‘నడుముకు బిగించుకొని’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: וְהַתּוֹקֵעַ בַּשּׁוֹפָר
  choice: బాకా ఊదేవాడు
  rationale: תקע కృదంతం ఊదుతూ ధ్వని చేయడాన్ని సూచిస్తుంది; שׁוֹפָר ప్రత్యేకంగా కొమ్ముతో చేసిన సంకేత వాద్యం. ప్రధాన పాఠంలో సాధారణ పాఠకులకు అర్థమయ్యే ‘బాకా’ను వాడి, నిర్దిష్ట వాద్యపేరును పాదటిప్పణిలో తెలిపాం.
- source_word: אֶצְלִי
  choice: నా పక్కనే
  rationale: వక్తకు అతి సమీపంలో ఉండడాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
