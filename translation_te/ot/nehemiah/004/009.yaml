id: NEH.4.9
reference: Nehemiah 4:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְהִ֞י כַּֽ/אֲשֶׁר שָׁמְע֤וּ אוֹיְבֵ֨י/נוּ֙ כִּי נ֣וֹדַֽע לָ֔/נוּ וַ/יָּ֥פֶר הָ/אֱלֹהִ֖ים אֶת עֲצָתָ֑/ם ו/נשוב כֻּלָּ֨/נוּ֙ אֶל הַ֣/חוֹמָ֔ה אִ֖ישׁ אֶל מְלַאכְתּֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/009.yaml
  text: And it happened that when our enemies heard that it had become known to us[a], and that God had frustrated their plan, we all returned to the wall[c][b], each man to his work.
translation:
  language: te
  text: మన శత్రువులు వారి పథకం మనకు తెలిసిపోయిందని, దేవుడు వారి పథకాన్ని భగ్నం చేశాడని విన్నప్పుడు, మేమందరం గోడ వద్దకు తిరిగి వెళ్లాం, ఎవరి పనికి వారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: విన్నప్పుడు
  rationale: హీబ్రూ కథనారంభ సూత్రం וַיְהִיను తెలుగులో విడిగా అనువదిస్తే కృత్రిమంగా ఉంటుంది; כַּאֲשֶׁרతో కూడిన కాలసంబంధాన్ని సహజమైన ఉపవాక్యంగా వ్యక్తం చేశాం.
- source_word: אוֹיְבֵינוּ
  choice: మన శత్రువులు
  rationale: మొదటి పురుష బహువచన ప్రత్యయంతో ఉన్న ‘మా/మన శత్రువులు’ అనే సరళమైన అర్థాన్ని సందర్భానుకూలంగా ఇస్తుంది.
- source_word: כִּי נוֹדַע לָנוּ
  choice: తమ పన్నాగం మనకు తెలిసిపోయిందని
  rationale: నిఫ్అల్ రూపంలోని ‘మనకు తెలిసింది/తెలిసిపోయింది’ అనే భావాన్ని నిలుపుతూ, సందర్భం ద్వారా సూచితమైన వారి పన్నాగాన్ని స్పష్టంగా కలిపాం.
- source_word: וַיָּפֶר הָאֱלֹהִים
  choice: దేవుడు ... భగ్నం చేశాడు
  rationale: הפר అంటే ఒక యోచనను విఫలం చేయడం లేదా భంగపరచడం; ‘భగ్నం చేశాడు’ ప్రత్యక్ష దైవక్రియను స్పష్టంగా నిలుపుతుంది.
- source_word: עֲצָתָם
  choice: వారి ఆలోచనను
  rationale: עֵצָהకు ‘ఆలోచన, యోచన, సలహా’ అనే అర్థవిస్తృతి ఉంది; శత్రువుల కార్యపథాన్ని సూచించేందుకు ‘ఆలోచన’ మూలంలోని కొంత విస్తృతతను కాపాడుతుంది.
- source_word: וְנָשׁוּב כֻּלָּנוּ אֶל הַחוֹמָה
  choice: మేమందరం గోడ దగ్గరికి తిరిగి వెళ్లి
  rationale: שׁוב యొక్క ‘తిరిగి వెళ్లడం’ భావాన్ని, כֻּלָּנוּ యొక్క సమగ్రతను సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אִישׁ אֶל מְלַאכְתּוֹ
  choice: ప్రతి ఒక్కరం తమతమ పనిలో నిమగ్నమయ్యాం
  rationale: హీబ్రూ విభజనాత్మక ప్రయోగం ‘ఒక్కొక్కరు తమ పనికి’ అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది; కార్యానికి తిరిగి వెళ్లిన భావం ప్రధాన క్రియతో కలిసి వ్యక్తమవుతుంది.
theological_decisions:
- issue: శత్రువుల ఆలోచన భగ్నం కావడానికి కర్త
  choice: దేవుడు వారి ఆలోచనను భగ్నం చేశాడు
  alternative: పరిస్థితుల వల్ల వారి పన్నాగం విఫలమైంది
  rationale: హీబ్రూ పాఠం దేవుణ్ణే ప్రత్యక్ష కర్తగా పేర్కొంటుంది; ఆ దైవకార్య సూచనను పరోక్షం చేయలేదు.
- issue: אִישׁ అనే పుంలింగ విభజనాత్మక పదం
  choice: ప్రతి ఒక్కరం తమతమ పనిలో
  alternative: ప్రతి పురుషుడు తన పనికి
  rationale: ఇక్కడ אישׁ కార్మికులను ఒక్కొక్కరిగా సూచించే విభజనాత్మక ప్రయోగం. తెలుగులో ‘ప్రతి పురుషుడు’ అనడం అసహజం మరియు అవసరానికి మించిన లింగ ఉద్ఘాటన అవుతుంది; ‘ప్రతి ఒక్కరం’ సంఖ్యాత్మక భావాన్ని కచ్చితంగా అందిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే కథనశైలి. అవసరం లేని ప్రాచీన సంధానపదాలను నివారించాం.
