  text: So we prayed to our God and stationed a guard against them day and night because of them[a][b].
translation:
  language: te
  text: కాబట్టి మేము మా దేవునికి ప్రార్థించాము; వారి కారణంగా వారికి వ్యతిరేకంగా పగలూ రాత్రీ కావలిని నియమించాము.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వారికి ఎదురుగా కాపలాను ఉంచాము.’
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘వారి ఎదుట నుండి’; ఇక్కడ ‘వారి కారణంగా’ లేదా ‘వారిని బట్టి’ అనే భావం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנִּתְפַּלֵּל
  choice: మేము ప్రార్థించి
  rationale: פלל హిత్పయేల్ రూపం సాధారణంగా ‘ప్రార్థించు’ అని అర్థం. మూలంలో లేని తీవ్రతను చేర్చకుండా సహజమైన తెలుగు రూపాన్ని వాడాం.
- source_word: אֶל אֱלֹהֵינוּ
  choice: మా దేవునికి
  rationale: אֶל యొక్క దిశార్థాన్ని తెలుగు చతుర్థీ విభక్తి సహజంగా తెలియజేస్తుంది; אֱלֹהֵינוּ లోని ప్రథమ పురుష బహువచన సంబంధాన్ని ‘మా’గా నిలిపాం.
- source_word: וַנַּעֲמִיד
  choice: పెట్టాము
  rationale: עמד హిఫీల్ ఇక్కడ ఒకరిని లేదా ఒక బృందాన్ని నిర్దిష్ట స్థానంలో నిలిపే భావం కలిగి ఉంది. ‘కాపలా పెట్టాము’ అనేది ఆధునిక తెలుగులో సహజమైన సైనిక/రక్షణ ప్రయోగం.
- source_word: מִשְׁמָר
  choice: కాపలా
  rationale: ఈ పదం కాపలా, కావలి లేదా కాపలా బృందాన్ని సూచించగలదు. తెలుగు ‘కాపలా’ ఆ కార్యాన్ని సహజంగా తెలియజేస్తూ సామూహిక భావానికీ వీలు ఇస్తుంది.
- source_word: עֲלֵיהֶם
  choice: వారికి ఎదురుగా
  rationale: עַל యొక్క ప్రాథమిక సంబంధార్థాన్ని, శత్రుత్వ సందర్భంలోని ప్రతిఘటన భావాన్ని కలిపి తెలియజేస్తుంది; కాపలాను వారిపై నియమించారనే అసహజ భావాన్ని నివారిస్తుంది.
- source_word: יוֹמָם וָלַיְלָה
  choice: పగలూ రాత్రీ
  rationale: నిరంతర అప్రమత్తతను సూచించే ఈ జంటకు ఇది సహజమైన ఆధునిక తెలుగు సమానం.
- source_word: מִפְּנֵיהֶם
  choice: వారి కారణంగా
  rationale: అక్షరార్థంగా ‘వారి సన్నిధి నుండి/వారి ఎదుటనుండి’; సందర్భంలో కాపలా పెట్టడానికి కారణాన్ని సూచిస్తుంది. మూలంలో స్పష్టంగా లేని ‘భయం’ అనే ఉద్దేశాన్ని చేర్చకుండా కారణార్థాన్ని నిలిపాం.
theological_decisions:
- issue: వ్యతిరేకతకు ప్రతిస్పందన
  choice: దేవునికి ప్రార్థించడం, ఆచరణాత్మకంగా కాపలా పెట్టడం—రెండింటినీ సమన్విత చర్యలుగా ఉంచాం.
  alternative: ప్రార్థనకే ప్రాధాన్యం ఇవ్వడం లేదా సైనిక సన్నద్ధతకే ప్రాధాన్యం ఇవ్వడం.
  rationale: హీబ్రూ వాక్యం రెండు చర్యలనూ సమన్వయ అవ్యయంతో వరుసగా చెబుతుంది. ఆధ్యాత్మిక విశ్వాసం మరియు ఆచరణాత్మక రక్షణ మధ్య ఉన్న ఉద్వేగాన్ని పరిష్కరించకుండా అనువాదం నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. ‘మా దేవుడు’ అనే సంబంధభావం, ప్రార్థనతో పాటు రక్షణ చర్య, అలాగే కారణార్థంలోని స్వల్ప సందిగ్ధత నిలుపబడ్డాయి.
