source:
  edition: WLC
  text: וָ/אֵ֣רֶא וָ/אָק֗וּם וָ/אֹמַ֞ר אֶל הַ/חֹרִ֤ים וְ/אֶל הַ/סְּגָנִים֙ וְ/אֶל יֶ֣תֶר הָ/עָ֔ם אַל תִּֽירְא֖וּ מִ/פְּנֵי/הֶ֑ם אֶת אֲדֹנָ֞/י הַ/גָּד֤וֹל וְ/הַ/נּוֹרָא֙ זְכֹ֔רוּ וְ/הִֽלָּחֲמ֗וּ עַל אֲחֵי/כֶם֙ בְּנֵי/כֶ֣ם וּ/בְנֹתֵי/כֶ֔ם נְשֵׁי/כֶ֖ם וּ/בָתֵּי/כֶֽם־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/008.yaml
  text: Then I looked[a], rose up, and said to the nobles, to the officials, and to the rest of the people, “Do not be afraid of them. Remember the Lord, who is great and fearsome, and fight for your brothers, your sons, your daughters, your wives[b], and your houses.”
translation:
  language: te
  text: 'అప్పుడు నేను చూసి లేచి, ఉన్నతులతో, అధికారులతో, మిగిలిన ప్రజలతో ఇలా అన్నాను: “వారికి భయపడకండి. గొప్పవాడూ భయానకుడైన[a] ప్రభువును జ్ఞాపకం చేసుకోండి. మీ సోదరుల[b] కోసం, మీ కుమారుల కోసం, మీ కుమార్తెల కోసం, మీ భార్యల కోసం, మీ ఇళ్ల కోసం పోరాడండి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “విస్మయభరితుడైన.” హీబ్రూ విశేషణం భయాన్నీ విస్మయాన్నీ కలిగించేదాన్ని సూచించగలదు; ఇక్కడ “భయానకుడైన” అనే పదం ఆ బలమైన భావాన్ని వ్యక్తం చేస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: “సోదరులు” అని అనువదించిన హీబ్రూ పదం పుంలింగ బహువచన బంధుత్వ పదం. ఆ తర్వాత కుమారులు, కుమార్తెలు, భార్యలు విడిగా పేర్కొనబడ్డారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֵרֶא
  choice: అప్పుడు నేను చూసి
  rationale: ראה అనే క్రియలోని ‘చూడటం/గమనించడం’ అనే ప్రత్యక్ష భావాన్ని నిలుపుతూ, వరుసగా వచ్చే చర్యలకు సహజమైన తెలుగు అనుసంధానాన్ని ఇస్తుంది.
- source_word: וָאָקוּם
  choice: లేచి
  rationale: קום ఇక్కడ నిర్ణయాత్మకంగా కార్యానికి పూనుకోవడాన్ని సూచిస్తుంది; ‘లేచి’ సహజంగా ఉండి కథన వేగాన్ని నిలుపుతుంది.
- source_word: הַחֹרִים
  choice: ఉన్నతులతో
  rationale: సామాజిక హోదా కలిగిన నాయకులను సూచించే పదం. ‘ఉన్నతులు’ ఆధునిక తెలుగులో ఆ హోదాను సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: הַסְּגָנִים
  choice: అధికారులతో
  rationale: పరిపాలనా బాధ్యత కలిగిన ఉపపాలకులు లేదా అధికారులను సూచిస్తుంది; ‘అధికారులు’ స్పష్టమైన, సాధారణ ఆధునిక పదం.
- source_word: יֶתֶר הָעָם
  choice: మిగిలిన ప్రజలతో
  rationale: ముందు పేర్కొన్న నాయకులకంటే వేరుగా ఉన్న మిగతా ప్రజలను యథార్థంగా సూచిస్తుంది.
- source_word: אַל תִּירְאוּ מִפְּנֵיהֶם
  choice: వారికి భయపడకండి
  rationale: విరోధుల ఎదుట భయపడవద్దనే నిషేధాన్ని సహజమైన తెలుగులో నేరుగా వ్యక్తం చేస్తుంది.
- source_word: אֶת אֲדֹנָי
  choice: ప్రభువును
  rationale: ఇక్కడ ఉన్నది יהוה అనే నామం కాదు, אֲדֹנָי అనే దైవ బిరుదు; అందువల్ల ‘ప్రభువు’ సముచితమైన భేదాన్ని కాపాడుతుంది.
- source_word: הַגָּדוֹל וְהַנּוֹרָא
  choice: గొప్పవాడూ భయభక్తులు పుట్టించేవాడూ అయిన
  rationale: נוֹרָאలోని విస్మయం, భయం, గౌరవం కలిగించే బలమైన భావాన్ని ‘అద్భుతమైన’ అని బలహీనపరచకుండా, ‘భయంకరుడు’ అనే కేవలం ప్రతికూల భావానికీ పరిమితం చేయకుండా వ్యక్తం చేస్తుంది.
- source_word: זְכֹרוּ
  choice: జ్ఞాపకం చేసుకోండి
  rationale: ఆయన ఎవరో, ఆయన మహిమ ఏమిటో చైతన్యపూర్వకంగా మనస్సుకు తెచ్చుకోవాలనే ఆజ్ఞాత్మక భావాన్ని నిలుపుతుంది.
- source_word: וְהִלָּחֲמוּ עַל
  choice: కోసం పోరాడండి
  rationale: עַלతో ఉన్న సందర్భార్థం ఇతరుల రక్షణార్థం పోరాడటాన్ని సూచిస్తుంది; ‘కోసం పోరాడండి’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: אֲחֵיכֶם
  choice: మీ సోదరుల
  rationale: హీబ్రూ పదం వ్యాకరణపరంగా పుంలింగ బహువచన బంధుత్వ పదం; వెంటనే కుమారులు, కుమార్తెలు, భార్యలు వేరుగా పేర్కొనబడినందున దాన్ని విస్తరించకుండా ఉంచింది.
- source_word: בְּנֵיכֶם וּבְנֹתֵיכֶם נְשֵׁיכֶם וּבָתֵּיכֶם
  choice: మీ కుమారుల కోసం, మీ కుమార్తెల కోసం, మీ భార్యల కోసం, మీ ఇళ్ల కోసం
  rationale: మూలంలోని నిర్దిష్టమైన, క్రమంగా పెరుగుతున్న జాబితాను అలాగే ఉంచుతుంది. ‘ఇళ్లు’ నివాసాలను సూచిస్తూ సందర్భానుసారం గృహస్థులను కూడా మనస్సుకు తెస్తుంది.
theological_decisions:
- issue: אֲדֹנָי అనే దైవ బిరుదు అనువాదం
  choice: ప్రభువు
  alternative: యజమాని
  rationale: ఇది దేవునికి వాడిన బిరుదు; יהוה అనే ప్రత్యేక నామంతో గందరగోళం కలగకుండా, తెలుగు దైవ బిరుదుగా స్థిరమైన ‘ప్రభువు’ను ఉపయోగించింది.
- issue: הַנּוֹרָאలోని భయం–విస్మయం ఉద్వేగం
  choice: భయభక్తులు పుట్టించేవాడు
  alternative: భయంకరుడు; విస్మయం కలిగించేవాడు
  rationale: మనుషులకు భయపడవద్దనే ఆజ్ఞకు ఎదురుగా దేవుడు భయం, గౌరవం, విస్మయం కలిగించేవాడని వచనం ఉంచే ఉద్దేశపూర్వక ఉద్వేగాన్ని ఈ రూపం కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, నేరుగా ఉద్బోధించే శైలిని ఉపయోగించింది. ఆజ్ఞల తీవ్రతను నిలుపుతూ కృత్రిమమైన ప్రాచీన పదజాలాన్ని నివారించింది. ‘భయభక్తులు పుట్టించేవాడు’ కొద్దిగా వివరణాత్మకమైనప్పటికీ, మూలంలోని awe/dread ద్వంద్వార్థాన్ని సహజంగా కాపాడుతుంది.
