review_pass:
  verdict: revise
  source_fidelity: The draft preserves the principal lexical senses, but its Telugu clause order makes the temporal expression appear to govern the adversaries' lack of awareness only after the attackers have completed their actions. In the Hebrew, the adversaries state that the people will not know or see until the attackers come among them, kill them, and stop the work.
  naturalness: The individual expressions are modern and clear. Reordering the sentence so that 'వారికి తెలియదు, వారు చూడరు' precedes the temporal clause gives a more natural Telugu representation of the Hebrew threat and avoids momentary ambiguity.
  terminology: ‘మా శత్రువులు,’ ‘వారి మధ్యలోకి,’ ‘చంపి,’ and ‘ఆ పనిని ఆపివేసే’ accurately and naturally render the relevant terms. The footnote appropriately supplies the lexical alternative for ‘వారి మధ్యలోకి.’
  issues:
  - severity: medium
    issue: Temporal clause placement obscures the scope of ‘until.’
    rationale: The draft begins with the attackers’ actions and ends with ‘...అంతవరకు వారికి తెలియదు, వారు చూడరు,’ which can be read as saying that the victims will not know or see only up to the completion of the killing and stopping. Placing the awareness clauses first more clearly follows the Hebrew sequence and preserves the intended threat.
  revised_text: 'మా శత్రువులు ఇలా అన్నారు: “మేము వారి మధ్యలోకి[a] వచ్చి, వారిని చంపి, ఆ పనిని ఆపివేసేంతవరకు వారికి తెలియదు, వారు చూడరు.”'
  revised_footnotes:
  - marker: a
    text: లేదా, “వారి మధ్యకు.”
    reason: lexical_alternative
  revision_rationale: The revision retains all of the draft’s lexical choices and the Hebrew ‘know/see’ parallelism, while placing the negative awareness clauses before the temporal limit in a clearer Telugu syntactic order. No doctrinal or interpretive expansion has been introduced.
