id: NEH.4.5
reference: Nehemiah 4:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּאמְר֣וּ צָרֵ֗י/נוּ לֹ֤א יֵדְעוּ֙ וְ/לֹ֣א יִרְא֔וּ עַ֛ד אֲשֶׁר נָב֥וֹא אֶל תּוֹכָ֖/ם וַ/הֲרַגְנ֑וּ/ם וְ/הִשְׁבַּ֖תְנוּ אֶת הַ/מְּלָאכָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/005.yaml
  text: And our adversaries said[a], “They will not know, and they will not see, until we come into their midst and kill them and stop the work.”
translation:
  language: te
  text: 'మా శత్రువులు ఇలా అన్నారు: “మేము వారి మధ్యలోకి[a] వచ్చి, వారిని చంపి, ఆ పనిని ఆపివేసేంతవరకు వారికి తెలియదు, వారు చూడరు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారి మధ్యకు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: צָרֵינוּ
  choice: మా శత్రువులు
  rationale: צַר శత్రుత్వంతో ఎదిరించేవారిని సూచిస్తుంది. సందర్భంలోని ప్రాణాంతక కుట్రకు ‘శత్రువులు’ సహజమైన, స్పష్టమైన తెలుగు పదం.
- source_word: יֵדְעוּ
  choice: వారికి తెలియదు
  rationale: יָדַע ఇక్కడ తెలుసుకోవడం లేదా విషయం గ్రహించడం అనే భావంలో ఉంది. ‘తెలియదు’ మూలంలోని సాధారణ పదప్రయోగాన్ని నిలుపుతుంది.
- source_word: יִרְאוּ
  choice: వారు చూడరు
  rationale: רָאָה యొక్క ప్రత్యక్ష అర్థం ‘చూడు.’ దీనిని అలాగే ఉంచడం ‘తెలియదు—చూడరు’ అనే హెబ్రీ సమాంతరతను కాపాడుతుంది; సందర్భంలో గమనించకపోవడం అనే భావం కూడా స్పష్టమవుతుంది.
- source_word: עַד אֲשֶׁר
  choice: …అంతవరకు
  rationale: ఈ పదబంధం కాలపరమైన హద్దును సూచిస్తుంది. తెలుగులో ప్రతికూల వాక్యంతో ‘అంతవరకు’ సహజంగా ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: נָבוֹא
  choice: మేము … వచ్చి
  rationale: בּוֹא రావడం లేదా ప్రవేశించడం అనే విస్తృత భావం కలిగి ఉంది. తరువాతి స్థలసూచక పదబంధంతో ‘వచ్చి’ సహజంగా సరిపోతుంది.
- source_word: אֶל תּוֹכָם
  choice: వారి మధ్యలోకి
  rationale: תּוֹךְ మధ్యభాగం లేదా నడుమును సూచిస్తుంది; אֶל తో కలిసి లోపలికి చొచ్చుకురావడం అనే దిశాభావం ఉంది. ‘వారి మధ్యలోకి’ ఆ స్థలార్థాన్నీ దాడి బెదిరింపునీ నిలుపుతుంది.
- source_word: וַהֲרַגְנוּם
  choice: వారిని చంపి
  rationale: הָרַג యొక్క సూటి అర్థం చంపడం. ‘చంపి’ మూలంలోని కఠినమైన, ప్రత్యక్ష బెదిరింపును యథాతథంగా తెలియజేస్తుంది.
- source_word: וְהִשְׁבַּתְנוּ
  choice: ఆపివేసి
  rationale: שׁבת యొక్క హిఫీల్ రూపం ఏదో ఒకదాన్ని నిలిచిపోయేలా చేయడం అనే భావం ఇస్తుంది. ‘ఆపివేసి’ తెలుగులో ఆ కారణార్థాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: הַמְּלָאכָה
  choice: ఆ పని
  rationale: מְלָאכָה ఇక్కడ పునర్నిర్మాణ కార్యాన్ని సూచిస్తుంది. ముందున్న సందర్భంలో నిర్దిష్టమైన పనిని సూచించడానికి ‘ఆ పని’ సహజంగా ఉంటుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా సూటిగా అనువదించబడింది. ‘తెలియదు, వారు చూడరు’ అనే హెబ్రీ సమాంతరతను ఉద్దేశపూర్వకంగా నిలుపుతూ, బెదిరింపు యొక్క ప్రత్యక్ష స్వరాన్ని మృదువుపరచలేదు.
