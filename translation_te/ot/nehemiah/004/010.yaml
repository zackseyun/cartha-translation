- from: ఆ రోజు మొదలుకొని[a], నా యువకుల్లో సగం మంది పనిలో నిమగ్నమయ్యారు; మిగతా సగం మంది ఈటెలు, డాళ్లు, విల్లు, కవచాలు[b] పట్టుకున్నారు. అధికారులు యూదా వంశమంతటి వెనుక ఉన్నారు[c].
  to: ఆ రోజు మొదలుకొని[a], నా యువకుల్లో సగం మంది పని చేస్తూ ఉన్నారు; మిగతా సగం మంది ఈటెలు, డాళ్లు, విల్లులు, కవచాలు[b] పట్టుకుని ఉన్నారు. అధికారులు యూదా వంశమంతటికీ వెనుకగా ఉన్నారు[c].
  rationale: సవరణలు మూలంలోని కొనసాగుతున్న చర్యలను ప్రతిబింబిస్తాయి, ‘యూదా వంశమంతటి వెనుక’ అనే అసహజ నిర్మాణాన్ని సహజమైన తెలుగు స్థలవ్యక్తీకరణగా మార్చుతాయి, మరియు పాదసూచికలో మూలం చెప్పని ‘నిలబడటం’ అనే భంగిమను తొలగిస్తాయి. వివాదాస్పదమైన నַעַר మరియు బֵּית יְהוּדָה అర్థాల ప్రత్యామ్నాయాలను పాదసూచికలు మరియు సమష్టి పదప్రయోగం ద్వారా కాపాడాం.
