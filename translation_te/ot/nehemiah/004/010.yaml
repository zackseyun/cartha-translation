    rationale: మూలపాఠ్యంలో అధికారులు ‘నిలిచారు’ అనే క్రియ లేదు; వారు వెనుక ఉన్నారని మాత్రమే ఉంది. పాదసూచికలో కూడా ఆ అదనపు సూచనను నివారించాలి.
