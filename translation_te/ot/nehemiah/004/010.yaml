id: NEH.4.10
reference: Nehemiah 4:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְהִ֣י מִן הַ/יּ֣וֹם הַ/ה֗וּא חֲצִ֣י נְעָרַ/י֮ עֹשִׂ֣ים בַּ/מְּלָאכָה֒ וְ/חֶצְיָ֗/ם מַחֲזִיקִים֙ וְ/הָ/רְמָחִ֣ים הַ/מָּגִנִּ֔ים וְ/הַ/קְּשָׁת֖וֹת וְ/הַ/שִּׁרְיֹנִ֑ים וְ/הַ֨/שָּׂרִ֔ים אַחֲרֵ֖י כָּל בֵּ֥ית יְהוּדָֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/010.yaml
  text: And from that day on[a], half of my young men were doing the work, and half of them were holding the spears, the shields, the bows, and the armor[c][b]; and the officers were behind all the house of Judah.
translation:
  language: te
  text: ఆ రోజు మొదలుకొని[a], నా యువకుల్లో సగం మంది పని చేస్తూ ఉన్నారు; మిగతా సగం మంది ఈటెలు, డాళ్లు, విల్లులు, కవచాలు[b] పట్టుకుని ఉన్నారు. అధికారులు యూదా వంశమంతటికీ వెనుకగా ఉన్నారు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నా యువకులు’ అనే హీబ్రూ పదానికి ‘నా సేవకులు’ లేదా ‘నా పరివారంలోని సహాయకులు’ అనే అర్థాలు కూడా ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘కవచాలు’ అంటే శరీరాన్ని రక్షించే కవచాలు; ‘జాలికవచాలు’ లేదా ‘వక్షఃకవచాలు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: అధికారులు యూదా వంశమంతటికీ ‘వెనుకగా ఉన్నారు’ అనేది, వారు పనివారికి సైనిక సహాయంగా లేదా పర్యవేక్షణకై వెనుక ఉన్నారని సూచించవచ్చు.
    reason: cultural_note
lexical_decisions:
- source_word: נְעָרַי
  choice: నా యువకులు
  rationale: ఈ పదం యువకులు, సేవకులు లేదా పరివారంలోని సహాయకులను సూచించవచ్చు. సైనిక-నిర్మాణ సందర్భంలో ‘నా యువకులు’ మూలపదంలోని వయస్సు భావాన్ని నిలుపుతూ సహజంగా ఉంది; ఇతర సాధ్యార్థాలను పాదసూచికలో ఇచ్చాం.
- source_word: עֹשִׂים בַּמְּלָאכָה
  choice: పనిలో నిమగ్నమయ్యారు
  rationale: నిర్మాణ కార్యంలో చురుకుగా పాల్గొంటున్నారనే భావాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: מַחֲזִיקִים
  choice: పట్టుకున్నారు
  rationale: ఆయుధాలను పట్టుకొని సిద్ధంగా ఉండడాన్ని నేరుగా తెలియజేస్తుంది; ‘ఆయుధాలు ధరించారు’ వంటి వ్యాఖ్యానాత్మక విస్తరణను నివారిస్తుంది.
- source_word: הָרְמָחִים
  choice: ఈటెలు
  rationale: רֹמַח అనే సాధారణ పొడవైన గుచ్చే ఆయుధానికి సులభంగా అర్థమయ్యే తెలుగు పదం.
- source_word: הַמָּגִנִּים
  choice: డాళ్లు
  rationale: మָגֵן అనే రక్షణ సాధనానికి ఆధునిక ప్రామాణిక తెలుగులో స్పష్టమైన పదం.
- source_word: הַקְּשָׁתוֹת
  choice: విల్లు
  rationale: కֶשֶׁת యొక్క బహువచన ఆయుధ జాబితాను సహజ తెలుగు సామూహిక రూపంలో అందిస్తుంది.
- source_word: הַשִּׁרְיֹנִים
  choice: కవచాలు
  rationale: శరీరాన్ని రక్షించే కవచాన్ని సూచించే విస్తృతమైన, ఖచ్చితమైన పదం; నిర్దిష్టంగా జాలికవచం లేదా వక్షఃకవచం అని నిర్ణయించదు.
- source_word: הַשָּׂרִים
  choice: అధికారులు
  rationale: ఈ సైనిక-పరిపాలనా సందర్భంలో నాయకత్వ బాధ్యత గలవారిని సూచిస్తుంది; ‘రాజకుమారులు’ అనే అనవసర రాజవంశ భావాన్ని నివారిస్తుంది.
- source_word: אַחֲרֵי כָּל בֵּית יְהוּדָה
  choice: యూదా వంశమంతటి వెనుక
  rationale: אַחֲרֵי యొక్క స్థలార్థమైన ‘వెనుక’ను, בֵּית יְהוּדָה యొక్క సమష్టి/వంశార్థాన్ని నిలుపుతుంది; వారు సహాయంగా లేదా పర్యవేక్షణకై ఉన్నారనే భావాన్ని ప్రధాన పాఠ్యంలో నిర్ధారించదు.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన శైలి వాడబడింది. మూలంలో ‘నిలిచారు’ అనే క్రియ స్పష్టంగా లేకపోవడంతో ‘వెనుక ఉన్నారు’ అని అనువదించాం. ఆయుధాల జాబితా, సగం–సగం నిర్మాణం, ‘యూదా వంశం’ అనే సమష్టి వ్యక్తీకరణ నిలుపబడ్డాయి.
