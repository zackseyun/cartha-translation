translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే వాక్య నిర్మాణం వాడబడింది. హెబ్రీలోని וָאַעֲמִיד పునరుక్తిని రెండు వాక్యాల్లో ‘నిలబెట్టాను’గా నిలిపి, రక్షణ ఏర్పాట్ల ఉద్దేశపూర్వకతను కాపాడాం.
