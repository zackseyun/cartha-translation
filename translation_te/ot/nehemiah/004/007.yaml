  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וָֽ/אַעֲמִ֞יד מִֽ/תַּחְתִּיּ֧וֹת לַ/מָּק֛וֹם מֵ/אַחֲרֵ֥י לַ/חוֹמָ֖ה ב/צחחיים וָֽ/אַעֲמִ֤יד אֶת הָ/עָם֙ לְ/מִשְׁפָּח֔וֹת עִם חַרְבֹתֵי/הֶ֛ם רָמְחֵי/הֶ֖ם וְ/קַשְּׁתֹתֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/007.yaml
  text: Then I stationed men in the lowest parts of the place[a], behind the wall, in the exposed areas; and I stationed the people by families, with their swords, their spears, and their bows.
translation:
  language: te
  text: అప్పుడు నేను ఆ స్థలంలోని అత్యంత దిగువ భాగాల్లో[a], గోడ వెనుకనున్న బహిరంగ ప్రదేశాల్లో మనుష్యులను నిలబెట్టాను. ప్రజలను వారి కుటుంబాల ప్రకారం, వారి కత్తులతో, ఈటెలతో, విల్లులతో నిలబెట్టాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఆ స్థలంలోని దిగువ భాగాల్లో.’ ఇక్కడి హెబ్రీ పదబంధం దిగువన ఉన్న భాగాలను సూచిస్తుంది; దాని వెంట వచ్చే అరుదైన పదం కప్పులేని లేదా తెరచిన ప్రదేశాలను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאַעֲמִיד
  choice: నిలబెట్టాను
  rationale: עמד హిఫీల్ రూపం ఇక్కడ ప్రజలను రక్షణ స్థానాల్లో నియమించి నిలబెట్టడాన్ని సూచిస్తుంది. ‘నిలబెట్టాను’ సహజమైన తెలుగులో కారణార్థక భావాన్నీ సైనిక సందర్భాన్నీ అందిస్తుంది.
- source_word: מִתַּחְתִּיּוֹת לַמָּקוֹם
  choice: ఆ స్థలంలోని అత్యంత దిగువ భాగాల్లో
  rationale: תחת నుంచి వచ్చిన బహువచన రూపం దిగువ లేదా అత్యంత దిగువ ప్రాంతాలను సూచిస్తుంది; מקום సాధారణంగా స్థలం. ఈ అనువాదం భౌగోళిక భావాన్ని అతిగా వ్యాఖ్యానించకుండా నిలుపుతుంది.
- source_word: מֵאַחֲרֵי לַחוֹמָה
  choice: గోడ వెనుకనున్న
  rationale: ఈ పదబంధం గోడకు వెనుక లేదా దాని వెనుకవైపు ఉన్న స్థానాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: בצחחיים
  choice: బహిరంగ ప్రదేశాల్లో
  rationale: అరుదైన ఈ పదం కప్పులేని, తెరచిన లేదా దాడికి బహిర్గతమైన ప్రదేశాలను సూచించే అవకాశం ఉంది. ప్రధాన పాఠంలో సహజమైన ‘బహిరంగ ప్రదేశాలు’ను వాడి, అనిశ్చితిని పాదసూచికలో తెలిపాం.
- source_word: לְמִשְׁפָּחוֹת
  choice: వారి కుటుంబాల ప్రకారం
  rationale: משפחה కుటుంబ సమూహం లేదా వంశగుంపును సూచించగలదు. ‘కుటుంబాల ప్రకారం’ సాధారణ పాఠకులకు స్పష్టంగా ఉండి, సమూహాల వారీగా చేసిన అమరికను తెలియజేస్తుంది.
- source_word: חַרְבֹתֵיהֶם רָמְחֵיהֶם וְקַשְּׁתֹתֵיהֶם
  choice: వారి కత్తులతో, ఈటెలతో, విల్లులతో
  rationale: మూడు ఆయుధాల జాబితాను హెబ్రీ క్రమంలోనే స్పష్టమైన ఆధునిక తెలుగు పదాలతో నిలిపాం.
