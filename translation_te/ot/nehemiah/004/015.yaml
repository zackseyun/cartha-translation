  edition: WLC
  text: וַ/אֲנַ֖חְנוּ עֹשִׂ֣ים בַּ/מְּלָאכָ֑ה וְ/חֶצְיָ֗/ם מַחֲזִיקִים֙ בָּֽ/רְמָחִ֔ים מֵ/עֲל֣וֹת הַ/שַּׁ֔חַר עַ֖ד צֵ֥את הַ/כּוֹכָבִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/015.yaml
  text: So we kept doing the work[a], while half of them held the spears from the rising of the dawn until the coming out of the stars.
translation:
  language: te
  text: అలా మేము పని చేస్తూనే ఉన్నాం; వారిలో సగం మంది ఉషస్సు ఉదయించినప్పటి నుండి నక్షత్రాలు కనిపించే వరకు[a] ఈటెలు పట్టుకొని ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా మరింత సహజంగా, “పొద్దుపొడిచినప్పటి నుండి నక్షత్రాలు కనిపించే వరకు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹשִׂים
  choice: పని చేస్తూనే ఉన్నాం
  rationale: వర్తమాన కృదంతం సందర్భంలో కొనసాగుతున్న చర్యను సూచిస్తుంది; ఈ రూపం ఆ నిరంతర భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בַּמְּלָאכָה
  choice: పని
  rationale: מְלָאכָה సాధారణంగా ‘పని’ లేదా ‘శ్రమ’ అని అర్థం; గోడ పునర్నిర్మాణ సందర్భం నుంచే స్పష్టమవుతుంది కాబట్టి అనవసరంగా మరింత నిర్దిష్టం చేయలేదు.
- source_word: וְחֶצְיָם
  choice: వారిలో సగం మంది
  rationale: ఇది పని కొనసాగుతుండగా సమాంతరంగా మరో సగం మంది ఆయుధాలు పట్టుకున్నారని తెలియజేస్తుంది.
- source_word: מַחֲזִיקִים
  choice: పట్టుకొని ఉన్నారు
  rationale: కృదంత రూపంలోని కొనసాగుతున్న స్థితిని సహజంగా తెలియజేస్తూ, ఈటెలను తమ వద్ద సిద్ధంగా ఉంచుకున్న భావాన్ని నిలుపుతుంది.
- source_word: בָּרְמָחִים
  choice: ఈటెలు
  rationale: רֹמַח పొడవైన యుద్ధాయుధమైన ఈటెను సూచిస్తుంది; ఆధునిక సాధారణ తెలుగులో ‘ఈటె’ స్పష్టమైన పదం.
- source_word: מֵעֲלוֹת הַשַּׁחַר
  choice: తెల్లవారుజాము పైకి లేచినప్పటి నుంచి
  rationale: మూలంలోని ‘ఉషస్సు పైకి లేవడం’ అనే చిత్రాత్మక భావాన్ని సాధ్యమైనంత సహజంగా నిలుపుతుంది.
- source_word: עַד צֵאת הַכּוֹכָבִים
  choice: నక్షత్రాలు వెలువడే వరకు
  rationale: ‘నక్షత్రాలు బయటికి రావడం/కనిపించడం’ అనే మూలభాషలోని స్పష్టమైన దృశ్యాన్ని కాపాడుతుంది; కేవలం ‘రాత్రి వరకు’ అని వ్యాఖ్యానాత్మకంగా మార్చలేదు.
