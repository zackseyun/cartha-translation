  source_fidelity: 'ప్రధాన అనువాదం హీబ్రూ వాక్యంలోని ప్రధాన అంశాలను విశ్వసనీయంగా ప్రతిబింబిస్తోంది: సమీపంలో నివసించే యూదులు రావడం, పదిసార్లు హెచ్చరించడం, అన్ని చోట్లనుంచి/దిశలనుంచి ముప్పు ఉందనే భావం, అలాగే ‘మన మీదికి’ అనే శత్రుత్వ భావం అన్నీ నిలిచాయి. చివరి సంబంధవాక్యంలోని שׁוב అర్థం సందిగ్ధమైనది; ప్రధాన పాఠ్యంలోని ‘ఎటు తిరిగినా’ అనేది సందర్భానుకూలమైన, జాగ్రత్తగల పరిష్కారం. అయితే పాదటిప్పణి aలో ఉన్న ప్రత్యామ్నాయ అనువాదం ‘ఎక్కడి నుండి తిరిగి వచ్చినా’ హీబ్రూ సంబంధాన్ని సరిగా చూపదు; ‘ఎక్కడికి తిరిగి వెళ్లినా’/‘ఎక్కడ తిరిగినా’ అనే రూపమే సరైన ప్రత్యామ్నాయం.'
