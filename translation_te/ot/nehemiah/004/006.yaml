  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే చారిత్రక కథనానికి తగిన గౌరవప్రదమైన శైలిలో అనువదించబడింది. క్లిష్టమైన హీబ్రూ చివరి భాగాన్ని ప్రధాన పాఠ్యంలో సుసంబద్ధంగా ఇచ్చి, దాని నిజమైన పదార్థ సందిగ్ధతను పాదటిప్పణుల్లో నిలిపాం.
