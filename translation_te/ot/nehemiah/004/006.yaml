language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַֽ/יְהִי֙ כַּ/אֲשֶׁר בָּ֣אוּ הַ/יְּהוּדִ֔ים הַ/יֹּשְׁבִ֖ים אֶצְלָ֑/ם וַ/יֹּ֤אמְרוּ לָ֨/נוּ֙ עֶ֣שֶׂר פְּעָמִ֔ים מִ/כָּל הַ/מְּקֹמ֖וֹת אֲשֶׁר תָּשׁ֥וּבוּ עָלֵֽי/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/006.yaml
  text: And when the Jews who lived near them came and told us ten times[a], “From all the places where you turn[b], they will come up against us,”
translation:
  language: te
  text: వారి దగ్గర నివసించే యూదులు వచ్చి, “మీరు ఎటు తిరిగినా[a], అన్ని చోట్ల నుండీ వారు మన మీదికి వస్తారు[b]” అని మాకు పదిసార్లు చెప్పారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీరు ఎక్కడికి తిరిగి వెళ్లినా.” ఇక్కడి హీబ్రూ క్రియకు ‘తిరుగు’ లేదా ‘తిరిగి వెళ్లడం’ అనే భావాలు ఉండవచ్చు; ఈ సందర్భంలో ఏ దిశకు తిరిగినా అనే భావం ఎక్కువగా సరిపోతుంది.
    reason: lexical_alternative
  - marker: b
    text: “వారు … వస్తారు” అనే మాటలు హీబ్రూ వాక్యంలో స్పష్టంగా లేవు; అన్ని దిశల నుండీ శత్రువులు సమీపిస్తున్నారనే సందర్భ భావాన్ని తెలుగులో పూర్తిగా తెలియజేయడానికి చేర్చబడ్డాయి.
    reason: supplied_words
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר בָּאוּ
  choice: వచ్చి
  rationale: హీబ్రూ కథన ఉపోద్ఘాతాన్ని తెలుగులో భారంగా కాకుండా సహజమైన క్రమవాచక నిర్మాణంలో తెలిపింది.
- source_word: הַיְּהוּדִים
  choice: యూదులు
  rationale: ఈ సందర్భంలో ఇది కేవలం యూదయ ప్రాంత నివాసులను కాక యూద సమాజానికి చెందినవారిని సూచిస్తుంది.
- source_word: הַיֹּשְׁבִים אֶצְלָם
  choice: వారి సమీపంలో నివసిస్తున్న
  rationale: אֵצֶל తెలిపే భౌగోళిక సామీప్యాన్ని స్పష్టంగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: עֶשֶׂר פְּעָמִים
  choice: పదిసార్లు
  rationale: మూలంలోని నిర్దిష్ట సంఖ్యను ‘పదేపదే’ అని సాధారణీకరించకుండా నిలిపింది.
- source_word: מִכָּל הַמְּקֹמוֹת
  choice: అన్ని చోట్ల నుండీ
  rationale: ప్రతి దిశ లేదా ప్రదేశం నుండి ముప్పు వస్తుందనే పంపిణీ భావాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: אֲשֶׁר תָּשׁוּבוּ
  choice: మీరు ఎటు తిరిగినా
  rationale: שׁוב సాధారణంగా ‘తిరిగివచ్చు’ అని అర్థమైనా, ఇక్కడ ఏ దిశకు తిరిగినా అనే సందర్భోచిత భావం వాక్యాన్ని సుసంబద్ధం చేస్తుంది; ప్రత్యామ్నాయం పాదటిప్పణిలో ఉంచబడింది.
- source_word: עָלֵינוּ
  choice: మన మీదికి
  rationale: శత్రుత్వ సందర్భంలో על దాడి లేదా ప్రతికూలంగా సమీపించడాన్ని సూచిస్తుంది; ‘మన మీదికి’ ఆ ఉద్రిక్తతను నిలుపుతుంది.
