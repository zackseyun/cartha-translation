  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. జాబితాలోని నిరాకరణను సహజంగా చూపడానికి ‘గానీ’ నిర్మాణం వాడబడింది. చివరి క్లిష్టమైన హీబ్రూ వాక్యభాగానికి ప్రధాన పాఠ్యంలో ఒక సాధ్యమైన అర్థం ఇచ్చి, నిజమైన పాఠ్య అనిశ్చితిని పాదటిప్పణిలో నిలుపుకున్నాం.
