  text: וְ/אֵ֨ין אֲנִ֜י וְ/אַחַ֣/י וּ/נְעָרַ֗/י וְ/אַנְשֵׁ֤י הַ/מִּשְׁמָר֙ אֲשֶׁ֣ר אַחֲרַ֔/י אֵין אֲנַ֥חְנוּ פֹשְׁטִ֖ים בְּגָדֵ֑י/נוּ אִ֖ישׁ שִׁלְח֥/וֹ הַ/מָּֽיִם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/017.yaml
  text: And neither I[a], nor my brothers, nor my young men, nor the men of the guard who were behind me, took off our clothes; each kept his weapon in his right hand, even for water.
translation:
  language: te
  text: నేనుగానీ, నా సహోదరులుగానీ, నా యువకులుగానీ, నా వెనుక ఉన్న కాపలాదారులుగానీ మా బట్టలు విప్పలేదు. ప్రతి ఒక్కరూ నీళ్ల కోసం వెళ్లేటప్పుడు కూడా తన ఆయుధాన్ని వెంట ఉంచుకున్నారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: చివరి హీబ్రూ పదబంధం క్లిష్టంగా ఉంది; అక్షరార్థంగా, “ప్రతి ఒక్కరు—తన శెలహ్—నీళ్లు” అని ఉంది. “ప్రతి ఒక్కరూ నీళ్ల కోసం వెళ్లేటప్పుడు కూడా తన ఆయుధాన్ని వెంట ఉంచుకున్నారు” అని గానీ, “ప్రతి ఒక్కరి ఆయుధం అతని కుడిచేతి దగ్గరే ఉండేది, నీళ్ల కోసం వెళ్లేటప్పుడు కూడా” అని గానీ అర్థం కావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין ... אֵין
  choice: ఎవరమూ ... విప్పలేదు
  rationale: אֵין తో కూడిన వర్తమాన కృదంతం కొనసాగుతున్న నిరాకరణను తెలియజేస్తుంది. తెలుగు వాక్యనిర్మాణంలో జాబితాను ‘గానీ’తో సమన్వయపరచి, క్రియను ‘విప్పలేదు’గా ఇవ్వడం సహజంగా ఉంది.
- source_word: אַחַי
  choice: నా సహోదరులు
  rationale: మూలంలోని కుటుంబసంబంధ పదాన్ని నిలుపుతుంది; సందర్భాన్ని బట్టి బంధువులు లేదా సన్నిహిత సహచరులు అనే విస్తృత భావం ఉండవచ్చు.
- source_word: נְעָרַי
  choice: నా యువకులు
  rationale: נַעַר యువకుడు, సేవకుడు లేదా పరిచారకుడు అనే అర్థాలు ఇవ్వగలదు. పరిపాలనా-సైనిక సందర్భంలో హోదాను అతిగా నిర్దిష్టం చేయకుండా మూలరూపానికి దగ్గరగా ఉంటుంది.
- source_word: אַנְשֵׁי הַמִּשְׁמָר
  choice: కాపలా మనుషులు
  rationale: మִשְׁמָר లోని కాపలా లేదా పహారా భావాన్ని సాధారణ ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: אֲשֶׁר אַחֲרַי
  choice: నా వెనుక ఉన్న
  rationale: అక్షరార్థమైన స్థానసూచక భావాన్ని నిలుపుతూ కాపలా సందర్భానికి సరిపోతుంది; ‘నన్ను అనుసరించిన’ అనే భావం కూడా సాధ్యమే.
- source_word: פֹשְׁטִים בְּגָדֵינוּ
  choice: మా బట్టలు విప్పలేదు
  rationale: బట్టలను తొలగించడం అనే సాధారణ అర్థాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אִישׁ
  choice: ప్రతి ఒక్కరూ
  rationale: ఇక్కడ אִישׁ విభజనార్థకంగా ‘ఒక్కొక్కరు/ప్రతి ఒక్కరూ’ అని పనిచేస్తుంది.
- source_word: שִׁלְחוֹ
  choice: తన ఆయుధాన్ని వెంట ఉంచుకున్నారు
  rationale: שֶׁלַח ఆయుధాన్ని, ముఖ్యంగా విసిరే లేదా ఈటెవంటి ఆయుధాన్ని సూచించవచ్చు. నిర్దిష్ట ఆయుధ రకాన్ని నిర్ణయించకుండా సిద్ధంగా ఉంచుకున్న భావాన్ని అందిస్తుంది.
- source_word: הַמָּיִם
  choice: నీళ్ల కోసం వెళ్లేటప్పుడు కూడా
  rationale: చివరి పదబంధం అత్యంత సంక్షిప్తంగా, క్లిష్టంగా ఉంది. నీళ్ల కోసం వెళ్లే సందర్భంలోనూ ఆయుధాన్ని విడువలేదనే సాధ్యమైన భావాన్ని సహజ తెలుగులో ఇస్తూ, అనిశ్చితిని పాదటిప్పణిలో తెలియజేస్తుంది.
