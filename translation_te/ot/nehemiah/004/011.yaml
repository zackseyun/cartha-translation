  edition: WLC
  text: הַ/בּוֹנִ֧ים בַּ/חוֹמָ֛ה וְ/הַ/נֹּשְׂאִ֥ים בַּ/סֶּ֖בֶל עֹמְשִׂ֑ים בְּ/אַחַ֤ת יָד/וֹ֙ עֹשֶׂ֣ה בַ/מְּלָאכָ֔ה וְ/אַחַ֖ת מַחֲזֶ֥קֶת הַ/שָּֽׁלַח׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/011.yaml
  text: The builders on the wall[a], and those who carried burdens, loaded themselves so that with one hand each did the work[b], and with the other held his weapon.
translation:
  language: te
  text: గోడను కట్టేవారూ, బరువులు మోసేవారూ తమపై బరువులు ఎక్కించుకొని[a], ఒక్కొక్కరు ఒక చేతితో పని చేస్తూ, మరో చేతితో ఆయుధాన్ని[b] పట్టుకుని ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘బరువులు మోసేవారు బరువులతో నింపబడ్డారు.’ עֹמְשִׂים అనే హీబ్రూ కృదంతం అరుదైనది; దాని కచ్చితమైన భావం స్పష్టంగా లేదు. అయితే సందర్భం ప్రకారం పనివారు నిర్మాణ సామగ్రిని మోస్తూనే ఆయుధాలతో సిద్ధంగా ఉన్నారు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ הַשָּׁלַח పదం మరింత నిర్దిష్టంగా ఈటె, బల్లెం, లేదా మరొక రకమైన ఆయుధాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבּוֹנִים בַּחוֹמָה
  choice: గోడ మీద కట్టే పనివారు
  rationale: בנה యొక్క బహువచన కర్తరి వర్తమాన కృదంతం పనివారిని సూచిస్తుంది; בַחוֹמָה ఈ నిర్మాణ సందర్భంలో ‘గోడ మీద’ అనే భావాన్ని ఇస్తుంది.
- source_word: וְהַנֹּשְׂאִים בַּסֶּבֶל
  choice: బరువులు మోసేవారు
  rationale: נשא మరియు סבל కలయిక నిర్మాణ సామగ్రి వంటి బరువులను మోయడాన్ని సూచిస్తుంది; ఈ రూపం ఆధునిక తెలుగులో సహజంగా ఉంటుంది.
- source_word: עֹמְשִׂים
  choice: తమపై బరువులు ఎక్కించుకొని
  rationale: అరుదైన ఈ కృదంత రూపం బరువులు మోసేందుకు వాటిని తమపై వేసుకోవడం లేదా బరువుతో నిండిపోవడం అనే భావాన్ని సూచించవచ్చు; సందర్భంలోని క్రియను సహజంగా తెలియజేస్తూనే అనిశ్చితిని పాదసూచికలో ఉంచాం.
- source_word: בְּאַחַת יָדוֹ עֹשֶׂה בַמְּלָאכָה
  choice: ఒక్కొక్కరు ఒక చేతితో పని చేస్తూ
  rationale: ఏకవచన ప్రత్యయం సమూహంలోని ప్రతి పనివారికీ విడివిడిగా వర్తిస్తుంది; ‘ఒక్కొక్కరు’ ఆ పంపిణీ భావాన్ని తెలుగులో స్పష్టం చేస్తుంది.
- source_word: וְאַחַת מַחֲזֶקֶת
  choice: మరో చేతితో ... పట్టుకున్నారు
  rationale: స్త్రీలింగ ఏకవచన కృదంతం అంతర్లీనంగా ఉన్న ‘చేయి’తో అన్వయిస్తుంది; తెలుగులో సహజత కోసం ‘చేతితో’ను స్పష్టంగా చేర్చాం.
- source_word: הַשָּׁלַח
  choice: ఆయుధం
  rationale: ఈ పదం ఈటె, బల్లెం లేదా విసిరే ఆయుధం వంటి నిర్దిష్ట సాధనాన్ని సూచించవచ్చు; మూలంలోని విస్తృతతను నిలుపుకోవడానికి సాధారణ పదమైన ‘ఆయుధం’ ఎంచుకున్నాం.
