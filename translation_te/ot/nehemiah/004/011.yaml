translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని ఉపయోగించాం. మూలంలోని పంపిణీ ఏకవచనాన్ని ‘ఒక్కొక్కరు’తో స్పష్టం చేశాం; అరుదైన עֹמְשִׂים పదంలోని అనిశ్చితిని పాదసూచికలో నిలిపాం.
