source:
  edition: WLC
  text: וָ/אֹמַ֞ר אֶל הַ/חֹרִ֤ים וְ/אֶל הַ/סְּגָנִים֙ וְ/אֶל יֶ֣תֶר הָ/עָ֔ם הַ/מְּלָאכָ֥ה הַרְבֵּ֖ה וּ/רְחָבָ֑ה וַ/אֲנַ֗חְנוּ נִפְרָדִים֙ עַל הַ֣/חוֹמָ֔ה רְחוֹקִ֖ים אִ֥ישׁ מֵ/אָחִֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/013.yaml
  text: And I said to the nobles[a], to the officials, and to the rest of the people, “The work is great and spread out, and we are separated along the wall, far from one another.”
translation:
  language: te
  text: 'నేను కులీనులతో, అధికారులతో, మిగిలిన ప్రజలతో ఇలా అన్నాను: “పని చాలా విస్తారంగా ఉంది; మనమేమో గోడ పొడవునా ఒకరికొకరం దూరంగా విడివిడిగా ఉన్నాం.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “ఒక్కొక్కడు తన సహోదరుని నుండి [దూరంగా].” ఇది ‘ఒకరికొకరం దూరంగా’ అనే అర్థమిచ్చే హీబ్రూ నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֹרִים
  choice: ప్రముఖులు
  rationale: నెహెమ్యా సందర్భంలో ఈ పదం సమాజంలోని ఉన్నతస్థాయి నాయకులను సూచిస్తుంది. ఆధునిక తెలుగులో ‘ప్రముఖులు’ సహజంగా, అతిగా నిర్దిష్టం చేయకుండా ఈ భావాన్ని అందిస్తుంది.
- source_word: הַסְּגָנִים
  choice: అధికారులు
  rationale: పరిపాలనా బాధ్యతగల నాయకులను సూచించే ఈ పదానికి ‘అధికారులు’ స్పష్టమైన ఆధునిక తెలుగు సమానార్థకం.
- source_word: יֶתֶר הָעָם
  choice: మిగిలిన ప్రజలు
  rationale: ముందు పేర్కొన్న నాయకులు కాకుండా మిగతా వారందరినీ సూచించే సహజమైన అనువాదం.
- source_word: הַמְּלָאכָה הַרְבֵּה וּרְחָבָה
  choice: పని చాలా విస్తారంగా ఉంది
  rationale: పునర్నిర్మాణ పని పరిమాణంలో పెద్దదిగాను, విస్తీర్ణంలో వ్యాపించి ఉన్నదిగాను ఉందనే సంయుక్త భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: נִפְרָדִים
  choice: విడివిడిగా ఉన్నాం
  rationale: పనివారు పరస్పరం విరోధంగా విడిపోయారని కాక, ప్రదేశపరంగా వేర్వేరుగా ఉన్నారని సూచిస్తుంది.
- source_word: עַל הַחוֹמָה
  choice: గోడ పొడవునా
  rationale: עַל యొక్క మూల స్థానార్థాన్ని సందర్భానుసారంగా విభజిత విస్తరణగా వ్యక్తం చేస్తూ, పనివారు గోడ అంతటా వేర్వేరు చోట్ల ఉన్నారని తెలుపుతుంది.
- source_word: רְחוֹקִים אִישׁ מֵאָחִיו
  choice: ఒకరికొకరం దూరంగా
  rationale: అక్షరార్థంగా ‘ఒక్కొక్కరు తమ సహోదరునికి దూరంగా’ అనే హీబ్రూ పరస్పర ప్రయోగాన్ని సహజమైన తెలుగులో అందిస్తుంది.
