translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే గంభీరతను నిలుపుతూ అనువదించబడింది. మూలంలోని పని విస్తృతి మరియు పనివారి పరస్పర దూరం రెండూ స్పష్టంగా ఉంచబడ్డాయి. పాదసూచిక గుర్తు దానికి సంబంధించిన ‘ఒకరికొకరం దూరంగా’ అన్న పదబంధం వద్ద ఉంచబడింది.
