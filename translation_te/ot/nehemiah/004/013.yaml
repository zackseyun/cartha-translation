  source_fidelity: 'మొత్తంగా మూలానికి విశ్వసనీయంగా ఉంది: పని పరిమాణం/విస్తృతి, గోడ పొడవునా ఉన్న ప్రాదేశిక విభజన, పరస్పర దూరం అన్నీ సరిగ్గా ప్రతిఫలించాయి. అయితే הַחֹרִים‌కు ‘ప్రముఖులు’ అనేది కేవలం ప్రసిద్ధ/ముఖ్య వ్యక్తులనే సూచించగలదు; సందర్భంలోని సామాజిక ఉన్నతవర్గ భావాన్ని ‘కులీనులు’ మరింత స్పష్టంగా ఇస్తుంది.'
