id: NEH.4.14
reference: Nehemiah 4:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: בִּ/מְק֗וֹם אֲשֶׁ֤ר תִּשְׁמְעוּ֙ אֶת ק֣וֹל הַ/שּׁוֹפָ֔ר שָׁ֖מָּ/ה תִּקָּבְצ֣וּ אֵלֵ֑י/נוּ אֱלֹהֵ֖י/נוּ יִלָּ֥חֶם לָֽ/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/014.yaml
  text: At the place where you hear the sound of the trumpet[a], gather there to us. Our God will fight for us.
translation:
  language: te
  text: మీరు బూర శబ్దం[a] ఎక్కడ వింటారో, అక్కడ మా దగ్గరికి సమకూడండి. మన దేవుడు మనకొరకు యుద్ధం చేస్తాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పొట్టేలు కొమ్ము బూర శబ్దం.” హీబ్రూ షోఫార్ అనేది ప్రత్యేకంగా పొట్టేలు కొమ్ముతో చేసిన బూరను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּמְקוֹם אֲשֶׁר
  choice: ఎక్కడ
  rationale: స్థలాన్ని సూచించే ఈ సంయుక్త ప్రయోగాన్ని ఆధునిక తెలుగులో సహజంగా ‘ఎక్కడ’ అని అనువదించవచ్చు; స్థలార్థం స్పష్టంగా నిలుస్తుంది.
- source_word: תִּשְׁמְעוּ
  choice: మీరు ... వింటారో
  rationale: שׁמע యొక్క సాధారణ అర్థమైన ‘వినడం’ను నిలుపుతూ, స్థల సంబంధ వాక్యానికి తగిన తెలుగు నిర్మాణం వాడబడింది.
- source_word: קוֹל הַשּׁוֹפָר
  choice: బూర శబ్దం
  rationale: קוֹל అనే ‘శబ్దం’ పదాన్ని స్పష్టంగా నిలిపి, שׁוֹפָר‌ను సాధారణ పాఠకునికి అర్థమయ్యే ‘బూర’గా ఇచ్చాం; దాని ప్రత్యేక కొమ్ము వాద్య స్వభావాన్ని పాదటిప్పణిలో తెలిపాం.
- source_word: שָׁמָּה
  choice: అక్కడ
  rationale: సూచించబడిన స్థలాన్నే తెలియజేసే సహజ తెలుగు స్థలవాచక రూపం.
- source_word: תִּקָּבְצוּ
  choice: సమకూడండి
  rationale: నిఫాల్ ఆజ్ఞ యొక్క కలిసి రావడం/ఒకచోట చేరడం అనే భావాన్ని సహజమైన ఆజ్ఞారూపంలో అందిస్తుంది.
- source_word: אֵלֵינוּ
  choice: మా దగ్గరికి
  rationale: మూలంలోని ప్రథమ పురుష బహువచనాన్ని మార్చకుండా, గమ్యార్థక ‘మా దగ్గరికి’గా సహజంగా వ్యక్తం చేశాం.
- source_word: אֱלֹהֵינוּ
  choice: మన దేవుడు
  rationale: మూలంలోని బహువచన సంబంధ ప్రత్యయాన్ని నిలుపుతుంది; తెలుగు సందర్భంలో వక్త, శ్రోతలను కలుపుకునే ‘మన’ సహజంగా ఉంటుంది.
- source_word: יִלָּחֶם לָנוּ
  choice: మన పక్షంగా యుద్ధం చేస్తాడు
  rationale: దేవుడే యుద్ధ చర్యకు కర్త అని స్పష్టంగా ఉంచుతూ, לָנוּ యొక్క ప్రయోజనార్థాన్ని ‘మన పక్షంగా’ తెలియజేస్తుంది.
theological_decisions:
- issue: దైవిక యుద్ధ భాష
  choice: మన దేవుడు మన పక్షంగా యుద్ధం చేస్తాడు
  alternative: మన దేవుడు యుద్ధం చేయడానికి మనకు సహాయం చేస్తాడు
  rationale: హీబ్రూ వాక్యంలో యుద్ధం చేసే ప్రత్యక్ష కర్త దేవుడే; ఆయన కేవలం మానవులకు సహాయం చేస్తాడనేలా భావాన్ని సడలించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు స్పష్టంగా ఉండేలా, అయినా ఆజ్ఞ మరియు దైవిక యుద్ధ ప్రకటనకు తగిన గంభీరతతో రూపొందించబడింది. ‘మా దగ్గరికి’లో మూలంలోని వక్తపక్ష బహువచనం, ‘మన దేవుడు’లో సమూహాన్ని కలుపుకునే సంబంధ భావం వేర్వేరుగా నిలుపబడ్డాయి.
