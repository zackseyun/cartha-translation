source:
  edition: WLC
  text: וַ/יְהִ֣י כַ/אֲשֶׁ֣ר שָׁמַ֣ע סַנְבַלַּ֡ט וְ֠/טוֹבִיָּה וְ/הָ/עַרְבִ֨ים וְ/הָ/עַמֹּנִ֜ים וְ/הָ/אַשְׁדּוֹדִ֗ים כִּֽי עָלְתָ֤ה אֲרוּכָה֙ לְ/חֹמ֣וֹת יְרוּשָׁלִַ֔ם כִּי הֵחֵ֥לּוּ הַ/פְּרֻצִ֖ים לְ/הִסָּתֵ֑ם וַ/יִּ֥חַר לָ/הֶ֖ם מְאֹֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/001.yaml
  text: When Sanballat and Tobiah and the Arabs and the Ammonites and the Ashdodites heard that the repair of Jerusalem’s walls had gone up[a], that the breaches had begun to be closed[b], they became very angry.
translation:
  language: te
  text: సన్బల్లటు, టోబీయా, అరబ్బులు, అమ్మోనీయులు, అష్డోదీయులు యెరూషలేము ప్రాకారాల మరమ్మతు ముందుకు సాగిందని[a], వాటిలోని బీటలు మూయబడడం మొదలైందని[b] విన్నప్పుడు, వారికి చాలా కోపం వచ్చింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘యెరూషలేము ప్రాకారాల పునరుద్ధరణ పురోగమించిందని.’ ఇక్కడి హీబ్రూ పదం సాధారణంగా స్వస్థత లేదా పునరుద్ధరణతో సంబంధమున్నది; ఇక్కడ అది ప్రాకారాల మరమ్మతును రూపకంగా సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘బీటలు’కు బదులుగా ‘తెగిన చోటులు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַאֲשֶׁר
  choice: విన్నప్పుడు
  rationale: హీబ్రూ కథన పరిచయాన్ని సహజమైన తెలుగు కాలవాచక ఉపవాక్యంలో వ్యక్తం చేస్తుంది; మూలంలో లేని ‘ఇప్పుడు’ను చేర్చదు.
- source_word: שָׁמַע
  choice: విన్నప్పుడు
  rationale: వార్త అందిందనే సందర్భంలోనూ ‘విన్నారు’ అనే ప్రత్యక్ష అర్థం సహజంగా సరిపోతుంది.
- source_word: סַנְבַלַּט וְטוֹבִיָּה
  choice: సన్బల్లటు, టోబీయా
  rationale: హీబ్రూ వ్యక్తినామాలకు దగ్గరగా, తెలుగులో చదవదగిన లిప్యంతరీకరణ.
- source_word: הָעַרְבִים
  choice: అరబ్బీయులు
  rationale: అరబ్ ప్రజలను సూచించే సహజమైన తెలుగు జాతినామం.
- source_word: הָעַמֹּנִים
  choice: అమ్మోనీయులు
  rationale: అమ్మోను ప్రజలకు ప్రామాణిక తెలుగు జాతినామ రూపం.
- source_word: הָאַשְׁדּוֹדִים
  choice: అష్డోదీయులు
  rationale: అష్డోదు పట్టణానికి చెందిన ప్రజలను సూచించే సంక్షిప్త జాతినామం.
- source_word: עָלְתָה אֲרוּכָה
  choice: మరమ్మతు ముందుకు సాగింది
  rationale: אֲרוּכָהలోని స్వస్థత/పునరుద్ధరణ రూపకాన్ని గోడల సందర్భంలో ‘మరమ్మతు’గా, עָלְתָהలోని పురోగతి భావాన్ని ‘ముందుకు సాగింది’గా నిలుపుతుంది.
- source_word: לְחֹמוֹת יְרוּשָׁלִַם
  choice: యెరూషలేము ప్రాకారాల
  rationale: నగరాన్ని చుట్టిన రక్షణ గోడలను ‘ప్రాకారాలు’ స్పష్టంగా, గౌరవప్రదంగా తెలియజేస్తుంది.
- source_word: הַפְּרֻצִים
  choice: బీటలు
  rationale: ప్రాకారాల్లో పగిలి ఏర్పడిన ఖాళీలను సాధారణ ఆధునిక తెలుగులో స్పష్టంగా సూచిస్తుంది.
- source_word: לְהִסָּתֵם
  choice: మూయబడడం
  rationale: నిఫాల్ రూపంలోని కర్మణి భావాన్ని కాపాడుతూ, గోడ బీటల సందర్భంలో సహజంగా ఉంటుంది.
- source_word: וַיִּחַר לָהֶם מְאֹד
  choice: వారికి చాలా కోపం వచ్చింది
  rationale: హీబ్రూ నుడికారంలోని తీవ్రమైన కోపాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
