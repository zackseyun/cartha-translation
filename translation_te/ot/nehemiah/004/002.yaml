source:
  edition: WLC
  text: וַ/יִּקְשְׁר֤וּ כֻלָּ/ם֙ יַחְדָּ֔ו לָ/ב֖וֹא לְ/הִלָּחֵ֣ם בִּ/ירוּשָׁלִָ֑ם וְ/לַ/עֲשׂ֥וֹת ל֖/וֹ תּוֹעָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/002.yaml
  text: And all of them conspired together to come and fight against Jerusalem and to cause confusion in it[a].
translation:
  language: te
  text: వారందరూ కలిసి యెరూషలేము మీదికి వచ్చి యుద్ధం చేయడానికి, దానిలో గందరగోళం కలిగించడానికి[a] కుట్ర పన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దానిలో అల్లకల్లోలం/ఇబ్బంది కలిగించడానికి.’ హీబ్రూ పదం గందరగోళం, కలత లేదా అవ్యవస్థను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְשְׁרוּ
  choice: కుట్ర పన్నారు
  rationale: קשר అనే క్రియ ఇక్కడ శత్రుత్వ ఉద్దేశంతో కూడిన సమన్వయ కుట్రను సూచిస్తుంది; ఆధునిక తెలుగులో ‘కుట్ర పన్నారు’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: כֻלָּם יַחְדָּו
  choice: వారందరూ కలిసి
  rationale: כֻלָּם యొక్క సంపూర్ణతనూ יַחְדָּו యొక్క ఉమ్మడి చర్యనూ సంక్షిప్తంగా నిలుపుతుంది.
- source_word: לָבוֹא
  choice: మీదికి వచ్చి
  rationale: మూలంలోని గమనాన్ని సూచించే ‘రావడం’ అనే భావాన్ని నిలుపుతూ, తరువాతి శత్రుత్వ చర్యతో సహజంగా అనుసంధానిస్తుంది.
- source_word: לְהִלָּחֵם בִּירוּשָׁלִָם
  choice: యెరూషలేము మీదికి వచ్చి యుద్ధం చేయడానికి
  rationale: לחם యొక్క యుద్ధంలో పాల్గొనే భావాన్నీ, בְּ ద్వారా యెరూషలేము లక్ష్యంగా ఉండటాన్నీ సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וְלַעֲשׂוֹת לוֹ תּוֹעָה
  choice: దానిలో గందరగోళం కలిగించడానికి
  rationale: עשה + תּוֹעָה కలయిక ఒక అవ్యవస్థిత స్థితిని కలిగించడాన్ని సూచిస్తుంది; לוֹ ను యెరూషలేమును సూచించే స్థలార్థక సర్వనామంగా అనువదించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని వాడాం. మూలంలోని ‘వచ్చి’ అనే గమన భావాన్ని తొలగించకుండా, కుట్ర మరియు సమన్వయ చర్యల బలాన్ని నిలిపాం.
