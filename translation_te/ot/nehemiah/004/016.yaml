source:
  edition: WLC
  text: גַּ֣ם בָּ/עֵ֤ת הַ/הִיא֙ אָמַ֣רְתִּי לָ/עָ֔ם אִ֣ישׁ וְ/נַעֲר֔/וֹ יָלִ֖ינוּ בְּ/ת֣וֹךְ יְרוּשָׁלִָ֑ם וְ/הָֽיוּ לָ֧/נוּ הַ/לַּ֛יְלָה מִשְׁמָ֖ר וְ/הַ/יּ֥וֹם מְלָאכָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/016.yaml
  text: Also at that time I said to the people[a], “Let each man and his servant spend the night within Jerusalem[b], and let them be a guard for us by night and workers by day.”
translation:
  language: te
  text: 'ఆ సమయంలో కూడా నేను ప్రజలతో ఇలా చెప్పాను: “ప్రతి వ్యక్తీ తన సేవకునితో కలిసి యెరూషలేము నగరంలో రాత్రి బస చేయాలి[a]; వారు రాత్రివేళ మనకు కాపలాగా, పగటివేళ పనికోసం ఉండాలి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ నַעַר (నఅర్) సందర్భాన్ని బట్టి యువకుడు, సేవకుడు, పరిచారకుడు లేదా అధీన పనివాడు అని అర్థం కావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם בָּעֵת הַהִיא
  choice: ఆ సమయంలోనే
  rationale: גַּם యొక్క అనుబంధ లేదా బలప్రయోగ భావాన్ని సహజమైన తెలుగులో ‘నే’ ద్వారా తెలియజేస్తూ, בָּעֵת הַהִיאను ‘ఆ సమయంలో’గా అనువదించింది.
- source_word: אָמַרְתִּי לָעָם
  choice: నేను ప్రజలతో ఇలా చెప్పాను
  rationale: హీబ్రూ వాక్యాన్ని సహజమైన ఆధునిక తెలుగు ప్రత్యక్షోక్తి నిర్మాణంలో అందిస్తుంది.
- source_word: אִישׁ וְנַעֲרוֹ
  choice: ప్రతి వ్యక్తి తన సేవకునితో పాటు
  rationale: אִישׁ ఇక్కడ విభాజక ఏకవచనంగా ‘ప్రతి వ్యక్తి’ అని సూచిస్తుంది. נַעַר సందర్భానుసారం యువకుడు, సేవకుడు లేదా సహాయకుడు కావచ్చు; పని మరియు కాపలా సందర్భంలో ‘సేవకుడు’ సహజమైన ఎంపిక, అయితే వయస్సును అనవసరంగా నిర్ధారించదు.
- source_word: יָלִינוּ
  choice: రాత్రి గడపాలి
  rationale: లూన్/లీన్ ధాతువు రాత్రిపూట బసచేయడం లేదా ఉండిపోవడం అనే భావాన్ని ఇక్కడ స్పష్టంగా తెలియజేస్తుంది.
- source_word: בְּתוֹךְ יְרוּשָׁלִָם
  choice: యెరూషలేము లోపల
  rationale: בְּתוֹךְ నగర సరిహద్దుల లోపల ఉండడాన్ని సూచిస్తుంది; ‘లోపల’ సాధారణ పాఠకులకు స్పష్టంగా ఉంటుంది.
- source_word: וְהָיוּ לָנוּ
  choice: వారు … మనకు … ఉండాలి
  rationale: వావ్‌తో కూడిన క్రియను ముందున్న ఆదేశానికి అనుసంధానమైన ఉద్దేశిత ఏర్పాటుగా చూపుతుంది; దానిని కేవలం ఫలార్థకంగా పరిమితం చేయదు.
- source_word: הַלַּיְלָה מִשְׁמָר
  choice: రాత్రివేళ మనకు కాపలాగా
  rationale: מִשְׁמָר యొక్క కాపలా లేదా పహారా భావాన్ని, రాత్రి–పగలు సమాంతరతను కాపాడుతూ తెలుగులో సహజంగా అందిస్తుంది.
- source_word: וְהַיּוֹם מְלָאכָה
  choice: పగటివేళ పనికి
  rationale: מְלָאכָה యొక్క మూలమైన ‘పని’ భావాన్ని వ్యక్తులుగా మార్చకుండా నిలుపుతుంది; రాత్రి కాపలా, పగలు పని అనే సంక్షిప్త సమాంతర నిర్మాణాన్ని ప్రతిబింబిస్తుంది.
