  to: 'ఆ సమయంలో కూడా నేను ప్రజలతో ఇలా చెప్పాను: “ప్రతి వ్యక్తీ తన సేవకునితో కలిసి యెరూషలేము నగరంలో రాత్రి బస చేయాలి[a]; వారు రాత్రివేళ మనకు కాపలాగా, పగటివేళ పనికోసం ఉండాలి.”'
