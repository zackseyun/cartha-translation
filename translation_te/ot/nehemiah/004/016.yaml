translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. సైనిక-నిర్మాణ సందర్భంలోని ఆదేశ స్వరాన్ని ‘గడపాలి/ఉండాలి’ ద్వారా నిలిపింది. మూలంలోని నామవాచక సమాంతరతను సాధ్యమైనంతవరకు కాపాడింది.
