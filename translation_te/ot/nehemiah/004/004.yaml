  to: 'అప్పుడు యూదా[a] ఇలా అన్నాడు: “బరువులు మోసేవారి బలం క్షీణించింది; శిథిలాల మట్టి[b] చాలా ఉంది, మనం ప్రాకారాన్ని కట్టలేము.”'
