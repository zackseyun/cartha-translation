id: NEH.4.4
reference: Nehemiah 4:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוּדָ֗ה כָּשַׁל֙ כֹּ֣חַ הַ/סַּבָּ֔ל וְ/הֶ/עָפָ֖ר הַרְבֵּ֑ה וַ/אֲנַ֨חְנוּ֙ לֹ֣א נוּכַ֔ל לִ/בְנ֖וֹת בַּ/חוֹמָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/004.yaml
  text: And Judah said[a], “The strength of the burden-bearers has failed, and there is much rubble[b], and we are not able to build the wall.”
translation:
  language: te
  text: 'అప్పుడు యూదా[a] ఇలా అన్నాడు: “బరువులు మోసేవారి బలం క్షీణించింది; శిథిలాల మట్టి[b] చాలా ఉంది, మనం ప్రాకారాన్ని కట్టలేము.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యూదా ప్రజలు.” ఏకవచన నామమైన “యూదా” ఇక్కడ ఆ సమాజాన్ని సమష్టిగా సూచిస్తుండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ పదానికి “దుమ్ము” లేదా “మట్టి” అని అర్థం; ఇక్కడ అది పాడైన నగరం నుంచి పేరుకున్న శిథిలాల మట్టిని సూచిస్తుండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוּדָה
  choice: యూదా
  rationale: హీబ్రూ ఏకవచన నామాన్ని నిలిపి ఉంచాం; సందర్భంలో ఇది యూదా సమాజాన్ని సమష్టిగా సూచించే అవకాశం ఉంది.
- source_word: כָּשַׁל
  choice: క్షీణించింది
  rationale: ‘తడబడటం/విఫలమవటం’ అనే మూలభావాన్ని, శారీరక బలం తగ్గిపోయిన సందర్భంలో సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: כֹּחַ
  choice: బలం
  rationale: ఇక్కడ శ్రమచేసే వారి శారీరక సామర్థ్యాన్ని సూచించే సాధారణ, స్పష్టమైన పదం.
- source_word: הַסַּבָּל
  choice: బరువులు మోసేవారి
  rationale: మూలంలోని ఏకవచన రూపం సమష్టి అర్థంలో ఉంది; తెలుగులో ఆ సమూహాన్ని సహజంగా సూచించేందుకు బహువచన సంబంధ రూపం వాడాం.
- source_word: הֶעָפָר
  choice: శిథిలాల మట్టి
  rationale: పదానికి ప్రాథమికంగా ‘దుమ్ము/మట్టి’ అనే అర్థం ఉంది; కూలిపోయిన నగర ప్రాకార సందర్భంలో శిథిలాల నుంచి పేరుకున్న మట్టిని సూచిస్తుంది. మూలపద భావం, సందర్భార్థం రెండూ నిలిచేలా అనువదించాం.
- source_word: הַרְבֵּה
  choice: చాలా ఉంది
  rationale: అధిక పరిమాణాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: לֹא נוּכַל
  choice: కట్టలేకపోతున్నాం
  rationale: అనాసక్తిని కాక అసమర్థతను సూచిస్తుంది; సందర్భంలోని ప్రస్తుత నిరాశను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לִבְנוֹת
  choice: కట్ట
  rationale: హీబ్రూ క్రియలో పునర్నిర్మాణ భావం ప్రత్యేకంగా గుర్తించబడలేదు కాబట్టి ‘తిరిగి కట్ట’ అని విస్తరించలేదు.
- source_word: בַּחוֹמָה
  choice: ప్రాకారాన్ని
  rationale: ב ఉపసర్గ ఇక్కడ నిర్మాణకార్యపు విషయాన్ని సూచిస్తుంది; తెలుగులో ‘ప్రాకారాన్ని కట్టడం’ అత్యంత సహజంగా, సందర్భానికి కచ్చితంగా ఉంటుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని వాడాం. ‘గోడ’ కంటే కోట/నగర రక్షణగోడ భావాన్ని స్పష్టంచేయడానికి ‘ప్రాకారం’ ఎంచుకున్నాం; హీబ్రూ వాక్యంలోని కారణసంబంధాన్ని తెలుగులో సహజంగా చూపేందుకు చివరి భాగంలో ‘కాబట్టి’ వాడాం.
