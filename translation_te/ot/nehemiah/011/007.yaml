source:
  edition: WLC
  text: וְ/אֵ֖לֶּה בְּנֵ֣י בִנְיָמִ֑ן סַלֻּ֡א בֶּן מְשֻׁלָּ֡ם בֶּן יוֹעֵ֡ד בֶּן פְּדָיָה֩ בֶן ק֨וֹלָיָ֧ה בֶן מַעֲשֵׂיָ֛ה בֶּן אִֽיתִיאֵ֖ל בֶּן יְשַֽׁעְיָֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/007.yaml
  text: 'And these were the sons of Benjamin: Sallu son of Meshullam[a], son of Joed, son of Pedaiah, son of Kolaiah, son of Maaseiah, son of Ithiel[b], son of Jeshaiah.'
translation:
  language: te
  text: 'బెన్యామీను కుమారులు[a] వీరు: మెషుల్లాము కుమారుడైన సల్లూ; మెషుల్లాము యోయేదు[b] కుమారుడు, యోయేదు పెదాయా కుమారుడు, పెదాయా కోలాయా కుమారుడు, కోలాయా మయశేయా కుమారుడు, మయశేయా ఈతీయేలు కుమారుడు, ఈతీయేలు యెషయా కుమారుడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘బెన్యామీను కుమారులు’ అనే హీబ్రూ మాటను విస్తృత అర్థంలో ‘బెన్యామీను సంతతివారు’ లేదా ‘బెన్యామీనీయులు’ అని కూడా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ మసొరెటికు పాఠంలో ‘యోయేదు’ అని ఉంది. 1 దినవృత్తాంతాలు 9:7లోని సమాంతర వంశావళిలో ‘హోదవ్యా’ అని ఉంది.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: వీరు
  rationale: వంశావళిలో తరువాతి వర్గాన్ని పరిచయం చేసే సహజమైన ఆధునిక తెలుగు రూపం; హీబ్రూ సంధికారకాన్ని ప్రత్యేకంగా ‘మరియు’ అని అనువదించకపోయినా దాని అనుసంధాన భావం సందర్భంలో నిలుస్తుంది.
- source_word: בְּנֵי בִנְיָמִן
  choice: బెన్యామీను కుమారులు
  rationale: హీబ్రూ రూపాన్ని, వంశ సంబంధాన్ని నిలుపుతుంది; ఇక్కడ ‘కుమారులు’ అనే మాట విస్తృతంగా సంతతివారిని లేదా బెన్యామీనీయులను కూడా సూచించవచ్చని పాదసూచికలో తెలిపాం.
- source_word: בֶּן
  choice: కుమారుడు / మనుమడు / వంశస్థుడు; తరువాత ‘పూర్వీకులు వరుసగా’
  rationale: ఏడు తరాల పేర్లలో ప్రతి పేరుకు ‘కుమారుడు’ అని పునరావృతం చేయడం తెలుగులో భారంగా ఉంటుంది. మొదటి రెండు సంబంధాలను స్పష్టంగా చూపించి, మిగిలిన వంశశ్రేణిని సహజంగా సంక్షిప్తం చేశాం; పేర్ల క్రమాన్ని యథాతథంగా కాపాడాం.
- source_word: סַלֻּא
  choice: సల్లూ
  rationale: హీబ్రూ ఉచ్చారణకు దగ్గరైన తెలుగు లిప్యంతరీకరణ.
- source_word: מְשֻׁלָּם
  choice: మెషుల్లాము
  rationale: హీబ్రూ పేరుకు దగ్గరైన, తెలుగులో చదవడానికి సహజమైన లిప్యంతరీకరణ.
- source_word: יוֹעֵד
  choice: యోయేదు
  rationale: మసొరెటికు పాఠంలోని పేరును అనుసరించిన తెలుగు లిప్యంతరీకరణ; సమాంతర వంశావళిలోని భిన్న పాఠాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: פְּדָיָה
  choice: పెదాయా
  rationale: హీబ్రూ స్వరరూపానికి దగ్గరైన తెలుగు లిప్యంతరీకరణ.
- source_word: קוֹלָיָה
  choice: కోలాయా
  rationale: హీబ్రూ పేరులోని స్వరరూపాన్ని ప్రతిబింబించే తెలుగు లిప్యంతరీకరణ.
- source_word: מַעֲשֵׂיָה
  choice: మయశేయా
  rationale: హీబ్రూ పేరును ఆధునిక తెలుగు పాఠకుడు సులభంగా పలికేలా లిప్యంతరీకరించాం.
- source_word: אִיתִיאֵל
  choice: ఈతీయేలు
  rationale: హీబ్రూ పేరుకు దగ్గరైన తెలుగు లిప్యంతరీకరణ.
- source_word: יְשַׁעְיָה
  choice: యెషయా
  rationale: హీబ్రూ రూపాన్ని ప్రతిబింబిస్తూ, ఈ వంశావళి వ్యక్తి పేరును తెలుగులో సహజంగా అందిస్తుంది.
