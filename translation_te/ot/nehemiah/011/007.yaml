translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైన వంశావళి శైలిని ఉపయోగించాం. హీబ్రూలోని వరుస ‘బెన్’ నిర్మాణాన్ని యాంత్రికంగా పునరావృతం చేయకుండా, సంబంధాల క్రమం మారకుండా సహజమైన తెలుగు వాక్యంగా మలిచాం. పాదసూచిక సూచికలను అవి వివరిస్తున్న పదాల దగ్గరే ఉంచాం.
