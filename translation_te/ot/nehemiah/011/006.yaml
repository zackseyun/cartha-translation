  yaml_path: translation/ot/nehemiah/011/006.yaml
  text: All the sons of Perez who lived in Jerusalem were four hundred sixty-eight valiant men[a].
translation:
  language: te
  text: యెరూషలేములో నివసించిన పెరెసు కుమారులందరూ నాలుగు వందల అరవై ఎనిమిది మంది పరాక్రమవంతులైన పురుషులు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “సామర్థ్యవంతులైన పురుషులు.” హీబ్రూ పదబంధం బలం, సామర్థ్యం లేదా శౌర్యంలో పేరుపొందిన వారిని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל
  choice: అందరూ
  rationale: ఈ సమూహంలోని వారందరినీ సూచించే సంపూర్ణ భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: בְּנֵי פֶרֶץ
  choice: పెరెసు కుమారులు
  rationale: వంశావళి సందర్భంలో ‘కుమారులు’ అనేది సంతతివారిని కూడా సూచించగల హీబ్రూ బంధుత్వ ప్రయోగాన్ని నిలుపుతుంది.
- source_word: הַיֹּשְׁבִים
  choice: నివసించిన
  rationale: నగరంలో స్థిరంగా ఉండడాన్ని సూచించే ישב క్రియారూపానికి సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: בִּירוּשָׁלִָם
  choice: యెరూషలేములో
  rationale: స్థలార్థక ఉపసర్గను తెలుగు విభక్తితో నేరుగా వ్యక్తం చేస్తుంది.
- source_word: אַרְבַּע מֵאוֹת שִׁשִּׁים וּשְׁמֹנָה
  choice: నాలుగు వందల అరవై ఎనిమిది మంది
  rationale: హీబ్రూ సంఖ్యను అంకెలకు బదులు పదాలతో ఇచ్చి, వ్యక్తుల లెక్కకు తగిన ‘మంది’ని జోడిస్తుంది.
- source_word: אַנְשֵׁי חָיִל
  choice: పరాక్రమశాలులు
  rationale: బలం, సామర్థ్యం, శౌర్యం వంటి విస్తృత ప్రశంసార్థాన్ని సంక్షిప్తంగా తెలియజేస్తుంది; మూలంలోని పురుష సమూహ సూచన సందర్భం ద్వారా స్పష్టంగా ఉంటుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; జనగణన/వంశావళి వాక్యానికి తగిన సంక్షిప్త, గౌరవప్రద శైలి. ‘పెరెసు కుమారులు’ అనే మూల బంధుత్వ ప్రయోగాన్ని నిలిపి, ‘పరాక్రమశాలులు’లోని అర్థ విస్తృతిని పాదసూచికలో సంరక్షించాం.
