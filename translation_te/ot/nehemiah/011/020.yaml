source:
  edition: WLC
  text: וּ/שְׁאָ֨ר יִשְׂרָאֵ֜ל הַ/כֹּהֲנִ֤ים הַ/לְוִיִּם֙ בְּ/כָל עָרֵ֣י יְהוּדָ֔ה אִ֖ישׁ בְּ/נַחֲלָתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/020.yaml
  text: And the rest of Israel[a], the priests, and the Levites were in all the cities of Judah, each in his inheritance.
translation:
  language: te
  text: మిగిలిన ఇశ్రాయేలీయులు, యాజకులు, లేవీయులు యూదా పట్టణాలన్నిటిలో, ఒక్కొక్కరు తన స్వాస్థ్యంలో[a], ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “ఒక్కొక్కడు తన స్వాస్థ్యంలో” అని ఉంది; ఇది ఒక్కొక్కరిని విడివిడిగా సూచించే ఏకవచన ప్రయోగం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁאָר יִשְׂרָאֵל
  choice: మిగిలిన ఇశ్రాయేలీయులు
  rationale: שְׁאָר మిగిలినవారిని సూచిస్తుంది. ఇక్కడ יִשְׂרָאֵל ప్రజలను సూచిస్తున్నందున, ఆధునిక తెలుగులో సహజంగా ‘ఇశ్రాయేలీయులు’ అని వ్యక్తీకరించబడింది.
- source_word: הַכֹּהֲנִים
  choice: యాజకులు
  rationale: యాజక వర్గానికి తెలుగులో స్థిరపడిన, గౌరవప్రదమైన పదం.
- source_word: הַלְוִיִּם
  choice: లేవీయులు
  rationale: లేవి గోత్రానికి చెందినవారిని సూచించే సాంప్రదాయిక తెలుగు రూపం.
- source_word: בְּכָל עָרֵי יְהוּדָה
  choice: యూదా పట్టణాలన్నిటిలో
  rationale: בְּ స్థానార్థకమైనది; ‘పట్టణాలన్నిటిలో’ మూలంలోని ‘అన్ని పట్టణాలలో’ అనే భావాన్ని సహజ తెలుగులో నేరుగా తెలియజేస్తుంది.
- source_word: אִישׁ בְּנַחֲלָתוֹ
  choice: తమతమ స్వాస్థ్యాల్లో
  rationale: אִישׁ ఇక్కడ విభజనాత్మకంగా ‘ఒక్కొక్కరు’ అనే అర్థంలో ఉంది. ‘తమతమ’ ఆ విభజనాత్మక భావాన్ని సహజంగా తెలియజేస్తుంది; נַחֲלָה వారసత్వంగా లేదా కేటాయింపుగా లభించిన భూస్వాస్థ్యాన్ని సూచిస్తుంది.
- source_word: בְּנַחֲלָתוֹ
  choice: నివసించారు
  rationale: హీబ్రూలో క్రియ స్పష్టంగా లేకపోయినా, స్థలాన్ని తెలిపే בְּ పదబంధం సందర్భానుసారం నివాసస్థితిని సూచిస్తుంది; పూర్తి, సహజ తెలుగు వాక్యానికి ‘నివసించారు’ సరిపోతుంది.
theological_decisions:
- issue: విభజనాత్మక పురుష ఏకవచన రూపం
  choice: తమతమ స్వాస్థ్యాల్లో
  alternative: ఒక్కొక్కడు తన స్వాస్థ్యంలో
  rationale: אִישׁ మరియు ఏకవచన ప్రత్యయం మూలంలో పురుష ఏకవచనంగా ఉన్నా, అవి సమూహంలోని ఒక్కొక్కరి స్థితిని విభజనాత్మకంగా తెలియజేస్తాయి. ‘తమతమ’ ఆ భావాన్ని సహజ ఆధునిక తెలుగులో నిలుపుతుంది; ‘ఒక్కొక్కడు తన’ రూపానికి మరింత రూపసామ్యం ఉన్నా తెలుగు వాక్యంలో భారంగా ఉంటుంది.
- issue: నివాస క్రియను పూరించడం
  choice: నివసించారు
  alternative: ఉన్నారు
  rationale: నామవాక్యసదృశమైన హీబ్రూ నిర్మాణంలో క్రియ వ్యక్తంగా లేదు. సందర్భం ప్రజలు ఎక్కడ స్థిరంగా ఉన్నారో తెలుపుతున్నందున ‘నివసించారు’ భావాన్ని స్పష్టం చేస్తుంది; ‘ఉన్నారు’ మరింత రూపానుగుణమైనప్పటికీ తక్కువ నిర్దిష్టం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన బైబిలు శైలి. ‘స్వాస్థ్యం’ భూమిగా లభించిన వారసత్వపు లేదా కేటాయించిన వాటా అనే భావాన్ని నిలుపుతుంది. పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో చేర్చబడింది.
