    reason: lexical_alternative
  revision_rationale: The revision removes the added nuance of settled residence and renders the Hebrew locative clause with “ఉన్నారు.” It also makes the distributive singular explicit in the main text, preserving the source form and the audit trail’s concern without imposing a gendered Telugu expression where the context’s distributive function is primary.
