lexical_decisions:
- source_word: וְאַחֲרָיו
  choice: అతని తర్వాత
  rationale: హీబ్రూ పదబంధానికి అక్షరార్థంగా ‘అతని తర్వాత’ అని అర్థం. ఈ నివాసుల జాబితాలో ఇది వరుసను సూచించడం సందర్భానికి సహజంగా సరిపోతుంది.
- source_word: גַּבַּי
  choice: గబ్బయి
  rationale: వ్యక్తి పేరును హీబ్రూ ఉచ్చారణకు సమీపంగా తెలుగులో లిప్యంతరీకరించాం.
- source_word: סַלָּי
  choice: సల్లయి
  rationale: వ్యక్తి పేరును హీబ్రూ ఉచ్చారణకు సమీపంగా తెలుగులో లిప్యంతరీకరించాం.
- source_word: תְּשַׁע מֵאוֹת עֶשְׂרִים וּשְׁמֹנָה
  choice: తొమ్మిది వందల ఇరవై ఎనిమిది మంది
  rationale: హీబ్రూ సంఖ్య 9 వందలు + 20 + 8, అంటే 928. సందర్భంలో వ్యక్తుల సంఖ్య కాబట్టి తెలుగులో సహజత కోసం ‘మంది’ చేర్చాం.
