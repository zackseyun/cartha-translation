translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, జాబితా శైలికి తగిన సంక్షిప్తమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడాం. హీబ్రూలో స్పష్టమైన క్రియ లేకపోవడంతో తెలుగులోనూ అనవసరంగా క్రియను చేర్చలేదు; వ్యక్తుల సంఖ్యను స్పష్టం చేయడానికి ‘మంది’ వాడాం.
