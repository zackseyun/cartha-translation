source:
  edition: WLC
  text: וּ/פְתַֽחְיָ֨ה בֶּן מְשֵֽׁיזַבְאֵ֜ל מִ/בְּנֵי זֶ֤רַח בֶּן יְהוּדָה֙ לְ/יַ֣ד הַ/מֶּ֔לֶךְ לְ/כָל דָּבָ֖ר לָ/עָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/024.yaml
  text: And Pethahiah son of Meshezabel[a], from the sons of Zerah son of Judah[b], was at the king’s side for every matter concerning the people.
translation:
  language: te
  text: యూదా కుమారుడైన జెరహు వంశస్థులలో ఒకడైన మెషేజబేలు కుమారుడు పెతహయా, ప్రజలకు సంబంధించిన ప్రతి విషయంలో రాజు వద్ద ఉన్నాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ప్రజల తరఫున జరిగే ప్రతి విషయంలో రాజు ప్రతినిధిగా ఉన్నాడు.” హీబ్రూలో అక్షరార్థంగా “రాజు చేతి దగ్గర”; ఇది రాజు సన్నిధిలోని అధికారిని, రాజసేవలోని అధికారిని లేదా రాజు ప్రతినిధిని సూచించవచ్చు. చివరి పదబంధం “ప్రజలకు సంబంధించిన” లేదా “ప్రజల తరఫున” అని అర్థమవవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/פְתַֽחְיָה
  choice: పెతహయా
  rationale: వావ్ ఈ పరిపాలనా జాబితాలో అనుసంధానకంగా ఉంది; తెలుగులో వాక్యప్రవాహం సహజంగా ఉండేందుకు ప్రత్యేకంగా ‘మరియు’ అని ఇవ్వలేదు. పేరును హీబ్రూ ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించాం.
- source_word: בֶּן מְשֵֽׁיזַבְאֵל
  choice: మెషేజబేలు కుమారుడు
  rationale: హీబ్రూ వంశసంబంధ నిర్మాణాన్ని సహజమైన తెలుగు క్రమంలో నిలిపాం.
- source_word: מִ/בְּנֵי זֶרַח בֶּן יְהוּדָה
  choice: యూదా కుమారుడైన జెరహు వంశస్థులలో ఒకడు
  rationale: בני ఇక్కడ ప్రత్యక్ష కుమారులకన్నా వంశస్థులను సూచిస్తుంది; వంశపరంపరను స్పష్టంగా, సహజంగా తెలిపే రూపం ఎంచుకున్నాం.
- source_word: לְ/יַד הַ/מֶּלֶךְ
  choice: రాజుకు సహాయకుడిగా ఉన్నాడు
  rationale: అక్షరార్థంగా ‘రాజు చేతి దగ్గర’ అనే ఈ నుడికారం రాజసేవలోని అధికారిక సహాయం లేదా ప్రతినిధిత్వాన్ని సూచిస్తుంది. సందర్భానికి తగిన సహజ తెలుగు రూపాన్ని ప్రధాన పాఠ్యంలో ఇచ్చి, నిజమైన భావవిస్తృతిని పాదసూచికలో ఉంచాం.
- source_word: לְ/כָל דָּבָר
  choice: ప్రతి విషయంలో
  rationale: דבר ఇక్కడ మాటకన్నా పరిపాలనా విషయం లేదా వ్యవహారాన్ని సూచిస్తుంది.
- source_word: לָ/עָם
  choice: ప్రజలకు సంబంధించిన
  rationale: లామెద్ ప్రజలకు సంబంధించిన వ్యవహారాలను లేదా ప్రజల తరఫున జరిగే వ్యవహారాలను సూచించవచ్చు; ప్రధాన పాఠ్యంలో సంబంధార్థాన్ని ఎంచుకొని ప్రత్యామ్నాయాన్ని పాదసూచికలో తెలిపాం.
