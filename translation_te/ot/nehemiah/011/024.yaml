  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే పరిపాలనా శైలిని వాడాం. పేర్లను హీబ్రూ రూపాలకు దగ్గరగా లిప్యంతరీకరించాం; అస్పష్టమైన రెండు హీబ్రూ లామెద్ నిర్మాణాల భావవిస్తృతిని పాదసూచికలో కాపాడాం.
