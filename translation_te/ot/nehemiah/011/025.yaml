source:
  edition: WLC
  text: וְ/אֶל הַ/חֲצֵרִ֖ים בִּ/שְׂדֹתָ֑/ם מִ/בְּנֵ֣י יְהוּדָ֗ה יָֽשְׁב֞וּ בְּ/קִרְיַ֤ת הָֽאַרְבַּע֙ וּ/בְנֹתֶ֔י/הָ וּ/בְ/דִיבֹן֙ וּ/בְנֹתֶ֔י/הָ וּ/בִֽ/יקַּבְצְאֵ֖ל וַ/חֲצֵרֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/025.yaml
  text: As for the villages in their fields[a], some of the sons of Judah lived in Kiriath-arba and its villages, and in Dibon and its villages[c][b], and in Jekabzeel and its settlements.
translation:
  language: te
  text: వారి పొలాల్లోని గ్రామాల విషయానికొస్తే, యూదా కుమారుల్లో కొందరు కిర్యత్-అర్బాలో[a], దాని అనుబంధ గ్రామాల్లో[b], దీబోనులో, దాని అనుబంధ గ్రామాల్లో, యెకబ్సెయేలులో[c], దాని పల్లెల్లో నివసించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కిర్యత్-అర్బా అనేది హెబ్రోనుకు పూర్వపు పేరు; యెహోషువ 14:15 చూడండి.
    reason: cross_reference
  - marker: b
    text: హీబ్రూలో అక్షరార్థం ‘దాని కుమార్తెలు’; ఇది ఒక పట్టణంపై ఆధారపడిన లేదా దాని చుట్టూ ఉన్న గ్రామాలను సూచించే నుడికారం.
    reason: lexical_alternative
  - marker: c
    text: సంబంధిత కొన్ని పాఠసంప్రదాయాల్లోను వచనాల్లోను యెకబ్సెయేలు అనే పేరు ‘కబ్సెయేలు’ అని కూడా ఉంది.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֶל הַחֲצֵרִים בִּשְׂדֹתָם
  choice: వారి పొలాల్లోని గ్రామాల విషయానికొస్తే
  rationale: ఈ పదబంధం జాబితాలో కొత్త భౌగోళిక అంశాన్ని పరిచయం చేస్తుంది. חֲצֵרִים ఇక్కడ ప్రాంగణాలు కాక గ్రామీణ నివాసాలను సూచిస్తుంది; בִּשְׂדֹתָם లోని వ్యవసాయ భూముల భావాన్ని ‘పొలాల్లోని’ నిలుపుతుంది.
- source_word: מִבְּנֵי יְהוּדָה
  choice: యూదా కుమారుల్లో కొందరు
  rationale: מִן యొక్క భాగార్థాన్ని ‘కొందరు’ స్పష్టం చేస్తుంది; ‘యూదా కుమారులు’ అనే గోత్ర సంబంధిత హీబ్రూ వ్యక్తీకరణను లింగనిరపేక్షంగా మార్చకుండా నిలుపుతుంది.
- source_word: יָשְׁבוּ
  choice: నివసించారు
  rationale: క్రియ ప్రధానంగా నివాసాన్ని సూచిస్తుంది; కొత్తగా స్థిరపడటం అనే అదనపు భావాన్ని అనవసరంగా చేర్చదు.
- source_word: בְּקִרְיַת הָאַרְבַּע
  choice: కిర్యత్-అర్బాలో
  rationale: మూలంలోని స్థలనామాన్ని లిప్యంతరీకరించాం; హెబ్రోనుతో దాని గుర్తింపును వచనంలో చేర్చకుండా పాదసూచికలో ఇచ్చాం.
- source_word: וּבְנֹתֶיהָ
  choice: దాని అనుబంధ గ్రామాల్లో
  rationale: అక్షరార్థంగా ‘దాని కుమార్తెలు’ అయిన ఈ నుడికారం ప్రధాన పట్టణంపై ఆధారపడిన చుట్టుపక్కల గ్రామాలను సూచిస్తుంది. సహజమైన ఆధునిక తెలుగులో ఆ సంబంధాన్ని ‘అనుబంధ గ్రామాలు’ తెలియజేస్తుంది.
- source_word: וּבְדִיבוֹן
  choice: దీబోనులో
  rationale: స్థలనామాన్ని హీబ్రూ రూపానికి అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: וּבִיקַּבְצְאֵל
  choice: యెకబ్సెయేలులో
  rationale: మసొరెటిక్ పాఠంలోని రూపాన్ని లిప్యంతరీకరించాం; సంబంధిత సంప్రదాయాల్లోని ‘కబ్సెయేలు’ రూపాన్ని పాదసూచికలో నిలిపాం.
- source_word: וַחֲצֵרֶיהָ
  choice: దాని పల్లెల్లో
  rationale: ఇక్కడ కూడా చిన్న గ్రామీణ నివాసాలే ఉద్దేశం. ముందున్న בנות అనే ఆధీన గ్రామాల నుడికారంతో పదభేదాన్ని చూపుతూ సహజంగా ‘పల్లెలు’ అని అనువదించాం.
theological_decisions:
- issue: מִבְּנֵי יְהוּדָה లోని లింగసూచక గోత్రపదం
  choice: యూదా కుమారుల్లో కొందరు
  alternative: యూదా ప్రజల్లో కొందరు
  rationale: ఇది వంశ/గోత్ర గుర్తింపుకు చెందిన స్థిరమైన హీబ్రూ వ్యక్తీకరణ. మూలంలోని లింగసూచనను నిలుపుతూ, מִן తెలిపే భాగార్థాన్ని ‘కొందరు’ ద్వారా స్పష్టం చేశాం; పురుషులు మాత్రమే అక్కడ నివసించారనే అదనపు సిద్ధాంతార్థాన్ని దీనిపై మోపలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, జాబితా శైలికి తగిన గంభీరతతో సహజమైన వాక్యనిర్మాణం వాడాం. స్థలనామాలను మూల హీబ్రూ రూపాలకు దగ్గరగా లిప్యంతరీకరించాం. בנות మరియు חצרים మధ్య భావసంబంధాన్ని వరుసగా ‘అనుబంధ గ్రామాలు’, ‘పల్లెలు’ అనే పదాలతో చూపాం; పాదసూచిక గుర్తులను అవి నిజంగా వివరించే పదాల వెంట ఉంచాం.
