  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా చదవదగిన శైలిని ఉపయోగించాము. పొడవైన వంశావళిలో సంబంధాలు అయోమయం కాకుండా ‘అతడు’ను పునరావృతం చేశాము.
