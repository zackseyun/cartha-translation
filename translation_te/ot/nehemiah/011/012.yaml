id: NEH.11.12
reference: Nehemiah 11:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/אֲחֵי/הֶ֗ם עֹשֵׂ֤י הַ/מְּלָאכָה֙ לַ/בַּ֔יִת שְׁמֹנֶ֥ה מֵא֖וֹת עֶשְׂרִ֣ים וּ/שְׁנָ֑יִם וַ֠/עֲדָיָה בֶּן יְרֹחָ֤ם בֶּן פְּלַלְיָה֙ בֶּן אַמְצִ֣י בֶן זְכַרְיָ֔ה בֶּן פַּשְׁח֖וּר בֶּן מַלְכִּיָּֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/012.yaml
  text: And their brothers[a], doers of the work for the house, were eight hundred twenty-two; and Adaiah son of Jeroham, son of Pelaliah, son of Amzi, son of Zechariah, son of Pashhur, son of Malchijah.
translation:
  language: te
  text: మందిరం కోసం పని చేసేవారైన వారి సహోదరులు[a] ఎనిమిది వందల ఇరవై ఇద్దరు. మరియు యెరోహాము కుమారుడైన అదాయా; యెరోహాము పెలల్యా కుమారుడు, పెలల్యా అమ్సీ కుమారుడు, అమ్సీ జెకర్యా కుమారుడు, జెకర్యా పష్హూరు కుమారుడు, పష్హూరు మల్కీయా కుమారుడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆ ఇంటి కోసం పని చేసేవారైన వారి సహోదరులు.” ఇక్కడ “ఇల్లు” సందర్భానుసారంగా మందిరాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲחֵיהֶם
  choice: వారి సహోదరులు
  rationale: హీబ్రూ పదం అక్షరార్థంగా ‘వారి సహోదరులు’ అని ఉంది. సందర్భంలో వీరు తోటి యాజకులు కావచ్చు; అయితే వచనం వాడిన బంధుత్వ పదాన్నే అనువాదంలో నిలిపాము.
- source_word: עֹשֵׂי הַמְּלָאכָה לַבַּיִת
  choice: మందిరపు పనిని చేసేవారు
  rationale: అక్షరార్థం ‘ఆ ఇంటి కోసం పని చేసేవారు.’ సందర్భంలో ‘ఇల్లు’ దేవాలయాన్ని సూచిస్తుంది. సహజమైన ఆధునిక తెలుగులో భావాన్ని స్పష్టంగా తెలియజేయడానికి ‘మందిరం’ వాడబడింది; అక్షరార్థ రూపం పాదసూచికలో ఇవ్వబడింది.
- source_word: שְׁמֹנֶה מֵאוֹת עֶשְׂרִים וּשְׁנָיִם
  choice: ఎనిమిది వందల ఇరవై ఇద్దరు
  rationale: వ్యక్తుల సంఖ్యను తెలుగులో సహజమైన సంఖ్యారూపంలో ఇచ్చాము.
- source_word: וַעֲדָיָה
  choice: ఇంకా అదాయా
  rationale: వావ్ సంధిని జాబితాను కొనసాగించే సహజ తెలుగు పదమైన ‘ఇంకా’తో వ్యక్తపరిచాము.
- source_word: בֶּן
  choice: కుమారుడు
  rationale: వంశావళి సూత్రంలోని సాధారణ అర్థాన్ని నిలిపాము. మధ్య తరాలు విడిచిపెట్టబడి ఉండే అవకాశం ఉన్నా, మూలంలోని సంబంధాన్ని ‘వంశస్థుడు’గా సాధారణీకరించలేదు.
- source_word: יְרֹחָם / פְּלַלְיָה / אַמְצִי / זְכַרְיָה / פַּשְׁחוּר / מַלְכִּיָּה
  choice: యెరోహాము / పెలల్యా / అమ్సీ / జెకర్యా / పష్హూరు / మల్కీయా
  rationale: వ్యక్తి పేర్లను హీబ్రూ రూపాలకు దగ్గరగా తెలుగు లిప్యంతరీకరణ చేశాము.
