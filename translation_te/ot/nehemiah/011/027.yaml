  text: and in Hazar-shual[a], and in Beer-sheba and its villages.
translation:
  language: te
  text: హజర్-షూయాలులో, బెయేర్-షెబాలో, దానికి చెందిన గ్రామాల్లో[a] నివసించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “దాని కుమార్తెలలో”; ఇది ఒక పట్టణానికి చెందిన లేదా దానికి అనుబంధంగా ఉన్న గ్రామాలు లేదా నివాస ప్రాంతాలను సూచించే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בַ/חֲצַר שׁוּעָל
  choice: హజర్-షూయాలులో
  rationale: భౌగోళిక స్థలనామాన్ని అర్థానువాదం చేయకుండా, హీబ్రూ ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించి, בַ ‘లో’ అనే భావాన్ని తెలుగు విభక్తితో వ్యక్తం చేశాం.
- source_word: וּ/בִ/בְאֵר שֶׁבַע
  choice: బెయేర్-షెబాలో
  rationale: ప్రసిద్ధ స్థలనామాన్ని దాని సాధ్యమైన వ్యుత్పత్తి అర్థాలైన ‘ఏడు బావి’ లేదా ‘ప్రమాణ బావి’గా అనువదించకుండా లిప్యంతరీకరించాం; בִ భావాన్ని ‘లో’తో తెలిపాం.
- source_word: וּ/בְנֹתֶיהָ
  choice: దాని చుట్టుపక్కల గ్రామాల్లో
  rationale: బహువచన בנות అక్షరార్థంగా ‘కుమార్తెలు’ అయినా, పట్టణానికి అనుబంధంగా ఉన్న చిన్న గ్రామాలు లేదా నివాస ప్రాంతాలను సూచించే భౌగోళిక నుడికారమిది. 3 స్త్రీలింగ ఏకవచన ప్రత్యయం బెయేర్-షెబాను సూచిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ఈ వచనం ముందున్న నివాసుల జాబితా వాక్యాన్ని కొనసాగిస్తున్నందున, తెలుగులో వాక్యం సంపూర్ణంగా ఉండేందుకు సందర్భం నుంచి ‘నివసించారు’ను చేర్చాం. ప్రతి స్థలనామం వద్ద ‘మరియు’ను పునరావృతం చేయకుండా జాబితా నిర్మాణాన్ని సహజ తెలుగు విరామచిహ్నాలతో చూపించాం.
