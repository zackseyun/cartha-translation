translation_notes:
  register: వంశావళి సంబంధాలు ఎవరికీ వర్తిస్తాయో స్పష్టంగా ఉండేందుకు ప్రతి తరంలో పేరును పునరుక్తి చేశాం. భాష ఆధునిక, గౌరవప్రదమైన ప్రామాణిక తెలుగులో ఉంది. మూలంలోని పరిపాలనా పదమైన נְגִיד యొక్క అర్థపరిధిని ప్రధాన పాఠ్యంలో ‘నాయకుడు’గా ఉంచి, ప్రత్యామ్నాయాలను పాదటిప్పణిలో సంరక్షించాం.
