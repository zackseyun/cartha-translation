  text: שְׂרָיָ֨ה בֶן חִלְקִיָּ֜ה בֶּן מְשֻׁלָּ֣ם בֶּן צָד֗וֹק בֶּן מְרָיוֹת֙ בֶּן אֲחִיט֔וּב נְגִ֖ד בֵּ֥ית הָ/אֱלֹהִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/011.yaml
  text: Seraiah son of Hilkiah[a], son of Meshullam, son of Zadok, son of Meraioth, son of Ahitub[b], leader of the house of God.
translation:
  language: te
  text: హిల్కీయా కుమారుడైన శెరాయా, మెషుల్లాము కుమారుడైన హిల్కీయా, సాదోకు కుమారుడైన మెషుల్లాము, మెరాయోతు కుమారుడైన సాదోకు, అహీటూబు కుమారుడైన మెరాయోతు—దేవుని మందిరానికి[b] నాయకుడు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ప్రధానుడు’, ‘పర్యవేక్షకుడు’.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా ‘దేవుని ఇల్లు’; అంటే దేవాలయం.
    reason: cultural_note
lexical_decisions:
- source_word: שְׂרָיָה
  choice: శెరాయా
  rationale: వ్యక్తి పేరును ఆధునిక ప్రామాణిక తెలుగు బైబిలు నామరూపానికి అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: בֶן
  choice: కుమారుడు
  rationale: ఇక్కడ పునరావృతమయ్యే వంశావళి సూత్రానికి సహజమైన అర్థం ‘కుమారుడు’. వంశావళుల్లో కొన్నిసార్లు ‘వంశస్థుడు’ అనే విస్తృత అర్థం సాధ్యమైనా, ఈ సందర్భంలో దానిని ప్రధాన పాఠ్యంలో పెట్టాల్సిన అవసరం లేదు.
- source_word: נְגִיד
  choice: నాయకుడు
  rationale: ఈ పదం నియమించబడిన నాయకుణ్ణి లేదా బాధ్యత వహించే అధికారిని సూచిస్తుంది. ‘నాయకుడు’ రాజరిక భావాన్ని అతిగా చేర్చకుండా యాజక-పరిపాలనా సందర్భానికి సరిపోతుంది; ఇతర సాధ్యమైన అర్థాలను పాదటిప్పణిలో ఉంచాం.
- source_word: בֵּית הָאֱלֹהִים
  choice: దేవుని మందిరం
  rationale: అక్షరార్థం ‘దేవుని ఇల్లు’; సందర్భంలో ఇది దేవాలయాన్ని సూచిస్తుంది. సాధారణ ఆధునిక తెలుగులో పవిత్ర స్థలాన్ని సహజంగా, గౌరవప్రదంగా తెలిపేందుకు ‘మందిరం’ వాడాం; అక్షరార్థాన్ని పాదటిప్పణిలో తెలిపాం.
- source_word: הָאֱלֹהִים
  choice: దేవుడు
  rationale: ఈ నిర్మాణంలో אֱלֹהִים ఇశ్రాయేలు దేవుణ్ణి సూచిస్తుంది; అందువల్ల ఏకవచన భావంతో ‘దేవుడు’ అని అనువదించాం.
