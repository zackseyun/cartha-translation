  yaml_path: translation/ot/nehemiah/011/026.yaml
  text: and in Jeshua[a], and in Moladah, and in Beth-pelet;
translation:
  language: te
  text: మరియు యేషూవాలోను, మోలాదాలోను, బేత్-పెలెట్‌లోను నివసించారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/בְ
  choice: -లో
  rationale: ప్రతి స్థలపేరుకు ముందు పునరావృతమైన בְ యొక్క స్థానార్థాన్ని తెలుగు విభక్తి ‘-లో’ సహజంగా తెలియజేస్తుంది. వాక్యప్రవాహం కోసం చివర క్రియను చేర్చినందున וּ ను ప్రతిసారీ ‘మరియు’గా వ్యక్తం చేయలేదు.
- source_word: יֵשׁוּעַ
  choice: యేషూవ
  rationale: ఇది స్థలపేరు; అనువదించకుండా హీబ్రూ ఉచ్చారణకు సమీపంగా లిప్యంతరీకరించబడింది.
- source_word: מוֹלָדָה
  choice: మోలాదా
  rationale: ఇది స్థలపేరు కాబట్టి హీబ్రూ రూపానికి సమీపంగా లిప్యంతరీకరించబడింది.
- source_word: בֵית פָּלֶט
  choice: బేత్-పెలేత్
  rationale: సంయుక్త స్థలపేరుగా లిప్యంతరీకరించబడింది; హైఫన్ దాని రెండు భాగాలను స్పష్టంగా చూపుతుంది.
- source_word: '[ellipsis: settlement verb supplied from context]'
  choice: నివసించారు
  rationale: హీబ్రూ జాబితాలో క్రియ సందర్భం నుంచి గ్రహించబడుతుంది; ఆధునిక తెలుగులో ఈ వాక్యఖండం సహజంగా, స్పష్టంగా ఉండేందుకు ‘నివసించారు’ చేర్చబడింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన నివాసస్థలాల జాబితాగా ఇచ్చాం. మూలంలోని స్థలపేర్లను అనువదించకుండా లిప్యంతరీకరించాం. అందించిన ఆంగ్ల పాదసూచిక యేషూవ వద్ద గుర్తు పెట్టినా దాని వివరణ బేత్-పెలేత్‌కు సంబంధించినదిగా అసంగతంగా ఉంది; పైగా ఆ పేరుకు సాధ్యమైన వ్యుత్పత్తి అనిశ్చితమైనది, కాబట్టి తెలుగు ముసాయిదాలో దానిని చేర్చలేదు.
