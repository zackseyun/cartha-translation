review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the number, the kinship/group term, and the personal names, but it reverses every father–son relationship in the genealogy. Hebrew presents Amashsai as son of Azarel, son of Ahzai, son of Meshillemoth, son of Immer; the draft instead makes Immer a son of Meshillemoth and ultimately of Amashsai. Reordering the names in Telugu is not safe when it changes the stated relationships.
  naturalness: The opening census-style clause is clear in modern standard Telugu. The revised genealogical formulation uses a compact chain with repeated “he” to remain natural while preserving the Hebrew sequence.
  terminology: “పితృకుటుంబాల ప్రధానులు” appropriately conveys רָאשִׁים לְאָבוֹת (“heads of fathers’ houses”) in accessible modern Telugu. “సహోదరులు” is suitably literal for the broader clan-group sense of the Hebrew. The names are retained as transliterations of the Masoretic forms.
  issues:
  - severity: high
    issue: The genealogy is reversed.
    rationale: The draft's explanatory note says the genealogy was reordered for Telugu, but its wording changes the direction of each בן relation and thus changes who is the father of whom. The translation must retain Amashsai → Azarel → Ahzai → Meshillemoth → Immer as son-to-father succession.
  revised_text: అతని సహోదరులు, పితృకుటుంబాల ప్రధానులు, 242 మంది; ఇంకా అమష్సయి—అజరేలు కుమారుడు, అతడు అహ్జయి కుమారుడు, అతడు మెషిల్లేమోతు కుమారుడు, అతడు ఇమ్మేరు కుమారుడు.
  revised_footnotes: []
  revision_rationale: 'The revision corrects the genealogy without importing interpretive material. It preserves the Hebrew word order and the repeated father–son formula through a natural Telugu genealogical chain. No footnotes are required: the number is unambiguous, and the English audit-trail alternatives do not require an anchor in this Telugu rendering.'
