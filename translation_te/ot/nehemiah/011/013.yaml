revisions:
- from: అతని సహోదరులు—పితృ వంశాల పెద్దలు—242 మంది; ఇంకా ఇమ్మేరు కుమారుడైన మెషిల్లేమోతు కుమారుడు, అహ్జయి కుమారుడు, అజరేలు కుమారుడైన అమష్సయి.
  to: అతని సహోదరులు, పితృకుటుంబాల ప్రధానులు, 242 మంది; ఇంకా అమష్సయి—అజరేలు కుమారుడు, అతడు అహ్జయి కుమారుడు, అతడు మెషిల్లేమోతు కుమారుడు, అతడు ఇమ్మేరు కుమారుడు.
  rationale: 'The revision corrects the genealogy without importing interpretive material. It preserves the Hebrew word order and the repeated father–son formula through a natural Telugu genealogical chain. No footnotes are required: the number is unambiguous, and the English audit-trail alternatives do not require an anchor in this Telugu rendering.'
