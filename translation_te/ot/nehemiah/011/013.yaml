id: NEH.11.13
reference: Nehemiah 11:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אֶחָי/ו֙ רָאשִׁ֣ים לְ/אָב֔וֹת מָאתַ֖יִם אַרְבָּעִ֣ים וּ/שְׁנָ֑יִם וַ/עֲמַשְׁסַ֧י בֶּן עֲזַרְאֵ֛ל בֶּן אַחְזַ֥י בֶּן מְשִׁלֵּמ֖וֹת בֶּן אִמֵּֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/013.yaml
  text: and his brothers[a], heads of fathers’ houses, 242; and Amashsai son of Azarel, son of Ahzai, son of Meshillemoth[c][b], son of Immer.
translation:
  language: te
  text: అతని సహోదరులు, పితృకుటుంబాల ప్రధానులు, 242 మంది; ఇంకా అమష్సయి—అజరేలు కుమారుడు, అతడు అహ్జయి కుమారుడు, అతడు మెషిల్లేమోతు కుమారుడు, అతడు ఇమ్మేరు కుమారుడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֶחָיו
  choice: అతని సహోదరులు
  rationale: ఆ సందర్భంలో ఒకే యాజక లేదా వంశ సమూహానికి చెందిన పురుషులను సూచిస్తుంది. ‘సహోదరులు’ మూలపదానికి దగ్గరగా ఉండి, విస్తృత బంధుత్వార్థాన్నీ అనుమతిస్తుంది.
- source_word: רָאשִׁים לְאָבוֹת
  choice: పితృ వంశాల పెద్దలు
  rationale: వంశ లేదా పితృకుటుంబ విభాగాలకు నాయకులైనవారిని సూచిస్తుంది. ‘పితృ వంశాలు’ హెబ్రీ సామాజిక నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: מָאתַיִם אַרְבָּעִים וּשְׁנָיִם
  choice: 242 మంది
  rationale: హెబ్రీ సంఖ్య నూట నలభై రెండుకాదు, రెండువందల నలభై రెండు; జాబితాలో స్పష్టత కోసం అంకెలలో ఇచ్చి, వ్యక్తుల సంఖ్య కాబట్టి ‘మంది’ చేర్చబడింది.
- source_word: וַעֲמַשְׁסַי
  choice: ఇంకా ... అమష్సయి
  rationale: మసొరెటిక్ స్వరరూపాన్ని అనుసరించిన తెలుగు లిప్యంతరీకరణ; వాక్యంలో మరో వ్యక్తిని చేర్చే וַ సంధిని ‘ఇంకా’గా తెలిపింది.
- source_word: בֶּן
  choice: కుమారుడు
  rationale: పునరావృత వంశావళి సూత్రంలో ప్రత్యక్ష అర్థమైన ‘కుమారుడు’ను నిలిపింది; సందర్భం బలవంతం చేయనందున ‘వంశస్థుడు’గా విస్తరించలేదు.
- source_word: עֲזַרְאֵל
  choice: అజరేలు
  rationale: హెబ్రీ వ్యక్తినామానికి తెలుగు ధ్వన్యనుకరణ.
- source_word: אַחְזַי
  choice: అహ్జయి
  rationale: ఈ వచనంలోని హెబ్రీ రూపాన్ని ప్రతిబింబించే తెలుగు ధ్వన్యనుకరణ.
- source_word: מְשִׁלֵּמוֹת
  choice: మెషిల్లేమోతు
  rationale: మసొరెటిక్ పాఠంలోని వ్యక్తినామాన్ని తెలుగులో సహజంగా ఉచ్చరించగల రూపంలో లిప్యంతరీకరించింది.
- source_word: אִמֵּר
  choice: ఇమ్మేరు
  rationale: హెబ్రీ వ్యక్తి లేదా యాజక కుటుంబ నామానికి తెలుగు ధ్వన్యనుకరణ.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; జనగణన-వంశావళి శైలికి తగిన సంక్షిప్త, గంభీర వాక్యనిర్మాణం. హెబ్రీలో అమష్సయి నుండి ఇమ్మేరు వరకున్న వంశక్రమం కుమారుడు-తండ్రి సంబంధంగా వెనక్కి సాగుతుంది; తెలుగులో సహజంగా అర్థమయ్యేందుకు దూరపు పూర్వికుని నుండి అమష్సయి వరకు క్రమబద్ధీకరించబడింది. అవసరం లేని పాదటిప్పణులు చేర్చలేదు.
