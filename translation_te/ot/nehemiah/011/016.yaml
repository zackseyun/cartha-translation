translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన శైలిని ఉపయోగించాం. ‘దేవుని ఇల్లు’ అనే అక్షరార్థ రూపం కంటే సందర్భానుసారంగా సహజమైన ‘దేవుని మందిరం’ను ఎంచుకున్నాం; ‘బయటి పని’ అనే పదబంధంలో మూలంలోని అర్థసందిగ్ధతను పాదసూచిక ద్వారా నిలిపాం.
