  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/שַׁבְּתַ֨י וְ/יוֹזָבָ֜ד עַל הַ/מְּלָאכָ֤ה הַ/חִֽיצֹנָה֙ לְ/בֵ֣ית הָ/אֱלֹהִ֔ים מֵ/רָאשֵׁ֖י הַ/לְוִיִּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/016.yaml
  text: And Shabbethai and Jozabad[a], from the heads of the Levites, were over the outside work of the house of God.
translation:
  language: te
  text: లేవీయుల నాయకులలోనివారైన షబ్బెతై, యోజాబాదు దేవుని మందిరానికి సంబంధించిన బయటి పనికి బాధ్యులుగా ఉన్నారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దేవుని మందిరం కోసం చేసే వెలుపలి పని.’ హీబ్రూ పదబంధం మందిరానికి సంబంధించిన లోపలి విధులకంటే భిన్నమైన వెలుపలి పనిని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׁבְּתַי וְיוֹזָבָד
  choice: షబ్బెతై, యోజాబాదు
  rationale: వ్యక్తుల పేర్లను అనువదించకుండా, ఆధునిక తెలుగు బైబిలు నామరూపాలకు అనుగుణంగా లిప్యంతరీకరించాం. వాక్యం జాబితాలో కొనసాగుతున్నప్పటికీ, తెలుగులో ఆరంభ ‘మరియు’ అవసరం లేకుండా సహజంగా నిర్మించాం.
- source_word: עַל הַמְּלָאכָה
  choice: పని పర్యవేక్షణలో ఉన్నారు
  rationale: ఈ పరిపాలనా సందర్భంలో עַל బాధ్యత లేదా పర్యవేక్షణను సూచిస్తుంది; מְלָאכָה విస్తృతంగా ‘పని’ని సూచిస్తుంది. ఈ రెండింటినీ కలిపి సహజమైన తెలుగులో బాధ్యత భావాన్ని వ్యక్తం చేశాం.
- source_word: הַחִיצֹנָה
  choice: బయటి
  rationale: ఈ విశేషణం ‘బయటి/వెలుపలి’ అనే అర్థం ఇస్తుంది. మందిరం లోపలి విధులకు భిన్నమైన పనిని సూచించే అవకాశాన్ని, అదనపు నిర్దిష్టత చేర్చకుండా నిలిపాం.
- source_word: לְבֵית הָאֱלֹהִים
  choice: దేవుని మందిరానికి సంబంధించిన
  rationale: לְ ఇక్కడ మందిరం కొరకు చేసిన పని లేదా మందిరానికి సంబంధించిన పని అనే సంబంధాన్ని సూచించవచ్చు. ‘సంబంధించిన’ అనే రూపం ఆ సంబంధాన్ని సహజంగా, అతిగా నిర్దిష్టం చేయకుండా తెలియజేస్తుంది.
- source_word: מֵרָאשֵׁי הַלְוִיִּם
  choice: లేవీయుల నాయకులలో
  rationale: מִן సమూహంలోనివారు అనే భావాన్ని, רָאשִׁים నాయకత్వ స్థానాన్ని సూచిస్తున్నాయి. ‘లేవీయుల నాయకులలో’ అనే రూపం రెండింటినీ సంక్షిప్తంగా నిలుపుతుంది.
