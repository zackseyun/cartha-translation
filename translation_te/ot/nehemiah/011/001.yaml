translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. హీబ్రూ ప్రారంభ וַ־కు మూలంలో లేని కాలసూచక పదాన్ని జోడించలేదు. పొడవైన వాక్యాన్ని చదవడానికి సులభంగా రెండు వాక్యాలుగా విభజించినప్పటికీ మూలంలోని భావసంబంధం నిలుపబడింది.
