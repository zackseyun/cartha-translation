source:
  edition: WLC
  text: וַ/יֵּשְׁב֥וּ שָׂרֵֽי הָ/עָ֖ם בִּ/ירוּשָׁלִָ֑ם וּ/שְׁאָ֣ר הָ֠/עָם הִפִּ֨ילוּ גוֹרָל֜וֹת לְ/הָבִ֣יא אֶחָ֣ד מִן הָ/עֲשָׂרָ֗ה לָ/שֶׁ֨בֶת֙ בִּֽ/ירוּשָׁלִַ֨ם֙ עִ֣יר הַ/קֹּ֔דֶשׁ וְ/תֵ֥שַׁע הַ/יָּד֖וֹת בֶּ/עָרִֽים־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/001.yaml
  text: The officials of the people lived in Jerusalem[a], and the rest of the people cast lots to bring one out of ten to live in Jerusalem, the holy city, while nine parts remained in the towns.
translation:
  language: te
  text: ప్రజల అధికారులు యెరూషలేములో నివసించారు. మిగిలిన ప్రజలు ప్రతి పది మందిలో ఒకరిని పరిశుద్ధ నగరమైన యెరూషలేములో నివసించేందుకు రప్పించడానికి చీట్లు వేశారు; మిగిలిన తొమ్మిది భాగాలు పట్టణాల్లోనే ఉండిపోయాయి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “పట్టణాల్లో తొమ్మిది చేతులు.” ఇది పదిలో మిగిలిన తొమ్మిది భాగాలు ఇతర పట్టణాల్లో ఉండిపోయాయని తెలిపే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרֵי הָעָם
  choice: ప్రజల అధికారులు
  rationale: שָׂרִים పరిపాలనా బాధ్యతగల నాయకులు లేదా అధికారులను సూచిస్తుంది. ఈ సందర్భంలో ‘అధికారులు’ సహజంగాను నిర్దిష్టంగాను ఉంది.
- source_word: וַיֵּשְׁבוּ / לָשֶׁבֶת
  choice: నివసించారు / నివసించేలా
  rationale: ישׁב ఇక్కడ కూర్చోవడం కాక ఒకచోట నివాసం ఉండడాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘నివసించు’ స్పష్టంగా ఉంటుంది.
- source_word: הִפִּילוּ גוֹרָלוֹת
  choice: చీట్లు వేశారు
  rationale: ఎంపిక కోసం చీట్లు వేసే ప్రక్రియను తెలిపే సహజమైన తెలుగు నుడికారం.
- source_word: לְהָבִיא
  choice: రప్పించడానికి
  rationale: בוא హిఫీల్ రూపం ఎంపికైనవారు యెరూషలేముకు వచ్చేలా చేయడాన్ని సూచిస్తుంది; ‘రప్పించు’ ఈ కారక భావాన్ని కాపాడుతుంది.
- source_word: אֶחָד מִן הָעֲשָׂרָה
  choice: ప్రతి పదిమందిలో ఒకరిని
  rationale: ఎంపిక నిష్పత్తిని సాధారణ పాఠకునికి స్పష్టంగా తెలియజేస్తుంది.
- source_word: עִיר הַקֹּדֶשׁ
  choice: పరిశుద్ధ పట్టణం
  rationale: నిర్మాణబద్ధమైన హీబ్రూ పదబంధానికి నేరమైన, గౌరవప్రదమైన సమానార్థకం.
- source_word: וְתֵשַׁע הַיָּדוֹת
  choice: మిగిలిన తొమ్మిది భాగాలవారు
  rationale: అక్షరార్థంగా ‘తొమ్మిది చేతులు’ అయిన ఈ నుడికారం పదిలో మిగిలిన తొమ్మిది భాగాలను సూచిస్తుంది. వ్యక్తుల సందర్భానికి అనుగుణంగా ‘భాగాలవారు’ అని సహజంగా అందించబడింది; అక్షర రూపం పాదసూచికలో నిలుపబడింది.
- source_word: בֶּעָרִים
  choice: పట్టణాల్లో
  rationale: యెరూషలేముకు భిన్నమైన యూదా జనావాస కేంద్రాలను సూచించడానికి ‘పట్టణాలు’ తగిన పదం.
