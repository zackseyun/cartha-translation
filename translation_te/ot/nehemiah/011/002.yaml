  edition: WLC
  text: וַֽ/יְבָרֲכ֖וּ הָ/עָ֑ם לְ/כֹל֙ הָֽ/אֲנָשִׁ֔ים הַ/מִּֽתְנַדְּבִ֔ים לָ/שֶׁ֖בֶת בִּ/ירוּשָׁלִָֽם׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/002.yaml
  text: And the people blessed all the men who willingly offered themselves to live in Jerusalem[a].
translation:
  language: te
  text: ప్రజలు యెరూషలేములో నివసించడానికి స్వచ్ఛందంగా ముందుకు వచ్చిన పురుషులందరినీ దీవించారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యెరూషలేములో నివసించడానికి తమను తాము స్వచ్ఛందంగా సమర్పించుకున్న పురుషులందరినీ.”
    reason: హిత్పయేల్ రూపంలోని స్వీయ సమర్పణ భావాన్ని మరింత స్పష్టంగా చూపే పదప్రయోగ ప్రత్యామ్నాయం.
lexical_decisions:
- source_word: וַיְבָרֲכוּ
  choice: దీవించారు
  rationale: పీయేల్ రూపంలోని ברך సాధారణంగా ‘దీవించు’ అని అర్థం. ఇక్కడ మనుషులు కర్మగా ఉన్నప్పటికీ, కేవలం ‘ప్రశంసించారు’ అని సరళీకరించకుండా ఆశీర్వాదం పలికిన భావాన్ని నిలుపుతుంది.
- source_word: הָעָם
  choice: ప్రజలు
  rationale: עם అనే సమూహవాచకానికి సహజమైన, ప్రామాణిక తెలుగు రూపం.
- source_word: לְכֹל הָאֲנָשִׁים
  choice: పురుషులందరినీ
  rationale: אֲנָשִׁים ఇక్కడ వ్యాకరణపరంగా పుంలింగ రూపం; దానిని లింగతటస్థంగా మార్చకుండా మూలంలోని నిర్దిష్టతను నిలుపుతుంది.
- source_word: הַמִּתְנַדְּבִים
  choice: స్వచ్ఛందంగా ముందుకు వచ్చిన
  rationale: נדב హిత్పయేల్ రూపం స్వచ్ఛందమైన స్వీయ సమర్పణ లేదా సంసిద్ధతను సూచిస్తుంది. ఆధునిక తెలుగులో సహజంగా ఉండేలా ‘స్వచ్ఛందంగా ముందుకు వచ్చిన’ అని అనువదించబడింది.
- source_word: לָשֶׁבֶת
  choice: నివసించడానికి
  rationale: ఈ సందర్భంలో ישב అంటే యెరూషలేములో స్థిరంగా ఉండటం లేదా నివసించడం; ‘నివసించడానికి’ ఆధునిక ప్రామాణిక తెలుగులో సహజంగా ఉంది.
- source_word: בִּירוּשָׁלִָם
  choice: యెరూషలేములో
  rationale: స్థలనామానికి, దాని స్థానార్థక ఉపసర్గకు ప్రామాణిక తెలుగు రూపం.
theological_decisions:
- issue: הָאֲנָשִׁים యొక్క లింగ సూచన
  choice: పురుషులందరినీ
  alternative: అందరినీ / ప్రజలందరినీ
  rationale: హీబ్రూ పాఠం సాధారణ సమూహవాచకానికి బదులు పుంలింగ నామవాచకాన్ని ఉపయోగిస్తుంది. సందర్భం దానిని తప్పనిసరిగా లింగతటస్థంగా చేయనందున పుంలింగ సూచన నిలుపబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే సహజమైన, గౌరవప్రదమైన శైలి. ‘దీవించారు’ మూలంలోని ఆశీర్వాద భావాన్ని, ‘స్వచ్ఛందంగా ముందుకు వచ్చిన’ స్వచ్ఛంద సంసిద్ధతను నిలుపుతాయి.
