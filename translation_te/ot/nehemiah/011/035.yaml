lexical_decisions:
- source_word: לֹד
  choice: లోదు
  rationale: ఇది స్థల నామం; హెబ్రీ ఉచ్చారణను అనుసరించి తెలుగులో లిప్యంతరీకరించబడింది.
- source_word: וְ/אוֹנוֹ
  choice: ఓనో
  rationale: ఇది సంధాన అవ్యయంతో కూడిన స్థల నామం. జాబితా శైలికి సహజంగా ఉండేలా ముందున్న కామాతో అనుసంధానం వ్యక్తమవుతుంది; పేరును లిప్యంతరీకరించాం.
- source_word: גֵּי
  choice: లోయ
  rationale: ఇది సంబంధ నిర్మాణంలోని ‘లోయ’ అనే నామవాచకం; తెలుగులో ‘వృత్తికారుల లోయ’ అనే సహజమైన సంబంధ రూపంతో వ్యక్తమైంది.
- source_word: הַחֲרָשִׁים
  choice: వృత్తికారుల
  rationale: ఈ పదం సాధారణంగా నైపుణ్యంతో చేతివృత్తి చేసే వారిని సూచించవచ్చు; కొన్ని సందర్భాల్లో ప్రత్యేకంగా కమ్మరులను కూడా సూచిస్తుంది. స్థల నామంలోని విస్తృత అర్థాన్ని నిలుపుకోవడానికి ‘వృత్తికారుల’ అని అనువదించాం.
