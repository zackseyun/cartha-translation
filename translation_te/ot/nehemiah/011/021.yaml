  edition: WLC
  text: וְ/הַ/נְּתִינִ֖ים יֹשְׁבִ֣ים בָּ/עֹ֑פֶל וְ/צִיחָ֥א וְ/גִשְׁפָּ֖א עַל הַ/נְּתִינִֽים־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/021.yaml
  text: And the temple servants were living on the Ophel[a], and Ziha and Gishpa were over the temple servants.
translation:
  language: te
  text: దేవాలయ సేవకులు[a] ఓఫెలులో నివసించేవారు. జీహా, గిష్పా దేవాలయ సేవకులకు బాధ్యులుగా ఉండేవారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ‘నెతీనీములు’; దేవాలయ సేవకు నియమితమైన ప్రత్యేక వర్గానికి వాడే సాంకేతిక పదం.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנְּתִינִים
  choice: దేవాలయ సేవకులు
  rationale: నెతీనీము అనే హీబ్రూ పదం దేవాలయ సేవకు నియమించబడిన ఒక ప్రత్యేక వర్గాన్ని సూచించే సాంకేతిక పదం. దాని విధిని ఆధునిక తెలుగు పాఠకులకు స్పష్టంగా తెలియజేయడానికి ‘దేవాలయ సేవకులు’ అని అనువదించబడింది.
- source_word: יֹשְׁבִים
  choice: నివసిస్తూ ఉండేవారు
  rationale: హీబ్రూ కృదంత రూపం కొనసాగుతున్న నివాసాన్ని సూచిస్తుంది; ఈ తెలుగు ప్రయోగం ఆ కాలవ్యాప్త భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: בָּעֹפֶל
  choice: ఓఫెలు మీద
  rationale: ఓఫెలు ఎత్తైన కోటప్రాంతం లేదా కొండవాలును సూచించే స్థలనామం. హీబ్రూ విభక్తి, భౌగోళిక స్వభావం రెండింటినీ దృష్టిలో ఉంచుకొని ‘మీద’ అని ఇవ్వబడింది.
- source_word: צִיחָא
  choice: జీహా
  rationale: వ్యక్తినామాన్ని హీబ్రూ ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించబడింది.
- source_word: גִשְׁפָּא
  choice: గిష్పా
  rationale: వ్యక్తినామాన్ని హీబ్రూ ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించబడింది.
- source_word: עַל
  choice: పై అధికారులుగా ఉండేవారు
  rationale: ఈ పరిపాలనా సందర్భంలో ఈ పదం పర్యవేక్షణ లేదా అధికార బాధ్యతను సూచిస్తుంది. మూలంలోని సంక్షిప్త నిర్మాణాన్ని నిలుపుతూ తెలుగులో స్పష్టంగా ఉండేలా అనువదించబడింది.
