translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన శైలి వాడబడింది. పరిపాలనా భావాన్ని స్పష్టంగా తెలియజేస్తూనే మూలంలోని పదబంధ నిర్మాణానికి సాధ్యమైనంత దగ్గరగా ఉంచబడింది.
