- from: దేవాలయ సేవకులు[a] ఓఫెలు మీద నివసిస్తూ ఉండేవారు. జీహా, గిష్పా దేవాలయ సేవకులపై అధికారులుగా ఉండేవారు.
  to: దేవాలయ సేవకులు[a] ఓఫెలులో నివసించేవారు. జీహా, గిష్పా దేవాలయ సేవకులకు బాధ్యులుగా ఉండేవారు.
