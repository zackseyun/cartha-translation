translation:
  language: te
  text: బెన్యామీను వంశస్థులు గెబ నుండి మిక్మాషు, అయ్యా[a], బేతేలు, దాని గ్రామాల్లో నివసించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఆయి’; ఇక్కడి హీబ్రూ రూపం עַיָּה (అయ్యా). ఇది అదే స్థలాన్ని లేదా దానికి దగ్గరగా సంబంధమున్న స్థలనామాన్ని సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: וּבְנֵי בִנְיָמִן
  choice: బెన్యామీను వంశస్థులు
  rationale: అక్షరార్థంగా ‘బెన్యామీను కుమారులు’; ఈ నివాసస్థలాల జాబితాలో గోత్ర సభ్యులు లేదా వంశస్థులు అనే భావం. ఆధునిక తెలుగులో సహజంగా ఉండేందుకు ‘వంశస్థులు’ వాడబడింది.
- source_word: מִגָּבַע
  choice: గెబ నుండి
  rationale: మִן ఉపసర్గ ఆరంభస్థానాన్ని సూచిస్తుంది; తరువాతి స్థలనామాలతో కలిసి గెబ మొదలైన ప్రాంతాల్లో వారి నివాసాన్ని తెలిపే జాబితాగా అర్థమవుతుంది.
- source_word: מִכְמָשׂ
  choice: మిక్మాషు
  rationale: హీబ్రూ స్థలనామానికి తెలుగు లిప్యంతరీకరణ.
- source_word: וְעַיָּה
  choice: అయ్యా
  rationale: మసొరేటిక్ రూపం עַיָּה ను నేరుగా ప్రతిబింబించే లిప్యంతరీకరణ; ‘హాయి’ అనే సంబంధిత స్థలనామ పఠనాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: וּבֵית אֵל
  choice: బేతేలు
  rationale: హీబ్రూ స్థలనామం בֵּית־אֵל కు తెలుగులో సుపరిచితమైన లిప్యంతరీకరణ.
- source_word: וּבְנֹתֶיהָ
  choice: దాని గ్రామాల్లో
  rationale: అక్షరార్థంగా ‘దాని కుమార్తెలు’; ప్రధాన పట్టణానికి అనుబంధమైన గ్రామాలు లేదా చిన్న నివాసాలను సూచించే హీబ్రూ నుడికారం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, జాబితా స్వభావాన్ని కాపాడుతూ సహజమైన పూర్తి వాక్యంగా అనువదించబడింది. ‘కుమారులు’ అనే అక్షరార్థానికి బదులు సందర్భానుసారంగా ‘వంశస్థులు’, ‘కుమార్తెలు’ అనే స్థలనుడికారానికి బదులు ‘గ్రామాలు’ వాడబడ్డాయి.
