  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన వంశావళి శైలిని ఉపయోగించాం. పొడవైన ‘కుమారుడు’ శృంఖలలో ప్రతి సంబంధం స్పష్టంగా ఉండేందుకు మొదటి వ్యక్తి తరువాత డాష్ పెట్టి, ఒక్కో తరాన్ని విడిగా పేర్కొన్నాం. మూలంలోని ఆరంభ సంధాయకాన్ని నిలిపాం.
