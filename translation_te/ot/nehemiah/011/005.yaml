source:
  edition: WLC
  text: וּ/מַעֲשֵׂיָ֣ה בֶן בָּר֣וּךְ בֶּן כָּל חֹ֠זֶה בֶּן חֲזָיָ֨ה בֶן עֲדָיָ֧ה בֶן יוֹיָרִ֛יב בֶּן זְכַרְיָ֖ה בֶּן הַ/שִּׁלֹנִֽי־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/005.yaml
  text: and Maaseiah son of Baruch[a], son of Col-hozeh, son of Hazaiah, son of Adaiah, son of Joiarib, son of Zechariah, son of the Shilonite.
translation:
  language: te
  text: మరియు బారూకు కుమారుడైన మయశేయా, కోల్-హోజె కుమారుడైన బారూకు, హజాయా కుమారుడైన కోల్-హోజె, అదాయా కుమారుడైన హజాయా, యోయారీవు కుమారుడైన అదాయా, జెకర్యా కుమారుడైన యోయారీవు, షిలోనీయుని[a] కుమారుడైన జెకర్యా.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “షెలోనీయుని.” ఈ హీబ్రూ సంబంధవాచక పదం షిలోహు అనే స్థలంతో సంబంధాన్ని గానీ, వంశావళి సంప్రదాయంలోని షేలా/షిలోను వంశంతో సంబంధాన్ని గానీ సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מַעֲשֵׂיָה
  choice: మరియు ... మయశేయా
  rationale: ముందటి జాబితాను కొనసాగించే ו ఉపసర్గను ‘మరియు’గా నిలిపి, వ్యక్తి పేరును హీబ్రూ ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించాం.
- source_word: בֶן
  choice: కుమారుడు
  rationale: వంశావళిలో మళ్లీ మళ్లీ వచ్చే בֶן పదాన్ని మూలంలోని ప్రత్యక్ష తండ్రీకుమారుల శృంఖల నిర్మాణాన్ని కాపాడేలా ఒకే విధంగా అనువదించాం; విస్తృతార్థంలో ‘వంశస్థుడు’ కావచ్చనే అవకాశాన్ని అనవసరంగా ప్రధాన పాఠ్యంలో ప్రవేశపెట్టలేదు.
- source_word: בָּרוּךְ
  choice: బారూకు
  rationale: వ్యక్తి పేరును ఆధునిక తెలుగు పఠనానికి సహజంగా లిప్యంతరీకరించాం.
- source_word: כָּל חֹזֶה
  choice: కోల్-హోజె
  rationale: ఇది అర్థానువాదం చేయవలసిన పదబంధంగా కాక వ్యక్తి పేరుగా పనిచేస్తోంది; అందువల్ల సంయుక్త నామంగా లిప్యంతరీకరించాం.
- source_word: חֲזָיָה
  choice: హజాయా
  rationale: హీబ్రూ వ్యక్తి పేరును తెలుగు లిపిలో ధ్వనికి దగ్గరగా ఇచ్చాం.
- source_word: עֲדָיָה
  choice: అదాయా
  rationale: వ్యక్తి పేరును హీబ్రూ రూపానికి దగ్గరగా లిప్యంతరీకరించాం.
- source_word: יוֹיָרִיב
  choice: యోయారీవు
  rationale: ఇక్కడున్న సంక్షిప్త హీబ్రూ నామరూపాన్నే అనుసరించాం; విస్తరించిన దైవనామ సంబంధ రూపాన్ని చేర్చలేదు.
- source_word: זְכַרְיָה
  choice: జెకర్యా
  rationale: తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన రూపాన్ని, మూలపేరుతో సరిపడేలా ఉపయోగించాం.
- source_word: הַ/שִּׁלֹנִי
  choice: షిలోనీ
  rationale: నిర్దిష్ట ఉపజాతి/సంబంధవాచక హీబ్రూ రూపాన్ని పేరులాంటి వంశసూచక పదంగా లిప్యంతరీకరించాం; అది స్థలమైన షిలోహుతోనా లేక షేలా/షిలోను వంశంతోనా సంబంధమో ప్రధాన పాఠ్యంలో నిర్ణయించలేదు.
