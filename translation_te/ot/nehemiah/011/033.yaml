- source_word: חָצוֹר
  choice: హాసోరు
  rationale: ఇది స్థల నామం. దాని వ్యుత్పత్తి సంబంధమైన ‘ఆవరణ’ లేదా ‘నివాసస్థలం’ అనే అర్థాన్ని అనువదించకుండా, తెలుగులో ప్రాచుర్యంలో ఉన్న బైబిలు నామరూపానికి అనుగుణంగా లిప్యంతరీకరించబడింది.
- source_word: רָמָה
  choice: రామా
  rationale: ఇక్కడ ఇది ‘ఎత్తైన స్థలం’ అనే సాధారణ నామవాచకం కాదు, స్థల నామం. అందువల్ల అర్థానువాదం చేయకుండా సహజమైన తెలుగు రూపంలో లిప్యంతరీకరించబడింది.
- source_word: גִּתַּיִם
  choice: గిత్తయిము
  rationale: ఇది పట్టణపు పేరు. హీబ్రూ రూపంలోని చివరి భాగాన్ని అర్థానువాదం చేయకుండా, తెలుగు బైబిలు నామాల శైలికి సరిపోయేలా ‘గిత్తయిము’ అని లిప్యంతరీకరించబడింది.
