  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּֽי מִצְוַ֥ת הַ/מֶּ֖לֶךְ עֲלֵי/הֶ֑ם וַ/אֲמָנָ֥ה עַל הַ/מְשֹׁרְרִ֖ים דְּבַר י֥וֹם בְּ/יוֹמֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/023.yaml
  text: For the king’s command was upon them[a], and a fixed provision for the singers[b], each day’s matter on its day.
translation:
  language: te
  text: ఎందుకంటే, రాజాజ్ఞ వారిపై ఉండేది; గాయకుల కోసం ప్రతి రోజుకు కావలసిన దానికి స్థిరమైన ఏర్పాటు ఉండేది.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూలభాషలో అక్షరార్థంగా, “ఒక్కో రోజు విషయం దాని రోజున.” దీన్ని “ప్రతి రోజుకు కావలసినది” లేదా “ప్రతి రోజు వాటా” అని కూడా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడి హీబ్రూ పదం స్థిరమైన ఏర్పాటు, నిర్ధారిత కేటాయింపు లేదా స్థాపిత బాధ్యతను కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి వాక్యానికి కారణం లేదా వివరణను పరిచయం చేస్తుంది.
- source_word: מִצְוַת הַמֶּלֶךְ
  choice: రాజాజ్ఞ
  rationale: రాజు జారీ చేసిన అధికారిక ఆదేశం అనే భావాన్ని సహజమైన, గౌరవప్రదమైన తెలుగులో సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: עֲלֵיהֶם
  choice: వారి విషయంలో ... ఉంది
  rationale: ఆ ఆజ్ఞ వారికి సంబంధించినదనీ, వారిపై అధికారబద్ధంగా వర్తించేదనీ సూచిస్తుంది; అసహజమైన పదానువాదాన్ని నివారిస్తుంది.
- source_word: וַאֲמָנָה
  choice: స్థిరపరచబడింది
  rationale: אֲמָנָה సూచించగల స్థిరమైన ఏర్పాటు లేదా అధికారికంగా నిర్ధారించిన బాధ్యత అనే భావాన్ని సందర్భానుసారంగా వ్యక్తం చేస్తుంది.
- source_word: עַל הַמְשֹׁרְרִים
  choice: గాయకుల కోసం
  rationale: ఈ ఏర్పాటు గాయకులకు సంబంధించినదని పరిపాలనా సందర్భంలో సహజంగా తెలియజేస్తుంది.
- source_word: דְּבַר יוֹם בְּיוֹמוֹ
  choice: రోజువారీ కేటాయింపు
  rationale: ప్రతి రోజుకు సంబంధించిన అవసరం లేదా వాటా అనే హీబ్రూ నుడికార భావాన్ని స్పష్టమైన ఆధునిక తెలుగులో అందిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, పరిపాలనా సందర్భం స్పష్టంగా ఉండేలా అనువదించబడింది. హీబ్రూ వాక్యంలోని రెండు ప్రధాన అస్పష్టతలను—אֲמָנָה యొక్క భావాన్ని, דְּבַר יוֹם בְּיוֹמוֹ నుడికారాన్ని—పాదసూచికల్లో నిలుపుకున్నాం.
