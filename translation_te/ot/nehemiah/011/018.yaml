  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన శైలి. ‘పరిశుద్ధ పట్టణం’ అనే స్థిర బైబిలు పదబంధాన్ని నిలుపుతూ, సంఖ్యను అక్షరరూపంలో ఇచ్చాం.
