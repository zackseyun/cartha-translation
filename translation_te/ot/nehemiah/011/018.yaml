translation:
  language: te
  text: పరిశుద్ధ పట్టణంలో ఉన్న లేవీయులందరూ రెండువందల ఎనభై నలుగురు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל
  choice: అందరూ
  rationale: సమూహంలోని మొత్తం మందిని సూచించే పరిమాణవాచకం; వ్యక్తులను సూచించే ‘లేవీయులు’తో సహజంగా సరిపోతుంది.
- source_word: הַלְוִיִּם
  choice: లేవీయులు
  rationale: లేవి గోత్రానికి చెందినవారిని సూచించే ప్రామాణిక బైబిలు తెలుగు పదం.
- source_word: בְּעִיר הַקֹּדֶשׁ
  choice: పరిశుద్ధ పట్టణంలో ఉన్న
  rationale: בְּ స్థానాన్ని సూచిస్తుంది; עִיר הַקֹּדֶשׁ అనే సంబంధ నిర్మాణాన్ని సహజమైన తెలుగు విశేషణ పదబంధంగా అందిస్తుంది.
- source_word: מָאתַיִם שְׁמֹנִים וְאַרְבָּעָה
  choice: రెండువందల ఎనభై నలుగురు
  rationale: హీబ్రూ సంఖ్య 284ను వ్యక్తుల లెక్కకు తగిన ‘నలుగురు’తో సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది; హీబ్రూలో క్రియ లేని వాక్యాన్ని తెలుగులోనూ సహజంగా ఉంచుతుంది.
