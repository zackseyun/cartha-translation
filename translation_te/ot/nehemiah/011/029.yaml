  text: and in En-rimmon[a], and in Zorah[b], and in Jarmuth.
translation:
  language: te
  text: మరియు ఏన్-రిమ్మోనులోను[a], సోరాలోను[b], యర్మూతులోను నివసించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘అయిన్-రిమ్మోను.’ హీబ్రూ స్థలనామంలోని עֵין అనే పదాన్ని ‘ఏన్’ లేదా ‘అయిన్’ అని లిప్యంతరీకరించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ పాఠంలో వరుసగా పేర్కొన్న ప్రతి నివాసస్థలానికి ‘మరియు ...లో’ అనే రూపం పునరావృతమవుతుంది.
    reason: cultural_note
lexical_decisions:
- source_word: וּ/בְ/עֵין רִמּוֹן
  choice: ఏన్-రిమ్మోనులో
  rationale: וּ (‘మరియు’) మరియు בְּ (‘లో’) అనే ఉపసర్గల భావాన్ని స్థలనామంతో సహజంగా కలిపి తెలుగులో వ్యక్తం చేశాం. עֵין רִמּוֹן అనే స్థలనామాన్ని అనువదించకుండా లిప్యంతరీకరించాం.
- source_word: וּ/בְ/צָרְעָה
  choice: సోరాలో
  rationale: צָרְעָה ఒక స్థలనామం. హీబ్రూ ఉచ్చారణకు దగ్గరగా, తెలుగులో గుర్తించదగిన రూపంగా ‘సోరా’ అని లిప్యంతరీకరించి, בְּ భావానికి ‘లో’ చేర్చాం.
- source_word: וּ/בְ/יַרְמוּת
  choice: యర్మూతులో
  rationale: יַרְמוּת అనే స్థలనామాన్ని హీబ్రూ ఆరంభ ధ్వని య్‌ను నిలుపుతూ ‘యర్మూతు’గా లిప్యంతరీకరించాం; בְּ ఉపసర్గను ‘లో’తో తెలిపాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన స్థలనామాల జాబితాగా రూపొందించాం. ఈ వచనం మునుపటి వాక్యంలోని నివాసక్రియపై ఆధారపడిన ఖండవాక్యం కావడంతో, తెలుగులో స్వతంత్రంగా సహజంగా చదవడానికి ‘నివసించారు’ను పూరించాం. ప్రతి హీబ్రూ וּ/בְ పునరావృతాన్ని యాంత్రికంగా ‘మరియు ...లో’ అని ఇవ్వకుండా, జాబితా నిర్మాణాన్ని తెలుగు విరామచిహ్నాలతో సహజంగా తెలిపాం.
