id: NEH.11.15
reference: Nehemiah 11:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/מִֽן הַ/לְוִיִּ֑ם שְׁמַעְיָ֧ה בֶן חַשּׁ֛וּב בֶּן עַזְרִיקָ֥ם בֶּן חֲשַׁבְיָ֖ה בֶּן בּוּנִּֽי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/015.yaml
  text: 'And from the Levites: Shemaiah son of Hasshub[a], son of Azrikam, son of Hashabiah, son of Bunni.'
translation:
  language: te
  text: 'లేవీయులలోనుండి: షెమయా—హష్షూబు కుమారుడు[a], అజ్రీకాము కుమారుడు, హషబ్యా కుమారుడు, బున్నీ కుమారుడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: వంశావళి జాబితాల్లో ‘కుమారుడు’ అని అనువదించిన హీబ్రూ పదం కొన్నిసార్లు నేరుగా పుట్టిన కుమారుణ్ణే కాక, తరువాతి తరానికి చెందిన వంశస్థుణ్ణి కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִן הַלְוִיִּם
  choice: లేవీయులలో
  rationale: וּמִן ముందున్న జాబితాతో అనుసంధానాన్ని చూపుతుంది; తెలుగులో జాబితా కొనసాగింపులో ‘లేవీయులలో’ సహజంగా ఉండి మూలంలోని వర్గ సూచనను కాపాడుతుంది.
- source_word: שְׁמַעְיָה
  choice: షెమయా
  rationale: హీబ్రూ పేరుకు సమీపంగా, తెలుగులో సహజంగా ఉచ్చరించగల లిప్యంతరీకరణ.
- source_word: בֶן
  choice: కుమారుడు / వంశస్థుడు
  rationale: మొదటి సంబంధంలో ‘కుమారుడు’ అనే సాధారణ అర్థాన్ని ఉంచి, తరువాతి వంశావళి క్రమంలో అదే పదానికి ఉండగల విస్తృత ‘వంశస్థుడు’ భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేశాం; పాదసూచిక మూలంలోని సందిగ్ధతను తెలియజేస్తుంది.
- source_word: חַשּׁוּב
  choice: హష్షూబు
  rationale: మధ్య హీబ్రూ వ్యంజన ద్విత్వాన్ని ‘ష్ష’తో ప్రతిబింబించే తెలుగు లిప్యంతరీకరణ.
- source_word: עַזְרִיקָם
  choice: అజ్రీకాము
  rationale: హీబ్రూ పేరును ఆధారంగా చేసుకున్న తెలుగు లిప్యంతరీకరణ.
- source_word: חֲשַׁבְיָה
  choice: హషబ్యా
  rationale: హీబ్రూ ధ్వనిరూపానికి సమీపమైన, సంక్షిప్త తెలుగు లిప్యంతరీకరణ.
- source_word: בּוּנִּי
  choice: బున్నీ
  rationale: వ్యంజన ద్విత్వాన్ని నిలుపుకున్న తెలుగు లిప్యంతరీకరణ.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, జాబితా శైలికి తగిన సంక్షిప్తమైన మరియు గౌరవప్రదమైన రూపం. పేర్లు హీబ్రూ మూలాన్ని అనుసరించి లిప్యంతరీకరించబడ్డాయి.
