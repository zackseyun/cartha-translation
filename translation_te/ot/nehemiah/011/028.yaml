  text: and in Ziklag[a], and in Mekonah and its daughter villages.
translation:
  language: te
  text: సిక్లగులోను, మెకోనాలోను, దాని అనుబంధ గ్రామాల్లోను[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: పదశః, “దాని కుమార్తెలలోను”; ఇది మెకోనాకు చెందిన చిన్న గ్రామాలు లేదా ఆధీన నివాస ప్రాంతాలను సూచించే హీబ్రూ నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְ/צִֽקְלַג
  choice: సిక్లగులోను
  rationale: וּבְ־ లోని సముచ్చయార్థాన్ని, స్థలార్థాన్ని సహజమైన తెలుగు ‘లోను’తో వ్యక్తం చేశాం. צִקְלַג అనే స్థలనామాన్ని అనువదించకుండా తెలుగు లిపిలో ‘సిక్లగు’గా లిప్యంతరీకరించాం.
- source_word: וּ/בִ/מְכֹנָה
  choice: మెకోనాలోను
  rationale: సముచ్చయ ఉపసర్గ, స్థలవాచక ఉపసర్గ రెండింటినీ ‘లోను’తో అందించాం. מְכֹנָה అనే స్థలనామాన్ని ‘మెకోనా’గా లిప్యంతరీకరించాం.
- source_word: וּ/בִ/בְנֹתֶֽי/הָ
  choice: దాని అనుబంధ గ్రామాల్లోను
  rationale: పదశః ‘దాని కుమార్తెలలోను’ అయినప్పటికీ, పట్టణానికి చెందిన చిన్న లేదా ఆధీన నివాస ప్రాంతాలను సూచించే హీబ్రూ నుడికారాన్ని ఆధునిక తెలుగులో స్పష్టంగా ‘దాని అనుబంధ గ్రామాల్లోను’ అని ఇచ్చాం. స్త్రీలింగ ఏకవచన ప్రత్యయం మెకోనాను సూచిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన భౌగోళిక జాబితా శైలిని నిలిపాం. మూలంలోని సమాంతర నిర్మాణాన్ని ప్రతి స్థలపదానికి ‘లోను’ వాడటం ద్వారా ప్రతిబింబించాం; మూలంలో లేని క్రియను చేర్చలేదు. పాదసూచిక గుర్తును అది వివరిస్తున్న ‘అనుబంధ గ్రామాలు’ అనే పదబంధం తర్వాత ఉంచాం.
