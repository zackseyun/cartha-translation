source:
  edition: WLC
  text: וְ/אֵ֨לֶּה֙ רָאשֵׁ֣י הַ/מְּדִינָ֔ה אֲשֶׁ֥ר יָשְׁב֖וּ בִּ/ירוּשָׁלִָ֑ם וּ/בְ/עָרֵ֣י יְהוּדָ֗ה יָֽשְׁב֞וּ אִ֤ישׁ בַּ/אֲחֻזָּת/וֹ֙ בְּ/עָ֣רֵי/הֶ֔ם יִשְׂרָאֵ֤ל הַ/כֹּהֲנִים֙ וְ/הַ/לְוִיִּ֣ם וְ/הַ/נְּתִינִ֔ים וּ/בְנֵ֖י עַבְדֵ֥י שְׁלֹמֹֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/003.yaml
  text: 'These are the heads of the province who lived in Jerusalem[a]. But in the cities of Judah, each man lived in his own possession in their cities: Israel, the priests, the Levites, the temple servants[b], and the descendants of Solomon’s servants.'
translation:
  language: te
  text: 'యెరూషలేములో నివసించిన ప్రాంతపు ప్రధానులు వీరే. అయితే యూదా పట్టణాల్లో, ఎవరి స్వాస్థ్యంలో వారు, తమ తమ పట్టణాల్లో నివసించారు: ఇశ్రాయేలు[a], యాజకులు, లేవీయులు, దేవాలయ సేవకులు[b], సొలొమోను సేవకుల వంశస్థులు.


    [a] లేదా “ఇశ్రాయేలీయులు.” హీబ్రూ మూలంలో కేవలం “ఇశ్రాయేలు” అని ఉంది; ఇక్కడ అది ఈ జాబితాలోని ఒక సమూహాన్ని సూచిస్తున్నట్లు కనిపిస్తుంది.


    [b] హీబ్రూలో “నెతీనీయులు”; వీరు దేవాలయ సేవకు నియమించబడిన ఒక వర్గం.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఇశ్రాయేలీయులు.” హీబ్రూ మూలంలో కేవలం “ఇశ్రాయేలు” అని ఉంది; ఇక్కడ అది ఈ జాబితాలోని ఒక సమూహాన్ని సూచిస్తున్నట్లు కనిపిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో “నెతీనీయులు”; వీరు దేవాలయ సేవకు నియమించబడిన ఒక వర్గం.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאשֵׁי הַמְּדִינָה
  choice: ప్రాంతపు ప్రధానులు
  rationale: రָאשֵׁי అనే పదబంధం నాయకులు లేదా ముఖ్యులను సూచిస్తుంది; పారసీక కాలపు מְדִינָה ఆధునిక రాష్ట్రం కంటే పరిపాలనా ప్రాంతాన్ని సూచిస్తుంది.
- source_word: אֲשֶׁר יָשְׁבוּ בִּירוּשָׁלִָם
  choice: యెరూషలేములో నివసించిన
  rationale: יָשַׁב ఇక్కడ స్థిర నివాసాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘నివసించిన’ సహజంగా, గౌరవప్రదంగా ఉంది.
- source_word: וּבְעָרֵי יְהוּדָה יָשְׁבוּ
  choice: యూదా పట్టణాల్లో మాత్రం ... నివసించారు
  rationale: వావ్ యెరూషలేము నుండి యూదాలోని ఇతర పట్టణాల వైపు మార్పును సూచిస్తుంది; ‘మాత్రం’ ఆ వ్యత్యాసాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: אִישׁ בַּאֲחֻזָּתוֹ
  choice: ఎవరి స్వాస్థ్యంలో వారు
  rationale: אִישׁ పంపిణీ భావంలో ‘ప్రతి వ్యక్తి’ని, אֲחֻזָּה స్వాధీనమైన లేదా వంశపారంపర్యమైన భూసంపదను సూచిస్తాయి. తెలుగు జాతీయ ప్రయోగం వ్యక్తిగత పంపిణీ భావాన్ని నిలుపుతుంది.
- source_word: בְּעָרֵיהֶם
  choice: తమ తమ పట్టణాల్లో
  rationale: ఆ సమూహాలవారు తమకు చెందిన వేర్వేరు పట్టణాల్లో నివసించారనే పంపిణీ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: יִשְׂרָאֵל
  choice: ఇశ్రాయేలు
  rationale: మూలంలోని ఏకపద సామూహిక నామాన్ని యథాతథంగా నిలిపి, ‘ఇశ్రాయేలీయులు’ అనే వివరణాత్మక ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చింది.
- source_word: הַכֹּהֲנִים
  choice: యాజకులు
  rationale: తెలుగు బైబిలు భాషలో స్థిరమైన, సాధారణంగా అర్థమయ్యే పదం.
- source_word: הַלְוִיִּם
  choice: లేవీయులు
  rationale: లేవి వంశానికి చెందిన సేవావర్గానికి ప్రామాణిక తెలుగు రూపం.
- source_word: הַנְּתִינִים
  choice: దేవాలయ సేవకులు
  rationale: ఆ వర్గపు విధిని ఆధునిక పాఠకులకు స్పష్టంగా తెలియజేస్తుంది; హీబ్రూ పేరును పాదసూచికలో నిలిపింది.
- source_word: בְּנֵי עַבְדֵי שְׁלֹמֹה
  choice: సొలొమోను సేవకుల వంశస్థులు
  rationale: בְּנֵי ఇక్కడ వ్యక్తిగత కుమారులకంటే వంశసమూహాన్ని సూచిస్తుంది; ‘వంశస్థులు’ ఆ భావాన్ని సహజంగా అందిస్తుంది.
