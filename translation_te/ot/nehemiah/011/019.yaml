translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, జాబితా శైలిని నిలుపుతూ సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన వాక్య నిర్మాణం ఉపయోగించబడింది. ఆంగ్ల సంప్రదింపు పాఠంలో పాదటిప్పణి గుర్తు ‘అక్కూబు’ తర్వాత ఉన్నప్పటికీ, పాదటిప్పణి וַאֲחֵיהֶם (‘వారి సహోదరులు’) గురించినది కావడంతో మూలపదానికే గుర్తు జతచేయబడింది.
