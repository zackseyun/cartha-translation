  yaml_path: translation/ot/nehemiah/011/019.yaml
  text: 'And the gatekeepers: Akkub[a], Talmon, and their brothers who kept watch at the gates, were one hundred seventy-two.'
translation:
  language: te
  text: 'ద్వారపాలకులు: ద్వారాల వద్ద కాపలా కాసేవారైన అక్కూబు, తల్మోను, వారి సహోదరులు[a]—మొత్తం నూట డెబ్బై ఇద్దరు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వారి దగ్గరి బంధువులు’; హీబ్రూలోని ‘వారి సహోదరులు’ అనే మాట దగ్గరి పురుష బంధువులను లేదా అదే వర్గానికి చెందినవారిని కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשּׁוֹעֲרִים
  choice: ద్వారపాలకులు
  rationale: ద్వారాల వద్ద కాపలా కాయడానికి లేదా సేవ చేయడానికి నియమించబడిన అధికారిక వర్గాన్ని సహజంగా, సంక్షిప్తంగా సూచిస్తుంది.
- source_word: עַקּוּב
  choice: అక్కూబు
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: טַלְמוֹן
  choice: తల్మోను
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: וַאֲחֵיהֶם
  choice: వారి సహోదరులు
  rationale: אָח అనే పదపు ప్రాథమిక అర్థమైన ‘సోదరులు’ను నిలుపుతూ, ఈ జాబితా సందర్భంలో అది దగ్గరి బంధువులను లేదా అదే వర్గానికి చెందిన పురుషులను కూడా సూచించగలదనే విస్తృతిని పాదటిప్పణిలో తెలిపాం.
- source_word: הַשֹּׁמְרִים
  choice: కాపలా కాసే
  rationale: వర్తమాన కృదంతం సూచించే నిరంతర బాధ్యతను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בַּשְּׁעָרִים
  choice: ద్వారాల దగ్గర
  rationale: వారు విధి నిర్వహించిన స్థానాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: מֵאָה שִׁבְעִים וּשְׁנָיִם
  choice: నూట డెబ్బై ఇద్దరు
  rationale: పురుషుల మొత్తం సంఖ్యను సహజమైన తెలుగు సంఖ్యారూపంలో తెలిపింది.
