  register: ఆధునిక ప్రామాణిక తెలుగు; జాబితా స్వభావాన్ని నిలుపుతూ వంశావళిని తెలుగులో సహజమైన పూర్వీకుడు-నుండి-వారసుడు క్రమంలో అమర్చింది. ప్రతి పాదంలో హీబ్రూ ‘కుమారుడు’ సంబంధం యథాతథంగా నిలిచింది.
