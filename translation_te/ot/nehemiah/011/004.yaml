  text: וּ/בִֽ/ירוּשָׁלִַ֨ם֙ יָֽשְׁב֔וּ מִ/בְּנֵ֥י יְהוּדָ֖ה וּ/מִ/בְּנֵ֣י בִנְיָמִ֑ן מִ/בְּנֵ֣י יְ֠הוּדָה עֲתָיָ֨ה בֶן עֻזִּיָּ֜ה בֶּן זְכַרְיָ֧ה בֶן אֲמַרְיָ֛ה בֶּן שְׁפַטְיָ֥ה בֶן מַהֲלַלְאֵ֖ל מִ/בְּנֵי פָֽרֶץ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/004.yaml
  text: 'And in Jerusalem there lived some of the sons of Judah and some of the sons of Benjamin[a]. Of the sons of Judah: Athaiah son of Uzziah, son of Zechariah, son of Amariah, son of Shephatiah, son of Mahalalel[b], of the sons of Perez.'
translation:
  language: te
  text: 'యెరూషలేములో యూదా వంశస్థుల్లో కొందరు, బెన్యామీను వంశస్థుల్లో కొందరు నివసించారు.[a] యూదా వంశస్థుల్లో: పెరెసు వంశానికి చెందిన మహలలేలు కుమారుడు షెఫట్యా, షెఫట్యా కుమారుడు అమర్యా, అమర్యా కుమారుడు జెకర్యా, జెకర్యా కుమారుడు ఉజ్జీయా, ఉజ్జీయా కుమారుడు అతాయా.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నివసించారు’ అనే హీబ్రూ క్రియకు సందర్భానుసారం ‘కాపురమున్నారు’ లేదా ‘స్థిరపడ్డారు’ అనే భావం కూడా ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘యూదా వంశస్థులు,’ ‘బెన్యామీను వంశస్థులు’ అనే మాటలు ఆయా గోత్రాలకు చెందిన సభ్యులను లేదా వారసులను సూచిస్తాయి.
    reason: cultural_note
lexical_decisions:
- source_word: וּבִירוּשָׁלַם
  choice: యెరూషలేములో
  rationale: స్థలార్థక ఉపసర్గను సహజమైన తెలుగులో చూపింది; హీబ్రూ וְ కథన కొనసాగింపును సూచించినా తెలుగులో ప్రత్యేకంగా ‘మరియు’ చేర్చడం అసహజం.
- source_word: יָשְׁבוּ
  choice: నివసించారు
  rationale: ישׁב ఇక్కడ ‘ఉండటం/నివసించడం’ అనే నివాసార్థంలో ఉంది; ఆధునిక ప్రామాణిక తెలుగులో ‘నివసించారు’ గౌరవప్రదంగా, సహజంగా ఉంది.
- source_word: מִבְּנֵי יְהוּדָה וּמִבְּנֵי בִנְיָמִן
  choice: యూదా వంశస్థుల్లో కొందరు, బెన్యామీను వంశస్థుల్లో కొందరు
  rationale: בני ఇక్కడ ప్రత్యక్ష కుమారులను కాక గోత్రసంబంధ వారసులను సూచిస్తుంది; partitive מִן భావాన్ని ‘కొందరు’ తెలియజేస్తుంది.
- source_word: בֶּן
  choice: కుమారుడు
  rationale: వంశావళిలో בן యొక్క ప్రత్యక్ష రూపాన్ని నిలుపుతుంది; తరాలు సంక్షిప్తమై ఉండగల అవకాశాన్ని అనవసరంగా పరిష్కరించదు.
- source_word: מִבְּנֵי פָרֶץ
  choice: పెరెసు వంశానికి చెందిన
  rationale: పెరెసు వంశశాఖకు చెందినవాడనే సంబంధాన్ని సహజమైన తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: עֲתָיָה / עֻזִּיָּה / זְכַרְיָה / אֲמַרְיָה / שְׁפַטְיָה / מַהֲלַלְאֵל
  choice: అతాయా / ఉజ్జీయా / జెకర్యా / అమర్యా / షెఫట్యా / మహలలేలు
  rationale: హీబ్రూ వ్యక్తినామాల ధ్వనులకు దగ్గరగా ఉండే, తెలుగు బైబిలు పఠనానికి అనుకూలమైన లిప్యంతరీకరణలు.
