source:
  edition: WLC
  text: וְ/יוֹאֵ֥ל בֶּן זִכְרִ֖י פָּקִ֣יד עֲלֵי/הֶ֑ם וִ/יהוּדָ֧ה בֶן הַ/סְּנוּאָ֛ה עַל הָ/עִ֖יר מִשְׁנֶֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/009.yaml
  text: And Joel son of Zichri was overseer over them[a], and Judah son of Hassenuah was second over the city.
translation:
  language: te
  text: జిక్రీ కుమారుడైన యోయేలు వారిపై పర్యవేక్షకుడిగా ఉన్నాడు; హస్సెనూయా కుమారుడైన యూదా నగరానికి రెండవ అధికారిగా ఉన్నాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నగరానికి ఉపాధికారిగా ఉన్నాడు,” లేదా “నగర పాలనలో రెండవ స్థానంలో ఉన్నాడు.”
    reason: మִשְׁנֶה עַל־הָעִיר అనే పదబంధం నగరంపై రెండవ-స్థాయి అధికారాన్ని సూచిస్తుంది; ఖచ్చితమైన పరిపాలనా హోదా నిర్దిష్టంగా లేదు.
lexical_decisions:
- source_word: פָּקִיד
  choice: పర్యవేక్షకుడు
  rationale: నియమించబడిన పర్యవేక్షణ లేదా పరిపాలనా బాధ్యతను సూచించే ఈ పదానికి ‘పర్యవేక్షకుడు’ సహజమైన ఆధునిక తెలుగు సమానార్థకం; సైనిక లేదా రాజసంబంధమైన నిర్దిష్ట పదవిని అనవసరంగా సూచించదు.
- source_word: עֲלֵיהֶם
  choice: వారి మీద
  rationale: ఇక్కడ על అనే పూర్వప్రత్యయం అధికారం లేదా పర్యవేక్షణను సూచిస్తుంది. ‘వారి మీద’ మూలంలోని సంబంధాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: מִשְׁנֶה
  choice: రెండవ స్థానంలో
  rationale: ఈ పదం సాధారణంగా రెండవ స్థాయి అధికారి లేదా ఉపాధికారిని సూచిస్తుంది. ‘రెండవ స్థానంలో’ అనే అనువాదం పదవీ క్రమాన్ని తెలియజేస్తూనే, ఖచ్చితమైన అధికార హోదాను నిర్ధారించకుండా మూలంలోని సంక్షిప్తతను కాపాడుతుంది.
- source_word: עַל הָעִיר
  choice: నగర పాలనలో
  rationale: ఇక్కడ על నగరానికి సంబంధించిన అధికార పరిధి లేదా బాధ్యతను సూచిస్తుంది. తెలుగులో ‘నగర పాలనలో రెండవ స్థానంలో’ సహజంగా ఉండి పరిపాలనా సందర్భాన్ని స్పష్టం చేస్తుంది.
- source_word: הַסְּנוּאָה
  choice: హస్సెనూవా
  rationale: ఇది వ్యక్తి లేదా వంశనామం కాబట్టి అనువదించకుండా హీబ్రూ రూపానికి దగ్గరగా లిప్యంతరీకరించబడింది.
- source_word: וְ
  choice: ;
  rationale: రెండు సమాంతర పరిపాలనా వాక్యాలను తెలుగులో సహజంగా కలపడానికి సంధి భావాన్ని అర్ధవిరామం ద్వారా వ్యక్తం చేశాం; వాక్యం ముందటి జాబితితో కొనసాగుతున్న భావం సందర్భంలో నిలుస్తుంది.
theological_decisions:
- issue: మִשְׁנֶה అనే పదం సూచించే ఖచ్చితమైన పరిపాలనా హోదా
  choice: నగర పాలనలో రెండవ స్థానంలో
  alternative: నగరానికి ఉపాధికారిగా / నగర పాలనలో రెండవ అధికారిగా
  rationale: మూలపదం రెండవ స్థానం లేదా ఉపాధికారిత్వాన్ని సూచించగలదు. ప్రధాన పాఠం నిర్దిష్ట హోదాను బలవంతంగా నిర్ణయించకుండా ఆ అస్పష్టతను నిలుపుతుంది; ప్రత్యామ్నాయాలను పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన పరిపాలనా పదజాలం వాడబడింది. పేర్లు హీబ్రూ రూపాలకు దగ్గరగా లిప్యంతరీకరించబడ్డాయి. ఆంగ్ల సంప్రదింపు పాఠంలో [a] గుర్తు మొదటి ఉపవాక్యానికి జతచేయబడినప్పటికీ, దాని పాదసూచిక మִשְׁנֶה עַל־הָעִיר అనే రెండవ ఉపవాక్యంలోని పదబంధానికే సంబంధించినందున తెలుగులో గుర్తును తగిన చోట ఉంచాం.
