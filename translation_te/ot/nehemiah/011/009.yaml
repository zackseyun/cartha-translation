revisions:
- from: జిక్రీ కుమారుడైన యోయేలు వారి మీద పర్యవేక్షకుడిగా ఉన్నాడు; హస్సెనూవా కుమారుడైన యూదా నగర పాలనలో రెండవ స్థానంలో ఉన్నాడు.[a]
  to: జిక్రీ కుమారుడైన యోయేలు వారిపై పర్యవేక్షకుడిగా ఉన్నాడు; హస్సెనూయా కుమారుడైన యూదా నగరానికి రెండవ అధికారిగా ఉన్నాడు.[a]
  rationale: The revision improves modern Telugu idiom for administrative oversight, refines the transliteration of Hassenuah in line with the Hebrew form, and makes Judah’s second-ranking civic role more direct without resolving the source term into a specific office. The footnote remains anchored to the second-ranking expression and retains the relevant alternatives.
  reviewer_model: gpt-5.6-terra
