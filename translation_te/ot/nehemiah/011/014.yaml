id: NEH.11.14
reference: Nehemiah 11:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/אֲחֵי/הֶם֙ גִּבּ֣וֹרֵי חַ֔יִל מֵאָ֖ה עֶשְׂרִ֣ים וּ/שְׁמֹנָ֑ה וּ/פָקִ֣יד עֲלֵי/הֶ֔ם זַבְדִּיאֵ֖ל בֶּן הַ/גְּדוֹלִֽים־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/014.yaml
  text: And their brothers[a], mighty men of valor, were one hundred twenty-eight; and the overseer over them was Zabdiel son of Haggedolim.
translation:
  language: te
  text: వారి సహోదరులు, పరాక్రమవంతులైన 128 మంది; వారికి అధికారి హగ్గెదోలీము కుమారుడైన జబ్దీయేలు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַאֲחֵיהֶם
  choice: వారి సహోదరులు
  rationale: అక్షరార్థమైన ‘వారి సహోదరులు’ అనే భావాన్ని నిలుపుతూ, ఈ జాబితా సందర్భంలో అదే వర్గానికి చెందిన పురుషులను సూచిస్తుంది.
- source_word: גִּבּוֹרֵי חַיִל
  choice: శౌర్యవంతులైన పరాక్రమశాలులు
  rationale: బలం, ధైర్యం, సమరసామర్థ్యం గల పురుషులు అనే నుడికార భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: מֵאָה עֶשְׂרִים וּשְׁמֹנָה
  choice: 128 మంది
  rationale: మూలంలోని 128 అనే సంఖ్యను నేరుగా తెలిపి, వ్యక్తుల లెక్కకు సహజమైన ‘మంది’ని జోడించింది.
- source_word: וּפָקִיד עֲלֵיהֶם
  choice: వారిపై పర్యవేక్షకుడు
  rationale: పָקִיד్ ఇక్కడ నియమించబడిన పరిపాలనా లేదా పర్యవేక్షణ బాధ్యతగల వ్యక్తిని సూచిస్తుంది; నిర్దిష్టంగా సైనిక హోదాను మోపకుండా ఉంటుంది.
- source_word: זַבְדִּיאֵל
  choice: జబ్దీయేలు
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు బైబిలు నామరూపాలకు అనుగుణంగా లిప్యంతరీకరించింది.
- source_word: בֶּן הַגְּדוֹלִים
  choice: హగ్గెదోలీము కుమారుడు
  rationale: הַגְּדוֹלִים వంశనామం లేదా వ్యక్తినామంగా ఉండవచ్చనే అవకాశాన్ని ప్రధాన పాఠ్యంలో లిప్యంతరీకరణ ద్వారా నిలిపింది; వివరణాత్మక అర్థాన్ని పాదసూచికలో ఉంచింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; వంశావళి/పరిపాలనా జాబితాకు తగిన సంక్షిప్త, గౌరవప్రద శైలి. మూలంలోని నామసంబంధ అనిశ్చితిని పాదసూచికలో నిలిపింది.
