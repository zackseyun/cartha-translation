    rationale: ‘ఉజ్జీ ... గాయకులైన ఆసాపు వంశస్థుల్లో ఒకడు’ అని వేరే వాక్యంగా పెట్టడం సాధ్యమే అయినా, ‘పనిని పర్యవేక్షించే’ అనే విశేషణం ఎవరికీ చెందుతుందో స్వల్ప అస్పష్టత కలిగిస్తుంది. సవరణలో ఉజ్జీకి మందిరపు పని బాధ్యత ఉన్నట్లు స్పష్టంగా చెబుతుంది.
