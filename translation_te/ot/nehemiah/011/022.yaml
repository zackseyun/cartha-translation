id: NEH.11.22
reference: Nehemiah 11:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/פְקִ֤יד הַ/לְוִיִּם֙ בִּ/יר֣וּשָׁלִַ֔ם עֻזִּ֤י בֶן בָּנִי֙ בֶּן חֲשַׁבְיָ֔ה בֶּן מַתַּנְיָ֖ה בֶּן מִיכָ֑א מִ/בְּנֵ֤י אָסָף֙ הַ/מְשֹׁ֣רְרִ֔ים לְ/נֶ֖גֶד מְלֶ֥אכֶת בֵּית הָ/אֱלֹהִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/022.yaml
  text: And the overseer of the Levites in Jerusalem was Uzzi son of Bani[a], son of Hashabiah, son of Mattaniah, son of Mica, from the sons of Asaph, the singers, over the work of the house of God.
translation:
  language: te
  text: యెరూషలేములో లేవీయుల పర్యవేక్షకుడు ఉజ్జీ; అతడు బానీ కుమారుడు, బానీ హషబ్యా కుమారుడు, హషబ్యా మత్తన్యా కుమారుడు, మత్తన్యా మీకా కుమారుడు. అతడు దేవుని మందిరపు పనిపై బాధ్యత కలిగిన గాయకులైన ఆసాపు వంశస్థుల్లో ఒకడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దేవుని మందిరపు పనిని పర్యవేక్షించే.” ఇక్కడ לְנֶגֶד అనే హీబ్రూ పదబంధం మందిరపు పనికి సంబంధించిన పర్యవేక్షణను లేదా బాధ్యతను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפְקִיד הַלְוִיִּם
  choice: లేవీయుల పర్యవేక్షకుడు
  rationale: పְקִיד అనే పదం నియమించబడిన పరిపాలనా లేదా పర్యవేక్షణ బాధ్యతను సూచిస్తుంది; ‘పర్యవేక్షకుడు’ ఆధునిక తెలుగులో స్పష్టంగా, అతిగా నిర్దిష్టం చేయకుండా ఆ అధికారిక పాత్రను తెలియజేస్తుంది.
- source_word: בִּירוּשָׁלִַם
  choice: యెరూషలేములో
  rationale: בְּ ఉపసర్గపు స్థానార్థాన్ని సహజమైన తెలుగు విభక్తితో వ్యక్తం చేస్తుంది.
- source_word: עֻזִּי בֶן־בָּנִי בֶן־חֲשַׁבְיָה בֶן־מַתַּנְיָה בֶן־מִיכָא
  choice: ఉజ్జీ. అతడు బానీ కుమారుడు, బానీ హషబ్యా కుమారుడు, హషబ్యా మత్తన్యా కుమారుడు, మత్తన్యా మీకా కుమారుడు
  rationale: హీబ్రూ వంశావళి శ్రేణిని సంబంధాలు సందిగ్ధం కాకుండా ఆధునిక తెలుగులో విడమరచి తెలిపింది; వ్యక్తినామాలు లిప్యంతరీకరించబడ్డాయి.
- source_word: מִבְּנֵי אָסָף
  choice: ఆసాపు వంశస్థుల్లో ఒకడు
  rationale: అక్షరార్థంగా ‘ఆసాపు కుమారుల్లోనుండి’; ఇక్కడ వంశ లేదా గోత్ర సంబంధం ఉద్దేశించబడినందున ‘వంశస్థుల్లో ఒకడు’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: הַמְשֹׁרְרִים
  choice: గాయకులైన
  rationale: ఈ కృదంత రూపం ఆసాపు వంశస్థుల ఆలయ పాత్రను గాయకులుగా గుర్తిస్తుంది; ‘సంగీతకారులు’ కంటే ఇది మూలపదానికి మరింత ఖచ్చితం.
- source_word: לְנֶגֶד מְלֶאכֶת
  choice: పనిని పర్యవేక్షించే
  rationale: ఈ పరిపాలనా సందర్భంలో לְנֶגֶד పని విషయంలో బాధ్యత లేదా పర్యవేక్షణను సూచించగలదు. సహజమైన తెలుగులో ఆ సంబంధాన్ని ‘పర్యవేక్షించే’ అని తెలిపింది; ప్రత్యామ్నాయ భావాన్ని పాదసూచికలో ఉంచింది.
- source_word: בֵּית הָאֱלֹהִים
  choice: దేవుని మందిరం
  rationale: అక్షరార్థం ‘దేవుని ఇల్లు’; సందర్భంలో ఇది ఆలయాన్ని సూచిస్తున్నందున సాధారణ ఆధునిక తెలుగు పాఠకులకు సహజమైన ‘దేవుని మందిరం’ ఎంచుకుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి ఉపయోగించబడింది. పొడవైన హీబ్రూ వంశావళి నిర్మాణాన్ని సంబంధాలు స్పష్టంగా ఉండేలా చిన్న వాక్యాలుగా విభజించాం. ‘దేవుని మందిరం’ సందర్భార్థాన్ని సహజంగా తెలియజేస్తుంది; לְנֶגֶד లోని పరిపాలనా సూక్ష్మతను ప్రధాన పాఠం మరియు పాదసూచిక రెండింటిలో నిలిపాం.
