source:
  edition: WLC
  text: וּ/מַתַּנְיָ֣ה בֶן מִ֠יכָה בֶּן זַבְדִּ֨י בֶן אָסָ֜ף רֹ֗אשׁ הַ/תְּחִלָּה֙ יְהוֹדֶ֣ה לַ/תְּפִלָּ֔ה וּ/בַקְבֻּקְיָ֖ה מִשְׁנֶ֣ה מֵ/אֶחָ֑י/ו וְ/עַבְדָּא֙ בֶּן שַׁמּ֔וּעַ בֶּן גָּלָ֖ל בֶּן ידיתון־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/017.yaml
  text: And Mattaniah son of Micah[a], son of Zabdi, son of Asaph, was the head, who began the thanksgiving in prayer; and Bakbukiah was second among his brothers; and Abda son of Shammua, son of Galal, son of Jeduthun.
translation:
  language: te
  text: ఆసాపు కుమారుడైన జబ్ది కుమారుడైన మీకా కుమారుడు మత్తన్యా ప్రార్థనలో కృతజ్ఞతాస్తుతిని ప్రారంభించే ప్రధానుడు[a]. అతని సహోదరులలో బక్బుక్యా రెండవవాడు. యెదూతూను కుమారుడైన గాలాలు కుమారుడైన షమ్మూయ కుమారుడు అబ్దా.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ప్రార్థనలో కృతజ్ఞతలు తెలిపే ఆరంభపు ప్రధానుడు.” హీబ్రూ పదబంధాన్ని మరింత అక్షరార్థంగా, “ప్రారంభానికి ప్రధానుడు, ప్రార్థనలో కృతజ్ఞతలు తెలుపుతూ” అని అనువదించవచ్చు. మత్తన్యా కృతజ్ఞతాస్తుతికి నాయకత్వం వహించాడని లేదా దానిని ప్రారంభించాడని భావం.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹאשׁ
  choice: నాయకుడు
  rationale: ఈ లేవీయ సేవకుల జాబితాలో ఈ పదం నాయకత్వ స్థానాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘నాయకుడు’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: הַתְּחִלָּה
  choice: ప్రారంభించే
  rationale: ‘ఆరంభం’ అనే నామవాచకాన్ని తరువాతి క్రియతో కలిపి, మత్తన్యా ఆ స్తుతిని మొదలుపెట్టే పాత్రను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: יְהוֹדֶה
  choice: కృతజ్ఞతాస్తుతిని
  rationale: దేవాలయ ఆరాధన సందర్భంలో హిఫీల్ రూపం కృతజ్ఞత చెల్లించడం లేదా స్తుతించడం అనే భావాన్ని ఇస్తుంది; ‘కృతజ్ఞతాస్తుతి’ ఈ రెండు దగ్గరి భావాలను కలుపుతుంది.
- source_word: לַתְּפִלָּה
  choice: ప్రార్థనలో
  rationale: ל ఉపసర్గం ఇక్కడ ప్రార్థన అనే ఆరాధనా సందర్భాన్ని సూచిస్తున్నదిగా సహజంగా అనువదించబడింది.
- source_word: מִשְׁנֶה
  choice: రెండవవాడు
  rationale: ఇది రెండవ స్థానం లేదా హోదాను సూచిస్తుంది; మూలంలోని సంక్షిప్తతను అలాగే ఉంచుతుంది.
- source_word: מֵאֶחָיו
  choice: అతని సహోదరులలో
  rationale: మూలంలోని బంధుత్వ సమూహ భాషను కాపాడుతుంది; ‘తోటి లేవీయులు’ అని మరింత నిర్దిష్టంగా వ్యాఖ్యానించదు.
- source_word: יְדִיתוּן
  choice: యెదూతూను
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగు లిప్యంతరీకరణ.
theological_decisions:
- issue: ఆరాధనా సందర్భంలో ידה పదం భావం
  choice: కృతజ్ఞతాస్తుతి
  alternative: ఒప్పుకోలు
  rationale: ఆసాపు వంశానికి సంబంధించిన దేవాలయ ఆరాధనా సందర్భం కృతజ్ఞత/స్తుతి భావానికే బలంగా మద్దతిస్తుంది; ఇది సిద్ధాంతపరమైన నిర్ధారణ కాక సందర్భాధారిత పదార్థ నిర్ణయం.
- issue: רֹאשׁ הַתְּחִלָּה יְהוֹדֶה అనే కఠినమైన పదబంధ సంబంధం
  choice: కృతజ్ఞతాస్తుతిని ప్రారంభించే నాయకుడు
  alternative: ప్రార్థనలో కృతజ్ఞతలు తెలిపిన ఆరంభపు అధిపతి
  rationale: వాక్యనిర్మాణంలోని అసహజతను తెలుగులో అర్థవంతంగా చేస్తూనే, మత్తన్యా నాయకుడని మరియు అతడు కృతజ్ఞతాస్తుతిని ఆరంభించాడని సూచించే ప్రధాన భావాలను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; వంశావళి సంబంధాలను స్పష్టంగా చూపేందుకు ‘వంశస్థుడు’ ఉపయోగించబడింది. చివరి పేర్ల సమూహానికి హీబ్రూలో స్పష్టమైన క్రియ లేకపోవడంతో, సందర్భం ఆధారంగా ‘కూడా అక్కడ నివసించాడు’ అని పూరించబడింది; ఇది 11వ అధ్యాయంలోని నివాసుల జాబితాకు అనుగుణం.
