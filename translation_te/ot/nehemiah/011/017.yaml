revisions:
- from: ఆసాపు వంశస్థుడైన జబ్ది కుమారుడు మీకా కుమారుడైన మత్తన్యా ప్రార్థనలో కృతజ్ఞతాస్తుతిని ప్రారంభించే నాయకుడు[a]. అతని సహోదరులలో బక్బుక్యా రెండవవాడు. యెదూతూను వంశస్థుడైన గాలాలు కుమారుడు షమ్మూయ కుమారుడైన అబ్దా కూడా అక్కడ నివసించాడు.
  to: ఆసాపు కుమారుడైన జబ్ది కుమారుడైన మీకా కుమారుడు మత్తన్యా ప్రార్థనలో కృతజ్ఞతాస్తుతిని ప్రారంభించే ప్రధానుడు[a]. అతని సహోదరులలో బక్బుక్యా రెండవవాడు. యెదూతూను కుమారుడైన గాలాలు కుమారుడైన షమ్మూయ కుమారుడు అబ్దా.
  rationale: The revision removes the unsupported statement that Abda lived there and retains the Hebrew's final verbless genealogical entry. It also replaces generalized descent language with the explicit father-son chain found in the source. The difficult phrase רֹאשׁ הַתְּחִלָּה יְהוֹדֶה לַתְּפִלָּה remains rendered as Mattaniah's leading role in initiating thanksgiving in prayer, with the syntactic/lexical alternative preserved in the footnote.
