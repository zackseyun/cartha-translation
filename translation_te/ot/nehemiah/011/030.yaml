revisions:
- from: జానోహు, అదుల్లాము, వాటి గ్రామాలు, లాకీషు, దాని పొలాలు, అజేకా, దాని అనుబంధ పట్టణాల్లో[a] వారు నివసించారు[b]. బెయేర్షెబా మొదలుకొని హిన్నోము లోయ వరకు వారు విస్తరించి నివసించారు.
  to: జానోహు, అదుల్లాము వాటి గ్రామాలు, లాకీషు దాని పొలాలు, అజేకా దాని అనుబంధ పట్టణాలు[a]. వారు బెయేర్షెబా నుండి హిన్నోము లోయ వరకు మకాం వేశారు[b].
  rationale: The revision restores the Hebrew syntax and avoids adding the idea of spreading out. It preserves the source’s basic “encamped” sense in the main text, while the footnote supplies the contextually possible sense “settled/lived.”
