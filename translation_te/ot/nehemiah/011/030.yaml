source:
  edition: WLC
  text: זָנֹ֤חַ עֲדֻלָּם֙ וְ/חַצְרֵי/הֶ֔ם לָכִישׁ֙ וּ/שְׂדֹתֶ֔י/הָ עֲזֵקָ֖ה וּ/בְנֹתֶ֑י/הָ וַ/יַּחֲנ֥וּ מִ/בְּאֵֽר שֶׁ֖בַע עַד גֵּֽיא הִנֹּֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/030.yaml
  text: Zanoah[a], Adullam and their villages, Lachish and its fields, Azekah and its daughter towns[b]. So they camped from Beer-sheba as far as the Valley of Hinnom.
translation:
  language: te
  text: జానోహు, అదుల్లాము వాటి గ్రామాలు, లాకీషు దాని పొలాలు, అజేకా దాని అనుబంధ పట్టణాలు[a]. వారు బెయేర్షెబా నుండి హిన్నోము లోయ వరకు మకాం వేశారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “దాని కుమార్తెలు”; అంటే దానికి అనుబంధమైన గ్రామాలు లేదా చిన్న పట్టణాలు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ క్రియను “శిబిరం వేశారు” లేదా “నివసించారు” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: זָנֹחַ
  choice: జానోహు
  rationale: స్థలనామాన్ని ఆధునిక తెలుగు బైబిలు నామరూపాలకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: עֲדֻלָּם
  choice: అదుల్లాము
  rationale: హీబ్రూ స్థలనామాన్ని అనువదించకుండా తెలుగులో లిప్యంతరీకరించాం.
- source_word: חַצְרֵיהֶם
  choice: వాటి గ్రామాలు
  rationale: పట్టణాలకు అనుబంధమైన గ్రామీణ నివాసాలను సూచించే భౌగోళిక జాబితా సందర్భానికి సహజమైన రూపం.
- source_word: לָכִישׁ
  choice: లాకీషు
  rationale: స్థలనామాన్ని తెలుగులో లిప్యంతరీకరించాం.
- source_word: שְׂדֹתֶיהָ
  choice: దాని పొలాలు
  rationale: నగరానికి చెందిన సాగుభూములనే స్పష్టమైన, మూర్తమైన అర్థాన్ని నిలుపుతుంది.
- source_word: עֲזֵקָה
  choice: అజేకా
  rationale: స్థలనామాన్ని తెలుగులో లిప్యంతరీకరించాం.
- source_word: בְנֹתֶיהָ
  choice: దాని అనుబంధ పట్టణాలు
  rationale: అక్షరార్థమైన ‘కుమార్తెలు’ అనే హీబ్రూ రూపకం తెలుగులో అస్పష్టంగా ఉండవచ్చు; ప్రధాన పట్టణంపై ఆధారపడిన చిన్న పట్టణాల భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וַיַּחֲנוּ
  choice: వారు నివసించారు / విస్తరించి నివసించారు
  rationale: క్రియకు అక్షరార్థంగా ‘మకాం వేశారు’ అనే భావం ఉన్నప్పటికీ, యూదా ప్రజల పునరావాస జాబితాలో స్థిరనివాస భావం సందర్భానుకూలం; పాదసూచికలో అక్షరార్థం నిలిపాం.
- source_word: מִבְּאֵר שֶׁבַע עַד גֵּיא הִנֹּם
  choice: బెయేర్షెబా మొదలుకొని హిన్నోము లోయ వరకు
  rationale: భౌగోళిక విస్తృతిని సహజమైన తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
