translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన వాక్యనిర్మాణం వాడబడింది. మూలంలోని సంక్షిప్తత వల్ల ఏర్పడిన అస్పష్టతను ప్రధాన పాఠ్యంలో మితమైన స్పష్టీకరణతో, పాదటిప్పణిలో ప్రత్యామ్నాయ పఠనంతో సంరక్షించాం.
