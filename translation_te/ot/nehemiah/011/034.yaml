lexical_decisions:
- source_word: חָדִיד
  choice: హాదీదు
  rationale: స్థలాల జాబితాలోని స్వనామం. హీబ్రూ ఉచ్చారణకు సమీపంగా తెలుగులో లిప్యంతరీకరించబడింది.
- source_word: צְבֹעִים
  choice: సెబోయీము
  rationale: బెన్యామీను ప్రాంతంలోని స్థల నామం. పదార్థాన్ని అనువదించకుండా, హీబ్రూ ధ్వనిరూపం ṣəḇōʿîm‌ను సహజమైన తెలుగు రూపంలో లిప్యంతరీకరించబడింది.
- source_word: נְבַלָּט
  choice: నెబల్లాటు
  rationale: స్థల నామం. మసొరా పాఠంలోని ద్విత్వ లామెద్‌ను ‘ల్ల’తో ప్రతిబింబిస్తూ, చివరి ṭ ధ్వనిని ‘టు’గా సహజమైన తెలుగు నామరూపంలో ఇచ్చాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, జాబితా స్వరూపాన్ని అలాగే ఉంచి మూడు స్థల నామాలను సంక్షిప్తంగా లిప్యంతరీకరించాం. ఈ వచనంలో వివరణాత్మక క్రియాపదాన్ని చేర్చలేదు. ఆంగ్ల సంప్రదాయాల్లో కనిపించే లిప్యంతరణ భేదాలు తెలుగు పాఠానికి అవసరమైన అర్థభేదాన్ని కలిగించనందున పాదసూచికలు ఇవ్వలేదు.
