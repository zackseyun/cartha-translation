  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִן הַכֹּהֲנִים
  choice: యాజకుల్లో
  rationale: విభాగాన్ని పరిచయం చేసే ‘యాజకులలోనుండి/యాజకుల్లో’ అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: יְדַעְיָה
  choice: యెదాయా
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు బైబిలు నామరూపాలకు అనుగుణంగా లిప్యంతరీకరించింది.
- source_word: בֶן יוֹיָרִיב
  choice: యోయారీబు కుమారుడు
  rationale: హీబ్రూ వంశసంబంధ నిర్మాణాన్ని స్పష్టంగా, సహజమైన తెలుగు పదక్రమంలో అందిస్తుంది.
- source_word: יָכִין
  choice: యాకీను
  rationale: హీబ్రూ Yāḵîn నామాన్ని మూల ఉచ్చారణకు దగ్గరగా తెలుగులో లిప్యంతరీకరించింది.
