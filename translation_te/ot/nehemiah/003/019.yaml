  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְחַזֵּ֨ק עַל יָד֜/וֹ עֵ֧זֶר בֶּן יֵשׁ֛וּעַ שַׂ֥ר הַ/מִּצְפָּ֖ה מִדָּ֣ה שֵׁנִ֑ית מִ/נֶּ֕גֶד עֲלֹ֥ת הַ/נֶּ֖שֶׁק הַ/מִּקְצֹֽעַ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/019.yaml
  text: Next to him Ezer son of Jeshua[a], official of Mizpah[c][b], repaired another section opposite the ascent to the armory at the angle.
translation:
  language: te
  text: అతని పక్కనే మిస్పాకు అధికారి అయిన యేషూవ కుమారుడు ఏజెరు, ఆయుధశాలకు ఎక్కే దారికి ఎదురుగా, గోడ మలుపు దగ్గర మరో భాగాన్ని బాగుచేశాడు.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “రెండవ భాగాన్ని.” హీబ్రూ పదబంధం ఏజెరు అదనంగా మరొక గోడభాగాన్ని బాగుచేశాడని నొక్కిచెప్పవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “ఆయుధశాలకు ఎక్కే దారి దగ్గర ఉన్న మూలకు ఎదురుగా” అని కూడా అనువదించవచ్చు. హీబ్రూ వాక్యనిర్మాణంలో ‘మూల’ ఏ పదబంధంతో కలుస్తుందో కొంత సందిగ్ధంగా ఉంది.
    reason: syntactical_ambiguity
lexical_decisions:
- source_word: וַיְחַזֵּק
  choice: బాగుచేశాడు
  rationale: నెహెమ్యా 3లో ఈ క్రియ గోడ పునర్నిర్మాణ పనిలో పాల్గొనడాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘బాగుచేశాడు’ సహజంగా ఈ భావాన్ని తెలియజేస్తుంది.
- source_word: עַל יָדוֹ
  choice: అతని పక్కనే
  rationale: ఈ అధ్యాయంలోని నిర్మాణ క్రమంలో పక్కపక్కన ఉన్న పనిస్థలాలను సూచించే సహజమైన తెలుగు ప్రయోగం.
- source_word: שַׂר הַמִּצְפָּה
  choice: మిస్పాకు అధికారి
  rationale: שַׂר ఇక్కడ రాజరిక బిరుదు కంటే పరిపాలనా నాయకత్వాన్ని సూచిస్తుంది; ‘అధికారి’ ఆ భావాన్ని తటస్థంగా అందిస్తుంది.
- source_word: מִדָּה שֵׁנִית
  choice: మరో భాగాన్ని
  rationale: ఇది గోడలో అదనంగా చేపట్టిన భాగాన్ని సూచించే అవకాశం ఉంది; ‘మరో భాగం’ సహజంగా ఉండి, సంఖ్యాక్రమాన్ని అతిగా నిర్ధారించదు.
- source_word: מִנֶּגֶד
  choice: ఎదురుగా
  rationale: గుర్తింపబడిన స్థలానికి ఎదురుగా లేదా దానికి అభిముఖంగా ఉన్న ప్రదేశాన్ని సూచిస్తుంది.
- source_word: עֲלֹת
  choice: ఎక్కే దారికి
  rationale: పైకి వెళ్లే మార్గం లేదా ఎక్కుదలను ఆధునిక తెలుగులో స్పష్టంగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: הַנֶּשֶׁק
  choice: ఆయుధశాలకు
  rationale: పదం ఆయుధాలను సూచించగలిగినా, స్థలవర్ణనలో ఆయుధాలు నిల్వచేసే ప్రదేశం ఉద్దేశించబడి ఉండవచ్చు; అందువల్ల ‘ఆయుధశాల’ సందర్భోచితం.
- source_word: הַמִּקְצֹעַ
  choice: గోడ మలుపు దగ్గర
  rationale: ఈ పదం మూలను లేదా కోణంగా తిరిగే భాగాన్ని సూచిస్తుంది; సందర్భాన్ని స్పష్టం చేయడానికి ‘గోడ మలుపు’ అని అనువదించబడింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. వ్యక్తి, స్థలనామాలకు తెలుగు బైబిలు సంప్రదాయంలో సులభంగా గుర్తించగల రూపాలు వాడబడ్డాయి. మూలంలోని స్థలవర్ణన సందిగ్ధతను పాదటిప్పణిలో నిలిపాం.
