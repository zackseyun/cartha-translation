id: NEH.3.31
reference: Nehemiah 3:31
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אחרי הֶחֱזִ֗יק מַלְכִּיָּה֙ בֶּן הַ/צֹּ֣רְפִ֔י עַד בֵּ֥ית הַ/נְּתִינִ֖ים וְ/הָ/רֹכְלִ֑ים נֶ֚גֶד שַׁ֣עַר הַ/מִּפְקָ֔ד וְ/עַ֖ד עֲלִיַּ֥ת הַ/פִּנָּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/031.yaml
  text: After him Malkijah son of the goldsmith repaired as far as the house of the temple servants and the merchants, opposite the Inspection Gate, and as far as the upper room of the corner.
translation:
  language: te
  text: అతని తర్వాత కంసాలి కుమారుడు మల్కీయా తనిఖీ ద్వారానికి ఎదురుగా ఉన్న ఆలయ సేవకులు, వర్తకులకు చెందిన ఇంటివరకు, మూలలోని మేడగది వరకు మరమ్మతు చేశాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַצֹּרְפִי
  choice: కంసాలి
  rationale: లోహాన్ని కరిగించి శుద్ధిచేసి వస్తువులు తయారుచేసే వృత్తికారుణ్ణి సూచిస్తుంది; సందర్భంలో సంప్రదాయంగా ‘goldsmith’ అని వచ్చినా, హీబ్రూ పదం లోహశిల్పిని విస్తృతంగా సూచించగలదు.
- source_word: הַנְּתִינִים
  choice: ఆలయ సేవకులు
  rationale: దేవాలయ సేవకు నియమించబడిన వర్గాన్ని ఆధునిక పాఠకుడికి స్పష్టంగా తెలియజేస్తుంది.
- source_word: הָרֹכְלִים
  choice: వర్తకులు
  rationale: సంచరించి వస్తువులు అమ్మే వ్యాపారులను సూచించే పదానికి సహజమైన తెలుగు సమానం.
- source_word: שַׁעַר הַמִּפְקָד
  choice: తనిఖీ ద్వారం
  rationale: מפקד లెక్కింపు, నమోదు, తనిఖీ లేదా సమీకరణ భావాలను కలిగి ఉంది; ద్వారం పేరుగా ‘తనిఖీ ద్వారం’ మూలార్థాన్ని సహజంగా నిలుపుతుంది.
- source_word: עֲלִיַּת הַפִּנָּה
  choice: మూలనున్న మేడగది
  rationale: עֲלִיָּה పై అంతస్తు గది/మేడగదిని, הַפִּנָּה మూలను సూచిస్తాయి; తెలుగు వాక్య నిర్మాణంలో సంబంధాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. స్థలనామ స్వభావం గల ‘తనిఖీ ద్వారం’ను ప్రత్యేక నామంగా ఉంచి, వృత్తి మరియు సేవావర్గ పదాలకు సాధారణ పాఠకునికి స్పష్టమైన రూపాలు ఎంచుకున్నాం.
