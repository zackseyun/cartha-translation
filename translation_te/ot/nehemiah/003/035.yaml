base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/035.yaml
  text: And Tobiah the Ammonite was beside him[a], and he said, “Even what they are building—if a fox climbs up on it[b], he will break through their stone wall!”
translation:
  language: te
  text: 'అమ్మోనీయుడైన టోబీయా అతని పక్కనే ఉండి ఇలా అన్నాడు: “వాళ్లు కడుతున్నది కూడా—ఒక నక్క[a] దాని మీదికి ఎక్కితే, అది వాళ్ల రాతి గోడకు గండి కొడుతుంది![b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “నక్క” అని అనువదించిన హీబ్రూ పదం కొన్ని సందర్భాల్లో నక్కలాంటి మరో అడవి కుక్కజాతి జంతువును కూడా సూచించవచ్చు; ఇక్కడ “నక్క” అనేది సాధారణ అనువాదం.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “అది వాళ్ల రాళ్ల గోడను పడగొడుతుంది!” హీబ్రూ క్రియ గోడకు గండి కొట్టడం లేదా దాన్ని కూల్చివేయడం అనే భావాలను ఇవ్వగలదు; వారి గోడ బలహీనంగా ఉందనే టోబీయా ఎగతాళిలో ఇది భాగం.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶצְלוֹ
  choice: అతని పక్కనే ఉండి
  rationale: אצל అనే పదం సమీపాన్ని సూచిస్తుంది. టోబీయా సన్బల్లటు పక్కన ఉన్నాడనే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: גַּם אֲשֶׁר הֵם בּוֹנִים
  choice: వాళ్లు కడుతున్నది కూడా
  rationale: גַּם లోని ఉద్ఘాటనాత్మక లేదా అదనపు భావాన్ని నిలుపుతూ, టోబీయా ఎగతాళి ధోరణిని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אִם
  choice: ఎక్కితే
  rationale: హీబ్రూ షరతార్థక కణమైన אִם భావాన్ని తెలుగు షరతార్థక క్రియారూపంతో సహజంగా అందిస్తుంది.
- source_word: יַעֲלֶה שׁוּעָל
  choice: ఒక నక్క దాని మీదికి ఎక్కితే
  rationale: שׁוּעָל కు సాధారణ అర్థం ‘నక్క.’ గోడే సూచిత గమ్యమని తెలుగులో ‘దాని మీదికి’ ద్వారా స్పష్టం చేయబడింది.
- source_word: וּפָרַץ
  choice: అది ... గండి కొడుతుంది
  rationale: פרץ అంటే ఛేదించడం, గండి కొట్టడం లేదా కూల్చివేయడం. నక్కే ఏకవచన కర్తగా కొనసాగుతున్నట్లు ఉంచి, ఎగతాళిలోని సజీవ చిత్రణను నిలుపుతుంది.
- source_word: חוֹמַת אַבְנֵיהֶם
  choice: వాళ్ల రాతి గోడ
  rationale: ‘వారి రాళ్ల గోడ’ అనే నిర్మాణాన్ని సహజమైన తెలుగు ప్రయోగమైన ‘వాళ్ల రాతి గోడ’గా అందిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. ప్రత్యక్ష వాక్యంలో ఎగతాళి ధోరణిని డాష్ మరియు ఆశ్చర్యార్థక చిహ్నంతో నిలుపుతూ, మూలంలోని షరతార్థక నిర్మాణాన్ని సహజమైన తెలుగు క్రియారూపంలో వ్యక్తం చేశాం.
