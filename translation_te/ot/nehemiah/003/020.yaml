source:
  edition: WLC
  text: אַחֲרָ֨י/ו הֶחֱרָ֧ה הֶחֱזִ֛יק בָּר֥וּךְ בֶּן זבי מִדָּ֣ה שֵׁנִ֑ית מִן הַ֨/מִּקְצ֔וֹעַ עַד פֶּ֨תַח֙ בֵּ֣ית אֶלְיָשִׁ֔יב הַ/כֹּהֵ֖ן הַ/גָּדֽוֹל־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/020.yaml
  text: After him[a], Baruch son of Zabbai zealously repaired a second section[b], from the angle to the entrance of the house of Eliashib the high priest.
translation:
  language: te
  text: అతని తరువాత, జబ్బయి కుమారుడైన బారూకు[a] ఎంతో ఉత్సాహంతో[b] రెండవ భాగాన్ని బాగుచేశాడు—గోడ మలుపు నుండి ప్రధాన యాజకుడైన ఎల్యాషీబు ఇంటి ప్రవేశద్వారం వరకు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని ప్రాచీన అనువాదాల్లో కనిపించే ప్రత్యామ్నాయ నామ సంప్రదాయం ప్రకారం, ‘జక్కయి కుమారుడైన బారూకు’ అని కూడా ఉండవచ్చు.
    reason: alternative_reading
  - marker: b
    text: ‘ఎంతో ఉత్సాహంతో బాగుచేశాడు’ అనే భావానికి ఆధారమైన హీబ్రూ ప్రయోగం అసాధారణమైనది; అది బారూకు ఆ పనిని తీవ్రమైన ఆసక్తితో లేదా విశేష శ్రద్ధతో చేసినట్లు నొక్కిచెబుతున్నదని భావించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרָיו
  choice: అతని తరువాత
  rationale: ఈ అధ్యాయంలోని నిర్మాణ పనివారి జాబితాలో ఈ మాట ముందుగా పేర్కొన్న వ్యక్తి తరువాతి క్రమాన్ని, అతని పనిస్థలానికి ఆనుకొని ఉన్న భాగాన్ని సూచిస్తుంది.
- source_word: הֶחֱרָה הֶחֱזִיק
  choice: ఎంతో ఉత్సాహంతో ... బాగుచేశాడు
  rationale: הֶחֱזִיק ఇక్కడ గోడను బాగుచేయడం లేదా దృఢపరచడం అనే భావంలో ఉంది. అరుదైన הֶחֱרָה ఆ పనిలో బారూకు చూపిన తీవ్ర ఉత్సాహాన్ని లేదా అసాధారణ శ్రద్ధను నొక్కిచెబుతుంది.
- source_word: בָּרוּךְ בֶּן זבי
  choice: జబ్బయి కుమారుడైన బారూకు
  rationale: వచనంలోని హీబ్రూ వ్యంజన రూపాన్ని అనుసరించి వ్యక్తుల పేర్లను జబ్బయి, బారూకు అని లిప్యంతరీకరించాం; ప్రత్యామ్నాయ నామ సంప్రదాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: מִדָּה שֵׁנִית
  choice: రెండవ భాగాన్ని
  rationale: ఇది అక్షరార్థమైన కొలతకన్నా బారూకుకు అప్పగించబడిన మరొక గోడ భాగాన్ని సూచిస్తుంది; ‘రెండవ’ అనే క్రమభావాన్ని నిలిపాం.
- source_word: מִן הַמִּקְצוֹעַ
  choice: గోడ మలుపు నుండి
  rationale: ఈ నామవాచకం మూలను, కోణాన్ని లేదా తిరిగే చోటును సూచించగలదు. సందర్భం స్పష్టమయ్యేలా ‘గోడ మలుపు’ అని అనువదించాం.
- source_word: עַד פֶּתַח בֵּית
  choice: ఇంటి ప్రవేశద్వారం వరకు
  rationale: פֶּתַח అనేది ప్రవేశం, తెరువు లేదా ద్వారాన్ని సూచిస్తుంది; ఇక్కడ ఎల్యాషీబు నివాసానికి లేదా దాని ఆవరణకు సంబంధించిన భౌతిక ప్రవేశద్వారం భావం సహజంగా సరిపోతుంది.
- source_word: אֶלְיָשִׁיב הַכֹּהֵן הַגָּדוֹל
  choice: ప్రధాన యాజకుడైన ఎల్యాషీబు
  rationale: הַכֹּהֵן הַגָּדוֹל అనే స్థిరమైన పదవిని ఆధునిక ప్రామాణిక తెలుగులో ‘ప్రధాన యాజకుడు’ అని అందించాం.
