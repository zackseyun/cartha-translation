translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడాం. నిర్మాణ సంబంధ సందర్భం స్పష్టమయ్యేలా ‘గోడ మలుపు’ అని చెప్పాం. మూలంలోని అసాధారణ క్రియా ప్రయోగాన్ని అతిగా అక్షరానువాదం చేయకుండా, దాని తీవ్రతను ‘ఎంతో ఉత్సాహంతో’ ద్వారా నిలిపి, అనిశ్చితిని పాదసూచికలో వివరించాం.
