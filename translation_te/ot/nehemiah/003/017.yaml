source:
  edition: WLC
  text: אַחֲרָ֛י/ו הֶחֱזִ֥יקוּ הַ/לְוִיִּ֖ם רְח֣וּם בֶּן בָּנִ֑י עַל יָד֣/וֹ הֶחֱזִ֗יק חֲשַׁבְיָ֛ה שַׂר חֲצִי פֶ֥לֶךְ קְעִילָ֖ה לְ/פִלְכּֽ/וֹ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/017.yaml
  text: 'After him the Levites carried out repairs: Rehum son of Bani[a]. Next to him Hashabiah, ruler of half the district of Keilah[c][b], carried out repairs for his district.'
translation:
  language: te
  text: 'అతని తరువాత లేవీయులు మరమ్మతు చేశారు[a]: బానీ కుమారుడు రెహూము. అతని పక్కనే[b], కెయీలా ప్రాంతంలోని సగభాగానికి అధిపతియైన హషబ్యా తన ప్రాంతం కోసం మరమ్మతు చేశాడు[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘బాగుచేశారు.’ హీబ్రూ క్రియకు అక్షరార్థం ‘బలపరిచారు’; అయితే నెహెమ్యా 3లో అది గోడ మరమ్మతు పనిని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా ‘అతని చేతి దగ్గర’; ఇక్కడ ‘అతని పక్కన’ లేదా ‘అతనికి ఆనుకుని’ అని అర్థం.
    reason: lexical_alternative
  - marker: c
    text: లేదా ‘తనకు కేటాయించిన భాగం కోసం.’ హీబ్రూ పదబంధం హషబ్యా అధికారంలోని ప్రాంతాన్ని గానీ, అతనికి కేటాయించిన పని భాగాన్ని గానీ సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרָיו
  choice: అతని తరువాత
  rationale: గోడ మరమ్మతుదారుల జాబితాలో ఇది ముందుగా పేర్కొన్న వ్యక్తి తరువాతి క్రమాన్ని, అలాగే పని జరిగిన ఆనుకుని ఉన్న స్థానాన్ని సూచిస్తుంది.
- source_word: הֶחֱזִיקוּ / הֶחֱזִיק
  choice: మరమ్మతు పని చేశారు / చేశాడు
  rationale: חזק ధాతువు హిఫీల్ రూపం అక్షరార్థంగా ‘బలపరచడం’ అయినా, నెహెమ్యా 3లో గోడ మరమ్మతు పనిని చేపట్టడాన్ని సూచించే స్థిర ప్రయోగం.
- source_word: הַלְוִיִּם
  choice: లేవీయులు
  rationale: వారి జాతి-మతపరమైన గుర్తింపును సహజమైన ప్రామాణిక తెలుగు రూపంలో నిలుపుతుంది.
- source_word: רְחוּם בֶּן־בָּנִי
  choice: బానీ కుమారుడు రెహూము
  rationale: తెలుగు వాక్యనిర్మాణానికి అనుగుణంగా వంశసంబంధ సూచనను పేరుకు ముందు ఉంచి, వ్యక్తి పేర్లను లిప్యంతరీకరించింది.
- source_word: עַל יָדוֹ
  choice: అతని పక్కనే
  rationale: అక్షరార్థం ‘అతని చేతి దగ్గర’; ఈ అధ్యాయ సందర్భంలో పక్కనే ఉన్న పని స్థలాన్ని సూచించే సహజ తెలుగు నుడికారం ఎంచుకుంది.
- source_word: חֲשַׁבְיָה
  choice: హషబ్యా
  rationale: హీబ్రూ వ్యక్తి పేరును తెలుగు ధ్వని పద్ధతికి అనుగుణంగా లిప్యంతరీకరించింది.
- source_word: שַׂר חֲצִי פֶלֶךְ קְעִילָה
  choice: కెయీలా ప్రాంతంలోని సగభాగానికి అధిపతి
  rationale: שַׂרను పరిపాలనా అధిపతిగా, פֶלֶךְను ఈ సందర్భంలో పరిపాలనా ప్రాంతంగా అర్థం చేసుకొని హీబ్రూ సంబంధ నిర్మాణాన్ని స్పష్టమైన తెలుగులో తెలిపింది.
- source_word: לְפִלְכּוֹ
  choice: తన ప్రాంతం తరఫున
  rationale: לְ ఉపసర్గ బాధ్యత లేదా ప్రాతినిధ్య పరిధిని సూచించవచ్చు; ఈ అనువాదం పరిపాలనా భావాన్ని నిలుపుతూ ఖచ్చిత స్థలార్థాన్ని అతిగా నిర్ణయించదు.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని ఉపయోగించింది. జాబితా స్వభావాన్ని నిలుపుటకు మొదటి వాక్యంలో డాష్ వాడింది; పరిపాలనా పదజాలాన్ని సహజంగా ఉంచుతూ మూలంలోని అనిశ్చితిని పాదసూచికలో సంరక్షించింది.
