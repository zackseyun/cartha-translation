revisions:
- from: 'వారి పక్కన గిబియోనీయుడైన మెలట్యా, మేరోనోతీయుడైన యాదోను మరమ్మతు చేశారు. వారు నది అవతలి ప్రాంతపు అధిపతి పీఠానికి చెందిన[a] గిబియోను, మిస్పా మనుషులు.


    [a] అక్షరార్థంగా, “నది అవతలి ప్రాంతపు అధిపతి పీఠానికి.” ఇది అధిపతి అధికారిక కార్యస్థానాన్ని లేదా నివాసాన్ని సూచించవచ్చు; లేదా ఆ అధిపతి అధికార పరిధిని సూచించవచ్చు.'
  to: వారి పక్కన గిబియోనీయుడైన మెలట్యా, మేరోనోతీయుడైన యాదోను, గిబియోను మరియు మిస్పా ప్రజలతో కలిసి, నది అవతలి ప్రాంతపు పాలకుని పీఠం వరకు మరమ్మతు చేశారు.[a]
  rationale: సవరణ ద్వారా వచనాన్ని ఒక సంపూర్ణమైన, సహజమైన తెలుగు వాక్యంగా తీర్చిదిద్దాం. మెలట్యా, యాదోను, గిబియోను మరియు మిస్పా ప్రజలు మరమ్మతు పనిలో ఉన్నారని స్పష్టం చేశాం. హీబ్రూ చివరి పదబంధంలోని క్లిష్టతను సిద్ధాంతపరంగా నిర్ణయించకుండా, సందర్భానుగుణమైన ప్రధాన అనువాదం మరియు వివరణాత్మక పాదసూచికతో భద్రపరిచాం.
