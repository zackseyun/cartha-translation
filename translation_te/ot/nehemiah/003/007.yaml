translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన శైలి. మూలంలోని చివరి పరిపాలనా పదబంధపు నిజమైన అస్పష్టతను ప్రధాన పాఠ్యంలో అతిగా పరిష్కరించకుండా పాదసూచికలో వివరించింది.
