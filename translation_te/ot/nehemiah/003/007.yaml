  text: וְ/עַל יָדָ֨/ם הֶחֱזִ֜יק מְלַטְיָ֣ה הַ/גִּבְעֹנִ֗י וְ/יָדוֹן֙ הַ/מֵּרֹ֣נֹתִ֔י אַנְשֵׁ֥י גִבְע֖וֹן וְ/הַ/מִּצְפָּ֑ה לְ/כִסֵּ֕א פַּחַ֖ת עֵ֥בֶר הַ/נָּהָֽר־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/007.yaml
  text: And next to them Melatiah the Gibeonite and Jadon the Meronothite made repairs[a], along with the men of Gibeon and Mizpah, for the seat of the governor of the province Beyond the River.
translation:
  language: te
  text: వారి పక్కన గిబియోనీయుడైన మెలట్యా, మేరోనోతీయుడైన యాదోను, గిబియోను మరియు మిస్పా ప్రజలతో కలిసి, నది అవతలి ప్రాంతపు పాలకుని పీఠం వరకు మరమ్మతు చేశారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “నది అవతలి ప్రాంతపు పాలకుని పీఠానికి.” “పీఠం” అనేది పాలకుని అధికారిక కార్యస్థానం లేదా నివాసాన్ని సూచించవచ్చు; కొందరి అభిప్రాయంలో అది ఆ ప్రాంతంలో అతని పరిపాలనా అధికారకేంద్రాన్ని సూచించవచ్చు.
    reason: లְכִסֵּא అనే పదబంధం యొక్క ఖచ్చితమైన సంబంధం వివాదాస్పదం. ప్రధాన పాఠంలోని “వరకు” నిర్మాణ-జాబితా సందర్భాన్ని సుసంబద్ధంగా చూపుతుంది; పాదసూచిక ప్రత్యామ్నాయ పరిపాలనా అర్థాన్ని నిలుపుతుంది.
lexical_decisions:
- source_word: וְעַל יָדָם
  choice: వారి పక్కన
  rationale: నెహెమ్యా 3లో ఈ ప్రయోగం గోడపై పక్కపక్కన పనిచేసిన బృందాల స్థానాన్ని సూచిస్తుంది.
- source_word: הֶחֱזִיק
  choice: మరమ్మతు చేశారు
  rationale: ఈ అధ్యాయపు నిర్మాణ సందర్భంలో ఈ క్రియ గోడను బలపరచడం లేదా బాగుచేయడంలో పాల్గొనడాన్ని సూచిస్తుంది.
- source_word: מְלַטְיָה הַגִּבְעֹנִי
  choice: గిబియోనీయుడైన మెలట్యా
  rationale: వ్యక్తి పేరును లిప్యంతరీకరించి, ప్రాంతసంబంధ విశేషణాన్ని సహజమైన తెలుగులో తెలిపింది.
- source_word: וְיָדוֹן הַמֵּרֹנֹתִי
  choice: మేరోనోతీయుడైన యాదోను
  rationale: పేరు, ప్రాంతసంబంధ గుర్తింపు రెండింటినీ సమాంతరంగా నిలిపింది.
- source_word: אַנְשֵׁי גִבְעוֹן וְהַמִּצְפָּה
  choice: గిబియోను, మిస్పా మనుషులు
  rationale: హీబ్రూ వాక్యనిర్మాణంలో ఈ పదబంధం ముందున్న మెలట్యా, యాదోనులను వివరిస్తున్న సమానాధికార పదబంధంగా చదవవచ్చు; అందుకే అదనపు బృందాన్ని ఊహించకుండా అనువదించబడింది.
- source_word: לְכִסֵּא פַּחַת עֵבֶר הַנָּהָר
  choice: నది అవతలి ప్రాంతపు అధిపతి పీఠానికి చెందిన
  rationale: כִּסֵּא అనే ‘పీఠం/సింహాసనం’ భావాన్ని నిలిపి, לְ సంబంధాన్ని ‘చెందిన’తో సహజంగా తెలిపింది; ఇది అధికారిక స్థలమా లేక అధికార పరిధియా అన్న అస్పష్టతను పాదసూచికలో ఉంచింది.
