  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אַחֲרָ֨י/ו הֶחֱזִ֧יק בִּנְיָמִ֛ן וְ/חַשּׁ֖וּב נֶ֣גֶד בֵּיתָ֑/ם אַחֲרָ֣י/ו הֶחֱזִ֗יק עֲזַרְיָ֧ה בֶן מַעֲשֵׂיָ֛ה בֶּן עֲנָֽנְיָ֖ה אֵ֥צֶל בֵּיתֽ/וֹס־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/023.yaml
  text: After him Benjamin and Hasshub made repairs opposite their house. After him Azariah son of Maaseiah[a], son of Ananiah, made repairs beside his house.
translation:
  language: te
  text: అతని తరువాత బెన్యామీను, హష్షూబు[a] తమ ఇంటికి ఎదురుగా మరమ్మతులు చేశారు. అతని తరువాత అనన్యా కుమారుడైన మయశేయా కుమారుడు అజర్యా తన ఇంటి పక్కన మరమ్మతులు చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘హషూబు.’
    reason: హెబ్రీ వ్యక్తినామానికి సాధ్యమైన ప్రత్యామ్నాయ లిప్యంతరీకరణ.
lexical_decisions:
- source_word: אַחֲרָיו
  choice: అతని తరువాత
  rationale: ఈ అధ్యాయంలోని గోడ మరమ్మతుల వరుసను సూచించే పునరావృత నిర్మాణాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: הֶחֱזִיק
  choice: మరమ్మతులు చేశారు / చేశాడు
  rationale: חזק ధాతువు హిఫీల్ రూపం ఇక్కడ గోడ మరమ్మతు పనిలో పాలుపంచుకోవడాన్ని సూచిస్తుంది; అక్షరార్థమైన ‘బలపరిచారు’ కంటే సందర్భార్థాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: בִּנְיָמִן וְחַשּׁוּב
  choice: బెన్యామీను, హష్షూబు
  rationale: వ్యక్తుల పేర్లను హెబ్రీ ఉచ్చారణకు దగ్గరగా తెలుగులో లిప్యంతరీకరించాం.
- source_word: נֶגֶד בֵּיתָם
  choice: తమ ఇంటికి ఎదురుగా
  rationale: נֶגֶד యొక్క స్థానార్థాన్ని ‘ఎదురుగా’ తెలియజేస్తుంది; ఏకవచనమైన ‘ఇల్లు’ను, బహువచన స్వామ్యాన్ని ‘తమ ఇంటికి’గా నిలుపుతుంది.
- source_word: עֲזַרְיָה בֶן מַעֲשֵׂיָה בֶּן עֲנָנְיָה
  choice: అనన్యా కుమారుడైన మయశేయా కుమారుడు అజర్యా
  rationale: హెబ్రీ వంశావళి క్రమాన్ని తెలుగులో ఎవరు ఎవరి కుమారుడో స్పష్టంగా ఉండేలా సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אֵצֶל בֵּיתוֹ
  choice: తన ఇంటి పక్కన
  rationale: אֵצֶל సూచించే సమీప స్థానాన్ని సహజంగా తెలియజేస్తూ, గృహానికి సంబంధించిన భౌగోళిక సూచనను నిలుపుతుంది.
