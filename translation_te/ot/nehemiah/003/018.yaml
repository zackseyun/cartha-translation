source:
  edition: WLC
  text: אַחֲרָי/ו֙ הֶחֱזִ֣יקוּ אֲחֵי/הֶ֔ם בַּוַּ֖י בֶּן חֵנָדָ֑ד שַׂ֕ר חֲצִ֖י פֶּ֥לֶךְ קְעִילָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/018.yaml
  text: 'After him their brothers repaired: Bavvai son of Henadad[a], ruler of half the district of Keilah.'
translation:
  language: te
  text: 'అతని తరువాత వారి సహోదరులు మరమ్మతు చేశారు: కయీలా జిల్లాలో సగభాగానికి అధిపతియైన హేనాదాదు కుమారుడు బవ్వయి[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని పాఠ సంప్రదాయాలు ఈ పేరును ‘బవ్వయి’కి బదులుగా ‘బిన్నూయి’గా చదువుతాయి.
    reason: textual_variant
lexical_decisions:
- source_word: אַחֲרָיו
  choice: అతని తర్వాత
  rationale: మరమ్మతు పనుల జాబితాలో తదుపరి వ్యక్తి లేదా బృందాన్ని సూచించే క్రమార్థక ప్రయోగం; హీబ్రూ రూపాన్ని సహజమైన తెలుగులో ప్రతిబింబిస్తుంది.
- source_word: הֶחֱזִיקוּ
  choice: మరమ్మతు చేశారు
  rationale: మూల ధాతువుకు ‘బలపరచడం’ అనే ప్రాథమిక భావం ఉన్నా, నెహెమ్యా 3లో గోడ పునరుద్ధరణ పనిని సూచించే సందర్భోచిత అర్థం ఇదే.
- source_word: אֲחֵיהֶם
  choice: వారి సహోదరులు
  rationale: హీబ్రూ పదబంధంలోని ‘వారి సోదరులు’ అనే రూపాన్ని నిలుపుతూ, ఇది సహచరులు లేదా ఒకే వర్గానికి చెందినవారిని కూడా సూచించగల విస్తృత భావాన్ని తెలుగులో అందిస్తుంది.
- source_word: בַּוַּי
  choice: బవ్వయి
  rationale: WLCలోని మసొరేటిక్ స్వరరూపాన్ని అనుసరించిన వ్యక్తినామ లిప్యంతరీకరణ; భిన్న పాఠమైన ‘బిన్నూయి’ని పాదసూచికలో ఉంచాం.
- source_word: בֶּן חֵנָדָד
  choice: హేనాదాదు కుమారుడు
  rationale: సాధారణ హీబ్రూ పితృనామ నిర్మాణాన్ని సహజమైన తెలుగు క్రమంలో అనువదించాం.
- source_word: שַׂר
  choice: అధిపతి
  rationale: ఇక్కడ పౌరపాలనా విభాగానికి బాధ్యత వహించే అధికారిని సూచిస్తుంది; సైనిక భావాన్ని అనవసరంగా చేర్చదు.
- source_word: חֲצִי פֶּלֶךְ
  choice: జిల్లాలో సగభాగం
  rationale: పాలనా ఉపవిభాగాన్ని సూచించే పదబంధాన్ని ఆధునిక పాఠకులకు స్పష్టంగా ఉండేలా అనువదించాం.
- source_word: קְעִילָה
  choice: కయీలా
  rationale: హీబ్రూ స్థలనామానికి తెలుగు లిప్యంతరీకరణ.
