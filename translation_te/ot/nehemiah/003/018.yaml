  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన శైలి వాడబడింది. హీబ్రూ వాక్యంలో వ్యక్తి పేరు తరువాత వచ్చే అధికార పదవిని తెలుగులో స్పష్టత కోసం సంబంధవాచక నిర్మాణంగా అమర్చాం; ‘వారి సహోదరులు’ అనే మూలంలోని బహువచనాన్ని నిలిపి, బవ్వయి ఆ బృందంలో ఒకడని ‘వారిలో’ ద్వారా సహజంగా తెలిపాం.
