  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలిని ఉపయోగించాం. పరిపాలనా పదజాలాన్ని సందర్భానుసారంగా స్పష్టీకరించాం; కుమార్తెల భాగస్వామ్యాన్ని మూలంలోని బలంతోనే నిలిపాం.
