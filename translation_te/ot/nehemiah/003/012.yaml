  yaml_path: translation/ot/nehemiah/003/012.yaml
  text: Next to him Shallum son of Hallohesh[a], ruler of half the district of Jerusalem, made repairs—he and his daughters.
translation:
  language: te
  text: అతని పక్కనే హల్లోహేషు కుమారుడైన షల్లూము, యెరూషలేము పరిపాలనా ప్రాంతంలోని సగభాగానికి అధికారి, మరమ్మతులు చేశాడు—అతడూ అతని కుమార్తెలూ కలిసి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతని పక్కన … మరమ్మతులు చేశాడు.” హీబ్రూ నుడికారం అక్షరార్థంగా ‘అతని చేతి పక్కన’ అని ఉండి, ముందుగా పేర్కొన్న పనివాని భాగానికి ఆనుకొని చేసిన పనిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל יָדוֹ
  choice: అతని పక్కనే
  rationale: ‘అతని చేతి వద్ద’ అనే అక్షరార్థం తెలుగులో అస్పష్టంగా ఉంటుంది. నెహెమ్యా 3 సందర్భంలో ఇది ముందుగా పేర్కొన్న పనివాని భాగానికి ఆనుకొని ఉన్న భాగాన్ని సూచించే స్థలసంబంధ నుడికారం.
- source_word: הֶחֱזִיק
  choice: మరమ్మతులు చేశాడు
  rationale: హిఫీల్ రూపంలోని חזק ఈ అధ్యాయంలో గోడ పునర్నిర్మాణం లేదా మరమ్మతు పనిలో పాల్గొనడాన్ని సూచిస్తుంది; సందర్భానుకూలమైన సహజ తెలుగు ఇది.
- source_word: שַׁלּוּם
  choice: షల్లూము
  rationale: హీబ్రూ వ్యక్తిపేరును ఆధునిక తెలుగు ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: בֶּן הַלּוֹחֵשׁ
  choice: హల్లోహేషు కుమారుడు
  rationale: తండ్రి పేరుతో వ్యక్తిని గుర్తించే హీబ్రూ నిర్మాణాన్ని సహజమైన తెలుగు క్రమంలో ఇచ్చాం; హల్లోహేషు అనే పేరును లిప్యంతరీకరించాం.
- source_word: שַׂר חֲצִי פֶּלֶךְ יְרוּשָׁלִָם
  choice: యెరూషలేము పరిపాలనా ప్రాంతంలో సగభాగానికి అధికారి
  rationale: שַׂר ఇక్కడ పరిపాలనా అధికారిని, פֶּלֶךְ చిన్న పరిపాలనా ప్రాంతాన్ని సూచిస్తాయి. ‘ప్రాంతంలో సగభాగానికి’ అనే రూపం అతడు యెరూషలేము నగరంలో సగానికి అధిపతి అన్న అపార్థాన్ని తగ్గిస్తుంది.
- source_word: הוּא וּבְנוֹתָיו
  choice: అతడూ అతని కుమార్తెలూ కలిసి
  rationale: షల్లూముతో పాటు అతని కుమార్తెలు కూడా పనిలో పాల్గొన్నారనే ప్రత్యేక ప్రస్తావనను స్పష్టంగా, సహజంగా నిలిపాం.
