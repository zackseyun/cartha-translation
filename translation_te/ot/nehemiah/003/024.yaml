translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన కథన శైలి వాడబడింది. స్థల నిర్మాణానికి సంబంధించిన రెండు హెబ్రీ పదాల భేదాన్ని ‘మలుపు’ మరియు ‘మూల’తో నిలిపి, మూలపాఠంలోని అనిశ్చితిని పాదసూచికల్లో సంరక్షించాం.
