source:
  edition: WLC
  text: אַחֲרָ֣י/ו הֶחֱזִ֗יק בִּנּ֛וּי בֶּן חֵנָדָ֖ד מִדָּ֣ה שֵׁנִ֑ית מִ/בֵּ֣ית עֲזַרְיָ֔ה עַד הַ/מִּקְצ֖וֹעַ וְ/עַד הַ/פִּנָּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/024.yaml
  text: After him[a], Binnui son of Henadad repaired another section[b], from the house of Azariah as far as the angle and as far as the corner.
translation:
  language: te
  text: అతని తరువాత హేనాదాదు కుమారుడు బిన్నూయి మరొక భాగాన్ని[a] మరమ్మతు చేశాడు; అజర్యా ఇంటి నుండి మలుపు[b] వరకు, అలాగే మూల వరకు చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘రెండవ భాగాన్ని,’ లేదా ‘రెండవ కొలత భాగాన్ని.’ ఈ హెబ్రీ పదబంధం బిన్నూయి మరమ్మతు చేసిన అదనపు భాగాన్ని గానీ, రెండవ కొలత విభాగాన్ని గానీ సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ ‘మలుపు,’ ‘మూల’ అని అనువదించిన రెండు హెబ్రీ పదాలు దగ్గరి భావాలు కలిగినవే అయినా ఒకే పదాలు కావు; అవి సమీపంలోని రెండు వేర్వేరు నిర్మాణ భాగాలను సూచించి ఉండవచ్చు.
    reason: cultural_note
lexical_decisions:
- source_word: אַחֲרָיו
  choice: అతని తరువాత
  rationale: నెహెమ్యా 3లో మరమ్మతు పనివారి వరుసను సూచిస్తుంది. హెబ్రీ పదం తప్పనిసరిగా భౌగోళికంగా పక్కనే ఉన్నాడని చెప్పదు.
- source_word: הֶחֱזִיק
  choice: మరమ్మతు చేశాడు
  rationale: మూలార్థం ‘బలపరచడం’ అయినప్పటికీ, ఈ అధ్యాయంలోని గోడ నిర్మాణ సందర్భంలో మరమ్మతు పని చేయడమే ఉద్దేశం.
- source_word: בִּנּוּי בֶּן־חֵנָדָד
  choice: హేనాదాదు కుమారుడు బిన్నూయి
  rationale: హెబ్రీ వ్యక్తినామాలను తెలుగు ధ్వనులకు అనుగుణంగా లిప్యంతరీకరించి, పితృనామ సంబంధాన్ని సహజమైన తెలుగు క్రమంలో తెలిపింది.
- source_word: מִדָּה שֵׁנִית
  choice: మరొక భాగాన్ని
  rationale: గోడలో అదనంగా మరమ్మతు చేసిన విభాగాన్ని సందర్భానుసారంగా సహజంగా తెలియజేస్తుంది; ‘రెండవ కొలత భాగం’ అనే మరింత అక్షరార్థమైన భావం కూడా సాధ్యమే కనుక పాదసూచికలో ఉంచబడింది.
- source_word: מִבֵּית עֲזַרְיָה
  choice: అజర్యా ఇంటి దగ్గర నుంచి
  rationale: ప్రారంభ స్థానాన్ని సూచించే מִן‌ను తెలుగులో సహజంగా వ్యక్తం చేస్తూ, ‘అజర్యా ఇల్లు’ అనే స్థలసూచనను నిలుపుతుంది.
- source_word: עַד הַמִּקְצוֹעַ
  choice: గోడ మలుపు వరకు
  rationale: ఈ నామవాచకం గోడ తిరిగే చోటు లేదా కోణాన్ని సూచించగలదు. తరువాత వచ్చే ‘మూల’ అనే వేరే పదంతో భేదాన్ని నిలుపడానికి ‘మలుపు’ ఎంచుకోబడింది.
- source_word: וְעַד הַפִּנָּה
  choice: మూల వరకు
  rationale: פִּנָּה సాధారణంగా మూలను లేదా మూల నిర్మాణాన్ని సూచిస్తుంది; పునరుక్తమైన עַד భావాన్ని ‘వరకు’తో నిలుపుతుంది.
