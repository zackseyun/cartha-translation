translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, బహిరంగ ఎగతాళికి తగిన వేగవంతమైన ప్రశ్నల క్రమాన్ని నిలిపాం. గౌరవప్రదమైన కథన శైలితో పాటు సంభాషణలో సహజమైన ‘వాళ్లు’ రూపాన్ని ఉపయోగించాం. మూలంలోని రాళ్లకు ప్రాణం పోయడం అనే సజీవ రూపకాన్ని సరళీకరించలేదు.
