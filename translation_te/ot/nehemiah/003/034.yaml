source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר לִ/פְנֵ֣י אֶחָ֗י/ו וְ/חֵיל֙ שֹֽׁמְר֔וֹן וַ/יֹּ֕אמֶר מָ֛ה הַ/יְּהוּדִ֥ים הָ/אֲמֵלָלִ֖ים עֹשִׂ֑ים הֲ/יַעַזְב֨וּ לָ/הֶ֤ם הֲ/יִזְבָּ֨חוּ֙ הַ/יְכַלּ֣וּ בַ/יּ֔וֹם הַ/יְחַיּ֧וּ אֶת הָ/אֲבָנִ֛ים מֵ/עֲרֵמ֥וֹת הֶ/עָפָ֖ר וְ/הֵ֥מָּה שְׂרוּפֽוֹת׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/034.yaml
  text: And he said before his brothers and the army of Samaria[a], and said, “What are these feeble Jews doing? Will they restore it for themselves? Will they sacrifice? Will they finish in a day? Will they revive the stones from the heaps of dust, though they are burned?”
translation:
  language: te
  text: 'అతడు తన సహోదరుల సమక్షంలో, సమార్య సైన్యం ఎదుట ఇలా అన్నాడు: “ఈ బలహీన యూదులు ఏమి చేస్తున్నారు? వాళ్లంతట వాళ్లే దాన్ని పునర్నిర్మించుకుంటారా?[a] బలులు అర్పిస్తారా? ఒక్క రోజులోనే పని ముగిస్తారా? దుమ్ము కుప్పల్లోని రాళ్లకు—అవి కాలిపోయినప్పటికీ—మళ్లీ ప్రాణం పోస్తారా?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పదబంధం క్లిష్టమైనది. దీనిని మరింత అక్షరార్థంగా, “వాళ్లు దాన్ని తమకే వదిలేస్తారా?” అని, లేదా సందర్భానుసారంగా, “వాళ్లంతట వాళ్లే దాన్ని పునర్నిర్మిస్తారా?” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִפְנֵי אֶחָיו
  choice: తన సహోదరుల సమక్షంలో
  rationale: לִפְנֵי అనేది వారి సమక్షంలో మాట్లాడడాన్ని సూచిస్తుంది. אֶחָיו అక్షరార్థంగా ‘అతని సహోదరులు’; ఇక్కడ సహచరులు లేదా అధికారులు ఉద్దేశింపబడి ఉండవచ్చు, అయినా మూలంలోని బంధుత్వ పదాన్ని నిలిపాం.
- source_word: וְחֵיל שֹׁמְרוֹן
  choice: సమరయ సైన్యం ఎదుట
  rationale: חֵיל ఇక్కడ సైనిక బలగాన్ని సూచిస్తుంది. ‘సైన్యం’ ఆధునిక తెలుగులో సహజంగా ఉండి, బహిరంగ సైనిక సందర్భాన్ని స్పష్టం చేస్తుంది.
- source_word: הָאֲמֵלָלִים
  choice: బలహీన
  rationale: ఈ విశేషణం నిస్సహాయతను, దుర్బలతను ఎగతాళిగా సూచిస్తుంది. ‘బలహీన’ అనే పదం ఆ అవమానకర ధోరణిని సహజ తెలుగులో నిలుపుతుంది.
- source_word: הֲיַעַזְבוּ לָהֶם
  choice: వాళ్లంతట వాళ్లే దాన్ని పునర్నిర్మించుకుంటారా?
  rationale: עזב సాధారణంగా ‘విడిచిపెట్టు’ అని అర్థమిచ్చినా, ఈ ప్రయోగం క్లిష్టమైనది. గోడ నిర్మాణ సందర్భంలో ‘తమంతట తామే తమ కోసం పునర్నిర్మించుకుంటారా?’ అనే భావాన్ని ప్రధాన పాఠ్యంలో ఇచ్చి, అనిశ్చితిని పాదసూచికలో వెల్లడించాం.
- source_word: הֲיִזְבָּחוּ
  choice: బలులు అర్పిస్తారా?
  rationale: זבח బలి అర్పించడాన్ని సూచిస్తుంది. ‘బలులు అర్పించు’ అనేది తెలుగులో స్పష్టమైన, సహజమైన ఆరాధనా ప్రయోగం.
- source_word: הַיְכַלּוּ בַיּוֹם
  choice: ఒక్క రోజులోనే పని ముగిస్తారా?
  rationale: כלה ఇక్కడ పూర్తి చేయడం లేదా ముగించడం అనే భావం ఇస్తుంది. అంతర్లీన కర్మను తెలుగులో సహజత కోసం ‘పని’గా వ్యక్తం చేశాం; ‘ఒక్క...నే’ ఎగతాళిలోని అసాధ్యత భావాన్ని ప్రతిబింబిస్తుంది.
- source_word: הַיְחַיּוּ אֶת הָאֲבָנִים
  choice: రాళ్లకు మళ్లీ ప్రాణం పోస్తారా?
  rationale: חיה అక్షరార్థంగా జీవింపజేయడం లేదా తిరిగి ప్రాణం కలిగించడం. ధ్వంసమైన రాళ్లను వ్యక్తీకరించే మూల రూపకాన్ని ‘మళ్లీ ప్రాణం పోయడం’గా నిలిపాం.
- source_word: מֵעֲרֵמוֹת הֶעָפָר
  choice: దుమ్ము కుప్పల్లోని
  rationale: עֲרֵמוֹת అంటే కుప్పలు; עָפָר అంటే దుమ్ము లేదా మట్టి. ‘దుమ్ము కుప్పలు’ మూలానికి సన్నిహితంగా ఉండి శిథిల దృశ్యాన్ని స్పష్టంగా చూపుతుంది.
- source_word: וְהֵמָּה שְׂרוּפוֹת
  choice: అవి కాలిపోయినప్పటికీ
  rationale: ఈ ఉపవాక్యం రాళ్ల అగ్నిదగ్ధ స్థితిని తెలుపుతుంది. సందర్భంలోని వ్యతిరేక భావాన్ని తెలుగులో ‘అయినప్పటికీ’తో సహజంగా వ్యక్తం చేశాం.
