source:
  edition: WLC
  text: וַ/נִּבְנֶה֙ אֶת הַ֣/חוֹמָ֔ה וַ/תִּקָּשֵׁ֥ר כָּל הַ/חוֹמָ֖ה עַד חֶצְיָ֑/הּ וַ/יְהִ֧י לֵ֦ב לָ/עָ֖ם לַ/עֲשֽׂוֹת־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/038.yaml
  text: So we rebuilt the wall[a], and the whole wall was joined together up to half its height, for the people had a heart to work.
translation:
  language: te
  text: మేము ప్రాకారాన్ని తిరిగి కట్టాము. ప్రాకారమంతా దాని సగం వరకు[a] ఒకటిగా కలిసింది; ఎందుకంటే ప్రజలకు పని చేయాలనే మనసు ఉంది.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “దాని సగం వరకు.” నిర్మాణ సందర్భంలో ఇది ప్రాకారం సగం ఎత్తువరకు కట్టబడిందని సూచించవచ్చు.
    reason: source_ambiguity
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా, “చేయడానికి ప్రజలకు హృదయం ఉంది.” ఈ నుడికారం వారికి పని చేయాలనే అంతరంగ సంకల్పం, సుముఖత ఉన్నాయని అర్థం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנִּבְנֶה
  choice: కాబట్టి మేము ప్రాకారాన్ని తిరిగి కట్టాము
  rationale: בנה అనే క్రియ యొక్క Qal wayyiqtol ప్రథమ పురుష బహువచన రూపం కథనంలోని తదుపరి చర్యను సూచిస్తుంది. ఇప్పటికే ఉన్న యెరూషలేము ప్రాకారాన్ని పునరుద్ధరిస్తున్న సందర్భం వల్ల ‘తిరిగి కట్టాము’ సహజంగా ఉంది; waw యొక్క కథన సంబంధాన్ని ‘కాబట్టి’ తెలియజేస్తుంది.
- source_word: הַחוֹמָה
  choice: ప్రాకారం
  rationale: חוֹמָה పట్టణాన్ని చుట్టే రక్షణ గోడను సూచిస్తుంది. ఆధునిక ప్రామాణిక తెలుగులో ‘ప్రాకారం’ ఈ సందర్భానికి స్పష్టమైన, గౌరవప్రదమైన పదం.
- source_word: וַתִּקָּשֵׁר
  choice: ఒకటిగా కలిసింది
  rationale: קשר యొక్క Niphal రూపం విడివిడిగా మరమ్మతు చేసిన భాగాలు కలసి నిరంతర ప్రాకారంగా ఏర్పడిన ఫలితాన్ని సూచిస్తుంది. ‘ఒకటిగా కలిసింది’ ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: כָּל הַחוֹמָה
  choice: ప్రాకారమంతా
  rationale: నిర్దిష్ట నామవాచకంతో కూడిన כָּל సంపూర్ణతను వ్యక్తం చేస్తుంది; ‘ప్రాకారమంతా’ సహజమైన తెలుగు రూపం.
- source_word: עַד חֶצְיָהּ
  choice: దాని సగం ఎత్తువరకు
  rationale: హీబ్రూలో అక్షరార్థంగా ‘దాని సగం వరకు’ అని ఉంది. నిర్మాణ పురోగతి సందర్భంలో ఇది సాధారణంగా ప్రాకారం సగం ఎత్తుకు చేరిందని సూచిస్తుంది; ‘ఎత్తు’ను పాఠ్యంలో స్పష్టం చేస్తూ అక్షరార్థంలోని సంక్షిప్తతను పాదసూచికలో ఉంచాం.
- source_word: וַיְהִי לֵב לָעָם
  choice: ప్రజలకు ... మనసు ఉంది
  rationale: అక్షరార్థంగా ‘ప్రజలకు హృదయం ఉంది’ అనే హీబ్రూ నుడికారం వారి అంతరంగ సంకల్పాన్ని, సుముఖతను వ్యక్తం చేస్తుంది. తెలుగులో ‘మనసు ఉంది’ రూపం ఆ అంతరంగ భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: לַעֲשׂוֹת
  choice: పని చేయాలనే
  rationale: עשה సాధారణంగా ‘చేయు/నిర్వహించు’ అని అర్థం. ప్రాకారం కట్టే సందర్భంలో ‘పని చేయు’ అనేది సందర్భోచితమైన సహజ అనువాదం.
