translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథన శైలి వాడబడింది. హీబ్రూ నుడికారంలోని ‘హృదయం’ భావాన్ని సహజమైన ‘మనసు’గా ఇచ్చి, అక్షరార్థాన్ని పాదసూచికలో నిలిపాం; עַד חֶצְיָהּ లోని సంక్షిప్తతను కూడా పాదసూచికలో వెల్లడించాం.
