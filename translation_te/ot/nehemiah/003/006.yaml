id: NEH.3.6
reference: Nehemiah 3:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אֵת֩ שַׁ֨עַר הַיְשָׁנָ֜ה הֶחֱזִ֗יקוּ יֽוֹיָדָע֙ בֶּן פָּסֵ֔חַ וּ/מְשֻׁלָּ֖ם בֶּן בְּסֽוֹדְיָ֑ה הֵ֣מָּה קֵר֔וּ/הוּ וַֽ/יַּעֲמִ֨ידוּ֙ דַּלְתֹתָ֔י/ו וּ/מַנְעֻלָ֖י/ו וּ/בְרִיחָֽי/ו־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/006.yaml
  text: And Joiada son of Paseah and Meshullam son of Besodeiah repaired the Old Gate. They laid its beams and set up its doors[a], its bolts, and its bars.
translation:
  language: te
  text: పాసేయ కుమారుడైన యోయాదా, బెసోద్యా కుమారుడైన మెషుల్లాము పాత ద్వారానికి[a] మరమ్మతు చేశారు. వారే దానికి దూలాలు అమర్చి, దాని తలుపులను, గడియలను, అడ్డగడియలను అమర్చారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, రెండో పదాన్ని ‘పాత’ అనే విశేషణంగా కాక స్థలనామంగా తీసుకుంటే, “యెషానా ద్వారం.”
    reason: alternative_reading
lexical_decisions:
- source_word: הֶחֱזִיקוּ
  choice: మరమ్మతు చేశారు
  rationale: నెహెమ్యా 3లో నిర్మాణ భాగాన్ని పునరుద్ధరించడాన్ని తెలిపే సాధారణ కార్యవివరణగా ఈ క్రియ వాడబడింది; ఆధునిక తెలుగులో ‘మరమ్మతు చేశారు’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: שַׁעַר הַיְשָׁנָה
  choice: పాత ద్వారం
  rationale: ఈ పదబంధం సహజంగా ‘పాత ద్వారం’ అనే ద్వారనామాన్ని సూచిస్తుంది. అయితే రెండో పదాన్ని యెషానా అనే స్థలనామంగా తీసుకునే అవకాశం పాదటిప్పణిలో ఉంచబడింది.
- source_word: קֵרֻהוּ
  choice: దానికి దూలాలు అమర్చి
  rationale: קרה క్రియ దూలాలతో కప్పడం లేదా పైకప్పు వేయడాన్ని సూచిస్తుంది. ద్వార నిర్మాణ సందర్భంలో ‘దూలాలు అమర్చి’ అనేది కార్యాన్ని స్పష్టంగా తెలియజేస్తూ, పూర్తిగా పైకప్పు వేశారనే అదనపు భావాన్ని రుద్దదు.
- source_word: וַיַּעֲמִידוּ
  choice: నిలిపారు
  rationale: మూలక్రియ ‘నిలబడేలా చేయడం/స్థానంలో పెట్టడం’ అనే భావాన్ని ఇస్తుంది. ద్వార భాగాలను అమర్చిన సందర్భంలో ‘నిలిపారు’ మూలరూపకాన్ని కాపాడుతుంది.
- source_word: דַּלְתֹתָיו
  choice: దాని తలుపులను
  rationale: బహువచనం నగర ద్వారంలోని జత తలుపు పలకలను సూచిస్తుంది; ‘తలుపులు’ ఆధునిక పాఠకులకు సహజమైన పదం.
- source_word: מַנְעֻלָיו
  choice: గడియలను
  rationale: ద్వారాన్ని బిగించే సాధనాలను సూచించే ఈ పదానికి ‘గడియలు’ తెలుగు నిర్మాణ సందర్భంలో స్పష్టమైన, అనాకాలికత లేని ఎంపిక.
- source_word: בְרִיחָיו
  choice: అడ్డగడియలను
  rationale: తలుపులను లోపల నుంచి అడ్డంగా బిగించే కడ్డీలను సూచిస్తుంది; ముందున్న మַנְעֻלָיוతో తేడా స్పష్టంగా ఉండేందుకు ‘అడ్డగడియలు’ ఎంచుకోబడింది.
- source_word: הֵמָּה
  choice: వారే
  rationale: పేర్కొన్న ఇద్దరే తరువాతి పనులు చేశారనే హెబ్రీ సర్వనామంలోని ఉద్ఘాటనను ‘వారే’ నిలుపుతుంది.
- source_word: יֽוֹיָדָע ... וּמְשֻׁלָּם
  choice: యోయాదా ... మెషుల్లాము
  rationale: వ్యక్తుల పేర్లు తెలుగు ధ్వని-లిపి సంప్రదాయానికి అనుగుణంగా లిప్యంతరీకరించబడ్డాయి.
- source_word: פָּסֵחַ / בְּסוֹדְיָה
  choice: పాసేయ / బెసోద్యా
  rationale: తండ్రుల పేర్లు అనువదించకుండా తెలుగు ధ్వని-లిపి సంప్రదాయానికి అనుగుణంగా లిప్యంతరీకరించబడ్డాయి.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన నిర్మాణ-వివరణ శైలి వాడబడింది. పేర్లలో సుపరిచిత తెలుగు బైబిలు రూపాలకు దగ్గరగా ఉండే లిప్యంతరీకరణను అనుసరించాం; మూలంలోని క్రియాక్రమం, బహువచన భాగాలు, הֵמָּה ఉద్ఘాటన సాధ్యమైనంత వరకు నిలుపబడ్డాయి.
