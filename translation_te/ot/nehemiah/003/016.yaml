source:
  edition: WLC
  text: אַחֲרָ֤י/ו הֶחֱזִיק֙ נְחֶמְיָ֣ה בֶן עַזְבּ֔וּק שַׂ֕ר חֲצִ֖י פֶּ֣לֶךְ בֵּֽית צ֑וּר עַד נֶ֨גֶד֙ קִבְרֵ֣י דָוִ֔יד וְ/עַד הַ/בְּרֵכָה֙ הָ/עֲשׂוּיָ֔ה וְ/עַ֖ד בֵּ֥ית הַ/גִּבֹּרִֽים־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/016.yaml
  text: After him Nehemiah son of Azbuk[a], ruler of half the district of Beth-zur, made repairs as far as opposite the tombs of David, and as far as the pool that was made[b], and as far as the house of the mighty men.
translation:
  language: te
  text: అతని తరువాత[a], బేత్-సూరు పరిపాలనా ప్రాంతంలోని సగభాగానికి అధిపతియైన అజ్బూకు కుమారుడు నెహెమ్యా, దావీదు సమాధులకు ఎదురుగా ఉన్న చోటివరకు, నిర్మించబడిన కొలను వరకు, వీరుల భవనం[b] వరకు మరమ్మతులు చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, మరమ్మతుల జాబితాలో ఈ మాటను కాలక్రమంగా కాక స్థలపరంగా అర్థం చేసుకుంటే, ‘అతని పక్కనే.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘యోధుల భవనం.’ ఇది ఏదైనా సైనిక భవనాన్ని సూచించవచ్చు; అయితే దాని ఖచ్చితమైన గుర్తింపు అనిశ్చితం.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרָיו
  choice: అతని తరువాత
  rationale: నెహెమ్యా 3లోని మరమ్మతుల జాబితాలో ఈ పదబంధం సాధారణంగా ముందున్న పనివాని లేదా పని భాగం తరువాత వచ్చే క్రమాన్ని సూచిస్తుంది. అయితే స్థలపరమైన అర్థం కూడా సాధ్యమే కాబట్టి దాన్ని పాదసూచికలో ఉంచాం.
- source_word: הֶחֱזִיק
  choice: మరమ్మతులు చేశాడు
  rationale: ఈ అధ్యాయంలో חזק అనే ధాతువు హిఫీల్ రూపం గోడ భాగాలను బాగుచేయడం లేదా పునరుద్ధరించడం అనే ప్రత్యేక నిర్మాణార్థంలో వాడబడింది.
- source_word: שַׂר חֲצִי פֶּלֶךְ
  choice: పరిపాలనా ప్రాంతంలోని సగభాగానికి అధిపతి
  rationale: పర్షియా కాలపు సందర్భంలో פֶּלֶךְ ఒక పరిపాలనా ప్రాంతాన్ని, שַׂר దాని పాలనా అధికారిని సూచిస్తాయి. ఈ అనువాదం ప్రాంతపు స్థాయిని అతిశయింపజేయకుండా అర్థాన్ని స్పష్టం చేస్తుంది.
- source_word: בֵּית צוּר
  choice: బేత్-సూరు
  rationale: ఇది స్థలనామం కాబట్టి అర్థానువాదం చేయకుండా తెలుగులో లిప్యంతరీకరించాం.
- source_word: עַד נֶגֶד קִבְרֵי דָוִיד
  choice: దావీదు సమాధులకు ఎదురుగా ఉన్న చోటివరకు
  rationale: נֶגֶד ఇక్కడ ‘ఎదురుగా’ లేదా ‘ముఖంగా’ అనే స్థల సంబంధాన్ని సూచిస్తుంది; సమాధుల ప్రదేశంలోకి ప్రవేశించారనే భావాన్ని కలిగించకుండా హద్దును తెలుపుతుంది.
- source_word: הַבְּרֵכָה הָעֲשׂוּיָה
  choice: నిర్మించబడిన కొలను
  rationale: హీబ్రూ పదబంధంలోని కర్మణి/ఫలిత స్థితి భావాన్ని నిలుపుతూ, అది కృత్రిమ కొలనని మించి దాని నిర్మాణ విధానాన్ని ఊహించకుండా అనువదించాం.
- source_word: בֵּית הַגִּבֹּרִים
  choice: వీరుల భవనం
  rationale: גִּבֹּרִים అంటే వీరులు లేదా యోధులు. భవనం ఖచ్చితంగా ఏది అనేది తెలియనందున ‘సైనికుల నివాసం’ వంటి మరింత వ్యాఖ్యానాత్మక పదానికి బదులు సన్నిహితమైన అనువాదాన్ని ఎంచుకున్నాం.
