translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడబడింది. పరిపాలనా పదజాలాన్ని సాధారణ పాఠకులకు స్పష్టంగా ఉంచుతూ, స్థలాలూ భవనాలూ ఏమిటనే అనిశ్చితిని అతిగా పరిష్కరించలేదు. అందించిన ఆంగ్ల పాఠ్యంలో పాదసూచిక గుర్తుల స్థానాలు వాటి విషయంతో సరిపోలకపోవడంతో, [a]ను אַחֲרָיו తరువాత, [b]ను בֵּית הַגִּבֹּרִים తరువాత ఉంచాం.
