translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని ఉపయోగించాం. మూలపాఠంలోని ఉద్ఘాటనను ‘వారే’తో నిలిపాం. ఇచ్చిన ఆంగ్ల సంప్రదింపు పాఠంలో పాదటిప్పణి గుర్తులు సంబంధిత పదాల వద్ద లేకపోవడంతో, తెలుగులో [a]ను ‘కుమారులు’ వద్దவும் [b]ను ‘పైకప్పు వేశారు’ వద్దவும் సరిగా ఉంచాం.
