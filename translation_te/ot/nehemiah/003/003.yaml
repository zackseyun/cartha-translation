source:
  edition: WLC
  text: וְ/אֵת֙ שַׁ֣עַר הַ/דָּגִ֔ים בָּנ֖וּ בְּנֵ֣י הַ/סְּנָאָ֑ה הֵ֣מָּה קֵר֔וּ/הוּ וַֽ/יַּעֲמִ֨ידוּ֙ דַּלְתֹתָ֔י/ו מַנְעוּלָ֖י/ו וּ/בְרִיחָֽי/ו׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/003.yaml
  text: The sons of Hassenaah built the Fish Gate[a]; they roofed it and set up its doors, its bolts[b], and its bars.
translation:
  language: te
  text: హస్సెనాయా కుమారులు[a] చేపల గుమ్మాన్ని కట్టారు. వారే దానికి పైకప్పు వేశారు[b]; దాని తలుపులను, గడియలను, అడ్డకడ్డీలను అమర్చారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘కుమారులు’ అంటే ఇక్కడ ఒక కుటుంబం లేదా వంశానికి చెందినవారు, అంటే ‘హస్సెనాయా వంశస్థులు’ అని కూడా అర్థం కావచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘దాన్ని కప్పారు,’ లేదా ‘దానికి దూలాలు వేశారు.’ నిర్మాణ సందర్భంలో హీబ్రూ క్రియ ఒక నిర్మాణాన్ని కప్పడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁעַר הַדָּגִים
  choice: చేపల గుమ్మం
  rationale: ఇది చేపలతో సంబంధమున్న యెరూషలేములోని ఒక నిర్దిష్ట నగర ద్వారం పేరు. ఆధునిక తెలుగులో సహజమైన పేరుగా ‘చేపల గుమ్మం’ ఎంచుకున్నాం.
- source_word: בָּנוּ
  choice: కట్టారు
  rationale: בנה అనే క్రియకు ప్రాథమిక అర్థం ‘కట్టు.’ అధ్యాయం నేపథ్యం పునరుద్ధరణ అయినప్పటికీ, మూలపాఠం ఇక్కడ ‘బాగుచేశారు’ అనే ప్రత్యేక క్రియను ఉపయోగించలేదు.
- source_word: בְּנֵי הַסְּנָאָה
  choice: హస్సెనాయా కుమారులు
  rationale: בני అక్షరార్థంగా ‘కుమారులు’ అయినప్పటికీ కుటుంబం లేదా వంశ సమూహాన్ని కూడా సూచించవచ్చు. మూలంలోని రూపాన్ని ప్రధాన పాఠంలో ఉంచి, విస్తృత భావాన్ని పాదటిప్పణిలో తెలిపాం.
- source_word: הֵמָּה
  choice: వారే
  rationale: సాధారణ కర్తను సూచించడానికి అవసరం లేని స్వతంత్ర సర్వనామం ఉండటంతో, దాని ఉద్ఘాటనను ‘వారే’ ద్వారా నిలిపాం.
- source_word: קֵרֻהוּ
  choice: దానికి పైకప్పు వేశారు
  rationale: నిర్మాణ సందర్భంలో קרה ఒక నిర్మాణాన్ని కప్పడం లేదా దానిపై కప్పు/దూలాలు వేయడాన్ని సూచిస్తుంది. సందర్భానుకూలంగా సహజమైన తెలుగు వ్యక్తీకరణను ఉపయోగించాం; ఇతర సాధ్యార్థాలను పాదటిప్పణిలో ఉంచాం.
- source_word: וַיַּעֲמִידוּ דַּלְתֹתָיו
  choice: దాని తలుపులను ... అమర్చారు
  rationale: అక్షరార్థంగా ‘నిలబెట్టారు’ అనే నిర్మాణ ప్రయోగం ఇక్కడ తలుపులను వాటి స్థానంలో పెట్టడాన్ని సూచిస్తుంది; ‘అమర్చారు’ ఆధునిక తెలుగులో స్పష్టంగా ఉంది.
- source_word: מַנְעוּלָיו
  choice: గడియలను
  rationale: గుమ్మపు తలుపులను బిగించే సాధనాలను సూచించే పదం. తరువాత వచ్చే అడ్డకడ్డీలతో భేదాన్ని ఉంచుతూ ‘గడియలు’ అని అనువదించాం.
- source_word: וּבְרִיחָיו
  choice: అడ్డకడ్డీలను
  rationale: בריח తలుపు లేదా గుమ్మాన్ని అడ్డంగా బిగించే కడ్డీని సూచిస్తుంది. దాని పని స్పష్టమయ్యేలా ‘అడ్డకడ్డీలు’ అని ఇచ్చాం.
