source:
  edition: WLC
  text: וְ/עַל יָדָ֣/ם הֶחֱזִ֗יק מְרֵמ֤וֹת בֶּן אוּרִיָּה֙ בֶּן הַקּ֔וֹץ וְ/עַל יָדָ֣/ם הֶחֱזִ֔יק מְשֻׁלָּ֥ם בֶּן בֶּרֶכְיָ֖ה בֶּן מְשֵׁיזַבְאֵ֑ל וְ/עַל יָדָ֣/ם הֶֽחֱזִ֔יק צָד֖וֹק בֶּֽן בַּעֲנָֽא־־־ס־־־ס־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/004.yaml
  text: And next to them Meremoth son of Uriah[a], son of Hakkoz, made repairs; and next to them Meshullam son of Berechiah, son of Meshezabel, made repairs[c][b]; and next to them Zadok son of Baana made repairs.
translation:
  language: te
  text: వారి పక్కనే హక్కోజు కుమారుడైన ఊరియా కుమారుడు మెరేమోతు మరమ్మతు చేశాడు[a]. వారి పక్కనే మెషేజబేలు కుమారుడైన బెరెక్యా కుమారుడు మెషుల్లాము మరమ్మతు చేశాడు[b]. వారి పక్కనే బానా కుమారుడు సాదోకు మరమ్మతు చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘మరమ్మతు చేశాడు’ అనే మాటను ‘బలపరిచాడు’ అని కూడా అనువదించవచ్చు. ఈ అధ్యాయంలో ఈ హీబ్రూ క్రియ గోడలోని ఒక భాగాన్ని బాగుచేసే పనిని సూచించే స్థిరమైన పదప్రయోగం.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా ‘వారి చేతి పక్కన’ అని ఉంది; ఇది ‘వారి పక్కనే’ లేదా ‘వారికి ఆనుకొని’ అనే అర్థమిచ్చే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל יָדָם
  choice: వారి పక్కనే / అతని పక్కనే
  rationale: అక్షరార్థంగా ‘వారి చేతి పక్కన’ అయిన ఈ హీబ్రూ నుడికారం నెహెమ్యా 3లో మరమ్మతు విభాగాల వరుసలో పక్కనున్న స్థానాన్ని సూచిస్తుంది. తెలుగులో సందర్భానుసారంగా సర్వనామ సంఖ్యను సహజంగా మార్చడం వరుసను స్పష్టం చేస్తుంది.
- source_word: הֶחֱזִיק
  choice: మరమ్మతు చేశాడు
  rationale: ఈ నిర్మాణంలో క్రియకు ‘బలపరచడం/బాగుచేయడం’ అనే భావం ఉంది; అధ్యాయం సందర్భంలో గోడ లేదా ద్వారంలోని ఒక భాగాన్ని బాగుచేసే పనిని సూచిస్తుంది.
- source_word: בֶּן
  choice: కుమారుడు / మనవడు
  rationale: ప్రతి పేరుకు బֶּן‌ను ‘కుమారుడు’గా, వరుసగా వచ్చిన రెండు తరాల సంబంధాన్ని సహజ తెలుగులో ‘మనవడు… కుమారుడు’గా వ్యక్తపరిచాం; వంశక్రమ సమాచారం మారదు.
- source_word: מְרֵמוֹת
  choice: మెరేమోతు
  rationale: హీబ్రూ వ్యక్తిపేరును తెలుగు ధ్వన్యనుకరణలో ఇచ్చాం.
- source_word: אוּרִיָּה
  choice: ఊరియా
  rationale: హీబ్రూ వ్యక్తిపేరును తెలుగు ధ్వన్యనుకరణలో ఇచ్చాం.
- source_word: הַקּוֹץ
  choice: హక్కోజు
  rationale: హీబ్రూ రూపంలోని నిర్దేశక ఉపసర్గను పేరులో భాగంగా నిలిపి ధ్వన్యనుకరణ చేశాం.
- source_word: מְשֻׁלָּם
  choice: మెషుల్లాము
  rationale: హీబ్రూ వ్యక్తిపేరును తెలుగు ధ్వన్యనుకరణలో ఇచ్చాం.
- source_word: בֶּרֶכְיָה
  choice: బెరెక్యా
  rationale: హీబ్రూ వ్యక్తిపేరును తెలుగు ధ్వన్యనుకరణలో ఇచ్చాం.
- source_word: מְשֵׁיזַבְאֵל
  choice: మెషేజబేలు
  rationale: హీబ్రూ వ్యక్తిపేరును తెలుగు ధ్వన్యనుకరణలో ఇచ్చాం.
- source_word: צָדוֹק
  choice: సాదోకు
  rationale: హీబ్రూ צ ధ్వనికి సమీపమైన తెలుగు ‘స’ రూపంతో వ్యక్తిపేరును ధ్వన్యనుకరణ చేశాం.
- source_word: בַּעֲנָא
  choice: బయనా
  rationale: మధ్యలోని గొంతు ధ్వనిని తెలుగులో సహజంగా సూచించేలా హీబ్రూ వ్యక్తిపేరును ధ్వన్యనుకరణ చేశాం.
theological_decisions: []
