  register: ఆధునిక ప్రామాణిక తెలుగులో, పేర్ల వరుస భారంగా అనిపించకుండా ‘మనవడూ… కుమారుడూ అయిన’ అనే సహజ వంశసంబంధ నిర్మాణం వాడాం. హీబ్రూ వాక్యంలోని పునరుక్త మరమ్మతు సూత్రాన్ని నిలిపాం. మూలంలోని పేరాల విరామ సూచనలకు అనువాద పాఠ్యంలో ప్రత్యేక గుర్తు అవసరం లేదు.
