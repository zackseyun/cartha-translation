source:
  edition: WLC
  text: וּ/בֵ֨ין עֲלִיַּ֤ת הַ/פִּנָּה֙ לְ/שַׁ֣עַר הַ/צֹּ֔אן הֶחֱזִ֥יקוּ הַ/צֹּרְפִ֖ים וְ/הָ/רֹכְלִֽים׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/032.yaml
  text: And between the upper room of the corner and the Sheep Gate[a], the goldsmiths and the merchants made repairs.
translation:
  language: te
  text: మరియు మూలలోని పైగదికి, గొర్రెల ద్వారానికి మధ్యనున్న భాగాన్ని బంగారు పనివారూ వర్తకులూ మరమ్మతు చేశారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘మూలలోని ఎక్కుడు మార్గం’ లేదా ‘మూలలోని పైమందిరం’ అని కూడా అనువదించవచ్చు. עֲלִיָּה అనే హీబ్రూ పదం పైగదిని లేదా ఎక్కుడు మార్గాన్ని సూచించగలదు; ఇక్కడ ఉద్దేశించిన నిర్మాణ భాగం ఖచ్చితంగా తెలియదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבֵין
  choice: మధ్యనున్న భాగాన్ని
  rationale: హీబ్రూ పదబంధంలోని అనుసంధాన, స్థలార్థాలను సహజమైన తెలుగు వాక్యనిర్మాణంలో వ్యక్తం చేస్తుంది.
- source_word: עֲלִיַּת הַפִּנָּה
  choice: మూలలోని పైగది
  rationale: עֲלִיָּה సాధారణంగా పైగది లేదా ఎత్తైన నిర్మాణాన్ని సూచించగలదు; ప్రధాన పాఠంలో సహజమైన నిర్మాణార్థాన్ని ఎంచుకుని, అనిశ్చితిని పాదసూచికలో ఉంచాం.
- source_word: לְשַׁעַר הַצֹּאן
  choice: గొర్రెల ద్వారం
  rationale: యెరూషలేము ప్రాకారంలోని గుర్తింపు పొందిన ద్వారనామాన్ని స్పష్టమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: הֶחֱזִיקוּ
  choice: బాగుచేశారు
  rationale: నెహెమ్యా 3 సందర్భంలో ఈ క్రియ ప్రాకారం లేదా ద్వారాల మరమ్మతు పనిని సూచిస్తుంది; అక్షరార్థమైన ‘బలపరిచారు’ కంటే సందర్భార్థం స్పష్టంగా ఉంటుంది.
- source_word: הַצֹּרְפִים
  choice: బంగారు పనివారు
  rationale: విలువైన లోహాన్ని శుద్ధిచేసి వస్తువులు తయారుచేసే వృత్తివారిని సాధారణ పాఠకులకు అర్థమయ్యేలా సూచిస్తుంది.
- source_word: וְהָרֹכְלִים
  choice: వర్తకులు
  rationale: వ్యాపారం చేసే వృత్తివర్గాన్ని గౌరవప్రదమైన, విస్తృతార్థక ఆధునిక తెలుగు పదంతో సూచిస్తుంది.
