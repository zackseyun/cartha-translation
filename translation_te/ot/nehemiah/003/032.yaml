translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన శైలి. వృత్తివర్గాలకు సహజమైన బహువచన రూపాలు వాడబడ్డాయి; నిర్మాణ సంబంధిత సందిగ్ధత పాదసూచికలో భద్రపరచబడింది.
