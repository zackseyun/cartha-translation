translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని పాటించాం. రెండు వేర్వేరు కోపవాచక క్రియల తీవ్రతను ‘కోపం రగిలింది; ... ఎంతో ఆగ్రహించి’ అని నిలిపాం. పాదసూచిక గుర్తును అది వివరిస్తున్న ‘యూదులను’ అనే పదం వెంట ఉంచాం.
