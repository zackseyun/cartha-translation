source:
  edition: WLC
  text: וַ/יְהִ֞י כַּ/אֲשֶׁ֧ר שָׁמַ֣ע סַנְבַלַּ֗ט כִּֽי אֲנַ֤חְנוּ בוֹנִים֙ אֶת הַ֣/חוֹמָ֔ה וַ/יִּ֣חַר ל֔/וֹ וַ/יִּכְעַ֖ס הַרְבֵּ֑ה וַ/יַּלְעֵ֖ג עַל הַ/יְּהוּדִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/033.yaml
  text: When Sanballat heard that we were rebuilding the wall[a], he became angry and very enraged, and he mocked the Jews.
translation:
  language: te
  text: సన్బల్లటు మేము ప్రాకారాన్ని తిరిగి కడుతున్నామని విన్నప్పుడు, అతనికి కోపం రగిలింది; అతడు చాలా ఆగ్రహించాడు, యూదులను[a] ఎగతాళి చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘యూదయ ప్రజలను.’ హీబ్రూ పదం ప్రాంతీయ భావంలో యూదా ప్రజలను, అలాగే విస్తృత భావంలో యూదులను సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: విన్నప్పుడు
  rationale: ఈ కథన సూత్రం తదుపరి పరిణామాన్ని పరిచయం చేస్తుంది. తెలుగులో ప్రత్యేకంగా ‘అప్పుడు’ లేదా ‘ఇదిగో’ చేర్చకుండా కాలవాచక ఉపవాక్యంతో సహజంగా వ్యక్తమవుతుంది.
- source_word: שָׁמַע
  choice: విన్నప్పుడు
  rationale: ఈ క్రియ యొక్క సాధారణ అర్థం ‘వినడం’; ఇక్కడ వార్త తెలిసిందనే సందర్భార్థాన్ని కూడా ఈ సహజమైన తెలుగు రూపం అందిస్తుంది.
- source_word: סַנְבַלַּט
  choice: సన్బల్లటు
  rationale: వ్యక్తి పేరును తెలుగులో సుపరిచితమైన లిప్యంతరీకరణకు అనుగుణంగా ఇచ్చాం.
- source_word: כִּי אֲנַחְנוּ בוֹנִים
  choice: మేము ... తిరిగి కడుతున్నామని
  rationale: వర్తమాన కృదంతం కొనసాగుతున్న పనిని సూచిస్తుంది; ధ్వంసమైన యెరూషలేము ప్రాకారాన్ని పునరుద్ధరిస్తున్న సందర్భం వల్ల ‘తిరిగి కడుతున్నాము’ అనేది తగిన సందర్భానుసార అనువాదం.
- source_word: הַחוֹמָה
  choice: ప్రాకారాన్ని
  rationale: ఇక్కడ חוֹמָה యెరూషలేము నగర రక్షణ గోడను సూచిస్తుంది; ‘ప్రాకారం’ ఆ భావాన్ని సంక్షిప్తంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: וַיִּחַר לוֹ
  choice: అతనికి కోపం రగిలింది
  rationale: మూలంలోని ‘మండడం’ అనే కోపసంబంధ నుడికారాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: וַיִּכְעַס הַרְבֵּה
  choice: అతడు ఎంతో ఆగ్రహించి
  rationale: రెండవ కోపవాచక క్రియ మొదటిదాన్ని తీవ్రతరం చేస్తుంది; వేరొక పదాన్ని వాడటం ద్వారా ఆ పెరుగుదలను సమతలీకరించకుండా నిలిపాం.
- source_word: וַיַּלְעֵג
  choice: ఎగతాళి చేశాడు
  rationale: ఈ క్రియలో హేళనతో కూడిన మాటలు లేదా అపహాస్యం అనే భావం ఉంది; ‘ఎగతాళి చేశాడు’ ఆధునిక తెలుగులో సహజంగా, తగిన బలంతో ఉంది.
- source_word: עַל הַיְּהוּדִים
  choice: యూదులను
  rationale: יְהוּדִים అనే పదం విస్తృతంగా యూదులను గానీ, ప్రాంతీయ భావంలో యూదయులను గానీ సూచించవచ్చు. ప్రధాన పాఠ్యంలో సులభంగా గుర్తించదగిన ‘యూదులు’ వాడి, ప్రాంతీయ ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
