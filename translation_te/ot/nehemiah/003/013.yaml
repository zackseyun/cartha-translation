source:
  edition: WLC
  text: אֵת֩ שַׁ֨עַר הַ/גַּ֜יְא הֶחֱזִ֣יק חָנוּן֮ וְ/יֹשְׁבֵ֣י זָנוֹחַ֒ הֵ֣מָּה בָנ֔וּ/הוּ וַֽ/יַּעֲמִ֨ידוּ֙ דַּלְתֹתָ֔י/ו מַנְעֻלָ֖י/ו וּ/בְרִיחָ֑י/ו וְ/אֶ֤לֶף אַמָּה֙ בַּ/חוֹמָ֔ה עַ֖ד שַׁ֥עַר הָ/שֲׁפֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/013.yaml
  text: Hanun and the inhabitants of Zanoah repaired the Valley Gate[a]. They built it and set up its doors, its bolts, and its bars, and repaired a thousand cubits of the wall[c][b], as far as the Dung Gate.
translation:
  language: te
  text: హానూను, జానోహు నివాసులు లోయ ద్వారానికి మరమ్మతు చేశారు.[a] వారే దాన్ని కట్టి, దాని తలుపులను, గడియలను, అడ్డకడ్డీలను అమర్చారు. అంతేకాక, గోడలో వెయ్యి మూరల మేరను మరమ్మతు చేసి చెత్త ద్వారం[c] వరకు చేశారు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “లోయ ద్వారాన్ని బలపరిచారు.” ఈ అధ్యాయంలోని పునర్నిర్మాణ సందర్భంలో హీబ్రూ క్రియకు ‘దృఢపరచడం,’ ‘మరమ్మతు చేయడం’ అనే భావాలు రావచ్చు.
    reason: lexical_alternative
  - marker: b
    text: వెయ్యి మూరలు సుమారు 1,500 అడుగులు (దాదాపు 457 మీటర్లు).
    reason: cultural_note
  - marker: c
    text: “చెత్త ద్వారం” అనే పేరును “పెంట ద్వారం” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶחֱזִיק
  choice: మరమ్మతు చేశారు
  rationale: ఈ అధ్యాయంలోని పునర్నిర్మాణ సందర్భంలో ఈ క్రియ ఒక భాగాన్ని బలపరచి బాగుచేయడాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘మరమ్మతు చేశారు’ సహజంగా, సందర్భానుగుణంగా ఉంది.
- source_word: שַׁעַר הַגַּיְא
  choice: లోయ ద్వారం
  rationale: ఇది నగర ద్వారం పేరుగా ఉన్న సమాస పదబంధం; ‘లోయ ద్వారం’ స్థలనామ భావాన్ని నిలుపుతుంది.
- source_word: יֹשְׁבֵי זָנוֹחַ
  choice: జానోవహు నివాసులు
  rationale: యֹשְׁבֵי అనే రూపం ఆ పట్టణంలో నివసించేవారిని సూచిస్తుంది; ‘నివాసులు’ సంక్షిప్తమైన, సహజమైన తెలుగు.
- source_word: הֵמָּה בָנוּהוּ
  choice: వారే దాన్ని కట్టి
  rationale: హీబ్రూలోని ఉద్ఘాటక సర్వనామాన్ని ‘వారే’తో చూపించి, בנה క్రియ యొక్క సూటి భావాన్ని ‘కట్టి’గా నిలిపాం.
- source_word: וַיַּעֲמִידוּ
  choice: అమర్చారు
  rationale: అక్షరార్థంగా నిలబెట్టడం లేదా స్థానంలో పెట్టడం; తలుపులు, వాటి బిగింపు సామగ్రి సందర్భంలో ‘అమర్చారు’ సహజం.
- source_word: דַּלְתֹתָיו
  choice: దాని తలుపులను
  rationale: ద్వారంలోని తలుపు పలకలను సూచించే బహువచనం; సాధారణ పాఠకులకు ‘తలుపులు’ స్పష్టం.
- source_word: מַנְעֻלָיו
  choice: గడియలను
  rationale: ద్వారాన్ని బిగించే సాధనాలను సూచిస్తుంది; సంప్రదాయ నిర్మాణ సందర్భంలో ‘గడియలు’ తగిన పదం.
- source_word: בְרִיחָיו
  choice: అడ్డకడ్డీలను
  rationale: ద్వారాన్ని భద్రపరచడానికి అడ్డంగా పెట్టే కడ్డీలను సూచిస్తుంది; ‘అడ్డకడ్డీలు’ దాని పనిని స్పష్టంగా తెలియజేస్తుంది.
- source_word: אֶלֶף אַמָּה
  choice: వెయ్యి మూరల పొడవున
  rationale: ప్రాచీన కొలమానాన్ని మార్చకుండా నిలుపుతూ, తెలుగులో విస్తీర్ణ భావం స్పష్టమయ్యేలా ‘పొడవున’ చేర్చాం.
- source_word: בַּחוֹמָה
  choice: గోడలో
  rationale: హీబ్రూ ఉపసర్గను దగ్గరగా అనుసరిస్తూ, మరమ్మతు చేసిన గోడ భాగాన్ని సూచిస్తుంది.
- source_word: שַׁעַר הָשֲׁפוֹת
  choice: చెత్త ద్వారం
  rationale: ఈ ద్వారం చెత్త లేదా మలినాలను బయటకు తీసుకెళ్లే స్థలంతో సంబంధమున్న పేరుగా భావించబడుతుంది; ‘చెత్త ద్వారం’ ఆధునిక తెలుగులో సహజం, గౌరవప్రదం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని వాడాం. మూలంలోని నిర్మాణ పదజాలం మరియు ‘వారే’ అనే ఉద్ఘాటన నిలుపబడ్డాయి; ప్రాచీన కొలమానం ప్రధాన పాఠ్యంలో ఉంచి ఆధునిక సమానాన్ని పాదటిప్పణిలో ఇచ్చాం.
