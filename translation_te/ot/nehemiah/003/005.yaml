  yaml_path: translation/ot/nehemiah/003/005.yaml
  text: And next to them the Tekoites made repairs[b][a], but their nobles would not put their necks to the work of their lords.
translation:
  language: te
  text: వారి పక్కనే తెకోవవారు మరమ్మతులు చేశారు. అయితే వారి ప్రముఖులు[a] తమ అధిపతుల పనికి తమ మెడలను ఒగ్గలేదు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వారి పెద్దలు’ లేదా ‘వారి నాయకులు.’
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘తమ అధిపతుల పనికి తమ మెడలను తీసుకురాలేదు’; అంటే ఆ పనిభారాన్ని స్వీకరించడానికి లేదా దానికి లోబడటానికి నిరాకరించారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל־יָדָם
  choice: వారి పక్కనే
  rationale: నెహెమ్యా 3లో ఈ ప్రయోగం మరమ్మతు చేస్తున్న బృందాల స్థలపరమైన వరుసను సూచిస్తుంది; ఆధునిక తెలుగులో సహజంగా ఆ సమీప భావాన్ని తెలియజేస్తుంది.
- source_word: הֶחֱזִיקוּ
  choice: మరమ్మతులు చేశారు
  rationale: ఈ అధ్యాయ సందర్భంలో గోడలోని ఒక భాగాన్ని బలపరచడం లేదా పునరుద్ధరించడం అనే భావం ఉంది; తెలుగులో ‘మరమ్మతులు చేశారు’ సందర్భార్థాన్ని స్పష్టంగా ఇస్తుంది.
- source_word: הַתְּקוֹעִים
  choice: తెకోవవారు
  rationale: తెకోవ పట్టణ నివాసులను సూచించే స్థలనామజన్య పదం; ‘తెకోవవారు’ తెలుగులో సంక్షిప్తంగా, సహజంగా ఉంటుంది.
- source_word: וְאַדִּירֵיהֶם
  choice: వారి పెద్దలు
  rationale: ఈ పదం ప్రముఖులు, శక్తిమంతులు లేదా ఉన్నతస్థానంలో ఉన్నవారిని సూచించగలదు. స్థానిక సమాజంలోని పలుకుబడిగల నాయకులను సూచించేందుకు ‘పెద్దలు’ సహజమైన విస్తృత పదం; ప్రత్యామ్నాయాన్ని పాదటీపులో ఉంచాం.
- source_word: לֹא הֵבִיאוּ צַוָּרָם
  choice: మెడ వంచలేదు
  rationale: మూలంలోని ‘తమ మెడను తీసుకురాలేదు’ అనే రూపకం లోబడటానికి లేదా పనిని స్వీకరించడానికి నిరాకరించడాన్ని సూచిస్తుంది. ‘మెడ వంచలేదు’ మెడ రూపకాన్ని నిలుపుతూ తెలుగులో అర్థమయ్యే విధంగా ఉంది.
- source_word: בַּעֲבֹדַת
  choice: పనికి
  rationale: ఇక్కడ పదం గోడ పునర్నిర్మాణానికి సంబంధించిన శ్రమను సూచిస్తుంది; ‘పనికి’ సంక్షిప్తంగా, సందర్భోచితంగా ఉంది.
- source_word: אֲדֹנֵיהֶם
  choice: తమ యజమానుల
  rationale: మూలంలో బహువచనం ఉంది. ‘యజమానులు’ మానవ అధికారులను లేదా పైవారిని సూచించే సామాజిక శ్రేణి భావాన్ని నిలుపుతుంది; దానిని ఏకవచన దైవసూచకంగా మార్చదు.
theological_decisions:
- issue: ‘వారి యజమానులు’ అనే మాట ఎవరిని సూచిస్తుంది?
  choice: పునర్నిర్మాణ పనికి సంబంధించిన మానవ పైవారు లేదా అధికారులు
  alternative: ‘ప్రభువు పని’ అని ఏకవచన దైవసూచకంగా అర్థం చేయడం
  rationale: హీబ్రూ పాఠంలో ‘వారి యజమానులు’ బహువచనంలో ఉంది. అందువల్ల దాన్ని ఏకవచన దైవసూచకంగా సవరించకుండా, మూలంలోని సామాజిక-అధికార సంబంధాన్ని అలాగే ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి ఉపయోగించబడింది. నిర్మాణపు జాబితాకు తగిన సంక్షిప్త వాక్యనిర్మాణాన్ని పాటిస్తూ, మూలంలోని మెడ రూపకాన్ని పాదటీపు సహాయంతో నిలిపాం.
