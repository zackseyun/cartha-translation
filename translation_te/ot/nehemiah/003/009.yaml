source:
  edition: WLC
  text: וְ/עַל יָדָ֤/ם הֶחֱזִיק֙ רְפָיָ֣ה בֶן ח֔וּר שַׂ֕ר חֲצִ֖י פֶּ֥לֶךְ יְרוּשָׁלִָֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/009.yaml
  text: Next to them[a], Rephaiah son of Hur, ruler of half the district of Jerusalem, made repairs.
translation:
  language: te
  text: వారి పక్కనే, హూరు కుమారుడైన, యెరూషలేము పరిపాలనా జిల్లాలో సగభాగానికి అధిపతియైన రెఫాయా మరమ్మతులు చేశాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “బలపరిచాడు.” హీబ్రూ క్రియకు అక్షరార్థంగా “బలంగా చేశాడు” అని అర్థం; అయితే ఈ అధ్యాయంలో అది మరమ్మతు పనిని సూచించే నుడికారంగా వాడబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל־יָדָם
  choice: వారి పక్కనే
  rationale: ఈ అధ్యాయంలోని నిర్మాణ జాబితాలో పక్కపక్కన పనిచేసిన బృందాల క్రమాన్ని సూచించే హీబ్రూ నుడికారానికి ఇది సహజమైన తెలుగు రూపం.
- source_word: הֶחֱזִיק
  choice: మరమ్మతు పని చేశాడు
  rationale: חזק హిఫీల్ రూపానికి అక్షరార్థంగా ‘బలపరిచాడు’ అనే భావం ఉన్నా, నెహెమ్యా 3లో గోడ మరమ్మతులో పాల్గొనడాన్ని సూచించే నుడికారంగా వాడబడింది.
- source_word: רְפָיָה
  choice: రెఫాయా
  rationale: వ్యక్తి పేరును హీబ్రూ ఉచ్చారణకు సమీపంగా లిప్యంతరీకరించాం.
- source_word: בֶן־חוּר
  choice: హూరు కుమారుడైన
  rationale: తండ్రి పేరుతో వ్యక్తిని గుర్తించే ప్రామాణిక వంశసంబంధ పదబంధం.
- source_word: שַׂר
  choice: అధిపతి
  rationale: పరిపాలనా బాధ్యతగల నాయకుడు లేదా అధికారిని సూచించే שַׂר పదానికి సందర్భోచితమైన, గౌరవప్రదమైన తెలుగు రూపం.
- source_word: חֲצִי פֶּלֶךְ
  choice: పరిపాలనా ప్రాంతంలోని సగభాగానికి
  rationale: פֶּלֶךְ ఇక్కడ పరిపాలనా విభాగాన్ని సూచిస్తుంది; దాని సగభాగంపై రెఫాయాకు అధికారమున్న భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: יְרוּשָׁלִָם
  choice: యెరూషలేము
  rationale: స్థలపేరుకు ప్రాచుర్యంలో ఉన్న ప్రామాణిక తెలుగు లిప్యంతరీకరణ.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. పొడవైన హీబ్రూ ఉపపదబంధాన్ని రెండు వాక్యాలుగా విభజించి సాధారణ పాఠకులకు స్పష్టత కల్పించాం; సమాచార క్రమం మరియు పరిపాలనా భావం నిలిపాం.
