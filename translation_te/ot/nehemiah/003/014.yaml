  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే వాక్యనిర్మాణం వాడబడింది. పొడవైన హీబ్రూ వాక్యాన్ని స్పష్టత కోసం మూడు వాక్యాలుగా విభజించాం; మూలంలోని הוּא ఉద్ఘాటనను ‘అతడే’గా నిలిపాం.
