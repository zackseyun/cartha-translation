  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אֵ֣ת שַׁ֣עַר הָ/אַשְׁפּ֗וֹת הֶחֱזִיק֙ מַלְכִּיָּ֣ה בֶן רֵכָ֔ב שַׂ֖ר פֶּ֣לֶךְ בֵּית הַכָּ֑רֶם ה֣וּא יִבְנֶ֔/נּוּ וְ/יַעֲמִיד֙ דַּלְתֹתָ֔י/ו מַנְעֻלָ֖י/ו וּ/בְרִיחָֽי/ו׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/014.yaml
  text: And Malchijah son of Rechab[a], ruler of the district of Beth-haccherem, repaired the Dung Gate. He built it and set up its doors, its bolts, and its bars.
translation:
  language: te
  text: రేకాబు కుమారుడైన, బేత్-హక్కెరెము ప్రాంత అధికారి మల్కీయా పెంట ద్వారాన్ని[a] బాగుచేశాడు. అతడే దానిని నిర్మించి, దాని తలుపులను, గడియలను, అడ్డకడ్డీలను అమర్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘చెత్త ద్వారం.’ హీబ్రూ పేరు పేడ లేదా పారవేసిన వ్యర్థాలను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶחֱזִיק
  choice: బాగుచేశాడు
  rationale: నెహెమ్యా 3లో ఈ క్రియ గోడ లేదా ద్వారంలోని ఒక భాగాన్ని బాగుచేసే బాధ్యత తీసుకొని పని చేయడాన్ని సూచించే నిర్మాణపరమైన పదంగా వాడబడింది.
- source_word: שַׁעַר הָאַשְׁפּוֹת
  choice: పెంట ద్వారం
  rationale: אַשְׁפּוֹת పేడ, పెంట లేదా పారవేసిన వ్యర్థాలను సూచిస్తుంది. స్థలనామ స్వభావాన్ని, మూలంలోని స్పష్టమైన భావాన్ని నిలుపుతూ ‘పెంట ద్వారం’ అని అనువదించబడింది; సాధ్యమైన ప్రత్యామ్నాయం పాదసూచికలో ఇవ్వబడింది.
- source_word: שַׂר פֶּלֶךְ
  choice: ప్రాంతానికి అధికారి
  rationale: שַׂר నాయకుడు లేదా అధికారి; פֶּלֶךְ పరిపాలనా ప్రాంతం. ఆధునిక తెలుగులో ఈ ప్రభుత్వ బాధ్యతను సహజంగా తెలియజేసే రూపం ఇది.
- source_word: בֵּית הַכָּרֶם
  choice: బేత్-హక్కెరెము
  rationale: స్థలనామాన్ని అర్థానువాదం చేయకుండా హీబ్రూ ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించాం.
- source_word: הוּא יִבְנֶנּוּ
  choice: అతడే ఆ ద్వారాన్ని నిర్మించి
  rationale: בנה ప్రాథమికంగా ‘కట్టు/నిర్మించు’ అని అర్థం; ‘తిరిగి కట్టాడు’ అనే అదనపు భావాన్ని చేర్చలేదు. הוּא ఇచ్చే ఉద్ఘాటనను ‘అతడే’ ద్వారా నిలిపాం. ప్రత్యయానికి సూచితమైన ద్వారాన్ని తెలుగులో స్పష్టత కోసం పేర్కొన్నాం.
- source_word: וְיַעֲמִיד
  choice: అమర్చాడు
  rationale: హిఫీల్ రూపం ఇక్కడ ద్వారపు భాగాలను వాటి స్థానాల్లో నిలపడం లేదా బిగించడం అనే అర్థం ఇస్తుంది; ‘అమర్చాడు’ సహజమైన నిర్మాణపరమైన పదం.
- source_word: דַּלְתֹתָיו
  choice: దాని తలుపులను
  rationale: బహువచనం ద్వారంలోని తలుపు పలకలను సూచిస్తుంది; సాధారణ పాఠకులకు ‘తలుపులు’ స్పష్టమైన పదం.
- source_word: מַנְעֻלָיו
  choice: గడియలను
  rationale: ఈ పదం ద్వారాన్ని మూసి బిగించే పరికరాలను సూచిస్తుంది. తరువాతి బְּרִיחַతో తేడాను నిలుపుతూ ‘గడియలు’ ఎంచుకున్నాం.
- source_word: וּבְרִיחָיו
  choice: అడ్డకడ్డీలను
  rationale: בְּרִיחַ తలుపు లేదా ద్వారానికి అడ్డంగా పెట్టి భద్రపరిచే కడ్డీ. ‘అడ్డకడ్డీలు’ దాని ఆకృతి, పనిని స్పష్టంగా తెలియజేస్తుంది.
