id: NEH.3.10
reference: Nehemiah 3:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/עַל יָדָ֧/ם הֶחֱזִ֛יק יְדָיָ֥ה בֶן חֲרוּמַ֖ף וְ/נֶ֣גֶד בֵּית֑/וֹ וְ/עַל יָד֣/וֹ הֶחֱזִ֔יק חַטּ֖וּשׁ בֶּן חֲשַׁבְנְיָֽה־־ס־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/010.yaml
  text: Next to them Jedaiah son of Harumaph made repairs opposite his house[a], and next to him Hattush son of Hashabneiah made repairs.
translation:
  language: te
  text: వారి పక్కనే హరూమపు కుమారుడు యెదాయా తన ఇంటి ఎదురుగా[a] మరమ్మతు చేశాడు. అతని పక్కనే హషబ్నెయా కుమారుడు హట్టూషు మరమ్మతు చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘తన ఇంటి ముందు.’
    reason: నֶגֶד అనే హీబ్రూ పదం ‘ఎదురుగా’ లేదా ‘ముందు’ అనే స్థలసంబంధ భావాలను ఇవ్వగలదు.
lexical_decisions:
- source_word: וְעַל יָדָם
  choice: వారి పక్కనే
  rationale: నెహెమ్యా 3లో עַל יָד అనే పదబంధం పనిస్థలాల వరుసలో పక్కనే ఉన్న స్థానాన్ని సూచిస్తుంది; ‘వారి పక్కనే’ సహజంగా ఆ స్థలసంబంధ భావాన్ని నిలుపుతుంది.
- source_word: הֶחֱזִיק
  choice: మరమ్మతు చేశాడు
  rationale: ఈ అధ్యాయంలో חזק పదం హిఫీల్ రూపం గోడను బాగుచేసే లేదా తిరిగి నిర్మించే పనిలో పాల్గొనడాన్ని సూచించే సాంకేతిక ప్రయోగం; ‘మరమ్మతు చేశాడు’ సందర్భానికి స్పష్టంగా సరిపోతుంది.
- source_word: יְדָיָה
  choice: యెదాయా
  rationale: హీబ్రూ వ్యక్తినామాన్ని ఆధునిక తెలుగు బైబిలు శైలికి అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: בֶן חֲרוּמַף
  choice: హరూమపు కుమారుడు
  rationale: సాధారణ వంశసంబంధ నిర్మాణాన్ని తెలుగులో సహజంగా ఇచ్చి, వ్యక్తినామాన్ని లిప్యంతరీకరించాం.
- source_word: וְנֶגֶד בֵּיתוֹ
  choice: తన ఇంటి ఎదురుగా
  rationale: נֶגֶד ఒక వస్తువు ఎదుట లేదా ఎదురుగా ఉన్న స్థలాన్ని సూచిస్తుంది. కర్త తన ఇంటికి ఎదురుగా పనిచేశాడనే సంబంధాన్ని ‘తన ఇంటి ఎదురుగా’ సహజంగా తెలియజేస్తుంది; ‘తన’ అనే పదం హీబ్రూ ప్రత్యయ సూచనను తెలుగులో స్పష్టం చేస్తుంది.
- source_word: וְעַל יָדוֹ
  choice: అతని పక్కనే
  rationale: ముందటి עַל יָד పదబంధమే ఇక్కడ ఏకవచన ప్రత్యయంతో వచ్చి యెదాయా పక్కనున్న స్థానాన్ని సూచిస్తుంది; పునరావృత నిర్మాణాన్ని నిలిపాం.
- source_word: חַטּוּשׁ
  choice: హట్టూషు
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు ఉచ్చారణకు అనుకూలంగా లిప్యంతరీకరించాం.
- source_word: בֶּן חֲשַׁבְנְיָה
  choice: హషబ్నెయా కుమారుడు
  rationale: వంశసంబంధాన్ని నేరుగా అనువదించి, పేరును హీబ్రూ రూపానికి దగ్గరగా లిప్యంతరీకరించాం.
