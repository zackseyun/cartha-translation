translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే గౌరవప్రదమైన కథన శైలి. అధ్యాయం అంతటా కనిపించే మరమ్మతు పనుల వరుసను తెలియజేసే పునరుక్త నిర్మాణం నిలుపబడింది.
