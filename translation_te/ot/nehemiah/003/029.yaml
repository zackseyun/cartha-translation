translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథన శైలిని వాడాం. వ్యక్తినామాలను హీబ్రూ రూపాలకు సమీపంగా ఉంచాం; నిర్మాణపని సందర్భాన్ని సహజంగా తెలియజేయడానికి ‘మరమ్మతు చేశాడు’ వాడాం.
