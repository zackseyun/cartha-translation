id: NEH.3.29
reference: Nehemiah 3:29
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אַחֲרָ֧י/ו הֶחֱזִ֛יק צָד֥וֹק בֶּן אִמֵּ֖ר נֶ֣גֶד בֵּית֑/וֹ וְ/אַחֲרָ֤י/ו הֶחֱזִיק֙ שְׁמַֽעְיָ֣ה בֶן שְׁכַנְיָ֔ה שֹׁמֵ֖ר שַׁ֥עַר הַ/מִּזְרָֽח־ס־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/029.yaml
  text: After him Zadok son of Immer made repairs opposite his house[a], and after him Shemaiah son of Shecaniah, keeper of the East Gate[c][b], made repairs.
translation:
  language: te
  text: అతని తరువాత ఇమ్మేరు కుమారుడైన సాదోకు తన ఇంటి ఎదుట మరమ్మతు చేశాడు.[a] అతని తరువాత తూర్పు ద్వారపు కాపలాదారుడైన షెకన్యా కుమారుడు షెమయా మరమ్మతు చేశాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘మరమ్మతు చేశాడు’ అని అనువదించిన హీబ్రూ క్రియకు అక్షరార్థం ‘బలపరిచాడు’; ఈ అధ్యాయంలో అది గోడలు, ద్వారాల మరమ్మతు పనిని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘కాపలాదారుడు’ అనే పదాన్ని ‘సంరక్షకుడు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרָיו
  choice: అతని తరువాత
  rationale: నెహెమ్యా 3లో ఇది మరమ్మతు పనివారి వరుసను, సందర్భానుసారంగా పక్కపక్కన ఉన్న పని భాగాల క్రమాన్ని సూచించే సూత్రవాక్యం; సహజమైన తెలుగు రూపంగా ‘అతని తరువాత’ ఎంచుకున్నాం.
- source_word: הֶחֱזִיק
  choice: మరమ్మతు చేశాడు
  rationale: חזק హిఫీల్ రూపానికి అక్షరార్థం ‘బలపరచాడు’; అయితే ఈ అధ్యాయంలోని నిర్మాణ సందర్భంలో గోడలు, ద్వారాల మరమ్మతు పనిని చేపట్టడాన్ని సూచిస్తుంది.
- source_word: צָדוֹק
  choice: సాదోకు
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగులో సులభంగా పలికే విధంగా లిప్యంతరీకరించాం.
- source_word: בֶּן אִמֵּר
  choice: ఇమ్మేరు కుమారుడైన
  rationale: వంశసంబంధాన్ని తెలిపే సాధారణ హీబ్రూ నిర్మాణాన్ని సహజమైన తెలుగు విశేషణ నిర్మాణంతో అందించాం.
- source_word: נֶגֶד בֵּיתוֹ
  choice: తన ఇంటి ఎదుట
  rationale: נֶגֶד అంటే ‘ఎదుట/ముందు’; కర్త సాదోకునే సూచించే స్వామ్య ప్రత్యయం తెలుగులో స్పష్టంగా ఉండేందుకు ‘తన ఇంటి’ అని ఇచ్చాం.
- source_word: שְׁמַעְיָה
  choice: షెమయా
  rationale: హీబ్రూ వ్యక్తినామాన్ని మూల ఉచ్చారణకు సమీపంగా లిప్యంతరీకరించాం.
- source_word: בֶן שְׁכַנְיָה
  choice: షెకన్యా కుమారుడు
  rationale: వంశసంబంధాన్ని నిలుపుతూ హీబ్రూ వ్యక్తినామాన్ని తెలుగులో లిప్యంతరీకరించాం.
- source_word: שֹׁמֵר
  choice: కాపలాదారుడు
  rationale: ఈ కృదంతం షెమయా నిర్వహించిన బాధ్యతను లేదా పదవిని సూచిస్తుంది; ద్వార సందర్భంలో ‘కాపలాదారుడు’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: שַׁעַר הַמִּזְרָח
  choice: తూర్పు ద్వారం
  rationale: నిర్దిష్టమైన ద్వారానికి దిశాపరమైన పేరును సూచిస్తుంది; తెలుగులో ‘తూర్పు ద్వారం’ సహజమైన పేరు.
