id: NEH.3.22
reference: Nehemiah 3:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אַחֲרָ֛י/ו הֶחֱזִ֥יקוּ הַ/כֹּהֲנִ֖ים אַנְשֵׁ֥י הַ/כִּכָּֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/022.yaml
  text: After him the priests[a], the men of the plain, made repairs.
translation:
  language: te
  text: అతని తర్వాత మైదాన ప్రాంతానికి[a] చెందిన యాజకులు మరమ్మతులు చేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “చుట్టుపక్కల ప్రాంతం” లేదా “జిల్లా.” హెబ్రీ పదం כִּכָּר మైదానాన్ని లేదా వృత్తాకార ప్రాంతాన్ని సూచించగలదు; ఇక్కడ ఉద్దేశించిన ఖచ్చితమైన ప్రదేశం అనిశ్చితం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחֲרָיו
  choice: అతని తర్వాత
  rationale: సంయోజక అవ్యయంతో కూడిన ఈ రూపానికి అక్షరార్థం ‘మరియు అతని తర్వాత.’ వరుసగా మరమ్మతులు చేసినవారిని పేర్కొనే ఈ అధ్యాయ సందర్భంలో ‘అతని తర్వాత’ సహజంగా ఉండి క్రమ భావాన్ని నిలుపుతుంది.
- source_word: הֶחֱזִיקוּ
  choice: మరమ్మతులు చేశారు
  rationale: నెహెమ్యా 3లో ఈ క్రియ గోడ మరమ్మతు పనిలో పాలుపంచుకోవడాన్ని సూచించే సందర్భోచిత ప్రయోగం; అందువల్ల అక్షరార్థమైన ‘బలపరిచారు’ కంటే ‘మరమ్మతులు చేశారు’ స్పష్టంగా ఉంది.
- source_word: הַכֹּהֲנִים
  choice: యాజకులు
  rationale: నిర్దిష్ట బహువచన నామవాచకానికి సూటియైన, స్థిరమైన తెలుగు పదం.
- source_word: אַנְשֵׁי
  choice: చెందిన
  rationale: అక్షరార్థంగా ‘మనుషులు/పురుషులు’ అనే నిర్మాణ రూపమైనా, ఇక్కడ ఒక ప్రాంతానికి చెందిన యాజకులను గుర్తిస్తోంది. తెలుగులో ‘మైదాన ప్రాంతపు మనుషులైన యాజకులు’ అనడం కృత్రిమంగా ఉండేందున సంబంధ భావాన్ని ‘చెందిన’ అని సహజంగా వ్యక్తపరిచాం.
- source_word: הַכִּכָּר
  choice: మైదాన ప్రాంతం
  rationale: כִּכָּר వృత్తాకార ప్రాంతాన్ని, జిల్లాను లేదా మైదానాన్ని సూచించగలదు. ఇక్కడ ఖచ్చితమైన స్థానిక సూచన అనిశ్చితమైనందున ‘మైదాన ప్రాంతం’ ప్రధాన పాఠ్యంలో ఉంచి ఇతర సాధ్యార్థాలను పాదటిప్పణిలో ఇచ్చాం.
