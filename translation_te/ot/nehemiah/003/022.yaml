translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడబడింది. మూలంలోని వరుస భావం, మరమ్మతు సందర్భం స్పష్టంగా నిలుపబడ్డాయి; భౌగోళిక పదంలోని అనిశ్చితి పాదటిప్పణిలో భద్రపరచబడింది.
