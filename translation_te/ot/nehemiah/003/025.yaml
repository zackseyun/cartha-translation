  text: פָּלָ֣ל בֶּן אוּזַי֮ מִ/נֶּ֣גֶד הַ/מִּקְצוֹעַ֒ וְ/הַ/מִּגְדָּ֗ל הַ/יּוֹצֵא֙ מִ/בֵּ֤ית הַ/מֶּ֨לֶךְ֙ הָֽ/עֶלְי֔וֹן אֲשֶׁ֖ר לַ/חֲצַ֣ר הַ/מַּטָּרָ֑ה אַחֲרָ֖י/ו פְּדָיָ֥ה בֶן פַּרְעֹֽשׁ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/025.yaml
  text: Palal son of Uzai repaired opposite the angle and the tower projecting from the upper house of the king[a], which is by the court of the guard[c][b]. After him Pedaiah son of Parosh repaired.
translation:
  language: te
  text: ఊజై కుమారుడైన పాలాలు గోడ కోణానికీ[a], కావలి ప్రాంగణం[c] పక్కన ఉన్న రాజు ఎగువ భవనం[b] నుండి బయటికి పొడుచుకొచ్చిన గోపురానికీ ఎదురుగా మరమ్మతు చేశాడు. అతని తర్వాత పరోషు కుమారుడైన పెదాయా మరమ్మతు చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘గోడ మలుపుకు.’
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘ఎగువ రాజభవనం.’ హీబ్రూలో అక్షరార్థంగా ‘రాజు ఎగువ భవనం.’
    reason: lexical_alternative
  - marker: c
    text: లేదా ‘చెరసాల ప్రాంగణం.’ ఈ పదం కాపలా ఉంచబడిన నిర్బంధ ప్రాంగణాన్ని సూచించే అవకాశం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנֶּגֶד
  choice: ఎదురుగా
  rationale: ఈ అధ్యాయంలోని నిర్మాణ సందర్భంలో ఒక గుర్తించదగిన ప్రదేశానికి ఎదురుగా ఉన్న మరమ్మతు భాగాన్ని సూచిస్తుంది; ఖచ్చితమైన దూరాన్ని నిర్ణయించకుండా స్థల సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: הַמִּקְצוֹעַ
  choice: గోడ మలుపు
  rationale: గోడ లేదా నిర్మాణం తిరిగే కోణాన్ని సూచించే శిల్పనిర్మాణ భావాన్ని స్పష్టంగా తెలియజేస్తుంది; ‘మూల’ అనే సాధ్యమైన అర్థాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: הַמִּגְדָּל הַיּוֹצֵא
  choice: బయటికి పొడుచుకొచ్చిన గోపురం
  rationale: יצא కృదంతం ఇక్కడ గోడ లేదా రాజభవన సముదాయం నుండి వెలుపలికి చొచ్చుకొచ్చిన నిర్మాణ ఆకృతిని వర్ణిస్తుంది.
- source_word: מִבֵּית הַמֶּלֶךְ הָעֶלְיוֹן
  choice: రాజు ఎగువ భవనం నుండి
  rationale: בית అనే పదంలోని ‘భవనం/ఇల్లు’ భావాన్ని నిలుపుతూ, הָעֶלְיוֹן‌ను ఆ రాజ భవనానికి సంబంధించిన ‘ఎగువ’ అనే విశేషణంగా అందించింది; ‘ఎగువ రాజభవనం’ అనే మరింత వ్యాఖ్యానాత్మక ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
- source_word: אֲשֶׁר לַחֲצַר הַמַּטָּרָה
  choice: కావలి ప్రాంగణం పక్కన ఉన్న
  rationale: מַטָּרָה ఇక్కడ కాపలా ఉంచబడిన, నిర్బంధంతో కూడా సంబంధమున్న ప్రాంగణాన్ని సూచించవచ్చు. ప్రధాన పాఠంలో బలమైన శిక్షాసంబంధ భావాన్ని రుద్దకుండా ‘కావలి ప్రాంగణం’ ఎంచుకున్నాం.
- source_word: אַחֲרָיו
  choice: అతని తర్వాత
  rationale: మరమ్మతుదారుల వరుసలో తదుపరి వ్యక్తిని పరిచయం చేసే అధ్యాయపు సూత్రబద్ధ ప్రయోగాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: פָּלָל
  choice: పాలాలు
  rationale: హీబ్రూ వ్యక్తిపేరును తెలుగు ధ్వని విధానానికి అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: אוּזַי
  choice: ఊజై
  rationale: హీబ్రూ వ్యక్తిపేరును తెలుగు ధ్వని విధానానికి అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: פְּדָיָה
  choice: పెదాయా
  rationale: హీబ్రూ వ్యక్తిపేరును తెలుగు ధ్వని విధానానికి అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: פַּרְעֹשׁ
  choice: పరోషు
  rationale: హీబ్రూ వ్యక్తిపేరును తెలుగు ధ్వని విధానానికి అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: '[ellipsis of repair verb]'
  choice: మరమ్మతు చేశాడు
  rationale: హీబ్రూలో క్రియ స్పష్టంగా లేకపోయినా, నెహెమ్యా 3 అంతటా కొనసాగుతున్న మరమ్మతుల జాబితా నుండి అది అధ్యాహారంగా గ్రహించబడుతుంది; తెలుగులో పూర్తి వాక్యానికి దాన్ని సరఫరా చేశాం.
