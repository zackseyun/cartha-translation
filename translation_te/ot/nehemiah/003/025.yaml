  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని ఉపయోగించాం. సంక్లిష్టమైన హీబ్రూ స్థలవివరణను ఒకే వాక్యంలో ఉంచినా, సంబంధాలు స్పష్టంగా ఉండేలా పదక్రమాన్ని సవరించాం. అన్ని పాదటిప్పణి గుర్తులు సంబంధిత పదబంధాల వెంట ప్రధాన పాఠంలో ఉంచబడ్డాయి.
