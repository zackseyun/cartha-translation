revisions:
- from: అతని తరువాత తెకోవీయులు మరో భాగాన్ని[a]—బయటికి పొడుచుకొని ఉన్న గొప్ప గోపురానికి ఎదురుగా మొదలుకొని ఓఫెలు గోడ వరకు—బాగుచేశారు.
  to: అతని తరువాత తెకోవీయులు బయటికి పొడుచుకొని ఉన్న గొప్ప గోపురానికి ఎదురుగా, ఓఫెలు గోడ వరకు మరో భాగాన్ని[a] మరమ్మతు చేశారు.
  rationale: The revision removes the unsupported ‘starting from’ implication, retains the source’s topographical ambiguity and extent, and uses idiomatic modern Telugu for wall-repair work. The footnote continues to preserve the possible nuance of ‘a second section.’
