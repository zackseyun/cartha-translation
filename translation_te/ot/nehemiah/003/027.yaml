translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే నిర్మాణం. భౌగోళిక విస్తృతిని స్పష్టంచేయడానికి ‘ఎదురుగా మొదలుకొని ... వరకు’ వాడబడింది; ‘మరో/రెండవ భాగం’ అనే మూలంలోని స్వల్ప భావభేదం పాదటిప్పణిలో భద్రపరచబడింది.
