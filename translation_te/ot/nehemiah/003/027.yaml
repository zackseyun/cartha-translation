id: NEH.3.27
reference: Nehemiah 3:27
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אַחֲרָ֛י/ו הֶחֱזִ֥יקוּ הַ/תְּקֹעִ֖ים מִדָּ֣ה שֵׁנִ֑ית מִ/נֶּ֜גֶד הַ/מִּגְדָּ֤ל הַ/גָּדוֹל֙ הַ/יּוֹצֵ֔א וְ/עַ֖ד חוֹמַ֥ת הָ/עֹֽפֶל׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/027.yaml
  text: After him the Tekoites repaired another section[a], opposite the great projecting tower, as far as the wall of Ophel.
translation:
  language: te
  text: అతని తరువాత తెకోవీయులు బయటికి పొడుచుకొని ఉన్న గొప్ప గోపురానికి ఎదురుగా, ఓఫెలు గోడ వరకు మరో భాగాన్ని[a] మరమ్మతు చేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘రెండవ భాగాన్ని.’ ఈ హెబ్రీ పదబంధం తెకోవీయులు తమ మునుపటి పని భాగానికి అదనంగా ఇంకొక భాగాన్ని మరమ్మతు చేశారని నొక్కి చెప్పవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרָיו
  choice: అతని తరువాత
  rationale: నెహెమ్యా 3లో పని నియామకాల వరుసను సూచిస్తుంది; ముందటి పనివాని తరువాత అని సహజంగా తెలియజేస్తుంది.
- source_word: הֶחֱזִיקוּ
  choice: బాగుచేశారు
  rationale: మూలార్థం ‘బలపరిచారు’ అయినా, ఈ అధ్యాయంలోని గోడ పునర్నిర్మాణ సందర్భంలో మరమ్మతు చేయడాన్ని సూచించే సాంకేతిక వాడుక.
- source_word: הַתְּקֹעִים
  choice: తెకోవీయులు
  rationale: తెకోవా నివాసులను సూచించే జాతివాచక రూపం; తెలుగులో స్థలనామం ఆధారంగా సహజమైన ప్రజావాచకం.
- source_word: מִדָּה שֵׁנִית
  choice: మరో భాగాన్ని
  rationale: వారు ఇంతకుముందు చేసిన పనికి అదనంగా చేపట్టిన రెండవ కొలత/విభాగాన్ని సూచిస్తుంది; ప్రత్యక్ష ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో నిలిపాం.
- source_word: מִנֶּגֶד
  choice: ఎదురుగా మొదలుకొని
  rationale: గోపురానికి ఎదురుగా ఉన్న స్థానం నుండి మరమ్మతు విస్తరించినట్లు భౌగోళిక సంబంధాన్ని తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: הַמִּגְדָּל הַגָּדוֹל
  choice: గొప్ప గోపురం
  rationale: నిర్మాణపు పరిమాణం లేదా ప్రాముఖ్యతను తెలిపే మూలపదాల నేరమైన, సహజమైన అనువాదం.
- source_word: הַיּוֹצֵא
  choice: బయటికి పొడుచుకొని ఉన్న
  rationale: అక్షరార్థంగా ‘బయటికి వెళ్లేది’; నిర్మాణ సందర్భంలో గోడ వరుసనుండి ముందుకు చొచ్చుకొచ్చిన గోపురాన్ని సూచిస్తుంది.
- source_word: וְעַד
  choice: వరకు
  rationale: మరమ్మతు చేసిన భాగపు అంతిమ సరిహద్దును సహజమైన తెలుగులో సూచిస్తుంది.
- source_word: חוֹמַת הָעֹפֶל
  choice: ఓఫెలు గోడ
  rationale: నిర్మాణ సంబంధాన్ని సహజమైన తెలుగు నామవాచక సమాసంతో వ్యక్తం చేస్తూ స్థలనామాన్ని లిప్యంతరీకరించింది.
