source:
  edition: WLC
  text: וְ/אֵת֩ שַׁ֨עַר הָ/עַ֜יִן הֶ֠חֱזִיק שַׁלּ֣וּן בֶּן כָּל חֹזֶה֮ שַׂ֣ר פֶּ֣לֶךְ הַ/מִּצְפָּה֒ ה֤וּא יִבְנֶ֨/נּוּ֙ וִ/יטַֽלְלֶ֔/נּוּ ו/יעמידו דַּלְתֹתָ֔י/ו מַנְעֻלָ֖י/ו וּ/בְרִיחָ֑י/ו וְ֠/אֵת חוֹמַ֞ת בְּרֵכַ֤ת הַ/שֶּׁ֨לַח֙ לְ/גַן הַ/מֶּ֔לֶךְ וְ/עַד הַֽ/מַּעֲל֔וֹת הַ/יּוֹרְד֖וֹת מֵ/עִ֥יר דָּוִֽיד־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/015.yaml
  text: And Shallun son of Col-hozeh[a], official of the district of Mizpah, repaired the Fountain Gate. He rebuilt it and roofed it, and set up its doors, its bolts, and its bars, and repaired the wall of the Pool of Shelah by the king’s garden, as far as the stairs that go down from the City of David.
translation:
  language: te
  text: మిస్పా పరిపాలనా ప్రాంత అధికారి, కోల్-హోజె కుమారుడైన షల్లూను ఊట ద్వారాన్ని బాగుచేశాడు. అతడే దాన్ని తిరిగి కట్టి, దానికి కప్పు వేసి, దాని తలుపులను, బిగింపులను, అడ్డకడ్డీలను అమర్చాడు. రాజవనం దగ్గరనున్న షెలహు[a] కొలను గోడను దావీదు పట్టణం నుండి దిగే మెట్ల వరకు బాగుచేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘సిలోవ కొలను’ (సంప్రదాయంగా సిలోయముతో సంబంధం కలిగిన పేరు). ఇక్కడ హీబ్రూ స్థలనామం ‘షెలహు’.
    reason: alternative_reading
lexical_decisions:
- source_word: שַׁעַר הָעַיִן
  choice: ఊట ద్వారం
  rationale: עַיִן ఇక్కడ నీటి ఊటను సూచిస్తుంది. ‘ఊట ద్వారం’ యెరూషలేము నీటి వ్యవస్థకు సంబంధించిన భౌగోళిక సందర్భాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: הֶחֱזִיק
  choice: బాగుచేశాడు
  rationale: నెహెమ్యా 3లో ఈ క్రియ గోడ లేదా ద్వారం మరమ్మతు పనిలో పాలుపంచుకోవడాన్ని సూచిస్తుంది; సందర్భానుసారంగా ‘బాగుచేశాడు’ సహజంగా ఉంది.
- source_word: שַׂר פֶּלֶךְ הַמִּצְפָּה
  choice: మిస్పా పరిపాలనా ప్రాంత అధికారి
  rationale: פֶּלֶךְ పరిపాలనా ప్రాంతాన్ని, שַׂר దాని నాయకుడు లేదా అధికారిని సూచిస్తాయి. పదవిని అతిగా నిర్దిష్టం చేయకుండా ఈ రూపం అర్థాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: הוּא יִבְנֶנּוּ
  choice: అతడే దాన్ని తిరిగి కట్టి
  rationale: הוּא ఇచ్చే ఉద్ఘాటనను ‘అతడే’ నిలుపుతుంది. పునరుద్ధరణ సందర్భంలో ‘తిరిగి కట్టి’ అనేది ‘కట్టాడు’ కంటే తగినది.
- source_word: וִיטַלְלֶנּוּ
  choice: దానికి కప్పు వేసి
  rationale: ఈ అరుదైన క్రియ ద్వార నిర్మాణానికి కప్పు లేదా ఆవరణ వేయడాన్ని సూచిస్తుంది. ‘కప్పు వేసి’ స్పష్టమైన ఆధునిక తెలుగు.
- source_word: דַּלְתֹתָיו מַנְעֻלָיו וּבְרִיחָיו
  choice: దాని తలుపులను, బిగింపులను, అడ్డకడ్డీలను
  rationale: మూడు వేర్వేరు ద్వార భాగాలను నిలుపుతూ, מַנְעֻלִיםను సాధారణ fastening devices‌గా ‘బిగింపులు’ అని, בְּרִיחִיםను ద్వారానికి అడ్డంగా పెట్టే bars‌గా ‘అడ్డకడ్డీలు’ అని అనువదించాం.
- source_word: חוֹמַת בְּרֵכַת הַשֶּׁלַח
  choice: షెలహు కొలను గోడ
  rationale: בְּרֵכָה ‘కొలను’; הַשֶּׁלַחను ఇక్కడి హీబ్రూ రూపానికి దగ్గరగా ‘షెలహు’ అనే స్థలనామంగా ఉంచాం. సంప్రదాయ పేరును పాదసూచికలో ఇచ్చాం.
- source_word: לְגַן הַמֶּלֶךְ
  choice: రాజవనం దగ్గర ఉన్న
  rationale: భౌగోళిక సంబంధాన్ని సూచించే לְను ఈ సందర్భంలో సహజ తెలుగులో ‘దగ్గర ఉన్న’గా వ్యక్తం చేశాం; దిశ లేదా ఖచ్చితమైన సరిహద్దును అనవసరంగా నిర్ణయించలేదు.
- source_word: וְעַד הַמַּעֲלוֹת הַיּוֹרְדֹת מֵעִיר דָּוִיד
  choice: దావీదు పట్టణం నుండి దిగివచ్చే మెట్ల వరకు
  rationale: מַעֲלוֹת మెట్లు/మెట్లదారిని సూచిస్తుంది; הַיּוֹרְדֹת వాటి దిగువ దిశను స్పష్టం చేస్తుంది. מִן మూలస్థానాన్ని ‘నుండి’గా నిలుపుకున్నాం.
