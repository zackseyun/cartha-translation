translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన చారిత్రక-వివరణాత్మక శైలిని వాడాం. మూలంలోని వరుస నిర్మాణ చర్యలను స్పష్టంగా ఉంచాం. పాదసూచిక గుర్తును సంబంధిత ‘షెలహు’ పేరువద్ద ఉంచాం.
