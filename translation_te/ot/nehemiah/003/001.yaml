source:
  edition: WLC
  text: וַ/יָּ֡קָם אֶלְיָשִׁיב֩ הַ/כֹּהֵ֨ן הַ/גָּד֜וֹל וְ/אֶחָ֣י/ו הַ/כֹּהֲנִ֗ים וַ/יִּבְנוּ֙ אֶת שַׁ֣עַר הַ/צֹּ֔אן הֵ֣מָּה קִדְּשׁ֔וּ/הוּ וַֽ/יַּעֲמִ֖ידוּ דַּלְתֹתָ֑י/ו וְ/עַד מִגְדַּ֤ל הַ/מֵּאָה֙ קִדְּשׁ֔וּ/הוּ עַ֖ד מִגְדַּ֥ל חֲנַנְאֵֽל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/001.yaml
  text: Then Eliashib the high priest rose up with his brothers the priests[a], and they built the Sheep Gate. They consecrated it and set up its doors; they consecrated it as far as the Tower of the Hundred, as far as the Tower of Hananel.
translation:
  language: te
  text: అప్పుడు ప్రధాన యాజకుడైన ఎల్యాషీబు, అతని సహోదరులైన యాజకులు లేచి గొర్రెల ద్వారాన్ని నిర్మించారు. వారే దాన్ని ప్రతిష్ఠించి[a], దాని తలుపులను అమర్చారు. నూరు గోపురం వరకు, హననేలు గోపురం వరకు దాన్ని ప్రతిష్ఠించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అంకితం చేసి.’ హెబ్రీ క్రియ ఒక దానిని పవిత్రమైనదిగా లేదా ప్రత్యేకమైన ఉద్దేశానికి వేరుచేయడాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: లేచి
  rationale: קום అనే క్రియ ఇక్కడ కార్యారంభాన్ని సూచించే హెబ్రీ వృత్తాంత శైలిని కలిగి ఉంది. ‘లేచి’ ఆ రూపకాన్ని సహజమైన తెలుగులో నిలుపుతుంది; ‘పని ప్రారంభించి’ అనేది మరింత వ్యాఖ్యానాత్మకం.
- source_word: הַכֹּהֵן הַגָּדוֹל
  choice: ప్రధాన యాజకుడు
  rationale: ఇది ఇశ్రాయేలు ప్రధాన యాజకునికి వాడే స్థిరమైన బిరుదు; ఆధునిక తెలుగులో ‘ప్రధాన యాజకుడు’ స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: וְאֶחָיו הַכֹּהֲנִים
  choice: తన సహోదరులైన యాజకులతో కలిసి
  rationale: ‘సహోదరులు’ అనే కుటుంబసంబంధ పదాన్ని నిలుపుతూ, వారు యాజకులని తెలిపే అన్వయాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: שַׁעַר הַצֹּאן
  choice: గొర్రెల ద్వారం
  rationale: పట్టణ ద్వారం పేరుగా ఉన్న నిర్మాణాన్ని నేరుగా, అర్థవంతంగా తెలుగులో అందిస్తుంది.
- source_word: הֵמָּה
  choice: వారే
  rationale: స్వతంత్ర సర్వనామంలోని ఉద్ఘాటనను తెలుగులో ‘వారే’ సహజంగా నిలుపుతుంది.
- source_word: קִדְּשׁוּהוּ
  choice: దాన్ని ప్రతిష్ఠించారు
  rationale: קדשׁ ఇక్కడ దానిని పవిత్రమైన లేదా ప్రత్యేకమైన ఉద్దేశానికి వేరుచేయడాన్ని సూచిస్తుంది. ‘ప్రతిష్ఠించారు’ ఆ ఆరాధనా సంబంధ భావాన్ని నిలుపుతుంది; ‘సమర్పించారు’ కూడా సాధ్యమే.
- source_word: וַיַּעֲמִידוּ דַּלְתֹתָיו
  choice: దాని తలుపులను నిలిపారు
  rationale: ద్వారపు తలుపులను వాటి స్థానంలో అమర్చడాన్ని సూచించే హెబ్రీ ప్రయోగాన్ని అతిగా యాంత్రికంగా వివరించకుండా ప్రతిబింబిస్తుంది.
- source_word: מִגְדַּל הַמֵּאָה
  choice: నూరు గోపురం
  rationale: స్థలనామ స్వభావాన్ని నిలుపుతూ ‘the Tower of the Hundred’ అనే నిర్మాణాన్ని సంక్షిప్తమైన, సహజమైన తెలుగులో అందిస్తుంది.
- source_word: מִגְדַּל חֲנַנְאֵל
  choice: హననయేలు గోపురం
  rationale: వ్యక్తినామాన్ని లిప్యంతరీకరించి, నిర్మాణ రకాన్ని తెలుగులో అనువదిస్తుంది.
- source_word: וְעַד ... עַד
  choice: '... వరకు, ... వరకు'
  rationale: పునరుక్త עַד సూచించే విస్తృతి లేదా సరిహద్దును తెలుగులో అదే పునరుక్తితో నిలుపుతుంది.
theological_decisions:
- issue: ద్వారానికి సంబంధించి קדשׁ యొక్క ఆరాధనా భావం
  choice: ప్రతిష్ఠించారు
  alternative: సమర్పించారు
  rationale: యాజకులు చేసినది కేవలం పౌర నిర్మాణ కార్యం మాత్రమే కాదని, పవిత్రమైన లేదా ప్రత్యేకమైన ఉద్దేశానికి వేరుచేసే కార్యమని పదం సూచిస్తుంది. అయితే దాని స్వరూపాన్ని వాక్యం చెప్పినదానికంటే ఎక్కువగా నిర్వచించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన వృత్తాంత శైలిని వాడాం. హెబ్రీలోని కార్యారంభ రూపకం (‘లేచి’), స్వతంత్ర సర్వనామ ఉద్ఘాటన (‘వారే’), ప్రదేశ విస్తృతి పునరుక్తి (‘వరకు ... వరకు’) నిలుపబడ్డాయి. ‘ప్రతిష్ఠించారు’ అనే పదానికి ఉన్న సముచిత ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో తెలిపాం.
