revisions:
- from: అప్పుడు ప్రధాన యాజకుడైన ఎల్యాషీబు తన సహోదరులైన యాజకులతో కలిసి లేచి, గొర్రెల ద్వారాన్ని నిర్మించారు. వారే దాన్ని ప్రతిష్ఠించి[a], దాని తలుపులను నిలిపారు. నూరు గోపురం వరకు, హననయేలు గోపురం వరకు దాన్ని ప్రతిష్ఠించారు.
  to: అప్పుడు ప్రధాన యాజకుడైన ఎల్యాషీబు, అతని సహోదరులైన యాజకులు లేచి గొర్రెల ద్వారాన్ని నిర్మించారు. వారే దాన్ని ప్రతిష్ఠించి[a], దాని తలుపులను అమర్చారు. నూరు గోపురం వరకు, హననేలు గోపురం వరకు దాన్ని ప్రతిష్ఠించారు.
  rationale: The revision preserves the Hebrew sequence, the emphasis in “వారే,” and the repeated extent phrase “వరకు ... వరకు.” It corrects Hananel’s name, removes an unnecessary number-agreement awkwardness, and uses a more natural verb for fitting the gate doors. The footnote retains the legitimate lexical alternative for קדשׁ without imposing a more specific ritual interpretation.
