translation:
  language: te
  text: అతని పక్కనే యెరికో మనుషులు కట్టారు; అతని పక్కనే ఇమ్రీ కుమారుడు జక్కూరు కట్టాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַל יָדוֹ
  choice: అతని పక్కనే
  rationale: עַל יָד అనే నుడికారం ఈ అధ్యాయంలోని నిర్మాణ వరుసలో ఒకరి పక్కన మరొకరు పనిచేసిన స్థలసామీప్యాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘పక్కనే’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: בָנוּ
  choice: కట్టారు
  rationale: בנה అనే సాధారణ క్రియకు ‘కట్టు’ అనే అర్థం. గోడను పునర్నిర్మించిన విస్తృత సందర్భం ఉన్నప్పటికీ, ఈ వచనంలో క్రియ స్వయంగా ‘మళ్లీ’ అనే భావాన్ని వ్యక్తం చేయదు.
- source_word: אַנְשֵׁי יְרֵחוֹ
  choice: యెరికో మనుషులు
  rationale: అక్షరార్థంగా ‘యెరికో పురుషులు/మనుషులు’. ఇక్కడ యెరికోతో గుర్తించబడిన బృందాన్ని సూచించేందుకు ‘యెరికో మనుషులు’ సహజంగా ఉంది; ‘నుండి’ అనే మూలంలో లేని మాటను చేర్చదు.
- source_word: וְעַל יָדוֹ
  choice: వారి పక్కనే
  rationale: హీబ్రూలో ప్రత్యయం ఏకవచనంగా ‘అతని పక్కనే’ ఉంది. అయితే వరుసలో వెంటనే ముందు చెప్పిన యెరికో మనుషులతో సంబంధాన్ని తెలుగులో స్పష్టంగా చూపడానికి ప్రధాన పాఠంలో ‘వారి పక్కనే’ అని ఇచ్చి, మూలరూపాన్ని పాదసూచికలో నిలిపాం.
- source_word: בָנָה
  choice: కట్టాడు
  rationale: ముందటి బహువచన క్రియలాగే ఇది కూడా בנה యొక్క సాధారణ ‘కట్టు’ భావాన్నే కలిగి ఉంది; కర్త ఏకవచనం కావడంతో ‘కట్టాడు’ అని అనువదించాం.
- source_word: זַכּוּר בֶּן אִמְרִי
  choice: ఇమ్రీ కుమారుడు జక్కూరు
  rationale: హీబ్రూ వంశసంబంధాన్ని సహజమైన తెలుగు పదక్రమంలో ‘ఇమ్రీ కుమారుడు జక్కూరు’గా ఇచ్చాం; వ్యక్తినామాలను తెలుగు లిపిలో ధ్వన్యనుకరణ చేశాం.
