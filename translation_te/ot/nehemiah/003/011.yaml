translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడాం. వ్యక్తి, వంశనామాలను మూల హీబ్రూకు దగ్గరగా లిప్యంతరీకరించాం; సందిగ్ధమైన పదార్థాలను పాదసూచికల్లో నిలిపాం.
