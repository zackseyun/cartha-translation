id: NEH.3.11
reference: Nehemiah 3:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: מִדָּ֣ה שֵׁנִ֗ית הֶחֱזִיק֙ מַלְכִּיָּ֣ה בֶן חָרִ֔ם וְ/חַשּׁ֖וּב בֶּן פַּחַ֣ת מוֹאָ֑ב וְ/אֵ֖ת מִגְדַּ֥ל הַ/תַּנּוּרִֽים־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/011.yaml
  text: Malchijah son of Harim and Hasshub son of Pahath-moab repaired another section[b][a], and also the Tower of the Ovens.
translation:
  language: te
  text: హారీము కుమారుడైన మల్కీయా, పహత్-మోయాబు కుమారుడైన హష్షూబు మరో భాగాన్ని[a], అలాగే పొయ్యిల గోపురాన్ని[b] మరమ్మతు చేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “రెండవ భాగాన్ని.” హీబ్రూ పదబంధానికి ఇది మరింత అక్షరార్థ అనువాదం; ఇక్కడ మరమ్మతు కోసం కేటాయించిన అదనపు భాగాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “కొలిమిల గోపురాన్ని.” హీబ్రూ పదం పొయ్యిలను లేదా కొలిమిలను సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִדָּה שֵׁנִית
  choice: గోడలో మరొక భాగాన్ని
  rationale: ఈ అధ్యాయంలోని నిర్మాణ సందర్భంలో ఇది మరమ్మతు కోసం కేటాయించిన అదనపు గోడ భాగాన్ని సూచిస్తుంది. మూలంలోని ‘రెండవ భాగం’ అనే రూపాన్ని పాదసూచికలో నిలిపి, ప్రధాన పాఠంలో సహజమైన తెలుగును వాడాం.
- source_word: הֶחֱזִיק
  choice: బాగుచేశారు
  rationale: గోడ నిర్మాణ సందర్భంలో ఈ క్రియకు ‘మరమ్మతు చేయడం/బలపరచడం’ అనే భావం ఉంది; సాధారణ ఆధునిక తెలుగులో ‘బాగుచేశారు’ స్పష్టంగా ఉంటుంది.
- source_word: מַלְכִּיָּה בֶן־חָרִם
  choice: హారిము కుమారుడు మల్కీయా
  rationale: హీబ్రూ పితృనామ సంబంధాన్ని సహజమైన తెలుగు క్రమంలో ఉంచి, వ్యక్తి పేర్లను లిప్యంతరీకరించాం.
- source_word: וְחַשּׁוּב בֶּן־פַּחַת מוֹאָב
  choice: పహత్-మోయాబు కుమారుడు హష్షూబు
  rationale: సంయుక్త కుటుంబ/వంశనామాన్ని నిలిపి, తెలుగు ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: וְאֵת
  choice: అలాగే
  rationale: ముందు చెప్పిన గోడ భాగానికి తోడు మరొక నిర్మాణాన్ని కూడా వారు బాగుచేశారని తెలిపే అదనపు భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: מִגְדַּל הַתַּנּוּרִים
  choice: పొయ్యిల గోపురం
  rationale: תַּנּוּרִים అనే పదం పొయ్యిలను లేదా కొలిమిలను సూచించగలదు. ప్రధాన పాఠంలో స్థలనామంలా ఉన్న నిర్మాణాన్ని సూటిగా అనువదించి, ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
