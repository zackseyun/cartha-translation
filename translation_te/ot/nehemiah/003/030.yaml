source:
  edition: WLC
  text: אחר/י הֶחֱזִ֜יק חֲנַנְיָ֣ה בֶן שֶׁלֶמְיָ֗ה וְ/חָנ֧וּן בֶּן צָלָ֛ף הַ/שִּׁשִּׁ֖י מִדָּ֣ה שֵׁנִ֑י אַחֲרָ֣י/ו הֶחֱזִ֗יק מְשֻׁלָּם֙ בֶּן בֶּ֣רֶכְיָ֔ה נֶ֖גֶד נִשְׁכָּתֽ/וֹ־־ס־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/030.yaml
  text: After him Hananiah son of Shelemiah and Hanun the sixth son of Zalaph repaired another section[b][a]. After him Meshullam son of Berechiah repaired opposite his chamber.
translation:
  language: te
  text: అతని తర్వాత షెలెమ్యా కుమారుడు హనన్యా, సాలాఫు కుమారుడు హానూను, ఆరవవాడు, మరొక భాగాన్ని[a] బాగుచేశారు.[b] అతని తర్వాత బెరెక్యా కుమారుడు మెషుల్లాము తన గదికి ఎదురుగా బాగుచేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ అక్షరార్థం ‘రెండవ కొలత’; నెహెమ్యా 3లో ఈ నుడికారం మరమ్మతు చేయడానికి అప్పగించిన అదనపు భాగాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: మొదటి హీబ్రూ పదరూపాన్ని అక్షరార్థంగా ‘నా తర్వాత’ అని చదవవచ్చు; అయితే ఈ అధ్యాయంలోని పునరావృత నిర్మాణక్రమ సూత్రానికి అనుగుణంగా సంప్రదాయంగా ‘అతని తర్వాత’ అని అర్థం చేసుకుంటారు.
    reason: textual_variant
lexical_decisions:
- source_word: אַחֲרַי / אַחֲרָיו
  choice: అతని తర్వాత / వారి తర్వాత
  rationale: ఈ అధ్యాయంలోని పునరావృత నిర్మాణక్రమ సూత్రానికి అనుగుణంగా మొదటి రూపంలోని పాఠ్య అసాధారణతను పాదసూచికలో ఉంచి, సందర్భార్థాన్ని ప్రధాన పాఠ్యంలో సహజంగా ఇచ్చాం. రెండో సందర్భంలో ఇద్దరు పనివారిని ప్రస్తావించినందున తెలుగులో సహజంగా ‘వారి తర్వాత’ అన్నాం.
- source_word: הֶחֱזִיק
  choice: బాగుచేశారు / బాగుచేశాడు
  rationale: నెహెమ్యా 3లో గోడ పునరుద్ధరణ పనిని సూచించే సందర్భోచిత, సాధారణ తెలుగు పదప్రయోగం.
- source_word: הַשִּׁשִּׁי
  choice: ఆరవ కుమారుడు
  rationale: హీబ్రూలో ‘ఆరవవాడు’ అని సంక్షిప్తంగా ఉన్న వంశసంబంధ భావాన్ని తెలుగులో స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: מִדָּה שֵׁנִי
  choice: మరొక భాగాన్ని
  rationale: అక్షరార్థంగా ‘రెండవ కొలత’ అయినప్పటికీ, ఈ అధ్యాయంలో మరమ్మతుకు కేటాయించిన అదనపు గోడభాగాన్ని సూచించే నుడికారంగా అర్థమవుతుంది; అక్షరార్థాన్ని పాదసూచికలో నిలిపాం.
- source_word: נֶגֶד
  choice: ఎదురుగా ఉన్న
  rationale: ఒక స్థలానికి నేరుగా ఎదురుగా లేదా ముందుగా ఉన్న ప్రదేశాన్ని సూచించే సహజ తెలుగు రూపం.
- source_word: נִשְׁכָּתוֹ
  choice: తన గది
  rationale: ఆ గది మెషుల్లాముకు సంబంధించినదని ప్రతిబింబిస్తుంది; దాని నివాస, అధికారిక లేదా ఇతర విధిని అనవసరంగా నిర్దిష్టం చేయదు.
- source_word: חֲנַנְיָה / שֶׁלֶמְיָה / חָנוּן / צָלָף / מְשֻׁלָּם / בֶּרֶכְיָה
  choice: హనన్యా / షెలెమ్యా / హానూను / సాలాఫు / మెషుల్లాము / బెరెక్యా
  rationale: వ్యక్తినామాలను ఆధునిక ప్రామాణిక తెలుగు బైబిలు శైలికి తగిన విధంగా లిప్యంతరీకరించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన వచనశైలి. హీబ్రూ వాక్యంలోని మరమ్మతు కర్మను తెలుగులో స్పష్టత కోసం ‘గోడలో’ మరియు ‘ఉన్న భాగాన్ని’ అని సందర్భానుగుణంగా వ్యక్తం చేశాం. మొదటి పదరూపంలోని నిజమైన పాఠ్య సందిగ్ధతను పాదసూచికలో సంరక్షించాం.
