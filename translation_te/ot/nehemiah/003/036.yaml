revisions:
- from: మా దేవా, ఆలకించు; ఎందుకంటే మేము అవహేళనకు గురయ్యాము.[a] వారి నిందను వారి తలల మీదికే తిప్పు; చెరలోని ఒక దేశంలో వారిని దోపుడుసొమ్ముగా అప్పగించు.[b]
  to: మా దేవా, ఆలకించు; ఎందుకంటే మేము అవహేళనకు గురయ్యాము.[a] వారి దూషణను వారి తలల మీదికే తిప్పు; ఒక చెరదేశంలో వారిని దోపుడుసొమ్ముగా అప్పగించు.[b]
