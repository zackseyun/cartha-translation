id: NEH.3.36
reference: Nehemiah 3:36
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: שְׁמַ֤ע אֱלֹהֵ֨י/נוּ֙ כִּֽי הָיִ֣ינוּ בוּזָ֔ה וְ/הָשֵׁ֥ב חֶרְפָּתָ֖/ם אֶל רֹאשָׁ֑/ם וּ/תְנֵ֥/ם לְ/בִזָּ֖ה בְּ/אֶ֥רֶץ שִׁבְיָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/036.yaml
  text: Hear[a], our God, for we are despised. Turn their reproach back on their own heads[c][b], and give them over as plunder in a land of captivity.
translation:
  language: te
  text: మా దేవా, ఆలకించు; ఎందుకంటే మేము అవహేళనకు గురయ్యాము.[a] వారి దూషణను వారి తలల మీదికే తిప్పు; ఒక చెరదేశంలో వారిని దోపుడుసొమ్ముగా అప్పగించు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “మేము అవహేళనగా మారాము”; లేదా “మేము హేళనపాలయ్యాము.”
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ పదబంధాన్ని అనిర్దిష్టంగా “ఒక చెరదేశంలో” అని గానీ, సందర్భానుసారం మరింత నిర్దిష్టంగా “ఆ చెరదేశంలో” అని గానీ అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמַע
  choice: ఆలకించు
  rationale: దేవునికి చేసే ప్రార్థనలోని ఏకవచన ఆజ్ఞారూపాన్ని గౌరవప్రదంగా, సహజంగా వ్యక్తపరుస్తుంది; మూలంలో లేని ‘మా మొర’ వంటి కర్మను చేర్చదు.
- source_word: אֱלֹהֵינוּ
  choice: మా దేవా
  rationale: మొదటి పురుష బహువచన సంబంధాన్ని, ప్రత్యక్ష సంబోధనను సహజమైన తెలుగు విభక్తితో నిలుపుతుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందున్న విన్నపానికి కారణాన్ని పరిచయం చేసే హేత్వర్థాన్ని స్పష్టంగా తెలుపుతుంది.
- source_word: הָיִינוּ בוּזָה
  choice: మేము అవహేళనకు గురయ్యాము
  rationale: అక్షరార్థమైన ‘మేము అవహేళన అయ్యాము’ అనే అసహజ నిర్మాణానికి బదులు, పూర్తయిన చర్య వల్ల ఏర్పడిన అవమాన స్థితిని సహజ తెలుగులో నిలుపుతుంది.
- source_word: וְהָשֵׁב
  choice: తిప్పు
  rationale: హిఫిల్ ఆజ్ఞారూపంలోని తిరిగి మళ్లించే భావాన్ని తరువాతి ‘వారి తలల మీదికే’తో కలిసి సహజంగా వ్యక్తపరుస్తుంది.
- source_word: חֶרְפָּתָם
  choice: వారి నిందను
  rationale: חֶרְפָּה లోని అవమానం, దూషణ, అపకీర్తి భావాలను సందర్భానికి తగిన సంక్షిప్త పదంతో అందిస్తుంది.
- source_word: אֶל רֹאשָׁם
  choice: వారి తలల మీదికే
  rationale: హీబ్రూ ప్రతీకార-ప్రత్యావర్తన నుడికారాన్ని నిలుపుతూ, ‘-కే’ ద్వారా అదే వారిపైకి తిరిగివచ్చే బలాన్ని సహజంగా తెలుపుతుంది.
- source_word: וּתְנֵם
  choice: వారిని ... అప్పగించు
  rationale: נתן ఆజ్ఞారూపం మరియు మూడవ పురుష బహువచన కర్మను, దోపుడుకు లోనయ్యేలా చేయడం అనే సందర్భార్థంతో స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: לְבִזָּה
  choice: దోపుడుసొమ్ముగా
  rationale: בִּזָּה అనే ‘కొల్లసొమ్ము/దోపుడుసొమ్ము’ భావాన్ని, వారినే దోపుడుసొమ్ముగా అప్పగించాలనే విధేయార్థంలో తెలుపుతుంది.
- source_word: בְּאֶרֶץ שִׁבְיָה
  choice: చెరలోని ఒక దేశంలో
  rationale: నిర్దిష్ట ఉపపదం లేని ‘ఒక దేశం’ అనే అనిర్దిష్టతను నిలుపుతూ, שִׁבְיָה లోని చెర/బందీ స్థితిని సహజ తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: శత్రువులపై ప్రతీకార న్యాయం కోరే ప్రార్థన
  choice: నిందను వారిపైనే తిప్పి, వారిని దోపుడుసొమ్ముగా అప్పగించమనే ప్రత్యక్ష విన్నపాన్ని యథాతథంగా నిలుపడం
  alternative: దీనిని సాధారణ న్యాయవిన్నపంగా మృదువుగా చెప్పడం లేదా రూపకార్థంగా మార్చడం
  rationale: హీబ్రూ పాఠం దేవుని నేరుగా ఉద్దేశించి ప్రతిఫల న్యాయాన్ని కోరుతుంది. అనువాదం దాని నైతిక ఉద్రిక్తతను తగ్గించకూడదు లేదా ప్రత్యేక సిద్ధాంతంతో పునర్వ్యాఖ్యానించకూడదు.
- issue: ‘చెరలోని ఒక దేశం’ యొక్క నిర్దిష్టత
  choice: అనిర్దిష్టమైన ‘ఒక దేశంలో’ను నిలుపడం
  alternative: ‘ఆ చెరదేశంలో’ లేదా ‘చెరదేశంలో’ అని నిర్దిష్టంగా చదవడం
  rationale: మూల హీబ్రూలో నిర్దిష్ట ఉపపదం లేదు; సందర్భం ప్రత్యేక దేశాన్ని సూచించే అవకాశాన్ని పూర్తిగా నిరాకరించకుండా, వ్యాకరణపరమైన అనిర్దిష్టతను ప్రధాన పాఠంలో నిలుపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన ప్రార్థనా శైలిని వాడాం. ‘ఆలకించు’, ‘నింద’, ‘అప్పగించు’ వంటి పదాలు ఘనతను నిలుపుతూనే సాధారణ పాఠకులకు అర్థమయ్యేలా ఉన్నాయి. ప్రతీకార విన్నపపు కఠినతను మృదువుచేయలేదు; అలాగే మూలంలోని అనిర్దిష్టతను అవసరానికి మించి పరిష్కరించలేదు.
