  text: עַל יָד֣/וֹ הֶחֱזִ֗יק עֻזִּיאֵ֤ל בֶּֽן חַרְהֲיָה֙ צֽוֹרְפִ֔ים וְ/עַל יָד֣/וֹ הֶחֱזִ֔יק חֲנַנְיָ֖ה בֶּן הָ/רַקָּחִ֑ים וַ/יַּֽעַזְבוּ֙ יְר֣וּשָׁלִַ֔ם עַ֖ד הַ/חוֹמָ֥ה הָ/רְחָבָֽה־־ס־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/008.yaml
  text: Next to him Uzziel son of Harhaiah[a], one of the goldsmiths, made repairs; and next to him Hananiah, one of the perfumers, made repairs. And they restored Jerusalem as far as the Broad Wall.
translation:
  language: te
  text: అతని పక్కనే బంగారు పనివారిలో ఒకడైన హర్హయా కుమారుడు ఉజ్జీయేలు మరమ్మతు చేశాడు. అతని పక్కనే పరిమళ ద్రవ్యాలు తయారుచేసేవారిలో ఒకడైన హనన్యా మరమ్మతు చేశాడు. వారు విశాల ప్రాకారం వరకు యెరూషలేమును పునరుద్ధరించారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “విశాల ప్రాకారం వరకు యెరూషలేమును విడిచిపెట్టారు.” ఇక్కడి హీబ్రూ క్రియకు సాధారణంగా “విడిచిపెట్టు” అని అర్థం; అయితే ఈ పునర్నిర్మాణ సందర్భంలో దానిని “పునరుద్ధరించారు” లేదా “మరమ్మతు చేశారు” అని తరచుగా అర్థం చేసుకుంటారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל יָדוֹ
  choice: అతని పక్కనే
  rationale: నెహెమ్యా 3లో ఈ జాతీయం మరమ్మతు పనిలో ఒకరి పక్కన మరొకరు పనిచేసిన క్రమాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ఇది సహజంగా స్థలసామీప్యాన్ని తెలియజేస్తుంది.
- source_word: הֶחֱזִיק
  choice: మరమ్మతు చేశాడు
  rationale: మూల క్రియకు సాధారణంగా ‘బలపరచు’ అనే భావం ఉన్నా, ఈ అధ్యాయంలోని గోడ పునర్నిర్మాణ సందర్భంలో మరమ్మతు పనిలో పాల్గొనడాన్ని సూచిస్తుంది.
- source_word: צֹרְפִים
  choice: బంగారు పనివారు
  rationale: ఈ బహువచన పదం ఉజ్జీయేలు చెందిన వృత్తివర్గాన్ని సూచిస్తుంది. సందర్భంలో ‘బంగారు పనివారు’ స్పష్టమైన, సహజమైన అనువాదం.
- source_word: הָרַקָּחִים
  choice: సుగంధ ద్రవ్యాలు తయారుచేసేవారు
  rationale: ఈ పదం పరిమళ ద్రవ్యాలు లేదా లేపనాలు తయారుచేసే వృత్తివారిని సూచిస్తుంది; ప్రాచీన లేదా అపార్థకర పదం కంటే ఈ వివరణ ఆధునిక పాఠకులకు స్పష్టం.
- source_word: וַיַּעַזְבוּ
  choice: వారు … పునరుద్ధరించారు
  rationale: ఈ క్రియ సాధారణంగా ‘విడిచిపెట్టారు’ అని అర్థమిచ్చినా, గోడ మరమ్మతుల జాబితా సందర్భంలో అనేకులు దీనిని పునరుద్ధరణ భావంలో అర్థం చేసుకుంటారు. ప్రధాన పాఠంలో సందర్భోచిత భావాన్ని ఉంచి, సాధారణ మూలార్థాన్ని పాదసూచికలో నిలిపాం.
- source_word: יְרוּשָׁלַםִ
  choice: యెరూషలేమును
  rationale: మూలపాఠం నగరాన్నే పేర్కొంటుంది; అది నగర రక్షణ నిర్మాణాలకు స్థానాపన్నంగా ఉండవచ్చు. ప్రధాన పాఠంలో ‘గోడ’ అనే పదాన్ని అదనంగా చేర్చలేదు.
- source_word: עַד הַחוֹמָה הָרְחָבָה
  choice: విశాల ప్రాకారం వరకు
  rationale: ఇది యెరూషలేములో గుర్తింపుపొందిన ఒక నిర్దిష్ట రక్షణ నిర్మాణం పేరుగా కనిపిస్తుంది; ‘విశాల ప్రాకారం’ దాని ప్రత్యేక నామ స్వభావాన్నీ, విశాలత భావాన్నీ నిలుపుతుంది.
