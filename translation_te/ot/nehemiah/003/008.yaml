translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన శైలి వాడబడింది. వరుస నిర్మాణాన్ని నిలుపుతూ ‘అతని పక్కనే’ అనే పునరుక్తిని ఉద్దేశపూర్వకంగా ఉంచాం. వృత్తి పదాలను సాధారణ పాఠకులకు వెంటనే అర్థమయ్యే విధంగా అనువదించాం.
