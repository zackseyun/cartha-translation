id: NEH.3.26
reference: Nehemiah 3:26
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הַ֨/נְּתִינִ֔ים הָי֥וּ יֹשְׁבִ֖ים בָּ/עֹ֑פֶל עַ֠ד נֶ֜גֶד שַׁ֤עַר הַ/מַּ֨יִם֙ לַ/מִּזְרָ֔ח וְ/הַ/מִּגְדָּ֖ל הַ/יּוֹצֵֽא׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/026.yaml
  text: The temple servants were living on the Ophel[a], as far as opposite the Water Gate toward the east and the projecting tower.
translation:
  language: te
  text: దేవాలయ సేవకులు[a] ఓఫెలులో నివసించేవారు; వారు తూర్పువైపున ఉన్న నీటి ద్వారానికి ఎదురుగా ఉన్న చోటు వరకు, అలాగే బయటికి పొడుచుకొచ్చిన గోపురం వరకు నివసించేవారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో నెతీనీమ్; దేవాలయ సేవకులుగా గుర్తింపు పొందిన ప్రత్యేక వర్గం.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנְּתִינִים
  choice: దేవాలయ సేవకులు
  rationale: ఇది దేవాలయ విధులకు నియమించబడిన, ‘నెతీనీయులు’గా ప్రసిద్ధమైన ప్రత్యేక సేవక వర్గాన్ని సూచిస్తుంది. ఆధునిక పాఠకులకు వారి పాత్ర స్పష్టంగా ఉండేందుకు పదాన్ని లిప్యంతరీకరించకుండా అర్థాన్ని అనువదించాం; మూలపదాన్ని పాదసూచికలో తెలిపాం.
- source_word: הָיוּ יֹשְׁבִים
  choice: నివసించేవారు
  rationale: היה + వర్తమాన కృదంత నిర్మాణం కొనసాగుతున్న లేదా అలవాటైన నివాస స్థితిని సూచిస్తుంది. ‘నివసించేవారు’ ఆధునిక తెలుగులో సహజంగా ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: בָּעֹפֶל
  choice: ఓఫెలు మీద
  rationale: עֹפֶל యెరూషలేములోని ఎత్తైన, కోటగల ప్రదేశానికి సంబంధించిన స్థలనామం. పేరును లిప్యంతరీకరించి, దాని ఎత్తైన భౌగోళిక స్వభావానికి అనుగుణంగా ‘మీద’ వాడాం.
- source_word: עַד נֶגֶד
  choice: ఎదురుగా ఉన్న చోటు వరకూ
  rationale: עַד హద్దును, נֶגֶד ఒక ప్రదేశానికి ఎదురుగా లేదా అభిముఖంగా ఉండటాన్ని సూచిస్తాయి. తెలుగు వాక్యంలో రెండింటినీ సహజంగా నిలుపుతుంది.
- source_word: שַׁעַר הַמַּיִם
  choice: నీటి ద్వారం
  rationale: ఇది నగర ద్వారం పేరుగా ఉన్న సరళమైన సమాస నిర్మాణం. ‘నీటి ద్వారం’ అర్థస్పష్టమైన, గౌరవప్రదమైన తెలుగు రూపం.
- source_word: לַמִּזְרָח
  choice: తూర్పువైపున ఉన్న
  rationale: ఈ పదబంధం తూర్పు దిశలోని స్థానాన్ని లేదా దిశను సూచిస్తుంది. సందర్భంలో నీటి ద్వారానికి సంబంధించిన తూర్పు స్థానాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: הַמִּגְדָּל הַיּוֹצֵא
  choice: బయటికి పొడుచుకొచ్చిన గోపురం
  rationale: יֹצֵא అక్షరార్థంగా ‘బయటికి వెళ్తున్నది’; నిర్మాణ సందర్భంలో గోడరేఖకు బయటికి చొచ్చుకొచ్చిన లేదా పొడుచుకొచ్చిన గోపురాన్ని సూచిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి వాడబడింది. పొడవైన హీబ్రూ వాక్యాన్ని తెలుగులో స్పష్టత కోసం రెండు వాక్యాలుగా అమర్చినా, నివాస ప్రాంతపు హద్దులు మరియు దిశాసంబంధ వివరాలు నిలుపబడ్డాయి.
