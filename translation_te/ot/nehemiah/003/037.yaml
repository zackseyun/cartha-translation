  text: וְ/אַל תְּכַס֙ עַל עֲוֺנָ֔/ם וְ/חַטָּאתָ֖/ם מִ/לְּ/פָנֶ֣י/ךָ אַל תִּמָּחֶ֑ה כִּ֥י הִכְעִ֖יסוּ לְ/נֶ֥גֶד הַ/בּוֹנִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/037.yaml
  text: And do not cover over their guilt[a], and do not let their sin be blotted out from before you[b], for they have provoked anger in the presence of the builders.
translation:
  language: te
  text: వారి దోషాన్ని కప్పివేయవద్దు[a]; నీ సన్నిధి నుండి వారి పాపాన్ని తుడిచివేయవద్దు. ఎందుకంటే వారు కట్టేవారి ఎదుట కోపం కలిగించారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వారి దోషాన్ని క్షమించవద్దు.’ హీబ్రూ రూపకం, ‘వారి దోషాన్ని కప్పివేయవద్దు.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘వారు కట్టేవారి ఎదుట నిన్ను కోపపెట్టారు.’ హీబ్రూ పాఠ్యంలో కోపానికి గురైన వ్యక్తి స్పష్టంగా చెప్పబడలేదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּכַס ... עַל עֲוֺנָם
  choice: వారి దోషాన్ని కప్పివేయవద్దు
  rationale: כסה עַל లోని ‘కప్పివేయడం’ అనే రూపకాన్ని నిలిపి ఉంచుతూ, అపరాధాన్ని పట్టించుకోకపోవడం లేదా క్షమించడం అనే సందర్భార్థాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: עֲוֺנָם
  choice: వారి దోషం
  rationale: עָוֹן దుష్కార్యాన్నీ దానివల్ల కలిగే దోషభారాన్నీ సూచించగలదు. సమాంతరంగా వచ్చే ‘పాపం’ నుండి భేదాన్ని ఉంచుతూ నైతిక తీవ్రతను ‘దోషం’ తెలియజేస్తుంది.
- source_word: חַטָּאתָם
  choice: వారి పాపం
  rationale: חַטָּאת యొక్క సాధారణ, ప్రత్యక్ష అర్థం ‘పాపం’; ఇది వాక్యంలోని సమాంతర నిర్మాణానికి సరిపోతుంది.
- source_word: מִלְּפָנֶיךָ
  choice: నీ సన్నిధి నుండి
  rationale: దేవుని ముఖం లేదా సన్నిధి ఎదుట ఉన్న పాపం తొలగించబడకూడదనే ప్రాదేశిక, సంబంధాత్మక భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: תִּמָּחֶה
  choice: తుడిచివేయబడనివ్వవద్దు
  rationale: מחה ఇక్కడ పాపాన్ని దైవిక గమనిక లేదా జ్ఞాపకం నుండి తుడిచివేయడాన్ని సూచిస్తుంది. మూలంలోని నిష్క్రియ నిర్మాణాన్ని కూడా ఈ రూపం కాపాడుతుంది.
- source_word: הִכְעִיסוּ
  choice: కోపం రేపారు
  rationale: హిఫీల్ రూపం కోపం కలిగించడం లేదా రెచ్చగొట్టడం అనే కారణార్థాన్ని ఇస్తుంది. హీబ్రూలో కర్మ స్పష్టంగా లేనందున ఎవరికి కోపం కలిగించారో ప్రధాన పాఠ్యంలో చేర్చలేదు.
- source_word: לְנֶגֶד הַבּוֹנִים
  choice: కట్టేవారి ఎదుట
  rationale: לְנֶגֶד యొక్క ప్రత్యక్ష భావమైన ‘ఎదుట, సమక్షంలో’ను నిలుపుతుంది; సందర్భంలో గోడను కడుతున్నవారిని ‘కట్టేవారు’ అని సహజంగా సూచిస్తుంది.
theological_decisions:
- issue: శత్రువుల పాపం క్షమించబడకూడదనే శాపప్రార్థన భాష
  choice: దేవుడు వారి దోషాన్ని కప్పివేయకూడదనీ వారి పాపాన్ని తుడిచివేయనివ్వకూడదనీ ఉన్న ప్రత్యక్ష విన్నపాన్ని తీవ్రత తగ్గించకుండా ఉంచడం
  alternative: ‘వారి తప్పును పట్టించుకోకుండా ఉండవద్దు’ వంటి మృదువైన భావానువాదం
  rationale: హీబ్రూ పాఠ్యం స్పష్టమైన శాపప్రార్థన. దాని ధార్మిక ఉద్రిక్తతను అనువాదంలో మృదువుచేయకుండా యథాతథంగా నిలపాలి.
- issue: הִכְעִיסוּ లో కోపానికి గురైన వ్యక్తి స్పష్టంగా చెప్పబడకపోవడం
  choice: ‘కోపం రేపారు’ అని కర్మను అవ్యక్తంగానే ఉంచడం
  alternative: ‘వారు నీకు కోపం పుట్టించారు’
  rationale: సందర్భం దేవుని కోపాన్ని సూచించవచ్చు; అయినా మూల హీబ్రూ కర్మను స్పష్టంగా పేర్కొనదు. అందువల్ల ప్రధాన పాఠ్యం అస్పష్టతను నిలుపుతుంది; ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ ప్రార్థనకు తగిన గౌరవప్రదమైన ఏకవచన సంబోధన (‘నీ’) వాడబడింది. ‘కప్పివేయడం,’ ‘సన్నిధి నుండి తుడిచివేయబడడం’ అనే మూలభాషా చిత్రాలు నిలుపబడ్డాయి; చివరి ఉపవాక్యంలోని కర్మ అస్పష్టతను ప్రధాన పాఠ్యం పరిష్కరించలేదు.
