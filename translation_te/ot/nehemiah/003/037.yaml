- from: వారి దోషాన్ని కప్పివేయవద్దు[a]; నీ సన్నిధి నుండి వారి పాపం తుడిచివేయబడనివ్వవద్దు. ఎందుకంటే వారు కట్టేవారి ఎదుట కోపం రేపారు[b].
