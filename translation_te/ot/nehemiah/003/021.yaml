  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన కథన శైలి వాడబడింది. వంశావళి శ్రేణిని తెలుగులో సహజంగా వినిపించేందుకు ‘కుమారుడు—మనవడు’ రూపంలో వ్యక్తం చేశాం.
