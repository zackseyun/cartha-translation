source:
  edition: WLC
  text: אַחֲרָ֣י/ו הֶחֱזִ֗יק מְרֵמ֧וֹת בֶּן אוּרִיָּ֛ה בֶּן הַקּ֖וֹץ מִדָּ֣ה שֵׁנִ֑ית מִ/פֶּ֨תַח֙ בֵּ֣ית אֶלְיָשִׁ֔יב וְ/עַד תַּכְלִ֖ית בֵּ֥ית אֶלְיָשִֽׁיב־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/021.yaml
  text: After him[a], Meremoth son of Uriah, son of Hakkoz, repaired another section, from the entrance of the house of Eliashib to the end of the house of Eliashib.
translation:
  language: te
  text: అతని తరువాత, హక్కోజు కుమారుడైన ఊరియా కుమారుడు మెరేమోతు ఎల్యాషీబు ఇంటి ప్రవేశద్వారం నుండి ఎల్యాషీబు ఇంటి చివరి వరకు మరొక భాగాన్ని[a] బాగుచేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “రెండవ భాగాన్ని.” హీబ్రూ పదబంధం మెరేమోతుకు అప్పగించబడిన అదనపు భాగాన్ని సూచించవచ్చు; మరింత అక్షరార్థంగా “రెండవ కొలత/పొడవు” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרָיו
  choice: అతని తరువాత
  rationale: నెహెమ్యా 3లోని పనుల వరుసను సూచించే సహజమైన తెలుగు ప్రయోగం; కేవలం స్థలపరమైన పక్కన ఉండటాన్ని మాత్రమే సూచించదు.
- source_word: הֶחֱזִיק
  choice: బాగుచేశాడు
  rationale: మూల క్రియకు ‘బలపరచడం’ అనే ప్రాథమిక భావం ఉన్నప్పటికీ, ఈ అధ్యాయంలోని గోడ నిర్మాణ సందర్భంలో మరమ్మతు పనిని సూచిస్తుంది.
- source_word: מְרֵמוֹת בֶּן אוּרִיָּה בֶּן הַקּוֹץ
  choice: ఊరియా కుమారుడూ హక్కోజు మనవడూ అయిన మెరేమోతు
  rationale: హీబ్రూ వంశావళి సంబంధాన్ని సహజమైన తెలుగులో స్పష్టంగా వ్యక్తం చేస్తూ వ్యక్తుల పేర్లను లిప్యంతరీకరించింది.
- source_word: מִדָּה שֵׁנִית
  choice: మరొక భాగాన్ని
  rationale: మెరేమోతు ఇంతకుముందు చేసిన పనికి అదనంగా అప్పగించబడిన మరో పొడవైన భాగమనే సందర్భార్థాన్ని సహజంగా తెలియజేస్తుంది; ‘రెండవ కొలత/భాగం’ అనే రూపసంబంధ అర్థాన్ని పాదసూచికలో నిలుపుతుంది.
- source_word: מִפֶּתַח בֵּית אֶלְיָשִׁיב
  choice: ఎల్యాషీబు ఇంటి ప్రవేశద్వారం మొదలుకొని
  rationale: פֶּתַח అనే పదంలోని ప్రవేశం లేదా ద్వారం భావాన్ని, మరమ్మతు పరిధి ఆరంభ బిందువుతో సహా సహజంగా అందిస్తుంది.
- source_word: וְעַד תַּכְלִית בֵּית אֶלְיָשִׁיב
  choice: ఎల్యాషీబు ఇంటి చివరి వరకు
  rationale: תַּכְלִית ఇక్కడ పూర్తిచేయడం అనే అమూర్త భావం కాకుండా స్థలపరమైన చివర లేదా సరిహద్దును సూచిస్తుంది.
