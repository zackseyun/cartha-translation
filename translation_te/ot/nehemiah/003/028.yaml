translation:
  language: te
  text: గుర్రాల ద్వారానికి ఎగువన యాజకులు మరమ్మతులు చేశారు; ప్రతి ఒక్కరూ తమ తమ ఇంటికి ఎదురుగా చేశారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מֵעַל
  choice: పైభాగంలో
  rationale: మునుపటి గోడపని జరిగిన భాగంతో పోలిస్తే ఉన్న స్థానాన్ని సూచిస్తుంది; నిర్మాణ జాబితా సందర్భంలో ‘పైభాగంలో’ సహజంగా ఉంది.
- source_word: שַׁעַר הַסּוּסִים
  choice: గుర్రాల ద్వారం
  rationale: హీబ్రూ సంబంధపదబంధాన్ని సహజమైన తెలుగులో అందిస్తూ, స్థలనామ భావాన్ని నిలుపుతుంది.
- source_word: הֶחֱזִיקוּ
  choice: మరమ్మతులు చేశారు … బాగుచేశారు
  rationale: నెహెమ్యా 3 సందర్భంలో ఈ క్రియ గోడ లేదా ద్వార భాగాన్ని మరమ్మతు చేసే పనిని చేపట్టడాన్ని సూచిస్తుంది. రెండవ క్రియ తెలుగులో ప్రతి యాజకునికి సంబంధించిన వాక్యభాగాన్ని సహజంగా పూర్తి చేస్తుంది.
- source_word: הַכֹּהֲנִים
  choice: యాజకులు
  rationale: నిర్దిష్ట బహువచన నామవాచకానికి సూటిగా, ప్రస్తుత ప్రామాణిక తెలుగులో సరిపోయే అనువాదం.
- source_word: אִישׁ
  choice: ప్రతి ఒక్కరూ
  rationale: ఏకవచన పుంలింగ రూపం ఇక్కడ సమూహంలోని వ్యక్తులను విడివిడిగా సూచించే పంపిణీ భావంలో ఉంది.
- source_word: לְנֶגֶד
  choice: ఎదురుగా
  rationale: ఇల్లు ఎదుట లేదా దానికి నేరుగా ఎదురుగా ఉన్న గోడభాగాన్ని సూచించే స్థానిక భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בֵּיתוֹ
  choice: తమ తమ ఇంటికి
  rationale: אִישׁ యొక్క పంపిణీ భావంతో కలిసి ప్రతి యాజకుని సొంత ఇంటిని సూచిస్తుంది; ‘తమ తమ’ తెలుగులో ఈ భావాన్ని స్పష్టంగా ఇస్తుంది.
