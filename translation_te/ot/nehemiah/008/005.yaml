id: NEH.8.5
reference: Nehemiah 8:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּפְתַּ֨ח עֶזְרָ֤א הַ/סֵּ֨פֶר֙ לְ/עֵינֵ֣י כָל הָ/עָ֔ם כִּֽי מֵ/עַ֥ל כָּל הָ/עָ֖ם הָיָ֑ה וּ/כְ/פִתְח֖/וֹ עָֽמְד֥וּ כָל הָ/עָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/005.yaml
  text: Ezra opened the book in the sight of all the people[a], for he was above all the people; and when he opened it, all the people stood.
translation:
  language: te
  text: ఎజ్రా ప్రజలందరి కళ్లముందు గ్రంథాన్ని[a] తెరిచాడు. అతడు ప్రజలందరికంటే ఎత్తైన స్థలంలో ఉన్నాడు. అతడు దాన్ని తెరిచినప్పుడు ప్రజలందరూ నిలబడ్డారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘చుట్ట.’ హీబ్రూ పదం סֵפֶר చుట్ట రూపంలో ఉన్న వ్రాతపత్రాన్ని కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְתַּח
  choice: తెరిచాడు
  rationale: పָּתַח అనే క్రియకు నేరుగా ‘తెరవడం’ అనే అర్థం ఉంది. ప్రాచీన గ్రంథం చుట్ట రూపంలో ఉన్నప్పటికీ, ‘విప్పాడు’ అని ప్రత్యేకంగా చెప్పకుండా మూలంలోని సాధారణ క్రియను నిలుపుతుంది.
- source_word: הַסֵּפֶר
  choice: గ్రంథాన్ని
  rationale: סֵפֶר అనేది వ్రాతపత్రం, గ్రంథం లేదా గ్రంథపు చుట్టను సూచించవచ్చు. సందర్భంలో ధర్మశాస్త్ర గ్రంథాన్ని సూచిస్తున్నందున ‘గ్రంథం’ సహజంగా, గౌరవప్రదంగా ఉంది; భౌతిక రూపమైన ‘చుట్ట’ను పాదసూచికలో ఉంచాం.
- source_word: לְעֵינֵי
  choice: కళ్లముందు
  rationale: అక్షరార్థంగా ‘కళ్లకు/కళ్ల ఎదుట’ అనే భావాన్ని ఇస్తుంది. ‘కళ్లముందు’ ప్రజలందరికీ కనిపించేలా జరిగిన బహిరంగ చర్యను సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: כָל הָעָם
  choice: ప్రజలందరూ / ప్రజలందరి
  rationale: עָם ఇక్కడ సమకూడిన ప్రజలను సూచిస్తుంది. మూలంలోని పునరుక్తి, సమగ్రత రెండింటినీ ఈ రూపాలు నిలుపుతాయి.
- source_word: כִּי מֵעַל כָּל הָעָם הָיָה
  choice: అతడు ప్రజలందరికంటే ఎత్తైన స్థలంలో ఉన్నాడు
  rationale: מֵעַל ఇక్కడ సామాజిక ఆధిక్యాన్ని కాక భౌతికంగా పై స్థాయిలో ఉండడాన్ని సూచిస్తుంది. ‘ఎత్తైన స్థలంలో’ అని చెప్పడం ఆ భావాన్ని అపార్థం లేకుండా సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וּכְפִתְחוֹ
  choice: అతడు దాన్ని తెరిచినప్పుడు
  rationale: כְּ ఉపసర్గ ఇక్కడ కాలసంబంధమైన ‘తెరిచినప్పుడు/తెరుస్తుండగా’ భావాన్ని ఇస్తుంది. ‘దాన్ని’ అనే కర్మ ముందున్న గ్రంథం నుంచి సహజంగా గ్రహించబడుతుంది.
- source_word: עָמְדוּ
  choice: లేచి నిలబడ్డారు
  rationale: עָמַד అంటే ‘నిలబడడం’; ఈ సందర్భంలో ప్రజలు కూర్చున్న లేదా తమ స్థానాల్లో ఉన్న స్థితి నుంచి నిలబడిన చర్యను సహజమైన తెలుగులో ‘లేచి నిలబడ్డారు’ స్పష్టంగా తెలియజేస్తుంది.
