  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన వచనం. మూలంలోని ‘ప్రజలందరూ’ అనే పునరుక్తిని ఉద్దేశపూర్వకంగా నిలిపి, భౌతిక ఎత్తును సామాజిక ఆధిక్యంగా అపార్థం చేసుకోకుండా స్పష్టం చేశాం.
