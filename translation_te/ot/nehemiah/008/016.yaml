source:
  edition: WLC
  text: וַ/יֵּצְא֣וּ הָ/עָם֮ וַ/יָּבִיאוּ֒ וַ/יַּעֲשׂוּ֩ לָ/הֶ֨ם סֻכּ֜וֹת אִ֤ישׁ עַל גַּגּ/וֹ֙ וּ/בְ/חַצְרֹ֣תֵי/הֶ֔ם וּ/בְ/חַצְר֖וֹת בֵּ֣ית הָ/אֱלֹהִ֑ים וּ/בִ/רְחוֹב֙ שַׁ֣עַר הַ/מַּ֔יִם וּ/בִ/רְח֖וֹב שַׁ֥עַר אֶפְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/016.yaml
  text: So the people went out and brought them[a], and made booths for themselves, each on his roof, and in their courtyards, and in the courtyards of the house of God, and in the square of the Water Gate[b], and in the square of the Gate of Ephraim.
translation:
  language: te
  text: అప్పుడు ప్రజలు బయలుదేరి, వాటిని తీసుకొచ్చి, తమ కోసం పర్ణశాలలు[a] నిర్మించుకున్నారు—తమ తమ ఇళ్ల మిద్దెలపై, తమ ఆవరణల్లో, దేవుని మందిరపు ఆవరణల్లో, నీటి ద్వారం దగ్గర ఉన్న బహిరంగ కూడలిలో[b], ఎఫ్రాయిము ద్వారం దగ్గర ఉన్న బహిరంగ కూడలిలో.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘తాత్కాలిక ఆశ్రయాలు.’ ‘పర్ణశాలలు’ అనే పదం పర్ణశాలల పండుగతో ఉన్న సంబంధాన్ని కాపాడుతుంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ పదం ద్వారం సమీపంలో ఉండే విశాలమైన బహిరంగ ప్రజా ప్రదేశాన్ని సూచిస్తుంది; సంప్రదాయంగా ‘విశాల స్థలం’ అని అనువదిస్తారు.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּצְאוּ הָעָם וַיָּבִיאוּ
  choice: ప్రజలు బయలుదేరి వెళ్లి, వాటిని తీసుకొచ్చారు
  rationale: יצא యొక్క క్రమవర్ణన భావాన్ని సహజమైన తెలుగులో ‘బయలుదేరి వెళ్లి’ అని వ్యక్తం చేసింది. בוא హిఫీల్‌కు ‘తీసుకొచ్చారు’ సరిపోతుంది; ‘వాటిని’ అనేది ముందరి వచనంలో పేర్కొన్న కొమ్మలు, ఆకులను సూచించే అంతర్లీన కర్మ.
- source_word: וַיַּעֲשׂוּ לָהֶם סֻכּוֹת
  choice: వారు తమ కోసం పర్ణశాలలు నిర్మించుకున్నారు
  rationale: לָהֶם లోని స్వప్రయోజన భావాన్ని ‘తమ కోసం’ తెలియజేస్తుంది. סֻכּוֹת కు ‘పర్ణశాలలు’ అని అనువదించడం తాత్కాలిక నివాస నిర్మాణాల భావంతోపాటు పర్ణశాలల పండుగతో ఉన్న పదసంబంధాన్ని కాపాడుతుంది.
- source_word: אִישׁ עַל גַּגּוֹ
  choice: తమ తమ ఇంటి మిద్దెల మీద
  rationale: אִישׁ ఇక్కడ విభాజకంగా ‘ఒక్కొక్కరు’ అనే భావం ఇస్తుంది; ‘తమ తమ’ దానిని సహజ తెలుగులో చూపుతుంది. ప్రాచీన ఇళ్ల సమతల పైకప్పును ‘మిద్దె’ స్పష్టంగా సూచిస్తుంది.
- source_word: וּבְחַצְרֹתֵיהֶם
  choice: తమ ఆవరణల్లో
  rationale: חָצֵר అంటే చుట్టూ హద్దులున్న ఆవరణ లేదా ప్రాంగణం; గృహాల సందర్భంలో ‘ఆవరణలు’ సహజంగా ఉంటుంది.
- source_word: וּבְחַצְרוֹת בֵּית הָאֱלֹהִים
  choice: దేవుని మందిర ఆవరణల్లో
  rationale: בֵּית הָאֱלֹהִים ను పదశః ‘దేవుని ఇల్లు’ అనవచ్చు; సందర్భం ఆలయ సముదాయాన్ని సూచిస్తున్నందున ‘దేవుని మందిరం’ ఆధునిక పాఠకునికి స్పష్టంగా ఉంటుంది, బహువచన חַצְרוֹת ను ‘ఆవరణల్లో’ నిలుపుకుంది.
- source_word: וּבִרְחוֹב
  choice: బహిరంగ కూడలిలో
  rationale: רְחוֹב ద్వారం సమీపంలోని విశాలమైన ప్రజా ప్రదేశం లేదా కూడలిని సూచిస్తుంది. ‘బహిరంగ కూడలి’ ఆ స్థల స్వభావాన్ని సాధారణ ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: שַׁעַר הַמַּיִם
  choice: నీటి ద్వారం
  rationale: పేరుగల నగర ద్వారాన్ని సూచించే హీబ్రూ నిర్మాణాన్ని స్పష్టంగా, సంక్షిప్తంగా అనువదించింది.
- source_word: שַׁעַר אֶפְרָיִם
  choice: ఎఫ్రాయిము ద్వారం
  rationale: స్థలనామంలోని హీబ్రూ సంబంధ నిర్మాణాన్ని తెలుగులో సహజమైన పేరురూపంగా అందించింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే కథన శైలి వాడబడింది. హీబ్రూ వాక్యంలో ఉన్న స్థలాల వరుసను కాపాడుతూ, చివర ‘వాటిని నిర్మించారు’ అని చేర్చి తెలుగులో ఆ జాబితా వ్యాకరణపరంగా స్పష్టంగా ఉండేలా చేసింది.
