source:
  edition: WLC
  text: וְ/יֵשׁ֡וּעַ וּ/בָנִ֡י וְ/שֵׁרֵ֥בְיָ֣ה יָמִ֡ין עַקּ֡וּב שַׁבְּתַ֣י הֽוֹדִיָּ֡ה מַעֲשֵׂיָ֡ה קְלִיטָ֣א עֲזַרְיָה֩ יוֹזָבָ֨ד חָנָ֤ן פְּלָאיָה֙ וְ/הַ/לְוִיִּ֔ם מְבִינִ֥ים אֶת הָ/עָ֖ם לַ/תּוֹרָ֑ה וְ/הָ/עָ֖ם עַל עָמְדָֽ/ם׀׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/007.yaml
  text: And Jeshua[a], Bani, Sherebiah, Jamin, Akkub, Shabbethai, Hodiah, Maaseiah, Kelita, Azariah, Jozabad, Hanan[b], Pelaiah, and the Levites explained the law to the people, while the people remained in their places.
translation:
  language: te
  text: యేషూవా, బానీ, షేరెబ్యా, యామీను, అక్కూబు, షబ్బెతై, హోదీయా, మయశేయా, కెలీటా, అజర్యా, యోజాబాదు, హానాను, పెలాయా, ఇంకా లేవీయులు ధర్మశాస్త్రాన్ని ప్రజలకు అర్థమయ్యేలా వివరించారు; ప్రజలు తమ తమ స్థానాల్లోనే ఉన్నారు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: లేదా, “ప్రజలు తమ తమ స్థానాల్లో నిలబడి ఉన్నారు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/יֵשׁוּעַ ... פְּלָאיָה
  choice: యేషూవ ... పెలాయా
  rationale: వ్యక్తుల పేర్లను అనువదించకుండా, హీబ్రూ ఉచ్చారణకు దగ్గరగా ఆధునిక తెలుగు లిపిలో లిప్యంతరీకరించాం.
- source_word: וְהַלְוִיִּם
  choice: ఇంకా లేవీయులు
  rationale: జాబితాలోని వారు లేవీయులేనా, లేక వారి తరువాత మరొక విస్తృత సమూహాన్ని సూచిస్తున్నారా అన్నది హీబ్రూలో పూర్తిగా స్పష్టం కాదు. అందువల్ల అన్వయాన్ని బలవంతంగా నిర్ణయించకుండా సంధాన నిర్మాణాన్ని నిలిపాం.
- source_word: מְבִינִים אֶת־הָעָם לַתּוֹרָה
  choice: ధర్మశాస్త్రాన్ని ప్రజలకు అర్థమయ్యేలా వివరించారు
  rationale: בין హిఫీల్ రూపం ‘అర్థమయ్యేలా చేయడం’ అనే కారణార్థాన్ని సూచిస్తుంది. ‘అర్థమయ్యేలా వివరించారు’ అనేది ఆ భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: לַתּוֹרָה
  choice: ధర్మశాస్త్రాన్ని
  rationale: ఈ సందర్భంలో תּוֹרָה ప్రజల ఎదుట చదివిన దేవుని ధర్మశాస్త్రాన్ని సూచిస్తుంది. సాధారణ తెలుగు బైబిలు పాఠకులకు ‘ధర్మశాస్త్రం’ సుపరిచితమైన, సందర్భోచితమైన పదం.
- source_word: וְהָעָם עַל עָמְדָם
  choice: అప్పుడు ప్రజలు తమ తమ స్థానాల్లోనే ఉన్నారు
  rationale: హీబ్రూ పదబంధం ప్రజలు తమ నిలిచిన స్థలాల్లోనే కొనసాగినట్టు సూచిస్తుంది. ‘తమ తమ స్థానాల్లోనే ఉన్నారు’ సహజంగా ఉండి, వారు నిలబడి ఉన్నారనే సాధ్యమైన అర్థాన్ని పాదటిప్పణిలో నిలుపుతుంది.
