id: NEH.8.2
reference: Nehemiah 8:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּבִ֣יא עֶזְרָ֣א הַ֠/כֹּהֵן אֶֽת הַ/תּוֹרָ֞ה לִ/פְנֵ֤י הַ/קָּהָל֙ מֵ/אִ֣ישׁ וְ/עַד אִשָּׁ֔ה וְ/כֹ֖ל מֵבִ֣ין לִ/שְׁמֹ֑עַ בְּ/י֥וֹם אֶחָ֖ד לַ/חֹ֥דֶשׁ הַ/שְּׁבִיעִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/002.yaml
  text: Then Ezra the priest brought the law before the assembly[a], both men and women, and all who could understand what they heard[b], on the first day of the seventh month.
translation:
  language: te
  text: అప్పుడు యాజకుడైన ఎజ్రా, పురుషుల నుండి స్త్రీల వరకు, విని అర్థం చేసుకోగల వారందరూ ఉన్న సభ సమక్షంలో ధర్మశాస్త్రాన్ని తీసుకొచ్చాడు. ఇది ఏడవ నెల మొదటి రోజున జరిగింది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבִיא
  choice: అప్పుడు ... తీసుకొచ్చాడు
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది; ‘అప్పుడు’ సహజమైన తెలుగు కథన క్రమాన్ని తెలియజేస్తుంది.
- source_word: הַכֹּהֵן
  choice: యాజకుడైన
  rationale: ఎజ్రా పాత్రను తెలిపే మూలపాఠంలోని బిరుదును స్పష్టంగా నిలుపుతుంది.
- source_word: הַתּוֹרָה
  choice: ధర్మశాస్త్రం
  rationale: ఈ సందర్భంలో ప్రజల ముందు చదవబడుతున్న మోషే ధర్మశాస్త్రాన్ని సూచిస్తుంది; ఆధునిక తెలుగు బైబిలు వాడుకలో ఇది స్పష్టమైన, గౌరవప్రదమైన పదం.
- source_word: לִפְנֵי הַקָּהָל
  choice: సభ ముందుకు
  rationale: ప్రజలు సమకూడిన బహిరంగ, అధికారిక సందర్భాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: מֵאִישׁ וְעַד אִשָּׁה
  choice: పురుషులు, స్త్రీలు
  rationale: హీబ్రూ ‘పురుషుని నుండి స్త్రీ వరకు’ అనే సంపూర్ణ పరిధిని తెలుగులో సహజంగా, లింగ సూచనను నిలుపుతూ తెలియజేస్తుంది.
- source_word: וְכֹל מֵבִין לִשְׁמֹעַ
  choice: విని అర్థం చేసుకోగల వారందరూ
  rationale: కేవలం వినగలగడం కాక, చదివినదాన్ని విని గ్రహించగల సామర్థ్యాన్ని సూచించే హీబ్రూ భావాన్ని నిలుపుతుంది.
- source_word: בְּיוֹם אֶחָד לַחֹדֶשׁ הַשְּׁבִיעִי
  choice: ఏడవ నెల మొదటి రోజున
  rationale: హీబ్రూ తేదీ సూత్రానికి సహజమైన ఆధునిక తెలుగు రూపం.
theological_decisions:
- issue: సభలోని లింగపరమైన పరిధి
  choice: పురుషులు, స్త్రీలు
  alternative: పురుషుని నుండి స్త్రీ వరకు
  rationale: మూలంలోని రెండు లింగ సూచనలను స్పష్టంగా నిలుపుతూ, అక్షరానువాదంలోని అసహజతను నివారించి, సభలో వారి సంపూర్ణ సమాహారాన్ని తెలియజేస్తుంది.
- issue: תּוֹרָה పదం అనువాదం
  choice: ధర్మశాస్త్రం
  alternative: తోరా / ఉపదేశం
  rationale: తక్షణ సందర్భంలో మోషే ధర్మశాస్త్రపు బహిరంగ పఠనమే ఉద్దేశం; ‘ధర్మశాస్త్రం’ ఆ ఒడంబడిక సంబంధిత భావభారాన్ని, సాధారణ పాఠకునికి స్పష్టతను రెండింటినీ నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన వాక్య విభజనతో, గౌరవప్రదమైన బైబిలు శైలిని పాటించాం. హీబ్రూ వాక్యంలోని సభ పరిధి మరియు వినడం ద్వారా గ్రహించే సామర్థ్యం రెండూ స్పష్టంగా నిలుపబడ్డాయి.
