reference: Nehemiah 8:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר לָ/הֶ֡ם לְכוּ֩ אִכְל֨וּ מַשְׁמַנִּ֜ים וּ/שְׁת֣וּ מַֽמְתַקִּ֗ים וְ/שִׁלְח֤וּ מָנוֹת֙ לְ/אֵ֣ין נָכ֣וֹן ל֔/וֹ כִּֽי קָד֥וֹשׁ הַ/יּ֖וֹם לַ/אֲדֹנֵ֑י/נוּ וְ/אַל תֵּ֣עָצֵ֔בוּ כִּֽי חֶדְוַ֥ת יְהוָ֖ה הִ֥יא מָֽעֻזְּ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/010.yaml
  text: Then he said to them[a], “Go, eat rich food and drink sweet drinks, and send portions to anyone for whom nothing is prepared, for this day is holy to our Lord. And do not be grieved[c][b], for the joy of Yahweh is your stronghold.”
translation:
  language: te
  text: 'అప్పుడు అతడు వారితో ఇలా అన్నాడు: “వెళ్లి, సమృద్ధమైన వంటకాలు తిని, తీపి పానీయాలు తాగండి. ఎవరి కోసం ఏమీ సిద్ధం చేయబడలేదో వారికి ఆహార భాగాలు పంపండి.[a] ఎందుకంటే ఈ రోజు మన ప్రభువుకు పవిత్రమైనది. దుఃఖపడకండి; యెహోవా ఆనందమే[b] మీకు దుర్గం.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “ఎవరి కోసం ఏదీ సిద్ధంగా లేదో అతనికి.”
    reason: హీబ్రూ నిర్దిష్టతలేని ఏకవచన రూపాన్ని చూపించడానికి.
  - marker: b
    text: 'లేదా, “యెహోవాలో కలిగే ఆనందమే”; హీబ్రూ: “యెహోవా ఆనందం.”'
    reason: హీబ్రూ సమాసానికి సాధ్యమైన సంబంధార్థాన్ని తెలియజేస్తూ ప్రధాన పాఠంలోని అస్పష్టతను వివరించడానికి.
lexical_decisions:
- source_word: מַשְׁמַנִּים
  choice: కొవ్వైన వంటకాలు
  rationale: పదం అక్షరార్థంగా కొవ్వుతో కూడిన, సమృద్ధమైన పదార్థాలను సూచిస్తుంది; పండుగ విందుకు తగిన రుచికరమైన వంటకాల భావాన్ని ‘కొవ్వైన వంటకాలు’ సహజంగా నిలుపుతుంది.
- source_word: מַמְתַקִּים
  choice: తీపి పానీయాలు
  rationale: ‘తాగండి’ అనే క్రియతో కలిసి ఉన్నందున, విస్తృతమైన ‘తీపి పదార్థాలు’ అనే భావాన్ని సందర్భానుసారంగా పానీయాలుగా వ్యక్తం చేసింది; ప్రత్యేకంగా ద్రాక్షారసం అని సంకుచితం చేయలేదు.
- source_word: מָנוֹת
  choice: వంతులు
  rationale: విందులో ఇతరులకు పంచిపెట్టే ఆహార భాగాలను సూచించే సహజమైన తెలుగు పదం.
- source_word: לְאֵין נָכוֹן לוֹ
  choice: ఎవరి కోసం ఏమీ సిద్ధం చేయబడలేదో వారికి
  rationale: నָכוֹןలోని ‘సిద్ధం చేయబడినది/సిద్ధంగా ఉన్నది’ అనే భావాన్ని, హీబ్రూ నిర్దిష్టతలేని ఏకవచనాన్ని సహజమైన తెలుగు సామాన్య బహువచనంతో వ్యక్తం చేసింది.
- source_word: קָדוֹשׁ
  choice: పవిత్రమైనది
  rationale: దేవునికి ప్రత్యేకంగా ప్రతిష్ఠించబడిన దినాన్ని సూచించే ప్రామాణికమైన, గంభీరమైన పదం.
- source_word: לַאֲדֹנֵינוּ
  choice: మన ప్రభువుకు
  rationale: ఇక్కడ אֲדֹנֵינוּ దేవునికి ఉపయోగించిన గౌరవపూర్వక బిరుదు; ‘మన ప్రభువు’ దానిని సహజంగా ప్రతిబింబిస్తుంది.
- source_word: תֵּעָצֵבוּ
  choice: దుఃఖపడకండి
  rationale: వేదన చెందడం లేదా శోకించడం అనే భావాన్ని ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: חֶדְוַת יְהוָה
  choice: యెహోవా ఆనందం
  rationale: హీబ్రూ సమాసంలోని ఉద్దేశపూర్వక అస్పష్టతను కాపాడుతుంది; ‘యెహోవాలో ఆనందం’ అని ప్రధాన పాఠంలో వ్యాఖ్యానాత్మకంగా పరిష్కరించదు.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో స్థిరపడిన లిప్యంతరీకరణతో వ్యక్తం చేసింది.
- source_word: מָעֻזְּכֶם
  choice: మీకు దుర్గం
  rationale: కేవలం ‘బలం’ అని సమతలీకరించకుండా, రక్షణనిచ్చే కోట లేదా బలమైన ఆశ్రయం అనే స్పష్టమైన రూపకాన్ని నిలుపుతుంది.
theological_decisions:
- issue: חֶדְוַת יְהוָה యొక్క సంబంధార్థం
  choice: యెహోవా ఆనందం
  alternative: యెహోవాలో కలిగే ఆనందం; యెహోవా సంతోషం
  rationale: హీబ్రూ నిర్మాణం ఆనందానికి యెహోవాతో ఉన్న సంబంధాన్ని పేర్కొంటుంది గాని అది యెహోవా కలిగించే ఆనందమా, ఆయనలో కలిగే ఆనందమా, లేక ఆయన స్వీయ ఆనందమా అనేది పూర్తిగా నిర్దేశించదు. ప్రధాన పాఠం ఈ ఉద్రిక్తతను నిలుపుతుంది.
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: మూలంలోని వ్యక్తిగత దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో విస్తృతంగా గుర్తించదగిన రూపంలో ఉంచింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యేలా గంభీరమైన వాక్యనిర్మాణం వాడబడింది. ఆజ్ఞలకు గౌరవపూర్వక బహువచనం ఉపయోగించబడింది. విందు, పవిత్ర దినం, దుర్గం అనే మూల చిత్రాలు సాధ్యమైనంతవరకు నిలుపబడ్డాయి.
