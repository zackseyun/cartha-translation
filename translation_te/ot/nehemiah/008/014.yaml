id: NEH.8.14
reference: Nehemiah 8:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַֽ/יִּמְצְא֖וּ כָּת֣וּב בַּ/תּוֹרָ֑ה אֲשֶׁ֨ר צִוָּ֤ה יְהוָה֙ בְּ/יַד מֹשֶׁ֔ה אֲשֶׁר֩ יֵשְׁב֨וּ בְנֵֽי יִשְׂרָאֵ֧ל בַּ/סֻּכּ֛וֹת בֶּ/חָ֖ג בַּ/חֹ֥דֶשׁ הַ/שְּׁבִיעִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/014.yaml
  text: And they found it written in the Law that Yahweh had commanded through Moses that the sons of Israel should dwell in booths during the feast[a], in the seventh month.
translation:
  language: te
  text: ఇశ్రాయేలు కుమారులు[a] ఏడవ నెలలో పండుగ సమయంలో పర్ణశాలల్లో నివసించాలని యెహోవా మోషే ద్వారా ఆజ్ఞాపించినట్లు ధర్మశాస్త్రంలో వ్రాయబడి ఉండడాన్ని వారు కనుగొన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఇశ్రాయేలీయులు” లేదా “ఇశ్రాయేలు సంతానం”; హీబ్రూలో అక్షరార్థంగా “ఇశ్రాయేలు కుమారులు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְצְאוּ כָּתוּב
  choice: వ్రాయబడి ఉండడం వారు కనుగొన్నారు
  rationale: מצאతో కూడిన כתוב అనే విధేయ కృదంత నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతూ, గతంలో వ్రాయబడిన ఆజ్ఞను వారు కనుగొన్నారనే భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: בַּתּוֹרָה
  choice: ధర్మశాస్త్రంలో
  rationale: ఇక్కడ תּוֹרָה మోషే ద్వారా ఇవ్వబడిన లిఖిత నియమావళిని సూచిస్తుంది; తెలుగు బైబిల్ వాడుకలో ‘ధర్మశాస్త్రం’ స్పష్టమైన, గౌరవప్రదమైన పదం.
- source_word: צִוָּה יְהוָה
  choice: యెహోవా ... ఆజ్ఞాపించిన
  rationale: దైవనామాన్ని వ్యక్తినామంగా ‘యెహోవా’ అని ఉంచి, ఆజ్ఞ ముందే ఇవ్వబడిందనే సందర్భాన్ని సంబంధవాచక నిర్మాణం సహజంగా తెలియజేస్తుంది.
- source_word: בְּיַד מֹשֶׁה
  choice: మోషే ద్వారా
  rationale: ‘మోషే చేతి ద్వారా’ అనే హీబ్రూ నుడికారంలోని మధ్యవర్తిత్వం/కారకత్వ భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: יֵשְׁבוּ
  choice: నివసించాలని
  rationale: పండుగ కాలంలో తాత్కాలిక నివాసాల్లో ఉండాలనే ఆజ్ఞార్థక భావాన్ని తెలుపుతుంది.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: హీబ్రూ పదబంధంలోని ‘కుమారులు’ అనే రూపాన్ని ప్రధాన పాఠ్యంలో నిలిపి, దాని సమూహార్థాన్ని పాదటిప్పణిలో స్పష్టం చేసింది.
- source_word: בַּסֻּכּוֹת
  choice: పర్ణశాలల్లో
  rationale: సֻכּוֹת సూచించే కొమ్మలు, ఆకులతో నిర్మించిన తాత్కాలిక పండుగ నివాసాలకు ‘పర్ణశాలలు’ ఖచ్చితమైన, స్థిరపడిన తెలుగు పదం.
- source_word: בֶּחָג
  choice: పండుగ సమయంలో
  rationale: నిర్దిష్టంగా తెలిసిన పండుగ కాలాన్ని సూచించే హీబ్రూ పదబంధాన్ని సహజంగా అందిస్తుంది.
- source_word: בַּחֹדֶשׁ הַשְּׁבִיעִי
  choice: ఏడవ నెలలో
  rationale: హీబ్రూ కాలసూచక పదబంధానికి నేరమైన అనువాదం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యెహోవా
  alternative: ప్రభువు; యాహ్వే
  rationale: మూలపాఠంలోని ఒడంబడిక నామాన్ని బిరుదుగా మార్చకుండా వ్యక్తినామంగా నిలుపుతుంది; ఆధునిక తెలుగు బైబిల్ పాఠకులకు ‘యెహోవా’ సుపరిచితం.
- issue: בְנֵי יִשְׂרָאֵל యొక్క పరిధి
  choice: ప్రధాన పాఠ్యంలో ‘ఇశ్రాయేలు కుమారులు’; పాదటిప్పణిలో సమూహార్థం
  alternative: ఇశ్రాయేలీయులు; ఇశ్రాయేలు సంతానం
  rationale: మూలంలోని లింగరూపాన్ని చెరపకుండా ఉంచుతూనే, సందర్భంలో ఇది ఇశ్రాయేలు ప్రజలను సమష్టిగా సూచించగలదనే భావాన్ని పాఠకుడికి తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. హీబ్రూ వాక్యనిర్మాణాన్ని యథాశక్తి నిలుపుతూ, తెలుగులో అసహజమైన పదక్రమాన్ని నివారించాం. పాదటిప్పణి సూచిక [a] ప్రధాన పాఠ్యంలో చేర్చబడింది.
