source:
  edition: WLC
  text: וְ/הַ/לְוִיִּ֞ם מַחְשִׁ֤ים לְ/כָל הָ/עָם֙ לֵ/אמֹ֣ר הַ֔סּוּ כִּ֥י הַ/יּ֖וֹם קָדֹ֑שׁ וְ/אַל תֵּעָצֵֽבוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/011.yaml
  text: And the Levites were quieting all the people[a], saying, “Be still, for the day is holy[b]; do not be grieved.”
translation:
  language: te
  text: 'లేవీయులు ప్రజలందరినీ నిశ్శబ్దంగా ఉండమని చెబుతూ[a] ఇలా అన్నారు: “నిశ్శబ్దంగా ఉండండి, ఎందుకంటే ఈ రోజు పవిత్రమైనది; దుఃఖించవద్దు[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ప్రజలందరినీ ఊరడిస్తూ” లేదా “నిశ్శబ్దపరుస్తూ.”
    reason: lexical_alternative
  - marker: b
    text: లేదా “విచారించవద్దు” లేదా “శోకించవద్దు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַלְוִיִּם
  choice: లేవీయులు
  rationale: ఆలయ సంబంధమైన సేవలు నిర్వహించే వర్గానికి తెలుగులో స్థిరపడిన ప్రామాణిక నామరూపం.
- source_word: מַחְשִׁים
  choice: నిశ్శబ్దంగా ఉండమని చెబుతూ
  rationale: వర్తమాన కృదంతం సూచించే కొనసాగుతున్న చర్యను, ప్రజలను మౌనంగా చేయడానికి లేవీయులు ప్రయత్నిస్తున్న భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: לְכָל הָעָם
  choice: ప్రజలందరినీ
  rationale: సమకూడిన ప్రజాసమూహమంతటినీ సూచించే כָל הָעָם భావాన్ని సహజంగా అందిస్తుంది.
- source_word: לֵאמֹר
  choice: అంటూ / చెబుతూ
  rationale: ప్రత్యక్ష వాక్యాన్ని పరిచయం చేసే హెబ్రీయ భాషా నిర్మాణాన్ని తెలుగు వాక్యప్రవాహంలో సహజంగా కలుపుతుంది.
- source_word: הַסּוּ
  choice: ఊరుకోండి
  rationale: శబ్దం లేదా విలాపం ఆపి నిశ్శబ్దంగా ఉండాలనే బహువచన ఆజ్ఞను ప్రస్తుత ప్రామాణిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: כִּי הַיּוֹם קָדֹשׁ
  choice: ఎందుకంటే ఈ రోజు పవిత్రమైనది
  rationale: כִּי ఇచ్చే కారణసంబంధాన్ని స్పష్టంగా ఉంచి, הַיּוֹם ను సందర్భానుసారంగా ‘ఈ రోజు’ అని, קָדֹשׁ యొక్క ధార్మిక బరువును ‘పవిత్రమైనది’ అని అందిస్తుంది.
- source_word: וְאַל תֵּעָצֵבוּ
  choice: దుఃఖించవద్దు
  rationale: עצב నిఫాల్ రూపంలోని విచారం, మనోవేదన భావాన్ని కర్మకాండ సంబంధమైన శోకానికి మాత్రమే పరిమితం చేయకుండా తెలియజేస్తుంది.
theological_decisions:
- issue: సామూహిక ఆరాధన సందర్భంలో קָדֹשׁ అనువాదం
  choice: పవిత్రమైనది
  alternative: పరిశుద్ధమైనది / పవిత్రంగా ప్రతిష్ఠించబడినది
  rationale: ఈ దినం దేవునికి ప్రత్యేకమైనదనే నిబంధనాత్మక, ధార్మిక భావాన్ని నిలుపుతూ సాధారణ ఆధునిక పాఠకులకు సహజంగా ఉంటుంది.
- issue: ప్రజల భావోద్వేగ స్పందనపై וְאַל תֵּעָצֵבוּ యొక్క పరిధి
  choice: దుఃఖించవద్దు
  alternative: విచారించవద్దు / శోకించవద్దు
  rationale: మూలపదంలోని దుఃఖం లేదా బాధ భావాన్ని నిలుపుతుంది; ‘శోకించవద్దు’ అనడం ద్వారా కర్మకాండ సంబంధమైన విలాపం మాత్రమే ఉద్దేశమని అతిగా నిర్దిష్టం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన బహువచన ఆజ్ఞారూపాలు, సహజమైన వాక్యప్రవాహం. ‘పవిత్రమైనది’ అనే పదం ధార్మిక గంభీరతను నిలుపుతుంది. ప్రధాన పాఠంలోని [a], [b] గుర్తులు సంబంధిత పాదటిప్పణులతో సరిపోతాయి.
