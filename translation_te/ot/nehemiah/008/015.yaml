  to: 'వారు తమ పట్టణాలన్నిటిలోను యెరూషలేములోను ఇలా ప్రకటించి ఈ సందేశాన్ని వ్యాపింపజేయాలి: “కొండప్రాంతానికి వెళ్లి, ఒలీవ చెట్ల, నూనె చెట్ల[a], గొంజి చెట్ల, ఖర్జూర చెట్ల, దట్టమైన ఆకులుగల చెట్ల కొమ్మలను[b] తీసుకురండి; రాసి ఉన్న ప్రకారం పర్ణశాలలు కట్టండి.”'
