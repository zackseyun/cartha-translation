source:
  edition: WLC
  text: וַ/אֲשֶׁ֣ר יַשְׁמִ֗יעוּ וְ/יַעֲבִ֨ירוּ ק֥וֹל בְּ/כָל עָרֵי/הֶם֮ וּ/בִ/ירוּשָׁלִַ֣ם לֵ/אמֹר֒ צְא֣וּ הָ/הָ֗ר וְ/הָבִ֨יאוּ֙ עֲלֵי זַ֨יִת֙ וַ/עֲלֵי עֵ֣ץ שֶׁ֔מֶן וַ/עֲלֵ֤י הֲדַס֙ וַ/עֲלֵ֣י תְמָרִ֔ים וַ/עֲלֵ֖י עֵ֣ץ עָבֹ֑ת לַ/עֲשֹׂ֥ת סֻכֹּ֖ת כַּ/כָּתֽוּב־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/015.yaml
  text: and that they should proclaim and spread the message through all their cities and in Jerusalem[a], saying, “Go out to the hill country and bring branches of olive, oil tree, myrtle, palm, and other leafy trees, to make booths[b], as it is written.”
translation:
  language: te
  text: 'వారు తమ పట్టణాలన్నిటిలోను యెరూషలేములోను ఇలా ప్రకటించి ఈ సందేశాన్ని వ్యాపింపజేయాలి: “కొండప్రాంతానికి వెళ్లి, ఒలీవ చెట్ల, నూనె చెట్ల[a], గొంజి చెట్ల, ఖర్జూర చెట్ల, దట్టమైన ఆకులుగల చెట్ల కొమ్మలను[b] తీసుకురండి; రాసి ఉన్న ప్రకారం పర్ణశాలలు కట్టండి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “నూనె చెట్టు” అని అనువదించిన హీబ్రూ పదం ఏ వృక్షజాతిని సూచిస్తుందో ఖచ్చితంగా తెలియదు; దీనిని “అడవి ఒలీవ చెట్టు” లేదా “ఒలియాస్టర్” అని కూడా అనువదిస్తారు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ వాక్యంలో అక్షరార్థంగా “ఒలీవ ఆకులు … గొంజి ఆకులు …” అని ఉంది. పర్ణశాలలు కట్టేందుకు తెచ్చినవి ఆకులతో కూడిన కొమ్మలు కాబట్టి ప్రధాన పాఠంలో “కొమ్మలు” అని అనువదించబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲשֶׁר
  choice: ధర్మశాస్త్రంలో ఇలా కూడా రాసి ఉందని
  rationale: ఈ పదబంధం 14వ వచనంలో ధర్మశాస్త్రంలో కనుగొన్న విషయాన్ని కొనసాగిస్తుంది. స్వతంత్రంగా చదివినప్పటికీ సంబంధం స్పష్టంగా ఉండేలా సందర్భాన్ని సంక్షిప్తంగా వ్యక్తం చేసింది.
- source_word: יַשְׁמִיעוּ וְיַעֲבִירוּ קוֹל
  choice: ప్రకటించి ... ఈ సందేశాన్ని వ్యాపింపజేయాలి
  rationale: హిఫిల్ రూపంలోని ‘వినిపించు’ మరియు ‘స్వరాన్ని వెళ్లజేయు’ అనే హీబ్రూ జాతీయాన్ని సహజమైన ఆధునిక తెలుగులో బహిరంగ ప్రకటనను విస్తరింపజేయడంగా అనువదించింది.
- source_word: בְּכָל עָרֵיהֶם וּבִירוּשָׁלַם
  choice: తమ పట్టణాలన్నిటిలోను యెరూషలేములోను
  rationale: עִיר పట్టణం లేదా నగరం కావచ్చు; విస్తృత నివాస ప్రాంతాలకు సహజంగా వర్తించే ‘పట్టణాలు’ ఎంచుకుంది.
- source_word: צְאוּ הָהָר
  choice: కొండప్రాంతానికి వెళ్లి
  rationale: הָהָר ఇక్కడ ఒకే కొండకన్నా ఆకులు, కొమ్మలు సేకరించే ఎత్తైన కొండప్రాంతాన్ని సూచించవచ్చు.
- source_word: עֲלֵי
  choice: కొమ్మలను
  rationale: అక్షరార్థం ‘ఆకులు’; అయితే పర్ణశాల నిర్మాణానికి తెచ్చే ఆకులతో కూడిన కొమ్మలే ఉద్దేశం. తెలుగులో సహజమైన నిర్మాణ పదార్థాన్ని సూచించడానికి ‘కొమ్మలు’ వాడింది; అక్షరార్థాన్ని పాదసూచికలో ఉంచింది.
- source_word: עֵץ שֶׁמֶן
  choice: నూనె చెట్లు
  rationale: అక్షరార్థానికి సమీపమైన ‘నూనె చెట్టు’ను ఉంచి, ఖచ్చితమైన వృక్షజాతి అనిశ్చితిని పాదసూచికలో తెలిపింది.
- source_word: הֲדַס
  choice: గొంజి చెట్లు
  rationale: మర్టిల్ వృక్షానికి తెలుగులో వాడుకలో ఉన్న పేరును ఎంచుకుంది.
- source_word: תְמָרִים
  choice: ఖర్జూర చెట్లు
  rationale: ఈ సందర్భంలో ఖర్జూరపు తాటి చెట్ల ఆకులతో కూడిన కొమ్మలను సూచిస్తుంది.
- source_word: עֵץ עָבֹת
  choice: దట్టమైన ఆకులుగల చెట్లు
  rationale: עָבֹת అనే విశేషణంలోని దట్టంగా అల్లుకున్న ఆకుల భావాన్ని నిర్దిష్టం కాని వృక్షవర్గంగానే నిలిపింది; ‘ఇతర’ అనే మూలంలో లేని పదాన్ని చేర్చలేదు.
- source_word: לַעֲשֹׂת סֻכֹּת
  choice: పర్ణశాలలు కట్టడానికి
  rationale: సుక్కోత్ పండుగలో ఉపయోగించే తాత్కాలిక ఆకుల నివాసాలను సహజంగా, పండుగ సంబంధాన్ని నిలిపే విధంగా సూచిస్తుంది.
- source_word: כַּכָּתוּב
  choice: రాసి ఉన్న ప్రకారం
  rationale: లిఖిత ధర్మశాస్త్రానికి అనుగుణంగా చేయాలనే భావాన్ని నేరుగా నిలిపింది.
