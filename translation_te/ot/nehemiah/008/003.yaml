id: NEH.8.3
reference: Nehemiah 8:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּקְרָא ב/וֹ֩ לִ/פְנֵ֨י הָ/רְח֜וֹב אֲשֶׁ֣ר לִ/פְנֵ֣י שַֽׁעַר הַ/מַּ֗יִם מִן הָ/אוֹר֙ עַד מַחֲצִ֣ית הַ/יּ֔וֹם נֶ֛גֶד הָ/אֲנָשִׁ֥ים וְ/הַ/נָּשִׁ֖ים וְ/הַ/מְּבִינִ֑ים וְ/אָזְנֵ֥י כָל הָ/עָ֖ם אֶל סֵ֥פֶר הַ/תּוֹרָֽה־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/003.yaml
  text: And he read from it before the square that was in front of the Water Gate[a], from daybreak until midday, in the presence of the men and the women and those who could understand[c][b]; and the ears of all the people were attentive to the Book of the Law.
translation:
  language: te
  text: అతడు నీటి ద్వారం ఎదుటనున్న బహిరంగ ప్రాంగణంలో, తెల్లవారినప్పటి[a] నుండి మధ్యాహ్నం వరకు, పురుషుల, స్త్రీల, అర్థం చేసుకోగలవారి[b] సమక్షంలో దానిలోనుండి చదివాడు. ప్రజలందరూ ధర్మశాస్త్ర గ్రంథం[c]ను శ్రద్ధగా విన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, ‘వేకువ నుండి.’ అక్షరార్థం: ‘వెలుగు నుండి.’'
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘అర్థం చేసుకొనేవారి.’ ఇది చదివినదాన్ని గ్రహించగల వయసున్న వారందరినీ సూచిస్తుండవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: ‘గ్రంథం’ అనే పదాన్ని ‘చుట్ట’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא בּוֹ
  choice: దానిలోనుండి చదివాడు
  rationale: ఈ సందర్భంలో קרא అనేది గ్రంథాన్ని బహిరంగంగా చదవడాన్ని సూచిస్తుంది. בּוֹ ను సహజమైన తెలుగులో ‘దానిలోనుండి’ అని ఇచ్చాం.
- source_word: לִפְנֵי הָרְחוֹב אֲשֶׁר לִפְנֵי שַׁעַר הַמַּיִם
  choice: నీటి ద్వారం ఎదుట ఉన్న ప్రాంగణం ముందు
  rationale: רְחוֹב అనేది బహిరంగ ప్రాంగణాన్ని సూచిస్తుంది; రెండు לִפְנֵי పదబంధాల స్థానసంబంధాన్ని తొలగించకుండా సహజంగా అనువదించాం.
- source_word: מִן הָאוֹר
  choice: తెల్లవారినప్పటి నుండి
  rationale: అక్షరార్థంగా ‘వెలుగు నుండి’; కాలసూచనగా ఇది తొలి వెలుగు లేదా తెల్లవారే సమయాన్ని సూచిస్తుంది.
- source_word: עַד מַחֲצִית הַיּוֹם
  choice: మధ్యాహ్నం వరకు
  rationale: ‘దినపు సగం వరకు’ అనే హీబ్రూ భావాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: נֶגֶד הָאֲנָשִׁים וְהַנָּשִׁים וְהַמְּבִינִים
  choice: పురుషుల, స్త్రీల, అర్థం చేసుకోగల వారందరి సమక్షంలో
  rationale: నిర్దిష్టంగా పేర్కొన్న పురుషులు, స్త్రీలు అనే రెండు వర్గాలతో పాటు, గ్రహించగల మూడవ వర్గాన్ని కూడా నిలుపుతుంది.
- source_word: וְאָזְנֵי כָל הָעָם אֶל
  choice: ప్రజలందరి చెవులు ... వైపే ఉన్నాయి
  rationale: ప్రజలు శ్రద్ధగా విన్నారనే భావంతోపాటు మూలంలోని సజీవమైన ‘చెవులు ... వైపు’ అనే రూపకాన్ని కూడా నిలుపుతుంది.
- source_word: סֵפֶר הַתּוֹרָה
  choice: ధర్మశాస్త్ర గ్రంథం
  rationale: סֵפֶר కు గ్రంథం లేదా చుట్ట అనే అర్థాలు సాధ్యమైనా, సాధారణ పాఠకులకు ‘గ్రంథం’ స్పష్టంగా ఉంటుంది. תּוֹרָה ఇక్కడ లిఖితపూర్వకమైన అధికారిక నిబంధన బోధను సూచిస్తుంది; సందర్భానుసారంగా ‘ధర్మశాస్త్రం’ ఎంచుకున్నాం.
theological_decisions:
- issue: ప్రజల సమక్షంలో చదివిన תּוֹרָה ను ఎలా అనువదించాలి
  choice: ధర్మశాస్త్రం
  alternative: ఉపదేశం; తోరా
  rationale: תּוֹרָה కు విస్తృతంగా ‘ఉపదేశం’ అనే భావం ఉన్నా, నెహెమ్యా 8లో బహిరంగంగా చదివిన అధికారిక లిఖిత నిబంధన గ్రంథాన్ని సూచిస్తుంది. ‘ధర్మశాస్త్రం’ ఈ సందర్భాన్ని స్పష్టంగా తెలియజేస్తుంది; ‘తోరా’ సాధారణ పాఠకులకు అంత పారదర్శకంగా ఉండకపోవచ్చు.
- issue: וְהַמְּבִינִים సూచించే వర్గం
  choice: అర్థం చేసుకోగల వారందరు
  alternative: వివేకం గలవారు
  rationale: ఈ కృదంతం కేవలం జ్ఞానులనే కాక, విన్నది గ్రహించగలవారిని—బహుశా అర్థం చేసుకునే వయసున్న పిల్లలను కూడా—సూచించగలదు. మూలంలోని విస్తృతతను అలాగే ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘చెవులు ... వైపే ఉన్నాయి’ అనే మూలభాషా చిత్రణను అర్థమయ్యే తెలుగులో నిలిపాం. అన్ని పాదసూచిక గుర్తులను వాటికి సంబంధించిన పదాల వెంట ఉంచాం.
