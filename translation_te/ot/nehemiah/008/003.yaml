  to: అతడు నీటి ద్వారం ఎదుటనున్న బహిరంగ ప్రాంగణంలో, తెల్లవారినప్పటి[a] నుండి మధ్యాహ్నం వరకు, పురుషుల, స్త్రీల, అర్థం చేసుకోగలవారి[b] సమక్షంలో దానిలోనుండి చదివాడు. ప్రజలందరూ ధర్మశాస్త్ర గ్రంథం[c]ను శ్రద్ధగా విన్నారు.
