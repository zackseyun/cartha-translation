  terminology: ‘దేవుని ధర్మశాస్త్ర గ్రంథం,’ ‘పండుగను ఆచరించారు,’ ‘గంభీరమైన సభ,’ ‘నియమం ప్రకారం’ అనే పదప్రయోగాలు మూలభాషార్థానికీ, గౌరవప్రదమైన గ్రంథశైలికీ సరిపోతాయి. చుట్టగ్రంథం అనే సాధ్యమైన అర్థాన్ని అడుగుటిప్పణిలో మాత్రమే ఉంచడం సముచితం.
