id: NEH.8.18
reference: Nehemiah 8:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ֠/יִּקְרָא בְּ/סֵ֨פֶר תּוֹרַ֤ת הָ/אֱלֹהִים֙ י֣וֹם בְּ/י֔וֹם מִן הַ/יּוֹם֙ הָֽ/רִאשׁ֔וֹן עַ֖ד הַ/יּ֣וֹם הָ/אַחֲר֑וֹן וַ/יַּֽעֲשׂוּ חָג֙ שִׁבְעַ֣ת יָמִ֔ים וּ/בַ/יּ֧וֹם הַ/שְּׁמִינִ֛י עֲצֶ֖רֶת כַּ/מִּשְׁפָּֽט׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/018.yaml
  text: And he read from the Book of the Law of God day by day[a], from the first day to the last day. And they kept the feast seven days, and on the eighth day there was a solemn assembly[c][b], according to the ordinance.
translation:
  language: te
  text: అతడు మొదటి రోజు మొదలుకొని చివరి రోజు వరకు ప్రతిరోజూ దేవుని ధర్మశాస్త్ర గ్రంథం నుండి చదివాడు.[a] వారు ఏడు రోజులపాటు పండుగను ఆచరించారు.[b] ఎనిమిదవ రోజున నియమం ప్రకారం[c] గంభీరమైన సభ జరిగింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘దేవుని ధర్మశాస్త్రపు చుట్టగ్రంథం నుండి’ అని కూడా అనువదించవచ్చు. హీబ్రూ పదం సాధారణంగా వ్రాతపత్రాన్ని, చుట్టగ్రంథంతో సహా, సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: ‘వారు ఏడు రోజులపాటు పండుగను జరుపుకున్నారు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: ‘నిర్దేశించిన ప్రకారం’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: అతడు ... చదివాడు
  rationale: కרא అనే క్రియ ఇక్కడ בְסֵפֶר‌తో కలిసి వ్రాతప్రతి నుండి బహిరంగంగా చదవడాన్ని సూచిస్తుంది. హీబ్రూలోని ఏకవచన కర్తను నిలుపుతూ, సందర్భంలో ఎజ్రాను సూచించే ‘అతడు’ అని అనువదించాం.
- source_word: בְּסֵפֶר תּוֹרַת הָאֱלֹהִים
  choice: దేవుని ధర్మశాస్త్ర గ్రంథం నుండి
  rationale: క్రియతో ఉన్న בְను తెలుగులో సహజంగా ‘నుండి’ అని ఇచ్చాం. סֵפֶר వ్రాతపత్రం లేదా చుట్టగ్రంథాన్ని సూచించగలిగినా, రూపాన్ని అనవసరంగా నిర్దిష్టం చేయకుండా ‘గ్రంథం’ అని ఉంచాం.
- source_word: יוֹם בְּיוֹם
  choice: ప్రతిరోజూ
  rationale: ఈ హీబ్రూ నానుడి రోజువారీగా పునరావృతమైన కార్యాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘ప్రతిరోజూ’ సహజంగా అదే భావాన్ని ఇస్తుంది.
- source_word: מִן הַיּוֹם הָרִאשׁוֹן עַד הַיּוֹם הָאַחֲרוֹן
  choice: మొదటి రోజు మొదలుకొని చివరి రోజు వరకు
  rationale: కాలవ్యాప్తిని, మొదటి మరియు చివరి రోజుల సరిహద్దులను స్పష్టంగా నిలిపే సహజమైన తెలుగు రూపం.
- source_word: וַיַּעֲשׂוּ חָג
  choice: వారు ... పండుగను ఆచరించారు
  rationale: עשה + חג పండుగను పాటించడం లేదా జరుపుకోవడం అనే భావం ఇస్తుంది. ‘ఆచరించారు’ దాని నియమబద్ధమైన ఆచరణను తెలియజేస్తూనే సహజంగా ఉంటుంది.
- source_word: שִׁבְעַת יָמִים
  choice: ఏడు రోజులపాటు
  rationale: సంఖ్యను నేరుగా అనువదించి, కార్యం కొనసాగిన కాలాన్ని తెలుగులో సహజంగా తెలిపేందుకు ‘రోజులపాటు’ వాడాం.
- source_word: עֲצֶרֶת
  choice: గంభీరమైన సభ
  rationale: ఈ పదం పండుగ ముగింపుతో సంబంధమున్న ప్రత్యేక ఆరాధనా సమావేశాన్ని సూచిస్తుంది. ‘గంభీరమైన సభ’ దాని ప్రత్యేక, ఆచారపరమైన బరువును నిలుపుతుంది; ‘ముగింపు సభ’ అనే మరింత నిర్దిష్ట భావాన్ని ప్రధాన పాఠ్యంలో బలవంతంగా పెట్టలేదు.
- source_word: כַּמִּשְׁפָּט
  choice: నియమం ప్రకారం
  rationale: מִשְׁפָּט ఇక్కడ ఆచరణను నియంత్రించే నిర్దేశిత నియమాన్ని సూచిస్తుంది. ఈ న్యాయపరమైన, ప్రమాణాత్మక భావాన్ని ‘నియమం ప్రకారం’ స్పష్టంగా అందిస్తుంది.
theological_decisions:
- issue: చదివిన వ్యక్తి ఏకవచనం; పండుగ ఆచరించిన సమాజం బహువచనం
  choice: ‘అతడు ... చదివాడు’; ‘వారు ... ఆచరించారు’
  alternative: రెండు క్రియలకూ ‘వారు’ అనే బహువచన కర్తను వాడడం
  rationale: హీబ్రూ పాఠ్యం ఏకవచన పాఠకుడిని బహువచన సమాజం నుండి ఉద్దేశపూర్వకంగా వేరు చేస్తుంది. కథన పాత్రలను కలపకుండా ఆ వ్యత్యాసాన్ని నిలిపాం.
- issue: עֲצֶרֶת అనే ఆరాధనాపరమైన పదం
  choice: ‘గంభీరమైన సభ’
  alternative: ‘సభ’ లేదా ‘ముగింపు సభ’
  rationale: సాధారణ ‘సభ’ దాని ప్రత్యేక ఆచారపరమైన బరువును తగ్గిస్తుంది; ‘ముగింపు సభ’ సాధ్యమైన భావమే అయినా పదంలోని వివరణాత్మక అనిశ్చితిని మరీ నిర్దిష్టం చేస్తుంది. ప్రధాన పాఠ్యం మధ్యస్థ రూపాన్ని ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలిని పాటించాం. వాక్యాలను సాధారణ పాఠకుడికి సులభంగా విభజించాం; హీబ్రూ మూలంలోని ఏకవచన–బహువచన మార్పు, కాలవ్యాప్తి, ఆచారపరమైన గంభీరతలను నిలిపాం.
