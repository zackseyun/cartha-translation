id: NEH.8.17
reference: Nehemiah 8:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּֽעֲשׂ֣וּ כָֽל הַ֠/קָּהָל הַ/שָּׁבִ֨ים מִן הַ/שְּׁבִ֥י סֻכּוֹת֮ וַ/יֵּשְׁב֣וּ בַ/סֻּכּוֹת֒ כִּ֣י לֹֽא עָשׂ֡וּ מִ/ימֵי֩ יֵשׁ֨וּעַ בִּן נ֥וּן כֵּן֙ בְּנֵ֣י יִשְׂרָאֵ֔ל עַ֖ד הַ/יּ֣וֹם הַ/ה֑וּא וַ/תְּהִ֥י שִׂמְחָ֖ה גְּדוֹלָ֥ה מְאֹֽד־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/017.yaml
  text: And all the assembly of those who had returned from the captivity made booths and lived in the booths[a], for the sons of Israel had not done so from the days of Jeshua son of Nun until that day. And there was very great rejoicing.
translation:
  language: te
  text: చెరనుండి తిరిగి వచ్చినవారి సమాజమంతా పర్ణశాలలు కట్టుకొని వాటిలో నివసించారు. ఎందుకంటే నూను కుమారుడైన యేషువా[a] కాలం నుండి ఆ రోజు వరకు ఇశ్రాయేలు కుమారులు ఈ విధంగా చేయలేదు. మరియు ఎంతో గొప్ప ఆనందం కలిగింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: యేషువా అంటే నూను కుమారుడైన యెహోషువ.
    reason: ఈ వచనంలోని హీబ్రూ నామరూపం יֵשׁוּעַ (యేషువా); ఈ వ్యక్తి సాధారణంగా యెహోషువ అనే పేరుతో ప్రసిద్ధుడు.
lexical_decisions:
- source_word: הַקָּהָל
  choice: సమాజం
  rationale: కָהָל ఇక్కడ కూడిన ప్రజాసమూహాన్ని సూచిస్తుంది. ‘సమాజం’ ఆధునిక తెలుగు పాఠకులకు సహజంగా ఉండి, మతసంస్థ అనే పరిమిత భావాన్ని తప్పిస్తుంది.
- source_word: הַשָּׁבִים מִן הַשְּׁבִי
  choice: చెర నుంచి తిరిగి వచ్చినవారు
  rationale: హీబ్రూ పదబంధంలోని తిరిగి రావడం, చెరలో ఉండడం అనే రెండు భావాలనూ సూటిగా నిలుపుతుంది.
- source_word: סֻכּוֹת
  choice: పర్ణశాలలు
  rationale: పండుగ సందర్భంగా కొమ్మలు, ఆకులతో నిర్మించే తాత్కాలిక నివాసాలను సూచించే సుపరిచితమైన, గౌరవప్రదమైన తెలుగు పదం.
- source_word: וַיֵּשְׁבוּ בַסֻּכּוֹת
  choice: వాటిలో నివసించారు
  rationale: יָשַׁב కు ‘కూర్చోవడం’ అనే అర్థం ఉన్నా, ఈ పండుగ సందర్భంలో పర్ణశాలల్లో ఉండడమే ఉద్దేశం; ‘నివసించారు’ ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: כִּי לֹא עָשׂוּ ... כֵּן
  choice: ఎందుకంటే ... ఈ విధంగా చేయలేదు
  rationale: ఇది పండుగను ఎన్నడూ ఆచరించలేదని తప్పనిసరిగా చెప్పకుండా, ముందే వివరించిన విధంగా చేయలేదనే హీబ్రూ అన్వయాన్ని నిలుపుతుంది.
- source_word: מִימֵי יֵשׁוּעַ בִּן נוּן
  choice: నూను కుమారుడైన యేషూవ కాలం నుంచి
  rationale: మూలపాఠంలో ఉన్న సంక్షిప్త నామరూపం יֵשׁוּעַ ను ‘యేషూవ’గా ప్రతిబింబించి, విస్తృతంగా తెలిసిన ‘యెహోషువ’ రూపాన్ని పాదసూచికలో ఇస్తుంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: హీబ్రూ భాషలోని పుంలింగ బహువచన ఒడంబడిక సంబంధిత జాతినామాన్ని సూటిగా నిలుపుతుంది.
- source_word: וַתְּהִי שִׂמְחָה גְּדוֹלָה מְאֹד
  choice: అప్పుడు వారికి అత్యంత గొప్ప ఆనందం కలిగింది
  rationale: సమూహపు మహానందాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తూ, גְּדוֹלָה מְאֹד లోని తీవ్రతను నిలుపుతుంది.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל పదబంధం
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలీయులు; ఇశ్రాయేలు ప్రజలు
  rationale: మూలంలోని వ్యాకరణపరమైన పుంలింగ రూపాన్నీ, దాని ఒడంబడిక సంబంధిత సంప్రదాయ ప్రయోగాన్నీ ప్రధాన పాఠంలో నిలుపుతుంది.
- issue: יֵשׁוּעַ בִּן נוּן వ్యక్తి నామరూపం
  choice: నూను కుమారుడైన యేషూవ
  alternative: నూను కుమారుడైన యెహోషువ
  rationale: ఈ వచనంలో ప్రత్యక్షంగా ఉన్న יֵשׁוּעַ రూపాన్ని ప్రధాన పాఠంలో ప్రతిబింబిస్తూ, అదే వ్యక్తికి సాధారణంగా తెలిసిన యెహోషువ అనే రూపాన్ని పాదసూచికలో స్పష్టం చేస్తుంది.
- issue: ‘ఆ విధంగా చేయలేదు’ అనే చారిత్రక వాక్యంలోని పరిధి
  choice: ఈ విధంగా చేయలేదు
  alternative: ఈ పండుగను ఆచరించలేదు
  rationale: ఇతర కాలాల్లో పండుగ ఆచరణ గురించి ఉన్న ఆధారాలతో బలవంతంగా సమన్వయం చేయకుండా, כֵּן లోని ముందు చర్యలకు సూచించే భావాన్ని మరియు వాక్యంలోని ఉద్వేగాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలి వాడబడింది. ‘పర్ణశాలలు’ పండుగ సందర్భాన్ని స్పష్టంగా ఉంచుతుంది; ‘ఈ విధంగా’ మూలంలోని సంక్షిప్తతను, చారిత్రక అస్పష్టతను పరిష్కరించకుండా కాపాడుతుంది. పాదసూచిక గుర్తు సంబంధిత వ్యక్తి పేరు వెంట ఉంచబడింది.
