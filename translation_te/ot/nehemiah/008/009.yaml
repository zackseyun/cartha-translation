source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר נְחֶמְיָ֣ה ה֣וּא הַ/תִּרְשָׁ֡תָא וְ/עֶזְרָ֣א הַ/כֹּהֵ֣ן הַ/סֹּפֵ֡ר וְ/הַ/לְוִיִּם֩ הַ/מְּבִינִ֨ים אֶת הָ/עָ֜ם לְ/כָל הָ/עָ֗ם הַ/יּ֤וֹם קָדֹֽשׁ הוּא֙ לַ/יהוָ֣ה אֱלֹהֵי/כֶ֔ם אַל תִּֽתְאַבְּל֖וּ וְ/אַל תִּבְכּ֑וּ כִּ֤י בוֹכִים֙ כָּל הָ/עָ֔ם כְּ/שָׁמְעָ֖/ם אֶת דִּבְרֵ֥י הַ/תּוֹרָֽה׀־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/009.yaml
  text: Then Nehemiah the governor[a], Ezra the priest and scribe, and the Levites who were instructing the people said to all the people, “This day is holy to Yahweh your God[b]. Do not mourn or weep.” For all the people were weeping as they heard the words of the law.
translation:
  language: te
  text: 'అప్పుడు ప్రాంతాధిపతి[a] అయిన నెహెమ్యా, యాజకుడూ శాస్త్రియూ అయిన ఎజ్రా, ప్రజలకు బోధిస్తున్న లేవీయులు ప్రజలందరితో ఇలా అన్నారు: “మీ దేవుడైన యెహోవాకు ఈ రోజు పరిశుద్ధమైనది. దుఃఖించకండి, ఏడవకండి.” ధర్మశాస్త్రపు మాటలు వింటున్నప్పుడు ప్రజలందరూ ఏడుస్తున్నారు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “తిర్షాతా”; ఇది పర్షియా కాలానికి చెందిన పరిపాలనా బిరుదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַתִּרְשָׁתָא
  choice: అధిపతి
  rationale: ఇది పర్షియా కాలానికి చెందిన పరిపాలనా బిరుదు. సాధారణ తెలుగు పాఠకులకు దాని అధికారపరమైన విధిని స్పష్టంగా తెలియజేయడానికి ‘అధిపతి’ అని అనువదించబడింది; మూల బిరుదు పాదసూచికలో ఉంచబడింది.
- source_word: הַכֹּהֵן הַסֹּפֵר
  choice: యాజకుడూ శాస్త్రియూ అయిన
  rationale: రెండు పదాలూ ఎజ్రాకు వర్తించే సమానాధికార బిరుదులు. అతని రెండు పాత్రలనూ విడిచిపెట్టకుండా సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: הַלְוִיִּם הַמְּבִינִים אֶת־הָעָם
  choice: ప్రజలకు బోధిస్తున్న లేవీయులు
  rationale: בין యొక్క హిఫీల్ రూపం ప్రజలు అర్థం చేసుకునేలా చేయడం లేదా బోధించడం అనే భావాన్ని ఇస్తుంది. ‘బోధిస్తున్న’ అనేది ఆ కార్యాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: הַיּוֹם קָדֹשׁ הוּא
  choice: ఈ రోజు ... ప్రతిష్ఠితమైన రోజు
  rationale: קָדֹשׁ ఇక్కడ దేవునికోసం ప్రత్యేకంగా వేరు చేయబడిన దినాన్ని సూచిస్తుంది. ‘ప్రతిష్ఠితమైన’ అనే పదం ఆ ఆరాధనా సంబంధ భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: לַיהוָה
  choice: యెహోవాకు
  rationale: ל ఉపసర్గను ‘కు’గా సహజంగా వ్యక్తపరుస్తూ, יהוה అనే ఒడంబడిక నామాన్ని తెలుగు సంప్రదాయ లిప్యంతరీకరణ ‘యెహోవా’తో నిలుపుతుంది.
- source_word: תִּתְאַבְּלוּ
  choice: దుఃఖించకండి
  rationale: ఈ క్రియ శోకించడం, దుఃఖ సూచనలు ప్రదర్శించడం అనే భావాన్ని ఇస్తుంది. తరువాతి ‘ఏడవకండి’తో ఉన్న భేదాన్ని నిలుపుతుంది.
- source_word: תִּבְכּוּ / בוֹכִים
  choice: ఏడవకండి / ఏడుస్తున్నారు
  rationale: గంభీరమైన సందర్భంలో కన్నీటితో ఏడవడాన్ని సహజమైన ఆధునిక తెలుగులో నేరుగా తెలియజేస్తుంది.
- source_word: כְּשָׁמְעָם
  choice: వింటున్నప్పుడు
  rationale: כ ఉపసర్గ సూచించే సమకాలీన చర్యను నిలుపుతూ, ధర్మశాస్త్ర వాక్యాలను వినే సమయంలోనే వారు ఏడుస్తున్నారని తెలియజేస్తుంది.
- source_word: דִּבְרֵי הַתּוֹרָה
  choice: ధర్మశాస్త్ర వాక్యాలు
  rationale: ఈ ప్రజా ఒడంబడిక పఠన సందర్భంలో תּוֹרָה దేవుని ధర్మశాస్త్రాన్ని సూచిస్తుంది. ‘ధర్మశాస్త్ర వాక్యాలు’ సాధారణ తెలుగు బైబిలు పాఠకులకు స్పష్టంగా ఉంటుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలపాఠంలో చతురక్షర దైవనామం ప్రత్యక్షంగా ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా పేరుగానే నిలిపి, ఆధునిక తెలుగు క్రైస్తవ వాడుకలో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం.
- issue: קָדֹשׁ యొక్క భావం
  choice: ప్రతిష్ఠితమైన
  alternative: పరిశుద్ధమైన
  rationale: ఇక్కడ నైతిక గుణంకన్నా ఆ దినం యెహోవాకు ప్రత్యేకంగా వేరు చేయబడినదనే ఆరాధనా భావం ప్రధానంగా ఉంది. ‘పరిశుద్ధమైన’ కూడా సాధ్యమే; ‘ప్రతిష్ఠితమైన’ ఆ సంబంధాన్ని సహజంగా స్పష్టం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్యనిర్మాణం. ప్రత్యక్ష సంభాషణలో గౌరవపూర్వక బహువచన ఆజ్ఞారూపాలు వాడబడ్డాయి.
