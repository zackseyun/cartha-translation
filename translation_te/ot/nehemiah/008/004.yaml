source:
  edition: WLC
  text: וַֽ/יַּעֲמֹ֞ד עֶזְרָ֣א הַ/סֹּפֵ֗ר עַֽל מִגְדַּל עֵץ֮ אֲשֶׁ֣ר עָשׂ֣וּ לַ/דָּבָר֒ וַ/יַּֽעֲמֹ֣ד אֶצְל֡/וֹ מַתִּתְיָ֡ה וְ/שֶׁ֡מַע וַ֠/עֲנָיָה וְ/אוּרִיָּ֧ה וְ/חִלְקִיָּ֛ה וּ/מַעֲשֵׂיָ֖ה עַל יְמִינ֑/וֹ וּ/מִ/שְּׂמֹאל֗/וֹ פְּ֠דָיָה וּ/מִֽישָׁאֵ֧ל וּ/מַלְכִּיָּ֛ה וְ/חָשֻׁ֥ם וְ/חַשְׁבַּדָּ֖נָה זְכַרְיָ֥ה מְשֻׁלָּֽם־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/004.yaml
  text: Ezra the scribe stood on a wooden platform that they had made for the purpose[a], and beside him stood Mattithiah, Shema, Anaiah, Uriah, Hilkiah, and Maaseiah on his right hand, and Pedaiah, Mishael, Malchijah, Hashum, Hashbaddanah, Zechariah[b], and Meshullam on his left hand.
translation:
  language: te
  text: ఎజ్రా శాస్త్రి, ఈ సందర్భం కోసం వారు చేసిన చెక్క వేదిక[a] మీద నిలబడ్డాడు. అతని కుడివైపున మత్తిత్యా, షెమ, అనాయా, ఊరియా, హిల్కీయా, మయశేయా నిలబడ్డారు; అతని ఎడమవైపున పెదాయా, మీషాయేలు, మల్కీయా, హాషుము, హష్బద్దానా, జెకర్యా, మెషుల్లాము నిలబడ్డారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ‘చెక్క గోపురం’; అంటే ఎత్తుగా నిర్మించిన చెక్క కట్టడం లేదా వేదిక.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִגְדַּל עֵץ
  choice: చెక్క వేదిక
  rationale: పదశః ‘చెక్క గోపురం’; అయితే ప్రజల ఎదుట నిలబడి చదివే సందర్భంలో ఎత్తుగా నిర్మించిన వేదికను సూచిస్తుంది. ‘చెక్క వేదిక’ ఆధునిక తెలుగులో సహజంగా దాని కార్యాన్ని తెలియజేస్తుంది.
- source_word: לַדָּבָר
  choice: ఈ పని కోసం
  rationale: דָּבָר అనే పదానికి ‘మాట, విషయం, పని’ వంటి అర్థాలున్నాయి. ఇక్కడ వేదికను నిర్మించిన నిర్దిష్ట ఉద్దేశాన్ని సూచిస్తుంది; ‘ఈ పని కోసం’ మూలంలోని విస్తృత భావాన్ని అనవసరంగా కుదించదు.
- source_word: הַסֹּפֵר
  choice: శాస్త్రి
  rationale: ధర్మశాస్త్ర గ్రంథాలలో నైపుణ్యమున్న లేఖకుడు/పండితుడు అనే సందర్భార్థాన్ని ‘శాస్త్రి’ సంక్షిప్తంగా, గౌరవప్రదంగా తెలియజేస్తుంది.
- source_word: אֶצְלוֹ
  choice: అతని కుడివైపున … అతని ఎడమవైపున
  rationale: ‘అతని పక్కన’ అనే సమీపార్థం తరువాత వచ్చే కుడి, ఎడమ స్థానాల ద్వారా స్పష్టమవుతుంది; తెలుగులో జాబితాను సహజంగా అమర్చేందుకు దిశా పదబంధాలలో కలిపి వ్యక్తీకరించబడింది.
- source_word: עַל יְמִינוֹ / וּמִשְּׂמֹאלוֹ
  choice: అతని కుడివైపున / అతని ఎడమవైపున
  rationale: హీబ్రూ దిశా భాషను సహజమైన ఆధునిక తెలుగు రూపంలో సమాంతరంగా వ్యక్తీకరిస్తుంది.
- source_word: וַיַּעֲמֹד
  choice: నిలబడ్డాడు / నిలబడ్డారు
  rationale: ఎజ్రా విషయంలోనూ అతని పక్కనున్న వారి విషయంలోనూ పునరావృతమైన עמד క్రియను సాధారణ భూతకాల రూపంతో నిలుపుతుంది.
