source:
  edition: WLC
  text: וַ/יֵּלְכ֨וּ כָל הָ/עָ֜ם לֶ/אֱכֹ֤ל וְ/לִ/שְׁתּוֹת֙ וּ/לְ/שַׁלַּ֣ח מָנ֔וֹת וְ/לַ/עֲשׂ֖וֹת שִׂמְחָ֣ה גְדוֹלָ֑ה כִּ֤י הֵבִ֨ינוּ֙ בַּ/דְּבָרִ֔ים אֲשֶׁ֥ר הוֹדִ֖יעוּ לָ/הֶֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/012.yaml
  text: And all the people went away to eat and drink[a], to send portions, and to celebrate with great joy[b], because they had understood the words that had been made known to them.
translation:
  language: te
  text: ప్రజలందరూ తినడానికి, తాగడానికి, భాగాలను పంపడానికి[a], ఎంతో ఆనందంగా వేడుక చేసుకోవడానికి వెళ్లిపోయారు. ఎందుకంటే తమకు తెలియజేయబడిన మాటలను[b] వారు అర్థం చేసుకున్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘భాగాలను పంపడానికి’; పండుగ సందర్భంలో ఇతరులతో పంచుకునే ఆహార భాగాలు అనే భావం ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘తమకు వివరించబడిన విషయాలను.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: వెళ్లిపోయారు
  rationale: సభ నుంచి బయలుదేరి తరువాత చెప్పిన కార్యాలు చేయడానికి వెళ్లిన భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: כָל הָעָם
  choice: ప్రజలందరూ
  rationale: హీబ్రూ సమూహవ్యాప్తిని సంక్షిప్తంగా, సహజంగా నిలుపుతుంది.
- source_word: לֶאֱכֹל וְלִשְׁתּוֹת
  choice: తినడానికి, తాగడానికి
  rationale: ‘వెళ్లిపోయారు’ అనే క్రియను అనుసరించే ఉద్దేశార్థక క్రియారూపాలను నేరుగా ప్రతిబింబిస్తుంది.
- source_word: וּלְשַׁלַּח מָנוֹת
  choice: ఆహార భాగాలను ఇతరులకు పంపడానికి
  rationale: מָנוֹת అంటే పండుగ సందర్భంలో పంచే కేటాయించిన భాగాలు, ముఖ్యంగా ఆహార భాగాలు. ముందరి వచన సందర్భం ప్రకారం అవి ఇతరులకు పంపబడినవని స్పష్టం చేయడం తెలుగులో సహజంగా ఉంటుంది.
- source_word: וְלַעֲשׂוֹת שִׂמְחָה גְדוֹלָה
  choice: ఎంతో ఆనందంగా వేడుక చేసుకోవడానికి
  rationale: అక్షరార్థమైన ‘గొప్ప ఆనందం చేయడం’ను సహజమైన తెలుగు పండుగ వ్యక్తీకరణగా అందిస్తూ తీవ్రతను నిలుపుతుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: వారి వేడుకకు కారణాన్ని స్పష్టంగా పరిచయం చేస్తుంది.
- source_word: הֵבִינוּ
  choice: అర్థం చేసుకున్నారు
  rationale: వారి కార్యాలకు ఆధారమైన సంపూర్ణ గ్రహింపును సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: בַּדְּבָרִים
  choice: మాటలను
  rationale: דְּבָרִיםకు ‘మాటలు’ లేదా ‘విషయాలు’ అనే భావాలు సాధ్యం. ధర్మశాస్త్ర పఠనం, బోధన సందర్భంలో ‘మాటలు’ మూలంలోని వాచిక అంశాన్ని కాపాడుతుంది.
- source_word: אֲשֶׁר הוֹדִיעוּ לָהֶם
  choice: తమకు తెలియజేయబడిన
  rationale: ידע హిఫీల్ రూపంలోని ‘తెలియజేయడం’ భావాన్ని, బోధనా విధానాన్ని అవసరానికి మించి నిర్దిష్టం చేయకుండా నిలుపుతుంది.
theological_decisions:
- issue: ధర్మశాస్త్రానికి ప్రజల ప్రతిస్పందన స్వభావం
  choice: తమకు తెలియజేయబడిన మాటలను అర్థం చేసుకోవడమే వారి ఆనందానికి వచనం తెలిపే కారణంగా ఉంచబడింది.
  alternative: దీనిని ప్రధానంగా పశ్చాత్తాపం నుంచి వేడుకకు మార్పుగా లేదా సాంకేతిక అర్థంలో నిబంధన పునరుద్ధరణగా వివరించడం.
  rationale: వారు ఆనందించడానికి కారణం ఆ మాటలను అర్థం చేసుకోవడమేనని వచనం స్పష్టంగా చెబుతుంది; అనువాదం అంతకుమించిన సిద్ధాంతార్థాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యేలా సహజమైన, గౌరవప్రదమైన శైలి. హీబ్రూలోని ఉద్దేశార్థక క్రియల వరుసను నిలుపుతూ, తెలుగు పఠన సౌలభ్యం కోసం వాక్యాన్ని రెండు వాక్యాలుగా విభజించాం. ప్రతి పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో ఉంచబడింది.
