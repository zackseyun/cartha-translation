translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సామాన్య పాఠకులకు అర్థమయ్యేలా, అయితే బహిరంగ ధర్మశాస్త్ర పఠనానికి తగిన గౌరవప్రదమైన శైలిలో రూపొందించబడింది. ‘ధర్మశాస్త్రం’ అనే సుపరిచిత బైబిలు పదాన్ని ఉంచి, వాక్య నిర్మాణాన్ని సహజ తెలుగుకు అనుగుణంగా మార్చాం. మూలంలోని מְפֹרָשׁ పదానికి ఉన్న నిజమైన సందిగ్ధతను ప్రధాన పాఠం మరియు పాదటిప్పణిలో కాపాడాం.
