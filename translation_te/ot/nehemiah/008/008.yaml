source:
  edition: WLC
  text: וַֽ/יִּקְרְא֥וּ בַ/סֵּ֛פֶר בְּ/תוֹרַ֥ת הָ/אֱלֹהִ֖ים מְפֹרָ֑שׁ וְ/שׂ֣וֹם שֶׂ֔כֶל וַ/יָּבִ֖ינוּ בַּ/מִּקְרָֽא׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/008.yaml
  text: They read from the book[a], from the law of God, clearly, and they gave the sense, so that they understood the reading.
translation:
  language: te
  text: వారు దేవుని ధర్మశాస్త్ర గ్రంథం నుండి స్పష్టంగా చదివి,[a] దాని భావాన్ని వివరించారు; దాంతో ప్రజలు చదివినదాన్ని అర్థం చేసుకున్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “విశదంగా.” ఈ హీబ్రూ పదం స్పష్టంగా చదవడాన్ని, వివరణ ద్వారా పాఠాన్ని తేటపరచడాన్ని, లేదా బహుశా వినేవారి కోసం అనువదించడాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְאוּ
  choice: వారు ... చదివి
  rationale: వ్రాతగ్రంథం కర్మగా ఉన్నందున קרא ఇక్కడ ‘చదవడం’ అనే సాధారణ అర్థాన్నే ఇస్తుంది; సందర్భం బహిరంగ పఠనాన్ని సూచిస్తుంది.
- source_word: בַסֵּפֶר בְּתוֹרַת הָאֱלֹהִים
  choice: దేవుని ధర్మశాస్త్ర గ్రంథం నుండి
  rationale: రెండు పదబంధాలు ఒకే గ్రంథాన్ని సూచించే అన్వయంగా ఉన్నాయి. ‘నుండి’ పఠనానికి మూలమైన గ్రంథాన్ని సహజ తెలుగులో తెలియజేస్తుంది; ‘ధర్మశాస్త్రం’ ఇక్కడ మోషే ధర్మశాస్త్ర గ్రంథార్థాన్ని కాపాడుతుంది.
- source_word: מְפֹרָשׁ
  choice: స్పష్టంగా
  rationale: ఈ పదం స్పష్టంగా లేదా అర్థమయ్యేలా చేయడాన్ని సూచిస్తుంది. స్పష్టమైన ఉచ్చారణ, వివరణ, లేదా అనువాదం అనే సాధ్యార్థాల్లో ఒక్కదానినే ఖరారు చేయకుండా ‘స్పష్టంగా’ మూలంలోని విస్తృతిని నిలుపుతుంది.
- source_word: וְשׂוֹם שֶׂכֶל
  choice: దాని భావాన్ని వివరించారు
  rationale: అక్షరార్థంగా ‘అవగాహనను ఉంచడం/కలిగించడం’ అనే ఈ నుడికారం పాఠ్యార్థాన్ని తెలియజేసే చర్యను సూచిస్తుంది. ఆధునిక తెలుగులో ‘భావాన్ని వివరించారు’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: וַיָּבִינוּ
  choice: దాంతో ప్రజలు ... అర్థం చేసుకున్నారు
  rationale: మునుపటి పఠనం, వివరణల ఫలితాన్ని తెలుగులో ‘దాంతో’ తెలియజేస్తుంది. క్రియకు బహువచన కర్త సందర్భంలోని ప్రజలని స్పష్టం చేయడం సహజ తెలుగు ప్రవాహానికి తోడ్పడుతుంది.
- source_word: בַּמִּקְרָא
  choice: చదివినదాన్ని
  rationale: מִקְרָא బహిరంగంగా చదివిన పాఠ్యాన్ని లేదా పఠనాన్ని సూచిస్తుంది. ‘చదివినదాన్ని’ సాధారణ పాఠకులకు సహజంగా ఉండి, ఇక్కడ పాఠ్యవిషయంపై కలిగిన అవగాహనను తెలియజేస్తుంది.
