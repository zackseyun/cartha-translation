source:
  edition: WLC
  text: וּ/בַ/יּ֣וֹם הַ/שֵּׁנִ֡י נֶאֶסְפוּ֩ רָאשֵׁ֨י הָ/אָב֜וֹת לְ/כָל הָ/עָ֗ם הַ/כֹּֽהֲנִים֙ וְ/הַ/לְוִיִּ֔ם אֶל עֶזְרָ֖א הַ/סֹּפֵ֑ר וּ/לְ/הַשְׂכִּ֖יל אֶל דִּבְרֵ֥י הַ/תּוֹרָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/013.yaml
  text: And on the second day[a], the heads of the fathers’ houses of all the people, the priests, and the Levites gathered to Ezra the scribe to gain insight into the words of the law.
translation:
  language: te
  text: రెండవ రోజున ప్రజలందరి పితృకుటుంబాల పెద్దలు[a], యాజకులు, లేవీయులు ధర్మశాస్త్ర వాక్యాలపై అవగాహన పొందడానికి శాస్త్రి అయిన ఎజ్రా దగ్గరికి కూడివచ్చారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘వంశాల పెద్దలు.’ హీబ్రూ పదబంధం అక్షరార్థంగా ‘పితరుల ప్రధానులు’; ఇది వంశాలకు లేదా విస్తృత కుటుంబాలకు నాయకులైనవారిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַיּוֹם הַשֵּׁנִי
  choice: రెండవ రోజున
  rationale: వావ్ కథన అనుసంధానాన్ని తెలుగులో వాక్యప్రవాహమే సహజంగా తెలియజేస్తుంది; కాలార్థాన్ని నేరుగా నిలుపుతుంది.
- source_word: נֶאֶסְפוּ
  choice: కూడివచ్చారు
  rationale: నిఫాల్ బహువచన రూపం ఇక్కడ సమూహంగా కూడడాన్ని సూచిస్తుంది; ఎజ్రా దగ్గరికి రావడం అనే దిశను కూడా తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: רָאשֵׁי הָאָבוֹת לְכָל הָעָם
  choice: ప్రజలందరి పితృకుటుంబాల పెద్దలు
  rationale: ఇది ప్రజల మధ్యనున్న వంశ లేదా విస్తృత కుటుంబ నాయకులను సూచిస్తుంది. ‘పితృకుటుంబాలు’ మూలంలోని పితృవంశ సామాజిక నిర్మాణాన్ని నిలుపుతుంది.
- source_word: הַכֹּהֲנִים וְהַלְוִיִּם
  choice: యాజకులు, లేవీయులు
  rationale: మూలంలోని రెండు ప్రత్యేక సమూహాలను సాధారణ తెలుగు బైబిలు పదజాలంతో స్పష్టంగా ఉంచుతుంది.
- source_word: אֶל עֶזְרָא הַסֹּפֵר
  choice: శాస్త్రి అయిన ఎజ్రా దగ్గరికి
  rationale: אֶל సూచించే ఎజ్రా వైపు కదలికను ‘దగ్గరికి’ తెలియజేస్తుంది; סֹפֵר ఇక్కడ ధర్మశాస్త్రంలో నిపుణుడైన అధికారిక శాస్త్రిని సూచిస్తుంది.
- source_word: וּלְהַשְׂכִּיל אֶל דִּבְרֵי הַתּוֹרָה
  choice: ధర్మశాస్త్ర వాక్యాలపై అవగాహన పొందడానికి
  rationale: హిఫీల్ రూపంలోని వివేకపూర్వకంగా గ్రహించడం లేదా అంతర్దృష్టి పొందడం అనే ఉద్దేశ్యాన్ని ‘అవగాహన పొందడానికి’ సహజంగా తెలియజేస్తుంది; אֶל యొక్క విషయదిశను ‘పై’ వ్యక్తం చేస్తుంది.
