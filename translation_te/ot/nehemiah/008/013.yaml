translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన శైలి. మూలంలోని కుటుంబ-వంశ నిర్మాణాన్ని ప్రధాన పాఠ్యంలో నిలిపి, మరింత సంక్షిప్త ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
