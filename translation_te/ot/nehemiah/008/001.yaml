revisions:
- from: ప్రజలందరూ ఒక్క మనిషిలా[a] నీటి ద్వారం ఎదుట ఉన్న బహిరంగ ప్రాంగణంలో సమకూడారు. యెహోవా ఇశ్రాయేలుకు ఆజ్ఞాపించిన మోషే ధర్మశాస్త్ర గ్రంథాన్ని తీసుకురావాలని వారు శాస్త్రి అయిన ఎజ్రాతో చెప్పారు.
  to: ప్రజలందరూ ఒక్క మనిషిగా[a] నీటి ద్వారం ఎదుట ఉన్న బహిరంగ ప్రాంగణంలో సమకూడారు. మోషే ధర్మశాస్త్ర గ్రంథాన్ని తీసుకురావమని వారు శాస్త్రి అయిన ఎజ్రాతో చెప్పారు; ఆ ధర్మశాస్త్రాన్ని యాహ్వే ఇశ్రాయేలుకు ఆజ్ఞాపించాడు.
  rationale: దైవనామాన్ని POB యొక్క ‘Yahweh’ నిర్ణయానికి అనుగుణంగా ‘యాహ్వే’గా మార్చాం. సాపేక్ష ఉపవాక్యాన్ని ‘ఆ ధర్మశాస్త్రాన్ని యాహ్వే ఇశ్రాయేలుకు ఆజ్ఞాపించాడు’గా విడదీయడం ద్వారా యాహ్వే ఆజ్ఞాపించినది గ్రంథపు భౌతిక ప్రతికాదు, అందులోని ధర్మశాస్త్రమని తెలుగు పాఠకుడికి స్పష్టమవుతుంది; ఇది హెబ్రీ నిర్మాణంలోని ఉద్దేశాన్ని మార్పు చేయదు. ఐక్యతా నుడికారాన్ని ‘ఒక్క మనిషిగా’గా స్వల్పంగా సవరించాం.
