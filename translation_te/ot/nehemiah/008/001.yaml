id: NEH.8.1
reference: Nehemiah 8:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֵּאָסְפ֤וּ כָל הָ/עָם֙ כְּ/אִ֣ישׁ אֶחָ֔ד אֶל הָ֣/רְח֔וֹב אֲשֶׁ֖ר לִ/פְנֵ֣י שַֽׁעַר הַ/מָּ֑יִם וַ/יֹּֽאמְרוּ֙ לְ/עֶזְרָ֣א הַ/סֹּפֵ֔ר לְ/הָבִ֗יא אֶת סֵ֨פֶר֙ תּוֹרַ֣ת מֹשֶׁ֔ה אֲשֶׁר צִוָּ֥ה יְהוָ֖ה אֶת יִשְׂרָאֵֽל־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/001.yaml
  text: And all the people gathered as one man at the square that was before the Water Gate[a], and they told Ezra the scribe to bring the Book of the Law of Moses, which Yahweh had commanded Israel.
translation:
  language: te
  text: ప్రజలందరూ ఒక్క మనిషిగా[a] నీటి ద్వారం ఎదుట ఉన్న బహిరంగ ప్రాంగణంలో సమకూడారు. మోషే ధర్మశాస్త్ర గ్రంథాన్ని తీసుకురావమని వారు శాస్త్రి అయిన ఎజ్రాతో చెప్పారు; ఆ ధర్మశాస్త్రాన్ని యాహ్వే ఇశ్రాయేలుకు ఆజ్ఞాపించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీలో అక్షరార్థంగా, “ఒక్క మనిషిగా”; అంటే “ఒక్కటిగా” లేదా “ఏకమనస్సుతో.”
    reason: హెబ్రీ నుడికారంలోని అక్షర రూపాన్నీ, దాని సహజ భావాన్నీ రెండింటినీ తెలియజేయడానికి.
lexical_decisions:
- source_word: וַיֵּאָסְפוּ
  choice: సమకూడారు
  rationale: నిఫల్ రూపం ప్రజలు ఒకచోటికి చేరడాన్ని సూచిస్తుంది; ‘సమకూడారు’ సహజమైన, గౌరవప్రదమైన ఆధునిక తెలుగు.
- source_word: כָל הָעָם
  choice: ప్రజలందరూ
  rationale: మొత్తం సమాజాన్ని సమష్టిగా సూచించే హెబ్రీ పదబంధానికి సహజమైన తెలుగు రూపం.
- source_word: כְּאִישׁ אֶחָד
  choice: ఒక్క మనిషిలా
  rationale: ఏకమనస్సుతో చేసిన సమష్టి చర్యను తెలిపే హెబ్రీ నుడికారంలోని ‘మనిషి’ అనే రూపకాన్ని ప్రధాన పాఠ్యంలో నిలుపుతుంది; భావాన్ని పాదటిప్పణి వివరిస్తుంది.
- source_word: הָרְחוֹב
  choice: బహిరంగ ప్రాంగణం
  rationale: ఇది ఆధునిక అర్థంలోని వీధి కాకుండా పట్టణంలోని విశాలమైన ప్రజాస్థలాన్ని సూచిస్తుంది.
- source_word: לִפְנֵי שַׁעַר הַמָּיִם
  choice: నీటి ద్వారం ఎదుట
  rationale: స్థానాన్ని తెలిపే పదబంధానికి స్పష్టమైన, సహజమైన తెలుగు అనువాదం.
- source_word: וַיֹּאמְרוּ לְעֶזְרָא ... לְהָבִיא
  choice: తీసుకురావాలని వారు ... ఎజ్రాతో చెప్పారు
  rationale: మూలంలోని ‘చెప్పారు’ అనే సాధారణ క్రియను నిలుపుతూ, తెలుగు వాక్యనిర్మాణంలో క్రియార్థక పూరకాన్ని సహజంగా వ్యక్తపరుస్తుంది; ‘అడిగారు’ అని జోడించి వినయార్థాన్ని దిగుమతి చేయదు.
- source_word: הַסֹּפֵר
  choice: శాస్త్రి
  rationale: ఎజ్రా యొక్క లేఖకుడు మరియు ధర్మశాస్త్ర నిపుణుడు అనే గుర్తింపును తెలిపే స్థిరమైన బైబిలు తెలుగు పదం.
- source_word: סֵפֶר תּוֹרַת מֹשֶׁה
  choice: మోషే ధర్మశాస్త్ర గ్రంథం
  rationale: סֵפֶר గ్రంథం లేదా చుట్టను సూచించగలదు; ‘గ్రంథం’ మాధ్యమాన్ని అనవసరంగా నిర్దిష్టం చేయకుండా భావాన్ని అందిస్తుంది.
- source_word: אֲשֶׁר צִוָּה יְהוָה אֶת יִשְׂרָאֵל
  choice: యెహోవా ఇశ్రాయేలుకు ఆజ్ఞాపించిన
  rationale: హెబ్రీలో ఇశ్రాయేలు ఆజ్ఞను స్వీకరించే సమూహం. తెలుగులో ‘ఇశ్రాయేలుకు ఆజ్ఞాపించిన’ అనే రూపం సహజంగా ఉండి ఆ సంబంధాన్ని నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవ నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించదగిన సంప్రదాయ లిప్యంతరీకరణతో వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: כְּאִישׁ אֶחָד అనే నుడికారం
  choice: ఒక్క మనిషిలా
  alternative: ఒక్కటిగా / ఏకమనస్సుతో
  rationale: మూలంలోని పురుష ఏకవచన రూపకాన్ని చెరపకుండా ఉంచి, దాని ఐక్యతాభావాన్ని పాదటిప్పణిలో స్పష్టం చేస్తుంది.
- issue: אֲשֶׁר צִוָּה יְהוָה אֶת יִשְׂרָאֵל లోని సంబంధం
  choice: యెహోవా ఇశ్రాయేలుకు ఆజ్ఞాపించిన
  alternative: యెహోవా ఇశ్రాయేలును ఆజ్ఞాపించిన
  rationale: మూల నిర్మాణం సంక్షిప్తంగా ఉన్నప్పటికీ, తెలుగులో ‘గ్రంథాన్ని ఇశ్రాయేలును ఆజ్ఞాపించాడు’ అనే అపార్థాన్ని నివారిస్తూ ఇశ్రాయేలు ఆజ్ఞ గ్రహీత అని వ్యక్తపరుస్తుంది.
- issue: దైవ నామం יְהוָה
  choice: యెహోవా
  alternative: యాహ్వే / ప్రభువు
  rationale: వ్యక్తిగత దైవ నామాన్ని బిరుదుగా మార్చదు. ‘యెహోవా’ ఆధునిక తెలుగు బైబిలు పాఠకులకు సులభంగా గుర్తించదగిన రూపం; ఉచ్చారణ పునర్నిర్మాణంపై ఉన్న అనిశ్చితిని సిద్ధాంతపరంగా పరిష్కరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన కథన శైలి. ‘బహిరంగ ప్రాంగణం’ పట్టణ ప్రజాస్థలాన్ని స్పష్టపరుస్తుంది. ‘శాస్త్రి’ సంప్రదాయ బైబిలు పదజాలాన్ని నిలుపుతున్నప్పటికీ సాధారణ పాఠకుడికి సందర్భంలో అర్థమయ్యేలా ఉంది. పాదటిప్పణి సూచిక [a] ప్రధాన పాఠ్యంలో ఉంచబడింది.
