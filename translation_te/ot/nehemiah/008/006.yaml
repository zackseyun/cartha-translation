  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְבָ֣רֶךְ עֶזְרָ֔א אֶת יְהוָ֥ה הָ/אֱלֹהִ֖ים הַ/גָּד֑וֹל וַ/יַּֽעֲנ֨וּ כָל הָ/עָ֜ם אָמֵ֤ן אָמֵן֙ בְּ/מֹ֣עַל יְדֵי/הֶ֔ם וַ/יִּקְּד֧וּ וַ/יִּשְׁתַּחֲוֻּ֛ לַ/יהוָ֖ה אַפַּ֥יִם אָֽרְצָ/ה־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/006.yaml
  text: And Ezra blessed Yahweh[a], the great God, and all the people answered, “Amen, Amen,” while lifting up their hands. Then they bowed down and worshiped Yahweh with their faces to the ground.
translation:
  language: te
  text: ఎజ్రా మహా దేవుడైన యాహ్వేను స్తుతించాడు. ప్రజలందరూ తమ చేతులు పైకెత్తి, “ఆమేన్, ఆమేన్”[a] అని జవాబిచ్చారు. తరువాత వారు వంగి, ముఖాలు నేలకు ఆనించి యాహ్వేను ఆరాధించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో “ఆమేన్, ఆమేన్”; ఇది సమ్మతిని బలంగా తెలిపే పునరుక్త ఆరాధనా ప్రతిస్పందన.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְבָרֶךְ
  choice: స్తుతించాడు
  rationale: దేవుడు కర్మగా వచ్చినప్పుడు ברך పియేల్ రూపం దేవుణ్ణి ఘనపరుస్తూ స్తుతించడాన్ని సూచిస్తుంది. తెలుగులో ‘దేవుణ్ణి ఆశీర్వదించాడు’ అనే పదశః రూపం అపార్థానికి దారితీయవచ్చు; ‘స్తుతించాడు’ సందర్భార్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పండితీయ ఉచ్చారణను తెలుగులో లిప్యంతరీకరించింది.
- source_word: הָאֱלֹהִים הַגָּדוֹל
  choice: మహా దేవుడైన
  rationale: యాహ్వేను ‘మహా దేవుడు’గా గుర్తించే హీబ్రూ అన్వయ నిర్మాణాన్ని సహజమైన తెలుగు విశేషణ నిర్మాణంలో నిలుపుతుంది.
- source_word: וַיַּעֲנוּ
  choice: జవాబిచ్చారు
  rationale: ప్రజలు పలికిన సామూహిక ప్రతిస్పందనను నేరుగా వ్యక్తపరుస్తుంది.
- source_word: אָמֵן אָמֵן
  choice: ఆమేన్, ఆమేన్
  rationale: ఆరాధనా సమ్మతి ప్రకటనను లిప్యంతరీకరించి, దాని ఉద్ఘాటనాత్మక పునరుక్తిని యథాతథంగా ఉంచింది.
- source_word: בְּמֹעַל יְדֵיהֶם
  choice: తమ చేతులు పైకెత్తి
  rationale: ప్రజలు సమాధానం పలుకుతున్నప్పుడు చేసిన తోడు చర్యను సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: וַיִּקְּדוּ
  choice: వంగి
  rationale: קדד సూచించే శరీరాన్ని కిందికి వంచే చర్యను సంక్షిప్తంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: וַיִּשְׁתַּחֲווּ
  choice: ఆరాధించారు
  rationale: ఈ క్రియలోని సాష్టాంగ భంగిమతో కూడిన ఆరాధనా భావాన్ని నిలుపుతుంది; ముందున్న ‘వంగి’తో రెండు క్రియల భేదం కూడా కొనసాగుతుంది.
- source_word: אַפַּיִם אָרְצָה
  choice: ముఖాలు నేలకు ఆనించి
  rationale: ‘ముఖాలు భూమివైపు’ అనే హీబ్రూ భంగిమను సాధారణ పాఠకునికి స్పష్టమైన తెలుగు రూపంలో అందిస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దానిని బిరుదుగా మార్చకుండా ‘యాహ్వే’గా లిప్యంతరీకరించడం మూలంలోని ప్రత్యేకతను కాపాడుతుంది.
- issue: దేవుణ్ణి ‘దీవించడం’ అనే ברך ప్రయోగం
  choice: స్తుతించాడు
  alternative: ఆశీర్వదించాడు
  rationale: హీబ్రూ ప్రయోగంలో దేవునివైపు పలికే ఘనత, స్తుతి భావం ఉంది. ఆధునిక తెలుగులో ‘ఆశీర్వదించాడు’ సాధారణంగా ఉన్నతుడు అధీనునికి మేలు పలకడాన్ని సూచించవచ్చు కాబట్టి, సందర్భార్థాన్ని వక్రీకరించకుండా ‘స్తుతించాడు’ ఎంచుకుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామూహిక పఠనానికి అనువైన శైలి వాడబడింది. శరీర భంగిమకు సంబంధించిన వరుస హీబ్రూ క్రియలను ఒకటిగా కలపకుండా ‘వంగి ... ఆరాధించారు’గా వేరు చేసింది. అందించిన ఆంగ్ల సంప్రదింపు పాఠంలో [a] గుర్తు దైవనామం వద్ద కనిపించినప్పటికీ, దాని గమనిక ‘ఆమేన్, ఆమేన్’ గురించి కావడంతో సంబంధిత పదబంధం వద్ద గుర్తు ఉంచబడింది.
