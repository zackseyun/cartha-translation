  text: וָ/אַעֲלֶה֙ אֶת שָׂרֵ֣י יְהוּדָ֔ה מֵ/עַ֖ל לַ/חוֹמָ֑ה וָ/אַעֲמִ֡ידָ/ה שְׁתֵּ֣י תוֹדֹת֩ גְּדוֹלֹ֨ת וְ/תַהֲלֻכֹ֤ת לַ/יָּמִין֙ מֵ/עַ֣ל לַ/חוֹמָ֔ה לְ/שַׁ֖עַר הָ/אַשְׁפֹּֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/031.yaml
  text: Then I brought the leaders of Judah up onto the wall[a], and I appointed two great thanksgiving choirs and processions[b], one going to the right on the wall toward the Dung Gate.
translation:
  language: te
  text: అప్పుడు నేను యూదా నాయకులను ప్రాకారం మీదికి తీసుకువెళ్లి, రెండు గొప్ప కృతజ్ఞతాస్తుతి బృందాలను[a], వాటి ఊరేగింపులను ఏర్పాటు చేశాను. వాటిలో ఒకటి ప్రాకారం మీదుగా కుడివైపున పెంట ద్వారం వైపు వెళ్లింది.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పదబంధం పదశః ‘రెండు గొప్ప కృతజ్ఞతలు.’ ఇక్కడ అది కేవలం కృతజ్ఞతా కార్యాలను కాక, కృతజ్ఞతాస్తుతులు చెల్లిస్తూ ఊరేగిన వ్యవస్థీకృత బృందాలను సూచిస్తున్నట్లు కనిపిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘పెంట ద్వారం వరకు.’ ఈ దిశాసూచక సందర్భంలో హీబ్రూ ఉపసర్గను ‘వైపు’ అని గానీ ‘వరకు’ అని గానీ అనువదించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: וָאַעֲלֶה
  choice: తీసుకువచ్చి
  rationale: עלה అనే క్రియ హిఫీల్ రూపంలో ‘పైకి తీసుకురావడం’ అనే కారక భావాన్ని ఇస్తుంది; ప్రాకారం మీదికి తీసుకురావడాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: שָׂרֵי יְהוּדָה
  choice: యూదా నాయకులను
  rationale: שָׂרִים అనేది అధిపతులు, అధికారులు లేదా నాయకులను సూచించగలదు. ఇక్కడ రాజకుమారులనే పరిమిత భావం రాకుండా పౌర నాయకత్వాన్ని సూచించే ‘నాయకులు’ సరిపోతుంది.
- source_word: מֵעַל לַחוֹמָה
  choice: ప్రాకారం మీదికి
  rationale: ప్రాకారం పైభాగానికి ఎక్కించి తీసుకురావడం అనే గమన భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: וָאַעֲמִידָה
  choice: ఏర్పాటు చేశాను
  rationale: עמד హిఫీల్ రూపానికి ‘నిలబెట్టు, స్థానంలో ఉంచు’ అనే భావం ఉంది. ఆరాధనా ఊరేగింపు బృందాలను క్రమపరచిన సందర్భంలో ‘ఏర్పాటు చేశాను’ సహజంగా ఉంది.
- source_word: תּוֹדֹת גְּדוֹלֹת
  choice: కృతజ్ఞతాస్తుతులు చెల్లించే రెండు పెద్ద బృందాలను
  rationale: పదశః ‘రెండు గొప్ప కృతజ్ఞతలు’; అయితే ఈ అంకితోత్సవ సందర్భంలో కృతజ్ఞతాస్తుతులు చెల్లించే సమూహాలను సూచించే లక్షణార్థక ప్రయోగం. ‘బృందాలు’ అనడం మూలంలోని భావాన్ని సహజంగా తెలియజేస్తూ, అవి తప్పనిసరిగా కేవలం గాయకబృందాలేనని అధికంగా నిర్దిష్టం చేయదు.
- source_word: וְתַהֲלֻכֹת
  choice: ఊరేగింపులుగా
  rationale: הלך మూలం నుంచి వచ్చిన ఈ పదం నడక, కదలిక లేదా ఊరేగింపును సూచిస్తుంది. ప్రాకారం మీద క్రమబద్ధంగా సాగిన బృందాలకు ‘ఊరేగింపులుగా’ సందర్భోచితం.
- source_word: לַיָּמִין
  choice: కుడివైపుగా
  rationale: మూలంలోని ‘కుడివైపుకు’ అనే ప్రత్యక్ష దిశను నిలుపుతుంది; దానిని ఊహాపూర్వకంగా ‘దక్షిణం వైపు’ అని మార్చదు.
- source_word: לְשַׁעַר הָאַשְׁפֹּת
  choice: పెంట ద్వారం వైపు
  rationale: אַשְׁפֹּת అంటే పెంట లేదా చెత్త. ‘పెంట ద్వారం’ సాంప్రదాయకంగా గుర్తించదగిన ద్వారనామం; לְ ఉపసర్గలోని దిశాభావాన్ని ‘వైపు’ తెలియజేస్తుంది.
