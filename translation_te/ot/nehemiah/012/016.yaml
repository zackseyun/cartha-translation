lexical_decisions:
- source_word: ל/עדיא
  choice: అదాయాకు
  rationale: WLC పాఠంలో ఉన్న עֲדָיָא అనే వ్యక్తి/వంశనామాన్ని ‘అదాయా’గా లిప్యంతరీకరించాం. ముందు ఉన్న לְ ఈ యాజక కుటుంబానికి సంబంధించిన ప్రతినిధిని సూచించే జాబితా నిర్మాణం కాబట్టి తెలుగులో సహజంగా ‘-కు’ అని ఇచ్చాం.
- source_word: זְכַרְיָה
  choice: జెకర్యా
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగులో సాధారణంగా వాడే బైబిలు రూపాన్ని ఎంచుకున్నాం.
- source_word: לְ/גִנְּתוֹן
  choice: గిన్నెతోనుకు
  rationale: గిన్నెతోను అనే యాజక కుటుంబం/వంశంతో తరువాతి వ్యక్తికి ఉన్న ప్రాతినిధ్య సంబంధాన్ని לְ సూచిస్తుంది; జాబితా శైలిని నిలుపుతూ ‘-కు’ అని అనువదించాం.
- source_word: מְשֻׁלָּם
  choice: మెషుల్లాము
  rationale: హీబ్రూ వ్యక్తినామాన్ని దాని ధ్వనిరూపానికి దగ్గరగా తెలుగులో లిప్యంతరీకరించాం.
