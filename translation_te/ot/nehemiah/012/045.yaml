  rationale: చివరి ఆజ్ఞ-పదబంధాన్ని నేరుగా ‘నిర్వర్తించారు’ మరియు ‘అలాగే చేశారు’ అనే క్రియలకు అనుసంధానించాం. దీనివల్ల హీబ్రూ వాక్యంలోని దావీదు, సొలొమోను ఆజ్ఞకు అనుగుణంగా విధులు నిర్వహించిన భావం నిలుస్తుంది. గాయకులు, ద్వారపాలకుల విషయంలో మూలంలోని సంక్షిప్తతను పాదటిప్పణిలో భద్రపరుస్తూ ప్రధాన పాఠంలో సహజమైన స్పష్టీకరణను ఉంచాం.
