id: NEH.12.45
reference: Nehemiah 12:45
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַֽ/יִּשְׁמְר֞וּ מִשְׁמֶ֤רֶת אֱלֹֽהֵי/הֶם֙ וּ/מִשְׁמֶ֣רֶת הַֽ/טָּהֳרָ֔ה וְ/הַ/מְשֹׁרְרִ֖ים וְ/הַ/שֹּׁעֲרִ֑ים כְּ/מִצְוַ֥ת דָּוִ֖יד שְׁלֹמֹ֥ה בְנֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/045.yaml
  text: And they kept the charge of their God and the charge of purification[a], and so did the singers and the gatekeepers[b], according to the command of David and Solomon his son.
translation:
  language: te
  text: వారు తమ దేవునికి సంబంధించిన బాధ్యతను, శుద్ధీకరణకు సంబంధించిన బాధ్యతను[a] నిర్వర్తించారు; గాయకులు, ద్వారపాలకులు కూడా అలాగే చేశారు[b], దావీదు మరియు అతని కుమారుడైన సొలొమోను ఆజ్ఞ ప్రకారం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘శుద్ధి చేయడానికి సంబంధించిన విధిని’ లేదా ‘శుద్ధతకు సంబంధించిన విధిని.’
    reason: lexical_alternative
  - marker: b
    text: ‘గాయకులు, ద్వారపాలకులు’ అనే హీబ్రూ పదబంధం సంక్షిప్తంగా ఉంది; ఈ వర్గాలు కూడా తమకు నియమించబడిన విధులను నిర్వర్తించాయని బహుశా అర్థం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמְרוּ מִשְׁמֶרֶת
  choice: బాధ్యతను నిర్వర్తించారు
  rationale: שׁמר + מִשְׁמֶרֶת అనే పదబంధం అప్పగించబడిన విధిని నమ్మకంగా నిర్వహించడాన్ని సూచిస్తుంది. తెలుగులో ‘బాధ్యతను నిర్వర్తించారు’ సహజంగా ఉండి ఆ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: אֱלֹהֵיהֶם
  choice: తమ దేవునికి సంబంధించిన
  rationale: హీబ్రూలోని బహువచన స్వామ్య ప్రత్యయాన్ని ‘తమ’ ద్వారా నిలిపి, దేవునికి సంబంధించిన సేవాబాధ్యత అనే సంబంధాన్ని స్పష్టం చేస్తుంది.
- source_word: מִשְׁמֶרֶת הַטָּהֳרָה
  choice: శుద్ధీకరణకు సంబంధించిన బాధ్యత
  rationale: దేవాలయ సేవా సందర్భంలో טָהֳרָה ఆచారపరమైన శుద్ధి లేదా శుద్ధీకరణను సూచిస్తుంది. ‘శుద్ధీకరణ’ ఆ ప్రక్రియాత్మక భావాన్ని నిలుపుతుంది.
- source_word: וְהַמְשֹׁרְרִים וְהַשֹּׁעֲרִים
  choice: గాయకులు, ద్వారపాలకులు కూడా తమ బాధ్యతలను నిర్వర్తించారు
  rationale: మూలంలోని క్రియారహిత పదబంధం సంక్షిప్తార్థకమైనది. ఈ వర్గాలు కూడా తమకు అప్పగించిన విధులను నిర్వర్తించాయని సందర్భం సూచిస్తుంది; ‘కూడా’ మరియు పునరుక్త క్రియ తెలుగులో అర్థాన్ని సహజంగా చేస్తాయి.
- source_word: שֹׁעֲרִים
  choice: ద్వారపాలకులు
  rationale: దేవాలయ ద్వారాల వద్ద నియమించబడిన సేవకులను సూచించే సహజమైన, నిర్దిష్టమైన తెలుగు పదం.
- source_word: כְּמִצְוַת
  choice: ఇచ్చిన ఆజ్ఞ ప్రకారం
  rationale: מִצְוָה ఇక్కడ దేవాలయ సేవకు సంబంధించిన అధికారపూర్వక నిర్దేశాన్ని సూచిస్తుంది. ‘ఆజ్ఞ ప్రకారం’ స్పష్టమైన ఆధునిక తెలుగు.
- source_word: דָּוִיד שְׁלֹמֹה בְנוֹ
  choice: దావీదు, అతని కుమారుడైన సొలొమోను
  rationale: ‘అతని కుమారుడు’ సొలొమోనును సూచిస్తుందని స్పష్టంగా తెలియజేస్తూ, హీబ్రూ నామక్రమాన్ని సాధ్యమైనంతవరకు నిలుపుతుంది.
theological_decisions:
- issue: దేవాలయ సేవా సందర్భంలో הַטָּהֳרָה స్వభావం
  choice: శుద్ధీకరణ
  alternative: శుద్ధత / శుభ్రపరచడం
  rationale: ఈ వాక్యం లేవీయుల దేవాలయ సేవా విధుల గురించి ఉన్నందున, సాధారణ నైతిక పవిత్రతకన్నా ఆచారపరమైన శుద్ధి భావమే ప్రధానమైనది. ‘శుద్ధీకరణ’ తరువాతి కాలపు ప్రత్యేక సిద్ధాంతాన్ని చేర్చకుండా ఆ భావాన్ని నిలుపుతుంది.
- issue: గాయకులు, ద్వారపాలకుల వాక్యనిర్మాణ సంబంధం
  choice: వారు కూడా తమ బాధ్యతలను నిర్వర్తించారని స్పష్టీకరించడం
  alternative: వారిని ముందు పేర్కొన్న బాధ్యతలతో నేరుగా జాబితాలో కలపడం
  rationale: హీబ్రూ వాక్యం సంక్షిప్తంగా, కొంత అసంపూర్ణంగా ఉంది. సందర్భానుసారం ఈ రెండు వర్గాలూ తమ నియమిత సేవలను నిర్వహించాయని అర్థమవుతుంది; పాదటిప్పణి ద్వారా మూలంలోని సంక్షిప్తతను తెలియజేస్తూ ప్రధాన పాఠాన్ని సహజంగా ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘బాధ్యతను నిర్వర్తించారు’ అనే ప్రయోగం మూలంలోని శׁמר/מִשְׁמֶרֶת పదబంధాన్ని పదశః అనుకరించకుండా దాని కార్యార్థాన్ని తెలియజేస్తుంది. మూలంలోని సంక్షిప్త వాక్యనిర్మాణాన్ని పాదటిప్పణిలో భద్రపరిచాం.
