source:
  edition: WLC
  text: וְ/עַל֩ שַׁ֨עַר הָ/עַ֜יִן וְ/נֶגְדָּ֗/ם עָלוּ֙ עַֽל מַעֲלוֹת֙ עִ֣יר דָּוִ֔יד בַּֽ/מַּעֲלֶ֖ה לַ/חוֹמָ֑ה מֵ/עַל֙ לְ/בֵ֣ית דָּוִ֔יד וְ/עַ֛ד שַׁ֥עַר הַ/מַּ֖יִם מִזְרָֽח־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/037.yaml
  text: And by the Fountain Gate[a], in front of them, they went up by the stairs of the city of David, at the ascent of the wall, above the house of David[b], and as far as the Water Gate on the east.
translation:
  language: te
  text: ఊట ద్వారం[a] వద్ద, వారికి ఎదురుగా, వారు దావీదు పట్టణపు మెట్ల[b] మీదుగా పైకి వెళ్లి, గోడ ఎక్కుదారి వద్ద దావీదు ఇంటికి ఎగువగా సాగి, తూర్పువైపు ఉన్న నీటి ద్వారం వరకు వెళ్లారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘నీటి ఊట ద్వారం.’ ఇక్కడి హీబ్రూ పదం సహజంగా ఉబికివచ్చే నీటి ఊటను లేదా నీటి మూలాన్ని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘దావీదు పట్టణపు ఎక్కుదారుల మీదుగా.’ హీబ్రూ పదం నిర్మించిన మెట్లను లేదా సాధారణంగా పైకి ఎక్కే మార్గాలను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁעַר הָעַיִן
  choice: ఊట ద్వారం
  rationale: עַיִן ఇక్కడ నీరు ఉబికివచ్చే సహజ ఊటను సూచిస్తుంది. ‘ఊట ద్వారం’ స్థలనామంగా సహజంగా ఉండి భౌగోళిక భావాన్ని నిలుపుతుంది.
- source_word: וְנֶגְדָּם
  choice: తమ ఎదురుగా ఉన్న
  rationale: נֶגֶד పదంలోని ‘ఎదురుగా/ముందుగా’ అనే స్థానసంబంధ భావాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది; అది దారి లేదా మెట్ల స్థానాన్ని సూచించేలా మూలంలోని అనిశ్చితిని పూర్తిగా తొలగించదు.
- source_word: עָלוּ עַל מַעֲלוֹת עִיר דָּוִיד
  choice: దావీదు పట్టణపు మెట్ల మీదుగా వారు పైకి వెళ్లారు
  rationale: עלה లోని పైకి కదలికను, מַעֲלוֹת లోని మెట్లు లేదా ఎక్కే వరుస దారుల భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: בַּמַּעֲלֶה לַחוֹמָה
  choice: గోడవైపు ఎక్కే దారిలో
  rationale: మూలంలోని ఏకవచన ‘ఎక్కే చోటు/దారి’ అనే భౌగోళిక భావాన్ని సహజమైన తెలుగులో అందిస్తుంది; గోడకు చెందిన ఎత్తుదారిగా కూడా అర్థం చేసుకునే అవకాశాన్ని నిరాకరించదు.
- source_word: מֵעַל לְבֵית דָּוִיד
  choice: దావీదు ఇంటికి ఎగువగా
  rationale: מֵעַל యొక్క ఎత్తులో పైభాగాన అనే సంబంధాన్ని కాపాడుతుంది. בֵּיתను ఆధారంలేకుండా ‘రాజభవనం’గా ప్రత్యేకీకరించకుండా ‘ఇల్లు’గా అనువదిస్తుంది.
- source_word: שַׁעַר הַמַּיִם מִזְרָח
  choice: తూర్పు దిశగా నీటి ద్వారం వరకు
  rationale: מִזְרָחను దిశాసూచకంగా అనువదించడం వల్ల అది ప్రయాణ దిశను లేదా ద్వారం తూర్పు స్థానాన్ని సూచించవచ్చనే మూలంలోని కొంత అనిశ్చితి నిలుస్తుంది.
- source_word: וְעַל שַׁעַר
  choice: ఊట ద్వారం దగ్గర
  rationale: ఈ భౌగోళిక వర్ణనలో עַל సమీపస్థానాన్ని సూచిస్తుంది; ‘దగ్గర’ ఆధునిక తెలుగులో సహజంగా ఉంది.
