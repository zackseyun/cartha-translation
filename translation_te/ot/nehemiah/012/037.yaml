translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన కానీ గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. పొడవైన హీబ్రూ మార్గవర్ణనను చదవడానికి సులభంగా రెండు వాక్యాలుగా విభజించినా, ప్రయాణ క్రమం మరియు అన్ని భౌగోళిక సూచనలు నిలుపబడ్డాయి. ఇంగ్లీషు సంప్రదింపు పాఠ్యంలో [b] గుర్తు ‘దావీదు ఇంటి’ తరువాత ఉన్నప్పటికీ దాని గమనిక మెట్లకు సంబంధించినది కాబట్టి, తెలుగులో దాన్ని సంబంధిత పదమైన ‘మెట్ల’ తరువాత ఉంచాం.
