    text: కొన్ని ప్రతులు మరియు అనువాదాలు ఇక్కడ ‘యోనాతాను’కు బదులుగా ‘యోహానాను’ అని చదువుతాయి. ఇక్కడ అనుసరించిన హీబ్రూ పాఠంలో ‘యోనాతాను’ అని ఉంది.
    reason: alternative_reading
lexical_decisions:
- source_word: וְ
  choice: '[ప్రత్యేకంగా అనువదించలేదు]'
  rationale: వంశావళిలో ముందరి వాక్యంతో ఉన్న అనుసంధానం తెలుగులో వాక్యక్రమం ద్వారానే సహజంగా తెలుస్తుంది; ప్రారంభంలో ‘మరియు’ అనడం అసహజంగా ఉంటుంది.
- source_word: יוֹיָדָע
  choice: యోయాదా
  rationale: హీబ్రూ వ్యక్తిపేరును ఆధునిక తెలుగు లిపిలో మూల ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించాం.
- source_word: הוֹלִיד
  choice: తండ్రి అయ్యాడు
  rationale: ఈ హిఫిల్ క్రియ వంశావళి సందర్భంలో ‘కనెను/తండ్రి అయ్యాడు’ అనే భావం ఇస్తుంది. ఆధునిక, స్పష్టమైన తెలుగులో పురుష వంశసంబంధాన్ని తెలియజేయడానికి ‘తండ్రి అయ్యాడు’ ఎంచుకున్నాం.
- source_word: אֶת
  choice: '[అనువదించలేదు]'
  rationale: ఇది హీబ్రూలో నిర్దిష్ట ప్రత్యక్ష కర్మను సూచించే వ్యాకరణ చిహ్నం; తెలుగులో దీనికి ప్రత్యేక పదం అవసరం లేదు.
- source_word: יוֹנָתָן
  choice: యోనాతాను
  rationale: ఇక్కడి హీబ్రూ పాఠం యోనాతాను అనే పేరునే సమర్థిస్తుంది; ప్రత్యామ్నాయ పాఠమైన యోహానాను పాదసూచికలో ఇచ్చాం.
- source_word: וְ
  choice: ;
  rationale: రెండవ వంశావళి ప్రకటనను ముందుదానితో కలపడానికి తెలుగులో విరామచిహ్నం సహజమైన అనుసంధానాన్ని అందిస్తుంది.
- source_word: יַדּוּעַ
  choice: యద్దూవ
  rationale: హీబ్రూ వ్యక్తిపేరు יַדּוּעַ ను మూల ధ్వనికి దగ్గరగా తెలుగు లిపిలో లిప్యంతరీకరించాం.
