id: NEH.12.36
reference: Nehemiah 12:36
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְֽ/אֶחָ֡י/ו שְֽׁמַעְיָ֡ה וַ/עֲזַרְאֵ֡ל מִֽלֲלַ֡י גִּֽלֲלַ֡י מָעַ֞י נְתַנְאֵ֤ל וִֽ/יהוּדָה֙ חֲנָ֔נִי בִּ/כְלֵי שִׁ֥יר דָּוִ֖יד אִ֣ישׁ הָ/אֱלֹהִ֑ים וְ/עֶזְרָ֥א הַ/סּוֹפֵ֖ר לִ/פְנֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/036.yaml
  text: and his brothers—Shemaiah[a], Azarel, Milalai, Gilalai, Maai, Nethanel, Judah, and Hanani—with the musical instruments of David the man of God, and Ezra the scribe before them.
translation:
  language: te
  text: అతని సహోదరులు—షెమయా, అజరేలు, మిలలై, గిలలై, మాయై, నెతనేలు, యూదా, హనానీ—దేవుని మనిషియైన దావీదు యొక్క సంగీత వాయిద్యాలతో ఉన్నారు; శాస్త్రియైన ఎజ్రా వారి ముందు ఉన్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֶחָיו
  choice: అతని సహోదరులైన
  rationale: మూలపదం అక్షరార్థంగా ‘అతని సహోదరులు’ అని సూచిస్తుంది; ఇక్కడ అదే లేవీయుల వర్గానికి చెందిన సన్నిహిత సహచరులు అనే భావం ఉండవచ్చుగాని, మూలంలోని బంధుత్వ పదాన్ని నిలిపాం.
- source_word: שְׁמַעְיָה ... חֲנָנִי
  choice: షెమయా, అజరేలు, మిలలై, గిలలై, మాయై, నెతనేలు, యూదా, హనానీ
  rationale: వ్యక్తుల పేర్లను ఆధునిక తెలుగు లిపిలో మూల ఉచ్చారణకు సమీపంగా లిప్యంతరీకరించాం.
- source_word: בִּכְלֵי שִׁיר
  choice: సంగీత వాయిద్యాలతో
  rationale: כְּלֵי అంటే పనిముట్లు లేదా వాయిద్యాలు; שִׁיר అంటే పాట లేదా సంగీతం. సందర్భానికి సహజమైన తెలుగు రూపం ‘సంగీత వాయిద్యాలు’.
- source_word: דָּוִיד אִישׁ הָאֱלֹהִים
  choice: దేవుని మనిషి అయిన దావీదు
  rationale: ‘దేవుని మనిషి’ అనే బైబిలు గౌరవబిరుదును నిలిపి, అది దావీదును విశేషిస్తుందని స్పష్టంగా తెలిపాం.
- source_word: וְעֶזְרָא הַסּוֹפֵר
  choice: శాస్త్రి అయిన ఎజ్రా
  rationale: הַסּוֹפֵר అంటే లేఖకుడు/శాస్త్రి. ఎజ్రా పాత్రకు తెలుగు బైబిలు వాడుకలో సహజమైన ‘శాస్త్రి’ని ఎంచుకున్నాం.
- source_word: לִפְנֵיהֶם
  choice: వారికి ముందుగా నడిచాడు
  rationale: ఊరేగింపు సందర్భంలో ఈ పదబంధం వారి ముందు ఉన్న స్థానాన్ని సూచిస్తుంది; సహజ తెలుగులో క్రియను పూరించి ‘ముందుగా నడిచాడు’ అని ఇచ్చాం.
theological_decisions:
- issue: אִישׁ הָאֱלֹהִים అనే గౌరవబిరుదు
  choice: దేవుని మనిషి
  alternative: దేవునికి చెందిన మనిషి
  rationale: ఇది దావీదుకు వాడిన సాంప్రదాయ బైబిలు గౌరవబిరుదు. అదనపు సిద్ధాంతార్థాన్ని చేర్చకుండా మూలంలోని రూపాన్నీ అంతర్గ్రంథ సంబంధాన్నీ నిలుపుతుంది.
- issue: దావీదు మరియు సంగీత వాయిద్యాల మధ్య సంబంధం
  choice: దావీదు ఏర్పాటు చేసిన సంగీత వాయిద్యాలు
  alternative: దావీదు సంగీత వాయిద్యాలు
  rationale: హీబ్రూ నిర్మాణం వాయిద్యాలను దావీదుతో అనుసంధానిస్తుంది కానీ ఆ సంబంధ స్వభావాన్ని పూర్తిగా పేర్కొనదు. సందర్భంలో అవి దావీదు నిర్దేశించిన లేదా ఏర్పాటు చేసిన ఆలయ సంగీత వాయిద్యాలని భావించడం సహజం; అయినా ‘చేసిన’ లేదా ‘సొంతమైన’ అని చెప్పకుండా పరిమిత వివరణను ఎంచుకున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే వాక్యనిర్మాణం. పేర్లు తెలుగు బైబిలు శైలికి అనుగుణంగా లిప్యంతరీకరించబడ్డాయి. మూలంలోని జాబితా స్వరూపాన్ని కాపాడుతూ, తెలుగులో సంపూర్ణ వాక్యంగా చదవడానికి అవసరమైన క్రియలను పూరించాం.
