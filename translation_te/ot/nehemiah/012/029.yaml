  terminology: “గాయకులు” is precise for הַמְשֹׁרֲרִים, and “గ్రామాలను” is well suited to חֲצֵרִים in this geographical context. The place names are appropriately transliterated. The footnote offers a legitimate lexical alternative without presenting it as the preferred sense.
