translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని ఉపయోగించాం. ఈ వచనం ముందటి వచనంలోని క్రియను కొనసాగిస్తున్నందున, తెలుగులో వాక్యాన్ని సంపూర్ణంగా చేయడానికి ‘వారు వచ్చారు’ అని సందర్భానుసారంగా చేర్చాం. స్థలనామాలను తెలుగు బైబిలు వాడుకకు దగ్గరగా లిప్యంతరీకరించాం.
