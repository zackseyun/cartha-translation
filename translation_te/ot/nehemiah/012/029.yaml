id: NEH.12.29
reference: Nehemiah 12:29
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/מִ/בֵּית֙ הַגִּלְגָּ֔ל וּ/מִ/שְּׂד֥וֹת גֶּ֖בַע וְ/עַזְמָ֑וֶת כִּ֣י חֲצֵרִ֗ים בָּנ֤וּ לָ/הֶם֙ הַ/מְשֹׁ֣רֲרִ֔ים סְבִיב֖וֹת יְרוּשָׁלִָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/029.yaml
  text: and from Beth-gilgal[a], and from the fields of Geba and Azmaveth, for the singers had built villages for themselves around Jerusalem.
translation:
  language: te
  text: బేత్‌-గిల్గాలు నుండీ, గెబా, అజ్మావెతు పొలాల నుండీ వారు వచ్చారు. ఎందుకంటే గాయకులు యెరూషలేము చుట్టుపక్కల తమ కోసం గ్రామాలను[a] కట్టుకున్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నివాస ప్రాంతాలను.’ హీబ్రూ పదం కంచెతో చుట్టబడిన నివాస స్థలాలను కూడా సూచించగలదు; ఇక్కడ గాయకులు యెరూషలేము చుట్టుపక్కల నివసించిన ప్రాంతాలనే సూచిస్తోంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִבֵּית הַגִּלְגָּל
  choice: బేత్‌-గిల్గాలు నుండీ
  rationale: בֵּית ఇక్కడ ఒక భవనాన్ని సూచించడం కంటే స్థలనామంలో భాగంగా ఉండే అవకాశం ఎక్కువ. అందువల్ల స్థలనామాన్ని లిప్యంతరీకరించాం.
- source_word: וּמִשְּׂדוֹת גֶּבַע וְעַזְמָוֶת
  choice: గెబా, అజ్మావెతు పొలాల నుండీ
  rationale: שְּׂדוֹת అనే బహువచన పదానికి నేరమైన అర్థం ‘పొలాలు’; ఇక్కడ అది ఈ పట్టణాలకు సంబంధించిన వ్యవసాయ ప్రాంతాలను సూచిస్తుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: గాయకులు ఈ ప్రాంతాల నుంచి ఎందుకు వచ్చారో వివరించే కారణార్థక సంబంధాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: חֲצֵרִים
  choice: గ్రామాలను
  rationale: ఈ సందర్భంలో ఈ పదం ఆవరణలను కాక, యెరూషలేము చుట్టూ గాయకులు నివసించేందుకు ఏర్పరచుకున్న చిన్న నివాస ప్రాంతాలను సూచిస్తుంది.
- source_word: בָּנוּ לָהֶם
  choice: తమ కోసం ... కట్టుకున్నారు
  rationale: בָּנוּ యొక్క ‘కట్టారు’ అనే మూలార్థాన్నీ, לָהֶם యొక్క స్వప్రయోజన భావాన్నీ సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: הַמְשֹׁרֲרִים
  choice: గాయకులు
  rationale: ఈ రూపం పాడేవారిని నిర్దిష్టంగా సూచిస్తుంది; విస్తృతార్థమున్న ‘సంగీతకారులు’ కంటే ‘గాయకులు’ మూలానికి దగ్గరగా ఉంటుంది.
- source_word: סְבִיבוֹת יְרוּשָׁלִָם
  choice: యెరూషలేము చుట్టుపక్కల
  rationale: నగరాన్ని చుట్టుముట్టిన సమీప ప్రాంతమనే స్థలార్థాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
