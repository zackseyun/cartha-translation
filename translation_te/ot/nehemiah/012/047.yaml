source:
  edition: WLC
  text: וְ/כָל יִשְׂרָאֵל֩ בִּ/ימֵ֨י זְרֻבָּבֶ֜ל וּ/בִ/ימֵ֣י נְחֶמְיָ֗ה נֹֽתְנִ֛ים מְנָי֛וֹת הַ/מְשֹׁרְרִ֥ים וְ/הַ/שֹּׁעֲרִ֖ים דְּבַר י֣וֹם בְּ/יוֹמ֑/וֹ וּ/מַקְדִּשִׁים֙ לַ/לְוִיִּ֔ם וְ/הַ/לְוִיִּ֔ם מַקְדִּשִׁ֖ים לִ/בְנֵ֥י אַהֲרֹֽן־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/047.yaml
  text: And all Israel[a], in the days of Zerubbabel and in the days of Nehemiah, gave the portions for the singers and the gatekeepers, as each day required; and they set apart the consecrated portions for the Levites[c][b], and the Levites set apart the consecrated portions for the sons of Aaron.
translation:
  language: te
  text: జెరుబ్బాబెలు కాలంలోనూ నెహెమ్యా కాలంలోనూ ఇశ్రాయేలంతా గాయకులకు, ద్వారపాలకులకు ప్రతిరోజూ అవసరమైన వాటాలను ఇచ్చేవారు. లేవీయుల కోసం ప్రతిష్ఠిత వాటాలను ప్రత్యేకించేవారు[a]; లేవీయులు కూడా అహరోను కుమారుల కోసం ప్రతిష్ఠిత వాటాలను ప్రత్యేకించేవారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ‘ప్రతిష్ఠిత వాటాలను’ అనే కర్మ ప్రత్యక్షంగా లేదు; ‘లేవీయుల కోసం ప్రతిష్ఠించేవారు’ అని అక్షరార్థంగా ఉంటుంది. సందర్భం మరియు సమాంతర నిర్మాణం ఆధారంగా కర్మను పాఠ్యంలో స్పష్టం చేశారు.
    reason: implicit_object
  - marker: b
    text: అంటే, అహరోను వంశపు యాజకుల కోసం.
    reason: lexical_clarification
lexical_decisions:
- source_word: וְכָל יִשְׂרָאֵל
  choice: ఇశ్రాయేలంతా
  rationale: హీబ్రూలోని సమష్టి జాతీయ వ్యక్తీకరణను సహజమైన తెలుగులో నిలుపుతుంది; ‘ఇశ్రాయేలీయులందరూ’ కూడా సాధ్యమే.
- source_word: בִּימֵי זְרֻבָּבֶל וּבִימֵי נְחֶמְיָה
  choice: జెరుబ్బాబెలు కాలంలోనూ నెహెమ్యా కాలంలోనూ
  rationale: మూలంలోని పునరుక్త నిర్మాణాన్నీ, రెండు చారిత్రక కాలాలపై ఉన్న ప్రత్యేక దృష్టినీ నిలుపుతుంది.
- source_word: נֹתְנִים
  choice: ఇచ్చేవారు
  rationale: హీబ్రూ కృదంతం ఇక్కడ గతంలో అలవాటుగా, నిరంతరంగా జరిగిన కార్యాన్ని సూచిస్తుంది.
- source_word: מְנָיוֹת
  choice: వాటాలను
  rationale: ఆలయ సేవకుల కోసం కేటాయించిన ఆహార లేదా ఆదాయ భాగాలను సూచించే సహజమైన ఆధునిక తెలుగు పదం.
- source_word: הַמְשֹׁרְרִים וְהַשֹּׁעֲרִים
  choice: గాయకులకు, ద్వారపాలకులకు
  rationale: ఆలయ సేవలోని స్థిరమైన రెండు బాధ్యతలను స్పష్టంగా సూచిస్తుంది.
- source_word: דְּבַר יוֹם בְּיוֹמוֹ
  choice: ప్రతిరోజూ అవసరమైన
  rationale: ‘ఒక దినపు విషయం దాని దినాన’ అనే హీబ్రూ నుడికారంలోని రోజువారీ అవసరం లేదా నియమిత పరిమాణం అనే భావాన్ని సహజంగా అందిస్తుంది.
- source_word: וּמַקְדִּשִׁים לַלְוִיִּם
  choice: లేవీయుల కోసం ప్రతిష్ఠిత వాటాలను ప్రత్యేకించేవారు
  rationale: קדשׁ పదంలోని పవిత్రంగా కేటాయించే భావాన్ని నిలుపుతూ, తెలుగులో క్రియకు అవసరమైన అవ్యక్త కర్మను సందర్భం ఆధారంగా ‘ప్రతిష్ఠిత వాటాలు’ అని స్పష్టం చేస్తుంది.
- source_word: וְהַלְוִיִּם מַקְדִּשִׁים לִבְנֵי אַהֲרֹן
  choice: లేవీయులు కూడా అహరోను కుమారుల కోసం ప్రతిష్ఠిత వాటాలను ప్రత్యేకించేవారు
  rationale: మూలంలోని సమాంతర నిర్మాణాన్ని నిలుపుతుంది; ‘అహరోను కుమారులు’ అనే వంశపరమైన పదబంధాన్ని నేరుగా అనువదిస్తుంది.
theological_decisions:
- issue: מַקְדִּשִׁים అనే క్రియకు ఈ ఆలయ-పోషణ సందర్భంలో ఉన్న భావం
  choice: పవిత్ర ప్రయోజనం కోసం వాటాలను ప్రత్యేకించడం
  alternative: సాధారణంగా ‘ఇవ్వడం’ లేదా ‘చెల్లించడం’
  rationale: קדשׁ యొక్క పవిత్రంగా చేయడం లేదా ప్రత్యేకించడం అనే మూలభావాన్ని ఆలయ సందర్భం బలపరుస్తుంది. అయితే హీబ్రూలో కర్మ ప్రత్యక్షంగా లేకపోవడంతో, ‘ప్రతిష్ఠిత వాటాలు’ అనేది సందర్భం ద్వారా పూరించబడిందని పాదసూచికలో తెలియజేయబడింది.
- issue: בְנֵי אַהֲרֹן గుర్తింపు
  choice: అహరోను కుమారులు
  alternative: అహరోను వంశపు యాజకులు
  rationale: వంశపరమైన మూలవ్యక్తీకరణను ప్రధాన పాఠ్యంలో నిలుపుతూ, అది యాజకులను సూచిస్తుందని పాదసూచిక వివరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన చారిత్రక-ఆరాధనా శైలి వాడబడింది. ‘ఇచ్చేవారు’, ‘ప్రత్యేకించేవారు’ అనే రూపాలు హీబ్రూ కృదంతాల అలవాటైన, కొనసాగిన చర్య భావాన్ని సహజంగా వ్యక్తం చేస్తాయి.
