base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/012.yaml
  text: 'And in the days of Joiakim, there were priests, heads of the fathers’ houses: for Seraiah, Meraiah; for Jeremiah, Hananiah.'
translation:
  language: te
  text: 'యోయాకీము కాలంలో యాజకులైన పితృవంశాల ప్రధానులు వీరు: శెరాయా వంశానికి మెరాయా; యిర్మీయా వంశానికి హనన్యా.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבִימֵי יוֹיָקִים
  choice: యోయాకీము కాలంలో
  rationale: ‘యోయాకీము దినాల్లో’ అనే అక్షరార్థం కంటే కాలసూచనను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: כֹהֲנִים רָאשֵׁי הָאָבוֹת
  choice: యాజకులు, పితృకుటుంబాల అధిపతులు
  rationale: వీరు యాజకులని, తమ తమ వంశీయ కుటుంబ విభాగాలకు నాయకులని హెబ్రీ పదబంధం సూచిస్తుంది; ‘పితరుల అధిపతులు’ అనే అసహజ భావాన్ని నివారిస్తుంది.
- source_word: לִשְׂרָיָה מְרָיָה
  choice: శెరాయా పితృకుటుంబానికి మెరాయా
  rationale: לְ సంబంధసూచక ప్రయోగాన్ని ఈ వంశపారంపర్య జాబితా సందర్భంలో ‘పితృకుటుంబానికి’ అని స్పష్టం చేస్తుంది.
- source_word: לְיִרְמְיָה חֲנַנְיָה
  choice: యిర్మీయా పితృకుటుంబానికి హనన్యా
  rationale: ముందటి జతతో సమాంతర నిర్మాణాన్ని కాపాడుతూ సంబంధాన్ని సహజ తెలుగులో తెలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళి జాబితాకు తగిన సంక్షిప్తమైన, గౌరవప్రదమైన శైలి. హెబ్రీలోని సంక్షిప్త సంబంధ నిర్మాణాన్ని పాఠకుడికి అర్థమయ్యేలా స్వల్పంగా విప్పి చెప్పబడింది.
