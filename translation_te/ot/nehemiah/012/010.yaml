  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన వంశావళి శైలి. హీబ్రూ వాక్యంలో చివరి రెండు సంబంధాల్లో הוֹלִיד క్రియ అధ్యాహారంగా ఉన్నందున తెలుగులో స్పష్టత కోసం పునరుక్తి చేశాం.
