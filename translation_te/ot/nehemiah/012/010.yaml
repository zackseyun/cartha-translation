  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/יֵשׁ֖וּעַ הוֹלִ֣יד אֶת יֽוֹיָקִ֑ים וְ/יֽוֹיָקִים֙ הוֹלִ֣יד אֶת אֶלְיָשִׁ֔יב וְ/אֶלְיָשִׁ֖יב אֶת יוֹיָדָֽע־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/010.yaml
  text: Jeshua fathered Joiakim[a], and Joiakim fathered Eliashib[b], and Eliashib fathered Joiada.
translation:
  language: te
  text: యేషూవా యోయాకీముకు తండ్రియయ్యాడు[a]. యోయాకీము ఎల్యాషీబుకు తండ్రియయ్యాడు; ఎల్యాషీబు యోయాదాకు తండ్రియయ్యాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ వంశావళి సూత్రం అక్షరార్థంగా, “యేషూవా యోయాకీమును పుట్టించాడు” అని ఉంటుంది.
    reason: lexical_alternative
  - marker: b
    text: యోయాకీము అనే పేరును సంప్రదాయంగా “యెహోయాకీము” అని, యోయాదా అనే పేరును “యెహోయాదా” అని కూడా రాస్తారు.
    reason: alternative_reading
lexical_decisions:
- source_word: יֵשׁוּעַ
  choice: యేషూవ
  rationale: హీబ్రూ వ్యక్తినామాన్ని ఈ సందర్భంలో యెహోషువగా అనువదించకుండా, దాని సంక్షిప్త రూపానికి దగ్గరగా లిప్యంతరీకరించాం.
- source_word: הוֹלִיד
  choice: తండ్రి అయ్యాడు
  rationale: యలద్ ధాతువు హిఫిల్ వంశావళి ప్రయోగంలో ‘పుట్టించాడు’ అనే అక్షరార్థాన్ని కలిగినా, సహజమైన ఆధునిక తెలుగులో పురుష వంశసంబంధాన్ని ‘తండ్రి అయ్యాడు’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: אֶת
  choice: '[ప్రత్యేకంగా అనువదించలేదు]'
  rationale: ఇది నిర్దిష్ట కర్మను సూచించే వ్యాకరణ చిహ్నం; తెలుగులో స్వతంత్ర పదంగా ప్రతిబింబించాల్సిన అవసరం లేదు.
- source_word: יוֹיָקִים
  choice: యోయాకీము
  rationale: మసొరేటిక్ పాఠంలోని నామరూపానికి దగ్గరగా తెలుగు లిప్యంతరీకరణ చేశాం; ‘యెహోయాకీము’ అనే విస్తృత రూపంతో కలపలేదు.
- source_word: אֶלְיָשִׁיב
  choice: ఎల్యాషీబు
  rationale: హీబ్రూ వ్యక్తినామాన్ని సాధ్యమైనంత దగ్గరగా, తెలుగులో సులభంగా పలికే విధంగా లిప్యంతరీకరించాం.
- source_word: יוֹיָדָע
  choice: యోయాదా
  rationale: ఈ వచనంలోని హీబ్రూ నామరూపాన్ని అనుసరించాం; సంప్రదాయంగా కనిపించే విస్తృత రూపం ‘యెహోయాదా’ను పాదసూచికలో తెలిపాం.
