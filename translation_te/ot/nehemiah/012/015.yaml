lexical_decisions:
- source_word: לְ/חָרִם
  choice: హారీము వంశానికి
  rationale: ఈ యాజక వంశాల జాబితాలో לְ ఉపసర్గం సంబంధాన్ని లేదా ప్రాతినిధ్యాన్ని సూచిస్తుంది. తెలుగులో కేవలం ‘హారీముకు’ అనడం అస్పష్టంగా ఉండవచ్చు కాబట్టి, సందర్భంలో అంతర్లీనంగా ఉన్న యాజక వంశ భావాన్ని ‘వంశానికి’తో సహజంగా వ్యక్తం చేశాం.
- source_word: עַדְנָא
  choice: అద్నా
  rationale: హీబ్రూ వ్యక్తినామాన్ని దాని వ్యంజన నిర్మాణానికి దగ్గరగా తెలుగులో లిప్యంతరీకరించాం.
- source_word: לִ/מְרָיוֹת
  choice: మెరాయోతు వంశానికి
  rationale: పునరావృతమైన לְ ఉపసర్గం తరువాత వచ్చే వ్యక్తి ఏ యాజక వంశానికి ప్రతినిధో తెలియజేస్తుంది; ఆధునిక తెలుగులో ఆ సంబంధాన్ని స్పష్టంగా చూపడానికి ‘వంశానికి’ వాడాం.
- source_word: חֶלְקָי
  choice: హెల్కై
  rationale: హీబ్రూ వ్యక్తినామాన్ని మూల రూపానికి దగ్గరగా తెలుగులో లిప్యంతరీకరించాం.
