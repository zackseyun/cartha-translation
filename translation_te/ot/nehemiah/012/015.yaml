    text: 'అక్షరార్థంగా, రెండుసార్లు వచ్చిన ఉపసర్గ ‘కు/కొరకు’: ‘హారీముకు అద్నా; మెరాయోతుకు హెల్కై.’ ఈ జాబితాలో అది ప్రతి యాజక వంశానికి చెందిన ప్రతినిధిని సూచిస్తుంది.'
