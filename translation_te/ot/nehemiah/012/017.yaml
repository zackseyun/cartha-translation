translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళి జాబితాకు తగిన సంక్షిప్తమైన, గంభీరమైన శైలి వాడబడింది. మూలపాఠంలో మిన్యామీను తరువాత ప్రతినిధి పేరు లేకపోవడాన్ని పూరించకుండా అలాగే నిలిపాం; విభాగ అనుబంధాన్ని తెలుగులో సహజంగా తెలియజేయడానికి ‘వంశానికి’ చేర్చాం.
