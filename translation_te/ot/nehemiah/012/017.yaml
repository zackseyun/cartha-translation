lexical_decisions:
- source_word: לַ/אֲבִיָּה
  choice: అబీయా వంశానికి
  rationale: ఈ జాబితాలో לְ ఉపసర్గ యాజక కుటుంబం లేదా విభాగంతో అనుబంధాన్ని సూచిస్తుంది. తెలుగులో కేవలం ‘అబీయాకు’ అనడం కంటే ‘అబీయా వంశానికి’ అనేది సంక్షిప్త జాబితా భావాన్ని సహజంగా స్పష్టం చేస్తుంది.
- source_word: זִכְרִי
  choice: జిక్రీ
  rationale: వ్యక్తి పేరు; హీబ్రూ ఉచ్చారణకు సమీపంగా లిప్యంతరీకరించబడింది.
- source_word: לְ/מִנְיָמִין
  choice: మిన్యామీను వంశానికి
  rationale: לְ ఉపసర్గ జాబితాలోని అనుబంధాన్ని సూచిస్తుంది. తరువాత ప్రతినిధి పేరు లేని హీబ్రూ అసంపూర్ణ నిర్మాణాన్ని యథాతథంగా నిలుపుతుంది.
- source_word: לְ/מוֹעַדְיָה
  choice: మోయద్యా వంశానికి
  rationale: మసొరేటిక్ పాఠంలోని పేరును హీబ్రూ రూపానికి సమీపంగా లిప్యంతరీకరించాం; సంబంధిత పాఠ సంప్రదాయంలోని ప్రత్యామ్నాయ రూపం పాదసూచికలో ఇవ్వబడింది.
- source_word: פִּלְטָי
  choice: పిల్టయి
  rationale: వ్యక్తి పేరు; మోయద్యా వంశం లేదా విభాగానికి చెందిన ప్రతినిధిగా జాబితాలో ఉంది.
