    rationale: హీబ్రూలో లేవీయులను వెదకడం యొక్క ఉద్దేశ్యం ‘వారిని యెరూషలేముకు తీసుకువచ్చి ... ప్రతిష్ఠాపనను జరపడానికి’ అని ఉంది. ‘అనుకున్నారు’ అనే భావం మూలంలో లేదు; పైగా ‘తీసుకురావడానికి’ అనే భావం మొదటి వాక్యంలో ఇప్పటికే ఉంది. ఉద్దేశ్యాన్ని ఒకే వాక్యనిర్మాణంలో కలపాలి.
