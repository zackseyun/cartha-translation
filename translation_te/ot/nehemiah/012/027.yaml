id: NEH.12.27
reference: Nehemiah 12:27
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/בַ/חֲנֻכַּ֞ת חוֹמַ֣ת יְרוּשָׁלִַ֗ם בִּקְשׁ֤וּ אֶת הַ/לְוִיִּם֙ מִ/כָּל מְק֣וֹמֹתָ֔/ם לַ/הֲבִיאָ֖/ם לִֽ/ירוּשָׁלִָ֑ם לַ/עֲשֹׂ֨ת חֲנֻכָּ֤ה וְ/שִׂמְחָה֙ וּ/בְ/תוֹד֣וֹת וּ/בְ/שִׁ֔יר מְצִלְתַּ֖יִם נְבָלִ֥ים וּ/בְ/כִנֹּרֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/027.yaml
  text: At the dedication of the wall of Jerusalem[a], they sought the Levites from all their places, to bring them to Jerusalem to celebrate the dedication with gladness, with thanksgivings, and with song, with cymbals, harps[c][b], and lyres.
translation:
  language: te
  text: యెరూషలేము ప్రాకార ప్రతిష్ఠాపన సమయంలో, లేవీయులను వారు నివసించే ప్రదేశాలన్నిటి నుండి వెదికారు[a], వారిని యెరూషలేముకు తీసుకువచ్చి ఆనందంతో, కృతజ్ఞతాస్తుతులతో, గానంతో, తాళాలతో, స్వరమండలాలతో, వీణలతో[c] ఆ ప్రతిష్ఠాపనను జరపడానికి[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘వెదికారు’ అని అనువదించిన హీబ్రూ క్రియకు ప్రధానంగా ‘వెదికారు’ అని అర్థం. ఈ సందర్భంలో ‘లేవీయులను పిలిపించారు’ అని కూడా భావించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా, ‘ప్రతిష్ఠాపన చేయడానికి.’
    reason: lexical_alternative
  - marker: c
    text: ‘స్వరమండలాలు,’ ‘వీణలు’ అని అనువదించిన రెండు ప్రాచీన తీగవాద్యాల మధ్య ఖచ్చితమైన భేదం తెలియదు; హీబ్రూ వాటిని రెండు వేర్వేరు వాద్యాలుగా పేర్కొంటుంది.
    reason: cultural_note
lexical_decisions:
- source_word: וּבַחֲנֻכַּת חוֹמַת יְרוּשָׁלִַם
  choice: యెరూషలేము ప్రాకార ప్రతిష్ఠాపన సమయంలో
  rationale: בְּను కాలసూచకంగా సహజమైన తెలుగులో ‘సమయంలో’ అని ఇచ్చి, חֲנֻכָּה యొక్క అంకితం/ప్రతిష్ఠాపన భావాన్ని నిలిపింది.
- source_word: בִּקְשׁוּ
  choice: వారి కోసం వెదికారు
  rationale: בקשׁ యొక్క ప్రాథమిక ‘వెదుకు’ భావాన్ని కాపాడుతుంది; అధికారికంగా పిలిపించారనే సందర్భార్థాన్ని మూలపాఠం కంటే బలంగా చేయదు.
- source_word: מִכָּל מְקוֹמֹתָם
  choice: వారు నివసించే ప్రదేశాలన్నిటి నుండి
  rationale: అక్షరార్థమైన ‘వారి ప్రదేశాలన్నిటి నుండి’ కంటే ఆధునిక తెలుగులో స్పష్టంగా ఉంటుంది; ప్రదేశాలు వారి నివాసస్థలాలని సందర్భం సూచిస్తుంది.
- source_word: לַהֲבִיאָם לִירוּשָׁלִָם
  choice: వారిని యెరూషలేముకు తీసుకురావడానికి
  rationale: בוא యొక్క హిఫీల్ కారణార్థక రూపాన్ని ‘తీసుకురావడం’గా నేరుగా వ్యక్తం చేస్తుంది.
- source_word: לַעֲשֹׂת חֲנֻכָּה
  choice: ఆ ప్రతిష్ఠాపనను జరపడానికి
  rationale: అక్షరార్థం ‘ప్రతిష్ఠాపన చేయడానికి’; తెలుగు వాడుకలో ఒక వేడుకను ‘జరపడం’ సహజమైన సమానార్థకం.
- source_word: וְשִׂמְחָה וּבְתוֹדוֹת וּבְשִׁיר
  choice: ఆనందంతో, కృతజ్ఞతాస్తుతులతో, గానంతో
  rationale: ఆనందం, కృతజ్ఞతా వ్యక్తీకరణలు, గానం అనే మూడు అంశాలను వేరుగా నిలుపుతుంది; תודותలో లేని ‘పాటలు’ అనే భావాన్ని చేర్చదు.
- source_word: מְצִלְתַּיִם נְבָלִים וּבְכִנֹּרוֹת
  choice: తాళాలతో, స్వరమండలాలతో, వీణలతో
  rationale: మొదటిది తాళవాద్యమని స్పష్టంగా చూపుతూ, తరువాతి రెండు వేర్వేరు తీగవాద్యాలుగా జాబితా భేదాన్ని నిలుపుతుంది; వాటి ఖచ్చితమైన ఆధునిక సమానార్థాలు అనిశ్చితమైనవి.
