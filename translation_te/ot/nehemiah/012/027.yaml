translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. పొడవైన హీబ్రూ వాక్యాన్ని స్పష్టత కోసం రెండు వాక్యాలుగా విభజించినా, ఉద్దేశ్య సంబంధాన్ని నిలిపింది. ‘ప్రాకారం,’ ‘ప్రతిష్ఠాపన,’ ‘కృతజ్ఞతాస్తుతులు’ వంటి బైబిలు సందర్భానికి తగిన పదాలను సహజమైన వాక్యనిర్మాణంతో కలిపింది.
