  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֵּאָ֣סְפ֔וּ בְּנֵ֖י הַ/מְשֹׁרְרִ֑ים וּ/מִן הַ/כִּכָּר֙ סְבִיב֣וֹת יְרוּשָׁלִַ֔ם וּ/מִן חַצְרֵ֖י נְטֹפָתִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/028.yaml
  text: And the sons of the singers were gathered from the district around Jerusalem and from the settlements of the Netophathites[a][b].
translation:
  language: te
  text: గాయకుల కుమారులు యెరూషలేము చుట్టుపక్కల ప్రాంతం నుండి[a], నెటోఫాతీయుల నివాసాల నుండి[b] సమకూడారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘యెరూషలేము చుట్టూ ఉన్న మైదానం నుండి.’ హీబ్రూ పదం సందర్భానుసారంగా మైదానం, వలయం లేదా ప్రాంతం అని అర్థమివ్వగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘నెటోఫాతీయుల గ్రామాల నుండి.’ హీబ్రూ పదం తరచుగా చిన్న నివాసాలను లేదా ప్రాకారాలు లేని గ్రామాలను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּאָסְפוּ
  choice: సమకూడారు
  rationale: నిఫాల్ రూపం నిష్క్రియార్థాన్ని లేదా ఆత్మనేపదార్థాన్ని సూచించగలదు. తెలుగు సహజ వాడుకలో ‘సమకూడారు’ ఈ అస్పష్టతను అనవసరంగా పరిష్కరించకుండా సమూహంగా కూడడాన్ని తెలియజేస్తుంది.
- source_word: בְּנֵי הַמְשֹׁרְרִים
  choice: గాయకుల కుమారులు
  rationale: హీబ్రూ నిర్మాణంలోని ‘కుమారులు’ అనే రూపాన్ని నిలుపుతూ, గాయక వర్గానికి చెందినవారనే సందర్భార్థానికి అవకాశం ఇస్తుంది.
- source_word: הַמְשֹׁרְרִים
  choice: గాయకులు
  rationale: ఈ కృదంత నామవాచకం సాధారణ సంగీతకారులను కాక ప్రత్యేకంగా పాడేవారిని సూచిస్తుంది.
- source_word: הַכִּכָּר סְבִיבוֹת יְרוּשָׁלִַם
  choice: యెరూషలేము చుట్టుపక్కల ప్రాంతం
  rationale: כִּכָּר అనే పదం మైదానం, వలయాకార పరిసరం లేదా ప్రాంతం అని సూచించవచ్చు. ఇక్కడ భౌగోళిక సందర్భంలో ‘చుట్టుపక్కల ప్రాంతం’ సహజంగా ఉంటుంది; ‘మైదానం’ అనే ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: חַצְרֵי
  choice: నివాసాలు
  rationale: భౌగోళిక సందర్భంలో ఈ పదం ప్రాకారాలు లేని చిన్న గ్రామాలు లేదా నివాస స్థలాలను సూచిస్తుంది. ‘నివాసాలు’ విస్తృతార్థాన్ని సహజంగా అందిస్తుంది.
- source_word: נְטֹפָתִי
  choice: నెటోఫాతీయులు
  rationale: ఇది నెటోఫా అనే స్థలానికి సంబంధించిన ప్రజలను సూచించే జాతివాచక రూపం; అందువల్ల స్థలపేరుగా కాక ప్రజావాచకంగా అనువదించాం.
