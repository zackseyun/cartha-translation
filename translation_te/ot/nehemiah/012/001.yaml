revisions:
- from: 'షయల్తీయేలు కుమారుడైన జెరుబ్బాబెలుతో, యేషూవతో[a] కలిసి పైకి వచ్చిన యాజకులు, లేవీయులు వీరే: శెరాయా, యిర్మీయా, ఎజ్రా.'
  to: 'షయల్తీయేలు కుమారుడైన జెరుబ్బాబెలుతోను యేషువాతోను కలిసి పైకి వచ్చిన యాజకులూ లేవీయులూ వీరే: శెరాయా, యిర్మీయా, ఎజ్రా.'
  rationale: యేషూవా/యేషువా పేరును మూల హీబ్రూ యֵשׁוּעַకు మరింత నమ్మకంగా “యేషువా”గా సరిచేసి, దానికి సరిపోయే పాదసూచికను ఇచ్చాము. ఇద్దరితో కూడిన సహవాసాన్ని ఆధునిక తెలుగులో సజావుగా చెప్పేందుకు వాక్యనిర్మాణాన్ని స్వల్పంగా మెరుగుపరిచాము. మిగతా జాబితా, ఆరోహణ భావం, మరియు మూలంలోని అస్పష్టత యథాతథంగా ఉన్నాయి.
