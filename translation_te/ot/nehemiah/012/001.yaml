translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, జాబితా పరిచయానికి తగిన సంక్షిప్తమైన గంభీర శైలి. ‘పైకి వచ్చిన’ అనే మాట యెరూషలేము/యూదాకు ఆరోహణ భావాన్ని నిలుపుతుంది. పాదసూచిక గుర్తును సంబంధిత ‘యేషూవ’ పేరుకే జతచేశారు.
