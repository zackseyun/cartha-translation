language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אֵ֨לֶּה֙ הַ/כֹּהֲנִ֣ים וְ/הַ/לְוִיִּ֔ם אֲשֶׁ֥ר עָל֛וּ עִם זְרֻבָּבֶ֥ל בֶּן שְׁאַלְתִּיאֵ֖ל וְ/יֵשׁ֑וּעַ שְׂרָיָ֥ה יִרְמְיָ֖ה עֶזְרָֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/001.yaml
  text: 'These were the priests and the Levites who came up with Zerubbabel son of Shealtiel[a], and Jeshua: Seraiah, Jeremiah, Ezra.'
translation:
  language: te
  text: 'షయల్తీయేలు కుమారుడైన జెరుబ్బాబెలుతోను యేషువాతోను కలిసి పైకి వచ్చిన యాజకులూ లేవీయులూ వీరే: శెరాయా, యిర్మీయా, ఎజ్రా.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: వీరే
  rationale: కొత్త జాబితాను సహజమైన తెలుగులో పరిచయం చేస్తుంది; ఆరంభంలోని וְ యొక్క అనుసంధాన భావాన్ని సందర్భానికే వదిలి, మూలంలో లేని కాలార్థక ‘ఇప్పుడు’ను చేర్చదు.
- source_word: הַכֹּהֲנִים וְהַלְוִיִּם
  choice: యాజకులు, లేవీయులు
  rationale: జాబితా సందర్భంలో రెండు సమూహాలకు ప్రామాణికమైన, స్పష్టమైన తెలుగు పదాలు.
- source_word: אֲשֶׁר עָלוּ
  choice: పైకి వచ్చిన
  rationale: నిర్వాసనం నుండి యూదా/యెరూషలేముకు వెళ్లడాన్ని సూచించే עלה యొక్క ‘పైకి వెళ్లడం/రావడం’ భావాన్ని నిలుపుతుంది; కథకుని దృష్టికోణానికి ‘వచ్చిన’ సరిపోతుంది.
- source_word: עִם
  choice: తో ... కలిసి
  rationale: సహవాస భావాన్ని సహజమైన తెలుగు వాక్యనిర్మాణంలో స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: זְרֻבָּבֶל בֶּן שְׁאַלְתִּיאֵל
  choice: షయల్తీయేలు కుమారుడైన జెరుబ్బాబెలు
  rationale: వ్యక్తినామాలను లిప్యంతరీకరించి, తండ్రి-కుమార సంబంధాన్ని నేరుగా తెలుపుతుంది.
- source_word: וְיֵשׁוּעַ
  choice: యేషూవతో
  rationale: హీబ్రూ యֵשׁוּעַ అనే ప్రవాసానంతర నామరూపాన్ని సాధారణీకరించకుండా లిప్యంతరీకరిస్తుంది.
- source_word: שְׂרָיָה יִרְמְיָה עֶזְרָא
  choice: శెరాయా, యిర్మీయా, ఎజ్రా
  rationale: యాజక నాయకులు లేదా వంశాల జాబితాను సాధారణ నామావళిగా అందిస్తుంది.
