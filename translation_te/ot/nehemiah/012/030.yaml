  yaml_path: translation/ot/nehemiah/012/030.yaml
  text: And the priests and the Levites purified themselves[a], and they purified the people, the gates, and the wall.
translation:
  language: te
  text: యాజకులును లేవీయులును తమను తాము శుద్ధి చేసుకున్నారు; వారు ప్రజలను, ద్వారాలను, ప్రాకారాన్ని శుద్ధి చేశారు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తమను తాము పవిత్రపరచుకున్నారు … ప్రజలను, ద్వారాలను, ప్రాకారాన్ని పవిత్రపరిచారు.” హీబ్రూలో రెండు క్రియలకూ ఒకే మూలపదం ఉంది; మొదటిది ఆత్మార్థక రూపంలో, రెండవది సకర్మక రూపంలో ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּטַּהֲרוּ
  choice: తమను తాము పవిత్రపరచుకున్నారు
  rationale: హిత్పయేల్ రూపంలోని ఆత్మార్థక భావాన్ని స్పష్టంగా తెలియజేస్తుంది; ప్రతిష్ఠాపన సందర్భంలోని ఆచారసంబంధ శుద్ధిని సూచిస్తుంది.
- source_word: הַכֹּהֲנִים
  choice: యాజకులు
  rationale: ఆరాధనా సందర్భంలో כֹּהֲנִיםకు ప్రామాణికమైన, సహజమైన తెలుగు పదం.
- source_word: וְהַלְוִיִּם
  choice: లేవీయులు
  rationale: లేవి గోత్రానికి చెందిన ఆలయ సేవకులను సూచించే సుపరిచితమైన రూపం.
- source_word: וַיְטַהֲרוּ
  choice: పవిత్రపరిచారు
  rationale: పియేల్ రూపంలోని సకర్మక భావాన్ని నిలుపుతూ, ముందున్న ఆత్మార్థక క్రియతో ఒకే మూలపద సంబంధాన్ని ప్రతిబింబిస్తుంది.
- source_word: הָעָם
  choice: ప్రజలను
  rationale: ఈ సందర్భంలో విస్తృత ప్రజాసమూహాన్ని సూచించే సాధారణ అర్థం.
- source_word: הַשְּׁעָרִים
  choice: ద్వారాలను
  rationale: పట్టణ ప్రాకార సందర్భంలో నేరుగా, సహజంగా అర్థమయ్యే అనువాదం.
- source_word: הַחוֹמָה
  choice: ప్రాకారాన్ని
  rationale: యెరూషలేము పట్టణాన్ని చుట్టిన రక్షణ గోడను ఆధునిక తెలుగులో స్పష్టంగా సూచిస్తుంది.
theological_decisions:
- issue: శుద్ధీకరణ భాష స్వభావం
  choice: ఆచారసంబంధ పవిత్రీకరణ
  alternative: సాధారణంగా శుభ్రపరచడం లేదా నైతిక శుద్ధి
  rationale: ఆలయ సంబంధమైన ప్రాకార ప్రతిష్ఠాపన సందర్భంలో טהר భౌతిక శుభ్రతకన్నా ఆచారసంబంధ శుద్ధిని సూచిస్తుంది; అయితే ఆచారం ఎలా జరిగిందో పాఠ్యం చెప్పనందున దానిని మరింత నిర్దిష్టం చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభగ్రాహ్యమైన శైలి. ఒకే హీబ్రూ మూలక్రియ పునరావృతిని ‘పవిత్రపరచుకున్నారు/పవిత్రపరిచారు’ ద్వారా నిలిపాం. వరుస చర్యల ప్రవాహాన్ని తెలుగులో సహజంగా చూపేందుకు రెండవ వాక్యంలో ‘ఆ తరువాత’ చేర్చాం.
