lexical_decisions:
- source_word: לְ/בִלְגָּה
  choice: బిల్గా వంశానికి
  rationale: ఈ యాజక వంశాల జాబితాలో לְ ఉపసర్గ అనుబంధాన్ని లేదా ప్రాతినిధ్యాన్ని సూచిస్తుంది. తెలుగులో కేవలం ‘బిల్గాకు’ అనడం వ్యక్తిని ఉద్దేశించినట్టు అస్పష్టంగా ఉండవచ్చు; సందర్భానుసారంగా ‘బిల్గా వంశానికి’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: שַׁמּוּעַ
  choice: షమ్మూయ
  rationale: ముందు పేర్కొన్న యాజక వంశానికి సంబంధించిన ప్రతినిధి పేరు. హీబ్రూ రూపానికి దగ్గరగా తెలుగులో లిప్యంతరీకరించబడింది.
- source_word: לִֽ/שְׁמַעְיָה
  choice: షెమయా వంశానికి
  rationale: మొదటి לְ పదబంధంలాగే, జాబితాలోని వంశ సంబంధాన్ని లేదా ప్రాతినిధ్యాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘వంశానికి’ అని చెప్పడం భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: יְהוֹנָתָן
  choice: యెహోనాతాను
  rationale: మూలంలో సంక్షిప్త రూపం కాకుండా పూర్తి పేరు יְהוֹנָתָן ఉంది; అందువల్ల దానికి దగ్గరైన ‘యెహోనాతాను’ రూపాన్ని ఎంచుకున్నాం.
