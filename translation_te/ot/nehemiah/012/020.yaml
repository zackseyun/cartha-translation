lexical_decisions:
- source_word: לְ/סַלַּי
  choice: సల్లయి వంశానికి
  rationale: ఈ యాజక వంశాల జాబితాలో ఉపసర్గ ל పేరుతో సూచించిన యాజక కుటుంబం లేదా వంశంతో సంబంధాన్ని తెలియజేస్తుంది. తెలుగులో కేవలం ‘సల్లయికి’ అనడం వ్యక్తిని సూచించినట్లుగా అస్పష్టంగా ఉండవచ్చు కాబట్టి, సందర్భార్థాన్ని సహజంగా తెలిపేందుకు ‘వంశానికి’ చేర్చబడింది.
- source_word: קַלָּי
  choice: కల్లయి
  rationale: హీబ్రూ పేరులోని ద్విత్వ ల ధ్వనిని, చివరి -యి ధ్వనిని ప్రతిబింబించే తెలుగు లిప్యంతరీకరణ.
- source_word: לְ/עָמוֹק
  choice: అమోకు వంశానికి
  rationale: మొదటి పదబంధంలాగే, ל ఈ జాబితాలో యాజక కుటుంబం లేదా వంశంతో అనుబంధాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో స్పష్టత కోసం ‘వంశానికి’ ఉపయోగించబడింది.
- source_word: עֵבֶר
  choice: ఏబెరు
  rationale: హీబ్రూ עֵבֶר పేరుకు దగ్గరైన తెలుగు లిప్యంతరీకరణ; ఆరంభ స్వరం ఏ-గా, చివరి వ్యంజనాన్ని పలుకుబడికి అనుకూలంగా -రు రూపంలో ఇచ్చింది.
