source:
  edition: WLC
  text: הַ/לְוִיִּם֩ בִּ/ימֵ֨י אֶלְיָשִׁ֜יב יוֹיָדָ֤ע וְ/יוֹחָנָן֙ וְ/יַדּ֔וּעַ כְּתוּבִ֖ים רָאשֵׁ֣י אָב֑וֹת וְ/הַ/כֹּ֣הֲנִ֔ים עַל מַלְכ֖וּת דָּרְיָ֥וֶשׁ הַ/פָּֽרְסִֽי־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/022.yaml
  text: In the days of Eliashib[a], Joiada, Johanan, and Jaddua, the Levites were recorded as heads of fathers’ houses, and the priests also[c][b], during the reign of Darius the Persian.
translation:
  language: te
  text: ఎల్యాషీబు, యోయాదా, యోహానాను[c], యద్దూవా కాలంలో లేవీయులు పితృకుటుంబాల పెద్దలుగా[a] నమోదు చేయబడ్డారు[b]; యాజకులు కూడా పారసీకుడైన దార్యావేషు పరిపాలన కాలంలో నమోదు చేయబడ్డారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘పితృకుటుంబాల పెద్దలు’ అనేది వంశం లేదా పూర్విక కుటుంబశాఖకు నాయకులను సూచించే పదబంధం.
    reason: cultural_note
  - marker: b
    text: లేదా ‘రాయబడ్డారు’; ఇక్కడ వంశావళి లేదా అధికారిక పట్టికలో నమోదు చేయబడడం అనే భావం ఉంది.
    reason: lexical_alternative
  - marker: c
    text: హీబ్రూ పాఠంలో ‘యోహానాను’ ఉంది; కొన్ని అనువాద సంప్రదాయాల్లో ‘యోనాతాను’ అని కనిపిస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: הַלְוִיִּם
  choice: లేవీయులు
  rationale: లేవి గోత్రానికి చెందినవారిని సూచించే సహజమైన, స్థిరపడిన తెలుగు బైబిలు పదం.
- source_word: בִּימֵי
  choice: కాలంలో
  rationale: హీబ్రూ కాలసూచక నుడికారాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: אֶלְיָשִׁיב יוֹיָדָע וְיוֹחָנָן וְיַדּוּעַ
  choice: ఎల్యాషీబు, యోయాదా, యోహానాను, యద్దూవ
  rationale: WLC హీబ్రూ రూపాలకు దగ్గరగా వ్యక్తినామాలను లిప్యంతరీకరించాం; ముఖ్యంగా וְיוֹחָנָן ను ‘యోహానాను’గా ఉంచాం.
- source_word: כְּתוּבִים
  choice: లిఖితపూర్వకంగా నమోదయ్యారు
  rationale: כתב యొక్క ‘రాయబడి ఉండడం’ అనే అర్థాన్నీ, వంశావళి లేదా పరిపాలనా పట్టికలో నమోదు అనే సందర్భాన్నీ కలిపి తెలియజేస్తుంది.
- source_word: רָאשֵׁי אָבוֹת
  choice: పితృకుటుంబాల పెద్దలు
  rationale: వంశపారంపర్య గృహాలు లేదా వంశశాఖలకు నాయకులనే సాంకేతిక భావాన్ని సాధ్యమైనంత సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: וְהַכֹּהֲנִים
  choice: యాజకులు కూడా నమోదయ్యారు
  rationale: హీబ్రూలో క్రియ పునరుక్తం కాని సంక్షిప్త నిర్మాణం ఉంది; ముందున్న כְּתוּבִים భావాన్ని తెలుగులో స్పష్టత కోసం పూరించాం.
- source_word: עַל מַלְכוּת
  choice: పరిపాలన కాలంలో
  rationale: రాజ్యాధికార కాలాన్ని సూచించే కాలక్రమ నుడికారంగా సహజంగా అనువదించాం; సంబంధంలో ఉన్న స్వల్ప అస్పష్టతను గమనికలో తెలిపాం.
- source_word: דָּרְיָוֶשׁ הַפָּרְסִי
  choice: పారసీకుడైన దారయవేషు
  rationale: వ్యక్తినామంతో పాటు హీబ్రూలోని జాతి లేదా సామ్రాజ్య సంబంధ విశేషణాన్ని నిలుపుతుంది.
theological_decisions:
- issue: యాజకుల నమోదు మరియు దారయవేషు పరిపాలన మధ్య కాలసంబంధం
  choice: ‘పరిపాలన కాలంలో’ అని అనువదించడం
  alternative: ‘పరిపాలన వరకు’ అని అనువదించడం
  rationale: WLC లోని עַל సాధారణంగా ‘కాలంలో/సమయంలో’ అనే భావాన్ని ఇక్కడ అనుమతిస్తుంది; కొన్ని అనువాద సంప్రదాయాలు సందర్భానుసారంగా ‘వరకు’ అని గ్రహించినప్పటికీ, మూలపాఠానికి దగ్గరైన కాలసంబంధాన్ని ప్రధాన పాఠంలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కానీ సులభంగా అర్థమయ్యే శైలి. వంశావళి-పరిపాలనా సందర్భానికి తగిన ‘నమోదయ్యారు’, ‘పితృకుటుంబాలు’ వంటి పదాలు వాడబడ్డాయి. హీబ్రూ సంక్షిప్త వాక్యనిర్మాణాన్ని తెలుగులో స్పష్టత కోసం స్వల్పంగా విప్పి చెప్పాం.
