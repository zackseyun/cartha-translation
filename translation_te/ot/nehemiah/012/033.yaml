lexical_decisions:
- source_word: וַ/עֲזַרְיָה
  choice: అజర్యా
  rationale: ఇది వ్యక్తి పేరు కాబట్టి తెలుగు బైబిలు నామరూప సంప్రదాయానికి అనుగుణంగా లిప్యంతరీకరించబడింది. ముందున్న וַ ఈ వాక్యాన్ని మునుపటి జాబితాతో కలుపుతుంది; తెలుగు జాబితా కొనసాగింపులో ప్రత్యేకంగా ‘మరియు’ పెట్టకపోయినా సంబంధం సహజంగా తెలుస్తుంది.
- source_word: עֶזְרָא
  choice: ఎజ్రా
  rationale: వ్యక్తి పేరును తెలుగు పాఠకులకు సుపరిచితమైన ప్రామాణిక రూపంలో లిప్యంతరీకరించాం.
- source_word: וּ/מְשֻׁלָּם
  choice: మెషుల్లాము
  rationale: వ్యక్తి పేరును తెలుగు బైబిలు నామరూప సంప్రదాయానికి అనుగుణంగా లిప్యంతరీకరించాం. హీబ్రూలోని וּ చివరి పేరును జాబితాకు కలుపుతుంది; తెలుగులో కామాలతో కూడిన సంక్షిప్త జాబితా సహజంగా ఉండడం వల్ల ప్రత్యేక సంధానపదం అవసరం లేదు.
