translation:
  language: te
  text: యోయారీబుకు మత్తెనై; యెదాయాకు ఉజ్జీ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/לְ/יוֹיָרִיב
  choice: యోయారీబు వంశానికి
  rationale: וּ + לְ జాబితాలోని తదుపరి అంశాన్ని పరిచయం చేస్తుంది. సందర్భం యాజక వంశాల ప్రతినిధుల జాబితా కావడంతో, తెలుగులో సహజంగా సంబంధాన్ని స్పష్టం చేయడానికి ‘వంశానికి’ అని ఇచ్చాం; ఆరంభ సంధిని జాబితి శైలిలో అంతర్లీనంగా ఉంచాం.
- source_word: מַתְּנַי
  choice: మత్తెనై
  rationale: వ్యక్తి పేరు; హీబ్రూ రూపానికి అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: לִֽ/ידַֽעְיָה
  choice: యెదాయా వంశానికి
  rationale: לְ ఇక్కడ యాజక కుటుంబంతో సంబంధాన్ని సూచిస్తుంది. సందర్భానుసారంగా ‘వంశానికి’ సహజమైన, స్పష్టమైన తెలుగు రూపం.
- source_word: עֻזִּי
  choice: ఉజ్జీ
  rationale: వ్యక్తి పేరు; హీబ్రూ ఉచ్చారణకు సమీపంగా లిప్యంతరీకరించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్త జాబితి శైలిని పాటించాం. పూర్వాపర సందర్భంలోని యాజక కుటుంబాల భావాన్ని సహజంగా తెలియజేయడానికి ‘వంశానికి’ ఉపయోగించాం; ప్రత్యక్ష ‘యోయారీబుకు’ రూపాన్ని పాదసూచికలో నిలిపాం.
