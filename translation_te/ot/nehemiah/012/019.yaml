review_pass:
  verdict: revise
  source_fidelity: ‘వంశానికి’ is an interpretive expansion. The Hebrew uses לְ (‘for/to, belonging to’) with each priestly-house name; although the wider context supports an association with priestly divisions, this verse itself does not state ‘lineage/house.’ The prefixed conjunction on the first name may be left implicit in Telugu list style.
  naturalness: The concise paired-list construction is natural in modern standard Telugu. ‘యోయారీబుకు …; యెదాయాకు …’ accurately and idiomatically preserves the repeated Hebrew prepositional relationship.
  terminology: 'The personal names are suitably transliterated: యోయారీబు, మత్తెనై, యెదాయా, ఉజ్జీ. Removing ‘వంశం’ avoids importing an unstated genealogical term.'
  issues:
  - severity: medium
    issue: The draft adds ‘వంశానికి’ twice.
    rationale: This specifies ‘to the lineage/house of,’ whereas the Hebrew only has the preposition לְ with the names. Context may explain the list, but the translation should not add that interpretive noun.
  revised_text: యోయారీబుకు మత్తెనై; యెదాయాకు ఉజ్జీ.
