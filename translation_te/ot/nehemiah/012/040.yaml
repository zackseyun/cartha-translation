source:
  edition: WLC
  text: וַֽ/תַּעֲמֹ֛דְנָה שְׁתֵּ֥י הַ/תּוֹדֹ֖ת בְּ/בֵ֣ית הָ/אֱלֹהִ֑ים וַ/אֲנִ֕י וַ/חֲצִ֥י הַ/סְּגָנִ֖ים עִמִּֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/040.yaml
  text: So the two thanksgiving choirs took their stand in the house of God[a], and I, and half of the officials with me,
translation:
  language: te
  text: అప్పుడు ఆ రెండు కృతజ్ఞతా బృందాలు[a] దేవుని మందిరంలో నిలిచాయి; నేనూ నాతోపాటు అధికారుల్లో సగం మందీ నిలిచాం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, ‘ఆ రెండు కృతజ్ఞతాస్తుతులు.’ ఈ సందర్భంలో ఇది కృతజ్ఞతాస్తుతి చేసే రెండు బృందాలను లేదా ఊరేగింపు బృందాలను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעֲמֹדְנָה
  choice: తమ స్థానాల్లో నిలిచాయి
  rationale: עמד అనే క్రియ ఇక్కడ రెండు స్త్రీలింగ బృందాలు ఆచారంలో తమకు నిర్దేశించిన స్థానాన్ని చేపట్టడాన్ని సూచిస్తుంది; కేవలం ‘నిలిచాయి’ కంటే సందర్భార్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: שְׁתֵּי הַתּוֹדֹת
  choice: ఆ రెండు కృతజ్ఞతాస్తుతి గాయకబృందాలు
  rationale: అక్షరార్థంగా ‘ఆ రెండు కృతజ్ఞతాస్తుతులు’; నెహెమ్యా 12 సందర్భంలో ఇది కృతజ్ఞతాస్తుతి చేసే రెండు వ్యవస్థీకృత ఊరేగింపు బృందాలను సూచించే లక్షణార్థ ప్రయోగం. గాయకుల ప్రస్తావన ఉన్న సందర్భానికి ‘గాయకబృందాలు’ స్పష్టంగా సరిపోతుంది.
- source_word: בְּבֵית הָאֱלֹהִים
  choice: దేవుని మందిరంలో
  rationale: ‘దేవుని ఇల్లు’ అనే హీబ్రూ నుడికారం ఇక్కడ దేవాలయాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘దేవుని మందిరం’ సహజంగా, గౌరవప్రదంగా ఉంటుంది; בְּ యొక్క స్థానార్థాన్ని ‘లో’ నిలుపుతుంది.
- source_word: וַאֲנִי
  choice: నేనూ
  rationale: సంయోజక వావ్‌తో ఉన్న ప్రథమ పురుష సర్వనామాన్ని తెలుగులో సహజమైన సముచ్చయ రూపమైన ‘నేనూ’గా ఇచ్చాం.
- source_word: וַחֲצִי הַסְּגָנִים
  choice: అధికారుల్లో సగం మందీ
  rationale: סגנים పరిపాలనా అధికారులు లేదా ప్రతినిధులను సూచిస్తుంది. ‘అధికారులు’ ఆధునిక తెలుగులో స్పష్టమైన, విస్తృతార్థక సమానార్థకం; వ్యక్తుల సంఖ్యను సహజంగా చూపేందుకు ‘సగం మంది’ వాడాం.
- source_word: עִמִּי
  choice: నాతోపాటు
  rationale: తోడుగా ఉండడాన్ని తెలిపే ప్రథమ పురుష ఏకవచన రూపానికి ‘నాతోపాటు’ సహజమైన తెలుగు సమానార్థకం.
