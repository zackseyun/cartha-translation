translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. హీబ్రూ వాక్యం చివర క్రియను పునరుక్తి చేయకుండానే ‘నేనూ… నాతోపాటు’ అని సమన్వయిస్తుంది; తెలుగులో వాక్యం సంపూర్ణంగా, సులభంగా అర్థమయ్యేందుకు ‘అక్కడ నిలిచాం’ను స్పష్టంగా చేర్చాం.
