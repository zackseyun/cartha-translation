  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే కథన శైలి. స్థలనామాలను పారదర్శకంగా అనువదించాం; హీబ్రూ వాక్యంలోని కదలిక మరియు ఊరేగింపు క్రమాన్ని నిలిపాం.
