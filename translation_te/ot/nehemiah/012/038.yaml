source:
  edition: WLC
  text: וְ/הַ/תּוֹדָ֧ה הַ/שֵּׁנִ֛ית הַ/הוֹלֶ֥כֶת לְ/מ֖וֹאל וַ/אֲנִ֣י אַחֲרֶ֑י/הָ וַ/חֲצִ֨י הָ/עָ֜ם מֵ/עַ֣ל לְ/הַ/חוֹמָ֗ה מֵ/עַל֙ לְ/מִגְדַּ֣ל הַ/תַּנּוּרִ֔ים וְ/עַ֖ד הַ/חוֹמָ֥ה הָ/רְחָבָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/038.yaml
  text: And the second thanksgiving choir was going to the left[a], and I followed behind it, with half of the people on the wall, from above the Tower of the Ovens as far as the Broad Wall.
translation:
  language: te
  text: రెండవ కృతజ్ఞతా బృందం[a] ఎడమవైపుకు వెళ్తుండగా, నేను దాని వెనుక నడిచాను; ప్రజలలో సగం మంది గోడపైగా, పొయ్యిల గోపురం పై నుండి విశాల గోడ వరకు వెళ్లారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “రెండవ కృతజ్ఞతా గాయకబృందం” లేదా “రెండవ కృతజ్ఞతా ఊరేగింపు బృందం.” హీబ్రూ పదం ఈ ఆచార ఊరేగింపులో కేవలం విడిగా పాడే గానాన్ని మాత్రమే కాక, కృతజ్ఞతతో కూడిన బృందాన్ని కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַתּוֹדָה
  choice: కృతజ్ఞతాస్తుతి బృందం
  rationale: ఈ సందర్భంలో ఈ పదం కేవలం కృతజ్ఞత అనే భావాన్ని కాకుండా, గోడ ప్రతిష్ఠాపన ఊరేగింపులో పాల్గొన్న వ్యవస్థీకృత బృందాన్ని సూచిస్తుంది. గానం మరియు కృతజ్ఞత రెండింటినీ సహజంగా సూచించేందుకు ఈ రూపం ఎంచుకోబడింది.
- source_word: הַשֵּׁנִית
  choice: రెండవ
  rationale: కృతజ్ఞతాస్తుతి బృందాన్ని విశేషించే సాధారణ క్రమసంఖ్య.
- source_word: הַהוֹלֶכֶת
  choice: వెళ్తూ ఉంది
  rationale: హీబ్రూ కృదంతం కథన దృశ్యంలో కొనసాగుతున్న కదలికను సూచిస్తుంది.
- source_word: לְמוֹאל
  choice: ఎడమ వైపుగా
  rationale: పదం యొక్క సాధారణ దిశార్థాన్ని నిలుపుతుంది; రెండు ఊరేగింపు బృందాలు వేర్వేరు దిశల్లో వెళ్లిన సందర్భానికి సరిపోతుంది.
- source_word: אַחֲרֶיהָ
  choice: దాని వెనుక
  rationale: స్త్రీలింగ ప్రత్యయం కృతజ్ఞతాస్తుతి బృందాన్ని తిరిగి సూచిస్తుంది; ఊరేగింపులో స్థలపరమైన అనుసరణను స్పష్టంగా తెలుపుతుంది.
- source_word: חֲצִי הָעָם
  choice: ప్రజల్లో సగం మంది
  rationale: సమకూడిన ప్రజల్లో ఒక సగభాగం ఈ బృందంతో ఉన్నట్లు సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: מֵעַל לְהַחוֹמָה
  choice: గోడ మీదుగా
  rationale: ఊరేగింపు గోడ పైభాగం మీద సాగిందనే సందర్భోచిత అర్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: מִגְדַּל הַתַּנּוּרִים
  choice: పొయ్యిల గోపురం
  rationale: స్థలనామ స్వభావాన్ని నిలుపుతూ, תנורים అనే బహువచనానికి సాధారణంగా అర్థమయ్యే ‘పొయ్యిలు’ అనే పదాన్ని ఉపయోగిస్తుంది.
- source_word: הַחוֹמָה הָרְחָבָה
  choice: విశాల గోడ
  rationale: యెరూషలేము గోడలో పేరుపొందిన భాగాన్ని సూచించే స్థలనామంగా, దాని విశాలతను నేరుగా ప్రతిబింబిస్తుంది.
