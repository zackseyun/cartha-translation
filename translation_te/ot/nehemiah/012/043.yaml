  terminology: “బలులు అర్పించి,” “గొప్ప సంతోషం,” “స్త్రీలు,” “పిల్లలు,” and “యెరూషలేము” are appropriate. The footnote concerning “భార్యలు” responsibly retains the lexical possibility of נָשִׁים without imposing it on the main text.
