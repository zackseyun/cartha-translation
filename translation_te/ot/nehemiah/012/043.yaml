base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/043.yaml
  text: On that day they offered great sacrifices and rejoiced[a], because God had made them rejoice with great joy. Also the women and the children rejoiced[d][c][b], and the joy of Jerusalem was heard from far away.
translation:
  language: te
  text: ఆ రోజున వారు గొప్ప బలులు అర్పించి సంతోషించారు[a]. ఎందుకంటే దేవుడు వారికి గొప్ప సంతోషం కలిగించాడు[b]. స్త్రీలు[c], పిల్లలు కూడా సంతోషించారు. యెరూషలేము సంతోషధ్వని ఎంతో దూరం నుండీ వినబడింది[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “గొప్ప బలులను బలి అర్పించారు.”
    reason: lexical_alternative
  - marker: b
    text: మరింత అక్షరార్థంగా, “దేవుడు వారిని గొప్ప సంతోషంతో సంతోషింపజేశాడు.”
    reason: lexical_alternative
  - marker: c
    text: “స్త్రీలు” అనే హీబ్రూ పదానికి సందర్భానుసారం “భార్యలు” అనే అర్థం కూడా రావచ్చు.
    reason: lexical_alternative
  - marker: d
    text: లేదా, “యెరూషలేము సంతోషధ్వని ఎంతో దూరం వరకు వినిపించింది.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְבְּחוּ זְבָחִים גְּדוֹלִים
  choice: గొప్ప బలులు అర్పించారు
  rationale: తెలుగులో సహజమైన ఆరాధనా ప్రయోగంగా ‘బలులు అర్పించారు’ అన్నది זבח క్రియలోని బలియర్పణ భావాన్ని నిలుపుతుంది; ‘గొప్ప’ అనే పదం బలుల పరిమాణం లేదా ప్రాముఖ్యతను ముందుగానే సంకుచితం చేయదు.
- source_word: וַיִּשְׂמָחוּ / שָׂמֵחוּ
  choice: సంతోషించారు
  rationale: ఒకే שׂמח మూలం పునరావృతమవుతున్నందున, రెండుచోట్లా ఒకే తెలుగు క్రియను వాడి వాక్యంలోని పదసంబంధాన్ని నిలిపాం.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ఇక్కడ ఈ పదం వారి సంతోషానికి కారణాన్ని తెలియజేస్తుంది; ఆధునిక తెలుగులో ‘ఎందుకంటే’ స్పష్టమైన కారణార్థక అనుసంధానం.
- source_word: שִׂמְּחָם שִׂמְחָה גְדוֹלָה
  choice: వారికి గొప్ప సంతోషం కలిగించాడు
  rationale: పియేల్ క్రియలోని దేవుని కారణకర్తృత్వాన్ని ‘కలిగించాడు’ నిలుపుతుంది; సహజమైన తెలుగులో భావజనిత నామవాచకంతో కూడిన ఈ రూపం మూలంలోని గొప్ప ఆనందాన్ని కూడా వ్యక్తం చేస్తుంది.
- source_word: הַנָּשִׁים וְהַיְלָדִים
  choice: స్త్రీలు, పిల్లలు
  rationale: נָשִׁים సందర్భానుసారం స్త్రీలు లేదా భార్యలు కావచ్చు; స్వామ్యసూచన లేనందున విస్తృతమైన ‘స్త్రీలు’ ఎంచుకున్నాం. יְלָדִיםకు ‘పిల్లలు’ సహజమైన సమానం.
- source_word: שִׂמְחַת יְרוּשָׁלִַם
  choice: యెరూషలేము సంతోషధ్వని
  rationale: శబ్దార్థంగా ‘యెరూషలేము సంతోషం’; అది వినబడిందనే సందర్భంలో తెలుగులో ‘సంతోషధ్వని’ సహజంగా ఉండి, నగర ప్రజల సామూహిక ఆనందం వినిపించిందనే భావాన్ని తెలియజేస్తుంది.
- source_word: מֵרָחוֹק
  choice: ఎంతో దూరం వరకు
  rationale: దూరం నుంచి వినబడింది లేదా దూరం వరకు వినిపించింది అనే రెండు సహజ దృష్టికోణాలు సాధ్యమైనవి; ప్రధాన పాఠంలో తెలుగు వాడుకకు అనుగుణంగా ధ్వని వ్యాప్తిని సూచించే రూపాన్ని తీసుకున్నాం, ప్రత్యక్ష ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
theological_decisions:
- issue: సంతోషానికి దేవుని కారణకర్తృత్వం
  choice: దేవుడు వారికి గొప్ప సంతోషం కలిగించాడు
  alternative: దేవుడు వారిని గొప్ప సంతోషంతో సంతోషింపజేశాడు
  rationale: మూలంలోని causative క్రియ దేవుడే వారి సంతోషానికి కారణమని స్పష్టంగా చెబుతుంది. తెలుగు సహజత్వం కోసం సమీపార్థక రూపాన్ని ప్రధాన పాఠంలో ఉంచి, మరింత అక్షరార్థ రూపాన్ని పాదసూచికలో ఇచ్చాం.
- issue: సంతోషించిన సమాజపు పరిధి
  choice: స్త్రీలు, పిల్లలు కూడా సంతోషించారు
  alternative: భార్యలు, పిల్లలు కూడా సంతోషించారు
  rationale: మూలపాఠం ఈ వర్గాలను ప్రత్యేకంగా చేర్చుతుంది. נָשִׁיםలోని ‘స్త్రీలు/భార్యలు’ అనే నిజమైన సందిగ్ధతను ప్రధాన పాఠం మరియు పాదసూచిక ద్వారా నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. మూలంలోని שׂמח పదపునరావృతాన్ని సాధ్యమైనంతగా ‘సంతోషం/సంతోషించారు’ ద్వారా నిలిపాం. ‘యెరూషలేము’ అనే సుపరిచిత బైబిలు నామరూపాన్ని ఉపయోగించాం; సందిగ్ధతలను పాదసూచికల్లో స్పష్టంగా ఉంచాం.
