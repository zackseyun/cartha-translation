id: NEH.12.8
reference: Nehemiah 12:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הַ/לְוִיִּ֗ם יֵשׁ֧וּעַ בִּנּ֛וּי קַדְמִיאֵ֥ל שֵׁרֵבְיָ֖ה יְהוּדָ֣ה מַתַּנְיָ֑ה עַֽל הֻיְּד֖וֹת ה֥וּא וְ/אֶחָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/008.yaml
  text: And the Levites were Jeshua[a], Binnui, Kadmiel, Sherebiah, Judah, and Mattaniah, who, with his brothers[b], was over the thanksgiving songs.
translation:
  language: te
  text: 'లేవీయులు: యేషూవ, బిన్నూయి, కద్మీయేలు, షేరెబ్యా, యూదా, మత్తన్యా. మత్తన్యా తన సహోదరులతో కలిసి కృతజ్ఞతా స్తుతుల బాధ్యత వహించాడు.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అతడూ అతని సహోదరులూ కృతజ్ఞతా స్తుతుల బాధ్యత వహించారు.’ హీబ్రూలోని ఏకవచన సర్వనామం సహజంగా మత్తన్యాను సూచిస్తుంది; అయితే దానిని పేరుపొందిన లేవీయుల గుంపుకు సామూహికంగా కూడా అన్వయించవచ్చు. ‘కృతజ్ఞతా స్తుతులు’ ఆరాధనలోని కృతజ్ఞతా గీతాలను లేదా ఇతర స్తుతి వ్యక్తీకరణలను సూచించవచ్చు.
    reason: alternative_reading_and_lexical_alternative
lexical_decisions:
- source_word: וְהַלְוִיִּם
  choice: 'లేవీయులు:'
  rationale: హీబ్రూలో ఇది క్రియలేని జాబితాను పరిచయం చేస్తుంది. తెలుగులో ద్విబిందువు సహజంగా పేర్ల జాబితాను సూచిస్తుంది; అనవసరంగా ‘ఉన్నారు’ అని చేర్చలేదు.
- source_word: יֵשׁוּעַ בִּנּוּי קַדְמִיאֵל שֵׁרֵבְיָה יְהוּדָה מַתַּנְיָה
  choice: యేషూవ, బిన్నూయి, కద్మీయేలు, షేరెబ్యా, యూదా, మత్తన్యా
  rationale: వ్యక్తినామాలను అనువదించకుండా హీబ్రూ రూపాలకు దగ్గరగా తెలుగు లిప్యంతరీకరణ చేశాం.
- source_word: עַל
  choice: బాధ్యుడిగా
  rationale: ఈ సందర్భంలో ఈ విభక్తిపదం పర్యవేక్షణ లేదా బాధ్యతను సూచిస్తుంది. ‘బాధ్యుడిగా’ ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: הֻיְּדוֹת
  choice: కృతజ్ఞతాస్తుతులకు
  rationale: ఈ బహువచన నామవాచకం ఆరాధనలో అర్పించే కృతజ్ఞతా వ్యక్తీకరణలను లేదా స్తోత్రాలను సూచిస్తుంది. ‘పాటలు’ అని మాత్రమే నిర్ధారించకుండా విస్తృతమైన ఆరాధనా భావాన్ని నిలిపాం.
- source_word: הוּא
  choice: మత్తన్యా ... బాధ్యుడిగా ఉన్నాడు
  rationale: ఏకవచన సర్వనామం జాబితాలో చివరిగా ఉన్న మత్తన్యాను సూచించడం వాక్యనిర్మాణపరంగా అత్యంత సహజం.
- source_word: וְאֶחָיו
  choice: తన సహోదరులతో కలిసి
  rationale: ‘అతని సహోదరులు’ అనే మూలార్థాన్ని నిలుపుతూ, మత్తన్యాతో వారి సహభాగితను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: జాబితా తరువాత ఉన్న ఏకవచన הוּא ఎవరిని సూచిస్తుంది?
  choice: అది చివరిగా పేర్కొన్న మత్తన్యాను సూచిస్తుంది; అతడు తన సహోదరులతో కలిసి బాధ్యత వహించాడు.
  alternative: పేరుపొందిన లేవీయుల గుంపును సమష్టిగా సూచించినట్లు అర్థం చేసుకోవచ్చు.
  rationale: ఏకవచన సర్వనామం సమీపంలోని ఏకవచన వ్యక్తినామమైన మత్తన్యాను సూచించడం హీబ్రూ వాక్యనిర్మాణానికి అత్యంత సహజం. అయినా సామూహిక అవగాహనకు స్వల్ప అవకాశం ఉన్నందున పాదసూచికలో దాన్ని ఉంచాం.
- issue: הֻיְּדוֹת యొక్క ఆరాధనా భావం
  choice: కృతజ్ఞతాస్తుతులు
  alternative: కృతజ్ఞతా గీతాలు
  rationale: మూలపదం కృతజ్ఞతలు, స్తోత్రాలు లేదా వాటి ఆరాధనా వ్యక్తీకరణలను సూచించగలదు. సందర్భం సంగీత సంబంధమైన అర్థాన్ని అనుమతించినా, ‘గీతాలు’ అని మాత్రమే పరిమితం చేయకుండా మూలంలోని విస్తృతిని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన కానీ సాధారణ పాఠకులకు సులభమైన శైలి. పేర్ల జాబితాకు ద్విబిందువు వాడి, హీబ్రూ క్రియలేని నిర్మాణాన్ని సహజంగా నిలిపాం. ప్రధాన పాఠంలో ఏకవచన సూచనను స్పష్టంగా ఉంచి, నిజమైన పరిమిత అస్పష్టతను పాదసూచికలో భద్రపరిచాం.
