  - severity: low
    issue: Footnote a addresses an unnecessary name-variant claim rather than a source-relevant ambiguity
    rationale: The meaningful note concerns the singular pronoun and the liturgical scope of הֻיְּדוֹת. A name-variant footnote is not required by the Hebrew and creates an unhelpful anchor separate from the actual interpretive issue.
