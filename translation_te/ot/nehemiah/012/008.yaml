- from: 'లేవీయులు: యేషూవ[a], బిన్నూయి, కద్మీయేలు, షేరెబ్యా, యూదా, మత్తన్యా. మత్తన్యా తన సహోదరులతో కలిసి కృతజ్ఞతాస్తుతులకు బాధ్యుడిగా ఉన్నాడు.[b]'
