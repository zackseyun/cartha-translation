lexical_decisions:
- source_word: לְ/חִלְקִיָּה
  choice: హిల్కీయా వంశం తరఫున
  rationale: ఈ యాజక వంశాల జాబితాలో ל ఉపసర్గ అనుబంధాన్ని లేదా ప్రాతినిధ్యాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో వ్యక్తి తన వంశానికి ప్రతినిధిగా ఉన్నాడనే భావాన్ని సహజంగా తెలియజేయడానికి ‘వంశం తరఫున’ అని అనువదించాం.
- source_word: חֲשַׁבְיָה
  choice: హషబ్యా
  rationale: ఇది వ్యక్తి పేరు; హీబ్రూ ఉచ్చారణను అనుసరించి లిప్యంతరీకరించాం.
- source_word: לִֽ/ידַֽעְיָה
  choice: యెదాయా వంశం తరఫున
  rationale: మొదటి పదబంధంలో ఉన్నట్లే, ל ఇక్కడ వంశంతో అనుబంధాన్ని లేదా ఆ వంశానికి ప్రాతినిధ్యాన్ని సూచిస్తుంది. జాబితాలోని సంక్షిప్త శైలిని నిలుపుతూ తెలుగులో స్పష్టత కోసం ‘వంశం తరఫున’ అని ఇచ్చాం.
- source_word: נְתַנְאֵל
  choice: నెతనయేలు
  rationale: ఇది వ్యక్తి పేరు; హీబ్రూ రూపాన్ని అనుసరించి తెలుగులో లిప్యంతరీకరించాం.
