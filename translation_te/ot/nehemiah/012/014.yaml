lexical_decisions:
- source_word: ל/מלוכי
  choice: మల్లూకి వంశానికి
  rationale: ఈ యాజక వంశాల జాబితాలో ל ఉపసర్గ ఒక వంశానికి ప్రాతినిధ్యం వహించే అధిపతిని సూచిస్తుంది. తెలుగులో కేవలం ‘మల్లూకికి’ అనడం వ్యక్తిని సూచిస్తున్నట్లు అస్పష్టంగా ఉండవచ్చు కాబట్టి, జాబితా నిర్మాణాన్ని సహజంగా తెలియజేయడానికి ‘వంశానికి’ చేర్చబడింది. מלוכי అనే పేరును మల్లూకి అని లిప్యంతరీకరించాం.
- source_word: יונתן
  choice: యోనాతాను
  rationale: יוֹנָתָן అనే వ్యక్తిపేరుకు తెలుగులో పరిచితమైన బైబిలు రూపం.
- source_word: ל/שבניה
  choice: షెబన్యా వంశానికి
  rationale: మొదటి పదబంధంలాగే ל ఉపసర్గ జాబితాలో ప్రాతినిధ్య సంబంధాన్ని సూచిస్తుంది; שבניה పేరును షెబన్యా అని లిప్యంతరీకరించాం.
- source_word: יוסף
  choice: యోసేపు
  rationale: יוֹסֵף అనే వ్యక్తిపేరుకు తెలుగులో సాధారణంగా వాడే బైబిలు రూపం.
