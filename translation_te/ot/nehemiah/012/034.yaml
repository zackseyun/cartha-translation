    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוּדָה
  choice: యూదా
  rationale: ఇది పాల్గొన్నవారి పేర్ల జాబితాలో ఉన్న వ్యక్తి లేదా గోత్రనామం; భౌగోళిక ప్రాంతమైన ‘యూదయ’ కంటే తెలుగు బైబిలు వాడుకలో గుర్తించదగిన ‘యూదా’ సరిపోతుంది.
- source_word: בִנְיָמִן
  choice: బెన్యామీను
  rationale: సమన్వయ జాబితాలోని వ్యక్తినామం; హీబ్రూ పేరును తెలుగు బైబిలు సంప్రదాయంలో సుపరిచితమైన రూపంలో లిప్యంతరీకరించాం.
- source_word: שְׁמַעְיָה
  choice: షెమయా
  rationale: వ్యక్తినామాన్ని అర్థానువాదం చేయకుండా, మూల హీబ్రూ ఉచ్చారణకు దగ్గరగా మరియు ఆధునిక తెలుగు పాఠకులకు సహజంగా లిప్యంతరీకరించాం.
- source_word: יִרְמְיָה
  choice: యిర్మీయా
  rationale: వ్యక్తినామాన్ని మూలంలోని సంక్షిప్త హీబ్రూ రూపానికి దగ్గరగా లిప్యంతరీకరించాం; ఇది ఈ జాబితాలోని పేరుగా స్పష్టంగా ఉంటుంది.
- source_word: וְ / וּ
  choice: జాబితాలో విరామచిహ్నాలు
  rationale: హీబ్రూలో ప్రతి పేరును కలిపే సంధిని తెలుగులో సహజమైన జాబితా శైలిగా కామాలతో చూపించాం; చివరి పేరుకు ముందు అదనంగా ‘మరియు’ పెట్టకపోయినా సమన్వయం స్పష్టమే.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన పేర్ల జాబితాగా రూపొందించాం. వ్యక్తినామాలకు తెలుగు బైబిలు పాఠకులకు గుర్తించదగిన రూపాలను ఉపయోగిస్తూ, సాధ్యమైనంతవరకు హీబ్రూ రూపాలను అనుసరించాం.
