  yaml_path: translation/ot/nehemiah/012/025.yaml
  text: Mattaniah, Bakbukiah, Obadiah, Meshullam, Talmon, and Akkub were guards, gatekeepers, keeping watch at the storehouses of the gates.
translation:
  language: te
  text: మత్తన్యా, బక్బుక్యా, ఓబద్యా, మెషుల్లాము, తల్మోను, అక్కూబు కావలివారు, ద్వారపాలకులు; వారు ద్వారాల నిల్వగదుల వద్ద కాపలా కాసేవారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שֹׁמְרִים שֹׁועֲרִים
  choice: ద్వారపాలకులుగా కావలి కాస్తూ
  rationale: రెండు సమీపార్థక కర్తవ్యపదాలైన ‘కాపాడేవారు’ మరియు ‘ద్వారపాలకులు’ అనే భావాలను సహజమైన తెలుగులో ఒకే విధి వివరణగా నిలిపింది.
- source_word: מִשְׁמָר
  choice: వంతులవారీగా కాపలా
  rationale: ఈ పదం కాపలా విధిని లేదా వంతును సూచించగలదు; సందర్భంలో రెండింటి భావాన్నీ సహజంగా అందిస్తుంది.
- source_word: בַּאֲסֻפֵּי הַשְּׁעָרִים
  choice: ద్వారాల దగ్గరున్న గదుల వద్ద
  rationale: అరుదైన אֲסֻפִּים రూపం నిల్వగదులు లేదా ద్వారాలకు అనుబంధ గదులను సూచిస్తుంది; కేవలం ‘గిడ్డంగులు’ అని అతిగా నిర్దిష్టం చేయకుండా స్థలార్థాన్ని తెలిపింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; పేర్ల జాబితిని గౌరవప్రదంగా, చదవడానికి సులభంగా ఉంచి, ఆలయ సేవా సందర్భంలోని కాపలా విధిని స్పష్టంగా వ్యక్తం చేసింది.
