  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. మూలంలోని వివరణాత్మక సంబంధం, కాలసూచన, గాయకుల నాయకత్వం, స్తుతి-కృతజ్ఞతల భేదం నిలుపబడ్డాయి.
