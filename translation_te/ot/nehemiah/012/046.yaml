  yaml_path: translation/ot/nehemiah/012/046.yaml
  text: For in the days of David and Asaph[a], of old, there were heads of the singers[b], and songs of praise and thanksgiving to God.
translation:
  language: te
  text: ఎందుకంటే పూర్వకాలంలో, దావీదు, ఆసాపు రోజులలో, గాయకుల నాయకులు ఉండేవారు; దేవునికి స్తుతి, కృతజ్ఞతా గీతాలు ఉండేవి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందున్న వాక్యానికి వివరణాత్మక ఆధారాన్ని పరిచయం చేస్తుంది; తెలుగులో కారణసంబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: בִימֵי דָוִיד וְאָסָף
  choice: దావీదు ఆసాఫుల రోజుల్లో
  rationale: హీబ్రూ కాలసూచక నుడికారాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: מִקֶּדֶם
  choice: పూర్వకాలంలో
  rationale: గతకాలం లేదా ప్రాచీన కాలం అనే భావాన్ని సహజంగా తెలియజేస్తుంది; ఇది దావీదు, ఆసాఫుల కాలాన్ని బలపరిచే కాలసూచనగా ఉంచబడింది.
- source_word: רֹאשׁ הַמְשֹׁרְרִים
  choice: గాయకుల నాయకులు
  rationale: ఏకవచన రూపంలోని רֹאשׁ ఇక్కడ సమూహార్థకంగా లేదా పాఠభేదసదృశ వ్యాకరణ ఉద్రిక్తతతో కనిపిస్తుంది; సందర్భానుసారం నాయకత్వ పాత్రను స్పష్టంగా తెలుపుతుంది.
- source_word: וְשִׁיר תְּהִלָּה וְהֹדוֹת
  choice: స్తుతిగీతాలు, కృతజ్ఞతార్పణ గీతాలు
  rationale: שִׁיר ఏకవచనమైనా ఆరాధనా గీతాల సమూహార్థాన్ని తెలుగులో సహజమైన బహువచనంతో వ్యక్తం చేస్తుంది; תְּהִלָּה మరియు הֹדוֹת మధ్య భావభేదాన్ని నిలుపుతుంది.
- source_word: לֵאלֹהִים
  choice: దేవునికి
  rationale: స్తుతి, కృతజ్ఞతల లక్ష్యాన్ని సూచించే לְ ఉపసర్గను సహజంగా వ్యక్తం చేస్తుంది.
