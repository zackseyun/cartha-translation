  rationale: హీబ్రూలో రెండవ పేరుకు ముందు సంధాయకం ఉన్నప్పటికీ, తెలుగు పేర్ల జాబితాలో కామాలతో వరుసగా ఇవ్వడం సహజం; అర్థ నష్టం లేదు.
- source_word: יוֹיָרִיב
  choice: యోయారీబు
  rationale: ఈ వచనంలోని సంక్షిప్త హీబ్రూ నామరూపాన్నే లిప్యంతరీకరించాం; సంబంధిత దీర్ఘరూపాన్ని దిగుమతి చేయలేదు.
- source_word: יְדַעְיָה
  choice: యెదాయా
  rationale: హీబ్రూ వ్యక్తినామాన్ని దాని ధ్వనిరూపానికి దగ్గరగా, తెలుగులో సులభంగా చదవగల రూపంలో లిప్యంతరీకరించాం.
