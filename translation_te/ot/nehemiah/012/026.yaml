- from: వీరు యెహోషాదాకు కుమారుడైన యేషూవ కుమారుడు యోయాకీము కాలంలోనూ, అధిపతియైన నెహెమ్యా కాలంలోనూ, యాజకుడు, శాస్త్రి అయిన ఎజ్రా కాలంలోనూ ఉన్నవారు.[a]
  to: వీరు యోత్సాదాకు కుమారుడైన యేషూవ కుమారుడు యోయాకీము కాలంలోను, ప్రాంతాధిపతియైన నెహెమ్యా కాలంలోను, యాజకుడును, శాస్త్రియునైన ఎజ్రా కాలంలోను ఉన్నవారు.[a]
