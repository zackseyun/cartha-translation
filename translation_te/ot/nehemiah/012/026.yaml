  text: אֵ֕לֶּה בִּ/ימֵ֛י יוֹיָקִ֥ים בֶּן יֵשׁ֖וּעַ בֶּן יוֹצָדָ֑ק וּ/בִ/ימֵי֙ נְחֶמְיָ֣ה הַ/פֶּחָ֔ה וְ/עֶזְרָ֥א הַ/כֹּהֵ֖ן הַ/סּוֹפֵֽר־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/026.yaml
  text: These were in the days of Joiakim son of Jeshua[a], son of Jozadak, and in the days of Nehemiah the governor and Ezra the priest, the scribe.
translation:
  language: te
  text: వీరు యోత్సాదాకు కుమారుడైన యేషూవ కుమారుడు యోయాకీము కాలంలోను, ప్రాంతాధిపతియైన నెహెమ్యా కాలంలోను, యాజకుడును, శాస్త్రియునైన ఎజ్రా కాలంలోను ఉన్నవారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ఎజ్రాకు ‘యాజకుడు’, ‘శాస్త్రి’ అనే రెండు సమానాధికరణ బిరుదులు ఉన్నాయి. దీనిని ‘యాజక-శాస్త్రి అయిన ఎజ్రా’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: వీరు ... ఉన్నవారు
  rationale: ముందటి వచనాల్లో పేర్కొన్న వ్యక్తులను సూచించే బహువచన సర్వనామం. క్రియలేని హీబ్రూ వాక్యాన్ని సహజమైన తెలుగులో చెప్పడానికి ‘ఉన్నవారు’ చేర్చబడింది.
- source_word: בִּימֵי
  choice: కాలంలో
  rationale: ఒక చారిత్రక కాలాన్ని సూచించే హీబ్రూ నుడికారానికి సహజమైన ఆధునిక తెలుగు సమానార్థకం.
- source_word: יוֹיָקִים
  choice: యోయాకీము
  rationale: ఇక్కడి యాజక వంశానికి చెందిన వ్యక్తి పేరును హీబ్రూ రూపానికి దగ్గరగా లిప్యంతరీకరించింది; రాజైన యెహోయాకీముతో గందరగోళం రాకుండా ఉంటుంది.
- source_word: בֶּן יֵשׁוּעַ בֶּן יוֹצָדָק
  choice: యెహోషాదాకు కుమారుడైన యేషూవ కుమారుడు
  rationale: వంశావళి సందర్భంలో בֶּן యొక్క సాధారణ అర్థమైన ‘కుమారుడు’ను నిలిపి, తెలుగు సంబంధ నిర్మాణానికి అనుగుణంగా పూర్వీకుల క్రమాన్ని సహజంగా అమర్చింది.
- source_word: וּבִימֵי
  choice: కాలంలోనూ
  rationale: హీబ్రూలో పునరుక్తమైన కాలసూచక నిర్మాణాన్ని తెలుగులో ‘నూ’ సముచ్చయంతో నిలిపింది.
- source_word: נְחֶמְיָה הַפֶּחָה
  choice: అధిపతియైన నెహెమ్యా
  rationale: פֶּחָה సామ్రాజ్య పరిపాలనలోని ప్రాంతీయ పాలకుని సూచిస్తుంది; ‘అధిపతి’ గౌరవప్రదమైన, సులభంగా అర్థమయ్యే తెలుగు పదం.
- source_word: וְעֶזְרָא הַכֹּהֵן הַסּוֹפֵר
  choice: యాజకుడు, శాస్త్రి అయిన ఎజ్రా
  rationale: హీబ్రూలో ఎజ్రాకు అన్వయించే రెండు సమానాధికరణ బిరుదులను వేర్వేరుగా నిలిపింది; అవి ఇద్దరు వ్యక్తులను సూచిస్తున్నాయనే అపార్థం రాకుండా ఏకవచన నిర్మాణం వాడింది.
