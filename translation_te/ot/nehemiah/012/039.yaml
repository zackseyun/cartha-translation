  edition: WLC
  text: וּ/מֵ/עַ֣ל לְ/שַֽׁעַר אֶ֠פְרַיִם וְ/עַל שַׁ֨עַר הַיְשָׁנָ֜ה וְ/עַל שַׁ֣עַר הַ/דָּגִ֗ים וּ/מִגְדַּ֤ל חֲנַנְאֵל֙ וּ/מִגְדַּ֣ל הַ/מֵּאָ֔ה וְ/עַ֖ד שַׁ֣עַר הַ/צֹּ֑אן וְ/עָ֣מְד֔וּ בְּ/שַׁ֖עַר הַ/מַּטָּרָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/039.yaml
  text: and above the Gate of Ephraim[a], and above the Old Gate, and above the Fish Gate, and the Tower of Hananel, and the Tower of the Hundred, and as far as the Sheep Gate[b]; and they stood at the Gate of the Guard.
translation:
  language: te
  text: ఎఫ్రాయిము ద్వారం పైనుండి, పాత ద్వారం పైనుగా, చేపల ద్వారం పైనుగా, హననేలు గోపురం పైనుగా, నూరు గోపురం పైనుగా, గొర్రెల ద్వారం వరకు వెళ్లి, వారు కావలి ద్వారం వద్ద నిలిచారు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “నిలిచారు” అనే పదానికి “ఆగారు” అని కూడా అనువదించవచ్చు. “కావలి ద్వారం”ను “చెరసాల ద్వారం” లేదా “కాపలా ద్వారం” అని కూడా అనువదించవచ్చు.
    reason: עמד అనే క్రియకు నిలబడటం లేదా సందర్భానుసారం ఆగటం అనే భావాలు ఉన్నాయి; מַטָּרָה కాపలా స్థలం, కావలి లేదా చెరసాల భావాలను సూచించగలదు.
lexical_decisions:
- source_word: וּמֵעַל לְשַׁעַר אֶפְרַיִם
  choice: ఎఫ్రాయిము ద్వారం పైనుండి
  rationale: מֵעַל యొక్క ‘పైనుండి/పైగా’ అనే స్థలార్థాన్ని, గోడమీద సాగుతున్న ఊరేగింపు సందర్భాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: שַׁעַר הַיְשָׁנָה
  choice: పాత ద్వారం
  rationale: הַיְשָׁנָהను ‘పాతది’ అనే విశేషణార్థంలో సూటిగా అనువదిస్తుంది; నిర్ధారణలేని స్థలనామ వివరణను చేర్చదు.
- source_word: שַׁעַר הַדָּגִים
  choice: చేపల ద్వారం
  rationale: ‘చేపల ద్వారం’ అనే నిర్మాణం హెబ్రీ బహువచన రూపాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: מִגְדַּל חֲנַנְאֵל
  choice: హనన్యేలు గోపురం
  rationale: מִגְדָּלను ‘గోపురం’గా, חֲנַנְאֵל అనే వ్యక్తినామాన్ని తెలుగు లిప్యంతరీకరణలో ఇస్తుంది.
- source_word: מִגְדַּל הַמֵּאָה
  choice: నూరు గోపురం
  rationale: ‘నూరు’ దేనిని సూచిస్తుందో అనిశ్చితంగా ఉన్నందున వివరణాత్మక ఊహను జోడించకుండా మూలంలోని సంక్షిప్త నామాన్ని కాపాడుతుంది.
- source_word: וְעַד שַׁעַר הַצֹּאן
  choice: గొర్రెల ద్వారం వరకు
  rationale: עַד సూచించే మార్గపు చివరి హద్దును ‘వరకు’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: וְעָמְדוּ
  choice: వారు ... నిలిచారు
  rationale: עמד యొక్క ప్రాథమిక అర్థమైన ‘నిలుచుట’ను కాపాడుతుంది; ఊరేగింపు సందర్భంలో ‘ఆగారు’ అనే భావం సాధ్యమైనందున దాన్ని పాదసూచికలో ఇస్తుంది.
- source_word: בְּשַׁעַר הַמַּטָּרָה
  choice: కావలి ద్వారం దగ్గర
  rationale: מַטָּרָהలోని కాపలా/కావలి సంబంధిత భావాన్ని అతిగా ‘చెరసాల’గా నిర్ధారించకుండా అందిస్తుంది; בְּను స్థలసందర్భంలో సహజమైన ‘దగ్గర’గా వ్యక్తం చేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం ఉపయోగించబడింది. వరుసగా వచ్చే స్థలచిహ్నాలను పునరుక్తి భారంగా కాకుండా స్పష్టమైన ఊరేగింపు మార్గంగా చూపేందుకు ‘పైనుండి ... మీదుగా ... వరకు’ అనే నిర్మాణం వాడబడింది. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
