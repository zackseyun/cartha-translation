    text: లేదా, అక్షరార్థంగా, ‘ఎజ్రాకు … అమర్యాకు.’ హీబ్రూ ఉపసర్గను ఈ విధంగా కూడా అనువదించవచ్చు; అయితే ఈ జాబితాలో అది ప్రతి యాజక వంశానికి సంబంధించిన ప్రతినిధిని సూచించే అవకాశం ఎక్కువ.
    reason: lexical_alternative
  - marker: b
    text: యెహోహానాను అనే పేరును ‘యోహానాను’ అని కూడా రాస్తారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְ/עֶזְרָא
  choice: ఎజ్రాకు
  rationale: ఈ యాజక కుటుంబాల జాబితాలో לְ ఉపసర్గ అనుబంధాన్ని లేదా ప్రాతినిధ్యాన్ని సూచిస్తుంది. తెలుగులో దత్తి విభక్తి ‘ఎజ్రాకు’ జాబితా సంక్షిప్తతను నిలుపుతూ, ఎజ్రా యాజక కుటుంబానికి సంబంధించిన ప్రతినిధి అనే భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: מְשֻׁלָּם
  choice: మెషుల్లాము
  rationale: ఇది వ్యక్తి పేరు. హీబ్రూ ధ్వనిరూపాన్ని గుర్తించగలిగేలా తెలుగు లిప్యంతరీకరణ చేయబడింది; పేరుకు సాధ్యమైన అర్థాన్ని అనువదించలేదు.
- source_word: לַ/אֲמַרְיָה
  choice: అమర్యాకు
  rationale: మొదటి పదబంధంలో వలే ఇక్కడ కూడా לַ ఉపసర్గ యాజక కుటుంబంతో అనుబంధం లేదా దాని ప్రాతినిధ్యాన్ని సూచిస్తుంది. ‘అమర్యాకు’ అనే రూపం సమాంతర జాబితా నిర్మాణాన్ని కాపాడుతుంది.
- source_word: יְהוֹחָנָן
  choice: యెహోహానాను
  rationale: పేరులోని יְהוֹ־ భాగాన్ని నిలుపుతూ హీబ్రూ పూర్తి రూపానికి సమీపంగా లిప్యంతరీకరించబడింది; సంక్షిప్త రూపమైన ‘యోహానాను’ను ప్రధాన పాఠంలో ఎంచుకోలేదు.
