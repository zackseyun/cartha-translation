translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, పేర్ల జాబితాకు తగిన సంక్షిప్తమైన మరియు గౌరవప్రదమైన శైలి ఉపయోగించబడింది. హీబ్రూ వాక్యంలో క్రియ లేకపోవడం, సమాంతర నిర్మాణం, విరామం అలాగే నిలుపబడ్డాయి. ‘ఎజ్రాకు/అమర్యాకు’ అనే దత్తి రూపాల సాధ్యమైన వంశార్థాన్ని పాదటిప్పణి స్పష్టం చేస్తుంది.
