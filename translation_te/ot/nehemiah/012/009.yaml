  text: And Bakbukiah and Unno[a], their brothers, stood opposite them in the divisions of service.
translation:
  language: te
  text: బక్బుక్యా, ఉన్నో[a], మరియు వారి సహోదరులు సేవా విభాగాల ప్రకారం వారికి ఎదురుగా నిలిచారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, וענו అనే రూపాన్ని ‘ఉన్నో’ అనే వ్యక్తిపేరుగా కాక క్రియగా చదివితే, “వారి సహోదరులు సేవా విభాగాల ప్రకారం వారికి ప్రత్యుత్తరం ఇచ్చారు” అని అర్థం కావచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: וּבַקְבֻּקְיָה
  choice: బక్బుక్యా
  rationale: వ్యక్తిపేరును ఆధునిక తెలుగు ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించాం; ముందున్న సంధికారకాన్ని తెలుగు జాబితా నిర్మాణంలో ప్రత్యేకంగా అనువదించాల్సిన అవసరం లేదు.
- source_word: ו/ענו
  choice: ఉన్నో[a]
  rationale: ఈ సందర్భంలోని లేవీయుల పేర్ల జాబితాకు అనుగుణంగా దీనిని వ్యక్తిపేరుగా స్వీకరించాం. అయితే ఇదే హల్లుల క్రమాన్ని క్రియారూపంగా చదివే అవకాశం ఉన్నందున పాదటిప్పణి ఇచ్చాం.
- source_word: אֲחֵיהֶם
  choice: వారి సహోదరులు
  rationale: హీబ్రూ బంధుత్వ పదాన్ని నేరుగా నిలిపి, వీరు ముందు పేర్కొన్నవారి సహోదరులని సూచించాం.
- source_word: לְנֶגְדָּם
  choice: వారికి ఎదురుగా నిలిచారు
  rationale: పదబంధానికి ‘వారికి ఎదురుగా’ అనే అర్థం ఉంది. ఆలయ సేవలో వారి అమరికను సహజమైన తెలుగులో తెలియజేయడానికి సందర్భం నుంచి ‘నిలిచారు’ అనే క్రియను పూరించాం.
- source_word: לְמִשְׁמָרוֹת
  choice: సేవా వంతుల ప్రకారం
  rationale: ఇక్కడ పదం ఆలయ పరిచర్యకు నియమించిన వంతులు లేదా విధి విభాగాలను సూచిస్తుంది; ‘సేవా వంతులు’ సాధారణ పాఠకునికి స్పష్టంగా ఉండి ఆలయసేవ సందర్భాన్ని నిలుపుతుంది.
