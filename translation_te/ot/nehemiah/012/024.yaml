  rationale: The revision corrects the personal-name transliteration, removes the awkward and slightly interpretive "వారితో ఉన్న" wording, and changes the praise/thanksgiving wording to purpose infinitives corresponding to the Hebrew. It retains the source's ambiguity concerning the matched service arrangement and keeps both footnote anchors attached to their relevant expressions.
