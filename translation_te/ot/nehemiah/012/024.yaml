id: NEH.12.24
reference: Nehemiah 12:24
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/רָאשֵׁ֣י הַ֠/לְוִיִּם חֲשַׁבְיָ֨ה שֵֽׁרֵבְיָ֜ה וְ/יֵשׁ֤וּעַ בֶּן קַדְמִיאֵל֙ וַ/אֲחֵי/הֶ֣ם לְ/נֶגְדָּ֔/ם לְ/הַלֵּ֣ל לְ/הוֹד֔וֹת בְּ/מִצְוַ֖ת דָּוִ֣יד אִישׁ הָ/אֱלֹהִ֑ים מִשְׁמָ֖ר לְ/עֻמַּ֥ת מִשְׁמָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/024.yaml
  text: And the heads of the Levites were Hashabiah[a], Sherebiah, and Jeshua son of Kadmiel, with their brothers opposite them, to praise and to give thanks according to the command of David the man of God[b], watch corresponding to watch.
translation:
  language: te
  text: లేవీయుల ప్రధానులు హషబ్యా, షేరేబ్యా, కద్మీయేలు కుమారుడైన యేషూవా; వారి సహోదరులు వారికి ఎదురుగా[a] నిలిచి, దేవుని మనుష్యుడైన దావీదు ఆజ్ఞ ప్రకారం స్తుతించడానికి, కృతజ్ఞతలు చెల్లించడానికి ఉన్నారు—సేవా విభాగానికి ఎదురుగా సేవా విభాగం[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారికి ముఖాముఖిగా” లేదా “వారికి సరిపోలిన విధంగా.” ఇది ఆరాధనలో ఎదురెదురుగా లేదా పరస్పరం సరిపోలేలా ఏర్పాటు చేసిన లేవీయుల బృందాలను సూచిస్తుండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా, “కాపలా వంతుకు ఎదురుగా కాపలా వంతు.” ఇది పరస్పరం సరిపోలిన సేవా విభాగాలను లేదా మారుమారుగా సేవచేసే బృందాలను సూచిస్తుండవచ్చు.
    reason: cultural_note
lexical_decisions:
- source_word: רָאשֵׁי הַלְוִיִּם
  choice: లేవీయుల నాయకులు
  rationale: רָאשֵׁי అనే నాయకత్వార్థక బహువచనాన్ని ఆధునిక తెలుగులో సహజంగా ‘నాయకులు’ అని ఇచ్చి, లేవీయుల సమూహానికి చెందినవారని స్పష్టంగా ఉంచింది.
- source_word: חֲשַׁבְיָה שֵׁרֵבְיָה וְיֵשׁוּעַ בֶּן קַדְמִיאֵל
  choice: హషబ్యా, షేరేబ్యా, కద్మీయేలు కుమారుడైన యేషూవ
  rationale: హీబ్రూ వ్యక్తినామాలను లిప్యంతరీకరించి, తండ్రి–కొడుకు సంబంధాన్ని పూర్తిగా నిలిపింది.
- source_word: וַאֲחֵיהֶם
  choice: వారితో ఉన్న వారి సహోదరులు
  rationale: పేర్కొన్న నాయకులతో అనుబంధంగా ఉన్న పురుష లేవీయులను సూచించే బంధుత్వ పదాన్ని నిలిపి, వాక్యసంబంధాన్ని తెలుగులో స్పష్టం చేసింది.
- source_word: לְנֶגְדָּם
  choice: వారికి ఎదురుగా
  rationale: స్థానపరంగా ‘ఎదురుగా’ ఉండటాన్ని నేరుగా తెలియజేస్తుంది; పరస్పరం సరిపోలిన ఆరాధనా బృందాలు అనే సాధ్యార్థాన్ని పాదసూచికలో ఉంచింది.
- source_word: לְהַלֵּל לְהוֹדוֹת
  choice: స్తుతిస్తూ కృతజ్ఞతలు చెల్లించారు
  rationale: స్తుతి, కృతజ్ఞత అనే రెండు వేర్వేరు ఆరాధనా క్రియలను నిలిపి, తెలుగులో సహజమైన క్రియారూపాలను వాడింది.
- source_word: בְּמִצְוַת
  choice: ఆజ్ఞ ప్రకారం
  rationale: అధికారపూర్వక ఆదేశానికి అనుగుణంగా చేసిన కార్యమనే భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: דָּוִיד אִישׁ הָאֱלֹהִים
  choice: దైవజనుడైన దావీదు
  rationale: ‘దేవుని మనిషి’ అనే హీబ్రూ బిరుదుకు తెలుగులో స్థిరమైన, గౌరవప్రదమైన బైబిలు ప్రయోగాన్ని ఎంచుకుంది.
- source_word: מִשְׁמָר לְעֻמַּת מִשְׁמָר
  choice: ఒక సేవా వంతుకు ఎదురుగా మరో సేవా వంతు
  rationale: మִשְׁמָר యొక్క క్రమబద్ధమైన ఆలయ సేవా విభాగం/వంతు భావాన్ని సందర్భానుసారంగా అందిస్తూ, పునరుక్తి మరియు ఎదురెదురు నిర్మాణాన్ని నిలిపింది.
theological_decisions:
- issue: אֲחֵיהֶם అనే లింగసూచక బంధుత్వ పదం
  choice: వారి సహోదరులు
  alternative: తోటి లేవీయులు
  rationale: మూలంలోని పురుష బహువచన బంధుత్వ పదాన్ని తటస్థీకరించకుండా నిలిపింది.
- issue: מִשְׁמָר לְעֻמַּת מִשְׁמָר అనే సంక్షిప్త ఆలయసేవా పదబంధం
  choice: ఒక సేవా వంతుకు ఎదురుగా మరో సేవా వంతు
  alternative: ఒక కాపలా పాళికి ఎదురుగా మరో కాపలా పాళి
  rationale: ఇది పరస్పరం సరిపోలిన లేదా మారుమారుగా సేవచేసిన విభాగాలను సూచించవచ్చు; అయితే మూలం స్పష్టంగా ‘ప్రతిస్పందన గానం’ అని చెప్పనందున ఆ భావాన్ని ప్రధాన పాఠ్యంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. హీబ్రూ వాక్యంలో స్పష్టమైన సమాపక క్రియ లేకపోవడంతో తెలుగులో అవసరమైన ‘నిలబడి… చెల్లించారు’ అనే క్రియలను సందర్భానుసారంగా సరఫరా చేసింది; అయినా ఎదురెదురు సేవా ఏర్పాటుకు సంబంధించిన మూలంలోని సంక్షిప్తతను పాదసూచికలతో సంరక్షించింది.
