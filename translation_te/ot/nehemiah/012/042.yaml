translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా ఉండే శైలిని అనుసరించాం. వచనం ముందరి వాక్యంలోని జాబితాను కొనసాగించవచ్చనే నిర్మాణాన్ని నిలుపుతూ, తెలుగులో స్వతంత్రంగా చదవదగిన రీతిలో ఇచ్చాం.
