source:
  edition: WLC
  text: וּ/מַעֲשֵׂיָ֨ה וּֽ/שְׁמַֽעְיָ֜ה וְ/אֶלְעָזָ֧ר וְ/עֻזִּ֛י וִֽ/יהוֹחָנָ֥ן וּ/מַלְכִּיָּ֖ה וְ/עֵילָ֣ם וָ/עָ֑זֶר וַ/יַּשְׁמִ֨יעוּ֙ הַ/מְשֹׁ֣רְרִ֔ים וְ/יִֽזְרַחְיָ֖ה הַ/פָּקִֽיד׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/042.yaml
  text: and Maaseiah[a], Shemaiah, Eleazar, Uzzi, Jehohanan, Malkijah, Elam, and Ezer. And the singers made their voices heard[b], with Izrahiah the overseer.
translation:
  language: te
  text: మయశేయా, షెమయా, ఎలియాజరు, ఉజ్జీ, యెహోహానాను, మల్కీయా, ఏలాము, ఏజెరు. గాయకులు తమ స్వరాలను వినిపించారు[a]; యిజ్రహ్యా వారికి పర్యవేక్షకుడిగా ఉన్నాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “గాయకులు వినిపించేటట్లు చేశారు”; సందర్భంలో “బిగ్గరగా పాడారు” అని కూడా అనువదించవచ్చు.
    reason: కారణార్థక హెబ్రీ క్రియలోని భావాన్ని, సందర్భానుగుణ ప్రత్యామ్నాయాన్ని తెలియజేయడానికి.
  - marker: b
    text: లేదా “అధికారి,” “పర్యవేక్షణ బాధ్యతగలవాడు.”
    reason: హెబ్రీ పదం పరిపాలనా లేదా పర్యవేక్షణ బాధ్యతకు నియమించబడిన వ్యక్తిని సూచించగలదు.
lexical_decisions:
- source_word: מַעֲשֵׂיָה
  choice: మయశేయా
  rationale: వ్యక్తి పేరును హెబ్రీ ఉచ్చారణకు దగ్గరగా, తెలుగులో చదవడానికి సహజంగా లిప్యంతరీకరించాం.
- source_word: שְׁמַעְיָה
  choice: షెమయా
  rationale: వ్యక్తి పేరును అనువదించకుండా లిప్యంతరీకరించాం.
- source_word: אֶלְעָזָר
  choice: ఎలియాజరు
  rationale: తెలుగు బైబిలు నామరూపాలకు సుపరిచితమైన రూపాన్ని ఉపయోగించాం.
- source_word: עֻזִּי
  choice: ఉజ్జీ
  rationale: హెబ్రీ వ్యంజన ద్విత్వాన్ని సహజ తెలుగు రూపంలో నిలిపాం.
- source_word: יְהוֹחָנָן
  choice: యెహోహానాను
  rationale: పాఠంలోని సంపూర్ణ హెబ్రీ నామరూపాన్ని ప్రతిబింబించేలా లిప్యంతరీకరించాం.
- source_word: מַלְכִּיָּה
  choice: మల్కీయా
  rationale: వ్యక్తి పేరును హెబ్రీ రూపానికి దగ్గరగా లిప్యంతరీకరించాం.
- source_word: עֵילָם
  choice: ఏలాము
  rationale: ఇక్కడ ప్రాంతం కాక వ్యక్తి పేరు; అందువల్ల నామరూపంగానే ఇచ్చాం.
- source_word: עָזֶר
  choice: ఏజెరు
  rationale: వ్యక్తి పేరును సహజ తెలుగు ధ్వనిరూపంలో లిప్యంతరీకరించాం.
- source_word: וַיַּשְׁמִיעוּ
  choice: తమ స్వరాలు వినిపించేలా పాడారు
  rationale: హిఫీల్ క్రియలోని ‘వినిపించేటట్లు చేయడం’ అనే కారణార్థాన్ని, గాయకుల సందర్భానికి తగిన సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: הַמְשֹׁרְרִים
  choice: గాయకులు
  rationale: ఆలయ సంగీత సందర్భంలో నేరుగా, స్పష్టంగా అర్థమయ్యే పదం.
- source_word: יִזְרַחְיָה
  choice: యిజ్రహ్యా
  rationale: వ్యక్తి పేరును మూలభాషకు దగ్గరగా లిప్యంతరీకరించాం.
- source_word: הַפָּקִיד
  choice: పర్యవేక్షకుడు
  rationale: నియమించబడిన పర్యవేక్షణ లేదా బాధ్యతను సూచిస్తుంది; పదవీ స్థాయిని అతిగా నిర్దిష్టం చేయదు.
