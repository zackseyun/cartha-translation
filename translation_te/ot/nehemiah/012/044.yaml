source:
  edition: WLC
  text: וַ/יִּפָּקְד֣וּ בַ/יּוֹם֩ הַ/ה֨וּא אֲנָשִׁ֜ים עַל הַ/נְּשָׁכ֗וֹת לָ/א֨וֹצָר֥וֹת לַ/תְּרוּמוֹת֮ לָ/רֵאשִׁ֣ית וְ/לַ/מַּֽעַשְׂרוֹת֒ לִ/כְנ֨וֹס בָּ/הֶ֜ם לִ/שְׂדֵ֤י הֶ/עָרִים֙ מְנָא֣וֹת הַ/תּוֹרָ֔ה לַ/כֹּהֲנִ֖ים וְ/לַ/לְוִיִּ֑ם כִּ֚י שִׂמְחַ֣ת יְהוּדָ֔ה עַל הַ/כֹּהֲנִ֥ים וְ/עַל הַ/לְוִיִּ֖ם הָ/עֹמְדִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/044.yaml
  text: On that day men were appointed over the storerooms for the contributions[a], for the firstfruits, and for the tithes, to gather into them from the fields of the cities the portions required by the law for the priests and for the Levites[c][b], for Judah rejoiced over the priests and over the Levites who were serving.
translation:
  language: te
  text: ఆ రోజున భాండాగారాల కోసం ఉన్న గదుల బాధ్యతకు కొంతమంది పురుషులు నియమించబడ్డారు—అర్పణలు, ప్రథమఫలాలు, పదవ వంతుల కోసం.[a] యాజకులకు, లేవీయులకు ధర్మశాస్త్రం నిర్దేశించిన వాటాలను పట్టణాల పొలాల నుంచి ఆ గదుల్లో సమకూర్చడం వారి పని.[b] సేవలో నిలిచి ఉన్న యాజకులను, లేవీయులను బట్టి యూదా ప్రజలు సంతోషించారు.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “భాండాగారాల కోసం ఉన్న గదులు” అని అనువదించిన హీబ్రూ పదాలు అక్షరార్థంగా “నిల్వల/భాండాగారాల కోసం గదులు” అని అర్థం. ఇక్కడ దేవాలయానికి సమర్పించిన వస్తువులను ఉంచే గదులు ఉద్దేశం.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా “ధర్మశాస్త్రపు వాటాలు”; అంటే యాజకులకు, లేవీయులకు తోరా నిర్దేశించిన భాగాలు.
    reason: lexical_alternative
  - marker: c
    text: “సేవలో నిలిచి ఉన్న” అనేది అక్షరార్థంగా “నిలిచి ఉన్న.” దేవాలయ సందర్భంలో ఇది పరిచర్యకు హాజరై సేవ చేయడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפָּקְדוּ
  choice: నియమించబడ్డారు
  rationale: פקד యొక్క నిష్క్రియ పరిపాలనా భావాన్ని, అధికారికంగా బాధ్యత అప్పగించబడినట్లు స్పష్టంగా తెలియజేస్తుంది.
- source_word: אֲנָשִׁים
  choice: కొందరు పురుషులు
  rationale: హీబ్రూలోని పురుష బహువచనాన్ని నిలుపుతూ, అనిర్దిష్ట వ్యక్తులను సహజమైన తెలుగులో సూచిస్తుంది.
- source_word: הַנְּשָׁכוֹת לָאֹצָרוֹת
  choice: నిల్వచేసే గదులు
  rationale: నְשָׁכוֹת అనే గదుల భావాన్నీ, אֹצָרוֹת సూచించే నిల్వ/భాండాగార ప్రయోజనాన్నీ ఒకే సహజ పదబంధంలో వ్యక్తం చేస్తుంది; ఇవి అదనంగా వేరే భాండాగారాలు అన్న భావాన్ని కలిగించదు.
- source_word: לַתְּרוּמוֹת
  choice: అర్పణలు
  rationale: పవిత్ర ఉపయోగం కోసం ప్రత్యేకంగా సమర్పించిన వాటిని ఆధునిక తెలుగు పాఠకునికి సహజంగా తెలియజేస్తుంది; కేవలం సాధారణ విరాళాలనే సూచించేలా పరిమితం చేయదు.
- source_word: לָרֵאשִׁית
  choice: ప్రథమఫలాలు
  rationale: దేవునికి సమర్పించే పంట మొదటి భాగాన్ని సూచించే స్థిరమైన ఆరాధనా పదం.
- source_word: וְלַמַּעַשְׂרוֹת
  choice: పదవ వంతులు
  rationale: מעשרות యొక్క అర్థాన్ని పారదర్శకమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: לִכְנוֹס בָּהֶם
  choice: ఆ గదుల్లో సమకూర్చడం
  rationale: సరుకులను ఆ గదుల్లోకి సేకరించే దిశాత్మక, పరిపాలనా భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לִשְׂדֵי הֶעָרִים
  choice: పట్టణాల పొలాల నుంచి
  rationale: పట్టణాలకు అనుబంధమైన వ్యవసాయ భూముల భావాన్ని మూలానికి సన్నిహితంగా ఉంచుతుంది.
- source_word: מְנָאוֹת הַתּוֹרָה
  choice: ధర్మశాస్త్రం నిర్దేశించిన వాటాలు
  rationale: అక్షరార్థమైన ‘ధర్మశాస్త్రపు వాటాలు’ అనే సంబంధాన్ని, తోరా నిర్దేశించిన భాగాలుగా స్పష్టంగా మరియు సహజంగా తెలియజేస్తుంది.
- source_word: לַכֹּהֲנִים וְלַלְוִיִּם
  choice: యాజకులకు, లేవీయులకు
  rationale: రెండు గ్రహీత వర్గాలను వేర్వేరుగా, స్పష్టంగా నిలుపుతుంది.
- source_word: כִּי שִׂמְחַת יְהוּדָה
  choice: యూదా ప్రజలు సంతోషించారు
  rationale: ‘యూదా యొక్క ఆనందం’ అనే నామవాచక నిర్మాణాన్ని సహజ క్రియారూపంలో ఇస్తూ, ఇక్కడ యూదా అంటే సమాజమని స్పష్టం చేస్తుంది.
- source_word: הָעֹמְדִים
  choice: సేవలో నిలిచి ఉన్న
  rationale: ‘నిలిచి ఉన్న’ అనే మూల రూపకాన్ని కాపాడుతూ, దేవాలయ పరిచర్య సందర్భంలోని సేవ భావాన్ని కూడా తెలియజేస్తుంది.
theological_decisions:
- issue: הָעֹמְדִים అనే పదంలో ‘నిలుచుట’ మరియు ‘సేవచేయుట’ మధ్య సంబంధం
  choice: సేవలో నిలిచి ఉన్న
  alternative: సేవ చేస్తున్న
  rationale: దేవాలయ పరిచర్య భావాన్ని తెలుపుతూనే హీబ్రూ పదంలోని అక్షరార్థ రూపకాన్ని పూర్తిగా తొలగించకుండా ఉంచుతుంది.
- issue: יְהוּדָה యొక్క సమూహార్థం
  choice: యూదా ప్రజలు
  alternative: యూదా
  rationale: ఇది భూభాగం కంటే యూదా సమాజాన్ని సూచిస్తున్నదని సహజ తెలుగులో తెలియజేస్తుంది; ఎటువంటి సంఘపరమైన ప్రత్యేక వ్యాఖ్యానాన్నీ చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే వాక్య నిర్మాణం. దీర్ఘమైన హీబ్రూ వాక్యాన్ని మూడు సహజ వాక్యాలుగా విభజించాం. ‘ధర్మశాస్త్రం’ ద్వారా התורה యొక్క సందర్భోచిత భావం, ‘లేవీయులు’ ద్వారా సాంప్రదాయ బైబిలు నామరూపం నిలుపబడ్డాయి. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో వరుసగా చేర్చబడ్డాయి.
