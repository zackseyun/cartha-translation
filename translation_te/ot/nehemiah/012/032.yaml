translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడబడింది. ఊరేగింపు సందర్భాన్ని స్పష్టం చేస్తూనే హీబ్రూ పదంలోని ప్రత్యామ్నాయ భావాన్ని పాదటిప్పణిలో నిలుపుకున్నాం.
