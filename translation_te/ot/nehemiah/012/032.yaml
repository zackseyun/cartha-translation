translation:
  language: te
  text: హోషయా, యూదా అధికారులలో సగం మంది వారి వెనుక నడిచారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘వారి తరువాత.’ హీబ్రూ పదం వరుసలో అనుసరించడాన్ని సూచించగలదు; ‘వారి వెనుక’ అనేది ఊరేగింపు దృశ్యాన్ని స్పష్టంగా చూపిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: నడిచారు
  rationale: הלך అనే క్రియ ఇక్కడ ఊరేగింపులో ముందున్నవారిని అనుసరిస్తూ వెళ్లడాన్ని సూచిస్తుంది. కర్తలో హోషయాతో పాటు అధికారుల సమూహం ఉన్నందున తెలుగులో గౌరవ/బహువచన క్రియ సహజంగా ఉంటుంది.
- source_word: אַחֲרֵיהֶם
  choice: వారి వెనుక
  rationale: אַחֲרֵי ఇక్కడ ఊరేగింపులో భౌతికంగా వెనుక అనుసరించే క్రమాన్ని సూచిస్తుంది; ‘వారి తరువాత’ కూడా సాధ్యమైన అనువాదం.
- source_word: הוֹשַׁעְיָה
  choice: హోషయా
  rationale: వ్యక్తి పేరును హీబ్రూ రూపానికి దగ్గరగా తెలుగు లిప్యంతరీకరణ చేశాం.
- source_word: וַחֲצִי
  choice: సగం మంది
  rationale: חֲצִי అంటే ‘సగం’. వ్యక్తుల సమూహాన్ని సూచిస్తున్నందున తెలుగులో ‘సగం మంది’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: שָׂרֵי
  choice: అధికారులలో
  rationale: שַׂר అనే పదం అధిపతి, నాయకుడు, అధికారి అనే అర్థాలను కలిగి ఉంటుంది. ఈ పరిపాలనా-ఉత్సవ సందర్భంలో ‘అధికారులు’ రాజకుమారులు అనే అనవసర భావాన్ని కలిగించకుండా సరిపోతుంది; ‘లో’ నిర్మాణం మొత్తం అధికారులలో సగం మందిని సూచిస్తుంది.
- source_word: יְהוּדָה
  choice: యూదా
  rationale: ప్రాంతం/గోత్రం పేరుకు ప్రామాణిక తెలుగు రూపం.
