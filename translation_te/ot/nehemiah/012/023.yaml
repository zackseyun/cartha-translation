id: NEH.12.23
reference: Nehemiah 12:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: בְּנֵ֤י לֵוִי֙ רָאשֵׁ֣י הָֽ/אָב֔וֹת כְּתוּבִ֕ים עַל סֵ֖פֶר דִּבְרֵ֣י הַ/יָּמִ֑ים וְ/עַד יְמֵ֖י יֽוֹחָנָ֥ן בֶּן אֶלְיָשִֽׁיב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/023.yaml
  text: The sons of Levi[a], heads of fathers’ houses, were recorded in the book of the chronicles[b], up to the days of Yohanan son of Eliashib.
translation:
  language: te
  text: లేవి కుమారులైన పితృకుటుంబాల పెద్దలు ఎల్యాషీబు కుమారుడైన యోహానాను రోజుల వరకు దినవృత్తాంతాల గ్రంథంలో[a] నమోదు చేయబడ్డారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “దినవృత్తాంతాల గ్రంథం” అనేది అధికారిక చారిత్రక నమోదు లేదా వార్షిక వృత్తాంతాలను సూచిస్తుంది; ఇది తప్పనిసరిగా బైబిలులోని దినవృత్తాంతాల గ్రంథాలనే సూచించదు.
    reason: cultural_note
lexical_decisions:
- source_word: בְּנֵי לֵוִי
  choice: లేవి కుమారులలో
  rationale: మూలంలోని ‘లేవి కుమారులు’ అనే వంశసంబంధ భావాన్ని నిలుపుతూ, వెంటనే వచ్చే ‘పితృవంశాల పెద్దలు’ వారిలోని ఒక వర్గమని తెలుగులో సహజంగా తెలియజేయడానికి ‘లో’ చేర్చబడింది.
- source_word: רָאשֵׁי הָאָבוֹת
  choice: పితృవంశాల పెద్దలు
  rationale: ఈ హెబ్రీయ ఇడియమ్ కుటుంబ లేదా వంశ విభాగాల నాయకులను సూచిస్తుంది. ‘పితృవంశాల పెద్దలు’ వంశపరమైన భావాన్నీ నాయకత్వాన్నీ సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: כְּתוּבִים
  choice: పేర్లు ... నమోదు చేయబడ్డాయి
  rationale: సందర్భం వ్యక్తుల జాబితా లేదా అధికారిక నమోదుకు సంబంధించినది. హెబ్రీ పాఠంలో ‘పేర్లు’ ప్రత్యక్షంగా లేకపోయినా, తెలుగులో కర్తలు గ్రంథంలో నమోదు కావడం అంటే వారి పేర్లు నమోదయ్యాయని స్పష్టపరచడం సహజం.
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים
  choice: దినవృత్తాంతాల గ్రంథంలో
  rationale: ఇది ఒక లిఖిత చారిత్రక నమోదు లేదా రాజ్య/సమాజ వార్షిక వృత్తాంత గ్రంథాన్ని సూచిస్తుంది. עַל అక్షరార్థంగా ‘మీద’ అయినా, గ్రంథంలో నమోదు అనే సందర్భంలో తెలుగులో ‘లో’ సహజం.
- source_word: וְעַד יְמֵי
  choice: రోజుల వరకు
  rationale: నమోదు కొనసాగిన కాలపరిమితిని మూలానికి దగ్గరగా వ్యక్తం చేస్తుంది.
- source_word: יוֹחָנָן
  choice: యోహానాను
  rationale: హెబ్రీ పేరులోని యో-ఖా/హా-నాన్ ధ్వన్యాకృతిని తెలుగు లిప్యంతరీకరణలో దగ్గరగా ప్రతిబింబిస్తుంది; వాక్యవిభక్తి కారణంగా ‘యోహానాను’ రూపం వచ్చింది.
- source_word: בֶּן אֶלְיָשִׁיב
  choice: ఎల్యాషీబు కుమారుడైన
  rationale: సాధారణ పితృనామ సంబంధాన్ని తెలుగులో సహజంగా, స్పష్టంగా వ్యక్తం చేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. వంశ నిర్మాణాన్ని కాపాడుతూ పరిపాలనా నమోదు భావాన్ని సహజంగా వ్యక్తం చేసింది. ఆంగ్లంలో అవసరమైన Yohanan/Johanan లిప్యంతరీకరణ గమనిక తెలుగులో ప్రత్యేక అర్థభేదాన్ని ఇవ్వనందున చేర్చలేదు.
