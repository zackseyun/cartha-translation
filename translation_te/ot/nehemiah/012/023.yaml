revisions:
- from: లేవి కుమారులలో పితృవంశాల పెద్దల పేర్లు, ఎల్యాషీబు కుమారుడైన యోహానాను రోజుల వరకు, దినవృత్తాంతాల గ్రంథంలో[a] నమోదు చేయబడ్డాయి.
  to: లేవి కుమారులైన పితృకుటుంబాల పెద్దలు ఎల్యాషీబు కుమారుడైన యోహానాను రోజుల వరకు దినవృత్తాంతాల గ్రంథంలో[a] నమోదు చేయబడ్డారు.
  rationale: The revision removes the unsupported explicit reference to names and restores the Hebrew’s appositional structure by identifying the ancestral-house heads as Levites. It retains the temporal scope, patronymic, and the cautious explanatory footnote.
