  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదంగా, సాధారణ పాఠకులకు సులభంగా ఉండే శైలిని వాడాం. వ్యక్తినామాలను మూల హీబ్రూ రూపాలకు దగ్గరగా లిప్యంతరీకరించాం; బూరలకు సంబంధించిన హీబ్రూ నిర్మాణంలోని స్వల్ప సందిగ్ధతను పాదసూచికలో నిలిపాం.
