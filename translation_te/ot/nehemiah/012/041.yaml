  text: וְ/הַ/כֹּהֲנִ֡ים אֶלְיָקִ֡ים מַעֲשֵׂיָ֡ה מִ֠נְיָמִין מִיכָיָ֧ה אֶלְיוֹעֵינַ֛י זְכַרְיָ֥ה חֲנַנְיָ֖ה בַּ/חֲצֹצְרֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/041.yaml
  text: 'and the priests: Eliakim[a], Maaseiah, Miniamin, Micaiah, Elioenai, Zechariah, and Hananiah, with trumpets.'
translation:
  language: te
  text: 'మరియు బూరలతో ఉన్న యాజకులు: ఎల్యాకీము, మయశేయా, మిన్యామీను, మీకాయా, ఎల్యోయేనై, జెకర్యా, హనన్యా.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “బూరలతో.” హీబ్రూ పదబంధం ఈ యాజకులు బూరలతో కలిసి ఉన్నారని లేదా బూరల బాధ్యత వారికి అప్పగించబడిందని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/הַ/כֹּהֲנִים
  choice: యాజకులైన
  rationale: ముందటి వాక్యంలోని జాబితాను కొనసాగించే וְ భావం తెలుగు వాక్యప్రవాహంలో సహజంగా అంతర్లీనమైంది; הַכֹּהֲנִים ను సాధారణ ఆధునిక తెలుగు పదమైన ‘యాజకులు’గా ఇచ్చాం.
- source_word: אֶלְיָקִים
  choice: ఎల్యాకీము
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు బైబిలు నామరూపాలకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: מַעֲשֵׂיָה
  choice: మయశేయా
  rationale: హీబ్రూ ఉచ్చారణను సాధ్యమైనంత దగ్గరగా ప్రతిబింబించే తెలుగు లిప్యంతరీకరణ.
- source_word: מִנְיָמִין
  choice: మిన్యామీను
  rationale: ఈ వచనంలోని హీబ్రూ వ్యంజన రూపాన్ని అనుసరించి లిప్యంతరీకరించాం.
- source_word: מִיכָיָה
  choice: మీకాయా
  rationale: హీబ్రూ వ్యక్తినామానికి సహజమైన తెలుగు లిప్యంతరీకరణ.
- source_word: אֶלְיוֹעֵינַי
  choice: ఎల్యోయేనై
  rationale: మూలంలోని ధ్వని నిర్మాణాన్ని నిలుపుకునే తెలుగు లిప్యంతరీకరణ.
- source_word: זְכַרְיָה
  choice: జెకర్యా
  rationale: హీబ్రూ వ్యక్తినామాన్ని మూల ఉచ్చారణకు సమీపంగా లిప్యంతరీకరించాం.
- source_word: חֲנַנְיָה
  choice: హనన్యా
  rationale: హీబ్రూ వ్యక్తినామానికి సులభంగా చదవగల తెలుగు లిప్యంతరీకరణ.
- source_word: בַּ/חֲצֹצְרֽוֹת
  choice: బూరలతో
  rationale: בְּ ఉపసర్గ ఇక్కడ సహవాసం లేదా వాద్య వినియోగాన్ని సూచించవచ్చు; חֲצֹצְרוֹת అనేది ఆరాధనా సందర్భంలో ఊదే లోహ బూరలను సూచిస్తుంది.
