id: NEH.12.35
reference: Nehemiah 12:35
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/מִ/בְּנֵ֥י הַ/כֹּהֲנִ֖ים בַּ/חֲצֹצְר֑וֹת זְכַרְיָ֨ה בֶן יֽוֹנָתָ֜ן בֶּן שְׁמַֽעְיָ֗ה בֶּן מַתַּנְיָה֙ בֶּן מִ֣יכָיָ֔ה בֶּן זַכּ֖וּר בֶּן אָסָֽף־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/035.yaml
  text: 'and from the sons of the priests[a], with trumpets: Zechariah son of Jonathan, son of Shemaiah, son of Mattaniah, son of Micaiah, son of Zaccur, son of Asaph.'
translation:
  language: te
  text: 'యాజకుల కుమారులలో కొందరు బాకాలతో: ఆసాఫు కుమారుడైన జక్కూరు కుమారుడు, మీకాయా కుమారుడు, మత్తన్యా కుమారుడు, షెమయా కుమారుడు, యోనాతాను కుమారుడైన జెకర్యా.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמִבְּנֵי הַכֹּהֲנִים
  choice: యాజకుల కుమారులలో కొందరు
  rationale: וּ + מִן కలిసిన నిర్మాణం సమూహంలోని ఒక భాగాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘కుమారులలో కొందరు’ అని అనడం ఆ భాగార్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: בַּחֲצֹצְרוֹת
  choice: బాకాలతో ఉన్నారు
  rationale: ఇక్కడ בְּ సాధనార్థకం; ఊరేగింపులో వారు బాకాలు ధరించి లేదా వాయిస్తూ పాల్గొన్నారని సందర్భం సూచిస్తుంది. మూలంలో లేని క్రియావిశేషాన్ని అతిగా నిర్దిష్టం చేయకుండా ‘బాకాలతో’ అని అనువదించబడింది.
- source_word: זְכַרְיָה
  choice: జెకర్యా
  rationale: తెలుగు బైబిలు నామరూప సంప్రదాయానికి అనుగుణమైన లిప్యంతరీకరణ.
- source_word: בֶן
  choice: కుమారుడు / కుమారుడైన
  rationale: వంశావళి గొలుసును స్పష్టంగా నిలుపుతూ, తెలుగులో సహజమైన అన్వయంతో పునరావృతం చేయబడింది.
- source_word: יוֹנָתָן
  choice: యోనాతాను
  rationale: హీబ్రూ వ్యక్తినామానికి స్థిరమైన తెలుగు బైబిలు రూపం.
- source_word: שְׁמַעְיָה
  choice: షెమయా
  rationale: హీబ్రూ ధ్వనులకు దగ్గరగా ఉండే సహజ తెలుగు లిప్యంతరీకరణ.
- source_word: מַתַּנְיָה
  choice: మత్తన్యా
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు లిపిలో ధ్వన్యనుసారంగా అందిస్తుంది.
- source_word: מִיכָיָה
  choice: మీకాయా
  rationale: చిన్న రూపమైన మీకాతో భేదాన్ని ఉంచే లిప్యంతరీకరణ.
- source_word: זַכּוּר
  choice: జక్కూరు
  rationale: హీబ్రూ వ్యంజన ద్విత్వం మరియు దీర్ఘ స్వరాన్ని ప్రతిబింబించే తెలుగు రూపం.
- source_word: אָסָף
  choice: ఆసాఫు
  rationale: తెలుగులో ప్రాచుర్యంలో ఉన్న బైబిలు నామరూపం.
theological_decisions:
- issue: ఆసాఫుతో వంశ సంబంధం
  choice: ‘ఆసాఫు కుమారుడైన జక్కూరు కుమారుడు...’ అంటూ పేర్కొన్న వంశక్రమాన్ని యథాతథంగా ఉంచడం
  alternative: ‘ఆసాఫు వంశస్థుడు’ అని విస్తృత వంశార్థంతో చెప్పడం
  rationale: హీబ్రూ పాఠం בֶן అనే పదాన్ని వరుసగా ఉపయోగిస్తుంది. గాయకవర్గ సభ్యత్వం లేదా కీర్తన రచయితత్వం వంటి అదనపు వ్యాఖ్యానాన్ని వచనంలో చేర్చకుండా పేర్కొన్న వంశక్రమాన్ని కాపాడాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. తెలుగు వాక్యనిర్మాణంలో వంశావళి స్పష్టంగా ఉండేందుకు హీబ్రూ క్రమాన్ని తిరగబెట్టి ఆసాఫు నుండి జెకర్యా వరకు పూర్వీకుల సంబంధాన్ని సహజంగా అమర్చింది. ప్రధాన పాఠంలోని [a] సూచికకు అనుగుణంగా అడుగుటిప్పణి ఇవ్వబడింది.
