id: NEH.12.7
reference: Nehemiah 12:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: סַלּ֣וּ עָמ֔וֹק חִלְקִיָּ֖ה יְדַֽעְיָ֑ה אֵ֣לֶּה רָאשֵׁ֧י הַ/כֹּהֲנִ֛ים וַ/אֲחֵי/הֶ֖ם בִּ/ימֵ֥י יֵשֽׁוּעַ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/007.yaml
  text: Sallu[a], Amok, Hilkiah[c][b], Jedaiah—these were the heads of the priests and their brothers in the days of Jeshua.
translation:
  language: te
  text: సల్లూ, ఆమోకు, హిల్కీయా, యెదాయా—వీరు యేషూవ కాలంలో యాజకుల ప్రధానులూ[a] వారి సహోదరులూ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూల హీబ్రూలో అక్షరార్థంగా ‘యాజకుల తలలు’; భావం ‘యాజకుల నాయకులు’ లేదా ‘యాజకుల పెద్దలు.’
    reason: lexical_alternative
  - marker: b
    text: ‘సహోదరులు’ అనే హీబ్రూ పదం ఇక్కడ ‘బంధువులు’ లేదా ‘తోటి యాజకులు’ అని కూడా భావించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: סַלּוּ
  choice: సల్లూ
  rationale: వ్యక్తి పేరు; హీబ్రూ ఉచ్చారణకు దగ్గరగా తెలుగు లిప్యంతరీకరణ చేయబడింది.
- source_word: עָמוֹק
  choice: ఆమోకు
  rationale: పేర్ల జాబితాలోని వ్యక్తి పేరు; తెలుగులో సహజంగా పలికేలా లిప్యంతరీకరించబడింది.
- source_word: חִלְקִיָּה
  choice: హిల్కీయా
  rationale: హీబ్రూ వ్యక్తి పేరును తెలుగు బైబిలు నామరూపాలకు అనుగుణంగా లిప్యంతరీకరించింది.
- source_word: יְדַעְיָה
  choice: యెదాయా
  rationale: వ్యక్తి పేరును అనువదించకుండా లిప్యంతరీకరించింది.
- source_word: אֵלֶּה
  choice: వీరు
  rationale: ముందు పేర్కొన్న వ్యక్తులను సూచించే బహువచన సర్వనామం; తెలుగులో సహజంగా ఉండేందుకు ‘వీరు’ వాడబడింది.
- source_word: רָאשֵׁי
  choice: నాయకులుగా
  rationale: మూలంలో అక్షరార్థంగా ‘తలలు’ అని ఉన్నా, సందర్భంలో సమూహాలకు నాయకత్వం వహించినవారిని సూచిస్తుంది. తరువాతి కాలపు సాంకేతిక హోదాను సూచించే పదాన్ని నివారించింది.
- source_word: הַכֹּהֲנִים
  choice: యాజకులకు
  rationale: నిర్దిష్ట బహువచన నామవాచకానికి సూటియైన ఆధునిక తెలుగు రూపం.
- source_word: וַאֲחֵיהֶם
  choice: వారి సహోదరులకు
  rationale: హీబ్రూ పదంలోని పురుష బహువచన కుటుంబ పదాన్ని నిలిపింది; సందర్భంలో బంధువులు లేదా తోటి యాజకులు అనే విస్తృత భావం ఉండవచ్చు.
- source_word: בִּימֵי
  choice: కాలంలో
  rationale: ‘రోజుల్లో’ అనే హీబ్రూ కాలసూచక నుడికారాన్ని ఆధునిక తెలుగులో సహజమైన ‘కాలంలో’గా అందించింది.
- source_word: יֵשׁוּעַ
  choice: యేషూవ
  rationale: నిర్బంధానంతర కాలంలో కనిపించే ఈ పేరును యెహోషువ అనే విస్తృత రూపంతో కలపకుండా ప్రత్యేకంగా లిప్యంతరీకరించింది.
theological_decisions:
- issue: רָאשֵׁי అనే నాయకత్వపదం
  choice: నాయకులు
  alternative: ప్రధాన యాజకులు; అధిపతులు; తలలు
  rationale: ఇది యాజకులలో తరువాత ఏర్పడిన ‘ప్రధాన యాజకులు’ అనే సాంకేతిక పదవిని తప్పనిసరిగా సూచించదు. అందువల్ల మూలంలోని నాయకత్వ భావాన్ని ఉంచుతూ కాలానంతర సంస్థాగత అర్థాన్ని చేర్చలేదు.
- issue: אֲחֵיהֶם యొక్క పరిధి
  choice: వారి సహోదరులు
  alternative: వారి బంధువులు; వారి తోటి యాజకులు
  rationale: మూలపాఠం అక్షరార్థంగా ‘వారి సహోదరులు’ అంటుంది. యాజక వంశాలు లేదా సహచర యాజకులను ఉద్దేశించి ఉండవచ్చనే సందర్భార్థాన్ని పాదసూచికలో ఉంచి, ప్రధాన పాఠంలో ఉన్న అస్పష్టతను తొలగించలేదు.
- issue: רָאשֵׁי הַכֹּהֲנִים וַאֲחֵיהֶם యొక్క సంబంధం
  choice: యాజకులకూ వారి సహోదరులకూ నాయకులు
  alternative: యాజకుల నాయకులు మరియు వారి సహోదరులు
  rationale: నిర్మాణాన్ని ‘యాజకులు మరియు వారి సహోదరులు’ అనే సమన్విత సమూహానికి ‘నాయకులు’ వర్తించేలా అర్థం చేసుకుంది. ప్రత్యామ్నాయ విభజన వ్యాకరణపరంగా ఊహించదగినదైనా, సందర్భంలోని జాబితా నాయకుల జాబితాగా ఉండటం ఎంచుకున్న రూపానికి మద్దతిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే వాక్య నిర్మాణం వాడబడింది. పేర్లు హీబ్రూ రూపాలకు దగ్గరగా లిప్యంతరీకరించబడ్డాయి. ‘ప్రధాన యాజకులు’ వంటి తరువాతి కాలపు సాంకేతిక భావం రాకుండా ‘నాయకులు’ ఎంచుకోబడింది; మూలంలోని ‘సహోదరులు’ అనే సంబంధపదపు విస్తృత అవకాశాన్ని పాదసూచికలో నిలిపింది.
