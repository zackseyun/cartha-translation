  verdict: revise
  source_fidelity: The draft accurately conveys the causative force of הוֹדַעַתָ (“made known”), the divine possessive in “your holy Sabbath,” the threefold legal sequence, and Moses’ mediating agency. However, “విశ్రాంతిదినం” alone can be read generically in modern Telugu and does not adequately retain the covenantally specific name שַׁבָּת (Sabbath).
  naturalness: The sentence is generally clear and suitably formal. “శాసనాలు” is more natural and less ambiguous in modern standard Telugu for חֻקִּים than “కట్టడలు,” which may suggest structures/buildings to many readers. Retaining “ఆజ్ఞాపించావు” deliberately reflects the source’s verbal force despite the close cognate construction.
