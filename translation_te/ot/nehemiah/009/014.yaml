    issue: “కట్టడలు” is potentially ambiguous in contemporary Telugu.
    rationale: Although it can be used for ordinances, “కట్టడాలు/కట్టడలు” commonly evokes buildings or constructions. “శాసనాలు” naturally expresses prescribed statutes and preserves distinction from “ఆజ్ఞలు” and “ధర్మశాస్త్రం.”}],
