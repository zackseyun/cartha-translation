source:
  edition: WLC
  text: וְ/אֶת שַׁבַּ֥ת קָדְשְׁ/ךָ֖ הוֹדַ֣עַתָ לָ/הֶ֑ם וּ/מִצְו֤וֹת וְ/חֻקִּים֙ וְ/תוֹרָ֔ה צִוִּ֣יתָ לָ/הֶ֔ם בְּ/יַ֖ד מֹשֶׁ֥ה עַבְדֶּֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/014.yaml
  text: You made your holy Sabbath known to them[b][a], and you commanded them commandments and statutes and a law by the hand of Moses your servant.
translation:
  language: te
  text: నీ పరిశుద్ధ విశ్రాంతిదినమైన సబ్బాతును వారికి తెలియజేశావు; ఆజ్ఞలనూ, శాసనాలనూ, ధర్మశాస్త్రాన్నీ[a] నీ సేవకుడైన మోషే ద్వారా[b] వారికి ఆజ్ఞాపించావు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఉపదేశం.” תוֹרָה అనే పదం న్యాయబద్ధమైన ధర్మశాస్త్రంతో పాటు బోధన లేదా ఉపదేశం అనే భావాన్నీ కలిగి ఉంటుంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా, “నీ సేవకుడైన మోషే చేతి ద్వారా”; ఇది “నీ సేవకుడైన మోషే ద్వారా” అని అర్థమిచ్చే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁבַּת קָדְשְׁךָ
  choice: నీ పరిశుద్ధ విశ్రాంతిదినం
  rationale: שַׁבַּת యొక్క ప్రత్యేకమైన నిబంధనాత్మక భావాన్ని ‘విశ్రాంతిదినం’ నిలుపుతుంది; קָדְשְׁךָ ఇక్కడ విశేషణార్థకంగా పనిచేస్తూ ‘నీ పరిశుద్ధ’ అనే భావాన్ని ఇస్తుంది.
- source_word: הוֹדַעַתָ
  choice: తెలియజేశావు
  rationale: ידע హిఫిల్ రూపంలోని కారణార్థాన్ని—‘తెలిసేలా చేశావు’—సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: מִצְוֹת
  choice: ఆజ్ఞలు
  rationale: దైవిక ఆదేశాలనే న్యాయ-నిబంధనాత్మక భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: חֻקִּים
  choice: కట్టడలు
  rationale: నిర్ణయించి విధించిన శాసనాలు లేదా నియమాలు అనే న్యాయపరమైన భావాన్ని, ‘ఆజ్ఞలు’తో ఉన్న పదభేదాన్ని నిలుపుతూ తెలియజేస్తుంది.
- source_word: תוֹרָה
  choice: ధర్మశాస్త్రం
  rationale: ఆజ్ఞలు, కట్టడలు అనే న్యాయపరమైన పదాల వరుసలో ‘ధర్మశాస్త్రం’ సందర్భోచితంగా ఉంది; అయితే మూలపదంలో ‘ఉపదేశం’ అనే విస్తృత భావమూ ఉన్నందున దాన్ని పాదసూచికలో ఉంచాం.
- source_word: צִוִּיתָ
  choice: ఆజ్ఞాపించావు
  rationale: צוה పియేల్ రూపంలోని ప్రత్యక్ష ఆజ్ఞాపన బలాన్ని తగ్గించకుండా వ్యక్తం చేస్తుంది.
- source_word: בְּיַד מֹשֶׁה עַבְדֶּךָ
  choice: నీ సేవకుడైన మోషే ద్వారా
  rationale: בְּיַד అనే కర్తృత్వం లేదా మధ్యవర్తిత్వాన్ని తెలిపే హీబ్రూ నుడికారాన్ని సహజమైన తెలుగులో ‘ద్వారా’ అని అనువదించింది; అక్షరార్థాన్ని పాదసూచికలో ఇచ్చాం.
theological_decisions:
- issue: מִצְוֹת וְחֻקִּים וְתוֹרָה అనే మూడు న్యాయపరమైన పదాల అనువాదం
  choice: ఆజ్ఞలు, కట్టడలు, ధర్మశాస్త్రం
  alternative: ఆదేశాలు, నియమాలు, ఉపదేశం
  rationale: మూడు పదాల మధ్య ఉన్న భేదాన్ని కలిపివేయకుండా, దేవుడు మోషే ద్వారా అందించిన నిబంధనాత్మక ఆజ్ఞాపనను నిలుపుతుంది. תוֹרָהలోని బోధనార్థాన్ని మాత్రం పాదసూచిక ద్వారా భద్రపరుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని ఉపయోగించాం. ‘ఆజ్ఞలు—కట్టడలు—ధర్మశాస్త్రం’ అనే న్యాయపరమైన త్రిపదిని విడివిడిగా నిలిపాం; పాత శైలిలోని అనవసర క్రియాంతాలు, అత్యంత సంస్కృతీకృత నిర్మాణాలు నివారించాం.
