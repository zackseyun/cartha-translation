source:
  edition: WLC
  text: וַ/יָּבֹ֤אוּ הַ/בָּנִים֙ וַ/יִּֽירְשׁ֣וּ אֶת הָ/אָ֔רֶץ וַ/תַּכְנַ֨ע לִ/פְנֵי/הֶ֜ם אֶת יֹשְׁבֵ֤י הָ/אָ֨רֶץ֙ הַ/כְּנַ֣עֲנִ֔ים וַֽ/תִּתְּנֵ֖/ם בְּ/יָדָ֑/ם וְ/אֶת מַלְכֵי/הֶם֙ וְ/אֶת עַֽמְמֵ֣י הָ/אָ֔רֶץ לַ/עֲשׂ֥וֹת בָּ/הֶ֖ם כִּ/רְצוֹנָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/024.yaml
  text: So the sons came in and took possession of the land[a], and you subdued before them the inhabitants of the land, the Canaanites, and gave them into their hand, both their kings and the peoples of the land[c][b], to do with them according to their will.
translation:
  language: te
  text: కాబట్టి వారి కుమారులు వచ్చి ఆ దేశాన్ని స్వాధీనం చేసుకున్నారు.[a] నీవు వారి ఎదుట ఆ దేశ నివాసులైన కనానీయులను అణచివేసి, వారినీ వారి రాజులనూ ఆ దేశంలోని జనసమూహాలనూ వారి చేతికి అప్పగించావు,[b] వారితో తమ ఇష్టానుసారం చేయడానికి.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా ‘కుమారులు’; సందర్భంలో ఇది కనాను దేశంలో ప్రవేశించిన ఇశ్రాయేలు సంతానాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘వారి అధికారానికి అప్పగించావు.’ హీబ్రూలో అక్షరార్థంగా ‘వారి చేతికి ఇచ్చావు.’
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘వారికి నచ్చినట్లు వారితో వ్యవహరించడానికి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבָּנִים
  choice: వారి కుమారులు
  rationale: హీబ్రూ పదం అక్షరార్థంగా ‘కుమారులు.’ ముందటి తరాల సంతానాన్ని సూచించే వంశపారంపర్య భావాన్ని నిలుపుతూ, తెలుగులో సూచన స్పష్టంగా ఉండేందుకు ‘వారి’ చేర్చబడింది.
- source_word: וַיִּירְשׁוּ אֶת הָאָרֶץ
  choice: ఆ దేశాన్ని స్వాధీనం చేసుకున్నారు
  rationale: భూమి సందర్భంలో ירשׁ అనేది వారసత్వంగా పొందడం మాత్రమే కాక, దానిని స్వాధీనపరచుకోవడం అనే భావాన్నీ కలిగిస్తుంది; ఈ సందర్భంలోని ప్రవేశం మరియు జయాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וַתַּכְנַע לִפְנֵיהֶם
  choice: వారి ఎదుట ... అణచివేసి
  rationale: כנע యొక్క బలమైన సైనిక-రాజకీయ అధీనపరచే భావాన్ని మృదువుచేయకుండా నిలుపుతుంది; לִפְנֵיהֶם ను ‘వారి ఎదుట’గా ప్రతిబింబిస్తుంది.
- source_word: יֹשְׁבֵי הָאָרֶץ הַכְּנַעֲנִים
  choice: ఆ దేశ నివాసులైన కనానీయులను
  rationale: నివాసులనే భాగాన్నీ కనానీయులనే జాతి గుర్తింపునూ సహజమైన తెలుగు సంబంధ నిర్మాణంలో నిలుపుతుంది.
- source_word: וַתִּתְּנֵם בְּיָדָם
  choice: వారిని ... వారి చేతికి అప్పగించావు
  rationale: ‘చేతిలో ఇవ్వడం’ అనే హీబ్రూ అధికార/నియంత్రణ నుడికారాన్ని తెలుగులో సహజమైన ‘చేతికి అప్పగించడం’తో వ్యక్తం చేస్తుంది.
- source_word: מַלְכֵיהֶם
  choice: వారి రాజులను
  rationale: సర్వనామ ప్రత్యయం ముందున్న కనానీయులు లేదా దేశ నివాసులను సూచిస్తుంది; మూలంలోని సంక్షిప్తతను నిలుపుతుంది.
- source_word: עַמְמֵי הָאָרֶץ
  choice: ఆ దేశపు ప్రజలను
  rationale: עַמְמֵי బహువచన రూపం అయినప్పటికీ, ఆధునిక తెలుగులో ‘దేశపు ప్రజలు’ సమూహబహుత్వాన్ని సహజంగా తెలియజేస్తుంది; పాదటిప్పణిలో ‘జన సమూహాలు’ ప్రత్యామ్నాయం ఇవ్వబడింది.
- source_word: לַעֲשׂוֹת בָּהֶם כִּרְצוֹנָם
  choice: వారు తమ ఇష్టానుసారం వారితో వ్యవహరించేలా
  rationale: ‘వారికి నచ్చినట్లు వారితో చేయడం’ అనే మూల భావాన్ని సహజమైన, గంభీరమైన తెలుగులో అందిస్తుంది; కార్యస్వేచ్ఛ యొక్క కఠినతను తొలగించదు.
theological_decisions:
- issue: ‘కుమారులు’ అనే పదం ఎవరిని సూచిస్తుంది?
  choice: పూర్వీకుల తరువాత కనాను దేశంలో ప్రవేశించిన వారి సంతానాన్ని సూచించేలా ‘వారి కుమారులు’గా అనువదించడం
  alternative: ‘ఇశ్రాయేలీయులు’ లేదా ‘వారి సంతానం’
  rationale: మూలం జాతిపేరును కాక కుటుంబ-వంశ భాషను ఉపయోగిస్తుంది. ‘కుమారులు’ అనడం ప్రార్థనలో ముందుగా ప్రస్తావించిన పితరులతో కథన సంబంధాన్ని నిలుపుతుంది; ‘వారి’ అనేది సందర్భం ద్వారా సరఫరా చేసిన స్పష్టీకరణ మాత్రమే.
- issue: జయానికి సంబంధించిన భాష యొక్క తీవ్రత
  choice: దేవుడు కనానీయులను ‘అణచివేసి’ ఇశ్రాయేలు వారి చేతికి అప్పగించాడనే బలమైన భాషను నిలుపడం
  alternative: ‘వారిపై విజయం పొందేలా సహాయం చేశావు’ వంటి మృదువైన రూపం
  rationale: మూలవాక్యం జయాన్ని నేరుగా దేవుని చర్యగా పేర్కొంటుంది. దాని సైనిక-రాజకీయ తీవ్రతను అనువాదం తగ్గించకూడదు.
- issue: ‘తమ ఇష్టానుసారం’ అనే వాక్యభాగంలోని నైతిక ఉద్రిక్తత
  choice: ఇశ్రాయేలీయులు వారితో తమ ఇష్టప్రకారం వ్యవహరించగల అధికారాన్ని పొందారని నేరుగా చెప్పడం
  alternative: ‘వారిని తమ ఆధీనంలో ఉంచుకునేలా’ అని పరిమితం చేయడం
  rationale: మూలంలోని כִּרְצוֹנָם విస్తృతమైన కార్యస్వేచ్ఛను సూచిస్తుంది. అనువాదం దానిని నైతికంగా సమర్థించకూడదు, అలాగే దాని కఠినతను సంకుచితం చేయకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ప్రార్థనా సందర్భానికి తగిన గంభీరమైన కానీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. ‘స్వాధీనం చేసుకున్నారు,’ ‘అణచివేసి,’ ‘చేతికి అప్పగించావు’ వంటి పదబంధాలు మూలంలోని భూస్వాధీన, అధీనపరచే, అధికార నుడికారాలను సహజంగా నిలుపుతాయి. అన్ని పాదటిప్పణి గుర్తులు ప్రధాన పాఠ్యంలో ఉంచబడ్డాయి.
