  to: కాబట్టి వారి కుమారులు వచ్చి ఆ దేశాన్ని స్వాధీనం చేసుకున్నారు.[a] నీవు వారి ఎదుట ఆ దేశ నివాసులైన కనానీయులను అణచివేసి, వారినీ వారి రాజులనూ ఆ దేశంలోని జనసమూహాలనూ వారి చేతికి అప్పగించావు,[b] వారితో తమ ఇష్టానుసారం చేయడానికి.[c]
  rationale: సవరణ చివరి ఉపవాక్యాన్ని కారణార్థకం నుండి మూలంలోని ఉద్దేశార్థక నిర్మాణానికి తిరిగి తీసుకువస్తుంది. అలాగే ‘జనసమూహాలు’ ద్వారా עַמְמֵי యొక్క బహువచనాన్ని స్పష్టం చేసి, ‘చేతికి అప్పగించావు’ మరియు చివరి కార్యస్వేచ్ఛకు వేర్వేరు పాదటిప్పణి గుర్తులను ఇచ్చింది. చారిత్రక జయభాషను తగ్గించకుండా, నైతిక వ్యాఖ్యానాన్ని జోడించకుండా మూలార్థాన్ని నిలుపుతుంది.
