  revised_text: కాబట్టి వారి కుమారులు వచ్చి ఆ దేశాన్ని స్వాధీనం చేసుకున్నారు.[a] నీవు వారి ఎదుట ఆ దేశ నివాసులైన కనానీయులను అణచివేసి, వారినీ వారి రాజులనూ ఆ దేశంలోని జనసమూహాలనూ వారి చేతికి అప్పగించావు,[b] వారితో తమ ఇష్టానుసారం చేయడానికి.[c]
