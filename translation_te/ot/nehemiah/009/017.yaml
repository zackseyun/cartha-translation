source:
  edition: WLC
  text: וַ/יְמָאֲנ֣וּ לִ/שְׁמֹ֗עַ וְ/לֹא זָכְר֤וּ נִפְלְאֹתֶ֨י/ךָ֙ אֲשֶׁ֣ר עָשִׂ֣יתָ עִמָּ/הֶ֔ם וַ/יַּקְשׁוּ֙ אֶת עָרְפָּ֔/ם וַ/יִּתְּנוּ רֹ֛אשׁ לָ/שׁ֥וּב לְ/עַבְדֻתָ֖/ם בְּ/מִרְיָ֑/ם וְ/אַתָּה֩ אֱל֨וֹהַּ סְלִיח֜וֹת חַנּ֧וּן וְ/רַח֛וּם אֶֽרֶךְ אַפַּ֥יִם וְ/רַב ו/חסד וְ/לֹ֥א עֲזַבְתָּֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/017.yaml
  text: But they refused to listen and did not remember your wonders that you had done among them. They stiffened their necks and, in their rebellion, appointed a leader to return to their slavery. But you are a forgiving God[a], gracious and compassionate, slow to anger and abundant in steadfast love, and you did not forsake them.
translation:
  language: te
  text: కాని వారు వినడానికి నిరాకరించారు; నీవు వారి మధ్య చేసిన అద్భుత కార్యాలను గుర్తుంచుకోలేదు. వారు తమ మెడలను బిగించుకొని, తమ తిరుగుబాటులో దాసత్వానికి తిరిగి వెళ్లడానికి ఒక నాయకుణ్ణి నియమించుకున్నారు. అయినా నీవు క్షమాపణలు అనుగ్రహించే దేవుడవు[a]; కృపగలవాడవు, కనికరంగలవాడవు, కోపానికి తొందరపడనివాడవు, స్థిరమైన ప్రేమ సమృద్ధిగా కలిగినవాడవు. నీవు వారిని విడిచిపెట్టలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “క్షమాపణల దేవుడు.” హీబ్రూలోని బహువచనం దేవుని సమృద్ధియైన క్షమను నొక్కిచెబుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמָאֲנוּ לִשְׁמֹעַ
  choice: వినడానికి నిరాకరించారు
  rationale: మָאֵן‌లోని ఉద్దేశపూర్వక నిరాకరణను స్పష్టంగా తెలియజేస్తూ, שׁמעలో అంతర్లీనంగా ఉన్న విధేయత భావాన్ని సందర్భానికే వదిలివేస్తుంది.
- source_word: נִפְלְאֹתֶיךָ אֲשֶׁר עָשִׂיתָ עִמָּהֶם
  choice: నీవు వారి మధ్య చేసిన అద్భుత కార్యాలు
  rationale: נפלאות అనేది ఆశ్చర్యం కలిగించే అసాధారణ క్రియలను సూచిస్తుంది; עִם ఇక్కడ సమాజం మధ్య జరిగిన కార్యాలు అనే భావాన్ని సహజంగా ఇస్తుంది.
- source_word: וַיַּקְשׁוּ אֶת־עָרְפָּם
  choice: వారు తమ మెడలను బిగించుకున్నారు
  rationale: హీబ్రూ మొండితనాన్ని తెలిపే శరీరరూపకాన్ని నిలుపుతూ, తెలుగు బహువచన వాక్యనిర్మాణానికి సరిపడేలా ఇచ్చింది.
- source_word: וַיִּתְּנוּ רֹאשׁ
  choice: ఒక నాయకుణ్ణి నియమించుకున్నారు
  rationale: అక్షరార్థంగా ‘ఒక తలను ఉంచారు’ అనే హీబ్రూ నుడికారానికి సహజమైన తెలుగు భావానువాదం.
- source_word: לָשׁוּב לְעַבְדֻתָם בְּמִרְיָם
  choice: తమ తిరుగుబాటులో దాసత్వానికి తిరిగి వెళ్లడానికి
  rationale: עבדותను ‘దాసత్వం’గా స్పష్టంగా అందిస్తూ, במריםను నాయకుణ్ణి నియమించుకున్న చర్యకు సంబంధించిన పరిస్థితిగా ఉంచుతుంది.
- source_word: אֱלוֹהַּ סְלִיחוֹת
  choice: క్షమాపణలు అనుగ్రహించే దేవుడు
  rationale: సహజమైన తెలుగులో దేవుని క్షమించే స్వభావాన్ని తెలియజేస్తూ, హీబ్రూ బహువచనంలోని సమృద్ధి భావాన్ని పాదసూచికలో సంరక్షిస్తుంది.
- source_word: חַנּוּן וְרַחוּם
  choice: కృపగలవాడు, కనికరంగలవాడు
  rationale: దైవానుగ్రహం మరియు సానుభూతితో కూడిన కనికరం అనే రెండు సమీపమైనా భిన్నమైన లక్షణాలను నిలుపుతుంది.
- source_word: אֶרֶךְ אַפַּיִם
  choice: కోపించడానికి ఆలస్యముగలవాడు
  rationale: హీబ్రూ నుడికారంలోని అర్థాన్ని గౌరవప్రదమైన, అర్థమయ్యే తెలుగులో అందిస్తుంది.
- source_word: רַב־חֶסֶד
  choice: స్థిరమైన ప్రేమలో సమృద్ధిగలవాడు
  rationale: חסדలోని ప్రేమ, విశ్వసనీయత, నిలకడలను ‘స్థిరమైన ప్రేమ’ ద్వారా మతశాఖాపరమైన అధిక వివరణ లేకుండా ప్రతిబింబిస్తుంది.
- source_word: וְלֹא עֲזַבְתָּם
  choice: నీవు వారిని విడిచిపెట్టలేదు
  rationale: עזבలోని వదలివేయడం లేదా పరిత్యజించడం అనే సంబంధాత్మక భావాన్ని సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: దేవుని క్షమాశీల స్వభావాన్ని తెలిపే אֱלוֹהַּ סְלִיחוֹת అనువాదం
  choice: క్షమాపణలు అనుగ్రహించే దేవుడు
  alternative: క్షమించే దేవుడు; క్షమాపణల దేవుడు
  rationale: ‘క్షమాపణల దేవుడు’ మూలరూపానికి దగ్గరగా ఉన్నా తెలుగులో అసహజంగా లేదా దేవుడు క్షమాపణ కోరుతున్నట్టుగా అపార్థమయ్యే అవకాశం ఉంది. ఎంపిక చేసిన రూపం దేవుడు క్షమను ప్రసాదించేవాడనే భావాన్ని స్పష్టంగా ఉంచి, బహువచన తీవ్రతను పాదసూచికలో వివరిస్తుంది.
- issue: חסד యొక్క ఒడంబడిక సంబంధిత భావవ్యాప్తి
  choice: స్థిరమైన ప్రేమ
  alternative: నిబంధన ప్రేమ; విశ్వసనీయ ప్రేమ; కృప
  rationale: ‘స్థిరమైన ప్రేమ’ ప్రేమతో పాటు నిలకడ, విశ్వసనీయతను తెలియజేస్తుంది; ‘నిబంధన’ అనే వివరణాత్మక పదాన్ని మూలంలో లేనప్పుడు నేరుగా చేర్చదు.
- issue: ప్రజల తిరుగుబాటు మరియు దాసత్వానికి తిరిగివెళ్లే సంకల్పం మధ్య సంబంధం
  choice: తమ తిరుగుబాటులో ... నాయకుణ్ణి నియమించుకున్నారు
  alternative: తమ తిరుగుబాటు కారణంగా ...; దాసత్వానికి తిరిగివెళ్లే తిరుగుబాటులో ...
  rationale: בְּ అనే ఉపసర్గ కారణం లేదా పరిస్థితిని సూచించగల అస్పష్టతను పూర్తిగా కారణార్థంగా నిర్ణయించకుండా, తిరుగుబాటు ఆ చర్యకు నేపథ్యమని తెలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకులకు అర్థమయ్యే శైలి. హీబ్రూ రూపకాలను అర్థమయ్యే మేరకు నిలుపుతూ, అసహజమైన అక్షరానువాదాలను నివారించింది. దైవలక్షణాల వరుసలో మూలంలోని కవితాత్మక గంభీరతను కాపాడింది.
