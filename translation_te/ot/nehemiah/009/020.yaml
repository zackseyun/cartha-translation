source:
  edition: WLC
  text: וְ/רוּחֲ/ךָ֨ הַ/טּוֹבָ֔ה נָתַ֖תָּ לְ/הַשְׂכִּילָ֑/ם וּ/מַנְ/ךָ֙ לֹא מָנַ֣עְתָּ מִ/פִּי/הֶ֔ם וּ/מַ֛יִם נָתַ֥תָּה לָ/הֶ֖ם לִ/צְמָאָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/020.yaml
  text: You gave your good Spirit to instruct them[a], and you did not withhold your manna from their mouth, and you gave them water for their thirst.
translation:
  language: te
  text: వారికి అవగాహన కలిగించడానికి నీ మంచి ఆత్మను[a] అనుగ్రహించావు. వారి నోటికి నీ మన్నాను అందకుండా చేయలేదు; వారి దాహానికి నీళ్లు ఇచ్చావు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నీ మేలైన ఆత్మను.’ హీబ్రూ పదం ‘ఆత్మ,’ ‘గాలి,’ లేదా ‘ఊపిరి’ అని అర్థం కావచ్చు; ఇక్కడ అది ఇశ్రాయేలుకు అవగాహన కలిగించే దేవుని ఆత్మను సూచిస్తున్నట్లు కనిపిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: רוּחֲךָ הַטּוֹבָה
  choice: నీ మంచి ఆత్మను
  rationale: רוּחַ అనే పదానికి ఆత్మ, గాలి, ఊపిరి అనే అర్థాలు ఉండవచ్చు. ఇక్కడ బోధించి నడిపించే దేవుని సన్నిధిని సూచిస్తున్నందున ‘నీ మంచి ఆత్మ’ సందర్భానికి తగినది; తెలుగు లిపిలో పెద్ద/చిన్న అక్షరాల భేదం లేనందున ప్రత్యామ్నాయ అవగాహనను పాదటిప్పణిలో ఉంచాం.
- source_word: לְהַשְׂכִּילָם
  choice: వారికి వివేచన కలిగించడానికి
  rationale: שׂכל యొక్క హిఫీల్ రూపం అవగాహన లేదా వివేచన కలిగించడం, జ్ఞానవంతులుగా చేయడం అనే కారణార్థాన్ని వ్యక్తం చేస్తుంది. ‘వివేచన కలిగించడానికి’ ఆ భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: מַנְךָ
  choice: నీ మన్నాను
  rationale: అరణ్యంలో దేవుడు సమకూర్చిన ప్రత్యేక ఆహారాన్ని సూచించే స్థిరమైన బైబిలు పదం ‘మన్నా’; స్వామ్యసూచక ప్రత్యయం ‘నీ’తో నిలుపబడింది.
- source_word: מָנַעְתָּ מִפִּיהֶם
  choice: వారి నోటి నుండి ... నిలిపివేయలేదు
  rationale: מנע అంటే నిలిపివేయడం లేదా ఇవ్వకుండా ఉంచడం. ‘వారి నోటి నుండి’ అనే హీబ్రూ భాషలోని స్పష్టమైన, సజీవమైన రూపకల్పనను అనువాదంలో నిలిపాం.
- source_word: מַיִם
  choice: నీళ్లు
  rationale: సాధారణ ఆధునిక తెలుగులో సహజమైన సమానార్థకం.
- source_word: לִצְמָאָם
  choice: వారి దాహానికి
  rationale: צָמָא అంటే దాహం. ల־ ఇక్కడ వారి అవసరాన్ని తీర్చడానికి చేసిన సమకూర్పును సూచిస్తుంది; ‘వారి దాహానికి’ మూలంలోని సంక్షిప్తతను నిలుపుతుంది.
theological_decisions:
- issue: רוּחֲךָ הַטּוֹבָה దేవుని ఆత్మను సూచిస్తుందా, లేక మంచి ఆత్మ/మనోభావాన్ని సూచిస్తుందా?
  choice: నీ మంచి ఆత్మను
  alternative: నీ మంచి మనోభావాన్ని / నీ మేలైన ఆత్మను
  rationale: వారికి వివేచన కలిగించేందుకు దేవుడు ఇచ్చినదిగా వాక్యం చెప్పడం వల్ల దేవుని బోధించే ఆత్మ అనే అవగాహన సందర్భానికి బాగా సరిపోతుంది. అయితే హీబ్రూ పదానికి ఉన్న విస్తృత అర్థపరిధిని, తెలుగు లిపిలో capitalization ద్వారా భేదం చూపలేమనే విషయాన్ని పాదటిప్పణి ద్వారా కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ప్రార్థనా సందర్భానికి తగిన గౌరవప్రదమైన ఏకవచన సంబోధన. మూలంలోని ‘వారి నోటి నుండి’ అనే సజీవమైన వ్యక్తీకరణను ఉద్దేశపూర్వకంగా నిలిపాం. ‘ఆత్మ’ విషయంలో హీబ్రూ అస్పష్టతను పాదటిప్పణితో సంరక్షించాం.
