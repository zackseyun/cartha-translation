id: NEH.9.18
reference: Nehemiah 9:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אַ֗ף כִּֽי עָשׂ֤וּ לָ/הֶם֙ עֵ֣גֶל מַסֵּכָ֔ה וַ/יֹּ֣אמְר֔וּ זֶ֣ה אֱלֹהֶ֔י/ךָ אֲשֶׁ֥ר הֶעֶלְ/ךָ֖ מִ/מִּצְרָ֑יִם וַֽ/יַּעֲשׂ֔וּ נֶאָצ֖וֹת גְּדֹלֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/018.yaml
  text: Even when they made for themselves a cast metal calf and said[a], ‘This is your god who brought you up out of Egypt,’ and committed great blasphemies[b],
translation:
  language: te
  text: వారు తమ కోసం పోతపోసిన దూడను చేసుకొని[a], ‘ఐగుప్తులోనుండి నిన్ను పైకి తీసుకొచ్చిన నీ దేవుడు ఇదే’ అని చెప్పి, దేవునికి వ్యతిరేకంగా తీవ్రమైన ధిక్కారక కార్యాలు చేసినప్పటికీ[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “లోహాన్ని కరిగించి పోతపోసిన దూడను.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “గొప్ప దైవదూషణలు చేశారు”; “గొప్ప తృణీకారక కార్యాలు చేశారు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף כִּי
  choice: చేసినప్పటికీ
  rationale: ఈ వాక్యం తరువాతి వచనంలోని దేవుని కనికరానికి వ్యతిరేకంగా ఇశ్రాయేలీయుల తిరుగుబాటును concessive భావంతో చూపుతుంది; తెలుగు వాక్యనిర్మాణంలో చివర ఉంచిన ‘అప్పటికీ’ ఆ సంబంధాన్ని సహజంగా నిలుపుతుంది.
- source_word: עָשׂוּ לָהֶם
  choice: వారు తమ కోసం ... చేసుకొని
  rationale: לָהֶם లోని స్వప్రయోజనార్థక భావాన్ని ‘తమ కోసం’ స్పష్టంగా నిలుపుతుంది; ‘చేసుకొని’ తరువాతి క్రియలతో సహజంగా కలుస్తుంది.
- source_word: עֵגֶל מַסֵּכָה
  choice: పోతపోసిన దూడ విగ్రహం
  rationale: מַסֵּכָה లోహాన్ని కరిగించి అచ్చులో పోసి చేసిన ప్రతిమను సూచిస్తుంది. ‘దూడ విగ్రహం’ అది నిజమైన దూడ కాదని సాధారణ పాఠకునికి స్పష్టం చేస్తుంది.
- source_word: זֶה אֱלֹהֶיךָ
  choice: నీ దేవుడు ఇతడే
  rationale: זֶה మరియు ఏకవచన ప్రత్యయం ప్రకారం ఏకవచనాన్ని నిలిపి, దూడను సూచించేందుకు తెలుగు పుంలింగ సర్వనామాన్ని వాడింది. ఉద్ధరణలో ఇది ప్రజల వాదనగానే ఉంటుంది.
- source_word: אֲשֶׁר הֶעֶלְךָ מִמִּצְרַיִם
  choice: ఐగుప్తులోనుండి నిన్ను పైకి తీసుకొచ్చిన
  rationale: עלה מן అనే నిర్గమన సూత్రప్రయోగంలోని ‘పైకి తీసుకురావడం’ భావాన్ని నిలుపుతూ తెలుగులో అర్థవంతంగా అందిస్తుంది.
- source_word: וַיַּעֲשׂוּ נֶאָצוֹת גְּדֹלוֹת
  choice: ఎంతో ఘోరంగా దేవుణ్ణి అవమానించారు
  rationale: నామవాచక నిర్మాణాన్ని సహజ తెలుగు క్రియారూపంగా మార్చింది. נֶאָצוֹת లోని ధిక్కారం, తృణీకారం, దైవదూషణ భావాలను ‘దేవుణ్ణి అవమానించడం’ విస్తృతంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: విగ్రహాన్ని సూచించే אֱלֹהֶיךָ అనువాదం
  choice: నీ దేవుడు
  alternative: నీ దేవుళ్లు
  rationale: తక్షణ హెబ్రీ రూపంలో సూచక సర్వనామమూ ప్రత్యయమూ ఏకవచనంలో ఉన్నాయి. కాబట్టి నిర్గమకాండంలోని సంప్రదాయ బహువచన అనువాదాన్ని ఇక్కడికి దిగుమతి చేయకుండా ఏకవచనాన్ని నిలిపింది; ఇది ఉద్ధరణలోని విగ్రహారాధకుల వాదన, అనువాదకుని సమ్మతి కాదు.
- issue: נֶאָצוֹת యొక్క దేవునికి వ్యతిరేకమైన భావం
  choice: దేవుణ్ణి అవమానించడం
  alternative: దైవదూషణలు చేయడం; తీవ్రంగా రెచ్చగొట్టడం
  rationale: మూలపదం ధిక్కారపూరితమైన, తృణీకారమైన చర్యలను సూచించగలదు. సందర్భంలో అవి దేవునికి వ్యతిరేకమైనవి; ‘దేవుణ్ణి అవమానించడం’ ఆ దిశను స్పష్టం చేస్తూనే ‘దైవదూషణ’ అనే మరింత సంకుచిత అర్థానికి మాత్రమే పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ప్రార్థనా-చారిత్రక సందర్భానికి తగిన గౌరవప్రదమైన శైలి. వాక్యం 19వ వచనంలో కొనసాగుతున్నందున చివర కామా ఉంచబడింది. ‘ఐగుప్తు’ బైబిలు పాఠకులకు సుపరిచితమైన స్థలనామ రూపం; ‘పోతపోసిన’ అనే పదం తయారీ విధానాన్ని సహజంగా తెలియజేస్తుంది.
