id: NEH.9.33
reference: Nehemiah 9:33
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אַתָּ֣ה צַדִּ֔יק עַ֖ל כָּל הַ/בָּ֣א עָלֵ֑י/נוּ כִּֽי אֱמֶ֥ת עָשִׂ֖יתָ וַ/אֲנַ֥חְנוּ הִרְשָֽׁעְנוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/033.yaml
  text: Yet you are righteous in all that has come upon us[a], for you have acted faithfully, but we have acted wickedly.
translation:
  language: te
  text: అయినా, మాపైకి వచ్చిన సమస్తం విషయంలో నీవు నీతిమంతుడవు; ఎందుకంటే నీవు నమ్మకంగా వ్యవహరించావు[a], కానీ మేము దుర్మార్గంగా ప్రవర్తించాము.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “నీవు సత్యం చేశావు,” అంటే “నీవు నమ్మకత్వంతో వ్యవహరించావు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַתָּה
  choice: అయినా, నీవు
  rationale: ముందున్న పాప ఒప్పుకోలుతో దేవుని నీతిని వ్యతిరేకంగా నిలిపే భావాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: צַדִּיק
  choice: నీతిమంతుడవు
  rationale: దేవుని నైతిక న్యాయత్వాన్నీ, నిబంధన సంబంధమైన గంభీరతనూ నిలుపుతుంది; కేవలం ‘న్యాయంగా ఉన్నావు’ కంటే విస్తృతమైన మూలార్థాన్ని ఇస్తుంది.
- source_word: עַל כָּל הַ/בָּא עָלֵי/נוּ
  choice: మాపై వచ్చిన వాటన్నిటి విషయంలో
  rationale: ప్రజలకు సంభవించిన విపత్తుల విషయంగా దేవుడు నీతిమంతుడని చెప్పే హీబ్రూ సంబంధాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి ప్రకటనకు ఆధారాన్ని పరిచయం చేసే కారణార్థాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: אֱמֶת עָשִׂיתָ
  choice: నీవు నమ్మకంగా వ్యవహరించావు
  rationale: అక్షరార్థంగా ‘సత్యం చేశావు’ అయినప్పటికీ, ఈ పదబంధం విశ్వసనీయతతో ప్రవర్తించడాన్ని సూచిస్తుంది; తెలుగులో ఈ రూపం సహజంగా ఉంది.
- source_word: וַ/אֲנַחְנוּ
  choice: కానీ మేము
  rationale: దేవుని నమ్మకమైన ప్రవర్తనకూ ప్రజల దుష్ప్రవర్తనకూ మధ్యనున్న స్పష్టమైన వ్యత్యాసాన్ని చూపుతుంది.
- source_word: הִרְשָׁעְנוּ
  choice: దుర్మార్గంగా ప్రవర్తించాము
  rationale: హిఫీల్ రూపంలోని ‘దుష్టంగా నడుచుకోవడం/చేయడం’ అనే క్రియాత్మక భావాన్ని నిలుపుతూ, ముందటి ‘వ్యవహరించావు’తో సమతూకాన్ని కలిగిస్తుంది.
theological_decisions:
- issue: ఇశ్రాయేలుపై వచ్చిన విపత్తుల విషయంలో దేవుని స్వభావం
  choice: మాపై వచ్చిన వాటన్నిటి విషయంలో నీవు నీతిమంతుడవు
  alternative: మమ్మల్ని శిక్షించడంలో నీవు న్యాయవంతుడవు
  rationale: మూలపాఠం దేవుని నీతిని ప్రజలకు సంభవించిన వాటితో సంబంధపెట్టి ఒప్పుకుంటుంది; అయితే వాటన్నిటినీ అనువాదంలోనే ప్రత్యేకంగా ‘శిక్ష’గా నిర్వచించదు. అందువల్ల మూలంలోని గంభీరతనూ ఉద్వేగాన్నీ అతివ్యాఖ్యానం లేకుండా నిలుపుతుంది.
- issue: אֱמֶת עָשִׂיתָ లోని సత్యం/నమ్మకత్వం భావం
  choice: నీవు నమ్మకంగా వ్యవహరించావు
  alternative: నీవు సత్యం చేశావు
  rationale: హీబ్రూ రూపాన్ని అక్షరార్థంగా చూపడం సాధ్యమే అయినా తెలుగులో అసహజంగా ఉంటుంది. సందర్భంలో దేవుని విశ్వసనీయ ప్రవర్తన ప్రధాన భావం; పాదటిప్పణి అక్షర రూపాన్ని సంరక్షిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన ప్రత్యక్ష సంబోధనను ఉపయోగించాం. ‘నీతిమంతుడు,’ ‘నమ్మకంగా,’ ‘దుర్మార్గంగా’ అనే పదాలు సాధారణ పాఠకులకు అర్థమయ్యేలా ఉండి, మూలంలోని నైతిక మరియు నిబంధన సంబంధమైన బరువును నిలుపుతాయి. పాదటిప్పణి సూచిక [a] ప్రధాన పాఠ్యంలో సంబంధిత వాక్యభాగం తరువాత ఉంచబడింది.
