base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/029.yaml
  text: You warned them in order to bring them back to your law[a], but they acted presumptuously and did not listen to your commandments; they sinned against your judgments, by which a man shall live if he does them. They gave a stubborn shoulder, stiffened their neck[b], and would not listen.
translation:
  language: te
  text: నీ ధర్మశాస్త్రం[a] వైపు వారిని తిరిగి తీసుకురావడానికి నీవు వారిని హెచ్చరించావు. అయినా వారు అహంకారంతో ప్రవర్తించి, నీ ఆజ్ఞలకు చెవియొగ్గలేదు. వాటిని ఆచరిస్తే మనిషి వాటివల్ల జీవిస్తాడని చెప్పిన నీ న్యాయవిధులకు విరోధంగా వారు పాపం చేశారు[b]. వారు మొండిగా భుజం తిప్పి, తమ మెడలను కఠినపరచుకొని, వినడానికి నిరాకరించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ధర్మశాస్త్రం’ అని అనువదించిన హెబ్రీ పదానికి ‘బోధ’ లేదా ‘ఉపదేశం’ అనే భావం కూడా ఉంది.
    reason: lexical_alternative
  - marker: b
    text: లేవీయకాండము 18:5ను చూడండి. ‘మనిషి’ అని అనువదించిన హెబ్రీ పదం ఇక్కడ ఏ మానవునినైనా సాధారణంగా సూచిస్తుంది.
    reason: cross_reference
lexical_decisions:
- source_word: וַתָּעַד בָּהֶם
  choice: నీవు వారిని హెచ్చరించావు
  rationale: עוד ధాతువు హిఫీల్ రూపం ఇక్కడ గంభీరంగా హెచ్చరించడం లేదా సాక్ష్యమిచ్చి బుద్ధిచెప్పడం అనే భావాన్ని ఇస్తుంది; సందర్భంలో సహజమైన తెలుగు పదంగా ‘హెచ్చరించావు’ ఎంచుకున్నాం.
- source_word: לַהֲשִׁיבָם אֶל תּוֹרָתֶךָ
  choice: నీ ధర్మశాస్త్రం వైపు వారిని తిరిగి తీసుకురావడానికి
  rationale: హిఫీల్ שׁוב యొక్క ‘తిరిగి రప్పించడం’ భావాన్ని స్పష్టంగా ఉంచుతూ, నిబంధన సంబంధ సందర్భంలో תּוֹרָהను ‘ధర్మశాస్త్రం’గా అనువదించాం.
- source_word: הֵזִידוּ
  choice: అహంకారంతో ప్రవర్తించి
  rationale: ఇది కేవలం అంతర్గత గర్వాన్ని కాక, గర్వపూరితమైన ధిక్కార ప్రవర్తనను సూచిస్తుంది.
- source_word: לֹא שָׁמְעוּ לְמִצְוֺתֶיךָ
  choice: నీ ఆజ్ఞలకు చెవియొగ్గలేదు
  rationale: שׁמעలోని వినడం మరియు విధేయత చూపడం అనే రెండు భావాలను తెలుగు ‘చెవియొగ్గడం’ సహజంగా కలుపుతుంది.
- source_word: וּבְמִשְׁפָּטֶיךָ חָטְאוּ בָם
  choice: నీ న్యాయవిధులకు విరోధంగా వారు పాపం చేశారు
  rationale: מִשְׁפָּטִים యొక్క న్యాయపరమైన స్వరాన్ని ‘న్యాయవిధులు’ నిలుపుతుంది; ב ప్రాతిపదిక ఇక్కడ విధులకు విరోధంగా పాపం చేయడాన్ని సూచిస్తుంది.
- source_word: אֲשֶׁר יַעֲשֶׂה אָדָם וְחָיָה בָהֶם
  choice: వాటిని ఆచరించే వ్యక్తి వాటివల్ల జీవిస్తాడు
  rationale: ఆజ్ఞలను చేయడం మరియు వాటివల్ల జీవించడం అనే హెబ్రీ వాక్య సంబంధాన్ని నిలిపాం. אָדָם ఇక్కడ ఏ మానవునికైనా వర్తించే సాధారణ ఏకవచనం కాబట్టి ‘వ్యక్తి’ సహజమైన ఆధునిక తెలుగు.
- source_word: וַיִּתְּנוּ כָתֵף סוֹרֶרֶת
  choice: వారు మొండిగా భుజం తిప్పి
  rationale: అవిధేయ ప్రతిఘటనను సూచించే భుజం రూపకాన్ని నిలుపుతూ తెలుగులో అర్థమయ్యే విధంగా అనువదించాం.
- source_word: וְעָרְפָּם הִקְשׁוּ
  choice: తమ మెడను బిగించుకొని
  rationale: మొండితనాన్ని సూచించే హెబ్రీ రూపకాన్ని వివరణగా మార్చకుండా నిలిపాం.
- source_word: וְלֹא שָׁמֵעוּ
  choice: వినడానికి నిరాకరించారు
  rationale: చివరి వాక్యం వారి ఉద్దేశపూర్వకమైన, కొనసాగిన నిరాకరణను బలంగా సంగ్రహిస్తుంది.
theological_decisions:
- issue: ఆజ్ఞలను ఆచరించడం ద్వారా జీవించడం అనే వాక్యభాగం
  choice: వాటిని ఆచరించే వ్యక్తి వాటివల్ల జీవిస్తాడు
  alternative: వాటిని చేసే మనిషి వాటిలో జీవిస్తాడు
  rationale: లేవీయకాండము 18:5ను ప్రతిధ్వనించే మూలంలోని కార్యం–జీవం సంబంధాన్ని నిలిపాం; ఇది ఏ మానవునికైనా వర్తించే సాధారణ ప్రకటనగా ఉంది. ‘వాటివల్ల’ అనేది בָהֶם యొక్క సాధనార్థక భావాన్ని సహజంగా వ్యక్తపరుస్తుంది, కానీ దాని పూర్తి ధార్మిక భావాన్ని అదనంగా నిర్ణయించదు.
- issue: תּוֹרָה యొక్క అనువాదం
  choice: ధర్మశాస్త్రం
  alternative: బోధ
  rationale: నెహెమ్యా 9లోని నిబంధన మరియు ఆజ్ఞల సందర్భంలో ‘ధర్మశాస్త్రం’ ప్రధాన భావాన్ని స్పష్టంగా ఇస్తుంది; ‘బోధ’ అనే విస్తృత సాధ్యతను పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలిని వాడాం. ‘భుజం తిప్పడం,’ ‘మెడ బిగించుకోవడం’ అనే మూల రూపకాలను నిలిపి, అసహజమైన పదక్షర అనువాదాన్ని నివారించాం.
