source:
  edition: WLC
  text: וְ/הֵ֣ם בְּ/מַלְכוּתָ/ם֩ וּ/בְ/טוּבְ/ךָ֨ הָ/רָ֜ב אֲשֶׁר נָתַ֣תָּ לָ/הֶ֗ם וּ/בְ/אֶ֨רֶץ הָ/רְחָבָ֧ה וְ/הַ/שְּׁמֵנָ֛ה אֲשֶׁר נָתַ֥תָּ לִ/פְנֵי/הֶ֖ם לֹ֣א עֲבָד֑וּ/ךָ וְֽ/לֹא שָׁ֔בוּ מִ/מַּֽעַלְלֵי/הֶ֖ם הָ/רָעִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/035.yaml
  text: Even in their kingdom[a], and amid your great goodness that you gave them, and in the broad and fertile land that you set before them[d][c][b], they did not serve you and did not turn from their evil deeds.
translation:
  language: te
  text: వారు తమ రాజ్యంలోను, నీవు వారికి ఇచ్చిన నీ గొప్ప మేలులోను, నీవు వారి ముందుంచిన విశాలమైన సారవంతమైన దేశంలోను ఉన్నప్పటికీ, నిన్ను సేవించలేదు[a]; తమ చెడు క్రియల నుండి తిరగలేదు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నిన్ను ఆరాధించలేదు’ అని కూడా అనువదించవచ్చు; హీబ్రూ క్రియలో సేవ, విధేయత, ఆరాధన అనే భావాలు ఉన్నాయి.
    reason: lexical_alternative
  - marker: b
    text: ‘తమ చెడు క్రియలను విడిచిపెట్టలేదు’ అని కూడా అనువదించవచ్చు; అక్షరార్థంగా, ‘తమ చెడు క్రియల నుండి తిరగలేదు.’ ‘తమ చెడు క్రియల విషయమై పశ్చాత్తాపపడలేదు’ అనే భావం కూడా ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּמַלְכוּתָם
  choice: తమ రాజ్యంలో ఉన్నప్పటికీ
  rationale: מַלְכוּת ఇక్కడ వారి రాజ్యం లేదా స్థిరమైన జాతీయ పరిపాలనా స్థితిని సూచిస్తుంది. వాక్యంలోని వ్యతిరేక భావాన్ని తెలుగులో సహజంగా తెలియజేయడానికి ‘ఉన్నప్పటికీ’ వాడబడింది.
- source_word: וּבְטוּבְךָ הָרָב
  choice: నీ గొప్ప మేలును అనుభవిస్తూ
  rationale: טוּב దేవుని మంచితనాన్నీ ఆయన ప్రసాదించిన సమృద్ధినీ సూచించగలదు. ‘మేలు’ ఈ రెండు ఛాయలను నిలుపుతుంది; בְ యొక్క సందర్భార్థాన్ని సహజ తెలుగులో ‘అనుభవిస్తూ’ వ్యక్తం చేస్తుంది.
- source_word: אֲשֶׁר נָתַתָּ לָהֶם
  choice: నీవు వారికి ఇచ్చిన
  rationale: హీబ్రూ సంబంధవాక్య నిర్మాణాన్ని స్పష్టమైన, సహజమైన తెలుగులో నేరుగా ప్రతిబింబిస్తుంది.
- source_word: אֶרֶץ הָרְחָבָה וְהַשְּׁמֵנָה
  choice: విశాలమైన సారవంతమైన దేశం
  rationale: רְחָבָה అంటే విశాలమైనది; שְׁמֵנָה అక్షరార్థంగా ‘కొవ్వైనది,’ అయితే భూమి విషయంలో ఇది సారవంతమైనదనే నుడికారార్థం కలిగి ఉంది.
- source_word: אֲשֶׁר נָתַתָּ לִפְנֵיהֶם
  choice: నీవు వారి ముందుంచిన
  rationale: לִפְנֵיהֶם యొక్క ‘వారి ముందు’ అనే రూపకాన్ని నిలుపుతూ, దేవుడు దేశాన్ని వారికి అందుబాటులో ఉంచాడనే భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: לֹא עֲבָדוּךָ
  choice: వారు నిన్ను సేవించలేదు
  rationale: עבד దేవుని సంబంధంలో సేవ, విధేయత, ఆరాధనలను కలుపుకొనే విస్తృత అర్థం కలిగి ఉంది. ‘సేవించలేదు’ ఆ పరిధిని ‘ఆరాధించలేదు’ కంటే మెరుగ్గా నిలుపుతుంది.
- source_word: וְלֹא שָׁבוּ
  choice: విడిచిపెట్టలేదు
  rationale: שׁוב מן యొక్క మూలభావం ‘నుండి తిరగడం.’ చెడు క్రియల సందర్భంలో ‘విడిచిపెట్టలేదు’ ఆధునిక తెలుగులో సహజంగా అదే నైతిక మలుపును వ్యక్తం చేస్తుంది; పాదటిప్పణిలో అక్షరార్థం ఇవ్వబడింది.
- source_word: מִמַּעַלְלֵיהֶם הָרָעִים
  choice: తమ చెడు క్రియలను
  rationale: מַעֲלָלִים అంటే క్రియలు, కార్యాలు లేదా ప్రవర్తనలు. ‘చెడు క్రియలు’ మూలంలోని నైతిక తీర్పును స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: దేవుని సంబంధంలో עבד అనువాదం
  choice: నిన్ను సేవించలేదు
  alternative: నిన్ను ఆరాధించలేదు
  rationale: ‘సేవించు’ అనే పదం ఆరాధనతో పాటు నిబంధనాత్మక విధేయతను కూడా కలిగి ఉండే మూలపద విస్తృతిని కాపాడుతుంది.
- issue: నైతిక సందర్భంలో שׁוב מן అనువాదం
  choice: తమ చెడు క్రియలను విడిచిపెట్టలేదు
  alternative: తమ చెడు క్రియల నుండి తిరగలేదు / తమ చెడు క్రియల విషయమై పశ్చాత్తాపపడలేదు
  rationale: ప్రధాన వాక్యంలో సహజమైన తెలుగు వాడుతూ, ‘పశ్చాత్తాపం’ అనే మరింత వ్యాఖ్యానాత్మక పదాన్ని నేరుగా చేర్చకుండా మూలంలోని క్రియల నుండి మళ్లే భావాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన ప్రార్థనా శైలి. పునరుక్త హీబ్రూ בְ నిర్మాణాలను యాంత్రికంగా కాకుండా ‘అనుభవిస్తూ,’ ‘నివసిస్తూ’ అని సహజీకరించాం. ‘విశాలమైన సారవంతమైన దేశం’ ద్వారా ‘విశాలమైన, కొవ్వైన దేశం’ అనే హీబ్రూ నుడికారాన్ని అర్థస్పష్టంగా అందించాం.
