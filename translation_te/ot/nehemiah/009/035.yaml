revisions:
- from: వారు తమ రాజ్యంలో ఉన్నప్పటికీ, నీవు వారికి ఇచ్చిన నీ గొప్ప మేలును అనుభవిస్తూ, నీవు వారి ముందుంచిన విశాలమైన సారవంతమైన దేశంలో నివసిస్తూ కూడా, వారు నిన్ను సేవించలేదు[a]; తమ చెడు క్రియలను విడిచిపెట్టలేదు[b].
  to: వారు తమ రాజ్యంలోను, నీవు వారికి ఇచ్చిన నీ గొప్ప మేలులోను, నీవు వారి ముందుంచిన విశాలమైన సారవంతమైన దేశంలోను ఉన్నప్పటికీ, నిన్ను సేవించలేదు[a]; తమ చెడు క్రియల నుండి తిరగలేదు[b].
  rationale: The revision removes unsupported ‘living’ language, represents the repeated Hebrew prepositional phrases more directly, and restores the explicit ‘turn from’ imagery for שוב מן. It preserves the draft’s accurate rendering of service to God and its non-sectarian lexical alternatives.
