source:
  edition: WLC
  text: וּ/בְ/יוֹם֩ עֶשְׂרִ֨ים וְ/אַרְבָּעָ֜ה לַ/חֹ֣דֶשׁ הַ/זֶּ֗ה נֶאֶסְפ֤וּ בְנֵֽי יִשְׂרָאֵל֙ בְּ/צ֣וֹם וּ/בְ/שַׂקִּ֔ים וַ/אֲדָמָ֖ה עֲלֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/001.yaml
  text: On the twenty-fourth day of this month[a], the sons of Israel assembled with fasting, in sackcloth[b], and with dirt on them.
translation:
  language: te
  text: ఈ నెల ఇరవై నాలుగవ రోజున ఇశ్రాయేలీయులు[a] ఉపవాసముండి, గోనెపట్టలు ధరించి, తమ మీద మట్టి వేసుకొని[b] సమకూడారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులు’; సంప్రదాయంగా ‘ఇశ్రాయేలు సంతానం’ అని కూడా అనువదిస్తారు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా ‘వారి మీద మట్టి.’ దుఃఖం, పశ్చాత్తాపానికి సూచనగా వారు తమ మీద మట్టి లేదా నేల వేసుకున్నారు.
    reason: cultural_note
lexical_decisions:
- source_word: וּבְיוֹם עֶשְׂרִים וְאַרְבָּעָה לַחֹדֶשׁ הַזֶּה
  choice: ఈ నెల ఇరవై నాలుగవ రోజున
  rationale: హీబ్రూ తేదీ నిర్దేశక నిర్మాణాన్ని ఆధునిక తెలుగులో సహజమైన క్రమంలో అందిస్తుంది. ఆరంభంలోని וְ కథన అనుసంధానాన్ని సూచించినా, తెలుగులో ప్రత్యేకంగా ‘మరియు’ అని చేర్చకుండానే సందర్భం దానిని తెలియజేస్తుంది.
- source_word: נֶאֶסְפוּ
  choice: సమకూడారు
  rationale: నిఫాల్ రూపంలోని సమూహంగా కూడివచ్చిన భావాన్ని తెలుగులో సహజమైన ఆత్మనేపదార్థక క్రియతో వ్యక్తపరుస్తుంది; ఎవరో వారిని కూడగట్టారని అనవసరంగా సూచించదు.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులు
  rationale: అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులు’ అయినప్పటికీ, ఇక్కడ సమాజమంతటినీ సూచించే వంశపరమైన సంజ్ఞ. ‘ఇశ్రాయేలీయులు’ ఆధునిక పాఠకులకు సహజంగా, సమగ్రంగా అర్థమవుతుంది; అక్షరార్థాన్ని పాదసూచికలో నిలిపాం.
- source_word: בְּצוֹם
  choice: ఉపవాసముండి
  rationale: వారు కూడినప్పుడు పాటించిన పశ్చాత్తాప సంబంధమైన ఉపవాసాన్ని సహజమైన తెలుగు క్రియారూపంలో తెలియజేస్తుంది.
- source_word: וּבְשַׂקִּים
  choice: గోనెపట్టలు ధరించి
  rationale: שַׂקִּים అనేది దుఃఖం, పశ్చాత్తాపానికి సూచనగా ధరించే ముతక వస్త్రాలను సూచిస్తుంది. కేవలం ‘గోనెపట్టలలో’ కంటే ‘ధరించి’ తెలుగులో స్పష్టంగా ఉంటుంది.
- source_word: וַאֲדָמָה עֲלֵיהֶם
  choice: తమ మీద మట్టి వేసుకొని
  rationale: అక్షరార్థంగా ‘వారి మీద నేల/మట్టి’ అని ఉంది. దుఃఖం, పశ్చాత్తాప సూచకంగా మట్టిని తమపై వేసుకున్న ఆచారాన్ని సహజ తెలుగులో తెలియజేస్తుంది; మూలంలో లేని ‘తలల మీద’ అనే నిర్దిష్టతను చేర్చదు.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరతను నిలుపుతూ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే నిర్మాణం వాడబడింది. వాక్యంలోని వరుస క్రియారూపాలు ఉపవాసం, గోనెపట్టలు, మట్టి అనే మూడు అనుబంధ పరిస్థితులను ప్రధాన క్రియ ‘సమకూడారు’తో సహజంగా కలుపుతాయి.
