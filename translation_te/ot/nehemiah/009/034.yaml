revisions:
- from: మన రాజులు, మన అధికారులు, మన యాజకులు, మన పితరులు కూడా నీ ధర్మశాస్త్రాన్ని పాటించలేదు; నీవు వారిని హెచ్చరించిన నీ ఆజ్ఞలను, నీ సాక్ష్యాలను వారు ఆలకించలేదు.[a]
  to: మన రాజులు, మన అధికారులు, మన యాజకులు, మన పితరులు కూడా నీ ధర్మశాస్త్రాన్ని పాటించలేదు; నీ ఆజ్ఞలనూ, నీవు వారిని హెచ్చరించిన నీ సాక్ష్యాలనూ వారు ఆలకించలేదు.[a]
