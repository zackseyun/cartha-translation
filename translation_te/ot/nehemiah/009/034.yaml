id: NEH.9.34
reference: Nehemiah 9:34
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אֶת מְלָכֵ֤י/נוּ שָׂרֵ֨י/נוּ֙ כֹּהֲנֵ֣י/נוּ וַ/אֲבֹתֵ֔י/נוּ לֹ֥א עָשׂ֖וּ תּוֹרָתֶ֑/ךָ וְ/לֹ֤א הִקְשִׁ֨יבוּ֙ אֶל מִצְוֺתֶ֔י/ךָ וּ/לְ/עֵ֣דְוֺתֶ֔י/ךָ אֲשֶׁ֥ר הַעִידֹ֖תָ בָּ/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/034.yaml
  text: Even our kings[a], our officials, our priests, and our fathers did not keep your law[c][b], and they did not listen to your commandments and your testimonies with which you warned them.
translation:
  language: te
  text: మన రాజులు, మన అధికారులు, మన యాజకులు, మన పితరులు కూడా నీ ధర్మశాస్త్రాన్ని పాటించలేదు; నీ ఆజ్ఞలనూ, నీవు వారిని హెచ్చరించిన నీ సాక్ష్యాలనూ వారు ఆలకించలేదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “నీవు వాటిద్వారా వారిమీద సాక్ష్యమిచ్చిన నీ సాక్ష్యాలు” అని కూడా అనువదించవచ్చు. ఇక్కడ “సాక్ష్యాలు” దేవుని ఒడంబడికకు సంబంధించిన సాక్ష్యాన్ని, గంభీరమైన హెచ్చరికలను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת
  choice: కూడా
  rationale: మునుపటి ఒప్పుకోలుకు ఈ వర్గాలను చేర్చే సంయోజక భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: מְלָכֵינוּ
  choice: మన రాజులు
  rationale: బహువచన రూపాన్నీ ప్రథమ పురుష బహువచన స్వామ్య ప్రత్యయాన్నీ నేరుగా ప్రతిబింబిస్తుంది.
- source_word: שָׂרֵינוּ
  choice: మన అధికారులు
  rationale: రాజకీయ, పరిపాలనా నాయకులను సూచించే שָׂרִים అనే పదానికి ఆధునిక సందర్భంలో స్పష్టమైన అనువాదం.
- source_word: כֹּהֲנֵינוּ
  choice: మన యాజకులు
  rationale: כֹּהֵן అనే ఆరాధనా పదవికి ప్రామాణిక తెలుగు పదం.
- source_word: וַאֲבֹתֵינוּ
  choice: మన పితరులు
  rationale: అక్షరార్థమైన ‘మన తండ్రులు’ కంటే పూర్వ తరాల పూర్వికులను సూచించే బైబిలీయ సందర్భాన్ని ‘పితరులు’ సహజంగా, గౌరవంగా వ్యక్తపరుస్తుంది.
- source_word: לֹא עָשׂוּ תּוֹרָתֶךָ
  choice: నీ ధర్మశాస్త్రాన్ని పాటించలేదు
  rationale: תּוֹרָהతో עשה వాడుక ఆచరించడం లేదా పాటించడం అనే ఒడంబడిక సంబంధిత భావాన్ని ఇస్తుంది; ‘ధర్మశాస్త్రం’ ఇక్కడి సందర్భానికి తగినది.
- source_word: הִקְשִׁיבוּ
  choice: ఆలకించలేదు
  rationale: శ్రద్ధగా వినడం, లక్ష్యపెట్టడం, విధేయత చూపడం అనే హిఫిల్ భావాన్ని సంక్షిప్తంగా, గౌరవప్రదంగా వ్యక్తపరుస్తుంది.
- source_word: מִצְוֺתֶיךָ
  choice: నీ ఆజ్ఞలను
  rationale: దేవుని నిర్దిష్ట ఆదేశాలను సూచించే సహజమైన, స్థిరమైన తెలుగు పదం.
- source_word: וּלְעֵדְוֺתֶיךָ
  choice: నీ సాక్ష్యాలను
  rationale: עֵדוֹתలోని ఒడంబడిక సాక్ష్య భావాన్ని నిలుపుతూ ‘ఆజ్ఞలు’తో ఉన్న పదభేదాన్ని కాపాడుతుంది.
- source_word: אֲשֶׁר הַעִידֹתָ בָהֶם
  choice: నీవు వారిని హెచ్చరించిన
  rationale: העיד యొక్క గంభీరంగా సాక్ష్యమిచ్చి హెచ్చరించే భావాన్ని తెలుగులో స్పష్టంగా తెలుపుతుంది; సంబంధవాచక భాగాన్ని ఆజ్ఞలు, సాక్ష్యాలు రెండింటికీ సహజంగా అనుసంధానిస్తుంది.
theological_decisions:
- issue: תּוֹרָה అనువాదం
  choice: నీ ధర్మశాస్త్రం
  alternative: నీ ఉపదేశం
  rationale: జాతీయ ఒడంబడిక ఒప్పుకోలు అనే సందర్భంలో ఇది సాధారణ బోధకన్నా దేవుని ఒడంబడిక ధర్మశాస్త్రాన్ని సూచిస్తుంది.
- issue: אָבוֹת అనువాదం
  choice: మన పితరులు
  alternative: మన పూర్వికులు
  rationale: మూలంలోని పుంలింగ, బైబిలీయ పితృపరంపర పదప్రయోగాన్ని కాపాడుతూ, గత తరాలను సూచించే సందర్భార్థాన్ని సహజంగా తెలియజేస్తుంది.
- issue: עֵדוֹת మరియు העיד మధ్య పదమూల సంబంధం
  choice: సాక్ష్యాలు … హెచ్చరించిన
  alternative: సాక్ష్యాలు … సాక్ష్యమిచ్చిన
  rationale: ఒకే పదమూలానికి చెందిన సాక్ష్య భావాన్ని నామవాచకంలో నిలుపుతూ, క్రియలో సందర్భానుసారమైన గంభీర హెచ్చరిక భావాన్ని స్పష్టపరుస్తుంది; ప్రత్యామ్నాయ అక్షరార్థాన్ని పాదటీకలో ఉంచింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన బైబిలీయ శైలిని ఉపయోగించాం. ‘అధికారులు’ సాధారణ పాఠకులకు స్పష్టంగా ఉండగా, ‘యాజకులు,’ ‘పితరులు,’ ‘ధర్మశాస్త్రం,’ ‘సాక్ష్యాలు’ మూలంలోని ప్రత్యేక ఒడంబడిక పదభేదాలను నిలుపుతాయి. పాదటీక సూచిక [a] ప్రధాన పాఠ్యంలో ఉంది.
