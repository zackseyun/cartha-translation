id: NEH.9.12
reference: Nehemiah 9:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/בְ/עַמּ֣וּד עָנָ֔ן הִנְחִיתָ֖/ם יוֹמָ֑ם וּ/בְ/עַמּ֥וּד אֵשׁ֙ לַ֔יְלָה לְ/הָאִ֣יר לָ/הֶ֔ם אֶת הַ/דֶּ֖רֶךְ אֲשֶׁ֥ר יֵֽלְכוּ בָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/012.yaml
  text: By a pillar of cloud you led them by day[a], and by a pillar of fire by night to give them light on the way in which they should go.
translation:
  language: te
  text: పగటివేళ మేఘస్తంభం ద్వారా నీవు వారిని నడిపించావు; రాత్రివేళ వారు వెళ్లవలసిన దారిని వారికి వెలిగించడానికి అగ్నిస్తంభం ద్వారా నడిపించావు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְעַמּוּד עָנָן
  choice: మేఘస్తంభం ద్వారా
  rationale: בְּ ఇక్కడ సాధనార్థకంగా లేదా స్థానార్థకంగా గ్రహించవచ్చు. సందర్భంలో దేవుడు మేఘస్తంభాన్ని ఉపయోగించి నడిపించిన భావాన్ని సహజమైన తెలుగులో ‘ద్వారా’ తెలియజేస్తుంది; స్థాన సంబంధమైన సూక్ష్మార్థాన్ని అనవసరంగా నిర్ధారించదు.
- source_word: הִנְחִיתָם
  choice: నీవు వారిని నడిపించావు
  rationale: נחה హిఫిల్ రూపానికి ఇక్కడ మార్గనిర్దేశం చేయడం, నడిపించడం అనే అర్థం సందర్భానుకూలం.
- source_word: יוֹמָם
  choice: పగటివేళ
  rationale: కాలసూచక క్రియావిశేషణాన్ని రాత్రివేళతో సమాంతరంగా, సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וּבְעַמּוּד אֵשׁ
  choice: అగ్నిస్తంభం ద్వారా
  rationale: మేఘస్తంభానికి సమాంతర నిర్మాణాన్ని నిలుపుతూ בְּ యొక్క సాధనార్థక భావాన్ని తెలియజేస్తుంది.
- source_word: לַיְלָה
  choice: రాత్రివేళ
  rationale: יוֹמָםకు సమాంతరమైన కాలసూచనను స్పష్టంగా అందిస్తుంది.
- source_word: לְהָאִיר לָהֶם
  choice: వారికి వెలుగు ఇవ్వడానికి
  rationale: אור హిఫిల్ అనంతరూపం ఉద్దేశాన్ని లేదా ఫలితాన్ని సూచిస్తుంది; לָהֶם లోని ప్రయోజనార్థక భావాన్ని ఈ సహజమైన తెలుగు పదబంధం నిలుపుతుంది.
- source_word: אֶת הַדֶּרֶךְ
  choice: దారిలో
  rationale: హీబ్రూలో ‘దారి’ ప్రత్యక్ష కర్మగా ఉన్నా, తెలుగులో ‘దారికి వెలుగు ఇవ్వడం’ కంటే ‘దారిలో వారికి వెలుగు ఇవ్వడం’ సహజంగా ఉండి సందర్భార్థాన్ని కాపాడుతుంది.
- source_word: אֲשֶׁר יֵלְכוּ בָהּ
  choice: వారు వెళ్లవలసిన
  rationale: వారు అనుసరించాల్సిన మార్గాన్ని సూచిస్తుంది. הלך యొక్క భావాన్ని సందర్భానుగుణంగా ‘వెళ్లడం’ సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: అరణ్య ప్రయాణంలో దేవుని మార్గదర్శకత్వపు రూపచిత్రం
  choice: ఇశ్రాయేలును దేవుడు మేఘస్తంభం, అగ్నిస్తంభం ద్వారా చారిత్రకంగా నడిపించినట్లు నేరుగా అనువదించడం
  alternative: మార్గదర్శకత్వం కంటే దైవసన్నిధిని ముందుకు తెచ్చే వ్యాఖ్యానాత్మక అనువాదం
  rationale: హీబ్రూ వాక్యం దేవుడు వారిని నడిపించడం, వారి దారికి వెలుగు ఇవ్వడం మీద దృష్టి పెడుతుంది. అదనపు ప్రతీకాత్మక లేదా సిద్ధాంతపరమైన అర్థాన్ని ప్రధాన పాఠ్యంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయితే గంభీరమైన గ్రంథశైలిని నిలుపుతూ అనువదించబడింది. హీబ్రూ సమాంతరతను ‘పగటివేళ… రాత్రివేళ…’ ద్వారా కాపాడింది.
