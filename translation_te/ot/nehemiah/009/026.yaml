revisions:
- from: అయితే వారు ధిక్కారంగా ప్రవర్తించి, నీ మీద తిరుగుబాటు చేశారు[a]. నీ ధర్మశాస్త్రాన్ని[b] తమ వీపుల వెనుకకు విసిరివేశారు. తమను తిరిగి నీ వైపుకు మళ్లించడానికి తమను గట్టిగా హెచ్చరించిన[c] నీ ప్రవక్తలను చంపేశారు. ఎంతో ఘోరంగా నిన్ను అవమానించారు[d].
  to: అయితే వారు ధిక్కారంగా ప్రవర్తించి, నీ మీద తిరుగుబాటు చేశారు[a]. నీ ధర్మశాస్త్రాన్ని[b] తమ వీపుల వెనుకకు విసిరివేశారు. వారు నీ వైపుకు తిరిగి రావాలని వారికి గంభీరంగా హెచ్చరించిన[c] నీ ప్రవక్తలను చంపేశారు. నీ పట్ల తీవ్రమైన ధిక్కారకార్యాలు చేశారు[d].
  rationale: ప్రవక్తలు ప్రజలను హెచ్చరించి వారిని దేవుని వైపుకు తిరిగేలా చేయాలనుకున్నారనే వాక్య సంబంధాన్ని తెలుగు సర్వనామ అస్పష్టత లేకుండా సరిచేశాం. చివరి ఉపవాక్యాన్ని దేవునిపట్ల జరిగిన తీవ్రమైన ధిక్కార చర్యలుగా మార్చి, హీబ్రూ నామవాచకపు బహువచన మరియు విస్తృత భావపరిధిని నిలుపుకున్నాం. పాదటిప్పణి cలో కూడా ‘తమకు’ స్థానంలో స్పష్టమైన ‘వారికి’ ఉపయోగించబడింది.
