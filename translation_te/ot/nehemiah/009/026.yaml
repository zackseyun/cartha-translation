  revision_rationale: ప్రవక్తలు ప్రజలను హెచ్చరించి వారిని దేవుని వైపుకు తిరిగేలా చేయాలనుకున్నారనే వాక్య సంబంధాన్ని తెలుగు సర్వనామ అస్పష్టత లేకుండా సరిచేశాం. చివరి ఉపవాక్యాన్ని దేవునిపట్ల జరిగిన తీవ్రమైన ధిక్కార చర్యలుగా మార్చి, హీబ్రూ నామవాచకపు బహువచన మరియు విస్తృత భావపరిధిని నిలుపుకున్నాం. పాదటిప్పణి cలో కూడా ‘తమకు’ స్థానంలో స్పష్టమైన ‘వారికి’ ఉపయోగించబడింది.
