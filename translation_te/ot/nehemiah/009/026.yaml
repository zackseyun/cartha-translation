id: NEH.9.26
reference: Nehemiah 9:26
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּמְר֨וּ וַֽ/יִּמְרְד֜וּ בָּ֗/ךְ וַ/יַּשְׁלִ֤כוּ אֶת תּוֹרָֽתְ/ךָ֙ אַחֲרֵ֣י גַוָּ֔/ם וְ/אֶת נְבִיאֶ֣י/ךָ הָרָ֔גוּ אֲשֶׁר הֵעִ֥ידוּ בָ֖/ם לַ/הֲשִׁיבָ֣/ם אֵלֶ֑י/ךָ וַֽ/יַּעֲשׂ֔וּ נֶאָצ֖וֹת גְּדוֹלֹֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/026.yaml
  text: But they acted presumptuously and rebelled against you[a], and they cast your law behind their backs. They killed your prophets, who had warned them in order to bring them back to you[d][c][b], and they committed great blasphemies.
translation:
  language: te
  text: అయితే వారు ధిక్కారంగా ప్రవర్తించి, నీ మీద తిరుగుబాటు చేశారు[a]. నీ ధర్మశాస్త్రాన్ని[b] తమ వీపుల వెనుకకు విసిరివేశారు. వారు నీ వైపుకు తిరిగి రావాలని వారికి గంభీరంగా హెచ్చరించిన[c] నీ ప్రవక్తలను చంపేశారు. నీ పట్ల తీవ్రమైన ధిక్కారకార్యాలు చేశారు[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘అవిధేయులుగా ప్రవర్తించి,’ ‘మొండిగా ఎదిరించి,’ లేదా ‘నిన్ను రెచ్చగొట్టి’ అని కూడా అనువదించవచ్చు; హీబ్రూ క్రియ ధిక్కారపూరితమైన ప్రతిఘటనను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘నీ ఉపదేశాన్ని’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: ‘వారికి వ్యతిరేకంగా సాక్ష్యమిచ్చిన’ అని కూడా అనువదించవచ్చు; హీబ్రూ పదం గంభీరంగా హెచ్చరించడం లేదా సాక్ష్యమివ్వడం అనే భావాలను కలిగి ఉంది.
    reason: lexical_alternative
  - marker: d
    text: ‘గొప్ప అవమానకరమైన కార్యాలు చేశారు,’ ‘మహా దైవదూషణలు చేశారు,’ లేదా ‘తీవ్రంగా తిరస్కరించారు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּמְרוּ
  choice: ధిక్కారంగా ప్రవర్తించి
  rationale: מרה అనే క్రియ అవిధేయతతో కూడిన మొండి ధిక్కారాన్ని సూచిస్తుంది. తరువాత వచ్చే స్పష్టమైన ‘తిరుగుబాటు చేశారు’ అనే క్రియతో తేడాను నిలుపుతుంది.
- source_word: וַיִּמְרְדוּ בָּךְ
  choice: నీ మీద తిరుగుబాటు చేశారు
  rationale: מרד బహిరంగ తిరుగుబాటును సూచిస్తుంది; בָּךְ దేవునికి వ్యక్తిగతంగా వ్యతిరేకంగా చేసిన తిరుగుబాటును తెలియజేస్తుంది.
- source_word: וַיַּשְׁלִכוּ ... אַחֲרֵי גַוָּם
  choice: తమ వీపుల వెనుకకు విసిరివేశారు
  rationale: దేవుని ధర్మశాస్త్రాన్ని తిరస్కారంతో తోసిపుచ్చినట్లు చూపే స్పష్టమైన హీబ్రూ రూపకాన్ని అలాగే నిలుపుతుంది.
- source_word: תּוֹרָתְךָ
  choice: నీ ధర్మశాస్త్రాన్ని
  rationale: תּוֹרָה బోధన లేదా ఉపదేశం అని కూడా అర్థమవుతుంది; ఇక్కడ నిబంధనాత్మక చారిత్రక సందర్భంలో ‘ధర్మశాస్త్రం’ సహజమైన, గుర్తించదగిన పదం.
- source_word: נְבִיאֶיךָ
  choice: నీ ప్రవక్తలను
  rationale: మూలపదానికి ప్రామాణికమైన, సందర్భోచితమైన అనువాదం.
- source_word: הֵעִידוּ בָם
  choice: తమను గట్టిగా హెచ్చరించిన
  rationale: הֵעִידוּ בָם గంభీరంగా సాక్ష్యమివ్వడం లేదా హెచ్చరించడం అనే భావాన్ని కలిగి ఉంది. తరువాత పేర్కొన్న పునరాగమన ఉద్దేశంతో ‘గట్టిగా హెచ్చరించిన’ సహజంగా సరిపోతుంది.
- source_word: לַהֲשִׁיבָם אֵלֶיךָ
  choice: తమను తిరిగి నీ వైపుకు మళ్లించడానికి
  rationale: שׁוב హిఫిల్ రూపంలోని కారణార్థాన్ని, అలాగే దేవుని వైపు తిరిగి రావాలనే సంబంధాత్మక దిశను నిలుపుతుంది.
- source_word: נֶאָצוֹת גְּדוֹלֹת
  choice: ఎంతో ఘోరంగా నిన్ను అవమానించారు
  rationale: ఈ పదబంధం దేవునిపట్ల తీవ్రమైన తిరస్కారం, దూషణ, అవమానం చేసిన కార్యాలను సూచిస్తుంది. కేవలం మాటల దైవదూషణకు పరిమితం చేయకుండా విస్తృత హీబ్రూ భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: וַיַּמְרוּ / וַיִּמְרְדוּ అనే జంట తిరుగుబాటు క్రియల అనువాదం
  choice: ‘ధిక్కారంగా ప్రవర్తించి, ... తిరుగుబాటు చేశారు’ అని వేరు చేయడం
  alternative: ‘అవిధేయులై తిరుగుబాటు చేశారు’ లేదా ‘నిన్ను రెచ్చగొట్టి తిరుగుబాటు చేశారు’
  rationale: రెండు సంబంధితమైనా వేర్వేరు క్రియలను ఒకే భావంగా కలపకుండా, ధిక్కారం నుండి బహిరంగ తిరుగుబాటుకు పెరిగే వాక్యబలాన్ని నిలుపుతుంది.
- issue: נֶאָצוֹת గల భావపరిధి
  choice: ‘ఎంతో ఘోరంగా నిన్ను అవమానించారు’
  alternative: ‘మహా దైవదూషణలు చేశారు’ లేదా ‘తీవ్రంగా తిరస్కరించారు’
  rationale: మూలపదం మాటల దైవదూషణకంటే విస్తృతంగా దేవునిపట్ల చూపిన ధిక్కారం, అవమానం, తిరస్కారాన్ని సూచించగలదు. ప్రత్యక్ష కర్మగా దేవునిని చేర్చడం సందర్భంలోని దైవముఖ దోషాన్ని స్పష్టం చేస్తుంది, కాని చర్యను మాటలకు మాత్రమే పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన ప్రార్థనా-ఒప్పుకోలు శైలిని ఉపయోగించాం. ‘తమ వీపుల వెనుకకు విసిరివేశారు’ అనే స్పష్టమైన మూల రూపకాన్ని కాపాడాం. సర్వనామాలు ఏకవచన దేవునిని నేరుగా సంబోధించే సందర్భానికి అనుగుణంగా ఉన్నాయి; వాక్య నిర్మాణం సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా విభజించబడింది.
