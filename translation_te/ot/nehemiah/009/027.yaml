  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַֽ/תִּתְּנֵ/ם֙ בְּ/יַ֣ד צָֽרֵי/הֶ֔ם וַ/יָּצֵ֖רוּ לָ/הֶ֑ם וּ/בְ/עֵ֤ת צָֽרָתָ/ם֙ יִצְעֲק֣וּ אֵלֶ֔י/ךָ וְ/אַתָּה֙ מִ/שָּׁמַ֣יִם תִּשְׁמָ֔ע וּֽ/כְ/רַחֲמֶ֣י/ךָ הָֽ/רַבִּ֗ים תִּתֵּ֤ן לָ/הֶם֙ מֽוֹשִׁיעִ֔ים וְ/יוֹשִׁיע֖וּ/ם מִ/יַּ֥ד צָרֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/027.yaml
  text: So you gave them into the hand of their adversaries[a], who oppressed them. But in the time of their distress they cried out to you, and you heard from heaven; and according to your abundant mercies you gave them deliverers, who saved them from the hand of their adversaries.
translation:
  language: te
  text: కాబట్టి నీవు వారిని వారి విరోధుల చేతికి అప్పగించావు; ఆ విరోధులు వారిని అణచివేశారు. అయితే తమ కష్టకాలంలో వారు నీకు మొరపెట్టినప్పుడు, నీవు ఆకాశం నుండి విన్నావు. నీ గొప్ప కనికరములను బట్టి వారికి రక్షకులను[a] అనుగ్రహించావు; వారు వారిని వారి విరోధుల చేతిలో నుండి రక్షించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ ‘రక్షకులు’ అంటే దేవుడు తన ప్రజలను విడిపించడానికి అనుగ్రహించిన మానవ ప్రతినిధులు. హీబ్రూ పదం ‘రక్షించు’ అనే క్రియ నుండి వచ్చింది; దీనిని ‘విమోచకులు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּתְּנֵם בְּיַד
  choice: వారిని ... చేతికి అప్పగించావు
  rationale: נתן + ביד ఇక్కడ మరొకరి అధికారానికి అప్పగించడాన్ని సూచిస్తుంది. తెలుగు సహజ వాడుకలో ‘చేతికి అప్పగించు’ అనే రూపం మూలంలోని చేతి-రూపకాన్ని, అధికార భావాన్ని రెండింటినీ నిలుపుతుంది.
- source_word: צָרֵיהֶם
  choice: వారి విరోధులు
  rationale: צָר hostile opponentsను సూచిస్తుంది. తరువాతి అణచివేత క్రియతో కలిపివేయకుండా ‘విరోధులు’గా అనువదించబడింది.
- source_word: וַיָּצֵרוּ לָהֶם
  choice: వారు వీరిని అణచివేశారు
  rationale: ఈ క్రియ నొక్కివేయడం, ఇబ్బందికి గురిచేయడం, పీడించడం అనే భావాన్ని కలిగిస్తుంది; చారిత్రక అధీనత సందర్భంలో ‘అణచివేశారు’ సహజంగా సరిపోతుంది.
- source_word: וּבְעֵת צָרָתָם
  choice: అయితే తమ కష్టకాలంలో
  rationale: עֵת צָרָה అంటే కష్టం లేదా ఆపద సంభవించిన కాలం. కథనంలోని వ్యత్యాసాన్ని తెలుగులో ‘అయితే’ స్పష్టం చేస్తుంది.
- source_word: יִצְעֲקוּ אֵלֶיךָ
  choice: నీకు మొరపెట్టినప్పుడు
  rationale: צעק సాధారణంగా పిలవడం కంటే ఆపదలో అత్యవసరంగా మొరపెట్టడాన్ని సూచిస్తుంది.
- source_word: מִשָּׁמַיִם תִּשְׁמָע
  choice: నీవు పరలోకం నుండి ఆలకించావు
  rationale: ‘నుండి’ మూలంలోని స్థలసూచనను నిలుపుతుంది. ఆలకించావు అనేది ప్రార్థనను శ్రద్ధగా వినడాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וּכְרַחֲמֶיךָ הָרַבִּים
  choice: నీ విస్తారమైన కనికరాన్ని బట్టి
  rationale: רחמים యొక్క బహుత్వం, הָרַבִּים యొక్క సమృద్ధి భావం తెలుగులో సహజమైన సమూహార్థక ‘విస్తారమైన కనికరం’ ద్వారా వ్యక్తమవుతాయి.
- source_word: מֹשִׁיעִים
  choice: రక్షకులు
  rationale: ישׁע మూలం నుండి వచ్చిన ఈ కర్తృవాచకం, దేవుడు నియమించిన మానవ రక్షణకర్తలను సూచిస్తుంది. ‘రక్షకులు’ మూలపద సంబంధాన్ని నిలుపుతుంది; సందర్భాన్ని పాదసూచిక స్పష్టం చేస్తుంది.
- source_word: וְיוֹשִׁיעוּם
  choice: వారు వీరిని ... రక్షించారు
  rationale: מֹשִׁיעִים మరియు וְיוֹשִׁיעוּם మధ్యనున్న ఒకే ישׁע మూలపద సంబంధాన్ని ‘రక్షకులు/రక్షించారు’ అనే పునరుక్తితో నిలుపుతుంది.
- source_word: מִיַּד צָרֵיהֶם
  choice: వారి విరోధుల చేతిలో నుండి
  rationale: మొదటి భాగంలోని ‘చేతికి’ అనే అధికార రూపకాన్ని, צָרֵיהֶם పునరావృతిని స్థిరంగా నిలుపుతుంది.
theological_decisions:
- issue: మానవ ప్రతినిధులకు మֹשִׁיעִים అనే పదం వాడబడటం
  choice: రక్షకులు
  alternative: విమోచకులు
  rationale: ఈ సందర్భంలో దేవుడు అనుగ్రహించిన మానవ ప్రతినిధులే ప్రజలను శత్రువుల అధికారం నుండి రక్షిస్తారు. ‘రక్షకులు’ ישׁע మూలంతో ఉన్న ప్రత్యక్ష సంబంధాన్ని నిలుపుతుంది; వారు దేవునికి భిన్నమైన మానవ సాధనాలని పాదసూచిక తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన, సులభంగా అర్థమయ్యే శైలి. ‘వారు/వీరిని’ ద్వారా విరోధులు మరియు ఇశ్రాయేలీయుల మధ్య సూచనాభ్రాంతి తగ్గించబడింది. మూలంలోని ‘చేతి’ అనే అధికార రూపకం, ‘విరోధులు’ అనే పునరావృత్తి, ישׁע మూలంలోని ‘రక్షకులు/రక్షించారు’ పదసంబంధం నిలుపబడ్డాయి.
