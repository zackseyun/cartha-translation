  naturalness: వాక్యనిర్మాణం ఆధునిక ప్రామాణిక తెలుగుకు సహజంగా ఉంది. ‘ఆ విరోధులు’ అని స్పష్టంగా చెప్పడం ద్వారా ‘వారు వీరిని’లో ఉండగల సూచన అస్పష్టత తొలగుతుంది. ‘ఆకాశం నుండి విన్నావు’ సందర్భానికి సహజమైన, గౌరవప్రదమైన ప్రయోగం.
