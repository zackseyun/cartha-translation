id: NEH.9.30
reference: Nehemiah 9:30
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/תִּמְשֹׁ֤ךְ עֲלֵי/הֶם֙ שָׁנִ֣ים רַבּ֔וֹת וַ/תָּ֨עַד בָּ֧/ם בְּ/רוּחֲ/ךָ֛ בְּ/יַד נְבִיאֶ֖י/ךָ וְ/לֹ֣א הֶאֱזִ֑ינוּ וַֽ/תִּתְּנֵ֔/ם בְּ/יַ֖ד עַמֵּ֥י הָ/אֲרָצֹֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/030.yaml
  text: For many years you were patient with them and testified against them by your Spirit through your prophets[a], but they would not listen. So you gave them into the hand of the peoples of the lands.
translation:
  language: te
  text: అనేక సంవత్సరాలు నీవు వారిపట్ల సహనం చూపి, నీ ఆత్మచేత, నీ ప్రవక్తల ద్వారా వారిమీద సాక్ష్యమిచ్చావు[a]. అయినా వారు వినలేదు. కాబట్టి నీవు వారిని దేశాల ప్రజల చేతికి అప్పగించావు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీ ఆత్మచేత, నీ ప్రవక్తల ద్వారా వారిని హెచ్చరించావు.”
    reason: וַתָּעַד בָּם అనే హిఫిల్ క్రియ సందర్భానుసారం ‘వారిమీద సాక్ష్యమివ్వడం’ లేదా ‘వారిని హెచ్చరించడం’ అనే భావాన్ని కలిగి ఉంటుంది.
lexical_decisions:
- source_word: וַתִּמְשֹׁךְ עֲלֵיהֶם
  choice: నీవు వారిపట్ల సహనం చూపి
  rationale: ఈ సందర్భంలో משׁךְ עַל అనే ప్రయోగం తీర్పును ఆలస్యం చేస్తూ దీర్ఘకాలం సహించడాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘సహనం చూపి’ సహజంగా ఉండి, ఆ దీర్ఘ సహన భావాన్ని తెలియజేస్తుంది.
- source_word: שָׁנִים רַבּוֹת
  choice: అనేక సంవత్సరాలు
  rationale: కాలవ్యవధికి ఉన్న ప్రాధాన్యాన్ని నేరుగా, సహజంగా నిలుపుతుంది.
- source_word: וַתָּעַד בָּם
  choice: వారికి వ్యతిరేకంగా సాక్ష్యమిచ్చావు
  rationale: עוד హిఫిల్ రూపంలో హెచ్చరించడం, సాక్ష్యమివ్వడం అనే భావాలు ఉన్నాయి. ‘వ్యతిరేకంగా సాక్ష్యమిచ్చావు’ న్యాయపరమైన/నిబంధనాత్మక ఛాయను నిలుపుతుంది; సహజమైన ‘వారిని హెచ్చరించావు’ను పాదసూచికలో ఇస్తున్నాం.
- source_word: בְּרוּחֲךָ
  choice: నీ ఆత్మచేత
  rationale: ప్రవక్తల ద్వారా పలికిన దైవిక సాక్ష్యానికి దేవుని ఆత్మ సాధనమని సందర్భం సూచిస్తుంది.
- source_word: בְּיַד נְבִיאֶיךָ
  choice: నీ ప్రవక్తల ద్వారా
  rationale: ‘చేతి ద్వారా’ అనే హీబ్రూ సాధనార్థక నుడికారానికి సహజమైన తెలుగు సమానం.
- source_word: וְלֹא הֶאֱזִינוּ
  choice: అయినా వారు వినలేదు
  rationale: האזין శ్రద్ధగా వినడాన్ని సూచిస్తుంది. సందర్భంలోని మొండితనాన్ని తెలుగులో అతిగా విస్తరించకుండా ‘వినలేదు’ నిలుపుతుంది.
- source_word: וַתִּתְּנֵם בְּיַד
  choice: నీవు వారిని ... చేతికి అప్పగించావు
  rationale: మరొకరి అధికారానికి అప్పగించడం అనే హీబ్రూ నుడికారాన్ని స్పష్టమైన తెలుగులో తెలియజేస్తుంది.
- source_word: עַמֵּי הָאֲרָצוֹת
  choice: వివిధ దేశాల ప్రజలు
  rationale: బహువచనంలోని ప్రాంతీయ-రాజకీయ భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; ‘భూముల ప్రజలు’ అనే కృత్రిమ పదశః రూపాన్ని నివారిస్తుంది.
theological_decisions:
- issue: ‘నీ ఆత్మ’ అనే పదబంధపు సూచితార్థం
  choice: ప్రవక్తల సాక్ష్యానికి క్రియాశీల మూలమైన దేవుని ఆత్మ
  alternative: దేవుని స్వభావం లేదా ఊపిరి
  rationale: ‘నీ ఆత్మచేత, నీ ప్రవక్తల ద్వారా’ అనే కలయిక ప్రవచన వాక్యానికి దైవిక కార్యసాధకత్వాన్ని సూచిస్తుంది; తరువాతి సిద్ధాంత వివరాలను వాక్యంలోకి చేర్చలేదు.
- issue: וַתָּעַד בָּם లో హెచ్చరిక మరియు ప్రతికూల సాక్ష్యం మధ్య భావవ్యాప్తి
  choice: వారికి వ్యతిరేకంగా సాక్ష్యమిచ్చావు
  alternative: వారిని హెచ్చరించావు
  rationale: మూల క్రియలోని నిబంధనాత్మక/న్యాయపరమైన బలాన్ని ప్రధాన పాఠ్యంలో ఉంచి, సందర్భానుకూల హెచ్చరిక భావాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైన ప్రార్థనా శైలిని నిలుపుతూ సాధారణ పాఠకులకు అర్థమయ్యే పదప్రయోగం. ‘నీ ఆత్మచేత’ మరియు ‘ప్రవక్తల ద్వారా’ అనే సాధనార్థక తేడాను కాపాడాం; కారణ-ఫల సంబంధానికి ‘కాబట్టి’ వాడాం.
