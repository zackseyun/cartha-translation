  text: וַ/יָּק֨וּמוּ֙ עַל עָמְדָ֔/ם וַֽ/יִּקְרְא֗וּ בְּ/סֵ֨פֶר תּוֹרַ֧ת יְהוָ֛ה אֱלֹהֵי/הֶ֖ם רְבִעִ֣ית הַ/יּ֑וֹם וּ/רְבִעִית֙ מִתְוַדִּ֣ים וּ/מִֽשְׁתַּחֲוִ֔ים לַ/יהוָ֖ה אֱלֹהֵי/הֶֽם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/003.yaml
  text: And they stood in their place[a], and they read from the Book of the Law of Yahweh their God for a fourth of the day[b]; and for another fourth they were confessing and bowing down to Yahweh their God.
translation:
  language: te
  text: వారు తమ స్థానాల్లో నిలబడ్డారు[a]; తమ దేవుడైన యాహ్వే ధర్మశాస్త్ర గ్రంథం నుండి రోజులో నాలుగో వంతుసేపు చదివారు[b]. మరో నాలుగో వంతుసేపు వారు పాపస్వీకారం చేస్తూ, తమ దేవుడైన యాహ్వేకు సాష్టాంగపడుతూ ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తాము నిలబడిన చోట”; బహుశా “తమ వేదికపై.” హెబ్రీ ప్రయోగం సంక్షిప్తంగా ఉంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “రోజులో నాలుగో వంతు … మరో నాలుగో వంతు.” అంటే రోజులో ఒక పావుభాగం చదవడంలో, మరో పావుభాగం పాపస్వీకారం చేయడంలో మరియు సాష్టాంగపడడంలో గడిచింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּק֨וּמוּ עַל עָמְדָם
  choice: వారు తమ తమ స్థానాల్లో నిలబడి
  rationale: קום యొక్క కథన రూపం నిలబడడాన్ని సూచిస్తుంది; עַל עָמְדָם సంక్షిప్తమైన హెబ్రీ ప్రయోగం. సందర్భంలో ప్రతి ఒక్కరూ తమకు నిర్దేశించబడిన చోట నిలిచారనే భావాన్ని సహజమైన తెలుగులో ఇస్తుంది; వేదిక అని నిర్దిష్టంగా చెప్పదు.
- source_word: וַיִּקְרְאוּ בְּסֵפֶר תּוֹרַת
  choice: ధర్మశాస్త్ర గ్రంథం నుండి ... చదివారు
  rationale: ספר తో కూడిన קרא ఇక్కడ లిఖిత గ్రంథం నుండి చదవడాన్ని సూచిస్తుంది. 'గ్రంథం నుండి' అనే రూపం తెలుగు వాక్యనిర్మాణంలో సహజంగా ఉంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించదగిన వ్యక్తినామ రూపమైన 'యెహోవా'గా లిప్యంతరీకరించాం.
- source_word: רְבִעִית הַיּוֹם ... וּרְבִעִית
  choice: రోజులో నాలుగో వంతుసేపు ... మరొక నాలుగో వంతుసేపు
  rationale: మొదటి పదబంధం రోజులో ఒక నాలుగో భాగాన్ని సూచిస్తుంది; రెండవది అదే కాలవ్యవధిని సంక్షిప్తంగా పునరుక్తి చేస్తుంది. 'మరొక' దాని సమాంతర భావాన్ని సహజంగా స్పష్టం చేస్తుంది.
- source_word: מִתְוַדִּים
  choice: తమ పాపాలను ఒప్పుకుంటూ
  rationale: హిత్పయేల్ కృదంతం కొనసాగుతున్న ఒప్పుకోలును సూచిస్తుంది. సందర్భంలో ఒప్పుకుంటున్నది పాపాలనే భావం ఉన్నందున తెలుగులో అవసరమైన కర్మను స్పష్టం చేశాం.
- source_word: וּמִשְׁתַּחֲוִים
  choice: సాష్టాంగపడుతూ
  rationale: שׁחה యొక్క ఈ రూపం ఆరాధనలో శరీరాన్ని వంచి నేలకు సాగిలపడే చర్యను సూచిస్తుంది. 'సాష్టాంగపడుతూ' భౌతిక చర్యను నిలుపుతూ ఆరాధనా సందర్భానికి సరిపోతుంది.
theological_decisions:
- issue: יְהוָה దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు; యాహ్వే
  rationale: మూలంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దానిని బిరుదైన 'ప్రభువు'తో మార్చకుండా తెలుగులో సుపరిచితమైన లిప్యంతరీకరణను వాడాం; ఖచ్చితమైన ప్రాచీన ఉచ్చారణపై అనిశ్చితి ఉంది.
- issue: מִשְׁתַּחֲוִיםను సాధారణ 'ఆరాధిస్తూ'గా చేయాలా, శారీరక చర్యగా ఉంచాలా
  choice: సాష్టాంగపడుతూ
  alternative: ఆరాధిస్తూ; సాగిలపడుతూ
  rationale: మూల క్రియలో శారీరకంగా వంగి పడే భావం ఉంది. దాన్ని నిలుపుకోవడం వల్ల ఆరాధన అనే విస్తృత భావంతో మాత్రమే ఆ స్పష్టమైన దృశ్యాన్ని భర్తీ చేయడం జరగదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలిని వాడాం. 'ధర్మశాస్త్ర గ్రంథం', 'సాష్టాంగపడుతూ' వంటి పదాలు బైబిలు సందర్భానికి తగిన గంభీరతను ఇస్తాయి; వాక్యాన్ని సాధారణ పాఠకుడు సులభంగా గ్రహించేలా రెండు వాక్యాలుగా విభజించాం.
