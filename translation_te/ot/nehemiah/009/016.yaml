id: NEH.9.16
reference: Nehemiah 9:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הֵ֥ם וַ/אֲבֹתֵ֖י/נוּ הֵזִ֑ידוּ וַ/יַּקְשׁוּ֙ אֶת עָרְפָּ֔/ם וְ/לֹ֥א שָׁמְע֖וּ אֶל מִצְוֺתֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/016.yaml
  text: But they[a], our fathers, acted presumptuously and stiffened their neck[c][b], and did not listen to your commandments.
translation:
  language: te
  text: కాని వారు—మా పితరులు—అహంకారంతో ప్రవర్తించి[a], తమ మెడను కఠినపరచుకొని[b], నీ ఆజ్ఞలను ఆలకించలేదు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘దురహంకారంతో ప్రవర్తించి’ లేదా ‘తెగించి ప్రవర్తించి.’
    reason: lexical_alternative
  - marker: b
    text: ‘తమ మెడను కఠినపరచుకొని’ అనేది మొండిగా మారి తిరుగుబాటు చేశారనే అర్థమిచ్చే హీబ్రూ నుడికారం.
    reason: cultural_note
  - marker: c
    text: లేదా ‘పట్టించుకోలేదు’ లేదా ‘పాటించలేదు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵם וַאֲבֹתֵינוּ
  choice: కాని వారు, అంటే మా పితరులు
  rationale: ముందు వివరించిన దేవుని కృపాకార్యాలకు విరుద్ధంగా వారి ప్రవర్తనను చూపేందుకు וְ ను సందర్భానుసారంగా ‘కాని’ అని అనువదించాం. స్వతంత్ర సర్వనామం తరువాత వచ్చే ‘మా పితరులు’ ఎవరిని సూచిస్తుందో సహజమైన తెలుగులో స్పష్టం చేశాం.
- source_word: הֵזִידוּ
  choice: అహంకారంతో ప్రవర్తించి
  rationale: זיד క్రియలో గర్వం, దురహంకారం, తెగింపు కలిగిన ప్రవర్తన అనే భావం ఉంది. ‘అహంకారంతో ప్రవర్తించి’ అనేది స్థితిని మాత్రమే కాక ఉద్దేశపూర్వక ప్రవర్తనను కూడా తెలియజేస్తుంది.
- source_word: וַיַּקְשׁוּ אֶת־עָרְפָּם
  choice: తమ మెడను బిగించుకున్నారు
  rationale: మొండితనంతో తిరుగుబాటు చేయడాన్ని సూచించే హీబ్రూ రూపకాన్ని ప్రధాన పాఠ్యంలో నిలిపాం. తెలుగు పాఠకునికి భావం స్పష్టమయ్యేలా పాదసూచిక ఇచ్చాం.
- source_word: וְלֹא שָׁמְעוּ אֶל
  choice: ఆలకించలేదు
  rationale: שמע אל యొక్క ప్రాథమిక ‘వినడం/పట్టించుకోవడం’ భావాన్ని నిలుపుతూ, ఆజ్ఞల సందర్భంలో అవిధేయతను సూచించే గౌరవప్రదమైన సహజ తెలుగు పదాన్ని ఎంచుకున్నాం; నేరుగా ‘పాటించలేదు’ అని అర్థాన్ని పూర్తిగా విప్పలేదు.
- source_word: מִצְוֺתֶיךָ
  choice: నీ ఆజ్ఞలను
  rationale: ద్వితీయ పురుష ఏకవచన సంబోధనను ‘నీ’గా, నిబంధనాత్మక-న్యాయపరమైన מִצְוֺת పదాన్ని ‘ఆజ్ఞలు’గా అనువదించాం.
theological_decisions:
- issue: పూర్వ తరాల పాపంతో సమూహాత్మక ఏకత్వం
  choice: ‘మా పితరులు’ అనే మూలపాఠ్య బంధుత్వ పదాన్ని నిలిపాం
  alternative: ‘మా పూర్వీకులు’
  rationale: ప్రార్థిస్తున్న సమాజం గత తరాలతో తన చారిత్రక, నిబంధనాత్మక అనుబంధాన్ని అంగీకరిస్తోంది. ‘మా పితరులు’ మూలంలోని אֲבֹתֵינוּ ను సన్నిహితంగా ప్రతిబింబిస్తుంది; అయితే ఇది కేవలం పురుష పూర్వీకులనే పరిమితం చేస్తుందని అదనపు సిద్ధాంతార్థం చేర్చలేదు.
- issue: వినకపోవడం మరియు అవిధేయత మధ్య భావసంబంధం
  choice: ప్రధాన పాఠ్యంలో ‘ఆలకించలేదు’
  alternative: ‘పాటించలేదు’
  rationale: హీబ్రూ వాక్యం వినడం/పట్టించుకోవడం అనే రూపంలో అవిధేయతను వ్యక్తం చేస్తుంది. ఆ అంతర్లీన ఉద్రిక్తతను నిలిపి, ఫలితార్థమైన ‘పాటించలేదు’ను పాదసూచికలో ప్రత్యామ్నాయంగా ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన ప్రార్థనా శైలిని పాటించాం. హీబ్రూ రూపకాన్ని నిలిపి పాదసూచికలో దాని భావాన్ని వివరించాం. దేవునికి ఏకవచన సన్నిహిత సంబోధనగా ‘నీ’ వాడాం; వాక్య నిర్మాణం సాధారణ పాఠకులకు సహజంగా ఉండేలా చేశాం.
