revisions:
- from: అయితే నీవు, నీ అపారమైన కనికరాలనుబట్టి[a], అరణ్యంలో వారిని విడిచిపెట్టలేదు. పగటివేళ దారిలో వారిని నడిపించడానికి మేఘస్తంభం వారి పైనుండి తొలగిపోలేదు; రాత్రివేళ వారికి వెలుగు ఇవ్వడానికి, వారు వెళ్లవలసిన దారిని చూపడానికి అగ్నిస్తంభం వారిని విడిచిపోలేదు.
  to: అయితే నీవు నీ అపారమైన కనికరాలవల్ల అరణ్యంలో వారిని విడిచిపెట్టలేదు. పగటివేళ దారిలో వారిని నడిపించడానికి మేఘస్తంభం వారి పైనుండి తొలగిపోలేదు; రాత్రివేళ వారికి, వారు వెళ్లవలసిన దారికి వెలుగునివ్వడానికి అగ్నిస్తంభమూ వారి పైనుండి తొలగిపోలేదు.
  rationale: The revision keeps the causal sense of the opening prepositional phrase and its plural mercy language. It restores the fire pillar's stated purpose as giving light to both the people and their way, rather than adding ‘showing,’ and explicitly preserves the shared statement that neither pillar departed from above them.
