id: NEH.9.19
reference: Nehemiah 9:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אַתָּה֙ בְּ/רַחֲמֶ֣י/ךָ הָֽ/רַבִּ֔ים לֹ֥א עֲזַבְתָּ֖/ם בַּ/מִּדְבָּ֑ר אֶת עַמּ֣וּד הֶ֠/עָנָן לֹא סָ֨ר מֵ/עֲלֵי/הֶ֤ם בְּ/יוֹמָם֙ לְ/הַנְחֹתָ֣/ם בְּ/הַ/דֶּ֔רֶךְ וְ/אֶת עַמּ֨וּד הָ/אֵ֤שׁ בְּ/לַ֨יְלָה֙ לְ/הָאִ֣יר לָ/הֶ֔ם וְ/אֶת הַ/דֶּ֖רֶךְ אֲשֶׁ֥ר יֵֽלְכוּ בָֽ/הּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/019.yaml
  text: But you[a], in your abundant mercies, did not abandon them in the wilderness. The pillar of cloud did not depart from above them by day, to lead them on the way, nor the pillar of fire by night, to give them light and the way in which they should go.
translation:
  language: te
  text: అయితే నీవు నీ అపారమైన కనికరాలవల్ల అరణ్యంలో వారిని విడిచిపెట్టలేదు. పగటివేళ దారిలో వారిని నడిపించడానికి మేఘస్తంభం వారి పైనుండి తొలగిపోలేదు; రాత్రివేళ వారికి, వారు వెళ్లవలసిన దారికి వెలుగునివ్వడానికి అగ్నిస్తంభమూ వారి పైనుండి తొలగిపోలేదు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּרַחֲמֶיךָ הָרַבִּים
  choice: నీ అపారమైన కనికరాలనుబట్టి
  rationale: רַחֲמִים అనే బహువచన రూపాన్ని ‘కనికరాలు’గా నిలుపుతూ, הָרַבִּים సూచించే విస్తారతను ‘అపారమైన’తో సహజంగా వ్యక్తం చేస్తుంది; בְּ ఇక్కడ కారణార్థకంగా గ్రహించబడింది.
- source_word: עֲזַבְתָּם
  choice: వారిని విడిచిపెట్టలేదు
  rationale: עזב యొక్క ‘వదలివేయడం/పరిత్యజించడం’ భావాన్ని ఆధునిక, సహజ తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: בַּמִּדְבָּר
  choice: అరణ్యంలో
  rationale: ఇశ్రాయేలీయుల సంచార నేపథ్యానికి సరిపోయే విస్తృతమైన ‘wilderness’ భావాన్ని ఇస్తుంది.
- source_word: עַמּוּד הֶעָנָן
  choice: మేఘస్తంభం
  rationale: నిర్గమకాండ నేపథ్యంతో అనుసంధానమయ్యే, తెలుగులో స్థిరంగా అర్థమయ్యే సంక్షిప్త నిర్మాణం.
- source_word: לֹא סָר מֵעֲלֵיהֶם
  choice: వారి పైనుండి తొలగిపోలేదు
  rationale: סור యొక్క తొలగిపోవడం అనే భావాన్నీ, מֵעֲלֵיהֶם లోని స్థలసూచననూ నిలుపుతుంది.
- source_word: לְהַנְחֹתָם בְּהַדֶּרֶךְ
  choice: దారిలో వారిని నడిపించడానికి
  rationale: Hiphil נחה యొక్క నడిపించడం/మార్గదర్శనం చేయడం అనే భావాన్ని, בְּ యొక్క స్థలార్థంతో సహజ తెలుగులో అందిస్తుంది.
- source_word: עַמּוּד הָאֵשׁ
  choice: అగ్నిస్తంభం
  rationale: ‘మేఘస్తంభం’తో సమాంతరతను కాపాడే ప్రామాణిక, పారదర్శక పదం.
- source_word: לְהָאִיר לָהֶם
  choice: వారికి వెలుగు ఇవ్వడానికి
  rationale: Hiphil אור యొక్క ‘వెలుగు కలిగించడం’ అనే భావాన్ని నేరుగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וְאֶת הַדֶּרֶךְ אֲשֶׁר יֵלְכוּ בָהּ
  choice: వారు వెళ్లవలసిన దారిని చూపడానికి
  rationale: ‘దారి’ ముందు ఉన్న ప్రత్యక్ష కర్మ సూచికను గౌరవిస్తూ, తెలుగులో అసహజమైన ‘వారికీ దారికీ వెలుగు ఇవ్వడం’ను నివారించడానికి మార్గాన్ని కనిపించేలా చేయడం అనే అంతర్భావాన్ని ‘చూపడానికి’తో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: దైవిక కనికరానికి బహువచన ప్రయోగం
  choice: ‘కనికరాలు’ అనే బహువచనాన్ని నిలిపింది
  alternative: ‘గొప్ప కనికరాన్ని బట్టి’ అనే ఏకవచనం
  rationale: హీబ్రూ רַחֲמִים బహువచనాన్ని అనవసరంగా ఏకవచనంగా మార్చకుండా, దేవుని అనేక కనికర కార్యాల సమృద్ధిని ప్రతిబింబిస్తుంది.
- issue: అగ్నిస్తంభం వెలుగు మరియు దారి మధ్య వాక్యనిర్మాణ సంబంధం
  choice: వారికి వెలుగు ఇవ్వడం, వారు వెళ్లవలసిన దారిని చూపడం అనే సమాంతర ప్రయోజనాలుగా అనువదించింది
  alternative: ‘వారు వెళ్లవలసిన దారిలో వారికి వెలుగు ఇవ్వడానికి’
  rationale: וְאֶת הַדֶּרֶךְ లోని ప్రత్యక్ష కర్మ నిర్మాణాన్ని పూర్తిగా స్థానార్థకంగా కుదించకుండా నిలుపుతూ, తెలుగులో స్పష్టత కోసం అంతర్భూత కార్యాన్ని ‘చూపడానికి’గా తెలిపింది; కొత్త సిద్ధాంతార్థాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన, సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ‘అరణ్యం,’ ‘మేఘస్తంభం,’ ‘అగ్నిస్తంభం’ వంటి బైబిలు నేపథ్య పదాలను నిలిపి, అనవసరమైన ప్రాచీన క్రియారూపాలను నివారించింది.
