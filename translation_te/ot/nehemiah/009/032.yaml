source:
  edition: WLC
  text: וְ/עַתָּ֣ה אֱ֠לֹהֵי/נוּ הָ/אֵ֨ל הַ/גָּד֜וֹל הַ/גִּבּ֣וֹר וְ/הַ/נּוֹרָא֮ שׁוֹמֵ֣ר הַ/בְּרִ֣ית וְ/הַ/חֶסֶד֒ אַל יִמְעַ֣ט לְ/פָנֶ֡י/ךָ אֵ֣ת כָּל הַ/תְּלָאָ֣ה אֲֽשֶׁר מְ֠צָאַתְ/נוּ לִ/מְלָכֵ֨י/נוּ לְ/שָׂרֵ֧י/נוּ וּ/לְ/כֹהֲנֵ֛י/נוּ וְ/לִ/נְבִיאֵ֥/נוּ וְ/לַ/אֲבֹתֵ֖י/נוּ וּ/לְ/כָל עַמֶּ֑/ךָ מִ/ימֵי֙ מַלְכֵ֣י אַשּׁ֔וּר עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/032.yaml
  text: 'And now[a], our God—the great, mighty, and fearsome God, who keeps the covenant and steadfast love—do not let all the hardship that has come upon us seem small before you: upon our kings, our officials, our priests, our prophets, our fathers[b], and all your people, from the days of the kings of Assyria until this day.'
translation:
  language: te
  text: ఇప్పుడు, మా దేవా—గొప్పవాడవు, పరాక్రమశాలివి, భయభక్తిని కలిగించేవాడవు[a], నిబంధనను, నిలకడైన ప్రేమను కాపాడేవాడవు—అష్షూరు రాజుల కాలం మొదలుకొని ఈ రోజు వరకు మాపై, మా రాజులపై, మా అధికారులపై, మా యాజకులపై, మా ప్రవక్తలపై, మా పితరులపై[b], నీ ప్రజలందరిపై వచ్చిన కష్టమంతా నీ దృష్టికి అల్పంగా కనిపించనివ్వకు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘భయాన్ని పుట్టించేవాడవు.’ హెబ్రీ పదం దేవుడు భక్తిపూర్వక భయాన్ని కలిగిస్తాడనే భావాన్ని తెలియజేస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘మా పూర్వీకులపై.’ హెబ్రీ పదం పుంలింగంలో ఉండి, ప్రజల పూర్వపితరులను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֵל
  choice: దేవా
  rationale: אֱלֹהֵינוּ తరువాత సమానాధికరణంగా వచ్చిన אֵלను తెలుగులో అసహజంగా రెండుసార్లు ‘దేవుడు’ అని పునరుక్తి చేయకుండా, దైవబిరుదులన్నిటినీ ‘మా దేవా’ అనే సంబోధనతో అనుసంధానించాం.
- source_word: הַגָּדוֹל הַגִּבּוֹר וְהַנּוֹרָא
  choice: గొప్పవాడవూ, పరాక్రమశాలివీ, భయభక్తులు కలిగించేవాడవూ
  rationale: దైవ మహత్వం, శక్తి, భక్తిపూర్వక భయం కలిగించే స్వభావం అనే మూడు బిరుదుల భావాన్ని ఆధునిక, గౌరవప్రదమైన తెలుగులో నిలిపాం.
- source_word: שׁוֹמֵר הַבְּרִית וְהַחֶסֶד
  choice: నిబంధనను, నిలకడైన ప్రేమను కాపాడేవాడవూ
  rationale: שׁמר యొక్క నిరంతర నిబద్ధతను ‘కాపాడేవాడు’ తెలియజేస్తుంది; חסדలోని ఒడంబడికపరమైన విశ్వసనీయ ప్రేమను ‘నిలకడైన ప్రేమ’గా ఇచ్చాం.
- source_word: אַל יִמְעַט לְפָנֶיךָ
  choice: నీ దృష్టికి అల్పంగా కనిపించనివ్వకు
  rationale: కష్టాన్ని దేవుడు స్వల్పమైనదిగా ఎంచకూడదనే హెబ్రీ సంబంధబద్ధమైన నుడికారాన్ని సహజమైన తెలుగులో, ‘నీ ముందు’ అనే భావాన్ని ‘నీ దృష్టికి’గా నిలిపాం.
- source_word: כָּל הַתְּלָאָה
  choice: కష్టమంతా
  rationale: תְּלָאָה సూచించే సమష్టిగత శ్రమ, బాధ, విపత్తును సంక్షిప్తంగా మరియు విస్తృతార్థంతో ‘కష్టం’ తెలియజేస్తుంది.
- source_word: אֲשֶׁר מְצָאַתְנוּ
  choice: మాపై ... వచ్చిన
  rationale: అక్షరార్థంగా ‘మమ్మల్ని కనుగొన్న’ అనే హెబ్రీ నుడికారం విపత్తు ఎదురవడాన్ని సూచిస్తుంది; తెలుగులో ‘మాపై వచ్చిన’ సహజంగా అదే భావాన్ని ఇస్తుంది.
- source_word: לִמְלָכֵינוּ לְשָׂרֵינוּ וּלְכֹהֲנֵינוּ וְלִנְבִיאֵינוּ וְלַאֲבֹתֵינוּ
  choice: మా రాజులపై, మా అధికారులపై, మా యాజకులపై, మా ప్రవక్తలపై, మా పితరులపై
  rationale: לְ ఉపసర్గ ఇక్కడ కష్టానికి గురైన వారిని గుర్తిస్తుంది కాబట్టి ‘పై’ని ప్రతి అంశంతో పునరావృతం చేశాం. שׂריםను ఆధునిక సందర్భంలో స్పష్టమైన ‘అధికారులు’గా, אבותינוను మూలంలోని పుంలింగ చారిత్రక సూచనను నిలుపుతూ ‘పితరులు’గా అనువదించాం.
- source_word: וּלְכָל עַמֶּךָ
  choice: నీ ప్రజలందరిపై
  rationale: నాయకుల నుంచి నిబంధన సమాజమంతటికీ జాబితా విస్తరించడాన్ని స్పష్టంగా నిలిపాం.
- source_word: מִימֵי מַלְכֵי אַשּׁוּר עַד הַיּוֹם הַזֶּה
  choice: అష్షూరు రాజుల కాలం మొదలుకొని ఈ రోజు వరకు
  rationale: బాధ కొనసాగిన చారిత్రక కాలవ్యవధి ఆరంభం, ముగింపులను తెలుగులో సహజమైన కాలప్రయోగంతో తెలిపాం.
theological_decisions:
- issue: נוֹרָא అనే దైవబిరుదులోని భయం మరియు భక్తి
  choice: భయభక్తులు కలిగించేవాడవు
  alternative: భయాన్ని పుట్టించేవాడవు; భయంకరుడవు
  rationale: ఈ పదం కేవలం భీతికరతను కాక దేవుని మహిమ ఎదుట కలిగే భక్తిపూర్వక భయాన్ని కూడా సూచిస్తుంది. ప్రధాన పాఠం ఆ రెండు కోణాలను కలిపి ఉంచుతుంది; ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
- issue: חֶסֶד యొక్క నిబంధనపరమైన భావం
  choice: నిలకడైన ప్రేమ
  alternative: కరుణ; విశ్వసనీయ ప్రేమ
  rationale: ప్రేమతో కూడిన విశ్వసనీయ నిబద్ధత అనే భావాన్ని కేవలం ‘కరుణ’కు పరిమితం చేయకుండా, నిబంధన సందర్భంలోని దాని బరువును నిలిపాం.
- issue: אֲבֹתֵינוּ యొక్క పుంలింగ చారిత్రక సూచన
  choice: మా పితరులు
  alternative: మా పూర్వీకులు
  rationale: మూలంలోని పుంలింగ రూపాన్ని, ఇశ్రాయేలు చరిత్రలోని పూర్వపితరుల సూచనను ప్రధాన పాఠంలో నిలిపి, సమగ్ర వంశపారంపర్య అర్థం కోసం ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో ప్రార్థనకు తగిన గౌరవప్రదమైన ప్రత్యక్ష సంబోధనను వాడాం. పొడవైన హెబ్రీ వాక్య నిర్మాణాన్ని డాష్‌లతో స్పష్టపరుస్తూ, బాధకు గురైన ప్రతి వర్గంపై ‘పై’ని పునరావృతం చేసి సాధారణ పాఠకులకు జాబితా సంబంధాన్ని స్పష్టంగా చేశాం.
