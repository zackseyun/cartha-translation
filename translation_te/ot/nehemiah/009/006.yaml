source:
  edition: WLC
  text: אַתָּה ה֣וּא יְהוָה֮ לְ/בַדֶּ/ךָ֒ את עָשִׂ֡יתָ אֶֽת הַ/שָּׁמַיִם֩ שְׁמֵ֨י הַ/שָּׁמַ֜יִם וְ/כָל צְבָאָ֗/ם הָ/אָ֜רֶץ וְ/כָל אֲשֶׁ֤ר עָלֶ֨י/הָ֙ הַ/יַּמִּים֙ וְ/כָל אֲשֶׁ֣ר בָּ/הֶ֔ם וְ/אַתָּ֖ה מְחַיֶּ֣ה אֶת כֻּלָּ֑/ם וּ/צְבָ֥א הַ/שָּׁמַ֖יִם לְ/ךָ֥ מִשְׁתַּחֲוִֽים־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/006.yaml
  text: You alone are Yahweh[a]. You made the heavens, the highest heavens and all their host, the earth and all that is on it, the seas and all that is in them; and you preserve all of them alive[c][b], and the host of heaven bows down to you.
translation:
  language: te
  text: నీవు మాత్రమే యాహ్వేవు. ఆకాశాలను, ఆకాశాలకంటె ఉన్నతమైన ఆకాశాలను[a], వాటి సమస్త సైన్యాన్ని, భూమిని, దానిపై ఉన్న సమస్తాన్ని, సముద్రాలను, వాటిలో ఉన్న సమస్తాన్ని నీవే చేశావు. వాటన్నిటినీ నీవే సజీవంగా ఉంచుతున్నావు[b]; ఆకాశ సైన్యం[c] నీకు సాష్టాంగంగా నమస్కరిస్తుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘ఆకాశాల ఆకాశాలు’; అత్యున్నత ఆకాశాలు అనే అర్థం.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘వాటన్నిటికీ నీవే జీవం ఇస్తున్నావు.’
    reason: alternative_reading
  - marker: c
    text: ‘ఆకాశ సైన్యం’ నక్షత్ర సమూహాన్ని లేదా పరలోక జీవుల సమూహాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తింపుపొందిన ‘యెహోవా’ రూపంలో ఉంచింది.
- source_word: אַתָּה הוּא ... לְבַדֶּךָ
  choice: నీవే యెహోవా; నీవు మాత్రమే దేవుడవు
  rationale: హీబ్రూ నిర్మాణంలోని వ్యక్తిగత ఉద్ఘాటనను, ప్రత్యేకత్వాన్ని సహజమైన తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది; ‘దేవుడవు’ అనేది సందర్భార్థాన్ని తెలుపుతుంది.
- source_word: עָשִׂיתָ
  choice: చేశావు
  rationale: ఇక్కడ עשה విశ్వాన్ని చేయడాన్ని సూచిస్తుంది. మూలంలో ఉన్న సాధారణ క్రియను ‘సృష్టించావు’ అనే మరింత నిర్దిష్ట క్రియగా మార్చకుండా ‘చేశావు’ అని అనువదించింది.
- source_word: הַשָּׁמַיִם
  choice: ఆకాశాలను
  rationale: విశ్వ సంబంధ సందర్భంలో హీబ్రూ బహువచనాన్ని సహజమైన తెలుగు బహువచనంతో ప్రతిబింబిస్తుంది.
- source_word: שְׁמֵי הַשָּׁמַיִם
  choice: మహోన్నత ఆకాశాలను
  rationale: అక్షరార్థంగా ‘ఆకాశాల ఆకాశాలు’ అనే హీబ్రూ అత్యున్నతార్థక నుడికారాన్ని ఆధునిక తెలుగులో సహజంగా అందిస్తుంది.
- source_word: צְבָאָם
  choice: వాటి సమస్త సైన్యాన్ని
  rationale: నక్షత్రాలు లేదా దేవదూతలు అని అనవసరంగా పరిమితం చేయకుండా, צבא పదంలోని విస్తృతమైన ‘సైన్యం/సమూహం’ భావాన్ని నిలుపుతుంది.
- source_word: הָאָרֶץ וְכָל אֲשֶׁר עָלֶיהָ
  choice: భూమిని, దానిపై ఉన్న సమస్తాన్ని
  rationale: సృష్టి జాబితాలో אֶרֶץ మొత్తం భూమిని సూచిస్తుంది; తెలుగు వాక్యనిర్మాణం మూలంలోని సమగ్రతను నిలుపుతుంది.
- source_word: הַיַּמִּים וְכָל אֲשֶׁר בָּהֶם
  choice: సముద్రాలను, వాటిలో ఉన్న సమస్తాన్ని
  rationale: ఆకాశాలు, భూమి, సముద్రాలు అనే త్రిభాగ సృష్టి జాబితాను నేరుగా, సహజంగా అందిస్తుంది.
- source_word: מְחַיֶּה
  choice: జీవం ఇస్తూ ఉన్నావు
  rationale: పియేల్ కృదంతం జీవం ఇవ్వడం లేదా జీవంతో నిలిపి ఉంచడం రెండింటినీ సూచించగలదు. నిరంతర కార్యాన్ని ‘ఇస్తూ ఉన్నావు’ తెలియజేస్తుంది; ప్రత్యామ్నాయ భావాన్ని పాదటిప్పణి కాపాడుతుంది.
- source_word: אֶת כֻּלָּם
  choice: వాటన్నిటికీ
  rationale: ఇప్పుడే పేర్కొన్న సృష్టి సమస్తాన్ని సమగ్రంగా సూచిస్తుంది.
- source_word: וּצְבָא הַשָּׁמַיִם
  choice: ఆకాశ సైన్యం
  rationale: ఖగోళ వస్తువులు మరియు/లేదా పరలోక జీవులు అనే సాధ్యమైన విస్తృతిని ‘సైన్యం’ నిలుపుతుంది.
- source_word: מִשְׁתַּחֲוִים
  choice: సాష్టాంగ నమస్కారం చేస్తోంది
  rationale: హిత్పయేల్ రూపంలోని వంగి ఆరాధించే భావాన్ని గౌరవప్రదమైన, సాధారణ తెలుగు ప్రయోగంతో అందిస్తుంది.
theological_decisions:
- issue: యెహోవా యొక్క ఏకైకత్వం
  choice: నీవే యెహోవా; నీవు మాత్రమే దేవుడవు
  alternative: నీవు మాత్రమే యెహోవావు
  rationale: אַתָּה הוּא మరియు לְבַדֶּךָ కలిగించే ఉద్ఘాటనను స్పష్టంగా చూపుతుంది. సందర్భం దేవుని ఏకైకత్వాన్ని ప్రకటిస్తున్నందున ‘దేవుడవు’ భావాన్ని వెలిబుచ్చుతుంది, అయితే దైవనామాన్ని యథాతథంగా ఉంచుతుంది.
- issue: מְחַיֶּהలో సృష్టిపట్ల దేవుని నిరంతర కార్యం
  choice: వాటన్నిటికీ నీవే జీవం ఇస్తూ ఉన్నావు
  alternative: వాటన్నిటినీ నీవే సజీవంగా నిలిపి ఉంచుతున్నావు
  rationale: ఈ క్రియ జీవం ఇవ్వడం మరియు జీవంతో నిలిపి ఉంచడం రెండింటినీ అనుమతిస్తుంది. ప్రధాన పాఠం నిరంతర జీవదానాన్ని చూపగా, పాదటిప్పణి పోషణాత్మక భావాన్ని భద్రపరుస్తుంది.
- issue: ఆకాశ సైన్యం యొక్క గుర్తింపు
  choice: ఆకాశ సైన్యం
  alternative: పరలోక సైన్యం
  rationale: ఈ పదబంధం నక్షత్ర సమూహాన్ని లేదా పరలోక జీవుల సమూహాన్ని సూచించవచ్చు. ప్రధాన పాఠం దానిని ఒకదానికే పరిమితం చేయకుండా మూలంలోని సందిగ్ధతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ఆరాధనా శైలిని ఉపయోగించింది. ‘సమస్తం,’ ‘మహోన్నతం,’ ‘సాష్టాంగ నమస్కారం’ వంటి పదాలు గంభీరతను నిలుపుతూనే సాధారణ పాఠకులకు అర్థమయ్యేలా ఉన్నాయి. ప్రతి పాదటిప్పణి గుర్తు ప్రధాన పాఠంలో సంబంధిత స్థానంలో ఉంచబడింది.
