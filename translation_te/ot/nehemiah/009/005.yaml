- from: 'అప్పుడు లేవీయులైన యేషూవ, కద్మీయేలు, బానీ, హషబ్నెయా, షేరెబ్యా, హోదీయా, షెబన్యా, పెతహ్యా ఇలా అన్నారు: “లేచి, నిత్యం నుండి నిత్యం వరకు మీ దేవుడైన యహ్వేను స్తుతించండి. వారు నీ మహిమాన్విత నామాన్ని స్తుతించాలి[a]; అది సకల స్తుతికీ కీర్తికీ మించి ఉన్నది.”[b]


