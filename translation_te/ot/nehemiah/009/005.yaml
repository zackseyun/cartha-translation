source:
  edition: WLC
  text: וַ/יֹּאמְר֣וּ הַ/לְוִיִּ֡ם יֵשׁ֣וּעַ וְ֠/קַדְמִיאֵל בָּנִ֨י חֲשַׁבְנְיָ֜ה שֵׁרֵֽבְיָ֤ה הֽוֹדִיָּה֙ שְׁבַנְיָ֣ה פְתַֽחְיָ֔ה ק֗וּמוּ בָּרֲכוּ֙ אֶת יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם מִן הָ/עוֹלָ֖ם עַד הָ/עוֹלָ֑ם וִ/יבָֽרְכוּ֙ שֵׁ֣ם כְּבוֹדֶ֔/ךָ וּ/מְרוֹמַ֥ם עַל כָּל בְּרָכָ֖ה וּ/תְהִלָּֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/005.yaml
  text: Then the Levites—Jeshua[a], Kadmiel, Bani, Hashabneiah, Sherebiah, Hodiah, Shebaniah, and Pethahiah—said, “Stand up; bless Yahweh your God from everlasting to everlasting. Blessed be your glorious name[b], which is exalted above all blessing and praise.”
translation:
  language: te
  text: 'అప్పుడు లేవీయులైన యేషూవ, కద్మీయేలు, బానీ, హషబ్నెయా, షేరెబ్యా, హోదీయా, షెబన్యా, పెతహ్యా ఇలా అన్నారు: “లేవండి; యుగయుగాల నుంచి యుగయుగాల వరకు మీ దేవుడైన యహ్వేను స్తుతించండి. నీ మహిమాన్విత నామాన్ని[b] వారు స్తుతించుగాక[a]; అది ప్రతి దీవెనకూ స్తుతికీ మించి ఉన్నది.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీ మహిమాన్విత నామం స్తుతింపబడుగాక.” హీబ్రూ క్రియ వ్యాకరణరీత్యా మూడవ పురుష బహువచనంలో ఉండి, కోరిక లేదా ప్రోత్సాహ భావాన్ని తెలియజేస్తుంది.
    reason: alternative_reading
  - marker: b
    text: “నీ మహిమాన్విత నామం” అనే మాటకు అక్షరార్థం “నీ మహిమ యొక్క నామం.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ הַלְוִיִּם
  choice: అప్పుడు లేవీయులైన ... ఇలా అన్నారు
  rationale: వావ్-కన్సిక్యూటివ్ కథన క్రమాన్ని ముందుకు నడిపిస్తుంది; ఆధునిక తెలుగులో ‘అప్పుడు’ సహజంగా ఆ క్రమాన్ని తెలియజేస్తుంది.
- source_word: קוּמוּ
  choice: లేచి
  rationale: సమాజాన్ని ఉద్దేశించిన బహువచన ఆజ్ఞను సహజమైన తెలుగు రూపంలో వ్యక్తం చేస్తుంది.
- source_word: בָּרֲכוּ
  choice: స్తుతించండి
  rationale: దేవుణ్ణి ‘ఆశీర్వదించండి’ అనే అక్షరానువాదం ఆధునిక తెలుగులో అపార్థం కలిగించవచ్చు; ఇక్కడ దేవుని ఘనపరచి స్తుతించడమే భావం.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: హీబ్రూ చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా పేరుగా లిప్యంతరీకరించింది.
- source_word: מִן הָעוֹלָם עַד הָעוֹלָם
  choice: నిత్యం నుండి నిత్యం వరకు
  rationale: అపరిమిత కాలవ్యాప్తిని తెలిపే హీబ్రూ ప్రయోగాన్ని గంభీరమైన, అర్థవంతమైన తెలుగులో నిలుపుతుంది.
- source_word: שֵׁם כְּבוֹדֶךָ
  choice: నీ మహిమాన్విత నామం
  rationale: ‘నీ మహిమ యొక్క నామం’ అనే నిర్మాణానికి సహజమైన తెలుగు సమానార్థకం; అక్షరార్థాన్ని పాదసూచికలో ఇచ్చింది.
- source_word: עַל כָּל בְּרָכָה וּתְהִלָּה
  choice: సకల స్తుతికీ కీర్తికీ మించి
  rationale: దేవుని నామం మానవులు అర్పించగల ప్రతి స్తుతి, ప్రశంసకు అతీతమని తెలిపే భావాన్ని కాపాడుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో ఉన్న ఒడంబడిక నామాన్ని ప్రత్యక్షంగా నిలుపుతూ, ‘యెహోవా’ అనే తరువాతి మిశ్రిత ఉచ్చారణను నివారిస్తుంది.
- issue: וִיבָרְכוּ యొక్క కర్త మరియు విధ్యర్థక భావం
  choice: వారు ... స్తుతించాలి
  alternative: నీ ... నామం స్తుతింపబడాలి
  rationale: మసొరేటిక్ పాఠంలోని క్రియ మూడవ పురుష బహువచనం; అందువల్ల ప్రధాన పాఠంలో ఆ వ్యాకరణ రూపాన్ని నిలిపి, సంప్రదాయంగా సులభీకరించిన నిష్క్రియార్థ పఠనాన్ని పాదసూచికలో ఇచ్చింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామూహిక ఆరాధనకు తగిన గంభీరతతో రచించబడింది. వ్యక్తినామాలు హీబ్రూ ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించబడ్డాయి; అస్పష్టమైన బహువచన విధ్యర్థక క్రియ ప్రధాన పాఠంలోనే నిలుపబడింది.
