id: NEH.9.31
reference: Nehemiah 9:31
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּֽ/בְ/רַחֲמֶ֧י/ךָ הָ/רַבִּ֛ים לֹֽא עֲשִׂיתָ֥/ם כָּלָ֖ה וְ/לֹ֣א עֲזַבְתָּ֑/ם כִּ֛י אֵֽל חַנּ֥וּן וְ/רַח֖וּם אָֽתָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/031.yaml
  text: But in your abundant mercies you did not make an end of them or abandon them[a], for you are a gracious and compassionate God.
translation:
  language: te
  text: అయితే నీ అపారమైన కనికరాలవల్ల నీవు వారిని పూర్తిగా నాశనం చేయలేదు, వారిని విడిచిపెట్టలేదు; ఎందుకంటే నీవు కృపగల, కనికరముగల దేవుడవు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְרַחֲמֶיךָ הָרַבִּים
  choice: అయితే నీ అపారమైన కనికరంతో
  rationale: ప్రారంభ వావ్ సందర్భంలో వ్యతిరేక భావాన్ని సూచిస్తుంది. רַחֲמִים యొక్క బహువచనాన్ని, הָרַבִּים ఇచ్చే తీవ్రతను సహజమైన ఆధునిక తెలుగులో ‘అపారమైన కనికరం’గా వ్యక్తం చేశాం.
- source_word: לֹא עֲשִׂיתָם כָּלָה
  choice: నీవు వారిని పూర్తిగా నాశనం చేయలేదు
  rationale: עשה כלה అంటే అంతం చేయడం లేదా సమూలంగా నశింపజేయడం. ‘పూర్తిగా నాశనం చేయలేదు’ అనే రూపం సందర్భంలోని తీర్పు భావాన్ని స్పష్టంగా, సహజంగా అందిస్తుంది.
- source_word: וְלֹא עֲזַבְתָּם
  choice: వారిని విడిచిపెట్టలేదు
  rationale: עזב అంటే వదలడం, విడిచిపెట్టడం, పరిత్యజించడం. ‘విడిచిపెట్టలేదు’ సాధారణ ఆధునిక తెలుగులో స్పష్టంగా ఉండి, దేవుడు వారిని పరిత్యజించలేదనే భావాన్ని నిలుపుతుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: తదుపరి మాటలు దేవుని సంయమనానికి కారణాన్ని తెలియజేస్తున్నందున కారణార్థకంగా అనువదించాం.
- source_word: אֵל
  choice: దేవుడు
  rationale: ఇక్కడ אֵל దేవునికి సాధారణ నామం లేదా బిరుదు; ‘బలవంతుడైన దేవుడు’ వంటి అదనపు భావాన్ని చేర్చాల్సిన అవసరం లేదు.
- source_word: חַנּוּן
  choice: కృపగల
  rationale: חַנּוּן దేవుని అనుగ్రహశీల స్వభావాన్ని సూచిస్తుంది. ‘కృపగల’ తరువాతి רַחוּםతో ఉన్న పదభేదాన్ని కాపాడుతుంది.
- source_word: וְרַחוּם
  choice: కనికరంగల
  rationale: רַחוּם లోతైన దయ, కనికరాన్ని సూచిస్తుంది. ‘కనికరంగల’ అనేది సహజంగా ఉండి חַנּוּן నుండి అర్థభేదాన్ని నిలుపుతుంది.
- source_word: אָתָּה
  choice: నీవు ... దేవుడవు
  rationale: హీబ్రూ స్వతంత్ర సర్వనామంలోని ఉద్ఘాటనను తెలుగు వాక్య నిర్మాణంలో సహజంగా నిలిపి, అవసరమైన విధేయ రూపాన్ని జోడించాం.
theological_decisions:
- issue: חַנּוּן וְרַחוּם అనే దైవస్వభావ సూత్రం
  choice: కృపగల, కనికరంగల
  alternative: దయగల, కరుణగల
  rationale: రెండు హీబ్రూ విశేషణాలను ఒకే భావంగా కలిపేయకుండా, అనుగ్రహం మరియు కనికరం మధ్యనున్న పదార్థ భేదాన్ని నిలుపుతుంది; అదనపు సిద్ధాంతార్థాన్ని చేర్చదు.
- issue: ప్రారంభ וּ యొక్క భావం
  choice: 'వ్యతిరేకార్థకం: ‘అయితే’'
  alternative: 'సాధారణ సంధాయకం: ‘మరియు’'
  rationale: ప్రజల తిరుగుబాటుకు విరుద్ధంగా దేవుని అపార కనికరాన్ని ఈ వాక్యం చూపుతున్నందున, సందర్భానుగుణ వ్యతిరేక భావాన్ని ‘అయితే’ స్పష్టంగా తెలియజేస్తుంది.
- issue: עשה כלה అనే వినాశనార్థక ప్రయోగం
  choice: పూర్తిగా నాశనం చేయలేదు
  alternative: వారిని అంతం చేయలేదు
  rationale: ఈ ప్రయోగంలోని సంపూర్ణ వినాశన భావాన్ని స్పష్టం చేస్తూనే, వినాశనం జరిగిన విధానాన్ని అనవసరంగా నిర్దిష్టం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ప్రార్థనా సందర్భానికి తగిన గౌరవప్రదమైన ఏకవచన దైవసంబోధన. ‘కృపగల, కనికరంగల’ అనే జంట మూలంలోని రెండు దైవగుణాల భేదాన్ని కాపాడుతుంది. అనవసర ప్రాచీన లేదా మతశాఖాపరమైన పదజాలాన్ని నివారించాం.
