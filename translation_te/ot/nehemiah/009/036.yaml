id: NEH.9.36
reference: Nehemiah 9:36
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: הִנֵּ֛ה אֲנַ֥חְנוּ הַ/יּ֖וֹם עֲבָדִ֑ים וְ/הָ/אָ֜רֶץ אֲשֶׁר נָתַ֣תָּה לַ/אֲבֹתֵ֗י/נוּ לֶ/אֱכֹ֤ל אֶת פִּרְיָ/הּ֙ וְ/אֶת טוּבָ֔/הּ הִנֵּ֛ה אֲנַ֥חְנוּ עֲבָדִ֖ים עָלֶֽי/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/036.yaml
  text: Look[a], today we are servants; and in the land that you gave to our fathers to eat its fruit and its good things, look[c][b], we are servants on it.
translation:
  language: te
  text: ఇదిగో, నేడు మేము బానిసలం[a]. మా పితరులు దాని ఫలమును, దానిలోని మంచి వాటిని[b] తినడానికి నీవు వారికి ఇచ్చిన దేశంలోనే—ఇదిగో, మేము దానిపై బానిసలం[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సేవకులం.” హీబ్రూ పదం అధీనంలో ఉన్నవారిని సూచిస్తుంది; ఇక్కడ విదేశీ సామ్రాజ్య పాలన కింద యూదా ప్రజల దాస్యస్థితిని ప్రధానంగా నొక్కిచెబుతోంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “దాని సమృద్ధిని.”
    reason: lexical_alternative
  - marker: c
    text: హీబ్రూలో అక్షరార్థంగా, “దానిపై బానిసలం”; అంటే దేవుడు తమ పితరులకు ఇచ్చిన అదే దేశంపై వారు బానిసలుగా ఉన్నారు.
    reason: cultural_note
lexical_decisions:
- source_word: הִנֵּה
  choice: ఇదిగో
  rationale: విలాపంలోని దృష్ట్యాకర్షణను, నొక్కిచెప్పే భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: הַיּוֹם
  choice: నేడు
  rationale: దేవుడు గతంలో ఇచ్చిన దేశానికీ ప్రజల ప్రస్తుత దాస్యస్థితికీ ఉన్న వ్యత్యాసాన్ని స్పష్టంగా చూపుతుంది.
- source_word: עֲבָדִים
  choice: బానిసలం
  rationale: ఇక్కడ సాధారణ సేవకత్వం కంటే విదేశీ సామ్రాజ్యాధీనంలో స్వేచ్ఛ కోల్పోయిన స్థితి ప్రధానంగా ఉంది; అందువల్ల ‘బానిసలం’ సందర్భానికి తగిన బలాన్ని కలిగిస్తుంది.
- source_word: וְהָאָרֶץ
  choice: దేశంలోనే
  rationale: హీబ్రూ వాక్యం సంక్షిప్తంగా ఉన్నా చివరి עָלֶיהָ స్థలార్థాన్ని స్పష్టం చేస్తుంది. ‘లోనే’ వారు తమకు ఇవ్వబడిన అదే దేశంలో బానిసలయ్యారనే వ్యంగ్యవేదనను నొక్కిచెబుతుంది.
- source_word: אֲשֶׁר נָתַתָּה לַאֲבֹתֵינוּ
  choice: మా పితరులు … అనుభవించడానికి నీవు వారికి ఇచ్చిన
  rationale: దేవునితో ప్రత్యక్ష సంబోధనను, పూర్వీకులైన పితరులకు దేశం ఇవ్వబడిన నిబంధనాత్మక నేపథ్యాన్ని నిలుపుతుంది.
- source_word: לֶאֱכֹל
  choice: అనుభవించడానికి
  rationale: అక్షరార్థంగా ‘తినడానికి’; అయితే ఫలంతోపాటు దేశపు మేలంతటినీ పొందడం అనే విస్తృత భావాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: פִּרְיָהּ
  choice: దాని ఫలాన్ని
  rationale: వ్యవసాయ రూపకాన్ని, దేశపు దిగుబడిని సూచించే మూలపదపు ప్రత్యక్ష భావాన్ని నిలుపుతుంది.
- source_word: טוּבָהּ
  choice: దాని మేలును
  rationale: దేశపు మంచితనం, సమృద్ధి అనే విస్తృత భావాన్ని ఒకే రంగానికి పరిమితం చేయకుండా నిలుపుతుంది.
- source_word: עָלֶיהָ
  choice: దానిపై
  rationale: హీబ్రూలోని ‘దానిమీద’ అనే గుర్తించదగిన నిర్మాణాన్ని నిలిపి, దేవుడు ఇచ్చిన అదే దేశంపై వారు బానిసలుగా ఉన్నారనే వేదనాత్మక వ్యత్యాసాన్ని కాపాడుతుంది.
theological_decisions:
- issue: నిబంధనాత్మక విలాప సందర్భంలో עֲבָדִים అనువాదం
  choice: బానిసలం
  alternative: సేవకులం
  rationale: ఈ వచనం వాగ్దాన దేశంలోనే ఇశ్రాయేలు విదేశీ పాలన కింద స్వేచ్ఛ కోల్పోయిన స్థితిని విలపిస్తుంది. ‘బానిసలం’ ఆ రాజకీయ అధీనతను ‘సేవకులం’ కంటే స్పష్టంగా తెలియజేస్తుంది.
- issue: לַאֲבֹתֵינוּ లోని లింగసూచక కుటుంబ పదం
  choice: మా పితరులు
  alternative: మా పూర్వీకులు
  rationale: మూలంలోని పురుషలింగ కుటుంబపదాన్ని యథాతథంగా ప్రతిబింబిస్తూ, నిబంధన చరిత్రలోని పితరుల సూచనను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన ప్రార్థనా-విలాప ధోరణి పాటించబడింది. ‘ఇదిగో’ అనే పునరుక్తి మూలంలోని వాక్పటుత్వాన్ని నిలుపుతుంది; ‘దేశంలోనే’ మరియు ‘దానిపై’ కలిసి హీబ్రూ వాక్యంలోని స్థలార్థాన్నీ వ్యంగ్యవేదననూ స్పష్టం చేస్తాయి.
