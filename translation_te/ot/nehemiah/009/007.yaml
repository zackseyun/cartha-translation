language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אַתָּה הוּא֙ יְהוָ֣ה הָ/אֱלֹהִ֔ים אֲשֶׁ֤ר בָּחַ֨רְתָּ֙ בְּ/אַבְרָ֔ם וְ/הוֹצֵאת֖/וֹ מֵ/א֣וּר כַּשְׂדִּ֑ים וְ/שַׂ֥מְתָּ שְּׁמ֖/וֹ אַבְרָהָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/007.yaml
  text: You are Yahweh God[a], who chose Abram, brought him out from Ur of the Chaldeans, and gave him the name Abraham.
translation:
  language: te
  text: నీవే యాహ్వే దేవుడవు[a]. నీవు అబ్రామును ఎన్నుకొని, అతన్ని కల్దీయుల ఊరు నుండి బయటకు తీసుకొచ్చి, అతనికి అబ్రాహాము అనే పేరు పెట్టావు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీవే దేవుడైన యాహ్వేవు.” హీబ్రూ పాఠంలో YHWH అనే దైవనామం ఉంది.
    reason: హీబ్రూ సమానాధికరణ నిర్మాణానికి సహజమైన మరో తెలుగు పదక్రమాన్ని, అలాగే దైవనామం ఉనికిని తెలియజేయడం.
lexical_decisions:
- source_word: אַתָּה הוּא
  choice: నీవే
  rationale: రెండు సర్వనామాలతో వచ్చిన హీబ్రూ ఉద్ఘాటనను సహజమైన ఆధునిక తెలుగులో ‘నీవే’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన YHWHను బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ లిప్యంతరీకరణను తెలుగులో నిలుపుతుంది.
- source_word: הָאֱלֹהִים
  choice: దేవుడైన
  rationale: యాహ్వే అనే దైవనామంతో సమానాధికరణలో ఉన్న ‘దేవుడు’ అనే గుర్తింపును తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בָּחַרְתָּ בְּאַבְרָם
  choice: అబ్రామును ఎన్నుకొని
  rationale: בחר అనే క్రియకు ఇక్కడ ‘ఎన్నుకొను’ సరళమైన అర్థం; హీబ్రూలోని בְ ఉపసర్గ ఈ నిర్మాణంలో కర్మను సూచిస్తుంది.
- source_word: וְהוֹצֵאתוֹ
  choice: అతన్ని బయటకు రప్పించి
  rationale: יצא హిఫీల్ రూపంలోని ‘బయటకు తీసుకురావడం’ అనే కారణార్థక భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: מֵאוּר כַּשְׂדִּים
  choice: కల్దీయుల ఊరు పట్టణం నుండి
  rationale: אוּרను స్థలనామమైన ‘ఊరు’గా ఉంచుతూ, అది సాధారణ ‘ఊరు’ అనే మాట కాదని ‘పట్టణం’ ద్వారా స్పష్టం చేస్తుంది; כַּשְׂדִּיםను ‘కల్దీయులు’గా అనువదిస్తుంది.
- source_word: וְשַׂמְתָּ שְׁמוֹ אַבְרָהָם
  choice: అతనికి అబ్రాహాము అనే పేరు పెట్టావు
  rationale: అక్షరార్థంగా ‘అతని పేరు అబ్రాహాముగా ఉంచావు’; పేరు మార్చిన కార్యాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: YHWH అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా / ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం יְהוָה నేరుగా ఉంది. అందువల్ల దానిని బిరుదైన ‘ప్రభువు’తో భర్తీ చేయకుండా ‘యాహ్వే’గా లిప్యంతరీకరించాం.
- issue: יְהוָה הָאֱלֹהִים పదబంధ సంబంధం
  choice: దేవుడైన యాహ్వే
  alternative: యాహ్వే దేవుడు
  rationale: రెండు పదాలనూ నిలుపుతూ సమానాధికరణ భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; ప్రత్యామ్నాయ పదక్రమాన్ని పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ప్రార్థనా సందర్భానికి తగిన గౌరవభావంతో, సాధారణ పాఠకులకు అర్థమయ్యే సరళమైన వాక్య నిర్మాణం. ‘అబ్రాము’–‘అబ్రాహాము’ పేర్ల వ్యత్యాసం ఉద్దేశపూర్వకంగా నిలుపబడింది.
