  text: וַ/תִּתֵּ֨ן לָ/הֶ֤ם מַמְלָכוֹת֙ וַ/עֲמָמִ֔ים וַֽ/תַּחְלְקֵ֖/ם לְ/פֵאָ֑ה וַ/יִּֽירְשׁ֞וּ אֶת אֶ֣רֶץ סִיח֗וֹן וְ/אֶת אֶ֨רֶץ֙ מֶ֣לֶךְ חֶשְׁבּ֔וֹן וְ/אֶת אֶ֖רֶץ ע֥וֹג מֶֽלֶךְ הַ/בָּשָֽׁן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/022.yaml
  text: You gave them kingdoms and peoples, and allotted them to every corner. So they took possession of the land of Sihon, that is, the land of the king of Heshbon, and the land of Og king of Bashan.
translation:
  language: te
  text: నీవు వారికి రాజ్యాలనూ జనాలనూ ఇచ్చి, వాటిని ప్రాంతాలవారీగా[a] వారికి పంచిపెట్టావు. అప్పుడు వారు సీహోను దేశాన్నీ, హెష్బోను రాజు దేశాన్నీ[b], బాషాను రాజైన ఓగు దేశాన్నీ స్వాధీనం చేసుకున్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నలుదిక్కులా.”
    reason: The Hebrew לְפֵאָה literally relates to a corner or side and may describe distribution by regions or in every direction.
  - marker: b
    text: హెబ్రీ వాక్యనిర్మాణంలో “సీహోను దేశం” మరియు “హెష్బోను రాజు దేశం” అని రెండు పదబంధాలు ‘మరియు’తో కలిశాయి. సీహోనే హెష్బోను రాజు కావడం వల్ల, దీనిని “సీహోను దేశాన్ని, అంటే హెష్బోను రాజు దేశాన్ని” అని కూడా అర్థం చేసుకోవచ్చు.
    reason: Clarifies the genuine ambiguity between coordination and apposition without resolving it silently in the main text.
lexical_decisions:
- source_word: וַתַּחְלְקֵם לְפֵאָה
  choice: వాటిని ప్రాంతాలవారీగా వారికి పంచిపెట్టావు
  rationale: חלק means divide or apportion, while פאה can denote a corner, side, or outlying region. ‘ప్రాంతాలవారీగా’ communicates territorial distribution naturally without overdefining the geography.
- source_word: וַיִּירְשׁוּ
  choice: స్వాధీనం చేసుకున్నారు
  rationale: In this conquest context ירשׁ denotes taking possession of territory, not merely receiving an inheritance.
theological_decisions:
- issue: Relationship between ‘the land of Sihon’ and ‘the land of the king of Heshbon’
  choice: Preserve both coordinated phrases in the main text
  alternative: 'Render appositionally: ‘సీహోను దేశాన్ని, అంటే హెష్బోను రాజు దేశాన్ని’'
  rationale: The Hebrew text explicitly joins the two accusative phrases with וְ (‘and’), even though Sihon is elsewhere identified as king of Heshbon. Preserving the coordination avoids silently resolving the syntactic tension; the footnote explains the possible appositional sense.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన శైలి. దేవునికి ఏకవచన గౌరవభావంతో ‘నీవు’ వాడబడింది. రాజ్యాలు, జనాలు అనే బహువచనానికి ‘వాటిని’ సహజ అన్వయంగా ఉపయోగించబడింది; భూస్వాధీన సందర్భంలో ‘స్వాధీనం చేసుకున్నారు’ స్పష్టంగా ఉంది.
