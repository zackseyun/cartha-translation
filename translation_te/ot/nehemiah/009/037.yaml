revisions:
- from: దాని విస్తారమైన దిగుబడి[a] మన పాపాల కారణంగా నీవు మనపై నియమించిన రాజులకే చెందుతోంది. వారు తమ ఇష్టప్రకారం మన శరీరాలపైనా[b], మన పశువులపైనా అధికారం చెలాయిస్తున్నారు. మనం తీవ్రమైన కష్టంలో ఉన్నాం.
  to: దాని దిగుబడి[a] మన పాపాల కారణంగా నీవు మనపై నియమించిన రాజులకు సమృద్ధిగా చేరుతోంది. వారు తమ ఇష్టప్రకారం మన శరీరాలపైనా[b], మన పశువులపైనా అధికారం చెలాయిస్తున్నారు. మనం తీవ్రమైన కష్టంలో ఉన్నాం.
  rationale: The revision preserves the source’s causal statement about the people’s sins and God’s appointment of the kings, as well as the rulers’ arbitrary domination. It replaces a potentially spatial sense of ‘విస్తారమైన’ with ‘సమృద్ధిగా,’ removes unrequired exclusivity in ‘రాజులకే,’ and updates footnote a to a natural modern Telugu alternative. All existing footnote anchors remain present and correctly placed.
