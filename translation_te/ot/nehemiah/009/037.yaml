review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys that the land’s produce benefits the kings appointed over the people because of their sins, and that these rulers exercise arbitrary power over both the people’s bodies and livestock. However, ‘విస్తారమైన దిగుబడి’ can suggest spatial extent rather than abundance, and the emphatic ‘రాజులకే’ adds an exclusivity not explicit in the Hebrew.
  naturalness: The overall register is clear, modern, and appropriately grave. Recasting the opening as ‘దాని దిగుబడి సమృద్ధిగా రాజులకు చేరుతోంది’ is more idiomatic and accurately expresses abundant yield accruing to the kings. The rest reads naturally.
  terminology: ‘పాపాలు,’ ‘శరీరాలు,’ ‘పశువులు,’ and ‘తీవ్రమైన కష్టం’ are suitable modern-standard Telugu choices. The revised footnote avoids the less current or less natural ‘ఫలసాయం.’
  issues:
  - severity: medium
    issue: ‘విస్తారమైన దిగుబడి’ is potentially imprecise in Telugu.
    rationale: విస్తారమైన commonly denotes breadth or extent. מַרְבָּה here concerns abundance/increase of the land’s yield, better rendered by ‘సమృద్ధిగా’ in relation to the yield.
  - severity: low
    issue: ‘రాజులకే’ introduces emphasis/exclusivity.
    rationale: The Hebrew לַמְּלָכִים indicates that the produce is for/goes to the kings, but does not itself mark ‘to the kings alone.’ Removing కే avoids adding that nuance.
  - severity: low
    issue: Footnote a uses ‘ఫలసాయం.’
    rationale: This is less natural in modern standard Telugu than ‘పంట’ as an alternative for the land’s produce/harvest.
  revised_text: దాని దిగుబడి[a] మన పాపాల కారణంగా నీవు మనపై నియమించిన రాజులకు సమృద్ధిగా చేరుతోంది. వారు తమ ఇష్టప్రకారం మన శరీరాలపైనా[b], మన పశువులపైనా అధికారం చెలాయిస్తున్నారు. మనం తీవ్రమైన కష్టంలో ఉన్నాం.
