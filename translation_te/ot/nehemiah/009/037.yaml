base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/037.yaml
  text: Its abundant produce goes to the kings whom you have set over us because of our sins[a]. They rule over our bodies and over our livestock as they please[b], and we are in great distress.
translation:
  language: te
  text: దాని దిగుబడి[a] మన పాపాల కారణంగా నీవు మనపై నియమించిన రాజులకు సమృద్ధిగా చేరుతోంది. వారు తమ ఇష్టప్రకారం మన శరీరాలపైనా[b], మన పశువులపైనా అధికారం చెలాయిస్తున్నారు. మనం తీవ్రమైన కష్టంలో ఉన్నాం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘దాని పంట’ అని కూడా అనువదించవచ్చు. ‘దాని’ అనే పదం మునుపటి వచనంలో చెప్పిన దేశాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘మన వ్యక్తులపైనా’ అని కూడా అనువదించవచ్చు. హెబ్రీ పదానికి అక్షరార్థం ‘మన శరీరాలపైనా.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וּתְבוּאָתָהּ
  choice: దాని ... దిగుబడి
  rationale: תְּבוּאָה భూమి ఇచ్చే పంట లేదా దిగుబడిని సూచిస్తుంది. స్త్రీలింగ ఏకవచన ప్రత్యయం మునుపటి వచనంలోని దేశాన్ని సూచిస్తున్నందున ‘దాని దిగుబడి’ అని అనువదించాం.
- source_word: מַרְבָּה
  choice: విస్తారమైన
  rationale: ఈ రూపం అధిక పరిమాణాన్ని లేదా సమృద్ధిని తెలియజేస్తుంది. ‘విస్తారమైన దిగుబడి’ ఆధునిక తెలుగులో సహజంగా ఉండి మూలభావాన్ని నిలుపుతుంది.
- source_word: לַמְּלָכִים
  choice: రాజులకే చెందుతోంది
  rationale: לְ దిశను లేదా ప్రయోజనం పొందేవారిని సూచిస్తుంది. దిగుబడి విదేశీ రాజుల వశమవుతోందనే భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేయడానికి ‘రాజులకే చెందుతోంది’ అని ఇచ్చాం; ‘కే’ వారి దాస్యస్థితిలో దిగుబడి ఫలాన్ని వారే పొందుతున్నారని స్పష్టం చేస్తుంది.
- source_word: אֲשֶׁר נָתַתָּה עָלֵינוּ
  choice: నీవు మనపై నియమించిన
  rationale: נתן + עַל ఒకరిని మరొకరిపై ఉంచడం లేదా అధికారిగా నియమించడం అనే భావాన్ని ఇక్కడ ఇస్తుంది. ‘నియమించిన’ దేవుని క్రియాశీల పాత్రను నిలుపుతుంది.
- source_word: בְּחַטֹּאותֵינוּ
  choice: మన పాపాల కారణంగా
  rationale: ఈ సందర్భంలో בְּ కారణాన్ని సూచిస్తుంది. ప్రజల పాపాల వల్లే ఈ అధీనత వచ్చిందనే సంబంధాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: גְּוִיֹּתֵינוּ
  choice: మన శరీరాలు
  rationale: גְּוִיָּה ‘శరీరం’ అని అర్థం కావచ్చు. పశువులతో సమాంతరంగా, పాలకుల ఆధీనంలో ఉన్న ప్రజల భౌతిక వ్యక్తిత్వాన్ని ఇక్కడ సూచిస్తుంది; మృతదేహాలను కాదు.
- source_word: מֹשְׁלִים
  choice: అధికారం చెలాయిస్తున్నారు
  rationale: వర్తమాన కృదంతం కొనసాగుతున్న పాలనను సూచిస్తుంది. సందర్భంలోని అణచివేత భావాన్ని అతిగా పెంచకుండా తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: וּבִבְהֶמְתֵּנוּ
  choice: మన పశువులు
  rationale: בְּהֵמָה ఇక్కడ పెంపుడు జంతువులను సమష్టిగా సూచిస్తుంది. ‘పశువులు’ సాధారణ పాఠకులకు సహజమైన, విస్తృత పదం.
- source_word: כִּרְצוֹנָם
  choice: తమ ఇష్టప్రకారం
  rationale: పాలకులు తమ స్వంత సంకల్పం ప్రకారం అధికారాన్ని వినియోగిస్తున్నారని ఈ పదబంధం సూచిస్తుంది.
- source_word: וּבְצָרָה גְדוֹלָה אֲנָחְנוּ
  choice: మనం తీవ్రమైన కష్టంలో ఉన్నాం
  rationale: צָרָה కష్టం, ఇబ్బంది, ఆపద లేదా వేదనను సూచిస్తుంది. ‘తీవ్రమైన కష్టం’ సామూహిక విలాపంలోని గంభీరతను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: విదేశీ రాజుల ఆధిపత్యంలో దేవుని పాత్ర
  choice: ప్రజల పాపాల కారణంగా దేవుడే ఆ రాజులను వారిపై నియమించాడని వచనం చెప్పే భావాన్ని ప్రత్యక్షంగా నిలిపాం.
  alternative: దేవుడు ఆ రాజుల పాలనను కేవలం అనుమతించాడని అనువదించడం; లేదా రాజులు చేసే ప్రతిదానికీ దేవుని నైతిక ఆమోదం ఉందని సూచించడం.
  rationale: נָתַתָּה עָלֵינוּ ప్రజల పాపాలకు న్యాయపరమైన పరిణామంగా వారి అధీనతను దేవుని చర్యకు నేరుగా ఆపాదిస్తుంది. అయితే రాజుల అణచివేతను దేవుడు నైతికంగా ఆమోదించాడనే అదనపు నిర్ణయాన్ని మూలపాఠం చేయదు; అనువాదం కూడా దాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గంభీరమైన విలాప శైలిని ఉపయోగించాం. ‘అధికారం చెలాయిస్తున్నారు’ కొనసాగుతున్న పాలనను సహజంగా తెలియజేస్తుంది; ‘తీవ్రమైన కష్టం’ సామూహిక ఆపద తీవ్రతను నిలుపుతుంది. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో సంబంధిత పదాల వెంట ఉంచబడ్డాయి.
