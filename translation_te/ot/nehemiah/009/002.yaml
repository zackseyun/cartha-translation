revisions:
- from: అప్పుడు ఇశ్రాయేలు సంతతివారు[a] అన్యజనులందరి నుండి తమను తాము వేరుచేసుకొని, నిలబడి తమ పాపాలను, తమ పితరుల దోషాలను[b] ఒప్పుకున్నారు.
  to: అప్పుడు ఇశ్రాయేలు సంతతివారు[a] విదేశీయులందరి నుండి తమను తాము వేరుచేసుకొని, నిలబడి తమ పాపాలను, తమ పితరుల దోషాలను[b] ఒప్పుకున్నారు.
  rationale: ‘అన్యజనులందరి’ స్థానంలో ‘విదేశీయులందరి’ ఉంచడం ద్వారా బְּנֵי נֵכָר యొక్క ‘విదేశీయులు/విదేశీ మూలం గలవారు’ అనే భావం మరింత నేరుగా వ్యక్తమవుతుంది. రెండవ అడుగుటిప్పణిని సంక్షిప్తంగా మార్చి, పితరుల దోషాల సామూహిక ఒప్పుకోలు అనే పాఠ్యసంభావ్యతను నిలిపి, వచనం పరిష్కరించని సిద్ధాంతపరమైన నిర్ధారణను తొలగించాం.
