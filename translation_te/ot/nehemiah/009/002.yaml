id: NEH.9.2
reference: Nehemiah 9:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּבָּֽדְלוּ֙ זֶ֣רַע יִשְׂרָאֵ֔ל מִ/כֹּ֖ל בְּנֵ֣י נֵכָ֑ר וַ/יַּעַמְד֗וּ וַ/יִּתְוַדּוּ֙ עַל חַטֹּ֣אתֵי/הֶ֔ם וַ/עֲוֺנ֖וֹת אֲבֹתֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/002.yaml
  text: Then the offspring of Israel separated themselves from all foreigners[b][a], and they stood and confessed their sins and the iniquities of their fathers.
translation:
  language: te
  text: అప్పుడు ఇశ్రాయేలు సంతతివారు[a] విదేశీయులందరి నుండి తమను తాము వేరుచేసుకొని, నిలబడి తమ పాపాలను, తమ పితరుల దోషాలను[b] ఒప్పుకున్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘ఇశ్రాయేలు విత్తనం’; లేదా ‘ఇశ్రాయేలు వంశస్థులు,’ ‘ఇశ్రాయేలు సంతానం.’
    reason: lexical_alternative
  - marker: b
    text: ‘తమ పితరుల దోషాలు’ అనేది పూర్వీకుల దోషాలను సామూహిక ఒప్పుకోలులో అంగీకరించడాన్ని సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּבָּדְלוּ
  choice: తమను తాము వేరుచేసుకొని
  rationale: నిఫ్అల్ రూపంలోని ప్రతిబింబక/కర్మణి భావాన్ని, ఈ సందర్భంలో ప్రజలు ఉద్దేశపూర్వకంగా వేరుపడిన చర్యగా సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: זֶרַע יִשְׂרָאֵל
  choice: ఇశ్రాయేలు సంతతివారు
  rationale: זֶרַע అనే ‘విత్తనం/సంతానం’ భావాన్ని వంశసంబంధమైన సమూహార్థంలో సహజంగా వ్యక్తపరుస్తుంది; ‘సంతతివారు’ ఆధునిక పాఠకులకు స్పష్టంగా ఉంటుంది.
- source_word: מִכֹּל בְּנֵי נֵכָר
  choice: అన్యజనులందరి నుండి
  rationale: ఈ హెబ్రీ నుడికారం అక్షరార్థంగా విదేశీయుల కుమారులను మాత్రమే కాక, అన్యదేశ లేదా అన్యజాతి ప్రజలను సూచిస్తుంది. ఈ ఎంపిక సంక్షిప్తంగా, సహజంగా ఉంది.
- source_word: וַיַּעַמְדוּ
  choice: నిలబడి
  rationale: עמד యొక్క సాధారణ ‘నిలుచు’ అర్థాన్ని నిలుపుతూ, తరువాతి ఒప్పుకోలుతో చర్యను సహజంగా అనుసంధానిస్తుంది.
- source_word: וַיִּתְוַדּוּ
  choice: ఒప్పుకున్నారు
  rationale: ఈ సందర్భంలో హిత్పయేల్ రూపం పాపాలను ఒప్పుకోవడాన్ని సూచిస్తుంది; తెలుగులో ఇది స్పష్టమైన, సహజమైన సమానార్థకం.
- source_word: חַטֹּאתֵיהֶם
  choice: తమ పాపాలను
  rationale: חטאת బహువచనానికి ప్రామాణికమైన, నేరుగా అర్థమయ్యే తెలుగు అనువాదం.
- source_word: עֲוֺנוֹת אֲבֹתֵיהֶם
  choice: తమ పితరుల దోషాలను
  rationale: עון లోని అపరాధం/దోషం/దోషభారం అనే అర్థవిస్తృతిలో, ఇక్కడ ‘పాపాలు’తో సమాంతరంగా ఉన్నప్పటికీ వేరే పదప్రయోగాన్ని నిలుపుతుంది. ‘పితరులు’ వంశపూర్వీకుల భావాన్ని గౌరవప్రదంగా అందిస్తుంది.
theological_decisions:
- issue: పితరుల దోషాల సామూహిక ఒప్పుకోలు
  choice: ప్రజలు తమ సొంత పాపాలతో పాటు తమ పితరుల దోషాలను కూడా ఒప్పుకున్నారని అనువదించడం
  alternative: వారు పితరుల దోషఫలితాలను మాత్రమే ఒప్పుకున్నారు, లేదా వాటిని కేవలం చారిత్రకంగా గుర్తించారు అని అర్థం చేసుకోవడం
  rationale: హెబ్రీ వాక్యనిర్మాణంలో ‘ఒప్పుకున్నారు’ అనే క్రియకు ‘తమ పాపాలు’ మరియు ‘తమ పితరుల దోషాలు’ రెండూ అంశాలుగా అనుసంధానమై ఉన్నాయి. అందువల్ల సామూహిక ఒప్పుకోలును నిలుపుతూ, వారసత్వ వ్యక్తిగత అపరాధంపై వాక్యం చెప్పనిదాన్ని అనువాదం చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘సంతతివారు,’ ‘అన్యజనులు,’ ‘పితరులు’ వంటి పదాలు బైబిలు సందర్భానికి తగిన గంభీరతను ఉంచుతూ సాధారణ పాఠకులకు అర్థమయ్యేలా ఎంపికయ్యాయి.
