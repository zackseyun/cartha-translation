  source_fidelity: 'The draft accurately represents the Hebrew: God finds Abraham''s heart faithful in his presence, makes a covenant to give the specified land to his offspring, fulfills his words, and is righteous. The collective sense of זַרְעוֹ is retained by “సంతానం,” and the peoples named in the source are all present.'
