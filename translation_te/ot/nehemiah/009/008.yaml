source:
  edition: WLC
  text: וּ/מָצָ֣אתָ אֶת לְבָב/וֹ֮ נֶאֱמָ֣ן לְ/פָנֶי/ךָ֒ וְ/כָר֨וֹת עִמּ֜/וֹ הַ/בְּרִ֗ית לָ/תֵ֡ת אֶת אֶרֶץ֩ הַ/כְּנַעֲנִ֨י הַ/חִתִּ֜י הָ/אֱמֹרִ֧י וְ/הַ/פְּרִזִּ֛י וְ/הַ/יְבוּסִ֥י וְ/הַ/גִּרְגָּשִׁ֖י לָ/תֵ֣ת לְ/זַרְע֑/וֹ וַ/תָּ֨קֶם֙ אֶת דְּבָרֶ֔י/ךָ כִּ֥י צַדִּ֖יק אָֽתָּה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/008.yaml
  text: You found his heart faithful before you[a], and made a covenant with him to give the land of the Canaanite, the Hittite, the Amorite, the Perizzite, the Jebusite, and the Girgashite—to give it to his offspring. And you have fulfilled your words[c][b], for you are righteous.
translation:
  language: te
  text: నీ సన్నిధిలో అతని హృదయం నమ్మకంగా ఉందని నీవు కనుగొన్నావు. కనానీయుల, హిత్తీయుల, అమోరీయుల, పెరిజ్జీయుల, యెబూసీయుల, గిర్గాషీయుల దేశాన్ని అతని సంతానానికి ఇవ్వడానికి అతనితో నిబంధన చేశావు. నీవు నీ మాటలను నెరవేర్చావు[a], ఎందుకంటే నీవు నీతిమంతుడవు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీ మాటలను స్థిరపరచావు.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “నీవు న్యాయవంతుడవు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָצָאתָ אֶת־לְבָבוֹ נֶאֱמָן לְפָנֶיךָ
  choice: నీ సన్నిధిలో అతని హృదయం నమ్మకమైనదిగా నీవు కనుగొన్నావు
  rationale: מצא అనే క్రియకు సహజమైన ‘కనుగొను’ అర్థాన్ని, לֵבָב యొక్క అంతరంగ స్వభావ సూచనను, לְפָנֶיךָ యొక్క సన్నిధి/మూల్యాంకన భావాన్ని నిలుపుతుంది. נֶאֱמָןను ‘నమ్మకమైనది’గా అనువదించడం విశ్వసనీయతను తెలియజేస్తుంది.
- source_word: וְכָרוֹת עִמּוֹ הַבְּרִית
  choice: అతనితో నిబంధన చేశావు
  rationale: ‘నిబంధన కోయడం’ అనే హీబ్రూ నుడికారాన్ని అక్షరార్థంగా కాకుండా సహజమైన ఆధునిక తెలుగు నుడికారంతో అందిస్తుంది.
- source_word: לָתֵת אֶת־אֶרֶץ ... לְזַרְעוֹ
  choice: '... దేశాన్ని అతని సంతానానికి ఇవ్వడానికి'
  rationale: రెండుసార్లు వచ్చే לָתֵתను తెలుగులో ఒకే ఉద్దేశ్య నిర్మాణంగా సహజంగా వ్యక్తం చేస్తుంది; זֶרַע యొక్క సామూహిక ఏకవచన భావాన్ని ‘సంతానం’ నిలుపుతుంది.
- source_word: וַתָּקֶם אֶת־דְּבָרֶיךָ
  choice: నీవు నీ మాటలను నెరవేర్చావు
  rationale: קום + ‘మాటలు’ ఇక్కడ వాటిని కార్యరూపంలో నిలబెట్టడం/నెరవేర్చడం అనే సందర్భార్థం ఇస్తుంది. బహువచనమైన דְּבָרֶיךָను ‘మాటలను’గా ఉంచింది.
- source_word: כִּי צַדִּיק אָתָּה
  choice: ఎందుకంటే నీవు నీతిమంతుడవు
  rationale: כִּי యొక్క కారణార్థాన్ని స్పష్టంగా చూపుతుంది; צַדִּיקలోని విస్తృత నైతిక, నిబంధనాత్మక న్యాయనిష్ఠ భావానికి ‘నీతిమంతుడు’ సరిపోతుంది.
theological_decisions:
- issue: దేవుని గురించి צַדִּיק పదం
  choice: నీతిమంతుడవు
  alternative: న్యాయవంతుడవు
  rationale: ‘నీతిమంతుడు’ దేవుని నైతిక యథార్థతతో పాటు నిబంధనకు నమ్మకంగా ఉండే విస్తృత భావాన్ని నిలుపుతుంది; ‘న్యాయవంతుడు’ న్యాయనిర్ణయ భావాన్ని మరింత ముందుకు తెస్తుంది.
- issue: వాగ్దానపు మాటలను קום చేయడం
  choice: మాటలను నెరవేర్చావు
  alternative: మాటలను స్థిరపరచావు
  rationale: సందర్భంలో దేవుడు నిబంధన వాగ్దానాన్ని కార్యరూపంలోకి తెచ్చాడనే భావం ప్రధానమైనది. అయినా మూలక్రియలో ‘నిలబెట్టు/స్థిరపరచు’ అనే సాధ్యార్థాన్ని పాదటిప్పణిలో ఉంచింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన ప్రార్థనా శైలిని ఉపయోగించాం. జాతుల పేర్లను తెలుగులో సాధారణ బైబిలు రూపాలకు దగ్గరగా ఉంచాం. మూలంలోని పునరుక్త לָתֵתను యాంత్రికంగా రెండుసార్లు అనువదించకుండా, అర్థాన్ని పూర్తిగా నిలుపుతూ సహజమైన ఒకే తెలుగు వాక్యనిర్మాణంలో ఇచ్చాం.
