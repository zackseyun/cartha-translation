- from: వారి ఆకలి తీర్చడానికి ఆకాశం నుండి వారికి రొట్టె ఇచ్చావు; వారి దాహం తీర్చడానికి బండలో నుండి వారికి నీళ్లు రప్పించావు. వారికి ఇవ్వడానికి నీవు చెయ్యెత్తిన[a] దేశంలోకి ప్రవేశించి, దాన్ని స్వాధీనం చేసుకోవాలని వారికి చెప్పావు.
  to: వారి ఆకలి తీర్చడానికి ఆకాశం నుండి వారికి రొట్టె ఇచ్చావు; వారి దాహం తీర్చడానికి బండ నుండి వారికి నీరు రప్పించావు. వారికి ఇస్తానని నీవు ప్రమాణం చేసిన[a] దేశంలోకి వెళ్లి, దానిని స్వాధీనం చేసుకోవాలని వారికి చెప్పావు.
  rationale: మూలంలోని ప్రమాణ నుడికారానికి తెలుగు ప్రధాన పాఠంలో సహజమైన అర్థసమానాన్ని ఇచ్చి, దాని అక్షరార్థ చిత్రాన్ని సరైన పాదసూచిక-ఆంకరుతో భద్రపరిచాం. దీనివల్ల అస్పష్టమైన సంబంధవాక్య నిర్మాణం తొలగి, మూలభావం లేదా వేదాంతార్థం మారకుండా వాక్యం స్పష్టమైంది. నీటి మూలాన్ని ‘బండ నుండి’గా కూడా సహజీకరించాం.
