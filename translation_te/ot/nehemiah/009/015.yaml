source:
  edition: WLC
  text: וְ֠/לֶחֶם מִ/שָּׁמַ֜יִם נָתַ֤תָּה לָ/הֶם֙ לִ/רְעָבָ֔/ם וּ/מַ֗יִם מִ/סֶּ֛לַע הוֹצֵ֥אתָ לָ/הֶ֖ם לִ/צְמָאָ֑/ם וַ/תֹּ֣אמֶר לָ/הֶ֗ם לָ/בוֹא֙ לָ/רֶ֣שֶׁת אֶת הָ/אָ֔רֶץ אֲשֶׁר נָשָׂ֥אתָ אֶת יָדְ/ךָ֖ לָ/תֵ֥ת לָ/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/015.yaml
  text: You gave them bread from heaven for their hunger[a], and you brought out water from the rock for their thirst, and you told them to go in to possess the land that you had sworn to give them.
translation:
  language: te
  text: వారి ఆకలి తీర్చడానికి ఆకాశం నుండి వారికి రొట్టె ఇచ్చావు; వారి దాహం తీర్చడానికి బండ నుండి వారికి నీరు రప్పించావు. వారికి ఇస్తానని నీవు ప్రమాణం చేసిన[a] దేశంలోకి వెళ్లి, దానిని స్వాధీనం చేసుకోవాలని వారికి చెప్పావు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, ‘వారికి ఇవ్వడానికి నీవు నీ చేయి ఎత్తిన.’ ‘చేయి ఎత్తడం’ ప్రమాణం చేయడాన్ని సూచించే నుడికారం.
    reason: హీబ్రూ ప్రమాణ-నుడికారంలోని అక్షరార్థ చిత్రాన్ని చూపడం
lexical_decisions:
- source_word: לֶחֶם מִשָּׁמַיִם
  choice: ఆకాశం నుండి రొట్టె
  rationale: హీబ్రూలోని ‘రొట్టె’ అనే స్పష్టమైన రూపకాన్ని నిలుపుతూ, మన్నాను వివరణాత్మకంగా చేర్చకుండా మూలపాఠానికి దగ్గరగా ఉంచుతుంది.
- source_word: לִרְעָבָם / לִצְמָאָם
  choice: వారి ఆకలి తీర్చడానికి / వారి దాహం తీర్చడానికి
  rationale: లామెద్ సూచించే అవసరం లేదా ప్రయోజన భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తూ, రెండు సమాంతర పదబంధాల సమతుల్యతను కాపాడుతుంది.
- source_word: מַיִם מִסֶּלַע הוֹצֵאתָ
  choice: బండలో నుండి వారికి నీళ్లు రప్పించావు
  rationale: הוֹצֵאתָ అనే హిఫీల్ క్రియలోని కారణార్థాన్ని ‘రప్పించావు’ తెలియజేస్తుంది; ‘బండ’ అరణ్య సంఘటనకు సంబంధించిన మూలచిత్రాన్ని నిలుపుతుంది.
- source_word: וַתֹּאמֶר לָהֶם
  choice: వారికి చెప్పావు
  rationale: మూలంలోని ‘చెప్పు’ అనే సాధారణ క్రియాబలాన్ని కాపాడుతుంది; ‘ఆజ్ఞాపించావు’ అని అనవసరంగా బలపరచదు.
- source_word: לָבוֹא לָרֶשֶׁת אֶת־הָאָרֶץ
  choice: దేశంలోకి ప్రవేశించి, దాన్ని స్వాధీనం చేసుకోవాలని
  rationale: בוא యొక్క ప్రవేశ భావాన్నీ ירשׁ యొక్క భూస్వాధీన భావాన్నీ స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: נָשָׂאתָ אֶת־יָדְךָ
  choice: నీవు చెయ్యెత్తిన
  rationale: ప్రమాణం చేయడాన్ని సూచించే హీబ్రూ నుడికారంలోని దృశ్యరూపాన్ని ప్రధాన పాఠంలో నిలుపుతుంది; దాని భావాన్ని పాదసూచిక వివరిస్తుంది.
- source_word: לָתֵת לָהֶם
  choice: వారికి ఇవ్వడానికి
  rationale: ఇన్ఫినిటివ్ పదబంధంలోని ఉద్దేశాన్ని నేరుగా, సహజంగా అందిస్తుంది.
theological_decisions:
- issue: దేశాన్ని ఇస్తానన్న దేవుని ప్రమాణానికి సంబంధించిన మానవరూప నుడికారం
  choice: ప్రధాన పాఠంలో ‘నీవు చెయ్యెత్తిన’ అనే హీబ్రూ దృశ్యరూపాన్ని నిలుపడం
  alternative: ‘వారికి ఇస్తానని నీవు ప్రమాణం చేసిన’ అని భావానువాదం చేయడం
  rationale: మూలంలోని ప్రమాణ-చిత్రాన్ని చెరపకుండా ఒడంబడిక సంబంధమైన భాషా స్వరూపాన్ని కాపాడుతుంది; పాదసూచిక నుడికారపు అర్థాన్ని స్పష్టం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యే సహజమైన, గౌరవప్రదమైన శైలి. ఆకలి–దాహం సమాంతర నిర్మాణాన్ని నిలుపుతూ, ప్రమాణ నుడికారంలోని మూలచిత్రాన్ని పాదసూచిక సహాయంతో సంరక్షించింది.
