  text: וּ/בְנֵי/הֶ֣ם הִרְבִּ֔יתָ כְּ/כֹכְבֵ֖י הַ/שָּׁמָ֑יִם וַ/תְּבִיאֵ/ם֙ אֶל הָ/אָ֔רֶץ אֲשֶׁר אָמַ֥רְתָּ לַ/אֲבֹתֵי/הֶ֖ם לָ/ב֥וֹא לָ/רָֽשֶׁת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/023.yaml
  text: You multiplied their children like the stars of the heavens[c][b][a], and you brought them into the land that you had told their fathers to enter and possess.
translation:
  language: te
  text: వారి సంతానాన్ని[a] ఆకాశంలోని నక్షత్రాలవలె[b] విస్తరింపజేశావు. వారి పితరులు ప్రవేశించి స్వాధీనం చేసుకోవాలని[c] నీవు చెప్పిన దేశంలోకి వారిని తీసుకొచ్చావు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘వారి కుమారులను’ లేదా ‘వారి పిల్లలను.’
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా ‘ఆకాశాల నక్షత్రాలవలె’; ఇది దేవుడు పితరులకు చేసిన వాగ్దానాన్ని ప్రతిధ్వనిస్తుంది.
    reason: cross_reference
  - marker: c
    text: లేదా ‘వారసత్వంగా పొందాలని’; ఈ క్రియను కొన్ని సందర్భాల్లో అలా కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵיהֶם
  choice: వారి సంతానాన్ని
  rationale: בנים అనే పదం ‘కుమారులు’ అని సంకుచితంగా అర్థమవగలిగినా, ఇక్కడ జాతి విస్తరణను సూచిస్తున్నందున స్త్రీపురుషులందరినీ, తరువాతి తరాలనూ కలుపుకునే ‘సంతానం’ సహజంగా సరిపోతుంది.
- source_word: הִרְבִּיתָ
  choice: విస్తరింపజేశావు
  rationale: రבה హిఫీల్ రూపం ‘అనేకమయ్యేలా చేయడం’ అనే భావాన్ని, దేవుని ప్రత్యక్ష కార్యాన్ని వ్యక్తం చేస్తుంది. ‘విస్తరింపజేశావు’ ఆధునిక తెలుగులో సహజంగా ఉండి ఆ కారణార్థక భావాన్ని నిలుపుతుంది.
- source_word: כְּכֹכְבֵי הַשָּׁמָיִם
  choice: ఆకాశ నక్షత్రాలవలె
  rationale: హీబ్రూ ఉపమానాన్ని దగ్గరగా నిలుపుతూ, పితరులకు దేవుడు చేసిన వాగ్దానపు ప్రతిధ్వనిని కాపాడుతుంది.
- source_word: וַתְּבִיאֵם
  choice: వారిని తీసుకొచ్చావు
  rationale: בוא హిఫీల్ రూపంలోని ‘లోపలికి తీసుకురావడం’ అనే భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אֶל הָאָרֶץ
  choice: దేశంలోకి
  rationale: చలనాన్ని సూచించే క్రియతో ‘లోకి’ వాడటం కేవలం దేశం వద్దకు రావడం కాక, అందులో ప్రవేశించడాన్ని స్పష్టం చేస్తుంది.
- source_word: אֲשֶׁר אָמַרְתָּ לַאֲבֹתֵיהֶם
  choice: వారి పితరులకు ... నీవు చెప్పిన
  rationale: దేవుడు ముందుగా పితరులతో పలికిన మాటను స్పష్టంగా ఉంచి, నిబంధన వాగ్దానంతో ఉన్న సంబంధాన్ని కాపాడుతుంది.
- source_word: לָבוֹא
  choice: ప్రవేశించి
  rationale: దేశంలోకి వెళ్లే భావాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: לָרָשֶׁת
  choice: స్వాధీనం చేసుకోవాలని
  rationale: ירשׁ ఇక్కడ వాగ్దాన దేశాన్ని స్వాధీనపరచుకోవడాన్ని సూచిస్తుంది. ‘స్వాధీనం చేసుకోవడం’ ఆ తక్షణ సందర్భానికి స్పష్టంగా సరిపోతూ, ‘వారసత్వంగా పొందడం’ అనే సాధ్యమైన భావాన్ని పాదసూచికలో నిలుపుతుంది.
theological_decisions:
- issue: పితరులకు చేసిన వాగ్దానపు భాషతో ఉన్న ప్రతిధ్వని
  choice: ‘ఆకాశ నక్షత్రాలవలె’, ‘వారి పితరులకు’ అనే రూపాలను నిలిపాం.
  alternative: ‘ఆకాశంలోని నక్షత్రాలంతగా’, ‘వారి పూర్వీకులకు’ వంటి మరింత వాడుక రూపాలు.
  rationale: ఈ వచనం దేవుని నిబంధన విశ్వసనీయతను జ్ఞాపకం చేస్తూ పితరులకు చేసిన వాగ్దాన భాషను ఉద్దేశపూర్వకంగా ప్రతిధ్వనిస్తుంది. వ్యాఖ్యానాన్ని వచనంలో చేర్చకుండా ఆ సంబంధాన్ని నిలుపడం సముచితం.
- issue: ירשׁ క్రియలోని స్వాధీనం/వారసత్వం భావాలు
  choice: ప్రధాన పాఠ్యంలో ‘స్వాధీనం చేసుకోవాలని’ అని అనువదించాం.
  alternative: ‘వారసత్వంగా పొందాలని’.
  rationale: తక్షణ సందర్భంలో దేశంలో ప్రవేశించి దాన్ని అధీనంలోకి తెచ్చుకోవడం ప్రధానంగా ఉంది; అయినా వారసత్వ భావం సాధ్యమే కాబట్టి దానిని పాదసూచికలో పేర్కొన్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని వాడాం. ‘పితరులు’ అనే బైబిలు సందర్భానికి తగిన పదాన్ని వాగ్దాన సంబంధాన్ని నిలుపడానికి ఉంచాం; మిగతా వాక్య నిర్మాణాన్ని సాధారణ పాఠకులకు సులభంగా ఉండేలా తీర్చిదిద్దాం.
