id: NEH.9.28
reference: Nehemiah 9:28
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/כְ/נ֣וֹחַ לָ/הֶ֔ם יָשׁ֕וּבוּ לַ/עֲשׂ֥וֹת רַ֖ע לְ/פָנֶ֑י/ךָ וַ/תַּֽעַזְבֵ֞/ם בְּ/יַ֤ד אֹֽיְבֵי/הֶם֙ וַ/יִּרְדּ֣וּ בָ/הֶ֔ם וַ/יָּשׁ֨וּבוּ֙ וַ/יִּזְעָק֔וּ/ךָ וְ/אַתָּ֞ה מִ/שָּׁמַ֧יִם תִּשְׁמַ֛ע וְ/תַצִּילֵ֥/ם כְּֽ/רַחֲמֶ֖י/ךָ רַבּ֥וֹת עִתִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/028.yaml
  text: But when they had rest, they again did evil before you; so you left them in the power of their enemies[a], who ruled over them. Then they returned and cried out to you, and from heaven you heard and delivered them many times according to your mercies.
translation:
  language: te
  text: అయితే వారికి విశ్రాంతి కలిగినప్పుడు, వారు మళ్లీ నీ సన్నిధిలో చెడు చేశారు. అందుచేత నీవు వారిని వారి శత్రువుల అధికారానికి అప్పగించావు[a]; వారి శత్రువులు వారిని ఏలారు. అప్పుడు వారు తిరిగి వచ్చి నీకు మొరపెట్టుకున్నారు. నీవు ఆకాశం నుండి విని, నీ కనికరాన్ని బట్టి అనేకసార్లు వారిని విడిపించావు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “వారి శత్రువుల చేతిలో.” ఇది వారి శత్రువుల అధికారం లేదా నియంత్రణలో ఉండడాన్ని తెలిపే హెబ్రీయ నుడికారం.
    reason: cultural_note
lexical_decisions:
- source_word: וּכְנוֹחַ לָהֶם
  choice: అయితే వారికి విశ్రాంతి కలిగినప్పుడు
  rationale: כְּ temporal circumstanceను సూచిస్తుంది; తక్షణత్వాన్ని జోడించకుండా సహజమైన తెలుగులో కాలసంబంధాన్ని తెలియజేస్తుంది.
- source_word: יָשׁוּבוּ לַעֲשׂוֹת רַע
  choice: వారు మళ్లీ ... చెడు చేశారు
  rationale: שׁוב + infinitive ఇక్కడ చెడు కార్యాన్ని పునరావృతం చేయడాన్ని సూచిస్తుంది; అక్షరార్థమైన ‘తిరిగి చేయడానికి’ కంటే ఈ భావానువాదం సహజం.
- source_word: לְפָנֶיךָ
  choice: నీ సన్నిధిలో
  rationale: ‘నీ ముఖము ఎదుట’ అనే మూలభావంలోని దేవుని సమక్షతను నిలుపుతుంది; కేవలం చూడటానికో లేదా ప్రత్యక్ష విరోధానికో పరిమితం చేయదు.
- source_word: וַתַּעַזְבֵם בְּיַד אֹיְבֵיהֶם
  choice: నీవు వారిని వారి శత్రువుల అధికారానికి అప్పగించావు
  rationale: עזב యొక్క విడిచిపెట్టే తీర్పు భావాన్ని, ‘చేతిలో’ అనే హెబ్రీయ నుడికారంలోని అధికారం/నియంత్రణ భావంతో సహజంగా కలుపుతుంది; మూల రూపకం పాదసూచికలో ఉంది.
- source_word: וַיִּרְדּוּ בָהֶם
  choice: వారు వీరిని ఏలారు
  rationale: శత్రువులు ఇశ్రాయేలీయులపై ఆధిపత్యం చెలాయించిన భావాన్ని నేరుగా వ్యక్తం చేస్తుంది; ‘పీడించారు’ అని మూలపదానికి మించిన భావాన్ని జోడించదు.
- source_word: וַיָּשׁוּבוּ
  choice: అప్పుడు వీరు తిరిగి
  rationale: మొదటి שׁוב యొక్క పునరావృత కార్యార్థానికి భిన్నంగా, ఇక్కడ దేవునివైపు తిరిగిన గమనాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: וַיִּזְעָקוּךָ
  choice: నీకు మొరపెట్టుకున్నారు
  rationale: זעק లోని అత్యవసర సహాయవిన్నప భావాన్ని ఆధునిక ప్రామాణిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: מִשָּׁמַיִם תִּשְׁמַע
  choice: నీవు పరలోకం నుండి విని
  rationale: ముందుంచబడిన ‘పరలోకం నుండి’ అనే మూలపదబంధాన్ని నిలుపుతూ దేవుని ప్రతిస్పందనను సహజంగా తెలుపుతుంది.
- source_word: וְתַצִּילֵם
  choice: వారిని విడిపించావు
  rationale: శత్రువుల ఆధిపత్యం నుండి రక్షించి విడుదల చేయడమే సందర్భార్థం; విస్తృతమైన సిద్ధాంతార్థాన్ని అనవసరంగా దిగుమతి చేయదు.
- source_word: כְּרַחֲמֶיךָ רַבּוֹת עִתִּים
  choice: నీ కనికరాన్ని బట్టి అనేకసార్లు
  rationale: רַבּוֹת స్త్రీలింగ బహువచనం עִתִּים (‘సార్లు’)ను విశేషిస్తుంది; ‘అనేక కనికరాలు’ అనే తప్పు అన్వయాన్ని నివారిస్తుంది.
theological_decisions:
- issue: దైవికంగా విడిచిపెట్టడం అనే తీర్పు భాష
  choice: వారి శత్రువుల అధికారానికి అప్పగించావు
  alternative: వారిని వారి శత్రువుల చేతిలో విడిచిపెట్టావు
  rationale: దేవుడు రక్షణను ఉపసంహరించి శత్రువుల నియంత్రణకు వారిని అప్పగించిన నిబంధనాత్మక తీర్పును తెలియజేస్తుంది; శాశ్వతంగా పూర్తిగా త్యజించాడనే భావాన్ని రుద్దదు.
- issue: చివరి క్రియల పునరావృత గతకాల భావం
  choice: విని ... అనేకసార్లు వారిని విడిపించావు
  alternative: వింటూ ... అనేకసార్లు విడిపిస్తూ వచ్చావు
  rationale: సంగ్రహాత్మక సందర్భంలోని imperfect క్రియలు పునరావృత గతచర్యను సూచించగలవు; ‘అనేకసార్లు’తో కూడిన సరళ గతకాలం తెలుగులో స్పష్టంగా, సహజంగా ఉంటుంది.
- issue: రַבּוֹת పదం దేనిని విశేషిస్తుందో
  choice: అనేకసార్లు
  alternative: నీ అపారమైన కనికరాన్ని బట్టి
  rationale: హెబ్రీయ వ్యాకరణంలో רַבּוֹת అనేది עִתִּיםతో సరిపోతుంది; అందువల్ల సమృద్ధి ‘కనికరం’కు కాక, విడిపించిన సందర్భాల సంఖ్యకు చెందుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకులకు అర్థమయ్యే శైలి. ‘నీ సన్నిధిలో,’ ‘మొరపెట్టుకున్నారు,’ ‘కనికరం’ వంటి బైబిలు సందర్భానికి తగిన పదాలను ఉంచి, అతిగా ప్రాచీనమైన క్రియారూపాలను నివారించాం. సమీపంలోని రెండు పక్షాలు గందరగోళం కాకుండా రెండో వాక్యంలో ‘వారు/వీరిని’ అని, తరువాత ‘వీరు’ అని సూచించాం.
