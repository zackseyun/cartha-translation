revisions:
- from: అయితే వారికి విశ్రాంతి కలిగినప్పుడు, వారు మళ్లీ నీ సన్నిధిలో చెడు చేశారు. అందుచేత నీవు వారిని వారి శత్రువుల అధికారానికి అప్పగించావు[a]; వారు వీరిని ఏలారు. అప్పుడు వీరు తిరిగి నీకు మొరపెట్టుకున్నారు. నీవు పరలోకం నుండి విని, నీ కనికరాన్ని బట్టి అనేకసార్లు వారిని విడిపించావు.
  to: అయితే వారికి విశ్రాంతి కలిగినప్పుడు, వారు మళ్లీ నీ సన్నిధిలో చెడు చేశారు. అందుచేత నీవు వారిని వారి శత్రువుల అధికారానికి అప్పగించావు[a]; వారి శత్రువులు వారిని ఏలారు. అప్పుడు వారు తిరిగి వచ్చి నీకు మొరపెట్టుకున్నారు. నీవు ఆకాశం నుండి విని, నీ కనికరాన్ని బట్టి అనేకసార్లు వారిని విడిపించావు.
  rationale: The revision clarifies that the people first returned and then cried out, avoiding an unintended iterative reading of the cry. It replaces “పరలోకం” with the more source-near “ఆకాశం” and smooths referents in the enemy-rule clause. No interpretive or doctrinal expansion has been added; “అనేకసార్లు” correctly modifies the repeated deliverances, not God’s mercies.
