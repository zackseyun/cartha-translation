id: NEH.9.9
reference: Nehemiah 9:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/תֵּ֛רֶא אֶת עֳנִ֥י אֲבֹתֵ֖י/נוּ בְּ/מִצְרָ֑יִם וְ/אֶת זַעֲקָתָ֥/ם שָׁמַ֖עְתָּ עַל יַם סֽוּף־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/009.yaml
  text: You saw the affliction of our fathers in Egypt[a], and you heard their cry at the Red Sea.
translation:
  language: te
  text: నీవు ఐగుప్తులో మా పితరుల బాధను చూశావు; ఎర్ర సముద్రం[a] దగ్గర వారి మొరను విన్నావు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూలో: “రెల్లుల సముద్రం.” సాంప్రదాయంగా “ఎర్ర సముద్రం” అని అనువదిస్తారు.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּרֶא
  choice: చూశావు
  rationale: ראה అనే క్రియను నేరుగా అనువదిస్తూ, దేవుడు వారి స్థితిని గమనించాడనే సందర్భార్థాన్ని సహజంగా నిలుపుతుంది.
- source_word: עֳנִי
  choice: బాధను
  rationale: దుఃఖం, శ్రమ, అణచివేత వల్ల కలిగిన దయనీయ స్థితి అనే విస్తృత భావాన్ని సాధారణ ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אֲבֹתֵינוּ
  choice: మా పితరుల
  rationale: మూలంలోని పురుష బహువచన రూపాన్ని, సమాజపు పూర్వపితరులను సూచించే ప్రార్థనా సందర్భాన్ని కాపాడుతుంది.
- source_word: בְּמִצְרָיִם
  choice: ఐగుప్తులో
  rationale: స్థలాన్ని సూచించే పదబంధానికి సూటి అనువాదం.
- source_word: זַעֲקָתָם
  choice: వారి మొరను
  rationale: ఆపదలో సహాయం కోరుతూ చేసిన కేక అనే భావాన్ని ‘మొర’ సహజమైన ప్రార్థనా భాషలో అందిస్తుంది.
- source_word: שָׁמַעְתָּ
  choice: విన్నావు
  rationale: שמע యొక్క ప్రాథమిక భావాన్ని నిలుపుతూ, ప్రార్థనలో దేవుడు మొర ఆలకించాడనే అంతర్భావాన్ని అతిగా వివరించదు.
- source_word: עַל
  choice: దగ్గర
  rationale: స్థలపేరుతో వచ్చిన עַל ఇక్కడ సముద్రం వద్ద లేదా సమీపంలో అనే స్థానార్థాన్ని సూచిస్తుంది.
- source_word: יַם סוּף
  choice: ఎర్ర సముద్రం
  rationale: తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన సాంప్రదాయ భౌగోళిక పేరు; మూలంలోని పదశః భావాన్ని పాదటిప్పణిలో ఇస్తున్నాం.
