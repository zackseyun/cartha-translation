  register: ఆధునిక ప్రామాణిక తెలుగులో, సామూహిక ప్రార్థనకు తగిన సరళమైన గంభీర శైలి. ‘పితరులు’ మూలంలోని లింగ-నిర్దిష్ట పదాన్ని నిలుపుతుంది; ‘మొర’ ఆపదలో చేసిన సహాయవిన్నపాన్ని సహజంగా తెలియజేస్తుంది.
