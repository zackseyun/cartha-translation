source:
  edition: WLC
  text: וַ/יָּ֜קָם עַֽל מַֽעֲלֵ֣ה הַ/לְוִיִּ֗ם יֵשׁ֨וּעַ וּ/בָנִ֜י קַדְמִיאֵ֧ל שְׁבַנְיָ֛ה בֻּנִּ֥י שֵׁרֵבְיָ֖ה בָּנִ֣י כְנָ֑נִי וַֽ/יִּזְעֲקוּ֙ בְּ/ק֣וֹל גָּד֔וֹל אֶל יְהוָ֖ה אֱלֹהֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/004.yaml
  text: Then Jeshua[a], Bani, Kadmiel, Shebaniah, Bunni, Sherebiah, Bani, and Kenani stood on the platform of the Levites, and they cried out with a loud voice to Yahweh their God.
translation:
  language: te
  text: అప్పుడు యేషువ, బానీ, కద్మీయేలు, షెబన్యా, బున్నీ, షేరెబ్యా, బానీ, కెనానీ లేవీయుల మెట్లపై[a] నిలబడి, తమ దేవుడైన యాహ్వేకు బిగ్గరగా మొరపెట్టారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పదబంధానికి అక్షరార్థం ‘లేవీయుల ఎక్కే స్థలం/మెట్లు’; ఇది లేవీయులకు సంబంధించిన ఎత్తైన వేదికను లేదా మెట్లదారిని సూచించి ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: నిలబడి
  rationale: קום అనే క్రియ ఇక్కడ నిలబడే చర్యను సూచిస్తుంది. హీబ్రూలో క్రియ ఏకవచనంలో ఉన్నప్పటికీ, తరువాత అనేక మంది పేర్లు రావడం వల్ల తెలుగులో సమూహాన్ని సహజంగా సూచించే విధంగా వాక్యం నిర్మించబడింది.
- source_word: מַעֲלֵה הַלְוִיִּם
  choice: లేవీయుల మెట్లపై
  rationale: מַעֲלֵה అనే పదానికి ఎక్కే దారి, మెట్లు, లేదా ఎత్తైన స్థలం అనే అర్థాలు ఉండవచ్చు. సందర్భాన్ని అతిగా నిర్ణయించకుండా ‘మెట్లు’ అనే మూలార్థానికి దగ్గరైన పదం వాడబడింది; ప్రత్యామ్నాయ భావం పాదసూచికలో ఇవ్వబడింది.
- source_word: יֵשׁוּעַ וּבָנִי קַדְמִיאֵל שְׁבַנְיָה בֻּנִּי שֵׁרֵבְיָה בָּנִי כְנָנִי
  choice: యేషువ, బానీ, కద్మీయేలు, షెబన్యా, బున్నీ, షేరెబ్యా, బానీ, కెనానీ
  rationale: వ్యక్తుల పేర్లు హీబ్రూ రూపాలకు అనుగుణంగా లిప్యంతరీకరించబడ్డాయి. మూలపాఠంలో బానీ పేరు రెండుసార్లు ఉన్నందున రెండుసార్లూ అలాగే ఉంచబడింది; బానీ, బున్నీ అనే వేర్వేరు రూపాల భేదం కూడా నిలుపబడింది.
- source_word: וַיִּזְעֲקוּ
  choice: మొరపెట్టారు
  rationale: זעק తీవ్రమైన కేకను, ముఖ్యంగా దేవునికి చేసే ఆర్త విజ్ఞాపనను సూచించగలదు. ‘మొరపెట్టారు’ తీవ్రతనూ ప్రార్థనాత్మక దిశనూ సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: בְּקוֹל גָּדוֹל
  choice: బిగ్గరగా
  rationale: ‘గొప్ప/పెద్ద స్వరంతో’ అనే హీబ్రూ నుడికారాన్ని సహజమైన ఆధునిక తెలుగులో ‘బిగ్గరగా’ అని వ్యక్తం చేస్తుంది.
- source_word: אֶל יְהוָה
  choice: యాహ్వేకు
  rationale: దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పాండిత్యపూర్వక ఉచ్చారణకు దగ్గరగా ‘యాహ్వే’ అని లిప్యంతరీకరించబడింది.
- source_word: אֱלֹהֵיהֶם
  choice: తమ దేవుడైన
  rationale: మూలంలోని బహువచన స్వామ్యప్రత్యయం వారి దేవునితో ఉన్న సంబంధాన్ని సూచిస్తుంది. తెలుగు వాక్యంలోని కర్తకు తిరిగి సూచించేందుకు ‘తమ’ సహజంగా ఉంటుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా / ప్రభువు
  rationale: మూలపాఠం దేవుని ప్రత్యేక నామాన్ని నేరుగా ఉపయోగిస్తుంది. దానిని బిరుదుగా మార్చకుండా, మూల హీబ్రూ నామానికి దగ్గరైన ‘యాహ్వే’ రూపం వాడబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, బహిరంగ ఆరాధనా సందర్భానికి తగిన గౌరవప్రదమైన శైలి వాడబడింది. పేర్ల జాబితా మరియు మూలపాఠంలోని పునరుక్తి యథాతథంగా నిలుపబడ్డాయి.
