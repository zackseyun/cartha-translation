revisions:
- from: నీవు సీనాయి పర్వతం మీదికి దిగి వచ్చి, ఆకాశం నుండి వారితో మాట్లాడావు; వారికి న్యాయమైన తీర్పులను, సత్యమైన ధర్మోపదేశాలను,[a] మంచి కట్టడలను, ఆజ్ఞలను ఇచ్చావు.
  to: నీవు సీనాయి పర్వతంపైకి దిగి వచ్చి, ఆకాశం నుండి వారితో మాట్లాడావు; వారికి న్యాయమైన తీర్పులను, సత్యమైన ధర్మోపదేశాలను,[a] మంచి విధులనూ ఆజ్ఞలనూ ఇచ్చావు.
  rationale: The revision retains the draft’s faithful rendering of the Sinai descent and speech from heaven, as well as its differentiated legal vocabulary. It replaces a potentially misleading modern term for statutes and explicitly extends ‘మంచి’ to both statutes and commandments, as required by the Hebrew syntax.
