source:
  edition: WLC
  text: וְ/עַ֤ל הַר סִינַי֙ יָרַ֔דְתָּ וְ/דַבֵּ֥ר עִמָּ/הֶ֖ם מִ/שָּׁמָ֑יִם וַ/תִּתֵּ֨ן לָ/הֶ֜ם מִשְׁפָּטִ֤ים יְשָׁרִים֙ וְ/תוֹר֣וֹת אֱמֶ֔ת חֻקִּ֥ים וּ/מִצְוֺ֖ת טוֹבִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/013.yaml
  text: You came down on Mount Sinai and spoke with them from heaven[a], and you gave them upright judgments, true laws[c][b], good statutes and commandments.
translation:
  language: te
  text: నీవు సీనాయి పర్వతంపైకి దిగి వచ్చి, ఆకాశం నుండి వారితో మాట్లాడావు; వారికి న్యాయమైన తీర్పులను, సత్యమైన ధర్మోపదేశాలను,[a] మంచి విధులనూ ఆజ్ఞలనూ ఇచ్చావు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సత్యమైన ధర్మశాస్త్రాలను” లేదా “సత్యపు ఉపదేశాలను.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל הַר סִינַי יָרַדְתָּ
  choice: నీవు సీనాయి పర్వతం మీదికి దిగి వచ్చి
  rationale: עַל־הַר స్థలాన్ని సూచిస్తుంది; ירד యొక్క ప్రత్యక్షమైన ‘దిగి వచ్చు’ భావాన్ని దేవునికి చేసిన ద్వితీయ పురుష సంబోధనలో సహజంగా నిలుపుతుంది.
- source_word: וְדַבֵּר עִמָּהֶם מִשָּׁמָיִם
  choice: ఆకాశం నుండి వారితో మాట్లాడావు
  rationale: עִם యొక్క అక్షరార్థమైన ‘తో’ భావాన్ని నిలుపుతూ, מִשָּׁמָיִםను సహజమైన తెలుగులో ‘ఆకాశం నుండి’గా అనువదిస్తుంది.
- source_word: מִשְׁפָּטִים יְשָׁרִים
  choice: న్యాయమైన తీర్పులను
  rationale: מִשְׁפָּטִים యొక్క న్యాయపరమైన ‘తీర్పులు’ భావాన్ని, יְשָׁרִים యొక్క సరిదనం/న్యాయబద్ధతను ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: וְתוֹרוֹת אֱמֶת
  choice: సత్యమైన ధర్మోపదేశాలను
  rationale: బహువచన תּוֹרוֹת ఇక్కడ దేవుడు ఇచ్చిన నియమబోధలను సూచిస్తుంది. ‘ధర్మోపదేశాలు’ అనేది ‘ధర్మశాస్త్రాలు’కన్నా బహువచనంలోని బోధ/నిర్దేశ భావాన్ని మెరుగ్గా నిలుపుతుంది; אֱמֶת వాటి సత్యత్వం, విశ్వసనీయతను సూచిస్తుంది.
- source_word: חֻקִּים
  choice: కట్టడలను
  rationale: స్థిరంగా నిర్దేశించిన శాసనాల భావాన్ని ఇచ్చి, తీర్పులు మరియు ఆజ్ఞలు అనే సమీప న్యాయపదాల నుండి పదభేదాన్ని కాపాడుతుంది.
- source_word: וּמִצְוֺת טוֹבִים
  choice: మంచి … ఆజ్ఞలను
  rationale: מִצְוֺתకు సంప్రదాయబద్ధమైన, స్పష్టమైన ‘ఆజ్ఞలు’ సరిపోతుంది. טוֹבִים చివరి జంటలోని కట్టడలు, ఆజ్ఞలు రెండింటినీ విశేషించేలా తెలుగు వాక్యనిర్మాణం ఉంచబడింది.
theological_decisions:
- issue: సీనాయి వద్ద దేవుడు ఇచ్చిన న్యాయపరమైన పదాల వైవిధ్యం
  choice: ‘తీర్పులు,’ ‘ధర్మోపదేశాలు,’ ‘కట్టడలు,’ ‘ఆజ్ఞలు’ అని నాలుగు పదాలను వేరువేరుగా ఉంచడం
  alternative: జాబితాను ‘నియమాలు, ఆజ్ఞలు’ వంటి కొద్ది సమానార్థకాలుగా కుదించడం
  rationale: హీబ్రూ వాక్యం దేవుని ప్రత్యక్ష ప్రకటన యొక్క సమృద్ధిని నొక్కిచెప్పేందుకు నాలుగు సమీపార్థక న్యాయపదాలను వరుసగా ఉపయోగిస్తుంది. వాటిని వేరుగా ఉంచడం మూలపాఠ్య నిర్మాణాన్ని, భావపరమైన ఒత్తిడిని కాపాడుతుంది.
- issue: וְתוֹרוֹת אֱמֶת యొక్క భావం
  choice: ‘సత్యమైన ధర్మోపదేశాలు’
  alternative: ‘సత్య ధర్మశాస్త్రాలు’ లేదా ‘సత్యపు ఉపదేశాలు’
  rationale: תּוֹרוֹתకు ‘నియమాలు’తో పాటు ‘ఉపదేశాలు/నిర్దేశాలు’ అనే పరిధి ఉంది. న్యాయపరమైన జాబితిలోనూ ఆ విస్తృత భావాన్ని పూర్తిగా కుదించకుండా ‘ధర్మోపదేశాలు’గా ఇచ్చి, ప్రత్యామ్నాయాన్ని అడుగుటలో నమోదు చేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో ప్రార్థనా సందర్భానికి తగిన గౌరవప్రదమైన ద్వితీయ పురుష ఏకవచనాన్ని ఉపయోగించాం. న్యాయపదాల వరుసను కుదించకుండా నిలిపి, అతిగా సంస్కృతీకృతమైన వాక్యనిర్మాణాన్ని నివారించాం.
