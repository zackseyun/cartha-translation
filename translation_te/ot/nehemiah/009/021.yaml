id: NEH.9.21
reference: Nehemiah 9:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אַרְבָּעִ֥ים שָׁנָ֛ה כִּלְכַּלְתָּ֥/ם בַּ/מִּדְבָּ֖ר לֹ֣א חָסֵ֑רוּ שַׂלְמֹֽתֵי/הֶם֙ לֹ֣א בָל֔וּ וְ/רַגְלֵי/הֶ֖ם לֹ֥א בָצֵֽקוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/021.yaml
  text: For forty years you sustained them in the wilderness[a]; they lacked nothing. Their clothes did not wear out[b], and their feet did not swell.
translation:
  language: te
  text: నలభై సంవత్సరాలు అరణ్యంలో నీవు వారిని పోషించావు; వారికి ఏ కొదువా కలగలేదు. వారి వస్త్రాలు అరిగిపోలేదు, వారి పాదాలు వాచిపోలేదు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּלְכַּלְתָּם
  choice: నీవు వారిని పోషించావు
  rationale: כלכל దేవుడు నిరంతరం సమకూర్చి, సంరక్షించి, జీవనాధారం కల్పించిన విస్తృత భావాన్ని ఇక్కడ వ్యక్తం చేస్తుంది. ‘పోషించావు’ ఆ భావాన్ని సహజమైన తెలుగులో అందిస్తుంది; కేవలం ఆహారం పెట్టడానికే పరిమితం చేయదు.
- source_word: בַּמִּדְבָּר
  choice: అరణ్యంలో
  rationale: מִדְבָּר జనావాసం లేని ఎడారి లేదా అరణ్య ప్రాంతాన్ని సూచిస్తుంది. ఇశ్రాయేలీయుల సంచార సందర్భంలో ‘అరణ్యం’ సహజమైన, స్థిరపడిన బైబిలు పదప్రయోగం.
- source_word: לֹא חָסֵרוּ
  choice: వారికి ఏ కొదువా కలగలేదు
  rationale: חסר యొక్క సంపూర్ణ నిరాకరణను ఈ తెలుగు ప్రయోగం సహజంగా వ్యక్తం చేస్తూ, వారికి అవసరమైనదేదీ లోటు కాలేదనే భావాన్ని నిలుపుతుంది.
- source_word: שַׂלְמֹתֵיהֶם
  choice: వారి వస్త్రాలు
  rationale: שַׂלְמָה దుస్తులను, తరచుగా పైవస్త్రాన్ని సూచిస్తుంది. ‘వస్త్రాలు’ ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదంగా, స్పష్టంగా ఉంది.
- source_word: לֹא בָלוּ
  choice: చిరిగిపోలేదు
  rationale: בלה వస్త్రాలు వాడుకవల్ల జీర్ణించి పనికిరాకుండా కావడాన్ని సూచిస్తుంది. ‘చిరిగిపోలేదు’ సాధారణ పాఠకునికి సహజంగా ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: וְרַגְלֵיהֶם לֹא בָצֵקוּ
  choice: వారి పాదాలు వాచిపోలేదు
  rationale: בצק ఇక్కడ పాదాలు ఉబ్బడం లేదా వాచడాన్ని సూచిస్తుంది. ‘వాచిపోలేదు’ సంక్షిప్తమైన, సహజమైన తెలుగు రూపం.
- source_word: וְאַרְבָּעִים שָׁנָה
  choice: నలభై సంవత్సరాలు
  rationale: ప్రారంభ וְ ముందరి వాక్యంతో కొనసాగింపును సూచిస్తుంది; తెలుగులో సందర్భానుసారంగా ప్రత్యేక సంధిపదం లేకుండానే కాలవ్యవధితో వాక్యాన్ని ప్రారంభించడం సహజం.
