- from: నలభై సంవత్సరాలు అరణ్యంలో నీవు వారిని పోషించావు; వారికి ఏ కొదువా కలగలేదు. వారి వస్త్రాలు చిరిగిపోలేదు, వారి పాదాలు వాచిపోలేదు.
  to: నలభై సంవత్సరాలు అరణ్యంలో నీవు వారిని పోషించావు; వారికి ఏ కొదువా కలగలేదు. వారి వస్త్రాలు అరిగిపోలేదు, వారి పాదాలు వాచిపోలేదు.
