translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన వాక్యనిర్మాణం, బైబిలు సందర్భానికి తగిన గౌరవప్రదమైన పదజాలం ఉపయోగించబడింది. మూలపాఠంలో ప్రత్యేకమైన పాఠాంతర లేదా వ్యాఖ్యాత్మక సందిగ్ధత లేకపోవడంతో పాదటిప్పణులు చేర్చలేదు.
