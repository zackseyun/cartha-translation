source:
  edition: WLC
  text: וַֽ/יִּלְכְּד֞וּ עָרִ֣ים בְּצֻרוֹת֮ וַ/אֲדָמָ֣ה שְׁמֵנָה֒ וַ/יִּֽירְשׁ֡וּ בָּתִּ֣ים מְלֵֽאִים כָּל ט֠וּב בֹּר֨וֹת חֲצוּבִ֜ים כְּרָמִ֧ים וְ/זֵיתִ֛ים וְ/עֵ֥ץ מַאֲכָ֖ל לָ/רֹ֑ב וַ/יֹּאכְל֤וּ וַֽ/יִּשְׂבְּעוּ֙ וַ/יַּשְׁמִ֔ינוּ וַ/יִּֽתְעַדְּנ֖וּ בְּ/טוּבְ/ךָ֥ הַ/גָּדֽוֹל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/025.yaml
  text: They captured fortified cities and fertile land[a], and took possession of houses full of every good thing, hewn cisterns, vineyards, olive trees, and fruit trees in abundance. So they ate and were filled and grew fat[c][b], and they delighted themselves in your great goodness.
translation:
  language: te
  text: వారు ప్రాకారాలుగల పట్టణాలను, సారవంతమైన భూమిని[a] స్వాధీనం చేసుకున్నారు. అన్ని రకాల మంచివాటితో నిండిన ఇళ్లను, రాతిలో చెక్కిన నీటి నిల్వ తొట్టెలను, ద్రాక్షతోటలను, ఒలీవ చెట్లను, విస్తారంగా ఉన్న పండ్ల చెట్లను తమ సొంతం చేసుకున్నారు. వారు తిని తృప్తిపడ్డారు[b], బలిసిపోయారు; నీ గొప్ప మంచితనంలో సుఖించారు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా ‘బలిసిన భూమి’; అంటే సుసంపన్నమైన లేదా సారవంతమైన భూమి.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘కడుపునిండా తిన్నారు.’
    reason: lexical_alternative
  - marker: c
    text: లేదా ‘నీ గొప్ప సమృద్ధిలో విలాసంగా జీవించారు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלְכְּדוּ
  choice: స్వాధీనం చేసుకున్నారు
  rationale: לכד పట్టణాలను యుద్ధంలో పట్టుకోవడం లేదా వశపరచుకోవడం సూచిస్తుంది; తెలుగులో ఈ సందర్భానికి సహజంగా సరిపోతుంది.
- source_word: עָרִים בְּצֻרוֹת
  choice: ప్రాకారాలుగల పట్టణాలు
  rationale: בצר యొక్క రక్షణార్థక భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: אֲדָמָה שְׁמֵנָה
  choice: సారవంతమైన భూమి
  rationale: అక్షరార్థంగా ‘బలిసిన భూమి’; ఇది దిగుబడినిచ్చే సుసంపన్న నేలకు హీబ్రూ నుడికారం.
- source_word: וַיִּירְשׁוּ
  choice: తమ సొంతం చేసుకున్నారు
  rationale: ירשׁ ఇక్కడ వారసత్వంగా పొందడం కంటే ప్రవేశించి అధీనపరచుకోవడం అనే భావాన్ని ఇస్తుంది.
- source_word: בָּתִּים מְלֵאִים כָּל טוּב
  choice: అన్ని రకాల మంచివాటితో నిండిన ఇళ్లు
  rationale: כָּל טוּב యొక్క సమగ్ర సంపద, సమృద్ధి భావాన్ని సహజ తెలుగులో నిలుపుతుంది.
- source_word: בֹּרוֹת חֲצוּבִים
  choice: తొలిచిన నీటి తొట్టెలు
  rationale: בּוֹר నీటిని నిల్వచేసే తొట్టి; חצוב రాతిలో తొలిచినదని సూచిస్తుంది. మూలంలో లేని ‘ఇప్పటికే’ అనే భావాన్ని చేర్చలేదు.
- source_word: כְּרָמִים וְזֵיתִים וְעֵץ מַאֲכָל לָרֹב
  choice: ద్రాక్షతోటలు, ఒలీవ చెట్లు, విస్తారంగా ఉన్న పండ్ల చెట్లు
  rationale: వ్యవసాయ సంపదల జాబితాను స్పష్టంగా, సహజంగా అందిస్తూ לָרֹב యొక్క సమృద్ధి భావాన్ని నిలుపుతుంది.
- source_word: וַיֹּאכְלוּ וַיִּשְׂבְּעוּ
  choice: వారు తిని తృప్తిపడ్డారు
  rationale: שׂבע అంటే కడుపునిండడం, సంతృప్తి పొందడం; ‘తృప్తిపడ్డారు’ రెండింటినీ సహజంగా తెలియజేస్తుంది.
- source_word: וַיַּשְׁמִינוּ
  choice: బలిశారు
  rationale: మూలంలోని ‘లావయ్యారు/బలిశారు’ అనే స్పష్టమైన శరీర రూపకాన్ని, దానిలో తప్పనిసరిగా నైతిక తీర్పు చేర్చకుండా నిలుపుతుంది.
- source_word: וַיִּתְעַדְּנוּ
  choice: సుఖించారు
  rationale: עדן యొక్క సుఖభోగం, ఆనందం అనే భావాన్ని సంక్షిప్తంగా అందిస్తుంది.
theological_decisions:
- issue: בְּטוּבְךָ הַגָּדוֹל లో దేవుని ఉపకార స్వభావం
  choice: నీ గొప్ప మంచితనంలో
  alternative: నీ గొప్ప సమృద్ధివల్ల
  rationale: ‘మంచితనం’ దేవుని స్వభావాన్నీ ఆయన ఉదారమైన అనుగ్రహాన్నీ కలిపి ఉంచుతుంది; בְּ ఉపసర్గలోని పరిధి/కారణ అస్పష్టతను ‘లో’ కొంతవరకు నిలుపుతుంది.
- issue: వారి సమృద్ధి వర్ణనలో నైతిక తీర్పు
  choice: బలిశారు; ... సుఖించారు
  alternative: వర్ధిల్లారు; ... ఆనందించారు
  rationale: సందర్భంలో తరువాతి అవిధేయత ఉన్నప్పటికీ, ఈ వాక్యం స్వయంగా దేవుని విస్తారమైన అనుగ్రహంలో వారి భౌతిక తృప్తిని వర్ణిస్తుంది. అందుచేత మూలంలోని బలమైన రూపకాన్ని ప్రతికూల తీర్పుగా మార్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు స్పష్టంగా ఉండే శైలి. వ్యవసాయ, జలసంరక్షణ పదాలకు పరిచితమైన రూపాలు వాడబడ్డాయి; మూలంలోని వరుస క్రియల లయను సాధ్యమైనంతవరకు నిలుపుతూ తెలుగు వాక్యాన్ని రెండు భాగాలుగా విభజించాం.
