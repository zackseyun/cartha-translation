id: NEH.9.11
reference: Nehemiah 9:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הַ/יָּם֙ בָּקַ֣עְתָּ לִ/פְנֵי/הֶ֔ם וַ/יַּֽעַבְר֥וּ בְ/תוֹךְ הַ/יָּ֖ם בַּ/יַּבָּשָׁ֑ה וְֽ/אֶת רֹ֨דְפֵי/הֶ֜ם הִשְׁלַ֧כְתָּ בִ/מְצוֹלֹ֛ת כְּמוֹ אֶ֖בֶן בְּ/מַ֥יִם עַזִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/011.yaml
  text: You split the sea before them[a], and they passed through the midst of the sea on dry ground[b]; and you threw their pursuers into the depths like a stone in mighty waters.
translation:
  language: te
  text: వారి ఎదుట సముద్రాన్ని చీల్చావు[a]; వారు సముద్రం మధ్యగుండా పొడి నేలపై దాటారు. వారిని తరుముకొచ్చినవారిని బలమైన జలాల్లో రాయిలా అగాధాల్లోకి విసిరివేశావు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘సముద్రాన్ని విభజించావు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּקַעְתָּ
  choice: చీల్చావు
  rationale: בקע అనే క్రియకు ‘చీల్చు, విడదీయు’ అనే భౌతిక భావం ఉంది. ‘చీల్చావు’ మూలంలోని సజీవ చిత్రణను సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: לִפְנֵיהֶם
  choice: వారి ఎదుట
  rationale: פנים తో కూడిన ఉపసర్గ ఇక్కడ ‘వారి ముందు/ఎదుట’ అని అర్థం. ప్రార్థనా శైలికి ‘వారి ఎదుట’ సంక్షిప్తంగా, సహజంగా సరిపోతుంది.
- source_word: וַיַּעַבְרוּ
  choice: దాటిపోయారు
  rationale: עבר ఇక్కడ సముద్రాన్ని దాటి వెళ్లడాన్ని సూచిస్తుంది. తరువాతి ‘సముద్రం మధ్యలో’ అనే పదబంధంతో కలిపి ఇది సహజంగా ఉంటుంది.
- source_word: בְתוֹךְ הַיָּם
  choice: సముద్రం మధ్యలో
  rationale: תוךְ సముద్రపు అంతర్భాగాన్ని లేదా మధ్యను సూచిస్తుంది; ఈ రూపం మూలంలోని స్థల చిత్రణను స్పష్టంగా నిలుపుతుంది.
- source_word: בַּיַּבָּשָׁה
  choice: ఆరిన నేల మీదుగా
  rationale: יַבָּשָׁה పొడిగా ఉన్న నేలను సూచిస్తుంది. ‘ఆరిన నేల’ సముద్రపు అడుగు నీరు లేకుండా మారిన అద్భుత స్థితిని స్పష్టంగా తెలియజేస్తుంది.
- source_word: רֹדְפֵיהֶם
  choice: వారిని తరుముకొచ్చినవారిని
  rationale: רדף కృదంతం వెంబడిస్తున్న వారిని సూచిస్తుంది. ‘తరుముకొచ్చినవారు’ నిర్గమ సందర్భంలోని చురుకైన వెంటాడటాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: הִשְׁלַכְתָּ
  choice: విసిరివేశావు
  rationale: שלך హిఫీల్ రూపం ‘విసురు’ అనే ప్రత్యక్ష చర్యను సూచిస్తుంది. ‘విసిరివేశావు’ బలమైన దైవిక చర్యను అతిశయోక్తి లేకుండా తెలుపుతుంది.
- source_word: בִמְצוֹלֹת
  choice: అగాధాల్లోకి
  rationale: מְצוֹלוֹת ముఖ్యంగా సముద్రపు లోతైన ప్రదేశాలను సూచిస్తుంది. ‘అగాధాలు’ కవితాత్మక గంభీరతతో పాటు ఆ లోతును నిలుపుతుంది.
- source_word: כְּמוֹ אֶבֶן
  choice: పడిన రాయిలా
  rationale: సాధారణ ఉపమానం ‘రాయిలా’గా నిలుపబడింది; తెలుగులో గమన సంబంధాన్ని స్పష్టంచేయడానికి ‘పడిన’ చేర్చబడింది, కానీ కొత్త ఫలితాన్ని జోడించదు.
- source_word: בְּמַיִם עַזִּים
  choice: బలమైన జలాల్లో
  rationale: עַזִּים అంటే ‘బలమైన, శక్తిమంతమైన.’ ‘బలమైన జలాలు’ మూలంలోని భావాన్ని నిలుపుతూ ‘ఉగ్రంగా పొంగే’ వంటి అదనపు వ్యాఖ్యానాన్ని చేర్చదు; ב ఉపసర్గను ‘లో’గా ప్రతిబింబిస్తుంది.
theological_decisions:
- issue: నిర్గమ కార్యంలో దేవుని ప్రత్యక్ష చర్య
  choice: ‘చీల్చావు’, ‘విసిరివేశావు’ అనే ప్రత్యక్ష ద్వితీయ పురుష ఏకవచన రూపాలను నిలుపడం
  alternative: కర్తను అస్పష్టంగా చేసే లేదా చర్యను పరోక్షంగా చెప్పే అనువాదం
  rationale: ఈ వాక్యం సమాజ ప్రార్థనలో దేవుని చారిత్రక రక్షణ కార్యాలను నేరుగా సంబోధిస్తూ జ్ఞాపకం చేస్తుంది. మూలంలోని ప్రత్యక్ష దైవిక చర్యను వ్యాఖ్యానం జోడించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామూహిక ప్రార్థనకు తగిన గంభీరమైన కాని సులభంగా అర్థమయ్యే శైలి. మూలంలోని సమాంతర చర్యలు, సముద్రం–ఆరిన నేల–అగాధాలు అనే చిత్రణ, దేవునికి ప్రత్యక్ష సంబోధన నిలుపబడ్డాయి.
