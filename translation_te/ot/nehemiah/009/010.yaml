  text: וַ֠/תִּתֵּן אֹתֹ֨ת וּ/מֹֽפְתִ֜ים בְּ/פַרְעֹ֤ה וּ/בְ/כָל עֲבָדָי/ו֙ וּ/בְ/כָל עַ֣ם אַרְצ֔/וֹ כִּ֣י יָדַ֔עְתָּ כִּ֥י הֵזִ֖ידוּ עֲלֵי/הֶ֑ם וַ/תַּֽעַשׂ לְ/ךָ֥ שֵׁ֖ם כְּ/הַ/יּ֥וֹם הַ/זֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/010.yaml
  text: You performed signs and wonders against Pharaoh[a], against all his servants, and against all the people of his land, for you knew that they acted presumptuously against them. So you made a name for yourself, as it is to this day.
translation:
  language: te
  text: నీవు ఫరోకు వ్యతిరేకంగా, అతని సేవకులందరికీ వ్యతిరేకంగా, అతని దేశ ప్రజలందరికీ వ్యతిరేకంగా సూచక కార్యాలనూ అద్భుతాలనూ చేశావు. వారు వారిపట్ల దురహంకారంగా ప్రవర్తించారని[a] నీకు తెలుసు. ఈ విధంగా నీవు నీకు పేరు చేసుకున్నావు; అది ఈనాటికీ అలాగే ఉంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘గర్వంగా ప్రవర్తించారని’ లేదా ‘తెగింపుతో వ్యవహరించారని.’ హీబ్రూ క్రియ గర్వంగా, ధిక్కారంగా లేదా మితిమీరిన తెగింపుతో ప్రవర్తించడాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּתֵּן
  choice: చేశావు
  rationale: మూల క్రియ అక్షరార్థంగా ‘ఇచ్చావు’ అయినా, ‘సూచక క్రియలు, అద్భుతాలు’ అనే కర్మలతో తెలుగులో ‘చేశావు’ సహజంగా ఉండి దేవుని కార్యాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: אֹתֹת וּמֹפְתִים
  choice: సూచక క్రియలనూ అద్భుతాలనూ
  rationale: אֹתֹת యొక్క సూచనాత్మక భావాన్ని ‘సూచక క్రియలు’, מֹפְתִים యొక్క ఆశ్చర్యకర కార్యాల భావాన్ని ‘అద్భుతాలు’ తెలియజేస్తాయి.
- source_word: בְּפַרְעֹה ... וּבְכָל עַם אַרְצוֹ
  choice: ఫరోకు, అతని సేవకులందరికీ, అతని దేశ ప్రజలందరికీ వ్యతిరేకంగా
  rationale: ఇక్కడ בְּ తీర్పు కార్యాలు ఎవరికి వ్యతిరేకంగా జరిగాయో సూచిస్తుంది. ఒకే ‘వ్యతిరేకంగా’ పదాన్ని వరుసలోని మూడు అంశాలకూ వర్తింపజేయడం తెలుగులో సహజం.
- source_word: עֲבָדָיו
  choice: అతని సేవకులు
  rationale: రాజసభ సందర్భంలో ఈ పదం అధికారులు లేదా పరిచారకులను సూచించవచ్చు. ‘సేవకులు’ హోదాను అతిగా నిర్దిష్టం చేయకుండా విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: הֵזִידוּ
  choice: దురహంకారంతో ప్రవర్తించారు
  rationale: ఈ హిఫీల్ రూపం గర్వంతో, ధిక్కారంతో లేదా తెగింపుతో ప్రవర్తించడాన్ని సూచిస్తుంది. ‘దురహంకారంతో’ దాని ప్రతికూల నైతిక స్వరాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: וַתַּעַשׂ לְךָ שֵׁם
  choice: నీవు సంపాదించుకున్న పేరు
  rationale: ‘నీ కోసం పేరు చేసుకున్నావు’ అనే హీబ్రూ నుడికారానికి తెలుగులో ‘పేరు సంపాదించుకున్నావు’ సహజ సమానార్థక ప్రయోగం.
- source_word: כְּהַיּוֹם הַזֶּה
  choice: ఈనాటికీ నిలిచివుంది
  rationale: ఆ పేరు లేదా కీర్తి వక్తల వర్తమాన కాలం వరకూ కొనసాగుతోందనే కాలసంబంధ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ‘వారు వారిపట్ల’ అనే మాటల్లో సర్వనామాల సూచితులు
  choice: సర్వనామాలను అలాగే ఉంచి, ఐగుప్తీయులు ఇశ్రాయేలీయులపట్ల దురహంకారంగా ప్రవర్తించారనే సందర్భార్థాన్ని పాఠకునికి వదిలివేయడం
  alternative: ‘ఐగుప్తీయులు నీ ప్రజలపట్ల’ అని సూచితులను స్పష్టంగా పేరుపెట్టి అనువదించడం
  rationale: నిర్గమ సందర్భంలో మొదటి సర్వనామం ఫరో మరియు అతని ప్రజలను, రెండవది ఇశ్రాయేలీయులను సూచించడం అత్యంత సహజం. అయితే హీబ్రూ పాఠం పేర్లను చెప్పకుండా సర్వనామాలనే వాడుతుంది; అందువల్ల అనువాదం ఆ అంతర్నిహితత్వాన్ని కాపాడుతుంది.
- issue: దురహంకారం ఎవరికి వ్యతిరేకంగా చూపబడింది
  choice: עֲלֵיהֶם ను ‘వారిపట్ల’గా అనువదించి మానవ బాధితులనే ప్రత్యక్ష సూచితులుగా ఉంచడం
  alternative: దేవునికి వ్యతిరేకంగా చేసిన ధిక్కారంగా స్పష్టీకరించడం
  rationale: వ్యాకరణపరంగా బహువచన ప్రత్యయం ఇశ్రాయేలీయులను సహజంగా సూచిస్తుంది. ఆ ప్రవర్తన దేవునికీ ధిక్కారమే కావచ్చును గాని, దానిని ప్రధాన పాఠంలో చేర్చడం మూలంలో లేని వివరణ అవుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన ప్రార్థనా శైలిని ఉపయోగించాం. దేవునిని సంబోధించే ఏకవచన రూపాలు ‘నీవు/నీకు’గా ఉన్నాయి. పొడవైన హీబ్రూ వాక్యాన్ని తెలుగులో స్పష్టత కోసం మూడు వాక్యాలుగా విభజించినా, కారణ సంబంధాన్నీ ఫలితాన్నీ నిలిపాం.
