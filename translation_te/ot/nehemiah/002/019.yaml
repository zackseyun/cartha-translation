source:
  edition: WLC
  text: וַ/יִּשְׁמַע֩ סַנְבַלַּ֨ט הַ/חֹרֹנִ֜י וְ/טֹבִיָּ֣ה הָ/עֶ֣בֶד הָֽ/עַמּוֹנִ֗י וְ/גֶ֨שֶׁם֙ הָֽ/עַרְבִ֔י וַ/יַּלְעִ֣גוּ לָ֔/נוּ וַ/יִּבְז֖וּ עָלֵ֑י/נוּ וַ/יֹּאמְר֗וּ מָֽה הַ/דָּבָ֤ר הַ/זֶּה֙ אֲשֶׁ֣ר אַתֶּ֣ם עֹשִׂ֔ים הַ/עַ֥ל הַ/מֶּ֖לֶךְ אַתֶּ֥ם מֹרְדִֽים׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/019.yaml
  text: But when Sanballat the Horonite[a], Tobiah the Ammonite servant, and Geshem the Arab heard, they mocked us and despised us, and said, “What is this thing that you are doing? Are you rebelling against the king?”
translation:
  language: te
  text: అయితే హోరోనీయుడైన సన్బల్లటు, అమ్మోనీయుడైన దాసుడు[a] టోబీయా, అరబీయుడైన గెషెము విన్నప్పుడు, వారు మమ్మల్ని ఎగతాళి చేసి చులకనగా చూశారు. “మీరు చేస్తున్న ఈ పని ఏమిటి? మీరు రాజుకు వ్యతిరేకంగా తిరుగుబాటు చేస్తున్నారా?” అని అడిగారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పదాన్ని “సేవకుడు” అని కూడా అనువదించవచ్చు; కొందరు ఈ గుర్తింపును విస్తృత అర్థంలో అధికార పదవీబిరుదుగా భావిస్తారు.
    reason: עֶבֶד యొక్క ప్రత్యామ్నాయ అనువాదాన్ని, అలాగే ఇది అధికార బిరుదు కావచ్చనే అనిశ్చితిని సూచిస్తుంది.
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: అయితే ... విన్నప్పుడు
  rationale: వావ్-వరుస కథనాన్ని ముందుకు నడిపిస్తుంది; ముందు జరిగిన పురోగతికి విరుద్ధంగా వచ్చిన శత్రుత్వ స్పందనను తెలుగులో సహజంగా కలపడానికి ‘అయితే ... విన్నప్పుడు’ వాడాం. హీబ్రూలో వినబడిన విషయం స్పష్టంగా చెప్పబడనందున తెలుగులోనూ కర్మను చేర్చలేదు.
- source_word: הַחֹרֹנִי
  choice: హోరోనీయుడు
  rationale: ఇది సన్బల్లటుకు సంబంధించిన భౌగోళిక లేదా జాతిసూచక బిరుదు; దానిని పేరుతో అనుసంధానించిన గుర్తింపుగా ఉంచాం.
- source_word: הָעֶבֶד הָעַמּוֹנִי
  choice: అమ్మోనీయుడైన సేవకుడు
  rationale: עֶבֶד సేవకుడు లేదా దాసుడు అనే స్థితిని సూచించవచ్చు; ఈ వ్యక్తిగత గుర్తింపులో సహజమైన ‘సేవకుడు’ను ప్రధాన పాఠ్యంలో వాడి, పదంలోని విస్తృత అవకాశాన్ని పాదసూచికలో నిలిపాం.
- source_word: הָעַרְבִי
  choice: అరబీయుడు
  rationale: గెషెముకు సంబంధించిన జాతి లేదా ప్రాంతీయ గుర్తింపును సూటిగా తెలిపే ఆధునిక తెలుగు రూపం.
- source_word: וַיַּלְעִגוּ לָנוּ
  choice: మమ్మల్ని ఎగతాళి చేశారు
  rationale: ఈ క్రియలోని పరిహాసం, అపహాస్యం అనే శత్రుత్వ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וַיִּבְזוּ עָלֵינוּ
  choice: తృణీకరించారు
  rationale: చులకనగా చూడడం, అవమానకరంగా తిరస్కరించడం అనే బలమైన భావాన్ని, ముందున్న ‘ఎగతాళి’తో సమాంతరంగా నిలుపుతుంది.
- source_word: מָה הַדָּבָר הַזֶּה אֲשֶׁר אַתֶּם עֹשִׂים
  choice: మీరు చేస్తున్న ఈ పని ఏమిటి?
  rationale: హీబ్రూ ప్రశ్నలోని ప్రత్యక్షతను కాపాడుతూ ఆధునిక తెలుగులో సహజంగా పలికే రూపం.
- source_word: הַעַל הַמֶּלֶךְ אַתֶּם מֹרְדִים
  choice: మీరు రాజుకు వ్యతిరేకంగా తిరుగుబాటు చేస్తున్నారా?
  rationale: ఇది ఆరోపణతో కూడిన ప్రశ్న. על ను ‘రాజుకు వ్యతిరేకంగా’ అని, కొనసాగుతున్న చర్యను ‘తిరుగుబాటు చేస్తున్నారా’ అని వ్యక్తపరిచాం.
theological_decisions:
- issue: టోబీయా గుర్తింపులో עֶבֶד పదం
  choice: సేవకుడు
  alternative: దాసుడు; లేదా అధికార పదవీబిరుదు
  rationale: ఈ సందర్భంలో పదం బానిసత్వ స్థితిని తప్పనిసరిగా నిర్ధారించదు; వ్యక్తి గుర్తింపుగా లేదా అధికార సంబంధిత బిరుదుగా కూడా గ్రహించబడింది. అందువల్ల ప్రధాన పాఠ్యంలో సహజమైన ‘సేవకుడు’ను వాడి, మూలంలోని అనిశ్చితిని పాదసూచికలో స్పష్టంగా ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని వాడాం. జాతి/ప్రాంతీయ బిరుదులను పేర్లతో స్పష్టంగా అనుసంధానించాం; ప్రశ్నలలోని ఎగతాళి మరియు రాజద్రోహ ఆరోపణ స్వరాన్ని మృదువుపరచలేదు.
