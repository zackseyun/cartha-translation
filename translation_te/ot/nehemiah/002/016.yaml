id: NEH.2.16
reference: Nehemiah 2:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הַ/סְּגָנִ֗ים לֹ֤א יָדְעוּ֙ אָ֣נָה הָלַ֔כְתִּי וּ/מָ֖ה אֲנִ֣י עֹשֶׂ֑ה וְ/לַ/יְּהוּדִ֨ים וְ/לַ/כֹּהֲנִ֜ים וְ/לַ/חֹרִ֣ים וְ/לַ/סְּגָנִ֗ים וּ/לְ/יֶ֨תֶר֙ עֹשֵׂ֣ה הַ/מְּלָאכָ֔ה עַד כֵּ֖ן לֹ֥א הִגַּֽדְתִּי־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/016.yaml
  text: But the officials did not know where I had gone or what I was doing[a], and until then I had not told the Jews, the priests, the nobles, the officials, or the rest who were doing the work.
translation:
  language: te
  text: అయితే అధికారులు నేను ఎక్కడికి వెళ్లానో, ఏమి చేస్తున్నానో తెలుసుకోలేదు. అప్పటివరకు యూదులకు[a], యాజకులకు, ప్రముఖులకు, అధికారులకు, పని చేస్తున్న మిగతావారికి నేను ఏమీ చెప్పలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘యూదయవాసులకు.’ హీబ్రూ పదం యూదయ ప్రాంత ప్రజలను లేదా విస్తృతంగా యూద సమాజాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַסְּגָנִים
  choice: అధికారులు
  rationale: పరిపాలనలో అధికారం గల కింది స్థాయి పాలకులు లేదా అధికారులను సూచిస్తుంది; నిర్దిష్ట పారసీక బిరుదును అనవసరంగా విధించకుండా ఆధునిక తెలుగులో స్పష్టంగా ఉంటుంది.
- source_word: יָדְעוּ
  choice: తెలుసుకోలేదు
  rationale: ידע అనే సాధారణ ‘తెలుసు’ భావాన్ని కథన సందర్భానికి సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אָנָה הָלַכְתִּי
  choice: నేను ఎక్కడికి వెళ్లానో
  rationale: אָנָה గమ్యాన్ని సూచిస్తుంది; తెలుగులో ‘ఎక్కడికి వెళ్లానో’ దాని దిశాభావాన్ని సహజంగా నిలుపుతుంది.
- source_word: וּמָה אֲנִי עֹשֶׂה
  choice: ఏమి చేస్తున్నానో
  rationale: వర్తమాన కృదంతం కొనసాగుతున్న కార్యాన్ని సూచిస్తుంది; ‘చేస్తున్నానో’ ఆ భావాన్ని నిలుపుతుంది.
- source_word: לַיְּהוּדִים
  choice: యూదులకు
  rationale: יְהוּדִיםకు సాధారణంగా అర్థమయ్యే తెలుగు రూపం; ప్రాంతీయంగా ‘యూదయవాసులు’ అనే భావం కూడా సాధ్యమని పాదసూచికలో ఉంచబడింది.
- source_word: לַכֹּהֲנִים
  choice: యాజకులకు
  rationale: כֹּהֲנִיםకు ప్రామాణికమైన, సహజమైన తెలుగు సమానం.
- source_word: לַחֹרִים
  choice: ప్రముఖులకు
  rationale: ఈ సామాజిక-పరిపాలనా సందర్భంలో ఉన్నత వర్గానికి లేదా నాయక స్థానంలో ఉన్నవారికి సూచన; ‘ప్రముఖులు’ సాధారణ పాఠకులకు స్పష్టంగా ఉండి వంశపారంపర్య కులీనత్వాన్ని అతిగా నిర్ధారించదు.
- source_word: וּלְיֶתֶר עֹשֵׂה הַמְּלָאכָה
  choice: పని చేస్తున్న మిగతావారికి
  rationale: יֶתֶר యొక్క ‘మిగిలినవారు’ భావాన్ని, సమూహార్థక కృదంతంలోని కార్యనిరత భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: עַד כֵּן
  choice: అప్పటివరకు
  rationale: ఆ సమయం దాకా నెహెమ్యా విషయం వెల్లడించలేదనే కాలపరిమితిని సంక్షిప్తంగా తెలుపుతుంది.
- source_word: לֹא הִגַּדְתִּי
  choice: నేను ఏమీ చెప్పలేదు
  rationale: నామవర్గాల తరువాత ప్రత్యక్ష కర్మ లేకపోయినా, తెలుగులో ‘ఏమీ చెప్పలేదు’ సమాచారం వెల్లడించకపోవడాన్ని సహజంగా వ్యక్తం చేస్తుంది.
