translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన కథన శైలి పాటించబడింది. హీబ్రూ జాబితా క్రమం నిలుపబడింది; మొదటి వాక్యంలోని సంయోజక నిర్మాణం తెలుగులో సహజంగా ఉండేందుకు సమాంతర ‘-నో’ రూపాలతో వ్యక్తం చేయబడింది.
