  text: וָ/אַגִּ֨יד לָ/הֶ֜ם אֶת יַ֣ד אֱלֹהַ֗/י אֲשֶׁר הִיא֙ טוֹבָ֣ה עָלַ֔/י וְ/אַף דִּבְרֵ֥י הַ/מֶּ֖לֶךְ אֲשֶׁ֣ר אָֽמַר לִ֑/י וַ/יֹּֽאמְרוּ֙ נָק֣וּם וּ/בָנִ֔ינוּ וַ/יְחַזְּק֥וּ יְדֵי/הֶ֖ם לַ/טּוֹבָֽה־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/018.yaml
  text: So I told them that the hand of my God was good upon me[a], and also the words of the king that he had spoken to me. And they said[c][b], “Let us rise up and build.” So they strengthened their hands for the good work.
translation:
  language: te
  text: నా దేవుని చేయి నాకు అనుకూలంగా ఉందని[a], అలాగే రాజు నాతో చెప్పిన మాటలను కూడా వారికి తెలియజేశాను. వారు, “మనం లేచి నిర్మిద్దాం”[b] అన్నారు. మంచి పని కోసం తమ చేతులను బలపరచుకున్నారు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నా దేవుని చేయి నాకు మేలుగా ఉందని” లేదా “నా దేవుడు నాపట్ల కృప చూపాడని.” హీబ్రూలో అక్షరార్థంగా, “నా మీద మంచిగా ఉంది.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “మనం లేచి కడదాం.”
    reason: lexical_alternative
  - marker: c
    text: హీబ్రూలో అక్షరార్థంగా, “మంచి కోసం తమ చేతులను బలపరచుకున్నారు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאַגִּיד
  choice: అప్పుడు ... వారికి తెలియజేశాను
  rationale: వావ్-క్రమ రూపం కథనాన్ని ముందుకు నడిపిస్తుంది. ఈ సందర్భంలో נָגַד అంటే ప్రజలకు వివరంగా తెలియజేయడం; ‘అప్పుడు’ సహజమైన తెలుగు కథన ప్రవాహాన్ని ఇస్తుంది.
- source_word: יַד אֱלֹהַי
  choice: నా దేవుని చెయ్యి
  rationale: దేవుని క్రియాశీల సహాయం లేదా అనుగ్రహాన్ని సూచించే హీబ్రూ రూపకాన్ని వ్యాఖ్యానించి తొలగించకుండా ‘చెయ్యి’గా నిలుపుతుంది.
- source_word: אֲשֶׁר הִיא טוֹבָה עָלַי
  choice: నాకు మేలుగా ఉందని
  rationale: ‘నా మీద మంచిగా ఉంది’ అనే అక్షరార్థ రూపం తెలుగులో అసహజంగా ఉండటం వల్ల, దేవుని చెయ్యి అనే రూపకాన్ని ఉంచుతూనే טוֹבָה עָלַי భావాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: וְאַף
  choice: కూడా
  rationale: దేవుని చెయ్యి గురించిన సాక్ష్యానికి రాజు చెప్పిన మాటలను రెండవ అంశంగా జోడిస్తుంది.
- source_word: דִּבְרֵי הַמֶּלֶךְ אֲשֶׁר אָמַר לִי
  choice: రాజు నాతో చెప్పిన మాటలను
  rationale: ‘మాటలు’ అనే మూలపదాన్ని, సంబంధ వాక్య నిర్మాణాన్ని నిలుపుతూ సహజమైన తెలుగు పదక్రమాన్ని ఉపయోగిస్తుంది.
- source_word: נָקוּם וּבָנִינוּ
  choice: మనం లేచి కడదాం
  rationale: మొదటి పురుష బహువచన రూపాలు ఇక్కడ సమూహ సంకల్పం/ప్రోత్సాహాన్ని వ్యక్తం చేస్తున్నాయి. ‘కడదాం’ ఆ సమిష్టి పిలుపును సహజంగా తెలియజేస్తుంది.
- source_word: וַיְחַזְּקוּ יְדֵיהֶם
  choice: తమ చేతులను బలపరచుకున్నారు
  rationale: ధైర్యం తెచ్చుకున్నారు అని పూర్తిగా భావానువాదం చేయకుండా, హీబ్రూలోని ‘చేతులను బలపరచడం’ అనే రూపకాన్ని నిలుపుతుంది.
- source_word: לַטּוֹבָה
  choice: ఆ మంచి పని కోసం
  rationale: సందర్భంలో ‘మంచి’ అనేది పునర్నిర్మాణ కార్యాన్ని సూచిస్తుంది. ‘ఆ’ ముందు ప్రస్తావించిన కట్టే పనితో సంబంధాన్ని స్పష్టం చేస్తుంది.
theological_decisions:
- issue: ‘నా దేవుని చెయ్యి నాకు మేలుగా ఉంది’ అనే దైవక్రియ రూపకం
  choice: దేవుని క్రియాశీల సహాయాన్ని సూచించే ‘చెయ్యి’ రూపకాన్ని ప్రధాన పాఠ్యంలో నిలుపడం
  alternative: నా దేవుడు నాకు అనుగ్రహం చూపాడని
  rationale: నెహెమ్యా విజయానికి దైవక్రియతో పాటు రాజసహాయం కూడా ఉందని వాక్యం చూపుతుంది. ‘చెయ్యి’ని నిలపడం ద్వారా దేవుని ప్రమేయ విధానాన్ని అతిగా నిర్వచించకుండా మూలపాఠ్యపు ధార్మిక రూపకాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే కథన శైలి. ‘చెయ్యి/చేతులు’ రూపకాలను మూల హీబ్రూకు అనుగుణంగా నిలిపి, అసహజమైన పదప్రతిపద నిర్మాణాన్ని మాత్రమే సహజీకరించాం.
