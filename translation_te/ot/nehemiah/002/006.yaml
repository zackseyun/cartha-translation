id: NEH.2.6
reference: Nehemiah 2:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ לִ֨/י הַ/מֶּ֜לֶךְ וְ/הַ/שֵּׁגַ֣ל יוֹשֶׁ֣בֶת אֶצְל֗/וֹ עַד מָתַ֛י יִהְיֶ֥ה מַֽהֲלָכֲ/ךָ֖ וּ/מָתַ֣י תָּשׁ֑וּב וַ/יִּיטַ֤ב לִ/פְנֵֽי הַ/מֶּ֨לֶךְ֙ וַ/יִּשְׁלָחֵ֔/נִי וָֽ/אֶתְּנָ֥/ה ל֖/וֹ זְמָֽן׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/006.yaml
  text: Then the king said to me[a], while the queen was sitting beside him, “How long will your journey be, and when will you return?” So it pleased the king to send me, and I gave him a time.
translation:
  language: te
  text: అప్పుడు రాజు నాతో—రాణి[a] అతని పక్కన కూర్చొని ఉండగా—“నీ ప్రయాణం ఎంతకాలం ఉంటుంది? నువ్వు ఎప్పుడు తిరిగి వస్తావు?” అని అడిగాడు. నన్ను పంపడం రాజుకు సమ్మతమైంది; నేను అతనికి ఒక గడువు చెప్పాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “రాజసహచరి,” “రాజపత్ని.” హీబ్రూ పదం రాజుకు చెందిన రాజస్థాయి సహచరిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמֶּלֶךְ
  choice: రాజు
  rationale: కథన సందర్భంలో రాజ్యాధికారిని సూచించే מֶלֶךְ పదానికి సహజమైన ప్రామాణిక తెలుగు రూపం.
- source_word: הַשֵּׁגַל
  choice: రాణి
  rationale: అరుదైన ఈ హీబ్రూ పదం రాజుకు చెందిన రాజస్థాయి సహచరిని లేదా భార్యను సూచిస్తుంది. ప్రధాన పాఠ్యంలో సహజమైన ‘రాణి’ని ఉంచి, మరింత నిర్దిష్టమైన భావాన్ని పాదటీపులో తెలిపాం.
- source_word: יוֹשֶׁבֶת אֶצְלוֹ
  choice: అతని పక్కన కూర్చొని ఉండగా
  rationale: వర్తమాన కృదంతం తెలిపే కొనసాగుతున్న భంగిమను, సందర్భాన్ని ఏర్పరచే ఉపవాక్యంగా సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: עַד מָתַי יִהְיֶה מַהֲלָכֲךָ
  choice: నీ ప్రయాణం ఎంతకాలం ఉంటుంది?
  rationale: ప్రయాణం సాగే కాలవ్యవధిని అడిగే హీబ్రూ ప్రశ్నను సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: וּמָתַי תָּשׁוּב
  choice: నువ్వు ఎప్పుడు తిరిగి వస్తావు?
  rationale: שׁוּב యొక్క ‘తిరిగి రావడం’ అనే సాధారణ అర్థాన్ని నేరుగా, స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: וַיִּיטַב לִפְנֵי הַמֶּלֶךְ
  choice: రాజుకు సమ్మతమైంది
  rationale: అక్షరార్థంగా ‘రాజు ఎదుట మంచిగా అనిపించింది’ అనే హీబ్రూ నుడికారానికి, రాజు ఆమోదించాడనే భావాన్ని తెలిపే సహజమైన తెలుగు రూపం.
- source_word: וַיִּשְׁלָחֵנִי
  choice: నన్ను పంపడం
  rationale: ముందున్న ఆమోద నుడికారంతో కలిపి, రాజు నెహెమ్యాను పంపడానికి సమ్మతించాడనే వాక్యసంబంధాన్ని తెలుగులో సాఫీగా చూపుతుంది.
- source_word: וָאֶתְּנָה לוֹ זְמָן
  choice: నేను అతనికి ఒక గడువు చెప్పాను
  rationale: זְמָן ఇక్కడ నిర్ణీత కాలాన్ని సూచిస్తుంది. తెలుగు వాడుకలో ‘గడువు చెప్పాను’ అనేది రాజుకు తిరిగివచ్చే నిర్ణీత సమయపరిమితిని తెలిపాడనే భావాన్ని సహజంగా అందిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథనశైలిని పాటించాం. రాజు నెహెమ్యాతో నేరుగా మాట్లాడుతున్నందున సంభాషణలో సహజమైన ఏకవచన ‘నీ/నువ్వు’ రూపాలను వాడాం. హీబ్రూ వాక్యంలోని సందర్భసూచక భాగాన్ని దీర్ఘ విరామచిహ్నాల మధ్య ఉంచి స్పష్టతను కాపాడాం.
