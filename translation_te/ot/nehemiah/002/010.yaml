id: NEH.2.10
reference: Nehemiah 2:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּשְׁמַ֞ע סַנְבַלַּ֣ט הַ/חֹרֹנִ֗י וְ/טֽוֹבִיָּה֙ הָ/עֶ֣בֶד הָֽ/עַמֹּנִ֔י וַ/יֵּ֥רַע לָ/הֶ֖ם רָעָ֣ה גְדֹלָ֑ה אֲשֶׁר בָּ֥א אָדָ֔ם לְ/בַקֵּ֥שׁ טוֹבָ֖ה לִ/בְנֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/010.yaml
  text: When Sanballat the Horonite and Tobiah the Ammonite servant heard this[b][a], it was very displeasing to them that a man had come to seek the welfare of the children of Israel.
translation:
  language: te
  text: హోరోనీయుడైన సన్బల్లటు, అమ్మోనీయుడైన దాసుడు టోబీయా ఇది విన్నప్పుడు, ఇశ్రాయేలు ప్రజల మేలు కోరడానికి ఒక మనిషి వచ్చాడని వారికి చాలా చెడుగా అనిపించింది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “వారికి అది మహా కీడుగా అనిపించింది”; హీబ్రూ పాఠం ‘చెడు/కీడు’ పదవర్గాన్ని పునరుక్తి చేసి తీవ్రతను తెలియజేస్తుంది.
    reason: మూలంలోని పదపునరుక్తిని, ప్రత్యామ్నాయ అక్షరార్థ అనువాదాన్ని చూపించడానికి.
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: ఇది విన్నప్పుడు
  rationale: క్రియకు మౌలిక అర్థం ‘విన్నాడు’; ముందు వచనంలోని నెహెమ్యా రాకను సూచించడానికి తెలుగులో సహజంగా ‘ఇది’ చేర్చబడింది.
- source_word: הַחֹרֹנִי
  choice: హోరోనీయుడైన
  rationale: సన్బల్లటు ఏ ప్రాంతానికి చెందినవాడో తెలిపే జాత్యనామ/స్థలనామ విశేషణాన్ని సంప్రదాయ రూపంలో ఉంచుతుంది.
- source_word: הָעֶבֶד
  choice: దాసుడు
  rationale: עבד అనే పదంలోని సేవకత్వం లేదా బద్ధస్థితిని ‘అధికారి’ వంటి వ్యాఖ్యానాత్మక పదంతో మార్చకుండా నేరుగా వ్యక్తపరుస్తుంది.
- source_word: הָעַמֹּנִי
  choice: అమ్మోనీయుడైన
  rationale: టోబీయా జాతీయ గుర్తింపును తెలిపే విశేషణానికి సహజమైన తెలుగు రూపం.
- source_word: וַיֵּרַע לָהֶם רָעָה גְדֹלָה
  choice: వారికి ఎంతో బాధ కలిగించింది
  rationale: హీబ్రూలోని ‘చెడు/కీడు’ పదపునరుక్తి తీవ్రమైన అసంతృప్తిని సూచిస్తుంది; ప్రధాన పాఠంలో సహజమైన తెలుగును వాడి, మూల నిర్మాణాన్ని పాదసూచికలో తెలిపాం.
- source_word: אָדָם
  choice: ఒక మనిషి
  rationale: సందర్భంలో నెహెమ్యా అనే ఒక పురుషుణ్ణి సూచించే ఏకవచన పదాన్ని లింగనిర్దిష్టతతో నిలుపుతుంది.
- source_word: לְבַקֵּשׁ טוֹבָה
  choice: క్షేమం కోరడానికి
  rationale: ఇతరుల మేలు, శ్రేయస్సు కోసం ప్రయత్నించడం అనే సందర్భార్థాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు ప్రజల
  rationale: అక్షరార్థమైన ‘ఇశ్రాయేలు కుమారులు’కు బదులుగా, ఇక్కడ ఉద్దేశించిన ఒడంబడిక సమాజాన్ని ఆధునిక పాఠకులకు స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: אָדָם పదంలోని లింగనిర్దిష్టత
  choice: ఒక మనిషి
  alternative: ఒకరు / ఒక వ్యక్తి
  rationale: ఈ ఏకవచన పదం సందర్భంలో నెహెమ్యాను సూచిస్తుంది; మూలంలోని పురుష సూచనను తటస్థీకరించలేదు.
- issue: הָעֶבֶד అనే సామాజిక హోదా
  choice: దాసుడు
  alternative: సేవకుడు / అధికారి
  rationale: మూలపదం దాసుడు లేదా సేవకుడు అనే పరిధిని కలిగి ఉంది. ‘దాసుడు’ దాని బద్ధసేవ భావాన్ని కాపాడుతుంది; ‘అధికారి’ సందర్భాధారిత వ్యాఖ్యానాన్ని ప్రధాన పాఠంలోకి తెస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన వాక్యనిర్మాణం వాడబడింది. వ్యక్తి పేర్లు, జాత్యనామాలు తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించబడ్డాయి; హీబ్రూ పదప్రయోగంలోని కఠినతను పాదసూచికలో భద్రపరిచాం.
