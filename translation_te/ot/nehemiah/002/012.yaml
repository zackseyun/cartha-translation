  text: וָ/אָק֣וּם לַ֗יְלָה אֲנִי֮ וַ/אֲנָשִׁ֣ים מְעַט֮ עִמִּ/י֒ וְ/לֹא הִגַּ֣דְתִּי לְ/אָדָ֔ם מָ֗ה אֱלֹהַ/י֙ נֹתֵ֣ן אֶל לִבִּ֔/י לַ/עֲשׂ֖וֹת לִ/ירוּשָׁלִָ֑ם וּ/בְהֵמָה֙ אֵ֣ין עִמִּ֔/י כִּ֚י אִם הַ/בְּהֵמָ֔ה אֲשֶׁ֥ר אֲנִ֖י רֹכֵ֥ב בָּֽ/הּ׀׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/012.yaml
  text: So I arose in the night[a], I and a few men with me, and I had not told anyone what my God was putting into my heart to do for Jerusalem[c][b]. And there was no animal with me except the animal on which I was riding.
translation:
  language: te
  text: అప్పుడు నేను నాతో కొద్దిమంది పురుషులతో కలిసి రాత్రివేళ లేచాను. యెరూషలేము కోసం చేయాలని నా దేవుడు నా హృదయంలో ఉంచుతున్నదేమిటో నేను ఎవరికీ చెప్పలేదు.[a] నేను స్వారీ చేస్తున్న జంతువు తప్ప మరే జంతువూ నా వెంట లేదు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నా దేవుడు నా హృదయంలో ఉంచినదేమిటో.” హీబ్రూ కృదంతం కొనసాగుతున్న చర్యను లేదా సజీవంగా వర్ణించిన చర్యను సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ “జంతువు” అనేది స్వారీకి ఉపయోగించే జంతువుకు సాధారణ పదం.
    reason: lexical_clarification
lexical_decisions:
- source_word: וָאָקוּם לַיְלָה
  choice: అప్పుడు నేను రాత్రివేళ లేచాను
  rationale: קום యొక్క కథన భూతకాల భావాన్ని ‘లేచాను’ సహజంగా తెలియజేస్తుంది; לַיְלָה చర్య జరిగిన సమయాన్ని సూచిస్తుంది.
- source_word: אֲנִי וַאֲנָשִׁים מְעַט עִמִּי
  choice: నాతో కొద్దిమంది పురుషులు ఉన్నారు
  rationale: అనుచరుల సంఖ్య తక్కువని, אֲנָשִׁים ఇక్కడ పురుషులను సూచిస్తుందని స్పష్టంగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: וְלֹא הִגַּדְתִּי לְאָדָם
  choice: నేను ఎవరికీ చెప్పలేదు
  rationale: లక్ష్యభాషలో సహజమైన నిరాకరణ; לְאָדָם ఇక్కడ ‘ఏ వ్యక్తికీ’ అనే అనిర్దిష్ట భావంలో ఉంది.
- source_word: מָה אֱלֹהַי נֹתֵן אֶל לִבִּי
  choice: నా దేవుడు నా హృదయంలో ఉంచుతున్న సంగతి
  rationale: నֹתֵן అనే కృదంతంలోని కొనసాగుతున్న లేదా సజీవమైన చర్యను ‘ఉంచుతున్న’ కాపాడుతుంది; ‘హృదయం’ అంతరంగ సంకల్పం/ఆలోచన అనే హీబ్రూ రూపకాన్ని నిలుపుతుంది.
- source_word: לַעֲשׂוֹת לִירוּשָׁלִָם
  choice: యెరూషలేము కోసం చేయాలని
  rationale: చర్యను ముందుగానే ‘పునర్నిర్మాణం’గా నిర్దిష్టపరచకుండా, హీబ్రూలోని విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: וּבְהֵמָה אֵין עִמִּי כִּי אִם הַבְּהֵמָה
  choice: నేను ఎక్కి ప్రయాణిస్తున్న జంతువు తప్ప మరే జంతువూ నా వెంట లేదు
  rationale: בְּהֵמָה అనే సాధారణ జంతు పదాన్ని ‘జంతువు’గా అనువదించి, כִּי אִם యొక్క మినహాయింపు భావాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: אֲשֶׁר אֲנִי רֹכֵב בָּהּ
  choice: నేను ఎక్కి ప్రయాణిస్తున్న
  rationale: רֹכֵב కృదంతంలోని కొనసాగుతున్న చర్యను తెలుగులో సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: నెహెమ్యా అంతరంగ సంకల్పంలో దేవుని ప్రేరణ
  choice: నా దేవుడు నా హృదయంలో ఉంచుతున్న సంగతి
  alternative: నా దేవుడు నా హృదయంలో ఉంచిన సంగతి; నా దేవుడు నాకు చేయమని ప్రేరేపిస్తున్నది
  rationale: ఈ మాటలు సంకల్పానికి దేవుడే మూలమని చెబుతాయి, కానీ దానిని ప్రత్యక్షమైన వాచిక ప్రకటనగా విస్తరించవు. కొనసాగుతున్న దేవుని ప్రేరణకూ నెహెమ్యా మానవ కార్యసాధకత్వానికీ మధ్య ఉన్న ఉద్వేగాన్ని అలాగే ఉంచుతాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనదిగా, అయితే కథన గాంభీర్యాన్ని నిలుపుకునేలా రూపొందించబడింది. హీబ్రూ వాక్య నిర్మాణాన్ని యాంత్రికంగా అనుకరించకుండా దాని అర్థం, అస్పష్టత, రూపకాన్ని కాపాడింది.
