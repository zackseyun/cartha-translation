source:
  edition: WLC
  text: וָ/אָשִׁ֨יב אוֹתָ֜/ם דָּבָ֗ר וָ/אוֹמַ֤ר לָ/הֶם֙ אֱלֹהֵ֣י הַ/שָּׁמַ֔יִם ה֚וּא יַצְלִ֣יחַֽ לָ֔/נוּ וַ/אֲנַ֥חְנוּ עֲבָדָ֖י/ו נָק֣וּם וּ/בָנִ֑ינוּ וְ/לָ/כֶ֗ם אֵֽין חֵ֧לֶק וּ/צְדָקָ֛ה וְ/זִכָּר֖וֹן בִּ/ירוּשָׁלִָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/020.yaml
  text: Then I answered them and said[a], “The God of heaven, he will make us prosper, and we his servants will arise and build[b]. But you have no share or right or memorial in Jerusalem.”
translation:
  language: te
  text: 'అప్పుడు నేను వారికి జవాబిచ్చి ఇలా అన్నాను: “పరలోక దేవుడే మాకు సఫలత కలిగిస్తాడు[a]. ఆయన సేవకులమైన మేము లేచి కడతాము. అయితే యెరూషలేములో మీకు వాటా గానీ, హక్కు గానీ[b], స్మరణ గానీ లేదు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “మాకు విజయం అనుగ్రహిస్తాడు.”
    reason: lexical_alternative
  - marker: b
    text: “హక్కు” అనే పదానికి ఇక్కడ “న్యాయబద్ధమైన దావా” అనే భావం కూడా ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאָשִׁיב אוֹתָם דָּבָר וָאוֹמַר לָהֶם
  choice: అప్పుడు నేను వారికి జవాబిస్తూ ఇలా అన్నాను
  rationale: שׁוּב ... דָּבָר అనే హీబ్రూ నుడికారం అక్షరార్థంగా ‘మాటను తిరిగి ఇవ్వడం’ కాదు; సమాధానం చెప్పడం అనే భావం. తరువాతి ‘అన్నాను’తో సహజంగా కలిసేలా ‘జవాబిస్తూ’ అని అనువదించబడింది.
- source_word: אֱלֹהֵי הַשָּׁמַיִם הוּא
  choice: ఆకాశపు దేవుడే
  rationale: הוּא ఇచ్చే ఉద్ఘాటనను తెలుగులో ‘దేవుడే’ అనే నిశ్చయార్థక రూపం సహజంగా వ్యక్తం చేస్తుంది.
- source_word: יַצְלִיחַ לָנוּ
  choice: మాకు సఫలత కలిగిస్తాడు
  rationale: צלח హిఫీల్ రూపం ఈ కార్యంలో విజయం లేదా సఫలతను అనుగ్రహించే కారణార్థక భావాన్ని కలిగి ఉంది. ‘సఫలత కలిగిస్తాడు’ ఆ భావాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: עֲבָדָיו
  choice: ఆయన సేవకులమైన
  rationale: ఈ సందర్భంలో దేవునికి విధేయతతో సేవచేసే వారి గుర్తింపే ప్రధానమైనది; బానిసత్వ సామాజిక స్థితి కాదు.
- source_word: נָקוּם וּבָנִינוּ
  choice: మేము లేచి కడతాము
  rationale: నిర్ణయంతో కార్యానికి పూనుకోవడాన్ని ‘లేచి’ తెలియజేస్తుంది. హీబ్రూలో ఉన్న సాధారణ ‘కట్టడం’ అనే క్రియను ‘తిరిగి కట్టడం’గా విస్తరించకుండా ఉంచబడింది.
- source_word: אֵין חֵלֶק
  choice: వాటా లేదు
  rationale: חֵלֶק కేటాయించబడిన భాగం లేదా వాటాను సూచిస్తుంది; ‘వాటా’ ఆధునిక తెలుగులో స్పష్టంగా ఉంది.
- source_word: וּצְדָקָה
  choice: హక్కు లేదు
  rationale: ఈ న్యాయ-రాజకీయ సందర్భంలో צְדָקָה నైతిక నీతి కంటే న్యాయబద్ధమైన హక్కు లేదా దావాను సూచిస్తుంది.
- source_word: וְזִכָּרוֹן
  choice: జ్ఞాపకం లేదు
  rationale: ఈ పదం యెరూషలేములో గుర్తుంచుకోదగిన స్థానం లేదా స్మారక అనుబంధాన్ని సూచించవచ్చు. ‘జ్ఞాపకం’ మూలంలోని విస్తృతతను పూర్తిగా ఒకే చట్టపరమైన భావానికి పరిమితం చేయదు.
theological_decisions:
- issue: దేవునితో సంబంధంలో עֲבָדָיו పదం
  choice: ఆయన సేవకులు
  alternative: ఆయన బానిసలు
  rationale: ఇక్కడ నెహెమ్యా ఉద్దేశం దేవునికి చెందినవారిగా విధేయతతో పనిచేయడాన్ని చెప్పడం. బంధిత సామాజిక స్థితిని ముందుకు తెచ్చే ‘బానిసలు’ ఈ సందర్భంలో అనవసరమైన భావాన్ని జోడించవచ్చు.
- issue: వ్యతిరేకులకు యెరూషలేములో צְדָקָה లేదనే మాట
  choice: హక్కు
  alternative: నీతి; న్యాయబద్ధమైన దావా
  rationale: ఈ వాక్యం వారి నైతిక నీతిని తీర్పు చేయడం కంటే యెరూషలేముపై వారికి చట్టబద్ధమైన లేదా సమాజపరమైన హక్కు లేదని చెబుతోంది. ‘హక్కు’ ఆ సందర్భార్థాన్ని సహజంగా తెలియజేస్తుంది.
- issue: וְזִכָּרוֹן యొక్క ప్రజా-సామూహిక భావం
  choice: జ్ఞాపకం
  alternative: గుర్తింపు; స్మారక హక్కు
  rationale: హీబ్రూ పదం సాధారణ జ్ఞాపకంతో పాటు ప్రజల మధ్య గుర్తుండే స్థానం లేదా స్మారక అనుబంధాన్నీ సూచించగలదు. ప్రధాన పాఠంలో ‘జ్ఞాపకం’ ఉంచి, ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో తెలిపి సందిగ్ధతను కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి వాడబడింది. ‘దేవుడే’ మూలంలోని ఉద్ఘాటనను సహజంగా నిలుపుతుంది. వరుసగా వచ్చిన ‘వాటాగానీ, హక్కుగానీ, జ్ఞాపకంగానీ’ మూలంలోని త్రిపద నిరాకరణను పరిరక్షిస్తుంది.
