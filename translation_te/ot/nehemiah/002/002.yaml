source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ לִ֨/י הַ/מֶּ֜לֶךְ מַדּ֣וּעַ פָּנֶ֣י/ךָ רָעִ֗ים וְ/אַתָּה֙ אֵֽינְ/ךָ֣ חוֹלֶ֔ה אֵ֣ין זֶ֔ה כִּי אִ֖ם רֹ֣עַֽ לֵ֑ב וָ/אִירָ֖א הַרְבֵּ֥ה מְאֹֽד׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/002.yaml
  text: And the king said to me[a], “Why is your face sad[b], though you are not sick? This is nothing but sadness of heart.” Then I was very much afraid.
translation:
  language: te
  text: 'అప్పుడు రాజు నాతో ఇలా అన్నాడు: “నీ ముఖం ఎందుకు దిగులుగా ఉంది[a]? అయినా నీవు అనారోగ్యంగా లేవు. ఇది హృదయవేదన[b] తప్ప మరొకటి కాదు.” అప్పుడు నేను ఎంతో భయపడ్డాను.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “నీ ముఖం చెడ్డగా ఎందుకు ఉంది?” ఇది దిగులైన లేదా కలతచెందిన ముఖకవళికను సూచించే నుడికారం.
    reason: lexical_alternative
  - marker: b
    text: “హృదయవేదన”కు “హృదయదుఃఖం” లేదా “మనోవేదన” అని కూడా అనువదించవచ్చు. హీబ్రూలో అక్షరార్థంగా “హృదయపు చెడుతనం”; ఇక్కడ అది నైతిక చెడును కాక అంతరంగ కలతను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַדּוּעַ
  choice: ఎందుకు
  rationale: కారణాన్ని ప్రశ్నించే సాధారణ హీబ్రూ పదానికి సహజమైన, స్పష్టమైన తెలుగు సమానం.
- source_word: פָּנֶיךָ רָעִים
  choice: నీ ముఖం దిగులుగా ఉంది
  rationale: అక్షరార్థంగా ‘నీ ముఖం చెడ్డగా ఉంది’; సందర్భంలో ఇది దుఃఖభరితమైన లేదా కలతచెందిన ముఖకవళికను సూచించే నుడికారం. ‘దిగులుగా’ ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: חוֹלֶה
  choice: అనారోగ్యంగా
  rationale: శారీరక అస్వస్థతను సూచించే పదానికి ఆధునిక ప్రామాణిక తెలుగులో స్పష్టమైన సమానం.
- source_word: אֵין זֶה כִּי אִם
  choice: ఇది ... తప్ప మరొకటి కాదు
  rationale: ఇతర వివరణలను మినహాయించి రాజు చేసిన నిర్ధారణను బలంగా వ్యక్తం చేసే నిర్మాణాన్ని కాపాడుతుంది.
- source_word: רֹעַ לֵב
  choice: హృదయవేదన
  rationale: అక్షరార్థంగా ‘హృదయపు చెడుతనం’; ఇక్కడ నైతిక దుష్టత్వం కాక అంతరంగ దుఃఖం లేదా కలత ఉద్దేశించబడింది. ‘హృదయవేదన’ ఆ అంతరంగ బాధను సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: וָאִירָא
  choice: అప్పుడు నేను ... భయపడ్డాను
  rationale: కథన క్రమంలో తదుపరి ప్రతిస్పందనను సూచించే wayyiqtol రూపాన్ని ‘అప్పుడు’తో సహజంగా ప్రతిబింబిస్తుంది.
- source_word: הַרְבֵּה מְאֹד
  choice: చాలా
  rationale: జతగా వచ్చిన తీవ్రతా సూచకాలు భయపు అధికతను తెలియజేస్తాయి; ‘చాలా’ సాధారణ ఆధునిక తెలుగులో సహజమైన బలవర్ధకం.
theological_decisions:
- issue: רֹעַ לֵב పదబంధం నైతిక చెడును సూచిస్తుందా, అంతరంగ వేదనను సూచిస్తుందా
  choice: హృదయవేదన
  alternative: హృదయంలోని చెడుతనం
  rationale: రాజు శారీరక అనారోగ్యాన్ని తోసిపుచ్చి నెహెమ్యా ముఖకవళికకు అంతరంగ కారణాన్ని గుర్తిస్తున్నాడు. అందువల్ల సందర్భం నైతిక దుష్టత్వం కంటే దుఃఖం లేదా మనోవేదనను బలపరుస్తుంది; ప్రత్యామ్నాయ అక్షరార్థాన్ని పాదటిప్పణిలో సూచించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన కథన శైలి. రాజు నెహెమ్యాను ఏకవచనంలో సంబోధించినందున ‘నీవు/నీ’ వాడబడింది. హీబ్రూ నుడికారాలను ప్రధాన పాఠ్యంలో సహజంగా అనువదించి, అక్షరార్థాలను పాదటిప్పణుల్లో భద్రపరచాం.
