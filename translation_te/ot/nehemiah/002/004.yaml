translation:
  language: te
  text: 'అప్పుడు రాజు నాతో ఇలా అన్నాడు: “నీవు ఏమి కోరుతున్నావు?” అప్పుడు నేను ఆకాశాల దేవునికి ప్రార్థించాను.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מְבַקֵּשׁ
  choice: కోరుతున్నది
  rationale: ఈ సందర్భంలో రాజును ఉద్దేశించి నెహెమ్యా చేయబోయే విజ్ఞప్తిని సూచించే సహజమైన ఆధునిక తెలుగు పదప్రయోగం; మూలంలోని విస్తృతమైన ‘కోరడం/వెదకడం’ భావాన్ని సందర్భానుసారంగా అందిస్తుంది.
- source_word: אֱלֹהֵי הַשָּׁמָיִם
  choice: పరలోకపు దేవుడు
  rationale: దేవుని మహోన్నత అధికారాన్ని సూచించే హీబ్రూ బిరుదును తెలుగులో సహజంగా, గౌరవప్రదంగా అందిస్తుంది.
