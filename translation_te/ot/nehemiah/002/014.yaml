base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/014.yaml
  text: Then I went on to the Fountain Gate and to the King’s Pool[b][a], but there was no place for the animal under me to pass.
translation:
  language: te
  text: తర్వాత నేను ఊట ద్వారం[a] దగ్గరికి, రాజు కొలను దగ్గరికి వెళ్లాను. అయితే నా కింద ఉన్న జంతువు దాటడానికి చోటు లేకపోయింది.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘జలధార ద్వారం.’ హీబ్రూ పదం సహజ నీటి ఊటను లేదా జలధారను సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘నా కింద ఉన్న జంతువు దాటడానికి.’ సందర్భంలో ఇది నెహెమ్యా స్వారీ చేస్తున్న జంతువును సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶעֱבֹר
  choice: తర్వాత నేను ... దగ్గరికి వెళ్లాను
  rationale: עבר ఇక్కడ రాత్రివేళ సాగుతున్న పరిశీలనలో ఒక ప్రదేశం నుంచి మరొక ప్రదేశానికి కదలడాన్ని సూచిస్తుంది. సహజమైన ఆధునిక తెలుగులో ‘వెళ్లాను’ కొనసాగుతున్న ప్రయాణాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: שַׁעַר הָעַיִן
  choice: నీటి ఊట ద్వారం
  rationale: עַיִן అనే పదానికి ‘కన్ను’ లేదా ‘ఊట/జలధార’ అనే అర్థాలు ఉన్నాయి. యెరూషలేము భౌగోళిక సందర్భంలో నీటి మూలాన్ని సూచించే అర్థమే తగినది; ‘నీటి ఊట’ సాధారణ పాఠకునికి స్పష్టంగా ఉంటుంది.
- source_word: בְּרֵכַת הַמֶּלֶךְ
  choice: రాజు కొలను
  rationale: בְּרֵכָה అంటే కొలను లేదా నీటి నిల్వ. ఇది ప్రదేశనామంలా ఉన్న నిర్మాణాన్ని నేరుగా, సహజంగా ప్రతిబింబిస్తుంది.
- source_word: וְאֵין מָקוֹם
  choice: అయితే ... చోటు లేకపోయింది
  rationale: וְ ఇక్కడ ముందుకు సాగడాన్ని అడ్డుకున్న పరిస్థితిని పరిచయం చేస్తుంది. అందువల్ల ప్రతికూల సంబంధాన్ని సహజ తెలుగులో ‘అయితే’తో వ్యక్తం చేశాం.
- source_word: לַבְּהֵמָה
  choice: జంతువు
  rationale: בְּהֵמָה సాధారణంగా జంతువు లేదా పశువును సూచిస్తుంది; జాతి ఏమిటో వచనం చెప్పదు. కాబట్టి ‘గాడిద’ వంటి నిర్దిష్ట పదాన్ని చేర్చలేదు.
- source_word: לַעֲבֹר
  choice: దాటడానికి
  rationale: עבר యొక్క స్థలసంబంధమైన సాధారణ భావాన్ని ‘దాటడానికి’ సహజంగా తెలియజేస్తుంది.
- source_word: תַּחְתָּי
  choice: నేను ఎక్కిన
  rationale: అక్షరార్థంగా ‘నా కింద ఉన్న’ అని ఉన్నా, సందర్భంలో నెహెమ్యా స్వారీ చేస్తున్న జంతువును సూచిస్తుంది. ‘నేను ఎక్కిన’ మూల భావాన్ని స్పష్టమైన ఆధునిక తెలుగులో అందిస్తుంది; అక్షరార్థం పాదసూచికలో ఉంచబడింది.
