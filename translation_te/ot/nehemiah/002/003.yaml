id: NEH.2.3
reference: Nehemiah 2:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וָ/אֹמַ֣ר לַ/מֶּ֔לֶךְ הַ/מֶּ֖לֶךְ לְ/עוֹלָ֣ם יִחְיֶ֑ה מַדּ֜וּעַ לֹא יֵרְע֣וּ פָנַ֗/י אֲשֶׁ֨ר הָ/עִ֜יר בֵּית קִבְר֤וֹת אֲבֹתַ/י֙ חֲרֵבָ֔ה וּ/שְׁעָרֶ֖י/הָ אֻכְּל֥וּ בָ/אֵֽשׁ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/003.yaml
  text: I said to the king[a], “May the king live forever! Why should my face not be sad, when the city, the place of my fathers’ tombs, lies in ruins and its gates have been consumed by fire?”
translation:
  language: te
  text: 'నేను రాజుతో ఇలా అన్నాను: “రాజా, మీరు చిరకాలం జీవించుగాక! నా పూర్వికుల సమాధుల స్థలమైన[a] ఆ నగరం శిథిలమై ఉండగా, దాని ద్వారాలు అగ్నిచేత దహించబడి ఉండగా, నా ముఖం విచారంగా ఎందుకు ఉండకూడదు?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, ‘నా పూర్వికుల సమాధుల ఇల్లు.’ ఇది వారి సమాధులతో అనుబంధమున్న స్థలాన్ని సూచించే ప్రయోగం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר
  choice: నేను ... అన్నాను
  rationale: కథన క్రమంలోని సాధారణ భూతకాల క్రియగా సహజమైన తెలుగులో అనువదించబడింది; వావ్ సంధిని ప్రత్యేకంగా ‘అప్పుడు’ అని చూపాల్సిన అవసరం లేదు.
- source_word: לַמֶּלֶךְ / הַמֶּלֶךְ
  choice: రాజుతో / రాజు
  rationale: మొదటిది మాట ఎవరికి చెప్పబడిందో సూచిస్తుంది; రెండవది రాజసభ మర్యాదతో కూడిన సంబోధనలో భాగం.
- source_word: לְעוֹלָם יִחְיֶה
  choice: చిరకాలం జీవించుగాక
  rationale: రాజుకు పలికే సంప్రదాయ శుభాకాంక్షను గౌరవప్రదమైన, సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: לֹא יֵרְעוּ פָנַי
  choice: నా ముఖం విచారంగా ఎందుకు ఉండదు?
  rationale: ‘ముఖం చెడుగా ఉండడం’ అనే హీబ్రూ ప్రయోగం ఇక్కడ ముఖంలో కనిపించే విచారాన్ని సూచిస్తుంది; ముఖం అనే రూపకాన్ని నిలిపి ఉంచింది.
- source_word: אֲשֶׁר
  choice: '... ఉండగా'
  rationale: నెహెమ్యా విచారానికి కారణమైన పరిస్థితిని తెలుపుతుంది; కఠినమైన కారణార్థక వివరణకు బదులు మూలంలోని పరిస్థితి సంబంధాన్ని నిలుపుతుంది.
- source_word: הָעִיר
  choice: ఆ నగరం
  rationale: సందర్భంలో యెరూషలేమును సూచించినా, మూలపాఠం పేరును చెప్పకుండా నిర్దిష్ట నగరంగా పేర్కొంటుంది.
- source_word: בֵּית קִבְרוֹת אֲבֹתַי
  choice: నా పూర్వికుల సమాధుల స్థలమైన
  rationale: అక్షరార్థంగా ‘నా పితరుల సమాధుల ఇల్లు’; పూర్వికుల సమాధులతో అనుబంధమున్న స్థలాన్ని సూచించే భావాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: חֲרֵבָה
  choice: శిథిలమై పడి
  rationale: నాశనమై నిర్జనమైన స్థితిని స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וּשְׁעָרֶיהָ
  choice: దాని ద్వారాలు
  rationale: నగరానికి చెందిన ద్వారాలు అనే బహువచన స్వామ్యార్థాన్ని నేరుగా నిలుపుతుంది.
- source_word: אֻכְּלוּ בָאֵשׁ
  choice: అగ్నికి ఆహుతై
  rationale: అగ్ని ‘తినివేసింది’ అనే హీబ్రూ రూపకంలోని సంపూర్ణ విధ్వంస భావాన్ని తెలుగులో సహజమైన పదబంధంతో అందిస్తుంది.
