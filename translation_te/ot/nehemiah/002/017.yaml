  variant: modern standard Telugu
source:
  edition: WLC
  text: וָ/אוֹמַ֣ר אֲלֵ/הֶ֗ם אַתֶּ֤ם רֹאִים֙ הָ/רָעָה֙ אֲשֶׁ֣ר אֲנַ֣חְנוּ בָ֔/הּ אֲשֶׁ֤ר יְרוּשָׁלִַ֨ם֙ חֲרֵבָ֔ה וּ/שְׁעָרֶ֖י/הָ נִצְּת֣וּ בָ/אֵ֑שׁ לְכ֗וּ וְ/נִבְנֶה֙ אֶת חוֹמַ֣ת יְרוּשָׁלִַ֔ם וְ/לֹא נִהְיֶ֥ה ע֖וֹד חֶרְפָּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/017.yaml
  text: 'Then I said to them[a], “You see the trouble we are in: Jerusalem lies in ruins, and its gates have been burned with fire. Come, let us rebuild the wall of Jerusalem[c][b], so that we may no longer be a reproach.”'
translation:
  language: te
  text: 'అప్పుడు నేను వారితో, “మనం ఉన్న ఈ దుస్థితిని మీరు చూస్తున్నారు: యెరూషలేము శిథిలమై ఉంది; దాని ద్వారాలు అగ్నితో కాలిపోయాయి. రండి, మనం ఇక అవమానానికి గురికాకుండా యెరూషలేము ప్రాకారాన్ని మళ్లీ కడదాం[a]” అని చెప్పాను.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “మనం ఇక అపహాస్యంగా ఉండకుండా.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרָעָה אֲשֶׁר אֲנַחְנוּ בָהּ
  choice: మనం ఉన్న ఈ దుస్థితి
  rationale: ఇక్కడ רָעָה నైతిక చెడును కాక, సమాజం అనుభవిస్తున్న విపత్తు మరియు దయనీయ స్థితిని సూచిస్తుంది. ‘దుస్థితి’ ఆ భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: יְרוּשָׁלִַם חֲרֵבָה
  choice: యెరూషలేము శిథిలమై ఉంది
  rationale: חֲרֵבָה నగరం ధ్వంసమై పాడై ఉన్న భౌతిక స్థితిని సూచిస్తుంది; ‘శిథిలమై ఉంది’ దానిని స్పష్టంగా, సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: וּשְׁעָרֶיהָ נִצְּתוּ בָאֵשׁ
  choice: దాని ద్వారాలు అగ్నితో కాలిపోయాయి
  rationale: నిఫాల్ రూపంలోని కర్మణి భావాన్నీ, בָאֵשׁ లోని ‘అగ్నితో’ అనే స్పష్టమైన అంశాన్నీ నిలుపుతుంది.
- source_word: לְכוּ
  choice: రండి
  rationale: పదశః ‘వెళ్లండి’ అయినా, ఇక్కడ ఉమ్మడి కార్యానికి పిలిచే ప్రోత్సాహక ప్రయోగం; తెలుగులో ‘రండి’ సహజమైన సమానార్థకం.
- source_word: וְנִבְנֶה
  choice: మనం … మళ్లీ కడదాం
  rationale: కోహోర్టేటివ్ రూపం ఉమ్మడి సంకల్పాన్ని తెలియజేస్తుంది. ఇంతకుముందు ఉన్న ప్రాకారాన్ని పునరుద్ధరించే సందర్భం కావడంతో ‘మళ్లీ కడదాం’ సరిపోతుంది.
- source_word: חוֹמַת יְרוּשָׁלִַם
  choice: యెరూషలేము ప్రాకారం
  rationale: ‘ప్రాకారం’ నగరాన్ని చుట్టిన రక్షణ గోడను సాధారణ ‘గోడ’ కంటే ఖచ్చితంగా సూచిస్తుంది.
- source_word: וְלֹא נִהְיֶה עוֹד חֶרְפָּה
  choice: మనం ఇక అవమానానికి గురికాకుండా
  rationale: חֶרְפָּה ప్రజల ఎదుట కలిగే అవమానం, నింద, అపహాస్య స్థితిని సూచిస్తుంది. తెలుగు వాక్య నిర్మాణంలో ఉద్దేశం/ఫలిత భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: חֶרְפָּה యొక్క సామూహిక అవమాన భావం
  choice: అవమానానికి గురికాకుండా
  alternative: ఇక అపహాస్యంగా ఉండకుండా
  rationale: మూలంలోని ప్రజా నింద మరియు సామూహిక అవమాన భావాన్ని ఉంచుతూ, నిర్దిష్టమైన ఒడంబడిక సిద్ధాంతాన్ని అదనంగా చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ప్రత్యక్ష సంభాషణలోని ఉమ్మడి పిలుపు, నగరపు ధ్వంస స్థితి, సామూహిక అవమానం స్పష్టంగా నిలుపబడ్డాయి.
