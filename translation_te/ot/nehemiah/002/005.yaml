id: NEH.2.5
reference: Nehemiah 2:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וָ/אֹמַ֣ר לַ/מֶּ֔לֶךְ אִם עַל הַ/מֶּ֣לֶךְ ט֔וֹב וְ/אִם יִיטַ֥ב עַבְדְּ/ךָ֖ לְ/פָנֶ֑י/ךָ אֲשֶׁ֧ר תִּשְׁלָחֵ֣/נִי אֶל יְהוּדָ֗ה אֶל עִ֛יר קִבְר֥וֹת אֲבֹתַ֖/י וְ/אֶבְנֶֽ/נָּה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/005.yaml
  text: Then I said to the king[a], "If it pleases the king, and if your servant has found favor before you, that you would send me to Judah, to the city of my fathers' graves[c][b], so that I may rebuild it."
translation:
  language: te
  text: 'అప్పుడు నేను రాజుతో ఇలా అన్నాను: “రాజుకు సమ్మతమైతే, మీ సేవకుడైన నేను మీ దృష్టిలో అనుగ్రహం పొందినవాడినైతే, నేను దానిని కట్టడానికి నన్ను యూదాకు, నా పూర్వికుల సమాధులున్న పట్టణానికి పంపించండి.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאֹמַר
  choice: అప్పుడు నేను ... అన్నాను
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది; ‘అప్పుడు’ సహజమైన తెలుగు కథన క్రమాన్ని తెలియజేస్తుంది.
- source_word: אִם עַל־הַמֶּלֶךְ טוֹב
  choice: రాజుకు సమ్మతమైతే
  rationale: ఇది రాజు ఆమోదాన్ని మర్యాదపూర్వకంగా కోరే ఆస్థాన ప్రయోగం; ఆధునిక తెలుగులో వినయపూర్వక భావాన్ని సహజంగా అందిస్తుంది.
- source_word: וְאִם יִיטַב עַבְדְּךָ לְפָנֶיךָ
  choice: మీ సేవకుడైన నేను మీ దృష్టిలో అనుగ్రహం పొందినవాడినైతే
  rationale: ‘ముందు మేలుగా ఉండడం’ అనే హీబ్రూ నుడికారం అనుకూలత లేదా అనుగ్రహం పొందడాన్ని సూచిస్తుంది; రాజసభలోని వినయపూర్వక స్వీయసూచనను కూడా నిలుపుతుంది.
- source_word: עַבְדְּךָ
  choice: మీ సేవకుడైన నేను
  rationale: ఈ రాజసంబోధన సందర్భంలో ఇది బానిసత్వాన్ని ప్రధానంగా సూచించకుండా వినయపూర్వక స్వీయసూచనగా పనిచేస్తుంది.
- source_word: תִּשְׁלָחֵנִי
  choice: నన్ను పంపించండి
  rationale: వాక్యంలోని షరతులతో కూడిన వినయపూర్వక విన్నపాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: יְהוּדָה
  choice: యూదా
  rationale: స్థలనామానికి ప్రామాణిక తెలుగు రూపం.
- source_word: אֶל־עִיר קִבְרוֹת אֲבֹתַי
  choice: నా పూర్వికుల సమాధులున్న పట్టణానికి
  rationale: అక్షరార్థంగా ‘నా తండ్రుల సమాధుల పట్టణానికి’; ఇక్కడ אבות అనేది తక్షణ తండ్రులను మాత్రమే కాక పూర్వికులను సూచిస్తుంది. తెలుగు సహజత్వం కోసం సంబంధాన్ని స్పష్టంగా తెలిపింది.
- source_word: וְאֶבְנֶנָּה
  choice: నేను దాన్ని తిరిగి కట్టిస్తాను
  rationale: స్త్రీలింగ ప్రత్యయం పట్టణాన్ని సూచిస్తుంది. మూల క్రియ ‘కట్టు’; పట్టణం శిథిలమై ఉన్న సందర్భం వల్ల ‘తిరిగి కట్టు’ సందర్భార్థాన్ని స్పష్టం చేస్తుంది. పట్టణ నిర్మాణ కార్యాన్ని నెహెమ్యా స్వయంగా ఒక్కడే చేయడు కాబట్టి ‘కట్టిస్తాను’ సహజ తెలుగు ప్రయోగం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో రాజసభకు తగిన వినయపూర్వక, గౌరవప్రదమైన శైలి వాడబడింది. ‘నా పూర్వికుల సమాధులున్న పట్టణం’ అనే రూపం హీబ్రూ నిర్మాణార్థాన్ని సహజంగా తెలియజేస్తుంది; ‘అనుగ్రహం పొందినవాడినైతే’ మూల నుడికారాన్ని నిలుపుతుంది.
