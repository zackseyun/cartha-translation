  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన కథన శైలి వాడబడింది. హీబ్రూ వాక్యంలోని వరుస చర్యలు నిలుపబడ్డాయి; ‘పరిశీలించాను’ అనే సందర్భానుగుణ అర్థంలోని మూలభాషా అసాధారణతను పాదసూచికలో వెల్లడించాం.
