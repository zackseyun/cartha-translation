source:
  edition: WLC
  text: וָ/אֱהִ֨י עֹלֶ֤ה בַ/נַּ֨חַל֙ לַ֔יְלָה וָ/אֱהִ֥י שֹׂבֵ֖ר בַּ/חוֹמָ֑ה וָ/אָשׁ֗וּב וָ/אָב֛וֹא בְּ/שַׁ֥עַר הַ/גַּ֖יְא וָ/אָשֽׁוּב׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/015.yaml
  text: So I went up by the wadi at night and inspected the wall[a]. Then I turned back and entered by the Valley Gate[b], and returned.
translation:
  language: te
  text: అప్పుడు నేను రాత్రివేళ వాగు వెంబడి[a] పైకి వెళ్లి, గోడను పరిశీలించాను[b]. తరువాత నేను వెనక్కి తిరిగి, లోయ ద్వారం గుండా ప్రవేశించి తిరిగి వచ్చాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘వాగు’ ఇక్కడ లోయలోని నీటిప్రవాహ మార్గాన్ని, లేదా కాలానుగుణంగా నీరు ప్రవహించే వాగును సూచించవచ్చు; దీనిని ‘లోయ’ లేదా ‘ఏరు’ అని కూడా అనువదించవచ్చు.
    reason: cultural_note
  - marker: b
    text: ‘పరిశీలించాను’ అని అనువదించిన హీబ్రూ క్రియ సాధారణంగా ‘విరగగొట్టు’ అని అర్థమిస్తుంది. అయితే ఈ సందర్భంలో అది దెబ్బతిన్న గోడను నెహెమ్యా పరిశీలించడాన్ని సూచిస్తుందని విస్తృతంగా అర్థం చేసుకుంటారు. లేదా ‘పరీక్షించాను,’ ‘సమీక్షించాను.’
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹלֶה
  choice: పైకి వెళ్లి
  rationale: היה + కృదంత రూపం కొనసాగుతున్న లేదా వర్ణనాత్మక చర్యను సూచిస్తుంది. తెలుగు కథనంలో ‘పైకి వెళ్లి’ సహజంగా ఉండి, ఎక్కి వెళ్లిన భావాన్ని నిలుపుతుంది.
- source_word: בַנַּחַל
  choice: వాగు దారిన
  rationale: נחל సాధారణంగా లోయలోని నీటిప్రవాహ మార్గం లేదా కాలానుగుణ వాగును సూచిస్తుంది. మార్గవివరణలోని ב ఉపసర్గ భావాన్ని ‘దారిన’ సహజంగా తెలియజేస్తుంది.
- source_word: לַיְלָה
  choice: రాత్రివేళ
  rationale: రాత్రి సమయంలో జరిగిన చర్యను ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: שֹׂבֵר
  choice: పరిశీలించాను
  rationale: שבר సాధారణ అర్థం ‘విరగగొట్టు’; అయితే ఇక్కడ నెహెమ్యా పాడైన గోడను మరింత ధ్వంసం చేయడం కాక దాని స్థితిని పరిశీలిస్తున్నాడని సందర్భం సూచిస్తుంది. అసాధారణ మూలపదార్థాన్ని పాదసూచికలో నిలిపాం.
- source_word: בַּחוֹמָה
  choice: గోడను
  rationale: నిర్దిష్ట ఏకవచన రూపాన్ని నిలుపుతూ, యెరూషలేము ప్రాకార గోడను సందర్భం ద్వారా స్పష్టం చేస్తుంది.
- source_word: וָאָשׁוּב
  choice: వెనక్కి తిరిగి
  rationale: మొదటి ప్రయోగంలో ప్రయాణ దిశను మార్చుకున్న భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: וָאָבֹוא בְּשַׁעַר הַגַּיְא
  choice: లోయ ద్వారం గుండా ప్రవేశించి
  rationale: ఇది నగర ద్వారం పేరు. בוא మరియు ב కలయికలో ద్వారం గుండా లోపలికి వచ్చిన భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וָאָשׁוּב
  choice: తిరిగి వచ్చాను
  rationale: చివరి ప్రయోగం రాత్రి పర్యటన ముగిసి మునుపటి స్థలానికి చేరుకున్నదాన్ని సంక్షిప్తంగా తెలియజేస్తుంది.
