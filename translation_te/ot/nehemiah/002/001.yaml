  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే కథన శైలి వాడబడింది. రాజసభ సందర్భాన్ని అతిగా వివరించకుండా మూలంలోని సంక్షిప్తతను నిలుపుకుంది.
