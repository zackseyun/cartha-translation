reference: Nehemiah 2:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְהִ֣י בְּ/חֹ֣דֶשׁ נִיסָ֗ן שְׁנַ֥ת עֶשְׂרִ֛ים לְ/אַרְתַּחְשַׁ֥סְתְּא הַ/מֶּ֖לֶךְ יַ֣יִן לְ/פָנָ֑י/ו וָ/אֶשָּׂ֤א אֶת הַ/יַּ֨יִן֙ וָ/אֶתְּנָ֣/ה לַ/מֶּ֔לֶךְ וְ/לֹא הָיִ֥יתִי רַ֖ע לְ/פָנָֽי/ו׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/001.yaml
  text: And it happened in the month of Nisan[a], in the twentieth year of King Artaxerxes, when wine was before him, that I took up the wine and gave it to the king. Now I had not been sad in his presence.
translation:
  language: te
  text: 'అర్తహషస్త రాజు పరిపాలనలో ఇరవయ్యవ సంవత్సరం, నీసాను నెలలో ఇలా జరిగింది: రాజు ముందు ద్రాక్షామద్యం ఉన్నప్పుడు, నేను దాన్ని తీసుకొని రాజుకు ఇచ్చాను. అంతకుముందు నేను అతని సమక్షంలో విచారంగా[a] ఉండలేదు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “నేను అతని ముందు చెడ్డగా ఉండలేదు.” ఇక్కడ హీబ్రూ భాషలోని “చెడ్డగా” అనే మాట రాజు సమక్షంలో విచారంగా లేదా దిగులుగా కనిపించడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: ఇలా జరిగింది
  rationale: హీబ్రూ కథన క్రమాన్ని సహజమైన ఆధునిక తెలుగు కథనారంభంతో వ్యక్తపరుస్తుంది; పాతకాలపు కృత్రిమ శైలిని నివారిస్తుంది.
- source_word: בְּחֹדֶשׁ נִיסָן
  choice: నీసాను నెలలో
  rationale: నెల పేరును లిప్యంతరీకరించి, తేదీ సూచనను తెలుగులో సహజంగా ఉంచుతుంది.
- source_word: שְׁנַת עֶשְׂרִים לְאַרְתַּחְשַׁסְתְּא הַמֶּלֶךְ
  choice: అర్తహషస్త రాజు పరిపాలనలో ఇరవయ్యవ సంవత్సరం
  rationale: ఇది రాజ్యపాలన సంవత్సరాన్ని సూచించే తేదీ విధానం అని స్పష్టంగా తెలియజేస్తూ మూలంలోని సంబంధాన్ని కాపాడుతుంది.
- source_word: יַיִן לְפָנָיו
  choice: రాజు ముందు ద్రాక్షారసం ఉన్నప్పుడు
  rationale: సందర్భంలోని రాజు ఎవరో స్పష్టంచేస్తూ, לְפָנָיו అనే ‘అతని ముందు’ భావాన్ని నిలుపుతుంది. יַיִן‌కు సాధారణంగా అర్థమయ్యే ‘ద్రాక్షారసం’ వాడబడింది.
- source_word: וָאֶשָּׂא אֶת־הַיַּיִן וָאֶתְּנָה לַמֶּלֶךְ
  choice: నేను దాన్ని తీసుకొని రాజుకు ఇచ్చాను
  rationale: నשאను ‘తీసుకొని’ అని సహజంగా అనువదించి, మూలంలో లేని ‘పాత్ర’ లేదా ‘త్రాగడానికి’ వంటి వివరాలను చేర్చలేదు; ‘దాన్ని’ ముందున్న ద్రాక్షారసాన్ని సూచిస్తుంది.
- source_word: וְלֹא הָיִיתִי רַע לְפָנָיו
  choice: అంతకుముందు నేను అతని సమక్షంలో విచారంగా ఉండలేదు
  rationale: రַע అక్షరార్థంగా ‘చెడ్డగా’ అయినప్పటికీ, రాజు సమక్షంలో కనిపించే దిగులు లేదా విచారాన్ని ఇక్కడ సూచిస్తుంది. ‘అంతకుముందు’ కథన సందర్భంలోని పూర్వస్థితిని తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
theological_decisions: []
