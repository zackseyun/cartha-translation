source:
  edition: WLC
  text: וָ/אֵצְאָ֨/ה בְ/שַֽׁעַר הַ/גַּ֜יא לַ֗יְלָה וְ/אֶל פְּנֵי֙ עֵ֣ין הַתַּנִּ֔ין וְ/אֶל שַׁ֖עַר הָ/אַשְׁפֹּ֑ת וָ/אֱהִ֨י שֹׂבֵ֜ר בְּ/חוֹמֹ֤ת יְרוּשָׁלִַ֨ם֙ אֲשֶׁר ה/מפרוצים וּ/שְׁעָרֶ֖י/הָ אֻכְּל֥וּ בָ/אֵֽשׁ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/013.yaml
  text: So I went out by night through the Valley Gate[a], toward the Dragon Spring and toward the Dung Gate[b], and I inspected the walls of Jerusalem that had been broken down and its gates that had been consumed by fire.
translation:
  language: te
  text: అప్పుడు నేను రాత్రివేళ లోయ ద్వారం గుండా బయలుదేరి, తన్నీన్ ఊట[a] వైపుగా, పెంట ద్వారం వైపుగా వెళ్లాను. కూలగొట్టబడిన యెరూషలేము ప్రాకారాలను, అగ్నిచేత కాల్చివేయబడిన దాని ద్వారాలను పరిశీలిస్తూ ఉన్నాను.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “తన్నీన్ ఊట” అనే హీబ్రూ స్థలనామంలోని తన్నీన్ పదానికి మహాసర్పం, సర్పం లేదా అలాంటి ప్రాణి అనే అర్థాలు ఉండవచ్చు. అందువల్ల దీనిని “మహాసర్పపు ఊట” లేదా “సర్పపు ఊట” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “పరిశీలిస్తూ ఉన్నాను” అని అనువదించిన హీబ్రూ ప్రయోగం పదశః క్లిష్టమైనది; ఈ సందర్భంలో అది దెబ్బతిన్న ప్రాకారాలను జాగ్రత్తగా పరిశీలించడాన్ని సూచిస్తుందని గ్రహించబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֵצְאָה
  choice: అప్పుడు నేను ... బయలుదేరి
  rationale: మొదటి పురుష ఏకవచన కథనక్రియను సహజమైన తెలుగు కథన క్రమంలో వ్యక్తపరుస్తుంది.
- source_word: בְּשַׁעַר הַגַּיְא
  choice: లోయ ద్వారం గుండా
  rationale: చలన సందర్భంలోని בְּ ను ‘గుండా’గా ఇవ్వడం సహజం; הַגַּיְאకు ‘లోయ’ అనే స్థలార్థాన్ని నిలుపుతుంది.
- source_word: לַיְלָה
  choice: రాత్రివేళ
  rationale: కాలాన్ని సూచించే క్రియావిశేషణ ప్రయోగాన్ని సంక్షిప్తంగా, సహజంగా అందిస్తుంది.
- source_word: וְאֶל־פְּנֵי עֵין הַתַּנִּין
  choice: తన్నీన్ ఊట వైపుగా
  rationale: עֵין ఇక్కడ నీటి ఊట. תַּנִּיןకు నాగం, సర్పం, మహాసర్పం వంటి అర్థవ్యాప్తి ఉన్నందున అస్పష్టతను స్థలనామ లిప్యంతరీకరణతో కాపాడి పాదటిప్పణిలో వివరిస్తుంది.
- source_word: שַׁעַר הָאַשְׁפֹּת
  choice: పెంట ద్వారం
  rationale: אַשְׁפֹּת సూచించే విసర్జిత మలినం లేదా చెత్తకుప్ప భావాన్ని ‘పెంట’ సంక్షిప్తంగా, స్థలనామానికి తగిన విధంగా అందిస్తుంది.
- source_word: וָאֱהִי שֹׂבֵר
  choice: పరిశీలిస్తూ ఉన్నాను
  rationale: పదశః క్లిష్టమైన שֹׂבֵרను ఈ రాత్రి పరిశీలనా సందర్భంలో గోడల పరిస్థితిని జాగ్రత్తగా గమనించడం అనే భావంతో ఇస్తూ, היהతో కూడిన కొనసాగుతున్న క్రియారూపాన్ని నిలుపుతుంది.
- source_word: בְּחוֹמֹת יְרוּשָׁלַםִ
  choice: యెరూషలేము ప్రాకారాలను
  rationale: పట్టణ రక్షణ గోడలకు ‘ప్రాకారాలు’ గౌరవప్రదమైన, స్పష్టమైన ఆధునిక తెలుగు పదం.
- source_word: אֲשֶׁר הַמְּפֹרָצִים
  choice: కూలగొట్టబడిన
  rationale: ప్రాకారాలు బద్దలై లేదా ఛేదించబడి ఉన్న స్థితిని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: וּשְׁעָרֶיהָ אֻכְּלוּ בָאֵשׁ
  choice: అగ్నికి ఆహుతైన దాని ద్వారాలను
  rationale: అగ్ని ‘తినివేయడం’ అనే హీబ్రూ రూపకాన్ని సహజమైన తెలుగు రూపకంతో, పూర్తిగా దహించబడిన భావంతో అందిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘తన్నీన్’ అర్థవ్యాప్తిని ప్రధాన పాఠంలో ఒకే జంతువుగా నిర్ణయించకుండా లిప్యంతరీకరించి పాదటిప్పణిలో ప్రత్యామ్నాయాలు ఇచ్చాం; క్లిష్టమైన שֹׂבֵר ప్రయోగానికి సందర్భోచిత అర్థాన్ని ఇచ్చి దాని సమస్యను పాదటిప్పణిలో వెల్లడించాం.
