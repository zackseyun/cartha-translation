translation:
  language: te
  text: అప్పుడు నేను యెరూషలేముకు వచ్చాను; అక్కడ మూడు రోజులు ఉన్నాను.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאָבוֹא
  choice: కాబట్టి నేను … వచ్చి
  rationale: వావ్-క్రమరూపం కథనంలోని తదుపరి సంఘటనను సూచిస్తుంది. సందర్భానుసారమైన ఫలితభావాన్ని ‘కాబట్టి’ సహజంగా తెలియజేస్తుంది; ‘వచ్చి’ తరువాతి క్రియతో వాక్యాన్ని సాఫీగా కలుపుతుంది.
- source_word: אֶל־יְרוּשָׁלִָם
  choice: యెరూషలేముకు
  rationale: చలనాన్ని తెలిపే క్రియతో אֶל గమ్యస్థానాన్ని సూచిస్తుంది. స్థలనామాన్ని ప్రామాణిక తెలుగు బైబిల్ రూపంలో లిప్యంతరీకరించాం.
- source_word: וָאֱהִי שָׁם
  choice: అక్కడ … ఉన్నాను
  rationale: היה అనే విస్తృతార్థక క్రియ ఇక్కడ స్థలవాచకమైన שָׁםతో కలిసి ఒక ప్రదేశంలో ఉండడాన్ని సూచిస్తుంది. ‘ఉన్నాను’ మూలంలోని సరళమైన ‘ఉండు’ భావాన్ని కాపాడుతుంది; ‘బస చేశాను’ అని మరింత నిర్దిష్టం చేయదు.
- source_word: יָמִים שְׁלֹשָׁה
  choice: మూడు రోజులు
  rationale: ఈ కాలవ్యవధి ప్రయోగం అక్కడ ఉన్న సమయాన్ని తెలుపుతుంది. తెలుగులో ‘మూడు రోజులు’ సహజంగానూ మూలానికి దగ్గరగానూ ఉంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సరళమైన ప్రథమపురుష కథనశైలి. మూలంలోని సంక్షిప్తతను, సంఘటనల క్రమాన్ని కాపాడుతూ సహజ తెలుగు వాక్యనిర్మాణం ఉపయోగించబడింది.
