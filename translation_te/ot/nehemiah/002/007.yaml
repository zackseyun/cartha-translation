id: NEH.2.7
reference: Nehemiah 2:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וָ/אוֹמַר֮ לַ/מֶּלֶךְ֒ אִם עַל הַ/מֶּ֣לֶךְ ט֔וֹב אִגְּרוֹת֙ יִתְּנוּ לִ֔/י עַֽל פַּחֲו֖וֹת עֵ֣בֶר הַ/נָּהָ֑ר אֲשֶׁר֙ יַעֲבִיר֔וּ/נִי עַ֥ד אֲשֶׁר אָב֖וֹא אֶל יְהוּדָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/007.yaml
  text: Then I said to the king[a], “If it pleases the king, let letters be given to me for the governors Beyond the River[c][b], so that they may let me pass through until I come to Judah.”
translation:
  language: te
  text: 'అప్పుడు నేను రాజుతో ఇలా అన్నాను: “రాజుకు సమ్మతమైతే, నది అవతలి ప్రాంతపు పాలకులకు[a] ఇవ్వడానికి నాకు ఉత్తరాలు ఇవ్వమని ఆజ్ఞాపించండి; నేను యూదాకు చేరుకునే వరకు వారు నన్ను వెళ్లనివ్వాలి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “నది అవతలి ప్రాంతం” అనేది యూఫ్రటీసు నదికి పశ్చిమాన ఉన్న ప్రాంతానికి పర్షియా పరిపాలనలో వాడిన పేరు.
    reason: cultural_note
lexical_decisions:
- source_word: וָאֹמַר
  choice: అప్పుడు నేను ... అన్నాను
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది; ‘అప్పుడు’ సహజమైన తెలుగు క్రమాన్ని తెలియజేస్తుంది.
- source_word: אִם עַל־הַמֶּלֶךְ טוֹב
  choice: రాజుకు సమ్మతమైతే
  rationale: ఇది రాజసభలో వినయపూర్వకంగా చేసే విజ్ఞప్తి సూత్రం; ‘సమ్మతమైతే’ అర్థాన్ని సహజంగా, గౌరవంగా అందిస్తుంది.
- source_word: אִגְּרוֹת יִתְּנוּ לִי
  choice: ఉత్తరాలను నాకు ఇప్పించండి
  rationale: రాజును ఉద్దేశించిన పరోక్ష ఆజ్ఞారూప విజ్ఞప్తిని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; ఉత్తరాల అధికారిక స్వభావం సందర్భం ద్వారా స్పష్టమవుతుంది.
- source_word: פַּחֲוֹת
  choice: పాలకులు
  rationale: పర్షియా పరిపాలనా ప్రాంతాల అధికారులను సూచించే పదానికి స్పష్టమైన, సాధారణ తెలుగు సమానం.
- source_word: עֵבֶר הַנָּהָר
  choice: నది అవతలి ప్రాంతం
  rationale: యూఫ్రటీసుకు పశ్చిమాన ఉన్న ప్రాంతానికి పర్షియా పరిపాలనలో వాడిన పేరును అర్థవంతంగా అందిస్తుంది.
- source_word: אֲשֶׁר יַעֲבִירוּנִי
  choice: నన్ను దాటనివ్వడానికి
  rationale: హిఫీల్ రూపం ఇక్కడ వారి అధికార పరిధుల గుండా ప్రయాణానికి అనుమతి ఇవ్వడాన్ని సూచిస్తుంది.
- source_word: עַד אֲשֶׁר אָבוֹא
  choice: నేను ... చేరుకునే వరకు
  rationale: గమ్యస్థానానికి చేరే దాకా అనే కాలపరిమితిని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: יְהוּדָה
  choice: యూదా
  rationale: హీబ్రూ స్థలనామానికి ప్రామాణిక తెలుగు రూపం; ‘యూదయ’ అనడం ఈ సందర్భంలో కాలవిరుద్ధం కావచ్చు.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన రాజసభ విజ్ఞప్తి శైలిని ఉపయోగించాం. హీబ్రూ వాక్య నిర్మాణాన్ని యాంత్రికంగా అనుకరించకుండా, దాని భావం మరియు వినయాన్ని కాపాడాం.
