- from: 'అప్పుడు నేను రాజుతో ఇలా అన్నాను: “రాజుకు సమ్మతమైతే, నేను యూదాకు చేరుకునే వరకు నన్ను దాటనివ్వడానికి నది అవతలి ప్రాంతపు పాలకులకు ఇవ్వవలసిన ఉత్తరాలను నాకు ఇప్పించండి.”[a]'
  to: 'అప్పుడు నేను రాజుతో ఇలా అన్నాను: “రాజుకు సమ్మతమైతే, నది అవతలి ప్రాంతపు పాలకులకు[a] ఇవ్వడానికి నాకు ఉత్తరాలు ఇవ్వమని ఆజ్ఞాపించండి; నేను యూదాకు చేరుకునే వరకు వారు నన్ను వెళ్లనివ్వాలి.”'
