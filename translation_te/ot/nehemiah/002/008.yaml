source:
  edition: WLC
  text: וְ/אִגֶּ֡רֶת אֶל אָסָף֩ שֹׁמֵ֨ר הַ/פַּרְדֵּ֜ס אֲשֶׁ֣ר לַ/מֶּ֗לֶךְ אֲשֶׁ֣ר יִתֶּן לִ֣/י עֵצִ֡ים לְ֠/קָרוֹת אֶת שַׁעֲרֵ֨י הַ/בִּירָ֤ה אֲשֶׁר לַ/בַּ֨יִת֙ וּ/לְ/חוֹמַ֣ת הָ/עִ֔יר וְ/לַ/בַּ֖יִת אֲשֶׁר אָב֣וֹא אֵלָ֑י/ו וַ/יִּתֶּן לִ֣/י הַ/מֶּ֔לֶךְ כְּ/יַד אֱלֹהַ֖/י הַ/טּוֹבָ֥ה עָלָֽ/י־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/008.yaml
  text: and a letter to Asaph[a], the keeper of the king’s forest, that he should give me timber to make beams for the gates of the fortress by the temple, and for the wall of the city, and for the house that I will occupy. And the king gave them to me[d][c][b], according to the good hand of my God upon me.
translation:
  language: te
  text: రాజుకు చెందిన వనాన్ని[a] కాపాడే ఆసాఫుకు ఒక ఉత్తరం కూడా ఇవ్వమని అడిగాను. మందిరానికి సంబంధించిన దుర్గపు ద్వారాలకు[b], పట్టణ ప్రాకారానికి, నేను వెళ్లి నివసించబోయే ఇంటికి[c] దూలాలు చేయడానికి కావలసిన కలపను అతడు నాకు ఇవ్వాలని అందులో రాయమన్నాను. నా దేవుని మంచి హస్తం నాపై ఉన్నందువల్ల[d], రాజు నాకు ఇచ్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘వనం’కు మూలపదం రాజ ఉద్యానవనం, రాజవనం లేదా సంరక్షిత వృక్షప్రాంతం అనే అర్థాలనూ ఇవ్వగలదు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘ఆ ఇంటికి సంబంధించిన దుర్గపు ద్వారాలు.’ సందర్భంలో ‘ఇల్లు’ మందిరాన్ని సూచించవచ్చు. ‘దుర్గం’కు ‘కోట’ లేదా ‘గఢం’ అనే అనువాదాలూ సాధ్యం.
    reason: lexical_alternative
  - marker: c
    text: 'అక్షరార్థం: ‘నేను ప్రవేశించబోయే ఇల్లు’; సందర్భంలో ఇది నెహెమ్యా నివసించబోయే ఇంటిని సూచిస్తుంది.'
    reason: lexical_alternative
  - marker: d
    text: 'అక్షరార్థానికి దగ్గరగా: ‘నా దేవుని మంచి హస్తం నాపై ఉన్న ప్రకారం.’ ఇది దేవుని అనుగ్రహపూర్వక సహాయాన్ని తెలిపే రూపకం.'
    reason: cultural_note
lexical_decisions:
- source_word: אִגֶּרֶת
  choice: ఉత్తరం
  rationale: రాజు అధికారంతో ఇచ్చే లిఖితపత్రం అనే సందర్భార్థాన్ని సహజమైన ఆధునిక తెలుగులో ‘ఉత్తరం’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: שֹׁמֵר הַפַּרְדֵּס
  choice: రాజుకు చెందిన వనాన్ని పర్యవేక్షించే వ్యక్తి
  rationale: פַּרְדֵּס రాజవనాన్ని, ఉద్యానవనాన్ని లేదా సంరక్షిత వృక్షప్రాంతాన్ని సూచించవచ్చు. నిర్మాణానికి కలప ఇవ్వాల్సిన సందర్భంలో ‘వనం’ తగినది; ప్రత్యామ్నాయ భావాలు పాదసూచికలో ఉంచబడ్డాయి.
- source_word: יִתֶּן לִי עֵצִים
  choice: కావలసిన కలపను అతడు నాకు ఇవ్వాలి
  rationale: עֵצִים అక్షరార్థంగా చెట్లు/చెక్క అయినా, నిర్మాణ సందర్భంలో ‘కలప’ సహజమైన ఎంపిక.
- source_word: לְקָרוֹת
  choice: దూలాలు వేయడానికి
  rationale: ఈ క్రియ దూలాలు అమర్చడం లేదా కప్పు నిర్మించడం అనే భావాన్ని ఇస్తుంది. ‘దూలాలు వేయడానికి’ నిర్మాణక్రియను స్పష్టంగా, అతివ్యాఖ్య లేకుండా తెలియజేస్తుంది.
- source_word: שַׁעֲרֵי הַבִּירָה אֲשֶׁר לַבַּיִת
  choice: మందిరానికి చెందిన కోట ద్వారాలు
  rationale: בִּירָה కోట లేదా దుర్గాన్ని సూచిస్తుంది; אֲשֶׁר לַבַּיִת అనుబంధం లేదా స్వామ్యాన్ని సూచిస్తుంది. ‘చెంతనున్న’ అని నిర్ణయించకుండా ‘చెందిన’ అని అనువదించాం; ఈ సందర్భంలోని ‘ఇల్లు’ మందిరాన్ని సూచించే అవకాశాన్ని ప్రధాన పాఠ్యంలో స్పష్టం చేశాం.
- source_word: הַבַּיִת אֲשֶׁר אָבוֹא אֵלָיו
  choice: నేను వెళ్లి నివసించబోయే ఇల్లు
  rationale: అక్షరార్థం ‘నేను ప్రవేశించబోయే ఇల్లు.’ సందర్భంలో అది నెహెమ్యా ఉండే నివాసం; ‘వెళ్లి నివసించబోయే’ అనేది ప్రవేశ భావాన్నీ ఉద్దేశిత వినియోగాన్నీ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וַיִּתֶּן לִי הַמֶּלֶךְ
  choice: రాజు నాకు ఇచ్చాడు
  rationale: హీబ్రూ పాఠ్యంలో ఇచ్చిన దాని కర్మ స్పష్టంగా లేదు. ముందటి అభ్యర్థనలే అంతర్భావిత కర్మగా ఉండేలా తెలుగులో కూడా దానిని చేర్చకుండా ఉంచాం.
- source_word: כְּיַד אֱלֹהַי הַטּוֹבָה עָלַי
  choice: నా దేవుని మంచి హస్తం నాకు తోడుగా ఉన్నందున
  rationale: ‘మంచి హస్తం’ అనే మూల రూపకాన్ని నిలుపుతూ, כְּ సంబంధాన్ని సందర్భానుసారంగా కారణార్థకమైన ‘ఉన్నందున’తో సహజ తెలుగులో వ్యక్తం చేశాం.
theological_decisions:
- issue: దేవుని అనుకూల కార్యాన్ని ‘మంచి హస్తం’ అనే మానవరూపక భాషతో వ్యక్తపరచడం
  choice: నా దేవుని మంచి హస్తం నాకు తోడుగా ఉన్నందున
  alternative: నా దేవుడు నాకు మేలు చేసినందున / నాకు సహాయం చేసినందున
  rationale: ఎజ్రా–నెహెమ్యా గ్రంథాల్లో ప్రాముఖ్యమైన ‘హస్తం’ రూపకాన్ని తొలగించకుండా, దేవుని అనుకూలమైన సక్రియ కార్యాన్ని పాఠ్యంలో ఉన్నట్టే నిలిపాం.
- issue: אֲשֶׁר לַבַּיִת లోని בַּיִת గుర్తింపు
  choice: ప్రధాన పాఠ్యంలో ‘మందిరం’; పాదసూచికలో అక్షరార్థం ‘ఇల్లు’
  alternative: ఇల్లుకు చెందిన కోట / మందిరం చెంతనున్న కోట
  rationale: సందర్భంలో ‘ఆ ఇల్లు’ దేవాలయాన్ని సూచించే అవకాశం బలంగా ఉంది. అయితే సంబంధాన్ని ‘చెంత’గా మాత్రమే నిర్ణయించకుండా ‘చెందిన’ అని ఉంచి, మూలంలోని పదార్థాన్ని పాదసూచికలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథనశైలి వాడబడింది. ‘ప్రాకారం,’ ‘దూలాలు,’ ‘హస్తం’ వంటి పదాలు బైబిలు సందర్భానికి తగిన గంభీరతను ఇస్తూనే సాధారణ పాఠకులకు అర్థమయ్యేలా ఉన్నాయి. వచనం ముందు వచనంలోని అభ్యర్థనకు వ్యాకరణపరంగా అనుసంధానమైనప్పటికీ, విడిగా చదివినప్పుడు స్పష్టంగా ఉండేందుకు ‘ఇవ్వమని అడిగాను’ మరియు ‘అందులో రాయమన్నాను’ అనే సహజ తెలుగు నిర్మాణం వాడబడింది.
