  revision_rationale: మూలంలోని సంబంధాలను మరింత స్పష్టంగా వ్యక్తం చేయడానికి ‘మందిరానికి సంబంధించిన దుర్గపు ద్వారాలు’గా సవరించాం. దేవుని అనుకూలతను సూచించే హీబ్రూ రూపకంలోని ‘నాపై’ను ప్రధాన పాఠ్యంలో నిలిపాం. ఇతరత్రా పాఠ్యంలోని సందర్భానుగుణ స్పష్టీకరణలు, అంతర్భావిత కర్మను పేర్కొనని ‘రాజు నాకు ఇచ్చాడు’ అనే నిర్మాణం, మరియు పాదసూచికల ప్రత్యామ్నాయాలు నిలుపబడ్డాయి.
