- from: రాజుకు చెందిన వనాన్ని[a] పర్యవేక్షించే ఆసాఫుకు ఒక ఉత్తరం కూడా ఇవ్వమని అడిగాను. మందిరానికి చెందిన కోట ద్వారాలకు[b], పట్టణ ప్రాకారానికి, నేను వెళ్లి నివసించబోయే ఇంటికి[c] దూలాలు వేయడానికి కావలసిన కలపను అతడు నాకు ఇవ్వాలని అందులో రాయమన్నాను. నా దేవుని మంచి హస్తం నాకు తోడుగా ఉన్నందున[d], రాజు నాకు ఇచ్చాడు.
  to: రాజుకు చెందిన వనాన్ని[a] కాపాడే ఆసాఫుకు ఒక ఉత్తరం కూడా ఇవ్వమని అడిగాను. మందిరానికి సంబంధించిన దుర్గపు ద్వారాలకు[b], పట్టణ ప్రాకారానికి, నేను వెళ్లి నివసించబోయే ఇంటికి[c] దూలాలు చేయడానికి కావలసిన కలపను అతడు నాకు ఇవ్వాలని అందులో రాయమన్నాను. నా దేవుని మంచి హస్తం నాపై ఉన్నందువల్ల[d], రాజు నాకు ఇచ్చాడు.
  rationale: మూలంలోని సంబంధాలను మరింత స్పష్టంగా వ్యక్తం చేయడానికి ‘మందిరానికి సంబంధించిన దుర్గపు ద్వారాలు’గా సవరించాం. దేవుని అనుకూలతను సూచించే హీబ్రూ రూపకంలోని ‘నాపై’ను ప్రధాన పాఠ్యంలో నిలిపాం. ఇతరత్రా పాఠ్యంలోని సందర్భానుగుణ స్పష్టీకరణలు, అంతర్భావిత కర్మను పేర్కొనని ‘రాజు నాకు ఇచ్చాడు’ అనే నిర్మాణం, మరియు పాదసూచికల ప్రత్యామ్నాయాలు నిలుపబడ్డాయి.
