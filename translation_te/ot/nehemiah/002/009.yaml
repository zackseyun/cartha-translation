translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథన శైలి వాడబడింది. పర్షియా పరిపాలనా హోదాను వివరణాత్మకంగా కానీ అతివ్యాఖ్యానం చేయకుండా అందించాం; సైనిక పదాలకు స్పష్టమైన సాధారణ రూపాలను ఎంచుకున్నాం.
