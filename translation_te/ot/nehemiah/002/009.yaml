base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/009.yaml
  text: So I came to the governors Beyond the River and gave them the king’s letters[b][a]. Now the king had sent with me army officers and horsemen.
translation:
  language: te
  text: అప్పుడు నేను నది అవతలి ప్రాంతపు అధిపతుల దగ్గరకు[a] వచ్చి, వారికి రాజు ఉత్తరాలు ఇచ్చాను. రాజు నాతోపాటు సైన్యాధికారులను, గుర్రపు సైనికులను కూడా పంపించాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నది అవతలి ప్రాంతం’ అనేది యూఫ్రటీసు నదికి పశ్చిమాన ఉన్న పర్షియా పరిపాలనా ప్రాంతాన్ని సూచించే పేరు; దీనిని ‘ట్రాన్స్-యూఫ్రటీస్’ అని కూడా అంటారు.
    reason: cultural_note
  - marker: b
    text: లేదా “సైనిక నాయకులను, గుర్రపు దళాన్ని.”
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּחֲווֹת
  choice: పాలకులు
  rationale: పర్షియా సామ్రాజ్యంలోని పరిపాలనా విభాగాలను పాలించిన అధికారులను సూచిస్తుంది. ‘పాలకులు’ ఆధునిక తెలుగు పాఠకులకు స్పష్టంగా ఉండి, వారి అధికారిక హోదాను తెలియజేస్తుంది.
- source_word: עֵבֶר הַנָּהָר
  choice: నది అవతలి ప్రాంతం
  rationale: ఇది యూఫ్రటీసు నదికి పశ్చిమాన ఉన్న పర్షియా పరిపాలనా ప్రాంతానికి వాడిన హోదా. ‘నది అవతలి ప్రాంతం’ అనే అనువాదం మూలంలోని ప్రాంతీయ నామ స్వభావాన్ని కాపాడుతూ తెలుగులో సహజంగా ఉంటుంది.
- source_word: אִגְּרוֹת
  choice: ఉత్తరాలు
  rationale: ఈ పదం లిఖితపూర్వక సందేశాలను సూచిస్తుంది; సందర్భంలో ఇవి రాజు ఇచ్చిన అధికారిక అనుమతి ఉత్తరాలు. ‘ఉత్తరాలు’ సహజమైనదీ, తగినంత నిర్దిష్టమైనదీ.
- source_word: שָׂרֵי חַיִל
  choice: సైన్యాధికారులు
  rationale: ఈ సంయుక్త పదబంధం సైనిక నాయకులను లేదా అధికారులను సూచిస్తుంది. ‘సైన్యాధికారులు’ సంక్షిప్తంగా, సహజంగా ఉండి వారి అధికారిక సైనిక పాత్రను నిలుపుతుంది.
- source_word: פָרָשִׁים
  choice: గుర్రపు రౌతులు
  rationale: మూలపదం గుర్రాలపై ప్రయాణించే లేదా యుద్ధం చేసే వారిని సూచిస్తుంది. ‘గుర్రపు రౌతులు’ సమూహార్థకమైన ‘అశ్వదళం’ కంటే మూలంలోని వ్యక్తుల సూచనకు దగ్గరగా ఉంటుంది.
- source_word: וַיִּשְׁלַח עִמִּי הַמֶּלֶךְ
  choice: రాజు నాతోపాటు ... కూడా పంపించాడు
  rationale: ముందటి ప్రధాన చర్యల తర్వాత ఈ వాక్యం నెహెమ్యాతో వచ్చిన రక్షణ బృందాన్ని నేపథ్య సమాచారంగా వివరిస్తుంది. తెలుగులో ‘కూడా పంపించాడు’ ఈ సంబంధాన్ని సహజంగా తెలియజేస్తుంది; మూలంలో లేని కాలభేదాన్ని అతిగా స్పష్టీకరించదు.
- source_word: וָאָבוֹא
  choice: కాబట్టి నేను ... వచ్చి
  rationale: వావ్ కథన క్రమాన్ని కొనసాగిస్తుంది. ముందు సందర్భం నుంచి ఫలితంగా జరిగిన ప్రయాణాన్ని ‘కాబట్టి’ సహజంగా అనుసంధానిస్తుంది; ‘వచ్చి’ తరువాతి ‘ఇచ్చాను’ అనే చర్యతో ప్రవాహాన్ని నిలుపుతుంది.
