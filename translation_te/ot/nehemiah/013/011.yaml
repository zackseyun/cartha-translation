  yaml_path: translation/ot/nehemiah/013/011.yaml
  text: So I contended with the officials and said[b][a], “Why has the house of God been neglected?” Then I gathered them and stationed them at their posts.
translation:
  language: te
  text: అప్పుడు నేను అధికారులతో వాదించి, “దేవుని మందిరం ఎందుకు నిర్లక్ష్యం చేయబడింది?[a]” అని అన్నాను. తరువాత వారిని సమకూర్చి, వారి వారి విధుల్లో నిలిపాను.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దేవుని మందిరం ఎందుకు విడిచిపెట్టబడింది?” హీబ్రూ క్రియకు ‘విడిచిపెట్టడం’ లేదా ‘పట్టించుకోకుండా వదిలేయడం’ అనే భావాలు రావచ్చు; ఇక్కడి సందర్భం ఆలయ సేవను, దానికి కావలసిన పోషణను నిర్లక్ష్యం చేయడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “వారి వారి స్థానాల్లో నిలిపాను.” అంటే లేవీయులను, సంబంధిత సేవకులను వారికి నియమించబడిన సేవల్లో తిరిగి ఉంచాను.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאָרִיבָה
  choice: నేను అధికారులతో వాదించి
  rationale: ריב అనే క్రియలో ఎదుర్కొని వివాదపడే బలం ఉంది. ‘వాదించి’ అనేది కేవలం గద్దించడమనే పరిమిత భావం ఇవ్వకుండా ఆ ప్రతిఘటనను సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: הַסְּגָנִים
  choice: అధికారులతో
  rationale: సందర్భంలో సְגָנִים పరిపాలనా బాధ్యతగల అధికారులను సూచిస్తుంది; ‘అధికారులు’ ఆధునిక పాఠకులకు స్పష్టంగా ఉంటుంది.
- source_word: וָאֹמְרָה
  choice: అని అడిగాను
  rationale: మూలంలో అక్షరార్థంగా ‘అని చెప్పాను’ ఉన్నా, వెంటనే ప్రత్యక్ష ప్రశ్న రావడం వల్ల తెలుగులో ‘అని అడిగాను’ సహజంగా ఉండి సంభాషణ క్రియను స్పష్టపరుస్తుంది.
- source_word: נֶעֱזַב
  choice: నిర్లక్ష్యం చేయబడింది
  rationale: עזב యొక్క నిఫ్అల్ రూపం ‘విడిచిపెట్టబడింది/పట్టించుకోబడలేదు’ అనే భావాన్ని ఇస్తుంది. ఆలయ సేవ, పోషణ ఆగిపోయిన సందర్భంలో ‘నిర్లక్ష్యం చేయబడింది’ సరిపోతుంది; ‘విడిచిపెట్టబడింది’ అనే ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలిపాం.
- source_word: בֵּית הָאֱלֹהִים
  choice: దేవుని మందిరం
  rationale: ‘దేవుని ఇల్లు’ మూల నిర్మాణానికి మరింత అక్షరార్థమైనా, ఆలయ సందర్భంలో ‘దేవుని మందిరం’ సహజమైన, గౌరవప్రదమైన తెలుగు; ఇది సూచిత స్థలాన్ని అతిగా వివరణ చేయకుండా తెలియజేస్తుంది.
- source_word: וָאֶקְבְּצֵם
  choice: వారిని సమకూర్చి
  rationale: קבץ అంటే కూడగట్టడం లేదా సమకూర్చడం. ఇక్కడ సేవకులను తిరిగి ఒకచోట చేర్చడాన్ని ‘సమకూర్చి’ సహజంగా తెలియజేస్తుంది.
- source_word: וָאַעֲמִידֵם עַל־עָמְדָם
  choice: వారి వారి విధుల్లో నిలిపాను
  rationale: עמד హిఫిల్‌తో עַל־עָמְדָם కలిసిన పదబంధం వారిని వారి నియమిత స్థానాల్లో లేదా సేవల్లో తిరిగి ఉంచడాన్ని సూచిస్తుంది. ‘వారి వారి విధుల్లో నిలిపాను’ కార్యాత్మక భావాన్ని స్పష్టంగా అందిస్తుంది.
theological_decisions:
- issue: దేవుని మందిరం పూర్తిగా విడిచిపెట్టబడిందా లేక దాని సేవ నిర్లక్ష్యం చేయబడిందా
  choice: నిర్లక్ష్యం చేయబడింది
  alternative: విడిచిపెట్టబడింది
  rationale: హీబ్రూ నిష్క్రియ క్రియ రెండు భావాలనూ అనుమతిస్తుంది. సమీప సందర్భంలో లేవీయులు తమ పొలాలకు వెళ్లిపోవడం, ఆలయ సేవకు మద్దతు నిలిచిపోవడం ప్రధాన సమస్య కాబట్టి ‘నిర్లక్ష్యం’ సందర్భానుకూలం; అయినా బలమైన ‘విడిచిపెట్టడం’ భావాన్ని పాదసూచికలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘మందిరం,’ ‘అధికారులు,’ ‘విధులు’ వంటి పదాలు సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా ఎంచుకోబడ్డాయి. మూలంలోని నిష్క్రియ క్రియకు ఉన్న అర్థ విస్తృతిని పాదసూచికలో నిలిపాం.
