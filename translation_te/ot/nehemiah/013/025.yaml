language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וָ/אָרִ֤יב עִמָּ/ם֙ וָ/אֲקַֽלְלֵ֔/ם וָ/אַכֶּ֥ה מֵ/הֶ֛ם אֲנָשִׁ֖ים וָֽ/אֶמְרְטֵ֑/ם וָ/אַשְׁבִּיעֵ֣/ם בֵּֽ/אלֹהִ֗ים אִם תִּתְּנ֤וּ בְנֹֽתֵי/כֶם֙ לִ/בְנֵי/הֶ֔ם וְ/אִם תִּשְׂאוּ֙ מִ/בְּנֹ֣תֵי/הֶ֔ם לִ/בְנֵי/כֶ֖ם וְ/לָ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/025.yaml
  text: 'So I contended with them and cursed them[a], and I struck some of the men and pulled out their hair, and I made them swear by God: “You shall not give your daughters to their sons[b], nor take any of their daughters for your sons or for yourselves.”'
translation:
  language: te
  text: 'నేను వారితో వాదించి, వారిని శపించాను[a]. వారిలో కొందరు పురుషులను కొట్టి, వారి జుట్టు పీకాను. తరువాత దేవుని పేరున వారితో ఇలా ప్రమాణం చేయించాను: “మీ కుమార్తెలను వారి కుమారులకు ఇవ్వకూడదు[b]; వారి కుమార్తెలలో ఎవరినీ మీ కుమారుల కోసం గానీ, మీ కోసం గానీ తీసుకోకూడదు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారిపై శాపం పలికాను.”
    reason: קלל ఇక్కడ శపించడం లేదా శాపవాక్యం పలకడం అనే భావాన్ని కలిగి ఉంది; ప్రత్యామ్నాయ రూపం ఆ వాచిక చర్యను మరింత స్పష్టంగా చూపుతుంది.
  - marker: b
    text: హీబ్రూలో పదశః, “మీరు ఇస్తే ... మీరు తీసుకుంటే ...”; ప్రమాణ సందర్భంలో దీని భావం, “ఇవ్వకూడదు ... తీసుకోకూడదు.”
    reason: మూలంలోని אם నిర్మాణాన్ని నమోదు చేస్తూ, సందర్భానుసారమైన నిషేధ భావాన్ని వివరిస్తుంది.
lexical_decisions:
- source_word: וָאָרִיב
  choice: వారితో వాదించి
  rationale: ריבలోని ఎదుర్కొని వివాదపడే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; కేవలం ‘గద్దించాను’ అని మృదుపరచదు.
- source_word: וָאֲקַלְלֵם
  choice: వారిని శపించాను
  rationale: קלל ఇక్కడ వారిపై శాపవాక్యం పలికిన భావాన్ని నేరుగా తెలియజేస్తుంది; దూషణగా మాత్రమే పరిమితం చేయదు.
- source_word: וָאַכֶּה מֵהֶם אֲנָשִׁים
  choice: వారిలో కొందరు పురుషులను కొట్టి
  rationale: מן సూచించే సమూహంలోని కొంతమందనే భావాన్ని నిలుపుతూ, హింసను తగ్గించకుండా లేదా అతిశయింపకుండా తెలుపుతుంది.
- source_word: וָאֶמְרְטֵם
  choice: వారి జుట్టు పీకాను
  rationale: מרט జుట్టును పీకడం లేదా పెరికివేయడాన్ని సూచిస్తుంది; హీబ్రూలో అంతర్లీనంగా ఉన్న ‘జుట్టు’ను తెలుగులో స్పష్టంచేయడం అవసరం.
- source_word: וָאַשְׁבִּיעֵם בֵּאלֹהִים
  choice: దేవుని పేరట వారితో ప్రమాణం చేయిస్తూ
  rationale: שבע హిఫీల్ ఇతరులతో ప్రమాణం చేయించడాన్ని సూచిస్తుంది; בֵּאלֹהִים ప్రమాణానికి దేవుణ్ణి ఆధారంగా పిలుచుకునే భావాన్ని ‘దేవుని పేరట’ సహజంగా అందిస్తుంది.
- source_word: אִם תִּתְּנוּ
  choice: ఇవ్వకూడదు
  rationale: ప్రమాణ సందర్భంలో אם నిషేధాత్మక ప్రమాణవాక్యాన్ని ప్రవేశపెడుతుంది; తెలుగులో ‘ఇవ్వకూడదు’ ఆ బలాన్ని సహజంగా అందిస్తుంది.
- source_word: בְּנֹתֵיכֶם לִבְנֵיהֶם
  choice: మీ కుమార్తెలను వారి కుమారులకు
  rationale: వివాహం కోసం కుమార్తెలను ఇవ్వడమనే దిశను హీబ్రూ నిర్మాణానికి దగ్గరగా నిలుపుతుంది.
- source_word: וְאִם תִּשְׂאוּ מִבְּנֹתֵיהֶם
  choice: వారి కుమార్తెలలో ఎవరినీ ... తీసుకోకూడదు
  rationale: వివాహ సందర్భంలోని נשא ‘భార్యగా తీసుకోవడం’ అనే భావాన్ని సందర్భం ద్వారా నిలుపుతూ, మూలంలోని ‘తీసుకోవడం’ రూపకాన్ని కాపాడుతుంది.
- source_word: לִבְנֵיכֶם וְלָכֶם
  choice: మీ కుమారుల కోసం గానీ, మీ కోసం గానీ
  rationale: నిషేధం తమ కుమారులకు వివాహాలు చేయడానికీ, తామే వివాహం చేసుకోవడానికీ వర్తిస్తుందని పంపిణీ భావంతో స్పష్టంగా తెలుపుతుంది.
theological_decisions:
- issue: నెహెమ్యా చేసిన కఠినమైన శారీరక, వాచిక చర్యలను ఎలా అనువదించాలి
  choice: శపించడం, కొట్టడం, జుట్టు పీకడం అన్నింటినీ నేరుగా నిలుపడం
  alternative: వాటిని కేవలం గద్దింపుగా మృదుపరచడం లేదా మూలానికి మించి తీవ్రమైన హింసగా విస్తరించడం
  rationale: వచనం కఠినమైన ఒడంబడిక క్రమశిక్షణను నివేదిస్తుంది. అనువాదం ఆ హింసను సమర్థించకుండా, ఖండనను జోడించకుండా, తగ్గించకుండా యథాతథంగా తెలియజేయాలి.
- issue: ప్రమాణవాక్యంలో אִם యొక్క భావబలం
  choice: తెలుగులో నిషేధంగా ‘ఇవ్వకూడదు ... తీసుకోకూడదు’ అని అనువదించడం
  alternative: పదశః ‘ఒకవేళ ఇస్తే ... ఒకవేళ తీసుకుంటే’ అని షరతుగా ఉంచడం
  rationale: ఇక్కడ אִם సాధారణ షరతు కాదు; ప్రమాణ సందర్భంలో నిషేధాత్మక ప్రమాణ విషయాన్ని సూచిస్తుంది. నిషేధ రూపం అర్థాన్ని సహజంగా అందిస్తూ, పాదసూచిక మూల నిర్మాణాన్ని నమోదు చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కథన శైలిని వాడాం. ‘వాదించి,’ ‘శపించాను,’ ‘కొట్టి,’ ‘జుట్టు పీకాను’ అనే సరళ పదాలు మూలంలోని ఘర్షణను మృదుపరచవు. ప్రమాణ భాగంలో ‘కూడదు’ రూపం సాధారణ పాఠకులకు సహజంగా ఉండి దాని గంభీర నిషేధబలాన్ని నిలుపుతుంది.
