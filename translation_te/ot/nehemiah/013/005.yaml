source:
  edition: WLC
  text: וַ/יַּ֨עַשׂ ל֜/וֹ לִשְׁכָּ֣ה גְדוֹלָ֗ה וְ/שָׁ֣ם הָי֪וּ לְ/פָנִ֟ים נֹ֠תְנִים אֶת הַ/מִּנְחָ֨ה הַ/לְּבוֹנָ֜ה וְ/הַ/כֵּלִ֗ים וּ/מַעְשַׂ֤ר הַ/דָּגָן֙ הַ/תִּיר֣וֹשׁ וְ/הַ/יִּצְהָ֔ר מִצְוַת֙ הַ/לְוִיִּ֔ם וְ/הַ/מְשֹׁרְרִ֖ים וְ/הַ/שֹּׁעֲרִ֑ים וּ/תְרוּמַ֖ת הַ/כֹּהֲנִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/005.yaml
  text: He made for him a large chamber[a], where formerly they had put the grain offering, the frankincense, the vessels, and the tithe of grain, new wine, and oil—the portion commanded for the Levites, the singers[d][c][b], and the gatekeepers—and the contribution for the priests.
translation:
  language: te
  text: అతడు అతనికోసం ఒక పెద్ద గదిని[a] సిద్ధం చేశాడు. గతంలో అక్కడ[b] ధాన్యార్పణను, సాంబ్రాణిని, పాత్రలను, ధాన్యం, కొత్త ద్రాక్షామద్యం, నూనెలలో పదో వంతును—అది లేవీయులకు, గాయకులకు, ద్వారపాలకులకు నియమించబడిన భాగం[c]—యాజకుల కోసం కేటాయించిన కానుకను[d] ఉంచేవారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఒక పెద్ద నిల్వగదిని.’ హీబ్రూ పదం దేవాలయ ప్రాంగణంలో వస్తువులను నిల్వచేసే గదిని కూడా సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ వాక్యనిర్మాణం, ‘గతంలో అక్కడ ఉంచుతూ ఉండేవారు’ అనే అలవాటుగా జరిగే గత చర్యను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: అక్షరార్థంగా, ‘లేవీయులు, గాయకులు, ద్వారపాలకుల నియమం.’ సందర్భంలో ఇది వారికి నియమించబడిన భాగాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: d
    text: లేదా ‘యాజకుల కోసం ఎత్తి అర్పించే అర్పణను.’ హీబ్రూ పదం ప్రత్యేకంగా వేరుచేసిన కానుకను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ לוֹ
  choice: అతడు అతనికోసం ... సిద్ధం చేశాడు
  rationale: עשה + ל־ ఇక్కడ అతనికోసం గదిని తయారుచేయడం లేదా సిద్ధపరచడం అనే భావం ఇస్తుంది. ఆధునిక తెలుగులో ‘సిద్ధం చేశాడు’ సహజంగా ఉండి, సందర్భంలోని ఏర్పాటును స్పష్టంగా తెలియజేస్తుంది.
- source_word: לִשְׁכָּה גְדוֹלָה
  choice: ఒక పెద్ద గది
  rationale: לִשְׁכָּה దేవాలయ ప్రాంగణంలోని గది లేదా నిల్వగదిని సూచించగలదు. ప్రధాన పాఠంలో విస్తృతార్థమున్న ‘గది’ని ఉంచి, నిల్వగది అనే ప్రత్యామ్నాయాన్ని పాదసూచికలో తెలిపాం.
- source_word: וְשָׁם הָיוּ לְפָנִים נֹתְנִים
  choice: గతంలో అక్కడ ... ఉంచేవారు
  rationale: היה + participle గతంలో అలవాటుగా జరిగే చర్యను సూచిస్తుంది; తెలుగు ‘ఉంచేవారు’ ఆ పునరావృత గత ఆచారాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: הַמִּנְחָה
  choice: ధాన్యార్పణ
  rationale: దేవాలయ ఆరాధనా సందర్భంలో מִנְחָה ప్రత్యేకంగా ధాన్యంతో చేసే అర్పణను సూచిస్తుంది.
- source_word: הַלְּבוֹנָה
  choice: సాంబ్రాణి
  rationale: לְבוֹנָה బలులు, ధూపారాధన సందర్భాల్లో వాడే frankincenseను సూచిస్తుంది; ‘సాంబ్రాణి’ సాధారణ తెలుగు పాఠకులకు అర్థమయ్యే సమీప పదం.
- source_word: הַכֵּלִים
  choice: పాత్రలు
  rationale: దేవాలయ సేవలో ఉపయోగించే పాత్రలు లేదా సామగ్రి అనే భావాన్ని ‘పాత్రలు’ సంక్షిప్తంగా, సహజంగా అందిస్తుంది.
- source_word: מַעְשַׂר הַדָּגָן הַתִּירוֹשׁ וְהַיִּצְהָר
  choice: ధాన్యం, కొత్త ద్రాక్షారసం, నూనెల పదో వంతు
  rationale: מַעְשַׂרను ‘పదో వంతు’గా ప్రత్యక్షంగా అనువదించాం. תִּירוֹשׁకు ‘కొత్త ద్రాక్షారసం’ అని ఇవ్వడం దాని ప్రత్యేక భావాన్ని కాపాడుతుంది; יִצְהָרకు సందర్భానుగుణంగా ‘నూనె’ సరిపోతుంది.
- source_word: מִצְוַת הַלְוִיִּם וְהַמְשֹׁרְרִים וְהַשֹּׁעֲרִים
  choice: అది లేవీయులకు, గాయకులకు, ద్వారపాలకులకు నియమించబడిన భాగం
  rationale: హీబ్రూ నిర్మాణం అక్షరార్థంగా ‘వారి ఆజ్ఞ/నియమం’ అని ఉన్నప్పటికీ, నిల్వచేసిన పదో వంతులో వారికి నియమించబడిన భాగాన్ని సందర్భం సూచిస్తుంది. ఏకవచన సమూహార్థాన్ని ‘భాగం’తో నిలిపాం.
- source_word: תְרוּמַת הַכֹּהֲנִים
  choice: యాజకుల కోసం ప్రతిష్ఠించిన అర్పణ
  rationale: תְּרוּמָה దేవునికి ప్రత్యేకంగా వేరుచేసిన కానుక లేదా అర్పణ. ‘ప్రతిష్ఠించిన అర్పణ’ ఆ వేరుచేయబడిన స్వభావాన్ని తెలియజేస్తుంది; అది యాజకుల కోసం అన్న సంబంధాన్ని వాక్య నిర్మాణం కాపాడుతుంది.
theological_decisions:
- issue: מִצְוַת అనే పదబంధం ఆజ్ఞను సూచిస్తుందా, నియమిత భాగాన్ని సూచిస్తుందా
  choice: ప్రధాన పాఠంలో ‘నియమించబడిన భాగం’ అని సందర్భార్థం ఇచ్చి, అక్షరార్థ నిర్మాణాన్ని పాదసూచికలో తెలిపాం.
  alternative: ‘లేవీయులు, గాయకులు, ద్వారపాలకుల ఆజ్ఞ’ లేదా ‘వారిని గూర్చిన నియమం’
  rationale: ఇక్కడ నిల్వచేసిన పదార్థాల జాబితా కొనసాగుతున్నందున, వారికి విధించబడిన కర్తవ్యంకన్నా వారికి రావలసిన వాటానే సూచించే అవకాశం బలంగా ఉంది. అయితే హీబ్రూలోని అసాధారణ నిర్మాణాన్ని పాదసూచిక ద్వారా దాచలేదు.
- issue: תְרוּמָה యొక్క ఆచారపరమైన సాంకేతిక భావం
  choice: ‘ప్రతిష్ఠించిన అర్పణ’
  alternative: ‘ఎత్తి అర్పించే అర్పణ’ లేదా ‘యాజకుల కానుక’
  rationale: సాంప్రదాయ సాంకేతిక పదాన్ని బలవంతంగా రుద్దకుండా, దేవునికి వేరుచేసిన కానుక అనే మూలభావాన్ని వ్యక్తం చేశాం; ప్రత్యామ్నాయ ఆచారపరమైన అనువాదాన్ని పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా చదవగల శైలి వాడబడింది. దేవాలయ సందర్భానికి తగిన ‘ధాన్యార్పణ’, ‘యాజకులు’, ‘ప్రతిష్ఠించిన అర్పణ’ వంటి పదాలు ఉంచినా, అతిగా సాంకేతికమైన లేదా మతశాఖకు ప్రత్యేకమైన పదజాలాన్ని నివారించాం. హీబ్రూ జాబితా నిర్మాణాన్ని డాష్‌ల మధ్య వివరణతో స్పష్టపరిచాం.
