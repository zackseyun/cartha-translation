revisions:
- from: అతడు అతనికోసం ఒక పెద్ద గదిని[a] సిద్ధం చేశాడు. గతంలో అక్కడ[b] ధాన్యార్పణను, సాంబ్రాణిని, పాత్రలను, ధాన్యం, కొత్త ద్రాక్షారసం, నూనెల పదో వంతును—అది లేవీయులకు, గాయకులకు, ద్వారపాలకులకు నియమించబడిన భాగం[c]—యాజకుల కోసం ప్రతిష్ఠించిన అర్పణను[d] ఉంచేవారు.
  to: అతడు అతనికోసం ఒక పెద్ద గదిని[a] సిద్ధం చేశాడు. గతంలో అక్కడ[b] ధాన్యార్పణను, సాంబ్రాణిని, పాత్రలను, ధాన్యం, కొత్త ద్రాక్షామద్యం, నూనెలలో పదో వంతును—అది లేవీయులకు, గాయకులకు, ద్వారపాలకులకు నియమించబడిన భాగం[c]—యాజకుల కోసం కేటాయించిన కానుకను[d] ఉంచేవారు.
  rationale: The revision preserves the source’s syntax and the deliberately contextual rendering of the difficult phrase מִצְוַת הַלְוִיִּם וגו׳, while improving modern Telugu precision for new wine, the collective tithe, and the priests’ contribution. Footnote anchors remain attached to the same relevant expressions.
