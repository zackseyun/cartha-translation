source:
  edition: WLC
  text: בַּ/יּ֣וֹם הַ/ה֗וּא נִקְרָ֛א בְּ/סֵ֥פֶר מֹשֶׁ֖ה בְּ/אָזְנֵ֣י הָ/עָ֑ם וְ/נִמְצָא֙ כָּת֣וּב בּ֔/וֹ אֲ֠שֶׁר לֹא יָב֨וֹא עַמֹּנִ֧י וּ/מֹאָבִ֛י בִּ/קְהַ֥ל הָ/אֱלֹהִ֖ים עַד עוֹלָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/001.yaml
  text: On that day the Book of Moses was read in the hearing of the people[c][b][a], and it was found written in it that no Ammonite or Moabite should ever enter the assembly of God.
translation:
  language: te
  text: ఆ రోజున ప్రజలు వింటుండగా మోషే గ్రంథం[a] చదవబడింది. అందులో అమ్మోనీయుడుగానీ మోయాబీయుడుగానీ దేవుని సభలో[b] ఎన్నటికీ[c] ప్రవేశించకూడదని వ్రాసి ఉన్నట్లు కనుగొనబడింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మోషే గ్రంథచుట్ట.” హెబ్రీ పదం గ్రంథాన్ని లేదా గ్రంథచుట్టను సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “దేవుని సమాజంలో.”
    reason: lexical_alternative
  - marker: c
    text: అంటే, “ఎల్లకాలం” లేదా “శాశ్వతంగా.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: ఆ రోజున
  rationale: నిర్దిష్టమైన సందర్భాన్ని సూచించే హెబ్రీ కాలవాచక పదబంధాన్ని సహజమైన ఆధునిక తెలుగులో నేరుగా వ్యక్తం చేస్తుంది.
- source_word: נִקְרָא בְּסֵפֶר מֹשֶׁה בְּאָזְנֵי הָעָם
  choice: ప్రజలు వింటుండగా మోషే గ్రంథం చదవబడింది
  rationale: నִקְרָאలోని కర్మణి రూపాన్ని నిలిపి, ‘ప్రజల చెవుల్లో’ అనే హెబ్రీ నుడికారాన్ని సహజంగా ‘ప్రజలు వింటుండగా’ అని అనువదించింది. మూలంలో లేని ‘బిగ్గరగా’ అనే భావాన్ని చేర్చలేదు.
- source_word: סֵפֶר מֹשֶׁה
  choice: మోషే గ్రంథం
  rationale: סֵפֶר అనేది గ్రంథాన్ని లేదా గ్రంథపు చుట్టను సూచించగలదు. ప్రధాన పాఠంలో సాధారణ పాఠకులకు సహజమైన ‘గ్రంథం’ను వాడి, వస్తురూప సంబంధమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచింది.
- source_word: וְנִמְצָא כָּתוּב בּוֹ
  choice: అందులో ... రాసి ఉన్నట్లు కనబడింది
  rationale: హెబ్రీలోని కర్మణి భావాన్ని నిలిపి, ‘అందులో’ అనే పదంతో మోషే గ్రంథానికున్న సూచనను స్పష్టంగా ఉంచుతుంది.
- source_word: עַמֹּנִי וּמֹאָבִי
  choice: అమ్మోనీయుడుగానీ మోయాబీయుడుగానీ
  rationale: నిషేధ వాక్యంలో రెండు వర్గాల్లో ఏ ఒక్కరికీ వర్తించే పంపిణీ భావాన్ని తెలుగు ‘గానీ ... గానీ’ నిర్మాణం సహజంగా తెలియజేస్తుంది.
- source_word: בִּקְהַל הָאֱלֹהִים
  choice: దేవుని సభలో
  rationale: קָהָל యొక్క కూడిన సమూహం/సభ అనే భావాన్ని కాపాడుతూ, తరువాతి కాలపు ప్రత్యేక మతసంస్థ పదజాలాన్ని దిగుమతి చేయదు.
- source_word: עַד עוֹלָם
  choice: ఎన్నటికీ
  rationale: ఈ న్యాయపరమైన నిషేధంలో ఉన్న నిరంతర, శాశ్వత బలాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: בִּקְהַל הָאֱלֹהִים పదబంధపు అర్థం
  choice: దేవుని సభలో
  alternative: దేవుని సమాజంలో
  rationale: దేవునికి చెందిన కూడిన నిబంధన సమాజం అనే మూల భావాన్ని ‘సభ’ నేరుగా నిలుపుతుంది; ‘సమాజం’ కూడా సాధ్యమైన అర్థమని పాదసూచిక తెలియజేస్తుంది.
- issue: עַד עוֹלָם అనే న్యాయపరమైన నిషేధ సూత్రపు బలం
  choice: ఎన్నటికీ ప్రవేశించకూడదు
  alternative: ఎల్లకాలం ప్రవేశించకూడదు
  rationale: మూలంలోని దీర్ఘకాలిక నిషేధాన్ని తగ్గించకుండా, దాని కాలవ్యాప్తికి మించి ప్రత్యేక సిద్ధాంతపరమైన నిర్ణయాన్ని చేర్చకుండా అనువదిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలిని ఉపయోగించింది. హెబ్రీ కర్మణి నిర్మాణాన్ని సాధ్యమైనంతవరకు నిలిపింది; అసహజమైన పదశః అనువాదాన్ని నివారించింది. అన్ని పాదసూచిక సూచికలు సంబంధిత ప్రధాన పాఠ పదాల వెంట ఉంచబడ్డాయి.
