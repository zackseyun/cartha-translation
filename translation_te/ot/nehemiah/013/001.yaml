- from: ఆ రోజున ప్రజలు వింటుండగా మోషే గ్రంథం[a] చదవబడింది. అందులో అమ్మోనీయుడుగానీ మోయాబీయుడుగానీ దేవుని సభలో[b] ఎన్నటికీ[c] ప్రవేశించకూడదని రాసి ఉన్నట్లు కనబడింది.
