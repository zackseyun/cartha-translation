  text: הֲ/ל֣וֹא עַל אֵ֣לֶּה חָטָֽא שְׁלֹמֹ֣ה מֶ֣לֶךְ יִשְׂרָאֵ֡ל וּ/בַ/גּוֹיִ֣ם הָ/רַבִּים֩ לֹֽא הָיָ֨ה מֶ֜לֶךְ כָּמֹ֗/הוּ וְ/אָה֤וּב לֵֽ/אלֹהָי/ו֙ הָיָ֔ה וַ/יִּתְּנֵ֣/הוּ אֱלֹהִ֔ים מֶ֖לֶךְ עַל כָּל יִשְׂרָאֵ֑ל גַּם אוֹת֣/וֹ הֶחֱטִ֔יאוּ הַ/נָּשִׁ֖ים הַ/נָּכְרִיּֽוֹת־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/026.yaml
  text: Was it not because of these things that Solomon king of Israel sinned? Yet among the many nations there was no king like him[a], and he was loved by his God, and God made him king over all Israel. Even him foreign women caused to sin.
translation:
  language: te
  text: ఇశ్రాయేలు రాజైన సొలొమోను ఈ విషయాల కారణంగానే పాపం చేశాడు కదా? ఎన్నో జనాంగాల్లో అతనివంటి రాజు ఎవరూ లేరు. అతడు తన దేవునికి ప్రియమైనవాడు; దేవుడు అతన్ని ఇశ్రాయేలంతటిమీద రాజుగా నియమించాడు. అయినా, అతనిని సైతం విదేశీ స్త్రీలు[a] పాపం చేయడానికి కారణమయ్యారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘విదేశీ భార్యలు.’ హీబ్రూలో అక్షరార్థంగా ‘విదేశీ స్త్రీలు’ అని ఉంది. సొలొమోను కథా సందర్భాన్ని బట్టి ‘భార్యలు’ అనడం సాధ్యమే గాని, ఈ వచనంలో ఆ పదం స్పష్టంగా లేదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלוֹא עַל אֵלֶּה
  choice: ఈ విషయాల కారణంగానే ... కదా?
  rationale: హీబ్రూలో సమ్మతిని ఆశించే అలంకారప్రశ్నను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; עַל యొక్క కారణార్థాన్ని ‘కారణంగా’ నిలుపుతుంది.
- source_word: חָטָא
  choice: పాపం చేశాడు
  rationale: నైతిక-మతపరమైన సందర్భంలో חטאకు సాధారణమైన, స్పష్టమైన తెలుగు సమానం.
- source_word: וּבַגּוֹיִם הָרַבִּים
  choice: ఎన్నో జనాంగాల్లో
  rationale: גּוֹיִם యొక్క బహుజనాంగ/దేశ భావాన్ని తెలియజేస్తూ, తరువాతి పోలికకు సహజమైన పరిధిని ఇస్తుంది.
- source_word: לֹא הָיָה מֶלֶךְ כָּמֹהוּ
  choice: అతనివంటి రాజు ఎవరూ లేరు
  rationale: హీబ్రూ అస్తిత్వ-పోలిక వాక్యాన్ని సహజమైన తెలుగులో నేరుగా అందిస్తుంది.
- source_word: וְאָהוּב לֵאלֹהָיו הָיָה
  choice: అతడు తన దేవునికి ప్రియమైనవాడుగా ఉన్నాడు
  rationale: אָהוּב యొక్క స్థితి/కర్మణి భావాన్నీ, ‘తన దేవుడు’ అనే సర్వనామ సంబంధాన్నీ నిలుపుతుంది.
- source_word: וַיִּתְּנֵהוּ אֱלֹהִים מֶלֶךְ
  choice: దేవుడు అతన్ని ... రాజుగా నియమించాడు
  rationale: נתן ఇక్కడ అధికార స్థానంలో ఉంచడం లేదా నియమించడం అనే భావంలో ఉంది; ‘నియమించాడు’ తెలుగులో స్పష్టంగా ఉంటుంది.
- source_word: עַל כָּל יִשְׂרָאֵל
  choice: ఇశ్రాయేలంతటిమీద
  rationale: పాలనా పరిధినీ כָּל యొక్క సమగ్రతనూ సంక్షిప్తంగా నిలుపుతుంది.
- source_word: גַּם אוֹתוֹ
  choice: అతనిని సైతం
  rationale: ముందుకు తెచ్చిన కర్మపై ఉన్న హీబ్రూ ఉద్ఘాటనను ‘సైతం’ ద్వారా కాపాడుతుంది.
- source_word: הֶחֱטִיאוּ הַנָּשִׁים הַנָּכְרִיּוֹת
  choice: అన్యదేశ స్త్రీలు పాపం చేయించారు
  rationale: חטא హిఫిల్ రూపంలోని కారణార్థాన్ని స్పష్టంగా తెలియజేస్తుంది; נָשִׁיםకు మూలపాఠంలో స్పష్టంగా ఉన్న ‘స్త్రీలు’ అనే అర్థాన్నే ప్రధాన పాఠంలో ఉంచుతుంది.
theological_decisions:
- issue: సొలొమోను పాపానికి అన్యదేశ స్త్రీల పాత్ర
  choice: వారు అతనిని పాపం చేయించారని మాత్రమే చెప్పడం
  alternative: వారు అతన్ని ప్రలోభపెట్టారు లేదా అతని నిబంధన విశ్వాసాన్ని రాజకీయంగా బలహీనపరిచారు అని వివరించడం
  rationale: హీబ్రూ కారణార్థక క్రియ వారి పాత్రను స్పష్టంగా చెబుతుంది; అయితే పాపానికి దారితీసిన విధానాన్ని ఈ వచనం వివరించదు కాబట్టి ఇతర సందర్భాల వివరాలను చేర్చలేదు.
- issue: אֱלֹהִים యొక్క అనువాదం
  choice: దేవుడు
  alternative: యెహోవా/ప్రభువు
  rationale: ఇక్కడ మూలపాఠంలో אֱלֹהִים ఉంది, దైవనామమైన יהוה లేదు; కాబట్టి ‘దేవుడు’ మూలానికి నిబద్ధమైనది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. అలంకారప్రశ్నకు ‘కదా?’ను ఉపయోగించి దాని సమ్మతి-ఆశించే బలాన్ని నిలిపాం. ‘అన్యదేశ స్త్రీలు’ మూలపాఠంలోని విస్తృత పదాన్ని కాపాడుతుంది; సందర్భాధారిత ‘భార్యలు’ను పాదటిప్పణిలో మాత్రమే ఇచ్చాం.
