id: NEH.13.31
reference: Nehemiah 13:31
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/לְ/קֻרְבַּ֧ן הָ/עֵצִ֛ים בְּ/עִתִּ֥ים מְזֻמָּנ֖וֹת וְ/לַ/בִּכּוּרִ֑ים זָכְרָ/ה לִּ֥/י אֱלֹהַ֖/י לְ/טוֹבָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/031.yaml
  text: And for the offering of wood at appointed times[a], and for the firstfruits—remember me, my God, for good.
translation:
  language: te
  text: నియమిత సమయాల్లో కట్టెల అర్పణ కోసం, ప్రథమఫలాల కోసం—నా దేవా, నాకు మేలు కలిగేలా నన్ను జ్ఞాపకం చేసుకో.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קֻרְבַּן הָעֵצִים
  choice: కట్టెల అర్పణ
  rationale: ఆలయ అవసరాల కోసం, ముఖ్యంగా బలిపీఠపు అగ్నికి, నిర్ణీత సమయాల్లో సమకూర్చే కట్టెలను సూచించే ఆరాధనాపరమైన పదబంధం. ‘కట్టెల అర్పణ’ మూలంలోని అర్పణ భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: בְּעִתִּים מְזֻמָּנוֹת
  choice: నియమిత సమయాల్లో
  rationale: ముందుగా నిర్ణయించబడిన లేదా కేటాయించబడిన సందర్భాలను స్పష్టంగా, సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: בִּכּוּרִים
  choice: ప్రథమఫలాలు
  rationale: దేవునికి సమర్పించే పంట మొదటి ఫలాలను సూచించే స్థిరమైన, గౌరవప్రదమైన తెలుగు పదం.
- source_word: זָכְרָה לִּי
  choice: నేను చేసినదాన్ని జ్ఞాపకం చేసుకో
  rationale: లీ అనే ప్రయోజనార్థక రూపాన్ని సందర్భానుసారంగా వెల్లడిస్తుంది. ముందు పేర్కొన్న ఏర్పాట్ల విషయంలో తన కార్యాన్ని దేవుడు అనుకూలంగా గుర్తించాలని నెహెమ్యా ప్రార్థిస్తున్నాడు.
- source_word: אֱלֹהַי
  choice: నా దేవా
  rationale: ప్రత్యక్ష సంబోధనను మరియు వ్యక్తిగత సంబంధాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: לְטוֹבָה
  choice: నాకు మేలు కలిగేలా
  rationale: అనుకూలమైన జ్ఞాపకం లేదా శుభఫలితం అనే భావాన్ని ఇస్తుంది; అది నైతిక ఆమోదమా, ఆశీర్వాదమా, ప్రయోజనమా అనే విషయాన్ని అతిగా నిర్దిష్టం చేయదు.
theological_decisions:
- issue: ఆరాధనాపరమైన పదబంధం קֻרְבַּן הָעֵצִים
  choice: కట్టెల అర్పణ
  alternative: కట్టెల సమర్పణ; ఆలయానికి కట్టెల సరఫరా
  rationale: ఇది సాధారణ కలప కానుక మాత్రమే కాక, ఆలయ వినియోగానికి నిర్ణీత కట్టెల ఏర్పాటును సూచిస్తుంది. ఎంపిక చేసిన రూపం ఆచార సంబంధమైన ‘అర్పణ’ భావాన్ని నిలుపుతుంది.
- issue: చివరి విన్నపం לְטוֹבָה
  choice: నాకు మేలు కలిగేలా నన్ను జ్ఞాపకం చేసుకో
  alternative: నన్ను అనుకూలంగా జ్ఞాపకం చేసుకో; నా మేలు కోసం నన్ను జ్ఞాపకం చేసుకో
  rationale: మూలంలోని సంక్షిప్తత వెనుక ఉన్న ఉద్దేశపూర్వక విస్తృతిని నిలుపుతుంది; ‘మేలు’ ఏ రూపంలో కలుగుతుందో అనవసరంగా నిర్ణయించదు.
- issue: మొదటి זָכְרָה לִּי యొక్క సంబంధం
  choice: నేను చేసినదాన్ని జ్ఞాపకం చేసుకో
  alternative: నా కోసం జ్ఞాపకం ఉంచు
  rationale: హీబ్రూ ప్రయోజనార్థక నిర్మాణం తెలుగులో పదశః అసహజంగా ఉంటుంది. సందర్భంలోని కట్టెల అర్పణ, ప్రథమఫలాల ఏర్పాట్లతో ప్రార్థనను అనుసంధానిస్తూ భావాన్ని స్పష్టం చేస్తుంది; చివర ఉన్న ప్రత్యక్ష వ్యక్తిగత విన్నపాన్ని వేరుగా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ప్రార్థనా ముగింపుకు తగిన గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. మూలంలోని రెండు జ్ఞాపక విన్నపాలను తెలుగులో స్పష్టంగా వేరు చేసి, చివరి ‘మేలు’ భావాన్ని అతిగా వ్యాఖ్యానించలేదు.
