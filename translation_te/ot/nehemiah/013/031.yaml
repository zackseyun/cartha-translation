revisions:
- from: నియమిత సమయాల్లో కట్టెల అర్పణ[a] కోసం, ప్రథమఫలాల కోసం నేను చేసినదాన్ని జ్ఞాపకం చేసుకో. నా దేవా, నాకు మేలు కలిగేలా నన్ను జ్ఞాపకం చేసుకో.
  to: నియమిత సమయాల్లో కట్టెల అర్పణ కోసం, ప్రథమఫలాల కోసం—నా దేవా, నాకు మేలు కలిగేలా నన్ను జ్ఞాపకం చేసుకో.
  rationale: The revision restores the Hebrew’s single syntactic unit and single final petition. It keeps the listed cultic items as the context of Nehemiah’s prayer, without adding a separate request to remember his deeds. The footnote preserves the lexical alternative and clarifies the temple-supply context.
  reviewer_model: gpt-5.6-terra
