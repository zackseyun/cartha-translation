  to: అప్పుడు నేను ఆజ్ఞ ఇచ్చాను[a]; వారు ఆ గదులను శుద్ధి చేశారు. దేవుని మందిరపు సామగ్రిని, ధాన్యార్పణను, లోబానమును తిరిగి అక్కడికి తీసుకొచ్చాను.
