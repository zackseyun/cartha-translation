source:
  edition: WLC
  text: וָ/אֹ֣מְרָ֔/ה וַֽ/יְטַהֲר֖וּ הַ/לְּשָׁכ֑וֹת וָ/אָשִׁ֣יבָ/ה שָּׁ֗ם כְּלֵי֙ בֵּ֣ית הָ/אֱלֹהִ֔ים אֶת הַ/מִּנְחָ֖ה וְ/הַ/לְּבוֹנָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/009.yaml
  text: Then I gave the order[a], and they cleansed the chambers; and I brought back there the vessels of the house of God[b], with the grain offering and the frankincense.
translation:
  language: te
  text: అప్పుడు నేను ఆజ్ఞ ఇచ్చాను[a]; వారు ఆ గదులను శుద్ధి చేశారు. దేవుని మందిరపు సామగ్రిని, ధాన్యార్పణను, లోబానమును తిరిగి అక్కడికి తీసుకొచ్చాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘అప్పుడు నేను చెప్పాను,’ లేదా ‘అప్పుడు నేను ఆదేశించాను.’ హీబ్రూ క్రియ అక్షరార్థంగా ‘నేను చెప్పాను’; అయితే సందర్భంలో అది అమలు చేయబడిన ఆజ్ఞను పరిచయం చేస్తోంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמְרָה
  choice: అప్పుడు నేను ఆజ్ఞ ఇచ్చాను
  rationale: మూల క్రియ అక్షరార్థంగా ‘నేను చెప్పాను’; అయితే వెంటనే ఆ ఆదేశం అమలైన సందర్భం వల్ల సహజమైన తెలుగులో ‘ఆజ్ఞ ఇచ్చాను’ అని అనువదించాం. కథన క్రమాన్ని וָ־ సూచిస్తున్నందున ‘అప్పుడు’ చేర్చాం.
- source_word: וַיְטַהֲרוּ
  choice: వారు శుద్ధి చేశారు
  rationale: טהר భౌతిక శుభ్రతతో పాటు ఆచారపరమైన అపవిత్రత తొలగింపునూ సూచించగలదు. ‘శుద్ధి చేశారు’ ఈ రెండు భావాలకు తగిన గౌరవప్రదమైన పదం.
- source_word: הַלְּשָׁכוֹת
  choice: ఆ గదులను
  rationale: לשכה దేవాలయ ప్రాంగణంలోని గది లేదా గదిని సూచిస్తుంది. సందర్భం నిల్వగదులను సూచించినా, మూల నామవాచకానికంటే ఎక్కువ నిర్దిష్టతను చేర్చకుండా ‘గదులు’ అని అనువదించాం.
- source_word: וָאָשִׁיבָה שָּׁם
  choice: తిరిగి అక్కడికి తీసుకొచ్చాను
  rationale: ఇక్కడ שוב హిఫిల్ భావం తొలగించబడిన వస్తువులను మళ్లీ తమ స్థానానికి తీసుకురావడాన్ని సూచిస్తుంది; שׁםను ‘అక్కడికి’గా స్పష్టంగా నిలిపాం.
- source_word: כְּלֵי בֵּית הָאֱלֹהִים
  choice: దేవుని మందిరపు సామగ్రిని
  rationale: כְּלִי అనేది పాత్రలు, ఉపకరణాలు, ఇతర వస్తువులను కలుపుకునే విస్తృత పదం. తెలుగులో ‘సామగ్రి’ ఆ విస్తృతిని సహజంగా నిలుపుతుంది; בֵּית הָאֱלֹהִים సందర్భానుసారం ‘దేవుని మందిరం’గా ఇవ్వబడింది.
- source_word: אֶת הַמִּנְחָה
  choice: ధాన్యార్పణను
  rationale: ఆరాధనా సందర్భంలో מִנְחָה ప్రత్యేకంగా ధాన్యంతో అర్పించే అర్పణను సూచిస్తుంది. అందువల్ల సాధారణ ‘అర్పణ’కన్నా ‘ధాన్యార్పణ’ ఖచ్చితమైనది.
- source_word: וְהַלְּבוֹנָה
  choice: సాంబ్రాణిని
  rationale: לְבוֹנָה సాధారణ ధూపాన్ని కాకుండా frankincenseను సూచిస్తుంది. ఆధునిక సాధారణ తెలుగులో దానికి పరిచితమైన సమానార్థకం ‘సాంబ్రాణి’.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని ఉపయోగించాం. దేవాలయ సందర్భానికి తగిన ‘శుద్ధి,’ ‘ధాన్యార్పణ,’ ‘సాంబ్రాణి’ వంటి పదాలను ఉంచి, సాధారణ పాఠకునికి అర్థమయ్యే వాక్యనిర్మాణాన్ని ఎంచుకున్నాం.
