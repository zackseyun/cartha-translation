source:
  edition: WLC
  text: זָכְרָ֥/ה לָ/הֶ֖ם אֱלֹהָ֑/י עַ֚ל גָּאֳלֵ֣י הַ/כְּהֻנָּ֔ה וּ/בְרִ֥ית הַ/כְּהֻנָּ֖ה וְ/הַ/לְוִיִּֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/029.yaml
  text: Remember them[a], my God, because they have defiled the priesthood and the covenant of the priesthood and the Levites.
translation:
  language: te
  text: నా దేవా, వారు యాజకత్వాన్నీ, యాజకత్వానికీ లేవీయులకూ సంబంధించిన నిబంధననూ అపవిత్రం చేసినందుకు వారిని గుర్తుంచుకో.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, మరింత అక్షరార్థంగా: “నా దేవా, యాజకత్వాన్నీ, యాజకత్వానికీ లేవీయులకూ సంబంధించిన నిబంధననూ అపవిత్రం చేసినవారి విషయమై వారిని గుర్తుంచుకో.”'
    reason: హీబ్రూలో ‘అపవిత్రం చేసినవారు’ అనే కర్తృవాచక రూపమూ, ‘విషయంలో/నిమిత్తం’ అనే సంబంధార్థక నిర్మాణమూ ఉన్నాయి; ప్రధాన పాఠం వాటిని సహజమైన కారణవాక్యంగా వ్యక్తపరుస్తుంది. ‘లేవీయులు’ నిబంధనతో అనుసంధానమై ఉండే సంక్షిప్త నిర్మాణాన్ని పాదటిప్పణి కూడా కాపాడుతుంది.
lexical_decisions:
- source_word: זָכְרָה
  choice: గుర్తుంచుకో
  rationale: దేవునికి నేరుగా చేసే విజ్ఞప్తిని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది. క్రియలోనే శిక్షార్థాన్ని చేర్చకుండా, సందర్భం ద్వారా ప్రతికూల జ్ఞాపకార్థం వెల్లడయ్యేలా ఉంచింది.
- source_word: לָהֶם
  choice: వారిని
  rationale: זכר క్రియతో వచ్చిన לָהֶםను సహజ తెలుగు కర్మరూపంలో ఇచ్చింది; ‘వారికి విరోధంగా’ అని అతివ్యాఖ్య చేయలేదు.
- source_word: אֱלֹהָי
  choice: నా దేవా
  rationale: ప్రథమ పురుష ఏకవచన స్వామ్యార్థాన్నీ, ప్రత్యక్ష సంబోధననూ స్పష్టంగా కాపాడుతుంది.
- source_word: עַל
  choice: చేసినందుకు
  rationale: వారిని గుర్తుంచుకోవాలనే విజ్ఞప్తికి వారి అపవిత్రీకరణ కారణమని తెలిపే సందర్భోచిత కారణార్థాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: גָּאֳלֵי
  choice: అపవిత్రం చేసినందుకు
  rationale: ఇది ‘విమోచించు’ అనే వేరే ధాతువు కాదు; ‘అపవిత్రపరచు, కలుషితం చేయు’ అనే అర్థంలోని కర్తృవాచక భాగధాతువు. తెలుగులో స్పష్టత కోసం క్రియాత్మక వాక్యంగా ఇచ్చింది.
- source_word: הַכְּהֻנָּה
  choice: యాజకత్వం
  rationale: వ్యక్తిగత యాజకులను కాకుండా యాజక పదవి లేదా వ్యవస్థను సూచించే భావనామాన్ని ప్రతిబింబిస్తుంది.
- source_word: וּבְרִית הַכְּהֻנָּה וְהַלְוִיִּם
  choice: యాజకత్వానికీ లేవీయులకూ సంబంధించిన నిబంధన
  rationale: నిబంధన యాజకత్వంతోనూ లేవీయులతోనూ సంబంధించిందనే సహజ వాక్యనిర్మాణాన్ని అనుసరిస్తూ, అది వారితో చేసిన నిబంధనా లేక వారికి సంబంధించినదా అనే అంశాన్ని అతిగా నిర్ధారించదు.
theological_decisions:
- issue: దేవుడు వారిని అనుకూలంగా లేదా ప్రతికూలంగా గుర్తుంచుకోవాలనే ప్రార్థనా?
  choice: అపవిత్రీకరణ కారణంగా న్యాయవిచారణార్థమైన ప్రతికూల జ్ఞాపకం
  alternative: తీర్పును స్పష్టంగా సూచించని తటస్థమైన ‘వారిని గుర్తుంచుకో’
  rationale: ‘గుర్తుంచుకో’ అనే క్రియ స్వయంగా అనుకూల లేదా ప్రతికూల అర్థాన్ని నిర్బంధించదు; అయితే తరువాతి అపవిత్రీకరణ ఆరోపణ ఇక్కడ న్యాయవిచారణ సందర్భాన్ని సూచిస్తుంది. ప్రధాన పాఠం కారణవాక్యంతో ఆ భావాన్ని తెలియజేస్తుంది, కానీ ‘వారికి విరోధంగా’ అని మూలంలోకంటే ఎక్కువగా చెప్పదు.
- issue: ‘యాజకత్వపు నిబంధన మరియు లేవీయులు’ అనే పదబంధం పరిధి
  choice: యాజకత్వానికీ లేవీయులకూ సంబంధించిన నిబంధన
  alternative: యాజకత్వపు నిబంధనను, అలాగే వేరుగా లేవీయులను; లేదా యాజకులు మరియు లేవీయులతో చేసిన నిబంధనను
  rationale: హీబ్రూ సంక్షిప్త సమన్వయ నిర్మాణం లేవీయులను నిబంధనతో అనుసంధానించే అవకాశం ఎక్కువగా ఇస్తుంది. ‘సంబంధించిన’ అనే పదం నిబంధన యొక్క ఖచ్చిత స్వరూపాన్ని నిర్ధారించకుండా ఆ అనుసంధానాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా ఉండే ప్రత్యక్ష ప్రార్థనా శైలిని ఉపయోగించింది. ‘యాజకత్వం’, ‘లేవీయులు’, ‘నిబంధన’ వంటి స్థిరమైన బైబిలు పదజాలాన్ని నిలిపి, పాతకాలపు క్రియారూపాలను నివారించింది.
