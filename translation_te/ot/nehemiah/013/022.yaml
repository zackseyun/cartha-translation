source:
  edition: WLC
  text: וָ/אֹמְרָ֣/ה לַ/לְוִיִּ֗ם אֲשֶׁ֨ר יִֽהְי֤וּ מִֽטַּהֲרִים֙ וּ/בָאִים֙ שֹׁמְרִ֣ים הַ/שְּׁעָרִ֔ים לְ/קַדֵּ֖שׁ אֶת י֣וֹם הַ/שַּׁבָּ֑ת גַּם זֹאת֙ זָכְרָ/ה לִּ֣/י אֱלֹהַ֔/י וְ/ח֥וּסָ/ה עָלַ֖/י כְּ/רֹ֥ב חַסְדֶּֽ/ךָ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/022.yaml
  text: And I told the Levites that they should purify themselves and come to guard the gates[a], to keep the Sabbath day holy. Remember this also in my favor, my God[b], and spare me according to the greatness of your steadfast love.
translation:
  language: te
  text: 'లేవీయులు తమను తాము శుద్ధి చేసుకొని వచ్చి, సబ్బాతు దినాన్ని పవిత్రంగా ఉంచడానికి ద్వారాలకు కాపలాగా ఉండాలని నేను వారికి చెప్పాను. నా దేవా, దీనిని కూడా నాకు అనుకూలంగా జ్ఞాపకం చేసుకో[a]; నీ అపారమైన అచంచల ప్రేమను బట్టి[b] నాపై కనికరం చూపు.


    [a] లేదా, “నా దేవా, దీని నిమిత్తం నన్ను కూడా జ్ఞాపకం చేసుకో.” హీబ్రూ నుడికారంలో ప్రయోజనార్థక భావం నెహెమ్యాకు గానీ, ఇప్పుడే ప్రస్తావించిన కార్యానికి గానీ సంబంధించినదిగా అర్థం చేసుకోవచ్చు.


    [b] “అచంచల ప్రేమ” అనేది హీబ్రూ పదమైన חֶסֶד (హెసెద్)ను అనువదిస్తుంది. ఇది తరచుగా దేవుని నమ్మకమైన నిబంధన ప్రేమను, కనికరాన్ని సూచిస్తుంది.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నా దేవా, దీని నిమిత్తం నన్ను కూడా జ్ఞాపకం చేసుకో.” హీబ్రూ నుడికారంలో ప్రయోజనార్థక భావం నెహెమ్యాకు గానీ, ఇప్పుడే ప్రస్తావించిన కార్యానికి గానీ సంబంధించినదిగా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “అచంచల ప్రేమ” అనేది హీబ్రూ పదమైన חֶסֶד (హెసెద్)ను అనువదిస్తుంది. ఇది తరచుగా దేవుని నమ్మకమైన నిబంధన ప్రేమను, కనికరాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמְרָה לַלְוִיִּם
  choice: నేను వారికి చెప్పాను
  rationale: אמר అనే క్రియను సహజమైన ఆధునిక తెలుగులో ‘చెప్పాను’ అని అనువదించడం పరిపాలనాపరమైన సూచన భావాన్ని నిలుపుతుంది; ‘ఆజ్ఞాపించాను’ అని బలాన్ని పెంచదు.
- source_word: אֲשֶׁר יִהְיוּ מִטַּהֲרִים
  choice: తమను తాము శుద్ధి చేసుకొని
  rationale: טהר హిత్పయేల్ రూపంలోని ఆత్మార్థక భావాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది; తరువాతి చర్యతో సహజంగా అనుసంధానిస్తుంది.
- source_word: וּבָאִים שֹׁמְרִים הַשְּׁעָרִים
  choice: వచ్చి ... ద్వారాలను కాపాడాలని
  rationale: క్రియల వరుసను సహజమైన తెలుగు వాక్యనిర్మాణంలో చూపుతూ, שׁמרలోని క్రియాశీల కాపలా బాధ్యతను నిలుపుతుంది.
- source_word: לְקַדֵּשׁ אֶת יוֹם הַשַּׁבָּת
  choice: విశ్రాంతి దినాన్ని పవిత్రంగా ఉంచడానికి
  rationale: קדשׁలోని పవిత్రంగా ప్రత్యేకపరచే భావాన్ని సాధారణ పాఠకులకు సహజంగా తెలియజేస్తుంది.
- source_word: זָכְרָה לִּי
  choice: నాకు అనుకూలంగా జ్ఞాపకం చేసుకో
  rationale: ప్రార్థనలోని ప్రయోజనార్థక לִי భావాన్ని తెలుగులో స్పష్టం చేస్తుంది; హీబ్రూ నుడికారంలోని మరొక సాధ్యమైన అన్వయాన్ని పాదసూచికలో నిలుపుతుంది.
- source_word: וְחוּסָה עָלַי
  choice: నాపై కనికరం చూపు
  rationale: חוסకు ఉన్న జాలి చూపు, విడిచిపెట్టు, కనికరించు అనే భావాలలో ప్రార్థనా సందర్భానికి సరిపోయే భావాన్ని సహజంగా అందిస్తుంది.
- source_word: כְּרֹב חַסְדֶּךָ
  choice: నీ అపారమైన అచంచల ప్రేమనుబట్టి
  rationale: רבలోని సమృద్ధిని ‘అపారమైన’ అని, חסדలోని నమ్మకమైన నిబంధన ప్రేమ మరియు కనికర భావాన్ని ‘అచంచల ప్రేమ’ అని వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ప్రార్థనలో חֶסֶד పదం అనువాదం
  choice: అచంచల ప్రేమ
  alternative: నిబంధన ప్రేమ; కృప; కనికరం
  rationale: ఈ పదం దేవుని ప్రేమలోని నమ్మకత్వం, నిబంధన నిబద్ధత, కనికరం అన్నింటినీ మోస్తుంది. ‘అచంచల ప్రేమ’ ఒకే సిద్ధాంత సంప్రదాయానికి పరిమితం చేయకుండా ఆ విస్తృతిని నిలుపుతుంది.
- issue: זָכְרָה לִּיలో ప్రయోజనార్థక భావం
  choice: దీనిని కూడా నాకు అనుకూలంగా జ్ఞాపకం చేసుకో
  alternative: దీని నిమిత్తం నన్ను కూడా జ్ఞాపకం చేసుకో
  rationale: హీబ్రూ నిర్మాణం జ్ఞాపకం చేయబడేది కార్యమా, వ్యక్తియా అనే విషయంలో కొంత అనిశ్చితిని అనుమతిస్తుంది. ప్రధాన పాఠం కార్యాన్ని ముందుకు తెస్తుంది; ప్రత్యామ్నాయం పాదసూచికలో ఇవ్వబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన క్రియావిన్యాసం, అయితే ప్రార్థనా భాగంలో గౌరవప్రదమైన ఏకవచన సంబోధన మరియు ధార్మిక గంభీరత నిలుపబడ్డాయి. మూలంలోని క్రియాక్రమం, ప్రయోజనార్థక అస్పష్టత, חסד యొక్క విస్తృత భావపరిధి సంరక్షించబడ్డాయి.
