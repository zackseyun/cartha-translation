  yaml_path: translation/ot/nehemiah/013/003.yaml
  text: And when they heard the law[a], they separated from Israel all the mixed multitude.
translation:
  language: te
  text: వారు ధర్మశాస్త్రాన్ని విన్నప్పుడు, కలగలిసిన సమూహమంతటినీ[a] ఇశ్రాయేలు నుండి వేరు చేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “మిశ్రమ వంశానికి చెందిన వారందరినీ,” లేదా “మిశ్రమ జనసమూహమంతటినీ.” హీబ్రూ పదం עֵרֶב కలగలిసిన ఒక సమూహాన్ని సూచించే సమష్టివాచక పదం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּשָׁמְעָם
  choice: వారు ... విన్నప్పుడు
  rationale: היהతో కూడిన కథన సంధిని తెలుగులో ప్రత్యేకంగా అనువదిస్తే వాక్యం కృతకంగా ఉంటుంది; כְּ + క్రియానామ రూపం సూచించే కాలసంబంధాన్ని ‘విన్నప్పుడు’ సహజంగా వ్యక్తపరుస్తుంది.
- source_word: הַתּוֹרָה
  choice: ధర్మశాస్త్రాన్ని
  rationale: ఈ ప్రవాసానంతర ఒడంబడిక సందర్భంలో ఇది బహిరంగంగా చదివిన అధికారిక మోషే ధర్మశాస్త్రాన్ని సూచిస్తుంది; ఆధునిక తెలుగు బైబిలు వాడుకలో ‘ధర్మశాస్త్రం’ స్పష్టమైన, గౌరవప్రదమైన పదం.
- source_word: וַיַּבְדִּילוּ
  choice: వేరు చేశారు
  rationale: בדל యొక్క ప్రాథమిక భావమైన విభజించడం లేదా వేరుచేయడాన్ని నిలుపుతుంది; ‘బహిష్కరించారు’ వంటి మరింత వ్యాఖ్యానాత్మక పదాన్ని నివారిస్తుంది.
- source_word: כָל־עֵרֶב
  choice: కలగలిసిన సమూహమంతటినీ
  rationale: עֵרֶב ఒక మిశ్రమ సమూహాన్ని సూచించే సమష్టివాచక పదం. ఈ అనువాదం దాని సమష్టి భావాన్ని నిలుపుతూ, అది తప్పనిసరిగా వంశమిశ్రణనే సూచిస్తుందని ప్రధాన పాఠ్యంలో నిర్ణయించదు.
- source_word: מִיִּשְׂרָאֵל
  choice: ఇశ్రాయేలు నుండి
  rationale: מן వేరుచేయబడిన మూలం లేదా సమాజాన్ని సూచిస్తుంది. యִשְׂרָאֵל అనే పేరును ‘ఇశ్రాయేలీయులు’ లేదా ‘ఇశ్రాయేలు సమాజం’ అని విపులీకరించకుండా యథాతథంగా నిలుపుతుంది.
theological_decisions:
- issue: ప్రవాసానంతర సమాజ-శుద్ధి సందర్భంలో ‘ఇశ్రాయేలు’ అనే పదం ఎవరిని సూచిస్తుంది
  choice: ‘ఇశ్రాయేలు’ అనే ఒడంబడిక-సమాజ నామాన్ని అలాగే ఉంచడం
  alternative: ‘ఇశ్రాయేలీయుల నుండి’ లేదా ‘ఇశ్రాయేలు సమాజం నుండి’
  rationale: హీబ్రూ పాఠ్యం యִשְׂרָאֵל అనే స్వనామాన్నే ఉపయోగిస్తుంది. దానిని అలాగే ఉంచడం సామూహిక, ఒడంబడిక సంబంధిత గుర్తింపును కాపాడుతుంది; తరువాతి సిద్ధాంతపరమైన నిర్ధారణలను పాఠ్యంలోకి చేర్చదు.
- issue: עֵרֶב యొక్క స్వరూపం
  choice: ప్రధాన పాఠ్యంలో ‘కలగలిసిన సమూహం’ అని అనువదించి భావంలోని విస్తృతిని నిలుపడం
  alternative: ‘మిశ్ర వంశస్థులందరూ’
  rationale: ఈ సమష్టివాచక పదం మిశ్రమ సమూహాన్ని సూచించగలదు; సందర్భంలో విదేశీయ మూలం లేదా మిశ్ర వంశం భావం ఉండవచ్చు. అయితే పదమే వంశపరమైన నిర్వచనాన్ని పూర్తిగా నిర్బంధించదు కాబట్టి ఆ ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచడం సముచితం.
translation_notes:
  register: సహజమైన ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైన బైబిలు శైలిని అనుసరించాం. హీబ్రూ కథన సంధిని తెలుగులో భారంగా పునరుత్పత్తి చేయకుండా కాలవాక్యంగా మలిచాం. ‘ధర్మశాస్త్రం,’ ‘ఇశ్రాయేలు’ వంటి సాధారణంగా అర్థమయ్యే సంప్రదాయ పదాలను నిలిపి, עֵרֶב లోని నిజమైన భావవిస్తృతిని పాదటిప్పణిలో చూపించాం.
