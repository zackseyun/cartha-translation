base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/007.yaml
  text: When I came to Jerusalem[b][a], I understood the evil that Eliashib had done for Tobiah by making a chamber for him in the courts of the house of God.
translation:
  language: te
  text: నేను యెరూషలేముకు వచ్చినప్పుడు, దేవుని మందిరపు ప్రాంగణాల్లో తోబీయా కోసం ఒక గది[a] ఏర్పాటు చేయడం ద్వారా ఎల్యాషీబు చేసిన చెడును నేను గ్రహించాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘కోష్టం’; ఈ హీబ్రూ పదం దేవాలయ సముదాయంలోని గది లేదా కోష్టాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאָבוֹא לִירוּשָׁלִָם
  choice: నేను యెరూషలేముకు వచ్చినప్పుడు
  rationale: వావ్‌తో కూడిన కథన క్రియను సందర్భానుసారమైన కాలవాచక ఉపవాక్యంగా సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וָאָבִינָה
  choice: నేను గ్రహించాను
  rationale: בין అనే ధాతువులోని అర్థం చేసుకోవడం లేదా తెలుసుకోవడం అనే జ్ఞాన సంబంధ భావాన్ని కాపాడుతుంది.
- source_word: בָרָעָה
  choice: చెడును
  rationale: ఈ చర్యపై నెహెమ్యా చేసిన నైతిక నిర్ధారణలోని బలాన్ని మెత్తబరచకుండా తెలుపుతుంది.
- source_word: לְטוֹבִיָּה
  choice: తోబీయా కోసం
  rationale: లామెద్ సూచించే ప్రయోజనం లేదా అనుకూలత భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: לַעֲשׂוֹת לוֹ נִשְׁכָּה
  choice: అతని కోసం ఒక గది ఏర్పాటు చేయడం ద్వారా
  rationale: ఆ చెడు కార్యం ఏమిటో తెలిపే క్రియార్థక నిర్మాణాన్ని స్పష్టంగా అందిస్తుంది; נִשְׁכָּהను అతిగా నిర్దిష్టం చేయకుండా ‘గది’గా అనువదిస్తుంది.
- source_word: בְּחַצְרֵי בֵּית הָאֱלֹהִים
  choice: దేవుని మందిరం ప్రాంగణాల్లో
  rationale: ‘దేవుని ఇల్లు’ అనే హీబ్రూ పదబంధం ఇక్కడ దేవాలయాన్ని సూచిస్తుంది; חצר యొక్క బహువచనాన్ని ‘ప్రాంగణాల్లో’గా కాపాడుతుంది.
theological_decisions:
- issue: ఎల్యాషీబు చర్యకు ఇచ్చిన నైతిక లక్షణం
  choice: רָעָהను ‘చెడు’గా అనువదించడం
  alternative: ‘తప్పు’ లేదా ‘హాని’
  rationale: మూలపాఠం ఈ చర్యను కేవలం అనుచితమైనదిగా కాక నైతికంగా చెడ్డదిగా నిర్ధారిస్తుంది; అదనపు సిద్ధాంత వివరణ లేకుండా ఆ బలాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘మందిరం’ సాధారణ పాఠకునికి సందర్భాన్ని స్పష్టం చేస్తుంది; పాదసూచికలు పదార్థ పరిధిని తెలియజేస్తాయి.
