revisions:
- from: విశ్రాంతిదినం ప్రారంభమయ్యే ముందు యెరూషలేము ద్వారాల దగ్గర చీకటి పడుతుండగా[a], తలుపులు మూయాలని నేను ఆదేశించాను; విశ్రాంతిదినం ముగిసే వరకు వాటిని తెరవకూడదని కూడా ఆజ్ఞాపించాను. విశ్రాంతిదినాన ఏ బరువూ[c] లోపలికి తీసుకురాకుండా ఉండేందుకు నా సేవకుల్లో కొందరిని[b] ద్వారాల దగ్గర కాపలా ఉంచాను.
  to: సబ్బాతు దినానికి ముందు యెరూషలేము ద్వారాలపై చీకటి కమ్ముకొనసాగినప్పుడు[a], తలుపులు మూయాలని నేను ఆదేశించాను; సబ్బాతు దినం ముగిసిన తరువాత వరకు వాటిని తెరవకూడదని ఆజ్ఞాపించాను. సబ్బాతు దినాన ఏ మోపూ[c] లోపలికి రాకుండా ఉండేందుకు నా సేవకుల్లో కొందరిని[b] ద్వారాల వద్ద కాపలా ఉంచాను.
  rationale: The revision restores the gates as the object affected by the approaching darkness, avoids placing an unstated “beginning” of the Sabbath in the main text, uses the established specific designation “సబ్బాతు దినం,” and renders מַשָּׂא concretely as “మోపు.” It retains the draft’s appropriate administrative force for Nehemiah’s repeated speech verbs and preserves all footnote anchors.
