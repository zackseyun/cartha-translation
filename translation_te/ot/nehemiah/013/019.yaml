  text: וַ/יְהִ֡י כַּ/אֲשֶׁ֣ר צָֽלֲלוּ֩ שַׁעֲרֵ֨י יְרוּשָׁלִַ֜ם לִ/פְנֵ֣י הַ/שַּׁבָּ֗ת וָ/אֹֽמְרָ/ה֙ וַ/יִּסָּגְר֣וּ הַ/דְּלָת֔וֹת וָ/אֹ֣מְרָ֔/ה אֲשֶׁר֙ לֹ֣א יִפְתָּח֔וּ/ם עַ֖ד אַחַ֣ר הַ/שַּׁבָּ֑ת וּ/מִ/נְּעָרַ֗/י הֶֽעֱמַ֨דְתִּי֙ עַל הַ/שְּׁעָרִ֔ים לֹא יָב֥וֹא מַשָּׂ֖א בְּ/י֥וֹם הַ/שַּׁבָּֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/019.yaml
  text: When the gates of Jerusalem began to grow dark[a] before the Sabbath, I ordered the doors shut and commanded that they not be opened until after the Sabbath. I stationed some of my servants[b] at the gates so that no load[c] would be brought in on the Sabbath day.
translation:
  language: te
  text: సబ్బాతు దినానికి ముందు యెరూషలేము ద్వారాలపై చీకటి కమ్ముకొనసాగినప్పుడు[a], తలుపులు మూయాలని నేను ఆదేశించాను; సబ్బాతు దినం ముగిసిన తరువాత వరకు వాటిని తెరవకూడదని ఆజ్ఞాపించాను. సబ్బాతు దినాన ఏ మోపూ[c] లోపలికి రాకుండా ఉండేందుకు నా సేవకుల్లో కొందరిని[b] ద్వారాల వద్ద కాపలా ఉంచాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘యెరూషలేము ద్వారాలపై సాయంకాలపు నీడలు పడసాగినప్పుడు.’
    reason: צָלֲלוּ అనే క్రియ చీకటి కమ్ముకోవడం లేదా నీడలు పడడం అనే సమీప భావాలను సూచించవచ్చు.
  - marker: b
    text: లేదా, ‘నా పరివారంలోని కొందరిని.’ ఇక్కడి పదం నెహెమ్యా వ్యక్తిగత సేవలో ఉన్నవారిని, సహాయకులను, లేదా యువకులను సూచించవచ్చు.
    reason: נְעָרַי పదానికి సేవకులు, సహాయకులు, యువకులు అనే భావపరిధి ఉంది.
  - marker: c
    text: చుట్టుపక్కల వచనాలు సబ్బాతు దినపు వ్యాపారం గురించి చెబుతున్నందున, ఈ ‘మోపు’లో అమ్మకానికి తీసుకొచ్చే సరుకులు కూడా ఉండవచ్చు.
    reason: మూలంలోని concrete noun‌ను నిలుపుతూ దాని సందర్భోచిత వాణిజ్య భావాన్ని వివరిస్తుంది.
lexical_decisions:
- source_word: צָלֲלוּ
  choice: చీకటి పడుతుండగా
  rationale: ఈ క్రియ సాయంకాలపు చీకటి లేదా నీడలు కమ్ముకోవడాన్ని సూచిస్తుంది. తెలుగు సహజ వాడుకలో ‘చీకటి పడుతుండగా’ కాలసూచనను స్పష్టంగా తెలియజేస్తూ, మూలంలోని చిత్రణను పూర్తిగా తొలగించదు.
- source_word: שַׁעֲרֵי יְרוּשָׁלִַם
  choice: యెరూషలేము ద్వారాల దగ్గర
  rationale: ‘యెరూషలేము ద్వారాలు’ అనే నిర్మాణాన్ని నిలుపుతూ, చీకటి వాటి పరిసరాల్లో పడుతున్న భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: לִפְנֵי הַשַּׁבָּת
  choice: విశ్రాంతిదినం ప్రారంభమయ్యే ముందు
  rationale: మూలంలో అక్షరార్థంగా ‘విశ్రాంతిదినానికి ముందు.’ ఆ దినం సూర్యాస్తమయంతో మొదలవుతుందనే సందర్భార్థాన్ని ఆధునిక పాఠకునికి స్పష్టం చేస్తుంది.
- source_word: וָאֹמְרָה
  choice: నేను ఆదేశించాను / ఆజ్ఞాపించాను
  rationale: అక్షరార్థం ‘నేను చెప్పాను’; అయితే అధికారిక నిర్దేశం ఉన్న సందర్భంలో ఆ మాటల ఆజ్ఞాత్మక బలాన్ని తెలుగులో నేరుగా వ్యక్తం చేస్తుంది. పునరుక్త క్రియను రెండు సమానార్థక పరిపాలనా పదాలతో సహజంగా అందించింది.
- source_word: וַיִּסָּגְרוּ הַדְּלָתוֹת
  choice: తలుపులు మూయాలని
  rationale: ఆదేశానికి అనుసంధానమైన కార్యాన్ని సహజ తెలుగు పూరక వాక్యంగా తెలుపుతుంది; మూలంలో లేని కర్తను చేర్చదు.
- source_word: אֲשֶׁר לֹא יִפְתָּחוּם
  choice: వాటిని తెరవకూడదని
  rationale: తలుపులనే తిరిగి సూచిస్తూ నిషేధాజ్ఞను స్పష్టంగా, సహజంగా అందిస్తుంది.
- source_word: עַד אַחַר הַשַּׁבָּת
  choice: విశ్రాంతిదినం ముగిసే వరకు
  rationale: అక్షరార్థమైన ‘విశ్రాంతిదినం తరువాతి వరకు’ అనే భావాన్ని తెలుగులో కాలపరంగా స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: וּמִנְּעָרַי
  choice: నా సేవకుల్లో కొందరిని
  rationale: נַעַר పదం యువకులను, సేవకులను లేదా వ్యక్తిగత పరివార సభ్యులను సూచించగలదు. నెహెమ్యా పరిపాలనా సందర్భంలో ‘సేవకులు’ సహజమైనది; ‘కొందరు’ అనే భాగార్థాన్ని מִן తెలియజేస్తుంది.
- source_word: הֶעֱמַדְתִּי
  choice: కాపలా ఉంచాను
  rationale: అక్షరార్థంగా ‘నిలబెట్టాను’; ద్వారాల వద్ద ప్రవేశాన్ని అడ్డుకునే నియామకం కాబట్టి సందర్భానుగుణ కార్యాన్ని స్పష్టపరుస్తుంది.
- source_word: עַל הַשְּׁעָרִים
  choice: ద్వారాల దగ్గర
  rationale: వ్యక్తులను నగర ద్వారాల వద్ద నియమించిన సందర్భంలో עַל యొక్క సహజ తెలుగు స్థలార్థం.
- source_word: לֹא יָבֹא מַשָּׂא
  choice: ఏ బరువూ లోపలికి తీసుకురాకుండా
  rationale: מַשָּׂא అనే స్పష్టమైన ‘బరువు/మోపు’ పదాన్ని నిలుపుతూ, నగర ద్వారాల గుండా దానిని తీసుకురావడమే ఉద్దేశమని సందర్భం ప్రకారం తెలుపుతుంది.
- source_word: בְּיוֹם הַשַּׁבָּת
  choice: విశ్రాంతిదినాన
  rationale: ‘విశ్రాంతిదినపు రోజున’ అనే మూల భావాన్ని పునరుక్తి లేని సహజ తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: שַׁבָּת పదానికి అనువాదం
  choice: విశ్రాంతిదినం
  alternative: సబ్బాతు దినం
  rationale: ఇది సాధారణ విశ్రాంతి సమయం కాక, ఇశ్రాయేలు ఆచరించే ప్రత్యేక వారపు దినాన్ని సూచిస్తుంది. ‘విశ్రాంతిదినం’ ఆ భావాన్ని తెలుగు పాఠకునికి అర్థవంతంగా అందిస్తుంది; సందర్భంలో దాని నిర్దిష్టత స్పష్టంగా ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా చదవగల వాక్యనిర్మాణం వాడబడింది. పరిపాలనా సందర్భానికి ‘ఆదేశించాను,’ ‘ఆజ్ఞాపించాను,’ ‘కాపలా ఉంచాను’ సహజంగా సరిపోతాయి. మూలంలోని సాయంకాలపు చీకటి/నీడల అస్పష్టతను [a]లో, נַעַר పదపు భావపరిధిని [b]లో, מַשָּׂא యొక్క వాణిజ్య సందర్భాన్ని [c]లో భద్రపరిచాం.
