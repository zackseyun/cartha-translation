translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని వాడాం. వంశావళి సంబంధాలు స్పష్టంగా ఉండేలా పదక్రమాన్ని సర్దాం; మూలంలోని వివాహ సంబంధ పదం మరియు బలవంతపు తొలగింపు క్రియలోని అర్థ పరిధిని పాదటిప్పణుల్లో నిలిపాం.
