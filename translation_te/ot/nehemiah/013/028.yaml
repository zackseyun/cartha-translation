  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/מִ/בְּנֵ֨י יוֹיָדָ֤ע בֶּן אֶלְיָשִׁיב֙ הַ/כֹּהֵ֣ן הַ/גָּד֔וֹל חָתָ֖ן לְ/סַנְבַלַּ֣ט הַ/חֹרֹנִ֑י וָ/אַבְרִיחֵ֖/הוּ מֵ/עָלָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/028.yaml
  text: And one of the sons of Joiada son of Eliashib the high priest was a son-in-law of Sanballat the Horonite[b][a], so I drove him away from me.
translation:
  language: te
  text: ప్రధాన యాజకుడైన ఎల్యాషీబు కుమారుడైన యోయాదా కుమారులలో ఒకడు హోరోనీయుడైన సన్బల్లటుకు అల్లుడు[a]. అందుచేత నేను అతణ్ణి నా దగ్గరనుంచి తరిమివేశాను[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా విస్తృతంగా, ‘సన్బల్లటుతో వివాహ సంబంధం కలిగినవాడు.’ హీబ్రూ పదం వివాహం ద్వారా ఏర్పడిన బంధుత్వాన్ని సూచించగలదు; అయితే ఈ సందర్భంలో ‘అల్లుడు’ అనేది అత్యంత సహజమైన నిర్దిష్ట అర్థం.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘అతణ్ణి తరిమికొట్టాను,’ ‘అతణ్ణి వెళ్లగొట్టాను.’ హీబ్రూ క్రియ బలవంతంగా తొలగించడాన్ని నొక్కి చెబుతుంది; అది ఏ విధమైన అధికారిక చర్యో వాక్యం నిర్దిష్టంగా చెప్పదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִבְּנֵי
  choice: కుమారుల్లో ఒకడు
  rationale: ఇక్కడ מִן భాగార్థాన్ని సూచిస్తుంది; అందువల్ల సహజమైన ఆధునిక తెలుగులో ‘కుమారుల్లో ఒకడు’ అని అనువదించాం.
- source_word: יוֹיָדָע
  choice: యోయాదా
  rationale: హీబ్రూ వ్యక్తినామానికి దగ్గరగా ఉండే తెలుగు లిప్యంతరీకరణ.
- source_word: בֶּן אֶלְיָשִׁיב
  choice: ఎల్యాషీబు కుమారుడు
  rationale: వంశ సంబంధాన్ని స్పష్టంగా నిలుపుకునే ప్రత్యక్ష అనువాదం.
- source_word: הַכֹּהֵן הַגָּדוֹל
  choice: ప్రధాన యాజకుడు
  rationale: ఇశ్రాయేలు ప్రధాన యాజక పదవిని సహజంగా, స్థిరంగా సూచించే తెలుగు రూపం.
- source_word: חָתָן לְסַנְבַלַּט
  choice: సన్బల్లటుకు అల్లుడు
  rationale: חתן వివాహ సంబంధాన్ని సూచిస్తుంది; ఈ సందర్భంలో ‘అల్లుడు’ అత్యంత సహజమైన నిర్దిష్ట అర్థం. విస్తృత అర్థాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: הַחֹרֹנִי
  choice: హోరోనీయుడు
  rationale: ప్రదేశం లేదా వంశానికి సంబంధించిన గుర్తింపును తెలుగు జాతీయనామ రూపంలో నిలిపాం.
- source_word: וָאַבְרִיחֵהוּ
  choice: అతణ్ణి తరిమివేశాను
  rationale: ברח యొక్క హిఫిల్ రూపం అతడు పారిపోయేలా బలవంతంగా పంపడాన్ని సూచిస్తుంది; ‘తరిమివేశాను’ ఆ బలాన్ని నిలుపుతుంది, అయితే నిర్దిష్ట చట్టపరమైన బహిష్కరణను అనవసరంగా సూచించదు.
- source_word: מֵעָלָי
  choice: నా దగ్గరనుంచి
  rationale: అక్షరార్థంగా ‘నా మీదనుంచి’; సందర్భంలో నెహెమ్యా సమక్షం లేదా పరిధి నుంచి తొలగించడాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
