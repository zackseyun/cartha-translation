    rationale: This Telugu phrase can mean actions performed faithfully or with religious faith, whereas חֶסֶד here more specifically concerns Nehemiah’s loyal-kind deeds/services. “నమ్మకమైన సేవలు” conveys loyal service naturally, while the footnote records the lexical breadth.
