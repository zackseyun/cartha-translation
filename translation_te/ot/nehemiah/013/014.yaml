source:
  edition: WLC
  text: זָכְרָ/ה לִּ֥/י אֱלֹהַ֖/י עַל זֹ֑את וְ/אַל תֶּ֣מַח חֲסָדַ֗/י אֲשֶׁ֥ר עָשִׂ֛יתִי בְּ/בֵ֥ית אֱלֹהַ֖/י וּ/בְ/מִשְׁמָרָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/014.yaml
  text: Remember me for this[a], my God[b], and do not wipe out my deeds of covenant faithfulness that I have done for the house of my God and for its services.
translation:
  language: te
  text: నా దేవా, ఇందునుబట్టి నన్ను జ్ఞాపకం చేసుకో. నా దేవుని మందిరం కోసం, దాని సేవా బాధ్యతల కోసం నేను చేసిన నా నమ్మకమైన సేవలను[a] తుడిచివేయకు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నా నిబద్ధ కార్యాలను,’ ‘నా దయాకార్యాలను.’ ఇక్కడి హీబ్రూ పదం దయ, నిబద్ధత, లేదా ఒడంబడికకు విశ్వసనీయత అనే భావాలను ఇవ్వగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: זָכְרָה לִּי
  choice: నన్ను జ్ఞాపకం చేసుకో
  rationale: దేవునికి చేసిన ప్రత్యక్ష ప్రార్థనలో, לִי వ్యక్తిని సూచిస్తోంది. ఆధునిక తెలుగులో సహజంగా ఉండే విధంగా ‘నన్ను జ్ఞాపకం చేసుకో’ అని అనువదించాం.
- source_word: אֱלֹהַי
  choice: నా దేవా
  rationale: మొదటి పురుష ఏకవచన ప్రత్యయం వ్యక్తిగత సంబోధనను తెలియజేస్తుంది; ప్రత్యక్ష ప్రార్థనకు తగిన తెలుగు సంబోధనారూపాన్ని వాడాం.
- source_word: עַל זֹאת
  choice: ఇందునుబట్టి
  rationale: ఇది ముందుగా వివరించిన విషయాన్ని సూచిస్తుంది. కారణార్థకమైన, అలాగే పూర్వసందర్భాన్ని సూచించే భావాన్ని ‘ఇందునుబట్టి’ సహజంగా అందిస్తుంది.
- source_word: וְאַל תֶּמַח
  choice: తుడిచివేయకు
  rationale: מחה అనే పదంలోని తుడిచివేయడం లేదా నమోదు నుండి చెరిపివేయడం అనే రూపకాన్ని నిలుపుతుంది.
- source_word: חֲסָדַי
  choice: నేను చేసిన విశ్వాసపూర్వక కార్యాలను
  rationale: חסד దయ, నిబద్ధత, ఒడంబడిక విశ్వసనీయత వంటి భావాలను కలిగి ఉంటుంది. ఇక్కడ సంబంధ వాక్యం నెహెమ్యా చేసిన కార్యాలను సూచిస్తున్నందున, అర్థాన్ని సిద్ధాంతపరంగా అతిగా నిర్దిష్టం చేయకుండా ‘విశ్వాసపూర్వక కార్యాలు’ అని ఇచ్చాం.
- source_word: אֲשֶׁר עָשִׂיתִי
  choice: నేను చేసిన
  rationale: חֲסָדַיని విశదీకరించే సంబంధ వాక్యాన్ని తెలుగులో సంక్షిప్తంగా, సహజంగా అందిస్తుంది.
- source_word: בְּבֵית אֱלֹהַי
  choice: నా దేవుని మందిరం కోసం
  rationale: בְ యొక్క ప్రాథమిక స్థానార్థాన్ని గౌరవిస్తూ, ఈ సందర్భంలో దేవుని మందిరం పక్షంగా లేదా దాని సంబంధంగా చేసిన సేవను సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: וּבְמִשְׁמָרָיו
  choice: దాని సేవా బాధ్యతల కోసం
  rationale: מִשְׁמָר మందిరానికి సంబంధించిన కాపుదల, విధి, అప్పగింత లేదా సేవా బాధ్యతను సూచించగలదు. సందర్భానికి అనుగుణంగా విస్తృత భావాన్ని నిలుపుకున్నాం.
theological_decisions:
- issue: మొదటి పురుష ప్రార్థనలో חֲסָדַי అనువాదం
  choice: నేను చేసిన విశ్వాసపూర్వక కార్యాలను
  alternative: నా మంచి పనులను; నా దయాకార్యాలను; నా నిబద్ధ కార్యాలను
  rationale: నెహెమ్యా దేవుని మందిర సంస్కరణకు సంబంధించి తాను నిబద్ధతతో చేసిన కార్యాలను దేవుడు జ్ఞాపకం చేసుకోవాలని కోరుతున్నాడు. ‘విశ్వాసపూర్వక కార్యాలు’ అనే రూపం חסדలోని నిబద్ధత భావాన్ని నిలుపుతూ, కార్యాల ద్వారా నీతిని సంపాదించాడనే సిద్ధాంతాన్ని అనువాదంలో చేర్చదు.
- issue: ప్రార్థనలో స్వకార్యాలను దేవుడు జ్ఞాపకం చేసుకోవాలనే విజ్ఞప్తి
  choice: ప్రత్యక్ష విజ్ఞప్తిని యథాతథంగా నిలుపడం
  alternative: స్వకార్య ప్రస్తావనను తగ్గించే వివరణాత్మక అనువాదం
  rationale: హీబ్రూ పాఠం నెహెమ్యా తన కార్యాలను తుడిచివేయవద్దని దేవునికి నేరుగా విజ్ఞప్తి చేస్తున్నట్లు స్పష్టంగా చెబుతుంది. దానివల్ల కలిగే వేదాంతపరమైన ఉద్వేగాన్ని సున్నితపరచకుండా నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సహజమైన ప్రార్థనా శైలిని ఉపయోగించాం. ‘నా దేవా’ అనే సంబోధన వ్యక్తిగత విజ్ఞప్తిని నిలుపుతుంది; అరుదైన మతపరమైన పారిభాషిక పదాల బదులు సాధారణ పాఠకులకు అర్థమయ్యే పదాలను ఎంచుకున్నాం.
