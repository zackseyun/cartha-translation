id: NEH.13.27
reference: Nehemiah 13:27
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/לָ/כֶ֣ם הֲ/נִשְׁמַ֗ע לַ/עֲשֹׂת֙ אֵ֣ת כָּל הָ/רָעָ֤ה הַ/גְּדוֹלָה֙ הַ/זֹּ֔את לִ/מְעֹ֖ל בֵּֽ/אלֹהֵ֑י/נוּ לְ/הֹשִׁ֖יב נָשִׁ֥ים נָכְרִיּֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/027.yaml
  text: Should we then listen to you and do all this great evil[b][a], acting unfaithfully against our God by marrying foreign women?
translation:
  language: te
  text: అయితే, మీ మాట విని[a], పరదేశ స్త్రీలను పెళ్లి చేసుకొని[b], మన దేవునికి నమ్మకద్రోహం చేస్తూ ఇంతటి ఘోరమైన చెడంతా మేము చేయాలా?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘మీకు లోబడి’ అని కూడా అనువదించవచ్చు. హీబ్రూ క్రియ ఒకరి మాటను ఆలకించడం లేదా దానికి అనుగుణంగా నడుచుకోవడం అనే అర్థాలను ఇవ్వగలదు.
    reason: lexical_alternative
  - marker: b
    text: 'అక్షరార్థం: ‘పరదేశ స్త్రీలను నివసింపజేసి.’ ఈ సందర్భంలో వారిని భార్యలుగా ఇంటిలో చేర్చుకోవడం అని భావం.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲנִשְׁמַע
  choice: మీ మాట విని
  rationale: שׁמע అనే క్రియ యొక్క నిఫాల్ రూపం ఇక్కడ ఒకరి మాటను ఆలకించి దానికి అనుగుణంగా నడుచుకోవడం అనే భావంలో వచ్చిన అలంకార ప్రశ్న. ‘మీ మాట విని’ అనేది మూల క్రియాభావాన్ని సహజమైన తెలుగులో నిలుపుతుంది; ‘మీకు లోబడి’ కూడా సాధ్యమైన అర్థం.
- source_word: וְלָכֶם
  choice: అయితే, మీ మాట
  rationale: לָכֶםలోని ద్వితీయ పురుష బహువచన సర్వనామం ఆలకించబడే వ్యక్తులను సూచిస్తుంది. וְ అనే సంధిని మునుపటి వాదనకు కొనసాగింపుగా తెలుగులో ‘అయితే’ అని సహజంగా వ్యక్తపరిచాం.
- source_word: לַעֲשֹׂת אֵת כָּל הָרָעָה הַגְּדוֹלָה הַזֹּאת
  choice: ఇంతటి ఘోరమైన చెడంతా ... చేయాలా
  rationale: כָּל యొక్క సమగ్రతను ‘చెడంతా’ నిలుపుతుంది. הַגְּדוֹלָה ఇక్కడ పరిమాణం కంటే అపరాధ తీవ్రతను సూచిస్తున్నందున ‘ఘోరమైన’ సహజమైన నైతిక భావాన్ని ఇస్తుంది.
- source_word: לִמְעֹל בֵּאלֹהֵינוּ
  choice: మన దేవునికి నమ్మకద్రోహం చేస్తూ
  rationale: מעל అనేది సాధారణ తప్పుకంటే విశ్వాసబంధాన్ని ఉల్లంఘించడం, ద్రోహంగా ప్రవర్తించడం అనే బలమైన భావం కలిగిన పదం. ‘నమ్మకద్రోహం’ ఆ సంబంధాత్మక, నిబంధనాత్మక బరువును సులభమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: לְהֹשִׁיב
  choice: పెళ్లి చేసుకొని
  rationale: హిఫిల్ రూపానికి అక్షరార్థం ‘నివసింపజేయడం.’ అయితే ‘పరదేశ స్త్రీలు’ అనే కర్మతో ఈ సందర్భంలో వారిని భార్యలుగా ఇంటిలో చేర్చుకోవడాన్ని సూచిస్తుంది. ప్రధాన పాఠ్యంలో సందర్భార్థాన్ని ఇచ్చి, అక్షరార్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: נָשִׁים נָכְרִיּוֹת
  choice: పరదేశ స్త్రీలను
  rationale: ఇది మూలంలోని ‘విదేశీయ/పరదేశ స్త్రీలు’ అనే పదబంధాన్ని దగ్గరగా ప్రతిబింబిస్తుంది. వివాహ భావాన్ని ముందున్న క్రియ సందర్భానుసారంగా తెలియజేస్తుంది.
theological_decisions:
- issue: לִמְעֹל בֵּאלֹהֵינוּలో అపరాధ స్వభావం
  choice: దేవునికి నమ్మకద్రోహం
  alternative: దేవునికి విరోధంగా పాపం చేయడం; దేవునికి సంబంధించిన పవిత్ర అపరాధం చేయడం
  rationale: מעל తరచుగా విశ్వాసబంధం లేదా నిబంధనను ఉల్లంఘించే ద్రోహాన్ని సూచిస్తుంది. ‘నమ్మకద్రోహం’ ఆ వేదాంతపరమైన బరువును నిలుపుతూ, దీన్ని కేవలం ఆచారపరమైన అపరాధంగా పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే అలంకార ప్రశ్నగా రూపొందించాం. ‘పరదేశ స్త్రీలు’ మూలంలోని జాతి/సమాజ భిన్నతను చూపుతుంది; ఆధునిక పౌరసత్వ భావాన్ని అనవసరంగా ముందుకు తేవదు. పాదసూచిక గుర్తులను అవి వివరిస్తున్న పదబంధాల వెంట ఉంచాం.
