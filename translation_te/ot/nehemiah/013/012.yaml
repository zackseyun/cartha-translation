  language: en
  yaml_path: translation/ot/nehemiah/013/012.yaml
  text: And all Judah brought the tithe of the grain[a], the new wine, and the oil into the storehouses.
translation:
  language: te
  text: యూదా ప్రజలందరూ ధాన్యం, కొత్త ద్రాక్షారసం, నూనె—వాటి దశమభాగాన్ని నిల్వగదుల్లోకి[a] తీసుకొచ్చారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఖజానా గదుల్లోకి.’ హెబ్రీ పదం నిల్వగదులను లేదా ఖజానా గదులను సూచించగలదు; ఇక్కడ ధాన్యం, ద్రాక్షారసం, నూనె ప్రస్తావన ఉన్నందున ‘నిల్వగదులు’ సందర్భానికి బాగా సరిపోతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כָל יְהוּדָה
  choice: యూదా వారందరూ
  rationale: כָּל יְהוּדָה ఇక్కడ యూదా సమాజమంతటినీ సమష్టిగా సూచిస్తుంది. ‘యూదా వారందరూ’ అనేది ప్రాంతం కంటే ప్రజల భావాన్ని సహజమైన తెలుగులో స్పష్టం చేస్తుంది.
- source_word: הֵבִיאוּ
  choice: తీసుకొచ్చారు
  rationale: בוא యొక్క హిఫీల్ రూపానికి ‘తీసుకురావడం’ అనే సాధారణ అర్థం ఉంది; గమ్యాన్ని తెలిపే ‘నిల్వగదుల్లోకి’తో ఇది సహజంగా సరిపోతుంది.
- source_word: מַעְשַׂר
  choice: దశమభాగాన్ని
  rationale: ఈ పదం పంటలో ఇవ్వవలసిన పదవ భాగాన్ని సూచిస్తుంది. హెబ్రీ ఏకవచనంలోని సమష్టి భావాన్ని తెలుగులో నిలుపుతుంది.
- source_word: הַ/דָּגָן
  choice: ధాన్యం
  rationale: דָּגָן సాధారణంగా ధాన్యపు పంటను సూచిస్తుంది; ‘ధాన్యం’ ఆధునిక తెలుగులో స్పష్టమైన సమానార్థకం.
- source_word: וְ/הַ/תִּירוֹשׁ
  choice: కొత్త ద్రాక్షారసం
  rationale: תִּירוֹשׁ సాధారణ ద్రాక్షారసానికి భిన్నంగా కొత్తగా లేదా తాజాగా తయారైన ద్రాక్షారసాన్ని సూచించగలదు; ఈ ప్రత్యేకతను అనువాదం నిలుపుతుంది.
- source_word: וְ/הַ/יִּצְהָר
  choice: నూనె
  rationale: יִצְהָר వ్యవసాయ ఉత్పత్తుల జాబితాల్లో సాధారణంగా తాజా నూనెను, ఎక్కువగా ఒలీవ నూనెను, సూచిస్తుంది. మూలంలో ఒలీవ అని స్పష్టంగా లేనందున విస్తృతమైన ‘నూనె’ను ఎంచుకున్నాం.
- source_word: לָ/אוֹצָרוֹת
  choice: నిల్వగదుల్లోకి
  rationale: ధాన్యం, ద్రాక్షారసం, నూనె వంటి పదార్థాలను ఉంచే ఆలయ గదులను సందర్భం సూచిస్తుంది. అందువల్ల ‘నిల్వగదులు’ సందర్భోచితంగా ఉంది; పదానికి ‘ఖజానా గదులు’ అనే అర్థం కూడా ఉండవచ్చు.
