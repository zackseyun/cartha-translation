source:
  edition: WLC
  text: גַּ֣ם בַּ/יָּמִ֣ים הָ/הֵ֗ם רָאִ֤יתִי אֶת הַ/יְּהוּדִים֙ הֹשִׁ֗יבוּ נָשִׁים֙ אשדודיות עמוניות מוֹאֲבִיּֽוֹת׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/023.yaml
  text: Also in those days I saw the Jews who had married women of Ashdod[a], Ammonite women[b], and Moabite women.
translation:
  language: te
  text: ఆ రోజుల్లో అష్డోదీయ స్త్రీలను, అమ్మోనీయ స్త్రీలను, మోయాబీయ స్త్రీలను పెళ్లి చేసుకున్న[b] యూదులను[a] కూడా నేను చూశాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యూదయులను.”
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “స్త్రీలను నివసింపజేశారు.” ఈ సందర్భంలో ఈ హీబ్రూ ప్రయోగం వారిని భార్యలుగా స్వీకరించడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: కూడా
  rationale: నెహెమ్యా సంస్కరణల నివేదికలో మరో పరిశీలనను చేర్చే పదం; ‘కూడా’ దాని సంకలన భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: בַּיָּמִים הָהֵם
  choice: ఆ రోజుల్లో
  rationale: చర్చలో ఉన్న కాలాన్ని సూచించే సాధారణ కాలవాచక ప్రయోగం.
- source_word: רָאִיתִי
  choice: నేను చూశాను
  rationale: సాధారణ ‘చూచుట’ అనే అర్థాన్నీ, నెహెమ్యా ప్రత్యక్ష సాక్ష్య స్వరాన్నీ నిలుపుతుంది.
- source_word: אֶת הַיְּהוּדִים
  choice: యూదులను
  rationale: ప్రవాసానంతర యూద సమాజాన్ని సూచించే సహజమైన, విస్తృతంగా అర్థమయ్యే పదం; భౌగోళికంగా నొక్కిచెప్పే ‘యూదయులను’ కూడా సాధ్యమైన ప్రత్యామ్నాయంగా పాదటీకలో ఉంచాం.
- source_word: הֹשִׁיבוּ
  choice: పెళ్లి చేసుకున్న
  rationale: హిఫిల్ రూపానికి అక్షరార్థంగా ‘నివసింపజేశారు/స్థిరపరిచారు’ అనే భావం ఉన్నా, ‘స్త్రీలు’ అనే కర్మతో ఈ సందర్భంలో భార్యలుగా స్వీకరించడాన్ని సూచించే నుడికారంగా ఉంది.
- source_word: נָשִׁים
  choice: స్త్రీలను
  rationale: మూల నామవాచకంలోని ‘స్త్రీలు’ అనే అర్థాన్ని నిలుపుతూ, వివాహ భావాన్ని క్రియ ద్వారా వ్యక్తం చేసింది.
- source_word: אשדודיות
  choice: అష్డోదీయ స్త్రీలను
  rationale: అష్డోదు ప్రాంతానికి చెందిన స్త్రీలను సూచించే జాతి/ప్రాంత విశేషణాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: עמוניות
  choice: అమ్మోనీయ స్త్రీలను
  rationale: అమ్మోను ప్రజలకు చెందిన స్త్రీలను సూచించే విశేషణానికి స్పష్టమైన తెలుగు రూపం.
- source_word: מוֹאֲבִיּוֹת
  choice: మోయాబీయ స్త్రీలను
  rationale: మోయాబు ప్రజలకు చెందిన స్త్రీలను సూచించే విశేషణానికి స్పష్టమైన తెలుగు రూపం.
theological_decisions:
- issue: הַיְּהוּדִים పదంలోని సామూహిక/భౌగోళిక భావం
  choice: యూదులను
  alternative: యూదయులను
  rationale: ఈ సందర్భం ప్రవాసానంతర ఒడంబడిక సమాజాన్ని సూచిస్తుంది. ‘యూదులు’ ఆధునిక తెలుగులో ఆ సామూహిక గుర్తింపును సహజంగా తెలియజేస్తుంది; ‘యూదయులు’ భౌగోళిక భావాన్ని ఎక్కువగా ముందుకు తెస్తుంది.
- issue: הֹשִׁיבוּ נָשִׁים అనే ప్రయోగపు నుడికార భావం
  choice: స్త్రీలను పెళ్లి చేసుకున్న
  alternative: స్త్రీలను నివసింపజేసిన / భార్యలుగా స్వీకరించిన
  rationale: అక్షరార్థ రూపాన్ని అస్పష్టంగా ఉంచకుండా, ఈ సందర్భంలో చర్చిస్తున్న వివాహ సంబంధాన్ని తెలియజేస్తుంది; అదే సమయంలో అక్షరార్థ నిర్మాణాన్ని పాదటీకలో నమోదు చేసింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రద కథన శైలి. జాతి/ప్రాంత విశేషణాల్లో సమాంతర నిర్మాణాన్ని నిలుపుతూ, హీబ్రూ నుడికారాన్ని సహజమైన వివాహ పదబంధంగా అనువదించాం.
