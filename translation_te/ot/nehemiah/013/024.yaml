  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే, గౌరవప్రదమైన కథన శైలి. ‘యూదా భాష’ అని ఉంచి మూలంలో లేని ‘హీబ్రూ’ అనే నిర్దిష్టీకరణను నివారించింది. ప్రధాన పాఠ్యంలో [a] సూచిక చేర్చబడింది.
