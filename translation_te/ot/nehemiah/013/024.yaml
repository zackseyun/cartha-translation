  text: וּ/בְנֵי/הֶ֗ם חֲצִי֙ מְדַבֵּ֣ר אַשְׁדּוֹדִ֔ית וְ/אֵינָ֥/ם מַכִּירִ֖ים לְ/דַבֵּ֣ר יְהוּדִ֑ית וְ/כִ/לְשׁ֖וֹן עַ֥ם וָ/עָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/024.yaml
  text: And half of their children spoke Ashdodite[a], and they were not able to speak Judean, but only the language of one people or another.
translation:
  language: te
  text: వారి పిల్లల్లో సగం మంది అష్డోదు భాష మాట్లాడేవారు[a]. యూదా భాష మాట్లాడడం వారికి చేతకాలేదు; వారు వివిధ ప్రజల భాషల ప్రకారం మాట్లాడేవారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “వారి పిల్లల్లో సగం మంది అష్డోదు భాష మాట్లాడేవారు; యూదా భాష మాట్లాడడం వారికి తెలియదు; వారు ప్రతి ప్రజ యొక్క భాష ప్రకారం మాట్లాడేవారు.”'
    reason: מַכִּירִים ను మాట్లాడే సామర్థ్యానికి బదులు మాట్లాడే పరిజ్ఞానంగా అనువదించే అవకాశం ఉంది; וְכִלְשׁוֹן עַם וָעָם యొక్క పంపిణీ నిర్మాణాన్ని మరింత పదానుసారంగా వ్యక్తం చేస్తుంది.
lexical_decisions:
- source_word: וּבְנֵיהֶם
  choice: వారి పిల్లల్లో
  rationale: בנים సందర్భంలో మిశ్రమ కుటుంబాల సంతానాన్ని సాధారణంగా సూచిస్తుంది; లింగపరంగా పరిమితం కాని ‘పిల్లలు’ సహజమైన తెలుగు రూపం.
- source_word: חֲצִי מְדַבֵּר
  choice: సగం మంది ... మాట్లాడేవారు
  rationale: ఏకవచన సమూహప్రయోగాన్ని తెలుగులో సహజంగా బహువచన అలవాటు/స్థితి రూపంతో వ్యక్తం చేసింది.
- source_word: אַשְׁדּוֹדִית
  choice: అష్డోదు భాష
  rationale: స్త్రీలింగ జాతివాచక రూపం అష్డోదుతో సంబంధమైన భాషను సూచిస్తుంది; తెలుగులో ప్రదేశనామంతో ‘భాష’ అనడం స్పష్టంగా ఉంటుంది.
- source_word: וְאֵינָם מַכִּירִים לְדַבֵּר
  choice: మాట్లాడడం చేతకాలేదు
  rationale: הכיר + క్రియార్థక రూపం ఇక్కడ కేవలం గుర్తించడం కాక, మాట్లాడే పరిజ్ఞానం లేదా సామర్థ్యం లేకపోవడాన్ని సూచిస్తుంది; ‘చేతకాలేదు’ ఆ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: יְהוּדִית
  choice: యూదా భాష
  rationale: పాఠ్యం యూదా/యూదయ ప్రజల భాషను సూచిస్తుంది; దానిని నేరుగా ‘హీబ్రూ’గా నిర్ధారించకుండా మూలంలోని చారిత్రక పదప్రయోగాన్ని నిలుపుతుంది.
- source_word: וְכִלְשׁוֹן עַם וָעָם
  choice: ఒక్కొక్క ప్రజల భాషల్లోనే మాట్లాడేవారు
  rationale: עם ועם అనే పునరుక్తి పంపిణీ భావాన్ని—వేర్వేరు ప్రజల భాషలను—తెలుపుతుంది. ముందున్న ‘యూదా భాష మాట్లాడడం చేతకాలేదు’ అనే వ్యతిరేకతను తెలుగులో సహజంగా తెలియజేయడానికి ‘నే’ ఉపయోగించబడింది.
