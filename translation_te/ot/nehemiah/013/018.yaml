source:
  edition: WLC
  text: הֲ/ל֨וֹא כֹ֤ה עָשׂוּ֙ אֲבֹ֣תֵי/כֶ֔ם וַ/יָּבֵ֨א אֱלֹהֵ֜י/נוּ עָלֵ֗י/נוּ אֵ֚ת כָּל הָ/רָעָ֣ה הַ/זֹּ֔את וְ/עַ֖ל הָ/עִ֣יר הַ/זֹּ֑את וְ/אַתֶּ֞ם מוֹסִיפִ֤ים חָרוֹן֙ עַל יִשְׂרָאֵ֔ל לְ/חַלֵּ֖ל אֶת הַ/שַּׁבָּֽת־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/018.yaml
  text: Did not your fathers do this[a], and our God brought all this evil on us and on this city? Yet you are adding wrath against Israel by profaning the Sabbath.
translation:
  language: te
  text: మీ పితరులు ఇలాగే చేయలేదా? మన దేవుడు ఈ విపత్తంతా[a] మనమీదికి, ఈ పట్టణంమీదికి రప్పించాడు కదా? అయినా మీరు విశ్రాంతిదినాన్ని అపవిత్రపరుస్తూ ఇశ్రాయేలుమీద కోపాన్ని మరింత పెంచుతున్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఈ కీడంతా” లేదా “ఈ ఆపదంతా.” ఇక్కడ హెబ్రీ పదం רָעָה దేవుని తీర్పు సందర్భంలో విపత్తు లేదా ఆపదను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלוֹא כֹה עָשׂוּ
  choice: ఇలాగే చేయలేదా?
  rationale: הֲלוֹא అంగీకారాన్ని ఆశించే అలంకారిక ప్రశ్నను సూచిస్తుంది; כֹה עָשׂוּ అంటే ముందుగా చెప్పిన విధంగానే చేయడం.
- source_word: אֲבֹתֵיכֶם
  choice: మీ పితరులు
  rationale: మూలంలోని పురుష బహువచన కుటుంబపదాన్ని గౌరవప్రదమైన, బైబిలు సందర్భానికి సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: וַיָּבֵא
  choice: రప్పించాడు
  rationale: בוא హిఫీల్ రూపం ‘వచ్చేలా చేయడం/తీసుకురావడం’ అనే కారణార్థాన్ని కలిగి ఉంది; తీర్పు విపత్తును దేవుడు రప్పించాడనే భావాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: אֵת כָּל הָרָעָה הַזֹּאת
  choice: ఈ విపత్తంతటినీ
  rationale: తీర్పు సందర్భంలో רָעָה నైతిక దుష్టత్వం కంటే సంభవించిన కీడు, విపత్తు లేదా ఆపదను సూచిస్తుంది; ‘విపత్తు’ ఆధునిక తెలుగులో అపార్థాన్ని నివారిస్తుంది.
- source_word: מוֹסִיפִים חָרוֹן עַל יִשְׂרָאֵל
  choice: ఇశ్రాయేలు మీదికి మరింత ఉగ్రతను రప్పిస్తున్నారు
  rationale: מוֹסִיפִים కొనసాగుతున్న పెంపును సూచిస్తుంది. ‘మరింత’ దాని భావాన్ని సహజంగా వ్యక్తం చేస్తుంది; חָרוֹן దైవిక తీర్పుతో కూడిన మండే కోపాన్ని ‘ఉగ్రత’గా నిలుపుతుంది.
- source_word: לְחַלֵּל אֶת הַשַּׁבָּת
  choice: విశ్రాంతిదినాన్ని అపవిత్రపరుస్తూ
  rationale: חלל పవిత్రమైనదాన్ని అపవిత్రం చేయడాన్ని సూచిస్తుంది; infinitive construction ప్రస్తుత చర్య ద్వారా ఉగ్రతను పెంచుతున్న విధానాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: దేవుడు రప్పించిన רָעָה యొక్క అర్థం
  choice: విపత్తు
  alternative: కీడు
  rationale: ఈ సందర్భంలో పదం పాపానికి ప్రతిగా వచ్చిన దైవిక తీర్పు విపత్తును సూచిస్తుంది. ‘కీడు’ మూలపద విస్తృతిని ఉంచినా దేవుడు నైతిక చెడును చేశాడనే అపార్థం కలిగించవచ్చు.
- issue: חָרוֹן లోని దైవిక కోప తీవ్రత
  choice: ఉగ్రత
  alternative: మండే కోపం
  rationale: దైవిక తీర్పు తీవ్రతను తగ్గించకుండా సంక్షిప్తంగా వ్యక్తం చేస్తుంది. అయితే ‘దేవుని’ అనే పదాన్ని మూలంలో ప్రత్యక్షంగా లేనందున చేర్చలేదు; సందర్భమే ఉగ్రత ఎవరిదో సూచిస్తుంది.
- issue: מוֹסִיפִים חָרוֹן నిర్మాణంలోని కారణ భావం
  choice: ఉగ్రతను రప్పిస్తున్నారు
  alternative: ఉగ్రతను పెంచుతున్నారు
  rationale: పదశః ‘ఉగ్రతను ఇశ్రాయేలు మీద పెంచుతున్నారు’ అని ఉన్నప్పటికీ, తెలుగులో ‘రప్పిస్తున్నారు’ ముందటి దైవిక తీర్పుతో సంబంధాన్ని సహజంగా చూపుతుంది. అయినా ఉగ్రత దేవునిదని మూలానికి మించి బహిరంగంగా చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన బైబిలు శైలి. ‘పితరులు,’ ‘విశ్రాంతిదినం,’ ‘అపవిత్రపరుస్తూ,’ ‘ఉగ్రత’ వంటి పదాలు సాధారణ పాఠకులకు అర్థమయ్యేలా ఉండి మూలంలోని నిబంధనాత్మక తీర్పు గంభీరతను నిలుపుతాయి. అవసరం లేని పాదటిప్పణి పెట్టలేదు.
