id: NEH.13.2
reference: Nehemiah 13:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּ֣י לֹ֧א קִדְּמ֛וּ אֶת בְּנֵ֥י יִשְׂרָאֵ֖ל בַּ/לֶּ֣חֶם וּ/בַ/מָּ֑יִם וַ/יִּשְׂכֹּ֨ר עָלָ֤י/ו אֶת בִּלְעָם֙ לְ/קַֽלְל֔/וֹ וַ/יַּהֲפֹ֧ךְ אֱלֹהֵ֛י/נוּ הַ/קְּלָלָ֖ה לִ/בְרָכָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/002.yaml
  text: because they did not meet the sons of Israel with bread and water[a], and hired Balaam against them to curse them, but our God turned the curse into a blessing.
translation:
  language: te
  text: ఎందుకంటే వారు ఇశ్రాయేలు కుమారులను రొట్టెతో, నీళ్లతో ఎదుర్కొనలేదు; బిలామును అతనికి విరోధంగా, అతన్ని శపించడానికి కూలికి నియమించాడు.[a] అయితే మన దేవుడు ఆ శాపాన్ని ఆశీర్వాదంగా మార్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ‘అతనికి విరోధంగా’ మరియు ‘అతన్ని శపించడానికి’ అనే చోట ఏకవచన సర్వనామ రూపాలు ఉన్నాయి; ఇక్కడ ఇశ్రాయేలు సామూహిక ఏకవచనంగా సూచించబడింది.
    reason: మూలంలోని సామూహిక ఏకవచన సర్వనామ రూపాలను వివరిస్తుంది.
lexical_decisions:
- source_word: קִדְּמוּ
  choice: ఎదుర్కొనలేదు
  rationale: ఈ సందర్భంలో קדמ అనేది ప్రయాణికులను ఎదురుగా వెళ్లి కలుసుకోవడం లేదా స్వాగతించడం అనే భావాన్ని ఇస్తుంది. తరువాత వచ్చే ‘రొట్టెతో, నీళ్లతో’ అనే పదబంధంతో ‘ఎదుర్కొనలేదు’ సహజంగా సరిపోతుంది; ‘ఆదరించలేదు’ అనేది కొంత వ్యాఖ్యానాత్మకం.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులను
  rationale: హీబ్రూలోని పుత్రసంబంధ పదబంధాన్ని రూపపరంగా నిలుపుతూ, ఆధునిక ప్రామాణిక తెలుగులో అర్థమయ్యేలా అనువదిస్తుంది.
- source_word: בַּלֶּחֶם וּבַמָּיִם
  choice: రొట్టెతో, నీళ్లతో
  rationale: మూలంలో పేర్కొన్న ప్రాథమిక ఆహార పానీయాలను నిర్దిష్టంగా నిలుపుతుంది; ‘ఆహారంతో, నీళ్లతో’ అనడం ‘రొట్టె’ అనే స్పష్టతను కోల్పోతుంది.
- source_word: וַיִּשְׂכֹּר עָלָיו אֶת־בִּלְעָם
  choice: బిలామును అతనికి విరోధంగా కిరాయికి తీసుకొని
  rationale: క్రియ ఏకవచనంలోను, עָלָיו లోని సర్వనామ ప్రత్యయం ఏకవచనంలోను ఉన్నాయి. వాక్యంలో కర్త స్పష్టంగా చెప్పబడనందున తెలుగులో కూడా దానిని చేర్చకుండా, మూలంలోని ఏకవచన సామూహిక సూచనను నిలిపింది.
- source_word: לְקַלְלוֹ
  choice: అతన్ని శపింపజేయాలని
  rationale: హీబ్రూ ప్రత్యయం అక్షరార్థంగా ఏకవచనం (‘అతన్ని’); ఇశ్రాయేలును సామూహిక ఏకవచనంగా సూచిస్తున్న ఉద్వేగాన్ని ప్రధాన పాఠంలోనే నిలుపుతుంది.
- source_word: וַיַּהֲפֹךְ
  choice: మార్చాడు
  rationale: ఒక స్థితిని మరొక స్థితిగా పరివర్తించడం అనే క్రియార్థాన్ని సహజమైన తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: אֱלֹהֵינוּ
  choice: మన దేవుడు
  rationale: మూలంలోని మొదటి పురుష బహువచన స్వామ్య ప్రత్యయాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: הַקְּלָלָה לִבְרָכָה
  choice: ఆ శాపాన్ని ఆశీర్వాదంగా
  rationale: హీబ్రూ పరివర్తన నిర్మాణాన్ని సహజమైన తెలుగు విభక్తులతో వ్యక్తం చేసి, శాపం—ఆశీర్వాదం వ్యతిరేకతను నిలుపుతుంది.
theological_decisions:
- issue: ఇశ్రాయేలు ప్రజలకు పుత్రసంబంధ సామూహిక నామం
  choice: ఇశ్రాయేలు కుమారులను
  alternative: ఇశ్రాయేలీయులను / ఇశ్రాయేలు ప్రజలను
  rationale: మూలంలోని בְּנֵי అనే పురుష పుత్రసంబంధ రూపాన్ని తటస్థీకరించకుండా నిలుపుతుంది; అయినా ఇది మొత్తం ఇశ్రాయేలు సమాజాన్ని సూచించే సంప్రదాయ సామూహిక పదబంధం.
- issue: శాపగ్రహీతకు సంబంధించిన సామూహిక ఏకవచనం
  choice: అతన్ని శపింపజేయాలని
  alternative: వారిని శపింపజేయాలని
  rationale: లְקַלְלוֹ లోని ఏకవచన ప్రత్యయాన్ని నిలిపి, ఇశ్రాయేలును ఒక సామూహిక ఏకకంగా చూపే మూలంలోని వ్యాకరణ ఉద్వేగాన్ని సంరక్షిస్తుంది. సహజ తెలుగు పాఠకుడు ‘ఇశ్రాయేలు’ అనే సామూహిక సూచనతో దీనిని గ్రహించగలడు.
- issue: కిరాయికి తీసుకున్న క్రియ యొక్క చెప్పని ఏకవచన కర్త
  choice: కర్తను తెలుగులో స్పష్టంగా చేర్చలేదు
  alternative: అతడు బిలామును కిరాయికి తీసుకున్నాడు / వారు బిలామును కిరాయికి తీసుకున్నారు
  rationale: హీబ్రూ క్రియ ఏకవచనమైనా ఈ వాక్యంలో కర్తకు పేరు లేదు; చారిత్రకంగా బాలాకును స్పష్టంగా చేర్చడం వ్యాఖ్యానమవుతుంది, బహువచనం చేయడం రూపాన్ని మార్చుతుంది. తెలుగులో కర్తను వదలడం ఈ అస్పష్టతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవభరితమైన, సులభంగా చదవదగిన శైలి. ‘కిరాయికి తీసుకొని’ మూలంలోని ఆర్థిక లావాదేవీ భావాన్ని నిలుపుతుంది. ప్రధాన పాఠంలో [a] సూచిక సంబంధిత శాప వాక్యానంతరం ఉంచబడింది.
