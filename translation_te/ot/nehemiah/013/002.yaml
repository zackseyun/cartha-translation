revisions:
- from: ఎందుకంటే వారు ఇశ్రాయేలు కుమారులను రొట్టెతో, నీళ్లతో ఎదుర్కొనలేదు; బిలామును అతనికి విరోధంగా కిరాయికి తీసుకొని, అతన్ని శపింపజేయాలని చూశారు.[a] అయితే మన దేవుడు ఆ శాపాన్ని ఆశీర్వాదంగా మార్చాడు.
  to: ఎందుకంటే వారు ఇశ్రాయేలు కుమారులను రొట్టెతో, నీళ్లతో ఎదుర్కొనలేదు; బిలామును అతనికి విరోధంగా, అతన్ని శపించడానికి కూలికి నియమించాడు.[a] అయితే మన దేవుడు ఆ శాపాన్ని ఆశీర్వాదంగా మార్చాడు.
  rationale: The revision removes the added ‘tried/intended’ meaning, restores a direct purpose construction, and uses a singular, subject-omitted Telugu verb to reflect the Hebrew singular verb while leaving its historical referent unspecified. The footnote remains anchored at the pronoun-and-curse clause and explains the collective singular without resolving it interpretively.
