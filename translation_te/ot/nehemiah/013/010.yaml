id: NEH.13.10
reference: Nehemiah 13:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וָ/אֵ֣דְעָ֔/ה כִּֽי מְנָי֥וֹת הַ/לְוִיִּ֖ם לֹ֣א נִתָּ֑נָה וַ/יִּבְרְח֧וּ אִישׁ לְ/שָׂדֵ֛/הוּ הַ/לְוִיִּ֥ם וְ/הַ/מְשֹׁרְרִ֖ים עֹשֵׂ֥י הַ/מְּלָאכָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/010.yaml
  text: And I learned that the portions of the Levites had not been given[b][a], so the Levites and the singers who did the work had each fled to his field.
translation:
  language: te
  text: లేవీయుల భాగాలు[a] ఇవ్వబడలేదని నేను తెలుసుకున్నాను. అందువల్ల పని చేసేవారైన లేవీయులూ గాయకులూ ఒక్కొక్కరూ తమ తమ పొలాలకు పారిపోయారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘లేవీయులకు నియమించబడిన భాగాలు.’
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘ప్రతి వ్యక్తి తన పొలానికి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֵדְעָה
  choice: నేను తెలుసుకున్నాను
  rationale: ידע ఇక్కడ నెహెమ్యా అప్పటివరకు తెలియని పరిస్థితిని గ్రహించినట్లు సూచిస్తుంది; కేవలం ‘నాకు తెలుసు’ అనే స్థితికన్నా ‘తెలుసుకున్నాను’ సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: מְנָיוֹת הַלְוִיִּם
  choice: లేవీయుల భాగాలు
  rationale: מְנָיוֹת అనేది వారికి కేటాయించబడిన పోషణ భాగాలను సూచిస్తుంది. మూలంలోని నిర్మాణ సంబంధాన్ని సంక్షిప్తంగా నిలుపుతూ, ప్రత్యామ్నాయ వివరణను పాదసూచికలో ఇచ్చాం.
- source_word: לֹא נִתָּנָה
  choice: ఇవ్వబడలేదు
  rationale: נתן యొక్క కర్మణి భావాన్ని నిలుపుతుంది. హెబ్రీలో సమష్టిగా భావించినందువల్ల క్రియ ఏకవచనంలో ఉన్నప్పటికీ, తెలుగులో ‘భాగాలు’తో సహజమైన కర్మణి నిర్మాణం వాడబడింది.
- source_word: וַיִּבְרְחוּ
  choice: వెళ్లిపోయారు
  rationale: ברח యొక్క ప్రాథమిక భావం ‘పారిపోవడం’; అయితే ఇక్కడ జీవనోపాధి లేక సేవాస్థలాన్ని విడిచి తమ పొలాలకు తిరిగిపోయిన సందర్భంలో ‘వెళ్లిపోయారు’ సహజంగా ఉంటుంది, సందర్భంలోని నిర్బంధిత విరమణ భావాన్ని వాక్యం నిలుపుతుంది.
- source_word: אִישׁ לְשָׂדֵהוּ
  choice: ఒక్కొక్కరూ తమ తమ పొలాలకు
  rationale: అక్షరార్థంగా ‘ప్రతి వ్యక్తి తన పొలానికి’; తెలుగులో పంచిపెట్టే భావాన్ని ‘ఒక్కొక్కరూ తమ తమ’ స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וְהַמְשֹׁרְרִים
  choice: గాయకులు
  rationale: ఆలయ సేవతో సంబంధమున్న గాయకులను సూచిస్తుంది; సందర్భం స్పష్టంగా ఉన్నందున మూలంలో లేని ‘ఆలయ’ అనే పదాన్ని చేర్చలేదు.
- source_word: עֹשֵׂי הַמְּלָאכָה
  choice: పని చేస్తున్న
  rationale: వర్తమాన కృదంత పదబంధాన్ని సహజమైన తెలుగు విశేషణ వాక్యభాగంగా అందిస్తుంది; పని స్వభావాన్ని మూలం కంటే ఎక్కువగా నిర్దేశించదు.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన శైలి. ఆలయ సేవా సందర్భాన్ని అనవసరంగా విస్తరించకుండా, మూలంలోని పంపిణీ భావం మరియు సేవకులు తమ పొలాలకు తిరిగిపోయిన పరిణామం నిలుపబడ్డాయి.
