source:
  edition: WLC
  text: וְ/הַ/צֹּרִים֙ יָ֣שְׁבוּ בָ֔/הּ מְבִיאִ֥ים דָּ֖אג וְ/כָל מֶ֑כֶר וּ/מֹכְרִ֧ים בַּ/שַּׁבָּ֛ת לִ/בְנֵ֥י יְהוּדָ֖ה וּ/בִ/ירוּשָׁלִָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/016.yaml
  text: Also Tyrians lived in it[a], bringing in fish and every kind of merchandise[b], and selling them on the Sabbath to the sons of Judah, and in Jerusalem.
translation:
  language: te
  text: తూరు ప్రజలు కూడా ఆ నగరంలో నివసించేవారు. వారు చేపలనూ అన్నిరకాల అమ్మకపు సరుకులనూ తీసుకొచ్చి, సబ్బాతు దినాన యూదా ప్రజలకు[a], యెరూషలేములో కూడా[b] వాటిని అమ్మేవారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ అక్షరార్థం: ‘యూదా కుమారులకు’; సందర్భంలో ఇది యూదా ప్రజలను, అంటే యూదయులను సూచిస్తుంది.'
    reason: lexical_alternative
  - marker: b
    text: ‘యెరూషలేములోనే’ అని నొక్కిచెప్పే భావంలో కూడా ఈ చివరి పదబంధాన్ని అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַצֹּרִים
  choice: తూరు పట్టణానికి చెందినవారు కూడా
  rationale: ఇది తూరు నుంచి వచ్చిన లేదా తూరుకు చెందిన ప్రజలను సూచిస్తుంది. וְ అనే అనుసంధానాన్ని సందర్భానుసారంగా ‘కూడా’ అని ఇచ్చాం.
- source_word: יָשְׁבוּ בָהּ
  choice: ఆ నగరంలో నివసించేవారు
  rationale: ישׁב ఇక్కడ స్థిరంగా నివసించడాన్ని సూచిస్తుంది; స్త్రీలింగ ఏకవచన ప్రత్యయం సందర్భంలోని యెరూషలేము నగరాన్ని సూచిస్తున్నందున దానిని స్పష్టంగా ‘ఆ నగరంలో’ అని అనువదించాం.
- source_word: מְבִיאִים
  choice: తీసుకొచ్చి
  rationale: బוא హిఫీల్ రూపం వస్తువులను నగరంలోకి తీసుకురావడాన్ని సూచిస్తుంది. తెలుగు వాక్యప్రవాహానికి అనుగుణంగా అసమాపక క్రియను వాడాం.
- source_word: דָּאג
  choice: చేపలను
  rationale: ఈ నామవాచకం మార్కెట్ సందర్భంలో చేపలను సూచిస్తుంది.
- source_word: וְכָל מֶכֶר
  choice: అన్నిరకాల అమ్మకపు సరుకులను
  rationale: מֶכֶר అంటే అమ్మకానికి ఉంచిన సరుకు లేదా వర్తక వస్తువులు. כָל యొక్క విస్తృత భావాన్ని సహజ తెలుగులో ‘అన్నిరకాల’ అని వ్యక్తం చేశాం.
- source_word: וּמֹכְרִים
  choice: వాటిని అమ్మేవారు
  rationale: వర్తమాన కృదంతం కొనసాగుతున్న లేదా అలవాటైన వ్యాపార చర్యను వర్ణిస్తుంది. ‘వాటిని’ అనేది ముందున్న చేపలు, సరుకులను తిరిగి సూచించేందుకు తెలుగులో చేర్చబడింది.
- source_word: בַּשַּׁבָּת
  choice: విశ్రాంతి దినాన
  rationale: שַׁבָּת అనే నిర్దిష్ట దినాన్ని సాధారణ ఆధునిక తెలుగు పాఠకులకు అర్థమయ్యే సంప్రదాయ పదబంధంతో ఇచ్చాం.
- source_word: לִבְנֵי יְהוּדָה
  choice: యూదా ప్రజలకు
  rationale: అక్షరార్థంగా ‘యూదా కుమారులకు’ అయినా, ఈ సందర్భంలో అది యూదా సమాజాన్ని సమష్టిగా సూచిస్తుంది. ఆధునిక తెలుగులో సహజంగా, సమగ్రంగా ఉండేందుకు ‘యూదా ప్రజలకు’ అని ఇచ్చి అక్షరార్థాన్ని పాదసూచికలో నిలిపాం.
- source_word: וּבִירוּשָׁלִָם
  choice: యెరూషలేములో కూడా
  rationale: וְ అనే అనుసంధానాన్ని ‘కూడా’ అని ఇచ్చి, అమ్మకం యెరూషలేములో సైతం జరిగిందనే భావాన్ని నిలిపాం. ఈ పదబంధానికి నొక్కిచెప్పే భావం ఉండవచ్చని పాదసూచికలో సూచించాం.
