translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గంభీరమైన వచనశైలిని అనుసరించాం. హీబ్రూ వాక్యంలోని కొనసాగుతున్న క్రియలను తెలుగులో సహజమైన అలవాటుచర్య రూపాలతో వ్యక్తం చేశాం; చివరి పదబంధంలోని సాధ్యమైన ఉద్ఘాటనను ప్రధాన పాఠంలో బలవంతంగా నిర్ణయించకుండా పాదసూచికలో నిలిపాం.
