base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/013.yaml
  text: And I appointed over the storerooms Shelemiah the priest[a], Zadok the scribe, and Pedaiah from the Levites, and Hanan son of Zaccur, son of Mattaniah, at their side, because they were considered faithful[c][b]; and it was upon them to distribute to their brothers.
translation:
  language: te
  text: నిల్వగదుల బాధ్యతను యాజకుడైన షెలెమ్యాకు, లేఖకుడైన సాదోకుకు, లేవీయులలో ఒకడైన పెదాయాకు అప్పగించాను; వారికి తోడుగా మత్తన్యా కుమారుడైన జక్కూరు కుమారుడు హానానును నియమించాను.[a] వారు నమ్మదగినవారిగా పరిగణించబడ్డారు కాబట్టి,[b] తమ సహోదరులకు పంచిపెట్టే బాధ్యత వారికి అప్పగించబడింది.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారి ఆధ్వర్యంలో.” హీబ్రూ నుడికారం సన్నిహిత సహవాసాన్ని లేదా అధీన సేవను సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “విశ్వసనీయులుగా ఎంచబడ్డారు.”
    reason: lexical_alternative
  - marker: c
    text: “సహోదరులు” అనేది హీబ్రూలోని పుంలింగ పదానికి అనువాదం; ఇక్కడ అది వారి తోటి సమాజ సభ్యులను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹצְרָה עַל אֹצָרוֹת
  choice: నిల్వగదుల బాధ్యతను ... అప్పగించాను
  rationale: ఈ క్రియారూపం ఇక్కడ అధికారులను నియమించి నిల్వగదులపై బాధ్యత ఉంచడాన్ని సూచిస్తుంది. దశమభాగాలు, సరఫరాలు నిల్వచేసే సందర్భంలో אֹצָרוֹתకు ‘నిల్వగదులు’ సహజమైన సందర్భానుగుణ అర్థం.
- source_word: שֶׁלֶמְיָה הַכֹּהֵן
  choice: యాజకుడైన షెలెమ్యా
  rationale: వ్యక్తి పేరును లిప్యంతరీకరించి, పదవిని ఆధునిక ప్రామాణిక తెలుగులో అనువదించాం.
- source_word: צָדוֹק הַסֹּפֵר
  choice: శాస్త్రియైన సాదోకు
  rationale: סֹפֵר అనే పదానికి శాస్త్రి, లేఖకుడు లేదా కార్యదర్శి అనే భావాలు ఉండవచ్చు. అధికారిక బిరుదును అతిగా నిర్దిష్టం చేయకుండా ఉంచేందుకు ‘శాస్త్రి’ ఎంచుకున్నాం.
- source_word: וּפְדָיָה מִן הַלְוִיִּם
  choice: లేవీయులలో ఒకడైన పెదాయా
  rationale: హీబ్రూ వాక్యంలోని ‘లేవీయులలో నుండి’ అనే సమూహసభ్యత్వ భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וְעַל יָדָם
  choice: వారికి తోడుగా
  rationale: ఈ హీబ్రూ నుడికారం సమీప సహవాసాన్ని లేదా వారి ఆధ్వర్యంలో సేవ చేయడాన్ని సూచించవచ్చు. ప్రధాన పాఠం సంబంధాన్ని తెలిపి, హోదాక్రమాన్ని ఖచ్చితంగా నిర్ణయించదు.
- source_word: חָנָן בֶּן זַכּוּר בֶּן מַתַּנְיָה
  choice: మత్తన్యా కుమారుడైన జక్కూరు కుమారుడు హానాను
  rationale: హీబ్రూ వంశావళి సంబంధాన్ని తెలుగులో సహజమైన క్రమంలో ఉంచి, పేర్లను లిప్యంతరీకరించాం.
- source_word: כִּי נֶאֱמָנִים נֶחְשָׁבוּ
  choice: వారు నమ్మదగినవారిగా పరిగణించబడ్డారు కాబట్టి
  rationale: נֶאֱמָנִיםలోని విశ్వసనీయత భావాన్నీ, נֶחְשָׁבוּలోని ‘అలా ఎంచబడ్డారు/పరిగణించబడ్డారు’ అనే మూల్యాంకన భావాన్నీ నిలుపుతుంది.
- source_word: וַעֲלֵיהֶם לַחֲלֹק
  choice: పంచిపెట్టే బాధ్యత వారికి అప్పగించబడింది
  rationale: עֲלֵיהֶם నియమించబడిన బాధ్యతను, חלק ఈ సందర్భంలో వాటాలను పంపిణీ చేయడాన్ని సూచిస్తాయి. తెలుగులో స్పష్టంగా, సహజంగా వ్యక్తీకరించాం.
- source_word: לַאֲחֵיהֶם
  choice: తమ సహోదరులకు
  rationale: మూలంలోని పుంలింగ బహువచన బంధుత్వ పదాన్ని నిలుపుతూ, సందర్భంలో వారి తోటి సమాజ సభ్యులను సూచించగల విస్తృతిని అలాగే ఉంచుతుంది.
theological_decisions:
- issue: אֲחֵיהֶם అనే లింగసూచక బంధుత్వ పదం
  choice: తమ సహోదరులకు
  alternative: తమ తోటి సమాజ సభ్యులకు
  rationale: మూలపాఠం పుంలింగ బహువచన బంధుత్వ పదాన్ని వాడుతుంది. దాని రూపాన్ని చెరపకుండా ‘సహోదరులు’ అని అనువదించాం; సందర్భానుగుణ విస్తృత సూచనను పాదటిప్పణిలో వివరించాం.
- issue: וְעַל יָדָםలోని సంబంధం లేదా ఆధీనత
  choice: వారికి తోడుగా
  alternative: వారి ఆధ్వర్యంలో
  rationale: హీబ్రూ నుడికారం సహచర్యాన్నీ, అధీన సేవనూ సూచించగలదు. హోదాక్రమాన్ని నిర్బంధంగా నిర్ణయించకుండా ప్రధాన పాఠంలో సంబంధార్థాన్ని ఉంచి ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే పరిపాలనా భాష. హీబ్రూ వాక్య నిర్మాణాన్ని యాంత్రికంగా అనుకరించకుండా, దాని బాధ్యత, సహచర్యం, విశ్వసనీయత అనే భావాలను నిలిపే సహజ తెలుగు వాక్య నిర్మాణం ఉపయోగించబడింది.
