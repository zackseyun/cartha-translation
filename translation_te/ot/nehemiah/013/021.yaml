source:
  edition: WLC
  text: וָ/אָעִ֣ידָ/ה בָ/הֶ֗ם וָ/אֹמְרָ֤/ה אֲלֵי/הֶם֙ מַדּ֜וּעַ אַתֶּ֤ם לֵנִים֙ נֶ֣גֶד הַ/חוֹמָ֔ה אִם תִּשְׁנ֕וּ יָ֖ד אֶשְׁלַ֣ח בָּ/כֶ֑ם מִן הָ/עֵ֣ת הַ/הִ֔יא לֹא בָ֖אוּ בַּ/שַּׁבָּֽת־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/021.yaml
  text: So I warned them and said to them[a], “Why are you spending the night in front of the wall? If you do it again, I will lay hands on you.” From that time on they did not come on the Sabbath.
translation:
  language: te
  text: 'అప్పుడు నేను వారిని హెచ్చరించి, వారితో ఇలా అన్నాను: “మీరు ప్రాకారం ఎదుట రాత్రి ఎందుకు గడుపుతున్నారు? మీరు మళ్లీ ఇలా చేస్తే, మీ మీద చెయ్యి వేస్తాను[a].” అప్పటి నుండి వారు విశ్రాంతి దినాన రాలేదు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “మీ మీద బలప్రయోగం చేస్తాను.” హీబ్రూ నుడికారానికి అక్షరార్థం “మీ మీదికి చెయ్యి పంపుతాను.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאָעִידָה
  choice: నేను వారిని హెచ్చరించి
  rationale: హిఫీల్ రూపం ఈ సందర్భంలో వ్యాపారుల ప్రవర్తనకు వ్యతిరేకంగా గంభీరంగా హెచ్చరించడాన్ని సూచిస్తుంది.
- source_word: לֵנִים
  choice: రాత్రి ఎందుకు గడుపుతున్నారు
  rationale: లון/לין అంటే రాత్రి బస చేయడం; ఆధునిక తెలుగులో ఈ ప్రయోగం సహజంగా, స్పష్టంగా ఉంది.
- source_word: נֶגֶד הַחוֹמָה
  choice: ప్రాకారం ఎదుట
  rationale: נֶגֶד సూచించే ‘ఎదుట/అభిముఖంగా’ అనే స్థానార్థాన్ని నిలుపుతుంది; మూలంలో నేరుగా లేని ‘ప్రాకారం వెలుపల’ అనే భావాన్ని చేర్చదు.
- source_word: אִם תִּשְׁנוּ
  choice: మీరు మళ్లీ ఇలా చేస్తే
  rationale: שנה ఇక్కడ ‘మళ్లీ చేయడం’ అని అర్థం; సందర్భంలో దాని కర్మ అంతర్నిహితంగా ఉన్నందున ‘ఇలా’ సహజమైన స్పష్టతను ఇస్తుంది.
- source_word: יָד אֶשְׁלַח בָּכֶם
  choice: మీ మీద చెయ్యి వేస్తాను
  rationale: ‘మీ మీదికి చెయ్యి పంపుతాను’ అనే హీబ్రూ నుడికారాన్ని రూపకబలంతో తెలుగులో అందిస్తుంది; ఇది బలప్రయోగం లేదా నిర్బంధ చర్యకు బెదిరింపు కావచ్చు.
- source_word: מִן הָעֵת הַהִיא
  choice: అప్పటి నుండి
  rationale: ఆ హెచ్చరిక తరువాత ఏర్పడిన నిరంతర ఫలితాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: בַּשַּׁבָּת
  choice: విశ్రాంతి దినాన
  rationale: שַׁבָּת అనే దినపేరును సాధారణ ఆధునిక తెలుగు పాఠకులకు అర్థమయ్యే స్థిరమైన రూపంలో అందిస్తుంది.
theological_decisions:
- issue: యָד אֶשְׁלַח בָּכֶם అనే బెదిరింపు స్వరూపం
  choice: మీ మీద చెయ్యి వేస్తాను
  alternative: మీ మీద బలప్రయోగం చేస్తాను
  rationale: మూల నుడికారంలోని ఉద్దేశపూర్వక అనిర్దిష్టతను నిలుపుతూ, నెహెమ్యా ఏ నిర్దిష్ట శిక్షను ఉద్దేశించాడో అధికంగా నిర్ణయించకుండా ఉంటుంది.
translation_notes:
  register: సహజమైన, ప్రస్తుత ప్రామాణిక తెలుగుతో పాటు గంభీరమైన కథన స్వరం పాటించబడింది. ‘ప్రాకారం ఎదుట’ మూలంలోని స్థానార్థాన్ని, ‘మీ మీద చెయ్యి వేస్తాను’ మూల నుడికారంలోని బెదిరింపు మరియు అనిర్దిష్టతను నిలుపుతాయి.
