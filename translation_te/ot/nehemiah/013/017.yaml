id: NEH.13.17
reference: Nehemiah 13:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וָ/אָרִ֕יבָ/ה אֵ֖ת חֹרֵ֣י יְהוּדָ֑ה וָ/אֹמְרָ֣/ה לָ/הֶ֗ם מָֽה הַ/דָּבָ֨ר הָ/רָ֤ע הַ/זֶּה֙ אֲשֶׁ֣ר אַתֶּ֣ם עֹשִׂ֔ים וּֽ/מְחַלְּלִ֖ים אֶת י֥וֹם הַ/שַּׁבָּֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/017.yaml
  text: So I contended with the nobles of Judah and said to them[a], “What is this evil thing that you are doing, profaning the Sabbath day?”
translation:
  language: te
  text: 'అప్పుడు నేను యూదా ప్రముఖులతో వాదించి, వారితో ఇలా అన్నాను: “మీరు విశ్రాంతిదినాన్ని అపవిత్రపరుస్తూ చేస్తున్న ఈ దుష్ట కార్యం ఏమిటి?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאָרִיבָה
  choice: అప్పుడు నేను ... వాదించి
  rationale: ריב ఇక్కడ ప్రతిఘటిస్తూ గట్టిగా ప్రశ్నించడం లేదా తప్పుపట్టడం అనే భావాన్ని ఇస్తుంది. ‘వాదించి’ దాని సంఘర్షణాత్మక బలాన్ని నిలుపుతూ, దీనిని తప్పనిసరిగా న్యాయపరమైన ఆరోపణగా నిర్దేశించదు. ‘అప్పుడు’ కథన కొనసాగింపును సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: חֹרֵי יְהוּדָה
  choice: యూదా ప్రముఖులు
  rationale: חֹרִים సమాజంలోని ఉన్నతస్థాయి లేదా ప్రభావశీల నాయకులను సూచిస్తుంది. ‘ప్రముఖులు’ ఆధునిక తెలుగులో సహజంగా ఉండి, నిర్దిష్ట అధికార పదవిని అనవసరంగా జోడించదు.
- source_word: וָאֹמְרָה לָהֶם
  choice: వారితో ... అని అన్నాను
  rationale: హీబ్రూ వాక్యంలోని ప్రత్యక్ష సంభాషణను, చెప్పబడినవారి సూచనతో సహజమైన తెలుగు క్రమంలో ఉంచుతుంది.
- source_word: מָה הַדָּבָר הָרָע הַזֶּה
  choice: ఈ దుష్ట కార్యం ఏమిటి?
  rationale: רָע లోని నైతిక ఖండనను ‘దుష్ట’ నిలుపుతుంది; דָּבָר సందర్భంలో వారు చేస్తున్న పనిని సూచిస్తున్నందున ‘కార్యం’ సహజంగా సరిపోతుంది.
- source_word: אֲשֶׁר אַתֶּם עֹשִׂים
  choice: మీరు చేస్తున్న
  rationale: వర్తమాన కృదంతం సూచించే కొనసాగుతున్న చర్యను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וּמְחַלְּלִים
  choice: అపవిత్రపరుస్తూ
  rationale: חלל పవిత్రమైనదాన్ని సామాన్యమైనదిగా లేదా అపవిత్రమైనదిగా చూడటం అనే భావాన్ని కలిగి ఉంది. ‘అపవిత్రపరుస్తూ’ ఆ పవిత్రతకు సంబంధించిన వ్యతిరేకతను స్పష్టంగా నిలుపుతుంది.
- source_word: אֶת יוֹם הַשַּׁבָּת
  choice: విశ్రాంతిదినాన్ని
  rationale: יוֹם మరియు שַׁבָּת రెండింటి భావాన్ని సంక్షిప్తంగా, తెలుగు బైబిలు పరిభాషకు అనుగుణంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: విశ్రాంతిదిన ఉల్లంఘనను సూచించే పదబంధం
  choice: విశ్రాంతిదినాన్ని అపవిత్రపరుస్తూ
  alternative: విశ్రాంతిదినాన్ని ఉల్లంఘిస్తూ / దాని పవిత్రతను భంగపరుస్తూ
  rationale: మూలంలోని חלל కేవలం నియమాన్ని అతిక్రమించడం కంటే, పవిత్రమైనదాన్ని సామాన్యంగా లేదా అపవిత్రంగా చూడటాన్ని ప్రధానంగా సూచిస్తుంది. అందువల్ల ‘అపవిత్రపరుస్తూ’ విశ్రాంతిదిన పవిత్రతకు సంబంధించిన వేదాంత బరువును నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘ప్రముఖులు’ సామాజిక నాయకత్వాన్ని సహజంగా తెలియజేస్తుంది; ‘అపవిత్రపరుస్తూ’ మూలంలోని పవిత్రత–సామాన్యత వ్యత్యాసాన్ని కాపాడుతుంది.
