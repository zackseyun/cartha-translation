  to: ఆ రోజుల్లో యూదాలో విశ్రాంతిదినాన ద్రాక్ష గానుగలను తొక్కుతూ, ధాన్యపు కుప్పలను తీసుకువచ్చి గాడిదల మీద మోపుతూ ఉండేవారిని నేను చూశాను. వారు ద్రాక్షామద్యం, ద్రాక్షపండ్లు, అంజూరపండ్లు, అన్ని రకాల సరుకులను విశ్రాంతిదినాన యెరూషలేములోకి తీసుకువచ్చేవారు. వారు ఆహారం అమ్మిన రోజున నేను వారికి సాక్ష్యమిచ్చి హెచ్చరించాను.
