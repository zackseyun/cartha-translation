  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: בַּ/יָּמִ֣ים הָ/הֵ֡מָּה רָאִ֣יתִי בִֽ/יהוּדָ֣ה דֹּֽרְכִֽים גִּתּ֣וֹת בַּ/שַּׁבָּ֡ת וּ/מְבִיאִ֣ים הָ/עֲרֵמ֣וֹת וְֽ/עֹמְסִ֪ים עַל הַ/חֲמֹרִ֟ים וְ/אַף יַ֜יִן עֲנָבִ֤ים וּ/תְאֵנִים֙ וְ/כָל מַשָּׂ֔א וּ/מְבִיאִ֥ים יְרוּשָׁלִַ֖ם בְּ/י֣וֹם הַ/שַּׁבָּ֑ת וָ/אָעִ֕יד בְּ/י֖וֹם מִכְרָ֥/ם צָֽיִד׀־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/015.yaml
  text: In those days I saw in Judah people treading winepresses on the Sabbath, and bringing in heaps of grain and loading them on donkeys—and also wine, grapes, figs, and every kind of load—and bringing them into Jerusalem on the Sabbath day. So I testified against them on the day they sold food.
translation:
  language: te
  text: ఆ రోజుల్లో యూదాలో విశ్రాంతిదినాన ద్రాక్ష గానుగలను తొక్కుతూ, ధాన్యపు కుప్పలను తీసుకువచ్చి గాడిదల మీద మోపుతూ ఉండేవారిని నేను చూశాను. వారు ద్రాక్షామద్యం, ద్రాక్షపండ్లు, అంజూరపండ్లు, అన్ని రకాల సరుకులను విశ్రాంతిదినాన యెరూషలేములోకి తీసుకువచ్చేవారు. వారు ఆహారం అమ్మిన రోజున నేను వారికి సాక్ష్యమిచ్చి హెచ్చరించాను.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דֹּרְכִים גִּתּוֹת
  choice: ద్రాక్షగానుగలను తొక్కడం
  rationale: ద్రాక్షారసం తీయడానికి గానుగలో ద్రాక్షలను కాళ్లతో తొక్కే క్రియను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: הָעֲרֵמוֹת
  choice: ధాన్యపు కుప్పలను
  rationale: పదం సాధారణంగా ‘కుప్పలు’ అని అర్థమిచ్చినా సందర్భంలో మోసుకువచ్చి అమ్మే వ్యవసాయ దిగుబడి సూచన ఉంది; ఆంగ్ల సంప్రదింపుల పాఠంలోని grain భావాన్ని స్పష్టంగా ఉంచింది.
- source_word: מַשָּׂא
  choice: సరుకులను
  rationale: మోసే ‘భారం’ అనే మూలభావంతో పాటు మార్కెట్‌కు తెచ్చే వస్తువుల సందర్భాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וָאָעִיד
  choice: నేను వారిని హెచ్చరించాను
  rationale: హిఫీల్ రూపం సాక్ష్యమివ్వడం, గంభీరంగా హెచ్చరించడం అనే భావాలను కలిగి ఉంది; ఈ సందర్భంలో నెహెమ్యా చేసిన మందలింపు/హెచ్చరికను సహజంగా తెలుపుతుంది.
- source_word: צָיִד
  choice: ఆహారం
  rationale: ఆహార సరఫరా లేదా తినుబండారాలు అనే విస్తృత భావాన్ని సరళమైన ఆధునిక పదంతో అందిస్తుంది.
theological_decisions:
- issue: విశ్రాంతిదిన ఉల్లంఘన స్వరూపం
  choice: పని చేయడం, సరుకులు తీసుకురావడం, ఆహారం అమ్మడం అన్న చర్యలను పాఠంలో ఉన్నట్లే వివరించడం
  alternative: ఈ చర్యలను ఒక నిర్దిష్ట మతపరమైన న్యాయవ్యవస్థ పదజాలంతో వ్యాఖ్యానించడం
  rationale: వచనం చూపించే ఆచరణాత్మక ఉల్లంఘనను మాత్రమే నిలుపుతూ, తరువాతి మతసంప్రదాయాల ప్రత్యేక వ్యాఖ్యానాలను దిగుమతి చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనా సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్యనిర్మాణం. పొడవైన హీబ్రూ సమన్వయ వాక్యాన్ని చదవడానికి సౌలభ్యంగా రెండు వాక్యాలుగా విభజించాం.
