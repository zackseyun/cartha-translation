id: NEH.13.4
reference: Nehemiah 13:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/לִ/פְנֵ֣י מִ/זֶּ֔ה אֶלְיָשִׁיב֙ הַ/כֹּהֵ֔ן נָת֖וּן בְּ/לִשְׁכַּ֣ת בֵּית אֱלֹהֵ֑י/נוּ קָר֖וֹב לְ/טוֹבִיָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/004.yaml
  text: Before this[a], Eliashib the priest, who had been appointed over the chamber of the house of our God, was related to Tobiah—
translation:
  language: te
  text: దీనికి ముందు, మన దేవుని మందిరంలోని గదికి బాధ్యుడిగా నియమించబడిన యాజకుడైన ఎల్యాషీబు తోబీయాతో సన్నిహిత సంబంధం కలిగి ఉన్నాడు[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తోబీయాకు బంధువుగా ఉన్నాడు.” హీబ్రూ పదబంధం కుటుంబ బంధాన్నైనా సన్నిహిత సామాజిక సంబంధాన్నైనా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִפְנֵי מִזֶּה
  choice: దీనికి ముందు
  rationale: ముందు జరిగిన పరిస్థితిని పరిచయం చేసే కాలసూచక పదబంధం. וְ యొక్క అనుసంధాన భావాన్ని తెలుగులో ప్రత్యేకంగా ‘మరియు’ అని చేర్చకుండా సహజ వాక్యప్రవాహంలో వ్యక్తం చేశాం.
- source_word: אֶלְיָשִׁיב הַכֹּהֵן
  choice: యాజకుడైన ఎల్యాషీబు
  rationale: వ్యక్తి పేరును తెలుగు లిప్యంతరీకరణలో ఇచ్చి, నిర్దిష్టమైన యాజక పదవిని సహజ తెలుగు నిర్మాణంలో ఉంచాం.
- source_word: נָתוּן בְּלִשְׁכַּת בֵּית אֱלֹהֵינוּ
  choice: మన దేవుని మందిరంలోని గదికి బాధ్యుడిగా నియమించబడిన
  rationale: נָתוּן ఇక్కడ కేవలం ఒక చోట ఉంచబడడాన్ని కాక, ఆ గదికి అప్పగించబడిన అధికారిక బాధ్యతను సూచించే ప్రయోగంగా గ్రహించాం. לִשְׁכָּהను దాని సాధారణ నిర్మాణార్థమైన ‘గది’గా అనువదించాం; సందర్భంలో అది నిల్వగది అయి ఉండవచ్చు గాని మూలపాఠం దానిని స్పష్టంగా నిర్దేశించదు.
- source_word: קָרוֹב לְטוֹבִיָּה
  choice: తోబీయాతో బంధుత్వం కలిగి ఉన్నాడు[a]
  rationale: קָרוֹב לְ అనేది కుటుంబ బంధాన్నైనా సామాజిక సాన్నిహిత్యాన్నైనా సూచించగలదు. ప్రధాన పాఠంలో సందర్భానికి అనుకూలమైన బంధుత్వ భావాన్ని ఇచ్చి, విస్తృతమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలిపాం.
theological_decisions:
- issue: ఎల్యాషీబుకు తోబీయాతో ఉన్న సంబంధ స్వభావం
  choice: బంధుత్వం కలిగి ఉన్నాడు
  alternative: తోబీయాకు సన్నిహితుడిగా ఉన్నాడు
  rationale: మూలంలోని קָרוֹב לְ సంబంధం కుటుంబపరమైనదో సామాజికమైనదో ఖచ్చితంగా తేల్చదు. ఏ ప్రత్యేక సిద్ధాంతపరమైన లేదా నైతిక నిర్ధారణను పాఠంలోకి చేర్చకుండా ఈ అనిశ్చితిని పాదసూచికతో కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలిని ఉపయోగించాం. తరువాతి వచనంతో వాక్య సంబంధం కొనసాగుతుందని సూచించడానికి చివర దీర్ఘ విరామచిహ్నాన్ని నిలిపాం.
