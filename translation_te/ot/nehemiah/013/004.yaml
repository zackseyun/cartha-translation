revisions:
- from: దీనికి ముందు, మన దేవుని మందిరంలోని గదికి బాధ్యుడిగా నియమించబడిన యాజకుడైన ఎల్యాషీబు తోబీయాతో బంధుత్వం కలిగి ఉన్నాడు[a]—
  to: దీనికి ముందు, మన దేవుని మందిరంలోని గదికి బాధ్యుడిగా నియమించబడిన యాజకుడైన ఎల్యాషీబు తోబీయాతో సన్నిహిత సంబంధం కలిగి ఉన్నాడు[a]—
  rationale: The revision replaces the kinship-specific main rendering with a broad expression that can encompass both familial and social closeness. The footnote supplies the kinship reading as a legitimate alternative, preserving the Hebrew ambiguity without adding interpretive certainty.
