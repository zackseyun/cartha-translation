  text: וַ/יָּלִ֨ינוּ הָ/רֹכְלִ֜ים וּ/מֹכְרֵ֧י כָל מִמְכָּ֛ר מִ/ח֥וּץ לִ/ירוּשָׁלִָ֖ם פַּ֥עַם וּ/שְׁתָּֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/020.yaml
  text: Then the merchants and sellers of every kind of goods spent the night outside Jerusalem once or twice[a][b].
translation:
  language: te
  text: అప్పుడు వ్యాపారులు, అన్ని రకాల సరుకులు అమ్మేవారు, ఒకసారి లేదా రెండుసార్లు యెరూషలేము వెలుపల రాత్రి బస చేశారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీలో అక్షరార్థంగా, ‘ఒకసారి మరియు రెండుసార్లు’; ఇది ‘ఒకసారి లేదా రెండుసార్లు’ అనే భావాన్నిచ్చే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּלִינוּ
  choice: రాత్రి గడిపారు
  rationale: לון అనే క్రియ రాత్రిపూట బస చేయడాన్ని సూచిస్తుంది. ‘రాత్రి గడిపారు’ అనేది ఆధునిక తెలుగులో సహజంగా ఉండి, తాత్కాలిక బస అనే భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: הָרֹכְלִים
  choice: వ్యాపారులు
  rationale: רֹכֵל వర్తకుడు లేదా వ్యాపారిని సూచిస్తుంది. సందర్భంలోని వాణిజ్య భావానికి ‘వ్యాపారులు’ సహజమైన, విస్తృతంగా అర్థమయ్యే పదం.
- source_word: וּמֹכְרֵי כָל מִמְכָּר
  choice: అన్నిరకాల సరుకులు అమ్మేవారు
  rationale: ఈ పదబంధం అమ్మకానికి ఉన్న అన్ని రకాల వస్తువుల విస్తృతిని తెలియజేస్తుంది. ‘అన్నిరకాల సరుకులు అమ్మేవారు’ మూలంలోని భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: מִחוּץ לִירוּשָׁלָם
  choice: యెరూషలేము వెలుపల
  rationale: מִחוּץ నగరానికి బయట ఉన్న ప్రదేశాన్ని సూచిస్తుంది. ‘యెరూషలేము వెలుపల’ సంక్షిప్తంగా, స్పష్టంగా ఉంది.
- source_word: פַּעַם וּשְׁתָּיִם
  choice: ఒకటి రెండుసార్లు
  rationale: అక్షరార్థంగా ‘ఒకసారి మరియు రెండుసార్లు’ అనే హెబ్రీ నుడికారం ఒకటి లేదా రెండు సందర్భాలను సూచిస్తుంది. ‘ఒకటి రెండుసార్లు’ తెలుగులో సహజంగా అదే పరిమిత పునరావృతిని తెలియజేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు స్పష్టంగా, గౌరవప్రదంగా ఉండే శైలి ఉపయోగించబడింది. వ్యాపార సందర్భంలోని రెండు వర్గాలను వేరుగా ఉంచుతూ, హెబ్రీ నుడికారాన్ని సహజమైన తెలుగు ప్రయోగంతో అందించారు.
