  source_fidelity: The draft retains the Hebrew's temporal setting, Nehemiah's absence, the regnal year, the anomalous designation “king of Babylon,” his going to the king, and his later request for leave. A small revision makes the past absence and the request-for-leave construction more explicit and idiomatic in Telugu.
