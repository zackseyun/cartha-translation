translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథనశైలి వాడబడింది. మూలపాఠంలోని ‘బబులోను రాజు’ అనే చారిత్రక ఉద్రిక్తతను సమన్వయపరచకుండా నిలిపి, కాలవ్యవధి అనిర్దిష్టతను పాదటిప్పణిలో చూపించాం.
