  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/בְ/כָל זֶ֕ה לֹ֥א הָיִ֖יתִי בִּֽ/ירוּשָׁלִָ֑ם כִּ֡י בִּ/שְׁנַת֩ שְׁלֹשִׁ֨ים וּ/שְׁתַּ֜יִם לְ/אַרְתַּחְשַׁ֤סְתְּא מֶֽלֶךְ בָּבֶל֙ בָּ֣אתִי אֶל הַ/מֶּ֔לֶךְ וּ/לְ/קֵ֥ץ יָמִ֖ים נִשְׁאַ֥לְתִּי מִן הַ/מֶּֽלֶךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/006.yaml
  text: But during all this I was not in Jerusalem[a], for in the thirty-second year of Artaxerxes king of Babylon I went to the king[b], and after some time I asked leave from the king.
translation:
  language: te
  text: అయితే, ఇవన్నీ జరుగుతున్న సమయంలో నేను యెరూషలేములో లేకపోయాను. ఎందుకంటే బబులోను రాజైన[a] అర్తహషస్త పరిపాలనలో ముప్పై రెండవ సంవత్సరంలో నేను రాజు దగ్గరకు వెళ్లాను. కొంతకాలం తర్వాత[b] నేను రాజు నుండి సెలవు కోరాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పాఠంలో ‘బబులోను రాజు’ అని ఉంది. విస్తృతమైన పర్షియా సామ్రాజ్య నేపథ్యానికి అనుగుణంగా మార్చకుండా, పాఠంలో ఉన్నట్టుగానే అనువదించబడింది.
    reason: textual_variant
  - marker: b
    text: లేదా, ‘కొన్ని రోజులు గడిచిన తర్వాత’ / ‘ఒక కాలవ్యవధి ముగిసిన తర్వాత.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְכָל זֶה
  choice: అయితే ఈ సంగతులన్నీ జరుగుతున్నప్పుడు
  rationale: ఈ పదబంధం ముందుగా వివరించిన సంఘటనలు జరుగుతున్న కాలాన్ని సూచిస్తూ, ఆ సమయంలో నెహెమ్యా అక్కడ లేడనే వ్యత్యాసాన్ని చూపుతుంది.
- source_word: לֹא הָיִיתִי בִּירוּשָׁלִָם
  choice: నేను యెరూషలేములో లేను
  rationale: గతకాలంలోని అతని గైర్హాజరును సరళంగా, సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: నెహెమ్యా యెరూషలేములో లేకపోవడానికి కారణాన్ని పరిచయం చేసే వివరణాత్మక సంబంధాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: בִּשְׁנַת שְׁלֹשִׁים וּשְׁתַּיִם לְאַרְתַּחְשַׁסְתְּא
  choice: అర్తహషస్త పరిపాలనలో ముప్పై రెండో సంవత్సరంలో
  rationale: రాజు పాలన ఆధారంగా సంవత్సరాన్ని లెక్కించే హీబ్రూ రాజ్యకాల ప్రయోగాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: מֶלֶךְ בָּבֶל
  choice: బబులోను రాజైన
  rationale: చారిత్రక పర్షియా నేపథ్యానికి అనుగుణంగా మార్చకుండా, హీబ్రూ పాఠంలో ఉన్న ‘బబులోను రాజు’ అనే రూపాన్నే నిలుపుతుంది.
- source_word: בָּאתִי אֶל הַמֶּלֶךְ
  choice: నేను రాజు దగ్గరకు వెళ్లాను
  rationale: בוא సందర్భానుసారంగా ‘వచ్చు’ లేదా ‘వెళ్లు’ అని అర్థమవుతుంది; యెరూషలేము నుండి రాజు వద్దకు వెళ్లిన నెహెమ్యా దృష్టికోణంలో ‘వెళ్లాను’ సహజంగా ఉంది.
- source_word: וּלְקֵץ יָמִים
  choice: కొంతకాలం తర్వాత
  rationale: అక్షరార్థంగా ‘దినాల ముగింపులో’ అనే మాటను, ఇక్కడ సూచించే అనిర్దిష్ట కాలవ్యవధికి అనుగుణంగా సహజమైన తెలుగులో అందిస్తుంది.
- source_word: נִשְׁאַלְתִּי מִן הַמֶּלֶךְ
  choice: రాజును సెలవు అడిగాను
  rationale: ఇక్కడ నిఫాల్ రూపం రాజు వద్ద అనుమతి లేదా సెలవు కోరడాన్ని సూచిస్తుంది. అనుమతి తప్పక లభించిందని పాఠానికి మించి చెప్పకుండా అభ్యర్థననే వ్యక్తం చేస్తుంది.
