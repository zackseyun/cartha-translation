  text: And it displeased me greatly[b][a], and I threw all the household goods of Tobiah out of the chamber.
translation:
  language: te
  text: అది నాకు ఎంతో బాధ కలిగించింది. అందువల్ల నేను తోబీయా ఇంటి సామానంతటినీ[b] ఆ గది[a] నుండి బయటికి విసిరివేశాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ ‘గది’ అంటే దేవాలయ ప్రాంగణంలో ఉన్న ఒక గది.
    reason: cultural_note
  - marker: b
    text: ‘తోబీయా ఇంటి పాత్రలన్నిటినీ’ అని కూడా అనువదించవచ్చు. హీబ్రూ పదం పాత్రలు, ఉపకరణాలు, వస్తువులు లేదా సామాను అనే విస్తృత భావాలను కలిగి ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרַע לִי מְאֹד
  choice: అది నాకు ఎంతో అసంతృప్తి కలిగించింది
  rationale: רעע + לִי అనే హీబ్రూ ప్రయోగం ఒక విషయం వ్యక్తికి ఎంతో చెడ్డదిగా లేదా అసంతృప్తికరంగా అనిపించిందని తెలుపుతుంది. ఈ అనువాదం మూలంలోని పరోక్ష నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: וָאַשְׁלִיכָה
  choice: విసిరివేశాను
  rationale: హిఫీల్ రూపంలోని שלך బలంగా బయటకు విసరడాన్ని సూచిస్తుంది. ‘విసిరివేశాను’ చర్యలోని దృఢత్వాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: כָּל
  choice: అంతటినీ
  rationale: మొత్తం వస్తుసముదాయాన్ని సమగ్రంగా సూచించే భావాన్ని తెలుగులో సహజంగా అందిస్తుంది.
- source_word: כְּלֵי בֵית טוֹבִיָּה
  choice: తోబీయా ఇంటి సామాను
  rationale: כְּלִי అనే పదానికి పాత్రలు, ఉపకరణాలు, వస్తువులు, సామాను వంటి విస్తృత అర్థాలు ఉన్నాయి. ఈ సందర్భంలో తోబీయాకు చెందిన గదిలో ఉంచిన వస్తువులను సూచించేందుకు ‘ఇంటి సామాను’ స్పష్టంగా, సహజంగా ఉంది.
- source_word: הַחוּץ מִן הַלִּשְׁכָּה
  choice: ఆ గదిలో నుండి బయటికి
  rationale: మూలంలోని గది నుంచి బయటకు కదలికను తెలుగులో సహజమైన క్రమంలో తెలియజేస్తుంది; సందర్భం వల్ల అది దేవాలయ ప్రాంగణంలోని గది అని తెలుస్తుంది.
