    text: లేదా ‘కాపలా వంతులను’ లేదా ‘సేవా నియామకాలను’.
    reason: మִשְׁמָרוֹת అనే పదానికి కాపలా వంతులు, నియమిత సేవా విభాగాలు, లేదా బాధ్యతలు అనే అర్థాలు ఉండవచ్చు.
  revision_rationale: 'The revision preserves the Hebrew’s single administrative action and its distributive qualification: service responsibilities were assigned for priests and Levites, each in his respective work. It also replaces a stiff expression for ‘everything foreign’ with a natural Telugu expression that remains deliberately broad.'
