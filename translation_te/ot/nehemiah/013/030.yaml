id: NEH.13.30
reference: Nehemiah 13:30
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/טִֽהַרְתִּ֖י/ם מִ/כָּל נֵכָ֑ר וָ/אַעֲמִ֧ידָ/ה מִשְׁמָר֛וֹת לַ/כֹּהֲנִ֥ים וְ/לַ/לְוִיִּ֖ם אִ֥ישׁ בִּ/מְלַאכְתּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/030.yaml
  text: So I cleansed them from everything foreign[a], and I assigned duties for the priests and for the Levites, each in his work,
translation:
  language: te
  text: అలా నేను వారిని విదేశీయమైన ప్రతిదాని నుండి శుద్ధి చేశాను. యాజకులకూ లేవీయులకూ, ప్రతి ఒక్కరికి తన తన పనిలో, సేవా బాధ్యతలను[a] నియమించాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘కాపలా వంతులను’ లేదా ‘సేవా నియామకాలను’.
    reason: మִשְׁמָרוֹת అనే పదానికి కాపలా వంతులు, నియమిత సేవా విభాగాలు, లేదా బాధ్యతలు అనే అర్థాలు ఉండవచ్చు.
lexical_decisions:
- source_word: וְטִהַרְתִּים
  choice: అలా నేను వారిని ... శుద్ధి చేశాను
  rationale: పియేల్ రూపంలోని טהר ‘శుద్ధి చేయడం/కల్మషాన్ని తొలగించడం’ అనే అర్థాన్ని ఇస్తుంది. ‘అలా’ ముందటి సంస్కరణ చర్యల ఫలితంగా ఇది జరిగిందనే కథన ప్రవాహాన్ని సూచిస్తుంది; ‘వారిని’ అనే బహువచన కర్మను అలాగే ఉంచుతుంది.
- source_word: מִכָּל נֵכָר
  choice: పరదేశ సంబంధమైన ప్రతిదాని నుండి
  rationale: נֵכָר పరదేశీ లేదా అన్యమైన దానిని విస్తృతంగా సూచించగలదు. ఈ పదబంధం దాన్ని కేవలం పరదేశీయులుగా లేదా పరదేశీ స్త్రీలుగా సంకుచితం చేయకుండా మూలంలోని విస్తృతిని నిలుపుతుంది.
- source_word: וָאַעֲמִידָה
  choice: ఏర్పాటుచేసి ... నియమించాను
  rationale: עמד హిఫీల్ రూపానికి ఇక్కడ పరిపాలనా భావంలో ఏర్పాటు చేయడం, స్థానంలో ఉంచడం, నియమించడం అనే అర్థం ఉంది. సేవా వంతులను ఏర్పాటు చేయడం, ప్రతి వ్యక్తిని తగిన పనిలో నియమించడం అనే వాక్య నిర్మాణం తెలుగులో సహజంగా ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: מִשְׁמָרוֹת
  choice: సేవా వంతులను
  rationale: ఈ పదం కాపలా వంతులు, సేవా విభాగాలు లేదా అప్పగించిన బాధ్యతలను సూచించగలదు. యాజకులు, లేవీయుల ఆలయ సేవ సందర్భంలో ‘సేవా వంతులు’ క్రమబద్ధమైన సేవా నియామకాలను స్పష్టంగా తెలియజేస్తుంది; ఇతర సాధ్యార్థాలు పాదసూచికలో ఇవ్వబడ్డాయి.
- source_word: לַכֹּהֲנִים וְלַלְוִיִּם
  choice: యాజకులకు, లేవీయులకు
  rationale: మూలంలోని రెండు వర్గాలనూ స్పష్టంగా, సమాంతరంగా ఉంచుతుంది.
- source_word: אִישׁ
  choice: ప్రతి ఒక్కరిని
  rationale: ఇక్కడ אִישׁ పంపిణీయ భావంతో సమూహంలోని ఒక్కొక్కరిని సూచిస్తుంది. తెలుగు పదబంధం ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: בִּמְלַאכְתּוֹ
  choice: వారి వారి పనిలో
  rationale: מְלָאכָה పని, బాధ్యత లేదా సేవను సూచిస్తుంది. ‘వారి వారి పనిలో’ ప్రతి వ్యక్తికి ప్రత్యేకంగా అప్పగించబడిన సేవను సహజ తెలుగు ప్రయోగంలో తెలియజేస్తుంది.
theological_decisions:
- issue: ‘వారిని’ మరియు ‘పరదేశ సంబంధమైన ప్రతిదాని’ అనే మాటల పరిధి
  choice: సంబంధిత సమాజాన్ని పరదేశ సంబంధమైన అంశాలన్నిటి నుండి శుద్ధి చేసినట్లు విస్తృతంగానే అనువదించడం
  alternative: వారిని పరదేశీయులందరి నుండి శుద్ధి చేశాను; యాజకులు, లేవీయులను పరదేశీ స్త్రీలందరి నుండి శుద్ధి చేశాను
  rationale: సందర్భంలో మిశ్రవివాహాలు, యాజక సంబంధ రాజీ ఉన్నప్పటికీ, ఈ వచనంలోని హెబ్రీ పదాలు కేవలం ఒక జాతి వర్గాన్నో పరదేశీ భార్యలనో మాత్రమే నిర్దిష్టంగా చెప్పవు. అందువల్ల మూలంలోని ఉద్దేశపూర్వక విస్తృతిని నిలుపుకున్నాం.
- issue: אִישׁ యొక్క పంపిణీయ పుంలింగ రూపం
  choice: ప్రతి ఒక్కరిని వారి వారి పనిలో
  alternative: ప్రతి పురుషుణ్ణి అతని పనిలో
  rationale: ఇక్కడ వ్యాకరణ పుంలింగం ప్రధానంగా ఒక్కొక్క సభ్యునికి పని కేటాయించబడిందనే పంపిణీయ భావాన్ని ఇస్తుంది. అనవసరంగా లింగాన్ని ముందుకు తేవకుండా ఆ భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే గౌరవప్రదమైన గ్రంథశైలిని నిలుపుతూ అనువదించబడింది. ‘పరదేశ సంబంధమైన’ అనే పదబంధం మూలంలోని విస్తృతిని కాపాడుతుంది. [a] గుర్తును అది వివరిస్తున్న ‘సేవా వంతులను’ అనే పదబంధం వెంట ఉంచాం.
