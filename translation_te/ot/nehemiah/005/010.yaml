  yaml_path: translation/ot/nehemiah/005/010.yaml
  text: And I also[a], my brothers and my young men, are lending them money and grain. Please[c][b], let us stop this burden.
translation:
  language: te
  text: నేనూ, నా సహోదరులూ, నా యువకులూ[a] వారికి డబ్బూ ధాన్యమూ అప్పుగా ఇస్తున్నాం[b]. దయచేసి, ఈ భారాన్ని[c] మనం ఇక వదిలేద్దాం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘నా సేవకులూ,’ ‘నా పరిచారకులూ.’
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘వారి నుండి డబ్బు, ధాన్యం వసూలు చేస్తున్నాం.’ హీబ్రూ క్రియ కేవలం అప్పు ఇవ్వడమే కాకుండా రుణదాతలుగా వ్యవహరించడం లేదా వసూలు చేయడం అనే భావాన్ని కూడా ఇవ్వవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: లేదా ‘ఈ వసూలును,’ ‘ఈ అప్పును.’ హీబ్రూ పదానికి అక్షరార్థంగా ‘భారం’ అనే భావం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם אֲנִי
  choice: నేనూ
  rationale: וְגַם యొక్క అదనపు, ఉద్ఘాటన భావాన్ని సహజమైన తెలుగులో తెలియజేస్తూ, నెహెమ్యా తనను కూడా ఈ ఆచరణలో ఉన్నవారిలో చేర్చుకుంటున్నాడని సూచిస్తుంది.
- source_word: אַחַי
  choice: నా సహోదరులూ
  rationale: మూలంలోని కుటుంబసంబంధ పదాన్ని నిలుపుతుంది; సందర్భంలో ఇది బంధువులను లేదా సన్నిహిత యూద సహచరులను కూడా సూచించవచ్చు.
- source_word: וּנְעָרַי
  choice: నా యువకులూ
  rationale: נַעַר అనే పదపు ప్రాథమిక భావాన్ని నిలుపుతుంది; ఇక్కడ అది నెహెమ్యా పరివారంలోని సేవకులు లేదా పరిచారకులను సూచించే అవకాశాన్ని పాదసూచికలో ఉంచింది.
- source_word: נֹשִׁים בָּהֶם
  choice: వారికి … అప్పుగా ఇస్తున్నాం
  rationale: రుణదాతలుగా వ్యవహరించడం అనే భావాన్ని ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది; అప్పు వసూలు చేయడం అనే బలమైన భావసాధ్యతను పాదసూచికలో నిలుపుతుంది.
- source_word: כֶּסֶף וְדָגָן
  choice: డబ్బూ ధాన్యమూ
  rationale: כֶּסֶף అక్షరార్థంగా వెండి అయినా, రుణ సందర్భంలో ‘డబ్బు’ ఆర్థిక భావాన్ని సహజంగా అందిస్తుంది.
- source_word: נַעַזְבָה נָּא
  choice: దయచేసి … మనం ఇక వదిలేద్దాం
  rationale: సమూహాన్ని ఉద్దేశించిన కోహోర్టేటివ్ విజ్ఞప్తిని, נָא ఇచ్చే వినయపూర్వక బలంతో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: הַמַּשָּׁא הַזֶּה
  choice: ఈ భారాన్ని
  rationale: ఆర్థిక అణచివేతను సూచించే ‘భారం’ రూపకాన్ని నిలుపుతుంది; ‘వసూలు’ లేదా ‘అప్పు’ అనే సందర్భార్థాలను పాదసూచికలో ఇస్తుంది.
