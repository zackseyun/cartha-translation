source:
  edition: WLC
  text: וְ֠/גַם בִּ/מְלֶ֜אכֶת הַ/חוֹמָ֤ה הַ/זֹּאת֙ הֶחֱזַ֔קְתִּי וְ/שָׂדֶ֖ה לֹ֣א קָנִ֑ינוּ וְ/כָל נְעָרַ֔/י קְבוּצִ֥ים שָׁ֖ם עַל הַ/מְּלָאכָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/016.yaml
  text: And I also applied myself to the work on this wall[a], and we did not buy any field[b], and all my young men were gathered there for the work.
translation:
  language: te
  text: నేను కూడా ఈ గోడ పనిలో నిమగ్నమయ్యాను[a]. మేము ఏ పొలాన్నీ కొనలేదు. నా సేవకులందరూ[b] ఆ పని కోసం అక్కడ సమకూడి ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఈ గోడ పనిని నేను చేపట్టాను,” అంటే నేను వ్యక్తిగతంగా ఈ పనిలో పాల్గొన్నాను.
    reason: lexical_alternative
  - marker: b
    text: “సేవకులు” అని అనువదించిన హీబ్రూ పదానికి “యువకులు” లేదా “పరిచారకులు” అనే అర్థాలు కూడా ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: అంతేకాదు
  rationale: ముందటి సందర్భానికి ఈ మాటను జోడించే וְగַם భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: בִּמְלֶאכֶת הַחוֹמָה הַזֹּאת
  choice: ఈ ప్రాకారం పనిలో
  rationale: మְלָאכָהను ‘పని’గా, הַחוֹמָה הַזֹּאתను సందర్భానుకూలంగా ‘ఈ ప్రాకారం’గా నేరుగా అందిస్తుంది; మూలంలో లేని ‘పట్టణ’ అనే పదాన్ని చేర్చదు.
- source_word: הֶחֱזַקְתִּי
  choice: నేను స్వయంగా నిమగ్నమయ్యాను
  rationale: ఈ సందర్భంలో חזק హిఫీల్ రూపం పనిని చేపట్టి దానిలో వ్యక్తిగతంగా శ్రద్ధతో పాల్గొనడాన్ని సూచిస్తుంది. ‘స్వయంగా నిమగ్నమయ్యాను’ ఆ భావాన్ని సహజంగా ఇస్తుంది; అక్షరార్థ ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: וְשָׂדֶה לֹא קָנִינוּ
  choice: మేము ఏ పొలాన్నీ కొనలేదు
  rationale: קָנִינוּలోని ప్రథమ పురుష బహువచనాన్ని ‘మేము’గా నిలుపుతూ, ఏకవచన שָׂדֶהను ప్రతికూల వాక్యంలో సహజంగా ‘ఏ పొలాన్నీ’ అని అనువదిస్తుంది.
- source_word: נְעָרַי
  choice: నా సేవకులందరూ
  rationale: నెహెమ్యాకు చెందిన సిబ్బందిని సూచించే సందర్భంలో נַעַרకు ‘సేవకుడు’ సహజమైన భావం. పదంలోని ‘యువకులు/పరిచారకులు’ అనే సాధ్యమైన అర్థభేదాన్ని పాదటిప్పణిలో కాపాడాం.
- source_word: קְבוּצִים שָׁם עַל הַמְּלָאכָה
  choice: ఆ పని కోసం అక్కడ సమకూడి ఉన్నారు
  rationale: కְבוּצִים యొక్క సమకూడి ఉన్న స్థితిని, שָׁםను, עַל הַמְּלָאכָהలోని పని నిమిత్తం/పనిలో నియామకం అనే భావాన్ని స్పష్టంగా నిలుపుతుంది.
