  text: There arose a great outcry from the people and their wives against their Jewish brothers[a].
translation:
  language: te
  text: ప్రజల నుండీ వారి భార్యల నుండీ తమ యూదులైన సోదరులపై గొప్ప మొర వినిపించింది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యూదయకు చెందిన తమ సోదరులపై.” హీబ్రూ పదం సందర్భాన్ని బట్టి యూదుల జాతి-మత గుర్తింపునుగానీ, యూదయ ప్రాంతానికి చెందినవారినిగానీ సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּהִי
  choice: మొరపెట్టుకున్నారు
  rationale: హీబ్రూ కథనంలో కొత్త పరిస్థితి తలెత్తినదాన్ని తెలిపే నిర్మాణాన్ని తెలుగులో సహజమైన క్రియారూపంతో వ్యక్తం చేశాం; మూలంలో లేని ప్రత్యేక కాలసూచక పదాన్ని చేర్చలేదు.
- source_word: צַעֲקַת
  choice: మొరపెట్టుకున్నారు
  rationale: ఈ పదం బాధతో కూడిన కేకను లేదా అన్యాయానికి వ్యతిరేకమైన బహిరంగ నిరసనను సూచిస్తుంది. ‘మొరపెట్టుకున్నారు’ ఈ సందర్భంలోని బాధనూ ఫిర్యాదు స్వభావాన్నీ సహజంగా తెలియజేస్తుంది.
- source_word: הָעָם
  choice: ప్రజలు
  rationale: సమాజంలోని ప్రజలను విస్తృతంగా సూచించే సరళమైన, అతివ్యాఖ్యానం లేని పదం.
- source_word: וּנְשֵׁיהֶם
  choice: వారి భార్యలు
  rationale: బహువచన నిర్మాణంలో ఈ పదానికి ఇక్కడ సహజమైన అర్థం ‘వారి భార్యలు’; మహిళలు కూడా ఈ మొరలో పాలుపంచుకున్నారనే మూలపాఠంలోని స్పష్టతను నిలుపుతుంది.
- source_word: גְּדוֹלָה
  choice: పెద్దగా
  rationale: మొర తీవ్రతను, పరిమాణాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: אֶל
  choice: వ్యతిరేకంగా
  rationale: ప్రాథమికంగా ‘వైపు/యొద్దకు’ అనే భావం ఉన్నా, ఫిర్యాదు లక్ష్యాన్ని సూచించే ఈ సందర్భంలో ‘వ్యతిరేకంగా’ అనేది సందర్భోచితమైన అర్థం.
- source_word: אֲחֵיהֶם
  choice: తమ ... సోదరులకు
  rationale: మూలంలోని ‘వారి సోదరులు’ అనే బంధుత్వ-సమాజ ఐక్యత భాషను నిలుపుతూ, తెలుగులో కర్తను తిరిగి సూచించడానికి ‘తమ’ వాడాం.
- source_word: הַיְּהוּדִים
  choice: యూద
  rationale: ఇక్కడ సమాజంలోని జాతి-మత గుర్తింపును సహజంగా తెలియజేస్తుంది; ప్రాంతీయ భావాన్ని నొక్కిచెప్పే ‘యూదయ’ అనే ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
theological_decisions:
- issue: יְהוּדִים అనే సమూహ గుర్తింపు పదం
  choice: యూద సోదరులు
  alternative: యూదయ సోదరులు
  rationale: నెహెమ్యా 5లో ఒకే నిబంధన సమాజంలోని సభ్యుల మధ్య జరిగిన అన్యాయం ప్రధానాంశం. ‘యూద సోదరులు’ ఆ అంతర్గత సమాజ ఐక్యతను స్పష్టంగా తెలియజేస్తుంది; చారిత్రక-ప్రాంతీయ భావం సాధ్యమైనందున ప్రత్యామ్నాయాన్ని పాదసూచికలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే గౌరవప్రదమైన శైలి. హీబ్రూ నామవాచక నిర్మాణాన్ని తెలుగులో సహజమైన క్రియారూపంగా మార్చినా, ప్రజలు మరియు వారి భార్యలు ఇద్దరూ మొరపెట్టుకున్నారనే భావాన్నీ, మొర తీవ్రతనూ, దాని లక్ష్యాన్నీ నిలిపాం.
