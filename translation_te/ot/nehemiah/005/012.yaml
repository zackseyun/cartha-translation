translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన కథన శైలి వాడబడింది. ఆర్థిక సందర్భాన్ని స్పష్టం చేయడానికి ‘వసూలు చేయము’ ఎంచుకున్నాం; అయితే హీబ్రూలో లేని నిర్దిష్టమైన వడ్డీ లేదా అప్పు అనే కర్మను చేర్చలేదు. ‘మాట’ అనే మూలానికి దగ్గరైన పదాన్ని ప్రధాన పాఠ్యంలో ఉంచి, దాని సందర్భార్థ విస్తృతిని పాదసూచికలో సంరక్షించాం.
