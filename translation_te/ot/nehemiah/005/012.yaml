  yaml_path: translation/ot/nehemiah/005/012.yaml
  text: And they said[a], “We will restore it, and from them we will require nothing; we will do as you say.” Then I called the priests and made them swear to do according to this word.
translation:
  language: te
  text: అప్పుడు వారు, “మేము తిరిగి ఇస్తాం; వారి దగ్గర ఇంకేమీ వసూలు చేయము. మీరు చెప్పినట్టే చేస్తాం” అన్నారు. అప్పుడు నేను యాజకులను పిలిపించి, ఈ మాట ప్రకారం చేయాలని వారితోను[a] ప్రమాణం చేయించాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఈ విషయం ప్రకారం” లేదా “ఈ నిబద్ధత ప్రకారం.” హీబ్రూ పదం דָּבָר కు “మాట,” “విషయం” అనే అర్థాలు ఉన్నాయి; ఈ సందర్భంలో ప్రమాణంతో బలపరచబడిన నిబద్ధతను కూడా అది సూచించవచ్చు. “వారితోను” అనే పదం యాజకులను గానీ, ముందుగా మాట్లాడిన నాయకులను గానీ సూచించే అవకాశం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָשִׁיב
  choice: మేము తిరిగి ఇచ్చేస్తాం
  rationale: שׁוב హిఫీల్ రూపం ఇక్కడ తీసుకున్నదాన్ని తిరిగి ఇవ్వడం అనే పరిహార భావాన్ని ఇస్తుంది. హీబ్రూలో కర్మ సూచింపబడలేదు; ముందటి వచనాల సందర్భం దానిని స్పష్టం చేస్తున్నందున తెలుగులోనూ అదనపు కర్మను చేర్చలేదు.
- source_word: וּמֵהֶם לֹא נְבַקֵּשׁ
  choice: వారి దగ్గర ఇంకేమీ వసూలు చేయము
  rationale: בקשׁ పదానికి వెదకడం, అడగడం, కోరడం, రాబట్టడం వంటి అర్థాలున్నాయి. అప్పులు, వడ్డీ, ఆస్తుల పునరుద్ధరణ అనే ఆర్థిక సందర్భంలో ‘వసూలు చేయము’ అనేది వారి మీద ఇక ఎలాంటి ఆర్థిక హక్కును అమలు చేయబోమనే భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: כֵּן נַעֲשֶׂה כַּאֲשֶׁר אַתָּה אוֹמֵר
  choice: మీరు చెప్పినట్టే చేస్తాం
  rationale: כֵּן లోని సమ్మతి, כַּאֲשֶׁר లోని పోలిక రెండూ ‘చెప్పినట్టే’ అనే సహజమైన తెలుగు ప్రయోగంలో నిలిచాయి.
- source_word: וָאֶקְרָא אֶת־הַכֹּהֲנִים
  choice: అప్పుడు నేను యాజకులను పిలిపించి
  rationale: קרא ఇక్కడ పిలవడం లేదా రప్పించడం అనే అర్థంలో ఉంది. కథన క్రమాన్ని וַ సూచిస్తున్నందున ‘అప్పుడు’ వాడబడింది.
- source_word: וָאַשְׁבִּיעֵם
  choice: వారిచేత ప్రమాణం చేయించాను
  rationale: שׁבע హిఫీల్ రూపం ఇతరులతో ప్రమాణం చేయించడం అనే కారణార్థక భావాన్ని ఇస్తుంది. ‘వారు’ అనేది సహజంగా ఇప్పుడే వాగ్దానం చేసిన నాయకులను సూచిస్తుంది; యాజకులు ప్రమాణానికి సాక్షులుగా లేదా దాన్ని నిర్వహించేవారిగా పిలువబడ్డారు.
- source_word: לַעֲשׂוֹת כַּדָּבָר הַזֶּה
  choice: ఈ మాట ప్రకారం చేయాలని
  rationale: כְּ ఉపసర్గలోని ‘ప్రకారం’ భావాన్ని నిలిపి, דָּבָר ను ప్రాథమికంగా ‘మాట’గా అనువదించాం. సందర్భంలో అది వారు చేసిన ప్రకటన లేదా నిబద్ధతను కూడా సూచించగలదని పాదసూచికలో తెలిపాం.
