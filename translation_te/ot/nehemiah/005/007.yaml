  edition: WLC
  text: וַ/יִּמָּלֵ֨ךְ לִבִּ֜/י עָלַ֗/י וָ/אָרִ֨יבָ/ה֙ אֶת הַ/חֹרִ֣ים וְ/אֶת הַ/סְּגָנִ֔ים וָ/אֹמְרָ֣/ה לָ/הֶ֔ם מַשָּׁ֥א אִישׁ בְּ/אָחִ֖י/ו אַתֶּ֣ם נשאים וָ/אֶתֵּ֥ן עֲלֵי/הֶ֖ם קְהִלָּ֥ה גְדוֹלָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/007.yaml
  text: Then I took counsel with myself[a], and I brought charges against the nobles and the officials, and I said to them, “You are exacting interest[c][b], each from his brother.” And I assembled a great assembly against them.
translation:
  language: te
  text: అప్పుడు నేను నాలో నేను ఆలోచించుకొని, ప్రముఖులను, అధికారులను నిలదీశాను[a]. వారితో, “మీరు ప్రతి ఒక్కరూ మీ సహోదరుని నుండి వడ్డీ[b] వసూలు చేస్తున్నారు” అన్నాను. తరువాత వారికి వ్యతిరేకంగా ఒక పెద్ద సభను ఏర్పాటు చేశాను[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ప్రముఖులపైనా అధికారులపైనా అభియోగం మోపాను.” ఇక్కడి హీబ్రూ క్రియకు వాదించడం, ఎదిరించడం లేదా న్యాయపరంగా అభియోగం మోపడం అనే భావాలు ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “అప్పుభారం.” ఈ సందర్భంలో హీబ్రూ పదం రుణంపై విధించే వడ్డీని లేదా దానివల్ల కలిగే భారాన్ని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: హీబ్రూ వాక్యానికి అక్షరార్థం, “వారికి వ్యతిరేకంగా ఒక పెద్ద సభను పెట్టాను.” అంటే వారిని బహిరంగంగా ఎదుర్కొనేందుకు పెద్ద సభను సమకూర్చాను.
    reason: idiom_clarification
lexical_decisions:
- source_word: וַיִּמָּלֵךְ לִבִּי עָלַי
  choice: నేను నాలో నేను ఆలోచించుకొని
  rationale: ఈ నిఫాల్ ప్రయోగం నెహెమ్యా తనలో తాను ఆలోచించి నిర్ణయించుకున్నాడనే భావాన్ని ఇస్తుంది; ముందటి వచనంలోని కోపాన్ని ఇక్కడ మళ్లీ చేర్చదు.
- source_word: וָאָרִיבָה
  choice: నిలదీశాను
  rationale: ריב అనే క్రియలో వాదించడం, ఎదిరించడం, అభియోగం మోపడం వంటి భావాలు ఉన్నాయి. ఈ సందర్భంలో నాయకులను బహిరంగంగా ప్రశ్నించి తప్పుపట్టిన చర్యను ‘నిలదీశాను’ సహజంగా తెలియజేస్తుంది; న్యాయపరమైన భావసూచనను పాదసూచికలో ఉంచాం.
- source_word: הַחֹרִים
  choice: ప్రముఖులు
  rationale: యూదా సమాజంలోని ఉన్నత స్థాయి వర్గాన్ని సూచించే పదం. ఆధునిక తెలుగులో ‘ప్రముఖులు’ సహజంగా, గౌరవప్రదంగా ఉంటుంది.
- source_word: הַסְּגָנִים
  choice: అధికారులు
  rationale: పాలనా బాధ్యతలు నిర్వహించే అధికారులను సూచిస్తుంది; ఖచ్చితమైన పరిపాలనా హోదాను అనవసరంగా నిర్దేశించదు.
- source_word: מַשָּׁא
  choice: వడ్డీ
  rationale: రుణాల సందర్భంలో విధించే ఆర్థిక భారాన్ని సూచిస్తుంది. ‘వడ్డీ’ ఆధునిక పాఠకులకు స్పష్టమైన పదం; ‘అప్పుభారం’ అనే సాధ్యమైన భావాన్ని పాదసూచికలో నిలుపుకున్నాం.
- source_word: אִישׁ בְּאָחִיו
  choice: మీలో ప్రతి ఒక్కరూ తమ సహోదరుని నుంచి
  rationale: אישׁ యొక్క విభజక భావాన్నీ, אחיו లోని ఇశ్రాయేలీయ సహోదరత్వ భాషనూ కాపాడుతుంది.
- source_word: נשאים
  choice: వసూలు చేస్తున్నారు
  rationale: ఈ సందర్భంలో వడ్డీ లేదా రుణభారాన్ని విధించి తీసుకోవడాన్ని సూచిస్తుంది. తెలుగులో ‘వడ్డీ వసూలు చేయడం’ సహజమైన ప్రయోగం.
- source_word: וָאֶתֵּן עֲלֵיהֶם קְהִלָּה גְדוֹלָה
  choice: వారికి వ్యతిరేకంగా ఒక పెద్ద సభను ఏర్పాటు చేశాను
  rationale: נתן యొక్క అక్షరార్థం ‘పెట్టడం/ఇవ్వడం’ అయినా, ఇక్కడ పెద్ద ప్రజాసభను వారి ఎదుట లేదా వారికి వ్యతిరేకంగా సమకూర్చడం అనే నుడికార భావం ఉంది.
